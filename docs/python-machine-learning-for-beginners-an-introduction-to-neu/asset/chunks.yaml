- raw: 'Chapter 1:An introduction to python machine learning ![](rsrc3D.jpg)Machine
    learning is both the application and the science of algorithms that can make some
    sense out of data. It is an incredibly exciting part of the computer sciences
    arena and, like it or not, it’s here to stay. The world today is full of data
    and using algorithms that have the capacity to learn. This means that this data
    can be used to create knowledge. In the last few years, there have been quite
    a few open-source libraries developed, some of them incredibly powerful, and that
    means we are probably at the peak time to start truly understanding machine learning,
    to start learning how to use these algorithms to find data patterns and predict
    future events.  Do you remember when you got your first computer? For most people,
    the device was so foreign to them they couldn’t even understand what they were
    supposed to do with it. No doubt, for many people, they still wanted one even
    if they had no idea what its true purpose was. Even today, there are numerous
    people who have found computers nothing more than a great device for playing games,
    binge-watching their favorite TV shows, or streaming their favorite music.  But
    you can do so many amazing things if you know how to tap into the true potential
    of these wonderful devices. Once a person knows what to do with modern day machines,
    things begin to change in very big ways. We can easily take a task and go beyond
    the basics. When that happens, computers become far more than a glorified calculator
    that can decipher calculations and numbers in a fraction of a second. To get to
    that point there are a few things that you must understand.  Machines now do not
    need to have every detail of their functions automatically programmed. They can
    be programmed to learn a number of tasks and make the necessary adjustments to
    perform the functions that will allow them to work more efficiently.  Frankly,
    there are certain computer functions that many assume to be advanced technology
    but are merely things that can be done very quickly. For example, at the heart
    of every computer is a very complex calculator. When the computer performs an
    action we think is fascinating, it is merely the machine performing a number of
    mathematical equations to produce the results we desire.  You might want to stream
    your favorite movie to your computer. You click a few buttons and in a matter
    of seconds, scenes begin to play out in front of your eyes. Really, this function
    is nothing more than the computer running a bunch of basic math problems in the
    background, taking the sums and reconstructing them into a video on your screen. 
    This may seem like science fiction but the possibility is all too real, thanks
    to the creation of neural networks. In its simplest of terms, neural networks
    are a series of mathematical formulas called algorithms that identify relationships
    in a group of data. The network can accomplish this by mimicking the human brain
    and how it works.   These are complicated networks that are capable of adapting
    to constantly changing data so that it can achieve the best results possible without
    having to redesign the criteria needed to get the optimum output.  To put it more
    simply, neural networks are the means of injecting flexibility into a computer
    system so that it processes data in a way that is similar to how the human brain
    works. Of course, computers are still going to be made in the same way as other
    machines but with each improvement, they are getting closer and closer to thinking
    machines rather than devices that are strictly following a static set of instructions.  
    Before we can fully understand neural networks, we have to get a firm grasp on
    what we mean when we talk about a machine that can learn. We are not talking about
    giving machines textbooks, homework, and exams so they can learn in the same way
    a student does. That would be ridiculous, but it helps to see just how a computer
    can mimic the human brain. So, let’s look at how the human brain works first and
    make a comparison.  When a human being absorbs new information, they usually gain
    the information from something they’re not familiar with. It could come in the
    form of a question or a statement of something new, or it could come as an experience
    with no verbal connection whatsoever. The information is picked up through the
    body’s five senses and transmitted directly to the brain. The brain then reshuffles
    a number of its neural pathways (we call this thinking) so it can process the
    information and then when all the details related to the information is compared
    and analyzed in the brain, an answer or a conclusion is drawn and instructions
    are sent out to the rest of the body.  Since computers don’t really think, they
    have to accomplish the same goal but in a different way. Information is inputted
    into the computer’s programming, it is then processed, calculated, and analyzed
    based on a number of preset algorithms, and then a conclusion, prediction, or
    answer is drawn and it comes out as output.   Let’s look at an example. Let’s
    say you want to figure out the answer to the problem 9 - 8. This is a basic math
    question that will require you to ‘think’ in order to get the right answer. While
    we will do this very quickly, we need to understand what is happening in our brain
    so we can see the similarity with computers.     When we receive information,
    our senses automatically send all the data relating to it to the brain. The brain
    is made up of billions of neurons that are all interconnected, creating miles
    upon miles of pathways where information can travel. What’s really neat about
    our brain is that these pathways are constantly shifting based on the data that
    is being transmitted. When new information is received, they will shift to create
    new pathways to transmit it to where it needs to go in the brain. Throughout this
    process, this shifting will continue until a solution is decided upon. Then instructions
    are sent throughout the body’s central nervous system to different parts of the
    body instructing them on the proper way to respond to the information received.
    The brain accomplishes all of this in fractions of a second.  In a neural network,
    the same thing happens. While these networks cannot perfectly mimic the inner
    workings of the brain, the process is very similar. The information is taken in
    and the neural network does all the work of consuming data, processing it, and
    coming up with a workable solution. These networks allow the computer to ‘learn’
    by using algorithms.  Turning Data into Knowledge  We live in a modern world filled
    with technology. Every day, we hear that the planet is being stripped of its resources
    but there is one resource that continues to grow, a resource that we have plenty
    of – data, both structured and unstructured. In the last 50 years of the 20th
    century, machine learning began to evolve. It was an AI subfield that used algorithms
    that could learn; algorithms that could derive knowledge from the data and use
    this knowledge to make predictions for the future. Where once a human being would
    have been needed to manually make the rules and build the models by analyzing
    vast amounts of data, machine learning does it much quicker and more efficiently.
    Machine learning allows us to capture the data, turn it into knowledge, and make
    improvements to how predictive modeling performed; the result of this is decisions
    driven by data.  So, you can see how important machine learning is in terms of
    computer sciences research, but do you realize just how often it features in everyday
    life? Think about the strong spam filters on your email, voice recognition on
    your computers and mobile devices, convenient text, decent search engines on the
    web, computerized Chess games and, in the future, safe self-drive cars. All of
    this is thanks to the advances made in machine learning. Algorithms No doubt,
    you’ve heard the term before. It is often associated with all sorts of technical
    mechanics but in recent years algorithms are being used in the development of
    automatic learning, the field that is leading us to advancements in artificial
    and computational intelligence. This is a method of analyzing data in a way that
    makes it possible for machines to analyze and process data. With this type of
    data, computers can work out and perform a number of tasks it could not originally
    do. They can understand different concepts, make choices, and predict possibilities
    for the future.   To do this, the algorithms have to be flexible enough to adapt
    and make adjustments when new data is presented. They are therefore able to give
    the needed solution without having to create a specific code to solve a problem.
    Instead of programming a rigid code into the system, the relevant data becomes
    part of the algorithm which in turn, allows the machine to create its own reasoning
    based on the data provided.  How does this work? This might sound a little confusing
    but we’ll try to break this down into certain examples you can relate to. One
    of the ‘learning’ functions of machines is the ability to classify information.
    To do this, the input data can be a mix of all types of information. The algorithm
    needs to identify the different elements of the data and then group them into
    several different categories based on characteristics of similarities, differences,
    and other factors. These characteristics can be any number of things ranging from
    identifying handwriting samples to the types of documents received. If this were
    code, the machine could only do one single function but because it is an algorithm
    which can be altered to fit a wide variety of things, the computer can receive
    this data and classify all sorts of groups that fit within the specific parameters
    of the circumstances.  This is how machines can change their functions to adapt
    to the situation at hand. Your email account can analyze all the emails you received,
    based on a pattern that you have followed, and it divides them into different
    groups. It can identify which emails are important and you should see right away,
    those that are spam and junk mail, and even sort out those that may pose a risk
    to your computer because it carries a virus or malware.  With these types of algorithms,
    machines can now learn by observing your habits and patterns and adjust their
    behavior accordingly. So, the very secret to a successful and effective neural
    pathway depends a great deal on the algorithms your system uses.  Three Types
    of Machine Learning   Without algorithms, machines cannot learn. So, over the
    years many different ones have been developed. In this part of the chapter, we
    will look in detail at the three machine learning types. They are:  ●      Supervised
    learning ●      Unsupervised learning ●      Reinforcement Learning We’ll describe
    the basic differences between the three and explain the practicalities of applying
    the principles.  Supervised Learning – Predicting the Future   A supervised algorithm
    requires a detailed input of related data over a period of time. Once all the
    information is available to the computer, it is used to classify any new data
    relating to it. The computer then does a series of calculations, comparisons,
    and analysis before it makes a decision.  This type of algorithm requires an extensive
    amount of information to be programmed into the system so that the computer can
    make the right decision. That way, when it needs to solve a problem, it will attempt
    to determine which mathematical function it needs to use in order to find the
    correct solution. With the right series of algorithms already programmed into
    the system, the machine can sift through all types of data in order to find the
    solution to a wide variety of problems in the related category.  Supervised algorithms
    are referred that way because they require human input to ensure that the computer
    has the right data to process the information it receives.  Supervised learning
    has one basic goal – to learn a specified model from “labeled” data for training
    purposes so that predictions can be made about future data or unseen data. It
    is called “supervised” because the labels, or the output signals that we want,
    are known already.  Think about your email, about the spam filter in place. We
    could use supervised machine learning to train a model. The data would be labeled
    – emails already marked correctly as spam, those marked correctly as not spam
    – and the model would be trained to recognize to which group new emails belong.
    When you have supervised tasks such as this, using class labels, we call it a
    “classification task”.  Predicting Class Labels Using Classification So, classification
    is a subcategory with a goal of predicting under which class label new instances
    would be placed. This is based on previous data. The labels are discrete with
    values in no order that can be understood to be memberships of the instances.
    The example of spam filters is representative of a binary type of classification
    task – the algorithm will learn the rules so that it can work out the difference
    between potential classes – spam and not spam.  Although this is a binary classification
    task, the class labels are not required to be binary in nature. The learning algorithm
    will determine a predictive model that can then assign any of the labels from
    the dataset to a new instance that has no label. One example of this type of multiclass
    classification is the recognition of handwritten characters. We could have a dataset
    that has the letters of the alphabet written in several different handwriting
    styles. If the user were to use an input device to give a new character, the predictive
    model could predict which letter of the alphabet it was with accuracy. However,
    the system could not recognize any digit from 0 to 9 because they would not be
    in the dataset used for training purposes.  Let’s say that we have 30 pieces of
    sample data – 15 of them are labeled as a positive class with a plus sign (+)
    and 15 are labeled as a negative class with a minus sign (-). The dataset is called
    a two-dimensional dataset, meaning that each of the samples has two possible values,
    x1 and x2. Supervised learning algorithms could be used to learn the rule that
    a dashed line is used to represent the decision boundary and this rule is used
    to separate the classes and put any new data into one of the categories depending
    on the x1 and x2 values. Continuous Outcome Prediction Using Regression We know
    now that classification tasks are used for assigning unordered, categorical labels
    to instances. There is another type of supervised learning called regression analysis,
    and this is used for the prediction of continuous outcomes. With regression analysis,
    we have several explanatory or predictor variables, along with a variable for
    a continuous response. We can predict outcomes by finding relationships between
    the variables.  Let me give an example. We have a class of students and we want
    to try to predict their SAT scores. If we can find a link between how long each
    student studied and their scores, we could then use that data to learn models
    that can use the length of time studied to predict the score achieved by future
    students.  Reinforcement Learning – Solving Interactive Problems Reinforcement
    Learning is another area of machine learning and the goal here is to develop an
    agent or system that can improve its performance. This improvement is based on
    how the agent interacts with its environment. Information that details the current
    environmental state tends to include a reward-signal, so this kind of machine
    learning can be considered a part of supervised learning. However, the feedback
    in Reinforcement Learning is not the right value or truth label; rather, it is
    an indication of how the reward function related to the action. By interacting
    with its environment, the agent learns several actions to maximize the reward.
    By using Reinforcement Learning, the agent will go through an approach of either
    deliberate planning or trial and error to get the reward.  Reinforcement learning
    is commonly used in video games where the computer must navigate and adjust its
    movements in order to win the game. A reward system is used so the computer knows
    and understands when it should make the right move, but there are also negative
    consequences whenever they make errors. This type of algorithm works best in situations
    where the computer has an obstacle that it must overcome like a rival in a game,
    or it could also be a self-driving car that needs to reach its destination. The
    entire focus of the computer is to accomplish certain tasks while navigating the
    unpredictable environment around it. With each mistake, the computer will readjust
    its moves in order to reduce the number of errors so it can achieve the desired
    result. A Chess engine is a great example of this type of machine learning. The
    agent will decide on the moves it will make, dependent on the environment (the
    board) and the reward is defined as winning or losing when the game is over. 
    Reinforcement Learning has a number of subtypes but, in general, the agent will
    carry out several environmental interactions in an attempt to get the maximum
    reward. Each of the states is associated with a negative or a positive reward
    – the reward is defined by achieving a specific goal, in this case, losing or
    winning the game of Chess. For example, in a game of Chess, the outcome of a move
    is a state of that environment.  Let’s go a bit deeper into this. Take the locations
    of each square on the Chessboard. Visiting them could be given a positive reward
    association – you take an opponent’s piece or put his king or queen under threat,
    for example. Other locations have a negative reward association – losing one of
    your pieces by having your own king or queen put under threat in the next turn.
    Not every game turn will end with a piece being removed from the board so where
    does Reinforcement Learning come into this? Quite simply, it is about learning
    the series of steps that are needed by ensuring the maximum reward based on feedback
    – immediate and delayed.  This really is as far as we can go on Reinforcement
    Learning. We can only give you a basic overview because applications for this
    type of learning are way beyond the scope of this guide which is focusing on clustering,
    classification, and regression analysis. Unsupervised Learning – Discovering Hidden
    Structures With supervised learning, we already know the answer we want when the
    model is being trained. With Reinforcement Learning, we provide a reward measured
    by specific actions performed by the agent. With unsupervised learning, we are
    going one step further by using unlabeled data – data with unknown structure.
    By using these techniques, we can explore the data structure to get meaningful
    information without needing to be guided by a reward or by a variable with a known
    outcome.  An unsupervised algorithm implies that the computer does not have all
    the information to make a decision. Maybe it has some of the data needed but one
    or two factors may be missing. This is kind of like the algebra problems you encountered
    in school. You may have two factors in the problem but you must solve the third
    on your own. A + b = c. If you know A but you have no idea what b is then you
    need to plug the information into an equation to solve the problem. With unsupervised
    learning, this can be an extremely complex type of problem to solve. For this
    type of problem, you’ll need an algorithm that recognizes various elements of
    a problem and can incorporate that into the equation. Another type of algorithm
    will look for any inconsistencies in the data and try to solve the problem by
    analyzing those.  Unsupervised algorithms clearly are much more complex than the
    supervised algorithms. While they may start with some data to solve a problem,
    they do not have all the information so they must be equipped with the tools to
    find those missing elements without having a human to provide all the pieces of
    the puzzle for them. Use Clustering to Find Subgroups Clustering is a technique
    of exploratory data analysis which lets us organize a great amount of data into
    subgroups or clusters. We do not have any upfront knowledge about the group memberships.
    Each of the clusters identified from the analysis will define a specific group
    of objects that are similar to a certain degree but are not quite so similar to
    objects that are in the other clusters. This is why you often hear clustering
    being termed as “unsupervised classification”. Clustering is absolutely one of
    the best techniques we have for providing a structure to a set of information
    and determining meaningful relationships from the information. For example, think
    of marketers. They can use clustering to determine specific customer groups by
    their interests so that they can devise a targeted marketing program. Dimensionality
    Reduction This is another subfield of the unsupervised machine learning area.
    More often than not, high-dimensionality data is used. This means that each observation
    has several measurements. This presents a bit of a challenge where storage space
    is limited and affects the performance of the learning algorithms. Dimensionality
    reduction, in terms of unsupervised machine learning, is used quite often in feature
    preprocessing, to remove the noise from the data. This noise can cause degradation
    in the predictive performance of some algorithms. It is also commonly used to
    compress data so it fits into a smaller subspace while keeping the relevant information
    intact.  Occasionally, we can also use dimensionality reduction for visualizing
    data. For example, we could project a high-dimensionality feature set onto 1,
    2, or 3D feature spaces – this would allow us to see that feature set through
    2D or 3D histograms or scatterplots. Semi-supervised learning Semi-supervised
    learning is a blend of both supervised and reinforcement learning. The computer
    is given an incomplete set of data from which to work. Some of the data include
    specific examples of previous decisions made with the available data while other
    data is missing completely. These algorithms work on solving a specific problem
    or performing very specific functions that will help them achieve their goals. 
    Of course, these are not the only algorithms that can be used in a computer program
    to help the machine learning. But, the general idea is the same. The algorithm
    must fit with the problem the computer needs to solve.   '
