    # 第一章：Python 机器学习简介 ![](img/rsrc3D.jpg)


    机器学习既是能够从数据得出意义的算法的应用，也是一门科学。它是计算机科学领域一个极令人兴奋的部分，无论你是否认同，它都会一直存在。当今世界充满了数据，并且使用了具有学习能力的算法。这意味着这些数据可以被用来创造知识。在过去的几年里，已经开发了许多开源库，其中一些非常强大，这意味着我们可能正处于开始真正理解机器学习的最佳时期，开始学习如何使用这些算法来发现数据模式并预测未来事件。


    你还记得你获得第一台电脑的时候吗？对于大多数人来说，那个设备对他们来说如此陌生，以至于他们不知道该用它做什么。毫无疑问，对于许多人来说，即使不知道它的真实用途，他们仍然想要一台。即使在今天，仍许多人发现电脑只不过是一个玩游戏、狂看喜欢的电视节目或流媒体心仪音乐的绝佳设备。但如果你知道如何挖掘这些妙设备的真正潜力，你可以做很多惊人的事情。一旦一个人知道该如何操作现代机器，事情就会开始发生巨大的变化。我们可以轻松地处理一项任务并超越基础。当这种情况发生时，计算机就远比一个能在几秒内破解计算和数字的华丽计算器要有用得多。要达到这一点，你必须理解几点。


    机器现在不需要自动编写其功能的每一个细节。它们可以被编程为学习许多任务，并进行必要的调整以执行功能，从而使其工作得更高效。坦率地说，许多人认为某些计算机功能是先进技术，实际上只是可以很快完成的内容。例如，每台电脑的核心都是一个非常复杂的计算器。当计算机执行我们认为迷人的操作时，它只是机器在执行许多数学方程以产生我们想要的结果。你可能想把喜欢的电影流到电脑上。你点击几个按钮，几秒钟后，场景就开始在你眼前播放。实际上，这个功能只不过是计算机在后台运行一系列基础数学题，计算总和并将它们重构为屏幕上的视频。


    这听起来像科幻小说，但由于神经网络的创建，这种可能性是完全真实的。简单来说，神经网络是一系列称为算法的数学公式，用于识别一组数据中的关系。网络可以通过模拟人类大脑及其工作方式来实现这一点。这些是复杂的网络，能够适应不断变化的数据，以便在不需要重新设计获得最佳输出所需的标准的情况下，获得尽可能好的结果。更简单地说，神经网络向计算机系统注入灵活性的手段，使其处理数据的方式类似于人类大脑的工作方式。当然，计算机仍然将以与其他机器相同的方式制造，但随着每一次改进，它们正变得越来越接近**[我们可以通过寻找变量之间的关系来预测结果]**。让我举个例子吧。我们有一级学生，我们想要尝试预测他们的
    SAT 分数。如果我们能找到每个学生学习时长与分数之间的联系，那么我们就可以使用这些数据来学习模型，利用学习时长来预测未来学生获得的分数。


