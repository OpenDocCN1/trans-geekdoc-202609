- raw: Conclusion Thank you for making it to the end of this book. The impact of Machine
    Learning on our world is already ubiquitous. Our cars, our phones, our houses,
    and so much more are already being controlled and maintained through rudimentary
    Machine Learning systems. But in the future, Machine Learning will radically change
    the world. Some of those changes are easy to predict. In the next decade or two,
    people will no longer drive cars, instead, automated cars will drive people. But
    in many other ways, the effect of Machine Learning on our world is difficult to
    predict. Will Machine Learning algorithms replace so many jobs, from trucking
    to accounting, to many other disciplines, that there won’t be much work left for
    people? In 100 years, will there be work for anyone at all? We don’t know the
    answer to questions like this because there is so far no limit to what Machine
    Learning can accomplish, given time and data and the will to use it to achieve
    a particular task. The future is not necessarily frightening. If there is no work
    in the future, it won’t mean that things aren’t getting done. Food will still
    be grown, picked, transported to market, and displayed in stores. It’s just that
    people won’t have to do any of that labor. As a matter of fact, stores won’t be
    necessary either, since the food we order can be delivered directly to our homes.
    What will the world be like if human beings have almost unlimited leisure time?
    Is this a possible future? There is no telling where this technology will take
    us in the future. Right now it is one of the most talked about topics in the field
    of IT. This is primarily because of its amazing potential in so many areas. If
    technology continues to improve at such a rapid rate, there is a good chance that
    in the not too distant future, machines themselves will be programming other machines.
    At that point, the best question to ask is not what machines will be doing in
    the future but what will we? This book provides information on what machine learning
    is and types of machine learning. It also gives you information on the subjects
    that laid the foundation for machine learning. You will gather information on
    different algorithms used in machine learning. As a beginner, it is always good
    to practice some algorithms used in machine learning to enhance your understanding.
    There are some projects in the book that you can complete over the weekend or
    extend them if you want to. It is important to practice as much as you can to
    improve your knowledge on machine learning. It is difficult to remember the many
    words that are used in machine learning.
