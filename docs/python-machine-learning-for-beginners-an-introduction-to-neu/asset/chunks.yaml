- raw: 'Chapter 7: Optimize your machine learning systems and algorithms ![](rsrcZ5.jpg)You
    will find that with machine learning, it is important to recognize that there
    will be a relationship that will form between this process and the probability
    theory. Machine learning can be a broad field, and this means that it can intersect
    with some other fields. The fields that it interacts with will depend on the specific
    project you will work with. Probability and statistics often merge with machine
    learning so understanding how these three can work together can be important for
    your project.  There are a few different ways that statistics and the probability
    theory will be really important to the whole learning process that goes on with
    machine learning. First, you have to be able to pick out the right algorithm,
    and there are quite a few different ones that you can pick from as you will see
    later on as we progress through this book. The algorithm that you end up picking
    out needs to have a good balance of things like accuracy, training time, complexity,
    and a number of parameters. And as you work more with machine learning, you will
    notice that each project will need a different combination of these factors. 
    Using the probability theory and statistics, you can better pick out the right
    parameters for the program, the validation strategies, and make sure that you
    pick out the right algorithm for your needs. They can be helpful as well for letting
    you know what level of uncertainty is present inside of your choice so you can
    guess how much you can trust what is going on.  The probability theory and statistics
    will help you out quite a bit when it comes to working in machine learning and
    can help you to understand what is going on with the projects you are working
    on.  Looking at random variables Now, the first topic we need to look at when
    it comes to statistics is random variables. With probability theory, these random
    variables will be expressed with the “X” symbol, and it is the variable that has
    all its possible variables come out as numerical outcomes that will come up during
    one of your random experiments. With random variables, there will be either continuous
    or discrete options. This means that sometimes your random variables will be functions
    that will map outcomes to the real value inside their space. We will look at a
    few examples of this one to help it make sense later on.  We will start out with
    an example of a random variable by throwing a die. The random variable that we
    will look at will be represented by X, and it will rely on the outcome that you
    will get once the die is thrown. The choices of X that would come naturally here
    will go through to map out the outcome denoted as 1 to the value of i.  What this
    means is that if X equals 1, you would map the event of throwing a one on your
    die to being the value of i. You would be able to map this out with any number
    that is on the die, and it is even possible to take it to the next step and pick
    out some mappings that are a bit strange. For example, you could map out Y to
    make it the outcome of 0. This can be a hard process to do, and we aren’t going
    to spend much time on it, but it can help you to see how it works. When we are
    ready to write out his one, we would have the probability, which is shown as P
    of outcome 1 of random variable X. it would look like the following: PX(i) or
    (x=i) Distribution Now we need to look at what the probability distribution is
    like with this process. What we mean here is that we will look at see what the
    probability of each outcome will be for the random variable. Or, to make it simple,
    we will see how likely it is that we will get a specific number, like a six or
    a three, when we throw the die.  To get started with this, we will need to look
    at an example. We will let the X, or the random variable, be our outcome that
    we get once the diet is thrown. We will also start with the assumption that the
    die is not loaded so that all six sides will have the same probability of showing
    up each time that you throw the diet. The probability distribution for throwing
    your die and getting a specific number includes: PX(1) = PX(2) = … = PX(6) = 1/6
    In this example, it matches up to the what we did with the random variables, it
    does have a different type of meaning. Your probability distribution is more about
    the spectrum of events that can happen, while our random variable example is all
    about which variables are there. With the probability theory, the P(X) part will
    note that we are working with our probability distribution of the random variable
    X.  While looking through these examples, you can notice that your distribution
    will sometimes include two or more variables at the same time. When this happens,
    we will call it a joint distribution. Your probability will now be determined
    by each of the variables if there are more than one, that is now involved. To
    see how this process will work, let’s say that the X is random and that it is
    defined by what outcome you get when you throw the die, and the Y will be a random
    variable that will tell you what results that you get when you flip a coin. We
    will assign a 1 to this coin toss if we get heads at the end, and a 0 will show
    up if you get tails. This makes it easier when we figure out what the probability
    distribution is for both of these variables.  Independence Another variable that
    you can work with when doing machine learning is to figure out how much independence
    the problem has. When you are doing random variables, you will find that they
    will end up being independent of what the other random variables are as long as
    the variable distribution doesn’t change when a new variable is introduced to
    the equation.  You can make some assumptions about your data in machine learning
