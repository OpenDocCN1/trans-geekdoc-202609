    # Applications to IFD


    In Zhang et al. (2018), the feature extractor was pre-trained with the labeled
    source data and was used to generate target features. After that, from source
    and target domains were trained to maximize the domain discriminator loss, leading
    to distribution alignment for IFD. Classifier discrepancy (Jiao, Zhao, and Lin
    2019), which means using separate classifiers for source and target domains, was
    introduced in UDTL-IFD via an adversarial training process. Meanwhile, adversarial
    training was also combined with other metrics to better match the feature distributions
    between different domains of IFD. Li et al. (2020b) used two feature extractors
    and classifiers trained using MMD and domain adversarial training, respectively,
    and meanwhile ensemble learning was further utilized to obtain the final results.
    Qin et al. (2020) proposed a multiscale transfer voting mechanism (MSTM) to improve
    the classical domain adaptation methods and the verified model was trained by
    MMD and domain adversarial training.


    Wasserstein distance was used by Cheng et al. (2020) to guide adversarial training
    for aligning the discrepancy of distributions for IFD. Yu et al. (2020) combined
    conditional adversarial DA with a center-based discriminative loss to realize
    both distribution discrepancy and feature discrimination for locomotive fault
    diagnosis.'
