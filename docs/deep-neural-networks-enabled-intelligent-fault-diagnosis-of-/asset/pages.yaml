    \arg \min_0 \int q(\Lambda|\theta)\log \frac{q(\Lambda|\theta)}{P(\Lambda|D_{val},
    H(w^*))} d\Lambda$

    = \arg \min_0 \int q(\Lambda|\theta)\log \frac{q(\Lambda|\theta)P(D_{val}, H(w^*))}{P(\Lambda)P(D_{val},
