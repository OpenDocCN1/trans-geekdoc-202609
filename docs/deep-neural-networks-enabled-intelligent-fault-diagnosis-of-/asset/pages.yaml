    own or use the same feature data, which makes FTL suitable for more application
    scenarios.

    FTL was used in IFD (Zhang and Li 2021) and for in-depth research is required.


    Uncertainty quantification plays a critical role in assessing the safety of DL
    models construction, optimization, and decision-making processes. Bayesian networks
    (Gal and Gahramani 2016) and ensemble learning techniques (Lakshminarayanan, Pritzel,
    and Blundell 2017) are widely used uncertainty quantification methods, and their
    effectiveness has been verified by different kinds of applications, such as self-driving
    car, etc. Thus, uncertainty as an auxiliary term can be used to further correct
    some inappropriate properties or results during the transfer learning. For example,
    the prediction uncertainty is explicitly estimated during training to rectify
    the pseudo labeling for UDTL of semantic segmentation (Zheng and Yang 2021).


    # CONCLUSION


    This chapter constructs a taxonomy and provides a brief review of UDTL-based IFD
    according to different tasks of UDTL. Two publicly available datasets are gathered
    to perform a comparative analysis of different UDTL-based IFD methods from several
    perspectives. Based on the systematically comparative study, results of different
    methods indicate that the assumption of joint distributions and adversarial training
    are two helpful techniques for promoting the accuracy. Meanwhile, different input
    types often define what might also be important to improve the accuracy. The stability
    and robustness of UDTL-based IFD need to be taken seriously. To sum up, it may
    be useful for scholars to think ahead of these results before developing new models.


