    fault diagnosis belongs to such a challenging problem since the system itself
    is a complex electromechanical one. There, some advanced signal processing technologies
    have been proposed for motor current or vibration signal analysis (Zari and Poshtan
    2007; Blölt et al. 2008; Puche-Panadero et al. 2009) as to extract useful features
    for diagnosis. However, these state-of-the-art methods require the researchers
    to have a deep understanding of the induction motor and the fault signals. In
    addition, the required expert knowledge is not easily obtained that those methods
    are not intelligent enough to the machine learning. In contrast, a deep “autoencoder”
    (AE) network structure has been trained to learn low-dimensional codes from high-dimensional
    input vectors in unsupervised manner (Krizhevsky, Sutskeever, and Hinton 2012).
    Furthermore, sparse AE (SAE) (Ranzato et al. 2007; Wright et al. 2010; Boureau
    et al. 2010) have been widely studied to realize deep learning, as it is highly
    effective for finding succinct and high-level representations of complex data.


    Inspired by the prior research, this chapter presents SAE-based deep neural network
    (DNN) approach for induction motor fault diagnosis. The rest of this chapter is
    organized as AE and its variants, the details of experiments performed on a machine
    fault simulator and the corresponding results, and some conclusions drawn from
    this study.


    # AUTOENCODER AND ITS VARIANTS


    This section is providing systematic introduction for AE, sparse AE, and denoising
    AE.


    # Autoencoder


    An AE is a symmetrical neural network that can learn the features in an unsupervised
    manner by minimizing reconstruction errors (Shin et al. 2013). The basic structure
    of AE is shown in Figure 2.1, where it tries to learn an approximation in the
    hidden layer so that the input data can be perfectly reconstructed at the output
    layer. However, the intrinsic problems of AE, as such simply copying input layer
    to hidden layer, make ineffective in extracting meaningful features even though
    its output can be a perfect recovery of input data.


    ![](img/f29bba55de4872c43f26af4667e705f2_36_0.png)


    FIGURE 2.1 The structure of an autoencoder neural network.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Autoencoders for Intelligent Fault Diagnosis


    # Sparse Autoencoder


    SAE, an extension of the AE, can learn relatively sparse features by introducing
    a sparse penalty term inspired by the sparse coding (Olshausen and Field 1996)
    into the AE. It can improve the performance of traditional AE and exhibits more
    practical values.


    From the measured vibration, an $N \times M$ data set can be constructed as $X=\{x(1),x(2),...,x(i),...,x(N)\},
    x(i)\in R^M$, where $N$ is the number of data samples for each working condition
    and $M$ is the length of each data sample. This data set is used as the input
    matrix of the SAE. A three-layer neural network similar to that in Figure 2.1
    can be constructed, where the sigmoid function is chosen as activation function
    to the network. For the unlabeled input matrix $X$, the goal is to learn and obtain
    a feature expression $h(x(i),W,b)=\sigma(Wx(i)+b),j=1,...,N$ at the hidden layer
    so that the output $\sigma(W^Th(x),W,b)+c$ is close to or reconstructing the input.
    In the meantime, the sparse penalty term is added to the objective function of
    the AE so that the learned features actually works on the hidden layer to control
    the number of "active" neurons. In practice, the sparse penalty term is of constraint
    rather than simply repeating input. The sparse penalty if the output of a neuron
    is close to 1, the neuron is considered to be "active", otherwise it is considered
    "inactive". It is better to keep the neurons of the hidden layer "inactive" most
    of time. Suppose $a_j(X)$ denotes the activation of hidden unit $j$. In the forward
    propagation process, for a given input $X$, the activation of the hidden layer
    can be denoted as $a=sigmoid(Wx+b)$, where $W$ denotes the weights between the
    input layer and the hidden layer and $b$ denotes the biases. Then the average
    activation of the hidden unit $j$ can be given as


    $$\rho_j = \frac{1}{n}\sum_{i=1}^n[a_j(x(i))]$$ (2.1)


    In this process, the average activation of each hidden neuron $\rho_j$ is expected
    to be close to zero, namely the neurons of the hidden layer most "inactive". To
    achieve this, the sparse term is added to the objective function that penalizes
    $\rho_j$ if it deviates significantly from $\rho$. The penalty term is expressed
    as


    $$P_{penalty} = \sum_{j=1}^{S_2}K_L(\rho|\rho_j)$$$ (2.2)


    Where $S_2$ is the number of neurons in the hidden layer. $KL(\cdot)$ is the Kullback-Leibler
    divergence (KL divergence) (Kullback and Leibler 1951), which can be written as:


    $$KL(\rho|\rho_j)=\rho\log\frac{\rho}{\rho_j}+(1-\rho)\log\frac{1-\rho}{1-\rho_j}$$$
    (2.3)


    This penalty function possesses the property that $KL(\rho|\rho_j)=0$ if $\rho=\rho_j$.
    Otherwise, increases monotonically as $\rho_j$ diverges from $\rho$, which acts
    as the sparsity constraint.'
