    # Result Comparison


    Additional experiments are carried out to compare the fault classification performances
    between the proposed DL method and traditional machine learning method. Results
    are listed in Table 6.4, which prove that the proposed DCNN method outperforms
    traditional fault diagnosis methods and the multi-signal DCNN model using time-frequency
    images achieve the best classification accuracy. In traditional methods, one essential
    step in realizing fault diagnosis is preprocessing original signal to extract
    and select proper features to differentiate working states that require prior
    knowledge. Therefore, when using original data without feature selection, traditional
    methods cannot get an accurate classification. For deep architecture, it can learn
    from original data and using the training set to adjust model parameters to automatically
    select features that contribute to classification accuracy where convolution operation
    can extract features from the input image and different convolution kernel can
    learn different discrimin features. Compared with our previous works, the proposed
    method improves the classification accuracy for induction motor fault diagnosis.
    The proposed method overcomes the limitation caused by the single-sensor signal
    and enlarges the feature space based on multiple signals.


    Different from the single-signal model, the multi-signal model is able to analyze
    multiple types of sensor data simultaneously and finally realize accurate fault
    classification based on the fused features. Each type of sensor signal contains
    specific information related to working condition. For example, the current signal
    has been widely used in the diagnosis of stator faults and rotor faults, while
    many bearing fault diagnosis methods are performed by analyzing vibration signals.
    Thus, combining these signals and analyzing them together is an effective alternative
    to realize multi-fault diagnosis even under complex conditions. This chapter introduces
    a methodology on building multi-signal deep learning architecture to learn representations
    from different scales.


