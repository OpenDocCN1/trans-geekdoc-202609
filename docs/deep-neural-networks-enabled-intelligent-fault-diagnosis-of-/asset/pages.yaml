  img_proc: true
- pgno: 129
  md: "# Unsupervised Deep Transfer Learning for Intelligent Fault Diagnosis \\■ 119\n\
    \nAdversarial-Based UDTL for Intelligent Fault Diagnosis\n\nBasic Concepts\nAdversarial-based\
    \ UDTL refers to an adversarial method using a domain discriminator to reduce\
    \ the feature distribution discrepancy between source and target domains produced\
    \ by a feature extractor. In this section, we only use domain adversarial neural\
    \ network (DANN (Ganin et al. 2016) (conditional domain adversarial network (CDAN)\
    \ (Zhang et al. 2018 is also recommended)) to represent adversarial-based methods\
    \ and test the corresponding accuracy.\n\nDANN Similar to MMD and MK-MMD, DANN\
    \ is defined to solve the problem $P(X_s) \neq Q(X_t)$. It aims to train a feature\
    \ extractor, a domain discriminator distinguishing source and target domains,\
    \ and a class predictor, simultaneously align source and target distributions.\
    \ That is, DANN trains the feature extractor to prevent the domain discriminator\
    \ from distinguishing differences between two domains. Let $G_f$ be the feature\
    \ extractor whose parameters are $\theta_f$, and $G_d$ be the domain discriminator\
    \ whose parameters are $\theta_d$. After that, the prediction loss and the adversarial\
    \ loss (binary cross-entropy loss) can be written as:\n\n```\n$$\\mathcal{L}_c(\\\
    theta_f, \\theta_d) = -\\mathbb{E}_{x_s', y_s' \\in \\mathcal{D}_s} \\sum_{c=0}^{C-1}\
    \ [y_s' = c] \\log[G_d(G_f(x_s'; \\theta_f); \\theta_d)]$$\n```\n\n```\n$$\\mathcal{L}_{DANN}(\\\
    theta_f, \\theta_d) = -\\mathbb{E}_{x_s' \\in \\mathcal{D}_s} \\log[G_d(G_f(x_s';\
    \ \\theta_f); \\theta_d)] -\\mathbb{E}_{x_t' \\in \\mathcal{D}_t} \\log[1-G_d(G_f(x_t';\
    \ \\theta_f); \\theta_d)]$$\n```\n\nTo sum up, the total loss of DANN can be defined\
    \ as:\n\n```\n$$\\mathcal{L}(\\theta_f, \\theta_c, \\theta_d) = \\mathcal{L}(\\\
    theta_f, \\theta_d) - \\lambda_{DANN}\\mathcal{L}_{DANN}(\\theta_f, \\theta_d)$$$\n\
    ```\n\nwhere $\\lambda_{DANN}$ is a trade-off parameter.\nDuring the training\
    \ procedure, we need to minimize the prediction loss to allow the class predictor\
    \ to predict true labels as much as possible. In addition, we also need to maximize\
    \ the adversarial loss to make the domain discriminator difficult to distinguish\
    \ differences. Thus, solving the saddle point problem $\\theta_f, \\theta_c, \\\
    theta_d$ is equivalent to the following minimax optimization problem:\n\n```\n\
    $$(\\theta_f, \\theta_c) = \\arg min_{\\theta_f, \\theta_d} \\mathcal{L}(\\theta_f,\
    \ \\theta_c, \\theta_d)\\n$(\\theta_d) = \\arg max_{\\theta_d} \\mathcal{L}(\\\
    theta_f, \\theta_c, \\theta_d)$$$\n```"
  merge: -1
