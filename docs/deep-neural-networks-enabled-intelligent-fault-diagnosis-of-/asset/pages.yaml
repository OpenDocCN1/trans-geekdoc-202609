- pgno: 189
  md: "method, synchroqueezing transform (SST), etc., and has low time complexity.\
    \ Thus, SET is a powerful tool for characterizing inherent features of time-varying\
    \ nonlinear signal in the time domain and frequency domain simultaneously. This\
    \ work utilizes SET to transform one-dimensional (1D) fault vibration signals\
    \ into 2D TF maps suitable for deep convolutional neural network (DCNN) and improve\
    \ diagnostic accuracy, especially for harsh working conditions. SET comprises\
    \ the following steps:\n\nFor a signal $x(u)$, its regular STFT is defined as\n\
    \n```\n$G_x(\\tau,w) = \\int_{-\\infty}^{+\\infty} x(u) \\cdot g(u-\\tau) \\cdot\
    \ e^{-iw\\tau} du \\eqno(10.2)$\n```\n\n$g(u-\\tau)$ indicates a window function\
    \ (WF) with the center at $\tau$, $w$ is the frequency, $u$ and $\tau$ denote\
    \ the time parameter.\n\nIn considering a phase shift $e^{iw\\tau}$, Eq. (10.2)\
    \ is rewritten as:\n\n```\n$G_x(\\tau,w) = \\int_{-\\infty}^{+\\infty} x(u) \\\
    cdot g(u-\\tau) \\cdot e^{-iw(u-\\tau)} du \\eqno(10.3)$\n```\n\nAccording to\
    \ the derivative of $G_r(\\tau,w)$, the intrinsic IF $v_G(\\tau,w)$ at each TF\
    \ position be obtained in:\n\n```\n$v_G(\\tau,w) = \\frac{\\partial}{\\partial\\\
    tau}arg(G_r(\\tau,w)) = i \\cdot G_r^{-1}(\\tau,w) \\cdot G_r'(\\tau,w) + w \\\
    eqno(10.4)$\n```\n\nwhere $g'$ is the derivative of the WF $g(u-\\tau)$ regarding\
    \ time $\tau$.\n\nA new TF plane reconstructed by TF coefficients of $G_r(\\tau,w)$\
    \ at IF positions, is expressed as:\n\n```\n$SET_r(\\tau,w) = G_r(\\tau,w) \\\
    cdot \\delta(w-v_G(\\tau,w)) \\eqno(10.5)$\n```\n\nwhere $SET_r(\\tau,w)$ are\
    \ the TF results of SET, $\\delta(.)$ is the Dirac function, and $\\delta(w-v_G(\\\
    tau,w))$ denotes the synchro-extracting operator (SEO). Considering that SEO's\
    \ real part is utilized in practice, $SEO(\\tau,w)$ is rewritten as:\n\n```\n\
    $SEO(\\tau,w) = \\begin{cases} 1, & Re[G_r^{-1}(\\tau,w) \\cdot G_r'(\\tau,w)]\
    \ < \\Delta w/2 \\ 0, & \\text{otherwise} \\end{cases} \\eqno(10.6)$\n```\n\n\
    where $\\Delta w$ is the frequency interval and it can adjust the SET's frequency\
    \ resolution, $Re()$ indicates taking the real part.\n\nIn this chapter, $\\Delta\
    \ w$ is set to 1, and the $g(u-\\tau)$ is a Gaussian WF with a window length of\
    \ 128. After the above set, the 1D time-domain signal is converted to 2D TFR,\
    \ which will be used as the input of the subsequent model."
