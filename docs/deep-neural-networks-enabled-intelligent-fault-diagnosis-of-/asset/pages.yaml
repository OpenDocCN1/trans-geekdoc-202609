    Network-Based UDTL for Intelligent Fault Diagnosis


    Basic Concepts

    Network-based DTL means that partial network parameters pre pre-trained in the
    source domain are transferred directly to partial network parameters of the test
    procedure or network parameters are fine-tuned with a few labeled data in the
    target domain. The most popular network-based DTL method is to fine-tune the trained
    model utilizing a few labeled data in the target domain. However, for UDTL-based
    IFD, labels in the target domain are unavailable. We use the backbone coming with
    a bottleneck layer, consisting of a Fc layer (out features = 256), a ReLU activation
    function, a dropout layer (p = 0:5), and a basic Softmax classifier to construct
    our basic model (we call it Basis), which is shown in Figure 7.4. The trained
    model is used to test samples in the target domain directly, which means that
    source and target domains share the same model and parameters.


    Applications to IFD

