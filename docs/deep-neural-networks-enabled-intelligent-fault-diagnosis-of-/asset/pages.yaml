  md: '# Self-Supervised Learning for Intelligent Fault Diagnosis


    INTRODUCTION


    With the advancement of industrial modernization, the designs of massive large-scale
    mechanical equipment such as helicopters, wind turbines, and aeroengines are becoming
    more and more complicated, which increases instability of the mechanical systems.
    If a sudden failure occurs, it might result in significant downtime loss and severe
    catastrophic accidents. Therefore, timely and effective diagnosis of various fault
    states is of vital importance (Jin et al. 2013; Deutsch and He 2017).


    In the existing research, machinery fault diagnosis methods can be broadly categorized
    into signal processing methods (Choi et al. 2010) and machine learning methods
    (Sun et al. 2018). Signal processing methods aim to extract fault-related frequency
    components from recorded signals. However, it is challenging to deal with complex
    signals when the characteristic is submerged in substantial noise. Traditional
    machine learning methods extract hand-crafted features via exquisite structural
    design, and then construct the mapping between the features and the mechanical
    health status in a data-driven manner. Though they can achieve good performance,
    the procedure of feature extraction still relies on expert knowledge. As a sub-field
    of machine learning, deep learning (DL) can catch the high nonlinear relationship
    between input and output without any preprocessing and achieve higher diagnostic
    accuracy. Thus, it has been widely applied in fault diagnosis (Wu et al. 2021;
    Zhao et al. 2020).


    Nevertheless, most DL-based techniques follow a supervised learning paradigm,
    which requires enough labeled samples to guarantee the steady convergence of the
    model. However, the amount of labeled data is insufficient in real-world applications.
    On the one hand, the occurrence of failures in key components is scarce and the
    expense of fault simulation experiments is high. On the other hand, unlike perceptual
    data such as image and acoustic signals, marking the mechanical fault type depends
    heavily on domain'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'expert knowledge, which is time-consuming. Unfortunately, when few labeled
    data are available, the deep model will fall into the dilemma of overfitting and
    poorer generalization ability. Therefore, it is urgent to address the label-insufficient
    problem in the mechanical industry.


    To overcome the problem, an intuitive idea is to enrich the capacity of labeled
    samples. Data augmentation (DA (Zhao and Ge 2021)) is a simple yet effective approach
    to increase the number of label-invariant data via different transformations.
    Nonetheless, traditional DA methods such as rotation, crop, or some of their combinations
    were initially designed for images and are hence inapplicable to vibration data.
    In recent years, researchers have adopted transfer learning as a solution to the
    label-insufficient problem, which attempts to transfer the general representation
    from source data with labeled samples to target data with scarce label information.
    It performs well on limited target data, however limited source data the problem
    has not been radically solved. Semi-supervised learning (SSL) (Zhao et al. 2016;
    Luo et al. 2017; Razavi-Far et al. 2018; Chen et al. 2019; Li, and Ma 2020; Nie
    and Xie 2021) is a popular and effective method to deal with label scarcity which
    integrates labeled samples with unlabeled samples to improve the discriminability
    of the model. Nie and Xie (2021) pre-trained a convolutional recurrent unit (ConvGRU)
    to classify the health conditions and adopted three regularization terms to review
    the initial labels. Li, Li, and Ma (2020) adopted an autoencoder for feature extraction
    and created pseudo-labels for unlabeled samples by distance metric learning. Luo
    et al. (2017) integrated an adaptive similarity learning method into the semi-supervised
    feature selection procedure which achieved good performance for video semantic
    recognition with few labeled instances. However, most SSL methods learn representations
    based on clustering or manifold assumption, which requires cumbersome feature
    selection and fine-tuning. Besides, the problem is highly related to the quality
    of learned representations.


    As a powerful unsupervised representation learning method, self-supervised learning
    can extract useful representations from unannotated data. Therefore, it is an
    intuitive choice to combine self-supervised learning in a unified SSL framework,
    which avoids complex feature selection and strengthens the feature extraction
    ability of self-supervised learning to enhance the model''s discriminability with
    few labeled data. The underlying idea of self-supervised learning is to learn
    invariant representations under various distributions. Specifically, different
    augmentations of raw data are projected into an embedding space through Siamese
    networks (Koch, Zemel, and Salakhutdinov 2015; Sung et al. 2018), where the similarity
    of representations generated from similar samples is maximized. Following this
    pipeline, contrastive learning (Dosovitskiy et al. 2014; Chen et al. 2020; Falcon
    and Cho 2020) consider each sample as a class and generate different instances
    to distinguish whether they are from the same class. Though these methods have
    achieved good performance, they only focus on the instance-level invariant features
    regardless of the data structure itself. Recent studies have shown that an instance
    can be more informative when its contextual structure relationship is considered.
    For example, CPC (Oord, Li, and Vinyals 2018) extracted unsupervised features
    for speech recognition'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Self-Supervised Learning for Intelligent Fault Diagnosis 157


    by maximizing the similarity between audio and its context segments. Particularly
    for fault diagnosis, experts tend to identify the fault types according to the
    varying tendency of vibration signals, which reveals that the temporal relation
    contains related information on fault characteristics. Intuitively combining both
    inter-sample correlation and intra-sample temporal dependency can further increase
    the model''s discriminability. Therefore, supervised learning with labeled data,
    our work aims to learn representations from the perspective of inter-instance
    and intra-temporal relations to fully exploit the intrinsic features of unlabeled
    vibration data.


    Based on the above discussion, we propose a SSL framework, where supervised and
    self-supervised tasks are jointly trained in an end-to-end manner. Besides, both
    interample and intra-temporal relations of vibration signals are explored to enhance
    the discriminability. To be specific, we first apply a specific signal augmentation
    technique that increases the number of labeled samples and generates correlated
    domains of the input samples for contrastive learning. A supervised learning task
    and self-supervised contrasting tasks are aggregated in this SSL framework, which
    can extract more discriminative features via designed-instance and intra-temporal
    relation mining modules. Moreover, to avoid the single task domain problem during
    the training procedure, a dynamic weighting mechanism is leveraged to dynamically
    balance the weights of each task.


    To implement fault diagnosis with few labeled data, this chapter merges semi-supervised
    learning to a semi-supervised framework, where massive unlabeled samples and few
    labeled data are parallel processed and fully exploited in an end-to-end manner.
    The framework provides a synt consideration of two types of relations, including
    inter-sample and intra-temporal relations of vibration signals, which further
    enhance the overall diagnostic performance. Besides, a data augmentation method
    of vibration signals is pertinently designed to improve the generalization ability
    of the model and create different domains for self-supervised learning. Finally,
    a dynamic weighting mechanism is adopted to adjust the weights of multi-task losses
    automatically for better optimization.


    The rest of this chapter is organized as follows: background and definition of
    SSL and self-supervised learning, SSL-based intelligent fault diagnosis framework,
    datasets, evaluation results, and further discussions.


    # THEORET BACKGROUND


    This section is going to provide background and definition of SSL and self-supervised
    learning.


    Semi-Supervised Learning


    Suppose that the collected signals consist of limited labeled dataset $D_l=\{(x_i,
    y_i) \mid x_i \in \mathbb{R}^{L_l}\}_{i=1}^{N_l}$ and massive unlabeled dataset
    $D_u=\{x_i \mid x_i \in \mathbb{R}^{L_u}\}_{i=1}^{N_u}$, where $x_i$ is an input
    sample with $L$ points and $y_i \in\1, 2, \dots, C\}$ is its corresponding label
    indicating different health conditions. $N_l$ and $N_u$ refer to the size of labeled
    and unlabeled dataset respectively, which satisfy the inequation: $N_l \ll N_u$.
    The total number of input samples $N$ is the sum of $N_l$ and $N_u$, Let'
