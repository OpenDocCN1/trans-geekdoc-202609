  md: '# Deep Belief Networks for Intelligent Fault Diagnosis 45


    descent is adopted. The log-likelihood probability of the training data is calculated,
    and its derivative with respect to the weights is seen as the gradient, in Eq.
    (3.8). The goal of this training procedure is to update network parameters in
    order to obtain a convergence model.


    ```

    $\frac{\partial \log p(v)}{\partial w_{ij}} = \langle v_i h_j \rangle_{data} -
    \langle v_i h_j \rangle_{model}$ \quad (3.8)

    ```


    Parameter update rules were originally developed by Hinton and Sejnowski, which
    can be written as:


    ```

    $\Delta w_{ij} = \varepsilon(\langle v_i h_j \rangle_{data} - \langle v_i h_j
    \rangle_{model})$ \\quad (3.9)

    ```


    where $\varepsilon$ is the learning rate, the $\langle \cdot \rangle_{data}$ represents
    an expectation from the data distribution while the $\langle \cdot \rangle_{model}$
    is an expectation from the distribution defined by the model. The former term
    is easy to compute exactly, while the latter is intractable to compute (Salakhutdinov
    and Hinton 2009).


    An approximation to the gradient is used to obtain the latter which is realized
    by performing alternating Gibbs sampling, as illustrated in Figure 3.2(a).


    Later, a fast-learning procedure proposed, which starts with the visible units,
    then all the hidden units are computed at the same time using Eq. (3.6). After
    that, visible units are updated in parallel to get a “reconstruction” by Eq. (3.7),
    as illustrated in Figure 3.2(b), and the hidden units are updated again (Hinton
    2012). Model parameters are updated as:


    ```

    $\Delta w_{ij} = \varepsilon(\langle v_i h_j \rangle_{data} - \langle v_i h_j
    \rangle_{recom})$ \\quad (3.10)

    ```


    In addition, for practical reasons that come to real-valued data, Gaussian–Bernoulli
    RBM is introduced to deal with this issue. Input units of the model are linear
    while hidden units are still binary. Learning procedure for Gaussian–Bernoulli
    RBM is very similar to binary RBM introduced above.


    ![](img/f29bba55de4872c43f26af4667e705f2_55_0.png)


    FIGURE 3.2 (a) Alternating Gibbs sampling and (b) a quick way to learn RBM.'
