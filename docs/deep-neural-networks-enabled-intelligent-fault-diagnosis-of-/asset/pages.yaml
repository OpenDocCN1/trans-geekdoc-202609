    # CONCLUSION


    This chapter proposes a DCNN-based multi-signal fault diagnosis framework with
    its application on induction motors, where TFDs of sensor signals are utilized
    as the input images. CNN is utilized as the building block for the multi-signal,
    which shows the capability to learn discriminative features automatically from
    TFD images and produce accurate fault classification. Both vibration and current
    signals are utilized to verify the performance of the presented framework. Two
    different DCNN-based multi-signal architectures are designed and their performances
    are explored through experiments, where the merged model has achieved the best
    performance. Furthermore, the influence of measurement uncertainty is discussed
    based on the statistical analysis.


    Future study can be conducted aimed at improving the performance of DCNN by tuning
    hyperparameters and network architecture. To overcome the problem of limited training
    data for a deep architecture, data augmentation can be performed to enlarge the
    dataset. In addition, existing pre-trained models for fault diagnosis can be further
    investigated.


