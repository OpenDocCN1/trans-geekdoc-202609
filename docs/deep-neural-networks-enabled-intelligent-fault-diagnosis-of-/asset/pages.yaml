    After layer-by-layer learning, synaptic weights and biases are settled and the
    basic structure is determined. Classification process is then followed to predict
    the fault category. It is a supervised fine-tuning procedure and the proposed
    method adopts the backpropagation training algorithm to realize fine-tuning which
    uses labeled data for training, so that it can improve the discriminative ability
    for classification task. The unsupervised training trains one RBM at a time and
    afterwards supervised fine-tuning process using adjusts weights of the whole model.
    The difference between DBN outputs and the target label is regarded as training
    error. In order to obtain the minimum error, the deep network parameters will
    be updated based on learning rules.


    After training the DBN model, all the DBN parameters are fixed, and the next procedure
    is to test the classification capability of the trained DBN model and classification
    rate is calculated as an index for evaluation. The vibration signal is the input
    of the constructed fault diagnosis system, and its output indicates working states
    of the induction motor.'
