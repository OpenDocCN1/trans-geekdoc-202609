  md: '# ■ Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
    Systems


    on the test data. In this study, the dropout technique is applied to train the
    SAE-based DNN to prevent complex co-adaptations on the training data and allow
    extraction of the same features repeatedly. Technically, the “dropout” can be
    realized by setting the output a = sigmoid(Wx + b) of some hidden neurons to zero
    so that these neurons will not be involved in the forward propagation training
    process. It should be noted that there are some differences between the training
    process and testing process with dropout. The dropout is turned out during testing,
    which means the outputs of all hidden neurons will not be masked during testing.
    This will help to improve the feature extraction and classification capability
    of the SAE-based DNN.


    SAE-Based Intelligent Fault Diagnosis

    By taking advantage of the unsupervised learning, the denoising SAE is used to
    learn features from unlabeled data and initialize the DNN structure. When the
    learned sparse feature representation of the AE is utilized to train a neural
    network classifier with motor fault diagnosis. Instead of direct utilization of
    learning by denoising SAE, the parameters of the neural network classifier with
    the corresponding parameters are initialized in a well-trained SAE and then updated
    further. This adaptation enables further fine-tuning of learned parameters so
    that the learned representation can capture more discriminative components in
    vibration signals. In addition, a previous study (Coates, Lee, and Ng 2011) indicated
    that the number of hidden neurons in the deep model is as important as the choice
    of learning algorithm and the depth of the model for achieving high classification
    performance, which means that single-layer network in unsupervised feature learning
    also perform well. Therefore, in this study only single-layer SAE is utilized
    to realize the DNN for the induction motor fault diagnosis.


    The training procedure of the DNN is shown in Figure 2.3 and it is described in
    subsequence text.


    ![](img/f29bba55de4872c43f26af4667e705f2_40_0.png)


    FIGURE 2.3 Structure of the sparse AE-based deep neural network.'
