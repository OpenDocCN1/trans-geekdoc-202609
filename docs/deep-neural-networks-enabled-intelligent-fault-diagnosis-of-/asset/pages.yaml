  md: "# Unsupervised Deep Transfer Learning for Intelligent Fault Diagnosis ■ 111\n\
    \nThe source and target domains follow the probability distributions $P$ and $Q$,\
    \ respectively. We hope to build a model $\beta(\\cdot)$ which can classify unlabeled\
    \ samples $x$ in the target domain:\n\n```\n$\\hat{y}=\beta(x), \\quad (7.3)$\n\
    ```\n\nwhere $\\hat{y}$ is the prediction, UDTL is aimed to minimize the target\
    \ risk $\\varepsilon_t(\\beta)$ using source data supervision:\n\n```\n$\\varepsilon_{t}(\\\
    beta)=\\\\ Pr[\\beta(x)\\neq\\mathbf{y}]. \\quad (7.4)$\n```\n\nAlso, the total\
    \ loss of UDTL can be written as:\n\n```\n$\\mathcal{L}=\\mathcal{L}_{s+\\lambda}\\\
    mathcal{L}_{UDTL}, \\quad (7.5)$\n```\n\nwhere $\\mathcal{L}_s$ is the softmax\
    \ cross-entropy loss shown in (6), $\\lambda$ is the trade-off parameter, and\
    \ $\\mathcal{L}_{UDTL}$ represents the partial loss to reduce the feature difference\
    \ between source and target domains.\n\n```\n$\\mathcal{L}_s=-\\mathbb{E}_{[(x',y')]}\\\
    sum_{c=0}^{C-1}\\mathbf{1}[y'=c]\\log[\\beta(x')]. \\quad (7.6)$\n```\n\nwhere\
    \ $C$ is the number of possible classes, $\\mathbb{E}$ denotes the mathematical\
