    # Evaluation Metrics


    Classification accuracy is calculated as the metrics to evaluate the performances
    of the deep architectures:


    ```

    $Accuracy = \frac{N_{right}}{N_{total}} (6.3)

    ```


    where $n_{right}$ represents the number of samples that the deep architecture
    is able to classify correctly, and $N_{total}$ is the number of total samples.
    Classification accuracy calculates the ratio of accurate prediction to the total
    dataset and it indicates how accurate prediction the designed model is able to
    achieve in induction motor fault diagnosis tasks.


    # Training Details


    In order to provide a robust estimation of the proposed model, experiments are
    repeated 50 times and statistics are used to summarize the model performance.
    Training and testing time are also recorded to investigate the model efficiency.
    All the algorithms are conducted in Keras platform using TensorFlow backend. TensorFlow
    was originally invented by Google Brain for machine learning researches and for
    training DNNs. Now, it has become an open-source software library for numerical
    computation. Keras is a high-level neural networks programming interface which
    enables fast implementation in building and training DNNs. We conducted all the
    experiments on a Linux server using one Nvidia GTX GPU 1080 tasks.


