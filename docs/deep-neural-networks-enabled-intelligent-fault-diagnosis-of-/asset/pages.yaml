    From the aforementioned analysis, the proposed method can better identify the
    planetary-gearbox''s health status regardless of single or multi-work conditions,
    especially compared with traditional methods. In addition, DL-based fault diagnosis
    methods can automatically extract high-quality features that are useful for obtaining
    high OA of fault diagnosis. Especially for integrating DL and TFR, they further
    improve the diagnostic accuracy by considering TF information synchronously. It
    further proves the feasibility and effectiveness of the proposed method. Since
    the agent needs frequent trial and error to explore the environment when playing
    the “guessing game”, this method requires more time than common methods in the
    training. But it is not different from SL methods in the testing because using
    only the learned policy to make actions without “exploration”. Due to the agent''s
    random exploration, it can be regarded as certain noise in the process of model
    training, improving the model''s generalization ability. This may be the reason
    why the proposed method has a slightly better performance than SET+CNN. Also,
    it can be found that the agent needs more self-exploration with the increasing
    of task samples or complexity.


    # CONCLUSION


    To improve the safety and reliability of rotating machinery transmission systems,
    this chapter transforms planetary gearbox fault diagnosis as a “guessing game”
    and presents a new fault recognition method integrating SET and DRL. Moreover,
    this method is validated under different load conditions on a DDS test platform.
    Results prove that this approach has better diagnostic accuracy and stability
    on multiple diagnostic tasks. Even in multi-work conditions, the proposed method
    realizes OA over 99.5%. Importantly, it provides a reference for highly accurate
    and intelligent fault diagnosis for planetary gearbox from a view of DRL.


