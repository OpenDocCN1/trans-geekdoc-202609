    # EXPERIMENTAL STUDIES (FOR AEROENGINE BEAR GEAR FAULT DIAGNOSIS)


    In this section, we test three datasets to verify the performance of SSL-based
    intelligent fault diagnosis framework over other comparative methods.


    # Datasets


    # MFPT Bearing Dataset


    MFPT bearing datasets were provided by Society for Machinery Failure Prevention
    Technology (MFPT) (Dataset 2020), which included vibration signals of the health
    bearing and two fault bearings. The sampling frequency of the health bearing and
    fault bearing were 97656 Hz and 48828 Hz, respectively. The fault bearings were
    both operating under 7 different loads. Therefore, there exist 15 fault conditions
    including one health state and 14 fault states. In the following experiment, we
    select a 2560 samples with a length of 1024, including 572 healthy samples and
    143 fault samples per state.


    # XJTU-SY Bearing Dataset


    XJTU-SY bearing datasets were provided by Xi''an Jiaotong University and Changxing
    Sumyoung Company (Wang et al. 2018), which included 15 bearing run-to-failure
    data under 3 working conditions. Every minute, 32768 points were sampled at a
    frequency of 2.56 kHz. In the following experiment, we collect 1920 samples including
    1024 data points, in which each health condition has 128 samples.


