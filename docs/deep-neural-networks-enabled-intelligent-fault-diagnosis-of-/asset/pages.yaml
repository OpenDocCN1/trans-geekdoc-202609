    # Structure of Deep Neural Networks


    The simplest neural network is perceptron (Rosenblatt 1958). As shown in Figure
    1.4, it consists of only one neuron. Several inputs are combined through linear
    weighted summation and a nonlinear activation to produce output. This model is
    only suitable for binary classification and cannot learn complex nonlinear models.


    Deep Neural Networks (DNNs) are an extension of the perceptron. They incorporate
    two key enhancements: First, the addition of hidden layers, which can be stacked
    multiple times, enhancing the model''s expressive capabilities. The output layer''s
    neurons can be more than one, allowing for multiple outputs. This flexibility
    allows the model to be applied effectively to classification, regression, dimensionality
    reduction, clustering, and other machine learning domains. An example of a DNN
    is depicted in Figure 1.6. DNNs with linear connections are sometimes referred
    to as multi-layer perceptron (MLP).


    When categorized by the positions of different layers, the layers of a DNN can
    be divided into three types: input layer, hidden layer, and output layer, as shown
    in Figure 1.6. Generally, the first layer serves as the input layer, the last
    as the output layer, and the ones in between are the hidden layers. The input
    layer requires input signals and passes them to the next layer. It performs no
    operations on the input signals and has no weights or biases. In Figure 1.6, there
    are four input signals. The hidden layers consist of neurons that apply different
    transformations to the input data. A hidden layer is a collection of vertically
    arranged neurons. In Figure 1.6, there are five hidden layers. The first hidden
    layer has four neurons, the second layer has five neurons, the third layer has
    six neurons, and the fifth layer has three neurons. Each neuron in the hidden
    layer is connected to every neuron in the next layer, resulting in a fully connected
    hidden layer.


