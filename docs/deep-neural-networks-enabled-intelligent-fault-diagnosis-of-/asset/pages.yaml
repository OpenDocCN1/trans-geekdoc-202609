  md: '# Mapping-Based UDTL for Intelligent Fault Diagnosis


    Basic Concepts


    Mapping-based UDTL refers to map instances from both source and target domains
    to the feature space via a feature extractor. There are many methods to mapping-based
    UDTL, such as Euclidean distance, Minkowski distance, Kullback-Leibler, correlation
    alignment (CORAL) (Sun and Saenko 2016), maximum discrepancy (MMD) (Borgwardt
    et al. 2006), multi-kernel MMD (MK-MMD) (Long et al. 2015), joint distribution
    adaptation (JDA) (Long et al. 2013), balanced distribution adaptation (BDA) (Wang
    et al. 2017), and joint maximum discrepancy (JMMD) (Long et al. 2017). In this
    section, we use MK-MMD as an example to represent mapping-based methods and test
    their performance.


    MK-MMD To introduce the definition of MK-MMD, we briefly explain the concept of
    MMD. MMD was first proposed by Borgwardt et al. (2006) and was used in transfer
    learning by many other scholars (Pan et al. 2010). MMD defined in reproducing
    kernel Hilbert space (RKHS) is a distance embedding between the kernel embedding
    of marginal distributions $P(X)$ and $Q(X)$, RKHS is a Hilbert space of functions
    in which point evaluation is a continuous linear function, and some examples can
    be found in (Zynda 2020). The formula of MMD can be written as follows:


    ```

    $$\mathcal{L}_{MMD}(P, Q)=\|\mathbb{E}_P(\phi(x''))-\mathbb{E}_Q(\phi(x''))||_{\mathcal{H}_k}^2,$

    ```


    where $\mathcal{H}_k$ is RKHS with the kernel $k$ (in general, Gaussian kernel
    is used as the kernel), and $\phi(\cdot)$ is the mapping to RKHS.


    Parameter selection of each kernel is crucial to the final performance. To tackle
    this problem, MK-MMD, which could maximize the two-sample test power and minimize
    the Type II error jointly, was proposed by (Gretton et al. 2012). For MK-MMD,
    scholars often use the convex combination of $m$ kernels $\{k_u\}$ to provide
    effective estimates of the mapping.


    ```

    $$\mathcal{K}:\triangleq \sum_{u=1}^m\alpha_u k_u;\sum_{u=1}^m\alpha_u=1,\alpha_u\geq
    0,\nabla_u,$

    ```


    where $\{\alpha_u\}$ are weighted parameters of different kernels (in this chapter,
    all $\alpha_u=\frac{1}{m}$).


    Inspired by adaptation networks (DAN) proposed in (Long et al. 2015), we design
    an UDTL-based IFD model by adding MK-MMD to the loss function to realize the feature
    alignment shown in Figure 7.5. In addition, the final loss function is defined
    as follows:


    ```

    $$\mathcal{L}=\mathcal{L}_+\lambda_{MK-MMD}\mathcal{L}_{MK-MMD}(\mathcal{D}_s,\mathcal{D}_t),$$

    ```


    where $\lambda_{MK-MMD}$ is a trade-off parameter and $\mathcal{L}_{MK-MMD}$ means
    the multi-kernel version of MMD. Besides, we simply use the Gaussian kernel and
    the number of kernels is equal to'
