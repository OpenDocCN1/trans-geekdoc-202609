  md: '# THEORETICAL BACKGROUND


    This section is going to provide theoretical background of GANs, ACGANs, and similarity
    evaluation criteria.


    # Generative Adversarial Networks


    A regular GAN consists of two parts which are trained in opposition to each other,
    the generator G and the discriminator D, as shown in Figure 5.1(a). The main thought
    behind GAN is using adversarial networks to improve the quality of generated data.
    The generator is trained to produce realistic synthesized data $x_{generated}=G(z)$
    from a random noise z, trying to fool the discriminator so that $x_{generated}$
    would not be recognized as generated samples. The generated distribution is denoted
    as $P_g$. On the contrary, the discriminator takes both the real data and fake
    samples generated from generator as the input, and then it is trained to distinguish
    between generated and real data. Discriminator outputs the probability that certain
    samples correspond to possible data sources. The loss function of discriminator
    L can be defined as:


    ```

    $L = E_{x-P_{data}}[log p(s=real|x_{real})] + E_{z-P(z)}[\log p(s=generated|x_{generated})]$

    $= E_{x-P_{data}}[\log(D(x))] + E_{z-P(z)}[\log(1-D(z))]$

    ```


    where $P_{data}$ is the real data distribution, $P(z)$ is a prior distribution
    on noise vector z, $D(x)$ denotes the probability that $x$ comes from the real
    data rather than generated data, $E_{x-P_{data}}$ and $E_{z-P(z)}$ are the expectation
    of $x$ from real data distribution $P_{data}$ and $z$ sampled from noise. For
    discriminator, the goal of training is to maximize the loss function which maximizing
    the log-likelihood with correct sample source; for generator, the training goal
    is to minimize the second term in Eq. (5.1) to confuse the discriminator. Therefore,
    the goal of the whole GAN architecture can be summarized as:


    ```

    $Goal = arg \min \max L(G,D)$

    ```


    ![](img/f29bba55de4872c43f26af4667e705f2_87_0.png)'
