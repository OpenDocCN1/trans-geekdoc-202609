    # Measurement Uncertainty Discussion


    Due to measurement uncertainty, sensor data samples vary from each other, and
    using different training data samples to train deep architecture may produce various
    model performances. For the experimental verification, the acquired sensor data
    contain environmental noise and may have sensor measurement error in certain samples.
    To investigate the influence caused by measurement uncertainty, confidence interval
    estimation for the classification accuracy is performed using the bootstrap method
    (Deutsch and He 2017). The bootstrap method is a random sampling method in statistical
    analysis for uncertainty quantification (Endo, Watanabe, and Yamamoto 2015). For
    the model performance evaluation, the main procedure is followed below.


    Initially, a resample of the original training data is generated by the bootstrap
    procedure. The dataset is sampled with replacement, which means each sample can
    be selected more than once. The size of the resample data is the same as that
    of the original dataset, and the samples that are not selected in the resampling
    are carried out-of-bag samples.


    Then, the proposed model is trained using the resample data and is evaluated on
    the out-of-bag samples. For each bootstrap iteration, a performance statistic
    can be obtained.


    The bootstrap procedure is repeated for a number of times and a number of different
    resamples are generated. Repeating training and evaluation procedure, a performance
    statistics are achieved. Based on these performance statistics, a confidence interval
    for the designed model can be calculated.


    As the number of bootstrap iterations increases, the confidence interval becomes.
    In this section, considering the number of original data and computation costs,
    500 bootstrap iterations are adapted to generate classification accuracy confidence
    interval for the proposed multi-signal framework. The results are reported in
    Table 6.5 and Figure 6.11. In Figure 6.11, the color bars represent the model
    classification accuracy across the bootstrap samples, and the black lines denote
    the confidence interval. Based on the estimation results of the confidence interval
    for classification accuracy, the proposed multi-signal DCNN has relatively stable
    performance and different resamples have limited influence on model performance.
    For the merged model, there is a 95% likelihood that the range between 99.89%
    and 99.93% covers the model skill of fault classification. For multi-channel model,
    there is a 95% likelihood that the range between 99.21% and 99.29% covers its
    skill. Compared with the multi-channel model, the merged model has more accurate
    prediction and shows better capability in model robustness.


