    # RELATED BACKGROUND


    One-Shot NAS


    Recently, one-shot NAS methods based on the hyper-network (Liu et al. 2018; Bender
    et al. 2018; Liang et al. 2019; Guo et al. 2019; Chu et al. 2021) have attracted
    much attention due to its resource-friendly characteristics. The hyper-network
    provides performance proxy for the candidate networks, the flexible search strategy,
    e.g., RL or EA, can be used to rank the search space. If the hyper-network can''t
    reflect the ground truth ranking of the search space, it will propagate bias to
    the subsequent searching phase. In fact, a variety of training strategies have
    been proposed to alleviate this problem. DARTS pre-training the hyper-network
    before the alternating optimization. DARTS+ (Liang et al. 2019) adopts early stopping
    to avoid the aggregation skip connection caused by the unfairness of hyper-network.
    However, this global training causes the coupling effect, which means the parametric
    operators get insufficient training as the hyper-network prefers the nonparametric
    operators with stable increase performance. The Softmax normalization in the search
    phase of DARTS leads to the winner-takes-all evaluation, then the Matthew effect
    and the coupling will further amplify the bias under alternating optimization.


    Therefore, the local training strategies for the hyper-network have been researched
    to replace the global training (Bender et al. 2018; Guo et al. 2019; Chu et al.
    2021). SPOS (Guo et al. 2019) proposed a uniform sampling strategy to train the
    hyper-network, and in this method only one sampling path will be updated. FairNAS
    (Chu et al. 2021) proposed a'
