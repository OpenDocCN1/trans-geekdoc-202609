    \nA discriminative weight learning scheme is proposed by applying a neural network\
    \ with a specific structure and transferring the parameters of hidden layers into\
    \ the convolutional layer in unsupervised CNN. It has been indicated by Zhao et\
    \ al. (2010) and Yang and Li (2015)"
