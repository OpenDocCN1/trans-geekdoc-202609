    # Training Details


    We implement UDTL-based IFD methods in PyTorch and put them into a unified code
    framework. Each model is trained for 300 epochs and model training and test processes
    are alternated during the training procedure. We use minibatch Adam optimizer
    with the batch size equal to 64. The "step" strategy in PyTorch is used as the
    learning annealing method and the initial learning rate is 0.001 (multiplied by
    0.1) in the epoch 150 and 250, respectively. We use a progressive training method
    increasing the trade-off parameter from 0 to 1 via multiplying by $\frac{1-\exp(-\zeta)}{1+\exp(-\zeta)}$,
    where $\zeta=10$ and $k$ means the training process changing from 0 to 1 after
    transfer learning strategies are activated.


    For MK-MMD and DAN, we train with source samples in the former 50 epochs to get
    a so-called pre-trained model, and then transfer learning strategies are activated.
    AdaBN, we update the statistics of BN layers via each batch for three extra epochs.


    All experiments are executed under a computer with Windows 10 and PyTorch 1.3
    running on an Intel Core i7-9700K, GeForce RTX 2080Ti, and 16G RAM.


    # Evaluation Metrics


    For simplicity, we use the overall accuracy, which is the number of correctly
    classified samples divided by the total number of samples in test data, to verify
    the performance of different models. To avoid the randomness, we perform experiments
    five times, and mean as well as maximum values of the overall accuracy are used
    to evaluate the final performance because variance of five experiments is not
    statistically useful. In this section,'
