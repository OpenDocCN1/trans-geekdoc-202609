  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    The loss used for classification is the cross-entropy loss. The definition is
    as follows:


    ```

    J(W,b,x,y) = -\sum_{j=1}^m (y\log\hat{y} + (1-y)\log(1-\hat{y}))

    ```


    where m is the number of samples.


    Compute the error of the output nodes, use the BP algorithm to calculate gradients
    and propagate the error back through the preceding network layers for weight updates
    (Rumelhart, Hinton, and Williams 1985, 1986). BP is based on a gradient descent
    algorithm, adjusting the parameters in the direction of the negative gradient
    of the objective, aiming to minimize the error of output values. For the MSE J(W,b,x,y)
    and given the learning rate $\eta$, the update process is expressed as:


    ```

    $w_{jk} \leftarrow w_{jk} - \eta \frac{\partial J(W,b,x,y)}{\partial w_{jk}}$

    ```


    ```

    $b_j \leftarrow b_j - \eta \frac{\partial J(W,b,x,y)}{\partial b_j}$

    ```


    BP uses the chain rule. In this rule, calculate the derivative of the loss with
    respect to the corresponding weights in the last layer. Then, we use these gradient
    values to calculate the gradients in the second-to-last layer. This process is
    repeated until we obtain gradients for each weight in the neural network.


    Forward propagation and BP are repeated continuously, and the neural network weights
    are iteratively updated until the neural network converges to the minimum loss.


    # Regularization


    First, let''s introduce the concepts of underfitting and overfitting in neural
    networks. Underfitting occurs when a learning model is too simple to capture the
    underlying patterns in the data. It fails to learn the relationships between input
    features and the target output, resulting in poor performance on both the training
    data and unseen data. In other words, the model''s capacity is insufficient to
    represent the complexity of the data. Overfitting happens when a model becomes
    too complex and starts to memorize the training data instead of learning generalizable
    patterns. As such, the model performs well on the training data but fails to generalize
    to unseen, unseen data. Essentially, the model fits the noise in the training
    data, leading to poor performance in real-world scenarios.


    Regularization is a set of techniques used to prevent or mitigate overfitting.
    These techniques add additional constraints or penalties to the model''s learning
    process to discourage it from fitting the noise in the training data. The goal
    is to encourage the model to learn important patterns while avoiding excessive
    complexity. There are several popular regularization methods:


    +   1. L1 and L2 regularization (Zou and Hastie 2005): These are methods that
    add a penalty to the model''s loss function based on the magnitude of the model''s
    parameters. L1 regularization adds the absolute values of the parameters, encouraging
    some of'
