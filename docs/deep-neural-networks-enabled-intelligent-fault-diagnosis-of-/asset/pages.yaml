    # SSL-BASED INTELLIGENT FAULT DIAGNOSIS


    This section is going to first introduce the overall framework of SSL-based intelligent
    fault diagnosis, and then demonstrate its specific modules, i.e., time-amplitude
    augmentation module, supervised learning module, self-supervised proxy task and
    uncertainty-based dynamic weighting module.


    # Framework for Intelligent Fault Diagnosis


    The overall framework of ITSSL is divided into the training stage and the testing
    stage, as illustrated in Figure 9.1. During the training stage, all samples are
    transformed into different forms using a time-amplitude data augmentation technique.
    After that, labeled samples are fed into a backbone network to extract discriminative
    features and further through a classification head to obtain a supervised loss
    Ls. Meanwhile,negative pairs are constructed from unlabeled samples by two relation
    modules, respectively, which serve as the pseudo labels of self-supervised tasks.
    The sample pairs are then fed into the shared backbone network and passed through
    a corresponding output head to determine whether they belong to a positive pair
    or not, and out contrastive loss, i.e., inter-instance sample pairs are fed into
    the relation head to calculate the instance relation loss Li, and intra-temporal
    sample pairs are fed into the relation head to calculate the temporal relation
    loss Lt. Later, a dynamic weighted loss aggregates the supervised loss Ls, instance
    relation loss Li and temporal relation loss Lt simultaneously, where the weight
    of each loss is determined by its uncertainty. Finally, the whole model is trained
    with the total loss, and weights are updated by back-propagation.


    In the testing stage, the relation head and temporal relation head are abandoned,
    while the testing samples are directly fed into the trained backbone network and
    the classification head to predict the real fault types.


