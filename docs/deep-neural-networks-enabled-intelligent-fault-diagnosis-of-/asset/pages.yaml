    # Results and Discussion


    # Single-Signal Fault Diagnosis


    For comparison, we conduct single-signal fault diagnosis using vibration signal
    and current signal separately. The image dataset that contains six working conditions
    is used as the input of single-signal DCNN. The built network outputs predict
    label that corresponds to one working condition. For vibration signals, the network
    contains three 2D convolutional layers with kernel sizes 6, 8, and 6, and filter
    numbers 6, 12, and 12, respectively, where each convolutional layer is connected
    to a max-pooling layer which sets the pooling size as 2 × 2 and the stride length
    as 2. The activation function used in the convolutional layer is ReLU. After,
    the learned 2D representation is flattened and fully connected to a hidden layer
    with 512 ReLUs. The final output using the Softmax activation function with six
    units to six different working conditions can predict the label of each input
    image. For current signals, the built network has three 2D convolutional layers
    with filter numbers 6, 12, and 12, respectively, activated by ReLU. The kernel
    sizes of filters are 3, 3, and 6, respectively. Each convolutional layer is followed
    by a max-pooling layer where the pooling size is set to 2 × 2, and the stride
    length is set as 2. The fully connected layers have 512 ReLUs and the output layer
    is the same as for dealing with vibration signals. The model weights of both architectures
    are randomly initialized, and the cross-entropy error is calculated to update
    the model parameters using Adam optimizer with learning rate set to be 0.0001.
    The batch size is 32 and the whole training process is finished when the classification
    accuracy stops improving.


    Experimental results of vibration and current signals are listed in Table 6.2,
    model loss and accuracy during training and testing are shown in Figure 6.6, and
    the confusion matrix to clearly illustrate the classification rate of each category
    is shown in Figure 6.7.


