  md: '# Introduction and Background


    INTRODUCTION


    In recent years, due to the rapid development of computer technology, modern testing
    technology, and signal processing technology, equipment diagnosis technology has
    made great progress. With the rapid development of artificial intelligence technology,
    the application of deep neural network (DNN) in intelligent fault diagnosis (IFD)
    of mechanical systems has been further deepened.


    Deep learning (DL) is one of the hottest technologies in the current field of
    machine learning, and the MIT Technology Review ranked DL at the top of the ten
    breakthrough technologies of 2013 (Cohen 2015). DL is essentially a DNN with multiple
    hidden layers, and the main difference between it and the traditional multi-layer
    perceptron is the difference in the learning algorithm. Professor Hinton of the
    University of Toronto, a leader in the field of machine learning, first proposed
    the concept of “deep learning” and opened the wave of DL research in an article
    published in Science magazine (Hinton and Salakhutdinov2006). In 2015, a review
    published in Nature stated that DL allows computational models, composed of multiple
    processing layers, to learn data representations with multiple levels of the abstraction
    (LeCun, Bengio, and Hinton 2015).


    Due to its strong representation ability, DL is well-suited for data analysis
    and classification. Therefore, in the field of intelligent diagnosis, many researchers
    have applied DL-based techniques, such as multi-layer perceptron (MLP), autoencoder
    (AE), convolutional neural networks (CNNs), deep belief networks (DBNs), and recurrent
    neural networks (RNNs), to boost the performance. However, different researchers
    often recommended to use different inputs (such as time input, frequency domain
    input, time–frequency domain input, etc.) and different hyper-parameters (such
    as the learning rate, the size of the network architecture, etc.).


    Important conferences in the field of neural computing and machine learning, Conference
    on Neural Information Processing Systems (NIPS) and International Conference on
    Machine Learning (ICML), have set up DL topics since 2011, and companies such
    as Google, Microsoft, and Baidu have established special R&D departments to conduct
    industrialized research


