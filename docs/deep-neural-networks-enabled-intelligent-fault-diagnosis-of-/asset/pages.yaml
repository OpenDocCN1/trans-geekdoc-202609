    PROGNOSTICS AND HEALTH MANAGEMENT FOR MECHANICAL SYSTEMS


    The main focus of this section is to discuss the definition and development of
    PHM, to present a review that includes developed and applied PHM methods, and
    to present several unresolved challenges related to PHM.


    Introduction of PHM


    PHM, including monitoring, diagnosis, prognosis, and health management, occupies
    an increasingly important position in reducing costly breakdowns and catastrophic
    accidents in modern industry. The relationship between them is summarized in Figure
    1.1.

    Monitoring refers to fault detection, and its purpose is to determine whether
    the system is in a normal operating state, which anomaly detection is one of the
    most important tools to trace the corresponding health state. Diagnosis refers
    to the identification of the fault type and its corresponding degree. Prognosis
    makes use of appropriate models to assess the degree of performance degradation
    and further predicts the remaining useful life (RUL). Health management integrates
    outputs from monitoring, diagnosis, and prognosis, and makes optimal maintenance
    and logistic decisions considering economic costs and other available resources.


    An effective PHM system is expected to provide early detection and isolation of
    precursors/or sub-elements of early failures; the means to monitor and predict
    the progression of failures; assist in the development or autonomous triggering
    of maintenance programs and asset management decisions or actions. The condition
    of detected early failures should be monitored, progressing from a small failure
    to a larger one, until some maintenance action and/or replacement is required.
    By using such a system, the health of a machine, component, or system can be known
    at any point in time and the eventual occurrence of a fault can be predicted and
    prevented, enabling near-zero


    ![](img/f29bba55de4872c43f26af4667e705f2_12_0.png)


    FIGURE 1.1 Relationship between monitoring, diagnosis, prognosis, and health management.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction and Background 3


    downtime performance. Unnecessary and costly preventive maintenance can be eliminated,
    maintenance schedules can be optimized, and delivery times for spare parts can
    be reduced—all of which can lead to significant cost savings. In general, PHM
    will greatly improve the operational safety, system reliability, and maintainability
    of equipment, and reduce the cost of equipment throughout its life cycle at the
    same time.


    # Development of PHM


    The concepts and frameworks of PHM are based on known maintenance methods and
    diagnostic techniques such as preventive maintenance (PM), reliability-centered
    maintenance (RCM), and condition-based maintenance (CBM) (Lee, Wu, and Zhao 2014).
    The future development of PHM will be mutually informed and facilitated from various
    fields in addition to engineering.


    CBM comprises data acquisition and data processing (condition monitoring) to generate
    actionable information to inform maintenance decisions, thus avoiding unnecessary
    maintenance tasks. In recent years, more and more research efforts have turned
    to predictive and health management, i.e., early failure detection, health assessment,
    and RUL prediction. However, maintenance strategies should be different in various
    maintenance scenarios with different system complexity and uncertainty. Figures
    1.1 and 1.2 show diagrams of the conversion relationship between CBM, RCM, and
    PHM, which show the different maintenance strategies with the complexity and uncertainty
    of the system.


    CBM can be applied to systems that (1) can be considered deterministic to some
    extent, (2) are smooth or stationary, (3) and for which signaling variables can
    be extracted as indicators of good health, albeit with low dimensionality. If
    the system is a probabilistic system whose outputs cannot be easily determined
    using known relational models and are conditionally dependent on inputs, then
    the output data will not be repeatable observed at different times. As a result,
    future behavior cannot be accurately predicted based on the domain knowledge and
    historical observations of the system. For such a system full of uncertainty,
    RCM is more suitable. RCM focuses on the system''s ability to have expected reliability
    over time and utilizes statistical tools such as failure modes and effects


    ![](img/f29bba55de4872c43f26af4667e705f2_13_0.png)


    FIGURE 1.2 Maintenance transformation map.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    criticality analysis (FMECA) to retrieve information that can help identify failure
    modes and the probable duration before each mode occurs. RCM relies on estimates
    of total operational life expectancy, which can reduce unplanned or unnecessary
    maintenance if the system is stable and failure modes are well studied. However,
    RCM is still prone to large deviations in system dynamics and lacks insight into
    actual performance. Robust design should be considered if the uncertainty of the
    system is more complex, such as in a highly dynamic system whose behavior changes
    over time.


    PHM has been viewed as an evolutionary form of CBM. CBM technologies can provide
    inputs to predictive models in PHM and support timely and accurate decision-making
    to prevent downtime and maximize profits. Because of its ability to assess health
    and predict failures and downtime, PHM, complemented with other technologies,
    considered the foundation for advanced fields including self-maintenance, resilient
    systems, and engineered immune systems. The discipline of PHM needs to be further
    developed and expanded to build these fields.


    # Developed and Applied PHM Methods


    Current prognostic methods can be categorized into three groups, namely model-based
    methods, data-driven methods, and hybrid prognostic methods. A typical model-based
    approach consists of data generated from simulation models under nominal and degraded
    modes. Predictions of the remaining life of the system are generated by simulating
    multiple modes of operation of the system and blending the predictions of each
    mode with time-averaged model probability weights. If a reliable or accurate model
    of the system is not available, data-driven prognostic method is used to determine
    the remaining lifetime by tracking the trajectory of developing failures and predicting
    the amount of time before a predetermined threshold is reached. Two well-known
    tracking and prediction tools, the alpha-beta-gamma tracking filter and the Kalman
    filter, have been applied to gearbox prediction. Both filters have been investigated
    for their ability to track and smooth the features of gearbox vibration data.


    The concept of PHM has been deployed in several applications, leading to the development
    of various tools, techniques, and approaches. Several information fusion systems
    for engine PHM that integrate a variety of applicable data and suitable techniques
    are presented.


    By using a combination of health-monitoring data and model-based techniques, a
    comprehensive prognosis capabilities can be realized throughout the lifecycle.
    Literature proposes a methodology for future prognosis of lifigate systems using
    ARMA models with performance evaluation using logistic regression. Literature
    reviewed model-based prognosis methods for wheeled mobile robots. Literature describes
    an electronics prognosis method that utilizes thermal data to model stress and
    damage to electronic parts and structures. In a methodology for the prognosis
    of electronics, it is demonstrated that it is capable of evaluating developed
    devices based on phase growth and remaining life estimates. Literature proposes
    a model-based PHM technique for avionics that utilizes embedded life models and
    environmental information obtained from aircraftmounted sensors. With the widespread
    of batteries in different industries, data-driven battery-health-monitoring methods
    have emerged. These methods utilize voltage, current,'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction and Background 5


    temperature, and other measurements and use Bayesian techniques, such as particle
    filtering, to estimate battery RUL by combining the collected measurements with
    system dynamics. A number of research activities have also been reported on the
    structure of forecasting systems, such as maintenance levels, inventory policies,
    and supply chain management.


    # Challenges of PHM


    Due to the complexity of the physics involved in PHM in practice, the data available,
    and the requirements of real-world applications for PHM solutions, a number of
    challenges remain (Zhao et al. 2021).


    # Physics of the Problem


    The complexity, dynamics, and high nonlinearity of the structures, components
    (SSCs) degradation process makes it difficult to understand, characterize, and
    model the physical process of SSCs degradation.


    # Data Available


    The challenges related to the data come from multiple aspects: the anomalies in
    the real data collected in the field; the scarcity and incompleteness of the data
    in relation to the degraded state of the SSCs of interest; the difficulty in managing
    and processing big data because the large number of signals connected by the different
    types of sensors; and the changing operational and environmental conditions that
    can affect the data used for the training of the PHM models and the calibration
    of their parameters, as well as the data to which these models are applied.


    # Requirements of the Solutions


    The challenges related to the requirements of the PHM solutions come from the
    multiple objectives they must achieve, depending on the applications. The obvious
    ones are accuracy and precision, based on the vision that defines the performance
    metrics and the measurements they report: in some cases very high accuracy and
    precision are needed to be able to take confident decisions, in other cases accuracy
    and precision don''t have to be as high as may compromise other goals.


    # INTELLIGENT FAULT DIAGNOSIS FOR MECHANICAL SYSTEMS


    This section provides background and development of IFD.


    # Introduction of IFD


    IFD is the application of machine learning theory in machinery fault diagnosis
    (Lei, Yang, and Jiang 2020). It is an effective method to reduce human labor and
    automatically identify the health status of machines.


    Mechanical equipment is subject to performance degradation and even failure operations.
    Therefore, in addition to health monitoring of equipment, it is necessary to diagnose
    mechanical equipment failures. Failure information of equipment is often implicit
    in monitoring data such as vibration, acoustic emission, and temperature.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    Effectively capturing the fault information conveyed by the monitoring data changes,
    you can accurately identify the location, type, and even degree of failure of
    mechanical equipment. Long-term experience enables engineers to capture the health
    status information in the monitoring data changes. Therefore, by utilizing the
    empirical knowledge, it is possible to make a judgment on the health status of
    mechanical equipment. However, with the rapid improvement of the collection, storage,
    and transmission capabilities of the sensing system, the number, size, and type
    of monitoring signals of machinery and equipment continue to increase, providing
    a huge amount of data for machinery and equipment fault diagnosis, and it is difficult
    to satisfy the demand for fault diagnosis driven by big data only by the accumulation
    of human experience.


    With the rapid development of artificial intelligence, machine learning technology
    gives computers the ability to learn, so that they can analyze the data, generalize
    the laws, summarize the experience, and ultimately replace the human learning
    or their own experience process, and liberate human beings from the complicated
    sea of data.


    Therefore, IFD can be understood as the science of using big data to identify
    the health status of mechanical equipment, that is, based on the monitoring data
    obtained by the sensing system and through the accumulated experience and knowledge
    of machine learning, the intelligent recognition of the health status of the equipment
    ensures the reliability of mechanical equipment operation.


    # Machine Learning-Enabled IFD


    Most of the traditional fault diagnosis processes are performed by manually checking
    the health of the machine, which increases the labor intensity and reduces the
    accuracy of the diagnosis. Advanced signal processing methods can help determine
    the types of faults or where in the machine the faults are occurring. However,
    these methods rely on the expertise that maintenance personnel lack in engineering
    scenarios. Moreover, the diagnosis results of signal processing methods are too
    specialized to be understood by machine users. As a result, modern applications
    prefer fault diagnosis methods that can automatically recognize the health of
    a machine. With the help of machine learning theory, IFD is expected to fulfill
    the above purpose. In past IFD research, traditional machine learning theories
    such as artificial networks and support vector machines, were applied to machinery
    fault diagnosis. The diagnosis process consists of three steps: data collection,
    artificial feature extraction, and state identification, each of which is described
    in detail in the following subsections.


    # Data Collection


    In the data collection step, sensors are mounted on the machine to continuously
    collect data. Different sensors such as vibration sensors, acoustic emission sensors,
    temperature sensors, and current transformers are usually used. Among them, vibration
    data are widely used for troubleshooting bearings and gearboxes. Acoustic emission
    data has the potential to detect early failures and deformations in bearings and
    gears, especially in low-speed operation and low-frequency noise environments.
    Instantaneous RPM data is commonly used in engine troubleshooting and is highly
    resistant to interference. Current data plays'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'an important role in motor troubleshooting. This data can be easily collected
    using only current transformers and is not included in the operation of the machine.
    In addition, researchers have found that data from multiple sources of sensors
    have complementary information that can be fused to achieve higher diagnosis accuracy
    than data from just a single sensor.


    # Artificial Feature Extraction


    Artificial feature extraction is a two-step process. First, some commonly features
    such as time domain features, frequency domain features, and time–frequency domain
    features are extracted from the collected data. These features contain the operating
    condition information that reflects the operating condition of the machine. Second,
    feature selection methods such as filters, wrappers and embedding methods are
    used to select sensitive features of machine health status from the extracted
    features. This facilitates the elimination of redundant information and further
    improves the diagnosis results.


    # Health State Recognition


    Health state recognition uses a machine learning-based diagnosis model to establish
    the relationship between the selected features and the health state of the machine.
    To achieve this, the diagnosis model is first trained with labeled samples. The
    model is then able to recognize the health state of the machine when the input
    samples are unlabeled.


    Expert System-Based Approaches The expert system-based diagnosis models represent
    the diagnosis knowledge from experts in the form of inference algorithm to automatically
    recognize the health states of machines. However, the performance of diagnosis
    models relies heavily on expert knowledge that is difficult to access and express.
    Incorrect and incomplete knowledge may reduce the accuracy of diagnosis. In addition,
    the expert system lacks-learning capabilities, and the diagnostic base is difficult
    to expand and correct.


    ANN-Based Approaches Artificial neural networks (ANNs) imitate the activities
    of human brains for information processing, which is an effective way to establish
    the diagnosis models. This section reviews the applications of ANNs in fault diagnosis
    of machines. ANN-based diagnosis models have strong self-learning capabilities
    and can automatically learn diagnostic knowledge from input data to minimize empirical
    risks. In addition, there are two drawbacks. The complexity of the diagnostic
    model greatly increases with the increase of input data. The increase in model
    parameters reduces the training efficiency, which in turn leads to overfitting
    and reduces the diagnostic accuracy of the diagnostic model. Second, due to the
    lack of rigorous theoretical support, ANN-based diagnosis models are black-box.
    Therefore, their interpretability is low.


    SVM-Based Approaches Support vector machine (SVM) is a supervised learning method
    which is widely considered in classification tasks. We briefly review the theory
    of SVM and summarize its applications in fault diagnosis in this subsection. Difference
    from the'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    ANN, SVM-based diagnostic models are trained by minimizing the structural risk,
    which contributes to improving the interpretability of the model due to its theoretical
    rigor. The optimization objective solution of SVM is convex quadratic optimization
    which enables the diagnostic model to easily obtain the global optimal solution,
    in turn leads to a high accuracy. The diagnostic model based on SVM has three
    drawbacks to consider. However, they are difficult to handle massive amounts of
    data, which may lead to a computational curse. Second, the performance of SVM-based
    diagnostic models is very sensitive to kernel parameters. Inappropriate kernel
    parameters do not even yield reliable diagnostic results. For multi-class classification
    tasks in IFD, it is often necessary to use complex architectures such as OAA and
    OAO, etc. to integrate the results of multiple SVM-based models.


    # Deep Learning-Enabled IFD


    With the rapid growth of Internet technology and the Internet of Things (IoT),
    the amount of data being collected is greater than ever before. The growing of
    data provides more information for machine troubleshooting, which in turn is more
    likely to provide accurate diagnosis results. Unfortunately, previous fault diagnosis
    based on traditional machine learning theories is not suitable for such big data
    scenarios. Therefore, it is necessary to develop some advanced IFD methods. DL
    originates from the study of neural networks, which uses a deep hierarchy to automatically
    reconstruct abstract features and further establishes the relationship between
    the learned features and the target output. The diagnosis process based on DL
    consists of two steps: big data collection and DL-based diagnosis.


    # Big Data Collection


    Big data has become a popular term in modern industrial and other application
    scenarios. Typically, big data consists of four characteristics, namely volume,
    velocity, diversity, and accuracy. In contrast, big data for monitoring and controlling
    machines possesses these characteristics and further extends to very specialized
    areas. The characteristics are summarized as follows.


    Large Amount of Data The amount of data collected will continue to grow over the
    long-term operation of the machine, especially for large units such as wind turbines
    in wind farms.


    Low Value Density There is incomplete health information in the collected big
    data. In addition, a certain percentage of poor-quality data is mixed in the massive
    data.


    Multi-Source Heterogeneous Data Structure Multi-source data are collected by different
    types of sensors. In addition, the data is heterogeneous due to different storage
    structures.


    Monitoring Data Streams High-speed transmission channels enable immediate collection
    of data from machines.


    These characteristics are due to the following conditions. First, in modern industry,
    most production activities are performed by a group of machines. As a result,
    troubleshooting'
