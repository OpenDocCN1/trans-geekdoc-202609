    $+P(D_{val}, H(w^*)) \int q(\Lambda|\theta)d\Lambda$

    = \arg \min_0 \int q(\Lambda|\theta)\log \frac{q(\Lambda|\theta)}{P(\Lambda)P(D_{val},
    H(w^*))|\Lambda)} d\Lambda.quad (8.4)$


    $$\Lambda$ is the prior. This cost function is known as the expected lower bound.
    We follow the work of Blundell et al. (2015), who proposed an approximate form
    for the expected lower bound to allow more combinations of prior and variational
    families. We approximate Eq. (8.4):


    ```

    $$\Theta^* = \arg \min_{j=1}^n \sum_{k=1}^s \log q((\Lambda^j)^k|\theta)|-\log
    P((\Lambda^j)^k)-\log P(D_{val}, H(w^*)|(\Lambda^j)^k)\quad (8.5)$

    ```


    where $(\Lambda^j)^k$ denotes the $k$th Monte Carlo sample from the distribution
    in the posterior group, $n$ is the Monte Carlo sampling number and $n$ is set
    to 1 in the implement. The order of summation in Eq. (8.5) has been switched as
    they are adequately independent and finite. In our experimental study, we found
    this approximate form can adequately achieve our purpose.


    The reparameterization trick is used to calculate the unbiased Monte Carlo gradient
    for the optimization of Eq. (8.5). Each variational posterior in our work is set
    to a Gaussian distribution with a mean $\mu''$ and a standard deviation $\sigma''$.
    The standard deviation is parameterized as $\sigma'' = \log(1+\exp(\rho''))$ to
    be positive. So the parameters $\theta''=(\mu'',\rho'')$ need to be estimated.
    A sample of $\Lambda$ can be obtained from a unit Gaussian and the transform is:
    $\hat{\Lambda}''=\mu''+\log(1+\exp(\rho''))\circ \epsilon''$ where $\hat{\Lambda}''$
    is a sampling instance from $\Lambda''$, $\epsilon''$ is sampled from a unit Gaussian
    and $\\circ$ represents pointwise multiplication. The forward calculation of the
    DAG is:


    $f_{DAG}(x) = \left\{ \begin{matrix} \mu_1'' & \dots & \mu_8'' \ \vdots & \ddots
