    features extracted from acoustic signals, early fault detection of the single-phase
    induction-motor can be achieved (Glowacz and Glowacz 2017).


    However, to achieve reliable and robust motor fault diagnosis and realize the
    detection of several faults simultaneously, including stator faults, rotor faults,
    and bearing faults, various types of sensor signals could be leveraged together.
    This is because each type of sensor contains specific information related to certain
    working condition. Thus, combining these signals and analyzing them together can
    be an effective way to realize multi-fault diagnosis under complex conditions.


    In fact, feature extraction from sensor signals is a crucial step, and the performance
    of the fault diagnosis method depends on how precise the extracted features can
    represent the fault signature of the monitored induction motor. Nevertheless,
    the performance of conventional feature-based fault diagnosis depends on the quality
    of extracted features and its suitability to a certain task. This requires expert
    knowledge and human intervention, consequently bringing uncertainty to overall
    performance. Compared with traditional ways in fault diagnosis, deep learning
    (DL) method can learn representations and patterns hierarchically from the input
    data and select those that represent machine working condition through gradually
    adjusting weights. With by making use of the deep architecture and massive training
    data, DL method has the ability to model complex conditions and output accurate
    predictions. There are several typical deep architectures that have been successfully
    applied to machine fault diagnosis, including deep belief networks (DBNs) autoencoders
    (AEs) (Vincent et al. 2008), deep neural networks (CNNs) (Rawat and Wang 2017).
    For example, an intelligent approach based on stacked denoising AE and deep feature
    ensemble was applied to motor fault diagnosis (Wang et al. 2017). Furthermore,
    one-layer AE-based neural network proved to be effective in the task of fault
    classification for induction motors (Sun et al. 2016). DBN model was successfully
    applied for induction motor fault diagnosis using the frequency spectrum of vibration
    signals (Shao et al. 2017). DBN-based classification model was proposed and the
    model was verified in aircraft engine application (Tamilselvan and Wang 2013).
    One-dimensional CNN was built to analyze the time-series data of motors and to
    be successful in diagnosing fault motor bearing dataset (Ince et al. 2016), and
    a new CNN architecture based on LeNet-5 was proposed to process motor bearing
    (Wen et al. 2017). It is seen that all the previous researches use one type of
    signal. However, it can characterize only partial information of the induction
    motor. As the information related to different fault signatures in a single signal
    is limited, there is a limitation in fault classification accuracy in real applications.


    Aiming at overcoming the limitation caused by single-sensor signal and improving
    fault classification accuracy and model stability, a multi-signal-CNN approach
    using time-frequency distribution (TFD) is proposed in this chapter, and both
    the vibration and current signals are leveraged. Compared with previous works,
    the proposed deep architecture is able to learn from multiple input signals simultaneously
    so that the classification accuracy and the stability of the deep model are improved.'
