    $\alpha$ denote the ratio of $N_t$ to $N$, then the above case can be viewed as
    an SSL problem with a label $\alpha$.


    In general, SSL methods are categorized into three classes. The first one is unsupervised
    pre-training, which initially learns representation from unlabeled data via unsupervised
    approaches and fine-tuning the model on labeled data. Another method is self-training
    (Lee 2013; Tai, Bailis, and Valiant 2021), which first trains the network on labeled
    data and then utilizes the model to classify unlabeled samples. Afterward, samples
    with high classification confidence are added to the training set to train the
    network, and so on. Co-training methods (Jawed, Grabocka, and Schmidt-Thieme 2020;
    Laine and Aila 2016) D. Rasmus et al. 2015; Lee et al. 2022) jointly train the
    model with both labeled and unlabeled data, which output a supervised $L_s$ and
    an unsupervised $L_u$, as formulated in:


    ```

    $L = L_s + \omega L_u \quad (9.1)$

    ```


    where $\omega$ is a hyper-parameter to adjust the weight of $L_s$ and $L_u$.

    To integrate self-supervised tasks into SSL, our work follows the co-training
    framework, which learns an end-to-end diagnostic model with few labeled data.


    # Self-Supervised Learning


    Previous self-supervised works (Doersch, Gupta, and Efros 2015; Gidaris, Singh,
    and Komodakis 2018) use handcrafted prediction tasks to learn context-level representation,
    which gains discriminative information comparing a sample with its contextual
    environment. For example, Doersch et al. (2015) generate different sub-segments
    by cutting the images and trains the model to predict their relative position.
    Recently, instance-instance contrastive directly learns the instance-level relationship
    between different samples by metric learning. Deep cluster (Caron et al. 2018)
    first clusters data into various classes, and then utilizes the index of each
    instance as its target label. However, it is time-consuming for two-stage. Instance
    discrimination methods (Chen et al. 2020; Grill et al. 2020; He et al. 2020) propose
    a triplet including anchor, positive and negative representations in the embedding
    space, where the anchor should be closed to the positive feature and away from
    the negative one. MoCo (He et al. 2020) introduced memory and momentum encoder
    to increase more negative pairs SimCLR (Chen et al. 2020) added a nonlinear mapping
    between the encoder and further increased the number of negative samples. BYOL
    (Grill et al. 2020) proposed a self-supervised paradigm needless of negative samples.
    They adopted an asymmetric network, which attached a predictor to one branch of
    the Siamese network and stopped the gradient back-propagation of the other branch.
    Most recently, feature de-correlation methods such as Barlow Twins (Zbontar 2021)
    proposed a regularization term by decreasing the redundancy of the cross-correlation
    matrix, which provided a new solution for self-supervised learning.


    The above methods have made a good performance. However, they neglected the influence
    of context information on classification tasks. In this work, we neglected the
