    For the output $a_i^3$ of the third layer ($l=3$), the calculation process is
    as follows:


    ```

    $a_i^3 = \sigma(z_i^3) = \sigma(w_{i1}x_1 + w_{i2}x_2 + w_{i3}x_3 + b_i^3)$

    ```


    Generalizing the example, assuming there $m$ neurons in the $(l-1)$-th layer,
    the calculation for the output $a_j^l$ of the $j$th neuron in the $l$th layer
    can be expressed as follows:


    ```

    $a_j^l = \sigma(z_j^l) = \sum_{k=1}^m w_{jk}^l a_k^{l-1} + b_j^l$

    ```


    If $l=2$, $a_k^l=x_k$ in the input layer. In addition, if we use the matrix notation,
    it becomes more concise. There are $m$ neurons in the $(l-1)$-th layer and $n$
    neurons in the $l$th layer, the linear coefficients $w$ of the $l$th layer form
    an $n \times m$ matrix $W^l$. The biases $b$ of the $l$th layer form an $n \times
    1$ vector $b^l$. The outputs of the $(l-1)$-th layer form an $n \times 1$ vector
    $a^{l-1}$. The outputs of the $l$th layer before activation function form an $n
    \times 1$ vector $z^l$. The outputs of the $l$th layer form an $n \times 1$ vector
    $a^l$. Represented using matrix notation, the output of the $l$th layer is:


    ```

    $a^l = \sigma(z^l) = \sigma(Wa^{l-1} + b^l)$

    ```


    The value of $l$ ranges from 2 to $L$. The final result of the output layer is
    $a^l$.


    # Backward Propagation Algorithm


    Before performing the DNN backpropagation (BP) algorithm, it''s necessary to choose
    a loss function to minimize the loss between the calculated output for training
    samples and the actual output of the training samples. The common method to measure
    loss is the mean squared error (MSE) which is often used for regression. For each
    sample, we aim to minimize the following expression:


    ```

    $J(W,b,x,y) = \frac{1}{2} ||\hat{y} - y||_2^2$

    ```


    where $\hat{y}$ is the output at the last layer and has the same shape as $y$.'
