    Applications to IFD


    BDA was used by Wang and Wu (2018) to adaptively construct feature importance
    of the marginal and conditional distribution discrepancy between features learned
    by deep neural networks for IFD. The CORAL loss (Wang, He, and Li 2019) and maximum
    variance discrepancy (MVD) (Zhang et al. 2020) were used to reduce the distribution
    discrepancy between different domains. (Qian, Li, and Wang 2018) constructed the
    higher-order moments and proposed an HKL divergence to adjust distribution for
    rotating machine fault diagnosis. The distance designed to measure source and
    target representations was proposed in (Hu, Wang, and Gu 2020) to align tensor
    representations into the invariant subspace for bearing fault diagnosis.


    Another metric distance, called MMD, was widely used in the field of intelligent
    diagnosis (Lu et al. 2016). (Tong et al. 2018) reduced marginal and conditional
    distributions simultaneously across domains based on MMD in the feature space
    by refining pseudo test labels for fault diagnosis. Wang et al. (2020) proposed
    a conditional MMD based on estimated pseudo labels to shorten the conditional
    distribution distance for fault diagnosis. The marginal and conditional distributions
    were aligned simultaneously in multiple layers by minimizing MMD (Li et al. 2020a


    MK-MMD was used in (Li et al. 2019) to better transfer the distribution of learned
    features in the source domain to that the target domain for IFD. Han et al. (2020)
    used JDA to adapt both conditional and marginal distributions simultaneously to
    construct a more effective and robust feature representation for substantial distribution
    difference. Wang et al. (2021) further used the grey optimization algorithm to
    learn the parameters of JDA. Based on JMMD, Cao, Chen, and Zeng (2020) proposed
    a soft JMMD to reduce both the marginal and conditional distribution discrepancy
    with the enhancement of auxiliary soft labels.'
