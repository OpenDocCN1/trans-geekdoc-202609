    # Further Discussions


    Transferability of Features The reason why DL models embedded transfer learning
    methods can achieve breakthrough performance in computer vision is that many studies
    have shown'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 130 ■ Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
    Systems


    and proved that DL models can learn more transferable features for tasks than
    traditional hand-crafted (Glorot, Bordes, and Bengio 2010), (Yosinski et al. 2014).
    In spite of the ability to learn general and transferable features, DL models
    also exist from general features to specific features and their transferability
    drops significantly in the last layers (Yosinski et al. 2014). Therefore, fine-tuning
    DL models or adding various transfer learning strategies into the transfer process
    need to be investigated for realizing the valid transfer.


    However, for IFD, there is no research about how features are in DL models, and
    actually, answering this problem is the most important cornerstone in UDTL-based
    IFD. Since the aim of this section is to give a comparative analysis and recover
    a code library, we just assume that the bottleneck layer is the task-specific
    layer and its output features are retained with various transfer learning strategies.
    This is imperative and vital for scholars to study transferability of features
    and answer the question about how transferable features are learned. In order
    to make transferability of features more reasonable, we suggest that scholars
    might need to visualize features by existing visualization algorithms (Zeiler
    and Fergus 2014).


    Influence of Backbones and Bottleneck Backbones of published UDTL-based IFD are
    often different, which makes results hard to compare directly, and influence of
    different backbones has never been studied thoroughly. Whereas, backbones of UDTL-based
    algorithms do a huge impact on results from comparisons between CWRU with the
    frequency domain input.


    Finding a strong and suitable backbone, which can learn more transferable features
    for IFD, is also very important for UDTL-based methods (sometimes choosing a more
    effective backbone is more important than using a more advanced algorithm). We
    suggest that scholars should find a strong backbone and use the same backbone
    to compare results for avoiding unfair comparisons.


    In the top comparison, we discuss the influence of backbones. However, in our
    designed structure, the bottleneck layer in the source domain also shares parameters
    with in the target domain. It is necessary to discuss the influence of the bottleneck
    layer during the transfer learning procedure. For the sake of simplicity, we only
    use CWRU with two transfer inputs to two representative UDTL methods, including
    MK-MMD and DANN.


    We use Type to represent original models in this section, Type II to represent
    models without the bottleneck layer, and Type III to represent models with fixed
    parameters of backbones (their parameters are pretrained by the source data) when
    starting transfer learning (only updating parameters of the bottleneck layer during
    the transfer learning procedure). The comparison results are shown in Figure 7.14.
    We observe that for the time domain input, it is the same with and without the
    bottleneck layer. Likewise, the frequency domain input, is also difficult to judge
    which one is better. Thus, choosing a suitable network (according to datasets,
    transfer learning methods, input types, etc.), can learn more transferable features,
    is very important for UDTL-based methods. In addition, it is clear that when parameters
    of backbones are fixed during the transfer learning procedure, the accuracy in
    the target domain decreases dramatically, which means that backbones trained using
    the source data cannot be transferred directly to the target domain.'
