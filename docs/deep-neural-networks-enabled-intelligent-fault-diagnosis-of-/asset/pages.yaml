  md: '# Autoencoders for Intelligent Fault Diagnosis


    # INTRODUCTION


    Induction motor, as one of the industrial power driving sources, occupies an important
    position in national economy and has been widely used to drive many kinds of machinery
    and industrial equipment, such as lifting hoist equipment, mining equipment, machine
    tools. In order to guarantee normal operation of induction motors with timely
    maintenance, and avoid unnecessary loss, fault diagnosis on them is necessary
    (Benbouzid 2000; Huang and Yu 2013). However, due to environmental interference
    and inherent motor structure complexity, effective fault diagnosis for induction
    motors is challenging. Till date, various sensing techniques (Filippetti et al.
    1998; Rodriguez, Belahcen, and Arkkio 2006; Pires et al. 2013) have been employed
    to measure physical quantities, such as current, vibration, radial and axial flux,
    rotor speed, etc., for the purpose of identifying induction motor faults. This
    is based on the fact that properties of induction motor may change when damages
    occur in it and such property change could be reflected in the measurement data.
    By extracting features from this measurement data, a classifier can then be built
    to distinguish different faults in induction motors. Therefore the fault diagnosis
    problem can be converted into a classification problem which can be solved by
    learning-based algorithms such as neural network (Malhi, Yan, and Gao 2011; Ahmadizar
    et al. 2015) and support vector machine (Li et al. 2013; Bordoli and Twiari 2014).


    In the field of fault diagnosis, majority of machine learning algorithms are supervised
    learning algorithms which need a large amount of labeled data for training. Since
    neural networks possess strong representation ability due to their stacked hidden
    layers, they have been used as classifiers for fault diagnosis (Kuo 1995; Alexander
    2003; Su, Chong, and Kumar 2011). However, the training of neural networks also
    needs large amount of high-quality data, and if the samples are limited or contaminated
    the testing data, the neural network may be easily overfitted which leads to a
    poor generalization especially for a complex classification problem. The induction
    motor'
