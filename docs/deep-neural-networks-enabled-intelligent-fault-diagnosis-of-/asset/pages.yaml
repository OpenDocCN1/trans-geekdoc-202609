    To test bias, all datasets are firstly split into the training set, validation
    set and test set with the ratio of 60%:20%:20%. Later, to simulate the label-insufficient
    setting, we select the label α introduced in section II to determine the size
    of labeled samples. For a health condition with N samples, we only retain samples
    of random [α×N] samples and remove leaves of other samples. Here, [] is the floor
    operator. In later experiments, the labeling rate α is set to 10%, 20%, 40% to
    evaluate the model performance on different degrees of label scarcity, and 100%
    to get the upper bound of the performance.


