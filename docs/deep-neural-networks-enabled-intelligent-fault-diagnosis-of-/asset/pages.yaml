    # CONCLUSION


    This chapter presents a deep learning model based on DBN, where frequency distribution
    of the measured data used as input for fault diagnosis of motors in manufacturing.
    This deep architecture uses RBM as a building unit, and uses greedy-wise training
    for model construction. The presented approach uses strong capabilities of DBN,
    which can model high-dimensional data and learn multiple layers of representation,
    reducing training error and improving classification accuracy. Experimental studies
    are carried out using vibration signals to verify the effectiveness of the DBN
    model for feature learning, providing a new way of feature extraction for automatic
    fault diagnosis in manufacturing.


