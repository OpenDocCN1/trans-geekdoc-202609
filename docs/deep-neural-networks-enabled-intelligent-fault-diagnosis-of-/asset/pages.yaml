  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    # BASIC MODULES OF CNN


    This section is going to present the basic structure of CNNs. As shown in Figure
    4.1, the basic structure of CNN is mainly composed of convolutional layer, pooling
    layer, and fully connected layer. Considering that 2D-CNN has been illustrated
    extensively in previous research compared to 1D-CNN, in this section, the mathematical
    details behind 1D-CNN are given.


    Convolutional Layer


    The input of the convolutional layer is a sequential signal with length D. The
    convolutional filter with size N is applied to the whole input signal. Specifically,
    the convolution operation in the convolutional layer can be defined as a multiplication
    operation between a filter vector, $w \in R^N$, and a concatenation vector $x_{ij:ij+N-1}$
    which is given as:


    ```

    $x_{ij+N-1} = x_{ij} \circledast x_{ij+1} \circledast \ \dots \circledast x_{ij+N-1}$

    ```


    where $x_{ij+N-1}$ can represent a window of $N$ length sequential signal starting
    from the point indexed as $i+N-1$, and $\circledast$ concatenates each data point
    into a longer embedding. In addition, a bias term $b$ is also added into the convolution
    operation so that the final operation is given as the following equation:


    ```

    $z_i = \phi(w^T x_{ij:ij+N-1} + b)$

    ```


    where $w^T$ denotes the matrix transpose of a matrix $w$ and $\phi$ is a nonlinear
    activation function such as Sigmoid, Hyperbolic Tangent, or ReLU. Each specific
    vector $w$ can be regarded as a convolutional filter. The single value $z$, can
    be regarded as the learned feature for the window of sequences in the corresponding
    filter. In addition, the width of the filter, i.e., $N$ can be varied.


    ![](img/f29bba55de4872c43f26af4667e705f2_70_0.png)


    FIGURE 4.1 Basic structure of convolutional neural networks.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Convolutional Neural Networks for Intelligent Fault Diagnosis 61


    Each raw sequence with a length $D$ has multi-windows of sequences $\{x_{1:N},
    x_{2:N+1}, \dots, x_{D-N+1:D}\}$, a feature map can be obtained and the length
    of the feature map is determined based on the length of raw sequence $D$ and the
    filter window size $N$. The feature map of the $j$-th filter can be denoted as:


    ```

    $z_j = [z_j^1, z_j^2, \dots, z_j^{N+1}]$ (4.3)

    ```


    the index $j$ denotes the $j$-th filter.


    # Pooling Layer


    A pooling layer is applied to the feature maps generated by the convolutional
    layer. The purpose of the pooling layer is twofold. The pooling operation will
    extract the most important and invariant information considering the single feature
    is irrelevant to the positions of activations in each feature map. Second, the
    pooling operation can reduce the feature dimensionality and guarantee the capability
    of addressing input signals with various lengths. Normally, average-pooling and
    max-pooling are widely adopted. Here, the average-pooling function is applied
    as an example.


    An average-pooling with a pooling length $g$ is conducted in the feature maps
    obtained by the convolutional layer. Then, the single feature corresponding to
    the filter can be obtained as:


    ```

    $h_j = [h_j^1, h_j^2, \dots, h_j^g]$ (4.4)

    ```


    ```

    $h_j = \frac{1}{g} \sum_{i=1}^g z_j^{(i-1)g+i}$ (4.5)

    ```


    $h_j$ is an $s$-dimensional vector, which is the output of pooling layer applied
    to the $j$-th feature map and $s = (D-N+1)/g$ with $D, N$, and $g$ being the length
    of the input, filter size, and pooling size, respectively. Generally, multiple
    filters are applied with different weights and different window sizes to derive
    a feature vector. Assuming there are K filters, the output of the pooling layer
    is the concatenation of all outputs after pooling, as shown in the following equation:


    ```

    $q = [h_1, h_2, \dots, h_K]$ (4.6)

    ```


    # Fully Connected Layer


    All the neuron nodes of the fully connected layer are connected to all the neuron
    nodes of the feature map of the upper pooling layer output. The output of fully
    connected layer can be written as:


    ```

    $g(q) = \phi(w_iq + b_i)$ (4.7)

    ```


    $q$ is the input of the fully connected layer, $g(q)$ is the output of the fully
    connected layer, $w_i$ is the connected weights, $b_i$ is the additive bias, and
    $\phi$ is the activation function.'
