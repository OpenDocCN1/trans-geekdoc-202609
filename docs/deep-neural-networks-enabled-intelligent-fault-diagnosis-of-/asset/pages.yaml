  md: "# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems\n\
    \nDeep Q Network\n\nDeep Q network (DQN), as a representative achievement of DRL,\
    \ has achieved salient performance in practice when playing Atari games. It mainly\
    \ integrates deep neural network (DNN) with Q-learning algorithm for autonomously\
    \ learning the behavior policy $\\pi_\theta$ by interaction with the environment,\
    \ which maps a given state $s\\in S$ to an action $a\\in A$ such that $a=\\pi_\t\
    heta(s)$. In the interactive process, the agent is to maximize the cumulated reward\
    \ $R_t$ at time $t$, which is discounted by a factor of $\\gamma$ per time-step\
    \ and defined as:\n\n```\n$R_t = \\sum_{t'=t}^{T}\\gamma^{t'-t}r_{t'}$\n```\n\n\
    where $T$ indicates the terminated time step, $\\gamma$ is the discount factor.\
    \ The smaller the value of $\\gamma$ is, the more the agent focuses on the current\
    \ reward.\n\nFor the Q-learning algorithm, its action-value function $Q^\\pi(s,a)$\
    \ under the policy $\\pi$ is defined as\n\n```\n$Q^*(s,a)=\\mathbb{E}_\\pi[R_t|s=s,a_t=a;\\\
    pi]$\n```\n\nwhere $\\mathbb{E}_\\pi$ is the expected return under the policy\
    \ $\\pi$. The temporal-difference updating of Q-learning is expressed by:\n\n\
    ```\n$Q(s,a)\\leftarrow Q(s,a)+\\alpha(r+\\gamma\\max_{a'}Q(s',a')-Q(s,a))$\n\
    ```\n\nwhere $Q(s,a)$ indicates the action-value function and $\\alpha$ is the\
    \ learning rate. The optimal action-value function $Q^*(s,a)=\\max_\\pi Q^*(s,a)$\
    \ obeys the Bellman equation and is written as:\n\n```\n$Q^*(s,a)=\\mathbb{E}[r+\\\
    gamma\\max_{a'}Q^*(s',a')|s,a]$$\n```\n\nIn DQN, DNN is used to approximate the\
    \ action-value function $Q^*(s,a)$ in the policy $\\pi$\n\n```\n$Q(s,a;\\theta)=Q^*(s,a)$\n\
    ```\n\nwhere $\theta$ is the parameters of the DNN model.\n\nIn the process of\
    \ the agent's interaction with the environment, $\\epsilon$-greedy algorithm,\
    \ is used to balance \"exploration\" (random action $a\\in A$) and \"exploitation\"\
    \ (action $a$ with $arg\\max_aQ(s,a;\\theta)$ and generate a series of experiences\
    \ defined as $e=(s,r,s')$. These experience samples are stored in ER buffer $B$.\
    \ Then, ER is utilized to sample experience samples from the ER buffer randomly,\
    \ thereby updating the DNN model."
