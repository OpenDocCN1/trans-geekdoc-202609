  md: '# Neural Architecture Search for Intelligent Fault Diagnosis █ 151


    Discussion of Sparseness


    In practice, it has been found that the sampled architecture with the maximum
    validation accuracy was not the best model in the testing phase (Li et al. 2020).
    The reason for this phenomenon lies in the bias between the hyper-network and
    the sub-network, which is the inherent problem of the differentiable search strategy.
    As mentioned above, DARTS will select the operators with the maximum coefficients
    from each of the mixed edges to construct the final searched sub-network. The
    other seven operators in one mixed edge will be dropped, although they also provide
    in the hyper-network as their coefficients are not zero. The deletion results
    in a bias between the hyper-network and sub-network, but also suffers from the
    bias. Therefore, to alleviate this problem, sparseness is used to assist the validation
    accuracy to select sub-networks. Firstly, we select the architectures with top
    50 validation accuracy as a subset. Then the architectures with top 10 sparseness
    are selected from the subset as the final set. Figure 8.9 shows the bivariate
    distribution of validation accuracy and sparseness. Table 8.4 shows the testing
    accuracy and sparseness of the architecture with highest validation accuracy and
    the best architecture in the set with top 10 sparseness. It can be seen that the
    architectures with highest validation accuracy are not the best in the testing
    phase. An architecture balancing validation accuracy and sparseness is more likely
    to perform better


