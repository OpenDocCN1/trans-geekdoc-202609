  md: '# Neural Architecture Search for Intelligent Fault Diagnosis ■ 145


    Forward Sampling from the Posterior Distributions Group

    By optimizing the sampling distributions group, the posterior is obtained to estimate
    the uncertainty for model matching. Then the candidate architectures set can be
    sampled from the posterior via random sampling. There is no time sequence or dependency
    in the sampling, so it is convenient for parallel acceleration. In fact, strategic
    sampling approach is allowed, e.g., the margin-focused sampling strategy, but
    in practice, the random sampling is sufficient to fix the set. Two metrics, accuracy
    and sparseness, are used to evaluate the sampled architecture, where the accuracy
    is for the validation dataset, (Hoyer 2004):


    ```

    $$\text{Sparseness}(\Lambda) := \sqrt{m - \frac{\sum_{i,j} (\Lambda_{i,j})^2}{\sqrt{m-1}}}
    \quad\quad\quad\quad (8.9)$

    ```


    $m$ is the dimensionality of $\Lambda$ and $m$ is equal $14 \times 8$. Sorting
    by the sparseness of the sampling instance matrix, the deviation caused by sampling
    from the continuous space is reduced. It is worth pointing out the difference
    between our method and the stochastic neural architecture search (SNAS (Xie et
    al. 2018)). The sampling in our work is subject to the $\partial o$ principle
    where the posterior is Gaussian, and the uncertainty estimation of model matching
    is also given, whereas sampling in SNAS is realized by a random one-hot mask.


