    # CONCLUSION


    In this chapter, an SAE-based DNN approach has been developed for induction motor
    fault diagnosis. This approach can learn features directly from raw data, which
    are discriminative over different working conditions of the induction motors.
    When the denoising coding is integrated with the SAE, it improves the robustness
    of the learned features and the stability of the DNN against disturbance. The
    dropout technique integrated into the network classifier design reduces the overfitting
    in the training and improves the performance of the DNN for induction motor fault
    classification. Experimental study and a detailed analysis have verified the effectiveness
    of the SAE-based DNN for induction fault diagnosis.


