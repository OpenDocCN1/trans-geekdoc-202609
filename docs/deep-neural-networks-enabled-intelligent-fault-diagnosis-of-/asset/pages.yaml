    \nClassification is usually carried out on the final output layer of the fully\
    \ connected layers using the Softmax classifier (Liao et al. 2015), which is an\
    \ extension of the Logistic classifier, and mainly solves multi-class problems.\
    \ Assuming an input sample x with the corresponding label y, the probability of\
    \ the sample judged as a class j is p(y|x). So, for a c classifier, the output\
    \ will be a c-dimensional vector as shown in Eq. (4.8).\n\n```\ng_0(x^{(i)}) =\
    \ \\begin{bmatrix} p(y^{(i)}=1|x^{(i)};\\theta) \\ p(y^{(i)}=2|x^{(i)};\\theta)\
    \ \\ \\vdots \\ p(y^{(i)}=c|x^{(i)};\\theta) \\end{bmatrix} = \\sum_{j=1}^c \\\
    begin{bmatrix} e^{\\theta_1 x^{(i)}} \\ e^{\\theta_2 x^{(i)}} \\ \\vdots \\ e^{\\\
    theta_c x^{(i)}} \\end{bmatrix} (4.8)\n```\n\nWhen $\theta$ is the model parameter,\
    \ $1/\\sum_{j=1}^c e^{\\theta_j x^{(i)}}$ is a normalization function that normalizes\
    \ the probability distribution so all probabilities sum to 1.\nThe cost function\
    \ $J(\\theta)$ of Softmax classifier is minimized by multiple iterations using\
    \ the gradient descent method, and thereby completing the network training. $J(\\\
    theta)$ is expressed as:\n\n```\nJ(\\theta) = -\\frac{1}{m}\\sum_{i=1}^m\\sum_{j=1}^c\
    \ \\{y^{(i)} = j\\ \\log \\frac{e^{\\theta_j x^{(i)}}}{\\sum_{k=1}^c e^{\\theta_k\
    \ x^{(i)}}} (4.9)\n```\n\nwhere $[\\cdot]$ is an indicator function, namely, when\
    \ the value in brace is true, the function value is 1, otherwise the value is\
    \ 0. And $m$ indicates the number of data samples.\nThus, after an input sample\
    \ is alternately propagated through multiple convolutional and pooling layers,\
    \ the extracted features will be forwarded to the fully connected layers and finally\
