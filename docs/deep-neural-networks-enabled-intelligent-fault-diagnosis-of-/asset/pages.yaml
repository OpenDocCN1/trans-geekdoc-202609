    Physical Priors For UDTL-based IFD, many scholars only introduce methods, which
    have already existed in other fields, to perform IF tasks and pay less attention
    to the prior knowledge behind the data (lack of using special phenomena or rules
    in physical systems). Therefore, we suggest that scholars can learn from core
    ideas in the field of transfer learning (not just using the existing methods)
    and introduce prior knowledge of physical systems into the proposed method to
    construct more targeted and suitable diagnostic models with higher recognition
    rates in industrial applications.


    Other Aspects Although a large amount of data in different conditions can be collected,
    fault data in some conditions are still scarce. Due to the fact that most machines
    operate in a normal condition, the class-imbalanced problem naturally exists in
    real applications. Thus, imbalanced learning or few shot learning with transfer
    learning methods (Wu et al. 2020) might also be an important direction for better
    getting constructed algorithms off the ground.


    Federated transfer learning (FTL) (Liu et al. 2020) provides a safer and more
    reliable approach for specific industries. At the same time, based on characteristics
    of transfer learning, FTL participants can own their own feature space without
    requiring all participants to'
  merge: -1
  img_proc: true
