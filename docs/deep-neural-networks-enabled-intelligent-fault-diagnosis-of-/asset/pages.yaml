- pgno: 1
  md: '# Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    This book aims to highlight the potential of deep learning (DL)-enabled methods
    in intelligent fault diagnosis (IFD), along with their benefits and contributions.


    The authors first introduce basic applications of DL-enabled IFD, including autoencoders,
    deep belief networks, and convolutional neural networks. Advanced topics of DL-enabled
    IFD are also explored, such as data augmentation, multi-sensor fusion, unsupervised
    deep transfer learning, neural architecture search, self-supervised learning,
    and reinforcement learning. Aiming to revolutionize the nature of IFD, this book
    contributes to improved efficiency, safety, and reliability of mechanical systems
    in various industrial domains.


    The book will appeal to academic researchers, practitioners, and students in the
    fields of intelligent fault diagnosis, prognosis and health management, and deep
    learning.


    Ruqiang Yan is a professor at the School of Mechanical Engineering, Xi''an Jiaotong
    University. His research interests include data analytics, artificial intelligence,
    and energy-efficient sensing and sensor networks for the condition monitoring
    and health diagnosis of large-scale, complex, dynamical systems.


    Zhibin Zhao is an assistant professor at the School of Mechanical Engineering,
    Xi''an Jiaotong University. His research interests include sparse signal processing
    and machine learning, especially deep learning for machine fault detection, diagnosis,
    and prognosis.'
