    # INTRODUCTION


    Nowadays, induction motor is widely used in mechanical systems and it is an essential
    component of manufacturing machines where incipient faults during machine operation
    can pose threats to system reliability. The failures of induction motor in operation
    may cause accidents, which can bring huge economic losses and even casualties.
    Therefore, it is important to evaluate the working state of induction motors,
    detect potential faults, and then take proper action to prevent machine failure
    from happening (Elbouchikhi et al. 2017). Accordingly, induction motor fault diagnosis
    techniques plays a significant role in safety production and equipment maintenance,
    and it can improve machine quality, enhancing working safety, and reduce maintenance
    cost (Sun et al. 2017).


    Many research studies have been carried out for developing reliable and efficient
    induction motor fault diagnosis (Hassan et al. 2018). For decades, many fault
    diagnosis methods have been based on motor current analysis which is called motor
    current signature analysis (MCSA). After data acquisition, critical features associated
    with the working state are extracted from motor current using signal processing
    techniques. MCSA has been one of the most widely used fault diagnosis techniques
    for motor as it is inexpensive and noninvasive (Tian et al. 2018), and it turns
    out to be successful in detecting stator faults and rotor faults (Da Silva, Povinelli,
    and Demeransch 2008). Sapena-Bano et al. (2015) proposed a framework using Fast
    Fourier transform (FFT)-based stator current analysis to diagnose the faults of
    electrical machines in transient conditions. Spectral analysis of the stator current
    based on Hilbert transform was also utilized (Noureddine, Hafaifa, and Kouzouz
    2017). Although MCSA has achieved much success in various applications, its performance
    is influenced by voltage harmonics, induced harmonics, and other disturbances.
    Recently, vibration signals and acoustic signals have also been utilized to analyze
    motor working conditions, especially in detecting bearing faults (Delgado-Arredondo
    et al. 2017). Recognizing'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 92 Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
