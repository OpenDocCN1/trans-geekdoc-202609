    this chapter regards the planetary gearbox''s fault diagnosis as a guessing game.
    Also, a game emulator where fault diagnosis is transformed into a sequential decision-making
    problem is built, thereby realizing it by DRL successfully. The training dataset
    that is deemed as a guessing repertory is $D_{train} = \{(x_1, l_1), (x_2, l_2),
    ..., (x_n, l_n)\}$ where $x_i \in X$ is the $i$-th sample and $l_i \in L$ is the
    $i$-th label corresponding to the sample $x_i$, in each round processes $T$ questions
    matching training data $D_{train} = \{(x_1, l_1), (x_2, l_2), ..., (x_n, l_n)\}$
    that are generated from the training dataset $D_{train}$, and then agent guesses
    these questions sequentially according to the order of samples in D.


    In this game, the agent observes a sample at each time and guesses (classifies)
    its category. Subsequently, the environment returns an agent immediate reward
    and the next guessing question (i.e., the next sample), as depicted in Figure
    10.1. The game''s reward mechanism is defined as that if the agent guesses the
    category of the sample correctly, a positive reward is awarded; otherwise, a negative
    reward is given to the agent. The objective of the agent is to maximize accumulated
    rewards in this game under an optimal behavior policy that is learned from its
    continual interaction with the environment.


    Classification Markov Decision Process


    To play the above guessing game with DRL easily, we define this game in a CMDP
    framework with the tuple $\{S, A, P, R\}$, and form the fault diagnosis problem
    as a sequential decision-making problem, where $S, A, P, R$ are the state, action
    space, transition probability, and reward function, respectively. Considering
    the overall process of CMDP is shown in Figure 10.1, each element is described
    as follows in detail.


    State Space S


    S consists of all guessing questions in the environment and is determined by training
    samples. When an episode begins, the agent receives the first sample $x_i \in
    X$ as its initial state $s_i \in S$. Similarly, the state $s_i$ of the environment
    at each time step matches the sample $x_i$.'
