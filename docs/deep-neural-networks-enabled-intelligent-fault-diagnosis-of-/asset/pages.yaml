    parameters of network are complex, discrete, and disordered hyper-parameters,
    and require to be adjusted from multiple dimensions. It is not feasible to design
    matching network architecture manually for data in each domain. Neural architecture
    search (NAS) helps solve the problem. NAS helps to find the best network architecture
    for data automatically.


    Taking practical scenarios into account, the amount of labeled data is insufficient
    because of the difficulty of data annotation, which would amplify the potential
    for overfitting. However, there is a substantial amount of unlabeled data which
    is not fully explored. Self-supervised learning integrates the information from
    the massive unlabeled data and enriches the capacity of learnable data.


    Different from supervised learning where the learning are static, deep reinforcement
    learning follows the human cognitive mechanism that knowledge is learned by little
    interaction with the environment. The agent can autonomously learn the behavior
    policy by interacting with the environment to maximize the cumulative reward and
    improve the reliability and generalization ability.


    There are more DL methods for IFD, which will not be listed here. Subsequent sections
    will provide a detailed presentation of the specific applications of methods in
    the context of IFD.'
