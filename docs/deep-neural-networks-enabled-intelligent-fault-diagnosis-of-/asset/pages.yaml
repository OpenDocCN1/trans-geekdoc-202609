    # Deep Learning-Based Diagnosis


    DL-based diagnosis models automatically learn features from the input monitoring
    data and simultaneously identify the health status of the machine based on the
    learned features. They mainly consist of a feature extraction layer and a classification
    layer. The model first learns features layer by layer using hierarchical networks
    such as stacked AE, DBN, CNN, and ResNet. In addition, the output layer is placed
    after the last extraction layer for health state recognition, using a neural network-based
    classifier for its high multi-class classification capability. During the training
    process, the parameters of the diagnosis model are updated by the BP algorithm
    to minimize the error between the actual output and the target.


    Stacked AE-Based Approaches Stacked AE-based diagnosis models automatically preserve
    information from the input monitoring data. This eliminates the need to rely on
    expert knowledge in feature extraction. As an unsupervised learning method, stacked
    AE cannot be directly used to recognize the health state of a machine. Therefore,
    a classification layer is usually added to the top layer of the model architecture
    to recognize the health state of the machine. Therefore, a classification layer
    is usually added at the top of the model architecture, and the constructed diagnosis
    model needs to be trained with a sufficiently number of labeled samples.


    DBN-Based Approaches Unlike stacked AE, DBN-based diagnosis models can automatically
    learn features from input data by pre-training with stacked RBMs. This solves
    the problem of gradient vanishing when using BP algorithms to fine-tune deep networks.
    To identify the health of the machine, DBN maps the learned features into the
    label space by adding a classification layer. It is necessary to train the constructed
    diagnosis model with enough labeled data to obtain convincing results.


    CNN-Based Approaches Compared with stacked AE and DBN, CNN-based diagnosis models
    are able to learn features directly from raw monitoring data without preprocessing
    such as frequency domain transformations, CNNs are able to capture the shift variant
    characteristics of the input data. In addition, the number of training parameters
    in the diagnosis model is reduced through weight assignment, which speeds up convergence
    and suppresses overfitting. Similar to other DL-based models, the performance
    of CNN-based diagnosis models is limited by the training with sufficient labeled
    samples.'
