  md: '# Unsupervised Deep Transfer Learning for Intelligent Fault Diagnosis


    INTRODUCTION

    Intelligent fault diagnosis (IFD) is becoming an essential branch among prognostic
    and health management (PHM) systems. While, with the increment of available data,
    data-driven methods with the representation learning ability are also becoming
    more and more important. Thus, deep learning (DL), which can extract useful features
    automatically from original signals, becomes a hot research topic for many fields
    as well as PHM.


    Behind the effectiveness of DL-based IFD, there exist two necessary assumptions:


    +   1. Samples from the training dataset (source domain) should have the same
    distribution with that the test dataset (target domain)

    2. Plenty of labeled data are available during the training phase.


    Although the labeled data might be generated by dynamic simulations or fault seeding
    experiments, the generated data are not strictly consistent with the test data
    in the real scenario. That is, DL models based on training dataset only possess
    a weak generalization ability, when deployed to the test dataset from real applications.
    In addition, rotating machinery operates with varying working conditions, as loads
    and speeds, which also requires that trained models using the dataset from one
    working condition can successfully transfer to the test dataset from another working
    condition. In short, these factors models trained in the source domain hard should
    be generalized or transferred to the target domain, directly.


    Shared features existing in these two domains due to the intrinsic similarity
    in different application scenarios or different working conditions allow this
    domain shift manageable.'
