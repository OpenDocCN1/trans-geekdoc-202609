    # UDTL FOR INTELLIGENT FAULT DIAGNOSIS


    This section is introducing before four specific UDTL methods for IFD, including
    network-based, instanced-based, mapping-based, and adversarial-based methods from
    a methodological level.


    # Structure of Backbone


    One of the most important parts of UDTL-based IFD is the structure of the backbone,
    which acts as feature extraction and has a huge impact on the test accuracy. For
    example, in the field of image classification, different backbones, such as VGG,
    ResNet, etc., have different attributes of feature extraction, leading to different
    classification performance.


    However, for UDTL-based IFD, different students have their own backbones, and
    it is difficult to determine which backbone is better. Therefore direct comparisons
    with the results listed in other published papers are unfair and unsuitable to
    different representative capabilities of backbones. In this section, we try to
    verify the performance of different UDTL-based IFD methods using the convolutional
    neural network (CNN) backbone to ensure a fair comparison.


    As shown in Figure 7.3, the CNN backbone consists of four-dimension (1D) convolutional
    layers that come with an 1D batch normalization (BN) layer and a ReLU activation
    function. Beside, the second combination comes with an 1D max-pooling layer, and
    the fourth combination with an 1D adaptive max-pooling layer to realize the adaptation
    of the input length. The convolutional output is then flattened and passed through
    a fully connected (Fc) layer, a ReLU activation function, and a dropout layer.
    The detailed parameters are listed in Table 7.1.


    ![](img/f29bba55de4872c43f26af4667e705f2_124_0.png)


    FIGURE 7.3 The structure of the backbone.'
