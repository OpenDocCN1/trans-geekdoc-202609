    Figure 5.3 provides detailed information about the proposed generator architecture.


    In generator, the input layer is generated from noise input and class input, and
    it contains two up-sampling layers with size of 2. There are two layers of 1D-convolution
    operation followed by a batch normalization with momentum 0.8. The first 1D-convolution
    has 16 feature map with rectified linear unit (ReLU) as activation function and
    the kernel size is 16, while the second 1D-convolution layer has only 1 feature
    map with kernel size 16, using hyperbolic tangent as the activation function.
    The output of generator is 1D data sample.


    As for the discriminator, the input layer is followed by one 1D-convolution with
    8 kernels using LeakyReLU as activation function, and the kernel size is 16. Another
    1D-convolution layer with 16 kernels using LeakyReLU is added and followed by
    dropout with the probability of 0.5. Then the model is flattened and linked to
    one fully connected layer with 0.5 dropout. Fully label prediction layers are
    added as the outputs.


    Generator is designed to generate data from latent vector z, which is sampled
    from a uniform distribution over the interval (−1,1), denoted as U(−1,1). The
    outputs of generator form the fake dataset Xgenerated and then they are sent to
    the discriminator with real signal dataset. The discriminator is also built on
    1D-CNN and the output layer adds Sigmoid function to predict sample source and
    Softmax function to predict specific labels.


