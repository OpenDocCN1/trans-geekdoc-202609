    # CONCLUSION


    The CDFL approach has been presented for induction motor fault diagnosis in this
    chapter. This approach can learn features directly from raw data to characterize
    different working conditions of the induction motors. When the local filters''
    weights are learned by BPNN, the fast convolutional pooling architecture can be
    built to extract the discriminative and invariant features from the raw vibration
    data. Then the SVM has classified the features successfully for induction motor
    fault diagnosis. Experimental studies have verified the CDFL''s capability of
    extracting the discriminative and effective features from the fault signals. As
    compared to other state-of-the-art methods, the approach proposed in this chapter
    is more effective and robust for induction motor fault diagnosis. Further research
    is being conducted to verify the applicability of the presented approach for fault
    diagnosis of other types of machines.


