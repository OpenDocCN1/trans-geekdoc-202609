    # Forward Propagation Algorithm


    Assuming the chosen activation function is $\sigma(z)$ and the output values of
    the hidden layers and output layer are represented as $a$, then for the three-layer
    DNN shown in Figure 1.5, we can utilize the outputs from the previous layer to
    compute the outputs of the next layer using a similar approach as the perceptron.
    This is known as the DNN forward propagation algorithm.


    The DNN forward propagation algorithm involves performing a sequence of linear
    and activation operations using weights $W$ and biases $b$ along an input vector
    $x$. Starting from the input layer, and following a similar approach as the perceptron,
    algorithm employs the outputs from the previous layer to calculate the outputs
    of the next layer. This process continues layer by layer until reaching the output
    layer, resulting in an output value.


    For the three-layer DNN in Figure 1.7, the forward propagation process is as follows.
    First, let''s define the weight coefficients $w$ of the weight matrix $W$. The
    linear connect from the $k$th neuron in the $(l-1)$-th layer to the $j$th neuron
    in the $l$th layer is defined as $w_{jk}^l$. Note that the input layer does not
    have parameters $w$. Next, we define the biases for the $k$th neuron in the $l$th
    layer as $b_k^l$. The output layer does not have biases. For the outputs $a_1^2,
    a_2^2, a_3^2$ of the second layer ($l=2$), we can calculate them as follows:


    ```

    $a_1^2 = \sigma(z_1^2) = \sigma(w_{11}^2x_1 + w_{12}^2x_2 + w_{13}^2x_3 + b_1^2)$$

    $a_2^2 = \sigma(z_2^2) = \sigma(w_{21}^2x_1 + w_{22}^2x_2 + w_{23}^2x_3 + b_2^2)$$

    $a_3^2 = \sigma(z_3^2) = \sigma(w_{31}^2x_1 + w_{32}^2x_2 + w_{33}^2x_3 + b_3^2)$

    ```'
