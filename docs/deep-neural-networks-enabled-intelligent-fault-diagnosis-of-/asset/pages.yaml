    met. It is an unsupervised pre-training procedure which gives the network an initialization
    that contributes to convergence on the global optimum.

    For classification tasks, fine-tuning of all the parameters of this deep architecture
    is needed after the layer-wise pre-training, as shown in Figure 3.4. It is a supervised
    learning procedure using labels to eliminate the training error and improve the
    classification accuracy (Bengio et al. 2006; Hinton, Osindero, and Teh 2006).


    # DBN-Based Intelligent Fault Diagnosis


    Based on DBN, a fault diagnosis procedure for induction motor has been developed,
    illustrated in Figure 3.5, where the DBN model is built to extract multiple levels
    of representation from the training dataset.


    Vibration signals are selected as the input of the whole system for fault diagnosis
    as they usually contain useful information that can reflect the working state
    of induction motors. However, exists correlation between sampled data points.
    This is difficult for DBN architecture as it does not have the ability to function
    the classification task. Therefore, in this study the vibration signals are transformed
    from time domain to frequency domain using fast Fourier transform (FFT), and then
    frequency distribution of each signal is used as the input of the DBN architecture.
    This is beneficial for classification task during the training procedure. Specifically,
    DBN learns a model that generates input data, which can obtain more intrinsic
    characteristics of the input, thus improving classification accurately. In this
    module, DBN stacked by a number of RBMs is built and then trained by training
    dataset from data preparation module to obtain the model parameters. The DBN training
    process is shown in Figure 3.6. Input parameters of the architecture will be first
    initialized using a set of neuron numbers and hidden layer numbers, together with
    training epochs. Each layer of the architecture is then trained as an RBM unit,
    and the output of lower-layer RBM is used as the training input for the next-layer
    RBM.'
