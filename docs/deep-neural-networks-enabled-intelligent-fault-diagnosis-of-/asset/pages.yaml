    # BASIC METHODS FOR MULTI-SENSOR FUSION


    This section is going to introduce basic methods for multi-sensor fusion. The
    concept of multi-sensor fusion in fault diagnosis can generally be categorized
    into three strategic approaches: data-level fusion, feature-level fusion, and
    decision-level fusion.


    # Data-Level Fusion


    Data-level fusion is aimed at the data processing stage of the fault diagnosis
    framework, which aligns measuring data from multi sensors to form a unified and
    integrated sensor data. The integrated data can be considered as the primary signal
    for further processing. Data-level fusion generally adopts a centralized fusion
    system for fusion processing, which is the lowest level of fusion. Among the three
    fusion schemes, it possesses the minimum data loss and the highest reliability.
    This makes higher requirements on the computing power of the hardware platform,
    so the current applications focus on scientific research.


    # Feature-Level Fusion


    Feature-level fusion is a fusion of features oriented toward monitoring objects,
    which is usually performed after obtaining raw data and extracting features. This
    method extracts the feature vectors contained in the collected data to reflect
    the attributes of the monitoring objects. After convolution and pooling of the
    fused feature information from sensors, a dataset with sensor feature information
    will be obtained. Finally, by annotating and training the dataset, the diagnostic
    model can be acquired.


    # Decision-Level Fusion


    Decision level fusion employs the data features obtained through feature level
    fusion to perform certain discrimination, classification, and simple logical operations.
    Advanced decisions are made based on application requirements, resulting in application-oriented
    fusion. Due to the need to provide a separate model for each modality, it can
    better model different model data features, and can cope with partial data loss
    and asynchrony between modalities. However, it loses data correlation at the feature
    level, which usually has higher implementation difficulty.


    # DCNN-BASED MULTI-SENSOR FUSION FOR INTELLIGENT FAULT DIAGNOSIS


