    \ taxonomy of UDTL-based IFD, as shown in Figure 7.1. We categorize UDTL-based\
    \ IFD into single-domain and multi-domain UDTL according to the number of sources\
    \ from a macro perspective. In the following, we give a brief introduction of\
    \ each category.\n\n+   1. **Single-domain UDTL**: These can be further categorized\
    \ into label-consistent (closed set) and label-inconsistent UDTL. As shown in\
    \ Figure 7.2, label-consistent represents the label sets of source and target\
    \ domains are consistent. Label-consistent UDTL can be classified into four categories:\
    \ network-based, instance-based, mapping-based, and adversarial-based methods\
    \ from a methodological level. Additionally, we categorize label inconsistent\
