    +   3. Early stopping: With early stopping, the training process is halted when
    the model''s performance on the validation set degrades. This prevents the model
    from continuing to train and overfitting the data.


    These regularization techniques play a crucial role in achieving a balance between
    model complexity and generalization ability, ultimately improving a model''s performance
    on unseen data and addressing the issues of underfitting and overfitting.


