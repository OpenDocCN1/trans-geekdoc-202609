  md: "# Autoencoders for Intelligent Fault Diagnosis 31\n\nThe unlabeled induction\
    \ motor vibration data X1 are first used to train the SAE though following steps:\n\
    \n+   1. Set up the learning rate, sparse rate and denoising parameters, dropout\
    \ rate, etc. and initialize the weight $W$ and $b$ randomly.\n\n+   2. Use the\
    \ stochastic batches training method in the forward propagation algorithm to compute\
    \ the average activation $\rho_j$ for sparsity.\n\n+   3. Compute the sparse cost\
    \ function as:\n\n```\n$C_{sparse}(W,b) = \\left[ \\sum_{i=1}^{n} |h_{w,b}(x(i))\
    \ - y(i)|^2 \\right] + \\beta \\sum_{j=1}^{52} KL(\\rho|\\rho_j) \\quad (2.10)$\n\
    ```\n\n+   4. Update the parameters $W$ and $b$ based on Eq. (2.6) and (2.7).\n\
    \nThen the labeled induction motor vibration data (X2, Y2) are used to train the\
    \ DNN for classification.\n\n+   1. Set up the parameters of the SAE to initialize\
    \ the first layer of the DNN.\n\n+   2. Set up the training parameters and dropout\
    \ rate, and conduct the forward propagation algorithm to extract the labeled features\
    \ for classification.\n\n+   3. Compute the mean square error for the cost function\
    \ of the DNN using Eq. (2.4).\n\n+   4. Conduct the backpropagation algorithm\
    \ the same as before except for the sparse term (set sparse penalty to 0) to update\
    \ the weights and fine-tune the entire network.\n\nFinally, the test data (X3,\
    \ Y3) are used to verify the effectiveness of the presented SAE-based DNN.\n\n\
    # EXPERIMENTAL STUDIES (FOR INDUCTION MOTOR INTELLIGENT FAULT DIAGNOSIS)\n\nIn\
