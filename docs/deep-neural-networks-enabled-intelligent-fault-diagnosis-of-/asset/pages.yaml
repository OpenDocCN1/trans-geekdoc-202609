  md: '# Reinforcement Learning for Intelligent Fault Diagnosis


    INTRODUCTION


    The planetary gearbox as a critical transmission part of modern mechanical systems
    has been widely used in the fields of wind turbines, gas turbines, and helicopters
    because of its advantages of the large transmission ratio, compactness, and strong
    load-bearing capacity (Chen et al., 2020). However, planetary gearbox usually
    operates in harsh environments, its key components, especially the gear and bearing,
    are frequently subjected to some potential defects such as gear root crack, chipped
    teeth, broken tooth, pitting, bearing inner race fault, outer race fault, etc.
    in long-run (Chen et al., 2019). The occurrence of such faults may cause unexpected
    downtime of the entire mechanical system, which may result in huge economic losses
    or even human casualties in accidents (Zhao, Kang, et al. 2017). Thus, it is worth
    studying about gearbox fault diagnosis methods to ensure the operational safety
    and reliability of mechanical systems and reduce maintenance costs.


    Traditional methods for gearbox fault diagnosis mainly use vibration analysis-based
    characteristic frequency identification. They utilize short-time Fourier transform
    (STFT) (Yu, Yu, and Xu 2017), wavelet transform (WT) (Yan, Gao, and Chen 2014),
    wavelet packet transform (WPT) (Fan and Zuo 2006), empirical mode decomposition
    (EMD) (Ziani et al., 2019), etc., to extract the failure fault from vibration
    signal and relate fault detection. This method can detect a fault, it requires
    extensive expert knowledge of signal processing and extracts the failure fault
    with difficulty under a complex environment (Widodo et al. 2014). With the rise
    of artificial intelligence (AI), machine learning (ML)-based data-driven approach
    provides a new way for the development of fault diagnosis. Some methods like neural
    networks (Khazee et al. 2013), support vector machine (SVM) (Peng et al. 2007),
    extreme learning (Yang, Wang, and Wong 2018), etc., have been widely used in fault
    diagnosis and have fruitful results. However, these methods need a hand-crafted
    feature extractor to obtain some time- and frequency-domain features'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 176 Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
    Systems


    for fault diagnosis, the diagnostic accuracy mainly depends on the effectiveness
    of extracted features (Zhao et al. 2018). Besides, the above classifiers with
    shallow structures make it difficult to extract abstract features, leading to
    relatively low accuracy. Especially, with the arrival of the big data era of machinery
    monitoring, these methods further show their weakness in dealing with fault diagnosis.


    Current deep learning (DL), which possesses a strong ability of feature learning,
    has attracted widespread attention in the field of machine fault diagnosis (Lei
    et al. 2016). With less manual intervention, these DL-based methods can realize
    the end-to-end diagnosis and have achieved excellent performance in fault diagnosis.


    Besides, because vibration signal contains strong noise and nonlinear features
    in practice, researchers integrated time-frequency analysis (TFA) with DL for
    fault diagnosis to improve the diagnostic accuracy and robustness (Wang, Yan,
    and Gao 2017). Through the aforementioned analysis, DL has salient performance
    on the fault diagnosis of planetary gearbox to traditional ML methods. Most methods
    are supervised learning (SL) where the input is directly mapped to a fault type
    through a classifier in the training process and has strong feedback. Also, their
    learning ways are static, and unlike the human cognitive mechanism knowledge is
    learned by little through interaction with the environment. To a certain extent,
    these deficiencies reduce the generalization and intelligence level of DL-based
    fault diagnosis methods. Also, the diagnostic accuracy is influenced if the raw
    signal is directed as the model''s input because of strong noise and nonlinear
    characters.


    Deep reinforcement (DRL), as a breakthrough in AI, combines the strong perception
    of DL with the decision-making advantage of reinforcement learning (RL). However,
    DRL is used in classification because its solution is aimed at the sequential
    decision-making problem. For this purpose, Wiering et al. (2011) proposed a classification
    problem as a sequential decision-making problem and an MLP model trained in this
    framework outperformed a normal MLP trained by backpropagation. Some successful
    cases (Ding et al. 2019; Niyato, and Yuen 2020) prompt this chapter to explore
    a new planetary gearbox''s fault diagnosis from the view of DL over the previously
    mentioned deficiencies of current fault diagnosis methods.


    The rest of the chapter is organized as follows: Section 10.2 gives the problem
    definition of synchro-extracting transform (SET) and deep Q network (DQN). Section
    10.4 describes the proposed DRL-based fault diagnosis method in detail. Section
    10.5 gives the experimental setup and resultant analysis. Section 10.6 completes
    this chapter.


    # PROBLEM DEFINITION


    This section is going to provide background and the problem definition of CMDP.


    Problem Description


    Fault diagnosis is often deemed as a classification problem. However, DRL generally
    serves to solve the sequential decision-making problem (e.g., Atari game). Inspired
    by previous works,'
