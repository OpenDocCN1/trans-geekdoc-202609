    Ablation of Relation Mining Tasks To explore the effect of the inter-instance
    and intra-temporal relation mining modules, an ablation study is conducted. Two
    variants are derived from the proposed ITTSL, i.e., (1) ISSC which only applies
    inter-relation mining module, and (2) TSSC which utilizes only intra-temporal
    relation mining module. The results of these two variants together with the supervised
    baseline and the proposed ITTSL on different datasets are shown in Table 9.4.


    As be observed from the results, ISSC, TSSC and ITTSL outperform the supervised
    baseline by a large extent, which indicates that the combination of self-supervised
    learning and SSL makes a significant improvement on SSL tasks. Among the three
    contrastive learning methods, TSSC obtains a slightly higher accuracy than ISSC,
    which may be attributed to the temporal features can better reflect the failure
    modes than inter-instance features. What is more, our method acquires the highest
    diagnostic accuracy, suggesting that mining both inter-instance and intra-temporal
    relation of unlabeled data can further improve the discriminability of the model.


