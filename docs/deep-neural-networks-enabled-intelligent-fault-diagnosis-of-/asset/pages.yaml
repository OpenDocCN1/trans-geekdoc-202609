  md: '# Neural Architecture Search for Intelligent Fault Diagnosis


    INTRODUCTION


    Fault diagnosis is an important ingredient of health monitoring system in modern
    industries, and it can provide discriminative information for maintenance decision
    making by recognizing the health status of key components in equipment. Recently,
    deep learning (DL) models have dominated the model building of fault diagnosis
    due to their ability of automatically extracting features from large-scale monitoring
    data (Jiang et al. 2017; Sun, Yan, and Wen 2018; Li et al. 2022). Hu et al. (2020)
    proposed an improved network architecture to extract multiscale features for gearbox
    fault diagnosis. Li et al. (2020) used an adaptive channel weighted layer to rank
    the information importance of multisource sensors for condition monitoring of
    helicopter transmission system. By designing a customized network architecture
    manually, specific fault diagnostic task under a given domain, i.e., working condition,
    can be well solved.


    However, multi-domain problem is common in real world scenarios, especially for
    the complex devices in changing environment. The data in those different domains
    of the corresponding components of the device are inconsistent and can also be
    shifted in changing environment. For this problem, it is natural to design a matching
    model for data in each domain.


    The automatic feature engineering of DL enables the diagnostic model to extract
    homogenous features from the data in a given domain. But the quality is dependent
    on the architecture of DL model and the performance of one network architecture
    is diverse in various applicable fields. Structure determines functions, which
    the domain matching can be found by elaborately designing network architecture.
    However, the architecture parameters of network are complex, discrete, and disordered
    hyper-parameters, and required to be adjusted from multiple dimensions, such as
    depth, width, and identity mapping. The design space of network architecture is
    huge, which makes the design process trial-and-error optimization problem.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 138 ■ Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
    Systems


    Therefore, it is not feasible to design matching network architecture for data
    in each domain.


    For the manual design problem, network architecture search (NAS) is a competitive
    approach, which can automate the design of network architecture for data in a
    given domain. NAS has attracted attention in various fields, such as computer
    vision (Xu et al. 2019), natural language processing (Klyuchnikov et al. 2022),
    speech recognition (Baruwa et al. 2019). Scholars engaged in fault diagnosis have
    also gradually applied NAS methods (R.X. Wang et al. 2020). It is automation that
    makes it possible to achieve the matching network architecture for data in each
    of multiple domains. Nevertheless, conventional approaches, either reinforcement
    learning (RL) based (Zoph and Le 2016) or evolutionary algorithm (EA) based (Real
    et al. 2019), are automated by resourceconsuming searching, which is a discrete
    and heuristic process. For the sake of high efficiency, one-shot NAS methods based
    on hyper-network have been developed (Bender et al. 2018; Liu, Simonyan and Yang
    2018; Liang et al. 2019; Guo et al. 2019; Chu, Zhang, and Xu 2021). The hyper-network
    contains candidate network architectures, so as to avoid the cost of training
    them from scratch. This introduces a kind of one-shot NAS method with differentiable
    search strategy for fault diagnosis, which extends the differentiable architecture
    search DARTS (Liu et al. 2018) to an efficient one. The differentiable search
    strategy relaxes the hyper-network, and downgrades the discrete search process
    to a continuous optimization process, which is a resource-friendly NAS method.


    Although it is efficient, DARTS presents with two drawbacks: (1) The representation
    of hyper-network is unsatisfactory due to the unfairness in its training and evaluation
    process. The coupling effect exists in the operators of hyper-network, leading
    to insufficient training for parametric operators and the co-adaptation problem.
    Besides, the sampling matrix of hyper-network is constrained by the Softmax normalization,
    causing Matthew effect in evaluation process. (2) The searched architecture of
    DARTS is generally an overconfident result, which is just one of set with multiple
    high-performance architectures and not the optimal (Zhang, Zhang, and Yang 2020;
    Li et al. 2020). However, it is not feasible for DARTS to get a candidate set
    during one searching phase.


    To overcome the above drawbacks of DARTS, this section develops a one-shot NAS
    method, that is, Bayesian differentiable architecture search (BDAS). The two-stage
    optimization is taken of alternating optimization for flexibility (Guo et al.
    2019; Chu et al. 2021). For the unfairness problem, the hyper-network is trained
    with warmup and path-dropout in the first stage, then the sampling method is optimized
    with the constraint of the softmax normalization in the second stage. For the
    overconfident result, inspired by Bayesian deep learning (Wang and Yeung 2016)
    and variational autoencoder (Kingma and Welling 2013), each point of the sampling
    method is extended as a distribution through Bayesian inference, then the candidate
    set can be obtained by forward sampling from the posterior distributions group.
    It is worth noting, to satisfy the binarization of the sampling distributions
    group, the regularization of the maximum posterior (MAP) estimation is generalized
    into our objective function'
