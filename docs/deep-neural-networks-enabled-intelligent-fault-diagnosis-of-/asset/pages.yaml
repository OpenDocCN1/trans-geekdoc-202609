    INTRODUCTION


    For deep learning-based fault diagnosis methods, training data is an important
    factor that affects the performance of prediction model. Generally, a deep neural
    network contains multiple hidden layers, and the number of free parameters that
    need to be trained is enormous. In order to achieve accurate predictions, the
    deep architecture need to be well-trained, and fully training a large network
    usually abundant balanced data. However, in practice, training samples across
    different machine states often exhibit an imbalance. For example, for a mechanical
    system under operation, it is working under normal circumstance most of the time
    and the collected sensor data that represent positive training samples are sufficient,
    while machine operating in fault is infrequent and corresponding collected samples
    are limited compared to positive samples. Therefore, there is an imbalance between
    positive training samples and fault samples. Suffered from limited training data,
    especially unbalanced data, training a deep model to achieve accurate machine
    conditions is relatively difficult.


    Generative adversarial networks (GANs) offer an alternative when facing the issue
    of unbalanced data classification by generating data for minor classes. GANs have
    shown prominent capability in producing realistic looking data and have been successfully
    applied in image generation. It can be used for data augmentation by generating
    artificial data that are similar to original data and enriching training dataset.
    Moreover, the generative architecture models data generation process and thereby
    helps to understand the original data distribution, providing a new perspective
    for creating predictive systems in machine fault diagnosis tasks.


    GAN was first introduced as a framework for generation of artificial images (Goodfellow
    et al. 2014) and has the capability to produce convincing image samples. However,
    the original GAN faced challenges with training instability, requiring'
