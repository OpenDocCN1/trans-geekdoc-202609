  md: '# Deep Belief Networks for Intelligent Fault Diagnosis


    INTRODUCTION


    Failures occur in manufacturing machines which may cause disastrous accidents
    such as economic losses, environmental pollution, and even casualties. Effective
    diagnosis of these failures is essential in order to enhance reliability and reduce
    costs of operation and maintenance of the manufacturing equipment. As a result,
    fault diagnosis of manufacturing machines that utilizes data acquired by advanced
    sensors and makes decisions using processed sensor data has been successful in
    various applications (Gao et al. 2015; Riera-Guasp, Antonino-Daviu, and Capolino
    2015; Chen et al. 2016). Induction motors, as the source of actuation, have been
    widely used in many manufacturing machines, and their working states directly
    influence system performance, affecting the production quality. Therefore, proper
    acquisition of data reflecting the states of induction motors can help in early
    identification of potential failures (Drif and Marques Cardoso 2014). During recent
    years, various approaches for induction motor fault diagnosis have been developed
    and innov continuously (Antonino-Daviu et al. 2013; Faiz, Ghorbanian, and Ebrahimi
    2014; Karvelis et al. 2015; Wang et al. 2016).


    Artificial intelligence (AI)-based fault diagnosis techniques have been widely
    studied, and have succeeded in many applications of electrical machines and drives
    (Matic et al. 2012; Zhang et al. 2016). For example, a two-stage learning method
    using sparse filtering and neural networks was proposed to develop an intelligent
    fault diagnosis method which could learn from raw signals (Lei et al. 2016). The
    feed-forward neural network using Levenberg-Marquardt algorithm showed a new way
    to detect and diagnose machine faults (Boukra, Lebard, and Clerc 2013), where
    results were not affected by the load condition and the fault types. In another
    study, a special structure of support vector machine (SVM) was proposed, which
    combined directed acyclic graph-SVM (DAG-SVM) with recursive undirected wavelet
    packet transport, for inspection of rotor bar fault in induction motors (Keskes
    and Braham 2015). Fuzzy system and Bayesian theory'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 42 Deep Neural Networks-Enabled Intelligent Fault Diagnosis of Mechanical
    Systems


    utilized in machine health monitoring by C. Chen, Zhang, and Vachtsevanos (2012).
    Although these studies have shown the advantages of AI-based approaches for induction
    motor fault diagnosis, most of these approaches are based on supervised learning,
    with high-quality data having good coverage of true failure conditions are required
    to perform model training (Murpheus et al. 2006). However, it is not easy to obtain
    sufficient labeled data to train the model in practice.


    Furthermore, many fault diagnosis tasks in induction motors depend on feature
    extraction from measured signals. The feature characteristics directly affect
    the effectiveness of fault recognition. In the existing literature, many feature
    extraction methods are suitable for fault diagnosis tasks, such as time-domain
    statistical analysis, frequency-domain spectral analysis (Wang, Gao, and Yan 2014),
    and time-scale/frequency analysis (Boashash 2015), among which wavelet analysis
    (Yan, Gao, and Chen 2014), which belongs to time-scale analysis, is a powerful
    tool for feature extraction and has been applied to processing non-stationary
    signals. Whereas, the problem is that different features extracted from these
    methods may affect the classification accuracy. Therefore, an automatic and unsupervised
    feature learning from the measured signals for fault diagnosis is needed.


    Limitations can be overcome by deep learning algorithms which follow an effective
    way of learning multiple layers of representations (Hinton 2007b). Essentially,
    a deep learning algorithm that uses deep neural networks which contain multiple
    hidden layers to learn information from the input was developed, but not yet into
    practice because its training difficulty until Geoffrey Hinton proposed layer-wise
    pre-training algorithm to effectively train deep neural networks (Hinton and Salakhutdinov
    2006). Since then, deep learning techniques have advanced significantly and their
    successful applications have been observed in various fields (Arel, Rose, and
    Karnovsky 2010), including handwritten digit recognition (Bengio 2009), computer
    vision (Jia et al. 2014; Szegedy et al. 2015; Cai et al. 2016; He et al. 2022),
    Google Map (Hinton 2007a), and speech recognition (Le 2013; Deng, Hinton, and
    Kingsbury 2013; LeC, Bengio, and Hinton 2015). In addition, for natural language
    processing (NLP), deep learning has achieved successful applications and made
    significant contributions to (Des and Yang 2014; Tai, Socher, and Manning 2015).
    In the area of fault diagnosis, deep learning theory also has many applications.
    For example, deep neural network built for signature extraction utilized for bearings
    and gears (Jia et al. 2016), while a classification model based on deep network
    architecture was used in the task of characterizing health states of the aircraft
    engine and electric power transformer (Tamilselvan and Wang 2013). The deep belief
    network (DBN) was also used for identifying faults in reciprocating compressor
    valves (Tran, AlThobian, and Ball 2014). Sparse coding was used to build deep
    architecture for structural health monitoring (Guo et al. 2014), and a unique
    automated fault detection method named “Tilar” using deep learning concepts was
    proposed for the quality inspection of electromagnetor (Sun et al. 2014). Furthermore,
    autoencoder-based DBN model was successfully applied to quality inspection (Sun,
    Steinecker, and Glocker 2014), while a sparse model based on autoencoder was shown
    to form a deep architecture, which realized induction motor fault diagnosis (Sun
    et al. 2016).'
