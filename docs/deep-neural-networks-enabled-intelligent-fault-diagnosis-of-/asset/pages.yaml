    # DQN-Based Fault Recognition


    Considering the model''s training, and CMDP formulated in Section 10.2, a group
    of $T$ samples is obtained randomly to follow a sequential decision-making episode
    according to the order of these samples when the agent interacts with the environment,
    as depicted in Figure 10.3. In the process of the agent''s autonomous learning,
    using ER to randomly sample mini-batch experience data $\{e_1,e_2,...,e_{\min-batch}\}$
    from the ER buffer updates the parameters of the agent. Specifically, the updating
    of Eva-Net is performed through the gradient descent method to the MSE of the
    Q value and target Q value, as illustrated in (11-14), and Target-Net is updated
    by copying parameters of Eva-Net after every step $C$, where $C$ is set to 4.
    After completing the autonomous learning stage, the agent will make an optimal
    action $(\argmax Q(s;\theta))$ depending on the recognized policy when the testing
    diagnosis question is given sequentially. Finally, based on Figure 10.3, the fault
    process of the proposed method is described especially in Figure 10.4.


    In this method, the Adam optimizer with the learning rate of 1e-3 and decay of
    1e-4 is used to update the parameters of the agent; the training episode is set
    to 200; the mini-batch is updated by a minibatch way, and the mini-batch size
    is set to 32; one round guessing games with $T=128$ queries; the capacity of ER
    buffer $B$ is 1000. The discount factor $\gamma$ in (13) is 0.1 because the agent''s
    observations from the guessing question are relatively independent, which means
    the agent needs to pay more attention to the current reward in answering a question.
    It will also be verified in the experiment sections. Also, according to the above
    settings and the definition of CMDP, we build a simulation environment for training
