    model gets better classification accuracy in current signals than in vibration
    signals. It means based on the existing dataset, it is difficult to learn features
    from vibration signals, and the model is not well-trained using vibration signals.
    For testing dataset, the proposed model has a better performance in vibration
    dataset, indicates the model has generalization capability using current signals.
    It also shows a gap in model loss and accuracy between the training set and testing
