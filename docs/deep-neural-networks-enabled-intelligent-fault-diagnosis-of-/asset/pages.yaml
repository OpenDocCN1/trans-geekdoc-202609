    Time-Amplitude Signal Augmentation

    At the beginning of ITSSL, data augmentation is applied to all training samples
    through a series of transformations. It should be emphasized that data augmentation
    plays different roles for labeled samples and unlabeled samples. For labeled samples,
    it increases the number-label-invariant data which improves the robustness of
    the model. As for unlabeled samples, data augmentation serves as the foundation
    for the subsequent construction of positive and negative pairs. However, vibration
    signal augmentation techniques are scarce compared with image augmentation methods.
    Thus, we design a specific augmentation method considering vibration signal properties.


    In industrial scenarios, complex noises may modulate both the amplitude and frequency
    of the real vibration signals, which warps signals in both the time and amplitude
    axes. Motivated by this, a time amplitude distortion (TAD) technique is adopted
    to imitate the noise interference, as shown in Figure 9.2. All input samples are
    normalized, limiting the value of each point to the range of [-1, 1]. Then two
    transformation techniques, including scale distortion and time distortion, are
    applied in amplitude and time domains respectively. Each transformation has a
    20% chance of being implemented. Scale distorting simulates the amplitude fluctuation
    of signals. The time steps remain constant, but the values scale with a dynamic
    scaling factor at each time step. As shown in Figure 9.2(b), the scaling factor
    follows a smooth spline curve contoured by 6 equally spaced points generated from
    a Gaussian distribution, which enhances the robustness of the model to noise amplitude
    modulation.


    ![](img/f29bba55de4872c43f26af4667e705f2_170_0.png)


    FIGURE 9.2 The time-amplitude signal augmentation technique in ITSSL.'
