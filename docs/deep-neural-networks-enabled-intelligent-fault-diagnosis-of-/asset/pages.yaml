    # CONCLUSION


    In this work, we have proposed a one-shot NAS method to automatically design domain
    matching diagnostic model. As a rethinking exercise, our method solves two drawbacks
    of DARTS, the unfairness of hyper-network and the overconflicting result. The
    warmup and path-dropout are used to obtain an intuitively fair hyper-network,
    and variational Bayesian inference is introduced into the differentiable search
    strategy to estimate the uncertainty of model matching and architectures. Our
    approach achieves state-of-the-art performance on the aeroengine bevel gear fault
    diagnosis with different NEL cases.


