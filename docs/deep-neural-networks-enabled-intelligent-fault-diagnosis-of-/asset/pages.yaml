    Change of Discount Factor γ Unlike the Atari games, the correlation of adjacent
    states in the formed "guessing game" is however, the classification agent in this
    "guessing game" cares about more immediate rewards. It is the reason why a small
    γ value (γ=0.1) is selected in this task. To verify the effect of parameter γ
    on the diagnostic performance, the proposed method is carried out in the above
    datasets, with the parameters change from 0.1 to 0.9. Other settings are set as
    illustrated in Section 10.4, and the model is conducted 3 times on each speed-load
    case. The change of OA and Std in different parameters is shown in Figure 10.13.


    From Figure 10.13(a), the diagnostic performance on nine datasets is all decreasing
    when the discount factor γ is increasing. When γ is greater than or equal to 0.5,
