    is not feasible for the differentiable search strategy to get candidate architectures
    during searching phase, with RL-based or EA-based NAS methods can easily obtain
    such set. Besides, DARTS seeks to search a relatively good architecture than the
    optimal ones (Zhang et al. 2020). Therefore, by expanding the range of searched
    architectures, the better ones are expected to be obtained. Our method applies
    the Bayesian inference to obtain such candidate architectures set. To our best
    knowledge, it is the first work to obtain such set under the differentiable search
    strategy.


    # DARTS


    Instead of searching the global network architecture, DARTS is a cell-based searching
    method, and its entire network is composed of a number of repetitive cell structures.
    The cell structure is usually represented as a directed acyclic graph (DAG) with
    several nodes and edges. These nodes include input/output nodes and intermediate
    nodes, which represent different features. The input nodes are the features copied
    from the previous cell. These edges include mixed edges and four connecting edges,
    which represent the operators between nodes. The key point of DAG is the construction
    of mixed edges, each of which is superimposed by eight operators in the search
    space multiplied by a coefficient vector called architecture weight, denoted as
    $\alpha =(\alpha^1, \alpha^2, ..., \alpha^{14})$, where $j$ is the number of the
    fourteen mixed edge. Then all the fourteen edges are spliced into a sampling matrix.
    So the dimension of the matrix is $14 \times 8$. Corresponding to the design of
    model, there are two DAGs, that is, normal and reduce cell. Since there is no
    difference between normal cell and reduce cell in design and optimization, we
    shall take one DAG as instance for simplicity.


    The forward computation of cell and the search space:


    ```

    $f_{DAG} = \begin{pmatrix} \alpha_1^1 & & \alpha_s^1 \ \vdots & & \vdots \ \alpha_1^{14}
    & & \alpha_s^{14} \end{pmatrix} \otimes \begin{pmatrix} OP_1(x) \ \vdots \ OP_8(x)
    \end{pmatrix} \n \quad A \quad (8.1)$

    ```


    ![](img/f29bba55de4872c43f26af4667e705f2_150_0.png)


    where $OP$, represents the $i$-th operator in the defined search space, which
    will be described in Section IV. All the $\alpha^i$ vectors are spliced into a
    sampling matrix, denoted as $A$, and each'
