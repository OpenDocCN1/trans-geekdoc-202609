    \ feature extraction as it reserves and reveals both time and frequency information\
    \ of the original signal simultaneously. There are a variety of methods that are\
    \ able to generate good time–frequency resolution, wavelet transform is widely\
    \ adopted in analyzing signals measured on induction motors.\n\nContinuous wavelet\
    \ transform (CWT) is widely used and can be calculated by the inner product of\
    \ the signal and a family of the wavelets (Lin and Qu 2000). Scale and translating\
    \ the mother wavelet $\\Psi(t)$ generates the wavelet family:\n\n```\n$$\\Psi_{s,\\\
    tau}=\\frac{1}{\\sqrt{s}}\\Psi\\left(\\frac{t-\\tau}{s}\\right)$ (6.1)$\n```\n\
    \nwhere $s$ and $\tau$ denote the scale parameter and the translation parameter,\
    \ separately, and $s$ is related to frequency inversely.\n\nThe CWT of given signal\
    \ $x(t)$ can be obtained by the convolution operation of the complex conjugate,\
    \ which is mathematically defined as follows:\n\n```\n$$\\Psi_{s,\\tau}=\\frac{1}{\\\
    sqrt{s}}\\Psi\\left(\\frac{t-\\tau}{s}\\right)W(s,\\tau)=\\frac{1}{\\sqrt{s}}\\\
    int x(t)\\psi^*\\left(\\frac{t-\\tau}{s}\\right)dt$ (6.2)$\n```\n\nwhere $\\psi^*(\\\
    )$ represents the complex conjugate of $\\psi(\\)$. That is, the signal is decomposed\
    \ into a set of wavelet coefficients. As there are two kinds of parameters, scale\
