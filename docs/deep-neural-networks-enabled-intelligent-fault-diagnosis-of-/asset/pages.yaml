  md: '# Deep Networks-Enabled Intelligent Fault Diagnosis of Mechanical Systems


    # CONCLUSION


    This chapter adopts a self-supervised learning technique-based diagnosis framework
    to address the label-insufficient problem in intelligent fault diagnosis, where
    few labeled and massive unlabeled data are used concurrently to improve efficiency.
    As an extension of DA technique, TAD is pertinently designed for vibration signals.
    Then two self-supervised tasks are constructed, explores the inter-relation and
    intra-temporal relation of unlabeled data to improve the discriminability of the
    model. Moreover, UDW is adopted to alleviate single task dominance in multi-task
    learning. Two publicly available datasets and a private dataset validate the superiority
    of ITSSL to various semi-supervised methods. Ablation studies demonstrate the
    effectiveness of the temporal relation and instance of signals on fault diagnosis.
    To sum up, self-supervised learning is a useful technique to explore data potentiality,
    which can be appropriately applied for intelligent tasks in data scenarios.


