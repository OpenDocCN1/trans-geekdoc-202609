    # Comparison Approaches


    First, several unsupervised CNNs including sparse autoencoder (SAE) and random
    methods are considered here.(Fan Zhang, Du, and Zhang 2014) adopts SAE to learn
    the parameters of CNN, while random method (Saxe et al. 2011) generated the CNN
    parameters randomly. Then, the outputs of the unsupervised CNN methods are fed
    to the SVM classifier. For a fair comparison, the structure of convolutional pooling
    architectures and the parameters in these two baseline methods are the same as
    the ones in the proposed CDFL method. And the supervised CNN (one layer) sharing
    the same structure with the methods and two-layer CNN are employed for comparison.
    To further demonstrate the superiority of the CDL method in fault diagnosis, widely
    used methods are employed for comparison, namely, wavelet packet transform (WPT)
    (Yen and Lin 2000) (Zhao et al. 2010). The WPT method uses the “db2” wavelet to
    decompose the training samples into seven layers and the wavelet packet node energy
    on all levels. The features finally are obtained as concatenation of different
    energy values from all seven layers. Then the learned features with dimensionality
    of 254 are used for training of the SVM classifier. The BPNN contains one hidden
    layer with 100 hidden nodes. In addition, to highlight the effectiveness of the
    proposed method, deep learning like the DNNs with single-layer SAE (Sun et al.
    2016), is employed for comparison. DNN has the same number of hidden nodes as
    the BPNN, which is set to 100. For a fair comparison, the CNN with two layers
    has the same number and size of filters as the first layer of the proposed model
    except for the pooling size, while the second convolution and pooling layer has
