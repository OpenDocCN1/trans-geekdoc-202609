    To validate the superiority of the proposed ITSSL, we adopt two supervised learning
    methods and several SSL methods as comparisons:


    +   1. Supervised: A supervised baseline that trains the backbone encoder and
    the classification head with only labeled data.


    +   2. Aug_supervised: An improved supervised method with TAD.


    +   3. Pseudo-label: A self-training SSL method that utilizes the pseudo labels
    of unlabeled data during the training stage.


    +   4. II Model: An SSL method using a consensus regularization term to ensure
    that the predictions of different augmentations are consistent.


    +   5. MTL: A co-training SSL method that creates a forecasting task on latent
    features as regularization.


    +   6. CR: A novel SSL method which proposed a contrastive regularization to make
    features with confident pseudo-labels cluster together.


    +   7. SLA: A self-training SSL method that considers the mapping of unlabeled
    samples to labels as a convex optimization problem and facilitates Sinkhorn algorithm
    for label assignment.


    +   8. MoCo: An advanced contrastive learning method using momentum and memory
    bank to increase the number of negative pairs. In implementation, it is associated
    with supervised learning.


    +   9. SimCLR: A contrastive learning method which adopts more negative samples
    and a projection layer. Similarly to MoCo, it is co-trained with supervised learning.


    For the fairness of comparison, the model architecture and experiment setups of
    all methods remain the same. In the training stage, the model is trained with
    1000 epochs. An early stopping mechanism with patience of 250 epochs is monitored
    to prevent overfitting. Being, Adam optimizer is adopted with a learning rate
