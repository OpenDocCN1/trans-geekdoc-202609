    +   Paderborn University (PU) dataset: The PU dataset acquired from Paderborn
    University is a bearing dataset (Lessmeier et al. 2016) which consists of artificially
    induced and real measures. The sampling frequency is to 64 kHz. By changing the
    rotating speed of the drive system, the radial force onto the bearing and the
    load torque on the drive train, the PU dataset consists of four operating conditions
    as shown in Table 7.4. Thirteen bearings with real caused by accelerated lifetime
    times (Lessmeier et al. 2016) are used to study transfer learning tasks among
    different working conditions (twenty experiments were performed on each bearing
    code, and each experiment sustained four seconds). The categorization information
    is presented in Table 7.5 (the meaning of contents is explained in (Lessmeier
    et al. 2016)). In total, there are 12 transfer learning settings.


