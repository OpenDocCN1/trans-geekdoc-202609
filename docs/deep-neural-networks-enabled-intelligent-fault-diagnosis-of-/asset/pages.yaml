  md: '# Unsupervised Deep Transfer Learning for Intelligent Fault Diagnosis ■ 121


    # EXPERIMENTAL STUDIES


    In this section, we test two datasets to verify the performance of different UDTL
    methods for comparative studies.


    +   Case Western Reserve University (CWRU) dataset: The CWRU dataset provided
    by Case Western University Bearing Data Center (Case School of Engineering 2021)
    is one of the most famous open-source datasets in IFD and has been used by tremendous
    published papers. Following other papers, this also uses the drive bearing fault
    data whose sampling frequency is to 12 kHz and ten bearing conditions are listed
    in Table 7.2. In Table 7.2, one normal bearing (NA) and three fault types including
    inner fault (IF), ball fault (BF) and outer fault (OF) are classified into ten
    categories (one health state and nine fault states) according to different fault
    sizes.


    +   Besides, as CWRU consists of four motor loads corresponding to operating speeds.
    For the transfer learning, this section considers these working conditions as
    tasks including 0, 1, 2, and 3. For example, 0→1 means that the source domain
    with a motor load of 0 HP transfers to the target domain with a motor load of
