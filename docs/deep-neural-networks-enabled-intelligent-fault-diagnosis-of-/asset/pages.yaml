    is an effective way for fault diagnosis of induction motors.


    For traditional fault diagnosis, as the raw vibration signal always contains too
    much noise, one essential step is the data processing to eliminate noise and extract
    the relevant information for classification. A robust and effective feature extraction
    requires some high-quality engineering experience and professional knowledge that
    is often challenging and hard to obtain. Compared with traditional fault diagnosis
    approaches, DBN-based deep learning architecture can automatically learn representations
    from the input and reduce the manual work so that it can reduce the influence
    of artificial factors.


