    better classification capability in the task of fault diagnosis for induction
    motors than DBN model as FFT-DBN model has only 1 misclassification sample while
    DBN model has confusion in label 2, 3, and 5. It also illustrates that frequency
    distribution of the signal is suitable in the application of DBN model, while
    DBN architecture cannot well the temporal information of input data which may
    influence the following classification process.


