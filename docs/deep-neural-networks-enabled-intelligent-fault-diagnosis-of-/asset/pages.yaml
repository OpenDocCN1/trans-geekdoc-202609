    In the proposed BDAS, each point $\alpha(i=1,2\cdots8; j=1,2\cdots14)$ of the
    sampling matrix $A$ is extended as a distribution, then the sampling distributions
    group $A$ is obtained. For a validation dataset $D_{out}=(x,y)$ and a trained
    hyper-network $H(w^*)=\argmin_w L_{train}(w)$, the variational posterior $q(\Lambda|\theta)$
    is used to approximate the true Bayesian posterior $P(\Lambda|D_{out},H(w^*))$.
    In our work, the variational posterior is set to Gaussian distribution and its
    parameter $\theta$ needs to be found. This is solved by minimizing the KL divergence;'
