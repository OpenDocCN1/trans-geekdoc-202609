  - "[PAGE 4]\n\n> “As AI becomes infused into all computer systems, from social networks\
    \ to business-critical infrastructure and defense systems, the security of those\
    \ systems depends on the security of the AI they use. This book presents the unique\
    \ risks and considerations of AI with engaging stories and insightful examples.\
    \ It is a wake-up call to security professionals and organizations adopting and\
    \ developing AI.”\n> \n> —*Mark Russinovich, Azure CTO and Technical Fellow, Microsoft*\n\
    \n> “The threat is not hypothetical”—a quote used by the authors to open the book\
    \ remains top of mind as you come to the conclusion of this brilliant work. In\
    \ the final paragraphs, one thing is clear: there is a call to action, and we\
    \ must act “hand in hand” on securing AI systems with haste.”\n> \n> —*Vijay Bolina,\
    \ Chief Information Security Officer, DeepMind*\n\n> “Siva Kumar and Anderson\
    \ take you on a wild ride uncovering the victories and triumphs of AI/ML. This\
    \ should be required reading to become AI/ML literate in the field.”\n> \n> —*David\
    \ Brumley, Professor of ECE and CS, Carnegie Mellon University*\n\n> “Trust, in\
    \ ways both good and bad, is emerging as a critical aspect of the relationships\
    \ we are coming to have with AI. NOT WITH A BUG, BUT WITH A STICKER is an eye-opening\
    \ book that will change the way you think about the systems that pervade our world—and\
    \ its lessons should be taken to heart by all who build them.”\n> \n> —*Brian\
    \ Christian, author of* The Alignment Problem\n\n> “NOT WITH A BUG, BUT WITH A\
    \ STICKER is a rare inside look at the absurd AI quirks that are keeping security\
    \ experts awake at night. I’m going to start bringing up examples from this book\
    \ immediately.”\n> \n> —*Janelle Shane, author of* You Look Like A Thing And I\
    \ Love You: How AI Works And Why It’s Making The World A Weirder Place\n\n> “At\
    \ last—and not a moment too soon—a book that in plain language describes the distinct\
    \ and deep issues of securing now-ubiquitous machine learning tools. Whether you’re\
    \ looking to deploy them in your own domain, or simply among the billions of people\
    \ now subject to them, this is a vital read.”\n> \n> —*Jonathan Zittrain, George\
    \ Bemis Professor of International Law and Professor of Computer Science, Harvard\
    \ University*"
  - '[PAGE 5]


    > “We are fast entering a world of powerful but brittle AI systems, one where
    failures can result in catastrophic consequences. Siva Kumar and Anderson have
    written an essential guide for understanding the unique—and troubling—failure
    modes of AI systems today. Through easily accessible examples and anecdotes, they
    break down the problems of machine learning systems and how society can address
    them to build a safer world.”

    > —Paul Scharre, author of Four Battlegrounds and Army of None


    > “Siva Kumar and Anderson are veterans at the intersection of machine learning
    and security, and in this work, they delight us with a guided tour across the
    history of this fascinating field. The book dives into why this field should become
    one of the top priorities for those who are developing and deploying AI systems,
    providing ample material that will benefit novices and pros alike. Readers of
    this book will earn a competitive advantage in machine learning, especially as
    responsibility becomes a non-negotiable aspect of fielding advanced technological
    systems.”

    > —Abhishek Gupta, Founder and Principal Researcher, Montreal AI Ethics Institute'
