    # Bad Data = Big Problem


    The number-one attack on AI systems that organizations worry about is not the
    sticker attack for traffic signs.


    That''s what we found when we spoke to multiple organizations using machine learning:
    from startups to Fortune 500–sized companies to governments worldwide. It was
    the first survey of the kind, and we roped in AI engineers and security analysts
    to get a comprehensive snapshot of the state of adversarial machine learning from
    an industry perspective.


    The top worry for organizations we found, by an overwhelming majority, was poisoning
    attacks. These attacks deliberately feed the ML system bad data to change how
    the model behaves from conception. A follow-up study by other researchers confirms
    that in a survey of 139 organizations, poisoning is top of mind, especially pronounced
    in fields like IT security, where adversaries are prevalent.


    But, even without an active adversary, feeding bad data can cause considerable
    damage to an AI system and cause business loss. For example, consider Unity, the
    popular gaming software that powers video games like Pokemon Go, Call of Duty,
    and more than half of all mobile games. Unity heavily invested in machine learning
    across the board to improve gameplay. But, in May 2022, it suffered more than
    $100 million in losses, in part because one of its AI systems ingested “bad data
    from a large customer.”


    The key issue is that once the model is trained on data, the die has been cast.
    Discovered that your input data is corrupt and want to fix your model? Today,
    the only viable option is to start over—to retrain the model from scratch. This
    requires a spate of resources: costly compute resources and developers’ time and
    focus away from creating new features. Indeed, Unity’s CEO told investors, “As
    a consequence of reprioritizing work in our teams to thoroughly address the resiliency
    and data training issues, we delayed the launch of certain revenue-driving features.”
    Unity later fixed the issue in a subsequent quarter.'
