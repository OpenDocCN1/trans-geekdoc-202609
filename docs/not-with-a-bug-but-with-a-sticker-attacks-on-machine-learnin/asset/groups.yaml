    研究人员觉得这个攻击很有趣。他们调皮地选择了埃隆·马斯克的图像投影到路上。接下来，他们在树上投影了停车标志，使汽车困惑。然后，他们在路上投影了车道，汽车便偏离了方向。与胶带或食盐技巧不同，幻影不会在现场留下任何证据——一场可以干净脱身的对抗性
    AI 犯罪。


