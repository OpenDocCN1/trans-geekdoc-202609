    Nicolas Papernot is a magnoludovician.


    That’s what students at France’s most prestigious and notoriously difficult prep
    school, Lycée Louis-Le-Grand, are called. Located in Paris’s Latin Quarter between
    the Sorbonne and College De France, the school’s alumni include all the French
    intelligentsia you could think of: Molière, Voltaire, Hugo, Degas, Sarte, Baudelaire.
    Half of all the Field Medalists from France, the Nobel Prize equivalent in mathematics,
    come from this prep school. Unlike schools in the United States, where the kids
    go through a patchwork of different classes with complicated schedules, students
    at this public school have a straightforward but grueling schedule: 4 hours of
    advanced math in the morning and 4 hours of theoretical physics in the afternoon.
    That’s it. Here, Papernot would solve worksheet after worksheet of calculus, algebra,
    and probability theory that would later prove useful to him.


    As the school website reads, “You don’t enter Louis-le-Grand for its name, but
    going there can help make one.” And Nicolas Papernot most definitely made a name
    for himself in adversarial machine learning.


    But the road to his fame was far from obvious. He moved to Penn State University
    for grad school, where he first dipped his toes in research with securing databases.
    The research was moving, but he wasn’t finding the big impact he was seeking.
