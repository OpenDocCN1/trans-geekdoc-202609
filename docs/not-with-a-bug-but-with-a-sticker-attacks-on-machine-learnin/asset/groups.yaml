    ## 前言

    我们都知道，AI——尤其是机器学习——有潜力颠覆社会的许多方面，但细究细节是有益的。AI 是一种决策工具，可以取代人类决策者。它不是一种直接替代；它是一种带来一连串其他变化的替代。具体来说，AI
    改变了这些决策的速度、规模、范围和复杂程度。


    速度和复杂程度很容易理解：计算机比人快得多，而 AI 的前景是它们将（如果不是现在，最终）做出比人更好的决策，原因至少是它能在工作记忆中保留更多变量——如果我们要拟人化的话，就是“记在脑子里”——比人更多。但我想聚焦于规模。


    机器学习的前景是规模化决策。无论是医学诊断、内容审核决策、个性化教育，还是逐向导航驾驶决策，机器学习系统都能以有人参与循环时不可能的方式扩展规模。根本不存在足够多的受过训练的医学技术人员、内容


    不断演进的、深奥难解的软件——而我们在应对这方面甚至更糟。我们对机器学习安全知之甚少。如今，要让模型在训练中产生偏见、在用的时候被欺骗、从模型中提取私有数据，都太容易了。似乎每个月我们都会了解到新的漏洞和攻击，其中一些极其怪异而微妙。一切似乎都很重要，其方式就像模型本身一样难以理解。


    这些漏洞和攻击并非理论上的。它们对当今使用的机器学习系统有效，这些系统正在做出影响真实人群的真实决策。虽然已发表的研究大多由专业人士在实验室环境中完成，但我们真的不知道现有系统正如何被攻击者利用。宣传者是否会通过选择性地使用逗号来绕过内容审核系统？语言模型的控制是否可以通过给它们看似无害的提示来绕过？潜在的大学生申请者是否会通过在申请文书中点缀一些精心挑选的词来绕过机器学习守门人？我们确实不知道。


    我们必须做得更好。我们需要更好地理解攻击与防御的全貌。我们需要一些稳健的机器学习安全实践，以及关于机器学习模型的韧性和公平性的更好理论，以及实际的政策措施。这正是本书通过提出正确的问题并将我们推向答案所提供的。


    ——布鲁斯·施奈尔

    马萨诸塞州剑桥


    网站（www.ram-shankar.com/notwithabug）。我们断言科学结论明确之处；在没有共识的地方，我们也会指出。Hyrum 和我积极寻求该领域的专家——与数百名
    AI 研究者、安全专业人士、政策制定者和商业领袖交谈。书中所引用的所有内容均来自直接来源。


    这本书不仅仅是关于攻击 AI 系统的科学。只关注这一点，只会回答“什么是对抗性机器学习？”为了给你一个整体画面，本书旨在超越这一点。我们还希望为你提供*那又怎样？*所以，*攻击
    AI 系统对国家安全意味着什么？*所以，*对商业决策者意味着什么？* *对政策制定者？* *对你？*并旨在提供从这里走向何方的草图，包括*现在该怎么办？*


    为了达到这个目标，这本书不得不经历某种中断，这要感谢哈佛法学院的一起真实事件。让我解释一下。


    我有一个直觉，伯克曼·克莱因中心（哈佛大学著名的跨学科研究中心）的每个人都处于两种模式之一：他们要么在写自己的第一本书，要么在写下一本书。所以，当我在微软担任“数据牛仔”期间休假，来到伯克曼研究对抗性机器学习时，我开始写这本书的早期版本，概述攻击
    AI 系统的科学。


    在伯克曼位于剑桥 Queen''s Head 的欢乐时光中，我有幸遇到了科技法律学者明星 Kendra Albert。几天后，我来到 Kendra 在哈佛法学院网络法律诊所的办公室，Kendra
    在那里除其他外，为那些出于善意进行安全研究的黑客提供法律指导。Kendra 手里拿着标志性的笔，以鹰的专注和海狮的俏皮听我讲述攻击 AI 系统的长篇大论。我清晰地记得当时想：鹰海狮
    Kendra。在对话接近尾声时，Kendra 问：“那么，攻击 AI 系统对公民自由的影响呢？”


    我目瞪口呆。在那之前，我——而且据我所知，没有其他 AI 研究者——没有考虑过政策、法律或伦理


    ## 第一章

    ### 你想成为未来的一部分吗？


    “独一无二的西雅图”可能是这座城市马格努森公园的标语，这里有雷尼尔山的绝佳景色，还有太平洋西北地区的各种物产。一个允许狗不拴绳的公园、一个专供放风筝的小山丘、装饰艺术风格的雕塑、一面攀岩墙——所有这些都点缀在伸入华盛顿湖的广阔绿地上。


    但伊万·埃夫蒂莫夫并不是来享受这些的。相反，他站在那里，紧张地举着一个停车标志，等待一辆汽车经过。


    如果你那天在马格努森公园，你可能不会觉得埃夫蒂莫夫的停车标志有什么特别。那是一个标准的红色八角形，上面有白色字母“STOP”。标志上贴着两个奇怪的贴纸。也许是某种涂鸦？当然，没什么不寻常的。


    然而，在人工智能系统的眼中，这个标志的外观讲述了一个完全不同的故事。这个故事将继续撼动人工智能社区，让科技媒体陷入狂热，引起美国政府的注意，并与两年前的另一幅标志性图像一起，成为整个研究领域的代名词。这个标志将会


    车头灯。但卡车也有。也许我们说，汽车是有四个轮子的东西。但手推车和马车也有。你看这个问题：我们很难列出通往解决方案的步骤。这个问题超出了图像识别任务的范围。对一个模糊问题如“我附近最好的面包店在哪里？”给出有品味的推荐，有主观解释——最好由谁说了算？在每种情况下，都很难明确编码让计算机得出正确答案的过程。但你一看便知。Facebook
    照片标记中的计算机视觉、Twitter 用于翻译推文的机器翻译，以及 Amazon 的 Alexa 或 Google 搜索使用的音频识别，都是成功 AI 应用的教科书式案例。


    有时，一个 AI 成功故事代表了真正的突破。2016 年，AlphaGo AI 系统在策略棋盘游戏围棋中击败了一位专家棋手。这一事件通过时代精神三位一体抓住了公众的想象力：*《纽约时报》*的大幅报道、一部引人入胜的
    Netflix 纪录片，以及一篇有见地的*《纽约客》*人物特写。


    如今，该领域继续取得巨大飞跃——不是每年或每月，而是每天。2022 年 6 月 30 日，曾经引领 AlphaGo 的 Deepmind 公司构建了一个 AI
    系统，可以像人类专家一样玩另一种游戏——*Stratego*。这尤其令人印象深刻，因为可能的 *Stratego* 游戏配置数量远远超过 *Go* 中的可能配置。大多少？嗯，大
    10^175 倍。（作为参考，宇宙中只有 10^82 个原子。）就在同一天，仿佛一次突破还不够，谷歌宣布它开发了一个 AI 系统，在回答取自麻省理工学院课程材料（从化学到狭义相对论）的数学问题方面，打破了所有先前的基准。


    当今 AI 系统的能力非常惊人。进步的速度也令人瞠目。你最近是否离开网络去露营或背包旅行了一个星期？如果是的话，那么像我们一样，你可能也错过了一个开创性的
    AI 进步，或者在某个领域一个革命性 AI 系统的宣告。作为机器学习研究者，我们觉得这与其说是对着消防水带喝水，不如说是在暴风雨中用吸管啜饮。


