    深度伪造是这一类别的典型例子，攻击者可以利用 AI 系统令人信服地生成虚假图像、音频、视频和文本。例如，在乌克兰战争期间，俄罗斯使用了一段经过重度剪辑（且相当业余）的弗拉基米尔·泽连斯基总统的深度伪造视频，要求乌克兰军队向俄罗斯投降。创建深度伪造的技术正在迅速改进，并且越来越容易获得。过去需要海量计算能力、耗时数天才能完成的事情，如今你可以通过下载
    Wombo 或 Reface 等应用来实现；你也可以在 deepfakesweb.com 上创建自己的深度伪造。利用 AI 生成大规模杀伤性武器的配方是进攻性
    AI 的另一个例子。这一类别的总体目标是让攻击者利用 AI 进一步磨砺其现有的攻击策略。


    另一个类别——也是本书的主要关注点——是对抗性机器学习，在军事圈中有时被称为*反 AI*。与之前 AI 作为使能工具的情况不同，在对抗性机器学习中，AI 是目标。在这里，攻击者通过主动颠覆机器学习系统使其失败来推进其目标。例如，攻击者试图迷惑自动驾驶汽车中使用的
    AI 系统，使其错误识别限速标志，或者欺骗银行的 AI 系统，将欺诈者开给受害者的 800 美元支票误认为只支付 100 美元。另一个例子是破坏恶意软件检测系统，使攻击者的恶意脚本被误判为良性。


    对抗性机器学习不仅具有颠覆性，而且在我们的话语体系中也处于隐蔽状态。你可能听说过更多关于深度伪造而不是对抗性机器学习的内容，但对抗性机器学习攻击是更古老、更恶毒的威胁，已经开始影响机器学习系统。


    > “*威胁并非假设性的，*”NSCAI 报告明确写道，并继续指出，“*对抗性攻击正在发生，并且已经影响到商业机器学习系统。*”


    ## 机器学习系统不会摇摆；它们会崩溃


    要理解对抗性机器学习，我们首先必须理解 AI 系统是如何失败的。


    机器学习系统可能在*《危险边缘》*中击败人类，解决*《Stratego》*，并轻松解决麻省理工学院的数学问题，但它们也可能以惊人的方式失败。借用纪录片制作人路易斯·塞鲁克斯（Louis
    Theroux）在 TikTok 上走红的歌曲中的措辞，只要轻轻一戳，ML 系统不会只是摇摆；它们会崩溃。


    当 ML 系统失败时，即使没有蓄意挑衅，我们也称之为*非故意失败*。这种情况发生在系统产生形式上正确但往往毫无意义的结果时。换句话说，在非故意失败模式中，系统因其固有的怪异而失败，正如作者贾内尔·肖恩（Janelle
    Shane）在她关于 AI 的趣味书籍*《你看起来像一件东西，我爱你》*中所说。在这些情况下，异常行为通常表现为对其设计者目标的认真但笨拙且字面化的*《阿米莉亚·贝迪利亚》*式遵从。例如，一个被训练玩*《俄罗斯方块》*的算法学会了无限期暂停游戏以避免失败。该算法的设计目的是赢得*《俄罗斯方块》*游戏，并尽其所能不输。像这样的场景就像搞笑诺贝尔奖——先让你发笑，然后让你思考。


    但这并不全是幽默。


    美国空军训练了一个实验性 ML 系统来检测地对地导弹，该系统最初具有 90% 的惊人准确率。但空军学到的不是改变游戏规则的目标识别系统，而是一个发人深省的教训。“真让人意外：该算法表现不佳。实际上它的准确率大约只有
    25%，”一位空军官员评论道。事实证明，该 ML 系统仅被训练用于检测以倾斜角度飞行的导弹。当系统试图检测垂直飞行的导弹时，其准确率急剧下降。幸运的是，该系统并未部署。


    相反，*故意*失败模式的特点是有一个主动的对手，故意导致 ML 系统失败。机器可以被故意迫使其犯错，这应该不足为奇。


    来自 Reddit 和 4Chan 的喷子涌向 Twitter，意图破坏 Tay。为什么？当然是为了好玩！他们很快发现 Tay 会抓住输入数据并用它来改进自己。于是，喷子们用种族主义推文淹没了
    Tay。Tay 吸收了这些内容，并被自动重新训练以模仿互联网喷子。情况变得如此糟糕，以至于微软在推出 Tay 后 16 小时内就将其下架。


    微软原本有一个应对 AI 系统面对个别恶意对话的计划，但被这种协调攻击打了个措手不及。这使得一群互联网陌生人成为了对手。这种通过破坏 AI 系统输入数据来进行的协调攻击被称为*投毒攻击*。就像你可以通过污染水源来毒害一个村庄一样，投毒攻击通过污染输入数据来破坏
    AI 系统的功能。


    然后在 2022 年，Facebook 的母公司 Meta 发布了一个名为 BlenderBot 3 的实验性聊天机器人。根据该公司的博客，BlenderBot
    3 “能够通过自然对话和人们的反馈，搜索互联网来聊几乎任何话题……”。没过多久，用户发现该机器人开始鹦鹉学舌地重复选举阴谋论，称特朗普在输掉选举后仍然是总统，“并且将永远是”。它还变得公然反犹太，称控制经济的犹太阴谋集团“并非不可信”，并且他们“在美国超级富豪中占比过高”。


    验证 NSCAI 的警告——即攻击正在发生并影响商业 ML 系统——至少需要两件事：这些故意失败的概率很高，并且有动机的对手愿意（根据他们的成本收益计算）利用它们。这两个条件都成立。


    ## 永远不要告诉我概率


    当 NSCAI 报告发布时，简·皮内利斯（Jane Pinelis）得到了印证。


    皮内利斯一直领导美国国防部（DoD）负责测试 AI 系统故障的部门，并深知这些系统是多么脆弱。她一直在试图说服五角大楼更认真地对待防御 AI 系统的问题。


    因此，当一个两党专家小组对 AI 的困境及其对国家安全的影响发出警报时，这个问题得到了核心关注。但更重要的是，NSCAI 报告说服国会拨款，以便像皮内利斯这样的专家获得更好的资源来应对这一领域。2021
    年，国会批准了 7.405 亿美元用于大量国防开支计划，以实现美国军队的现代化。该倡议的一个关键要素集中在可信 AI 上。如今，皮内利斯是美国国防部的 AI
    保障负责人，她的工作围绕对按预期运行的 AI 系统（即使在存在对手的情况下）的合理信心展开。


    皮内利斯更喜欢*合理信心*而不是*可信度*，因为信任很难衡量。另一方面，信心是一个在数学上更容易处理的概念。体育预测者可以提供一支足球队赢得超级碗的概率。气象学家可以告诉你明天下雨的概率。


    那么，攻击者在攻击 ML 系统时成功的几率有多大？


    为此，我们求助于大卫·埃文斯（David Evans），他是弗吉尼亚大学专门研究计算机安全的教授。埃文斯有一种不可思议的发现计算机漏洞的能力，并且在这一领域有着传奇般的专业知识。他从未考虑过入侵
    AI 系统的可能性，直到他的一名研究生开始进行系统性地规避它们的实验。当他开始研究攻击 AI 系统时，让他印象深刻的是当前 AI 系统松懈的安全性。


    当你使用加密形式的通信时——比如，你在 Messenger 中发送 Facebook 消息或使用现代网上银行——它建立在旨在提供强加密的方法之上。如果存在任何比尝试所有可能的密钥组合更高效地猜测密钥的方法，这些加密方案将被视为完全被攻破。你问，这有多难？通过暴力破解破坏现代加密的概率是
    10 的 40 次方分之一。换句话说，攻击者仅靠猜测就能破解现代加密方案的可能性，就像你卧室里的每一个空气分子都移动到角落、让你窒息一样。如果发现了一种更高效的方法，加密方案

