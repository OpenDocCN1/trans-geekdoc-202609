  - '[PAGE 120]


    On February 1, 2011, then Corporate Vice President of Microsoft Search, Harry
    Shum, was wrapping up his day at work when news broke that Google had accused
    Microsoft Search of plagiarizing Google’s search results. Microsoft’s Search engine,
    Bing, was downright cheating by copying Google’s search results, Google’s team
    accused. And in a “we’ve got the receipts” moment, Google added it had irrefutable
    proof of Microsoft’s cheating.


    Mortified by the allegations, Shum ordered a deep dive into the situation. There
    was a whirlwind of PR, legal, and technical layers to peel. Owing to his high-profile
    position leading Microsoft’s search engine, Shum saw the company’s embarrassment
    as his own. *A scandal!* So, among the flurry of emails Shum dispatched to his
    deputies, he also emailed his son, reassuring him that he and Bing were in the
    right.


    What came next was nothing short of dramatic. Microsoft vigorously denied the
    allegation. Google denied the denial. From the *Wall Street Journal* to the BBC,
    the story was plastered in the media and even appeared in the monologues of late-night
    TV hosts Jimmy Fallon and Stephen Colbert.


    When Microsoft rebranded its search efforts to Bing in 2009 to capitalize on the
    billion-dollar ad search market, it was already behind the curve. Google dominated
    the market with a 60 percent market share, and Yahoo search maintained a strong
    second position with 20 percent. Microsoft was a distant third, but its search
    had begun to gain traction and was growing fast.


    Google, like any competitor, kept tabs on Bing Search. In a comparative analysis,
    Google noticed that sometimes Bing’s top results would mirror its own. Google
    search engineers suspected something insidious was happening in Bing and Internet
    Explorer’s toolbars. So, in October 2010, Google devised an unprecedented sting
    operation against Microsoft’s Bing.


    Until that time, Google had never wantonly associated a search term with a specific
    site. Search listings were determined algorithmically, and Google took a hands-off
    approach. But when engineers suspected Microsoft of copying its search results,
    Google’s leaders decided to break their cardinal rule just this once.'
