    It was called “the data that transformed AI research and possibly the world.”
    But in the beginning, it was an ordinary poster hanging in the backroom of an
    academic convention in Miami, not too different from what you would expect in
    a middle school science competition.


    The bulk of current ML advancements can be traced to that poster that featured
    the ImageNet dataset: a massive collection of labeled images compiled by Professor
    Fei-Fei Li and her team at Stanford. Before ImageNet, a large dataset may have
    consisted of 10,000 images, but Li and her team painstakingly built a dataset
    of more than 15 million images, each labeled and tagged with remarkable detail.'
