    # Color Me Blind


    When you look at Figure 2-2, you probably do not see a king penguin, a green snake,
    and a school bus. If you did, that would make you a state-of-the-art ML model
    trained on ImageNet. (For this one, you may want to flip to this book’s centerfold
    to see the pictures in color.)


    ![](img/603389cda98d5077376d0de2ba6c5f76_62_0.png)


    Figure 2-2 What do you see in these pictures? Courtesy of Anh Nguyen


    While the three pictures in Figure 2-1 were unaltered images with no additional
    sleight of hand, the pictures in Figure 2-2 were specifically constructed to confuse
    AI systems. The striking thing is that a particular model that otherwise performs
    quite well on ImageNet or even in broader image classification is very convinced—99.92
    percent confident, to be precise—that the rings in the first picture represent
    a penguin.


    This is because AI systems latch on to the images’ color, shape, and texture during
    the training phase and use this spurious correlation to identify images.


    We can see this intuitively. For instance, the image with black vertical bars
    with gray concentric circles was classified as a penguin, perhaps because penguins
    tend to have black and gray overcoats.


    When we remove colors or tinker with the image’s texture, AI systems tend to be
    confused. For instance, researchers trained neural networks on regular images
    and tested them on photos of glass figurines. Glass figurines do not have the
    color or texture information encoded in regular images, so it is much more difficult
    to classify them, and state-of-the-art AI systems floundered when faced'
  - '[PAGE 63]


    with this task. Researchers trained AI systems on regular, colored images but
    tested them on glass figurines without color or texture cues. They found that
    AI systems fared poorly in identifying glass figurines. For instance, the schooner
    shown in Figure 2-3 was identified as a can opener.


    ![](img/603389cda98d5077376d0de2ba6c5f76_63_0.png)


    Figure 2-3 An AI system misidentified this model of a schooner as a can opener.
    Courtesy of Nicholas Baker


    AI systems’ overreliance on color and shape has real-world implications. A small
    gardening business in Canada posted on Facebook about its Walla Walla onions,
    describing them as “sweet, mild, and large” and easy to grow from seed (see Figure
    2-4). Facebook’s algorithms mistakenly flagged this post as sexually suggestive,
    only to later acknowledge the gaffe and reinstate the post. Facebook Canada’s
    head of communications told CBC News that Facebook uses automation to identify
    nudity, but “sometimes it doesn’t know a Walla Walla onion from a, well, you know.”
    It’s easy to dismiss this as a gaffe, but flagged accounts have serious consequences
    for small businesses. They can lose thousands of dollars by being deprioritized
    in feeds or banned. Even when reinstated, it takes time for the algorithm to begin
    promoting the account’s content again.


    Like Facebook, blogging platform Tumblr used AI to detect pornographic content,
    and like Facebook, the AI system made errors (see Figure 2-4). In 2018, Tumblr
    also faced a similar problem when it decided not to continue hosting adult content
    on its platform. Confused Tumblr users took to Twitter with the #toosexyfortumblr
    hashtag to show how their seemingly prosaic images were flagged.'
  - '[PAGE 64]


