    “apple,” we can measure the error in the answer. This is where gradient descent
    kicks in. The error gradient serves as Goldilocks’ cry of “too hot!” signaling
    the model parameters to adjust their settings slightly so that the model will
    now report “apple.”


    The error gradient is quite similar to finding the right temperature setting in
    your shower. We all have an ideal shower temperature that is the perfect mix of
    hot and cold water in our muscle memory. Now imagine being in a new bathroom trying
    to figure out that combination. First, you might tilt the knob to the right (too
    hot!) and then left (too cold!); after a few minutes and dozens of wiggles and
    jiggles, you discover just the right temperature setting for you. That’s what
    happens during training models using gradient descent: the error gradient adjusts
    increases or decreases the parameters until the bulk of the annotated images are
    classified correctly.


    As it turns out, gradient descent, which guides researchers when training a machine
    learning system, is also how attackers can find adversarial examples that evade
    them. But there is one important difference: rather than applying the error gradient
    signal (“too hot!”) to adjust the model parameters, attackers use the error signal
    to adjust the input image.


    When attacking an ML system, the adversary begins by choosing the output they
    want to arrive at, such as confusing an image of an apple as a pear. The adversary
    allows the ML model parameters to remain at their perfectly tuned settings. Without
    modification, the model correctly labels the image of an apple as “apple.” To
    the adversary, this is actually an error! “Too hot!” The error gradient flows
    unchanged through the dials and knobs (the ML model parameters) to the input image
    and suggests precisely how to modify the color and intensity of pixels to arrive
    at the adversary’s goal “just right” so that the ML system can call it a pear.


    Essentially, by using gradient descent, the attacker can ask the ML model, “How
    should I change this image of an apple so that you, the ML model, label it as
    a pear?” The attacker can wiggle and jiggle the input until just the right output
    is achieved.


