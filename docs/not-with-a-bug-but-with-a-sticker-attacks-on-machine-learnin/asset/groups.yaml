    ## 越爬越高，摔得越重


    阿丽娜·奥普雷亚很可能就是人工智能欺骗领域的领军人物。她早年展现出卓越的迹象——在臭名昭著的困难的罗马尼亚全国数学奥林匹克竞赛中获得领奖台名次、卡内基梅隆大学博士学位，并入选
    MIT 35 Under 35——奥普雷亚目前是东北大学的教授。在那里，她和她的实验室坐落在波士顿建筑学会称之为该市最美丽建筑之一的建筑内，系统性地推动针对人工智能系统的投毒攻击的边界。


    有些人工智能系统是否比其他系统更容易受到投毒攻击？为了解答这个问题，奥普雷亚与 Battista Biggio 合作，后者是我们之前看到的对抗性机器学习早期的先驱。一起，他们的实验室阐明了哪些算法容易受到投毒和对抗样本的攻击。这是同类中的首项工作，将这两种对人工智能系统的重要攻击结合在了一起。


    首先，他们表明，正如对抗样本会迁移一样，投毒攻击也会在不同机器学习模型类型之间迁移。从理论上讲，这意味着如果攻击者发现了对 Alexa 使用的对话算法有效的投毒手段，那么
    Google Assistant 很可能也会被其投毒，即使它使用完全不同的机器学习架构来识别语音。漏洞延伸到多个平台。也许不存在“防投毒”的机器学习。攻击者可能能够在不同模型之间重复使用恶意数据点——这是一个非常强大的攻击者优势！


    其次，奥普雷亚和 Biggio 的联合工作还指出了另一种非直观的现象。他们发现，算法越复杂，就越容易受到投毒和对抗样本的攻击。这就是机器学习版的谚语，“The
    higher you are, the harder you fall。”脆弱的数据供应链加剧了人工智能系统的部署复杂性。因此，许多组织都警告不要不必要地开发人工智能。谈论的更多是复杂性和期望而非投毒，Google
    在其机器学习工程师风格指南中写道：“Rule #1: Don’t be afraid to launch a product without machine
    learning. Machine learning is cool, but it requires data. Theoretically, you can
    take data from a different problem and then tweak the model for a new product,
    but this will likely underperform basic heuristics. If you think machine learning
    will give you a 100 percent boost, then a heuristic will get you 50 percent of
    the way there。”换句话说，不要低估简单的人类智慧在解决复杂问题中的作用。


    是的，对抗样本往往是最有趣的——谁不想看到最先进的自动驾驶汽车在停车标志上贴上贴纸时手忙脚乱呢？但投毒攻击令人警惕——这就是让高管们夜不能寐的原因。投毒攻击直击人工智能系统的要害：直指数据来源本身。


    ## 第五章

    ## 你能保守秘密吗？


    这是 2019 年知名播客主持人 Lex Fridman 与特斯拉 CEO Elon Musk 对话的摘录：


    > Lex Fridman: Recently, there are a few hackers who tricked the autopilot to
    act in unexpected ways—adversarial examples. So, we all know that neural network
    systems are very sensitive to minor disturbances to these adversarial examples
    on input. Do you think it''s possible to defend against something like this?

    > Elon Musk: So, yeah.

    > Lex Fridman: ... for long for the industry?

    > (Elon Musk heard laughing)

    > Lex Fridman: Can you elaborate on the confidence behind that answer?

    > Elon Musk: Well, you know, a neural net is just like a bunch of matrix math.
    You have to be like a very sophisticated somebody who really has neural nets and
    like basically reverse engineer how the matrix is being built and then create
    a little thing that''s just exactly what causes the matrix math to be slightly
    off.


    机器学习工程师无法强迫模型 to *unlearn* 一个后门或投毒漏洞。从本质上讲，人工智能的 bug 无法被修补。


    更糟糕的是，人工智能防御者必须担心人工智能漏洞的 *universality*。在传统网络安全中，攻击者通常针对过时且未修补软件中的特定漏洞。由于软件更新，某个软件版本中存在的某些漏洞在应用补丁后可能不再被利用。但是，由于第三章中提到的
    *transferability* 属性，即针对模型 A 的对抗样本也非常可能对模型 B 有效，人工智能防御者无法躲在特定的实现或模型版本后面。相关模型 *share*
    漏洞！因此，在对抗性不对称加剧的情况下，攻击者甚至不需要猜测你的机器学习模型版本。因此，赔率对防御者不利，尤其是在人工智能方面。


    防御者如何修复这种信息不对称？一种策略始于长达十年的痴迷——将人工智能系统保密：企业研究人员试图模糊模型的细节，甚至将整个人工智能系统保密。这可能是基于善意假设，并善意地解读
    Musk 当他说你首先需要访问神经网络时所暗示的。企业研究人员认为锁定系统的各个方面是让对手蒙在鼓里、防止易受攻击的办法。


    但情况恰恰相反。正如本章将看到的那样，推翻人工智能系统所需的时间并未减少。保持隐秘不是一种可靠的策略，原因很简单：就像自然界一样，对手总会找到办法。


    ### 掩蔽很重要


    回想一下，攻击者在对抗样本中的目标是提供一个精心构造的输入给机器学习模型，这个输入可能不会让人类感到困惑，但肯定会让机器学习系统感到困惑，从而给出错误输出。这里的典型例子是攻击者如何改变熊猫图像中的像素，使其对我们来说仍然看起来像熊猫，但最先进的机器学习系统会将其误识别为长臂猿。


    虽然对抗性规避攻击会影响机器学习模型的完整性，但其他攻击仍可能影响模型或数据的保密性。如第三章简要讨论的那样，*model stealing*（或 *model
    extraction*）攻击被攻击者用来窃取模型的功能。这种攻击背后的想法很简单——用输入提示模型，用新收集的训练集记录输出，并创建一个旨在完全模仿受害者模型的模型。


    存在更复杂的攻击，它们使用训练好的模型作为代理来攻击其训练数据的保密性。怎么做到？因为模型在某种程度上是其训练数据的总结，针对模型的攻击可以被设计成实际上攻击其训练集。*model
    inversion* 攻击试图通过观察模型输出的特性来近似重建私有训练数据（例如个人面部的图像）。*membership inference* 攻击旨在通过观察模型对其训练集中样本相对于其他样本的相对置信度来推断私有数据的属性。


    这些强大的黑盒攻击利用了训练并部署的机器学习模型的特性，即使它早已与训练集分离。黑盒攻击究竟是如何可能的？


    当提供一张图像时，大多数现实世界的机器学习系统会输出两条信息——图像的决策（panda or gibbon）和机器学习系统对其决策的相应置信度。假设你向熊猫/长臂猿分类器发送一张未被篡改的熊猫图像进行识别。我们可以期望机器学习系统给出类似决策（“panda”）和置信度（“100%”）的答案。


    在黑盒规避威胁场景中，攻击者利用机器学习系统的方式与合法用户使用系统的方式非常相似——向机器学习系统发送图像并观察置信度分数。攻击者的第一次尝试可能还不会欺骗分类器。（图像可能仍然被识别为熊猫，置信度为“panda—99.8
    percent confident; gibbon—0.2 percent confident”）。但这次尝试为攻击者提供了关键信息。

