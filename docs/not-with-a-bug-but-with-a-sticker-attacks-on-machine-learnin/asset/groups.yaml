  mdcn: '

    有趣的是，发起这些对抗性攻击的工具并没有被锁在秘密保险库里。它们对任何人都是可用的。这是一件好事，因为如果对手利用这些工具，防御者就知道该寻找什么。从 IBM
    的 Adversarial Robustness Toolkit 到 Microsoft 的 Counterfit 再到 Baidu 的 PaddlePaddle，用于规避机器学习系统的工具已司空见惯。使用这些工具不需要博士学位或数学背景；只要具备基本的计算机理解即可。确实存在学习曲线，但它绝对没有从零开始自行设计攻击那么困难。


    黑盒攻击机器学习系统的难度正变得越来越容易。你可以用不到一个大披萨的价格，制作一个大部分时间都能像原版一样工作的仿冒模型。


    这种独特的组合——高影响力——微妙、具体且无处不在——以及低进入门槛，无论在成本还是技能方面，都可能令人担忧。但这对你，读者来说，不必担心。


    好消息是，使用对抗样本的对手不太可能针对普通大众。为什么对手要费尽心思掌握机器学习，了解对抗机器学习的门道，生成贴纸，然后把它们贴在停车标志上希望导致汽车失灵呢？与其这样，攻击者为什么不直接租一个广告牌并闪烁一个让行标志呢？


    实际上，你的 AI 驱动汽车更可能在没有任何对手干预的情况下失灵：恶劣天气、一群海鸥，甚至路边停放的一辆卡车。2021 年，涉及其 AI 驱动 Autopilot
    系统的特斯拉事故报告有 273 起。虽然我们不知道这些事故的确切原因，但我们可以有根据地猜测，其中没有一起是由停车标志上的对抗性贴纸造成的。


    同样，也不必担心智能音箱、Siri 或 Alexa 被音频对抗样本欺骗。这些攻击相当挑剔，在现实世界中很难实施，因为有背景噪音。欺骗你的智能音箱也有良性的方式。例如，说“Cocaine
    noodles”会触发 Google Home 扬声器，因为它听起来像“Okay, Google。”


    这些操纵带来的变化可能产生深远的后果。在空军协会 2021 年空、天与网络大会上谈及机器学习生命周期中可能受对手影响的环节时，负责情报、监视、侦察和网络效应的副参谋长
    Mary O’Brien 中将说，“如果我们的对手在该过程的任何部分注入不确定性，那么我们想要 AI 为我们做的事情就基本无从谈起了。”


    这就是对抗样本的关键问题。那是一张大熊猫的照片还是长臂猿？它可以注入不确定性并动摇我们对 AI 系统的信任。如果被武器化，它就可以成为挫败对手 AI 系统的决定性优势。


    但对抗样本远不是腐蚀 AI 系统的唯一方式。还有一种更易获取且影响更大的方式。


    在一条 Twitter 评论中，一位发帖者提到 Frank 在 TikTok 上的最新视频，该视频现已走红。“这可能有些牵强，但考虑到时间点、视频的病毒式传播以及用户的粉丝人口统计数据...”值得注意的是，Frank
    的 TikTok 视频包含了标签 #prolific。


    Prolific 是一个供科学家招募调查参与者的市场。被从牛津到斯坦福的研究人员使用，Prolific 帮助学者从其全球超过 150,000 名参与者的池中收集高质量回复。作为对受访者时间的回报，Prolific
    以每小时 6.50 美元的价格补偿他们。


    Frank 关于副业热门技巧的 TikTok 视频中建议注册 Prolific 并填写调查问卷以赚取额外收入。随着超过 400 万次观看涌入，该视频因非常特定的群体而走红。大量青少年和年轻成年女性——Frank
    的目标受众——涌向 Prolific 填写调查问卷，导致平台在数天内新增 30,000 名注册用户。它变得如此受欢迎，以至于许多人通过口碑推荐涌向该平台——2021
    年 7 月 24 日的 Google 搜索活动显示，“prolific surveys”一词的搜索量出现积极上升。


    注册人数激增，主要来自青少年和二十多岁的女性，扭曲了精心设计的调查问卷的预期人口统计。如果研究人员不注意谁会被期望回答他们的调查，他们的研究就会被女性突然激增所污染——这是一种非预期的捕获偏差。Prolific
    的联合创始人兼 CTO Phelim Bradley 告诉 The Verge，这条病毒式 TikTok 视频扰乱了 4,600 项研究。Prolific
    后来为受视频严重影响的研究退款，并部署了工具来处理这类激增情况。


    正如一个青少年凭借 56 秒的视频就能通过腐蚀其研究中使用的数据来扰乱数千项科学研究一样，一个有动机的对手也可以通过腐蚀用于训练其模型的数据来扰乱最先进的
    AI 系统。此外，由于这些 AI 系统背后大部分数据都可自由从互联网获取，使用开放数据用于关键 AI 系统的安全性影响是什么？


    ## 数据不良 = 大问题


    组织最担心对 AI 系统的头号攻击并不是针对交通标志的贴纸攻击。


    这正是我们在与使用机器学习的多个组织交谈时发现的：从初创公司到全球的财富 500 强公司再到政府。这是同类中的首次调查，我们吸纳了 AI 工程师和安全分析师，以从行业角度全面了解对抗性机器学习的状态。


    我们发现，组织最担心的问题压倒性的是中毒攻击。这些攻击故意向 ML 系统投喂不良数据，以改变模型从构思开始的行为。其他研究人员的一项后续研究证实，在对 139
    家组织的调查中，中毒是首要关注的问题，尤其在 IT 安全等对手猖獗的领域更为明显。


    但即使没有主动的对手，投喂不良数据也会对 AI 系统造成相当大的损害并导致业务损失。例如，考虑 Unity，这款流行的游戏软件为 Pokémon Go、Call
    of Duty 等视频游戏提供动力，并驱动了超过一半的移动游戏。Unity 在各方面大力投资机器学习以改善游戏体验。但在 2022 年 5 月，它遭受了超过
    1 亿美元的损失，部分原因是其其中一个 AI 系统摄入了“来自大型客户的不良数据”。


    关键问题在于，一旦模型在数据上训练完成，命运就已注定。发现你的输入数据已损坏并想修复你的模型？今天，唯一可行的选择是从头开始——重新训练模型。这需要大量资源：昂贵的计算资源以及开发人员的时间和精力，远离创建新功能。事实上，Unity
    的 CEO 告诉投资者，“由于重新优先安排团队工作以彻底解决弹性问题和数据训练问题，我们推迟了某些创收功能的发布。” Unity 在随后的季度修复了该问题。


    数据质量管理问题进一步因对手试图主动向系统注入不良数据而变得复杂。


    中毒攻击以微软的 Tay Twitter 机器人抓住了科技界的想象力，该机器人因互联网喷子通过与之互动污染其输入数据而在发布 24 小时内被停用。Tay 已成为中毒攻击的教科书案例——研究人员将其作为警示故事，说明对手如何通过注入不良数据来操纵最先进的
    ML 系统。


    在你深入本章之前快速提醒一下：在对抗性机器学习中，对手是指违反 ML 系统所建立假设的任何人。对手并不总是指戴兜帽的黑客，也不总是需要博士学位。它可能是一个想要欺骗广告追踪器或为了证明某点而欺骗公共组织的人。


    ## 你的 AI 由幽灵工人驱动


    你可能认为构建实际的机器学习算法是开发机器学习系统最困难的部分。这在很大程度上是由于其宣传方式：“先进”、“智能”以及“由数学驱动”。


    然而，对大多数组织而言，创建 AI 系统最困难的部分是将数据以正确的格式送到算法门口进行处理。良好的机器学习性能的关键是好的数据。有一个常见的说法“数据是新的石油”。但在数据上致富远不止于在西德克萨斯草原找到合适的钻探地点。找到可以一再利用的数据来源只是挑战的一部分。为了为你关心的应用提供燃料，数据还必须经过提炼。工程师必须采取许多步骤才能使数据处于正确的格式。数据需要被收集，然后清理、标注并正确格式化，以便算法可以摄入。


    每个数据源和随后的精炼过程都会在产品开发中引入复杂性。事实上，来自 ML 工程师的

