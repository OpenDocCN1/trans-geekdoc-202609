    learning AI—Bajraktari soaked it all in. He soon put himself at the center of
    action for all things AI by organizing the National Defense University’s first-ever
    symposium on AI. He expected 10 people to show up. The response was so overwhelming
    that he had to turn away hundreds of people because of the room’s fire code. While
    Bajraktari didn’t know it yet, his time studying AI at the Department of Defense,
    the White House, and the National Defense University was preparing him for a leadership
    role.


    Separately, U.S. government leaders were increasingly worried about the lack of
    strategic direction for AI, especially in the face of increased adoption of AI.
    In 2017, Canada was the first country in the world to release a national AI strategy,
    and other countries followed suit. With the 2020s on the horizon, if the United
    States didn’t act soon, not only would it flounder, but it might even have to
    cede the head start in AI innovation to other countries.


    Take, for instance, “Alexa for Artillery,” an idea a team at the Pentagon wanted
    to build. The idea, on the face, was straightforward: soldiers on the ground should
    be able to launch artillery using voice commands. The team (incorrectly) rationalized
    that speech recognition had made huge strides in recent years and was fit for
    use in defense. What the team didn’t consider was that while speech recognition
    works in ideal conditions—such as when there is low ambient noise, like your living
    room—it would flail once inserted into a thunderous war zone. (Thankfully, the
    idea was snuffed out.)


    It is only natural for the U.S. government to be concerned about the rapid pace
    of AI progress and its inability to keep up with unforeseen consequences. For
    instance, when researchers from a small medical company slightly tweaked an ML
    system used for drug discovery, the results were unexpected. Within 6 hours, the
    researchers learned that instead of helping humanity find new drugs, the ML system
    produced the recipe for 40,000 toxic chemical compounds, including the VX nerve
    agent—a weapon of mass destruction. “The reality is this is not science fiction,”
    the researchers wrote in their findings. When the results were published in the
    influential *Nature* science journal, emails flew back and forth among the National'
