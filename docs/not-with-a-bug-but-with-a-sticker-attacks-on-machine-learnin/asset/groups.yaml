    Take AI for medicine. In 2018, Scott Gottlieb, then FDA commissioner, wrote that
    AI “holds enormous promise for the future of medicine” when approving one of the
    early trials of AI in medical diagnosis. But that promise may be in peril if ML
    systems’ brittle nature leaves them susceptible to attack.


    Researchers from Harvard and MIT showed that the mere act of rotating an image
    of a lesion can cause the AI system to change the diagnosis—very confidently.
    Not only can it lead to a missed cancer diagnosis, rotating the image can also
    flip the diagnosis from benign to malignant (see Figure 2-12). Why would anyone
    do that? Insurance fraud. Imagine a dermatologist holding the camera at a weird
    angle to take pictures to bilk the insurance company. It brings new meaning to
    the phrase, “The diagnosis is in the doctor’s hands.”


    ![](img/603389cda98d5077376d0de2ba6c5f76_76_1.png)


    **Figure 2-12** All it takes to attack a state-of-the-art AI healthcare algorithm
    is to rotate the image. Courtesy of Samuel G. Finlayson


    The core of the problem is that machine learning systems use shortcuts to learn.
    They latch onto backgrounds, clutch to color, turn to texture—and are simply conditioned
    on cues.


    It is not the use of shortcuts that’s problematic. Humans use shortcuts, too.
    We use acronyms to recall colors of the rainbow, remember a colleague by the color
    of their hair, and associate memories with smells. The constant oversell of AI
    having superhuman abilities and the barrage of headlines of AI superiority are
    odious. This overtrust puts us at risk—from worthless porn filters to incarceration
    of the innocent.


    Here is the kicker: All it takes for an attacker to confuse a complicated ML algorithm
    is to identify and hack these shortcuts. An amateur can cause traffic jams on
    Google Maps with a wagon full of phones, entrap a self-driving car with salt and
    electrical tape, and evade porn filters by coloring the pictures green.


    So, if that’s what an amateur can do, what damage could be caused by a skilled
    researcher or motivated adversary?


    ## Chapter 3

    ### Subtle, Specific, and Ever-Present


    By any measure, the attack that fooled AI systems in autonomous vehicles into
    misrecognizing a stop sign for a speed limit sign by using a carefully designed
    arrangement of stickers was famous. It would be exhibited at the celebrated Science
    Museum in London alongside Boaty McBoatface, an unmanned underwater vehicle whose
    name was chosen by the British public. Eventually, the very stop sign used to
    misdirect AI systems underpinning autonomous vehicles at Magnuson Park would become
    part of the museum’s permanent collection.


    Only one other attack on AI systems has similarly gripped the imagination of the
    AI populace. In fact, if you read about securing AI systems—be it in news articles,
    policy briefs, or even high-brow academic research—you simply cannot escape its
    mention. It has come to iconify the entire field of adversarial machine learning,
    and the work that generated it has become foundational to other machine learning
    evasion attacks—including the stop sign sticker attack.


    ## Intriguing Properties of Neural Networks


    A research work entitled “Intriguing Properties of Neural Networks” had all the
    trappings of a landmark paper when it was posted in 2014 at a famous machine learning
    conference called ICLR (often pronounced “eye-clear”). The primary author, Cristian
    Szegedy, was affiliated with Google, had already established himself as a deep
    learning juggernaut, and would go on to help Google win the ImageNet competition.
    A coauthor, Ilya Sutskever, was part of the original winning team that had already
    won the ImageNet competition and sparked the deep learning revolution. Between
    its alluring title and the cachet of its (quite literally) award-winning authors,
    one thing was certain: people would be paying attention to this paper.


    A hitherto unknown graduate student, Ian Goodfellow, was among the list of luminary
    authors. When Goodfellow received an offer to intern at Google, he was elated.
    He was a graduate student at one of the most celebrated and well-resourced labs
    run by revered AI pioneer Yoshua Bengio. But being a graduate student was no match
    for a Google internship’s unparalleled perks, including “Googley extras.” Beyond
    the handsome salary and an opportunity to work on real-world problems where data
    and compute were readily available without constraints, Google showered its interns
    with free housing, gym memberships, transportation, and massages. And, of course,
    they were provided with the most famous perk of all—free food. This is not your
    run-of-the-mill free food. How good can it be? you are thinking. A food reviewer
    from Serious Eats magazine wrote: “Lunch at Google HQ is as Insanely Awesome as
    You Thought.” On the day the reviewer visited one of Google’s numerous cafés—each
    with its own theme—lunch included in-house baked bread and honey, kale salad with
    squash, corn dumplings, locally sourced Rockfish encrusted with nuts, and pecan
    bars that were described as “light and borderline savory, with just a faint touch
    of maple, and garbanzo flour to render these gluten-free.” All this free food


    But all through the internship, Goodfellow really didn’t believe Szegedy’s line
    of research was consequential. Like Szegedy’s critics who turned away his ideas,
    Goodfellow also believed there was nothing novel or interesting about the failure
    of neural networks. He also thought the solution to the perturbing pixels problem
    confusing the classifier was trivial. “I didn’t think it would be very hard to
    get rid of,” he told us. The entire time he was working on the project, Goodfellow
    simply thought of it as “doing a favor” for “hot-shot” Szegedy.


    Beyond optimizing Szegedy’s code, Goodfellow also made another contribution: changing
    Szegedy’s name for this phenomenon from “funny perturbations” to “adversarial
    examples.” It was rooted in game theory, where the perturbations were worst-case
    inputs an adversary might present to confuse a model. The new moniker also had
    an unplanned effect. The notion of an adversary—a malicious attacker who could
    topple the system—lent some gravitas to the situation. While people may dismiss
    “funny perturbations” as a parlor trick pablum, the rebranding ushered in some
    much-needed solemnity and seriousness. *What’s in a name?* you ask. The moniker,
    adversarial examples, now defines the entire field of securing AI systems.


    Even after Szegedy published the paper in 2014, Goodfellow was doubtful about
    the idea, but Google’s free lunch would play a role again in advancing the field.


    By 2014, Goodfellow had transitioned from an intern to a full-time employee at
    Google Brain. He was poking around with defending against adversarial examples.
    He quickly coded up his idea, kick-started the experiment on the computer, and
    went to the café for lunch. When he returned, he found that the experiment had
    broken all previous defense records. State-of-the-art techniques that claimed
    to protect against adversarial examples just crumbled. This all happened in the
    time it took for him to survey and sup at Google Café’s saporous spread. For the
    first time, Goodfellow was genuinely excited about the area. He eventually published
    the results containing the now-famous panda-gibbon picture. After that 2014 publication,
