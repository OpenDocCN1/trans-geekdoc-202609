  - '[PAGE 200]


    But the stars aligned, and the word that a ragtag group of academic researchers
    hacked Impalas reached the car’s manufacturer, General Motors. These researchers
    were invited for a show-and-tell.


    When this academic team showed up at General Motors, they did what all academicians
    do when they give presentations: go through the gory detail of their methodology.
    Think a wall of text on white-background slides. But then, toward the end of their
    presentation, the researchers turned on the windshield wipers, blared the horns,
    played music, and caused the parked car on the curb to move—all from the confines
    of the conference room. General Motors was stunned. This was a real threat. In
    record time, General Motors appointed a vice president of security to take car
    hacking seriously. In what would later be seen as an inflection point, other car
    companies followed suit.


    DARPA, the vanguard in bringing moonshot projects to fruition, kicked off an effort
    to ensure that cyber-physical systems can be trustworthy. NTHSA, the organization
    responsible for vehicular safety and currently investigating failures in Tesla,
    added first-ever security guidelines for car manufacturers, despite being among
    the skeptics who questioned Kohno’s work.


    This is a happy story for everyone. Academic researchers unveiled never-before-seen
    threats. Car companies responded with collective, concrete, and clear action and
    the U.S. government responded with investments and regulation, that all together
    staunched this security threat. Skepticism about the viability of these security
    threats was real, but no one waited around for the first big attack on cars to
    appear on the front page of the New York Times. No one waited for the threat of
    class-action lawsuits or the threat of inducements. No one waited around for lives
    to be lost because a car’s security was compromised. No one was a dogmatic denier.


    Ten years later, the Oakland conference that was once tepid to this work gilded
    Kohno and the entire team with their most prestigious award: the “Test of Time”
    honor. Kohno would go on to become a computer science professor at the University
    of Washington and eventually advise a student, Ivan Evtimov, on formulating the
    famous “stop sign” attack against self-driving cars.'
