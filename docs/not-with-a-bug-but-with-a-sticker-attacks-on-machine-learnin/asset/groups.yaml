  - '[PAGE 59]


    background, we are not beholden to those cues. For instance, if you were to see
    a fish in an absurd setting—on the living room sofa—you would still be able to
    recognize it as a fish.


    But machines do not have this same power of decomposition and reasoning about
    objects. A Twitter account with the @ResNextGuesser (it is a play on Microsoft’s
    ImageNet winning AI system, ResNet) handle allows you to inspect this phenomenon.
    Users can post pictures and memes to @ResNextGuesser and discover how AI systems
    identify them. For instance, a picture of a tower of yellow cheese slices is confidently
    identified as pineapple. A refrigerator filled with eggs is classified as ping-pong
    balls with 99 percent confidence. In another homage to The Mitchells vs. the Machines,
    it misidentified a chihuahua dog as a muffin.


    Machine learning’s raison d’être is to predict about data it has never seen before.
    All the accuracy numbers we have seen from the ImageNet competition are from practice
    tests in ideal conditions. ImageNet data is pristine, patiently labeled, and high
    quality. But in real-world exams, our algorithms flounder because data can be
    unexpected. For instance, if an AI system was trained on pictures of butterflies
    perched on flowers, then showing an image of a butterfly perched on a dog or table—or
    even a different type of flower than used in training—would break the AI system.
    As we will see, the AI system is not really generalizing the concept of identifying
    objects in any setting. Generalization for the AI system means doing well beyond
    one dataset. It means doing well in the real world.


    Nowhere is the gulf between testing ML algorithms in controlled situations and
    in real-world testing wider than with autonomous vehicles.


    MIT’s self-driving car spinoff, nuTonomy, was acquired for $450 million just 4
    years after the company was launched, and it had the receipts to show it was worth
    the price. nuTonomy had inked deals with Lyft, Grab, Peugeot, and autonomous driving
    pilots in Singapore. As it piloted in tropical, sunny Singapore, nuTonomy also
    was engaged in phased piloting on its home turf of Boston.'
