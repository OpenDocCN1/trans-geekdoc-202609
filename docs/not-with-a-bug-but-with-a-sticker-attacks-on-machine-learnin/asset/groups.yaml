    Health is to serve as a catalyst to save and improve lives around the world and
    lower costs through cognitive computing,” Kathy McGroddy, then vice president
    of IBM Watson Health, told Fortune in 2016. Yet, after $5 billion in acquisitions,
    a swanky presence in Cambridge, Massachusetts, and a litany of partnerships from
    Apple to Under Armour, Watson Health failed.


    How did our supposed AI overlord fail? Watson Health’s recommendations were often
    obvious, such as suggesting chemotherapy as an option for a cancer patient. Other
    times, remedies lacked context, like providing recommendations for procedures
    unavailable in the area. And sometimes, the diagnoses were downright wrong. In
    trials, doctors were more frustrated than assisted. Riddled with disappointment,
    IBM sold off Watson Health.


    There are everyday examples of trust resolution problems. Google Maps and related
    services have remarkably changed how we drive. We trust them to navigate our vehicle
    in unfamiliar neighborhoods and cities. So, why not trust it for mountaineering?
    Hikers wanting to take in the majestic views of Scotland from the 4,500-foot Ben
    Navis peak were guided by the mapping service to drive to the nearest parking
    location and then walk a short, dotted line to the mountain’s peak. Interpreting
    the dotted path as the recommended trail, many hikers became stranded along a
    route that Scottish mountaineering charities warned was “potentially fatal.” These
    Scottish mountaineering charities even added, “The trail is highly dangerous and
    for advanced hikers only.” Trust resolution in navigation software has caused
    hikers to get lost in the mountains from New Hampshire to the Appalachian trails.
    Google Maps retroactively fixed the issues, but the lesson is clear: the navigation
    prowess of a mapping service on roads—a task-specific capability—does not deserve
    our trust in a system-wide capability of, say, mountain hiking, running on trails,
    or sailing on the high seas.


    The trust resolution problem is magnified by marketing that accentuates sophistication,
    portraying actual rather than artificial intelligence. Often, stock photos symbolizing
    AI systems feature a human brain. Organizations ascribe human-like qualities to
    machines. Their products are “smart” with “intelligent” features.'
