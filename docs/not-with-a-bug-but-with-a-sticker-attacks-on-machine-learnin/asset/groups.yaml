    ![](img/603389cda98d5077376d0de2ba6c5f76_92_0.png)


    Figure 3.4 The image on the left is unaltered and recognized as 5. The one on
    the right is an adversarial example and recognized as a 1. If you squint your
    eye, you may notice it is fuzzy and grainier.


    But how do you “move” the 5 from one side of the boundary to the other? The adversary
    generates a specific noise-like pattern and adds it to the original number 5 image.
    The resulting grainier, subtly perturbed image (rightmost image in Figure 3-5)
    still looks like number 5 to humans but will be classified as 1 because of the
    additive adversarial pattern. The resulting image is the “adversarial example”
    because the subtle yet specific adversarial noise pattern we added pushes the
    5 to the 1 region. It’s not just any noise. It’s very specific noise that corresponds
    to the shortest path for a border crossing. Adding the specific “adversarial noise”
    to the original image subtly changes the original image but drastically changes
    the prediction.


    ![](img/603389cda98d5077376d0de2ba6c5f76_92_1.png)


    Figure 3.5 This is the specific noise added to “move” it across the decision boundary.


    The same concept works everywhere.


    - Want to confuse an AI-powered X-ray system into misrecognizing a malignant scan
    as benign (see Figure 3-6)? Add adversarial noise.

    - Want to confuse an AI-powered audio transcription service that mistranscribes
    “What is the time?” to “Cancel the meeting”? Add adversarial noise.


    Adversarial examples are present in all ML models.


    ![](img/603389cda98d5077376d0de2ba6c5f76_93_0.png)


    Figure 3.6 Adding adversarial noise to medical image scans has the potential to
    confuse AI systems. Here the AI system changes its diagnosis from benign to malignant
    after adding the adversarial noise. Courtesy of Samuel G. Finlayson


    A definitive explanation for the existence of adversarial examples, like the gibbon-panda
    pairs that result from only tiny perturbations, is still a matter of debate among
    experts. But, no matter which of the theories you subscribe to, a key question
    is this: How does an adversary discover the precise pattern of pixels to formulate
    the attack?


    Turns out, there is an easy recipe. The same recipe is used to teach ML systems
    to be smart.


    ## The Intelligent Wiggle-Jiggle


    Niles: The atmosphere has to be absolutely perfect.

    Frasier: Good point. Let''s begin with the lighting.

    Niles: Warmer. [Frasier turns the switch a tad to the right.]

    Niles: Warmer. [Frasier turns the dial more to the right.]

    Niles: A little cooler. [Frasier turns the dial to the left.]

    Niles: A touch warmer. [Frasier turns the dial right again.]

    Niles: A hair back. [Frasier gives up and goes over to the drinks cabinet while
    Niles, still concentrating on the lighting, keeps on talking.]

    Niles: No, no, a hair the other way. No, a touch warmer. Perfect.


    > — Frasier, Season 4, Episode 4


    Three things make up a machine learning system: input data, output label, and
    the parameters in the middle. The parameters are something like an AI system''s
    dials and levers, which are tuned in a specific way so that the input is mapped
    to the appropriate output.


    Let''s pretend you want to train a machine learning system that can distinguish
    apples from pears. First, you would collect hundreds or thousands of images of
    apples and pears and then provide labels for each image. You''d arrange these
    data in pairs, so each image has a corresponding label. For example, using (image-label)
    pairs, we might collate pictures of apples and annotate them as "apples" and pictures
    of pears and annotate them as "pears." The machine''s learning task is to fit
    the parameters of a model so that it can reproduce the correct output label for
    each input image. Many modern machine learning systems depend on an algorithm
    called gradient descent to tune the parameters to be just right to achieve the
    objective.


    Before training, the parameters do not define a model representing the data particularly
    well. When presented with a training image of an apple, the parameters might initially
    be wired to report "pear." Because we''ve annotated the image with the correct
    label, “apple,” we can measure the error in the answer. This is where gradient
    descent kicks in. The error gradient serves as Goldilocks’ cry of “too hot!” signaling
    the model parameters to adjust their settings slightly so that the model will
    now report “apple.”


    The error gradient is quite similar to finding the right temperature setting in
    your shower. We all have an ideal shower temperature that is the perfect mix of
    hot and cold water in our muscle memory. Now imagine being in a new bathroom trying
    to figure out that combination. First, you might tilt the knob to the right (too
    hot!) and then left (too cold!); after a few minutes and dozens of wiggles and
    jiggles, you discover just the right temperature setting for you. That’s what
    happens during training models using gradient descent: the error gradient adjusts
    increases or decreases the parameters until the bulk of the annotated images are
    classified correctly.


    As it turns out, gradient descent, which guides researchers when training a machine
    learning system, is also how attackers can find adversarial examples that evade
    them. But there is one important difference: rather than applying the error gradient
    signal (“too hot!”) to adjust the model parameters, attackers use the error signal
    to adjust the input image.


    When attacking an ML system, the adversary begins by choosing the output they
    want to arrive at, such as confusing an image of an apple as a pear. The adversary
    allows the ML model parameters to remain at their perfectly tuned settings. Without
    modification, the model correctly labels the image of an apple as “apple.” To
    the adversary, this is actually an error! “Too hot!” The error gradient flows
    unchanged through the dials and knobs (the ML model parameters) to the input image
    and suggests precisely how to modify the color and intensity of pixels to arrive
    at the adversary’s goal “just right” so that the ML system can call it a pear.


    Essentially, by using gradient descent, the attacker can ask the ML model, “How
    should I change this image of an apple so that you, the ML model, label it as
    a pear?” The attacker can wiggle and jiggle the input until just the right output
    is achieved.


