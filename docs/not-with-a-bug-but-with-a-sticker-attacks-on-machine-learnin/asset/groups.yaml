  - '[PAGE 38]


    its mission.” While this might seem like a generous budget, the services of a
    single junior consultant—fresh from a university with no experience—in one of
    the big four consulting firms are typically billed to commercial entities at a
    rate of about $1 million per year. The NSCAI initially estimated 28 full-time
    personnel, representing the cream of the crop in AI and national security—a good
    reminder that no one works in government for the money. Compared to the billions
    a Silicon Valley venture capitalist would willingly part with when someone utters
    the word AI, Congress provided NSCAI less money than it takes to run a 60-second
    Super Bowl commercial.


    Another hurdle for Bajraktari: the laws of physics. Congress put NSCAI on the
    hook for not one but three reports—two interim and one final report to deliver
    the findings and road map for AI. The U.S. government had already incorporated
    or was en route to incorporating AI systems into its mission. It could not wait
    for things to die in committee (or workstreams). If the United States had to course
    correct, it had to know soon. So, the NSCAI was under tight deadlines to assemble,
    deliberate, and deliver the findings.


    Bajraktari did what all leaders in history would do when faced with a monumental
    task that must be done with excellence and expedience: tap into trusted people
    he had worked with before. For instance, Tara Rigler, his colleague from his White
    House days, was already a member of the federal civilian senior executive service
    in the Department of the Interior. To pitch his NSCAI sale to Rigler, Bajraktari—a
    master of persuasion—asked, “Do you want to be part of the future?” Rigler was
    sold. She became NSCAI’s director of communications. Piece by piece, Bajraktari
    assembled a high-functioning cohort committed to the cause tapping into his colleagues
    from his White House and Department of Defense days and attracting top talent
    from the Department of Commerce, the State Department, and the U.S. Congress.


    Most commissions in the government take years to build owing to a bureaucratic
    process that is not only a Kafkaesque nightmare but also outdated, using almost
    Dickensian technology choices for completing the paperwork. But Bajraktari was
    relentless and unremitting in cutting through the red tape. He painstakingly grew
    the crew with more than 130 staff members passing through the NSCAI doors over
    the two years.'
