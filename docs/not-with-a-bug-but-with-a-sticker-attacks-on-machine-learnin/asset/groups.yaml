    learning engineer can''t force a model to *unlearn* a back door or poison vulnerability.
    In essence, AI''s bugs can''t be patched.


    To make matters worse, AI defenders must worry about the *universality* of AI
    vulnerabilities. In traditional cybersecurity, attackers often target a specific
    vulnerability in dated and unpatched software. Thanks to software updates, certain
    vulnerabilities that exist for one software version might no longer be exploited
    when the patch is applied. But, owing to the *transferability* property in Chapter
    3, in which an adversarial example for model A is also very likely to work for
    model B, AI defenders cannot hide behind a particular implementation or model
    version. Related models *share* vulnerabilities! So, in an exacerbation of adversarial
    asymmetry, attackers needn''t even guess your ML model version. So, the odds are
    stacked against defenders, especially when it comes to AI.


    How do defenders fix this information asymmetry? One strategy began as a decade-long
    obsession with keeping AI systems under wraps: corporate researchers attempting
    to obfuscate the minutiae of the models or even keep entire AI systems a secret.
    This could be, assuming positive intent and kindly interpreting what Musk hinted
    at when he said you first need access to the neural nets. Corporate researchers
    thought locking down the aspects of the system was a remedy for keeping adversaries
    in the dark, preventing easy attacks.


    But the opposite has happened. As we will see in the chapter, the time to topple
    the AI system has not decreased. Keeping things hidden is not a reliable strategy
    for one simple reason: like nature, adversaries will always find a way.


    # Masking Is Important


    Recall that the attacker''s goal in adversarial examples is to provide a carefully
    constructed input to the ML model, which might not confuse a human but will most
    definitely confuse the ML system to provide the wrong output. The canonical example
    here is how an adversary can change the pixels in an image of a panda so it still
    looks like a panda to us, but a state-of-the-art ML system would misrecognize
    it as a gibbon.'
  - '[PAGE 135]


    While adversarial evasion attacks affect a machine learning model’s integrity,
    other attacks can still affect the confidentiality of the model or data. As discussed
    briefly in Chapter 3, *model stealing* (or *model extraction*) attacks are used
    by adversaries to steal the functionality of a model. The idea behind this attack
    is simple—prompt the model with inputs, record the outputs with the newly collected
    training set, and create a model that aims to mimic the victim model exactly.


    More sophisticated attacks exist that use a trained model as a proxy to attack
    the confidentiality of the dataset it was trained on. How? Because a model is,
    in some sense, a summary of its training data, attacks against a model can be
    crafted to actually attack its training set. A *model inversion* attack attempts
    to approximately reconstruct private training data (such as an image of an individual’s
    face) by observing the properties of the model’s output. A *membership inference*
    attack aims to infer properties of the private data by observing the model’s relative
    confidence about samples in its training set compared to other samples.


    These powerful black-box attacks exploit the properties of a trained and deployed
    ML model, even after it has long been separated from its training set. How exactly
    are these black-box attacks possible?


    When provided an image, most real-world machine learning systems would output
    two pieces of information—the decision of the image (panda or gibbon) and the
    ML system’s corresponding confidence in its decision. Suppose you were to send
    an untampered image of a panda to a panda/gibbon classifier for identification.
    We could expect from the ML system an answer along the lines of the decision (“panda”)
    and confidence (“100%”).


    In a black-box evasion threat scenario, the adversary exploits an ML system very
    much how a legitimate user would use the system—send an image to the ML system
    and observe the confidence score. The adversary’s first attempt might not fool
    the classifier yet. (The image might still be recognized as a panda with the confidence
    level being “panda—99.8 percent confident; gibbon—0.2 percent confident”). But
    this attempt gives the adversary key information.'
