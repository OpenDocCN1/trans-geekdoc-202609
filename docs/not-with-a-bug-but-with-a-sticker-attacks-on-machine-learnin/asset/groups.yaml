    \ AI 安全。\n✓ 团队已为其软件和数据摄取管道、训练管道、部署管道以及推理系统配备了日志记录和/或攻击检测能力。 |\n| 当 ML 系统受到攻击时，我们的响应计划是什么？\
    \ | ✓ 当 ML 系统被攻陷时，团队有一套可行的备用方案，其中可能包括人工覆盖控制。 |\n\n## 致谢\n\n套用弥尔顿的话说，这本书的主题令我欣喜，我选择已久，动笔却迟。它是我疫情期间的酸面包，但如果没有这么多人的贡献，它仍不过是未发酵的面粉和水。\n\
    \n与海勒姆合著这本书是我做过的最轻松的决定。狄俄墨得斯说得最好，当他挑选全能的尤利西斯作为探险伙伴时：“两个人在一起时，其中一人可能会看到另一人未曾发现的机会；如果一个人单独行动，他的资源就会减少，智慧也会减弱。”海勒姆是一位无与伦比的对抗性机器学习研究者，能力超群，始终友善。我像狄俄墨得斯一样感激有海勒姆同行，并在此过程中让我变得更加睿智。\n\
    \n大卫·富盖特是文学界传奇般的人物。用我朋友那句不朽的话来说：“你和安迪·威尔怎么可能有同一个经纪人？”我确实不知道。我所知道的是，大卫的超能力是倾听。每当我们遇到问题，大卫都会倾听，深思熟虑地分析情况，进而提供一个从未见过的视角，然后像一个\n\
    \n随后，在众多专家的反馈和对话下，这本书经历了无数次重写和修订，这些专家涵盖人工智能研究者、网络安全专业人士、政策专家和商业领袖：肯德拉·阿尔伯特、罗斯·安德森、马尤兰·阿西穆兰、伊利·巴伊拉克塔里、约翰·班塞默、巴蒂斯塔·比焦、哈罗德·布思、迈尔斯·布伦戴奇、安德鲁·伯特、尼古拉斯·卡利尼、杰森·陈、卡马利卡·乔杜里、玛吉·德拉诺、埃里克·道格拉斯、奥伦·埃齐奥尼、大卫·埃文斯、伊万·埃夫蒂莫夫、凯文·艾克霍尔特、亚当·富克斯、瑞安·费达苏克、厄伦斯·费尔南德斯、内特·菲克、尼克·菲利厄姆、大卫·弗里曼、汤姆·戈尔茨坦、伊恩·古德费洛、凯瑟琳·格罗斯、玛雅·古普塔、丹·亨德里克斯、斯里尼瓦桑·艾耶、安·约翰逊、弗兰克·纳格尔、苏迪普托·拉克希特、吉·科诺、希马·拉卡拉朱、马克·麦戈文、尼古拉斯·帕佩诺特、威尔·皮尔斯、布莱恩·彭德尔顿、乔恩·彭尼、简·皮内利斯、阿斯法内·里戈、米克尔·罗德里格斯、阿比谢克·希瓦库马尔、瓦萨维·桑达拉姆（谢谢你，芝麻！）、保罗·沙尔、布鲁斯·施奈尔、乔治·塞韦里、马特·斯旺、克里斯蒂安·塞格迪、海伦·托纳、弗洛里安·特拉默、克里斯·维索帕尔。这本书站在他们的肩膀上。\n\
    \n我对马克·拉西诺维奇、埃里克·霍维茨和马特·斯旺的指导深怀感激。他们是各自领域的泰斗，每次互动都教导我要保持好奇心，并挑战我自己对世界运作方式的假设。没有他们的善意和慷慨，这本书不可能问世。\n\
    \n我还要感谢 PJ 梅基什、米克尔·罗德里格斯、莎伦·夏、海勒姆·安德森、瑞安·科瓦尔和尼古拉斯·帕佩诺特，他们为我的奥德修斯扮演了风神埃俄罗斯。他们的慷慨真的熠熠生辉。\n\
    \n疫情期间交织在一起的是我自己的*万恶之源*。但要感谢我的兄弟、我的依靠伊姆兰·卡德尔·马斯坦，以及我的*第一步*，我找到了纵身跃入深渊的勇气，结果发现那里是一张羽毛床。\n\
    \n这本书也是对太平洋西北地区的颂歌。它是在仍居住于此的土著人民未经割让的祖地上写成的。当写作灵感以令人羞惭的否定回应我的呼唤时，我在周围的美丽中找到了慰藉、帮助和独处。从阿纳科特斯群岛到高山荒野的湖泊；从斯诺夸尔米山脉到萨默兰草甸；从卢德洛港的日出到穆基尔特奥的日落；从库格山的山坡到艾达技术咖啡馆的扶手椅；从国王调频的“音乐浓缩咖啡”晨间节目到温思罗普的晨跑——这一切都奋力驱散了空白之页的暴政，又俏皮地倾泻出一个措辞浮夸的痴人的风采。我内心是马德拉斯，灵魂是常青。\n\
