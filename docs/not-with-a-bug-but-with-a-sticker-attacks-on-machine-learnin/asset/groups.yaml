  mdcn: "\n拉姆·尚卡尔·西瓦·库马尔 • 海勒姆·安德森，博士\n\n布鲁斯·施奈尔作序\n\n## 不是 Bug，而是贴纸\n\n针对机器学习系统的攻击及其应对之策\n\
    \n> “随着 AI 融入从社交网络到关键业务基础设施和防御系统的所有计算机系统，这些系统的安全性取决于其所用 AI 的安全性。本书通过引人入胜的故事和富有洞见的示例，呈现了\
    \ AI 独特的安全风险和考量。这是对安全专业人士以及采用和开发 AI 的组织的一记警钟。”\n> \n> ——*马克·鲁西诺维奇，微软 Azure CTO\
    \ 兼技术院士*\n\n> 作者用来开篇的“威胁并非假设”一语，在读完这部杰作得出结论时，依然萦绕心头。在最后几段中，有一点很明确：这是在号召行动，我们必须“携手并肩”，从速保障\
    \ AI 系统的安全。\n> \n> ——*维杰·博利纳，DeepMind 首席信息安全官*\n\n> “西瓦·库马尔和安德森带你经历一场狂野之旅，揭示 AI/ML\
    \ 的胜利与成就。要在这个领域具备 AI/ML 素养，这本书应是必读之作。”\n> \n> ——*大卫·布伦利，卡内基梅隆大学电子与计算机工程及计算机科学教授*\n\
    \n> “无论好坏，信任正逐渐成为我们与 AI 关系中的关键方面。《不是 Bug，而是贴纸》是一本令人大开眼界的书，它将改变你对遍布我们世界的这些系统的看法——所有构建这些系统的人都应将书中的教训铭记于心。”\n\
    > \n> ——*布莱恩·克里斯蒂安，《对齐问题》作者*\n\n> “《不是 Bug，而是贴纸》罕见地深入揭示了那些让安全专家夜不能寐的荒谬 AI 怪癖。我马上就会开始引用书中的例子。”\n\
    > \n> ——*珍妮尔·肖恩，《你看起来像个东西，而我喜欢你：AI 如何运作，以及它为何让世界变得更加离奇》作者*\n\n> “终于——而且来得正是时候——一本用平实的语言描述了保障如今无处不在的机器学习工具安全所面临的独特而深层问题的书。无论你是希望在自己的领域部署这些工具，还是仅仅作为如今受其影响的数十亿人之一，这都是至关重要的读物。”\n\
    > \n> ——*乔纳森·齐特兰，哈佛大学乔治·贝米斯国际法教授兼计算机科学教授*\n\n> “我们正迅速进入一个强大但脆弱的 AI 系统世界，在这个世界里，故障可能导致灾难性后果。西瓦·库马尔和安德森撰写了一本必不可少的指南，帮助我们理解当今\
    \ AI 系统那些独特且令人不安的失效模式。通过这些通俗易懂的示例和轶事，他们剖析了机器学习系统的问题，以及社会如何应对这些问题来建设一个更安全的世界。”\n\
    > ——保罗·沙雷，《四大战场》与《无人军队》作者\n\n> “西瓦·库马尔和安德森是机器学习与安全交叉领域的资深专家，在这部作品中，他们带领我们愉快地游览了这个迷人领域的历史。本书深入探讨了为什么这个领域应成为那些开发和部署\
    \ AI 系统的人的首要任务之一，并提供了丰富的素材，无论是新手还是专业人士都能从中受益。这本书的读者将在机器学习方面获得竞争优势，尤其是在责任成为部署先进技术系统不可妥协的一环之际。”\n\
    > ——阿布舍克·古普塔，蒙特利尔 AI 伦理研究所创始人兼首席研究员\n\n## 不是 Bug，而是贴纸\n\n## 不是 Bug，而是贴纸\n\n*针对机器学习系统的攻击及其应对之策*\n\
