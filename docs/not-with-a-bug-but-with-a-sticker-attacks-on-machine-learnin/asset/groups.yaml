    of self-driving cars to watch television in the car. And safety drivers are being
    removed in toto from self-driving taxis in China. As we will see in subsequent
    chapters, it does not take much to confound autonomous vehicles.


    There is one particular area where overtrust and improper trust resolution are
    a liability: cybersecurity. Years of cyberattacks have taught us one incontrovertible
    lesson: where there is overtrust, there is always a motivated adversary willing
    to exploit it.


