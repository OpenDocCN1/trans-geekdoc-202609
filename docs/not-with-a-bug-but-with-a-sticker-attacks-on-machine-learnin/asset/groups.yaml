    AI systems—the perceived crown jewels of their organizations, the ones in which
    their organization pays NFL-style salaries to build—are fallible, especially at
    an adversary’s hands.


    But governments we have spoken to catch on instantly. There is no need to persuade
    them that this is an emergent problem they should care about. Governments worldwide
    have a graduate-level appetite for this topic, while most companies still eat
    at the kids’ table. One rationale is that sophisticated AI systems from the government
    will invite sophisticated attackers. Governments need to prepare for that eventuality.


    The trouble for the U.S. government’s AI systems will most likely stem from China.
    When it comes to research about attacking and securing AI systems, China is neck
    and neck with the United States. In our interviews, multiple experts repeatedly
    stressed that framing AI as an arms race, where there is a single definite winner,
    is not productive.


    One thing, however, is certain: the country that secures its AI systems will have
    two obvious advantages. First, the country can ensure that its critical AI systems—from
    defense to healthcare—are appropriately protected from adversarial manipulation.
    Also, as a byproduct, the country would reap the benefit of protection from unintentional
    failures. This will lead to a wider trust among its citizens that the AI systems
    work as intended, leading to better adoption. Second, the country will also have
    a leg up in attacking ML systems since hardening from these attacks also naturally
    provides insights into how these systems can be exploited.


    But a third advantage will also be conferred upon a nation that can secure its
    own AI systems: a leg up in diplomacy. Helen Toner, Director of Strategy at Georgetown’s
    Center for Security and Emerging Technology, is an expert in China-U.S. AI affairs,
    especially regarding AI safety. In 2021, Toner and her colleague noted, “Preventing
    AI accidents could even be an opportunity for engagement with China, which faces
    the same accident risks as other AI powers.”'
