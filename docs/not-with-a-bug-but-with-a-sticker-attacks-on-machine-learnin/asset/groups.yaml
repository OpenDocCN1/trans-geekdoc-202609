    The initial findings themselves packed a punch. Bajraktari and the two commission
    chairs headed to the White House to brief President Donald Trump about the findings.
    The Oval Office meeting was scheduled for 15 minutes but lasted for nearly an
    hour. On December 2020, at the twilight of his presidency, Trump signed an executive
    order entitled “Promoting the Use of Trustworthy Artificial Intelligence in Government.”


    Even when there was a change of guards, the NSCAI continued to receive unfettered
    adoration all around. The NSCAI held a summit to discuss the final report at the
    Mayflower Hotel Ballroom in DC on July 13, 2021—well into Joe Biden’s presidency.
    In a time when the bitter bile of rancor flows through American politics, both
    Democratic and Republican leaders of the House and Senate all sent their affirming
    messages—a rare kumbaya moment. It was bipartisanship like never before. The Executive
    Branch came out in full force, too. The Secretaries of Defense, Commerce, and
    State, the National Security Advisor, and the Director of the Office of Science
    and Technology Policy all made in-person appearances and spoke to the masked and
    socially distanced audience members. Getting one cabinet member in a room is difficult
    enough—but to get five? In the middle of a pandemic? It was a powerful way for
    the U.S. government to signal to its allies and adversaries that the United States—from
    its highest levels of trade, diplomacy, defense, security, science, and technology—was
    ready to take AI and the NSCAI’s recommendation seriously.


    That’s because when NSCAI delivered the final report on March 2021 to the President
    and U.S. Congress, the first realistic assessment of where the country stands
    appeared on the very first page—which, by the Commission’s own admission, was
    uncomfortable to deliver.


