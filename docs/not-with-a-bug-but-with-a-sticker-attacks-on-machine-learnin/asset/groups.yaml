    # The Higher You Climb, the Harder You Fall


    Alina Oprea may very well be the doyenne of AI deception. Gilded with early signs
    of excellence—a podium finish at the notoriously difficult Romanian National Math
    Olympiad, a PhD from Carnegie Mellon University, and listed in MIT’s 35 Under
    35—Oprea is currently a professor at Northeastern University. There, situated
    in what the Boston Society of Architects dubbed one of the most beautiful buildings
    in the city, Oprea and her lab systematically push the boundaries for poisoning
    attacks against AI systems.


    Are some kinds of AI systems more susceptible to poisoning than others? To answer
    this, Oprea teamed up with Battista Biggio, who we previously saw as an early
    adversarial machine learning pioneer. Together, their labs shed light on what
    kind of algorithms are susceptible to poisoning and adversarial examples. It was
    the first work of its kind, bringing together these two important attacks on AI
    systems.


    First, they showed that just as adversarial examples transfer, poisoning attacks
    also transfer across different ML model types. Theoretically, this means if an
    adversary discovers an effective poison pill for the conversation algorithm used
    by Alexa, chances are, Google Assistant would also be poisoned by it, even it
    if used completely different ML architectures to recognize speech. The vulnerability
    extends across multiple platforms. There may be no “poison-proof” ML. And an attacker
    may be able to reuse malicious data points across models—a very powerful attacker
    advantage!


    Second, Oprea and Biggio’s joint work also pointed to another nonintuitive phenomenon.
    They discovered that the more complex an algorithm is, the more vulnerable it
    is to both poisoning and adversarial examples. This was machine learning’s version
    of the proverb, “The higher you are, the harder you fall.” A vulnerable data supply
    chain compounds the deployment complexity of AI systems. As a result, many organizations
    caution against the unnecessary development of AI. Speaking more to complexity
    and expectations than poisoning, Google writes in their style guide for machine
    learning engineers: “Rule #1: Don’t be afraid to launch a'
