  mdcn: '

    关于人工智能“阿喀琉斯之踵”的整体构建——尤其是来自一个美国视为“未来最重大威胁”的国家——将美国人工智能国家安全委员会（NSCAI）置于这样的背景之下：它为何诞生于美国众议院军事部门；为何委员会的研究结果具有迫在眉睫的紧迫性；以及为何英国、加拿大和欧盟等其他民主政府已开始严阵以待，采取积极措施保护其人工智能系统。


    在提交给特朗普总统和美国国会的最终报告中，NSCAI 提出了措辞强硬的建议。委员会坦率地指出：“除了少数例外，保护人工智能系统的理念在工程设计和部署人工智能系统中一直被事后考虑。”它建议“至少”有七个组织对此予以关注，包括国土安全部、国防部、联邦调查局和国务院。


    NSCAI 似乎在唤醒这些高风险组织，使其意识到人工智能系统可能遭受攻击的威胁。NSCAI 报告以德尔斐神谕般的神秘口吻，指示关键机构“关注并纳入有意和无意的机器学习故障方面的进展。”


    NSCAI 如何为这一建议辩护？它引用了叶夫季莫夫（Evtimov）的研究——他举着一个贴有贴纸的停车标志站在马格努森公园。于是你就能让自动驾驶汽车将这一标志误认为限速标志。这样一来，汽车非但不会停下，反而会疾驰而过。


    但这个听上去简单的结论其实暗藏玄机。那些贴纸是经过特殊设计并精确放置的。这个停车标志研究源于凯文·艾克霍尔特（Kevin Eykholt）在密歇根大学读博时的想法。艾克霍尔特提出了这一构想，最终促成与另外四所大学的合作，其中包括华盛顿大学——当时的叶夫季莫夫也是那里的博士生。因此，当叶夫季莫夫在马格努森公园举着贴有特定贴纸的停车标志时，该研究是与一批其他顶尖计算机科学家、博士和教授合作完成的。他们结合数学和编程，确定了能骗过负责识别物体的汽车人工智能系统的特定贴纸图案。（你可以翻到彩色插页查看贴有贴纸的停车标志。）


    在虚构的米切尔一家的冒险中，那只哈巴狗并没有任何改变。没有贴纸，没有修改，也没有博士。仅仅看到这只狗，就让动画中的 AI 反派们失灵了。


    但这部动画片并不脱离现实。让我们来探讨强大如歌利亚的人工智能系统是如何被击倒的——不仅是被技艺精湛的大卫们，也可能是业余爱好者、乌合之众和无名小卒。


    ## 接受挑战


    它被称为“改变了人工智能研究、甚至可能改变世界的数据”。但最初，它只是迈阿密一次学术会议后厅里悬挂的一张普通海报，与你在中学科学竞赛中看到的海报并无太大区别。


    当前大多数机器学习进步都可以追溯到那张展示 ImageNet 数据集的海报：这是斯坦福大学李飞飞教授及其团队整理的大规模标记图像集合。在 ImageNet
    之前，一个大型数据集可能只包含 1 万张图像，但李飞飞及其团队费尽心血构建了一个包含超过 1500 万张图像的数据集，每张图像都经过精细标记和标注。


    这个数据集之所以重要，是因为让 AI 系统更好地完成其任务的最佳（也当然是最简单的）方法之一，就是为它提供更多数据。这是因为一个传统共识：一个拥有大量数据的笨
    AI 系统，永远胜过只有少量数据的聪明系统。一切归结为数据的规模、多样性和质量。


    ImageNet 是一个里程碑式的贡献，不是因为它是第一个数据集，而是因为它是第一个真正*大规模*的数据集——比之前的数据集大 1000 倍。


    李飞飞团队不仅拥有数量优势，ImageNet 的图像也具有足够的质量，能够捕捉人类可能看到的场景。团队搜索互联网，查询搜索引擎并抓取 Flickr 等照片托管网站，寻找对焦清晰、光线良好、不太杂乱或模糊的图像。然后团队使用人工来标注图片内容。最终成果是一个健壮、全分辨率、带标签的数据集，可供研究人员训练他们的计算机视觉算法。


    有了这个数据集，李飞飞和她的团队推出了 ImageNet 大规模视觉识别挑战赛（ILSVRC），这是一项跟踪计算机视觉进展的年度竞赛。当时，赢得 ImageNet
    竞赛对机器学习研究者来说相当于赢得奥运会。获胜者后来获得的回报从登上《*纽约时报*》到在微软、谷歌、百度和华为担任高级职位，不一而足。


    当然，随之而来的还有金钱。DNNResearch 是由 2012 年竞赛的获奖研究者创立的公司，在太浩湖的一场秘密拍卖后被谷歌以 4400 万美元收购。2013
    年获奖者创办的 Clarifai 则筹集了 3000 万美元，并在赛事结束后的三年内于纽约、华盛顿特区和旧金山开设了办公室。在当年达到与获胜参赛作品相当的成绩被视为质量标志。例如，2014
    年 Metamind 的 800 万美元初始融资发布时，该公司的新闻稿特别指出其表现与 2014 年的获胜参赛作品一样好。几年后，Metamind 被 Salesforce
    以 3300 万美元收购。


    这项竞赛之所以受欢迎，是因为它有助于展示计算机视觉领域的飞速进展。事实上，在……的最后几年


    后续层逐渐学会识别图像中突出的形状。最终的“输出”层将前几层的边缘、轮廓和形状整合起来，识别整个图像。因此，算法不是在一瞬间确定图像，而是通过一层层地推进形状和特征来锁定正确的身份。随着层数的增加，采用神经网络的机器学习系统每年的错误越来越少，如表
    2-1 所示。


    **表 2-1 — 按网络规模划分的错误率**


    | ImageNet 竞赛年份 | 网络规模 | 错误率 |

    |---|---|---|

    | 2010（竞赛开始） | 1 层 | 28.2% |

    | 2011 | 1 层 | 25.8% |

    | 2012 | 8 层 | 16.4% |

    | 2013 | 8 层 | 11.7% |

    | 2014 | 22 层 | 6.7% |

    | 2015 | 152 层 | 3.57%（低于人类 5% 的错误率） |


    普遍的直觉是：更多层意味着识别图像的分辨率更高，因此能更好地完成手头的任务。


    因此，2012 年，多伦多大学的研究人员利用这一直觉，承担起为 CNN 增加更多层的单一任务。


    但额外的层是有代价的。首先，每增加一层都需要更多数据来训练更大的模型；其次，研究人员需要更多计算能力来处理额外数据。幸运的是，ImageNet 为第一个需求提供了解决方案：为深度神经网络提供更多数据。拥有
    1500 万张标记图像的 ImageNet 数据库正是解决这一问题的完美良药。


    但第二个问题——计算负担的增加——在当时普遍使用的计算机技术条件下，构成了一个几乎不可能完成的计算场景。于是，多伦多大学的研究人员从一套意想不到的剧本中撕下了一页——电脑游戏。


    背景，我们并不受这些线索的约束。例如，如果你看到一条鱼出现在荒谬的场景中——客厅沙发上——你仍然能够认出它是一条鱼。


    但机器并不具备这种分解和推理物体的能力。一个名为 @ResNextGuesser 的 Twitter 账号（这是对微软赢得 ImageNet 的 AI 系统
    ResNet 的戏仿）可以让你观察这一现象。用户可以向 @ResNextGuesser 发布图片和梗图，发现 AI 系统如何识别它们。例如，一张黄色芝士片堆成的塔被自信地识别为菠萝。一个装满鸡蛋的冰箱被以
    99% 的置信度归类为乒乓球。在另一处致敬《米切尔一家大战机器》的情节中，它把一只吉娃娃狗误认为是松饼。


    机器学习存在的意义是对从未见过的数据进行预测。我们从 ImageNet 竞赛中看到的所有准确率数字，都来自理想条件下的模拟测试。ImageNet 数据是原始、耐心标注且高质量的。但在真实世界的考试中，我们的算法会表现不佳，因为数据可能是出人意料的。例如，如果一个人工智能系统是在栖息在花朵上的蝴蝶图片上训练的，那么展示一张蝴蝶栖息在狗或桌子上的图片——甚至是一种不同于训练中使用的花朵——都会让该系统崩溃。正如我们将看到的，AI
    系统并不是真正地在泛化“在任何场景中识别物体”这个概念。对 AI 系统来说，泛化意味着在一个数据集之外也表现良好。它意味着在真实世界中表现良好。


    在受控环境和真实世界测试之间，ML 算法表现的差距，没有比自动驾驶汽车更大的了。


    MIT 的自动驾驶汽车衍生公司 nuTonomy 在成立仅 4 年后就以 4.5 亿美元被收购，而且它有证据显示自己物有所值。nuTonomy 与 Lyft、Grab、标致（Peugeot）达成了交易，并在新加坡开展了自动驾驶试点。在热带、阳光明媚的新加坡试点的同时，nuTonomy
    也在其本土波士顿进行了分阶段试点。

    '
