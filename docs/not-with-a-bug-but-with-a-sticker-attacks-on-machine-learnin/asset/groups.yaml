    *k-nearest neighbor* algorithms. Completely different ML models are fundamentally
    vulnerable to the same adversarial examples.


    This was a stunning result with multiple ramifications, as we will see in this
    and subsequent chapters. Why this happens remains very much open to debate among
    machine learning experts.


    How does the *transferability property* of ML help an attacker in a black-box
    setting? Simply put, an attacker can first replicate the behavior of a black-box
    model through a model that''s in their control to create. This new model, since
    it is in the attacker''s control comes with all the information needed to launch
    whitebox gradient attacks: inputs, outputs, and parameters. Using white box attacks
    that rely on gradient descent, the adversary can produce adversarial examples.
    But these are adversarial examples on the replicated model; not the original model,
    you might say. This is where Papernot''s transferability result comes into play:
    there is a good chance that the adversarial examples found on the replicated model
    will work against the original model.


    In practice, the process looks like this: let''s assume that the attacker wants
    to fool a bank''s handwritten digit-recognizer software used to identify numbers
    in checks. Obviously, the attacker does not know the details of this model, but
    the attacker can effectively *steal* the functionality by creating a replica for
    which it *does* know the details.


    First, the attacker queries the bank''s model with sample input handwritten digits
    and records the model''s responses. These become the pairs of inputs and outputs
    required to train a surrogate model. The surrogate model could be any type, but
    for convenience, the attacker chooses the one most efficient for gradient-based
    white-box attacks. Training the model requires time and computing resources. This
    already constitutes a *model-stealing* attack.


    But the attacker goes further. With the surrogate model at hand, the attacker
    is now in a white-box setting. Since the attacker designed the surrogate, the
    attacker knows the model type and the model parameters and can generate adversarial
    examples freely using gradient descent techniques. Now, the attacker has adversarial
    examples that fool their stolen copy, the surrogate model.'
