    500 平方英尺、周围环境不变的房间里正常工作。你的自动驾驶汽车必须在动态条件下推理——从降雪到海鸥。自然而然，大自然会带来更多的故障模式。


    此外，发现自动驾驶汽车的故障会引人关注。从报纸到政策简报，都在向这些攻击致敬，警告我们一个简单的技巧如何能骗过一辆复杂的汽车。这触动了我们内心深处的大卫与歌利亚情结——一个庞大如巨兽的人工智能系统如何被简单的贴纸弄糊涂。人工智能系统大多数时候表现良好，尽管我们已经看到桥梁和阴影等平庸的物体如何令它们困惑。那么，当一个有动机的对手积极试图使系统瘫痪时会发生什么？


    破坏自动驾驶汽车的一种方法就是简单地在它周围画一个圆圈。詹姆斯·布里德尔自行搭建了一个神经网络视觉系统并将其安装在他的汽车上。为了展示他自己的计算机视觉系统的局限性，他画了两个同心圆：内圈是实线，外圈是虚线。当他驾驶着他自制的、装有摄像头和机器学习算法的自动驾驶汽车时，他可以驶入圆圈，但无法驶出（见图
    2-8）。这是因为汽车将圆圈和车道标记混淆了。虚线是一种道路标记，告诉驾驶人（人类和自动驾驶）可以变道；实线表示不得变道。虽然是从虚线进入，但自动驾驶汽车拒绝从实线驶出，从而将汽车困住。（布里德尔恰如其分地将他的作品命名为“自动驾驶陷阱
    001”。）他用盐画了这些圆圈，并称之为“盐圈”，指的是用盐来困住灵魂的异教仪式。


    ![](img/603389cda98d5077376d0de2ba6c5f76_73_0.png)


    **图 2-8** 一辆自动驾驶汽车因将盐圈误认为车道标记而动弹不得。


    截图来源：《自动驾驶陷阱 001》（詹姆斯·布里德尔，2017 年），由艺术家提供


