    ## 自动驾驶陷阱 001


    不假思索，你在图 2-7 中看到了什么数字？


    ![](img/603389cda98d5077376d0de2ba6c5f76_71_0.png)


    **图 2-7** 速度标志上简单的电工胶带让特斯拉的传感器误将限速识别为 85。


    McAfee, LLC


    好吧，到这个时候，你已经知道是怎么回事了。一切都不是表面看起来那样。在这种情况下，McAfee 的研究人员使用简单的胶带验证了他们的假设：只需拉长数字 3，就能迷惑特斯拉
