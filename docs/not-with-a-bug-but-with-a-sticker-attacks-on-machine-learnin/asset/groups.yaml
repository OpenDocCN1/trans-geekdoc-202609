    to classify them, and state-of-the-art AI systems floundered when faced with this
    task. Researchers trained AI systems on regular, colored images but tested them
    on glass figurines without color or texture cues. They found that AI systems fared
    poorly in identifying glass figurines. For instance, the schooner shown in Figure
    2-3 was identified as a can opener.


    ![](img/603389cda98d5077376d0de2ba6c5f76_63_0.png)


    Figure 2-3 An AI system misidentified this model of a schooner as a can opener.
    Courtesy of Nicholas Baker


    AI systems’ overreliance on color and shape has real-world implications. A small
    gardening business in Canada posted on Facebook about its Walla Walla onions,
    describing them as “sweet, mild, and large” and easy to grow from seed (see Figure
    2-4). Facebook’s algorithms mistakenly flagged this post as sexually suggestive,
    only to later acknowledge the gaffe and reinstate the post. Facebook Canada’s
    head of communications told CBC News that Facebook uses automation to identify
    nudity, but “sometimes it doesn’t know a Walla Walla onion from a, well, you know.”
    It’s easy to dismiss this as a gaffe, but flagged accounts have serious consequences
    for small businesses. They can lose thousands of dollars by being deprioritized
    in feeds or banned. Even when reinstated, it takes time for the algorithm to begin
    promoting the account’s content again.


    Like Facebook, blogging platform Tumblr used AI to detect pornographic content,
    and like Facebook, the AI system made errors (see Figure 2-4). In 2018, Tumblr
    also faced a similar problem when it decided not to continue hosting adult content
    on its platform. Confused Tumblr users took to Twitter with the #toosexyfortumblr
    hashtag to show how their seemingly prosaic images were flagged.


    AI systems identifying problematic content at scale can help human reviewers prioritize
    tricky content and possibly ameliorate the trauma of repeatedly seeing disturbing
    content. But, as we have seen, AI systems are error-prone because of their idiosyncrasies,
    such as latching on to color when identifying images. The very companies deploying
    AI systems for content moderation—Facebook, Tumblr, Instagram, and Twitter—acknowledge
    that their systems are error-prone and they must continually work to improve them.


    In 1964, U.S. Supreme Court Justice Potter Stewart famously wrote that he couldn’t
    describe what obscenity is, but “I know it when I see it.” More than 50 years
    in, AI systems are mistaking onions for, well, you know.


    ## Translation Fails


    On August 4, 2017, the technology magazine *Verge* reported that “Facebook’s translations
    were now powered completely by AI.” Facebook had radically improved its translation
    system by employing machine learning. Each of the 4.5 billion daily Facebook Translate
    translations was completely powered by neural networks. Facebook’s blog post announcing
    this transition to complete algorithmic automation ended with a sense of optimism:
    “We will continue to push the boundaries of neural machine translation technology,
    with the aim of providing humanlike translations to everyone on Facebook.”


    And like humans, these translations are not perfect, as one construction worker
    in the Palestinian Beitar settlement found out on October 4, 2017. Leaning against
    a bulldozer and balancing a cup of coffee and a cigarette, a smiling Palestinian
    man posted “Good Morning” in Arabic on Facebook. Soon enough, he was arrested
    by the Israeli West Bank police on “suspicion of incitement” based on his Facebook
    post. Why? Someone in the Israeli police force had used Facebook’s translation
    system to translate the Arabic post to Hebrew, rendering it incorrectly as “hurt
    them.” When the same Arabic post was translated to English, Facebook mistranslated
    it to “attack them.” Facebook’s translation system failed to reliably

