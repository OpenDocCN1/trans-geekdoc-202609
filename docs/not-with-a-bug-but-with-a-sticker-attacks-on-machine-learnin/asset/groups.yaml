    But all through the internship, Goodfellow really didn’t believe Szegedy’s line
    of research was consequential. Like Szegedy’s critics who turned away his ideas,
    Goodfellow also believed there was nothing novel or interesting about the failure
    of neural networks. He also thought the solution to the perturbing pixels problem
    confusing the classifier was trivial. “I didn’t think it would be very hard to
    get rid of,” he told us. The entire time he was working on the project, Goodfellow
    simply thought of it as “doing a favor” for “hot-shot” Szegedy.


    Beyond optimizing Szegedy’s code, Goodfellow also made another contribution: changing
    Szegedy’s name for this phenomenon from “funny perturbations” to “adversarial
    examples.” It was rooted in game theory, where the perturbations were worst-case
    inputs an adversary might present to confuse a model. The new moniker also had
    an unplanned effect. The notion of an adversary—a malicious attacker who could
    topple the system—lent some gravitas to the situation. While people may dismiss
    “funny perturbations” as a parlor trick pablum, the rebranding ushered in some
    much-needed solemnity and seriousness. *What’s in a name?* you ask. The moniker,
    adversarial examples, now defines the entire field of securing AI systems.


    Even after Szegedy published the paper in 2013, Goodfellow was doubtful about
    the idea, but Google’s free lunch would play a role again in advancing the field.


    By 2014, Goodfellow had transitioned from an intern to a full-time employee at
    Google Brain. He was poking around with defending against adversarial examples.
    He quickly coded up his idea, kick-started the experiment on the computer, and
    went to the café for lunch. When he returned, he found that the experiment had
    broken all previous defense records. State-of-the-art techniques that claimed
    to protect against adversarial examples just crumbled. This all happened in the
    time it took for him to survey and sup at Google Café’s saporous spread. For the
    first time, Goodfellow was genuinely excited about the area. He eventually published
    the results containing the now-famous panda-gibbon picture. After that 2014 publication,
    Goodfellow took the baton and ran with adversarial'
