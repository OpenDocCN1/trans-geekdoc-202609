    of a lesion can cause the AI system to change the diagnosis—very confidently.
    Not only can it lead to a missed cancer diagnosis, rotating the image can also
    flip the diagnosis from benign to malignant (see Figure 2-12). Why would anyone
    do that? Insurance fraud. Imagine a dermatologist holding the camera at a weird
    angle to take pictures to bilk the insurance company. It brings new meaning to
    the phrase, “The diagnosis is in the doctor’s hands.”


