    In February 2017, nuTonomy received approval from the City of Boston to expand
    the testing of its autonomous vehicles. However, February weather in Beantown
    comes with a lot of snow. The falling snow altered how the sensors perceived the
    car’s surroundings, causing problems for the vehicle. It turns out that this is
    not just a sensor issue; it is a lack of data issue. There aren’t many datasets
    of cars driving in snowy conditions because much of the autonomous vehicle testing
    is done in warmer parts of California, Texas, Arizona, and Florida.


    Autonomous vehicle testing wasn’t just affected by inclement weather. Sometimes,
    the banalest objects encountered while driving, like the pug in the Mitchells
    movie, confounded autonomous vehicles. For instance, according to a report prepared
    by the World Economic Forum, seagulls posed a problem for nuTonomy. The cars came
    to a standstill every time seagulls stood on the road. nuTonomy’s sensors identified
    an object on the road and refused to move until cleared. (Later, the engineers
    made the vehicle slowly inch forward to shoo away the seagulls.)


    This is not a problem endemic to one car manufacturer. The Insurance Institute
    for Highway Safety (IIHS), a U.S. nonprofit that curates commercial vehicle safety
    ratings, reached a similar conclusion in 2018 when it tested adaptive cruise control
    in various cars. For instance, they found that Tesla’s Model 3 slowed down seven
    times in their testing when it encountered shadows of trees.


    Bridges are another problem for most self-driving cars. When Uber was testing
    its autonomous cars in Pittsburgh, it found that bridges were hard for its systems
    to negotiate. This is a bit of a problem because Pittsburgh—the City of Bridges—has
    446 of them.


    Such failures are now so commonplace you can find many such videos on YouTube.
    For instance, Tesla’s AI system misrecognized a rising full moon as a traffic
    signal, with the moon glow perhaps being interpreted as the yellow light of a
    traffic semaphore. In another case, Tesla users reported that cars slowed down
    in front of the Burger King billboards displaying the fast-food restaurant’s circular
    logo with its name written in red between two yellow buns.


    Perhaps Tesla’s AI system also misrecognized these to be signals to yield? One
    can only surmise.


    Burger King was the clear winner here. It capitalized on this gaffe with its #autopilotwhopper
    ad campaign, giving smart car drivers a free burger when visiting their restaurants.


    The good news is that AI systems in autonomous vehicles are always improving,
    given the rapid progress in AI as a field and the ability to update these systems
    constantly. For instance, Tesla was able to remediate the Burger King problem
    via a software update.


