    sentiments? Both negative?


    According to BERT (short for Bidirectional Encoder Representations from Transformers),
    Google’s 2019 state-of-the-art ML system for text processing, the first sentence
    conveys a positive sentiment, while the second conveys a negative sentiment. For
    the second sentence, researchers used specific algorithms to discover that substituting
    “spotless” for “perfect”—despite having the same meaning to humans—confused the
    text processing system. This starkly contrasts with the evasion used by Twitter’s
    bot detector in Chapter 1, which appended random characters to a tweet. A visual
    inspection would have caught the alterations in the tweet, but adversarial examples
    are covert and not easily spotted by visual inspection. To us humans, both sentences
    are similar, but for the state-of-the-art ML system, the difference can be day
    and night.


    Today, adversarial examples are one of the hottest areas in machine learning.
    A study of all the papers published in this area so far has identified Szegedy’s
    and Goodfellow’s works as the two most highly cited foundational works in AI Security.
    Subsequent papers in the field would later identify 2014—the year Szegedy’s and
    Goodfellow’s works were published—as the start of the adversarial machine learning
    revolution. But like most revolutions, the groundwork for worst-case adversarial
    inputs to evade machine learning was laid almost a decade earlier.


    ## Research Disciplines Collide


    If you had visited the Whistler Blackcomb Ski Resort in Whistler, British Columbia,
    from 1987 to 2013, you might have shared a ski lift with some of the most celebrated
    ML researchers in the world. It was no secret that the early organizers of the
    Neural Information Processing Systems (NeurIPS) conferences enjoyed powdery white
    snow, even noting that “The workshop program schedule allows time for informal
    discussions, skiing, and other winter sports.”


