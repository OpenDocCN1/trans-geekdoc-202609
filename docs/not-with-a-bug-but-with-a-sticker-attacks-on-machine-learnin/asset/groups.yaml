    DARPA to remark that it was the first time “a machine was allowed to play in a
    historically all-human tournament.” Although AI did not play a dominant role for
    any of the teams in the DARPA cyber grand challenge, the challenge was a bellwether
    for things to come—how attackers can leverage automation and machine learning
    to work alongside their existing arsenal for their goal and benefit.


    Deepfakes are the shining example in this category wherein attackers can leverage
    AI systems to convincingly generate fake images, audio, video, and text. For instance,
    during the Ukraine War, Russia used a heavily edited (and quite amateur) deepfake
    of President Volodymyr Zelensky to ask the Ukrainian forces to surrender to Russia.
    The technology to create deepfakes is rapidly getting better and more accessible.
    You can do what used to take days to generate with massive computing power today
    with downloaded apps like Wombo or Reface; you can also create your own deepfakes
    at deepfakesweb.com. Using AI to generate formulas for weapons of mass destruction
    is another example of offensive AI. The broad goal of this category is for attackers
    to leverage AI to further sharpen their existing attack strategy.


    The other category—and this book’s main focus—is adversarial machine learning,
    sometimes called *counter AI* in military circles. Unlike the previous case where
    AI is used as an enabler, in adversarial machine learning, AI is the target. Here,
    the attacker is furthering their goal by actively subverting the machine learning
    system to fail. For instance, the attacker is trying to confuse AI systems used
    in self-driving cars to misrecognize a speed limit sign or fool a bank’s AI system
    into misrecognizing an $800 check written by a fraudster to a victim that is paid
    out as only $100. Another example is corrupting a malware detection system to
    misidentify an attacker’s malicious script as benign.


    Adversarial machine learning is not just subversive; it’s also subterranean in
    our discourse. Chances are you have heard more about deepfakes than adversarial
    machine learning, but adversarial machine learning attacks are older, pernicious
    threats that have started to affect machine learning systems.


