    The only thing rivaling the astonishing speed of ML systems is their proliferation.
    In the zeal to capitalize on the advancements, our society has deployed ML systems
    in sensitive areas such as healthcare ranging from pediatrics to palliative care,
    personalized finance, housing, and national defense. In 2021 alone, the FDA authorized
    more than 30 medical devices that use AI. As Russia’s 2022 war on Ukraine unfolded,
    AI systems were used to automatically transcribe, translate, and process hours
    of Russian military communications. Even nuclear science has not been spared from
    AI’s plucky promises. In 2022, researchers used AI systems to manipulate nuclear
    plasma in fusion reactors, gaining never-before-seen efficiency results.


    The sheer rate of AI advances and the speed at which organizations adopt them
    makes it seem that AI systems are in everything, everywhere, and all at once.
    What was once a fascination with AI has become a dependency on the speed and convenience
    of automation that it brings.


    But the universal reliance is now bordering on blind trust.


    One of the scientists who worked on using AI to improve fusion told a news outlet,


    > Some of these [plasma] shapes that we are trying are taking us very close to
    the limits of the system, where the plasma might collapse and damage the system,
    and we would not risk that without the confidence of the AI.


    Is such trust warranted?


    # Follow Me, Follow Me


    Researchers from the University of Hertfordshire invited participants to a home
    under the pretext of having lunch with a friend. Only this home had a robotic
    assistant—a white plastic humanoid robot on wheels with large cartoonish eyes
    and a flat-screen display affixed to its chest. Upon entering, the robot displayed
    this text: “Welcome to our house. Unfortunately, my owner has not returned home
    yet. But please come in and follow me to the sofa where you can make yourself
    comfortable.” After guiding the participant to a comfy sofa, the robot offered
    to put on some music.'
