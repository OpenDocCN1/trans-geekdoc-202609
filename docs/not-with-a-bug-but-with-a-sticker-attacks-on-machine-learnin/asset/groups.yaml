    for computer science, the prize committee specifically highlighted Bengio’s contribution
    to generative systems, led by Goodfellow.


    Because Goodfellow made foundational contributions to both GANs and adversarial
    machine learning, GANs are sometimes misconstrued as adversarial machine learning
    to this day when they are really two distinct fields with wispy relations. Since
    Goodfellow straddled these two fields seamlessly and achieved a rock-star status
    in both, his work became increasingly popular.


    Essentially, the authors of the seminal work on adversarial examples became the
    who’s who of AI. And coupled with the barn-burning interest in AI, the authors
