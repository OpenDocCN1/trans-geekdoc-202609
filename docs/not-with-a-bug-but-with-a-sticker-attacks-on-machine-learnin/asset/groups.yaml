    # Security by Obscurity Has Limited Benefit


    A key lesson from this chapter is an oft-repeated tenet of cybersecurity: “security
    by obscurity” ultimately provides little benefit. Adversaries, like nature, will
    always find a way.


    More broadly, keeping AI models locked up like Kentucky Fried Chicken’s secret
    spice may not provide the secrecy or security you think. If there is an inherent
    economic, political, or social value attached to your AI system, then you can
    assume that your AI system will eventually be attacked.


    One of the common refrains we hear when we talk about attacks on AI systems is
    that the “model is for internal use only,” and no one “outside” will be able to
    interact with it. Our own experience in attacking AI systems shows that this assumption
    is faulty—there is no such thing as “internal only.” If you have an AI system
    in your product, you may safely assume it can be compromised regardless of the
    protections you imbue it with. A corollary learning is that adversaries are also
    users of your system.


