    **Figure 2-12**  All it takes to attack a state-of-the-art AI healthcare algorithm
    is to rotate the image. Courtesy of Samuel G. Finlayson


    The core of the problem is that machine learning systems use shortcuts to learn.
    They latch onto backgrounds, clutch to color, turn to texture—and are simply conditioned
    on cues.'
