  - '[PAGE 26]


    headlights. But so do trucks. Maybe, we say, car is something that has four wheels.
    But so do carts and buggies. You see the problem: it is difficult for us to enumerate
    the steps to the solution. This problem goes beyond an image recognition task.
    Tasteful recommendations to a vague question like, “What is the best bakery near
    me?” have a subjective interpretation—best according to whom? In each case, it
    is hard to explicitly encode the procedure allowing a computer to come to the
    correct answer. But you know it when you see it. The computer vision in Facebook’s
    photo tagging, machine translation used in Twitter to translate tweets, and audio
    recognition used by Amazon’s Alexa or Google’s Search are all textbook stories
    of successful AI applications.


    Sometimes, an AI success story represents a true breakthrough. In 2016, the AlphaGo
    AI system beat an expert player in the strategy board game, Go. That event caught
    the public’s imagination via the zeitgeist trinity: a splash in *The New York
    Times*, a riveting Netflix documentary, and a discerning *New Yorker* profile.


    Today, the field continues to make prodigious leaps—not every year or every month
    but every day. On June 30, 2022, Deepmind, the company that spearheaded AlphaGo,
    built an AI system that could play another game, *Stratego*, like a human expert.
    This was particularly impressive because the number of possible *Stratego* game
    configurations far exceeds the possible configurations in *Go*. How much larger?
    Well, 10^175 larger. (For reference, there are only 10^82 atoms in the universe.)
    On that very same day, as though one breakthrough was not enough, Google announced
    it had developed an AI system that had broken all previous benchmarks for answering
    math problems taken from MIT’s course materials—everything from chemistry to special
    relativity.


    The capabilities of AI systems today are immensely impressive. And the rate of
    advancement is astonishing. Have you recently gone off-grid for a week of camping
    or backpacking? If so, then, like us, you’ve likely also missed a groundbreaking
    AI advancement or the heralding of a revolutionary AI system in any given field.
    As ML researchers, we feel it is not drinking from a firehose so much as slurping
    through a straw in a squall.'
