    这里的关键关键词是“如果攻击者选择出手”。幕后操纵者是谁？谁有动机破坏 AI 系统？


    ## AI 的阿喀琉斯之踵


    在国防部长提名听证会上，退役的美国陆军将军劳埃德·奥斯汀称中国为“追赶威胁”，并补充说中国“在未来构成了最重大的威胁，因为中国正在崛起。”


    没有比中国更大的威胁能动摇美国作为 AI 世界领导者的地位。NSCAI 报告对此很明确。这正是 NSCAI 领导层向特朗普总统重申的内容，然后向拜登政府中愿意倾听的每一个人重申：从国防部长劳埃德·奥斯汀将军和副国防部长凯瑟琳·希克斯到国家情报办公室。在每一次交锋中，他们都传达了在中国的
    AI 崛起之前抓住时机紧迫性的连贯而有力的信息。


    一方面，无论美国做什么，中国都紧跟其后。在美国政府 2016 年的网络大挑战之后，中国注意到了并举办了七次类似的竞赛。当美国宣布一个帮助战斗机飞行员的 AI
    系统时，中国在不到一年时间内宣布了类似系统。当我们组织竞赛以帮助防御者获得针对 AI 系统攻击的经验时，中国在线市场公司阿里巴巴更进一步，举办了一整系列挑战。获胜者获得了包括
    T 恤、眼部按摩器、精美的证书以及在阿里巴巴的红地毯式面试流程在内的各种奖励。组织者还将领奖台选手的奖金提高了十倍。对于那些能在同行评审的国际学术期刊上发表其作品的人，还额外授予了
    10,000 元人民币（约 1,500 美元）。


    中国似乎非常清楚如何攻击美国军方使用的 AI 系统。在中国军队使用的一本手册中，美国的 AI 系统被特别指出易受信息操纵和数据投毒的影响。乔治城大学安全与新兴技术中心（CSET）前研究分析师
    Ryan Fedasiuk 指出，中国的传单称 AI 系统中的数据问题是美国陆军使用的 ML 系统的“阿喀琉斯之踵”。描述更直白——称中国军队可以用数据欺骗、操纵和耗尽来切断、操纵甚至压倒美国
    AI 系统的“神经”。这不是理论上的猜测。中国人民解放军军事工程学院已参与 AI 安全挑战，以提升对 ML 系统的攻击能力。


    中国还指出了另一个现实。“阿喀琉斯之踵”也指防御薄弱的目标。中国政府经常使用社交媒体——主要是 Facebook 和 Twitter——通过创建虚假账户并用反叙事淹没这些平台，有时使用完全相同的逐字信息，来助长其威权议程。毫不奇怪，社交媒体巨头开始使用
    AI 来检测这些垃圾账户并将其关闭。《纽约时报》和 ProPublica 报道称，超过 300 个中国支持的机器人账户在 Twitter 上发布了一段视频，攻击时任国务卿迈克·蓬佩奥支持维吾尔人的立场。这就是三个
    Twitter 机器人为视频配文的方式：


    - *Twitter 账号 1:* The videos Pompeo most interested in (%

    - *Twitter 账号 2:* The videos Pompeo most interested in ’) (

    - *Twitter 账号 3:* The videos Pompeo most interested in ^ ¥ _


    你注意到每条推文末尾有什么奇怪的东西吗？那些随机字符被附加上去是为了欺骗 Twitter 的垃圾信息算法，让它认为这些推文是不同的信息，从而逃避 AI 系统。如此简单的技巧甚至会让成熟且资源充足的公司中的
    AI 系统感到困惑。


    中国的 AI 阿喀琉斯之踵框架有一个推论。乔治城大学 CSET 的高级研究员 Andrew Lohn 简洁地指出，攻击 AI 系统的能力“可以为美国国家安全界的箭袋提供另一支宝贵的箭”。这可以阻止威权政权开发或部署
    AI 系统。美国仍未完全将威慑延伸到网络领域。然而，如果行动迅速，它就可以利用对抗性机器学习作为该箭袋中的重要一箭，使威权政权从 AI 系统中获得的任何潜在收益归零。这似乎已经在展开。Lohn
    的一个有趣假设是，俄罗斯在乌克兰战争中没有部署 AI 驱动的武器，因为它了解其 AI 驱动武器的脆弱性以及这些 AI 系统容易受到对抗性操纵的影响。


    国土安全部下属的网络安全和基础设施安全局（CISA）成立于 2018 年，已成为处理网络威胁的事实上的政府机构。CISA 警告说，在可预见的未来，我们必须“提高警惕”以保护我们免受对手的侵害。但
    CISA 和其他政府努力仍处于起步阶段，尚未找到为组织提供具体战术指导以专门保护关键基础设施中使用的 AI 系统的步伐。


    政府机构并不是 ML 系统攻击的唯一脆弱对象。正如我们将看到的那样，公司对 ML 系统攻击并不了解——构建 AI 系统的大多数研究人员和开发人员也是如此。研究
    COVID 诊断中使用的 AI 工具构建工作的科学家在他们的研究结果中指出，“为了快速创建模型，研究人员经常放宽开发安全、可靠和经过验证的算法的标准。”


    中国的这个阿喀琉斯之踵的设定还有另一个原因很准确：多亏了像 Buolamwini 这样的学者，她创立了组织“Drag Vs AI”研讨会的非营利组织、Timnit
    Gebru 和 Deborah Raji，我们越来越意识到 AI 系统如何导致偏见或不公平的决定，对边缘化群体尤其有害。然而，由于保护 AI 系统尚未进入公共话语，攻击
    AI 系统的问题在我们的集体对话中几乎是隐秘的。我们谈过的大多数组织都知道 ML 系统因偏见而失败，但他们不知道这些系统可能因为有主动的对手而失败。因此，当攻击者破坏一个
    AI 系统时，这将是真正令人惊讶的，就像阿喀琉斯因自己不知道的弱点而被击败一样。

    '
