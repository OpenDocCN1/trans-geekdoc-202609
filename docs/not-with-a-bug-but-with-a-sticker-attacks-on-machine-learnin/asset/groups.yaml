    Three things make up a machine learning system: input data, output label, and
    the parameters in the middle. The parameters are something like an AI system''s
    dials and levers, which are tuned in a specific way so that the input is mapped
    to the appropriate output.


    Let''s pretend you want to train a machine learning system that can distinguish
    apples from pears. First, you would collect hundreds or thousands of images of
    apples and pears and then provide labels for each image. You''d arrange these
    data in pairs, so each image has a corresponding label. For example, using (image-label)
    pairs, we might collate pictures of apples and annotate them as "apples" and pictures
    of pears and annotate them as "pears." The machine''s learning task is to fit
    the parameters of a model so that it can reproduce the correct output label for
    each input image. Many modern machine learning systems depend on an algorithm
    called gradient descent to tune the parameters to be just right to achieve the
    objective.


    Before training, the parameters do not define a model representing the data particularly
    well. When presented with a training image of an apple, the parameters might initially
    be wired to report "pear." Because we''ve annotated the image with the correct
