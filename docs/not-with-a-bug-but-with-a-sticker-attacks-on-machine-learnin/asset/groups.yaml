    continued to do as the robot directed—pausing when the robot paused and following
    it as it navigated in circles.


    Despite any limitations in the experiment—the emergency situation was rated as
    only modestly realistic by participants afterwards—the conclusions are still quite
    alarming. Researchers expected participants would need to be convinced to follow
    the robot even if they did not believe the emergency was real. But the opposite
    was true: humans were all too willing to comply with robotic directions. Persuasion
    was unnecessary.


