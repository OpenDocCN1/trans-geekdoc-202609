    # Blame Canada


    In every field, there are simple questions for which there are no straightforward
    answers. Where do eels mate? Who is Homer? Why do bicycles stay upright? How frequently
    do prime numbers appear?


    For AI security researchers, that question is, “Why do adversarial ML examples
    exist?”


    There are myriad answers; we *kind of* know but also *kind of* do not know.


    The first takeaway is that adversarial examples in ML models are more of a “feature”
    than a “bug.” Researchers have demonstrated that ML models quite lazily learn
    concepts that are brittle indicators of the label or concept they learn. This
    behavior is not a corner case existing in only some AI systems applications. Rather,
    adversarial examples are a default property of AI systems. Why? It turns out that
    AI’s building blocks promote the conditions for being easily tricked.


    At the root is the misunderstood idea that an ML system somehow “learns” how to
    complete a task. Goodfellow likened many ML systems to a Potemkin village—faux
    constructions. From a distance, they appear impressive, yet they often do not
    stand up to close inspection. The quality of an ML model’s construction is apparent
    when one presents data to it wholly inconsistent with what it has been trained
    on. For instance, if you had built an ML system to distinguish between apples
    and pears, asking the ML system to identify a tangerine is verboten. If your training
    set for the ML system consisted only of red apples, asking the system to identify,
    say, a green apple is verboten, too! Even with red apples, if your ML system sees
    only frontal views of apples, asking the system to identify a fruit from an overhead
    view will also cause the system to malfunction. Small deviations from the training
    data can cause large deviations in the model behavior. In other words, when one
    wanders beyond the broad streets of perfectly curated data to the alleys where
    the data contains nuance and corner cases, the illusion is dispelled, and the
    makeshift cardboard underpinnings of the Potemkin village are'
