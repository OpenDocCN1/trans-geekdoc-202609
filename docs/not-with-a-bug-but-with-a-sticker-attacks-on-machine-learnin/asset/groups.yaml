  - '[PAGE 51]


    The totality of AI Achilles’ heel framing—especially from what a country that
    the United States considers “the most significant threat going forward”—limns
    NSCAI into context: why it was born out of the Armed Services wing of the U.S.
    House of Representatives; why there was an impending urgency to get the commission’s
    findings out; and why other democratic governments like the UK, Canada, and the
    EU have begun girding their loins and taking proactive measures to safeguard their
    AI systems.


    In its final report submitted to President Trump and the U.S. Congress, the NSCAI
    put forth a strongly worded recommendations. The commission noted with frankness,
    “With rare exceptions, the idea of protecting AI systems has been an afterthought
    in engineering and fielding AI systems”. It recommended that “at a minimum,” seven
    organizations pay attention, including the Department of Homeland Security, Department
    of Defense, FBI, and State Department.


    It was as if the NSCAI was awakening these high-stakes organizations to the plausible
    threat of attack on their AI systems. In an enigmatic voice, fit from the oracles
    of Delphi, the NSCAI report directed critical agencies to “Follow and incorporate
    advances in intentional and unintentional ML failures.”


    How did the NSCAI justify this recommendation? By pointing to the work of Evtimov,
    holding a stickered stop sign at Magnusson Park.'
