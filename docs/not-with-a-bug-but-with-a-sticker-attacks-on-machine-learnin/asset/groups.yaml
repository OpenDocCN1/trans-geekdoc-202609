    2011年2月1日，当时担任微软搜索企业副总裁的 Harry Shum 在工作结束时，传来消息称 Google 指控微软搜索抄袭 Google 的搜索结果。微软的搜索引擎
    Bing outright 抄袭 Google 的搜索结果，Google 团队指控道。并且在“我们有证据”的时刻，Google 还补充说它拥有微软作弊的不可辩驳的证据。


    因这些指控感到羞愧，Shum 下令深入调查此事。需要剥开公关、法律和技术层面的层层漩涡。由于他担任微软搜索引擎领导者的高调职位，Shum 将公司的尴尬视为自己的尴尬。*一场丑闻！*
    因此，在 Shum 向其副手发送的众多邮件中，他还给儿子发了邮件，安慰他自己和 Bing 是正确的。


    接下来发生的事情堪称戏剧性。微软坚决否认该指控。Google 否认了否认。从 *华尔街日报* 到 BBC，故事被刊登在媒体上，甚至出现在深夜电视节目主持人
    Jimmy Fallon 和 Stephen Colbert 的独白中。


    当微软于 2009 年将搜索业务 rebranded 为 Bing 以利用价值十亿美元的广告搜索市场时，它已经落后于时代。Google 以 60% 的市场份额主导市场，雅虎搜索以
    20% 的份额稳居第二。微软名列第三，但其搜索业务开始获得关注并快速增长。


    Google 作为竞争对手，一直在关注 Bing Search。在一次比较分析中，Google 发现有时 Bing 的顶级结果会与其自身镜像。Google
    搜索工程师怀疑 Bing 和 Internet Explorer 的工具栏中发生了某种阴险的事情。因此，在 2010 年 10 月，Google 对微软的
    Bing 发起了前所未有的诱捕行动。


    直到那时，Google 从未故意将搜索词与特定网站关联。搜索列表是算法决定的，Google 采取的是不干预的方法。但当工程师怀疑微软抄袭其搜索结果时，Google
    的领导层决定仅此一次打破其铁律。


    将垃圾邮件作为非垃圾邮件。因为 Gmail 过滤器部分通过用户提供的标签学习垃圾邮件/非垃圾邮件——无论是合法账户还是虚假账户——垃圾邮件发送者都会训练过滤器为他们自己的垃圾邮件活动做好准备。


    第二个收获：投毒攻击赋予对手潜伏的能力。在某些情况下，这对消费者是有益的。记住，我们用对手一词指代任何违反系统底层假设的人。例如，一个相关的技巧可用于帮助用户逃避在线广告机构的监视。由康奈尔科技教授
    Helen Nissenbaum 提出的概念称为混淆，该技巧涉及“故意添加模糊、令人困惑或误导性的信息以干扰监视和数据收集”。


    记得拨打客服热线时听到的录音消息“通话可能被录音以用于质量和培训目的”吗？在冲浪互联网时，每项活动都被记录并用于跟踪你的活动以提供更好的广告。对手可以劫持这一反馈路径进行投毒。这些广告跟踪算法不仅仅是烦恼；它是被许可的监视。


    Mozilla 利用这种跟踪活动帮助客户在互联网中隐藏其活动。本质上，Mozilla 通过污染数据为其客户投毒广告跟踪算法。它构建了一个名为 Track THIS
    的系统，你可以选择在互联网上表现为社交媒体影响者、末日准备者、一个对独家鞋子和街头服饰感兴趣的“hypebeast”，或是一个“filthy rich”的人。例如，当用户以“filthy
    rich”人设冲浪时，该工具会在你的网络浏览器中打开 100 个标签，迎合富人：像 YSL（奢侈服装）、Lancome（奢侈化妆品）、Rolex（奢侈手表）、Hakkasan（高端餐厅）和
    Piaget（奢侈汽车）这样的网站。就是这样，你的广告瞬间被定制为真正的高 roller 生活——在广告跟踪器适应你中产阶级互联网冲浪行为之前的一段时间内，你可以享受为超级富豪准备的广告！


    通过投毒进行的混淆已被在其他地方重复使用。想骗 Facebook 的算法认为你情绪平衡吗？每当你“点赞”一篇帖子时，网页浏览器扩展 GoRando 会随机选择帖子的情绪。担心隐私问题，当应用程序要求访问你手机通讯录中的联系人时？一个名为
    Fake Contacts 2 的工具会 literally 在你的手机中创建数百个带假号码和假姓名的假联系人。类似地，为了逃避 Instagram 的窥探，一群青少年曾使用共享账户生成群体行为，从而隐藏特定个人的行为。但混淆的效果不会持续很久。就像魔药
    Felix Felicis 的效果是暂时的，混淆的效果也是暂时的，因为现代机器学习系统会不断学习并从不同地方聚合信号。


    这里的第三个教训是，投毒机器学习系统并不需要太多，无论是人数还是数据点。暂时投毒广告跟踪系统只需要一个人——你。仅有 20 人点击链接不到 2 周，Bing
    就纳入了“诱饵”结果。将此与乌克兰对抗俄罗斯的 40 万名网络军志愿者相比，他们的人数是其物理军队人数的 2:1。乌克兰信息保护服务副主管 Victor Zhora
    表示，网络军正在“尽一切可能保护我们在网络空间的土地、我们的网络，并让侵略者（俄罗斯）因其行为感到不舒服。”或者考虑由《纽约时报》的 Nicole Perlroth
    报道的由 5 万人组成的中国网络军，构成“在中国的国家安全部的指示下在前沿公司和大学工作的精英卫星承包商网络”。任何网络军都可以轻松发起投毒人工智能系统的活动，这可能意味着其灭亡。


    投毒人工智能系统所需的数据量也很低。研究人员发现，通过污染仅占数据集大小 0.1% 的示例，就能操纵在被投毒数据集上训练的机器学习模型。整个系统表现出类似的易受攻击性。来自大约
    20 名 Google 工程师的那些“诱饵”词的强烈信号足以混淆整个 Bing 系统。Genius 只需破坏 100 首歌词就能抓住 Google 对其数据的依赖。


    这种低人力投入和低样本数量的结合特别适合“诱捕”行动。2010 年，俄罗斯杀毒软件公司卡巴斯基公开抱怨竞争对手复制了他们在众包杀毒网站 VirusTotal
    上发布的成果。为了说明这一点，卡巴斯基工程师上传了 20 个良性文件但将其标记为恶意。在不到 2 周的时间里，这些文件至少被同一网站上的另外 14 家安全公司标记为恶意。众包网站是投毒的脆弱向量，几乎不需要努力，只需几个示例。


    今天，对抗机器学习研究人员已将投毒所需的样本数量推向极致：仅用一个数据点就破坏整个人工智能系统。斯坦福研究人员的一项惊人实验表明，即使在训练期间的单个数据点也可能对整个机器学习系统产生不利影响。在狗与鱼图像分类器中，在训练数据集中投毒一张狗图像并将其标记为鱼，最终导致分类器将其他狗图像误判为鱼（见图
    4-2）。


    ![](img/603389cda98d5077376d0de2ba6c5f76_126_0.png)


    图 4.2 投毒单个训练示例导致测试期间出现多次失败。Pang Wei Koh 和 Percy Liang。“通过影响函数理解黑盒预测。”国际机器学习会议，2017
    年


    有趣的是，这项研究的作者使用对抗示例破坏了狗的训练图像。事实证明，这两种攻击之间存在密切联系。

