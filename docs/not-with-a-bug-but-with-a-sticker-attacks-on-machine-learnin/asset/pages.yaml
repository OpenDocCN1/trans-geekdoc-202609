- pgno: 45
  md: 'Trolls from Reddit and 4Chan descended on Twitter, intending to corrupt Tay.
    Why? For fun, of course! They quickly discovered that Tay was latching onto the
    input data and was using it to improve itself. So, the trolls flooded Tay with
    racist tweets. Tay picked up on this and was automatically retrained to mirror
    the Internet trolls. Things got so bad Microsoft decommissioned Tay within 16
    hours of launching it.


    Microsoft had a plan when the AI system faced individual corrupted conversations
    but was blindsided by this coordinated attack. This would make the group of Internet
    strangers the adversary. This kind of coordinated attack to corrupt the AI system’s
    input data is called a *poisoning attack*. Just like how you can poison a village
    by poisoning its water source, poisoning attacks corrupt the AI system from functioning
    by poisoning the input data.


    Then in 2022, Meta, Facebook’s parent company, released an experimental chatbot
    called BlenderBot 3. According to the company’s blog, BlenderBot 3 was “capable
    of searching the Internet to chat about virtually any topic. . .through natural
    conversations and feedback from people.” Before too long, users found that the
    bot began parroting election conspiracies that Trump was still president “and
    will always be” after losing the election. It became overtly antisemitic, saying
    that a Jewish cabal controlling the economy was “not implausible” and that they
    were “over-represented among America’s super-rich.”


    Validation of the NSCAI’s warning—that attacks are happening and impacting commercial
    ML systems—requires at least two things: that the odds of these intentional failures
    are high and that motivated adversaries are willing (according to their cost-benefit
    calculus) to exploit them. Both of these conditions are true.


    # Never Tell Me the Odds


    When the NSCAI report dropped, Jane Pinelis was vindicated.


    Pinelis had been leading the DoD’s division responsible for testing AI systems
    for failures and knew intimately how brittle these systems were. She had been
    trying to convince the Pentagon to take up the issue of defending AI systems more
    seriously.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'So, when a bipartisan group of experts sounded the alarm about the dire straits
    of AI and its implications for national security, the issue gained center attention.
    But more importantly, the NSCAI report convinced Congress to allocate money so
    that experts like Pinelis were better resourced to tackle this area. In 2021,
    Congress authorized $740.5 million for a vast number of national defense spending
    programs to modernize the U.S. military. One key element of that initiative focused
    on trustworthy AI. Today, Pinelis is the chief of AI Assurance at the U.S. Department
    of Defense, where her work revolves around justified confidence in AI systems
    that work as intended, even in the presence of an adversary.


    Pinelis prefers *justified confidence* instead of *trustworthiness* because trust
    is difficult to measure. Confidence, on the other hand, is a more mathematically
    tractable concept. Sports forecasters can provide the odds of a football team
    winning the Superbowl. A meteorologist can tell you the odds of it raining tomorrow.


    So, what are the chances of an attacker succeeding in an attack on an ML system?


    For this, we turned to David Evans, who is a professor at the University of Virginia
    specializing in computer security. Evans has an uncanny ability to find computer
    vulnerabilities and a storied expertise in this area. He never considered the
    possibility of hacking AI systems until one of his graduate students began experiments
    that systematically evaded them. When he started looking into attacking AI systems,
    what struck him was the lax security of current AI systems.


    When you use encrypted forms of communication—say, when you send a Facebook message
    in Messenger or use modern-day online banking—it is built upon methods designed
    to provide strong encryption. These encryption schemes would be considered totally
    broken if there were any way to guess the secret key more efficiently than by
    just trying every possible combination of keys. How hard is that? you ask. The
    odds of compromising modern-day encryption by brute force is 1 in 10 followed
    by 39 zeros. In other words, the odds of an attacker breaking a modern encryption
    scheme just by guessing is just as likely as every air molecule in your bedroom
    moving to a corner, leaving you to suffocate. If a more efficient method were
    discovered, the encryption scheme'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'would be considered broken and unusable for any system. These are very high-security
    expectations, indeed!


    When designing an operating system that powers everything from your laptop to
    your phone, Evans pointed out that for security protection to be considered acceptable,
    the odds of an attack succeeding against it should be less than 1 in 400 million.
    That’s five times rarer than the chances of you being canonized as a saint.


    In both scenarios, confidence in the security of these systems comes from a combination
    of analyses by experts, careful testing, and the underlying fundamentals of mathematics.
    While it may seem that everything in IT is insecure, in reality, modern computers
    are more secure than ever. Believe it or not, this is the golden age of computer
    security.


    But we are currently in the Stone Age when it comes to the security of ML models.
    In other words, it is comically trivial to attack AI systems—they are so bad that
    they routinely fail without an attacker even trying to break them! (See Table
    1-2.) We already saw how Internet trolls could do it.


    **Table 1.2**  Odds of Breaking ML Systems


    |  | Odds of succeeding at breaking the system |

    |---|---|

    | Modern-day cryptography | 1 in 1,000,000,000,000,000,000,000,000,000,000,000,000
    (1 in a duodecillion) |

    | System security | 1 in 400,000,000 (1 in 400 million) |

    | Modern machine learning | 1 in 2 |


    Modern ML systems are so fragile that even systems built using today’s state-of-the-art
    techniques to make them robust can *still* be broken by an adversary with little
    effort, succeeding in roughly half of all attempted attacks. Is our tolerance
    for AI robustness really 200 million times less than the tolerance for operating
    system robustness? Indeed, today’s machine learning systems are not built with
    the same security reliability as your operating system or encrypted WhatsApp or
    Facebook messages. Should an attacker choose, most AI systems are sitting ducks.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'The operating keywords here are “should an attacker choose.” Who is the wizard
    behind the screen? Who is motivated to bring down AI systems?


    # AI’s Achilles’ Heel


    In his confirmation hearings for Secretary of Defense, retired U.S. Army General
    Lloyd Austin called China a “pacing threat,” adding that China “presents the most
    significant threat going forward because China is ascending.”


    There is no greater threat to the United States’ status as the world’s leader
    in AI than China. The NSCAI report is clear on that. That is what the NSCAI leadership
    reiterated to President Trump, then to everyone in the Biden administration who
    would listen: from Secretary of Defense General Lloyd Austin, and Deputy Secretary
    of Defense Kathleen Hicks to the Office of National Intelligence. At every turn,
    they delivered a consistent and cogent message on the urgency of seizing the moment
    before China’s AI ascension.


    For one thing, whatever the United States does, China is close at its heels. After
    the 2016 Cyber Grand Challenge by the U.S. government, China paid attention and
    held seven such competitions. When the United States announced an AI system to
    help fighter pilots, China announced a similar system in less than a year. When
    we organized a competition to help defenders get experience with attacks against
    AI systems, Chinese online marketplace company Alibaba took it to the next level,
    holding an entire series of challenges. Winners were awarded everything including
    T-shirts, eye massagers, handsome certificates, and a red-carpet interview process
    at Alibaba. Organizers also increased the prize purse over ours by 10 times for
    podium finishers. For those who could publish their work in a peer-reviewed, international
    academic journal, an additional 10,000 Chinese Yuan RMB (about $1,500 USD) was
    conferred.


    China seems to be acutely aware of how to attack the AI systems used by the U.S.
    military. In a handbook used by the Chinese army, the United States’ AI systems
    were specifically called out as'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'susceptible to information manipulation and data poisoning. Ryan Fedasiuk,
    former research analyst at Georgetown University’s Center for Security and Emerging
    Technology (CSET), noted that the Chinese handout called the issue of data in
    AI systems “the Achilles’ heel” of the ML systems used by the U.S. Army. It gets
    more graphic—saying that the Chinese army can cut off, manipulate, or even overwhelm
    the “nerves” of U.S. AI systems with data deception, manipulation, and exhaustion.
    This is not a theoretical hunch. The Army Engineering University of the Chinese
    People’s Liberation Army has participated in the AI Security challenge to upskill
    attacks on ML systems.


    China is also pointing out another reality. “Achilles’ heel” also refers to a
    poorly fortified target. The Chinese government routinely uses social media—namely,
    Facebook and Twitter—to bolster its authoritarian agenda by creating fake accounts
    and flooding these platforms with counter-narratives, sometimes with the same
    verbatim message. Unsurprisingly, social media giants have started to use AI to
    detect these spam accounts and shut them down. The New York Times and ProPublica
    reported that more than 300 Chinese-backed bot accounts posted a video attacking
    then Secretary of State Mike Pompeo’s stance supporting the Uyghurs on Twitter.
    This is how three Twitter bots captioned the videos:


    +   - *Twitter account 1:* The videos Pompeo most interested in (%

    +   - *Twitter account 2:* The videos Pompeo most interested in ’) (

    +   - *Twitter account 3:* The videos Pompeo most interested in ^ ¥ _


    Do you notice something weird at the end of each tweet? Those random characters
    were appended to fool Twitter’s spam algorithm into thinking these tweets were
    distinct messages, thereby evading the AI system. Such simple tricks even confuse
    AI systems at mature and well-provisioned companies.


    There is a corollary to China’s framing of an AI Achilles’ heel. Andrew Lohn,
    senior fellow at Georgetown University’s CSET, put it succinctly when he pointed
    out how the ability to hack AI systems “could provide another valuable arrow in
    the U.S. national security'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'community’s quiver.” This could deter authoritarian regimes from developing
    or deploying AI systems. The United States has still not fully extended deterrence
    into the cyber domain. However, if it moves quickly, it can use adversarial machine
    learning as an important arrow in that quiver to render any potential gain from
    AI systems from authoritarian regimes null. This seems to be unfolding already.
    One interesting hypothesis from Lohn is that the Russia has not fielded AI-powered
    weapons in the war in Ukraine because it understood the fragility of its AI-powered
    weapons and how these AI systems are prone to adversarial manipulation.


    The Cybersecurity and Infrastructure Security Agency (CISA) within the Department
    of Homeland Security was founded in 2018, and has become the de facto governmental
    organization handling cyber threats. CISA has warned that we must have our “shield’s
    up” for the foreseeable future to protect us from adversaries. But CISA and other
    government efforts are still in their infancy and have yet to find their stride
    for providing tactical guidance for organizations to specifically secure AI systems
    used in critical infrastructures.


    Government agencies are not the only ones vulnerable to attacks on ML systems.
    As we will see, companies are unaware of ML systems attacks—as are most searchers
    and developers building AI systems. Scientists who studied efforts to build AI
    tools used in COVID diagnosis noted in their findings that, “To create models
    quickly, researchers frequently have relaxed standards for developing safe, reliable,
    and validated algorithms.”


    The Chinese setup of this Achilles’ heel is spot on for another reason: thanks
    to scholars like Buolamwini who found the non-profit that organized “Drag Vs AI”
    workshop, Timnit Gebru, and Deborah Raji, we are increasingly aware of how AI
    systems can lead to biased or unfair decisions that are especially harmful to
    marginalized populations. However, because securing AI systems has yet to enter
    public discourse, the issue of attacking AI systems is virtually sub rosa in our
    collective conversations. Most organizations we have spoken to know how ML systems
    fail because of bias, but they are unaware that these systems might fail because
    of an active adversary. So, when an attacker compromises an AI system, it will
    be truly surprising, just as Achilles was culled because of a vulnerability unknown
    to him.'
