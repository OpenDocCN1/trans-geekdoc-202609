  md: 'examples for close to six years, illuminating the world how they are subtle,
    specific, and ever-present.


    # They Are Everywhere


    The mischiefs we saw in Chapter 2—rotating an image or changing its color—can
    already inflict pain on state-of-the-art ML systems. But if we liken the hijinks
    in the previous chapter to a machete, adversarial examples are scalpels.


    The first thing to note is that adversarial examples are subtle. In the previous
    chapter, we saw how salt, stickers, or electric tape could dupe machine learning
    systems. That mischief is somewhat obvious if a human were to investigate why
    the system erred. Adversarial examples, on the other hand, have the potential
    to fool both humans and the machine learning system. Humans reviewing only the
    system’s input see no aberration, so they are unlikely to detect tampering. Human
    oversight in critical situations—like determining if you are eligible for a loan,
    medical imaging, or autonomous defense—is extraordinarily important. But if only
    inspecting the input, adversarial examples are subtle enough to evade human oversight.


    Another reason adversarial examples are potent is that discovering them is done
    in a specific manner that can be automated. No human is manually looking for which
    pixel in the panda photo must be altered to fool the image recognition system
    into misrecognizing it as a gibbon. The search to confuse AI systems is guided
    by the very tools used to train ML models themselves. In fact, if you try to alter
    pixels randomly, the AI system is not likely to be confused. For adversarial examples
    to be effective, the process needs to be smart, methodical, and algorithmic—all
    of which can be automated.


    This algorithmically guided and automated search can yield results that convincingly
    fool AI systems. Adversarial AI clothing is a peculiar adversarial example. Designed
    to evade facial recognition systems, adversarial examples can be printed onto
    everyday clothing: T-shirts become adversarial T-shirts, and glasses become'
