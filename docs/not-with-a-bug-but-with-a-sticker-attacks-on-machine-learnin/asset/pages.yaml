- pgno: 106
  md: 'The changes from these manipulations can have far-reaching consequences. When
    speaking at the Air Force Association’s 2021 Air, Space & Cyber Conference about
    the points in the machine learning life cycle that could be affected by an adversary,
    Lt. General Mary O’Brien, Deputy Chief of Staff for Intelligence, Surveillance,
    Reconnaissance and Cyber Effects, said, “If our adversary injects uncertainty
    into any part of that process, we’re kind of dead in the water on what we wanted
    the AI to do for us.”


    That’s the key problem with adversarial examples. Is that a picture of a panda
    or a gibbon? It can inject uncertainty and shake our trust in AI systems. If weaponized,
    it can be a decisive advantage to thwart our adversary’s AI system.


    But adversarial examples are far from the only way to corrupt AI systems. There
    is an even more accessible and impactful way.'
