- pgno: 109
  md: 'In a Twitter comment, one poster noted Frank’s recent video on TikTok, which
    had now gone viral. “This may be far-fetched, but given the timing, the virality
    of the video, and the user’s follower demographics...” Notably, Frank’s TikTok
    video included the hashtag #prolific.


    Prolific is a marketplace for scientists to recruit survey participants. Used
    by researchers anywhere from Oxford to Stanford, Prolific helps scholars collect
    high-quality responses from its pool of more than 150,000 participants worldwide.
    In return for the responders’ time, Prolific compensates them to the tune of $6.50
    per hour.


    Frank’s TikTok video for side-hustle hot tips included the suggestion to enroll
    in Prolific and fill out surveys for extra income. With more than 4 million views
    flooding in, the video went viral for a very specific demographic. Throngs of
    teenage and young adult girls, Frank’s target audience, rushed to Prolific to
    fill out surveys, resulting in 30,000 new signups on the platform in a matter
    of days. It became so popular that many flocked to the platform from word-of-mouth
    referrals—Google search activity on July 24, 2021, showed a positive uptick for
    the term prolific surveys.


    The surge in signups, primarily from teens and 20-something females, skewed the
    expected demographics of the carefully designed research surveys. If the researchers
    were not careful about who they expected to answer their survey, their study would
    have been tainted by the sudden surge of women—an unintended capture bias. Prolific’s
    co-founder and CTO, Phelim Bradley, told Verge that the viral TikTok video disrupted
    4,600 studies. Prolific later refunded studies significantly affected by the video
    and put tools in place to handle these kinds of surges.


    Just as a teenager with a 56-second video can disrupt thousands of scientific
    studies by corrupting the data used in its research, a motivated adversary can
    disrupt state-of-the-art AI systems by corrupting the data used to train its models.
    Further, since most of the data behind these AI systems is freely available from
    the Internet, what are the security implications of using open data for critical
    AI systems?'
