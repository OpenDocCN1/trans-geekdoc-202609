  md: '# Tis a Sign, Me Muteys


    If you are in the United States or Canada, put down this book and look at the
    underside of your toaster, the side of your microwave, or any electrical appliance
    in your kitchen. You will find a UL sticker—which stands for Underwriters Laboratories,
    an independent third party that’s been around for more than a century—attesting
    that your kitchen appliance does not spontaneously combust.


    Now, if you are in Europe, the markings on your kitchen items may be a little
    different. Instead of a UL, you may need to look for CE (which stands for “conformité
    européenne,” French for “European conformity”). Here, the manufacturer attests
    that the appliance conforms to a set of rules. Failure to meet these standards
    means the appliance cannot be traded in the European Union (EU). It does not matter
    where the appliance was manufactured; if it lacks the CE seal, it is a no-go to
    be imported into the EU.


    There is a key difference between UL-style seals and CE-style markings. The CE
    certification is granted when the product’s *manufacturer* conforms to all the
    relevant performance and safety standards. However, the UL label is affixed by
    sending the product to a third-party tester, which verifies if the product conforms
    to the standards set by UL Solutions.


    Standards and certifications like UL or CE work because they foster comprehensive
    testing. From dropping your toaster multiple times to hitting it with a ball to
    determining the degree of burned breakfast food with the help of a color chart
    broken down by waffle or toast, the standards are exhaustive, if not exacting.


    This concept of a “seal” has been replicated in traditional cybersecurity. For
    instance, by doing a simple Google search, you can look up the different security
    standards that your favorite cloud provider adheres to. You can visit the manufacturer’s
    page if you want to know the security checks your router has passed. Do you want
    to know how your bank’s mobile app keeps your data safe? You can look that up,
    too. If an organization is adhering to a cybersecurity standard, it will most
    likely gloat about it.'
