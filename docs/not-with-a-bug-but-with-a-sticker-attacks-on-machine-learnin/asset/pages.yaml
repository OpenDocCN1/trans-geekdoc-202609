  md: 'The messaging board members instantly upvoted the post. News that someone had
    reverse-engineered and shared the recipe for anyone else to do the same, soon
    began to spread to other messaging boards focused on computer forensics to cybersecurity
    to conspiracy. The cat was out of the bag.


    We are using “they” to refer to AsuharietYgvar because we don’t know much about
    the person—who they are, where they are from, or even if AsuharietYgvar is their
    real name. AsuharietYgvar did tell the *Register* publication that they are just
    “an average concerned citizen.”


    Until now, we only had Apple’s word that NeuralHash was robust, but because the
    entire system was kept a secret from the public, we had no way to verify Apple’s
    claims. But, when AsuharietYgvar reverse engineered the NeuralHash model and released
    it to the public to test, suddenly it democratized the testing. You didn’t have
    to be a world-renowned cryptographer or be part of Apple’s chosen clique. Anyone
    could now poke holes into NeuralHash and evaluate Apple’s claims.


    And poke they did. AsuharietYgvar showed that NeuralHash could be fooled by simply
    cropping an image and rotating it. Practically speaking, this means a malicious
    person could crop a child pornography image, and NeuralHash would not be able
    to match it with the image in the CSAM database. We already saw this in Chapter
    2—how simple acts of cropping or rotating an image messed with AI systems used
    to detect skin cancer; the same also seemed to apply to Apple’s NeuralHash system.


    Next, Cory Cornelius, a researcher from Intel Labs, dealt another blow. Within
    a day of AsuharietYgvar releasing the steps to reverse engineer the model, Cornelius
    showed that a picture of a dog and that of a static gray background had identical
    NeuralHash fingerprints. This further questioned Apple’s claim of NeuralHash’s
    efficacy.


    Apple tried to minimize the damages, saying that the reverse-engineered NeuralHash
    algorithm was a generic ML model and not the final one. Apple also pointed out
    that the human review process can attempt to catch these sorts of failures in
    NeuralHash. But it was too late. Seeing NeuralHash’s veracity coming into question,'
