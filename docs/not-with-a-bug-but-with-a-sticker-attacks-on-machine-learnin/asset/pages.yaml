  md: 'and reproducibility. This is not surprising. An influential academic paper
    in 2007 strongly advocated for this approach in its title, “The Need for Open
    Source Software in Machine Learning.” The authors of this influential paper went
    on to lead academic research groups at Facebook, Google, Apple, and Amazon and
