- pgno: 206
  md: '| Question to Ask | What to Look For |

    |---|---|

    | Let''s assume the system has been compromised. How will you know if an attack
    on the ML system has occurred? | ✓ The organization has an owner for AI security.

    ✓ The team has instrumented its software and data ingestion pipelines, training
    pipelines, deployment pipelines, and inference systems with logging and/or attack
    detection capabilities. |

    | What is our response plan when the ML system is attacked? | ✓ The team has a
    viable fallback plan when the ML system is compromised that might include human
    override controls. |'
