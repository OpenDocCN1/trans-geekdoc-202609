- pgno: 22
  md: 'website (www.ram-shankar.com/notwithabug). We assert where the science is conclusive;
    where there is no consensus, we highlight that as well. Hyrum and I actively sought
    out experts in the field—speaking to hundreds of AI researchers, security professionals,
    policymakers, and business leaders. Everything you see within quotes in the book
    comes from a direct source.


    This book is more than just the science of attacking AI systems. Focusing on that
    alone, would only answer the question, “What is adversarial machine learning”?
    To give you a holistic picture, the book aims to look beyond that. We also want
    to provide you with the *so what?* So, *what does attacking AI systems mean for
    national security?* So, *what does it mean for business makers?* *For policymakers?*
    *For you?* And aims to provide sketches of where to go from here, with the *now
    what?*


    To get there, this book had to go on a hiatus of sorts, thanks to a real incident
    at Harvard Law School. Let me explain.


    I have a hunch that everyone in Berkman Klein Center, the storied interdisciplinary
    research center at Harvard University, is in one of two modes: they are either
    writing their first book or writing their next one. So, when I spent a sabbatical
    from my work as a Data Cowboy at Microsoft at Berkman to work on adversarial machine
    learning, I started working on an earlier version of this book, outlining the
    science of attacking AI systems.


    It was at Berkman’s happy hour in Cambridge Queen’s Head that I had a chance to
    meet tech legal scholar superstar Kendra Albert. A few days later, I made my way
    to Kendra’s office at the Cyberlaw Clinic at Harvard Law School, where, among
    other things, Kendra provides legal guidance to hackers who do security research
    for good. Kendra, with their characteristic pen in hand, listened to my spiel
    about attacking AI systems with the attention of a hawk but with the playfulness
    of a sea lion. Hawk–Sea lion Kendra, I distinctly remember thinking. Toward the
    end of that conversation, Kendra asked, “So, what about the civil liberty implications
    of attacking AI systems?”


    I was gobsmacked. Until that point, I—and so far as I can tell, no other AI researcher—did
    not consider the policy, legal, or ethical'
  merge: -1
  img_proc: true
