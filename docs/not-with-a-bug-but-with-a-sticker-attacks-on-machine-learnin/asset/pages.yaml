- pgno: 29
  md: 'What followed was near-universal behavior.


    First, every participant—even those who had seen the robot make blatant navigation
    mistakes when directing humans to the conference room—waited for the robot to
    lead them to safety. Even *knowing* that the robot was not functioning properly
    before the staged emergency did not dissuade participants from following its instructions.
    After its blatant navigation mistakes, one of the experiment’s facilitators explicitly
    told the participant, “I think the robot is broken again . . . sorry about that.”
    Yet, later, when the sirens blared, the participant who was briefed that the robot
    was broken, continued to follow the broken robot.


    Second, when the robot navigated the participant out of the emergency, sometimes
    it would lead them away from clearly marked exit signs into dark rooms only to
    trace back again or simply around in circles. Again, this behavior did not trigger
    human instincts to bolt to the well-lit exit sign. Indeed, 95 percent of the participants
    continued to do as the robot directed—pausing when the robot paused and following
    it as it navigated in circles.


    Despite any limitations in the experiment—the emergency situation was rated as
    only modestly realistic by participants afterwards—the conclusions are still quite
    alarming. Researchers expected participants would need to be convinced to follow
    the robot even if they did not believe the emergency was real. But the opposite
    was true: humans were all too willing to comply with robotic directions. Persuasion
    was unnecessary.


    Why is human intelligence so easily convinced by artificial intelligence? One
    does not typically go about throwing others’ mail in the garbage or pouring Tropicana
    in our windowsill plants. And during a fire, we have been conditioned to bolt
    for the exit signs. So, why does the presence of an “intelligent” system change
    our behavior so drastically?


    # In AI, We Overtrust


    If there was a time for AI systems to shine, it was during the pandemic. Researchers
    quickly turned to AI to sift through the mountains of data being generated by
    doctors and used state-of-the-art'
  merge: -1
  img_proc: true
