- pgno: 104
  md: 'It is interesting to note how the tools to launch these adversarial attacks
    are not locked away in a secret vault. They are available for anyone to use. That
    is a good thing because defenders know what to look for if an adversary leverages
    these tools. From IBM’s Adversarial Robustness Toolkit to Microsoft’s Counterfit
    to Baidu’s PaddlePaddle, tools to evade machine learning systems are commonplace.
    No PhD or math background is required to use these tools; just a basic understanding
    of computers will do. There’s a learning curve, but it’s certainly not nearly
    as difficult as crafting your own attacks from scratch.


    Black-box attacks on machine learning systems are becoming increasingly easier
    to mount. You can make a knock-off model that functions like the original most
    of the time for less than the cost of a large pizza.


    This unique combination of high impact—subtle, specific, and ever-present—and
    low barriers to entry, both in terms of cost and skillset, can be concerning.
    But not for you, the reader.


    The good news is that the kind of adversary employing adversarial examples is
    unlikely to target the general population. Why would an adversary go through the
    trouble of mastering machine learning, understanding the ropes of adversarial
    machine learning, generating stickers, and then placing them on stop signs in
    the hope of causing a car to fail? Instead, can an attacker just rent a billboard
    and flash a yield sign?


    In reality, your AI-powered car is more likely to fail without any adversary intervention:
    inclement weather, a flock of seagulls, or even a truck parked on the side of
    the road. There were 273 reported Tesla crashes involving its AI-powered Autopilot
    system in 2021. While we do not know the exact causes of these crashes, we can
    take an educated guess that none of these were caused by adversarial stickers
    on a stop sign.


    In the same vein, one need not worry about a smart speaker, Siri, or Alexa being
    duped by audio adversarial examples. These attacks are quite finicky and hard
    to pull off in the real world because of background noise. There are benign ways
    to fool your smart speaker. For instance, saying “Cocaine noodles” triggered Google
    Home speakers because it sounded like “Okay, Google.”'
