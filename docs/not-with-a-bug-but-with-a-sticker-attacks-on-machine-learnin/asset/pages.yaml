  md: 'McDaniel, Papernot’s PhD advisor, gave Papernot space to find his way. In March
    2015, McDaniel had just returned from a visit to Google to get an idea of how
    the industry is moving with regard to AI. By 2015, Google had started investing
    heavily in deep learning to capitalize on the AI trend, with acquisitions such
    as DeepMind—the company that built AlphaGo. McDaniel, who has a knack for chasing
    down good ideas before they become the next big thing, wanted to get ahead of
    the curve and see how researchers can shape the AI trend.


    It was a Friday afternoon, and McDaniel had to walk over to the other side of
    the campus for an errand and asked Papernot to join him to discuss this new deep
    learning trend that Google was investing so much in. McDaniel was a security heavyweight,
    but his forte was in “traditional” computer security like protecting networks
    from intrusions. So, he asked Papernot if he could learn the ropes of deep learning
    and come back to his office on Monday to discuss their security.


    Papernot did what anyone does when their boss gives them two days to learn something
    totally new. He turned to YouTube lectures and devoured all the lectures by Geoffrey
    Hinton, one of the winners of the 2012 ImageNet challenge. (Papernot would later
    become Hinton’s colleague at the University of Toronto.)


    But the more Papernot learned about deep learning, the more he discovered it was
    just his prep school math repackaged. He didn’t just learn the basics; he also
    found ways to break the system. When he met McDaniel on Monday, McDaniel was astounded
    how someone could go from not knowing about deep learning to breaking it, in two
    days. He asked Papernot to drop everything and pursue how to attack AI systems.


    When an attacker knows the internal workings of the machine learning system, attack
    algorithms based on gradient descent provide a straightforward recipe to generate
    adversarial examples. An attack that requires full knowledge of an ML system is
    called a *white-box* or full-knowledge attack. Because companies held back releasing
    the details of their ML models, attackers have increasingly had to work under
    a *black-box* or zero-knowledge setting when little'
