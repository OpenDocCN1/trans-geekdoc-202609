  md: '![](img/603389cda98d5077376d0de2ba6c5f76_75_0.png)


    **Figure 2-9** Changing the hue and saturation of the image also changes how AI
    algorithms perceive it. (Best viewed in color.) Courtesy of Hossein Hosseini


    *The Mitchells vs. the Machines* trick for confusing AI systems with a pug in
    front of the car is explained in a paper entitled, “The Elephant in the Room.”
    Researchers from York University and the University of Toronto found that state-of-the-art
    AI systems failed in computer vision tasks when something unexpected appeared
    in an image. For instance, putting a polar bear on a sunny backyard patio confused
    the AI system into misrecognizing it as a car. When you place seemingly out-of-place
    objects—like a pug in front of the car—AI systems are more likely to misidentify
    them. See Figure 2-10.


    ![](img/603389cda98d5077376d0de2ba6c5f76_75_1.png)


    **Figure 2-10** The boxes show how the AI algorithm recognizes the objects. When
    a random polar bear is added to the picture, the AI system is confused—and a car
    is erroneously detected. Courtesy of Amir Rosenfeld


    Even simply cropping or rotating images can confuse AI systems. MIT researchers
    found that rotated images can completely change the judgment made by an AI system.
    For instance, simply rotating the picture of a bird now makes the AI system recognize
    it incorrectly as an orangutan (see Figure 2-11).'
  merge: -1
