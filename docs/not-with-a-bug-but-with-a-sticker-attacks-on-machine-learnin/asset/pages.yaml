- pgno: 88
  md: 'Goodfellow achieved more rarefied status. He independently discovered a fundamental
    technique called *generative adversarial networks* (GANs) after a night of celebration
    drinking at Les Trois Brasseurs pub in Montreal. (The pub was acknowledged in
    the paper for “stimulating creativity.”) His work on GANs was so consequential
    that it led to a stream of accolades—*Fortune’s* “40 Under-40” and MIT’s “Innovators
    Under 35.” When his advisor, Bengio, won the Turing Award, the Nobel prize equivalent
    for computer science, the prize committee specifically highlighted Bengio’s contribution
    to generative systems, led by Goodfellow.


    Because Goodfellow made foundational contributions to both GANs and adversarial
    machine learning, GANs are sometimes misconstrued as adversarial machine learning
    to this day when they are really two distinct fields with wispy relations. Since
    Goodfellow straddled these two fields seamlessly and achieved a rock-star status
    in both, his work became increasingly popular.


    Essentially, the authors of the seminal work on adversarial examples became the
    who’s who of AI. And coupled with the barn-burning interest in AI, the authors
    from the ML schism got more attention than those from the security side.


    But this was not a case of warring factions fighting over who did it first, like
    Newton versus Leibnitz. Biggio told us it took only a simple email correspondence
    with Goodfellow to show their prior work. And *voilà*, things were fixed. No fuss.
    No mess. No drama. In fact, Biggio is thankful that Szegedy’s paper has garnered
    more attention. It means more people are paying attention to the field of adversarial
    machine learning, and more people are researching how to secure it.


    Today, Biggio is equally feted in the AI space. His work on adversarial machine
    learning was awarded the “Test of Time Award,” the highest honor at the International
    Conference on Machine Learning in 2022, for shaping the field over the last decade.


    Adversarial examples, ushered in by Biggio, Szegedy, and Goodfellow, represent
    one of the most well-probed areas in adversarial machine learning.'
