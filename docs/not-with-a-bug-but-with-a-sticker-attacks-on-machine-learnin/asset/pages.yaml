  md: '# Intriguing Properties of Neural Networks


    A research work entitled “Intriguing Properties of Neural Networks” had all the
    trappings of a landmark paper when it was posted in 2014 at a famous machine learning
    conference called ICLR (often pronounced “eye-clear”). The primary author, Cristian
    Szegedy, was affiliated with Google, had already established himself as a deep
    learning juggernaut, and would go on to help Google win the ImageNet competition.
    A coauthor, Ilya Sutskever, was part of the original winning team that had already
    won the ImageNet competition and sparked the deep learning revolution. Between
    its alluring title and the cachet of its (quite literally) award-winning authors,
    one thing was certain: people would be paying attention to this paper.


    A hitherto unknown graduate student, Ian Goodfellow, was among the list of luminary
    authors. When Goodfellow received an offer to intern at Google, he was elated.
    He was a graduate student at one of the most celebrated and well-resourced labs
    run by revered AI pioneer Yoshua Bengio. But being a graduate student was no match
    for a Google internship’s unparalleled perks, including “Googley extras.” Beyond
    the handsome salary and an opportunity to work on real-world problems where data
    and compute were readily available without constraints, Google showered its interns
    with free housing, gym memberships, transportation, and massages. And, of course,
    they were provided with the most famous perk of all—free food. This is not your
    run-of-the-mill free food. How good can it be? you are thinking. A food reviewer
    from Serious Eats magazine wrote: “Lunch at Google HQ (Head Quarters) is as Insanely
    Awesome as You Thought.” On the day the reviewer visited one of Google’s numerous
    cafés—each with its own theme—lunch included in-house baked bread and honey, kale
    salad with squash, corn dumplings, locally sourced Rockfish encrusted with nuts,
    and pecan bars that were described as “light and borderline savory, with just
    a faint touch of maple, and garbanzo flour to render these gluten-free.” All this
    free food'
