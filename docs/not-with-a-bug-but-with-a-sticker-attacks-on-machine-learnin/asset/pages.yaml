- pgno: 111
  md: 'The problem of data quality management is further complicated by an adversary
    attempting to actively inject bad data into the system.


    Poisoning attacks caught the tech world’s imagination with Microsoft’s Tay Twitter
    bot, which had to be decommissioned within 24 hours of its launch because Internet
    trolls poisoned its input data by interacting with it. Tay has become a textbook
    example of poisoning attacks—invoked by researchers as a cautionary tale of how
    adversaries can manipulate state-of-the-art ML systems by injecting them with
    bad data.


    A quick reminder before you plumb into this chapter: an adversary in adversarial
    machine learning is anyone who violates the assumptions upon which ML systems
    were built. An adversary may not always refer to a hacker in a hoodie, nor does
    it always require a PhD. It may be a person wanting to fool ad trackers or to
    hoodwink a public organization to prove a point.


    # Your AI Is Powered by Ghost Workers


    You may think that building the actual machine learning algorithm is the hardest
    part of developing a machine learning system. That is largely due to how it is
    advertised: “advanced,” “intelligent,” and “powered by math.”


    However, the most difficult part of creating AI systems for most organizations
    is getting data in the right format to the algorithm’s doorstep for processing.
    The key to good machine learning performance is good data. There is a common trope
    that “data is the new oil.” But, striking it rich in data is much more than finding
    the right drilling location in a west Texas prairie. Finding a data source that
    can be tapped again and again is only part of the challenge. To fuel the applications
    you care about, data must also be refined. There are many steps engineers must
    take to get the data in the right format. Data needs to be collected and then
    cleaned, annotated, and formatted correctly so that it can be ready for ingestion
    by the algorithm.


    Each data source and subsequent refinement process introduces complexity in product
    development. Indeed, ML engineers from'
