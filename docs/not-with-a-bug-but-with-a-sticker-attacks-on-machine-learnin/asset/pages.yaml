- pgno: 92
  md: 'the United States and Canada. And this presents an opening to an adversary.


    To confuse the classifier, an adversary only needs to move an image of a 5 to
    the other side of the boundary, where all images are recognized as 1s! For instance,
    the images shown in Figure 3-4 might both look like 5s to a human, but for a deep
    learning model trained on MNIST data, the one on the left is a 5, and the one
    on the right is a 1.


    ![](img/603389cda98d5077376d0de2ba6c5f76_92_0.png)


    Figure 3.4 The Image on the left is unaltered and recognized as 5. The one on
    the right is an adversarial example and recognized as a 1. If you squint your
    eye, you may notice it is fuzzy and grainier.


    But how do you “move” the 5 from one side of the boundary to the other? The adversary
    generates a specific noise-like pattern and adds it to the original number 5 image.
    The resulting grainier, subtly perturbed image (rightmost image in Figure 3-5)
    still looks like number 5 to humans but will be classified as 1 because of the
    additive adversarial pattern. The resulting image is the “adversarial example”
    because the subtle yet specific adversarial noise pattern we added pushes the
    5 to the 1 region. It’s not just any noise. It’s very specific noise that corresponds
    to the shortest path for a border crossing. Adding the specific “adversarial noise”
    to the original image subtly changes the original image but drastically changes
    the prediction.


    ![](img/603389cda98d5077376d0de2ba6c5f76_92_1.png)


    Figure 3.5 This is the specific noise added to “move” it across the decision boundary.'
