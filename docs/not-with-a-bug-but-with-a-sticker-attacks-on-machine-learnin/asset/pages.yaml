  img_proc: true
- pgno: 201
  md: 'The moral is obvious: if we pay attention to the early warnings from academic
    researchers, we can prevent threats before they cause widespread damage. We can
    avert disasters.


    # In Medias Res


    > Senator Lieberman (1998): “Senator Thompson indicated that somebody had referred
    to you as rock stars of the new computer age. It is probably not what you came
    to hear, but actually, I think you are performing an act of very good citizenship,
    and I appreciate it. I hope you do not mind that I am not going to call you rock
    stars. I would compare you more to Rachel Carson, who sounded some early warnings
    about what environmental pollution was doing to the environment, and in the defense
    context, you might be modern-day Paul Revere, except, in this case, it is not
    the British coming. We do not know who is coming.”


    > Mr. MUDGE: “Right. You have got it.”


    > “Rage—sing, goddess, of the rage of Peleus’ son, Achilles, that ruined all the
    Acheans.”


    So begins Homer’s The Iliad. We are never told why Achilles is angry or why his
    wrath is calamitous. Nor how Achilles’ fury proved ruinous to all. We are just
    dropped in the middle of the action, left to find our footing as the epic poem
    rushes and races through the battleground.


    But as we work through the 15,693 lines of dactylic hexameter, we are rewarded
    with the complete picture. We are given Achilles’ entire backstory and the events
    that led to the ruinous rage and the events thereafter. What started as chaotic
    abandonment by Homer when he dropped us in the middle of his poem unspools, beautifully
    conveying the past, present, and future.


    The literary technique of starting in the middle is called “in medias res,” which
    translates literally to “the midst of.” And once you learn to spot in medias res,
    you see it everywhere, from Milton to Marvel movies, from Dante to daytime TV
    dramas.


    In medias res works as a tool for another important reason. Not only is the backstory
    fascinating, but also because the future story'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'is worth telling. Indeed, we believe AI’s future is filled with hope and optimism.
    We have pointed out that securing AI systems is not a novel conversation. So long
    as there are computers, there will be vulnerabilities. The sooner we know about
    them, the more time we have to prepare.


    Fortunately, the minds and eyes of hundreds of AI researchers are shining a light
    on their limitations before an adversary can point them out to us. These AI researchers
    are our modern-day Paul Reveres and Rachel Carsons, pointing out the imminent
    challenges before we become dependent on flawed technology in too many high-stakes
    applications. Their acts of good citizenship provide us valuable time and foreknowledge
    to correct course, to innovate technically, and to grapple with standards, norms,
    and policies that, together, will help us trust these systems with “justified
    confidence.”


    To that end, rather than prognosticating potential outcomes, we conclude with
    a call to action. Because the best outcomes will require contributions from technologists,
    business leaders, civil rights activists, policy wonks, and the persuasion of
    educated consumers, let us work together to secure AI systems with mindful dispatch.
    We should all have ample motivation as AI adoption spreads into so many facets
    of our lives. And so, we must take concomitant action.


    We are in medias res with learning how attacks on AI systems happen. It is all
    but certain that because of ML systems’ pervasiveness and criticality, attacks
    on them will spread. What was once considered an outlier will become commonplace.
    But for now, we are gifted a period of calm to prepare before these embers in
    the smithy swell to a malevolent global conflagration that could torch our trust
    in AI systems.


    The Tamil poet Valluvar wrote about wisdom in 500 CE, which is frequently translated
    as, “The wise with watchful soul who imminent ills foresee; from the forthcoming
    evil’s dreaded shock are free.” We can ameliorate the shock and surprise of the
    “big one” for AI if we are willing to wise up about the brittleness of AI. Whether
    AI’s future story is one of how wisely we used this time to proactively shore
    up resources to protect high-stakes AI systems'
