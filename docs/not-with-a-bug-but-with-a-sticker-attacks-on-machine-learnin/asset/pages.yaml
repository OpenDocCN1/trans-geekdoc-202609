  md: 'The world would soon learn that this intelligence was anything but solid. Colin
    Powell, former Secretary of State, would later call his speech at the United Nations
    justifying America’s invasion of Iraq “a blot” on his record. To put it mildly,
    America’s rationale to wage war stemmed from questionable evidence; it was a $2
    trillion gaffe. National security experts widely see Powell’s 2003 episode as
    an irrecoverable blow to America’s credibility in the United Nations. That is
    what happens when you try to convince the world with faulty intelligence.


    The 9/11 attacks were a turning point in how America stitches together intelligence
    about its adversaries. Before that, every arm of the government collected its
    own intelligence: the CIA was responsible for monitoring adversaries outside America;
    the FBI monitored for adversaries inside America. The Navy monitors an adversary
    coming via the sea. The problem was that the Federal Aviation Administration (FAA),
    which was responsible for airport security, maintained no-fly lists that were
    not updated based on the intelligence collected by the CIA, FBI, Navy, or other
    agencies.


    “Responsibility and accountability was diffuse,” found the independent 9/11 Commission.
    If you can liken the U.S. government to a team playing (American) football, there
    was “no quarterback” to coordinate with other players, the commission added.


    To remediate this, the U.S. government created the Office of Director of National
    Intelligence (or ODNI for short), which essentially helps to coordinate intelligence
    collected from the 17 or so agencies and compile the canonical “big picture” for
    decision-makers. With the need to assimilate all these data pieces and connect
    the dots between them, ODNI naturally turned to machine learning.


    The pace of information gathered by the U.S. government far exceeds what the intelligence
    community can handle. From 2004 to 2005, the amount of audio backlog that had
    not been translated doubled. Thousands of hours of secretly recorded audio conversations
    of gathered intelligence from Iraq gathered dust. Robert Mueller, then FBI director
    who skyrocketed to public fame when he led the Special Counsel investigating President
    Donald Trump, testified that there just were not enough conversant Arabic speakers,'
