- pgno: 125
  md: 'balanced? Whenever you “like” a post, the web browser extension GoRando randomly
    chooses the post’s emotion. Worried about your privacy when an app asks to access
    your contacts in your phone-book? A tool called Fake Contacts 2 will literally
    create hundreds of fake contacts with fake numbers and names in your phone. On
    a similar note, to escape Instagram’s prying eyes, a group of teenagers once used
    shared accounts to generate group behavior that hides the behavior of specific
    individuals. But the effects of obfuscation do not last long. Just as the effect
    of the magical Felix Felicis potion is temporary, so are the effects of obfuscation
    since modern ML systems continually learn and aggregate signals from different
    places.


    The third lesson here is that it does not take much to poison a machine learning
    system, both in terms of the number of people or data points. Temporarily poisoning
    the ad-tracking system requires only one person—you. It took only 20 people clicking
    links for less than 2 weeks for Bing to incorporate the “honeypot” result. Compare
    this to the 400,000 volunteers in Ukraine’s cyber army against Russia, which outnumbers
    their physical army by 2:1. Victor Zhora, deputy chief of Ukraine’s information
    protection service, said that the cyber army is doing “everything possible to
    protect our land in cyberspace, our networks, and to make the aggressor (Russia)
    feel uncomfortable with their actions.” Or consider the 50,000 that comprise China’s
    cyber army, which Nicole Perlroth from the New York Times reports as constituting
    “an elite satellite network of contractors at front companies and universities
    that work at the direction of China’s Ministry of State Security.” Any cyber army
    can easily launch a campaign to poison an AI system, which could spell its knell.


    The amount of data required to poison an AI system is also low. Researchers have
    found that by polluting examples that total just 0.1 percent of the dataset size,
    one can manipulate an ML model trained on the poisoned dataset. Whole systems
    exhibit similar susceptibility. One strong signal from those “honeypot” words
    from roughly 20 Google engineers was sufficient to confuse the entire Bing system.
    Genius only had to corrupt 100 song lyrics to capture Google’s reliance on its
    data.'
