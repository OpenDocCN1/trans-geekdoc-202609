- pgno: 96
  md: 'of adversarial machine learning. Albert likens adversarial machine learning
    to the card game *Go Fish*. This is how the game goes: a player asks an opponent
    for a card, and if the opponent has the card, the opponent must hand it (or them)
    over or tell the player to “go fish” in the stack for another card. By paying
    attention to the answers provided by the opponent, the player can incrementally
    learn what cards are in the opponent’s hand. Similarly, attackers can query the
    ML model to determine how it responds to the image that the attacker has constructed.
    By paying attention to the ML model’s answers, the adversary can adjust their
    strategy—similar to the *Go Fish* game.


    At this point, you may be thinking, why would the ML model reveal answers to an
    adversary? That’s because an ML model cannot distinguish the intent behind the
    query (are you friend or foe?). The ML model answers truthfully *all the time*.
    This provides valuable feedback and is a signal to the attacker to refine subsequent
    queries. Using the feedback, the adversary can course-correct and make modifications
    until the ML model is eventually fooled.


    This simple technique to attack AI systems has curious consequences. For one,
    an attacker can begin with *any* input and use this approach to modify it into
    something that the ML system recognizes. For instance, the static noise image
    (on the left side of Figure 3-7) has been modified “just right” so that the model
    actually believes it to be a 1. The image (on the right) has been modified “just
    right” using gradient descent so that the system mis-recognizes it as the digit
    6.


    ![](img/603389cda98d5077376d0de2ba6c5f76_96_0.png)


    **Figure 3.7** The attacker can start with any image and modify it to something
    the ML system recognizes. The image on the left is recognized as a 1. The image
    on the right is recognized as a 6.'
