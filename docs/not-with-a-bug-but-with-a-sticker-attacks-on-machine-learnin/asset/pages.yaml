  md: 'to the prank.” The source article’s title, in fact, was “Watch Out, Parents—the
    Viral ‘Outlet Challenge’ Has Kids Doing the Unthinkable!” But none of this mattered
    for Alexa AI’s system. It had missed all the warnings and negative cues from Our
    Community Now and doled out a lethal challenge to a 10-year-old.


    After much media attention, Amazon fixed the error. For its part, Our Community
    Now added “Obviously, do NOT attempt this!” in parentheses in the article title.
    But this habit of regurgitating information from the Internet is not unique to
    Amazon Alexa. It is, in some sense, the industry standard.


    A Twitter user posted a problematic screenshot from Google when searching for
    “Had Seizure, now what?” Google displayed the answer in a feature snippet at the
    top of its web page, designed to provide quick, convenient, and actionable results
    atop the regular search results. This is especially helpful when searching Google
    from your phone because you don’t need to scroll to find the most relevant information.
    It’s also useful when searching via smart speakers and an immediate answer is
    desired.


    Regarding the seizure question, Google excerpted the answer from a University
    of Utah Health article entitled “What to do During & After a Seizure.” The feature
    snippet atop Google’s search results read: “Hold the person down or try to stop
    their movements. Put something in the person’s mouth (this can cause tooth or
    jaw injuries). Administer CPR or other mouth-to-mouth breathing during the seizure.
    Give the person food or water until they are alert again.”


    But as a medical professional would attest, this is exactly what not to do when
    someone has experienced a seizure. Google had surfaced a relevant medical web
    page, but it had pulled the answer from the bulleted list titled “Do Not!” Since
    they operated on the same underlying search engine, this problem lived not just
    in Google but across Google Assistant and Google’s smart devices when responding
    perilously to a life-threatening question.


    The problem was fixed from multiple angles. The University of Utah deleted the
    bulleted list. Google no longer shows feature snippets for searches about what
    to do in case of seizure.'
