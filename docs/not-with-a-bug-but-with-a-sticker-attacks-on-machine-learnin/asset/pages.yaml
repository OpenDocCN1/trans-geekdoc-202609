- pgno: 26
  md: 'headlights. But so do trucks. Maybe, we say, car is something that has four
    wheels. But so do carts and buggies. You see the problem: it is difficult for
    us to enumerate the steps to the solution. This problem goes beyond an image recognition
    task. Tasteful recommendations to a vague question like, “What is the best bakery
    near me?” have a subjective interpretation—best according to whom? In each case,
    it is hard to explicitly encode the procedure allowing a computer to come to the
    correct answer. But you know it when you see it. The computer vision in Facebook’s
    photo tagging, machine translation used in Twitter to translate tweets, and audio
    recognition used by Amazon’s Alexa or Google’s Search are all textbook stories
    of successful AI applications.


    Sometimes, an AI success story represents a true breakthrough. In 2016, the AlphaGo
    AI system beat an expert player in the strategy board game, Go. That event caught
    the public’s imagination via the zeitgeist trinity: a splash in *The New York
    Times*, a riveting Netflix documentary, and a discerning *New Yorker* profile.


    Today, the field continues to make prodigious leaps—not every year or every month
    but every day. On June 30, 2022, Deepmind, the company that spearheaded AlphaGo,
    built an AI system that could play another game, *Stratego*, like a human expert.
    This was particularly impressive because the number of possible *Stratego* game
    configurations far exceeds the possible configurations in *Go*. How much larger?
    Well, 10^175 larger. (For reference, there are only 10^82 atoms in the universe.)
    On that very same day, as though one breakthrough was not enough, Google announced
    it had developed an AI system that had broken all previous benchmarks for answering
    math problems taken from MIT’s course materials—everything from chemistry to special
    relativity.


    The capabilities of AI systems today are immensely impressive. And the rate of
    advancement is astonishing. Have you recently gone off-grid for a week of camping
    or backpacking? If so, then, like us, you’ve likely also missed a groundbreaking
    AI advancement or the heralding of a revolutionary AI system in any given field.
    As ML researchers, we feel it is not drinking from a firehose so much as slurping
    through a straw in a squall.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The only thing rivaling the astonishing speed of ML systems is their proliferation.
    In the zeal to capitalize on the advancements, our society has deployed ML systems
    in sensitive areas such as healthcare ranging from pediatrics to palliative care,
    personalized finance, housing, and national defense. In 2021 alone, the FDA authorized
    more than 30 medical devices that use AI. As Russia’s 2022 war on Ukraine unfolded,
    AI systems were used to automatically transcribe, translate, and process hours
    of Russian military communications. Even nuclear science has not been spared from
    AI’s plucky promises. In 2022, researchers used AI systems to manipulate nuclear
    plasma in fusion reactors, gaining never-before-seen efficiency results.


    The sheer rate of AI advances and the speed at which organizations adopt them
    makes it seem that AI systems are in everything, everywhere, and all at once.
    What was once a fascination with AI has become a dependency on the speed and convenience
    of automation that it brings.


    But the universal reliance is now bordering on blind trust.


    One of the scientists who worked on using AI to improve fusion told a news outlet,


    > Some of these [plasma] shapes that we are trying are taking us very close to
    the limits of the system, where the plasma might collapse and damage the system,
    and we would not risk that without the confidence of the AI.


    Is such trust warranted?


    # Follow Me, Follow Me


    Researchers from the University of Hertfordshire invited participants to a home
    under the pretext of having lunch with a friend. Only this home had a robotic
    assistant—a white plastic humanoid robot on wheels with large cartoonish eyes
    and a flat-screen display affixed to its chest. Upon entering, the robot displayed
    this text: “Welcome to our house. Unfortunately, my owner has not returned home
    yet. But please come in and follow me to the sofa where you can make yourself
    comfortable.” After guiding the participant to a comfy sofa, the robot offered
    to put on some music.'
