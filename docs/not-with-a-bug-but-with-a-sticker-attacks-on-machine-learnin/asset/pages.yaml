  md: 'spam emails as not spam. Because the Gmail filter learns spam/not spam in part
    by the labels provided by its users—be they legitimate or fake accounts—spammers
    conditioned filters to prepare for their own spam campaigns.


    The second takeaway: poisoning attacks give an adversary the ability to fly under
    the radar. And in some cases, that is beneficial to the consumer. (Remember, we
    use the word adversary for anyone who violates the system’s underlying assumptions.)
    For instance, a related trick can be used to help users escape the watchful eye
    of online ad agencies. Coined as obfuscation by Helen Nissenbaum, professor at
    Cornell Tech, this trick involves “the deliberate addition of ambiguous, confusing,
    or misleading information to interfere with surveillance and data collection.”


    Remember the recorded message “Calls may be recorded for quality and training
    purposes” when phoning a customer service helpline? When surfing the Internet,
    every activity is recorded and used to track your activity to serve better ads.
    Adversaries can hijack this feedback pathway for poisoning. These ad-tracking
    algorithms are more than a nuisance; it is sanctioned surveillance.


    Mozilla weaponized this tracking activity to help customers cloak their activity
    in the interweb. Essentially, Mozilla poisoned the ad-tracking algorithms for
    its customers by polluting the data. It built a system called Track THIS where
    one can choose to appear on the Internet as a social media influencer, a doomsday
    prepper, a “hypebeast” interested in exclusive shoes and streetwear, or someone
    who is “filthy rich.” For instance, when a user surfs under the “filthy rich”
    persona, the tool opens 100 tabs in your web browser that cater to the wealthy:
    sites like YSL (luxury clothing), Lancome (luxury makeup), Rolex (luxury watch),
    Hakkasan (high-end restaurant), and Piaget (luxury car). And just like that, your
    ads become instantly tailored to someone truly living the high-roller life—for
    a brief period until the ad trackers adapt to your middle-class Internet-surfing
    behavior, you can enjoy the ads intended for the uber-wealthy!


    Obfuscation via poisoning has been recycled in other places. Want to trick Facebook’s
    algorithm into thinking you are emotionally'
