  md: 'incentives like the differentiation of a security-approved product and lower
    insurance premiums may be a gentle prod in the right direction. But, full-on regulatory
    compliance may still need time to mature in order to fully benefit the end user.
    Are we back where we started?


    We argue no. The journey has made us wiser and stripped our eyes of the naïveté
    that blinded us. Let’s unpack this further.


    Allied Forces occupied remote islands during World War II to serve as strategic
    military bases. Island natives, who until then had little to no contact with the
    external world, now witnessed airplanes landing with supplies: everything from
    beefy tanks to clothing to medicines to canned food. This cargo also doubled as
    valuable trading commodities. When the army recruited the islanders to navigate
    the remote parts of the island, the army paid the islanders in cargo. The supplies
    enthralled the islanders, who soon came to associate the planes carrying the exotic
    cargo as a sign of cornucopia. But when the war ended, the countries packed their
    bags and moved away. Suddenly and abruptly, the planes stopped landing, and consequently,
    the cargo stopped flowing into the island.


    The islanders were despondent over the disappearance of their precious cargo and
    wanted to woo the planes to get the supplies back. Their intent was indubitably
    pure. Using wood straw, sticks, and twine, they constructed their best imitations
    of the control towers and runways that once brought traffic to the island. In
    Vanuatu, islanders appealed each year to a mythical “John Frum” to bring back
    the planes. A chosen islander would wear American military regalia and walk around
    with a ceremonial gun, hoping the planes would land with cargo. One theory for
    the islanders’ name: World War II servicemen may have introduced themselves as
    “John from…”


    From the islanders’ point of view, these artifacts—wood towers and straw runways
    and wearing the uniform—would bring in the cargo they so coveted. Richard Feynman,
    the Nobel Prize–winning physicist, called this cargo cult science in his 1974
    commencement speech at the California Institute of Technology.'
