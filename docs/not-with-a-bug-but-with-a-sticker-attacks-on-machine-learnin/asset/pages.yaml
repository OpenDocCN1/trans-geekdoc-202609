  md: 'So, what is the solution here? Li proffers one: “What must be deleted is the
    siloed nature of scholarship and policymaking on matters of artificial intelligence.”


    Regulators, like the scientists building defenses, have good intentions: promote
    trust in AI. But like the islanders, many proposals, unfortunately, seem to be
    chasing artifacts that might not result in delivering desirable outcomes. For
    that, we must first accept that the “ilities” properties we seek—explainability,
    reliability, security, and more—are not isolated traits that can be enabled or
    disabled independently. Instead, they are deeply entangled and in tension with
    each other. We need to delete the siloed nature of the scholarship of seeking
    these properties individually; instead, we should achieve them holistically and
    practically.


    The real question is not whether we need a framework with a testing regimen and
    sufficient enforcement mechanisms but how to develop one that inspires trust and
    promotes continued innovation.


    That’s a quest worth embarking on.'
