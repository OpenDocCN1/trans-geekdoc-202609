- pgno: 72
  md: 'the MobilEye sensors misrecognized the posted 35 mph as 85, causing the car
    to accelerate. Researchers noted that when there was a discrepancy between GPS
    tagging and posted signs in their experiments, previous Tesla models defaulted
    to the posted sign, trusting its computer sight over the GPS map.


    This trick stands out because, unlike the special stickers Evtimov and the PhD
    crew stuck on stop signs, this one is just plain old electric tape that you can
    find at Home Depot. Anyone can pull it off; no computer science degree required.


    Failures in self-driving have become an intense area of study for two reasons:
    cars are easy targets to confuse because the input to their image recognition
    system includes sensory data of the entire surroundings. Your Alexa needs to function
    well only in the context of a 500-square-foot room with surroundings that don’t
    change. Your self-driving car must reason in dynamic conditions—from snow to seagulls.
    Naturally, nature creates more failure modes.


    Also, finding failures in self-driving cars gets attention. From newspapers to
    policy briefs, homage is paid to these attacks, warning us about how a simple
    trick can fool a complicated car. This taps into our inner David and Goliath sentiment—how
    a behemoth of an AI system can be confused by simple stickers. AI systems perform
    well most of the time, though we have already seen how banal objects like bridges
    and shadows can confuse them. So, what happens when a motivated adversary actively
    tries to bring the system down?


    One way to disrupt a self-driving car is to simply draw a circle around it. James
    Bridle custom-built a neural network vision system and attached it to his car.
    To demonstrate his own computer vision system’s limitation, he drew two concentric
    circles: the inner circle was a solid line, and the outer circle was a dashed
    line. When he drove his self-made, self-driving car complete with cameras and
    ML algorithms, he could drive into the circle but not out of it (see Figure 2-8).
    This is because the car confused the circles with lane markings. A dashed line
    is a road marking that tells drivers (human and autonomous) that it is okay to
    change lanes; solid lines indicate that one must not change lanes. While entering
    through the dashed line, the self-driving car refused to exit on the solid line,
    thus taking'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'the car prisoner. (Bridle appropriately titled his work “Autonomous Trap 001.”)
    He drew the circles using salt and called them “salt circles,” a reference to
    the pagan rituals using salt to contain spirits.


    ![](img/603389cda98d5077376d0de2ba6c5f76_73_0.png)


    Figure 2-8 A self-driving car is immobilized because it confuses the salt circle
    for lane markings.


    Screen capture from Source: Autonomous Trap 001 (James Bridle, 2017), courtesy
    of the artist


    The previous mischiefs all left a trace. Tape on the sign. Salt on the ground.
    What distinguishes the next attack is that it can go completely unobserved by
    humans. Using a movie projector, researchers from Ben-Gurion University momentarily
    projected a human image onto the road. The phantom image existed for a mere 125
    millisecond—short enough for humans to miss it, but long enough for Tesla’s sensors
    to pick it up. The projected image confused Tesla’s computer vision system into
    thinking it had detected a pedestrian inconveniently walking right in front of
    the car. Brakes!


    The researchers had fun with this one. Cheekily, they chose Elon Musk as the image
    to project on the road. Next, they projected stop signs on trees, confusing the
    car. Then, they projected lanes on the road, and the car veered. And unlike tape
    or table salt hacks, phantoms don’t leave any evidence at the scene—an adversarial
    AI crime with a clean getaway.


    But all is not yet doom and gloom. For the most part, you are safe in your self-driving
    car. Several conditions need to line up to execute'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'such attacks. Just because the salt circle trick works on Bridle’s neural network
    does not necessarily mean it will work on your autonomous car. The sticker work
    comes with these strings attached:


    +   - The tape’s color. (Black seemed to perform well; red and reflective, not
    so much.)

    +   - The relative position of the tape. (A gap between the tape and the number
    3 on the sign did not work well.)

    +   - The angle at which the sensors observe the sign.


    All these would have to line up for the attack to work—a tough sell.


    Additionally, Tesla cars no longer use MobilEye sensors, and the system can supplement
    identifying speed limits by tapping into the maps of the area. Furthermore, future
    versions of MobilEye will supposedly ameliorate these kinds of attacks. Even though
    it is after the fact, we can take solace in that autonomous vehicles generally
    can update their software regularly, repairing buggy behavior.


    What we should take away is that autonomous vehicles of all stripes need to foresee
    the presence of a motivated adversary and actively invest in forestalling adversarial
    manipulation.


    # Common Corruption


    Researchers in 2018 found that simply changing the hue (color) and saturation
    (color intensity) of images dropped the accuracy of an AI system, which previously
    won the ImageNet challenge, from the high 90s to just 6 percent. Every time the
    hue and saturation changed, the same image of the bird was recognized as an airplane,
    dog, and frog (see Figure 2-9). (You can flip to the insert to see this image
    in color).


    And this trick was intuitively exploited by Tumblr adversaries after the platform
    banned pornographic content on its website. The users discovered that by coloring
    the pictures green and including a picture of a cartoon owl, the filter would
    not recognize the image as pornographic. Because the AI system was apparently
    cueing on colors—like the color of the skin—to identify whether content was pornographic,
    it was more likely to let green bodies slip by.'
