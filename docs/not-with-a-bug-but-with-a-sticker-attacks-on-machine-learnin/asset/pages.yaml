    # Autonomous Trap 001


    Without overthinking, what number do you see in Figure 2-7?


    ![](img/603389cda98d5077376d0de2ba6c5f76_71_0.png)


    **Figure 2-7** Simple electrical tape on speed signs confused Tesla’s sensors
    to mis-recognize the speed limit as 85.


    McAfee, LLC


    Well, by now, you know the game. Nothing is as it seems.

    In this case, using simple tape, researchers from McAfee tested their hypothesis
    that simply elongating the 3 digit could confuse the MobilEye sensor used in the
    Tesla Model X (2016) and Tesla Model S (2016) to identify the speed limit from
    traffic signs. While they found that sophisticated placement of stickers, like
    Evtimov’s stop sign attack, can trick the sensors, so did a single piece of black
    electrical tape. By using tape to extend the middle of the number 3,'
