  md: 'and subsequent layers gradually learn to identify prominent shapes in the image.
    The final “output” layer puts together the edges, contours, and shapes from the
    previous layers to recognize the entire image. Thus, rather than determining the
    image in one sweeping glance, the algorithm runs through a layer-by-layer progression
    of shapes and characteristics to zero in on the correct identity. With each passing
    year, the machine learning systems employing neural nets made fewer and fewer
    errors as the number of layers increased, as shown in Table 2-1.


    **Table 2-1 — Error Rates by Network Size**


    | ImageNet Competition Year | Size of Network | Error Rate |

    |---|---|---|

    | 2010 (competition begins) | 1 layer | 28.2 percent |

    | 2011 | 1 layer | 25.8 percent |

    | 2012 | 8 layers | 16.4 percent |

    | 2013 | 8 layers | 11.7 percent |

    | 2014 | 22 layers | 6.7 percent |

    | 2015 | 152 layers | 3.57 percent (beat human error of 5 percent) |


    The prevailing intuition: more layers imply better resolution of recognizing images
    and thus are better at the task at hand.


    So, in 2012, University of Toronto researchers tapped into this intuition with
    a singular task of adding more layers to CNNs.


    But the additional layers come at a cost. First, each extra layer requires more
    data to train the enlarged model, and second, researchers need more computing
    power to process the extra data. Thankfully, ImageNet provided a solution to the
    first requirement: more data for deep neural networks. The ImageNet database of
    15 million labeled images was the perfect remedy for this ailment.


    But the second issue—the increased computational burden—presented an impossible
    computation scenario given the commonly used computer technology of the day. So,
    the University of Toronto researchers tore a page from an unlikely playbook—computer
    gaming.'
