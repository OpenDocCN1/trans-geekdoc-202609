- pgno: 134
  md: 'learning engineer can''t force a model to *unlearn* a back door or poison vulnerability.
    In essence, AI''s bugs can''t be patched.


    To make matters worse, AI defenders must worry about the *universality* of AI
    vulnerabilities. In traditional cybersecurity, attackers often target a specific
    vulnerability in dated and unpatched software. Thanks to software updates, certain
    vulnerabilities that exist for one software version might no longer be exploited
    when the patch is applied. But, owing to the *transferability* property in Chapter
    3, in which an adversarial example for model A is also very likely to work for
    model B, AI defenders cannot hide behind a particular implementation or model
    version. Related models *share* vulnerabilities! So, in an exacerbation of adversarial
    asymmetry, attackers needn''t even guess your ML model version. So, the odds are
    stacked against defenders, especially when it comes to AI.


    How do defenders fix this information asymmetry? One strategy began as a decade-long
    obsession with keeping AI systems under wraps: corporate researchers attempting
    to obfuscate the minutiae of the models or even keep entire AI systems a secret.
    This could be, assuming positive intent and kindly interpreting what Musk hinted
    at when he said you first need access to the neural nets. Corporate researchers
    thought locking down the aspects of the system was a remedy for keeping adversaries
    in the dark, preventing easy attacks.


    But the opposite has happened. As we will see in the chapter, the time to topple
    the AI system has not decreased. Keeping things hidden is not a reliable strategy
    for one simple reason: like nature, adversaries will always find a way.


    # Masking Is Important


    Recall that the attacker''s goal in adversarial examples is to provide a carefully
    constructed input to the ML model, which might not confuse a human but will most
    definitely confuse the ML system to provide the wrong output. The canonical example
    here is how an adversary can change the pixels in an image of a panda so it still
    looks like a panda to us, but a state-of-the-art ML system would misrecognize
    it as a gibbon.'
