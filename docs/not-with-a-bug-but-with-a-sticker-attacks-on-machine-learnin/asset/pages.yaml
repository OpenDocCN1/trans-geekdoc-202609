- pgno: 126
  md: 'This combination of low human effort and the low number of samples is particularly
    good for “sting” operations. In 2010, the Russian antivirus company Kaspersky
    publicly complained that competitors copied outcomes they posted on the crowd-sourcing
    antivirus website VirusTotal. To illustrate the point, Kaspersky engineers uploaded
    20 benign files but marked them as malicious. In less than 2 weeks, the files
    were marked as malicious by at least 14 other security firms on the same website.
    The crowd-sourcing site is a vulnerability vector for poisoning with little effort
    and only a few examples.


    Today adversarial machine learning researchers have taken the number of samples
    required to poison to the extreme: corrupting the entire AI system with just one
    data point. A Stanford researchers’ stunning experiment showed that even a single
    data point during training time could have detrimental effects on the entire ML
    system. In a dog vs. fish image classifier, poisoning a single dog image and labeling
    it as a fish in the training dataset eventually led the classifier to ascertain
    other dog images to be mislabeled as fish (see Figure 4-2).


    ![](img/603389cda98d5077376d0de2ba6c5f76_126_0.png)


    Figure 4.2 Poisoning a single training example leads to multiple failures during
    test time. Pang Wei Koh and Percy Liang. “Understanding black-box predictions
    via influence functions.” International Conference on Machine Learning, 2017


    Interestingly, the authors of this study corrupted the training image of the dog
    using adversarial examples. And it turns out there is a close connection between
    these two attacks.'
