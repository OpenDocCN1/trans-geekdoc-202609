- pgno: 115
  md: 'In NLP, annotating a complete body of text, even in a single language like
    English, is nearly impossible. For instance, “We saw her duck” could refer to
    the sighting of either a woman’s pet waterfowl or the collective act of seeing
    someone lower their head. Language has too much nuance and context to objectively
    label every sentence. So, without a body of text that provides annotations similar
    to what ImageNet provided for computer vision, NLP researchers had to solve the
    problem differently.


    NLP researchers recast the problem by turning to advances in *unsupervised learning*.
    In this AI paradigm, machine learning systems do not need large volumes of annotated
    data. Instead, researchers use huge amounts of *unannotated* data first to “pre-train”
    the system to be familiar with the basic concepts of language. With that foundation,
    a generic pre-trained model can be subsequently fine-tuned to specialized custom
    tasks, such as rating movie reviews, understanding Internet search queries, or
    calculating distances to the nearest Walmart.


    Fine-tuning is a simple shortcut humans use all the time. Imagine you would like
    a specific color chair. One option is to buy the wood, buy the required tools,
    make the chair, and then paint it the color of your choice. Alternatively, you
    could buy a white chair from Ikea and paint it. The second option is the pretraining/fine-tuning
    regime. Essentially, researchers build a generic task over tomes of unannotated
    data; all one needs to do is simply customize it for the task at hand.


    So, where does one find large volumes of unannotated text? The Internet, of course.


    With close to 6 million articles in the English language alone, Wikipedia is the
    world’s largest open encyclopedia, encapsulating 20 gigabytes of compressed, open-domain
    knowledge for researchers to feed into the hungry algorithms for pretraining.
    One can visit `dumps.wikimedia.org` and download the entire Wikipedia exactly
    as it existed at that time, no questions asked. Wikipedia is not only free, but
    it is also relatively high-quality. Unlike the poor annotation that plagued ImageNet,
    an army of regimented wiki editors ensures the quality and consistency of the
    input data to the NLP algorithms.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Another added advantage is that the same Wikipedia article is frequently translated
    into various languages—for instance, the article on Jesus Christ has been translated
    into 253 languages—which also helps ML algorithms learn language translation tasks.


    Online books also provided a fruitful source. In the BookCorpus dataset, researchers
    downloaded thousands of books from a site called Smashwords.com—everything ranging
    from romance novellas to young adult fiction to vampire stories.


    Who knew that AI was powered, in part, by vampire novels? Wikipedia articles on
    UFOs and online vampire novels are not the sole sources of text that power information-hungry
    algorithms. Nearly the *entire* Internet is used. Common Crawl is a nonprofit
    organization that regularly captures snapshots of large swaths of the Internet
    and makes them publicly available. Each crawl consists of a snapshot of the Internet,
    frozen in time, consisting of trillions of URLs, covering everything from Reddit
    posts to restaurant menus. This Internet time capsule may be used directly to
    train models or indirectly when other popular ML datasets are distilled from it.
    These derived datasets—with names like LAION-5B, the Pile, and CC-100 that appropriately
    sound like the custom parts of a gearhead to soup up their performance vehicle—are
    key ingredients to the powerful and impressive chatbots, text-to-images, and translation
    models that have fired up the public imagination.


    Of course, not all machine learning is powered by open datasets. There are many
    sectors where open source is not the norm. Healthcare organizations use ML models
    trained on electronic health records and are kept private. Banks use ML that is
    trained on its users’ credit card transactions—locked down data. But, by and large,
    most of today’s cutting-edge models and compelling applications are built on open-source
    Internet data.


    In 2018, Google developed BERT, a general-purpose text processing model that produced
    state-of-the-art results for various language tasks such as comprehension, text
    generation, and sentiment analysis. It caught everyone’s attention, with *The
    New York Times* writing, “BERT’s arrival punctuated a significant development
    in artificial intelligence.”'
