  md: 'big one is yet to come. And in our low-security state of AI today, one early
    candidate for the big one might also be launched through “traditional” security
    attack vectors.


    # Software, All the Way Down


    Several dozen taxis flooded Russia’s Fili district, a busy west-central neighborhood
    in Moscow. Attackers had compromised Yandex Taxi, Russia’s largest cab service,
    and sent a message requesting all available taxis to come to the same address
    in the heart of the city. The result: chaos and traffic jam. No fancy stickers.
    No advanced adversarial machine learning. Just traditional hacking.


    Then there is the case of insider threats wherein employees steal AI trade secrets
    which Tesla and Apple’s secret autonomous car division fell prey to. In both cases,
    it was when the company’s engineers left for a Chinese autonomous vehicle startup—XPeng,
    their direct competitor. Despite Apple’s infamous policies to keep its plans secret,
    an engineer simply “AirDropped” 24 gigabytes of Apple’s autonomous car plans onto
    his wife’s laptop. In Tesla’s case, an engineer uploaded the source code relating
    to the Autopilot technology to his iCloud account before leaving for the Chinese
    company. Once again, there was no fancy machine learning attack to re-create the
    algorithm. It was simple stealing.


    Even coordinated attacker groups are getting into the fray. NVIDIA and AMD, AI
    hardware manufacturers, both were victims of ransomware attacks. In the case of
    NVIDIA, a treasure trove of information was released by attackers: from detailed
    product plans to schematics to circuit diagrams. Semiconductor analyst Dylan Patel
    called it a “national security disaster.” The public release of these documents,
    he posited, “With this data, the multiple Chinese AI and GPU [general processing
    units] firms can kickstart and catch up massively on the design of their GPUs.”
    Again, it was run-of-the-mill traditional cyber attacks, not fancy ML attacks.


    These three instances are a good reminder that machine learning is built with
    software. AI might seem like math and magic, but'
