- pgno: 114
  md: 'of those annotating the datasets, leading models to propagate the unparliamentary
    name-calling captured by the original label.


    ImageNet, which sparked the AI revolution and symbolized the epitome of quality,
    eventually fell from grace, owing to a parade of problems: improperly tagged data,
    indecorous images, and unclear licensing. At one point, more than 600,000 images—half
    its database—were culled.


    The reality is that ghost workers are propping up the entire AI scaffolding as
    they continue to annotate datasets. These erroneously tagged datasets can seriously
    impede leadership decisions with tragic consequences if used in critical areas
    such as finance, healthcare, or defense. Imagine a computer vision system targeting
    a minaret because it was misrecognized as a missile because of faulty annotation.


    ML researchers have begun to ask whether we can free machine learning’s dependency
    from the hard work of annotating datasets. If human-annotated data has become
    so costly and fraught with errors, why not teach machines to learn from unannotated
    datasets and cut out the human-in-the-loop completely? Tesla took to this philosophy
    by laying off hundreds of data labelers in favor of automatic labeling software.


    But, as it turns out, this proposed solution is very much like attempting to slay
    the hydra—when you cut off its head, two others sprout up in its place.


    # Your AI Is Powered by Vampire Novels


    Natural language processing (NLP) is the arm of machine learning dedicated to
    teaching algorithms to reason about spoken or written language. For instance,
    when you ask Alexa, “Where is the nearest Walmart?” your device first needs to
    understand that this is a question. Next, it must understand that Walmart is a
    retail store and that “where” and “near” refer to distance. Then, Alexa must put
    all these pieces together, calculate the distance to various Walmart stores from
    your location, and select the nearest one.'
