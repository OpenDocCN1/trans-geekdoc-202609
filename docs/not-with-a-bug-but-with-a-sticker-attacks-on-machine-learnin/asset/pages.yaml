  md: 'manipulation must also be advancing at a rapid pace, right? Unfortunately,
    no. MIT Professor Aleksander Madry, noted adversarial ML expert, points out in
    his lecture notes, that the succession of attacks and defenses is still “a cottage
    industry,” adding that “time and time again, these defenses have been repeatedly
    broken, often extremely quickly.”


    Carlini shines not just because he breaks machine learning systems, but he does
    it with an unmistakable sense of sprezzatura. “I get the feeling that people vastly
    over-estimate the difficulty of breaking published defenses,” Carlini concluded
    after doing a live recording of him breaking a state-of-the-art defense against
    adversarial machine learning. In one published work that broke a different defense
    that he titled “Is AMI (Attacks Meet Interpretability) Robust to Adversarial Examples?”
    he summarized his findings in the abstract in a single word: “no.”


    But there was a seminal moment in 2018 that drove this point home. Many ML researchers
    had bookmarked January 29, 2018, on their calendars because that was when the
    prestigious conference International Conference on Learning Representations (ICLR
    for short and pronounced “eye-clear”) would announce whether their work had been
    selected to be presented at the venue. It was the same conference where the existence
    of adversarial examples by Szegedy and collaborators had been announced four years
    prior. Presenting at this venue would certainly burnish one’s credentials as a
    bona fide ML researcher. When the announcements went out on January 29, 2018,
    they unsurprisingly included defenses to adversarial examples from top brass universities—including
    Stanford, Berkeley, Carnegie Mellon University, and others.


    But just three days after the announcement, Anish Athalye, in collaboration with
    Carlini and Wagner, put up a website showing how seven of nine defenses just announced
    at this prestigious ICLR conference had been broken.


    The problem is not that defenses are imperfect—that is to be expected, because
    nature always finds a way—but it *continues to*'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'happen. First, in 2017, Papernot, while working on transferability and black-box
    attacks, showed that a slew of defenses using gradient masking had been broken.
    Next, in 2018, Athalye and Carlini broke seven of nine defenses. And then, in
    2020, almost two years to the date later, Carlini would once again break 13 defenses.


    You would have thought that researchers would have learned in 2017, but to see
    this problem rear its head again in 2018 and then again in 2020 almost makes you
    stop and ask: is the field just going in circles? What’s so hard about building
    defenses for ML systems?


    # Masking Alone Is Not Good Enough


    Battista Biggio, one of the adversarial ML elders, was not too surprised when
    news of Carlini’s 2018 ICLR-defenses-breaking hijinks of breaking was published.
    He later told Wired magazine, “The machine learning community is lacking a methodological
    approach to evaluate security.”


    The common culprit connecting these events from 2017 through 2020? Gradient masking.
    Defenders had been trying to naively obfuscate gradient information and keep it
    a secret from adversaries, but each of these would prove insufficient for a bulletproof
    defense.


    For instance, as previously discussed, researchers tried to use hard labels containing
    no confidence information, hoping to make it onerous for adversaries to construct
    adversarial examples using gradient descent. However, researchers like Papernot
    and Carlini showed that adversaries could reconstruct gradients by simply interacting
    with the system. How? Essentially, an adversary would first build a surrogate
    ML model using the responses from the target model. This surrogate model is controlled
    by the attacker, emitting both labels and confidence. Then, the attacker can leverage
    the simplest and most effective white-box attacks, leading to adversarial examples
    that work against the surrogate model. Then, by the property of transferability,
    the adversary could use these examples to bypass the victim model.'
