- pgno: 42
  md: '# ML Systems Don’t Jiggle-Jiggle; They Fold


    To understand adversarial machine learning, we first must understand how AI systems
    fail.


    Machine learning systems might beat humans at *Jeopardy*, solve *Stratego*, and
    ace MIT math problems, but they can also fail in spectacular fashion. Borrowing
    the phrasing of documentarian Louis Theroux’s viral TikTok song, at the slightest
    poke, ML systems don’t just jiggle-jiggle; they fold.


    When ML systems fail, even with no deliberate provocation, we call them *unintentional
    failures*. This happens when a system produces a formally correct but often nonsensical
    outcome. Put differently, in unintentional failure modes, the system fails because
    of its inherent weirdness, as author Janelle Shane says in her entertaining book
    on AI, *You Look Like a Thing and I Love You*. In these cases, anomalous behavior
    often manifests itself as earnest but awkward and literal *Amelia Bedelia*–like
    adherence to its designers’ objectives. For instance, an algorithm trained to
    play *Tetris* learned how to pause the game indefinitely to avoid losing. The
    algorithm was designed to win the *Tetris* game and did whatever was in its power
    not to lose. Scenarios like this are like the Ig Nobel Prize—where it first makes
    you laugh and then makes you think.


    But it is not all humor.


    The U.S. Air Force trained an experimental ML system to detect surface-to-surface
    missiles, which initially had an impressive accuracy of 90 percent. But instead
    of getting a game-changing target recognition system, the Air Force learned a
    sobering lesson. “What a surprise: The algorithm did not perform well. It actually
    was accurate maybe about 25 percent of the time,” an Air Force official remarked.
    It turns out that the ML system was trained to detect missiles that were flying
    only at an oblique angle. And the accuracy of the system plummeted when the system
    tried to detect missiles flying vertically. Fortunately, this system was not deployed.


    Conversely, *intentional* failure modes feature an active adversary that deliberately
    causes the ML system to fail. It should be no surprise that machines can be intentionally
    forced to make errors.'
