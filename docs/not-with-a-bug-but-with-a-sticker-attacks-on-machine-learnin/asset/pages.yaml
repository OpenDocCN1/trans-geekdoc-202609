- pgno: 31
  md: 'Health is to serve as a catalyst to save and improve lives around the world
    and lower costs through cognitive computing,” Kathy McGroddy, then vice president
    of IBM Watson Health, told Fortune in 2016. Yet, after $5 billion in acquisitions,
    a swanky presence in Cambridge, Massachusetts, and a litany of partnerships from
    Apple to Under Armour, Watson Health failed.


    How did our supposed AI overlord fail? Watson Health’s recommendations were often
    obvious, such as suggesting chemotherapy as an option for a cancer patient. Other
    times, remedies lacked context, like providing recommendations for procedures
    unavailable in the area. And sometimes, the diagnoses were downright wrong. In
    trials, doctors were more frustrated than assisted. Riddled with disappointment,
    IBM sold off Watson Health.


    There are everyday examples of trust resolution problems. Google Maps and related
    services have remarkably changed how we drive. We trust them to navigate our vehicle
    in unfamiliar neighborhoods and cities. So, why not trust it for mountaineering?
    Hikers wanting to take in the majestic views of Scotland from the 4,500-foot Ben
    Navis peak were guided by the mapping service to drive to the nearest parking
    location and then walk a short, dotted line to the mountain’s peak. Interpreting
    the dotted path as the recommended trail, many hikers became stranded along a
    route that Scottish mountaineering charities warned was “potentially fatal.” These
    Scottish mountaineering charities even added, “The trail is highly dangerous and
    for advanced hikers only.” Trust resolution in navigation software has caused
    hikers to get lost in the mountains from New Hampshire to the Appalachian trails.
    Google Maps retroactively fixed the issues, but the lesson is clear: the navigation
    prowess of a mapping service on roads—a task-specific capability—does not deserve
    our trust in a system-wide capability of, say, mountain hiking, running on trails,
    or sailing on the high seas.


    The trust resolution problem is magnified by marketing that accentuates sophistication,
    portraying actual rather than artificial intelligence. Often, stock photos symbolizing
    AI systems feature a human brain. Organizations ascribe human-like qualities to
    machines. Their products are “smart” with “intelligent” features.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Their systems “read,” “listen,” and “see.” Sophia, a glorified chatbot in a
    mannequin, was given Saudi Arabian citizenship and even appeared at the United
    Nations. Only a tiny fraction of influential computer science researchers muse
    that current AI systems are on the verge of consciousness, but these are the views
    further amplified by popular media. For example, the opening hook in an article
    by *The New York Times* that followed the AlphaGo victory read, “It isn’t looking
    good for humanity.”


    The problem is that the burden to winnow the chaff from true breakthroughs is
    placed on the public. And the public is uniquely unqualified to do this.


    The Allen Institute for AI surveyed more than 1,500 Americans to measure their
    understanding of current AI capabilities. Participants were asked to answer true
    or false to statements like “Siri uses AI.” The results paint a dire picture:
    more than 84 percent of Americans are “AI illiterate,” the researchers concluded.
    Most Americans incorrectly believed that “AI can understand cause and effect (for
    example, if I heat water on the stove, then it will boil) at the level of an adult
    human.” Even educated engineers are sometimes led astray. A former software engineer
    from Google with a graduate degree in computer science incorrectly believed that
    Google’s advanced chatbot “is a sweet kid who just wants to help the world be
    a better place for all of us.”


    We sometimes ascribe powerful AI tools with *intelligence*, but in reality, they
    are *artificial*! But to endow AI with even the most basic reasoning capabilities
    would require a radical restructuring of AI technology, Turing Award winner Judea
    Pearl argues in *The Book of Why*. Most AI researchers agree that while we are
    making research strides in this area, we are nowhere close to instilling your
    car with intuition. “It’s so striking that as much as AI technologies have advanced,
    we still don’t have AI systems with anything like human common sense,” MIT Professor
    Joshua Tenenbaum told *Scientific American*.


    Overtrust in AI has serious ramifications. Overtrust in self-driving cars prompts
    drivers to sleep at speeds of 90 miles per hour on the freeway, play video games
    when the car is moving, or even'
