  md: 'as ML systems unfairly harm a subset of the population without a sense of equity
    and justice. The data used to train a system might underrepresent certain groups,
    and that social bias is then reflected in the model’s performance. A landmark
    study led by Joy Buolamwini, Timit Gebru, and Deborah Raji showed that commercial
    facial recognition systems built by Amazon, Microsoft, and IBM consistently misrecognized
    people of color. The result? Over the years, wrongful arrests have been made in
    the United States using facial recognition evidence. All were wrongful arrests
    of Black men because the AI system misidentified them. Local governments began
    prohibiting the use of this technology, Amazon stopped selling these tools to
    law enforcement, and Microsoft recently stopped selling facial analysis tools
    altogether.


    So, it is natural that the AIA is looking to mitigate societal bias in AI. But,
    again, things are not so straightforward as bias interacts with security unintuitively.
