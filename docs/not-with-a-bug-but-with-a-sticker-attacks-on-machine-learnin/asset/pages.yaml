- pgno: 18
  md: 'constantly evolving, profoundly inexplicable software—and we’re even worse
    at that. We know very little about machine learning security. Today, it’s much
    too easy to bias a model in training, fool a model in use, and extract private
    data from a model. It seems like every month we learn about new vulnerabilities
    and attacks, and some of them are profoundly weird and subtle. Everything seems
    to matter in ways that are just as hard to understand as the models themselves.


    These vulnerabilities and attacks are not theoretical. They are effective against
    machine learning systems in use today, systems making real-world decisions that
    affect real people. And while much of the published research is done by professionals
    in a lab setting, we really don’t know how existing systems are being exploited
    by attackers. Are propagandists slipping by content moderation systems by selectively
    deploying commas? Are the controls on language models being bypassed by giving
    them seemingly innocuous prompts? Are prospective college applicants slipping
    past the machine learning gatekeepers by sprinkling some carefully chosen words
    into their application essays? We honestly have no idea.


    We’re going to have to do better. We need to better understand the landscape of
    attacks and defenses. We need some robust ML security practices and better theory
    about both the resilience and the fairness of ML models and practical policy measures.
    This is what the book delivers by asking the right questions and nudging us toward
    an answer.


    —Bruce Schneier

    Cambridge, MA'
