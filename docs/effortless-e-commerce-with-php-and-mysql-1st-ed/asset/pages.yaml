  md: 'Just before the email address label, you''ll see this code:


    ```

    <?php if (array_key_exists(''login'', $login_errors)) {

    echo ''<span class="error">'' . $login_errors[''login''] . ''</span><br />'';

    } ?>

    ```


    By default, all errors are reported via the create_form_input() function. However,
    this form is a bit different in that login.inc.php could create an error (that
    is, an element in the $login_errors array) not associated with a particular form
    input. That error occurs when both fields are properly filled out but the values
    don''t, together, match a record in the database. In that case, the $login_errors[''login'']
    element is assigned an error message. Therefore, the form first checks if that
    array element exists in $login_errors, in which case the error message will be
    displayed just before the two inputs (Figure 4.12). Other error messages are associated
    with the offending form input (Figure 4.13).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_111_0.png)


    Figure 4.12


