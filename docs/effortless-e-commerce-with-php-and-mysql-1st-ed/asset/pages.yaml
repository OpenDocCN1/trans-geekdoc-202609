    > You could also change the header file so that the register tab is not shown
    to users that are logged in.


    After you''ve done all this, you can now test the login process.


    # LOGGING OUT


    Logging out is the simplest part of the process. The logout.php page starts off
    as a standard script, including the configuration file, the header, the MySQL
    connection, and the footer. Only logged-in users should be able to access this
    page, though, so a call to redirect_invalid_user() is included just after the
    configuration file is defined.


    To wipe out the session, three steps are required. First, clear out the $_SESSION
    array that represents the variables available to this script:


    ```

    $_SESSION = array();

    ```'
