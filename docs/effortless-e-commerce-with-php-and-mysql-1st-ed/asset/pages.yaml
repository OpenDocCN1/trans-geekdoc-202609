- pgno: 161
  md: "12. On the next page, copy the generated code (Figure 6.10).\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_161_0.png)\n\
    \nFigure 6.10\n\nThis is the code to be integrated into the site, which you'll\
    \ do next.\n\n# INTEGRATING PAYPAL\n\nOnce you've created the test accounts and\
    \ the PayPal button, you can tie your site into the fake PayPal. Doing so is a\
    \ snap:\n\n+   1. Add the button code where appropriate.\n\n+   2. Create the\
    \ thanks.php page.\n\n+   3. Create the cancel.php page.\n\nThere will be a couple\
    \ of catches, however, so after you integrate and test PayPal, you'll learn a\
    \ way to improve the system.\n\n# Updating the Registration Page\n\n> tip\n> \n\
    > Remember that you can download all the source code for this example from www.DMCinsights.com/ecom/.\n\
    \nWith this particular Web site, the user should go to PayPal (by clicking the\
    \ button) after successfully completing the registration process. To pull that\
    \ off, start by changing the thank you message in register.php so that it tells\
    \ the user what to do next:\n\n```\n```\necho \"<h3>Thanks!</h3><p>Thank you for\
    \ registering! To complete the\nprocess, please now click the button below so\
    \ that you may pay for your\nsite access via PayPal. The cost is $10 (US) per\
    \ year. <strong>Note: When\nyou complete your payment at PayPal, please click\
    \ the button to return to\nthis site.</strong></p>\";\n```\n```\n\nNext, drop\
    \ in the PayPal-generated code in order to add the button (Figure 6.11):\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_161_1.png)\n\
    \nFigure 6.11"
  merge: -1
