    # THE CONFIG FILE


    The next PHP script to be created is a configuration file. Like the mysqli.inc.php
    script, this one will be used by every script in the site (although some sites
    will have pages that don''t require a database connection, every PHP script in
    every site should always use the configuration file). The configuration file has
    four purposes:


    +   - Define systemwide settings so they may be changed easily

    +   - Define useful constants that may be used by multiple scripts

    +   - Start the session

    +   - Establish how errors will be handled


    Let''s start defining the configuration file now, and in Chapter 4, “User Accounts,”
    more code will be added to it.


    +   1. Create a new PHP script in your text editor or IDE to be named config.inc.php
    and stored in your includes directory, as in Figures 3.2 and 3.3.

    +   2. Define the $live and $contact_email variables:

    +      ```php

    +      <?php

    +      $live = false;

    +      $contact_email = ''you@example.com'';

    +      ```


    The $live variable is really the most important variable because it’ll dictate
    how errors will be handled. Depending upon the payment gateway, this variable
    could also be used to switch from just testing the payment processing to actually
    using it. However, PayPal is a bit different, so that won’t be the case in this
    example.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_73_1.png)'
