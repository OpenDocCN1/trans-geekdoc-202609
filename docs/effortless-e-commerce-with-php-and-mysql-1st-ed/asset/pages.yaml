  md: "Again, the reference to the CSS file assumes it will be found in the **Web\
    \ root directory/css** folder.\n\n+   8. After including the jQuery library, include\
    \ the hoverIntent and Superfish JavaScript files:\n\n```\n<script src=\"//js/hoverIntent.js\"\
    \ type=\"text/javascript\"\ncharset=\"utf-8\"></script>\n<script src=\"//js/superfish.js\"\
    \ type=\"text/javascript\"\ncharset=\"utf-8\"></script>\n```\n\nMake sure you\
    \ include the scripts in this order.\n\n+   9. In a separate script block, apply\
    \ Superfish:\n\n```\n<script type=\"text/javascript\">\n$(function() {\n$(\"ul.sf-menu\"\
    ).superfish({\nautoArrows: false,\nspeed: 'fast'\n});\n});\n</script>\n```\n\n\
    > ### tip\n> \n> The **us.sf-menu** code actually selects every unordered list\
    \ with a class of `sf-menu`, but the template has only one.\n\nThis code enables\
    \ the Superfish menu. The very basic JavaScript being executed is just `$( );`.\
    \ This is magic jQuery speak for “when the document is ready, do the following.”\
    \ The code to be executed when the document is ready is defined in an **anonymous\
    \ function** (a function without a name). Within the function, the unordered list\
    \ with a class of `sf-menu` is selected. To that selection, the **superfish()**\
    \ method is applied. Two attribute-value pairs are passed to the **superfish()**\
    \ method: one disabling arrows that indicate submenus exist; the other sets the\
    \ Superfish speed to **fast**.\n\n> ### tip\n> \n> If the Superfish menu doesn’t\
    \ work for you, use a JavaScript debugging tool, such as Firebug for the Firefox\
    \ browser, to see what might be wrong.\n\n+   10. Save the file and test it in\
