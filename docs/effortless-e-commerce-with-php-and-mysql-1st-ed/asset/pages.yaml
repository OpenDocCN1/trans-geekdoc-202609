  md: 'Next, the **session_destroy()** function actually removes the data stored on
    the server:


    ```

    session_destroy();

    ```


    Finally, modify the session cookie in the user''s browser so it no longer has
    a record of the session ID:


    ```

    setcookie (session_name(), '''', time()-300);

    ```


    That line sends a cookie with the same session name, but no value (no session
    ID) and an expiration of five minutes ago.


    The complete logout.php is:


    tip


    At www.php.net/session_destroy, you can see code to dynamically match all the
    setcookie() parameters to those used to create the cookie.


    # logout.php


    ```

    1 <?php

    2 require(''./includes/config.inc.php'');

    3 redirect_invalid_user();

    4 $_SESSION = array();

    5 session_destroy();

    6 setcookie (session_name(), '''', time()-300);

    7 $page_title = ''Logout'';

    8 include(''./includes/header.html'');

    9 echo ''<h3>Logged Out</h3><p>Thank you for visiting. You are now logged out.
    Please come back soon!</p>'';

    10 require (MYSQL);

    11 include(''./includes/footer.html'');

    12 ?>

    ```


    Figure 4.14 shows the result.


