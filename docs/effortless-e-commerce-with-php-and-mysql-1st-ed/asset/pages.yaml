- pgno: 109
  md: "onto PHP. Instead, I’m doing an IF conditional within my MySQL query. That\
    \ syntax is just:\n\nIF(date_expires >= NOW(), true, false)\n\nThe first expression\
    \ is the condition being tested; the second is what’s returned if the condition\
    \ is true; the third value is what’s returned if the condition is false. Thus,\
    \ if the expiration date is greater than or equal to this moment, the value true\
    \ will be selected.\n\n+   6. If one row was returned by the database query, fetch\
    \ the data and store it in a session:\n\n```\nif (mysqli_num_rows($r) == 1) {\n\
    \  $row = mysqli_fetch_array ($r, MYSQLI_NUM);\n  $_SESSION['user_id'] = $row[0];\n\
    \  $_SESSION['username'] = $row[1];\n  if ($row[2] == 'admin') $_SESSION['user_admin']\
    \ = true;\n  if ($row[3] == 1) $_SESSION['user_not_expired'] = true;\n}\n```\n\
    \nFirst, the user’s ID and name are stored in the session, but given user<something>\
    \ names, so that they won’t possibly conflict later on with anything else I might\
    \ store in the session.\n\nTo indicate that the user is an administrator, I only\
    \ want to create a $_SESSION['user_admin'] element if the user’s type equals admin.\
    \ I don’t want to create a $_SESSION['user_admin'] element equal to false if their\
    \ type is member. This is because the function that will validate a user’s access\
    \ to pages—redirect_invalid_user() in config.inc.php—will check only if a session\
    \ variable is set, not what its actual value is.\n\nFor the expiration, I only\
    \ want to store a value indicating that the account hasn’t expired. MySQL will\
    \ return the number 1 for the Boolean value true, so if $row[3] (which is the\
    \ value in the array for the expiration status) equals that, I create a new element\
    \ in $_SESSION. Again, I’m not assigning a value if the account has expired.\n\
    \n+   7. If no row was returned, create an error message:\n\n```\n} else {\n \
    \ $login_errors['login'] = 'The email address and password do not match those\
    \ on file.';\n}\n```\n\nThis error message will apply if the user supplied a valid\
    \ email address and a password but the values didn’t match those stored in the\
    \ database. For security purposes, the script doesn’t indicate which of the two\
    \ values is incorrect, or if the email address has been registered at all."
