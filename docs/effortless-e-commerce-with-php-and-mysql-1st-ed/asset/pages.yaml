- pgno: 184
  md: "Note that the site will not be storing the full credit card number, just the\
    \ last four digits (so that the site can indicate the card used, as in *####).\n\
    \nThe order_contents table represents the actual items purchased in an order.\
    \ It has a foreign key to the orders table, plus the product_type and product_id\
    \ columns as in the sales table. The quantity and price columns indicate the number\
    \ ordered and the price paid per item. This is necessary because there may be\
    \ a sale price and, over time, the prices in the two products tables will change.\
    \ Finally, the ship_date column is NULL by default, indicating that the item has\
    \ not shipped. When the item ships, this column's value will be set to that ship\
    \ date and the customer will be billed for that part of the order.\n\nThe transactions\
    \ table will be used to record every interaction between this Web application\
    \ and the payment gateway, Authorize.net. The first four columns are for internal\
    \ use, tying the transactions to a specific order and recording exactly what was\
    \ being attempted. The bulk of the columns then store parts of the Authorize.net\
    \ response. You'll see how this table is used in Chapter 10, “Checking Out.”\n\
    \nThe carts and wish_lists tables have mirrored definitions and require a bit\
    \ of explanation. I decided that this project would not use sessions at all, in\
    \ part because the user isn't logging in and out, and therefore isn't being tracked.\
    \ But, if I forgo formal PHP sessions and move session-like functionality to the\
    \ database, the site can have data permanence. By storing the customer's shopping\
    \ cart contents and wish-list items in the database, the customer can leave and\
    \ return (in a day, a week, or a month) and still have their previous actions\
    \ recorded and available, without ever logging in. This is a very nice feature\
    \ that requires a single cookie. To accomplish all this, the carts table records\
    \ everything that's in the customer's cart (the items the customer intends to\
    \ purchase now) and the wish_lists table records everything that the customer\
    \ has saved for later (items the customer intends to purchase down the road).\
    \ Each item gets listed as its own record, indicating the quantity, product type,\
    \ and product ID. Each item stored is associated with a user_session_id, which\
    \ will be a unique representative value that's stored in the user's cookie (it's\
    \ not an actual session ID).\n\nFrom a marketing standpoint, this system means\
    \ that customers could be emailed to:\n\n+   - Remind them to complete an order\
    \ (gently: you want to be careful about this)\n+   - Let them know that an item\
    \ they are interested in has just gone on sale\n+   - Let them know about similar\
    \ items they may like\n+   - Warn them that a sale item is about to go off sale\n\
    \n> **tip**\n> \n> Go to www.DMCInsights.com/ecom/ to read some extra ideas as\
    \ to how the database could be designed."
