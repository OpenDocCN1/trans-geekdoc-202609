  md: '# DATABASE DESIGN


    Since the *Coffee* site is more complex than the *Knowledge is Power* example,
    the database is correspondingly more involved. I''ve come up with 12 tables, evenly
    split between those for representing the catalog of products and those associated
    with the customers and orders.


    # Product Tables


    Six customer-related tables represent the specifics about all the products available
    on the *Coffee* site (Figure 7-3).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_182_0.png)


    Figure 7-3


    The *non_coffee_categories* table represents the types of non-coffee products
    that will be sold: books, mugs, edibles, and so on. This table stores the category
    name, a description, and an image (the image will display on a page that lists
    the categories). The *non_coffee_products* table has a many-to-one relationship
    with *non_coffee_categories*. Each product will be in one category and each category
    will have multiple products (Figure 7-3). The *non_coffee_products* table has
    a foreign key, name, description, image, price, stock, and creation-date columns.
    This table represents the specific non-coffee products that customers will purchase,
    and its id field will become part of the product''s SKU. The *stock* field contains
    an indication of the quantity of the item in stock, not a simple *Yes/No*.


    **tip**


    The *price* column is defined as `DECIMAL(5,2)`, meaning that it can have up to
    five numbers with up to three numbers to the left of the decimal and will have
    exactly two to the right.


    **tip**


    If you''re selling variations on a product, like clothing in different sizes and
    colors, you''d use a structure similar to the coffee tables.


    The *general_coffees* and *specific_coffees* tables have a parallel relationship
    to the two non-coffee tables. The *general_coffees* table is defined exactly like
    *non_coffee_categories* and will represent the primary types of coffee sold. For
    those types, I''m using a somewhat pedestrian organization, mixing roasts, bean
    types, and flavors: original, dark roast, vanilla, Kona, and so on. If the'
  merge: -1
  img_proc: true
- pgno: 183
  md: "customer knew they wanted to purchase Kona coffee, they’d look into that coffee\
    \ “category.” The specific_coffees table lists the actual items the customer would\
    \ purchase, which is a combination of the coffee “category,” a size, ground or\
    \ whole beans, and caffeinated or decaffeinated. Each combination of these qualities\
    \ gets its own record in this table, and therefore its own SKU, price, and quantity\
    \ in stock. This allows the customer to purchase a pound of ground Kona coffee\
    \ or two pounds of decaffeinated whole beans. The available sizes come from the\
    \ sizes table.\n\nThe sixth table pertaining to products is sales. A sale is defined\
    \ by overriding the price of an item. The easy way to do this would be to change\
    \ the price in one of the products tables, but then you wouldn’t have any indication\
    \ that the new price is a sale price, as opposed to just the new default price.\
    \ The sales table has a price column, plus start- and end-date columns, with the\
    \ end date allowed to be NULL, indicating an open-ended sale. To associate the\
    \ price override with a specific product, the product’s type and ID numbers are\
    \ stored. If the product_type is coffee, the product_id will be the id value from\
    \ the specific_coffees table. If the product_type is other, the product_id will\
    \ be the id value from the non_coffee_products table.\n\n# # Customer Tables\n\
    \nFour customer-related tables will represent an individual order, starting with\
    \ customers, which stores the customer’s name, mailing address, email address,\
    \ and phone number (Figure 7.4).\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_183_0.png)\n\
    \nFigure 7.4\n\nThe orders table will store individual, completed orders. It stores\
    \ a foreign key to the customers table, the total of the order, the cost of shipping,\
    \ the date and time the order was entered, and part of the customer’s credit card\
    \ number.\n\n> note\n> \n> Figure 7.4 loosely reflects the relationships between\
    \ the product-related tables—sales, specific_coffees, and non_coffee_products\
    \ tables—and the order-related tables: order_contents, carts, and wish_lists.\n\
    \n> note\n> \n> Because no customer registration is required, or allowed, the\
    \ same customer may be repeated multiple times in the customers table."
