- pgno: 217
  md: "Figure 8.8 shows the output for the query, running it twice to see the variety\
    \ of results (although with only six sale items in the database, the differences\
    \ are not that pronounced).\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_217_0.png)\n\
    \n# Figure 8.8\n\nThis UNION contains the same two SELECT queries as are used\
    \ to find every sale item, with the addition of ORDER BY RAND() LIMIT 2. This\
    \ query will be used on the home page, where only a couple of sale products can\
    \ be advertised. For that reason, each SELECT query returns up to two randomly\
    \ selected items: two random non-coffee products and two random coffee products.\
    \ Because the ORDER BY and LIMIT clauses can confuse the UNION statement, both\
    \ SELECT statements are individually wrapped in parentheses, making the general\
    \ structure: (SELECT...) UNION (SELECT...).\n\n> **tip**\n> To sort the entire\
    \ result set, use this structure: `(SELECT... UNION SELECT...) ORDER BY...`\n\n\
    # Creating Stored Procedures\n\nThis project will primarily use stored procedures,\
    \ at least on the public side of the site. For the functionality being developed\
    \ in this chapter, three stored procedures are required, each of which runs one\
    \ of two SELECT queries. You can create stored procedures using most MySQL interfaces,\
    \ although you must be connecting to the database as a MySQL user with CREATE\
    \ ROUTINES permissions.\n\n+   1. Create the `select_categories()` procedure:\n\
    \n```\nDELIMITER $$\nCREATE PROCEDURE select_categories (type VARCHAR(6))\nBEGIN\n\
    \  IF type = 'coffee' THEN\n    SELECT * FROM general_coffees ORDER by category;\n\
    \  ELSEIF type = 'other' THEN\n(continues on next page)\n```\n\n> **note**\n>\
    \ A common problem with stored procedures is trying to create them as a MySQL\
    \ user that lacks permission to create stored routines.\n\n> **tip**\n> Procedure\
    \ names are case-insensitive and can be up to 64 characters long."
  merge: -1
  img_proc: true
- pgno: 218
  md: "**tip**\n\nI've included indentations in the procedures here for improved legibility,\
    \ but you may need to remove the indents when pasting these commands into the\
    \ mysql client.\n\n**note**\n\nBecause this is a MySQL stored procedure, not PHP\
    \ code, the syntax for the conditional itself and the equality condition (note\
    \ the single equals sign, not a double) differs slightly.\n\n**note**\n\nYour\
    \ stored procedure arguments should not have the same name as any column or table\
    \ in the database, or as any MySQL keyword.\n\n**note**\n\nTo improve legibility,\
    \ I've not used the backticks around table and column names in the stored procedure\
    \ queries, but you may prefer to use them.\n\n```\nSELECT * FROM non_coffee_categories\
    \ ORDER by category;\nEND IF;\nEND$$\nDELIMITER ;\n```\n\nThe first line changes\
    \ the delimiter from the default semicolon to something else so that the semicolons\
    \ within the procedure don't cause problems. The procedure itself is named select_categories(),\
    \ which is a clear indication of what the procedure does.\n\nThe procedure takes\
    \ one argument, named type, and of MySQL data type VARCHAR(6). The procedure executes\
    \ one of two possible SELECT queries, depending upon the value of type. An IF-ELSE\
    \ IF conditional accomplishes this.\n\nThe last line reverts the delimiter back\
    \ to the default semicolon. If you're going to be creating multiple procedures\
    \ at once, as in these steps, you only have to change the delimiter before the\
    \ first definition and change it back after the last, but I'm changing it with\
