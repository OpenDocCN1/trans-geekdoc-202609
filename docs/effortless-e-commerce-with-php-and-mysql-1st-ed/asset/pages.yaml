  md: "+   16. If no errors occurred, add the user to the database:\n\n```\nif (empty($shipping_errors))\
    \ {\n    $r = mysqli_query($dbc, \"CALL add_customer('$e', '$fn', '$ln', '$a1',\n\
    \    => '$a2', '$c', '$s', $z, $p, @cid)\");\n}\n```\n\nTo add the customer to\
    \ the database, the add_customer() stored procedure is invoked. The first nine\
    \ arguments are the PHP variables assigned during the validation process. The\
    \ tenth is a MySQL user-defined variable. This will match up with the outbound\
    \ parameter in the stored procedure, to be further explained in the next step.\n\
    \n+   17. If the procedure worked, retrieve the customer ID:\n\n```\nif ($r) {\n\
    \    $r = mysqli_query($dbc, 'SELECT @cid');\n    if (mysqli_num_rows($r) == 1)\
    \ {\n        list($_SESSION['customer_id']) = mysqli_fetch_array($r);\n    }\n\
    ```\n\nTo get the customer ID generated by the stored procedure, a second query\
    \ must select @cid. This query is run, then the results of the query are fetched\
    \ into $_SESSION['customer_id']. If you find this concept to be confusing, it\
    \ may help to think about this in MySQL terms, as if the procedure were being\
    \ called from the command-line mysql client (Figure 10.9), not a PHP script...\n\
    \n![](img/4f47e47c67bd619ac73250f11c9fc7ce_288_0.png)\n\nFigure 10.9\n\nThe first\
    \ query itself is a call to a MySQL stored procedure. When the query is executed,\
    \ a reference to a user-defined variable —@cid— is created. This is a variable\
    \ that exists within MySQL, but outside of the stored procedure (variables in\
    \ MySQL outside of stored procedures begin with @). Within the stored procedure,\
    \ a value is assigned to the internal variable cid, as explained earlier in the\
    \ chapter. This variable is associated with @cid, thanks to the procedure call\
    \ and the outbound argument. When the procedure call is complete, @cid still exists\
    \ (because it's outside of the procedure), but will now have a value. But @cid\
    \ only exists within the MySQL world; to get it to a PHP script, it must be selected\
    \ and fetched."
