    # ACTIVATING ACCOUNTS


    On a site that doesn''t require payment, I would normally include an activation
    process:


    +   1. When the user registers, a random code is stored in the users table.

    +   2. An email is sent to the registered email address, which includes a link
    to an activation page on the site. The link passes the user''s email address and
    the specific code to the PHP page: https://www.example.com/activate. php?x=email@example.com&y=CODE

    +   3. The PHP page confirms that there is a record in the table with that combination
    of email address and code, then activates that account (normally by setting the
    code column to NULL).

    +   4. When the user logs in, the query must confirm that the email and password
    combination is correct, and that the code column in the table has a NULL value.


    This is called a “closed-loop” confirmation process and prevents fake registrations.
    In this Knowledge is Power site, using PayPal will prevent fake registrations,
    because hackers don''t normally spend money in their hack attempts.'
