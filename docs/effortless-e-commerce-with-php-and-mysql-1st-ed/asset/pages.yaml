    # # SERVER ORGANIZATION


    Before creating any HTML documents or PHP scripts, let''s look at how the server
    should be organized. Unless your site is quite large (that is, it has so many
    separate files that creating subdirectories is appropriate), you''ll normally
    place all the pages of the site within the Web root directory, which will be the
    case with this example. The Web root directory should also have folders for:


    +   - Administration files

    +   - Media

    +   - CSS

    +   - PHP includes

    +   - Images

    +   - JavaScript'
