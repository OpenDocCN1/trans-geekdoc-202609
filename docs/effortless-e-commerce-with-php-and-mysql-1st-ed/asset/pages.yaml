    # Populating the Tables Using SQL


    You can populate any database table via any interface to the MySQL database, the
    two most common being the Web-based phpMyAdmin and the command-line mysql client.
    With phpMyAdmin, which is what your Web host likely provides (perhaps indirectly
    through another control panel), you can use the SQL tab or the SQL query window
    (Figure 8.1) to enter SQL commands.


    > phpMyAdmin also provides an insert option that presents forms through which
    you can add multiple records to a table.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_209_0.png)


    Figure 8.1


    With the command-line mysql client, you first need to access the server via a
    command-line interface (even if that''s your own computer). How you do this will
    depend upon the operating system you''re using:


    +   - On Windows, click Start, and then Run. Enter cmd in the Run prompt and click
    OK.

    +   - On Mac OS X, open the /Applications/Utilities/Terminal program.

    +   - Most versions of Linux also have a Terminal application.


    Once you''re in the command-line environment, you can access the database using:


    ```

    mysql -u username -p ecommerce2

    ```


    > You can also use your computer''s command-line interface to access your server
    via the command-line using ssh.


    Provide a real username and, at the prompt, enter that user''s password. This
    command, should it work (that is, should the username and password be correct),
    will also select the ecommerce2 database automatically. Change that part of the
    command if your database is named differently.


    If you''re using an all-in-one installer, such as XAMPP (www.apachefriends.org)
    or MAMP (www.mamp.info), you''ll need to specify the full path to that version
    of the mysql client (Figure 8.2 on the next page):


    ```

    /Applications/MAMP/Library/bin/mysql -u username -p ecommerce2

    ```'
