  md: 'The only thing to note in both files is the use of absolute references in all
    links, images, CSS, and JavaScript. Because the URLs for some of the pages will
    be /something/something, such as shop/coffee, the Web browser will get confused
    if you just use ./images or css/style.css. Instead, you''ll see /images and /css/style.css,
    where the initial slash says to begin at the Web root.


    I''ve also slightly modified the CSS file, which you can download from www.DMCInsights.com/ecom/.


    # NEWER MYSQL FEATURES


    For improved security and to separate some database activity from the PHP code,
    this project will use a couple of features that are relatively new to MySQL. Just
    as important, support for these features is also relatively new to PHP. I''m specifically
    speaking of prepared statements and stored procedures. In this chapter, I want
    to talk about the benefits of each feature as well as provide you with alternative
    approaches should you not meet the minimum requirements. That way, when you see
    the actual implementation of these features, you''ll be informed as to how you''ll
    need to change your code accordingly.


    The first thing you need to do, before reading any further, is confirm for certain
    what versions of PHP and MySQL you''ll be using. These values will also likely
    differ between your testing environment (perhaps your computer) and the live destination
    server. Prepared statements were added to MySQL in version 4.1, which was released
    in 2004, so every host should at least meet this requirement. Stored procedures
    were added in version 5, released in 2005.


    If you''re not running PHP 5 or greater with the MySQL Improved extension enabled,
    you''ll need to modify all the PHP-MySQL code in this book!


    Along with the proper version of MySQL, you''ll need the properly configured version
    of PHP. To use prepared statements and stored procedures from PHP, you''ll need
    at least PHP 5, with the MySQL Improved extension enabled (allowing you to use
    the mysqli_* functions). You can confirm the version of PHP you''re running and
    its support for the MySQL improved functions by running this code (as a PHP script)
    on your Web server (Figures 7.12 and 7.13):


    ```

    <?php phpinfo(); ?>

    ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_201_0.png)


    | Feature | Value |

    |---|---|

    | Client API library version | 5.1.27 |

    | Client API header version | 5.1.27 |

    | MYSQLI_SOCKET | /Applications/MAMP/tmp/mysql/mysql.sock |


    Once you''ve confirmed what versions you''re using, you can continue reading.
    If you have PHP 5+ and MySQL 5+, you should be fine. If you don''t, pay attention
    to what changes you''ll need to make in order to adapt the code to your situation.'
