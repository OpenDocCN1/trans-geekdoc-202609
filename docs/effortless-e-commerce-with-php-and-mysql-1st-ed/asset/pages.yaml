- pgno: 24
  md: "On the server-side of the equation, unlike in the client, you have a vast range\
    \ of Web technology to consider. This book uses PHP as the programming language\
    \ of choice and MySQL as the database application. These are my personal favorite\
    \ server-side technologies, and if you're reading this book, I assume you think\
    \ so as well. I'm going to forgo the sales pitch on PHP and MySQL, and move on.\
    \ If you aren't already well-versed in PHP and MySQL, you might have difficulty\
    \ with some of this book's code. Consider my PHP 6 and MySQL 5 for Dynamic Web\
    \ Sites: Visual QuickPro Guide, Third Edition (Peachpit Press, 978-0-321-52599-4)\
    \ to learn more about these technologies.\n\n> **note**\n> \n> After this chapter,\
    \ I'll stop recommending other books to buy, I promise!\n\n# # EASY E-COMMERCE\
    \ ALTERNATIVES\n\nIn this book, you'll learn how to write an e-commerce application\
    \ from scratch, using a combination of HTML, CSS, JavaScript, PHP, SQL, and MySQL.\
    \ There are, however, faster, less custom approaches you can use.\n\nIf you just\
    \ want to get an e-commerce site online quickly, or if you don't actually know\
    \ any of the listed technologies, you can use \"turnkey\" e-commerce sites that\
    \ Yahoo!, Google, and others provide. By answering some questions and using their\
    \ interface, you can create a basic e-commerce site in a day. It'll even be tied\
    \ automatically into a payment system. But make no mistake: Although you'll get\
    \ up and running in no time, the end result will be rather amateurish and very\
    \ limited.\n\nA middle-ground solution between using an entire third-party system\
    \ and creating your own custom package is to use an off-the-shelf e-commerce package,\
    \ such as ZenCart (www.zen-cart.com) or osCommerce (www.oscommerce.com). They\
    \ provide all the functionality, from creating a catalog or a shopping cart to\
    \ administration, which can then be tied to one of several payment systems. These\
    \ tools have been around for years, are quite solid, and well supported, but will\
    \ still have some limitations compared to writing your own e-commerce site, especially\
    \ when it's time to add features that will be uniquely yours. At the same time,\
    \ these packages will also be bogged down with lots of features that you might\
    \ not ever use.\n\n# # SELECTING A WEB HOST\n\nIn order to make your Web site\
    \ available for the public to access, it needs to be hosted on a server. A server\
    \ is just another computer whose hardware and software are oriented for network\
    \ use.\n\n> **tip**\n> \n> You will need to put your site on a hosted server in\
    \ order to test it with PayPal.\n\nIn theory, you may be able to use your personal\
    \ computer as a server, but you absolutely do not want to do this. First, doing\
    \ so may violate the terms of your Internet provider's service; ISPs are in the\
    \ business of providing you access to the Internet, not hosting Web sites. Second,\
    \ most ISPs change your IP address on a regular basis. Getting any domain name\
    \ to work with a dynamic IP address requires extra know-how and effort. Third,\
    \ even if you can overcome those first two hurdles, the resulting performance\
    \ for the end user will be"
  merge: -1
  img_proc: true
- pgno: 25
  md: 'terrible. The Internet access you have at home, no matter how fast, will likely
    have an upload speed that''s a fraction of the download speed. It''s this upload
    speed that''ll impact the end user, as they''ll be uploading the site''s content—HTML,
    CSS, JavaScript, and media—through that narrow connection.


    To be clear, you can *develop* the entire site using just your personal computer.
    You can install all the necessary tools—a Web server, PHP, and MySQL—on your own
    computer, then develop the database, write the code, test, and so on. Developing
    on your personal computer is faster (because you don''t have to upload files),
    cheaper (because you''re not paying for hosting during this time), and more secure
    (because incomplete, potentially insecure code won''t be online).


    > Do not attempt to host your Web site from your home!


    # Hosting Options


    With regard to hosting, you can generally say that you get what you pay for, and
    I say that as a person who''s generally inclined to go the cheapest route whenever
    possible. I''ve used probably five or six hosts for my own Web sites and dealt
    with many others for clients. The old adage says that you have to spend money
    to make money and finding a cheap host is a bad way to go about making money.


    > Buy cheap beer if you must, but never purchase cheap Web hosting!


    Hosting plans vary based upon:


    +   - Price

    +   - Features

    +   - Performance

    +   - Amount of control


    The *price* is directly related to the quality of the other three attributes.
    If you spend more, you''ll get more.


    To be honest, the *features* don''t really matter. Well, some do and many don''t.
    Most hosting plans will offer around 56 features, of which you''ll need 10. This
    even goes for disk space and bandwidth limitations: Hosting plans will offer you
    more of these than you''ll ever need, thereby tempting you with trivialities.
    The minimally required features are PHP, MySQL, a mail server (to send and receive
    email), and security software, such as a firewall, a virus detector, and so forth.
    Additionally, beneficial features include regular backups and excellent—truly
    excellent—customer support. When it comes time to compare one hosting option to
    another, decide what really counts—like uptime, backups, security, and customer
    service—and ignore the rest.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The performance of a server will depend upon the type of hosting involved,
    the server''s specific hardware—amount of RAM, disk types, processor types, the
    number of processors, and the server''s network connection. As I say in the beginning
    of this chapter, the site''s performance is hugely important, but it''s unfortunately
    something that''s not easily determined in advance.


    The amount of control you have over the server will depend upon the hosting type.
    Different Web-hosting companies offer different plans, but the basic hosting options
    are:


    +   - Free

    +   - Shared

    +   - Virtual Private Server (VPS)

    +   - Dedicated or colocation (colo)


    tip

    You''ll eventually come to regret using free or very cheap hosting plans for your
    Web site, so save yourself that headache!


    Free hosting plans are harder to come by now than they used to be, but you shouldn''t
    even consider them for an e-commerce site. You may have a free site possibility
    with your .Mac account or from your ISP, but you probably can''t even use your
    domain name on them.


    Shared hosting plans are the most common and the cheapest (of the paid choices).
    Shared hosting involves putting tens of clients and possibly hundreds of Web sites
    on a single server. Shared hosting is inexpensive—decent plans range from $10
    to $20 (all prices in the book will be in U.S. dollars) per month and may be a
    reasonable way to start. However, because there are multiple users on each server,
    your Web site will only be as secure as the weakest security link in any site
    on the server. The performance of the site will also suffer, as the demands are
    so high. Finally, you''ll have little to no control over how the server runs.
    You won''t be able to use a particular version of PHP, enable certain PHP settings
    or features, or tweak how MySQL runs. Shared hosts are not likely to make any
    changes that might adversely impact the other clients on the same server. Still,
    shared hosting may be appropriate for smaller, less demanding sites without higher
    security concerns.


    A happy medium between shared hosting and dedicated is the Virtual Private Server
    (it''s what I''ve personally used for a couple of years). Instead of having tens
    of clients on a single server, there may be only a couple or a handful, each running
    their own virtual operating system. Although all the server''s hardware is still
    being shared, limitations can be placed so that you''ll always get a minimum amount
    of RAM, thereby guaranteeing some performance no matter what happens to the other
    sites on the server. From a security perspective,'
  merge: -1
  img_proc: true
- pgno: 27
  md: "each virtual server is a separate entity, so what some other client does with\
    \ their VPS cannot impact yours. And since the VPS is yours alone, you can do\
    \ whatever you want with it in terms of installing and configuring software. VPS\
    \ hosting plans run from as cheap as $30 per month to around $100 per month.\n\
    \nA dedicated or colocated server is on the other end of the hosting spectrum.\
    \ This kind of hosting puts an entire computer—its software and hardware— under\
    \ your command, but the server is physically housed at the hosting company's location.\
    \ That location, unlike your home, should have multiple, fast connections to the\
    \ Internet, redundant power supplies with battery backups, secure physical access\
    \ to the server rooms, climate control, and so on. (The technical difference between\
    \ dedicated and colocated hosting is that the host typically owns a dedicated\
    \ server whereas you typically own a colocated one.)\n\n> **tip**\n> \n> When\
    \ using dedicated or colocated hosting, make sure that the Web host will still\
    \ provide some maintenance and security assistance.\n\nThe other hosting types\
    \ cannot match the amount of control, the number of features, or possibly the\
    \ performance of running your own entire server. But the cost of a dedicated or\
    \ colocated server will be much, much higher—from a couple of hundred dollars\
    \ per month to several hundred. Just as important is the fact that, depending\
    \ upon the particulars of the hosting plan, you may be responsible for all the\
    \ maintenance and security of the server. So you'll need to decide if you think\
    \ you're better suited to handle server security than someone who does that full\
    \ time and has likely been doing it for years. Also, the Web-hosting company will\
    \ have people monitoring your server 24 hours per day, whereas you've got to sleep\
    \ sometime.\n\n# # CLOUD COMPUTING\n\nThere is another hosting option that's come\
    \ up in the past couple of years: cloud hosting. Cloud computing sounds ethereal,\
    \ but it's just moving some server functionality— processing of data, storing\
    \ of data, handling emails, or whatever—to a different computer (or bank of computers),\
    \ not under your control and on a different network. One benefit to cloud computing\
    \ is that it can automatically scale to your needs without you needing to take\
    \ extra steps. If, for some freak, benevolent reason, you go from processing an\
    \ average of 100 sales per day to 10,000, the cloud will be able to handle the\
    \ increased traffic, which might otherwise have crashed a basic hosting plan.\
    \ But there are extra security concerns with cloud computing, and you'd need\n\
    \nto be prepared to pay the price. For example, if your site gets hit with a Denial\
    \ of Service (DOS) attack (discussed in Chapter 2, “Security Fundamentals,”) you'll\
    \ have to foot the bill for the extra cloud computing, but the attack itself will\
    \ have generated no extra revenue.\n\nThis book does not discuss cloud computing\
    \ beyond what I've just said, as cloud hosting is appropriate for a comparatively\
    \ small percentage of the market, and the technical particulars will depend upon\
    \ whose cloud service you're using. But be aware of this potential avenue. You\
    \ might want to look into vendors and pricing if you suspect that cloud computing\
    \ could be a good fit for your site and situation."
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # My Hosting Recommendation


    As a reader, you’re probably looking for as many definitive answers as possible,
    so my recommendation is to select a quality shared or VPS hosting plan to begin,
    depending upon the project itself and your budget. You absolutely don’t want to
    host the site on your personal computer; you absolutely don’t want to use free
    hosting; and you most likely shouldn’t go with dedicated hosting to start, unless
    you have money to burn. One important thing to know is that you’re not permanently
    locked into a given hosting plan or even a Web host. A good Web host should be
    able to upgrade or expand your hosting plan with little or no downtime. So start
    with a plan that’s reasonably basic, and, should you have the good fortune of
    profound success, you can scale up your plan to meet the increased demands over
    time.


    It’s possible to change Web hosts, as well, just not as easy. It’s best to start
    with a great host that you’ll be able to stick with for years and years. This
    means not only someone reliable, but also a host that’s established in such a
    way to allow for your site’s expansion. For example, a really cheap host probably
    does only shared hosting. You would never be able to move to a dedicated server
    with them, and you probably wouldn’t want to. Conversely, the hosting company
    I use only provides VPS and dedicated hosting plans. The VPS works for me for
    now, and I can move to one or more dedicated servers with this same company when
    I have that need.


    **note**


    I found all the lousy Web hosts that I''ve used over the years by listening to
    “official” rankings of the best Web hosts!


    # # Finding a Good Host


    The final question, then, is how do you know if a Web host is good? First, go
    online and search using terms like _web host review_ or _best web host_. In the
    search results, ignore every site whose sole purpose is to rate and review Web
    hosts. Yes, that’s right: ignore those. They’re unreliable, built upon advertising,
    and you’ll never know what kind of relationship they may have with the companies
    they’re “ranking.” Plus, in my experience, such sites are ranking Web hosts for
    the masses, for those that don’t know any better. If you want to find a couple
    of recommendations this way, mostly as a basis of comparison, that’s fine, but
    these rankings should not be used to make a decision.


    The best way to find a good host is to get real-world feedback and comments from
    real people. One way to do so is by finding forums where people talk about their
    hosting experiences. In the past, I’ve also emailed people to ask them if they’re
    happy with their host. You can also get recommendations through mailing lists
    and the like. If you want, you can ask for my recommendation, or ask in my support
    forums (www.dmcinsights.com/phorum/) to see what experiences other readers have
    had. You’ll note that I haven’t mentioned'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'who my host is, despite the fact that I’m quite pleased with them. I don’t
    feel comfortable naming my Web host in this book, but you can find their name
    in my forums, newsletters, and blog.


    Once you’ve got a few potential candidates, start by excluding those that are
    really cheap. You don’t want to try to save money by skimping on Web hosting.
    It’s not a good long-term plan. There are certainly cheaper hosting options than
    the one I’ve been using for a couple of years; but my site is always available;
    I’ve got peace of mind; and you can’t put a price on that. Interestingly, my current
    host doesn’t even offer a free month of hosting, as many companies do. Their argument,
    which I buy into, is that providing a free month invites malicious people to temporarily
    get a server just to send spam or do other harmful or annoying activities. You
    don’t want to be part of a network where that’s happening.


    You should also rule out those companies that try to do too much: better to have
    a host that excels at one or two things than one that is average at several. One
    of the worst hosting experiences I ever had, if not the worst, was with a company
    whose primary function was as a domain registrar. They were fine as registrars
    but terrible as hosts.


    As I already said, all Web hosts will offer tons of features and more disk space,
    bandwidth, and add-ons than you’ll ever need. And it’s almost impossible to compare
    performance from one host to the next. For me, then, I look at security and customer
    service. Great security minimizes the chances of a problem and great customer
    service provides a quick fix should a problem arise.


    # # USING A PAYMENT SYSTEM


    As with your choice of a Web-hosting company, the payment system you use for your
    e-commerce site will have a significant impact on the end result. This is not
    to say that the site will be married to a single payment system for eternity,
    but as with any divorce, ending a relationship with a payment system can be tedious
    and costly for your business.


    The payment system is the differentiating element between a standard Web site
    and an e-commerce one. The whole point of a payment system is to transfer money
    between the customers and the business.


    There are two broad types of payment systems, which are frequently known by a
    variety of names but can be described as either a payment processor or a payment
    gateway. In this book, I’ll demonstrate an example of each type, but here, I’ll
    outline the pros and cons of each.


    > **note**

    > Some companies, like PayPal, offer both types of payment systems.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Payment Processors


    A payment processor is a delayed payment system that normally goes through a third-party
    site (Figure 1.1). The best example is the Website Payments Standard option at
    PayPal (www.paypal.com). If you want to accept payment through PayPal using their
    basic service, you''ll send the customer to PayPal''s site along with your PayPal
    identification and some other information. The customer then uses PayPal to authorize
    the transfer of that amount of money. After which, PayPal returns the customer
    to your site, and at some later point in time PayPal will make the funds available
    to you, minus their fees.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_30_0.png)


    Figure 1.1


    Using a payment processor like PayPal''s Website Payments Standard or Google''s
    Checkout is easy to establish, has low up-front costs, and uses a service that
    many customers will be familiar with (especially PayPal). On the other hand, these
    systems aren''t as integrated into your site as the alternatives, and sending
    customers away from your site is a risky e-commerce move, increasing the odds
    of losing the sale. Also, the per-transaction costs tend to be a bit higher, and
    deposits may not be automatically made into your business''s bank account (that
    is, you may need to go into the payment processor''s system in order to accept
    and then transfer your credits).


    In previewing this book with potential readers, many agreed with me that PayPal
    is a common enough option that it''s worth using in an example in this book. Surprisingly,
    several others expressed a strong dislike for PayPal, both as a customer and as
    a developer. I''ve no objection to PayPal, and as I said, it''s highly universal,
    so the first e-commerce example in this book, Knowledge Is Power, will use it.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# # Payment Gateways


    A _payment gateway_ is a real-time payment system that can be directly integrated
    into your own site, resulting in a process that’s more professional and seamless.
    Instead of sending the user away, in the hopes they come back, transaction data
    will be transmitted behind the scenes and the customer won’t leave your site at
    any point in the entire process (Figure 1.2). Also, a gateway will offer much
    better fraud prevention, among other extra features (more on fraud protection
    in the next section). The gateway will deposit your monies into a merchant account
    automatically, normally charging less per transaction than payment processors
    do.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_31_0.png)


    Figure 1.2


    On the other side of the equation, a payment gateway may have higher setup costs
    and will require more programming to integrate the system into your site. They
    also require a merchant account, which is an account into which credit card charges
    can be deposited and refunded (for customer returns). You may or may not be able
    to use your business bank as your merchant account, depending upon your bank.


    There are tons of payment gateways available; some gateway systems are actually
    resold through other vendors, giving you the ability to shop around for the best
    deal. Authorize.net (www.authorize.net) is perhaps the best-known payment gateway,
    and it will be used in the book’s second example, Coffee.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Which Should You Use?


    The short answer is that a payment gateway is more professional and ought to be
    your solution for all but the simplest e-commerce sites. But payment processors
    are quite commonly used and do make sense for some businesses, so don’t dismiss
    them as an option entirely.


    Payment systems will provide test accounts, dummy credit card numbers, and false
    processing systems through which you can test your site before going live.


    When selecting among payment providers, you should first determine if your business
    bank or Web-hosting company has an arrangement with any companies. By choosing
    a pre-approved vendor for this important service, you’ll minimize some of the
    potential headaches and hopefully have an expert to turn to when you need technical
    support.


    Make sure your payment solution provider is in full PCI compliance and can assist
    in guiding your site’s compliance, too.


    Another factor is geography: Different providers will work in your part of the
    world and will be limited as to what other regions they support. Also, you’ll
    want to check that the currency the provider uses gels with your business.


    There are many features to weigh when making your selection:


    +   - Tools for fraud prevention

    +   - Ability to perform recurring billing

    +   - Acceptance of eChecks

    +   - Automatic tax calculation

    +   - Automatic shipping calculation and processing

    +   - Digital content handling

    +   - Integrated shopping cart


    Some gateways offer virtual terminals where the merchant can process credit card
    payments manually. These can be used to issue returns, for example.


    Clearly, many of these features can greatly simplify the development of your e-commerce
    site and result in a more professional Web application, but I would like to highlight
    fraud prevention. You may not have given much thought to the subject, but excellent
    fraud prevention is in the best long-term interest of your site. If someone can
    use a credit card at your site that isn’t valid or isn’t theirs, you’ll have a
    false sale and later have some cleanup to perform to undo the transaction. Further,
    the person whose credit card was fraudulently used will think poorly of your business
    for allowing the fraud in the first place. For these reasons, using a gateway
    with sophisticated fraud-prevention tools is a must. The two most common techniques
    are to verify the billing address and the Card Verification Value (CVV)—those
    numbers on the back of the card.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'A final, obvious factor that was not listed earlier is cost. You''ll need to
    consider the initial setup costs, the monthly fees, plus the individual transaction
    expenses. If you require features that come at an extra cost, factor those in,
    too.


    > If the price of your transactions will be small, like less than $10 on average,
    find a payment provider that supports micro-payments, which means smaller transaction
    fees.


    # THE DEVELOPMENT PROCESS


    After you''ve finalized your business plan, researched the laws, decided upon
    a hosting company, and selected a payment system, it''s time to start putting
    down HTML tags, SQL commands, and if/then statements. The development process
    itself is really the point of this book, so let''s take a look at that in detail
    (Figure 1.3).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_33_0.png)


    Figure 1.3


    The development process occurs in phases. If each phase is approached deliberately
    and the end results are properly generated, you''ll develop a great e-commerce
    site as efficiently as possible. If, on the other hand, you jump around, rush
    the process, skip steps, and make omissions, the whole procedure will take much
    longer, and the end result will be buggier.


    At the end of the development process, you''ll hopefully have created the best
    possible e-commerce site, but that site will undoubtedly need to be changed next
    week (as clients always want), next month, or next year. If the first goal is
    a smooth, optimal process, then the second is output—specifically PHP code and
    a MySQL database—that is flexible and scalable. When those inevitable changes
    need to be made, you should be able to do so without breaking or rewriting the
    entire system.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'tip

    As a model for how to do e-commerce well, you can''t do much better than examining
    Amazon.com.


    # Site Planning


    The first step in the development process is planning a generic site. This is
    much like establishing your business goals, but specifically with the site itself.
    What should the site do? What should it look like? Who are the target users? What
    browsers and/or devices should the site support? Use pen and paper, or any application
    in which you can make notes, and be as inclusive as you possibly can. It’ll be
    much better, further down the road, if you considered an idea and ruled it out
    than if you never thought of it in the first place.


    The best thing you can do at this point is look online. The Web is a rich tapestry
    of both the good and the bad, so look at the sites you like and use. What do they
    do well? What would you do differently? What fonts, colors, and designs appeal
    to you? There’s an old adage about writing: good writers plagiarize, great ones
    steal. That’s kind of true for the Web sites, too.


    tip

    The HTML design process will, rightfully, include a few iterations of feedback,
    followed by updated designs.


    # HTML Design


    The next thing you should do in the development process is mock up the HTML designs
    for the site. I, for one, have absolutely no design skills whatsoever. If you
    could say the same, there are two simple solutions:


    +   - Hire a qualified designer to create the HTML templates.

    +   - Use an off-the-shelf design that you tweak a bit.


    I’ve taken both approaches several times, which you use depends upon the site
    and your budget. If you’re hiring someone, at a minimum, you’ll want him or her
    to create a few templates:


    +   - The home page

    +   - An inner, basic content page

    +   - A styled form


    From these you can easily generate the looks of most of your site. If you’re developing
    an e-commerce site that sells products, you’ll also want representative browsing
    (that is, showing multiple products at once) and detailed listing pages.


    tip

    As I’m not a Web designer, I’ve relied upon freely available third-party templates
    for the two e-commerce sites in this book.


    If you don’t have the budget or time to purchase a custom design, you can take
    an existing one and modify it to your needs. There are both free and commercial
    designs available, although you’ll need to abide by the licensing where applicable.
    For example, some designs are free to use as long as you give credit to the designer
    in the footer. Other designs are free for noncommercial use but require licenses
    for commercial endeavors. In any case, you can take'
  merge: -1
  img_proc: true
- pgno: 35
  md: "the existing template and then adjust the HTML and CSS to personalize the design\
    \ for your or your client's tastes.\n\nThe goal at this point is to get the client\
    \ (or you) to sign off on the look of the site. Moreover, the design also implies\
    \ much of the functionality: getting approval of that is even more critical to\
    \ the process. Think about: How will the look and function of the site be different\
    \ if the user is logged in? How will navigation be handled? How are items added\
    \ to the cart? How will the cart contents be shown? Also pay attention to the\
    \ fundamentals of the user interface: simplicity, ease of use, proper navigation,\
    \ breadcrumbs, obvious access to the cart, and so on.\n\n> **tip**\n> \n> Your\
    \ site's design should include obvious links for contacting the administrator,\
    \ finding the site's return policy, and seeing the privacy policy.\n\n# Database\
    \ Design\n\nDesigning the database is a key step, largely because changes to the\
    \ database at a later date have far larger implications and potential complications\
    \ than changing any other aspect of the site. Adding functionality through database\
    \ changes is a steep challenge and fixing database flaws is excruciating, so make\
    \ every effort you can to get the database design right the first time.\n\nGood\
    \ database design begins, naturally, with normalizing the database. If you aren't\
    \ familiar with normalization, see any good resource on the subject, including\
    \ my MySQL: Visual QuickStart Guide, 2nd Edition (Peachpit Press, 0-321-37573-4).\
    \ Normalization and performance mean that you also:\n\n+   - Use the smallest\
    \ possible column types.\n+   - Avoid storing NULL values as much as possible.\n\
    +   - Use fixed-length columns when you can.\n+   - Provide default values for\
    \ columns, if applicable.\n\n> **note**\n> \n> This is absolutely the last reference\
    \ I make to another book, I promise. Unless I think of another....\n\nPerformance\
    \ is also greatly affected by using indexes properly. Declaring indexes is somewhat\
    \ of an art, but some general rules are:\n\n> **tip**\n> \n> The --log-slow-queries\
    \ option in MySQL can be used to help you catch detrimental queries.\n\n+   -\
    \ Index columns that will be involved in WHERE and ORDER BY clauses.\n+   - Avoid\
    \ indexing columns that allow NULL values.\n+   - Apply length restrictions to\
    \ indexes on variable-length columns, such as indexing only the first 10 characters\
    \ of a person's last name.\n+   - Use EXPLAIN queries to confirm that indexes\
    \ are being used.\n+   - Revisit your indexes after some period of site activity\
    \ to ensure they are still appropriate to the real-world data."
  merge: -1
  img_proc: true
- pgno: 36
  md: 'tip


    If MySQL is running with the --log-long-format feature enabled, the database will
    write to the log any queries that aren''t using indexes.


    A final consideration in your database design, which gets less attention, is the
    storage engine (or table type) in use. One of MySQL''s strengths is its support
    for multiple storage engines, meaning you can select the one whose features best
    match your needs. For example, you can create MySQL tables in memory, which will
    perform exceptionally well but provide no data permanence. The two most common
    MySQL storage engines are InnoDB and MyISAM. The former is the default type for
    Windows computers and the latter is the default for all other operating systems.
    MyISAM is an excellent, all-purpose storage engine that also supports FULLTEXT
    indexes, useful in searches. The InnoDB engine doesn''t support FULLTEXT but can
    handle transactions, an excellent fail-safe in sensitive situations.


    If you have administrative-level control over your database, there are a number
    of configurations that impact MySQL''s performance. To start, there is back_log,
    key_buffer_size, max_connections, and thread_cache_size. You can use a configuration
    file to change these settings from their defaults to values more appropriate to
    your server and site. See the MySQL manual for more information for the version
    of MySQL that your server is running—assuming that you have that kind of control
    over your server, of course.


    Should you get to a point where your site is so active that multiple servers are
    appropriate, you can consider replicating the database. Database replication stores
    the same data on more than one server. By doing so you''ll get improved security,
    reliability (should one server fail, the data still lives on elsewhere), and performance.


    # YOUR DEVELOPMENT TOOLS


    What software you use on your computer to develop an e-commerce site is such a
    big and personal topic that I don''t offer any recommendations on that front (at
    the very least because I primarily use a Mac and therefore couldn''t recommended
    any development programs on Windows). If you don''t already have a text editor
    or IDE that you like, again look online and get actual recommendations from people
    in order to select one. As with everything, your budget comes into play, although
    there are lots of excellent choices available at little to no cost.


    Along with the programming software, you should consider project management tools,
    such as applications for organizing projects and taking notes. You may also need
    to use some accounting software, depending upon whether the e-commerce site is
    yours or not.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# Programming\n\nThe primary focus of this book is really the PHP programming,\
    \ where PHP acts as the glue between the user/browser and, well, pretty much everything\
    \ else: the database, email, payment systems, and more. From a programming perspective,\
    \ you’ll want to create code that’s not only functional, but also reusable, extendable,\
    \ and secure.\n\nTo make reusable, extendable code, it must be well organized\
    \ and thoroughly documented. I cannot stress this enough: Document your code to\
    \ the point of overkill. As you program, begin with your comments and revisit\
    \ them frequently. When you make any changes to your code, double-check that the\
    \ comments remain accurate. You should also use flowcharts, UML diagrams (Unified\
    \ Modeling Language), and other tools to outline and represent your site in graphical\
    \ and noncode ways.\n\nThe security of your code is based upon so many factors\
    \ that the next chapter will start discussing just this one subject. Secure programming\
    \ is even more critical in e-commerce sites, however, so the topic will be reinforced\
    \ time and again throughout the entire book.\n\nDepending upon the circumstances,\
    \ you may also want to look into version-control software such as subversion (http://subversion.tigris.org)\
    \ or Git (http://git-scm.com). Version-control software makes site updates a smoother\
    \ process, allowing you to accurately implement all site changes or roll back\
    \ problems to previously sound states. If you’re developing a site with a team\
    \ of people, version control will help manage the shared files.\n\nWith PHP, unlike\
    \ with many other languages, you have a choice of using an object-oriented or\
    \ procedural approach. I’m perfectly comfortable doing either, and I don’t believe\
    \ one approach is clearly better than the next. I would advise against buying\
    \ into the myth that OOP is more extendable or secure than procedural code. Poorly\
    \ written OOP will cause you endless headaches and well-written procedural code\
    \ won’t hamper your site’s long-term development in any way.\n\nWhen asking for\
    \ reader input on this book, there was a moderately heated discussion as to which\
    \ approach I should use and to what extent. Some feel that OOP is the hallmark\
    \ of professional programming; others don’t know or care for it and wouldn’t get\
    \ much value out of an OOP-based book. In the end, I decided to use a mostly procedural\
    \ approach, as it’s the common denominator of all PHP programmers, and procedural\
    \ code can more easily be turned into OOP than vice versa.\n\n> **tip**\n> \n\
    > Formal PHP documentation can be achieved using PHPDoc (www.phpdoc.org).\n\n\
    > **note**\n> \n> Because this book is really one giant comment on entire sites\
    \ of PHP code, the scripts displayed in the book won’t be as documented as yours\
    \ should be.\n\n> **tip**\n> \n> MVC, short for Model, View, Controller, is a\
    \ popular approach to designing Web sites. At the core, this design just implies\
    \ good code organization."
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Similarly, there was some discussion as to whether I should incorporate a framework
    or not. Again, my heart is not set one way or the other on frameworks. Sometimes
    I use them, sometimes I don''t. In the end, I decided against using any framework
    in this book, because those chapters would inherently be more about the framework
    than the underlying example—an e-commerce site, the real focus of the book.


    All that being said, when it comes to your own projects, you''ll need to make
    the decision on procedural versus object-oriented, frameworks or not, and if using
    a framework, which one. Know upfront that these decisions will neither adversely
    affect nor guarantee the success of your e-commerce site. The only thing you don''t
    want to do is start off on one path only to later change courses. That''s a recipe
    for frustration and a likely guarantee of disaster.


    # Testing


    Testing your Web site isn''t a one-time, standalone step, but rather something
    you''ll need to do often. **You cannot test your site too much!** Unfortunately,
    it''s hard for the site developer to perform a truly good test of the site: He
    or she created it, so he or she knows how it should work and uses it accordingly.
    A better test is what happens when your family, coworkers, and annoying friends
    give the site a whirl. And I specify the *annoying friends*, because they''re
    the ones who will attempt to do things you never would have imagined. When these
    people, who aren''t Web developers themselves, purposefully or accidentally misuse
    the site, what happens? From these experiences you can improve the user interface
    and security of the whole application. Improving those two things will go a long
    way toward a successful e-commerce venture. Still, there are steps you can take
    to effectively test your site yourself.


    Relatively new to PHP is the concept of *test-driven development* and *unit testing*:
    You define concrete and atomic tests of your code, and then run the tests to confirm
    the results. Each test should be concise and clear. As you write more code, you
    define more tests and continue to check each test to ensure that what you just
    did didn''t break any other functionality. Test-driven development and unit testing
    are big enough subjects that I recommend you research both further on your own,
    when you''re ready.


    A different type of site testing you could address is *performance*. If you want
    to start with the big picture—how well the server copes with demand—software like
    ApacheBench (**http://httpd.apache.org**) and Siege (**www.joedog.org/index/siege-home**)
    will run benchmarks on your Web server, reporting on how many requests can be
    handled per second, which is the standard measuring tool for a site''s performance.
    Once you start checking'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'your site''s performance, you will find that big, systemwide changes you make
    will have the greatest impact. These include:


    +   - Changing the server hardware: increasing memory, installing faster hard
    drives, and using faster processors

    +   - Changing the demands on the server: disabling unnecessary features, putting
    fewer users or sites on a single server, and balancing loads across multiple servers

    +   - Caching the PHP output

    +   - Caching the PHP execution

    +   - Caching the database results


    If you think about the process involved for handling the request of a PHP-MySQL
    based page, you''ll see three areas where caching can be applied (Figure 1.4).
    First, if the database or PHP is caching the results of a database query, then
    that query will not need to be executed with each request. Second, by default,
    each request of a PHP script requires that the PHP code be executed as if it had
    never been run before. By applying an opcode cache such as the Alternative PHP
    Cache (APC, www.php.net/apc), the PHP code itself is cached by the system, making
    that execution faster. Finally, the end result is that HTML is sent to the Web
    browser. If you can cache the dynamically generated HTML, then no PHP code will
    be executed at all, no database queries are required, and the request itself becomes
    as fast as a request for a static HTML page.


    > tip

    > Look online for specifics on implementing any of these caching techniques.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_39_0.png)


    Figure 1.4'
  merge: -1
  img_proc: true
- pgno: 40
  md: '**note**


    Performance testing and profiling are most useful in actual conditions. Testing
    the performance of your site under nonproduction situations is only theoretically
    meaningful.


    You can also spend some time profiling your code, using tools like Xdebug (www.xdebug.org)
    or the Advanced PHP Debugger (APD, www.php.net/apd) to see where potential bottlenecks
    are in the PHP itself. Bottlenecks usually occur when PHP interacts with the file
    system, whether that means literal files on the server (like reading and writing
    text files or using sessions) or through the database application. I caution you
    against spending too much time worrying about profiling individual sections of
    code, because the improvements you can make that way will be relatively minor
    and possibly not worth your time. Better to learn good programming habits so that
    you don''t have to worry about profiling after the fact.


    **tip**


    Once your site is live, don''t forget to submit it to all the top search engines.


    # Going Live


    Once a site has been completely developed, tested, then updated to include the
    latest bug fixes and customer requests, it’s time to go live. Before doing so,
    you should revisit all the legal and security issues to make sure the site is
    in full compliance. Second, have a plan in place for what should be done when
    something goes wrong (notice I said *when*, not *if*). Third, if any assumptions
    were made in the code, or any dummy processes installed, remove those. By “assumptions,”
    I mean things such as using the test version of the payment system, not requiring
    real authentication to the administration pages, and so forth.


    Brick and mortar stores normally have what’s called a *soft opening*. During this
    period the business is open and fully functioning, but not promoting itself actively.
    The hope is that the arrival of some traffic will catch issues and allow for improvements,
    without attempting to do so under the burden of a full user base. This is something
    you may want to consider as well, although in truth, pretty much every Web site
    that doesn’t have millions of dollars of advertising behind it has a soft opening.


    **tip**


    For security purposes, safely store your backups, such as in a locked safe or
    a bank deposit box.


    # Maintaining


    Depending upon the situation, going live may or may not be the end of your involvement
    with the project. If it’s not, such as when it’s your site, you’ll need to have
    a plan in place for maintaining the project. Site maintenance begins and ends
    with creating good, frequent backups of your site’s data. This is something the
    hosting company should be doing for you (check when you are researching hosts)
    and something you should be doing as well. Make sure that there are backups kept
    in multiple locations, too, so that a natural or man-made disaster doesn’t wipe
    out both your server and your backups.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The maintenance of a site also requires that you keep an eye on the data itself.
    Check and optimize your database tables to improve their performance. Watch your
    database logs for slow and underperforming queries. Review your Webserver logs
    for file not found errors, high loads, and potential security problems. Analyze
    your data to find sales trends and places where you can make improvements. In
    short, collect and examine as much information as you can. And keep making backups!


    > The actual running of the site—dealing with customers, handling inventory, processing
    orders, reviewing customer feedback, and so on—is a whole separate way that a
    site has to be maintained.


    # Improving


    The final step in the development process is improving what you''ve created. Improvements
    may stem from the client, from customer feedback, or changes in available technologies.
    Improving a site is really a subroutine of this entire development process: Think
    about what you want to change, plan its implementation, mock up the design, retool
    the database, write the code, test the end result, go live, and maintain the updated
    version of the site.


    Although it''s best to treat the development process as a linear progression of
    discrete steps, when you factor in repeated places for feedback, and the high
    potential for the process to be revisited for improvements, the real design process
    is best represented by Figure 1.5.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_41_0.png)


    Figure 1.5'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/4f47e47c67bd619ac73250f11c9fc7ce_42_0.png)


    # # 2 SECURITY FUNDAMENTALS


    Although every chapter in the rest of the book will have some recommendations
    for improving the security of your Web site, security is such an important subject
    that this chapter focuses on it alone. There are three broad topics:


    +   - Exploring general theory and background information

    +   - Creating a secure environment

    +   - Recognizing and combating common vulnerabilities


    Some of the topics discussed here will be implemented in real-world code in subsequent
    chapters. A few of the other recommendations are steps to implement a single time.
    And a handful of tips will only apply if you have administrative-level influence
    over the server. Still, it''s only by grasping the whole picture that you can
    implement security on a high level.


    # ## SECURITY THEORY


    Before getting into actual security specifics, let''s think about what it means
    to be secure. I want to start with two simple, but perhaps heretical, ideas:


    +   - No Web site is secure.

    +   - Maximum security isn''t the goal.


    These two statements probably sound so absurd that I''ve lost all credibility,
    but in no way am I saying that security isn''t important. In fact, when it comes
    to e-commerce sites, security is the most important criteria. I''m just saying'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'that you may need to think about security differently than you currently do.

    I''ll explain...


    # # No Web Site Is Secure


    The first fact you have to accept about any type of security is that security

    is not a binary thing: where a site, application, or computer is either secure

    or not. Security is measured on a spectrum (Figure 2.1). The code, software,

    environment, people involved, and other factors move the security rating up

    and down that scale. No matter what you know or do, you''ll never create a Web

    site that''s *absolutely secure*; the only thing you can do is attempt to make
    it

    *more secure*.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_43_0.png)


    I''ve had people—well, one person—say this approach is wrong and danger-

    ous, but I think quite the contrary is true: When you begin to believe that your

    site is absolutely secure, that''s when it''s the most vulnerable because you''ve

    let your guard down. What you really should be doing is taking steps so that

    your site is *secure enough*.


    > Accepting that you cannot create absolute security doesn''t mean

    > you shouldn''t try but rather that

    > you should never stop trying.


    As an analogy, think about a car: If you drive somewhere, get out, but don''t

    lock the car, it still may be relatively secure, depending upon the time of day,

    the type of car, the area in which it''s parked, and the length of time you''ll

    leave it there. Just leaving a car unlocked does not mean it''s guaranteed to
    be

    broken into, just as locking it doesn''t mean it won''t be. It''s certainly harder
    to

    break into a locked car, but not impossible. If you leave the car in your garage,

    it''s much, much less likely to get broken into, until you leave the garage door

    open or someone breaks into the garage. And, of course, never taking a car out

    of the garage defeats the whole point of having a car.


    The same is true for a Web site: Doing X, Y, and Z will make it harder to break

    into, but not impossible because there''s always a potential flaw just around

    the corner. Even if the server isn''t turned on and is sitting in a locked hosting

    cage somewhere, there are people who work for that hosting company who

    can still access the machine. Simply put, there is nothing you can do to guaran-

    tee absolute security.


    I say that no Web site is secure for two reasons. First, to promote eternal

    vigilance when it comes to your site''s security. **Complacency is dangerous.**

    The second reason is...'
