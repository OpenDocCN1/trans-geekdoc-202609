  md: "+   8. Include the view files:\n\n```\nif (mysqli_num_rows($r) > 0) {\nif (isset($_SESSION['shipping_for_billing'])\
    \ &&\n($_SERVER['REQUEST_METHOD'] != 'POST')) {\n$Values = 'SESSION';\n} else\
    \ {\n$Values = 'POST';\n}\n}\ninclude ('./views/billing.html');\n} else { // Empty\
    \ cart!\ninclude ('./views/emptycart.html');\n}\n```\n\nYou've seen most of this\
    \ code several times over by now, the one difference being the conditional that\
    \ checks for the `$_SESSION['shipping_for_billing']` element. This conditional\
    \ is necessary because the HTML form in the view file could be prepopulated with\
    \ values in two situations.\n\nIn the first case, the customer selected the check\
    \ box (on `checkout.php`) to use their shipping information as their billing information.\
    \ If so, the values already stored in `$_SESSION` should be used for the form\
    \ elements.\n\nThe second situation in which there will be values to display in\
    \ the form is when the customer submitted the form but errors occurred. If so,\
    \ the values should come from `$_POST`. Note that even if the user opted to use\
    \ the same information for shipping and billing, once they've submitted the form,\
    \ only the posted values will count. This way, if the customer altered any of\
    \ the prepopulated values, the changes will be reflected when the form is redisplayed.\
    \ Still, if the customer did not alter the original session-based values, those\
    \ same values will be used again after any errors.\n\n+   9. Complete the page:\n\
    +   \n+   include ('./includes/footer.html');\n+   \n+   ?>\n\n+   10. Save the\
    \ file.\n\n# Creating the View File\n\nThe next step is to create the `billing.html`\
    \ view file. Like `checkout.html`, this script should include `checkout_cart.html`\
