- pgno: 400
  md: "# EMAILING RECEIPTS\n\nThe **final.php** script includes **email_receipt.php**,\
    \ whose role it is to email a receipt to the customer. Because a lot of information\
    \ could be in this receipt (itemizing multiple products), sending an HTML receipt\
    \ is a logical choice. Considering that some people like HTML email and others\
    \ don’t, the professional solution is to send an email that’s viewable in either\
    \ HTML (**Figure 10.18**) or plain text format (**Figure 10.19**). That’s what\
    \ **email_receipt.php** will do.\n\n> tip\n> \n> Authorize.net can send out confirmation\
    \ emails, too, but you cannot control the format as easily.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_400_0.png)\n\
    \n# Figure 10.18\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_400_1.png)\n\n# Figure\
    \ 10.19\n\nIn theory, you can create a multipart email (one that’s readable in\
    \ both formats) by just creating the proper body and headers that adhere to the\
    \ email standard. In my experience, that’s much, much easier said than done. A\
    \ better solution is to use a third-party library that will guarantee accurate\
    \ and reliable results. For **email_receipt.php**, let’s turn to the Zend Framework\
    \ (**http://framework.zend.com**).\n\n> tip\n> \n> You can also use the PEAR **Mail_Mime**\
    \ class to send out HTML email.\n\n# Installing the Zend Framework\n\nThe Zend\
    \ Framework is created and supported by key PHP developers and has a module for\
    \ just about anything you’ll want to do with PHP. The framework is thoroughly\
    \ documented and well established. One of the best features of the framework is\
    \ that you can use pieces of it as needed, without having to embrace or incorporate\
    \ the entire library. In other words, a site like this one can use just **Zend_Mail**\
    \ without the entire site being Zend Framework-based. To use the Zend Framework\
    \ on the site, you’ll need to grab a copy of it first.\n\n> tip\n> \n> If you\
    \ do a lot of PHP development, you ought to be familiar with the Zend Framework,\
    \ even if you don’t routinely use it.\n\n+   1. Go to **http://framework.zend.com**.\n\
    \n+   2. Click Downloads > Latest Release.\n\n+   3. On the Latest Release page,\
    \ download the *minimal* version."
