  md: "you can have an uploaded file but also an error). If both conditions are true,\
    \ the $file variable is turned into a shorthand version of $_FILES['pdf'], for\
    \ later use.\n\n# 9. Validate the file information:\n\n```\n```php\n$size = ROUND($file['size']/1024);\n\
    if ($size > 1024) {\n    $sadd_pdf_errors['pdf'] = 'The uploaded file was too\
    \ large.';\n}\nif (($file['type']! = 'application/pdf') & (substr($file['name'],\
    \ -4) != '.pdf')) {\n    $sadd_pdf_errors['pdf'] = 'The uploaded file was not\
    \ a PDF.';\n}\n```\n```\n\n> As written, only one error will be associated with\
    \ the file input, so if the uploaded file is both too large and not a PDF, the\
    \ user will see only the second error.\n\nFirst, the file's size is calculated\
    \ in kilobytes. This value will first be used to make sure the file isn't too\
    \ large. On the public side, this value will be displayed to the end user indicating\
    \ how big the PDF is (a nice feature). If the file is larger than a megabyte (or\
    \ 1,024 kilobytes), an error message is created. Since the MAX_FILE_SIZE hidden\
    \ form input is a recommendation that's easy to circumvent, it's best to check\
    \ the file's size using PHP, too.\n\n> A stricter way of validating a PDF's type\
    \ is to read in the file's binary data and make sure it matches the PDF specification.\n\
    \nNext, the file's type is validated. The first part of the conditional checks\
    \ if the type is not equal to application/pdf, which is the MIME type the browser\
    \ will associate with an uploaded PDF. But a MIME type is easy to fake, so you\
    \ can't rely upon just that. The second part of the conditional checks that the\
    \ file's name concludes with .pdf. Since any file's extension dictates how the\
    \ file is treated by computers, this is another good security check (although\
    \ not 100 percent foolproof).\n\nFrom a security perspective, by this point, reasonable\
