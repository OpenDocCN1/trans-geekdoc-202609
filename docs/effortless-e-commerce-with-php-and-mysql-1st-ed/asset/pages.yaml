    customer actions).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_399_0.png)


    Figure. 9.11


    Once this view is defined, the get_shopping_cart_contents() query would

    only need to do a SELECT on this one table, with a single condition: matching

    the user''s session ID:


    ```

    SELECT * FROM cart_views WHERE user_session_id=uid;

    ```


    VIEW tables were added to MySQL in version 5.0.'
