  md: '# # 10 CHECKING OUT


    The next step in the evolution of the *Coffee* site is to incorporate the payment
    processing system that will allow customers to complete their order. For this
    project, I’ve chosen Authorize.net as the payment processor. The first several
    pages of the chapter talk about Authorize.net and walk you through setting up
    a test account there. Once you have a test account, you can write the entire checkout
    process.


    There are four parts to the checkout process:


    +   1. Take and validate the shipping information.

    +   2. Take and validate the billing information.

    +   3. Process the payment.

    +   4. Wrap it up (send an email, create a receipt, and so on).


    This chapter probably has the most complicated code of any in the book. But this
    chapter also conveys the information that many readers need the most, so ample
    space is dedicated to explaining the code as thoroughly as possible.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# # ABOUT AUTHORIZE.NET\n\nAuthorize.net is perhaps the largest payment gateway\
    \ out there and was most certainly one of the first available for e-commerce.\
    \ How Authorize.net functions is different than PayPal, used in Chapter 6, “Using\
    \ PayPal.” PayPal fetches monies from customers’ credit cards (or PayPal accounts)\
    \ and deposits those amounts into _your PayPal account_ (which you can later move\
    \ to a bank account). By comparison, Authorize.net coordinates with several networked\
    \ systems to transfer funds from credit cards to _your merchant bank account_.\
    \ Authorize.net is an agent in the process, a true payment gateway, and when the\
    \ transaction is completed, the money will automatically be transferred to your\
    \ bank account. For this reason, you must have a merchant bank account (with an\
    \ actual bank) that supports the Authorize.net system.\n\nAuthorize.net accepts\
    \ all major credit cards and offers:\n\n+   - Advanced fraud detection\n+   -\
    \ PCI DSS compliance\n+   - Support for recurring payments\n+   - International\
    \ transactions\n+   - An online virtual terminal\n+   - Customer information management\n\
    +   - eCheck acceptance\n+   - Multiple administrators with different permissions\n\
    +   - Good documentation and support\n\nAuthorize.net provides what they call\
    \ the _Merchant Interface_, where you can configure your account, manage transactions,\
    \ view statements, generate reports, and so forth. This chapter will mention the\
    \ Merchant Interface a few times, but keep in mind that the Merchant Interface\
    \ is how a site administrator manages an Authorize.net account, it’s not how the\
    \ site itself communicates with the payment system.\n\nAs with PayPal and many\
    \ other payment systems, there are multiple ways you can use Authorize.net: _Simple\
    \ Checkout_, _Server Integration Method_ (SIM), and _Advanced Integration Method_\
    \ (AIM). When using the first two, the customer will be taken to the Authorize.net\
    \ Web site, similar to the PayPal example in Chapter 6. In this chapter, the Advanced\
    \ Integration Method will be demonstrated instead.\n\n> **tip**\n> \n> To test\
    \ Authorize.net, you don’t need an actual merchant account.\n\n> **tip**\n> \n\
    > Authorize.net has a Verified Merchant Seal image that you can display on your\
    \ Web site to imply your site’s credibility.\n\n> **tip**\n> \n> AIM is the Authorize.net\
    \ recommended system, but requires programming and Web security skills."
  merge: -1
  img_proc: true
- pgno: 268
  md: 'To communicate with the Authorize.net service using PHP, a POST request will
    need to be made over SSL. Instead of the customer sending a form of data to Authorize.net,
    PHP will do that behind the scenes. This requires using *libcurl*, the cURL library
    (**http://curl.haxx.se**). cURL, if you’re not familiar with it, is a command-line
    utility for performing network communications. The standalone application may
    already exist on your own computer and most likely on your server. libcurl is
    a cURL library that can be integrated into other software, such as PHP. If your
    version of PHP is installed with libcurl, scripts can use the curl_* functions
    to perform the communications. To confirm support for libcurl, run a phpinfo()
    script (Figure 10.1).


    | | curl |

    |---|---|

    | cURL support | enabled |

    | cURL Information | 7.20.0 |

    | Age | 3 |


    Figure 10.1


    **tip**

