- pgno: 56
  md: '> tip Fairly active sites may only require one Web server but multiple database
    servers, in which case the one certificate might suffice.


    You''ll also pay more to have a more flexible certificate. A valid certificate
    for a single domain is cheaper than one for all subdomains (www.example.com, shop.example.com,
    and admin.example.com); a single certificate valid for multiple domains (example.com
    and example.net) costs even more. Another consideration is the ability to use
    the same certificate on multiple servers or not. Only very active sites require
    multiple servers, but if you do, you''ll need to buy the more expensive certificate.


    > tip Certificates can be self-signed and cost nothing, but these aren''t appropriate
    for e-commerce sites.


    Conversely, you should not use certificates tied to a given host or that are shared
    by multiple sites on the same server. These kinds of certificates may be free
    or cheap with your hosting, but they''ll be a red flag to customers.


    > tip If you spend more money on a certificate, you''ll also get better technical
    support.


    More expensive certificates also mean that the issuer has done more extensive
    checks into who the purchaser is. A cheap certificate basically says someone bought
    this certificate. An expensive certificate says someone bought this certificate
    for this domain that we''ve validated they own, and we''ve confirmed they''re
    a valid company operating in X country, and we''ve spoken to them on the phone,
    and read a letter from their accountant, and so on (and I''m not making all that
    up). Finally, you can buy high-end certificates that enable the “green address
    bar” effect in some Web browsers, also called “extended validation” or EV). This
    is an obvious, visual cue to the user that they''ve got a really secure connection,
    and it''s safe for them to do whatever they''re about to do.


    # COMMON VULNERABILITIES


    To wrap up this chapter, I want to talk about some of the common vulnerabilities
    Web sites are prone to and that you''ll need to watch out for. You''ll see some
    redundancies with the information already presented, but reinforcing good security
    approaches is never a bad thing.


    Security is all about protecting data: protecting it from being seen, altered,
    or deleted by the wrong people. What most vulnerabilities have in common is they
    provide potential holes through which hackers can see or manipulate data to which
    they shouldn''t have access. The following sections cover the most common security
    hacks and attacks, and what you need to do to prevent them.


    > tip The security measures you can take will also depend upon the versions of
    software in use — another reason to keep software up to date!


    # Protecting Information


    Dynamic Web sites deal with lots of information, from just content to user-supplied
    data to transaction histories. This data will be received by PHP scripts, passed
    to a MySQL database, and later retrieved from the database'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'so it''s again available in PHP. To strengthen this process, start by taking
    only the minimum amount of information needed: You don''t need to worry about
    protecting something you don''t have. Next, validate the user-supplied data to
    the utmost degree. PHP''s Filter functions (www.php.net/filter), formerly found
    in PECL (PHP Extension Community Library, http://pecl.php.net) and part of the
    language core as of PHP 5.2, provide excellent tools for validating and sanitizing
    values. Always assume that user input is wrong and then verify that it''s right.


    Third, store only the minimum amount of data. For example, you may need to take
    twelve pieces of information about a customer, and then pass seven of those along
    to a payment gateway while storing only five in your own database. Fourth, if
    PHP and MySQL are on separate servers, use SSL to protect the data during transmission.
    Fifth, retrieve from the database only the information you actually need.


    These just-mentioned techniques for handling data in PHP and MySQL can also be
    applied to the client-server relationship. Be very careful about what you store
    in the browser (in cookies), pass to the browser in HTML, or display as part of
    the URL. PayPal, with an amazing lack of foresight, used to accept the total price
    being charged in the URL, where it''s available for anyone to easily—really easily—change!
    You also need to validate and/or sanctify cookie and URL data, treating it the
    same as any other user-supplied data (such as from a form), because cookies and
    URL parameters really are under the user''s control.


    For sensitive data being stored, but not stored in a database, change your sessions
    directory, and use the Web root directory''s parent folder (see Figure 2.5). Make
    sure your server isn''t giving away anything with error messages that are too
    revealing or lingering in phpinfo() scripts.


    Finally, to protect all the server data, perform regular backups. If you use a
    RAID array of hard drives, you''ll also be protected should a single drive fail.


    # Protecting the User


    Protecting the user, aka the customer in an e-commerce site, is really the primary
    goal, because the trust of the customer is what makes your business thrive. Protecting
    their information is part of protecting them, but there''s another way that your
    site may be of some harm: through Cross-Site Scripting (XSS) attacks. In an XSS
    attack, malicious person Alice injects JavaScript into your site. Most commonly
    this is done through components intended for user input, such as a comments or
    reviews area. When Bob loads your page in his Web browser (for example, when he
    looks at the product reviews), the


    RAID drives or other fast hard drives can greatly improve the performance of your
    site.'
