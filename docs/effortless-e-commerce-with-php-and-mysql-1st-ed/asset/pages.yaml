  md: "```\n<th align=\"center\">Quantity</th>\n<th align=\"right\">Price</th>\n<th\
    \ align=\"right\">Subtotal</th>\n</tr>';\n```\n\nThe HTML version of the body\
    \ starts with the beginning HTML code: To create an HTML email, you create an\
    \ entire HTML page, as if it were to be viewed in a Web browser. You can even\
    \ include CSS as you would in a standard HTML page.\n\nThe body then begins with\
    \ the same message as in Step 2, plus the start of a table definition.\n\n+  \
    \ 4. Retrieve the order contents:\n\n```\n$r = mysqli_query($dbc, \"CALL get_order_contents({$_SESSION[\n\
    'order_id']})\");\nwhile ($row = mysqli_fetch_array($r, MYSQLI_ASSOC)) {\n```\n\
    \nThe get_order_contents() stored procedure returns the details—what products,\
    \ and in what quantities and at what price—associated with a given order number.\
    \ The procedure does not return anything regarding the customer, which is fine\
    \ in this situation.\n\n+   5. Add each item to both versions of the body:\n\n\
    ```\n$body_plain .= \"{$row['category']}:::{$row['name']} ({$row['quantity']})\"\
    \n    @ \\ $( $row['price_per'] ) each: $\". $row['subtotal'] . \"\\n\";\n$body_html\
    \ .= '<tr><td>'. $row['category'] .': '. $row['name'] . '</td>\n<td align=\"center\"\
    >'. $row['quantity'] . '</td>\n<td align=\"right\">$'. $row['price_per'] . '</td>\n\
    <td align=\"right\">$'. $row['subtotal'] . '</td>\n</tr>\n';\n```\n\nFor the plain\
    \ text version, the item's name, quantity, price, and subtotal is listed on a\
    \ single line. For the HTML version, a table row is created listing the same information.\n\
    \n+   6. Store the shipping and order total for later use:\n\n```\n$shipping =\
    \ $row['shipping'];\n$total = $row['total'];\n```\n\nAfter the loop has completed—after\
    \ every item has been added to the email—the cost of shipping and the total should\
    \ be appended to the email body. In order to make those values available after\
    \ the execution of the loop, they're assigned to other variables here."
