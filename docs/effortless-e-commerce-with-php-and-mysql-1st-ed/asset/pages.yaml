    > \n> This book doesn't teach HTML, CSS, JavaScript, PHP, SQL, or MySQL; instead\
    \ it demonstrates real-world application of these technologies.\n\nWith modern\
    \ Web browsers, much of a site's layout and design comes from CSS (Cascading Style\
    \ Sheets). I'll be using CSS in this book, too, and just like with HTML, I don't\
    \ explain it in much detail. Still, I won't be using CSS in any super-fancy way,\
    \ so it shouldn't be a problem following along.\n\nWhen I first began doing Web\
    \ development in the late 1990's, there was this annoying little thing called\
    \ JavaScript. At that time, JavaScript was largely used for petty and cutesy tricks.\
    \ JavaScript was almost entirely unnecessary. Today, things are quite different,\
    \ thanks to Ajax, Web 2.0, and other marketing terms that people throw around.\
    \ Now, JavaScript, when properly used, greatly improves the user's experience.\
    \ Many Web-site features that people appreciate, such as being able to present\
    \ lots of content in a limited space, being able to add something to a cart without\
    \ leaving the page, and so forth, use JavaScript. While JavaScript is valuable,\
    \ it's really an “extra.”\n\n> **tip**\n> \n> If you are curious about programming\
    \ Flash content, consider my *Effortless Flex 4 Development* (New Riders, 978-0-321-70594-5).\n\
    \nAnother way to create a rich user interface in the browser is to use Flash,\
