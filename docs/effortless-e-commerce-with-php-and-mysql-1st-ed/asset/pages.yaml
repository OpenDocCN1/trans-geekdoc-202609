    \ /><?php create_form_input('cc_number', 'text', $billing_errors, 'POST', 'autocomplete=\"\
    off\"'); ?></div>\n+   ```\n\nThe element for taking the customer's credit card\
    \ number is just a text input. The potential existing value for this input can\
    \ come only from POST, because the credit card number will never be stored in\
    \ the session.\n\n> ### note\n> \n> You don't actually have to ask the customer\
    \ what type of card they're using, because the card number is indicative of the\
    \ card type.\n\nThe input uses the extra HTML autocomplete=\"off\", which is a\
    \ necessary security measure. If you don't use this attribute, and the user's\
    \ browser is set to remember their form data, then the browser will record the\
    \ user's credit card number in plain text on the customer's computer. That's not\
    \ good. (It may still happen because of less diligent e-commerce sites, though.)\n\
    \n+   7. Create the expiration date elements:\n+   \n+   ```html\n+   <div class=\"\
