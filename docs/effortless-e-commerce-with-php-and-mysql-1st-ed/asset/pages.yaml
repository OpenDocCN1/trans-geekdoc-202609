    # SHOPPING BY CATEGORY


    With the stored procedures and the overall HTML template in place (that is, two
    parts of an MVC approach have been written), the PHP script that lists the available
    categories becomes quite simple. All this file has to do is:


    +   Validate the received type

    +   Invoke the stored procedure

    +   Include the HTML template and specific view files


    > tip

    > See Chapter 7 for an explanation of mod_rewrite and how this Coffee site uses
    it.


    As a reminder, the PHP script for listing the product categories is called shop.php,
    and it’s linked in the header as either /shop/coffee/ or /shop/goodies/. The Web
    server’s mod_rewrite module will convert that URL (unbeknownst to the user) into
    either shop.php?type=coffee or shop.php?type=goodies. Let’s write the PHP script
    first, then the view files it uses.


    # Creating the PHP Script


    In keeping with the MVC approach, this PHP script should have little-to-no HTML
    (technically, none) and as little SQL as possible. The end result is a smattering
    of logic and the inclusion of several files.


    +   1. Create a new PHP script in your text editor or IDE to be named shop.php
    and stored in the Web root directory.'
