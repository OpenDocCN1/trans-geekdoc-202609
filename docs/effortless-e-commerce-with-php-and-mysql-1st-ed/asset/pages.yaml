    \ CVVC all refer to the Card Security Code (CSC).\n\n+   8. Create the Card Verification\
    \ Value (CVV) input:\n+   \n+   ```html\n+   <div class=\"field\"><label for=\"\
    cc_cvv\"><strong>CVV</strong></label><br /><?php create_form_input('cc_cvv', 'text',\
    \ $billing_errors, 'POST', 'autocomplete=\"off\"'); ?></div>\n+   ```\n\n> ###\
    \ note\n> \n> Merchants are not allowed to store CVV numbers.\n\nThe CVV code\
    \ is an extra security measure used to limit fraud. What the customer should enter\
    \ here are three digits on the back of Visa, MasterCard, and Discover cards or\
