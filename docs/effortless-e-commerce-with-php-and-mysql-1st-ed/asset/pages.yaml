- pgno: 264
  md: "This site will use this last criterion.\n\nThe first step is to define a function\
    \ that will calculate the shipping using a formula. As an example, let's say that\
    \ shipping starts with a base rate, which covers the simple fact that some employee\
    \ has to be paid to assemble and box the order. Added to that should be an amount\
    \ that's partly based on the amount of the order: Presumably, as the order total\
    \ increases, more items are being shipped, but at the same time the site is making\
    \ more money. Therefore, the bulk of the shipping cost will be proportional to\
    \ the order total, and that proportion will decrease for larger orders. Here,\
    \ then, is the function:\n\n```\nfunction get_shipping($otal = 0) {\n // Set the\
    \ base handling charges:\n $Shipping = 3;\n // Rate is based upon the total:\n\
    \ if ($total < .10) {\n $rate = .25;\n } elseif ($otal < 20) {\n $rate = .20;\n\
    \ } elseif ($otal < 50) {\n $rate = .18;\n } elseif ($otal < 100) {\n $rate =\
    \ .16;\n } else {\n $rate = .15;\n }\n // Calculate the shipping total:\n $Shipping\
    \ = $Shipping + ($total * $rate);\n // Return the shipping total:\n return number_format($Shipping,\
    \ 2);\n} // End of get_shipping() function.\n```\n\nLogically, this function should\
    \ be defined in the product_functions.inc.php script so that it's available to\
    \ multiple scripts (such as cart.php and checkout.php, which will be written in\
    \ the next chapter).\n\nTo use this function in cart.php (the wish list does not\
    \ display a total), add this code before displaying the total (Figure 9.10):\n\
    \n```\n$shipping = get_shipping($otal);\n$Total += $shipping;\necho '<tr>'\n```"
