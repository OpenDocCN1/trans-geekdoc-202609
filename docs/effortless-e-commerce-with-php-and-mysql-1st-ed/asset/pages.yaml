    # SERVER SETUP


    There are a few more server needs in the Coffee e-commerce example than in the
    Knowledge is Power site, so let''s look at that in detail.


    # Server Organization


    The server organization—how the files and folders are laid out—is represented
    in Figure 7.5. One file, the MySQL connection script, is stored outside the Web
    root directory. Within the Web root directory are folders for the CSS, images,
    and JavaScript. All the administrative pages will go in the admin directory, which
    you should rename to something less obvious. The includes directory will contain
    PHP and HTML scripts included by other PHP scripts, such as the configuration
    file, the HTML header, and the HTML footer.


    > For extra security, you could put the administration pages in a subdomain, such
    as https://admin.example.com.


    The products directory is a special case in that it''ll store the images for the
    products sold on the site. Those products will be added via PHP, so this directory
    needs to be writable by the Web server. For even more security, you could place
    this directory outside the Web root and use a proxy script to serve every image
    (just like the PDF handling in Part Two). However, the admin script will have
    plenty of precautions to prevent abuse of this open directory. As an extra'
