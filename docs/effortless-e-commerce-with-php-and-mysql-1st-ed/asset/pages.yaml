    The else clause applies if the SELECT query returns any records. This means that
    the email address and/or the username have already been registered. Now we need
    to determine which of the two values is the culprit. If two rows were returned,
    then both have already been registered. The assumption then is that the same customer
    already registered (because their email address is in the system) and another
    customer already has that username (because it''s associated with a different
    email address). The error messages are added to the $reg_errors array, indexed
    at email and username, so that they''ll appear beside the appropriate form input
    when the form is redisplayed.


    # 13. Confirm which item has been registered:


    ```

    } else { // One or both may be taken.

    $row = mysqli_fetch_array($r, MYSQLI_NUM);

