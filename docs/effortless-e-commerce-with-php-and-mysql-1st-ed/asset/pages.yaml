    # # ADDING PRODUCTS


    The e-commerce site sells two types of products: coffee and other (aka, goodies).
    The two products are treated differently in the database and in the catalog, so
    the administrative scripts for adding each will differ, too.


    tip

    This chapter does not include scripts for adding general coffee or goodie types,
    although each would be easy to create. Turn to the book supporting Web site if
    you need help implementing either.


    # ## Adding Non-Coffee Products


    Non-coffee products—books, mugs, and so on—are represented as records in the non_coffee_products
    table. For each item, there is a non_coffee_category_id (a reference to the values
    in the non_coffee_categories table), a name,'
