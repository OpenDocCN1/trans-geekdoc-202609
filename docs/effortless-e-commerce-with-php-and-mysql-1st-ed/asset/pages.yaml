  md: '# Recovering Passwords


    Because the user passwords are not being stored in an encrypted format, they cannot
    be decrypted and recovered. When the user forgets or loses their password, the
    only option then is to create a new password and send it to them in an email.
    The form to start this process is simple: it just takes an email address (Figure
    4.15).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_113_0.png)


    +   1. Create a new PHP script in your text editor or ID to be named `forgot_password.php`
    and stored in the Web root directory.


    +   2. Include the standard stuff:

    +   ```php

    +   <?php

    +   require (''./includes/config.inc.php'');

    +   $page_title = ''Forgot Your Password?'';

    +   include (''./includes/header.html'');

    +   require (MYSQL);

    +   ```


    +   3. Create an array for storing errors:

    +   ```php

    +   $pass_errors = array();

    +   ```


    +   4. Validate the email address:

    +   ```php

    +   if ($_SERVER[''REQUEST_METHOD''] == ''POST'') {

    +       if (filter_var($_POST[''email''], FILTER_VALIDATE_EMAIL)) {

    +           $q = ''SELECT id FROM users WHERE email="" . mysqli_real_escape_string
    ($dbc, $_POST[''email'']) . "";'';

    +           $r = mysqli_query ($dbc, $q);

    +           if (mysqli_num_rows($r) == 1) { // Retrieve the user ID.

    +               list($uid) = mysqli_fetch_array ($r, MYSQLI_NUM);

    +           } else { // No database match made.

    +               $pass_errors[''email''] = ''The submitted email address does not
    match those on file!''};

    +           }

    +       }

    +   ```


    If the page is accessed via a POST request, then the form has been submitted.
    The first thing it should do is validate that a proper email address was provided.
    This is a two-step process. First, the `filter_var()` function confirms that the
    submitted value adheres to the email syntax. Then a query specifically confirms
    that this email address exists in the database. If it does, then the user ID value
    is retrieved. If it doesn''t exist in the database, an error message is assigned
    to the array.'
