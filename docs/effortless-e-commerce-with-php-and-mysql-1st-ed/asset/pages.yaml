- pgno: 393
  md: "# Larger Images\n\nDepending upon what your e-commerce site is selling, you\
    \ may want to implement a feature so that the site supports product images in\
    \ multiple sizes. This wasn't really necessary in this example—a large picture\
    \ of coffee beans is no more likely to bag a sale.\n\nAt the very least, a site\
    \ may want its product images to be available in three sizes:\n\n+   - Thumbnail,\
    \ for use in places like the home page in this example\n+   - Regular, for use\
    \ on product listing pages\n+   - Large, which would appear above the page when\
    \ the user clicks one of the smaller images\n\n**tip** You can also manipulate\
    \ images in PHP by making system calls to the ImageMagick library, if your server\
    \ supports it.\n\nThe administrative interface could be designed to handle three\
    \ image sizes in one of two ways. First, it could be up to the administrator to\
    \ provide all three images in set sizes. Second, the administrator could submit\
    \ one large image, which the PHP script would then dynamically resize to create\
    \ the smaller versions. The latter would be preferable, although this requires\
    \ quite a bit more PHP code and support for the GD image manipulation library.\n\
    \nSecond, you'll need to decide how to represent the various images on the server.\
    \ You could use the same filename for each but store them in three separate folders:\
    \ /products/, /products/thumbs/, and /products/large. You could then use PHP to\
    \ confirm the existence of the product image in a given size, before attempting\
    \ to use that image in the HTML.\n\n**tip** Another option is to store images\
    \ in BLOB columns in the database itself. There are arguments for and against\
    \ this practice, though.\n\nAlternatively, you could create a separate images\
    \ table in the database:\n\n```\nCREATE TABLE `images` (\n id INT UNSIGNED NOT\
    \ NULL AUTO_INCREMENT,\n product_type ENUM('coffee', 'other'),\n product_id SMALLINT\
    \ UNSIGNED NOT NULL,\n image VARCHAR(45) NOT NULL,\n image_type ENUM('thumb',\
    \ 'regular', 'large', 'alternative'),\n PRIMARY KEY (id),\n KEY product (product_type,\
    \ product_id),\n KEY (image_type)\n);\n```"
