- pgno: 192
  md: 'These lines say: If the mod_rewrite module exists, turn on the rewrite engine.
    After turning on the rewrite engine and before the closing IfModule, you define
    rules. Here is the complete set of rules that will be defined, to be explained
    later in detail:


    ```

    ```

    <IfModule mod_rewrite.c>

    RewriteEngine on

    # For sales:

    RewriteRule ^shop/sales/?$ sales.php

    # For the primary categories:

    RewriteRule ^shop/([A-Za-z-+]+)/+$ shop.php?type=$1

    # For specific products:

    RewriteRule ^browse/([A-Za-z-+]+)/([A-Za-z-+]+)/([0-9]+)$

    browse.php?type=$1&category=$2&id=$3

    # For HTTPS pages:

    RewriteCond %{HTTPS} off

    RewriteRule ^(checkout\.phpbilling\.phpfinal\.phpadmin\/(.*))$

    https://%{HTTP_HOST}/$1 [R=301,L]

    </IfModule>

    ```

    ```


    For the shop.php script, the rule is:


    ```

    ```

    RewriteRule ^shop/([A-Za-z-+]+)/+$ shop.php?type=$1

    ```

    ```


    Regular expressions are in use here, so if you''re unfamiliar with them, this
    may seem like hieroglyphics to you. I''ll explain it in pieces...


    The middle chunk (between RewriteRule and shop.php?type=$1) identifies the URLs
    to match. That regular expression matches any URL that has text beginning (the
    caret ^) with shop followed by a slash. That should be followed by some combination
    of letters and the plus sign: [[A-Za-z-+]+]. The square brackets create a class
    of characters. The specific class matches upper and lowercase letters and the
    plus sign, which is how spaces are represented in URLs (such as, Kona Coffee in
    a URL is Kona+Coffee). This class is followed by the plus sign, which is a quantity
    modifier that matches one or more of whatever the plus sign follows. So shop Mugs
    matches ^shop/([A-Za-z-+]+) but just shop does not and neither does shop/123.


    The class and plus sign quantity modifier is wrapped in parentheses to make a
    grouping, which will be relevant at the end of the rule. This is followed by an
    optional slash. This slash is optional because it''s followed by the question
    mark, another quantifier modifier. The question mark says that zero or one of
    the things it follows is acceptable. At this point, ^shop/([A-Za-z-+]+)/+? matches
    shop/Mugs or shop/Mugs/.


    > The rewrite rules apply to the part of the URL after the hostname. In www.example.com/shop/coffee,
    the matching begins after www.example.com/.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The dollar sign that concludes the matching rule indicates the end of the string.
    This means that if any characters follow what''s been matched to this point, the
    match is invalidated. Put another way, the final dollar sign still allows for
    shop/Mugs or shop/Mugs/ but does not allow for shop/Mugs/a or shop/Mugs/123.


    When a match is made, the URL will be rewritten to shop.php?type=$1. The $1 represents
    whatever string matched the first grouping: ([A-Za-z\-]+). This is called backreferencing
    because it refers back to something already found. The end result is that shop/coffee
    and shop/coffee/ become shop.php?type=coffee and shop/goodies becomes shop.php?type=goodies.
    In both cases, $_GET[''type''] will be available to the shop.php script because
    the rewrite module will create it and assign it a value.


    Whereas all the products are available through shop.php, the sale items will be
    listed on the sales.php script. But to make the URLs consistent, let’s add a rule
    for that situation:


    ```

    RewriteRule ^shop/sales/?$ sales.php

    ```


    This rule specifically matches either shop/sales or shop/sales/ and rewrites that
    as sales.php. This rule must be defined before the previous one, though, as the
    previous rule would also apply to shop/sales, and we don’t want the URL rewritten
    as shop.php?type=sales.


    Continuing along, the browse.php page will list specific products in a general
    category: all the Kona coffees available or all the mugs. The browse script needs
    to know the category type and the specific category ID. For Search Engine Optimization
    (SEO) purposes and to make the URL more accessible to the customer as well, the
    URL will be in the format browse/type/CategoryName/id, such as browse/coffee/Kona/3.
    The rule to handle this is:


    ```

    RewriteRule ^browse/([A-Za-z+\-]+)/([A-Za-z+\-]+)/([0-9]+)$

    -> browse.php?type=$1&category=$2&id=$3

    ```


    This matches any URL that begins with browse, followed by a slash and some combination
    of letters and the plus sign. This first grouping represents the type value, such
    as coffee or goodies. After that should come a slash, and some combination of
    letters, the plus sign, and a hyphen. This second grouping matches the category,
    such as Kona or Gift+Baskets. The match should conclude with one or more numbers,
    which will be the ID value.


    Such a match gets rewritten as browse.php?type=$1&category=$2&id=$3, where $1,
    $2, and $3 represent the first, second, and third matched groupings. Hence, www.example.com/browse/coffee/Kona/3
    becomes (behind the scenes) www.example.com/browse.php?type=coffee&category=Kona&id=3.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# ENFORCING SSL


    While the site is using mod_rewrite, let''s enforce SSL for several pages:


    +   - The entire administration directory

    +   - checkout.php

    +   - billing.php

    +   - final.php


    To do this, you must have SSL enabled (see the “Enabling SSL” sidebar), and add
    this code to your .htaccess file, within the same <IfModule mod_rewrite.c> block:


    ```

    RewriteCond %{HTTPS} off

    RewriteRule ^(checkout\.php|billing\.php|final\.php|admin/(.*))$

    https://%{HTTP_HOST}/$1 [R=301,L]

    ```


    The first line checks for the condition where HTTPS is off: %{something} refers
    to a server environmental variable. Then the rule attempts to match checkout.php,
    billing.php, final.php, or admin/anything. If a match is made, the URL is rewritten
    to https://hostname/$1, where $1 is the matched item.


    The R=301,L part says that this should be a permanent redirection type, associated
    with the server code 301, and that this should be the last rule evaluated.


    By adding this rule, the server will not allow the browser to load any of those
    pages over a non-secure connection.


    # ENABLING SSL


    Enabling SSL on your server is an important step to take for any e-commerce project,
    but unfortunately one for which I can’t provide you with specific directions:
    There are just too many factors involved, from the hosting company, to the server
    type, to where you get your SSL certificate. In Chapter 2, “Security Fundamentals,”
    I talked about some of the sites that offer digital certificates and what features
    you should consider. If you buy one through your hosting company, they will likely
    install it for you, which is a benefit. If you buy one through a third party,
    you may save money but have to install it yourself (although the third party should
    provide some instructions). In that case, you may be able to install the certificate
    through your Web-hosting control panel. If that’s not an option, then installation
    is a matter of using the command line to put the right files in the right places
    and then editing the server’s configuration files. There are plenty of tutorials
    online that will explain the steps in detail.'
  merge: -1
  img_proc: true
