- pgno: 285
  md: "```\nif (preg_match ('/^[A-Z \\'.-]{2,40}$/i', $_POST['last_name'])) {\n  \
    \  $ln = addslashes($_POST['last_name']);\n} else {\n    $shipping_errors['last_name']\
    \ = 'Please enter your last name!';\n}\n```\n\nThe validation routines for the\
    \ customer's first and last names match those from register.php in Chapter 4.\
    \ To make the values safe to use in the stored procedure call, each value is run\
    \ through addslashes().\n\nIf there's a chance that Magic Quotes may be enabled\
    \ on your server, you'll also need to apply stripslashes() prior to validation:\n\
    \n```\nif (get_magic_quotes_gpc()) {\n    $_POST['first_name'] = stripslashes($_POST['first_name']);\n\
    }\n// Repeat for other variables that could be affected.\n```\n\nIf Magic Quotes\
    \ is enabled, a valid last name, such as O'Toole, will become O\\'Toole, which\
    \ won't pass the regular expression test. But when the stored procedure is invoked,\
    \ the query will be CALL add_customer('$fn', '$ln', ...), so addslashes() must\
    \ be applied to the query data to prevent the apostrophe in O'Toole from breaking\
    \ that procedure call: CALL add_customer('Peter', 'O'Toole', ...)\n\n> tip\n>\
    \ \n> As a formality, you could add isset() to each validation conditional, as\
    \ in\n> if (isset($_POST['var'])\n> && preg_match(...\n\n# 9. Validate the street\
    \ addresses:\n\n```\nif (preg_match ('/^[A-Zo-9 \\',.#-]{2,80}$/i', $_POST['address1']))\
    \ {\n    $a1 = addslashes($_POST['address1']);\n} else {\n    $shipping_errors['address1']\
    \ = 'Please enter your street address!';\n}\nif (empty($_POST['address2'])) {\n\
    \    $a2 = NULL;\n} elseif (preg_match ('/^[A-Zo-9 \\',.#-]{2,80}$/i', $_POST['address2']))\
    \ {\n    $a2 = addslashes($_POST['address2']);\n} else {\n    $shipping_errors['address2']\
    \ = 'Please enter your street address!';\n}\n```\n\nAddresses are trickier to\
    \ validate because they can contain many characters besides alphanumeric ones.\
    \ The regular expression pattern allows for any letter, any number, a space, an\
    \ apostrophe, a comma, a period, the number sign, and a dash.\n\nThe second street\
    \ address (for longer addresses) is optional, so it's only validated if it's not\
    \ empty."
