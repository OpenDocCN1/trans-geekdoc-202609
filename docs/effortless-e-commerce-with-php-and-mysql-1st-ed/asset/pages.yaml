    # Protecting Passwords


    The next helper function will turn the user-supplied password into a more secure
    format to be stored in the database. Passwords can be represented in three ways:


    +   In plain text, which is a terrible thing to do

    +   In an encrypted format, which can be decrypted

    +   In a hashed format, which cannot be decrypted


    If you store passwords in an encrypted format, it’s safe from prying eyes and
    can be retrieved when necessary. But if someone gets onto your server and can
    find your code for performing the decryption, they’ll be able to view every user’s
    password. And it turns out that you don’t really need passwords to be decryptable:
    It doesn’t matter whether anyone can ever see the plain text in its original form
    again or not.


    > note

    > The discovery of a user’s password is a huge security violation as many people
    use the same email and password combination at many sites.


    An alternative is to create a hash of the password, a hash being a representation
    of data. For example, MD5 is a hashing algorithm that’s been around for years.
    The MD5 hash of the word password is 5f4dcc3b5aa765d61d8327deb882cf99; the MD5
    hash of the word omnivore is 04f7696e917f292f99925f80fcdb1db1. You can create
    a hash out of any piece of data, and, in theory, no two pieces of data have the
    same hash.


    Storing the hash version of a password is more secure in that it cannot be decrypted.
    If a hacker gets your data, the best she or he can do is create'
