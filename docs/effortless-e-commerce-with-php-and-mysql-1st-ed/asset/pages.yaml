  md: "+   12. If there were no errors, add the record to the database:\n\n```\nif\
    \ (empty($add_product_errors)) {\n    $q = 'INSERT INTO non_coffee_products (non_coffee_category_id,\n\
    \        name, description, image, price, stock) VALUES (?, ?, ?, ?, ?, ?)';\n\
    \    $stmt = mysqli_prepare($dbc, $q);\n    mysqli_stmt_bind_param($stmt, 'isssdi',\
    \ $_POST['category'],\n        $name, $desc, $_SESSION['image']['new_name'], $_POST['price'],\n\
    \        $_POST['stock']);\n    $name = strip_tags($_POST['name']);\n    $desc\
    \ = strip_tags($_POST['description']);\n    mysqli_stmt_execute($stmt);\n}\n```\n\
    \nAs explained in Chapter 7, to use prepared statements, the first step is to\
    \ define the query, using placeholders (the question marks) in lieu of actual\
    \ values. Then the statement is prepared. Next, the placeholders are bound, by\
    \ type, to PHP variables. The second argument to the mysqli_stmt_bind_param()\
    \ function indicates that the first placeholder is an integer, the next three\
    \ are strings, the fifth is a decimal, and the last is another integer.\n\nFour\
    \ of the values to be used in the query come from $_POST and $_SESSION directly.\
    \ The other two values will come from local variables, after the strip_tags()\
    \ function is applied.\n\nIf you have problems when executing this script, you\
    \ can use the following line (after preparing the statement) to see what the problem\
    \ is:\n\n```\nif (!$stmt) echo mysqli_stmt_error($stmt);\n```\n\n+   13. If the\
    \ query created a new record, print a message and perform some cleanup:\n\n```\n\
    if (mysqli_stmt_affected_rows($stmt) == 1) {\n    echo '<h4>The product has been\
    \ added!</h4>';\n    $_POST = array();\n    $_FILES = array();\n    unset($file,\
    \ $_SESSION['image']);\n}\n```\n\nIf one row was affected, a message will be printed,\
    \ and the variables will be reset (because the form will be shown again, and it\
    \ shouldn't display the previous values)."
