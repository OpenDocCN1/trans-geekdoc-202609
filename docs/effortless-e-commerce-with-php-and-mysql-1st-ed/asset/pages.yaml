  img_proc: true
- pgno: 398
  md: '> On *nix systems, cron can be used to execute a PHP script automatically at
    periodic intervals. Such a script can be used to perform maintenance.


    # Tweaking the Database


    The foundation of the Web site is the database, so I’d be remiss not to mention
    alternatives there. To start, the system as written will create a lot of flotsam:
    wish list and shopping cart items never to be purchased. You would likely want
    to create a PHP (or command-line) script that routinely rids the database of old
    stuff. A record is old if its modification date is more than, say, six months
    old or if its creation date is more than six months old and its modification date
    is still 0000-00-00 00:00:00, meaning the record had never been updated.


    Second, if you’re using the stored procedures and like how they work, you should
    probably read up on how to handle errors in stored procedures. While not hard
    to do, the topic is large and technical enough that I had to omit it from the
    book, lest I took away from the more important points.


    Finally, you could get much better performance from the database by taking advantage
    of VIEW tables. A VIEW table is a memorized SELECT query that you can run other
    queries on as if it were a real table. The syntax for creating a VIEW is:


    ```

    CREATE VIEW view_name AS <SELECT QUERY>

    ```


    As an example, the UNION used in the procedures for retrieving every shopping
    cart or wish list item is quite demanding. You could create a VIEW that performs
    all the JOINs, effectively replacing the product_type and product_id values from
    the database tables with the actual information you want to display in the Web
    browser. The view would also store the associated user session ID values.


    ```

    CREATE VIEW cart_view AS

    SELECT user_session_id, CONCAT("O", ncp.id) AS sku, c.quantity,

    ncc.category, ncp.name, ncp.price, ncp.stock, sales.price AS sale_price

    FROM carts AS c INNER JOIN non_coffee_products AS ncp ON

    c.product_id=ncp.id INNER JOIN non_coffee_categories AS ncc ON

    ncc.id=ncp.non_coffee_category_id LEFT OUTER JOIN sales ON (

    sales.product_id=ncp.id AND sales.product_type=''other'' AND ((NOW())

    BETWEEN sales.start_date AND sales.end_date) OR (NOW() >

    sales.start_date AND sales.end_date IS NULL))) WHERE

    c.product_type="other" UNION SELECT user_session_id,

    CONCAT("C", sc.id), c.quantity, gc.category, CONCAT_WS(" - ", s.size,

    sc.caf_decaf, sc.ground_whole), sc.price, sc.stock, sales.price FROM

    carts AS c INNER JOIN specific_coffees AS sc ON c.product_id=sc.id

    INNER JOIN sizes AS s ON s.id=sc_size_id INNER JOIN general_coffees

    ```'
  merge: -1
  img_proc: true
- pgno: 399
  md: '```

    AS gc ON gc.id=sc.general_coffee_id LEFT OUTER JOIN sales ON

    (sales.product_id=sc.id AND sales.product_type=''coffee'' AND ((NOW()

    BETWEEN sales.start_date AND sales.end_date) OR (NOW()) >

    sales.start_date AND sales.end_date IS NULL))) WHERE

    c.product_type="coffee";

    ```


    To be clear, the SELECT...UNION...SELECT query is the same as the one

    in the get_shopping_cart_contents() stored procedure, except that the

    user_session_id value is now part of the selection, instead of part of the

    WHERE condition. Figure 9.11 shows two SELECT queries run on this VIEW

    table, with the latter automatically reflecting changes in the carts table (due
