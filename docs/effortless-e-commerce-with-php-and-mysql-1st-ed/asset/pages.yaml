- pgno: 394
  md: 'The table would have a many-to-many relationship with both the non_coffee_products
    and specific_coffees tables (just like the sales table). For each image type that
    exists for a given product, a new record would be created in this table. The structure
    also allows for the submission of alternative images, such as the same shirt in
