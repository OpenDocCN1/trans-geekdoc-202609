    # # REQUIRE AND INCLUDE


    In the home page, I use both require and include to bring in the four scripts.
    These

    two control structures (they''re not technically functions) serve the same purpose
    but

    differ in how they fail. Failure to include a file results in a warning; failure
    to require a

    file results in a fatal error. Because the configuration and MySQL files are critical
    to the

    site''s functionality, failure to incorporate them should be fatal. Conversely,
    failure to

    incorporate the header or footer is just a cosmetic issue, not that you''d want
    that to

    happen either.


    You may notice that I did not use require_once or include_once. These two control

    structures run checks to ensure that the same file isn''t incorporated multiple
    times by

    the same script. Because of those repeated checks, using them has an adverse effect

    on the site''s performance. In this site, which is straightforward, a repeated
    inclusion

    of a file is highly unlikely, so it''s best to go with the more direct require
    and include. If

    you have a very complex site, with lots of included files that include other files,
    using

    the _once variants may be necessary. You will see a couple of appropriate uses
    of

    include_once in later chapters.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # 4 USER ACCOUNTS


    The next step in the evolution of the Knowledge is Power e-commerce site is to
    create a system of user accounts. When the site is complete, PayPal will be the
    crucial part in the registration process, but just to understand the user account
    system on its own, as well as to be able to create an administrative user for
    the next chapter, let''s look at user accounts as a separate entity first.


    There are four primary facets to the implementation of user accounts in this chapter.
    First, a new user registers. Second, a registered user logs in. Third, the logged-in
    user logs out (in theory, many people, including me, don''t always do so). Fourth,
    users need to be able to retrieve a forgotten password and change an existing
    password.


    Although this example won''t be storing any sensitive e-commerce data, security
    will still be taken seriously, for the benefit of the customers and the site itself.
    In a few places, I''ll make recommendations as to how you can increase security
    even further, and the chapter ends with even more suggestions.


    # ## DEFINING HELPER FUNCTIONS


    Before getting into the primary scripts, there are three helper functions that
    you should define. The first will greatly facilitate handling some of the site''s
    forms. The second will transform a user-supplied password into a format that''s'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'more secure to store. And the third will redirect the browser should the user
    not meet the requirements for accessing a particular page.


    There are a few benefits to using these custom functions:


    +   Keeps complex logic from cluttering up other code


    +   Allows the same logic to be used in multiple scripts


    +   Makes changes to the logic a snap


    The last two are really the key points: If you separate out processes, they can
    be used by different parts of a site without having to repeat the code. And if
    you later decide you need to tweak the process, you can do so in one place.


    # Creating Form Inputs


    The functionality provided by the scripts in this chapter is almost entirely form-based:
    The user must complete a registration, login, change password, or forgot password
    form. All these forms use just two types of form inputs — text and password (not
    counting the submit buttons). An input starts off with this simple HTML:


    ```

    <input type="type" name="name" id="name" />

    ```


    For example:


    ```

    <input type="text" name="username" id="username" />

    ```


    In cases where the form was submitted but not properly completed, the user will
    be presented with the form again. As a convenience, the form should remember the
    entered values (that is, it should be sticky). To achieve that effect, you need
    to add value="whatever value" to each input. In PHP code, that would be:


    ```

    <input type="text" name="username" id="username" value="<?php echo $_POST[''username''];
    ?>" />

    ```


    However, the first time the form is loaded, $_POST[''username''] won''t be set,
    so the code should really be:


    ```

    <input type="text" name="username" id="username" value="<?php if (isset($_POST[''username'']))
    echo $_POST[''username'']; ?>" />

    ```


    You can add sizes to the inputs, if you want. I chose not to size them, so they
    would all be equally sized to the browser''s default.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/4f47e47c67bd619ac73250f11c9fc7ce_90_0.png)


    Figure 4.1


    If the user, for whatever reason, used quotation marks in their value, the quotation
    marks will mess up the HTML. Figure 4.1 shows the result if the user enters Jeff
    "The Dude" Lebowski as the username. To protect against that, you can use the
    htmlspecialchars() function (Figures 4.2 and 4.3):


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_90_1.png)


    Figure 4.2


    ```

    <input type="text" name="username" id="username" value="

    <?php if (isset($_POST[''username''])) echo htmlspecialchars(

    $_POST[''username'']); ?>" />

    ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_90_2.png)


    Figure 4.3


    And, if Magic Quotes is enabled, the stripslashes() function should be applied
    to the value. You''ll add that code shortly, but first, there''s one more complication:
    if the form isn''t completed properly, it''d be nice to add a CSS class to the
    input so that it''s displayed with a red border:


    ```

    <input type="text" name="username" id="username" value="

    <?php if (isset($_POST[''username''])) echo htmlspecialchars(

    $_POST[''username'']); ?>" ?><?php if (/* error on this input */)

    echo '' class="error"''; ?> />

    ```


    Also, in that case, the error message should be added after the input (Figure
    4.4):


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_90_3.png)


    Figure 4.4


    ```

    <input type="text" name="username" id="username" value="

    <?php if (isset($_POST[''username''])) echo htmlspecialchars(

    $_POST[''username'']); ?>" ?><?php if (/* error on this input */)

    echo '' class="error"''; ?> /> <?php if (/* error on this input */)

    echo ''<span class="error">''. /* error message */ .''</span>''; ?>

    ```


    As you can tell, there''s a lot of logic going into these inputs and their error
    handling, and they haven''t even addressed Magic Quotes yet. The code above is
    just a mess to look at; it''ll need to be used a dozen times; and if you later
    decide to handle things differently, you''ll be editing code all day. So instead,
    let''s write one function that does all this automatically. In Chapter 5, "Managing
    Site Content," forms will also contain textareas, so this function will be flexible
    enough to handle those, too.'
