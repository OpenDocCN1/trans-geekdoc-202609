- pgno: 202
  md: "# # Prepared Statements\n\nIn database-based applications, many times the same\
    \ query will be executed repeatedly using just slightly different parameters.\
    \ For example, a query that paginates some results varies in its LIMIT clause:\n\
    \n```\n```sql\nSELECT * FROM tablename LIMIT 0, 20\nSELECT * FROM tablename LIMIT\
    \ 20, 20\nSELECT * FROM tablename LIMIT 40, 20\n```\n```\n\nAn INSERT query varies\
    \ in the values being inserted:\n\n```\n```sql\nINSERT INTO tablename (column1,\
    \ column2) VALUES ('value1', 'value2')\nINSERT INTO tablename (column1, column2)\
    \ VALUES ('valueX', 'valueY')\n```\n```\n\nUnlike those five queries, which include\
    \ the table references and the data to be used, a prepared statement separates\
    \ the static content from the dynamic values, using placeholders for the latter:\n\
    \n```\n```sql\nSELECT * FROM tablename LIMIT ?, 20\nINSERT INTO tablename (column1,\
    \ column2) VALUES (?, ?)\n```\n```\n\nThe database is then asked to “prepare”\
    \ the statement, at which point the database will confirm that the query is syntactically\
    \ valid (assuming that values will later be provided for each placeholder). There\
    \ can be a performance benefit to this approach, since the database can cache\
    \ the preparation of the query, making subsequent uses of the same prepared statement\
    \ faster. The next steps provide a value for all the placeholders and execute\
    \ the query.\n\nIn terms of your PHP code, this is how you go about using a prepared\
    \ statement...\n\n**tip**\n\nThis query comes from Chapter 4, “User Accounts.”\n\
    \nStart by defining the query, using question marks to indicate the values to\
    \ be provided later. For example, if the site had a login functionality, its query\
    \ might look like:\n\n```\n```php\n$q = 'SELECT id, username, type, IF(date_expires\
    \ >= NOW(), true, false)\n   FROM users WHERE (email=? and password=?);';\n```\n\
    ```\n\nThen, call the mysqli_prepare() function, providing it with the database\
    \ connection and the query:\n\n```\n```php\n$stmt = mysqli_prepare($dbc, $q);\n\
    ```\n```\n\n**note**\n\nIt’s very important that you don’t quote any placeholders,\
    \ even if their values will be strings.\n\nThis function returns a MySQLi_STMT\
    \ object, which will be used by later functions."
  merge: -1
  img_proc: true
- pgno: 203
  md: 'If you want to see any error that might have occurred, you could next do this:


    ```

    if (!$stmt) echo mysqli_stmt_error($stmt);

    ```


    The next step is to *bind* the variables, which is to associate each placeholder
    with a PHP variable:


    ```

    mysqli_stmt_bind_param($stmt, ''ss'', $email, $pass);

    ```


    The first argument is the statement representative variable. The next is an indicator
    of the formats of the various placeholders, using one symbol for each placeholder.
    The available symbols are in Table 7.1.


    # Table 7.1 Bound Value Types


    | Letter | Represents |

    | --- | --- |

    | d | Decimal |

    | i | Integer |

    | b | Blob (binary data) |

    | s | All other types |


    For this query, there are two placeholders and both will be strings (that is,
    not decimals, integers, or blobs). The `mysqli_stmt_bind_params()` function then
    takes one variable for each placeholder. These variables can have any valid name
    and wouldn''t necessarily be existing variables prior to this point, because it''s
    after this point that each variable is normally assigned a value:


    ```

    $email = $_POST[''email''];

    $pass = get_password_hash($_POST[''pass'']);

    ```


    Finally, execute the statement:


    ```

    mysqli_stmt_execute($stmt);

    ```


    To clarify a common point of confusion, the variables bound to the placeholders
    must have their appropriate values when the `mysqli_stmt_execute()` function is
    called. As you''ll see in a later chapter, this means that you can prepare and
    bind a statement, then associate values to use within a loop or other control
    structure.


    Also, and more importantly, you do not need to take any extra steps to prevent
    SQL Injection attacks because the prepared statements already prevent those simply
    by separating the values from the rest of the query.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'For UPDATE and INSERT queries, you can confirm that a record was affected using:


    ```

    if (mysqli_stmt_affected_rows($stmt) == 1) {

    ```


    For SELECT queries, to count the number of returned rows, do this:


    ```

    mysqli_stmt_store_result($stmt);

    if (mysqli_stmt_num_rows($stmt) >= 1) {

    ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_204_0.png)


    Chapter 11, “Site Administration,” will use prepared statements exclusively.


    Once you’re finished with the prepared statement, you can close it and free up
    the resources:


    ```

    mysqli_stmt_close($stmt);

    ```


    All the previous code demonstrates inbound prepared statements, in which the values
    used in a query come from variables. You can also use outbound prepared statements—with
    or without inbound parameters—in which case the query’s results are assigned to
    variables. Assuming the earlier query returned a row, you could then use:


    ```

    mysqli_stmt_store_result($stmt);

    if (mysqli_stmt_num_rows($stmt) == 1) {

    mysqli_stmt_bind_result($stmt, $id, $username, $type, $expired);

    mysqli_stmt_fetch($stmt);

    ```


    At this point, the $id, $username, $type, and $expired variables have the values
    returned by the database.


    If your server configuration does not support prepared statements, the solution
    is simple: Use mysqli_query() and the other standard functions as you normally
    would. Just make sure you use an escaping function and other techniques to prevent
    SQL Injection attacks.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_204_1.png)


    Both stored procedures and stored functions fall under the general category of
    stored routines.


    # Stored Procedures


    Stored procedures, new-(ish) to MySQL but present in other database applications
    for years, is simply a way to define blocks of code within the database itself.
    Instead of running a query on the database, you call the corresponding stored
    procedure, which will do the querying for you.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_204_2.png)


    I’m just introducing the concept of stored procedures here; later chapters will
    present much more context and syntax.


    Stored procedures can offer the following benefits:


    +   - Improved security

    +   - Better performance

    +   - Cleaner model-controller separation

    +   - Increased application portability'
  merge: -1
  img_proc: true
- pgno: 205
  md: "The most important of these is security. Because routines are stored within\
    \ the database itself, the programming interface—PHP in this case—will not have\
    \ direct access to the underlying tables and data. In fact, the interface wouldn’t\
    \ even need to know what tables and columns exist when stored procedures are used.\n\
    \nYou can get better performance with a stored procedure in two ways. First, as\
    \ you’ll see, stored procedures require that less data be sent to the database,\
    \ because you’ll mostly be sending just values without any SQL (this is another\
    \ security benefit). Second, stored procedures can be cached and managed so that\
    \ the database executes them as efficiently as possible.\n\nThe cleaner model-controller\
    \ separation is obvious: more logic goes into the database, removing SQL from\
    \ the PHP code.\n\nAs for the increased application portability, this is both\
    \ true and not. Because the logic will be stored in the database, other interfaces,\
    \ like a Java application or the command line, can invoke the stored procedures\
    \ in exactly the same way (this may or may not be beneficial to you). On the other\
    \ hand, with the logic stored in the database, you could not as easily change\
    \ the database application in use. But to be frank, I’ve been doing Web development\
    \ for over a decade now and have had to change a Web application from one database\
    \ server to another...just about never.\n\nStored procedures are created using\
    \ this SQL command:\n\n```\n```\nCREATE PROCEDURE name (arguments)\nBEGIN\nCODE\n\
    END\n```\n```\n\nThe procedure’s name can contain letters, numbers, and the underscore,\
    \ but avoid using the same name as an existing MySQL function, keyword, database\
    \ name, or table name.\n\nFor the procedure’s arguments, give each argument a\
    \ name and a MySQL-defined type, with multiple arguments separated by a comma:\n\
    \n```\n```\nCREATE PROCEDURE do_this(age INT, name VARCHAR(20)...\n```\n```\n\n\
    Again, stick to letters, numbers, and the underscore, and avoid using existing\
    \ names and keywords for the argument names. Note that these are MySQL stored\
    \ procedure variables, not PHP ones, so there are no dollar signs. The variable\
    \ types are also basic, omitting extra qualities such as UNSIGNED or NOT NULL.\n\
    \n> **note**\n> \n> I ran a few informal benchmarks and saw this book's stored\
    \ procedures running significantly faster than the literal queries.\n\n> **note**\n\
    > \n> Stored procedures are associated with a specific database and become part\
    \ of its definition.\n\n> **note**\n> \n> As stored procedures transfer more of\
    \ the processing load from the Web server to the database server, you may find\
    \ the database server becomes overloaded more quickly.\n\n> **note**\n> \n> Banks\
    \ and other extremely secure environments rely on stored procedures for increased\
    \ security.\n\n> **note**\n> \n> You must use parentheses for the procedure’s\
    \ arguments, even if there are none."
  merge: -1
  img_proc: true
- pgno: 206
  md: 'The BEGIN and END blocks aren’t required with only a single command, but I
    think it’s best to still use them.


    The CODE part is where the magic happens. In this section you can execute SQL
    queries, create and manipulate variables, use control structures (conditionals
    and loops), and so forth. In layman’s terms, whatever is the result of the CODE
    section will be what’s returned by the stored procedure (that is, what you’d have
    to work with after invoking the stored procedure in PHP).


    There is, however, one little catch: Because MySQL, by default, uses the semicolon
    to terminate SQL commands, any use of a semicolon within the procedure’s definition
    will terminate the definition itself. The workaround is to change the delimiter
    prior to the definition:


    **note**

    As with prepared statements, don’t quote the arguments used within a stored procedure
    query, even if they are strings.


    ```

    DELIMITER $$

    CREATE PROCEDURE name (arguments)

    BEGIN

    CODE

    END$$

    ```


    Figure 7.14 shows a stored procedure being defined using the command-line MySQL
    client.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_206_0.png)


    Figure 7.14


    To execute a stored procedure, use CALL name (arguments) (Figure 7.15).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_206_1.png)


    Figure 7.15'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'In PHP, you can use the mysql_query() function to execute a stored procedure:


    ```

    $r = mysql_query("CALL get_non_coffee_products($id)");

    ```


    Then you can use the mysql_fetch_array() function to get the results.


    The last thing you should know is that you can create stored procedures, using
    phpMyAdmin, the mysql command-line client, or whatever, just as you can execute
    any other query, provided that you''re connected to the database as a user with
    that permission. This is to say that the MySQL user involved must have **CREATE
    ROUTINE** permissions, which will normally also mean they have **ALTER ROUTINE**
    and **EXECUTE** permissions. Unfortunately, I can''t personally say how common
    it is for different Web hosts to allow stored procedures.


    MySQL permissions with respect to stored procedures are more complicated than
    I''m presenting here. See the MySQL manual if you want all the details.


    If your server environment makes using stored procedures impossible, you''ll need
    to move all the logic and SQL back into your PHP scripts, and execute the SQL
    commands as you would standard queries.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 8 | CREATING A CATALOG


    After preparing the server for the site (see the previous chapter), the next step
    is to start creating the catalog, because the customer can’t shop without it.
    To do so, you’ll need to prepopulate the database with some products, since you
    won’t develop the administrative scripts for adding products until Chapter 11,
    “Site Administration.” Then you can write the two PHP scripts for generating the
    catalog: one for browsing by category and a second for listing specific products.


    After that, the chapter demonstrates better ways to show the availability of products
    and any applicable sale prices. From there, you’ll write new PHP scripts for showing
    the sale items on their own.


    If you have intermediate PHP and MySQL experience, nothing in this chapter should
    be too challenging for you, although you will learn some new tricks. The SQL queries
    in this chapter are some of the most complex in the book, and they’ll be wrapped
    inside stored procedures to boot. You’ll also see a real-world way of implementing
    the MVC design pattern in a moderately complex site.


    # PREPARING THE DATABASE


    Half of the database tables will be used by the code in this chapter. In order
    to see any results in the Web browser, you’ll need to insert some records into
    these first. For three of these tables — general_coffees, non_coffee_categories,
    and sizes, there will not be an administration page. The data in all three tables
    should be fairly stable, and if you want administrative capability over them,
    it would be easy enough for you to create corresponding administrative pages yourself.
    For the other three tables — specific_coffees, non_coffee_products,'
  merge: -1
  img_proc: true
