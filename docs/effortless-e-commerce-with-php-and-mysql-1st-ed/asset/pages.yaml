- pgno: 49
  md: 'is secure just because they''ve abided by these requirements. Remember that
    PCI DSS establishes a baseline for the minimum you must do toward improving security.
    If your situation warrants, there are always more steps you can take.


    # SERVER SECURITY


    Most of the rest of the book will address security as affected by the PHP code
    you write, but let''s first look at many of the server-based factors that play
    into the overall security of your e-commerce site. The approach to server security
    is simple:


    +   1. Deny

    +   2. Authorize

    +   3. Record


    You should first deny everybody and everything you can. Then allow limited capability
    only after proper authorization and authentication. Finally, record pretty much
    everything, so that you know what people might be trying to do (but failing) and
    what they did do.


    # Hosting Implications


    The biggest question with respect to server security will be the hosting of the
    site. A shared host will be less secure than a VPS or dedicated hosting plan just
    by the virtue of having more people with access to the server itself. Further,
    any hosting that gives you some administrative-level control over the server can
    be more secure, as you''ll be able to customize how the server runs and better
    lock it down. I would argue, however, that unless you''re an expert in server
    administration, using a managed server is better than trying to do it all by yourself.
    Whatever your situation, do your best to limit the number of people that have
    physical and network access to the server.


    Per the PCI DSS, the server should also be running a firewall and an anti-virus
    program. The anti-virus program has to be kept up to date if it''s to be any good
    at all. But the same can be said for all the software on the server. Quite frequently,
    security holes are introduced when a design flaw (a bug) is found in common applications,
    like the Apache Web server, DNS, or an email system. Upgrading and patching these
    tools when new versions are released is a key component to your server''s security.


    And, of course, you should create very secure passwords for accessing the server
    and change them regularly.


    **tip**

    A public Web page has an opposite security model: anyone and everyone is allowed
    to view it.


    **note**

    An organization''s own employees can be a weak security link. Be aware of the
    potential for “inside jobs.”


    **tip**

    Subscribe to software mailing lists so that you''re contacted when new versions
    are released.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Finally, use the server''s logs to track who accesses a site and when. This
    way you have a record of who could have done something bad. You may also want
    to be notified (via email or text message) when anyone logs in to the server at
    all.


    The PHP manual lists other security recommendations depending upon PHP''s relationship
    to the Web server (CGI binary versus Apache module).


    # PHP and Web Security


    A secondary level of security is controlled by how the Web server (for example,
    Apache, IIS, and so on) and PHP are configured. First, keep both up to date, along
    with any related software. Specific security issues will depend upon the actual
    Web server in use, so research and stay up to date on security factors surrounding
    your particular Web server. By learning more about Apache, for example, you’ll
    find that the DocumentRoot directive, which limits the Web server to working only
    with files found within that directory, can be a great security asset.


    The recommendation used to be to run PHP in safe mode, but that was never a great
    solution and has been deprecated.


    There are a number of adjustments you can make as to how PHP runs. The current
    settings can be seen by invoking the phpinfo() function (Figure 2.4). You’ll find
    each setting listed with two columns: Local Value and Master Value. The local
    column indicates settings that are being overridden within the current directory.


    | Directive | Local Value | Master Value |

    |---|---|---|

    | allow_call_time_pass_reference | On | On |

    | allow_url_fopen | On | On |

    | allow_url_include | Off | Off |

    | always_populate_raw_post_data | Off | Off |

    | arg_separator.input | & | & |

    | arg_separator.output | & | & |

    | asp_tags | Off | Off |

    | auto_append_file | no value | no value |


    Figure 2.4


    Don''t leave a phpinfo() script publicly available on your server. It displays
    too much information about your server!


    To change how PHP runs, edit the php.ini configuration file. The phpinfo() function
    also reveals its location. Some PHP settings can be set within a PHP script; although
    in terms of security, it’s best to make the change on a global basis (otherwise,
    if you forget to make the change in any given script, you’d create a security
    hole).


    After making changes to the Web server or PHP configuration, restart the Web server
    to enact those changes.


    You should start by using the open_basedir setting. It limits the directories
    from which PHP can open files. If you set this value to your Web directory, or
    the parent of the Web directory, malicious PHP code can’t be used to read important
    system files located in other places.


    On a similar note, you should, if you can, take advantage of non-Web directories
    as a place to store sensitive information. For example, your URL, www.example.com,
    might point to the actual server directory /var/www/username/htdocs, so that loading
    http://www.example.com/home.php'
  merge: -1
  img_proc: true
- pgno: 51
  md: "executes (through the Web browser) /var/www/username/htdocs/home.php (Figure\
    \ 2.5 on the next page). In this case, the htdocs folder is called the Web root\
    \ directory. Anything placed within that directory is theoretically accessible\
    \ via the HTTP protocol. For example, the image.png file stored in the images\
    \ subdirectory is available via http://www.example.com/images/image.png. Anything\
    \ stored above the htdocs directory — /var/www/username, the parent of the Web\
    \ directory — is not available via HTTP. Files and folders placed there can still\
    \ be accessed by PHP running on the server, but cannot be directly accessed remotely\
    \ via HTTP.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_51_0.png)\n\n# Figure\
    \ 2.5\n\nA second setting you can change is to disable register_globals. This\
    \ setting makes global variables available in the local scope and is not inherently\
    \ insecure: A properly written program will be just as safe, regardless of this\
    \ setting. For that matter, disabling this setting does not mean your site will\
    \ necessarily be secure. But disabling register_globals means not having to worry\
    \ about someone's casual programming mistake creating a potential vulnerability.\
    \ If you use third-party software, such as PHP-based forums and other add-ons,\
    \ there's even more reason to disable register_globals.\n\n> **note**\n> \n> The\
    \ register_globals directive, along with safe_mode, Magic Quotes, and others,\
    \ has been deprecated and will disappear from future versions of PHP.\n\nHow errors\
    \ are handled can often undermine the security, and the professionalism, of a\
    \ Web site. A common attack is for hackers to supply problematic data in the hopes\
    \ that generated errors will be revealing. To safeguard against this type of attack,\
    \ start by developing your site under the error level of E_ALL | E_STRICT. By\
    \ doing so, any potential problem will be reported to you via email or a log.\
    \ Then, before the site goes live, disable display_errors so that no PHP problem\
    \ will be shown to the user. Instead, use a custom error"
  merge: -1
  img_proc: true
- pgno: 52
  md: 'handler that displays appropriate messages to end users and reports detailed,
    technical messages only to you. You''ll see specific code for doing this in the
    example chapters.


    *nix is a common abbreviation for Unix and Unix-like operating systems, such as
    Linux.


    If you''re using a shared host, another recommendation I''d make is to change
    the session directory. By default, PHP will write all session data to a common,
    temporary directory, such as `/tmp` on *nix systems. But this directory is readable
    and writable by anyone on the server, meaning that any user on the server — and
    a shared host may have dozens — can read the session data stored therein. A better
    alternative is to create a writable directory within your own, private area of
    the server that only your site will use for the sessions.


    My final PHP recommendation isn''t a setting, but involves practices you won''t
    see me do elsewhere, so I want it to be clear now. You should absolutely avoid
    using functions that execute code on the server, such as `system()` and `exec()`.
    Also, be careful when using any function that manipulates server files and directories,
    whether that means creating, opening, reading, or writing. When you must manipulate
    server files and directories, be 100 percent certain that you''re using thoroughly
    validated data in these function calls, not unvalidated user-supplied data.


    # Database Security


    See the MySQL manual, or my book *MySQL: Visual QuickStart Guide, 2nd Edition*
    (Peachpit Press, 0-321-37573-4) for instructions on creating MySQL users.


    Even if your Web site will not be storing the most dangerous customer information
    —their credit card data —the database needs to be thoroughly protected, as the
    breach of any customer information is a huge business liability.


    The front line of database defense is MySQL''s access privileges system. MySQL
    allows you to create specific users that have limited permissions on only particular
    databases. Users are identified by the combination of their name, password, and
    host (that is, which computer the user is on). To start, create unique, secure
    usernames with unique, extremely secure passwords. And, as with pretty much everything,
    it''s really best to change those passwords regularly. Also, be certain to change
    the root user''s password on a new MySQL installation.


    Delete any databases whose name begins with "test," because MySQL allows any user
    to connect to them.


    Next, every MySQL user should only be able to connect to MySQL from `localhost`
    or `127.0.0.1` (that is, from the same server). If MySQL is running on a machine
    separate from the Web server, you can create a MySQL user that has permission
    to connect only from that other server''s IP address. An added benefit of restricting
    users to just `127.0.0.1` and specific IP addresses (if other IP addresses are
    absolutely necessary) is that you can then run MySQL with the `--skip-name-resolve`
    and `--skip-networking` options. This is more secure and will improve performance,
    because MySQL won''t need to resolve host names.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'You should also create separate MySQL users for different types of activity.
    For example, the administrator user for the site will need **SELECT**, **INSERT**,
    and **UPDATE** permissions. They may also need **DELETE**, but it’s best not to
    allow that unless absolutely necessary. Conversely, almost everything a customer
    will do on an e-commerce site will only require a MySQL user with **SELECT** privileges.
    Browsing and searching the catalog are simple **SELECT** queries. It may not be
    until the user starts to complete an order—actually check out—that an **INSERT**
    is required. An **UPDATE** would be needed if they can change their password or
    other personal information. **DELETE** permissions would never be appropriate.
    In theory, you could create three distinct types of MySQL users with specific
    permissions:


    +   - Public: **SELECT**

    +   - Customer: **SELECT**, **INSERT**, **UPDATE**

    +   - Admin: **SELECT**, **INSERT**, **UPDATE**, **DELETE**


    By taking this approach, any potential vulnerability that exists in the bulk of
    the site could not damage the database. The MySQL users with more privileges might
    only be connecting in areas that require customer or administrator login and an
    SSL connection, so there would be some added built-in safety there.


    You should avoid giving **PROCESS**, **FILE**, **SHUTDOWN**, **GRANT**, **RELOAD**,
    **DROP**, **ALTER**, and **CREATE** privileges to any MySQL user that will be
    connecting from a Web site. If that site can be hacked, then the cracker will
    have too much database power. Instead, create a database administrator, for one
    or a limited number of databases, and only use that account to create and manage
    the database through a command-line interface, if at all possible.


    In order to get data to and from the MySQL server in the most secure way possible,
    you can use SSL. This is only necessary when MySQL and PHP are running on separate
    machines, of course, and when the data is particularly sensitive. See the MySQL
    manual for instructions on setting up MySQL for your server’s operating system
    and MySQL version. Understand that there will be performance degradation when
    using SSL with MySQL, due to the extra encryption and decryption work involved.


    For the purposes of security, separation of site logic, and performance, you should
    consider putting as much functionality in the database as possible. This includes
    using view tables, stored procedures, triggers, and so forth. The *Coffee* site
    example in Part Three, “Selling Physical Products,” of the book will demonstrate
    this point concretely.


    > **tip**

    > Simplifying MySQL user permissions will also improve performance, because permissions
    have to be checked with each query.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'As a final note, the MySQL server itself (the process known as mysqld) is a
    system process that is run by a specific operating system user (that is, the server
    process does not run as one of the MySQL database users). While it used to be
    common to run the mysqld process as the computer''s root user, you should not
    do this. There are MySQL commands that manipulate the file system; if MySQL is
    running with ultimate authority, then it can manipulate any file on the server.
    Instead, run mysqld as a different, limited computer user.


    # SECURE TRANSACTIONS


    > **note**

    > Transmitted data will pass through any number of computers between the client
    and the server, which is why SSL is necessary.


    Secure Sockets Layer (SSL) defines a protocol for protecting data transmitted
    over public networks. SSL is an absolute must for e-commerce sites and for many
    non-e-commerce sites, too. SSL provides encryption and decryption of data passed
    back and forth between the server and the client, making it safe from potentially
    prying eyes. If your site properly uses SSL, the user will see a closed lock icon
    in their browser (Figure 2.6). If the site improperly uses SSL, such as serving
    a mixture of SSL and non-SSL content, the user will see a broken lock icon (or
    one with a warning, Figure 2.7). Each browser behaves a bit differently, but for
    those users who pay attention to such things (and you do, don''t you?), this visual
    indicator is a reassurance that it''s safe to provide their most critical personal
    information.


    > **note**

    > SSL should be used whenever it would be a problem if the data being transmitted
    could be seen by others.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_54_0.png)


    > **note**

    > In cases where sensitive form data is submitted, you should display AND handle
    the form using an SSL connection.


    +   The process works like this:

    +   1. The browser makes an SSL request of a server.

    +   2. The server sends a digital certificate to the browser.

    +   3. The browser indicates what encryption it supports.

    +   4. The server selects the best encryption possible.

    +   5. Encryption keys are generated by the browser and server for the session.


    These steps are required only the first time the browser makes an SSL request
    from that server; subsequent requests will use the encryption keys already created.


    > **tip**

    > Cookies can be restricted so that they''re sent only over secure connections.


    To use SSL, you must first buy a certificate. In terms of actual security, the
    digital certificate acts as the public key used for the encryption. In terms of
    perceived security, a certificate is intended to reassure the user that SSL is
    properly in place, that the underlying business is legitimate—that it''s been'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'verified—and that the site is therefore safe to use. Browsers provide a way
    for users to view the certificate’s details (Figure 2.8 on the next page), although
    I don’t know how commonly most people do this. If there’s a mismatch between the
    certificate and how it’s being used, or if you use a less secure certificate (like
    a self-signed one), the browser may even directly warn the user of the potential
    danger. Figure 2.9, which shows a Firefox response, is explicitly telling the
    user not to trust the site and the user has to take extra steps in order to proceed.
    If your site displayed this message to the user, it would be very bad for your
    business.


    > Failing to provide all the content on an HTTPS page—the HTML, the media, the
    JavaScript, the CSS, and so on—through the HTTPS protocol can create a broken
    lock icon in the browser.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_55_0.png)


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_55_1.png)


    A certificate can be purchased from any number of Certifying Authorities (CA),
    from security specialists like Thawte (www.thawte.com) and VeriSign (www.verisign.com)
    to simple resellers such as GoDaddy (www.godaddy.com), to possibly your own hosting
    company. Built into all major browsers is a list of 50-plus major Certifying Authorities
    that are to be trusted. When you purchase a certificate from a major company,
    you’re buying, in part, the assurance that the user’s browser isn’t going to warn
    them about the validity of the certificate (as in Figure 2.9). That’s a legitimate
    reason to purchase a quality certificate instead of using a cheaper one. Each
    of these companies also sells levels of certificates at different prices, which
    is the next consideration.


    > SSL can be used to secure lots of connection types, not just HTTP, but also
    FTP, SMTP, and so forth.


    > As already stated, because of the extra encryption work involved, servers can
    handle only a fraction—one-tenth is a reasonable rule of thumb—of SSL requests
    compared to non-SSL ones.


    In terms of actual security (not perceived), one thing that may cost more is the
    maximum level of encryption used, from 40-bit to 256-bit. The higher the encryption,
    the better, although the maximum actual encryption level that will be used will
    depend upon the Web server and the browser involved in the transaction. A 128-bit
    security is fine for most sites; 256-bit is the online-banking level.


    Next, some certificates come with warranties to reimburse you in case of a failure.
    The cheapest GoDaddy certificates might insure you for up to $2,000; expensive
    VeriSign ones cover up to $250,000. That’s a big difference.'
