    # PREPARING THE SITE


    Before implementing the actual checkout.php script (the first in the checkout
    process), there''s some background work to do. This includes creating the required
    stored procedures (for every database query), creating a modified HTML template,
    and defining one helper function. Let''s look at the template first, because it''s
    the simplest task to complete.


    # The New HTML Template


    At car dealerships, customers are able to roam around the lot and look at all
    the pretty, shiny vehicles. They can look at this one, then that one, and then
    compare those with another. But when it comes time to buy, the dealership locks
    the customer in a room with a salesperson whose job it is to close the sale without
    any distractions. With an e-commerce site, you want to pretty much do the same
    thing...


    At first, the customer should be free to roam about the site, eyeing the products,
    and enjoying the “window shopping” opportunity. The online catalog, developed
    in Chapter 8, “Creating a Catalog,” has this approach: It’s designed so that it’s
    easy for the customer to get around, look at products, and put them into his or
    her cart. But the checkout process should be different: The sole purpose is to
    get the customer to complete the sale. Toward that end, the HTML template needs
    to be changed for this process, discouraging the customer from doing anything
    but completing the sale. Specifically, the template should remove the shopping-related
    links so that the customer stays on track


    > Do not attempt to change the password of a test account, because multiple test
    users share the same credentials.


    > A different template is also a visual cue to the customer that they are in “purchase”
    mode instead of “browsing” mode.'
