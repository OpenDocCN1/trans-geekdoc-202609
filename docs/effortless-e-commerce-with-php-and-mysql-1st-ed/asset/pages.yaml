- pgno: 61
  md: 'credits are processed. Now say that Alice is an administrator who went to your
    site, was authenticated, and did whatever (it doesn''t matter whether she used
    the add credit system or not). If Alice doesn''t log out, there''s still a cookie
    in her browser indicating that she''s an authenticated user of your site. Next,
    Alice comes across some page in which hacker Bob has identified a PHP script as
    the source for an image tag:


    ```

    <img src="http://www.yoursite.com/add_credits.php?user=12&credits=-100" />

    ```


    This might be a public forum, or a review system, or any site that allows users
    to post images in some way.


    When Alice loads the page with that image tag, her browser will make a request
    for the add_credits.php script on your site, passing along the user and credits
    numbers. This request will look, to the server, exactly the same as if Alice had
    consciously gone to the add_scripts.php page. That page will first confirm that
    the requesting user is authenticated, which Alice is. The page would then, in
    theory, perform whatever action is the result of receiving those two values in
    the URL.


    This is a blind attack in that the original hacker Bob will never see the results
    of the request being made: He''s just putting this out there in the hopes that,
    in this case, his account at your site gets credited when some authenticated user
    stumbles upon this code. Know that just authenticating the user will not prevent
    this kind of attack, because it''s that trust that makes this kind of attack plausible.


    To prevent a CSRF attack, start by teaching your administrators to log out. Then,
    restrict the lifetime of an authentication cookie so that it will expire some
    minutes after they''ve stopped being active on your site (online banks may only
    allow ten or fifteen minutes of user inactivity). This will narrow the window
    of CSRF danger to just that brief cookie lifetime.


    > CSRF attacks are more successful against very popular sites that use long-lasting
    cookies.


    Not making sensitive information (like a user ID value) public is also important,
    but just relying on a hacker not knowing about something isn''t real security.
    Although it''s possible to perform CSRF requests via POST, relying upon posted
    data for sensitive requests is more secure (and is in keeping with the approach
    that POST is to be used when a request will result in site changes).


    The true CSRF prevention comes from guaranteeing that sensitive requests, like
    the transfer of credits, are actually prompted by your own site. You cannot reliably
    use a browser''s “referrer” value (that is, what page the browser was on before
    this one), though. Instead, create your own tie between the HTML'
