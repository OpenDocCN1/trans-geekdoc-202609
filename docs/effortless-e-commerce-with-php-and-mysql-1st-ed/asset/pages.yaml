    The views directory will store files that represent individual snippets of HTML.
    These will be used to display elements such as:


    +   - The contents of the home page

    +   - The shopping cart

    +   - The wish list

    +   - A listing of categories

    +   - A listing of products


    The views directory is part of the MVC breakdown that the site uses. Next, you’ll
    see how to protect this and the other sensitive directories from prying eyes.


    # Customizing the Server Behavior


    For this site, you need to customize how your server runs in four ways. Your ability
    to perform any of these alterations will depend upon your hosting situation, although
    most hosts will allow at least two of the four alterations. The specific steps
    involved will depend upon your hosting situation and the Web server application
    (such as, Apache, IIS, and so on) involved. Here, I’ll provide instructions for
    Apache, the most common Web server.


    > > **note**

    > > Make sure you know what Web server application is being used on your server!


    # APPLYING PASSWORD PROTECTION


    The administration directory needs to be password protected so that only authenticated
    users can access its contents. If you want to get your hands dirty, you can accomplish
    this by connecting to your server via a command-line interface and executing the
    proper commands (search online for what those would be). Or, most likely, your
    Web host provides a way to password protect a directory through the site’s control
    panel (Figure 7.6).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_189_1.png)


    # Figure 7.6'
