  md: 'malicious JavaScript is executed, to his detriment. The JavaScript might be
    used to read Bob''s cookies or execute code found on Alice''s site. Bob is the
    victim, and your site was an accomplice.


    **tip**


    If you want to allow some HTML in user content, the second argument to the strip_tags()
    function lets you dictate what specific tags are acceptable.


    As scary as XSS may sound, preventing it is really quite simple. As always, you
    must validate user input. Admittedly, in a case like comments or reviews, you
    can''t really come up with a strict model for what the submission should contain
    (compared to, say, an email address that has a precise format). However, you do
    know that it shouldn''t contain JavaScript. By applying the strip_tags() function,
    which removes any HTML, JavaScript, or PHP from a string, to any user-provided
    input that will be redisplayed in the Web browser, you can prevent XSS attacks.


    **note**


    Since a site would logically have fewer constraints on administrator-supplied
    content, it''s that much more critical that you can trust those with admin access.


    Another way to protect users is to educate them about common scams, potentially
    involving your site or not. The Web site associated with my personal bank does
    an excellent job of sending out emails indicating fake scams making the rounds.
    They also make it clear that they would never ask for certain types of personal
    information through email, stating that you should never send such information
    in any email reply.


    Another recommendation for protecting users involves protecting their account.
    When people attempt to log in to your site, using a combination of a username
    or email address and a password, you have a choice as to how mistakes are reported.
    Indicating that just the password is wrong verifies that a submitted username
    or email address does exist in the database. This gives any potential hacker half
    of the equation; from there they can continue trying common passwords in order
    to access the user''s actual account. Instead, just indicate that the combination
    does not match the database: Such a message doesn''t confirm the validity of a
    given email address or username.


    **tip**


    Notifying customers of security issues not only protects them, but it also makes
    your site look good.


    # Protecting the Site


    The Web site itself is the agent between the customer and the data, and it, too,
    has vulnerabilities. The first kind of attacks to be aware of are Denial of Service
    (DoS) attacks. These are brute force attacks where many zombie or slave servers,
    all around the world, attempt to connect to your site simultaneously. By doing
    so, your server will be so overwhelmed that it will not be able to handle legitimate
    requests. Unfortunately, there''s not much you can do to prevent a DoS attack.
    Even if you have lots and lots of servers, all around the world, service denial
    can still happen (it has happened to even the biggest sites). But by closing unused
    server ports, using a firewall, and monitoring network activity, you can minimize
    the potential. Fortunately, you have to be'
