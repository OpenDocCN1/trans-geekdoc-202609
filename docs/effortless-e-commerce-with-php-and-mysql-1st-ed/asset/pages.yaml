  md: "# **2. Include the configuration file:**\n\n```\n```php\n<?php\nrequire ('./includes/config.inc.php');\n\
    ```\n```\n\n# **3. Validate the product type:**\n\n```\n```php\nif (isset($_GET['type'])\
    \ && ($_GET['type'] == 'goodies')) {\n   $page_title = 'Our Goodies, by Category';\n\
    \   $sp_type = 'other';\n   $type = 'goodies';\n} else { // Default is coffee!\n\
    \   $page_title = 'Our Coffee Products';\n   $type = $sp_type = 'coffee';\n}\n\
    ```\n```\n\nThe product type can be one of only two values: *goodies* or *coffee*.\
    \ The default product type to display will always be coffee, so the first part\
    \ of the conditional just checks if `$_GET['type']` is set and if it equals *goodies*.\
    \ For each condition, the page's title is determined, and the `$type` and `$sp_type`\
    \ variables are assigned appropriate values. Two variables are required here because\
    \ the Web site uses the term *goodies*, but the database uses the term *other*.\
    \ If the same term were used in both cases, you could use just one variable. The\
    \ `$sp_type` variable represents what the stored procedure expects.\n\nThe assignment\
    \ of *coffee* to both `$sp_type` and `$type` in one line is possible as the assignment\
    \ will occur from right to left. First, `$sp_type` is assigned the value *coffee*,\
    \ then `$type` is assigned the value of `$sp_type`.\n\n> > **note**\n> >\n> >\
    \ I use “goodies” in the viewable site instead of “other” because it’s more meaningful\
    \ to users and search engines (in theory).\n\n# **4. Include the header file and\
    \ the database connection:**\n\n```\n```php\ninclude ('./includes/header.html');\n\
    require (MYSQL);\n```\n```\n\n# **5. Call the stored procedure:**\n\n```\n```php\n\
    $r = mysqli_query($dbc, \"CALL select_categories('$sp_type')\");\n```\n```\n\n\
    This one line is all you need to invoke the stored procedure for either type.\
    \ Because the `$sp_type` value will be a string, it must be quoted when you pass\
    \ it to the stored procedure. The root SQL command is the same that would be run\
    \ in the *mysql* client or phpMyAdmin:\n\n```\nCALL select_categories('coffee')\n\
    ```\n\nor\n\n```\nCALL select_categories('other')\n```"
