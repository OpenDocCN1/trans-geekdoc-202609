    This count will act as an indicator of which orders have been completed and

    which have not.


    +   4. Define and execute the query:


    ```

    $q = ''SELECT o.id, total, c.id AS cid, CONCAT(last_name, ", ", first_name)

    AS name, city, state, zip, COUNT(oc.id) AS items FROM orders AS o LEFT

    OUTER JOIN order_contents AS oc ON (oc.order_id=o.id AND

    oc.ship_date IS NULL) JOIN customers AS c ON (o.customer_id = c.id)

    JOIN transactions AS t ON (t.order_id=o.id AND t.response_code=1)

    GROUP BY o.id DESC'';

    ```


    The query needs to join the orders, order_contents, customers, and

    transactions tables. To retrieve the count of items left to ship in an order,

    the query uses a LEFT OUTER JOIN between orders and order_contents

    where the order ID matches, but the ship_date is NULL. The effect of this

    condition is that only order_content records without ship dates will be

    matched to orders. This is strictly for the purpose of indicating nonfulfilled

    orders; viewing any particular order will show the complete contents,

    whether they have shipped or not.


    Only orders that have a corresponding transaction response code of 1, indicat-

    ing a successful request of the payment gateway, will be returned.


    The orders are listed starting with the newest.


