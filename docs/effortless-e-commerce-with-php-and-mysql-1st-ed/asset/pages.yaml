  md: "+   11. Display the total:\n+   echo '<tr>\n+   <td colspan=\"2\"></td><th\
    \ align=\"right\">Total</th>\n+   <td align=\"right\">$' . number_format($total,\
    \ 2) . '</td>\n+   <td>&nbsp;</td>\n+   </tr>\n+   ';\n\n+   12. If the $Remove\
    \ array isn't empty, remove the problematic items:\n+   if (!empty($Remove)) {\n\
    +   mysqli_next_result($dbc);\n+   foreach ($Remove as $sku => $qty) {\n+   list($sp_type,\
    \ $spid) = parse_sku($sku);\n+   $r = mysqli_multi_query($dbc, \"CALL add_to_wish_list('Suid',\n\
    +   '$sp_type', $spid, $qty);CALL remove_from_cart('Suid',\n+   '$sp_type', $spid)\"\
    );\n+   }\n+   }\n\nIf the $Remove array isn't empty, then at least one product\
    \ in the customer's cart needs to be moved to their wish list. You can accomplish\
    \ that by parsing the SKU, then calling the add_to_wish_list() and remove_from_cart()\
    \ stored procedures for each item. That's what the foreach loop accomplishes.\n\
    \n> tip\n> \n> If, when using stored procedures, you see a “commands out of sync”\
    \ error message, it means that stored procedure results exist that have not been\
    \ retrieved.\n\nBut first, the get_shopping_cart_contents() stored procedure,\
    \ like any procedure that runs a SELECT query, returns two sets of results: the\
    \ SELECT results and results indicating the success of running the procedure.\
    \ These latter results must be addressed before calling another stored procedure.\
    \ The invocation of the mysqli_next_result() function will take care of that.\
    \ It clears this secondary result set.\n\nTo execute the two stored procedures,\
    \ the mysqli_multi_query() function is used instead of two executions of mysqli_query().\
    \ This function, as its name implies, allows more than one query to be executed\
    \ with a single database call.\n\n+   13. Complete the page:\n+   ?>\n+   </table>\n\
