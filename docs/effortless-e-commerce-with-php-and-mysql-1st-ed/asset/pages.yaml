    \ is assigned to a variable for use later in the script.\n\n+   9. Update the\
    \ order_contents table:\n+   \n+   $q = \"UPDATE order_contents SET ship_date=NOW()\
    \ WHERE\n+   order_id=$order_id\";\n+   $r = mysqli_query($dbc, $q);\n+   \n+\
