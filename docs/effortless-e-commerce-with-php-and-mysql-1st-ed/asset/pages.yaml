- pgno: 69
  md: 'This site will not place the administration pages—there are only two being
    developed in this book—in a separate directory, so you don''t have to worry about
    that folder. Also, the initial version of the site won''t need JavaScript or media
    folders. So the Web root directory needs just three subfolders to start, which
    I''ll cleverly name css, images, and includes.


    **tip**


    For marginally improved security, give your includes and administration directories
    non-obvious names.


    The css directory will contain one file, from the site template, named styles.css
    (more on the template later in the chapter). Eight images that come with the template
    will go into the images folder. The includes directory will store PHP scripts
    that will be included by other scripts. In other words, the includes directory
    is for files that won''t be executed on their own. Over the next three chapters,
    you''ll create six documents for the includes directory:


    **note**


    In Chapter 7, “Second Site: Structure and Design,” you''ll learn other ways to
    protect your site''s directories.


    +   - config.inc.php is a script that defines the site''s general behavior and
    various constants.

    +   - footer.html is half of the HTML template.

    +   - form_functions.inc.php defines a function used by every form.

    +   - header.html is the other half of the HTML template.

    +   - login.inc.php handles the login process.

    +   - login_form.inc.php is the login form.


    As you can tell, I''m breaking out much of the site functionality into separate
    files to make the site easy to maintain.


    Along with all the PHP scripts that represent specific pages, such as registering,
    logging out, and so on, the site needs one more PHP script named mysql.inc.php.
    This script will connect to the database. Because that script defines sensitive
    information, it should ideally be stored outside the Web root directory.


    **note**


    A proxy script is a file that''s used in place of something else, like a PHP script
    that presents a PDF instead of the user accessing the PDF directly.


    The site also needs a folder to store PDFs that are available to paid subscribers.
    The PDFs will be placed in this folder by a script that handles the upload. In
    order to do that, the permissions on the folder must allow the Web server to write
    to it. Since this creates a potential security hole, it''s best to place that
    folder outside the Web root. Additionally, the PDF scripts should be available
    to paid subscribers only, through a proxy script that validates the user. Keeping
    the PDF files from the Web directory prevents unpaid visitors from loading them.'
