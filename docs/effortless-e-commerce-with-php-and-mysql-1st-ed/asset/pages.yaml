    # COMPLETING THE ORDER


    The final.php script is the last page in the checkout process. It should be accessed
    only after a completed sale. In terms of the database, the script should clear
    the carts table, since now those items have been purchased. In terms of the customer,
    the script should:


    +   - Indicate completion of the order

    +   - Offer a receipt

    +   - Send an email confirmation

    +   - Tell the customer what will happen next'
