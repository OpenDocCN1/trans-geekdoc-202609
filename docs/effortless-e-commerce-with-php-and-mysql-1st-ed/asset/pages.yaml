- pgno: 310
  md: '# PROCESSING CREDIT CARDS


    The next step in the checkout sequence is to actually process the payment (this
    is number 3 in Figure 10.14). To do so, the customer information, payment data,
    and order specifics need to be sent to the payment gateway, and the returned response
    needs to be confirmed. With the Authorize.net system, this really isn’t that difficult.
    The site just needs to establish the right settings and use libcurl to contact
    Authorize.net.


    I’ve broken the gateway communication into two scripts: one that establishes the
    particulars to be sent to Authorize.net for a new order and another script that
    performs the actual communication. I separated the functionality this way because
    the administrative pages will also communicate with Authorize.net, passing along
    slightly different information. After completing Chapter 11, “Site Administration,”
    there will be two setup scripts and one process script:


    +   - gateway_setup.php establishes new order parameters.

    +   - gateway_setup_admin.php establishes existing order parameters.

    +   - gateway_process.php establishes common parameters and performs the request.


    After defining two of these here, billing.php will need to be updated to use them.


    # Creating gateway_setup.php


    The payment gateway needs to receive a large number of name=value pairs in each
    request. These pairs communicate to the gateway everything required to process
    the transaction:


    +   - The site''s merchant information

    +   - The customer''s billing information

    +   - The order information

    +   - How data should be returned

    +   - And more


    Each payment gateway differs as to what information needs to be transferred and
    under what naming scheme. For Authorize.net, each name begins with x_.


    The easiest way to start this process is to create an array, which will later
    be turned into the name=value pairs. The gateway_setup.php should create the'
  merge: -1
  img_proc: true
- pgno: 311
  md: "array and populate it with all the information particular to the customer completing\
    \ a new order. Here is that script, in its entirety:\n\n# gateway_setup.php:\n\
    \n```\n<?php\n// Create an array for the information:\n$data = array();\n// Transaction\
    \ type:\n$data['x_type'] = 'AUTH_ONLY';\n// Billing info:\n$data['x_card_num']\
    \ = $cc_number;\n$data['x_exp_date'] = $cc_exp;\n$data['x_card_code'] = $cc_cvv;\n\
    $data['x_first_name'] = $cc_first_name;\n$data['x_last_name'] = $cc_last_name;\n\
    $data['x_address'] = $cc_address;\n$data['x_state'] = $cc_state;\n$data['x_city']\
    \ = $cc_city;\n$data['x_zip'] = $cc_zip;\n```\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_311_0.png)\n\
    \n> **note**\n> \n> When the customer is charged for their order is a policy decision\
    \ that each business will need to make.\n\nFirst, an empty array is created. Next,\
    \ the transaction type is set as AUTH_ONLY. This means that the request will authorize\
    \ that funds be reserved for this merchant from this customer. Later, after taking\
    \ steps in the administration area, a capture request will be made, at which point\
    \ Authorize.net will actually charge the card and transfer the funds. To immediately\
    \ charge the card, the transaction type would be AUTH_CAPTURE.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_311_1.png)\n\
    \n> **note**\n> \n> Different card companies will reserve authorized funds for\
    \ different lengths of time, anywhere from three days to some months.\n\nNext,\
    \ the customer's billing information is assigned. This includes the credit card\
    \ number, the expiration date, the CVV code, the customer's name, and their address.\
    \ All of these values come from local variables found in billing.php.\n\nThis\
    \ is all that needs to be transmitted particular to an original order. The merchant\
    \ information, the order total, order ID, and the customer ID will all be added\
    \ in the next script.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_311_2.png)\n\
    \n> **note**\n> \n> The PHP script does not have the closing PHP tag, because\
    \ this file will be included by billing.php.\n\nBecause the payment-processing\
    \ scripts will contain sensitive information (the next one will especially), I\
    \ recommend storing it outside the Web root directory, if at all possible. If\
    \ not, place gateway_setup.php in the includes directory, but prevent that directory\
    \ from being accessible over the Internet. See Chapter 7 for instructions."
