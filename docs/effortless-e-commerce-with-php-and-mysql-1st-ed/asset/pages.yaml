  img_proc: true
- pgno: 94
  md: "hashes of common words in the hope that she or he finds the matching hash (this\
    \ is called a “dictionary attack”). But storing a hash still makes logging in\
    \ possible: When a user logs in, the hashed version of their login password just\
    \ needs to equal the already stored hashed version. If the two hashes equate,\
    \ the submitted password is correct.\n\n**note**\n\nIf you use an SSL connection\
    \ between PHP and MySQL, sending plain text data back and forth is less dangerous.\n\
    \nOnce you've decided to hash the passwords, you'll need to choose what hashing\
    \ algorithm (or, formula) to use and where the hashing should take place. By the\
    \ latter I mean that you can hash the password in either the database or in your\
    \ PHP code. Normally, I recommend having the database do as much as possible,\
    \ but PHP has more sophisticated hashing functions available than MySQL, and if\
    \ you perform the hash in PHP, you no longer have the risk of sending a plain\
    \ text password to the database.\n\nMD5 is a common, legacy, hashing algorithm,\
    \ but not very secure. An improvement is SHA or SHA1, which is fine for many applications.\
    \ For improved security, I'm going to turn to PHP's relatively new hash_hmac()\
    \ function. This function is part of PHP's Hash extension, enabled by default\
    \ as of PHP 5.1.2.\n\n**note**\n\nYou cannot later change the algorithm for processing\
    \ passwords without resetting every existing user's password.\n\nHashing algorithms\
    \ create hexadecimal representations: fixed strings containing only numbers and\
    \ letters (as in the password and omnivore examples). You can store a hash in\
    \ a database in that format. But as an improvement, it's more efficient to store\
    \ binary data in the database instead of character data, so let's tell the hashing\
    \ function to return binary data. Since binary data can contain characters that\
    \ will break queries (such as a single quotation mark or a backslash), the output\
    \ should still be run through the mysqli_real_escape_string() function. The resulting\
    \ password generating function is defined like so:\n\n```\nfunction get_password_hash($password)\
    \ {\n    global $dbc;\n    return mysqli_real_escape_string ($dbc, hash_hmac('sha256',\n\
    \    $password, 'c#haRl891', true));\n}\n```\n\n**tip**\n\nUse the hash_algos()\
    \ function to see what algorithms your server supports.\n\nThe hash_hmac() function\
    \ takes up to four arguments. The first is the algorithm to use, SHA256 in this\
    \ case. This is an improved version of SHA1.\n\n**tip**\n\nSearch online for more\
    \ information on hashing, algorithms, and keys.\n\nThe second argument is the\
    \ data to be hashed. This will be the value assigned to $password when the get_password_hash()\
    \ function is called.\n\nThe third argument is a hash key, which makes the generated\
    \ hash unique. The same key must be used when comparing two hashes.\n\nThe fourth\
    \ argument is optional. If you use true, the output will be in raw, binary format.\
    \ Otherwise, the output will be hexadecimal characters."
