  md: "# 14. Validate the email address:\n\n```\n```php\nif (filter_var($_POST['email'],\
    \ FILTER_VALIDATE_EMAIL)) {\n    $e = $_POST['email'];\n    $_SESSION['email']\
    \ = $_POST['email'];\n} else {\n    $shipping_errors['email'] = 'Please enter\
    \ a valid email address!';\n}\n```\n```\n\nThanks to the filter_var() function,\
    \ this is the most straightforward of all these validation routines. If your PHP\
    \ installation does not support the Filter extension, you can search online for\
    \ the Perl-Compatible Regular Expression (PCRE) pattern to use instead.\n\nUnlike\
    \ every other variable, the customer's email address will be stored automatically\
    \ in the session so that a receipt can be sent to the customer once the order\
    \ has gone through.\n\n# 15. Store the data in the session if the shipping information\
    \ matches the billing:\n\n```\n```php\nif (isset($_POST['use']) && ($_POST['use']\
    \ == 'Y')) {\n    $_SESSION['shipping_for_billing'] = true;\n    $_SESSION['cc_first_name']\
    \ = $_POST['first_name'];\n    $_SESSION['cc_last_name'] = $_POST['last_name'];\n\
    \    $_SESSION['cc_address'] = $_POST['address1'] . ' ' . $_POST['address2'];\n\
    \    $_SESSION['cc_city'] = $_POST['city'];\n    $_SESSION['cc_state'] = $_POST['state'];\n\
    \    $_SESSION['cc_zip'] = $_POST['zip'];\n}\n```\n```\n\nThe checkout form will\
    \ present the customer with a check box to select if they want the shipping information\
