  md: "# LISTING PRODUCTS\n\nNow that customers can shop by type—coffee and goodies—they\
    \ need to be able to browse through the actual products they can purchase, within\
    \ each type. The page for doing that, browse.php, is written in a very similar\
    \ manner to shop.php, although it uses a different view file to display each product\
    \ type.\n\n# Creating the PHP Script\n\nThe primary difference between shop.php\
    \ and browse.php is that the latter has three values to validate—type, category,\
    \ and ID—instead of just one. Still, even with lots of spacing and comments, the\
    \ result is less than 70 lines long.\n\n+   1. Create a new PHP script in your\
    \ text editor or IDE to be named browse.php and stored in the Web root directory.\n\
    \n+   2. Include the configuration file:\n\n```\n<?php require ('./includes/config.inc.php');\n\
    ```\n\n+   3. Start validating the required values:\n\n```\n$type = $sp_type =\
    \ $sp_cat = $category = false;\nif (isset($_GET['type'], $_GET['category'], $_GET['id'])\
    \ &&\n    filter_var($_GET['id'], FILTER_VALIDATE_INT, array('min_range' => 1)))\n\
    {\n    $category = $_GET['category'];\n    $sp_cat = $_GET['id'];\n```\n\nTo start\
    \ the validation process, four necessary variables are initially set to false,\
    \ requiring the script to prove that everything's okay. Next, the condition checks\
    \ for the presence of three variables in the URL—type, category, and id—and that\
    \ the ID value is an integer greater than 1.\n\nIf all of these conditions are\
    \ true, then two variables are assigned values from the URL. The category value\
    \ will be used as a header in the HTML page. The $sp_cat variable will be used\
    \ in the stored procedure. You really don't need to worry about these variables\
    \ having inappropriate values here. The ID will have already been validated using\
    \ filter_var() and the category value has to match the rewrite rule in the .htaccess\
    \ file (see Chapter 7).\n\n+   4. Validate the product type:\n\n```\nif ($_GET['type']\
    \ == 'goodies') {\n    $sp_type = 'other';\n```"
