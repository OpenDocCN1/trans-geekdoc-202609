- pgno: 407
  md: "You cannot load an external JavaScript file and execute some JavaScript code\
    \ using the same <SCRIPT> block, so the JavaScript code that does the work will\
    \ go within these two tags.\n\n+   3. Within the <SCRIPT> block, add:\n+   $(\"\
    #billing_form\").submit(function(){\n+   });\n\nThis is jQuery magic. The $(\"\
    #billing_form\") part is a way of selecting an element on the page, specifically\
    \ the element with an ID value of billing_form. The .submit() says that when the\
    \ selected element is submitted, the inline function should be executed. That\
    \ function's code comes next.\n\n+   4. Within the curly brackets added in Step\
    \ 3, disable the submit button:\n+   $(\"#billing_form\").submit(function(){\n\
    +   \t$(\"input[type=submit]\", this).attr(\"disabled\", \"disabled\");\n+   });\n\
    \nThe $(\"input[type=submit]\", this) part selects all inputs found within the\
    \ #billing_form element (represented by the special keyword this) whose type is\
    \ submit. The .attr('disabled', 'disabled') code adds the disabled attribute to\
    \ the selected element (the submit input), with a value of disabled. In sum, when\
    \ the form is submitted, JavaScript will dynamically turn the submit button's\
    \ HTML into:\n<input type=\"submit\" value=\"Place Order\" class=\"button\" disabled=\"\
    disabled\" />\n\n> **tip**\n> Alternatively, the submit button can be selected\
    \ by giving it a unique ID and referring to $(\"#submit_id_value\").\n\n> **tip**\n\
    > I chose to format the processing message using the same button class, because\
    \ it's prominent, but you'd likely want to use a style that looks distinctly different\
    \ from the original button.\n\n+   5. On the next line, still within the <SCRIPT>\
    \ block but after the }); just created, add:\n+   $(\"#submit_div\").html('<p\
    \ class=\"button\">Processing...</p>');\n\nYou may be picking up on this already:\
    \ $(\"#submit_div\") selects the element on the page with an ID value of submitDiv.\
    \ The .html() method, applied to that selection, can be used to assign new HTML\
    \ to the element. The specific HTML to be assigned is the <P> tag. The effect\
    \ of this line will be the replacement of the submit button with this message\
    \ (Figure 10.20).\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_407_0.png)\n\nFigure\
    \ 10.20"
  merge: -1
  img_proc: true
- pgno: 408
  md: "+   6. Add an ID attribute to the form with a value of billing_form:\n+   \n\
    +   `<form action=\"/billing.php\" method=\"POST\" id=\"billing_form\">`\n\n+\
    \   7. Add an ID attribute to the DIV that contains the submit button with a value\
    \ of submit_div:\n+   \n+   `<div align=\"center\" id=\"submit_div\">`\n\n+  \
    \ 8. Save the file.\n\n+   9. Test the file in your Web browser.\n+   \n+   If\
    \ you already had the billing.php page open, you'll need to reload the page to\
    \ enable the JavaScript.\n\n**tip**\nDebugging JavaScript can be really tedious\
    \ for the novice. If you have problems, look online for answers or post a question\
    \ in my support forums.\n\n# Improved Gateway Communications\n\nThe gateway_setup.php\
    \ and gateway_process.php scripts are the heart of this e-commerce site: requesting\
    \ monies from the customer and transferring them to the business. With that in\
    \ mind, you may want to add to what these scripts do.\n\nAs a precaution, you\
    \ could add checks to the gateway_process.php script so that it validates the\
    \ required information prior to attempting the cURL request. The problem, as I've\
    \ mentioned before, with one file including another, is that there are often assumptions\
    \ made as to what variables are available and what did or did not happen. Rather\
    \ than rely upon those assumptions, actual validation would be preferred.\n\n\
    Authorize.net also lets you send along your own custom fields as part of the transaction.\
    \ A custom field is simply any piece of data with a name not already reserved\
    \ by the Authorize.net system (essentially, this means anything not named x_something).\
    \ If there is more information you'd like to be associated with the order, you\
    \ can pass that along. Those custom values will be in the returned response (they\
    \ aren't stored in the Authorize.net system) and can appear on the email receipt\
    \ that Authorize.net sends to the customer (if you choose that option). But never\
    \ use custom fields for sensitive information.\n\nFinally, Authorize.net can take\
    \ line items as part of the transaction. This would be useful if you had Authorize.net\
    \ send out the email receipts. See the Authorize.net AIM manual for instructions\
    \ or other possible values."
  merge: -1
  img_proc: true
- pgno: 409
  md: '# # ALTERATIONS AND ADDITIONS


    This chapter concludes the same way as many others: with suggested alterations
    and additions that could be applied specifically to the administration pages.
    Of course, the largest recommendation would be the creation of scripts to update
    products and to add or update the categories. Over time, I’ll develop and post
    some of these to the book’s corresponding Web site.


    # ## Home Page Additions


    The home page as written does literally nothing. What you might put there depends
    upon the site and, frankly, what the administrator would want to see on that page.
    Information that might logically be displayed includes the ten most recent orders
    or any product whose inventory is running low.


    To do the former, just recreate the view_orders.php script, but have the query
    return only ten (or so) records. To do the latter, run a UNION query that retrieves
    every product whose stock value is less than whatever number is appropriate (say,
    5 or 10, depending upon the site’s activity level).


    # ## Viewing Customers


    Because the site does not require that customers register, the order is the most
    important and atomic record stored in the database. For this reason, browsing
    by or searching for specific customers becomes less useful (for example, the same
    customer, if active, might be represented multiple times on the site). If you
    wanted to create the ability to find customers, you could easily apply the view_orders.php
    and view_order.php functionality to view_customers.php and view_customer.php pages.


    > > A bigger change you could make to the site would be to give customers the
    option of registering and logging in.


    # ## Partial Payments


    The Authorize.net payment gateway, like many others, supports the capturing of
    partial payments. For example, a customer might make an order that totals $100.
    The site could easily be modified so that part of the order could be shipped at
    a time, and the corresponding part of the payment would be captured at that time.'
  merge: -1
  img_proc: true
- pgno: 410
  md: "To do this in terms of the `view_order.php` script, you would need to create\
    \ check boxes for each item so that the administrator can indicate which should\
    \ be shipped. Logically, you could place each check box in the Shipped? column,\
    \ in cases where no ship date exists. Each check box should use the `order_contents`\
    \ table ID as its value.\n\nWhen the `view_order.php` form is submitted back to\
    \ the page, the script would need to use all the selected `order_contents` IDs\
    \ to create an order total. You would also need to decide when the shipping charge\
    \ would be captured. The easy solution would be to charge it in entirety the first\
    \ time a partial order is shipped, then not charge it at all on subsequent shipments.\n\
    \nAfter processing the payment, the `ship_date` in the `order_contents` table\
    \ would have to be set to `NOW()` for only those selected items. The same would\
    \ be applied to the inventory updates.\n\n> **tip**\n> \n> The Authorize.net Advanced\
    \ Integration Method (AIM) manual covers partial payments in more detail.\n\n\
    The more complicated alterations would be in how the payments are requested. Instead\
    \ of providing a transaction ID, partial payments use an `x_split_tender_id`.\
    \ For the first partial payment, the split tender ID is returned by Authorize.net.\
    \ This would need to be stored in the database and then provided as part of subsequent\
    \ partial payments (which means the database would need to be restructured some).\
    \ Partial payments also need to be enabled in the Merchant Interface or by passing\
    \ along an `x_allow_partial_auth` value of true.\n\n# ## Viewing Incomplete Orders\n\
    \nThe site as written may record some incomplete orders in the database. This\
    \ would occur if the customer got all the way to the point of submitting the `billing.php`\
    \ form, but failed to use a valid payment method (and never re-submitted the form).\
    \ The administrator should not see such orders in the same way as orders that\
    \ have been approved (that is, the administrator shouldn’t ship out orders for\
    \ which payment hasn’t been authorized), but being aware of such incomplete orders\
    \ would be beneficial.\n\nFor example, a high number of incomplete orders might\
    \ be an indication of a logistical problem with the site or the payment-request\
    \ process. The administrator may also want to follow up with customers who did\
    \ not complete their order, as a customer service (and sales) technique. To list\
    \ incomplete orders, use a query similar to that in `view_orders.php`, but check\
    \ for a response code that’s not 1."
  merge: -1
  img_proc: true
