- pgno: 74
  md: 'The $contact_email variable is for the email address to which error messages
    will be sent when the site goes live. It could also be used for contact forms,
    or you could define different email addresses for different purposes.


    # 3. Define the constants:


    ```

    define (''BASE_URI'', ''/path/to/Web/parent/folder'');

    define (''BASE_URL'', ''www.example.com/'');

    define (''MYSQL'', ''/path/to/mysql.inc.php'');

    ```


    These are the first three constants the site will use, and you''ll need to change
    the values accordingly. The first constant should point to the parent of the Web
    root directory, if your site can use it. So, in Figure 3.2, BASE_URI . pdfs will
    be where the PDFs are stored and BASE_URI . mysql.inc.php will be the location
    of the MySQL connection script. If you can''t access above the Web root directory,
    then assign to BASE_URI the Web root directory itself. So, in Figure 3.3, BASE_URI
    . ''includes/pdfs'' will be where the PDFs are stored.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_74_0.png)


    note


    Both the BASE_URI and BASE_URL values end with a slash.


    The second constant is the base URL of the site, without the protocol, such as
    www.example.com/. I''ve specifically left off the http:// part, because some pages
    will use https://.


    The third constant points to the MySQL connection script just created. You can
    use BASE_URI to help create this full path.


    Constants like these are used for a couple of reasons. First, if you reference
    certain values in multiple scripts in multiple directories, it can be hard getting
    the references consistently correct. By using absolute references, they''ll always
    be right. Second, if you change anything big about the site—its domain name or
    its hosting—just changing these values is all you will need to do.


    # 4. Start the session:


    ```

    session_start();

    ```


    The site will use sessions to track logged-in users. Since every page will require
    the configuration file, starting the session here will make sure that every page
    has access to the session data. Plus, if you want to customize the session, like
    its name or how long it lasts, you can do that in one place.


    On the other hand, this also means that sessions will be started in some situations
    where they''re not actually necessary, like when someone views the home page or
    a content listing page, without going further.'
  merge: -1
