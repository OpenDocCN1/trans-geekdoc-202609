  md: 'procedure can access the user''s cart ID. But to determine the price to be
    paid, factoring in sale prices, requires a JOIN across carts, sales, and either
    non_coffee_products or specific_coffees. Because this last JOIN is across one
    of two tables, a UNION is required, just like the get_shopping_cart_contents()
