- pgno: 404
  md: "At this point, both email bodies have been generated and the email can be created\
    \ and sent.\n\n# **11. Add the library folder to the include path:**\n\n```\n\
    set_include_path('./library/');\n```\n\nThe `Zend_Mail` class may need to include\
    \ other Zend classes, so the entire Zend library folder needs to be added to PHP's\
    \ include path. The path value here is relative to `final.php`, which includes\
    \ `email_receipt.php`.\n\n# **12. Include the `Zend_Mail` class:**\n\n```\ninclude\
    \ ('Zend/Mail.php');\n```\n\n# **13. Create a `Zend_Mail` object:**\n\n```\n$mail\
    \ = new Zend_Mail();\n```\n\nThis line creates a variable named `$mail`, which\
    \ will be an object of type `Zend_Mail`. The rest of the code will use this object.\n\
    \n> **tip**\n> \n> This is a good example how object-oriented programming (OOP)\
    \ allows you to use existing class definitions without knowing much about OOP\
    \ yourself.\n\n# **14. Set the `from` and `to` parameters:**\n\n```\n$mail->setFrom('admin@example.com');\n\
    $mail->addTo($_SESSION['email']);\n```\n\nThe `from` address should be something\
    \ appropriate for the site. The `to` address is the customer's email, stored in\
    \ the session on `checkout.php`. The `addTo()` method is used to add recipients\
    \ to the email.\n\n> **tip**\n> \n> Using `Zend_Mail`, you can send a single email\
    \ to as many recipients as you want, and you can also use Cc and Bcc.\n\n# **15.\
    \ Set the email subject:**\n\n```\n$mail->setSubject(\"Order #{$_SESSION['order_id']}\
    \ at the Coffee Site\");\n```\n\nThe subject includes the order ID.\n\n# **16.\
    \ Set the plain and HTML bodies:**\n\n```\n$mail->setBodyText($body_plain);\n\
    $mail->setBodyHtml($body_html);\n```\n\n> **tip**\n> \n> The Zend Framework manual\
    \ has more on `Zend_Mail`, including how to use a specific SMTP server to send\
    \ the message.\n\n# **17. Send the email:**\n\n```\n$mail->send();\n```\n\n# **18.\
    \ Save the file.**"
