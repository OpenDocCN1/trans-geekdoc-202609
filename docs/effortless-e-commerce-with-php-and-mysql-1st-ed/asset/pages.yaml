- pgno: 91
  md: "+   1. Create a new PHP file in your text editor or IDE to be named\n+   form_functions.inc.php.\n\
    +   \n+   This file should be stored in the includes directory.\n\n> **note**\n\
    > \n> I'm using the plural *functions* in the file name even though only one function\
    \ is being defined. Other functions might be added to it later (in theory).\n\n\
    +   2. Begin defining the function:\n+   \n+   <?php\n+   function create_form_input($name,\
    \ $type, $errors) {\n+   \n+   The function takes three arguments. The first is\
    \ the name that will be given to the element. The second is the element type,\
    \ which will be either *text* or *password* in this chapter, and *textarea* in\
    \ the next. The third argument will be an array of errors.\n\n+   3. Check for\
    \ and process the value:\n+   \n+   $value = false;\n+   if (isset($_POST[$name]))\
    \ $value = $_POST[$name];\n+   if ($value && get_magic_quotes_gpc()) $value =\
    \ stripslashes($value);\n+   \n+   First, the function assumes that no value exists.\
    \ Then, if a value does exist for this input in $_POST, that value is assigned\
    \ to $value. The third step strips extraneous slashes from the value, but only\
    \ if Magic Quotes is enabled.\n+   \n+   This function assumes that the form uses\
    \ the POST action. You could create another argument that accepts POST or GET\
    \ and checks the corresponding superglobal for the value, if you want to make\
    \ the function even more flexible.\n\n> **note**\n> \n> If you're new to programming,\
    \ I recommend writing conditionals over multiple lines and always using curly\
    \ brackets, but this book will have some single-line conditionals to save space.\n\
    \n+   4. Check the input type:\n+   \n+   if ( ($type == 'text') || ($type ==\
    \ 'password') ) {\n+   \n+   This function will create text inputs, password inputs,\
    \ and textareas. The first two are virtually the same in syntax, except for the\
    \ *type* value used in the HTML. The function starts by handling those two types.\n\
    \n+   5. Begin creating the input:\n+   \n+   echo '<input type=\"\" . $type .\
    \ '\" name=\"\" . $name . '\" id=\"\" . $name . '\">;\n+   \n+   This is the initial\
    \ shell of the HTML input, with its *type*, *name*, and *id* properties.\n\n+\
    \   6. Add the input's value, if applicable:\n+   \n+   if ($value) echo ' value=\"\
    \" . htmlspecialchars($value) . '\" ;;\n+   \n+   If the $value variable has a\
    \ value, then it should be added to the input, after running it through htmlspecialchars()."
