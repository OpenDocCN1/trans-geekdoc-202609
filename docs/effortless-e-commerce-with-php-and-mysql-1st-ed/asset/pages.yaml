  img_proc: true
- pgno: 312
  md: "# Defining gateway_process.php\n\nThe gateway_process.php script needs to do\
    \ several things:\n\n+   - Add to the $data array information that's common to\
    \ all transactions\n+   - Convert the $data array to a string\n+   - Perform the\
    \ request\n+   - Convert the request response into an array\n\nThis code isn't\
    \ that complicated, but let's walk through it step by step just to be safe.\n\n\
    +   1. Create a new PHP script in your text editor or IDE to be named gateway_process.php\
    \ and stored in the same location as gateway_setup.php.\n\nAgain, it'd be best\
    \ to store this outside the Web root directory. If that's not possible, place\
    \ it in the most secure location you can.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_312_0.png)\n\
    \ntip\nAuthorize.net also allows you to use the live URL for tests when using\
    \ a real account in testing mode.\n\n+   2. Define the access URL:\n\n```\n<?php\n\
    if ($live) {\n    define ('GATEWAY_API_URL', 'https://secure.authorize.net/gateway/transact.dll');\n\
    } else {\n    define ('GATEWAY_API_URL', 'https://test.authorize.net/gateway/transact.dll');\n\
    }\n}\n```\n\nAs with most payment gateways, Authorize.net uses different URLs\
    \ for live and testing purposes. Based upon the value of $live set in the configuration\
    \ file, the correct URL is assigned to a constant.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_312_1.png)\n\
    \ntip\nYour login ID and transaction key must be kept safe. Having this information,\
    \ hackers could credit their cards from your account.\n\n+   3. Define your Authorize.net\
    \ merchant information:\n\n```\n$data['x_login'] = '75sqQ9q6HEP8';\n$data['x_tran_key']\
    \ = '7r83Sb4HUd58Tz5p';\n```\n\nThese two pieces of information uniquely identify\
    \ you to the Authorize.net system. You should use the values emailed to you by\
    \ Authorize.net in your code.\n\n+   4. Define the Advanced Integration Method\
    \ values:\n\n```\n$data['x_version'] = '3.1';\n$data['x_delim_data'] = 'TRUE';\n\
    $data['x_delim_char'] = '|';\n$data['x_relay_response'] = 'FALSE';\n```"
  merge: -1
  img_proc: true
- pgno: 313
  md: "These four items are required when using the Advanced Integration Method (AIM).\
    \ The first indicates the version of AIM in use. The second says that the returned\
    \ response data should be delimited. The third dictates the delimiting character\
    \ to be used (here, the pipe). The relay_response is used by Authorize.net's SIM\
    \ system, so it should be set to false for AIM connections (this is Authorize.net's\
    \ recommendation).\n\n# 5. Indicate the transaction method:\n\n```\n$data['x_method']\
    \ = 'CC';\n```\n\nA method value of CC means this is a credit card transaction.\
    \ An alternative is ECHECK.\n\n# 6. Add the order information:\n\n```\n$data['x_amount']\
    \ = $Order_total;\n$data['x_invoice_num'] = $Order_id;\n$data['x_cust_id'] = $Customer_id;\n\
    ```\n\nThe amount value is obviously one of the most important. The invoice number\
    \ and customer ID values aren't required, but by providing them, that information\
    \ will be stored in the Authorize.net system, making it easy to look up information\
    \ there, relative to orders on this site.\n\nFor each of these values, variables\
    \ created in billing.php will be used. In Chapter 11, this same script will be\
    \ invoked, but these three values will come from variables defined in an administrative\
    \ script.\n\n# 7. Convert the data to a series of name=value pairs:\n\n```\n$post_string\
    \ = '';\nforeach($data as $k => $v) {\n  $post_string .= \"$k=\". urlencode($v)\
    \ .\"&\";\n}\n$post_string = rtrim($post_string, '& ');\n```\n\nUsing a foreach\
    \ loop, each element in $data will be turned into the format name=value. Each\
    \ value is URL-encoded, to make it safe to use in a request, and each name=value\
    \ pair is separated by an ampersand. The final ampersand is chopped off as a last\
    \ step. The result will be a string like:\n\n```\nx_type=AUTH_ONLY&x_card_num=455610523894&x_exp_date=\n\
    062010&x_card_code=890&x_first_name=Larry&x_last_name=\nUllman&x_address=100+Main+Street+Apt+2B&x_state=NH\n\
    &x_city=Anytown&x_zip=65894&x_login=75sq9Q9qHEP8\n&x_tran_key=7r83Sb4HUd58Tz5p&version=3.1&x_delim_data=\n\
    TRUE&x_delim_char=%7C&x_relay_response=FALSE&x_method=\nCC&x_amount=309.82&x_invoice_num=21&x_cust_id=27\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 8. Set up the cURL request:


    ```

    $request = curl_init(GATEWAY_API_URL);

    curl_setopt($request, CURLOPT_HEADER, 0);

    curl_setopt($request, CURLOPT_RETURNTRANSFER, 1);

    curl_setopt($request, CURLOPT_POSTFIELDS, $post_string);

    curl_setopt($request, CURLOPT_SSL_VERIFYPEER, FALSE);

    ```


    The first line initializes a cURL request, providing it with the URL to be communicated
    with. The second line says that header information should be omitted from the
    response (only the data is necessary). The third line, setting CURLOPT_RETURNTRANSFER
    to 1, confirms that actual data should be returned as a response. On the fourth
    line, the $post_string data is added as CURLOPT_POSTFIELDS.


    For the full list of cURL options, see www.php.net/curl_setopt.


    On the last line, the option of verifying the SSL connection of the server is
    disabled. By doing so, you’re improving the odds of the connection going through.
    If you don’t include this line and cURL hiccups at the validity of the gateway’s
    certificate, the request will fail. This doesn’t mean the transaction won’t be
    secure, it’s just more likely to succeed.


    # 9. Execute the cURL request:


    ```

    $response = curl_exec($request);

    curl_close($request);

    ```


    # 10. Convert the response into an array:


    ```

    $response_array = explode($data["x_delim_char"], $post_response);

    ```


    The cURL response will be returned as a long string of data. To make it easier
    to use, it can be converted to an array by exploding the string on the delimiting
    character (previously set to be the pipe).


    # 11. Save the file.


    Again, no closing PHP tag is used.


    # Examining the Server Response


    Before updating the billing script to use the gateway scripts, let’s take a quick
    look at the Authorize.net response. When using AIM, the server response will be
    a long string of data in the format of (the actual delimiter will be whatever
    you choose):


    Because arrays are indexed beginning at zero, Table 10.1 starts listing the fields
    at zero.


    ```

    1l1l11This transaction has been approved.ljUUAmIY1239ol ..

    ```


    After applying the explode() function to this response, the string will be broken
    into an array. The first 68 elements in that array are reserved for Authorize.net’s
    purposes; most will not have values. Table 10.1 lists many of these.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Table 10.1 Some Authorize.net Response Fields


    | Field | Name |

    |---|---|

    | 0 | Response Code |

    | 1 | Response Subcode |

    | 2 | Response Reason Code |

    | 3 | Response Reason Text |

    | 4 | Authorization Code |

    | 5 | AVS Response |

    | 6 | Transaction ID |

    | 7 | Invoice Number |

    | 8 | Description |

    | 9 | Amount |

    | 10 | Method |

    | 11 | Transaction Type |

    | 12 | Customer ID |

    | 13–31 | Customer Information |

    | 38 | CCV/CVV Response Code |

    | 50 | Last Four Digits of Card |

    | 51 | Card Type |


    The full breakdown is available in the Authorize.net manual. The most important
    of these is really the *response code*. The possible values are:


    +   - Approved

    +   - Declined

    +   - Error

    +   - Held for Review


    In short, if the first element returned by the response has a value of 1, the
    payment was authorized. If it''s not 1, then a problem occurred. The specific
    type of problem will be reflected by the *response reason code* and the *response
    reason text*. Again, the Authorize.net AIM manual and online documentation lists
    all the possible codes and messages.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Updating billing.php


    Now that the two payment-related scripts have been written, they should be incorporated
    into billing.php. By including the two scripts, the payment transaction will be
    processed. After that, the transaction should be recorded in the database and
    the script should respond accordingly (item number 4 in Figure 10.14).


    1. Open billing.php in your text editor or IDE, if it is not already.


    2. After the isset($_SESSION[''order_id'']) IF-ELSE, check that the order ID and
    total are set:


    if (isset($Order_id, $Order_total)) {


    The IF-ELSE conditional that should precede this line creates these two variables
    either by retrieving them from the session or by executing the stored procedure.
    As long as both variables exist, the payment request can be processed.


    3. Assign the customer ID value to a variable:


    $Customer_id = $_SESSION[''customer_id''];


    The customer ID is currently stored in the session, but gateway_process.php expects
    it to be in a variable named $Customer_id. (I wrote it this way because the administrative
    script that also uses gateway_process.php won''t have the customer ID in a session.)


    4. Include the two scripts:


    require_once(BASE_URI . ''gateway_setup.php'');

    require_once(BASE_URI . ''gateway_process.php'');


    The scripts must be included in this order. The first establishes the $data array
    and populates it with some information for this particular kind of transaction.
    The second script adds more information to $data and then contacts Authorize.net.


    You''ll need to change the references to the scripts so that the paths are accurate
    for your setup.


    5. Add addslasheds to two of the text fields:


    $reason = addslasheds($response_array[3]);

    $response = addslasheds($response);


    The reason text and the full response could have problematic characters (namely,
    the single quotation mark), so addslasheds() needs to be applied before using
    these values in the stored procedure.'
  merge: -1
  img_proc: true
