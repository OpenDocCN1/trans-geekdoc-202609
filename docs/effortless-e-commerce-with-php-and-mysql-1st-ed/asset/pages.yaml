  img_proc: true
- pgno: 60
  md: 'Hackers will supply bad data to achieve three other goals:


    +   - Remote File Inclusion

    +   - Local File Inclusion

    +   - System Calls


    In a Remote File Inclusion (RFI) attack, the hacker attempts to get a site to
    include a file found on another server (probably theirs). PHP, when it calls fopen(),
    require(), include(), and the like, will execute any PHP code in the included
    file as if that code was part of the original file. So if Chuck can get your site
    to open and execute his code, he can start manipulating your server, with disastrous
    results. Again, prevention is simple: Don’t use unvalidated user data in these
    function calls.


    tip Disabling the register_globals setting and using open_basedir can also help
    prevent RFI and LFI attacks.


    A Local File Inclusion (LFI) attack is similar, but the hopes are that a sensitive
    document on the same server, like a password file, will be read and displayed.


    The same steps used to prevent RFI and LFI attacks apply if your site uses exec()
    and other functions that run commands on the server itself. It’s best that your
    server not use these functions, but if they do, you absolutely cannot use unvalidated
    user data in them.


    Moving on, if your site accepts file uploads from users, that system can be used
    to attempt a Malicious File Execution on your server. The hacker’s hope is that
    he or she can upload, for example, his own PHP script to your system, and then
    execute that PHP script by loading it directly in their browser. Say your site
    allows users to upload images of themselves. You should validate that the upload
    is of a given type—gif, jpg, png—but that can easily be faked. If you were to
    store the uploaded files in the Web directory (for example, the images folder
    in Figure 2.5), then the hacker can later run the script by going to http://www.yoursite.com/images/scriptname.php.
    But if you store user submissions outside the Web directory (such as the unavailable
    folder in Figure 2.5), then uploaded files cannot be directly executed through
    the Web browser. Another prevention technique involves changing the name of the
    uploaded file: If the hacker doesn’t know what it’s called on the server, he or
    she can’t invoke it.


    tip In Parts Two and Three of the book, you''ll see techniques for securely handling
    file uploads.


    The last type of attack you should know about is the Cross-Site Request Forgery
    (CSRF). This attack attempts to execute unauthorized commands from an authorized
    user. The success of these attacks is predicated upon the site trusting the user
    as they have previously been authenticated. For example, say your site has a page
    that adds credits to user accounts: There’s a form for selecting a user and the
    number of credits; when the form is submitted, the'
  merge: -1
