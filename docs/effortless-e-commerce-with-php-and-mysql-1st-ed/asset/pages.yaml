    This line will print any MySQL errors that occurred, if $r doesn''t have a positive
    value.


    +   6. If records were returned, include the view file:


    ```

    if (mysqli_num_rows($r) >= 1) {

    include(''./views/list_categories.html'');

    }

    ```


    You can use the mysqli_num_rows() function to confirm that results were returned
    by this stored procedure, as if the script had executed a standard SELECT query.
    If some rows were returned, the list_categories.html file, found within the views
    directory, will be included. That file will handle the actual retrieval and display
    of the returned rows.


    +   7. If no records were returned, include the error view:


    ```

    } else { // Include the error page:

    include(''./views/error.html'');

    }

    ```


    The error.html view file will be included any time a query did not return sufficient
    results. You could also, at this point, write an error message to a log or send
    it to an email address.


    +   8. Complete the PHP page:


    ```

    include(''./includes/footer.html'');

    ?>

    ```


    +   9. Save the file.


    # Creating the View Files


    The shop.php script uses two view files: list_categories.html and error.html.
    Remember that these view files just represent a snippet of HTML: a subset of the
    entire page, representing a small portion of what the user sees. Each view file
    uses a .html extension to indicate its basic nature, and should have a bare minimum
    of PHP code and logic.


    Looking at the error.html file, all it needs to do is display a message within
    the context of the HTML template. For the Coffee template, the context is a box
    generated by several <DIV> tags.'
