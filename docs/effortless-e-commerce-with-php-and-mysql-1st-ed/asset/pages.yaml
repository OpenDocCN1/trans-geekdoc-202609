- pgno: 385
  md: '# SUGGESTED ALTERATIONS


    The goal of this book is to teach sound e-commerce code and methodologies. In
    thinking of the two sites I''d use to achieve that goal, I tried to come up with
    examples that best portray the breadth of what e-commerce can be. Being who I
    am, however, I also dream up about three dozen other ideas for each one that actually
    made it into the book. Rather than discard good brainstorming, I thought I''d
    finish this chapter with some suggestions as to how this particular example could
    be expanded. While none of these ideas will be fully developed in the text, you''ll
    see more than enough, in terms of MySQL and PHP, to realize them yourself, should
    you choose.


    > Some of these ideas may also be partially developed in the downloadable scripts
    from www.DMCInsights.com/ecom/.


    # Logging History


    One addition you could add to the site would be to log all the pages people visit.
    You''d need to create a history table, defined as:


    ```

    CREATE TABLE history (

    `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,

    `user_id` INT UNSIGNED NOT NULL,

    `type` ENUM(''page'', ''pdf''),

    `page_id` MEDIUMINT UNSIGNED DEFAULT NULL,

    `pdf_id` SMALLINT UNSIGNED DEFAULT NULL,

    `date_created` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,

    PRIMARY KEY (`id`),

    KEY (`page_id`, `type`),

    KEY (`pdf_id`, `type`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    ```


    The page.php script would add a new record to this table every time the page is
    loaded (by an active user):


    ```

    INSERT INTO history (user_id, type, page_id) VALUES ($_SESSION[''user_id''], ''page'',
    $_GET[''id''])

    ```


    The view_pdf.php page would do the same thing, but change the type to pdf and
    use the id value from the pdfs table for the pdf_id.


    The history table would then be able to provide the user with a history of every
    page and PDF they''ve seen. This table would provide the administrator with indications
    of the most popular pages. That information could also be used on the public side,
    perhaps to display the 10 most popular articles on the home page (Figure 5.19).
    Here''s the JOIN query that would return the 10 most frequently viewed pages:


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_385_0.png)


    Figure 5.19'
  merge: -1
  img_proc: true
- pgno: 386
  md: '**tip**


    You could decide whether each time a user visits the same page should be reflected
    in the history table or not.


    ```

    SELECT COUNT(history.id) AS num, pages.id, pages.title FROM pages,

    history WHERE pages.id=history.page_id AND history.type=''page''

    GROUP BY (history.page_id) ORDER BY num DESC LIMIT 10

    ```


    # Making Notes


    Another added service would be allowing users to make notes on pages.

    The table would be:


    ```

    CREATE TABLE notes (

    `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,

    `user_id` INT UNSIGNED NOT NULL,

    `page_id` MEDIUMINT UNSIGNED NOT NULL,

    `note` TINYTEXT NOT NULL,

    `date_created` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,

    PRIMARY KEY (`id`),

    UNIQUE (`user_id`, `page_id`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    ```


    Next you add a form on each page containing just a textarea. When the form

    is submitted, the information is stored in that table. On the user''s viewing

    history page, you could easily indicate those pages for which the user has left

    notes (by performing a left outer join from the pages to the notes table). On

    a specific content page, you could easily retrieve the notes a user previously

    made on its content.


    # Recording Favorites


    To make the site easier to use, especially as you create more content, users

    might appreciate being able to bookmark their favorite content. To do that for

    the HTML pages is simple. First, create a table defined like so:


    ```

    CREATE TABLE favorite_pages (

    `user_id` INT UNSIGNED NOT NULL,

    `page_id` MEDIUMINT UNSIGNED NOT NULL,

    `date_created` TIMESTAMP NOT NULL,

    PRIMARY KEY (`user_id`, `page_id`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    ```


    This is a junction table, used to manage the many-to-many relationship

    between users and pages. It has only three columns and the first two together

    constitute the primary key (that is, it''s a compound primary key). Each favorite

    for each user will represent one record in this table.'
  merge: -1
  img_proc: true
- pgno: 387
  md: "Next, create an image displayed with the content that, when clicked, passes\
    \ the page ID along in the URL. On the add_to_favorites.php page, you'd store\
    \ the user's ID from the session and the page ID from the URL in the favorites\
    \ table.\n\nYou could then create a favorites.php page, linked through the Manage\
    \ Account section for logged-in users, which displays all the favorites. It would\
    \ need to perform a JOIN to get the favorite content. Or you could mark the user's\
    \ favorites next to each item in a history page.\n\nOn each content page, you\
    \ could add a check to see if the page is already in the user's favorites. If\
    \ it is, you would display text and an image indicating such, and perhaps clicking\
    \ the link would remove it from the user's favorites by sending the page ID along\
    \ to remove_from_favorites.php.\n\nHere's what the HTML for adding and removing\
    \ favorites might look like (Figure 5.20):\n\n```\necho '<p><a href=\"add_to_favorites.php?id='\
    \ . $_GET['id'] . '\">'\n <img src=\"/images/heart_48.png\" border=\"0\" width=\"\
    48\"\n height=\"48\" /></a>\n<a href=\"remove_from_favorites.php?id=' . $_GET['id']\
    \ . '\">'\n <img src=\"/images/cross_48.png\" border=\"0\" width=\"48\"\n height=\"\
    48\" /></a></p>';\n```\n\nMaking a note of favorite PDFs requires a bit more thought.\
    \ You can't easily add links to the PDF itself, so you'd have to put the Add to\
    \ Favorites link somewhere else, like on the page that lists all the PDFs. This\
    \ means the user would have to read the PDF, then go back to that page to flag\
    \ it. As for storing favorite PDFs in the database, you could create a favorite_pdfs\
    \ table, just like favorite_pages, or create a favorites table that stores both,\
    \ like the history example.\n\n# Rating Content\n\nContinuing on this same theme,\
    \ users could indicate a rating on each page. You would store this in a table\
    \ like:\n\n```\nCREATE TABLE page_ratings(\n`user_id` INT UNSIGNED NOT NULL,\n\
    `page_id` MEDIUMINT UNSIGNED NOT NULL,\n`rating` TINYINT UNSIGNED NOT NULL,\n\
    `date_created` TIMESTAMP NOT NULL,\nPRIMARY KEY ('user_id', 'page_id')\n) ENGINE=MyISAM\
    \ DEFAULT CHARSET=utf8;\n```\n\ntip\nAn even better addition would be to use Ajax\
    \ to submit the user's favorites indication to the server behind the scenes.\n\
    \n![](img/4f47e47c67bd619ac73250f11c9fc7ce_387_0.png)\n\nFigure 5.20\n\ntip\n\
    The images used in this example are freely available at www.wefunction.com/2008/07/function-free-icon-set/."
  merge: -1
  img_proc: true
- pgno: 388
  md: 'An even better addition would be to use Ajax to submit the user''s rating to
    the server behind the scenes and immediately update the page to reflect the rating.


    Unlike with the history table, where you may want to record every time every user
    visited a page, you would only want each user to be able to rank a page once.
    You can accomplish that using this query:


    ```

    INSERT INTO page_ratings (user_id, page_id, rating) VALUES ($_SESSION[''user_id''],
    $_POST[''id''], $_POST[''rating''])

    ```


    The rating would be an integer, from say 1 to 5. The easiest way to submit the
    rating would be to use a drop-down menu and the form would post the rating back
    to page.php. The page.php script would then need an extra block at the top of
    the script that checks for a POST request and adds the record to the database
    if all the data successfully passes the validation tests.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_388_0.png)


    The ratings could then be displayed to the user on their favorites and history
    pages. The ratings could also be used by the administrator to see the best reviewed
    content, which again might be turned into a listing on the home page (Figure 5.21):


    ```

    SELECT ROUND(AVG(rating),1) AS average, pages.id, pages.title FROM pages, page_ratings
    WHERE pages.id=page_ratings.page_id GROUP BY (page_ratings.page_id) ORDER BY average
    DESC LIMIT 10

    ```


    Again, this could also be done for the PDFs, but the logic would need to be added
    to the pdfs.php script.


    Figure 5.21


    # Making Recommendations


    Implementing a recommendations system is a fantastic way to encourage people to
    use your site and increase your business. Whether it''s something like Netflix
    that recommends titles based upon your body of ratings and viewing history, or
    Amazon that recommends related and alternative products to those you''re looking
    at, are in your cart, or were just purchased, there''s a lot you can do with recommendations.
    The logic with a recommendations system may take some effort, though.


    If you want some concrete SQL and PHP to start implementing a recommendation system,
    contact me through my support forum (www.DMCInsights.com/phorum/).


    One implementation would have the administrator making the recommendations: For
    each page, the administrator could use a drop-down menu (which allows for multiple
    selections) to associate related content. The recommendations table would store
    for each page an ID of other recommended pages. If you wanted to allow for recommendations
    across content types, that would require a more complex table structure.


    An alternative way to implement a recommendation system would be to base recommendations
    on user rankings. For example, if user Alice gave page 1 five stars and page 2
    four stars, and user Bob gave page 2 four stars, Bob might'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'really like page 1, as well. Such a recommendation system could be more accurate
    than the administrator-created one, but relies on lots of sound logic and filtering.
    The more accurately you can equate Bob''s tastes to other user''s tastes, the
    better you can make recommendations.


    # Placing HTML Content in Multiple Categories


    Just like a blog can file posts under multiple categories (and multiple tags),
    you may decide that some of your HTML content should be listed in multiple categories,
    too. That would result in a many-to-many relationship between the pages and the
    categories tables, so you would have to take the category_id out of the pages
    table and use a junction table instead. That table would be defined as:


    ```

    CREATE TABLE pages_categories (

    `page_id` MEDIUMINT UNSIGNED NOT NULL AUTO_INCREMENT,

    `category_id` SMALLINT UNSIGNED NOT NULL AUTO_INCREMENT,

    PRIMARY KEY (`page_id`, `category_id`)

    )

    ```


    You wouldn''t need to change the footer, which links to every category, but the
    category.php page would have to perform a join across pages_categories and pages:


    ```

    SELECT id, title, description FROM pages, pages_categories WHERE pages.id=pages_categories.page_id
    AND pages_categories.category_id=''" . $_GET[''id''] . "'' ORDER BY date_created
    DESC

    ```


    The add_page.php script would need to allow for multiple categories to be selected:


    ```

    <select name="category[]" multiple="multiple" size="5"

    <?php if (array_key_exists(''category'', $add_page_errors))

    echo '' class="error"''; ?>

    ```


    The logic to make the categories sticky would have to be changed as $_POST[''category'']
    is now an array:


    ```

    if (isset($_POST[''category'']) && (in_array($row[0], $_POST[''category'']))

    echo '' selected="selected"'';

    ```


    Then, the handling part of the script would have to validate that $_POST[''category'']
    has a count() greater than zero. And after the record was added to the pages table,
    you would insert one record into pages_categories for each selected category.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# # POTENTIAL ALTERATIONS


    This chapter covers everything you need to know to implement a real-world e-commerce
    product catalog that has a decent amount of complexity. As always, there are many
    other ways you could present the catalog, other features you could implement,
    and other stylistic choices you could make. I''ll highlight a few of those here;
    no doubt you can come up with several others on your own.


    # ## Paginating Results


    One feature I have not incorporated into this site is pagination: making a list
    of items appear in smaller groupings—like 10 to 20 at a time—over multiple pages.
    For starters, the page for listing every coffee product does so using a single
    drop-down menu, so no pagination is required there. As for the non-coffee products,
    the site would have to get fairly large for it to require pagination. But should
    you want to add that feature, it''s quite simple to implement. If you don''t already
    know how, I discuss the concept in detail in my book, PHP and MySQL: Visual QuickStart
    Guide (Peachpit Press), or you can simply ask how in my support forums (www.DMCInsights.com/phorum/).


    With the Coffee site, there''s one complication to using pagination: the pretty
    URLs. If you''re using mod_rewrite, you''ll need to modify the .htaccess rules
    so that it recognizes and handles the pagination variables that get passed along
    in the URL.


    # ## Highlighting New Products


    You may want to highlight new products to make the site look fresh and busy. You
    might do so by:


    +   - Showing the most recent three or four products on the home page

    +   - Displaying the most recent three or four products in a given category on
    the shop.php page

    +   - Creating a separate “New Items” page that lists every product added within
    the past X days or weeks


    The paradigm for implementing any of these has already been created: It’s essentially
    the same code and queries as used to display sale items, just without using the
    sales table and ordering the results by the creation dates.'
  merge: -1
  img_proc: true
- pgno: 391
  md: "> This technique is known as a Suckerfish Menu, and is quickly demonstrated\
    \ in Chapter 11.\n\n# # Directly Linking to Product Categories\n\nOne reasonable\
    \ complaint about this site’s design is that, except for the sale items, the customer\
    \ must click through two pages to get to actual products they can purchase (first\
    \ the shop page, then browse). An easy fix would be to change the navigation so\
    \ that it allows for direct access to the categories.\n\nTo do this, you’d convert\
    \ the main navigation menu into a nested unordered list. You’d use PHP to generate\
    \ the sublists, but the desired HTML would be:\n\n```\n<ul class=\"nav\">\n<li><a\
    \ href=\"/shop/coffee/\">Coffee</a>\n    <ul>\n        <li><a href=\"/browse/coffee/Dark+Roast/2\"\
    >Dark Roast</a></li>\n        <li><a href=\"/browse/coffee/Kona/3\">Kona</a></li>\n\
    \        <li><a href=\"/browse/coffee/Original+Blend+1\">Original Blend</a></li>\n\
    \    </ul>\n</li>\n<li><a href=\"/shop/goodies/\">Goodies</a></li>\n<li><a href=\"\
    /shop/sales/\">Sales</a></li>\n<li><a href=\"/wishlist.php\">Wish List</a></li>\n\
    <li><a href=\"/cart.php\">Cart</a></li>\n</ul>\n```\n\nWhat you see for the specific\
    \ coffee types would need to be applied to the categories of goodies, too. You\
    \ would then apply a combination of CSS and/or JavaScript so that the sublists\
    \ are only shown when the user mouses over the primary links. That specific code\
    \ can be found by searching online for “Suckerfish Menu,” although you’ll need\
    \ to tweak the offered CSS so it fits in with the design of the template.\n\n\
    # # Adding Multiple Coffees or Quantities at Once\n\nIt’s not a big deal, but\
    \ the site as written will let the customer add only a single quantity of a single\
    \ product to their cart at a time. As for the quantities, the customer will be\
    \ able to easily update that in the cart itself. But if you wanted to allow for\
    \ entering a quantity, you would have to turn the products listing into a form,\
    \ as in the coffee listing, and add a <SELECT> menu or text box for the quantity\
    \ (Figure 8.2o). Most importantly, the form must also store the product’s SKU\
    \ in a hidden input:"
  merge: -1
  img_proc: true
- pgno: 392
  md: '![](img/4f47e47c67bd619ac73250f11c9fc7ce_392_0.png)


    # Figure 8.20


    ```

    echo ''<form action="/cart.php" method="get">

    <input type="hidden" name="action" value="add" />

    <input type="hidden" name="sku" value="" . $row[''sku''] . ''" />

    <h3>'' . $row[''name''] . ''</h3>

    <div class="img-box">

    <p><img alt="" . $row[''name''] . ''" src="/products/'' . $row[''image'']

    . ''" /></p>'' . $row[''description''] . ''<br />'' .

    get_price($Type, $row[''price''], $row[''sale_price'']).

    ''<strong>Availability:</strong>'' . get_stock_status($row[''stock'']) . ''</p>

    <select name="qty"><option><option<option<option<2</option></select>

    <input type="submit" value="Add to Cart" class="button" />

    </div></form>'';

    ```


    With the specific coffees, there are other ways you could go about presenting
    them. You could list the specific coffees as a <SELECT> menu that allows multiple
    selections. Here''s what you would have in list_coffees.html (Figure 8.21):


    ```

    <select name="sku[]" multiple="multiple" size="5">

    ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_392_1.png)


    # Figure 8.21


    Note that I''ve changed the name of the item from sku to sku[], so that an array
    of products will be sent to cart.php.


    If you wanted, you could instead list the coffees as a series of check boxes or
    with a corresponding series of text boxes, into which the user enters the quantity
    desired. In either of these two cases, you would still have to use sku[] as the
    name for every form element.


    As you''ll see in the next chapter, you''d need to modify cart.php to handle an
    incoming array, if you were to apply any of these three modifications to how the
    coffee products are listed. If you were to add a quantity option to coffee or
    non-coffee products, that would need to be factored in an updated cart.php, too.'
