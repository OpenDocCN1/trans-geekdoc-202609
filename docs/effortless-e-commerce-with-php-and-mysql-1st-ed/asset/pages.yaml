- pgno: 214
  md: "> **tip**\n> \n> If your records in the `sizes` table are in ascending size\
    \ order, you could select the coffee products ordered by `size_id` first.\n\n\
    The query uses a `JOIN` across three tables: `specific_coffees`, `general_coffees`,\
    \ and `sizes`. The `WHERE` conditional restricts the results to a general coffee\
    \ type, and retrieves only those products that are currently in stock. And the\
    \ whole record set is returned in order by name, so that similar products will\
    \ appear near each other.\n\n# # SELECTING EVERY NON-COFFEE PRODUCT\n\nThe query\
    \ for selecting every non-coffee product is:\n\n```\nSELECT ncc.description AS\
    \ g_description, ncc.image AS g_image,\nCONCAT(\"O\", ncp.id) AS sku, ncp.name,\
    \ ncp.description, ncp.image,\nncp.price, ncp.stock\nFROM non_coffee_products\
    \ AS ncp INNER JOIN non_coffee_categories AS ncc\nON ncc.id=ncp.non_coffee_category_id\n\
    WHERE non_coffee_category_id=<some_category_id> ORDER by\n\\date_created DESC;\n\
    ```\n\nFigure 8.5 shows the output for the query when replacing `<some_category_id>`\
    \ with the number 3 (for _Mugs_). Figure 8.6 shows how this data will be used\
    \ in the site.\n\n> **tip**\n> \n> Ending a query with `\\G` instead of a semicolon\
    \ returns the query results as a vertical list (as in Figure 8.5), rather than\
    \ a horizontal table. This is sometimes easier to read.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_214_0.png)\n\
    \n# Figure 8.5\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_214_1.png)\n\n# Figure\
    \ 8.6\n\nThis query is more straightforward, because it only performs a `JOIN`\
    \ across two tables. The query selects the `description` and `image` values from\
    \ the `non_coffee_categories` tables, aliasing them as `g_description` and `g_image`\
    \ accordingly (the `g_` is short for _general_). Again, the product's SKU is created\
    \ in the query, by concatenating the capital letter “O” (for _other_) to the product's\
    \ ID value. The specific product's `name`, `description`, `image`, `price`, and\
    \ `stock` values are also retrieved. The only condition in this query is for restricting\
    \ the results to a specific category, and the results are ordered from newest\
    \ items to oldest."
