    # CUSTOMIZING THE PAYPAL EXPERIENCE


    Although using PayPal’s Website Payments Standard system means the customer will
    leave your site and spend some time at PayPal, the experience does not need to
    be too jarring. If you log in to PayPal and click Profile, there’s quite a lot
    you can do under the Selling Preferences banner. This is where you can establish
    tax and shipping policies. You can also view and update your buttons there. More
    importantly from a customer-experience point of view, you can create a specific
    Customer Service Message and define templates to act as Custom Payment Pages.
    Custom Payment Pages can use your own images and colors—to some degree—so that
    the PayPal interface looks similar to your own Web site. How you go about doing
    this is well documented in links found on PayPal’s Custom Payment Pages document.'
