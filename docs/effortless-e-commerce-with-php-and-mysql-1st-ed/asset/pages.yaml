  md: '+   13. Create several pages of content.


    Or, if you''d rather, you can use the SQL commands from my Web site (www.DMCInsights.com/ecom/)
    to populate the database for you.


    # DISPLAYING PAGE CONTENT


    Now that you have several pages of pretend content in the database, it''s time
    to create the scripts to display that content. There are two:


    +   category.php lists the specific pages under a category.


    +   page.php shows the actual content.


    For marketing purposes, category.php will be available to any user. The page.php
    script will also be available to any user, but if they''re not logged in with
    a valid account, they''ll only see the same description of the content that''s
    displayed on the category page. Only current customers can see the full content.


    # Creating category.php


    The category.php script receives an ID value in the URL (from the links in the
    footer). The script should validate the ID value, then select the category''s
    information from the database. By doing so, the category''s name can be used as
    the browser''s title. Next, the script retrieves and lists all the pages that
    exist within that category (Figure 5.8).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_131_0.png)


    +   1. Create a new PHP script in your text editor or IDE to be named category.php
    and stored in the Web root directory.'
