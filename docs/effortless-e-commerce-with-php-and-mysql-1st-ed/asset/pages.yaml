- pgno: 334
  md: "Using prepared statements for database queries changes the way query values\
    \ will be treated, as you'll see in Step 12.\n\nThe product's category value should\
    \ come from a select menu. It needs to be an integer with a value of at least\
    \ 1. If those criteria are not met, an error is added to the errors array. Unlike\
    \ validation routines seen elsewhere in the book, nothing else is done with the\
    \ validated value at this point.\n\n+   6. Validate the price and quantity in\
    \ stock:\n\n```\nif (empty($_POST['price']) || !filter_var($_POST['price'], FILTER_VALIDATE_FLOAT)\
    \ || ($_POST['price'] <= 0)) {\n    $add_product_errors['price'] = 'Please enter\
    \ a valid price!';\n}\n\nif (empty($_POST['stock']) || !filter_var($_POST['stock'],\
    \ FILTER_VALIDATE_INT, array('min_range' => 1))) {\n    $add_product_errors['stock']\
    \ = 'Please enter the quantity in stock!';\n}\n```\n\nThe price must not be empty\
    \ and must be a float (a decimal) that's not less than or equal to zero. The quantity\
    \ in stock must be an integer greater than or equal to 1. You could change the\
    \ min_range to zero if you wanted to allow the administrator to add products whose\
    \ inventory will be increased later.\n\n+   7. Validate the name and description:\n\
    \n```\nif (empty($_POST['name'])) {\n    $add_product_errors['name'] = 'Please\
    \ enter the name!';\n}\nif (empty($_POST['description'])) {\n    $add_product_errors['description']\
    \ = 'Please enter the description!';\n}\n```\n\nThese two values cannot be empty.\n\
    \nBecause the images on the site are relatively small, the maximum size could\
    \ reasonably be restricted to less than 100 KB.\n\n+   8. Begin validating the\
    \ image:\n\n```\nif (is_uploaded_file($_FILES['image']['tmp_name']) && ($_FILES['image']['error']\
    \ == UPLOAD_ERR_OK)) {\n    $file = $_FILES['image'];\n    $size = ROUND($file['size']/1024);\n\
    \    if ($size > 512) {\n        $add_product_errors['image'] = 'The uploaded\
    \ file was too large.';\n    }\n}\n```\n\nThis code is similar to that used in\
    \ Chapter 5 to validate uploaded PDF files. The image's maximum size is 512 KB."
  merge: -1
  img_proc: true
- pgno: 335
  md: "# 9. Validate the file's type:\n\n```\n$allowed_mime = array('image/gif', 'image/pjpeg',\
    \ 'image/jpeg',\n    'image/JPG', 'image/X-PNG', 'image/PNG', 'image/png',\n \
    \   'image/x-png');\n$allowed_extensions = array ('.jpg', '.gif', '.png', 'jpeg');\n\
    $image_info = getimagesize($file['tmp_name']));$ext = substr($file['name'], -4);\n\
    if ( (!in_array($file['type'], $allowed_mime))\n  || (!in_array($image_info['mime'],\
    \ $allowed_mime) )\n  || (!in_array($ext, $allowed_extensions) )\n) {\n    $add_product_errors['image']\
    \ = 'The uploaded file was not of the\n    proper type.';\n}\n```\n\nAgain, this\
    \ is similar to the process for uploading PDFs. First, an array of allowed MIME\
    \ types is defined. Then an array of allowed extensions is defined. Third, the\
    \ getimagesize() function is invoked, which can be used as a good server-based\
    \ confirmation of an image’s properties. Fourth, the last four characters in the\
    \ uploaded file’s name are retrieved, in order to be compared against the allowed\
    \ extensions.\n\nThe code then creates an error if any of three conditions are\
    \ false. The first is that the browser-supplied MIME type is appropriate. The\
    \ second is that the server-supplied MIME type (from the getimagesize() function\
    \ call) is acceptable. The third is that the file’s extension is on the approved\
    \ list.\n\n# 10. Move the file to its final destination:\n\n```\nif (array_key_exists('image',\
    \ $add_product_errors)) {\n    $new_name = (string) sha1($file['name'] . uniqid('',\
    \ true));\n    $new_name .= ((substr($ext, 0, 1) != '.' ? '.' : '{$ext}\"; : $ext);\n\
    \    $dest = \"./../products/$new_name\";\n    if (move_uploaded_file($file['tmp_name'],\
    \ $dest)) {\n        $SESSION['image']['new_name'] = $new_name;\n        $SESSION['image']['file_name']\
    \ = $file['name}';\n        echo '<h4>The file has been uploaded!</h4>';\n   \
    \ } else {\n        trigger_error('The file could not be moved.');\n        unlink($file['tmp_name']);\n\
    \    }\n} // End of array_key_exists() IF.\n```"
