  md: "# 5. Create an array for identifying problematic items:\n\n```\n$remove = array();\n\
    ```\n\nWith the site as written, it’s possible that the customer is still trying\
    \ to purchase items that aren’t available. There are a couple of ways you can\
    \ handle this. First, you could remove those items from the cart and place them\
    \ in the wish list, as this page will do. Alternatively, you could allow the sale\
    \ to go through with the thinking that the item would be available relatively\
    \ soon. The risk of such a policy depends upon what’s being sold and how readily\
    \ it’s available. This site will not actually charge a customer’s card until a\
    \ product ships, so allowing an order to go through that may not be fulfilled\
    \ at that moment is not fraudulent.\n\nIn any case, the $remove array will be\
    \ used to store insufficiently stocked products found in the customer’s cart so\
    \ that they can later be removed.\n\n# 6. Fetch each product:\n\n```\nwhile ($row\
    \ = mysqli_fetch_array($r, MYSQLI_ASSOC)) {\n```\n\n> **tip**\n> \n> You could\
    \ also write logic that will sell a partial order: If the customer wants four\
    \ of something and only three are available, sell three and move one to the wish\
    \ list. Or the site could ask the customer how they want the item to be handled.\n\
    \n# 7. If the quantity of the item in the cart is greater than the stock on hand,\
    \ make a note of the item:\n\n```\nif ($row['stock'] < $row['quantity']) {\n\t\
