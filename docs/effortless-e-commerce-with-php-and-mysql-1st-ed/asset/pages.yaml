- pgno: 322
  md: '# # TESTING THE SITE


    With all the code written, you can fully test the site. You could use your own
    information—including credit card data—to test the payment gateway, but that''s
    not the best of ideas. Here are syntactically valid, test credit card numbers:


    +   - 370000000000002, American Express

    +   - 6011000000000012, Discover

    +   - 555555555554444, MasterCard

    +   - 4007000000027, Visa


    **tip**


    In January, the site won''t accept an expiration date in the past because the
    year would have to be the previous year, which isn''t an option.


    Those numbers will work, regardless of the address and CVV values used with them.
    If you want to make them fail, one option is to use an expiration date in the
    past.


    Authorize.net has its own method for triggering specific responses. If you use
    the faux-Visa number 4222222222222222, the `amount` value can trigger a specific
    error response. For example, the response reason code of 6 means the credit card
    number is invalid. If you process a test transaction using that Visa number and
    an amount of 6.00, the returned response will be that the transaction was declined
    because of an invalid credit card number.


    Because the amount used in the payment process is not an editable, dynamic value
    (which, for security purposes, is for the best), you''ll have to manually alter
    the `gateway_process.php` script accordingly:


    ```

    $data[''x_amount''] = 6.00;

    ```


    You also need to add this parameter:


    ```

    $data[''x_test_request''] = ''TRUE'';

    ```


    You should know that when you use the `x_test_request` setting, the returned transaction
    ID will always be zero. This is not a mistake.'
  merge: -1
  img_proc: true
- pgno: 323
  md: "# GOING LIVE\n\nOnce you're happy with the site and it's time to go live, here's\
    \ all you need to do...\n\n+   1. Make sure you have an actual Authorize.net account,\
    \ associated with your merchant bank.\n\n+   2. Use your actual Authorize.net\
    \ login ID and transaction key in the gateway_process.php script.\n\n+   3. Set\
    \ the site to live in the configuration file:\n\n```\n$live = true;\n```\n\nBy\
    \ changing the value of the $live variable, the site will hide all errors and\
    \ use the live Authorize.net URL. If you still want to see the errors (for the\
    \ last round of testing, Step 4), keep $live set to false in the configuration\
    \ file but set $live equal to true at the top of gateway_process.php.\n\n+   4.\
    \ Test the site a couple more times, just to be safe.\n\nUnless you go into the\
    \ Merchant Interface to change your account mode, even a real Authorize.net account\
    \ begins in test mode. So this round of tests just confirms that your account\
    \ information is working with the live Authorize.net URL.\n\n+   5. Use the Merchant\
    \ Interface to take your account live.\n\n+   A. Log in to the Merchant Interface\
    \ at https://account.authorize.net.\n+   B. Click Account in the main toolbar.\n\
    +   C. Click General Security Settings > Test Mode.\n+   D. Click Turn Test Off.\n\
    \n+   6. Run one or two real transactions, as an extra precaution.\n\nYou can\
    \ test the site by purchasing something inexpensive, just to be safe. Then you\
    \ can go into the Merchant Interface and quickly void the transaction. (You can\
    \ easily find the transaction under Search > Unsettled Transactions.)\n\n> **tip**\n\
    > \n> Authorize.net, like all payment gateways, completes the processing of all\
    \ transactions at a particular time each day."
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # 11 SITE ADMINISTRATION


    The last requirement of the Coffee site is the ability to administer it. As a
    book has limited pages, there''s not enough room to discuss and develop every
    administrative feature, but this chapter will walk through the most important
    and complex ones.


    The site administration pertains to three categories of information:


    +   - Products

    +   - Sales

    +   - Orders


    For each of these, the chapter will present one or more scripts to view and manipulate
    the respective data, such as adding new products, defining sales, increasing inventory,
    viewing orders, and so on.


    The administrative pages will use neither the MVC approach nor the stored procedures
    that the public side does. Instead of using stored procedures, the chapter will
    use prepared statements (when appropriate), providing you with a different approach
    for working securely with a database. Without using stored procedures, the MVC
    design will be undermined, and because the administrative side won''t have the
    performance and maintenance demands of the public side, it makes sense to use
    a single, complete PHP script for each task.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The administration pages will also use the jQuery (www.jquery.com) JavaScript
    framework, which may be new to you. You''ll see it integrated into the site in
    a couple of practical, but simple, ways.


    # SETTING UP THE SERVER


    At this point, after all the work completed in the preceding four chapters, there''s
    actually not much server setup to be performed. The administrative site can use
    the same configuration file and database connection file as the public side. It
    can also use the same CSS, footer, and images.


    The most important setup involved is the creation of an HTML header appropriate
    for what the administrator will need to do. Also, a few lines of code have to
    be added to the `create_form_input()` function. Before that, though, I want to
    restate the need for folder-based authentication.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_325_0.png)


    tip


    Even if you wanted the extra security of having the administrator connect to the
    database as a MySQL user with different privileges, that can still be accomplished
    using only a single PHP connection script.


    # Requiring Authentication


    Unlike the Knowledge is Power example in which administrators use the same integrated
    login system as the customers, the Coffee site has all the administrative scripts
    within their own directory. Since the administrative pages will allow access to
    some customer information — name, address, email address, and phone number (but
    no billing data), it''s imperative that the administrative directory is secure.
    To start, give the directory a unique name, or, better yet, put the administrative
    files in a subdomain such as http://admin.example.com (again, using a more original
    value in lieu of admin).


    Second, the admin pages should be available only via HTTPS. Chapter 7, “Second
    Site: Structure and Design,” walks through a mod_rewrite definition (for the Apache
    Web server) that can enforce this constraint.


    Third, the administrative directory must be password protected. Chapter 7 also
    talks about how you might use a host-provided control panel for performing this
    task. By protecting the directory, users will be prompted for a username and password
    when they attempt to access any of the administrative directory’s content (see
    Figure 7.8).'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# # Creating a Template


    Naturally, the administrative pages will use a different template than the public
    side, as there are different scripts with different purposes. The admin template
    is just a modified version of the public template (Figure 11.1). It features:


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_326_0.png)


    Figure 11.1


    +   - Different primary links

    +   - Drop-down suckerfish menus

    +   - No background image behind the content

    +   - A wider area for the content


    Almost all these changes can be made by creating a new header file (you''ll see
    the new, full header code shortly).


    The primary links represent the three main content areas—products, sales, and
    orders, plus customers (although no customer-related script will be created in
    this chapter). The products link will reveal sublinks when the mouse hovers over
    it, using an approach known as suckerfish (if you search online for the term,
    you''ll find thousands of results). Figure 11.2 shows the effect.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_326_1.png)


    Figure 11.2'
