    cURL directly.


    Because this site uses cURL, you may be able to test the entire system on your
    development server (for example, your own computer). This differs from the Knowledge
    is Power example (developed in Part Two, “Selling Virtual Products”), which had
    to be online, because PayPal needs to communicate directly with the e-commerce
    Web site.


    # CREATING A TEST ACCOUNT


    There are two ways you can create an account for testing the Authorize.net system.
    First, if you create a *real* Authorize.net account, associated with your business
    and tied to your merchant bank account, that account will initially be in a testing
    mode. Once you’ve finished testing the account, you only need to go into the Merchant
    Interface to take the account live. The second option is to create a true test
    account: an account with limited functionality that cannot


    **tip**

    If you know you''ll be using Authorize.net for a real project, go ahead and create
    a real account with Authorize.net now.'
