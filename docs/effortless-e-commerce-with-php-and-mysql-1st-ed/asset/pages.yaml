- pgno: 190
  md: '**tip**


    As always, use obscure and secure usernames, passwords, and directory names for
    administrative folders.


    The control panel should take you to a form where you can indicate what directory
    to protect, as well as what message should be provided to someone attempting to
    access that directory (Figure 7.7). This message will appear in the Web browser''s
    login prompt (Figure 7.8). Depending upon your control panel, you might use another
    form to establish the username and password required to access the protected directory
    (Figure 7.9).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_190_0.png)


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_190_1.png)


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_190_2.png)


    # PROTECTING OTHER DIRECTORIES


    Beyond password protection, there are other ways you can keep a folder safe from
    unwanted visitors. The process of password protecting a directory creates (or
    modifies) an .htaccess file, which alters how the Apache Web server treats that
    directory and its contents (other Web servers use other approaches). This file,
    literally named .htaccess and placed in the directory you want to affect, has
    a specific syntax for achieving different effects.


    For example, you can use the .htaccess file to make a directory entirely unavailable
    through the Web browser. The syntax for that is:


    ```

    # Disable indexing:

    Options All -Indexes

    # Ignores every file:

    IndexIgnore *

    # Prevent access to any file:

    <FilesMatch "^.*$">

    Order Allow,Deny

    Deny from all

    </FilesMatch>

    ```


    As the comments indicate (comments in an .htaccess are preceded by a #), the first
    command allows every option except for indexing, which is to say the Web browser
    should not create an index of the directory. The second command says that every
    file should be ignored by any indexing (this is an extra precaution).


    The final block applies a set of rules to a group of files, that group being every
    file in the directory (^.*$). The Order Allow,Deny command indicates'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'that all allow rules should be checked first, then all deny rules. Then, the
    Deny from all command says that no one should be allowed access.


    If you create a file with a name of .htaccess that contains that code and place
    it in both your includes and views directories, no one will be able to see the
    contents of those directories, or a specific file therein, through a Web browser
    (Figure 7.10).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_191_0.png)


    Figure 7.10


    Most likely, your Web host will not have a control panel tool for editing .htaccess
    files, but you might be able to create one in any text editor, and then FTP it
    to the Web server. Or, you could create one on the server via a command-line interface
    and a command-line text editor like vi or Emacs. Using .htaccess files will only
    work if the Web server is configured to allow changes on a directory basis. This
    setting is dictated by the server’s primary configuration file, which is likely
    outside your influence, unless you’ve got your own server.


    > tip

    > This section packs a lot of information about .htaccess files and Apache configuration
    into a small area. Look online to expand your knowledge of these important subjects.


    # USING MOD_REWRITE


    The next server alteration, which also requires .htaccess files, is to use Apache’s
    mod_rewrite feature.


    > tip

    > If you can’t use mod_rewrite on your server, just skip this section and change
    every URL in the HTML files accordingly.


    As mentioned in Chapter 5, “Managing Site Content,” one way to improve the search-engine
    rankings of your site is to use descriptive URLs. To accomplish this—to create
    so-called “pretty” URLs—requires using mod_rewrite, which is Apache’s rewrite
    module. This tool can transform URLs from one format to another, behind-the-scenes,
    so that the browser (that is, the user) is unaware of the change.


    For the Coffee site, two public URLs need to be rewritten: shop.php and browse.php.
    The shop page will list the general coffee and non-coffee product categories.
    To know which to display, the page needs to receive a type value in the URL. Instead
    of having URLs like shop.php?type=coffee, let’s use shop/coffee/. To accomplish
    this, you would create a .htaccess file in the Web root directory that starts
    off with:


    ```

    <IfModule mod_rewrite.c>

    RewriteEngine on

    </IfModule>

    ```'
