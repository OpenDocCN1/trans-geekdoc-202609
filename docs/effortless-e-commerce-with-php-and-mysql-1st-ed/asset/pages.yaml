- pgno: 162
  md: "```\necho '<form action=\"https://www.sandbox.paypal.com/cgi-bin/webscr\"'\n\
    \     method=\"post\">\n<input type=\"hidden\" name=\"cmd\" value=\"_s-xclick\"\
    >\n<input type=\"hidden\" name=\"hosted_button_id\" value=\n     \"8YW8FZDELF296\"\
    >\n<input type=\"image\" src=\"https://www.sandbox.paypal.com/en_US/i/\n     btn/btn_subscribeCC_LG.gif\"\
    \ border=\"0\" name=\"submit\" alt=\"PayPal -\n     The safer, easier way to pay\
    \ online!\">\n<img alt=\"\" border=\"0\" src=\"https://www.sandbox.paypal.com/en_US/i/\n\
    \     scr/pixel.gif\" width=\"1\" height=\"1\">\n</form>';\n```\n\nThe above code\
    \ should be placed just after the thank you message and before the footer is included.\n\
    \nThere are two more changes that need to be made. First, the original INSERT\
    \ query gave the new user access for the next month. Now it should be changed\
    \ so that the user's access is good until yesterday (that is, their account isn't\
    \ active):\n\n```\n$q = \"INSERT INTO users (username, email, pass, first_name,\
    \ last_name,\n     date_expires) VALUES ('$u', '$e' . \". get_password_hash($p)\
    \ . \". '$fn',\n     '$ln', SUBDATE(NOW(), INTERVAL 1 DAY ))\";\n```\n\nSecond,\
    \ let's store the user's new ID value in a session so that their record may be\
    \ updated when they return from PayPal. To do so, just add the following code\
    \ anywhere after you confirm that `mysqli_affected_row($dbc)` equals 1:\n\n```\n\
    $uid = mysql_insert_id($dbc);\n$_SESSION['reg_user_id'] = $uid;\n```\n\nI'm specifically\
    \ naming this `reg_user_id` instead of `user_id` so as not to confuse the system\
    \ into thinking the user has logged in when they haven't (the login process creates\
    \ `$_SESSION['user_id']`). You'll see `$_SESSION['reg_user_id']` used in thanks.php.\n\
    \n# Creating thanks.php\n\nThe customer ends up at the thanks.php page after completing\
    \ their PayPal order and clicking a button to return to this site. This page needs\
    \ to update the database, adding a year of access to the user's account (Figure\
    \ 6.12). Here's how it might be defined:"
  merge: -1
  img_proc: true
- pgno: 163
  md: "![](img/4f47e47c67bd619ac73250f11c9fc7ce_163_0.png)\n\n# Figure 6.12\n\n# thanks.php\n\
    \n```\n1 <?php\n2 require ('. /includes/config.inc.php');\n3 redirect_invalid_user('reg_user\
    \ id');\n4 require (MYSQL);\n5 $page_title = 'Thanks!';\n6 include ('. /includes/header.html');\n\
    7 $q = \"UPDATE users SET date_expires = ADDDATE(date_expires,\n~ INTERVAL 1 YEAR)\
    \ WHERE id={$_SESSION['reg_user id']}\";\n8 $r = mysqli_query ($dbc, $q);\n9 unset($_SESSION['reg_user\
    \ id']);\n10 ?><h3>Thank You!</h3>\n11 <p>Thank you for your payment! You may\
    \ now access all of the site's\n~ content for the next year! <strong>Note: Your\
    \ access to the site will\n~ automatically be renewed via PayPal each year. To\
    \ disable this feature,\n~ or to cancel your account, see the \"My preapproved\
    \ purchases\" \n~ section of your PayPal Profile page.</strong></p>\n12 <?php\
    \ include ('. /includes/footer.html'); ?>\n```\n\nThree key lines are highlighted.\
    \ First, this script should be accessed only if the reg_user_id element exists\
    \ in the session, meaning the page is accessible only after registering.\n\nSecond,\
    \ the query runs an UPDATE command on the users table, adding one year to the\
    \ expiration date for this user.\n\nThird, the $_SESSION['reg_user_id'] element\
    \ is unset after the query. By taking this step, the page can be loaded only once.\
    \ That check prevents hackers from adding years to their account by just reloading\
    \ this page.\n\nFrom a security standpoint, there's one problem with this script:\
    \ It assumes that the user has paid, but you don't actually know that for certain.\
    \ If you register a new account and then change the URL to thanks.php, without\
    \ going through PayPal, the net effect will be the same. That would be bad.\n\n\
    > As a courtesy, the customer is told that payments will automatically recur and\
    \ what they can do to prevent that."
  merge: -1
  img_proc: true
- pgno: 164
  md: 'From a customer standpoint, there are three problems. First, they''ll be credited
    for their purchase only if they return to this page. This puts the responsibility
    on the customer, where the responsibility is really yours to make sure they get
    what they''ve paid for. Second, there''s no confirmation that the UPDATE query
    worked properly (that is, that one row was affected). And third, there''s no record
    anywhere associating the customer''s PayPal order with their account on this site.


    All four of these issues will be remedied in a few pages by using something called
    IPN.


    # Creating cancel.php


    If the customer cancels the PayPal transaction, they will end up at the cancel.php
    page. This page should just indicate to the customer where their account now stands
    (Figure 6.13). Here''s how that script might look:


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_164_0.png)


    Figure 6.13


    # cancel.php


    ```

    ```php

    <?php

    require (''./includes/config.inc.php'');

    require (MYSQL);

    $page_title = ''Oops!''; include (''./includes/header.html'');

    ?><h3>Oops!</h3>

    <p>The payment through PayPal was not completed. You have a valid membership at
    this site, but you will not be able to view any content until you complete the
    PayPal transaction. You can do so by clicking on the Renew link after logging
    in.</p>

    <?php include (''./includes/footer.html''); ?>

    ```

    ```


    The important thing is for this script to indicate that:


    +   1. The customer has successfully registered at the site.

    +   2. The customer still can''t access any content.

    +   3. To change #2, the customer should log in and click renew.


    The renew process will be implemented toward the end of the chapter.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# # TESTING THE SITE\n\nBy this point in time, the site is really very close\
    \ to being a complete and real-world e-commerce project. To verify this, let’s\
    \ test the system as it currently stands.\n\n> > **note**\n> \n> You’ll still\
    \ need to be logged in to the PayPal Sandbox (http://developer.paypal.com) to\
    \ use the PayPal Sandbox Test Site.\n\n+   1. Successfully register with the *Knowledge\
    \ is Power* site.\n\nIf you want, after registering and before Step 2, you could\
    \ take a look at the database (using phpMyAdmin or another tool) to confirm that\
    \ the user was registered but with a *date_expires* value in the past. You could\
    \ also log in to the site with this new account (in a new browser window or tab)\
    \ to confirm this.\n\n+   2. Click the PayPal button shown on the registration\
    \ page.\n\n+   3. On the PayPal site, use one of the test-buyer accounts to log\
    \ in (Figure 6.14).\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_165_0.png)\n\n\
    Figure 6.14\n\n+   4. On the next page, click the Agree and Pay button (Figure\
    \ 6.15).\n\n> > **tip**\n> \n> If you click the *Cancel and Return* link, you’ll\
    \ be taken to the site’s cancel page.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_165_1.png)\n\
    \nFigure 6.15"
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   5. Once the purchase has been completed, click the Return to... button
    to return to the *Knowledge is Power* site (Figure 6.16).


    The PayPal Sandbox will not actually send emails, but the emails that would be
    sent are viewable in the Sandbox''s Test Email section.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_166_0.png)


    Figure 6.16


    +   6. Look at the database again, or log in, to confirm that the expiration date
    now works.


    +   7. Log in to the PayPal Sandbox Test Site using the seller account to view
    the orders.


    # # USING IPN


    IPN is triggered for any kind of transaction, including purchases, refunds, disputes,
    and more.


    The PayPal system as written will work, but unfortunately the site only reacts
    to a user action: If the user doesn''t, for whatever reason, return to your site
    (before the session expires), they won''t be credited with a year of access. This
    is pretty bad form, because the user''s action of sending you money via PayPal
    should be sufficient. Granted, you can go into PayPal''s system and see every
    credit you''ve received, but then it would be up to you to follow through and
    the user still can''t access the site''s content until the circuit has been completed.


    An alternative to IPN is PDT (Payment Data Transfer). Through PDT, you can confirm
    the results of a PayPal order, but PDT is only invoked when the user returns to
    your site.


    Fortunately, PayPal thought of this and created something called *Instant Payment
    Notification* (IPN). IPN, when set up, will notify a Web site when a payment has
    been processed. This isn''t “notify” in the sense of sending you an email—PayPal
    will already do that, but rather a server-to-server communication that neither
    the customer nor the site''s administrator will witness. Through these communications,
    the e-commerce site can verify the transaction and update the database accordingly.
    More importantly, this communication will take place automatically no matter what
    the customer does after completing their order within PayPal.


    Integrating IPN is a two-part process: enabling it on a PayPal account and creating
    the listening script on the server.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# # Enabling IPN


    The first part of the two-part process to integrate IPN is enabling IPN in your
    PayPal account.


    +   1. Log in to the PayPal Sandbox Text Site using the steps already outlined.

    +   You''ll need to log in using your merchant account.


    +   2. Click Profile.


    +   3. Click Instant Payment Notification Preferences, under Selling Preferences.


    +   4. On the subsequent page, enter the Notification URL (Figure 6.17).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_167_0.png)


    Figure 6.17


    The notification URL needs to be a page on your site accessed via HTTPS. I''m
    naming it ipn.php, but you may want to use a more original name than that.


    +   5. Select the Receive IPN messages (Enabled) option.


    You can disable IPN through these preferences by selecting the Do not receive
    IPN messages (Disabled) option.


    +   6. Click Save.


    # # Updating the Registration Script


    Yes, yes: I said that integrating IPN was a two-part process and here I am introducing
    a third. I stand by my two-part statement because this third step may or may not
    be necessary. I''ll explain...


    For the user to be properly credited, there needs to be a way to tie their account
    on the e-commerce site to the PayPal purchase. In the previous register.php-PayPal-thanks.php
    system, the tie-in was accomplished by storing the user''s ID value in a session
    and then retrieving it on the thanks.php page. Since this new version of the process
    won''t rely upon the thanks.php page to perform the update, the user must be tracked
    in another way. To do so, the updated site will use IPN to pass all sorts of information
    back to the e-commerce site.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'One theoretical option would be to use the customer''s email address to update
    the account. This is information that the IPN will return in the $_POST[''payer_email'']
    variable. I say "theoretical," because if the customer registered with one email
    address but signed in to PayPal with another, this won''t work. My more foolproof
    solution is to pass the user''s ID along to PayPal so that PayPal may return it
    as part of the IPN data. Here''s how register.php should be altered to implement
    this technique:


    +   1. Remove the line that stored the user ID in the session.


    +   2. Add the following code to the PayPal form:


    ```

    <input type="hidden" name="custom" value="" . $uid . "">

    ```


    This code is output by an echo statement as part of the larger form and PayPal
    button. The code creates a hidden form input with a name of custom. You must use
    that exact name for the input, because custom is a special way to pass any data
    to PayPal with the express intent of having it returned to the site. The value
    is the user''s ID, already determined by calling mysqli_insert_id().


    While you are expanding the code and functionality, go ahead and pass the user''s
    email address to PayPal as well, so that the PayPal login form will be prepopulated
    with it (and this may also be usable as a fallback way to connect site users with
    PayPal transactions). There are many hidden-form inputs that PayPal will recognize,
    like first_name, last_name, and email. Here''s the new echo statement in register.php:


    ```

    echo ''<form action="https://www.sandbox.paypal.com/cgi-bin/webscr"

    method="post">

    <input type="hidden" name="cmd" value="_s-xclick">

    <input type="hidden" name="custom" value="" . $uid . "">

    <input type="hidden" name="email" value="" . $e . "">

    <input type="hidden" name="hosted_button_id" value="

    "8YW8FZDELF296">

    <input type="image" src="https://www.sandbox.paypal.com/en_US/i/

    btn/btn_subscribeCC_LG.gif" border="0" name="submit" alt="PayPal -

    The safer, easier way to pay online!">

    <img alt="" border="0" src="https://www.sandbox.paypal.com/en_US/i/

    scr/pixel.gif" width="1" height="1">

    </form>

    '';

    ```


    For the email value, you''ll see that I''m using the $e variable, which would
