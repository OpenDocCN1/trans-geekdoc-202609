- pgno: 152
  md: '# # 6 USING PAYPAL


    The final, yet most important step in the Knowledge is Power site is to integrate
    PayPal so that the site may actually make money. It''s not hard to use PayPal,
    but it''s such a critical step that I want to give it extra attention. And, as
    with many technologies, wading through all the documentation and possible uses
    can be the hardest part.


    In this chapter, you''ll learn about the current state of PayPal and what payment
    options PayPal offers. The next step is to sign up for PayPal''s Sandbox feature,
    so that you can create dummy PayPal accounts for testing purposes. After that,
    you can complete the PHP scripts required by the site and completely test the
    end result. Once you''re satisfied that everything is working properly with your
    test accounts, you will repeat some of these steps for a live PayPal account,
    quickly update a couple of pages, and you''re good to go!


    # ## ABOUT PAYPAL


    PayPal is perhaps the biggest payment solution provider around, and there''s good
    reason to consider using it with your e-commerce sites. From a development standpoint,
    it''s quite simple to integrate PayPal. From the customer''s point of view, PayPal
    is a trusted name, which makes a big difference in a user''s willingness to part
    with their money. With other providers, you may be able to create a more professional
    experience or save money on transaction fees, but don''t dismiss PayPal, just
    because it may be the “lowest common denominator” of solutions.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'One frequent misconception about PayPal is that customers must also have a
    PayPal account. If a customer does have a PayPal account, they can make a payment
    using it. But both PayPal users and non-PayPal users can also pay with their credit
    cards through PayPal''s system. A second misconception is that PayPal transactions
    always go through the PayPal site. This used to be the case, but PayPal has two
    primary payment solutions now, one of which allows you to handle customer transactions
    without the user leaving your site.


    +   PayPal offers:

    +   - No setup fees

    +   - No monthly costs for the basic payment option

    +   - Fraud protections

    +   - Shipping calculators and shipping label service

    +   - Tax calculators

    +   - Availability in 190 countries and with 21 currencies

    +   - Currency conversions

    +   - International tax and shipping calculators

    +   - Ability to send invoices

    +   - Inventory management

    +   - A virtual terminal to manually process transactions

    +   - Integration with popular third-party e-commerce systems, such as osCommerce
    and ZenCart


    What PayPal doesn''t do, however, is transfer money directly into your bank account.
    The funds received from transactions get applied to your PayPal account. You can
    then go into your PayPal account and transfer money to your registered bank account,
    which will probably take a couple of days to go through. At the PayPal Web site,
    you can also view monthly reports, search through your transaction history, and
    even allow different types of users to access the PayPal account (for example,
    a low-level user may only be allowed to print shipping labels without seeing any
    payment details).


    > **tip**

    > PayPal has tons of documentation and videos explaining the various programs,
    features, and fees. Almost too much, really...


    > **tip**

    > You must have a Premiere or Business PayPal account in order to receive money.


    > **note**

    > All the information about PayPal in this chapter is current as of this writing
    and is subject to change.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# # Payment Solutions


    PayPal offers two base payment solutions, named Website Payments Standard and
    Website Payments Pro. Both solutions allow you to accept payment from PayPal users
    or via credit cards. Both solutions also allow you to use a shopping cart, whether
    a custom one of your own devising or a third-party system.


    > > **note**

    > There''s no guarantee a user will immediately return to your site after completing
    the PayPal process.


    The Standard option is pretty much what people historically think of as PayPal:
    The customer starts off on your site and then heads to the PayPal site to complete
    the transaction, after which they can return to your site. There is no monthly
    fee for this option, and it''s easy to set up: You just need your own PayPal account.
    Although you can customize the PayPal experience to some degree, it will be clear
    to the customer that they are no longer on your site, and the charge on the customer''s
    credit card statement will use a combination of PayPal and your business''s name.


    > > **note**

    > All prices in this chapter and book are in United States dollars.


    The Pro payment solution is like other payment gateways in that the customer does
    not need to leave your site to complete the transaction (that is, to pay you).
    The Pro system is $30 per month and you have to complete a credit application
    to qualify (you''ll need your own PayPal account as well, of course). The Pro
    system will also let you customize the fraud protection, but you will need to
    take extra steps to protect the credit card data because it''ll be temporarily
    handled on your system (stricter PCI compliance will be necessary).


    > > **tip**

    > If your transactions normally average less than $10 each, you can save money
    by using PayPal''s micropayments rates.


    The transaction fees, regardless of the solution type, are 30 cents per transaction.
    You''ll also pay a percentage of the transaction total, depending upon how much
    business you do per month (Table 6.1).


    | Monthly Sales | Per Transaction Fee |

    |---|---|

    | $0 to $3,000 | 2.9% + $0.30 |

    | $3,000.01 to $10,000 | 2.5% + $0.30 |

    | $10,000.01 to $100,000 | 2.2% + $0.30 |

    | over $100,000 | 1.9% + $0.30 |


    > > **note**

    > Currency conversions and payments from other countries have extra fees.


    In this chapter, you''ll use the Website Payments Standard solution. You can assume
    that most of what I say and do throughout the rest of this chapter applies only
    to it. The next e-commerce site, Coffee (in Chapter 7, “Second Site: Structure
    and Design”), will use another payment gateway. That process and code is comparable
    to using PayPal''s Website Payments Pro solution.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# # Payment Buttons


    The Website Payments Standard system relies upon using PayPal''s tools to generate
    HTML code specific for your e-commerce situation. By filling out a form and answering
    a few questions, PayPal will create some HTML that you can drop into the right
    spot on your Web site. The code itself creates an HTML button that, when clicked,
    takes the user to PayPal.


    There are different types of default buttons for different situations:


    +   - Buy Now, for selling single items

    +   - Add to Cart, for selling multiple items

    +   - Subscribe, for selling subscriptions

    +   - Donate, for accepting donations


    You''ve no doubt seen examples of these buttons many times over (Figure 6.1).
    The Buy Now and Add to Cart buttons also let you set different attributes for
    products and adjust the price based upon the selected attributes. For example,
    if you sell software through your site, the customer might be allowed to select
    the number or type of licenses to purchase.


    You can start with one of these default buttons, customize it to your situation,
    and even use a different image for the button itself. As a security feature, the
    button only passes identifiers—an indicator of your account and a button ID—to
    the PayPal Web site. All the particulars, such as the price to be charged, are
    stored within PayPal''s system, meaning that a hacker can''t manipulate those
    values.


    For this project, you''ll use the subscribe option, because the site is selling
    subscriptions to its content. The subscribe feature comes in two formats:


    +   - Recurring payments via a PayPal account

    +   - Recurring payments without a PayPal account


    The latter allows anyone to use a credit card to make the purchase; there is a
    $19.99/month fee (to you, the merchant) for this service.


    Once the user subscribes via PayPal, they''ll automatically be billed again when
    the time period you establish is up. From a business perspective, a recurring
    payment is great, because you continue to get your money until the customer cancels
    the recurring payment. You should indicate this to the user, though, and perhaps
    let them know their account is about to expire and that they''ll be billed again
    prior to that occurring (or else you''ll have to be prepared to process some refunds).


    > **tip**

    > Buttons you''ve created can be customized later, like to change the price charged
    for an item.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_155_0.png)


    > **tip**

    > You can even offer trial periods as part of a subscription, although you won''t
    in this site.


    > **tip**

    > You could create a script that emails any user whose account is about to expire
    within the next week. Then execute the script once or twice a week.


    > **tip**

    > Users can see what automatic billings they have agreed to under the My preapproved
    payments section of their PayPal Profile page.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# TESTING PAYPAL


    As part of the process of testing a new Web site, you most certainly want to

    test the payment-handling system. PayPal, like most payment solutions, offers

    a playground environment that can pretend to handle transactions without

    any real money changing hands. With PayPal, you test transactions using the

    PayPal Sandbox. So let’s start by setting that up.


    # THE MANY FACES OF PAYPAL


    There are three different PayPal-related sites that you’ll deal with. The first
    and most

    obvious is the real PayPal, at www.paypal.com. Before the site goes live, you’ll
    need a

    PayPal account there, representing the site. You’ll recreate your button there,
    and you’ll

    see your transactions there.


    There are two sites used as part of the testing process. The first is the Sandbox,
    at

    http://developer.paypal.com. To create and use test accounts, you’ll register
    at the

    Sandbox with a real email address, and then log in. To use those sample accounts
    to

    test your site, you’ll need to remain logged in to the Sandbox (in the same browser).


    The last site you’ll use is the Sandbox Test Site at www.sandbox.paypal.com. This

    site looks and functions exactly like the real PayPal, except that it says “Test
    Site”

    and “Sandbox” here and there.


    As you read the rest of this chapter, pay close attention to which PayPal site
    I refere-

    nce at each step. Make sure that the URL in your browser matches each instruction

    appropriately.


    # Registering at the PayPal Sandbox


    The PayPal Sandbox is a replication of the real PayPal, but you create and

    control the cast of characters. To use it, you’ll need to register with a real
    email

    address and password to create a Sandbox account, then you can use that

    account to create fake buyers and sellers.


    +   1. Go to https://developer.paypal.com.


    +   2. If you do not already have a PayPal Sandbox account (which is not the same

    +   as a PayPal account), create one by clicking Sign Up Now.


    +   3. Complete the simple registration form (Figure 6.2).


    PayPal recommends that you use a different email address and password

    than your actual PayPal account, for security sake.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/4f47e47c67bd619ac73250f11c9fc7ce_157_0.png)


    Figure 6.2


    +   4. Check your email. After registering, you''ll receive an email with a link
    that you must click to activate your account.


    +   5. Click the link in the email to activate the account.


    +   6. Log in to the PayPal Sandbox using your email address and password.


    # Creating Test Accounts


    Once you''ve registered and logged in to the Sandbox, the next step is to create
    at least two accounts: one merchant (the business) and one personal (the customer).


    +   1. Log in to the PayPal Sandbox, if you have not already.


    +   2. Click the Test Accounts link. At the time of this writing, there are only
    four main areas of the Sandbox, aside from the home page.


    +   3. Click the Preconfigured link beside the Create Account label (Figure 6.3).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_157_1.png)


    Figure 6.3


    > You can ignore the fact that Figure 6.3, and perhaps your own experience, has
    PayPal showing Website Payments Pro.'
