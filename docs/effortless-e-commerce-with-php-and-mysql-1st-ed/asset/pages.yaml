- pgno: 129
  md: '+   2. Extract the files from the download.


    +   3. Copy the tiny_mce folder from the extracted files to your Web root directory.


    When you extract the files in Step 2, the result will be a folder called tinymce.
    Within that are examples and js/scripts folders. Within js/scripts is the tiny_mce
    folder that contains the files you actually need.


    +   4. Open add_page.php in your text editor or IDE, if it is not already.


    +   5. After the closing form tag, add:


    ```

    <script type="text/javascript" src="/tiny_mce/tiny_mce.js"></script>

    ```


    The first thing you''ll need to do is include the main tiny_mce.js file, which
    is what this line does.


    > tip

    > Web pages will load more quickly if JavaScript is placed at the end of the document.


    +   6. On the next line, begin customizing TinyMCE:


    ```

    <script type="text/javascript">

    tinyMCE.init({

    // General options

    mode : "exact",

    elements : "content",

    theme : "advanced",

    width : 800,

    height : 400,

    ```


    This JavaScript code will turn a textarea into a WYSIWYG editor. To do so, the
    tinyMCE class''s init() function is called, sending it several name-value pairs.
    You can find these all detailed in the TinyMCE documentation, of course, but I''ll
    highlight the most important. A mode of exact means that only specific textareas
    should be converted, as opposed to all of them on that page. The elements value,
    content, indicates that the textarea with an id value of content should be converted.
    This matches the name and id values already given to the content textarea. The
    theme dictates what buttons and other configuration is used. You can see different
    themes in the documentation and in the examples folder; this page will use the
    advanced theme. The width and height properties change the size of the editor.


    > tip

    > You cannot use the same <SCRIPT> tag to include a separate JavaScript file and
    to write inline JavaScript code.


    > tip

    > You can customize how TinyMCE behaves using a global configuration file or individually
    when you use it in a particular script.


    +   7. Identify the plug-ins to use:


    ```

    plugins : "advlink,advlist,autoresize,autosave,contextmenu,fullscreen,

    iespell,inlinepopups,media,paste,preview,safari,searchreplace,

    visualchars,wordcount,xhtmlxtras",

    ```


    TinyMCE has a slew of plug-ins. Here I''m choosing to enable 16 of them.'
