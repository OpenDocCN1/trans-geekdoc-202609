    \ all the requisite functionality, including them is all this page needs to do\
    \ in order to make the payment request.\n\n+   7. Record the transaction results:\n\
    +   \n+   $reason = addslashes($response_array[3]);\n+   $response = addslashes($response);\n\
    +   $r = mysqli_query($dbc, \"CALL add_transaction($order_id,\n+    '$data['x_type']',\
    \ '$response_array[9]', '$response_array[0]', '$reason',\n+    '$response_array[6]',\
    \ '$response')\");\n+   \n+   This code is exactly like that in billing.php.\n\
    \n+   8. If the request was successful, create a message:\n+   \n+   if ($response_array[0]\
    \ == 1) {\n+       $message = 'The payment has been made. You may now ship the\n\
