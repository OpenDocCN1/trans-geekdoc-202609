    `date_modified` TIMESTAMP NOT NULL DEFAULT ''0000-00-00 00:00:00'',

    PRIMARY KEY (`id`),

    KEY `product_type` (`product_type`, `product_id`),

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    ```


    Unfortunately, this would mean another table joined into many of the SELECT queries.


    The most complicated way of calculating shipping is based on the distance (and
    possibly the weight or size as well). To pull this off, you''d need the customer''s
    postal code and, for international orders, country. You would then tie into the
    system developed by your shipping company of choice. For example, UPS and FedEx
    both have Application Programming Interfaces (APIs) available through which you
    can get exact prices on shipping based upon the distance, the weight, the size,
    and the delivery speed. These APIs work quite similarly to the payment gateway
    API. For more information, see the documentation for the shipping company of your
    choosing.


    # Improving the Cart Display


    The success of the site will depend, in some small part, on the user''s reaction
    to the shopping cart. If it''s nice and inviting and makes the customer comfortable,
    they''re more likely to complete the sale. With that in mind, you may want to
    put some effort into improving that interface. For example, you should probably
    consider creating links from the products in the cart to the product''s image
    and description in the site. Customers often like being able to revisit what they''re
    buying.


    Second, you could add messages to the cart page to indicate the result of the
    latest action. The message could range from something as simple as “The cart has
    been updated.” to something more specific like “Mugs: Red Dragon has been removed
    from your shopping cart.” To do this, the HTML view file will need to check for
    and display a message:


    ```

    if ($message) echo $message;

    ```


    Then the PHP script would assign a value to $message for each action. If you want
    to refer to specific products by name, you''d also need to create a stored procedure
    that retrieved the product information for a given product type and ID. Such a
    procedure could then be called after an INSERT, UPDATE, or DELETE query is executed.'
