- pgno: 18
  md: '# # 1 GETTING STARTED


    Just as the process of building a house does not begin with a hammer, creating
    an e-commerce site does not start with your computer. Well, you''ll probably use
    your computer for research, but actual coding is a step that comes much later.
    In this chapter, you''ll learn how to get started developing your e-commerce site.
    The goal is to explain two things:


    +   - The actual steps you''ll need to take

    +   - The perspective I have on e-commerce, which is also to say the perspective
    of this book


    While the point of this book is to provide concrete answers and usable code, there
    will be some subjects, especially over the next few pages, for which I cannot
    tell you what to do. In such cases, I try to identify what questions you''ll need
    to answer and how you might go about doing so.


    At a root level, the success of any type of Web site, whether or not it''s intended
    to make money, depends upon its reliability and performance: If people are attempting
    to use the site, can they? In this chapter, you''ll encounter many of the decisions
    you''ll need to make that impact your site''s availability. The choices you make
    aren''t permanent, but as with most things, not having to make big changes further
    down the road is preferable.


    The success of an e-commerce site further depends upon security. This chapter
    touches upon a few security issues, but security is addressed in more detail in
    the next chapter, and then throughout the rest of the book.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'The last thing to note is that you may be creating an e-commerce site under
    one of two scenarios: for yourself or for someone else. When creating a site for
    yourself, you''ll need to make most of the decisions. When creating a site for
    someone else, they''ll be the ones making most of these decisions and your part
    in the process is, at best, advisory. Take, for example, the business''s goals...


    # IDENTIFYING YOUR BUSINESS GOALS


    Before you do anything, anything at all—mock up a Web design, identify your Web
    host, or even buy the domain name—you need to identify your business goals. For
    an e-commerce site, the goal is to make money, which you can do in different ways:


    +   - Selling goods or services directly

    +   - Advertising on the site

    +   - Promoting goods or services that can be purchased elsewhere


    In this book, I''m using the term _e-commerce_ to refer to sites that directly
    accept money from end users. I''ve limited myself to that scope, because it demands
    a level of security well beyond other types of sites. Say you wanted to create
    a site that reviews music: You might give all the content away for free but hope
    to make money by displaying ads on your site and/or by using affiliate links to
    other sites that actually sell music. In either case, the security issues you
    would have are no bigger than those for most other non-e-commerce sites. As another
    example, my company''s Web site, **www.dmcinsights.com**, supports and augments
    the books I write, which ideally increases the sales of the books; however, the
    site itself does not take money directly. The goal in this book is to create sites
    that sell goods or services directly to customers.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_19_0.png)


    There are many facets to achieving a business''s goals. The focus of this book
    is strictly on manufacturing the online experience; you''ll need to follow through
    on your own with the other key issues, such as:


    +   - Creating a legal business entity

    +   - Properly handling business taxes

    +   - Accounting

    +   - Coordinating with vendors'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - Marketing your business


    +   - Managing employees and payroll


    +   - Controlling physical inventory


    +   - Managing shipping and returns


    In short, just creating the Web site is not all you''ll need to do. Most importantly,
    know going into this that even if you make a *fantastic* e-commerce Web site,
    that alone is no guarantee of business success.


    Give people a reason to visit your site even when they''re not shopping, so they
    might buy something on impulse or think of your site first when they do want to
    make a purchase.


    So stop reading right now and write down your business goals. What do you hope
    to achieve? What are your short-term goals? What are your long-term goals? Try
    to be realistic about them.


    Next, write down (on a large piece of paper!) everything you think you''ll need
    to do and have in order to achieve those goals. How much money can you invest
    up front? How much time? Who will help you? How will they be compensated? From
    where will you get more money when that need arises? Who is going to handle the
    bookkeeping? How will you get people to visit your site? If you''re selling physical
    products, where will they be stored? How will you perform the actual shipping
    of the merchandise?


    Clearly, there are a lot of questions involved, even for the most basic of goals.
    There is one key question I can answer for you: How do you create a good, secure
    e-commerce site? Answer: Read this book!


    # # RESEARCHING LEGAL ISSUES


    Rightfully so, whenever you''re dealing with other people''s money, and whenever
    you''re creating your own business, there are plenty of legal issues to consider.
    This is a big area in which I can be of little assistance: I''m not a lawyer,
    and I don''t know in which country, state, province, territory, or city you live.
    But this doesn''t mean I can''t point you in the right direction.


    # ## National and International Laws


    The legal issues involved differ when the Web site is for your business and when
    you''re creating it for a client. When working for a client, you need to sign
    a sound, legal contract. In particular, the contract should limit the liability
    you personally have should something go wrong. As a general rule, good contracts'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'limit your liability to the amount of money you made on the project itself,
    should you be at fault. Also, you should define a process for how to handle change
    requests. Normally, my clients get one round of requests after the initial version
    of the site is complete. Secondary requests, or any additions unreasonably beyond
    the original scope of the contract, must be renegotiated.


    If you have your own business and there is no client, then there are tons of other
    legal issues to investigate, having nothing to do with the e-commerce site itself.
    For these, start by contacting every applicable governmental department to see
    what you must know and do. Many cities and states have small business branches
    dedicated to helping people like you navigate the maze of legal necessities.


    In either case, you must be knowledgeable about legal issues specifically addressing
    online commerce. Again, your local and national governments should be able to
    provide you with this information. The particulars will differ greatly from one
    country to the next. They may even depend upon where you''re located, where the
    client is located, where the customers are, where the site is physically hosted,
    where the associated bank can be found, and so forth. In the United States, the
    Federal Trade Commission (FTC) oversees many aspects of e-commerce. On their Web
    site, www.ftc.gov, they provide guidelines for e-commerce, international sales,
    security, and more.


    As another example, in the United Kingdom, there are exact requirements as to
    what information should be available on the Web site, as well as on order forms
    and in emails. This includes:


    +   - The company''s physical address

    +   - The company''s registration number

    +   - Any trade associations

    +   - The Value Added Tax (VAT) number


    Because you''ll be storing information about the customers, there are other laws
    involved. The European Union has specific regulations as to how personal data
    is stored and used. The United States also has precise rules about using customer
    email addresses for advertising, promotional emails, and how to handle disclosures.
    All these laws just apply to basic personal information; if you''re storing credit
    card data (and you really shouldn''t!), more laws apply.


    You''ll also need to know whether or not Internet sales should be taxed and, if
    so, at what rate. In the United States, this is currently a hotly debated topic
    and varies from state to state. And if you''re shipping physical products, there'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'are rules about when you can actually charge the customer based upon when the
    order ships. If part of the order ships, you can only charge the customer part
    of the order total at that time.


    **tip**

    All laws aside, treat the customer and their personal information as you would
    hope sites treat you and your information.


    Should the worst happen—your system be hacked and the data be breached—laws may
    apply as well. The state of California, for example, has very specific and strict
    laws as to what you must do once you find a security violation. Part of planning—a
    big part, really—is preparing yourself should the worst happen, so that you''re
    not scrambling to find answers in the middle of a crisis.


    # PCI Compliance


    Another legal issue on which you should be extremely well versed is PCI DSS, short
    for Payment Card Industry Data Security Standard (www.pcisecuritystandards.org).
    This is a specific set of rules for ensuring secure, proper handling of credit
    cards by all commercial vendors. Any company that processes, stores, or transmits
    credit card information must follow these guidelines, thereby being PCI compliant.


    **tip**

    Many payment gateways allow for recurring payments, meaning you can charge a customer
    multiple times, still without storing their payment information yourself.


    By following the code in this book, you''ll neither store nor process any credit
    cards yourself, which is really for the best. You absolutely do not want to store
    the user''s credit card information! There are companies that do that, yes, but
    that''s their full-time job and they have the knowledge, resources, and money
    to do that properly. Still, even taking credit card information on your site and
    passing it off to another company means you should be PCI compliant. The specific
    requirements differ based upon what you actually do with credit cards and how
    many transactions per year you process. I''ll get into those requirements in the
    next chapter.


    If your site is not PCI compliant and there is a security breach, several bad
    things could happen (beyond the effects of the security breach itself). First,
    the credit cards companies will likely escalate your security requirements to
    a higher level, such as requiring external security scans of your system. This
    means more work and likely more money. Second, the credit card companies that
    created the PCI DSS—Visa, MasterCard, American Express, Discover, and JCB—could
    make you pay any damages they incur because of your security breach. They may
    even fine you as well. Third, those same companies could deny you the option of
    accepting their cards, which will pretty much shut down your business.


    Now technically, the PCI DSS is not a law, but some parts of the specification
    may also be an applicable law in your country, state, province, or territory.
    And,'
  merge: -1
  img_proc: true
