    \ code:\n+   \n+   ```php\n+   if (preg_match ('/^(\\\\d{5})(\\\\d{5}-\\\\d{4})?$/',\
    \ $_POST['zip'])) {\n+   $z = $_POST['zip'];\n+   } else {\n+   $shipping_errors['zip']\
    \ = 'Please enter your zip code!';\n+   }\n+   ```\n+   \n+   The zip code can\
    \ be in either the five digit or five plus four format (12345 or 12345-6789).\n\
    \n> tip\n> \n> The str_replace() function is a faster alternative to preg_replace(),\
    \ usable when fancy pattern matching isn't required.\n\n+   13. Validate the phone\
    \ number:\n+   \n+   ```php\n+   $phone = str_replace(array(' ', '-', '.', '(',\
    \ ')'), '', $_POST['phone']);\n+   if (preg_match ('/^[0-9]{10}$/', $phone)) {\n\
    +   $p = $phone;\n+   } else {\n+   $shipping_errors['phone'] = 'Please enter\
    \ your phone number!';\n+   }\n+   ```\n+   \n+   The phone number must be exactly\
    \ ten digits long, which is easy to check. But as users commonly enter phone numbers\
    \ with and without spaces, hyphens, and parentheses, any of those characters that\
    \ may be present are first removed via str_replace(). Its first argument is an\
    \ array of values to find—space, hyphen, opening parenthesis, closing parenthesis;\
    \ its second argument is the replacement value (here, an empty string)."
