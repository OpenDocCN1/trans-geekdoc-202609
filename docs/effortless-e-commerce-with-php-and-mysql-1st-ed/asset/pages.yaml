  md: "# Creating the Basic PHP Script\n\nTo start, the basic PHP script will address\
    \ all of the GET functionality. It’s rather similar to checkout.php and really\
    \ short (without all the form validation and billing processing stuff).\n\n+ \
    \  1. Create a new PHP script in your text editor or IDE to be named billing.php\
    \ and stored in the Web root directory.\n\n+   2. Include the configuration file:\n\
    +   \n+   <?php\n+   require ('./includes/config.inc.php');\n\n+   3. Begin the\
    \ session and retrieve the session ID:\n+   \n+   session_start();\n+   $suid\
    \ = session_id();\n\nThis page will be able to access the same session data as\
    \ checkout.php, because both pages are being accessed over HTTPS. The session\
    \ ID needs to be assigned to the $suid variable so that it can be used many times\
    \ over in this page (to access the user’s cart).\n\n+   4. Redirect invalid users:\n\
    +   \n+   if (!isset($_SESSION['customer_id'])) {\n+   \t$location = 'https://'\
    \ . BASE_URL . 'checkout.php';\n+   \theader(\"Location: $location\");\n+   \t\
    exit();\n+   }\n\nIf $_SESSION['customer_id'] is not set, the user hasn’t come\
    \ to this page via checkout.php, meaning their order can’t be completed. In that\
    \ case, the customer is redirected back to the checkout page to begin again.\n\
    \n+   5. Require the database connection and create an array for storing errors:\n\
    +   \n+   require(MYSQL);\n+   $billing_errors = array();\n\n+   6. Include the\
    \ header file:\n+   \n+   $page_title = 'Coffee - Checkout - Your Billing Information';\n\
    +   include ('./includes/checkout_header.html');\n\nAgain, the newer, custom checkout_header.html\
    \ file is included, not the older header.html.\n\n+   7. Get the shopping cart\
    \ contents:\n+   \n+   $r = mysqli_query($dbc, \"CALL get_shopping_cart_contents('$suid')\"\
    );"
