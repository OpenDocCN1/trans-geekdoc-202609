  md: "> tip\n> \n> In a site that uses cookies, this same function could verify the\
    \ user against $_COOKIE instead of $_SESSION.\n\n```\nif (!isset($_SESSION[$check]))\
    \ {\n    $url = $protocol . BASE_URL . $destination;\n    header(\"Location: $url\"\
    );\n    exit();\n}\n\n}\n```\n\nThe function takes three arguments, all of which\
    \ are optional. The first is the session array element to validate against, the\
    \ default being user_id. In other words, if $_SESSION['user_id'] is not set, the\
    \ user hasn't logged in and shouldn't be looking at this page. In Chapter 5, this\
    \ same function will be used to restrict access to administrators or to users\
    \ whose accounts have not expired.\n\nThe second argument to the function is the\
    \ page to which the user should be redirected. By default, this will be the home\
    \ page, but you could send them to the registration page or anywhere by changing\
    \ the value passed to this function.\n\nThe third argument is the protocol to\
    \ use, with the default being http://. I've included this option so that users\
    \ can be redirected to SSL or non-SSL pages.\n\nWithin the function, a conditional\
    \ checks the session variable. If it's not set, a redirection URL is defined by\
    \ concatenating the protocol and destination to the BASE_URL constant (also defined\
    \ in the configuration file). Then a header() call performs the actual redirection.\
    \ Finally, the exit() function (language construct, technically) will terminate\
    \ the script (the one that called this function). This is necessary because PHP\
    \ will continue to execute a script after a header() call, even if the browser\
    \ has already moved on.\n\nWhen creating the login script later in this chapter,\
    \ you'll have to keep in mind how this redirection function works. Specifically,\
    \ authorization is based upon a value being set, not based upon what that value\
    \ is. For example, a logged-in user just has any user_id value and an administrator\
    \ will also have any user_admin value. But non-administrators should not be assigned\
    \ a user_admin value, even if that value is false or no.\n\nI imagine this function\
    \ only being called immediately after including the configuration file (see Figure\
    \ 4.6), so the function does not check that headers haven't already been sent,\
    \ which would prevent the browser from being redirected. If you want to account\
    \ for that possibility, just use the headers_sent() function in a conditional.\
    \ If it returns false, redirect the user; if it returns true, include the header\
    \ and footer and display an error message:"
