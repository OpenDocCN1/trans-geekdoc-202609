- pgno: 178
  md: '# # 7 SECOND SITE: STRUCTURE AND DESIGN


    The second e-commerce site that you will develop with the help of this book will
    sell physical products: coffee (beans, not brewed!) and coffee-related goodies.
    The _Coffee_ site will have these primary features:


    +   - Increased complexity in the use of HTML, PHP, and MySQL

    +   - Browsable catalog, complete with sales information

    +   - User''s shopping cart and wish-list feature

    +   - Inline payment processing via Authorize.net

    +   - Administrative ability to create products, discount items, manage inventory,
    and process orders


    The five chapters in Part Three, “Selling Physical Products,” of this book will
    walk you through this combination of common e-commerce features and more advanced
    techniques. As a fail-safe, I’ll present alternatives for some of the more complex
    code that you might find confusing or that might be beyond your server’s capability.


    # ## ABOUT THE SITE


    Because this coffee shop example will be much more complex than the content management
    one, I want to talk about its goals and functionality in some detail before getting
    into the actual implementation.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # What''s Being Sold


    The aim of this book is to present the widest possible range of what it means
    to perform e-commerce, so the first goal of the Coffee site example is to sell
    a physical product, which requires a different approach than selling virtual content.
    One implication is that the Coffee site will need to be prudent about when customers
    are charged for orders relative to when the orders actually ship. Selling physical
    products also requires using SKUs (Stock-Keeping Unit): unique identifiers for
    each item also sold. Without SKUs, there’s no inventory management or certainty
    that a customer is receiving the exact item they wanted.


    Selling virtual products may also require SKUs, although you don’t have to consider
    inventory management.


    Physical products come in two broad categories:


    +   - Individual, unrelated items, such as works of art

    +   - Variations on a theme, such as a book that’s available in hardcover, paperback,
    or electronic format


    The distinction between these categories is important. For example, if you’re
    selling books, you’ll want the customer to be able to select the format from among
    the available options, all on the same page. But each available format still needs
    its own unique identifier. Conversely, a work of art or any product that’s not
    available in different formats or with different attributes is much easier to
    present to the customer and to manage as inventory. As you can tell, how you handle
    SKUs and other product attributes differs between these two types, so the Coffee
    e-commerce store sells both categories of physical products: goodies, such as
    mugs, biscotti, and so on, which are treated individually (Figure 7.1); and coffee
    that has common generic properties but is purchased in specific formats (for example,
    size or ground versus whole beans, Figure 7.2).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_179_0.png)


    Figure 7.1


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_179_1.png)


    Figure 7.2


    Most of the work and code in this part of the book will involve using SKUs in
    the database, in the displayed catalog of products, in the shopping cart, and
    in the administrative interface. In your own e-commerce projects, you can apply
    these same theories and code to sell music in different formats, clothes in different
    sizes and colors, and so forth.


    To simplify the example a bit, I’ve opted to ignore some coffee bean variables
    and entirely ignore the issues that arise with selling perishable goods.


    The database and code is further complicated by supporting the ability to offer
    products at a discounted price. This is a nice feature, and that can go a long
    way toward increasing business.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# # No Customer Registration


    Another way in which the *Coffee* e-commerce project differs from the *Knowledge
    is Power* site is that this site does not obligate customers to register in order
    to make their purchases. Required registration, which is mandatory in a content
    access example, has actually been proven to hurt sales (truth be told, Amazon.com
    gets away with required registration just fine). So this site will focus on the
    purchases, not on the customer. This approach will have some interesting ramifications
    in terms of the database and how the site operates, as you''ll learn in this chapter.


    If you''d rather, you could provide your customers with the option of registering
    or not. In such a case, you would take the code from the *Knowledge is Power*
    example and modify it in order to add registration and login capability to your
    site.


    # ## Implementing MVC


    **tip** MVC is an example of a *design pattern*: an accepted and standard way
    to programmatically solve a problem.


    For this coffee shop site, I''ve decided to implement somewhat of an MVC approach.
    MVC, which stands for *Model-View-Controller*, is a very popular way to design
    more complex Web (and other) applications. Within MVC, a project''s code and files
    are divided into their discernible parts:


    +   - **Model** is the data involved.

    +   - **View** is the presentation layer (what the user sees).

    +   - **Controller** is the logic that ties everything together and reacts to
    user activity.


    **tip** Advanced programmers develop not for just today''s expectations but also
    for what can reasonably be expected down the line.


    By implementing MVC, you''ll have a project that''s easier to develop—especially
    when working on a team—and easier to maintain, with cleaner code. Further, the
    site will potentially be more scalable. *Scalability* is the ability to handle
    an increased load implicitly through an increase in resources. A Web site may
    start with one server and be able to handle up to X number of concurrent visitors.
    If the site can “scale well,” then it will also be able to handle, say, four times
    the concurrent visitors by just adding another server or two database servers.
    Conversely, a site that doesn''t scale well could not properly handle four times
    the concurrent load even if you were to throw four or eight more servers at the
    problem. With the hope that an e-commerce site will take off, the ability for
    the site to scale well is a reasonable consideration.


    **tip** OOP and frameworks generally use MVC and other design patterns by their
    very nature.


    So what does MVC mean in terms of real code? It''s actually simple in theory,
    although I''m applying MVC in a casual manner. The controller is represented by
    PHP code, which handles user behavior and reacts accordingly, often as an agent
    between the model and the view. The data, with few exceptions, is repre-'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'sented by the database. The view is HTML. To keep these three things separate,
    the Coffee shop site first moves much of the model functionality into the database,
    using something called *stored procedures* (discussed at the end of the chapter).
    Second, the site stores almost all the HTML in separate files, included as appropriate
    by the PHP scripts. The end result will be little to no SQL or HTML intermingled
    with PHP. In fact, many of the PHP scripts will be quite short.


    Another benefit of this MVC approach is that you will be able to look at and edit
    any facet of the site without having to wade through unrelated code. For example,
    you can adjust an SQL query without seeing any PHP and tweak the PHP without mucking
    about in HTML. You can also address performance issues by focusing on individual
    pieces. If you look back at Figure 1.4, in which I point out the three areas in
    which caching can be applied to improve performance, you will see that the MVC
    approach isolates these same three areas of the process. This means that when
    your site takes off and multiple servers are appropriate, each server can focus
    on a specific aspect: say two or three for just the database (that is, the models)
    and one or two for the PHP and HTML. You can also offload specific parts to cloud
    computing, if you want to go that route.


    There are a couple of obvious downsides to using an MVC approach. First, you’ll
    end up with a *lot* more files. Whereas one PHP script could query the database
    and generate the HTML output, now you’ll have one PHP script, one stored procedure
    in the database, and one or more HTML files to accomplish the same task. Second,
    MVC requires that assumptions be made about what has happened previous to certain
    points, pushing model functionality into the database will require a level of
    database access that not everyone will necessarily have.


    > If you find that you can’t follow or don’t appreciate the MVC approach used
    in this example, feel free to use the more direct PHP-MySQL-HTML approach used
    in Part Two, “Selling Virtual Products.”


    # Heightened Security


    The significant distinction between the two e-commerce examples in this book is
    the level of required security. Because this site will briefly handle credit card
    information and permanently store more user information, extra precautions will
    be taken. To start, the site will be more exacting about using SSL (in the *Knowledge
    is Power* content management example, SSL was used to send the user to PayPal
    and back, but otherwise ignored). The first checkout page in the *Coffee* site
    will use SSL, and SSL will continue to be required throughout the checkout process
    and on every administration page.


    The second security distinction will be the placement of every administration
    page in a separate, password-protected directory. Third, as previously mentioned,
    the site will use *stored procedures*, which is a more secure way to interact
    with the database.'
