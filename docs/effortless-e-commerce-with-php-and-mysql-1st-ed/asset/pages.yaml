  md: "# 5. Begin defining an error-handling function:\n\n```\nfunction my_error_handler\
    \ ($e_number, $e_message, $e_file, $e_line,\n   $e_vars) {\nglobal $Slive, $Scontact_email;\n\
    ```\n\nPHP allows you to define your own functions for handling errors. By doing\
    \ so, you can precisely control what errors get reported, how, and in what detail.\
    \ Every time a PHP error occurs, or one is triggered using `trigger_error()`,\
    \ this function will be called by a script that will be created shortly. The only\
    \ exceptions are parse and other serious PHP errors that would prevent this script\
    \ from being executed in the first place.\n\nAn error-handling function can be\
    \ defined to take anywhere from two to five arguments. Here I'm using all five.\
    \ The first is a numeric error indicator that might be assigned a value such as\
    \ 2, which represents an `E_WARNING`. The second argument is the received error\
    \ message. The next argument is the name of the file in which the error occurred,\
    \ and the fourth is on which line. The fifth argument is an array of every variable\
    \ that existed when the error occurred. This can be useful debugging information\
    \ (and when it comes to debugging, more information is almost always better than\
    \ less).\n\n# 6. Begin creating a detailed error message:\n\n```\n$message = \"\
    An error occurred in script '$e_file' on line $e_line:\n   \\n$e_message\\n\"\
    ;\n```\n\nThe detailed error message will start with the name of the file in question,\
    \ the line number, and the message string.\n\n# 7. Add the backtrace information:\n\
    \n```\n$message .= \"<pre>\" . print_r(debug_backtrace(), 1) . \"</pre>\\n\";\n\
    ```\n\nA `backtrace` is essentially everything that happened up until the point\
    \ of the error. This will include files that were executed, functions that were\
    \ called, arguments passed to the functions, and variables that existed. You can\
    \ get the backtrace information by calling the `debug_backtrace()` function, which\
    \ returns an array. To add that array to the error message, pass it (or the function\
    \ call that creates the array) as the first argument to `print_r()` and use `1`\
    \ or `true` as the second argument value in `print_r()`. Providing a positive\
    \ second argument to `print_r()` tells the function to return the value, instead\
    \ of printing it. I'm wrapping this code in HTML preformatted tags, `<pre>...</pre>`,\
    \ to make it easier to read.\n\nIf you don't want the detailed backtrace, you\
    \ could just append the list of variables and values to the message, like so:\n\
    \n```\n$message .= \"<pre>\" . print_r ($e_vars, 1) . \"</pre>\\n\";\n```"
  merge: -1
  img_proc: true
