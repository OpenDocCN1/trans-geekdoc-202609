  md: '+   5. Also in PayPal, enable IPN for the account (see the steps earlier in
    the chapter).


    +   6. Update the ipn.php script.


    You’ll want to:


    +   Change the fsockopen() line to connect to the real PayPal.


    +   Make sure the right email address is being used for comparison to `$_POST[''receiver_email'']`.


    +   Make sure the right payment amount is being used for comparison to `$_POST[''mc_gross'']`.


