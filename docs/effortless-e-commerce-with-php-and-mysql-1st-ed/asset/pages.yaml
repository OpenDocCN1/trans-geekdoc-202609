  md: '# CONNECTING TO THE DATABASE


    Every PHP script in the site will require a connection to the database, so let’s
    create a separate file in the includes directory for that purpose.


    +   1. Create a new PHP script in your text editor or IDE to be named mysql.inc.php.

    +   See Figures 3.2 and 3.3 for indications of where this file should be placed.


    +   2. Define the constants for accessing the database:


    ```

    <?php

    DEFINE (''DB_USER'', ''username'');

    DEFINE (''DB_PASSWORD'', ''password'');

    DEFINE (''DB_HOST'', ''localhost'');

    DEFINE (''DB_NAME'', ''ecommerce1'');

    ```


    You’ll need to replace these values with those that are correct for your server.
    For my setup, I created a database called ecommerce1 and cre-ated a MySQL user
    with SELECT, INSERT, and UPDATE privileges on that database. You absolutely must
    use a more secure username and password than these!


    +   3. Connect to the database:


    ```

    $dbc = mysqli_connect (DB_HOST, DB_USER, DB_PASSWORD, DB_NAME);

    ```


    The mysqli_connect() function is used to connect to the database. The connection
    is assigned to the $dbc variable, which will be used by many functions in other
    scripts.


    +   4. Establish the character set:


    ```

    mysqli_set_charset($dbc, ''utf8'');

    ```


    This function indicates what character set should be used for communi-cations
    between PHP and the database. The database tables, the HTML pages, and the PHP-MySQL
    connection must all use the same character set.


    +   5. Begin defining a function for making data safe to use in queries:


    ```

    function escape_data ($data) {

    global $dbc;

    ```


    > note

    > Since the site will be using the UTF-8 character set, your text editor or IDE
    must be set to encode each page also using UTF-8.


    > note

    > If your PHP-MySQL setup does not support the MySQL Improved extension, which
    I’ll be using, you’ll need to use the older MySQL functions, which have slightly
    different syntax. See the PHP manual for details.


    > note

    > Any connection errors that occur will be handled by the custom error handler
    defined in the con-figuration file (in just a couple of pages).'
