- pgno: 64
  md: '# # 3 FIRST SITE: STRUCTURE AND DESIGN


    The first e-commerce site being developed in this book, Knowledge is Power, will
    provide content to paid subscribers. It will have these primary features:


    +   - Straightforward use of HTML, PHP, and MySQL

    +   - User accounts

    +   - Ability for administrators to add HTML and PDF content

    +   - PayPal for processing payments


    This will be a relatively standard e-commerce example, applicable to most small-
    to medium-size businesses. By comparison, the more complex project, developed
    in Part Three, “Selling Physical Products,” of the book, will use HTML, PHP, and
    MySQL in more advanced ways, won’t require user accounts, will sell products that
    get shipped later (that is, the customer will not be billed immediately), and
    will integrate a different payment system. This is not to say that what you’ll
    learn in this part of the book won’t be applicable to real-world situations, quite
    the contrary.


    The user account system will have several pieces: registering, logging in, logging
    out, retrieving forgotten passwords, and changing existing passwords. As a bonus,
    the user’s password will be handled with extra security, in a way that you perhaps
    have not yet seen.


    The available content that the customer is paying to see will be in two formats:
    HTML and PDF. For the former, you’ll integrate a WYSIWYG editor into an HTML form
    so that administrators can easily create HTML without knowledge of'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'HTML. For the latter, you''ll write a *proxy script* that serves protected
    files not available over HTTP or to non-validated users.


    In this chapter, you''ll set the stage for developing the site. This includes
    the database design, the organization of files on the server, the HTML template,
    plus a couple of necessary helper files that every other PHP script will use.
    The entire code for the site is also downloadable from www.DMCInsights.com/ecom/.


    # # DATABASE DESIGN


    The database I''ve designed for this example is simple, yet appropriate, with
    only five tables (Figure 3.1).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_65_0.png)


    Figure 3.1


    The *categories*, *pages*, and *pdfs* tables represent the “products” side of
    this e-commerce example. The *categories* table just lists the categories into
    which the HTML content will be organized. Each category will contain one or more
    pages, but each page will be in only one category.


    The *pages* table stores the actual HTML content. For each HTML page, there are
    three important fields: *title*, *description*, and *content*. The *title* will
    be used as a link to each page and will also be used as the browser’s title. The
    *description* is a short block of text that, um, describes the page’s content.
    This value will be viewable to any user and to search engines. The *content* column
    stores the actual HTML content. You’ll see all of this in action in Chapter 5,
    “Managing Site Content.”


    > > **tip**

    > >

    > > I''m a programmer, so I start designing the database and work my way to the
    HTML design. You might start with the user interface and work your way down to
    the database instead.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "The **pdfs** table lists the particulars for each PDF file the site has, including\
    \ a title for the PDF, like the HTML page title, a short description—viewable\
    \ by anyone—the name of the actual PDF file, and its size in kilobytes. When a\
    \ PDF file is uploaded to the site, it’ll be given a non-obvious, temporary name\
    \ (for example, aofo7b9b15e38ca77219884a8bbage57d01fae88) that must also be stored;\
    \ but when the PDF is served to the user, its original file name will be used\
    \ instead. The PDFs are not being associated with information categories.\n\n\
    > **note**\n> \n> Most of the tables have a column that reflects when a record\
    \ was added. The **users** table also has a field indicating when a record was\
    \ last modified.\n\nThe **users** table stores a minimum amount of information\
    \ about the customers. Each customer can create a username, and the system will\
    \ also store their email address, a password, their first name, and their last\
    \ name. The password will be stored as a **hash**, which is a representation of\
    \ a value (as opposed to being an encrypted version that could be decrypted).\
    \ Hashes always have exact lengths, so that column **could** be declared as a\
    \ fixed **CHAR**. However, the password can take up less space if it’s stored\
    \ as binary data, which is how the column will be defined.\n\nThe site will have\
    \ two types of users — members and administrators — so an **ENUM** column (that\
    \ is, an enumerated list of options) will store the type, with the default value\
    \ being _member_. Although administrators will never have to pay for access to\
    \ the site, I thought it would make sense to use the same login system the non-administrators\
    \ use, which means the administrators must be registered in the database, too.\
    \ The **users** table also has a **date_expires** column that stores the date\
    \ through which their account is active (that is, paid). When the user first subscribes\
    \ and pays, the account will be set to expire in a year. When the user renews\
    \ their membership, the account will be updated to one year later. Users whose\
    \ accounts have expired will still be able to log in, but they won’t be able to\
    \ view any content and will be notified that they need to renew.\n\n> **tip**\n\
    > \n> With databases, it’s much, much better to save more information than you\
    \ end up needing than to later discover you haven’t been storing something you\
    \ do need.\n\nAll payments will be handled through PayPal. Even though PayPal\
    \ will provide detailed logs of every transaction, it’s wise to record the basics\
    \ of each transaction in this system as well. The **orders** table will store\
    \ every transaction that goes through PayPal, associated with the ID of the user\
    \ (as taken from the **users** table). Each order will be associated with exactly\
    \ one user, but each user can have one or more records in the **orders** table.\
    \ Three pieces of information from the PayPal transaction will be recorded, too:\
    \ the **transaction_id**, which is a unique identifier; the **payment_status**,\
    \ which is just a confirmation code; and the **payment_amount**. Storing this\
    \ basic data will allow you to create a simple admin interface for viewing the\
    \ total number of orders, amount of money taken in, and so on, without going to\
    \ PayPal for that information. The **transaction_id** is the most sensitive piece\
    \ of data stored in the database; through it, many details are accessible, but\
    \ only to authorized PayPal users."
  merge: -1
