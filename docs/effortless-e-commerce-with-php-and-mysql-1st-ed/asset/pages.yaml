- pgno: 169
  md: "# Creating the IPN Script\n\nThe next part of the process of implementing IPN\
    \ is the listener script. The IPN listener script—the file on the e-commerce site\
    \ with which PayPal will automatically and behind-the-scenes communicate—is clearly\
    \ important and is accordingly complex. Most of the code in this script, which\
    \ I’ll explain in detail, was suggested by PayPal. The process goes like this:\n\
    \n+   1. When this page is requested, it must immediately confirm the request\
    \ with PayPal. This keeps the script from being fraudulently used.\n+   \n+  \
    \ 2. The page reads in the response from PayPal.\n+   \n+   3. The page validates\
    \ and validates and validates the response.\n+   \n+   4. If the data is valid,\
    \ the database is updated.\n\nWhat this script does not have to do is generate\
    \ any HTML because it’ll never be run through a Web browser.\n\n+   1. Create\
    \ a new PHP script in your text editor or IDE to be named ipn.php (or something\
    \ more original) and stored in the Web root directory:\n\n```\n<?php\nrequire('./includes/config.inc.php');\n\
    ```\n\nThis script needs access to the configuration file for the purposes of\
    \ error reporting and connecting to the database.\n\n+   2. Start by creating\
    \ a request variable:\n\n```\n$req = 'cmd=_notify-validate';\n```\n\nThe $req\
    \ variable is first assigned the cmd=_notify-validate string value. This value\
    \ indicates the command being made to PayPal (that is, the purpose for the communication).\n\
    \n+   3. Add each received key=value pair to the request:\n\n```\nforeach ($_POST\
    \ as $key => $value) {\n    $value = urlencode(stripslashes($value));\n    $req\
    \ .= \"&$key=$value\";\n}\n```\n\nThe confirmation of the request needs to contain\
    \ all the data that this script originally received via POST. For each element\
    \ in $_POST, a key=value pair is added to the $req variable.\n\n+   4. Open a\
    \ socket connection to PayPal:\n\n```\n$fp = fsockopen ('ssl://www.sandbox.paypal.com',\
    \ 443, $errno, $errstr,\n→30); // Test\n```\n\n> **tip**\n> \n> For every transaction,\
    \ PayPal will continue requesting an IPN script until the request is acknowledged."
  merge: -1
  img_proc: true
- pgno: 170
  md: 'This is a bit complicated and may be new to you. The PayPal request will be
    made using the `fsockopen()` function, which opens a socket connection. The function
    is used similarly to `fopen()`, except that the code will be reading from and
    writing to another computer through a socket connection, instead of from and to
    a file. The address to connect to for testing purposes is `ssl://www.sandbox.paypal.com`,
    using port 443. The `$errno` and `$errstr` variables will store any errors that
    occurred during the connection process. The last argument in the function tells
    the script to take up to 30 seconds to make the connection.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_170_0.png)


    When the site goes live, the connection will be made just to `ssl://www.paypal.com`,
    with the other settings the same:

    `Sfp = fsockopen (''ssl://www.paypal.com'', 443, $errno, $errstr, 30);`


    +   5. If no connection was made, trigger an error:

    +   ```

    +   if (!$fp) {

    +    trigger_error(''Could not connect for the IPN!'');

    +   }

    +   ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_170_1.png)


    If the `$fp` variable does not have a positive value, then no connection was made
    and an error should be triggered. The assumption is that the site is live at this
    point, so the error is sent in an email to the administrator. Otherwise the error
    messages would be printed out, for no one to see.


    The `$errno` and `$errstr` variables might provide clues as to what the problem
    was (and they''ll be available through the backtrace in the error handler.)


    +   6. If a connection was made, send the request to PayPal:

    +   ```

    +   } else {

    +    $header = "POST /cgi-bin/webscr HTTP/1.0\r\n";

    +    $header .= "Content-Type: application/x-www-form-urlencoded\r\n";

    +    $header .= "Content-Length: " . strlen($req) . "\r\n\r\n";

    +    fputs ($fp, $header . $req);

    +   ```


    The first three lines define headers to include with the request. The first indicates
    that a POST request should be made to `/cgi-bin/webscr` using the HTTP 1.0 protocol.
    The second line says that the content type will be URL-encoded form data. The
    third line indicates the length of the request.


    The last line sends the headers and request data to PayPal (it "puts" it to PayPal''s
    server).


    +   7. Read in the response:

    +   ```

    +   while (!feof($fp)) {

    +    $res = fgets ($fp, 1024);

    +   ```


    This code is similar to what you might use to read from a file, but instead the
    script is reading in the response from PayPal. The while loop is true'
