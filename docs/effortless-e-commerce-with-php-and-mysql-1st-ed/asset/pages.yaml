- pgno: 62
  md: 'form and the page that handles its request. The tie itself will be a secret
    token, uniquely generated for each request. Here’s what you’d do on the page that
    displays the form (with much of the code implied):


    ```

    <?php // form.php


    ...


    $csrf_token = uniqid(); // or uniqid(rand(), true);

    session_start();

    $_SESSION[''csrf_token''] = $csrf_token;


    ...


    echo ''<input type="hidden" name="csrf_token" value="" . $csrf_token . "

    / >'';


    ...

    ?>

    ```


    On the page that handles the request, validate the token:


    ```

    <?php // handle_form.php


    ...


    session_start();

    if ( $_SERVER[''REQUEST_TYPE''] == ''POST'' ) // only POST is allowed

    && ( isset($_SESSION[''csrf_token''], $_POST[''csrf_token'']) ) // make sure

    the tokens exist

    && ( $_SESSION[''csrf_token''] == $_POST[''csrf_token''] ) ) { // OK!


    ...

    } else { // Invalid request!

    }


    ...

    ?>

    ```


    **tip**


    To prevent bots from trying to

    use a form, integrate a CAPTCHA

    (Completely Automated Public

    Turing test to tell Computers and

    Humans Apart) system.


    Now the request will only be processed if Alice is still logged in (that is, her

    cookie is still live), if the request is via the POST method, if a csrf_token
    element exists in both $_SESSION and $_POST, and if the two values match. That’s
    pretty good security!'
