- pgno: 212
  md: 'The products come in varying sizes and combinations of caffeinated, decaffeinated,
    ground beans, and whole beans. The products have different prices and quantities
    in stock.


    # 6. Populate the sales table:


    ```

    INSERT INTO `sales` (`product_type`, `product_id`, `price`, `start_date`,

    `end_date`) VALUES

    (''other'', 1, 5.00, ''2010-08-16'', ''2010-08-31''),

    (''coffee'', 7, 7.00, ''2010-08-19'', NULL),

    (''coffee'', 9, 13.00, ''2010-08-19'', ''2010-08-26''),

    (''other'', 2, 7.00, ''2010-08-22'', NULL),

    (''coffee'', 8, 13.00, ''2010-08-22'', ''2010-08-31''),

    (''coffee'', 10, 30.00, ''2010-08-22'', ''2010-09-30'');

    ```


    > If you want, you can run some basic SELECT queries to confirm the database''s
    contents.


    Finally, let''s put some items on sale by discounting their prices. For each sale
    item, you need to indicate a product type, the item''s product ID (from the corresponding
    specific_coffees or non_coffee_products tables), the new price, and the starting
    date for the sale. The ending date is optional. Unless you''re reading this book
    as I''m writing it, which would freak me out, you''ll need to change the dates
    to be current for you.


    # Looking at the Stored Procedure Queries


    The three stored procedures about to be created will use six queries, four of
    which are relatively complex. Those four select:


    +   - All the specific coffee products in a general coffee category

    +   - All the specific non-coffee products in a general non-coffee category

    +   - All the sale items

    +   - A few, random sale items to be listed on the home page


    Before moving onto the stored procedures themselves, let''s look at these queries
    in detail.


    # SELECTING EVERY COFFEE PRODUCT


    The query for selecting every coffee product is:


    ```

    SELECT gc.description, gc.image, CONCAT("C", sc.id) AS sku,

    CONCAT_WS(" - ", s.size, sc.caf_decaf, sc.ground_whole, sc.price) AS name,

    sc.stock

    FROM specific_coffees AS sc INNER JOIN sizes AS s ON s.id=sc.size_id

    INNER JOIN general_coffees AS gc ON gc.id=sc.general_coffee_id

    ```


    > For help with complex SQL, search online, see the MySQL manual, or check out
    my book, MySQL: Visual QuickStart Guide (2nd Edition, Peachpit Press).'
