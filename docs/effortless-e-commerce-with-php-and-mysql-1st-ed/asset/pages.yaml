- pgno: 405
  md: '# FOR YOUR CONSIDERATION


    Even though this chapter presents the checkout process in as streamlined, yet
    comprehensive, a way as possible, the content still required more than 50 pages
    and there are any number of variations you could implement. Let''s look at a few
    of the most logical alterations and additions you could make.


    # Top-Notch Customer Service


    One of the best general things you could add would be several obvious ways to
    contact the site''s administrator or support team. This could be done using a
    combination of a contact form, a help menu, an FAQ page, or a direct phone number.
    Make it easy and as immediate as possible, for the customer to get help and answers
    to their questions.


    # Checking Order Status Online


    Even though customers don''t have a true account with the site (that is, the ability
    to log in and log out), it''d be nice if they could check the status of an order.
    To do that, you could create a form where customers supply their email address
    and order number, easily found on the original receipt (shown in the Web browser)
    or the confirmation email.


    When the form is submitted, the page would just confirm that the email address
    matches the order number. You could modify the get_order_contents() procedure
    so that it also returns the shipping status (the date each item shipped), thereby
    revealing this information to the customer online.


    You could also add a comments field to the orders table, wherein the administrator
    could make notes regarding the order as a whole for the customer to see. Another
    comments field could be added to order_contents for notes particular to a given
    product.


    # Improving the Security


    The security measures taken in this site are fairly tight, and I can recommend
    using the code and functionality in good conscience. Because all form data is
    thoroughly validated using regular expressions, most of the functionality remains
    within the database, and the payment request is made behind the scenes, it''s
    fairly secure.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'Outside the Web site itself, one recommendation I would make, which Authorize.net
    also suggests, is that you change your Authorize.net identifying information regularly.
    This includes the user account password (used to access the Merchant Interface),
    the login ID, and the transaction key. These values can all easily be changed
    (in the Merchant Interface). After you change the login ID and transaction ID,
    only two lines in `gateway_process.php` need to be updated to account for the
    changes.


    Regardless of what payment gateway you use, change the password frequently!


    # # Preventing Duplicate Orders


    The `billing.php` script can take a few moments to execute, once the form is submitted,
    because it has to send a request to the gateway and await a response. This extra
    delay can fool customers into thinking their form was not submitted, causing them
    to perhaps click the submit button again to "correct" the problem. With the site
    as written, this won''t actually create two orders because the gateway will reject
    duplicate submissions within a default time period of two minutes. Still, it''d
    be better to avoid this potential problem entirely. And it''d be better to give
    an indication to the customer that their order is being processed and that a delay
    is to be expected. Although this is a valuable approach, I omitted it from the
    `billing.php` script because it requires JavaScript, and I didn''t want to further
    confuse an already complex system.


    You can adjust the Authorize.net duplicate-order time window by setting `x_duplicate_window`
    to some value in seconds.


    When it comes to JavaScript, you can either create your own code or use a framework.
    I''m comfortable with either approach, but frameworks are so easy to use that
    I recommend that route for beginners. My current favorite framework of choice
    (and the favorite of many) is jQuery (www.jquery.com). I like it because it has
    excellent browser support, is easy to use, and degrades nicely. To update the
    billing form to use jQuery...


    +   1. At the end of billing.html, add:


    ```

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js"
    type="text/javascript" charset="utf-8"></script>

    ```


    This line will load the jQuery library from Google''s API system. There''s a potential
    performance benefit in using the Google-provided version of the jQuery library
    instead of adding a copy to the site: If the customer has visited another site
    that also used this same jQuery library from Google, the user''s browser won''t
    have to download the library again, thereby improving how quickly your page loads.


    Loading JavaScript near the end of the page can help the page to load faster in
    the Web browser.


    +   2. Add a <SCRIPT> block:


    ```

    <script type="text/javascript" charset="utf-8">

