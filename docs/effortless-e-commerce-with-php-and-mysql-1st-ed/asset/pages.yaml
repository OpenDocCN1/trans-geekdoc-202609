  md: "Again, there are some simple instructions, plus an indication that their data\
    \ will be safe. The instructions also indicate what card types are accepted. You\
    \ may choose to make this more prominent or use images to represent the accepted\
    \ cards.\n\nThe form gets submitted back to billing.php.\n\n+   5. Include the\
