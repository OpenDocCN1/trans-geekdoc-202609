- pgno: 280
  md: "Now that you (hopefully) understand how the **SELECT** query works, consider\
    \ that the **SELECT** query can be used immediately as the values for an **INSERT**\
    \ query, thanks to the **INSERT...SELECT** construct. The **INSERT** for `order_contents`\
    \ is:\n\n```\nINSERT INTO order_contents (order_id, product_type, product_id,\
    \ quantity,\nprice_per) VALUES (...)\n```\n\nPutting together the INSERT and SELECT\
    \ queries, the entire query becomes:\n\n```\nINSERT INTO order_contents (order_id,\
    \ product_type, product_id, quantity,\nprice_per)\nSELECT oid, c.product_type,\
    \ c.product_id, c.quantity,\nIFNULL(sales.price, ncp.price)\nFROM carts AS c\n\
    INNER JOIN non_coffee_products AS ncp ON c.product_id=ncp.id\nLEFT OUTER JOIN\
    \ sales ON (sales.product_id=ncp.id AND\nsales.product_type='other' AND\n((NOW()\
    \ BETWEEN sales.start_date AND sales.end_date) OR (NOW() >\nsales.start_date AND\
    \ sales.end_date IS NULL))) \nWHERE c.product_type=\"other\" AND c.user_session_id=<user_cart_id>\n\
    UNION\nSELECT oid,...\n```\n\nBy adding the selection of the `oid` variable, that\
    \ value can be inserted into `order_contents` at the same time.\n\nMoving on in\
    \ the procedure, the last step is to update the **orders** table for the order\
    \ total. The total can be determined by running an aggregating query on `order_contents`\
    \ for the current order:\n\n```\nSELECT SUM(quantity*price_per) INTO subtotal\
    \ FROM order_contents\nWHERE order_id=oid;\n```\n\nAnd now the orders table can\
    \ be updated:\n\n```\nUPDATE orders SET total = (subtotal + ship) WHERE id=oid;\n\
    ```\n\nFinally, the order total will be necessary outside of the procedure (as\
    \ part of the payment processing). To make that possible, the total should also\
    \ be assigned to an outbound argument:\n\n```\nSELECT (subtotal + ship) INTO total;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "The complete stored procedure is therefore:\n\n```\nDELIMITER $$\nCREATE PROCEDURE\
    \ add_order (cid INT, uid CHAR(32), ship DECIMAL(5,2),\n cc MEDIUMINT, OUT total\
    \ DECIMAL(7,2), OUT oid INT)\nBEGIN\n DECLARE subtotal DECIMAL(7,2);\n INSERT\
    \ INTO orders (customer_id, shipping, credit_card_number,\n order_date) VALUES\
    \ (cid, ship, cc, NOW());\n SELECT LAST_INSERT_ID() INTO oid;\n INSERT INTO order_contents\
    \ (order_id, product_type, product_id,\n quantity, price_per) SELECT oid, c.product_type,\
    \ c.product_id,\n c.quantity, IFNULL(sales.price, c.price) FROM carts AS c INNER\
    \ JOIN\n non_coffee_products AS ncp ON c.product_id=ncp.id LEFT OUTER JOIN\n sales\
    \ ON (sales.product_id=ncp.id AND sales.product_type='other'\n AND ((NOW()) BETWEEN\
    \ sales.start_date AND sales.end_date)\n OR (NOW() > sales.start_date AND sales.end_date\
    \ IS NULL))) WHERE\n c.product_type=\"other\" AND c.user_session_id=uid UNION\
    \ SELECT\n oid, c.product_type, c.product_id, c.quantity, IFNULL(sales.price,\n\
    \ c.price) FROM carts AS c INNER JOIN specific_coffees AS sc ON\n c.product_id=sc.id\
    \ LEFT OUTER JOIN sales ON (sales.product_id=sc.id\n AND sales.product_type='coffee'\
    \ AND ((NOW() BETWEEN\n sales.start_date AND sales.end_date) OR (NOW() > sales.start_date\n\
    \ AND sales.end_date IS NULL))) WHERE c.product_type=\"coffee\" AND\n c.user_session_id=uid;\n\
    \ SELECT SUM(quantity*price_per) INTO subtotal FROM order_contents\n WHERE order_id=oid;\n\
    \ UPDATE orders SET total = (subtotal + ship) WHERE id=oid;\n SELECT (subtotal\
    \ + ship) INTO total;\nEND$$\nDELIMITER ;\n```\n\nThe procedure takes the customer\
    \ ID, the customer's cart ID, the shipping amount, and the credit card number\
    \ (the last four digits) as inbound arguments. There are two outbound arguments:\
    \ **total** and **oid**. Within a **BEGIN** block, a local variable named **subtotal**\
    \ is defined. Next, the record is added to the **orders** table, and the just-created\
    \ ID is selected and assigned to **oid**. After that, the **order_contents** table\
    \ is populated, using the INSERT...SELECT UNION SELECT query.\n\n> Remember that\
    \ variables in stored procedures do not use a dollar sign like PHP variables.\n\
    \nThe last three lines calculate the subtotal of the order, update the **total**\
    \ column in the **orders** table, and assign the total order value to the **total**\
    \ variable."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# # STORED PROCEDURES REVISITED\n\nThe modestly complex **add_order()** stored\
    \ procedure demonstrates the security and performance benefits that can be had\
    \ by using stored procedures. The procedure takes just four arguments—the customer\
    \ ID, the customer's cart session ID, the shipping total, and the credit card\
    \ representation—and does a lot of work with that little information. The procedure\
    \ could even be cut down to just two inbound arguments if the shipping were to\
    \ be calculated by a database-stored function and the credit card numbers were\
    \ omitted (they'll be stored in the **transactions** table anyway). From a performance\
    \ standpoint, there's very little information that PHP needs to send to the database,\
    \ and, more critically, the PHP script only needs to execute a single query—the\
    \ procedure call itself. Since query executions are one of the most demanding\
    \ things a PHP script does, limiting those\n\ncan have a huge performance gain.\
    \ (Although that burden is therefore moved to the database server.) From a security\
    \ standpoint, much of the key information—like the price a product is sold for—never\
    \ leaves the database, making it that much harder to be manipulated. And no PHP\
    \ script directly accesses any of the database tables, adding a layer of obfuscation.\
    \ I should add that you might logically use transactions in this stored procedure,\
    \ which stored procedures do support. By using transactions, every query would\
    \ have to work properly or else the entire process would be reverted. Such an\
    \ approach prevents an incomplete order from being recorded. Still, I opted not\
    \ to use transactions, because they would further complicate an already complicated\
    \ process.\n\n# # TAKING THE SHIPPING INFORMATION\n\nOnce the customer is finished\
    \ shopping and is ready to purchase items, he or she will click a button on the\
    \ shopping cart page that will go to **checkout.php** (over HTTPS). This page\
    \ needs to:\n\n+   1. Take the customer's shipping information.\n+   \n+   2.\
    \ Validate the provided data.\n+   \n+   3. If valid, store the data and send\
    \ the customer on to the next step in the checkout process.\n+   \n+   4. If invalid,\
    \ redisplay the form with errors.\n\nIn terms of displaying and validating the\
    \ form, **checkout.php** behaves like **register.php** from Chapter 4. But there\
    \ are some additional considerations that make this script more complicated than\
    \ that one. Let's first define the PHP script, then the two view files it uses."
  merge: -1
  img_proc: true
- pgno: 283
  md: "# # Creating the PHP Script\n\nThe PHP script should be accessed at least twice:\
    \ originally as a GET request, at which point the form should be loaded, and as\
    \ a POST request, when the form is submitted. The latter action demands about\
    \ 100 lines of validation, which is the bulk of the script.\n\nUnlike the shopping\
    \ area of the Web site, the checkout process will use PHP sessions. This is necessary\
    \ because multiple scripts will all need access to some of the same information.\
    \ By default, PHP will store the session identifier in a cookie. You might not\
    \ be aware of this, but with respect to cookies, http://www.example.com and https://www.example.com\
    \ are separate realms, meaning that a cookie sent over HTTP is available only\
    \ to pages accessed via HTTP (and the same goes for HTTPS). I mention this now,\
    \ because the sessions used by the checkout process will not be available on the\
    \ shopping side of the site, and the cookie used on the shopping side of the site\
    \ is not available in the checkout process.\n\n> > **tip**\n> \n> The .htaccess\
    \ modifications in Chapter 7, “Second Site: Structure and Design,” ensure that\
    \ checkout.php is accessible only over HTTPS.\n\n+   1. Create a new PHP script\
    \ in your text editor or IDE to be named checkout.php and stored in the Web root\
    \ directory.\n\n> > **tip**\n> \n> When the user returns to the shopping side\
    \ of the site, the wish list and cart cookie will still be usable, even after\
    \ checking out.\n\n+   2. Include the configuration file:\n\n```\n```php\n<?php\n\
    require('./includes/config.inc.php');\n```\n```\n\n+   3. Check for the user's\
    \ cart ID, available in the URL:\n\n```\n```php\nif ($_SERVER['REQUEST_METHOD']\
    \ == 'GET') {\n    if (isset($_GET['session])) {\n        $uid = $_GET['session'];\n\
    \    }\n```\n```\n\nIn order to access the customer's shopping cart, this script\
    \ needs the user's shopping cart session ID, stored in a cookie in the user's\
    \ browser. However, that cookie was sent over HTTP, meaning that it's not available\
    \ to checkout.php, because this script is being accessed via HTTPS. The remedy\
    \ is to pass the cookie value to this script when the user clicks the checkout\
    \ button on cart.php. This script first confirms that a session value was passed\
    \ along in the URL. If so, it's assigned to the $uid variable for later use.\n\
    \n+   4. Use the cart ID as the session ID, and begin the session:\n\n```\n```php\n\
    session_id($uid);\nsession_start();\n```\n```\n\nThe shopping part of the site\
    \ purposefully does not use sessions (in order to give longevity to the customer's\
    \ cart and wish list), but the checkout process will. For continuity, and because\
    \ the shopping cart ID will be"
  merge: -1
  img_proc: true
- pgno: 284
  md: "required by the checkout process, the user's existing cart ID will be used\
    \ as the session ID. This can be arranged by providing a session ID value to the\
    \ **session_id()** function prior to calling **session_start()**). The net result\
    \ will be two cookies in the user's browser: **SESSION**, sent over HTTP, and\
    \ **PHP_SESSION_ID**, sent over HTTPS. Both will have the same value.\n\n+   **5.**\
    \ If no session value was present in the URL (for a GET request), redirect the\
    \ user:\n\n```\n} else {\n  $location = 'http://' . BASE_URL . 'cart.php';\n \
    \ header(\"Location: $location\");\n  exit();\n}\n```\n\nThere's no point in checking\
    \ out if there's nothing to purchase. And without a cart session ID, there will\
    \ be nothing to purchase! In that case, the customer is redirected back to cart.php,\
    \ over HTTP. That page will display the checkout button only if the cart is not\
    \ empty.\n\n+   **6.** If the request method isn't GET, start the session and\
    \ retrieve the session ID:\n\n```\n} else { // POST request.\n  session_start();\n\
    \  $uid = session_id();\n}\n```\n\nThis else clause will apply when the customer\
    \ submits the form for validation. In that case, the session needs to be started.\
    \ The session ID would have already been set the first time this script was accessed,\
    \ so that value can be retrieved (by calling session_id()) with no arguments)\
    \ to be used later in this script.\n\n+   **7.** Include the database connection\
    \ and create an array for validation errors:\n\n```\nrequire (MYSQL);\n$shipping_errors\
    \ = array();\n```\n\n+   **8.** If the form was submitted, validate the first\
    \ and last names:\n\n```\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n  if (preg_match\
    \ ('/^[A-Z \\'.-]{2,20}$/i', $_POST['first_name'])) {\n    $fn = addslashes($_POST['first_name']);\n\
    \  } else {\n    $shipping_errors['first_name'] = 'Please enter your first name!';\n\
    \  }\n}\n```"
