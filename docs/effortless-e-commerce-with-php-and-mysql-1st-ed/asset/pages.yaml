  md: "> Because the random, generated password won't meet the criteria of the user-generated\
    \ password, neither the login form nor the change-password form applies the zero-width\
    \ positive lookahead expression to the current password.\n\n> To make the generated\
    \ password more secure, insert one or more random capital letters into it.\n\n\
    # 5. Complete the filter_vars() conditional:\n\n```\n} else { // No valid address\
    \ submitted.\n $pass_errors['email'] = 'Please enter a valid email address!';\n\
    \ } // End of $_POST['email']' IF.\n```\n\nThis error applies if the user doesn't\
    \ provide a syntactically valid email address.\n\n# 6. Generate a new password:\n\
    \n```\nif (empty($pass_errors)) { // If everything's OK.\n $p = substr(md5(uniqid(rand(),\
    \ true)), 10, 15);\n```\n\nTo generate the password, call the uniqid() function,\
    \ which returns a unique ID. If it's passed some value as its first argument,\
    \ that will be used as the prefix, thereby expanding the returned string. For\
    \ the prefix value, invoke the rand() function. When a second argument of true\
    \ is passed to uniqid(), a more random unique ID will be returned. This value\
    \ will be sent through md5(), which will create a string 32 characters long, consisting\
    \ of letters and numbers. From that string, take a substring starting with the\
    \ eleventh character (because indexes start at zero) and going for fifteen characters.\
    \ The end result will be a completely random and unique password word like 6e968eff0833110.\n\
    \n# 7. Add the new password to the database:\n\n```\n$q = \"UPDATE users SET pass='\"\
    \ . get_password_hash($p) . \"\" WHERE\n id=$uid LIMIT 1\";\n $r = mysqli_query\
    \ ($dbc, $q);\n if (mysqli_affected_rows($dbc) == 1) { // If it ran OK.\n```\n\
    \nThe query uses the user ID value just fetched from the database to know which\
    \ record to update. The generated password must also be run through the get_password_hash()\
    \ function.\n\n# 8. Send the new password to the user:\n\n```\n$body = \"Your\
    \ password to log into <whatever site> has been\n temporarily changed to '$p'.\
    \ Please log in using that password and this\n email address. Then you may change\
    \ your password to something more\n familiar.\";\n mail ($_POST['email'], 'Your\
    \ temporary password.', $body, 'From:\n admin@example.com');\n```\n\nThis is a\
    \ very simple email message (Figure 4.16). You should make it more interesting."
