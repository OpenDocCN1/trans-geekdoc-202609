- pgno: 107
  md: "# # LOGGING IN\n\nLogging in to the site is a two-step process: completing\
    \ the form and validating the submitted values against the database. The login\
    \ form is not its own page — it's shown in the sidebar to all non-logged-in users,\
    \ so it cannot use the same single-script approach as in register.php. The question,\
    \ then, was where the user should end up when they do successfully log in and\
    \ when they don't. In both cases, I decided they should end up back on the home\
    \ page; for this reason, the login form gets submitted to index.php. Therefore,\
    \ the index page needs to be updated with the code for handling the form. Rather\
    \ than write that code directly into the home page, it's best included as a separate\
    \ file, just after the database connection but prior to the inclusion of the header\
    \ file:\n\n```\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n    include('./includes/login.php');\n\
    }\n```\n\nThis works because normally index.php will be requested via GET. If\
    \ it's a POST request, the login form has been submitted, so this script includes\
    \ the file that will test the login credentials.\n\n# ## Processing the Form\n\
    \nI think it will actually be easier to follow the login process if I talk about\
    \ the form last, so let's look at the code that handles the login form first.\
    \ That process needs to:\n\n+   1. Validate the submitted email address and password.\n\
    +   2. Compare the submitted values with those in the database.\n+   3. Create\
    \ errors if the values are incorrect.\n+   4. Store data in a session if the values\
    \ are correct.\n\nHere's how all of that works in actual code:\n\n+   1. Create\
    \ a new PHP script in your text editor or IDE to be named login.inc.php.\n+  \
    \ This will be stored in the **includes** directory.\n\n+   2. Create an empty\
    \ array for recording errors:\n\n```\n<?php\n$login_errors = array();\n```\n\n\
    This errors array will be used just like $reg_errors in the registration script.\n\
    \n> By including the login processing code, instead of writing it to the index.php\
    \ file, I'm maintaining better separation of code.\n\n> It's best to give variables\
    \ in included files unique names so they don't overwrite any variables created\
    \ by the parent script."
  merge: -1
  img_proc: true
- pgno: 108
  md: "# 3. Validate the email address:\n\n```\nif (filter_var($_POST['email'], FILTER_VALIDATE_EMAIL))\
    \ {\n    $e = mysqli_real_escape_string ($dbc, $_POST['email']);\n} else {\n \
    \   $login_errors['email'] = 'Please enter a valid email address!';\n}\n```\n\n\
    This code replicates that in the registration process, using PHP's Filter\nextension\
    \ to validate the email address.\n\n# 4. Validate the password:\n\n```\nif(!empty($_POST['pass']))\
    \ {\n    $p = mysqli_real_escape_string ($dbc, $_POST['pass']);\n} else {\n  \
    \  $login_errors['pass'] = 'Please enter your password!';\n}\n```\n\nTo validate\
    \ the password, I'm just making sure it's not empty. Part of the\nreason is performance\
    \ — this will be faster than the zero-width positive\nlookahead regular expression\
    \ used in the registration process — and part\nof the reason will be explained\
    \ later in the chapter.\n\nIn theory, you don't need to validate the submitted\
    \ values because the\ndatabase query will be confirming whether the submitted\
    \ values are correct\nor not, but database queries are expensive (in terms of\
    \ server resources\nand performance), so it's best not to run one unless necessary.\n\
    \n# 5. If there are no errors, query the database:\n\n```\nif (empty($login_errors))\
    \ {\n    $q = \"SELECT id, username, type, IF(date_expires > NOW(), true,\nfalse)\
    \ FROM users WHERE (email='$e' AND pass=\"\n    . get_password_hash($p) . \"')\"\
    ;\n    $r = mysqli_query ($dbc, $q);\n```\n\nThe basic query selects four values\
    \ from the users table: their ID, user-\nname, type, and account expiration. The\
    \ WHERE clause checks that the\nemail address matches the submitted email address\
    \ and that the password\nmatches the hashed version of the password.\n\nFor the\
    \ account expiration, I'm doing something that may be new to you.\nI don't really\
    \ care when the user's account expires, only if it's valid right\nnow. One way\
    \ of accomplishing this would be to select the expiration\nvalue, which is a date,\
    \ and then use PHP to convert it into a timestamp and\ncompare it to the current\
    \ timestamp. That's a lot of code and logic to put"
