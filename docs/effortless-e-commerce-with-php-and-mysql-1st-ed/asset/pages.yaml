    \ misuse of a technology does not mean the technology itself isn't worthwhile.\
    \ You might be surprised to know that Flash-based e-commerce applications have\
    \ a higher success rate (in terms of sales) than non-Flash sites. In part, this\
    \ is because the different client-server model used in Flash can result in a more\
    \ seamless process, giving the user fewer reasons not to complete the sale. All\
    \ that being said, e-commerce with Flash would be an entirely different book."
