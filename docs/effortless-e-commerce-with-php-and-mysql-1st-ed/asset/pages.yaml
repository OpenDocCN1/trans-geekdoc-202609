  md: "This last item is important: Just because the customer has already given you\
    \ money doesn't mean they couldn't use a little extra reassurance about that decision.\
    \ The site should provide a sense of when the order will be processed and even\
    \ ship, if possible.\n\nYou could also use the final.php script to take user feedback,\
    \ attempt to sell other products, and so forth.\n\nLet's start with the PHP script,\
    \ and then create the view file. The code for generating an HTML email receipt\
    \ will be created separately.\n\n# Creating the PHP Script\n\nThe PHP script is\
    \ the simplest of those in this chapter, but let's still walk through it explicitly.\n\
    \n+   1. Create a new PHP script in your text editor or IDE to be named final.php\
    \ and stored in the Web root directory.\n\n+   2. Include the configuration file:\n\
    \n```\n<?php\nrequire('./includes/config.inc.php');\n```\n\n+   3. Begin the session\
    \ and get the session ID:\n\n```\nsession_start();\n$uid = session_id();\n```\n\
    \nThis code is the same as in billing.php.\n\n+   4. Validate that the page is\
    \ being accessed appropriately:\n\n```\nif (!isset($_SESSION['customer_id']))\
    \ {\n    $location = 'https://' . BASE_URL . 'checkout.php';\n    header(\"Location:\
    \ $location\");\n    exit();\n} elseif (isset($_SESSION['response_code']) ||\n\
    \    ($_SESSION['response_code']! = 1)) {\n    $location = 'https://' . BASE_URL\
    \ . 'billing.php';\n    header(\"Location: $location\");\n    exit();\n}\n```\n\
    \nThe first conditional is the same as in billing.php and implies that the user\
