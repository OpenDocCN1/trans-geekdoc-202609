    # The Helper Function


    For the checkout process, one helper function will be defined. Because this process
    involves a couple of forms (for taking the shipping and billing information),
    a function for creating and managing form inputs will be quite useful. In Chapter
    4, “User Accounts,” the create_form_input() function was defined. That function
    creates a form element, handles any existing values, and indicates errors when
    appropriate. That version of the function created only text, password, and textarea
    inputs. It also looked for existing element values only in the $POST array. This
    site will use a new version of that function, generating both text inputs and
    select menus. The function also needs to be able to find existing values in $SESSION,
    not just $POST. A third alteration is that the function will allow for extra HTML
    to be added to inputs. You’ll see why shortly.


    +   1. Create a new PHP script in your text editor or IDE to be named form_functions.inc.php
    and stored in the includes directory.


    As in Part Two of the book, this script will only define a single function, but
    the file’s name will still be plural, in case more functions are added later.


    +   2. Begin defining the function:


    ```

    function create_form_input($name, $type, $errors, $values = ''POST'',

    => $extras = '''') {

    ```


    The function takes five arguments, two of which are optional. The first argument
    is the name for the element. The second is its type (for example, text or select).
    The third is an array in which any errors would be stored. These three arguments
    are the same as in the book’s previous version of this function.


    The fourth argument is the name of the array where existing values are to be found,
    for the purpose of making the form sticky. For the checkout process, the value
    will be either POST or SESSION. In theory, you could pass the array itself—$POST,
    $SESSION (even $GET or $COOKIE, if you wanted)—to the function, just as the $errors
    array is passed. But since these arrays are global in scope, they’ll be available
    to the function without being sent along as a second copy.


    The fifth argument is for passing extra HTML. This chapter will provide one value
    for this argument: autocomplete="off". You’ll see why and how later in the chapter.'
