    # The SQL


    The complete SQL commands for creating the tables are:


    ```

    CREATE TABLE `carts` (

    `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,

    `quantity` TINYINT UNSIGNED NOT NULL,

    `user_session_id` CHAR(32) NOT NULL,

    `product_type` ENUM(''coffee'',''other'') NOT NULL,

    `product_id` MEDIUMINT UNSIGNED NOT NULL,

    `date_created` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,

    `date_modified` TIMESTAMP NOT NULL DEFAULT ''0000-00-00 00:00:00'',

    PRIMARY KEY (`id`),

    KEY `product_type` (`product_type`,`product_id`),

    KEY `user_session_id` (`user_session_id`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    CREATE TABLE `customers` (

    `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,

    `email` VARCHAR(80) NOT NULL,

    `first_name` VARCHAR(20) NOT NULL,

    `last_name` VARCHAR(40) NOT NULL,

    `address1` VARCHAR(80) NOT NULL,

    `address2` VARCHAR(80) DEFAULT NULL,

    `city` VARCHAR(60) NOT NULL,

    `state` CHAR(2) NOT NULL,

    `zip` MEDIUMINT(5) UNSIGNED ZEROFILL NOT NULL,

    `phone` INT NOT NULL,

    `date_created` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,

    PRIMARY KEY (`id`),

    KEY `email` (`email`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    CREATE TABLE `general_coffees` (

    `id` TINYINT UNSIGNED NOT NULL AUTO_INCREMENT,

    `category` VARCHAR(40) NOT NULL,

    `description` TINYTEXT,

    `image` VARCHAR(45) NOT NULL,

    PRIMARY KEY (`id`),

    UNIQUE KEY `type` (`category`)

    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;

    ```


    **tip**


    You can download the SQL commands from www.DMCInsights.com/ecom/.'
