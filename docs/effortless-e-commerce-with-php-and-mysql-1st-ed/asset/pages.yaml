- pgno: 79
  md: 'To incorporate this HTML design into every page in the site, I’ll use a standard
    technique whereby the template is broken down into a header file and a footer
    file. Each page will include the header, then display the page-specific content,
    and then include the footer. Once you’ve finalized the basic template (or templates),
    you can start creating the individual files.


    # Creating the Header


    The header needs to begin the HTML page, include any necessary CSS and JavaScript,
    and code the body of the page up until the point where the page-specific content
    begins.


    +   1. Open your designed template file in your text editor or IDE, if it is not
    already.


    +   2. Copy all the HTML from the template file, up to the page-specific content:


    ```

