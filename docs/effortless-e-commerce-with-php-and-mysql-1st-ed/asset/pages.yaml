- pgno: 275
  md: "# Creating the Procedures\n\nThis chapter requires five new stored procedures.\
    \ Each one applies to an important part of the checkout process:\n\n+   - The\
    \ customer\n+   - The shopping cart\n+   - The order\n+   - The order's contents\n\
    +   - The payment transaction\n\nThree of these are simple, one is not too complicated,\
    \ and one is, well, complicated. Let's look at the easy ones first.\n\n# CLEARING\
    \ THE SHOPPING CART\n\nAfter the customer has completed a purchase, the shopping\
    \ cart needs to be emptied of its contents. That stored procedure is short and\
    \ simple:\n\n```\nDELIMITER $$\nCREATE PROCEDURE clear_cart (uid CHAR(32))\nBEGIN\n\
    \   DELETE FROM carts WHERE user_session_id=uid;\nEND$$\nDELIMITER ;\n```\n\n\
    This procedure takes one argument: the customer's cart session ID. The procedure\
    \ then runs a DELETE query on the carts table.\n\n# ADDING TRANSACTIONS\n\nThe\
    \ transactions table stores a record of every call to the payment gateway: what\
    \ order the transaction was tied to and what the response was. All this information\
    \ will also be available through the Merchant Interface, but it'd be nice to have\
    \ it on this server as well: When it comes to databases, it's always better to\
    \ store more information. There's nothing of a sensitive nature in the transaction\
    \ data (that is, no billing information), so storing it does not constitute a\
    \ security risk.\n\nThe transactions table has nine columns: id, order_id, type,\
    \ amount, response_code, response_reason, transaction_id, response, and date_created.\
    \ Most of these columns, and their values, will be explained later in the chapter\
    \ when the payment response is covered in detail. But for now,\n\n> All the book's\
    \ SQL commands can be downloaded from www.DMCInsights.com/ecom/.\n\n> Chapter\
    \ 8 provides instructions on using the command-line mysql client or the browser-based\
    \ phpMyAdmin to create stored procedures.\n\n> If you're looking for a good third-party\
    \ tool for MySQL development, check out Toad (www.quest.com). It's available free\
    \ for Windows.\n\n> As a reminder, the lines that change the delimiter aren't\
    \ part of the stored procedure itself, but are necessary in order to use semicolons\
    \ within the definition."
  merge: -1
  img_proc: true
- pgno: 276
  md: "seven of these values need to be provided when the procedure is called. Here\
    \ is that definition:\n\n```\n```sql\nDELIMITER $$\nCREATE PROCEDURE add_transaction\
    \ (oid INT, trans_type VARCHAR(18),\n\tamt DECIMAL(7,2), rc TINYINT, rrc TINYTEXT,\
    \ tid BIGINT, r TEXT)\nBEGIN\n\tINSERT INTO transactions VALUES (NULL, oid, trans_type,\
    \ amt, rc, rrc,\n\t\ttid, r, NOW());\nEND$$\nDELIMITER ;\n```\n```\n\nThe argument\
    \ names used in a stored procedure should not be the same as any table's column\
    \ names or as any MySQL keyword.\n\n# ADDING CUSTOMERS\n\nThe stored procedure\
    \ for adding a customer isn't that complicated, but it uses a new stored procedure\
    \ concept: outbound arguments (new in that they have not been discussed previously\
    \ in this book). Stored procedures can be written to take arguments, just like\
    \ a function in PHP. By default, all procedure arguments are inbound, meaning\
    \ that values are assigned to the arguments when the procedure is called. You\
    \ can also create outbound arguments. Outbound arguments are assigned values within\
    \ the procedure itself, not when the procedure is called. The values assigned\
    \ within the procedure can then be available outside of the procedure, after it\
    \ has been called.\n\nAs a practical example of how outbound arguments might be\
    \ used, take this next stored procedure, which inserts a record into the customers\
    \ table. The rest of the checkout process will need the new record's ID value,\
    \ so using an outbound argument is appropriate. Here is the procedure's definition:\n\
    \n```\n```sql\nDELIMITER $$\nCREATE PROCEDURE add_customer (e VARCHAR(80), f VARCHAR(20),\n\
    \tl VARCHAR(40), a1 VARCHAR(80), a2 VARCHAR(80), c VARCHAR(60),\n\ts CHAR(2),\
    \ z MEDIUMINT, p INT, OUT cid INT)\nBEGIN\n\tINSERT INTO customers VALUES (NULL,\
    \ e, f, l, a1, a2, c, s, z, p, NOW());\n\tSELECT LAST_INSERT_ID() INTO cid;\n\
    END$$\nDELIMITER ;\n```\n```\n\nSince the default parameter type is inbound, the\
    \ IN keyword declaring them as such is optional.\n\nThe first nine arguments are\
    \ typical inbound ones. They represent the customer's email address, first name,\
    \ last name, street address, additional street address, city, state, zip code,\
    \ and phone. The argument names are cryptic, but they aren't referenced more than\
    \ once within the procedure and, more impor-"
  merge: -1
  img_proc: true
- pgno: 277
  md: "tantly, they don't conflict with the table's actual column names this way.\
    \ These nine arguments are used as the values for the INSERT query.\n\nThe tenth\
    \ argument, cid, is defined as outbound, thanks to the OUT keyword. The last thing\
    \ the procedure does is call the LAST_INSERT_ID() function, which returns the\
    \ primary key value for the previously run INSERT. This value is selected and\
    \ assigned to cid.\n\n> Stored procedures can also have INOUT arguments, which\
    \ can be used for both inbound and outbound purposes.\n\n# RETRIEVING ORDER CONTENTS\n\
    \nAfter the order has been completed, many site pages will need to retrieve the\
    \ details of an order. For example, the PHP script that generates a receipt will\
    \ need to fetch those order details, as will an administrative script. Doing so\
    \ only requires the order ID, which can then be used to query the order_contents\
    \ table. The order_contents table stores the number of items purchased, the quantity,\
    \ and the price. By performing a JOIN from this table to the various product-related\
    \ tables, similar to the JOINs in the get_shopping_cart_contents() procedure,\
    \ each product's descriptive name can also be retrieved. The query also joins\
    \ in the orders table, so that it may select the order total and shipping cost.\n\
    \n> Because the get_order_contents() procedure will be used to confirm to the\
    \ customer what they just purchased, the query does not retrieve any of the customer\
    \ data.\n\n```\nDELIMITER $$\nCREATE PROCEDURE get_order_contents (oid INT)\n\
    BEGIN\n\tSELECT oc.quantity, oc.price_per, (oc.quantity*oc.price_per) AS subtotal,\n\
    \tncc.category, ncp.name, o.total, o.shipping\n\tFROM order_contents AS oc\n\t\
    INNER JOIN non_coffee_products AS ncp ON oc.product_id=ncp.id\n\tINNER JOIN non_coffee_categories\
    \ AS ncc\n\tON ncc.id=ncp.non_coffee_category_id\n\tINNER JOIN orders AS o ON\
    \ oc.order_id=o.id\n\tWHERE oc.product_type=\"other\" AND oc.order_id=oid\n\t\
    UNION\n\tSELECT oc.quantity, oc.price_per, (oc.quantity*oc.price_per),\n\tgc.category,\
    \ CONCAT_WS(\" - \", s.size, sc.caf_decaf, sc.ground_whole),\n\to.total, o.shipping\n\
    \tFROM order_contents AS oc\n\tINNER JOIN specific_coffees AS sc ON oc.product_id=sc.id\n\
    \tINNER JOIN sizes AS S ON s.id=sc.size_id\n\tINNER JOIN general_coffees AS gc\
    \ ON gc.id=sc.general_coffee_id\n\tINNER JOIN orders AS o ON oc.order_id=o.id\n\
    \tWHERE oc.product_type=\"coffee\" AND oc.order_id=oid;\nEND$$\nDELIMITER ;\n\
    ```\n\n> To fetch the order total and shipping cost, it must be selected as part\
    \ of each returned row, or a second SELECT query would be required and the procedure's\
    \ results would be that much harder to handle."
