    # ADDING ORDERS


    The final stored procedure for this chapter is perhaps the most complicated one
    in the book. At its core, the procedure needs to add a new order to the database.
    This involves populating both the orders and order_contents tables. Let''s look
    at the queries and the process separately, before revealing the complete procedure
    definition.


    Adding records to the orders table is easy: The INSERT just requires the customer
    ID, the total, the shipping cost (which is also part of the total), the last four
    digits of the credit card number (for the customer''s reference), and the date
    of the order. That query is:


    ```

    INSERT INTO orders (customer_id, shipping, credit_card_number, order_date) VALUES
    (cid, ship, cc, NOW());

    ```


    For now, let''s ignore the total column, as that value is unknown without adding
    up all the items in the order.


    Next, the order ID will be required to populate the order_contents table, so that
    information will need to be selected into a variable:


    ```

    SELECT LAST_INSERT_ID() INTO oid;

    ```


    This is exactly how the customer ID value is retrieved in the add_customer() stored
    procedure.


    The order_contents table is going to store the order ID, the product type (coffee
    or other), the product ID, the quantity, and the price being paid for each. The
    interesting thing is that all this information is readily available to the add_order()
    procedure without it being passed as arguments. And that''s where things get complicated...


    The order ID was just created, so that''s not a problem. The product type, product
    ID, and quantity can come from the carts table, assuming that this'
