- pgno: 138
  md: '# # Setting Up the Server


    Server permissions on files and directories comes down to who can do what. As
    for the what, the options are: read, write, and execute. The who is either the
    specific server user or groups of users.


    Before a PHP script can put files onto the server, there must be a folder on the
    server to which the PHP script can write, which is to say alter the directory’s
    contents. As PHP is run through the Web server, the who is the Web server user.
    So the goal is to create a folder that the Web server user can write to.


    How you go about actually doing this will depend upon how your server is set up,
    the operating system in use, and how PHP is running with respect to the Web server.
    At the end of the day, what this normally means is that you’ll create a directory
    and give “everyone” permission to write to it. In Unix terms, this is represented
    by the number 777. Normally your Web host provides a control panel through which
    you can change a folder’s permissions, or you may be able to do it through your
    FTP application (Figure 5.14).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_138_0.png)


    Figure 5.14


    Although allowing everyone to do everything with a directory may sound extremely
    dangerous, it’s not. What is meant by “everyone” is every user on the server.
    By “user” I mean a user account registered with the server. For example, there
    may be a mysql user that runs the database and the Web server may run as the user
    nobody. With open permissions, both of these users, as well anyone with FTP or
    SSH access to the server, can read from, write to, or execute the files in the
    directory. That’s not insignificant, but being available to everyone does not
    mean that anyone on the Internet can write files to that directory: a recognized
    server user is still required.


    All that being said, it doesn’t mean that you should be blasé about creating an
    open directory like this. If you’re on a shared server, everyone with a user account
    on that server can manipulate this directory—assuming they know it exists, of
    course, which is a big if. And, if there’s a security hole in a Web site, that
    vulnerability could be used to manipulate the directory—in this case, by users
    over the Internet—as the Web server user would be the active agent.


    There are many instances in which an open directory is necessary for the functioning
    of a site. The question becomes how to make the system as secure as possible.
    The answer is found by thinking like a hacker. If a hacker can’t break into a
    server, the next goal will be to have the server execute some dangerous code for
    her or him. One way of doing so is trying to get PHP (or whatever) to open, require,
    or include—thereby executing—some dangerous code found on another server. I talk
    about this in Chapter 2, “Security Fundamentals.” A second route is to get the
    dangerous code onto the server somehow and'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'then execute it directly. That''s a two-step process. Protecting against such
    an attempt is also, therefore, a two-step process:


    +   1. Do everything you can to prevent dangerous code from being placed on the
    server.


    +   2. Make it difficult, if not impossible, to directly execute dynamically added
    content.


    For the first step, it''s largely a matter of validating uploaded content: making
    sure it''s of an acceptable type. For the second step, the best solution is to
    store uploaded content in a directory outside the Web root directory. In such
    a case, if bad person Bob (on the Internet, not on your server) can trick your
    system into uploading some dangerous script, he still could not execute that script,
    as there would be no way to invoke it if it''s not in the Web root directory.


    tip

    Ways to use the Web server to protect directories are discussed in Chapter 7,
    “Second Site: Structure and Design.”


    If that''s not possible (for example, some shared hosts don''t allow you to put
    content above the Web directory), you should create a non-obvious folder within
    the Web directory. This folder will still require the open permissions, but you
    should password-protect the directory so that it''s only available (over HTTP)
    to authorized users. You can do this using your Web host''s control panel.


    tip

    In Chapter 3, “First Site: Structure and Design,” I talked about the server''s
    organization and where the pdfs directory should ideally go.


    Once you''ve created the pdfs directory with open permissions, and protected it
    appropriately if you had to place it in the Web root directory, you can create
    the PHP script that will upload a PDF file to that folder. But first, I would
    recommend creating another constant in the configuration file that is an absolute
    path to this folder:


    tip

    Change the value of PDFS_DIR so that it''s correct for your server.


    ```

    // In config.inc.php:

    define(''PDFS_DIR'', BASE_URI . ''pdfs/'');

    ```


    # Creating the PHP Script


    This PHP script has the same basic structure as all the other forms: The form
    is first displayed; the data is validated after the user submits the form; and
    the form is displayed again with its current values indicated should there be
    any errors. But this particular process will be trickier than the other forms
    in that it''s also dealing with an uploaded file. The file input cannot be made
    sticky and, more importantly, the actual file on the server must be addressed
    when the form is being redisplayed because of other errors. I''ll explain all
    the corresponding logic in the following steps.


    +   1. Create a new PHP script in your text editor or IDE to be named add_pdf.php
    and stored in the Web root directory.'
  merge: -1
  img_proc: true
