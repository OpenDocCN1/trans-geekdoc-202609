- pgno: 120
  md: '# # IMPROVING THE SECURITY


    The user accounts system in this example demonstrates a good approach to security.
    For starters, users are forced to use both letters and numbers in their password
    and at least one letter in each case. You could improve the security by requiring
    at least one nonalphanumeric character and by increasing the minimum length. Security
    is inversely proportional to convenience, so you would only make these changes
    knowing that you’ll annoy some of your potential customers. I also chose not to
    implement a “remember me” option because requiring that users log in each time
    they visit the site makes for better security (although, again, doing so is an
    inconvenience).


    As another safeguard, the passwords are securely hashed before being sent to the
    database, where they’re stored in binary format. And the only user account type
    that can be created through the registration process is the standard member; there’s
    no way to trick the system into creating an administrative account.


    Another, obvious and relatively easy way you can improve the security of the site
    is to implement SSL for the registration and login processes. To do so, change
    the link to the registration page to: ‘https://’ . BASE_URL . ‘register.php’.
    That form will be loaded via HTTPS, and the form data will be posted back to the
    server via HTTPS, too. In fact, with nothing but relative links in the site, everything
    will be HTTPS until you create a link that returns to an HTTP connection.


    > **tip**


    Part Three, “Selling Physical Products,” of the book will demonstrate switching
    the use of SSL as appropriate.


    Serving the login form over HTTPS is trickier, because the form is included by
    other pages. Your options are to serve every page over HTTPS, which isn’t ideal,
    or to create a separate login page.


    As mentioned before, you could implement an activation process as part of the
    registration, in which case the customer would be sent to PayPal after activating
    the account, not after first registering. You could also send an email when a
    password change is requested and only by clicking the link in that email would
    the user have their password reset. Right now, anyone can reset other users’ passwords,
    which is a bother, even if it doesn’t adversely affect the security.


    > **tip**


    Storing session IDs in cookies is preferred, security-wise, to storing it in links
    and forms.


    Because this system relies upon a login to authenticate the user, much of its
    security depends upon using sessions and a cookie (for storing the session ID
    in the browser). Limiting the life of the cookie, changing the session name (which
    is also the cookie’s name), and tweaking the other cookie parameters can all increase
    the site’s security. You can even send the cookie only over SSL, but that would
    require using SSL for every page once the user logged in.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "For the session itself, one recommendation that I made in Chapter 2, “Security\
    \ Fundamentals,” was to change the session storage directory if using a shared\
    \ host. You can also shorten how quickly the session expires, as well as how quickly\
    \ the session cookie expires.\n\nThese are all *potential* alterations you could\
    \ make. One recommendation you should implement is changing the session ID for\
    \ administrative users. By doing so, you can prevent a *session fixation attack*.\n\
    \nA *session fixation attack* is when a malicious user, Alice, starts her own\
    \ session on your site, quite legitimately. She then gets administrator Bob to\
    \ visit the site using that same session ID, normally by getting Bob to click\
    \ a link with the session ID embedded. When Bob logs in to the site, that same\
    \ session will now be associated with an administrative account, giving Alice\
    \ administrative access through her browser and existing session. Preventing this\
    \ is quite simple: Change the session ID using the *session_regenerate_id()* function.\
    \ By doing so, when Bob logs in, his session ID will change, meaning Alice’s legitimate\
    \ session won’t be updated to reflect Bob’s administrative status.\n\nTo add this\
    \ technique to the *login.inc.php* script, change the storing of data in the session\
    \ to:\n\n```\nif ($row[2] == 'admin') {\n  session_regenerate_id(true);\n  $_SESSION['user_admin']\
    \ = true;\n}\n$_SESSION['user_id'] = $row[0];\n$_SESSION['username'] = $row[1];\n\
    if ($row[3] == 1) $_SESSION['user_not_expired'] = true;\n```\n\nYou’ll need to\
    \ call *session_regenerate_id()* before storing any session data, because by passing\
    \ a value of *true* as the first argument to the function, any existing session\
    \ data is also destroyed.\n\nFinally, access to site content in this example will\
    \ be determined by dates without times. With the sessions as written, the worst\
    \ thing that could happen would be that a user whose account expires today is\
    \ allowed to continue accessing site content for some minutes or hours into tomorrow.\
    \ But even that is only true if the user keeps their session active. Not a huge\
    \ concern, in my opinion.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_121_0.png)"
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 5 MANAGING SITE CONTENT


    If you’re reading this book in order—and I certainly hope you are— then you’ve
    got a site where users can register, log in, change their password, and log out,
    but there’s nothing for them to look at! On the other hand, they haven’t paid
    anything yet either, so...


    In this chapter, you’ll create the content management side of the equation, with
    two kinds of content: HTML pages and PDFs. I’ll tell you how to write the code
    for creating and displaying the content.


    But first, you’ll need to create an administrative user.


    # CREATING AN ADMINISTRATOR


    Even though administrators will use the same login system and the same underlying
    users table as regular users, for security reasons, you cannot create an administrator
    through the site itself. By making that decision, no possible flaw in the site
    could result in administrators being created. And since administration accounts
    won’t be created often, it makes sense not to implement that feature anyway. But
    you still need at least one administrator, so let’s do that now.


    +   1. Register the administrator using the same registration page.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'This would likely be the first user that gets registered anyway, just to test
    the system. Enter the administrator''s email address and give the administrator
    a logical username, such as admin.


    +   2. Access your database using a third-party interface.


    On a hosted server, you most likely have a phpMyAdmin interface for manipulating
    your database, accessible only after logging in to a control panel. Or you could
    use the command-line MySQL client, if you prefer.


    +   3. Change the user''s type value.


    You can change the type by running a query such as:


    ```

    UPDATE users SET type=''admin'' WHERE email=''theEmailAddress''

    ```


    Or, if you''re using phpMyAdmin:


    +   A. Browse the users table.


    +   B. Click the pencil icon next to the record you want to change (Figure 5.1).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_123_0.png)


    Figure 5.1


    +   C. Use the editor form to change the user type (Figure 5.2).


    +   D. Click Go.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_123_1.png)


    Figure 5.2


    > tip

    > The system, as written, allows for any number of administrators, all with the
    same powers (which is not many).


    # ADDING PAGES


    As I''ve said (several times over by now), the site will have two kinds of content.
    The first kind will be HTML, but the site''s not going to assume that the administrator
    knows how to create an HTML page. Instead, there will be an interface for doing
    so. The administrator will use a simple, single page that displays and handles
    an HTML form. To create the HTML content, a What You See Is What You Get (WYSIWYG)
    editor will be incorporated into the form (Figure 5.3).


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_123_2.png)


    Figure 5.3'
