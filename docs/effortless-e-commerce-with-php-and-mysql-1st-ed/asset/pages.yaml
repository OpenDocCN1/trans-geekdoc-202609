- pgno: 59
  md: 'pretty successful to even be a target, so you could look at a DoS attack as
    a sign that you’ve made it (in a lemons-to-lemonade kind of way).


    Whereas DoS attacks are relatively rare and hard to prevent, SQL Injection attacks
    are quite common and very easy to prevent. The premise behind an SQL Injection
    attack is that the user submits SQL to a site in the hope that a problematic SQL
    command will be executed, thereby either revealing sensitive information or damaging
    the database. For example, a login form might run a query like:


    ```

    SELECT * FROM users WHERE email=''$email'' AND pass=SHA1(''$pass'')

    ```


    The $email and $pass values presumably come from the login form. If the user were
    to submit ‘;DROP TABLE users; as the password, and if steps weren’t taken to prevent
    this, the resulting query would be:


    ```

    SELECT * FROM users WHERE email=''whatever@example.edu'' AND pass=SHA1(";DROP
    TABLE users;")

    ```


    In theory, the one SQL command becomes three separate ones. First, there’s an
    syntactically invalid SELECT, which would do nothing other than create an error,
    then the DROP TABLE command would be run, and then there’s a third meaningless,
    syntactically invalid query. If these three queries were executed, that would
    be bad.


    There are many ways of stopping these attacks from being productive. First, you
    should validate data to expected values as much as possible (that is, an email
    address has an exact format and certain values must be positive integers). Second,
    run all strings, even those you’ve validated, through a database-specific escaping
    function, such as mysqli_real_escape_string():


    ```

    $pass = mysqli_real_escape_string($dbc, $_POST[''pass'']);

    ```


    Next, you should typecast all values that should be numeric to force them to be
    numbers:


    ```

    $id = (int) $_GET[''id''];

    ```


    With that code, if the user manipulated $_GET[''id''] to be ‘;DROP TABLE users;,
    that string would be typecasted to an integer with a value of zero. When used
    in a query, it will probably return no results, but it won’t do any harm.


    An alternative is to use prepared statements, in which specific values get separated
    from the query and are recombined on the database level. You must still validate
    data used in prepared statements—there’s no purpose in running a query with data
    that’s known to be bad, but the query will always be safe.


    > **tip**

    > Prepared statements can also have a performance benefit, as you’ll learn in
    Part Three.'
