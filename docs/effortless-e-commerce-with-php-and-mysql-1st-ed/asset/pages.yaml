    # # Creating the Home Page


    To put it all together, you''ll create the home page, which will combine the four
    files—configuration, header, MySQL connection, and footer—into one complete page.


    +   1. Create a new PHP script in your text editor or IDE to be named index.php
    and stored in the Web root directory.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_86_0.png)


    # ## note


    The parentheses with require and include aren''t required, but you''ll see me
    use them in this book.


    +   2. Include the configuration file:


    ```

    ```php

    <?php

    require(''./includes/config.inc.php'');

    ```

    ```


    The config file defines system settings, handles errors, and starts the session,
    so it should always be the first (noncomment) code in your pages.


    +   3. Include the header file:


    ```

    ```php

    include(''./includes/header.html'');

    ```

    ```


    +   4. Require the database connection:


    ```

    ```php

    require(MYSQL);

    ```

    ```


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_86_1.png)


    # ## note


    In the downloadable version of index.php, you''ll see a bit of extra code, which
    you''ll add in Chapter 4.


    The database connection script can be included by referring to the MYSQL constant,
    defined in the configuration file. This means that even if you change the name
    or location of mysqli.inc.php, you have to change only one line in the configuration
    file and all your pages will still include that script properly.


    In this particular version of the home page, the database connection isn''t needed
    until the footer, but most pages will need it before the page-specific content.


    +   5. Create the page-specific content:


    ```

    ```php

    ?> <h3>Welcome</h3>

    <p>Welcome to Knowledge is Power, a site dedicated to keeping you up to date on
    the Web security and programming information you need to know. Blah, blah, blah.
    Yadda, yadda, yadda.</p>

    ```

    ```'
