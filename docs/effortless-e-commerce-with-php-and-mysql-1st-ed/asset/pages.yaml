    # # 9 BUILDING A SHOPPING CART


    In the previous chapter, an online catalog of products was developed, complete
    with buttons for adding items to the customer’s shopping cart. Now it’s time to
    implement the cart itself. A good shopping cart shows customers exactly what they
    have in their basket and provides ways to remove items, update the quantities,
    and to check out. For this Web site, there’s also a “wish-list” feature, allowing
    the customer to save cart items for later.


    The bulk of this chapter will focus on writing the shopping cart and wish-list
    features. First, though, new stored procedures are required. The chapter ends
    with various ways to factor in shipping as well as a discussion of other additions
    you could add to this process.


    # ## DEFINING THE PROCEDURES


    Because this site uses an MVC approach, the chapter begins by looking at the model
    aspect of the project, which is to say the database. Eight stored procedures will
    be defined in this chapter: four for the shopping cart and four for the wish list.
    Only two of the queries involved come close to being as complex as those in Chapter
    8, “Creating a Catalog,” although the procedures themselves will use a bit more
    logic than the ones you’ve already seen. Because the carts and wish_lists tables
    have the exact same structure and because they’ll be used identically, I’ll just
    explain the stored procedures for the cart. To create the corresponding procedures
    for the wish list feature, you’ll just need to replace every occurrence of “cart”
    with “wish_list.”'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# # Adding Products


    The `add_to_cart()` stored procedure will be invoked when the customer requests
    that a product be added to their shopping cart. The procedure needs to take four
    pieces of information — a unique user ID, the product type (`coffee` or `other`),
    the product ID, and the quantity being added. As an extra bit of logic, the procedure
    should `add` the product to the cart if it doesn’t already exist there but `add`
    more quantity of the product if it is already in the cart. Here is the stored
    procedure, and I’ll explain its logic afterward:


    ```

    DELIMITER $$

    CREATE PROCEDURE add_to_cart (uid CHAR(32), type VARCHAR(6), pid MEDIUMINT, qty
    TINYINT)

    BEGIN

    DECLARE cid INT;

    SELECT id INTO cid FROM carts WHERE user_session_id=uid AND

    product_type=type AND product_id=pid;

    IF cid > 0 THEN

    UPDATE SET quantity=quantity+qty, date_modified=NOW()

    WHERE id=cid;

    ELSE

    INSERT INTO carts (user_session_id, product_type, product_id,

    quantity) VALUES (uid, type, pid, qty);

    END IF;

    END$$

    DELIMITER ;

    ```


    > See Chapter 8 for instructions on creating stored procedures in your database.


    > You can download all the SQL and files for this project from www.DMCInsights.com/ecom/.


    First, in keeping with how stored procedures are created, the delimiter is immediately
    changed to the combination of two dollar signs together. Next, the procedure’s
    `signature` is created, which is to say the combination of its name and arguments.
    The first argument is the user’s session ID, which will be exactly 32 characters
    long. Next is the product type, which will be either five or six characters long
    (`other` or `coffee`). The last two arguments are the product’s ID and the quantity
    being added.


    > The delimiter just needs to be changed to something other than a semicolon.


    To incorporate the logic that checks if the product is already in the cart, an
    internal variable is necessary. You can create one using `DECLARE`, followed by
    the variable’s name and its MySQL data type. The variable named `cid` is created,
    short for `cart ID`.


    > Variables must be declared immediately after the `BEGIN` statement.


    Next, a `SELECT` query checks the `carts` table for the submitted product. If
    the product is already represented in the table, then its `id` value will be assigned
    to the `cid` variable, thanks to the `SELECT...INTO` syntax.'
