- pgno: 13
  md: '# # INTRODUCTION


    Electronic commerce has been an important and viable part of the Internet for
    well over a decade now. From the behemoths like Amazon.com to the mom-and-pop
    online stores, e-commerce is performed in a number of ways. Despite the dozen,
    or hundred, of failures for every single commercial success, e-commerce can still
    be an excellent business tool when done properly. And yet, surprisingly, there
    are very few books dedicated to the subject.


    Using two concrete examples, plus plenty of theory, this book covers the fundamentals
    of developing e-commerce Web sites using PHP and MySQL. Emphasizing security,
    a positive customer experience, and modular, extendable programming, this book
    presents tons of detailed solutions to today''s real-world e-commerce demands.
    Whether you''ve been creating dynamic Web sites for years or just weeks, you''re
    bound to learn something new over the course of the next 11 chapters.


    # # WHAT IS E-COMMERCE?


    In the broadest sense, the term e-commerce covers the gamut of possible online
    commercial transactions. Any Web site with the intention of making money for a
    business could fall under the “e-commerce” label. Of course, such a liberal definition
    encompasses the vast majority of existing Web sites. On the opposite end of the
    scale, e-commerce can be defined as strictly the online act of taking money directly
    from customers. And that''s the kind of e-commerce this book addresses.


    There are two key differences between a site hoping simply to make money and one
    intending to take money:


    +   - How comfortable the customer needs to be

    +   - How secure the site needs to be


    A site can make money from selling ads, in which case all that''s required of
    the customer is that they visit. Or a site could make money from referrals, where
    the hope is that the customer will use a link on the site to purchase something
    from another site. In both cases, what''s being asked of the user is insignificant.
    But when a site wants a customer to provide their full name, address, and credit
    card information, that becomes serious business. The customer must be respected,
    their questions answered, their concerns addressed, and their fears mitigated
    in order for the site to succeed in the endeavor.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'When it comes to e-commerce, I can''t overstress the importance of security.
    To protect both the business and the customers, a site must be designed and programmed
    so as to establish and maintain an appropriate level of security. As you’ll see,
    especially in Chapter 2, “Security Fundamentals,” the overall security of a Web
    site is impacted not just by the code you write but also by some of the initial
    decisions that you make, such as the chosen hosting environment. With this in
    mind, security concerns are presented in the book from the big picture and the
    general theories down to the nuances of specific code. You can rest assured that
    the book’s examples have no known security holes. Moreover, there’s plenty of
    discussion as to how you can make specific processes even more secure, as well
    as warnings as to what you shouldn’t do, from a security perspective.


    # ABOUT THIS BOOK


    The goal of this book is to portray the widest possible range of what e-commerce
    can be, in terms of PHP code, SQL and MySQL, and a Web site’s user interface.
    Toward that end, the book is broken into three parts, cleverly named Part One,
    Part Two, and Part Three (and in that order, no less!).


    Part One, “Fundamentals,” has just two chapters. They:


    +   - Discuss the fundamental theories and issues surrounding an e-commerce business

    +   - Examine what decisions will need to be made up front

    +   - Lay out critical aspects of online security


    In Part Two, “Selling Virtual Products,” an entire e-commerce site is developed.
    This site sells virtual products, namely access to content. With virtual products,
    there’s no inventory management or anything to sell. The business just needs to
    accept payment from customers and ensure that access is denied to nonpaying customers.
    For this example, PayPal will be used to handle customer payments. PayPal is a
    wise choice for beginning e-commerce sites, because it’s easy to integrate, has
    a name that almost all customers will be familiar with (and therefore, trust),
    and minimizes the security risks taken by the site itself.


    Part Three, “Selling Physical Products,” creates an entire e-commerce site for
    the sake of selling physical products. This means: inventory management, an online
    catalog, shopping carts, order history, and more. For that example, the Authorize.net
    payment gateway will be integrated directly into the Web site, creating a more
    seamless and professional experience.


    By using two examples with different goals and features, the book presents a smorgasbord
    of ideas, database designs, HTML tricks, and PHP code. The intention is that,
    after completing the book, you’ll feel comfortable implementing any number or
    combination of features and approaches on your own e-commerce sites.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Technologies Used


    This book, as its title implies, uses the PHP scripting language (www.php.net)
    and the MySQL database application (www.mysql.com) as the foundation of the Web
    site. The book uses version 5.3.2 of PHP and version 5.1.44 of MySQL, although
    you should have no problems with any of the code so long as you’re using PHP 5.2
    or greater and MySQL 5.0 or greater. In places where newer versions of these technologies
    are required, you’ll see alternative ways to accomplish the same tasks.


    As with any modern Web site, HTML is involved (of course), as is CSS. The book
    does not explain either in great detail, but does show some best practices in
    terms of their use.


    In Part Three of the book, you’ll encounter some JavaScript, involving the jQuery
    framework (www.jquery.com). In those few instances, jQuery is used to enhance
    the site and add some functionality, but the JavaScript itself is not complicated.


    Part Three of the book also taps into some of what the Apache Web server (http://httpd.apache.org)
    can do. As with the JavaScript, the Apache particulars are not too complex, but
    are still very useful and worth knowing.


    # Getting Help


    If you have any problems with, or questions about, what is said or done in this
    book, there are several resources to which you can turn, starting with, naturally,
    the book’s corresponding Web site, www.DMCInsights.com/ecom/. There you can find
    all the files, code, and SQL commands used in this book.


    At www.DMCInsights.com/phorum/ is a support forum dedicated to this book. If you
    post a question or comment there, you’ll get a relatively prompt reply, from others
    or me.


    Finally, as this book was designed to be both modular and extendable, I came up
    with literally dozens of additional ideas or alternative approaches as I created
    the two examples. As time permits, these extras will be discussed, and sample
    code provided, through the book’s corresponding Web site.


    # WHAT YOU''LL NEED


    Just as e-commerce is a transaction between a customer and a Web site, a book
    can be viewed as a transaction between the writer and the reader (just not one
    that takes place in real time). I’ve already presented a short sense of what this
    book is, but who do I imagine you to be and what will you need?'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # Some Fundamental Skills


    The goal of this book is to demonstrate the application of PHP and MySQL to the
    task of creating an e-commerce site. Although I expect that even a seasoned Web
    developer will learn a lot, the book does not, nor cannot, teach the absolute
    fundamentals of either PHP or MySQL. If you''re not already somewhat comfortable
    with these two technologies, this is not the book for you. If you have no problems
    executing a MySQL query using PHP and then handling those query results, you''ll
    be fine.


    The same must be said for the secondary technologies involved, namely HTML and
    CSS. If the definition of an HTML form is foreign to you, you should learn those
    basics before getting immersed in this book''s material.


    As for the JavaScript, jQuery, and Apache work that you''ll come across, no previous
    experience with them is expected.


    # # A Web Server


    In order to develop a Web site using PHP and MySQL, you''ll need a Web server,
    which is to say a computer running PHP through a Web server application (such
    as Apache or IIS, Internet Information Server) and the MySQL database application
    server. Fortunately, you can install all these on your own computer, at absolutely
    no cost. The easiest way to do so is to use an all-in-one package, such as XAMPP
    (www.apachefriends.org) or MAMP (www.mamp.info). If you already have a Web site
    being hosted on a live server, that will work as well.


    # # And a Bit More


    A Web server will let you run a dynamic Web site, but you need additional tools
    to develop one: at the very least, a decent text editor or Integrated Development
    Environment (IDE). A commercial IDE like Adobe Dreamweaver (www.adobe.com/go/dreamweaver)
    is fine, as is an open-source IDE like Aptana Studio (www.aptana.com) or a plain-text
    editor such as TextMate (www.macromates.com). Just use something with more features
    than Notepad!


    It really doesn''t matter what Web browser you''re using, although Firefox (www.mozilla.com)
    has better debugging tools available (such as Firebug, www.getfirebug.com) than
    the others.


    And that''s really it! If you''ve already done some PHP and MySQL development
    (which is a requirement for following along with this book), you probably already
    have everything you need. So let''s get started!'
  merge: -1
  img_proc: true
