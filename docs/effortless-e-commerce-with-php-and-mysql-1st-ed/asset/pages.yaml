- pgno: 395
  md: '# POTENTIAL ALTERATIONS


    As with several other chapters in this book, this one concludes with some variations
    on what you can do with this chapter’s content. None of these alterations are
    obligatory or necessarily better than what’s already been done, just worth considering.


    # Making Recommendations


    Part of a good shopping cart, at least prior to the customer completing the sale,
    is recommending other products to purchase. Generously said, recommendations offer
    an additional benefit to the customer, because they truly may be interested in
    other items and appreciate those items being brought to their attention. Cynically,
    it could mean more money for the business.


    There are two broad types of recommendations:


    +   - Upselling: recommending similar products that are better and more expensive


    +   - Cross-selling: recommending related products that the customer might want
    in addition


    Upselling in this particular site is simple: If a customer has a one-pound bag
    of coffee in their cart, recommend the two-pound bag. Or if your site sells audio
    visual equipment, upselling might be recommending other models (like a receiver
    or DVD player) by the same manufacturer.


    Cross-selling has a larger potential—not everything can be upsold—but requires
    more thought. When a site doesn’t have that many products or that large of an
    order history, you can implement recommendations by creating a system whereby
    the administrator makes associations among products. If the site sells a lot of
    stuff, this might become impractical, so if you have a number of orders in the
    system, you can create automatic recommendations based on what other customers
    have purchased. The premise, and the underlying code, is simple: If a customer
    has, say, a bag of Kona coffee in their cart, recommended products would be those
    things that other customers purchased in addition to Kona coffee. You could even
    define the strength of a recommendation based on how often it is purchased along
    with the original product.'
  merge: -1
  img_proc: true
- pgno: 396
  md: "# # Creating Add to Wish List Links\n\nA simple change you could make to the\
    \ site would be to include *Add to Wish List* links beside products, just like\
    \ the *Add to Cart* links. With the wishlist.php script as written, you would\
    \ just need to create an “add” action conditional, like the one in cart.php.\n\
    \n# # Shipping Alternatives\n\nShipping, like the choice of payment processor\
    \ itself, is such a big topic that I could arguably dedicate an entire chapter\
    \ to the myriad of ways to handle this part of an order. The simplest, but clearly\
    \ not the best, way to handle shipping is to not charge anything additional at\
    \ all: Just factor enough profit into each item sold to cover the expense. The\
    \ site that does this will run the risk of losing business to other sites that\
    \ overtly charge less for the same item, even though those sites will later add\
    \ in shipping charges. Also, this approach would not allow for different shipping\
    \ options (such as the speed of delivery) or easy adjustments to the cost of shipping\
    \ as they change over time.\n\nThe second simplest way to calculate shipping is\
    \ implemented here: a proportional amount dictated by the order total. This approach\
    \ is easy to manage, easy to change, and reasonable, both for the business and\
    \ for the customer.\n\nTo calculate shipping based on the weight of the order,\
    \ you’d need to modify the database so that the weight of items is recorded along\
    \ with the other product details. Depending on what you’re selling, you’d be best\
    \ off representing all weights in the same unit: grams, kilograms, ounces, pounds,\
    \ what have you. The shopping cart would then need to retrieve the weight for\
    \ each product, generate a weight total, and then calculate the shipping using\
    \ the total weight.\n\nOn a similar note, you could create an additional shipping\
    \ cost representative column in the database. This could be a column added to\
    \ the specific products tables (non_coffee_products and specific_coffees, accordingly),\
    \ in which case there would expect to be a lot of NULL values, which is not ideal.\
    \ Alternatively, you could create a new table that represents each product that\
    \ has an additional shipping cost as one row:\n\n```\nCREATE TABLE `extra_shipping`\
    \ (\n  `id` INT UNSIGNED NOT NULL AUTO_INCREMENT,\n  `product_type` ENUM('coffee','other')\
    \ NOT NULL,\n  `product_id` MEDIUMINT UNSIGNED NOT NULL,\n  `extra_charge` DECIMAL(4,2)\
    \ UNSIGNED NOT NULL,\n```"
  merge: -1
  img_proc: true
