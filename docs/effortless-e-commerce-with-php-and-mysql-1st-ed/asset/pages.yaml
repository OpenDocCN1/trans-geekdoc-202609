    \ be formally developed in this book but is available for viewing in the downloadable\
    \ code.\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_70_0.png)\n\n![](img/4f47e47c67bd619ac73250f11c9fc7ce_70_1.png)\n\
    \nFigure 3.2\n\nFigure 3.3\n\nAs a precaution, use the Web server’s tools to restrict\
    \ access to the **includes** directory. Doing so will deny people access to it\
    \ and the **pdfs** subfolder but won’t interfere with a PHP script’s ability to\
    \ access its contents. Chapter 7 will discuss ways of doing this in detail.\n\n\
    # # FILE EXTENSIONS\n\nWhen a user requests a page that uses a **.html** extension,\
    \ the server will pass along the page’s contents directly to the browser without\
    \ any additional server processing. But when the user requests a page with a **.php**\
    \ extension, the server will first run the page’s content (that is, the code)\
    \ through the PHP interpreter, which will then execute the code. (These are the\
    \ standard settings; servers can be set up to treat extensions in other ways.)\
    \ With this in mind, it’s important that the site’s primary pages — those that\
    \ the user will directly access — use the **.php** extension in order for the\
    \ code to be processed. Pages that are included by other PHP scripts and not run\
    \ directly in the browser aren’t handled by\n\nthe server directly, so you have\
    \ your choice of what extension to use.\n\nI use the **.html** extension for files\
    \ that are primarily HTML, such as the header and footer. For pages that are primarily\
    \ PHP, but are intended as included files, I use a combination: **.inc.php**.\
    \ The **.inc** part indicates that it’s a file to be included, but the **.php**\
    \ prevents the code from being revealed should the file somehow be run directly\
    \ in a Web browser. If you were to use just **.inc**, the server would probably\
    \ not send the contents through the PHP interpreter, thereby sending potentially\
    \ sensitive information to the browser. That’s a security risk that’s not worth\
    \ taking."
