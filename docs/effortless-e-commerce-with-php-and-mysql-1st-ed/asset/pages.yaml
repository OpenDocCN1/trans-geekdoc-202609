- pgno: 215
  md: '# SELECTING EVERY SALE ITEM


    The query for selecting every sale item is:


    ```

    SELECT CONCAT("O", ncp.id) AS sku, sa.price AS sale_price, ncc.category,

    ncp.image, ncp.name, ncp.price, ncp.stock, ncp.description

    FROM sales AS sa

    INNER JOIN non_coffee_products AS ncp ON sa.product_id=ncp.id

    INNER JOIN non_coffee_categories AS ncc ON

    ==> ncc.id=ncp.non_coffee_category_id

    WHERE sa.product_type="other" AND

    ((NOW() BETWEEN sa.start_date AND sa.end_date) OR (NOW() >

    ==> sa.start_date AND sa.end_date IS NULL ))

    UNION

    SELECT CONCAT("C", sc.id), sa.price, gc.category, gc.image,

    CONCAT_WS(" - ", s.size, sc.caf_decaf, sc.ground_whole), sc.price,

    sc.stock, gc.description

    FROM sales AS sa

    INNER JOIN specific_coffees AS sc ON sa.product_id=sc.id

    INNER JOIN sizes AS S ON s.id=sc.size_id

    INNER JOIN general_coffees AS gc ON gc.id=sc.general_coffee_id

    WHERE sa.product_type="coffee" AND

    ((NOW() BETWEEN sa.start_date AND sa.end_date) OR (NOW() >

    ==> sa.start_date AND sa.end_date IS NULL ));


    ```


    Because of the order of the two SELECT queries, the non-coffee products will be
    returned first, followed by the coffee products.


    Figure 8.7 shows the output for the query.


    ![](img/4f47e47c67bd619ac73250f11c9fc7ce_215_0.png)


    Figure 8.7


    This query is relatively complex, because it performs a UNION of two SELECT queries,
    one of which is a JOIN across three tables and the other of which is a JOIN across
    four! The complexity derives from the fact that some records in the sales table
    will relate to the specific_coffees table (when the sales table''s product_type
    value is coffee), and other records will relate to the non_coffee_products table
    (when the sales table''s product_type value is other). To perform both of these
    JOINs at one time requires the UNION statement, which is a way of combining two
    similar but unrelated queries to create one result set.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The individual SELECT queries are similar to those just explained, but without
    a WHERE condition on the category. However, both SELECT queries do require a conditional
    that confirms that the item is currently on sale:


    ```

    ((NOW() BETWEEN sa.start_date AND sa.end_date) OR (NOW()) >

    sa.start_date AND sa.end_date IS NULL))

    ```


    An item''s sale price is applicable if the current moment is between the start
    and end dates of that sale, or if the current moment is after the start date and
    there is no end date.


    For both SELECT queries, the SKU is manufactured (as in the other queries), and
    the product''s category, image, name, regular price, stock, and description are
    also returned. For the non-coffee products, the name will simply be the name value
    from the non_coffee_products table, and the image and description will come from
    there as well. For the coffee products, name will be the concatenation of several
    values, and image and description will come from the general_coffees table.


    # SELECTING A FEW RANDOM SALE ITEMS


    The last complex query selects up to four random sale items:


    ```

    (SELECT CONCAT("O", ncp.id) AS sku, sa.price AS sale_price, ncc.category,

    ncp.image, ncp.name

    FROM sales AS sa

    INNER JOIN non_coffee_products AS ncp ON sa.product_id=ncp.id

    INNER JOIN non_coffee_categories AS ncc ON

    ncc.id=ncp.non_coffee_category_id

    WHERE sa.product_type="other" AND

    ((NOW() BETWEEN sa.start_date AND sa.end_date) OR (NOW()) >

    sa.start_date AND sa.end_date IS NULL))

    ORDER BY RAND() LIMIT 2)

    UNION

    (SELECT CONCAT("C", sc.id), sa.price, gc.category, gc.image,

    CONCAT_WS(" - ", s.size, sc.caf_decaf, sc.ground_whole)

    FROM sales AS sa

    INNER JOIN specific_coffees AS sc ON sa.product_id=sc.id

    INNER JOIN sizes AS s ON s.id=sc.size_id

    INNER JOIN general_coffees AS gc ON gc.id=sc.general_coffee_id

    WHERE sa.product_type="coffee" AND

    ((NOW() BETWEEN sa.start_date AND sa.end_date) OR (NOW()) >

    sa.start_date AND sa.end_date IS NULL))

    ORDER BY RAND() LIMIT 2);

    ```'
