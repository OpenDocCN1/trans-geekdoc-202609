    # Adding a WYSIWYG Editor


    Web-based WYSIWYG editors are so common these days that you have many to choose
    from. To create a WYSIWYG editor, you install the editor code on your site, create
    a textarea in a form, and then indicate that the editor should be used for that
    textarea. The two most common WYSIWYG editors are probably CKEditor (www.ckeditor.com,
    formerly FCKEditor, although FCKEditor is still available) and TinyMCE (http://tinymce.moxiecode.com).
    I''ve used these in different projects and they''re more similar than not. All
    are written in JavaScript, are open source, and have a slew of plug-ins for adding
    features such as spell check or fancy lists. The documentation for these projects
    is fair, and if you can follow the right syntax outlined therein, you should have
    no trouble installing and customizing these tools.


    > tip

    > There are free third-party file management plug-ins available, but I have not
    found them to be as good as the commercial ones.


    A WYSIWYG editor can make it easy to create styled and formatted HTML, containing
    any valid tag, from lists to links to font-related elements. A WYSIWYG editor
    can also make it easy to add any kind of media, most commonly images and video.
    However, TinyMCE and CKEditor require a plug-in to manage file uploads and, in
    both cases, the plug-ins are created by the same companies and are commercial
    products. For this reason, I''m not integrating that functionality into this example.
    When the time comes that you need this functionality, just check out the corresponding
    documentation for the WYSIWYG editor of your choice.


    +   1. Download the latest version of TinyMCE from

    +   http://tinymce.moxiecode.com.'
