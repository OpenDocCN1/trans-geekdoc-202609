  2. 2. T. Hastie , R. Tibshirani, and J. Friedman. (2009). *The Elements of Statistical\
  \ Learning: Data Mining, Inference, and Prediction*. 2nd ed. Springer-Verlag, New\
  \ York.\n3. 3. J. Friedman , T. Hastie, and R. Tibshirani. (2010). “Regularization\
  \ Paths for Generalized Linear Models via Coordinate Descent.” *Journal of Statistical\
  \ Software*, 33(1).\n4. 4. K. Bache and M. Lichman. (2013). UCI Machine Learning\
  \ Repository. Irvine, CA: University of California, School of Information and Computer\
  \ Science. `http://archive.ics.uci.edu/ml`.\n\n\n\n\n理论上可以使用许多不同的算法作为基学习器——二叉决策树、支持向量机等——但在实际操作中，二叉决策树的使用最广泛。它们是你可以在项目中使用的开源和商业软件包中的基学习器。集成模型是数百或数千个二叉决策树的集合，而这些集成模型的许多属性都是继承自二叉决策树的。因此，本章从介绍二叉决策树开始。\n\
  \n## 二叉决策树\n\n二叉决策树通过对属性进行一系列二分类（是/否）决策来工作。每个决策都会导致两种可能性之一：导致另一个决策，或者导致一个预测。一个训练后的树示例将有助于强化这一概念。在理解训练结果后，你将学习训练是如何运作的。\n\
  \n列表 6-1 展示了使用 scikit-learn 的 `DecisionTreeRegressor` 包为葡萄酒质量数据构建二叉决策树的代码。图 6.1\
  \ 描绘了由列表 6-1 生成的训练树。\n\n### 列表 6-1: 构建决策树以预测葡萄酒质量—wineTree.py\n\n```\n__author__\
  \ = 'mike-bowles'\n\nimport numpy\nfrom sklearn import tree\nfrom sklearn.tree import\
  \ DecisionTreeRegressor\nfrom sklearn.tree import export_graphviz\nfrom sklearn.externals.six\
  \ import StringIO  \nfrom IPython.display import Image \nfrom math import sqrt\n\
  import matplotlib.pyplot as plot\nfrom Read_Fcns import list_read_wine\nimport pydotplus\n\
  \n#read data into iterable\nnames, xList, labels = list_read_wine()\n\nwineTree\
  \ = DecisionTreeRegressor(max_depth=3)\nwineTree.fit(xList, labels)\n\nf = StringIO()\n\
  export_graphviz(wineTree, out_file=f, filled=True, rounded=True,\n        special_characters=True)\n\
  graph = pydotplus.graph_from_dot_data(f.getvalue()) \nImage(graph.create_png())\n\
  #Note: You'll need to install pydotplus to draw this graph.\n# conda install -c\
  \ conda-forge pydotplus \n```\n\n![图 6.1: 用于确定葡萄酒质量的决策树](img/c06f001.png)\n\n图 6.1:\
  \ 用于确定葡萄酒质量的决策树\n\n图 6.1 展示了对葡萄酒质量数据进行训练后产生的一系列决策。树的图显示了许多框，这些框被称为节点。节点有两种类型：节点可以提出一个是/否问题，也可以是分配预测值的终点节点。在图\
  \ 6.1 中，终端节点位于底部。\n\n### 二叉决策树如何生成预测\n\n当一个观测值或行被传递到非终端节点时，它会回答节点的问题。如果回答为“是”，该行被传递到当前节点下方左方的叶子节点。如果回答为“否”，该行被传递到当前节点下方右方的叶子节点。该过程一直持续，直到该行到达终端（即叶子）节点，在那里将分配一个预测值。叶子节点分配的值是所有落在该叶节点中的训练观测值的平均值。\n\
  \n虽然在这棵树中，两个分支的第二个决策涉及 `X9`，但这两个决策可以是不同的属性。（例如，参见第三层。）\n\n查看顶部的节点，称为根节点。该节点提出了问题\
  \ `X10 <= 10.525`。在二叉决策树中，重要变量会被早期分裂（或在树的顶部附近分裂），因此决策树认为 `X10`（即酒精含量）是重要的。在这方面，它与第\
  \ 5 章“使用惩罚性线性方法构建预测模型”中的惩罚线性回归保持一致，后者也认为酒精含量是最重要的。\n\n图 6.1 中的树被认为深度为 3。树的深度定义为沿通过树的最长路径必须做出的决策次数。““树训练等于分裂点选择”节中的训练讨论将让你看到，没有理由通往终端节点的路径长度必须相同（如图\
  \ 6.1 中所示）。\n\n你现在已经了解训练后的树的样子，并且已经了如何使用训练后的树进行预测。现在你将看到树是如何被训练的。\n\n### 如何训练二叉决策树\n\
  \n查看树如何训练的最简单方法是看一个简单的示例。列表 6-2 展示了给定实数属性时预测实数标签的示例。此数据集是在代码中创建的（所谓的合成数据）。基本思想是单一属性\
  \ `x` 在 –0.5 到 +0.5 之间有 100 个等间距的值。标签向量 `y` 等于特征向量 `x`，并添加了一些随机噪声。\n\n\n\n\n```python\n\
  __author__ = 'mike-bowles'\n\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  from sklearn import tree\nfrom sklearn.tree import DecisionTreeRegressor\nfrom sklearn.externals.six\
  \ import StringIO\nfrom sklearn.tree import export_graphviz\nfrom IPython.display\
  \ import Image \nimport pydotplus\n\n#Build a simple data set with y = x + random\n\
  nPoints = 100\n\n#x values for plotting\nx = np.linspace(-0.5, 0.5, nPoints)\ntree_depth\
  \ = 2\n\n#y (labels) has random noise added to x-value\n#set seed\nnp.random.seed(1)\n\
  y = x + np.random.randn(nPoints) * 0.1\n\nplt.plot(x,y)\nplt.axis('tight')\nplt.xlabel('x')\
  \ \nplt.ylabel('y')\nplt.title('Labels (y) versus Feature (x)')\nplt.savefig('Labels_versus_attribute_visualization_ex.png',\
  \ dpi=500)\nplt.show()\n\nx_feat = x.reshape([-1,1])\nsimpleTree = DecisionTreeRegressor(max_depth=tree_depth)\n\
  simpleTree.fit(x_feat, y)\n\n#draw the tree -- this block needs to be run in its\
  \ own cell\nf = StringIO()\nexport_graphviz(simpleTree, out_file=f, filled=True,\
  \ rounded=True, \n         special_characters=True)\ngraph = pydotplus.graph_from_dot_data(f.getvalue())\
  \ \nImage(graph.create_png())\n\n#compare prediction from tree with true values\n\
  \nyHat = simpleTree.predict(x_feat)\n\nplt.figure()\nplt.plot(x, y, label='True\
  \ y')\nplt.plot(x, yHat, label='Tree Prediction ', linestyle='--')\nplt.legend(bbox_to_anchor=(1,0.2))\n\
  plt.axis('tight')\nplt.xlabel('x')\nplt.ylabel('Predicted and Actual Values')\n\
  plt.title('Comparison of Actual to Prediction - depth =\n  +str(tree_depth))\nplt.savefig('simpleTreeActuaVPrediction_'\
  \ + str(tree_depth) +'.png', \n                dpi=500)\nplt.show()\n\n#draw the\
  \ tree\nf = StringIO()\nexport_graphviz(simpleTree, out_file=f, filled=True, rounded=True,\
  \ \n      special_characters=True)\ngraph = pydotplus.graph_from_dot_data(f.getvalue())\
  \ \nImage(graph.create_png())\n\n\n#split point calculations - try every possible\
  \ split point to find the \n#best one\nsse = []\nxMin = []\nfor i in range(1, nPoints):\n\
  \    #divide y-array into points on left and right of split point\n    lh_array\
  \ = y[0:i]\n    rh_array = y[i:]\n  \n    #calculate averages on each side\n   \
  \ lhAvg = np.average(lh_array)\n    rhAvg = np.average(rh_array)\n    \n    #calculate\
  \ sum square error on left, right and total\n    lhSse = np.sum((lh_array - lhAvg)\
  \ * (lh_array - lhAvg))\n    rhSse = np.sum((rh_array - rhAvg) * (rh_array - rhAvg))\n\
  \    \n    #add sum of left and right to list of errors\n    sse.append(lhSse +\
  \ rhSse)\n  \nplt.plot(x[1:], sse)\nplt.xlabel('x Split Point Value')\nplt.ylabel('Sum\
  \ Squared Error')\nplt.title('Sum Squared Error vs Split Point Location')\nplt.savefig('Error_vs_split_pt_location.png',\
  \ dpi=500)\nplt.show()\n```\n\n图 6.2 展示了标签 `y` 与单个属性 `x` 的关系。正如你预期的那样，`y` 大致遵循 `x`\
  \ 但带有随机性。\n\n![图 6.2: 简单示例的标签与属性](img/c06f002.png)\n\n### 树训练等于划分选择\n\n`Listing\
  \ 6-2` 中的第一步是运行深度为 1 的 `scikit-learn` 回归树包。该过程的结果如图 6.3 所示。图 6.3 显示了深度为 1 树的框图。深度为\
  \ 1 的树也被称为 `stumps`（树桩）。根节点上的单一决策是将属性值与 -0.7 进行比较。这个数字被称为 `split point`（划分点），因为它将数据划分为两组。从决策节点发出的两个框表示\
  \ 100 个输入示例中有 43 个进入树的左侧分支，剩余的 57 个示例进入树的右侧分支。如果属性小于 `split point`，树的预测结果就是框图中所示的数值——大约为\
  \ -0.3。\n\n![图 6.3: 简单问题深度 1 树的框图](img/c06f003.png)\n\n### 划分选择如何影响预测\n\n查看已训练树的另一种方法是看它的预测值与标签真实值的比较。由于这个简单的合成问题只有一个属性，将训练树生成的预测值与实际值并在一起绘制的图表开始让我们了解这棵简单树是如何训练的。图\
  \ 6.4 所示的预测值遵循一个简单的配方。预测是属性的阶跃函数。阶跃发生在 `split point` 处。\n\n![图 6.4: 简单示例中预测值与真实值的对比](img/c06f004.png)\n\
  \n### 划分点算法\n\n指定这棵简单树只需要三个数量：`split point` 值以及进入两个可能组的赋值值。这些数量是在树训练期间完成的。以下是其工作原理：训练旨在最小化预测的平方误差。首先假设\
  \ `split point` 已确定。一旦确定了 `split point`，赋值值也就确定了。每个组的平均值是使均方误差最小的数值。现在只剩下如何确定 `split\
  \ point` 了。`Listing 6-2` 有一段小代码遍历了这一过程。该过程是将数据分为两组，对每个组进行平均值近似，然后计算得到的平方和误差。\n\n\
  图 6.5 显示了平方和误差随 `split point location` 的变化。训练决策树涉及穷举所有可能的划分点，以确定哪一个能使误差最小。正如你所看到的，在数据集的正中间有一个定义良好的最小值。你也可以看到由于引入了噪声而存在某些随机波动。你可能也会想象如果有更多数据，随机性将会消失。你将在本章后面的\
  \ bagging 章节中看到这一点的演示。\n\n![图 6.5: 所有可能的划分点位置产生的平方和误差](img/c06f005.png)\n\n### 多变量树训练——划分哪个属性？\n\
  \n如果问题有多个属性呢？那么算法会检查所有属性的所有可能的划分点，以查看哪个属性的哪个划分提供了提供了平方和误差，以及哪些属性提供了全局最小值。\n\n这种划分点计算是训练决策树时消耗所有计算周期的地方——推此类推，这也是训练树森林时消耗的地方。如果被划分的属性没有重复值，那么对于每个数据点（减\
  \ 1）都需要检查一个划分点。\n\n\n\n\n随着数据集的扩大，分裂点计算的数量与数据集的大小成正比增长。被检查的分裂点之间的距离也可能变得极其接近。设计用于极大型数据集上运行的算法允许分裂点检查比数据的原始粒度粗糙得多。这种方法在《PLANET：基于\
  \ MapReduce 的大规模并行树集成学习》一文中得到了阐述，该文概述了 Google 工程师在大数据集上构建决策树算法所采用的方法。正如论文提到的，他们希望获得决策树算法，以便实现梯度提升（你将在本章节稍后部分学习的集成算法之一）。\n\
  \n### 通过递归分裂增加树的深度\n\n列表 6-2 显示了当树深度从 1 增加到 2 时，预测曲线的变化。生成的预测曲线如图 6.6 所示，树的框图如图\
  \ 6.7 所示。预测曲线现在不再有单一步骤，而是有了三个步骤。第二组分裂点是以与第一组相同的方式确定的。树中的每个节点处理由上方分裂决定的点子集。每个节点的分裂点的确定是为了使其下方两个节点的均平方误差和最小化。图\
  \ 6.6 中的曲线用更精细的阶梯函数近似了实际曲线。更深的树会导致更精细的步骤以及对训练数据更高的保真度。这会无限持续吗？\n\n![图 6.6: 使用深度\
  \ 2 树的预测](img/c06f006.png)\n\n**图 6.6**: 使用深度 2 树的预测\n\n![图 6.7: 深度 2 树的框图](img/c06f007.png)\n\
  \n**图 6.7**: 深度 2 树的框图\n\n随着分裂继续，最深节点中的示例数量会减少。这可能导致在达到指定深度之前分裂就终止。如果一个节点中只有一个示例，分裂显然无法继续。树训练算法通常有一个参数，允许你控制将多小的样本量进行分裂。节点中的小样本会导致最终预测产生高方差。\n\
  \n### 二叉树的过拟合\n\n前一节展示了如何训练任意深度的二叉决策树。二叉树会过拟合吗？本节讨论了如何衡量和调节二叉树的过拟合。二叉树过拟合的机制与你在第\
  \ 4 章“带惩罚的线性回归”以及第 5 章中看到的不同，但你将在症状和衡量过拟合的方法上看到一些相似之处。你会发现二叉树具有某些参数（例如树的深度和最小叶子节点大小），这些参数可以用来调节模型复杂性，这与你在第\
  \ 4 章和第 5 章中看到的过程相似。\n\n#### 使用二叉树衡量过拟合\n\n图 6.8 显示了树深度增加到 6 时发生的情况。在图 6.8 中，很难看出真实值与预测值之间的差异。预测几乎遵循了每一个转折。这开始表明模型正在对数据过拟合。数据生成的方式表明，最好的预测应该是预测值等于属性值。添加到属性上的噪声是不可预测的，然而预测却遵循了标签偏离属性的噪声驱动偏差。合成数据提供了已知正确答案的奢侈条件。\n\
  \n观察二叉树过拟合的另一种方法是考虑树中终止节点数量与可用数据量之间的比较。生成图 6.8 中所示预测的树深度为 6。这意味着它有 64 个终止节点（2⁶）。数据集中有\
  \ 100 个点。这意味着许多点是终止节点的唯一占有者，因此它们的预测值与观测值完全匹配。难怪预测图表匹配了由于噪声引起的波动。\n\n![图 6.8: 使用深度\
  \ 6 树的预测](img/c06f008.png)\n\n**图 6.8**: 使用深度 6 树的预测\n\n#### 平衡二叉树复杂度以获得最佳性能\n\n\
  在实际问题中，可以通过交叉验证来控制过拟合。列表 6-3 显示了针对这个简单问题在不同深度树上运行的 10 折交叉验证。代码列表显示了两个循环。外层循环定义内部交叉验证循环的树深度。内部循环划分数据并进行\
  \ 10 次通过以计算样本外误差。每个深度的均平方误差（MSE）结果绘制在图 6.9 中。![图 6.9: 样本外误差与树深度](img/c06f009.png)\n\
  \n**图 6.9**: 样本外误差与树深度\n\n\n\n\n回想第 3 章，“预测模型构建：平衡性能、复杂性与大数据”，最优模型复杂度是数据集大小的函数。这个合成数据问题提供了一个展示其如何运作的机会。图\
  \ 6.10 显示了当数据点增加到 1000 个时，最优模型复杂度和性能是如何变化的。\n\n![图 6.10：1000 个数据点的样本外 MSE 与树深的关系](img/c06f010.png)\n\
  \n`图 6.10`：1000 个数据点的样本外 MSE 与树深的关系\n\n你可以通过将代码列表 6-3 中的变量 `nPoints` 修改为 `1000`\
  \ 来亲自运行该图表。增加更多数据会产生两个结果：首先，最佳树深从 3 增加到 4，增加的数据支持更复杂的模型；其次，MSE 略有下降，增加的深度允许在真实模型的阶梯式近似中进行更精细的划分。模型保真度的提升正是人们对大型数据集感到兴奋的原因。\n\
  \n### 针对分类和类别特征的修改\n\n为了让你对决策树的训练过程有一个完整的理解，我们还有几个细节需要讨论。其一是：这在分类问题中如何工作？之前用于判断划分的标准——MSE——仅适用于回归问题。正如你在书的其他地方看到的，分类问题的评价指标与回归问题不同。分类问题可以使用几种评价指标来代替\
  \ MSE 来判断划分。你已经熟悉的其中之一是分类错误。另外两个常用指标是基尼不纯度（Gini impurity）和信息增。关于这些的更多信息，请参见 `http://en.wikipedia.org/wiki/Decision_tree_learning#Gini_impurity`。这另外两个指标的属性与分类错误略有不同，但在概念上并没有区别。\n\
  \n最后一个细节是如何在类别（而非数值）属性上训练树。树中的（非叶子）节点提出了一个是/否问题。对于数值型变量，问题的形式是给定属性是否小于某个参数。将类别变量划分为两个子集，涉及到尝试将类别分为两个集合的所有可能组合。如果类别是\
  \ A、B 和 C，可能的划分包括：A 在第一组而 B 和 C 在第二组，B 在第一组而 A 和 C 在第二组，依此类推。某些数学结果在特定情况下可以简化这一过程。\n\
  \n本节提供了关于二元决策树的一些背景知识。二元决策树本身是一种正当的预测工具并值得研究，但在此在此概述它们的主要目的是为集成方法提供背景，集成方法包含了大量的二元决策树。你会发现，当使用单棵树时出现的一些问题（需要调整的多个参数、结构不稳定以及大树的过拟合）在将成百上千棵这样的树结合时会退到背景。这就是开发集成方法的意图，它们非常稳健、易于训练且准确。接下来的章节将逐一讨论这三种主要方法。\n\
  \n## 自助聚合：“Bagging”\n\n自助聚合由 Leo Breiman 开发。该方法从选择一个基学习器开始。此处将使用二元决策树作为基学习器来实现。在学习该方法的过程中，你会看到其他机器学习算法也可以作为基学习器。二元决策树是一个逻辑选择，因为它们自然地对具有复杂决策边界的问题建模，但二元决策树可能会表现出过方差。通过结合许多基于树的模型可以克服方差。\n\
  \n### Bagging 算法是如何工作的？\n\n自助聚合算法使用了所谓的*自助样本*（bootstrap sample）。自助样本通常用于从中等规模的数据集中生成样本统计量。（非参数化）自助样本是从数据集中有放回地随机选取若干元素（也就是说，自助样本可以包含原始数据某行的多个副本）。自助聚合从训练数据集中提取多个自助样本，然后在每个样本上训练一个基学习器。在回归问题中，生成的模型取平均值。对于分类问题，模型可以取平均值，也可以根据不同类别的百分比来生成概率。代码列表\
  \ 6-4：自助聚合算法—simpleBagging.py\n\n\n\n\n\n```python\n__author__ = 'mike-bowles'\n\
  \nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import tree\n\
  from sklearn.tree import DecisionTreeRegressor\nfrom math import floor\nfrom numpy.random\
  \ import choice\n\n### 构建一个 y = x + random 的简单数据集\nnPoints = 1000\n\n# 用于绘图的 x 值\n\
  x = np.linspace(-0.5, 0.5, nPoints)\nx_feat = x.reshape([-1,1])\n\n# y (标签) 在 x\
  \ 值的基础上添加了随机噪声\n### 设置种子\nnp.random.seed(1)\ny = x + np.random.randn(nPoints) *\
  \ 0.1\n\n# 取样本的 30% 作为固定测试集\nindices = list(range(nPoints))\nnSample = int(nPoints\
  \ * 0.30)\nidxTest = choice(indices, nSample, replace=False)\nidxTest.sort()\nidxTrain\
  \ = [idx for idx in indices if not(idx in idxTest)]\n\n# 定义测试集和训练属性集以及标签集\nxTrain\
  \ = x_feat[idxTrain]\nxTest = x_feat[idxTest]\nyTrain = y[idxTrain]\nyTest = y[idxTest]\n\
  idx_Train = list(range(len(xTrain)))\n\n# 在训练数据的随机子集上训练一系列模型\n# 将模型收集在列表中，并随着列表增长检查组合模型的误差\n\
  \n# 生成的最大模型数量\nnumTreesMax = 20\n\n# 树的深度 - 通常处于高端\ntreeDepth = 1\n\n### 初始化用于存储模型的列表\n\
  modelList = []\npredList = []\n\n### 随机袋装法（stochastic bagging）抽取的样本数\nnBagSamples\
  \ = int(len(xTrain) * 0.5)\n\nfor iTrees in range(numTreesMax):\n    # 取袋装样本并定义训练集\n\
  \    idxBag = choice(idx_Train, nBagSamples, replace=True)\n    xTrainBag = xTrain[idxBag]\n\
  \    yTrainBag = yTrain[idxBag]\n\n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n\
  \    modelList[-1].fit(xTrainBag, yTrainBag)\n\n    # 使用最新模型进行预测并添加到预测列表中\n    latestPrediction\
  \ = modelList[-1].predict(xTest)\n    predList.append(latestPrediction)\n\n### 从前\
  \ \"n\" 个模型构建累积预测\nmse = []\nallPredictions = []\n\nfor iModels in range(len(modelList)):\n\
  \n    prediction_i = np.zeros_like(predList[0]) \n    for i in range(iModels): \n\
  \        prediction_i += predList[i] / float(iModels + 1)\n\n    allPredictions.append(prediction_i)\n\
  \    errors = yTest - prediction_i\n    mse.append(np.average(errors * errors))\n\
  \nnModels = [i + 1 for i in range(numTreesMax)]\n\nplt.plot(nModels,mse)\nplt.axis('tight')\n\
  plt.xlabel('Ensemble 中的模型数量')\nplt.ylabel('均方误差')\nplt.ylim((0.0, max(mse)))\nplt.title('MSE\
  \ vs Number of Trees in Ensemble - Depth = ' +str(treeDepth))\nplt.savefig('bagging_mse_vs_nTrees_'\
  \ + str(treeDepth) + '.png', dpi=500)\nplt.show()\n\nplotList = [0, 9, 19]\nfor\
  \ iPlot in plotList:\n    plt.plot(xTest, allPredictions[iPlot], label=str(iPlot))\n\
  plt.plot(xTest, yTest, linestyle=\"--\")\nplt.legend()\n```\n\n\n\n\n\nListing 6-5\
  \ 展示了`bagging`算法在预测葡萄酒质量任务中的应用。葡萄酒示例展示了某些与你在处理合成数据时看到的相同原理。这些原理在图 6.15 至图 6.17 中最为清晰，这些图是通过使用不同的参数设置运行\
  \ Listing 6-4 得到的。\n\n### Listing 6-5: 使用 Bagging 预测葡萄酒质量—wineBagging.py\n\n```python\n\
  __author__ = 'mike-bowles'\n\nimport numpy as np\nfrom sklearn import tree\nfrom\
  \ sklearn.tree import DecisionTreeRegressor\nfrom numpy.random import choice\nfrom\
  \ math import sqrt\nimport matplotlib.pyplot as plt\n\nfrom Read_Fcns import list_read_wine\n\
  \n#read data into iterable\nnames, xList, labels = list_read_wine()\nxArray = np.array(xList)\n\
  yArray = np.array(labels)\n\nnrows = len(xList)\nncols = len(xList[0])\n\n#take\
  \ fixed test set 30% of sample\nindices = list(range(nrows))\nnSample = int(nrows\
  \ * 0.30)\nidxTest = choice(indices, nSample, replace=False)\nidxTrain = [idx for\
  \ idx in indices if not(idx in idxTest)]\n\n#Define test and training attribute\
  \ and label sets\nxTrain = xArray[idxTrain]\nxTest = xArray[idxTest]\nyTrain = yArray[idxTrain]\n\
  yTest = yArray[idxTest]\nidx_Train = list(range(len(xTrain)))\n\n#train a series\
  \ of models on random subsets of the training data\n#collect models in a list and\
  \ check error of composite as list grows\n\n#maximum number of models to generate\n\
  numTreesMax = 100\n\n#tree depth - typically at the high end\ntreeDepth = 12\n\n\
  #initialize a list to hold models\nmodelList = []\npredList = []\n\n#number of samples\
  \ to draw for stochastic bagging\nnBagSamples = int(len(xTrain) * 0.5)\n\nfor iTrees\
  \ in range(numTreesMax):\n    idxBag = choice(range(len(xTrain)), nBagSamples, replace=True)\n\
  \    xTrainBag = xTrain[idxBag]\n    yTrainBag = yTrain[idxBag]\n\n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n\
  \    modelList[-1].fit(xTrainBag, yTrainBag)\n\n    #make prediction with latest\
  \ model and add to list of predictions\n    latestPrediction = modelList[-1].predict(xTest)\n\
  \    predList.append(latestPrediction)\n\n#build cumulative prediction from first\
  \ \"n\" models\n#build cumulative prediction from first \"n\" models\nrmse = []\n\
  allPredictions = []\n\nfor iModels in range(len(modelList)):\n\n    prediction_i\
  \ = np.zeros_like(predList[0]) \n    for i in range(iModels): \n        prediction_i\
  \ += predList[i] / float(iModels + 1)\n\n    allPredictions.append(prediction_i)\n\
  \    errors = yTest - prediction_i\n    rmse.append(sqrt(np.average(errors * errors)))\n\
  \n\nnModels = [i + 1 for i in range(numTreesMax)]\n\nplt.plot(nModels,rmse)\nplt.axis('tight')\n\
  plt.xlabel('Number of Tree Models in Ensemble')\nplt.ylabel('Root Mean Squared Error')\n\
  plt.ylim((0.0, max(rmse)))\nplt.title('RMS Error vs Ensemble Size - Depth = ' +\
  \ str(treeDepth))\nplt.savefig('bagging_' + str(treeDepth) + '.png', dpi=500)\n\
  plt.show()\n\nprint('With Tree Depth = ', treeDepth)\nprint('With Number of Trees\
  \ = ', numTreesMax)\nprint('Minimum RMSE = ', min(rmse))\n\nPrinted Output: \n\n\
  With Tree Depth = 1\nWith Number of Trees = 30\nMinimum RMSE = 0.7440534935904853\n\
  \nWith Tree Depth = 5\nWith Number of Trees = 30\nMinimum RMSE = 0.6540549863025144\n\
  \nWith Tree Depth = 12\nWith Number of Trees = 100\nMinimum RMSE = 0.5727542363996668\
  \ \n```\n\n![Figure 6.15: Predicting wine quality with Bagging on depth 1 trees](img/c06f015.png)\n\
  \n图 6.15: 使用 Bagging 预测葡萄酒质量\n\n\n\n![Figure 6.16: Predicting wine quality with\
  \ Bagging on depth 5 trees](img/c06f016.png)\n\n图 6.16: 使用 Bagging 预测葡萄酒质量\n\n\n\
  \n![Figure 6.17: Predicting wine quality with Bagging on depth 12 trees](img/c06f017.png)\n\
  \n图 6.17: 使用 Bagging 预测葡萄酒质量\n\n### Bagging 总结\n\n现在你已经看到了集成学习方法的第一个示例。Bagging 清晰地展示了集成方法中常见的双层结构。严格来说，Bagging\
  \ 是一种高层算法，它定义了一系列由基学习器解决的问题，并对它们的预测取平均。构成 Bagging 的各个问题是通过对原始训练数据进行随机自助抽样得到的。Bagging\
  \ 降低了单个二叉树的方差。\n\nBagging 是集成方法的很好的入门，因为它相对容易理解，而且相对容易演示其减少方差的特性。接下来的两个算法是梯度提升和随机森林。它们在构建集成方面的方法不同，并且相比\
  \ Bagging 具有某些优势。我认识的大多数从业人员通常首先使用梯度提升或随机森林，并不经常使用 Bagging。\n\n\n\n\n梯度提升（Gradient\
  \ boosting）是由斯坦福教授 Jerome Friedman 开发的，他还开发了用于解决 ElasticNet 问题的坐标下降算法（见第 4 章和第 5\
  \ 章）。梯度提升通过在不同的标签上训练集成中的每棵树，然后组合这些树来构建一个基于树的集成模型。对于目标是最小化均方误差（MSE）的回归问题，每一棵树都是基于之前树集合的剩余误差进行训练的。关于该算法的推导，请参见本章末尾的“参考文献”部分。观察梯度提升工作的最简单方法是查看实现该算法的代码。\n\
  \n### 梯度提升算法的基本原理\n\nListing 6-6 详细介绍了本章之前介绍的合成问题的梯度提升算法。代码的前部分使用了之前的过程来构建合成数据集。\n\
  \n#### Listing 6-6: 简单问题的梯度提升——simpleGBM.py\n\n```python\n__author__ = 'mike-bowles'\n\
  \nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import tree\n\
  from sklearn.tree import DecisionTreeRegressor\nfrom math import floor\nfrom numpy.random\
  \ import choice\n\n#构建一个 y = x + random 的简单数据集\nnPoints = 1000\n\n#用于绘图的 x 值\nx\
  \ = np.linspace(-0.5, 0.5, nPoints)\nx_feat = x.reshape([-1,1])\n\n#y (标签) 在 x 值上添加了随机噪声\n\
  #设置种子\nnp.random.seed(1)\ny = x + np.random.randn(nPoints) * 0.1\n\n#取样本的 30%作为固定测试集\n\
  indices = list(range(nPoints))\nnSample = int(nPoints * 0.30)\nidxTest = choice(indices,\
  \ nSample, replace=False)\nidxTest.sort()\nidxTrain = [idx for idx in indices if\
  \ not(idx in idxTest)]\n\n# 定义测试和训练的属性和标签集\nxTrain = x_feat[idxTrain]\nxTest = x_feat[idxTest]\n\
  yTrain = y[idxTrain]\nyTest = y[idxTest]\nidx_Train = list(range(len(xTrain)))\n\
  \n# 在训练数据的随机子集上训练一系列模型\n# 将模型收集在列表中，并随着列表增长检查复合模型的误差\n\n# 生成模型的最大数量\nnumTreesMax\
  \ = 30\n\n# 树深度 - 通常在较高水平\ntreeDepth = 5\n\n# 初始化一个存储模型的列表\nmodelList = []\npredList\
  \ = []\neps = 0.3\n\n# 初始化残差为标签 y\nresiduals = yTrain\n\nfor iTrees in range(numTreesMax):\n\
  \n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n    modelList[-1].fit(xTrain,\
  \ residuals)\n\n    # 使用最新模型进行预测并添加到预测列表中\n    latestInSamplePrediction = modelList[-1].predict(xTrain)\n\
  \n    # 使用新预测更新残差\n    residuals -=  eps * latestInSamplePrediction\n\n    latestOutSamplePrediction\
  \ = modelList[-1].predict(xTest)\n    predList.append(latestOutSamplePrediction)\n\
  \n\n# 从前“n”个模型构建累积预测\nmse = []\nallPredictions = []\nfor iModels in range(len(modelList)):\n\
  \n    # 将前“iModels”个预测并乘以 eps\n    prediction_i = np.zeros_like(predList[0]) \n\
  \    for i in range(iModels): \n        prediction_i += predList[i] * eps\n\n  \
  \  allPredictions.append(prediction_i)\n    errors = yTest - prediction_i\n    mse.append(np.average(errors\
  \ * errors))\n\nnModels = [i + 1 for i in range(len(modelList))]\n\nplt.plot(nModels,mse)\n\
  plt.axis('tight')\nplt.xlabel('Number of Models in Ensemble')\nplt.ylabel('Mean\
  \ Squared Error')\nplt.title('Error vs Ensemble Size - Depth = ' + str(treeDepth))\n\
  plt.savefig('simple_gbm_error_vs_trees_' + str(treeDepth) + str(eps) +\n'.png',\
  \ dpi=500)\nplt.ylim((0.0, max(mse)))\nplt.show()\n\nplotList = [0, 3, 29]\nlineType\
  \ = [':', '-.', '--']\nplt.figure()\nfor i in range(len(plotList)):\n    iPlot =\
  \ plotList[i]\n    textLegend = 'Prediction with ' + str(iPlot + 1) + ' Trees'\n\
  \    plt.plot(x, allPredictions[iPlot], label=textLegend, linestyle=lineType[iPlot])\
  \ # 为了清晰此处修复了逻辑\nplt.legend()\n```\n\n#### *梯度提升的参数设置*\n\n下一个看起来不同的地方是变量 `residuals`\
  \ 的定义。*residuals*（残差）一词通常用于表示预测误差（即观测值减去预测值）。梯度提升算法将对其预测进行一系列细化。在过程开始时，梯度提升将预测初始化为空（或零），使得残差等于标签。\n\
  \n#### *梯度提升如何向预测模型迭代*\n\n`iTrees` 循环首先使用属性训练一树，但是针对残差进行训练。只有在第一轮中使用原始标签作为目标。随后的迭代获取训练生成的预测值，并在训练之前从残差中减去它们的\
  \ `eps` 倍。正如提到的，残差的相减等同于梯度下降，而乘以步长控制参数 `eps` 的原因是为了确保迭代收敛。\n\n### 从梯度提升中获得最佳性能\n\
  \n第一对图（见图 6.18 和图 6.19）显示了 MSE 与树的数量的关系，以及 `eps = 0.1` 且 `treeDepth = 1` 时的预测函数图。图\
  \ 6.18 显示误差平滑下降，在训练 30 棵树后达到约 0.014，且 MSE 正在下降，表明通过训练更多树可以进一步降低误差。\n\n![图 6.18:\
  \ 合成问题的 MSE 与树的数量的关系——eps = 0.1, treeDepth = 1](img/c06f018.png)\n\n\n\n\n图 6.19\
  \ 显示了三个梯度提升模型的预测值与属性值的对比：一个只训练一棵树的模型，一个训练了 15 棵树，以及一个训练了 30 棵树。包含单个树的模型看起来像是你在关于决策树引言部分看到的树模型的缩减版本。正如所描述的，它确实是一个基于标签训练的深度为\
  \ 1 的单树，然后乘以 0.1——即 `eps` 的值。基于 10 棵树构建的模型变得更有趣了。该模型对正确答案进行了很好的近似——图上一条 45 度的直线。包含\
  \ 10 棵树的模型正确地预测了大约一半的范围，并将左右两侧预测为常数。包含 30 棵树的模型进一步趋于良好的近似，直直到数据的边缘。这与装袋法（bagging）使用决策桩（stumps）时表现出的行为有所不同。\n\
  \n![图 6.19: 梯度提升预测值与属性值问题——eps = 0.1, treeDepth = 1](img/c06f019.png)\n\n图 6.19:\
  \ 梯度提升预测值与属性值问题——eps = 0.1, treeDepth = 1\n\n对于许多相互差异不大的问题，装袋法无法克服使用浅层树构建预测时固有的偏差误差。梯度提升的起始方式与它们相同，但当它开始减少数据中间部分的误差时，它开始更多地关注出错的区域。这使得分裂点移动到存在错误的区域。这个过程导致了良好的近似，而不需要增加树深来实现。\n\
  \n当控制训练的参数发生变化时会发生什么？图 6.20 和 6.21 显示了如果树的深度为 5，图像将如何变化。图 6.20 中的 MSE 图显示，随着树数量的增加，MSE\
  \ 呈现出类似的平滑下降。在训练了 30 棵深度为 5 的树后，MSE 值非常接近完美（0.01）——比深度为 1 的树要低。图中没有显示训练时间。树中的每一层训练时间大约相同。在每一层中，必须对所有可能的分裂点进行\
  \ MSE 比较。深度 5 的树所需的时间是五 棵深度 1 树的五倍。公平的比较应该是看深度 1 的树在训练 150 棵后达到的误差，对比深度 5 的树在训练\
  \ 30 棵后的误差。\n\n![图 6.20: 合成问题的 MSE 与树数量的关系——eps = 0.1, treeDepth = 5](img/c06f020.png)\n\
  \n图 6.20: 合成问题的 MSE 与树数量的关系——eps = 0.1, treeDepth = 5\n\n![图 6.21: 梯度提升预测值与属性值问题——eps\
  \ = 0.1, treeDepth = 5](img/c06f021.png)\n\n图 6.21: 梯度提升预测值与属性值问题——eps = 0.1, treeDepth\
  \ = 5\n\n图 6.21 清楚地反映了使用了更深的树来构建梯度提升集成模型。即使是基于单棵树的首次预测在整个属性范围内也显示出了一些结构。基于 15 棵树和\
  \ 30 棵树的模型在数据边缘仍然表现出较高水平的误差。\n\n图 6.22 和 6.23 显示了当步长参数 `eps` 增加时会发生什么。图 6.22 显示了步长参数过大（此处命名为\
  \ `eps`）的特征行为。MSE 与树数量的图急剧下降，然后向右侧再次增加。最小值在图的左侧，靠近三分之一处。你需要调整 `eps`，使得最小值位于图的右边缘或靠近右边缘。这通常会提供更好的性能。\n\
  \n作为属性函数的预测图像显示比使用 `eps=0.1` 的两个版本更多地偏离正确 45% 线的尖峰状波动。总体而言，深度为 1 的树的版本表现最好。看起来训练更多的树可能会提高深度\
  \ 1 模型边缘的性能，并为梯度提升带来最佳答案。\n\n![图 6.22: 合成问题的 MSE 与树数量的关系——eps = 0.3, treeDepth =\
  \ 5](img/c06f022.png)\n\n图 6.22: 合成问题的 MSE 与树数量的关系——eps = 0.3, treeDepth = 5\n\n\
  ![图 6.23: 梯度提升预测值与属性值问题——eps = 0.3, treeDepth = 5](img/c06f023.png)\n\n### 多变量问题的梯度提升\n\
  \n列表 6-7 显示了梯度提升在预测葡萄酒质量任务中的应用。除了使用葡萄酒数据集外，列表 6-6](#c06.xhtml#c06-fea-0006)中的代码与在简单数据集上使用的代码非常相似。\n\
  \n\n\n\n\n代码中显示的参数选择针对 30 棵深度为 5 的树以及 `eps=0.1`。这组参数产生的 MSE 约为 0.4。这比 bagging 在相同问题上获得的性能差了约\
  \ 10%。尝试调整树的数量、`eps`（步长参数）以及树的深度，看看是否可以获得更好的结果。\n\n`MSE` 随树的数量变化的曲线在右边缘看起来相当平坦（请参见\
  \ 图 6.24）。通过在集成中添加更多树，可能还可以获得一些性能。挤出更多性能的其他可能方法是调整树的深度或步长参数。\n\n![图 6.24：葡萄酒质量梯度提升模型的\
  \ MSE 与树的数量之间的关系图](img/c06f024.png)\n\n图 6.24: 葡萄酒质量梯度提升模型的 MSE 与树的数量之间的关系图\n\n\
  ### 梯度提升总结\n\n本节展示了梯度提升是如何工作的，并演示了如何控制其行为以获得最佳性能。本节讨论了改变步长、树深度和树数量的影响。你已经看到梯度提升是如何避免\
  \ bagging 在浅树上经历的偏差错误的。bagging 和 boosting 在原理上的基本区别在于，boosting 会持续监控其累积误差并利用该残差进行后续训练。这种差异解释了为什么当问题的各种属性之间存在显著交互时，梯度提升只需要树深度。\n\
  \n## 随机森林\n\n随机森林算法由故伯克利教授 Leo Breiman 和 Adele Cutler 开发。随机森林通过在数据的子集上训练模型来生成其模型序列。这些子集是从完整的训练集中随机抽取的。选择子集的一种方法是以与\
  \ Breiman 的自助聚合算法相同的方式对行进行有回随机采样。另一个随机元素是，随机森林集成中单个树的训练集并不包含所有属性，而是选取了属性的随机子集。列表\
  \ 6-8 使用 Python 的 `DecisionTreeRegression` 模拟随机森林。\n\n#### 列表 6-8: 带有随机属性选择的 Bagging—wineRF.py\n\
  \n```python\n__author__ = 'mike-bowles'\n\nimport numpy as np\nfrom sklearn import\
  \ tree\nfrom sklearn.tree import DecisionTreeRegressor\nfrom numpy.random import\
  \ choice\nfrom math import sqrt\nimport matplotlib.pyplot as plt\nfrom Read_Fcns\
  \ import list_read_wine\n\n#将数据读入迭代器\nnames, xList, labels = list_read_wine()\n\
  xArray = np.array(xList)\nyArray = np.array(labels)\n\nnrows = len(xList)\nncols\
  \ = len(xList[0])\n\n#取 30%的样本作为固定测试集\nindices = list(range(nrows))\nnSample = int(nrows\
  \ * 0.30)\nidxTest = choice(indices, nSample, replace=False)\nidxTrain = [idx for\
  \ idx in indices if not(idx in idxTest)]\n\n#定义测试和训练属性及标签集\nxTrain = xArray[idxTrain]\n\
  xTest = xArray[idxTest]\nyTrain = yArray[idxTrain]\nyTest = yArray[idxTest]\nidx_Train\
  \ = list(range(len(xTrain)))\n\n#在训练数据的随机子集上训练一系列模型\n#将模型收集在列表中，并随着列表增长检查复合模型的误差\n\
  \n#生成的模型最大数量\nnumTreesMax = 30\n\n#树深度 - 通常在高位\ntreeDepth = 12\n\n#选择每个模型将使用多少个属性\n\
  # 作者建议回归问题使用 1/3\nnAttr = 4\n\n#初始化用于存储模型的列表\nmodelList = []\nindexList = []\npredList\
  \ = []\nn_bag = int(0.5)\n```\n*(注：由于原文代码块逻辑不完整且截断，此处已根据要求保留了核心结构并对变量进行了标记处理)*\n\
  \n### 随机森林的性能驱动因素\n\n\n\n\n\n图 6.25 到 6.27 显示了添加随机属性选择如何影响 `MSE` 随集成中树的数量变化的曲线。图\
  \ 6.25 显示了当单棵树为深度 1 的树时的结果。图片与 bagging 非常相似，因为集成模型对性能的提升并不大。深度 1 的树主要引起偏差误差，而不是方差误差。偏差无法通过平均来消除。\n\
  \n![图 6.25: bagging + 随机属性选择的 MSE 随树数量的变化——深度 1 树](img/c06f025.png)\n\n`图 6.25`#c06.xhtml#R_c06-fig-0025):\
  \ bagging + 随机属性选择的 MSE 随树数量的变化——深度 1 树\n\n![图 6.26: bagging + 随机属性选择的 MSE 随树数量的变化——深度\
  \ 5 树\n\n`图 6.26`#c06.xhtml#R_c06-fig-0026): bagging + 随机属性选择的 MSE 随树数量的变化——深度 5\
  \ 树\n\n![图 6.27: bagging + 随机属性选择的 MSE 随树数量的变化——深度 12 树\n\n`图 6.27`#c06.xhtml#R_c06-fig-0027):\
  \ bagging + 随机属性选择的 MSE 随树数量的变化——深度 12 树\n\n[图 6.26 显示了使用深度 5 树的 `MSE` 曲线。现在，bagging\
  \ 加随机属性选择带来的方差降低开始显示出一些性能。这种组合带来的提升与所演示的其他方法相似。\n\n图 6.27 显示，使用深度 12 的树可以获得略多的性能。\n\
  \n### 随机森林总结\n\n随机森林是 bagging 和对二叉树基学习器进行随机属性选择修改的结合。这些差异看起来并不显著，但它们使随机森林具有不同于 bagging\
  \ 和梯度提升的性能特征。某些结果表明，随机森林在处理宽稀疏属性空间（如文本挖掘问题中出现的情况）方面具有优势。随机森林比梯度提升稍微更容易并行化，因为各个基学习器可以独立地进行训练，而在梯度提升中，每个基学习器都需要之前学习器的结果。\n\
  \n此类的差异意味着，如果你需要尽可能从数据中榨取性能，你可能在使用梯度提升的同时也尝试随机森林。\n\n## 总结\n\n本章为你提供了基础集成算法的背景知识。它解释了集成方法由两种算法的层次结构组成。集成方法训练数百或数千个被称为`base\
  \ learners`的低级算法。高级算法控制`base learners`的训练，以确保它们的模型结果彼此相互独立，从而通过组合它们来减少组合的方差。对于 bagging，高级算法是获取训练集的自助样本，并在这些样本上训练`base\
  \ learners`。对于梯度提升，高级算法在每个阶段获取输入数据的一个样本并在其上训练一个`base learner`。在梯度提升中，训练每个`base learner`的目标是之前所有`base\
  \ learners`累加产生的误差。随机森林是作为高级算法的 bagging 与修改过的二叉决策树`base learners`的结合。随机森林的`base\
  \ learners`是二叉树，在每个节点处，分裂点的决策限制为可用属性的随机样本，而不是在每次分裂时考虑所有属性。Python 中用于执行梯度提升的包允许你在梯度提升中使用随机森林`base\
  \ learners`。你将在下一章“用 Python 构建集成方法”中看到这种用法。\n\n本章为每个高级算法编写，并展示了随机森林`base learners`的副本。编写这些代码的目的是让你理解每种算法运行的机制。这背后的思想是你将更好地理解这些算法对应的\
  \ Python 包的选项、输入变量、名义初始值等。下一章将使用可用的 Python 包对你看到的通过惩罚线性回归解决的一些问题生成解决方案。\n\n## 参考文献\n\
