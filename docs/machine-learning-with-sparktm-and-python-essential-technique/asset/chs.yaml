  \ 3 章证明了预测模型需要对其复杂性进行调优，以针对给定的问题复杂度和数据集大小获得最佳性能。第 3 章还展示了在线性回归中引入调优参数的方法。本章在此背景的基础上，引入了几个最小化问题，这些问题在最小二法回归的误差惩罚基础上添加了可调的系数惩罚。正如所示，这种对线性系数大小的可调惩罚会导致系数在不同程度上受到抑制，从而增加了复杂性调整。你已经了解了如何通过使用样本外数据上的误差来调整结果模型的复杂性，以实现最佳性能。\n\
