  \n**图 2.10**: 来自鲍数据集中实值属性的箱线图\n\nListing 2-11 中的代码最后部分在绘制箱线图之前对所有数据列进行了归一化。在这种情况下，`Normalization`\
  \ 指对每列进行中心化和缩放，使得属性 1 的一个单位与属性 2 的单位具有相同的含义。数据科学中的许多算法和操作都需要这种归一化。例如，K-means 聚类根据数据行之间的向量距离建立聚类。距离是通过从一个点减去另一个点并平方来衡量的。如果单位不同，数值距离也不同。如果以英里计算，到商店的距离可能是\
  \ 1；如果以英尺计算，则是 5,280。Listing 2-11 中所示的归一化调整了变量，使得它们的平均值为 0，标准差为 1。这是一个非常常见的归一化。归一化的计算使用了\
  \ `summary()` 函数生成的数字。结果绘制在图 2.11 中。\n\n![图 2.11: 归一化鲍属性的箱线图](img/c02f011.png)\n\
  \n**图 2.11**: 归一化鲍属性的箱线图\n\n### 回归的平行坐标\n\n图 2.9 中的箱线图是一种比打印数据识别离群值更快、更具视觉化的方法，但环纹属性（最右侧的箱线图）的比例导致其他属性被压缩（导致难以查看）。处理这种问题的方法之一是消除较大比例的属性。其结果如图\
  \ 2.10 所示。但这种方法并不理想，因为它不能自动化，扩展性也不好。\n\nListing 2-11 中的代码最后部分在绘制箱线图之前对所有数据列进行了归一化。在这种情况下，`Normalization`\
  \ 指对每列进行中心化和缩放，使得属性 1 的一个单位与属性 2 的单位具有相同的含义。数据科学中的许多算法和操作都需要这种归一化。例如，K-means 聚类根据数据行之间的向量距离建立聚类。距离是通过从一个点减去另一个点并平方来衡量的。如果单位不同，数值距离也不同。如果以英里计算，到商店的距离可能是\
  \ 1；如果以英尺计算，则是 5,280。Listing 2-11 中所示的归一化调整了变量，使得它们的平均值为 0，标准差为 1。这是一个非常常见的归一化。归一化的计算使用了\
  \ `summary()` 函数生成的数字。结果绘制在图 2.11。\n\n### 平行坐标\n\n```python\nauthor = 'mike'\nimport\
  \ matplotlib.pyplot as plt\nimport pandas as pd\nfrom math import exp\n\nabalone\
  \ = pd.read_csv('abalone.csv')\nsummary = abalone.describe()\nmean_rings = summary.mean()['rings']\n\
  sd_rings = summary.std()['rings']\nnrows = len(abalone)\n\nplt.figure(figsize=(10,7))\n\
  for i in range(nrows):\n    data_row = abalone.iloc[i,1:8]\n    norm_target = (abalone.iloc[i,8]\
  \ - mean_rings)/sd_rings\n    label_color = 1.0/(1.0 + exp(-norm_target))\n    plt.plot(range(8),\
  \ data_row, color=plt.cm.RdBu(label_color), alpha=0.5)\n\nplt.xlabel(\"Attribute\
  \ Index\")\nplt.ylabel(\"Attribute Values\")\nplt.show()\n```\n\n\n\n\n更改颜色映射可以帮助你可视化目标值在不同水平上的关系。列表\
