  \ \n\n \n\n   . \n\n(由于输入文本存在大量重复和错误，此处已根据核心内容进行完成翻译。原始文本中出现了大量的重复字符和格式错误。)\n\n\n\
  \n\n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_wine\n\
  import numpy as np\nfrom sklearn import datasets, linear_model\nfrom math import\
  \ sqrt\nimport matplotlib.pyplot as plt\n\ndef xattrSelect(x, idxSet):\n    # 获取\
  \ X 矩阵并返回包含 idxSet 列的子集\n    xOut = []\n    for row in x:\n        xOut.append([row[i]\
  \ for i in idxSet])\n    return(xOut)\n\n# 将数据读入迭代对象\nnames, xList,labels = list_read_wine()\n\
  \n# 将属性和标签分为训练集和测试集\nindices = range(len(xList))\nxListTest = [xList[i] for i in\
  \ indices if i%3 == 0 ]\nxListTrain = [xList[i] for i in indices if i%3 != 0 ]\n\
  labelsTest = [labels[i] for i in indices if i%3 == 0]\nlabelsTrain = [labels[i]\
  \ for i in indices if i%3 != 0]\n\n# 逐个构建属性列表——从空开始\nattributeList = []\nindex =\
  \ range(len(xList[1]))\nindexSet = set(index)\nindexSeq = []\noosError = []\n  for\
  \ i in index:\n    attSet = set(attributeList)\n    # 属性不在列表中中的\n    attTrySet =\
  \ indexSet - attSet\n    # 形成列表\n    attTry = [ii for ii in attTrySet]\n    errorList\
  \ = []\n    attTemp = []\n    # 尝试集合中的每个属性，查看哪个属性产生最小的样本外误差（oos error）\n    for\
  \ iTry in attTry:\n        attTemp = [] + attributeList\n        attTemp.append(iTry)\n\
  \        \n        # 使用 attTemp 构建训练和测试子矩阵 \n        xTrainTemp = xattrSelect(xListTrain,\
  \ attTemp)\n        xTestTemp = xattrSelect(xListTest, attTemp)\n\n        # 转换为\
  \ numpy 数组\n        xTrain = np.array(xTrainTemp); yTrain = np.array(labelsTrain)\n\
  \        xTest = np.array(xTestTemp); yTest = np.array(labelsTest)\n        \n \
  \       # 使用 sci-kit learn 线性回归\n        wineQModel = linear_model.LinearRegression()\n\
  \        wineQModel.fit(xTrain,yTrain)\n        \n        # 使用训练模型生成预测并计算均根误差（rmsError）\n\
  \        rmsError = np.linalg.norm((yTest-wineQModel.predict(xTest)), 2)\\\n   \
  \     /sqrt(len(yTest))\n        errorList.append(rmsError)\n        attTemp = []\n\
  \n    iBest = np.argmin(errorList)\n    attributeList.append(attTry[iBest])\n  \
  \  oosError.append(errorList[iBest])\n\nprint(\"样本外误差与属性集的大小\" )\nprint(oosError)\n\
  print(\"\\n\" + \"最佳属性索引\")\nprint(attributeList)\nnamesList = [names[i] for i in\
  \ attributeList]\nprint(\"\\n\" + \"最佳属性名称\")\nprint(namesList)\n\n# 绘制误差随属性数量变化的图\n\
  x = range(len(oosError))\nplt.plot(x, oosError, 'k')\nplt.xlabel('Number of Attributes')\n\
  plt.ylabel('Error (RMS)')\nplt.show()\n\n# 绘制最佳属性数量的样本外误差直方图\n# 识别对应最小值的索引，\n###\
  \ 使用相应的属性进行重新训练\n# 使用生成的模型对样本外数据进行预测。  \nindexBest = oosError.index(min(oosError))\n\
  attributesBest = attributeList[1:(indexBest+1)]\n\n# 定义 xListTrain 和 xListTest 的列子集并转换为\
  \ numpy\nxTrainTemp = xattrSelect(xListTrain, attributesBest)\nxTestTemp = xattrSelect(xListTest,\
  \ attributesBest)\nxTrain = np.array(xTrainTemp); xTest = np.array(xTestTemp)\n\n\
  # 训练并绘制误差直方图\nwineQModel = linear_model.LinearRegression()\nwineQModel.fit(xTrain,yTrain)\n\
  errorVector = yTest-wineQModel.predict(xTest)\nplt.hist(errorVector)\nplt.xlabel(\"\
  Bin Boundaries\")\nplt.ylabel(\"Counts\")\nplt.show()\n\n### 实际值与预测值的散点图\nplt.scatter(wineQModel.predict(xTest),\
  \ yTest, s=100, alpha=0.10)\nplt.xlabel('Predicted Taste Score')\nplt.ylabel('Actual\
  \ Taste Score')\nplt.show() \n```\n\n上述列表包含一个小型函数，用于从 `X` 矩阵（嵌套列表形式）中提取选定的列。然后，它将\
  \ `X` 矩阵和 `labels` 向量分为训练集和测试集。之后，代码遵循前述描述。\n\n#### 逐步回归输出\n\n```text\n样本外误差与属性集的大小\n\
  [0.72342592511628, 0.68609931528371, 0.67343650334278, 0.66770321389776, 0.66225585685227,\
  \ 0.65900047541546, 0.65727172061407, 0.65709058062077, 0.65699930964461, 0.65758189400434]\n\
  最佳属性索引\n[10, 1, 9, 4, 6, 8, 5, 3, 2, 7]\n最佳属性名称\n[alcohol, volatile acidity, sulphates,\
  \ chlorides, total sulfur dioxide, pH, free sulfur dioxide, residual sugar, citric\
  \ acid, density]\n```\n\n第一个列表显示了 `RSS` 误差。误差一直减少到列表中的第 10 个元素，然后再次增加。相关的列索引显示在下一个列表中。最后一个列表给相关属性的名称（列标题）。\n\
  \n### 评估和理解你的预测模型\n\n其他几个图表对于理解训练算法的性能很有帮助，并可以为改进性能提供方向。图 3.14 显示了测试集中点的真实标签与预测标签的散点图。理想情况下，图\
  \ 3.14 中的所有点都应该落在 45 度角线上——即真实标签与预测标签相等的线。因为实际评分是整数，散点图显示出水平排列的点。当真实值取少数几个值时，将数据点设置为部分透明是很有用的，这样颜色深浅就可以指示图中某一区域点的聚集情况。实际评分\
  \ 5 分和 6 分重现得相当好。极端值的预测效果则没有那么好。通常来说，机器学习算法在数据集的边缘区域表现较差。\n\n\n\n\n\n图 3.15 显示了使用前向逐步法预测葡萄酒口味评分的预测误差直方图。有时，误差直方图会有两个或多个离散的峰。也许在图表的最右侧或最左侧会有一个小峰。在这种情况下，可能为误差中的不同峰找到解释，并通过添加一个新属性（该属性解释了某一组点的成员）来减少预测误差。\n\
  \n![图 3.15：使用前向逐步回归的葡萄酒口味预测误差直方图](img/c03f015.png)\n\n图 3.15:使用前向逐步回归的葡萄酒口味预测误差直方图\n\
  \n你需要对此输出注意以下几点。首先，让我们重申一下该过程。该过程是训练一个模型族（在本例中，是在 `X` 的列子集上训练的普通线性回归）。这一系列模型是参数化的（在本例中，通过线性模型使用的属性数量参数）。要部署的模型是为了最小化样本外误差而选择的。包含在解决方案中的属性数量被称为*复杂度参数*。具有较大复杂度参数的模型具有更多的自由参数，比低复杂度模型更有可能过拟合数据。\n\
  \n另外请注意，属性已经根据它们预测质量方面的重要性进行了排序。在列数列表和相关的属性名称列表中，列表中的第一个是选中的第一个属性，第二个是接之选的，依此类推。所使用的属性以整齐的有序列表形式出现。这是机器学习技术的一个重要且理想的特征。机器学习任务的早期阶段主要涉及寻找（或构建）用于预测的最佳属性集。具有按重要性对属性进行排序的技巧有助于该过程。书中开发的其他算法也将具有这一属性。\n\
  \n最后一个观察结果关于从机器学习技术生成的模型族中选择一个模型。模型越复杂，其泛化能力越差。倾向于选择复杂度较小的模型更好。早期的例子表明，第 9 个（最佳）模型和第\
  \ 10 个模型之间的性能下降微乎其微（第 4 位有效数字的变化）。为了保守起见，即使这些属性在第 4 位有效数字上更好，最佳做法也是将它们移除。\n\n###\
  \ 通过惩罚回归系数控制过拟合——岭回归（Ridge Regression）\n\n本节描述了另一种修改普通最小二法回归的方法以控制模型复杂度并避免过拟合。该方法是对惩罚线性回归的介绍。你将在第\
  \ 4 章中看到更多内容。\n\n普通最小二法回归试图寻找标量 ![images](img/c03-i0045.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>0</mn></msub></mrow></math>和向量\
  \ ![images](img/c03-i0046.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>&#946;</mi></math>以满足方程（参见方程 3.14）。\n\n![方程 3.14: OLS 最小化](img/c03-disp-0015.png)\n\
  \n方程 3.14: OLS 最小化\n\n表达式 `argmin` 意味着“使表达式最小化的 ![images](img/c03-i0028.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>0</mn></msub></mrow></math>\
  \ 值”。得到的系数 ![images](img/c03-i0029.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi><mn>0</mn><mo>42</mo></msub><mo,><msup><mi>&#946;</mi><mo>42</mo></msup></mrow></math>\
  \ 是普通最小二法解。子集回归和前向回归通过限制属性数量来限制普通回归。这等同于施加约束，使得向量 ![images](img/c03-i0030.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>&#946;</mi></math> 中的某些项等于零。另一种方法被称为*系数惩罚回归*（coefficient\
  \ penalized regression*）。系数惩罚回归通过让所有系数变小而不是让某些系数为零来实现相同的效果。其中一个版本被称为*岭回归*（*ridge*）。方程\
  \ 3.15 展示了岭回归的公式化。\n\n![方程 3.15: 岭回归最小化](img/c03-disp-0016.png)\n\n方程 3.15: 岭回归\n\
  \n方程 3.15 与普通最小二法（方程 3.14）之间的差异在于增加了 ![images](img/c03-i0031.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink><mrow><mi>&#946;</mi><mi>T</mi></msub></mrow></math>\
  \ 项。![images](img/c03-i0032.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msup><mi>&#946;</mi><mi>T</mi></></></mrow></math> 项是 ![images](img/c03-i0033.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>&#946;</mi></math>（系数向量）的欧几里得平方。该变量是该问题的复杂度参数。如果\
  \ ![images](img/c03-i0034.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math>，则问题变为普通最小二法回归。当 ![images](img/c03-i0042.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink><mi>&#945;</mi></math> 变得很大时，系数向量 ![images](img/c03-i0042.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink><mi>&#946;</mi></math> 趋于零，只有常数项 ![images](img/c03-i0037.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>0</mn></msub></mrow></math>\
  \ 可用于预测标签 ![images](img/c03-i0038.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></math>。岭回归在 scikit-learn 中可用。列表\
  \ 3.5 显示了使用岭回归解决葡萄酒口味回归问题的代码。\n\n#### 列表 3.5: 使用岭回归预测葡萄酒口味——ridgeWine.py\n\n\n\n\
  \n\n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_wine\n\
  import numpy as np \nfrom sklearn import datasets, linear_model\nfrom math import\
  \ sqrt\nimport matplotlib.pyplot as plt\n\n#read data into lists\nnames, xList,\
  \ labels = list_read_wine()\n\n#divide attributes and labels into training and test\
  \ sets\nindices = range(len(xList))\nxListTest = [xList[i] for i in indices if i%3\
  \ == 0 ]\nxListTrain = [xList[i] for i in indices if i%3 != 0 ]\nlabelsTest = [labels[i]\
  \ for i in indices if i%3 == 0]\nlabelsTrain = [labels[i] for i in indices if i%3\
  \ != 0]\n\nxTrain = np.array(xListTrain); yTrain = np.array(labelsTrain)\nxTest\
  \ = np.array(xListTest); yTest = np.array(labelsTest)\n\nalphaList = [0.1**i for\
  \ i in [0,1, 2, 3, 4, 5, 6]]\n\nrmsError = []\nfor alph in alphaList:\n    wineRidgeModel\
  \ = linear_model.Ridge(alpha=alph)\n    wineRidgeModel.fit(xTrain, yTrain)\n   \
  \ rmsError.append(np.linalg.norm((yTest-wineRidgeModel.\\\n                    \
  \        predict(xTest)), 2)/sqrt(len(yTest)))\n\nprint('{:18}'.format(\"RMS Error\"\
  ), \"alpha\") \nfor i in range(len(rmsError)):\n    print(rmsError[i], alphaList[i])\n\
  \n#plot curve of out-of-sample error versus alpha\nx = range(len(rmsError))\nplt.plot(x,\
  \ rmsError, 'k')\nplt.xlabel('-log(alpha)')\nplt.ylabel('Error (RMS)')\nplt.show()\n\
  \n#Plot histogram of out of sample errors for best alpha value and\n#scatter plot\
  \ of actual versus predicted\n#Identify index to min value, retrain with the\n#corresponding\
  \ value of alpha\n#Use resulting model to predict against out sample data. \nindexBest\
  \ = rmsError.index(min(rmsError))\nalph = alphaList[indexBest]\nwineRidgeModel =\
  \ linear_model.Ridge(alpha=alph)\nwineRidgeModel.fit(xTrain, yTrain)\nerrorVector\
  \ = yTest-wineRidgeModel.predict(xTest)\nplt.hist(errorVector)\nplt.xlabel(\"Bin\"\
  )\nplt.ylabel(\"Counts\")\nplt.show() \nplt.scatter(wineRidgeModel.predict(xTest),\
  \ yTest, s=100, alpha=0.1)\nplt.xlabel('Predicted Taste')\nplt.ylabel('Actual Taste')\n\
  plt.show()\n```\n\n回想一下前向逐步回归产生了一系列不同的模型——第一个模型包含一个属性，下一个包含两个，直到最终模型包含所有属性。岭回归的代码也有一系列模型。该序列与不同数量不同，这些回归模型序列具有不同的值——即决定惩罚程度的参数。该序列的构建使它们按\
  \ 10 的幂次递减。通常情况下，你会希望它们按指数级递减，而不是按固定的增量。范围需要足够宽，并且可能需要一些实验来确定。\n\n图 3.16 展示了 RMSE\
  \ 作为岭回归复杂度参数的函数。该参数从左侧的最大值排列到右侧的最小值。按照惯例，图的左侧显示最简单的模型，右侧显示最复杂的模型。该图所示的特征与前向逐步回归非常相似。误差大致相同，但略微优于前向逐步回归。\n\
  \n![图 3.16: 使用岭回归进行葡萄酒质量预测误差](img/c03f016.png)\n\n图 3.16: 使用岭回归的葡萄酒质量预测误差\n\n列表\
  \ 3.6 显示了岭回归的输出。数字显示岭回归的特征与前向逐步回归大致相同。数字略微倾向于前向逐步回归。\n\n#### 列表 3.6: 岭回归输出\n\n```text\n\
  RMS Error alpha\n(0.65957881763424564, 1.0)\n(0.65786109188085928, 0.1)\n(0.65761721446402455,\
  \ 0.010000000000000002)\n(0.65752164826417536, 0.0010000000000002)\n(0.65741906801092931,\
  \ 0.0001000000000002)\n(0.65739416288512531, 1.0000000000000003e-05)\n(0.65739130871558593,\
  \ 1.0000000000000004e-06)\n```\n\n图 3.16 显示了在葡萄酒口味数据上训练的岭预测器的实际评分与预测评分的散点图。图 3.18\
  \ 显示了预测误差的直方图。\n\n![图 3.17: 使用岭回归生成的实际与预测](img/c03f017.png)\n\n图 3.17: 使用岭回归生成的实际与预测\n\
  \n你可以将相同的通用方法应用于分类问题。预测模型的衡量章节讨论了量化分类器性能的方法方法。方法包括使用分类错误、为各种预测结果关联经济成本，以及使用 ROC\
  \ 曲线下面（AUC）来量化性能。该章节使用最小二乘回归构建了一个分类器。列表 3.7 显示了遵循相同通用计划的 Python 代码。它没有使用 OLS，而是使用岭回归作为回归方法（带有复杂度调优参数）来构建岩石与矿分类器，并使用\
  \ AUC 作为分类器的性能指标。列表 3.7 中的程序与葡萄酒口味的岭回归相似。主要区别在于，程序将测试数据上的预测值和测试标签作为 scikit-learn\
  \ 包中 `roc_curve` 程序的输入。这使得计算每次训练过程的 AUC 变得容易。这些值被累加，打印出的值显示在列表 3.8](#c03.xhtml#c03-fea-0008)中。\n\
  \n\n\n\n\n```python\n__author__ = 'mike_bowles'\n\nimport numpy as np\nfrom Read_Fcns\
  \ import list_read_rvm\nfrom sklearn import datasets, linear_model\nfrom sklearn.metrics\
  \ import roc_curve, auc\nimport matplotlib.pyplot as plt\n\n#read data from uci\
  \ data repository\nxList, labels = list_read_rvm()\n\n#divide attribute label vector\
  \ into training and test sets (2/3, 1/3)\nindices = range(len(xList))\nxListTest\
  \ = [xList[i] for i in indices if i%3 == 0 ]\nxListTrain = [xList[i] for i in indices\
  \ if i%3 != 0 ]\nlabelsTest = [labels[i] for i in indices if i%3 == 0]\nlabelsTrain\
  \ = [labels[i] for i in indices if i%3 != 0]\n\nxTrain = np.array(xListTrain); yTrain\
  \ = np.array(labelsTrain)\nxTest = np.array(xListTest); yTest = np.array(labelsTest)\n\
  \nalphaList = [0.1**i for i in [-3, -2, -1, 0,1, 2, 3, 4, 5]]\n\naucList = []\n\
  for alph in alphaList:\n    rocksVMinesRidgeModel = linear_model.Ridge(alpha=alph)\n\
  \    rocksVMinesRidgeModel.fit(xTrain, yTrain)\n    fpr, tpr, thresholds = roc_curve(yTest,rocksVMinesRidgeModel.\\\
  \n                    predict(xTest))\n    roc_auc = auc(fpr, tpr)\n    aucList.append(roc_auc)\n\
  \n\nprint('{:18}'.format(\"AUC\"), \"alpha\") \nfor i in range(len(aucList)):\n\
  \    print(aucList[i], alphaList[i])\n\n#plot auc values versus alpha values\nx\
  \ = [-3, -2, -1, 0,1, 2, 3, 4, 5]\nplt.plot(x, aucList)\nplt.xlabel('-log(alpha)')\n\
  plt.ylabel('AUC')\nplt.show()\n\n#visualize the performance of the best classifier\n\
  indexBest = aucList.index(max(aucList))\nalph = alphaList[indexBest]\nrocksVMinesRidgeModel\
  \ = linear_model.Ridge(alpha=alph)\nrocksVMinesRidgeModel.fit(xTrain, yTrain)\n\n\
  #scatter plot of actual vs predicted\nplt.scatter(rocksVMinesRidgeModel.predict(xTest),\
  \ yTest, \\\n            s=100, alpha=0.25)\nplt.xlabel(\"Predicted Value\")\nplt.ylabel(\"\
  Actual Value\")\nplt.show() \n```\n\nListing 3.8 显示了 AUC 以及相关的 alpha（系数惩罚的乘因子）。\n\
  \n### Listing 3.8: 使用岭回归进行岩石与矿石分类模型的输出\n\n```\nAUC alpha\n(0.84111384111384113,\
  \ 999.9999999999999)\n(0.86404586404586403, 99.99999999999999)\n(0.9074529074529073,\
  \ 10.0)\n(0.91809991809991809, 1.0)\n(0.88288288288288286, 0.1)\n(0.8615888615888615,\
  \ 0.010000000000000002)\n(0.85176085176085159, 0.0010000000000000002)\n(0.85094185094185093,\
  \ 0.00010000000000000002)\n(0.84930384930384917, 1.0000000000000003e-05) \n```\n\
  \n`AUC` 值接近 1 表示性能优异。接近 0.5 的值则并不好。因此，`AUC` 的目标是最大化，而不是最小化，就像在前面的示例中对 `MSE` 执行的那样。`AUC`\
  \ 在 ![images](img/c03-i0044.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1998/Math/MathML\"\
  > 处显示了一个相当尖锐的峰值。\n\n\n\n\n数据集大小的差异导致了其他一些差异。例如，PySpark 版本暴露了一个 `maxIter` 变量，该变量控制了遍历数据的次数，以实现收敛到最终答案。这是因为当数据集足够大时，计算时间在时间或资金上都可能成为负担。对于\
  \ Python 版本来说，这个问题就不那么严重。另一个例子是 PySpark 代码中的一部分，它将输入定义为输入数据集中的指定列。在像葡萄酒数据集类的数据背景下，这似乎很奇怪，因为这些列已经为了构建预测模型而经过了筛选。在许多实际问题中，用于预测的数据是较大数据集的一部分，并且可能是你为了获得最佳答案而进行实验的内容。如果数据集很大，复制它们可能会花费过多的存储空间，因此\
  \ PySpark 允许你从更大的数据框中选择列。\n\n算法实现方式的差异可能会导致答案的差异。如你在图 3.21 所示，性能随正则化参数变化的曲线的整体形状大致相同。但正如你从打印输出中看到的，数值上存在差异。这些差异很小，而且它们在相同的正则化参数值（这正是你寻找的）处达到最小值。\n\
  \n### Listing 3.9: Spark 在葡萄酒数据上的岭回归实现—linear_regression_w_spark.py\n\n```python\n\
  __author__ = 'mike_bowles'\n\n#Importsparksession \nfrom pyspark.sql import SparkSession\n\
  from pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.regression import\
  \ LinearRegression\nimport matplotlib.pyplot as plt\n\nspark = SparkSession.builder.appName(\"\
  regress_wine_data\").getOrCreate()\n\n#将鲍鱼数据作为 pandas 数据框读取并创建 Spark 数据框。\nimport\
  \ pandas as pd\nfrom pandas import DataFrame\nfrom Read_Fcns import pd_read_wine\n\
  \nwine_df = pd_read_wine()\n\n#为葡萄酒数据创建 spark dataframe\nwine_sp_df = spark.createDataFrame(wine_df)\n\
  print('Column Names', wine_sp_df.columns, '\\n\\n')\n\nvectorAssembler = VectorAssembler(inputCols\
  \ = ['fixed acidity',\n    'volatile acidity', 'citric acid', 'residual sugar',\
  \ 'chlorides',\n    'free sulfur dioxide', 'total sulfur dioxide', 'density', 'pH',\n\
  \                    'sulphates', 'alcohol'], outputCol = 'features')\nv_wine_df\
  \ = vectorAssembler.transform(wine_sp_df)\nvwine_df = v_wine_df.select(['features',\
  \ 'quality'])\n\n\nsplits = vwine_df.randomSplit([0.66, 0.34])\nxTrain_sp = splits[0]\n\
  xTest_sp = splits[1]\n\nalphaList = [0.1**i for i in [0,1, 2, 3, 4, 5, 6]]\nrmsError\
  \ = []\nfor alph in alphaList:\n    wine_ridge_sp = LinearRegression(featuresCol\
  \ = 'features',\n        labelCol='quality', maxIter=100, regParam=alph,\n     \
  \   elasticNetParam=0.0)\n    wine_ridge_sp_model = wine_ridge_sp.fit(xTrain_sp)\n\
  \    test_result = wine_ridge_sp_model.evaluate(xTest_sp)\n    rmsError.append(test_result.rootSquaredError)\n\
  \nprint('{:18}'.format(\"RMS Error\"), \"alpha\")\nfor i in range(len(rmsError)):\n\
  \    print(rmsError[i], alphaList[i])\n\n#绘制样本外误差曲线\nx = range(len(rmsError))\n\
  plt.plot(x, rmsError, 'k')\nplt.xlabel('-log(alpha)')\nplt.ylabel('Error (RMS)')\n\
  plt.savefig('linear_regression_w_spark.png', dpi=500)\nplt.show()\n\n输出:\nColumn\
  \ Names ['fixed acidity', 'volatile acidity', 'citric acid', 'residual sugar', 'chlorides',\
  \ 'free sulfur dioxide', 'total sulfur dioxide', 'density', 'pH', 'sulphates', 'alcohol']\n\
  RMS Error             alpha\n0.6581102654673014 1.0\n0.6290665424695915 0.01\n0.6265318770173852\
  \ 0.001\n0.6262902244673014 0.0001\n0.6263116670173852 0.00001\n0.6262880825310369\
  \ 0.000001\n0.6262878725310366 0.0000001\n```\n\n![图 3.21: 使用岭回归版本的葡萄酒预测误差](img/c03f21.png)\n\
  \n图 3.21: 使用岭回归版本的葡萄酒预测误差\n\n## 总结\n\n本章涵盖了几个作为后续基础的主题。首先，本章通过演示提供了模型复杂度和数据集大小，并讨论了这些因素如何决定性能。本章首先回顾了与问题类型（回归、分类和多分类）相关的多种不同的预测指标。本章介绍了用于估计新数据的两种方法（留法和折折交叉验证）。本章引入了一种概念框架，通过机器学习技术产生具有不同复杂度的参数化模型族，然后根据样本外性能选择一个。基于普通最小二法改进的几个示例（正向逐步回归和岭回归）随后实例化了这一概念框架。\n\
  \n你还看到了在 Python 和 PySpark 中工作流是多么相似。这应该让你有信心将所学知识应用于大数据。大数据确实增加了一些棘手的问题，但构建和调优模型的算法是非常相似的。\n\
  \n## 参考文献\n\n1. 1. David J. Hand and Robert J. Till (2001). A Simple Generalization\
  \ of the Area Under the ROC Curve for Multiple Class Classification. Machine Learning,\
  \ 45(2), 171–186.\n\n# 第 4 章：惩罚线性回归\n\n如你在第 3 章](#c03.xhtml)“预测模型构建：平衡性能、复杂度和大数据”所示，线性回归在实践中工作需要对普通最小二法进行某些处理。普通最小二法无法节制其对可用数据的使用，以最小化训练数据上的误差。第\
  \ 3 章](#c03.xhtml)阐明了这种情况会导致模型在测试数据上的表现远差于训练数据。第 3 章](#c03.xhtml)展示了普通最小二法的两种扩展：正向逐步回归和岭回归。\n\
  \n逐步回归始于让普通最小二法仅使用一个属性列进行预测，并选择其中最好的一个。它通过递归地向已使用的属性中添加单个额外的属性列来继续该过程。\n\n岭回归引入了不同类型的约束。岭回归对系数的大小施加了惩罚以限制解。岭回归和正向逐步回归在示例问题上的都优于普通最小二法。\n\
  \n\n\n本章开发了一系列用于控制 OLS（最小二乘法）中固有过拟合的方法。本章讨论的方法被称为`惩罚线性回归`。惩罚线性回归涵盖了几种算法，其运行机制与第三章介绍的方法相似。岭回归是惩罚线性回归算法的一个特定示例。岭回归通过对回归系数的和进行惩罚来调节过拟合。其他惩罚回归算法使用不同形式的惩罚。本章将解释惩罚方法如何决定解的性质，以及关于该解可以获得哪些类型的信息。\n\
  \n# 为什么惩罚线性回归方法如此有用\n\n几个属性使得惩罚线性回归方法变得异常有用，包括以下点：\n\n*   极快的模型训练速度\n*   变量重要性信息\n\
  *   部署后评估速度极快\n*   在各种问题上表现可靠——特别是对于那些相对于宽度而言高度不高的，或者非常稀疏的属性矩阵\n*   稀疏解（即更精简的模型）\n\
  *   法规可能要求使用线性模型\n\n以下对于作为机器学习模型设计者的你，这些属性意味着什么。\n\n### 极快的系数估计\n\n训练时间之所以重要，有几个原因。其中之一是构建模型的过程是迭代的。你会发现你将训练作为特征选择和特征工程过程的一部分。你会选取一些看起来合理的特征，训练一个模型，在样本外数据上进行评估，想要更高的性能，然后进行一些更改并重试。如果基础训练可以很快完成，你就不必在等待答案时浪费大量时间去喝咖啡（并获得降低咖啡因摄入的健康益处）。这使得开发过程变得更快。训练时间重要的另一个原因是，你可能需要随着条件的变化而重新训练模型以保持其正常工作。如果你在对推文进行分类，你可能需要跟进词汇的变化。如果你在金融市场进行交易训练，条件总是在变化的。即使不进行特征重构，训练所需的时间也将决定了你应对变化条件的速度有多快。\n\
  \n### 变量重要性信息\n\n书中涵盖的两类算法都能生成变量重要性信息。变量重要性信息包含了对你选择的作为模型基础的每个属性的排名。该排名告诉你与其他属性相比，模型对每个属性的重视程度。排名较高的属性对模型预测的贡献比排名较低的属性更多。出于多种原因，这是至关重要的信息。首先，它可以帮助你在特征工程过程中剔除变量。良好的特征会排到列表顶端，而不好的特征会沉到底部。除了帮助你进行特征工程之外，知道哪些驱动了预测有助于你理解并向他人（你的老板、客户、公司内的领域专家等）解释你的模型。在重要属性正是人们所预期的范围内，这会给他们带来模型是合理的信心。如果某些排名让你感到意外，你可能会对你的问题产生新的见解。关于相对重要性的讨论可以为你的开发小组提供关于从何处寻找性能改进的新想法。\n\
  \n快速训练和变量重要性这两个属性使得惩罚回归成为在一个新问题上首选尝试的良好算法。这些算法帮助你快速掌握问题，并帮助你学习哪些特征将是有用的。\n\n###\
  \ 部署后极快的评估\n\n在某些问题设置中，快速评估是一个关键性能参数。在某些电子市场中（例如互联网广告和自动交易），谁先得到答案谁就能获得业务。在许多其他应用中（例如垃圾邮件过滤），时间可能是关键的，尽管它不是“是/否”的标准。在评估速度上，很难打败线性模型。预测计算所需的操作数对于每个属性只需要一次乘法和一次加法。\n\
  \n### 可靠的性能\n\n`可靠性能`意味着惩罚线性方法将为各种形状和大小的问题生成合理的答案。在某些问题上，它们的性能将等于可用最佳性能。在某些情况下，它们需要一点引导来超越其他竞争者。本章将讨论你可以使用的技术。第六章“集成方法”将重新讨论这一主题，并解释如何结合集成方法提高惩罚回归的性能。\n\
  \n### 稀疏解\n\n`稀疏解`意味着许多系数为零。这意味着不需要太多的乘法和加法。更重要的是，稀疏模型（具有少数非零系数）很容易解释。当模型中的某些系数为零时，你可以看出哪些属性驱动了预测。\n\
  \n### 问题可能要求线性模型\n\n使用惩罚回归的最后一个原因是线性模型可能是方案的强制。保险赔付的计算就是一个要求线性模型的例子。一个包含数千棵树、每棵树有一千个参数的集成模型几乎无法写出来。药物测试是另一个要求线性形式进行统计推断的领域。\n\
  \n\n\n\n在下表中，结果（2013 年的支出金额）是实值——这使其成为一个回归问题。性别属性（特征 1）是二值的，使其成为一个分类（或因子）属性。另外两个属性是数值型的。函数逼近问题的目标是：(1)\
  \ 构建一个属性与结果之间关系的函数，(2) 在某种意义上最小化误差。第 3 章 讨论了一些可能用于量化整体误差的替代误差表征方法。\n\n表 4.1 所示类型的数据集通常由一个列向量表示，该向量包含结果（表\
  \ 4.1 中的第一列）以及包含属性的其他列（第一列之后的三个特征列）。这些属性是用于预测结果的可用数据。数据科学家通常将表 4.1 这样的数据结构称为 `dataframe`（数据框）。在数据框中，列中的数据具有完全相同的类型：实数、整数、字符串变量，有时是布尔值。你可以在\
  \ Python pandas 和 PySpark（以及 R 编程语言）中找到数据框。数据框的形状与矩阵相同，但矩阵包含的元素都是相同的数值类型：实数、整数或布尔值。矩阵不能是实数和分类变量的混合。\n\
  \n这里有一个重要的点。线性方法仅适用于数值数据。表 4.1 中的数据包含非数值型数据，因此线性方法对所示数据无效。幸运的是，将表 4.1 中的数据转换为数值数据是相对简单的。在存在两个不同类别的情况下，例如表\
  \ 4.1 中可能的取值为 M 或 F，你可以用 0.0 替换 M，用 1.0 替换 F，然后进行线性回归。你将在“将非数值属性引入线性方法”章节中学习一种更通用的将分类属性编码为数值属性的技术。\n\
  \n鉴于属性都是实数（无论是在初始问题公式中，还是通过将分类属性编码为实数），线性回归数据可以使用两个对象表示：`Y` 和 `X`，其中 `Y` 是结果的列向量，`X`\
  \ 是实值属性的矩阵。公式 4.1 显示了如何使用单个大写字母 `Y` 来表示一组数字 `y_i`。\n\n![公式 4.1: 结果向量](img/c04-disp-0001.png)\n\
  \n`公式 4.1`: 结果向量\n\n在表 4.1 给出的示例中，`Y` 是标记为 Outcomes（结果）的列。公式 4.2 显示了如何使用单个大写字母 `X`\
  \ 来表示一个数字矩阵（矩形网格）`x_ij`。\n\n![公式 4.2: 属性矩阵](img/c04-disp-0002.png)\n\n`公式 4.2`:\
  \ 属性矩阵\n\n在表 4.1 给出的示例中，`X` 是排除 Outcomes 列后剩余的列。`Y` 的第 $i$ 个元素 $y_i$ 与 `X` 的第 $i$\
  \ 行属于同一个实例。`X` 的第 $i$ 行将由 $x_i$ 表示，其具有单个下标，并由 $x_i = (x_{i1}, x_{i2}, \\dots, x_{im})$\
  \ 给出。普通最小二乘法是最小化 $y_i$ 与线性函数 $x_i$、`X` 的第 $i$ 行之间的误差（即找到一个如公式 4.3 中定义的实数向量 $\\beta$）以及标量\
  \ $\\beta_0$，使得 `Y` 中的每个元素 $y_i$ 都能通过公式 4.4 进行近似。\n\n![公式 4.3: 模型系数 β 向量](img/c04-disp-0003.png)\n\
  \n`公式 4.3`: 模型系数 β 向量\n\n![公式 4.4: X 与预测 Y 的线性关系](img/c04-disp-0004.png)\n\n`公式\
  \ 4.4`: `X` 与预测 `Y` 的线性关系\n\n你可能根据领域知识找到 $\\beta$ 的值。例如，在表 4.1 中，你可能估计 2013 年的支出比\
  \ 2012 年增加 10%，购买量随年龄每年增加 10 美元，即使新生婴儿也会购买 50 美元的书籍。这给出了一个预测书籍支出的方程，类似于公式 4.5。\n\
  \n![公式 4.5: 预测书籍支出](img/c04-disp-0006.png)\n\n`公式 4.5`: 预测书籍支出\n\n\n\n\n公式 4.5 没有使用\
  \ `Gender` 变量，因为它是一个分类变量（这将在“将非数值属性引入线性方法”中进行介绍，目前予以忽略）。公式 4.5 生成的预测结果与表 4.1 中的\
  \ `Outcomes`（实际数值）并不完全一致。这个简单的模型存在误差，模型通常如此。\n\n### 训练线性模型：最小化误差及其他\n\n手动寻找 `β`'*s'*\
  \ 的值通常不是最好的方法，尽管如果你能做到，这一直是一个很好的合理性检查。在许多问题中，问题的规模或变量之间的相互关系使得猜测 `β`'*s'*是不可能的。因此采用的方法是通过求解最小化问题来找到属性的乘数（`β`'*s'`）。最小化问题是找到使平均平方误差最小（但不为零）的\
  \ `β`'*s'* 的值。\n\n使公式 4.4 的两边完全相等通常意味着模型过拟合。公式 4.4 的右侧是你将训练的预测模型。基本上，它是说为了做出预测，你取每个属性，乘以其对应的\
  \ beta，将这些乘积求和，并加上一个常数。*训练模型*意味着找到组成向量 `β` 和常数的数字![images](img/c04-i0025.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>0</mn></msub></mrow></math>。*误差*定义为![images](img/c04-i0006.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>y</mi><mi>i</mi></msub></math>的实际值与![images](img/c04-i0017.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>y</mi><mi>i</mi></msub></math>的预测值之间的差，由公式\
  \ 4.4 给出。平均平方误差用于将各个误差减少为一个待最小化的数字。选择误差的平方是因为无论误差是正是负，它都是正的，并且因为平方函数有助于某些数学计算。普通最小二法回归问题的公式然后是找到![images](img/c04-i0056.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mn>0</mn><mrow><mo>&#42;</mo></mrow></mtext><momomomo><><><mi>mi>46;</mi;</mi><mrow><mo>&#42;</mo></mo></msup></mrow></math>（上标\
  \ `*` 表示这些是 `β`'*s'` 的最佳值），使其满足公式 4.6。\n\n![公式 4.6: OLS 最小化问题](img/c04-disp-0007.png)\n\
  \n**公式 4.6**: OLS 最小化问题\n\n符号 `argmin` 意味着“使以下表达式最小的参数”。求和是针对行进行的，每一行包含属性值和对应的标签。![images](img/c04-i0016.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msup><mfenced open=\"(\" close=\"\
  )\"><mrow>/</mrow><mn>2</mn></msup></math>内部的表达式是![images](img/c04-i0014.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>y</mi><mi>i</mi></msub></math>与用于预测它的线性函数之间的误差。（注：原文此处存在一些重复/乱码，已根据提供的文本逻辑进行对齐）。\n\
  \n（此处省略重复的乱码部分，已按要求清理冗余内容）\n\n\n\n为什么这样做是合理的？为了帮助对这种合理性建立直觉，请回一下你在第 3 章中看到的子集选择过程。子集选择通过丢弃某些属性（或等价地将它们的系数设置为零）来消除过拟合。惩罚回归做的是相同的事情，但它不像子集选择那样将少数属性的系数一直减到零，惩罚回归是减小所有系数的幅度，从而减小所有属性的影响。一些极端情况也有助于可视化这种方法。\n\
  \n参数 `λ` 的范围可以是从 0 到正无穷之间的任何值。如果 ![images](img/c04-i0023.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>&#955;</mi><mo>=</mo><mn>0</mn></></></math>，惩罚项消失，问题变回普通最小二乘问题。如果\
  \ ![images](img/c04-i0024.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#955;</mi><mtext>&#8196;</mtext><mo>&#8594;</mo><mtext>&#8196;</mtext><mi>&#8734;</mi></mrow></math>，对\
  \ `β`s 的惩罚变得非常严厉，迫使它们全部变为零。（但注意，![images](img/c04-i0012.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>0</mn></msub></mrow></math>\
  \ 不包含在惩罚中，因此预测变成了一个独立于 `x`s 的常数。）\n\n正如你在第 3 章的示例中所看到的，岭回归惩罚可以与忽略某些属性产生类似的效果。该过程是针对等式\
  \ 4.6 所示的惩罚性最小化问题生成一整族解。这意味着要针对不同的 `λ` 值求解惩罚性最小化问题。然后，对这些解中的每一个在样本外数据上进行测试，并使用样本外误差最小的解来进行对真实世界的预测。第\
  \ 3 章使用岭回归说明了这一系列步骤。\n\n### 其他有用的系数惩罚——曼哈顿和弹性网络\n\n岭回归惩罚不是用于惩罚回归的唯一有用惩罚。任何向量长度的度量都是行之有效的。你可以通过多种方式衡量向量的长度。使用不同的长度度量会改变解的重要属性。岭回归采用了欧几里得几何度量（即\
  \ `β`s 的平方和）。另一种名为 Lasso 回归的有用算法使用了 `β`s 的绝对值和或 L1 度量。这种度量也被称为出租车距离或曼哈顿距离，因为它是出租车受限于曼哈顿网格街道时行驶的距离。Lasso\
  \ 回归具有一些有用的属性。\n\n岭回归和 Lasso 回归的区别在于它们用于惩罚 `β`（线性系数向量）时使用的长度度量。岭回归使用平方欧几里得距离——`β`\
  \ 分量平方之和。Lasso 使用 `β` 分量绝对值之和。Lasso 惩罚由等式 4.8 给出。\n\n![等式 4.8: Lasso 系数惩罚公式](img/c04-disp-0009.png)\n\
  \n`等式 4.8`: Lasso 系数惩罚公式**\n\n双竖线被称为范数棒（norm bars）。它们用于表示向量和算子等事物的幅度。范数棒右侧的下标 1\
  \ 表示 ![images](img/c04-i0026.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><msub><mi>L</mi><mn>1</mn></msub></math> 范，意味着绝对值之和。你还会看到它写成小写 ![images](img/c04-i0027.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>l</mi><mn>1</mn></msub></math>。带有下标\
  \ 2 的范数意味着平方和的平方根——欧距离。这些不同的系数惩罚会导致解产生重要且有用的变化。主要区别之一是，Lasso 系数向量 ![images](img/c04-i028.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msup><mrow><mi>&#946;</mi></mrow><mo>&#42;</mo></msup></mrow></math>\
  \ 是稀疏的，这意味着对于中较大的 `λ` 值，许多系数为零。相比之下，岭回归的 ![images](img/c04-i021.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msup><mrow><mi>&#946;</mi></mrow><mo>&#42;</mo></msup></mrow></math>\
  \ 是完全填充的。\n\n### 为什么 Lasso 惩罚会导致稀疏系数\n\n图 4.1 和 4.2 说明了这种稀疏性直接源于系数惩罚的形式。这些图针对一个有两个属性的问题：`x1`\
  \ 和 `x2`。\n\n![图 4.1: 平方和系数惩罚的优解](img/c04f001.png)\n\n`图 4.1`: 平方和系数惩罚的优解\n\n图 4.1\
  \ 和 4.2 都有两组曲线。其中一组曲线是同心椭圆，代表了等式 4.6 中的普通最小二乘误差。椭圆代表恒定的平方误差曲线。你可以将它们想象成地面上椭凹陷的地形图。越靠近中心的椭圆，误差越小，就像地面凹陷的底部海拔越低一样。凹陷的最低点用\
  \ `x` 标记。点 `x` 标记了最小二乘解——即如果没有系数惩罚，解所在。\n\n![图 4.2: 绝对值和系数惩罚的优解](img/c04f002.png)\n\
  \n`图 4.2`: 绝对值和系数惩罚的优解\n\n\n\n\n图 4.1 和图 4.2 中的另一组曲线代表了公式 4.7 和公式 4.8 中的系数惩罚——分别为岭回归（ridge）惩罚和\
  \ Lasso 惩罚。\n\n在图 4.1 中，代表系数惩罚的曲线是以原点为圆的圆。![images](img/c04-i0030.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>1</mn></msub></mrow></math></math>和![images](img/c04-i0047.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>2</mn></msub></mrow></math></math>平方和为常数的点集定义了一个圆。\n\
  \n恒定惩罚曲线的形状取决于所使用的距离度量的性质——对于平方和惩罚函数，是圆（在高维空间下称为超球面或![images](img/c04-i0033.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>L</mi><mn>1</mn></msub></math>球）；对于绝对值之和，是菱形（或![images](img/c04-i0032.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>L</mi><mn>1</mn></msub></math>球）。较小的圆（或菱形）对应于距离函数的较小值。形状由惩罚的性质决定，但与每条曲线关联的值由非负参数\
  \ `λ` 决定。\n\n假设图 4.1 中的两条曲线分别对应内圆和外圆的![images](img/c04-i0038.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>1</mn></msub></mrow></math></math>和![images](img/c04-i0045.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>2</mn></msub></mrow></math></math\
  \ 的平方和等于 1.0 和 2.0。那么，如果![images](img/c04-i0036.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#955;</mi><mo>=</mo><mn>1</mn></mrow></math>，与这两个圆关联的惩罚分别为 1 和 2。如果![images](img/c04-i0037.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>&#955;</mi><mo>=</mo><mn>10</mn></mrow></math>，关联的惩罚为\
  \ 10 和 20。图 4.2 中的菱形情况也是如此。\n\n增加 `λ` 会增加与图 4.2 中同心菱形关联的惩罚。对应于预测误差平方和的椭圆环随着圆环远离无约束最小值（图中用\
  \ `x` 标记）而变得越来越大。这两个函数之和，如公式 4.7 所示，使这两个函数之和最小需要在预测误差最小值和系数惩罚最小值之间寻求某种折中。较大的 `λ`\
  \ 值将这种折中点拉向惩罚的最小值（即所有系数均为零）。较小的 `λ` 值则将最小值拉向无约束预测误差（图 4.1 和图 4.2）。\n\n这里是平方惩罚和绝对值惩罚区别变得重要的地方。公式\
  \ 4.7 或公式 4.8 的整体最小值将位于惩罚曲线与平方预测误差曲线相切的点上。图 4.1 和图 4.2 展示了两个说明这种切点的例子。这里需要说明的重要一点是，在图\
  \ 4.1 中随着 `λ` 的变化和最小点的移动，平方和惩罚（圆）的切点通常不在任何坐标轴上。![images](img/c04-i0046.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>1</mn></msub></mrow></math></math\
  \ 和![images](img/c04-i0043.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>2</mn></msub></mrow></math>均不为零。相比之下，图\
  \ 4.2 中，绝对值之和的切点在一定解范围内停留在![images](img/c04-i0041.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>2</mn></msub></mrow></math>-轴上。沿着![images](img/c04-i0035.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>2</mn></msub></mrow></math>-轴，![images](img/c04-i0042.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>&#946;</mi></mrow><mn>1</mn></msub><mo>=</mo><mn>0</mn></mrow></math>。\n\
  \n\n\n\n稀疏系数向量是算法告知你可以完全忽略某些变量的方式。当 `λ` 变得足够小时，$ \\lambda_2$ 和 $\\lambda_1$ 的最佳值将离开\
  \ $\\lambda_2$ 轴，且两者都将非零。由于使 $\\lambda_1$ 变为非零需要更小的惩罚，这一事实为 $\\lambda_2$ 和 $\\lambda_1$\
  \ 赋予了顺序。在某种程度上，$\\lambda_2$ 比 $\\lambda_1$ 更重要，因为它在较大的 `λ` 值下就能获得非零系数。请记住这些系数是相乘的。如果对应某个属性的系数为零，算法在告诉你该属性比那些获得非零系数的属性更重要。通过从大到小值扫描\
  \ `λ`，你可以根据重要性对所有属性进行排序。下一节将通过一个具体问题展示这一过程，并展示 Python 代码，作为方程 4.8 求解的一部分，显式地表示属性之间的重要性。\n\
  \n### ElasticNet 惩罚包含了 Lasso 和 Ridge\n\n在查看如何计算这些系数之前，你需要了解关于惩罚回归问题的另一个广义陈述。这被称为\
  \ ElasticNet 公式。惩罚回归问题的 ElasticNet 公式是使用岭惩罚和 Lasso 惩罚的可调节混合混合。ElasticNet 引入了另一个参数\
  \ `α`，该参数化了总惩罚中岭惩罚的比例和 Lasso 惩罚的比例。端点 $\\alpha=1$ 对应于全 Lasso 惩罚且无岭惩罚；端点 $\\alpha=0$\
  \ 对应于全岭惩罚。\n\n使用 ElasticNet 公式，必须指定 `λ` 和 `α` 来求解线性模型的系数。通常的方法是为 `α` 选取一个值并求解 `λ`\
  \ 的范围。你稍后会看到这样做的计算原因。在许多情况下，$\\alpha=1$ 和 $\\alpha=0$ 或某些中间 `α` 值之间的性能差异并不大。有时它会产生巨大影响，因此你有必要检查几个不同的\
  \ `α` 值，以确保没有无谓地牺牲性能。\n\n## 求解惩罚线性回归问题\n\n在上一节中，你看到确定一个惩罚线性回归模型等同于求解一个优化问题。许多通用数值优化算法可以解决方程\
  \ 4.6、4.8 以及 ElasticNet 中的优化问题，但惩罚线性回归问题的重要性激励研究人员开发出能够快速生成解决方案的专门算法。本节涵盖了这些算法的基础，并运行代码以便你理解每个算法的机制。本节详细介绍了两种算法的机制：最小角回归（或\
  \ LARS）和 glmnet。选择这两种算法是因为它们彼此之间以及与你已经见过的某些方法（如岭回归和向前逐步回归）存在联系。此外，它们都是训练速度非常快的算法，并作为\
  \ Python 包的一部分可用。第 5 章“使用惩罚线性方法构建预测模型”将使用包含这些算法的 Python 包来探索示例问题。\n\n### 理解最小角回归及其与向前逐步回归的关系\n\
  \n一种非常快速且聪明的算法是由 Bradley Efron、Trevor Hastie、Iain Johnstone 和 Robert Tibshirani\
  \ 开发的最小角回归（LARS）算法（http://en.wikipedia.org/wiki/Least-angle_regression）。LARS 算法可以理解为你在第\
  \ 3 章看到的向前逐步回归算法的改进。向前逐步回归算法总结如下：\n\n**向前逐步回归算法**\n\n*   将所有 $\\beta$ 初始化为零。\n\n\
  **在每一步中**\n\n*   在在使用已选变量后找到残差（误差）。\n*   确定哪个未使用变量最能解释残差并将其加入混合。\n\nLARS 算法非常相似。与\
  \ LARS 的主要区别在于，它不是无保留地纳入每个新属性，而是部分纳入它们。LARS 算法的总结如下：\n\n**最小角回归算法**\n\n*   将所有 $\\\
  beta$ 初始化为零。\n\n**在每一步中**\n\n*   确定哪个属性与残差的相关性最大。\n*   如果相关性为正，则将该变量的系数略微增加；如果为负，则略微减少。\n\
  \n\n\n\nLARS 算法解决的是与前面列出的略有不同的问题。然而，它生成的解决方案通常与 Lasso 相同，当存在差异时，差异也相对较小。仔细研究 LARS\
  \ 算法的原因是它与 Lasso 以及向前逐步回归（forward stepwise regression）密切相关，而且 LARS 算法容易概述，代码也相对简洁。通过查看\
  \ LARS 的代码，你将理解更通用的 ElasticNet 求解器的内部原理。更重要的是，你将看到伴随惩罚回归求解器而出现的问题和解决方法。实现 LARS 算法的代码在列表\
  \ 4.1 中所示。\n\n代码主要分为三个部分，在此简要描述，稍后将详细讨论：\n\n*   以列表形式读取数据和表头。\n*   对属性和标签进行归一化。\n\
  *   求解解的系数 ![images](img/c04-i0015.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mn>0</mn><mrow><mo>&#42;</mo></mrow></msubsup><mo>,</mo><msup><mrow><mi>&#946;</mi></mrow><mrow><mo>&#42;</mo></mrow></msup></mrow></math>。\n\
  \n#### 列表 4.1:预测葡萄酒口感的 LARS 算法—larsWine2.py\n\n```python\nfrom Read_Fcns import\
  \ list_read_wine\nimport numpy as np\nfrom sklearn import datasets, linear_model\n\
  from sklearn.preprocessing import StandardScaler\n\nfrom math import sqrt\nimport\
  \ matplotlib.pyplot as plt\n\n#read wine data into lists\nnames, xList, labels =\
  \ list_read_wine()\n\n#Normalize features\nxScaler = StandardScaler()\nxNormalized\
  \ = xScaler.fit_transform(xList)\nnrows, ncols = xNormalized.shape\n\n#Normalize\
  \ labels\nlabelScaler = StandardScaler()\nlabelNormalized = labelScaler.fit_transform(np.array(labels).reshape(\n\
  \          [-1,1]))\n\n#initialize a vector of coefficients beta\nbeta = np.zeros([ncols,\
  \ 1])\n\n#initialize matrix of betas at each step\nbetaMat = beta.copy()\n\n#initialize\
  \ list to accumulate features as they become used\nnzList = []\n\n#number of steps\
  \ and step size\nnSteps = 350\nstepSize = 0.004\n\nfor i in range(1, nSteps):\n\n\
  \    #calculate residuals\n    residuals = labelNormalized - np.dot(xNormalized,\
  \ beta)\n\n    #correlation between attribute columns and residual\n    corr = np.mean(xNormalized\
  \ * residuals, axis=0)\n\n    #locate feature with largest magnitude correlation\
  \ with residuals\n    iStar = np.argmax(np.abs(corr))\n    corrStar = corr[iStar]\n\
  \n    #increment or decrement corresponding coefficient (beta)\n    #increment if\
  \ corr is + decrement if it's -\n    beta[iStar] += stepSize * corrStar / abs(corrStar)\n\
  \    betaMat= np.concatenate( (betaMat, beta.copy()), axis=1)\n\n    #form list\
  \ of non-zero coefficients and accumulate new ones\n    nzBeta = [index for index\
  \ in range(ncols) if beta[index] != 0.0]\n    for q in nzBeta:\n        if (q in\
  \ nzList) == False:\n            nzList.append(q)\n\nnameList = [names[nzList[i]]\
  \ for i in range(len(nzList))]\n\nprint(betaMat.shape)\nprint(nameList)\nfor i in\
  \ range(ncols):\n    #plot range of beta values for each attribute\n    coefCurve\
  \ = betaMat[i].reshape([-1])\n    xaxis = range(nSteps)\n    plt.plot(xaxis, coefCurve)\n\
  \    plt.xlabel(\"Steps\")\n    plt.ylabel(\"Coefficient\")\n    plt.savefig('lars2.png',\
  \ dpi=500)\nplt.show()\n### Printed Output:\n(11, 350)\n['alcohol', 'volatile acidity',\
  \ 'sulfur dioxide', 'chlorides', 'pH', 'citric acid', 'residual sugar', 'density']\n\
  ```\n\n第一步是读取表头和标签。这些使用了普通的 Python 列表。第二步是对属性进行归一化。使用的归一化通常是均值化，以便将属性带到相同的比例范围内。作为说明，以微米为单位缩的属性与以公里为单位的相同属性会有巨大差异，因此仅根据哪一个最有用来选择。\n\
  \nLARS 算法的每一步都会通过固定量增加其中一个 *β*。如果属性具有不同的比例，这种固定增量对不同属性意味着不同的含义。此外，改变一个属性的比例（例如从英里改为英尺）会导致结果不同。由于这些原因，惩罚回归包通常归一化为零均值（通过减去均值）和单位标准差（通过……）。包通常会提供不归一化的选项，但我从未听过不归一化的良好理由。\n\
  \n第三部分也是最后部分是求解 ![images](img/c04-i0057.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mn>0</mn><mrow><mo>&#42;</mo></mrow></msubsup><mo>,</mo><msup><mrow><mi>&#946;</mi></mrow><mrow><mo>&#42;</mo></mrow></msup></mrow></math>。由于算法在归一化变量上运行，因此不需要\
  \ ![images](img/c04-i0058.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mn>0</mn><mrow><mo>&#42;</mo></mrow></msubsup></mrow></math>。它可以解释标签与加权属性之间的任何差异。由于所有属性都已归一化为零均值，因此它们之间没有偏移，也没有需要。\n\
  \n#### *LARS 如何生成数百个不同复杂度的模型*\n\n\n\n\n\n通常现代机器学习算法，特别是惩罚线性回归，生成的是一系列解决方案，而不仅仅是单一解。回顾公式\
  \ 4.6 和 4.8。在这些公式的左侧是 `β`s，右侧是所有由问题可用数据固定的数值值，但有一个例外。在公式 4.6 和 4.8 中，有一个参数 `λ` 必须通过其他方式来确定。正如前文在对这些公式的讨论中所指出的，当\
  \ ![images](img/c04-i0059.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#955;</mi><mo>=</mo><mn>0</mn></mrow></math>时，问题退化为普通最小二法回归；当 ![images](img/c04-i0060.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>&#955;</mi><mo>&#8594;</mo><mi>&#8734;</mi></mrow></math>时，![images](img/c04-i0061.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msup><mrow><mi>&#946;</mi></mrow><mrow><mo>&#42;</mo></mrow></msup><mo>&#8594;</mo><mn>0</mn></mrow></math>。因此，在公式\
  \ 4.6 和 4.8 所述的问题中，`β`s 取决于参数 `λ`。\n\nLARS 算法并没有显式地处理 `λ` 值，但它具有相同的效果。LARS 算法从 `β`s\
  \ 等于零开始，然后对能最减少误差的任何一个 `β`s 添加一个微小的增量。所添加的微小增量按增量的大小增加了所有 `β`s 的绝对值之和。如果增量很小，并且用在最好的属性上，那么该过程就具有求解公式\
  \ 4.8 中最小化问题的效果。你可以在列表 4.1 中追踪这一过程的演变。\n\n基础迭代只是在循环 `nSteps` 的 `for-loop` 开头的几行代码。迭代的起点是\
  \ `β`s 的一个值。在第一次通过时，它们全部被设置为零。在随后的通过中，它们来自上一次通过的结果。迭代包含两个步骤。首先，使用 `β`s 计算残差。`residuals`\
  \ 一项意味着观测结果与预测结果之间的差异。在这种情况下，预测方法包含于将每个属性乘以 `β` 中对应的元素，然后对这些乘积求和。第二步是找到每个属性与残差之间的相关性，以确定哪个属性对减少残差（误差）贡献最大。两个变量之间的相关性是它们偏离均值的变化的乘积，并用它们各自的标准差进行归一化。\n\
  \n彼此缩放版本的变量其相关性为 1 或-1，取决于它们之间的缩放是正还是负。如果两个变量相互独立变化，它们的相关性为零。关于相关性的 Wikipedia 页面\
  \ `http://en.wikipedia.org/wiki/Correlation_and_dependence` 提供了变量之间具有其他程度相关性的良好插图。名为\
  \ `corr` 的列表包含每个属性的计算结果。你可能会注意到，严格来说，代码省略了对均值标准差、`residuals` 以及归一化属性的计算。这在这里行得通，是因为属性已经过归一化，使其标准差均为\
  \ 1，而且由于得到的值将用于寻找最大的相关性，将所有值乘以一个常数不会改变这种顺序。\n\n一旦计算出相关性，确定哪个属性与残差的相关性最大（绝对值最大）就是件简单的事。`β`s\
  \ 列表中的相应元素增加一个微小量。如果相关性为正，则增量为正，反之则为负。然后使用 `β`s 的新值来重新运行迭代。\n\nLARS 算法的最终结果是图 4.3\
  \ 所示的系数曲线。查看这些曲线的方法是想象图中“所走步数”轴上的一个点。在那个点，一条垂直线将穿过所有曲线。如果使用了 350 步，就有 350 组系数。每组系数优化了公式\
  \ 4.8 中的某个 `λ` 值。这引出了应该使用哪一个的问题。这个问题很快将得到讨论。\n\n![图 4.3：LARS 回归的系数曲线](img/c04f003.png)\n\
  \n**图 4.3**：LARS 回归的系数曲线\n\n#### *从 LARS 生成的数百个模型中选择最佳模型*\n\n\n\n\n\n```python\n\
  __author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport numpy\
  \ a np\nfrom sklearn import datasets, linear_model\nfrom math import sqrt\nimport\
  \ matplotlib.pyplot as plt\n\n#将数据读入迭代对象\nnames, xList, labels = list_read_wine()\n\
  \n#归一化 x 和 labels 中的列\nnrows = len(xList)\nncols = len(xList[0])\n\n#将葡萄酒数据读入列表\n\
  names, xList, labels = list_read_wine()\n\n#归一化特征\nxScaler = StandardScaler() \n\
  xNormalized = xScaler.fit_transform(xList)\nnrows, ncols = xNormalized.shape\n\n\
  #归一化标签\nlabelScaler = StandardScaler()\nlabelNormalized = labelScaler.fit_transform(np.array(labels).reshape(\n\
  \                  [-1,1]))\n\n# 构建交叉验证循环以确定最佳系数值。\n\n### 交叉验证折数\nnxval = 10\n\n\
  ### 步数和步长\nnSteps = 350\nstepSize = 0.004\n\n# 初始化误差累加器\nmean_sq_err = np.zeros([nSteps,1])\n\
  \nfor ixval in range(nxval):\n    # 定义测试和训练索引集\n    idxTest = [a for a in range(nrows)\
  \ if a%nxval == ixval]\n    idxTrain = [a for a in range(nrows) if a%nxval != ixval]\n\
  \n    # 定义测试和训练属性及标签集\n    xTrain = xNormalized[idxTrain, :] \n    xTest = xNormalized[idxTest]\
  \ \n    labelTrain = labelNormalized[idxTrain] \n    labelTest = labelNormalized[idxTest]\
  \ \n\n    # 在训练数据上训练 LARS 回归\n    nrowsTrain = len(idxTrain)\n    nrowsTest = len(idxTest)\n\
  \n    # 初始化系数向量 beta\n    beta = np.zeros([ncols, 1])\n  \n  for iStep in range(nSteps):\n\
  \      # 计算残差\n      residuals = labelTrain - np.dot(xTrain, beta)\n\n      # 特征列与残差之间的相关性\n\
  \      corr = np.mean(xTrain * residuals, axis=0) \n\n      # 定位与残差相关性绝对最大的特征\n\
  \      iStar = np.argmax(np.abs(corr))\n      corrStar = corr[iStar]\n  \n     \
  \ # 更新系数 \n      beta[iStar] += stepSize * corrStar / abs(corrStar)\n    \n    \
  \  # 计算样本外平方误差\n      err = labelTest - np.dot(xTest, beta)\n      mean_sq_err[iStep,0]\
  \ += np.mean(err*err) / float(nxval)\n    \n    cvCurve = mean_sq_err\n    minPt\
  \ = np.argmin(cvCurve)\n    minMse = cvCurve[minPt]\n    print(\"Minimum Square\
  \ Error\", minMse)\n    print(\"Index of Minimum Square Error\", minPt)\n    xaxis\
  \ = range(len(cvCurve))\n    plt.plot(xaxis, cvCurve)\n    plt.xlabel(\"Steps Taken\"\
  )\n    plt.ylabel((\"Mean Square Error\"))\n    #plt.savefig('larsCV.png', dpi=500)\n\
  \    plt.show()\n```\n\n### 在 Python 代码中实现模型选择的交叉验证\n\n`Listing 4.2` 中的代码开头与 `Listing\
  \ 4.1` 中的代码相似。区别在于循环 `nxval` 次的交叉验证循环。在这种情况下，`nxval = 10`，但它也可以设置为其他值。使用多少折数的权衡在于：折数越少，意味着你用于训练的数据分量就越少。如果你取\
  \ 5 折，那么你就留下了 20% 的数据。如果你取 10 折，则只留下了 10%。正如你在`第 3 章` 中看到的，在较少的数据上训练会导致算法所实现的准确性下降。然而，采用更多的折数意味着对训练过程进行更多的迭代。\n\
  \n在交叉验证循环之前，会初始化一个误差列表。该误差列表将包含 LARS 算法演过程中每一步的误差列表。它将积累所有 10 折交叉验证中每一步的误差。在交叉验证循环内部，除非由于某种原因，否则你会看到训练集和测试集的定义。例如，你可能需要进行`分层采样`（stratified\
  \ sampling）。假设你正试图在不平衡的数据上构建分类器，因此某些类样本非常少。你希望训练集具有完整数据的代表性。你可能需要按类别划分数据，以确保类别在样本内和样本外数据中都有代表。\n\
  \n你可能希望使用随机函数来定义训练集和测试集。你需要意识到数据中的任何可能与采样过程产生不利影响的模式（即如果观测值不可交换）。例如，如果观测值是按周一到周五的顺序排列的。\n\
  \n### 在每个交叉折上积累误差并评估结果\n\n在定义了训练和测试集后，开始对 L 算法进行迭代。这与 `Listing 4.1` 中的过程非常相似，但有几点重要区别。首先，算法是在训练集上执行的，而不是完整数据集；其次，在迭代的每一步，使用当前的\
  \ `beta` 值结合测试属性和测试标签来确定测试集的误差。这种计算位于循环的底部。每当更新 `beta`，就会将其应用于测试数据，并将误差积累在 `error`\
  \ 列表中。通过对 `error` 列表每个项进行平方和平均，产生了所有 10 折交叉验证中每次迭代的均方误差曲线。\n\n你可能会担心测试数据的使用是否正确。始终要警惕防止测试数据泄露到训练过程中。有很多方法会让自己违反这一必要性。在这种情况下，你会注意到计算\
  \ `beta` 的增量并没有使用测试数据。\n\n### 模型选择与训练序列的实际考量\n\nMSE 与迭代步数之间的曲线如 `图 4.4` 所示。该曲线表现出一种常见的模式：在整个范围内几乎是单调下降的。严格来说，它确实在\
  \ 311 附近有一个最小值点，正如相关的程序输出所示。但图表显示该最小值相当较弱，并不尖锐。在某些情况下，此曲线会在某处有一个尖锐的最小值，并在最小值的左右都会显著增加。你使用交叉验证的结果来确定\
  \ LARS 生成的 350 个解决方案中的哪一个用于预测。在这种情况下，最小值位于第 311 步。第 311 组 `beta` 就是要部署的系数。当对部署解决方案存在任何歧一时，通常最好部署更保守的解决方案。对于惩罚回归来说，更保守意味着系数值较小。按照惯例，样本外性能通常将复杂度较低的模型放在左侧，将复杂度更高的模型放在右侧。复杂度较低的模型具有更好的泛化误差；也就是说它们在在新数据上的表现更具预测性。更保守的模型将是样本外性能图左侧的模型。\n\
  \n\n\n\n\n![图 4.4：LARS 在葡萄酒数据上的交叉验证均方误差](img/c04f004.png)\n\n图 4.4: 葡萄酒数据上 `LARS`\
  \ 上的交叉验证均方误差\n\n关于 `LARS` 算法和交叉验证过程的这段描述，经过了先在整个数据集上训练算法、后运行交叉验证的调整。在实践中，你可能会先运行交叉验证，然后在整个数据集上训练算法。交叉验证的目的是确定你能够达到什么水平的\
  \ `MSE`（或其他）性能，并了解你的数据集能够支持多大复杂的模型。如果你还记得，第 3 章 讨论了数据集大小和模型复杂性的问题。交叉验证（或其他留出数据以获得性能的可靠估计的方法）是你为你将要部署的模型确定最佳模型复杂度的方法。你确定的是复杂度，而不是具体的模型（即不是特定的\
  \ `β` 集合）。如列表 4.2](#c04.xhtml#c04-fea-0003) 所示，通过 10 折交叉验证，你实际上训练了 10 个模型，并且无法在这\
  \ 10 个模型中做出决定。最佳实践是在完整数据集上训练，并使用交叉验证的结果来决定部署哪一个模型。在列表 4.2](#c04.xhtml#c04-fea-0003)\
  \ 所示的示例中，交叉验证在训练过程的第 311 步给出了 0.59 的最小 `MSE`。图 4.5](#c04.xhtml#c04-fig-0013) 中的系数曲线是在完整数据集上训练的。之所以在此介绍交叉验证，是因为我们不知道图\
  \ 4.5](#c04.xhtml#c04-fig-0013) 中表示的 350 组系数中哪一个应该被部署。交叉验证得出了对 `MSE` 的可靠估计，并告诉我们部署从完整数据集上训练出的第\
  \ 311 个模型。\n\n![图 4.5：S() 函数的图](img/c04f005.png)\n\n图 4.5: `S()` 函数的图\n\n### 使用\
  \ Glmnet：极快速且通用\n\n`glmnet` 算法由斯坦福大学的 Jerome Friedman 教授及其同事于 2010 年开发。`glmnet`\
  \ 算法解决了 `ElasticNet` 问题。记得 `ElasticNet` 问题包含了一个惩罚函数的泛化，该函数包含了 `Lasso` 惩罚（绝对值之和）和岭惩罚（平方之和）。`ElasticNet`\
  \ 有一个参数 `λ`，用于确定系数惩罚相对于拟合误差的惩罚程度。它还具有一个参数，决定惩罚接近岭回归 !(images<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math>)\
  \ 还是 `Lasso` !(images<math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>&#945;</mi><mo>=</mo><mn>1</mn></mrow></math>)。`glmnet`\
  \ 算法产生完整的系数曲线，类似于 `LARS` 算法。`LARS` 算法通过将系数量累积到 `β` 中来推动曲线前进，而 `glmnet` 算法通过稳定地减少\
  \ `λ` 来推动系数曲线向前移动。方程 4.9](#c04.xhtml#c04-fig-0014) 显示了 Friedman 论文中的关键方程——求解 `ElasticNet`\
  \ 方程系数的关键迭代方程。\n\n![方程 4.9：glmnet 的逐坐标更新](img/c04-disp-0010.png)\n\n方程 4.9: `glmnet`\
  \ 的逐坐标更新\n\n方程 4.9](#c04.xhtml#c04-fig-0014) 是 Friedman 论文中方程 5](#c04.xhtml#c04-fig-0005)\
  \ 和方程 8](#c04.xhtml#c04-fig-0008) 的组合（供想要跟进数学的同学）。它看起来很复杂，但稍加观察就会发现它与你在上一节中看到的 `LARS`\
  \ 方法之间的相似之处和关系。\n\n#### Glmnet 和 LARS 算法机制的比较\n\n方程 4.9](#c04.xhtml#c04-fig-0014)\
  \ 给出了 `β` 的基本更新方程。`LARS` 的更新方程是“找到与残差相关性幅度最大的属性，并对其进行小幅增加（或减少）”。方程 4.9](#c04.xhtml#c04-fig-0014)\
  \ 稍微复杂一些。它使用箭头而不是等号。箭头意味着“得到”。注意 ![images](img/c04-i0068.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math>\
  \ 出现在箭头的两侧。箭头的右侧是 ![images](img/c04-i0069.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#945;</mi><mo>=</mo><mn>1</mn></mrow></math> 的旧值，而左侧（箭头指向的地方）是 ![images](img/c04-i0073.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math>\
  \ 的新值。在经过 9 次迭代后，![images](img/c04-i0066.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math> 停止变化（更准确地说，变化变得微忽略其道）。一旦\
