  \ 包中可用的集成方法。示例展示了这些方法在各种类型问题上的应用。本章还涵盖了回归、多分类，并讨论了这些主题，例如为 `XGBoost`、`Python` 和\
  \ `PySpark` 集成方法编写输入变量编码。这些示例涵盖了你在实践中可能会遇到的许多问题类型。示例还展示了集成算法的一些重要特性——这也是它们成为数据科学家首选的原因。集成方法相对易于使用——它们没有许多需要调节的参数，提供了变量重要性以帮助模型开发的早期阶段，并且通常能提供可实现的最佳性能。本章演示了可用\
  \ `XGBoost`、`sklearn` 和 `PySpark` 包的使用。[第 6 章中提供的背景知识有助于你理解在 Python 包中看到的参数和调整。在示例代码中看到它们的运行可以帮助你开始使用这些包。\n\
