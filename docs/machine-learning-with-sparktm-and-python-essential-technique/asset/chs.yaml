  \ 'density',\n'pH', 'sulphates', 'alcohol', 'quality']\nFinal training rmse [0.4301812\
  \ 0.4299654 0.4296578 0.429428 0.4292482]\nFinal test rmse [0.5996246 0.5995986\
  \ 0.599513 0.5995322 0.5994808] \n```\n\n第一部分代码读取数据集，将属性矩阵与目标分离，转换为 `numpy` 数组，然后形成训练集和测试子集。下一步是定义一个名为\
  \ `params` 的 Python 字典。该字典包含了定义 GBM 模型所需的参数值。其中某些参数或多是标准的，而另一些在不同问题之间会有差异。第一个参数是\
  \ `objective` 函数。由于这是一个回归问题，`reg:linear` 是这里的惯常选择。如果你的问题标签呈现指数级分布（没有负值，正值聚集在 0 附近，且值越大分布越稀疏），那么你可能尝试逻辑回归。\n\
  \n一旦定义了参数，下一步是实例化模型对象。这里的训练循环正在执行 5 折交叉验证。训练集和测试集的索引在列表推导式中定义，用于为每一折定义合适的训练集和测试集。然后，通过调用名为\
  \ `reg_model` 的 `xgb.XGBRegressor` 对象的 `fit` 函数来训练模型。`fit` 函数中定义的 `eval_set` 参数被定义为元组列表。其中一对是训练特征集和相应的标签。另一对则是测试数据。`eval_metric='rmse'`\
  \ 告诉 `fit` 函数将模型预测应用于特征上，然后计算两者之间的均方根误差（RMSE）。\n\nXGBoost 设备向 `reg_model.evals_result()`\
  \ 返回一个字典。这些字典中的每一个都包含了随着交叉验证折中添加树而生成的逐点训练误差和测试 RMSE。这使得通过列表推导式聚合交叉验证折的结果变得简单，并将生成的数组列表转换为二维\
  \ `numpy` 数组。\n\n最后一段代码在全集上训练一个新模型。`data_matrix = xgb.DMatrix(data=X, label=y, feature_names=names[0:-1])`。`wine_xg\
  \ = xgb.train(params=params, dtrain=data_matrix, num_boost_round=500)` 调用之后是 `xgb.plot_importance(wine_xg)`。\n\
  \n#### 评估梯度提升的性能\n\n`图 7.1` 显示了沿 x 轴趋于平缓的外样本误差。有时，通过降低学习率并重新训练，可以再榨出一点性能。\n\n###\
  \ 构建随机森林模型预测葡萄酒口味\n\n随机森林并没有包含在 XGBoost 中，但 scikit-learn 拥有一个很好的随机森林包。竞赛表现的证据以及近年来开发工作的相对强度表明，梯度提升在性能上比随机森林具有优势。但随机森林在使用上显然更加简单。\n\
  \n\n\n\n\nPython scikit-learn 的集成学习模块包含一个用于回归问题的随机森林算法。该模块还包含一个梯度提升算法。首先，本节将解释实例化\
  \ `RandomForestRegressor` 类成员所需的所需的参数。然后，本节将使用 `RandomForestRegressor` 类为葡萄酒口感数据训练一个随机森林模型，并探索该模型的性能。\n\
  \n### 构建 RandomForestRegressor 对象\n\n以下是 `sklearn.ensemble.RandomForestRegressor`\
  \ 的类构造函数：\n\n```\nsklearn.ensemble.RandomForestRegressor(n_estimators=10, criterion=\n\
  'mse', max_depth=None, min_samples_split=2, min_samples_leaf=1,\nmax_features= 'auto',\
  \ max_leaf_nodes=None, bootstrap=True, \noob_score=False, n_jobs=1, random_state=None,\
  \ verbose=0, \nmin_density=None, compute_importances=\nNone)\n```\n\n以下描述自 sklearn\
  \ 文档，但仅涵盖了你最可能想要修改的参数值。对于这些参数，列表描述了如何选择默认值的替代方案。如需查看此处未涵盖的参数描述，请参阅 sklearn 包文档。以下列表描述了这些参数：\n\
  \n- `n_estimators`\n  *整数, 可选 (默认 = 10)*\n  这是集成中树的数量。如果代码写得正确，默认值是可以的，但通常你可能需要比\
  \ 10 棵树更多来获得最佳性能。你可以尝试不同的数量，并感受需要多少棵。正如本书一直强调的，适当的模型复杂度（树的深度和树的数量）取决于问题的复杂性以及你拥有的数据量。良好的起点是\
  \ 100–500。\n\n- `max_depth`\n  *整数或 None, 可选 (默认=None)*\n  如果此参数设置为 None，树将一直生长，直到所有叶节点都是纯的，或者它们包含的示例少于\
  \ `min_samples_split`。作为指定树深的替代方案，你可以使用 `max_leaf_nodes` 来指定树中叶节点的数量。如果你指定了 `max_leaf_nodes`，则会忽略\
  \ `max_depth`。将 `max_depth` 设置为 `auto` 并生长全深度树可能会有性能优势。这也是与全深度树相关的训练时间成本。如果你需要多次训练运行来完成建模过程，你可能想尝试深度。\n\
  \n- `min_samples_split`\n  *整数, 可选 (默认=2)*\n  包含少于 `min_samples_split` 个示例的节点不会被分裂。分裂小节点是过拟合的来源。\n\
  \n- `min_samples_leaf`\n  *整数, 可选 (默认=1)*\n  如果分裂会导致节点少于 `min_samples_leaf` 个示例，则不进行分裂。此参数的默认值会导致该参数被忽略，这通常是可以接受的——特别是当你对数据集进行前几次训练运行时。你可以从两种方式考虑为此参数选择一个有意义的值：一种分配给叶节点的值是该节点中示例的平均值，如果叶节点中有一个样本，你将获得方差更低的平均值；另一种是将此参数视为控制树深度的另一种方法。\n\
  \n- `max_features`\n  *整数、浮点数或字符串, 可选 (默认=None)*\n  在寻找最佳分裂时考虑的特征数量取决于 `max_features`\
  \ 的设置以及问题中特征的数量。假设问题中的特征数量为 `nFeatures`。那么：\n\n  - 如果 `max_features` 的类型为 `int`，则每次分裂考虑\
  \ `max_features` 个特征。注意：`max_features > nFeatures` 会报错。\n  - 如果 `max_features` 的类型为\
  \ `float`，则 `max_features` 是待考虑特征的比例：`int(max_features * nFeatures)`。\n  - 可能的字符串值包括：\n\
  \    ```\n    auto max_features=nFeatures\n    sqrt max_features=sqrt(nFeatures)\n\
  \    log2 max_features=log2(nFeatures)\n    如果 max_features=None, 则 max_features=nFeatures.\n\
  \    ```\n  Breiman 和 Cutler 建议回归问题使用 `sqrt(nFeatures)`。答案通常对 `max_features` 并不敏感，但这个参数可能会产生一些影响，因此你可能想测试几个替代值。\n\
  \n- `random_state`\n  *int、RandomState 实例或 None (默认=None)*\n  - 如果类型为 `integer`，则该整数用作随机数生成器的种子。\n\
  \  - 如果 `random_state` 是 `RandomState` 的实例，则使用该实例作为随机数生成器。\n  - 如果 `random_state`\
  \ 为 `None`，则随机数生成器是 `numpy.random` 使用的 `RandomState` 实例。\n\n`RandomForestRegressor`\
  \ 有几个属性，包括构成集成的训练树。有一个 `predict` 方法将使用训练树进行预测，因此你通常不会直接访问它们。你可能想要访问变量 `importances`。\n\
  \n- `feature_importances`\n  这是一个数组，其长度等于问题中特征的数量（之前称为 `nFeatures`）。数组中的值是正浮点数，表示相应属性的相对重要性。`importances`\
  \ 由 Breiman 在关于随机森林的原始论文发明的程序确定。基本思想是：一次随机置换每个属性的值，并确定模型预测准确率的变化。预测准确率受越严重，该属性越重要。\n\
  \n以下是所用方法的描述：\n\n- `fit(XTrain, yTrain, sample_weight=None)`\n  `XTrain` 是属性值的数组。它有\
  \ `nInstances` 行和 `nFeature` 列。`yTrain` 是目标数组。`y` 也有 `nInstances` 行。在这一章看到的示例中，`yTrain`\
  \ 将只有单列，但该方法可以拟合具有不同目标的多个模型。对于这种情况，`y` 将有 `nTargets` 列——每组结果对应一列。`sample_weight`\
  \ 允许为训练数据中的每个实例分配不同的权重。它可以采取两种形式之一。默认值 `None` 导致所有输入实例权重相等。要对每个实例应用不同权重，`sample_weight`\
  \ 应该是一个具有 `nInstances` 行和一列的数组。\n\n- `predict(XTest)`\n  `XTest` 是产生预测的属性值数组。`predict()`\
  \ 的输入数组与用于训练的 `fit()` 方法的数组列数相同，但行数可以不同，可能只有一行。`predict()` 输出的行与训练时目标数组 `y` 的行格式相同。\n\
  \n字体 使用 RandomForestRegressor 为葡萄酒口感\n\n列表 7-2 显示了如何使用 sklearn 版本的随机森林算法构建一个预测葡萄酒口感的集成模型。\n\
  \n\n\n\n代码从 UCI 数据存储库读取葡萄酒数据集；通过一些处理操作将属性、标签和属性名称提取到列表中；并将列表转换为 `numpy` 数组，以满足 `RandomForestRegressor`\
  \ 的输入要求。将这些输入对象以 `numpy` 数组形式存在的一个额外益处是，它使得可以使用 sklearn 的工具函数 `train_test_split`\
  \ 来构建输入的训练集和测试集。代码将 `random_state` 设置为指定的整数值，而不是让随机数生成器选择一个不可重复的内部值。这样做是为了确保你在运行代码时，得到的图表和数值与此处显示的结果一致。在开发过程中，设置\
  \ `random_state` 也会非常方便，因为结果中的随机性可能会掩盖你正在做的更改。在实际进行模型训练时，你可能希望将 `random_state` 设置为默认值\
  \ `None`。固定 `random_state` 会固定留集（holdout set），结果是重复的参数调整和重新训练可能会在你的留集上产生过拟合。\n\n\
  代码的下一步是定义一个集成规模列表，以生成性能图，显示性能如何随着集成中树数量的变化而变化。为了生成详细的图表，Listing 7-2 中选择的数量首先训练 10\
  \ 棵树，然后捕结果并分批训练更多树。增量式训练让你能够看到误差与树数量之间曲线的形状。这样，你就可以评估最终模型中需要多少棵树了。Listing 7-2 中的代码展示了如何使用\
  \ `warm_start` 参数，以便在添加新树时累积训练结果。\n\n### Listing 7-2: 构建随机森林预测葡萄酒质量—wine_rf.py\n\
  \n```python\n__author__ = 'mike_bowles'\n\nimport numpy as np\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.ensemble import RandomForestRegressor\n\
  from sklearn.metrics import mean_squared_error\nimport matplotlib.pyplot as plt\n\
  from Read_Fcns import list_read_wine\nfrom math import sqrt\n\n\n# 从 UCI 网站读取葡萄酒质量数据\n\
  names, xList, labels = list_read_wine()\n\nnrows = len(xList)\nncols = len(xList[0])\n\
  \nX = np.array(xList)\ny = np.array(labels)\nwineNames = np.array(names)\n\n# 固定留集\
  \ 30% 的数据行\nxTrain, xTest, yTrain, yTest = train_test_split(X, y, test_size=0.30,\
  \ \n        random_state=531)\n\n# 针对不同的森林大小训练随机森林 - 观察 mse 的变化\nrmseOos = [] \n\
  depth = None  #None - 给最大深度树，尝试限制\nmaxFeat  = 4 #尝试调整\n\nnum_iterations = 50 # 训练\
  \ 10 棵额外树共 50 次\ntrees_per_iteration = 10\n\nwineRFModel = RandomForestRegressor(n_estimators=trees_per_iteration,\n\
  \                      max_depth=depth, \n                      max_features=maxFeat,\
  \ \n                      oob_score=False, \n                      random_state=531,\
  \ \n                      warm_start=True)\n\nfor iters in range(num_iterations):\n\
  \    wineRFModel.fit(xTrain,yTrain)\n    wineRFModel.n_estimators += trees_per_iteration\n\
  \    \n    # 在测试集上累积 mse\n    prediction = wineRFModel.predict(xTest)\n    rmseOos.append(sqrt(mean_squared_error(yTest,\
  \ prediction)))\n\n\nprint(\"RMSE\" )\nprint(min(rmseOos))\nprint(rmseOos[-1])\n\
  \n# 绘制训练和测试误差与集成中树数量的关系\nnum_trees = [i * trees_per_iteration for i in range(num_iterations)]\n\
  plt.plot(num_trees, rmseOos)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('Root\
  \ Mean Squared Error')\nplt.title('RF Performance vs Number of Trees')\nplt.savefig('wine_rf.png',\
  \ dpi=500)\nplt.show()\n\n# 绘制特征重要性\nfeatureImportance = wineRFModel.feature_importances_\n\
  \n# 按最大重要性归一化\nfeatureImportance = featureImportance / featureImportance.max()\n\
  sorted_idx = np.argsort(featureImportance)\nbarPos = np.arange(sorted_idx.shape[0])\
  \ + .5\nplt.barh(barPos, featureImportance[sorted_idx], align='center')\nplt.yticks(barPos,\
  \ wineNames[sorted_idx])\nplt.xlabel('Variable Importance')\nplt.subplots_adjust(left=0.2,\
  \ right=0.9, top=0.9, bottom=0.1)\nplt.title('Relative Importance of Features')\n\
  plt.savefig('wine_rf.png', dpi=500)\nplt.show()\n\n### 输出结果\nRMSE\n0.5618291717498893\n\
  0.56441690429093 \n```\n\n\n\n\n非数值属性是指那些带有多个离散非数值值的属性。人口普查记录有许多非数值属性——例如，已婚、单身、离婚；家庭所在的州是另一个例子。非数值属性可以提高预测的准确性，但\
  \ Python 的集成方法需要数值输入。在第 4 章“惩罚化线性回归”和第 5 章“使用惩罚化线性方法构建预测模型”中，你已经看到如何对因子变量进行编码，以便将其整合到惩罚线性回归中。同样的技术也适用于这里。我们将估计鲍鱼年龄的问题作为一个示例来说明该技术。\n\
  \n![图 7.4: 随机森林估计变量重要性](img/c07f004.png)\n\n**图 7.4**: 随机森林估计变量重要性\n\n### 在 Python\
  \ 中为梯度提升回归对鲍鱼性别进行编码\n\n假设你的问题有一个具有 *n* 个值的属性。“美国州”属性有 50 个值，而“婚姻状况”有 3 个值。为了对 *n*\
  \ 值因子变量进行编码，你需要创建 *n – 1* 个新的虚拟属性。如果变量取第 *i* 个值，则第 *i* 个虚拟变量为 1，所有其他虚拟变量为 0。如果因子变量取第\
  \ *n* 个值，则所有虚拟变量都为 0。鲍鱼数据将说明这一点。代码列表 7-3 包含了训练梯度提升模型的代码。\n\n#### 代码列表 7-3: 训练梯度提升模型预测鲍鱼年龄—abalone_gbm.py\n\
  \n```\n__author__ = 'mike_bowles'\n\nimport matplotlib.pyplot as plt\nimport numpy\
  \ as np \nfrom sklearn.metrics import mean_squared_error\nfrom Read_Fcns import\
  \ list_read_abalone\nimport xgboost as xgb\n\n\n#read abalone data\nxList, labels\
  \ = list_read_abalone()\nnames = ['Sex', 'Length', 'Diameter', 'Whole weight', 'Shucked\
  \ weight', 'Visera weight', 'Shell weight', 'Rings']\n\n#code three-valued sex as\
  \ numeric\nxCoded = []\nfor row in xList:\n    #first three-valued sex\n    codedSex\
  \ = [0.0, 0.0]\n    if row[0] == 'M': codedSex[0] = 1.0\n    if row[0] == 'F': codedSex[1]\
  \ = 1.0\n    numRow = [float(row[i]) for i in range(1, len(row))]\n    rowCoded\
  \ = list(codedSex) + numRow\n    xCoded.append(rowCoded)\n\nnamesCoded = np.array(['Sex1',\
  \ 'Sex2', 'Length', 'Diameter', 'Whole weight', 'Shucked weight', 'Visera weight',\
  \ 'Shell weight', 'Rings'])\nnrows = len(xCoded)\nncols = len(namesCoded)\n\n#form\
  \ x and y into numpy arrays and make column\nX = np.array(xCoded)\ny = np.array(labels)\n\
  data_dmatrix = xgb.DMatrix(data=X, label=y, feature_names=namesCoded)\n\n# Train\
  \ gradient boosting model to minimize squared error\nparams = {\"objective\":\"\
  reg:linear\", \"colsample_bytree\": 0.6, \"learning_rate\": 0.02, \"max_depth\"\
  : 5, \"alpha\": 0, \"silent\":1}\ncv_results = xgb.cv(dtrain=data_dmatrix, params=params,\
  \ nfold=5, num_boost_round=500, early_stopping_rounds=50, metrics=\"rmse\", as_pandas=True,\
  \ seed=123)\n\nprint(cv_results.head())\nprint(cv_results.tail())\nplt1 = cv_results['train-rmse-mean']\n\
  plt2 = cv_results['test-rmse-mean']\n\nplt.plot(plt1)\nplt.plot(plt2)\nplt.xlabel('Number\
  \ of Trees in Ensemble')\nplt.ylabel('RMSE')\nplt.title('Train and Test Errors')\n\
  plt.savefig('abaloneGB_train_test_rmse.png', dpi=500)\nplt.show()\n\n#retrain on\
  \ full set for importance\nabalone_xg = xgb.train(params=params, dtrain=data_dmatrix,\
  \ num_boost_round=500)\nxgb.plot_importance(abalone_xg)\nplt.rcParams['figure.figsize']\
  \ = [5, 5]\nplt.savefig('abaloneGBM_variable_importance.png', dpi=500)\nplt.show()\n\
  \nPrinted Output:\n   train-rmse-mean  train-rmse-std  test-rmse-mean  test-rmse-std\n\
  0         9.783807        0.037574        9.783015       0.150659\n1         9.600569\
  \        0.036505        9.599989       0.150391\n2         9.421384        0.036425\
  \        9.421522       0.149063\n3         9.246224        0.035644        9.247294\
  \       0.147877\n4         9.074526        0.035122        9.076285       0.147339\n\
  \      train-rmse-mean  train-rmse-std  test-rmse-mean  test-rmse-std\n397     \
  \    1.648841        0.022800        2.135843       0.061627\n398         1.647947\
  \        0.022618        2.135824       0.061578\n399         1.647266        0.022787\
  \        2.135831       0.061678\n400         1.646389        0.022872        2.135730\
  \       0.061664\n401         1.645507        0.023043        2.135672       0.061829\n\
  ```\n\n### 使用梯度提升评估性能和编码变量重要性\n\n代码列表 7-3](#c07.xhtml#c07-fea-0003) 中的打印输出显示了梯度提升在测试数据上的性能。注意，经过数值编码的性别变量位于底部。你会发现它们在随机森林中也占据底部位置。本节介绍了预测鲍鱼年龄——即通过切开贝壳并数圈数的方法。用于预测的测量值是其他易于量的数量，如壳重量、去壳重量和动物性别。由于鲍鱼在生命中某些阶段性别不确定，因此性别变量有三个值。本节演示了如何处理该变量，并展示了它在梯度提升模型中的工作原理。在本章后面的“使用梯度提升分类玻璃”节中，你将看到如何实现网格搜索来自动调优。尝试在此示例中实现它以加速你的调优过程。图\
  \ 7.5 显示了随着树数量的增加，训练误差和测试误差是如何下降的。降低学习率可能会帮助。\n\n\n\n\n\n```python\n__author__ =\
  \ 'mike_bowles'\n\nimport numpy as np\nimport matplotlib.pyplot as plot\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.ensemble import RandomForestRegressor\n\
  from sklearn.metrics import mean_squared_error\nfrom Read_Fcns import list_read_abalone\n\
  \n#read abalone data\nxList, labels = list_read_abalone()\n\nnames = ['Sex', 'Length',\
  \ 'Diameter', 'Height', 'Whole weight',\n         'Shucked weight', 'Viscera weight',\
  \ 'Shell weight', \n         'Rings']\n\n#code three-valued sex attribute as numeric\n\
  xCoded = []\nfor row in xList:\n    #first code the three-valued sex variable\n\
  \    codedSex = [0.0, 0.0]\n    if row[0] == 'M': codedSex[0] = 1.0\n    if row[0]\
  \ == 'F': codedSex[1] = 1.0\n\n    numRow = [float(row[i]) for i in range(1,len(row))]\n\
  \    rowCoded = list(codedSex) + numRow\n    xCoded.append(rowCoded)\n\nnamesCoded\
  \ = np.array(['Sex1', 'Sex2', 'Length', 'Diameter', 'Height', \n        'Whole weight',\
  \ 'Shucked weight', 'Viscera weight', \\\n        'Shell weight', 'Rings'])\n\n\
  nrows = len(xCoded)\nncols = len(xCoded[1])\n\n#form x and y into numpy arrays and\
  \ make up column names\nX = np.array(xCoded)\ny = np.array(labels)\n\n#break into\
  \ training and test sets.\nxTrain, xTest, yTrain, yTest = train_test_split(X, y,\
  \ \n                                test_size=0.30, \n                         \
  \       random_state=531)\n\n#instantiate model\ndepth = None\nmaxFeat = 4\nsubsamp\
  \ = 0.5\n\n#train random forest over ensemble sizes to see how the mse changes\n\
  \nnum_iterations = 50 #train 10 additional trees 50 times\ntrees_per_iteration =\
  \ 10\n\nabaloneRFModel = RandomForestRegressor(\n                              \
  \ n_estimators=trees_per_iteration, \n                               max_depth=depth,\
  \ \n                               max_features=maxFeat,\n                     \
  \          oob_score=False, \n                               random_state=531, \n\
  \                               warm_start=True)\n\nrmseOos = []\nfor iters in range(num_iterations):\n\
  \    abaloneRFModel.fit(xTrain,yTrain)\n    abaloneRFModel.n_estimators += 10\n\
  \    \n    #Accumulate mse on test set\n    prediction = abaloneRFModel.predict(xTest)\n\
  \    rmseOos.append(sqrt(mean_squared_error(yTest, prediction)))\n\nprint(\"RMSE\"\
  \ )\nprint(min(rmseOos))\n\n#plot training and test errors vs number of trees in\
  \ ensemble\nnum_trees = [i * trees_per_iteration for i in range(num_iterations)]\n\
  plt.plot(num_trees, rmseOos)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('Root\
  \ Mean Squared Error')\nplt.title('Random Forest RMSE on Abalone Data')\n#plt.ylim([0.0,\
  \ 1.1*max(mseOob)])\nplt.savefig('abalone_rf.png', dpi=500)\nplt.show()\n\n# Plot\
  \ feature importance\nfeatureImportance = abaloneRFModel.feature_importances_\n\n\
  # normalize by max importance\nfeatureImportance = featureImportance / featureImportance.max()\n\
  sortedIdx = np.argsort(featureImportance)\nbarPos = np.arange(sortedIdx.shape[0])\
  \ + .5\nplt.barh(barPos, featureImportance[sortedIdx], align='center')\nplt.yticks(barPos,\
  \ namesCoded[sortedIdx])\nplt.xlabel('Variable Importance')\nplt.title('Relative\
  \ Importance of Features')\nplt.subplots_adjust(left=0.2, right=0.9, top=0.9, bottom=0.1)\n\
  plt.savefig('abalone_rf_var_imp.png', dpi=500)\nplt.show()\n\n Printed Output:\n\
  \ RMSE\n2.0709035863949925 \n```\n\n打印输出：\nListing 7-4 中的打印输出显示随机森林的 RMSE 误差为 2.07。这比梯度提升在经过微调后显示的结果要低。两种方法之间的性能差异可能很小。它已经相当低（0.06\
  \ ~ 3%）。这些差异对你来说可能非常重要。另一方面，随机森林不需要大量的调优，因此它用更短的开发时间得到了答案。\n\n数据中的属性之一是性别。性别有三种可能的值：男性、女性和未确定（幼年）。因此，性别属性是一个三值因子。如果属性为\
  \ `M`，则第一个元素被更改为 `1.0`。如果属性为 `F`，则第二个元素被更改为 `1.0`。否则，列表保留为零。\n\n### 评估性能和编码变量的重要性\n\
  \n图 7.7 显示了均方误差随着集成中树数量的增加而减少。预测年龄的误差值为 2.07。将其与你在第 2 章中看到的统计摘要进行比较。年龄（壳）的标准差为 3.22。因此，随机森林能够预测测试群体中\
  \ 56%的年龄。\n\n图 7.8 显示了随机森林的相对重要性。为了处理非数值性别而创建的性别变量在模型中似乎并不重要。\n\n### 使用 Python 集成方法解决二分类问题\n\
  \n本节涵盖了两种基本的分类问题：二分类和多分类。二分类问题是指具有两种可能结果的问题。例如，“点击了广告”或“未点击广告”。这里用于说明集成方法使用的示例是岩石与地雷的问题。多分类问题是指两个两个可能结果的问题。根据化学成分对玻璃样本进行分类说明了如何使用\
  \ Python 集成方法处理此类问题。\n\n### 使用 Python 梯度提升检测未爆炸地雷\n\nListing 7-5 展示了使用 XGBoost 构建未爆炸地雷二分类器的代码。此示例使用了\
  \ XGBoost 的函数形式，以便在训练过程中实现交叉验证。你可能会发现参数之间的差异非常小。差异出现在三个地方：一个是目标函数需要从回归更改；第二个是标签需要变为二值；第三个是性能指标需要更改。\n\
  \n\n\n\n\n二分类有三种目标函数。它们分别是 `binary:logistic`、`binary:logitraw` 和 `binary:hinge`。代码列表\
  \ 7-5 中的代码使用了 `binary:logistic`。尝试更改这些选项，并观察它们如何影响你所获得的性能。它们之间存在一些重要的区别。一种可能性是 `error`\
  \ 或 `error@t`。梯度提升将为两个类别中的每个类别计算类别概率估计。误差指标会将预测概率与 0.5 的阈值进行比较。高于 0.5 的预测结果为 1，低于\
  \ 0.5 的预测结果为 0。指标 `error` 指标的计算方法是将相对于真实标签的错误次数相加。你的问题可能要求你对某一类型的错误比另一种类型更加谨慎。例如，将分类为\
  \ 1 可能会导致危险的手术。调高阈值将导致预测为 1 的数量减少。你可以通过使用 `error@0.6` 将阈值向上调整到 0.6。\n\n除了这些分类错误计数指标外，你还可以选择\
  \ `auc`（ROC 曲线下的面积）作为指标。对于该指标，数值越大越好，它的优点是不需要选择阈值值。还有 `aucpr`，即精确率召回率曲线下的面积。代码列表\
  \ 7-5 使用 `auc`。\n\n### 列表 7-5: 构建梯度提升模型以区分水水雷与岩石—rocks_v_mines_gbm.py\n\n```python\n\
  __author = 'mike_bowles'\n\nfrom math import sqrt, fabs, exp\nimport matplotlib.pyplot\
