  \n### 确定随机森林在玻璃上的性能\n\n图 7.15 显示了随着集成中树的数量增加，随机森林的性能是如何变化的。随着树的增加，曲线通常会下降。随着树的增加，改进速度会降低。在图形停止的地方，改进已经明显放缓。\n\
