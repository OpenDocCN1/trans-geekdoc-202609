  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow></math>——即\
  \ X 第 `i` 行的预测变量。参考表 3.1 中的数据，![images](img/c03-i0008.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mi>y</mi><mn>1</mn></msub></mrow></math>\
  \ 是 Yes，而 ![images](img/c03-i0009.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>y</mi><mn>2</mn></msub></mrow></math> 是 No。\n\n目标可以是多种不同的形式。例如，它们可以是实数，就如果目标是预测客户将花费多少金额。当目标是实数时，该问题被称为\
  \ `regression problem`（回归问题）。线性回归意味着使用线性方法来解决回归问题。（本书涵盖了线性回归和非线性回归方法。）\n\n如果目标是二值的，如表\
  \ 3.1 所示，该问题被称为 `binary classification problem`（二分类问题）。预测客户是否会点击广告是一个二分类问题。如果目标包含多个离散值，则该问题是\
  \ `multiclass classification problem`（多分类问题）。预测客户会点击几个广告中的哪一个就是一个多分类问题。\n\n其基本问题是找到一个预测函数\
  \ `pred()`，该函数使用属性来预测结果（参见公式 3.3）：\n\n![公式 3.3: 用于预测的基本方程](img/c03-disp-0003.png)\n\
