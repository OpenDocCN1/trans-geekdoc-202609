  \n 使用 PySpark 集成包解决回归问题\n\n本节将回顾你在整书中看到的示例，并演示如何使用 PySpark 可用的集成方法为每个示例构建模型。本节结合了你在\
  \ 第 5 章中学到的内容以及你刚刚看到的使用集成方法构建模型的内容。在 PySpark 中使用集成方法涉及你在 第 5 章 中看到的完全相同的数据准备步骤，并使用了你到本章为止学到的梯度提升和随机森林算法。PySpark\
  \ 的梯度提升和随机森林算法具有与之前看到的相同的待调参数。\n\n\n\nPySpark 中的数据准备仅取决于数据集。无论你选择使用惩罚线性回归还是梯度提升算法，PySpark\
  \ 回归包的输入都是相同的。下一节“[使用 PySpark 集成方法预测葡萄酒口感”将阐明，仅需更改几行代码即可从使用梯度提升切换到使用随机森林。后续涵盖剩余问题（鲍鱼、岩石与矿石、以及玻璃分类）的章节将包含梯度提升示例的数据准备部分，并在单独的代码列表中列出随机森林的代码。\n\
  \n你已经从第 5 章中介绍的 PySpark 示例中看到，PySpark 中的数据准备比 Python 中的 `numpy` 或 `pandas` 更复杂。然而，从用户的角度来看，集成算法反而更简单。它们提供的选项没有你在\
  \ `XGBoost` 或 `sklearn` 随机森林中看到的那么多。PySpark 的用户界面更简单，这是因为在分布式环境中编写算法要困难得多，因此很难像你在本章较早学过的包那样提供许多可调优的特征。\n\
  \n梯度提升和随机森林的特征足够相似，可以在一个描述中涵盖，并在存在差异的少数情况下进行简要说明。\n\n首先，一旦你实例化模型，可用于训练和进行预测的函数是\
  \ `fit()` 和 `transform()`。`fit` 函数的唯一参数是用于训练的数据帧。正如你在第 5 章中看到的，输入的 PySpark 数据帧包含了特征集和标签。`transform`\
  \ 函数也接受单个参数，通常是用于训练的数据帧的测试版本。\n\n### 使用 PySpark 集成方法预测葡萄酒口感\n\n[[代码列表 7-9]](#c07.xhtml#c07-fea-0009)\
