  \n对葡萄酒数据集的探索是使用已经解释并过的工具完成的。葡萄酒数据集展示了这些工具能够揭示的内容。平行坐标图和相关性热图都显示，高酒精含量与高口感评分正相关，而高挥发性酸含量则对应低口感评分。你将在第\
