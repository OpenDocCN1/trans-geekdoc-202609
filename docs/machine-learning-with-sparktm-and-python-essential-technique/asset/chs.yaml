  \n`Listing 18` 中的计算可以在大数据上高效完成。但你看到的一些探索性工具无法做到。例如，对数百万变量进行并行图绘制可能太耗时。一种始终有效的方法是对数据集进行采样，并获取一个足够处理的小样本。\n\
  \n#### 列表 2-9：使用 PySpark 对数据采样——SamplingDataFrame.py\n\n```python\n__author__ =\
  \ 'mike_bowles'\n\nfrom Read_Fcns import pd_read_abalone\nfrom pyspark.sql import\
  \ SparkSession\nspark = SparkSession.builder.appName(\"explore\").getOrCreate()\n\
  \nimport pandas as pd\nfrom pandas import DataFrame\n\nabalone_df = pd_read_abalone()\n\
  abalone_sp_df = spark.createDataFrame(abalone_df)\n\nprint('Number of rows before\
  \ sampling = ', abalone_sp_df.count())\nabalone_smaller = abalone_sp_df.sample(0.5)\n\
  print('Number of rows after sampling = ', abalone_smaller.count())\n```\n\n打印输出：\n\
  Number of rows before sampling = 4177\nNumber of rows after sampling = 2058\n\n\
  任何数据集都可以进行采样，并对样本进行检查、绘图、热图分析等。问题在于样本是否具有代表性。通过多次采样，你可以解决这个问题。\n\n## 总结\n\n本章向你介绍了用于深入研究新数据集工具，并让你理解如何构建预测模型。工具从简单学习数据集的大小和形状以及确定属性和标签的类型开始。这些关于数据集的实将帮助你通过预处理数据和训练预测模型来设定路线。本章还涵盖了多种帮助你理解数据集的不同统计研究。这些包括简单的描述统计（均值、方差和分位数）以及二阶统计，如属性之间的相关性以及属性与标签之间的相关性。属性与二值标签的相关性需要与实数（回归标签）不同的技术。本章还介绍了几种可视化技术。一种是用于可视化数据中离群行为的\
  \ Q-Q 图。另一种是用于可视化属性与标签之间关系的平行坐标图。所有这些都应用于书中其余部分，用于演示所涵盖的算法并进行比较。\n\n## 参考文献\n\n\
  1. 1. Gorman, R. P., and Sejnowski, T. J. (1988). UCI Machine Learning Repository.\
  \ `https://archive.ics.uci.edu/ml/datasets/Connectionist+Bench+(28Sonar,+Mines+vs.+Rocks%29)`.\
  \ Irvine, CA: University of California, School of Information and Computer Science.\n\
  \n\n\n\n在本章中，你将学习到：在复杂问题上实现高性能需要复杂的模型，但复杂的模型需要庞大且丰富的数据集来进行充分训练。当你的问题不那么复杂，或者可用数据不多时，较简单的模型将是最佳选择。这个过程涉及两个方面：首先，你需要一个复杂度易于调整的模型；其次，你需要一种方法来衡量它们的性能。本章将针对某些特定示例讨论这两个方面的内容，并特别关注性能测量。后续章节将更详细介绍特定的预测模型。\n\
  \n本章包含了一些视觉示例，展示了问题与模型复杂度之间的关系，并提供了用于设计和开发的技术指南。\n\n# 基础问题：理解函数近似\n\n本书涵盖的算法解决的是一类特定的预测问题。这些问题的陈述包含两类变量：\n\
  \n* 你尝试预测的变量（例如，网站访问者是否会点击广告）\n* 其他变量（例如，访问者的人口统计信息或在网站上的过去行为），你可以利用这些变量来预测。\n\n\
  这类问题被称为 `function approximation problems`，因为其目标是构建一个模型，将后者作为函数来生成对第一者的预测。\n\n在函数近似问题中，设计者从一组已知正确答案的历史示例开始。例如，历史网络日志文件将指示访问者在看到广告时是否点击了该广告。接下来，数据科学家需要找到其他可以构建预测模型的数据。例如，为了预测网站访问者是否会点击广告，数据科学家可能会尝试使用访问者在看到广告之前访问过的其他页面。如果用户在网站上注册过，则可能获得有关过去购买或访问过页面的数据来进行预测。\n\
  \n被预测的变量有多个不同的名称，如 `target`、`label` 和 `outcome`。用于预测的变量被各种称为 `predictors`、`regressors`、`features`\
  \ 和 `attributes`。在本文中，以及在实践中，这些术语是相互通用的，这在通用实践中也是如此。确定使用哪些属性进行预测被称为 `feature engineering`（特征工程）。数据清洗和特征工程占据了数据科学家\
  \ 80% 到 90% 的时间。\n\n特征工程通常需要一个人工迭代的过程，来选择特征、确定最佳潜力并对不同的特征组合进行实验。本书涵盖的算法为每个属性分配数值重要性值。这些值表示属性在预测中的相对重要性。这些信息有助于加速特征工程的进程。\n\
  \n## 处理训练数据\n\n数据科学家从训练集开始算法开发。训练集由结果示例和数据科学家选择的特征集合组成。训练集包含两类数据：\n\n* 你想要预测的结果\n\
  * 可用于预测的可用特征\n\n`Table 3.1` 提供了一个训练集的示例。最左的一列包含结果（网站访问者是否点击了链接）以及用于预测访问者未来是否会点击链接的特征。\n\
  \n`Table 3.1`：训练集示例\n\n| 结果：点击了链接 | 特征 1：性别 | 特征 2：在网站上花费的金额 | 特征 3：性别 |\n| ---\
  \ | --- | --- | --- |\n| 是 | M | 0 | 25 |\n| 否 | F | 250 | 32 |\n| 是 | F | 12 |\
  \ 17 |\n\n预测器值（又称 features、attributes 等）可以以矩阵的形式排列（参见 `Equation 3.1`）。本书使用的符号约定如下。预测器表将被称为\
  \ `X`，它具有以下形式：\n\n![Equation 3.1: Notation for set of predictors](img/c03-disp-0001.png)\n\
  \n`Equation 3.1`：预测器集的符号表示\n\n引用 `Table 3.1` 中的数据集，`![images](img/c03-i0001.png)<math\
