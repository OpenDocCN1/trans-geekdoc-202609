  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>&#945;</mi><mo>=</mo><mn>0</mn></mrow></math> 停止变化，算法就得到了给定的 `λ` 和 `α`\
  \ 值的解。是时候移动到系数曲线的下一个点了。\n\n首先要注意到表达式中的 ![images](img/c04-i0074.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><msub><mi>x</mi><mrow>i</mi><mi>j</mrow></msub><msub>r</mi><mi>i</msub></math>。将\
  \ ![images](img/c04-i0071.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><msub><mi>x</mi><mrow>i</mi><mi>j</mrow></msub><msub>r</mi><mi>i</msub></math>\
  \ 在 *i* 上（即跨数据行）求和，就得到了 images](images/c04-i0072.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><msup><mi typeof=\"normal\">j</mi><mrow><mi typeof=\"normal\">t</mi><mi typeof=\"\
  normal\">h</mi></mrow></msup></math> 属性与残差之间的相关性。记得在 `LARS` 回归中，算法的每一步中每个属性都会与残差进行相关性分析。在\
  \ `LARS` 算法中，测试这些相关性以查看哪个属性与残差的相关性最大，并增加与其对应的属性对应的系数。在 `glmnet` 算法中，相关性的使用方式略有不同。\n\
  \n\n\n\n通过 `glmnet`，残差之间的相关性被用于计算每个系数的幅度应该改变多少。但结果在产生 ![images](img/c04-i0067.png)\
  \ 的变化之前，会通过函数 `S()`。<math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mrow><mi>j</mi></mrow><mrow><mo>~</mo></mrow></msubsup></mrow></math>。`S()`\
  \ 函数是 Lasso 系数收缩函数。它在图 4.5 中被绘制。如你在图 4.5 中所示，如果第一个输入小于第二个输入，输出为零。如果第一个输入大于第二个输入，输出为第一个输入减去第二个输入后的幅度。这被称为软限幅器（soft\
  \ limiter）。\n\nListing 4.3 显示了 `glmnet` 算法的代码。你可以在代码中看到公式 4.9](#c04.xhtml#c04-fig-0014)是如何用于更新\
  \ `β` 以生成 ElasticNet 系数曲线的。Listing 4.3 中的代码使用了 Friedman 论文中的公式编号进行注释。这篇论文非常易读，如果你感兴趣，可以参考它获取更多的数学细节。\n\
  \n### 初始化和迭代 Glmnet 算法\n\n迭代从一个较大的 `λ` 值开始。它从一个足够大的 `λ` 值开始，足以让所有的 `β` 变为零。你可以参考公式\
  \ 4.9 查看如何计算 `λ` 的起始值。公式 4.9 中的函数 `S()` 如果其第一个输入（![images](img/c04-i0070.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><msub><mi>x</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><msub><mi>r</mi><mi>i</mi></msub></math>的相关性）小于第二个输入——`λα`，则输出零。迭代从所有\
  \ `β` 等于零开始，因此残差原始标签。确定起始 `lambda` 的代码计算每个属性和标签的相关性，找到幅度最大的，然后求解 `λ` 的值使得最大的相关性恰好等于\
  \ `λα`。即导致所有 `β` 均为零的 `λ` 最大值。\n\n然后通过减小 `λ` 开始迭代。这是通过将 `λ` 乘以一个略小于 1 的数来实现的。Friedman\
  \ 建议选择乘数使得 ![images](img/c04-i075.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msup><mi>&#95;</mi></mrow><mrow><mn>100</mn></mrow></msup>=</mo><mn>001</mn></mrow></math>。这大约给出\
  \ 0.93 的值。如果算法运行很而不收敛，则 `λ` 的乘数需要更接近 1。在 Friedman 的代码中，实现此点的机制是将步骤从 100 增加到例如 200，这样就需要\
  \ 200 步将起始 `λ` 减少到其起始值的 0.0%。在 Listing 4.3 中，你可以控制该乘数。系数曲线如图 4.6 所示。\n\n#### Listing\
  \ 4.3 (#c04.xhtml#c04-fea-0004): glmnetAlgorithm.py\n\n```python\n__author__ = 'mike_bowles'\n\
  \nimport numpy as np\nfrom sklearn import datasets, linear_model\nfrom math import\
  \ sqrt\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing import StandardScaler\n\
  \ndef S(z, gamma):\n    if gamma >= abs(z):\n        return 0.0\n    return (z/abs(z))*(abs(z)\
  \ - gamma)\n\n### read data into list of attribute rows and labels\nnames, xList,\
  \ labels = read_wine()\nnrows = len(xList)\nncols = len(xList[0])\n\n### Normalize\
  \ x\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xList)\n\n\
  ### Normalize labels\nyScaler = StandardScaler()\nlabelNormalized = yScaler.fit_transform(np.array(labels).reshape([-1,\
  \ 1]))\n\n### select value for alpha\nalpha = 1.0\n\n### define parameters for iteration\n\
  nSteps = 100\nlamMult = 0.93 # 100 steps gives reduction by factor of 0.01\n\n###\
  \ make a pass through the data to determine value of lambda that suppresses all\
  \ coefficients\nxy = np.mean(xNormalized * labelNormalized, axis=0)\nmaxXY = np.amax(xy)\n\
  lam = maxXY/alpha  # starting lambda value\n\n### initialize vector of coefficients\n\
  beta = np.zeros([ncols, 1])\n\n### initialize matrix of betas at each step\nbetaMat\
  \ = beta.copy()\n\n### begin iteration\nnzList = [] # betas ordered by entry\n\n\
  for iStep in range(nSteps):\n    # make lambda smaller so some coefficient becomes\
  \ non-zero\n    lam = lam * lamMult\n\n    deltaBeta = 100.0\n    eps = 0.01\n \
  \   iterStep = 0\n    betaInner = beta.copy()\n    while deltaBeta > eps:\n    \
  \    iterStep += 1\n        if iterStep > 100: \n            break\n\n        #\
  \ cycle through attributes and update one-at-time\n        # record starting value\n\
  \        betaStart = betaInner.copy()\n        for iCol in range(ncols):\n     \
  \       residual = labelNormalized - np.dot(xNormalized, betaInner)\n          \
  \  xjr = xNormalized[:, iCol].reshape([-1, 1]) * residual\n            uncBeta =\
  \ xjr + betaInner[iCol]\n            betaInner[iCol] = S(uncBeta[0], lam * alpha)\
  \ / (1 + lam * (1 - alpha))\n\n        sumDiff = np.sum(np.abs(betaInner - betaStart))\n\
  \        sumBeta = np.sum(np.abs(betaInner))\n        deltaBeta = sumDiff/sumBeta\n\
  \  \n    print('\\r', 'Step', iStep, 'Iteration', iterStep, end='')\n    beta =\
  \ np.array(betaInner.copy()).reshape([-1, 1])\n\n    # add newly determined beta\
  \ to list\n    betaMat = np.concatenate((betaMat, beta), axis=1)\n\n    # keep track\
  \ of the order in which the betas non-zero\n    nzBeta = [index for index in range(ncols)\
  \ if beta[index] != 0.0]\n    for q in nzBeta:\n        if (q in nzList) == False:\n\
  \            nzList.append(q)\n\n### print out the ordered list of betas\nnameList\
  \ = [names[nzList[i]] for i in range(len(nzList))]\nprint('\\n\\n', nameList)\n\n\
  nPts = betaMat.shape[1]\n\nfor i in range(ncols):\n    # plot range of beta values\
  \ for each attribute\n    coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis = range(nSteps\
  \ + 1)\n    plt.plot(xaxis, coefCurve)\nplt.xlabel(\"Steps Taken\")\nplt.ylabel((\"\
  Coefficient Values\"))\n### plt.savefig('glmnet2.png', dpi=500)\nplt.show()\n```\n\
  \n\n\nLasso 模型的测试和部署过程与 LARS 模型相同。使用第 3 章中描述的方法之一对样本外数据进行测试（例如，n 折交叉验证）。利用样本外数据上的结果来确定最佳模型复杂度。然后在全数据集上进行训练以构建系数曲线，并根据样本外测试的结果，选择系数曲线中最佳的步骤。\n\
  \n本节通过了解决定义惩罚线性回归模型的最小化问题的两种解决方案方法。你已经了解了这两种方法在算法上是如何工作的、它们之间有什么关系，以及实现这些方法的代码是什么样的。这应该为你使用\
  \ Python 中实现这些算法的包奠定坚实的基础。它也为你理解下一节中将涵盖的各种模型扩展提供了良好的准备，这些扩展将会在你在第 5 章中看到的示例中使用。\n\
  \n## 将线性回归扩展到分类问题\n\n到为止，开发一直集中在回归问题上——即预测结果取实数值的问题。所讨论的机制如何应用于分类问题——即结果取两个（或多个）离散值（如“点击”或“未点击”）的问题呢？有多种方法可以将你目前为止看到的内容扩展到涵盖分类问题。\n\
  \n### 使用惩罚回归解决分类问题\n\n对于二分类问题，通过将二分类结果编码为实数，通常可以获得良好的结果。这种简单的程序将两个二分类值之一编码为 1，另一个编码为\
  \ 0（或 `+1` 和 `-1`）。通过这种简单的安排，标签列表变成了一个实数列表。例如，“点击”和“未点击”的结果变为 1.0 或 0.0。然后就可以采用已经讨论过的算法了。尽管有更复杂的方法，但这通常是一个很好的替代方案。这种简单的编码方法的训练速度通常比更复杂的方法快，这可能是重要的。\n\
  \n列表 4.4 提供了一个示例，即使用数字 0 或 1 标签代替“岩石与矿石”数据集中的类别成员身份。你可能从第 2 章中回想起，“岩石与矿石”数据集呈现了一个分类问题。该数据集来自一个实验，旨在确定声纳是否可以用于检测水中水中未爆炸的地雷。除了地雷之外，其他各种物体也会反射声纳的声波。预测问题是确定反射波是来自未爆炸的地雷，还是来自海底的岩石。\n\
  \n实验中的声纳使用的是所谓的调频波（chirped waveform）。调频波是指频率在传输的声纳脉冲持续期间上升（或下降）的波形。“岩石与矿石”数据集中的\
  \ 60 个属性是在 60 个不同时间采样的返回脉冲，对应于调频脉冲中 60 个不同的频率。\n\n列表 4.4 展示了如何将分类标签 `R` 和 `M` 转换为\
  \ 0.0 和 1.0，从而将问题转换为普通的回归问题。代码随后使用 `LARS` 算法构建分类器。列表 4.4 对全数据集进行单次通过处理。正如上一节讨论的，你将希望使用交叉验证或其他留出程序来选择最佳模型复杂度。第\
  \ 5 章 介绍了在该数据集上的这些设计步骤和性能比较。这里的重点是让你看到如何将已经见过的回归工具应用于分类问题。\n\n#### 列表 4.4: 通过为二分类标签分配数值将分类问题转换为普通回归问题——larsRocksVMines.py\n\
  \n```python\n__author__ = 'mike_bowles'\nfrom Read_Fcns import list_read_rvm\nfrom\
  \ math import sqrt\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom sklearn.preprocessing\
  \ import StandardScaler\n\n#定义用于产生系数曲线的函数\ndef lars_coef_curves(xNormalized, labelNormalized,\
  \ nSteps, stepSize):\n    nrows, ncols = xNormalized.shape\n    \n    beta = np.zeros([ncols,\
  \ 1])\n    betaMat = beta.copy()\n    \n    for i in range(1, nSteps):\n       \
  \ #计算残差\n        residuals = labelNormalized - np.dot(xNormalized, beta)\n     \
  \   \n        # 属性列与残差之间的相关性\n        corr = np.mean(xNormalized, axis=0)\n    \
  \    # 定位与残差相关性绝对最大的特征\n        iStar = np.argmax(abs(corr))\n        corrStar =\
  \ corr[iStar]\n        # 增加或减少对应的 (beta)\n        beta[iStar] += stepSize * corrStar\n\
  \        betaMat = np.concatenate((betaMat, beta), axis=1)\n        \n        #\
  \ 构建非零系数列表并累加索引\n        nzBeta = [index for index in range(ncols) if beta[index]!=\
  \ 0]\n        for q in nzBeta:\n            if q not in nzList:\n              \
  \  nzList.append(q)\n    return betaMat, nzList\n\n#从 uci 数据读取数据\nxNum, labels =\
  \ list_read_rvm()\n\nxNum = np.array(xNum)\nlabels = np.array(labels)\n\n### x 的行数和列数\n\
  nrow, ncols = xNum.shape\n\n### 归化特征\nxScaler = StandardScaler()\nxNormalized =\
  \ xScaler.fit_transform(xNum)\n\n### 归化标签\nyScaler = StandardScaler()\nlabelNormalized\
  \ = yScaler.fit_transform(labels.reshape([-1, 1]))\n\n### 取的步骤数\nnSteps = 350\n\
  stepSize = 0.004\nprint('shapes', xNormalized.shape, labelNormalized.shape)\n\n\
  betaMat, nzList = lars_coef_curves(xNormalized, labelNormalized, nSteps, stepSize)\n\
  \n### 为 x 列命名\nnames = ['V' + str(i) for i in range(ncols)]\nnameList = [names[nzList[i]]\
  \ for i in range(len(nzList))]\n\nprint(nameList)\nfor i in range(ncols):\n    #\
  \ 绘制每个属性的 beta 值范围\n    coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis = range(nSteps)\n\
  \    plt.plot(xaxis, coefCurve)\n\nplt.xlabel(\"步骤数\")\nplt.ylabel(\"系数值\")\n#plt.savefig('larsRocksVMines.png',\
  \ dpi=500)\nplt.show()\n\n# 打印输出:\n# shapes shapes (208, 60) (208, 1)\n'V10', 'V48',\
  \ 'V44', 'V11', 'V35', 'V51', 'V20', 'V3', 'V21', 'V15',\n'V43', 'V0', 'V22', 'V45',\
  \ 'V53', 'V27', 'V30', 'V50', 'V58', 'V46',\n'V56', 'V28', 'V39'\n```\n\n图 4.7 显示了由\
  \ LARS 算法开发的系数曲线。它们的特征与你在葡萄酒口味预测问题中看到的曲线相似。然而，由于更多，是因为岩石与矿石数据集具有更多属性。（岩石与矿石数据有 60\
  \ 个属性和 208 行数据。）根据第 3 章的讨论，你可能预期最佳解决方案不会使用所有属性。你将在第 5 章中看到这种权衡的结果，该章节集中于该问题及其他解决方案以及不同方法之间的比较。\n\
  \n\n\n\n**图 4.7**: 通过转换为标签解决的岩石与矿石分类问题的系数曲线\n\n另一种方法是根据问题中两种结果的概率来构建问题。这导致了所谓的 `logistic\
  \ regression`（逻辑回归）。`glmnet` 算法可以纳入该框架中，Friedman 的原始论文详细介绍了 `glmnet` 逻辑回归版本的开发，以及其向多分类问题（具有两个以上离散结果的问题）的扩展。你将在第\
  \ 5 章中看到算法的二分类和多分类版本。\n\n#### 处理具有两个以上结果的分类问题\n\n某些问题需要在几个替代方案之间做出决定。例如，假设你向网站的访问者展示了几个链接。访问者可能会点击几个链接中的任何一个、点击后退按钮或完全退出网站。有几个备选方案，它们不像整数葡萄酒口味评分那样是有顺序的。4\
  \ 分的口味评分自然地位于 3 分和 5 分之间，如果改变某个属性（如酒精含量）使评分从 3 变为 4，那么进一步改变似乎可能会使评分向相同方向移动。网站访问者采取的替代操作没有这种顺序。这被称为多分类问题。\n\
  \n你始终可以使用二分类算法来处理多分类问题。这种技术被称为 `one versus all`（一对多）或 `one versus the rest`（一与其余），这些名称让你对该方法的工作原理略有所了解。基本上，你将多分类问题设定为几个二分类问题。例如，你可以预测访问者会离开网站还是选择其他选项。另一个二分类问题是预测用户是会点击后退按钮还是采取其余任何可用选项。你最终将获得与备选结果数量相同数量二分类问题。所有的二分类器都会给出数值，例如代码列表\
  \ 4.4 中的 `LARS` 分类器。一对多值最大的结果即为获胜者。第 5 章为玻璃数据集实现了这种方法，该数据集有六种不同的可能结果。\n\n### 理解基扩展：在非线性问题上使用线性方法\n\
  \n从本质上说，线性方法假设分类和回归预测可以为设计者可用的属性的线性组合。如果你有理由怀疑线性模型是不够的怎么办？你可以使用 `basis expansion`（基扩展）让线性模型处理强非线性关系。基扩展背后的基本思想是，问题中的非线性部分可以近似为属性的多项式（或属性的其他非线性函数之和）；然后你可以添加原始属性的幂作为属性，并让线性方法确定多项式的最佳系数集合。\n\
  \n为了直观地了解这是如何运作的，请查看代码列表 4.5 中的代码。代码列表 4.5 从葡萄酒口味数据集开始。如果你还记得，本章较早生成的线性模型都发现酒精含量是决定葡萄酒口味的最重要属性。你可能会想这种关系可能不是一条直线，而是可能会弯曲。\n\
  \n```\nimport matplotlib.pyplot as plt\nfrom math import sqrt, log, cos\n\n### read\
  \ wine data\nnames, xList = list_wine()\n\n### extend the variable - the last column\n\
  xExtended = []\nalchCol = len(xList)\n\nfor row in xList:\n    newRow = list(row)\n\
  \    alch = row[alchCol - 1]\n    newRow.append((alch - 7) * (alch - 7)/10)\n  \
  \  newRow.append(5 * log(alch))\n    newRow.append(cos(alch))\n    xExtended.append(newRow)\n\
  \nnrow = len(xExtended)\nv1 = [xExtended[j][alchCol - 1] for j in range(nrow)]\n\
  \nfor i in range(4):\n    v2 = [xExtended[j][alchCol - 1 + i] for j in range(nrow)]\n\
  \    plt.scatter(v1,v2)\n\nplt.xlabel(\"Alcohol\")\nplt.ylabel((\"Extension Functions\
  \ of Alcohol\"))\nplt.show()\n```\n\n代码像之前一样读取数据。在读取数据之后（在归一化之前），代码遍历了读取的行，在行中添加了几个新元素，然后将新行附加到一组新属性中。添加的新元素都是酒精属性的函数。例如，第一个新属性是\
  \ `((alch - 7) * (alch - 7)/10)`，其中 `alch` 是行中的酒精含量。引入常量 `7` 和 `10` 是为了使生成的新属性能够在同一张图中良好地绘制。基本上，新属性是酒精的平方。\n\
  \n该过程的下一步是获取扩展的属性集，并使用本章已开发的工具（或其他用于构建线性模型的方法）构建线性模型。无论使用什么种算法来构建线性模型，模型都将包含每个属性（包括新属性）的乘数（或系数）。如果扩展使用的函数都是原始变量的幂，则线性模型将产生原始变量的多项式函数的系数。通过为扩展选择不同的函数，可以构建出其他函数序列。\n\
  \n图 4.8 说明了新属性（以及原始属性）对原始属性的函数依赖关系。你可以看到扩展中所选函数的平方、对数和正弦行为。\n\n![图 4.8：用于扩展葡萄酒属性会话生成的函数](img/c04f008.png)\n\
  \n\n\n\n\n惩罚线性回归（以及其他线性方法）需要数值型属性。如果你的问题包含一些非数值属性（也称为分类属性或因子属性）怎么办？一个熟悉的例子是性别属性，其可能值为男性和女性。将分类变量转换为数值的标准方法是将它们编码为若干列新的属性数据列。如果一个属性有\
  \ `N` 个可能值，它会被编码为 `N-1` 列新数据列，如下所示：从 `N` 个属性中识别出 `N-1` 列数据。在每一行中，如果该行对应分类变量的第 `ith`\
  \ 个可能值，则在第 `ith` 列中输入 1；在其他列中填入 0。如果该行对应分类变量的第 `Nth` 个值，则所有条目都为 0。\n\nListing 4.6\
  \ 显示了如何将此技术应用于鲍鱼数据集。鲍鱼数据集的任务是根据各种物理测量值预测鲍鱼的年龄。\n\n### Listing 4.6: 为惩罚线性回归对分类变量编码——鲍鱼数据——larsAbalone.py\n\
  \n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_abalone\n\
  import matplotlib.pyplot as plt\nfrom math import sqrt\nfrom sklearn.preprocessing\
  \ import StandardScaler\n\n#read abalone data\nxList, labels = list_read_abalone()\n\
  \nnames = ['Sex', 'Length', 'Diameter', 'Height', 'Whole weight', \\\n        'Shucked\
  \ weight', 'Viscera weight', 'Shell weight', 'Rings']\n\n#将三值的性别属性编码为数值\nxCoded\
  \ = []\nfor row in xList:\n    #首先对三值的性别变量编码\n    codedSex = [0.0, 0.0]\n    if\
  \ row[0] == 'M': codedSex[0] = 1.0\n    if row[0] == 'F': codedSex[1] = 1.0\n\n\
  \    numRow = [float(row[i]) for i in range(1,len(row))]\n    rowCoded = list(codedSex)\
  \ + numRow\n    xCoded.append(rowCoded)\n\nnamesCoded = ['Sex1', 'Sex2', 'Length',\
  \ 'Diameter', 'Height', \\ \n 'Whole weight', 'Shucked weight', 'Viscera weight',\
  \ 'Shell weight', \\\n   'Rings']\n\nnrows = len(xCoded)\nncols = len(xCoded[1])\n\
  \n#标准化特征（包含编码后的三值性别）\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xCoded)\n\
  \n#标准化标签\nyScaler = StandardScaler()\nlabelNormalized = yScaler.fit_transform(np.array(labels).reshape(\\\
  \ \\\n                      [-1, 1]))\n# ... (其余逻辑)\n```\n\n本节讨论了惩罚回归的几种扩展，这些扩展扩大了其实用性以涵盖广泛的问题。该节描述了一种将分类问题转换为普通回归问题的简单且有效的方法。它还讨论了如何将二分类器转换为多分类器。接着讨论了如何通过添加旧属性的非线性函数的新属性，利用线性回归对非线性行为进行建模。最后，本节展示了如何将分类变量转换为实值变量，以便你可以在分类变量上训练线性算法。这种转换分类变量的方法不仅适用于线性回归，对于支持向量机等其他线性方法同样有用。\n\
