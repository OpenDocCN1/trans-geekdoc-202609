  \ 5 |\n\n## 什么是惩罚化回归方法？\n\n惩罚化线性回归是*普通最小二法*（OLS）回归的派生方法，后者由高斯在大 200 年前开发。惩罚化回归方法的设计是为了克服\
  \ OLS 的一些基本局限性。OLS 的基本问题是它有时会过拟合。如图 1.1，将 OLS 理解为通过点群拟合直线。这是一个简单的预测问题：给定单个属性 `x`\
  \ 来预测目标值 `y`。例如，问题可能是仅根据身高预测男性薪资。身高对男性薪资有预测预测性。\n\n它们最重要的特征之一是指示哪些输入变量对产生预测最重要。预测模型开发中最耗时的步骤之一有时被称为*特征选择*或*特征工程*。数据科学家选择将使用的变量的过程。通过根据重要性对特征排名，本书涵盖的算法通过消除某些猜测来协助特征工程过程。\n\
  \n此外，这些算法非常易使用。它们没有多少可调参数。它们解决了多种类型的回归和分类问题。有足够的人力来分离元首基因；问题在于由于成本原因，你没有许多人的基因序列。这个时间范围可能是无法接受的延迟，特别是在开发早期，需要通过迭代来确定最佳方法。除了训练非常快之外，部署后训练好的线性模型可以快速生成预测——快到足以高频交易或互联网广告插入。研究表明，惩罚化线性回归在许多情况下可以提供最佳答案，即使在它们不是最佳的情况下，表现也接近前列。\n\
  \n\n\n\n\n为了在这个简单的示例中模拟这种情况，想象你得到的不是六个点，而是六个点中的两个。这将如何改变拟合这些直线的性质？这取决于你恰好得到了哪两个点。为了看看这种影响有多大，请从图\
  \ 1.1 中任选两个点，并想象一条穿过它们的直线。图 1.2 展示了从图 1.1 中的点对穿过的一些可能直线。注意这些直线如何根据点的选择而产生多大的变化。\n\
  \n\n图 1.2:仅用两个点拟合直线\n\n仅用两个点来拟合直线的问题在于，数据不足以匹配自由度。一条直线有两个自由度。这意味着有两个独立参数可以唯一确定一条直线。你可以想象在平面上抓住这条直线并上下移动，或者通过旋转它来改变斜率。因此，垂直位置和斜率是独立的。它们可以被单独改变，但共同确定了一条直线。直线的自由度可以用等等方式表示（例如截距和斜率，或者直线上的两个点）。所有这些直线的表示方法都需要两个参数。\n\
  \n当自由度等于点的数量时，预测结果并不理想。用于绘制这些点的直线之间存在大量的差异。在数据集中，你对一个自由度与点数相相同的预测无法寄予太多信任。图 1.1\
  \ 中的图显示了六个点并拟合直线（两个自由度）。这就是六个点和两个自由度。确定自由度的问题需要更多的数据来隔离，20000 个可能的点代表 20000 个自由度。20000\
  \ 个不同的点不足以获得可靠的答案，在许多情况下，在合理范围内提供的所有数据，这使得罚化回归可能是最佳选择。\n\n罚化回归提供了一种系统地减少自由度的方法，以匹配可用数据和现象的复杂性。这些方法对于具有许多自由度的问题变得非常流行。第\
  \ 4 章“罚化回归”详细介绍了这些方法的工作原理、说明这些算法的示例代码以及使用 Python 包实现机器学习系统的示例。\n\n## 什么是集成方法？\n\n\
  书中涵盖的另一类算法是集成方法（Ensemble Methods）。集成方法的的基本思想是构建一组不同的预测模型，然后结合它们的输出——通过平均输出或多数投票。单个模型被称为`基学习器`。计算学习理论的一些结果表明，如果基学习器比随机猜测好一点，只要有足够的独立模型，集成方法的性能就会非常好。\n\
  \n促进方法方法的原因之一是观察到某些机器学习算法表现出不稳定性。例如，向数据集中添加新数据可能会导致模型或性能发生剧烈变化。决策树和传统的神经网络表现出这种不稳定性。这种不稳定性导致模型性能的高方差，而许多模型的平均可以视为减少方差的方法。技巧在于如何生成大量的独立模型，特别是当它们都使用同一个基学习器时。第\
  \ 6 章“集成方法”将介绍这一操作的细节。这些技术非常精妙，理解它们的基本原理相对容易。以下是内容的预览。\n\n应用最广泛、使用最好的集成方法将决策树作为它们的基学习器。决策树通常如图\
  \ 1.3 所示。图 1.3 中的树接受一个名为 `x` 的实数作为输入，然后使用一系列二值（两个值）判断来决定响应 `x` 应该输出什么值。第一个判断是 `x`\
  \ 是否小于 5。如果该问题的答案是“否”，决策树输出上方决策框“否”分支下方圆圈指示的值 4。`x` 的每个可能值都会导致树的某个输出 `y`。图 1.4 将输出\
  \ (`y`) 绘制成关于树输入 (`x`) 的函数。\n\n\n图 1.3:决策树示例\n\n\n图 1.4:决策树示例的输入输出图\n\n这种描述引起了关于比较（例如，`x\
  \ < 5`?）来自哪里以及输出值（树底部圆圈中的）来自哪里的问题。这些值来自于在输入数据上训练决策树。执行该训练的算法并不难理解，并涵盖第 6 章中。此时需要注意的是，给定数据，训练好的决策树中的值值是固定的。生成树的过程是确定性的。\n\
  \n\n\n\n\nTable 1.4 给出了这两类算法的概要比较。惩罚线性回归方法的优点是训练速度非常快。在大型数据集上的训练时间可能会延伸到几小时、几天甚至几周。在得出可部署的解决方案之前，通常需要进行多次训练。长时间的训练会阻碍大型问题的开发和部署。惩罚线性方法的快速训练时间使其变得有用，原因显而易见：越快越好。根据问题的不同，这些方法与集成方法相比可能会产生一些性能劣势。第\
  \ 3 章 深入探讨了哪些类型的问题惩罚回归可能是更好的选择，而哪些问题集成方法可能是更好的选择。即使在惩罚线性方法的性能优于集成方法的情况下，惩罚线性方法有时也可以是你开发过程中一个非常有用的第一步。\n\
  \n\n| | 训练速度 | 预测速度 | 问题复杂性 | 处理宽特征属性 |\n| --- | --- | --- | --- | --- |\n| `Penalized\
  \ Linear Regression` | + | + | – | + |\n| --- | --- | --- | --- | --- |\n| `Ensemble\
  \ Methods` | – | – | + | – |\n\n在开发早期，为了特征选择、特征工程以及巩固数学问题的陈述，需要多次训练迭代。决定将什么作为你预测模型的输入可能需要一些时间和思考。有时这些是显而易见的，但通常需要反复迭代。将你能找到的所有东西都丢进去通常不是一个好的解决方案。\n\
  \n确定模型的最佳输入通常需要进行试错。例如，如果你正尝试预测访问你网站的访是否会点击广告链接，你可能会尝试使用访问者的人口统计数据。也许这并不能提供你所需的准确性，因此你尝试结合有关访问者在网站上过去行为的数据——访问者在过去访问网站期间点击了哪些广告，或者访问者购买了哪些产品。也许添加访问者在进入你的网站之前所在的网站的数据会有帮助。这些问题引向了一系列实验，在实验中你加入新数据并观察它们是有害还是有利。这种迭代对于数据处理和训练你的预测模型来说通常都是耗时的。惩罚线性回归通常会比集成方法快，这种时间差异可以是开发过程中一个实质性的因素。\n\
  \n例如，如果训练集在 GB 级别，惩罚线性回归的训练时间可能是 30 分钟，而集成方法可能是 5 或 6 小时。如果特征工程过程需要 10 次迭代来选择最佳特征集，那么仅计算时间就会导致完成特征工程需要一天或一周的差异。因此，一个有效的流程是在开发早期、特征工程等阶段训练惩罚线性模型。这让数据科学家能够感觉到哪些变量将是有用且重要的，并为以后开发中与其他算法的比较提供基准性能。\n\
  \n在拥有训练时间优势外，惩罚线性方法生成预测的速度比集成方法快得多。生成预测涉及使用训练好的模型。惩罚线性回归的训练模型仅仅是一个实数列表——每个用于预测的特征对应一个数字。涉及的浮点操作数就是用于预测的变量数量。对于对时间非常敏感的预测（如高频交易或网络广告插入），计算时间决定了盈利与亏损的区别。\n\
  \n对于某些问题，线性方法可能提供与集成方法相当甚至更好的性能。某些问题不需要复杂的模型。第 3 章 详细说明了问题复杂性的性质，以及数据科学家的任务是如何平衡问题复杂性、预测模型复杂性和数据集大小以获得最佳的可部署模型。基本思想是，对于不复杂的问题以及没有足够数据的问题，线性方法可能比更复杂的集成方法获得更好的整体性能。遗传数据为这类问题提供了一个很好的说明。\n\
  \n通常的认知是周围存在海量的遗传数据。从字节角度衡量，遗传数据集确实很大，但从生成准确预测的角度来看，它们并不大。为了理解这种区别，请考虑以下思想实验。假设你有两个人，一个患有遗传性疾病，另一个没有。如果你有这两个人的基因序列，你能确定是哪种基因导致了该疾病吗？显然，这是不可能的，因为两个个人之间会有许多基因的差异。那么需要多少人呢？至少，需要与基因数量一样多的人基因序列，考虑到测量中的任何噪声，还需要更多。人类大约有\
  \ 20,000 个基因，取决于你的计数方法。每条数据的成本大约为 1,000 美元。因此，仅需在完美测量下解决疾病的数据就需要花费 2000 万美元。\n\n\
  这种情况与本章早期讨论的二点拟合直线非常相似。模型所需的自由度需要少于数据点的数量。数据集通常需要是模型自由度的倍数。因为数据集的大小是固定的，模型的自由度需要是可调整的。处理惩罚线性回归的章节将向你展示这种调整性是如何构建惩罚线性回归中的，以及如何利用它来实现优化性能。\n\
  \n第 3 章 详细探讨了为什么对于特定问题，某种算法是另一种是更好的选择。这与问题的复杂性以及算法固有的自由度有关。\n\n## 构建预测模型的步骤\n\n\
  使用机器学习需要多种不同的技能。一种是所需的编程技能，本书没有涉及这个问题。其他技能涉及训练和部署适当模型。这些其他技能正是本书所涵盖的。这些其他技能包含什么？\n\
  \n\n\n\n最初，问题是用用较为模糊的语言术语描述的，例如“向网站访问者展示他们可能点击的链接”。要将其转化为一个运行的系统，需要用具体的数学术语重新表述问题，找到用于预测的数据，然后训练一个预测模型，该模型将预测网站访问者点击可用链接的概率。用数学术语描述问题意味着对从可用数据源中提取哪些特征以及这些特征将如何结构化做出假设。\n\
  \n你如何开始一个新问题呢？首先，你查看可用数据，以确定哪些数据可能对预测有所用。“查看数据”意味着对数据运行各种统计检验，以直观地了解它们揭示了什么信息，以及它们与你试图预测的内容之间有什么联系。直觉可以在一定程度上引导你。你还可以对结果进行量化，并测试潜在预测特征与这些结果之间的相关程度。第\
  \ 2 章“通过理解数据来理解问题”详细介绍了用于描述和比较书中其他部分算法的数据集所经历的这一过程。\n\n某种方式，你开发了一组特征，并开始训练你选择的机器学习算法。这将产生一个训练好的模型并估计其性能。接下来，你想考虑对特征集进行更改，包括添加新特征或删除某些证明无帮助的特征，或者可能更改不同类型的训练目标（也称为\
  \ `target`），以查看是否能提高性能。你会对各种设计决策进行迭代，以确定是否有提高性能的可能性。你可能会找出性能最差的示例，然后尝试确定是否有某些共同点统一这些示例。这可能会导致你向预测过程添加另一个特征，也可能导致你对数据进行分流，并在不同的群体上训练不同的模型。\n\
  \n本书的目标是让你熟悉这些过程，以至于你能够自信地完成这些开发步骤。这要求你在构思问题并开始提取用于训练和测试算法的数据时，熟悉不同算法所需的输入数据结构。该过程通常包括以下几个步骤：\n\
  \n1. 提取并组装用于预测的特征。\n2. 开发训练所需的目标。\n3. 训练模型。\n4. 在测试数据上评估性能。\n\n机器学习不仅需要熟悉几个程序包。它还需要理解并练习开发可部署模型所涉及的过程。本书旨在为你提供这种理解。它假设你具备基础的本科数学和一些概率统计的基本概念，但本书并不预设读者具有机器学习背景。同时，它的意图为读者提供适用于广泛类问题的最佳算法，而不一定旨在介绍所有的机器学习算法或方法。有很多算法很有趣，但由于各种原因并不常用。例如，也许它们的可扩展性不好，也许它们无法提供内部运行机制的见解，也许难以使用等等。众所周知，例如，`Gradient\
  \ Boosting`（此处涵盖的算法之一）以巨大优势成为在线机器学习竞赛的领先者。某些算法被从业者频繁使用是有充分的，如果你在读完本书后理解了这些原因，本书就成功了。\n\
  \n### 构思机器学习问题\n\n开始参加机器学习竞赛是对真实机器学习问题的模拟。竞赛提供了一个简短的描述（例如，宣布一家保险公司希望更好地预测其汽车保单的理赔率）。作为竞争者，你的第一步是打开数据集，查看可用数据，并识别预测需要以什么形式呈现才有用。对数据的检查将让你直观地感受到数据代表什么，以及它们如何与手头的预测任务相关。数据可以就方法方面提供见解。图\
  \ 1.5 描述了从通用的语言表述目标转向能够作为机器学习算法输入的数据安排的过程。\n\n\n`图 1.5`: 构思机器学习问题\n\n被漫画化为“让我们获得更好的结果”的泛化陈述必须转换为可以衡量和优化的特定目标。对于网站所有者来说，特定的性能可能是提高点击率或增加销售额（或增加贡献边际）。下一步是收集数据，以便可能的可以预测给定客户点击各种链接或购买在线提供的各种产品的概率。图\
  \ 1.5 将这些数据描述为属性矩阵。对于网站示例，它们可能包括访问者查看过的其他页面或访问者过去购买过的物品。除了用于预测的属性外，这类问题的机器学习算法还需要正确的答案来用于训练。这些答案在图\
  \ 1.5 中被标记为 `targets`。书中涵盖的算法通过检测过去行为中的模式来学习，但重要的是它们不能仅仅是记忆过去的行为；毕竟，客户可能不会重复购买昨天买过的东西。第\
  \ 3 章详细讨论了这种不记忆的训练过程是如何工作的。\n\n通常，问题公式的几个方面可以通过多种方式完成。这导致了在构思问题、选择并训练模型以及产生性能估计之间的迭代。图\
  \ 1.6 描述了这一过程。\n\n\n`图 1.6`: 迭代\n\n问题可能带有特定的定量训练目标，或者部分工作可能是提取这些数据（称为 `targets`\
  \ 或 `labels`）。例如，考虑构建自动交易证券系统的任务。为了自动交易，第一步可能是预测证券的价格变化。价格很容易获得，因此使用历史数据构建已知未来价格变化的训练示例在概念上是简单的。但即使这样也涉及选择和实验。未来的价格变化可以用多种不同的方法计算。变化可以是当前价格与\
  \ 10 分钟后价格之间的差值。也可以是当前价格与 10 天后价格之间的变化。也可以是当前价格与未来 10 分钟内最高/最低价格之间的差值。价格的变化可以用双状态变量来描述，根据\
  \ 10 分钟后价格是高是低取值为“高”或“低”。这些每个选择都会导致一个预测模型，而预测将用于决定买入或卖出证券。需要一些实验来确定最佳选择。\n\n###\
  \ 特征提取与特征工程\n\n\n\n\n\n决定使用哪些变量进行预测可能也涉及实验。这个过程被称为*特征提取*（feature extraction）和*特征工程*（feature\
  \ engineering）。特征提取是从自由形式的排列中（例如文档或网页页面上的单词）中提取数据，并将其排列成数字形式的行和列的过程。例如，垃圾邮件过滤问题从邮件文本开始，并可能会提取诸如文档中大写字母的数量、全大写单词的数量、“买”一词在文档中出现的次数，以及其他选定的用以突出垃圾邮件与非垃圾邮件之间差异的数值特征。\n\
  \n特征工程是对特征进行操纵和组合以获得更具信息量的特征的过程。构建一个证券交易系统涉及特征提取和特征工程。特征提取将是决定哪些内容被用于预测价格。历史价格、相关证券的价格、利率以及从新闻稿中提取的特征都已整合到已公开讨论过的各种交易系统中。此外，证券价格还有许多经过工程处理的特征，名称如\
  \ `stochastic`（随机指标）、`MACD`（移动平均收敛散度）和 `RSI`（相对强度指数），这些特征基本上是过去价格的函数，其发明者认为它们在证券交易中是有用的。\n\
  \n开发出一组合理的特征后，你就可以训练像书中描述的那种预测模型，评估其性能，并对部署模型做出决定。通常，你可能希望对所使用的特征进行更改，即使没有其他理由，仅仅是为了确认你的模型性能是足够的。确定使用哪些特征的一种方法是尝试所有组合，但这可能需要大量时间。不可避免的是，你面临着重压力：既要提高性能，又要快速将训练好的模型投入使用。书中讨论的算法具有一个有利的特性，即提供每个属性在生成预测时的效用性指标。一次训练过程将生成特征的排名，以指示它们的相对重要性。这些信息有助于加速特征工程的过程。\n\
  \n模型训练过程在每次尝试基准特征集时都会开始，也涉及一个过程。现代机器学习算法（如书中描述的算法）会训练类似于 100 到 5,000 个不同的模型，这些模型必须筛选出一个单一模型以进行部署。生成这么多模型的原因是为了提供各种不同复杂程度的模型。这使得选择最适合问题和数据集的模型成为可能。你不想要一个过于简单的模型（否则会牺牲性能），也不想要一个过于复杂的模型（否则会对问题产生过拟合）。拥有各种复杂程度的模型可以让你挑选出一个恰恰好的模型。\n\
  \n### 确定已训练模型的性能\n\n模型的拟合程度取决于它在未用于训练模型的数据上的表现如何。这是一个重要的步骤，而且在概念上非常简单。只需留出一些数据，不要在训练中使用它们。训练完成后，使用你留出的数据来确定你的算法的性能。本书讨论了若干种留出数据的系统方法。不同的方法有不同的优缺点，主要取决于训练数据的大小。尽管听起来很容易，但人们不断构思出复杂的方法让测试数据“泄漏”到训练过程中。在过程结束时，你将拥有一个算法，它可以筛选传入的数据并为你做出准确的预测。它可能需要监控，因为不断变化的条件会改变底层统计数据。\n\
  \n\n不同的读者可能根据自己的背景以及是否有时间理解基本原理，想要在书中采取不同的路径。图 1.7 展示了书中的章节是如何相互依赖的。\n\n\n`图 1.7`:\
  \ 章节之间的相互依赖\n\n第 2 章通过深入数据集来更好地理解问题和其特性。第 2 章展示了 `Python` 中可用的某些工具。你可能想浏览第 2 章中的部分或全部示例，以便后深入研究解决方案。\n\
  \n第 3 章解释了机器学习问题中的基本权衡，并引入了贯穿全书的关键概念。\n\n第 4 章展示了训练惩罚回归模型的核心思想。该章介绍了基本概念，并展示了算法是如何推导的。\n\
  \n\n\n\n\n第 5 章 将第 4 章中开发的惩罚回归算法应用于第 2 章中概述的一些问题。本章概述了实现惩罚回归方法的 Python 包，并如何使用它们来解决问题。目标是涵盖足够广泛的问题，以便从业者能够找到与他们面临的问题相似的问题进行解决。除了量化和比较预测性能外，第\
  \ 5 章还研究了训练后算法的其他属性。变量选择和变量排序是至关重要的。这种理解将有助于加速新问题的开发。\n\n第 6 章 开发了集成方法。由于集成方法最常见基于二分类决策树，第一步是理解训练和使用二分类决策树的原理。集成方法的许多属性直接继承自二分类决策树。在建立起这些理解的基础上，本章解释了书中涵盖的三种主要集成方法。它们的常见名称是\
  \ Bagging（装袋）、Boosting（提升）和 Random Forest（随机森林）。对于每种方法，都概述了其运行原理，并编写了核心算法的代码，以便你理解其运行机制。\n\
  \n第 7 章 使用集成方法解决第 2 章中的问题，然后比较了开发的各种算法。比较涉及多个元素。预测性能是比较的一个元素。训练所需的时间和性能是另一个元素。涵盖的所有算法都提供了变量重要性排序，并在给定问题上跨不同算法对这些信息进行了比较。\n\
  \n根据我向程序员和计算机科学家教授机器学习的经验，我发现对于某些人来说，代码示例比数学更有效。这里采用的方法是提供一些数学知识、算法草图和代码示例来说说明要点。讨论的几乎所有方法都可以在书的代码以及网站上找到。其意图是提供可修改的（hackable）代码，帮助你尽可能快地在你自己的问题上运行运行。\n\
  \n\n本章为你能够解决的问题类型提供了规范，并描述了构建预测模型的流程步骤。书中专注于两个算法族。通过限制涵盖的算法数量，可以对这些算法的背景及其使用机制进行更详尽的解释。本章展示了一些比较性能结果，以激发选择这两个特定族类的动机。本章讨论了这两个族类的不同优势和特征，并对倾向于其中一类的的问题类型给出了一些描述。\n\
  \n本章还概述了开发预测模型的流程步骤，并详细说明了每一步的权衡和结果。建议使用未包含在模型训练中的数据来生成预测模型的性能估计。\n\n本书的目标是让几乎或完全没有机器学习经验的程序员达到能够胜任并舒适地将机器学习融入项目的程度。书中并没有介绍广泛的算法。相反，它涵盖了几个顶级的（best-in-class）算法，这些算法可以为你提供性能、灵活性清晰度。一旦你稍微了解了它们的工作原理并具有了一些使用经验，你就会发现使用它们既简单又快速。它们将使你能够解决各种问题，而无需花费大量精力进行训练，并且能让你对它们性能的来源产生洞察。\n\
  \n\n\n\n# 第 2 章\n\n## 理解问题\n\n### 通过数据理解问题\n\n一个数据集（问题）就像一份礼物。在你解决它之前，它充满了潜力和期待。在你打开它之前，它仍然是一个谜团。本章关于如何打开你的数据集，以便你可以看到里面的内容，了解你可以用数据做什么，并开始思考如何使用数据构建模型。\n\
  \n本章有两个目的。其一是让你熟悉之后将用于解决第 4 章中的示例建立了术语，并代表了一个小型机器学习数据集。表格将为你提供数据集的心理图像，使得“对应属性的列”或“对应示例的行”变得熟悉。示例中，预测分析问题是预测未来一年个人在线购买书籍的费用。\n\
  \n表 2.1 中的列被赋予了标记，以指示它们在机器学习问题中扮演的角色。标记为属性的列将用于预测在书籍上的金额。在标记为标签的列中，你将看到每个客户去年在书籍上花费了多少钱。\n\
  \n\n\n\n\n在表 2.1 中，每一行代表一个单独的客户，行数据都与该个体相关。第一列被称为 `UserID`，包含一个对于每行（每个情况）都是唯一的标识符。你的问题中可能存在唯一标识符，也可能不存在。例如，网站通常会为访问者标记一个\
  \ `user ID`，该 ID 在其访问期间与他们关联。如果用户没有在网站注册，则同一个用户在每次访问时都会获得一个不同的 `ID`。`ID` 通常分配给每个观测值，该观测值将是你准备构建的预测的主体。第\
  \ 2、3 和 4 列被称为 `Attributes`（属性），而不是像 `Height`（身高）或 `Gender`（性别）这样具体的名称。其目的在于强调它们在预测过程中的作用。属性是关于案例的可用数据，将用于做出预测。\n\
  \n标签（Labels）是你想要预测的内容。在这个例子中，`UserID` 是一个数字，`Attribute 1` 是身高，`Attribute 2` 是性别，`Attribute\
  \ 3` 是此人去年读了多少书。`Labels` 下方的列包含了该个体去年在网上购买书籍花费了多少钱。这些不同类别的数据将扮演什么角色？机器学习算法对 `user\
  \ id`、`attributes` 和 `labels` 有什么用途？简短答案是：你忽略 `user ID`。你使用 `attributes` 来预测 `labels`。\n\
  \n唯一的 `ID` 是为了账记录目的，允许你追溯与特定案例相关的其他可用数据。通常情况下，唯一的 `ID` 不直接用于机器学习算法。`Attributes`\
  \ 是你选择用于做出预测的因素。`Labels` 是机器学习算法将用于构建构建预测模型的观测结果。\n\n`User ID` 通常不用于做出预测，因为它太具有特殊性。它仅与单个示例相关。机器学习的诀窍在于构建一个可以泛化到新案例的模型（而不仅仅是记忆过去的案例）。为了实现这一点，必须对算法进行推导，使其强制关注多于一行数据。排除\
  \ `user id` 的一种可能例外是 `user id` 是数字的，并且按照用户注册的顺序分配的。基本上，在这种情况下它指示了注册日期，并且是有用的，因为\
  \ ID 接近的用户在相似的时间注册，可以据此被视为一组。\n\n构建预测模型的过程被称为 `training`（训练）。该过程的进展取决于算法，后续章节将介绍细节，但它通常是迭代的。算法假设\
  \ `attributes` 和 `labels` 之间存在预测关系，观察它犯的错误，进行一些纠正，然后迭代该过程直到获得一个稳健的模型。许多技术细节将在稍后介绍，但这就是基本思想。\n\
  \n### 不同类型的属性和标签驱动建模选择\n\n表 2.1 中显示的 `attributes` 有两种不同的类型：数值变量和分类变量（或因子变量）。`Attribute\
  \ 1`（身高）是一个数值型变量，也是最常见的属性类型。`Attribute 2` 是性别，通过 `Male`（男）或 `Female`（女）条目指示。这种属性被称为\
  \ `categorical`（分类）或 `factor`（因子）变量。分类变量的特性是各种值之间没有顺序关系。`Male < Female` 没有意义的（尽管存在几个世纪的争论）。分类变量可以是二值的（如\
  \ `Male Female`），也可以是多值的（例如州份：`AL, AK, AR … WY`）。关于属性还可以进行其他区分（例如整数与 `float` 浮点数），但它们对机器学习算法的影响相同。这是因为许多机器学习算法只接受数值属性；它们无法处理分类或因子变量。惩罚回归算法只处理数值属性。支持向量机、核方法和\
  \ `k-nearest neighbors`（k-近邻）也是如此。第 4 章将涵盖将分类变量转换为数值变量的方法。变量的性质将决定你的算法选择以及你开发预测模型的方向，因此当你面对新问题时，这是你需要的事的事之一。\n\
  \n标签（`labels`）也存在类似的二分法。表 2.1 中显示的 `labels` 是数值的：该个体去年在网上购买书籍花费的金额。但在其他问题中，`labels`\
  \ 也可以是分类的。例如，如果表 2.1 中的工作是为了预测哪些个体明年将花费超过 200 美元，那么问题就会改变，处理方法也会随之改变。预测哪些客户将花费超过\
  \ 200 美元的新问题将新的 `labels`。新的 `labels` 将取两个值之一。表 2.2 显示了表 2.1 中提供的 `labels` 与基于逻辑命题\
  \ `Spending > $200` 的新 `labels` 之间的关系。表 2.2 中显示的新 `labels` 取两个值之一——`True`（真）或 `False`（假）。\n\
  \n\n| 表 1 标签 || \\>$200 ? |\n| --- | --- |\n| $120 | False |\n| --- | --- |\n| $270\
  \ | True |\n| $75 | False |\n| $600 | True |\n\n当 `labels` 是数值型时，问题被称为 `regression`（回归）。当\
  \ `labels` 是分类的时，问题被称为 `classification`（分类）。如果分类目标只有两个值，问题被称为 `binary classification`（二分类）。如果它有超过两个值，问题被称为\
  \ `multiclass classification`（多分类）。\n\n在许多情况下，问题类型的选择取决于设计者。你刚刚看到通过对标签进行简单转换，这个例子就可以从回归问题转换为二分类问题。这些是在处理问题时可能会做的权衡。例如，分类目标可能更好地支持两种行动方案之间的决策。\n\
  \n分类问题可能比回归问题更简单。例如，考虑单条等高线（例如 100 英尺等高线）地图与每 10 英尺一条等高线的地图之间的复杂度差异。单条等高线将地图分为高于\
  \ 100 英尺和低于区域，包含的信息比详细等高线地图少得多。分类器试图计算一条单一等高线，而不考虑远离决策边界的行为，而回归则试图绘制整个地图。\n\n###\
  \ 关于新数据集需要注意的事项\n\n在对数据进行初始检查时，你希望确定数据集的其他特征。以下是一个清单和一系列了解你数据集的事项，以熟悉数据并制定你想要遵循的预测模型开发步骤。这些是简单的检查项，并直接影响你的后续步骤。此外，这个过程让你在数据中移动并了解其属性。\n\
  \n**是需要检查的项目**\n\n-   行数和列数\n-   分类变量的数量以及每个变量唯一值的数量\n-   缺失值\n-   属性和标签的统计摘要\n\n\
  \n\n\n首先要检查的内容之一是数据的规模和形状。将数据读入一个列表列表；那么外部列表的维度就是行数，而其中一个内部列表的维度就是列数。下一节将展示如何将此方法具体应用于某一个数据集，该数据集稍后将被使用，用于说明将要开发的算法的属性。\n\
  \n该流程的下一步是确定每行中有多少个缺失值。按行处理的原因是，处理缺失值简单的方法是丢弃不完整的实例（即至少包含一个缺失值的示例）。在许多情况下，这可能会导致结果产生偏差，但只有几个不完整的示例不会产生实质性影响。通过统计带有缺失数据的行数（除了总缺失条目数外），你将知道如果使用简单方法，需要丢弃数据集中的多少数据。\n\
  \n如果你有大量行（例如在收集网络数据时可能会出现），与你拥有的数据行数相比，丢失的数量可能很小。如果你正在处理生物学问题，数据非常昂贵且你有许多属性，你可能无法负担丢数据的代价。在这种情况下，你必须找到一些填充缺失值的方法，或者使用可以处理这些值的算法。填充这些值被称为\
  \ `imputation`（插补）。插补缺失数据最简单的方法是使用每行条目的平均值来填充缺失条目。更复杂的方法是使用第 4 章和第 6 章中涵盖的预测方法之一。要使用预测方法，将具有缺失值的属性列视为标签。在进行此过程之前，务必移除原始的问题标签。\n\
  \n接下来的几节将介绍此处概述的流程，并介绍一些表征你的数据集的方法，以帮助你决定如何开展建模过程。\n\n## 分类问题：使用声纳探测未爆炸地雷\n\n本节将介绍在你开始深入研究某个分类问题时可能进行的几项检查。它从尺寸和形状的简单测量开始，报告数据类型、统计缺失值等。然后转向数据的统计属性以及属性之间、属性与标签之间的相互关系。该数据集来自加州大学爱亥文数据库\
  \ [Ref 1988]。这些数据源于某些实验，旨在确定声纳是否可以用于探测军事行动后留在港口的的未爆炸地雷。声纳信号是所谓的 `chirped signal`（调频信号）。这意味着信号在声脉冲持续期间频率会上升（或下降）。数据集中的测量值代表声纳接收器在返回信号的不同点采集的功率测量值。对于大约一半的示例，声纳正在照射一块岩石，另一半则是具有地雷形状的金属圆柱。该数据集被称为“岩石与地雷”。\n\
  \n### 岩石与地雷数据集的物理特征\n\n处理新数据集的第一件事是确定其规模和形状。列表 2-1 显示了确定加州大学爱亥文数据库中“岩石与地雷”数据集规模和形状的代码：岩石与地雷数据。在本章后面，你将学习更多关于该数据集的信息，并在介绍算法时使用它作为示例。在这种情况下，确定行数和列数的过程非常简单。文件是用逗号分隔的，每个实验的数据占据一行文本。这使得读取一行、根据逗号分隔符进行分割，并将生成的列表堆叠到包含整个数据集的外部列表中变成件易事。\n\
  \n\n```python\n__author__ = 'mike_bowles'\n\n#从 uci 数据库读取数据\nxList = list_read_rvm()\n\
  \nprint('Number of Rows of Data = ' + str(len(xList)))\nprint('Number of Columns\
  \ of Data = ' + str(len(xList[1])))\n\nPrinted Output:\nNumber of Rows of Data =\
  \ 208\nNumber of Columns of Data = 61 \n```\n\n如你在示例输出所示，该数据集有 208 行（行）和 61 列（每行的字段）。这产生了什么影响？行数和列数对你后续的操作有几方面影响。首先，整体规模让你大致了解你的训练时间将有多长。对于像岩石与地雷这样的小数据集，训练时间将不到一分钟，这将有助于迭代训练和调优的过程。如果数据集增长到\
  \ 1,000 x 1,000，惩罚线性回归的训练时间将增长到几秒钟，而集成方法将需要几分钟。当数据集达到几万行若干列时，惩罚线性回归的训练时间将扩展到 3 或\
  \ 4 小时，而集成方法将需要 12 到 24 小时。更长的训练时间将影响你的开发时间，因为你会迭代多次。\n\n关于行数和列数的第二个重要观察是，如果数据集的列数远多于行数，你可能通过惩罚线性回归获得最佳预测，反之亦然。第\
  \ 3 章“预测模型构建：平衡性能、复杂性和大数据”以及你稍后运行的示例将让你更好地理解为什么是这样。\n\n检查清单的下一步是确定数据列中有多少是数值型的，多少是分类型的。列表\
