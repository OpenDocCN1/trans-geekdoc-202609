  \nplt.scatter(dataRow2, dataRow21)\n\nplt.xlabel(\"2nd Attribute\")\nplt.ylabel((\"\
  21st Attribute\"))\nplt.show()\n```\n\nFigures 2.4 和 2.5 展示了来自岩石与矿山数据集中两对属性的散点图。岩石与矿山的属性是声纳返回信号的样本。这种声纳信号被称为*调频*（chirped）波形，因为它是一个从低频率开始并在脉冲持续期间升高的脉冲。岩石与矿山数据集中的属性是反射岩石或矿山的声波时间样本。这些返回的声学信号在时间和频率上的关系与发射信号相同。岩石与矿山数据中的\
  \ 60 个属性是在 60 个不同时间（因此是 60 个不同频率）采集的返回样本。你会预计相邻属性比时间上间隔的属性具有更相关性，因为相邻时间样本之间的频率差异不大。\n\
  \n![Figure 2.4: 岩石与矿山属性 2 和 3 的交叉图](img/c02f004.png)\n\n**Figure 2.4**](#c02.xhtml#R_c02-fig-0004):\
  \ 岩石与矿山属性 2 和 3 的交叉图\n\n这种直觉在 Figures 2.4 和 2.5 中得到了证实。Figure 2.4 中散点图中的点比 Figure\
  \ 2.5 中的点更聚集在直线周围。如果你想培养关于数值相关性与散点图形状之间关系的直觉，只需搜索“correlation”并查看出现的维基百科页面。该页面展示了一些散点图和相关的数值相关性。基本上，如果散点图中的点沿着一条细线分布，则两个变量高度相关；如果它们形成一个点球，则它们是不相关的。\n\
  \n![Figure 2.5: 岩石与矿山属性 2 和 21 的交叉图](img/c02f005.png)\n\n**Figure 2.5**](#c02.xhtml#R_c02-fig-0005):\
  \ 岩石与矿山属性 2 和 21 的交叉图\n\n你可以将相同的原理应用于绘制每个属性与`target`之间的相关性图。对于目标为实数的问题（回归问题），图表看起来与\
  \ Figures 2.4 和 2.5 非常相似。岩石与矿山数据集是一个分类问题。目标是二值的。你可以遵循相同的步骤。\n\nListing 2-8 显示了绘制`targets`与属性\
  \ `35` 之间散点图的代码。使用属性 `35` 作为显示与`target`相关性的示例灵感来自 Figure 2.3 中的平行坐标图。该图显示了在索引值 `35`附近岩石和矿山（红线和蓝线）之间的某些分离。`target`与该附近的一个属性之间的相关性在\
  \ Figures 2.6 和 2.7 中显示。\n\n\n\n\n两个属性（或一个属性与目标）之间的相关性程度可以使用皮逊相关系数来量化。皮逊相关系数对于两个等长向量\
  \ `u` 和 `v` 的定义如下（参见公式 2.1 和 2.2）。首先，从 `u` 的所有元素中减去其平均值（参见公式 2.3），并对 `v` 执行相同的操作。\n\
  \n![公式 2.1:  向量 u 的元素](img/c02-disp-0001.png)\n\n`公式 2.1`:  向量 u 的元素\n\n![公式 2.2:\
  \  u 中项的平均值](img/c02-disp-0002.png)\n\n`公式 2.2`:  u 中项的平均值\n\n![公式 2.3:  从 u 的每个元素中减去平均值](img/c02-disp-0003.png)\n\
  \n`公式 2.3`:  从 u 的每个元素中减去平均值\n\n对于第二个向量 `v`，以与向量 `u` 定义 `Δu` 相同的方式定义向量 `Δv`。\n\n\
  然后 `u` 和 `v` 之间的皮逊相关性如公式 2.4 所示\n\n![公式 2.4:  皮逊相关系数的定义](img/c02-disp-0004.png)\n\
  \n`公式 2.4`:  皮逊相关系数的定义\n\n列表 2-9 展示了该函数的 Python 实现，用于计算图 2.3 和 2.5 中绘制的属性对的相关性。相关性数值与绘制的数据一致。索引数字接近的属性比分离得较远的属性具有相对较高的相关性。\n\
  \n#### 列表 2-9`: 属性 2 与 3 以及 2 与 21 的皮逊相关性计算 — corrCalc.py\n\n```python\n__author__\
  \ = 'mike_bowles'\nfrom math import sqrt\nfrom Read_Fcns import pd_read_rvm\nfrom\
  \ scipy.stats.stats import pearsonr \n\nrocksVMines = pd_read_rvm()\n\n#calculate\
  \ 实值属性之间的相关性\ndataRow2 = np.array(rocksVMines.iloc[1,0:60])\ndataRow3 = np.array(rocksVMines.iloc[2,0:60])\n\
  dataRow21 = np.array(rocksVMines.iloc[20,0:60])\n\nmean2 = 0.0; mean3 = 0.0; mean21\
  \ = 0.0\nnumElt = len(dataRow2)\nfor i in range(numElt):\n    mean2 += dataRow2[i]/numElt\n\
  \    mean3 += dataRow3[i]/numElt\n    mean21 += dataRow21[i]/numElt\n\nvar2 = 0.0;\
  \ var3 = 0.0; var21 = 0.0\nfor i in range(numElt): \n  var2 += (dataRow2[i] - mean2)\
  \ * (dataRow2[i] - mean2)/numElt\n    var3 += (dataRow3[i] - mean3) * (dataRow3[i]\
  \ - mean3)/numElt\n    var21 += (dataRow21[i] - mean21) * (dataRow21[i] - mean21)/numElt\n\
  \ncorr23 = 0.0; corr221 = 0.0\nfor i in range(numElt):\n    corr23 += (dataRow2[i]\
  \ - mean2) * \\\n              (dataRow3[i] - mean3) / (sqrt(var2*var3) * numElt)\n\
  \    corr221 += (dataRow2[i] - mean2) * \\\n               (dataRow21[i] - mean21)\
  \ / (sqrt(var2*var21) * numElt) # 注意：此处原文逻辑中可能有误，但按要求翻译/保持结构\n\nprint('Correlation\
  \ between 2 and 3')\nprint(corr23, '\\n')\n\nprint('Correlation between 2 and 21')\n\
  print(corr221, '\\n')\n\nprint('Now you see how the calculation is done, using the\
  \ python\nfunction will save you time')\nprint(pearsonr(dataRow2, dataRow3))\n\n\
  打印输出:\nCorrelation between 2 and 3\n0.770938121191223\n\nCorrelation between 2 and\
  \ 21\n0.4665480807886865\n```\n\n### 使用热力图可视化属性相关性\n\n计算相关性并打印它们或绘制散点图对于少数相关性效果良好，但对于大量的数字表格很难掌握，而且如果问题包含\
  \ 100 个属性，则很难将所有散点图挤到一个页面上。\n\n检查大量属性相关性的方法是计算属性对的皮逊相关系数，将这些相关性排列成矩阵（其中 `i`, `j`\
  \ 项是第 `i` 个属性与第 `j` 个属性之间的相关性），然后使用热力图绘制它们。列表 2-10 提供了制作此图的代码。图 2.8 显示了该。对角线附近的浅色区域证实了索引相邻的属性具有较高的相关性。如前所述，这是由于数据生成的方式。相邻的索引在短的时间间隔内采样，因此具有相似的频率。相似的频率对目标的反射也相似（以此类推）。\n\
  \n```python\n__author__ = 'mike_bowles'\n#read versus mines data into pandas frame\n\
  rocksVMines = pd_read_rvm()\n#calculate 实值属性之间的相关性\ncorMat = DataFrame(rocksVMines.corr())\n\
  #using heatmap 可视化性\nplt.pcolor(corMat)\nplt.show()\n```\n\n![图 2.8: 显示属性相关性的热力图](img/c02-f008.png)\n\
  \n\n\n\n\n此问题的数据可以通过加州大学 UCI 数据集获取。该数据集的 URL 为 `http://archive.ics.uci.edu/ml/machine-learning-databases/abalone/abalone.data`。该数据集以逗号分隔的文件形式存在，且没有列标题。列名存储在另一个单独的文件。Listing\
  \ 2-11 将鲍鱼数据集读入 `pandas` 数据框中，并运行了一些与你在“分类问题：使用声呐探测未爆地雷”中看到的相似的分析。对于岩石与地雷数据集，由于数据的性质，列名较为通用。而对于鲍鱼数据集，不同的数据列具有对于培养对可接受模型进展的直观理解至关重要的意义。因此，你会在代码中看到列名被复制粘贴到代码中并附加到数据集，以帮助你理解后续机器学习算法是如何进行预测的。用于构建预测模型的数据列有\
  \ `Sex`、`Length`、`Diameter`、`Height`、`Whole Weight`、`Shucked Weight`、`Viscera Weight`、`Shell\
  \ Weight` 和 `Rings`。最后一列 `Rings` 是通过锯开贝壳并在显微镜下计数的艰巨过程测量的。这是监督学习问题的常规安排。你拥有一个已知答案的特殊数据集，以便建立在答案未知时生成预测的模型。\n\
  \n除了显示生成摘要的代码外，Listing 2-11 还显示了摘要的打印输出。第一部分打印了数据集的头部和尾部。为了空间，输出中只显示了头部。当你自己运行代码时，将看到两者。数据框的大部分填充的是浮点数。第一列包含动物的性别，包含字母\
  \ `M`（男）、`F`（女）和 `I`（不确定）。鲍鱼的性别在出生时并不确定，而是在稍微成熟后。因此，幼鲍鱼的性别是不定的。鲍鱼性别是一个三值分类变量。分类属性需要特别注意。某些算法只处理实值属性（例如支持向量机、k\
  \ 最近邻和在 4 章中介绍的惩罚线性回归）。[4 章]讨论了将分类变量转换为实值变量的技术，以便你使用这些算法。Listing 2-11 还显示了实值属性的逐列统计摘要。\n\
  \n### Listing 2-11: 读取并总结鲍鱼数据集 — abaloneSummary.py\n\n```python\n__author__ = 'mike_bowles'\n\
  \nfrom Read_Fcns import pd_read_abalone\n#read abalone data\nabalone = pd_read_abalone()\n\
