  \ \nplt.xlabel(\"Attribute Index\")\nplt.ylabel((\"Quartile Ranges\"))\nplt.show()\n\
  \n#the last column (rings) is out of scale with the rest\n## - remove and replot\n\
  array2 = abalone.iloc[:,1:8].values\nplt.boxplot(array2)\nplt.xlabel(\"Attribute\
  \ Index\")\nplt.ylabel((\"Quartile Ranges\"))\nplt.show()\n\n#removing is okay but\
