  \n## 多分类问题：那是什么种类型的玻璃？\n\n多分类与二分类相似，不同之处在于有多个可能的离散结果，而不是只有两个。回想一下探测未爆炸地雷的问题涉及两个可能的结果：声呐照明的物体是岩石还是地雷。根据化学成分测量值确定葡萄酒口味的问题有几个可能的结果（3\
  \ 到 8 分的口感评分）。但对于葡萄酒问题，评分之间存在顺序关系。得分为 5 分的葡萄酒比 3 分的葡萄酒好，但比 8 分的葡萄酒差。在多分类问题中，结果之间不存在顺序关系。本节描述的玻璃问题提供了一个多分类问题的示例。\n\
  \n在本节中，玻璃问题展示了各种类型玻璃的化学成分。该问题的目标是确定玻璃的用途。可能的玻璃类型包括建筑窗户玻璃、车辆窗玻璃、玻璃容器等。确定玻璃类型的动机是法医学鉴定。在事故或犯罪现场，会有玻璃碎片，确定它们的来源可以帮助判断谁负有责任或谁是犯罪罪犯。代码列表\
  \ 2-16 显示了生成玻璃数据集摘要的代码。图 2.20 显示了在归一化数据上的箱线图。箱线图显示了大量的极值。\n\n![图 2.20：玻璃数据的箱线图](img/c02f020.png)\n\
