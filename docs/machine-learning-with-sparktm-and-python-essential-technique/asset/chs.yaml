  \ 集成模型拟合复杂数据的小样本\n\n### 驱动预测算法性能的因素\n\n这些结果解释了为什么人们对海量数据感到兴奋。复杂问题的准确预测需要海量数据。但数据量本身并不是一个足够精确的衡量标准。数据的形状也很重要。\n\
  \n公式 3.1 将预测数据描述为一个具有若干行（高）和若干列（宽）的矩阵。矩阵中的条目数是行数乘以列数。在使用进行建模时，行数和列数之间存在重要的区别。增加一列意味着增加一个新的属性。增加一行行意味着获取现有属性的额外历史示例。为了理解新行的影响与新列的影响有何不同，考虑将公式\
  \ 3.1 中的属性与公式 3.2 中的标签相关的线性模型。\n\n假设模型具有如下形式（见公式 3.7）：\n\n![公式 3.7: 属性与结果之间的线性关系](img/c03-disp-0007.png)\n\
  \n`公式 3.7: 属性与结果之间的线性关系\n\n在这里，`xi` 是属性的一行，是一个待定的系数列向量。在属性矩阵中增加一列意味着增加了另一个需要确定的系数。这个增加的系数也称为`自由度`。增加另一个自由度意味着让模型变得更复杂。之前的示例表明，使模型更复杂需要更多数据。出于这个原因，人们通常按行列比例（长宽比）来考虑。生物学数据集和自然语言处理数据集是非常庞大的例子，因为它们有很多列，但它们有时并不足够大，不足以通过复杂的建模方法获得良好的性能。在生物学中，基因组数据集可以轻松包含\
  \ 10,000 到 50,000 个属性。即使有数万次单独实验（数据行），基因组数据集可能也不足以训练一个复杂的集成模型。线性模型可能会提供等效或更好的性能。基因组数据是昂贵的。一次实验（行）的成本可能超过\
  \ 5,000 美元，使得整个数据集的成本超过 5000 万美元。文本收集和存储相对便宜，但可能比基因组数据更宽。在某些自然语言处理问题中，属性是单词，行是文档。属性矩阵中的条目是单词在文档中出现的次数。列数是文档集合的词汇量。根据预处理（例如，删除\
  \ `a`、`and` 和 `of` 等常用词），词汇量可以从几千到几万不等。当在统计单词的同时计算 n-gram 时，文本属性矩阵会变得非常宽。n-gram\
  \ 是相邻（或足够接近一个短语）的两个、三个或四个单词组。当也计算两个、三个或四个单词的组时，自然语言处理的属性空间可能会增长到超过百万个属性。再次，线性模型可能会比更复杂的集成模型提供等效或更好的性能。\n\
  \n### 选择算法：线性还是非线性？\n\n你刚刚看到的视觉示例提供了线性和非线性预测模型之间性能权衡的想法。当数据集列多于行，或者底层问题简单时，线性模型更优。对于行远多于列的复杂问题，非线性模型更优。另一个因素是训练时间。线性技术的训练速度比非线性技术快得多。（在我们介绍了第\
  \ 4 章中决策边界的集成模型是训练过程中产生的约千个不同模型之一。这些模型具有各种不同的复杂度。其中某些模型对图 3.6](#c03.xhtml#c03-fig-0012)中明显边界的近似要粗糙得多。生成图\
  \ 3.6](#c03.xhtml#c03-fig-0012）中决策边界的模型被选中，是因为它在样本外数据上的表现最好。这一过程适用于许多现代机器学习算法。\n\
  \n\n\n\n\n# 衡量预测模型的性能\n\n本节涵盖了与预测模型性能衡量指标相关的两个广泛领域。第一个领域是针对不同类型的问题可以使用不同指标（例如，在回归问题中使用\
  \ `MSE`，在分类问题中使用误分类误差）。在文献（以及机器学习竞赛）中，你还会看到诸如受试者工作曲线（`ROC curves`）和曲线下面积（`AUC`）等指标。此外，这些思想对于优化性能也有用。\n\
  \n第二个广泛领域包含用于收集样本外误差（out-of-sample error）估计的技术。请记住，样本外误差旨在模拟新数据上的误差。在设计实践中，使用这些技术来比较不同的算法，并针对给定的问题复杂数据集规模选择最佳模型复杂度是一个重要环节。这一过程将在本章稍后部分进行详细讨论，并应用于书中其余部分的示例中。\n\
  \n## 不同类型问题的性能衡量\n\n回归问题的性能衡量相对直观。在回归问题中，目标值和预测值都是实数。误差自然定义为目标值与预测值之间的差。生成误差的统计摘要对于比较和诊断是有用的。最常用的摘要是均方误差（`MSE`）和平均绝对误差（`MAE`）。列表\
  \ 3.1: MSE、MAE 和 RMSE 的比较——regressionErrorMeasures.py\n\n```python\n__author__ =\
  \ 'mike_bowles'\nfrom math import sqrt\n\n#here are some made-up numbers to start\
  \ with\ntarget = [1.5, 2.1, 3.3, -4.7, -2.3, 0.75]\nprediction = [0.5, 1.5, 2.1,\
  \ -2.2, 0.1, -0.5]\n\nerror = []\nfor i in range(len(target)):\n    error.append(target[i]\
  \ - prediction[i])\n\n#print the errors\nprint(\"Errors \",)\nprint(error, '\\n')\n\
  \n#calculate the squared errors and absolute value of errors\nsquaredError = []\n\
  absError = []\nfor val in error:\n    squaredError.append(val*val)\n    absError.append(abs(val))\n\
  \n\n#print squared errors and absolute value of errors\nprint(\"Squared Error\"\
  )\nprint(squaredError, '\\n')\n\nprint(\"Absolute Value of Error\")\nprint(absError,\
  \ '\\n')\n\n#calculate and print mean squared error MSE\nprint(\"MSE = \", sum(squaredError)/len(squaredError))\n\
  \n#calculate and print square root of MSE (RMSE)\nprint(\"RMSE = \", sqrt(sum(squaredError)/len(squaredError)))\n\
  \n#calculate and print mean absolute error MAE\nprint(\"MAE = \", sum(absError)/len(absError))\n\
  ```\n\n\n\n\n思考这一问题的一种实用方法是将可能的结果整理成所谓的`confusion matrix`（混淆矩阵）或`contingency table`（列联表\
  \ `http://en.wikipedia.org/wiki/Confusion_matrix`）。图 3.9 展示了一个列联表的示例。列联表中的数字代表基于上段讨论的阈值选择选择所对应的性能。图\
  \ 3.9 中的混淆矩阵汇总了针对特定阈值概率选择对 135 个测试样本进行预测的结果。该矩阵有两个列，代表可能的预测结果。它还有两行，代表每个样本的真实情况（标签）。因此，测试集中的每个样本都可以分配到表中四个单元格之一。图\
  \ 3.9 中描述的两种分类是“点击”和“未点击”，这适用于选择广告。根据所解决的具体问题，它们也可以对应于“欺诈”和“非欺诈”——或其他组合。\n\n左上角的单元格包含预测为点击且与标签（真实情况）相符的样本。这些被称为`true\
  \ positive`（真阳性），通常缩写为 `TP`。左下框中的项对应于预测为正类（点击）但真实情况为负类（未点击）的样本。这些被称为`false positive`（假阳性），缩写为\
  \ `FP`。矩阵的右侧列包含预测为未点击的样本。右上角的样本在真实情况下是点击，被称为`false negatives`（假阴性）或 `FN`。右下角的样本被预测为未点击且与实际结果一致。它们被称为`true\
  \ negative`（真阴性）或 `TN`（注：此处原文误写为 false negative/FN，应为 true negative/TN）。\n\n![图\
  \ 3.9: 混淆矩阵示例](img/c03f009.png)\n\n图 3.9: 混淆矩阵示例\n\n### 当概率阈值改变时会发生什么？考虑极端值。如果将概率阈值设置为\
  \ 0.0，无论你的模型预测概率是多少，它都会被标记为点击。所有样本最终都落在左列。右列只有 0。TP 的数量将增加到 17。FP 的数量将增加到 118。如果\
  \ FP 没有成本且真阴性（TN）没有奖励，那么这可能是一个不错的选择，但这样不需要任何预测算法来假设每个输入样本都是点击。同样，如果 FN 没有成本且 TP\
  \ 没有收益，则可以将阈值设置为 1.0，使得所有样本都被归类为未点击。这些极端情况有助于理解，但在部署的系统中并没有用处。接的示例展示了如何为“岩石与地雷”数据集构建分类器的工作流程。\n\
  \n“岩石与地雷”数据集提出了构建一个分类器的问题，该分类器使用声纳数据来确定海底物体是岩石还是地雷。（关于该数据集更深入的讨论和探索，请参见第 2 章“通过理解数据来理解问题”）。Listing\
  \ 3.2 显示了在“岩石与地雷”数据集上训练简单分类器的 Python 代码，并预测了该分类器的性能。\n\n#### Listing 3.2: 衡量在岩石与地雷上训练的分类器的性能——`classifierPerformance:RocksVMines.py`\n\
  \n\n\n\n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_rvm\n\
  import numpy as np\nimport random\nfrom sklearn import datasets, linear_model \n\
  from sklearn.metrics import roc_curve, auc\nimport matplotlib.pyplot as plt\n\n\n\
  def confusionMatrix(predicted, actual, threshold):\n    if len(predicted) != len(actual):\
  \ return -1\n    tp = 0.0\n    fp = 0.0\n    tn = 0.0\n    fn = 0.0\n    for i in\
  \ range(len(actual)):\n        if actual[i] > 0.5: # 标签为 1.0 的（正样本）\n          \
  \  if predicted[i] > threshold:\n                tp += 1.0 # 正确预测正样本\n         \
  \   else:\n                fn += 1.0 # 错误预测负样本\n        else:              # 标签为\
  \ 0.0 的（负样本）\n            if predicted[i] < threshold:\n                tn += 1.0\
  \ # 正确预测负样本\n            else:\n                fp += 1.0 # 错误预测正样本\n    rtn = [tp,\
  \ fn, fp, tn]\n    return rtn\n\n# 使用 scikit learn 包执行线性回归\n# 从 uci.edu 数据仓库读取岩石与矿石数据集\n\
  xList, labels = list_read_rvm()\n\n# 将属性和标签划分为训练集和测试集（2/3 和 1/3）\nindices = range(len(xList))\n\
  xListTest = [xList[i] for i in indices if i%3 == 0 ]\nxListTrain = [xList[i] for\
  \ i in indices if i%3 != 0 ]\nlabelsTest = [labels[i] for i in indices if i%3 ==\
  \ 0]\nlabelsTrain = [labels[i] for i in indices if i%3 != 0]\n\n# 构建训练数据和测试数据数组\n\
  xTrain = np.array(xListTrain); yTrain = np.array(labelsTrain) \nxTest = np.array(xListTest);\
  \ yTest = np.array(labelsTest)\n\n# 检查形状查看结构\nprint(\"Shape of xTrain array\", xTrain.shape)\n\
  print(\"Shape of yTrain array\", yTrain.shape)\nprint(\"Shape of xTest array\",\
  \ xTest.shape)\nprint(\"Shape of yTest array\", yTest.shape)\n\n# 训练线性回归模型\nrocksVMinesModel\
  \ = linear_model.LinearRegression()\nrocksVMinesModel.fit(xTrain,yTrain)\n\n# 生成样本内误差预测\n\
  trainingPredictions = rocksVMinesModel.predict(xTrain)\nprint(\"\\nSome values predicted\
  \ by model\", trainingPredictions[0:5], \\\n      trainingPredictions[-6:-1])\n\n\
  # 为训练集上的预测生成混淆矩阵（样本内）\nconfusionMatTrain = confusionMatrix(trainingPredictions,\
  \ yTrain, 0.5)\n# 选择阈值值并生成混淆矩阵项\ntp = confusionMatTrain[0]; fn = confusionMatTrain[1]\n\
  fp = confusionMatTrain[2]; tn = confusionMatTrain[3]\n\nprint(\"\\ntp = \" + str(tp)\
  \ + \"\\tfn = \" + str(fn) + \"\\n\" + \"fp = \" + \\\n      str(fp) + \"\\ttn =\
  \ \" + str(tn) + '\\n')\n\n# 生成样本外数据的预测\ntestPredictions = rocksVMinesModel.predict(xTest)\n\
  \n# 从样本外数据的预测生成混淆矩阵\nconMatTest = confusionMatrix(testPredictions, yTest, 0.5)\n\
  \n# 选择阈值值并生成混淆矩阵项\ntp = conMatTest[0]; fn = conMatTest[1] \nfp = conMatTest[2];\
  \ tn = conMatTest[3]\nprint(\"tp = \" + str(tp) + \"\\tfn = \" + str(fn) + \"\\\
  n\" + \"fp = \" + \\\n      str(fp) + \"\\ttn = \" + str(tn) + '\\n')\n\n# 为样本内生成\
  \ ROC 曲线\n\nfpr, tpr, thresholds = roc_curve(yTrain,trainingPredictions)\nroc_auc\
  \ = auc(fpr, tpr)\nprint( 'AUC for in-sample ROC curve: %f' % roc_auc)\n\n### 绘制\
  \ ROC 曲线\nplt.clf()\nplt.plot(fpr, tpr, label='ROC curve (area = %0.2f)' % roc_auc)\n\
  plt.plot([0, 1], [0, 1], 'k--')\nplt.xlim([0.0, 1.0])\nplt.ylim([0.0, 1.0])\nplt.xlabel('False\
  \ Positive Rate')\nplt.ylabel('True Positive Rate')\nplt.title('In sample ROC rocks\
  \ versus mines')\nplt.legend(loc=\"lower right\")\nplt.show()\n\n# 为样本外生成 ROC 曲线\n\
  fpr, tpr, thresholds = roc_curve(yTest,testPredictions)\nroc_auc = auc(fpr, tpr)\n\
  print( 'AUC for out-of-sample ROC curve: %f' % roc_auc)\n\n### 绘制 ROC 曲线\nplt.clf()\
  \ \nplt.plot(fpr, tpr, label='ROC curve (area = %0.2f)' % roc_auc)\nplt.plot([0,\
  \ 1], [0, 1], 'k--')\nplt.xlim([0.0, 1.0])\nplt.ylim([0.0, 1.0])\nplt.xlabel('False\
  \ Positive Rate')\nplt.ylabel('True Positive Rate')\nplt.title('Out-of-sample ROC\
  \ rocks versus mines')\nplt.legend(loc=\"lower right\")\nplt.show()\n```\n\n\n\n\
  \n代码的第一部分从加州大学欧文分校数据库读取输入数据，然后将其格式化为用于标签的列表以及属性的嵌套列表。下一步是将数据（标签和属性）分为两个子集：一个包含数据三分之一的测试集，以及一个包含剩余二分之二的训练集。标记为\
  \ `test` 的数据将不会用于训练分类器，而是预留给分类器训练后用于评估其性能。这一步模拟了分类器在部署后处理新数据示例时的行为。本章后面将讨论各种留出数据以及对新数据进行性能估计的不同方法。\n\
  \n分类器的训练通过将原始数据集中的标签 `M`（代表地雷）和 `R`（代表岩石）转换为数值来实现——`1.0` 对应地雷，`0.0` 对应岩石——然后使用普通最小二法回归拟合线性模型。这是一种非常容易理解和实现的方法，通常生成的性能与稍后讨论的更复杂的算法非常相似。列表\
  \ 3.2 中的程序使用了 `scikit-learn` 中的线性回归类来训练普通最小二法模型。然后，使用训练好的模型对训练集和测试集生成预测结果。\n\n代码打印了预测的一些代表性数值。线性回归模型生成的数字大多在\
  \ `0.0` 到 `1.0` 之间，但并非完全如此。预测值并不完全是概率。它们仍然可以通过与阈值进行比较来生成预测分类。`confusionMatrix()`\
  \ 函数产生混淆矩阵的值，类似于图 3.9。它接收预测值、相应的实际值（标签）和一个阈值作为输入。它将预测值与阈值进行比较，以确定将每个示例分配到混淆矩阵中的“预测正”列还是“预测负”列。它使用实际值将其分配到混淆矩阵相应的行。\n\
  \n可以从混淆矩阵中读取每个阈值的错误率。错误总数是 `FPs` 和 `FNs` 之和。示例代码为样本内和样本外数据生成混淆矩阵并将它们全部打印。样本内数据的分类错误率约为\
  \ 8%，样本外数据约为 26%。通常情况下，样本外性能会差于样本内性能。它也能代表对新示例的预期误差。\n\n当阈值改变时，分类错误也会发生变化。表 3.2\
  \ 显示了分类错误率随阈值值变化的变化。表中的数字基于样本外结果。这对于书中描述性能的数字通常都成立。任何样本内错误都会带有警告标签：“警告：这些是样本内错误。”如果目标是最小化分类错误，那么最佳阈值是\
  \ `0.25`。\n\n### 表 3.2: 分类错误对决策阈值的依赖性\n\n| 决策阈值 | 分类错误率 |\n| :--- | :--- |\n| `0.0`\
  \ | 28.6% |\n| `0.25` | 24.3% |\n| `0.5` | 25.7% |\n| `0.75` | 30.0% |\n| `1.0`\
  \ | 38.6% |\n\n阈值的最佳值可能是使分类错误最小化的那个值。然而，有时一种错误的成本比另一种更高。例如，假设在岩石与地雷的判别中，派遣一名潜水员进行视觉检查花费\
  \ 100 美元，而如果不移除未爆炸的地雷，预计造成的伤亡和财产损失为 1000 美元。一个 `FP` 的成本是 100 美元，一个 `FN` 的成本是 1000\
  \ 美元。基于这些假设，表 3.3](#c03.xhtml#tbl0003)总结了不同阈值下的错误金钱成本。将地雷误认为岩石的高成本（以及将其留在原地威胁健康和安全）将决策阈值降到了零。这意味着会有更多的\
  \ `FNs`，但它们并不那么昂贵。更彻底的分析可以包括与 `TP` 和 `TN` 相关的成本。例如，`TP` 可能涉及移除地雷的成本，以及移除地雷带来的 1000\
  \ 美元收益。如果你的问题中可以获得这些数字（或可以合理估算），那么你有必要利用它们来推导出更好的阈值。\n\n### 表 3.3: 决策阈值的错误成本\n\n\
  | 决策阈值 | 假阴性成本 | 假阳性成本 | 总成本 |\n| :--- | :--- | :--- | :--- |\n| `0.0` | 1000 |\
  \ 900 | 1900 |\n| `0.25` | 3000 | 1400 | 4400 |\n| `0.5` | 9000 | 900 | 9900 |\n\
  | `0.75` | 18000 | 300 | 18300 |\n| `1.0` | 26000 | 100 | 26100 |\n\n注意，总 `FPs`\
  \ 与 `FNs` 的相对成本取决于数据正负样本的比例。岩石与地雷数据集的正样本和负样本（地雷和岩石）数量相等。这可能是由实验方案确定的。实际操作中遇到的正负样本比例可能有所不同。如果系统部署后数字很可能不同，你需要进行一些调整，以考虑实际使用中的比例。\n\
  \n数据科学家可能无法获得成本数据，但可能仍然想要方法来表征分类器的整体性能，而不是使用特定决策阈值的分类错误率。实现该点的常用技术称为受试者工作特征或 ROC\
  \ 曲线（`http://en.wikipedia.org/wiki/Receiver_operating_characteristic`）。\n\n`ROC`\
  \ 名称源于其原始应用——处理雷达接收器的返回信号以确定是否存在敌机。ROC 曲线产生了一张汇总所有不同混淆表的图表。ROC 曲线绘制了真阳性率（缩写 `TPR`）相对于假阳性率（`FPR`）。`TPR`\
  \ 是被正确分类为正的正样本比例（见公式 3.8）。`FPR` 是相对于负样本总数的 `FPs` 数（见公式 3.9）。从表元素来看，这些由以下公式给出：\n\n\
  ![公式 3.8: 真阳性率](img/c03-disp-0009.png)\n公式 3.8: 真阳性率\n\n![公式 3.9: 假阳性率](img/c03-disp-0010.png)\n\
  公式 3.9: 假阳性率\n\n作为一个简单的思想实验，考虑对决策阈值使用极低的值。对于低值，每个示例都被预测为正例。这使得 `TPR` 达到 1.0。因为所有示例都被分类为正，所以没有\
  \ `FNs`（`FN` 为 0.0）。它也使得 `FPR` 达到 1.0，因为没有示例被分类为负（`TN` 为 0.0）。然而，当决策阈值设置得很高时，`TP`\
  \ 等于零，因此 `TPR` 也为零`FP` 也为零，因为没有示例被分类为正。因此，`FPR` 也为零。以下两幅图是使用 `pylab roc_curve()`\
  \ 和 `auc()` 函数绘制的。图 3.10 显示了样本内数据的 ROC 曲线性能。图 3.11 显示了基于样本外数据的 ROC 曲线。\n\n\n\n\n\
  通过随机决定是岩石还是矿石的分类器的 ROC 曲线是一条从图表左下角到右上角的对角线。这条线通常被绘制在 ROC 曲线上作为参考点。对于一个完美的分类器，ROC\
  \ 曲线会从 (0, 0) 直线上升到 (0, 1)，然后直接水平移动到 (1, 1)。不出意外的是，图 3.10（样本内数据）比图 3.11（样本外数据）更接近。分类器越接近左上角，性能就越好。如果\
  \ ROC 曲线显著下降到对角线以下，通常意味着数据科学家在某处弄反了符号，应该仔细检查他的代码。\n\n![图 3.10：岩石 vs 矿石分类器的样本内 ROC](img/c03f010.png)\n\
  \n图 3.10：岩石 vs 矿石分类器的样本内 ROC\n\n![图 3.11：岩石 vs 矿石分类器的样本外 ROC](img/c03f011.png)\n\
  \n图 3.11：岩石 vs 矿石分类器的样本外 ROC\n\n图 3.10 和 3.11 也显示了曲线下积 (AUC) 数。正如其名所示，AUC 是 ROC\
  \ 曲线下方的面积。完美分类器的 AUC 为 1.0，而随机猜测的 AUC 为 0.5。图 3.10 和图 3.11 的 AUC 提供了另一个另一个证明，即基于训练集误差（样本内数据）的性能估计会高估实际性能。样本内数据的\
  \ AUC 为 0.98。样本外数据的 AUC 为 0.85。\n\n用于衡量二分类器性能的一些方法也适用于多分类器。误分类误差仍然有意义，混淆矩阵同样适用。ROC\
  \ 曲线和 AUC 也有多类的推广。¹。\n\n### 模拟已部署模型的性能\n\n前节的示例表明，有必要不对包含在训练集中的数据进行性能测试，以便在预测模型部署后获得预期性能的合用估计。该示例将可用标记数据分为两个子集。一个名为\
  \ `training set`（训练集）的子集包含了约三分之二的可用，用于拟合普通最小二法模型。另一个包含剩余三分之一数据的子集称为 `test set`（测试集），仅用于确定性能（在模型训练期间不使用）。这是机器学习中的标准程序。\n\
  \n测试集的大小在数据的 25% 到 35% 之间，尽管没有硬性规定。需要记住的一点是，随着训练数据集大小的缩小，已训练模型的性能会恶化。从训练集中取出过多的数据可能会对最终性能产生不利影响。\n\
  \n另一种留出数据的方法称为 `n-fold cross-validation`（n 折交叉验证）。图 3.12 示意地展示了使用 n 折交叉验证划分数据集用于训练和测试的方法。数据集被分为\
  \ `n` 个大小相等的不相交集合。在图中，`n` 是 5。对数据进行多次训练和测试轮次。在第一轮中，将第一块数据留作测试，剩下的 `n-1` 用于训练。在第二轮中，将第二块数据留作测试，其他\
  \ `n-1` 用于训练。此过程一直持续到所有数据都被留出（对于图 3.12 所示的五折示例，需要进行五次）。\n\n![图 3.12：n 折交叉验证](img/c03f012.png)\n\
  \n图 3.12：n 折交叉验证\n\nn 折交叉验证过程得出了预测误差的估计，并提供了多个误差样本，以便估计误差边界。它可以在训练集中保留更多数据，这通常会产生更低的误差和更好的性能。例如，如果选择\
  \ 10 折交叉验证，则每次训练轮次仅留出 10% 的数据。n 折交叉验证的这些特点是以增加训练时间为代价的。使用固定留出集的方法优点是训练更快，因为它只需要对数据进行一次遍历。\n\
  \n需要记住的另一点是样本应该是整体数据的代表。前节使用的采样计划不是随机采样。它是每三个点取一个样本。将样本均匀地分布在数据中通常效果良好。但你确实需要避免以会在训练和测试集中引入偏差的方式采样。例如，如果你提供的数据是每天采样一次并按日期顺序排列的，那么应该避免七折交叉验证和每七个点采样一次。\n\
  \n如果所研究的现象具有异常的统计特性，可能需要仔细控制采样。可能需要注意测试样本中的统计特性。例如预测欺诈或广告点击等稀有事件。所建模的事件非常罕见，随机采样可能会在测试集中过度代表或代表不足它们，导致错误的性能估计。分层采样\
  \ (`http://en.wikipedia.org/wiki/Stratified_sampling`) 将数据划分为单独子集，分别进行采样然后重新组合。当标签是稀有事件时，你可能需要对欺诈示例和合法示例分别采样，然后将它们合并到测试集中，以匹配训练集，更重要的是匹配模型将要使用的新数据。\n\
  \n模型经过训练和测试后，良好的做法是将训练和测试数据重新合并为一个集合，并在更大的数据集上重新训练模型。样本外测试程序已经对预期预测误差给良好的估计。这就是留出部分数据的目的。在更多数据上进行训练的模型将表现得更好，泛化性也更好。部署的模型应该在所有数据上进行训练。\n\
  \n本节为你提供了量化预测模型性能的工具。下一节将向你展示如何用数值比较替换你在算法选择和性能的影响因素——复杂性和数据中看到的模型与问题复杂性的直观图形比较。这种替换使得选择过程的部分机械化成为可能。\n\
  \n\n\n本节使用普通最小二乘法（`OLS`）回归来说说明几点。首先，它说明了 `OLS` 有时会对问题产生**过拟合**（overfit`）。过拟合意味着训练数据上的误差与测试数据上的误差之间存在显著差异，正如你在上一节看到的，当时使用\
  \ `OLS` 来解决 `rocks-versus-mines` 分类问题。其次，它引入了两种克服 `OLS` 过拟合问题的方法。这些方法将培养你的直觉，并为第四章中更深入介绍的惩罚线性回归方法奠定基础。此外，克服过拟合的方法具有大多数现代机器学习算法共有的属性。现代算法会生成多个不同复杂度的模型，然后使用样本外性能来平衡模型复杂度、问题复杂度以及数据集的丰富性，从而决定部署哪个模型。这一过程将在书的其余部分中反复使用。\n\
  \n普通最小二乘回归是普通机器学习算法的良好原型。它是一种监督学习算法，具有训练过程和部署过程。在某些情况下它可能会过拟合。它与其它更现代的函数近似算法共享这些特征。然而，`OLS`\
  \ 缺少了现代算法的一个重要特征。在原始公式中（最熟悉的公式），没有手段在它过拟合时对其进行节流。这就像拥有一辆只能全油门运行的汽车（在道路充足时很棒，但在狭窄的情况下很难使用）。幸运的是，自从高斯和勒让德在\
  \ 200 多年前发明普通最小二乘回归以来，人们对该回归已经进行了大量工作。本节介绍了两种调整普通最小二乘回归节门的方法。一种被称为`前向逐步回归`（`forward\
  \ stepwise regression`），另一种被称为`岭回归`（`ridge regression`）。\n\n### 选择模型平衡问题复杂度、模型复杂度和数据集\n\
