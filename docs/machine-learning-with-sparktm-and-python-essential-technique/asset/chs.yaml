  ### 评估模型\n\n良好的性能意味着使用属性来产生与实际情况接近的 `pred()` 预测。函数 `pred()` 使用属性 ![images](img/c03-i0010.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow></math>\
  \ 来预测 ![images](img/c03-i0006.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></math>。本书描述了用于生成结果的一些非常前沿的方法。这些算法在许多平台上均可用。如果你需要在其他语言中实现它们，这种理解是通用的。\n\
  \n对于回归问题，由于目标 ![images](img/c03-i0011.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></math> 是实数，因此是有意义的通过误差来衡量性能。均方误差（MSE）对误差进行平方并平均，而平均绝对误差（MAE）则对误差的绝对值进行平均。\n\
  \n![公式 3.4: 回归衡量方法](img/c03-disp-0004.png)\n\n`公式 3.4`: 回归衡量方法\n\n对于分类问题，目标 ![images](img/c03-i0011.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></math>\
  \ 是二值的，因此可以通过预测错误的示例比例来衡量性能。\n\n![公式 3.5: 另一种衡量方法](img/c03-disp-0005.png)\n\n`公式\
  \ 3.5`: 另一种衡量方法\n\n\n\n影响性能的因素之一是所解决问题的复杂性。图 3.1 展示了一个二维空间上相对简单的分类问题。图中了两组点：深色点和浅色点。深色点是从以\
  \ (1,0) 为中心、两个维度方差均为单位差的二维高斯分布中随机抽取的。浅色点同样是从一个具有相同方差但中心在 (0,1)的高斯分布中抽取的。该问题的属性是图中的两个轴：![images](img/c03-i0017.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow></math>\
  \ 和 ![images](img/c03-i0020.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow></math>。分类任务是在 ![images](img/c03-i0015.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow></math>，![images](img/c03-i0022.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>2</mn></msub></mrow></math>\
  \ 平面上画一些边界，以将浅色点与深色点分开。在这种情况下，能做的最好的方法就是在图中画一条 45 度的线——即 ![images](img/c03-i0019.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>1</mn></msub></mrow></math>\
  \ 等于 ![images](img/c03-i0016.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
