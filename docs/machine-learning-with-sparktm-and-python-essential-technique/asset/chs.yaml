- "# Spark 和 Python 机器学习：预测分析核心技术\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 第 3 章\n\n\n# 第 4 章\n\
  \n\n# 第 5 章\n\n\n# 第 6 章\n\n\n\n\n\n\n# 第 6 章\n\n\n# 第 7 章\n\n\n\n\n\n\n\n\n\n\n\
  # 引言\n\n从数据中提取可操作的信息正在改变现代业务的结构，并直接影响着程序员。其中一种方式是对新编程技能的需求。市场分析师预测，到 2018 年，具备高级统计和机器学习技能的人才需求将超过供应\
  \ 140,000 到 190,000 人。这意味着对于具备必要技能的人来说，将拥有优厚的薪水和大量有趣的项目可供选择。另一个影响程序员的进展是统计和机器学习核心工具开发的不断进步。这使得程序员在每次想要尝试新算法时，不再需要为自己编写复杂的算法。在通用编程语言中，Python\
  \ 开发者一直处于前沿，他们构建了最先进的机器学习工具，但在“拥有工具”与“能够高效使用工具”之间存在着差距。\n\n程序员可以通过多种方式获取机器学习的通用知识：在线课程、许多编写得良好的书籍等。其中许多书籍对机器学习算法及其应用进行了极好的综述，但由于可用算法如此多，在综述中涵盖这些算法的使用细节是困难的。\n\
  \n这为实践者留下了空白。可用算法的数量意味着需要做出选择，而初学机器学习的程序员在尝试几次之前可能并不具备做出这些选择的能力；这留给程序员自己在整个问题建模和解决方案的背景下，去填充这些算法的使用细节。\n\
  \n\n\n\n本书试图弥补这一差距。我们所采用的方法是将涵盖的算法限制在两类算法上，这两类算法已被证明在各种问题中都能提供最优性能。这一断言依据是它们在机器学习竞赛中的主导地位、在新开发的机器学习工具包中的早期包含，以及它们在比较研究中的表现（如第\
  \ 1 章）“用于预测的两种核心算法”中所述）。将注意力集中在两类算法上，可以对其工作原理提供良好的覆盖，并通过若干个示例详细演示这些算法如何应用于具有不同结构的问题。\n\
  \n本书很大程度上依赖代码示例来阐释所讨论算法的运行原理。我在加州大学伯伯克利分校、Galvanize、新黑黑文大学和 Hacker Dojo 授的课程中发现，程序员通常通过观察简单的代码插图比通过看数学更容易理解原理。\n\
  \n本书侧关注 `Python`，因为它在功能性和包含机器学习算法的专用程序包之间取得了很好的平衡。`Python` 是一门经常使用的语言，以生成简洁、可读性强的代码而闻名。这一事实导致许多领先公司采用\
  \ `Python` 进行原型设计和部署。`Python` 开发者得到了庞大的开发者社区、开发工具、扩展等的支持。`Python` 也被广泛应用于工业应用和科学编程中。它拥有许多支持如机器学习等计算密集型应用的程序包，并且是领先机器学习算法的优秀集合（因此你不需要自己编写这些代码）。`Python`\
  \ 是一门比 `R` 或 `SAS`（统计分析系统）等专用统计语言更好的通用编程语言。它的机器学习算法集合包含了许多顶尖算法，并持续不断中。\n\n## 本书的读者群\n\
  \n本书适用于那些希望将机器学习加入自己的技能储备的 `Python` 程序员，无论是为了特定的项目，还是为了保持其工具箱的与时性。也许工作中出现了一个需要机器学习来解决的新问题。鉴于如今机器学习在新闻中被频繁提及，这在简历上な称是一项非常实用的技能。\n\
  \n本书为 `Python` 程序员提供了以下内容：\n\n*   对机器学习所解决的基本问题的描述\n*   若干种先进算法\n*   这些算法的工作原理\n\
  *   指定、设计和验证机器学习系统的流程步骤\n*   流程和算法的示例\n*   可运行的代码\n\n为了轻松地读完本书，你的首要背景要求包括理解编程或计算机科学，并具备读写代码。代码示例、库和程序包都是\
  \ `Python`，因此本书对 `Python` 程序员来说是最用的。在某些情况下，本书会运行算法的核心代码来演示工作原理，但会使用包含该算法的 `Python`\
  \ 程序包将算法应用于问题。看到代码通常能让程序员直观地理解算法，就像看数学对其他人来说是的一样。一旦建立起理解，示例将使用开发好的 `Python` 程序包，这些包包含了对高效使用至关重要的“花哨”功能（错误检查、输入输出处理、为模型开发的数据结构、包含已训练模型的定义预测器方法等）。\n\
  \n除了具有编程背景外，一些数学和统计知识将有助于你轻松完成学习材料。数学要求包括一些本科水平的微积分（知道如何求导和一点线性代数）、矩阵记法、矩阵乘法和矩阵逆。这些内容的主要用途是遵循所涵盖的某些算法的推导过程。很多时候，这仅仅是对一个简单函数求导或进行一些基本的矩阵操作。在概念层面跟上计算可能有助于你对算法的理解。理解推导中的步骤可以帮助你理解算法的优缺点，并帮助你决定哪种算法可能是特定问题的最佳选择。\n\
  \n本书还使用了一些基础概率和统计知识。这些要求包括熟悉本科水平的概率以及一些概念，如实数列表的平均值、方差和相关性。如果你对某些概念有些生疏，可以随时查阅代码。\n\
  \n本书涵盖了两类广泛的机器学习算法：惩罚线性回归（例如 `Ridge` 和 `Lasso`）和集成方法（例如 `Random Forest` 和 `Gradient\
  \ Boosting`）。每一类算法都包含可以解决回归和分类问题的变体。（你将在书中早期学到分类和回归的区别。）\n\n对于已经熟悉机器学习且只对学习其中一种算法感兴趣的读者，可以直接跳到涵盖该类算法的两个章节。每种方法占两个章节——一个涵盖工作原理，另一个介绍其在不同类型问题上的用法。惩罚线性回归涵盖在第\
  \ 4 章“惩罚线性回归”和第 5 章“使用惩罚线性方法构建预测模型”中。集成方法涵盖在第 6 章“集成方法”和第 7 章“使用 Python 构建集成模型”中。为了熟悉算法用法章节中涉及的问题，你可能会发现快速浏览一下第\
  \ 2 章“通过理解数据来理解问题”（数据探索）会有帮助。刚开始机器学习并希望从头到尾学习的读者可能想把第 2 章留到开始查看后续章节中的解决方案时。\n\n\
  ## 本书涵盖的内容\n\n如前所述，本书涵盖了两类进展较新且仍在进行活跃研究的算法族。它们都依赖于早期的技术，并在某种程度上掩盖了这些技术。\n\n惩罚线性回归代表了在改进普通二乘法回归的持续研究中的较新进展。惩罚线性回归具有几个特征，使其成为预测分析的首选。惩罚线性回归引入了一个可调参数，使得生成的模型在过拟合和欠拟合之间平衡成为可能。它还提供了有关各种输入变量对预测结果相对重要性的信息。这两个特征对于开发预测模型的过程都至关重要。此外，惩罚线性回归在某些类问题中产生最好的预测性能，特别是在欠定问题和具有许多输入参数的问题（如遗传学和文本挖掘）中。此外，坐标下降法近期取得了大量进展，使得训练惩罚线性回归模型变得极快。\n\
  \n为了帮助你理解惩罚线性回归，本书回顾了普通线性回归及其其他扩展（如逐步回归）。希望这些内容有助于培养直觉。\n\n\n\n集成方法（Ensemble methods）是最强大的预测分析工具之一。它们能够模拟极其复杂的行为，特别是对于过度决定的问题，这在许多基于\
  \ Web 的预测问题中非常常见（例如返回搜索结果或预测广告点击率）。许多经验丰富的数据科学家由于其性能，将集成方法作为他们的首选尝试。它们的使用相对简单，而且还可以根据预测性能对变量进行排序。\n\
  \n集成方法的发展路径与惩罚线性回归并行。惩罚线性回归是为了克服普通回归的局限性而演进的，而集成方法则是是为了克服二叉决策树的局限性而演变的。相应地，本书对集成方法的介绍涵盖了一些二叉决策树的背景，因为集成方法继承了二叉决策树的一些属性。理解这些内容有助于培养对集成方法的直觉。\n\
  \n## 第一版以来发生了什么\n\n在第一版出版后的三年里，`Python` 更坚定地确立了其作为数据科学主要语言的地位。大数据平台 `Spark` 以及用于深度学习的\
  \ `TensorFlow` 和 `Torch` 的平台开发者已采用了 `Python` 接口，以接触最广泛的数据科学家。第一版中强调的两类算法仍然是热门选择，并且现在已作为\
  \ `PySpark` 的一部分可用。\n\n这种结合的美妙之处在于，在真正巨大的数据集上构建机器学习模型所需的代码，并不比在较小数据集上所需的代码更复杂。\n\
  \n`PySpark` 展示了多项重要进展，使得通过相对简单、易读且易写的 `Python` 代码来调用强大的机器学习工具变得更加简洁和容易。在编写本书第一版时，在大型数据集上构建机器学习模型需要启动数百个处理器，这需要对数据中心流程和编程有大量的知识。这不仅很繁琐，而且坦率地说并不非常有效。`Spark`\
  \ 架构的开发正是为了解决这一困难。\n\n`Spark` 使为机器学习轻松地租赁和雇用大量处理器成为可能。`PySpark` 添加了一个 `Python` 接口。结果是，在\
  \ `PySpark` 中运行机器学习算法的代码与运行纯 `Python` 版本的程序并没有复杂多少。第一版关注的算法仍然被广泛使用，并存在于 `Spark`\
  \ 中。因此，在 `Python` 示例旁边添加 `PySpark` 示例似乎是自然而然，以便读者熟悉 `PySpark`。\n\n在这一版中，所有的代码示例均使用\
  \ `Python 3`，因为 `Python 2` 将被停止支持。除了提供文本形式的代码外，每个章节还提供了 `Jupyter` 笔记本格式的代码。执行笔记本代码时将绘制出你在图中看到的图表和表格。\n\
  \n## 本书的结构\n\n本书遵循你处理新预测问题的基本顺序。开头涉及对数据的理解并确定如何表述问题，然后尝试算法并衡量性能。在这个序列中间，书会根据出现的情况概述各个步骤的方法和理由。第\
  \ 1 章对本书涵盖的问题类型和所用方法进行了更详细的描述。本书使用了 UC Irvine 数据库的几个数据集作为示例，第 2 章展示了你可以用于开发对新数据集洞察的一些方法和工具。第\
  \ 3 章“预测模型构建：平衡性能、复杂性和大数据”讨论了预测分析的困难以及解决这些困难的技术。它概述了问题复杂度、模型复杂度、数据集大小和预测性能之间的关系。它讨论了过拟合以及如何可靠地感知过拟合。它讨论了针对不同类型问题的性能指标。第\
  \ 4 章和第 5 章分别涵盖了惩罚线性回归的背景及其在第 2 章中探索的问题的应用。第 6 章和第 7 章涵盖了集成方法的背景和应用。\n\n## 使用本书所需的\n\
  \n要运行书中的代码示例，你需要 `Python 3.x`、`SciPy`、`numpy`、`pandas`、`scikit-learn` 以及 `PySpark`。由于交叉依赖和版本问题，这些包可能很难安装。为了方便安装，我使用了来自\
  \ Continuum Analytics (`http://continuum.io/`) 提供的这些包的免费发行版。它的 `Anaconda` 产品是免费下载的，包含了\
  \ `Python 3.x` 以及运行运行书中代码所需的所有包（以及更多）。我在 `Ubuntu 14.04 Linux` 上运行了这些示例，但还没有在其他系统上尝试过。\n\
  \n`PySpark` 需要一个 Linux 环境。如果你不是在 Linux 上运行，那么运行示例最简单的方法可能是使用虚拟机。`Virtual Box` 是一个免费的开源虚拟机——按照说明下载\
  \ `Virtual Box`，然后安装 `Ubuntu 18.0` 并使用 `Anaconda` 安装 `Python` 等。你只需要一个 `VM` 就可以运行\
  \ `PySpark` 示例。非 `Spark` 代码可以在任何你可以打开 `Jupyter notebook` 的地方运行。\n\n## 读者对本书的支持\n\
  \n仓库中提供的源代码可以帮助你加速学习。章节中包含了安装说明，以便你可以边读边编写代码。\n\n### 源代码\n\n当你学习书中的示例时，你可以选择手动输入所有代码，也可以使用随书附的源代码文件。书中使用的所有源代码都可以从\
  \ `http://www.wiley.com/go/pythonlearning2e` 下载。你会发现源代码中的代码段都附有下载图标和程序名称说明，让你知道它是可下载的并在下载文件中轻松找到它。\n\
  \n除了提供文本形式的代码，它还包含在 `Python` 笔记本中。如果你知道如何运行 `Jupyter notebook`，就可以逐单元运行代码。输出将出现在笔记本中，打印输出将出现在代码块下方。\n\
  \n下载代码后，只需使用你喜欢的压缩工具对其进行解压。\n\n### 如何联系出版商\n\n\n# 第 1 章\n\n用于预测的两个核心算法\n\n本书侧重于机器学习过程，因此涵盖了少数最有效且应用广泛的算法。它并不提供机器学习技术的综述。综述中可能包含许多算法在实践者中并未被活跃使用。\n\
  \n\n\n\n本书处理一类机器学习问题，通常被称为`function approximation`（函数近似）。函数近似是一类被称为 `supervised\
  \ learning`（监督学习）问题的子集。线性回归及其分类同类逻辑回归，为函数近似问题提供了熟悉的算法示例。函数近似问题涵盖了各种领域中广泛的分类和回归问题，包括文本分类。广义而言，这本书涵盖了两个类问题：线性回归和集成方法。本章节介绍了用于函数近似问题的算法。\n\
  \n（此处省略原文中重复的段落及翻译，由于提供的文本存在大量内容完全相同的句子句子和逻辑重复，我将根据要求对核心内容进行翻译）\n\n译文：\n\n[content]\n\
  本书处理一类机器学习问题，通常被称为`function approximation`（函数近似）。函数近似是一类被称为 `supervised learning`（监督学习）问题的子集。线性回归及其分类同类逻辑回归，为函数近似问题提供了熟悉的算法示例。函数近似问题涵盖了各种领域中广泛的分类和回归问题，包括文本分类。广义而言，这本书涵盖了两个类问题：线性回归和集成方法。本章节介绍了用于函数近似问题的算法。\n\
  \n（注：由于原文中存在大量段落的完全重复，根据“注意一定不要重复输出原文”的原则，此处为针对原文核心逻辑部分的翻译）\n\n## 为什么这些算法如此有用\n\n\
  许多因素使得线性回归和集成方法非常有用。简单来说，这些方法在处理各种数据集和小数据集时提供了最优或接近最优的性能。这一论断的证据可以在以下两篇论文中找到：\n\n\
  -   [An Empirical Comparison of Supervised Learning](https://example.org) 由 Richuana\
  \ 和 Alexandru Niculescu-Mizil\n-   [An Empirical Evaluation of Supervised Learning\
  \ in High Dimensions](https://example.org) 由 Richuana, Nikos Karampats 和 Ainur Yessen\n\
  \n在这两篇论文中，作者选择了多种分类问题，并采用了不同的算法来构建预测模型。模型在未包含在训练中的测试数据上运行，然后根据它们对问题的性能对算法进行排名。第一项研究对比了\
  \ 9 种基础算法在 11 种机器学习（二分类）问题上的表现。研究中的问题来自各种领域，包括人口统计数据、文本处理、模式识别、物理学和生物学。[表 1.1](https://example.org)\
  \ 列出了研究中使用的数据集，并使用了作者给出的相同名称。表格显示了每个数据集用于预测结果的属性数量，并显示了正例的百分比。\n\n\n| 数据集名称 | 属性数量\
  \ | 正例百分比 |\n| :--- | :--- | :--- |\n| Adult | 14 | 25 |\n| Bact | 11 | 69 |\n|\
  \ Cod | 15 | 50 |\n| Covt | 54 | 36 |\n| HS | 20 | 24 |\n| Letter.p1 | 16 | 3 |\n\
  | Letter.p2 | 15 | 53 |\n| Medis | 63 | 11 |\n| Mg | 12 | 50 |\n| Slac | 59 | 17\
  \ |\n\n`positive` 项指的是我们试图预测的结果。在许多情况下，这是一个二分类（例如：是/否，垃圾邮件/非垃圾邮件）。\n\n特征是用于预测的输入变量。选择正确的特征是建模过程中的关键部分。这可能涉及领域知识、统计方法或自动特征选择。\n\
  \n构建预测模型的过程涉及多个步骤：数据收集、预处理、特征工程、模型选择、训练和评估。每个步骤对于确保最终模型的质量都关重要。\n\n\n\n\n| --- |\
  \ --- | --- | --- | --- | --- |\n| Adult || 1, 4 || 2 || 3, 5 ||  ||  |\n| LTR.P1\
  \ || 1 ||  ||  ||  || SVM, KNN |\n| LTR.P2 || 1, 2 || 4, 5 ||  |||| SVM |\n| MEDIS\
  \ ||  || 1, 3 ||  || 5 || ANN |\n| SLAC ||  || 1, 2, 3 || 4, 5 ||  ||  |\n| HS ||\
  \ 1, 3 ||  ||  ||  || ANN |\n| MG ||  || 2, 4, 5 || 1, 3 ||  ||  |\n| CALHOUS ||\
  \ 1, 2 || 5 || 3, 4 ||  ||  |\n| COD || 1, 2 ||  || 3, 4, 5 ||  ||  |\n| BACT ||\
  \ 2, 5 ||  || 1, 3, 4 ||  ||  |\n\n逻辑回归仅在表 1.2 中的一种情况下进入前五名。原因在于这些数据集相对于样本（每个数据集\
  \ 5,000 个）来说，属性很少（最多 200 个）。有足够的数据来解决具有如此少量属性的模型，而且训练集足够小，因此训练时间不会过长。\n\n正如你在第 3\
  \ 章以及第 5 章中涵盖的“使用惩罚化线性方法构建预测模型”和第 7 章“使用 Python 构建集成模型”中的示例看到的那样，当存在大量属性且没有足够的样本或时间训练更复杂的集成模型时，惩罚化回归方法的表现优于其他算法。\n\
  \nCaruana 等人进行了一项较新的研究（2008 年），以解决这些算法在属性数量增加时的比较问题。也就是说，这些算法在大数据任务上的表现如何？许多字段的属性比第一项研究中的数据集多得多。例如，基因组学问题有数万个属性（每个基因一个属性），而文本挖掘问题可能有数百万个属性（每个不同词或每对不同词一个属性）。表\
  \ 1.3 显示了线性回归和集成方法如何随着属性数量的增长而变化。表 1.3 中的结果显示了第二项研究中所用算法的排名。表格显示了每个问题单独的性能，最右侧的一列显示了每个算法在所有问题平均得分排名。研究中使用的算法分为两组。顶组算法是本书将涵盖的内容。底组则不会被涵盖。\n\
  \n表 1.3 中显示的问题按属性数量排序，范围从 761 到 685,569 不等。线性（逻辑）回归在该研究使用的 11 个测试用例中有 5 个进入前三名。这些优异评分集中在较大的数据集上。注意，提升决策树（在表\
  \ 1.3 中记为 `BSTDT`）和随机森林（在表 1.3 中记为 `RF`）算法的表现仍然接近顶端。它们在这些问题上的总分上排名第一和第二。\n\n本书涵盖的算法除了原始预测性能外还有其他优势。本书涵盖的惩罚化线性回归模型的一个重要优点是它们的训练速度。在大问题上，训练速度可能会成为问题。在某些问题中，模型训练可能需要几天或几周。这个时间跨度可能是无法接受的延迟，特别是在开发早期，需要通过迭代来确定最佳方法。除了训练非常快之外，部署后训练好的线性模型可以快速生成预测——快到足以高频交易或互联网广告插入。研究表明，惩罚化线性回归在许多情况下可以提供最佳答案，即使在它们不是最佳的情况下，表现也接近前列。\n\
