  \n本节引入了几个新元素。其是使用字符串索引器转换多分类问题的标签。另一个是使用 PySpark 逻辑回归处理多分类问题。这些是你之前看到内容的后续延伸。另一个新元素是使用参数网格搜索来确定元参数（如弹性网络参数和正则参数）的最佳值。\n\
  \n基础代码实现（Listing 5-11）与[Listing 5-9](#c05.xhtml#c05-fea-0010）中的二分类问题看起来相同。它适用于标签表示在单个列中，该列指示字符串索引器分配的数字。\n\
  \n参数搜索通过使用`CrossValidator`和`ParameterGridBuilder`来实现。代码展示了如何为正则参数和弹性网络参数提供搜索值。最后，读取最佳值（通过交叉验证结果确定）。搜索确实带来了改进。\n\
  \n\n\n\n\n```python\n__author__ = 'mike_bowles'\n\n# 导入 sparksession \nfrom pyspark.sql\
  \ import SparkSession\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.classification\
  \ import LogisticRegression\nimport matplotlib.pyplot as plt\nfrom pyspark.ml import\
  \ Pipeline\nfrom pyspark.ml.feature import OneHotEncoder, StringIndexer, VectorAssembler\n\
  import pandas as pd\nfrom pandas import DataFrame \nfrom Read_Fcns import pd_read_glass\n\
  from pyspark.ml.tuning import ParamGridBuilder, CrossValidator\nfrom pyspark.ml.evaluation\
  \ import MulticlassClassificationEvaluator\n\nspark = SparkSession.builder.appName(\"\
  glass_mc_log_regress\").getOrCreate()\n\n# 将玻璃数据读取到 pandas dataframe 并创建 spark df\n\
  glass_df = pd_read_glass()\n\n# 为玻璃数据创建 spark dataframe\nglass_sp_df = spark.createDataFrame(glass_df)\n\
  \ncols = glass_sp_df.columns\nprint('Column Names', cols, '\\n\\n')\n\nglass_sp_df.printSchema()\n\
  \npd.DataFrame(glass_sp_df.take(5), columns=glass_sp_df.columns).transpose()\n\n\
  feature_cols = ['RI', 'Na', 'Mg', 'Al', 'Si', 'K', 'Ca', 'Ba', 'Fe']\n\nlabel_stringIdx\
  \ = StringIndexer(inputCol = \"Type\", outputCol = \"label\")\nassembler = VectorAssembler(inputCols=feature_cols,\
  \ outputCol='features')\npipeline = Pipeline(stages=[assembler, label_stringIdx])\n\
  \npipelineFit = pipeline.fit(glass_sp_df)\ndataset = pipelineFit.transform(glass_sp_df)\n\
  \n# 查看数据集\ndataset.show(5)\n\n# 训练测试集划分\ntrainingData, testData = dataset.randomSplit([0.7,\
  \ 0.3], seed = 1011)\n\n# 选择模型 p\nlr = LogisticRegression(maxIter=20, regParam=0.003,\
  \ elasticNetParam=0.5)\nlrModel = lr.fit(trainingData)\n\npredictions = lrModel.transform(testData)\n\
  \nevaluator = MulticlassClassificationEvaluator(predictionCol=\"prediction\")\n\
  print(evaluator.evaluate(predictions))\n\n# 寻找最佳参数值\nparamGrid = (ParamGridBuilder()\
  \ \n             .addGrid(lr.regParam, [0.003, 0.03, 0.3]) \n             .addGrid(lr.elasticNetParam,\
  \ [0.0, 0.2, 0.4, 0.6])\n             .build())\n\n# 5 折交叉验证\ncv = CrossValidator(estimator=lr,\
  \ \\\n                     estimatorParamMaps=paramGrid, \\\n                  \
  \   evaluator=evaluator, \\\n                     numFolds=5)\n\ncvModel = cv.fit(trainingData)\n\
  \npredictions = cvModel.transform(testData)\n# 评估最佳模型\nevaluator = MulticlassClassificationEvaluator(predictionCol=\"\
  prediction\")\nprint(evaluator.evaluate(predictions))\n\nprint( 'Best Param (regParam):\
  \ ', cvModel.bestModel._java_obj.getRegParam())\nprint('Best Param (elasticNetParam):\
  \ ', cvModel.bestModel._java_obj.getElasticNetParam()) \n```\n\n本节演示了如何使用 PySpark\
  \ 解决多分类问题，并演示了如何使用 `ParameterGridBuilder` 和交叉验证来确定元参数的最佳值。\n\n## 总结\n\n本章演示了惩罚回归的使用以及许多用于预测建模的通用工具。本章展示了你经常会遇到的几种不同类型的问题，包括回归、二分类和多分类。本章使用了实现各种不同类型惩罚回归的\
  \ Python 包来完成这些任务。此外，本章还阐述了在解决你遇到的建模问题时可能需要的几种工具。这些工具包括将因子变量编码为数值的技术、使用二分类器解决多分类问题的方法，以及扩展线性方法以预测属性与结果之间线性关系的方法。\n\
  \n本章还演示了量化预测模型性能的多种方法。回归问题容易量化，因为它们的误差可以自然地用实数表示。分类问题可能会更复杂。你看到了分类性能被量化为误分类错误率、接收者工作曲线下的面积以及经济成本。你应该选择最接近你实际目标（业务目标、科学目标等）的性能衡量方法。\n\
  \n随后，章节介绍了不同的问题设置（多分类、分类变量、回归、分类），并展示了如何使用 PySpark 构建解决方案。此外，本章涵盖了用于构建模型和评估其性能的工具集。你将在第\
  \ 6 章中再次看到许多相同的工具，在我们将我们将它们用于集成模型。\n\n## 参考文献\n\n1. 1. P. Cortez , A. Cerdeira,\
