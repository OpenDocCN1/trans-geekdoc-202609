  \n## 使用惩罚方法构建预测模型\n\n第 2 章描述了构建预测模型的方法。这种惩罚会导致系数在不同程度上受到抑制，从而增加了复杂性调整。你已经了解了如何通过使用样本外数据上的误差来调整结果模型的复杂性，以实现最佳性能。\n\
  \n本章描述了两种求解惩罚回归最小化问题的现代算法的操作原理，并提供了实现算法主要功能的 Python 代码，以便你对算法核心有具体的实例化，从而使操作原理更加清晰。普通回归问题（数值特征和数值目标）作为深入这些算法的范例。本章展示了多个扩展，以扩大用例范围，包括二分类问题、多分类问题、属性与结果之间存在非线性关系的问题以及非数值特征的问题。\n\
  \n第 5 章将使用实现这些算法的 Python 包来运行这些算法。基于本章所学的原理，这些算法的核心对你是有意义的。\n\n## 惩罚回归的 Python 包\n\
  \n`Lasso`、`LARS` 和 `ElasticNet`。本章描述了输入数据集的性质：它是一个待预测结果的列向量，以及一个作为预测基础的属性表。第 3 章证明了预测模型需要对其复杂性进行调优，以针对给定的问题复杂度和数据集大小获得最佳性能。第\
  \ 3 章还展示了在线性回归中引入调优参数的方法。本章在此背景的基础上，引入了几个最小化问题，这些问题在最小二法回归的误差惩罚基础上添加了可调的系数惩罚。正如所示，这种对线性系数大小的可调惩罚会导致系数在不同程度上受到抑制，从而增加了复杂性调整。你已经了解了如何通过使用样本外数据上的误差来调整结果模型的复杂性，以实现最佳性能。\n\
  \n你可以在 `sklearn.linear_model` 中找到本章使用的包。链接 `http://scikit-learn.org/stable/modules/classes.html#module-sklearn.linear_model`\
  \ 显示了此处用到的模型列表。注意，几个模型有两种形式。例如，有一个名为 `linear_model.ElasticNet` 的包，另一个名为 `linear_model.ElasticNetCV`\
  \ 的包。这两个模型对应于本章开头讨论的任务。`linear_model.ElasticNet` 用于在整个数据集上计算系数曲线，而 `linear_model.ElasticNetCV`\
  \ 执行交叉验证产生样本外性能估计。这两个形式使用相同的基础输入对象（两个 NumPy 数组——一个属性，一个标签）。在某些情况下，你将无法使用交叉版本，因为你需要对每个折的训练集和测试集内容进行非常具体的控制：\n\
  \n* 如果你的问题有一个取值非常少的类别属性，你可能需要控制采样，以确保该属性在所有折中分布均匀。\n* 你可能还需要访问单独的折数据以编译你的问题的误差统计，如果你想要一种与\
  \ CV 包提供的均方误差（MSE）不同的误差衡量方法。你可能更倾向于平均绝对误差（MAE），因为它更符合你在现实问题中所将付的误差惩罚。\n* 另一个需要按折访问以获取误差统计的例子是当你使用线性回归解决分类问题时。正如第\
  \ 3 章，“预测模型构建：平衡性能、复杂性和大数据”中讨论的那样，分类问题的标准误差衡量是诸如误分类率或 ROC 曲线下面积（AUC）。你将在本章的“岩石与矿石”以及“玻璃分类”案例研究中具体看到这种情况。\n\
  \n\n\n当你查看这些软件包并开始考虑使用它们时，应该记住几点。其一是某些软件包（但不是全部）在拟合模型之前会自动对属性进行归一化。需要注意的第二点是 `scikit-learn`\
  \ 软件包的变量命名与第 4 章 以及 Friedman 的论文不同。第 4 章使用变量 `λ` 表示系数惩罚的乘因子，并使用变量 `α` 表示 ElasticNet\
  \ 惩罚中 Lasso 惩罚与岭惩罚的比例。`scikit-learn` 软件包使用 `α` 代替 `λ`，用 `l1_ratio` 代替 `α`。下文将切换到\
  \ `scikit-learn` 软件包中使用的符号。\n\n## 多变量回归：预测葡萄酒口味\n\n正如在第 2 章中讨论的“通过理解数据来理解问题”，葡萄酒口味数据集来自加州大学欧文分库（`http://archive.ics.uci.edu/ml/datasets/Wine+Quality`）。该数据集包含\
  \ 1599 瓶葡萄酒的化学分析数据，以及由专业品酒小组对每种葡萄酒给出的平均口味评分。预测问题是根据化学成分数据来预测口味。化学成分数据由 11 种不同化学属性的数值测量组成——酒精含量、pH\
  \ 和柠檬酸等。可以查看第 2 章中对这些数据的探索，或者查看加州大学欧文分库的该数据集页面以获取更多信息。\n\n预测葡萄酒口味是一个回归问题，因为该问题的目标是预测质量评分，这是一个位于\
  \ 0 到 10 之间的整数。数据集仅包含 3 到 8 之间的示例。由于只给出了整数评分，也可以将此问题视为多分类分类问题。多分类问题将有六种可能的分类（从 3\
  \ 到 8 的整数）。它将忽略各种评分之间存在的顺序关系。（例如，5 分比 6 分差，比 4 分好。）回归是提出该问题的一种更自然的方法，因为它保留了顺序关系。\n\
  \n另一种思考如何提出问题的方法是考虑回归问题与多分类问题随伴的不同误差衡量标准。回归误差函数是平均平方误差。当真实口味为 3 时，预测为 5 的对累积误差的贡献比预测为\
  \ 4 大。多分类问题的误差衡量标准是误分类的示例数量。使用这种误差衡量标准，如果真实口味为 3，预测为 5 或 4 对累积误差的贡献是相同的。回归看起来更自然，但我不知道有什么方法可以证明它将提供更优的性能。知道这是否为最佳方法的唯一方法是尝试两者。在标题为“多分类：犯罪现场玻璃样本分类”的章节中你将看到如何处理多分类问题。然后你可以回来尝试多分类方法，看看它的效果是更好还是更差。你将使用哪种误差衡量标准？\n\
  \n### 构建并测试预测葡萄酒口味的模型\n\n构建模型过程的第一步是生成一些样本外性能数据，以查看它们是否能满足你的性能要求。列表 5-1 显示了执行 10\
  \ 折交叉验证并绘制结果的代码。`sklearn.linear_model` 软件包中的 `LassoCV` 完成了所有工作：将数据划分为交叉验证折、在每个折的样本内数据上运行\
  \ Lasso 建模过程，并针对一系列权重惩罚参数（`alpha`）值测试样本外数据上的性能。检查 sklearn 文档以查看所需参数的默认值。你至少可能需要提供折数并设置\
  \ `normalize=True`。默认值是保持数据不进行归一化。图 5.1 和 5.2 中的两张图显示了开启和不开启归一化运行代码的结果。你可以通过运行本书提供的\
  \ Python Notebook 中的代码自行生成这两幅图。要查看两个版本的曲线，只需在 `'normalize=True'` 和 `'normalize=False'`\
  \ 之间来回切换 `normalize` 参数。\n\n```python\n__author__ = 'mike'\n\nimport numpy\nfrom\
  \ sklearn import datasets, linear_model\nfrom sklearn.linear import LassoCV\nfrom\
  \ math import sqrt\nimport matplotlib.pyplot as plt\n\n#read data\nnames, xList,\
  \ labels = datasets.load_wine()\n\n#Use LassoCV class from sklearn.linear\n#sklearn\
  \ lasso class includes a normalization option, so\n#normalization isn't required\n\
  #to get the unnormalized version of the curves change\n#normalize=True to normalize=False\n\
  wineModel = LassoCV(cv=10, normalize=True).fit(xList, labels)\n\n### Display results\n\
  plt.figure()\nplt.plot(wineModel.alphas_, wineModel.mse_path_, ':')\nplt.plot(wineModel.alphas_,\
  \ wineModel.mse_path_.mean(axis=-1),\n         label='Average MSE Across Folds',\
  \ linewidth=2)\nplt.axvline(wineModel.alpha_, linestyle='--',\n         label='CV\
  \ Estimate of Best alpha')\nplt.semilogx()\nplt.legend()\nax = plt.gca()\nax.invert_xaxis()\n\
  plt.xlabel('alpha')\nplt.ylabel('Mean Square Error')\nplt.axis('tight')\n#plt.savefig('LassoCV.png',\
  \ dpi=500)\nplt.show()\n\n#print out the value of alpha that minimizes the Cv-error\n\
  print(\"alpha Value that Minimizes CV Error\", wineModel.alpha_)\nprint(\"Minimum\
  \ MSE  \", min(wineModel.mse_path_.mean(axis=-1)))\n\n### Printed Output:\nNormalized\
  \ Version:\nalpha Value that Minimizes CV Error 0.00029358033516\nMinimum MSE  \
  \ 0.4339376197674394\n\nUnnormalized Version:\nalpha Value that Minimizes CV Error\
  \  0.0052692947038\nMinimum MSE   0.4393606730929137\n```\n\n列表 5-1 中的性能数据显示，如果数据不进行归一化，性能会略微下降。然而，图\
  \ 5.2 中 CV 误差与 alpha 的关系图与图 5.1 中的图相比有巨大差异。该图呈现出波浪状特征，这是由于未对 X 进行缩放导致尺度比例混合。发生的情况是：算法选择了一个需要相应小系数的大变量。如果该变量与\
  \ Y 高度相关，或者该变量与 Y 相关性低且尺度很大，就会发生这种情况。算法会使用一个较差的变量进行几次，直到 α（以前称为 λ）小到足以允许一个更好的变量进入，此时误差会急剧下降。这个故事的启示是：对\
  \ X 进行归一化，或者警惕不进行归一化的后果。这样你可以获得更好的模型。\n\n### 在部署之前在整个数据集上训练\n\n\n\n\n\nListing 5-2\
  \ 显示了在整个数据集上训练的代码。如前所述，在整个数据集上进行训练的原因是为了获得用于部署的最优系数集。交叉验证提供了对部署模型性能的估算，并为你提供了产生最佳性能的\
  \ `α` 值。Listing 5-2 中的程序做了两件事：它在归一化数据上训练了一个模型，以便可视化系数曲线并评估变量的重要性。变量重要性使用应用在归一化数据上的系数来确定哪些变量是最重要的。但你可能希望获得可以直接应用于原始状态数据的系数。这正是你在代码列表末尾调用的\
  \ `Lasso` 包在内部完成归一化后所得到的结果。`Lasso` 包与大多数其他惩罚回归包一样，接受具有自然缩放比例的数据。如果你选择该包的归一化数据选项，该包会在内部对数据进行归一化并计算系数。然后，它会将系数转换回你适用于未归一化数据的格式。你将在代码列表末尾看到这些系数。相对于归一化数据的系数曲线显示在图\
  \ 5.3 中。\n\n#### Listing 5-2: 在完整数据集上的 L 训练——wineLassoCoefCurves.py\n\n```python\n\
  __author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport numpy\
  \ as np\nfrom sklearn import datasets, linear_model\nfrom sklearn.linear_model import\
  \ LassoCV, lasso_path, Lasso\nfrom sklearn.preprocessing import StandardScaler\n\
  from math import sqrt\nimport matplotlib.pyplot as plt\n\n#read data \nnames, xList,\
  \ labels = list_read_wine()\n\n#First let's see the coefficient curves for the full\
  \ data set and get a\n#feel for variable importance\n#For variable importance you'll\
  \ need to normalize the variables before\n#fitting otherwise the models will \n\
  #return coefficients relative to full scale variables which is what you\n#need for\
  \ applying the model\n#but to determine importance you need coefficients on normalized\n\
  #features. \n#lasso_path doesn't have a built-in normalize option\nalphas, coefs,\
  \ _  = lasso_path(StandardScaler().fit_transform(xList), \n        labels,  return_models=False)\n\
  \nplt.xlabel('alpha')\nplt.ylabel('Coefficients')\nplt.semilogx(alphas,coefs.T)\n\
  plt.axis('tight')\nax = plt.gca()\nax.invert_xaxis()\nplt.savefig('wineLassoCoefCurves.png',\
  \ dpi=500)\nplt.show()\nnattr, nalpha = coefs.shape\n\n#find coefficient ordering\n\
  nzList = []\nfor iAlpha in range(1,nalpha):\n    coefList = list(coefs[:iAlpha])\n\
  \    nzCoef = [index for index in range(nattr) if coefList[index] \n!= 0.0]\n  \
  \  for q in nzCoef:\n        if not (q in nzList):\n            nzList.append(q)\n\
  \nprint(\"Features Ordered by Early They Enter the model:\")\n[print(names[nzList[i]])\
  \ for i in range(len(nzList))]\n\n#find coefficients corresponding to best alpha\
  \ = 0.0029355803\nalphaStar = 0.002935580335160765\nindexLTalpha = [index for index\
  \ in range(100) if alphas[index] >\nalphaStar]\nindexStar = max(indexLTalpha)\n\
  #here's the set of coefficients to deploy\ncoefStar = list(coefs[:,indexStar])\n\
  \n### The coefficients on normalized attributes give another different ordering\n\
  absCoef = [abs(a) for a in coefStar]\n#sort by magnitude\ncoefSorted = sorted(absCoef,\
  \ reverse=True)\nidxCoefSize = [absCoef.index(a) for a in coefSorted if a == 0.0]\n\
  \nprint('\\nFeatures ordered by coefficient size on normalized features:')\n[print(names[idxCoefSize[i]])\
  \ for i in range(len(idxCoefSize))]\n\nlasso_model = linear_model.Lasso(alpha=0.002935580335160765,\n\
  normalize=True)\nlasso_model.fit(xList, labels)\n\nprint('\\nCoefficient relative\
  \ to natural features (from model trained\non normalized features)')\n[print(a,\
  \ '\\t', b) for (a,b) in zip(names, lasso_model.coef_)]\n\nPrinted Output:\nFeatures\
  \ Ordered by Early They Enter the Model:\n\"alcohol\"\n\"volatile acidity\"\n\"\
  sulphates\"\n\"total sulfur dioxide\"\n\"chlorides\"\n\"fixed acidity\"\n\"pH\"\n\
  \"free sulfur dioxide\"\n\"residual sugar\"\n\"citric acid\"\n\"density\"\n\nFeatures\
  \ ordered by coefficient size on normalized features:\n\"alcohol\"\n\"volatile acidity\"\
  \n\"sulphates\"\n\"total sulfur dioxide\"\n\"chlorides\"\n\"pH\"\n\"free sulfur\
  \ dioxide\"\n\"fixed acidity\"\n\"citric acid\"\n\"residual sugar\"\n\nCoefficient\
  \ relative to natural features (from model trained on normalized features)\n\"fixed\
  \ acidity\"             0.0\n\"volatile acidity\"         -1.02813526115944\n\"\
  citric acid\"              0.0\n\"residual sugar\"            -1.588056398184254\n\
  \"chlorides\"                 0.00146786619054098\n\"free sulfur dioxide\"     \
  \  -0.00235558575039108\n\"total sulfur dioxide\"     0.0\n\"density\"         \
  \         -0.345823619928201\n\"pH\"                       0.794656909063523\n\"\
  sulphates\"                 0.283884500213842\n```\n\n![图 5.3: 用于预测葡萄酒质量的系数曲线](img/c05f003.png)\n\
  \n图 5.3: 用于预测葡萄酒质量的系数曲线\n\nListing 5-2 的打印输出通过两种不同的方法计算了变量重要性。一种方法是根据变量随着 alpha\
  \ 减小进入模型的早晚对它们进行排序。这在归一化数据上才有意义。第一个获得非零系数的变量最重要，第二个次之，依此类推。你将在 Listing 5-2 的打印输出中看到按此顺序出的变量。确定变量重要性的另一种方法是查看在交叉验证中获得最佳性能的\
  \ alpha 值系数的大小。再次，这种排序仅对归一化变量有意义。该列表也显示在 Listing 5-2 的打印输出中。通常，这两种方法在最重要的变量及其排序上是一致的。两种方法在某些不重要的变量上存在分歧，这是正常现象。列表下方的排名稳定性较低。由于所有变量都会在某个时刻进入模型，第一种方法为所有变量提供了排名。第二种方法使用最佳\
  \ alpha 的系数，这意味着某些系数可能为零。\n\n\n\n\n程序硬编码了在交叉验证中产生最佳结果的 α 值。代码中的版本是使用归一化后的属性和标签训练出的最佳\
  \ alpha。将其中任一者更改为未归一化，都将改变对应的最佳 α 值。将 Y 更改为未归一化，会导致该值发生 1.2 倍的变化，这个变化值源于将标准差归一化为\
  \ 1.0（正如之前在上下文中讨论归一化标签与未归一化标签之间的 MSE 差异时所提到的）。硬编码的 α 值用于识别与最佳交叉验证结果对应的系数向量。\n\n\
  ## 基底展开：通过从旧变量创建新变量来提高性能\n\n[第 4 章]讨论了如何以旧属性函数的形式添加新属性。此举目的是观察这是否能提高性能。[列表 5-3]\
  \ 显示了如何向葡萄酒数据添加两个新属性。\n\n### 列表 5-3：使用样本外误差评估预测葡萄酒质量的新属性—wineExpandedLassoCV.py\n\
  \n```python\n__author = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\n\
  import numpy as np\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn\
  \ import datasets, linear_model\nfrom sklearn.linear_model import LassoCV\nfrom\
  \ math import sqrt\nimport matplotlib.pyplot as plt\n\n# 将数据读入迭代对象\nnames, xList,\
  \ labels = list_read_wine()\n\n# 添加两个新属性 - 最后一项（酒精含量）的平方以及酒精与挥发性酸含的乘积\nfor i in\
  \ range(len(xList)):\n    alcElt = xList[i][-1]\n    volAcid = xList[i][1]\n   \
  \ temp = list(xList[i])\n    temp.append(alcElt*alcElt)\n    temp.append(alcElt*volAcid)\n\
  \    xList[i] = list(temp)\n\n# 检查新维度\nprint('New number of attributes   ', len(xList[0]))\n\
  \n# 向变量列表中添加新名称\nnames.append(\"alco²\")\nnames.append(\"alco*volAcid\")\n  # 归一化\
  \ x 和 labels 中的列\n# 注意：注意归一化。某些惩罚回归包\n# 包含了它，而有些则没有。\n\nxScaler = StandardScaler()\n\
  xNormalized = xScaler.fit_transform(xList)\n\n# 归一化标签\nyScaler = StandardScaler()\n\
  yNormalized = yScaler.fit_transform(np.array(labels).reshape([\n         -1,1])).reshape([-1])\n\
  \n# 归一化标签\nY = np.array(yNormalized)\n\n# 归一化的 Xs\nX = np.array(xNormalized)\n\n\
  # 从 sklearn.linear_model 调用 LassoCV\nwineModel = LassoCV(cv=10).fit(X, Y)\n\n# 显示结果\n\
  plt.figure()\nplt.plot(wineModel.alphas_, wineModel.mse_path_, ':')\nplt.plot(wineModel.alphas_,\
  \ wineModel.mse_path_.mean(axis=-1),\n          label='Average MSE Across Folds',\
  \ linewidth=2)\nplt.axvline(wineModel.alpha_, linestyle='--',\n             label='CV\
  \ Estimate of Best alpha')\nplt.semilogx()\nplt.legend()\nax = plt.gca()\nax.invert_xaxis()\n\
  plt.xlabel('alpha')\nplt.ylabel('Mean Square Error')\nplt.axis('tight')\nplt.savefig('wineExpandedLassoCV.png',\
  \ dpi=500)\nplt.show()\n\n# 输出使交叉误差最小的 alpha 值\nprint(\"alpha Value that Minimizes\
  \ CV Error  \",wineModel.alpha_)\nprint(\"Minimum MSE  \",wineModel.mse_path_.mean(axis=-1))\n\
  \n打印输出：\nNew number of attributes    13\nalpha Value that Minimizes CV Error   0.02061210346691726\n\
  Minimum MSE   0.6669998239324\n```\n\n[图 5.4] 显示了使用扩展属性集进行 Lasso 的交叉验证曲线。交叉验证曲线的特征与没有基底展开的曲线相比没有显著差异。\n\
  \n![图 5.4：在扩展特征集的葡萄酒数据上训练 Lasso 的交叉验证曲线](img/c05f004.png)\n\n### 图 5.4：在扩展特征集的葡萄酒数据上训练\
  \ Lasso 的交叉验证曲线\n\n本节演示了在具有实数型结果的问题（回归问题）上使用惩罚回归方法。下一节将展示在结果为二值的问题上使用惩罚线性回归。代码将与你在本节中看到的相似，某些技术（如基底展开）可以用于分类问题。主要的区别在于分类问题的评分方式。\n\
  \n## 二分类：使用惩罚线性回归检测由于未爆炸的地雷\n\n[第 4 章]讨论了如何将惩罚线性回归用于分类问题，并为岩石对比问题做了准备。本节详细介绍了如何使用惩罚线性回归处理结果为二值的问题。代码将与你在本节中看到的相似，某些技术（如基底展开）可以用于分类问题。本节引入了\
  \ `ElasticNet` 包。你会记得[第 4 章]中提到的 `ElasticNet` 包含一个更通用的惩罚函数，并将 Lasso 和岭惩罚函数作为特例。这使得可以在调整惩罚函数时观察分类器性能的变化。以下是解决问题的步骤：\n\
  \n1. 将二分类问题转换为回归问题。当类别结果取两个值之一时赋值 `0.0`，当取另一个值时赋值 `1.0`，从而构造实数标签向量。\n2. 执行交叉验证。交叉验证变得稍微复杂了一些，因为你需要为每个折计算误差量。Scikit-learn\
  \ 有一些实用的工具来简化这些计算。\n\n\n\n\n\n有了数值属性和数值标签，使用带惩罚的线性回归版本已准备就绪。下一步的逻辑步骤是进行交叉验证，以获得样本外性能估计，并确定惩罚参数\
  \ `α` 的最佳值。对于这个问题，执行交叉验证需要构建一个包含训练和测试的交叉验证循环。为什么要构建交叉验证循环，而不是使用 Python 中的交叉验证包（例如在本章之前的葡萄酒质量示例中使用的那个）？\n\
  \n回归的交叉验证是基于 `MSE` 的。对于回归问题来说完全合理，但对于分类问题则不然。正如第 3 章中所述，你对分类问题性能的表征方式与回归问题不同。第 3\
  \ 章讨论了若干种表征性能的方法。一种自然的方法是衡量分类错误的示例百分比。另一种方法是衡量 `AUC`。请参考第 3 章或维基百科页面 `http://en.wikipedia.org/wiki/Receiver_operating_characteristic`\
  \ 以复习 `AUC` 测量的知识。衡量其中任何一种指标都需要访问每个交叉验证折中的预测值和标签。你无法根据折中的 `MSE` 摘要来判断分类错误。\n\n交叉验证循环将数据分为训练集和测试集，然后调用\
  \ Python 的 `enet_path` 方法在数据的训练部分上完成训练。该例程的两个输入与默认值不同。一个是 `l1_ratio`，被设置为 `0.8`。该参数决定了惩罚项中系数绝对值之和占的比例。值\
  \ `0.8` 意味着惩罚函数是 80% 的绝对值之和和 20% 的平方和。另一个非默认参数是 `fit_intercept`，被设置为 `False`。代码使用了归一化标签和归一化属性。由于这些所有内容都是零均值的，因此不需要计算截距项。截距仅用于调整属性与标签之间的任何常数偏移。使用归一化标签消除了对截距项的需求，使得预测计算更加整洁。归一化标签的唯一缺点是使得\
  \ `MSE` 计算相对于回归问题的意义较小，但对于分类问题，你反正不会使用该性能指标。\n\n在每个折中，在训练完成后，生成的系数被用于对该折的样本外数据生成预测。这在代码中通过使用\
  \ `numpy dot` 函数、该折的样本外数据属性以及该折的系数来实现。这种两个 `numpy` 数组的矩阵式乘法会产生另一个二维数组，其行对应于该折样本外测试数据的行，其列对应于\
  \ `enet_path` 生成的模型序列（即系数向量序列和相应的 `α` 序列）。每个折的这些预测矩阵被连接在一起（想象将它们堆叠在一起），样本外标签也是如此。然后，在运行结束时，这些由逐个折中汇总的样本外结果汇编可以被轻松、高效地处理，从而产生每个模型的性能数据，并选择一个用于部署的模型复杂度（`α`）。\n\
  \n### 代码列表 5-4\n使用两个指标生成比较。第一个是分类错误率。第二个是接收者工作特征曲线（`ROC`）下的面积。预测矩阵中的每一列代表了某一组模型系数对全部样本外数据所生成的预测值。所有数据都表示在每一列中，因为每一行都在一个（且仅一个）折中被留出。分类错误比较每次处理一列预测数据和逐折中累积的样本外标签（代码中称为\
  \ `yOut`）。每个预测值都与固定阈值（本示例中为 `0.0`）进行比较以确定预测分类。然后，将预测分类与 `yOut` 中对应的项进行比较，以确定预测分类是否正确。\n\
  \n#### 代码列表 5-4: 使用 ElasticNet 回归构建二分类（两类）分类器——rocksVMinesENetRegCV.py\n\n\n\n\n\
  \n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_rvm\n\
  from math import sqrt, fabs, exp\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.linear_model import enet_path\nfrom sklearn.metrics\
  \ import roc_auc_score, roc_curve\nimport numpy as np\n\n# 从 UCI 数据库仓库读取数据\nxNum,\
  \ labels = list_read_rvm()\n\n# x 矩阵的行数和列\nnrow = len(xNum)\nncol = len(xNum[1])\n\
  \n# 使用 StandardScaler 对数据标准化\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xNum)\n\
  \nyScaler = StandardScaler()\nlabelsNormalized = yScaler.fit_transform(np.array(labels).\n\
  reshape([-1, 1])).reshape([-1])\n\n# 交叉验证的折数\nnxval = 10\n\nfor ixval in range(nxval):\n\
  \    # 定义测试集和训练索引集\n    idxTest = [a for a in range(nrow) if a%nxval == ixval%nxval]\n\
  \    idxTrain = [a for a in range(nrow) if a%nxval != ixval%nxval]\n\n    # 定义测试集和训练集的属性与标签集\n\
  \    xTrain = numpy.array([xNormalized[r] for r in idxTrain])\n    xTest = numpy.array([xNormalized[r]\
  \ for r in idxTest]) \n    labelTrain = numpy.array([labelsNormalized[r] for r in\
  \ idxTrain])\n    labelTest = numpy.array([labelsNormalized[r] for r in idxTest])\n\
  \n    alphas, coefs, _ = enet_path(xTrain, labelTrain,l1_ratio=0.8,\n    fit_intercept=False,\
  \ return_models=False)\n\n    # 将系数应用于测试数据以产生预测并累加\n    if ixval == 0:\n       \
  \ pred = numpy.dot(xTest, coefs)\n        yOut = labelTest\n    else:\n        #\
  \ 累加预测\n        yTemp = numpy.array(yOut)\n        yOut = numpy.concatenate((yTemp,\
  \ labelTest), axis=0)\n\n        # 累加预测\n        predTemp = numpy.array(pred)\n\
  \        pred = numpy.concatenate((predTemp, numpy.dot(xTest, coefs)),\n       \
  \ axis = 0)\n\n# 计算分类错误率\nmisClassRate = []\n_,nPred = pred.shape\nfor iPred in\
  \ range(1, nPred):\n    predList = list(pred[:, iPred])\n    errCnt = 0.0\n    for\
  \ irow in range(nrow):\n        if (predList[irow] = 0.0) and (yOut[irow] >= 0.0):\n\
  \            errCnt += 1.0\n        elif (predList[irow] >= 0.0) and (yOut[irow]\
  \ < 0.0):\n            errCnt += 1.0\n    misClassRate.append(errCnt/nrow)\n\n#\
  \ 寻找最小点用于绘图并打印\nminError = min(misClassRate)\nidxMin = misClassRate.index(minError)\n\
  plotAlphas = alphas[1:len(alphas)]\n\nplt.figure()\nplt.plot(plotAlphas, misClassRate,\
  \ label='跨折的分类错误率', linewidth=2)\nplt.vline(plotAlphas[idxMin], linestyle='--',\
  \ label='最佳 alpha 的交叉验证估计')\nplt.legend()\nplt.semilog()\nax = plt.gca()\nax.invert_xaxis()\n\
  plt.xlabel('alpha')\nplt.ylabel('分类错误率')\nplt.show()\n\n# 计算 AUC。\nidxPos = [i for\
  \ i in range(nrow) if yOut[i] > 0.0]\nyOutBin = [0]\nfor i in idxPos: yOutBin[i]\
  \ = 1\nauc = []\nfor iPred in range(1, nPred):\n    predList = pred[:, iPred]\n\
  \    aucCalc = roc_auc_score(yOutBin, predList)\n    auc.append(aucCalc)\n\nmaxAUC\
  \ = max(auc)\nidxMax = auc.index(maxAUC)\n\nplt.figure()\nplt.plot(plotAlphas, auc,\
  \ label='跨折的 AUC', linewidth=2)\nplt.vline(plotAlphas[idxMax], linestyle='--', label='最佳\
  \ alpha 的交叉验证估计')\nplt.legend()\nplt.semilog()\nax = plt.gca()\nax.invert_xaxis()\n\
  plt.xlabel('alpha')\nplt.ylabel('曲线下面积')\nplt.show()\n\n# 绘制最佳 ROC 曲线\nfpr, tpr,\
  \ thresh = roc_curve(yOutBin, pred[:, idxMax])\nplt.plot(fpr, tpr, linewidth=2)\n\
  plt.xlabel('假阳性率')\nplt.ylabel('真性率')\nplt.show()\n\nprint('分类错误率最佳值:', misClassRate[idxMin])\n\
  print('分类错误率最佳 alpha:', plotAlphas[idxMin])\nprint('AUC 最佳值:', auc[idxMax])\nprint('AUC\
  \ 最佳 alpha:', plotAlphas[idxMax])\n```\n\n\n\n\n\n列表 5-4 中所示的 AUC 计算使用了 `sklearn.metrics`\
  \ 包中的 `roc_curve` 和 `roc_auc_score` 程序。生成 AUC 与 $\\alpha$ 曲线的过程与生成分类错误曲线的过程相似，不同之处预测值列和真实值列被传递给\
  \ `roc_auc_score` 程序以生成 AUC 数值。然后这些数值被绘制在图 5.6 中。生成的曲线看起来大致是分类错误曲线的倒置——倒置是因为对于 AUC\
  \ 来说越大越好，而对于分类错误来说是越小越好。列表 5-4 末尾的打印输出显示，基于分类错误的最优模型位置与 AUC 的优模型位置并不完全相同，但它们并不遥远。图\
  \ 5.7 显示了使 AUC 最大化的分类器的 ROC 曲线。\n\n![图 5.6: 样本分类器 AUC 性能](img/c05f006.png)\n\n**图\
  \ 5.6**](#c05.xhtml#R_c05-fig-0006): 样本分类器 AUC 性能\n\n![图 5.7: 性能最佳分类器的接收者工作特性](img/c05f007.png)\n\
  \n**图 5.7**](#c05.xhtml#R_c05-fig-0007): 性能最佳分类器的接收者工作特性\n\n在您的问题中，某些错误可能比其他错误更昂，这导致您希望结果偏离昂贵的错误，倾向于廉价的错误。对于岩石与地雷的问题，将未爆炸的地雷错误地分类为岩石的代价可能比将岩石分类为地雷要高得多。\n\
  \n处理这种问题的一种系统方法是使用混淆矩阵，这在第 3 章中讨论过。从 `roc_curve` 程序的输出构建混淆矩阵相对容易。ROC 曲线上的点对应于不同的阈值值。点\
  \ (1,1) 对应于极端情况，即阈值设置得足够低，使得所有点都被分类为地雷。这使得真正率和假阳率都等于一；分类器正确识别了所有的正点，但也错误了所有的负点。将阈值设置为高于所有点则给出图表的另一个角。要了解点在混淆矩阵各个框之间移动的细节，需要选择一些阈值并打印结果。列表\
  \ 5-4 显示了从中选取的三个阈值。\n\n### 构建用于部署的岩石与地雷分类器\n\n与葡萄酒质量案例研究一样，下一步是在完整数据集上重新训练模型，并提取与最佳\
  \ alpha 对应的系数——即被确定为能最小化样本错误的 alpha，这在案例研究中是通过交叉验证来估计的。列表 5-5 显示了实现此操作的代码。\n\n\n\
  \n\n\n```python\nauthor__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_rvm\n\
  from math import sqrt, fabs, exp\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.linear_model import enet_path\nfrom sklearn.metrics\
  \ import roc_auc_score, roc_curve\nimport numpy as np\n\n# 从 uci 数据仓库读取数据\nxNum,\
  \ labels = list_read_rvm()\n\n# x 矩阵的行数和列数\nnrow = len(xNum)\nncol = len(xNum[1])\n\
  \n# 使用 StandardScaler 归一化数据\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xNum)\n\
  \nyScaler = StandardScaler()\nlabelsNormalized = yScaler.fit_transform(np.array(labels).\n\
  reshape([-1, 1])).reshape([-1])\n\n# 将归一化标签转换为 numpy 数组\nY = np.array(labelsNormalized)\n\
  \n# 将归一化属性转换为 numpy 数组\nX = np.array(xNormalized)\n\nalphas, coefs, _ = enet_path(X,\
  \ Y,l1_ratio=0.8, fit_intercept=True, \nreturn_models=False)\n\nplt.xlabel('alpha')\n\
  plt.ylabel('Coefficients')\nplt.semilogx(alphas,coefs.T)\nplt.axis('tight')\nax\
  \ = plt.gca()\nax.invert_xaxis() \n# plt.savefig('rocksVMinesCoefCurves.png', dpi=500)\n\
  plt.show()\nnattr, nalpha = coefs.shape\n\n# 寻找系数排序\nnzList = []\nfor iAlpha in\
  \ range(1,nalpha):\n    coefList = list(coefs[: ,iAlpha])\n    nzCoef = [index for\
  \ index in range(nattr) if coefList[index] \n              != 0.0]\n    for q in\
  \ nzCoef:\n        if not(q in nzList):\n            nzList.append(q)\n\n# 为 X 的列命名\n\
  names = ['V' + str(i) for i in range(ncol)]\nnameList = [names[nzList[i]] for i\
  \ in range(len(nzList))]\nprint(\"按进入模型早晚排序的属性\")\nprint(nameList)\nprint('')\n\n\
  # 寻找最佳 alpha 值的系数。alpha 值\n# 对应\n# 归一化 X 和 归一化 Y 的 0.020334883589342503\n\nalphaStar\
  \ = 0.020334883589342503\nindexLTalphaStar = [index for index in range(100) if alphas[index]>\
  \ \n      alphaStar]\nindexStar = max(indexLTalphaStar)\n\n# 这里是用于部署的系数集\ncoefStar\
  \ = list(coefs[:,indexStar])\nprint(\"最佳系数值 \")\nprint(coefStar)\nprint('')\n\n\
  # 归一化属性上的系数提供了另一种略微\n不同的排序\n\nabsCoef = [abs(a) for a in coefStar]\n\n# 按幅值排序\n\
  coefSorted = sorted(absCoef, reverse=True)\n\nidxCoefSize = [absCoef.index(a) for\
  \ a in coefSorted if not(a == 0.0)]\n\nnamesList2 = [names[idxCoefSize[i]] for i\
  \ in range(len(idxCoefSize))]\n\nprint(\"按最佳 alpha 下系数大小排序的属性\")\nprint(namesList2)\n\
  ```\n\n打印输出：（输出已省略，请在仓库中运行 jupyter notebook 查看更多）\n按进入模型早晚排序的属性：\n['V10', 'V48',\
  \ 'V11', 'V44', 'V35', 'V51', 'V20', ... , 'V41', 'V40',\n'V59', 'V12', 'V9', 'V18',\
  \ 'V14', 'V47', 'V42']\n\n最佳系数值 \n[0.08225825681376615, 0.0020619887220037283, -0.11828642590855767,\
  \ \n... 0.06809647597425712, 0.07048886443547747, 0.0]\n\n按最佳 alpha 下系数大小排序的属性\n\
  ['V48', 'V30', 'V11', 'V29', 'V35', 'V3', 'V15', ... 'V20', 'V23',\n'V38', 'V55',\
  \ 'V31', 'V13']\n\n\n\n\n\n正如第 4 章所示，分类任务中惩罚化回归的替代方案是使用惩罚化逻辑回归。列表 5-5 展示了惩罚化逻辑回归的实现代码，用于构建岩石与矿井数据集的分类器。该列表及相关结果强调了这两种方法之间的相似之处与差异。\n\
  \n算法上的差异可以在迭代结构中看出。逻辑回归方法涉及使用属性的线性函数来计算每个训练样本为岩石或矿井的概率和似然度。（有关逻辑回归的更多背景以及相关方程的详细推导，请参见\
  \ `http://en.wikipedia.org/wiki/Logistic_regression`）。非惩罚化逻辑回归的算法被称为`迭代加权最小二乘法`（IRLS）。该名称源于算法的性质（参见\
  \ `http://en.wikipedia.org/wiki/Iteratively_reweighted_least_squares`）。它根据训练集中每个样本的概率估计来推导权重。给定权重后，该问题就变成了一个加权最小二乘回归问题。该过程必须不断迭代，直到概率（以及相应的权重）停止变化。基本上，逻辑回归的\
  \ IRLS 只是在你在第 4 章中看到的（非逻辑的）惩罚化回归算法基础上增加了一层迭代。\n\n在读取变量并对其归一化后，程序初始化了逻辑回归及其惩罚化版本核心的权重和概率。每当惩罚参数减小时，都都必须与系数（β）一起估计这些概率和权重。你会看到代码中某些变量后面被添加了\
  \ IRLS 字母，以表示它们与迭代中的 IRLS 层相关。估计概率的迭代位于减小 `λ` 的循环内部，并包裹了对 `β`s 进行坐标下降迭代的循环外层。\n\n\
  更新的细节比普通（非逻辑的）惩罚化回归算法稍微复杂一些。一个复杂之处是随 IRLS 生成的权重。权重和概率是逐个输入样本计算的，在代码中用 `p` 和 `w`\
  \ 表示。权重对“属性乘以残差”和“属性平方”等乘积和的影响也需要被收集。这些由如 `sumWxx` 等变量表示，它是一个包含权重乘以每个属性平方之和的列表。另一个复杂之处是残差现在是标签、概率以及（更熟悉的）属性及其系数（β）的函数。\n\
  \n代码运行并产生变量排序和系数曲线，以便与使用非逻辑惩罚化回归生成的曲线进行比较。逻辑变换使得系数的直接比较变得有些棘手，因为逻辑函数导致了非线性的缩放变化。普通回归和逻辑回归（惩罚化和非惩罚化）都会生成系数向量，然后将（相同的）属性与它们相乘，并与阈值进行比较。阈值本身是次要的，因为正如演示所示，它可以在训练后确定。因此，`β`s\
  \ 的整体尺度并不如各个组件之间的相对大小那么重要。判断相对大小的一种方法是观察两种方法引入新变量的顺序。你可以通过对比列表 5-5：在岩石与矿井数据上训练的惩罚化逻辑回归—rvmGlmnet2.py\n\
  \n\n\n\n\n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_rvm\n\
  from math import sqrt, exp, fabs\nimport matplotlib.pyplot as plt\nimport numpy\
  \ as np\nfrom sklearn.preprocessing import StandardScaler\n\n#定义几个实用用函数\ndef S(z,gamma):\n\
  \    if gamma >= fabs(z):\n        return 0.0\n    if z > 0.0:\n        return z\
  \ - gamma\n    else:\n        return z + gamma\n\ndef Pr(b0,b,x):\n    \"\"\"\n\
  \    :param b0: 偏置值\n    :param b: 系数的列矩阵\n    :param x: 特征矩阵\n    :return: 概率的列矩阵\n\
  \    \"\"\"\n    #计算名义值\n    sum = b0 + np.dot(x, b)\n    p = (1.0/(1.0 + np.exp(-sum))).reshape([-1,\
  \ 1])\n    w = (p * (1.0 - p)).reshape([-1, 1])\n\n    # 极端值处理\n    idxSmall = np.abs(p)\
  \ < 1e-5\n    idxLarge = np.abs(1.0 - p) < 1e-5\n\n    p[idxSmall] = 0.0\n    w[idxSmall]\
  \ = 1e-5\n    p[idxLarge] = 1.0\n    w[idxLarge] = 1e-5\n    return p, w\n\n#从 uci\
  \ 仓库读取数据并整理\nxNum, labels = list_read_rvm()\n\nnrow = len(xNum)\nncol = len(xNum[1])\n\
  \nalpha = 1.0\n\n### 归化特征\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xNum)\n\
  \n# 不对标签进行归化但计算平均值\nlabels = np.array(labels).reshape([-1, 1])\nmeanLabel = np.mean(labels)\n\
  sdLabel = np.std(labels)\n\n# 初始概率为 1 的频率\np = meanLabel\nw = p * (1.0 - p)\nz =\
  \ (labels - p) / w\nsumWxz = np.sum(w * xNormalized * z, axis=0)\nmaxWxz = np.amax(np.abs(sumWxz))\n\
  \n# lambda 的起始值\nlam = maxWxz / alpha\n\n#此 lambda 值对应于 beta = 0 向量列表\n# 初始化系数向量\
  \ beta\nbeta = np.zeros([ncol, 1])\nbeta0 = 0.0\n\n# 初始化每一步的 beta 矩阵\nbetaMat =\
  \ beta.copy()\n\nbeta0List = [0.0]\n\n# 开始迭代\nnSteps = 100\nlamMult = 0.93 # 100\
  \ 步会让 lambda 缩小 100 倍\n#（作者建议）\nnzList = []\nfor iStep in range(nSteps):\n    #\
  \ 减少 lambda\n    lam = lam * lamMult\n\n    # 使用 beta 的增量变化控制内部迭代\n    # 设置中间循环的\
  \ beta 值等于外部循环的值\n    # 这些值用于权重和概率\n    # 内部值用于惩罚回归\n    # 遍历数据以计算迭代所需的数据平均值\n \
  \   # 初始化累加器\n    betaIRLS = beta.copy()\n    beta0LS = beta0\n    distIRLS = 100.0\n\
  \    # 中间循环：固定 IRLS 权重和概率计算新的 beta\n    iterIRLS = 0\n    while distIRLS > 0.01:\n\
  \        iterIRLS += 1\n        iterInner = 0\n        betaInner = betaIRLS.copy()\n\
  \        beta0Inner = beta0LS\n        distInner = 100.0\n        while distInner\
  \ > 0.01:\n            iterInner += 1\n            if iterInner > 100: break\n \
  \           p, w = Pr(beta0LS, betaIRLS, xNormalized)\n            z = (labels -\
  \ p) / w + beta0LS + np.dot(xNormalized, betaIRLS)\n            # 遍历属性并逐个更新\n  \
  \          # 记录用于比较的起始值\n            betaStart = betaInner.copy()\n            for\
  \ iCol in range(ncol):\n                r = (z - beta0Inner - np.dot(xNormalized,\
  \ betaInner)).reshape([-1, 1])\n                xTemp = xNormalized[:, iCol].reshape([-1,\
  \ 1])\n                sumWxr = np.sum(w * xTemp * r)\n                sumWxx =\
  \ np.sum(w * xTemp * xTemp)\n                sumWr = np.sum(w * r)\n           \
  \     sumW = np.sum(w)\n                avgWxr = sumWxr / nrow\n               \
  \ avgWxx = sumWxx / nrow\n\n                beta0Inner = beta0Inner + sumWr / sumW\n\
  \                uncBeta = sumWxr + sumWxx * betaInner[iCol, 0]\n              \
  \  betaInner[iCol, 0] = S(uncBeta, lam * alpha) / (sumWxx + lam * (1.0 - alpha))\n\
  \n            sumDiff = np.sum(np.abs(betaInner - betaStart))\n            sumBeta\
  \ = np.sum(np.abs(betaInner))\n            distInner = sumDiff/sumBeta\n\n     \
  \   #print(iStep, iterIRLS, iterInner)\n        print('\\r', 'Step', iStep, 'IRLS\
  \ iteration', iterIRLS, 'Inner iteration', iterInner,\n        # 如果退出内部循环，则设置 betaMiddle\
  \ = betaInner 并\n        # 再次运行中间循环\n\n        # 检查 beta 的变化判断 IRLS 是否收敛\n     \
  \   a = np.sum(np.abs(betaInner - betaIRLS))\n        b = np.sum(np.abs(betaIRLS))\n\
  \        distIRLS = a / (b + 0.0001)\n        beta = = beta - -LS\n            \
  \     = = =\n\n    beta =betaIRLS.copy()\n    beta0 = beta0LS\n    betaMat = np.concatenate((betaMat,\
  \ beta.copy()), axis=1)\n    beta0List.append(beta0)\n\n    nzBeta = [index for\
  \ index in range(ncol) if beta[index] != 0.0]\n    for q in nzBeta:\n        if\
  \ not(q in nzList):\n            nzList.append(q)\n\n    # 为 xNum 的列命名\n    names\
  \ = ['V' + str(i) for i in range(ncol)]\n    nameList = [names[nzList[i]] for i\
  \ in range(len(nzList))]\n\n    print('\\n', nameList)\n    for i in range(ncol):\n\
  \        # 绘制每个属性的 beta 值范围\n        nSteps = betaMat.shape[1]\n        coefCurve\
  \ = betaMat[i, :].reshape([-1, 1])\n        xaxis = range(nSteps)\n        plt.plot(xaxis,\
  \ coefCurve)\n\n    plt.xlabel(\"步数\")\n    plt.ylabel(\"系数值\")\n    plt.savefig('rocksVMinesGlnet.png',\
  \ dpi=500)\n    plt.show()\n\n```\n\n图 5.9 显示了使用惩罚逻辑回归的石头与矿石系数曲线。如所述，由于逻辑函数的存在，系数尺度与普通惩罚回归不同。普通回归试图对\
  \ 0.0 和 1.0 的目标拟合直线。逻辑回归通过拟合“对数几率”来预测类别的概率。假设 `p` 是样本属于矿类的预测概率。那么几率就是该概率与其反对的比率\
  \ ![images](img/c05-i0001.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac><mi>p</mi><mrow><mn>1</mn><mo>&#8722;</mo><mi>p</mi></mrow></mfrac></mrow></math>。对数几率是几率的自然对数。虽然\
  \ `p` 的范围是从 0 到 1，但 `p` 的对数几率范围是从负无穷到正无穷。对数几率极大且为正的情况对应于预测非常确定属于矿类。较大的负数则对应于石头类。\n\
  \n\n\n\n你在上一一节中看到的岩石与水雷问题被称为二分类问题，因为标签和预测值取两个可能值中的一个。（处理后的声纳返回信号是来自岩石反射还是水雷？）。如果标签和预测可以取两个以上的值，则该问题被称为多分类问题。本节将使用惩罚线性回归来解决玻璃样本分类问题。正如第\
  \ 2 章中更详细描述的，玻璃数据集包含 214 份 6 种不同玻璃的 9 个物理化学测量值（折射率和化学成分测量）。该问题是使用物理化学测量值来确定给定样本代表六种玻璃类型中的哪一种。该应用领域是犯罪和事故现场的法医分析。该数据集来自\
  \ UCI 数据仓库，该数据集的网页引用了一篇使用支持向量机解决相同问题的论文。在查看了解决此问题的代码后，本节将与其性能与支持向量机方法进行对比。\n\nListing\
  \ 5-7 显示了解决此问题的代码。\n\n### Listing 5-7: 使用惩罚线性回归进行多分类：犯罪现场玻璃样本分类——glassENetRegCV.py\n\
  \n```python\n__author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_glass\n\
  from math import sqrt, fabs, exp, log\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.linear_model import LogisticRegressionCV\n\
  import numpy as np\n\n#define custom cv folds\ndef custom_cv_folds(X, nFolds):\n\
  \    n = X.shape[0]\n    i = 0\n    while i < nFolds:\n        idxTest = np.array([it\
  \ for it in range(n) if it%nFolds == i])\n        idxTrain = np.array([it for it\
  \ in range(n) if it not in idxTest])\n        yield idxTrain, idxTest\n        i\
  \ += 1\n\n#read in glass data\nnames, xNum, labels, yOneAll = list_read_glass()\n\
  \n#use StandardScaler to normalize data\nxScaler = StandardScaler()\nxNormalized\
  \ = xScaler.fit_transform(xNum)\n\n#define custom x-val folds to insure labels are\
  \ balanced\ncustom_cv = custom_cv_folds(xNormalized, 9)\n\nglassModel = LogisticRegressionCV(Cs=20,\
  \ \n             cv=custom_cv, \n             multi_class='ovr').fit(xNormalized,\
  \ labels)\n\n#Note - LogisticRegressionCV uses inverse the usual param.  \nCs =\
  \ np.array(glassModel.Cs_)\n\n#Average accuracy for each label across cross-validation\n\
  keys = list(glassModel.scores_.keys())\nxvalScores = np.zeros([len(Cs), len(keys)])\n\
  for iikey in range(len(keys)):\n    key = keys[ikey]\n    xvalScores[:, iikey] =\
  \ np.average(np.array(glassModel.\n                        scores_[key]), axis=1)\n\
  \    \n  # Display results\n  plt.figure()\n  plt.plot(Cs, xvalScores, ':')\n  plt.plot(Cs,\
  \ xvalScores.mean(axis=1),\n         label='Average accuracy for each glass type',\
  \ linewidth=2)\n\nplt.semilogx()\n  plt.legend()\n  ax = plt.gca()\n\n  plt.xlabel('C')\n\
  \  plt.ylabel('Average Accuracy')\n  plt.axis('tight')\n  plt.savefig('glassMulticlassRegression.png',\
  \ dpi=500)\n  plt.show()\n\n#print val alpha that minimizes the Cv-error for each\
  \ glass type\nprint(\"C values that maximize accuracy for each type \\n\",glassModel.Cs_)\n\
  print(\"Maximum Accuracy for each type \\n\", np.amax(xvalScores, axis=0))\n\nPrinted\
  \ Output:\nC values that maximize accuracy for each type \n [4.28133240e+00 5.45559478e+02\
  \ 1.00000000e-04 3.35981829e-02\n 2.97635144e+01 5.45559478e+02]\n \n Maximum Accuracy\
  \ for each type \n [0.784219   0.69746377 0.92049114 0.94404187 0.98611111 0.97181965]\
  \ \n```\n\n查看玻璃数据的标签。你会发现标签由整数玻璃类型组成。每行都有一个反映该行化学测量值相关玻璃类型的整数。这正是 `sklearn` 逻辑回归包所需的格式：每个不同类别的唯一标识列。\n\
  \n特征经过了归一化，但与上一节中的 `glmnet` 代码一样，逻辑回归并没有以从归一化的方式使用标签。\n\n图 5.10 显示了玻璃类的交叉验证误差随惩罚参数\
  \ `C` 的的变化。对于这个 `sklearn` 逻辑回归包，惩罚参数与我们看到的不同。它是通常惩罚参数的倒数。`C` 从左到右增大。`C` 值越大，惩罚的权重越小。正则参数\
  \ `C` 的最佳值取决于玻璃类型。选择一个能为你的问题提供最佳整体性能的值。这将取决于你对每个类别性能的重视程度。\n\n![图 5.10: 使用惩罚线性回归进行玻璃分类的错误率](img/c05f010.png)\n\
  \n**图 5.10**: 使用惩罚线性回归进行玻璃分类的错误率\n\n## 使用 PySpark 进行线性回归和分类\n\n本节将重复你已经见过的几个问题，但将使用\
  \ `PySpark`，这意味着你看到的代码示例可以在成百或数千个处理器上运行。这将允许你在海量数据集上构建模型。本节将通过各种示例来展示如何使用 `PySpark`\
  \ `mllib` 包解决回归、二分类和多分类问题。你将看到你已经熟悉的各种算法和分析技术：惩罚回归、变量归一化、交叉验证等。\n\n`PySpark` 的某些计算序列初看起来可能奇怪。由于\
  \ `PySpark` 设计用于处理分布在多台机器上的数据，因此它对数据进行转换，这些转换可以一次处理一行数据，无论数据存储在何处。你将看到它是如何运行的，通过练习，这些操作将成为你熟悉的工具。\n\
  \n你将在本节中看到的四个问题是预测葡萄酒风味、将声纳目标分类为岩石或水雷、预测鲍鱼壳中的环数，以及根据化学成分识别玻璃类型。选择这些问题是为了练习你想要理解的\
  \ `PySpark` 多功能。在介绍每个问题时，我们将讨论每个问题突出的功能。\n\n### 使用 PySpark 预测葡萄酒风味\n\n使用 `PySpark`\
  \ 解决风味预测问题在第 3 章的“使用 PySpark 在极大数据集上训练惩罚回归模型”章节中介绍。本节将在构建模型之前添加变量归一化功能，以便可以使用系数指示变量重要性。第\
  \ 3 章该节的目的是展示 `PySpark` 代码与 `sklearn` Python 代码的简单性和相似。本节将讨论 `PySpark` 代码中的每项操作。Listing\
  \ 5-8 显示了使用归一化特征预测葡萄酒风味的代码。\n\n\n\n\n### 列表 5-8: 使用 PySpark 惩罚回归确定葡萄酒口感中的变量重要性—wine_variable_importance:spark.py\n\
  \n```python\n__author__ = 'mike_bowles'\n\n#Import sparksession \nfrom pyspark.sql\
  \ import SparkSession\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.regression\
  \ import LinearRegression\nimport matplotlib.pyplot as plt\nfrom pyspark.ml.feature\
  \ import StandardScaler\nimport pandas as pd\nfrom pandas import DataFrame\nfrom\
  \ Read_Fcns import pd_read_wine\n\nspark = SparkSession.builder.appName(\"regress_wine_data\"\
  ).getOrCreate()\n\n#将鲍鱼数据读取为 pandas dataframe 并创建 spark dataframe。\nwine_df = pd_read_wine()\n\
  \n#为葡萄酒数据创建 spark dataframe\nwine_sp_df = spark.createDataFrame(wine_df)\nprint('Column\
  \ Names for initial data frame\\n', wine_sp_df.columns, \n       '\\n\\n')\n\nvectorAssembler\
  \ = VectorAssembler(inputCols = ['fixed acidity', \\\n    'volatile acidity', 'citric\
  \ acid', 'residual sugar', 'chlorides', \\\n    'free sulfur dioxide', 'total sulfur\
  \ dioxide', 'density', 'pH', \\\n                    'sulphates', 'alcohol'], outputCol\
  \ = 'features')\nv_wine_df = vectorAssembler.transform(wine_sp_df)\n  #对特征调用 StandardScaler\n\
  scaler = StandardScaler(inputCol=\"features\", \n     outputCol=\"scaledFeatures\"\
  )\nscalerModel = scaler.fit(v_wine_df)\n\n# 将每个特征标准化为具有单位标准差。\nscaledData = scalerModel.transform(v_wine_df)\n\
  \n# scaledData 包含单个原始特征以及\n# 原始和缩放特征的向量版本\nscaledData.show()\n\nvwine_df = scaledData.select(['scaledFeatures',\
  \ 'quality'])\n\nsplits = vwine_df.randomSplit([0.66, 0.34])\nxTrain_sp = splits[0]\n\
  xTest_sp = splits[1]\n\n# alpha 列表从大到小，以及用于存储结果的空列表\nalphaList = [0.1**i for i in\
  \ [0,1, 2, 3, 4, 5, 6]]\nwt_list = []\nintercept_list = []\nrmsError = []\n\nfor\
  \ alph in alphaList:\n    wine_ridge_sp = LinearRegression(featuresCol = \"scaledFeatures\"\
  , \\\n        labelCol='quality', maxIter=100, regParam=alph, \\\n        elasticNetParam=0.0)\n\
  \    wine_ridge_sp_model = wine_ridge_sp.fit(xTrain_sp)\n    test_result = wine_ridge_sp_model.evaluate(xTest_sp)\n\
  \    \n    rmsError.append(test_result.rootMeanSquaredError)\n    coef = wine_ridge_sp_model.coefficients.toArray()\n\
  \    wt_list.append(coef)\n    intercept_list.append(wine_ridge_sp_model.intercept)\n\
  \nprint('{:18}'.format(\"RMS Error\"), \"alpha\") \nfor i in range(len(rmsError)):\n\
  \    print(rmsError[i], alphaList[i])\n\n# 根据 alpha 的系数绝对值对属性进行排序\n# 显示最佳性能（index=2）\
  \ \n\nlen_coef = len(wt_list[0])\nordered_idx = sorted(zip(range(len_coef), wt_list[2]),\
  \ key=lambda x:\n                   -abs(x[1]))\nprint('\\n\\nAttributes ordered\
  \ by coef magnitude----------')\n[print(wine_sp_df.columns) for (a,b) in ordered_idx]\n\
  \  \n# 绘制样本外误差随 alpha 变化的曲线\nx = range(len(rmsError))\nplt.plot(x, rmsError, 'k')\n\
  plt.xlabel('-log(alpha)')\nplt.ylabel('Error (RMS)')\nplt.savefig('linear_regression_w.png',\
  \ dpi=500)\nplt.show()\n```\n\nPrinted Output: \nColumn Names for initial data frame\n\
  \  ['fixed acidity', 'volatile acidity', 'citric acid', 'residual sugar',\n 'chlorides',\
  \ 'free sulfur dioxide', 'total sulfur dioxide', 'density',\n'pH', 'sulphates',\
  \ 'alcohol']\n\nColumn names for transformed data set\n[fixed acidity, volatile\
  \ acidity, citric acid, residual sugar,\n chlorides, free sulfur dioxide, total\
  \ sulfur dioxide, density,\npH, sulphates, alcohol, quality, features, scaledFeatures]\n\
  \nNote: 通过运行此书代码库中的 Ch5 代码 notebook 可以查看 dataframe 的输出。\n\nRMS Error          alpha\n\
  0.6464799847389207 1.0\n0.617894636333235 0.1\n0.6173125740389504 0.01\n0.6174096728881342\
  \ 0.001\n0.6178333051849522 0.00001\n0.6178884012227639 0.000001\n0.6178940680418457\
  \ 0.0000001\n\n\n\n\n下一步是特征归一化。这需要几个步骤。首先是实例化一个 `StandardScaler()` 函数（在代码中命名为 `scaler`）并定义输入和输出列。输入列是\
  \ `features`，即之前定义的行向量列。第二步是在 `VectorAssembler` 之后对数据集调用 `scaler.fit()`，这样就有一个 `features`\
  \ 列可以进行操作了。`fit()` 函数将 `features` 列中的每个单独特征转换成均值为 0、方差为 1。在第 2 章和代码列表 2.11 中，你已经看到归一化操作需要遍历每一列以确定其均值和标准差，然后减去均值并除以标准差。`fit()`\
  \ 函数计算均值和标准差，而 `transform()` 函数则执行减法和除法。这些操作的结果如代码列表 5-8 的输出部分。最终 `scaledData` 数据帧中的列头显示了\
  \ `features` 和 `scaledFeatures` 列。输出的内容不包含任何实际的特征值。输出由于太冗长，无法以页面格式打印。你可以通过运行书籍代码库中的\
  \ Jupyter Notebook 来生成这些输出。\n\n现在数据已经过缩放，拟合弹性网（ElasticNet）惩罚线性模型的其余过程非常直观：首先，定义训练-测试划分，然后选择惩罚参数范围。惩罚参数以\
  \ 0.1 的幂次方生成。ElasticNet 参数设置为 0.0，这相当于岭回归。在运行整个过程后，样本外 MSE（均方误差）表表明索引为 2 的惩罚参数是最佳选择。（注意，该值会根据随机训练-测试划分产生小波动。）所有系数都已存储，因此使用索引为\
  \ 2 的集合对特征进行排序，并打印结果（见图 5.11）。\n\n![图 5.11：PySpark 模型性能与正则化参数对比](img/c05f011.png)\n\
  \n图 5.11: PySpark 模型性能与正则化参数对比\n\n本示例中模型构建过程的通用流程对于你目前为止看到的 Python 示例应该很熟悉。新元素是使用\
  \ PySpark 执行这些熟悉操作的机制和语法。此处的示例实现了特征归一化，部分是因为这是你可能需要用的过程，另一部分是为了说明在 PySpark 中对数据执行一系列转换的过程是如何工作的。下一节将介绍我们的基础二分类示例：岩石与矿山的对决。\n\
  \n## 使用 PySpark 进行逻辑回归：岩石与矿山\n\n本节将介绍一个与你在上一节中看到的非常相似的过程。它将包含用于生成 `features` 列的\
  \ `VectorAssembler` 等。但会有一些不同之处。它将使用 `LogisticRegression` 包而不是 `LinearRegression`\
  \ 包。它将使用 `StringIndexer` 将岩石与矿山问题中的 `M` 和 `R` 转换为 PySpark `LogisticRegression` 所需的分类标签。最后，这里的代码将使用\
  \ PySpark Pipeline 框架来完成所需的转换序列。在上一个示例中，转换是逐个应用的，对生成的数据帧命名，然后在下一步中使用。这可能会变得有些重复。Pipeline\
  \ 框架使得过程更加整洁。\n\n前几个步骤与之前：启动 PySpark 会话，将数据读入 pandas 数据帧，将其转换为 PySpark 数据帧，并生成一个将作为特征传递给\
  \ `VectorAssembler` 的列列表。接着是 `StringIndexer`。\n\n`StringIndexer` 作用于标签列 `V60`。它将\
  \ `M` 和 `R` 转换为 0 和 1。`StringIndexer` 作用于字符串值。它确定有多少个唯一值，并为数量最多的值从 0 开始分配索引，并按照从多到少的顺序继续向下列表。在这种情况下，两个类别的人口数量相同。\n\
  \n使用 Pipeline 框架需要定义一个系列“阶段”（stages）来确定步骤的顺序。这些阶段被累积在一个列表中。列表中的第一个操作是实例化代码列表 5-9\
  \ 中名为 `label_string_idx` 的 `StringIndexer`。第二个是实例化 `VectorAssembler`，它汇聚了特征列 `V0`\
  \ 到 `V59`。\n\n接下来，创建 `Pipeline` 类的实例 `pipeline`。它按顺序应用 `fit()` 以学习字符串索引。如果包含了归一化，也将作为\
  \ `fit` 的一部分完成。拟合后的模型称为 `pipelineModel`，然后用于转换输入数据。为最终数据帧选择的列将以模式的形式打印，打印输出显示了来自字符串索引器的标签、向量化特征以及为了简便而截断的原始变量。你可以通过运行书籍代码库中的\
  \ Jupyter Notebook 获取完整列表。\n\n接下来的步骤很大程度上是自言自明的。`LogisticRegression` 中的 `maxIter`\
  \ 参数是一个新元素。逻辑回归通常通过迭代过程解决，结果随着迭代的进行而改进。每次迭代都需要遍历整个数据集。对于一个大到需要使用 PySpark 的数据集，花费的时间可能比你愿意投入的要长。因此，要小心地增加迭代次数。你可以尝试在迭代次数为\
  \ 10 时运行几次，然后将其增加一倍，看看是否能显著提高分类性能。在此过程中，请留心你的云计算计算开支。\n\n#### 代码列表 5-9: 用于岩石与矿山问题训练\
