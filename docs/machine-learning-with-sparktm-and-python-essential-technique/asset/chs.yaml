  \ 1.0, \n          'alpha': 0, \n          'silent':1}\n\ncv_results = xgb.cv(dtrain=data_dmatrix,\
  \ \n                    params=params, nfold=5,\n                    num_boost_round=200,\n\
  \                    early_stopping_rounds=100, \n                    metrics=\"\
  auc\", \n                    as_pandas=True, seed=123)\n\nprint(cv_results.head())\n\
  print(cv_results.tail())\nplt1 = cv_results['train-auc-mean']\nplt2 = cv_results['test-auc-mean']\n\
  \nplt.plot(plt1)\nplt.plot(plt2)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('AUC')\n\
  plt.title('Train and Test Performance')\nplt.savefig('rvmXGB_train_test.png', dpi=500)\n\
  plt.show()\n\n# 输出输出：\nBest AUC\n0.940052\n\ntrain-auc-mean  train-auc-std  test-auc-mean\
  \  test-auc-std\n0        0.969936       0.009852       0.839870      0.08096\n\
  1        0.996107       0.001422       0.873191      0.06129\n2        0.999883\
  \       0.000143       0.885021      0.053079\n3        0.999971       0.000058\
  \       0.895060      0.042255\n4        1.000000       0.000000       0.900222\
  \      0.049393\ntrain-auc-mean  train-auc-std  test-auc-mean  test-auc-std\n95\
  \       1.0            0.0       0.938621      0.041431\n96       1.0          \
  \  0.0       0.938641      0.042119\n97       1.0            0.0       0.939091\
  \      0.041444\n98       1.0            0.0       0.939582      0.042113\n99  \
  \     1.0            0.0       0.940052      0.042141\n```\n\n打印输出显示：\n最佳 AUC\n\
  0.940052\n\n训练-AUC 平均  训练-AUC 标准  测试-AUC 平均  测试-AUC 标准\n0        0.969936      \
  \ 0.009852       0.839870      0.08096\n1        0.996107       0.001422       0.873191\
  \      0.06129\n2        0.999883       0.000143       0.885021      0.053079\n\
  3        0.999971       0.000058       0.895060      0.042255\n4        1.000000\
  \       0.000000       0.900222      0.049393\n训练-AUC 平均  训练-AUC 标准  测试-AUC 平均 \
  \ 测试-AUC 标准\n95       1.0            0.0       0.938621      0.041431\n96      \
  \ 1.0            0.0       0.938641      0.042119\n97       1.0            0.0 \
  \      0.939091      0.041444\n98       1.0            0.0       0.939582      0.042113\n\
  99       1.0            0.0       0.940052      0.042141\n```\n\nXoost 的打印输出显示 AUC\
  \ 为 0.94。\n\n### 梯度提升分类器的性能\n\n图 7.9 显示了两条曲线。一个是训练集的 AUC，另一个是（测试集的）AUC。它们是随着集成树的数量变化的。\n\
  \n![分类模型的训练和测试性能](img/c07f009.png)\n\n分类器显示 AUC 为 0.94，这是一个不错的结果。图 7.10 绘制了变量重要性。对于分类问题，完美的性能是\
  \ 1.0。\n\n图 7.10 绘制了最重要变量的梯度提升方法。在本节中，你已经看到集成方法如何解决二分类问题。在大多数方面，用于分类和回归的集成方法是相同的。区别在于衡量误差以及如何刻画误差。\n\
  \n![水水雷模型的变量重要性](img/c07f010.png)\n\n分类和回归模型之间的许多差异源于误差衡量。下一节将展示这些方法如何用于多分类问题。\n\
  \n### 使用 Python 随机森林检测未爆炸雷\n\n下面的列表了 `RandomForestClassifier` 的构造函数及其参数。`RandomForestClassifier`\
  \ 的大多数参数与 `RandomForestRegressor` 相同。`RandomForestRegressor` 的参数在预测葡萄酒质量章节章节已经概述并讨论。本节仅突出\
  \ `RandomForestClassifier` 类中与其回归部分不同的元素。\n\n第一个区别是用于判断划分质量的准则。回想第 6 章](#c06.xhtml)，训练树的过程涉及尝试所有属性以及每个属性的所有可能的划分点，然后选择给出最佳划分的属性和划分点。对于回归树，划分的质量是基于平方和误差判断的。平方和误差不适用于分类问题。需要更类似于分类错误的方法。\n\
  \n以下是 `sklearn.ensemble.RandomForestClassifier` 的类构造函数：\n\n```python\nsklearn.ensemble.RandomForestClassifier(n_estimators=10,\
  \ criterion=\n'gini', max_depth=None, min_samples_split=2, min_samples_leaf=1,\n\
  max_features='auto', max_leaf_nodes=None, bootstrap=True, oob_score=\nFalse, n_jobs=1,\
  \ random_state=None, verbose=0, min_density=None,\ncompute_importances=None)\n```\n\
  \n以下描述了 `criterion` 参数：\n\n*   **criterion**\n\n    *string，可选（默认='gini'）*\n\n \
  \   可能的值包括：\n\n    `gini`—使用吉尼纯度度量。\n\n    `entropy`—使用基于熵的信息增。\n\n\n\n\n\n关于这两种节点纯度度量方法的更多信息，请参阅关于二叉决策树的维基百科页面：http://en.wikipedia.org/wiki/Decision_tree_learning。在实际操作中，选择哪种方法对集成性能的影响并不大。\n\
  \n分类树根据训练数据中落入每个叶子节点的不同类别百分比，自然地产生类别成员概率。根据你的应用需求，对于答案，你可能倾向于直接处理这些概率，也可能希望将落入叶子节点最多的类别值作为这些示例的预测结果。如果你将调整配合预测使用的阈值，你将需要这些概率。为了生成曲线下面积（AUC），使用概率可以在受试者工作曲线（ROC）上获得更高的精确度。如果你想计算分类错误，则需要将概率转换为特定类别的预测。\n\
  \n以下列表描述了这些方法：\n\n- `fit(X, y, sample_weight=None)`\n  随机森林分类版本的参数描述区别仅在于标签 `y`\
  \ 的性质。对于分类问题，标签是取 0 到不同类别数量减 1 的整数。对于二分类问题，标签为 0 或 1。对于具有 `nClass` 个不同类别的多分类问题，标签是从\
  \ 0 到 `nClass – 1` 的整数。\n\n- `predict(X)`\n  对于属性矩阵（二维 numpy 数组）`X`，此函数产生特定的类别预测。它产生一个与\
  \ `X` 行数相同的单列数组。每个条目都是预测的类别，无论该问题是二分类问题还是多分类问题。\n\n- `predict_proba(X)`\n  该版本的预测函数产生一个二维数组。行数与\
  \ `X` 的行数匹配。列数等于正在预测的类别数（例如，二分类问题为两列）。每行的条目是相关类别的概率。\n\n- `predict_log_proba(X)`\n\
  \  该版本的预测函数产生一个与 `predict_proba` 的二维数组。该版本显示的不是概率，而是概率的对数。\n\n### 构建随机森林模型以检测未爆炸地雷\n\
  \n[Listing 7-8] 展示了如何使用声纳构建一个用于检测未爆炸地雷的随机森林模型。数据设置和训练的整体结构应该在本章之前的其他随机森林示例以及[第 6\
  \ 章]中已经熟悉。差异源于分类问题的属性。首先，你会注意到标签是 0 和 1。这是 `RandomForestClassifier` 的输入要求。接下来的差异出现在训练后在测试集上评估性能时。对于二分类问题，你可以选择使用\
  \ ROC 曲线下面积（AUC）或分类错误。当可用时，我通常倾向于使用 AUC，因为它提供了性能的整体衡量。\n\n为了计算 AUC，使用了 `predict()`\
  \ 函数的 `predict_proba` 版本。你无法通过已经简化为特定类别的预测获得有用的 ROC 曲线。（更准确地说，你计算的 ROC 曲线上只有三个点：两个端点和中间的一个点。）sklearn\
  \ 的指标工具使得计算 AUC 变得非常简单，只需要几行代码。这些结果被累积在一个列表中，以便绘制 AUC 性能随集成中树的数量变化的图表。[Listing 7-6]\
  \ 中的代码随后绘制了 AUC 与树的数量的关系图、前 30 个重要特征的特征重要性，以及生成的最大模型的 ROC 曲线。代码的最后一部分选择了三个不同的阈值水平，并打印了每个阈值水平的混淆矩阵。阈值水平是在三个分位数边界选择的，结果显示了当阈值移动以偏向一类而非另一类时，假阳性和假阴性是如何变化的。\n\
  \n#### [Listing 7-6]: 构建随机森林模型以区分水下地雷和岩石—rocks_v_mines_rf.py\n\n\n\n\n\n```python\n\
  __author__ = 'mike_bowles'\n\nfrom math import sqrt, fabs, exp\nimport matplotlib.pyplot\
  \ as plt\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.ensemble\
  \ import RandomForestClassifier\nfrom sklearn.metrics import roc_auc_score, roc_curve\n\
  import numpy as np\n\n# 从 uci 数据仓库读取数据\nxList, labels = list_read_rvm()\n\n# x 矩阵的行数和列数\n\
  nrows = len(xList)\nncols = len(xList[1])\n\n# 将 x 和 y 转换为 numpy 数组并构造列名\nX = np.array(xList)\n\
  y = np.array(labels)\nrocksVMinesNames = np.array(['V' + str(i) for i in range(ncols)])\n\
  \n# x 矩阵的行数和列数\nnrows = len(X)\nncols = len(X[1])\n\n# 分分为训练集和测试集\nxTrain, xTest,\
  \ yTrain, yTest = train_test_split(X, y, test_size=0.30, random_state=531)\n\n###\
  \ 定义分类器\ndepth = None\nmaxFeat = 8 # 尝试调整\n\nnum_iterations = 50 # 训练额外的 10 棵树 50\
  \ 次\ntrees_per_iteration\nrocksVMinesRFModel = RandomForestClassifier(n_estimators=\n\
  trees_per_iteration,  \n                         max_depth=depth, \n           \
  \              max_features=maxFeat,\n                         oob_score=False,\
  \ \n                         random_state=531, \n                         warm_start=True)\n\
  \nauc = [] # 累计 auc 分数\n\nfor iters in range(num_iterations):\n\n    rocksVMinesRFModel.fit(xTrain,yTrain)\n\
  \    rocksVMinesRFModel.n_estimators += trees_per_iteration\n\n    # 在测试集上累加 auc\n\
  \    prediction = rocksVMinesRFModel.predict_proba(xTest)\n    aucCalc = roc_auc_score(yTest,\
  \ prediction[:,1:2])\n    auc.append(aucCalc)\n\nprint(\"AUC\" )\nprint(auc[-1])\n\
  \n\n# 绘制训练误差和测试误差随集成中树数量的变化图\nnum_trees = [i * trees_per_iteration for i in range(num_iterations)]\n\
  plt.plot(num_trees, auc)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('Area\
  \ Under ROC Curve - AUC')\nplt.title('AUC performance for Random Forest')\n#plt.ylim([0.0,\
  \ 1.1*max(mseOob)])\nplt.savefig('rvm_rf_auc_performance_v_num_trees.png', dpi=500)\n\
  plt.show()\n\n# 绘制特征重要性\nfeatureImportance = rocksVMinesRFModel.feature_importances_\n\
  \n# 按最大重要性归一化\nfeatureImportance = featureImportance / featureImportance.max()\n\
  \n# 绘制前 30 个重要性\nidxSorted = np.argsort(featureImportance)[30:60]\nidxTemp = np.argsort(featureImportance)[::-1]\n\
  print(idxTemp)\nbarPos = np.arange(idxSorted.shape[0]) + .5\nplt.barh(barPos, featureImportance[idxSorted],\
  \ align='center')\nplt.yticks(barPos, rocksVMinesNames[idxSorted])\nplt.xlabel('Variable\
  \ Importance')\nplt.title('Variable importance for Random Forest')\nplt.savefig('RVM_variable_importance_rf.png',\
  \ dpi=500)\nplt.show() \n\n# 绘制最佳版本的 ROC 曲线\nfpr, tpr, thresh = roc_curve(yTest,\
  \ list(prediction[:,1:2]))\nctClass = [i*0.01 for i in range(101)]\n\nplt.plot(fpr,\
  \ tpr, linewidth=1)\nplt.plot(ctClass, ctClass)\nplt.xlabel('False Positive Rate')\n\
  plt.ylabel('True Positive Rate')\nplt.title('AUC performance for Random Forest')\n\
  plt.savefig('rvm_rf_auc_performance_v_num_trees.png', dpi=500)\nplt.show()\n```\n\
  \n### 确定随机森林的性能\n\n图 7.11 显示了 AUC 与树的数量的关系。该模型获得了非常高的 AUC，ROC 曲线也相应地非常好。它并没有完全切入左上角，但已经非常接近。\n\
  \n图 7.12 绘制了最重要的 30 个变量的变量重要性。\n\n图 7.13 显示了随机森林实现的 ROC 曲线。\n\n## 使用 Python 集成方法解决多分类问题\n\
  \nXGBoost 和 Python sklearn 库中的梯度提升和随机森林包将同时构建二分类和多分类模型。这两类模型之间存在一些区别。区别之一是标签具有更多值。之前对梯度提升和随机森林包的讨论描述了指定标签的方法。对于具有\
  \ `nClass` 个不同类别的分类问题，标签取从 `0` 到 `nClass - 1` 的整数值。类别数量的另一个表现是各种预测方法的输出。预测类别的预测方法产生与标签相同的整数值。预测概率的方法则产生\
  \ `nClass` 个可能类别的概率。\n\n### 处理类别不平衡\n\n\n\n\n本节中的代码将使用“使用 Python 梯度提升检测未爆弹的地雷”和“构建随机森林模型检测未爆弹的地雷”章节中应用的分类器，但需要对玻璃数据进行调整。其中一个重要的区别是，玻璃数据是不平衡的。“不平衡”意味着某些类别的示例数量远多于其他类别。你将在代码列表中看到每种类型玻璃的示例数量。某些类型的示例较多（在\
  \ 70 个左右），而某些类型的玻璃代表性不足。其中一种类型特别只有 9 个示例。\n\n类别不平衡有时会导致问题，因为对代表性不足的类别进行随机采样可能会导致样本中的比例与原始数据产生巨大差异。例如，玻璃数据中某一个类别只有\
  \ 9 个示例。如果你想进行 10 折交叉验证，其中一个测试折将不包含该类的示例。为了避免这些问题，代码通过了一个名为`分层采样`（stratified sampling）的过程。在这种情况下，这意味着根据标签对数据进行分类（分层），然后对每个组别进行采样，以获取每个类别内部的训练集和测试集。然后，将特定类别的训练集组合到一个训练集中，该训练集中不同类别的比例与原始数据完全匹配。下一节中的梯度提升代码通过使用\
  \ `sklearn StratifiedKFold` 包实现了这一点。随机森林代码则展示了如何手动构建分层。\n\n### 使用梯度提升对玻璃进行分类\n\n\
  Listing 7-7 使用 XGBoost 构建用于分类玻璃的模型。这是一个多分类问题。Listing 7-7 中的代码还展示了如何从多个不同的参数组合中构建网格搜索，以寻找最佳参数值。网格搜索的基本思想是为几个参数选择某些值，然后遍历所有可能的组合以找到最佳的一个。代码使用了一个名为`grid_dict`的字典来包含正在调整的参数。每个参数名称被用作键，字典存储了每个键对应的值列表。然后，通过\
  \ `for` 循环遍历所有可能的值组合列表。代码展示了如何使用 Python 的 `itertools` 包从列表字典中形成组合列表。\n\n随着网格搜索迭代的进行，随着发现性能更好的参数组合，对应最佳性能的参数值将不断更新。随后，使用最佳参数集重新训练模型，并打印训练性能和测试性能。Listing\
