  \ 使代码排列整齐，并无需为中间步骤构新的数据框。下一节将介绍如何使用 StringIndexer 对类别特征进行编码。这与在标签上使用 StringIndexer\
  \ 有些不同。\n\n## 在 PySpark 模型中结合变量：预测鲍鱼壳\n\n本节将展示如何为鲍鱼问题构建回归模型。在鲍鱼数据上进行回归唯一的棘手部分在于\
  \ `sex` 变量有三个值，因为幼鲍鱼没有性别。只有在成熟后才会发育。因此，`sex` 变量有三个可能的值：M、`F` 和 `I`（不确定或幼体）。我们需要解决两个复杂因素。\n\
  \n之一是类别变量（`sex`）首先被索引。StringIndexer 学习到有三个值。对于标签，可以直接使用索引器的输出，但对于特征则不起作用。如果我们只是在列中放入\
  \ 0, 1, 2 表示 `M`、`F` 或 `I`，那么算法将推断出值之间存在顺序关系（`1 > 0`、`2 > 1` 等）。\n\n在列表 5-10 中，类别变量（`sex`）的每个值都被分配了自己的单独列。`M`\
  \ 列在男性示例中为 1，其他为 0。这被称为*独热编码*（one-hot encoding）。在 PySpark 中，StringIndexer 之后的 OneHotEncoder\
  \ 将执行此转换。\n\n第二个复杂因素是，经过独热编码的列应该排除在传递给回归算法的数据之外。原始变量被行向量替换。在这种情况下，行向量有两个变量，每个可能的性别各减一个，因为变量的一个一个值（例如\
  \ `M`）可以用全 0 表示。列表 5-10 遵循了以下过程：它将特征分为类别特征和数值特征。对于每个类别变量，它运行 StringIndexer 和 OneHotEncoder\
  \ 转换，然后将该过程产生的向量与数值变量一起作为向量组装过程的输入。然后，该过程就是一个熟悉的回归过程。\n\n\n\n\n\n### Listing 5.10:\
