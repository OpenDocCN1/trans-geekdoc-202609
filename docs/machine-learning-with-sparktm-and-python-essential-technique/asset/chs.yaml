  >x</mi><mn>12</mn></msub></mrow></math>` 将是 0.00（在网站上花费的金额），`![images](img/c03-i0003.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi mathvariant=\"normal\"\
  >x</mi><mn>21</mn></msub></mrow></math>` 将是 F（性别），依此类推。\n\n有时引用某个特定示例的所有属性值非常方便。为了这个目的，`![images](img/c03-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow></math>`（带有单个索引）将指的是\
  \ `X` 的第 `i` 行。对于 `Table 3.1` 中的数据集，`![images](img/c03-i0005.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mi mathvariant=\"normal\">x</mi><mn>2</mn></msub></mrow></math>`\
  \ 将是 F，32。\n\n严格来说，`X` 不是一个矩阵，因为预测器可能不都是相同类型。真正的矩阵包含所有相同类型的变量。然而，预测器有不同的类型。以预测广告点击为例，预测器可能包括访问者的人口统计数据。这些数据可能包括婚姻状况和年收入。年收入是一个实数，而婚姻状况是一个分类变量。婚姻状况不接受加法或乘法运算，且\
  \ `married` 和 `divorced` 之间不存在关系。`X` 的每一列中的项具有相同的类型，但类型可能会在列与列之间发生变化。像婚姻状况、性别之类的属性有多种称呼。它们可能被称为\
  \ `factor` 或 `categorical`。像性别或收入这样用数字表示的属性被称为 `numeric` 或 `real-`。属性之间的类型差异很重要，因为某些属性可能不是同一种类型。例如，本书涵盖的线性方法需要数值属性。你将看到的\
  \ PySpark 算法都要求所有特征都是数值的。第 4 章“惩罚化线性回归”涵盖了线性方法，展示了为了将线性方法应用于带有分类变量的问题，将分类变量转换为数值的方法。你还将学习使用\
  \ PySpark 函数将分类变量编码为数值。\n\n与 `X` 中每一行对应的目标排列在列向量 `Y` 中（参见 `Equation 3.2`），如下：\n\n\
  ![Equation 3.2: Notation for set of targets](img/c03-disp-0002.png)\n\n\n\n\n目标\
