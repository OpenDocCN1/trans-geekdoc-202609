  \      0.0995          0.0485   \n  2   F   0.540     0.465   0.135    0.6750  \
  \    0.25500.141      \n3         0.44000..6500..1500..10000..1500          0.1140\
  \   \n  4   I   0.330     0.255   0.080    0.5150      0.0895          0.0395  \
  \ \n```\n\n\n\n\n\n作为统计摘要列表的替代方案，Listing 2-11 为每个实值数据列生成了箱线图。其中第一个图如图 2.9 所示。在图\
  \ 2.9 中，统计摘要以箱线图的形式表示，它们也被称为 `box and whisker`（箱须图）。这些图显示了一个带有一条红线的小矩形。红线标记了该数据列的中位数（或第\
  \ 50 百位数）。矩形的顶部和底部分别标记了第 25 百位数和第 75 百位数。你可以通过比较打印摘要中的数字与箱线图中的水平来确认这一点。在箱体的上下，你会看到细小的水平刻线，即“须”（whiskers）。它们绘制在距离箱体上下\
  \ 1.4 倍四分位间距的范围内。四分位间距是第 75 百位数与第 25 百位数之间的差值。换句话说，箱顶与上须之间的空间是箱体高度的 1.4 倍。须的 1.4\
  \ 倍间距是可以调整的；请参见箱线图文档。你会注意到，在某些情况下，须比 1.4 倍间距更近。对于这些情况，数据值并没有延伸到计算出的须的位置。在这种情况下，须被放置在最极端的数据点上。在其他情况下，数据延伸到远超计算出的须的位置。这些点可以被视为离群值。\n\
  \n![图 2.9: 来自鲍数据集中实值属性的箱线图](img/c02f009.png)\n\n**图 2.9**: 来自鲍数据集中实值属性的箱线图\n\n图\
  \ 2.9 中的箱线图是一种比打印数据识别离群值更快、更具视觉化的方法，但环纹属性（最右侧的箱线图）的比例导致其他属性被压缩（导致难以查看）。处理这种问题的方法之一是消除较大比例的属性。其结果如图\
