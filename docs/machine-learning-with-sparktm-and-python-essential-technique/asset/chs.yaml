  \ 理解大型数据集\n\n理解大型数据集和小数据集的唯一区别在于大型数据集更大。为什么这是一个问题呢？首先，它们可能大到无法放入你的 `RAM` 中，甚至可能无法放入你的硬盘上。这时，检查数据就会变得困难。这正是\
  \ PySpark 发挥用场的地方。\n\nPySpark 基本允许你将在本章中看到的技术应用于非常大的数据集。所需的代码简单得惊人。背后有大量的活动支持其运行，但从数据科学的角度来看，它是非常直接。\n\
  \n将大型数据集导入计算集群可能会导致一些头疼的问题。有几种方法可以实现。Amazon、Google、Microsoft 和 DataBricks 等云计算供应商提供了服务，使数据更容易上传到云端并在\
  \ Spark 上运行。这一过程会因供应商而异，并随着技术的进步而变化。通常情况下，这些过程正变得越来越易用。目前描述如何上传数据超出了本书的范围，原因有两个：有许多取决于特定供应商的方法，而且它们正在发生变化。\n\
  \n在接后的示例中，你将看到一旦数据集在云端运行，如何对其进行机器学习。方法是将你在 Python 中运行的数据集，将它们转换为 PySpark 数据集，然后使用\
  \ PySpark 机器学习工具。\n\nListing 2-18 中的代码展示了如何使用 PySpark 生成你在 Listings 2-11、2-14 和\
  \ 2-16 中看到的相同统计摘要。这些计算是在整个数据集上进行的，即使数据集分布在多台计算机上。\n\n### Listing 2-18: 使用 PySpark\
  \ 汇总数据集—SparkDataFrameProperties.py\n\n\n\n\n\n```python\n__author__ = 'mike_bowles'\n\
  \nfrom Read_Fcns import pd_read_abalone\nfrom pyspark.sql import SparkSession\n\
  spark = SparkSession.builder.appName(\"explore\").getOrCreate()\n\nimport pandas\
  \ as pd\nfrom pandas import DataFrame\n\nabalone_df = pd_read_abalone()\nabalone_sp_df\
