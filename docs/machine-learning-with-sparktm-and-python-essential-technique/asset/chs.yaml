  \n# 第 7 章 用 Python 构建集成模型\n\n本章使用可用的 Python 包，根据第 6 章（c06.xhtml，“集成方法”）中的算法构建预测模型。用于说明这些算法的问题在第\
  \ 2 章（c02.xhtml，“通过理解数据理解问题”）中介绍。你已经在第 5 章（c05.xhtml，“使用惩罚方法构建预测模型”）中看到了如何使用惩罚线性回归为它们构建模型。本章使用集成方法解决相同的问题。这将让你能够根据包的易用性、集成方法与惩罚线性回归的可实现的准确率、训练时间的比较等维度对算法和可用的\
  \ Python 包进行比较。本章末尾显示了你所熟悉的算法的一些总结比较。\n\n## 使用 Python 包解决回归问题\n\n接下来的几节演示了使用可用 Python\
  \ 包构建集成模型的应用。你将看到第 6 章（c06.xhtml）中所学习的内容付诸实践。\n\n\n\n\n正如你在第 6 章中所看到的，梯度提升采用了一种误差最小化方法来构建集成树模型，而不是\
  \ Bagging 和随机森林所采用的方差消除方法。由于梯度提升将二叉树作为其基学习器，它共享了一些与树相关的参数。然而，由于梯度提升的步骤是由梯度引导的，你还会看到如步长（step\
  \ size）之类的参数。此外，梯度提升的误差最小化方法将为设置树深度提供不同的依据和选择。这里还有一个惊喜变量，允许你构建介于随机森林和梯度提升之间的混合模型。你可以使用梯度提升的误差最小化结构，同时采用随机森林的随机特征选择作为基学习器。\n\
  \n梯度提升无疑是对结构化数据集（如我们一直在探索的这类数据）进行预测最热门的算法。结构化数据集基本上是可以排列成类似 `pandas` 数据帧或 `numpy`\
  \ 数组表格的数据集。我的朋友 Kaggle 创始人兼首席执行官 Anthony Goldbloom 主过数百场机器学习竞赛。Anthony 告诉我，在结构化数据上，梯度提升赢得的次数比任何其他算法都多。最受欢迎的版本是一个名为\
  \ `XGBoost` 的包，尽管微软的 `LightGBM` 包也是一个非常有竞争力的包。这两个包都得到了良好的维护并活跃地更新。\n\nXGBoost 可以通过\
  \ `anaconda install` 安装。你可以通过搜索“anaconda install xgboost”来找到最新的 `conda install`\
  \ 指令。这使得安装变得非常简单。你同样可以找到 LightGBM 的 `conda install`。我们在这里重点关注 XGBoost。\n\n这两个包的文档质量都非常高。对于\
  \ XGBoost，只需搜索“xgboost python api”即可（XGBoost 在多种不同的语言中可用）。\n\n下一节将对 XGBoost 包进行介绍。\n\
  \n## 使用类构造函数创建 GradientBoostingRegressor\n\n要查看 XGBoost Python 版本的文档，请搜索“xgboost\
  \ python api”。查看标题为“Python API Reference（Python API 参考）”的部分。在该部分中，你会找到“Core Data\
  \ Structure（核心数据结构）”。它定义了 XGBoost 用于内存和速度优化的特殊输入数据结构。你会看到一个名为 `DMatrix()` 的函数，它接受作为\
  \ numpy 数组的特征和标签并返回所需的数据结构。下一节中的代码示例（列表 7-1）将向你展示它是如何简单。\n\n接下来是学习 API 和 scikit-learn\
  \ API 的描述，它们定义了训练函数、交叉验证训练以及类似于 scikit-learn 的回归器和分类器类。对于这些内容，你需要为各种参数提供值，以控制训练过程。你可以通过搜索你的问题来找到几乎你所遇到的任何问题的答案。\n\
  \n以下列表描述了你想要熟悉的参数和方法，并在适当的情况下对它们的选择和权衡给出一些意见。在开始学习之前，你需要了解这些内容（文档中有一份更长的列表）：\n\n\
  *   `max_depth (int)`——基学习器的最大树深度。\n*   `learning_rate (float)`——提升学习率。\n*   `n_estimators\
  \ (int)`——要拟合的树的数量。\n*   `verbosity (int)`——详细程度。有效值从 `0`（静默）到 `3`（调试）。\n*   `objective\
  \ (string` 或 `callable`)`——指定学习任务和相应的学习目标。这基本上是课程或训练过程中正在被最小化的损失函数。对于回归问题，通常的选择是\
  \ `'reg:squarederror'`；对于二分类，则是 `'binary:logistic'`。其他选择在文档的“learning parameters”部分有列出。\n\
  *   `booster (string)`——指定使用哪种提升器：`gbtree`、`gblinear` 或 `dart`。你在这里只会看到使用 `gbtree`，但我鼓励你尝试其他一些。\n\
  *   `n_jobs (int)`——用于运行 XGBoost 的并行线程数（替换了 `nthread`）。\n*   `subsample (float)`——用于逐棵树进行采样的数据比例。\n\
  \    接下来的三个参数通过为每棵树、每一层或每个节点随机选择特征子集，将集成中的树转换为随机森林树。\n*   `colsample_bytree (float)`——构建每棵树时列的采样比例。\n\
  *   `colsample_bylevel (float)`——每层列的采样比例。\n*   `colsample_bynode (float)`——每个节点分裂列的采样比例。\n\
  *   `reg_alpha (float)`——权重的 L1 正则化项。\n*   `reg_lambda (float)`——权重的 L2 正则化项。\n\
  *   `seed (int)`——随机种子。（已弃，请使用 `random_state`）。\n*   `random_state (int)`——随机种子（替换\
  \ `seed`）。\n\n使用 XGBoost 建模是通过实例化 `XGBRegressor` 或 `XGBClassifier` 并提供定义训练过程的参数值来实现的。你将在对象上调用一系列类函数。你经常看到的函数包括\
  \ `fit()`（触发训练和相关输出）、`predict()`（使用训练好的模型生成预测）以及 `feature_importances()`（提供特征重要性估计）。这些足够让你开始了。\n\
  \n对于新用户来说，设置梯度提升参数可能会有些困惑。以下列表建议了梯度提升的设置和调整顺序：\n\n1.  从默认设置开始，设置 `subsample=0.5`。训练模型并观察样本外（OOS）性能与集成中树的数量之间的曲线。在第一次和后续运行后，观察\
  \ OOS 性能曲线的形状。\n2.  如果 OOS 性能在图的右侧快速提高，请增加 `n_estimators` 或增加 `learning_rate`。\n\
  3.  如果 OOS 性能在图的右侧快速恶化，请减少 `learning_rate`。\n4.  一旦 OOS 性能在整个长度上提高（或仅略有恶化）并在图的右侧变平，尝试更改\
  \ `max_depth` 和 `max_features`。\n\n## 使用 GradientBoostingRegressor 实现回归模型\n\n列表\
