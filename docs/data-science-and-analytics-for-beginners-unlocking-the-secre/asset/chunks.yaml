    在描述性统计中，除了集中趋势的度量（如平均数、中位数、众数）之外，还包括变异或离散程度的度量，例如 `variance` 和 `standard deviation`。`Variance`
    表示数据点与均值的平均平方偏差，用于衡量数据的离散程度。`Standard deviation` 是 `variance` 的平方根，提供了更易理解的离散度量，表明数据点与均值的平均距离。`variance`
    和 `standard deviation` 共同提供了关于数据集内部变异程度的重要信息，帮助评估数据的稳定性和一致性。


    描述性统计在总结和描述数据集的主要特征方面发挥着关键作用，能够提供关于数据的集中趋势、离散程度和分布的有价值洞察。通过查看 `mean`、`median`、`mode`、`variance`
    和 `standard deviation` 等度量，分析人员可以全面了解数据的底层模式和特征，从而在商业、经济、医疗和社会科学等多个领域为决策和进一步分析提供依据。


    推断统计：推断统计通过样本数据对总体进行推断或预测。常用的技术包括 `hypothesis testing`、`confidence intervals`
    和 `regression analysis`，这些方法用于从数据中得出关于总体关系和趋势的结论。


    推断统计在数据分析中扮演重要角色，能够让研究者基于样本数据对总体做出推断或预测。与描述性统计不同，描述性统计仅用于总结和描述数据集的主要特征，而推断统计则通过得出结论和预测来拓展到更广泛的总体或现象。


    推断统计中的关键技术之一是 `hypothesis testing`，它通过在组间或变量间进行统计比较，判断是否存在显著差异或关系。`Hypothesis
    testing` 遵循结构化流程，首先提出 `null hypothesis`（H0）和 `alternative hypothesis`（Ha），随后收集数据并进行统计检验，最后依据观测结果和选定的显著性水平（α）决定是否拒绝或不拒绝原假设。


    另一种常用的推断统计技术是 `confidence intervals`，它们提供了一个在特定置信水平下，总体参数可能落在其中的数值范围。`Confidence
    intervals` 基于样本统计量（如均值或比例）以及估计误差的标准误计算而得。通过估计样本估计量周围的不确定性，置信区间帮助研究者评估结果的精确度和可靠性，从而作出关于总体参数的明智决策。


    `Regression analysis` 是推断统计中的另一强大工具，用于探索变量之间的关系并预测未来结果。`Regression models` 量化因变量与一个或多个自变量之间的关系强度和方向，帮助研究者识别显著预测因子并评估解释性因素对感兴趣结果的影响。`Regression
    analysis` 包含多种技术，如 `simple linear regression`（简单线性回归）、`multiple regression`（多元回归）、`logistic
    regression`（逻辑回归）和 `time series analysis`（时间序列分析），每种适用于不同类型的数据和研究问题。


    推断统计为研究者提供了将样本结果推广到更大总体、预测未来结果以及检验数据中关系和趋势的工具和技术。通过运用 `hypothesis testing`、`confidence
    intervals` 和 `regression analysis` 等方法，研究者能够得出有意义的结论，做出基于证据的决策，并在各自领域推动知识和理解的进步。


    概率论：概率论是统计学的数学基础，提供了量化不确定性和随机性的框架。`normal distribution`（正态分布）和 `binomial distribution`（二项分布）等概率分布用于建模数据分析和推断统计中的不同结果的可能性。


    概率论是统计学的数学支撑，为数据分析和决策提供了严谨的不确定性和随机性量化框架。其核心在于研究随机事件及其发生概率，使研究者能够建模和分析现实现象中固有的变异性。


    概率论中的一个基本概念是概率分布，它描述了不同结果或事件出现的可能性。概率分布通过参数来刻画其形状、中心趋势和离散程度，使研究者能够对各种数据类型进行建模和分析。在统计学中，两种常用的概率分布是
    `normal distribution` 和 `binomial distribution`。


    `normal distribution`，也称为高斯分布或钟形曲线，是一种连续概率分布，呈对称单峰的钟形曲线。由于其在自然和社会现象中的普遍性，它常用于建模连续变量，如身高、体重、IQ
    分数和考试成绩。`normal distribution` 由两个参数决定：均值（μ），代表数据的中心趋势或平均值；标准差（σ），表示数据围绕均值的离散程度。


    `binomial distribution` 是一种离散概率分布，用于建模固定数量独立伯努利试验中的成功次数，每次试验只有“成功”或“失败”两种可能结果，且成功概率（p）保持不变。它常用于二元数据和计数数据的建模，如硬币投掷、调查回答和医学试验。`binomial
    distribution` 由两个参数决定：试验次数（n）和成功概率（p）。


    概率分布在数据分析和推断统计中起着关键作用，为量化不确定性、进行预测和基于观测数据得出结论提供了数学框架。通过理解并应用概率论和概率分布，研究者能够做出明智的决策、评估风险，并从数据中获取有意义的洞察，推动科学、工程、经济等多个领域的发展。


    抽样方法：抽样方法是用于从较大总体中选取子集（样本）进行分析的技术。`Random sampling`（随机抽样）、`stratified sampling`（分层抽样）和
    `cluster sampling`（集群抽样）是常见的抽样方法，用于确保样本的代表性和有效性。


    抽样方法是研究中选取样本的重要技术，目标是获取能够准确反映总体特征的子集，从而使研究者能够对总体作出有效的推断和结论。


    '
