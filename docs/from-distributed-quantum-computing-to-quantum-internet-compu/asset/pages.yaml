- pgno: 32
  md: 'The qubit state can be represented by a linear combination of two basis states
    |0⟩ and |1⟩,¹ written as follows:


    ```

    \alpha |0\rangle + \beta |1\rangle

    ```


    with probability amplitudes \(\alpha, \beta \in \mathbb{C}\), where \(\mathbb{C}\)
    is the set of complex numbers,² and \(|\alpha|^2 + |\beta|^2 = 1\), that is, one
    can think of the state of the quantum system as a probability distribution over
    the possible outcomes of measurement done on the system (more on measurement later).


    Each basis state can be thought of as a two-dimensional column vector, i.e. the
    symbols |0⟩ and |1⟩ denote vectors as follows:


    ```

    |0\rangle = \begin{bmatrix} 1 \\ 0 \end{bmatrix} \quad \text{and} \quad |1\rangle
    = \begin{bmatrix} 0 \\ 1 \end{bmatrix}

    ```


    A qubit state is, hence, represented via a vector in two-dimensional vector space
    spanned by the basis states. We say that the qubit is in a *superposition* of
    two states |0⟩ and |1⟩. One can think of the qubit state as representing information
    encoded in the probability amplitudes.


    One can “measure” the state of a qubit, and in doing so, the qubit state changes
    to a state depending on what basis is used for the measurement. Typically, a qubit
    is measured in what is known as the *Z basis* or the *computational basis*, in
    which case, the qubit state changes to either |0⟩ or |1⟩, or more specifically,
    when measured, the qubit state becomes the state |0⟩ with probability \(|\alpha|^2\),
    or |1⟩ with probability \(|\beta|^2\) (which, for simplicity, we briefly say as
    being due to the “rules of quantum mechanics”).


