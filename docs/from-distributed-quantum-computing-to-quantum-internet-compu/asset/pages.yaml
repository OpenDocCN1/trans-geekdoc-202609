    Note that timing is a factor since quantum states can *decohere* over time. As
    mentioned in Vardoyan et al. [2022], a quantum state (represented by density operator
    $\rho_0$) placed into quantum memory at time $t = 0$ might be subjected to noise
    (e.g. noise in the environment due to imperfect shielding) so that after time
    $t$, the state might be $\rho_t$. There could also be noise due to imperfect quantum
    gate implementations. There are a number of different mathematical models of noise,
    in the form of *completely positive trace preserving* (CPTP) maps, one of which
    is the following map $D_t$:


    $$\rho_t = D_t(\rho) = (1 - 3p)\rho + pX\rho X + pY\rho Y + pZ\rho Z = (1 - 4p)\rho
    + 4p \frac{\mathbf{I}}{2}$$


    where $p$ is a probability and using the fact that $\frac{1}{2}(\rho + X\rho X
    + Z\rho Z + XZ\rho(XZ)^\dagger) = \frac{1}{2}\mathbf{I}$ and $Y = iXZ$ (which
    we will show in Chapter 5). But the idea of this map is that if $p$ is high, then
    the quantum state can approach the *maximally mixed state* $\frac{\mathbf{I}}{2}$.
    The time dependency of $p$ can be expressed by setting $p = \frac{1}{4}(1 - e^{-\frac{t}{T}})$,
    for some constant $T$, where it can be seen that $p$ increases over time. There
    are other noise models such as the dephasing and damping noise models which we
    will not go into here. This means that suppose it takes too long to receive certain
    required bits or even to get an entangled state, then the quantum state might
    have already decohered while waiting! This also means that the depth of the circuits
    to be executed can affect the chance of completion of the operations. Another
    important parameter is entanglement fidelity, where the “quality” of the entanglement
    might be affected by noise (we talk further about fidelity in Chapter 6).


    Architectures for distributed quantum computers is still a research area. A point
    to note is that, on each node, there would be qubits used for computations and
    qubits used for entanglement (with other nodes), so called *computation qubits*,'
