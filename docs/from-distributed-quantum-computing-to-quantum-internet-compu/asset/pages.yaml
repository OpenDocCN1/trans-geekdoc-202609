  md: '# # 5 Delegating Quantum Computations


    This chapter discusses the idea of a client, with limited resources, delegating
    quantum computations to a more powerful quantum computer or server, in the style
    of what we see with cloud computing today. However, security and privacy are key
    considerations when delegating computations. We look at how to delegate quantum
    computations to a quantum server in such a way as to protect the privacy of the
    client''s inputs, that is, the server cannot know the client''s inputs while still
    being able to perform the computations for the client. The chapter also looks
    at how the client can verify the server''s computations, or at least detect if
    the server really performed the delegated computations correctly. Finally, the
    chapter looks briefly at the idea of quantum computing as a service (QaaS).


    # ## 5.1 Delegating Private Quantum Computations


    This section considers the idea of private computations or data that the client
    wants hidden from the server but still wanting the server to help it perform those
    computations. This might seem to be impossible, but has been possible in the classical
    case with a technique such as homomorphic encryption,¹ where data can be computed
    with while still in the encrypted form.


    We consider the techniques mainly by Broadbent [2015] and Fisher et al. [2014],
    though acknowledge the pioneering work of Childs [2005], in computing over encrypted
    quantum data.


    We first introduce the idea of the classical one-time pad and the quantum one-time
    pad. The classical one-time pad is a procedure for encrypting a bit string x =
    x1 ... xn by mapping each bit xi to xi ⊕ ri for some random key bit-string r =
    r1 ... rn ∈ {0, 1}n. Since each xi ⊕ ri is uniformly random given that r is secret,
    x is concealed. Analogous to the classical one-time pad is the quantum


    1 See https://homomorphicencryption.org/introduction [last accessed: 14/11/2022].'
