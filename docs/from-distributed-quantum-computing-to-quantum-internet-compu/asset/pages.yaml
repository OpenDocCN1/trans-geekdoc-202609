    = \frac{1}{\sqrt{n}}\sum_{l=0}^{n-1}(-1)^{a_l+b_l}\left( \frac{1}{\sqrt{2}} \right)^l
    (|0\rangle + (-1)^{i_1} |1\rangle) \otimes \cdots \otimes (|0\rangle + (-1)^{i_l}
    |1\rangle)

    = \frac{1}{n} \sum_{l=0}^{n-1}(-1)^{a_l+b_l} \sum_{j \in \{0,1\}^l} (-1)^{i \cdot
    j} |j\rangle

    (since \(\left( \frac{1}{\sqrt{2}} \right)^l = \frac{1}{\sqrt{n}}\) and \(i \cdot
    j = i_1 \times j_1 \oplus \cdots \oplus i_l \times j_l\))


    We note that if \(a = b\), then the amplitude of \(| 0 \dots 0 \rangle\) is \(\frac{1}{n}
    \sum_{i=0}^{n-1} (-1)^{a_i+b_i} = 1\), i.e. if \(a = b\), the probability of getting
    \(| 0 \dots 0 \rangle\) is 1. But if \(a\) and \(b\) differs in exactly \(n/2\)
    positions, then the amplitude \(\frac{1}{n} \sum_{i=0}^{n-1} (-1)^{a_i+b_i} =
    0\) (sum of an equal number of “1”s and “-1”s), and there is zero probability
    of getting the state \(| 0 \dots 0 \rangle\).


    +   3. \(A\) outputs 1 (i.e. we have case (1) \(a = b\)) if the measurement gave
    the state \(| 0 \dots 0 \rangle\) or outputs 0 otherwise (i.e. we have case (2)
    \(a\) and \(b\) differ in exactly \(n/2\) positions).


    Hence, \(A\) is able to solve the promise problem with only \(\log_2 n\) qubits
    sent from \(B\)! (As two classical bits (and one shared ebit) are required for
    teleporting each qubit, we would have \(2(\log_2 n)\) or \(O(\log n)\) classical
    bits required.) It was noted in Buhrman et al. [2010] that classical protocols
    need to send at least \(0.007n\) bits! So, for small \(n\), the classical protocols
    might be more efficient, but for larger \(n\), the communication complexity for
    the classical protocols will be exponentially higher (but noting that the quantum
    protocol needs to use qubits).


    # 3.1.1.3 The Distributed Intersection Problem


    Let us consider another problem from Buhrman et al. [2010]. Suppose we have \(A\)
    and \(B\), and \(A\) has an \(n\)-bit string \(a = a_1 \dots a_n\) and \(B\) has
    an \(n\)-bit string \(b = b_1 \dots b_n\). The problem is to compute the following
    function \(g\):


    \(g(a, b) = \begin{cases} 1, & \text{if } a_i = b_i = 1 \text{ for at least one
    } i \\ 0, & \text{otherwise} \end{cases}\)'
