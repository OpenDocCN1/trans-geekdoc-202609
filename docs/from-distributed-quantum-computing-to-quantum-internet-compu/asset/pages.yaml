    # 6.2.2 Twirling Map


    We will also need to use the following concept called a _twirling map_. We define
    a twirling map \(\tau : D(\mathbb{C}^2 \otimes \mathbb{C}^2) \rightarrow D(\mathbb{C}^2
    \otimes \mathbb{C}^2)\), where \(D(\mathbb{C}^2 \otimes \mathbb{C}^2)\) refers
    to the set of two qubit state operators, that maps any bipartite density operator
    \(\rho_{AB}\) to a _Bell diagonal_ state, of the following form:


    \(p_1 | \Phi^+ \rangle \langle \Phi^+ | + p_2 | \Phi^- \rangle \langle \Phi^-
    | + p_3 | \Psi^+ \rangle \langle \Psi^+ | + p_4 | \Psi^- \rangle \langle \Psi^-
    |\)


    where \(\sum_{i=1}^4 p_i = 1\). It has the property of being a completely positive
    trace-preserving (CPTP) map.$^8$


    The twirling map picks a Pauli operator uniformly at random (with equal probability)
    and applies it to each qubit in \(\rho_{AB}\); we write it in the form:


    \(\tau(\rho_{AB}) = \frac{1}{4} \sum_l (E_i \otimes E_l)\rho_{AB}(E_i \otimes
    E_l)^\dagger\)


    where \(E_i \in \{I, X, Y, Z\}\), i.e. the \(E_i\) are the Pauli operators (e.g.
    \(E_0 = I, E_1 = X, E_2 = Y, \text{and } E_3 = Z\)).


    To see how the twirling map works, we write a state \(| \psi \rangle\) in terms
    of the Bell basis:


    \(| \psi \rangle = \alpha_1 | \Phi^+ \rangle + \alpha_2 | \Phi^- \rangle + \alpha_3
    | \Psi^+ \rangle + \alpha_4 | \Psi^- \rangle\)


    8 For more on a CPTP map, see Artur Ekert and Tim Hosgood''s book online: https://qubit.guide/9.9-completely-positive-trace-preserving-maps
    [last accessed: 1/10/2023].'
