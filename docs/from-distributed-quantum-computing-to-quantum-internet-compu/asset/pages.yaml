    # 2.2.5 Universal Quantum Computer and Gate Sets


    By composing gates in a quantum circuit, complex manipulations can be performed
    on qubits. The gates composed can be drawn from a small finite set, and with the
    right set of gates, any unitary operation can be approximated (to arbitrary accuracy)
    by composing gates (drawn from the set) together in a quantum circuit.


    The Solovay-Kitaev theorem states that, given a distance \(\epsilon\) (using a
    distance measure representing the difference between two operations, which we
    will not go into detail here), one can approximate any given unitary operation
    on \(n\) qubits using \(O(n^2 4^n \log^c(n^{2^4} / \epsilon))\) gates [Nielsen
    and Chuang, 2000]. This is analogous to how a small set of logic gates (e.g. {AND,
    OR, NOT}) can be considered universal in'
