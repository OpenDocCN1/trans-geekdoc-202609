    a string of $r$ secret bits between each pair, for $r$ rounds.


    As shown in Huang et al. [2022] and based on Broadbent and Tapp [2007], ingenious
    variations and extensions of the ideas lead to other interesting protocols such
    as veto, where if one or more users can veto a proposal in such a way that all
    those who vetoed have their identities hidden, notification, where a user can
    notify one or more other users with the identities of the notifier and recipients
    (and number of recipients) remaining hidden, collision detection, where more than
    one speaker in an anonymous broadcast protocol can be detected, and anonymous
    private message transmission, where a sender can anonymously transmit an $m$-bit
    message to a receiver (receiver does not know who the sender is).


    Another quantum anonymous transmission protocol is by Christandl and Wehner [2005]
    using generalized GHZ states as follows.


    +   1. All $n$-party share the $n$-qubit state $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes
    n} + |1\rangle^{\otimes n})$.


    +   2. The speaker applies a phase flip $Z$ gate to its qubit (i.e. to its part
    of the shared state) if $c = 1$ (i.e. it wants to broadcast a 1 anonymously) and
    does nothing otherwise.


    +   3. Each party (including the speaker) does the following:

    +   (i) applies the Hadamard transform $H$ to its qubit,

    +   (ii) measures its qubit in the computational basis,

    +   (iii) broadcasts its measurement result,

    +   (iv) receives the announced measurement outcomes from everyone and counts
    the total number of 1s (call this number $k$), and

    +   (v) if $k$ is odd, it concludes $c = 1$, otherwise it concludes $c = 0$


    +   4. The protocol aborts if one or more players do not use the broadcast channel.


    The anonymity in this protocol is due to the fact that in the $n$-qubit state
    $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} + |1\rangle^{\otimes n})$ shared among
    $n$ parties, if any one party applies the $Z$ gate to its qubit, the state obtained
    is $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} - |1\rangle^{\otimes n})$. And there
    is no way that one can trace back, just from this state, who applied the $Z$ to
    a qubit. Note that we want $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} + |1\rangle^{\otimes
    n})$ when $c = 0$ and $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} - |1\rangle^{\otimes
    n})$ when $c = 1$, i.e. we want: $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} + (-1)^c|1\rangle^{\otimes
    n})$. Also, step 3 in the protocol is necessary to determine if there was really
