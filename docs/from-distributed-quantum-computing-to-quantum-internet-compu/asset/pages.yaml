    # 1.4 Outline of this Book


    The rest of this book is organized as follows.


    Chapter 2 discusses the mathematical and quantum computing background required
    for the rest of the book, including a brief introduction to quantum computing
    and related concepts, including qubit and qubit states, measurement, quantum gates
    and circuits, entanglement, and teleportation.


    Chapter 3 discusses a selection of distributed quantum computing problems and
    quantum protocols, many which have their origins in classical distributed computing.
    The chapter first discusses the distributed three-party product problem, the distributed
    Deutsch–Jozsa promise problem, and the distributed intersection problem, demonstrating
    how, for some problems, quantum information can enable fewer bits of communication
    to be used for a solution. We also look at how certain distributed computation
    problems can be solved with quantum information, but not possible classically.
    The second part of the chapter discusses quantum protocols, including quantum
    coin flipping, quantum leader election, QKD, quantum anonymous broadcasting, quantum
    voting, quantum Byzantine Generals, quantum secret sharing, and quantum oblivious
    transfer.


    Chapter 4 discusses non-local gates, or quantum gates, for computations over several
    nodes. The chapter discusses the distributed CNOT gate, different ways for its
    implementation, and distributed control of gates beyond the CNOT gate. The chapter
    also briefly reviews work on distributed quantum circuits, distributed quantum
    computing algorithms using such non-local gates, and control and management for
    distributed quantum computers.


    Chapter 5 discusses the idea of a client, with limited resources, delegating quantum
    computations to a more powerful quantum computer or server, in the style of what
    we see with cloud computing today. However, security and privacy are'
  merge: -1
