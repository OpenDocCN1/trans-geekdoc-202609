  md: 'entangled links (unlike the quantum teleportation protocol which, we recall
    from Chapter 2, requires one EPR pair and transmitting two classical bits).


    The method is as follows. Recall that the information in a qubit \(\alpha |0\rangle
    + \beta |1\rangle\) are in the amplitudes \(\alpha\) and \(\beta\). Instead of
    encoding this information in one photon which is transmitted, one can encode this
    information in a “cluster of photons” (in a particular tree-cluster state), which
    is more robust against transmission losses. For example, consider the 7-qubit
    tree-cluster state as follows:


    ```

    \(| \tau \rangle = \frac{1}{2\sqrt{2}} |0\rangle_s \otimes (|0\rangle |+++\rangle
    + |1\rangle |---\rangle) \otimes (|0\rangle |+++\rangle + |1\rangle |---\rangle)\)

    \(+ \frac{1}{2\sqrt{2}} |1\rangle_s \otimes (|0\rangle |+++\rangle - |1\rangle
    |---\rangle) \otimes (|0\rangle |+++\rangle - |1\rangle |---\rangle)\)

    ```


    where the subscript s denotes a stationary qubit, and the rest will be qubits
    to be transmitted.\(^4\)


    The method is to then do a Bell measurement with the stationary qubit s and the
    qubit to be transmitted (i.e. the message qubit m) in the following state \((\alpha
    |0\rangle + \beta |1\rangle)_m \otimes | \tau \rangle\), which effectively “transfers
    the quantum information from the message qubit to the tree-cluster state,” that
    is, we have:


    ```

    \((H \otimes I^{\otimes 7}) CNOT_{ms} (\alpha |0\rangle + \beta |1\rangle)_m \otimes
    | \tau \rangle\)

    \(= (H \otimes I^{\otimes 7}) CNOT_{ms} (\alpha |0\rangle + \beta |1\rangle)_m\)

    \(\otimes \left( \frac{1}{2\sqrt{2}} |0\rangle_s \otimes (|0\rangle |+++\rangle
    + |1\rangle |---\rangle) \otimes (|0\rangle |+++\rangle + |1\rangle |---\rangle)
    \right.\)

    \(\left. + \frac{1}{2\sqrt{2}} |1\rangle_s \otimes (|0\rangle |+++\rangle - |1\rangle
    |---\rangle) \otimes (|0\rangle |+++\rangle - |1\rangle |---\rangle) \right)\)

    ```


    4 It is called a tree-cluster state as one can view the 7-qubits as a tree with
    the first qubit being the root (s), and then the second and fifth qubits (called
    first-level qubits) being the child of the (s 1 and s 2), and the third and fourth
    qubits (called second-level qubits) being children of the second qubit (s.1.1,
    s.1.2), and the last two qubits (also called second-level qubits) as children
    of the fifth qubit (s.2.1, s.2.2):


    ```

    \(| \tau \rangle = \frac{1}{2\sqrt{2}} |0\rangle_s \otimes (|0\rangle_{s1} |++\rangle_{s.1.1,s.1.2}
    + |1\rangle_{s1} |--\rangle_{s.1.1,s.1.2})\)

    \(\otimes (|0\rangle_{s2} |++\rangle_{s.2.1,s.2.2} + |1\rangle_{s2} |--\rangle_{s.2.1,s.2.2})\)

    \(+ \frac{1}{2\sqrt{2}} |1\rangle_s \otimes (|0\rangle_{s1} |++\rangle_{s.1.1,s.1.2}
    - |1\rangle_{s1} |--\rangle_{s.1.1,s.1.2})\)

    \(\otimes (|0\rangle_{s2} |++\rangle_{s.2.1,s.2.2} - |1\rangle_{s2} |--\rangle_{s.2.1,s.2.2})\)

    ```'
