    +   - 000 (i.e. $l_{Aj} = 0, l_{Bj} = 0$, and $l_{Cj} = 0$),

    +   - 111 (i.e. $l_{Aj} = 1, l_{Bj} = 1$, and $l_{Cj} = 1$), or

    +   - 201 (i.e. $l_{Aj} = 2, l_{Bj} = 0$, and $l_{Cj} = 1$) or 210 (i.e. $l_{Aj}
    = 2, l_{Bj} = 1$, and $l_{Cj} = 0$), with equal probability.


    So, though each list is private, one party can know something about the other
    lists via the above correlations. For example, if at position $j$ in A''s list
    is such that $l_{Aj} = 2$, then $A$ knows that at position $j$ in B''s and C''s
    lists, either $l_{Bj} = 0$ and $l_{Cj} = 1$'
