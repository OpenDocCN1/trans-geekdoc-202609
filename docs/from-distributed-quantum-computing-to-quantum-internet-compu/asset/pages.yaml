    to decrypt the result. The circuit to implement this protocol is shown in Figure
    5.1.


    The client, say $A$, chooses randomly and uniformly \(a, b \in \{0, 1\}\) to encrypt
    the state \(|\psi\rangle\) as \(X^a Z^b |\psi\rangle\). $A$ sends \(X^a Z^b |\psi\rangle\)
    to the server, i.e. $B$. In addition, $A$ chooses randomly and uniformly \(y,
    d \in \{0, 1\}\), computes \(x = a \oplus y\), and sends $x$ and the quantum state
    \(Z^d P^y |+\rangle\) to the server $B$. This is a way to get the server to perform
    the $P$ operation in a way controlled by the client, without revealing any information
    to the server about $a$ (remember we mentioned above that when $a=1$, we need
    to apply an additional $P$ and this circuit makes the server does so - to see
    this, when $a=0, x = a \oplus y = y$, and looking at the gates along the quantum
