  md: 'that one can construct any digital circuit (i.e. implementing any Boolean function
    of a particular number of bits) just by using gates from that set (of course,
    using the same gate multiple times is allowed). The NAND gate on its own is universal.
    There could be different possible universal gate sets.


    One such universal gate set for quantum computations comprises the Hadamard, phase,
    CNOT, and \(\pi/8\) gates; we will look at the phase and \(\pi/8\) gates later
    in the book. With such a universal gate set, in principle, if one can implement
    each gate in the gate set with some hardware, and execute quantum circuits involving
    gates from that gate set, one then has a universal quantum computer. It is interesting
    to note that any two-qubit (generic) gate is adequate for universal quantum computation,
    i.e. we simply keep using this generic gate between potentially different pairs
    of qubits.\(^17\) There are many possible universal gate sets.\(^18\)


    # 2.3 Entanglement


    We referred to the notion of entanglement previously, and also saw the state \(\alpha|00\rangle
    + \beta|11\rangle\). Consider the popular *entangled* state, denoted by \(|\Phi^+\rangle\),
    which is a *Bell state* (or a *Bell pair*) (named after John Bell we mentioned
    in Chapter 1): \(|\Phi^+\rangle = \frac{1}{\sqrt{2}}|00\rangle + \frac{1}{\sqrt{2}}|11\rangle\).
    When the two qubits are in the above state, we say that the two qubits have been
    entangled, and has the following sense. Suppose two photons interacted so that
    their joint state is represented by the above superposition. We can write this
    superposition with subscripts for the two qubits \(A\) and \(B\) as follows: \(|\Phi^+\rangle_{AB}
    = \frac{1}{\sqrt{2}}|0\rangle_A|0\rangle_B + \frac{1}{\sqrt{2}}|1\rangle_A|1\rangle_B\).
    Then, suppose the two photons fly very far apart, and say, are now billions of
    light years apart. Then, when \(A\) is measured, note that the two-qubit state
    changes to either \(|0\rangle_A|0\rangle_B\) with probability \((1/\sqrt{2})^2
    = 1/2\) or to \(|1\rangle_A|1\rangle_B\) with probability 1/2. In other words,
    when measured, the states of the two qubits are either both \(|0\rangle\) or both
    \(|1\rangle\), i.e. they are correlated even though they would not have been able
    to communicate in time (with respect to the time of observed measurements, being
    so far apart).\(^19\)


    17 For definition of “generic” gate and more details on universal quantum gate
    sets, see Preskill’s Caltech notes at http://theory.caltech.edu/~preskill/ph229/notes/chap6.pdf
    [last accessed: 26/10/2022]

    18 A discussion on universal gate sets and some basic gate sets are at: https://quantumcomputing.stackexchange.com/questions/17115/basic-gates-sets/17126
    [last accessed: 27/2/2023]

    19 We mentioned this in Chapter 1 as what Einstein spoke about as “spooky action
    at a distance” as the measurement of one seems to have “acted” on the other even
    over vast distances, but thinking about this, alternatively, it seems that the
    two qubits, even though far apart, are behaving like “one entity” with shared
    state \(|1\rangle_A|1\rangle_B\) or \(|0\rangle_A|0\rangle_B\) upon measurement,
    which relates to the idea of *non-locality* in quantum physics, since the “two
    parts” are so far apart yet can be correlated.'
