    # ## 3.1.2.3 Discussion


    We can see from the above that there is something remarkable with entanglement
    that allows certain "no communication" problems to be solved that classically
    cannot be solved, by allowing certain correlated bits to be shared. In fact, the
    CHSH problem can be used as a test of genuine entanglement – if \(A\) and \(B\)
    can share genuine entangled pairs of qubits, then they should be able to solve
    the CHSH problem with higher probability than 0.75! In a way, entanglement seems
    to have made up (at least in part) for the "no communication" constraint between
    \(A\) and \(B\).


