  md: 'Analogous to logic gates such as NOT, AND, OR, and NAND gates in digital logic
    design that operate on bits, operations on qubits have been identified as quantum
    gates. We present the gates in this section via their matrix representations,
    without looking at how they might be physically realized. Just as logic gates
    can be composed to form logic circuits, we will see how quantum gates can be composed
    to form quantum circuits; we also introduce symbols we will use for different
    quantum gates in quantum circuits.


    # 2.2.1 Single Qubit Gates


    We have seen the operation we called H which has been called the Hadamard gate.10
    We consider other gates, focusing on those used in this book below.


    The quantum NOT gate X can be represented as follows:


    ```

    X = \begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}

    ```


    which has the following effect on a quantum state α |0⟩ + β |1⟩:


    ```

    X(α |0⟩ + β |1⟩) = α(X|0⟩) + β(X|1⟩) = α |1⟩ + β |0⟩

    ```


    since X |0⟩ = |1⟩ and X |1⟩ = |0⟩ which can be verified via matrix multiplication.


    The quantum gate Z can be represented as follows:


    ```

    Z = \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}

    ```


    which has the following effect on a quantum state α |0⟩ + β |1⟩:


    ```

    Z(α |0⟩ + β |1⟩) = α(Z|0⟩) + β(Z|1⟩) = α |0⟩ − β |1⟩

    ```


    since Z |0⟩ = |0⟩ and Z |1⟩ = − |1⟩ which can be verified via matrix multiplication.


    The quantum gate Y can be represented as follows:


    ```

    Y = \begin{bmatrix} 0 & -i \\ i & 0 \end{bmatrix}

    ```


    which has the following effect on a quantum state α |0⟩ + β |1⟩:


    ```

    Y(α |0⟩ + β |1⟩) = α(Y|0⟩) + β(Y|1⟩) = αi |1⟩ − βi |0⟩

    ```


    since Y |0⟩ = i |1⟩ and Y |1⟩ = −i |0⟩ which can be verified via matrix multiplication.


    Note that the X, Y, and Z matrices are famously called the Pauli matrices, named
    after the physicist Wolfgang Pauli.'
