  md: 'Hence, without any communication, but with the shared 3-qubit entangled state,
    we can solve the GHZ&M problem. We will see that there this problem cannot be
    solved in the classical case, without communication.


    In the classical case, without any shared entangled state, each party can set
    its strategy beforehand to output either 0 or 1 when the input is 0, and to output
    0 or 1 when the input is 1. Let us say A has the following strategy A0 and A1,
    representing A’s output when the input is 0 and 1, respectively. Similarly for
    B and C, i.e. B0 and B1 and C0 and C1, respectively. Then, the condition on the
    outputs can be equivalently represented by this set of simultaneous equations:


    $A_0 \oplus B_0 \oplus C_0 = 0; \quad A_0 \oplus B_1 \oplus C_1 = 1; \quad A_1
    \oplus B_0 \oplus C_1 = 1;\nA_1 \oplus B_1 \oplus C_0 = 1$


    Can these equations be satisfied simultaneously? No! We can see this by summing
    (modulo 2) the LHS (left hand side) of the four equations, we get 0, and summing
    (modulo 2) the RHS of the four equations, we get 1, and 0 ≠ 1! This means that
    there is no set of strategies that the parties can set to satisfy the condition
    on the outputs.


    Suppose $i_A i_B i_C$ can take any of the combinations in {000, 011, 101, 110}
    with equal probability. What is the best probability of success in the classical
    case? Note that any three of the above four equations can be satisfied simultaneously,
    that is, there is a strategy for each of A, B, C, which when adopted will satisfy
    three of the four cases. For example, suppose we choose the first three equations
    – we can solve these three simultaneously to get a strategy for A, B, and C, which
    is one satisfying:


    $(A_0 \oplus B_0 \oplus C_0) \oplus (A_0 \oplus B_1 \oplus C_1) \oplus (A_1 \oplus
    B_0 \oplus C_1) = A_1 \oplus B_1 \oplus C_0 = 0$


    Suppose we set $A_1 = B_1 = C_0 = 0$ satisfying the above equation, and using
    these values and the first equation, set $A_0 = B_0 = 0$ and then using the values
    we have and the second equation set $C_1 = 1$; we then have a strategy for A,
    B, and C satisfying the first three equations and will work whenever the input
    is one of {000, 011, 101}, that is, since each combination can appear with equal
    probability, this strategy will work three times out of four, or with probability
    3/4. The same argument goes when any three of the four equations are selected,
    instead of the first three. For any three of the four equations selected, we will
    have a strategy for A, B, and C, and this strategy will have success probability
    3/4, and there are only four ways to choose three out of four equations (“C3),
    and so, there are four possible strategies to choose from. One can have the three
    parties randomly select any one of the four strategies before receiving the inputs,
    so that the probability of success is 1/4 · 3/4 + 1/4 · 3/4 + 1/4 · 3/4 + 1/4
    · 3/4 = 3/4, where the product 1/4 · 3/4 is from the probability of choosing a
    strategy (1/4) and the probability of winning with that chosen strategy (3/4),
    and summing over four possible strategies. Hence, it is not possible to have a
    success probability better than 3/4.'
