    # 2.2.3 Multiple Qubit Gates


    Just like we have logic gates that take more than one operand, we have quantum
    gates that can take multiple qubits as input. One example is the controlled-NOT
    (or CNOT) gate which takes two qubits, one called a control qubit and another
    called a target qubit, and depending on the state of the control qubit, determines
    whether to apply an X gate to the target qubit. It does the following mapping,
    where reading from left to right, the first qubit is the control qubit and the
    second qubit is the target qubit: |00⟩ → |00⟩, |01⟩ → |01⟩, |10⟩ → |11⟩, |11⟩
    → |10⟩, or in general: |c⟩|t⟩ → CNOT |c⟩|t ⊕ c⟩, where “⊕” denotes the exclusive
    OR operator (or addition modulo 2). The symbol for a CNOT gate is given in Figure
    2.5. More generally, we can also have a controlled-U gate of the form: |c⟩|t⟩
    → controlled-U |c⟩ U|t⟩. The CNOT gate is basically a controlled-X gate. The symbol
    for a controlled-U gate is given in Figure 2.5.


