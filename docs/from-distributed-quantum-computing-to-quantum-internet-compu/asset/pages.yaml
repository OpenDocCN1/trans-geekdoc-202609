    classical control information (or a classical program) will need to be loaded
    at nodes A and B (separate programs on A and on B)³ and executed with a mix of
    local operations and synchronization where there is required entanglement or transfer
    of bits. Note that an entangled pair between nodes A and B is required to be acquired
    from the quantum Internet as shown in the figure. This would require some classical
    communication and synchronization between the nodes so that subsequent local operations
    with the entangled qubits (e.g. the CNOT at node A and the X gate at node B, etc.)
    can be executed at the right time, i.e. only after the entangled pair has been
    acquired. Subsequent transfer of measurement results (classical bits) can be done
    via the (classical) Internet as the needed by the operations – synchronization
    here is for a node to wait for the bits from the other node before proceeding.
    (Note that a quantum circuit might be executed a number of times to collect statistics
    – not quite necessary for the simple distributed CNOT example here.) Second, the
    status of execution and, where required, results are returned from the nodes to
    the controller. One can generalize the above to more than two nodes and more complicated
    circuits, but the key point here is the access to the quantum Internet and classical
    Internet at different points of the circuit, with the required synchronization
    among nodes. Moreover, a large circuit (with a large depth) might be executed
    in stages (not shown in Figure 4.7), i.e. a part of the quantum circuit executed
    and then back to classical control, and then the next part of the quantum circuit
    executed and back to classical control, and so on, that is, greater interleaving
    between classical control using classical computer(s) and quantum execution on
    the quantum computer(s).


    A more detailed discussion of required control and scheduling of programs in distributed
    quantum computations is in Parekh et al. [2021]. A reference model for distributed
    quantum computation called D-NISQ is presented in Acampora et al. [2023], where
    a large problem might be decomposed into subproblems to be solved on multiple
