  md: 'also called the circuit depth.23 A compiler could be written to optimize a
    quantum circuit, i.e. generate a quantum circuit of lower depth that performs
    the equivalent operations. A circuit similar to and generalizing the one in Figure
    2.13 can be used to generate the n-qubit cat-like state: $|CAT_n\rangle = \alpha|0\rangle^{\otimes
    n} + \beta|1\rangle^{\otimes n}$.


    The GHZ state involves more than two qubits and so is a *multipartite entanglement*,
    e.g. where the entangled state is shared by multiple qubits, one qubit on each
    node. Interestingly, it has been observed experimentally as early as 1998 [Bouwmeester
    et al., 1999]. It is also noted in Illiano et al. [2022] that an EPR pair between
    the two so-called winning nodes can be “extracted” from a (generalized) GHZ state
    shared among multiple nodes via measurements at the *losing nodes* (i.e. the rest
    of the nodes which are not the winning nodes). For example, suppose we have a
    GHZ state, with three qubits, one on each node. Then, suppose we first apply H
    and then do a measurement on the third qubit (the losing node), i.e. we apply
    the following operation:


    $(I \otimes I \otimes H) |GHZ\rangle$

    $= (I \otimes I \otimes H)(\frac{1}{\sqrt{2}} |000\rangle + \frac{1}{\sqrt{2}}
    |111\rangle)$

    $= \frac{1}{\sqrt{2}} |00\rangle H |0\rangle + \frac{1}{\sqrt{2}} |11\rangle H
    |1\rangle$

    $= \frac{1}{\sqrt{2}} |00\rangle (\frac{1}{\sqrt{2}} |0\rangle + \frac{1}{\sqrt{2}}
    |1\rangle) + \frac{1}{\sqrt{2}} |11\rangle (\frac{1}{\sqrt{2}} |0\rangle - \frac{1}{\sqrt{2}}
    |1\rangle)$

    $= \frac{1}{\sqrt{2}}(|00\rangle + |11\rangle) \otimes \frac{1}{\sqrt{2}} |0\rangle
    + \frac{1}{\sqrt{2}}(|00\rangle - |11\rangle) \otimes \frac{1}{\sqrt{2}} |1\rangle$

    $= |\Phi^+\rangle \otimes \frac{1}{\sqrt{2}} |0\rangle + |\Phi^-\rangle \otimes
    \frac{1}{\sqrt{2}} |1\rangle$


    and then when we measure the third qubit, we get either (i) the resulting state
    $|0\rangle$ in which case the first two nodes are left with the shared entangled
    EPR pair $|\Phi^+\rangle$ or (ii) the resulting state $|1\rangle$ in which case
    the first two nodes are left with the shared entangled EPR pair $|\Phi^-\rangle$,
    i.e. either way, two nodes are left with an EPR pair. Note that measuring the
    third qubit is a local operation on the third node containing the qubit, and classical
    communication might be used to inform the first two nodes that measurement has
    been done and so that the winning nodes now share an EPR pair (perhaps informing
    them which Bell state they now share).'
