    # 3.2.8 Quantum Oblivious Transfer (OT)


    OT is the problem of allowing data transfer or answering of queries in such a
    way that certain secrecy or privacy properties are preserved. More specifically,
    suppose we have two parties, A and B, and A has a database with two items d₀ and
    d₁ (each of which are n-bit strings, say) and (i) B would like to retrieve one
    of the two items but does not want A to know which one it retrieved, preserving
    its privacy and (ii) A can be assured that B does not get both items. The particular
    case with A having two items is called 1-2 OT. A trivial solution for (i) is for
    A to just send all (or both) its items (or its whole database) to B, but this
    would not satisfy (ii).'
