  md: 'One can imagine this as useful for computing a meeting time, where the bits
    of $a$ and $b$ represent slots when $A$ and $B$ are available (“0” for not available
    and “1” for available) and trying to find at least one slot where both are available.


    This problem is equivalent to finding indices $i$ such that $a_i \wedge b_i =
    1$. For example, if $a = 10111$ and $b = 11101$, then $a_i \wedge b_i = 1$ when
    $i$ is 0, 2 and 4. Hence, given two $n$-bit strings $a$ and $b$, this becomes
    a search problem, that of finding indices $i \in \{1, ..., n\}$ satisfying the
    criteria $a_i \wedge b_i = 1$ (we could also use indices $0$ to $n-1$).


    We can use Grover’s (quantum) algorithm [Grover, 1996] to perform this search,
    which allows us to search for such a solution (asymptotically) faster than the
    best classical algorithm. Grover’s algorithm uses a function $f : \{0, ..., n-1\}
    \to \{0, 1\}$ such that $f(x) = 1$ if and only if $x$ points to the item that
    satisfies the search criterion – we can think of $x$ as an index into a database
    of items – let us just call $f$ a database. Suppose $x''$ is an item such that
    $f(x'') = 1$, we assume we have a quantum operation $V_{x''}$ that can use $f$
    defined as follows$^2$:


    $V_{x''} |x\rangle = \begin{cases} -|x\rangle, & \text{if } x = x'', \text{i.e.
    } f(x) = 1 \\ |x\rangle, & \text{if } x \neq x'', \text{i.e. } f(x) = 0 \end{cases}$


    that is, $V_{x''}$ can be written as $V_{x''} |x\rangle = (-1)^{f(x)} |x\rangle$.
    The idea of the operation is to “mark” a “$-1$” the item that satisfies the particular
    search criterion. In Grover’s algorithm, there is a unitary operation called the
    _Grover iterate_ defined as $G = H^{\otimes l} V_0 H^{\otimes l} V_{x''}$, assuming
    $n = 2^l$. The Grover iterate is repeatedly applied, first to a state $|s\rangle$
    as below, and then repeatedly to the resulting state:


    +   1. from the $l$-qubit state $|0\rangle^{\otimes l}$, prepare the state $|s\rangle$,
    e.g. via $|s\rangle = H^{\otimes l} |0\rangle^{\otimes l} = \frac{1}{\sqrt{n}}
    \sum_{i=0}^{n-1} |i\rangle$

    +   2. apply the Grover iterate $G$, $t$ times to the state

    +   3. measure all the qubits in the resulting state in the computational basis


    At the end of the above, one can check if the result obtained (the string of bits
    obtained from (3)) is indeed a solution to the problem. Grover’s algorithm can
    return $|x''\rangle$ with probability approaching $1$ using $O(\sqrt{n})$ applications
    of $V_{x''}$, in particular when $t = \lceil \frac{\pi}{4}(\sqrt{n}) \rceil$.
    If there are multiple solutions, say $m$ solutions, then $t = \lceil \frac{\pi}{4}(\sqrt{n/m})
    \rceil$. (Note that if after running $\lceil \frac{\pi}{4}(\sqrt{n}) \rceil$ iterations
    and the result obtained is not a solution, likely, there was likely no solution
    to start with!)


    We will look at how the intersection problem can be an application of Grover’s
    algorithm. If $a$ and $b$ are on the same machine, we can define $f$ such that
    $f(x) = 1$ if and only if $a_x \wedge b_x = 1$, i.e. $f(x) = a_x \wedge b_x$.
    Then, the operation $V_{a,b}$ that depends on $a$ and $b$ then becomes:


    $V_{a,b} |x\rangle = (-1)^{a_x \wedge b_x} |x\rangle$'
