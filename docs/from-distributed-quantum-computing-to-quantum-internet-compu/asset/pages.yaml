    # 2.2.2.1 Measurement Postulate (General Measurement)


    More generally, a postulate in quantum theory is that quantum measurements can
    be represented by a set of measurement operators {M_m}, each acting on the states
    of the quantum system being measured, and the index m refers to a measurement
    outcome that may occur with respect to operator M_m, and that the probability
    of outcome m is given by


    p(m) = ⟨ψ| M_m^† M_m |ψ⟩


    and the state after measurement is given by


    \frac{M_m |\psi\rangle}{\sqrt{\langle \psi | M_m^\dagger M_m | \psi \rangle}}
    = \frac{M_m |\psi\rangle}{\sqrt{p(m)}}


    and the operators satisfy the following completeness condition: ∑_m M_m^† M_m
    = I.


    Coming back to our example, after M_0, we have the state:


    \frac{M_0 |\psi\rangle}{\sqrt{\langle \psi | M_0^\dagger M_0 | \psi \rangle}}
    = \frac{M_0(\alpha |0\rangle + \beta |1\rangle)}{\sqrt{|\alpha|^2}} = \frac{\alpha
    |0\rangle}{|\alpha|}


    and after M_1, we would have the state: \frac{\beta|1\rangle}{|\beta|}. Since
    |\frac{\alpha}{|\alpha|}| = |\frac{\beta}{|\beta|}| = 1, we may ignore the multipliers,
    obtaining the state |0⟩ or |1⟩ as we saw earlier.


    # 2.2.2.2 POVM


    Note that if we define a set of positive operators {E_m} say by E_m = M_m^† M_m,
    these operators are called POVM (Positive Operator-Valued Measure) elements and
    {E_m} is called a POVM.'
