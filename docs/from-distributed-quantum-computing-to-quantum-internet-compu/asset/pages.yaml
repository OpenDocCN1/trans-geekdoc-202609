  md: 'For error correction, there is also a step called *information reconciliation*
    which after the error rate has been determined, via the testing, $A$ and $B$ proceed
    to correcting the errors, as elaborated on in Wolf [2021]. A protocol to ensure
    that both parties have the same bit string, i.e. to perform “error key reconciliation”
    (called Cascade) using parity values on blocks of bit strings is described in
    Mehic et al. [2022].


    We next consider the QKD protocol by Artur Ekert called the E91 protocol [Ekert,
    1991] that uses entangled states (Bell states) shared among the two communicating
    parties to generate a shared key between them. The protocol proceeds as follows
    to generate an $n$-bit key shared by the two parties $A$ and $B$.


    +   1. A third party is a source of $n$ entangled pairs of qubits, each in the
    state: $\frac{1}{\sqrt{2}}(|00\rangle + |11\rangle)$. Each of the $n$ two-qubit
    states is then shared by the two parties by the third party sending one qubit
    of each pair to each party. (We can also use other states such as the singlet
    state as originally done in Ekert [1991] to a similar effect.)


    +   2. On receiving the qubits, for each qubit received, $A$ randomly chooses
    one basis from among three possibilities, denoted by $\mathbf{a}_1, \mathbf{a}_2$,
    and $\mathbf{a}_3$:


    +   $\bullet \mathbf{a}_1$: A basis based on observable $Z$, i.e. a measurement
    with outcome either $+1$ corresponding to $Z$’s eigenvector $|0\rangle$ or $-1$
    corresponding to the other eigenvector $|1\rangle$ of $Z$,


    +   $\bullet \mathbf{a}_2$: A basis based on observable $(X + Z)/\sqrt{2} = H$,
    with outcome $+1$ corresponding to $H$’s eigenvector $|\mathbf{x}\rangle = \cos(\frac{\pi}{8})|0\rangle
    + \sin(\frac{\pi}{8})|1\rangle$ or $-1$ corresponding to the other eigenvector
    $|\boldsymbol{-}\rangle = -\sin(\frac{\pi}{8})|0\rangle + \cos(\frac{\pi}{8})|1\rangle$)
    of $H$,$^{13}$ and


    computes their XOR value. But, in contrast to error correction, she does not announce
    this XOR value. She only announces which bits she chose (e.g. bits number 103
    and 537). Alice and Bob then replace the two bits by their XOR value. In this
    way, they shortened their key while keeping it error free, but if Eve has only
    partial information on the two bits, her information on the XOR value is even
    less. Assume, for example, that Eve knows only the value of the first bit and
    nothing about the second one. Then she has no information at all about the XOR
    value. Also, if Eve knows the value of both bits with 60% probability, then the
    probability that she correctly guesses the XOR value is only $0.6^2 + 0.4^2 =
    52\%$. This process would have to be repeated several times; more efficient algorithms
    use larger blocks ... [Gisin et al., 2002, Section C4 in Arxiv version, https://arxiv.org/pdf/quant-ph/0101098.pdf,
    accessed: 22/11/2022]


    Roughly, the resulting key using this way of privacy amplification might be of
    length $(n/4)/2 = n/8$.


    $^{13}$ One can check that these are the eigenvectors of $H$ via trigonometric
    identities (e.g. see https://sciencenotes.org/trig-identities-study-sheet) and
    noting that $\cos(\frac{\pi}{4}) = \frac{1}{\sqrt{2}}$.'
