  md: 'The state of a quantum system (of one or more qubits) \(|\psi\rangle\) can
    also be represented by a matrix of the form \(|\psi\rangle\langle\psi|\). In general,
    suppose there is uncertainty about which state the quantum system is in, then
    the state of the quantum system can be given by a set of probabilities over the
    possible states, i.e. a probability \(p_i\) for each possible state \(|\psi_i\rangle\),
    called an ensemble of pure states \(\{p_i, |\psi_i\rangle\}\), which can be represented
    via a density operator or density matrix \(\rho\) of the form:


    \(\rho = \sum_i p_i |\psi_i\rangle\langle\psi_i|\)


    where \(\sum_i p_i = 1\). The density operator has a number of properties useful
    in calculations – for example, the trace of \(\rho\), \(tr(\rho) = 1\).


    When we have a composite system comprising multiple qubits, we can obtain descriptions
    of the subsystems (some subset of the qubits) of the system using the notion of
    the reduced density operator. For example, let \(A\) and \(B\) be two physical
    systems, constituting a composite system, whose state is described by the density
    operator \(\rho_{AB}\). Then, to describe subsystem \(A\) within the composite
    system, the reduced density operator is as follows:


    \(\rho_A = tr_B(\rho_{AB})\)


    where the partial trace over system \(B\) operator, denoted by, \(tr_B\) is given
    by


    \(tr_B(|a_1\rangle\langle a_2| \otimes |b_1\rangle\langle b_2|) = |a_1\rangle\langle
    a_2| tr(|b_1\rangle\langle b_2|) = |a_1\rangle\langle a_2| \langle b_2|b_1\rangle\)


    for vectors \(|a_1\rangle, |a_2\rangle, |b_1\rangle\), and \(|b_2\rangle\), and
    where \(tr\) is the trace operator for matrices.\(^8\) Similarly, we can have
    an operator \(\rho_B = tr_A(\rho_{AB})\) to describe the subsystem \(B\).


    # 2.2 Quantum Gates and Quantum Circuits


    We have seen how qubits can be operated on, in the case of a photon and paths
    using optical devices for operations. Of course, for other physical realizations
    of the qubit,\(^9\) the operations will done differently, which we will not go
