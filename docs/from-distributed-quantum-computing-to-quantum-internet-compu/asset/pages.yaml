    can decrypt the final results returned by the server.


    In a test run, verifications can be carried out (e.g. for each $R$ gate as in
    Figure 5.3), and the client can abort when some verification fails. Also, the
    server can be instructed to measure the outcome and return to the client the result;
    for example, the client can check that the result should correspond to $|0\rangle^{\otimes
    n}$ in a $X$-test run (given that an identity operation should have been carried
    out), to detect if the server has behaved. Wrong results after a number of test
    runs or failed verifications might help the client conclude there is something
    wrong or unusual about the server, but if the server consistently showed correct
    results in test runs, it can then gain the client''s trust. However, the approach
    is probabilistic; unluckily for the client, the server might happen to just behave
    during test runs and misbehave during computation runs!


