  md: '(since noise can build up with depth – in fact, the noise in the output can
    grow exponentially with the depth of the circuit).


    Consider a function $f$ of the form $f : {0, 1}^n \rightarrow {0, 1}^m$ for \(m
    \le n - 1\). This function can be equivalently specified as two functions \(f_{even/odd}
    : {0, 1}^{n-1} \rightarrow {0, 1}^m\) defined as follows:


    \(f_{even}(y) = f_{even}(y_1 \cdots y_{n-1}) = f(0y_1 \cdots y_{n-1}) = f(0y)\),
    and

    \(f_{odd}(y) = f_{odd}(y_1 \cdots y_{n-1}) = f(1y_1 \cdots y_{n-1}) = f(1y)\)


    where \(y \in {0, 1}^{n-1}\). So, to compute \(f\) on some \(n\)-bit string, first
    look at the first bit, which will then determine which of \(f_{even}\) or \(f_{odd}\)
    to use on the rest of the bits.


    Useful for Grover and Deutsch-Jozsa algorithms (and perhaps others) would be a
    quantum circuit that can compute with \(n\)-qubits, denoted with \(|x\rangle\)
    where \(x \in {0, 1}^n\): \(U_f |x\rangle = (-1)^{f(x)} |x\rangle\). But assuming
    we have \((n - 1)\)-qubit circuits for computing the following: \(U_{f_{even}}
    |y\rangle = (-1)^{f_{even}(y)} |y\rangle\) and \(U_{f_{odd}} |y\rangle = (-1)^{f_{odd}(y)}
    |y\rangle\), where \(y \in {0, 1}^{n-1}\), one can see that:


    \(U_f |0\rangle \otimes |y\rangle = (-1)^{f(0y)} |0\rangle \otimes |y\rangle =
    |0\rangle \otimes (-1)^{f_{even}(y)} |y\rangle = |0\rangle \otimes U_{f_{even}}
    |y\rangle\)

    and: \(U_f |1\rangle \otimes |y\rangle = (-1)^{f(1y)} |1\rangle \otimes |y\rangle
    = |1\rangle \otimes (-1)^{f_{odd}(y)} |y\rangle = |1\rangle \otimes U_{f_{odd}}
    |y\rangle\)


    that is, we can compute \(U_f\) with the help of \(U_{f_{odd}}\) and \(U_{f_{even}}\),
    and though we use more qubits doing so, because the two circuits for \(U_{f_{odd}}\)
    and \(U_{f_{even}}\) can be much lower in depth than \(U_f\), we can effectively
    get the results with reduced noise. This can perhaps be generalized to more “nodes”
    with a similar decomposition of \(U_{f_{odd}}\) and \(U_{f_{even}}\) into their
    corresponding “even” and “odd” functions and continuing recursively.


    # 4.6 Summary


    We have looked at some of the fundamental ideas in implementing distributed quantum
    computations. Distributed quantum computing continues to be an active area of
    research and involves many different aspects including hardware architectures
    for quantum computers that can work with other quantum computers over a network,
    methods to partition a large quantum circuit to be computed efficiently over a
    collection of quantum nodes, control, and scheduling mechanisms that are sufficiently
    efficient, and programming models and abstractions. There are now libraries such
    as QMPI conceived to help programmers, tested at least in simulations. The future
    could see more sophisticated libraries, e.g. implementing some of the quantum
    protocols we saw in Chapter 3. Also, clearly, research into quantum architectures
    and ways to store and use qubits more reliably (e.g. able to last for longer times)
    would be beneficial.'
