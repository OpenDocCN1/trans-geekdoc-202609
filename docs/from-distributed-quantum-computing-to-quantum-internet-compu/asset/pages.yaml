  md: 'generally, the secret bits shared between pairs of parties are effectively
    pairwise shared secret keys which can be obtained via a protocol such as QKD.


    Based on the presentation in Huang et al. [2022], we can now provide a protocol
    for anonymous broadcasting, which generalizes the solution protocol above for
    the Dining cryptographers problem for n parties. Let us assume they are organized
    in a ring as shown in Figure 3.9 – we then generalize this to a fully connected
    graph. Suppose one party (call this the speaker) wants to broadcast one bit of
    information to the rest of the n - 1 parties without revealing its identity, the
    protocol is as follows.


    For each round:


    +   1. If the speaker (say party indexed by s) wishes to broadcast a value c =
    0, then the speaker simply sets ps = bs ⊕ b(s+1) mod n as the value to announce;
    if the speaker wishes to broadcast a value c = 1, then the speaker flips the value
    of one of bs or b(s+1) mod n. Let us say the speaker flips bs. Then the speaker
    sets ps = bs ⊕ b(s+1) mod n as the value to announce; all the others (for i ≠
    s) are non-speakers and just set pi = bi ⊕ b(i+1) mod n as the value to announce.


    +   2. Each party announces (via some classical broadcast channel, not anonymous)
    its pi value to everyone else, and then since each party has everyone’s pi values,
    each can compute the overall parity value: p = p1 ⊕ ... ⊕ pn.


    Then, note that if c = 0, that is, the speaker is broadcasting 0, then


    ```

    p = p1 ⊕ ... ⊕ pn

    = (b1 ⊕ b2) ⊕ (b2 ⊕ b3) ⊕ ... ⊕ (bn-2 ⊕ bn-1) ⊕ (bn-1 ⊕ bn) ⊕ (bn ⊕ b1)

    = (b1 ⊕ b1) ⊕ (b2 ⊕ b2) ⊕ ... ⊕ (bn ⊕ bn) = 0

    ```


    since each bit bi occurs exactly twice in the expression. But if c = 1, that is,
    the speaker is broadcasting 1, then


    ```

    p = p1 ⊕ ... ⊕ ps-1 ⊕ ps ⊕ ... ⊕ pn

    = (b1 ⊕ b2) ⊕ ... ⊕ (bs-1 ⊕ bs) ⊕ (bs ⊕ bs+1) ⊕ ... ⊕ (bn ⊕ b1)

    = (b1 ⊕ b1) ⊕ (b2 ⊕ b2) ⊕ ... ⊕ (bs ⊕ bs) ⊕ ... ⊕ (bn ⊕ bn) = 1

    ```


    Since p is computed by everyone, everyone receives the bit broadcasted by the
    speaker, but no one knows who the speaker is, since each bi has probability of
    1/2 of being 0 or 1. Note that the quantum network here is used only to create
    the pairwise secret bits.


    A simple extension of the above can be used for a (general) graph (rather than
    just the ring topology) where secret bits are shared among all pairs of users,
    as shown in Figure 3.10.'
