  md: 'To see the effect of the CNOT gates, consider several examples. Consider the
    first term:


    ```

    (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2})|\Psi^-\rangle_{A_1,B_1}|\Psi^-\rangle_{A_2,B_2}

    = (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2}) \frac{1}{2}(|0101\rangle_{A_1 B_1 A_2
    B_2} - |0110\rangle_{A_1 B_1 A_2 B_2}

    - |1001\rangle_{A_1 B_1 A_2 B_2} + |1010\rangle_{A_1 B_1 A_2 B_2})

    = \frac{1}{2}(|0100\rangle_{A_1 B_1 A_2 B_2} - |0111\rangle_{A_1 B_1 A_2 B_2}
    - |1011\rangle_{A_1 B_1 A_2 B_2} + |1000\rangle_{A_1 B_1 A_2 B_2})

    = |\Psi^+\rangle_{A_1 B_1}|\Phi^-\rangle_{A_2 B_2}

    ```


    Consider the second term:


    ```

    (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2})|\Psi^-\rangle_{A_1,B_1}|\Psi^+\rangle_{A_2,B_2}

    = (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2}) \frac{1}{2}(|0101\rangle_{A_1 B_1 A_2
    B_2} + |0110\rangle_{A_1 B_1 A_2 B_2}

    - |1001\rangle_{A_1 B_1 A_2 B_2} - |1010\rangle_{A_1 B_1 A_2 B_2})

    = \frac{1}{2}(|0100\rangle_{A_1 B_1 A_2 B_2} + |0111\rangle_{A_1 B_1 A_2 B_2}
    - |1011\rangle_{A_1 B_1 A_2 B_2} - |1000\rangle_{A_1 B_1 A_2 B_2})

    = |\Psi^-\rangle_{A_1 B_1}|\Phi^+\rangle_{A_2 B_2}

    ```


    Consider the third term:


    ```

    (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2})|\Psi^-\rangle_{A_1,B_1}|\Phi^+\rangle_{A_2,B_2}

    = (CNOT_{A_1,A_2} \otimes CNOT_{B_1,B_2}) \frac{1}{2}(|0100\rangle_{A_1 B_1 A_2
    B_2} + |0111\rangle_{A_1 B_1 A_2 B_2}

    - |1000\rangle_{A_1 B_1 A_2 B_2} - |1011\rangle_{A_1 B_1 A_2 B_2})

    = \frac{1}{2}(|0101\rangle_{A_1 B_1 A_2 B_2} + |0110\rangle_{A_1 B_1 A_2 B_2}
    - |1010\rangle_{A_1 B_1 A_2 B_2} - |1001\rangle_{A_1 B_1 A_2 B_2})

    = |\Psi^-\rangle_{A_1 B_1}|\Psi^+\rangle_{A_2 B_2}

    ```


    In other words, we can see that the effect of applying the CNOT gates is to map
    from a composition of two Bell states to another composition of two Bell states.


    We only saw calculations for three examples, but we can consider all the possible
    terms and tabulate the probabilities after step 3, as in Bennett [1996], the first
    four columns with entries showing only the symbol for the Bell states, as shown
    in the table below. We then do a measurement in Pauli Z on the target qubits (A_2
    B_2) and keep only the source (control) qubits (A_1 B_1) for when both measurement
    results of the target qubits are equal, i.e. only the cases where (A_2 B_2) is
    either the |\Phi^+\rangle state or the |\Phi^-\rangle state; the probability of
    each such case is highlighted in the table (the probabilities of the other cases
    are “discarded”).'
