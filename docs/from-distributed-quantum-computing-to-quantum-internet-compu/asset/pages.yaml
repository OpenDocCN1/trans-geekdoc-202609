    # 3.2.9 Discussion


    We have looked at a number of quantum protocols among multiple parties. Many of
    the protocols have a cryptographic nature and discussed extensively in quantum
    cryptography, but we outlined some of them as they would be useful in distributed
    computing settings. These are also rather “classical” protocols and there have
    been many new developments since. But it is hoped that this collection provides
    an overview of a range of quantum protocols and a taste for the highly technical
    reasoning involved.


    # 3.3 Summary


    In general, entanglement is not a replacement for communication. But we have seen
    that, if classical communication is disallowed, entanglement can enable certain
    distributed computations not possible without entanglement, and that, if classical
    communication is allowed, then, with entanglement, fewer classical bits of communication
    would be required to perform certain distributed computations. But the reduction
    in communication complexity is not always the case, i.e. not for any distributed
    computation.19 We have also looked at many interesting quantum protocols, with
    analogs in the classical distributed computing setting. There are other more advanced
    protocols for the problems we have seen and some protocols which we did not consider,
    such as quantum multiparty computation. We saw that the sharing of entangled states
    is a key idea in many of these protocols. Deeper analysis of the protocols is
    also given in the original cited papers, which we did not provide in this chapter.


