    1 \rangle = \alpha |+\rangle + \beta |-\rangle = \frac{\alpha+\beta}{\sqrt{2}}
    |0\rangle + \frac{\alpha-\beta}{\sqrt{2}} |1\rangle$


    and then, do measurements with respect to the computational basis. Note that now
