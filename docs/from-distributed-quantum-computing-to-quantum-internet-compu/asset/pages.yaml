    # 3.2.7 Quantum Secret Sharing


    We consider the problem of sharing a secret among multiple parties so that each
    party has part of the secret and cannot use the part to obtain the full secret,
    and the secret can only be put together by combining the parts from multiple (if
    not all) parties. More generally, one can consider a secret sharing scheme called
    the $(k, n)$-threshold scheme as follows: a secret is divided into $n$ shares
    such that any $k \le n$ of those shares can be used to assemble the secret, but
    any $k - 1$ shares would not provide any information about the secret.


    In the classical case, consider three parties $A$, $B$, and $C$. $A$ wants to
    share a secret $s$, an $n$-bit string, shared among $B$ and $C$ so that only when
    $B$ and $C$ get together can the secret be reconstructed. One way to do this is
    for $A$ to take the secret $s$ and an $n$-bit random string $r$ and compute $s''
    = s \oplus r$ (where “$\oplus$” here denotes the bitwise addition modulo 2). $A$
