  md: 'When we apply the H gate to \(\alpha |0\rangle + \beta |1\rangle\), we have


    \(H (\alpha |0\rangle + \beta |1\rangle) = \alpha (H |0\rangle) + \beta (H |1\rangle)
    = \frac{\alpha + \beta}{\sqrt{2}} |0\rangle + \frac{\alpha - \beta}{\sqrt{2}}
    |1\rangle\)


    since \(H |0\rangle = \frac{1}{\sqrt{2}} |0\rangle + \frac{1}{\sqrt{2}} |1\rangle\)
    and \(H |1\rangle = \frac{1}{\sqrt{2}} |0\rangle - \frac{1}{\sqrt{2}} |1\rangle\),
    which can be verified via matrix multiplication. Note that \(|\frac{\alpha+\beta}{\sqrt{2}}|^2
    + |\frac{\alpha-\beta}{\sqrt{2}}|^2 = 1\), since \(|\alpha|^2 + |\beta|^2 = 1\).


    We will introduce other gates, e.g. what we call the \(R\) gate and \(P\) gate,
    later in the book as needed. In general, a single qubit quantum gate \(U\) is
    typically represented as a \(2 \times 2\) matrix with complex numbers as entries
    and is *unitary*, that is, its inverse is the same as its conjugate transpose:
    \(U^{-1} = U^\dagger\) or \(UU^{-1} = U^\dagger U = I\), where \(U^\dagger\) denotes
    the *conjugate transpose* (or *Hermitian transpose*) of \(U\), which is formed
    by transposing \(U\) and taking the complex conjugate of all its entries, i.e.
    \(U^\dagger = \overline{U^T}\). For unitary \(U\), we have \(UU^\dagger = U^\dagger
    U = I\), where \(I\) denotes the identity matrix. Also, a square matrix is *Hermitian*
    if it is its own conjugate transpose, i.e. \(U = U^\dagger\). Note that the gates
    we have seen \(X\), \(Z\), \(Y\), and \(H\) are all Hermitian and unitary, i.e.
    \(XX = ZZ = YY = HH = I\) and are their own inverses.


    It is also noted that for a unitary matrix, its action on a state vector \(\mathbf{s}
    = \alpha |0\rangle + \beta |1\rangle = \binom{\alpha}{\beta}\) preserves the norm,
    that is, \(||U\mathbf{s}|| = ||\mathbf{s}||\), where \(||.||\) denotes the norm
    of a vector, i.e. for a vector \(\mathbf{x}\), \(||\mathbf{x}|| = \sqrt{\langle
    \mathbf{x}, \mathbf{x} \rangle} = \sqrt{\mathbf{x}^\dagger \mathbf{x}}\), where
    \(\langle ., . \rangle\) denotes the inner product. Hence, unitary operators help
    to preserve the property that the squares of the probability amplitudes sum to
    one: suppose \(U\) and \(\mathbf{s}\) are such that \(||\mathbf{s}||^2 = \binom{\alpha}{\beta}^\dagger
    \binom{\alpha}{\beta} = \alpha \overline{\alpha} + \beta \overline{\beta} = |\alpha|^2
    + |\beta|^2 = 1\), \(||U\mathbf{s}|| = ||\mathbf{s}||\) and \(U\mathbf{s} = \binom{\alpha''}{\beta''}\),
    then \(||U\mathbf{s}|| = |\alpha''|^2 + |\beta''|^2 = ||\mathbf{s}|| = 1\). It
    therefore makes sense that quantum gates mapping one valid quantum state to another
    valid quantum state would need to be unitary operators.


    An intuitive interpretation of a quantum gate is as manipulation of the state
    vector \(|\psi\rangle = \alpha |0\rangle + \beta |1\rangle\), as we have seen,
    within some state space, or some coordinate system. But consider the *Bloch sphere*,
    which is a geometrical representation of the state space of a qubit, where the
    two poles of the sphere correspond to the two basis vectors \(|0\rangle\) and
    \(|1\rangle\), and then an arrow on the Bloch sphere (starting from the center
    of the sphere) represents a state of the qubit. Many books have explained'
