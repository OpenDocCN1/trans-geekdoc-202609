  md: '# # 6


    # The Quantum Internet


    This chapter discusses some of the key concepts and ideas of the quantum Internet,
    including the central role that entanglement plays, the concepts of entanglement
    swapping and entanglement purification, and briefly reviews the notion of quantum
    repeaters and quantum Internet architectures. We will also look at quantum computations
    in relation to the quantum Internet.


    # ## 6.1 Entanglement Over Longer Distances


    So far we have seen that entanglement is key to many distributed quantum computing
    protocols and computations. Any two nodes which want to do computations together
    (e.g. perform a distributed–CNOT operation) need to share entangled qubits, even
    when the two nodes are geographically far apart. One can think of the quantum
    Internet as a “black box” from which nodes can request an entanglement between
    two qubits (on two nodes), or roughly speaking, providing “entanglement-as-a-service”
    (with the associated service-based ideas of “quality” of the entangled pair and
    “efficiency,” e.g. generating entanglement qubits in a timely manner). How is
    such an entangled pair generated? Answering this question in detail will take
    us further into the physics which we will not do so here. But generally, there
    are a number of mechanisms to generate an entangled pair (e.g. a Bell state) between
    two nodes.¹ One key point, however, is that due to decoherence affecting entangled
    qubits, distance is a limitation – e.g. it is hard to directly transmit a qubit
    over long distances without it suffering loss – so that generating an entangled
    pair between two nodes far apart over long distances requires what has been called
    quantum repeaters (analogous to repeaters for classical networks, but a totally
    different technology), which has a mechanism to take two entangled pairs (e.g.
    between qubits A on node 1 and A′ on node 2, and


    1 A readable overview is at https://www.forbes.com/sites/chadorzel/2017/02/28/how-do-you-create-quantum-entanglement/?sh=2664a2c11732
    [last accessed: 15/11/2022].'
  merge: -1
  img_proc: true
