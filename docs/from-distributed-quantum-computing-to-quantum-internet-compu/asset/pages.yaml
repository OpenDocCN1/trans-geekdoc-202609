  md: 'without B knowing about this change. Then, A continues till step (3) to receive
    b from B. And b can either be 0 or 1:


    +   - Now, if the received \( b = 0 \), then the protocol continues without change,
    and the probability that B measures \( a'' \) to be 0 is


    ```

    \( tr \left( |\psi_0\rangle \langle \psi_0| \, |\psi''_0\rangle \langle \psi''_0|
    \right) = tr \left( \langle \psi_0 | \psi''_0 \rangle \langle \psi''_0 | \psi_0
    \rangle \right) = \left| \langle \psi_0 | \psi''_0 \rangle \right|^2 \\ = \left(
    \frac{1}{\sqrt{12}} + \frac{2}{\sqrt{12}} \right)^2 = \frac{3}{4} \)

    ```


    That is, the probability of the outcome \( a'' \oplus b = 0 \oplus 0 = 0 \) is
    3/4.


    +   - And if the received \( b = 1 \), then \( A \) applies an operator to the
    qubit \( q_s \) which swaps \( |0\rangle \) and \( |1\rangle \), before sending
    it to \( B \). This means that \( B \) will have the state \( q_s q_t \) as follows:


    ```

    \( |\psi''_1\rangle = \frac{1}{\sqrt{6}} (|1, 0\rangle + |1, 1\rangle + 2 |0,
    2\rangle) \)

    ```


    And the probability that \( B \) measures \( a'' \) to be 1 is


    ```

    \( tr \left( |\psi_1\rangle \langle \psi_1| \, |\psi''_1\rangle \langle \psi''_1|
    \right) = tr \left( \langle \psi_1 | \psi''_1 \rangle \langle \psi''_1 | \psi_1
    \rangle \right) = \left| \langle \psi_1 | \psi''_1 \rangle \right|^2 \\ = \left(
    \frac{1}{\sqrt{12}} + \frac{2}{\sqrt{12}} \right)^2 = \frac{3}{4} \)

    ```


    That is, the probability of the outcome \( a'' \oplus b = 1 \oplus 1 = 0 \) is
    3/4.


    From the above, \( A \) has managed to bias the outcome beyond the uniform probability
    whatever the value of \( b \) turns out to be (assuming \( B \) is following the
    protocol honestly), so that the total probability of the outcome being 0 is \(
    1/2 \cdot 3/4 + 1/2 \cdot 3/4 = 3/4 \)!


    What about B? Can B try to cheat, assuming that B is trying to make the outcome
    1? On receiving the state of \( q_t \) from \( A \) in step (2), B might try to
    work out what value of \( a \) is encoded in it by performing the measurement
    \(\{ |0\rangle \langle 0|, |1\rangle \langle 1|, |2\rangle \langle 2| \}\). Consider
    the following two cases:


    +   - Case 1: If the measurement result (call this \( a'''' \)) is 0 or 1, i.e.
    not 2, then B knows what value of \( a \) is: if \( a'''' = 0 \), then \( a =
    0 \) (looking at the term \( |0, 0\rangle \) in \( |\psi_0\rangle \)), and if
    \( a'''' = 1 \), then \( a = 1 \) (looking at the term \( |1, 1\rangle \) in \(
    |\psi_1\rangle \)), that is, \( a'''' = a \). Then, to get the outcome to be 1,
    B can set its \( b = a'''' \oplus 1 \) and send this value to A, which computes
    \( a \oplus b = a \oplus (a'''' \oplus 1) = 1 \). What is the probability that
    the measurement result \( a'''' \neq 2 \)? Looking at the amplitudes in \( |\psi_0\rangle
    \) and \( |\psi_1\rangle \), this happens with probability \( (\frac{1}{\sqrt{2}})^2
    = 1/2 \) when the state sent was \( |\psi_0\rangle \), and with probability \(
    (\frac{1}{\sqrt{2}})^2 = 1/2 \) when the state sent was \( |\psi_1\rangle \).
    This means that whether A sends \( |\psi_0\rangle \) or \( |\psi_1\rangle \),
    if \( a'''' \neq 2 \), B can bias the result to get 1 for sure, and \( a'''' \neq
    2 \) happens with probability 1/2.'
