    + \alpha \mathbf{I} + \alpha \mathbf{I}) = \frac{1}{2} \mathbf{I}\)


    Suppose \(\rho''\) is the density operator for an \(n\)-qubit site, one can encrypt
    each qubit, and the above generalizes to \(n\)-qubits as follows:


    \(\frac{1}{4^n} \sum_{\mathbf{a}, \mathbf{b} \in \{0,1\}^n} \left( X^{a_1} Z^{b_1}
