  md: '= \frac{1}{\sqrt{n}}\sum_{l=0}^{n-1}(-1)^{a_l+b_l}(H | i_1 \rangle \otimes
    \cdots \otimes H | i_l \rangle)

    (where \(| i \rangle = | i_1 \dots i_l \rangle\), the bit string representation
