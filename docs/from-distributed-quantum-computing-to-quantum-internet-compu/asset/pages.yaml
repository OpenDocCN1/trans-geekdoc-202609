  md: '# 3.2.5 Quantum Voting


    Voting is a key concept in democratic societies and quantum electronic voting
    protocols have been extensively discussed in Arapinis et al. [2021]. Here, we
    outline the voting scheme using quantum information from Khabiboulline et al.
    [2021].


    The general idea is to use a quantum state as a kind of “ballot paper” where a
    voter can register a vote (a vote here is binary, e.g. either “yes” [say 1] or
    “no” [say 0]), and the voting result is obtained by counting the number of 1s
    and 0s obtained. A key consideration is that a voter should not be able to provide
    multiple votes (undetected), thereby compromising the integrity of the election.


    We have a tallyman that samples a random bit string \(x \in \{0, 1\}^n\), where
    \(n = O(N^2)\) for the protocol to work correctly, and prepares \(N\) copies of
    the ballot state, where \(N\) is the number of voters:


    \(|\psi_x\rangle = \frac{1}{\sqrt{n}} \sum_{i=0}^{n-1} (-1)^{x_i} |i\rangle\)


    where \(x_i\) is the \(i\)th bit of the \(n\)-bit string \(x = x_0 \dots x_{n-1}\),
    and the ballot state uses \(\lceil \log n \rceil\) qubits. For example, for \(n
    = 6\), we use three qubits, and a ballot state with \(x = 101100\) is a superposition
    of six states:


    \(\frac{1}{\sqrt{6}} (-|000\rangle + |001\rangle - |010\rangle - |011\rangle +
    |100\rangle + |101\rangle)\)


    Note that the coefficients of \(|110\rangle\) and \(|111\rangle\) are considered
    0 since the string only has 6 bits. The ballot state marks a 1 in the \(i\)th
    position via the negative sign of \(|i\rangle\), i.e. each component is \((-1)^{x_i}
    |i\rangle\).


    How does a voter cast a vote? On receiving a ballot state, a voter performs measurements
    in a basis comprising projectors on superpositions of two states of the form \(\frac{1}{2}(|i\rangle
    + |j\rangle)\) and \(\frac{1}{2}(|i\rangle - |j\rangle)\) where \(i \neq j\).
    If we think of the six component states in the ballot state as nodes of a graph,
    then an edge between two nodes \((i, j)\) can be represented by a term of the
    form \((|i\rangle + |j\rangle)\) or \((|i\rangle - |j\rangle)\). One example of
    a measurement basis is the set of projectors (using these states):


    \(\left\{ \begin{aligned} \frac{1}{\sqrt{2}}(|000\rangle + |011\rangle), \quad
    \frac{1}{\sqrt{2}}(|000\rangle - |011\rangle), \\ \frac{1}{\sqrt{2}}(|001\rangle
    + |100\rangle), \quad \frac{1}{\sqrt{2}}(|001\rangle - |100\rangle), \\ \frac{1}{\sqrt{2}}(|010\rangle
    + |101\rangle), \quad \frac{1}{\sqrt{2}}(|010\rangle - |101\rangle) \end{aligned}
    \right\}\)


    which corresponds to three edges between states, and when used for measurement
    would effectively pick an edge from the three possible edges, yielding either
    \((|i\rangle + |j\rangle)\) or \((|i\rangle - |j\rangle)\) which corresponds to
    the parity of \(x_i\) and \(x_j\) given the definition of'
