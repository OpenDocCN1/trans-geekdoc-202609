    Also, for (2) above, in order for $A$ to determine what $m$ will decrypt to, depending
    on its key, $A$ will need to come up with $k_A$ and $k''_A$ such that $H(k_B k_A
    0) = H(k_B k''_A 1) = m$, so that suppose $A$ wants $m$ to decrypt to $0$, it
    will send the key $k = k_A$ to $B$ which uses its $reveal$ algorithm to compute
    $0$ (which satisfies $H(k_B k 0) = m$), and similarly, when $A$ wants $m$ to decrypt
    to $1$, it will send $B$ the key $k''_A$, which satisfies $H(k_B k''_A 1) = m$,
    so that $B$ computes $1$. But given the collision-free property of the hash function
    $H$, it is hard for $A$ to come up with $k_A$ and $k''_A$ such that $H(k_B k_A
    0) = H(k_B k''_A 1)$. This prevents $A$ from determining its $a$ after knowing
    $B$''s value $b$, and so, $A$ cannot bias/force the result.


    With the bit commitment protocol that works, we can then allow $A$ to commit to
    a bit without being able to dictate what it is after knowing $B$''s value. The
    coin flipping protocol using bit commitment is given in Figure 3.5, with the output
    being $a \oplus b$ for both. Note that the output of the coin flipping protocol
    is either both have 0 or both have 1. And this protocol looks secure as long as
    the parties are computationally bounded, e.g. unable to invert the Hash function.


    What further problems would there be with this? Note that after step 6. when $A$
    has computed $a \oplus b$, it might realize that it has lost and then what $A$
    could do is to stop the protocol and refuse to send the key to $B$! With the protocol
    terminating prematurely, it seems no one is the winner, or at least, $B$ has been
    denied a win!


    In general, one can state the properties of a coin flipping protocol and quantify
    the security of a protocol using a parameter value $\epsilon$ in the following
    sense. A coin flipping protocol is correct if when both parties ($A$ and $B$ participating
    in the protocol) are honest (follows the protocol), then the probability of the
    output $o$ of the protocol being 1 is $1/2$ and the probability of the output
    $o$ being 0 is $1/2$, i.e. there is equal chance of either party winning, or $prob(o
    = 0) = prob(o = 1) = 1/2$. A coin flipping protocol (the strong version) is said
    to be $\epsilon$-secure when neither party can force the probability of the final
    outcome beyond certain bounds defined by $\epsilon$ (called the bias of the protocol).
    More precisely,


    +   1. whatever $A$ does (assuming $B$ follows the protocol honestly), $prob(o
    = 0) \leq 1/2 + \epsilon$ and $prob(o = 1) \leq 1/2 + \epsilon$, i.e. $A$ (in
    trying to make the coin flip bias toward 0) can do nothing (within some predefined
    space of strategies) to make'
