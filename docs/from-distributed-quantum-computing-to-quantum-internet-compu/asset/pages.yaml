    One can see that there are timing constraints where nodes might need to wait for
    entanglement to be established, e.g. suppose between nodes which are far apart,
    or entanglement could be established a priori.13 Also, one can imagine a much
    larger circuit where each node might be assigned multiple qubits, and a much more
    complex “Web” of entanglement between nodes.


    Hence, acquiring entangled pairs between qubits on two nodes, for the purposes
    of nonlocal gates between the two nodes (as we have seen in Chapter 4), or for
    quantum teleportation, is a key challenge in distributed quantum computing over
    the quantum Internet. When two nodes do not yet share entangled pairs, entanglement
    swapping operations involving intermediate nodes (between the two nodes) might
    be needed before they can share entangled pairs, and so, perform distributed quantum
    computations. Hence, entangled pairs between nodes become an important resource
    to acquire.


    We mentioned the idea of compilers for distributed quantum computing in Chapter
