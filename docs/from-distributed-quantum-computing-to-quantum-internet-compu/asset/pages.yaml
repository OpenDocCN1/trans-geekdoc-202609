    Each party (i.e. general) has a private list $l_A, l_B,$ and $l_C$, respectively,
    with the same length $L$. The elements of $l_A$ are random trits (values 0, 1,
    or 2), and the elements of $l_B$ and $l_C$ are random bits (values 0 or 1). A
