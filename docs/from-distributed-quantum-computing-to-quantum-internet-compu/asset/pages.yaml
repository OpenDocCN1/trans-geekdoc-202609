  md: 'Hence, we see that losing two (or fewer) out of the six qubits (in the tree-cluster
    state) is fine as the quantum state of the message can still be recovered. (A
    larger tree-cluster state can be used to provide greater robustness.)


    The above scheme is a process for recovering the message qubit. The method is
    basically as follows:


    +   1. Measure out all the qubits in one branch (either one): measure the first-level
    qubit in the Z basis and second-level qubits in the X basis. (Note that in the
    example above, the two lost qubits are as though they have been “measured out”
    and then we measure one more second-level qubit (in that branch where the two
    qubits were lost) in the X basis, i.e. we measured out all the qubits in one branch.)


    +   2. In the remaining branch, measure the two second-level qubits in the Z basis
    and perform some H and/or Pauli operations as required.


    Once recovered, at a repeater, the qubit can be re-encoded in a similar way with
    a (new) tree-cluster state and transmitted to the next repeater (or destination).


    However, we might want to first “test” to see if there is photon (qubit) loss
    or not, i.e. if the encoded message qubit arrived successfully or not, before
    proceeding to re-encoding with a new tree-cluster state. This is done as follows.
    Suppose the qubits received at this repeater is \(|\tau''\rangle = \frac{\alpha}{2}f_1
    + \frac{\beta}{2}f_2\), i.e.


    ```

    \(|\tau''\rangle = \frac{\alpha}{2}(|0\rangle_{c1}|++\rangle + |1\rangle_{c1}|--\rangle)
    \otimes (|0\rangle_{c2}|++\rangle + |1\rangle_{c2}|--\rangle)\)

    \(+ \frac{\beta}{2}(|0\rangle_{c1}|+-\rangle - |1\rangle_{c1}|--\rangle) \otimes
    (|0\rangle_{c2}|++\rangle - |1\rangle_{c2}|--\rangle)\)

    ```


    where we highlight the first-level qubits (recalling the tree-cluster idea where
    the first level qubits are marked as c1 and c2 here). The controlled-Z gate (CZ)
    operation is done with one of the first-level qubits in the transmitted state
    (say c1) and an auxiliary stationary qubit s in the state \(H|0\rangle\) and a
    measurement in the X basis is done. If the X basis measurement was successful,
    then a transfer to the new cluster state is heralded, and a Bell measurement is
    done between the auxiliary qubit and the root of a new tree-cluster state, transferring
    the quantum information to the new tree-cluster state. The circuit (showing only
    qubits c1 and s) is as follows:


    ![](img/fb3eb7e935470a2da12b03f528f097ee_183_0.png)'
