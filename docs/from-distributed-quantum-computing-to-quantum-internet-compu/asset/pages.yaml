  md: '![](img/fb3eb7e935470a2da12b03f528f097ee_92_0.png)


    **Figure 3.6** Leader election where the winner of each pair is decided using
    a weak coin flipping protocol. Honest parties shown, where the winning probability
    is 1/2 in each round. The leader has to be “lucky enough” to win in all three
    rounds and does so with probability \((\frac{1}{2})^3\).


    Clearly, a protocol with small \(\epsilon\) is better. The idea to solving the
    above problem is to carry out a knock-out tournament using the weak coin flipping
    protocol between pairs of parties and the winner of the tournament is declared
    the leader.


    For (a), when all the parties are honest, then \(k = \log_2 n\) rounds of the
    tournament will determine the leader. To be leader, a party has to win all the
    \(k\) rounds, which it does so with probability \((\frac{1}{2})^k = \frac{1}{n}\),
    as illustrated in Figure 3.6 for \(n = 2^3\).


    For (b), using a weak (quantum) coin flipping protocol with cheaters, in each
    round, in a pair playing this protocol, the cheater could win with probability
    at most \(\frac{1}{2} + \epsilon\), i.e. an honest player can win with probability
    at least \(1 - (\frac{1}{2} + \epsilon) = \frac{1}{2} - \epsilon\). Hence, in
    total, after \(k = \log_2 n\) rounds, the probability that the honest player (honest
    in all rounds) can become the leader is at least:


    ```

    \(\left(\frac{1}{2} - \epsilon\right)^k = \left(\frac{1-2\epsilon}{2}\right)^k
    \geq \frac{1-2\epsilon k}{2^k} = \frac{1}{n} - \epsilon \frac{2 \log_2 n}{n} \geq
    \frac{1}{n} - \epsilon\)

    ```


    using \((1 + x)^n \geq 1 + nx\), for \(x \geq -1, n \in \mathbb{N}\), which applies
    since \(x = -2\epsilon\) and \(\epsilon \leq 1/2\). Note that the running time
    can be characterized by \(O(\log n)\) rounds, and with each round taking R in
    a weak coin flipping protocol with bias \(\epsilon\), we have a total running
    time of \(O(R \cdot \log n)\).


    But if \(n\) is not a power of two, further steps are required. A recursive algorithm
    called \(Leader(\{A_1, ..., A_n\}, \epsilon)\) to elect a leader from among \(n\)
    parties \(\{A_1, ..., A_n\}\) with an honest player being the leader with probability
    at least \(\frac{1}{n} - \epsilon\) is as follows.'
