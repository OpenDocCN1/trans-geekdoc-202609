  md: '# # Preliminaries


    This chapter provides background on quantum information and quantum computing
    to prepare readers for Chapters 3–6. Readers already familiar with this topic
    might find this chapter unnecessary but going over will at least help in gaining
    an overview of the conventions and notation we will use throughout this book.
    Also, the book assumes familiarity with basic linear algebra and probability,
    but introduces necessary notation and the required mathematics as needed in an
    attempt to be as self-contained as possible, and also points out references for
    further reading.


    This chapter first introduces the concept of qubits (or quantum bits) and qubit
    states and then goes on to introduce operations on qubits using quantum gates
    and quantum circuits, analogous to logic gates and logic circuits operating on
    bits. We also introduce the notions of entanglement, teleportation, and superdense
    coding, which are useful concepts in quantum Internet computing and quantum communications.


    # ## 2.1 Qubit and Qubit States


    Classical computing manipulates information represented in a binary manner, using
    bits, each bit at any one time having one of two possible values, typically denoted
    by “0” and “1.” In contrast, quantum computing manipulates information represented
    via quantum states, states of qubits, where a qubit is a two state or two-level
    quantum-mechanical system, constituting the basic unit of quantum information,
    such as a photon with vertical and horizontal polarization, a photon with two
    paths (discussed below), or electron spin with spin-up and spin-down.'
