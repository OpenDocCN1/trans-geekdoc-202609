- pgno: 59
  md: '# 3


    # Distributed Quantum Computing – Classical and Quantum


    Early discussions on distributed quantum computing focused on communication complexity,
    that is, the number of bits (or qubits) in messages exchanged in a distributed
    computation involving at least two parties. The aim was to see if entanglement
    provided a way to reduce the communication complexity of (classical or quantum)
    distributed algorithms – reducing communication among nodes is a key goal of many
    distributed computing algorithms since such a reduction can improve efficiency,
    reduce the coupling among nodes, and reduce the use of communication resources.


    We first consider three of these algorithms: the distributed three-party product
    problem, the distributed Deutsch–Jozsa promise problem, and the distributed intersection
    problem. While one might argue that these are not quite practical distributed
    quantum computing algorithms, we will see how quantum information can enable fewer
    bits of communication to be used for a distributed computing solution, as opposed
    to using just classical information.


    Then, we will also look at an amazing result that some distributed computation
    problems (with certain constraints and requirements) cannot be solved classically,
    but can be solved with the use of quantum information, in particular entanglement.
    In fact, the ability to solve such a problem within the constraints and requirements
    might be considered a test of whether there is indeed quantum entanglement!


    Thereafter, we will look at a number of quantum protocols, which seem rather theoretical,
    but many have practical implications, and involve multiple parties (or nodes),
    and hence, distributed in nature. Quantum protocols we will look at include quantum
    coin flipping, quantum leader election, quantum key distribution, quantum anonymous
    broadcasting, quantum voting, quantum Byzantine Generals, quantum secret sharing,
    and quantum oblivious transfer (OT).'
