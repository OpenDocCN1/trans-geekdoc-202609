    \(B_j^v \in \{+1, -1\}\), and \(N_{ij} (< N\), where we assume that each combination
    of inputs 00, 01, 10, and 11 occurs with equal probability in each round, so that
    we have \(N_{ij} = \frac{N}{4}\), for each combination \(ij\)) is the number of
    rounds with input to \(A\) being \(i\) and input to \(B\) being \(j\), i.e. <\(A_iB_j\)>
    is the average value of the product of \(A\)’s output and \(B\)’s output given
    the inputs \(i\) and \(j\), respectively. Note in this case, the outputs are either
    +1 or −1, \(A_0\) denotes the output of \(A\) in response to input 0, and similarly
    for, symbols \(A_1, B_0\), and \(B_1\).


