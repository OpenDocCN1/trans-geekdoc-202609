  md: '# 2.2.2.3 Projective Measurements


    Suppose we have a set of measurement operators $\{P_m\}$, where there is a Hermitian
    matrix $M$ (representing an observable, a quantity that can be measured, in Physics)
    as follows:


    $M = \sum_m m P_m$


    which shows how this set of measurement operators $\{P_m\}$ are related, and the
    probability of outcome $m$ is given by $p(m) = \langle \psi | P_m | \psi \rangle$,
    and and the state after measurement is given by $\frac{P_m | \psi \rangle}{\sqrt{p(m)}}$,
    then $M$ describes a projective measurement with measurement operators $\{P_m\}$
    which are projectors onto the eigenspace of $M$ with eigenvalue $m$ (e.g. denoting
    the corresponding eigenvector of $M$ by $|m\rangle$, i.e. $M | m \rangle = m |
    m \rangle$, then we may write $P_m$ as $|m\rangle \langle m|$).


    Also, suppose we have a set of measurement operators $\{M_m\}$ according to the
    postulate above and that the operators are orthogonal projectors, i.e. $M_m M_{m''}
    = \delta_{m,m''} M_m$, where $\delta_{m,m''} = 1$ if $m = m''$ and $\delta_{m,m''}
    = 0$ if $m \neq m''$. Then, note that $p(m) = \langle \psi | M_m^\dagger M_m |
    \psi \rangle = \langle \psi | M_m | \psi \rangle$, since $M_m^\dagger M_m = M_m
    M_m = M_m$ (noting that $M_m^\dagger = M_m$, since $M_m$ is Hermitian). Hence,
    projective measurements form a special class of measurements.


    An example of a projective measurement is the measurement in the computational
    basis using measurement operators $\{M_0 = |0\rangle \langle 0|, M_1 = |1\rangle
    \langle 1|\}$ or measurement with respect to the observable $Z = |0\rangle \langle
    0| - |1\rangle \langle 1| = M_0 - M_1$, where acting on $\alpha | 0 \rangle +
    \beta | 1 \rangle$, we observe that the probability of getting an outcome corresponding
    to eigenvalue 1 is $p(1) = \bar{\alpha}\alpha = |\alpha|^2$ with resulting state
    $|0\rangle$, and the probability of getting an outcome corresponding to eigenvalue
    -1 is $p(-1) = |\beta|^2$ with resulting state $|1\rangle$.)


    Another example is the measurement in the Hadamard basis, i.e. with respect to
    the measurement operators $\{|+\rangle \langle +|, |-\rangle \langle -|\}$, where
    $|+\rangle = (|0\rangle + |1\rangle)/\sqrt{2}$ and $|-\rangle = (|0\rangle - |1\rangle)/\sqrt{2}$.
    The observable is the matrix $X = |+\rangle \langle +| - |-\rangle \langle -|$.
    What are the probabilities of outcomes if we measure a qubit in the state $\alpha
    | 0 \rangle + \beta | 1 \rangle$? We can rewrite the state as follows: $\alpha
    | 0 \rangle + \beta | 1 \rangle = \frac{\alpha+\beta}{\sqrt{2}} |+\rangle + \frac{\alpha-\beta}{\sqrt{2}}
    |-\rangle$, and we observe that the probability of getting an outcome corresponding
    to eigenvalue 1 is $p(1) = |\frac{\alpha+\beta}{\sqrt{2}}|^2$ with resulting state
    $|+\rangle$, and the probability of getting an outcome corresponding to eigenvalue
    -1 is $p(-1) = |\frac{\alpha-\beta}{\sqrt{2}}|^2$ with resulting state $|-\rangle$.
    Note that suppose our instruments can only measure in the computational basis,
