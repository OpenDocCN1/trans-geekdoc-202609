    \ such as $I \\otimes I \\otimes Z$ can be used as well.\n> \n> 2. Apply the operation\
    \ $H \\otimes H \\otimes H$:\n> \n> $(H \\otimes H \\otimes H) \\frac{1}{\\sqrt{2}}(|000\\\
    rangle - |111\\rangle)$\n> \n> $= \\frac{1}{\\sqrt{2}}(H|0\\rangle H|0\\rangle\
    \ H|0\\rangle - H|1\\rangle H|1\\rangle H|1\\rangle)$\n> \n> $= \\frac{1}{4}((|000\\\
    rangle + |001\\rangle + |010\\rangle + |011\\rangle + |100\\rangle + |101\\rangle\
    \ + |110\\rangle + |111\\rangle) - (|000\\rangle - |001\\rangle - |010\\rangle\
    \ + |011\\rangle - |100\\rangle + |101\\rangle + |110\\rangle - |111\\rangle))$"
