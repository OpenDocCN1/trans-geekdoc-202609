    We can repeat this process – from at least one pair of states of fidelity \(F
    > \frac{1}{2}\), go through the process to get a pair of fidelity \(F'' > F\)
    (we say "at least" since the process might fail to get a pair of higher fidelity,
    if the two measured qubits don''t fulfill the condition, so that it might take
    more than one pair of qubits to get one higher fidelity pair), and then repeat
    this process to get a pair of fidelity \(F'''' > F''\), and so on, until \(F_{output}\)
    approaches 1.


    With the above approach, we used two impure pairs of fidelity at least 0.5 to
    get one pair of higher fidelity. And we have to repeat this process many times
    for \(F_{output}\) to approach 1, throwing away at least half of the impure pairs
    (i.e. the targets). Hence, it is not a very efficient process. There are also
    concerns about what happens if two copies are not exact copies of each other and
    so on, which we will not go into here.


    We have provided an outline of one method – there are further discussions on entanglement
    purification (or entanglement distillation) including other methods in Bennett
    et al. [1996], Deutsch et al. [1996], and Dür and Briegel [2007]. We discussed
    only bipartite Bell pairs above, but distillation protocols for multipartite GHZ
    states are described in de Bone et al. [2020].


    # 6.3 Distributed Quantum Computation Over the Quantum Internet – Challenges


    We can imagine an Internet of quantum repeaters which can be doing the tasks of
    entanglement swapping, or decoding and encoding qubits, e.g. in tree-cluster states,
    or other encodings. This means that suppose two nodes need to transmit states
    between each other or share some entangled EPR pair, then they can request for
    such entangled pairs from the quantum Internet. As a simple example, imagine that
