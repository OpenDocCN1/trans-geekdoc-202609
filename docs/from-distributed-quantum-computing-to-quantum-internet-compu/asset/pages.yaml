  md: '# 3.2.2 Quantum Leader Election


    We consider the leader election problem, which is to elect a leader among a collection
    of distributed parties. Typically, in practical settings, one way to solve this
    is for each party to use its unique identifier, e.g. an IP address, and there
    is a protocol to solve this problem by selecting the party with the largest identifier
    as the leader (based on some ordering). However, when no such unique identifier
    can be established, then it is more challenging. One way to solve this problem
    is for each party to run some subroutine for a number of rounds, with each round
    filtering out some parties to be ineligible, starting with all parties being eligible.
    For example, in each round, each eligible party generates a random bit (0 or 1),
    and those with bit 0 are filtered out as ineligible. Eventually, there could remain
    only one eligible party who becomes the leader. However, such a protocol is probabilistic
    – suppose, in a round, every eligible party gets a 1, and no one is filtered out,
    then one can keeping repeating this, each party generates a new bit and see if
    any parties can be filtered out, and the process might be repeated a number of
    times, and still no one is eliminated – we depend on chance that eventually someone
    gets eliminated, and so this method is not exact (in the sense that one cannot
    exactly say when the leader will eventually be elected, e.g. with bounded time
    – there could be many rounds and repetitions if one is unlucky so that no one
    gets eliminated for a while). In fact, this problem without unique identifiers
    (so-called *anonymous networks*) has no classical exact solution for many network
    topologies in which the parties are connected [Tani et al., 2012]. Also since
    there are no cheaters assumed, this is called the *fair leader election* problem.
    However, can this problem be solved exactly with quantum information? The answer
    is yes, and Tani et al. [2012] provide an exact quantum algorithm for this fair
    leader election problem that elects a leader in polynomial time/communication
    complexity, showing another difference between the classical and quantum worlds.


    In the following, we consider the leader election problem with cheaters and roughly
    sketch how one can use the coin flipping protocol to solve this problem – the
    algorithm is from Ganz [2017].


    For simplicity, we just sketch the idea for \(n = 2^k\) parties, that is, \(n\)
    is some power of two. Ganz''s algorithm is more general [Ganz, 2017].


    With potential cheaters, the leader election problem is to elect a leader where:


    +   a. if all parties are honest, then each party has a \(\frac{1}{n}\) chance
    of being the leader, i.e. anyone has an equal chance of being the leader,

    +   b. otherwise (if there are cheaters), any honest player has probability \(>
    \frac{1}{n} - \epsilon\) of being the leader.'
