  md: '# 3.2.4 Quantum Anonymous Broadcasting


    We consider the problem of how anonymous broadcasting can be implemented, i.e.
    given a collection of n parties (e.g. users or machines), how any one party can
    broadcast a message (i.e. a one-bit message) to all the other parties, without
    the other parties knowing who transmitted the message.


    The original (non-quantum) form of this problem (and solution) was given as follows,
    called the Dining Cryptographers Problem:


    > Three cryptographers are sitting down to dinner at their favorite three-star
    restaurant. Their waiter informs them that arrangements have been made with the
    maître d''hôtel for the bill to be paid anonymously. One of the cryptographers
    might be paying for dinner, or it might have been NSA (U.S. National Security
    Agency). The three cryptographers respect each others’ right to make an anonymous
    payment, but they wonder if NSA is paying, They resolve their uncertainty fairly
    by carrying out the following protocol: Each cryptographer flips an unbiased coin
    behind his menu, between him and the cryptographer on his right, so that only
    the two of them can see the outcome. Each cryptographer then states aloud whether
    the two coins he can see – the one he flipped and the one his left-hand neighbor
    flipped – fell on the same side or on different sides. If one of the cryptographers
    is the payer, he states the opposite of what he sees. An odd number of differences
    uttered at the table indicates that a cryptographer is paying an even number indicates
    that NSA is paying (assuming that the dinner was paid for only once). Yet if a
    cryptographer is paying, neither of the other two learns anything from the utterances
    about which cryptographer it is. [Chaum, 1988, p. 65]


    Note that there are three coin flips and three outcomes. NSA paid means none of
