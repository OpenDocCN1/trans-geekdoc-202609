  md: 'ii) the Networking Layer realizes quantum networking services used by the programs
    at the Distributed Quantum Computing Layer, supported by the classical Internet,
    including preparation of quantum entanglement and transmission of qubits; at least
    for the foreseeable future, the quantum Internet is expected to coexist with the
    classical Internet.


    Later in the book, we will come back to discussing this architecture in further
    detail, but here, it suffices to convey the idea of quantum Internet computing.


    # 1.3 Aim and Scope of the Book


    As mentioned, Internet computing, where one does distributed computing but over
    Internet scale distances and distributed systems involve nodes connected via the
    Internet, is at the intersection of work in (classical) distributed computing
    and the (classical) Internet. By an analogy to Internet computing, one could ask
    the question of what would be at the intersection of distributed quantum computing
    and the quantum Internet. This book provides an introductory overview of selected
    topics in distributed quantum computing and the quantum Internet, and then attempts
    to answer this question, proposing the notion of quantum Internet computing, a
    proposed “umbrella paradigm” for a collection of topics (listed below), from an
    analogy to (classical) Internet computing:


    +   - distributed quantum computing, including theoretical studies of quantum
    protocols which are often quantum versions of classical quantum distributed computing
    protocols, and perspectives on communication complexity including gains from the
    use of entanglement,

    +   - distributed quantum computing using non-local (or distributed) quantum gates
    and circuits, where we focus on how large quantum computation represented by a
    quantum circuit can be distributed over multiple nodes,

    +   - delegating quantum computations to a server, including delegating in such
    a way that the server has limited or no knowledge of the computations for the
    purposes of privacy of the client (who is delegating the computations to the server)
    or sometimes called blind quantum computing, and verifying delegated quantum computations
    so that the client is assured that the server did do the required computations;
    delegating quantum computations (on a pay-per-use basis) might come under what
    has been called quantum cloud computing given the cloud model of providing computing-as-a-service
    (typically, in classical cloud computing, including software, computer servers,
    memory and so on, provided on a pay-as-you-use service over the Internet), and

    +   - quantum Internet, where we introduce the concept, key ideas such as quantum
    entanglement distillation, and entanglement swapping, and possible architectures.'
