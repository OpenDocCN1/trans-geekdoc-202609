    # ## 6.2 Entanglement with Higher Fidelity


    Decoherence due to noise was mentioned earlier which limits the distances over
    which entanglement might be generated; entanglement swapping provided a way to
    entangle qubits much further apart over long distances. However, there is still
    a need to improve the “quality” of entanglement, that is, to improve the fidelity
    of qubit states toward the desired ideal. Before introducing a method to improve
    fidelity, we first define fidelity more precisely and also introduce the notion
    of the twirling map.


    # ### 6.2.1 Fidelity


    We first consider a precise model of fidelity, of what it means for a quantum
    state to be close to some ideal.7 Due to noise, an entangled state may not be
    what exactly we want it to be. The consequences of noisy distributed entanglement
    include failure of particular nonlocal quantum gate operations and problems in
    quantum protocols, e.g. in QKD, an imperfect entangled state produces a partially
    correlated key. There is a need to evaluate the quality of a distributed entanglement
    and then think of how to improve the quality of the entanglement. One way to measure
    the quality of entanglement is to use the notion of fidelity. Given a reference
    (ideal) state |ψ⟩ and the actual state ρ shared by two nodes, the fidelity, denoted
    by the function F, between the reference and actual state is F(ρ, |ψ⟩) = ⟨ψ|ρ|ψ⟩.
    There are


