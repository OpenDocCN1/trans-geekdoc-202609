    \end{bmatrix} \begin{bmatrix} \alpha & \beta \end{bmatrix}^\dagger = \begin{bmatrix}
    \alpha \\ \beta \end{bmatrix} \begin{bmatrix} \bar{\alpha} & \bar{\beta} \end{bmatrix}
    = \begin{bmatrix} \alpha\bar{\alpha} & \alpha\bar{\beta} \\ \bar{\beta}\alpha
