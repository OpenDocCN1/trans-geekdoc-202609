    # 1.2.2 Quantum Internet Computing


    With developments in the coming decades in quantum networking (and the quantum
    Internet), quantum computing hardware and software, and distributed quantum computing,
    we can conceptualise quantum Internet computing, analogous to (classical) Internet
    computing mentioned above, referring to distributed quantum computing over the
    emerging quantum Internet, potentially over vast geographical distances, or roughly
    put:


    quantum       distributed

    Internet      = quantum   + quantum

    computing     computing   + Internet


    Inspired by Cuomo et al. [2020] who noted that the quantum Internet will become
    the “underlying infrastructure of the Distributed Quantum Computing ecosystem,”
    Figure 1.2 illustrates a layered conceptualization of the idea of distributed
    quantum computing over the quantum Internet, where


    +   i) the Distributed Quantum Computing Layer contains the


    +   • the Distributed Quantum Computing Applications sublayer, which comprises
    the end-user applications built using the tools and abstractions from the Distributed
    Quantum Computing Tools, Abstractions, Libraries, Environment layer, and


    +   • the Distributed Quantum Computing Tools, Abstractions, Libraries, Environment
    sublayer, which provides a range of tools and abstractions, and environments for
    executing and managing programs.


    ![](img/fb3eb7e935470a2da12b03f528f097ee_22_0.png)


    Figure 1.2 A simple architecture of quantum Internet computing: distributed quantum
    computing over the quantum Internet.'
