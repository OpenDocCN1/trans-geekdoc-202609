  md: 'Note that from the above two conditions $prob(o = 0) \le 1/2 + \epsilon$ and
    $prob(o = 1) \le 1/2 + \epsilon$, we can write: $\epsilon = max(P_A^*, P_B^*)
    - \frac{1}{2}$, where $P_A^*$ and $P_B^*$ are the maximum winning probabilities
    of $A$ and $B$, respectively.


    Also, note that if one has a protocol where $\epsilon$ is small, say $\epsilon
    = 0.01$, then it seems “more secure,” since, for example, $A$ cannot make the
    $prob(o = 0) > 0.51$, whereas for a protocol with larger $\epsilon$, say $\epsilon
    = 0.21$, $A$ cannot make the $prob(o = 0) > 0.71$, but might be able to make the
    $prob(o = 0) = 0.7 \le (0.5 + 0.21)$, which is still quite bias! Note that an
    insecure protocol (like the naive first one we saw), the party that receives the
    flip result from the other party first, can force a win, that is, if $A$ gets
    $B$’s result first, it can make $prob(o = 0) = 1.0 \le (0.5 + 0.5)$! That is,
    it is $\epsilon = 1/2$-secure. If there would be an $\epsilon = 0$-secure protocol,
    then it is not only correct but “totally” secure. So, the smaller the $\epsilon$
    the better is the protocol.


    Then, how low can $\epsilon$ get? Note that the range for $\epsilon$ is $0 \le
    \epsilon \le 1/2$ since we are dealing with probabilities, but there are classical
    coin flipping protocols with very much lower $\epsilon$, say some $\epsilon <
    1/2$? It turns out that no strong classical coin flipping protocol can have $\epsilon
    < 1/2$ [Döscher and Keyl, 2002]! This seems contradictory to what we saw earlier
    with coin flipping using bit commitment achieved via the Hash function, where
    we achieved a “pretty good” protocol that seems “rather secure” – but note that
    the security of the protocol relies on parties being computationally bounded to
    be secure, or on not being able to quickly solve computationally hard problems
    such as inverting a hash function (this has been called *computational security*)!
    In a world where the parties have adequate (or unlimited) computational ability
    or plenty of time, then such a protocol is not secure (i.e. we say it is not *information-theoretically
    secure*), and in such a world, more precisely, no classical strong coin flipping
    protocol can have $\epsilon < 1/2$, i.e. $\epsilon = 1/2$, which means that a
    party can (even if the other cannot) indeed completely bias the outcome of the
    protocol. But for weak coin flipping, one can obtain arbitrarily small (non-zero)
    $\epsilon$ [Mochon, 2007; Aharonov et al., 2016].


    What if we use quantum information – would that help? It turns out that a strong
    coin flipping protocol using quantum information can achieve a value for $\epsilon
    < 1/2$, but the smallest $\epsilon$ possible with any quantum strong coin flipping
    protocol is $\epsilon = (\sqrt{2} - 1)/2 \approx 0.207$ as shown by Kitaev, since
    such a protocol must satisfy $P_A^* \cdot P_B^* \ge 1/2$. This means that even
    with quantum information, we cannot get a strong coin flipping protocol with $\epsilon
    = 0$!


    There are other ways to solve the classical coin-flipping problem in practical
    ways which can be secure via computational bounds, and many variants of the problem,
    but we will not discuss these further here, and instead, go ahead to look'
