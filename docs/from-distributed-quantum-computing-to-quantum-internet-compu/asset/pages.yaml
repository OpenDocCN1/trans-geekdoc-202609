    There has been work on taking a large quantum circuit and figuring out ways to
    partition the circuit or to distribute the circuit over a collection of nodes,
    with each node hosting one or more of the qubits, and their associated operations,
    using entanglement to link qubits on different nodes. Several considerations are
    required when distributing a quantum circuit and assigning qubits to nodes, e.g.
    designing (or finding alternative) quantum circuits to minimize internode teleportations
    (while still computing what is required) and since entanglement is a resource,
    one might try to keep entangled qubits between different nodes to a minimum when
    partitioning a circuit. We will not go into the details here but the reader can
    refer to Tang et al. [2021], Sundaram et al. [2021], Andrés-Martínez and Heunen
    [2019], Davarzani et al. [2022], and van Houte et al. [2020]. The reader can also
    look into [Cuomo et al., 2023] for a study on compiling quantum circuits for different
    topologies of nodes.


    The idea of automating the distribution of a (typically large) quantum circuit
    into parts (a collection of smaller quantum circuits) which map to a given topology
    of quantum processing units (or quantum computers) brings us to the notion of
    compilers for distribute quantum programs. The compiler not only could optimize
    for reducing circuit depth but also reducing internode communications or the number
    of internode entangled pairs required (typically a relatively time-consuming process)
    while still performing the required computations, and such compilation should
    be done efficiently [Ferrari et al., 2021] – we come back to this point in Chapter
    6.


