    # 5.2 How to Verify Delegated Private Quantum Computations


    Note that in the above scheme for delegated computation, there is a question of
    trust, whether the client trusts the server to perform the computations that it
    wants the server to perform. While the server cannot know what input it is receiving
    from the client due to the use of the quantum one-time pad, the server might not
    be performing the operation required by the client! How can the client verify
    that when it wants the server to apply an X gate, for example, that the server
    actually performs an X gate operation? The server might actually do nothing or
    apply some other operation. Worse still, the server might not be a quantum computer
    after all and pretending to be one!


    This is a broader issue of verifying quantum computations. Sometimes it is easy
    to verify the result from a quantum computation. For example, for the problem
    of factoring a large number using Shor’s algorithm [Shor, 1994], once the client
    receives the answers from the server (which are suppose to be factors of a given
    large number), the client can do a multiplication to verify if the answers returned
    are indeed factors (and this would be true for other NP problems where verification
    can be done in polynomial time, say). But what about some problems where it is
    difficult, or intractable (at least if using only a classical computer or a client
    with limited quantum computing capabilities) to verify? This problem has been
    discussed extensively elsewhere – e.g. see the review in Gheorghiu et al. [2019].


    Hence, the client, when delegating quantum computations to the server, doesn’t
    just want to hide its data from the server (so-called *private* or *blind quantum
    computing* [Fitzsimons, 2017]) but also verify that the server is honest or performing
    computations correctly (i.e. *verifiability*). Here, we outline and discuss briefly
    the'
