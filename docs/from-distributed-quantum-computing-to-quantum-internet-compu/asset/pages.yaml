    # 6.2.3 Quality of Distributed Entanglement and Entanglement Purification


    We now come to the idea of _entanglement purification_ (or _entanglement distillation_)
    as a way to get higher fidelity entangled states. The idea is to take two noisy
    shared entangled states and yield a shared entangled state which might still be
    noisy but has a higher fidelity, with respect to one of the Bell states, say,
    than the original two states.


    More precisely, we have nodes _A_ and _B_, starting with two (prepared) copies
    of a two qubit state, say \(\rho_{A,B_i}\) and \(\rho_{A,B_j}\). Suppose we want
