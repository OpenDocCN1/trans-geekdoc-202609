    \otimes \mathbf{I})(\mathbf{I} \otimes Z^d) |\psi\rangle

    (since \text{CNOT}(X^a \otimes \mathbf{I}) = (X^a \otimes X^a)\text{CNOT and CNOT}(\mathbf{I}
    \otimes X^c)

    = (\mathbf{I} \otimes X^c)\text{CNOT})

    = (Z^{b+d}X^a \otimes Z^d X^{a+c})(X^a \otimes X^a)(\mathbf{I} \otimes X^c)(Z^b
    \otimes \mathbf{I})(Z^d \otimes Z^d)\text{CNOT} |\psi\rangle

