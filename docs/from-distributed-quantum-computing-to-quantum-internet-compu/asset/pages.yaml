- pgno: 60
  md: '# 3.1 The Power of Entanglement for Distributed Computing


    We introduced the notion of entanglement in Chapter 2. As noted by Cleve and Buhrman
    [1997], no communication actually happens when measuring entangled particles,
    or to put this another way, two parties sharing entangled particles cannot use
    this entanglement to communicate, in this sense: suppose $A$ and $B$ each has
    an ebit, i.e. sharing an entangled pair of qubits, say $\frac{1}{\sqrt{2}}(|00\rangle
    + |11\rangle)$ then when $A$ measures its qubit, and obtains $x$ (either 0 or
    1), then $B$ also obtains the same value $x$, but since $A$ cannot determine before
    measurement what $x$ will be, $A$ cannot choose what to communicate to $B$.


    But a question is whether the entanglement between $A$ and $B$ can, in some way,
    reduce the communication between $A$ and $B$ when performing some computation
    that involves data on $A$ and on $B$. We will see that the answer is yes.


    # 3.1.1 Enabling Distributed Computations with Fewer Bits of Communication


    To make precise what we mean by reducing communication when performing certain
    distributed computations, we first introduce the notion of *communication complexity*.
    Following the exposition in Cleve and Buhrman [1997], suppose we have two different
    machines $A$ and $B$, with $A$ having an $n$-bit string $a = a_1 ... a_n$ and
    $B$ having an $n$-bit string $b = b_1 ... b_n$, and suppose the intended distributed
    computation is the sum (modulo 2) function $f : \{0, 1\}^n \times \{0, 1\}^n \rightarrow
    \{0, 1\}$, which requires the inputs of $A$ and $B$:


    \( f(a, b) = a_1 \oplus \cdots \oplus a_n \oplus b_1 \oplus \cdots \oplus b_n
    \)


    where \(\oplus\) is the addition modulo 2 operation. The minimum number of bits
    that $B$ needs to send to $A$ for $A$ to compute $f(a, b)$ is just one bit, namely,
    the computed result $b_1 \oplus \cdots \oplus b_n$. As an example, consider another
    computation, i.e. inner product (modulo 2) defined as follows:


    \( f(a, b) = (a_1 \cdot b_1) \oplus \cdots \oplus (a_n \cdot b_n) \)


    Then, for $A$ to compute $f(a, b)$, $B$ has no other way but to send all its $n$
    bits, i.e. the minimum number of bits $B$ has to send to $A$ in this case is $n$.
    The minimum number of classical bits that must be sent for $A$ to compute the
    function $f$ is the *communication complexity* of $f$. For example, for the sum
    (modulo 2) function, the communication complexity is 1 whereas for inner product
    it is $n$.


    We will look at three problems where we see the quantum advantage with respect
    to communication complexity.'
