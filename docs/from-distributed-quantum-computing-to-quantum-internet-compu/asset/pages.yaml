  md: 'A review of protocols for verifying delegated quantum computations is by Gheorghiu
    et al. [2019], including techniques based on measurement-based quantum computation
    (which we did not cover in this book). An implementation of verifiable blind quantum
    computing is described in Drmota et al. [2023], where the server is a trapped-ion
    quantum computer and the client is a photonic detection system, with the client
    and server networked using a fiber-optic quantum link.


    # 5.3 Quantum Computing-as-a-Service


    When time on quantum computers is offered as a resource, or as a service, via
    the Internet by a cloud service provider, we have the notion of Quantum Computing-as-a-Service
    (or QaaS). This is already being done by major cloud service providers mentioned
    in Chapter 1. More generally, the execution of quantum circuits would be embedded
    into a program containing both classical computations and quantum computations
    – a programming model is required for this, e.g. a Python program with library
    calls to execute (predefined or user defined) quantum circuits. Response times
    (as well as queuing times), reliability, availability, capacity (e.g. the number
    and “quality” of qubits supported), quality-of-service guarantees, and economic
    cost of quantum program (circuit) executions are among factors to be considered
    when choosing one or more quantum computer providers [Moguel et al., 2022; Sodhi
    and Kapur, 2021; Ravi et al., 2021]. Apart from high-level abstractions, a Web
    front end can be used to help users work with programs that interact with quantum
    computers in the backend [Grossi et al., 2021]. On the cloud server end, when
    the same quantum computer (supporting some fixed number of qubits) is being used
    for running multiple quantum programs (circuits), strategies to do this mapping
    to maintain efficient execution is required, e.g. see Liu and Dou [2021]. Also,
    scenarios of multiple organizations (each with its quantum computer platform)
    sharing quantum computing resources is discussed in Ngoenriang et al. [2022] –
    distributed quantum computing becomes important here to allow the quantum computers
    from multiple organizations to be pooled together for large-scale quantum computations.


    # 5.4 Summary


    We have reviewed mechanisms for a client, with limited quantum capabilities, to
    delegate quantum computations to a more powerful quantum computer. We looked at
    how delegated quantum computations can be obscured so that the server'
