  md: 'Before giving the algorithm, we introduce some notation. So far, we have looked
    at only _balanced_ weak coin flipping protocols, but there are _unbalanced_ weak
    coin flipping protocols (with bias \(\epsilon\)) where if both parties are honest,
    then one party will have probability _q_ of winning and the other party will have
    probability 1-_q_ of winning (in contrast to the balanced protocols, where both
    parties have equal probability 1/2 of winning). An unbalanced weak coin flipping
    protocol with bias \(\epsilon\) is denoted as \(W_{q,\epsilon}\). A balanced weak
    coin flipping protocol with bias \(\epsilon\) is denoted as \(W_\epsilon\).


    # **Leader**(\(\{A_1, \dots, A_n\}, \epsilon\)):


    +   * **Step 1:** Find \(k \in \mathbb{N}\) such that \(2^k \le n < 2^{k+1}\).

    +   * **Step 2:** The first \(2^k\) players \(\{A_1, \dots, A_{2^k}\}\) play a
    tournament among themselves (_k_ rounds) using \(W_\frac{\epsilon}{2}\) to find
    a winner, denoted as _l_<sub>1</sub>.

    +   * **Step 3:** Compute \(l_2 = \text{\textit{Leader}}(\{A_{2^k+1}, \dots, A_n\},
    \epsilon)\)

    +   * **Step 4:** _l_<sub>1</sub> plays _l_<sub>2</sub> using a protocol \(W_{(\frac{2^k}{n}),
    \frac{\epsilon}{2}}\), where \(W_{q'', \frac{\epsilon}{2}}\) denotes a protocol
    such that \(\left|q'' - \frac{2^k}{n}\right| \le \frac{\epsilon}{2}\). The winner
    is the leader.


    We will not repeat here the deep analysis given by Ganz [2017], but comment that
    the protocol is essentially a divide-and-conquer approach with recursive calls,
    and an honest player _A<sub>i</sub>_ has probability of at least \(\frac{1}{n}
    - \epsilon\) of being the leader.


    For leader election, the challenge is not having a trusted mediator and possible
    cheaters. If there was a trusted mediator, the mediator can prepare the _W_ state:
    \(|W\rangle = \frac{1}{\sqrt{3}}(|001\rangle + |010\rangle + |100\rangle)\), or
    its generalizations: \(|W''\rangle = \frac{1}{\sqrt{n}}(|000 \dots 001\rangle
    + |000 \dots 010\rangle + \cdots + |100 \dots 000\rangle)\). And send a qubit
    to each party, and with _n_ parties sharing the state, after measurement, the
    leader is the party with the bit 1.


    # ## 3.2.3 Quantum Key Distribution (QKD)


    Keys are bit strings used for securing data, using encryption and decryption.
    Assuming that two parties want to exchange messages so that one who intercepts
    these messages cannot understand what the messages are. The general idea is that
    a _k_-bit string, for some large enough _k_, is used in an algorithm (denoted
    here by _enc_) to encrypt a message, i.e. convert a message _m_ into a form that
    looks like a random string (and unreadable), and then this encoded string (i.e.
    _enc_(_m_, _k_)) is sent to the destination which can then use an algorithm (denoted
    here by _dec_) to decrypt, using the same key _k_, the transmitted string to extract
    _m_, i.e. _dec_(_enc_(_m_, _k_), _k_) = _m_. For all this to work, both parties
    need to share the secret key _k_.


    How can such a key _k_ be generated and shared among the two parties? There are
    many (classical) ways to distribute such secret keys, among communicating parties.
    But here, we look at quantum approaches to this problem, which has been'
