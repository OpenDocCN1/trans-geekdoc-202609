  md: 'idea of using test runs to detect a dishonest server, from Broadbent [2018],
    i.e. the idea of test runs being interleaved with actual computation runs in such
    a way that the server does not know which type of run it is, so that the server
    cannot adapt or react to avoid or pass such tests.


    Suppose the client wants to apply the circuit C to input \(|0\rangle^{\otimes
    n}\). Note that without loss of generality, we can assume the input is \(|0\rangle^{\otimes
    n}\) since the preparation for an input \(|x\rangle\) can be integrated into the
    circuit, i.e. \(C''|x\rangle = C|0\rangle^{\otimes n} = C''U|0\rangle^{\otimes
    n}\), where \(C = C''U\) and \(|x\rangle = U|0\rangle^{\otimes n}\).


    The client randomly and uniformly chooses one of three possible types of runs
    (without telling the server its choice), sending to the server the quantum one-time
    pad encrypted input \(|0\rangle^{\otimes n}\) and the circuit C; the client also
    sends to the server additional auxiliary qubits required for R-gate gadgets as
    we explain later:


    +   * **Computation run**: The client delegates the actual required computation
    \(C|0\rangle^{\otimes n}\) to the server

    +   * **X-test run**: The client delegates the identity computation on \(|0\rangle^{\otimes
    n}\) to the server

    +   * **Z-test run**: The client delegates the identity computation on \(|+\rangle^{\otimes
    n}\) to the server


    The server does not know which run it has been delegated since it is also given
    the circuit C in any of the above type of run, and the server simply performs
    each operation in C. The idea is that the server''s actions or operations is the
    same in any of the above runs, and it is what the client does on its side that
    determines which type of run has happened, as we explain below.


    The protocol for the runs is similar to what we have seen in Section 5.1, as shown
    in Table 5.1, but there are key differences in the way the R-gate and the H gate
    are performed. Let''s look at how the runs would proceed for each type of gate
    (these procedures which we simply call gadgets), which will then provide an idea
    of how the computation of an entire circuit comprising such gates might be delegated.


    # 5.2.1 X Gate Gadget


    Suppose the client wants to perform the X gate operation on an encrypted qubit
    \(X^a Z^b |\psi\rangle\). We saw earlier that the server can perform an X gate
    operation on the encrypted qubit \(X^a Z^b |\psi\rangle\) to get \(XX^a Z^b |\psi\rangle
    \equiv X^a Z^b X |\psi\rangle\) which the client can decrypt using the keys a,
    b, i.e. using \(Z^b X^a\) to get \(X |\psi\rangle\). Another way to do this is
    actually have the server do nothing and just the client adjusting the keys to
    a'', b'', where \(a'' = a \oplus 1\) and b'' = b; this works since if the server
    sends back the original input \(X^a Z^b |\psi\rangle\), unchanged, then decrypting
    using a'', b'' gives:


    ```

    \(Z^{b''} X^{a''} X^a Z^b |\psi\rangle = Z^b X^{a \oplus 1} X^a Z^b |\psi\rangle
    = Z^b X X^a X^a Z^b |\psi\rangle \equiv X |\psi\rangle\)

    ```


    Note that the client adjusts its keys only in a computation run. Since it intends
    to compute the identity operation in the X-test and Z-test runs, the client does
    not'
