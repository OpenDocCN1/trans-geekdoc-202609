  md: 'More generally, with a generalized GHZ state shared among \( n \) nodes, one
    qubit on each node, and suppose we want to generate an EPR pair between nodes
    \( i \) and \( j \) we can first apply the following operation: \( U = U_1 \otimes
    \cdots \otimes U_n \), where \( U_i = U_j = I \), and \( U_k = H \) for all \(
    k \neq i \) and \( k \neq j \):


    $$

    (U_1 \otimes \cdots \otimes U_n) |GHZ_n\rangle

    = (U_1 \otimes \cdots \otimes U_n)(\frac{1}{\sqrt{2}}|0\rangle^{\otimes n} + \frac{1}{\sqrt{2}}|1\rangle^{\otimes
    n})

    = \frac{1}{\sqrt{2}} |0\rangle_i |0\rangle_j \otimes H^{\otimes(n-2)} |0\rangle^{\otimes(n-2)}
    + \frac{1}{\sqrt{2}} |1\rangle_i |1\rangle_j \otimes H^{\otimes(n-2)} |1\rangle^{\otimes(n-2)}

    $$


    (reordering the qubits so that qubits \( i \) and \( j \) are written to be on
    the left)


    $$

    = \frac{1}{\sqrt{2}} |0\rangle_i |0\rangle_j \otimes \frac{1}{\sqrt{2^{n-2}}}
    \sum_{x \in \{0,1\}^{n-2}} |x\rangle

    + \frac{1}{\sqrt{2}} |1\rangle_i |1\rangle_j \otimes \frac{1}{\sqrt{2^{n-2}}}
    \sum_{y \in \{0,1\}^{n-2}} (-1)^{parity(y)} |y\rangle

    $$


    (where \( parity(y) = parity(y_1 \dots y_{n-2}) = y_1 \oplus \cdots \oplus y_{n-2}
    \), and \( \oplus \) is addition modulo 2 )


    $$

    = |\Phi^+\rangle_{ij} \otimes \frac{1}{\sqrt{2^{n-2}}} \sum_{x \in evenp} |x\rangle
    + |\Phi^-\rangle_{ij} \otimes \frac{1}{\sqrt{2^{n-2}}} \sum_{y \in oddp} |y\rangle

    $$


    (where \( evenp = \{x''|x'' \in \{0, 1\}^{n-2} \text{ and parity (x'') = 0\} \),
    and \( oddp = \{y''|y'' \in \{0, 1\}^{n-2} \text{ and parity (y'') = 1\} \))


    and then when we measure all the qubits except for \( i \) and \( j \), we get
    either (i) a resulting state \( |x\rangle \) where \( x \in evenp \) in which
    case the two nodes \( i \) and \( j \) are left with the shared entangled EPR
    pair \( |\Phi^+\rangle \) or (ii) a resulting state \( |y\rangle \) where \( y
    \in oddp \) in which case the two nodes \( i \) and \( j \) are left with the
    shared entangled EPR pair \( |\Phi^-\rangle \), i.e. either way, the two qubits
    \( i \) and \( j \) are left with an EPR pair. This has potential applications
    for the future quantum Internet where suppose that a multipartite entanglement
    can be shared among \( n \) nodes, then by the nodes applying the appropriate
    operations and measurements, an EPR pair viewed as a resource can be extracted
    for any two winning nodes (e.g. the two nodes chosen to share an EPR pair for
    that round). Also, it is possible to generate GHZ states distributed over multiple
    nodes from fusing bipartite entangled pairs (distributed over pairs of nodes),
    e.g. create an \( n \)-qubit GHZ state from fusing \( (n – 1) \) Bell pairs (as
    suggested by Figure 2.14) – we will see this in Chapter 4, when we see how Bell
    pairs (distributed across nodes) are used for non-local CNOT operations – a discussion
    of more efficient protocols for creating GHZ states from Bell pairs is in de Bone
    et al. [2020].'
