  md: "# 3.1.1.1 The Distributed Three-Party Product Problem\n\nLet's consider an\
    \ example from Cleve and Buhrman [1997], where in the classical case (without\
    \ entanglement), three classical bits of communication is required at minimum,\
    \ whereas with entanglement among machines, only two classical bits of communication\
    \ is enough, that is, entanglement can reduce the communication complexity. We\
    \ have $A$, $B$, and $C$ with $n$-bit strings $x^A$, $x^B$, and $x^C$, respectively,\n\
    \nwith the condition: $x^A \\oplus x^B \\oplus x^C = \\overbrace{1 \\dots 1}^{n}\
    \ = \\mathbf{1}$, where the $\\oplus$ here is bitwise addition (modulo 2), and\
    \ the function $f$ defined as $f(a, b, c) = (a_1 \\cdot b_1 \\cdot c_1) \\oplus\
    \ \\cdots \\oplus (a_n \\cdot b_n \\cdot c_n)$, that is, we want $A$ to compute\
    \ the value\n$f(x^A, x^B, x^C) = (x_1^A \\cdot x_1^B \\cdot x_1^C) \\oplus \\\
    cdots \\oplus (x_n^A \\cdot x_n^B \\cdot x_n^C)$\n\nNote that the condition above\
    \ on $n$-bit strings $x^A$, $x^B$, and $x^C$ makes this problem not quite a “generalization”\
    \ of the inner product we saw earlier (which doesn’t have such a condition on\
    \ the inputs).\n\nWe assume that $A$, $B$, and $C$ share an entangled collection\
    \ of $3n$ qubits, with each having $n$ qubits, i.e. there are $n$ triples of entangled\
    \ qubits, each triple denoted by $\\psi_i^A \\psi_i^B \\psi_i^C$, with $i \\in\
    \ \\{1, \\dots, n\\}$, in an entangled state of the form: $\\rho_{ABC} = \\frac{1}{2}(|001\\\
    rangle + |010\\rangle + |100\\rangle - |111\\rangle)$. Note that this state can\
    \ be obtained from the Greenberger–Horne–Zeilinger (GHZ) state $\\frac{1}{\\sqrt{2}}(|000\\\
    rangle + |111\\rangle)$ via local unitary (or LU) operations (i.e. operations\
    \ done on each machine locally), i.e. up to LU operations, it is equivalent to\
    \ the GHZ state – see **Aside**.\n\n> **Aside:** There could be different possible\
    \ operations; one is as follows:\n> \n> 1. Starting with $\\frac{1}{\\sqrt{2}}(|000\\\
