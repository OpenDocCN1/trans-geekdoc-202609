    are now decoupled from the target qubit.


    # 4.2.3 Cat-Entangler and Cat-Disentangler Modules


    Before going on to other operations beyond the $X$ gate on the target, we observe
    several “modules” used in our previous circuits, which has been called the cat-entangler
    and the cat-disentangler.


    A cat-entangler is a (sub)-circuit of the following form, which takes (i) a qubit
    $\alpha|0\rangle + \beta|1\rangle$ (on the top line) and (ii) a generalized GHZ
    state of the form $\frac{1}{\sqrt{2}}(|0\rangle^{\otimes n} + |1\rangle^{\otimes
    n})$ (which is represented by the other lines and is generated at slice 1 by the
    entangling gate $E_n$) and outputs a cat-like state $\alpha|0\rangle^{\otimes
    n} + \beta|1\rangle^{\otimes n}$ (when we leave out the second qubit).


