    is the Hadamard transform mapping \( |0\rangle \) to \( \frac{1}{\sqrt{2}}(|0\rangle
    + |1\rangle) \) and \( |1\rangle \) to \( \frac{1}{\sqrt{2}}(|0\rangle - |1\rangle)
    \), and measurements are in the standard (or computational) basis:


    +   0. for each \( p \in \{A, B, C\} \):

    +   1. for each \( i \in \{1, ..., n\} \):

    +   2. if \( x_i^p = 0 \) then

    +   3. apply \( H \) to \( \psi_i^p \)

    +   4. else

    +   5. do nothing to \( \psi_i^p \)

    +   6. measure \( \psi_i^p \) yielding bit \( s_i^p \)

    +   7. \( s^p := s_1^p \oplus ... \oplus s_n^p \)


    Then, \( B \) and \( C \) send their results (i.e. \( s^B \) and \( s^C \)) to
    \( A \), which already has \( s^A \), and computes the value \( s^A \oplus s^B
    \oplus s^C \), and since we have the condition \( x^A \oplus x^B \oplus x^C =
    1 \),


    \( s^A \oplus s^B \oplus s^C = f(x^A, x^B, x^C) \)


    and \( A \) has succeeded with only two classical bits being sent to it. Let us
