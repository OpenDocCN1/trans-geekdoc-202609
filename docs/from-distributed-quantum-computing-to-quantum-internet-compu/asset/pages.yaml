  md: 'that is, we have: \(\frac{1}{4^n} \sum_{\mathbf{a}, \mathbf{b} \in \{0,1\}^n}
    \mathbf{X}(\mathbf{a}) \mathbf{Z}(\mathbf{b}) \rho'' \mathbf{Z}(\mathbf{b}) \mathbf{X}(\mathbf{a})
    = \frac{1}{2^n} \mathbf{I}\), where \(\mathbf{X}(\mathbf{a}) = X^{a_1} \otimes
    \cdots \otimes X^{a_n}\) and \(\mathbf{Z}(\mathbf{b}) = Z^{b_1} \otimes \cdots
    \otimes Z^{b_n}\).


    Before proceeding, it is important to note the limitations we are imposing on
    the client. We assume that the client \(A\) is not capable of universal quantum
    computation (and so is using the powerful server \(B\) for this purpose where
    \(B\) can do universal quantum computation, i.e. perform a range of different
    gate operations as we see later), but \(A\) can do the following:


    +   * **Assumption 1**: Prepare and send to \(B\) qubits in states randomly chosen
    from a set of limited possibilities, e.g. to be able to prepare states equivalent
    to the set \(\{|+\rangle = \frac{1}{\sqrt{2}}(|0\rangle + |1\rangle), |-\rangle
    = \frac{1}{\sqrt{2}}(|0\rangle - |1\rangle), |+_y\rangle = \frac{1}{\sqrt{2}}(|0\rangle
    + i|1\rangle), |-_y\rangle = \frac{1}{\sqrt{2}}(|0\rangle - i|1\rangle)\}\) and
    receive qubits from \(B\), and


    +   * **Assumption 2**: Can apply single-qubit Pauli operators (i.e. X and Z)
    in order to encrypt qubits to be sent to \(B\) and to decrypt output qubits received
    from \(B\).


    Consider an example of the use of the quantum one-time pad. \(A\) has \(|\psi\rangle\)
    and then sends an encrypted quantum state to \(B\) (e.g. it actually sends \(|\psi''\rangle
    = XZ |\psi\rangle\) without telling \(B\) that it is using XZ), to get \(B\) to
    apply operations on the state. \(B\) sees the state as effectively \(\frac{1}{2}
    \mathbf{I}\) since it does not know which operation \(A\) used, and so, cannot
    know what really \(|\psi\rangle\) is, even with measurements. Now, suppose \(B\)
    is to help \(A\) perform an X gate on \(|\psi\rangle\), then on receiving \(|\psi''\rangle\),
    \(B\) performs X on it to get \(X |\psi''\rangle\) and sends this back to \(A\).
    \(A\), on receiving \(X |\psi''\rangle\) then applies ZX to it to get:


    \(ZX(X |\psi''\rangle) = ZX(X(XZ |\psi\rangle)) = ZXXXZ |\psi\rangle = -X |\psi\rangle\)


    since \(XX = ZZ = \mathbf{I}\) and \(ZX + XZ = 0\), and we can safely ignore the
    global phase “–”, i.e. \(A\) then gets \(X |\psi\rangle\) which is what it wanted.
    In general, in the case of the X gate operation, the decryption key for encryption
    using the operation \(X^a Z^b\) is to apply \(Z^b X^a\) since


    \(Z^b X^a XX^a Z^b = Z^b XZ^b = \begin{cases} -X, & b = 1 \\ X, & b = 0 \end{cases}\)


    What if \(A\) wanted \(B\) to perform a Z gate instead of the X gate? \(A\) has
    \(|\psi\rangle\) and then sends an encrypted quantum state to \(B\), i.e. choosing
    \(a, b \in \{0, 1\}\) it sends \(|\psi''\rangle = X^a Z^b |\psi\rangle\) without
    telling \(B\) its choice of \(a\) and \(b\), to get \(B\) to apply Z on the state.
    \(B\) performs Z on it to get \(Z |\psi''\rangle\) and sends this back to \(A\).
    \(A\), on receiving \(Z |\psi''\rangle\), then applies \(Z^b X^a\) (similar to
    the case of the X gate) to it to get:


    \(Z^b X^a (Z |\psi''\rangle) = Z^b X^a ZX Z^a Z^b |\psi\rangle = \begin{cases}
    -Z |\psi\rangle, & a = 1 \\ Z |\psi\rangle, & a = 0 \end{cases}\)


    Ignoring the global phase “–”, \(A\) then gets \(Z |\psi\rangle\) as required.'
