- pgno: 17
  md: 'distribution (QKD) protocol, a secure way to share keys used for encryption
    and decryption, called BB84,4 which was later demonstrated experimentally in 1989
    [Bennett et al., 1992]. A brief history of quantum cryptography is given by Brassard
    [2005]. In 1991, Artur Ekert came up with the E91 protocol for QKD [Ekert, 1991].
    We will come back to the topic of QKD later in the book. Further experimental
    demonstrations were then conducted over the years. In the early 2000s, ID Quantique5
    became one of the first companies to bring a QKD product to the commercial market.
    Going beyond just two nodes, the world’s first quantum network became operational
    between 2004 and 2007, demonstrating QKD, i.e. the DARPA Quantum Network.6 Today,
    a Quantum Network architecture standard is being developed with the creation of
    the Quantum Internet Research Group (an Internet Research Task Force [IRTF]).7
    Recent work has continued to conceptualize and develop architecture and applications
    of the quantum Internet, as reviewed in Gyongyosi and Imre [2022], Illiano et
    al. [2022], Wehner et al. [2018], and Rohde [2021]. Quantum-enabled 6G wireless
    networking has been discussed in Wang and Rahman [2022]. We discuss quantum networking
    and the quantum Internet further in Chapter 6.


    At the same time, developments in quantum computing have progressed with (i) important
    work in the 1980s and 1990s, e.g. with the foundational thinking of Deutsch [1985]
    and the invention of quantum algorithms for factoring numbers by Shor [1994, 1999]
    and for quantum search by Grover [1996] and (ii) many other developments in the
    more recent decades, including in the areas of quantum computing applications
    such as quantum simulation [Smith et al., 2019] and quantum machine learning [Biamonte
    et al., 2017; Ramezani et al., 2020; Schuld and Petruccione, 2021]. Several companies
    (big tech and startups)8 and a number of universities have built quantum computers
    or are experimenting with quantum hardware concepts,9 research continues into
    building even larger scale quantum computers, and developing tools and software
    for programming quantum computers toward full quantum computer systems [Ding and
    Chong, 2020] for at least, what John Preskill has called, Noisy Intermediate-Scale
    Quantum (NISQ)'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'computers [Preskill, 2018].10 Also emerged is what has been called quantum
    software engineering [Piattini and Murillo, 2022; De Stefano et al., 2022; Ali
    et al., 2022], concerned with processes, tools, and methodologies for developing
    software that runs on quantum computer systems. A number of companies are also
    providing access to quantum computers via a cloud service model.11 Government
    investments into quantum computing and networking have increased in many countries.12


    Hence, one can see the increasing developments at the intersection of Information
    and Communication Technologies (ICT) and quantum theory, yielding quantum information
    science, which can be described as


    > an emerging field with the potential to cause revolutionary advances in fields
    of science and engineering involving computation, communication, precision measurement,
    and fundamental quantum science. [https://www.nsf.gov/pubs/2000/nsf00101/nsf00101.htm,
    accessed: 8/10/2022]


    And more recently, research into quantum software development, from the information
    technology or computing perspective.


    # 1.2 Distributed Quantum Computing and the Rise of Quantum Internet Computing


    We have been in the Internet or Web Age for some decades now since the early days
    of the Web in the 1990s and the invention of email even earlier. With networked
    computers (wired or wireless) around the world, and computers being pervasive,
    we then have the field of distributed computing, looking into computations (and
    communication protocols) over distributed networked or connected nodes, and the
    Internet of Things, which is concerned with all sorts of things (including everyday
    objects with embedded computers), people and places, becoming connected'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'to the Internet. Distributed computing might be over computers (or nodes) within
    the same room, or the same geographical area, or might utilize nodes geographically
    far apart but connected over the Internet. The latter involves a number of issues
    perhaps not as apparent or on the same scale as when the nodes are local, such
    as increased latency in communications, fault tolerance, heterogeneity, and scalability.
    Distributed computing can go beyond geographically local nodes and involve nodes
    distributed over vast geographical (Internet size) scales (perhaps even interplanetary
    in the future!), and hence, the often used term Internet computing in such cases.


    # 1.2.1 Distributed Quantum Computing


    While work on distributed computing (including mobile and pervasive computing)
    in the recent decades have been mostly on classical (one might call traditional)
    distributed computing, there has been a lot of thinking since the 1990s about
    how quantum mechanics might have an impact on distributed computing.


    Lov Grover proposed the idea of computations with distributed quantum processors
    [Grover, 1997], which he called quantum telecomputation, with respect to the problem
    of finding the average of N real numbers to a given precision, where each node
    has one or more pieces of the data.


    Others studied the communication complexity of quantum distributed system protocols,
    where some computation is to be computed by two or more parties which need to
    send messages to each other, including how having entanglement between nodes might
    help reduce the communications required between the nodes, compared with classical
    versions of the distributed system protocols, and how entanglement might make
    possible some distributed computations not possible classically, e.g. the work
    by Buhrman and Röhrig [2003], Buhrman et al. [2010], Broadbent and Tapp [2008],
    and Cleve and Buhrman [1997] – such work has been called distributed quantum computing,
    dating back to late 1990s and early 2000s. Cirac et al. [1999] studied considerations
    of noisy channels on distributed quantum computations.


    At around the same time, there has been work on non-local quantum gates (viewing
    quantum gates as the quantum analogue of digital logic gates), where quantum computations
    are distributed over two or more nodes [Yimsiriwattana and Lomonaco, 2005; Eisert
    et al., 2000], including a distributed version of Shor''s algorithm mentioned
    earlier [Yimsiriwattana and Lomonaco, 2004], also called distributed quantum computing.


    Since then, more recent work on what might be considered as “(classical) distributed
    computing inspired” distributed quantum computing have taken place, e.g. the work
    by Paredh et al. [2021], Sundaram et al. [2022], Denchev and Pandurangan [2008],
    Andrés-Martínez and Heunen [2019], and Häner et al. [2021],'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'many of which involve work on distributing quantum computations (represented
    as *quantum circuits*, analogous to digital circuits) over multiple nodes.


    Indeed, apart from theoretical studies into quantum communication complexity,
    a key motivation for distributed quantum computing is the ability to utilize multiple
    quantum computers for a given application:


    By connecting a network of limited capacity quantum computers via classical and
    quantum channels, a group of small quantum computers can simulate a quantum computer
    with a large number of qubits. This approach is useful for the development of
    quantum computers because the earliest useful quantum computers will most likely
    hold only a small number of qubits. [Yimsiriwattana and Lomonaco, 2005, p. 131]


    Of course, what “small” meant at that time might be different today, or in the
    NISQ era.


    For a collection of quantum computers to collaboratively perform computations,
    the computers might not just exchange classical information but also quantum information.
    Connecting multiple quantum computers together to perform computations is non-trivial
    and requires not just classical communication (via classical channels) between
    these computers but also quantum communication (via quantum channels) between
    these computers so that quantum information can be transferred between these computers,
    not just classical information. In particular, we will see that two (or more)
    computers can use shared entanglement in order to exchange quantum information.
    An excellent depiction of such a connected set of quantum computers (or one might
    say quantum processing units (QPUs) perhaps analogous to GPUs) is given in DiAdamo
    et al. [2021] and redrawn slightly differently in Figure 1.1. One can observe
    that both types of networks, classical and quantum, are required and when the
    computers are connected not just via a local network but the Internet, the classical
    network becomes the classical Internet and the quantum network becomes the quantum
    Internet. Also needed is a way to manage the programs that will run across multiple
    computers, such as scheduling the (sub)programs on each computer, managing the
    program execution and communications, and coordinating and combining the results
    and so on, i.e. some sort of controller is required though decentralized controllers
    are also discussed in DiAdamo et al. [2021]. There would be greater complexity
    if resources (e.g. QPUs, entanglement generation, and network access) are shared
    by multiple programs and clients wanting to execute their programs.


