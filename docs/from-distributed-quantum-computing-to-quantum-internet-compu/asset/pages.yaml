  md: 'superposition of the four states |00>, |01>, |10>, and |11>. One might notice
    that the four basis states are labeled with the binary representation for the
    numbers 0, 1, 2, and 3, respectively, so that we can write the basis vectors as
    |0>, |1>, |2>, and |3>.


    In general, an n-qubit state \(|\psi\rangle\) can be represented using a \(2^n\)
    dimensional vector with basis vectors of the form \(|0\rangle, \dots, |2^n - 1\rangle\),
    as follows: \(|\psi\rangle = \sum_{i=0}^{2^n-1} \alpha_i |i\rangle\), where \(\sum_{i=0}^{2^n-1}
    |\alpha_i|^2 = 1\), or using the respective binary string representations: \(|\psi\rangle
    = \sum_{x \in \{0,1\}^n} \alpha_x |x\rangle\), where \(\sum_{i=0}^{2^n-1} |\alpha_x|^2
    = 1\). While the state of a qubit is in a vector space, the state of a composite
    (multiple qubit) system is in a tensor product space.


    For multiple qubits, we will use a number of equivalent representations. For example,
    we have the following equalities:


    \(|00\rangle = |0, 0\rangle = |0\rangle |0\rangle = |0\rangle \otimes |0\rangle
    = \begin{bmatrix} 1 \\ 0 \end{bmatrix} \otimes \begin{bmatrix} 1 \\ 0 \end{bmatrix}
    = \begin{bmatrix} 1 \\ 0 \\ 0 \\ 0 \end{bmatrix}\)


    where the operator “⊗” denotes the tensor product operator (see Aside).


    **Aside:** The **tensor product** of two vector spaces \(V\) and \(W\) is denoted
    by \(V \otimes W\), which contains elements spanned by vectors of the form \(|v\rangle
    \otimes |w\rangle\), where \(|v\rangle \in V\) and \(|w\rangle \in W\). The product
    \(|v\rangle \otimes |w\rangle\) is also written as \(|v\rangle |w\rangle\), \(|v,w\rangle\),
    or \(|vw\rangle\). We recall the following properties of tensor products useful
    for calculations: (i) \((|v_1\rangle + |v_2\rangle) \otimes |w\rangle = |v_1\rangle
    |w\rangle + |v_2\rangle |w\rangle\) (ii) \(|v\rangle \otimes (|w_1\rangle + |w_2\rangle)
    = |v\rangle |w_1\rangle + |v\rangle |w_2\rangle\) (iii) \(\alpha(|v\rangle \otimes
    |w\rangle) = (\alpha |v\rangle) \otimes |w\rangle = |v\rangle \otimes (\alpha
    |w\rangle)\) Using a matrix representation, given matrices \(A (m \text{ by }
    n)\) and \(B\), the tensor product \(A \otimes B\) is given by \(A \otimes B =
    \begin{bmatrix} A_{11}B & A_{12}B & \dots & A_{1n}B \\ A_{21}B & A_{22}B & \dots
    & A_{2n}B \\ \vdots & \vdots & \dots & \vdots \\ A_{m1}B & A_{m2}B & \dots & A_{mn}B
    \end{bmatrix}\) A tensor product of \(n\) copies of a matrix \(A\) is denoted
    by \(A^{\otimes n}\). Note that using the fact that \((A \otimes B)(C \otimes
    D) = AC \otimes BD\), given matrix \(A\) and vector \(v\), \(A^{\otimes n} v^{\otimes
    n} = (A \otimes \cdots \otimes A)(v \otimes \cdots \otimes v) = Av \otimes \dots
    \otimes Av\).'
