  md: 'to reduce resources is to use a different approach, depicted in Figure 4.1,
    where a distributed CNOT is performed by teleporting the control qubit to the
    node with the target qubit, i.e. in this case, the control qubit $q_2$ can be
    teleported to QC3 and then used multiple times at QC3 (for the three CNOT operations)
    before being teleported back to QC2. If the number of steps required to create
    the entangled pair (via entanglement swapping) between QC2 and QC3 required for
    the teleportation is $s$ steps (and 2 neighbor entanglement links are consumed),
    $t$ steps are required to perform the teleportation of $|q_2\rangle$ from QC2
    to QC3, three steps to do the three CNOT operations (locally) at QC3, and then
    another $s$ steps to generate the entangled pair between QC2 and QC3 for the teleportation
    back (with another 2 neighbor entanglement links consumed for the entanglement
    swapping), and finally, $t$ steps for the teleportation of $|q_2\rangle$ back
    from QC3 to QC2, then the number of steps required using this approach is $(s
    + t + 3 + s + t) = 2s + 2t + 3$, and $2 + 2 = 4$ neighbor entanglement links are
    consumed. In general, suppose there are $n$ distributed CNOTs to perform instead
    of just 3, then $(s + t + n + s + t) = 2s + 2t + n$ steps are required, and still
    only 4 neighbor entanglement links are consumed. We note here that for large enough
    $n$ (and $|t - d|$ a relatively small constant), $n(s + d) > 2s + 2t + n$, i.e.
    the second approach will be more efficient (using fewer number of steps) and requiring
    fewer neighbor entanglement links! Hence, a compiler should compile the (high-level)
    quantum circuit $C$ into a (low-level) quantum circuit reflecting the second approach
    (when detecting a large enough $n$). Such compiler issues have been discussed
    more comprehensively and in detail in Ferrari et al. [2021] and Wu et al. [2022].


    There are also issues of quantum routing where, for example, there could be multiple
    paths to form entanglement links between two nodes, with different possible performance
    characteristics. Allocation of resources in quantum networks to support distributed
    quantum computing applications is discussed in Ciconetti et al. [2022].


    The quantum network and internetwork architecture are still being researched and
    developed. Corresponding to the current classical Internet architecture which
    uses layers of protocols, a similar layered protocol stack is being developed
    for the quantum Internet. A detailed discussion of current proposals for the quantum
    Internet protocol stack is given in Illiano et al. [2022], and there are standardization
    efforts (as mentioned in Chapter 1).$^{14}$ Hardware/device requirements for distributed
    quantum computing, including entanglement swapping, quantum memory, photon detectors,
    and so on, in the context of space quantum communications, have been identified.$^{15}$
    An experimental demonstration of entanglement using a quantum network stack (including
    layers to generate


