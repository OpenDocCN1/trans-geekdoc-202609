  md: '+   * Case 2: If the measurement result $a'''' = 2$, then $B$ is not able to
    learn anything about the value of $a$, and so continues with the protocol as normal
    and gets the desired result 1 with probability 1/2.


    From the above, $B$ has managed to bias the outcome beyond the uniform probability,
    i.e. since case 1 occurs with probability 1/2, where $B$ is sure to get the outcome
    1, and case 2 occurs with probability 1/2, where $B$ gets 1 with probability 1/2,
    the total probability of the outcome being 1 is $1/2 \cdot 1 + 1/2 \cdot 1/2 =
    3/4$!


    And this is indeed the minimum bias that can be achieved in this protocol [Döscher
    and Keyl, 2002], that is, we have $\epsilon = 0.25 < 1/2$ for this protocol. Is
    there a protocol with a lower bias? As noted earlier, Kitaev showed that the best
    possible bias a strong coin flipping protocol can have is $(\sqrt{2} - 1)/2 \approx
    0.207$, that is, there could be a strong coin flipping protocol with lower bias.
    Indeed, Chailloux and Kerenidis [2009] showed how a strong coin flipping protocol
    with bias $(\sqrt{2} - 1)/2 + O(\epsilon)$ can be constructed, using any weak
    coin-flipping protocol with bias $\epsilon$. But for weak coin flipping, we noted
    earlier that one can obtain arbitrarily small (nonzero) $\epsilon$ as Mochon showed,
    and so, Chailloux and Kerenidis''s method can provide a strong coin flipping protocol
    with bias arbitrarily close to the optimal $(\sqrt{2} - 1)/2$.


    We do not provide a comprehensive survey of quantum coin flipping here, but the
    interested reader can look into the body of work on quantum weak coin flipping,
    including weak coin flipping protocols by Kerenidis and Nayak [2004], Ambainis
    [2004], and Spekkens and Rudolph [2002] with bias less than 0.25, one by Mochon
    with bias 0.192 [Mochon, 2004], a family of protocols with bias 1/6 also by Mochon
    [2005], and a protocol with bias 1/10 [Arora et al., 2019], using some nontrivial
    mathematical techniques.


    There are variations of quantum coin flipping protocols such as coin flipping
    for more than two parties [Ambainis et al., 2004], which uses a weak two-party
    coin flipping protocol between pairs of parties in multiple rounds, and a strong
    coin flipping protocol for the final round to decide the final outcome.


    Quantum coin flipping protocols have been implemented experimentally as far back
    as 2011 and 2014 (e.g. see [Berlín et al., 2011; Pappa et al., 2014]).


    Note that the difficulty is due to the lack of a trusted mediator, and that $A$
    and $B$ don''t trust each other. If there was a trusted mediator, it could send
    to each of $A$ and $B$ one qubit of a shared entangle pair of qubits, (say, $\frac{1}{\sqrt{2}}(|00\rangle
    + |11\rangle)$), and then when they measure their qubits, there is equal probability
    of both getting 0 or both getting 1. For multiparty (more than two parties) coin
    flipping, with a trusted mediator, one could use a generalized GHZ state, $\frac{1}{\sqrt{2}}(|0\dots
    0\rangle + |1\dots 1\rangle)$.'
