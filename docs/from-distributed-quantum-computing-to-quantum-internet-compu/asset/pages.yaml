  md: '> One can see a lot more errors due to E; without E there would not be any
    errors when both A and B are using the same basis (ignoring noisy channels).


    The test for an eavesdropper is done as follows: A and B announce (over the classical
    channel) to each other values \(x_j\) and \(x''_j\) where \(j \in T\) and compute
    the error rate \(err = |W|/|T|\), where \(W = \{j \in T | x_j \neq x''_j\}\) is
    the set of indices where there is a mismatch even when A and B used the same basis.
    So, if the error rate \(err > 0\), then A and B abort the protocol, since there
    is likely an eavesdropper. But if \(err = 0\), then there is likely no eavesdropping
    (though that is no guarantee that it is so since the eavesdropper might indeed
    be super-lucky to be undetected!) the set of bits corresponding to those in S
    but not used for testing, that is, indices in S\T will be a sequence of shared
    bits that will be used by A and B to form the key, i.e. on A''s side, the key
    is \(x_j\) where \(j \in S \setminus T\), and on B''s side, the key is \(x''_j\)
    where \(j \in S \setminus T\). Note that \(|S \setminus T|\) is around \(n/4\).
    In fact due to possible errors in transmission, it may be alright to not abort
    as long as \(err < \epsilon\) for some bound \(\epsilon\) on the error rate. Note
    that we used \(n/4\) bits for testing to check if the remaining \(n/4\) bits would
    be usable – and the tested bits are not the ones used – how does this work? As
    explained in Wolf [2021], and we won''t repeat the argument here, the error rate
    in the sample \(T \subseteq S\) is, with high probability, close to the error
    rate for the whole string (of bits in) S, when \(n\) is large, i.e. a high error
    rate in the sample suggests a high error rate in the whole string, so that testing
    with the sample already provides an adequate picture of the error rate to expect
    with the bits in S \ T.


    +   7. A and B can go through a process called *privacy amplification* (an example
    given below) to further improve security, just in case (e.g. since small errors
    due to transmission is difficult to be differentiated from errors due to eavesdropping),
    which would result in the final key \(k\) of length less than \(|S \ T| = n/4\).


    The idea of privacy amplification is to further improve the secrecy of keys by
    extracting a (smaller) “real key” (of length less than \(n/4\)) to be used from
    the remaining bits indexed in \(S \ T\). One way to do simple privacy amplification
    is to take pairs of bits from \(S \ T\) and XOR them, (or add modulo two, i.e.
    applying \(\oplus\)) to obtain a shorter (but more secure key).\(^12\) There are
    other more sophisticated privacy amplification methods [Wolf, 2021; Van Assche,
    2006].


