- pgno: 205
  md: '# 7 Conclusion


    We have seen that entanglement and teleportation are central concepts for distributed
    quantum computing. With “small” quantum networks (and there are already examples
    [Dowling, 2020; Fü r nkranz, 2020]), there is potential for distributed quantum
    computing over such networks, at least initially. The quantum Internet is still
    nascent, but as it develops, it will allow entanglement and teleportation over
    longer distances in a reliable way, enabling nodes to exchange quantum information
    and work together quantumly across the Internet, beyond just working together
    classically today. Distributed quantum computing will likely happen over such
    small networks first and then scale up as networks get interconnected and the
    quantum Internet emerges.


    Greater software abstraction and software support will be needed including tools
    to support distributed quantum computing and to work with possibly a wide range
    of quantum hardware. Quantum hardware itself is an area of active development,
    with different quantum hardware architectures in experimentation, not just for
    local computations, but for computations involving entanglement and teleportation.
    Also, relevant theory for quantum communications and the quantum Internet is progressing.¹
    Hence, there are developments in theory, practice, applications, hardware, and
    software, as the field progresses.


    This book is perhaps just the tip of the iceberg of a selection of topics, and
    there is much work still to be done, but it is hoped that it can provide newcomers
    a “first taste” of what we have called Quantum Internet Computing.


    1 See the book on “Principles of Quantum Communication Theory: A Modern Approach”
    at https://arxiv.org/pdf/2011.04672.pdf [last accessed: 21/11/2022].'
