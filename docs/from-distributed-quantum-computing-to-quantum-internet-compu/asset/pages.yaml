  md: 'and $B$ has an $n$-bit string $b = b_1 ... b_n$. The problem is to determine
    whether (1) $a = b$, or (2) $a$ and $b$ are different in exactly $n/2$ positions,
    for $n$ an even number (here, we also assume that $n$ is a power of 2), and this
    is a *promise problem* which means that it does not apply to all pairs of strings
    $(x,y) \in \{0, 1\}^n \times \{0, 1\}^n$, but only to those where either (1) or
    (2) is true (clearly, both cannot be true for a given pair of strings).


    An algorithm to solve this problem is as follows, assuming $n = 2^l$ (or $l =
    \log_2 n$):


    +   1. $B$, using $b$ and $l |0\rangle$-qubits, prepares the state $\frac{1}{\sqrt{n}}
    \sum_{i=0}^{n-1} (-1)^{b_i} |i\rangle$; note that the idea here is to encode the
    $n$ bits of information in $b$ in the “signs” (i.e. $(-1)^{b_i}$) of the $n$ components
    of an $l$-qubit state (since $l \ll 2^l$, we are attempting to “get away” with
    transmitting fewer bits). This can be done as follows: (i) apply $H^{\otimes l}$
    on $l |0\rangle$-qubits to obtain the state $\frac{1}{\sqrt{n}} \sum_{i=0}^{n-1}
    |i\rangle$; for example, for $n = 2^3$, $H \otimes H \otimes H |000\rangle = \frac{1}{\sqrt{2}}(|0\rangle
    + |1\rangle) \otimes \frac{1}{\sqrt{2}}(|0\rangle + |1\rangle) \otimes \frac{1}{\sqrt{2}}(|0\rangle
    + |1\rangle) = \frac{1}{\sqrt{2^3}} \sum_{i=0}^{2^3-1} |i\rangle$ (ii) assuming
    there is a unitary operation $U_b$ acting on $(l + 1)$ qubits which maps $|i\rangle
    |p\rangle$ to $|i\rangle |p \oplus b_i\rangle$ (see **Aside**).


    > **Aside:** $U_b$ is unitary, that is, $U_b^\dagger U_b = I$ as we show now.
    Note that the states $|i\rangle|p\rangle$ for $i \in \{0, 1\}^l$ and $b \in \{0,
    1\}$ form a basis, and let \(|\psi\rangle = \sum_{i \in \{0, 1\}^l, p \in \{0,
    1\}} \alpha_{l,p} |i\rangle|p\rangle\), then:

    > $$ \langle \psi | U_b^\dagger U_b | \psi \rangle $$

    > $$ = (U_b | \psi \rangle)^\dagger U_b | \psi \rangle $$

    > $$ = \left( U_b \left( \sum_{i \in \{0, 1\}^l, p \in \{0, 1\}} \alpha_{l,p}
    |i\rangle|p\rangle \right) \right)^\dagger U_b \left( \sum_{i \in \{0, 1\}^l,
    p \in \{0, 1\}} \alpha_{l,p} |i\rangle|p\rangle \right) $$

    > $$ = \left( \sum_{i \in \{0, 1\}^l, p \in \{0, 1\}} \alpha_{l,p} U_b |i\rangle
    |p\rangle \right)^\dagger \left( \sum_{i \in \{0, 1\}^l, p \in \{0, 1\}} \alpha_{l,p}
    U_b |i\rangle |p\rangle \right) $$

    > $$ = \left( \sum_{i \in \{0, 1\}^l, p \in \{0, 1\}} \alpha_{l,p} |i\rangle |p
    \oplus b_i\rangle \right)^\dagger \left( \sum_{i \in \{0, 1\}^l, p \in \{0, 1\}}
    \alpha_{l,p} |i\rangle |p \oplus b_i\rangle \right) $$

    > $$ = \sum_{i \in \{0,1\}^l, p \in \{0,1\}} \alpha_{l,p}^2 \langle i | \langle
    p \oplus b_i | i \rangle | p \oplus b_i \rangle $$

    > $$ = \sum_{i \in \{0,1\}^l, p \in \{0,1\}} \alpha_{l,p}^2 = \langle \psi | \psi
    \rangle $$'
