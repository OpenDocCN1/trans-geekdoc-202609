    \cdots \otimes Z^{b_1} X^{a_1} \right) = \frac{\mathbf{I}}{2^n}\)


    where \(\mathbf{a} = a_1 \dots a_n\) and \(\mathbf{b} = b_1 \dots b_n\) are \(n\)-bit
