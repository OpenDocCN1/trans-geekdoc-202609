    the BB84 protocol which uses quantum information to generate such a shared key
    among two communicating parties.10 QKD is well described in other sources, e.g.
    see Wolf [2021] and Van Assche [2006], but we outline the BB84 protocol here,
    based mainly on the excellent description by Vidick and Wehner.11 In this protocol,
    A basically generates the key and “communicates” it to B but in a way that is
    secure and an eavesdropper would not be able to get the key without being detected.
    We assume that there is a classical channel between A and B.


    +   1. A chooses an n-bit string \(x = x_1 ... x_n \in \{0, 1\}^n\) uniformly
    at random. A also chooses a basis string \(\theta = \theta_1 ... \theta_n\) uniformly
    at random, which determines what basis to encode each bit of \(x\). A transmits
    \(x\) to \(B\) by encoding each bit in a quantum state as follows: \(H^{\theta_j}|x_j\rangle\),
    where \(\theta_j \in \{0, 1\}\), i.e. \(A\) effectively sends \(n\) qubits to
    \(B\). This means that for some \(x_j\), if \(\theta_j = 0\), the computational
    basis is used, and \(x_j\) is encoded as \(|x_j\rangle\) and if \(\theta_j = 1\),
    the Hadamard basis is used, and \(x_j\) is encoded as \(H|x_j\rangle\) (recall
    that \(H |0\rangle = |+\rangle = (|0\rangle + |1\rangle)/\sqrt{2}\) and \(H |1\rangle
    = |-\rangle = (|0\rangle - |1\rangle)/\sqrt{2}\)).


