  md: 'and communication qubits (e.g. the qubits involved in an entangled pair across
    two nodes, with one qubit on each node, which is also called an entanglement link
    in this context as it “links” the two nodes). An extensive study of two different
    quantum architectures for coupling the networking and computing components is
    given in Vardoyan et al. [2022].


    Many of the underlying details of control and scheduling of quantum operations,
    which might vary according to the actual implementation of quits and quantum gates,
    should be abstracted away from programmers. An interesting development is the
    QMPI [Häner et al., 2021] is a quantum extension of the classical MPI (Message
    Passing Interface) that provides a device-independent library for writing distributed
    computing programs. For example, a program using QMPI might use library calls
    to acquire quantum resources, e.g. to request an EPR pair to be generated between
    two nodes, each node invokes the function call:


    ```

    QMPI_Prepare_EPR(qubit, dest, tag, comm)

    ```


    where qubit is a qubit in |0>, dest refers to the destination of a QMPI process
    running on the other node, tag is a message tag, and comm is the communicator
    (referring to a collection of (quantum) nodes). Note that there is also an asynchronous
    version of the call allowing EPR pairs to be acquired ahead of time (of course,
    this is provided the EPR pairs can remain in memory long enough before they decohere!).
    Library operations such as QMPI_Send and QMPI_Recv enable teleporting of qubits,
    and there are also collective operations for multipartite operations, for example,
    the GHZ state can be coded using QMPI, together with the corresponding operations
    for uncomputing (reversing computations).


    # 4.5 Distributed Quantum Computing Without Internode Entanglement


    So far, we have seen how entanglement between nodes (between qubits on the nodes)
    can be used to compute quantum circuits distributed across nodes. But today (at
    least at the time of writing), we have quantum computers (offered via cloud services)
    that don’t communicate quantumly, i.e. no entanglement among two computers. Would
    it still be useful to harness multiple quantum computers which are not connected
    via entanglement?


    The work by Avron et al. [2021] showed that instead of using one n-qubit circuit
    (or quantum computer), it might be better to use two (n − 1)-qubit circuits (or
    quantum computers) to compute an equivalent solution for a particular type of
    function. This means that 2(n − 1) qubits are used instead of n qubits but the
    depth of the (n − 1)-qubit circuits could be much lower than the n-qubit quantum
    circuit for the equivalent computation. Lower depth of a circuit implies a noise
    reduction'
