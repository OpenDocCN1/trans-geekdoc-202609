- pgno: 16
  md: 'and “Bell states,” named after John Bell mentioned above). Some of the experiments
    conducted by the Nobel prize winners investigated and demonstrated a key concept
    in quantum mechanics called entanglement, a term due to physicist Erwin Schrödinger
    in 1935² – informally, a type of “quantum link.”³ One could also think of such
    entanglement between particles (e.g. photons of light) as a type of “resource”
    that will enable the transfer of quantum information over geographical distances
    (a phenomenon called quantum teleportation). We will see that such a resource
    is central to distributed quantum computing and is a key concept in quantum networks.


    As mentioned in the document on the scientific contributions of the 2022 Nobel
    Prize in Physics:


    > This year’s Nobel prize is for experimental work. Apart from the disparities
    in philosophical interpretation, the early Bell experiments drove the development
    of what is often referred to as the ‘Second Quantum Revolution’. Two of this year’s
    laureates, John Clauser and Alain Aspect, are honoured for work that initiated
    a new era, opening the eyes of the physics community to the importance of entanglement,
    and providing techniques for creating, processing and measuring Bell pairs in
    ever more complex and mind-boggling scenarios. The experimental work of the third
    Laureate, Anton Zeilinger, stands out for its innovative use of entanglement and
    Bell pairs, both in curiosity driven fundamental research and in applications
    such as quantum cryptography. [https://www.nobelprize.org/uploads/2022/10/advanced-physicsprize2022.pdf,
    p. 15, accessed: 7/10/2022]


    The Nobel Prize also recognized Anton Zeilinger’s work on entanglement swapping
    and multipartite entanglement, concepts which we will discuss later in the book.


    Since the early experimental work by the Nobel prize winners dating back to the
    early 1970s and 1980s, much has happened in the areas of experimental demonstrations
    of quantum entanglement (over larger geographical scales) and quantum teleportation,
    quantum cryptographic protocols, quantum communications, quantum networking, quantum
    computing, quantum distributed computing, as well as quantum information theory.
    For example, in 1984, Charles Bennett and Gilles Brassard came up with the first
    quantum key


    2 See https://plato.stanford.edu/entries/qt-entangle [last accessed: 8/10/2022].


    3 The word “link” is likely not an accurate description of quantum entanglement,
    but suffices here to paint a mental picture of some kind of connection between
    particles for the purposes of this chapter. Einstein associated it with “spooky
    action at a distance,” which John Bell’s insight and the Nobel Prize winners’
    experiments showed does occur in reality. We discuss entanglement in detail later
    in the book.'
