- pgno: 11
  md: '# Preface


    The book is an outcome of my own journey, in recent years, into quantum computing
    and into a number of topics (detailed later), which can be considered to come
    under the theme of *quantum Internet computing*. This seems to be rather timely,
    since recent years have also seen important developments in quantum computing,
    including companies successfully building (though small/intermediate scale) quantum
    computers and offering access to them over the Cloud, and some momentum toward
    building the quantum Internet, making these topics almost too important to ignore.
    The developments in quantum computing, quantum cryptography, quantum information
    theory, quantum networking, and the quantum Internet in the recent decades have
    led to what has been called “the new quantum age” (to borrow the title from Andrew
    Whitaker’s book) and the “second quantum revolution,” which we are living in today.1


    This book is an attempt to provide an introductory overview of work leading toward
    what I call *quantum Internet computing* at the intersection of work in distributed
    quantum computing and the quantum Internet, where one does distributed computing
    but over Internet-scale distances and systems involving nodes connected via the
    Internet. The notion of quantum Internet computing is based loosely on an analogy
    to *Internet computing* at the intersection of work in distributed computing and
    the Internet. While the quantum Internet and distributed quantum computing can
    be considered nascent, the book attempts a selective introduction to the following
    four key topics which I identify as coming under quantum Internet computing: (i)
    distributed quantum computing, including quantum protocols and theoretical perspectives,
    (ii) distributed quantum computing via nonlocal or distributed quantum gates,
    (iii) delegating


    1 This phrase “second quantum revolution” has been used at the NIST website https://www.nist.gov/physics/introduction-new-quantum-revolution/second-quantum-revolution,
    and in association with developments which the contributions, recognized by the
    2022 Nobel Prize in Physics, drove: https://www.nobelprize.org/uploads/2022/10/advanced-physicsprize2022.pdf
    [last accessed: 7/10/2022].'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'quantum computations, blind quantum computing, and verifying delegated quantum
    computations, and (iv) the quantum Internet, including the concept, and key ideas,
    such as quantum entanglement distillation, and entanglement swapping (where this
    book focuses on the computational aspects, instead of the underlying physics,
    if one accepts such a separation of focus). At the time of writing, distributed
    quantum computers over the quantum Internet can be considered "under construction,"
    though experiments on fundamental concepts have been realized as well as prototypes
    of software working over simulations, and demonstrations of quantum networking
    – so, this book is rather optimistic toward the future.


    The book, in a way, empathizes with newcomers to the subject and attempts to explain
    the concepts for the newcomer to quantum (Internet) computing, having been there
    myself. In short, the book is what I would have liked to have had when starting
    my own journey into these areas, at least to gain an overview of the area. Knowledge
    in the four topics above exists though mainly distributed in the research literature
    and in a range of (very good) online resources (which the book will also point
    out) – this book is an attempt (to the author’s knowledge, the first book) to
    discuss the above four topics under one "umbrella paradigm," here called quantum
    Internet computing.


    Each of the above four topics is emerging as active areas of research, and this
    book, as well, does not attempt a full coverage. The book aims to highlight and
    discuss a selection of key (at least in my opinion) ideas and concepts in the
    literature within those four topics above, and hence, the word "introduction"
    in the title, and given the vastness of the literature on the above topics, one
    might consider this introduction "short"! As a result, the book might appear to
    lack novelty and sophistication since it might not be a complete guide about the
    state of the art in all the above topics (multiple books would be likely needed
    to do so!), but the aim of this book is to introduce readers to certain key (and
    one might say fundamental) ideas that have emerged in the above topics, and perhaps
    "whet the appetite" of readers to go further. Even with the relatively "small"
    sampling of algorithms, protocols, and ideas discussed in this book, one can already
    observe their beauty and ingenuity – which is also partly a reason for the choice
    of topics included. One might consider the book as a "teaser" for a vast area
    of exciting research.


    The book’s approach is to select a range of key ideas and discuss them in depth,
    including detailed calculations often needed in seeing how a protocol or concept
    actually works – this is partly inspired by David McMahon’s book Quantum Computing
    Explained which fairly new to quantum computing (and not the expert who does such
    calculations every day!) to be able to see why certain ideas, algorithms, or protocols
    work; hence, it is an attempt to be pedagogical, providing a "gentle" introduction
    for those who might not have read the research'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'papers upon which the book’s material is based –we refer to and point out the
    original papers and resources for further reading.


    The book is intended for advanced undergraduate and graduate students, researchers
    and practitioners in industry and academia, across different disciplines who might
    be interested in the area of quantum Internet computing and just wanted an introduction
    to the area, or before possibly moving on to technical papers and the research
    literature. However, given my own background in computing, and the style of the
    book, the book should appeal to students and researchers in Computer Science,
    or Information Technology (though it is hoped it might be useful to some physicists
    and mathematicians as well).


    Often, the mathematics and quantum physics knowledge are hurdles to one, who does
    not have such background, trying to learn quantum computing for the first time.
    So, the book does not use a mathematical monograph style with theorems and proofs,
    but attempts a narrative style without sacrificing the mathematical rigour and
    technical details; in so doing, the theoretical Computer Scientist, physicist,
    or mathematician (or student thereof) might find the style of the book rather
    “informal,” and there is little focus on exercises –but the aim is to make the
    book “readable” (perhaps an exercise for the reader is to follow the calculations
    and find errors (if any)!). The main prerequisites for readers would be mainly
    basic linear algebra and probability (and perhaps some perseverance to follow
    calculations!) and some basic background in computing, and though some basic knowledge
    in quantum computing would be helpful, we attempt to provide sufficient background
    for the assiduous reader relatively new to quantum computing (and provide pointers
    to good resources for learning quantum computing for the first time). The book
    can be used as a reference for a first course on quantum Internet computing (though
    perhaps not as a first course on quantum computing), supplemented by selected
    research literature.


    The expert reader might notice that there are some topics missing, e.g. measurement-based
    quantum computation or one-way quantum computing, and quantum error correction
    (each of these topics probably deserves books of its own). The book also does
    not discuss distributed quantum sensing.


    Additional explanations and calculations that could be useful to readers are in
    footnotes as well as marked as Aside. Lastly, the reader is invited to email me
    any inaccuracies or errors found in the book. With the above, let’s get on with
    it!


    October 2023


    Seng W. Loke

    Deakin University, Melbourne, Australia'
  merge: -1
  img_proc: true
