- pgno: 25
  md: 'key considerations when delegating computations. We look at how to delegate
    quantum computations to a quantum server in such a way as to protect the privacy
    of the client''s inputs, that is, the server cannot know the client''s inputs
    while still being able to perform the computations for the client. The chapter
    looks at how the client can verify the server''s computations, or at least detect
    if the server really performed the delegated computations correctly. The chapter
    also looks briefly at the idea of quantum computing as a service (QaaS).

    Chapter 6 discusses some of the key concepts and ideas of the quantum Internet,
    including the central role that entanglement plays, quantum Internet architecture,
    and the concepts of entanglement swapping and entanglement purification, and briefly
    reviews the notion of quantum repeaters.

    Chapter 7 brings the whole book together by connecting the topics discussed in
    the previous chapters and explaining how they would underlie the emerging area
    of quantum Internet computing, complementary to classical Internet computing.


