    # 3.1.2.2 Clauser–Horne–Shimony–Holt (CHSH)


    Let us look at another problem (or one could call this a game!) involving two
    parties A and B, in each round of the game, each receiving one input bit, i_A
    and i_B, respectively, and the problem is for them to compute output bits o_A
    and o_B, respectively, to satisfy the following condition:


    o_A ⊕ o_B = i_A ∧ i_B


    as illustrated in Figure 3.2, without communicating when they received their inputs
    (so, A does not know B''s inputs and conversely). In a round, A and B win provided
    their outputs are such that the above condition is satisfied and lose otherwise.
    If A and B cannot always win, then the aim is for A and B to have some algorithm/strategy
    that will maximize the probability of winning.


    Let us look at a quantum solution for this problem. Assume that A and B have two
    qubits ψ_A ψ_B, one qubit each, in the following shared entangled state between
    them: 1/√2(|00⟩ − |11⟩). Note that this state can be obtained from the state 1/√2(|00⟩
    + |11⟩) by applying I ⊗ Z.


    ![](img/fb3eb7e935470a2da12b03f528f097ee_74_0.png)


    **Figure 3.2** The CHSH game. The referee produces a pair of inputs i_A and i_B
    for A and B in each round, say for N rounds. In each round, A outputs o_A and
    B outputs o_B in response to the inputs and cannot communicate on receiving the
    inputs. In the quantum case, the boxes share an entangled state, a “fresh” one
    for each round. Upon receiving the outputs, the referee checks for the winning
    condition o_A ⊕ o_B = i_A ∧ i_B. A question is: what can A and B do, in the classical
    (and in the quantum case), so that out of N rounds, they win as many rounds as
    possible? And can the quantum case do better (have more wins, on average) than
    the classical case?'
