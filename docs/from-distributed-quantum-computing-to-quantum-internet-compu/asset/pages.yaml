  md: 'direct entanglement links (or neighbor entanglement links) and for end-to-end
    entanglement using entanglement swapping with the direct entanglement links) is
    described in Pompili et al. [2022].


    A lot of the quantum protocols we have seen requires classical communications,
    e.g. quantum teleportation, but we have also seen superdense coding in Chapter
    2, where we can (efficiently) transmit classical information using quantum information.
    The relationship between the quantum Internet and the classical Internet can be
    mutually beneficial; a review on how the quantum Internet can enhance classical
    Internet services is given by Cacciapuoti et al. [2022].


    A topic which we did not discuss much about is distributed quantum sensing, which
    involves measurements on the quantum states resulting from applying unitary operations
    – parameterized by the quantity being measured to an initial (reference) state
    – the reader is referred to Zhang and Zhuang [2021] for further reading. One can
    envision distributed quantum sensing integrated with distributed quantum computations.


    There is an implementation of a number of distributed quantum computing algorithms
    using a simulation tool called QuNetSim [Diadamo et al., 2021],16 and quantum
    networking protocols can be examined via the simulation tool called NetSquid [Coopmans
    et al., 2021].17


    # ### 6.4 Summary


    We have looked at how entanglement could be performed over longer distances and
    the notion of quantum repeaters to increase distances over which qubits might
    be teleported and over which qubits might be entangled. A network of such quantum
    repeaters can support nodes wanting to exchange quantum information or to perform
    nonlocal gates, even if they are far apart. We have also looked at one way to
    increase the fidelity of entangled pairs (though there are others), and we then
    briefly saw how distributed quantum computing happens on over the Internet, including
    challenges.


