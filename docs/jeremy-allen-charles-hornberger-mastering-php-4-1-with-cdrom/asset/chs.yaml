  \n### XML 与 XHTML\n\n如果你的文档和/或 Web 服务器没有说明清楚，你可能还需要指明文档所使用的字符集和文档类型。当你点击“Validate\
  \ This Page”时，W3C 的验证器应用程序将从你的服务器获取文档，对其进行处理，并打印出它发现的任何错误列表。\n\n你也可以直接从你的计算机向服务器上传文件，如果你想要验证的文档不在公共访问的\
  \ Web 服务器上。\n\n若要在本地验证你的文档，你要么需要在 PHP 中通过“黑客手段”引入对验证型 XML 解析器的支持，要么使用诸如随 `libxml`\
  \ 软件自带的 `xmllint` 程序。例如，如果我们尝试验证下面的 XHTML 文档（注意缺少了闭合的 `</p>` 标签）：\n\n```xml\n<?xml\
  \ version=”1.0” encoding=”UTF-8”?>\n\n<!DOCTYPE html PUBLIC “-//W3C//DTD XHTML 1.0\
  \ Strict//EN”\n“http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd”>\n<html xmlns=”http://www.w3.org/1999/xhtml”\
  \ xml:lang=”en” lang=”en”>\n<head>\n\n<title>Hello, World!</title>\n</head>\n<body>\n\
  <p>Hello, World!\n</body>\n</html>\n```\n\n`xmllint` 将抛出以下抱怨：\n\n```bash\n$ xmllint\
  \ --valid doc.xhtml\ndoc.xhtml:11: error: Opening and ending tag mismatch: p and\
  \ body\n</body>\n^\ndoc.xhtml:12: error: Opening and ending tag mismatch: body and\
  \ html\n</html>\n^\ndoc.xhtml:13: error: Premature end of data in tag <html xmlns=”http://www.w3.org\n\
  ```\n\n### XHTML 1.1 中的模块化\n\n尽管 XHTML 1.0 和 XHTML 1.1 之间的主要区别在于新版本是可扩展和可定制的，但这种新功能实际上并非归功于\
  \ XML。发生的情况是 W3C 的分析师、程序员和语言专家将 XHTML 的 DTD 拆分成了独立的模块，每个模块都处理 Web 标记宇宙的一个特定部分。例如，一个模块包含了创建表单所需的所有元素和属性；另一个处理表格；还有一个处理文本。总共，有\
  \ 20 个这样的新模块（如果你算上已弃用但尚未过期的 Style Attribute 模块的话）。表 15.4 显示了 XHTML 1.1 中的模块。\n\n\
  **XHTML**\n**493**\n\n**表 15.4：XHTML 1.1 中的模块**\n\n| 模块名称 | 定义的元素/属性 |\n| :--- |\
  \ :--- |\n| 结构模块 (Structure Module) | body, head, html, title |\n| 文本模块 (Text Module)\
  \ | abbr, acronym, address, blockquote, br, cite, code, dfn, div, em, h1, h2, h3,\
  \ h4, h5, h6, kbd, p, pre, q, samp, span, strong, var |\n| 超文本模块 (Hypertext Module)\
  \ | a |\n| 列表模块 (List Module) | dl, dt, dd, ol, ul, li |\n| 对象模块 (Object Module)\
  \ | object, param |\n| 呈现模块 (Presentation Module) | b, big, hr, i, small, sub, sup,\
  \ tt |\n| 编辑模块 (Edit Module) | del, ins |\n| 双向文本模块 (Bidirectional Text Module)\
  \ | bdo |\n| 表单模块 (Forms Module) | button, fieldset, form, input, label, legend,\
  \ select, optgroup, option, textarea |\n| 表格模块 (Table Module) | caption, col, colgroup,\
  \ table, tbody, td, tfoot, th, thead, tr |\n| 图像模块 (Image Module) | img |\n| 客户端图像映射模块\
  \ (Client-Side Image Map Module) | area, map |\n| 服务端图像映射模块 (Server-Side Image Map\
  \ Module) | ismap |\n| 内生事件模块 (Intrinsic Events Module) | onclick 等事件属性 |\n| 元信息模块\
  \ (Metainformation Module) | meta |\n| 脚本模块 (Scripting Module) | noscript |\n| 样式表模块\
  \ (Stylesheet Module) | style |\n| 样式属性模块（Style Attribute Module）（已弃用） | style |\n\
  | 链接模块 (Link Module) | link |\n| 基础模块 (Base Module) | base |\n| Ruby 模块 (Ruby Module)\
  \ | ruby, rb, rt, rp |\n\n对于文档作者和程序员来说，这种重写意味着这些模块可以组合以创建定制的 XHTML。这允许作者创建定义限制元素集的\
  \ DTD。特定的浏览器可以组合自己的 DTD，规定：“我们只理解以下（小部分）标签，不要给我发送大量的样式表、嵌入对象和 iframe。”然后，一旦他们发布了\
  \ DTD，Web 程序员（如你）就可以使用这些 DTD 构建符合目标平台的 XHTML 文档。此外，如果你需要构建包含独立元素（例如 `fancyobject`）的\
  \ XHTML 文档，你可以编写一个新的 DTD 来扩展 XHTML DTD，为你的文档创建一个新的 `DOCTYPE` 声明指向你的自定义 DTD，并开始在文档中插入\
  \ `<fancyobject>` 标签。\n\n虽然构建新 DTD 的过程超本书的范围，但如果你想了解更多关于模块化 XHTML，我们可以为你指明正确的方向。\n\
  \n首先，你可能想阅读 W3C 关于编写模块化 XHTML 的入门指南，标题恰好为“Building HTML Modules”：`www.w3.org/TR/xhtml-building/`。另一篇值得阅读的概述文档是“XHTML\
  \ Modularization Overview”：`www.w3.org/MarkUp/modularization`。这里有关于使用 DTD 和 XML\
  \ Schema 语言 XHTML 模块的快速介绍：`www.xml.com/lpt/a/2001/05/02/xhtmlm12n.html`。\n\n最后，所有\
  \ XHTML 模块化文档的鼻祖是 W3C 网站上的原始提案，“Modularization of XHTML”：`http://www.w3.org/TR/xhtml-modularization/`。\n\
  \n*注*\n每个模块的 DTD 可以在一个单独的文件找到。换句话说，他们并没有真正改变 DTD 的内容；他们通过“参数化” DTD 的语法来实现这一点。他们还将\
  \ DTD 拆分成了多个文件。\n\n\n\n现在，请想象另一种专门为存储目录而优化的数据库。这些目录服务针对过滤、浏览和读取数据进行了优化。轻量级目录访问协议（`LDAP`）就是此类提供目录服务的解决方案之一。\n\
  \n# LDAP 概览\n\n目录数据库需要快速处理数据复制，同时仍保持快速的响应时间。允许快速的数据复制使得分布式目录成为可能。许多涉及更新密集型数据库的更复杂的事务处理过程被抛弃了，取而代之的是更简单、更轻量级的更新方法。这些数据库在处理大量微小记录（在\
  \ LDAP 术语中称为 `entries`）方面经过了深度的优化。\n\n## LDAP 的历史\n\n在有效理解 LDAP 存在的意义之前，你需要了解它的前身。在\
  \ `LDAP` 之前，有 `X.500`，这是一种比 `LDAP` 服务得多且更复杂的目录服务。由于 `X`500` 相关的开销以及 `X.500` 目录所需的资源，人们设计了一种规模较小的解决方案。最初，`LDAP`\
  \ 是一个用于 `X.500` 目录服务的访问协议。现在已经有了独立的 `LDAP` 进程，例如 `OpenLDAP` 的 `slapd`。`LDAP` 尝试保持轻量级和灵活，不包含不需要的功能。\n\
  \n注意：`OpenLDAP` 是 `LDAP` 的一个开源实现，可以与大多数商业 `LDAP` 实现竞争。配置和管理 `LDAP` 服务器超出了我们的范围。欲需有关\
  \ `LDAP` 的更多信息，请查看 www.openldap.org。\n\n`LDAP` 代表轻量级目录访问协议（Lightweight Directory\
  \ Access Protocol）。`LDAP` 目录服务模型对于如何提供此类服务有特定的观点。`LDAP` 构建于。\n\n# 第 16 章：LDAP\n\n\
  `TCP/IP` 并使用客户端/服务器模型。服务器与客户端通信并将数据存储在数据库后端中。\n\n严格来说，`LDAP` 术语指的是协议，它是 `LDAP` 系统中的一个独立组件。存储数据的目录数据库和服务器是\
  \ `LDAP` 目录的另一个独立组件。构建一个运行的 `LDAP` 系统所需的最后一部分是使用该协议与服务器通信以及反之亦然的客户端。在本章中，`LDAP`\
  \ 术语将泛指这三个组件中的`任何`一个，因为通常 `LDAP` 被认为是这三个组件的整体。\n\n## 数据库后端\n\n所使用的数据库后端并不重要——`LDAP`\
  \ 设计时考虑了灵活性。`LDAP` 甚至可以配置为同时使用多个不同的数据库，并处理给它的查询，返回聚合了这些不同数据库的结果。\n\n## LDAP 数据结构\n\
  \n在 `LDAP` 数据库中，`entries` 类似于 `RDBMS` 中的 `records`。`LDAP` 数据库中的每个条目都有一个独特的名称以唯一标识任何记录。存储在\
  \ `LDAP` 数据库中的数据存储在目录树中，使得数据之间的关系是层级化的。那么，目录树到底是什么样子的呢？\n\n考虑我们的公司 `FooPublishing\
  \ Inc. `，它希望使用 `LDAP` 作为其内网目录服务的后端来建立目录。层次结构的第一部分是公司所在的国家——美国。树的根是国家 `US`。由于公司目前只位于一个州，因此将公司的组织节点直接放置在根节点之下非常方便。`node`\
  \ 仅仅是树中的一个条目。\n\n在组织 `FooPublishing` 之下，我们将放置所有的公司组织单元 (`OUs`）——在这种情况下是部门。每个部门都可以被视为一个独立的\
  \ `OU`。每个 `OU` 将包含一个属于该部门每个个人成员的条目。我们虚构的公司有四个主要部门；公司内的所有其他团队实际上只是这四个部门内人员的特殊分组。`FooPublishing`\
  \ 的部门有 `Acquisitions`（收购）、`Editorial`（编辑）、`Graphics`（图形）和 `Web Development`（网页开发）。每个部门下面都有几名员工。图\
  \ 16.1 展示了每个部门有一两个用户的目录层次结构可能的样子。\n\n### 图 16.1\n\n```\no=US FooPublishing directory\
  \ tree\no=FooPublishing\nou=Graphics\nou=Editorial\nou=WebDev\nou=Acquisitions\n\
  uid=gone\nuid=gtwo\nuid=eone\nuid=wdone\nuid=aone\n```\n\n树中的每个节点都与特定的对象类型相关。`LDAP`\
  \ 目录中的对象类似于 `RDBMS` 中的表。然而，它们仅仅相似；`LDAP` 对象是不同的物种。`LDAP` 数据库中的对象之所以不同，是因为它们可以在不使用额外对象的情况下轻松支持多值属性。在这种情况下，我们目录层次结构的根节点是一个国家对象。我们的公司\
  \ `FooPublishing` 是一个组织对象。每个部门是一个组织单元对象。\n\n最后，数据库中的每个人都是一个人对象。\n\n## 安装 LDAP 客户端库\n\
  \n有几个基本的 `LDAP` 操作，它们大部分与 SQL 数据库的四个主要操作相似：`add`、`modify`、`delete` 和 `search`。\n\
  \n- `Add` 类似于 SQL 的 `INSERT` 语句。\n- `Modify` 类似于 SQL 语句 `UPDATE`。\n- `Delete` 类似于同名的\
  \ SQL 语句。\n- `search` 可以被看作 SQL 的 `SELECT`。\n\n这四个操作是用于操作 `LDAP` 数据库的基本操作。我们将讨论每种操作。\n\
  \n`PHP` 有一个 `LDAP` 客户端；它依赖外部库来与 `LDAP` 服务器通信。这意味着为了让 `PHP` 与 `LDAP` 服务器通信，必须在 `PHP`\
  \ 服务器上可用这些库。我们将使用 `PHP` 详细讨论每种操作。\n\n在 Red Hat 7 系统上使用 `OpenLDAP` 安装客户端库的步骤概述如下：\n\
  \n1. 获取 `openldap-2.0.xx.tgz` 并解压到任意位置，使用 `tar -zxvf openldap-2.0.xx.tgz`\n\n2.\
  \ 解压所有内容后进入：\n```\ncd openldap-2.0.xx\n```\n\n3. 现在我们需要配置 OpenLDAP。我们不想安装守护进程，只需要客户端库：\n\
  ```\n./configure --enable-slapd=no --enable-slurpd=no --with-threads=no\n```\n\n\
  4. 为了编译编译，必须先构建依赖：\n```\nmake depend\nmake\n```\n\n5. 然后安装库：\n```\nsu\nPassword:\
  \ *****\nmake install\n```\n\n6. 同时确保运行 `ldconfig`：\n```\nldconfig\n```\n\n7. 如果一切顺利（应该是），我们可以安装库并重新配置\
  \ `PHP` 安装以启用 `PHP` 客户端接口。在使用当前的 `PHP` 配置时，添加一行：\n```\n--enable-ldap=/usr/local\n\
  ```\n\n在 Windows 系统上，只需使用 `dl` 函数加载 `php_ldap.dll`，或者取消 `php.ini` 文件中像这样的行的注释：\n\
  ```\n;extension=php_ldap.dll\n```\n确保重启服务。\n\n提示：欲需有关编译 `PHP` 的各种方法的更多信息，请参阅附录 A。\n\
  \n一旦安装完成，我们就可以深入研究 `PHP` 和 `LDAP` 的细节。如果你熟悉 `LDAP`，那么 `PHP` 的 `LDAP` 接口将直观，使用 `PHP`\
  \ 客户端库。\n\n## 连接到 LDAP 服务器\n\n在以下示例中，假设 `LDAP` 服务器拥有管理员权限。我们将执行一些需要对 `LDAP` 安装具有完全控制权的操作。\n\
  \n\n\n与互联网上的大多数客户端/服务器通信一样，必须在服务器和客户端之间建立连接。`PHP` 必须首先连接到 `LDAP` 服务器。建立连接后，该连接必须绑定到特定的相对区分名称\
  \ (`RDN`）和密码。\n\nFooPublishing 的编辑的完整区分名称 (`DN`）为：`uid=eone,ou=Editorial,o=FooPublishing,c=US`\n\
  \n用户 ID (`UID`）是组织单元内特定用户的唯一标识符。\n\n`RDN` 是区分名称中的每一个特定部分。每个组件包含一个属性类型，紧接着是一个值。一旦我们将连接绑定到\
  \ `RDN` 和密码，就可以对目录进行操作了。当所有事务完成后，`LDAP` 连接将关闭。\n\n我们将对这一过程进行拆解，包括演示如何“绑定”连接。整个过程与普通的数据库选项非常相似，只是在某些地方有一些细小的不同。首先，列表\
  \ 16.1 展示了如何连接到 `LDAP` 服务器并验证连接是否存在。\n\n**列表 16.1：连接到 LDAP 服务器 (ldap_verify.php)**\n\
  \n```html\n<html>\n<title>Connect To an LDAP server</title>\n<<body>\n<?php\n$host\
  \ = “ldap.bigfoot.com”;\n$bigfoot = ldap_connect($host);\nif(!@$bigfoot)\n{\nprint(“Could\
  \ not connect to LDAP server”);\n}\nelse\n{\nprint(“Succesfully connected to the\
  \ LDAP server<br />”)\nprint(“Closing connection<br />”);\nldap_close($bigfoot);\n\
  }\n?>\n</body>\n</</html>\n```\n\n列表 16.1 只使用了两个 `LDAP` 函数：`ldap_connect()` 和 `ldap_close()`。第一个函数连接到远程\
  \ `LDAP` 服务器。链接标识符存储在变量 `$bigfoot` 中。\n\n`int ldap_connect([string hostname [,int\
  \ port]])`\n\n如果没有向 `ldap_connect()` 传递参数，它将返回当前活动的连接（如果有的话）；否则返回 `False`。如果列表 16.1\
  \ 无法成功连接到 `LDAP` 服务器，它将打印一条消息显示无法连接。如果成功连接到 `LDAP` 服务器，则会打印一条消息表示成功，并使用 `ldap_close()`\
  \ 手动关闭连接。\n\n`int ldap_close(link identifier)`\n\n`ldap_close()` 的唯一参数是待关闭的链接标识符。在\
  \ `PHP` ，`ldap_close()`映射到函数 `ldap_unbind()`，因此调用任何一个函数本质上是一样的。\n\n到目前为止，我们还没有对\
  \ `LDAP` 做过任何实际操作。但你现在将学习如何对 `LDAP` 目录进行简单搜索。\n\n### 搜索 LDAP 目录\n\n为了对 `LDAP` 目录进行任何有用操作（例如成功搜索），必须使用\
  \ `ldap_bind()` 将连接绑定到 `RDN` 和密码：`int ldap_bind([string hostname [, int port]])\
  \ (int link_identifier [, string bind_rdn [, string bind_password]])`\n\n下一个要学习的\
  \ `PHP` 函数 `ldap_search()` 是一个功能非常强大的函数。它接受最多八个参数，其中五个是可选的。在我们搜索 `LDAP` 目录的第一个脚本中，我们将保持一切简单。在绑定\
  \ `LDAP` 连接后，我们可以进行搜索：\n\n`int ldap_search (int link_identifier, string base_dn,\
  \ string filter [, array attributes [, int attrsonly [, int sizelimit [, int timelimit\
  \ [, int deref]]]]]]])`\n\n`ldap_search()` 是一个大函数，几乎专门从 `LDAP` 目录中提取条目。第一个参数是链接标识符。下一个是起始搜索的基础\
  \ `DN`。第三个参数是过滤器或搜索词，发送到我们正在搜索的 `LDAP` 目录。第四个参数在大多数情况下用于限制 `LDAP` 结果集的大小；它是一个包含字符串的数组，指定在搜索结果中返回哪些属性。第五个参数\
  \ `attrsonly` 表示返回每个属性的实际类型。第六个参数限制 `LDAP` 目录返回的记录数。第七个参数限制搜索执行的时间。\n\n第八个也是最后一个参数\
  \ `deref`（代表“取消引用”）定义了如何处理别名。`alias`（别名）指向另一个对象的叶子节点。`leaf node`（叶子节点）是没有节点的节点。`ldap_search()`\
  \ 的第八个参数允许控制遇到别名时的处理方式。\n\n在深入复杂的问题之前，让我们解释搜索 `LDAP` 的一些简单方面。为了练习，我们将使用 `Bigfoot`，这是一个著名的电子邮件数据库，包含大量的电子邮件地址。\n\
  \n在 `LDAP` 中，简单搜索确实很简单。我们只需要三个属性和几行额外的代码就可以执行简单搜索。`LDAP` 支持功能丰富的搜索语法，为过滤数据提供了丰富的接口——这是\
  \ `LDAP` 最擅长的功能之一。列表 16.2 提供了一个搜索整个 Bigfoot 数据库通用名称（common name）属性的接口。\n\n**列表 16.2：搜索\
  \ Bigfoot (search_bigfoot.php)**\n\n```html\n<<html>\n<title>Bigfoot Search</title>\n\
  <body>\n<h3>Search Bigfoot</h3>\n<form method=”POST” action=”<?php echo $PHP_SELF;\
  \ ?>”>\n<p>Name:\n<input name=”search\">\n<?php\n$host = “ldap.bigfoot.com”;\n$bigfoot\
  \ = ldap_connect($host);\nldap_bind($bigfoot, \"\", \"\");\n$search = ldap_search($bigfoot,\
  \ \"\", \"(cn=\".$_POST['search'].\")\");\n$results = ldap_get_entries($bigfoot,\
  \ $search);\nprint “<h4>Found {$results['count']} Matches:</h4>”;\nfor($i = 0; $i\
  \ < $results['count']; $i++)\n{\nprint $results[$i]['cn'][0] . \" - \" . $results[$i]['mail'][0]\
  \ . \"<br />\";\n}\nldap_close($bigfoot);\n?>\n</p>\n</form>\n</body>\n</</html>\n\
  ```\n\n\n\n\n在任何操作中始终进行错误检查都是重要的，特别是当你依赖你无法控制的外部服务时。有几个地方应该被检查为可能的失败点，其中第一个也是最明显的一点是与服务器的实际连接。我们可以简单地检查返回值的真假值来决定脚本是否继续执行。我们可以使用\
  \ `ldap_error()` 函数来捕获任何错误，同时抑制客户端输出错误信息。\n\n```\nstring ldap_error(int link_id)\n\
  ```\n\n`ldap_error()` 函数需要一个参数，即 `link_id`。使用此函数可以控制错误消息显示和处理的位置以及方式。\n\n另一个失败点是\
  \ `ldap_bind()` 函数，它可能因为许多原因而失败，例如凭据无效。另一个可能的失败点是搜索函数，它可能因为无效的搜索或网络故障而失败。我们的下一个版本（列表\
  \ 16.3）尝试改进脚本的错误处理。\n\n**列表 16.3：更好的大脚野搜索 (better_bigfoot.php)**\n\n```html\n<html\n\
  <title>Bigfoot Search</title>\n<head>\n<<body>\n<h3>Search Bigfoot</</h3>\nPHP AND\
  \ LDAP\n503\n<form method=\"post\" action=\"\">\n<p>Name:\n<input name=\"search_name\"\
  \ type=\"text\" length=\"20\" />\n<input name=\"form_submitted\" type=\"hidden\"\
  \ value=\"Search\" />\n<input name=\"submit\" type=\"submit\" value=\"Search\" /></p>\n\
  </form>\n<?php\nfunction handle_ldap_error($link_id)\n{\n    print(\"<p style=\\\
  \"color: red;\\\">\");\n    print(\"LDAP Error: \" . @ldap_error($link_id) . \"\
  <br />\");\n    print(\"Error Number: \" . @ldap_errno($link_id) . \"<br />\");\n\
  \    print(\"</p>\");\n    die();\n}\nif(isset($_POST[\"form_submitted\"]) && strlen(trim($_POST[\"\
  search_name\"])))\n{\n    $host = \"ldap.bigfoot.com\";\n    $bigfoot = ldap_connect($host);\n\
  \    if(!@$bigfoot)\n    {\n        print(\"There was an error connecting to the\
  \ LDAP server\" . $host . \"<br />\");\n        // Either locate to a friendlier\
  \ page or die here\n        handle_ldap_error($bigfoot);\n    }\n    else\n    {\n\
  \        if(!@ldap_bind($bigfoot))\n            handle_ldap_error($bigfoot);\n \
  \       $search = @ldap_search($bigfoot, \"\", \"(cn=\" . $search_name . \")\");\n\
  \        if(!$search) {\n            handle_ldap_error($bigfoot);\n        }\n \
  \       else {\n            $results = ldap_get_entries($bigfoot, $search);\n  \
  \          ldap_close($bigfoot);\n            print(\"<h4>Found {$results[\"count\"\
  ]} Matches:</h4>\");\n            for($i = 0; $i < $results[\"count\"]; $i++) {\n\
  \                print($results[$i][\"cn\"][0] . \" - \" . $results[$i][\"mail\"\
  ][0] . \"<br />\");\n            }\n        }\n    }\n}\n?>\n?>\n</</body>\n</</html>\n\
  ```\n\n504\n\n## 第 16 章\n\n### LDAP\n}\n}\n?>\n\n现在，我们的脚本可以有效地捕获任何 LDAP 错误并能以受控的方式优雅地处理它们。我们定义了自己的的函数\
  \ `handle_ldap_error()`，它需要一个 `link_id` 并使用 `ldap_error()` 报告生成的最后一个 LDAP 错误。使用错误抑制运算符是为了确保向客户端发送我们无法控制的错误。我们的\
  \ `handle_ldap_error()` 函数会向浏览器报告任何错误。在现实场景中，错误很可能会被记录，用户将收到一条不包含任何技术术语的友好消息。\n\n\
  *注意*\n*LDAP 搜索支持丰富的查询语言，允许进行复杂的查询，以检索非常特定的数据。*\n*有关 LDAP 过滤过滤语法的更多信息，请参阅 http://developer.netscape.com/docs/manuals/directory/41/ag/find.htm\
  \ ..*\n\n现在我们已经知道如何安全地处理 LDAP 函数可能抛给我们的任何错误，并且已经在允许匿名搜索的公共 LDAP 服务器上执行了基础搜索。现在，我们将在自己的\
  \ LDAP 服务器上创建自己的层级结构，并学习如何在 LDAP 目录中添加、修改和删除条目。\n\n### 编译 LDAP 守护进程\n\n既然我们已经看到了如何查询\
  \ LDAP 数据库，现在准备好创建 FooPublishing 目录服务数据库了。这我们需要自己的 LDAP 服务器。我们在 Red Hat 7 上成功使用了\
  \ OpenLDAP 2.0.18 版本。如果你在编译带线程 OpenLDAP 包时遇到困难，只需在配置 OpenLDAP 时使用以下命令行即可让一切运行起来：\n\
  \n```\n./configure --enable-slapd=yes --enable-slurpd=no --with-threads\n```\n\n\
  没有线程的情况下，服务器将没有良好的性能，但它仍然可以正常工作。对于安装过程来说，其他部分都是一样的。\n\n*注意*\n*slapd 的配置文件位于 `slapd.conf`。我们的文件将如列表\
  \ 16.4 所示：\n\n505\n\n**列表 16.4：slapd.conf**\n\n```\n# 数据库目录在运行 slapd 之前必须存在\n# 应仅允许\
  \ root 访问。建议模式 700\ndirectory /var/lib/ldap\n# 索引\nindex objectClass eq\n```\n\n\
  *警告*\n*注意 slurpd 守护进程处理 LDAP 目录的复制；在这里它被禁用了，因为我们不需要*\n\n在默认安装情况下，slapd 的配置文件位于 `/usr/local/etc/slapd.conf`。\n\
  \n包含包含指令的三个行：\n\n`include /usr/local/etc/ldap/schema/core.schema\ninclude /usr/local/etc/ldap/schema/cosine.schema\n\
  include /usr/local/etc/ldap/schema/inetorgperson.schema`\n\n是定义对象类型的地方。*schema*\
  \ 定义了属性和对象的规则。schema 可以被视为表定义。schema 的语法超出了本章范围，通常不需要新的或修改的 schema。\n\n一旦创建了配置文件，就可以启动守护进程，我们可以在\
  \ LDAP 数据库上操作。使用以下命令启动 LDAP 守护进程：\n\n```\n/usr/local/libexec/slapd\n```\n\n现在，我们可以修改列表\
  \ 16.1 中的条目，以验证我们的新 LDAP 服务是否运行正常。更改 `$host` 变量指向运行 LDAP 服务的主机并重新运行脚本。如果没有发生错误，说明连接成功。如果操作看起来失败，LDAP\
  \ 守护进程支持调试。杀死 slapd 进程并使用以下命令重启：\n\n```\n/usr/local/libexec/slapd -d 4\n```\n\n\
  -d 开启调试，并将级别设置为足够的水平，应该报告数据库中发生的任何我们需要了解的事务。\n\n既然我们已经看到了如何搜索 LDAP 目录，现在我们将创建自己的目录。我们将使用图\
  \ 16.1 作为我们目录结构的参考。我们将使用的唯一新函数是 `ldap_add()`。\n\n\n\n\n\n`int ldap_add(int link_identifier,\
  \ string dn, array entry)`\n\n`ldap_add()` 只需要三个参数。第一个是 LDAP 连接标识符。下一个参数是我们要添加的条目的区分名称（DN），最后一个是一个数组。数组中的每个元素都代表与关联\
  \ `DN` 的一个属性。列表 16.5 为 `FooPublishing` 建立了目录树。\n\n**列表 16.5：创建 FooPublishing 层级结构\
  \ (create_foopub.php)**\n\n```html\n<html\n<head>\n<title>Create FooPublishing</title>\n\
  </head>\n<body>\n<?php\nfunction handle_ldap_error($link_id)\n{\nprint(“<p style=\\\
  ”color: red;\\\\>”);\nprint(“LDAP Error: “ . @ldap\\_error($link_id) . “<br />”);\n\
  print(“Error Number: “ . @ldap\\_errno($link_id) . “<br />”);\nprint(“</p>”);\n\
  die();\n}\n\nPHP AND LDAP\n\n**507**\n$host = “x.x.x.x”;\n$foopub = ldap_connect($host);\n\
  if(!@$foopub)\n{\nprint(“There was an error connecting to the LDAP server $host<br\
  \ />”); handle_ldap_error($foopub); // Locate to a friendlier page or die here\n\
  }\nelse\n{\nif(!@ldap_bind($foopub, “cn=root,o=FooPub,c=US”, “secret”))\nhandle_ldap_error($foopub);\n\
  $entry = array();\n$entry\\[“o”\\] = “FooPub”;\n$entry\\[“objectClass”\\] = “organization”;\n\
  $entry\\[“description”\\] = “FooPublishing Inc.”;\nldap_add($foopub, “o=FooPub,c=US”,\
  \ $entry);\n$entry = array();\n$entry\\[“objectClass”\\] = “organizationalUnit”;\n\
  $entry\\[“ou”\\] = “Editorial”;\n$entry\\[“description”\\] = “Main editorial staff\
  \ (cleans up others’ mess)”; ldap_add($foopub, “ou=Editorial,o=FooPub,c=US”, $entry);\n\
  $entry = array();\n$entry\\[“objectClass”\\] = “organizationalUnit”;\n$entry\\[“ou”\\\
  ] = “Graphics”;\n$entry\\[“description”\\] = “Graphics department”;\nldap_add($foopub,\
  \ “ou=Graphics,o=FooPub,c=US”, $entry);\n$entry = array();\n$entry\\[“objectClass”\\\
  ] = “organizationalUnit”;\n$entry\\[“ou”\\] = “WebDev”;\n$entry\\[“description”\\\
  ] = “Web development department”;\nldap_add($foopub, “ou=WebDev,o=FooPub,c=US”,\
  \ $entry);\n$entry = array();\n$entry\\[“objectClass”\\] = “organizationalUnit”;\n\
  $entry\\[“ou”\\] = “Acquisitions”;\n$entry\\[“description”\\] = “Acquires and develops\
  \ new authors (poor souls)”; ldap_add($foopub, “ou=Acquisitions,o=FooPub,c=US”,\
  \ $entry);\n$departments = array(“Editorial”, “Graphics”, “WebDev”, “Acquisitions”);\
  \ for($i = 0; $i < count($departments); $i++)\n{\n**508**\n## Chapter 16\n### LDAP\n\
  for($j = 0; $j < 3; $j++)\n{\n$entry = array();\n$entry\\[“cn”\\] = “{$departments\\\
  [$i\\]} $j”;\n$entry\\[“sn”\\] = $j;\n$entry\\[“objectClass”\\] = “top”;\n$entry\\\
  [“objectClass”\\] = “person”;\n$entry\\[“objectClass”\\] = “organizationalPerson”;\n\
  $entry\\[“objectClass”\\] = “inetOrgPerson”;\n$entry\\[“l”\\] = “Atlanta”;\n$entry\\\
  [“mail”\\] = substr($departments\\[$i\\], 0, 1) .\n“$j@foopublishing.com”;\n$entry\\\
  [“telephonenumber”\\] = “($j$j$j)-$j$j$j-$j$j$j$j”;\n$entry\\[“description”\\] =\
  \ “The $j number {$departments\\[$i\\]} person.”; ldap_add($foopub,\n“uid={$departments\\\
  [$i\\]}$j, ou={$departments\\[$i\\]},o=FooPub,c=US”,\n$entry);\n}\n}\nprint(“FooPublishing\
  \ Created”);\nldap_close($foopub);\n}\n?>\n</body>\n</html>\n```\n列表 16.4 是一个长脚本，创建了整个\
  \ `FooPublishing Inc.` 层级树。该脚本没有执行任何革命性的操作，除了 `ldap_add()` 之外没有使用任何新函数。连接的建立和绑定方式与我们之前的脚本相同。然而，这次我们用于绑定连接的凭据将赋予我们对\
  \ LDAP 数据库执行任何合法操作的权限。`entry` 数组的每个键指定属性类型，而每个值是该特定属性的值。\n\n虽然分配给每个部门个人的名字相当普通，但我们现在有了一个可以摆弄的数据层级结构。每个部门都分配了三个人，为我们提供了一个基础架构图。`ldap_add()`\
  \ 仅仅是将它收到的任何内容填充到数据库中。注意，我们可以使用 `ldap_add()` 向目录添加条目，前提是父节点存在。\n\n**LDIF：数据交换格式**\n\
  \nLDIF 是一种用于交换数据的人类读格式。虽然 PHP 有自己的接口来添加条目，但 LDIF 设计上是人类可读且可处理的。\n\n**修改条目**\n\n\
  现在我们创建了层级结构，我们需要能够修改它。这意味着使用 `ldap_modify()` 来修改现有节点。\n\n**列表 16.6：修改条目 (modify.php)**\n\
  \n```html\n<html>\n<head>\n<title>Modify Entry</title>\n</head>\n<body>\n<?php\n\
  function handle_ldap_error($link_id)\n{\nprint(“<p style=\\”color: red;\\\\>”);\n\
  print(“LDAP Error: “ . @ldap\\_error($link_id) . “<br />”);\nprint(“Error Number:\
  \ “ . @ldap\\_errno($link_id) . “<br />”);\nprint(“</p>”);\ndie();\n}\n\n/* 处理连接到\
  \ LDAP 数据库 */\n$host = “x.x.x.x”;\n$foopub = ldap_connect($host);\nif(!@$foopub)\n\
  {\nprint(“There was an error connecting to the LDAP server $host<br />”); handle_ldap_error($foopub);\
  \ // Locate to a friendlier page or die here\n}\nelse\n{\nif(!@ldap_bind($foopub,\
  \ “cn=root,o=FooPub,c=US”, “secret”))\nhandle_ldap_error($foopub);\n$dn = “ou=Editorial,o=FooPub,c=US”;\n\
  $entry = array();\n$entry\\[“objectClass”\\] = “organizationalUnit”;\n$entry\\[“description”\\\
  ] = “The new, improved Editorial!”\n\n**510**\nif(!@ldap_modify($foopub, $dn, $entry))\n\
  handle_ldap_error($foopub);\n}\n?>\n</body>\n</html>\n```\n列表 16.6 是一个简单的脚本。它使用\
  \ `ldap_modify()` 函数修改现有节点。`ldap_modify()` 与 `ldap_add()` 非常相似。`ldap_modify()` 的\
  \ `entry` 数组仅包含我们要修改的属性。修改现有属性类似于使用 `UPDATE` 语句。\n\n**删除条目**\n\n现在你学会了 LDAP 目录中的所有操作，除了删除条目。要删除条目，你只需要知道条目的区分名称（DN）。如果在我们要尝试删除的条目下方有任何条目，则删除操作将失败。在删除父节点之前，必须从树中移除所有子节点。\n\
  \n假设我们的公司现在辞掉那个让整个部门闻起来奇怪的网页开发者。我们将使用 `ldap_delete()` 根据其人类罪行终结网页开发者 W2。\n\n**列表\
  \ 16.7：删除条目 (delete.php)**\n\n```php\n<?php\nfunction handle_ldap_error($link_id)\n\
  {\nprint(“<p style=\\”color: red;\\\\>”);\nprint(“LDAP Error: “ . @ldap\\_error($link_id)\
  \ . “<br />”);\nprint(“Error Number: “ . @ldap\\_errno($link_id) . “<br />”);\n\
  print(“</p>”);\ndie();\n}\n?>\n```\n\n\n\n\n```php\nprint(\"Error Number: \" . @ldap_errno($link_id)\
  \ . \"<br />\");\n\nprint(\"</p>\");\n\ndie();\n\n}\n```\n\n# PHP 与 LDAP\n\n**511**\n\
  \n```php\n/* Handle connecting to the LDAP database */\n$host = \"x.x.x.x\";\n$foopub\
  \ = ldap_connect($host);\n\nif(!@$foopub)\n{\n    print(\"There was an error connecting\
  \ to the LDAP server $host<br />\"); \n    handle_ldap_error($foopub); // Locate\
  \ to a friendlier page or die here\n}\nelse\n{\n    if(!@ldap_bind($foopub, \"cn=root,o=FooPub,c=US\"\
  , \"secret\"))\n        handle_ldap_error($foopub);\n    // Specify the distinguished\
  \ name to be deleted\n    $dn = \"uid=WebDev2,ou=WebDev,o=FooPub,c=US\";\n    if(!@ldap_delete($foopub,\
  \ $dn))\n        handle_ldap_error($foopub);\n}\n?>\n\n```\n\n```html\n<html>\n\
  <head>\n    <title>删除节点</title>\n</head>\n<body>\n    删除 LDAP 条目\n</body>\n</html>\n\
  ```\n\n执行完列表 16.7 中的脚本后，个人用户 `WebDev2` 已经从我们的目录中被删除。\n\n删除条目的操作就是这些了。只要用于绑定连接的凭据允许删除记录，该操作就会成功。\n\
  \n## LDAP 杂项\n\n现在我们已经涵盖了 LDAP 的核心操作，并且可以按照自己的意愿有效地操纵树形结构，我们应该查看一些可能很有用的 LDAP 杂项函数。\n\
  \n我们之前忽略的一点是向现有的 LDAP 条目添加新属性。假设一个部门的所有成员都要分配一个新属性，即职位名称。现在 WebDev 部门的每个人都拥有“Web\
  \ Developer”（Web 开发人员）职位。\n\n首先，我们可以搜索目录并提取整个 WebDev 部门。提取该部门后，我们可以遍历每个开发者并添加所需的属性。`ldap_mod_add()`\
  \ 函数提供了向条目添加属性的所需功能。列表 16.8 展示了 `ldap_mod_add()` 的功能。\n\n**512**\n\n## 第 16 章\n\n\
  ### LDAP\n\n### 列表 16.8：向条目添加属性 (ldap_mod_add.php)\n\n```php\n<?php\nfunction handle_ldap_error($link_id)\n\
  {\n    print(\"<p style=\\\"color: red;\\\">\");\n    print(\"LDAP Error: \" . @ldap_error($link_id)\
  \ . \"<br />\");\n    print(\"Error Number: \" . @ldap_errno($link_id) . \"<br />\"\
  );\n    print(\"</p>\");\n    die();\n}\n\n/* Handle connecting to the LDAP database\
  \ */\n$host = \"x.x.x.x\";\n$foopub = ldap_connect($host);\n\nif(!@$foopub)\n{\n\
  \    print(\"There was an error connecting to the LDAP server $host<br />\"); \n\
  \    handle_ldap_error($foopub); // Locate to a friendlier page or die here\n}\n\
  else\n{\n    if(!@ldap_bind($foopub, \"cn=root,o=FooPub,c=US\", \"secret\"))\n \
  \       handle_ldap_error($foopub);\n    /* Grab all of the departments */\n   \
  \ $search = ldap_search($foopub, \"ou=WebDev,o=FooPub,c=US\", \"cn=*\"); \n    $results\
  \ = ldap_get_entries($foopub, $search);\n\n    $new_attr[\"title\"] = \"Web Developer\"\
  ;\n    for($i = 0; $i < $results[\"count\"]; $i++)\n    {\n        $dn_arr = ldap_explode_dn($results[$i][\"\
  dn\"], 1);\n        $uid = $dn_arr[0];\n        $dn = \"uid=$uid,ou=WebDev,o=FooPub,c=US\"\
  ;\n        if(!@ldap_mod_add($foopub, $dn, $new_attr))\n            handle_ldap_error($foopub);\n\
  \    }\n}\n?>\n```\n\n```html\n<html>\n<head>\n    <title>添加属性</title>\n</head>\n\
  PHP 与 LDAP\n**513**\n<body>\n    已添加属性\n</body>\n</html>\n```\n\n列表 16.8 利用了两个非常有用的\
  \ LDAP 数据处理函数，为我们的两个 Web 开发人员添加标题属性。`ldap_explode_dn()` 和 `ldap_dn2ufn()` 都让更新 Web\
  \ 开发部门变得更容易。第一个函数需要两个参数；该函数的原型为\n\n`array ldap_explode_dn(string dn, int with_attrib)`\n\
  \n该函数的功能类似于 `explode()` 函数，但它专门处理 LDAP 区分名（distinguished names）。传入的第一个参数是要解析的区分名。如果我们想要同时属性名称和值，应该在\
  \ `ldap_explode_dn()` 的第二个参数中传入 `0`。如果向第二个参数中传入 `1`，则只返回值，这正是列表 16.8 获取用户 ID (`UID`)\
  \ 所需的内容。`UID` 并没有存储为条目的属性，因此必须从 `DN` 中解析。\n\n我们目录树的最终版本看起来类似于图 16.3。\n\n**图 16.3**\n\
  \no=US\nFooPublishing\n树形结构\nFooPublishing\nAcquisitions\nEditorial\nGraphics\n\
  WebDev\nAcquisitions0\nEditorial0\nGraphics0\nWebDev0\nAcquisitions1\nEditorial1\n\
  Graphics1\nWebDev1\nAcquisitions2\nEditorial2\nGraphics2\nWebDev2\n\n如果你想转储 LDAP\
  \ 内容，可以使用 `/usr/local/sbin/apcat`。该程序将以 LDIF 格式导出数据库的内容。\n\n现在你已经学习了 LDAP 的基础知识以及如何使用客户端库修改和查询数据库。\n\
  \n本页特意留白。\n\n*本页留白*\n\n\n\n\n文档通常不是免费的；我们在本章中将用于动态生成 PDF 文档的库 `PDFlib` 对非商业用途免费，但在商业环境中部署可能需要花费数千美元甚至更多。许多其他处理\
  \ PDF 文档的工具甚至更贵。\n\n## PHP 和 PDFlib\n\n`PDFlib` 库由程序员 Thomas Merz 编写并由德国公司 `PDFlib\
  \ GmbH` 发布，它是生成 PDF 文档的两个 PHP 扩展之一的体，而我们将使用它来生成我们的 PDF 文档。与大多数其他 PHP 扩展不同，`PDFlib`\
  \ 并不是免费软件。虽然源代码是开放的，你可以在个人项目中免费使用它，但在商业中使用 `PDFlib` 时，必须支付许可费用。许可详情请参阅 http://www.pdflib.com。\n\
  \n注意： 另一个 PDF 扩展是 `ClibPDF`，它是基于来自 `FastIO Systems` 的 `ClibPDF` 库构建的。`ClibPDF` 提供了与\
  \ `PDFlib` 非常相似的功能（因为它们都基于 Adobe 的 PDF 标准），并带有类似的许可协议。你可以轻松地调整本章中几乎所有的示例，以用于 `ClibPDF`。\n\
  \n## 安装 PDFlib (或 ClibPDF)\n\n要使用 `PDFlib`，你需要确保计算机上安装了 `PDFlib` 软件并在 PHP 中启用了它的支持。\n\
  \n在 Unix/Linux 系统下，你必须从 www.pdflib.com 获取源代码，编译并安装 `PDFlib`。过程非常简单（`configure; make;\
  \ make install`），指令包含在源码分发的 `readme.txt` 文件中。`doc` 目录下的 `readme_unix.txt` 文件包含了额外的提示。一旦你在系统上安装了\
  \ `PDFlib`（或者如果已经安装，找到了它的位置），你就需要使用 `--with-pdf` 选项重新配置 PHP 并重新构建它。如果你的 `PDFlib`\
  \ 安装在 `/usr/local`以外的地方，你可以使用：\n\n```\n--with-pdf=/path/to/dir-containing-libpdf-*-files\n\
  ```\n\n告诉安装程序去哪里寻找你的 `PDFlib` 库。（如果你作为静态 Apache 模块运行它，你还需要重新构建 Apache。）\n\n在 Windows\
  \ 下，你只需要在 `php.ini` 文件中取消该行的注释：\n\n```\nextension=php_pdf.dll\n```\n\n并重启 Web 服务器。\n\
  \n如果你使用的是 `ClibPDF` 而不是 `PDFlib`，则适用于相同的指令；只需改用 `--with-cpdf`（Unix 下）或 `extension=php_cpdf.dll`（Windows\
  \ 下）即可。\n\n注意： 在配置 PHP 支持 `PDFlib` 或 `ClibPDF` 时，你还可以指定用于处理不同格式图像文件（JPEG、TIFF，以及使用\
  \ `PDFlib` 的 PNG）的库。请参阅你的 PDF 库附的文档以及 www.php.net/manual/en/install.configure.php\
  \ 中的 PHP 配置说明。\n\n## 理解 PDFlib\n\n`PDFlib` 是一个用于构建 PDF 文件的完整库（`ClibPDF` 几乎是一样的，只有细微差别）。它提供了一个你可以通过\
  \ PHP 访问的 API，你可以用它创建文档、为文档添加页面、在页面上添加文本、图像、书签和超链接等。你可以在 PDF 文档的页面上绘制任意形状——线条、弧线和圆；为文档附加文件；指定颜色、轮廓和填充；等等。\n\
  \n`PDFlib` 并不限于 PHP（尽管这显然是我们我们要讨论的内容）。更广泛地说，`PDFlib` 是一个用 `C` 编写的软件包，允许使用任何语言（无论是\
  \ PHP、C++` 还是 Python）的程序员生成 PDF 文档。要使用它，你只需将 `PDFlib` 库链接到你的程序并开始使用它们提供的函数。当你为 PHP\
  \ 配置（并在必要时编译）对 `PDFlib` 的支持时，你所做的是将 `PDFlib` 库链接到 PHP 引擎。一旦完成，就可以使用了。并不是严格需要使用像\
  \ `PDFlib`（或 `ClibPDF`）这样的库来生成 PDF 文档。事实上，你可以使用任何文字处理器编写有效的 PDF 文档。列表 17.1 显示了一个我们使用记事本编写的简单\
  \ PDF 文档。\n\n### 列表 17.1：手写的简单 PDF 文档\n\n```\n%PDF-1.3\n1 0 obj\n<< /Type /Catalog\n\
  /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages\n/Kids [3 0 R]\n/Count 1 >>\n\
  endobj\n3 0 obj\n<< /Type /Page\n/Parent 2 0 R\n/Contents 4 0 R\n/Resources /Font\
  \ << /F13 5 0 R >>\n/MediaBox [0 0 612 792] >>\nendobj\n4 0 obj\n<< /Length 73 >>\n\
  stream\nBT\n/F13 24 Tf\n40 728 Td\n(Hello, World!) Tj\nET\nendstream\nendobj\ntrailer\n\
  << /Size 5\n/Root 0  R >>\n%%EOF\n```\n\n如果你盯着列表 17.1 中的代码看一会儿，你可能就能猜出它是如何工作的：你只需要创建若干对象，包括文档目录、页面树和内容流，这样就足够了：一个完整的\
  \ PDF 文档。诚然，列表 17.1 中的代码显示了一个我们使用记事本编写的简单 PDF 文档，在 Adobe Acrobat 中打开的图 17.1 中——它做的只是显示\
  \ 18 点的“Hello World!”——对象通过数字代码标识（`1 0` 是根目录的标识符），对象之间可以相互引用。总的来说，这不是一个困难的系统。图 17.1\
  \ 是该代码表示的文档。然而，现实世界的 PDF 文档从不如此。你可以想象，使用文字处理器编写原始 PDF 将是一项痛苦的任务。因此我们转向 PDFlib，它为我们屏蔽了编写实际\
  \ PDF 的复杂性，并允许我们调用高级函数来完成工作。所以而不是编写\n\n```\n4 0 obj\n<< /Length 73 >>\nstream\n\
  BT\n/F13 24 Tf\n40 728 Td\n(Hello, World!) Tj\nET\nendstream\nendobj\n5 0 obj\n\
  << /Type /Font\n/Subtype /Type1\n/BaseFont /Helvetica\n>>\n```\n\n要在文档的特定位置插入 Helvetica\
  \ 文本，我们只需要写：\n\n```php\n$font = PDF_findfont($p, \"Helvetica\", \"host\", 0);\n\
  PDF_set_font($p, $font, 18.0);\nPDF_set_text_pos($p, 40, 728);\nPDF_show($p, \"\
  Hello World!\");\n```\n\n这种方式更紧凑、更容易阅读，最重要的是，当我们需要进行更改时更容易修改。`PDFlib` 为我们跟踪对象之间的链接，所以我们不需要担心记住字体对象的标识符是\
  \ `5 0`，或者计算内容流对象中的字符数以确定其长度（`73`）。这些琐碎的任务交给计算机要好，`PDFlib` 允许我们从脱这些细节。\n\n\n\n\n\
  遗憾的是，PDF 编程过于复杂，无法完全涵盖。你可以写一本书关于 PDF 编程的书，而且确实有人做到了。\n\n## 关于 PDF 的资源\n\n欲需更多关于\
  \ PDF 的深度材料，你可以查看 `PDFlib` 作者 Thomas Merz 提供的 `PDFlib` 手册，该手册随 `PDFlib` 源码分发一起发布（位于\
  \ `docs` 目录下的 `PDFlib-manual.pdf` 文件）。Merz 还撰写了一本关于 PDF 编程的书，计划于 2002 年晚些时候出版*Postscript\
  \ and Acrobat/PDF*（Springer Verlag 出版）。\n\nPDF 的创建者 Adobe 提供的《PDF 参考》也是一份极其宝贵的资源，但读起来并不十分吸引人；你可以在这里找到\
  \ http://partners.adobe.com/asn/developer/acrosdk/docs/filefmtspecs/PDFReference.pdf，也可以以书的形式获取。\n\
  \n你也可以参考 `www.planetpdf.com` 和 `www.pdfzone.com`。\n\n我们将专注于基础知识；在本章中，我们将涵盖如何在页面上放置文本，然后转向更复杂的主题，如处理变量的文本输入、向文档添加图形和图像等。\n\
  \n## 打印“Hello World”\n\n是时候介绍那个老调子了：Hello World。如果你已经熟悉了使用 `PDFlib` 的基础知识，你可能想跳过这部分。但对于\
  \ PDF 新手来说，编写一个“Hello World”文档是学习在页面上添加和定位文本基础知识的良好介绍。\n\n列表 17.2 显示了用 PHP 生成 PDF\
  \ 文档的代码。在其中，我们生成了一个包含单页 5 英寸乘以 8 英寸的文档，内容是“Hello World!”文本。该文本在页面上的水平和垂直方向上都居中。此外，我们还为文档指定了一些信息属性，包括创建它的的脚本名称（PDF\
  \ 术语中的“Creator”）以及文档标题（出乎意料的是，标题是“Hello World!”）。然后我们只需输出文档，并带上相应的 HTTP Header，告诉客户端我们发送的不是通常的那种\
  \ HTML 文档，而是一个 PDF 文档。在 Internet Explorer 中使用 Adobe Acrobat 作为查看器内联渲染的文档如图 17.2\
  \ 所示。\n\n### 列表 17.2：使用 PHP 和 PDFlib 说“Hello World”（helloworld.PHP）\n\n```php\n\
  <?php\n\n$page_width = 576;\n\n$page_height = 360;\n\n$str = “Hello World!”;\n\n\
  $creator = “helloworld.php”;\n\n$p = PDF_new ();\n\nPDF_open_file ($p,””);\n\nPDF_set_info\
  \ ($p, “Creator”, $creator);\n\nPDF_set_info ($p, “Title”, $str);\n\nPDF_begin_page\
  \ ($p, $page_width, $page_height);\n\n$font = PDF\\_findfont ($p, “Helvetica-Bold”,\
  \ “host”, 0);\n\n$text\\_size = 18.0;\n\n$strwidth = PDF\\_stringwidth ($p, $str,\
  \ $font, $text\\_size);\n\n$text\\_hpos = ($page\\_width / 2) - (floor ($strwidth\
  \ / 2));\n\n$text\\_vpos = ($page\\_height / 2) - (floor ($text\\_size / 2));\n\n\
  PDF_setfont ($p, $font, $text\\_size);\n\nPDF_set_pos ($p, $text\\_hpos, $text\\\
  _vpos);\n\nPDF_show ($p, $str);\n\nPDF_end_page ($p);\n\nPDF_close ($p);\n\n$buf\
  \ = PDF_get_buffer ($p);\n\n$len = strlen ($buf);\n\nheader (“Content-Type: application/pdf”);\n\
  \nheader (“Content-Length: $len”);\n\nheader (“Content-Disposition: inline; filename=hello\\\
  _world.pdf”);\n\nprint $buf;\n\nPDF_delete($p);\n\n?>\n```\n\n### PDF\n\n如你所述，脚本的结构非常简单。我们设置了变量来存储文档参数（页面宽度和高度、文档标题和创建者）。然后我们使用\
  \ `PDF_new()` 创建一个新的 PDF 文档，配置文档的创建者和标题，并使用 `PDF_begin_page()` 向文档添加页面。注意，我们向 `PDF_open_file()`\
  \ 的第二个参数传递了一个空字符串；这会导致文档在内存中生成而不是在实际文件中。要将我们的 PDF 文档输出到文件，我们将通过 `PDF_open_file()`\
  \ 的第二个参数传递要创建的文件完整路径。\n\n在 PDF 世界中，所有尺寸都以通用单位给出，默认对应设置者的测量单位 `point`（点），即 1/72 英寸。事实上，每个点在屏幕上的尺寸可能大于或小于\
  \ 1/72 英寸，但在打印的 PDF 文档中，它始终是 1/72 英寸。你可以通过调用 `PDF_scale()` 将“坐标系”转换为某些其他测量单位（例如，厘米，或者如果你想要，英寻），你只需提供两个乘数，当它们乘以\
  \ 1/72 英寸时，就会得到你想要的长度单位。例如，为了使用英寸而不是点在页面上放置对象，你需要调用 `PDF_scale($p, 72, 72)`。\n\n\
  注意，这意味着单位中的所有测量值现在都将指向英寸，因此调用 `PDF_setfont($p, $font, 14.0)` 将导致字母大小为 14 英寸。\n\n\
  \n\n\nPDF 坐标系的一个奇之处在于它是“自下而上”的；与许多其他文档布局系统不同，PDF 使用元素距离底部边缘的距离而不是距离顶部边缘的距离来指示在页面上的垂直位置。我们的计算结果是将文本放在距离左边缘\
  \ `231` 磅、距离底部 `171` 磅的地方。\n\n我们实际上通过 `PDF_set_text_pos()` 函数指示 PDFlib 将文档放置在此位置：\n\
  \n```\nPDF_set_text_pos ($p, $text_hpos, $text_vpos);\n```\n\n一旦我们确定了想要放置文本的确切位置，并告诉\
  \ PDFlib 将其放在那里，我们只需调用 `PDF_show()` 即可将文本放置在文档上：\n\n```\nPDF_show ($p, $str);\n\
  ```\n\n从那里开始脚本变得变得简单：我们关闭页面和文档，使用 `PDF_get_buffer()` 函数将文档的 PDF 内容获取到缓冲区变量 `$buf`，然后将缓冲区的内容输出到浏览器。注意，我们必须指定\
  \ `Content-Type`、`Content-Length` 和 `Content-Disposition` 头部，以便浏览器能够正确向用户显示文档。完成后，我们通过调用\
  \ 释放 PDF 文档对象消耗的内存：\n\n```\nPDF_delete ($p);\n```\n\n需要注意的是一点是，为了简洁起见，我们在代码中省略了错误处理。这显然不是现实世界中应该采用的方法。幸运的是，PDFlib\
  \ 中的错误处理相当简单。所有在其他情况下会返回正值的函数（如 `PDF_findfont()`）在发生错误时都会返回 `False`（`0`）。虽然这在理论上很简单，但由于许多\
  \ PDFlib 函数完全不返回任何内容（无论是否发生错误），这种情况就变得复杂了。\n\n相反，错误会导致生成 PHP 警告。你应该查看你服务器的错误日志（如果设置了错误消息显示在屏幕上，则查看浏览器窗口）来查找发生的错误。此外，使用\
  \ PHP 内置函数 `error_reporting()` 确保在处理 PDFlib 时没有关闭 PHP 警告消息，否则当你的 PDF 生成脚本停止工作时，你无法找出什么问题！\n\
  \n**526**\n\n## 第 17 章\n\n### PDF\n\n### 超越“Hello World”\n\n当然，除了在页面上写字，你还可以用 PDF\
  \ 做更多事情。PDFlib 提供了用于绘制几何形状矢量图形的函数，包括线条、矩形、圆形、曲线和弧。它还允许用颜色填充这些形状定义的区域（在 PDF 术语中称为\
  \ `paths`，路径），并绘制路径描述的轮廓（边框）。你可以控制组成路径的线条的宽度，为交叉线的角部选择视觉样式（斜角、圆角等），为线条创建自定义的虚线模式等。\n\
  \n为了说明这些功能中的几项，我们将扩展“Hello World”示例，在文本上方和下方添加虚线，并在文本下方画一个黄色的笑脸脸。（我们还将字体大小增加到 `36`\
  \ 磅以提高可读性，并将文本移动到页面靠上的位置。）这部分代码如列表 17.3 所示。\n\n**列表 17.3：更花哨版本的“Hello World” (helloworld-fancy.php)**\n\
  \n```php\n<?php\n\n$page_width = 576;\n\n$page_height = 360;\n\n$str = “Hello World!\"\
  ;\n\n$creator = “helloworld.php”;\n\n$p = PDF_new ();\n\nPDF_open_file ($p,””);\n\
  \nPDF_set_info ($p, “Creator”, $creator);\n\nPDF_set_info ($p, “Title”, $str);\n\
  \nPDF_begin_page ($p, $page_width, $page_height);\n\n$font = PDF_findfont ($p, “Helvetica-Bold”,\
  \ “host”, 0);\n\n$text_size = 36.0;\n\n$strwidth = PDF_stringwidth ($p, $str, $font,\
  \ $text_size);\n\n$text_hpos = ($page_width / 2) - (floor ($strwidth / 2));\n\n\
  $text_vpos = ($page_height / 2) + 30;\n\nPDF_setfont ($p, $font, $text_size);\n\n\
  PDF_set_text_pos ($p, $text_hpos, $text_vpos);\n\nPDF_show ($p, $str);\n\n// 在文本上方画虚线\n\
  \nPDF_setlinewidth ($p, 2.0);\n\nPDF_setdash ($p, 2.0, 1.0);\n\nPDF_moveto ($p,\
  \ $text_hpos - 10, $text_vpos + $text_size);\n\nPDF_lineto ($p, $text_hpos + $strwidth\
  \ + 10, $text_vpos + $text_size); PDF_stroke ($p);\n\n// 在文本下方画虚线（反向虚线模式）\n\nPDF_setdash\
  \ ($p, 1.0, 2.0);\n\nPDF_moveto ($p, $text_hpos - 10, $text_vpos - 9);\n\nPDF_lineto\
  \ ($p, $text_hpos + $strwidth + 10, $text_vpos - 9);\n\nPDF_stroke ($p);\n\n// 添加一个笑脸（实线，细线；\n\
  // 黄色的脸，眼睛\n\nPDF_setlinewidth ($p, 1.0);\n\nPDF_setdash ($p, 0, 0);\n\nPDF_setcolor\
  \ ($p, “yellow”, “rgb”);\n\nPDF_circle ($p, $text_hpos, $text_vpos - 90, 30);\n\
  PDF_stroke ($p);\n\nPDF_setcolor ($p, “black”, “rgb”);\n\nPDF_circle ($p, $text_hpos\
  \ - 10, $text_vpos + 20, 10);\nPDF_stroke ($p);\n\nPDF_circle ($p, $text_hpos +\
  \ $strwidth + 10, $text_vpos + 20, 10);\nPDF_stroke ($p);\n\nPDF_end_page ($p);\n\
  \nPDF_close ($p);\n\n$buf = PDF_get_buffer ($p);\n\n$len = strlen ($buf);\n\nheader\
  \ (“Content-Type: application/pdf”);\n\nheader (“Content-Length: $len”);\n\nheader\
  \ (“Content-Disposition: inline; filename=helloworld.pdf”);\n\nprint $buf;\n\nPDF_delete\
  \ ($p);\n\n?>\n```\n\n**527**\n\n创建 PDF 文档\n\n**528**\n\n我们使用了一些新函数。它们在 17.1 中简要介绍，详细说明（参数列表和规则）将在章节的“常用函数”部分给出。\n\
  \n![Image 85](img/index-553.png)\n\n**529**\n\n## 第 17 章\n\n### PDF\n\n超越“Hello\
  \ World”\n\n（注意：提供的文本在源代码中存在重叠或碎片，我已根据逻辑进行了清理。）*\n\n**图 17.3**\n\n一个新的、改进的“Hello\
  \ World”\n\n表格 17.1：列表 17.3 中使用的 PDF 函数\n\n| 函数 | 说明 |\n| :--- | :--- |\n| `PDF_setlinewidth()`\
  \ | 设置边界对象的默认线宽。 |\n| `PDF_setdash()` | 设置线条的默认虚线模式。（第二个和第三个参数设置黑色和白色段的大小；将两个参数设置为零会导致默认变为实线。）\
  \ |\n| `PDF_moveto()` | 将“当前点”移动到给定位置 (*x*, *y*)；你可以将当前点视为“光标位置”。 |\n| `PDF_lineto()`\
  \ | 从当前点到新点构造一条线条，成为当前路径；此线条必须使用 `PDF_stroke()` 可可见。 |\n| `PDF_stroke()` | 描（即“绘制”）当前路径的轮廓。如果当前路径是线条，它将使用当前默认线宽绘制线条。如果当前路径是封闭形状（如圆形或矩形），它将在周围绘制边框。\
  \ |\n| `PDF_setcolor()` | 设置描边和/填充路径时使用的颜色。 |\n| `PDF_circle()` | 构造具有给定中心 (*x*,\
  \ *y*) 和半径 *r* 的圆形。该圆成为当前路径。 |\n| `PDF_fill_stroke()` | 使用当前的填充和描边颜色填充并描边当前路径。 |\n\
  | `PDF_arcn()` | 具有给定中心和半径的弧，顺时针方向从 *a* 移动到 *b*.*a* 和 *b* 实际上是从正 x 轴的度数。 |\n| `PDF_arc()`\
  \ | 功能相同，但按逆时针方向绘制弧。 |\n| `PDF_closepath()` | 关闭开启路径（即终点与起点不相同的路径）。 |\n\n\n\n尽管使用了许多新函数调用，但我们使用的基础技术与我们之前在页面上绘制文本的技术并没有显著区别。每当我们想要添加一个新对象时，都会确定想要绘制该对象的位置，然后为该对象绘制路径，最后填充并描边该路径（即绘制其中心并绘制其边界）。在\
  \ PDFlib 中，在页面上绘制形状是一个两步过程：首先，你必须通过创建路径来构建要绘制的形状，然后你必须填充和/或描边该路径，以便实际上在页面上渲染为可见。\n\
  \n所以，画一个笑脸的过程到底并不太复杂。我们使用的唯一稍微有点晦懂的技术是绘制笑脸的舌头。我们在嘴部弧的基础上为舌头创建了一个向下的、水平的、180 度的弧；我们使用\
  \ `PDF_closepath()` 函数将该弧转换为一个填充的黑色半圆（这样它看起来更像是一个舌头），该函数会自动在路径的起点（弧开始的点，`a`）和路径的终点（弧结束的点，`b`）之间绘制一条直线。\n\
  \n## 向 PDF 文档中添加图像\n\n另一个常见任务是将图像添加到你的 PDF 文档中。列表 17.4 显示了将文件中的图像放入 PDF 文档所需的代码。\n\
  \n### 列表 17.4：向文档添加图像 (image.php)\n\n```php\n<?php\n\n$page_width = 576;\n$page_height\
  \ = 360;\n$title = “恐怖的塑料骨架物体”;\n$creator = “image.php”;\n$p = PDF_new ();\nPDF_open_file\
  \ ($p,””);\nPDF_set_info ($p, “Creator”, $creator);\nPDF_set_info ($p, “Title”,\
  \ $title);\nPDF_begin_page ($p, $page_width, $page_height);\n// 将图像居中放置在页面\n$img\
  \ = PDF_open_image_file ($p, “jpeg”, “skeleton.jpg”);\n$img_height = PDF_get_value\
  \ ($p, “imageheight”, $img);\n$img_width = PDF_get_value ($p, “imagewidth”, $img);\n\
  $image_hpos = floor (($page_width / 2) - ($img_width / 2));\n$image_vpos = floor\
  \ (($page_height / 2) - ($img_height / 2));\n\n![Image 86](img/index-555_1.png)\n\
  \nPDF_place_image ($p, $img, $image_hpos, $image_vpos, 1);\nPDF_close_image ($p,\
  \ $img);\n// 在图像下方放置标题\n$str = “不要被我的塑料骨架怪物吓到。”;\n$font = PDF_findfont ($p, “Times-Roman”,\
  \ “host”, 0);\n$text_size = 14.0;\n$strwidth = PDF_stringwidth ($p, $str, $font,\
  \ $text_size);\n$text_hpos = floor (($page_width / 2) - ($strwidth / 2));\n$text_vpos\
  \ = floor (($page_height / 2) - ($img_height / 2) - ($text_size + 5));\nPDF_set_font\
  \ ($p, $font, $text_size);\nPDF_set_text_pos ($p, $text_hpos, $text_vpos);\nPDF_show\
  \ ($p, $str);\nPDF_end_page ($p);\nPDF_close ($p);\n$buf = PDF_get_buffer ($p);\n\
  $len = strlen ($buf);\nheader (“Content-Type: application/pdf”);\nheader (“Content-Length:\
