  \ 生产环境中运行 PHP 成为可能。*\n\n首先，获取最新的 Windows 二进制文件。从本书附带的光盘中拷贝 Apache，或者在此处下载：\n\n`httpd.apache.org/dist/httpd/binaries/win32/\n\
  \n同样，从附带的光盘中获取 PHP，或者前往 PHP 下载页面从 `www.php.net/downloads.php` 获取 Windows 分发。将 PHP\
  \ 分发解压到 `D:\\PHP-Dist` 或类似的路径。\n\n*注意*\n\n*如果在 Windows 95 机器上安装 Apache，上述显示的 Apache.org\
  \ URL 包含了一些需要考虑的注意事项。*\n\n下载 Apache 后，执行安装程序。将出现 Apache 安装向导的欢迎界面，在同意许可后，你应该会看到图\
  \ A.4 所示的界面。\n\n![Image 124`![Image 125](img/index-662_2.png)\n\n安装和配置 Apache 和\
