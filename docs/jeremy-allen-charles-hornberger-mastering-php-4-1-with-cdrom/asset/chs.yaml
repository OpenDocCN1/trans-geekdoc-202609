  \n## 向 PDF 文档中添加图像\n\n另一个常见任务是将图像添加到你的 PDF 文档中。列表 17.4 显示了将文件中的图像放入 PDF 文档所需的代码。\n\
  \n### 列表 17.4：向文档添加图像 (image.php)\n\n```php\n<?php\n\n$page_width = 576;\n$page_height\
  \ = 360;\n$title = “恐怖的塑料骨架物体”;\n$creator = “image.php”;\n$p = PDF_new ();\nPDF_open_file\
  \ ($p,””);\nPDF_set_info ($p, “Creator”, $creator);\nPDF_set_info ($p, “Title”,\
  \ $title);\nPDF_begin_page ($p, $page_width, $page_height);\n// 将图像居中放置在页面\n$img\
  \ = PDF_open_image_file ($p, “jpeg”, “skeleton.jpg”);\n$img_height = PDF_get_value\
  \ ($p, “imageheight”, $img);\n$img_width = PDF_get_value ($p, “imagewidth”, $img);\n\
  $image_hpos = floor (($page_width / 2) - ($img_width / 2));\n$image_vpos = floor\
  \ (($page_height / 2) - ($img_height / 2));\n\n![Image 86](img/index-555_1.png)\n\
  \nPDF_place_image ($p, $img, $image_hpos, $image_vpos, 1);\nPDF_close_image ($p,\
  \ $img);\n// 在图像下方放置标题\n$str = “不要被我的塑料骨架怪物吓到。”;\n$font = PDF_findfont ($p, “Times-Roman”,\
  \ “host”, 0);\n$text_size = 14.0;\n$strwidth = PDF_stringwidth ($p, $str, $font,\
  \ $text_size);\n$text_hpos = floor (($page_width / 2) - ($strwidth / 2));\n$text_vpos\
  \ = floor (($page_height / 2) - ($img_height / 2) - ($text_size + 5));\nPDF_set_font\
  \ ($p, $font, $text_size);\nPDF_set_text_pos ($p, $text_hpos, $text_vpos);\nPDF_show\
  \ ($p, $str);\nPDF_end_page ($p);\nPDF_close ($p);\n$buf = PDF_get_buffer ($p);\n\
  $len = strlen ($buf);\nheader (“Content-Type: application/pdf”);\nheader (“Content-Length:\
  \ $len”);\nheader (“Content-Disposition: inline; filename=hello.pdf”);\nprint $buf;\n\
  PDF_delete($p);\n?>\n```\n\n\n\n\n调用 `end_page()` 以结束页面（并返回文档范围），或调用路径相关函数（如 `PDF_moveto()`\
  \ 或 `PDF_arc()`）以进入路径范围。\n\n### path\n路径的作用范围，它是一个点的集合，你可以在其中添加额外的点（从而扩展路径）。该范围从你调用路径相关函数（如\
  \ `PDF_moveto()` 或 `PDF_arc()`）时开始，并在关闭路径时结束（显式地使用 `PDF_closepath()` 或隐式地使用填充或描边函数之一，如\
  \ `PDF_fill()`、`PDF_stroke()` 等）。\n\n### pattern\n当调用 `PDF_begin_pattern()` 时进入此作用范围，并在调用\
  \ `PDF_end_pattern()` 时结束。我们在本章中不介绍模式，详情请参阅 *PDFlib Reference Manual*。\n\n### template\n\
  当调用 `PDF_begin_template()` 时进入此作用范围，并在调用 `PDF_end_template()` 时结束。我们在本章中不介绍模板；详情请参阅\
  \ *PDFlib Reference Manual*。\n\n各种范围可以被视为一种层次结构，可以可视化为一棵树：\n\n```text\nobject\n\
  +--document\n+--page\n| +--path\n| +--pattern\n| +--template\n```\n\n# 创建 PDF 文档\n\
  **533**\n\n许多常用 PDF 函数的合法范围将在后续章节给出。注意，某些函数可以在多个作用范围内调用。例如，在节省文件大小方面，在文档范围内调用 `PDF_open_image_file()`\
  \ 可能在页面范围内更有优势，但两种用法都是合法的。\n\n## 常用 PDFlib 函数\nPDFlib 提供系列用于设计 PDF 文档的函数。到目前，我们已经在示例中展示了其中几个。在现实世界中，你可能需要比我们展示的更多的函数。\n\
  \n一些常用的函数总结在以下小节中；描述直接摘自 *PDFlib Reference Manual* 和 PHP 在线文档 (http://php.net/manual/en/ref.php.net)。注意，在这些描述中，我们列出了模式和模板两个范围，它们用于复杂的\
  \ PDF 文档，但在本章中未讨论或定义。关于这些范围的详情，请参阅 *PDFlib Reference Manual*。\n\n在随后的函数定义中，初始参数\
  \ `$p` 始终指向由 `PDF_new()` 返回的有效文档对象句柄。\n\n### 开始与结束文档\n\n`int PDF_new()`\n创建一个新的\
  \ PDF 文档对象并分配该对象所需的资源（即内存）。返回值是新创建的文档对象的句柄。调用 `PDF_new()` 开始对象范围。\n\n**Arguments**\n\
  - 无\n\n**Scope**\nn/a\n\n`void PDF_delete(int $p)`\n删除 PDF 文档对象并释放资源。调用 `PDF_delete()`\
  \ 必须与之前的 `PDF_new()` 调用配对。调用 `PDF_delete()` 结束对象范围。\n\n**Arguments**\n- 除 `$p` 外外无\n\
  \n**Scope**\nobject\n\n`int PDF_open_file(int $p[, string filename])`\n如果 `filename`\
  \ 不是空字符串 (\"\")，则尝试打开由 `filename` 指定的文件并将 PDF 文档存储在其中。如果 `filename` 为空字符串，则操作失败。\n\
  \n**Arguments**\n- `filename`: 要打开的文件名（或使用 \"\" 生成内存）。\n\n**Scope**\nobject\n\n\
  `void PDF_close(int $p)`\n**534**\n第 17 章\n\n关闭由 `$p` 引用的 PDF 文档。`PDF_close()` 必须与之前的\
  \ `PDF_open_file()` 调用配对。\n\n**Arguments**\n- 除 `$p` 外外无\n\n**Scope**\ndocument\n\
  \n### 开始与结束页面\n\n`void PDF_begin_page(int $p, float width, float height)`\n在 `$p`\
  \ 引用的文档中开始新页。除非坐标系统已通过 `PDF_scale()` 转换，否则 `width` 和 `height` 的值表示点。\n\n**Arguments**\n\
  - `width`: 页面宽度\n- `height`: 页面高度\n\n**Scope**\ndocument\n\n`void PDF_end_page(int\
  \ $p)`\n结束当前页面。一旦页面结束，就不能再向其添加更多路径、文本或任何内容。调用 `PDF_end_page()` 结束页面并返回文档范围。\n\n\
  **Arguments**\n- 除 `$p` 外外无\n\n**Scope**\npage\n\n### 处理文本\n\n`int PDF_findfont(int\
  \ $p, string fontname, string encoding, int embed)`\n在目录中查找字体并返回一个可供使用的整数句柄。可用的内置字体有：Courier-Roman,\
  \ Helvetica-Roman, Times-Roman, Courier-Bold, Helvetica-Bold, Times-Bold, Courier-Oblique,\
  \ Helvetica-Oblique, Times-Italic, ZapfDingbats。\n\n**Arguments**\n- `fontname`:\
  \ 字体名称\n- `encoding`: 使用的编码节 winansi”, “macroman”, “ebcdic”, “builtin”, “host”)\n\
  - `embed`: 是否将字体嵌入文档中 (1) 或 (0)\n\n**Scope**\ndocument\n\n`void PDF_setfont(int\
  \ $p, int font_handle, float text_size)`\n使用由 `PDF_findfont()` 返回的字体句柄设置当前字体。添加到页面的任何文本将以指定的字体类型和大小显示。\n\
  \n**Arguments**\n- `font_handle`: 由 `PDF_findfont()` 返回的整数字体句柄\n- `text_size`: 文本大小（通常为点）\n\
  \n**Scope**\ndocument\n\n`void PDF_set_text_pos(int $p, float x, float y)`\n设置后续添加到文档（通过\
  \ `PDF_show()`）的文本出现的位置。水平和垂直偏移 `x` 和 `y` 是从页面*左侧*和*底部*边缘测量的单位。\n\n**Arguments**\n\
  - `x`: 水平偏移\n- `y`: 垂直偏移\n\n**Scope**\npage\n\n`float PDF_stringwidth(int $p, string\
  \ str[, int font, float text_size])`\n使用给定的字体和给定的大小返回字符串 `str` 的宽度。`font` 和 `text_size`\
  \ 参数是可选的。\n\n\n\n\n\n此函数用于在实际尝试将文本放置到页面之前，精确确定给定文本的实际长度（例如，查看它是否能适应在单行内）。返回值为一个浮点数，表示\
  \ `str` 将占据的单位数（使用当前的测量单位）。\n\n请注意，尽管你*可以*在文档作用域内调用 `PDF_stringwidth()`，但这样做并没有实际用途；该函数始终返回\
  \ `0`（可能是因为该字符串在何处无法显示，因此将占用 0 个单位的空间）。\n\n### 参数\n\n* `str`: 你想要计算宽度的文本\n* `font`:\
  \ 由 `PDF_findfont()` 返回的字体句柄\n* `text_size`: 在宽度计算中使用的文本大小\n\n### 作用域\n\ndocument,\
  \ page, path, pattern, template\n\n```\nvoid PDF_show(int $p, string str)\n```\n\
