  \ Windows 二进制文件。从本书附带的光盘中拷贝 Apache，或者在此处下载：\n\n[http://httpd.apache.org/dist/httpd/binaries/win32/\n\
  \n同样，从附带的光盘中获取 PHP，或者前往 PHP 下载页面从 `www.php.net/downloads.php` 获取 Windows 分发。将 PHP\
