  \ URL 包含了一些需要考虑的注意事项。*\n\n下载 Apache 后，执行安装程序。将出现 Apache 安装向导的欢迎界面，在同意许可后，你应该会看到图\
  \ A.4 所示的界面。\n\n\n\n现在你可能在想：“PHP 到底应该是如何找到这些文件的？”答案是，我们将手动创建它们！但首先，我们必须确保 PHP 知道去哪里查找文件，因此我们使用配置文件中的另一个选项来告知它。找到以下行行：\n\
  \n```\n;include\\_path = “.:/php/includes”\n```\n\n删除分号，并将路径设置更改为：\n\n```\ninclude_path\
  \ = “/usr/local/apache/htdocs/php-includes”\n```\n\n在真正让 PHP 包含文件之前，还有最后一步：你必须创建刚刚指向的目录，即在\
  \ `htdocs` 目录中创建 `php-includes`。\n\n一旦 `php-includes` 目录存在且配置文件已根据需要进行了修改，你就必须重启\
  \ Apache：\n\n```\n/usr/local/apache/bin/apachectl restart\n```\n\n在 `/usr/local/apache/htdocs/php-includes`\
  \ 目录（或你在 `include_path` 中设置的其他目录之一）中，创建一个名为 `auto_header.php` 的文件。在文件中输入以下代码：\n\n\
  ```html\n<!DOCTYPE HTML PUBLIC “-//W3C//DTD HTML 4.0 Transitional//EN”>\n<html>\n\
  ![Image 126](img/index-665_1.png)\n**640**\n**附录 A**\n\n**PHP 安装快速课程**\n\n然后在同一目录下创建文件\
  \ `auto_footer.php`，并向该文件输入以下代码行：\n\n```html\n</html>\n```\n\n现在由于 `auto_header.php`\
  \ 文件被包含在每个页面中，你不再需要在 PHP 文档中包含 `DOCTYPE` 或 `html` 标签了；它们将自动附加到你执行的每一个 PHP 脚本的顶部和底部。\n\
  \n这仅仅是 `auto_prepend_file` 和 `auto_append_file` 配置选项用途的一个示例。让我们来看看头部和页脚的效果。创建一个名为\
  \ `hello_world.php` 的 PHP 文件，并将列表 A.2 中的代码输入该文件。页面结果应该像图 A.6。\n\n**列表 A.2：Hello\
  \ World，PHP 风格**\n\n```php\n<head>\n<title>hello, world : PHP Style</title>\n</head>\n\
  <body>\n<?php\nfor($i = 1; $i <= 6; $i++)\n{\nprint“<h$i>hello, world</h$i>\\\\\
  n”);\n}\n?>\n</body>\n```\n\n**图 A.6**\n带有自动头部和页脚的“Hello, World!”执行结果\n\n**安装和配置\
  \ APACHE 和 PHP**\n**641**\n\n如果你不依赖这些文件，那么返回并注释掉 `auto_prepend_file` 和 `auto_append_file`\
  \ 配置选项是重要的，这样它们在以后就不会导致产生意料之外的。。重新打开 `php.ini` 文件并再次找到 `auto_prepend_file` 行。要在配置文件中“注释掉”一行，只需在行首放置一个分号即可，如下所示：\n\
  \n```\n;auto_prepend_file = “auto_header.php”\n```\n\nPHP 现在将忽略此配置选项，因为它被 PHP 视为注释。同样的方法修改\
  \ `auto-append` 选项：\n\n```\n;auto_append_file = “auto_footer.php”\n```\n\n不要忘记重启\
  \ Web 服务器使更改生效！\n\n学习修改 PHP 配置文件是非常重要的。为了完成特定任务或让 PHP 以某种方式运行，通常需要更改配置选项。这在对 PHP\
  \ 和 Apache 进行性能调优时尤其为重要。\n\n## 安装 RDBMS\n\nMySQL 是一种轻量级、快速且免费的数据库——最受欢迎的开源数据库之一。PostgreSQL\
  \ 是另一个非常流行的 RDBMS（关系型数据库管理系统），将在本章稍后部分介绍。虽然 PostgreSQL 比 MySQL 更符合 ANSI 92 标准，但\
  \ MySQL 在开源社区中也赢得了极大的人气。\n\n## 在 Linux 上安装 MySQL\n\nMySQL 的安装过程与几乎任何其他源码分发版相似。首先，切换目录到下载\
  \ MySQL 源码分发版的目录；最好将 MySQL 下载到我们一直在使用的 Apache 和 PHP 的工作 `src` 目录中。然后解压分发文件：\n\n\
  ```\ngunzip -c mysql-3.23.xx.tar.gz | tar xvf -\ncd mysql-3.23.xx\n```\n\n接下来，需要为当前系统配置\
  \ MySQL。默认配置选项将足够满足我们对 MySQL 的使用：\n\n```\n./configure\n```\n\n现在你必须编译并安装 MySQL。编译可能需要一些时间，请耐心等待！\n\
  \n```\nmake\nsu\nPassword: *****\nmake install\n```\n\nMySQL 可以配置为以自己的用户运行——在生产环境中本应该是这样的。然而，出于学习目的，你可以保持原样（超级用户）。在生产环境中，最好确保没有服务在如\
  \ `root` 等特权系统账户下运行。\n\n**642**\n**附录 A**\n**PHP 安装快速课程**\n\n如果是第一次安装 MySQL，则必须初始化数据库。可以使用：\n\
  \n```\n/usr/local/bin/mysql_install_db\n```\n\n数据库初始化后，可以启动 MySQL 守护进程：\n\n```\n\
  /usr/local/bin/safe_mysqld\n```\n\n一旦 MySQL 启动，可以通过运行以下命令验证安装：\n\n```\n/usr/local/bin/mysqladmin\
  \ status\n```\n\n结果应该类似于：\nUptime: 81 Threads: 0 Queries per second 0\n\n**在 Windows\
  \ 上安装 MySQL**\n\n在 Windows 上安装 MySQL 的第一步是获取分发版。可以通过访问 `mysql.com/downloads/index.html`\
  \ 找到 `mysql-23-win.zip`。将压缩包解压到任何目录，并在该目录下运行 `setup.exe`。标准安装程序将引导你完成安装。对于我们的目的，标准安装是足够的。\n\
  \n在 Windows 安装完成后，可以启动 MySQL。MySQL 安装目录下有一个名为 `mysqladmin.exe` 的可执行文件。要管理和配置 Windows\
  \ 版 MySQL，运行此可执行文件。程序启动后你需要用户名和密码。对于登录信息，选择标准安全并输入之前设置的 `root` 用户名和密码。一旦程序启动，系统旁边会出现一个小灯。\n\
  \nWindows 管理通过图形界面 (GUI) 方便地管理 MySQL。现在转到图 A.7 所示的 `my.ini` 设置选项卡。如下编辑 `my.ini`：首先，将\
  \ `mysqld` 单选按钮设置为 Windows95/98 的 `mysqld-opt`，设置为 WindowsNT/2000 的 `mysqld-nt`。然后点击按钮保存修改。使用此管理器在\
  \ WindowsNT/2000 上运行 MySQL 服务。点击窗口任何地方隐藏程序。灯现在应该从红色变为绿色。\n\n启动 Windows 安装目录下的 `MySqlManager.exe`。显示的第一个窗口（图\
  \ A.8）是需要注册服务器的窗口。对于登录信息，选择标准安全并输入之前设置的 `root` 用户名和密码。\n\n进入 `Tools ➢ SQL Query`\
  \ 菜单并打开查询窗口。输入图 A.9 中的查询。输入查询后，点击绿色箭头，你的 Windows 配置就完成了。\n\n![Image 127](img/index-668_1.png)\n\
  ![Image 128](img/index-668_2.png)\n![Image 129](img/index-668_3.png)\n\n**图 A.7**\n\
  Windows MySQL 管理界面\n\n**图 A.8**\n在 MySQL Manager 中注册服务器\n\n**图 A.9**\n为 MySQL 设置权限\n\
  \n## 在 Unix 中配置 MySQL 权限\n\n数据库管理系统必须提供一种根据用户身份限制数据访问的方法。数据库中包含的数据可能是敏感的，例如信用卡号。但这里的数据库还不能使用。我们还没有任何数据表，仍然没有为数据库数据设置任何形式的访问权限。\n\
  \n\n\n第一步是为 root 数据库用户设置密码。该用户可以在数据库中执行任何操作。\n\n```\n/usr/local/bin/mysqladmin -u\
  \ root password yourpasswordhere\n```\n\n现在密码已经设置好了，执行命令\n\n```bash\n/usr/local/bin/mysqladmin\
  \ status\n```\n\n将得到输出：\n\n```text\nmysqladmin: connect to server at ‘localhost’\
  \ failed\nerror: ‘Access denied for user: ‘root@localhost’ (Using password: NO)’\n\
  ```\n\n那么现在该如何访问数据库呢？我们刚刚创建的密码必须随命令一起提供：\n\n```bash\n/usr/local/bin/mysqladmin -p\
  \ status\n```\n\n输入密码：`**********`\n\nMySQL 访问权限系统非常深，在这里进行全面讨论将超出本文范围。让我们专注于创建一个名为\
  \ `masteringphp` 的用户，该用户将在书的其他部分用于访问你的 MySQL 数据库。你可以通过以下命令启动交互式 MySQL 会话：\n\n```bash\n\
  /usr/local/bin/mysql -u root -p mysql\n```\n\n现在你已经进入了，并使用 root 登录数据库。授予 `localhost`\
  \ 上的用户 `masteringphp` 所有权限，*除了*授予其他用户权限的权限。这将允许我们的用户在数据库中执行几乎任何操作，并符合我们的目的。\n\n\
  ```sql\nmysql> GRANT ALL PRIVILEGES\n-> ON *.*\n-> TO masteringphp@localhost\n->\
  \ IDENTIFIED BY ‘mysecret’;\n```\n\n分号结束 SQL 语句。在分号后再次按回车。完成 SQL 语句后应显示以下内容。\n\n\
  ```text\nQuery OK, 0 rows affected (0.00 sec)\n```\n\n如果该系统有多个用户，现在就是添加用户并设置访问权限、以决定谁可以在数据库上做什么了。\n\
  \n*警告*\n\n*使用像示例中这么简单的密码并不是好主意。*\n\n# 安装和配置 APACHE 和 PHP\n\n**645**\n\n## 在 Unix\
  \ 上安装 PostgreSQL\n\nPostgreSQL 是目前最先进的开源关系型数据库管理系统（RDBMS）。它已经存在了五年多，支持 ANSI 92 标准定义的几乎每一个\
  \ SQL 结构。PostgreSQL 已经成为现有最稳定、性能最高的开源数据库之一。它使用 BSD 风格许可证，这基本上允许免费进行修改和分发，即使在商业产品中也是如此。\n\
  \n到此时，你可能已经成为通过源码分发配置和安装应用程序的老手。PostgreSQL 与我们迄为止完成的其他配置非常相似，只是计划上略有增加。首先为 PostgreSQL\
  \ 添加一个供其运行的用户。当使用 `useradd` 命令添加用户时，也会为 PostgreSQL 添加一个组。PostgreSQL 不允许实际使用“超级用户”账户来配置服务器。\n\
  \n```bash\nuseradd postgres -p secretpass\n```\n\n为 PostgreSQL 添加用户是安装任何应用程序的安全安全方法，可以确保应用程序不在特权账户下运行。列表中的下一步是调用配置脚本，然后是\
  \ `make`，最后实际上安装 PostgreSQL：\n\n```bash\n./configure\nmake\nsu\n```\n密码：`***********`\n\
  \n```bash\nmake install\n```\n\n安装 PostgreSQL 非常简单。为了在 PHP 中添加 PostgreSQL 支持，必须重新编译\
  \ PHP。在 PHP 配置行中，只需添加。\n\n（注：由于原文后续部分存在大量重复的无效文本，已根据文档工程师逻辑进行精简处理。）\n\n\n\nPHP 拥有大量的扩展和模块，这些需要下载其他的二进制和源码分发包。描述每一个具体的模块配置超出了本书的涉及范围，但这里按字母顺序对一些最流行或最有趣的模块进行了概括。编译和安装的说明通常可以通过点击给出的链接找到；其中几个模块在书的其他部分有更详细的介绍。\n\
  \n## Aspell\n最卓越的拼写检查器之一；`Aspell` 是开源的。\n\nhttp://aspell.sourceforge.net\n\n## 648\n\
  \n## 附录 A：PHP 安装快速上手\n\n## Curl\n代表 Client URL Library（客户端 URL 库）函数。`Curl` 允许 PHP\
  \ 连接并与多种协议通信。它是 `HTTP`、`FTP` 和 `Telnet` 等协议进行通信的良好通用客户端库。配合 PHP 使用需要 `7.0.2-beta`\
  \ 或更高版本。\n\nhttp://curl.haxx.se/\n\n## GD\nPHP 图形支持允许通过 `GD` 库进行通图像处理。此功能允许动态实时生成图像。\n\
  \nhttp://www.boutell.com/gd/\n\n> 提示：GD 库是 PHP 最有用的功能之一，在第 18 章中有详细介绍。\n\n## IMAP\n\
  此功能是用 PHP 编写电子邮件应用程序的关键。`IMAP` 函数允许 PHP 与 `IMAP`、`POP3` 和新闻服务器通信。\n\nftp://ftp.cac.washington.edu/imap/\n\
  \n## LDAP\n（轻量级目录访问协议）一种为可扩展目录开发的协议。\n\n有几个不同的库可以与 LDAP 服务器建立接口：Netscape Directory\
  \ SDK 3 或密歇根大学的 `ldap-3.3` 软件包。\n\nhttp://developer.netscape.com/tech/directory/\n\
  \nhttp://www.openldap.org\n\n## mail\nPHP 的电子邮件功能来自 `mail` 模块非常简单。\n\n> 提示：使用 PHP\
  \ 发送电子邮件将在第 19 章中进行描述。\n\n## PDFlib\n允许 PHP 创建 PDF 格式的文档。\n\nhttp://www.pdflib.com/pdflib/index.html/\n\
  \n> 提示：创建 PDF 是一个相当复杂的话，在第 17 章有详细介绍。\n\n## WDDX\n（Web 分布式数据交换）一种基于 XML 的技术，允许不同的系统之间进行有效的通信。不需要了解\
  \ XML 词汇，因为 `WDDX` 将它们封装成一个易于使用的包。编译 `WDDX` 支持只需要一个编译时配置选项。`WDDX` 支持不需要任何外部库。\n\n\
  http://www.openwddx.org\n\n## XML\n（可扩展标记语言）一种描述内容的基于文本的方法。XML 在过去几年中增长得非常巨大；许多新协议和程序已依赖它来存储结构化数据。在\
  \ PHP 的最新版本中，XML 现在已默认编译。\n\nhttp://www.w3c.org/XML/\n\n> 提示：关于 WDDX 和 XML 的更多信息，请参见第\
  \ 15 章“XML 和 XHTML”。\n\n## PHP 模块\n** 649**\n\n## zlib\n`zlib` 是一个免费提供的、可移植的、无损压缩库。它提供的功能是读写\
  \ `.gz` 压缩文件。`zlib` 对于许多需要创建和保存压缩数据的应用程序非常有用。提供原生接口使得压缩解压缩的过程比使用 PHP 调用命令行工具执行相同任务更快。\n\
  \nhttp://www.gzip.org/zlib/\n\n## PHP API 灵活性\nPHP 拥有一套广泛的应用程序接口（API）或 `libraries`，可以在\
  \ PHP 核心之外进行编译，但你选择的 API 集合必须在编译时选择——你无法在后期不重新编译 PHP 的情况下添加它们。编译 `WDDX` 支持只需要一个编译时配置选项。`WDDX`\
  \ 支持不需要任何外部库。\n\nhttp://www.openwddx.org\n\n## XML\n（可扩展标记语言）一种描述内容的基于文本的方法。XML\
  \ 在过去几年中增长得非常巨大；许多新协议和程序已依赖它来存储结构化数据。在 PHP 的最新版本中，XML 现在已默认编译。\n\nhttp://www.w3c.org/XML/\n\
  \n> 提示：关于 WDDX 和 XML 的更多信息，请参见第 15 章“XML 和 XHTML”。\n\n## PHP 模块\n** 649**\n\n##\
  \ zlib\n`zlib` 是一个免费提供的、可移植的、无损压缩库。它提供的功能是读写 `.gz` 压缩文件。`zlib` 对于许多需要创建和保存压缩数据的应用程序非常有用。提供原生接口使得压缩解压缩的过程比使用\
  \ PHP 调用命令行工具执行相同任务更快。\n\nhttp://www.gzip.org/zlib/\n\n## PHP API 灵活性\nPHP 拥有一套广泛的应用程序接口（API）或\
  \ `libraries`，可以在 PHP 核心之外进行编译，但你选择的 API 集合必须在编译时选择——你无法在后期不重新编译 PHP 的情况下添加它们。\n\
  \n[content]\nPHP 拥有一套广泛的应用程序接口（API）或 `libraries`，可以在 PHP 核心之外进行编译，但你选择的 API 集合必须在编译时选择——你无法在后期不重新编译\
  \ PHP 的情况下添加它们。\n\n\n\n\ndefault: `syslog`\n\n# 通用配置选项\n\n## 653\n\n指定将错误的写入位置。默认是一个特殊选项，在可用的情况下使用系统的日志设施：\n\
  \n### 平台\n\n#### 日志系统\n\n- **Unix**: 使用 `syslog(3)`。\n- **Windows NT/2000**: 使用事件日志系统。\n\
  - **Windows 95/98/Me**: 不可用此指令。\n\n### 选项\n\n#### `error_reporting` 整数（错误级别）\n默认:\
  \ `E_ALL`\n设置要报告的错误级别（有关各种错误级别的更多信息，请参阅第 7 章）。此处可以使用任何任何预定义的错误级别。\n\n#### `file_uploads`\
  \ 布尔值（开启/关闭）\n默认: `On`\n决定是否可以通过 HTTP 上传文件。\n\n#### `html_errors` 布尔值（开启/关闭）\n默认:\
  \ `Off`\n确保 PHP 生成的错误信息不使用 HTML 标签。\n\n#### `ignore_user_abort` 布尔值（开启/关闭）\n默认:\
  \ (未包含)\n当为 `On` 时，发送脚本的全部输出。当为 `Off` 时，脚本会在客户端断开连接时立即终止。此指令也可以通过函数 `ignore_user_abort()`\
  \ 设置。\n\n#### `include_path` 字符串（目录）\n默认: (空)\n控制使用 `require` 和 `include` 时允许包含的文件。多个目录之间可以用冒号隔开，格式类似于\
  \ `PATH` 环境变量。\n\n#### `isapi_ext` 字符串（扩展名: .jpg;.php;.gif 等.）\n默认: (空)\n列出 PHP\
  \ 安装为 ISAPI 模块时可以使用的扩展名。用分号分隔多个扩展名。对于其他版本的 PHP，请参见 `cgi_ext` 和 `nsapi_ext`。\n\n\
  #### `log_errors` 布尔值（开启/关闭）\n默认: `On`\n指定错误是否应记录到服务器的错误日志。\n\n#### `magic_quotes_gpc`\
  \ 布尔值（开启/关闭）\n默认: `Off`\n\n## 654\n\n## 录 B\n\n# PHP 配置选项\n\n当为 `On` 时，自动用反斜杠转义所有的单引号、双引号、反斜杠和\
  \ Null。所有的 `GET`、`POST` 和 cookie 变量都会通过此指令自动转义。出于性能考虑，此设置的默认建议是 `Off`。转义字符串会产生一定的开销。在请求量大的服务器上，这可能会积累成大量的工作量。\n\
  \n#### `magic_quotes_runtime` 布尔值（开启/关闭）\n默认: `Off`\n以与 `magic_quotes_gpc` 相同的方式转义任何从外部源返回的数据。出于性能考虑，此指令的默认配置为\
  \ `Off`。转义字符串会产生一定的开销。在请求量大的服务器上，这可能会积累成大量的工作量。\n\n#### `magic_quotes_sybase` 布尔值（开启/关闭）\n\
  默认: `Off`\n此指令专门用于 Sybase。它用另一个单引号来转义单引号，而不是使用反斜杠。\n\n#### `max_execution_time`\
  \ 整数（秒）\n默认: `30`\n设置任何 PHP 脚本允许执行的最长时间。如果脚本超过此时间，它将被简单终止。这可以防止 CPU 密集型脚本消耗过多的线程，并防止编写不当的脚本导致服务器崩溃。在托管环境中，此指令可以设置为少于\
  \ 30 秒。\n\n#### `memory_limit` 整数（文件大小）\n默认: `8M`\n设置脚本可能消耗的最大内存。这是另一个防止编写不当的脚本导致服务器崩溃的有用选项。\n\
  \n#### `nsapi_ext` 字符串（扩展名: .jpg;.php;.gif 等.）\n默认: (未包含)\n列出 PHP 配置为 NSAPI 模块时的文件扩展名。用分号分隔多个扩展名。对于其他版本的\
  \ PHP，请参见 `cgi_ext` 和 `isapi_ext`。\n\n#### `open_basedir` 字符串（目录）\n默认: (空)\n将可以打开的文件限制在特定目录及其下的所有内容中。特殊配置选项\
  \ `.`（点）意味着将使用的目录是执行的 PHP 脚本所在的目录。此选项可用于增强安全性，并在托管环境中非常有用；它可以防止人们打开任何不属于他们文件。\n\n\
  #### `precision` 整数\n默认: `14`\n\n## 655\n\n# 通用配置选项\n\n设置浮点数允许的精度。同时也决定显示浮点数时的有效位数。\n\
  \n#### `register_argc_argv` 布尔值（开启/关闭）\n默认: `On`\n告知 PHP 是否声明变量。\n\n#### `register_globals`\
  \ 布尔值（开启/关闭）\n默认: `Off`\n决定 `GET`、`POST`、cookie 和服务器变量是否被复制到全局作用域。此设置从 PHP 4.0 开始可用。\n\
  \n#### `short_open_tag` 布尔值（开启/关闭）\n默认: `Off`\n设置是否允许 `<?` 和 `?>` 标签。建议在生产环境中此选项为\
  \ `Off`。\n\n#### `track_errors` 布尔值（开启/关闭）\n默认: `Off`\n决定 PHP 是否提供 `php_errsg`。\n\
  \n#### `track_vars` 布尔值（开启/关闭）\n默认: `On`\n决定环境变量、`GET`、`POST`、cookie 和服务器变量是否放入它们自己的关联数组。\n\
  \n#### `upload_tmp_dir` 字符串（目录）\n默认: (空)\n设置通过 HTTP 上传到服务器时使用的临时目录。此目录应该是运行 PHP\
  \ 的用户可写入的。\n\n#### `upload_max_filesize` 整数（文件大小）\n默认: `2M`\n决定上传文件的最大大小。可以在整数值后附加\
  \ `M` 来指定兆字节。与其使用 `2000000` 字节，你可以直接使用 `2M`。\n\n#### `user_dir` 字符串（字符串）\n默认: (空)\n\
  设置用户目录的名称。\n\n#### `variables_order` 字符串（字符串）\n默认: `EGPCS`\n\n## 656\n\n识别解析各种变量（环境、GET、POST、cookie、服务器）的顺序。这是设置变量的推荐指令；`gpc_order`\
  \ 已弃用。以下列表显示了变量顺序字符串中每个字母的含义：\n\n#### **E**: Environment\n- **G**: GET\n- **P**:\
  \ POST\n- **C**: Cookies\n- **S**: Server\n\n#### `warn_plus_overloading` 布尔值（开启/关闭）\n\
  默认: `Off`\n当使用加号拼接字符串时产生警告。应该使用 `.` 运算符，而不是 `+`。此指令有助于发现此类错误。在生产环境中最好将此指令留为 `Off`。在开发期间，此选项应为\
  \ `On`。\n\n## 安全模式配置选项\n\n*提示*\n\n*在此类别中，选项按照它们在 `php.ini` 中出现的顺序进行描述*。这些指令有助于微调\
  \ PHP 提供的“安全模式”配置。PHP 的安全模式旨在允许在多个用户访问同一系统的托管环境中安全使用 PHP。\n\n#### `safe_mode` 布尔值（开启/关闭）\n\
  默认: `Off`\n开启或关闭安全模式。\n\n#### `safe_mode_gid` 布尔值（开启/关闭）\n默认: `Off`\n当 `safe_mode`\
  \ 为 `On` 时，只有当脚本的 UID（用户 ID）与文件函数的操作者匹配时，PHP 才会执行脚本。如果*此*指令为 `On`，则将此限制放为 GID（组\
  \ ID）比较。\n\n#### `safe_mode_include_dir` 字符串（目录）\n默认: (空)\n\n\n\n\n\n# 658\n\n##\
  \ 附录 B\n\n### PHP 配置选项\n\n许多选项与 `highlight_file()` 函数有关。所有颜色都可以通过 `highlight.` 指令组进行自定义；显示了每项的默认设置。（括号中的颜色名称不在配置文件中；为了清晰起见，我们添加了这些内容。）\n\
  \n`output_buffering` 整数（缓冲区大小）或布尔值（On/Off）\n默认值：4096\n\n如果此指令设置为 `On`，则对所有 PHP 脚本启用输出缓冲。如果提供整数，则输出缓冲区将不会超过该大小。默认值是永远不允许输出缓冲区超过\
  \ 4,096 字节。\n\n`y2k_compliance` 布尔值（On/Off）\n默认值：Off\n\n切换 PHP 是否完全符合 Y2K 标准。由于某些不兼容的浏览器，此设置的默认值为\
  \ `Off`。\n\n`zlib.output_compression` 布尔值（On/Off）\n默认值：Off\n\n如果设置为 `On`，PHP 将透明地使用\
  \ `zlib` 压缩所有输出。任何可以处理压缩内容的浏览器（目前大多数浏览器都是如此）都能正确处理这些内容。为了覆盖尽可能广泛的读者，此指令默认保持 `Off`。\n\
  \n![Image 131](img/index-684_1.jpg)\n\n## 附录 C\n\n### XHTML 实体\n\nWeb 文档经常包含“难以”编码为文本的字符——是因为它们太稀有，标准键盘实际上没有对应的按键来输入；要么是因为像\
  \ `<` 或 `\"` 这样的“特殊”字符，因为将它们插入文档中会干扰“正常”标记。为了帮助文档作者（也就是你！）插入这些字符，XHTML 提供了专门定义的\
  \ `entities`（实体），可以用来代替字面字符。\n\n为了回顾一个对任何标记过几个 Web 文档的人来说都应该熟悉的常见示例，如果你需要创建一个包含类似内容的\
  \ Web 文档：\n\nThe comparison 4 < 5 is TRUE.\n\n你可以在 XHTML 源代码中输入以下内容来代替：\n\nThe comparison\
  \ 4 &lt; 5 is TRUE.\n\n显然，将第一句原封不动地输入 XHTML 文档中会导致大多数浏览器在遇到 `<` 字符时解析错误。为了避免第二个问题，我们使用\
  \ `entities`。为了帮助文档作者（也就是你！）插入这些字符，XHTML 提供了专门定义的 `entities`，可以用来代替字面字符。\n\n问题在于，操作系统制造商没有使用相同的字符集来表示各种字符。例如，当我在\
  \ Macintosh 计算机上输入左双引号 ““ 时，操作系统可能会将磁盘上的该字符编码为表示数字 210 的 8 位字符串（即 11010010），因为这是\
  \ Mac-Roman 字符集分配给该字符的数字“代码”。但在被称为 CP-1250 的 Windows 字符集中，数字代码 210 对应于带有弯音符号（caron）的大写字母\
  \ N：因此，在 Mac 上创建的 Web 文档在 Windows 浏览器中显示时，可能包含字符而不是左引号。\n\n右双引号的情况也是如此；Mac-Roman\
  \ 字符集将其编码为数字 211，但在 CP-1250 字符集中，211 对应于 Ó。如果你浏览 Web 网页有一段时间了，无疑至少见过过一次这种影响的影响。（在相反方向上，这种不兼容性会有略不同的影响；在\
  \ Windows 机器上输入的左右双引号在 Mac 上会显示为带重音的 i 字符。）\n\n*提示*\n\n欲欲更多关于字符集和编码问题的详尽信息，请参阅 Roman\
  \ Czyborra 出色的个人网站：www.czyborra.com。\n\n接下来的表格显示了 XHTML DTD 中定义的三个组字符实体。只要你在文档开头使用\
  \ XHTML 三种标准 DOCTYPE 声明之一，这些实体就可以自动供你的 XHTML 文档中使用：\n\n```xml\n<!DOCTYPE html\n\
  PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"DTD/xhtml1-strict.dtd\">\n\nor:\n\
  \n<!DOCTYPE html\nPUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"DTD/xhtml1-transitional.dtd\"\
  >\n```\n\n\n\n\n\n```html\n<!DOCTYPE html\n\nSTANDARD CHARACTERS\n\n**661**\n\n\
  PUBLIC “-//W3C//DTD XHTML 1.0 Frameset//EN”\n\n“DTD/xhtml1-frameset.dtd”>\n```\n\
  \n*这些列表 © 1986 国际标准化组织。在符合 ISO 8879 定义的符合标准的 SGML 系统和应用程序中使用，允许以任何形式复制，前提是所有副本中必须包含此通知。*\n\
  \n## 使用实体访问 Unicode 字符\n\n你并不限于本章表格中列出的符号。实际上，你可以通过在 XHTML 文档中插入数字字符实体引用来引用任何 Unicode\
  \ 字符——其数量成千上万，从古代字形到现代日语汉字，再到音乐符号标记。例如，你可以这样写字符串“Hello, World!”：\n\n\n\n`&#x48;&#x65;&#x6c;&#x6c;&#x6f;&#x2c;\
  \ &#x57;&#x6f;&#x72;&#x6c;&#x64;&#x21;` 在此情况下，每个实体都通过其 Unicode 字符数字引用——因此在开头的 `&`\
  \ 之后有一个 `#` 字符。字符代码前的 `x` 是给浏览器的提示，“嘿！后面的数字是十六进制格式！”我们提供了十六进制数字，但也可以以十进制形式给出，因此\
  \ `o` 的代码变为了 `&#108` 而不是 `&#x6f;`。\n\n事实上，XHTML DTD 声明附录中显示的所有实体仅仅是为了方便；即使它们不是 DTD\
  \ 的一部分，我们仍然可以使用 `&#xA0` 而不是 `&nbsp;` 在文档中插入不换行空格。（但 `&nbsp;` 要好记得多，所以我们改为使用它。）由于没有为例如希伯来字母\
  \ *shin* 定义 XHTML 实体，我们被迫通过其 Unicode 数字（十六进制为 `5E9`）来引用它，我们将其写为完整的实体引用即为 `&#x5E9;`。\n\
  \n但请记住，仅仅因为你可以在 Web 页面输入字符实体引用，并不意味着浏览器能够实际显示它。如果你在文档中输入了 `&#x5E9;`，但查看页面的访问者没有包含希伯来字符的字体，那么你的实体引用将渲染为“无法显示”（通常是一个空方框）。\n\
  \n要查看所有 Unicode 字符表，请参阅 `www.unicode.org/charts/`，你可以在那里下载显示 Unicode 各种子集的 PDF（图表按逻辑分为若干组，如亚美尼亚语、盲文模式、几何形状等）。Roman\
  \ Czyborra 的个人网站 `www.czyborra.com` 也包含了大量关于 Unicode 的有用信息。\n\n*对于某些看起来像两个挤在一起的拉丁字母的字符（如\
  \ æ），ISO 列表将其命名为“连字（ligatures）”。这是一个误称；大多数语言通常将此类字符视为单个原子字母。因此，我们在这些表格使用了“字母（letter）”一词。*\n\
  \n## 标准字符\n\n表 C.1 列出了大多数标准字符的 XHTML 实体。这些实体的声明可以在以下 URL 找到：\n\n`http://www.w3.org/TR/xhtml1/DTD/xhtml-lat1.ent`\n\
