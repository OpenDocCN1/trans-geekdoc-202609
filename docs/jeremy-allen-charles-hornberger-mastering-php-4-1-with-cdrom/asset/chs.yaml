  \ `imap_body()` 的相同。）例如，定义 IMAP 协议的 RFC 给出了一个复杂的多部分 MIME 消息示例以及每个部分对应的数字标识符：\n\n\
  - 消息的 `HEADER [RFC-822]`\n- `1 TEXT/PLAIN`\n- `2 APPLICATION/OCTET-STREAM`\n- `3\
  \ MESSAGE/RFC822`\n- 消息的 `3.HEADER [RFC822]`\n- 消息的 `3.TEXT [RFC822]` 正文\n- `4 MULTIPART/MIXED`\n\
  - `4.1 IMAGE/GIF`\n- `4.1.MIME [MIME-B]` `IMAGE/GIF` 的头部\n\n\n\n\n决定将 PHP 作为 Apache\
  \ 模块还是作为通用网关接口（CGI）解释器运行\n\n# 选择分发方法\n\n有多种分发方法可以获取 PHP 和 Apache：\n\n◆ 从源码编译\n◆\
  \ 分发源码\n◆ 分发二进制文件\n◆ 安装 RPM 软件包\n\n**626**\n\n**附录 A**\n\n# 安装 PHP 快速上手\n\n大多数生产服务器上最常用的方法是从源码编译，这允许将生产服务器所需的所有模块和编译时选项编译到程序中。从源码编译时，生成的二进制文件和模块还可以针对目标系统进行优化，这在为生产环境编译时一直是非常理想的。以\
  \ Red Hat 软件包管理器 (`RPM`) 等格式提供的“全家桶”二进制文件通常包含许多用用的冗余功能，会消耗更多内存。\n\n源码分发是组成程序的实际代码。需要编译器（例如\
  \ Unix 平台上的 `GCC` 或 Win32 平台上的 `MSVC++ 6`）来编译程序并生成可以在你的目标平台上运行的二进制文件。这是最灵活的方法，因为它允许你显式地选择希望将哪些选项编译到软件中。二进制分发通常指的是为特定平台预编译的文件——例如为\
  \ Windows 平台编译的 Apache。此类二进制文件仅在编译时所在的平台上运行。并非所有机器都是相同的，因此源码分发通常也允许编译脚本针对特定的目标系统进行优化。\n\
  \nUnix 平台还有另一种分发技术，这是一种更高级的二进制打包形式。`RPM` 是 Red Hat 软件包管理器。它允许任何安装了可用 `RPM` 的系统安装预编译的包。`RPM`\
  \ 软件包也可以从源码编译；然而，使用软件包配置编译时选项要困难得多。\n\n## 为 Linux 获取 PHP 和 Apache\n\n为了方便起见，配套的光盘中包含了最新版本的\
