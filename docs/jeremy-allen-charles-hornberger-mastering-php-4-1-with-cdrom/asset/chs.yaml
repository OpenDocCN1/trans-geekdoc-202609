  \    if (trim ($p['password']) == '')\n        flag_error (‘password’, ‘请输入密码。’);\n\
  \n    // 如果数据其他有效，尝试插入记录\n    if (count ($errors) == 0)\n    {\n        // 连接数据库\n\
  \        $dbh = pg_connect (“host=localhost dbname=myapp”);\n        if (!$dbh)\
  \ die (DB_ERR_DOC);\n        // 将一切封装在事务中\n        $sql = ‘BEGIN TRANSACTION’;\n\
  \        $res = pg_exec ($dbh, $sql);\n        if (!$res) die (DB_ERR_DOC);\n  \
  \      pg_result ($res); // 检查用户名是否唯一\n        $sql = ‘SELECT count (*) FROM users\
