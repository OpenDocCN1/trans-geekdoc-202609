  \ | 字符串 “1”或“0” |\n| 浮点数 | 字符串形式的数字 |\n| 整数 | 字符串形式的数字 |\n| 对象 | 字符串 “Object” |\n\
  | 字符串 | 与之前的值相同\n\n### 整数与浮点数转换\n\n通常不需要转换为整数，因为任何需要整数的函数或运算符都会自动进行转换。考虑以下代码：\n\n\
  ```php\n<?php\n$my_array = array();\nif($my_array) {\n    print(“The array contains\
  \ one or more elements”);\n}\nelse {\n    print(“The array contains no elements”);\n\
  }\n?>\n```\n\n这段代码将输出“The array contains no elements”，因为数组是空的，因此第一个逻辑测试的结果为 False。这种转换是在我们没有任何干预的情况下自动完成的。如果数组包含任何键/值对，那么代码将打印数组包含一个或多个元素。\n\
