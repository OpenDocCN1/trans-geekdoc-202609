  语法错误（或 `parse errors`，解析错误）是 PHP 在首次解析脚本时捕获并立即发出警告的错误。错误可能仅仅是漏掉了一个分号或括号。这类错误通常是最容易发现和修复的。\n\
  \n下一种错误类型是 `run-time errors`（运行时错误）。PHP 脚本在语法上是有效的，一切看起来 `looks` 没问题，但在脚本执行过程中发生了问题。你可能尝试向文件写入内容，但无效的文件句柄甚至网络连接的缺失可能会阻止这一操作。定位运行时错误有时具有挑战性，但一旦定位了错误，修复它就是一项更简单的任务。\n\
  \n182\n\n# 第 7 章\n\n### 调试与错误\n\n最困难且隐蔽的错误是那种实际上并没有产生任何类型错误的错误。\n\n这些错误通常发生在程序的概念或逻辑中，因此被称为\
  \ `logic errors`（逻辑错误）。在这里，从 PHP 的角度来看，程序运行正常，但它并没有实现程序员预期的结果。这一个常见的例子是写错了变量名；程序将直接对这个命名写错误的变量进行操作，而不是正确的变量。这些错误通常最难追踪和修复。通常，除了结果之外，对错误本身知之甚少，因此识别逻辑错误并将其消灭在某种程度上是一门艺术。\n\
  \n## 解析错误 (Parse Errors)\n\n解析错误表示 PHP 解释器无法正确解释 PHP 脚本，因为该脚本中存在格式错误。解析错误是所有错误类型中最常见且不危险的，因为它们通常是由遗忘输入代码元素这种无害且易于修复的问题引起的。虽然解析错误很容易，但只要你知道要寻找什么，它们是可以预防的。它们通常是最容易修复的，因为它们阻止了脚本运行，而且\
  \ PHP 非常擅长提醒我们错误的性质和位置。\n\n了解解析错误的最常见原因是防止和消除它们的第一步；一些常见原因如下：\n\n◆ 缺少分号\n◆ 关键字拼写错误或逻辑结构缺失\n\
  ◆ 不匹配的大括号、圆括号和方括号\n◆ 忘记使用美元符号作为变量前缀\n◆ 字符串中对特殊字符的转义不当\n\n### 缺失的分号\n\n缺少标点符号已经困扰了程序员二十多年。缺失的分号几乎肯定会导致\
  \ PHP 解释器停止运行并让你知道这个极具人性化的错误。让我们看看这种错误长什么样：\n\n```php\n<?php\n$i = 1;\n\ndo\n{\n\
  print(“Going loopy <br />\");\n$i++\n}\n?>\n```\n\n这段代码片段创建了最基础的错误之一：语法错误。你能发现缺失的分号吗？在\
  \ `$i++` 之后，应该有一个分号表示该表达式已完成。这里没有分号，PHP 不喜欢这样，所以它导致了解析错误。图 7.1 显示了当你创建一个解析错误时看到的内容。\n\
  \n![Image 19](img/index-208_1.jpg)\n\n理解错误类型\n\n183\n\n图 7.1：解析错误（缺失的分号）\n\n这个错误非常容易发现；只需在第六行末尾添加一个分号即可解决。\n\
  \n在插入分号后，你可能希望脚本能够正常执行。但等等——还有另一个问题！继续阅读……\n\n### 缺失的关键字或逻辑结构\n\n添加分号后，PHP 给了我们一个全新的错误：\n\
  \n`Parse error: parse error, expecting ‘T_WHILE’ in /home/www/html/MasteringPHP/Chapter7/missing_semi.php\
  \ on line 9`\n\n这个错误几乎直接说明了它的意思：它期望一个 `while` 结构，因为 `do` 结构需要一个 `while` 对应结构。（忽略错误信息中的行号；它们并不总是匹配，因为为了保持重点，我们在打印的代码中进行了一些简化。）\n\
  \n这是一个缺失关键字的例子。`do` 循环逻辑上意味着“当某事为真时执行某事”。我们可以通过为 `do` 循环添加 `while` 子句来修正这段代码并使其正常工作。让我们为\
  \ `do` 循环添加 `while` 子句。\n\n```php\n<?php\n$i = 1;\n\ndo\n{\nprint(“Going loopy <br\
  \ />\");\n$i++\n}\nwhile ($i < 10);\n?>\n```\n\n### 圆括号、大括号和方括号\n\n缺失的括号很难发现，尤其是当你盯着它们看了几个小时之后。然而，PHP\
  \ 解释器通常很智能地识别错误并告诉你是什么，PHP 允许一些非常复杂的表达式，你的眼睛永远是发现语法错误的最佳工具。\n\n184\n\n第 7 章\n\n\
  调试与错误\n\n列表 7.1：圆括号、大括号和方括号\n\n```php\n<?php\n$array = array(\n\"one\" => \"apple\"\
  ,\n\"two\" => \"banana\",\n\"three\" => \"cherry\"\n);\n\nforeach ($array as $key\
  \ => $value) {\n    if ($key == \"two\") {\n        echo \"This is a banana!\";\n\
  \    }\n    echo $value;\n}\n```\n\n### 缺失的美元符号\n\n缺失美元符号是另一个错误，这是 PHP 特有的。PHP 中的任何变量都必须在前面有一个美元符号，以告诉\
  \ PHP 解释器它看到的是一个变量。让我们来看一个包含美元符号错误的示例。\n\n*警告*\n\n*除非你的浏览器有死意愿，否则不要运行此脚本。*\n\n```php\n\
  <?php\n```\n\n\n\n\n\n```php\n$variable_name = “foo”;\n\nvariable_name = 100;\n\n\
  for($i = 0; $i < $foo; $i++)\n{\nprint(“something”);\n}\n\n?>\n```\n\n这个脚本看起来足够简单。将变量设置为“foo”。然后将动态命名的\
  \ PHP 变量 `foo` 设置为一百，并将 `foo` 作为 for 循环中控制的一部分。这里有几个错误，其中一个非常隐蔽。\n\n第一个错误是第二个 `variable_name`\
  \ 前面缺少两个美元符号。通过添加这些符号可以纠正此错误：\n\n`$$variable_name = 100;`\n\n下一个解析错误将导致 PHP 进入一个循环，字面意义上的且永久的循环。因为\
  \ PHP 无法确定 `i` 是什么，它会一直循环，直到 PHP 检测到 Apache 工作线程已经运行了太久；最终它会被杀掉。修复方法只需要一个美元符号，但如果这种错误不小心进入生产环境，这一个符号就会给用户和你的服务器带来巨大的麻烦。修复方法如下所示：`for($i\
  \ = 0; $i < $foo; $i++)`\n\n**186**\n\n## 第 7 章\n\n### 调试与错误\n\n就是这样——仅仅一个字符就意味着无限循环的区别。从一开始，对任何类型的循环结构保持谨慎都是好主意。\n\
  \n#### 字符串中的字符转义\n\n转义特殊字符（例如在以双引号开字符串中使用双引号）是程序员必须做的最令人困惑和恼的事情之一。在处理使用单引号和双引号指定其属性值的标记语言时，这是一种不可避免的恶。在处理字符串并减少生成的解析错误总数方面，有几种方法相当有效。\n\
  \n让我们来看几个例子：\n\n```php\n<?php\n// 格式 1\necho “<html><head><title>PHP Errors</title></head>\"\
  ; echo “<body bgcolor=\\”red”>;\necho “</body></html>”;\n?>\n```\n\n```php\n<?php\n\
  // 格式 2\necho ‘<html><head><title>PHP Errors</title></head>`; echo ‘<body bgcolor=”red’>;\n\
  echo ‘</body></html>’;\n?>\n```\n\n在这两个脚本中，`bgcolor` 属性的值都没有被正确关闭，导致 `echo` 语句也没有关闭。在格式\
  \ 1 中，引号必须转义，因此语法错误更难发现。在格式 2 中，由于字符串内允许不转义地使用双引号，错误更容易跳入我们的视野。\n\n虽然这接近于风格和项目标准问题，但它们确实会导致错误，考虑错误的最终可读性和发现错误的难易程度是非常重要的。代码片段的修正版本列在下方：\n\
  \n```php\n<?php\n// 格式 1\necho “<html><head><title>PHP Errors</title></head>\";\
  \ echo “<body bgcolor=\\\\”red\\\\>”;\necho “</body></html>”;\n?>\n```\n\n```php\n\
  <?php\n// 格式 2\necho ‘<html><head><title>PHP Errors</title></head>`; echo ‘<body\
  \ bgcolor=”red”>’;\necho ‘</body></html>’;\n?>\n```\n\n### 理解错误类型\n\n**187**\n\n\
  格式 2 提供的字符串转义字符杂乱少得多，这减少了为了发现错误而必须进行的思考。我们知道在第二个片段中不需要转义双引号，因此更容易找到缺失的双引号。\n\n####\
  \ 运行时错误\n\n*注意*\n*此类错误的另一种较不常用的术语是语义错误。*\n\n当代码在语法上完全有效，但仍然存在错误（可能在脚本本身之外）导致其无法执行预定任务时，就会发生运行时错误。\n\
  \n以下是一些常见的运行时错误：\n\n- 正在访问的数据库不存在，或表被重命名。\n- 包含的文件不在 `include_path` 中。\n- PHP 服务器进程没有访问文件的权限。\n\
  - 互联网主机由于任何原因无法访问。\n\n在整个章节中，你将学习一些在整个 PHP 中非常常见且一致的错误处理技术。PHP 为我们提供了许多处理错误的方法。\n\
  \n列表 7.2 展示了一个典型的运行时错误。\n\n**列表 7.2: 一个运行时错误**\n\n```php\n<?php\n/* 连接到 PostgreSQL\
  \ 数据库 */\n$db_connection = pg_connect(\n“host=127.100.0.1 port=5432 dbname=MasteringPHP\
  \ user=jallen”);\n/* 将要执行的查询存储在变量中 */\n$pets_query = “SELECT P.PetName,\nO.FirstName,\n\
  O.LastName,\nPT.CommonName\nFROM Pet P\nINNER JOIN Owner O ON O.OwnerID = P.OwnerID\n\
  INNER JOIN Pet_Type PT ON PT.PetTypeID = P.PetTypeID;”;\n/* 将查询发送到 PostgreSQL 执行\
  \ */\n$query_result = pg_exec($db_connection, $pets_query);\nprint pg_numrows($query_result);\n\
  pg_close($db_connection);\n?>\n```\n\n![Image 20](img/index-213_1.jpg)\n\n**188**\n\
  \n## 第 7 章：调试与错误\n\n这段代码比简单的解析错误复杂一点。PHP 生成的错误看起来如图 7.2 所示。显然无法连接数据库。此外，每个期望有效 PostgreSQL\
  \ 链接或结果资源的后续函数调用都导致了错误，因为数据库不可用。\n\n**图 7.2**\n语义错误（缺少数据库）\n\n第一个错误从警告开始，显示对于主机\
  \ 127.100.0.1 没有 `pg_hba.conf` 条目。这很容易被忽略，当你扫视时，你的眼睛会直接跳过问题：预想的主机实际上是 127.0.0.1\
  \ (localhost)，但拼写错了。脚本已经完全失败了。它没有连接到远程数据库，因此没有完成我们要求它做的任何事情。\n\n在分析此问题的实际源（该问题每次执行脚本时都会发生）之前，我们可以通过向脚本添加错误处理来使脚本更健壮。\n\
  \n*提示*\n*PHP 中有一个错误抑制操作符：at 符号 @。当放在任何表达式之前时，它将完全抑制该语句可能产生的任何错误。然而，完全抑制错误是危险的，因此此运算符应该谨慎使用。*\n\
  \n#### 编写消息\n\n现在我们已经可以抑制错误消息了，我们真的需要在连接失败时做些什么。如果无法建立远程数据库，`pg_connect()` 函数将返回\
  \ `False`。`pg_connect()` 的返回值结合抑制运算符，为我们提供了一种优雅处理无法连接的方法。\n\n*注意*\n*我们所说的“优雅”是指在脚本退出时我们处于控制之下，并选择做什么，例如记录或报告错误。*\n\
  \n我们在列表 7.2 的第一个语句中添加 `@` 运算符以抑制常规错误消息，然后插入一个新的代码块来处理错误：\n\n```php\n<?php\n/* 连接到\
  \ PostgreSQL 数据库 */\n$db_connection = @pg_connect(\n“host=127.100.0.1 port=5432\
  \ dbname=MasteringPHP user=jallen”);\n\n/* 处理任何连接失败 */\nif(!$db_connection)\n{\n\
  echo ‘<p style=”color: red;”>`;\necho ‘无法连接到 PostgreSQL 数据库’;\necho ‘</p>’;\ndie();\n\
  }\n?>\n```\n\n现在我们优雅地处理了连接数据库的失败。虽然这种失败是一个巨大的错误，但在未连接时我们仍然处于控制之下；因此脚本正在执行我们告诉它做的事情。\n\
  \n这已经改进了脚本的健壮性，因为我们提供了一个地方可以做某些事情，而不只是看着脚本崩溃。\n\n然而，这些都没有修复实际错误。将主机更改为 127.0.0.1\
  \ 纠正了这个错误，并增加了脚本按预期运行的概率。\n\n**缺失的文件**\n\n\n\n\n\nPHP 支持模块化编程的方法之一是 `include()`\
  \ 和 `require()` 系列函数。这些函数允许包含 PHP 代码的其他文件被包含并解释，就好像它们确实是包含它们的脚本的一部分一样。`php.ini`\
  \ 文件中控制可以在何处包含文件的配置选项之一是 `include_path` 选项。\n\n如果脚本尝试包含一个不在 `include_path` 中的文件，则该文件将无法包含。\n\
  \n听起来很简单，对吧？但当你正处于高强度的开发过程中时，这并不总是你脑海中第一个想到的事情。这里有一些 PHP 代码，可能会通过“包含”一个缺失的文件来产生错误：\n\
  \n```php\n<?php\n\ninclude“math_lib.php”);\n\n$big_number = add(10000, 10000);\n\
  \nprint($big_number);\n\n?>\n```\n\n运行此脚本时，PHP 会抛出以下错误：\n\n`Warning: Failed opening\
  \ ‘math_lib.php’ for inclusion`\n`(include_path='/home/www/html/includes’)` in `[path\
  \ to file]/inc_path.php` on line 2\n`Fatal error: Call to undefined function: add()`\
  \ in `[path to file]/inc_path.php` on line 4\n\nPHP 只是告诉我们无法打开该文件进行包含，但失败可能有多个原因。第一个也是最明显的原因是\
  \ `include_path`；确保你正在包含的文件在包含路径中。但这可能并不能让一切万无一……\n\n190\n\n**第 7 章**\n\n### 调试与错误\n\
  \n#### 文件操作与权限\n\n即使将 `math_lib.php` 移动到我们的包含路径中，如果文件的权限设置为不可读、不可写或不可执行，同样的错误仍然发生，因为\
  \ PHP 无法读取该文件！遇到此错误消息时，记住权限和包含路径都是重要的。一旦修复，除非服务器发生灾难性的故障，否则它不会再次出现，而那时，PHP 包含文件的问题可能最是你不需要担心的事情了。\n\
  \n文件权限值得进一步讨论，因为它们通常是麻烦的根源，而且非常容易被忽略。让我们看看 PHP 中的一些基本文件操作，以及我们如何通过处理出现的任何错误来改进它们。\n\
  \n```php\n<?php\n\n$fp = fopen“tmp_file”, “w”);\n\nfwrite($fp, “There is something\
  \ in my file!”);\n\nfclose($fp);\n\n`chmod 000 tmp_file;\n\n$fp = fopen“tmp_file”,\
  \ “r”);\n\nunlink“tmp_file”);\n\n?>\n```\n\n首先，脚本以“w”模式打开文件并向文件写入内容。写入文件后，关闭了文件指针。反引号运算符（``\
  \ ``）被用于执行 shell 命令。文件的模式被更改为“000”，这意味着该文件没有读、写或执行权限。在更改文件权限后，我们尝试打开文件；意不意外的是，现在被拒绝访问了。\n\
  \n虽然我们完全是编造了这种场景来创建一个权限问题，但这种情况在现实中经常发生。我们可以通过错误抑制运算符并检查 `$fp` 中的值来为脚本重新添加一些控制，类似于我们之前处理数据库连接错误的方式。\n\
  \n在脚本执行 `chmod` 之后之前，我们并不担心错误；因为我们正使用那部分代码来制造错误，所以我们可以有效地假装它不存在。但这里是了如何优雅地处理访问文件失败的方法：\n\
  \n```php\n<?php\n\n$fp = fopen“tmp_file”, “w”);\n\nfwrite($fp, “There is something\
  \ in my file!”);\n\nfclose($fp);\n\n`chmod 000 tmp_file;\n\n$fp = @fopen“tmp_file”,\
  \ “r”);\n\nif(!$fp)\n{\n\necho ‘<p style=”color: red;”>’;\n\necho ‘Could not open\
  \ the file’;\n\necho ‘</p>’;\n\n@unlink“tmp_file”);\n\ndie();\n\n}\n\n?>\n```\n\
  理解错误类型\n\n191\n\n现在我们再次控制了脚本的执行，即使在发生错误时也是如此。大多数函数在 PHP 中遵循相同的错误处理模式。\n\n还有一种权限错误需要查看，那就是\
  \ PHP 脚本本身的权限问题。我们已经见过被包含文件的权限问题，但还没有见过被直接调用的文件问题。创建一个使用 PHP 输出简单消息的脚本：\n\n```php\n\
  <?php\n\nprint“I am alive”);\n\ndie();\n\n?>\n```\n\n将此脚本保存为任选的文件名。使用类似下面的命令将该文件的权限更改\
  \ 000：\n\n`chmod 000 your_filename.php`\n\n现在尝试在浏览器中访问该文件，看看会发生什么。\n\n当 PHP 无法找到或访问我们尝试使用\
  \ `include()` 函数要包含的文件时，我们看到了相同的包含错误！这就是为什么记住文件权限如此重要。PHP 生成的错误对于几个不同原因是相同的：包含文件的权限、正在执行的脚本权限，以及文件不在包含路径中。\n\
  \n大多数情况下，运行时错误很容易检测，因为 PHP 对此提供了非常详尽的信息。但请记住整个上下文。不要只从字面上看错误或警告消息；要跳出它们，思考代码每个部分发生了什么。由于\
  \ PHP 的弱类型以及对编程中许多肮脏工作的抽象，这些错误在很大程度上并不怕，特别是在内存分配方面。\n\n**逻辑错误**\n\n逻辑错误是各地程序员的噩梦。逻辑错误发生在某些代码没有按照预期执行时，但它没有导致致命缺陷并继续运行。\n\
  \n虽然某些逻辑错误由于属于常见类别而容易捕捉，但大多数错误并不属于特定类型。根据定义，产生错误的逻辑是为了解决问题而创建的，因此通常是独特的。修复逻辑错误通常很容易；但发现逻辑错误可能很难。PHP\
  \ 为我们免去了编程中许多糟糕方面的麻烦。在 PHP 中，我们并没有对内存管理起太大作用——这些都是后台完成的。尽管 PHP 的弱类型通常可以防止错误，但它也可以掩盖它们；例如，在字符串上下文中使用整数时，PHP\
  \ 引擎会静地转换变量类型。尽管这通常是你想要的，但在某些情况下这是错误的决定。另一方面，总体在 PHP 这样的 Web 开发平台上，弱类型的优点通常大于代价。\n\
  \n我们将查看一些常见的逻辑错误类型，但正如我们所，这种错误类型最难确定和应用“通用”解决方案。\n\n**错误：差一错误**\n\n192\n\n“差一”错误是一个简单的错误，当程序员没有在正确的值上开始或停止变量赋值时产生。例如，你想让脚本在数组的六项中存储值。但你忘记了数组索引从\
  \ 0 开始，所以你的代码将值存储在 1 到 6，而不在第一项中放入任何内容。\n\n这里有一个存在差一错误的脚本片段。我们需要打印 15 次消息，但它只打印了\
  \ 14 次。\n\n```php\n<?php\n\n$loop_to = 15;\n\nfor($i = 1; $i < $loop_to; $i++)\n\
  \nprint“$i. Looping! <br />”);\n\n?>\n```修复此方法很简单，我们将在下一节中解释它，以演示在解决代码 Bug 时使用的良好方法。\n\
  \n**错误：弄乱“全局作用域”**\n\n如果你在函数或类方法定义中使用大量的全局变量，你就会增加在某点遇到两个“竞争”代码片段修改同一个全局变量的不愉快情况的概率。\n\
  \n\n\n\n\n例如，某些数据库密集型应用的新手会尝试将打开的数据库句柄的引用存储在诸如 `$dbh` 的全局变量中，以便在多次查询中重用，而无需承担重新连接的代价。例如，考虑以下两个（设计不当的）函数定义：\n\
  \n```php\nfunction my_dbconnect ($dsn) {\n  global $dbh;\n  if ($dbh) return TRUE;\n\
  \  if (!($dbh = pg_connect ($dsn)) return FALSE;\n  return TRUE;\n}\n\nfunction\
  \ my_dbquery ($sql) {\n  global $dbh;\n  if (!$dbh) return FALSE;\n  if (!($res\
  \ = pg_exec ($dbh, $sql)) return FALSE;\n  return $res;\n}\n```\n\n只要你只连接到一个数据库，这段代码就能正常工作；但一旦你的\
  \ Web 应用程序扩展，并决定将部分数据移动到另一个服务器或第二个数据库时，`my_dbconnect()` 函数就会变得不可靠。为了理解为什么这样，假设这些函数定义在\
  \ `mydb.php` 文件中，然后由另外两个 PHP 脚本 `foo.php` 和 `bar.php` 包含（通过 `include_once()` 或 `require_once()`），这两个脚本都使用了\
  \ `my_dbconnect()` 和 `my_dbquery()`；`foo.php` 中的代码使用了指向名为“foo”数据库的连接，而 `bar.php`\
  \ 使用指向名为“bar”数据库的连接。进一步假设，`bar.php` 包含了 `foo.php`。当 `bar.php` 第一次调用 `my_dbconnect()`\
  \ 时，函数将返回 True，尽管全局变量 `$dbh` 实际上指向的是错误数据库（“foo”）的连接。随后 `bar.php` 中本应使用“bar”数据库的后续查询将会失败。\n\
  \n理解错误类型\n\n这是一个简单的例子，但它展示了使用全局变量存储信息的危险性。\n\n通常情况下，你的脚本应该尽可能少依赖全局变量。相反，应该使用参数和返回值向函数调用发送数据并从中检索数据；毕竟，这正是它们的用处。\n\
  \n### 错误：假设情况是最好的\n\n每当你在 PHP 脚本中调用函数时，都要假设它会失败。逻辑错误的一个巨大来源（特别是在编程初学者编写的脚本中）仅仅是因为没有测试函数调用的返回值。这类似于前面描述的不存在或不可读的文件问题，尽管该问题实际上比这要普遍得多。\n\
  \n如果你对*任何*涉及 PHP 或用户定义函数的操作，并且没有测试函数的返回值以检查是否发生了错误，你就违反了“编程十诫”之一（其余九条也是“始终测试函数调用的返回值”）。\n\
  \n在本书中，为了节省空间或阐明代码的其他部分，我们有时也犯了这种严重且廉价的错误，但在现实世界中，这种偷工行为绝不应该被容忍。\n\n作为一个抽象的示例，考虑一个\
  \ PHP 脚本，它从互联网上某台机器的套接字连接迭代读取某些数据，并将结果缓存在本地文件中。如果在某次迭代过程中连接失败了但没有检测到该失败，那么缓存文件可能只包含请求数据的部分。然后，如果使用缓存文件的内容来处理对\
  \ PHP 脚本的后续请求，用户将看到不完整的数据。\n\nPHP 没有真正的异常处理机制（例如 Python 或 Java），这使得问题变得更加严重。这些语言有特殊的错误处理机制；Java\
  \ 实际上会编译编译包含针对程序执行期间可能发生的任何错误的错误处理代码。\n\n相比之下， PHP 中的许多最常用的函数依赖于可以想象的最原始的错误报告系统：如果它们成功，它们会返回一些有用数据，但如果它们失败了，它们只需返回\
  \ False，表示在某处、某时刻出了问题。返回值中这种错误代码和数据的混淆有时处理起来比较棘手。考虑 `substr(“abcdef”, “a”)` 将返回\
  \ 0，这等同于但并不相同于 False，表示在字符串“abcdef”的第 0 位找到了子字符串“a”。另一方面，`substr(“abcdef”, “g”)`\
  \ 将返回 False。在第一种情况下，PHP 返回了有用信息；在第二种情况下，它返回了错误代码。在这些情况下（不幸的是非常常见），你必须记住使用恒等运算符 `===`\
  \ 来区分 False 和 0；请参在本章后面的部分获取更多相关信息。\n\n### 错误：测试相等性而非标识性\n\n有时，PHP 奇妙的弱类型（通常在编写代码时为你节省大量麻烦）在尝试调试时反而会带来巨大的麻烦。问题在于\
  \ PHP 会根据内容自动确定变量的类型；当我们写 `$i = 5; $foo = “bar”;` 时\n\n## 第 7 章\n\n### 调试与错误\n\n\
  PHP 自动确定 `$i` 是整数，`$foo` 是字符串。同样，PHP 会在需要时自动将变量的值从一种类型“强制转换”到另一种类型。如果函数期望一个字符串参数但得到一个整数，PHP\
  \ 将自动计算该整数的字符串值并在执行函数时使用它。如果使用 `==` 运算符比较字符串和整数，PHP 会自动将右侧的值转换为相应的类型，以便与左侧的值进行比较。\n\
  \n与上面描述的其他逻辑错误一样，这是一个非常通用的错误类。你如何以及何时遇到它完全取决于你编写的代码，而且并没有什么类型转换错误倾向于出现的“常见位置”。特别需要注意的一点是\
  \ PHP 内置函数的返回值。例如，`fgets()` 函数始终返回字符串，但如果你认为你将从一个只包含数值的文件读取，那么这很容易被忘记。\n\n只要文件没有损坏，一切就能正常工作：如果它包含文本“0000”（四个零），并且你使用类似下面的代码对对其进行测试：\n\
  \n```php\n$filename = “/tmp/mynumber”;\n$fd = fopen ($filename, “r”);\n$contents\
  \ = fread ($fd, filesize ($filename));\nfclose ($fd);\n\nif ($contents == 0)\n \
  \ print (“Whew! 那太险了，但我们最终找到了一个 0.\\n”);\n```\n\n那么一切将按计划进行。然而，如果文件由于某种原因损坏并包含非数字字符，你将面临麻烦。为了理解为什么，考虑以下脚本在执行时会打印“Oops!”：\n\
  \n```php\n<?php\nif (“platypus” == 0)\n  print (“Oops!”);\n?>\n```\n\n天哪！恐惧和绝望！我们该怎么办？！嗯，处理这类问题有两种方法。\n\
  \n- 首先，注意你调用的任何函数的返回值。\n- 第二，使用恒等运算符 `===`，它测试以确保左右操作数在类型*和*值上都匹配，而不是相等运算符 `==`。\n\
  \n虽然恒等运算符不能解决前面提到的文件损坏问题（因为字符串 `$contents` 必须转换为整数才能进行*任何*比较，而这种转换会掩盖数据的任何损坏），但它解决了“platypus\
  \ 等零”的问题，这种问题在变量包含与你程序员预期的值不同的类型时随时出现。\n\n调试方法\n\n调试不是一门精确的科学。有时，它是如此晦奥，以至于看起来像是巫术。但为了有效地解决最恼人的错误，可以采取一些重要的考虑因素和步骤。找到错误是调试应用程序问题的一半胜利；一旦定位错误，修复它通常要容易得多。调试*不是*不可能的，尽管它很棘，但它不是巫术。\n\
  \n\n\n\n\n当以一种系统化且一致的方法进行调试时，寻找错误来源会变得容易得多。追踪 bug 就像解决一个科学问题。要做的第一件事是在它的“自然栖息地”中观察错误。这比许多程序员所认为的要重要得多；如果我们不在一个与最终生产环境完全匹配的设置下测试脚本，我们就无法确定是否已经发现了每一个潜在问题。（事实上，我们可以相当确定自己还没有找到它们！）观察错误以及它如何变化（如果变化的话）是确定错误可能来源的重要步骤。在观察错误之后，我们可以开始假设错误可能源于何处。\n\
  \n在我们对错误来源做出推测后，当然自然会尝试修复它。\n\n在修复错误后，我们会对其进行反复“敲击”，确保它真的被修复了，重新检查应用程序以及与之密切相关的任何内容。这个过程看起来可能像本能，也可能像是一堆繁琐的负担。但无论调试如何进行，方法论可能是其中最重要的一个方面。在整个过程中，最重要的步骤之一就是定位错误。\n\
  \n### 我们的方法论\n\n我们的基本方法论是这样的：\n\n1. **一致地重现 bug。**\n2. **对 bug 的产生进行假设。**\n3. **找到\
  \ bug 源码。**\n4. **修复 bug——且只修复 bug。**\n5. **测试修复结果。**\n\n### 示例：差一错误 (Off-by-one\
  \ Error)\n\n让我们用这种一致且理性的方法来处理一个差一错误。这里再次是导致错误的代码段。正如我们在前一节所说，我们需要打印 15 次消息：\n\n\
  ```php\n<?php\n\n$loop_to = 15;\n\nfor($i = 1; $i < $loop_to; $i++)\n\nprint“$i.\
  \ Looping! <br />”);\n\n?>\n```\n\n第一步，重现 bug，很容易的。我们可以刷新脚本，并发现 bug 持续发生：只打印了 14\
  \ 行。\n\n接下来，第二步，我们对为什么只打印了 14 行做一个合理的推测。我们的猜测是 `for` 循环在某种程度上差了 1。然后（第三步）我们必须定位问题的实际原因。\n\
  \n通过检查实际循环结构，我们可以看到变量 `$i` 首先被初始化为 1。循环的意思是“只要变量 `$i` 小于变量 `$loop_to`（即 15），就一直循环”。循环从\
  \ 1 开始，在 14 停止；14 小于 15，但 15 *并不* 小于 15……所以当 `$i` 为 15 时，循环不再执行。我们已经识别了问题的源。\n\n\
  现在我们确切知道了 bug 的来源，我们需要在第四步中为该 bug 创建修复方案。\n\n有几种方法可以修复它：\n\n* 我们可以让 `$loop_to` 等于\
  \ 16。\n* 我们可以将 `$i` 初始化为 0。\n* 我们可以将条件改为“循环直到 `$i` 小于或等于 `$loop_to`”。\n\n由于 PHP\
  \ 通常将数组和循环从 0 开始，最简洁且最合适的解决方案是将 `$i` 初始化为 0。让我们进行更改并（第五步）看看我们的修复是否正确。我们将脚本更改为：\n\
  \n```php\n<?php\n\n$loop_to = 15;\n\nfor($i = 0; $i < $loop_to; $i++)\n\nprint“$i.\
  \ Looping! <br />”);\n\n?>\n```\n\n我们现在打印了十五个项目！\n\n在接下来的几个章节中，我们将描述一些关于彻底消灭 bug\
  \ 的通用指南。\n\n#### 理解问题\n\n一旦 *理解* 了问题，消灭 bug 就会变得容易得多。\n\n---\n\n### 第 7 章：调试与错误\n\
  \n#### 理解错误级别\n\n大多数错误会属于之前提到的三种类型之一：解析、语义或逻辑。这些类别非常广泛，涵盖了各种场景。处理每种类型的策略也不同。\n\n\
  但在学习处理错误的工具之前，需要理解不同的错误级别。\n\n错误级别是描述错误类型的另一种方式。表 7.1 列出了并描述了 PHP 生成的错误级别（下所示）。\n\
  \n| 值 | 常量 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `E_ERROR` | 运行时的致命错误 |\n| 2 | `E_WARNING`\
  \ | 非致命警告 |\n| 4 | `E_PARSE` | 语法错误 |\n| 8 | `E_NOTICE` | 注意到可能存在问题——通常没有警告那么危险，只是需要引起注意\
  \ |\n| 16 | `E_CORE_ERROR` | PHP 启动时发生的严重错误——罕见且几乎总是致命的 |\n\n\n\n\n32\n\n`E_CORE_WARNING`\n\
  \nPHP 启动时生成的警告（通常是危险的）\n\n*见下页*\n\n198\n\n## 第 7 章\n\n### 调试与错误\n\n**表 7.1：PHP 错误级别（续上）**\n\
  \n| 值 | 常量 | 描述 |\n| :--- | :--- | :--- |\n| 64 | `E_COMPILE_ERROR` | 脚本编译阶段发生的错误\
  \ |\n| 128 | `E_COMPILE_WARNING` | 脚本编译期间生成的警告 |\n| 256 | `E_USER_ERROR` | 程序员生成的错误消息\
  \ |\n| 512 | `E_USER_WARNING` | 程序员生成的警告 |\n| 1024 | `E_USER_NOTICE` | 程序员生成的通知\
  \ |\n| `E_ALL` | 以上所有内容 |\n\n当任何错误、警告或通知发生时，都会被分配这些级别中的一个。这些值实际上是 PHP 中提供的预定义常量，用于确定要报告或记录哪些错误。\n\
  \n*注意*\n\n*PHP 决定 `E_ALL` 的值。它基本上是所有错误级别的总和，是一种开启或关闭所有错误级别的方便方法。*\n\n你可以配合 PHP 的内置函数\
  \ `error_reporting` 使用这些常量，以控制用户会对哪些错误报警。`error_reporting` 函数原型为 `int error_reporting([int\
  \ level])`。\n\n`error_reporting()` 函数用于更改报告的错误。如果一个错误没有被报告，它既不会被记录，也不会显示给终端用户。该函数的唯一参数\
  \ `level` 是一个整数，代表要报告的错误级别，如表 7.1 所示。\n\n在处理错误和编写 PHP 代码的过程中，遇到会生成 PHP 警告的代码并不罕见——例如，在绑定\
  \ LDAP 连接时指定了无效的凭据。如果由用户提供凭据，他们总有可能输错密码。在这种情况下，我们可以使用错误抑制操作符来抑制 `ldap_bind()` 函数生成的任何警告。或者，我们可以使用\
  \ `error_reporting()` 函数禁用某些级别的错误（在本例中为警告），然后在易产生警告的代码段执行后，将错误报告恢复到原始级别。\n\n为了演示\
  \ `error_reporting()` 函数，列表 7.3 是一个使用它来切换所报告错误类型的脚本。\n\n**列表 7.3：更改错误级别报告（error_reporting.php）**\n\
  \n```php\n<?php\n\n$avail_error_levels = E_ALL & ~(E_NOTICE | E_WARNING);\n\nerror_reporting($avail_error_levels);\n\
  \n/* 连接到 PostgreSQL 数据库 */\n\n$db_connection = pg_connect(\n  \"host=127.100.0.1\
  \ port=5432 dbname=MasteringPHP user=jallen\");\n\n$avail_error_levels = $avail_error_levels\
  \ | E_NOTICE | E_WARNING;\n\nerror_reporting($avail_error_levels);\n\n/* 连接到 PostgreSQL\
  \ 数据库 */\n$db_connection = pg_connect(\n  \"host=127.100.0.1 port=5432 dbname=MasteringPHP\
  \ user=jallen\");\n\n?>\n```\n\n代码开始时移除对 `E_NOTICE` 和 `E_WARNING` 通知和警告的报告。\n\n\
  将这些错误级别标记为不报告后，当脚本无法连接到 PostgreSQL 数据库时，不会生成警告。在第一次连接尝试后，错误报告再次被更改；相同的两个错误级别被重新加回待报告级别列表，并显示警告消息。该消息应该只显示一次，因为在第一次连接尝试中通知被关闭了。\n\
  \n### 处理错误\n\n错误是不可避免的。对于生产环境中的 Web 应用程序，即使发生灾难性错误，对终端用户环境进行完全控制也是绝对必要的。这就是错误处理技术大显身场的地方。我们已经了解到通常有方法针对一组函数以非常特定的方式处理错误，例如检查与数据库连接是否有效。\n\
  \nPHP 在错误处理方面没有其他语言那么多；例如，与 Visual Basic .NET 和 Java 不同，它没有结构化异常处理。但 PHP 提供了一个名为\
  \ `set_error_handler` 的函数，允许在发生错误时使用自定义的错误处理器。其语法为 `string set_error_handler(string\
  \ error_handler)`。\n\n此内置函数在 `error_handler` 参数中接受你想要分配错误处理的函数名。\n\n当使用自定义错误处理函数时，其例程将完全跳过除最基本的\
  \ PHP 错误以外的所有错误。自定义函数不会处理的唯一错误级别是 `E_ERROR`、`E_PARSE`、`E_CORE_WARNING`、`E_COMPILE_ERROR`\
  \ 和 `E_COMPILE_WARNING`；这些级别始终由内置的 `error_reporting()` 函数或 `php.ini` 中的配置控制。这些错误无法通过自定义函数处理的主要原因是它们对脚本执行有即时影响。\n\
  \n解析错误（parse error）是显而易见的，因为 PHP 无法再理解该脚本。`E_ERROR` 表示发生了严重的、不可恢复的错误。\n\n除了这五个之外的所有其他错误级别，如果提供了相应的例程，都将由\
  \ PHP 处理。\n\n列表 7.4 是一个可以用于处理错误的示例错误处理例程，它可以处理错误并记录到文件中。无论你给函数起什么名字，列表中看到的五个参数都是必须，因为这些是\
  \ PHP 在发生错误时传递给函数的信息。\n\n200\n\n## 第 7 章\n\n### 调试与错误\n\n**列表 7.4：自定义错误处理（custom_error.php）**\n\
  \n```php\n<?php\nfunction custom_error_handler($errno, $errstr, $errfile, $errline,\
  \ $errcontext)\n{\n    $error_time = date(\"H:i:s - m.d.y \");\n    $error_message\
  \ = $error_time . “Error Number “ . $errno . “ : ” . $errstr . “ occurred in “ .\
  \ $errfile . “ on line “ . $errline . “\\\\n”;\n    // 首先将错误记录到日志\n    $error_log\
  \ = fopen(“error.log”, “a+”);\n    fwrite($error_log, $error_message);\n    fclose($error_log);\n\
  }\n\nset_error_handler(“custom_error_handler”);\ntrigger_error(“The world is ending\
  \ now!”);\n?>\n```\n\n*注意*\n\n`fopen()`、`fwrite()` 和 `fclose()` 在操作文件时非常常见。它们的作用显而易见，将在第\
  \ 13 章讨论。\n\n`custom_error_handler()` 的第五参数 `$errcontext` 是错误发生时可用变量的数组形式。在大多数情况下，这可能包含大量数据，因此应需要从上下文中使用特定的变量。\n\
  \n之前使用的 `trigger_error()` 函数会导致 PHP 像发生了错误一样运行；详见下一节。\n\n*注意*\n\n自定义错误处理（如列表 7.4\
  \ 所示）适用于 PHP 4.0.2 或更高版本；在早期版本中没有此功能。\n\n自定义错误处理函数可以提供的另一个有用功能是详细说明每次发生错误的自定义电子邮件报告。在生产环境中，负责修复\
  \ Bug 的团队尽快获任何异常行为至关重要。\n\n### 触发自己的错误\n\n你可以使用 PHP 函数 `trigger_error()`——如果你喜欢那个名字，也可以用别名\
  \ `user_error()`——在出现问题时触发你自己的错误。该函数与之前描述的自定义错误处理函数，以及稍后描述的 `assert()` 函数相结合，对于调试\
  \ PHP 脚本非常有用。\n\n处理错误\n\n201\n\n`trigger_error()` 函数会产生 `E_USER_ERROR`、`E_USER_WARNING`\
  \ 或 `E_USER_NOTICE` 级别的错误，并由当前生效的错误处理器进行处理。`trigger_error()` 的原型为：\n\n`void trigger_error\
  \ (string error_msg [[, int error_type])`\n\n第二个可选参数 `error_type` 可用于控制要触发的错误级别，默认值是\
  \ `E_USER_NOTICE`。\n\n\n\n\n\n`trigger_error()` 函数非常适合作为 `assert()` 和 `error_log()`\
  \ 函数的伙伴。`error_log()` 函数与 `trigger_error()` 的相似之处在于它们都会生成错误消息，但你可以进一步指定消息出现的位置；其原型如下所示。\n\
  \n考虑以下代码段：\n\n```php\nfunction custom_error_handler($errno, $errstr, $errfile, $errline,\
  \ $errcontext)\n{\n    $message = sprintf (“File %s, line %d (code: %d): %s\\\\\
  n”,\n    $errfile, $errline, $errno, $errstr);\n    if ($errno > E_COMPILE_WARNING)\
  \ { // programmer-generated error\n        error_log ($message, 3, “/usr/local/www/myapp/user_errors”);\n\
  \    }\n    else { // PHP-generated error\n        error_log ($message, 0);\n  \
  \  }\n}\n\nset_error_handler (‘custom_error_handler’);\n$fp = fopen (“/tmp/somefile.txt”,\
  \ “r”);\nif (assert ($fp != false)) {\n    fpassthru ($fp);\n}\nelse {\n    trigger_error\
  \ (“Can’t open /tmp/somefile.txt!\", E_USER_ERROR);\n    print (“An error occurred.\
  \ Sorry.”);\n}\n```\n\n正如你可能观察到的，`assert()` 函数检查作为其参数的表达式是否为真。如果是，则 `assert()` 返回\
  \ True；如果不是，则返回 False。`assert()` 的原型为：`int assert (string|bool assertion)`\n\n`assert()`\
  \ 的参数也可以是字符串，它将像 `eval()` 函数一样被求值为 PHP 代码；因此，我们可以使用以下两行中的任意一行来编写 `assert` 调用：\n\
  `assert (“\\\\$fp != false”)`\n`assert (‘$fp != false’)`\n\n注意当双引号包含字符串时，必须对美元符号进行转义以保留它。\n\
  \n## 第 7 章：调试与错误\n\n**注意**\n\n正如其他语言的程序员们可能怀疑的那样，`assert()` 函数比我们在这里展示的要强大得多。你可以注册回调函数在每次调用\
  \ `assert()` 失败时自动执行，控制失败的断言是生成警告消息还是完全静默，并启用或禁用 `assert()` 本身的实际执行（这在从开发环境切换到生产环境时非常有用，在那里你不再希望产生使用\
  \ `assert()` 的开销）。更多详情请参见 PHP 文中的 `assert()` 和 `assert_options()`。\n\n另一方面，`error_log()`\
  \ 函数将错误消息写入特定的错误日志。其原型为：\n`int error_log (string message, int message_type [, string\
  \ destination [, string extra_headers]])`\n\n第一个参数仅仅是错误消息的文本。第二个参数 `message_type`\
  \ 是一个整数，其值范围从 0 到 3，控制消息出现的位置。每个值的含义见表 7.2。\n\n**表 7.2：`error_log()` 的消息类型**\n\n\
  | 数值 | 含义 |\n| :--- | :--- |\n| 0 | 将错误消息写入系统日志（即错误通常出现的地方）。 |\n| 1 | 将错误消息发送到作为第三参数\
  \ `destination` 提供的电子邮件地址。 |\n| 2 | 将错误消息写入远程调试器。（此选项仅在 PHP 3 中可用；远程调试在 PHP 4 中被移除，取而代之的是其他调试器。）\
  \ |\n| 3 | 将错误消息附加到第三参数 `destination` 指定的文件中。 |\n\n可选的第四个参数 `extra_headers` 可能包含额外的邮件头，当\
  \ `message_type` 参数的值为 1（通过电子邮件发送）时将使用这些邮件头。\n\n### 可视化调试器\n\n尽管 PHP 通常会针对你的 PHP\
  \ 脚本出了什么问题（以及为什么）提供大量的反馈，但有时你想要更仔细地检查某些内容。虽然到为止的技术可以有所帮助，但有时使用功能完备的调试器更容易操作，它允许你在脚本执行时“监视”它，以便找到代码中的任何故障或缺陷。\n\
  \nPHP 有两种主要的视觉化调试器可用：商业性的 Zend Debugger 和免费的 PHP 调试器 DBG。它们都相对容易安装，只要你确保使用的调试软件与\
  \ PHP 的版本匹配即可。（例如，适用于 PHP 4.0.5 和 4.0.6 的调试器版本无法与 PHP 的更早或之后的版本配合。）Zend Debugger\
  \ 运行在你的 Web 服务器上（无论与你的工作站是同一台机器，还是网络上的另一台主机），并与名为 Zend Development Environment 的优秀\
  \ IDE 协同工作。\n\n**注意**\n\n更多关于 Zend 产品的信息可以在 www.zend.com/store/products/zend-studio.php\
  \ 找到。\n\n大多数调试器支持一组常用的基本功能，允许你执行某些代码、在任何点暂停执行、设置断点和监视以控制执行过程，以及进入和退出代码块。\n\n图 7.3\
  \ 显示了在 Zend IDE 中调试的脚本。Zend IDE 运行在一台 Windows 2000 机器上；该脚本实际上来自本书的第 19 章，运行在另一台独立的\
  \ Linux 机器上。\n\n**图 7.3：运行中的 Zend Debugger**\n\n远程脚本是一个简单的邮件客户端模拟器，登录 POP3 邮件服务器并从该服务器检索邮件列表。正如图中所示，Zend\
  \ debugger（运行在服务器上）提供了关于脚本当前状态的大量信息。在右下面板中，你可以检查任何给定点的局部和全局变量。通过将鼠标指针悬停在变量上，可以显示该变量的内容。\n\
  \n在远程服务器上使用 Zend IDE 和 Zend Debugger 调试脚本非常简单。你只需要在服务器上安装 Zend Debugger，在 `php.ini`\
  \ 配置文件中添加几行代码以启用调试器，然后在你的工作站上启动 Zend IDE。在 IDE 中，只需选择 Tools ➢ Debug URL，并在图 7.4\
  \ 所示的对话框中输入远程脚本的 URL。\n\n另一个类似的 PHP IDE 是 Maguma PHP4EE Studio 软件，它提供商业版和免费版。PHP4EE\
  \ Studio 提供了一个与开源 DBG 调试器紧密集的 PHP 编辑器。它可以从 www.maguma.com 下载。图 7.5 显示了在主编辑器中显示脚本的\
  \ PHP4EE Studio。\n\n脚本本身非常简单且几乎没用。它使用我们定义的 `rainbowprint()` 函数打印交替颜色的行。代码如列表 7.5\
  \ 所示；我们包含它并不是因为它们有趣，而是因为它们可以说明我们如何从头到尾控制和检查 PHP 脚本的流程。\n\n**列表 7.5：调试脚本 (rainbowprint.php)**\n\
  \n```php\n<html>\n<body>\n<?php\nfunction rainbowprint ($str, $i) {\n    $n = $i\
  \ % 6;\n    switch ($n) {\n        case 0: $color = “red”; break;\n        case\
  \ 1: $color = “orange”; break;\n        case 2: $color = “purple”; break;\n    \
  \    case 3: $color = “blue”; break;\n        case 4: $color = “green”; break;\n\
  \        case 5: $color = “yellow”; break;\n    }\n    print (“<font color=\\”$color\\\
  \\$>$str</font>”);\n}\nfor ($i = 0; $i < 12; $i++) {\n    rainbowprint (“foo”, $i);\n\
  \    print (“<br />\\\\n”);\n}\n?>\n</body>\n</html>\n```\n\n\n\n\n我们在与 `PHP4EE`\
  \ 同一台机器上安装了 `DBG` 和 `PHP`；这使得调试变得更容易，尽管你也可以尝试在服务器上安装调试器这项更具挑战性且回报较低的任务。我们从 `DBG`\
  \ 的主页（地址为 `http://dd.cron.ru/dbg/`）获取了 `DBG` 可执行文件 `php_dbg.dll` 以及相关文件，并使用 `DBG`\
  \ 安装程序将它们安装到我们的 PHP 扩展目录（`C:\\php\\extensions`）。要启用调试器，你必须找到 `php.ini` 文件（通常位于 `C:\\\
  system\\php.ini`）并向其中添加以下五行：\n\n```ini\nextension=php_dbg.dll\n[debugger]\ndebugger.enabled\
  \ = true\ndebugger.JIT_host = clienthost\ndebugger.JIT_port = 7869\n```\n\n最后，执行一个包含\
  \ `phpinfo()` 函数的脚本以确保调试器正在工作。在页面顶部附近，在第一个包含满你 PHP 安装信息的表格下方，你应该能看到类似“此程序使用了 Zend\
  \ 脚本引擎……”的文本，如图 7.6 所示。\n\n![Image 24](img/index-231_1.png)\n\n![Image 25](img/index-231_2.png)\n\
  \n## 第 7 章\n\n### 调试与错误\n\n**图 7.6**\n\n启用了 `DBG` 调试器的 `phpinfo()` 输出\n\n一旦安装了 `DBG`，最后一步是启动\
  \ `DBG` Listener 应用程序，如果它尚未运行（如果该程序在 Windows 下运行，你应该会在系统托盘中看到一个小的雷达扫描图标）。如果没有运行，你可以通过选择开始\
  \ ➢ 程序 ➢ `DBG PHP Debugger` ➢ Listener 来启动它。\n\n然后只需启动 `PHP4EE Studio` 应用程序，并配置其使用\
  \ `DBG` 调试器。在 `PHP4EE Studio` 中，选择视图（View） ➢ 首选项和设置（Preferences And Settings）以显示图\
  \ 7.7 所示的首选项（Preferences）对话框。点击左窗口树中的 PHP 解释器（PHP Interpreter）节点以显示解释器设置。在右侧窗口中，确保\
  \ `PHP` 可执行文件的路径正确，并且勾选了启用 DBG 调试（Enable DBG Debugging）框。\n\n**图 7.7**\n\n`PHP4EE\
  \ Studio 首选项` 对话框\n\n![Image 26](img/index-232_1.png)\n\n### 可视化调试器\n\n一旦一切配置妥当，只需在\
  \ `PHP4EE Studio` 中打开一个 `PHP` 脚本并点击调试脚本（Debug Script）按钮（蓝色小三角形）即可开始调试。这样做时，调试输出（Debug\
  \ Output）窗口将出现在应用程序窗口的半部分，第一行可执行代码将高亮显示，并且单步（Step Into）、逐行（Step Over）、跳出（Step Out）和停止调试器（Stop\
