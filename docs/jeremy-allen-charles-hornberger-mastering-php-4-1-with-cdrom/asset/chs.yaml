  ![Image 5](img/index-26_1.jpg)\n\n\n在本节中：\n\n◆\n\n\n◆\n\n◆\n\n◆\n\n◆\n\n![Image\
  \ 6](img/index-27_1.jpg)\n*本页特意留白*\n\n![Image 7](img/index-28_1.jpg)\n\n\n为全球维网或如内网等\
  \ Web 类用途开发应用程序和网站，已成为计算和编程工作最广泛的领域之一。如果它可以通过数字化实现，那么在某地的某人正试图将其适配到浏览器中。理解 Web 活动的各种形式——静态和动态页面、客户端和服务器端系统——是增加你作为开发者灵活性的必要步骤。\n\
  \n`PHP` 构建在类似于 `C`、`Java` 和 `Perl` 等熟悉的编程语言结构之上。它通过提供必要的工具来轻松操作内容，从而帮助创建动态 HTML\
  \ 内容。`PHP` 正在成为增强网页能力的卓越工具之一，因为它既易用又强大。编写几个基础脚本、测试数据回传的两种主要方法，并学习为 `PHP` 代码编写注释，将让你看到\
  \ `PHP` 的功能是多么容易上手。\n\n## Web 开发\n*Web 开发*（web development）一词涵盖的范围非常广、很深。它是一个对大量活动进行分类的通用术语。Web\
  \ 开发可以意味着任何事情，从在小型网站上放置静态 HTML 页面，到开发一个跨越大陆的、处理关键业务通信的大型企业内网。但这些活动确实可以拆分为几个易管理的类别。\n\
  \n## Web 应用\n要进入开发 Web 应用的主题，我们首先必须处理*应用程序*（application）一词：什么是应用程序？应用程序应该做什么？\n\n\
  应用程序是任何为了简化或执行任务而开发的软件。任务的程度从非常具体到更通用。获取学生六门课程的成绩、计算平均分并在报告中总结是一个简单但有限的应用程序。另一方面，提供与他人通信手段的应用程序（例如在线协作软件，允许用户协调工作流的程序）更为复杂，并实现了更通用的目标。尽管协作软件的应用范围比成绩平均程序广得多，但两者仍然都是应用程序。\n\
  \n那么，Web 应用具体是什么？通常来说，*Web 应用*（web application）是利用互联网提供的无处不在和通信便利性的应用程序。对 Web 应用更严格的定义（也是书中将使用的定义）是使用\
  \ 浏览器作为客户端的应用程序。大多数 浏览器都有许多客户端技术可用。通常，影响最远且最易访问的 Web 应用是那些使用简单优雅的超文本标记语言（HTML）的应用。几个严格符合*Web\
  \ 应用*术语的例子包括基于 Web 的银行系统、拍卖和新闻网站。\n\n## 静态网站与动态网站\n静态网站的内容在作者更新之前不会改变，这些网站对许多人来说很好，因为它们允许共享信息。然而，静态网站与访问者没有交互，并且无法以程序化的方式完成任何任务。\n\
  \n动态网站允许*用户交互*。尽管动态网站像静态网站一样使用 `HTML` 作为客户端界面，但它允许用户采取个人且可自定义的操作，例如预订和购买特定的航班甚至座位。在线票务系统后的目的是显而易见的：一个为用户提供便利的易用界面。对于这种全球可用的系统，购票任务是去中心化且易于实现的。\n\
  \n动态网站像静态网站一样使用 `HTML` 作为客户端界面，但它允许用户采取个人且可自定义的操作。`HTML` 是一种基于文本的标记语言。理想情况下，`HTML`\
  \ 用于定义内容并勾勒结构，而层样式表（`CSS`）用于定位内容。当然，由于兼容性和广泛使用的客户端，`CSS` 在定位内容方面可能不是理想选择。此外，由于 `HTML`\
  \ 的静态性质（意味着它只是一个简单的文本语言），当我们想要内容变化和演进时，它本身是有限的。\n\n`HTML` 为各种 Web 客户端提供了极好的共享手段，但也有许多缺点。当从\
  \ Web 服务器请求 `HTML` 文档时，Web 服务器将文档返回给请求者——仅此而已。这只是发布内容，而不是创建、控制、组织或自定义内容。今天使用的 `HTML`\
  \ 倾向于关注内容的视觉质量，而不是详细结构。\n\n## 服务器端与客户端\n`HTML` 是一种客户端技术，这意味着 `HTML` 文档完全由客户端处理。Web\
  \ 服务器不会根据 `HTML` 文档包含的代码而产生不同的行为。Web 服务器仅提供请求的文件；客户端浏览器做出渲染的决策。`HTML` 不是编程语言；它没有提供任何类型的数据处理结构。\n\
  \n相反，`PHP` 完全是服务器端的。当 `PHP` 脚本执行时，它并不直接与浏览器交互；`PHP` 脚本的最终产物（通常是 `HTML` 文档）由请求浏览器处理。如果浏览器收到未经处理的\
  \ `PHP` 脚本，浏览器将尝试将 `PHP` 脚本作为普通的 `HTML` 进行渲染。浏览器无法执行 `PHP` 脚本。\n\n\n\n\n\nHTML 是\
  \ Web 应用开发中不可或缺的组件。PHP 代码可以直接嵌入并混合在 HTML 中。当客户端从 Web 服务器请求 HTML 文档时，服务器通过直接将文档发送给客户端来响应。图\
  \ 1.1 显示了客户端请求 HTML 文档并说明了服务器是如何响应的。\n\n**图 1.1**\n客户端请求 HTML 文档\nHTML 文档\n请求\n\
  服务器返回 HTML 文档\n客户端\n服务器\n客户端渲染文档\n显示器\n\n请求 PHP 脚本的工作方式不同。在文档发送给客户端之前，文档会经过 PHP\
  \ 处理，PHP 引擎会执行文档中发现任何 PHP 代码。图 1.2 展示了客户端请求 PHP 脚本。此图中的 PHP 脚本返回了一个经过处理的 HTML 文档。\n\
  \n**图 1.2**\n客户端请求文档\n服务器处理\n包含 PHP 脚本\nPHP 脚本\nPHP 脚本请求\nPHP 解释器\n服务器返回\nPHP 返回\n\
  客户端\nHTML 文档\n服务器\nHTML 文档\n客户端渲染文档\n显示器\n\n这两个过程之间存在 PHP 和 HTML 的区别：PHP 在服务器端执行，是一门完整的编程语言；而\
  \ HTML 仅用于发布超文本，并在客户端进行处理。\n\n## 探索 PHP\n\n每当使用特定的编程语言设计应用程序时，理解所用环境的所有功能和局限性至关重要。Web\
  \ 开发也是如此。本节展示了静态 HTML 如何通过 PHP 变得活跃。这种初步探索将为书中学习几乎的所有内容奠定基础。为了开始探索 Web 开发和可用环境，你将编写自己的第一个\
  \ PHP 脚本。你还将学习变量，并检查 PHP 和动态内容的一些基础知识。\n\n# 第 1 章\n\n## 开始你的 PHP 探索之旅\n\n*注意：有关安装和配置\
  \ PHP 的完整指南，请参阅附录 A，“PHP 速成课程”。*\n\n### 你的第一个 PHP 脚本\n\n在 PHP 脚本执行之前，必须指示服务器执行它。为了做到，我们必须将脚本块封装在一组特殊的标签中，让服务器知道哪些内容是\
  \ PHP 代码。当服务器遇到 PHP 开启标签时，该标签与结束标签之间的所有内容都作为 PHP 执行。\n\nPHP 开启标签是：\n\n```php\n<?php\n\
  ```\n\n结束标签是：\n\n```php\n?>\n```\n\n或者，可以使用 `<? ... ?>`。`<?php` 开启标签是首选方法，因为它允许在符合\
  \ XML 标准的代码中使用 PHP。通常，这两种方法都是接受的，这主要取决于个人喜好。\n\n另一种方法也可以开启和关闭 PHP 脚本：要启用此选项，必须修改\
  \ `php.ini` 文件。配置选项 `asp_tags` 允许使用 ASP 风格的脚本块（使用 `<% %>` 来开启和关闭脚本块）。在 `php.ini`\
  \ 文件中找到 `asp_tags` 行，将其从 `asp_tags = Off` 更改为 `asp_tags = On`。使用 ASP 标签格式在很大程度上取决于喜好和风格。\n\
  \n*注意：`<?php ... ?>` 样式是最推荐的，也是我们在全书中将使用的格式。*\n\n如果你已经熟悉另一种编程语言，特别是与 PHP 类似的脚本语言，那么接下来的几节将是非常基础的复习材料。\n\
  \n### Hello, World!\n\n哪本编程语言书籍如果没有一个“Hello, World!”程序就是完整的呢？它通常是任何语言中学习的第一个程序。\n\
  \n我们将编写一个极其简单的 PHP 脚本，生成“Hello, World!”并将其发送到浏览器。该脚本展示了标签的开启与关闭以及生成输出的 PHP 结构。\n\
  \n创建一个名为 `hello_world.php` 的文档，将列表 1.1 中的代码输入文档，将其保存在你的 Web 服务器的文档根目录下，然后在浏览器中导航到该文档。\n\
  \n◆\n在默认的 Red Hat 配置下，文档根目录可以在 `/var/www/html` 找到。\n\n◆\n如果你参考附录 A 安装 PHP 和 Apache，那么文档根目录将是\
  \ `/usr/local/apache/htdocs`。包含文件的完整路径将是 `/usr/local/apache/htdocs/hello_world.php`。\n\
  \n*提示：为了方便起见，书中演示的所有脚本副本都在附带 CD-ROM 中。你可以在浏览器中查看这些文件以查看结果，也可以在文本编辑器中打开它们，跟随我们一起构建代码。*\n\
  \n**列表 1.1：极简 PHP Web 页面 (hello_world.php)**\n\n```html\n<html>\n<head>\n<title>Hello,\
  \ World!</title>\n</head>\n<body>\n<?php print('Hello, World!\\n'); ?>\n</body>\n\
  </html>\n```\n\n列表 1.1 中的脚本在表面上看起来简单得带有误导性。执行代码时发生了很多事情。注意常见的 HTML 实体——`html`、`head`、`title`\
  \ 和 `body` 标签。然而，文档中有两个特殊的 PHP 实体——开启标签 `<?php` 和结束标签 `?>`。Web 服务器将这些标签之间的所有内容发送给\
  \ PHP 解释器。PHP 处理脚本块并将所有生成的输出返回给请求客户端。在 PHP 结束标签之后，文档作为普通 HTML 发送，直到发现另一个 PHP 开启标签。\n\
  \nPHP 脚本告诉 PHP 解释器向浏览器发送“Hello, World!”和一个换行符。函数以函数名开始，在本例中为 `print`。接下来使用括号来标记函数参数的开始和结束——在本例中为字符串“Hello,\
  \ World!\\n”。函数后面跟着分号；这是为了通知 PHP 语句已结束。如果函数调用中省略了分号，PHP 将抛出错误。\n\n字符串仅仅是字符序列。作为参数传递给函数的字符串是单引号之间的所有内容。在这种情况下，`\\\
  n` 代表一个特殊字符（换行符）。\n\n为了验证换行符确实发送到了浏览器，请在输入代码后查看文档源。列表 1.2 显示了文档的源码。\n\n**列表 1.2：查看\
  \ hello_world.php 的源码**\n\n```html\n<html>\n<head>\n<title>Hello, World!</title>\n\
  </head>\n<body>\nHello, World!\n</body>\n</html>\n```\n\n检查源码后，它似乎并没有特殊的含义。PHP 标签已经过处理，没有发送给客户端。那么\
  \ `\\n` 呢？如果从字符串中删除换行符会怎样？文档源码的最后几行将显示为：\n\n```html\n<body>\nHello, World!\n</body>\n\
  </html>\n```\n\n我们可以通过从 `print` 函数调用中删除换行符来验证这一点，使其看起来像这样所示：\n\n```php\nprint('Hello,\
  \ World!');\n```\n\n### 你是谁？\n\n现在我们将检查一个复杂的示例程序。我们将编写两个 PHP 页面：其中一个脚本包含一个可以提交的\
  \ HTML 表单；另一个是动作页面，即表单提交到的脚本。当表单提交到另一个页面时，PHP 会让表单数据在动作页面中可用。第一个 PHP 脚本将命名为 `who_are_you.php`，它是一个包含表单的简单\
  \ HTML 页面。将列表 1.3 中的代码输入为 `who_are_you.php` 并保存到你的 Web 服务器。\n\n**列表 1.3：基础数据输入页面\
  \ (who_are_you.php)**\n\n```html\n<html>\n<head>\n<title>你是谁?</title>\n</head>\n\
  <body>\n<form action=\"you_are.php\">\n请输入你的名字：<br />\n我是...\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n\n```php\n<?php print(‘<input type=”text” name=”person” value=”’\
  \ . $person . ‘“size=”15” />); ?>\n```\n\n<input type=”submit” value=”Go!” size=”15”\
  \ />\n\n</form>\n</body>\n</html>\n\n列表 1.3 中有几个重要的特征。该脚本创建了一个普通的 HTML 表单，该表单将提交到\
  \ `you_are.php`（表单 `action` 属性中的 URL）。表单包含单个文本输入字段和一个提交按钮。当用户点击按钮时，表单将发送到动作页面。\n\
  \n## 探索 PHP\n\n## 9\n\n`PHP` 语句简单地输出变成 HTML 字段的纯文本。这里的 `print` 语句与列表 1.1 中使用的函数相同，但它在列表\
  \ 1.3 中的结果是一个带有 `type`、`name` 和其他属性的输入字段。\n\n文本输入的值是通过拼接生成的——也就是说，将一个字符串与变量以及一些字符串字面量“粘”在一起。PHP\
  \ 的字符串拼接运算符是点（`.`）。它告诉解释器获取前面的和后面的项目并将它们连接成单个字符串。\n\n表示法\n\n`...value=”’ . $person\
  \ . ‘“...`\n\n用变量 `$person` 填充 `value` 属性，我们创建该变量是为了存储提示用户输入的数据。首先，`print` 函数的参数字符串结束了（通过单引号）。\n\
  \n然后拼接 `$person` 变量——也就是说，将其添加到字符串的末尾（通过第一个点）。之后，字符串的其余部分被拼接到新修改的字符串上（通过第二个点），最终我们得到了完整的文本输入。当\
  \ PHP 第一次生成表单并将其加载到用户浏览器时，`$person` 变量是空的，因此字段中填充的是空字符串。但当用户输入文本并返回表单（通过点击提交）时，`$person`\
  \ 就会携带输入的文本……正如你将在下一节中看到的那样。\n\n如果你熟悉其他编程语言，你会注意到 `$person` 从未被声明或初始化。强类型语言要求在使用变量用于存储数据之前必须声明变量并定义其类型。PHP\
  \ 并非如此，你将在下一章中学到。\n\n> **注意**\n> 所有 PHP 变量名都以美元符号（`$`）开头。\n\n### 表单与查询字符串\n\n既然我们已经创建了一个生成\
  \ HTML 表单的 PHP 脚本，我们必须为表单创建一个提交到的动作页面。HTML 表单提交到 `you_are.php` 页面。创建一个名为 `you_are.php`\
  \ 的 PHP 脚本，并将列表 1.4 输入脚本。\n\n#### 列表 1.4：基础动作页面 (you_are.php)\n\n```html\n<html>\n\
  <head>\n<title>You Are! ...</title>\n</head>\n<body>\n<?php\nprint(‘Well, hello\
  \ ‘ . $person . ‘, nice to meet you!’);\nprint(‘<br />’);\nprint(‘<a href=”who_are_you.php?person=’\
  \ . urlencode($person) . ‘“> Back to Who Are You?</a>’);\n?>\n</body>\n</html>\n\
  ```\n\n## 10\n\n### 开始探索 PHP\n\n`PHP` 语句简单地输出变成 HTML 字段的纯文本。这里的 `print` 语句与列表 1.1\
  \ 中使用的函数相同，但它在列表 1.3 中的结果是一个带有 `type`、`name` 和其他属性的输入字段。\n\n文本输入的值是通过拼接生成的——也就是说，将一个字符串与变量以及一些字符串字面量“粘”在一起。PHP\
  \ 的字符串拼接运算符是点（`.`）。它告诉解释器获取前面的和后面的项目并将它们连接成单个字符串。\n\n表示法\n\n`...value=”’ . $person\
  \ . ‘“...`\n\n用变量 `$person` 填充 `value` 属性，我们创建该变量是为了存储提示用户输入的数据。首先，`print` 函数的参数字符串结束了（通过单引号）。\n\
  \n然后拼接 `$person` 变量——也就是说，将其添加到字符串的末尾（通过第一个点）。\n\n之后，字符串的其余部分被拼接到新修改的字符串上（通过第二个点），最终我们得到了完整的文本输入。当\
  \ PHP 第一次生成表单并将其加载到用户浏览器时，`$person` 变量是空的，因此字段中填充的是空字符串。但当用户输入文本并返回表单（通过点击提交）时，`$person`\
  \ 就会携带输入的文本……正如你将在下一节中看到的那样。\n\n如果你熟悉其他编程语言，你会注意到 `$person` 从未被声明或初始化。强类型语言要求在使用变量用于存储数据之前必须声明变量并定义其类型。PHP\
  \ 并非如此，你将在下一章中学到。\n\n> **注意**\n> 所有 PHP 变量名都以美元符号（`$`）开头。\n\n### 表单与查询字符串\n\n既然我们已经创建了一个生成\
  \ HTML 表单的 PHP 脚本，我们必须为表单创建一个提交到的动作页面。HTML 表单提交到 `you_are.php` 页面。创建一个名为 `you_are.php`\
  \ 的 PHP 脚本，并将列表 1.4 输入脚本。\n\n（列表 1.4 内容见上文）\n\n# 第 1 章\n\n（剩余文本对如 `you_are.php`、`urlencode()`\
  \ 和 `$person` 等变量遵循相同的规则。）\n\n\n\n\n```html\n<form action=\"you_are.php\" method=\"\
  GET\">\n```\n\n现在数据提交类型已在表单中指定，浏览器将使用何种方法提交数据已无须疑问。\n\n接下来，我们必须考虑一些保留字符，除非经过编码，否则它们不能作为\
  \ URL 的一部分。表 1.1 列出了最常用的字符及其 URL 编码值。每当你组合查询字符串并希望包含左列的字面值时，必须使用右侧的组合对其进行编码。PHP\
  \ 函数 `urlencode()` 会透明地为你完成此工作。通常情况下，URL 不需要显式解码，因为浏览器会处理 URL 解码。\n\n**表 1.1：**常用\
  \ URL 字符和 URL 编码值\n\n| 字符 | URL 编码 |\n| :--- | :--- |\n| Space | %20 |\n| “ | %22\
  \ |\n| # | %23 |\n| % | %25 |\n| & | %26 |\n\n# 第 1 章\n### 开始你的 PHP 探索\n\n**表 1.1：**常用\
