  # 使用表单进行用户认证\n\n正如你可以使用 PHP 结合 HTTP 请求头部对网站用户进行身份验证一样，你也可以使用 PHP 结合 HTML 表单来实现完全相同的功能。唯一的区别在于：\n\
  \n◆ 使用 HTML 表单，你对登录界面的外观和感受有更多控制权。\n◆ 无论你是使用 CGI 版本的 PHP、作为 Apache 模块的 PHP、ISAPI\
  \ 过滤器，还是任何其他可以想象的系统，它们都能工作。\n◆ 你必须使用 cookie（或其他方法）为客户端存储身份验证信息。\n\n如列表 12.4 所示，我们只需简单修改上方用于进行\
  \ HTTP 身份验证的几行代码（来自列表 12.2），就可以构建一个基于表单的身份验证系统。\n\n控制脚本的逻辑与我们之前使用的逻辑基本相同：\n\n**1.**\
  \ 如果用户尚未提交任何身份验证凭据，则显示登录表单。\n\n**2.** 如果用户提交了登录凭据，使用 `authorize_user()`对其进行验证。\n\
  \n**2.1.** 如果凭据无效，再次显示登录表单。\n\n**2.2.** 如果凭据有效，继续执行脚本的其余部分。\n\n#### 列表 12.4：使用表单认证用户的函数\
  \ (form_auth.php)\n\n```php\n<?php\n\nfunction show_auth_form ($err = '')\n{\nglobal\
  \ $HTTP_POST_VARS;\n$tmpl = <<<EOT\n<html>\n<head><title>Login</title></head>\n\
  <body>\n<form action=\"%s\" method=\"POST\">\n<div align=\"center\">\n<b>Please\
  \ log in</b><br /><font color=\"red\"><b>%s</b></font>\n<table align=\"center\"\
  >\n<tr><td align=\"right\">Username</td>\n<<td><input type=\"text\" name=\"u\" size=\"\
  15\" value=\"%s\" /></td></tr>\n<tr><td align=\"right\">Password</td>\n<<td><input\
  \ type=\"password\" name=\"p\" size=\"15\" value=\"%s\" /></td></tr>\n<tr><td colspan=\"\
  2\" align=\"center\"><input type=\"submit\" /></td></tr>\n</table>\n</div>\n</form>\n\
  </body>\n</html>\nEOT;\nAUTHENTICATING USERS\n367\n$page = @sprintf ($tmpl, $GLOBALS['PHP_SELF'],\
  \ $err,\n$HTTP_POST_VARS['u'], $HTTP_POST_VARS['p']);\nprint ($page);\n}\n\nfunction\
  \ authorize_user ($user, $pass)\n{\n// 将此处替换为实际测试用户凭据的代码！\nreturn true;\n}\n\nfunction\
  \ form_authenticate () {\nglobal $HTTP_POST_VARS;\n// 启动授权序列\nif (count ($HTTP_POST_VARS)\
  \ == 0) {\nshow_auth_form ();\nreturn false;\n}\nelse {\n$user = $HTTP_POST_VARS['u'];\n\
  $pass = $HTTP_POST_VARS['p'];\nif (empty ($user) || empty ($pass)) {\nshow_auth_form\
  \ ('Please enter your username and password');\nreturn false;\n}\nif (authorize_user\
  \ ($user, $pass) !== true) {\nshow_auth_form ('Login failed, please try again');\n\
  return false;\n}\n}\n// 如果运行到这里，说明用户凭据是正确的\nreturn true;\n}\n?>\n```\n\n#### 列表\
  \ 12.5：使用我们的基于表单认证函数 (restricted-form.php)\n\n```php\n<?php\ninclude ('form_auth.php');\n\
  if (form_authenticate () !== true)\nexit;\n// 如果运行到这里，说明用户的凭据是正确的\nprint ('<html><body>’);\n\
  368\n## 第 12 章\n### 安全\nprint ('Congratulations! Your credentials look <i>great</i>!');\
  \ print ('</body></html>’);\n?>\n```\n\n```\n\n虽然这种方法对于显示登录表单效果良好，但它缺少了一个关键特性：我们还没有为客户端存储任何身份验证信息。当我们使用\
  \ HTTP 认证时，浏览器会替我们处理这些；它会记住用户的凭据，并通过再次发送这些凭据自动响应任何挑战。但我们基于表单的系统（尚未）包含任何“记住”用户凭据的逻辑。这意味着他们下次尝试访问受保护的页面时，将再次看到登录表单。因此，我们需要引入另一个逻辑——会话密钥（session\
  \ keys）。\n\n#### 在基于表单认证中添加密钥\n\n为了让基于表单的认证系统工作，必须有某种方法记住客户端已经通过了认证。为了实现这一点，我们引入了会话密钥的概念。虽然有很多方法可以让密钥在\
  \ HTTP 请求之间保持持久化，但最常见的是 cookie。\n\n*注意*\n*尽管有些用户对 cookie 有怨满，但这类人通常寥寥无几。此外，cookie\
  \ 是跨 HTTP 请求存储持久化数据最有效的方法，对于是否值得为那些用户花费时间和金钱实现另一种会话管理系统仍然值得商榷。*\n\n基本计划是，在客户端成功向服务器提交凭据后，服务器应通过向客户端提供会话密钥来响应。该密钥将在用户的会话期间唯一地分配给客户端。客户端将此密钥存储在\
  \ cookie 中，并在后续向服务器的每个请求中都包含该 cookie。然后服务器通过其活动会话密钥数据库检查 cookie 以识别客户端。如果密钥有效，客户端获得访问受保护页面的权限。如果密钥无效或缺失，则向客户端显示登录表单。\n\
  \n你可以看到，所需的更改非常少，而且我们的 `form_authenticate()` 函数仍然具有很的可读性。让我们来看看处理密钥所需的函数。列表中的第一个\
  \ `skey_retrieve()` 仅仅是寻找名为 `AUTHKEY` 的 cookie。如果找到了，就检索它；如果没找到，则返回 `false`。\n\n\
  ```php\nfunction skey_retrieve () {\nglobal $HTTP_COOKIE_VARS;\nif (isset ($HTTP_COOKIE_VARS['AUTHKEY']))\
  \ {\n    return $HTTP_COOKIE_VARS['AUTHKEY'];\n}\nreturn false;\n}\n```\n\n列表中的下一个函数\
  \ `skey_is_valid()` 负责确保用户提交的密钥格式正确，并对应于服务器当前活动密钥数据库中的条目。\n\n\n\n\n然而，为了理解其工作原理，我们想知道密钥在服务器上是如何生成和存储的。因此，目前我们将直接跳到\
  \ `skey_generate()` 和 `skey_store()`。\n\n`skey_generate()` 函数接收一个参数，即当前用户的 ID。我们简单地使用用户名；在大多数情况下，你可能希望使用实际的用户\
  \ ID（例如某个 `n`-位整数），但只要该值能唯一标识用户，其实际值并不重要。为了创建密钥，我们将用户 ID 的哈希值与用户 ID 加上一个（理想情况下）只有我们服务器的秘密短语的\
  \ MD5 哈希值连接起来（有关哈希的更多信息，请参阅后文的“数据哈希”章节）。为什么要添加包含秘密短语的哈希呢？这是防止恶意用户生成伪造密钥的一种简单方法；它并不能让人无法生成欺骗我们服务器的密钥，但确实增加了难度。以下是\
  \ `skey_generate()` 的实现：\n\n```php\nfunction skey_generate ($userid) {\n    $secret\
  \ = ‘foo’; // 选择一个比这更难猜的‘secret’！\n    $user_key = md5 ($userid);\n    $checksum\
  \ = md5 ($user_key . $secret);\n    $skey = $user_key . ‘,’ . $checksum;\n    return\
  \ $skey;\n}\n```\n\n注意：这允许我们通过反向执行相同的操作，验证从客户端获取的任何密钥的有效性。\n\n我们将在稍后定义 `skey_is_valid()`\
  \ 时回到这里。\n\n# 用户认证\n\n接下来，我们必须将 `skey_generate()` 返回的密钥存储在两个地方——客户端计算机上的 cookie，以及服务器上的活动密钥数据库中。`skey_store()`\
  \ 函数将为我们处理这项工作。它接收两个参数：密钥和用户 ID，我们可以用它将密钥与用户关联。对于这个示例实现，我们将密钥简单作为文件存储在服务器的临时目录中。\n\
  \n```php\nfunction skey_store ($key, $userid) {\n    setcookie (‘AUTHKEY’, $key);\n\
  \    $keyfile = ‘/tmp/authkey_’ . $key;\n    if (file_exists ($keyfile))\n     \
  \   return false;\n    $fp = $fopen ($keyfile, ‘w’);\n    if (!(fwrite ($fp, $userid)))\n\
  \        return false;\n    fclose ($fp);\n    return true;\n}\n```\n\n最后，我们来到最后一步：检查确保密钥有效。我们的\
  \ `skey_is_valid()` 函数将接收一个参数 `$key`，这当然是需要验证的密钥。该函数首先检查密钥没有被伪造（或至少没有被拙劣地伪造），然后验证服务器的活动密钥数据库中是否确实存在该密钥。\n\
  \n```php\nfunction skey_is_valid ($key) {\n    $secret = ‘foo’;\n    list ($user_key,\
  \ $checksum) = explode (‘,’, $key);\n    if (md5 ($user_key . $secret) != $checksum)\n\
  \        return false;\n    $keyfile = ‘/tmp/auth_’ . $key;\n    if (!(file_exists\
  \ ($keyfile)))\n        return false;\n    return true;\n}\n```\n\n我们基本上使用了与 `skey_generate()`\
  \ 和 `skey_store()` 函数相同的逻辑，只是顺序稍有不同。由于我们知道用户认证 cookie 中的“校验和”部分（即逗号之后的部分）应该是通过对“密钥”部分加上我们的秘密短语“foo”进行哈希计算得到的，我们可以再次执行相同的操作，查看结果是否与\
  \ cookie 中的校验和匹配。如果匹配，我们认为密钥有效。如果不匹配，则将其视为伪造。同样，我们知道用户的密钥应该存储在 `/tmp` 文件夹中。我们只需检查它是否确实在那里即可。最后，我们可以为我们的认证库添加最后一个函数；虽然对于执行用户认证这一基本任务并非绝对必要，但没有它，我们的库就不算完整了。我们将此函数命名为\
  \ `skey_get_user_id()`；给定一个会话密钥，它将返回与密钥关联的用户 ID。\n\n```php\nfunction skey_get_user_id\
  \ ($key) {\n    list ($auth_key, $checksum) = explode (‘,’, $key);\n    $keyfile\
  \ = ‘/tmp/auth_’ . $auth_key;\n    if (!(file_exists ($keyfile)))\n        return\
  \ false;\n    $fp = fopen ($keyfile, ‘r’);\n    if (!$fp)\n        return false;\n\
  \    $data = '';\n    while (!(feof ($fp)))\n        $data .= fread ($fp, 1024);\n\
  \    fclose ($fp);\n    $key = chop ($data);\n    return $key;\n}\n```\n\n此函数允许我们在用户执行某些需要我们记录的操作时（例如下单、购买、修改服务器上的文件等）获取其用户\
  \ ID。例如，一个在数据库中记录订单的函数：\n\n```php\n$sku = $HTTP_POST['sku'];\n$qty = $HTTP_POST['qty'];\n\
  $skey = skey_retrieve();\n$userid = skey_get_user_id();\n$result = place_order ($sku,\
  \ $qty, $userid, $skey);\nif ($result === true)\n    print (‘Thanks for your order!’);\n\
  else\n    print (‘There was an error processing your order.’);\n```\n\n我们表单认证的最终代码可以在随附\
  \ CD 的 `form_auth_final.php` 文件找到。\n\n# 安全\n\n```php\nfunction place_order ($sku,\
  \ $qty, $userid, $skey) {\n    $dbh = my_dbconnect();\n    $sql = ‘INSERT INTO orders\
  \ (sku, qty, userid, skey) VALUES (%s, %s, %s, %s)’;\n    $res = db_query ($dbh,\
  \ $sql);\n    if ($res === false)\n        return false;\n    return true;\n}\n\
  ```\n\n## 会话密钥的安全问题\n\n虽然这让我们的密钥看起来很强大，但遗憾的是我们在 `skey_generate()` 和 `skey_is_valid()`\
  \ 中做的哈希并没有提供很多现实安全性。首先，我们的密钥生成算法和“秘密”短语都以明文存储在服务器上的文件（`form_auth_final.php`）中。由于\
  \ Web 服务器必须对该文件具有读取权限（否则如何执行脚本呢？），这本质上是有风险的。任何发现如何欺骗你的 Web 服务器打印 `form_auth_final.php`\
  \ 内容的人，都会确切知道如何伪造假的认证密钥。换句话说，如果我们的 Web 服务器存在安全漏洞，我们的认证系统就有安全漏洞。其次，它无法防止劫持攻击。如果你担心会话密钥可能被窃听者拦截并用于劫持该用户的会话，那么你需要使用真正的加密——安全套接层（SSL）来保护客户端和服务器之间的通信。\n\
  \n给智者的建议：你可能想用客户端的 IP 地址作为 `skey_generate()` 和 `skey_is_valid()` 中生成的“校验和”哈希的一部分，以验证互联网上其他地方的入侵者没有窃听连接并开始冒充原始用户（通过使用他们的会话密钥）；然而，这不是一个可靠的解决方案，原因有两个。首先，如果入侵者能够嗅探并使用受害者的会话密钥，你必须假设他们也能够“伪造”受害者的\
  \ IP 地址。因此，将 IP 地址作为会话管理系统的一部分并没有提供任何额外的安全性。其次，得益于位于用户和 Web 服务器之间的代理服务器，IP 地址无法保证在访问者的整个会话期间保持静态。这是由于\
  \ Web 应用开发中广为人知的“超级代理”问题；它主要发生在通过 AOL 等大型 ISP 连接到互联网的用户身上。这些 ISP 经常在他们（大量的）连接用户池中不断“轮换”一小池\
  \ IP 地址。这意味着 AOL 用户 A 可能先从例如 10.23.44.5 发起一个请求，几秒钟后又从 10.23.49.33 发起第二个请求。更复杂的是，AOL\
  \ 用户 B 可能紧随其后从 10.23.44.5 发起请求。因此，仅根据客户端的 IP 地址，无法区分涉及一个真实的 AOL 用户的“普通会话”与涉及一个真实用户和一个攻击者的“被劫持会话”。\n\
  \n\n\n\n换句话说，使用 IP 地址来识别用户对解决你的安全问题没有帮助——而且几乎会损害你的用户。如果你想要真正的安全，请使用 SSL。\n\n## 数据哈希\n\
  \n`Hashing` 是将数据转换为另一种表示形式以实现多种目的，通常是为了存储在标准格式中或为了数据安全。通常，这是通过使用 `hash functions`\
  \ 完成。\n\n例如，哈希函数 `md5()` 使用广泛已知且受信任的 MD5 哈希算法，它会将输入转换为一个 128 位的整数（该整数由由 32 个十六进制数字组成的字符串表示）。以下代码\n\
  \n```\nprint (md5 (‘Hi, How Are You?’))\n```\n\n将输出字符串\n\n```\nf119b21716659a68aba6d56e35cf4401\n\
  ```\n\nMD5 算法生成的哈希值是“单向”哈希。这意味着，在技术上是不可行的（尽管并非完全）通过观察 MD5 算法的输出来推断其输入是什么，即使我们知道\
  \ MD5 算法的工作原理。此外，找到两个使得 `md5(x)` 和 `md5(y)` 相同的值 `x` 和 `y` 几乎是不可能的（我们可以说“碰撞”的几率实际上为零）。这就是为什么我们之前在\
  \ `skey_generate()` 和 `skey_is_valid()` 函数中选择使用 MD5。\n\n## 第 12 章\n\n### 安全\n\n\
  哈希函数不必一定要这样工作。事实上，下面的函数将其输入转换为数值，这可以被视为一个合法的——尽管是没用的——哈希函数：\n\n```php\nfunction\
  \ myhash ($str) {\n\n$hash = 0;\n\nfor ($i = 0; $i < strlen ($str); $i++)\n\n$hash\
  \ += ord (substr ($str, $i, 1));\n\nreturn $hash;\n}\n```\n\n### mhash 库\n\n除了内置的\
  \ `md5()` 函数外，PHP 还提供了通过由 Nikos Mavroyanopoulos 和 Sascha Schumann 开发的 `mhash` 库访问一系列强哈希算法的方法。每种算法都有自己的优缺点——例如，某种算法可能很慢且碰撞概率较低；另一种可能很快但安全性较低，等等等。\n\
  \n为了使用 PHP 的 `mhash` 函数，请确保你的电脑上安装了 `mhash` 库。\n\n在 Windows 下，你通常会在 PHP 安装目录的 extensions\
  \ 子目录下找到 `php_mhash.dll` 文件。如果你在 Unix/Linux 下运行 PHP 且没有安装 `mhash` 库，你将需要从 `http://mhash.sourceforge.net`\
  \ 获取它，编译并安装该库，然后使用 `--with-mhash=/path/to/lib*/` 选项重新编译支持 `mhash` 的 PHP。\n\n`mhash`\
  \ 库提供了对以下哈希算法的支持：\n- CRC32\n- HAVAL192\n- RIPEMD160\n- CRC32B\n- HAVAL224\n- SHA1\n\
  - GOST\n- HAVAL256\n- TIGER\n- HAVAL160\n- MD5\n- TIGER128\n\n`mhash` 库支持的算法比这里列出的更多，但目前（截至\
  \ PHP 4.1）PHP 引擎尚未允许你访问所有算法。要查看当前支持的哈希算法列表，你可以在 PHP 脚本中使用以下代码：\n\n```php\n$n = mhash_count\
  \ ();\n\nfor ($i = 0; $i < $n; $i++)\n\nprint (mhash_get_hash_name ($i) . \"\\n\"\
  );\n```\n\n### 使用 mhash\n\n要使用 `mhash` 提供的哈希算法，你只需要调用 `mhash()` 函数。其原型如下：\n\n```php\n\
  string mhash (int hash, string data [, string key])\n```\n\n`mhash()` 的第一个参数是一个标识你想要使用的哈希算法的常量。\n\
  \n这些常量只是算法的名称，前面加上“MHASH_”——例如，MD5 函数的常量为 `MHASH_MD5`。\n\n## 授权用户\n\n例如，如果我们想重写基于表单的认证库以使用\
  \ `mhash()` 并采用更 RIPEMD160 算法，我们需要重新定义 `skey_generate()` 和 `skey_is_valid()`。\n\n\
  ```php\nfunction skey_generate ($userid) {\n\n$secret = ‘foo’; // 选择一个比这更安全的‘secret’！\n\
  \n$user_key = bin2hex (mhash (MHASH_RIPEMD160, $userid));\n\n$checksum = bin2hex\
  \ (mhash (MHASH_RIPEMD160, $user_key . $secret)); $auth_key = $user_key . ‘,’ .\
  \ $checksum;\n\nreturn $auth_key;\n}\n\nfunction skey_is_valid ($key) {\n\n$secret\
  \ = ‘foo’;\n\nlist ($user_key, $checksum) = explode (‘,’, $key);\n\nif (bin2hex\
  \ (mhash (MHASH_RIPEMD160, $user_key . $secret)) != $checksum) return false;\n\n\
  $keyfile = ‘/tmp/auth_’ . $key;\n\nif (!(file_exists ($keyfile)))\n\nreturn false;\n\
  \nreturn true;\n}\n```\n\n\n\n\n```php\nif (CREATE_POST == (CREATE_POST & $user_rights))\
  \ {\n    $rights_list[] = 'CREATE_POST';\n}\n\nif (EDIT_POST == (EDIT_POST & $user_rights))\
  \ {\n    $rights_list[] = 'EDIT_POST';\n}\n\nif (DELETE_POST == (DELETE_POST & $user_rights))\
  \ {\n    $rights_list[] = 'DELETE_POST';\n}\n\nif (MODERATE == (MODERATE & $user_rights))\
  \ {\n    $rights_list[] = 'MODERATE';\n}\n\nif (SEARCH_ARCHIVE == (SEARCH_ARCHIVE\
  \ & $user_rights)) {\n    $rights_list[] = 'SEARCH_ARCHIVE';\n}\n\nif (VIEW_ARCHIVE\
  \ == (VIEW_ARCHIVE & $user_rights)) {\n    $rights_list[] = 'VIEW_ARCHIVE';\n}\n\
  \nif (UPDATE_ARCHIVE == (UPDATE_ARCHIVE & $user_rights)) {\n    $rights_list[] =\
  \ 'UPDATE_ARCHIVE';\n}\n\nif (DELETE_ARCHIVE == (DELETE_ARCHIVE & $user_rights))\
  \ {\n    $rights_list[] = 'DELETE_ARCHIVE';\n}\n\nprintf (\"The user has the right\
  \ to: %s\\n\", implode(\", \", $rights_list));\n?>\n```\n\n此脚本将生成以下输出：\n\n用户拥有以下权限：CREATE_POST,\
  \ SEARCH_ARCHIVE, VIEW_ARCHIVE\n\n使用这种原始方法，你可以在一个 32 位数字中记录多达三十二不同的“权限”。\n\n## 示例\
  \ ACL 类\n\n一旦你决定了一组权限或权利（读、写、执行、删除等），下一步就是为你想要保护的每个资源提供唯一标识符。在上面的示例中，我们只是保护了一个（虚拟的）公告板。在现实场景中，你通常需要保护多个不同的资源，并在某种永久位置（如数据库）存储每个用户的权限列表。\n\
  \n为了实现这一目标，我们将创建一个原始类（列表 12.8），它允许我们以用户为基础完成授予、撤销和检查特定资源的权限。\n\n### 列表 12.8：一个示例\
  \ ACL 类 (acl.php)\n\n```php\n<?php\n\nclass ACL\n{\nfunction grant ($uid, $right,\
  \ $resid) {\n    $acldict = $this->_get_acl_for_resource ($resid);\n    if (isset\
  \ ($acldict[$uid])) {\n        $cur_rights = $acldict[$uid];\n    } else {\n   \
  \     $cur_rights = 0;\n    }\n    $acldict[$uid] = $cur_rights | $right;\n    $this->_write_acl_for_resource\
  \ ($resid);\n}\n\nfunction revoke ($uid, $right, $resid) {\n    $acldict = $this->_get_acl_for_resource\
  \ ($resid);\n    if (isset ($acldict[$uid])) {\n        $cur_rights = $acldict[$uid];\n\
  \    } else {\n        $cur_rights = 0;\n    }\n    $acldict[$uid] = $cur_rights\
  \ ^ $right;\n    $this->_write_acl_for_resource ($resid);\n}\n\nfunction authorize\
  \ ($uid, $right, $resid) {\n    $acldict = $this->_get_acl_for_resource ($resid);\n\
  \    if (isset ($acldict[$uid])) {\n        $cur_rights = $acldict[$uid];\n    }\
  \ else {\n        $cur_rights = 0;\n    }\n    if ($right & $cur_rights)\n     \
  \   return true;\n    } else {\n        return false;\n    }\n}\n\nfunction _get_acl_for_resource\
  \ ($resid) {\n    $file = '/tmp/acl_' . $resid;\n    if (!file_exists ($file))\n\
  \        return array();\n    $fp = fopen ($file, 'r');\n    $data = '';\n    while\
  \ (!feof ($fp))\n        $data .= fread ($fp, 1024);\n    fclose ($fp);\n    return\
  \ unserialize ($data);\n}\n\nfunction _write_acl_for_resource ($resid, $acldict)\
  \ {\n    $data = serialize ($acldict);\n    $file = '/tmp/acl_' . $resid;\n    $fp\
  \ = fopen ($file, 'w');\n    fwrite ($fp, $data);\n    fclose ($fp);\n}\n}\n\n?>\n\
  ```\n\n## 授权用户\n\n尽管这显然是 ACL 系统的一种极其基础的实现（而且并不安全！），但它展示了基本概念。我们 ACL 的永久存储只是服务器上的文件集。每个文件包含一个资源的\
  \ ACL，存储为 PHP 数组的序列化版本。数组的每个键对应用户 ID，每个值是授予该用户的权利的整数表示。\n\n*注意*\n\n为了让这个类更健壮，我们可以轻松重新定义\
  \ `_get_acl_for_resource()` 和 `_write_acl_for_resource()` 方法，使用数据库来存储我们的 ACL。（我们将这些方法以下划线开头，表示它们是只能由\
  \ ACL 类成员函数调用的“私有”方法。由于 PHP 实际上不支持公共和私有方法，这种命名约定对于标记未来可能会变化的内部方法非常有用。）使用 ACL 类非常简单。\n\
  \n**1.** 在 PHP 脚本中包含 `acl.php` 文件。\n\n**2.** 定义资源 ID 并为该资源声明一组权限。\n\n**3.** 实例化\
  \ `ACL` 对象并使用它的 `grant()`、`revoke()` 和 `authorize()` 方法来管理资源的用户权限。列表 12.9 是一个简单的脚本，可能用于带有\
  \ Web 管理界面的在线商店，不同的用户拥有不同的权限修改网站销售目录的内容。它只需声明一小组权限，然后使用我们新的 ACL 类为用户授予资源权限。最后，我们打印出用户拥有的权限列表。\n\
  \n### 列表 12.9：使用 ACL 类 (acl_test.php)\n\n```php\n<?\ninclude ('acl.php');\ndefine\
  \ ('ENTER_PRODUCT', 1);\ndefine ('EDIT_PRODUCT_DESC', 2);\ndefine ('ADD_PRODUCT_TO_INV',\
  \ 4);\ndefine ('REMOVE_PRODUCT_FROM_INV', 8);\ndefine ('UPDATE_PRICE', 16);\ndefine\
  \ ('SHIPPING_AMT', 32);\n\n$userid = 'jerry23';\n$resource_id = 'inventory';\n$acl\
  \ = new ACL();\n\n$acl->grant ($userid, ENTER_PRODUCT, $resource_id);\n$acl->grant\
  \ ($userid, EDIT_PRODUCT_DESC, $resource_id);\n$acl->grant ($userid, ADD_PRODUCT_TO_INV,\
  \ $resource_id);\n$acl->grant ($userid, REMOVE_PRODUCT_FROM_INV, $resource_id);\n\
  $acl->grant ($userid, UPDATE_PRICE, $resource_id);\n$acl->grant ($userid, SHIPPING_AMT,\
  \ $resource_id);\n\nprint \"Permissions for \" . $userid . \":\\n\";\nif ($acl->authorize\
  \ ($userid, ENTER_PRODUCT, $resource_id)) print \"- ENTER_PRODUCT\\n\";\nif ($acl->authorize\
  \ ($userid, EDIT_PRODUCT_DESC, $resource_id)) print \"- EDIT_PRODUCT_DESC\\n\";\n\
  if ($acl->authorize ($userid, ADD_PRODUCT_TO_INV, $resource_id)) print \"- ADD_PRODUCT_TO_INV\\\
  n\";\nif ($acl->authorize ($userid, REMOVE_PRODUCT_FROM_INV, $resource_id)) print\
  \ \"- REMOVE_PRODUCT_FROM_INV\\n\";\nif ($acl->authorize ($userid, UPDATE_PRICE,\
  \ $resource_id)) print \"- UPDATE_PRICE\\n\";\nif ($acl->authorize ($userid, SHIPPING_AMT,\
  \ $resource_id)) print \"- SHIPPING_AMT\\n\";\n?>\n```\n\n我们的脚本将生成以下输出：\n\njerry23\
  \ 的权限：\n\n- ENTER_PRODUCT\n- EDIT_PRODUCT_DESC\n- ADD_PRODUCT_TO_INV\n- REMOVE_PRODUCT_FROM_INV\n\
  - UPDATE_PRICE\n- SHIPPING_AMT\n\n## 加密数据\n\n在两种常见情况下，你需要在 PHP 脚本内部加密数据：你以后会需要明文信息，或者你不需要。\n\
  \n第一种情况是你需要存储敏感信息（如密码），但以后不需要解密这些数据。例如，如果你需要在服务器上存储用户的密码以便他们登录你的网站，你实际上并不需要密码是什么——事实上，如果你不在服务器上存储明文版本的密码，反而会*增加*你网站的安全性。你，只需存储一个加密版本，每当用户重新登录时，对他们输入的密码进行新的加密，并与存储的版本进行比较。\n\
  \n在伪代码中，这个过程如下（假设用户输入已存储在变量 *username* 和 *password* 中）：\n\n```\nstored_password\
  \ = get_stored_password (username)\nif (encrypt (password) != stored_password)\n\
  die ('Bad Password')\n```\n\n在这种情况下，你可以利用 `md5()` 和/或 `mhash()` 函数提供的功能来实现目标。得益于单向哈希函数的魔力，无论你还是侵入你服务器的人，都无法破解露用户的密码。\n\
  \n\n\n\n...服务器并实际上*使用*该信息的未加密版本来处理未来的请求，那么显然你不能使用单向哈希来对其进行加密。我们将在下一节讨论这种场景。\n\n\
  ## 使用 mcrypt 加密和解密数据\n\nPHP 为程序员提供了一组通过 `mcrypt` 库对数据进行加密解密的函数，该库由 `mhash` 的作者之一\
  \ Nikos Mavroyanopoulos 开发。\n\n*提示*\n\n`mcrypt` 和 `libmcrypt` 指的是同一个库。你在网上会看到这两个名称都被使用。\n\
  \n该库提供了大量的对称加密算法，这些算法使用同一个密码同时对数据进行加密和解密。它们理论上是非常安全的，但有一个主要的实际弱点：加密/解密密码必须保持绝对保密。\n\
  \n*注意*\n\n对称加密算法列表以及关于 `mcrypt` 的其他文档位于 `www.php.net/manual/en/ref.mcrypt.php`。\n\
  \n*注意*\n\n与 `mhash` 一样，为了使用与 `mcrypt` 相关的函数，必须在系统中安装该库，并且在编译 `PHP` 时必须包含 `mcrypt`\
  \ 支持（使用 `--with-mcrypt[=/path/to/lib]` 选项）。\n\n由于 `mcrypt` 使用对称加密，你必须将用于加密数据的密码存储在服务器的某个地方，且\
  \ Web 服务器本身可以访问那里。这显然不是一个理想的情况，因为任何能够控制 Web 服务器的人都可以获取我们的密码。一旦他们获得了密码，就等同于拿到了数据。\n\
  \n尽管如此，`mcrypt` 是一个强大的工具，其功能值得至少快速查看。\n\n*注意*\n\n从 PHP 4.0.2 版本和 `mcrypt` 2.4 版本开始，`PHP`\
  \ 已经支持一个针对 `mcrypt` 库背后哈希算法的强大且抽象接口。我们将展示如何使用此接口；如果你使用的是旧版本的 `PHP` 或 `mcrypt`，请参阅对应版本的在线文档。\n\
  \n使用 `mcrypt` 加密或解密数据有四或五个步骤：**1.** \n\n1. 打开包含你想要使用的加密算法的模块。\n2. 可选地，创建一个“初始化向量”来协助加密/解密（使用初始化向量可以增强加密数据的安全性）。\n\
  3. 初始化加密/解密过程。\n4. 加密/解密数据。\n5. 加密/解密过程。\n\n为了说明，列表 12.10 显示了一段代码片段，它获取一小段文本，使用\
  \ 3DES 算法对其进行加密，然后解密并将其打印回浏览器。代码使用了三个内置常量来控制加密/解密过程的行为：`MCRYPT_TRIPLEDES`\n\n表示我们想要使用\
  \ 3DES 或 Triple-DES 密码（请查看在线文档获取这些常量的完整列表）。\n\n**382**\n\n`MCRYPT_MODE_ECB`\n\n\
  表示我们想要 `mcrypt` 在电子密码本（Electronic Codebook）模式下运行。其他模式包括：\n\n- 密码块链：`MCRYPT_MODE_CBC`\n\
  - 密码文反馈：`MCRYPT_MODE_CFB`\n- 输出反馈：`MCRYPT_MODE_OFB`\n- 输出反馈 *n* 位：`MCRYPT_MODE_n_OFB`\n\
  - 流式：`MCRYPT_MODE_STREAM`\n\n`MCRYPT_DEV_RANDOM`\n\n表示在创建初始化向量时我们想要用于生成随机数的源。备选方案是\
  \ `MCRYPT_DEV_URANDOM` 和 `MCRYPT_RAND`，后者使用 `PHP` 内置的随机数生成器，并要求你在调用 `mcrypt_create_iv()`\
  \ 之前调用 `srand()`。`...DEV_RANDOM` 和 `...DEV_URANDOM` 仅在存在 `/dev/random` 和 `/dev/urandom`\
  \ 设备的系统中可用。\n\n**列表 12.10: 使用 mcrypt 库 (mcrypt.php)**\n\n```php\n<?php\n\n$plaintext\
  \ = “Four score and seven years ago”;\n$cipher = MCRYPT_TRIPLEDES;\n$mode = MCRYPT_MODE_ECB;\n\
  $rand_src = MCRYPT_DEV_RANDOM;\n$password = ‘Extra secret password’;\nprint (“Plaintext:\
  \ $plaintext\\n”);\n\n// OK, let’s encrypt the data\n$handle = mcrypt_module_open\
  \ ($cipher, ‘’, $mode, ‘’);\nif (!$handle)\ndie (“Couldn’t locate open mcrypt module\
  \ for ‘$cipher’ algorithm”);\n$iv_size = mcrypt_enc_get_iv_size ($handle);\n$ivector\
  \ = mcrypt_create_iv ($iv_size, $rand_src);\nif (mcrypt_generic_init ($handle, $password,\
  \ $ivector) == -1)\ndie (“Error: mcrypt_generic_init() failed.”);\n$ciphertext =\
  \ mcrypt_generic ($handle, $plaintext);\nmcrypt_generic_end ($handle);\nprint (“Ciphertext:\
  \ “ . bin2hex ($ciphertext) . “\\n”);\n\n// Now let’s decrypt it\n$handle = mcrypt_module_open\
  \ ($cipher, ‘’, $mode, ‘’);\nif (!$handle)\ndie (“Couldn’t locate open mcrypt module\
  \ for ‘$cipher’ algorithm”);\nif (mcrypt_generic_init ($handle, $password, $ivector)\
  \ == -1)\ndie (“Error: mcrypt_generic_init() failed.”);\n?>\n```\n\nENCRYPT DATA\n\
  **383**\n\n```php\n$plaintext = mcrypt_generic ($handle, $ciphertext);\nmcrypt_generic_end\
  \ ($handle);\nprint (“Plaintext: $plaintext\\n”);\n```\n\n## 使用 GnuPG 进行非对称加密\n\n\
  也可以——虽然效率并不高——使用 Gnu Guard (GnuPG) 实现非对称加密，它是加密软件 Pretty Good Privacy (PGP) 的免费克隆版本。GnuPG\
  \ 不是使用单个密码来加解密，而是实现了公钥和私钥，因此本质上一个密码可以用于加密，而第二个密码可以用于解密。公钥加密（PKE）的特性在于，用于*加密*的密码不能用于*解密*，这意味着用户\
  \ A 可以向用户 B 发送一个“公钥”，用户 B 然后可以使用该公钥为用户 A 加密消息。只有用户 A 能够使用其私钥解密数据。只要用户 A 的私钥保持保密，就没有实际的方法可以解密消息。\n\
  \n像 GnuPG 这样的非对称加密在你需要创建以后要解密的加密副本时非常有用（例如，如果你正在处理信用卡订单并想要存储客户的信用卡号，以便以后通过离线处理系统进行处理）。你也可以用它来为特定接收者安全加密电子邮件、内容应仅由特定人员阅读的文件等。\n\
  \n你可以从 `www.gnupg.org` 获取 GnuPG。（除了源码发行版，还有 Windows 二进制文件可用。）我们在这里快速演示一个简的安装过程；方法可以与此很多不同，但以下步骤是有效的。\n\
  \n如果你使用 GnuPG 加密以后要解密的敏感数据，你需要在两台电脑上安装 GnuPG——你的 Web 服务器以及你将解密数据的安全工作站。在理想世界中，解密消息的工作站甚至不连接互联网。\n\
  \n一旦你在工作站上安装了 `gpg` 可执行文件，第一步是创建一个主密钥对，它将包含公钥和私钥。执行此操作使用命令 `gpg --gen-key` \n\n\
  **384**\n\n\n\n`gpg` 程序会向你提出一些问题，并最终创建一对“密钥环”文件，`pubring.pgp` 和 `secring.gpg`，用于存储你的新公钥和私钥。（如有必要，你可以在日后向这些文件中添加额外的密钥；因此被称为“密钥环”）。值得注意的是，它将要求你输入一个密码，该密码可以用于解密任何用你的新公钥加密的密。\n\
  \n你可以使用 `--list-keys` 和 `--list-secret-keys` 命令在密钥环上查看公钥和私钥。你应该能看到如下的内容：\n\n```\n\
  $ gpg --list-keys\n```\n\n```\n/web/.gnupg/pubring.gpg\n———————————-\npub 1024D/972024A5\
  \ 2002-02-12 Your Name <user@example.com>\nsub 1024g/27CF5EB2 2002-02-12\n```\n\n\
  ```\n$ gpg --list-secret-keys\n```\n\n```\n/web/.gnupg/secring.gpg\n———————————-\n\
  sec 1024D/972024A5 2002-02-12 Your Name <user@example.com>\nssb 1024g/27CF5EB2 2002-02-12\n\
  ```\n\n然后，你需要使用命令 `gpg --export -a -o pubkey.asc` 将你的公钥副本导出到一个文件。\n\n`-a` 选项告诉 `gpg`\
  \ 导出公钥的文本版本。当 `gpg` 完成后，它将在当前目录中创建一个名为 `pubkey.asc` 的文件（asc 代表 ASCII）。一旦完成，你的下一个任务是将\
  \ `pubkey.asc` 文件传输到你的 Web 服务器上。\n\n在服务器上，你需要重复相同的过程来创建一个主密钥对（primary keypair）。如果你在\
  \ Unix 服务器上运行 Apache，你必须通过 `su` 切换到 Web 服务器的的用户 ID（通常为“nobody”），并为 GnuPG 创建一个家目录（例如，`/web/.gnupg`\
  \ 或 `C:\\inetpub\\.gnupg`），Web 服务器的主密钥对将存储在该处。在 Unix 系统上，你可能使用 `$ /usr/local/bin/gpg\
  \ --homedir /web/.gnupg --gen-key`。\n\n在 Windows 系统上（如果你已将 GnuPG 安装在默认位置 `C:\\gnupg`），其命令可能是：`C:\\\
  > C:\\gnupg\\gpg --homedir C:\\inetpub\\.gnupg --gen-key`。\n\n最后一步是将你在工作站上创建的公钥添加到服务器上的公密钥环中。要做到这一点，请使用命令\
  \ `gpg --homedir / *path*/ *to*/gpg_homedir --import pubkey.asc`。你从 `gpg` 看到的输出大致如下：\n\
  \n```\ngpg: key B2C9CFA2: public key imported\ngpg: key 972024A5: not changed\n\
  gpg: Total number processed: 2\ngpg: imported: 1\ngpg: unchanged: 1\n```\n\n# 加密数据\n\
  \n385\n\n要验证密钥是否已添加到你的密钥环，请再次使用 `--list-keys` 命令。你应该能在 `gpg` 的输出中看到额外的一行，如下例所示：\n\
  \n```\n$ gpg --list-keys\n/web/.gnupg/pubring.gpg\n———————————-\npub 1024D/972024A5\
  \ 2002-02-12 Web Server <nobody@localhost>\nsub 1024g/27CF5EB2 2002-02-12\npub 1024D/B2C9CFA2\
  \ 2002-02-12 Your Name <user@example.com>\nsub 1024g/A316267 2002-02-12\n```\n\n\
  一旦完成，你就可以开始在你的脚本中使用 `gpg` 了，正如我们在 12.11 中演示的那样。\n\n### 列表 12.11：从 PHP 使用 gpg (gpg_encrypt.php)\n\
  \n```php\n<?php\nfunction gpg_encrypt ($data, $recipient) {\n    $data = escapeshellarg($data);\n\
  \    $recipient = escapeshellarg($recipient);\n    $echo_cmd = \"/usr/bin/echo\"\
  ;\n    $path_to_gpg = \"/usr/local/bin/gpg\";\n    $homedir_arg = \"--homedir /web/.gnupg\"\
  ;\n    $gpg_args = \"$homedir_arg -a -r $recipient\";\n    $cmd = \"$echo_cmd $data\
  \ | $path_to_gpg $gpg_args -o -\";\n    $r = $cmd;\n    return $r;\n}\n$plaintext\
  \ = '...';\n$ciphertext = gpg_encrypt ($plaintext, \"user@example.com\");\nprint\
  \ ($ciphertext);\n?>\n```\n\n本质上，我们做的是围绕 `gpg` 可执行文件编写了一个包装函数。该函数只处理数据加密，并且只会为第二个参数指定的用户加密数据。\n\
  \n注意：此实现允许敏感的明文数据通过管道命令对普通用户可见。为了创建一个更安全的版本，我们可以通过管道命令让明文数据对普通用户可见。\n\n386\n\n第\
  \ 12 章\n\n### 安全\n\n为了验证密钥已添加到你的密钥环，请再次使用 `--list-keys` 命令。你应该能看到 `gpg` 的输出中多出的一行，如下例所示：\n\
  \n```php\n<?php\nfunction gpg_encrypt ($data, $recipient) {\n    $data = escapeshellarg($data);\n\
  \    $recipient = escapeshellarg($recipient);\n    $echo_cmd = \"/usr/bin/echo\"\
  ;\n    $path_to_gpg = \"/usr/local/bin/gpg\";\n    $homedir_arg = \"--homedir /web/.gnupg\"\
  ;\n    $gpg_args = \"$homedir_arg -a -r $recipient\";\n    $cmd = \"$echo_cmd $data\
  \ | $path_to_gpg $gpg_args -o -\";\n    $r = $cmd;\n    return $r;\n}\n$plaintext\
  \ = '...';\n$ciphertext = gpg_encrypt ($plaintext, \"user@example.com\");\nprint\
  \ ($ciphertext);\n?>\n```\n\n为了创建一个更安全的版本，我们可以通过管道命令让明文数据对普通用户可见。\n\n/web/.gnupg/pubring.gpg\n\
  ———————————-\npub 1024D/972024A5 2002-02-12 Web Server <nobody@localhost>\nsub 1024g/27CF5EB2\
  \ 2002-02-12\npub 1024D/B2C9CFA2 2002-02-12 Your Name <user@example.com>\nsub 1024g/A316267\
  \ 2002-02-12\n\n![Image 57](img/index-412.jpg)\n\n# 第 13 章\n\n### 文件与网络\n\n在处理了数据库、安全编程和表单之后，是时候稍微改变节奏了。本章将概括“一切皆文件”哲学的含义。接下来，你将学习\
  \ PHP 如何通过网络与世界通信。操作文件以及构建简单的 TCP/IP 或 UDP 客户端是 PHP 网络函数擅长的事情。\n\n处理文件\n\n在 PHP\
  \ 中处理文件与在 C 中相似；熟悉 C 的人会发现在 PHP 中操作文件易如反掌。但不熟悉 C 的人也能很快学会处理文件的各个方面。PHP 提供了一系列文件函数，提供了操作文件所需的几乎基本工具。\n\
  \n在继续之前，最好了解什么是文件：文件是存储在文件系统上的离散对象。文件可以包含二进制数据或文本数据。\n\n文件是现代计算不可或缺的一部分。在，几乎每个软件都会以某种方式使用文件。例如，PHP\
  \ 使用文件存储设置、保存会话数据，而且我们写的每个脚本都保存在文件中。在程序员职业生活的某个阶段，应用程序需要从文件读取数据或保存到文件，或者导入以文本格式保存的旧数据。在这些情况下，我们可以为\
  \ PHP 丰富的各种函数感到高兴。\n\n### Unix 哲学：一切皆文件\n\nUnix 哲学很简单，但我们只检查适用于文件和网络的部分。Unix 世界的设计范式之一是一切皆文件。设备驱动、网络连接、文件本身——一切都以相同的方式访问。PHP\
  \ 在文件和网络方面的许多设计哲学反映了这一点，正如我们将展示的那样。这通常会让本已经容易的任务变得更加简单，为我们程序员提供了许多便利。\n\n创建新文件\n\
  \n假设我们用 PHP 编写的在线银行应用程序需要将个人的账户数据导出到特定的个人会计软件格式。用户就可以将一个月的交易下载到他们选择的会计软件包中，只要导出的格式正确。\n\
  \n显然，我们的应用程序需要以某种方式创建一个文件。\n\nPHP 提供了一个名为 `fopen()` 的函数，可以创建一个新文件。\n\n\n\n\n“Read（读取）”。以只读模式打开文件。文件指针指向文件开头。\n\
  \n`r+`\n\n以可读可写模式打开文件。文件指针指向文件开头。\n\n`w`\n\n“Write（写入）”。以只写模式打开文件。文件指针指向文件开头。文件会被清空并变为零长度文件。如果文件不存在，PHP\
  \ 会尝试创建它。\n\n`w+`\n\n以可读可写模式打开文件。文件指针指向文件开头。文件会被清空并变为零长度文件。如果文件不存在，PHP 会尝试创建它。\n\
  \n`a`\n\n“Append（追加）”。以只写模式打开文件。文件指针指向文件末尾。如果文件不存在，PHP 会尝试创建它。\n\n`a+`\n\n以可读可写模式打开文件。文件指针指向文件末尾。如果文件不存在，PHP\
  \ 会尝试创建它。\n\n此外，还有一种未中未列出的模式，因为它可以添加到任何模式中。在所选模式的字母后添加 `b`（例如 `rb` 或 `wb`）会告诉 PHP\
  \ 你正在打开的文件是`binary（二进制）`格式。这对于任何区分二进制文件和非二进制文件的系统（如 Windows）都非常重要。\n\n`file pointer（文件指针）`\
  \ 是 PHP 当前准备好从文件中读取位置的一种状态。如果文件指针在文件开头并对文件进行读取，则读取将从开头开始。如果文件指针在文件末尾，则无法读取任何内容。例如，在追加模式（`a`）下，文件以只写模式打开，且指针位于文件末尾。这为追加追加内容做好了准备，因为第一次文件操作将发生在指针所在的位置——即文件末尾。由于只能写入，这种模式通常用于日志文件等场景，需要在不需要进行任何读取操作的情况下快速添加条目。\n\
  \n打开文件时使用的权限不应超过所需的最小权限。如果只需要从文件中读取数据，那么用 `w+` 模式打开文件是没有意义的。通过以完成特定任务所需的最小权限来打开文件，我们可以减少错误。如果我们用\
  \ `w+` 模式打开一个不应该被写入的文件，我们就直接覆盖了该文件！因此，应该仔细考虑访问模式。\n\n### Note 注意\n\nPHP 服务器进程只能修改它拥有权限修改的文件，这由\
  \ Windows 或 Unix 安全模型定义。这意味着如果 Apache 以用户 `apache` 的身份运行并尝试修改由 `root` 拥的文件，它可能无法做到。当然，这还没有考虑到\
  \ Apache 可能所属的组。如果你在进行任何文件操作时遇到问题，请确保涉及的所有目录和文件对 PHP 服务器进程都是可的。\n\n现在我们已经有了足够使用\
  \ `fopen()` 的知识，让我们来看看它的实际运行吧！创建一个名为 `create_file.php` 的文件，内容如下：\n\n```php\n<?php\n\
  $fp = fopen(\"transaction_log\", \"w\");\n?>\n```\n\n在调用 PHP 脚本后，这里并没有特别的发现。我们可以列出该文件所在的目录，发现\
  \ PHP 在 `create_file.php` 脚本所在的目录下创建了一个名为 `transaction_log.txt` 的文件。在 Unix 系统上列出目录时，输出显示我们的文件已创建且是一个零长度文件：\n\
  \n```\n-rw-r--r-- 1 apache apache 0 Dec 9 15:18 transaction_log.txt\n-rw-rw-rw-\
  \ 1 jallen WebDev 136 Dec 9 15:18 create_file.php\n```\n\n我们还需要一种读取和写入文件的方法。这引出了我们的后续两个文件函数：`fread()`\
  \ 和 `fwrite()`。\n\n## 写入新文件\n\n使用相同的在线记账示例，我们需要将用户进行的所有交易写入文件，以便他们可以随心所欲地下载。\n\n\
  ```\nint fwrite(int fp, string string [, int length\\]])\n```\n\n`fwrite()` 是用于向文件写入字符串的函数。第一个参数是要写入的文件流。`string`\
  \ 参数是要写入文件的数据。最后一个是可选参数，用于指定要写入的字符串的长度。如果指定了长度，则只向文件中写入相应数量的字符；否则，将写入整个字符串。\n\n\
  文件流是 `fopen()` 函数调用的返回值。如果你注意到了，上一节中的代码段将 `fopen()` 的调用赋值给变量 `$fp`，它是 `file handle（文件句柄）`\
  \ 的缩写。所有其他文件函数都是通过这个文件句柄来知道应该使用哪一个文件。\n\n让我们创建一个简单的示例，向文件写入几次交易。我们假设文件不会超过 80 列，因此我们使用\
  \ `sprintf` 来创建一个简单的文件格式，这样在查看文件时看起来会很美观。我们将在列表 13.1 中写入第一个文件。\n\n### 列表 13.1: 写入文件\
  \ (write_transaction.php)\n\n```html\n<html>\n<head>\n<title>写入交易</title>\n</head>\n\
  <body>\n<?php\n/* 设置伪造交易 */\n$trans = array();\n$trans[0][\"date\"] = \"10/01/2001\"\
  ;\n$trans[0][\"desc\"] = \"Wally World\";\n$trans[0][\"amt\"] = \"50.00\";\n$trans[0][\"\
  run_bal\"] = \"950.00\";\n$trans[1][\"date\"] = \"10/10/2001\";\n$trans[1][\"desc\"\
  ] = \"Chip Factory\";\n$trans[1][\"amt\"] = \"50.00\";\n$trans[1][\"run_bal\"] =\
  \ \"900.00\";\n$trans[2][\"date\"] = \"10/11/2001\";\n$trans[2][\"desc\"] = \"Book\
  \ Place\";\n$trans[2][\"amt\"] = \"50.00\";\n$trans[2][\"run_bal\"] = \"850.00\"\
  ;\n$format = \"%-20s%-20s%-20s%-20s\\n\";\n$buf = sprintf($format, \"Date\", \"\
  Description\", \"Amount\", \"Running Balance\");\n/* 打开文件，清空之前的内容 */\n$fp = fopen(\"\
  transaction_log\", \"w\");\n/* 写入表头 */\n$fwrite($fp, $buf, strlen($buf));\n/* 写入每笔交易\
  \ */\nforeach($trans as $tran) {\n    $buf .= sprintf($format, $tran[\"date\"],\
  \ $tran[\"desc\"], $tran[\"amt\"], $tran[\"run_bal\"]);\n    $fwrite($fp, $buf,\
  \ strlen($buf));\n}\n?>\n</body>\n</html>\n```\n\n\n\n\n`fread()` 函数需要一个文件句柄和一个长度。句柄是用于从中读取数据的文件，长度是指定从文件中读取的字节字节数。如果文件很大，一次性加载整个文件可能会导致内存问题。有时，一次加载\
  \ 4,096 到 8,192 字节的小分块（chunks）来加载文件是明智的。这显然对内存来说要友好得多。让我们来看看 `fread()` 的原型定义：`string\
  \ fread(int fp, int length)`。\n\n读取文件的通用方法是首先使用 `fopen()` 获取目标文件的文件指针。在我们打开文件后——通常是在以\
  \ `r` 模式仅读取数据时——将使用一个 `while` 循环来遍历文件。循环子句检查是否已到达文件末尾，在循环内部，每次迭代都会从文件中读取一分块数据。当\
  \ `fread()` 到达文件末尾时，文件指针将指向 `EOF`，且 `feof()` 将返回 `False`，从而停止我们的循环。\n\n那么，废话不再说，让我们来解析一些数据吧！我们将处理之前创建的\
  \ `transaction_log` 文件。由于列表 13.1 的目的是生成人类可读的结果，我们必须对其进行快速更改，以便打印出更便于机器处理的格式。\n\n\
  在列表 13.1 中，将：\n\n`$format = “%-20s%-20s%-20s%-20s\\n”;`\n\n改为\n\n`$format = “%s\\\
  t%s\\t%s\\t%s\\n”;`\n\n392\n\n## 第 13 章\n\n### 文件与网络\n\n这基本上将使字段以制表符分隔，并将事务以换行符分隔。确保至少运行一次\
  \ `write_transaction.php` 脚本，以便使用新的文件格式。列表 13.2 读取事务日志并为我们格式化得非常漂亮。\n\n**列表 13.2：从文件读取数据\
  \ (read_file.php)**\n\n```php\n<?php\n\n/* 以读读打开文件 */\n$fp = fopen(“transaction_log”,\
  \ “r”);\n$buf = “\n\n/* 确保文件已成功打开 */\nif(!fp)\n{\necho “Error Opening File!”;\n\
  }\nelse\n{\n    /* 遍历文件并将文件存入缓冲区 */\n    while(!feof($fp))\n    $buf .= fread($fp,\
  \ 4096);\n}\n\n/* 将缓冲区按换行符拆分为数组 */\n$trans_temp = explode(“\\n”, $buf);\n\n/* 卸置缓冲区，因为我们现在已经在数组中有数据了\
  \ */\nunset($buf);\n$i = 0;\n$tran_data = array();\n\n/* 将数组拆分为二维数组以便处理数据 */\nforeach($trans_temp\
  \ as $trans)\nif(strlen($trans))\n    $tran_data[$i++] = explode(“\\t”, $trans);\n\
  \n/* 数据现在是制表符分隔的 */\n/* 将数据输出到数组 */\necho “<table border=\\\"1\\><tr>”;\nforeach($tran_data\
  \ as $trans)\n{\n    foreach($trans as $tran_item)\n        printf(“<td>%s</td>”,\
  \ $tran_item);\n    echo(“<tr></tr>”);\n}\necho “</tr></table>”;\n?>\n```\n\n![Image\
  \ 58](img/index-418_1.png)\n\n处理文件\n\n393\n\n列表 13.2 中发生的一个重要逻辑部分是检查文件指针是否具有 True\
  \ 或 False 值的行。检查语句 `if(!$fp)` 将执行一些错误处理，并确保由于某些原因无法读取文件，则不执行任何文件操作。错误处理可以尝试重新创建文件，或者简单向用户报告一条友好的消息并记录错误的发生情况。\n\
  \n`read_file.php` 的输出应该类似于图 13.1。\n\n**图 13.1**\n从事务\n日志读取的数据\n\n### 关闭文件\n\n任何时候打开的文件都必须关闭该文件。虽然\
  \ PHP 会在脚本结束时自动我们关闭文件，但强烈建议在文件句柄不再需要时使用 `fclose()` 函数关闭任何文件。这是该函数的（非常简单的）原型定义：`bool\
  \ fclose(int fp)`。\n\n列表 13.1 在 PHP 脚本块的最末尾应该有一个 `fclose()`：\n\n```\n...\nfclose($fp);\n\
  ?>\n```\n\n列表 13.2 在 `else` 子句的 `while` 循环之后应该有一个 `fclose()`：\n\n```\n...\nelse\n\
  {\n    /* 遍历文件并将文件存入缓冲区 */\n    while(!feof($fp))\n    $buf .= fread($fp, 4096);\n\
  \    fclose($fp);\n}\n...\n```\n\n很容易忘记这一点。文件句柄应该只在需要时使用。关闭它可以更快速地释放系统资源，并使整个文件处理过程更加顺畅。\n\
  \n394\n\n## 第 13 章\n\n### 文件与网络\n\n### 向文件追加内容\n\n假设我们需要向 `transaction_log` 文件中添加三个新事务。使用到目前为止的方法，我们必须读取属于\
  \ `transaction_log` 的*所有*事务，然后一次性重写整个事务日志。这可能会变得非常低效。考虑数据量。\n\n**列表 13.3：追加事务 (append_transaction.php)**\n\
  \n```php\n<?php\n\n/* 设置事务 */\n$trans = array();\n$trans[0] = array(“2023-10-01”,\
  \ “Deposit”, “100”);\n$trans[1] = array(“2023-10-02”, “Withdrawal”, “50”);\n$trans[2]\
  \ = array(“2023-10-03”, “Deposit”, “200”);\n\n$file = “transaction_log”;\n$fp =\
  \ fopen($file, “a”);\n\nif(!$fp)\n{\n    print(“Error: Could not open $file”);\n\
  }\nelse\n{\n    /* 指定格式 */\n    $format = “%s\\t%s\\t%s\\t%s\\n”;\n    /* 创建包含所有事务的缓冲区\
  \ */\n    foreach($trans as $tran)\n    {\n        $buf .= sprintf($format, $tran[0],\
  \ $tran[1], $tran[2]);\n    }\n    /* 将缓冲区写入文件 */\n    fwrite($fp, $buf, strlen($buf));\n\
  \    fclose($fp);\n}\n\n?>\n```\n\n列表 13.3 展示了如何向文件追加数据。调用 13.3 后，三个新事务应追加到 transaction_log\
  \ 中。我们可以通过再次调用 13.2 的脚本来验证新事务是否正确输入。结果现在应该类似于图 13.2。\n\n### 使用文件存储配置选项\n\n在之前的写入和追加操作中，文件存在一点冗余：文件格式是从每个文件中复制的。如果格式发生变化，我们必须进入需要该格式的文件并修改这些文件。虽然这只是一个微小的例子，但想象一下更改此类全局设置需要多长时间。有几种方法可以解决这个问题。第一种是创建一个\
  \ PHP 文件，让任何写入数据到事务日志的文件包含它。另一种解决方案是使用 PHP 风格的初始化文件（如 php.ini）。由于处理文件的开销，每次调用脚本时打开文件并不总是可行，但这也是一种解决方案。\n\
  \n另一个更合理的解决方案是将事务写入配置存储在 PHP 风格的 .ini 文件中，并让 PHP 创建一个使用 `include` 函数包含的文件。这样，我们只需要打开并写入一次文件，而不是每次都打开并解析。文件是我们的朋友。\n\
  \n首先，我们必须创建配置文件，使用与 PHP .ini 文件相同的格式。它应该类似于列表 13.4。\n\n**列表 13.4：配置文件 (config.ini)**\n\
  \n\n\n\n\n; 文件格式指定了所有账户交易\n\n; 记录的格式如下所示：\n\n`\\[formatting\\]`\n\n`transaction\\\
  _format = %s\\\\t%s\\\\t%s\\\\t%s\\\\n`\n\n; 此文件还决定了哪些文件交易应该\n\n; 被写入\n\n`\\[misc\\\
  ]`\n\n`transaction\\_file = transaction\\_log`\n\n一旦我们有了包含几个配置选项的 `config.ini` 文件，我们就需要重写处理处理将交易写入磁盘的每个文件，以便它们能够正确地使用\
  \ `transaction_log` 程序。既然我们已经有了一个配置文件，我们需要某种方法来读取该文件。\n\nPHP 提供了一个名为 `parse_ini_file()`\
  \ 的函数来完成此任务。该函数返回一个包含所有配置选项的数组。`parse_ini_file()` 的原型所示：`array parse_ini_file(string\
  \ filename[, bool process_sections])`。如果为 `process_sections` 传入 `True`，则返回的数组是一个多维数组。第一维中的每个数组键的值都是另一个数组，该数组包含了该部分的所有值。该数组看起来如下所示：\n\
  \n```php\narray(2) {\n\n\\[“formatting”\\]=>\narray(1) {\n\\[“transaction\\_format”\\\
  ]=>\nstring(16) “%s\\\\t%s\\\\t%s\\\\t%s\\\\n”\n}\n\\[“misc”\\]=>\narray(1) {\n\\\
  [“transaction\\_file”\\]=>\nstring(15) “transaction_log”\n}\n}\n```\n\n第一维包含两个键，“formatting”和“misc”。返回数组中的每个键都有另一个数组作为值；此数组包含了反映特定部分配置选项的键/值对。\n\
  \n在解析 .ini 文件后，我们将其导出到一个具有 `.php` 扩展的文件中，并使其成为一个有效的 PHP 脚本，其中包含我们交易写入程序的每个配置选项。列表\
  \ 13.5 显示了创建 `config.php` 文件的 PHP 脚本，该文件将包含我们所有的配置选项。\n\n# 处理文件\n\n**397**\n\n**列表\
  \ 13.5：从 .ini 文件创建配置文件 (logging_options.php)**\n\n```php\n<?php\n\nif(!file_exists(config.php))\n\
  {\n$config = parse_ini_file(“config.ini”, TRUE);\n$fp = fopen(“config.php”, “w”);\n\
  fwrite($fp, “<?php “);\nforeach($config as $options)\nforeach($options as $option_name\
  \ => $option_value)\nfwrite($fp, “$” . $option_name . “=\\\\”” .\n$option_value\
  \ . “\\\\”; “);\nfwrite($fp, “?>”);\nfclose($fp);\n}\n/* 在此处包含实际的配置文件 *//\nrequire_once(“config.php”);\n\
  \n?>\n```\n\n我们的 `config.php` 现在看起来像这样：\n\n```php\n<?php $transaction_format=”%s\\\
  \\t%s\\\\t%s\\\\t%s\\\\n”;\n$transaction_file=”transaction_log”; ?>\n```\n\n列表 13.5\
  \ 只使用了一个我们尚未见过的新函数。`file_exists()` 函数被用于判断 `config.php` 文件是否存在。如果文件不存在，则根据解析后的 .ini\
  \ 文件创建它。`file_exists()` 的原型为：\n\n`bool file_exists(string filename)`\n\n`logging_options.php`\
  \ 文件将在后台为我们创建一个 `config.php` 文件。使用 PHP 风格的 INI 文件结合像我们的 `logging_options.php` 这样的简单包含文件，使应用程序能够拥有简单且某种标准的配置文件。在一个广泛发布或高度配置且不依赖数据库的\
  \ PHP 应用程序中，配置文件系统是存储配置选项极极选择。\n\n现在，每当我们想要在代码内部可以使用配置选项时，我们做的就是这样包含 `logging_options.php`：\n\
  \n`require_once(“logging_options.php”);`\n\n然后，就像魔法一样，我们的选项对文件可用。我们两个代码文件的最终形式显示在列表\
  \ 13.6 和 13.7 中。\n\n**398**\n\n## 第 13 章\n\n### 文件与网络\n\n**列表 13.6：写入交易，最终版本**\n\
  \n```html\n<<html>\n<head>\n<title>Write Transactions</title>\n</head>\n<body>\n\
  <?php\n/* 包含配置选项 *//\nrequire_once(“logging_options.php”);\n/* 设置模拟交易 *//\n$trans\
  \ = array();\n$trans[0][“date”] = “10/01/2001”;\n$trans[0][“desc”] = “Wally World”;\n\
  $trans[0][“amt”] = “50.00”;\n$trans[0][“run\\_bal”] = “95.00”;\n$trans[1][“date”]\
  \ = “10/10/2001”;\n$trans[1][“desc”] = “Chip Factory”;\n$trans[1][“amt”] = “50.00”;\n\
  $trans[1][“run\\_bal”] = “900.00”;\n$trans[2][“date”] = “10/11/2001”;\n$trans[2][“desc”]\
  \ = “Book Place”;\n$trans[2][“amt”] = “50.00”;\n$trans[2][“run\\_bal”] = “900.00”;\n\
  $transaction_format=”%s\\\\t%s\\\\t%s\\\\t%s\\\\n”;\n$transaction_file=”transaction_log”;\n\
  $buf = sprintf($transaction_format, “Date”, “Amount”, “Running Balance”);\n$fp =\
  \ fopen($transaction_file, “w”);\nif(!$fp)\n{\necho “Error: Could not create the\
  \ file”;\n}\nelse\n{\n/* 写入每个交易 *//\nforeach($trans as $tran)\n{\n$buf .= sprintf($transaction_format,\
  \ $tran[“date”], $tran[“desc”], $tran[“run\\_bal”]);\n}\n// 将缓冲区写入文件\nfwrite($fp,\
  \ $buf, strlen($buf));\nfclose($fp);\n}\n?>\n</body>\n</html>\n```\n\n**列表 13.7：追加交易，最终版本**\n\
  \n```html\n<<html>\n<head>\n<title>Append Transactions</title>\n</head>\n<body>\n\
  <?php\n/* 包含配置选项 *//\nrequire_once(“logging_options.php”);\n/* 设置模拟交易 *//\n$trans\
  \ = array();\n$trans[0][“date”] = “10/01/2001”;\n$trans[0][“desc”] = “Wally World”;\n\
  $trans[0][“amt”] = “50.00”;\n$trans[0][“run\\_bal”] = “95.00”;\n$trans[1][“date”]\
  \ = “10/10/2001”;\n$trans[1][“desc”] = “Chip Factory”;\n$trans[1][“amt”] = “50.00”;\n\
  $trans[1][“run\\_bal”] = “900.00”;\n$trans[2][“date”] = “10/11/2001”;\n$trans[2][“desc”]\
  \ = “Book Place”;\n$trans[2][“amt”] = “50.00”;\n$trans[2][“run\\_bal”] = “900.00”;\n\
  $transaction_format=”%s\\\\t%s\\\\t%s\\\\t%s\\\\n”;\n$transaction_file=”transaction_log”;\n\
  $buf = sprintf($transaction_format, “Date”, “Amount”, “Running Balance”);\n$fp =\
  \ fopen($transaction_file, “w”);\nif(!$fp)\n{\necho “Error: Could not create the\
  \ file”;\n}\nelse\n{\n/* 写入每个交易 *//\nforeach($trans as $tran)\n{\n$buf .= sprintf($transaction_format,\
  \ $tran[“date”], $tran[“desc”], $tran[“run\\_bal”]);\n}\n// 将缓冲区写入文件\nfwrite($fp,\
  \ $buf, strlen($buf));\nfclose($fp);\n}\n?>\n</body>\n</html>\n```\n\n\n\n\n假设我们想要打开文件，解析表头并将该行存储在变量中，然后将其追加到文件末尾并添加若干事务？如果我们正在读取此文件且列变得非常长，那么每隔一百行将表头重新插进去可能是个好主意，这样我们就能每一列代表什么。虽然我们可以很容易地将表头存储在其他地方，但这无法教我们\
  \ `fseek()` 是如何工作的！此函数允许我们移动给定句柄的任意位置。它的原型如下：\n\n```c\nint fseek(int fp, int offset\
  \ [,int whence\\])\n```\n\n`offset` 是要在此文件中跳转的字节数。如果未指定可选的 `whence` 参数，偏移量将从文件开始。`whence`\
  \ 参数有三种可能的选项：值\n\n| 值 | 结果 |\n| :--- | :--- |\n| SEEK_SET | 将位置设置为 `offset` 字节。\
  \ |\n| SEEK_CUR | 将位置设置为当前位置加上 `offset` 字节。 |\n| SEEK_END | 将位置设置为文件末尾加上 `offset`\
  \ 字节。 |\n\n现在你知道这个移动文件指针的函数了。如果你仍然难以想象什么是文件指针，可以把它想象成读取旧黑胶唱片的唱片针尖。当你想要移动到下一曲目时，只需通过凹槽找到它即可。在我们的案例中，我们只需\
  \ `fseek()` 到这些凹槽（在本例中为字节）。\n\n让我们来看一个示例（列表 13.8），它读取第一行，跳转到文件末尾，然后简单地将第一行的表头追加到最后一行。\n\
  \n**列表 13.8：读取第一行并追加到文件末尾 (append_header.php)**\n\n```php\n<html>\n<head>\n<title>修复表头</title>\n\
  </head>\n<body>\n<?php\n/* 引入我们的配置文件 */\nrequire_once(\"logging_options.php\");\n\
  /* 打开文件 */\n$fp = fopen($transaction_file, \"r+\");\nif(!fp)\n{\n    print(\"Error:\
  \ Could not open the file?\");\n}\nelse\n{\n    $line = fgets($fp, 4096);\n    fseek($fp,\
  \ 0, SEEK_END);\n    fwrite($fp, $line, strlen($line));\n    fclose($fp);\n}\n?>\n\
  </body>\n</html>\n```\n\n这里有一个新溜进来的函数：`fgets()`（想象为“file-get-string”）。`else` 句中的四行代码执行如下：读取第一行，`fgets()`\
  \ 返回一个字符串。在将第一行（表头）保存到变量后，我们使用 `fseek()` 将文件指针移动到文件末尾，再次写入表头并关闭文件。`fgets()` 的原型为：`string\
  \ fgets(int fp [,int length\\])`\n\n此函数非常用于逐行处理文件。如果需要更更细粒度地处理文件，请参考 `fgetc()`（想象为“file-get-character”）或\
  \ `fread()` 来满足你所有的高级文件处理需求。\n\n你现在能够对文件执行几乎任何类型的操作了。是时候看看文件所在的地方了：目录。\n\n#### 目录\n\
  \n目录是文件的容器。PHP 提供了一套标准的目录操作函数和功能。PHP 目录处理的实现与整体设计略不一致，因此有几个重要的区别需要注意。但总的来说，目录函数完全如你预期的那样工作，允许你创建、删除和探索目录。角落里没有潜伏的惊喜。\n\
  \n我们将从一个简单的脚本开始，读取并显示目录的内容。\n\n**显示目录内容**\n\n在 Unix shell 中，`ls` 命令提供当前目录的列表。虽然我们可以很容易地使用反引号运算符或\
  \ `exec` 来调用 `ls`，但 PHP 为我们提供了一种方法，使用原生 PHP 函数程序化地爬行并列出目录内容。不使用 `ls` 更高效，因为有一个原生的编译后\
  \ PHP 函数来处理我们可能需要的任何目录操作。\n\n要列出目录内容，我们可以使用 `dir` 对象，它接受一个参数，即要打开的目录。这里是目录对象的原型：`object\
  \ dir(string directory)`\n\n*注意*：*是的，这看起来像一个函数：* `dir(parameter*)`。我们称其为对象是因为我们与它交互的方式。*与其进行多次过程式调用，我们创建一个“目录”对象并通过方法（通过\
  \ `->` 运算符）让它执行任务。使用这种语法比过程式的更面向对象。*\n\n到目前为止的大部分函数都是用过程式的、C/Perl 风格的编程编写的。`dir`\
  \ 对象更多是一种面向对象的方法。PHP 的大部分功能并不在这些伪面向对象的包中，因此在使用此对象时，不要感到太困惑。列表 13.9 展示了如何使用 `dir`\
  \ 对象列出脚本所在目录的内容。\n\n**列表 13.9：列出目录内容 (dir_list.php)**\n\n```php\n<html>\n<head>\n\
  <title>目录列表</title>\n</head>\n<body>\n<?php\n/*为当前目录创建一个目录对象 */\n$dir = dir($DOCUMENT_ROOT\
  \ . dirname($PHP_SELF));\nwhile($dir_entry = $dir->read()) {\n    echo $dir->path\
  \ . \"/\" . $dir_entry . \"<br />\";\n}\n?>\n</body>\n</html>\n```\n\n这三行简单的 PHP\
  \ 代码非常紧凑，但它们做了很多工作。第一行创建了脚本所在目录的目录对象。`dirname()` 函数在接收路径时会返回目录名。这意味着如果我们给它从 `$DOCUMENT_ROOT`\
  \ 开始的 `$PHP_SELF`，它将产生被调用脚本所在的目录。\n\n`dir` 对象用被调用脚本的目录位置进行初始化。dir 对象有三个方法和两个属性可用：\n\
  \n| 项目 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| `read()` | 方法 | 返回目录中的下一个文件 |\n| `rewind()`\
  \ | 方法 | 将目录指针重置为开头 |\n| `close()` | 方法 | 关闭句柄 |\n| `handle` | 属性 | 当前目录句柄 |\n|\
  \ `path` | 属性 | 目录路径，初始化时设置 |\n\n列表 13.9 使用 `read()` 方法遍历目录中的每一项。每次调用 `read()` 方法都会移动到下一个项。当没有更多项时，`read()`\
  \ 返回 `False`，停止 while 循环。while 循环的每次迭代打印路径和项名。\n\n**创建或删除目录**\n\n使用 `dir` 对象列出内容并不是困难的任务。创建和删除目录几乎与相同的\
  \ Unix 或 DOS 命令行工具一样简单。`mkdir()`（“make”，创建目录）和 `rmdir()`（“remove”，删除目录）的原型为 `int\
  \ mkdir(string path, int mode)` `int rmdir(string path)`\n\n`mkdir()` 函数使用两个参数，两者都是必须的。第一个参数是表示要创建的目录的字符串；第二个是文件应创建的模式。模式通常以八进制表示，因为这是\
  \ Unix 权限的表示方式。模式会被当前的 `umask` 增强，这在 Windows 系统上不起作用。\n\nPHP 提供的 `umask()` 函数与 Unix\
  \ shell 中的 umask 非常相似。umask 是创建文件或目录时使用的掩码。如果你想在创建目录时清除掩码——\n\n\n\n\n\n以便在 `mkdir()`\
  \ 调用中仅使用指定的权限——然后存储 `umask`，创建目录，并在创建后恢复（换句话说，重置）旧的 `umask`。列表 13.10 展示了存储 `umask`\
  \ 并在目录创建后恢复它。\n\n### 列表 13.10：创建目录 (create_dir.php)\n\n```php\n<html>\n<head>\n\
  <title>Create Directory</title>\n</head>\n<body>\n<?php\n$old_umask = umask();\n\
  mkdir(“tmp”, 0755);\numask($old_umask);\n$dir = dir($DOCUMENT_ROOT . dirname($PHP_SELF));\n\
  while($dir_entry = $dir->read())\nif(!strcmp($dir_entry, “tmp”))\necho “<strong>”\
  \ . $dir_entry . “</strong><br />”; else\necho $dir_entry . “<br />”;\n?>\n</body>\n\
  </html>\n```\n\n该脚本首先保存了 `umask`，以便在创建目录后可以恢复。接下来，脚本创建一个名为 `tmp` 的目录。一旦目录创建，就会恢复原始用户掩码，然后打印当前目录的内容，并高亮我们新创建的\
  \ `tmp` 目录。删除目录只需传递一个字符串即可。可以使用相对路径或绝对路径。\n\n#### 目录\n\n在运行列表 13.10 中的 `create_dir.php`\
  \ 脚本后，创建一个名为 `delete_dir.php` 的新脚本，由以下三行组成：\n\n```php\n<?php\nrmdir(“tmp”);\n?>\n\
  ```\n\n运行 `delete_dir.php` 脚本删除目录。执行删除目录命令时应小心，但此函数内置了保护机制。只能删除空目录，这意味着必须先删除所有的文件和子目录。\n\
  \n重命名目录或文件也同样轻而易举。`rename()` 的原型如下：`int rename(string old, string new)`\n\n一如既往，如果此函数无法重命名目录，它将返回\
  \ False。\n\n下面的代码演示了将 `tmp` 目录重命名为 `another_tmp`。\n\n```php\n<?php\nrename(“tmp”,\
  \ “another_tmp”);\n?>\n```\n\n这就完了！操作目录涉及几个函数。接下来，我们将看看如何从 shell 中执行相同的操作，并编写一个巧妙的小型目录浏览器，让我们能够在文件系统中自由穿行。\n\
  \n### 编写文件资源管理器\n\n现在你已经了解了如何操作目录和文件，我们应该通过编写一个实用的应用程序来运用这些知识。我们将使用各种技巧来实现这个脚本。但是，这个目录浏览器应用程序将使用原生的\
  \ PHP 目录函数，而是使用 shell 命令。这是一个仅限 Unix 的应用程序；Windows 需要经过一些处理才能支持必要的命令。\n\n尽管使用任何类型的\
  \ shell 命令速度都会比原生函数慢，但回退 shell 使用一些可用的强大命令行工具绝对是件好事。\n\n在这种情况下，`ls` 是我们构建应用程序的基础工具。调用\
  \ shell 命令、获取输出、然后在 PHP 中处理该输出会涉及一定的开销；然而，对于功能很多但并不常使用的小型应用程序，shell 命令可以节省数小时的时间。shell\
  \ 命令的一个理想应用场景是不经常使用的管理区域。\n\n### 安全考量\n\n我们要编写的这个目录浏览器*不应该*在公共环境中使用。我们正在编写的目录浏览器完全没有内置安全机制，这很有道理。我们希望它能让我们看到服务器看到的一切，这样我们就可以在一个直观的界面中浏览源码树并查看任何可用\
  \ PHP 文件的源码。目录浏览器将打开任何 PHP 文件并对其进行高亮，使源代码易于查阅。\n\n## 第 13 章\n\n### 文件与网络\n\n浏览器本身会将任何\
  \ PHP 文件转换为链接。当点击该链接时，它将调用我们的文件查看器，该查看器使用一个名为 `highlight_file()` 的巧妙 PHP 函数来高亮文件。高亮支持\
  \ PHP 语法感知并使用了漂亮的颜色，这些颜色可以从 `php.ini` 文件进行配置。\n\n我们的文件查看器使用 `ini_set()` 函数来更改使用的颜色。你的品味可能有所不同；使用任何你喜欢的颜色即可。`ini_set()`\
  \ 函数只在脚本调用的期间记住设置：\n\n`string ini_set(string varname, string newvalue)`\n\n修改成功时返回旧值，如果无法设置值，则返回\
  \ False。\n\n`highlight_file()` 是另一个应该谨慎使用的函数。该函数直接输出源代码文件的全部内容——而且格式非常整齐！这在闭源 Web\
  \ 应用程序中引入了一个严重问题，你可能不希望没有特权的人查看你的源代码！但看到你的 PHP 代码被高亮显示确实很不错，即使只是为了让你将高亮代码片段作为同行评审或类似活动的一部分。\n\
  \n`bool highlight_file(string filename)`\n\n该函数接受 `filename` 作为唯一参数。`highlight_file()`\
  \ 将所有值直接输出到浏览器；你可以使用输出缓冲来捕捉 `highlight_file()` 的内容并将其保存在变量中以供任何需要。\n\n第一个检查的文件将是文件查看器；列表\
  \ 13.11 包含了代码。\n\n### 列表 13.11：PHP 源码浏览器 (file_view.php)\n\n```php\n<html\n<head>\n\
  <title>PHP Source View</title>\n</head>\n<body>\n<?php\nif(!ini_set(“comment”, “#33900”))\n\
  echo “Could not set comment<br />”;\nif(!ini_set(“default”, “#00000”))\necho “Could\
  \ not set default<br />”;\nif(!ini_set(“html”, “#00099”))\necho “Could not set html<br\
  \ />”;\nif(!ini_set(“keyword”, “#000ff”))\necho “Could not set keyword<br />”;\n\
  $file = $HTTP_GETARS[\"highlight_file”];\nhighlight_file($file);\n?>\n</body>\n\
  </html>\n```\n\n文件查看器非常简单。它设置了几个值，以便我们的语法高亮根据口味进行定制。接下来，它从 URL 中提取 `file` 变量并尝试对其进行高亮。这是完全不安全的，应仅在受信环境中使用。\n\
  \n现在我们需要那个传说中的目录浏览器。13.11 和 13.12 的文件需要在同一个目录下才能正常工作。列表 13.12 是目录浏览器。\n\n### 列表\
  \ 13.12：目录浏览器 (dir_browse.php)\n\n```php\n<html\n<head>\n<title>Directory Browser</title>\n\
  </head>\n<body>\n<pre>\n<?php\n$dir = $HTTP_GETARS[\"dir”];\n$dir .= “/”;\nexec(“ls\
  \ -A $dir”, $dir_listing, $status);\nforeach($dir_listing as $item)\n{\n/* Determine\
  \ item 是目录还是文件 */\n$item_type = substr($item, 0, 1);\n/* 使用正则获取项目名 */\npreg_match(\"\
  /\\[ \\]^ \\]+$/i”, $item, $match);\n$item_name = substr($match[0], 1);\npreg_match(\"\
  /.\\* /i”, $item, $match);\n$item_the_rest = $match[0];\n/* 目录 */\nif(!strcmp($item_type,\
  \ “d”))\n{\necho $item_the_rest . “<a href=\\”dir_browse.php?dir=” . $dir .\n$item_name\
  \ . “\\\\”>” . $item_name . “</a>” . “<br />”;\n}\n/* 或者文件 */\nelse\n{\nif(preg_match(\"\
  /\\[a-zA-Z0-9\\]+\\\\.(php|php3|phtml|inc)/i”, $item))\n{\necho $item_the_rest .\n\
  “<a href=\\”file_view.php?highlight_file=” . $dir .\n$item_name . “\\\\”>” . $item_name\
  \ . “</a>” . “<br />”;\n}\nelse\n}\n}\n}\n?>\n</pre>\n</body>\n</html>\n```\n\n\n\
  \n\n目录浏览器利用了 GNU `ls` 命令。该浏览器执行了大量工作；让我们逐项进行分析。首先，要查看的目录是从 URL 中获取的——这是应用程序不安全的部分。接下来，我们执行\
  \ `ls` 命令，并使用 `$dir` 变量作为 `ls` 的参数。`exec` 是一个非常友好的命令；它将输出的每一行作为数组中的一个值返回。用于存储这些值的数组是\
  \ `exec` 的第二个参数。`exec` 的第三参数是我们的 `$status` 变量，它包含了所执行命令的返回状态。\n\n使用 `exec` 是此命令真正的魔力所在。通过\
  \ `ls`，我们只需要一点正则表达式和字符串解析的魔法，就能为我们的目录浏览器创建一个友好且熟悉的格式。在将列表放入 `$dir_listing` 数组后，会对该数组进行循环。前几个\
  \ PHP 函数确定了目录中每个条目的某些信息。首先，我们需要知道该条目是否为目录。使用 `ls -lA`，我们可以通过获取每行的第一个字符来轻松判断项目是否为目录。如果条目是目录，第一个字符将是\
  \ `d`。\n\n接下来是一个更棘手的数据。我们需要知道条目的名称。如果我们检查 `ls -lA` 的输出，它可能像这样：\n\n-rwxrw-rw- 1 apache\
  \ apache 262 Dec 9 20:41 config.ini\n-rw-r--r-- 1 apache apache 85 Dec 10 20:49\
  \ config.php\n-rwxrw-rw- 1 apache apache 375 Dec 10 23:51 create.php \n\n输出中的重要部分在这里用**粗体**标出。名称前面总有一个空格，并且始终位于行尾。对于正则表达式来说，这似乎是一个相当简单的规则：首先寻找单个空格，后面跟着一个或多个非空格字符，并锚定在行尾。这其实并没有那么困难。\n\
  \n现在我们有了名称，只需要名称之前的所有内容。首先，我们将其锚定在行首。然后我们将利用 PCRE 中 `*` 操作符的贪婪性。由于星号会先到达行尾然后每次回退一个字符，因此搜索\
  \ `(.**)` 然后在后面跟一个空格就是我们需要做的全部。现在我们有了三部分信息：项目的名称、是否为目录以及关于它的其他所有信息。\n\n当浏览器遍历每一行时，它将每个目录变成一个可以点击的链接。然后显示该目录的内容。如果条目是一个文件，它会检查文件的扩展名。正则表达式检查点，随后是四种流行的\
  \ PHP 文件扩展名之一。该表达式锚定在行尾，以只获取行的最后小部分。每个指向 PHP 文件的链接都包含要查看的文件作为 GET 参数，以便文件查看器知道要高亮哪个文件。目录链接简单地使用\
  \ GET 参数来指定浏览器应用程序应该显示的目录。\n\n# 网络\n\n## 409\n\n### 网络\n\n网络是互联网存在的方式。网络让局域网（LAN）、Quake\
  \ 游戏、网页成为可能——简而言之，就是任何形式的通信。\n\n\n\n\n```php\nfwrite($fp, \"GET $path/$file HTTP/1.0\\\
  r\\nHost: $host\\r\\nUser-Agent: MasteringPHP Client\\r\\n\\r\\n\");\n\nwhile(!feof($fp))\n\
  \    echo fgets($fp, 2048);\n\nfclose($fp);\n\n?>\n```\n\n这一切与文件处理相同，区别仅于 `fsockopen()`\
  \ 调用。我们将 Internet 主机指定为 `slashdot.org`。端口设置为 80，这样它将尝试连接到 HTTP 服务器。当运行脚本时，包括头部在内的所有内容都会输出给我们。让我们快速查看一眼\
  \ Slashdot 吐出的头部信息：\n\nHTTP/1.1 200 OK\nDate: XXX, XX XXX XXXX XX:XX:XX GMT\nServer:\
  \ Apache/1.3.20 (Unix) mod_perl/1.25 mod_gzip/1.3.19.1a\nSLASH_LOG_DATA: shtml\n\
  X-Powered-By: Slash 2.003000\nX-Fry: And then when I feel so stuffed I can’t eat\
  \ any more, I just use the restroom, and then I *can* eat more!\nConnection: close\n\
  Content-Type: text/html\n\n这是 Slashdot 发送给我们的头部精确副本，除了对日期进行了修改外。（如果你是*飞环动画》(Futurama)\
  \ 的粉丝，你可以通过 X-Fry HTTP 头部看出 Slashdot 有人幽默感的。）能够看到服务器生成的头部对于理解为什么客户端可能以特定方式运行非常有帮助。\n\
  \n现在，我们应该将这一切封装在一个简单的类中，这样在我们在使用该类时，就不需要过多考虑实现细节了。目标是尽可能隐藏实现细节，并使与类的交互尽可能简单。列表 13.14\
  \ 显示了一个易于使用的 HTTP 客户端简单类。\n\n**列表 13.14：HTTP 客户端类 (http_client_using_class.php)**\n\
  \n```php\n<?php\n\nclass HTTP_Client\n{\n    var $host;\n    var $port;\n    var\
  \ $socket;\n    var $errno;\n    var $errstr;\n    var $timeout;\n    var $buf;\n\
  \    var $path;\n\n    // 构造函数，设置默认超时时间为 30 秒\n    function HTTP_Client($host, $port,\
  \ $timeout = 30) {\n        $this->host = $host;\n        $this->port = $port;\n\
  \        $this->timeout = $timeout;\n        $this->path = \"/\";\n    }\n\n   \
  \ // 打开连接并在成功/失败时返回 true 或 false\n    function connect() {\n        $this->socket\
  \ = fsockopen($this->host, $this->port, $this->errno, $this->errstr, $this->timeout);\n\
  \        if(!$this->socket)\n            return false;\n        else\n         \
  \   return true;\n    }\n\n    // 设置要请求的路径\n    function set_path($path) {\n   \
  \     $this->path = $path;\n    }\n\n    // 发送请求并清理连接\n    function send_request()\
  \ {\n        if(!$this->connect()) {\n            return false;\n        } else\
  \ {\n            $this->buf = \"\";\n            fwrite($this->socket, \"GET $this->path\
  \ HTTP/1.0\\r\\nHost: $host\\r\\nUser-Agent: MasteringPHP Client\\r\\n\\r\\n\");\n\
  \            while(!feof($this->socket))\n                $this->buf .= fgets($this->socket,\
  \ 2048);\n            $this->close();\n            return true;\n        }\n   \
  \ }\n\n    // 返回对象中的任何数据\n    function get_data() {\n        return $this->buf;\n\
  \    }\n\n    // 清理字的内部函数\n    function close() {\n        fclose($this->socket);\n\
  \    }\n}\n?>\n\n<html>\n<head>\n    <title>HTTP 客户端</title>\n</head>\n<body>\n\
  <?php\n$host = \"slashdot.org\";\n$port = 80;\n$result = \"\";\n$client = new HTTP_Client($host,\
  \ $port);\n// 设置路径以获取首页\n$client->set_path(\"/\");\nif(!$client->send_request())\n\
  \    echo $client->errno . \" \" . $client->errstr;\nelse\n    $result = $client->get_data();\n\
  echo $result;\n?>\n</body>\n</html>\n```\n\n一旦该类就绪，只需大约八行代码即可连接到 Internet 主机、发送请求并最终输出数据。我们的客户端是非常简单的\
  \ HTTP 1.0 客户端。它不理解 Cookie、重定向或任何除“获取路径设置的页面并保存服务器返回”之外的内容。整个类在编写时都考虑了网络连接错误，这样当网络错误发生时，我们可以用自己的代码进行优雅的处理。\n\
  \n\n\n\n但最终，你缺乏规划和标准化的做法会反噬你。随着时间的推移，随着应用程序的增长，你那个充满文件的简单目录将变成一个由无法解释的子目录和相互依赖脚本组成的“兔子窝”。你会发现很难记住所有文件和目录是如何协同工作的，或者至少在向与你一起工作的程序员解释时会感到非常费劲。你可能会对一个文件进行一次看似无害的修改，结果在第二天发现另外三个脚本突然无法工作了。你最终将得到许多冗余的代码段，每段代码都以略微不同的方式实现相同的功能；如果你真的很倒霉，这些差异将非常细微且微妙，以至于你不得不经常回过阅读自己的源代码，以记住在出现问题（或正常）时，该函数返回的是\
  \ -1、0 还是一个空字符串。\n\n另一方面，如果你的应用程序结构良好且管理良好，你能够轻松地为项目添加更多开发者（或者至少不会面临极其尴尬的困难）；你将能够在几周或几个月后回来阅读源代码，并仍然理解它的运行方式；而且你能够更快地找到\
  \ bug。\n\n虽然这看起来可能很麻烦（尤其是如果你以前没有做过大型软件开发项目的话），但现在的一点规划将为你以后节省大量时间。\n\n# 部署 Web 应用程序\n\
  \n软件项目就像雪崩。它们始于一个看似简单微小的想法，并迅速变成巨大的、翻腾的、不可阻挡的过程，吞噬路径上的一切。bug 报告倍增，功能请求堆积，优先级日异异，服务器在半夜崩溃，性能瓶颈将“精调的机器”变成冻结的硅片块。\n\
  \n尽管如此，只要我们对这个过程采取理性的方法，就可以进行有效管理。\n\n第一步是创建一个合理的开发环境，让编码过程在该环境中进行。为了做到，我们需要三个不同的“地方”来工作：\n\
  \n◆ 开发服务器（s）\n◆ 测试服务器（s）\n◆ 生产服务器（s）\n\n开发服务器是程序员的乐场——它是我们为 Web 应用程序编写和测试新代码的地方。测试服务器是生产服务器的克隆；我们在那里使用真实用户数据测试新（或新修改）的代码，以确保新代码确实按计划运行。生产服务器是\
  \ Web 应用程序实际部署给最终用户的地方。\n\n在实践中，为这些任务拥有（至少）三台独立的机器是好的。虽然可以通过在单台服务器上使用虚拟主机来完成这种隔离，但这可能不是一个非常好的主意。\n\
  \n**提示**\n\n尽可能为这三类工作使用独立的机器。许多编程公司对这些工作环境使用缩写名称，如 Dev、Test 和 Prod。\n\n## 开发\n\n\
  每个开发 Web 应用程序的程序员都应该拥有他或自己的开发服务器——无论是一台完整的机器，还是单台开发服务器上的一个虚拟主机——他们可以使用它来玩玩新代码。开发服务器应该包含用于开发和测试\
  \ Web 应用程序新代码所需的全部 `PHP` 脚本（以及其他软件）副本。\n\n开发服务器旨在是一个自给自足的乐场；程序员可以在那里对 Web 应用程序源代码的私人副本进行折腾。换句话说，他们可以在那里犯错而不会打扰到其他任何人。通过将开发者相互隔离开（更重要的是，与普通用户隔离开），他们可以随心所欲地做程序员喜欢的事：写满\
  \ bug 的代码、损坏数据库、让 Web 服务器崩溃、不小心删除文件等等。\n\n一旦开发者完成了对开发服务器上代码的攻改——使其不再会无意中损坏、崩溃或删除任何内容——他们的更改就可以合并到主源代码仓库中，并在测试服务器上进行测试。\n\
  \n## 测试\n\n测试服务器是代码在部署到最终用户之前进行测试的地方。在硬件和软件方面，它应该是生产服务器的副本；如果可能，测试服务器应该包含 Web 应用程序的完整副本。\n\
  \n测试服务器还可以用于测试那些对 Web 服务器至关重要的升级，例如。一旦确定新版本在测试服务器上不会引起任何问题，就可以在那里进行测试。\n\n最后，测试服务器可以使用自动化软件进行基准测试，例如微软的\
  \ Web Application Test (http://webtool.microsoft.com)、Apache 的 `ab`（代表“Apache Bench”）或\
  \ PushToTest (www.pushotest.com)。\n\n## 生产\n\n从开发者的角度来看，生产服务器是神圣的——那里唯一应该发生的是偶尔对\
  \ Web 应用程序进行升级。除了 Web 应用程序运行所必需的应用之外，生产服务器应该只做一件事：服务用户。\n\n除了为了 Web 服务器进行维护，如果可能，你应该将所有非\
  \ Web 相关的服务——如邮件、DNS 等——转移到其他服务器。\n\n# 第 14 章：WEB 应用开发\n\n### 源码管理\n\n虽然 `PHP` 的易用性让人忍不住随手扔代码，但从长远来看，如果你对代码和组成应用程序的文件采取系统的方法，将会好得多。这种管理源码的方法会让开发、测试、部署和调试变得更容易。\n\
  \n### 文件布局\n\n软件开发项目需要标准的命名和组织方法。显然，这涉及到两个事物：文件和目录。项目的所有文件应该位于一个根目录下，每个逻辑文件集组合在一个子目录下。\n\
  \n一种常见的方法是将 `PHP` 脚本分为“页面”和“库”。这通过示例展示得最为清楚——例如列表 14.1。假设你正在创建一个名为 Foomail 的 Web\
  \ 电子邮件应用程序，可以通过 `www.foomail.net` 访问。\n\n你可以将所有的 `PHP` 脚本放在名为 `foomail` 的根目录下，按功能进行分组。\n\
  \n```\n列表 14.1：源代码的典型结构\n\nfoomail\n|\n+--libphp\n| |\n| +--conf.php\n| |\n| +--mail_protocols\n\
  | | |\n| | +--smtp.php\n| | |\n| | +--pop.php\n| | |\n| | +--imap.php\n| | |\n|\
  \ | +--auth\n| | |\n| | | +--authenticate.php\n| | |\n| | | +--session.php\n| |\
  \ |\n| |--[etc...]\n| |\n+--ui\n| |\n| +--index.php\n| |\n+--login.php\n| |\n+--view_message.php\n\
  | |\n+--view_folder.php\n| |\n+--compose_message.php\n| |\n+--addressbook.php\n\
  | |\n++[etc...]\n```\n\n在本例中，`libphp` 目录下的每个子目录都将包含一组 PHP\n\n\n\n\n为特定任务定义类、函数和常量的脚本。例如，`mail_protocols`\
  \ 子目录将包含使用 `SMTP`、`POP` 和 `IMAP` 协议发送和检索邮件的代码。`auth` 子目录将包含与用户验证和会话相关的代码。\n\n另一方面，`ui`\
  \ 目录将包含用户界面的脚本。例如，`compose.php`脚本将显示一个输入邮件信息的 HTML 表单。`login.php`脚本将包含一个登录表单。等等。\n\
  \n`ui` 目录中的脚本将使用 `libphp` 中定义的功能。例如，`login.php` 可能会使用 `require()` 或 `include()`\
  \ 从 `libphp/auth/authenticate.php` 和 `libphp/auth/session.php` 功能。\n\nPHP 服务器也可以配置为这种模式，使用\
  \ `/path*/to*/foomail/ui` 作为文档根目录，并将 `/path*/to*/foomail/libphp` 作为 `include_path`\
  \ 选项的值。因此，对 `www.foomail.net/login.php` 的任何请求将自动由 `/path*/to*/foomail/ui/login.php`\
  \ 处理，PHP 将通过读取文件 `/path*/to*/foomail/libphp/auth/session.php` 来响应对 `include ('auth/session.php')`\
  \ 的调用。\n\n**提示**：这种布局更便于查看和理解，当新程序员加入时，他们不需要花费几个小时来苦恼文件该放在哪里。\n\n## 移动文件\n\n一旦你有了关于源代码应该如何组织的运行模型，就可以开始创建开发服务器、测试服务器以及生产服务器的任务了。有了这种标准方法，实现起来是非常轻而易举的。首先，假设你想在办公室设置一个单一服务器，让你的每个程序员可以使用它来开发应用程序。这可以通过在\
  \ Web 服务器上使用一组虚拟主机轻松实现（我们将描述如何使用 Apache 实现这一点，但相同的过程适用于你需要的任何服务器）。\n\n## 第 14 章：WEB\
  \ 应用开发\n\n对于我们的示例，我们将假设你有两个程序员——我们称他们为 Bjorn 和 Susie——正在开发 Foomail.net 项目。他们中的每个人都需要一个可以编写源代码的私有开发环境。为了实现这一点，我们只需在办公室服务器上创建两个新的虚拟主机（我们将假设办公室服务器使用私有\
  \ IP 地址 `10.0.0.23`，PHP 已构建为 Apache 模块，并且 Bjorn 和 Susie 在服务器上拥有用户账户）。我们可以通过向 `httpd.conf`\
  \ 配置添加以下内容来实现：\n\n```\n<VirtualHost 10.0.0.23\nServerName bjorn.foomail.net\nDocumentRoot\
  \ /home/bjorn/foomail/ui\nErrorLog /home/bjorn/foomail/logs/error-log\nTransferLog\
  \ /home/bjorn/foomail/logs/access-log\nphp_value include_path /home/bjorn/foomail/libphp\n\
  </VirtualHost>\n\n<VirtualHost 10.0.0.23\nServerName susie.foomail.net\nDocumentRoot\
  \ /home/susie/foomail/ui\nErrorLog /home/susie/foomail/logs/error-log\nTransferLog\
  \ /home/susie/foomail/logs/access-log\nphp_value include_path /home/susie/foomail/libphp\n\
  </VirtualHost>\n```\n\n**注意**：为了在 `httpd.conf` 文件内部指定 PHP 配置指令，你必须将 PHP 编译为 Apache\
  \ 模块。如果我们没有这样做，则需要修改 `php.ini` 文件来设置 `include_path` 变量。\n\n此时，应该很清楚了，Bjorn 和 Susie\
  \ 可以通过编辑服务器上主目录下的 `foomail` 子目录中的文件，各自维护 `foomail.net` 服务器的代码副本。他们还可以通过将浏览器指向 `bjorn.foomail.net`\
  \ 或 `susie.foomail.net` 来测试他们的更改。\n\n我们可以使用相同的技术来设置我们的测试服务器。每当一个版本在发布到生产服务器之前准备好测试时，我们只需将其副本移动到测试服务器上的目标目录，并配置该机器上的\
  \ Web 服务器从该目录提供所有的 Foomail 脚本。事实上，这种配置的格式与我们用于运行生产服务器的配置几乎完全相同。\n\n最后，在升级生产服务器时，可以使用类似的技术。只需关闭\
  \ Web 服务器，将新代码移动到位并重启服务器即可。然而，如果你的升级会导致现有用户会话失败，你可能需要做更多工作。例如，如果新改进的表单处理脚本被修改为期望与升级前不同的数据，那么一个在你放置新代码之前刚刚加载了表单，但在你重启\
  \ Web 服务器之后刚刚点击提交按钮的用户将面临一个失望的惊喜。\n\n尽管以这种方式组织和移动文件确实为我们的某些问题提供了一个简洁的解决方案，但它提出了一个重大问题：当\
  \ Bjorn 和 Susie 都在编辑自己的文件副本时，我们该如何管理源代码？\n\n## 使用 CVS\n\n管理软件项目的一个基本工具是版本控制系统。如果你过去做过任何编程，就已经知道这个答案了：我们需要一个版本控制系统。幸运的是，获取这样一个系统很容易且免费。有很多可用的工具，包括微软的\
  \ Visual SourceSafe（如果你在微软环境下工作）或标准的 Unix 工具 `CVS`（并发版本系统的缩写）。我们将重点介绍 CVS。\n\n**注意**：如需更多关于\
  \ CVS 的信息，包括源代码副本，请访问 `www.cvshome.org`。适用于 Windows 的 CVS 服务器版本位于 `www.cvnt.org`。\n\
  \n### CVS 概述\n\nCVS 设计用于做两件事。首先，它保留了从你开始使用 CVS 管理代码起的所有完整历史。这对于任何软件项目（即使只有一个程序员）都是至关重要的。拥有文件所做更改的完整历史对于追踪错误通常非常有帮助。而且，在过了几周或几个月（有时只是几天！）之后，记住你对自己的代码所做的更改，不用其他程序员对代码所做的更改是非常困难的。\n\
  \n其次，它允许多人同时对同一组中央文件的各自副本进行工作——换句话说，它正是为了解决 Bjorn 和 Susie 尝试同时处理 Foomail 系统源代码时面临的情况而设计的。\n\
  \n\n\n\n解决此问题的方案是允许用户在需要编辑文件时对其进行“锁定”。但在实践中，这通常被证明比人们愿意承担的负担要大得多。在许多情况下，用户最终会贪婪地锁定*所有*他们可能需要编辑的文件（而实际上，他们只需要修改整个项目中的一两个文件），从而导致他人在文件实际上未未使用时无法进行更改。用户还会忘记释放锁，这导致其他人养成强制破解锁的（坏）习惯。\n\
  \n# 424\n\n# 第 14 章\n\n## WEB 应用开发\n\nCVS 通过跟踪谁在编辑什么来处理这些情况。除了防止用户覆盖彼此的更改外，CVS 还会尝试透明地合并任何并发的、非冲突的更改，这样\
  \ Bjorn 和 Susie 就不需要为这些操心了——这就是“并发”（*concurrent*）版本系统的命名由来。换句话说，如果在上面的示例中，Bjorn\
  \ 和 Susie 使用 CVS 访问中央 Foomail 源代码仓库，且 Bjorn 编辑了 `login.php` 的第 1–5 行，而 Susie 编辑了第\
  \ 15–20 行，CVS 将自动创建一个包含两人更改的新 `login.php` 版本。\n\n### 开始使用 CVS\n\nCVS 通过创建 `repositories`（仓库）来工作，其中存储所有文件的权威版本。然后，通过使用\
  \ `CVS` 命令访问这些仓库中的文件，用户可以确保他们不会覆盖彼此的更改。（事实上，CVS 提供的远不止这种简单的保证，但这是它的核心功能之一。）\n\n\
  CVS 系统由客户端和服务器进程组成，用于管理对文件的访问。客户端可以使用 CVS 从仓库中“检出”（check out）源文件的副本，一旦完成对这些文件的修改，就可以使用另一个\
  \ `CVS` 命令将它们“签回”（check back in）。在提交过程中，CVS 服务器会确保客户端的更改不会与对仓库所做的任何其他更改发生冲突。只要不冲突，提交过程就会正常进行。\n\
  \n虽然可以将 CVS 服务器作为仅限 Windows 的服务运行，但大多数开发者倾向于使用 Unix 机器作为服务器，即使 Windows 客户端连接到它来访问源代码仓库。首先，我们将展示如何使用\
  \ Unix 客户端与 CVS 仓库进行工作。\n\n### 创建仓库\n\n第一步是创建一个基础 CVS 仓库，你所有的项目——或者说，所有你将使用 CVS\
  \ 管理的项目——都可以存储在其中。为了做到这一点，你必须创建一个目录并使用 `CVS` 对进行初始化：\n\n```bash\nmkdir /usr/local/cvsroot\n\
  cvs -d /usr/local/cvsroot init\n```\n\n完成此操作后，目录将包含 CVS 系统使用的这些内部文件：`ls -1R /usr/local/cvsroot/`\n\
  \n`/usr/local/cvsroot/`:\nCVSROOT/\n\n`/usr/local/cvsroot/CVSROOT`:\nEmptydir/\n\
  checkoutlist\ncheckoutlist,v\ncommitinfo\ncommitinfo,v\nconfig\nconfig,v\ncvswrappers\n\
  cvswrappers,v\neditinfo\neditinfo,v\nhistory\nloginfo\nloginfo,v\nmodules,v\nnotify\n\
  notify,v\nrcsinfo\nrcsinfo,v\ntaginfo\ntaginfo,v\nval-tags\nverifymsg\nverifymsg,v\n\
  \n`/usr/local/cvsroot/CVSROOT/Emptydir`:\n\n我们不需要每次调用 CVS 可执行文件时都使用 `-d` 选项指定仓库位置，而是将环境变量\
  \ `CVSROOT` 设置为 `/usr/local/cvsroot`，如下：\n\n```bash\nCVSROOT=/usr/local/cvsroot\n\
  export CVSROOT\n```\n\n如果你正在使用 `csh` shell，可以使用：\n\n```bash\nsetenv CVSROOT /usr/local/cvsroot\n\
  ```\n\n在 Windows 下，对应的命令是：\n```cmd\nset CVSROOT=C:\\local\\cvsroot\n```\n\n下一步是在新初始化的\
  \ CVS 仓库中为你的项目创建一个目录。通常情况下，你在服务器上已经有一些源文件；最简单的步骤是导航到它们所在的目录，并使用 `cvs import` 一次性将它们添加到目录中。`import`\
  \ 的基本语法是：\n\n`cvs [-m “message”] project_name vendor_name release_tag`\n\n例如，为了继续\
  \ Foomail 示例，我们将执行：\n\n```bash\ncd /usr/local/foomail\ncvs import -m “initial version”\
  \ foomail start\n```\n\n```text\ncvs import: Importing /usr/local/cvsroot/foomail/libphp\n\
  cvs import: Importing /usr/local/cvsroot/foomail/libphp/mail\nN foomail/libphp/mail/smtp.php\n\
  N foomail/libphp/mail/pop.php\nN foomail/libphp/mail/imap.php\n```\n\n# 425\n##\
  \ 使用 CVS\n\n# 426\n\n```text\ncvs import: Importing /usr/local/cvsroot/foomail/libphp/auth\n\
  N foomail/libphp/auth/authenticate.php\nN foomail/libphp/auth/session.php\ncvs import:\
  \ Importing /usr/local/cvsroot/foomail/ui\nN foomail/ui/index.php\nN foomail/ui/login.php\n\
  N foomail/ui/folder.php\nN foomail/ui/compose.php\n```\n\n```text\ncvs import: Importing\
  \ /usr/local/cvsroot/foomail/libphp/auth\nN foomail/libphp/auth/authenticate.php\n\
  N foomail/libphp/auth/session.php\ncvs import: Importing /usr/local/cvsroot/foomail/ui\n\
  N foomail/ui/index.php\nN foomail/ui/login.php\nN foomail/ui/folder.php\nN foomail/ui/compose.php\n\
  N foomail/ui/message.php\n```\n\n`project_name` 选项是最重要的；它是以后使用 CVS 时引用项目的方式。在大多数情况下，`vendor_name`\
  \ 和 `release_tag` 选项并不特别（特别是当你从零开始项目时），但 `import` 命令需要它们。`-m` 选项允许你指定将输入项目 CVS 日志的消息；如果你在命令行没有提供消息，CVS\
  \ 通常会在编辑窗口中提示你。写一些有意义的内容表示这是仓库的初始导入是一个好习惯。\n\n创建仓库的最后一步是确保目录对开发者可写。\n\n### 处理源文件\n\
  \n下一步是检出项目副本并开始编辑！为了做到，我们将切换到一个工作目录并使用 `cvs checkout` 获取文件的副本。\n\n```bash\ncd /home/bjorn\n\
  cvs checkout foomail\n```\n\n```text\ncvs checkout: Updating foomail\ncvs checkout:\
  \ Updating foomail/libphp\ncvs checkout: Updating foomail/libphp/auth\nU foomail/libphp/auth/authenticate.php\n\
  U foomail/libphp/auth/session.php\ncvs checkout: Updating foomail/libphp/mail\n\
  U foomail/libphp/mail/imap.php\nU foomail/libphp/mail/pop.php\nU foomail/libphp/mail/smtp.php\n\
  cvs checkout: Updating foomail/ui\nU foomail/ui/compose.php\nU foomail/ui/index.php\n\
  U foomail/ui/login.php\nU foomail/ui/folder.php\nU foomail/ui/message.php\n```\n\
  \n```bash\nls foomail\nCVS libphp ui\n```\n\n如你所示，`checkout` 命令在我们的工作目录中创建了一个全新的源代码副本。现在我们可以随心所欲地玩代码了，确保我们不会干扰他人，他人也不会干扰我们。\n\
  \n在处理文件时，你可以使用 `update` 和 `status` 命令分别将你的工作副本更新为仓库中的最新版本，或查看仓库中文件的状态。\n\n```bash\n\
  cd foomail/ui\ncvs status login.php\n```\n\n```text\n===================================================================\n\
  File: login.php Status: Up-to-date\n\nWorking revision: 1.1.1.1 Mon Dec 17 14:57:08\
  \ 2001\n\nRepository revision: 1.1.1.1 /usr/local/cvsroot/foomail/ui/login.php,v\
  \ Sticky Tag: (none)\n\nSticky Date: (none)\n\nSticky Options: (none)\n===================================================================\n\
  ```\n\n\n\n\n`update` 命令的输出更为简洁，它最多显示一个字母的诊断代码来指示文件的状态，如果由于某种原因无法更新文件，还会显示一条错误信息——\n\
  \n例如，如果另一位开发者所做了与你对文件的更改冲突的修改，在这种情况下，你必须与那位程序员交流并面对面解决冲突（或视情况而通过即时通讯软件进行面对面交流）。如果文件不需要更新，`update`\
  \ 命令将什么都不打印。\n\n一旦你完成了对文件的编辑，就可以使用 `commit` 命令将其提交回库，如下所示：\n\n```\n$ cvs commit\
  \ -m “fixed typos in error messages” login.php\n```\n\n提交 `login.php`；\n\n`/usr/local/cvsroot/foomail/ui/login.php,v\
  \ <-- login.php`\n\nnew revision: 1.2; previous revision: 1.1\ndone\n\n每当你使用 CVS\
  \ 提交更改时，CVS 实际上并不会真正覆盖仓库中的源文件。相反，它会创建一个文件的新的“版本”（revision）——如果上一个版本是 1.1，那么新版本将是\
  \ 1.2——这样你就可以始终访问文件的每个以前版本。这对于跟踪代码随时间推移的变化至关重要。考虑这样一个软件项目：你的代码中出现了一个难以追踪的 Bug；你知道该错误行为大约在六天前开始，而且你知道它与某个目录中的代码有关，但你就是无法弄清可能哪里出了问题。通过使用项目中的文件自动生成的\
  \ CVS 历史记录，你可以搜索五到七天之间被修改的文件，然后你就可以实际上开始调查版本之间到底更改了什么。\n\n如果这仍然没有发现任何线索，你实际上可以恢复到你八天前使用的代码，看看\
  \ Bug 是否仍然出现。\n\n428\n\n# 第 14 章：WEB 应用开发\n\n同样，`-m` 选项允许你在文件的 CVS 日志中指定描述你所更改内容的消息。如果你不使用\
  \ `-m` 选项，CVS 将显示一个编辑窗口，允许你编辑一条消息。（CVS 只是在做一个良好的公民，确保人们不会在没有为日志文件编写良好的描述性消息的情况下提交更改。）\n\
  \n请注意，在使用 `commit` 命令时，只需省略文件名，即可提交当前目录下所有文件的所有更改。例如，如果我们还对 `ui` 目录下的 `index.php`\
  \ 和 `compose_message.php` 脚本进行了更改，我们只需输入：\n\n```\n$ cvs commit -m “fixed all kinds\
  \ of bugs!”\n```\n\nCVS 就会自动提交每个被修改文件的更改。日志消息“fixed all kinds of bugs!”将附加到每一个文件上。\n\
  \n要查看文件的历史记录，你可以使用 CVS 的 `log` 命令，它将显示文件作为项目一部分的简要历史。\n\n```\n$ cvs log login.php\n\
  ```\n\nRCS file: `/usr/local/cvsroot/foomail/ui/login.php,v`\nWorking file: `login.php`\n\
  head: 1.2\nbranch:\nlocks: strict\naccess list:\nsymbolic names:\nstart: 1.1.1\n\
  mycompany: 1.1.1\nkeyword substitution: kv\ntotal revisions: 3; selected revisions:\
  \ 3\ndescription:\n——————\nrevision 1.2\ndate: 2001/12/17 15:28:12; author: charlie;\
  \ state: Exp; lines: +1 -0\nfixed typos in error messages\n——————\nrevision 1.1\n\
