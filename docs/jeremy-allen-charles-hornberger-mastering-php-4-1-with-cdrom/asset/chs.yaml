  \ PHP 脚本\n\n```php\nif ($DV->errtype == DV_ERRR_TEL_TOO_SHORT)\nprint (“The telephone\
  \ number you entered, $tel, is too short.<br />” .\n$DV->errstr );\n```\n\n可能会用户的浏览器中生成类似如下的内容：\n\
  \nThe telephone number you entered, 123-456-789, is too short.\n\n美国电话号码必须包含 10\
  \ 位数字。（‘123-456-789’ \n仅包含 9 位数字。）\n\n这种技术让我们对向客户端报告错误的方式拥有了更多的控制权，允许我们可以在在调用验证方法的脚本中提供自定义错误消息、使用验证方法提供的标准错误消息或两者兼顾（如前面的示例）之间进行选择。\n\
  \n## DV 类\n\n现在我们已经决定了如何进行，让我们开始编写我们的验证类。包含完整类的文件 `DV.php` 呈现在列表 10.1 中并在配套 CD 上提供。我们将进行大部分错误检查将通过使用正则表达式匹配数据中的模式来完成；如果你不确定正则表达式如何工作，请参阅第\
  \ 5 章“字符串与数组”。\n\n### 列表 10.1：DV 类的大纲 (DV.php)\n\n```php\n<?php\n// DV - 用于执行常规数据验证检查的类\n\
  \n/* 将要使用的常量 */\n\n编写一个验证类\n\n**317**\n\ndefine (DV_ERR_UNKNOWN, 0);\n\n// 后面将有更多常量\n\
  \n/* 类本身 */\nclass DV {\n    var $errtype;\n    var $errstr;\n\n    function DV\
  \ ()\n    {\n        $this->errtype = false;\n        $this->errstr = '';\n    }\n\
  \n    // 验证方法放在这里\n}\n?>\n```\n\n当我们向类中添加新方法时，我们将它们所使用的任何常量添加到文件顶部的列表中，并将它们的类定义添加到文件中。\n\
  \n*注意*\n\n*本节中的代码列表均来自 CD 提供的 `DV.php` 文件。*\n\n## 验证地址数据\n\n包含地址和联系相关数据的变量通常是数据验证的良好候选，以确保它们是格式良好的。例如，美国电话号码需要包含\
  \ 10 位数字（包括区号），而邮政编码需要包含 5 位数字或 5 位数字加一个连字符后再四位数字（ZIP+4 格式）。列表 10.2 显示了我们 `is_us_tel()`\
  \ 的实现。\n\n### 列表 10.2：验证美国电话号码的方法\n\n```php\n/*\n* 方法: is_us_tel ($tel)\n* 参数: $tel\
  \ (要测试的值)\n*\n* 测试 $tel 以检查它看起来像不像美国电话号码（包括区号内的 10 位数字）。\n* 我们忽略任何括号、连字符、点或空格。\n\
  */\nfunction is_us_tel ($tel)\n{\n    /* 将括号、连字符、点或空格替换为 '' */\n    $new_tel = ereg_replace\
  \ (“\\[\\\\(\\\\)\\\\. -\\]”, “”, $tel);\n\n    **318**\n\n    $len = strlen ($new_tel);\n\
  \    if ($len < 10)\n    {\n        $this->errtype = DV_ERR_TEL_TOO_SHORT;\n   \
  \     $this->errstr = “Telephone numbers must have 10 digits. (‘$tel’ “ .\n    \
  \    “contains $len digits.)”;\n        return false;\n    }\n\n    if ($len > 10)\n\
  \    {\n        $this->errtype = DV_ERR_TEL_TOO_LONG;\n        $this->errstr = “Telephone\
  \ numbers must have 10 digits. (‘$tel’ “ .\n        “contains $len digits.)”;\n\
  \        return false;\n    }\n\n    // 确保只剩下数字\n    if (ereg (“\\[⁰-9\\]”, $new_tel))\n\
  \    {\n        $this->errtype = DV_ERR_TEL_ILLEGAL_CHARS;\n        $this->errstr\
  \ = “‘$tel’ is not valid. Telephone numbers may “ .\n        “only contain digits,\
  \ parentheses, and dashes.”;\n        return false;\n    }\n    return true;\n}\n\
  ```\n\n当我们向类中添加新方法时，我们将它们所使用的任何常量添加到文件顶部的列表中，并将它们的类定义添加到文件中。\n\n## 第 10 章\n### 数据验证\n\
  \n### 列表 10.3：验证美国邮政编码的方法\n\n```php\n/*\n* 方法: is_us_zip ($zip)\n* 参数: $zip (要测试的值)\n\
  *\n* 测试 $zip 以检查它看起来像不像美国邮政编码（五位数字）\n*/\nfunction is_us_zip ($zip)\n{\n    // 精确匹配五位数字\n\
  \    if (!ereg (“^[0-9]{5}$”, $zip))\n    {\n        return false;\n    }\n    return\
  \ true;\n}\n\n/*\n* 方法: is_us_zip_plus_four ($zip)\n* 参数: $zip (要测试的值)\n*\n* 测试\
  \ $zip 以检查它看起来像不像美国 ZIP+4\n*/\nfunction is_us_zip_plus_four ($zip)\n{\n    // 匹配五位数字加一个连字符后接四位数字\n\
  \    if (!ereg (“^[0-9]{5}-[0-9]{4}$”, $zip))\n    {\n        return false;\n  \
  \  }\n    return true;\n}\n```\n\n这种技术让我们对向客户端报告错误的方式拥有了更多的控制权，允许我们可以在调用验证方法的脚本中提供自定义错误消息、使用验证方法提供的标准错误消息或两者兼顾（如前面的示例）。\n\
  \n## 验证网络地址\n\n数据验证期间另一个常见任务是确保网络地址（尤其是 URL）是有效的。首先，我们将为类创建一些方法来测试网络地址是否格式良好。接下来，我们将编写一些测试来确定这些地址是否实际上可运行。\n\
  \n### 测试合法地址\n\n### 列表 10.4：验证主机名\n\n```php\n/*\n* 方法: is_hostname ($host)\n* 参数:\
  \ $host (要测试的值)\n*\n* 测试 $host 以检查它看起来像不像有效的 Internet 主机名。\n*/\nfunction is_hostname\
  \ ($host)\n{\n    // 确保 $host：以字母或数字开头；包含至少一个点\n    // 只包含字母、数字、连字符和点；并以一个) 至少 2\
  \ 个字符且 b) 仅包含字母的 TLD 结尾\n    if (!eregi (“^\\[a-z0-9\\]{1}[a-z0-9.\\-\\]*\\.\\[a-z\\\
  ]{2,}$”, $host))\n    {\n        return false;\n    }\n\n    // 确保主机名不包含任何相邻点/连字符的荒谬序列\n\
  \    if (ereg (“\\.\\.\", $host) || ereg (“\\.-”, $host) || ereg (“-\\.”, $host))\
  \ return false;\n    return true;\n}\n```\n\n\n\n\n\n域名的任何子部分都不能以连字符开头或结尾，且每对点之间都应该由有效的子部分隔开。\n\
  \n例如，字符串“www.foo-.com”将无法通过测试，因为它违反了规则 5；而字符串“a.b\\_c.com”将因为违反了规则 2 而失败。\n\n我们可以轻松地在列表\
  \ 10.4 中的函数基础上进行扩展，创建一个用于测试电子邮件地址的简单方法；我们将其命名为 `is_email()` 并在列表 10.5 中显示它。我们只需要添加一点逻辑，以确保地址符合\
  \ `user@example.com` 格式。请注意，此测试并不是对所有可能的有效电子邮件地址的完整测试（电子邮件可以以极其杂乱的形式和大小出现）。但对于许多用途来说，尽管该测试在技术上是不完整的，但以下测试已经足够了。\n\
  \n**列表 10.5：电子邮件地址的简单验证**\n\n```php\n/*\n* method: is_email ($email)\n* args: $email\
  \ (要测试的值)\n* 测试 $email 以检查其看起来是否像电子邮件地址。这仅适用于\n* 格式为‘user@example.com’的“简单”电子邮件地址。\n\
  */\nfunction is_email ($email) {\n    $tmp = split (\"@\", $email);\n    if (count\
  \ ($tmp) < 1)\n        return false;\n    if (count ($tmp) > 2)\n        return\
  \ false;\n\n    $username = $tmp[0];\n    $hostname = $tmp[1];\n    // 确保 $username\
  \ 组件包含至少一个合法的\n    //字符（且没有非法字符）\n    if (!eregi (\"^[a-z0-9_\\+\\.\\-\\]+$\", $username))\n\
  \        return false;\n    // 使用成员方法 is_hostname() 测试主机名组件\n    if (!$this->is_hostname\
  \ ($hostname))\n        return false;\n    return true;\n}\n```\n\n这里的正则表达式比我们目前为止看到的其他正则要复杂一点。用通俗的话说，它们的作用是确保电子邮件地址是由有效的信箱名、一个\
  \ `@` 字符和一个有效的域名构建而成的。\n\n对邮箱名进行测试，以确保它至少包含以下之一：字母、数字、加号（`+`）、下划线（`_`）、点（`.`）或连字符（`-`）。虽然这会允许不太可能的邮箱名\
  \ `-.-` 被接受为有效，但在技术上，确实有人可能拥有该名称的邮箱。\n\n正如我们提到的，这并不是一个技术上的完整解决方案，但对于许多情况已经足够了。从零开始创建一个完美的解决方案需要编写包含几十行密集代码的复杂算法。幸运的是，还有另一种方法对电子邮件进行“真实”测试。\n\
  \n如果你使用 `--with-imap` 配置选项编译了 PHP，可以使用函数 `imap_rfc822_parse_adrlist()` 来解析电子邮件。该函数将根据\
  \ RFC 822 第 6.1 节定义的相当复杂的规则解析地址。这将允许你正确验证合法的电子邮件，例如 `“Jimmie Jamestowne” <jimmie@host.example.com>`，这些地址并不符合列表\
  \ 10.4 和 10.5 中创建的简单标准集。\n\n*注意*\n你可以在网络上的 `www.ietf.org/rfc/rfc822.txt` 找到 RFC\
  \ 822，“ARPA 互联网文本消息格式标准”。\n\n*注意*\n电子邮件以及“c-client”库提供的功能（使用 `--with-imap` 选项时安装）在第\
  \ 19 章“电子邮件”中有更详细的介绍。\n\n列表 10.6 展示的 imap RFC 822 函数解析一个包含一个或多个电子邮件地址的字符串，并返回一个包含每个地址对应对象的数组。如果没有找到，它将返回一个空数组。\n\
  \n## 第 10 章\n\n### 验证\n\n**列表 10.6：使用 IMAP 函数验证地址**\n\n```php\n/*\n* function is_email_rfc22\
  \ ($email)\n* args: $email (要验证的地址)\n* 我们模拟 SMTP 会话以查看邮件服务器是否接受邮件。\n*/\nfunction\
  \ is_email_rfc22 ($email) {\n    // 获取用户的邮件服务器\n    list ($addr, $hostname) = explode\
  \ (\"@\", $email);\n    if (!getmxrr ($hostname, $mailhosts)) {\n        // 没有找到\
  \ MX 记录，简单尝试主机名\n        $mailhosts = array ($hostname);\n        // 替换为你的地址\n \
  \       $test_from = “me@domain.com”;\n    }\n\n    for ($i = 0; $i < count ($mailhosts);\
  \ $i++) {\n        // 打开收方邮件服务器的 25 端口连接\n        $fp = fsockopen ($mailhosts[$i],\
  \ 25);\n        if (!$fp)\n            continue;\n\n        // 与邮件服务器对话\n      \
  \  $r = fgets($fp, 1024);\n        fwrite ($fp, “HELLO \" . $_SERVER['SERVER_NAME']\
  \ . \"\\r\\n\");\n        $r = fgets($fp, 1024);\n        if (!eregi(\"²⁵⁰\", $r))\
  \ {\n            fwrite ($fp, “QUIT\\r\\n\");\n            fclose ($fp);\n     \
  \       continue;\n        }\n\n        fwrite ($fp, “MAIL FROM: <\" . $test_from\
  \ . \">\\r\\n\");\n        $r = fgets($fp, 1024);\n        if (!eregi(\"²⁵⁰\", $r))\
  \ {\n            fwrite ($fp, “QUIT\\r\\n\");\n            fclose ($fp);\n     \
  \       continue;\n        }\n\n        fwrite ($fp, “RCPT TO: <\" . $email . \"\
  >\\r\\n\");\n        $r = fgets($fp, 1024);\n        if (!eregi(\"²⁵⁰\", $r)) {\n\
  \            fwrite ($fp, “QUIT\\r\\n\");\n            fclose ($fp);\n         \
  \   continue;\n        }\n\n        // 如果我们到达这里，我们可以从 $test_from 发送邮件给它\n      \
  \  fwrite ($fp, “QUIT\\r\\n\");\n        $r = fgets($fp, 1024);\n        fclose\
  \ ($fp);\n        return true;\n    }\n    return false;\n}\n```\n\n**测试地址**\n有时，你不仅想知道地址是否有效，还想知道它是否真的工作。PHP\
  \ 使用其内置函数可以快速判断电子邮件地址是否有效。\n\n**列表 10.7：电子邮件地址是否有效**\n\n虽然 `imap_rfc822_parse_adrlist()`\
  \ 非常宽容，并且在解析时不一定会抛出错误，但对于我们的目的来说，知道它返回了一个且仅有一个元素是有意义的：\n\n| 元素 | 描述 |\n| :--- |\
  \ :--- |\n| `$addr->mailbox` | 邮箱的邮箱部分 |\n| `$addr->host` | 地址的主机名部分 |\n| `$addr->personal`\
  \ | 地址的个人名部分 |\n\n*注意*\n`imap_rfc822_parse_adrlist()` 非常宽容，并不一定能证明你可以发送邮件。如果我们想更严格一些，可以在我们的方法中添加以下几行：\n\
  \n\n\n\n如果邮件主机返回的字符超过 1,024 个，列表 10.7 中的代码将执行失败，但我们无法想象有多少 SMTP 服务器会返回如此多的字符。\n\n\
  ## 验证信用卡号\n\n信用卡号是另一个结构良好的数据示例。由于大多数主要的信用卡公司都使用定义明确且广为人知的规则生成卡号，我们可以编写一个脚本（列表 10.8）来轻松测试信用卡号，帮助发现拼写错误。\n\
  \n### 列表 10.8: 检查信用卡的有效性\n\n```php\n/*\n* method: is_valid_cc_num ($num, $type)\n\
  * args: $num (要测试的信用卡号)\n* $type (卡片类型)\n* 检查 Visa, Discover, Mastercard, AmEx 信用卡数的有效性。\n\
  * 第一个参数是信用卡号，第二个是卡类型。卡片类型可以是\n* ‘visa’‘discover’‘mastercard’‘amex’ 之一。使用关于卡号的硬编码知识（例如，所有\
  \ Visa 卡号都以 4 开头）和 mod10\n* 算法来检查有效性。\n*\n* 注意 $num 参数必须是字符串，而不是浮点或整数。\n*/\nfunction\
  \ is_valid_cc_num ($num, $type) {\n$ndigits = strlen ($num);\nswitch ($type) {\n\
  case (‘visa’):\n// 必须以‘4’开头且长度为 13 或 16 位\nif (substr ($num, 0, 1) != ‘4’)\nreturn\
  \ false;\nif (!(($ndigits == 13) || ($ndigits == 16)))\nreturn false;\nbreak;\n\
  case (‘discover’):\n// 必须以‘6011’开头且长度为 16 位\nif (substr ($num, 0, 4) != ‘6011’)\n\
  return false;\nif ($ndigits != 16)\nreturn false;\nbreak;\ncase (‘mastercard’):\n\
  // 必须以 51 到 55 之间的两位数字开头\n// 且长度为 16 位\nif (intval (substr ($num, 0, 2)) < 51)\n\
  return false;\nif (intval (substr ($num, 0, 2)) > 55)\nreturn false;\nif ($ndigits\
  \ != 16)\nreturn false;\nbreak;\ncase (‘amex’):\n// 必须以‘34’或‘37’开头且长度为 15 位\nif\
  \ (!((susbtr ($num, 0, 2) == ‘34’) ||\n(substr ($num, 0, 2) == ‘37’)))\nreturn false;\n\
  if ($ndigits != 15)\nreturn false;\nbreak;\ndefault:\nreturn false;\n}\n// 使用 mod10\
  \ 算法计算校验和\n$checksum = 0;\n$curpos = $ndigits - 2;\nwhile ($curpos >= 0) {\n$double\
  \ = intval (substr ($num, $curpos, 1)) * 2;\nfor ($i = 0; $i < strlen ($double);\
  \ $i++)\n$checksum += intval (substr ($double, $i, 1));\n$curpos = $curpos - 2;\n\
  }\n$curpos = $ndigits - 1;\nwhile ($curpos >= 0) {\n$checksum += intval (substr\
  \ ($num, $curpos, 1));\n$curpos = $curpos - 2;\n}\n// 检查校验和是否有效（必须是 10 的倍数）\nif\
  \ (($checksum % 10) != 0)\nreturn false;\nreturn true;\n}\n```\n\n大多数公司使用所谓的 mod10\
  \ 算法生成信用卡号，我们可以反向使用它来查看该数字是否至少可能是有效的。请注意，这并不能告诉我们卡是否真的可用，但它确实可以告诉我们是否有必要尝试使用所给定的卡号进行交易。\n\
  \n### 使用 PHP 内置函数检查数据\n\nPHP 本身提供了许多我们验证外部数据时所需的工具。其中最强大且功能最全的是正则表达式函数 `ereg()`\
  \ 和 `preg_match()`。然而，还有许多其他内置函数可以使用它们来完成任何数据验证；通常情况下，这些函数比调用正则表达式函数更快。很可能，它们也比你花两分钟编写的正则表达式更可靠。\n\
  \n### 查看变量\n\n例如，我们可以通过编写如下的正则表达式来测试变量是否包含数值：\n\n```php\nif (ereg ([⁰-9], $num))\n\
  print “That’s not a number!”;\n```\n\n然而，`is_numeric()` 函数可以完成相同的事情……它能识别小数、指数计数法表示的数字以及带负号的数字，而我们的正则表达式就会失败。我们可以尝试改进正则表达式以使其像\
  \ `is_numeric()` 一样有效，但我们为什么要费此精力呢？通常，这个规则似乎是值得遵循的：如果 PHP 提供了内置方法来测试你正试图用正则表达式测试的任何内容，停止编写你的正则表达式吧。\n\
  \n此外，PHP 还提供了额外的函数如 `is_array()` 和 `is_int()` 来测试类型。与 `htmlspecialchars()` 不同，它们简单返回\
  \ True 或 False。\n\n**表 10.1: 变量类型函数 (s)**\n\n| 函数(s) | 测试内容 |\n| :--- | :--- |\n\
  | `is_array()` | 是否为数组 |\n| `is_bool()` | 布尔值 |\n| `is_float()` | 浮点数 |\n| `is_int()`\
  \ | 整数 |\n| `is_object()` | 对象 |\n| `is_scalar()` | 标量 |\n| `is_string()` | 字符串\
  \ |\n\n### 移除不需要的字符\n\n正如我们在第 5 章中提到的，PHP 提供了一对函数——`htmlspecialchars()` 和 `strip_tags()`，它们对于从输入中提取\
  \ HTML 标签非常有用。例如，你在网页上显示某些用户文本，该文本包含未闭合的 HTML 标签；某些浏览器将无法显示页面。更糟糕，恶意用户可能使用 `<script>`\
  \ 标签欺骗用户暴露个人数据。\n\n`htmlspecialchars()` 函数找到所有在 HTML 中具有特殊含义的字符（换句话说，<>&”）并将它们替换为相应的\
  \ HTML 实体，这样它们就不会被浏览器解释。\n\n`htmlspecialchars()` 的原型是 `string htmlspecialchars (string\
  \ string [, int quote_style [, string charset])`。第二个参数允许你指定如何处理引号。\n\n这三个值为 `ENT_COMPAT`、`ENT_QUOTES`\
  \ 和 `ENT_NOQUOTES`：\n\n- 在 `ENT_COMPAT` 模式下，PHP 只将双引号转换为其实体 `&quot;`。\n- 在 `ENT_QUOTES`\
  \ 模式下，双引号和单引号都将转换为它们的实体（单引号变为 `&#39;`）。\n- 在 `ENT_NOQUOTES` 模式下，双引号和单引号都不会转换。\n\n\
  `strip_tags()` 函数实际上从输入中删除所有 HTML 标签。它的原型是 `string strip_tags (string str [, string\
  \ allowable_tags])`。可选的第二个参数允许指定允许且不应被移除的标签列表。\n\n第三个函数 `htmlentities()` 与 `htmlspecialchars()`\
  \ 相似，区别在于：任何可以用 HTML 实体表示的字符都会转换为该实体。例如，执行以下代码后：\n\n```php\n$str1 = “Hasta mañana”;\n\
  $str2 = htmlentities ($str1);\n```\n\n变量 `$str2` 将包含：`Hasta &ntilde;ana`。\n\n对于复杂的字符串替换，你可以为\
  \ `ereg_replace()` 或 `preg_replace()` 编写自定义正则表达式，或者使用 `str_replace()` 和 `strtr()`\
  \ 函数。\n\n### 测试网络名称\n\n使用 PHP 的内置网络函数很容易对网络地址进行基本检查。在跨用户生成的网络连接读取或写入任何数据之前，你应该使用这些函数来测试地址的有效性。\n\
  \n`gethostbyname()` 函数用于测试主机名是否可以通过 DNS 解析为有效的 Internet 地址。该函数的原型为 `string gethostbyname\
  \ (string hostname)`。\n\n\n\n\n这将返回 `hostname` 指向的 IP 地址，或者在未找到 IP 地址或发生错误时返回 `hostname`。要使用\
  \ `gethostbyname()`，只需编写如下所示的测试代码：`$ip = gethostbyname($hostname)`\n\n```\nif ($ip\
  \ == $hostname) {\n// hostname 没有解析\n} else {\n// hostname 解析成功\n}\n```\n\n另一个独立的函数\
  \ `gethostbynamel()`（注意多出来的字母 *l*）将返回一个包含 `hostname` 所有 IP 地址的数组。（如果执行失败，它将返回一个空数组。）这允许你检索“多宿主”（multihomed）主机的所有地址。例如，“www.yahoo.com”实际上指向多个服务器；这被称为“轮询”（round-robin）寻址，它允许服务器将请求分散到多个服务器上，这样如果某个服务器无法访问，客户端就可以尝试另一个。\n\
  \n警告\n\n请注意，这些名称和地址解析函数需要与 DNS 服务器建立有效的连接，无论该服务器是与你的 Web 服务器位于同一台机器上，还是位于互联网的任何地方。如果你与\
  \ DNS 服务器的连接不可靠，那么这些函数同样不可靠。\n\n例如，这里是用于在域名和 IP 地址之间转换的 `nslookup` 实用对 www.yahoo.com\
  \ 显示的内容：\n\n```\nC:\\PHP> nslookup www.yahoo.com ns1.gandi.net\nServer: ns1.gandi.net\n\
  Address: 212.73.209.248\n```\n\n![Image 51](img/index-354_1.png)\n\n### 使用 PHP 内置函数检查数据\n\
  \n329\n\n非权威回答：\n\nName: www.yahoo.akadns.net\nAddresses: 64.58.76.222, 64.58.76.179,\
  \ 64.58.76.226, 64.58.76.228\n64.58.76.229, 64.58.76.176, 64.58.76.225, 64.58.76.178\n\
  64.58.76.224, 64.58.76.177, 64.58.76.223, 64.58.76.227\nAliases: www.yahoo.com\n\
  \n我们可以像这样使用 `gethostbynamel()`：\n\n```\n$host = “www.yahoo.com”;\n$addrs = gethostbynamel\
  \ ($host);\nprint “Addresses for “ . $host . “:<<ul>\\n”;\nfor ($i = 0; $i < count\
  \ ($addrs); $i++)\n    print “<li>” . $addrs[$i] . “</li>\\n”;\nprint “</ul>\\n”;\n\
  ```\n\n这段代码段将生成类似于图 10.1 所示的输出。\n\n**图 10.1**\n\n`gethostbynamel()` 的输出：\n\n同样，`gethostbyaddr()`\
  \ 将尝试为 IP 地址确定名称；如果你想确定一个 IP 地址是否实际上可以解析，这将非常有用。在实践中，你可能不会发现自己经常需要这种测试，但如果你想确保一个\
  \ IP 地址不是虚造的，那么它是很有用的。（许多互联网服务，如 FTP 服务器，要求访问者的 IP 地址必须是可以解析的，仅仅是为了防止访问者伪造 IP 地址以掩盖其真实位置。）在\
  \ Unix 服务器上，也可以使用 `checkdnsrr()` 对更特定类型的记录进行查找，尽管它只报告是否找到了指定的记录，而不报告其内容。\n\n330\n\
  \n## 第 10 章：数据验证\n\n#### 处理日期\n\nPHP 还提供了处理日期的函数，可以方便地验证用户生成的日期。其中最而易见的是 `checkdate()`\
  \ 函数，它报告日期是否有效。它的原型是：\n\n```\nint checkdate (int month, int day, int year)\n```\n\
  \n如果日期是有效的，该函数返回 True，否则返回 False。例如，调用 `checkdate (2, 29, 2002)` 将返回 False（因为 2002\
  \ 不是闰年），而 `checkdate (2, 29, 2004)` 将返回 True。\n\n可以使用 `mktime()` 函数轻松地测试日期值。例如，这里有一个名为\
  \ `days_from_now()` 的函数，我们可以用它来检查用户提供的日期是否在今天 *n* 天内。\n\n```\nfunction days_from_now(\
  \ $m, $d, $y) {\n    $now = mktime (0, 0, 0);\n    $then = mktime (0, 0, 0, $m,\
  \ $d, $y);\n    return ($then - $now) / (60 * 60 * 24);\n}\n```\n\n#### 转义 Shell\
  \ 命令\n\n通过 shell 传递给外部程序的数据经过经过转义和测试。PHP 提供了两个命令来实现此目标：`escapeshellcmd()` 和 `escapeshellarg()`。\n\
  \n`escapeshellcmd()` 以一个字符串作为唯一参数，并返回该字符串的转义副本，然后可以使用 `exec()`、`passthru()` 或 `system()`\
  \ 函数将其传递给 shell。在生成的字符串中，以下每个字符都将加上一个反斜杠（`\\`）字符，以便其不会被 shell 解释：\n\n`# $ & ‘ (\
  \ ) * ; < > ? [ \\ ] ^ ` { | } ~`\n\n`escapeshellarg()` 同样接受单个字符串作为唯一参数，并返回字符串的转义版本。在这种情况下，并不是使用反斜杠转义所有特殊字符，而是将整个字符串放在单引号内，并且字符串内部的任何单引号都会用反斜杠进行转义。因此，字符串\
  \ `foo ‘ bar` 在经过 `escapeshellarg()` 处理后变为 `‘foo \\’ bar’`。\n\n但在实践中，你对这些函数的使用应该是很少的，因为你不应该很少（如果有的话）将用户输入直接传递给\
  \ shell。换句话说，与其编写一个包含如下内容的脚本：\n\n```php\nprint “<pre>Here’s the output of your command:\\\
  n”;\npassthru ($user_input);\n```\n\n你应该编写一个像这样的脚本，显式限制可用命令集：\n\n```php\nswitch\
  \ ($user_input) {\n    case (“date”):\n        print “<pre>Here’s the output of\
  \ your command:\\n”;\n        passthru (“usr/bin/date”);\n        print “</pre>\\\
  n”;\n        break;\n    case (“ifconfig”):\n        print “<pre>Here’s the output\
  \ of your command:\\n”;\n        passthru (“usr/sbin/ifconfig”);\n        print\
  \ “</pre>\\n”;\n        break;\n    default:\n        print “Unknown command <b>$user_input</b>.\
  \ Please try again.\\n”;\n}\n```\n\n331\n\n#### 转 SQL 查询\n\n正如我们在第 9 章“表单与用户交互”中讨论过的，每当你使用用户数据生成查询时，都存在作剧的可能性。处理这个问题有两种，取决于你处理的数据类型。\n\
  \n第一种技术是使用 `addslashes()` 函数确保任何字符数据都被转义。然而，`addslashes()` 只作用于字符数据（即包含在单引号内的数据）。\n\
  \n非文本字段（例如，数值类型）的用户数据通常不包含在引号中。它们可能包含，但这样做并不建议，因为这迫使 RDBMS 将字符串转换为其对应的类型。\n\n在这种情况下，PHP\
  \ 的 `is_numeric()` 函数大有用处。该函数并不要求你的变量必须是整数或浮点数（如 `is_int()` 和 `is_float()` 函数），而是检查变量的内容是否看起来像数字。如果变量包含非数字内容，`is_numeric()`\
  \ 将返回 False。\n\n你可以使用第二种技术来确保未转义的数值数据无法包含 SQL 命令：只需将变量强制转换为 `int` 或 `float` 类型。因此，如果你有一个脚本使用名为\
  \ `$foo` 的包含外部来源不可信数据的变量来生成查询，你会写：\n\n```php\n$sql = “SELECT users WHERE userid\
  \ = “ . (int)$foo;\n```\n\n这样一来，如果某些恶意用户在表单字段 foo 中输入 **; DELETE FROM users**，`$sql`\
  \ 变量的内容将变为：\n\n`SELECT FROM users WHERE userid = 0`\n\n虽然这可能无法得到正确的结果，但它不会干扰任何合法的查询（即用户没有成功在你的变量中输入某些作剧性文本的查询），并且你可以确定实际上向数据库发送查询时，不会执行任何恶意\
  \ SQL。\n\n332\n\n\n\n你可以同时使用 `is_numeric()` 和类型转换来编写一个相当无懈可击的脚本。通过测试 `is_numeric()`\
  \ 的返回值，你能够捕获任何格式错误的数据——然后，比如，向日志文件写入包含当前用户信息的错误消息，这样你就能对这些不当行为进行永久记录。通过使用类型转换，你可以确保恶意的\
  \ SQL 命令无法渗透到数据库，即使某些极其高明的攻击者发现了如何欺骗 `is_numeric()` 函数。\n\n![Image 52](img/index-358_1.jpg)\n\
  \n## 第 11 章\n\n### 会话 (Sessions)\n\nHTTP 是一个完全无状态的协议。互联网大部分使用它作为通信媒介。因此很容易推推出，互联网的大部分都是无状态的。这并不是什么新发现，也不是什么无意之外的副作用或某些不可预见的障碍。HTTP\
  \ 被设计为一种通用协议，可以轻松地用于 Web 服务器之外。它也是一种简单且易于观察运行情况的协议。考虑到 HTTP 的所有优点，仍然有一个明显的领域是一个小缺点：无法通过\
  \ HTTP 维持用户从一个请求到另一个请求的操作。该协议不会保留关于请求的任何种状态信息；它只是简单的忘了。\n\n然而，在 HTTP 的世界里一切并非不可救。有很多方法可以回避它的局限性。\n\
  \nPHP 提供了几种机制为无状态的 HTTP 世界提供状态。本章是关于会话的，所以很容易猜到，会话就是我们将我们维持状态机制的工具。\n\n另一种在 HTTP\
  \ 中维持状态的非常简单的方法是 Cookie。在直接学习会话之前，让我们详细介绍一下 Cookie 及其用途。\n\n### Cookie\n\n过去每个人都喜欢\
  \ Cookie；但现在有了不是来自烤箱的 Cookie（饼干），这个词已不再那么受大众欢迎了。计算机 Cookie 往往被误解并被认为是危险的，但 Cookie\
  \ 是无害的。无论以什么方式、形状或形式，Cookie 都无法扫描用户的硬盘、窃取信用卡号、抢劫银行或进行任何其他不法行为。`cookie` 仅仅是服务器请求存储在客户端的一个值。大多数浏览器实现将\
  \ Cookie 保存为较小的纯文本文件。单个 Cookie 可以被视为一个键值对。一旦在客户端机器上设置了 Cookie，它会在客户端随后的每个请求中返回给服务器。\n\
  \n不知情的用户可能担心 Cookie 会以某种方式向整个世界开放他们的系统，暴露他们的隐私信息。情况绝非如此；Cookie 是构建在 HTTP 中的一种无害机制，用于维持两个请求之间的状态数据。有很多规则规定\
  \ Cookie 的工作方式。需要记住的最点是，Cookie 并不是邪恶的，也不会毁灭世界。\n\n**334**\n\n## 第 11 章\n\n### 会话\
  \ (SESSIONS)\n\n遗憾的是，由于实际限制，Cookie 并不是 Web 应用状态管理烦恼的答案。Cookie 的数量以及它们允许在客户端系统中存储的数据量各异，因此是不可的。除了这种变异性，Cookie\
  \ 通常只持有少量数据。大多数 Web 浏览器允许的 Cookie 最大数量通常在 300 个左右，每个域名仅限 20 个。由于这些限制，Cookie 显然变成了处理状态的一种非优方式。\n\
  \nCookie 仍然是在客户端机器上维持少量状态数据的一种有效方法。\n\n在本章的后半部分，我们将介绍如何使用 Cookie 传播会话的方法。现在，我们将深入研究\
  \ Cookie 的内部。PHP 确实提供了一个比接将讨论的 `header()` 函数更高级的 Cookie 接口。但对所工作环境有低层次的理解，有助于在问题出现时提供处理问题所需的工具——而问题总会有显现的时候。\n\
  \n### 传输 Cookie 数据：header() 函数\n\nPHP 提供了一个简单称为 `header()` 的函数，它提供了一种设置 HTTP 头部信息的方法。接触\
  \ HTTP 头部有多种原因。其中一个原因就是处理 Cookie。\n\n`int header(string string [,, bool replace])`\n\
  \n如前所述，Cookie 设置在 HTTP 头部中，因此通过这个低级的 `header()` 命令，如果我们选择的话，就可以完全管理 Cookie。假设我们想做一些非常简单的事情，比如跟踪特定用户发出的请求数。这可以使用\
  \ Cookie 轻松实现；请阅读列表 11.1。\n\n**列表 11.1：第一个 Cookie**\n\n```php\n<?php\n// 如果 cookie\
  \ 已经设置，则将其加 1；否则初始化为 1\nif(isset($_COOKIE[\"tracker\"])) {\n    $tracker = ++$_COOKIE[\"\
  tracker\"];\n} else {\n    $tracker = 1;\n}\n// 日期必须符合这种格式\n$expires_soon = date(\"\
  l, d-M-y H:i:s\", time() + 54000);\n// 只有当 cookie 尚未被设置时才设置过期日期\nheader(\"Set-Cookie:\
  \ tracker=$tracker; expires=$expires_soon;\");\n?>\n\n<html>\n<head>\n<title>第一个\
  \ Cookie</title>\n</head>\n<body>\n<?php\necho \"<p>\";\necho \"你已经访问此页面 \" . $tracker\
  \ . \" 次了。\";\necho \"</p>\";\n?>\n</body>\n</html>\n```\n\nCOOKIE\n\n**335**\n\n\
  只要你的浏览器接受 Cookie，现在对此页面的每次访问都应该被跟踪。Cookie 有一些问题可能会阻止其正常工作；然而，绝大多数互联网客户端在运行这里概述的代码时应该不会遇到困难。在后台，Cookie\
  \ 是由服务器设置的；响应可能像这样：`Cookie: tracker=12`。现在终于在客户端和服务器之间创建了某种状态。Set-Cookie 头部参数用分号分隔。需要注意的是，你可以通过关联数组\
  \ `$_COOKIE` 访问 Cookie。\n\n列表 11.1 有几个值得注意的地方。首先，将 cookies 赋值给变量 `$cookies`。如果 cookie\
  \ 已经设置，则增加其值。如果 cookie 尚未设置，则应将其初始化为 1，因为对页面的访问是第一次。接下来，创建 `$expires_soon` 变量，使用\
  \ `date()` 函数。`date()` 函数的原型如下：\n\n`string date(string format, int [timestamp])`\n\
  \n如果没有使用 `date()` 函数的可选第二个参数，则使用当前的服务器时间。`timestamp` 是 Unix 时间戳（自 1970 年 1 月 1 日\
  \ 00:00 以来的秒数）。在这种情况下，我们调用 `time()`，它返回一个 Unix 时间戳。在当前时间戳加上 54000 秒（即 14 小时）。意图是在创建\
  \ 14 小时后使其过期。\n\n`int time(void)`\n\n接下来，设置 Cookie 并过期日期设为 14 小时后。如果 14 小时内未访问页面，计数将重置。就是这样！刷新页面几次，确保计数正在增加。\n\
  \n**336**\n\n### 会话 SESSIONS\n\n另一个经常需要的任务是清除所有 Cookie。在开发过程中，清除任何已设置的 Cookie 通常非常有用。列表\
  \ 11.2 展示了如何这样做：**列表 11.2：清除所有 Cookie**\n\n```php\n<?php\n$old_date = time() - 50400;\n\
  // 消除我们设置的所有 cookie\nforeach($_COOKIE as $cookie => $cookie_value)\n```\n\n\n\n\n\
  \n```php\nheader(\"Set-Cookie: $cookie=die; expires=$old\\_date;\");\n\n?>\n```\n\
  \n关闭 cookie 非常简单，只需设置一个过期日期在过去的 cookie 即可。只要该日期足够久远——无论是几年前还是几分钟前——cookie 就会过期，这意味着它将失效并被移除。如果设置\
  \ cookie 时没有指定过期日期，它将只存在到用户浏览器关闭为止。\n\nCookie 的底层实现并不是我们真正关注的；这只是对 cookie 如何工作的一点简要介绍。cookie\
  \ 大多数糟糕的细节都由 PHP 隐藏了，这很有道理。通过使用 PHP 函数让自己从 cookie 的细节中解耦出来，使得我们的代码最终更具移植性和灵活性。如果\
  \ cookie 的 RFC 发生变化，可能只需要更改 PHP 函数，而大多数代码可以像现在继续运行。\n\n**注意**\n\n关于 HTTP 的更多信息，请查看\
  \ `RFC 2616`：www.ietf.org/rfc/rfc2616.txt。关于 cookie 的更多信息，请参阅 `RFC 2965`：ftp://ftp.isi.edu/in-notes/rfc2965.txt。\n\
  \n### 设置 Cookie：setcookie() 函数\n\n`setcookie()` 函数是处理为我们创建 cookie 的 HTTP 头的 PHP\
  \ 函数。从现在起，它将作为 PHP 中与 cookie 交互的标准方法。`setcookie()` 的原型如下：\n\n```php\nint setcookie\
  \ (string name [, string value [, int expire [, string path [, string domain [,\
  \ int secure]]]]]]]]\\])\n```\n\n显而易见，cookie 比我们目前这些示例要复杂一点。\n\n`setcookie()` 函数中有几个重要的参数。第一个选项\
  \ `name` 是 cookie 的名称。接下来是 `value` 参数，它是与名称关联的值。过期时间是一个 Unix 时间戳；这些可以使用 PHP 的日期时间处理函数轻松创建。最后三个选项有助于微调对\
  \ cookie 的访问——换句话说，就是客户端实际上向哪里发送 cookie。cookie 的 `path` 指明允许使用 cookie 的目录。\n\ncookie\
  \ 路径和 URL 路径必须匹配。`domain` 告诉客户端 cookie 在哪些域名下有效。最后是 `secure` 参数，当设置为 `True` 时，告诉客户端仅在客户端和服务器之间建立安全通信通道时才发送\
  \ cookie。\n\n**COOKIES - 337**\n\n**注意**\n\n技术上，`secure` 参数被用作布尔值，尽管 PHP 文档将其列为\
  \ `int`，且函数原型（在 PHP 源代码中）实际上列为 `string`！无论如何，它都会转换为布尔值。`setcookie()` 的最后四个参数是可选的。特别是\
  \ `path` 和 `domain` 字段对于限制 cookie 的访问非常有用。HTTP 状态管理 RFC 要求任何属于特定域名的 cookie 只能向该域名的请求发送。如果域名以点开头，则它将匹配该点左侧的任何内容。例如，如果\
  \ cookie 域名为 `.foo.com`，那么 `bar.foo.com` 以及 `hello.world.foo.com` 都被允许看到 cookie。这在负载均衡环境中非常有用，因为在那里前缀子域名通常非常不同。\n\
  \ncookie 的 `path` 参数指定了可以看到 cookie 的目录。如果目录是 `/`，则服务器上的所有目录都可以看到该 cookie。然而，如果 cookie\
  \ 是 `/MasteringPHP`，那么只有该目录及其子目录下的请求才能看到 cookie。要查看其实运行效果，请检查列表 11.3。\n\n#### 列表\
  \ 11.3：带有路径的 Cookie\n\n```php\n<?php\n// 仅当 cookie 尚未设置时设置过期日期\nsetcookie(“path\\\
  _cookie”, “visible”, time() + 54000, “/MasteringPHP/\");\n?>\n\n<html\n<head>\n\
  <title>First Cookie</title>\n</head>\n<body>\n<?php\necho “<p>\";\necho “path\\\
  _cookie value is ‘“ . $\\_COOKIE\\[“path\\_cookie”\\] . “‘“;\necho “</p>\";\n?>\n\
  </body>\n</html>\n```\n\n可以通过首先清除所有 cookie，然后将此脚本的路径更改为不在请求中的目录，来验证路径的行为。在这种情况下，在我的服务器上用于调用该\
  \ cookie 脚本的 URL 是 `http://127.0.0.1/MasteringPHP/Chapter11/path\\_cookie.php`。\n\
  \n由于 cookie 中指定的目录是 `/MasteringPHP`，因此脚本可以使用该 cookie。如果目录是 `/OnlyInThisDirectory`，则只有该路径下的脚本才能访问该\
  \ cookie。\n\ncookie 非常简单。除了这里对 cookie 的演示外，还有多值 cookie，它允许将多个值与单个 cookie 关联。然而，在本章讨论\
  \ cookie 的真正目的是使用 cookie 传播会话标识符。\n\n**338**\n\n# 第 11 章\n## SESSION（会话）\n\n###\
  \ 为什么需要 Session？\n\n如之前提到的，使用 cookie 存储应用程序将使用的*所有*状态数据是一个坏主意——可用空间根本不够，而且数据不应该留在客户端。使用\
  \ cookie 仅存储会话标识符，并将所有会话数据存储在服务器或数据库中是最好的方法。坦率说，PHP 4 提供了一系列易使用的会话函数。\n\n#### Session\
  \ 的棘手问题\n\n在处理会话时（泛指 Web 开发以及特定的 PHP）经常会出现几个问题。有些问题并不显而易见，例如在单数据库负载均衡环境下如何工作。另一个棘手问题是需要时如何安全生成。会话的另一个方面是如何在没有\
  \ cookie 的情况下传播。\n\n### 会话标识符传播\n\nSession 最令人痛苦的任务之一就是确保用户按预期保持会话。这被称为会话标识符传播。实现会话标识符传播有两种通用方法：cookie\
  \ 和 URL。\n\n#### Cookie 传播\n\n使用 cookie 传播会话标识符可能是可用最简单、直接的方法。在理想世界中，cookie 是 HTTP\
  \ 中传播会话标识符的最优解决方案。然而，这个计划有一些小折。并不是所有客户端都接受或使用 cookie。如果应用程序必须在没有 cookie 的情况下运行是一个绝对要求，那么必须通过其他方式传播\
  \ session。\n\n#### URL 传播\n\n在这种方法中，URL 本身用于传播会话。会话标识符只需附加到 URL 的末尾，或者作为表单变量传递。虽然这种方法有一些局限性缺点，但它仍然有效。某些搜索引擎会将任何以\
  \ `sessionid=\\[sessionid\\]` 结尾的 URL 视为动态生成的页面，并且索引该页面。绕过此问题的另一种巧妙方法是在 URL 末尾这样附加会话\
  \ ID，如下：`http://x.x.x.x/MasteringPHP/script.php/\\[sessionid\\]`。\n\nApache 仍然知道调用哪个页面，现在搜索引擎也习惯带有会话标识符的页面。在每个页面末尾添加会话标识符的主要问题是确定\
  \ ID 的棘手问题。由于它不是查询字符串的一部分，必须从 URL 的末尾手动提取。这可以使用解析 `$REQUEST\\_URI` 的简单正则表达式来实现。\n\
  \n\n\n\n将 session ID 作为隐藏字段传递在每个表单中。这非常容易忘记 session ID。\n\n一旦丢失了 session ID，用户实际上就会因为没有了会话而处于孤立状态。因为每个链接都必须附加\
  \ session ID，这种方法对程序员来说开销最大；然而，它是可移植性最好的，且无法通过简单地关闭客户端的设置来避免。\n\n## Session ID 的生成\n\
  \nPHP 的 session 函数会自动处理 session ID 的创建。但在某些情况下，能够自己创建会话标识符也是很有用的。这项任务应该以极其谨慎和细心的态度来处理，原因非常简单：只有当生成的\
  \ session ID 在统计学上几乎不可能被猜到时，用户的数据才是安全的。推荐的做法是为随机数生成器设置种子，如下：\n\n```\nsrand((double)microtime()*1000000);\n\
  ```\n\n这是 PHP 官方开发者推荐的方法。在调用任何随机数函数之前，通过这种方式调用且仅调用一次 `srand()`，没有比这更好的种子方法了。接下来，为了生成唯一\
  \ ID，应该使用：`md5(uniqid(rand()))`。\n\n如果可能，最好让 PHP 处理 session ID 的生成；然而，当 PHP 内部产生生成\
  \ session ID 的需求时，这是推荐的方法。\n\n关于 session ID 的传播，还应该考虑最后一点。PHP 中有一个设置可以启用透明传播。当 PHP\
  \ 编译时使用了 `--enable-trans-sid` 选项时，它将会自动以 `session_name=session_id` 的形式附加 session\
  \ ID 字符串。透明性 session ID 传播仅在客户端拒绝 cookie 时使用。在使用此选项的高流量网站上，存在性能考虑因素。PHP 必须检查所有的相对链接并为每个链接附加一个变量；这在性能方面会产生不小的开销。绝对\
  \ URL 不会获得 session ID，因为它们被认为是指向外部站点。在绝对 URL 上附加 session 数据存在着安全风险，因为外部站点可能会被赋予\
  \ session 数据（而这是不应该的）。\n\n## Session 基础\n\n现在是时候检查处理 session 所需的实际代码。首先，我们将介绍创建一个基础\
  \ session。然后将讨论处理 session 变量以及普通 session 的内部细节。\n\n## 创建 Session\n\n同样，在 session\
  \ 方面，PHP 开发者让 Web 开发人员的生活变得更容易了。PHP 原生 session 会通过多种方式寻找 session ID，这使得手动跟踪 session\
  \ 不再那么令人担心。在大多数情况下，让 PHP 处理 session ID 传播细节是最简单且高效的路径。如果应用需求需要更广泛的受众或需要可能无法处理 cookie\
  \ 的特殊客户端，并且你想要控制 session ID 的传播方式，那么就有必要在没有 PHP 帮助的情况下处理这个问题。\n\n除非另有说明，以下所有示例在\
  \ PHP 使用 session 默认配置时均有效。让我们从列表 11.4 开始。\n\n### 第 11 章\n### SESSION\n\n#### 列表\
  \ 11.4：第一个 Session\n\n```php\n<?php\n// 初始化 session\n\nsession_start();\n\n?>\n\n\
  <html\n\n<head>\n\n<title>First Session</title>\n</head>\n\n<body>\n\n<?php\n//\
  \ 如果计数器变量未注册，现在注册它。\nif(!isset($_SESSION[\"tracker\"]))\n{\n$tracker = 0;\nsession_register(\"\
  tracker\");\n}\n// 增加计数器变量\n$_SESSION[\"tracker\"]++;\n\n// 显示到为止的 basic session\
  \ 信息\nprint(\"<br /><br />Tracker = \" . $_SESSION[\"tracker\"] . \"<br />\"); print(\"\
  session_id =\" . session_id() . \"<br />\");\n?>\n\n</body>\n</html>\n```\n\n对 session\
  \ 的初次尝试展示了 session 使用的基本知识。首先，通过 `session_start()` 函数启动 session。通常情况下，将 `php.ini`\
  \ 文件中的 PHP 设置 `register_globals` 设为 `Off` 是一个好主意。这可以防止 session 变量自动在全局命名空间中可用，并让变量的来源变得更加清晰。在使用\
  \ `session_start()` 显式启动 session 后，变量 `$session` 被赋值为指向 `$_SESSION` 关联数组的实际引用。该数组的工作方式与\
  \ `$_COOKIE` 关联数组相同。\n\n你可以从 PHP 脚本的任何地方访问这些变量，无论作用域如何。`$_HTTP_SESSION_VARS` 数组只能在函数内部通过\
  \ `global` 关键字访问。给变量一个数组的引用允许该变量实际上修改 session 变量，而不仅仅是 session 变量的副本。\n\n如果 session\
  \ 变量数组中不存在 `$tracker` 变量，将由此脚本创建。\n\n使用 `session_register()` 将变量添加到 session 中。此函数需要字符串形式的变量名，而不是变量本身。然后对变量进行递增。如果变量已存在，它仍会被递增。最后两行输出当前的计数计数（这实际上就是页面访问的次数），然后是\
  \ `session_id()`，这是一个 32 位的字母数字字符串。到此时，session 已经创建，但我们并没有做什么特别了不起。没什么 cookie 做不到的。\n\
  \n**注意**：`php.ini` 配置中的 `register_globals` 会获取所有的 `GET`、`POST`、cookie 和 session\
  \ 变量并让它们在全局命名空间可用；这在某些情况下可能代表安全问题。最简单的方法是关闭它，并在没有全局变量的情况下工作。\n\n## 存储 Session\n\n\
  session 存储在哪里可能很重要。默认情况下，session 存储在文件系统中。在高性能网站中，所用存储性能可能会成为问题。显然，在高流量网站中处理文件系统不是什么好主意。通常希望使用共享内存甚至数据库来存储\
  \ session 数据。在集群环境中，多个服务器可能运行相同的应用程序。为了创建一个真实的场景，假设我们有三台运行 PHP 的应用服务器和一个数据库服务器。应用服务器为\
  \ A、B 和 C，数据库服务器名为 D。在负载均衡环境中，下一次页面请求可能会落到任何一个服务器上。如果 session 数据存储在 A 服务器的文件系统中，如果客户端下一次请求到达\
  \ B 服务器，将毫无用处。\n\n服务器 B 服务器对该用户的 session 一无所知。用户在这种环境中实际上丢失了他们的 session。\n\n有两种解决方法。“粘性会话”（Sticky\
  \ sessions）意味着在 session 的生命周期内，该用户始终路由到特定的服务器——即启动其 session 的服务器。这种方法如果处理不当，可能会导致某个服务器负载不均衡，因为越来越多的用户最终聚集在该服务器上。抛开缺点不谈，这种方法很常见且效果良好。\n\
  \n\n\n\n\n另一种不需要粘性会话（sticky sessions）的解决方案是使用中央存储库存储会话数据。该存储库通常位于完全独立的服务器上的 SQL\
  \ 数据库。PHP 允许这一点，因为可以实现用户自定义的存储模块。数据库方法为处理负载均衡应用提供了最简洁的方法。使用粘性会话，如果服务器宕机，该服务器上的每个用户都会丢失其会话数据。在冗余和服务器故障转移至关重要的环境中，丢失用户的会话数据等同于违法：你绝对不应该这样做。在\
  \ PHP 中，解决这个问题最简单的方法是直接让负载均衡器进行负载均衡，并使用自定义的会话存储处理器，将数据存储在中心位置。\n\n图 11.1 和 11.2\
  \ 显示了粘性会话和真正的负载均衡会话的流程。在图 11.1 中，会话数据使用文件系统或共享内存存储在每个服务器上。在图 11.2 中，所有会话数据流中央会话数据存储库。\n\
  \n# 第 11 章：会话 (SESSIONS)\n\n## 图 11.1：粘性会话\n粘性会话生命周期\n服务器 A、客户端、服务器 B、来自一个客户端的多个请求、服务器\
  \ C\n\n## 图 11.2：中央存储\n中央存储\n来自一个客户端的多个请求会话数据生命周期\n服务器 A、会话、来自一个客户端的多个请求存储库、客户端、服务器\
  \ B、来自一个客户端的多个请求、服务器 C\n\n## 自定义会话存储\n`session_set_save_handler()` 函数用于定义会话的自定义处理器。此函数需要六个参数，全部都是字符串。每个参数都是一个处理自定义会话存储特定方面的函数。该函数定义如下：\n\
  \n```php\nvoid session_set_save_handler(string open, string close, string read,\
  \ string write, string destroy, string gc)\n```\n\n每个函数执行特定的职责：\n\n### `open(string\
  \ save_path, string session_name)`\n应该调用此函数来实际连接到所需的数据库。它只是一个准备处理会话处理的信号，可能会打开一个用于写入的文件。\n\
  \n### `close(void)`\n在会话关闭时调用此函数。通常在处理数据库时，不使用此函数；我们稍后会说明原因。\n\n### `read(string\
  \ session_id)`\n此函数从指定的存储源读取，并应该返回 PHP 提供的会话数据。\n\n### `write(string session_id,\
  \ session_data)`\n在保存数据时使用此函数。注意，此函数生成的任何输出都*不会*发送到浏览器，并且可能导致函数失败。首次编写此函数时，建议将任何错误或输出记录到文件中，然后查看记录的数据。该函数的两个参数是会话\
  \ ID 以及以及要保存的数据。\n\n### `destroy(string session_id)`\n当会话被销毁时，应该调用此函数；通常这里是针对特定会话\
  \ ID 执行删除 语句的地方。这是用户会话结束的明确信号。在此处可以执行某些操作（例如记录用户会话结束），以供审计。\n\n### `gc(integer maxlifetime)`\n\
  此函数执行垃圾回收，并将移除任何在未被销毁的情况下逃逸的会话。这里的时间戳可以用于删除任何早于给定 `maxlifetime` 的会话。通过这种方式，可以确保过期的会话从存储介质中移除。\n\
  \n在将会话用于身份验证的系统中，当这些会话被移除时，可能意味着采取了其他操作，作为用户会话结束（并已退出系统）的最终确认。\n\n自定义会话存储系统足够灵活，允许在几乎介质上存储会话，唯一的限制是\
  \ PHP 与该介质接口的能力。鉴于 PHP 是开源且易于扩展的，会话可以很容易存储在任何地方。\n\n通常，除非在高流量情况和服务器集群中，否则会话存储不是问题；那时它变成了一个*关键*问题。现在我们已经看到了会话如何被存储，是时候深入研究会话处理以及使用会话的各个方面了。\n\
  \n## 会话选项 (Session Options)\nPHP 在配置文件 `php.ini` 中有很多选项。会话选项控制会话行为的各个方面。\n\n###\
  \ `session.name`\n这只是分配给用于跟踪用户之间会话 ID 的 cookie 的名称。此选项默认为 `PHPSESSID`；通常此设置可以保持不变。如果应用程序由于某种原因已经在使用此\
  \ cookie 名称，可以更改该选项。\n\n### `session.auto_start`\n此选项将为发送到服务器的每一个请求自动启动会话。如果所有用户无论如何都需要会话，则此选项非常有用。取决于应用程序和环境，此选项可能是很有用的，特别是在单个服务器独立运行应用程序的情况下。\n\
  \n### `session.cookie_lifetime`\n这是一个重要的选项，控制 cookie 在客户端机器上的生存时间。`php.ini` 文件中的生命周期以秒为单位。如果生命周期设置为\
  \ 0（默认值），cookie 在浏览器关闭时过期。在某些应用程序中，拥有一个在未来某个很长时间之前不不过期的 cookie 是很有用的。这允许应用程序在一段时间内记住用户。\n\
  \n### `session.serialize_handler`\n这是会话数据在存储之前如何进行序列化的处理器。\n\nPHP 拥有一种紧凑且高效的内部格式，但在所有实际用途中只有\
  \ PHP 知道这种格式。如果编译 PHP 时支持 Web 分布式数据交换 (WDDX)，它就可以以 WDDX 格式序列化数据。在需要对会话数据进行程序操作的情况下，建议使用\
  \ WDDX 格式存储序列化数据。默认是 PHP 处理器，在大多数情况下都是可以接受的。WDDX 支持仅在 PHP 编译时使用 `--enable-wddx`\
  \ 时可用。要将处理器设置为 WDDX，只需用 `wddx` 代替 `php`。\n\n*注意*：\nWeb 分布式数据交换 (WDDX) 是由 Allaire\
  \ 发起的开放格式。它仅仅是一种 XML 格式，用于跨平台共享数据；目前支持 JavaScript、PHP、ASP、ColdFusion、Perl 和 Visual\
  \ Basic。有关 WDDX 的更多信息，请阅读第 15 章“XML 和 XHTML”，或访问 www.openddx.org。\n\n### `session.gc_probability`\n\
  这是在请求时启动垃圾回收程序的概率（百分比）。默认概率为 1%。垃圾回收只是移除所有旧会话数据。频繁调用垃圾回收可能会影响性能。默认值对于大多数用途都是的。\n\
  \n### `session.gc_maxlifetime`\n这决定了数据在会话存储位置多久会被视为旧数据并删除。目前的默认值是 1440 秒（即 24 分钟）。更合理的长度是完整的\
  \ 24 小时，即 86400 秒。会话的垃圾回收发生在会话初始化程序的其他部分之后。如果不经常使用会话，可能会导致某些令人困惑的行为。例如，如果用户启动了会话，然后在\
  \ `gc_maxlifetime` 之后回来，但期间没有其他客户端启动会话，那么该用户的会话数据仍然可用。\n\n### `session.referrer_check`\n\
  \n\n\n\n\n这是一个将在 HTTP 引用来源（referrer）中检查的子字符串。如果未找到该子字符串，发现的会话 ID 将标记为无效。默认值为空字符串。此选项是一个安全功能，有助于防止会话来自其他站点并可能被劫持。该字符串可以是一个域名，以便只允许来自特定域的引用来源。\n\
  \n### `session.entropy_file`\n\n这提供了一个外部文件，在创建会话 ID 时作为额外的熵源。为了在生成会话 ID 时增加熵（随机性），请指定\n\
  \n#### 会话基础\n\n345\n\n你操作系统的熵文件（如果该系统有的话）。例如，在 Red Hat Linux 上，熵文件为 `/dev/urandom`\
  \ 或 `/dev/random`。在大多数 GNU/Linux 系统上，最好使用 `/dev/urandom`。\n\n### `session.entropy_length`\n\
  \n此项指定了从熵文件中读取的数据长度，该选项默认值为 0（意味着读取 0 字节）。合适的读取长度是 512 到 1,024 字节。这个长度确保了随机数据的良好采样。\n\
  \n### `session.use_cookies`\n\n这是一个重要的配置选项，决定了是否使用 Cookie 来传播会话 ID。对于所有允许 Cookie\
  \ 的用户，这是最佳选项。\n\n默认值为 (1)，意味着 PHP 会先尝试使用 Cookie 传播会话 ID，然后再使用其他方法。\n\n### `session.cookie_path`\n\
  \n这对应于本章 cookies 部分中解释的 cookie 路径。该路径用于会话 cookie。\n\n### `session.cookie_domain`\n\
  \n此项指定 cookie 所属的域名。它与 cookie 域相同，但仅适用于会话 cookie。\n\n### `session.cache_limiter`\n\
  \n此项决定了如何控制使用会话的脚本的浏览器缓存。默认值是“nocache”（不缓存）。每个选项都会发送一组不同的 HTTP 请求头，以试图控制页面缓存。虽然并非万无一失，但这些设置仍然很有用。可用值有：“public”、“private”、“nocache”。这些值会修改发送到客户端的、使用会话的页面上的\
  \ HTTP 请求头，以控制缓存。在以下示例中，任何地方看到 `{ *text*}`，`{}` 之间的文本代表一个变量并可能会发生变化。例如，`{session.cache_expire}`\
  \ 代表在 `php.ini` 文件中设置的 `session.cache_expire` 时间。\n\n“nocache”发送以下 HTTP 请求头：\n\n\
  ```\nExpires: Thu, 19 Nov 1981 08:52:00 GMT\nCache-Control: no-store, no-cache,\
  \ must-revalidate, post-check=0, pre-check=0\nPragma: no-cache\n```\n\n“private”发送以下\
  \ HTTP 请求头：\n\n```\nExpires: Thu, 19 Nov 1981 08:52:00 GMT\nCache-Control: private,\
  \ max-age=({session.cache_expire} * 60), pre-check=({session.cache_expire} * 60)\n\
  ```\n\n“public”发送以下 HTTP 请求头：\n\n```\nExpires: {Current Server Time}\nCache-Control:\
  \ private, max-age=({session.cache_expire} * 60)\n```\n\n### `session.cache_expire`\n\
  \n这是缓存会话页面的生存时间（TTL），单位为分钟。它不影响 nocache 限制器。默认时间为 180 分钟。\n\n### `session.use_trans_sid`\n\
  \n此项决定是否使用透明 SID 支持。只有在编译 PHP 时时启用了 `--enable-trans-sid` 才能使用。默认值为 1。\n\n346\n\n\
  ## 第 11 章\n\n### 会话 (SESSIONS)\n\n### `session.save_handler`\n\n这定义了会话保存的位置。它可以设置为“files”（文件）或“user”（用户）。\n\
  \n`session.set_save_handler` 仅在在此选项被设置为 user 时起作用。\n\n### `url_rewriter.tags`\n\n\
  这非常有用，因为它允许在启用透明会话支持时，配置哪些 HTML 标签被写入以包含会话 ID。此选项允许在 HTML 内部用于传播会话 ID 方法具有灵活性。\n\
  \n*提示*\n\n*会话较困难的方面之一是知道使用会话的页面上发送了哪些 HTTP 请求头。*\n\n*在运行会话的脚本中发送的 HTTP 请求头可能是无数小时有趣和沮丧调试的源头。*\n\
  \n*务必检查 PHP 在使用会话的页面上生成的头。*\n\n在使用 PHP 会话实现网站时，仔细检查每个会话选项以满足当前会话需求是一个好主意。这些选项对于会话的运行方式提供了大量的控制和灵活性。\n\
  \n现在你已经看到了控制会话行为的选项，现在是时候回到 PHP 脚本世界，学习更多关于编写使用会话的代码了。\n\n#### 会话函数\n\n正如我们所见，会话的大多数细节都由\
  \ PHP 为我们处理了。本章前面的列表 11.4 说明了会话用用的基础；会话的操作很少比这更复杂或更困难。会话仅仅是将数据从一个请求存储到下一个请求。即使是对象和数组等复杂数据也可以轻松地存储。\n\
  \n#### 删除会话\n\n在当前页面上删除会话可能有点复杂。经验法是必须先启动会话，然后调用 `session_destroy()` 函数。在销毁会话后，应该删除会话\
  \ cookie，以便它不会再次获取到相同的会话 ID。虽然 `session_destroy()` 实际上删除了任何会话数据，但仍需要删除 cookie。\n\
  \n```php\n<?php\n// 必须先启动会话\nsession_start();\n// 清除所有会话变量\nsession_unset();\n//\
  \ 现在销毁会话\nsession_destroy();\n// 接下来删除 cookie\nsetcookie(session_name());\n?>\n\
  ```\n\n会话基础\n\n347\n\n#### 会话与对象\n\n从 PHP 4.0 开始，除了资源（resource）之外任何数据类型都可以序列化并存储在会话中。对象现在会自动序列化，无需担心如何。在处理会话数据时有几个需要考虑的因素。首先是在序列化或反序列化时对象是否需要任何清理或初始化。在反序列化对象的页面上始终记得保留类定义。\n\
  \n#### `__sleep` 和 `__wakeup` 方法\n\n类有两个“魔法”方法。创建一个名为 `__sleep` 或 `__wakeup` 的方法，它将产生特殊作用。`__sleep`\
  \ 方法在对象序列化时被调用；`__wakeup` 方法在会话反序列化时被调用。\n\n*注意*\n\n*当内容被序列化时，它被放入一种易于存储的格式，“字节流”。当我们反序列化时，我们将序列化值转换为\
  \ PHP 可以理解的形式。序列化值在反序列化之前是无法被理解的。*\n\n`__sleep` 方法应用于将任何数据保存到数据库、关闭任何数据库连接，并处理在对象序列化之前需要执行的任务。相反，在对象的反序列化时，`__wakeup`\
  \ 应根据需要重新连接到数据库并重新初始化对象以便使用。\n\n列表 11.5 展示了使用魔法 `__sleep` 和 `__wakeup` 函数的对象。为了确保这两个方法正常工作，必须采取以下几个重要的步骤。\n\
  \n**列表 11.5: `__sleep` 和 `__wakeup` (sleepy.php)**\n\n```php\n<?php\n// 确保在会话启动之前包含类定义\n\
  class sleepy\n{\n    var $status, $counter;\n\n    // 构造函数\n    function sleepy()\
  \ {\n        $this->counter = 1;\n        $this->status = “I’m alive”;\n    }\n\
  }\n```\n\n\n\n\n\n```php\n}\n\n// 每当对象被反序列化时调用 __wakeup\nfunction __wakeup() {\n\
  \    $this->counter++;\n    $this->status = “I’m awake”;\n}\n\n// 每当对象被序列化时调用 __sleep\n\
  function __sleep() {\n    $this->status = “I’m asleep”;\n    // 如果没有返回此数组，对象将不会被序列化\n\
  \    return array(“status”, “counter”);\n}\n\n} // 类 sleepy 结束\n\n// 启动会话\nsession_start();\n\
  \nif(!isset($_SESSION[\"sleepy_obj\"])) {\n    $sleepy_obj = new sleepy;\n    session_register(\"\
  sleepy_obj\");\n}\n?>\n\n<html>\n<head>\n<title>Session 与对象</title>\n</head>\n<body>\n\
  <?php\n$buf = sprintf“Status: %s. Counter: %s.” $_SESSION[\"sleepy_obj\"]->status,\
  \ $_SESSION[\"sleepy_obj\"]->counter);\necho $buf;\n?>\n</body>\n</html>\n```\n\n\
  此脚本中所有操作发生的顺序非常重要。首先，任何已知存储在会话中的对象都需要一个类定义。如果为序列化对象未提供类定义，它将默认为 `stdClass` 对象并丢失其类关联。无疑，这并不是我们想要的效果。请在\
  \ `session_start()` 之前包含类定义，该函数会处理所有的会话数据反序列化。\n\n注意 `__sleep()` 函数返回了一个包含字符串的数组，这些字符串对应于对象的变量名。这个数组必须返回，并且每个应该序列化的变量名都应该包含在该数组中。如果漏掉了某个值，该变量将不会被序列化。此外，在任何情况下都不应在\
  \ `__sleep()` 函数中输出任何数据。PHP 将挂起，并通常表现出不符合生产环境服务器的行为。\n\n除了这些微小的注意事项之外，序列化对象并不困难，而且非常有用。在大多数情况下，甚至不需要\
  \ `__wakeup()` 和 `__sleep()`。在继续讨论会话数据如何存储之前，需要更深入地检查序列化和反序列化。\n\n## 会话序列化/反序列化\n\
  \n数据被序列化为两种不同的格式。一种是 PHP 团队创建的内部格式；另一种是 WDDX。PHP 内部格式是两者中更轻量级的，在大多数情况下都应该使用。然而，WDDX\
  \ 允许不同平台和语言上的应用程序轻松共享数据，使用它作为序列化格式可以实现极大的互操作性。因此，让我们来看一些序列化数据。\n\n要查看序列化会话数据是什么样，请使用\
  \ `session_encode()` 函数将会话输出为序列化字符串。以下代码段被用于生成一个会话：\n\n```php\n<?php session_start();\
  \ ?>\n<head>\n<title>序列化的会话数据</title>\n</head>\n<body>\n<?php echo htmlspecialchars(session_encode());\
  \ ?>\n</body>\n</html>\n```\n\n列表 11.6 显示了这些数据是如何以 PHP 格式被序列化的；列表 11.7 展示了相同数据的\
  \ WDDX 版本。\n\n### 列表 11.6: PHP 格式序列化数据\n`sleepy_obj|O:6:\"sleepy\":2:{s:6:\"status\"\
  ;s:10:\"I’m asleep\";s:7:\"counter\";i:71;}`\n\n### 列表 11.7: WDDX 格式序列化数据\n```xml\n\
  <wddxPacket version='1.0'><header/><data><struct><var name='sleepy_obj'><struct><var\
  \ name='php_class_name'><string>sleepy</string></var><var name='status'><string>I’m\
  \ asleep</string></var><var name='counter'><number>74</number></var></struct></var></data></wddxPacket>\n\
  ```\n\n当然，在存储时，无论种情况下数据都是一个长字符串，但我们可以应用一些格式化来传达包的底层结构。以下是列表 11.6（PHP 数据包）的拆解内容：`sleepy_obj|O:6:\"\
  sleepy\":2:{s:6:\"status\";s:10:\"I’m asleep\";s:7:\"counter\";i:71;}`。这里是列表 11.7（WDDX\
  \ 格式），带有了一些换行和缩进：\n\n```xml\n<wddxPacket version='1.0'><header/><data><struct><var\
  \ name='sleepy_obj'><struct><var name='php_class_name'><string>sleepy</string></var><var\
  \ name='status'><string>I’m asleep</string></var><var name='counter'><number>74</number></var></struct></var></data></wddxPacket>\n\
  ```\n\n粗略一眼这两个数据结构，显而易见的是一种格式较大而另一种更紧凑。一眼看去，一种格式（WDDX）人类很容易理解；另一种则紧凑。初看之下，一种格式（WDDX）对人类来说是容易理解的；另一种则紧凑。拆解\
  \ PHP 格式并不困难，它是纯文本。`sleepy_obj|O:6:\"sleepy\":2:{s:6:\"status\";s:10:\"I’m asleep\"\
  ;s:7:\"counter\";i:71;}` 每一个变量名和数据通过管道符分隔。在管道符之后是类型。在我们情况下可以看到 `O`（这意味着对象）。接下来是晦涩的。`s:6:status`\
  \ 表示“我有一个长度为 6 的字符的变量 status。”然后 PHP 知道下一个存储的是 `status` 的值。`counter` 也是如此。在大括号内部，`sleepy_obj`\
  \ 表示只存储了两个字段，但显然有四个字段。这是因为其中两个“字段”是名称。`type:value` 用于整数。然而，我们实际上并不关心这种格式，因为它是 PHP\
  \ 内部的并且可能会更改。我们在这里解释它的主要目的是为了它是可读的，如果人类知道看什么。另一方面，WDDX 格式是一个有效的 XML 包。我们实际上可以将包输出为\
  \ XML 文档；列表 11.8 展示了如何这样做。图 1.3 显示了 Internet Explorer 中的包。\n\n### 列表 11.8: 将序列化的会话数据输出为\
  \ XML\n```php\n<?php\nheader(\"Content-Type: text/xml\");\nsession_start();\nprint(\"\
  <?xml version='1.0'?>\");\nprint(session_encode());\n?>\n```\n\n只要在 `php.ini` 配置文件中将\
  \ `session.serialize_handler` 设置为“wddx”，输出格式将 WDDX。列表 11.8 假设序列化处理器是 WDDX。图 1.3\
  \ 展示了 Internet Explorer 显示代表会话数据的 XML 文档。\n\n图 1.3: Internet Explorer 显示序列化的会话数据\n\
  \n存储在数据库中的 WDDX 序列化会话数据可能代表了最易的存储介质和会话序列化格式。这两种结合允许在各种平台上轻松操作任何会话数据。然而，在大多数情况下，PHP\
  \ 格式是更好的选择，更说更紧凑。随着使用会话的应用程序增大，几个以前未考虑的因素可能会显现。需要大量的用户结合高流量，才会使会话序列化格式成为问题；然而，任何性能损失，无论多小，都会产生影响。\n\
  \n这里介绍的关于会话序列化/反序列化的信息并不经常用到。会话序列化和反序列化应该主要是一个黑盒，你不应该需要担心内部格式。但如果你由于某种原因*不得不*处理会话数据，知道你正在面对的是什么总是重要的。\n\
  \n\n\n\n\n在线购物车可能是演示会话（sessions）最常见的应用之一。\n\n有了了会话，购物车的操作就变得轻而易举。购物车的基本概念非常容易理解：它是销售单个商品的网站用户用来追踪他们想要购买的商品的一种方式。\n\
  \n我们将此购物车设计为面向对象的模式。从现实世界中购物车的角度考虑，我们在购物车上执行了若干项操作。购物时，我们执行的最明显的操作之一是将特定数量的某个商品放入购物车。下一个最明显的操作是从购物车中取出某物并将其放回架子上——即从购物车中删除整件商品。另一个是修改特定商品的数量（噢，我只需要一台\
  \ Sun Enterprise 10000 服务器）。\n\n现实中的购物车和在线购物车之间也存在差异。在电子世界中，我们拥有的一个选项是对购物车中所有物品进行持续运行的小计计算。严格来说，现实世界中的购物车并不具备结账功能，因此我们的在线购物车也不具备该功能。购物车仅仅存储用户携带的内容。（尽管结账是每家在线商店都需要的操作，但为了保持演示简单，我们将将其留给另一个应用程序。）最后一个选项是完全完全清空购物车中物品的方法。在现实世界中，把所有东西倒出来并重新开始可能会迅速引起店经理的愤怒；而在电子世界中，计算机并不在乎，只是继续整理这些混乱即可。\n\
  \n在实际应用中，库存将存储在数据库中。然而，对于一个功能完整的购物车来说，这并不是必要的，因为我们的购物车是基于会话的。\n\n## 购物车考虑\n\n基于会话的购物车的一个缺点是，用户可能会请求某种数量的商品，但该数量可能可用。例如，当用户将商品\
  \ `Foo` 添加到购物车时，库存中有 27 个。那么我们知道，用户拥有的 `Foo` 永远不会超过 27 个——而且谁需要几个 `Foo` 以上呢？但请考虑：如果只剩下三个\
  \ `Foo` 了，而用户想买五个呢？在一个每一步操作都会检查数据库的购物车中，很容易让用户知道他们请求的商品过多。然而，在我们的情况下，大多数的购物车验证必须在购物车之外发生，最可能是在结账程序中。\n\
  \n最初将购物车建立在会话上的主要原因是会话提供的卓越性能。不需要访问数据库——只需快速存储用户的会话数据，我们就可以跟踪用户所有的购物车物品。严格使用数据库存储购物车数据的系统，其性能往往太低，无法在高并发环境中工作。\n\
  \n在纯会话和纯数据库之间通常可以达成平衡或混合模式。例如，当用户将物品添加到购物车中时，可以将他们想要添加的数量与可用数量进行比对，如果超过了库存量，则可以通知他们。在结账程序中仍然可以执行许多其他操作；这只是使用数据库处理购物车的某些关键方面的一个例子。另一种替代方案是直等到用户结账时不通知他们，这可能会导致用户的挫败感。\n\
  \n## 会话基础\n\n353\n\n### 购物车考虑\n\n基于会话的购物车的一个缺点是，用户可能会请求某种数量的商品，但该数量可能可用。例如，当用户将商品\
  \ `Foo` 添加到购物车时，库存中有 27 个。那么我们知道，用户拥有的 `Foo` 永远不会超过 27 个——而且谁需要几个 `Foo` 以上呢？但请考虑：如果只剩下三个\
  \ `Foo` 了，而用户想买五个呢？在一个每一步操作都会检查数据库的购物车中，很容易让用户知道他们请求的商品过多。然而，在我们的情况下，大多数的购物车验证必须在购物车之外发生，最可能是在结账程序中。\n\
  \n最初将购物车建立在会话上的主要原因是会话提供的卓越性能。不需要访问数据库——只需快速存储用户的会话数据，我们就可以跟踪用户所有的购物车物品。严格使用数据库存储购物车数据的系统，其性能往往太低，无法在高并发环境中工作。\n\
  \n在纯会话和纯数据库之间通常可以达成平衡或混合模式。例如，当用户将物品添加到购物车中时，可以将他们想要的数量与可用数量进行比对，如果超过了库存量，则可以通知他们。在结账程序中仍然可以执行许多其他操作；这只是使用数据库处理购物车的某些关键方面的一个例子。另一种替代方案是直等到用户结账时不通知他们，这可能会导致用户的挫败感。\n\
  \n354\n\n### 实现\n\n**列表 1.9 在线购物车**\n\n```php\n<?php\nclass cart\n{\n    var $items;\n\
  \    var $sub_total;\n\n    function cart() {\n        $this->items = array();\n\
  \        $this->sub_total = 0;\n    }\n\n    function add_item($item_id, $qty, $item_price)\
  \ {\n        // 购物车中的物品\n        if(isset($this->items[$item_id]))\n        {\n\
  \            // 添加物品到购物车\n            $this->items[$item_id] = $qty;\n         \
  \   $this->sub_total += $qty * $item_price;\n        }\n        else\n        {\n\
  \            // 更新物品\n            $this->items[$item_id] = $qty;\n            $this->sub_total\
  \ += $qty * $item_price;\n        }\n    }\n\n    function modify_qty($item_id,\
  \ $new_qty, $item_price) {\n        // 修改数量\n        $prev_qty = $this->items[$item_id];\n\
  \        $qty_diff = $prev_qty - $new_qty;\n        $this->items[$item_id] = $new_qty;\n\
  \        // 计算小计\n        $this->sub_total += $qty_diff * $item_price;\n    }\n\n\
  \    function delete_item($item_id) {\n        // 从购物车中删除物品\n        $this->sub_total\
  \ -= $this->items[$item_id] * $item_price;\n        unset($this->items[$item_id]);\n\
  \    }\n\n    function num_items() {\n        // 计算物品总数\n        $total_items =\
  \ 0;\n        foreach($this->items as $item_id => $item_data)\n        $total_items\
  \ += $item_data;\n        return $total_items;\n    }\n\n    function clear() {\n\
  \        // 清空购物车\n        $this->items = array();\n        $this->sub_total = 0;\n\
  \    }\n\n} // 结束类 cart\n?>\n```\n\n355\n\n### 实现\n\n当购物车实例化时，*items* 数组将被初始化并留空，当前的\
  \ *sub_total* 也留空。这些都是通过购物车构造函数完成的。\n\nvoid **add_item**(string item\\_id, int qty,\
  \ int item\\_price)\n\n`add_item()` 函数是一个简单的方法，用于将物品添加到购物车。我们只需要物品 ID、数量和价格。\n\n\
  void **modify_qty**(string item\\_id, int new\\_qty, int item\\_price)\n\n`modify_qty()`\
  \ 方法允许修改物品的数量。它只是将 *item\\_id* 的当前数量设置为新提供的数量。\n\n\n\n\n\n`void delete_item(string\
  \ item_id)`\n\n此方法从购物车中删除一个项目；只需要项目 ID。它还会重新计算不包含该项目的新总额。该函数之所以简单，是因为我们为每个 `item_id`\
  \ 都维护了当前的总费用。\n\n`int num_items()`\n\n`num_items()` 不需要参数，并返回一个整数。返回的值是购物车中项目的总数。\n\
  \n`void clear()`\n\n`clear()` 方法只是清空购物车中的所有内容。没有参数，没有返回值。\n\n这就是我们购物车的所有功能了。我们可以添加项目、修改特定项目的数量、移除项目并获取有关购物车的简要信息。这满足了简单购物车的所有要求。请参见列表\
  \ 11.10 中的购物车使用示例。\n\n**列表 11.10：购物车测试**\n\n```php\n<?php\nrequire_once(\"cart.php\"\
  );\nsession_start();\nif(!isset($user_cart))\n{\n$user_cart = new cart;\nsession_register(\"\
  user_cart\");\n}\n$user_cart->add_item(1, 3, 5);\n$user_cart->add_item(2, 7, 10);\n\
  $user_cart->add_item(3, 4, 7.5);\n$user_cart->modify_qty(2, 3, 10);\n$user_cart->delete_item(3);\n\
  $total_items = $user_cart->num_items();\n?>\n\n<html>\n<head>\n<title>Shopping Cart\
  \ Test</title>\n</head>\n<body>\n<table>\n**356**\n## 第 11 章\n### 会话 (SESSIONS)\n\
  <tr><td>购物车</td></tr>\n<tr><td>项目数量: <?php echo $total_items ?></</td></tr>\n<tr><td>小计费用:\
  \ <?php echo $user_cart->sub_total; ?></td></tr>\n</table>\n</body>\n</html>\n```\n\
  \n在考虑使用会话（sessions）时，有必须考虑并进行权衡的优点和缺点。会话是一种在不产生数据库所有开销的情况下维护有状态数据的方法。在某些情况下，绝对需要访问数据库，但\
  \ session 可以让问题变得简单得多。在某些情况下，让 session 执行某些操作（如结账）显然是不合逻辑的。\n\n通常，结账过程涉及访问数据库。\n\
  \n这结束了关于会话的章节。正如你所学到的，会话和 Cookie 是在名为 HTTP 的无状态协议中维护状态的合合适方法。\n\n![图像 54](img/index-382_1.jpg)\n\
  \n## 第 12 章\n### 安全\n\n保护网站安全有许多方面。列表从设置加密连接、对存储数据进行加密、设计身份验证和授权方案，以及审计、日志记录和使用监控开始，并不断扩展。如果你正在创建一个涉及敏感信息交换的\
  \ Web 应用程序，事实是你必须处理这些中的每一个问题。\n\n例如，为了创建一个允许用户进行财务交易的网站——无论是在竞拍二手地毯还是在纳斯达克购买股票——你都需要设置：\n\
  \n◆ 允许他们登录你网站的身份验证机制\n◆ 确保只有经过适当授权的用户才能访问或更新敏感数据的授权程序\n◆ 数据加密程序，允许你安全地存储额外信息（如信用卡号）\n\
  ◆ 审计程序，降低虚假否认的风险（即用户在事后虚假声称他们没有参与过某项交易）\n◆ 日志记录程序，记录使用信息以便通过分析检测恶意用户的错误行为模式\n◆ 告警管理员恶意用户行为的监控工具\n\
  ◆ 允许用户安全传输私有或敏感数据的加密连接。而且即便如此，你的工作仍未完成——为了提供任何真正的安全性，你必须审计运行在你的服务器上的所有其他软件的安全性，以确保它们也没有漏洞。\n\
  \n解决所有这些问题超出了本书的范范围，但我们将介绍如何使用 PHP 对用户进行身份验证和授权，以及 PHP 内置的加密支持如何帮助你保持网站安全。\n\n**358**\n\
  ## 第 12 章\n### 安全 (SECURITY)\n### 用户身份验证\n\n身份验证（Authentication）是确保用户确实是他们所称身份的过程。这是编程中的一个常见问题，它为\
  \ Web 应用程序带来的问题与几十年来它给程序员们带来的问题并没有太大区别。\n\n当你对一个用户进行身份验证时，你通常会询问他们 1) 他们是谁以及 2)\
  \ 提供一些证明他们确实是那个人的证据。这种证明被称为凭据（credential），它可以以许多形式存在。最常见的凭据是只有（希望）所有者知道的秘密密码。另一种日益流行的替代方案是数字证书，它可以安装在用户的浏览器中，并作为真实的、不可否认的身份证明呈现。\n\
  \n*注意*\n数字证书目前显然还没有普及，而且设置 Web 服务器使用安全的数字证书超出了本书的范范围。如果你需要这种程度的安全性，请查阅你服务器软件的文档。\n\
  \n当你决定是否以及如何对用户进行身份验证时，你需要针对你的 Web 应用程序的性质问自己一些基本问题：\n\n◆ 我需要多大的安全性？\n◆ 我能负担得起多大的安全性？\n\
  ◆ 我可以使用什么类型的身份验证机制？\n◆ 我的网站的哪些部分需要安全保护？\n\n遗憾的是，你想要的安全性与你实际能负担得起的安全性之间总是存在权衡。为 Web\
  \ 应用程序实现安全系统可能会花费大量的时间和金钱，虽然安全性越高越好，但它并不总是可行的。换句话说，你的服务器永远不会是安全的；如果你非常勤奋，它只会是足够安全。\n\
  \n话虽如此，不要将成本问题作为忽视安全问题的借口。从长远来看，在系统安全上花费太少可能比花费太多代价要贵得多。如果有人闯入你的服务器并肆意破坏客户数据，可能会让你失去工作，甚至更糟，失去你的业务。\n\
  \n你选择的身份验证机制也将取决于用户群的性质。\n\n取决于他们是谁、来自哪里以及有多少，你可能想要使用服务器内置的身份验证机制、某些涉及客户端证书和证书机构的特殊机制，或者你可能想要使用表单和会\
  \ 密钥“自制”一套身份验证方案。\n\n### 什么时候需要身份验证？\n\n除非你极其好奇或者正在运行一个非常敏感的网站，否则你可能不需要一直担心安全性（包括知道用户的身份）。只有当你担心他们正在做什么时，你才需要知道用户的身份。\n\
  \n例如，在在线购物网站的每个页面都使用 SSL 加密可能是过度了。虽然你确实需要为处理信用卡号设置一个安全的服务器，但并不处处使用加密。这样做会给你的 Web\
  \ 服务器带来不必要的负担（因为提供加密页面比未加密页面需要更多资源）。\n\n用户身份验证 (AUTHENTICATING USERS)\n\n**359\n\
  同样，你通常不应该在绝对必要之前强制用户进行身份验证。\n\n执行身份验证检查不仅会减慢你的 Web 服务器速度，还会给你的用户带来不必要的负担。毕竟，为什么要为了浏览产品目录就让他们停下来输入用户名和密码呢？\n\
  \n另一方面，每当用户尝试执行会影响你的 Web 应用程序状态的操作时，你（可能）需要知道他们是谁。\n\n考虑一个基于 Web 的内容管理系统，即允许网站管理员将文档和图像上传到网站并控制这些文档在网站上的显示方式的系统。你可能有允许用户修改文档外观的界面：\n\
  \n◆\n\n\n\n\n\n编辑表单，管理员用户可以通过它来修改文档的内容。\n\n反馈表单，任何用户都可以对文档发表评论。有些人可能对于在文档中添加评论是否构成了网站状态的重大更改而存在分歧，但你可能很难找到有人认为编辑文档本身不是一项严谨的操作。因此，在允许用户访问编辑表单之前，你可能希望强制他们使用用户名和密码登录。另一方面，匿名读者可能应该被使用反馈表单发表评论；没有必要强制他们提前登录。\n\
  \n需要考虑的一点点是，对于许多人来说，登录表单会让人感到阻碍。毕竟，他们并不是真的想登录你的网站；他们是想*使用它*。因此，作为一条通用规则：除非你运营的是\
  \ `nytimes.com` 站点并且有足够的资本要求访客为了阅读新闻而填写登录表单，否则在要求身份验证时，越懒惰越好。\n\n## 选择身份验证方案\n\n\
  一旦你决定是时候询问用户他们是谁了，你就需要决定如何提问。目前实际上只有两种可行选择：基于 HTTP 的标准身份验证机制，或者你完全使用 `PHP` 和 `HTML`\
  \ 表单编写的应用程序级身份验证机制。\n\n除此之外，还有两种可能性：客户端证书和 HTTP 摘要认证（Digest authentication）。\n\n\
  然而，这两者都不成熟到可以使用的程度。HTTP 摘要 特别有趣，因为它允许服务器在不发送明文密码的情况下验证客户端。\n\n遗憾的是，它支持的浏览器不够多，因此尚不可——至少目前还不是。\n\
  \n**提示**\n\n*欲了解所有 Web 身份验证方案的良好概述，请参阅 Kurt Seifried 在 `www.seifried.org/security/www-auth/`\
  \ 的白皮书。*\n\n## 使用 HTTP 验证用户\n\n基本的基于 HTTP 的身份验证机制依赖于用户浏览器内置的功能，以及可选的你的 Web 服务器功能。基础\
  \ HTTP 身份验证使用简单的挑战与响应机制从用户处获取凭据。当用户请求一个受基础 HTTP 身份验证保护的页面时，服务器会在其 HTTP 响应头中返回挑战：`WWW-Authenticate:\
  \ Basic realm=”secret-area”`\n\n```\nHTTP/1.0 401 Unauthorized\n```\n\n![Image 55](img/index-385_1.png)\n\
  \n### 第 12 章：安全\n\n这对浏览器来说意味着：请随上正确的凭据（在这种情况下为用户名和密码）重新提交你的请求，以访问“secret-area”域。（域的名称是任意的；你可以随心所欲，但你应该选择一个描述性的名称，以指示用户使用这些凭据能够访问的资源集。）面对此响应，浏览器会弹出一个如图\
  \ 12.1 所示的登录窗口，以便用户可以尝试应对挑战。\n\n**图 12.1**\n一个 HTTP 基础身份验证窗口。\n\n一旦用户在弹出窗口输入了他们的凭据（即用户名和密码）并点击确定，浏览器将重新提交其原始请求，并带上指定用户凭据的额外\
  \ HTTP 头：\n\n```\nAuthorization: Basic Y2hhcmxpZToqKipsa2o7YWtsajtsams=\n```\n\n\
  头的最后部分是用户在浏览器弹出窗口中输入的用户名和密码的 base64 编码版本。解码后的版本类似于：`Authorization: Basic my_username:my_password`\n\
  \n**警告**\n\n*不要将“编码”与“加密”混淆。解码字符串是一项轻而易举的任务；例如，在 `PHP` 中可以使用 `base64_decode()` 函数在一行内完成。*\n\
  \n如果服务器接受了用户的凭据，浏览器就会“记住”它们；从那时起直到某个预定的未来时间，每当服务器对该域发送身份验证挑战时，浏览器都会用用户的凭据响应。（否则，你每次请求该域中的受保护页面时都要输入用户名和密码！）这有一个不幸的副作用是，浏览器会在每次请求时发送用户的登录信息；这使得窃听者很容易捕获登录信息，因为密码不断以未加密的形式在网上传输。\n\
  \n**注**\n\n*图 12.1 中的复选框是 Internet Explorer 特有的功能，它的作用“超出”了大多数浏览器的常规凭据记忆功能。IE 提供的功能是永久记住你的凭据；每当你返回这个受密码保护的“域”时——无论是五分钟后还是五个月后——`IE`\
  \ 都会自动向服务器提交你的 HTTP 用户名和密码。这不是通用行为，尽管它变得越来越常见。在许多浏览器中，HTTP 身份验证凭据的有效期是当前会话期间，这可能意味着浏览器的寿命（即直到你退出浏览器）或直到你离开网站。*\n\
  \n基础 HTTP 身份验证在服务器端的具体工作原理取决于你如何设置它以及你使用的 Web 服务器和操作系统。你的选择是依靠 Web 服务器对 HTTP 身份验证的支持，还是编写一个管理\
  \ HTTP 身份验证过程的 `PHP` 脚本。两者的主要在于，对于基于 `PHP` 的解决方案，你对如何验证用户有更多控制权——表现为决定用户名和密码存储在哪里以及如何查找它们。\n\
  \n例如，在运行 Internet Information Server 5.0 的 Windows 机器上使用内置的基础 HTTP 身份验证支持，服务器通常会尝试检查用户名/密码是否对应有效的\
  \ Windows 用户帐户。\n\n**注**\n\n*若要从 IIS 5.0 开启基础身份验证，只需启动服务管理器，找到你想要保护的文件或目录，并使用属性对话框中的文件安全（File\
  \ Security）或目录安全（Directory Security）选项卡来更改其权限。（你必须禁用匿名访问并启用基础身份验证选项。）* 使用 Apache\
  \ 内置的支持，有几种不同的选择。一种常见（尽管扩展性不佳）的方法是使用 .htaccess 文件来要求基础身份验证。如果你这样做，Apache 将尝试根据某种密码数据库验证用户身份——通常是\
  \ `.htpasswd` 文件或 Berkeley DB 文件。有关此方法的更多信息，请参阅 `http://httpd.apache.org/docs/howto/auth.html`\n\
  \n然而，你（通常）并不限于使用服务器内置的机制来验证用户。如果你将 `PHP` 作为服务器模块运行，你可以自定义一种结合了基础 HTTP 身份验证头和 `PHP`\
  \ 代码的解决方案。列表 12.1 显示了一个可以在你作为 Apache 模块或 IIS 下的 ISAPI 过滤器运行 `PHP` 时实现此功能的脚本。\n\n\
  **警告**\n\n*IIS 的 PHP ISAPI 版本尚未达到生产级水平，无法保证始终能够完美运行。如果你在这一节的示例中使用 PHP ISAPI 版本，请准备好看到某些异常行为。*\n\
  \n**列表 12.1：结合基础 HTTP 身份验证与 PHP (http_auth.php)**\n\n```php\n<?php\nfunction http_request_basic_auth\
  \ ($realm = ‘secure-area’) {\n$realm = addslashes ($realm);\nheader (‘WWW-Authenticate:\
  \ Basic realm=”’ . $realm . ‘“’);\nheader (‘HTTP/1.0 401 Unauthorized’);\nprint\
  \ (‘<html><body>你必须登录才能访问此页面。</</body></html>’);\n}\n\nfunction authorize\\_user\
  \ ($user, $pass)\n\n{\n\n// 请用实际测试用户凭据的代码替换此处！\nreturn true;\n}\n```\n\n\n\n\n```php\n\
  // 解析客户端请求头并查找认证数据\n\n$user = '';\n\n$pass = '';\n```\n\n**362**\n\n```php\n$hkey\
