  \ XHTML 1.1 中的模块化\n\n尽管 XHTML 1.0 和 XHTML 1.1 之间的主要区别在于新版本是可扩展和可定制的，但这种新功能实际上并非归功于\
  \ XML。发生的情况是 W3C 的分析师、程序员和语言专家将 XHTML 的 DTD 拆分成了独立的模块，每个模块都处理 Web 标记宇宙的一个特定部分。例如，一个模块包含了创建表单所需的所有元素和属性；另一个处理表格；还有一个处理文本。总共，有\
  \ 20 个这样的新模块（如果你算上已弃用但尚未过期的 Style Attribute 模块的话）。表 15.4 显示了 XHTML 1.1 中的模块。\n\n\
  **XHTML**\n**493**\n\n**表 15.4：XHTML 1.1 中的模块**\n\n| 模块名称 | 定义的元素/属性 |\n| :--- |\
  \ :--- |\n| 结构模块 (Structure Module) | body, head, html, title |\n| 文本模块 (Text Module)\
  \ | abbr, acronym, address, blockquote, br, cite, code, dfn, div, em, h1, h2, h3,\
  \ h4, h5, h6, kbd, p, pre, q, samp, span, strong, var |\n| 超文本模块 (Hypertext Module)\
  \ | a |\n| 列表模块 (List Module) | dl, dt, dd, ol, ul, li |\n| 对象模块 (Object Module)\
  \ | object, param |\n| 呈现模块 (Presentation Module) | b, big, hr, i, small, sub, sup,\
  \ tt |\n| 编辑模块 (Edit Module) | del, ins |\n| 双向文本模块 (Bidirectional Text Module)\
  \ | bdo |\n| 表单模块 (Forms Module) | button, fieldset, form, input, label, legend,\
  \ select, optgroup, option, textarea |\n| 表格模块 (Table Module) | caption, col, colgroup,\
  \ table, tbody, td, tfoot, th, thead, tr |\n| 图像模块 (Image Module) | img |\n| 客户端图像映射模块\
  \ (Client-Side Image Map Module) | area, map |\n| 服务端图像映射模块 (Server-Side Image Map\
  \ Module) | ismap |\n| 内生事件模块 (Intrinsic Events Module) | onclick 等事件属性 |\n| 元信息模块\
  \ (Metainformation Module) | meta |\n| 脚本模块 (Scripting Module) | noscript |\n| 样式表模块\
  \ (Stylesheet Module) | style |\n| 样式属性模块（Style Attribute Module）（已弃用） | style |\n\
  | 链接模块 (Link Module) | link |\n| 基础模块 (Base Module) | base |\n| Ruby 模块 (Ruby Module)\
  \ | ruby, rb, rt, rp |\n\n对于文档作者和程序员来说，这种重写意味着这些模块可以组合以创建定制的 XHTML。这允许作者创建定义限制元素集的\
  \ DTD。特定的浏览器可以组合自己的 DTD，规定：“我们只理解以下（小部分）标签，不要给我发送大量的样式表、嵌入对象和 iframe。”然后，一旦他们发布了\
  \ DTD，Web 程序员（如你）就可以使用这些 DTD 构建符合目标平台的 XHTML 文档。此外，如果你需要构建包含独立元素（例如 `fancyobject`）的\
  \ XHTML 文档，你可以编写一个新的 DTD 来扩展 XHTML DTD，为你的文档创建一个新的 `DOCTYPE` 声明指向你的自定义 DTD，并开始在文档中插入\
  \ `<fancyobject>` 标签。\n\n虽然构建新 DTD 的过程超本书的范围，但如果你想了解更多关于模块化 XHTML，我们可以为你指明正确的方向。\n\
  \n首先，你可能想阅读 W3C 关于编写模块化 XHTML 的入门指南，标题恰好为“Building HTML Modules”：`www.w3.org/TR/xhtml-building/`。另一篇值得阅读的概述文档是“XHTML\
  \ Modularization Overview”：`www.w3.org/MarkUp/modularization`。这里有关于使用 DTD 和 XML\
  \ Schema 语言 XHTML 模块的快速介绍：`www.xml.com/lpt/a/2001/05/02/xhtmlm12n.html`。\n\n最后，所有\
  \ XHTML 模块化文档的鼻祖是 W3C 网站上的原始提案，“Modularization of XHTML”：`http://www.w3.org/TR/xhtml-modularization/`。\n\
  \n*注*\n每个模块的 DTD 可以在一个单独的文件找到。换句话说，他们并没有真正改变 DTD 的内容；他们通过“参数化” DTD 的语法来实现这一点。他们还将\
