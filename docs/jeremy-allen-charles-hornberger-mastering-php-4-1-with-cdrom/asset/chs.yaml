  \ Windows NT 或 2000，将 Apache 设置为运行的服务是最简单的。\n\n只需填写适当信息，如果你愿意，允许 Apache 作为所有用户的服务运行。\n\
  \n点击“下一步”通过其余屏幕以使用默认设置，这些设置是我们的我们推荐的。\n\nApache 成功安装后，它也可以在 Windows NT/2000 下作为服务安装，或者作为普通程序使用。\n\
