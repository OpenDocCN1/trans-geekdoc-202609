  \ cookie 并向用户显示“主菜单”，但我们还没有编写任何执行这些功能的代码，因此这段代码仅显示一条简短的“操作成功”消息。\n\n请注意我们是如何使用 `addslashes()`\
  \ 来转义 SQL 查询中的任何引号的。在这个脚本中，这保护了我们免受恶意用户的影响——这些用户在轻易猜到我们将用户信息存储在名为 `USERS` 的表中后，决定通过在表单的用户名字段中输入文本\
  \ `‘; DELETE \\* FROM USERS;` 来自娱自乐。否则，将向数据库发送以下 SQL：\n\n```sql\nSELECT count(*)\
  \ FROM users WHERE username = ‘’; DELETE \\* FROM USERS; ‘\n```\n\n数据库将执行每条语句，我们最终会得到一个非常空的\
  \ `USERS` 表。如果我们改用 `addslashes()`，我们将生成一个完全无害的查询：`SELECT count(*) FROM users WHERE\
  \ username = ‘\\\\’; DELETE \\* FROM USERS’`\n\n代码列表 9.7 中的代码实际上由于另一个原因防止了这种特定攻击的生效：我们将\
  \ SQL 语句封装在事务块中，当由于格式错误的 SQL 导致查询错误时，事务最终将被回滚。这指向另一个良好的实践：将任何涉及 `INSERT`、`UPDATE`\
  \ 或 `DELETE` 语句的 SQL 块封装到事务块中，以便在出现问题时可以进行回滚。\n\n然而，即使使用事务和 `addslashes()` 也不足以确保所有到数据库的查询都是安全的。在许多情况下，查询参数没有包含在单引号中；例如，一个通过产品\
  \ ID 查找并显示产品信息的 PHP 脚本可能简单地使用：\n\n```sql\nSELECT * FROM products WHERE prod_id =\
  \ $prod_id\n```\n\n在这些情况下，`addslashes()` 无能为力，因为用户可以在不使用引号的情况下提前“关闭”原始 SQL 语句——并附加另一个恶意的\
  \ SQL 语句。唯一的真正解决方案是尝试预测并消除用户的恶意输入（并对你的数据进行良好的备份），我们将在下一章处理这个问题。\n\n![Image 46](img/index-326_1.png)\n\
  \n# 保存和编辑数据\n\n## 编辑数据\n\n你的 Web 应用程序可能还需要一种方法允许用户编辑他们已输入的数据。通过最少的努力，我们可以将列表 9.7\
  \ 中的数据输入表单转换为数据修改表单。\n\n对于此示例，我们简单假设包含用户 ID 的 cookie 已经存储在用户的浏览器中。当用户首次访问页面时，我们将向他们展示一个与图\
  \ 9.6 所示几乎相同的表单。\n\n然而，逻辑将略有不同。除了我们要更新现有记录而不是插入新记录之外，我们还必须对显示哪些数据做出一些额外的决策。与列表 9.7\
  \ 一样，我们的 `if` 子句使用 `$_POST` 数组的大小（通过 `$p` 引用）来判断：\n\n- 用户是否是首次加载页面\n- 用户是否已向表单输入数据并点击了提交（因此他们是第二次加载）。\n\
  \n如果用户是首次加载页面，我们将从数据库获取用户数据，然后将值存储在 `$p` 中。由于 `$p` 的元素用于确定表单中每个控件的默认状态，表单的内容将与 `users`\
  \ 表中的用户记录匹配。\n\n如果用户已输入数据并点击了提交按钮，我们尝试更新该用户的记录。如果没有错误，我们将显示确认消息；如果有错误，我们将重新显示表单以及任何错误消息。因为我们已\
  \ `$p` 转换为对 `$_POST` 的引用，\n\n### 表单与交互\n\n#### 列表 9.8：编辑数据 (update-account.php)\n\
