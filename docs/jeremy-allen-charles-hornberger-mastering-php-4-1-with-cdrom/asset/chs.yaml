  \ 很高见到你\n\n```\nMAIL FROM: test@example.com\n```\n\n250 2.1.0 test@example.com...\
  \ 发件人 OK\n\n```\nRCPT TO: fredf@localhost\n```\n\n250 2.1.5 fredf@localhost... 收件人\
  \ OK\n\n```\nDATA\n```\n\n354 输入邮件，以单独占一行的 \".\" 结束\n\n```\nSubject: 冷笑话\n你听说过那种新式的灯芯鹅绒枕头吗？\n\
