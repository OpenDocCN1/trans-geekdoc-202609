  [^a-z0-9+=: \\r\\\\n\\] ‘, $auth_hdr_val))\n        die (‘Malformed Authorization\
  \ header.’);\n    // 从请求头内容中提取凭据并解码\n    // 凭据应紧跟在 ‘Basic ‘ 之后，如下：\n    // Basic\
