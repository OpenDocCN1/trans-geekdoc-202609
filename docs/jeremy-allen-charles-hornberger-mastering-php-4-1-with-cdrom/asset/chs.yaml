  \ $this->size; }\n\n    function generate () {\n        $this->value = $this->get\\\
  _input ();\n        if ($this->value) $v = $this->value;\n        else $v = $this->dval;\n\
  \        $s = ‘<input type=”text” name=”%s” size=”%s” id=”%s” value=”%s” %s />’;\n\
  \        return sprintf ($s, $this->name, $this->size, $this->id, $v, $this->generate\\\
  _xattr\\_html ());\n    }\n}\n```\n\n### 第 10 章\n\n### 数据验证\n\n想象你正走在繁华城市的人行道上——假设是旧金山——一个戴着两顶帽子、没穿上衣、穿着一条脏兮裤子的邋遢男子挡住了你的路。\n\
  \n他递给你一杯满水的液体：“喝了它。”\n\n\n\n\n你是否会一口气大胆地把它全部喝掉？可能不会吧。更有可能的是，你会把它倒进水槽里。但假设出于某种疯狂的原因，你半心子想信任他；也许你喜欢他鞋子上的光泽，或者你觉得他的鼻子看起来很诚实。尽管如此，你也不会在没有进行一些研究的情况下就直接用用。也许你会闻一闻。或者你可能会用手指测试一下，在舌尖上滴一小小撮那种物质。毕竟，你以前从未见过这个陌生人，无论他的鞋子有多漂亮，或者鼻子有多讨喜，你不能随口吞下他给你的任何东西。\n\
  \n编写不对外部数据进行验证的 `PHP` 脚本，就像立即灌下那口饮料。\n\n数据验证可以简单到像闻闻饮料一样（检查输入数据的格式），也可以严苛到拒绝任何没有戴恰好一顶帽子的人提供的饮料（强制进行密码等身份测试）。\n\
  \n你需要对来自任何外部源的 `any` 数据进行有效性检查——无论是 cookie 的内容、表单中的变量，还是 HTTP 头部字段的内容——以确保它不会对你或你的\
  \ Web 应用程序造成任何伤害。\n\n伤害以许多不同的形式和大小出现。正如我们在第 9 章“表单与用户交互”中提到的，任何用于 `SQL` 查询的用户提供的任何数据都是特别危险的。\n\
  \n心怀不轨的用户可能会尝试删除或损坏你数据库中的记录。在光谱的另一端，如果允许用户输入格式错误的电子邮件地址，你可能也会认为它是“有害的”。这不一定会导致你的服务器崩溃，但当你的应用程序实际上向这些用户发送电子邮件时，可能会导致后续出现恼人的错误。这可能不需要明说，但你不想花费大量时间——事实上，除非你有深层次的受虐倾向，否则你可能\
  \ `never` 不想花任何 `any` 时间去追踪此类错误的源头。最好在它们有机会发生之前阻止它们。\n\n在本章中，我们将通过使用 `PHP` 的内置函数和自定义正则表达式，查看一些验证用户提供数据的基本技术。\n\
  \n**314**\n\n## 第 10 章\n\n### 数据验证\n\n#### 编写一个验证类\n\n某些类型的有效性检查执行得非常频繁，以至于将它们封装成一个函数库并在你的脚本中使用它们是合有意义的。我们将勾勒一个名为\
  \ `DV` 的类的开头，它负责执行常规的数据验证检查。通过将此类放在一个包含文件中，我们就可以在任何需要的地方使用它。\n\n我们的类将允许我们：\n\n*\
  \ 验证地址数据和电话号码\n* 确保 `URLs` 和电子邮箱地址格式正确且/或可用\n* 确认信用卡号格式正确\n\n在每种情况下，我们的方法都是相同的：我们将编写一个方法，其唯一目的是根据（希望是））控制我们正在解析的任何数据类型的简单规则来解析某些数据。\n\
  \n为了编写这些方法，我们真正需要知道的是控制数据格式的规则；一旦我们知道了这些，这些方法几乎就是自己写出来的。\n\n#### 设计考量\n\n我们的类将不会做世界上所有的事情。它不会检查单词的拼写，也不会验证\
  \ MIME 边界。它只是提供对日常算法的便捷访问，坦率地说，我们不想在每次需要使用它们时都重写一遍。用很少使用的函数来充肿这个类是毫无意义的；那只会减慢任何使用该类的脚本。\n\
  \n该类也不会执行那些可以由单个内置函数轻松处理的例行检查。\n\n当 `PHP` 已经提供了 `is_numeric()` 函数时，编写一个名为 `is_number()`\
  \ 的函数是没有意义的。\n\n在设计像 `DV` 这样一个通用类时，确定一些处理问题的标准方法也是重要的。这使得代码更容易于扩展、维护和使用。\n\n首先，我们需要为类中的方法确定一些标准的命名规范。方法将分为类型——一类是简单测试数据有效性的方法，另一类是实际上修改数据以使其符合某些要求的方法。对于执行简单有效性测试的方法，我们将使用像\
  \ `is_something()` 这样的名称，其中 `something` 是我们期望匹配的数据类型。例如，测试字符串看起来像不像有效的美国电话号码的方法可以命名为\
  \ `is_us_tel()`。对于实际上修改数据的方法，我们将使用主动动词作为名称。因此，一个删除字符串中所有开头和结尾空格并将多个空格压缩为单个空格的函数可以称为\
  \ `compress_whitespace()`。\n\n其次，我们需要确定一种返回有效性测试结果的标准方法。我们将简单地使用 `True` 和 `False`\
  \ 来表示有效性测试的成功或失败。因此，为了测试电话号码，我们可能会使用：\n\n```php\n$tel = $HTTP_POST_VARS['tel'];\n\
  \nif ($DV->is_us_tel ($tel) === false)\nprint (\"The telephone number you entered,\
  \ $tel, is not valid.\");\n```\n\n编写验证类\n\n**315**\n\n#### 那是 False，还是仅仅是 False？\n\
  \n由于 `PHP` 处理不同类型之间比较的方式，在检查返回如 `True` 或 `False` 等常量的函数返回值时，使用恒等运算符 `===` 而不是相等运算符\
  \ `==` 是一个好主意。当你使用 `==` 运算符比较返回 `True` 或 `False` 的函数时，`False` 等于 `0`，而 `True` 等于\
  \ `1`。\n\n在设计像 `DV` 这样一个通用类时，确定一些处理问题的标准方法也是重要的。这使得代码更容易于扩展、维护和使用。\n\n首先，我们需要为类中的方法确定一些标准的命名规范。方法将分为类型——一类是简单测试数据有效性的方法，另一类是实际上修改数据以使其符合某些要求的方法。对于执行简单有效性测试的方法，我们将使用像\
