  function end_elem ($parser, $name) {\nglobal $cdata, $cur\\_elem, $hdr\\_row, $data\\\
  _row, $empty\\_row,\n$first\\_name, $last\\_name, $middle\\_name;\n$cdata = trim\
  \ ($cdata);\nswitch ($name)\n{\ncase (“contact”):\nprint (“</table>\\\\n”); break;\n\
  case (“personal”):\ncase (“address”):\ncase (“tel”):\ncase (“internet”):\nprint\
  \ ($empty_row);\ncase (“name”):\nprint (sprintf ($hdr\\_row, “$last_name, $first_name\
  \ $middle_name”));\ncase (“title”):\nprint ($data\\_row, “Title”);\ncase (“employer”):\n\
  print ($data\\_row, “Company”);\ncase (“dob”):\nprint ($data\\_row, “Birthdate”);\n\
  case (“street”):\nprint ($data\\_row, “Address”);\ncase (“city”):\nprint ($data\\\
  _row, “City”);\ncase (“state”):\nprint ($data\\_row, “State”);\ncase (“zip”):\n\
  print ($data\\_row, “Zip”);\ncase (“home”):\nprint ($data\\_row, “Home”);\ncase\
  \ (“mobile”):\nprint ($data\\_row, “Mobile”);\ncase (“fax”):\nprint ($data\\_row,\
  \ “Fax”);\ncase (“email”):\nprint ($data\\_row, “Email”);\ncase (“aim”):\nprint\
  \ ($data\\_row, “AIM”);\ncase (“homepage”):\nprint ($data\\_row, “URL”);\ndefault:\n\
  $cdata .= $data;\n}\n}\n\nfunction cdata ($parser, $data) {\nglobal $cdata, $cur\\\
  _elem, $first\\_name, $middle\\_name, $last\\_name;\n$data = trim ($data);\nswitch\
  \ ($cur_elem)\n{\ncase (“first”):\n$first\\_name = $data;\ncase (“middle”):\n$middle\\\
  _name = $data;\ncase (“last”):\n$last\\_name = $data;\ndefault:\n$cdata .= $data;\n\
  }\n}\n\n$file = “contact.xml\";\n$parser = xml_parser_create ();\nxml_parser_set_option\
  \ ($parser, XML_OPTION_FOLDING, false);\nxml_set_element_handler ($parser, “start_elem”,\
  \ “end_elem”);\nxml_set_character_data_handler ($parser, “cdata”);\n\n$fp = fopen\
  \ ($file, “r”);\nif (!$fp)\ndie (“Couldn’t open $file”);\nwhile ($xml_input = fread\
  \ ($fp, 2048)) {\n$ok = xml_parse ($parser, $xml_input, feof ($fp));\nif (!$ok)\n\
  die (sprintf (“Error in $file: ‘s’ at line %d”,\nxml\\_error\\_string (xml\\_error\\\
  _code ($parser)),\nxml\\_get\\_line\\_number ($parser)));\n}\n\nfclose ($fp);\n\
  xml_parser_free ($parser);\n?>\n\n</body>\n</html>\n```\n\n![Image 71](img/index-491_1.png)\n\
  \n\n\n\n# 467\n\n## 从 XML 构建嵌套数据结构\n\n与其声明大量的全局变量，并在 XML 数据被传递给解析器后立即将其打印出来，当在处理\
  \ `Expat` 解析器时，我们可以采取第三种方法——即将每个元素的内容存储在一种数据结构中，然后我们就可以随心所欲地对其进行操作。\n\n我们已经在列表 15.9\
  \ 的代码中使用这种方法。基本策略并没有发生太大的变化——我们仍然在使用全局变量和大型的 `switch` 语句。但是，我们不再在处理函数内部打印 HTML，而是增量地构建一个嵌套数组，以包含\
  \ XML 文档中的数据。通常情况下，当使用这种技术时，无论我们的 XML 文档变得多么复杂，我们处理该 XML 文档时永远都不需要超过三个全局变量。\n\n\
  ### 列表 15.9：将 XML 文档转换为数组 (xml2array.php)\n\n```php\n<!DOCTYPE HTML PUBLIC “-//W3C//DTD\
  \ HTML 4.01 Transitional//EN”>\n<html>\n<head><title>Parsing With Expat and PHP</title></head>\n\
  <body>\n<?php\n$cdata = '';\n$contact_id = -1;\n$contacts = null;\n\nfunction start_elem\
  \ ($parser, $name, $attrs) {\n    global $contact_id;\n    if ($name == ‘contact’)\
  \ {\n        $contact_id = $attrs['id'];\n        $contacts[$contact_id] = array();\n\
  \    }\n}\n\nfunction end_elem ($parser, $name) {\n    global $cdata, $contacts,\
  \ $contact_id;\n    switch ($name) {\n        case (“first”):\n            $contacts[$contact_id]['name']['first']\
  \ = $cdata; break;\n        case (“last”):\n            $contacts[$contact_id]['name']['last']\
  \ = $cdata; break;\n        case (“middle”):\n            $contacts[$contact_id]['name']['middle']\
  \ = $cdata; break;\n        case (“title”):\n            $contacts[$contact_id]['title']\
  \ = $cdata; break;\n        case (“employer”):\n            $contacts[$contact_id]['employer']\
  \ = $cdata; break;\n        case (“dob”):\n            $contacts[$contact_id]['dob']\
  \ = $cdata; break;\n        case (“street”):\n            $contacts[$contact_id]['address']['street']\
  \ = $cdata; break;\n        case (“street2”):\n            $contacts[$contact_id]['address']['street2']\
  \ = $cdata; break;\n        case (“city”):\n            $contacts[$contact_id]['address']['city']\
  \ = $cdata; break;\n        case (“state”):\n            $contacts[$contact_id]['address']['state']\
  \ = $cdata; break;\n        case (“zip”):\n            $contacts[$contact_id]['address']['zip']\
  \ = $cdata; break;\n        case (“home”):\n            $contacts[$contact_id]['tel']['home']\
  \ = $cdata; break;\n        case (“mobile”):\n            $contacts[$contact_id]['tel']['mobile']\
  \ = $cdata; break;\n        case (“fax”):\n            $contacts[$contact_id]['tel']['fax']\
  \ = $cdata; break;\n        case (“email”):\n            $contacts[$contact_id]['internet']['email']\
  \ = $cdata; break;\n        case (“aim”):\n            $contacts[$contact_id]['internet']['aim']\
  \ = $cdata; break;\n        case (“homepage”):\n            $contacts[$contact_id]['internet']['homepage']\
  \ = $cdata;\n            break;\n    }\n    $cdata = '';\n}\n\nfunction cdata ($parser,\
  \ $data) {\n    global $cdata;\n    $cdata .= trim ($data);\n}\n\n$file = “contact.xml”;\n\
  $parser = xml_parser_create ();\nxml_parser_set_option ($parser, XML_OPTION_CASE_FOLDING,\
  \ false);\nxml_set_element_handler ($parser, “start_elem”, “end_elem”);\nxml_set_character_data_handler\
  \ ($parser, “cdata”);\n$fp = fopen ($file, “r”);\nif (!$fp)\ndie (“Couldn’t open\
  \ $file for reading”);\nwhile ($xml_input = fread ($fp, 2048)) {\n    $ok = xml_parse\
  \ ($parser, $xml_input, feof ($fp));\n    if (!$ok)\n    die (sprintf (“Error in\
  \ $file: ‘%s’ at line %d”,\n    xml_error_string (xml_get_error_code ($parser)),\n\
  \    xml_get_current_line_number ($parser)));\n}\nxml_parser_free ($parser);\nprint\
  \ (“<pre>\\n”);\nprint_r ($contacts);\nprint (“</pre>\\n”);\n?>\n</body>\n</html>\n\
  ```\n\n![Image 72](img/index-494_1.png)\n\n## 第 15 章\n\n### XML 和 XHTML\n\n这里有两个点需要注意：第一，我们修改了函数，使其能够处理多个联系人记录，例如如果我们的\
  \ XML 文档根元素是 `contacts` 而不是 `contact` 并包含多个 `contact` 元素（许多 XML 文件遵循这种模式）。第二，我们实际上使用了\
  \ `contact` 元素的 `id` 属性值作为我们数组的索引。\n\n列表 15.9 的输出如图 15.6 所示。所有的 `$contacts` 数组都可以通过\
