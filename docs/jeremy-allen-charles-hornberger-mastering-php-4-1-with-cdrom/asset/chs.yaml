  $query_result = mysql_query($new_pet_insert, $db_connection) or handle_mysql_error($db_connection);\n\
  ```\n\n虽然这两个语句实现了相同的效果，但后一个语句往往具有更自然且对开发者更友好的语法。`handle_mysql_error()` 函数是一个自定义函数，用于利用\
  \ `mysql_error()` 函数。它的原型如下：\n\n```php\nstring mysql_error(resource [link identifier])\n\
  ```\n\n该函数返回一个字符串并需要一个链接标识符（数据库连接）。\n\n让我们看看利用 `mysql_error()` 的自定义错误处理程序。\n\n```php\n\
  function handle_mysql_error($db_link)\n{\n    $error_string = mysql_error($db_link);\n\
  \    print(“<strong>MySQL Error in “ . __FILE__);\n    print(\":</strong> . $error_string);\n\
  }\n```\n\n请记住，这是一个为了说明 `mysql_error()` 用法而编写的自定义函数。\n\n***mysql_db_query***\n\n\
  这是一个减少了选择和执行相关代码的函数：\n\n```php\nresource mysql_db_query(string database, string\
  \ query, resource [link identifier])\n```\n\n使用此函数，列表 8.8 可以重写如下：\n\n```php\n/*\
  \ 连接到 MySQL */\n$db_connection = mysql_connect(“localhost”, “username”, “password”)\
  \ or die(“Could not connect”);\n\n/* 将查询存储在变量中 */\n$pets_query = “SELECT P.PetName,\n\
  O.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\nINNER JOIN Owner O ON O.OwnerID\
  \ = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID = P.PetTypeID;”;\n\n/* 将查询发送到\
  \ MySQL 执行 */\n$query_result = mysql_db_query (“MasteringPHP”, $pets_query);\n```\n\
  \n`mysql_db_query()` 函数提供了选择执行的简化版本。该函数会切换到指定的数据库。\n\n（内容）\n\n#### PostgreSQL\n\n\
  PostgreSQL 与 MySQL 有一些明显的差异。虽然两者非常相似，但必须注意一些区别。PostgreSQL 和 MySQL 之间最直接且经常被注意的差异之一是它们处理“序列”的方式。\n\
  \n*提示*\n\n本节中使用的所有 SQL 代码适用于 PostgreSQL，此处标记除外。\n\n##### DDL 差异\n\n在生成 PostgreSQL\
  \ 序列号时，可以使用一个小技巧。\n\n与其使用多个 CREATE 语句，可以将列指定为“serial”数据类型。这完成了三件事：\n\n- 它创建一个名为\
  \ *tablename* _ *columnname* _seq 的序列。\n\n- 它使指定为 serial 的列自动从序列中获取下一个值作为该字段的值。\n\
  \n- 它在该列上创建一个唯一索引。\n\n留给用户的只有实际的主键指定。与 MySQL 的“序列模型”相比，优点是序列与表的绑定并不紧密。一个表内可以访问并使用多个序列。这是一个小小的便利。列表\
  \ 8.10 包含了在 PostgreSQL 中工作时创建我们的 Pets 表所需的 DDL 命令。（我们加粗了 PostgreSQL 与 MySQL 之间的差异。）\n\
  \n**列表 8.10: Pets 数据库的 PostgreSQL DDL (pgsql_pets_ddl.sql)**\n\n```sql\nCREATE TABLE\
  \ Pet\n(\nPetID **SERIAL**,\nPetName Varchar(128) NOT NULL,\nOwnerID Integer,\n\
  PetTypeID Integer NOT NULL,\nPRIMARY KEY(PetID)\n);\n\nCREATE TABLE Owner\n(\n```\n\
  \n\n\n\n\n```sql\nOwnerID `SERIAL`,\nFirstName Varchar(64) NOT NULL,\nLastName Varchar(64)\
  \ NOT NULL,\nAddress Varchar(128) NOT NULL,\nCity Varchar(64) NOT NULL,\nState Char(2)\
  \ NOT NULL,\nZip Varchar(16) NOT NULL,\nPRIMARY KEY(OwnerID)\n);\n\nCREATE TABLE\
  \ Pet_Type\n(\nPetTypeID `SERIAL`,\nCommonName Varchar(64) NOT NULL,\nGenus Varchar(64),\n\
  Species Varchar(64),\nPRIMARY KEY(PetTypeID)\n);\n```\n\n如果数据库中已经存在任何序列，这些语句将导致错误。每当删除任何这些表时，必须显式地删除该序列。序列唯一的隐式部分是它的创建以及列的默认值的设置。在插入\
  \ `Pet_Types` 记录时，使用以下 SQL 语句：\n\n```sql\nINSERT INTO Pet_Type (CommonName, Genus,\
  \ Species, Description)\nVALUES('Dog’, ‘Canis’, ‘familiaris’, ‘Friendly quadrupedal\
  \ mammal’); \nINSERT INTO Pet_Type (CommonName, Genus, Species, Description)\nVALUES('Cat’,\
  \ ‘Felis’, ‘silvestris’, ‘Whiskered quadrupedal mammal’); \nINSERT INTO Pet_Type\
  \ (CommonName, Genus, Species, Description)\nVALUES('Human’, ‘Homo’, ‘sapiens’,\
  \ ‘Bipedal world explorers’);\n```\n\n这应该创建所需的宠物类型。可以使用列表 8.5 中相同的 `INSERT` 语句来创建宠物数据库中的其余数据。\n\
  \n在继续编写连接 PostgreSQL 数据库并检索数据的实际 PHP 代码之前，确保 PostgreSQL 服务器守护进程 `postmaster` 正在运行，并带有\
  \ `-i` 参数以确保它接受 TCP/IP 连接以及 Unix Domain 套接字。在确保 `postmaster` 运行并接受 TCP/IP 套接字后，我们可以编写一个简单的脚本（列表\
  \ 8.11）来连接数据库并以 MySQL 脚本相同的方式输出数据。\n\n**列表 8.11: PostgreSQL 数据检索脚本 (pgsql_pets.php)**\n\
  \n```php\n<html>\n<head>\n<title>PostgreSQL Database Script</title>\n</head>\n<body>\n\
  <?php\n/* Connect to the PostgreSQL database */\n// 248\n## Chapter 8\n### SQL AND\
  \ DATABASE INTERACTION\n\n$db_connection = pg_connect(\"host=localhost port=5432\
  \ dbname=MasteringPHP user=jallen\")\nor die(\"Could not connect to DB\");\n\n/*\
  \ Store the query to be executed in a variable */\n$pets_query = \"SELECT P.PetName,\n\
  O.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\nINNER JOIN Owner O ON O.OwnerID\
  \ = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID = P.PetTypeID;\";\n\n/* Send\
  \ the query to PostgreSQL for execution */\n$query_result = pg_exec($db_connection,\
  \ $pets_query);\n\n/* Begin table to format data */\nprint \"<table border=\\\"\
  1\\\">\\n\";\nprint \"<tr><td align=\\\"center\\\" colspan=\\\"4\\\" bgcolor=\\\"\
  #ffff99\\\">\"; print \"<strong>Pets and Owners</strong>\";\nprint \"</td></tr>\"\
  ;\nprint \"\\t<tr>\";\nprint \"\\t\\t<td>Pet Name</td>\\t\\t<td>Common Name</td>\"\
  ; print \"\\t\\t<td>Owner First Name</td>\\t\\t<td>Owner Last Name</td>\"; print\
  \ \"</tr>\";\n\n/* Need a counter for rows in pgsql */\n$row = 0;\n\n/* Loop over\
  \ query displaying all returned rows */\nwhile ($data = @pg_fetch_object($query_result,\
  \ $row))\n{\nprint \"\\t<tr>\";\nprint \"\\t\\t<td>\" . $data->petname . \"</td>\"\
  ;\nprint \"\\t\\t<td>\" . $data->commonname . \"</td>\";\nprint \"\\t\\t<td>\" .\
  \ $data->firstname . \"</td>\";\nprint \"\\t\\t<td>\" . $data->lastname . \"</td>\"\
  ;\nprint \"\\t</tr>\";\n$row++;\n}\nprint \"<tr<td colspan=\\\"4\\\"> Total number\
  \ of pets with owners:\" .\n\"<strong>\" . pg_numrows($query_result). \"</td></tr>\"\
  ; print \"</table>\\n\";\n\n/* Close the connection with the database */\n// BASICS\
  \ OF SQL\n// 249\npg_close($db_connection);\n?>\n</body>\n</html>\n```\n\n访问 PostgreSQL\
  \ 数据库的函数与 MySQL 函数非常相似。连接函数略有不同并有多种形式。这些是 `pg_connect()` 函数的可能用法：\n\n`int pg_connect\
  \ (string host, string port[, string options[,], string tty]], string dbname)`\n\
  `int pg_connect (string conn_string)`\n\n最后一种方法使用 `conn_string` 在我们的示例中使用，是因为它是最简单的。只需以任何顺序提供每个参数，并用空格分隔每个连接字符串选项即可。\n\
  \n并没有名为 `pg_query()` 的函数，查询函数被称为 `pg_exec()`，意思是“执行查询”。`pg_exec` 的原型所示：\n\n`int\
  \ pg_exec (int connection, string query)`\n\n`fetch_object` 和 `fetch_array` 函数：\n\
  \n`object pg_fetch_object(resource result, int row)` \n`array pg_fetch_array(resource\
  \ result, int row)`\n\n### 最后插入的 ID 问题\n\nPHP 中没有函数可以整洁地从 PostgreSQL 中获取最后插入的 ID。然而，有一个名为\
  \ `pg_getlastoid()` 的函数，但不建议用它执行此操作。相反，必须直接查询该 ID。列表 8.12 展示了从数据库获取最新 ID 的工作原理。\n\
  \n**250: 列表 8.12: PostgreSQL nextid 函数 (pgsql_nextid.php)**\n\n```php\n<?php\n/*\
  \ Connect to the PostgreSQL database */\n$db_connection = pg_connect(\"host=localhost\
  \ port=5432 dbname=MasteringPHP user=jallen\")\nor die(\"Could not connect to DB\"\
  );\n\n/* Get the next value from the sequence for this PK */\n$nextid_query = \"\
  SELECT NEXTVAL('pet_petid_seq')\"; \n$nextid_result = pg_exec($db_connection, $nextid_query);\n\
  $nextid = pg_fetch_row($nextid_result, 0);\n$nextid = $nextid[0];\n\n$new_pet_insert\
  \ = \"INSERT INTO Pet VALUES(\" . $nextid . \", ‘Skippy’, 3, 2)\"; \n$new_pet_result\
  \ = pg_exec($db_connection, $new_pet_insert);\n\n$get_new_pet = \"SELECT *\nFROM\
  \ Pet\nWHERE PetID = \" . $nextid;\n$new_pet_result = pg_exec($db_connection, $get_new_pet);\n\
  \n$pet = pg_fetch_object($new_pet_result, 0);\n\nprint \"<table border=\\\"1\\\"\
  >\";\nprint \"<tr><td>New Pet Name</td></tr>\";\nprint \"<tr><td>\";\nprint $pet->petname;\n\
  print \"</td></tr>\";\nprint \"</table>\";\n\n/* Close the connection with the database\
  \ */\npg_close($db_connection);\n?>\n```\n\n\n\n\n然而，如果使用这种方法，就没有简单的方法来确定刚刚插入的 ID！当然，也有涉及触发器和其他方法。但最简单的方法是直接从序列（sequence）中获取\
  \ ID，然后实际使用它。由于序列是一个容易被滥用的数字生成器，所以从从中获取数字不必感到抱歉。虽然这里演示的代码并不十分健壮，但基本概念是相同的。你将在下一节中学习如何让这段代码更健壮一些。\n\
  \n# SQL 基础\n\n251\n\n## 抽象数据库接口\n\n现在你已经见了 `MySQL` 和 `PostgreSQL` 这两个数据库的工作原理，现在后退一步，考虑在典型项目中出现的一些重要问题是非常关键的。一个老老的问题是：应该使用哪种数据库？你是否想被锁定为为某一个数据库编写一套特定的代码？你如何能以最少的代码更改有效地处理不同的数据库？\n\
  \n这些都是经常出现的棘手问题。`PHP` 中编写了一些非常精妙且有效的解决方案，来处理大部分的数据库抽象。显然，如果一个应用程序使用存储过程实现了大部分逻辑，那么\
  \ `PHP` 中的任何通用抽象都无法减轻将这些存储过程从一个数据库迁移到另一个数据库的痛苦。但 `PHP` 提供的抽象确实有助于减轻各种可用数据库 API 之间（有时是微妙的）差异带来的痛苦。\n\
  \n目前已有几个已知的现有项目使用面向对象编程 (`OOP`) 技术创建了数据库抽象层。这里所用的是 `PHP` 自带的数据库层。该数据库层是 `PEAR` 的一部分，它是一个用于复用\
  \ `PHP` 组件的框架和分发系统。该实现使用面向对象的方法来解决数据库抽象问题。当创建数据库对象时，会指定它的类型。在创建相应的数据库对象后，可以使用另一组通用方法来执行\
  \ `PHP` 与数据库之间的所有交互。\n\n> 提示：如果你不熟悉 `OOP`，你可能想在继续之前先阅读第 6 章。\n\n## PEAR 数据库抽象的细要点\n\
  \n`PEAR` 数据库抽象层的实现初看起来理解可能相当困难。让我们在列表 8.13 中列出代码，然后分析它的工作原理。\n\n### 列表 8.13：使用 PEAR\
  \ 抽象数据库交互 (db_abstract.php)\n\n```php\n<?php\n\n/* 引入数据库抽象类 */\n\nrequire_once \"\
  DB.php\";\n\n/* 将 DSN 连接字符串解析为数组的静态方法 */\n$dsn = DB::parseDSN(\"pgsql://jallen@localhost/MasteringPHP\"\
  );\n\n/* 创建 pgsql DB 对象的静态工厂方法 */\n$db_obj = DB::factory(\"pgsql\");\n\n/* 连接数据库\
  \ */\nif(!$db_status = $db_obj->connect($dsn))\n{\n    echo \"Error: \" . $db_status->message\
  \ . \"<br />\";\n    echo \"Code: \" . $db_status->code . \"<br />\";\n}\n```\n\n\
  252\n\n## 第 8 章\n\n### SQL 与数据库交互\n\n```php\n/* 将要执行的查询存储在变量中 */\n$pets_query =\
  \ \"SELECT P.PetName,\nO.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\nINNER\
  \ JOIN Owner O ON O.OwnerID = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID\
  \ = P.PetTypeID\nORDER BY LastName;\";\n\n/* 执行查询 */\n$pets_result = $db_obj->simpleQuery($pets_query);\n\
  \n/* 开始构建以格式化数据的表格 */\n$pet_tbl = \"<table border=\\\"1\\\">\\n\";\n$pet_tbl .=\
  \ \"<tr><td align=\\\"center\\\" colspan=\\\"4\\\" bgcolor=\\\"#ffff99\\\">\\n\"\
  ; $pet_tbl .= \"<strong>Pets and Owners</strong>\\n\";\n$pet_tbl .= \"</td></tr>\\\
  n\";\n$pet_tbl .= \"\\t<tr>\\n\";\n$pet_tbl .= \"\\t\\t<td>Pet Name</td>\\n\\t\\\
  t<td>Common Name</td>\\n\"; $pet_tbl .= \"\\t\\t<td>Owner First Name</td>\\n\\t\\\
  t<td>Owner Last Name</td>\\n\"; $pet_tbl .= \"\\t</tr>\\n\";\nwhile($row = $db_obj->fetchRow($pets_result,\
  \ DB_FETCHMODE_ASSOC))\n{\n    $pet_tbl .= \"\\t<tr>\\n\";\n    $pet_tbl .= \"\\\
  t\\t<td>\" . $row[\"petname\"] . \"</td>\\n\";\n    $pet_tbl .= \"\\t\\t<<td>>\"\
  \ . $row[\"commonname\"] . \"</td>\\n\"; $pet_tbl .= \"\\t\\t<<td>>\" . $row[\"\
  firstname\"] . \"</td>\\n\"; $pet_tbl .= \"\\t\\t<td>\" . $row[\"lastname\"] . \"\
  </td>\\n\"; $pet_tbl .= \"\\t</tr>\\n\";\n}\n$pet_tbl .= \"</table>\\n\";\n$db_obj->disconnect();\n\
  ?>\n\n<html>\n<head>\n<title>Abstract Database Handling</title>\n</head>\n<body>\n\
  <?php\necho $pet_tbl;\n?>\n</body>\n</html>\n```\n\n253\n\nSQL 基础\n\n然而，如果使用这种方法，就没有简单的方法来确定刚刚插入的\
  \ ID！当然，也有涉及触发器和其他方法。但最简单的方法是直接从序列（sequence）中获取 ID，然后实际使用它。由于序列是一个容易被滥用的数字生成器，所以从从中获取数字不必感到抱歉。虽然这里演示的代码并不十分健壮，但基本概念是相同的。你将在下一节中学习如何让这段代码更健壮一些。\n\
  \n现在你已经见了 `MySQL` 和 `PostgreSQL` 这两个数据库的工作原理，现在后退一步，考虑在典型项目中出现的一些重要问题是非常关键的。一个老老的问题是：应该使用哪种数据库？你是否想被锁定为为某一个数据库编写一套特定的代码？你如何能以最少的代码更改有效地处理不同的数据库？\n\
  \n这些都是经常出现的棘手问题。`PHP` 中编写了一些非常精妙且有效的解决方案，来处理大部分的数据库抽象。显然，如果一个应用程序使用存储过程实现了大部分逻辑，那么\
  \ `PHP` 中的任何通用抽象都无法减轻将这些存储过程从一个数据库迁移到另一个数据库的痛苦。但 `PHP` 提供的抽象确实减轻各种可用数据库 API 之间（有时是微妙的）差异带来的痛苦。\n\
  \n目前已有几个已知的现有项目使用面向对象编程 (`OOP`) 技术创建了数据库抽象层。这里所用的是 `PHP` 自带的数据库层。该数据库层是 `PEAR` 的一部分，它是一个用于复用\
  \ `PHP` 组件的框架和分发系统。该实现使用面向对象的方法来解决数据库抽象问题。当创建数据库对象时，会指定它的类型。在创建相应的数据库对象后，可以使用另一组通用方法来执行\
  \ `PHP` 与数据库之间的所有交互。\n\n`PEAR` 数据库抽象层的实现初看起来理解可能相当困难。让我们在列表 8.13 中列出代码，然后分析它的工作原理。\n\
  \n### DB::parseDSN\n\n基类 `DB` 定义了一个静态方法 `parseDSN`。其语法类似于 URL 格式。一些 DSN 示例是：\n-\
  \ `pgsql://jallen@localhost/MasteringPHP`\n- `mysql://jallen:localhost/MasteringPHP`\n\
  \n语法定义：当这个 URL 运行 `DB::parseDSN` 时，所有数据都会被提取并作为数组返回。\n\n### DB::factory\n\n该方法产生的对象是一个产生数据库对象的工厂。很简单吧？工厂甚至可以产生你告诉它的任何类型的数据库对象。该类足够智能，能够找出可以使用哪些类。当调用方法时，会返回一个数据库对象；它被赋值给\
  \ `$db_obj`。\n\n### DB::connect\n\n在创建初始对象后，我们必须执行处理数据库时所做的相同程序：必须连接数据库。这就是解析后的\
  \ DSN 发挥作用的地方。\n\n### DB_Common::setFetchMode\n\n此方法告诉数据库对象要获取什么类型的结果。默认模式是使用数值索引数组。将结果作为关联数组要方便且有用得多。\n\
  \n\n\n\n如果在连接过程中发生错误，该方法将返回类型为 `DB_Error` 的错误，它继承自 `PEAR_Error`。这都是 `PEAR` 可复组件架构的一部分。\n\
  \n基本上，`PEAR` 为错误处理奠定了基础，而 `DB` 库简单地扩展了这种错误处理以适应数据库错误。函数返回一个具有多个可用字段的对象。列表 8.13 中的示例演示了两个非常有用的字段。一旦连接到数据库，就可以执行查询。连接到数据库始终是检索数据的第一步。\n\
  \n### DB_Common::query\n\n这里的情况变得有点复杂。我们有一个对象代表我们到数据库的连接。列表 8.13 中的对象 `$db_obj`\
  \ 可以向我们的 SQL 服务器发送查询，使用巧妙的 DSN 连接到它，并可以在任何具有相同代码集的数据库上执行所有这些操作。那么实际执行查询呢？这就是 `query`\
  \ 方法大派用用场了。在将查询存储在字符串中之后，我们需要某种机制在 SQL 服务器上执行此查询。接下来的代码行正是为此此的：\n\n```\n$pet_result\
  \ = $db_obj->query($pets_query);\n```\n\n一旦执行了查询，我们将返回的对象存储在变量中。返回的对象是一个 `DB_Result`\
  \ 对象。该对象存储了我们的结果。\n\n### DB_Result\n\n`DB_Result` 对象包含指向创建它的 `DB` 对象的引用。这允许 `DB_Result`\
  \ 对象了解指定的 `fetchMode` 以及结果对象可能需要的任何其他数据。对于任何不更改或创建数据的 SQL 语句（例如 `CREATE`、`INSERT`、`UPDATE`\
  \ 或 `DROP` 语句），都会返回此对象。该对象通常只在执行 `query` 方法并使用 `SELECT` 语句进行查询时返回。\n\n在执行查询并获取 `DB_Result`\
  \ 对象的引用后，可以对数据进行迭代并显示或存储在变量中。可以使用 `DB_Result` 方法 `fetchRow()` 获取下一行。由于 `fetchModeType`\
  \ 已经设置，代码中数据的实际迭代和对变量的赋值非常清晰且易于遵循。\n\n#### SQL 基础\n**255**\n\n### 注意\n\n作为一种概念证明，我能够修改列表\
  \ 8.12 中的两行代码，以便在具有几乎相同表的 `MySQL` 数据库上实现完全相同的结果，唯一的区别是 `PostgreSQL` 情况下的主键字段和序列。其中一行是\
  \ DSN，另一行是 `DB::factory` 调用中的数据库类型。注意变量名的大小写写；它们也可能导致移植性问题。\n\n在组装好宠物表后，调用 `disconnect`\
  \ 方法断开与数据库的连接。为了方便起见，这里记录了最常用的数据库抽象类及其字段和方法。此文档很大程度上源自 `PEAR/DB` 源代码本身。\n\n### DB_Common\
  \ 类\n\n`DB_Common` 是所有单独数据库实现的基类。`DB_Common` 类定义了每个单独数据库层为提供实际内容所提供的接口。\n\n####\
  \ 公有方法\n\n`void getOne(array $query, array $params)`\n获取返回的数据的第一行的第一列。\n\n`array\
  \ getRow(array $query, string $fetchmode, array $params)`\n获取返回的第一行数据。负责执行查询并在完成后释放结果。\n\
  \n`array getCol(integer $query, integer $col, array $params)`\n从结果集中获取单列并将其作为索引数组返回。\n\
  \n`array getAssoc(array $query, boolean $force_array, array $params)`\n获取查询的整个结果集并使用第一列作为键将其作为关联数组返回。\n\
  \n`array getAll(array $query, string $fetchmode, array $params)`\n获取查询返回的所有行。\n\n\
  `DB_result query(array $query)`\n向数据库发送查询并带有 `DB_Result` 对象返回任何结果。\n\n`void DB_Common()`\n\
  `DB_Common` 的构造函数。\n\n#### 私有方法\n\n`string quoteString(string $string)`\n对字符串加引号，以便可以在字符串分隔符内安全使用。\n\
  \n`bool provides($feature)`\n告诉 DB 实现或其后端扩展是否支持某功能。\n\n`int errorCode(string $nativecode)`\n\
  将原生错误代码映射到可移植代码。\n\n`string errorMessage(string $code)`\n将错误代码映射到文本消息。\n\n**256**\n\
  \n#### SQL 与数据库交互\n\n`void setErrorHandling(int $mode, mixed $options)`\n设置如何处理由此产生的错误。\n\
  \n`void setFetchMode(int $fetchmode)`\n设置默认使用哪种获取模式。\n\n`void prepare(array $query)`\n\
  为执行准备查询。\n\n`string execute_emulate($stmt, boolean $data)`\n在模拟时返回包含真实查询的字符串。\n\n\
  `void executeMultiple($stmt, &$data)`\n在同一连接上执行多次 `execute()` 调用。\n\n`string toString()`\n\
  将对象转换为字符串。\n\n##### 私有字段\n\n`array $features`\n特定数据库支持的特性数组。\n\n`array $errorcode_map`\n\
  将原生错误代码映射到可移植代码的数组。\n\n`string $type`\n标识当前数据库类型的字符串。\n\n`array $prepare_tokens`\n\
  令牌数组。\n\n`array $prepare_types`\n可用类型数组。\n\n`int $maxstmt`\n用于跟踪语句数量的内部整数。\n\n`string\
  \ $last_query`\n代表最后一个查询的字符串。\n\n`string $fetchmode`\n当前使用的获取模式；可能的模式见表 8.4。\n\n\
  **表 8.4：获取模式**\n\n| 获取模式 | 说明 |\n| :--- | :--- |\n| DB_FETCHMODE_ORDERED | 按数字索引，从\
  \ 0 开始 |\n| DB_FETCHMODE_ASSOC | 按列名索引 |\n| DB_FETCHMODE_FLIPPED | 对于多维结果：通常，数组的第一级是行数，第二级按列数或名称索引。FLIPPED\
  \ 切换这种顺序，因此数组的第一级是列名，第二级是行数。 |\n\n### DB 类\n\n`DB` 类是许多静态方法的容器，用于创建数据库对象等。该类主要是一个带有实用方法的工具类。\n\
  \n`object DB::factory(string $type)`\n创建指定类型的对象。如果类不存在，则抛出错误。\n\n`object DB::connect(array\
  \ $dsn, array $options)`\n创建一个新的数据库对象并自动连接。对象类型在 DSN URL 中确定。\n\n`int apiVersion()`\n\
  简单地返回版本号。\n\n`bool isError(int $value)`\n判断 DB 方法产生的结果码是否为错误。\n\n`bool isManip(string\
  \ $query)`\n判断使用的查询是否执行数据操作。\n\n`bool isWarning(mixed $value)`\n判断 DB 方法产生的结果码是否为警告。警告不是致命的，而错误是。\n\
  \n`string errorMessage(int $value)`\n接收错误代码并返回一个表示该错误代码简短描述的字符串。\n\n`array parseDSN(string\
  \ $dsn)`\n用于设置数据源连接信息，例如数据库类型、用户名、密码、协议、主机名等。\n\n`bool assertExtension(string $name)`\n\
  如果 PHP 数据库扩展尚未加载，则加载它。\n\n\n\n\n\n除了这些函数，DB 文件中还定义了一些常量。它们是自而易懂的，可以在 `PEAR/DB.php`\
  \ 文件中很容易找到。PEAR 代码库的目标是类似于 Perl 的 CPAN。它已经提供了许多非常有用的类。同样值得注意的是，在数据库抽象方面，PEAR 数据库抽象类并不是唯一的选择。PHPLib\
  \ 已经提供数据库抽象类一段时间了。\n\nPEAR 数据库抽象库在复杂性名列前茅，特别是在错误处理和对 PHP 面向对象（OO）设施的使用方面。PEAR 代码是免费提供的，并随标准的\
  \ PHP 发行版发布。某些模块看起来可能有些晦涩。但大多数 PEAR 代码（尤其是 DB 库）的另一个优点是注释非常优秀。代码在处都有说明，并且在大多数情况下是自解释的。有一个名为\
  \ PHPDoc 的项目可以程序化地生成类似于 JavaDoc 的 API 文档。\n\n本章涵盖了 Web 应用开发的几个重要方面。涵盖了 SQL 以及使用\
  \ SQL 进行数据库设计的基础。对 MySQL 和 PostgreSQL 进行了简要的比较和讨论。涵盖了这两种关系型数据库管理系统（RDBMS）的 PHP API。最后，我们还讨论了对\
  \ PHP 与底层数据库之间的接口进行抽象。使用本章中的技术，可以很容易开始编写利用 RDBMS 的 Web 应用程序。\n\n这些技术还允许编写与数据库无关的\
  \ PHP 代码。\n\n虽然如果在本章中能对 SQL 进行更深入的覆盖会很好，但我们的空间只够介绍基础。通过能够准确建模数据并至少符合第三范范式的数据库设计，应用程序可以取得非常大的进展。为应用程序增加不依赖于特定应用程序的\
  \ PHP 代码优势，是使代码可移植性的重要一步。确保数据库设计良好是另一个巨大的进步。\n\n*本页特意留空*\n\n![Image 39](img/index-284_1.jpg)\n\
  \n## 第 9 章\n\n### 表单与用户交互\n\n在 PHP 脚本可以做的所有事情——而且几乎无所不能——中，最常见的操作莫过于处理 HTML 表单的内容。\n\
  \n表单处理对于构建 Web 应用的业务是如此基础，以至于很难想象一个不包含几十个表单的严肃项目。幸运的是，PHP 让创建和处理 HTML 表单的工作比以前的要容易得多——但仍然存在陷阱。在本章中，我们将向您介绍设计表单的基础知识，向您如何处理来自这些表单的用户输入，并解释从基础到高级的策略，以确保您的表单外观正确且运行正常。\n\
  \n### 表单基础\n\n尽管在复杂的 Web 应用中处理 HTML 表单可能很棘手，但表单本身并不是非常复杂的物种。简单来说，表单只是网站访问者向你的 Web\
  \ 服务器发送数据的一种手段。每当你使用搜索引擎时，你都在使用一个表单向运行搜索引擎的服务器发送几个单词。当你注册在 `www.nytimes.com` 并在\
  \ Web 上阅读《纽约时报》时，你正在使用 HTML 表单提交你的个人信息。这个过程非常简单：使用浏览器输入数据，点击按钮，浏览器将信息发送到 Web 服务器。大功告成。\n\
  \nGoogle 网站的基本用户界面（`www.google.com`）是一个 Web 表单——一个简单得惊人的表单：一个输入要搜索单词的文本字段，以及一个在输入完成后点击的按钮。\n\
  \n当然，并不是所有的 HTML 表单都如此简单。Hotmail（微软提供的免费 Web 电子邮件服务）的用户界面充满了各个板块、链接和图形——显然与你在 Google\
  \ 看到的完全是不同的物种。然而，该网站从根本上讲仍然是一个巨大的表单集合。\n\n### 表单如何工作\n\n如果你已经熟悉 HTML 表单的基础知识，你可能想跳过这一节，转到本章后面更详细的话题。然而，如果你是设计交互式\
  \ Web 页面的新手（或者，比如，你莫名渴望重读一遍基础知识），这一节提供了简短的介绍。\n\n![Image 40](img/index-285_1.png)\n\
  \n## 第 9 章：表单与用户交互\n\n在 Web 页面上添加表单就像在页面上添加任何其他东西一样——你向页面添加一些标签，它就出现了。这里没有魔法。事实上，从理论上讲，你可以使用于三十六个字符写出一个功能性的\
  \ HTML 表单：\n\n```html\n<form><input type=”submit\" /></form>\n```\n\n当然，你的表单不会做任何实用的事情，但它仍然是一个有效的\
  \ HTML 表单。\n\n你通常想做的是从 Web 浏览器另一端的访问者那里收集信息，这需要更多的输入：\n\n```html\n<form action=”myscript.php”>\n\
  你最喜欢的单词是什么？\n<input type=”text” name=”favorite_word” size=”15” />\n<input type=”submit”\
  \ />\n</form>\n```\n\n例如，如果将上述 HTML 代码添加到 `www.example.com` 站点上名为 `myform.html`\
  \ 的页面中，我们将得到类似于图 9.1 的内容。\n\n**图 9.1** - 一个非常基本的 Web 表单\n\n该页面的访问者只需点击文本框，输入他们最喜欢的单词（比如，*krk,*，捷克语中表示“脖子”的，这是一个非常有趣的单词），然后点击提交按钮（在这种情况下是“提交查询”）。此时，用户的浏览器将尝试加载\
  \ URL `http://www.example.com/myscript.php?favorite_word=krk`。\n\n### 表单基础（续）\n\n\
  这个 URL 发生了什么？事实上，几乎没有发生，浏览器已经完成了大部分工作。当用户点击提交时，浏览器会获取用户在文本字段中输入的任何数据，并向 `action`\
  \ 属性指定的 URL 发送普通的页面请求，并将表单数据附加在 URL 的末尾。如果我们用另一个文本字段（假设名为 `favorite_color`）也请求用户喜欢的颜色，并且用户输入了“pink”，那么浏览器也会将其附加上去，从而提供\
  \ URL `http://www.example.com/myscript.php?favorite_word=krk&favorite_color=pink`。这个过程真的没什么特别的。如果你愿意，可以直接将该\
  \ URL（包括表单数据）直接输入到浏览器的地址栏中，它的效果和填写并提交表单一样。试一下：在浏览器的地址或位置栏中输入 `http://www.google.com/search?q=moustache+styles`，Google\
  \ 就会执行搜索，就像你在 Google 首页的表单中输入“moustache styles”并点击 Google 搜索按钮一样。\n\n这不是提交表单数据到服务器的唯一方法。正如我们在第\
  \ 1 章描述的，你可以通过表单标签的 `method` 属性指定要使用方法。（事实上，你应该始终为表单标签添加此属性，但它不是强制要求的，默认值是 `GET`）。通过将\
  \ `method` 属性的值设置为 `POST`，你可以指示浏览器向服务器发送不同类型的请求。使用 `POST` 方法时，浏览器不会将表单数据附加到目标 URL\
  \ 上（如上所示）；而是将数据作为 HTTP 请求的一个独立部分发送。这些细节并不真正关键，但了解这两种方法的存在以及每种方法适用于哪些表单是非常重要的。我们将在下详细讨论\
  \ GET 和 POST。\n\n\n\n\n故事的最后一部分是`form processing`（表单处理）。这是你实际上对用户提交的数据进行操作的地方。为了对数据进行操作，当然，你需要能够获取它们。\n\
  \n和大多数 Web 编程工具一样，PHP 让这一切变得简单。在我们上面的示例中，`myscript.php` 文件可能看起来如下：\n\n```html\n\
  <html>\n<head><title>Survey Results</title></head>\n<body>\n<p>Your favorite word\
  \ is: <?php print ($favorite_word); ?></p>\n<p>Your favorite color is: <?php print\
  \ ($favorite_color); ?></p>\n</body>\n</html>\n```\n\n如你所见的，PHP 会自动创建与表单中控件同名的变量。意不意外的是，PHP\
  \ 还会用用户提交的值来填充这些变量。\n\n因此，在我们的示例中，`$favorite_word` 的值将是“krk”，而 `$favorite_color`\
  \ 的值将是“pink”。\n\n**注意**\n\n实际上，只有在 `PHP` 配置文件 `php.ini` 中启用了 `register_globals`\
  \ 选项，这些全局变量才会被创建。关于此点的更多信息，请参阅本章后面的“配置选项”部分。\n\n当然，通常我们想做一些比简单地将用户数据回显给他们更有用的事情。例如，如果我们有一个颜色和单词的数据库，我们可以检查以确保用户的输入确实由一个真实的颜色和一个真实的单词组成，然后可以将用户的输入记录在某处（如数据库中的另一个表）。\n\
  \n### 定义和命名表单\n\nHTML 表单并没有多少多样性或复杂性，但 HTML 提供了足够的控件来完成几乎任何基本的数据输入任务。你只需要记住几个标签，大多数控件都是通过\
  \ `input` 标签的变体创建的。例如：\n\n- `<input type=\"checkbox\" />` 创建一个复选框。\n- `<input type=\"\
  text\" />` 创建一个单行文本输入框。\n- `<input type=\"submit\" />` 创建一个提交按钮。\n\n#### 选择选取有意义的名称\n\
  \n所有表单控件都有一个共同点：`name` 属性，你必须使用它来标识每个控件，并在 PHP 脚本中使用它来访问用户通过该控件输入的任何值。因此，给你的表单控件起一个清晰、具有描述性的名称是非常重要的。一组命名为\
  \ `a`、`b`、`c`、`d` 等复选框意味着你的 PHP 代码将充斥着不可读的 `$a`、`$b`、`$c`、`$d` 等引用，没有任何人（甚至是作者）都不想久看这样的代码。相反，请遵循第\
  \ 2 章概述的变量命名规范，并选择具有描述性的名称，清楚地标识你期望变量携带的信息。例如，如果你正在编写一个让读者勾选他们所说的的所有语言的表单，使用下面的代码会比这种好得多：\n\
  \n```html\nEnglish <input type=\"checkbox\" name=\"en\" value=\"yes\" />\nSpanish\
  \ <input type=\"checkbox\" name=\"es\" value=\"yes\" />\nGerman <input type=\"checkbox\"\
  \ name=\"de\" value=\"yes\" />\n```\n\n（使用上面的代码）比使用这种代码要好得多：\n\n```html\nEnglish\
  \ <input type=\"checkbox\" name=\"a\" value=\"yes\" />\nSpanish <input type=\"checkbox\"\
  \ name=\"b\" value=\"yes\" />\nGerman <input type=\"checkbox\" name=\"c\" value=\"\
  yes\" />\n```\n\n两种命名方案都幸运地产生了简短的变量名，但描述性的名称在出现在你的 PHP 脚本中时实际上会有意义。\n\n#### 选择合法的名称\n\
  \n虽然官方 HTML 规范对你用于组成表单控件名称的字符几乎没有任何限制，但如果你计划用 PHP 脚本处理这些 HTML 表单，就必须遵循一些简单的规则。控件名称只能包含字母、数字和下划线，并且不能以数字开头。\n\
  \n### 使用数组作为控件名称\n\n通常，你会使用 PHP 动态生成来自外部源（如数据库）的单。在这种情况下，表单中的控件数量取决于查询结果。为了处理这种情况，PHP\
  \ 允许通过在名称末尾添加括号 `[]` 来将控件转换为数组。为了实现这一点，与其写：\n\n```html\n<input type=\"checkbox\"\
  \ name=\"fruit\" value=\"orange\"\n```\n\n你应该写：\n\n```html\n<input type=\"checkbox\"\
  \ name=\"fruit[]\" value=\"orange\" />\n```\n\n#### 使用表单和表单元素\n\n就像其他 HTML 元素一样，表单由一组标签界定——起始\
  \ `<form>` 和结束 `</form>`。表单标签本身非常直观，但涉及一些不简单的概念；我们在这里解释这些概念。列表 9.1 是一个包含几种输入类型的示例表单。该表单的浏览器渲染版本如图\
  \ 9.2 所示。**列表 9.1：示例表单**\n\n```html\n<form action=\"dest_url.php\" method=\"get\"\
  >\nWhat’ your baby’s name?<input type=\"text\" name=\"name\" id=\"f0\" />\n<br />\n\
  你的宝宝是男孩还是女孩?\nBoy <input type=\"radio\" name=\"sex\" value=\"m\" id=\"f1\" />\n\
  Girl <input type=\"radio\" name=\"sex\" value=\"f\" id=\"f2\" />\n<br />\n你的宝宝需要什么?\n\
  Stroller <input type=\"checkbox\" name=\"needs[]\" value=\"stroller\" id=\"f3\"\
  \ />\nToys <input type=\"checkbox\" name=\"needs[]\" value=\"toys\" id=\"f4\" />\n\
  New Pair of Shoes <input type=\"checkbox\" name=\"needs[]\" value=\"shoes\" id=\"\
  f5\" />\n<br />\n你的宝宝喜欢喝什么?\n<select multiple size=\"3\" name=\"drinks[]\" id=\"\
  f6\">\n<option value=\"juice\">Juice</option>\n<option value=\"milk\">Milk</option>\n\
  <option value=\"water\">Water</option>\n</select>\n<br />\n<input type=\"submit\"\
  \ name=\"s\" value=\"Submit Data\" />\n<input type=\"reset\" name=\"r\" value=\"\
  Reset Form\" />\n</form>\n```\n\n某些属性适用于大多数表单：\n\n- `action` 属性指定了浏览器向哪个 URL 发送用户输入。如果你用\
  \ PHP 编写网站，这将是你希望处理用户输入的 PHP 脚本的 URL。\n- `method` 属性指定了如何发送数据，GET 或 POST（本章稍后会详细介绍）。\n\
  - `enctype` 属性允许你指定使用哪种 MIME 方案来编码数据。\n\n\n\n\n尽管细节有些复杂，但 `enctype` 属性你可能使用的值只有两个：“application/x-www-url-encoded”（默认值）和“multipart/form-data”。默认值仅仅是将空格和标点符号等字符转换为如\
  \ `+` 和 `%2C` 的序列。例如，文本“Yes, the tilde (~) is my favorite character”会变为：`Yes%2C+the+tilde+%28%7E%29+is+my+favorite+character`\n\
  \n# 表单基础\n\n**265**\n\n*提示*\n\n*表 1.1（在第 1 章中）列出了一些常用字符及其 URL 编码。*\n\n当你在通过 `GET`\
  \ 提交表单时，你通常希望使用“application/x-www-urlencoded” 作为 `enctype` 属性的值。当你通过 `POST` 提交表单时，你可以指定任何你需要的方案，但“multipart/form-data”\
  \ 始终是一个稳妥的选择，而且如果你的表单允许用户从浏览器上传文件，它是唯一选择的值。（是的，你可以这样做——而且非常简单。）\n\n我们稍后会向你展示方法。\n\
  \n*注意*\n\n*关于 multipart/form-data 编码方案的详情，请参见 `www.ietf.org/rfc/rfc1867.txt`。*\n\
  \n以下子小节描述了表单中最常用的数据输入元素类型。\n\n## 按钮\n\n你可以向表单添加三种类型的按钮：重置按钮、提交按钮和推按钮。重置按钮使表单中的所有控件恢复到原始状态（即包含该表单的页面首次加载时的状态）。提交按钮会将表单提交到表单元素\
  \ `action` 属性中指定的 URL。推按钮没有默认行为；其主要用途是允许网页设计人员向表单挂载客户端脚本。\n\n你可以通过两种不同的方式指定每种类型的按钮：\n\
  \n◆\n\n作为一个 `input` 元素，将其标题文本写在 `value` 属性中。\n\n◆\n\n作为一个 `button` 元素，将其标题文本放在起始标签和结束标签之间。\n\
  \n以下两行代码的效果相同：它们都会创建一个标记为“Reset Me!”的重置按钮：\n\n```\n<input type=\"reset\" name=\"\
  reset1\" value=\"Reset Me!\" />\n<button type=\"reset\" name=\"reset1\">Reset Me!</button>\n\
  ```\n\n提交按钮和推按钮可以用完全相同的方式创建，分别使用 `type=\"submit\"` 或 `type=\"button\"`。\n\n*注意*\n\
  \n*如果你使用 `<button> ... </button>` 标签格式并省略 `type` 属性，浏览器将默认创建一个提交按钮。（`input` 元素格式始终需要一个\
  \ `type` 属性。）* 在两种代码格式之间进行选择时，`button` 标签比 `input` 标签更灵活，因为你可以向按钮中添加混合内容。例如，你可以通过以下代码为你的提交按钮添加一个笑脸：\n\
  \n```html\n<button type=\"submit\" name=\"smiley_submit\">Submit Me!\n<img src=\"\
  smiley.gif\" /></button>\n```\n\n到底你为什么想在提交按钮上添加一个笑脸，这显然另一个问题了。\n\n你还可以使用以下语法从图像文件创建图形提交按钮：\n\
  \n```html\n<input type=\"image\" name=\"submit1\" src=\"img.gif\" />\n```\n\n**266**\n\
  \n## 第 9 章\n\n### 表单与用户交互\n\n浏览器将插入 `src` 属性中指定的图像文件，而不是文本标题。该图像将变为可点击；当用户点击它时，表单会被提交，并附带图像上被点击精确点的信息。（这使得将这些按钮实现为服务器图像映射成为可能，以便图形提交按钮可以被划分为逻辑区域。）\n\
  \n## 文本和密码字段\n\n文本和密码字段是用 `input` 标签创建的。它们都是单行文本输入字段；它们之间的唯一区别是密码字段通过将字符显示为星号在屏幕上“隐藏”用户的输入，并且（如果你足够幸运的话）通过拒绝将该信息存储在硬盘的缓存文件中。但不要被欺骗，认为使用密码字段提交的数据是安全的。它仍然以明文形式发送到服务器，任何窃听你连接的人都可以轻松获取它。如果你的网站需要真正安全的密码，你必须使用提供加密连接的安全\
  \ Web 服务器。\n\n文本字段应用于从用户那里收集的任何微小、离散的变量信息——诸如姓名、电话号码和地址。如果你愿意，可以使用 `maxlength` 属性限制在文本或密码字段中可以输入的文本量。\n\
  \n要创建一个宽度为 20 个字符、名为“mytext”且接受数据不超过 30 个字符的文本输入，请使用：\n\n```html\n<input type=\"\
  text\" name=\"mytext\" size=\"20\" maxlength=\"30\" />\n```\n\n要为文本字段填充某些初始值，请将你想要的文本输入字段的\
  \ `value` 属性。例如，许多网站结合 `value` 属性和 JavaScript 在文本字段内部放置指令，然后在用户点击字段时立即让它们消失：\n\n\
  ```html\n<input type=\"text\" name=\"search\" value=\"[enter words to search for]\"\
  \nonfocus=\"javascript:if(this.value=='[enter words to search for]') { this.value='';}\"\
  \ />\n```\n\n## 选择菜单\n\n使用 `select` 和 `option` 标签创建的选择菜单允许用户从列表中选择一个或多个选项。当用户提供的信息必须与预定义的列表相匹配时，它们比文本字段更好。通过使用菜单而不是文本字段，你可以减少错误并确保获得统一的数据。如果你使用文本字段来询问用户他们住在哪个州或省份，你无疑会遇到各种拼写错误和针对每个地区的创造性缩写。\n\
  \n可以定义菜单，使列表中的一个或多个选项被预选。这不出所意料地通过启用应该被默认选中的选项的 `selected` 属性来实现。\n\n这是一个示例菜单，为用户提供了四个选择，最后一个被默认选中：\n\
  \n```html\n<p>What’s your boy band?</p>\n<select name=\"boy_band\" size=\"4\">\n\
  <option value=\"nsync\">’N Sync</option>\n<option value=\"boyz2men\">Boyz II Men</option>\n\
  <option value=\"bstreet_boys\">Backstreet Boys</option>\n<option value=\"menudo\"\
  \ selected>Menudo</option>\n</select>\n```\n\n*注意*\n\n**267**\n\n*像 `selected` 这样的布尔属性可以通过两种方式出现。书中展示了属性独立存在的旧样式，因为这种非常常见。但从\
  \ HTML 4（1998 年 4 月）开始，此类属性就像任何其他属性一样，都应该被赋予一个带引号的值：`<option ... selected=\"selected\"\
  >`。*在当前的 XHTML 和所有未来版本中，需要使用完整的语法。遗憾的是，仍然存在一些只识别独立样式的旧浏览器。*\n\n我们可以通过向 `select`\
  \ 标签添加 `multiple` 属性来创建多值选择菜单——允许用户从列表中选择多个选项，如下：\n\n```html\n<p>Which are your\
  \ favorite boy bands?</p>\n<select multiple name=\"boy_bands[]\" size=\"4\">\n<option\
  \ value=\"nsync\" selected>’N Sync</option>\n<option value=\"boyz2men\">Boyz II\
  \ Men</option>\n<option value=\"bstreet_boys\">Backstreet Boys</option>\n<option\
  \ value=\"menudo\" selected>Menudo</option>\n</select>\n```\n\n在第二个菜单中，’N Sync 和\
  \ Menudo 的选项都被默认选中，用户可以自由选择他们喜欢的任何男孩男团。（毕竟，谁能只选一个呢？）注意，我们在第二个菜单的 `name` 属性值后面加上了方括号；当你这样做时，PHP\
  \ 会自动将用户的选择存储在数组中，而不是简单的标量变量中。\n\n因此，如果我们网站的访问者选择了（例如）’N Sync 和 Boyz II Men，我们将得到一个名为\
  \ `$boy_bands` 的两个元素的数组，其内部结构如下：\n\n```php\n$boy_bands = [\n  0 => 'nsync',\n  1\
  \ => 'boyz2men'\n];\n```\n\n\n\n\n\n如果我们不使用括号，PHP 将只会创建一个标量变量来存储用户的输入。该变量将包含用户选择的最后一个选项，我们永远无法知道他们也喜欢\
  \ ’N Sync’。\n\n## 文本区域 (Textareas)\n\n多行文本字段使用 `textarea` 标签创建。它们对于输入较长的文本非常有用，尽管让用户通过这种方式输入大量文本通常不是个好主意。文本区域是世界上最粗糙的编辑窗口，在这些窗口中导航和编辑文本非常笨拙（有些人甚至会说非常令人烦恼）。如果你需要从用户那里获取大量文本，可以考虑替代方案，例如允许他们上传文本文件；这样一来，他们就可以从容地使用任何他们最喜欢的文字处理程序输入信息，并在完成后发送给你。\n\
  \n## 268\n\n## 第 9 章\n\n### 表单与用户交互\n\n你使用 `rows` 和 `cols` 属性来控制 `textarea` 元素的大小。例如，\n\
  \n```html\n<textarea rows=\"5\" cols=\"70\">\n```\n\n这将创建一个足够大的文本区域，可以容五行文本，每行 70\
  \ 个字符。由于你不能指望所有浏览器都使用相同的字体大小，`textarea` 在屏幕上的实际尺寸很难预测，甚至是不可能的。\n\n你也可以通过简单将文本放在\
  \ `textarea` 标签之间来预填充 `textarea` 的默认文本。例如，以下 `textarea` 可能适用于允许用户输入他们喜爱的俳句（haiku）：\n\
  \n```html\n<textarea rows=\"3\" cols=\"40\" name=\"haiku\">\nPlease type some haiku\n\
  \nInto this textarea\nAnd send it to me\n</textarea>\n```\n\n### 单选按钮 (Radio Buttons)\n\
  \n单选按钮允许用户在几个互斥的选项中进行选择。从这个意义上说，它们的功能与单值选择菜单相似。当要求用户从两个或三个基本选项中选择时，尤其是对于二选一的选择，它们通常比选择菜单更好。要创建一组单选按钮，你只需为每个按钮添加一个\
  \ `input` 标签。所有标签必须具有相同的 `name`，如下：\n\n```html\n<b>Are you happy or sad?</b>\nHappy\
  \ <input type=\"radio\" name=\"mood\" value=\"happy\" />\nSad <input type=\"radio\"\
  \ name=\"mood\" value=\"sad\" />\n```\n\n当用户提交表单时，将创建一个名为 `mood` 的变量；其值将与用户选择的某个按钮的值匹配。要默认选中一个按钮，请使用\
  \ `checked` 属性，如下：\n\n```html\n<input type=\"radio\" name=\"mood\" value=\"sad\"\
  \ checked />\n```\n\n### 复选框 (Checkboxes)\n\n复选框可以切换开启或关闭，其功能上等同于多值选择菜单（`<select\
  \ multiple ...>`），但它们对用户来说通常更容易使用。例如，某个获取汽车在线报价的人可能会发现，以一组复选框的形式来处理汽车的可选配置列表，比在选择菜单中进行多项选择（此处原文为\
  \ multiple choices 应为多选）要容易得多。\n\n与单选按钮一样，你使用 `checked` 属性来声明复选框为默认勾选。\n\n```html\n\
  <input type=\"checkbox\" name=\"side_airbags\" value=\"y\" checked />\n```\n\n每个复选框应该有一个唯一的\
  \ `name`，或者使用数组括号约定进行命名。\n\n### 标签 (Labels)\n\n标签可能是最不常用的表单控件，但如果你认真想要让所有人都能使用你的\
  \ Web 应用程序，你就应该学会如何使用它们。\n\n标签并不无趣。事实是，`label` 元素实际上并没有做任何事情。它们不是允许用户与表单交互的功能性控件（像选择菜单或复选框那样）。\n\
  \n## 表单基础\n\n## 269\n\n标签仅仅是……标签。它们有什么特别之处呢？在于在于：标签实际上为你提供了一种方法，可以将文本和标记无歧地关联到单个表单控件上，这意味着使用非标准浏览器的人——包括为视力障碍人士设计的非视觉浏览器，以及为手机和手持设备设计的精简版浏览器——将能够更容易使用你的表单。\n\
  \n考虑下面这段没有标签的普通表单节选：\n\n```html\n<b>What’s your favorite number?</b>\n<input type=\"\
  text\" name=\"fav_num\" size=\"4\" /><br />\n<b>Are you male or female?</b>\nMale\
  \ <input type=\"radio\" name=\"sex\" value=\"m\" />\nFemale <input type=\"radio\
  \ name=\"sex\" value=\"f\" />\n```\n\n尽管我们在 Navigator 或 Internet Explorer 等标准 Web\
  \ 浏览器中查看这些内容时，很清楚哪些文本描述的是哪些表单控件，但无法保证它在任何其他环境中都能通顺。\n\n现在考虑同一个表单的这个版本：\n\n```html\n\
  <label for=\"f0\"><b>What’s your favorite number?</b></label>\n<input type=\"text\"\
  \ name=\"fav_num\" id=\"f0\" size=\"4\" /><br />\n<b>Are you male or female?</b>\n\
  <label for=\"f1\">Male</label>\n<input type=\"radio\" name=\"sex\" value=\"m\" id=\"\
  f1\" />\n<label for=\"f2\">Female</label>\n<input type=\"radio\" name=\"sex\" value=\"\
  f\" id=\"f2\" />\n```\n\n它仍然不是完全明显每段文本指的是哪一个控件（“Are you male or female?” 实际上是两个单选按钮的标签，但没有方法将其同时关联到它们），但它比之前的例子清晰得多。\n\
  \n## 270\n\n## 第 9 章\n\n### 表单与用户交互\n\n文件上传存在安全风险；你需要采取正确的步骤来确保用户上传的数据不会损害你的 Web\
  \ 服务器。（有关如何使用 PHP 上传文件，请参见后文“上传文件”。）\n\n### 隐藏字段 (Hidden Fields)\n\n隐藏字段本质上是不可见的控件，允许你向表单附加额外信息。\n\
  \n如名所示，隐藏字段不会出现在浏览器窗口中，用户无法修改它们的值——至少不容易修改——这使得它们成为将额外数据嵌入表单的一种合理方法。\n\n隐藏控件的 HTML\
  \ 与其他控件一样：\n\n```html\n<input type=\"hidden\" name=\"userid\" value=\"656543\" />\n\
  ```\n\n它们对于从一个页面请求保留状态信息特别有用。\n\n例如，假设你经营着包含邮件列表的 Internet 服务，并且你想使用你的网站 `www.example.com`\
  \ 允许人们订阅列表。你需要一个包含注册表单的 页面，允许用户输入电子邮件地址。\n\n```html\n<form action=\"do-signup.php\"\
  >\n<b>Sign up for our mailing list!</b><br />\n<label>E-mail: <input type=\"text\"\
  \ name=\"email\" /></label><br />\n<input type=\"submit\" value=\"Sign Up\" />\n\
  </form>\n```\n\n然而，如果你想跟踪哪些外部网站将人员带到了你的注册表单，你可以使用隐藏变量（以及少量的 PHP 代码）来实现这一点：\n\n```html\n\
  <form action=\"do-signup.php\">\n<b>Sign up for our mailing list!</b><br />\n<label>E-mail:\
  \ <input type=\"text\" name=\"email\" /></label><br />\n<input type=\"submit\" value=\"\
  Sign Up\" />\n</form>\n```\n\n\n\n\n\n```html\n<input type=\"hidden\" name=\"ref\"\
  \ value=\"<?php print $HTTP_REFERER; ?>\" />\n</form>\n```\n\n全局变量 `$HTTP_RERERER`\
  \ 包含了用户到达此页面时*来源*的页面 URL。因此，如果用户从 `www.example.com/page.html` 点击链接并跳转到你的注册页面，那么\
  \ `$HTTP_REFERER` 的值将是“www.example.com/page.html”。\n\n然后，在处理该表单的 PHP 脚本 `signup.php`\
  \ 中，你可以使用隐藏元素的值来记录“引导”用户进入你注册表单的页面位置。\n\n## 选择数据传输方法：GET vs. POST\n\n来自任何 HTML 表单的用户输入都可以通过两种方法之一提交到服务器：`GET`\
  \ 或 `POST`。事实上，这些是标准的 HTTP 请求方法，它们仅仅是定义了 Web 浏览器向服务器发送的请求文本的替代结构方式。\n\n## 表单基础知识\n\
  \n**271**\n\n### 什么是 HTTP 请求？\n\n每当 浏览器向服务器请求页面时，它都会向服务器发送一个 HTTP 请求。服务器反过来返回一个\
  \ HTTP 响应。HTTP（超文本传输协议）仅仅是制作这些请求和响应的标准方式。\n\n例如，如果你在网络浏览器中输入地址 `www.example.com/blank.html`，你的浏览器将向\
  \ `www.example.com` 服务器发送类似以下的内容：\n\n```\nGET /blank.html HTTP/1.1\nHost: www.example.com\n\
  User-Agent: Mozilla/4.0 (compatible; MSIE 5.01; Windows NT 5.0)\n```\n\n搞定。这是一个完整的（尽管相当小）的\
  \ HTTP 请求。正如你可能通过观察请求的第一个单词所看到的，我们的请求使用了 `GET` 方法。简而言之，这就是你每次从服务器请求 Web 页面时发生的情况。\n\
  \n为了继续我们浏览器和服务器之间的示例交换，假设 `blank.html` 是一个仅仅声明自己为空的 HTML 文件。基于此，`www.example.com`\
  \ 服务器将返回如下内容：\n\n```\nHTTP/1.1 200 OK\nDate: Fri, 16 Nov 2001 04:24:35 GMT\nServer:\
  \ Apache/1.3.19 (Unix) PHP/4.0.6\nLast-Modified: Fri, 16 Nov 2001 04:15:24 GMT\n\
  ETag: “5cdca-58-3bf492dc”\nAccept-Ranges: bytes\nContent-Length: 88\nContent-Type:\
  \ text/html\n\n<html>\n<head><title>A blank page</title></head>\n<body>See? Nothing\
  \ here.</body>\n</html>\n```\n\n就是这样——一个完整的 HTTP 响应。正如你所见 way，它只不过是一组“头部”（header）字段，后面紧跟着响应的“正文”（body），而正文正是我们在请求中索要的\
  \ HTML 文档内容。\n\n当使用 `GET` 方法提交表单时，浏览器会向服务器发送表单中所有成功控件的名称和值（参见本章稍后部分的“什么是成功控件？”）。浏览器通过将这些名称/值对附加在表单\
  \ `action` 属性所指定的 URL 末尾来实现此操作。例如，如果用户在以下表单的唯一字段中输入了 `orange`：\n\n```html\n<form\
  \ method=\"GET\" action=\"foo.php\">\nGive me the name of a fruit, quick:\n<input\
  \ name=\"fruit\" type=\"text\" />\n<input name=\"submit\" name=\"s\" value=\"OK\"\
  \ />\n</form>\n```\n\n**272**\n\n第 9 章\n\n## 表单与交互\n\n### 交互\n\n当使用 `GET` 方法提交表单时，浏览器会向服务器发送表单中所有成功控件的名称和值（参见本章稍后部分的“什么是成功控件？”）。浏览器通过将这些名称/值对附加在表单\
  \ `action` 属性所指定的 URL 末尾来实现此操作。例如，如果用户在以下表单的唯一字段中输入了 `orange`：\n\n```html\n<form\
