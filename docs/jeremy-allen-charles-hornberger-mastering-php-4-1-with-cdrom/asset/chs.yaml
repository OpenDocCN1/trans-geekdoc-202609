  ![Image 48](img/index-336_1.png)\n\n### 进阶表单处理\n\n**311**\n\n`HTML_Form` 类提供了自动检查所有必填字段的方法。每当我们调用\
  \ `add()` 将控件添加到 `HTML_Form` 对象时，该对象的引用就会存储在 `HTML_Form` 对象的数组中；当我们调用 `$form->get_missing_fields()`\
