  \ ($msg_struct->parts[$i]);\n    }\n}\n```\n\n然而，由于 `imap_fetchstructure()` 返回的对象并不包含每个部分的实际内容，我们不得不使用另一个函数\
  \ `imap_fetchbody()` 来逐个检索消息的每个部分。该函数的原型为：\n\n`string imap_fetchbody (int imap_stream,\
  \ int msg_number, string part_number [, int flags])`\n\n第三个参数 `part_number` 必须针对复杂的消息进行特殊计算。正是这个问题导致我们的代码规模从微小的四行\
