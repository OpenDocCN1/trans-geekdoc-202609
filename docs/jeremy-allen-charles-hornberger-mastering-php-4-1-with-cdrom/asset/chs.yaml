  \        else $is_unique = false;\n        pg_result ($res);\n        if ($is_unique\
  \ == false)\n        {\n            flag_error (‘username’, ‘您选择的用户名已在使用。请选择另一个用户名。’);\n\
  \            $sql = ‘ABORT TRANSACTION’;\n            $res = pg_exec ($dbh, $sql);\n\
  \            pg_result ($res);\n        }\n        else\n        {\n           \
  \ // 用户是否接受 cookie？\n            $eat_cookies = isset ($p['cookie']) ? ‘y’ : ‘n’;\n\
  \            // 从 user_id 序列中获取下一个值\n            $sql = “SELECT nextval (‘users_userid_seq’)$”;\n\
  \            $res = pg_exec ($dbh, $sql);\n            if (!$res) die (DB_ERR_DOC);\n\
