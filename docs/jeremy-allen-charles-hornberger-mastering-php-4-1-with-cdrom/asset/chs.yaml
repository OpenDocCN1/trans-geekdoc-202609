  \ `include()` 或 `require()` 进行引用。\n\n## 后台考虑因素\n\n这个小型应用程序最复杂的部分是 `pop_viewmsg.php`\
  \ 中的递归函数 `get_message_body()`。如上文所述，它的任务是遍历由 `imap_fetchstructure()` 返回的对象树（该函数返回一组嵌套对象，每个对象代表消息正文的一部分），然后使用\
  \ `imap_fetchbody()` 获取这些部分的内容。与检索整封邮件原始内容的 `imap_body()` 不同，`imap_fetchbody()`\
  \ 可用于仅检索多部分消息（multipart message）的某一个部分。遗憾的是，IMAP 规范对 MIME 消息正文部分编号的规则相当复杂，这使得编写一个能够正确遍历树并获取多部分消息每个部分内容的函数变得有些困难——甚至难以阅读！\n\
  \n然而，我们正在追求的基本策略非常简单。首先，我们知道 `imap_fetchstructure()` 至少会返回一个描述消息正文的对象。该函数的原型为：\n\
  \n`object imap_fetchstructure (int imap_stream, int msg_number [, int flags])`\n\
  \n到目前为止，参数已经非常熟悉了：`imap_stream` 是 `imap_open()` 返回的 IMAP 流；`msg_number` 是消息编号，除非整数位掩码标志\
  \ `flags` 被设置为 `FT_UID`，在这种情况下 `msg_number` 被视为 UID。\n\n不过，`imap_fetchstructure()`\
  \ 返回的对象比之前的函数更复杂。它包含了表 19.7 中给出的属性。\n\n### 表 19.7：imap_fetchstructure() 返回的对象的属性\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| type | 消息正文的主要 MIME 类型（以整数给出） |\n| encoding |\
  \ 传输编码（以整数给出） |\n| ifsubtype | 如果存在子类型字符串则为真 |\n| subtype | 正文的 MIME 子类型——例如“text/plain”中的“plain”—以字符串形式给出\
  \ |\n| ifdescription | 如果存在描述字符串则为真 |\n| description | Content-Description 字段的内容\
  \ |\n| ifid | 如果存在标识字符串则为真 |\n| id | Content-ID 字符串的内容 |\n| lines | 正文的行数 |\n\n\
  ### 表 19.7：imap_fetchstructure() 返回的对象的属性（续）\n\n| 属性 | 描述 |\n| :--- | :--- |\n|\
  \ bytes | 正文的字节数 |\n| ifdisposition | 如果存在处置字符串则为真 |\n| disposition | Content-Disposition\
  \ 字段的内容 |\n| ifdparameters | 如果 dparameters 属性已创建则为真 |\n| dparameters | 一个对象数组，其中每个对象都有一个“attribute”和一个“value”属性，对应于\
  \ Content-Disposition 字段的参数 |\n| ifparameters | 如果参数数组存在则为真 |\n| parameters | 一个对象数组，其中每个对象都有一个“attribute”和一个“value”属性\
  \ |\n| parts | 一个对象数组，结构与顶层对象相同，每个对象对应一个 MIME 正文部分 |\n\n需要注意的是，`parts` 属性是一个对象数组，与\
  \ `imap_fetchstructure()` 返回的初始对象一样。这使得使用以下基本技术遍历代表消息各种嵌套部分的对象树成为可能：\n\n```\nfunction\
  \ showmsg ($msg_struct) {\n    if (!isset ($msg_struct->parts)) {\n        return;\n\
