  ## 绘制图表\n\n当我们想要来自来自不同类别或区域的相似数据时（例如按月的销售百分比），柱状图非常有用。柱状图允许我们快速直视化所比较数据之间的差异。图表——实际上，任何有助于视觉化表示数据的媒介——都是帮助传达数据含义的极佳方法。如果你查看一个包含原始数字的电子表格，要建立关于数据之间如何关系的心理模型可能有点令人敬畏。有了图表，可视化就由你完成了！\n\
  \n我们可以学习创建折线图或饼图；然而，在创建柱状图时学到的技术使得创建其他类型的图表，甚至更复杂的图像变得同样容易。在我们可以绘制美观的柱状图之前，必须引入几个新函数。这些函数中没有引入任何激进的概念，只是你已经掌握的技巧和函数上的增量变化或微小差异。让我们继续学习其中一些函数吧！\n\
  \n## 绘制线条：ImageLine()\n\n我们将学习的第一个新函数将是 `ImageLine()`，它允许我们绘制单像素线条。\n\n这只需要图像、两个坐标和线条的颜色。我们将使用此函数在我们的柱状图中绘制水平参考线。图\
  \ 18.6 显示了使用 `ImageLine()` 创建的图像；创建此图像的代码位于列表 18.7 中。\n\n**图 18.6**\n\n由\n\n`ImageLine()`\
  \ 绘制的线条\n\n绘制图表\n\n**571**\n\n**列表 18.7：绘制线条 (line.php)**\n\n```php\n<?php\nheader\
  \ (“Content-type: image/png”);\n\n$im = ImageCreate (150, 150);\n\n$grey = ImageColorAllocate\
  \ ($im, 230, 230, 230);\n\n$black = ImageColorAllocate ($im, 0, 0, 0);\n\nImageLine($im,\
  \ 0, 30, 150, 150, $black);\n\nImageLine($im, 0, 150, 150, 30, $black);\n\nImageLine($im,\
  \ 0, 30, 150, 30, $black);\n\nImageString($im, 3, 5, 5, “Figure 18.6: Lines\", $black);\n\
  \nImagePng ($im);\n\nImageDestroy ($im);\n?>\n```\n\n`ImageLine()` 的原型如下：\n\n`int\
  \ ImageLine(int image, int x1, int y1, int x2, int y2, int color)` 第一个参数是绘制线条的图像资源。第二个和第三个参数是线条的起始坐标。第四个和第五个参数是结束坐标。线条将在这两个坐标之间绘制成直线。最后一个参数表示线条应该具有的颜色。线条非常、非常容易绘制，并且可以用于多种方式。\n\
  \n## 绘制 TrueType 字体：ImageTTFText()\n\nTrueType 字体是高质量字体，通常是外观最好的字体。要在 GD 中使用 TrueType\
  \ 字体，GD 必须编译为支持 TTF。为了正确使用后续的两个函数，你必须拥有 TrueType 字体。在互联网上可以找到许多免费的 TrueType 字体。\n\
  \n渲染 TrueType 字体的代码并不比我们一直使用的其他任何函数复杂。要用 TrueType 字体绘制文本，使用 `ImageTTFText()` 函数；它有八个参数。第一个参数是绘制文本的图像资源。第二个参数是文本绘制的图像资源（此处应为字体大小）。互联网上可以找到各种免费的\
  \ TrueType 字体（此处更正：原文逻辑）。使用 `ImageTTFText()` 函数绘制文本。\n\n`int ImageTTFText(int image,\
  \ int size, int angle, int x, int y, int color, string fontfile, string text)`\n\
  \n**572**\n\n## 第 18 章\n\n生成图形\n\n使用 `ImageTTFText()` 函数返回一个表示文本的数组。这个包围框可以被看作文本周围的“包围框”。数组拆解如下：\n\
  \n| 元素 | 定义 |\n| :--- | :--- |\n| 1 | `x` 左下角坐标 |\n| 2 | `y` 左下角坐标 |\n| 3 | `x`\
  \ 右下角坐标 |\n| 4 | `y` 右下角坐标 |\n| 5 | `x` 右右上坐标 |\n| 6 | `y` 右右上坐标 |\n| 7 | `x` 左上角坐标\
  \ |\n| 8 | `y` 左上角坐标 |\n\n列表 18.8 显示了在图中放置 TrueType 字体的代码。图 18.7 显示了使用 `ImageTTFText()`\
  \ 的结果。\n\n**列表 18.8：TrueType 字体 (ttf.php)**\n\n```php\n<?php\nheader (“Content-type:\
  \ image/png”);\n\n$im = ImageCreate (300, 40);\n\n$grey = ImageColorAllocate ($im,\
  \ 230, 230, 230);\n\n$black = ImageColorAllocate ($im, 0, 0, 0);\n\nImageTTFText($im,\
  \ 20, 0, 10, 25, $black, “arial.ttf”, “Figure 18.7: TrueType Fonts!”);\n\nImagePng\
  \ ($im);\n\nImageDestroy ($im);\n?>\n```\n\n*注意：如果同一目录下没有 arial.ttf，它将会报错。如果你无法访问\
  \ arial.ttf，互联网上有许多漂亮的 TrueType 字体可以替代。*\n\n![Image 102](img/index-598_1.png)\n\n\
  ## 识别文本区域：ImageTTFBBox()\n\n我们现在进入了最后的冲刺阶段。在拥有绘制柱状图所需的所有内容之前，你还需要学习一个新函数。\n\n假设在我们的图像中渲染某些\
  \ TrueType 文本之前，我们需要知道它将占据多大的空间。我们可能需要确保它被正确放置——例如，在特定区域居中。执行此此函数是 `ImageTTFBBox()`；它为我们提供文本的包围框。它简单地返回一个包含包围框角坐标的数组（前一节列出的八个数组元素），基于传入的参数。\n\
  \n`array ImageTTFBBox(int size, int angle, string fontfile, string text)` `ImageTTFBBox()`\
  \ 返回包围框，就像 `ImageTTFText()` 函数一样，但不需要那么多参数。我们只需要知道包围框在我们的图像中占据多少空间。包围框函数只有四个参数。第一个参数是建议使用的字体大小。第二个是绘制文本的角度。第三个参数标识应该使用的字体文件，最后一个参数指定要返回包围框的文本。\n\
  \n让我们看看使用包围框的代码；详细信息见列表 18.9。\n\n\n\n\n\n# 列表 18.9: TrueType 字体边界框 (bbox.php)\n\n\
  ```php\n<?php\nheader (“Content-type: image/png”);\n$font_size = 15;\n$im = ImageCreate\
  \ (300, 500);\n$grey = ImageColorAllocate ($im, 230, 230, 230);\n$black = ImageColorAllocate\
  \ ($im, 0, 0, 0);\n$bbox = ImageTTFBBox($font_size, 0, “arial.ttf”, “Bounding Box!”);\
  \ for($i = 0; $i < 7; $i++)\nImageTTFText($im, $font_size, 0, 10, ($i * ($font_size\
  \ * 2)) + 25, $black, “arial.ttf”, “\\\\$bbox[$i\\] = $bbox[$i\\]”);\nImagePng ($im);\n\
  ImageDestroy ($im);\n?>\n```\n\n574\n\n# 第 18 章\n\n## 生成图形\n\n这段代码比我们之前的大多数 GD 代码都要复杂一些。在这个示例中，我们创建了一个宽\
  \ 300 像素、高 500 像素的图像。接下来，我们使用 `ImageColorAllocate()` 函数分配图像中将使用的颜色。接着有趣的部分来了：我们获取了文本“Bounding\
  \ Box!”的边界框（bounding box）。我们使用了脚本开头设置的 `$font_size` 变量，这样如果以后需要，就可以方便地更改字体大小。我们只需要知道在\
  \ Arial 字体、0 度角度、字体大小为 15 的情况下，“Bounding Box!”文本会占用多少空间。这为我们正确地居中计划中的文本提供了所需信息。\n\
  \n居中文本需要我们从逻辑上思考一下。我们已经知道了图像的宽度。现在我们可以确定要绘制的任何文本的宽度。通过除二，我们可以确定图像和文本的中点。首先，我们必须找到图像的中心像素。\n\
  \n然后，我们取图像的中心像素，减去文本宽度的一半。这便得到了我们可以用于定位文本的 `x` 坐标，从而使其居中。让我们看看我们的算法是否真的奏效；列表 18.10\
  \ 测试了我们的想法。\n\n# 列表 18.10: 使用边界框使文本居中 (text_center.php)\n\n```php\n<?php\nheader\
  \ (“Content-type: image/png”);\n// 定义整个脚本使用的变量\n$text = “Bounding Box!”;\n$font_size\
  \ = 15;\n$height = 500;\n$width = 300;\n$im = ImageCreate ($width, $height);\n$grey\
  \ = ImageColorAllocate ($im, 230, 230, 230);\n$black = ImageColorAllocate ($im,\
  \ 0, 0, 0);\n// 确定允许我们居中图像 $text 的 x 坐标\n$text_bbox = ImageTTFBBox($font_size, 0,\
  \ “arial.ttf”, $text);\n$image_center = $width / 2;\n$text_x = $image_center - round(($text_bbox[4]/2));\n\
  ImageTTFText($im, $font_size, 0, $text_x, 10, $black, “arial.ttf”, $text);\nImagePng\
  \ ($im);\nImageDestroy ($im);\n?>\n```\n\n看来我们的想法奏效了！“Bounding Box!”文本在图像中居中了。现在我们可以居中文本了，这一切归功于边界框函数；这在尝试绘制柱状图时非常有用，因为现在我们能够正确定位坐标轴标签或图注。\n\
  \n![Image103](img/index-600.png)\n\n# 绘制图形 575\n\n## 绘制柱状图\n\n最后，我们看到了所有这些函数调用变成了实用的东西。在进入实现细节之前，请查看我们的函数能做什么：请查看图\
  \ 18.8 和图 18.9 中由我们即将编写的函数生成的两个示例图。\n\n图 18.8：由 PHP 生成的较小图\n图 18.9：由 PHP 生成的较大图\n\
  \n你可能会好奇复用柱状图功能有多复杂；让我们快速看一眼列表 18.11 中用于生成此类图表的代码。\n\n# 列表 18.11: 填充柱状图\n\n```php\n\
  <?php\nrequire(“bar_graph.php”);\nheader (“Content-type: image/png”);\n$height =\
  \ 600;\n$width = 600;\n$x_interval = 23;\n$y_interval = 50;\n$font_size = 12;\n\
  $label_size = 14;\n$scale = 100;\n$bar_width = 20;\n$graph_title = “2001 年每月销售额”;\n\
  $font = “arial.ttf”;\n$graph_labels = array(“Jan”, “Feb”, “Mar”, “Apr”, “May”, “Jun”,\
  \ “Jul”, “Sep”, “Oct”, “Nov”, “Dec”);\n$graph_items = array(89, 56, 23, 60, 78,\
  \ 100, 34, 89, 46, 89, 23);\n$im = bar_graph($height, $width, $x_interval, $y_interval,\
  \ $font_size, $label_size, $scale, $bar_width, $graph_title, $font, $graph_labels,\
  \ $graph_items);\nImagePng($im);\n?>\n```\n\n```就这样！我们真正只需要数据和对我们的柱状图生成函数 `bar_graph()`\
  \ 进行一次简单的调用，就能得到图表了！使用查询或其他源填充图表数据将变得更容易。当然，生成图表的函数并不简单简单。我们将向你展示涉及 `bar_graph()`\
  \ 函数的代码（在列表 18.12 中），然后逐条对其进行审查。\n\n# 列表 18.12: 柱状图函数 (bar_graph.php)\n\n```php\n\
  function bar_graph($height, $width, $x_interval, $y_interval, $font_size, $label_size,\
  \ $scale, $bar_width, $graph_title, $font, $graph_labels, $graph_items, $bg_color\
  \ = “F0F0”, $text_color = “FF66”, “0000”) {\n    $edge_padding = 50;\n    $graph_height\
  \ = $height - $edge_padding;\n    $graph_width = $width - $edge_padding;\n    $scale_unit\
  \ = $graph_height / $scale;\n    $im = @ImageCreate ($width, $height) or die (“无法创建图像”\n\
  \    if (strlen($bg_color) == 6) {\n        $red = hexdec(substr($bg_color,0,2));\n\
  \        $green = hexdec(substr($bg_color,2,2));\n        $blue = hexdec(substr($bg_color,4,2));\n\
  \        ImageColorAllocate($im, $red, $green, $blue);\n    } else {\n        ImageColorAllocate($im,\
  \ 240, 240, 240);\n    }\n    if (strlen($text_color) == 6) {\n        $red = hexdec(substr($text_color,0,2));\n\
  \        $green = hexdec(substr($text_color,2,2));\n        $blue = hexdec(substr($text_color,4,2));\n\
  \        ImageColorAllocate($im, $red, $green, $blue);\n    } else {\n        ImageColorAllocate($im,\
  \ 0, 0, 0);\n    }\n    // 垂直边界\n    ImageLine($im, $edge_padding, $edge_padding,\
  \ $edge_padding, $height-$edge_padding, $text_color);\n    // 水平边界\n    ImageLine($im,\
  \ $edge_padding, $height-$edge_padding, $width-$edge_padding, $height-$edge_padding,\
  \ $text_color);\n    // 水平数字\n    $num_lines = $graph_height / $y_interval + 1;\n\
  \    for($i = 0; $i < $num_lines; $i++) {\n        $start_x = $edge_padding / 2;\n\
  \        $start_y = ($height - $edge_padding) - ($i * $y_interval);\n        $end_x\
  \ = $width - $edge_padding;\n        ImageLine($im, $start_x, $start_y, $end_x,\
  \ $start_y, $text_color);\n        // 捕捉除零错误\n        if($i) {\n            ImageTTFText($im,\
  \ $font_size, 90, $edge_padding-25, $start_y - 5, $text_color, $font, ceil(($i *\
  \ $y_interval) / $scale_unit));\n        }\n    }\n    // 柱体\n    for($i = 0; $i\
  \ < count($graph_items); $i++) {\n        $start_x = (($x_interval + $bar_width)\
  \ * $i) + $edge_padding;\n        $end_y = ($scale_unit * $graph_items[$i]);\n \
  \       $end_y = $height - $edge_padding - $end_y;\n        $bar_points = array();\n\
  \        $bar_points[0] = $start_x;\n        $bar_points[1] = $height - $edge_padding;\n\
  \        $bar_points[2] = $start_x;\n        $bar_points[3] = $end_y;\n        $bar_points[4]\
  \ = $start_x + $bar_width;\n        $bar_points[5] = $end_y;\n        $bar_points[6]\
  \ = $start_x + $bar_width;\n        $bar_points[7] = $height - $edge_padding;\n\
  \        ImageFilledPolygon ($im, $bar_points, 4, $bar_color);\n        $font_y\
  \ = ($height - $edge_padding)+ 5;\n        $bar_label_bbox = ImageTTFBBox($font_size,\
  \ 90, $font, $graph_labels[$i]);\n        $label_width = abs($bar_label_bbox[4]);\n\
  \        $label_height = abs($bar_label_bbox[3]);\n        ImageTTFText($im, $font_size,\
  \ 90, $start_x + $label_width, $font_y + $label_height, $text_color, $font, $graph_labels[$i]);\n\
  \    }\n}\n```\n*(注：由于原文代码块 18.12 存在严重的语法错误，如括号未闭合、变量定义不完整等），翻译时保留了原始的错误结构以符合要求)*\n\
  \n\n\n\n\n```php\n$title_bbox = ImageTTFBBox($label_size + 5, 0, $font, $graph_title);\
  \ $image_center = $width / 2;\n\n$text_x = $image_center - round(($title_bbox[4]/2));\n\
  \nImageTTFText($im, $label_size + 5, 0, $text_x, 25, $text_color,\n\n$font, $graph_title);\n\
  \nreturn $im;\n\n}\n\n?>\n```\n\n# 绘制图表\n\n 579\n\n我们应该为这个函数提供一个合适的原型，并对每个参数的作用进行简要解释。\n\
  \n`image bar_graph(int height, int width, int x_interval, int y_interval, int font_size,\
  \ int label_size, int scale, int bar_width, string graph_title, string font, array\
  \ graph_labels, array graph_items[], string bg_color[], string bar_color[], string\
  \ text_color[])`\n\n这个函数有十五个参数！我们知道这看起来很多，但它确实让图表具有非常高的可配置性。参数定义如下：\n\n| 参数 | 描述\
  \ |\n| :--- | :--- |\n| `height` | 图像高度 |\n| `width` | 图像宽度 |\n| `x_interval` |\
  \ 柱状图出现的间隔（像素） |\n| `y_interval` | 横线出现的间隔（像素） |\n| `font_size` | 用于柱标签和线条标签的大小\
  \ |\n| `label_size` | 标题的大小 |\n| `scale` | 图表可以达到的最大数值 |\n| `bar_width` | 柱状的宽度\
  \ |\n| `graph_title` | 在图表顶部居中的标题 |\n| `font` | 使用的字体文件 |\n| `graph_labels` | 每个柱状图标签的字符串数组\
  \ |\n| `graph_items` | 用于绘图的实际数字 |\n| `bg_color` | 背景颜色 |\n| `bar_color` | 柱状图颜色\
  \ |\n| `text_color` | 所有文本（如标签和标题）的颜色 |\n\n**注意**：我们创建的 `bar_graph()` 函数最后三个参数是可选的。\n\
  \n对于其实现的功能来说，这个函数其实并不大。前 50 多行是简单的检查，确保我们可以处理传入的所有数据而不会引起任何错误。在整个函数中，我们做了一个调用者无法修改的假设：图像边缘与实际绘制图表区域之间的边距大小。我们留了\
  \ 50 像素，以便绘制图表的文本和标题。50 像素在图像中是非常占空间的，但这为大多数图表的文本留出了足够的间距。\n\n 580\n\n## 第 18 章\n\
  \n### 生成图形\n\n在设置了 `$edge_padding` 之后，我们有以下三行：`$graph_height = $height - $edge_padding\
  \ * 2;`, `$graph_width = $width - $edge_padding - $bar_width;`, `$scale_unit = $graph_height\
  \ / $scale;`。\n\n这些执行了一些基础计算。我们必须确定可以绘制的高度和宽度。这意味着我们必须从高度和宽度中减去边距。接下来我们计算 `$scale_unit`，它用于函数内部的一些计算；我们稍后会讨论它的作用。然后我们验证颜色输入，并将\
  \ HTML 风格的十六进制三元组颜色转换为 GD 风格的小进制颜色分配，并将这些颜色赋值给变量供以后使用。\n\n最后，我们到了有趣的部分。前两个有趣的调用是绘制垂直和水平图表边界的调用。我们只需要从左下角开始画一条线，并考虑到图像边缘的边距。这为我们提供了代表可绘制区域的线条。接下来，我们需要知道要绘制多少条横线。这是通过将可绘制的高度除以\
  \ `$y_interval` 计算出的，`$y_interval` 是横线在 y 上出现的像素间隔。\n\n我们为每条线循环一次，使用 `ImageLine()`\
  \ 函数画一条横线。在画完每条线后，我们确保自己不在第 0 行，然后为每个字母绘制文本。\n\n这个小巧的设计正是我们设置 `$scale_unit` 变量的原因之一。\n\
  \n```php\n/* 捕获除零错误 */\nif($i)\nImageTTFText($im, $font_size, 0, ($edge_padding-25),\
  \ $start_y - 5, $text_color, $font, ($i * $y_interval) / $scale_unit);\n```\n\n\
  前几个参数没什么特别的。`x` 和 `y` 位置是如何推导出来的很容易理解。文本颜色和字体也很容易。困难的部分在于确定要显示的实际数字！第一步是确定行号并将其乘以我们的\
  \ `$y_interval`。\n\n代码行：\n`$num_lines = $graph_height / $y_interval + 1;`\n\n告诉我们我们必须画十条线（500\
  \ / 50）。在接下来的 `for` 循环中，我们检查当前处于哪几行，通过计算间隔乘以行号来确定其垂直位置，然后从总图表高度中减去该值。\n\n棘手的部分结束了。现在我们有了横线和标签，对于这些标签，我们需要柱状图和它们的标签。我们只需为每个项目循环一次，绘制跨越线条。柱状图的绘制是\
  \ 90 度。在画完所有柱状图后，最后一步是完成，绘制标题，标题位于屏幕顶部居中。所有绘制完成后，我们返回图像。\n\n# 现实情况考虑\n\n 581\n\n\
  ### 现实情况考虑\n\n#### 明智地使用 GD\n柱状图是 GD 功能在现实应用中的极佳示例。可以创建许多其他图表；限制在于程序员的想象力。但请记住，GD\
  \ 只是一个编程库；旨在取代专业的绘图程序。\n\n#### 其他实现：调查亭\n既然我们已经有了柱状图，为什么不在调查亭中使用它呢？柱状图非常适合展示调查数据。虽然创建一个调查系统超本书的范围，但具备创建图表的能力无疑是增色。\n\
  \n#### 负载考虑\n在典型的 Web 应用中，创建图像是非常消耗处理器内存的。如果生成图形的环境负载较大，最好仔细考虑生成图像的时机。仅仅因为图像吸引眼球并不意味着它们总是最佳答案，甚至并非必要。\n\
  \n*本页特意留*\n\n![Image 105](img/index-608_1.jpg)\n\n## 第 19 章\n\n### 电子邮件\n\n虽然电子邮件很少是\
  \ Web 应用的核心关注，但如果你正在构建一个交互式网站，很可能会遇到需要处理电子邮件的情况。例如，自动生成的电子邮件通常用于在网站发生变化时提醒订阅者。许多在线出版商提供“将此文章发送给朋友”的功能，允许读者将网页内容自动发送给他人。其他网站提供\
  \ Web 电子邮件服务，使用户可以从任何计算机检查其电子邮件账户。在线明信片尽管很难挂在冰箱上，但也很流行。\n\n如既往一样，PHP 让在你的网站中构建电子邮件功能变得非常轻松。发送电子邮件非常简单；检查电子邮件账户中的新消息也是轻而易举。当你开始在\
  \ Web 电子邮件应用程序中处理复杂的混合电子邮件时，情况可能会变得具有挑战性，但在大多数情况下，使用 PHP 处理电子邮件不会给你带来很多麻烦。\n\n\n\
  \n\n要通过 PHP 脚本访问远程邮箱（例如，如果你想设置一个受密码保护的网页，以便在离开办公位时检查电子邮件，这就会非常有用），你应该使用 PHP 的互联网消息访问协议\
  \ (IMAP) 扩展。该扩展为华盛顿大学提供的用于邮件处理的 `c-client` 库提供了一个接口。虽然你可以“自己编写”一个脚本来连接到邮件服务器并读取收件箱内容，但使用该扩展更加可靠，特别在使用\
  \ IMAP 的情况下，操作要简单得多。\n\n## 了解电子邮件\n\n每封电子邮件都由两个且仅有的两个部分组成：一个包含消息信息的信封，以及消息的内容（或称正文）。例如，以下就是一个完整的电子邮件消息：\n\
  \n收件人：eddie-ray@example.com\n\n发件人：billy-bob@example.net\n\n主题：冷笑话\n\n日期：Wed, 30\
  \ Jan 2002 14:55:08 +0800\n\n你听说过那种新式的灯芯鹅绒枕头吗？\n\n584\n\n## 第 19 章\n\n### 电子邮件\n\
