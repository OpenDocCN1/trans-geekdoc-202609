  \n最后，当你完成对项目检出副本的工作后，可以使用 `release` 命令“发布”你的副本。除了“让 CVS 知道”你认为已经完成了该文件的处理之外，这实际上并没有真正做什么。然而，你仍然可以进行并提交更改。与\
  \ `-d` 选项一起使用时，`release` 命令更有意义：CVS 实际上会删除工作副本。使用 `release` 而不是手动删除文件的处是，CVS 会自动检查你是否忘记提交任何更改，并在项目的历史文件中记录你放弃该检出副本的事实。\n\
  \n```\n$ cd /home/bjorn\n$ cvs release -d foomail ui/login.php\nYou have altered\
  \ files in this repository. Are you sure you want to release (and delete) ‘foomail’:\
  \ yes\nls foomail: No such file or directory\n```\n\n 高级功能\n\n虽然 CVS 的许多功能超出了本章的范围，但某些功能值得提及，即使只是简单带过：\n\
  \n- 使用“监听（watches）”，可以配置 CVS 在每当有其他 CVS 用户修改特定文件或一组文件时，自动通过电子邮件向你发送通知。\n- “标签（Tags）”允许你将一组特定的版本标记为属于特定的组。例如，如果你某天决定项目中的源代码已经准备好作为版本\
  \ 2.0 发布，你可以为所有文件打上标签 `v2_0` 标记，这样每个文件的当前版本将就会永久性地标记为属于该组的一员。你甚至可以继续编辑代码并创建新版本；以后你只需要从\
  \ CVS 仓库中拉取标记为 `v2_0` 的版本，砰地一下！你的版本 2.0 就准备就绪了。\n- 历史文件允许你跟踪程序员所做的更改，甚至可以收集每个开发者产生了多少\
  \ CVS 活动的统计数据。\n- 你可以建立网络可访问的 CVS 仓库，允许大楼另一侧（或世界另一端）的程序员与其他人使用同一组源文件工作。关于在 Unix\
  \ 下设置 CVS 服务器的说明，请参阅 `www.cvshome.org/docs/manual/cvs_2.html#SEC26`。\n对于 Windows\
  \ 版 CVS 服务器实现，请参阅 `www.cvsnt.org`。 使用 WinCVS 和 MacCVS\n\n可以说，从命令行使用 CVS 并不是所有人，特别是对于不习惯在\
  \ Unix 风格环境下工作的人。幸运的是，有一些可以在 Windows 和 Macintosh 上的 CVS 图形界面（甚至还有为 Linux 机器构建的基于\
  \ GTK 的界面）可以作为客户端。\n\n*提示：访问 www.cvsgui.org 下载这些应用程序*\n\n从图 14.1 中眼花缭眼的菜单、按钮和消息可以看出，CVS\
  \ 的复杂性仍然存在。但 GUI 可以帮助新手更容易接触源文件。\n\n图 14.1 使用 WinCVS 浏览 Foomail 项目\n\n从 WinCVS 处理远程\
  \ CVS 仓库的步骤与使用 Unix 命令行客户端所采取步骤并不相似。主要的障碍是弄清楚连接的正确设置应该是什么。\n\n为了设置 WinCVS 连接到服务器，你必须首先确定服务器使用的是什么连接方法。如果是其他人运行\
  \ CVS 服务器，最好的办法是与他们交流，看看他们能否帮助你完成整个过程。如果你自己设置了 CVS 服务器，那么你应该能够自己弄清楚 ...\n\n从 WinCVS\
  \ 连接到远程服务器：\n\n1. 如果这是你第一次启动 WinCVS，程序将显示 WinCVS Preferences 对话框（如图 14.2 所示）。如果不是，选择\
  \ Admin ➢ Preferences 打开它。\n\n图 14.2 WinCVS Preferences 对话框\n\n2.\n\n\n\n在标记为 `Enter\
  \ The CVSROOT` 的文本框中，按以下格式输入服务器的连接字符串：`[*username*@ *host*]:/*path*/ *to*/ *cvsroot*`。如果\
  \ CVS 服务器运行在你运行 WinCVS 的同一台机器上，则 `*username*@ *host*` 部分（后面跟着一个冒号）并非必要的。`/path*/\
  \ *to*/ *cvsroot` 部分用于告诉服务器你想使用哪一个 CVS 仓库（是的，即使只有一个）。\n\n### 3.\n\n在 `Authentication`\
