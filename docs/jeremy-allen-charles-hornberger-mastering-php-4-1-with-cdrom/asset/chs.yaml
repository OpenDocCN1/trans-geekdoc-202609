  \n一旦你确保 PHP 已经针对你的邮件服务器进行了正确配置，就可以运行一个简单的测试来确保一切工作正常。列表 19.1 中的代码将向 `user@example.com`\
  \ 发送测试消息；修改它以发送到你的地址，然后执行脚本（通过在浏览器中加载或在命令行中运行，如果你安装了 PHP 命令行执行文件）并检查你的邮件以确认其到达。\n\
  \n\n\n\n```php\n$body = ‘This is a test. This is only a test.’;\n\n$response = mail\
  \ ($to, $subject, $body);\n\nif ($response == false)\n    print (“Error sending\
  \ mail; please check your mail log for details.”); \nelse\n    print (“Message sent.\\\
  n<pre>To: $to\\nSubject:$subject\\n\\n$body</pre>);\n\n?>\n```\n\n我们将日期添加到了邮件的主题行中作为一种标识符，这样在你多次调用此脚本时，就可以判断特定的邮件是否已成功发送。如果邮件没有出现在你的收件箱中，你应该检查邮件服务器的日志文件（通常类似于\
  \ `/var/log/maillog`）以获取详情。请注意，邮件可能不会立即出现；许多邮件服务器不会立即将消息发送到最终目的地，而是将其添加到待处理消息队列中，并定期进行处理。\n\
  \n你并不局限于使用 `mail()` 函数发送简单的纯文本电子邮件。只需极少的努力，你就可以使用 PEAR 中的 `Mail_mime` 类创建复杂的多部分消息（即带有附件的邮件以及同时包含文本版本和\
  \ HTML 版本的双版本消息）。\n\n## 从头开始编写 POP 客户端\n\n邮局传输协议（POP）非常简单，仅需原始套 连接和一些字符串比较就可以轻松模拟电子邮件客户端的起点。然而，正如我们将展示的那样，使用\
  \ IMAP 扩展会让你受益浅，因为它为华盛顿大学强大的 `c-client` 库提供了接口。\n\n## 第 19 章\n\n### 电子邮件\n\nPOP\
  \ 协议仅提供对远程邮件服务器上单个邮箱箱的访问。它的设计允许用户登录并检索服务器上所有等待他们的邮件，然后断开与服务器的连接。这通常被称为*离线*模式读信。通常，邮件在客户端应用程序拉取后，会立即或不久后从服务器的邮箱箱中删除。相比之下，较新、更强大且更复杂的\
  \ IMAP 协议旨在允许*在线*访问多个邮箱箱，使用户可以像在本地电子邮件应用程序中存储邮件那样将邮件存储在服务器上。\n\n尽管 IMAP 有明显的功能优势，但\
  \ POP 仍然是远程邮件访问最流行的协议。其极其简单可能是可能的原因。为了说明这一点，让我们看一下脚本（列表 19.2），该脚本列出了 POP 收件箱的内容。\n\
  \n### 列表 19.2: 使用原始套接字的 POP 客户端 (pop_nocclient.php)\n\n```php\n<?php\n\nfunction\
  \ pop_connect ($hostname, $username, $password) {\n    global $POP_ERR;\n    $socket\
  \ = fsockopen ($hostname, 110);\n    if (!$socket) {\n        $POP_ERR = “Couldn’t\
  \ open socket”;\n        return false;\n    }\n    fgets ($socket, 1024);\n    if\
  \ (!fwrite ($socket, “USER $username\\n”)) {\n        $POP_ERR = “Couldn’t write\
  \ to socket”;\n        return false;\n    }\n    $response = fgets ($socket, 1024);\n\
  \    if (substr ($response, 0, 3) != “+OK”) {\n        $POP_ERR = “Server returned\
  \ ‘$response’”;\n        return false;\n    }\n    if (!fwrite ($socket, “PASS $password\\\
  n”)) {\n        $POP_ERR = “Couldn’t write to socket”;\n        return false;\n\
  \    }\n    $response = fgets ($socket, 1024);\n    if (substr ($response, 0, 3)\
  \ != “+OK”) {\n        $POP_ERR = “Server returned ‘$response’”;\n        return\
  \ false;\n    }\n    return $socket;\n}\n\nfunction pop_list ($socket) {\n    global\
  \ $POP_ERR;\n    if (!fwrite ($socket, “LIST\\n”)) {\n        $POP_ERR = “Couldn’t\
  \ write to socket”;\n        return false;\n    }\n    $response = fgets ($socket,\
  \ 1024);\n    if (substr ($response, 0, 3) != “+OK”) {\n        $POP_ERR = “Server\
  \ returned ‘$response’”;\n        return false;\n    }\n    while ($response = fgets\
  \ ($socket, 1024)) {\n        if (chop ($response) == “.”)\n            break;\n\
  \        list ($msg_id, $len) = split (“ “, $response);\n        $mqueue[$msg_id]\
  \ = array (“len” => chop ($len));\n    }\n    if (!isset ($mqueue))\n        $mqueue\
  \ = array ();\n    return $mqueue;\n}\n\nfunction pop_retr ($socket, $msg_id) {\n\
  \    global $POP_ERR;\n    if (!fwrite ($socket, “RETR $msg_id\\n”)) {\n       \
  \ $POP_ERR = “Couldn’t write to socket”;\n        return false;\n    }\n    $response\
  \ = fgets ($socket, 1024);\n    if (substr ($response, 0, 3) != “+OK”) {\n     \
  \   $POP_ERR = “Server returned ‘$response’”;\n        return false;\n    }\n  \
  \  $in_header = true;\n    $msg_body = “”;\n    $msg_headers = array ();\n    while\
  \ ($response = fgets ($socket, 1024)) {\n        if (chop ($response) == “.”)\n\
  \            break;\n        if (($in_header == true) && (chop ($response) == \"\
  \")) {\n            $in_header = false;\n            continue;\n        }\n    \
  \    if ($in_header == true) {\n            $msg_body .= $response;\n        } else\
  \ {\n            $msg_headers[] = $response;\n        }\n    }\n    return $msg_body;\n\
  }\n\n?>\n```\n\n\n\n将 `c-client.a` 复制到新位置时，你可能想将文件重命名为类似 `libc-client.a` 以符合标准的命名规范。\n\
  \n完成所有操作后，你就可以准备重新编译带有 IMAP 支持的 PHP 了。只需运行带有 `--with-imap` 选项的 `./configure`，然后\
  \ `make` 和 `make install`。如果你是以静态 Apache 模块形式运行 PHP，则也需要重新编译 Apache。\n\n## 使用 IMAP\
  \ 扩展读取电子邮件\n\n尽管使用 IMAP 扩展会极地简化工作并使代码更不容易出错，但处理复杂的邮件内容仍然……嗯，很复杂。问题在于 MIME 编码的消息（可能包含许多嵌套部分）在恰当处理时具有一定的挑战性。我们将在本章的后半部分介绍两种处理\
  \ MIME 编码数据的技术。\n\n除了将邮件内容作为网页的一部分进行检索和展示外，IMAP 扩展还允许你：\n\n◆ 从 IMAP 和 POP 邮件服务器中删除邮件\n\
  ◆ 在 IMAP 文件夹之间移动邮件\n◆ 创建、重命名和删除 IMAP 文件夹\n◆ 按日期、到达时间、发件人姓名、主题、TO 字段内容、CC 字段内容和大小对邮件排序\n\
  \nIMAP 扩展甚至提供了处理 NNTP 服务器新闻的机制（尽管我们在本章中不会讨论这方面；详情请参见 `www.php.net/manual/en/ref.imap.php`）。\n\
  \n## 第 19 章\n\n### 电子邮件\n\n#### 注意事项\n\n在接下来的两个小节中，我们将（几乎）完整地描述了通过 POP3 和 IMAP 协议访问邮件所需的各种函数和技术。虽然这两个协议之间存在许多关键差异，但也存在许多相似之处。如果你从头到尾阅读这一章，你会发现大量的重复。\n\
  \n我们决定为仅对其中某一种协议感兴趣的人包含冗余信息，以便每个小节都能提供关于如何从邮件服务器检索邮件的完整描述。\n\n## 使用 POP3 访问邮件\n\n\
  一旦安装了 IMAP 扩展，登录 POP3 服务器将变得轻而易举。你需要使用的函数是 `imap_open()`，它返回一个所谓的 IMAP 流（IMAP stream）。事实上，IMAP\
  \ 流是一个资源，类似于 `odbc_connect()` 返回的数据库句柄。`imap_open()` 的原型如下：\n\n```\nint imap_open\
  \ (string mailbox, string username, string password [, int flags])\n```\n\n第一个参数是“邮箱箱指定符”，它定义了连接类型（POP\
  \ 或 IMAP）、服务器名称、使用的端口，以及对于 IMAP 邮件服务器，要打开的远程邮箱箱名称。该指定符是一个特殊构造的字符串，在 POP 中具有以下结构：\n\
  \n`{mailhost[:port][/protocol]][mailbox]`\n\n大括号用于包含指定符中的邮件主机名、端口和协议部分。（如中括号所示，端口、协议和邮箱箱部分都是可选的，但通常为了清晰起见应该使用它们）。要连接到位于\
  \ `pop.example.org` 且端口为 110（POP3 流量的标准端口）的 POP3 机器，用户名为 `foo`，密码为 `bar`，你可以写：\n\
  \n```\n$conn = imap_open ('{pop.example.org:110/pop3}INBOX', 'foo', 'bar');\n```\n\
  \n#### 注意事项\n\n事实上，`/protocol` 部分可以包含比仅协议指定符更多的信息，你并不限于仅指定 `/pop3` 或 `/imap`。你可以要求使用\
  \ `/pop3/ssl` 或 `/imap/ssl` 进行 SSL 加密连接，或者仅通过 `/pop3/tryssl` 或 `/imap/tryssl` 指定你偏好此类连接。参见文件\
