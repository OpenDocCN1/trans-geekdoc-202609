  \ 65](img/index-457_1.png)\n\n432 \n\n## 第 14 章\n\n### Web 应用开发\n\n如果一切顺利，你很快就能在本地硬盘上拥有一个远程项目的副本。\n\
  \n你可以按照我们在上一节中讨论的相同的方式处理这些文件……尽管这次你将有一个 GUI 来帮助你完成这些步骤。\n\n### 使用 cvsweb\n\n`cvsweb`\
  \ CGI 脚本是那些想要以更丰富、更易访问的形式查看源代码的程序员的最爱。它由 Bill Fenner 在 1996 年用 Perl 语言编写，随后由 Henner\
  \ Zeller 等人接管，它允许你快速方便地通过 Web 将 CVS 根目录暴露给世界。后来，Greg Stein 用 Python 版本对其进行了重写和扩展，命名为\
  \ `ViewCVS`。`ViewCVS` 和 `cvsweb` 被用于整个 Web，特别是在 SourceForge 网站 (www.sourceforge.net)，在那里，`ViewCVS`\
  \ 允许网络用户在浏览器中舒适地检查源码树。例如，你可以通过以下地址使用（还能什么？）`ViewCVS` 查看 `ViewCVS` 本身的源代码：\n\n`http://cvs.sourceforge.net/cgi-bin/viewcvs.cgi/viewcvs/`\n\
  \n\n\n\n库文件中的代码——在 PHP 世界中通常被称为“包含文件”——应该尽可能地减少副作用。库文件可能会调用 `exit()` 或 `die()` 并终止脚本处理，这应该是绝对不可接受的；这只会让你更难从脚本的“顶部”（即浏览器在发送请求时实际调用的\
  \ PHP 脚本）开始，并深入追踪所有需要和包含的文件，以找出脚本是在何时以及为何中断的。库文件可能不应该被允许使用 `print()` 或 `echo()`\
  \ 生成输出，因为这可能会干扰其他地方定义的任何输出机制——特别是 `header()` 和 `setcookie()`。诚然，输出缓冲确实在很大程度上减轻了这一担忧；请参阅\
  \ \n\n`www.php.net/manual/en/ref.outcontrol.php`\n\n## 到底，错误看起来是什么样子的？\n\nPHP 的面向对象特性使得人们可以非常容易地发明各种异常类，用于错误报告和错误处理代码块。与其尝试使用\
  \ `-1` 或 `False` 等返回代码来报告错误，为什么不在发生错误时简单地实例化异常对象（*类似于* Java 或 Python）并将其返回给调用者呢？异常对象是通信应用状态的一种得强大的手段；你可以使用成员变量来存储关于错误发生位置和原因的错误消息数组，这在调试时比一个简短的\
  \ `-1` 要有用得无限倍。使用这种方法，你的代码不需要尝试弄清楚为什么某个函数返回了 `-1`；相反，它可以检查异常对象：`$result = my_function();`\n\
  \n```\nif (is_subclass_of ($result, ‘Exception’)) {\n    print (“Errors occurred\
  \ when calling my_fuction():\\n”);\n    while (list ($k, $v) = each ($result->errors))\n\
  \    print (“$v (CODE: $k)\\\\n”);\n}\n```\n\n### 维护代码\n\n维护代码是在应用程序中追踪漏洞、实现新功能和提高性能的过程。它并不是编写应用程序中最光彩的部分——毕竟，大部分从无到有的创造工作在维护考虑出现之前就已经完成了——但它是必要且不可避免的。\n\
  \n维护代码可能是一场噩梦，也可能仅仅平淡无奇。如果是后者，你就很幸运。\n\n当维护代码需要巨大的精力投入时，情况可能会变得非常不愉快，主要因为所有精力往往都花在了试图弄清楚原始程序员到底在想什么上。换句话说，这并不是一项很有成就感的智力挑战。（这有点像用脚学织毛——你*可以*做到，但难道没有更重要的事要做吗？）这就是为什么，如果你在维护别人的代码却弄不清楚它是如何工作的，维护可能会变得极其沮丧。然而，这并不比维护你自己的代码却不明白它是如何工作的要糟糕得多。\n\
  \n事实证明，易读且易于理解的代码要容易维护得多。你有三种基本方法可以让你的代码更容易于维护。\n\n1. 首先，选择一组像上面概述的那样的基本规则并*坚持遵守它们！*\n\
  2. 第二，尽量尽可能简单直接地编写你的代码。\n3. 第三，尽早且频繁地为你的代码编写注释。有些程序员声称他们不需要注释，因为他们的代码太完美了；即使对他们保留意见，注释在维护期间也具有巨大的价值。\n\
  \n你的代码执行的操作越多，出现问题的概率就越大。这就是为什么可重用代码的设计要是稳定、可靠且可预测的。如果你能通过清晰编写的文字感受到一段代码的意图，你通常可以准确发现是哪里出了问题。\n\
  \n## 重用代码\n\n在开发应用程序时，还有另一种方法可以节省你的时间（和金）：将代码模块化。然而在实践中，创建可重用代码说起来做起来难。通常，当你发现一个允许通用解决方案的问题时，你应该尝试仔细编写实现该解决方案的代码。某些问题如输出缓存、表单处理、身份验证和数据库访问自然更适用于通用解决方案。处理更特定问题的代码\n\
  \n要了解其他 PHP 开发者是如何处理这个问题的，请查看随 PHP 分发的 PEAR 库。PEAR 模块的作者一直在尝试日志、数据库访问、错误处理、文件处理、网络和\
  \ HTML 生成等常见问题编写通用解决方案。尽管 PEAR 项目仍然年轻，但使用它提供的库将让你很好地感受到通用代码在增加可靠性和节省时间方面所能做的。\n\n\
  ## XML 和 XHTML\n\n“XML 是未来！”如果你关注软件行业新闻，自 1996 年底可扩展标记语言亮相以来，你可能一直在听到这句话，专家们预言它将彻底改变网络计算。但到目前为止，XML\
  \ 并没有能引发计算革命；软件的工作方式与 1995 年基本没有区别。\n\n\n\n\n`XML` 的支持者们似乎在期待这种。（在这一点，也许我们可以预期 `XML`\
  \ 狂热者开始争辩，也许 `XML` 现在还不是未来，但很快就会是！）从根本上说，`XML` 是一种简单且多功能的标记技术，旨在帮助我们跨网络和平台交换数据。得益于这种简单性和多功能性，它已成为相关技术的基础，包括专门用于操作\
  \ `XML` 数据的工具（通过 `XQuery`、`XSLT` 和 `XPath` 等技术）以及在 `HTTP` 上构建分布式应用程序的协议（如 `SOAP`\
  \ 和 `XML-RPC`）。随着 `XHTML` 1.0 和 1.1 的发布，`XML` 也被用于标准化和提高 `HTML` 的扩展性。\n\n在本章中，我们将介绍\
  \ `XML` 背后的一些核心概念，看看你如何通过 `PHP` 处理 `XML` 文档，并快速查看如何处理第三方源的数据（当然是标记为 `XML` 文档的数据）。我们还将查看\
  \ `XHTML` 的新特性——`HTML` 的最新版本，在该版本中，这种备受推崇的 Web 标记语言被重新实现为基于 `XML` 的语言。\n\n### 介绍\
  \ XML\n\n`XML` 的核心承诺是允许应用程序之间无缝数据交换。在过去，数据交换一直是一个噩梦，因为程序员倾向于使用自定义的专有系统在内部存储信息。每当用户需要从应用程序中提取数据并在其他地方使用时，问题就会出现。诸如制表符分隔文件的粗略导出机制可以处理某些信息，但只有简单的数据集才能放入这种简单、僵化的容器中。另一种解决方案是编写过滤器将数据从一种专有解决方案翻译成另一种，这种方法被理认为是低效的（你必须为每一对应用程序编写一个翻译器）。\n\
  \n**438**\n\n## 第 15 章\n\n### XML 与 XHTML\n\n`XML` 承诺了第三种方法。通过使用标准工具来读取、写入和操作 `XML`\
  \ 文档，应用程序可以轻松高效地处理数据导出和导入工作。`XML` 具有足够的扩展性（名副如此），能够容纳大多数数据类型——从图像文件到整数——以及大多数应用程序。\n\
  \n为了读取和写入 `XML` 文档，你需要一个 `parser`（解析器）。`parser` 仅仅是一个理解 `XML` 语法的软件；它并不了解 `XML`\
  \ 文档的内容，但它知道如何处理 `XML` 文档的不同部分。当你编写处理 `XML` 文档的 `PHP` 脚本时，你将使用一个由某个热心的人编写的 `parser`，它在后台运行，帮助你与文档交互。这就是\
  \ `XML` 的优点之一：有专业级的工具（其中许多是免费的）可以帮助你完成工作。\n\n`XML` 并不是一种属于自己的语言；它通常被描述为一种“元语言”，可用于构建其他标记语言。但这并没有真正捕捉到\
  \ `XML` 能让你做事情的精髓。更通俗地说，`XML` 本质上是一组用于构建结构良好的标记信息树的规则。\n\n我们可以使用 `XML` 技术来描述几乎任何事物，从甜点食谱到电子邮件信息，从稀有币收藏到商业交易，当然还有网页。此外，通过文档类型定义（`DTDs`），我们可以为基于\
  \ `XML` 的语言构建语法规则系统，以便每个描述（例如）商业交易的文档都将以标准方式构建。\n\n\n\nXML 文档必须是良好格式（well-formed）的这一严格要求意味着编写\
  \ XML 文档需要系统地进行。尽管对于新手来说，这似乎是一个相当苛刻的要求，但它具有非常巨大的益处。首先，这种“良好格式”（well-formedness）尽管名字起不好听，但对于那些希望使用应用程序与\
  \ XML 文档交互的人来说是一个福音。如果没有严格的规则，编写此类应用程序几乎是不可能的。但由于所有 XML 文档都遵循相同的规则，编写这些应用程序的程序员知道自己的预期，并实际上可以编写出允许以\
  \ XML 格式进行操作、修改和共享数据的程序。相比之下，XHTML 之前的 HTML 处于一种相对放任的状态，元素、标签和属性可以被随意丢弃，几乎不考虑任何严谨的结构。\n\
  \n请注意，良好格式并不能告诉我们文档是否符合我们正在处理的特定文档类型的任何规则；它只是告诉我们文档看起来是否正常。在很多情况下，当然你需要的比文档结构是否“合法（legal）”更多的信息；你需要知道它是否“正确（correct）”。考虑一个描述银行交易的\
  \ XML 文档——假设是资金从一个账户转到另一个账户。列表 15.2 显示了此类 XML 文档的非常简单的版本。\n\n**列表 15.2：用 XML 表示银行转账\
  \ (transfer.xml)**\n\n```xml\n<?xml version=”1.0” encoding=”UTF-8\"?>\n<transfer>\n\
  \  <amount currency=”USD”561.02</amount>\n  <date>2001-12-20</date>\n  <from>\n\
  \    <acctnum>54433-12312</acctnum>\n  </from>\n</transfer>\n```\n\n# 介绍 XML\n 441\n\
  \n列表 15.2 中 XML 的问题在于，虽然它是完全良好格式的，但它完全没有用处，因为它没有告诉我们钱去了谁那里！我们需要的是一种`验证（validate）`文档的方法，以确保它遵循专门描述银行转账的\
  \ XML 文档的所有规则。为了做到这一点，我们必须对规则进行编码。我们如何做到这一点？我们召唤出那个被称为神奇的、丑陋的怪兽——`文档类型定义（DTD）`。\n\
  \n### 注意\n`DTD` 并不是定义特定类型 XML 文档的“内容模型”（即控制元素、属性、文本等的出现和顺序的规则集）的唯一方法。你也可以使用较新的 `XML\
  \ Schema（XML Schema）` 方法；这在 W3C 一本非常清晰的入门书中有所描述，可以在 www.w.org/TR/xmlschema-0/ 获取。然而，`DTD`\
  \ 方法出现得更早，且目前使用得更广泛。\n\nDTDs 并不是为了供人类阅读的，尽管它们并不太难理解。它们基本上定义了特定类型 XML 文档结构和内容的合法规则。列表\
  \ 15.3 显示了我们银行转账文档的 `DTD` 可能看起来什么样。\n\n**列表 15.3：银行转账文档的 DTD (transfer.dtd)**\n\n\
  ```dtd\n<!ELEMENT transfer (amount, date, from, to)>\n<!ELEMENT amount (#PCDATA)>\n\
  <!ATTLIST amount\n  currency PCDATA #REQUIRED>\n<!ELEMENT date #PCDATA>\n<!ELEMENT\
  \ from acctnum>\n<!ELEMENT to acctnum>\n<!ELEMENT acctnum #PCDATA>\n```\n\n这应该很好理解，即使你以前从未见过\
  \ `DTD`。我们的 `DTD` 规定：\n\n* `transfer` 元素必须包含一个由一个 `amount` 元素、一个 `date` 元素、一个 `from`\
  \ 元素和一个 `to` 元素组成的组。\n* `amount` 元素可以包含字符数据（`#PCDATA` 是该术语；它实际上代表“解析后的字符数据”）。\n\
  * 此外，`amount` 元素必须携带一个属性，即 `currency` 属性（你看，它是 `#REQUIRED`），它本身可以包含字符数据。\n\n以此此类推：`date`\
  \ 元素可以包含字符数据，`from` 和 `to` 元素必须各包含一个 `acctnum` 元素，而 `acctnum` 元素可以包含字符数据。\n\n现在，既然我们有了这套花哨的新规则，如何使用它们呢？答案很简单：在我们的\
  \ XML 文档的导言中添加一个 `DOCTYPE` 声明，使其变为：\n\n```xml\n<?xml version=”1.0” encoding=”UTF-8\"\
  ?>\n<!DOCTYPE transfer SYSTEM “transfer.dtd”>\n<transfer>\n  <amount currency=”USD”561.02</amount>\n\
  \  <date>2001-12-20</date>\n  <from>\n    <acctnum>54433-12312</acctnum>\n  </from>\n\
  </transfer>\n```\n\n![Image 67](img/index-467_1.png)\n442\n\n## 第 15 章：XML 和 XHTML\n\
  \n正如你可能猜到的那样，`DOCTYPE` 声明只是表示该文档旨在符合系统资源 `transfer.dtd` 中找到 `DTD`。\n\n为了查看我们的文档是否有效，我们可以使用微软的\
  \ XML 解析器，它作为 ActiveX 对象在 Internet Explorer 运行；你可以在 msdn.microsoft.com/downloads/samples/internet/xml/xml\\\
  _validator/default 下载解析器。当我们从列表 15.2 加载 `transfer.xml` 文件（缺少 `to` 元素）并点击 `验证` 时，解析器会崩溃，如图\
  \ 15.1 所示。\n\n然而，如果我们通过添加 `to` 元素使文档匹配 `DTD`，解析器就没有任何问题，如图 15.2 所示。顺便提一下，由于微软的解析器实际上会检查文档是否符合其，这种解析器被称为验证解析器。许多解析器实际上并不进行验证，这些被称为非验证解析器。PHP\
  \ 内置解析函数使用的 Expat 就是一种非验证解析器。\n\n![Image 68](img/index-468_1.png)\n443\n\n**图 15.1\
  \ 成功**\n\n### 元素\n元素是 XML 文档的构建块。与 HTML 不同（HTML 元素主要作为处理指令，“这里加粗”，“在这里画线”），XML 中的元素通常具有语义化作用——换句话说，它们识别了它们包含的内容类型。\n\
  \n正如你在 15.1 示例电子邮件中看到的，每个元素的名称定义了它所包含的数据。（尽管如此，并没有阻止我们在创建 XML 文档时选择无意义或误导性的元素名称，但这真的会违背初衷。）当我们沿着文档的每个分支向下移动时，元素的名称定义的内容越来越具体。因此，`message`\
  \ 元素包含整封电子邮件，`header` 元素包含邮件头信息，`from` 元素包含关于发送者的信息，而 `name` 元素包含发送者的姓名。\n\n元素可以包含其他元素、字符数据、实体、处理指令，或它们的任何组合——除非，当然，它们是空元素，在这种情况下它们不能包含任何内容。\n\
  \n### 属性\n与 HTML 一样，属性可用于指定元素的附加信息。然而，有几个值得注意的区别。\n\n与 XHTML 之前的 HTML 版本不同，XML 文档不允许任何“独立”属性。这意味着，例如，旧的\
  \ `td` 表格单元 `nowrap` 属性（通常写为 `<td nowrap>`）现在必须完整写为 `<td nowrap=”nowrap”>`……也就是说，如果\
  \ `nowrap` 属性仍然是 HTML 标准的一部分的话。\n\n在 XML 中，属性通常用于以下几个特殊用途：\n\n* 为元素分配 ID\n* 通过 ID\
  \ 引用其他元素\n* 确保值属于合法列表\n\n\n\n例如，在一个包含银行交易列表的文档中，你可能会使用属性来唯一标识每笔交易，并建立交易之间的关系。考虑一个列出支票账户昨日交易记录的\
  \ XML 文档，它显示了每笔交易的日期、类型和金额，以及关于交易的“详情”信息和交易执行后的账户余额：\n\n```xml\n<transactions>\n\
  <acctnum>12345-54321</acctnum>\n<transaction id=\"20020204.160434.12345.0\">\n<date>2002-02-04\
  \ 16:04:34 -0500</date>\n<type>debit</type>\n<amount currency=\"USD\">212.39</amount>\
  \ own<balance>-34.12</balance>\n<detail>Check No. 733</detail>\n</transaction>\n\
  <transaction id=\"20020204.160822.12345.0\" refid=\"20020204.160434.12345.0\">\n\
  <date>2002-02-04 16:08:22 -0500</date>\n<type>fee</type>\n<amount currency=\"USD\"\
  >-24.00</amount>\n<balance>-58.12</balance>\n<detail>Overdraft fee ($24)</detail>\n\
  </transaction>\n<!-- etc... -->\n</transactions>\n```\n\n如你所见，该文档显示了两个笔交易：一笔是支付的支票，导致客户出现透支，因为余额跌入负数区域；另一笔是银行向客户收取的透支费。`transaction`\
  \ 元素的 `id` 和 `refid` 属性允许文档表达这两笔交易之间的关联性。\n\n该示例交易列表的 DTD 也可以为 `amount` 元素的 `currency`\
  \ 属性提供一组合法值列表，以便验证解析器仅接受如“USD”、“GBP”和“MXN”等标准值作为有效值。\n\n### 实体 (Entities)\n\n在 XML\
  \ 文档中，`entities`（实体）既提供了包含预定义内容的简写，也提供了引入外部对象的手段。它们可用于简单的任务，如插入特殊字符（以防它们与“真实”标记冲突）或样板文本，也可用于更复杂的操作，例如在文档中间插入二进制数据（如\
  \ JPEG 图像）。\n\n### 引入 XML 445\n\nXML 标准包含了一小组用于针对特殊字符 `<`、`>`、`&`、`'` 和 `\"` 的预定义实体。它们定义在表\
  \ 15.1 中。要通过实体名称或 Unicode 值来标识字符，需以与 符号开头并以分号结尾：`&lt;` 和 `&60;` 均产生一个“小于”符号的左角括号。\n\
  \n**提示**\n附录 C 提供了完整的 XHTML 实体列表。\n\n**表 15.1：XML 中的预定义实体**\n\n| 实体 | 字符 | 数值 (Unicode)\
  \ 值 |\n| :--- | :--- | :--- |\n| lt | < | 60 |\n| gt | > | 62 |\n| amp | & | 38\
  \ |\n| apos | ' | 39 |\n| quot | \" | 34 |\n\n这些实体可以使用其名称或数值值引用，允许我们安全地向文档中插入特殊字符，如下所示：\n\
  \n```xml\n<picnic date=\"one &quot;fine&quot; day\" />\n<genre>Rock &#39;n&#39;\
  \ Roll</genre>\n<example>\nwhile ($i &lt; 10)\nprint ($i);\n</example>\n```\n\n\
  事实上，任何字符都可以通过其 Unicode 值在字符集中引用，以便我们能够安全地向文档中插入特殊字符，例如：\n\n```xml\nwhile ($i &lt;\
  \ 10)\nprint ($i);\n```\n\n如果你正在编写 DTD，也可以定义自己的实体。例如，使用 DTD 声明：\n\n```xml\n<!ENTITY\
  \ baseurl \"www.example.com\">\n```允许文档包含 `baseurl;`，例如：\n\n```xml\n<url>&baseurl;</url>\n\
  ```\n\n解析器会将其转换为：\n\n```xml\n<url>www.example.com</url>\n```\n\n**446**\n\n实体被进一步分为\
  \ *general entities* 实体（如此处所示）和 *parameter entities*（参数实体，后者仅在 DTD 中使用）。\n\n###\
  \ XML 与 XHTML\n\n实体可分为 `parsed entity` 实体（会被解析器展开）和 `unparsed entity` 实体（会被原样保留）。\n\
  \n### 注释 (Comments)\n\nXML 也支持熟悉的注释语法。由于 XML 文档通常不是为了人类阅读，注释并不常见，但对于调试非常有用。例如，如果你的\
  \ XML 文档包含一系列 `<transaction>` 块，你可能会使用注释来标记块的开始和结束，如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!-- =============================================\n\
  <!-- BEGIN TRANSACTIONS ============\n<!-- =============================================\
  \ -->\n<transaction id=\"20020204.160434.12345.0\">\n<date>2002-02-04 16:04:34 -0500</date>\n\
  <type>debit</type>\n<amount currency=\"USD\">212.39</amount>\n<balance>-34.12</balance>\n\
  <detail>Check No. 733</detail>\n</transaction>\n<transaction id=\"20020204.160822.12345.0\"\
  \ refid=\"20020204.160434.12345.0\">\n<date>2002-02-04 16:08:22 -0500</date>\n<type>fee</type>\n\
  <amount currency=\"USD\">-24.00</amount>\n<balance>-58.12</balance>\n<detail>Overdraft\
  \ fee ($24)</detail>\n</transaction>\n<!-- ... 等，共 8 页 ... -->\n<!-- =============================================\n\
  <!-- END TRANSACTIONS ============\n<!-- =============================================\
  \ -->\n```\n\n### 空格 (White Space)\n\n与 HTML 不同，大多数 XML 解析器倾向于将元素内部的空白视为*显著的*（至少这通常是它们的默认行为）。这意味着，如果你的\
  \ XML 文档包含片段：\n\n```xml\n<foo> <bar>baz</bar> </foo>\n```\n\n那么标准的 XML 解析器应该报告 foo\
  \ 元素不仅包含子元素 bar，还包含两段字符数据——在这种例中是两个空格（”）。\n\n\n\n\nPHP 提供了多种处理 XML 数据的方法，每种方法都适用于特定的任务。你可以使用\
  \ XML 解析器中的老将 `Expat` 高效地解析并处理 XML 文档。或者，你可以使用 `libxml` 库中尚未完成但功能强大的 DOM 接口访问 XML，或者通过\
  \ `Sabolron` 使用 `XSLT` 将 XML 文档转换为其他格式。\n\n## Expat 与 DOM\n\n在解析 XML 文档时，有两种不同的方法：`stream-oriented`（流式）解析和\
  \ `tree-based`（基于树的）解析。它们是完全不同的方法，且各有优劣。\n\n流式解析器（也称为 `event-based`（事件型）解析器）将 XML\
  \ 文档视为输入的数据流。当你使用流式解析器时，你分块将 XML 文档传递给解析器，解析器会根据你设置的规则对到达的数据进行处理。本质上，解析器按顺序处理每个不同的部分——每个元素、字符数据块、注释或处理指令——然后等待下一个块的馈入。（你可以将其想象成一种流水线作业：文档的各个碎片在传送带上快速流过，解析器在它们经过时机械地处理每一个。）虽然这种方式可以很高效（因为任何时候只需要在内存中存储\
  \ XML 文档的一小部分），但在这种方式处理 XML 时，很难进行复杂的操作。\n\n在将数据馈给流式解析器之前，你通常通过通过一组规则来 `configure`（配置）解析器，以便在遇到开始标签、结束标签、字符数据或处理指令时执行这些规则。\n\
  \n虽然对于简单的 XML 文档来说这很容易，但随着 XML 文档变得越来越复杂，挑战性也随之增加。本质上，你必须为处理文档设计一套特定的指令，以便解析器能够像机器一样处理数据。如果你的\
  \ XML 文档由数百个嵌套标签组成，你会发现配置解析器变成了一项极其枯燥且复杂的工作。\n\n经典的流式解析器是 `Expat`，这是一个由 James Clark\
  \ 编写的免费、开源非校验解析器。`Expat` 是一个 `C` 库，可以集成到其他应用程序中，它可能是世界上使用最广泛的 XML 解析器。我们将在后的“使用\
  \ Expat 解析”章节中讨论如何使用基于 `Expat` 的 PHP XML 解析函数。\n\n其他标准的流式 XML 解析器使用 `SAX` 接口。与 `Expat`\
  \ 不同，存在许多不同的 `SAX` 解析器实现；它们的共同点是 `SAX` API，它 定义了一组标准函数，用于在解析器处理文档时与其进行交互。底层解析器是用\
  \ `C`、`Java`、`Python` 还是任何其他语言编写并不重要；应用程序使用解析器的方式是根据 `SAX` API 的规范进行标准化的。\n\n流式解析器并不是对所有情况都完美。在某些情况下，你可能希望能够作为一个整体来处理\
  \ XML 文档，而不是将其作为流经机械解析器的数据流。基于树的解析器允许你将整个 XML 文档加载到内存结构中，并轻松地检查和操作树的各种节点。如果你需要 `modify`（修改）XML，基于树的解析器允许你将整个\
  \ XML 文档加载到内存结构中，并轻松地检查和操作树的各种节点。\n\n**448**\n\n## 第 15 章\n\n### XML 与 XHTML\n\n\
  虽然对于简单的 XML 文档来说这很容易，但随着 XML 文档变得越来越复杂，挑战性也随之增加。本质上，你必须为处理文档设计一套特定的指令，以便解析器能够像机器一样处理数据。如果你的\
  \ XML 文档由数百个嵌套标签组成，你会发现配置解析器变成了一项极其枯燥且复杂的工作。\n\n经典的流式解析器是 `Expat`，这是一个由 James Clark\
  \ 编写的免费、开源非校验解析器。`Expat` 是一个 `C` 库，可以集成到其他应用程序中，它可能是世界上使用最广泛的 XML 解析器。我们将在后的“使用\
  \ Expat 解析”章节中讨论如何使用基于 `Expat` 的 PHP XML 解析函数。\n\n其他标准的流式 XML 解析器使用 `SAX` 接口。与 `Expat`\
  \ 不同，存在许多不同的 `SAX` 解析器实现；它们的共同点是 `SAX` API，它 定义了一组标准函数，用于在解析器处理文档时与其进行交互。底层解析器是用\
  \ `C`、`Java`、`Python` 还是任何其他语言编写并不重要；应用程序使用解析器的方式是根据 `SAX` API 的规范进行标准化的。\n\n流式解析器并不是对所有情况都完美。在某些情况下，你可能希望能够作为一个整体来处理\
  \ XML 文档，而不是将其作为流经机械解析器的数据流。基于树的解析器允许你将整个 XML 文档加载到内存结构中，并轻松地检查和操作树的各种节点。如果你需要 `modify`（修改）XML，基于树的解析器允许你将整个\
  \ XML 文档加载到内存结构中，并轻松地检查和操作树的各种节点。\n\n**449**\n\n### XML 与 XHTML\n\n```php\n<?php\n\
  $xml = “<para>Here’s some character data</para>”;\n$parser = xml_parser_create ();\n\
  \nif (xml_parse ($parser, $xml, true))\n    print (“Your XML document is well-formed.”);\n\
  else\n    print (“Your XML document is not well-formed.”);\n\nxml_parser_free ($parser);\n\
  ?>\n```\n\n**450**\n\n### XML 与 XHTML\n\n\n\n\n`xml_parser_create()` 函数在后台创建一个解析器，并返回一个资源标识符，我们可以使用该标识符来引用我们创建的解析器。（这类似于数据库连接函数或\
  \ `opendir()` 函数，它们返回资源标识符，供我们用于从数据库或文件系统中获取信息。）\n\n`xml_parse()` 函数负责实际处理 XML 文件内容的工作。\n\
  \n我们调用它的次数，以及向它传递多少（或多少少）XML 数据，实际上没有限制。解析器本身会“跟踪”我们在 XML 文档中的位置，以便它可以检查文档的良好性（well-formedness），并在发生错误时我们错误发生的位置。当我们没有更多数据传递给解析器时，可以将\
  \ `True` 作为（可选的）第三参数传递给解析器，让解析器知道我们已完成（并让解析器检查确保没有遗留的错误，例如未关闭的标签）。例如，我们可以将上述的单个\
  \ `xml_parse()` 调用拆分为两个步骤，如下所示：\n\n```php\n$l = strlen ($xml);\n$r = xml_parse ($parser,\
  \ substr ($xml, 0, floor ($l / 2)));\n$r = xml_parse ($parser, substr ($xml, floor\
  \ ($l / 2)), true);\n```\n\n注意，通过检查 `xml_parse()` 的返回值，我们可以判断源 XML 文档中是否存在错误。如果\
  \ Expat 遇到非法 XML，它将返回 `False`——例如非法嵌套的元素、已打开但未关闭的元素、未用引号括的属性值等。（但，正如我们上面提到的，Expat\
  \ 是一个非校验解析器，这意味着它所检查的良好性；它不会根据 DTD 检查文档内容以确保其符合该 DTD 规定的内容模型。）在前面的示例中，我们只执行了三个基本解析步骤中的两个：创建解析器和向解析器提供数据。为了实际上对\
  \ XML 文档*执行*某些操作，我们必须配置解析器。我们通过创建用户定义函数并并将它们注册为解析器的“处理器（handlers）”来实现这一点。对于任何工作过图形用户界面的人来说，处理器函数（必须以某种方式处理鼠标点击和按键等用户事件）是熟悉的：它是每当发生某种类型的事件时，程序都会自动调用的函数。在\
  \ Expat 的上下文中，这意味着虽然*你*必须定义处理器函数，但*解析器*将在适当的时候为你调用它们。例如，我们可以通过添加两行代码来修改上面的函数，以打印\
  \ XML 中的字符数据：\n\n```php\n<?php\nfunction cdata_handler ($parser, $data) { print\
  \ ($data); }\n\n$xml = “<para>Here’s some character data</para>”;\n$parser = xml_parser_create\
  \ ();\n\nxml_set_cdata_handler ($parser, ‘cdata_handler’);\n\nif (xml_parse ($parser,\
  \ $xml, true))\n    print (“Your XML document is well-formed.”);\nelse\n    print\
  \ (“Your XML document is not well-formed.”);\n\nxml_parser_free ($parser);\n?>\n\
  ```\n\n现在，每当解析器在其 XML 输入中遇到某些字符数据时，它就会调用用户定义的函数 `cdata_handler()`，该函数随后只是打印这些字符数据。这揭示了关于\
  \ Expat 处理器的规则之一：它们必须接受一组特定的参数。另一种说法是，每个用户定义的处理器函数必须匹配特定的签名（*signature* 是对特定数量参数的专业术语，每个参数具有特定类型）。当处理器函数被调用时，来自\
  \ XML 文档的相关数据将被放入这些参数中。例如，注册为字符数据处理器的函数必须接受两个参数——解析器和字符数据。当它调用 `cdata_handler()`\
  \ 时，解析器会自动将这些参数传递给它。这就是为什么像 Expat 这样的解析器被称为基于事件的解析器；解析器将输入数据视为一系列“事件”，并调用处理器函数来对这些事件做出反应。\n\
  \n*注意*\n\n注意，不能依靠 Expat 仅对每块连续文本调用一次其字符数据处理器；更有可能的是它会被调用多次。请参见后文的章节“字符数据处理器（Character\
  \ Data Handlers）”。\n\n**表 15.2:** Expat 处理器函数\n\n| 处理器 (Handler) | 调用时机 |\n| :---\
  \ | :--- |\n| 开始元素处理器 (Start element handler) | 遇到起始元素 |\n| 结束元素处理器 (End element\
  \ handler) | 遇到结束元素 |\n| 字符数据处理器 (Character data handler) | 遇到字符数据 |\n| 处理指令处理器\
  \ (Processing instruction handler) | 遇到处理指令 |\n| 外部实体处理器 (External entity handler)\
  \ | 遇到对外部实体的引用 |\n| 默认处理器 (Default handler) | 遇到任何内容（如果没有定义特定的处理器） |\n\n## 第 15\
  \ 章：XML\n\n### 配置解析器\n\n一旦你定义了处理器函数，你就需要将它们注册到解析器。这是配置解析器以按你意愿运行的第一步。我们用于此此的函数有：\n\
  \n- `xml_set_element_handler($parser, $start_element_name, $end_element_name)`\n\
  - `xml_set_character_data_handler($parser, $handler_name)`\n- `xml_set_processing_instruction_handler($parser,\
  \ $handler_name)`\n- `xml_set_default_handler($parser, $handler_name)`\n- `xml_set_external_entity_ref_handler($parser,\
  \ $handler_name)`\n\n在每情况下，`xml_set_*handler()` 函数都将解析器的资源 ID 作为第一个参数，并将处理器函数的名称作为后续参数（或）。只有\
  \ `xml_set_element_handler()` 函数接收两个名称。其他的都要求一个。\n\n第二步是配置解析器使用的各种选项。在接后的示例中，我们只更改了一个选项，`XML_OPTION_CASE_FOLDING`。启用后，解析器将自动将所有元素和属性名称转换为大写。虽然它默认开启，但\
  \ XML 规范明确指出元素和属性名称大小写敏感，因此我们选择将其关闭。\n\n另一个支持的选项是 `XML_OPTION_TARGET_ENCODING`，它指定了解析器对\
  \ XML 文档中发现的任何数据应使用的编码（例如，你的 XML 文档可能是 ISO-8859-3 字符集编码的，但你可能希望将值转换为 Unicode 字符集\
  \ UTF-8）。支持的值包括“ISO-8859-1”、“US-ASCII”和“UTF-8”。\n\n### 开始元素\n\n开始元素处理器必须接受三个参数，如下签名所示：`handler_func(int\
  \ parser, string name, array attribs)`。\n\n当解析器调用它时，参数将包含以下值：\n\n| 参数 | 说明 |\n|\
  \ :--- | :--- |\n| *parser* | 解析器的资源标识符 |\n| *name* | 解析器遇到的元素名称 |\n| *attribs*\
  \ | 元素的属性 |\n\n\n\n\n一个包含元素属性名称和值的关联数组。因此，对于元素 `<product id=”200” instock=”n\">`，`name`\
  \ 属性将被设置为“product”，而 `attribs` 数组将包含两个元素，如下例所示：\n\n```php\n$attribs = [\n  'id'\
  \ => '200',\n  'instock' => 'n'\n]\n```\n\n可以使用 `each()` 函数从 `attribs` 中提取键值对。\n\
  \n# PHP 与 XML\n453\n\n## 元素结束处理器 (End Element Handlers)\n\n元素结束处理器必须接受两个参数，如下所示的签名所示：`handler_func(int\
  \ parser, string name)`。\n\n当它被解析器调用时，参数将包含以下值：\n\n| 参数 | 说明 |\n| :--- | :--- |\n\
  | `parser` | 解析器的资源标识符 |\n| `name` | 遇到结束标签的元素名称（例如，如果标签是 `</foo>`，则 `$name` 的值将为“foo”）\
  \ |\n\n元素结束处理器通常与全局变量一起使用，以“提取出标签中的所有字符数据”。基本技术是编写一个字符数据处理器，将它找到的所有字符数据存储在某个全局变量中，例如\
  \ `$text_found`。然后，每当遇到结束标签时，对 `$text_found` 的内容进行操作（例如，打印出来、存储在全局数组中或写入文件），并清除\
  \ `$text_found` 的内容（即 `$text_found = '';`）。这种简单的技术适用于许多 XML 文档，这些元素包含子元素或字符数据，但两者不同兼备。如果文档的\
  \ DTD 允许包含字符数据和子元素的复杂元素，则需要额外的逻辑。\n\n## 字符数据处理器 (Character Data Handlers)\n\n字符数据处理器必须接受两个参数，如下所示的签名所示：`handler_func(int\
  \ parser, string data)`。\n\n当 `handler_func` 被解析器调用时，其参数将包含以下值：\n\n| 参数 | 说明 |\n\
  | :--- | :--- |\n| `parser` | 解析器的资源标识符 |\n| `data` | 解析器缓冲区中的字符数据 |\n\n关于 Expat\
  \ 中的字符数据处理器，有两个重要的点需要注意。首先，解析器并不保证何时调用处理器。面对诸如 `<foo>bar</foo>` 这样的 XML 块，解析器可能只调用一次\
  \ `handler_func`，并将 `$data` 的值设置为“bar”，也可能调用三次，首先将 `$data` 的值设置为“b”，然后是“a”，最后是“r”。\n\
  \n（诚然，这不太可能，但你明白意思：解析器只有在它想做的时候才会将其装满字符数据的缓冲区交给你的处理器函数……而且无法保证它何时认为是执行此操作的好时机。）\n\
  \n其次，如上所述，元素标签之外的空白字符通常被解析器“视为是有意义的”，这是一种简洁的说法，意味着如果元素包含回车、换行符、制表符或空格，解析器将调用字符数据处理器函数。因此，如果你的\
  \ XML 包含以下片段（注意第一个标签后的换行以及其他地方空格）：\n\n```xml\n<foo>\n  <bar>baz</bar> </foo>\n```\n\
  \n454\n\n## 第 15 章：XML 与 XHTML\n\n那么解析器将至少调用你的字符数据处理器三次：第一次将 `$data` 的值设置为 `\\n`（如果你的系统使用换行符，则为\
  \ `\\r\\n`）；第二次将 `$data` 的值设置为“baz”；最后一次将 `$data` 的设置为 \"\"。事实上，它可能会调用七次——每发现一个元素标签之外的字符就调用一次。\n\
  \n为了忽略 XML 内部出现的无意义空白字符，你需要编写一个字符数据处理器来测试 `$data` 是否包含除了元素标签以外的字符。\n\n```php\nif\
  \ (trim($data) != \"\")\n// ignore it\n```\n\n**警告**：由于你无法知道解析器何时调用字符数据处理器，这种简单的测试可能会对标签的内容产生意想不到的影响。这种情况发生在\
  \ `$data` 包含除了元素标签以外的字符时。\n\n## 处理指令处理器 (Processing Instruction Handlers)\n\n处理指令处理器必须接受三个参数，如下所示的签名：`handler_func(int\
  \ parser, string target, string data)`。\n\n当解析器调用 `handler_func` 时，参数将包含以下内容：\n\n\
  | 参数 | 说明 |\n| :--- | :--- |\n| `parser` | 解析器的资源标识符 |\n| `target` | 指令的名称 |\n|\
  \ `data` | 解析器调用的额外数据 |\n\n例如，示例 15.4 显示了一个使用处理指令处理器的脚本，它展示了如何处理处理指令。\n\n**示例 15.4：解析处理指令\
  \ (pi.php)**\n\n```php\n<?php\nfunction pi_handler($p, $target, $data) {\n    if\
  \ ($target == \"exec\") {\n        // do something\n        print(\"Processing instruction:\
  \ $data\\n\");\n    }\n}\n$xml = \"<?exec ls -l ?><foo />\";\n$p = xml_parser_create\
  \ ();\nxml_set_processing_instruction_handler($p, 'pi_handler');\nif (!xml_parse($p,\
  \ $xml, true)) {\n    die(sprintf(\"Parse error in <code>%s</code> (%s)\", htmlspecialchars($xml),\
  \ xml_error_string(xml_get_error_code($p))));\n} else {\n    print(\"XML processing\
  \ complete.\\n\");\n}\nxml_parser_free($p);\n?>\n```\n\n\n\n外部实体引用处理程序是一个特殊的家伙。如前文所述，外部实体引用是对另一个资源的引用（通常是一个文件，并且通常是一个包含需要解析的更多\
  \ XML 的文件）。当你的解析器遇到外部实体引用时，它会将关于该外部实体的信息传递给外部实体引用处理程序。从那时起，就取决于你决定对它所引用的资源进行什么操作。\n\
  \n外部实体引用可以在 DTD 中使用以下两种形式之一进行声明：\n\n```xml\n<!ENTITY *name* SYSTEM “*uri*\">\n<!ENTITY\
  \ *name* PUBLIC “*publicId*” “*uri*”>\n```\n\n在任何一种情况下，`name` 都指定了引用实体时使用的名称，而 `uri`\
  \ 指定了可以找到资源的位置。因此，`uri` 可能指向本地文件系统中的文件、网络地址或任何其他有效的 URI。（或者如 XML 标准更正式地描述的那样，`uri`\
  \ “是一个 URI 引用……旨在被解析以获取 XML 处理器用于构建实体的替换文本的输入。”）`publicId` 是一个永久的正式名称，其目的是通过 URI\
  \ 以外的方法唯一标识资源；资源并不一定需要公共 ID，但它们在某些情况下会有帮助。例如，W3C 的 XHTML 1.1 DTD 的公共标识符为\n\n```xml\n\
  -//W3C//DTD XHTML 1.1//EN\n```\n\n外部实体引用处理程序必须接受五个参数，签名所示：`handler_func(int parser,\
  \ string openEntityNames, string base, string systemId, string PublicId)`。\n\n当处理程序被调用时，参数将包含以下值：\n\
  \n| 参数 | 描述 |\n| :--- | :--- |\n| `parser` | 解析器的资源标识符 |\n| `openEntityNames` |\
  \ “打开”的实体名称的逗号分隔列表（不用担心这意味着什么；处理简单实体引用时并非必须的） |\n| `base` | 用于解析资源地址的基 URI |\n|\
  \ `systemId` | 资源的 URI |\n| `publicId` | 资源的公共 ID |\n\n### XML 和 XHTML\n\n外部实体引用处理程序应该使用\
  \ `systemId` 和 `publicId` 值来定位资源，然后对其进行适当处理。如果外部资源是另一个需要解析的 XML 文件，处理程序应该创建另一个解析器并解析文件的内容。（但请注意，引用的\
  \ XML 文件可能包含指向另一个 XML 文件的外部实体引用；因此，你的处理程序应该能够被递归调用。查看 `www.php.net/manual/en/ref.xml`\
  \ 中的示例代码以了解如何这样做。）\n\n理论足够了——让我们开始编写解析 XML 的 PHP 脚本。我们将处理一个简单的 XML 文件，其中包含一个人的联系信息，就像你在联系人数据库中找到的那样。文档如列表\
  \ 15.6 所示。\n\n#### 列表 15.6：标记为数据的联系记录 (contact.xml)\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<contact id=\"43956\">\n  <personal>\n\
  \    <name>\n      <first>Jerry</first>\n      <middle>J.</middle>\n      <last>Jenkins</last>\n\
  \    </name>\n    <title>Account Manager</title>\n    <employer>First National</employer>\n\
  \    <dob>1971-12-22</dob>\n  </personal>\n  <address>\n    <street>454 Main St.</street>\n\
  \    <city>Los Angeles</city>\n    <state>CA</state>\n    <zip>90045</zip>\n  </address>\n\
  \  <tel>\n    <home>555-323-543</home>\n    <mobile>555-298-5643</mobile>\n    <fax>555-656-7823</fax>\n\
  \  </tel>\n  <internet>\n    <email>jenkins@example.com</email>\n    <aim>jjenk777</aim>\n\
  \  </internet>\n</contact>\n```\n\n你可以看到，该记录包含了关于联系人的基本传记数据（姓名、雇主、出生日期）、地址信息（街道、城市、州和邮政编码）、电话联系信息以及包括联系电子邮件地址和\
  \ AOL Messenger 昵称在内的在线联系信息。信息是以树的形式组织的；像 `<personal>` 和 `<name>` 这样的分支和子分支被用于分组相关数据；关于联系人的实际数据只出现在这些分支的末端（即“叶子”节点）。许多\
  \ XML 文档——遗憾的是，并非所有——都遵循类似的模式，以确保字符数据只出现在树的终端节点（即“叶子”）。\n\n#### 将 XML 转换为 HTML\n\
  \n在处理 XML 时的一项常见任务是将 XML 文档转换为另一种格式。让我们看看列表 15.7 所示的代码，它将我们的联系记录转换为基础 HTML，并将每组相关的“事实”在视觉上分组到不同的章节中。我们想要生成的输出如图\
  \ 15.4 所示。\n\n#### 列表 15.7：将 XML 转换为基础 HTML (xml2html-basic.php)\n\n```php\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\">\n<html>\n<head><title>Parsing\
  \ With Expat and PHP</title></head>\n<body>\n<?php\n$cdata = '';\nfunction start_elem\
  \ ($parser, $name, $attrs) {\n    switch ($name)\n    {\n        case (\"personal\"\
  ):\n            print(\"<p>\"); break;\n        case (\"name\"):\n            print(\"\
  <b><big>\"); break;\n        case (\"address\"):\n            print(\"<p><b>Address</b>\\\
  n\"); break;\n        case (\"tel\"):\n            print(\"<p><b>Telephone</b>\\\
  n\"); break;\n        case (\"internet\"):\n            print(\"<p><b>Internet</b>\\\
  n\"); break;\n        case (\"contact\"):\n        case (\"name\"):\n        case\
  \ (\"first\"):\n        case (\"middle\"):\n        case (\"last\"):\n        case\
  \ (\"title\"):\n        case (\"employer\"):\n        case (\"dob\"):\n        case\
  \ (\"street\"):\n        case (\"street2\"):\n        case (\"city\"):\n       \
  \ case (\"state\"):\n        case (\"zip\"):\n        case (\"home\"):\n       \
  \ case (\"mobile\"):\n        case (\"fax\"):\n        case (\"email\"):\n     \
  \   case (\"aim\"):\n        case (\"homepage\"):\n            break;\n        default:\n\
  \            print(\"<b>Warning: Unknown tag '$name'>\"); break;\n    }\n}\nfunction\
  \ end_elem ($parser, $name) {\n    global $cdata;\n    $cdata = trim ($cdata);\n\
  \    switch ($name)\n    {\n        case (\"personal\"):\n            print(\"</p>\"\
  ); break;\n        case (\"name\"):\n            print(\"</big></name>\"); break;\n\
  \        case (\"first\"):\n            print($cdata . \" \"); break;\n        case\
  \ (\"middle\"):\n            print($cdata . \" \"); break;\n        case (\"last\"\
  ):\n            print($cdata . \" \"); break;\n        case (\"title\"):\n     \
  \       print($cdata . \" \"); break;\n        case (\"employer\"):\n          \
  \  print($cdata . \" \"); break;\n        case (\"dob\"):\n            print($cdata\
  \ . \" \"); break;\n        case (\"address\"):\n            print(\"</p>\\n\");\
  \ break;\n        case (\"street\"):\n            print($cdata . \" \"); break;\n\
  \        case (\"street2\"):\n            print($cdata . \" \"); break;\n      \
  \  case (\"city\"):\n            print($cdata . \" \"); break;\n        case (\"\
  state\"):\n            print($cdata . \" \"); break;\n        case (\"zip\"):\n\
  \            print($cdata . \" \"); break;\n        case (\"tel\"):\n          \
  \  print(\"</p>\\n\"); break;\n        case (\"home\"):\n            print($cdata\
  \ . \" \"); break;\n        case (\"mobile\"):\n            print($cdata . \" \"\
  ); break;\n        case (\"fax\"):\n            print($cdata . \" \"); break;\n\
  \        case (\"internet\"):\n            print(\"</p>\\n\"); break;\n        case\
  \ (\"email\"):\n            print($cdata . \" \"); break;\n        case (\"aim\"\
  ):\n            print($cdata . \" \"); break;\n        case (\"contact\"):\n   \
  \         print(\"</contact>\\n\"); break;\n    }\n}\n?>\n```\n\n\n\n\n\n</body>\n\
  \n</html>\n\n![Image 70](img/index-487_1.png)\n\n**462**\n\n## 第 15 章\n\n### XML\
  \ 与 XHTML\n\n**图 15.4**\n\n`xml2html-basic.php` 的输出\n\n尽管该脚本相当长，但它并不复杂。我们的策略是使用单个全局变量\
  \ `$cdata` 作为缓冲区来存储我们找到的任何字符数据，然后每当我们到达终端节点（例如街道或电子邮件）时，打印该缓冲区的内容。为了实现这一点，我们使用 `xml_set_element_handler()`\
  \ 和 `xml_set_character_data_handler()` 函数向解析器注册了三个处理函数——`start_elem()`、`end_elem()`\
  \ 和 `cdata()`——解析器会在遇到起始元素标签、结束元素标签或字符数据时负责调用这些函数。`start_elem()` 函数和 `end_elem()`\
  \ 函数基本上是大型的 `switch` 语句，其行为取决于调用它们时发现了哪种元素。以下是这三个处理函数如何协作生成联系人记录的 HTML 版本的。\n\n\
  ◆ 当我们找到个人、姓名、地址、电话或互联网的开启标签时，我们使用 `start_elem()` 函数输出相应的 HTML 标签和描述性文本。\n\n◆ `cdata()`\
  \ 函数非常简单：它只是将任何文本数据记录在全局缓冲区 `$cdata` 中。\n\n◆ `end_elem()` 函数是完成大部分工作的地方。在 `end_elem()`\
  \ 中，当我们遇到个人、姓名、地址、电话或互联网的关闭标签时，不仅会输出相应的 HTML 格式，而且当我们到达终端节点时，还会打印 `$cdata` 缓冲区的内容。最后，`end_elem()`\
  \ 负责在打印后从 `$cdata` 缓冲区清除累积的字符数据。\n\n虽然这种技术对于直接生成简单的 HTML 效果良好，但如果我们想生成更复杂的输出，就会变得有些繁琐。因此，我们将改进代码以完成几件事。首先，我们将使用\
  \ HTML 表格让输出看起来更漂亮。其次，我们将使用 CSS 样式表来格式化表格，这样我们的 PHP 就不会被 HTML 标签充斥。第三，我们将重新格式联系人的姓名，使其以“姓，名\
  \ 中”的格式出现。新版本如列表 15.8 显示；输出见图 15.5。\n\n**列表 15.8：从 XML 生成表格 (xml2html-tables.php)**\n\
  \n```html\n<!DOCTYPE HTML PUBLIC “-//W3C//DTD HTML 4.01 Transitional//EN”>\n<html>\n\
  <head>\n<title>Parsing With Expat and PHP</title>\n<style type=”text/css”>\ntable\
  \ {\nborder: 1px black solid;\nfont-family: verdana, helvetica, arial, sans-serif;\n\
  font-size: 10pt;\n}\ntd.hdr {\nborder-style: solid;\nborder-color: black;\nborder-top-width:\
  \ 0px;\nborder-left-width: 0px;\nborder-right-width: 0px;\nborder-bottom-width:\
  \ 1px;\nfont-weight: bold;\nbackground-color: orange;\npadding: 3px;\n}\ntd.empty\
  \ {\nborder-style: solid;\nborder-top-width: 0px;\nborder-left-width: 0px;\nborder-right-width:\
  \ 0px;\nborder-bottom-width: 1px;\nborder-color: black;\nfont-size: 1pt;\n}\ntd.data\
  \ {\npadding: 3px;\n}\n</style>\n</head>\n<body>\n<?php\n$cdata = '';;\n$cur_elem\
  \ = '';;\n$first_name = '';;\n$middle_name = '';;\n$last_name = '';\n```\n\n**464**\n\
  \n## 第 15 章\n\n### XML 与 XHTML\n\n$hdr\\_row = ‘<tr><td class=”hdr” colspan=”2”>%s</td></tr>’\
  \ . “\\\\n”; $data\\_row = ‘<tr><td class=”data”>%s</td><td>%s</td></tr>’ . “\\\\\
  n”; $empty\\_row = ‘<tr><td class=”empty” colspan=”2”&nbsp;</td></tr>’ . “\\\\n”;\
  \ function start_elem ($parser, $name, $attrs) {\nglobal $cur\\_elem;\n$cur\\_elem\
