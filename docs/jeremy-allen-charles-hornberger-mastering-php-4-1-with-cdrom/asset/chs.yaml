  \ 标签。\n\n![Image 8](img/index-38_1.jpg)\n\n探索 PHP\n\n**列表 1.5：高级数据输入页面 (who_are_you_advanced.php)**\n\
  \n```html\n<html>\n<head>\n<title>Who Are You Advanced!</title>\n</head>\n<body>\n\
  <form action=\"you_are_advanced.php\" method=\"GET\">\nPlease fill in the following\
