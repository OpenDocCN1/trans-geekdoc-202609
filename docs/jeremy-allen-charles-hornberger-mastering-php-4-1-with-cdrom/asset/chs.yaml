  \ 90](img/index-584.jpg)\n\n# 第 18 章\n\n## 生成图形\n\n我们已经看到 PHP 在生成非 HTML 内容方面是多么强大的工具，即\
  \ PDF。PHP 绝不仅仅是为了生成文本输出——远非如此。通过出色的 GD 库，还可以生成图像。GD 是一个图形绘图程序，可以与便携式网络图形 (PNG) 和联合图像小组\
  \ (JPEG) 等常用格式配合。使用 PHP 我们可以为许多类型的报告创建高质量、专业的条形图。\n\n### 配置 PHP 创建图像\n\nPHP 使用 GD\
  \ 库来生成图像。为了像本章示例那样使用 GD，必须在 PHP 中正确安装并配置某些库。\n\n### 在 Windows 上配置 GD\n\n如果你在 Windows\
  \ 上使用 PHP，请找到你的 `php.ini` 文件——通常位于 `C:\\WINNT` 文件夹中并打开它。找到像下面这一行：\n`;extension=gd.dll`\n\
  并“取消注释”；即通过删除分号将其变为一个实际选项，而不仅仅是注释。完成后，该行应为：\n`extension=gd.dll`\n重启你的 Web 服务器。（有关重启\
  \ Apache 的更多信息，请参阅附录 A。）只需如此。\n\n在 Linux 上使用 PHP 前，找到你的 `php.ini` 文件——通常位于 `C:\\\
  WINNT` 文件夹中并打开它。找到像下面这一行：\n`;extension=gd.dll`\n并取消注释；即通过删除分号将其变为一个实际选项，而不仅仅是注释。完成后，该行应为：\n\
  `extension=gd.dll`\n重启你的 Web 服务器。（有关重启 Apache 的更多信息，请参阅附录 A。）只需如此。\n\n为了让 GD 生成图像，必须在\
  \ PHP 中正确安装并配置某些库。\n\n![图片 91](img/index-585.jpg)\n![图片 92](img/index-585.jpg)\n\
  \n# 第 18 章 继续\n\n### 生成图形\n\n在现实世界中使用 PDF\n\n557\n\n无损图像压缩（意味着图像在减小尺寸的同时不会丢失清晰）使用\
  \ zlib。\n\n### 安装 zlib\n\n首先安装 zlib；它可以在随附书中找到。将 zlib 提取到你选择的目录。进入 zlib 目录后执行以下命令：\n\
  ```bash\n./configure\nmake\nmake test\n```\n`make test` 完成后，应该显示 zlib 编译正常。默认安装目录为\
  \ `/usr/local`；这对我们来说是可以的。\n\n### 安装 libpng\n\n接下来你需要 libpng，它也可以在书中找到。该库版本为 1.2。假设使用的是\
  \ Linux 系统，在 libpng 目录下执行：\n```bash\ncd scripts\ncp makefile ../\ncd ..\nmake\n\
  make install\n```\n\n### 安装 FreeType\n\n一旦成功安装了 libpng，就可以安装 FreeType，TrueType 字体渲染系统。安装\
  \ FreeType 与大多数源码包有所不同；它使用一种名为 Jam 的更新构建工具。为了简单起见，我们将使用 Red Hat 自带的 GNU `make`。\n\
  \n我们希望将 FreeType 编译为共享库，执行以下命令：\n```bash\nmake setup CONFIG=\"--prefix=/usr\"\n\
  make\nmake install\n```\n*注意：有一个特殊修改版本的 Jam 可用，但它不支持旧版本的 Linux。*\n\n![图片 94](img/index-586_1.jpg)\n\
  ![图片 95](img/index-586_2.jpg)\n\n# 图像基础\n\n## 编译 GD\n\n你终于准备好编译 GD 了。GD 的配置有些特殊；如果你不熟悉\
  \ Makefile，可能会非常困难，因此我们提供了一个 Makefile 来简化过程。它在 CD 中名为 `gd_Makefile`。提取 GD 后，确保将\
  \ `gd_Makefile` 从 CD 复制到 `GD-1.8.x` 目录并重命名为 `Makefile`。然后执行以下操作：\n\n## 重新编译 PHP\n\
  \n到这一步，我们已经胜利在望了！现在你只需要重新编译 PHP 并安装新的 PHP 模块。PHP 4.1.1 包含在 CD 中。如附录 A 所示，Apache\
  \ 必须配置为使用 `apxs`，以便后续配置命令生效。\n```bash\n./configure --with-apxs=/usr/local/apache/bin/apxs\
  \ --with-gd=/usr/local --with-png-dir=/usr/local --with-freetype-dir=/usr/local\
  \ --with-zlib-dir=/usr/local\n```\n\n\n\n\n[content]\n\nGD 的目的是创建倾向于简单化的图像；如果你想绘制和修饰照片，请寻找一个好用的绘图程序。如果你准备好学习以编程的方式创建基础图表并执行基础图像操作，那么你来对地方了。\n\
  \n# 第 18 节：生成图形\n\n## 创建图像\n\n在 GD 中执行任何其他操作之前，我们必须创建一个图像，这需要使用 `ImageCreate()`\
  \ 函数。该函数需要两个参数：即将创建的图像的高度和宽度。`ImageCreate()` 返回一个图像资源，所有其他函数都使用它来操作创建的图像。该函数的原型如下：`int\
  \ ImageCreate(int x_size, int y_size)`\n\n在浏览器知道你正尝试向它发送图像之前，你必须先发送一个头部，让它知道内容类型——在我们的案例中是图像。使用以下\
  \ `header()` 调用应该可以工作：\n\n```php\nheader (“Content-type: image/png”);\n```\n\n**注意**\n\
  我们的图像尚未属于特定格式。在调用 `ImagePng()` 或 `ImageJpeg()` 函数之前，我们还没有对应的图像类型。在此之前，GD 在内存中使用其自身的内部格式处理图像。\n\
  \n**注意**\n在整个章节中，我们将专门使用 PNG 格式，但 GD 完全有生成其他格式图像的能力，例如 GIF、JPEG 或 TIFF。如果你希望添加对其他图像类型之一的支持，建议重新编译\
  \ GD 并向 GD 库中添加所需的图像类型支持。\n\n一旦浏览器知道将有一个图像（特别是 PNG），当我们最终给出命令将图像流输出到浏览器时，图像就会被渲染。列表\
  \ 18.1 创建了一个 320×200 像素的图像，背景为灰色，图像左上角有“Hello Images!” 文本。\n\n**列表 18.1：第一张图像 (first_image.php)**\n\
  \n```php\n<?php\nheader(“Content-type: image/png”);\n\n$im = @ImageCreate(320, 200)\n\
  or die(“Could not create image”);\n\n$bg_color = ImageColorAllocate($im, 240, 240,\
  \ 240);\n$text_color = ImageColorAllocate($im, 0, 0, 0);\n\nImageString($im, 3,\
  \ 0, 0, “Hello Images!”, $text_color);\n\nImagePng($im);\n?>\n```\n\n我们在列表 18.1\
  \ 中额外加入了几个函数。图像创建后，会调用 `ImageColorAllocate()` 函数；它为图像内部的使用分配一种颜色。如果该颜色在图像中不存在，则图像中使用的每种颜色都必须使用此函数。该函数需要四个参数：要分配颜色的图像，以及颜色的红、绿、蓝分量的三个值。颜色分量的允许值范围为\
  \ 0–255。`ImageColorAllocate()` 的原型为 `int ImageColorAllocate(int image, int red,\
  \ int green, int blue)`。第一次颜色分配设置了背景颜色，这就是为什么 `$bg_color` 在这段代码中没有再次出现的原因。我们第一次调用\
  \ `ImageColorAllocate()` 将背景设置为红色：240，绿色：240，蓝色：240，这为我们提供了一个深灰色的背景。\n\n![Image\
  \ 96](img/index-588_1.png)\n\n## 图像基础\n\n**提示**\n许多 Web 开发者更习惯使用十六进制格式定义颜色。你可以通过将十六进制三元组拆分为三部分来使用标准的\
  \ HTML 十进制三元组颜色：# FF 00 FF。将每个十六进制位转换为十进制数；转换后，#FF00FF 变成红色 255，绿色 0，蓝色 255。`hexdec()`\
  \ 函数会将每个十六进制位转换为 0–255 之间的数字，只要十六进制数低于 FF。一旦转换为十进制值，颜色就可以轻松地在图像中使用。\n\n我们将第二个 `ImageColorAllocate()`\
  \ 存储在变量 `$text_color` 中，它在 `ImageString()` 函数中用于指定图像内绘制的字符串的颜色。`ImageString()` 是列表\
  \ 18.1 中唯一复杂的函数。`ImageString()` 只是水平绘制文本，但它需要六个参数！\n\n`int ImageString(int image,\
  \ int font, int x, int y, string s, int color)` 第一个参数是用于绘制字符串的图像资源。第二个参数是要使用的字体。如果使用数字\
  \ 1 到 5，它将使用 GD 内置的字体。第三和第四参数是字符串左上角的 `x` 和 `y` 坐标。第五个参数是实际字符串，最后一个参数是文本中使用的颜色。\n\
  \n在我们图像中绘制字符串后，我们就准备好将其发送到浏览器。`ImagePng()` 函数需要一个参数——要发送到客户端的图像流。图像流只是代表我们刚刚创建的图像的图像资源。它是代表我们图像的字节“流”。\n\
  \n`int ImagePng(int image [, string filename\\])`\n\n`ImagePng()` 有一个可选参数 `filename`，用于将图像写入文件而不是直接输出到请求的客户端。\n\
  \n调用 `ImagePng()` 后，我们关闭 PHP 脚本块；就结束了。图 18.1 显示了列表 18.1 的最终产品。\n\n**图 18.1**\n一个\
  \ Hello 图像\n\n**提示**\n记住：使用 `ImageColorAllocate()` 在图像中分配的第一种颜色设置了背景颜色。\n\n## 销毁图像\n\
  \n现在我们知道如何创建图像了，确保 PHP 适当释放创建图像所需的内存是非常重要的。对于特别大的图像，创建图像可能是一个内存密集型过程。`ImageDestroy()`\
  \ 函数允许我们确保任何由图像创建占用的内存被正确释放。`ImageDestroy()` 只有一个参数，即要释放的图像资源：`int ImageDestroy(int\
  \ image)`\n\n在列表 18.1 的底部，关闭 PHP 脚本块之前，添加以下行：`ImageDestroy($im);`\n\n确保在任何脚本中使用\
  \ `ImageDestroy()` 以内存友好。\n\n## 修改现有图像\n\n我们也可以像创建它们一样容易地修改图像。在本节中，你将学习将图像叠加到其他图像上。这种技术在各种应用程序中都有很高的实用。假设你有一张天气地图和一组天气状况。你可以取代表天气状况的小图标（如下雨），并将其叠加在合适的位置。\n\
  \n我们的脚本将文本图像叠加到图形图像上。首先，我们需要创建被叠加的图像。使用列表 18.2 创建较小的图像。\n\n**列表 18.2：要叠加的图像 (create_smaller_img.php)**\n\
  \n```php\n<?php\n$im = @ImageCreate(45, 15)\nor die(“Could not create image”);\n\
  \n$bg_color = ImageColorAllocate($im, 240, 240, 240);\n$text_color = ImageColorAllocate($im,\
  \ 0, 0, 0);\n\nImageString($im, 2, 0, 0, “Smaller”, $text_color);\n\nImagePng($im,\
  \ “smaller.png”);\n\nImageDestroy($im);\n?>\n```\n\n**提示**\n如果你创建图像时遇到困难，请确保 Web\
  \ 服务器对执行脚本的所在目录具有正确的读写权限。\n\n现在我们已经有了图像 smaller.png，我们将它叠加在一个更大的图像上。列表 18.3 展示了\
  \ smaller.png 被绘制在内存中创建的较大图像上（为了清晰起见，这里的较大图像只是一个大灰色矩形）。列表 18.3 的结果如图 18.2 所示。\n\n\
  ![Image 97](img/index-590_1.png)\n\n**列表 18.3：叠加图像 (superimpose.php)**\n\n```php\n\
  <?php\nheader(“Content-type: image/png”);\n\n$src_filename = “smaller.png”;\n$src\
  \ = @ImageCreateFromPng($src_filename)\nor die(“Could not create source image”);\n\
  \n$src_size = GetImageSize($src_filename);\n\n$im = @ImageCreate(320, 200)\nor die(“Could\
  \ not create destination image”);\n```\n\n\n\n\n```php\n<?php\n$bg_color = ImageColorAllocate($im,\
  \ 240, 240, 240);\n$text_color = ImageColorAllocate($im, 0, 0, 0);\n\nfor($i = 0;\
  \ $i < 5; $i++)\n    ImageCopy($im, $src, 100, $i * 25, 0, 0, $src_size[0], $src_size[1]);\n\
  \nImagePng($im);\nImageDestroy($src);\nImageDestroy($im);\n?>\n```\n\n**图 18.2**\n\
  \n叠加的乐趣！\n\n呼，函数一个接一个地层之又来。我们在列表 18.3 中 使用了三个新函数：`ImageCreateFromPng()`、`GetImageSize()`\
  \ 和 `ImageCopy()`。前两个很容易处理。`ImageCreateFromPng()` 有一个参数，并返回一个图像资源，我们可以像处理其他图像资源一样处理它。`ImageCreateFromPng()`\
  \ 仅仅是取一个保存为文件的 PNG 图形并将其加载为图像资源。\n\n`int ImageCreateFromPng(string filename)`\n\n\
  **566**\n\n## 第 18 章\n\n### 生成图形\n\n`GetImageSize()` 同样只需要文件名；它返回一个包含四个元素的数组。元素\
  \ 0 代表图像的宽度；元素 1 代表图像的高度。第三个元素提供一个简短的描述字符串，让您图像类型，例如“PNG”或“JPG”。\n\n最后一个元素是一组用于高度和宽的\
  \ HTML 样式属性，可以直接在 HTML 标签中使用，例如 `img` 标签。\n\n`array GetImageSize(string filename\
  \ [, array imageinfo]);`\n\n你可以将 `GetImageSize()` 的结果赋值给变量，或者指定要赋值图像信息的变量作为 `GetImageSize()`\
  \ 的第二个（也是可选的）参数。\n\n然后我们到了有趣的部分——实际的图像叠加。`ImageCopy()` 函数需要八个参数。别担心；它并没有听起来那么糟糕。首先，`ImageCopy()`\
  \ 需要我们叠加在上面的图像资源（在本例中为 `$im`）。接下来，它需要我们正在复制的图像资源（在我们的例中为 `$src`）。现在函数知道了源和目标图像资源。接两个参数是我们要叠加的图像应该开始的\
  \ `x` 和 `y` 坐标。\n\n然后我们必须指定源图像中的 `x` 和 `y` 坐标以开始图像复制。最后两个参数，以及调用 `GetImageSize()`\
  \ 函数的原因，是从源图像中复制的高度和宽度。我们想要整张图像，所以我们从坐标 (0, 0) 开始，并获取图像的完整高度宽度，这是 `GetImageSize()`\
  \ 为我们计算出来的。\n\n`int ImageCopy(resource dst_im, resource src_im, int dst_x, int dst_y,\
  \ int src_x, int src_y, int src_w, int src_h)`\n\n在列表 18.3 中，我们循环五次，将源图像叠加到坐标 (100,\
  \ 0)、(100, 25)、(100, 50)、(100, 75) 和 (100, 100)。循环简单地将 `$i` 乘以 25，生成粘贴到较大图像中的图像的\
  \ `y` 坐标。\n\n## 绘制基础几何图形\n\n现在你已经了解了创建简单图像并将一幅图像粘贴到另一幅图像上的概述，让我们聊聊 GD 中可用的一些绘图原形。为了演示\
  \ GD 中绘制原形的功能，我们将展示如何绘制几个几何图形。所有的原形都易于管理。通过将原形与一些简单的技术相结合，我们可以创建专业质量的图形。\n\n###\
  \ 绘制正方形和矩形\n\n我们只需要一个新函数来绘制矩形，`ImageRectangle()`；它需要六个参数。\n\n`int ImageRectangle(int\
  \ image, int x1, int y1, int x2, int y2, int color)`\n\n要绘制矩形，必须知道左上角（参数 `x1` 和\
  \ `y1`）和右下角（参数 `x2` 和 `y2`）的坐标。形状的颜色也必须已知。该函数绘制的矩形是不填充的；线条将具有 `color` 参数指定的颜色。对于每个绘图函数，你可以选择用颜色填充封闭区域或留空（一个不填充的矩形是一个\
  \ 1 像素宽的框）。`ImageRectangle()` 绘制不填充形状；要绘制填充矩形，请使用 `ImageFilledRectangle()`，它具有与不填充版本相同的原型：\n\
  \n`int ImageFilledRectangle(int image, int x1, int y1, int x2, int y2, int color)`\
  \ *注意：GD 中还没有绘制比 1 像素粗的线条或边缘的方法。要制作粗线，你需要反复调用线条或不填充形状函数，绘制多个平行且间距 1 像素的线条。\n\n任何矩形都可以，但我们将绘制一个正方形，我们的演示正方形不会被填充。列表\
  \ 18.4 显示了正方形绘制的操作过程，图 18.3 展示了其输出。\n\n**列表 18.4：绘制正方形**\n```php\n<?php\n// （上述的正方形绘制代码）\n\
  ```\n![Image 98](img/index-592.png)\n\n绘制基础几何图形\n**567**\n\n### 绘制多边形\n\n现在你已经了解了创建简单图像并将一幅图像粘贴到另一幅图像上的概述，让我们聊聊\
