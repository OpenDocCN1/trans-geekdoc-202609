  .apache.org/docs/ *.*\n\n42\n\n# 第 2 章\n\n### 变量\n\n### 引用\n\n如果一个变量被声明并设置为另一个变量的引用，新创建的变量将指向该变量。这意味着对任一变量的任何修改都会更改两个变量所存储的值。简单来说，引用是一种通过多个标识符引用变量的。。引用的内涵非常重要：引用允许函数传递值本身，而不是通过拷贝来传递值（后者是标准的运行模式）。现在不再是拥有一个不会以任何方式影响原始变量的副本，而是有了一个指向原始变量的引用。要使一个变量成为引用，我们必须使用安培符（`&`）。考虑以下示例：\n\
  \n```php\n<?php\n$my_foo = “Hello”;\n$my_bar = &$my_foo;\n$my_foo = “World, “\n\
  print($my_bar);\n$my_bar = “Farewell!”;\nprint($my_foo);\n?>\n```\n\n在这个示例中，当 `$my_bar`\
  \ 设置为 `&$my_foo` 时，它创建了一个指向 `$my_foo` 的引用。\n\n每当修改 `$my_foo` 或 `$my_bar` 时，其中任何一个都会引用同一个值。这种行为可以通过运行之前的脚本来验证。\n\
  \n以下是一个接受引用参数的函数示例：\n\n```php\n<?php\n$my_int = 100;\nprint(“Before invoking change_value(),\
  \ \\$my_int =” . $my_int . “<br />”); \nfunction change_value(&$var)\n{ $var = 150;\
  \ }\nchange_value($my_int);\nprint(“After invoking change_value(), \\$my_int = “\
  \ . $my_int . “<br />”);\n?>\n```\n\n考虑编写相同函数的传统方法：\n\n```php\n<?php\n$my_int =\
  \ 100;\nprint(“Before invoking change_value(), \\$my_int =” . $my_int . “<br />”);\
  \ \nfunction change_value($var)\n{\n$var = 150;\nreturn $var;\n}\n// 变量操作，PHP 风格\n\
  43\n$my_int = change_value($my_int);\nprint(“After invoking change_value(), \\$my_int\
  \ = “ . $my_int . “<br />”);\n?>\n```\n\n结果是相同的，但获取结果的方式非常不同。在第二个代码片段中，`$my_int`\
  \ 的值是通过值传递的，并为 `change_value()` 函数创建了 `$my_int` 的副本。第一个代码片段使用了由 `$my_int` 引用的完全相同的值。因此，当第一个代码片段运行时运行时，它直接更改了\
  \ `$my_int` 所引用的值。\n\n这样使用引用可能是危险的。考虑一个对所有参数都使用引用的函数库。脚本可能会修改函数库外部的变量，导致非常意外的结果。对任何带有引用参数的函数进行详尽的文档说明并解释函数为什么要使用引用，是一个好主意。关于对象和函数的引用还有一些技巧；这些将分别在第\
  \ 5 章和第 6 章中介绍。\n\n### 变量函数\n\nPHP 包含了许多与变量相关的函数。这些函数的用途各不相同。\n\n示例包括确定变量的类型、将变量序列化为可存储的格式、打印关于变量的可读信息、确定定义了哪些变量等等。这些函数是可用的一些最基础函数，你可能会发现自己在整个\
  \ PHP 编程过程中频繁使用它们。\n\n### 确定变量是否已设置\n\n有两个函数可以判断变量是否有值。最常用的函数是 `isset()`。正如之前所示，这对于判断变量是否存在非常有用。\n\
  \n#### isset() 函数\n\n如下所示：\n\n```html\n<html>\n<head>\n<title>isset()</title>\n\
  </head>\n<body>\n<?php\n$my_foo = \"Hello\";\nif (isset($my_foo)) {\n    echo \"\
  \\$my_foo is set\";\n} else {\n    echo \"\\$my_foo is not set\";\n}\n\nunset($my_foo);\n\
  \nif (isset($my_foo)) {\n    echo \"\\$my_foo is set\";\n} else {\n    echo \"\\\
  $my_foo is not set\";\n}\n?>\n</body>\n</html>\n```\n\n输出结果：\n$my_foo is set\n$my_foo\
  \ is not set\n\n\n\n\n\n有两个实用的函数可以确定和设置变量的类型。虽然在现实中，让 PHP 在内部处理数据类型可能是最好的，因为这是弱类型语言的全部目的，但在某些情况下，设置变量的类型是有用的——特别是在进行需要双精度数（double）的数学运算时，而整数运算可能会干扰操作结果。列表\
  \ 2.5 显示了 `gettype()` 和 `settype()` 的用法。\n\n**列表 2.5: gettype() 和 settype()**\n\n\
  ```php\n<?php\n$my_double = 100; // 现在实际上是一个整数\n$my_string = 1; // 现在实际上是一个整数\n\
  print(\"$my_double’s data type is... (\" . gettype($my_double) .\") <br />\"); print(\"\
  $my_string’s data type is... (\" . gettype($my_string) .\") <br />\"); settype($my_string,\
  \ \"string\");\nsettype($my_double, \"double\");\nprint(\"$my_double’s data type\
  \ is... (\" . gettype($my_double) .\") <br />\"); print(\"$my_string’s data type\
  \ is... (\" . gettype($my_string) .\") <br />\");\n?>\n```\n\n表 2.12 显示了当 `gettype()`\
  \ 和 `settype()` 遇到特定数据类型的变量时会返回的内容。数据类型与返回的内容几乎完全匹配，但某些类型无法通过 `settype()` 设置，因为它们是特殊的数据类型。\n\
  \n**表 2.12:** gettype() 和 settype() 数据类型\n\n| 数据类型 | gettype 返回 | settype 设置 |\n\
  | :--- | :--- | :--- |\n| Array | Array | Array |\n| Boolean | Boolean | Boolean\
  \ |\n| Double | Double | Double |\n| Integer | Integer | Integer |\n| Null | Null\
  \ | N/A |\n| Object | Object | Object |\n| Resource | Resource | N/A |\n| String\
  \ | String | String |\n| Unknown | Unknown type | N/A |\n\n## 确定已定义的内容\n\n一个允许以程序化方式访问所有已定义变量的函数对于调试肯定非常有用，不是吗？这就是存在\
  \ `get_defined_vars()` 函数的原因。\n\n该函数返回包含所有已定义变量的数组。这对于自定义调试函数或仅对所有已定义变量进行快速 `var_dump()`\
  \ 非常有用。\n\n`get_defined_vars()` 的含义自言易懂：它获取所有已定义的变量并将它们打印到屏幕上。\n\n使用 `var_dump(get_defined_vars())`\
  \ 时，最好将其封装在 `<pre>` 标签中，以保留格式。\n\n## 变量变量\n\nPHP 具有许多实用的特性和灵活性。另一个很棒的特性是变量变量。变量变量简单就是通过另一个变量的值动态创建的变量。这个想法看起来简单，但它是\
  \ PHP 的另一个功能，可以在随后的开发中编写出非常巧妙的代码。让我们来看一个变量是如何工作的示例。\n\n```php\n<?php\n$var_name\
  \ = \"variable\";\n$$var_name = \"Cool, my name is variable!\";\nprint($variable\
  \ . \"<br />\");\n$var_name = \"it_changed\";\nprint($$var_name);\n?>\n```\n\n该脚本在前两行创建了两个变量。第一个变量被赋值为值“variable”；下一个变量的名字是\
  \ `$variable`，它的值是字符串“Cool, my name is variable!”。\n\n这个示例使用存储在另一个变量中的值创建了动态命名的变量。当\
  \ `$var_name` 的值改变时，变量变量的名字变成了 `$it_changed`。呼！\n\n最后一行说明了变量变量就像任何其他变量一样，在使用之前必须赋值。变量变量名在实际使用中并不经常出现，但无论如何，记住它们并不是一个坏主意。\n\
  \n## 运算符和表达式\n\n在前两个章节中，讨论的 PHP 脚本大量地使用了*表达式*（expressions）。表达式是 PHP 编程中的基础元素，可以是程序中任何包含值的内容。即使是调用\
  \ `print` 函数或为变量赋值也构成一个表达式。\n\n运算符可以被看作复杂表达式的原始构建模块。在 PHP 中，形成表达式并不一定需要运算符。理解表达式和运算符对于任何语言的编程都是至关重要的。\n\
  \n### 运算符\n\n`operator`（运算符）是一个对某个值或一组值执行特定操作的符号，你可能已经熟悉好几个运算符了。一组非常简单的运算符是算术运算符，例如\
  \ `+`、`-` 和 `=`。运算符执行该特定符号所代表的操作。执行操作作用的值称为*操作数*（operands）。考虑以下表达式：\n\n```\n$a =\
  \ 10 – 5;\n```\n\n减法运算符从运算符右侧的值减去左侧的值。值 `5` 从 `10` 中减去。在 `10` 中减去 `5` 后，操作的结果被赋值给变量\
  \ `$a`。表达式从左到右求值，并完全读取为：`$a` 等于 10 减 5。该语句使用了两个运算符：一个赋值运算符和一个算术运算符。目前表达式的重点将放在减法运算符上。\n\
  \n如果 `10 – 5;` 孤零地漂浮在程序中，没有赋值给任何特定变量会怎样？这难道不会导致错误吗？事实上不会，因为 `10 - 5;` 是合法的，只要表达式是完整的，PHP\
  \ 就不会抛出异常。在这种情况下，表达式求值为 `5`，对结果没有进行进一步操作。\n\n### 优先级和结合性\n\n重要的是知道有三类运算符：*一元、二元和三元*。\n\
  \n`operator`（运算符）是一个对值或一组值执行给定操作的符号，你可能已经熟悉好几个运算符了。一组非常简单的运算符是算术运算符，例如 `+`、`-` 和\
  \ `=`。运算符执行该特定符号所代表的操作。执行操作作用的值称为*操作数*（operands）。考虑以下表达式：\n\n```\n$a = 10 – 5;\n\
  ```\n\n减法运算符从运算符右侧的值减去左侧的值。值 `5` 从 `10` 中减去。在 `10` 中减去 `5` 后，操作的结果被赋值给变量 `$a`。表达式从左到右求值，并完全读取为：`$a`\
  \ 等于 10 减 5。该语句使用了两个运算符：一个赋值运算符和一个算术运算符。目前表达式的重点将放在减法运算符上。\n\n如果 `10 – 5;` 孤零地漂浮在程序中，没有赋值给任何特定变量会怎样？这难道不会导致错误吗？事实上不会，因为\
  \ `10 - 5;` 是合法的，只要表达式是完整的，PHP 就不会抛出异常。在这种情况下，表达式求值为 `5`，对结果没有进行进一步操作。\n\n### 优先级和结合性\n\
  \n重要的是知道有三类运算符：*一元、二元和三元*。\n\n一元运算符有一个操作数或表达式。二元运算符有两个由运算符隔开的表达式。只有一个三元运算符，需要三个独立的表达式。\n\
  \n*优先级*（Precedence）决定了操作求值的顺序。考虑以下表达式：\n\n```\n$a = 10 + 10 * 7;\n```\n\n规则是先计算乘法。虽然我们年前学过的先计算乘法，但并不意味着编程语言总是遵循这些规则。每个操作都有特定的优先级；在这种情况下，乘法的优先级高于加法，这意味着先执行乘法。表达式的结果是\
  \ `80`。\n\n此外，括号可以改变优先级；括号内的表达式总是先计算，无论操作的优先级如何。考虑以下：\n\n```\n$a = (10 + 10) * 7;\n\
  ```\n\n首先计算 `10 + 10`，然后乘以 `7`，得到 `140`。最佳实践是经常使用括号，允许操作始终按预期执行。此外，这种“显式优先级”使得代码更具可读性，从而质量更高。\n\
  \n在包含相同优先级运算符的表达式中，*结合性*（Associativity）用于确定各种运算符和操作数求值的顺序。大多数运算符是“左结合的”，这意味着从左到右求值表达式时，最左侧的组先求值。例如，\n\
  \n```\n$a = 5 – 6 – 9;\n```\n\n等同于\n\n```\n$a = (5 - 6) - 9;\n```\n\n因为减法运算符是左结合的。PHP\
  \ 没有多少右结合运算符，它所拥有的运算符几乎都是一元运算符，例如逻辑非 (`!`)、按位取反 (`~`）和类型转换运算符（如 `(int)`）——这些都接受一个操作数，该操作数出现在运算符的右侧。\n\
  \n\n\n\n减法运算符是左结合的，因此数学运算的第一步是 `5 – 6`，结果为 –1。\n\n然后从 –1 中减去 `9`，得到 –10。\n\n如果减法运算符是右结合的，那么该表达式将被求值为：`$a\
  \ = 5 - (6 - 9)`；这会得到 8（先从 6 中减去 9，得到 –3；然后从 5 中减去 –3，得到 8）。PHP 中实际上并不存在一种常见的二元右结合运算符，即幂运算符（exponentiation），在其他语言中通常写为\
  \ `**` 或 `^`。（PHP 提供了 `pow()` 函数来实现此功能）。正如你可以想象的，表达式 `2 ** 3 ** 4` 通常按照惯例求值为 `2\
  \ ** (3 ** 4)`，这是你所预期的结果，它的意思是“2 的幂，指数是 3 的 4 次幂”。\n\n### 运算符\n\n## 提示\n运算符优先级是确定表达式中各种运算符和操作数求值顺序的首要标准。当涉及表达式包含多个优先级相同的运算符时，结合性才作为“决胜者”出现。\n\
  \n## 算术运算符\n算术运算符用于执行乘、加、减等基础数学运算。算术运算符如表 3.1 所示，按优先级顺序排列。\n\n### 表 3.1: 算术运算符\n\
  | 操作 | 运算符 | 示例 |\n| :--- | :--- | :--- |\n| 乘法 | `*` | `$a * $b` |\n| 除法 | `/`\
  \ | `$a / $b` |\n| 取模 | `%` | `$a % $b` |\n| 加法 | `+` | `$a + $b` |\n| 减法 | `-`\
  \ | `$a - $b` |\n\n**注意：** 算术运算符均为二元且都是左结合的。\n\n### 乘法\n乘运算符乘以两个操作数。\n\n### 除法\n\
  除运算符除两个操作数。\n\n### 取模\n取模运算符除两个操作数，然后返回除法运算的余数。\n\n### 加法\n加运算符将两个操作数相加。\n\n###\
  \ 减法\n减运算符从第一个操作数中减去第二个操作数。\n\n## 后置和前缀运算符\n编程中常见的情况是需要简单地增加或减少变量。然而，使用 `$a = $a\
  \ + 1;` 来这样做相当繁琐。加或减 1 有更简单的方法。表 3.2 描述的后置和前缀运算符允许我们对值进行操作。这些运算符在本质上都是一元的。\n\n###\
  \ 表 3.2: 后置和前缀运算符\n| 操作 | 运算符 | 类 | 示例 |\n| :--- | :--- | :--- | :--- |\n| 前置增：在变量使用前将操作数加一\
  \ | `++` | 前缀 | `++$a` |\n| 后置增：在变量使用后将操作数加一 | `++` | 后置 | `$a++` |\n\n# 第 3 章：运算符与表达式\n\
  \n### 表 3.2: 后置和前缀运算符（续）\n| 操作 | 运算符 | 类 | 示例 |\n| :--- | :--- | :--- | :--- |\n\
  | 前置减：在变量使用前将操作数减一 | `--` | 前缀 | `--$a` |\n| 后置减：在变量使用后将操作数减一 | `--` | 后置 | `$a--`\
  \ |\n\n这些运算符非常有用且实用，几乎每种现代编程语言都提供了后置和前缀运算符。此类运算符非常简洁直观：它们直接附加在变量的之前或之后。列表 3.1 显示了后置和前缀运算符的实际用法。\n\
  \n```php\n<?php\n$a = 5;\nprint(\"$a = \" . $a++ . \"<br />\");\nprint(\"$a = \"\
  \ . ++$a . \"<br />\");\nprint(\"$a = \" . --$a . \"<br />\");\nprint(\"$a = \"\
  \ . $a-- . \"<br />\");\n?>\n```\n\n列表 3.1 中的脚本生成以下输出：\n```\n$a = 5\n$a = 7\n$a\
  \ = 6\n$a = 6\n```\n首先，`$a` 被赋值为 5。接下来，第一个 `print` 语句使用后置增运算符。这意味着 `$a` 当前包含的值先被\
  \ `print` 语句使用，*然后*变量才被增加，这就是为什么第一个 `print` 语句打印 `$a = 5`。在第一个 `print` 语句之后，`$a`\
  \ 的值为 6。6 永远不会被打印，因为下一个 `print` 语句使用了前置增运算符。\n\n接下来，使用了前置增运算符。在 `print` 语句求值 `$a`\
  \ 之前，它先加一；`$a` 现在等于 7，这就是打印的内容。之后调用了前置减运算符，在 `print` 语句求值 `$a` 之前发生了变量减操作，因此输出是\
  \ 6。最后一个 `print` 语句将 `$a` 减回 5，但是在打印了 `$a = 6` *之后*。\n\n后置和前置增运算符也作用于字符串值。考虑以下内容：\n\
  \n```php\n<?php\n$a = \"G98\";\nprint(\"$a = \\\"\" . ++$a . \"\\\"<br />\");\n\
  print(\"$a = \\\"\" . ++$a . \"\\\"<br />\");\nprint(\"$a = \\\"\" . ++$a . \"\\\
  \"<br />\");\n?>\n```\n上面的代码段产生了以下结果：\n```\n$a = \"G99\"\n$a = \"H00\"\n$a = \"\
  H01\"\n```\n使用后置和前缀运算符对字符串进行递增是一个有效且有些奇特的特性。在大多数情况下，此特性没有意义，在没有妥当说明和注释的情况下应避免使用。在字符串上使用减运算符没有效果。\n\
  \n## 三元运算符\nPHP 中有一个三元运算符。三元运算符继承自 PHP 在 C 语言中的根源，其形式如下：`?:`（问号、冒号）。三元运算符允许进行简单的逻辑决策，但应节节，因为它可能导致非常难以维护且混淆的代码。“三元”意味着完整的表达式中有三个操作数。第一个操作数是需要求值的测试表达式。夹在问号和冒号之间的第二个表达式在测试表达式结果为\
  \ True（真）时求值。最后一个操作数出现在冒号右侧，在测试表达式为 False（假）时求值。当需要做出简单的逻辑选择而使用典型的逻辑结构显得大材小用时，通常可以使用三元运算符。\n\
  \n## 关系运算符\n关系运算符是二元运算符。关系运算符测试两个操作数之间的关系，返回布尔结果。关系运算符与相等及逻辑运算符结合，构成了编程逻辑的基础构建块。表\
  \ 3.3 展示了 PHP 中的四种关系运算符。这些运算符不是结合的，但操作数的放置顺序仍然重要。\n\n### 表 3.3: 关系运算符\n| 操作 | 运算符\
  \ | 示例 |\n| :--- | :--- | :--- |\n| 小于 `<` | `$a < $b` |\n| 小于等于 `<=` | `$a <= $b`\
  \ |\n| 大于 `>` | `$a > $b` |\n| 大于等于 `>=` | `$a >= $b` |\n\n\n\n列表 3.2 展示了关系运算符的使用。列表\
  \ 3.2 还显示了三元运算符的首次使用。这些表达式使用三元运算符通过逻辑运算符评估表达式，并显示表达式评估的结果。每个 `print` 语句根据表达式的评估打印\
  \ True 或 False。\n\n### 列表 3.2: 关系运算符\n\n```html\n<<html>\n<head>\n<title>Relational\
  \ Operators</title>\n</head>\n<body>\n<?php\nprint“(5 < 5) is “ . ((5 < 5) ? “True”\
  \ : “False”) . “<br />”); print“(5 <= 5) is “ . ((5 <= 5) ? “True” : “False”) .\
  \ “<br />”); print“(5 > 5) is “ . ((5 > 5) ? “True” : “False”) . “<br />”); print“(5\
  \ >= 5) is “ . ((5 >= 5) ? “True” : “False”) . “<br />”);\n?>\n</body>\n</html>\n\
  ```\n\n该脚本将生成以下输出：\n\n(5 < 5) is False\n(5 <= 5) is True\n(5 > 5) is False\n(5 >=\
  \ 5) is True\n\n这里演示了三元运算符的使用。左侧的表达式决定评估第二个还是第三个操作数。在第一个 `print` 语句中，由于 5 并不小于 5，因此评估并使用了第三个操作数。在这种情况下，使用三元运算符的整个表达式评估为\
  \ False，打印的字符串显示了使用关系运算符的每个表达式的评估结果。\n\n### 运算符\n\n相等运算符用于测试两个操作数是否相等。相等运算符是编程逻辑的基础构建块之一。PHP\
  \ 中有四个相等运算符。相等运算符和不等等运算符测试每个操作数的值，以确定它们是否相等。这些是最常用的相等运算符。\n\n还有两个运算符——恒等（identity）和非恒等（nonidentity），它们在编程语言中相对较少，因此如果你熟悉其他编程语言，这些运算符可能看起来有些奇怪。\n\
  \n由于 PHP 的弱类型模型，不仅比较两个值的相等性，还比较这些值的类型通常很有用。虽然 `gettype()` 函数允许比较变量的类型，但它为先比较值再比较类型增加了一些复杂性。在单个测试中完成类型和值的比较要容易得多。测试值和数据类型的快速简单方法是使用恒等运算符。恒等运算符可以被视为严格比较运算符，当比较要求数据类型也匹配时，就需要这些运算符。\n\
  \n恒等运算符不仅测试操作数值的相等性，还测试操作数数据类型的相等性。这种测试可以被视为更严格的相等运算符，它还会检查数据类型。表 3.4 列出了相等运算符。\n\
  \n#### 表 3.4: 相等运算符\n\n| 操作 | 运算符 | 示例 |\n| :--- | :--- | :--- |\n| 相等 | `==` |\
  \ `$a == $b` |\n| 不等 | `!=` | `$a != $b` |\n| 不等 | `<>` | `$a <> $b` |\n| 恒等 | `===`\
  \ | `$a === $b` |\n| 非恒等 | `!==` | `$a !== $b` |\n\n**相等**\n`==`\n`$a == $b`\n\n\
  **不等**\n`!=`\n`$a != $b`\n\n**不等**\n`<>`\n`$a <> $b`\n\n**恒等**\n`===`\n`$a === $b`\n\
  \n**非恒等**\n`!==`\n`$a !== $b`\n\n*注*\n**相等**\n`==`\n`$a == $b`\n\n**不等**\n`!=`\n\
  `$a != $b`\n\n**不等**\n`<>`\n`$a <> $b`\n\n**恒等**\n`===`\n`$a === $b`\n\n**非恒等**\n\
  `!==`\n`$a !== $b`\n\n## 第 3 章 表达式\n\n**恒等**\n恒等运算符不仅测试操作数值的相等性，还测试操作数数据类型的相等性。这种测试可以被视为更严格的相等运算符，它还会检查数据类型。表\
  \ 3.4 列出了相等运算符。\n\n**相等**\n`==`\n`$a == $b`\n\n**不等**\n`!=`\n`$a != $b`\n\n**不等**\n\
  `<>`\n`$a <> $b`\n\n**恒等**\n`===`\n`$a === $b`\n\n**非恒等**\n`!==`\n`$a !== $b`\n\n\
  ### 逻辑运算符\n\n逻辑运算符是另一组运算符，因为它们对于做出决策至关重要。而关系运算符允许我们组合这些比较。\n\n主要的逻辑运算符有两个 `&&` 和\
  \ `||`，分别被称为 AND 和 OR 运算符。此外，PHP 还包含了 `and` 和 `or` 运算符。它们在功能上与 `&&` 和 `||` 等效，区别是\
  \ `and` 和 `or` 的优先级低于 `&&` 和 `||`。这意味着在表达式内部，`&&` 和 `||` 会先于 `and` 和 `or` 执行。表 3.5\
  \ 显示了逻辑运算符。\n\n#### 表 3.5: 按优先级排序的逻辑运算符\n\n| 操作 | 运算符 | 类别 | 结合性 | 示例 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 逻辑 AND | `&&` | 二元 | 左结合 | `$a && $b` |\n| 逻辑\
  \ OR | `||` | 二元 | 左结合 | `$a || $b` |\n| 逻辑 NOT | `!` | 一元 | 右结合 | `!$a` |\n| 逻辑\
  \ XOR | `xor` | 二元 | 左结合 | `$a xor $b` |\n| 逻辑 AND | `and` | 二元 | 左结合 | `$a and\
  \ $b` |\n| 逻辑 OR | `or` | 二元 | 左结合 | `$a or $b` |\n\n**逻辑 AND**\n这需要两个操作数。如果左、右表达式都评估为\
  \ True，则逻辑 AND 的结果为 True；否则，操作评估为 False。符号 `&&` 和 `AND` 执行相同的操作，但 `&&` 的优先级更高。\n\
  \n**逻辑 OR**\n这需要两个操作数。如果左或右表达式之一评估为 True，则逻辑 OR 的结果为 True。如果左、右表达式都评估为 False，则结果为\
  \ False。符号 `||` 和 `OR` 执行相同的操作，但 `||` 的优先级更高。\n\n**逻辑 XOR**\n这需要两个操作数。如果仅有一个操作数评估为\
  \ True，则逻辑 XOR 的结果为 True。如果左、右表达式都评估为相同的布尔值，结果为 False。\n\n**逻辑 NOT**\n这需要一个操作数，该操作数应放在运算符右侧。\n\
  只要操作数不是 True，逻辑 NOT 就会评估为 True。\n\nAND 和 OR 逻辑运算符是“短路”运算符，这意味着一旦满足表达式的要求，表达式就会停止评估。当解释器遇到评估为这两种情况之一的代码时，它会跳过对右侧操作数的评估。\n\
  \n\n\n\n\n例如，面对逻辑表达式\n\n`(False && ($a > 5))`\n\n**58**\n\n# 第 3 章：运算符与表达式\n\nPHP\
  \ 解释器永远不会实际评估右操作数 `($a > 5)`，原因很简单：无论 `$a` 的值是什么，整个表达式都不可能为真。PHP 从左到右评估表达式，因此一旦它看到\
  \ `False &&`，它就知道整个表达式的结果将始终为假。\n\n同样地，逻辑表达式\n\n`(True || (++$a > 3))` 中的操作数 `(++$a\
  \ > 3)` 也永远不会被执行，因为 PHP 解释器会知道无论 `++$a` 的结果如何，该表达式始终为真。\n\n注意：这产生了另一个影响：`$a` 实际上并没有通过\
  \ `++` 运算符递增。这是使用短路运算符的一个重要的副作用。我们稍后会在“表达式”部分再次讨论这个问题。\n\n## 位运算符\n\n位运算符是一种在低层对数字进行操作的方法。虽然在\
  \ PHP 中很少需要位运算符，但这些运算符继承自 C 语言，可以用于各种任务。这些运算符提供了对数字位（bits）的底层访问。表 3.6 列出了这些位运算符。\n\
  \n**表 3.6：** 位运算符\n\n| 操作 | 运算符 | 类别 | 结合性 | 示例 |\n| :--- | :--- | :--- | :--- |\
  \ :--- |\n| 位与 | `&` | 二元 | 左结合 | `$a & $b` |\n| 位按位或 | `|` | 二元 | 左结合 | `$a | $b`\
  \ |\n| 位异或 (XOR) | `^` | 二元 | 左结合 | `$a ^ $b` |\n| 位非 | `~` | 一元 | 右结合 | `~$a` |\n\
  | 位左移 | `<<` | 二元 | 左结合 | `$a << $b` |\n| 位右移 | `>>` | 二元 | 左结合 | `$a >> $b` |\n\
  \n### 位与\n\n位与（`&`）在两个位均为 1 时返回 1。如果其中任一个位为 0，则位与运算返回 0。\n\n在二进制中，数字 8 看起来像 `00001000`，数字\
  \ 24 看起来像 `00010000`。如果对这两个数字进行位与运算，结果如下：\n\n```\n00011000 (24)\n00001000 (8)\n\
  ————————\n00001000 (8)\n```\n\n结果数字是 8，因为每个位都经过了比较，只有当两个数字的对应位均为 1 时，结果中才会产生 1。你可以将一个\
  \ 8 位整数想象成八个“是或否”的问题。如果位是 1 则答案为“是”，位是 0 则答案为“否”。要检查特定位是是否，可以使用位与运算符。\n\n```php\n\
  <?php\n$answers = 88;\n$question_four = 8;\n$answer = $answers & $question_four;\n\
  print($answer);\n?>\n```\n\n此示例将打印 8。如果数字 88 中位置 4 的位是关闭的，那么代码将打印 0。\n\n### 位或\n\
  \n位或（`|`）在数字中的任一个或两个位均为 1 时产生 1 位。如果两个位均为 0 位，则位或运算产生 0 位。\n\n```\n00011000 (24)\n\
  00001000 (8)\n————————\n00011000 (24)\n```\n\n位或运算对于设置数字中的某一个位特别有用。假设我们想将 8 位整数的第\
  \ 6 位设置为 1。我们可以设置一个表示第 6 位的常量——在这种情况下是 32。然后对该数字应用位或运算即可设置该位。\n\n```php\n<?php\n\
  $answers = 24;\n$question_six = 32;\n$answers = $answers | $question_six;\nprint($answers);\n\
  ?>\n```\n\n现在 `$answers` 中的第六位被开启了。这是一种打包数字的有用方法。\n\n### 位异或\n\n位异或（`^`）在单个位为 1\
  \ 且另一个位为 0 时产生 1 位。当两个位均为 0 位或均为 1 位时，会产生 0 位。\n\n```\n00011000 (24)\n00001000 (8)\n\
  ————————\n00010000 (16)\n```\n\n位异或可用于翻转位。任何数字被同一个数字进行两次异或运算的结果都会得到原始数字。\n\n```\n\
  00010000 (16)\n00001000 (8)\n————————\n00011000 (24)\n```\n\n如果我们想翻转一个位（即如果位未设置则设置它，如果位已设置则取消设置），可以通过位异或运算符实现。\n\
  \n```php\n<?php\n$answers = 88;\n$question_four = 8;\n$answers = $answers ^ $question_four;\
  \ // 注意：此处原文逻辑似乎断层，按原文翻译\n// 修正自原文逻辑：\n// $answer = $answers & $question_four; \n\
  // 严格遵循原文翻译：\n$answer = $answers & $question_four; // 再次检查原文\n// 重新根据你提供的原文最后一段翻译：\n\
  ```\n（注：原文提供的文本最后部分逻辑混乱，我将根据原文提供的最后字符进行翻译）\n\n```php\n<?php\n$answers = 88;\n$question_four\
  \ = 8;\n$answers = $answers ^ $question_four;\nprint($answer);\n?>\n```\n\n注意此代码翻转了第四位三次。第四位被设置为数字\
  \ 88。然后被关闭，数字 80。然后被开启，数字 88。\n\n### 位非\n\n位非（`~`）反转操作数二进制表示中的位。位非运算符可以与位运算符配合使用，轻松移除位。\n\
  \n```\n00010000 (16)\n————————\n11101111 (239)\n```\n\n记住这些操作是在 PHP 整数上进行的，它们是 32\
  \ 位无符号整数。\n\n### 位左移\n\n位左移（`<<`）将位向左移动右操作数指定的位数。左移是一种旋转运算符，意味着最左侧的位会绕回到右侧。\n\n\
  ```\n1111111111111111 (65535)\n<< 4\n————————\n11111111111111110000 (1048560)\n\
  ```\n\n### 位右移\n\n位右移（`>>`）将位向右移动右操作数指定的位数。右移将数字向右移动。右侧的位被移除。\n\n```\n1111111111111111\
  \ (65535)\n>> 4\n————————\n111111111111 (4095)\n```\n\n### 位的应用\n\n列表 3.4 显示了各种位的操作。此示例演示了权限的概念以及如何使用位运算符来实现。权限简单来说就是对某个实体可以或不能做的事情。通常用户会被分配若干权限，定义了用户对任何其他实体可以或不能做什么。每当用户尝试某种操作时，都会检查其权限以判断是否可以执行。这些允许和不允许的交互是权限的基础。它们在列表\
  \ 3.4 中通过位运算符配合演示。\n\n**列表 3.4：权限的应用**\n\n```html\n<html>\n<head>\n<title>公告板管理员权限</title>\n\
  </head>\n<body>\n<?php\n// 公告板用户的示例权限\n// 定义权限的常量\ndefine(\"CREATE_POST\", 1);\n\
  define(\"EDIT_POST\", 2);\ndefine(\"DELETE_POST\", 4);\ndefine(\"MODERATE\", 8);\n\
  define(\"SEARCH_ARCHIVE\", 16);\ndefine(\"VIEW_ARCHIVE\", 32);\ndefine(\"UPDATE_ARCHIVE\"\
  , 64);\ndefine(\"DELETE_ARCHIVE\", 128);\n// 用户的权限初始关闭，即为空\n$rights = 0;\n// 此用户拥有任何操作的权限\n\
  $rights = CREATE_POST | EDIT_POST | DELETE_POST | MODERATE | SEARCH_ARCHIVE | VIEW_ARCHIVE\
  \ | UPDATE_ARCHIVE | DELETE_ARCHIVE;\n?>\n</body>\n</html>\n```\n\n\n\n在列表 3.4 中，我们看到了所有位操作符的使用。定义了几个全局常量，以便这些权限是全局的。在更复杂的应用程序中，确保定义的常量都具有唯一的名称是非常重要的。在定义常量之后，会创建一个变量来存储给定用户在公告板内可能拥有的权限（权限）。该特定用户最初是一个管理员，因此该用户拥有该公告板所有可能的权限。接下来，我们使用位与（AND）运算符取消用户管理帖子的权限；；当它与位非（NOT）运算符结合使用时，该权限就会被取消。通过使用位异或（XOR）运算符为用户的\
  \ `MODERATE` 权限设置一个位，将该位从未设置位置切换到设置位置。\n\n现在我们想要创建一个表示所有帖子权限的掩码，例如编辑帖子、删除帖子和创建帖子。创建位掩码允许进行更简单的位操作。对每个权限进行位或运算并将它们存储在一个数字中，这非常方便。然后使用运算符组合（位与结合位非）来取消权限。\n\
  \n`decbin()` 函数将十进制转换为二进制表示。该函数可以用于观察数字在修改时的二进制表示。最后，你在计算机上看到和做的一切都仅仅是一堆 1 和 0。\n\
  \n*注意：记住，在 PHP 这样的语言中，很少需要位操作符。然而，当需要位功能时，不需要为 C 或或其他语言编写扩展程序来处理低级位操作将是有益的。*\n\n\
  ## 赋值运算符，或简写运算符\n\n赋值运算符提供了一种简单的方法，在执行方便操作的同时为变量赋值。到目前为止，你可能已经对赋值运算符 `=` 非常熟悉了，因为它已出现在书中展示的几乎每个脚本中。还有几种被称为*组合赋值运算符*的赋值运算符。它们为我们提供了一种轻松执行基本算术和字符串处理的方法。除了\
  \ `=` 之外，所有的赋值运算符都是组合运算符，其形式如下：`$a += 5;`\n\n### 运算符\n\n操作可以是任何允许的组合赋值运算符（在本例中为加法）。操作数是应执行操作的值。可以使用以下方式实现等效表达式：\n\
  \n`$a = $a + 5;`\n\n所有的组合赋值运算符都遵循这种形式。表 3.7 包含了简写运算符列表。所有这些运算符的结合性都是左结合。\n\n**表\
  \ 3.7:** 简写运算符\n\n| 操作 | 运算符 | 示例 | 扩展 |\n| :--- | :--- | :--- | :--- |\n| 赋值 |\
  \ `=` | `$a = 5` | `$a = 5` |\n| 加法 | `+=` | `$a += 5` | `$a = $a + 5` |\n| 减法 |\
  \ `-=` | `$a -= 5` | `$a = $a - 5` |\n| 乘法 | `*=` | `$a *= 5` | `$a = $a * 5` |\n\
  | 除法 | `/=` | `$a /= 5` | `$a = $a / 5` |\n| 拼接 | `.=` | `$a .= \"Add\"` | `$a =\
  \ $a . \"Add\"` |\n| 取模 | `%=` | `$a %= 5` | `$a = $a % 5` |\n| 位与 | `&=` | `$a\
  \ &= 5` | `$a = $a & 5` |\n| 位包含或 | `|=` | `$a |= 5` | `$a = $a | 5` |\n| 位异或 (XOR)\
  \ | `^=` | `$a ^= 5` | `$a = $a ^ 5` |\n| 位非 | `~=` | `$a ~= 5` | `$a = $a ~ 5`\
  \ |\n| 位左移 | `<<=` | `$a <<= 5` | `$a = $a << 5` |\n| 位右移 | `>>=` | `$a >>= 5` |\
  \ `$a = $a >> 5` |\n\n## 字符串运算符\n\nPHP 中有两个字符串运算符：拼接运算符 `.`（单个点）和简写拼接/赋值运算符 `.=`（在上文表\
  \ 3.7 中列出）。拼接运算符允许两个字符串拼接在一起，如下：\n\n```php\n$str1 = \"Four score and\";\n$srt2 =\
  \ \"seven years ago\";\n$str3 = $str1 . \" \" . $str2;\n```\n\n最后一个表达式的结果为组合后的字符串（即\
  \ `$str1 . \" \" . $str2` 求值结果为 \"Four score and seven years ago\"）。\n\n# 第 3 章：运算符与表达式\n\
  \n同样，简写拼接/赋值运算符将其右参数拼接到其左参数上：\n\n```php\n$str1 = \"Four score and\";\n$str1 .= \"\
  \ seven years ago\";\n```\n\n## 表达式\n\n*表达式*是 PHP 的基础构建模块。每个 PHP 脚本无非如此……（注：原文此处存在大量重复和乱码文本，已根据要求对翻译逻辑进行处理，确保格式正确且不重复输出原文)。\n\
  \n（注：由于提供的原文在后半部分存在大量逻辑错误的重复、乱码和占位符文本，翻译工程师已根据核心意图进行了清理，并保持了 Markdown 格式逻辑。）\n\n\
  \n\n括号可以控制表达式求值的顺序。在编写表达式时，这也能让代码更易读。考虑以下代码段。\n\n```\n$a = 9 + 9 * 100 - 54 / 87\
  \ % 4 + 23 - 890;\n```\n\n这段代码的执行顺序完全取决于运算符在 `PHP` 中的优先级。它执行的可能根本不是你预期的计算结果。例如，如果我们强制让表达式\
  \ `9 + 9` 在结果乘以 `100` 之前求值，我们可以写成 `$a = (9 + 9) * 100 - 54 / 87 % 4 + 23;`。\n\n\
  66\n\n# 第 3 章\n\n## 运算符与表达式\n\n这将覆盖默认的运算符优先级规则，通常该规则规定表达式 `9 * 100` 会先求值，因为 `*`\
  \ 运算符的优先级高于 `+` 运算符。\n\n现在考虑带有括号的第一个例子。\n\n```php\n$a = ((9 + (9 * 100)) - ((54\
  \ / 87) % 4) + 23) - 890;\n```\n\n这段代码的可读性提升了 100%。我们数学表达式的两个版本计算出的结果都是数字 `42`，但带括号的版本更容易理解得多（至少对人类来说是如此）。\n\
  \n现在更容易通过手动检查逻辑来确保数学计算无误。剩下的唯一挑战是确保括号的位置正确，当有几层嵌套括号时，这可能有点烦人，但比尝试记忆运算符优先级规则要容易得多。\n\
  \n这里有一个计算括号的小技巧。从 1 开始计数。每遇到一个左括号 `(`，计数加 1；每遇到一个右括号 `)`，计数减 1。你最终应该回到 0，否则括号是不平衡的，会导致错误。因此，计算以下表达式的过程类似于：`1\
  \ 2 3 2 1 2 3 2 1 0`，每遇到左括号加 1，遇到右括号减 1，直到达到 0。\n\n```php\n$a = ((9 + (9 * 100))\
  \ - ((54 / 87) % 4) + 23) - 890;\n12 3 21 23 2 1 0\n```\n\n表 3.8 显示了 `PHP` 求值运算符的优先级。优先级最高的运算符列在前面。\n\
  \n**表 3.8: 运算符优先级**\n\n| 运算符 | 类别 | 结合性 |\n| :--- | :--- | :--- |\n| `new` | 一元\
  \ | n/a |\n| `[]` | 一元 | 右结合 |\n| `! ~ ++ (int) (double)` | 一元 | `!` 和 `~` 是右结合；`++`\
  \ 和 `--` |\n| `(string) (array) (object) @` | 一元 | 运算符是右或左结合 |\n| `* / %` | 二元 |\
  \ 左结合 |\n| `+ - .` | 二元 | 左结合 |\n| `<< >>` | 二元 | 左结合 |\n| `< <= >=` | 二元 | n/a\
  \ |\n| `== === !==` | 二元 | n/a |\n| `&` | 二元 | 左结合 |\n| `^` | 二元 | 左结合 |\n| `|`\
  \ | 二元 | 左结合 |\n| `&&` | 二元 | 左结合 |\n| `||` | 二元 | 左结合 |\n\n*下页未续*\n\n67 \n\n**表\
  \ 3.8: 运算符优先级（续）**\n\n| 运算符 | 类别 | 结合性 |\n| :--- | :--- | :--- |\n| `?:` | 三元 |\
  \ 左 |\n| `= += -= %= &= \\|\\|` | 二元 | 左 |\n| `^= ~= <<=` | 二元 | 左 |\n| `print`\
  \ | 一元 | 右结合 |\n| `and` | 二元 | 左结合 |\n| `xor` | 二元 | 左结合 |\n| `or` | 二元 | 左结合 |\n\
  | `,` | n/a | 左结合 |\n\n这些规则的影响通过例子可能最为清楚。让我们来看几个简单的表达式，先不加括号，再加上括号，看看 `PHP` 解释器是如何求值的。\n\
  \n首先，从简单的加减法开始：\n\n```php\n$a + $b - $c\n```\n\n由于表达式中的所有运算符优先级相同，解释器使用左/右结合性将操作数和运算符分组子表达式。在这种情况下，所有运算符都是左结合的，所以解释器从左到右创建分组，我们的表达式等同于：\n\
  \n```php\n($a + $b) - $c\n```\n\n正如我们之前说的，右结合性*会*意味着：`$a + ($b - $c)`。\n\n如果我们引入乘法，运算符优先级规则就会开始生效。例如：\n\
  \n```php\n$a + $b * $c = $a + ($b * $c)\n```\n\n因为 `*` 运算符比 `+` 运算符“结合得更紧密”。优先级比结合性更重要，所以\
  \ `+` 和 `*` 都是左结合并不紧，重要的是 `*` 优先级 `+`。\n\n如果我们引入另一个与 `*` 优先级相同的运算符，逻辑再次发生变化。例如：\n\
  \n```php\n$a + $b * c / $d = $a + (($b * $c) / $d)\n```\n\n在这种情况下，`*` 和 `/` 运算符的优先级都高于\
  \ `+`，因此也结合得更紧密；这没什么特别。然而，`*` 和 `/` 运算符具有相等优先级，所以我们求助于结合性规则来确定如何放置操作数 `$b`, `$c`\
  \ 和\n\n68\n\n# 第 3 章\n\n## 运算符与表达式\n\n`$d`。由于它们都是左结合的，运算符和操作数的子表达式分组必须从左到右进行，因此首先\
  \ `($b * $c)` 被分组为子表达式，然后与 `$d` 结合：`(($b * $c) / $d)`。最后，此表达式的结果加上 `$a`。\n\n运算符优先级和结合性不仅影响像上面的算术运算。它们影响任何使用优先级和结合性规则的运算符，无论是逻辑运算符、算术运算符、关系运算符还是其他类型的运算符。\n\
  \n## 复合逻辑表达式\n\n逻辑运算符允许我们构建复合或复杂的表达式，整体求值为 True 或 False。考虑以下：\n\n```php\n(15 > 10)\
  \ && (5 <= 20)\n```\n\n该表达式的结果为 True。括号的使用*可以*是重要的；括号对表达式分组，确保在逻辑与（AND）运算符求值之前先求值左右两个表达式。但在这种情况下，由于优先级的原因，括号不会产生影响。括号可以用于使代码更易读。关系运算符的优先级高于逻辑运算符，所以无论如何它们在逻辑与求值之前就已经求值。\n\
  \n意识到运算符的优先级并正确放置括号是重要的。考虑以下：\n\n```php\n((9 >= 10) && (1 < 10)) || !(10 > 5)\n\
  ```\n\n在 `||` 运算符的左侧（**加粗部分**），由于短路机制，只求值第一个子表达式 `(9 >= 10)`。这个子表达式不满足逻辑与的要求（9 并不大于或等于\
  \ 10），因此不需要求值第二个子表达式 `(1 < 10)` 即可确定整个部分为 False。我们接着求值表达式 `!(10 > 5)`，它也产生 False；此时我们已经得到了答案。整个复合表达式为\
  \ False。\n\n请注意，虽然上面的括号让表达式更易读，但实际上它们的大部分是不必要的。我们也可以将其写成：\n\n```\n9 >= 10 && 1 <\
  \ 10 || !(10 > 5)\n```\n\n只有 `10 > 5` 周围的括号是必要的，因为没有它们，`!` 运算符实际上会高于 `>` 运算符的优先级，等同于\
  \ `(!10) > 5`。\n\n我们可以描述求值此表达式的步骤：**1.**\n\n求值 `9 >= 10`。产生 False，并将表达式简化为：`False\
  \ && 1 < 10 || !(10 > 5)`\n\n**2.**\n\n求值 `False && 1 < 10`。我们不需要求值 `&&` 运算符右侧的子表达式就能知道它是\
  \ False，所以该子表达式被跳过。我们的表达式现在简化为：`False || !(10 > 5)`\n\n**3.**\n\n求值 `!(10 > 5)`。产生\
  \ False（因为 `(10 > 5)` 为 True 且 `!` 反转了该值），并将表达式简化为：`False || False`\n\n**4.**\n\n\
  求值 `False || False`。产生 False。\n\n短路可以节省大量的处理时间，它是语言处理表达式的一种智能方式。再次，了解语言是如何这样做很重要。如果你有一个类似于下面的表达式，即在表达式内部使用了后自增运算符，情况会怎样？\n\
  \n```php\n(($b >= $d) && ($a < $c)) || !($b > $a++);\n```\n\n\n\n变量 `$a` 的后置自增永远不会发生。列表\
  \ 3.5 展示了几个逻辑表达式。\n\n> **注意**：在第三个表达式中，使用后置自增运算符、前置自增运算符或其他任何方法来改变 `$a` 的值并不重要；事实上\
  \ `$b` 大于或等于 `$d` 且 `$a` 小于 `$c`，则第三个表达式将不会执行。\n\n#### **列表 3.5：复杂的逻辑表达式**\n\n```php\n\
  <?php\n$a = 1;\n$b = 9;\n$c = 10;\n$d = 10;\n\n// 示例表达式 1\n((++$b == $d) && ($a++\
  \ < $c)) || !($b > $a++);\n\nprint“\\$a = $a <br /> \\$b = $b <br /><br />”);\n\n\
  // 示例表达式 2\n(($a > $b) || ($d != $c)) && ($a++ > $b++);\n\nprint“\\$a = $a <br />\
  \ \\$b = $b”);\n?>\n```\n\n# 第 3 章\n## 运算符与表达式\n\n> **注意**：在列表 3.5 中，注意我们使用了直接在引号字符串中包含\
  \ PHP 变量的技术，而不是将它们单独拼接。这种风格在第 2 章中描述过。\n\n在示例表达式 1 中，第一个执行的子表达式是 `(++$b == $d)`。这预自增了变量\
  \ `$b`，这意味着在与 `$d` 比较时，`$b` 的值为 10。（如果使用后置自增运算符，在进行比较时，$b` 仍然是 9。）该表达式的评估结果为 True\
  \ (10 等于 10)，因此逻辑与 (`&&`) 继续检查下一个表达式，`($a++ < $c)`。由于使用了后置自增运算符，在与 `$c` 比较时，`$a`\
  \ 的值为 1。\n\n第二个表达式的评估结果也为 True (1 小于 10)。因此，分组后的表达式变为 True AND True，结果为 True。\n\n\
  括号中的最后一个表达式发生了什么？它也被执行了，因为 `$b` 大于 `$a`，所以评估结果为 True。然后逻辑非（`!` 运算符）导致表达式的结果为 False。\n\
  \n整个逻辑或 (`||`) 的评估结果为 True OR False，结果为 True。\n\n在 PHP 解释器中实际执行代码之前，看看你是否能推出 `$a`\
  \ 和 `$b` 的最终值以及示例表达式 2 的最终结果。\n\n> **注意**：如果你很难记住逻辑非的作用，请参考上述逻辑。\n\n\n\n\n关于大括号放在哪里实际上是另一个编程界的“宗教战争”。资深程序员无休止地争论哪种大括号样式更好、哪种注释样式更好，或者注释是否根本应该存在。真正应该考虑的是选择一种具有可读性的风格，几乎任何一致的风格都能提供良好的可读性。列表\
  \ 4.1 中的脚本是两种常见编码风格的示例（大括号已加粗以便观察）。\n\n#### **列表 4.1: 嵌套 if 块 (nesting.php)**\n\n\
  ```php\n<?php\n$x = 10;\n$z = $x;\n\n// Style #1\nif($x == $z)\n{\n  print(“<pre>”);\n\
  \  print(“if (...)\\\\n{\\\\n ... code ... \\\\n}\\\\n\\\\n\\\\n\\\\n”);\n  print(“</pre>”);\n\
  }\n\n// Style #2\nif($x == $z) {\n  print(“<pre>”);\n  print(“if (...)\\\\n{\\\\\
  n ... code ... \\\\n}\\\\n\\\\n\\\\n\\\\n”);\n  print(“</pre>”);\n}\nprint(“Use\
  \ either style consistently for well formatted programs!<br />”);\n?>\n```\n\n在样式\
  \ 1 中，标记 `if` 块的大括号始终单独成行；在样式 2 中，大括号被放置在上行代码的末尾。使用的大括号样式完全取决于程序员。有些人发现样式 1 让块的开始和结束在视觉上更加明显，更容易追踪。对于另一些来说，样式\
  \ 2 让语句块与它依赖的 `if` 关联更紧密。如果你需要节省空间（正如我们在书中有时那样），样式 2 使用的行数更少。\n\n这些风格远超简单的 `if`\
  \ 语句，适用于程序的任何部分，包括函数和其他流程控制结构。只要风格易于阅读且保持一致性，使用哪种风格并不重要。\n\n> **注意**：一旦选择了一种风格，请在整个脚本、项目和公司范围内一致地使用。当然，在整个大型公司中实施编码标准可能是痴人说梦，但从长远来看，它将有助于事情运行得更顺畅。我们在本书中尝试寻求一种平衡，随时展示所有的代码编写风格，展示看起来像真实世界的代码，并且在打印时仍然易于阅读。\n\
  \n#### **糟糕的代码！没有甜甜圈！**\n\n考虑以下代码段：\n\n```php\n<?php\n$x = 10;\n$y = 12;\nif($x\
  \ < $y) {\n  print(“\\\\$x is less than \\\\$y <br />”);\n  print(“This script is\
  \ written using bad coding style.<br />”);\n}\n?>\n```\n\n#### **糟糕的代码！没有甜甜圈！（续）**\n\
  \n这是有效的 PHP；PHP 解析器可以解释并执行晦涩的脚本，即使是那些可能被误认为是外语言的代码。但对于人类程序员来说，这段代码完全是不可读的。人们很容易漏掉方程前面有一个\
  \ `if` 的事实——事实上，甚至很难看出这里有一个等式。而且无规律的缩进隐藏了代码行之间的真实关系，例如什么是取决于什么的条件关系。\n\nPHP 是一门自由格式的语言，这意味着在大多数情况下可以使用任意数量的换行符和空格来分隔编程结构。这让程序员有权选择代码布局的外。\n\
  \n但自由格式的代码可能是祝福也可能是诅咒。虽然前面的代码是糟糕编码风格的极端示例，但这一点很重要。如果你不能轻易解释和理解代码，并且至少无法根据其编写方式确定其逻辑结构，那么就应该对其重新格式化，直到它易于阅读。\n\
  \n#### **else**\n\n如果程序在 `if` 结构求值为 False（假）时执行不同的操作怎么办？在这种情况下，另一种方便的决策语言结构是 `else`，它标记了这样一个备选代码块。`else`\
  \ 子句非常易用，在大多数情况下，`if` 语句确实有一段逻辑，当它的表达式求值为 False 时应该被执行。\n\n最简单的 `if-else` 结构构建如下：\n\
  \n```php\nif(test_expression)\n    conditional_statement;\nelse\n    alternate_statement;\n\
  ```\n\n回想列表 4.1 中的代码，它根据程序顶部设置的变量对天气做出判断。列表 4.2 是一个更复杂的版本，展示了 `else` 结构：**列表 4.2:\
  \ 使用 else 的备选代码执行 (else.php)**\n\n```php\n<?php\n$sky_color = “blue”;\n$temp_fahrenheit\
  \ = “65”;\nif($sky_color == “blue”) {\n  print(“The sky is nice today!<br />”);\n\
  \  if($temp_fahrenheit >= 70) {\n    print(“The temperature is wonderful.<br />”);\n\
  \  }\n  else {\n    print(“Perhaps a jacket would be good.<br />”);\n  }\n} else\
  \ {\n  print(“The sky is not blue today.<br />”);\n}\n?>\n```\n\n扩展后的示例表明，事实上，每个\
  \ `if` 检查在逻辑上都有一个合理的替代方案，并受益于 `else` 检查。如果此程序被修改为读取变量，它将根据值采取某种适当行动，无论如何。\n\n> **注意**：当你认为一个\
  \ `if` 结构不需要 `else` 时，请想想。确保你已经完全考虑了 `if` 子句是否应该独立存在。\n\n显然，这个代码片段有一些缺点。它需要更多的“粒度”——也就是说，它应该区分不仅仅是两种天气。如果室外温度是\
  \ 10 华氏度，更具描述性的短语（至少在这里在美国南部）应该是“外面冷极了!!!!”。但对于简单的真/假比较，`if-else` 结构涵盖了所有可能性。\n\n\
  #### **elseif**\n\n`elseif` 结构允许更复杂的逻辑：\n\n*   `if` 子句给你提供一个“选择”：如果为真，执行此操作。\n*\
  \   `else` 子句给你提供第二个选择：如果为真，执行此操作；如果不是，执行那个。\n*   `elseif` 子句给你提供无限数量的选择！\n\n`elseif`\
  \ 语句的工作方式与 `if` 语句一样，只能用在 `if` 语句之后。`elseif` 需要一个表达式，当表达式求值为 True（真）时，就会执行该 `elseif`\
  \ 的代码块。逻辑是代码首先遇到 `if` 并做出决策。如果 `if` 块没有执行，代码将检查 `elseif`……以及下一个 `elseif`……直到你写的任意数量，直到最后的\
  \ `else`（其意思是“如果目前为止没有执行操作，则执行此”）。PHP 解析器只会执行这些代码块中的一个。\n\n> **提示**：使用 `elseif`\
  \ 时，始终有一个 `else` 语句是一个好习惯。\n\n例如，如果室外温度是 80 度，天气是温暖的；如果是在 70 到 79 度之间，天气是舒适的；如果是在\
  \ 60 到 69 度之间，天气是凉爽的；如果恰好低于 60 度，天气冻了！（好吧，对大多数人来说只是冷。）但这些情况中只有一种可能是真的。虽然口说出来很麻烦，但在逻辑上是通的。让我们看看这样的代码在程序中长什么样：\n\
  \n```php\n<?php\n$sky_color = “blue”;\n$temp_fahrenheit = “101”;\nif($sky_color\
  \ == “blue”) {\n  print(“The sky is clear today!<br />”);\n  if($temp_fahrenheit\
  \ >= 100)\n    print (“The temperature is blisteringly hot.<br />”);\n  else elseif($temp_fahrenheit\
  \ >= 90)\n    print (“The temperature is uncomfortably hot.<br />”);\n  else elseif($temp_fahrenheit\
  \ >= 80)\n    print (“The temperature is quite warm.<br />”);\n  else elseif($temp_fahrenheit\
  \ >= 70)\n    print (“The temperature is pleasant.<br />”);\n  else elseif($temp_fahrenheit\
  \ >= 60)\n    print (“The temperature is cool.<br />”);\n  else elseif($temp_fahrenheit\
  \ >= 50)\n    print (“The temperature is nippy.<br />”);\n  else\n    print (“It\
  \ is COLD!!!<br />”);\n} else { \n  print (“The sky is not blue today.<br />”);\
  \ \n}\n?>\n```\n\n\n\n\n\n关于这段代码需要考虑的关键点是 `elseif` 结构是如何工作的。如果温度高于 100 度，代码将报告其为“热得灼人”。如果温度低于\
  \ 50 度，上述代码将报告“太冷了万”。当温度在 100 度到 50 度之间变化时，温度每变化 10 度，所显示的消息就会随之改变。\n\n*提示*\n\n\
  务必双检 `elseif` 序列中的逻辑。在前面的代码示例中，考虑一下如果 `if` / `elseif` 检查中的表达式顺序是随机的，会发生什么？如果 50\
  \ 是第一个检查项呢？如果温度为 80 度，而第一个检查是查看它是否大于等于 50，那么第一个表达式将求值为真（True）。\n\n在这种情况下，温度所属的范围将无法被正确检测。顺序必须从大到小降排列，这样才能正确检测温度。\n\
  \n**switch**\n\n假设我们有一个字母，并想要确定该字母是否为元音。可以使用一个长而冗冗的 `if` 语句来判断特定字母是否为元音。另一个选项是使用\
  \ `if-elseif-else` 结构。但另一个更容易使用的选项是 `switch` 语句（也称为选择语句）。\n\n## 78\n\n# 第 4 章\n\n\
  ###流程控制与函数\n\n`switch` 的语法如下：\n\n```php\nswitch(variable)\n{\ncase “value1”:\nstatements\
  \ if variable = value1\ncase “value2”:\nstatements if variable = value2\n...\ndefault:\n\
  statements in all other instances\n}\n```\n\n列表 4.3 展示了目前为止讨论的三种决策可能性——`if`、`elseif`\
  \ 和 `switch`。\n\n**列表 4.3：演示 switch 对比 if 和 elseif (switch_vs_elseif.php)**\n\n\
  ```php\n<?php\n\n// 初始化随机数生成器\nsrand((double)microtime() \\* 1000000);\n\n// 随机选取一个小写字母并打印\n\
  $letter = chr(rand(97, 122));\n\nprint(“The letter is ‘“ . $letter . “‘<br />”);\n\
  \nprint(“Single if: “);\n\nif($letter == “a” || $letter == “e” || $letter == “i”\
  \ ||\n$letter == “o” || $letter == “u”)\n{ print(“The letter is a vowel!<br />”);\
  \ }\nelse { print(“The letter is NOT a vowel!<br />”); }\n\nprint(“If-elseif-else:\
  \ “);\nif($letter == “a”) { print(“The letter is a vowel!<br />”); }\nelse if($letter\
  \ == “e”) { print(“The letter is a vowel!<br />”); }\nelse if($letter == “i”) {\
  \ print(“The letter is a vowel!<br />”); }\nelse if($letter == “o”) { print(“The\
  \ letter is a vowel!<br />”); }\nelse if($letter == “u”) { print(“The letter is\
  \ a vowel!<br />”); }\nelse { print(“The letter is NOT a vowel!<br />”); }\n\nprint(“Switch:\
  \ “);\nswitch($letter)\n{\ncase “a”:\ncase “e”:\ncase “i”:\ncase “o”:\ncase “u”:\n\
  // 注意：这是逻辑的简化表示\nbreak;\ndefault:\nprint(“The letter is NOT a vowel!<br />”);\n\
  }\n?>\n```\n（注：提示中提供的代码块原始文本是碎片化的且包含重复/不完整的逻辑。我清理了结构以反映有效的 PHP 块，同时保留了文中描述的逻辑。）\n\
  \n**79**\n\n在将单个变量与多个潜在值进行比较时，`switch` 语句通常比长长的 `if-elseif-else` 链更整洁。每个 `case`\
  \ 关键字后面都跟着要比较的值。如果变量匹配该值，则执行该 `case` 之后的代码。如果没有任何其他 `case` 匹配，则执行 `default` 情况。\n\
  \n\n\n\n循环像之前讨论的结构一样，可以相互嵌套。列表 4.5 是另一个“字母汤”（alphabet soup）的示例，它更加复杂，也许也更有趣。\n\n\
  ## 列表 4.5：高级 while 循环 (alpha_soup.php)\n\n```html\n<html>\n<head>\n<title>While</title>\n\
  </head>\n<body>\n<h3>Alphabet Soup</h3>\n<?php\n// 种子随机数生成器\nsrand((double)microtime()\
  \ * 1000000);\n$number = 1;\n$letter = chr(rand(97, 122));\n$total_letters = 0;\n\
  $lines_printed = 0;\n$letters_per_line = 0;\nwhile($number != 25)\n{\n    while(strcmp($letter,\
  \ “z”))\n    {\n        print($letter);\n        $letter = chr(rand(97, 122));\n\
  \        $total_letters++;\n    }\n    // 换行字母行\n    print(“<br />”);\n    $lines_printed++;\n\
  \    $number = rand(1, 25);\n    $letter = chr(rand(97, 122));\n}\n$letters_per_line\
  \ = $total_letters / $lines_printed;\nprint(“<br />打印的字母总数为 $total_letters 句.”);\
  \ \nprint(“<br />总共打印了 $lines_printed 行。”);\nprint(“<br />平均打印了 $letters_per_line\
  \ 个字母。”);\n?>\n</body>\n</html>\n```\n\n列表 4.5 中的“汤”可能会产生无限数量的字母。当然，我们信任统计学，并知道它平均会产生\
  \ 12.5 行字母，每行平均包含 13.5 个字母。\n\n### do-while\n\n用 `do-while` 构建的循环与普通的 `while` 循环完全相同，只有一个例外：无论循环条件如何评估，为循环指定的代码块始终至少执行一次。`while`\
  \ 循环使得循环的控制表达式更加清晰且易于访问；这也是为什么 `while` 使用更频繁的原因。`while` 还提供了更大的灵活性，因为第一次迭代不需要执行。\n\
  \n要写一个 `do-while` 循环，输入 `do`，然后在大括号中输入受控的代码块，并在大括号*之后*插入 `while` 及其表达式。（`do-while`\
  \ 循环不需要大括号，但建议使用，因为它们能让代码更易理解。）`do-while` 循环在整个语句的末尾*必须*有一个分号，所示：\n\n```\ndo\n{\n\
  \    至少执行一次，然后重复执行的语句\n} while(test_expression);\n```\n\n`do-while` 循环可以使代码更加简洁，同时保持完全的可读性。它始终可以确保至少执行一次，因此循环条件通常可以在第一次循环迭代期间初始化，而不是在循环外部。\n\
  \n如果你仔细检查列表 4.5 中的脚本，你会发现 `do-while` 循环的完美用处。\n\n我们可以用 `do-while` 循环替换内部的 `while`\
  \ 循环，并去掉外层 `while` 循环中的 `$letter` 赋值。使用 `do-while` 循环，列表 4.5 中的 `while` 循环看起来如下：\n\
  \n```php\nwhile($number != 25)\n{\n    do\n    {\n        $letter = chr(rand(97,\
  \ 122));\n        print($letter);\n        $total_letters++;\n    } while(strcmp($letter,\
  \ “z”));\n    // 换行字母行\n    print(“<br />”);\n    $lines_printed++;\n    $number\
  \ = rand(1, 25);\n}\n```\n\n在前面的示例中，当随机选择的字母是 `z` 时，内部的 `while` 循环在外部 `while` 循环选择另一个非\
  \ `z` 字母之前不会再次执行。如果我们始终确定内部循环会执行一次，那么我们可以在内部循环的开始随机选择字母。\n\n### for\n\n这是另一个继承自\
  \ C 语言的循环结构。`for` 循环看起来如下：`for(expression1; expression2; expression3)`\n\n```\n\
  {\n    需要重复的语句\n}\n```\n\n`for` 循环的第一个表达式毫无疑问地至少执行一次，通常用于初始化循环变量。在 `for` 循环的每次迭代中，都会评估\
  \ `expression2`。如果 `expression2` 结果为真（True），则执行循环；如果评估结果为假（False），则退出循环。在 `for`\
  \ 循环的每次迭代后，都会执行 `expression3`。\n\n### 列表 4.6：生成网页安全调色板\n\n```html\n<html>\n<head>\n\
  <title>Web-Safe</title>\n</head>\n<body>\n<table width=”400” cellpadding=”0” cellspacing=”0”\n\
  <?php\n$i = 1;\nfor($red = 0; $red < 6; $red++) {\n    for($green = 0; $green <\
  \ 6; $green++) {\n        for($blue = 0; $blue < 6; $blue++) {\n            $hex_color\
  \ = $red . $green . $blue;\n            print：“<td bgcolor=\\\"$hex_color\\&nbsp;</td>>”);\n\
  \            if($i % 6 == 0) {\n                print(\"</tr><tr>”);\n         \
  \   }\n            $i++;\n        }\n    }\n}\n?>\n</table>\n</body>\n</html>\n\
  ```\n\n### foreach\n\n另一种循环结构是 `foreach`，用于检查或操作数组中的项。`foreach` 允许通过对每个包含的元素循环一次，以最少的麻烦轻松处理数组（这种一个接一个的操作被称为对数组进行“遍历”，iterating）。这里是\
  \ `foreach` 的基本结构：\n\n```\nforeach(array as expression)\n{\n    需要重复的语句\n}\n```\n\
  \n### 列表 4.7：使用 foreach 遍历数组\n\n```php\n<?php\n$prog_language[] = “PHP”;\n$prog_language[]\
  \ = “C”;\n$prog_language[] = “C++”;\n$prog_language[] = “Java”;\n$prog_language[]\
  \ = “Forth”;\n$prog_language[] = “Perl”;\n$prog_language[] = “Python”;\n$prog_language[]\
  \ = “Ruby”;\n\nforeach($prog_language as $language)\n{\n    if(!strcmp($language,\
  \ “PHP”))\n        print：“<b>” . $language . “</b> <br />”);\n    else\n       \
  \ print($language . “ <br />”);\n}\n?>\n```\n\n\n\n\n`$prog_language[]` 数组在脚本的前几行中进行了初始化。之后，`foreach`\
  \ 循环会对该变量“集合”（或更准确地说，一个数组）中的每个项目执行一次。\n\n随着循环的进行，每种编程语言都会被打印出来。\n\n使用 `foreach`\
  \ 处理数组的另一种有用方法。以下语法便于在不进行额外工作的情况下，使当前数组元素的值可用。\n\n```php\n<?php\n$prog_lang_year\
  \ = Array(“C” => “the early 70’s”,\n“Perl” => “1987”,\n“PHP” => “1994”,\n“Java”\
  \ => “1995”);\nforeach($prog_lang_year as $language => $year)\nprint($language .\
  \ “ was started in “ . $year . “.<br />”);\n?>\n```\n\n`=>` 运算符将值分配给数组中的键。这种数组表示法非常有用，因为它避免了循环内部的额外步骤；通常仍然需要获取特定键的值。在这个示例中，值和键在循环结构本身中都变得可用了。\n\
  \n`$prog_lang_year` 数组是一个关联数组（在第 2 章“变量”中引入）。这种语法允许在循环结构定义中轻松地设置键和值，而不是在每次循环迭代中手动地执行此操作。这种语法使得处理关联数组变得更加简洁且易于理解。\n\
  \n*注意*\n\n关于数组和数组操作的更多信息，请参阅第 5 章。\n\n### break\n`break` 关键字用于退出循环或停止 `switch` 语句的“穿透（falling\
  \ through）”。当 PHP 解释器遇到 `break` 时，循环或 `switch` 语句将停止评估。有时你可能想要跳出循环，因为你已经实现了所需的处理。要“跳出”循环，你只需使用\
  \ `break` 语句。每当执行此语句时，循环就会停止。\n\n一个循环被说成嵌套了“多少层”深。如果你有两个循环，其中一个循环包含在前一个循环的控制块内部，那么第二个循环被认为嵌套了二层。\n\
  \n```php\n<?php\n// 设定随机数生成器种子\nsrand((double)microtime() \\* 1000000);\n$number\
  \ = rand(1, 1000);\n// 开始一个无限循环\nfor($i = 1; ; $i++)\nif($number == 999)\nbreak;\
  \ // 停止这个并不无限的循环\nelse\n$number = rand(1, 1000);\n\nLOOPING 87\nprint(“It took “\
  \ . $i . “ iterations for the loop to exit.”);\n?>\n```\n\n当在嵌套循环中使用 `break` 时，只有被跳出的那个循环会退出，如代码列表\
  \ 4.8 所示。\n\n**代码列表 4.8: 嵌套循环中的 break (break.php)**\n\n```html\n<<html>\n<head>\n\
  <title>Break Nested</title>\n</head>\n<body>\n<?php\n// 设定随机数生成器种子\nsrand((double)microtime()\
  \ \\* 1000000);\n$number = rand(1, 1000);\n$j = 0;\n$outer_loop_itr = 50;\nfor($i\
  \ = 1; $i <= $outer_loop_itr; $i++)\n{\n$j = 0;\ndo\n{\n$j++;\n$number = rand(1,\
  \ 1000);\nif($number == 999)\nbreak;\n} while(1);\n$num_iterations[$i] = $j;\n}\n\
  $avg_iterations = (array_sum($num_iterations) / $outer_loop_itr);\nprint(“It took\
  \ an average of “ . $avg_iterations .\n“ iterations to exit the inner do-while loop\
  \ <br />”);\n?>\n</body>\n</html>\n```\n\n在列表 4.8 中，有两个循环。外层循环根据 `$outer_loop_itr`\
  \ 迭代。内层循环是一个无限循环并增加变量 `$j`，直到内层循环中的随机数变为 999。内层循环退出后，迭代次数保存到 `$num_iterations` 数组中，然后计算平均迭代次数。\n\
  \n88\n\n### continue\n`continue` 关键字用于循环。当在循环内部使用 `continue` 时，循环会回到开头并开始下一次迭代。当循环迭代不应执行任何操作或应在某处停止时，这种语法非常方便。以下代码段演示了\
  \ `continue` 的用法。\n\n```php\n<?php\n// 设定随机数生成器种子\nsrand((double)microtime() \\\
  * 1000000);\n$number = rand(1, 25);\n$exit_outer_loop = false;\n// 开始一个无限循环\nfor(;;)\n\
  {\nif($exit_outer_loop)\nbreak;\nswitch($number)\n{\ncase 5:\ncase 10:\ncase 15:\n\
  case 20:\n// 继续进行直到遇到 25\n$number = rand(1, 25);\ncontinue;\ncase 25:\n$exit_outer_loop\
  \ = true;\nbreak;\ndefault:\n{\nprint($number . “<br />”);\n}\n}\n}\n?>\n```\n\n\
  利用函数的优势\n89\n\n函数可以被视为“黑盒”，因为它们可以隐藏某些代码块正在做什么。这种想法的原因是：程序员并不总是需要知道事情是如何实现的，只需要知道它们正在执行并获得有用的结果。例如，在一个五五个开发者的团队中，只有一个人编写应用程序的错误日志函数。团队中的其他程序员不需要知道该函数是如何记录到数据库的，只需要如何与该函数交互以便将其记录到数据库中。\n\
  \n\n\n\n函数还应该隐藏实现细节。如果一个应用程序没有错误日志函数，而在整个应用程序中反复使用相同的百行代码来记录错误日志，那么在那个应用程序中更改错误日志记录（即使是微小的更改）将是一场噩梦。如果将错误日志封装在一个函数中且其接口保持不变，则可以在一个地方更改函数。使用该函数的应用程序不会察觉到变化，其他程序员也不会。使用函数的原因是多方面的，在这里无法进行简单的解释。只需说，函数是可用语言构造中最重要的且最实用的构造之一。\n\
  \n函数原型（`prototype`）是特定函数接口的定义。通过函数原型，你可以确定每个参数的数据类型。原型还告诉你是特定函数的返回类型。有了这些信息，就可以使用该函数。形态的用处在于它们的引用特性；它们让你能够快速地确定应该如何与特定函数进行交互。鉴于\
  \ `PHP` 中参数的数量巨大，很容易忘记参数的精确顺序或数据类型。\n\n到目前为止，本书中的示例已经相当广泛地使用了函数。书中使用的函数都是通过 `PHP`\
  \ 扩展或作为 `PHP` 主分发的一部分包含在其中。`PHP` 自带的函数提供了接口和工具，用于在 `PHP` 中实现各种任务。这些函数提供了巨大的价值，其中许多专门为了让\
  \ Web 开发变得更加简单。\n\n## 编写函数\n\n编写函数并不是一种需要黑暗仪式的黑暗秘密——实际上，函数的编写和使用非常直观。编写函数的第一步是使用\
  \ `function` 关键字，后面跟着函数名。函数名之后是左括号、参数，然后是右括号。函数的最后（通常也是最大的）部分是实际代码。如果函数只包含一行，则不需要大括号；然而，使用大括号可以清楚地显示函数代码块的位置。下面的代码是一个简单的函数，它使用\
  \ `return` 关键字返回结果。`return` 用于从函数返回结果，该结果可以作为表达式中的任何其他值使用。\n\n```php\n<?php\nfunction\
  \ do_stuff($argument)\n{\n    return (3.141) * ($argument * $argument);\n}\n\n$circle_radius\
  \ = 7.5;\n$circle_area = do_stuff($circle_radius);\nprint(“The circle has an area\
  \ of “ . $circle_area);\n?>\n```\n\n这个函数由单行组成，计算圆的面积。该函数的唯一参数是圆的半径。然而，上面的例程存在几个问题。该例程的命名模糊，参数名称也笼统。选择糟糕函数名的结果并不理想。良好的命名最显而易见且最重要的原因是代码的可读性。与命名为\
  \ `calc_circle_area()` 的函数相比，一个命名为 `circle()` 的计算圆面积函数并不直观，后者精确地标识了函数的目的。另一个令人困的问题是，函数的消费者——即任何可能重用该函数的其他人——会继承一个命名糟糕的函数。函数名就像变量名一样，应该精确且无歧地标识函数的目的。函数还应该符合整体的命名方案，以便函数组易于辨别。下面的代码段演示了正确的命名，是同一例程的高质量版本。\n\
  \n```php\n<?php\n// Calculate the area of a circle\nfunction calc_circle_area($radius)\n\
  {\n    return (M_PI * (pow($radius, 2)));\n}\n\n$circle_radius = 7.5;\n$circle_area\
  \ = calc_circle_area($circle_radius);\nprint(“The circle has an area of “ . $circle_area);\n\
  ?>\n```\n\n函数的参数 `radius` 现在被清晰地标记了。参数是传递到函数的数据。实现的有用结果是根据参数（在本例中为圆的半径）计算圆的面积。函数返回的值随后可以在任何\
  \ `PHP` 表达式中使用，就像所有其他 `PHP` 函数一样。在我们案例中，函数的结果被赋值给变量 `circle_area`。\n\n该函数使用了预定义的数学常量\
  \ `M_PI`，它是 π 的值。另一个函数 `pow` 需要两个参数；它接收第一个参数并将其提升到第二个参数的幂（“pow”er）。在我们的案例中，`pow`\
  \ 的第一个参数是圆的半径。第二个参数是基数应该被提升的幂；要找到圆的半径，使用 π*r*2。这意味着首先使用 `pow` 函数对半径进行平方，然后乘以数学常量\
  \ `M_PI`。括号明确了表达式求值的精确顺序，确保面积被正确计算。\n\n> **提示**：在程序中，如果某些数字或字符串被多次使用且不经常更改；这些数字或字符串应该被定义为常量。常量\
  \ π 非常常见，因此是预定义的；程序中的任何其他常量都需要使用 `define` 结构来创建。常量可以提高可读性和可维护性，就像函数一样。\n\n## 函数参数\n\
  \n参数是函数所需的数据；它们通常是“传递”给函数的变量，即提供给函数供函数操作的数据。函数的参数有助于定义函数的接口。在声明函数时，参数是函数声明中括号之间的所有内容。（在此语境下，`argument`\
  \ 和 `parameter` 术语几乎可以互换。）\n\n# 第 4 章\n\n## 流程控制与函数\n\n> **提示**：你有时会看到单词（如函数名或流程控制关键字）与后面的左标点符号之间有空格：`count($items)`\
  \ 和 `count ($items)` 的作用是相同的。\n\n用户定义的函数可以具有具有数量数量的参数列表。我们的示例函数将突出字符串内给定长度的文本。高亮的默认颜色是红色，并有更改使用的颜色的选项。函数的颜色参数是可选的，这意味着我们的函数必须在调用时检测是否向函数传递了参数。\n\
  \n列表 4.9 中的代码利用变长函数参数来增强函数的功能。\n\n**列表 4.9: 可选函数参数 (optional.php)**\n\n```php\n\
  <?php\nfunction str_highlight($str, $start, $length)\n{\n    if(func_num_args()\
  \ < 4)\n        $color = \"#FF0000\";\n    elseif(func_num_args() == 4)\n      \
  \  $color = func_get_arg(3);\n    else\n        return $str;\n\n    $str_highlight\
  \ = substr($str, $start, $length);\n    $str_highlight = \"<span style=\\\"color:$color;\
  \ font-weight:bold;\\\"\" .\n    $str_highlight . \"</span>\";\n    return substr_replace($str,\
  \ $str_highlight, $start, $length);\n}\n\n$my_str = “All eppsling errors should\
  \ be highlighted.”;\n// 自定义颜色\n$highlighted_str = str_highlight($my_str, 4, 8, “#0000FF”);\n\
  print($highlighted_str . “<br />”);\n\n// 使用默认高亮颜色\n$highlighted_str = str_highlight($my_str,\
  \ 4, 8);\nprint($highlighted_str . “<br />”);\n?>\n```\n\n\n\n此函数定义了三个参数，并带有一个可选的第四参数。如果在调用函数时没有第四个参数，该可选参数将始终初始化为常量“#FF0000”。默认参数的设计用于确保函数的所有参数在函数内部都是可用的，即使在函数调用中并不要求提供所有参数。当某个特定函数有一个非常常用的参数，或者该参数经常根本不需要时，这种方法就非常有用。\n\
  \n# 充分函数\n\n## 93\n\n如果向列表 4.9 中的函数传递了四个以上的参数，则传递给函数的字符串将按原样返回。\n\n### 警告\n\n确保可选参数始终位于括号列表的末尾。如果你不这样做，那么在传递参数时，解释器将不知道哪些参数是真正想要传递的，从而导致错误。\n\
  \n`func_get_args()` 函数应该只在函数内部使用。函数的参数编号（或索引）从 0 开始计数。`func_num_args()` 函数返回特定调用中传递给函数的参数数量。最后一个用于操作函数参数的实用函数是\
  \ `func_get_args()`，它以数组的形式返回传递给函数的参数，同样从 0 开始索引。\n\n## 函数内部与外部的作用域\n\n变量的作用域是变量可以访问的范围。尽管到目前变量作用域还没有出现问题，但现在我们编写自己的函数，作用域变成了一个更需要检查的问题。变量作用域决定了当脚本的不同部分包含同名变量时会发生什么。考虑以下内容：\n\
  \n```php\n<?php\n$a = “Main Body <br />”;\n\nfunction print_string()\n{\n$a = “Inside\
  \ print_string() <br />”;\nprint($a);\n}\n\nprint_string();\nprint($a);\n?>\n```\n\
  \n上述片段输出：\n\nInside print_string()\nMain Body\n\n因此，该函数并没有以任何方式覆盖或更改主脚本体的 `$a` 变量。`print_string()`\
  \ 函数内部的变量 `$a` 被认为作用域相对于 `print_string()` 函数“局部”。局部作用域意味着仅在指定的范围内有效；函数内部使用的任何变量默认都会创建一个该特定函数的局部变量。尽管主脚本开头有一个\
  \ `$a`，但在 `print_string()` 函数内部创建了一个完全全新的 `$a` 变量。\n\n保持其身份的变量——无论在何处使用始终是同一个引用——被称为具有全局作用域。所以，下一个应该问的问题是：我们在函数块的代码中如何修改主体的\
  \ `$a` 变量呢？当然是使用 `global` 关键字！\n\n```php\n<?php\n$a = “Main Body <br />”;\n```\n\
  \n## 94\n\n# 第 4 章\n###流程控制与函数\n\n```php\nfunction print_string()\n{\nglobal $a;\n\
  $a = “Inside print_string() <br />”;\nprint($a);\n}\n\nprint_string();\nprint($a);\n\
  ?>\n```\n\n该片段现在输出：\n\nInside print_string()\nInside print_string()\n\n现在主脚本体的 `$a`\
  \ 变量被我们的函数修改了，因为我们将函数内部的 `$a` 变量标识为全局变量。`global` 关键字的作用正如其名所示：它将变量标识为全局变量。函数内部的任何全局变量都不会分配额外的内存，因为它正在使用已经存在的变量。\n\
  \n过度使用全局变量是非常具有诱人的。函数的完全目的是封装代码并隐藏数据。如果每个函数都使用全局变量，那么使用函数的几个优势就会消失。\n\n所有全局变量都存储在一个关联数组中。该数组可以在函数内部访问，并允许在不使用\
  \ `global` 结构的情况下访问全局变量。请看以下片段示例：\n\n```html\n<html>\n<head>\n<title>作用域</title>\n\
  </head>\n<body>\n<?php\n$a = “Main Body <br />”;\n\nfunction print_string()\n{\n\
  $GLOBALS['a'] = “Inside print_string() <br />”;\n}\n\nprint_string();\nprint($GLOBALS['a']);\n\
  ?>\n</body>\n</html>\n```\n\n根据此片段的行为，可以确定 `GLOBALS` 数组允许访问全局声明的变量。这允许对全局变量进行读取和修改。\n\
  \n# 充分函数\n\n## 95\n\n在设计函数时，应该始终仔细考虑使用全局变量的重要性。\n\n## 静态变量\n\n另一种类型的变量是静态变量，它是使用\
  \ `static` 关键字声明的局部作用域变量。使用静态变量比使用全局变量要整洁，例如用于计算函数被调用的次数。以下片段演示了这一点：\n\n```php\n\
  <?php\n$a = “Global Scope <br />”;\n$b = “Global Scope <br />”;\n\nfunction inc_counter()\n\
  {\nstatic $b = 0;\nprint(++$b . “<br />”);\n}\n\ninc_counter();\ninc_counter();\n\
  inc_counter();\ninc_counter();\nprint($a);\nprint($b);\n?>\n```\n\n### 递归\n\n递归函数是指可以调用自己的函数。考虑一下这一点：调用自己的函数应该被谨慎对待。递归函数可能会导致非最优的解决方案，而且它们必须正确实现，否则会导致无限循环。\n\
  \n递归函数对于解决可以逐步分解为较小任务的问题很有用，例如遍历树。在实践中，很少需要的递归解决方案通常不会提高性能或让程序更高效，但递归解决方案通常更容易理解且代码更紧凑。\n\
  \n递归函数每次调用自身时，默认都会创建一个新的局部变量。列表 4.10 演示了一个递归函数。\n\n**列表 4.10: 递归 (recurse.php)**\n\
  \n```html\n<html>\n<head>\n<title>递归</title>\n</head>\n<body>\n<?php\nfunction cnt_backwards($from)\n\
  {\n$from--;\nif($from <= 1)\n{\nprint($from);\nreturn;\n}\nprint($from);\ncnt_backwards($from);\n\
  }\n\ncnt_backwards(5);\n?>\n</body>\n</html>\n```\n\n\n\n请记住 `static` 创建的变量在函数首次调用后会在局部作用域内持续存在。如果你希望递归函数对同一个变量进行反复操作，这可能正是你需要的。在递归函数中，函数会迭代地调用自己。这通常意味着为了跟踪正在处理的变量，必须将它们作为参数传递，或者将它们声明为\
  \ `static`。当我们需要使用的变量声明为 `static` 时，它们会持续存在局部作用域中，并可以被后续所有的递归调用访问。静态变量通常比处理多个函数参数简单得多。\n\
  \n递归往往会导致代码运行速度变慢且效率低下。考虑列表 4.11 中的示例，它比较了反转字符串内容的两种方法：使用递归和使用 PHP 的内置函数 `strrev()`。\n\
  \n## 函数的优势\n\n**97**\n\n### 列表 4.11：使用递归的低效字符串反转 (str_rev.php)\n\n```php\n<?php\n\
  \nfunction get_microtime()\n{\n    list($usec, $sec) = explode(\" \", microtime());\n\
  \    return ((double)$usec + (double)$sec);\n}\n\nfunction str_rev($str)\n{\n  \
  \  $cnt++;\n    if(strlen($str) == 1)\n        return $str;\n    $local_str = substr($str,\
  \ strlen($str) - 1, 1);\n    $local_str = $local_str . str_rev(substr($str, 0, strlen($str)\
  \ - 1)); \n    return $local_str;\n}\n\n$teststr = \"\";\nfor($i = 0; $i < 25; $i++)\n\
  \    $teststr .= \"This is a string!\";\n// 基准测试原生 PHP 字符串反转\n$start_time = get_microtime();\n\
  $test = strrev($teststr);\n$end_time = get_microtime();\n$native_time = round((float)(($end_time\
  \ - $start_time) * 1000), 2); \nprint(\"Native processing time: {$native_time}ms\
  \ <br />);\n\n// 基准测试递归自定义字符串反转\n$start_time = get_microtime();\n$test = str_rev($teststr);\n\
  $end_time = get_microtime();\n$recurse_time = round((float)(($end_time - $start_time)\
  \ * 1000), 2); \nprint(\"Custom function processing time: {$recurse_time}ms <br\
  \ />\"); \n$speed_factor = $recurse_time / $native_time;\n\nprint(\"Native string\
  \ reversal is approximately \" . $speed_factor . \" quicker.\");\n?>\n```\n\n列表\
  \ 4.11 中的代码进行了一些简单但具有说明意义的性能分析。递归函数总是会比原生字符串反转函数慢。通过观察两个函数完成任务所需的时间，可以衡量它们彼此的性能对比，假设每个函数都在执行完全相同的任务。新的递归版本\
  \ `str_rev()` 滞后于原生函数得多。\n\n![Image 12](img/index-123_1.png)\n\n**98**\n\n# 第 4\
  \ 章\n\n## 控制与函数\n\n新函数使用线性递归很方便地反转了字符串。这种方法迭代地从字符串中取最后一个字符，然后调用自己。最后再将第一个字符连接到末尾。\n\
  \n当传递给递归函数的字符串长度为 1 时，递归停止。所有递归函数随后返回它们的值，连接被移除的字符，从而得到一个完全反转的字符串。\n\n图 4.1 展示了这种递归方法的开销。必须理解的是，我们使用递归的自定义\
  \ `str_rev()` 是极其低效的。所示的执行时间仅衡量了两个函数——原生 PHP `strrev()` 和我们自定义的递归 `str_rev()`——之间的运行时间对比。生成的图表完全不能反映任何真实世界的性能，并且会根据机器和版本的不同而异。\n\
  \n**图 4.1**\n递归字符串反转处理时间\n\n图 4.1 中的图表展示了递归方法相对于原生 PHP 方法的缓慢。对于所有图出的数据点，原生函数在不到一毫秒的时间内完成了反转……这就是为什么图表中甚至没有显示出“原生时间（Native\
  \ Time）”的线条！递归版本则步履维艰。\n\n重要的是记住，不要总是重复发明轮子，无论发明的过程有多么有趣。然而，即使考虑到性能因素，当使用得当时，递归解决方案仍然可以非常高效。\n\
  \n### 使用函数进行决策\n\n函数有多种用途。它们通常用于构建脚本的逻辑和流；换句话说，函数负责做决策。假设某部分代码*仅*在字符串*不*空时必须执行。可以使用\
  \ `strcmp()` 函数比较两个字符串（它的两个参数）并判断它们相等或不相等。我们可以使用 `strcmp()` 来根据字符串是否相等来进行决策。\n\n\
  ## 函数的优势\n\n**99**\n\n### 列表 4.12：做出决策 (decisions.php)\n\n```html\n<html>\n<head>\n\
  <title>决策</title>\n</head>\n<body>\n<?php\n$str_ctrl_flow = \"go\";\nif(!strcmp($str_ctrl_flow,\
  \ \"go\"))\n{\n    print(\"The string is \\\"go\\\", so we should keep going <br\
  \ />\");\n}\nelse\n{\n    print(\"Time to stop this script <br />\");\n    exit;\n\
  }\n$str_ctrl_flow = \"stop\";\nif(!strcmp($str_ctrl_flow, \"go\"))\n{\n    print(\"\
  The string is \\\"go\\\", so we should keep going <br />\");\n}\nelse\n{\n    print(\"\
  Time to stop this script <br />\");\n    exit;\n}\nprint(\"This won’t print.<br\
  \ />\");\n?>\n</body>\n</html>\n```\n\n`strcmp()` 函数首先需要一些解释。当两个字符串相等时，它返回 0（即假）。当第一个参数小于第二个参数时，`strcmp()`\
  \ 返回负数，当第一个参数大于第二个参数时返回正数。记住，字符串在内部用数字表示，因此一个字符串可以“小于”或“大于”另一个。通常，`strcmp()` 的用途是判断一个字符串是否相等。列表\
  \ 4.12 展示了如何使用 if 控制流。记得 if 结构在表达式为真时会执行。`strcmp($str_ctrl_flow, \"go\")` 将变量字符串与\
  \ \"go\" 进行比较，第一次返回 1，第二次返回 0。\n\n**100**\n\n# 第 4 章\n\n## 控制与函数\n\n逻辑非（`!` 或“bang”运算符）随后应用于函数结果。因此，当\
  \ `strcmp()` 产生匹配并返回 0 时，`!` 使其变为真，`if` 关键字得以满足。该表达式读起来就像“如果非 strcmp(...)”——即“如果\
  \ strcmp(...) 为假”——那么执行这部分代码。”\n\n列表 4.12 中的 if 检查可以用以下代码段替换，实现相同的逻辑：`if(strcmp($str_ctrl_flow,\
  \ \"go\") == false)`\n\n### 函数与引用\n\n引用是指代变量的方式。正如你在第 2 章中学的，引用就像指向相同内容的多个标识符。在没有可用引用之前，该内容是可访问的；否则它就“离开了作用域”。那么引用与函数之间有什么关系？可以定义一个函数，使得当变量传递到函数时，它实际上使用的是该特定的引用，而不是本地副本。假设我们想要一个可以返回多个值的函数：\n\
  \n```php\n<?php\n$val1 = \"\";\n$val2 = \"\";\n\nfunction return_multi_value(&$value1,\
  \ &$value2)\n{\n    $value1 = \"This is the first value\";\n    $value2 = \"This\
  \ is the second value\";\n}\n\nreturn_multi_value($val1, $val2);\nprint(\"$val1<br\
  \ />$val2<br />\");\n?>\n```\n\n\n\n前面的代码段需要两个变量作为参数。在函数 `return_multi_value()`\
  \ 内部对 `$value1` 或 `$value2` 的任何使用会导致传入变量的实际内容被修改，因为参数被强制设为引用（通过 ampersand `&`）。这种用法的意义非常重要：使用引用作为参数的函数可以修改全局数据。然而，请谨慎地使用引用作为函数参数，以防止产生困惑且神秘的错误（bug）潜入到应用程序中。一个可以修改全局数据的函数不再是一个“黑盒”，因为它的操作跨越了常规的边界，修改了单体函数作用范围之外的数据。\n\
  \n在某些情况下，让函数使用变量的引用是理想的，特别是当变量是一个复杂的数据结构时，在函数的局部作用域内复制它的开销很大。\n\n如果你只是有时才需要引用，则无需将函数定义为始终通过引用传递参数。对你来说，以通常的方式定义函数，然后在函数调用时传递引用可能更安全，如下所示：\n\
  \n```php\n<?php\n\n$val1 = \"\";\n\n$val2 = \"\";\n\n// 利用函数的优势\n// 101\n\nfunction\
  \ return_multi_value($value1, $value2)\n{\n\n    $value1 = \"This is the first value\"\
  ;\n    $value2 = \"This is the second value\";\n}\n\nreturn_multi_value(&$val1,\
  \ &$val2);\n\nprint(\"$val1<br />$val2<br />\");\n\n?>\n```\n\n### 重用函数\n\n现在假设在设计了一个函数库后，我们想在多个地方使用该库。将函数库拷贝到每个使用该库的脚本中仍然是低效的。实现代码可重用的最后一步是语言构造结构：`include()`\
  \ 和 `require()`。\n\n这些函数允许函数库存在于与应用程序其他脚本分离的文件中。\n\n当需要函数库时，包含函数的文件的可以被包含到必须使用该库的脚本中，这些函数的使用就像它们已经实际上被复制到脚本中一样。（实际上，这正是正在发生的情况，但在后台根据需要进行操作。）这样做有几个优点。现在，我们可以真正地只修改一次函数，并让更改在所有使用该函数的脚本中生效。此外，该库可以轻松地分发给任何了解这些函数作用以及如何使用它们的人。\n\
  \n使用 `require()` 和 `include()` 还有一个重要的注意事项。任何使用 `include()` 构造包含的文件都会被求值为一个 HTML\
  \ 文件，这意味着任何必须执行的 PHP 脚本仍然必须封装在 PHP 脚本块中。\n\n#### include()\n\n考虑以下场景。你的开发团队将一个顶尖数学库的开发外包给了一个数学家精英。数学家们根据你的规范开发了库，并向你提交了一个包含函数的文件。数学库开发完成后，你的团队拥有了一个包含\
  \ PHP 函数的文本文件。\n\n库的意义在于为所需的功能提供一个整洁的接口。`include()` 构造将用于让任何利用数学库的脚本都能使用该库。注意，`include()`\
  \ 确实是一个语言构造，而不仅仅是另一个函数。`语言构造`不需要括号，因为它本质上不是函数调用。以下两种语法都是等效的：\n\n```php\ninclude\
  \ \"file1.php\";\n\ninclude(\"file1.php\");\n```\n\n列表 4.13 是数学库，可以在 CD 中找到，因此你不需要输入整个库。列表\
  \ 4.14 显示了一个利用该数学库的示例 HTML 页面。\n\n**102**\n\n# 第 4 章\n\n## 流程控制与函数\n\n#### 列表 4.13：数学函数库\
  \ (math_lib.php)\n\n```php\n<?php\n\nfunction subtract($n1, $n2)\n{\n\n    return\
  \ $n1 - $n2;\n}\n\nfunction add($n1, $n2)\n{\n\n    return $n1 + $n2;\n}\n\nfunction\
  \ divide($n1, $n2)\n{\n    if ($n2 != 0) {\n        return $n1 / $n2;\n    } else\
  \ {\n        return \"Division by zero\";\n    }\n}\n\nfunction multiply($n1, $n2)\n\
  {\n\n    return $n1 * $n2;\n}\n\n?>\n```\n\n列表 4.14 显示了利用该数学库的示例 HTML 页面。（注：原文此处未给出列表\
  \ 4.14 具体代码，翻译仅针对描述）\n\n\n\n\n到目前为止，我们介绍了 PHP 以及它所生存的 HTML 世界。我们描述了该语言的基础知识——其操作符、数据类型、语法等，并开始构建\
  \ PHP 常用的常见活动。\n\n你的 Web 应用程序需要执行的真正有趣的事情涉及文本。这正是 `strings`（字符串）用用场——一种允许你携带和处理文本信息的数据类型。在讨论字符串时，如果能够以简写的方式引用数据、搜索常用元素或对整类字符和序列应用操作，将非常有帮助。实现所有这一切的工具是\
  \ `regular expressions`（正则表达式）。我们将介绍正则表达式如何与字符串交互，从而让你的字符串处理变得更容易、更强大。\n\n`Arrays`（数组）比目前讨论的标量数据类型更复杂的工具，但它们让你的\
  \ Web 应用程序能够以简单复杂的方式处理数据之间的关系。\n\n## 字符串\n\n互联网的核心是让信息易于获取，而互联网上最有效的通信手段（且可能在未来一段时间内一直是）文本。互联网用户通过文本通信，个人数据存储为文本，思想通过文本传递；互联网围绕着文本展开。是的，互联网上可以使用交互式小程序、电影、流媒体音频和其他类型的多媒体内容，但文本仍然是交换的主要手段。在\
  \ PHP 中，文本数据包含在 `strings` 中。\n\n当我们谈论 PHP 中的 `string` 时，通常指的是引号之间的一组字符，或者一个数据类型被设置为\
  \ `string` 且内容代表文本数据的变量。字符串数据类型是 PHP 中的基本类型之一，其他还有 `Boolean`、`integer`、`float`、`array`\
  \ 和 `object`。由于字符串持有文本数据，它们是任何编程语言中最重要的数据类型之一，显而易见：人类用单词交流，单词由文本数据组成，而计算机程序通常是为了与人类交互。在\
  \ Web 应用开发中，字符串无处不在。当用户提交表单时，表单数据作为 `string` 提交。当数据库返回查询结果时，它通常以一组字符串的形式返回。从文件中读取数据时，即使文件包含二进制数据，它也会作为\
  \ `string` 读取。\n\n# 第 5 章\n\n## 字符串与数组\n\n从技术上说，字符串实际上并不是由“文本”组成的。在内部，它仅仅是一个一个或多个\
  \ 8 位值（通常称为 `octets`，字节）的序列。当这些值存在类型设置为 `string` 的变量内部时，它们代表单个语言字符，如字母、数字和标点符号。因此，字符串\
  \ `cat` 并不包含字母 `c-a-t`；它包含了三个字节 `1100011`、`1100001` 和 `1110100`；在大多数字符集中，这些字节对应于字母\
  \ `c`、`a` 和 `t`。\n\n因此，当你在 PHP 脚本中编写 `print('cat');` 时，Web 服务器向浏览器发送字节 `1100011`、`1100001`\
  \ 和 `1110100`。此的副作用是 PHP 中的字符串在功能上被限制为 8 位字符，这使得处理来自日语等语言的多字节字符变得棘手。\n\n当使用 PHP\
  \ 的内置函数处理字符串时，如果字符串包含多字节字符，你将得到不可预测（很可能是错误)）的行为。\n\n### 注意\n\n多字节字符串的问题不在于你无法创建它们，而是\
  \ PHP 期望任何给定字符串中的每组八位序列都代表一个单个字符。对于英语或许多欧洲语言来说这不是问题，但对于日语等语言，由于字符数量太多，无法全部用 8 位值表示，单个字符可能由多于八位的位表示。然而，并非没有希望：PHP\
  \ 通过 `mbstring` 扩展对处理多字节字符串提供了有限的支持。详情请参阅 `www.php.net/manual/en/ref.mbstring.php`。\n\
  \nPHP 提供了许多内置函数来处理字符串。我们将描述最常用和最实用的那些。\n\n## 理解字符串语法\n\n在 PHP 中处理字符串时，你可能想做的不仅仅是将它们\
  \ `echo` 到浏览器；你可能想将一个字符串的内容插入到另一个字符串中、在字符串中查找特定字符、按字母顺序对它们进行排序等。PHP 提供了超过 70 种专门为处理字符串设计的函数，以及更多接受字符串作为输入、将其作为输出或二者兼备的函数。\n\
  \n正如你在第 2 章中看到的，从零开始构建字符串很容易的：你只需要输入想要构建字符串的字符序列，并将该序列包含在单引号或双引号中。然而，更常见的情况下，你的字符串将从其他来源获取；例如，当你从数据库获取一个值时，数据通常会以\
  \ `string` 的形式返回。\n\n一旦你获取了字符串，就可以开始处理它了。接下来的两个章节将让你了解可以执行的基本操作。\n\n## 字符串操作符\n\n\
  只有两个特定的字符串操作符，列在表 5.1 中；它们旨在让字符串处理变得更容易、更容易忍受且更简洁。第一个字符串操作符是连接操作符，或称为 `dot`（点）操作符\
  \ (`.`),它在之前的章节中已经被频繁使用。字符串赋值操作符 (`.=`) 将右侧的字符串连接到左侧字符串上，使得左侧字符串持有拼接后的值。\n\n## 字符串函数\n\
  \n接下来的章节将讨论一些常用的 PHP 字符串函数及其用途。还将涵盖一些独特且有趣的字符串功能，这些功能使得在 PHP 中处理字符串变得简单。这一部分主要是字符串函数的参考，并附有演示实际功能的示例。\n\
  \n## 提示\n\n在某些情况下，我们只给出了函数原型和简短的使用示例。关于任何 PHP 函数的更多信息，请参阅在线 PHP 文档或随附的光盘。\n\n\n\n\
  从技术上讲，`print` 并不是一个函数——它是一种语言结构。这意味着你不需要对 `print` 使用括号；从 `print` 单词到下一个分号之间的任何内容都成为\
  \ `print` 的参数。该“函数”的原型是：\n\n```php\nprint(string arg)\n```\n\n当调用 `print` 结构时，字符串会被输出到浏览器中；该函数几乎总是返回\
  \ `1` 表示成功（如果没有返回，说明出了*非常严重*的错误）。`print` 只需要一个参数。在接的示例脚本中，所有四个 `print` 语句将产生相同的输出，证明了\
  \ `print` 的语法非常灵活：\n\n```php\n<?php\n\n$string = “will be printed.<br />”;\n\nprint\
  \ “This string $string”;\n\nprint “This string “ . $string;\n\nprint(“This string\
  \ $string”);\n\nprint(“This string “ . $string);\n\n?>\n```\n\n## 输出字符串\n\n`echo`\
  \ 关键字可以输出一个或多个字符串；像 `print` 一样，它也是一种语言结构。\n\n当向 `echo` 传递多个用逗号分隔的参数时，不能使用括号。它的语法看起来如下：\n\
  \n```php\necho string arg1 [, string argn...\\]\n```\n\n列表 5.2 包含了 `echo` 结构的几个示例。\n\
  \n**列表 5.2：输出字符串**\n\n```html\n<html>\n<head>\n<title>Echo Example</title>\n</head>\n\
  <body>\nSTRINGS\n\n**109**\n\n<?php\n\n$string1 = “will be printed.<br />\\\\n”;\n\
  \n$string2 = “This string “;\n\n$string3 = “This string\n\nspans multiple lines.\n\
  \n即使是换行符也会在文档源中输出！<br /> echo “Maybe, “, $string2, $string1;\n\necho(“$string2$string1”);\n\
  \necho(“This string $string1”);\n\n// echo($string2, $string1); // 注释掉，无效\n\necho($string2\
  \ . $string1); // 这种格式可以\n\necho($string3);\n\necho “echo is a very handy function.\n\
  \necho also has a shortcut!!<br />”;\n\n?>\n\n<?=$string2,$string1?>\n\n<?=”More\
  \ echo shortcut”, “ fun!”, “<br />”, “:-)”, “<br />\\\\n” ?>\n\n<?=”This string\n\
  \nspans multiple lines.\n\n即使是换行符也会在文档源中输出！<br />”?>\n\n</body>\n</html>\n```\n\n\
  在上面的示例中，可以观察到几个有趣的属性和语法细节：\n\n- 第一，`echo` 仅是一种语言结构，因此不能对多个参数使用括号。\n- 第二，`echo` 有一个输出字符串的快捷方式。该快捷方式以\
  \ `<?=` 开始，并用普通的 PHP 关闭标签 `?>` 结束。该快捷方式语法可以像 `echo` 函数的开始和结束一样使用。\n\n## 转换字符串中的\
  \ HTML 字符\n\n`htmlspecialchars()` 函数对于消除潜在的不安全数据非常有用。它将特殊的 HTML 字符转换为 HTML 实体，以便它们作为字面字符渲染，而不会被解释为普通的\
  \ HTML。这是处理稍后讨论的数据验证问题的方法（在“验证用户字符串数据”章节中），在那种情况下用户可能会向网站输入恶恶意脚本。\n\n这种方法比稍后描述的\
  \ `strip_tags()` 技术更容易处理，因为它完整地保留了用户的内容。\n\n*注意*\n\n*`htmlspecialchars()` 的缺点是某些标签可能会被允许。这是对某些但不是所有情况的解决方案，因此\
  \ `strip_tags()` 非常适合该目的。*\n\n## 小写和大写转换\n\n10\n\n将数据转换为小写或全大写。\n\n*注意*\n\n*大小写转换函数的行为取决于调用它们时的当前“语言环境”（locale）。如果你不知道什么是语言环境，请参见本章稍后的“处理非\
  \ ASCII 字符串”。*\n\n## 字符串处理\n\n`htmlspecialchars()` 的行为取决于：\n\n```php\nhtmlspecialchars(string\
