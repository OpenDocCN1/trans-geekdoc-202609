  \ 代码。此注释由两个斜杠标记，但还有几种不同的注释样式，我们将在本章稍后介绍。\n\n随后，将值 \"PHP\" 赋值给变量 `$favorite_language`。一旦值存储在变量中，我们就可以使用该变量来代表该值。在代码后部分，我们只向\
