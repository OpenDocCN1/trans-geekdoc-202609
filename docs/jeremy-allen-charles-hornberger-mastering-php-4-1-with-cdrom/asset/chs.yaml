  \ HTTP` 请求头时由 PHP 自动创建。更多细节请参见 `www.php.net/manual/en/features.http-auth.php`\n\n\
  ## 用户认证\n\n**363**\n\n“自建”认证方案的优势在于，你对用户名和密码在服务器上的存储位置和方式具有完全的控制权。\n\n在列表 12.1 中，我们所做的只是模拟任何\
  \ Web 服务器在仅依赖服务器内置的 Basic HTTP 认证支持时会采取的相同步骤。这是通过使用两个自定义定义的函数——`http_request_basic_auth()`\
  \ 和 `authorize_user()` 以及一些逻辑实现的，逻辑如下：\n\n**1.** 如果用户没有提供任何凭据，则使用 `http_request_basic_auth()`\
  \ 向其发送一个挑战。\n\n**2.** 如果用户已提供凭据，则使用 `authorize_user()` 检查其有效性。\n\n**2.1.** 如果凭据无效，则使用\
  \ `http_request_basic_auth()` 向其发送另一个挑战。\n\n**2.2.** 如果凭据有效，则允许用户进入。这几乎完全是任何 Web\
  \ 服务器用于验证请求受限页面的用户时使用的逻辑。如上所述，区别在于，我们不再局限于依赖 Web 服务器版本的 `authorize_user()`——即确保用户名/密码对应于有效的\
  \ Windows 用户，或者用户名/密码与密码数据库中的条目匹配。如果我们希望将用户名和密码存储在服务器提供的默认位置之外的地方，这将非常有用（出于显而易见的原因，通常不想为每个登录的用户创建一个\
  \ Windows 账户）。如果你想限制网站上的 PHP 脚本，可以只需将列表 12.1 中的代码放置在命名为 `http_auth.php` 的文件中，编辑\
  \ `authorize_user()` 以与你的密码数据库配合，并在受限文件的顶部包含它，并使用如下的一行代码：`include (‘path/to/http_auth.php’);`。如果用户登录失败，他们将看到在\
  \ `http_request_basic_auth()` 第三行定义的错误消息，脚本将终止。（如果用户在弹出认证对话框中点击“取消”按钮，或者他们的用户名/密码组合失败一定次数，大多数浏览器将向用户显示此输出。）如果他们成功了，程序流将继续执行包含\
  \ `http_auth.php` 的脚本。\n\n这个解决方案只有一个问题。在包含文件中使用 `exit` 语句并不不是控制程序流的最佳方法（大多数程序员会对这种想法感到不适——甚至更糟）。为了改进这一点，我们可以将列表\
  \ 12.1 中的所有顶层代码封装在一个名为 `http_authenticate()` 的函数中，使用 `include (‘http_auth.php’)`\
  \ 将其加载到任何受限脚本中，并在那里调用 `http_authenticate()`，使用函数的返回值来判断我们是否应该继续处理受限脚本。需要的另一个更改是将每个\
  \ `exit` 语句替换为 `return false`。我们代码的改进版本如列表 12.2 所示。然后，列表 12.3 显示了如何轻松地将其集成到 PHP\
  \ 脚本中；我们只需要添加三行代码即可。\n\n**364**\n\n## 第 12 章\n\n### 安全\n\n**注意**\n列表 12.1 和 12.2\
