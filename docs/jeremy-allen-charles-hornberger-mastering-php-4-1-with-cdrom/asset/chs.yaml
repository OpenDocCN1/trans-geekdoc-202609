  \                    [aim] => asmith\n                    [homepage] => http://www.jsmith.org\n\
  \                )\n            )\n        )\n)\n```\n\n### 使用 DOM 解析\n\n如果你认为从\
  \ XML 构建数据结构不需要如此枯燥——毕竟谁想整天写巨型 `switch` 语句呢——那么你有幸了。DOM 扩展提供了对文档的访问。\n\n正如我们之前在“Expat\
  \ 与 DOM”章节提到的，基于树的解析器将 XML 文档转换为内存中的树结构。DOM 对象模型 API 由 W3C 开发，建立了一个任何解析器都可以使用的标准框架。换句话说，一旦你获得了一个\
  \ DOM 对象，就可以使用了。\n\n遗憾的是，DOM 扩展目前仍处于开发阶段，在未来版本可能会发生重大变化。尽管如此，让我们开始吧。\n\n要启用 DOM\
  \ 扩展，你必须在系统中安装 `libxml` 库（在 Unix 下通常位于 `/usr/lib` 或 `/usr/local/lib`，在 Windows 下位于\
  \ `C:\\Windows\\System`）。\n\n在 Unix 下，你必须在配置 PHP 时使用 `--with-dom` 选项（可以使用 `--with-dom=/path/to/libdir`\
  \ 指定 libxml 库所在的目录）。在 Windows 下，你必须在服务器的 `php.ini` 配置文件中取消 `extension=php_domxml.dll`\
  \ 这一行。\n\n#### 从 XML 文档创建对象\n\n你需要了解的 DOM 扩展第一个函数是 `xmldoc()`。它及其伙伴 `xmldocfile()`\
  \ 将接受 XML 文档作为输入，并返回一个你可以访问文档其余部分的 DOM 对象。\n\n例如，这是使用 `xmldocfile()` 将存储在 `contact.xml`\
  \ 中的 XML 文档加载到 DOM 对象：\n\n```php\n$doc = xmldocfile (‘contact.xml’);\n```\n\n或者，我们将文件读取到内存中的字符串\
  \ `$str`，然后调用 `$doc = xmldoc ($str);` 为其创建一个 DOM 对象。注意：`xmldoc()` 函数可以做到这一点。DOM\
  \ 对象是你开始的基础。从那里开始，你可以访问文档的根节点（即元素），并继续沿着分支访问文档树的其余部分。\n\n\n\n\n\nXML 文档本身。你不需要注册处理函数，也不需要将文档的各种元素转换成字符串或数组；你只需访问节点即可。\n\
  \n## 操作文档对象\n\n一个 `Document` 对象由节点树组成；每个节点都是一个对象，具有各种可以访问的属性和可以调用的方法。然而，DOM 标准并没有使用“分支”（branches），而是使用“孩子”（children）。（同样的问题，不同的词汇。）把它想象成一棵家族树，你就会理解了：从根节点分出的每个分支都是一个潜在的父节点，它可能有孩子，也可能没有。在遍历树的过程中，某个时刻，你会到达一个分支的末端——称之为“没有孩子的孩子”——这时你就完成了对该家族部分的遍历。\n\
  \n为了说明它是如何工作的，列表 15.10 是一个快速的函数，它可以“遍历”我们从 `contact.xml` 文档构建的树，显示它找到的元素名称。\n\n\
  ### 列表 15.10：遍历文档树 (domwalker.php)\n\n```php\n<?php\n\nfunction walk_tree ($node,\
  \ $depth = 0) {\n    for ($i = 0, $indent = ''; $i < $depth; $i++)\n        $indent\
  \ .= ' ';\n    if ($node->type == XML_ELEMENT_NODE) {\n        print ($indent .\
  \ $node->tagname . \"\\n\");\n        $kids = $node->children ();\n        $nkids\
  \ = count ($kids);\n        if ($nkids > 0) {\n            $depth++;\n         \
  \   for ($i = 0; $i < $nkids; $i++)\n                walk_tree ($kids[$i], $depth);\n\
  \            $depth--;\n        }\n    }\n}\n\n$doc = xmldocfile ('contact.xml');\n\
  print (\"<pre>\\n\");\nwalk_tree ($doc->root (\nprint (\"</pre>\\n\");\n\n?>\n```\n\
  \n`walk_tree()` 函数从一个节点开始——在这种情况下，我们从文档的根元素节点开始——每当它发现拥有孩子的元素节点时，它就会递归地调用自己，逐步深入树的每个分支。\n\
  \n每次调用 `walk_tree()` 时，我们通过 `$node` 参数向它传递一个 `DomNode` 对象，并可选地传递一个 `$depth` 参数来指示我们在树中的深度。然后我们使用\
  \ `DomNode` 对象的 `type` 属性来确定它是什么种节点；如果该节点是一个元素，我们就会调用节点的 `children()` 方法来获取该元素的子节点。子节点以节点对象数组的形式返回给我们。\n\
  \n![Image 73](img/index-497_1.png)\n\n**472**\n\n## 第 15 章\n\n### XML 和 XHTML\n\n\
  脚本的输出如图 15.7 所示。\n\n**图 15.7**\n使用 DOM XML 函数打印 contact.xml 的结构\n\n操作节点非常简单；你不仅可以查看节点的内容，还可以更改节点的值、添加新节点、删除节点等。例如，为了为我们的联系人添加一个工作电话号码，我们可以编写列表\
  \ 15.11 中的脚本。\n\n### 列表 15.11：向 contact.xml 添加新节点 (addnode.php)\n\n```php\n<?php\n\
  \n$tel_node = null;\n$doc = xmldocfile ('contact.xml');\n$contact_node = $doc->root\
  \ ();\n$kids = $contact_node->children ();\nwhile ($node = array_shift ($kids))\
  \ {\n    if (($node->type == XML_ELEMENT_NODE) && ($node->tagname == ‘tel')) {\n\
  \        $tel_node = &$node;\n        break;\n    }\n}\nif ($tel_node) {\n    //\
  \ 省略代码\n}\n?>\n```\n\n\n\n\n\n```xml\n<xsl:if test=\"email != ''\">\n  Email: <xsl:value-of\
  \ select=\"email\" /></xsl:if>\n<xsl:if test=\"aim != ''\">\n  <br />AOL: <xsl:value-of\
  \ select=\"aim\" /></xsl:if>\n<xsl:if test=\"homepage != ''\">\n  <br />Home page:\
  \ <xsl:value-of select=\"homepage\" /></xsl:if>\n</xsl:template>\n</xsl:stylesheet>\n\
  ```\n\n476\n\n## 第 15 章：XML 与 XHTML\n\n我们的样式表非常简单，但它确实展示了 XSLT 语言的基本特征。\n\n如你所见，样式表本身仅仅是一个\
  \ XML 文档。它使用一些基础语法来描述如何执行转换。\n\n模板（Templates）是 XSLT 转换的关键。我们声明了五个模板来管理从源文档到结果文档的转换：一个用于主文档，另外四个用于处理转换的\
  \ XML 文档中个人、地址、电话和互联网分支中可能存在也可能不存在的各种元素。这些每个模板都通过其 `match` 属性的值来识别。\n\nXSLT 处理器读取样式表并自动使用第一个模板来转换文档。在该模板内部，我们使用了\
  \ XSLT 命令 `xsl:apply-templates` 将其他四个模板中的每一个应用到文档数据中；`xsl:apply-templates` 的 `select`\
  \ 属性值允许我们指定应该使用哪个模板。（换句话说：`xsl:apply-templates` 标签会被我们在处理由 `select` 属性标识的 `xsl:template`\
  \ 标签时产生的文本所替换。）\n\n在每个模板中，我们都使用 `xsl:value-of` 标签来实际获取源文档中的数据。此外，子分支的模板使用 `xsl:if`\
  \ 标签进行条件处理。我们测试标签的值是否非空；如果是，我们就将其值插入文档中。这允许我们正确地重新格式化文档，文档中的某些元素是可选的，因此可能不存在。\n\n\
  实际使用我们样式表的 PHP 脚本位于列表 15.13 中。\n\n**列表 15.13：使用 XSLT 将 contact.xml 转换为 HTML (xslt.php)**\n\
  \n```php\n<?php\n$processor = xslt_create();\n$result = xslt_process ($processor,\
  \ 'contact.xml', 'xsltsheet.xsl'); print ($result);\n?>\n```\n\n如你所见，我们做的只是使用 `xslt_create()`\
  \ 函数实例化一个处理器，该函数返回 PHP 在后台创建的处理器的资源标识符。然后，我们简单地将 XML 源文件和样式表的文件——以及我们想要用于实际执行转换的解析器的资源标识符——传递给\
  \ `xslt_process()` 函数。转换后的文档作为 `xslt_process()` 的结果值返回；我们将其存储在变量中并打印到浏览器上。我们转换的结果如图\
  \ 15.9 所示。\n\n虽然我们展示的示例相当简单，但 XSLT 是一种生成 XML 文档的多种替代表示形式的强大手段。例如，我们可以编写第二个样式表，将我们的联系文档转换为适用于在\
  \ PDA 或手机上显示的格式，并且每当我们收到来自运行在这些设备之一上的浏览器请求时，就使用该样式表。\n\n另一个样式表可以为视力受限的用户专门格式化 XML\
  \ 数据，而第四个样式表将将其转换为 RTF 以导入文字处理应用程序。\n\n![图像 75](img/index-502_1.png)\n\n使用 XSLT\
  \ 转换 XML\n\n477\n\n**图 15.9**\n来自 `xslt.php` 的输出\n\n### 缓存 xslt_process() 的输出\n\n\
  创建 XSLT 处理器的过程以及使用该处理器将文档转换为另一种表示形式的过程是非常消耗资源的。换句话说，你可能不想每当用户请求特定格式的文档时都调用 `xslt_create()`\
  \ 和 `xslt_process()`。一种解决方案是将我们的调用封装在一个函数中，以便在文件中缓存对 XML 文档的转换结果。\n\n*注意*\n*这种技术对于\
  \ XSLT 转换是有用的；你可以用它来缓存资源密集型操作。一个通用的缓存函数在列表 15.14 中。*\n\n**列表 15.14：用于 XSLT 转换的缓存\
  \ (xslt-cacheable.php)**\n\n```php\n<?php\nfunction xslt_cacheable ($xmlfilename,\
  \ $xslfilename) {\n  // 我们将缓存结果\n  $cache_dir = '/tmp';\n  $cache_file = $cache_dir\
  \ . md5 ($xmlfilename . $xslfilename);\n\n  // 确保文件存在\n  if (!fileexists ($xmlfilename))\n\
  \    return false;\n  if (!fileexists ($xslfilename))\n    return false;\n\n  //\
  \ 如果缓存文件存在且未过期，返回其内容\n  if (!fileexists ($cache_file)) {\n    $cache_file_mtime\
  \ = 0;\n  } else {\n    $cache_file_mtime = filetime ($cache_file);\n  }\n\n  $xml_file_mtime\
  \ = filetime ($xmlfilename);\n  $xsl_file_mtime = filetime ($xslfilename);\n\n \
  \ if ($cache_file_mtime > $xml_file_mtime && $cache_file_mtime > $xsl_file_mtime))\
  \ {\n    $fp = fopen ($cache_file, 'r');\n    if ($fp)\n      return fread ($fp);\n\
  \  }\n\n  // 否则执行转换\n  //并将结果存储在文件中\n  $p = xslt_create();\n  $doc = xslt_process\
  \ ($p, $xmlfilename, $xslfilename);\n  if (!$doc)\n    return false;\n  $fp = fopen\
  \ ($cache_file, 'w');\n  if (!fwrite ($fp, $doc))\n    print (\"Warning: Couldn’t\
  \ create cache file.\");\n  fclose ($fp);\n  return $doc;\n}\n\n// 让我们看看有多快\nprint\
  \ (\"<pre>\\n\");\n$s = explode (\" \", microtime());\n$s = (float)$s[0] + (float)$s[1];\n\
  $transformation = xslt_cacheable ('contact.xml', 'xsltsheet.xsl');\n$e = explode\
  \ (\" \", microtime());\n$e = (float)$s[0] + (float)$s[1];\n$t1 = $e - $s;\nprint\
  \ (\"第一次调用 xslt_cacheable() 用了 $t1 秒。\\n\");\n\n$s = explode (\" \", microtime());\n\
  $s = (float)$s[0] + (float)$s[1];\n$transformation = xslt_cacheable ('contact.xml',\
  \ 'xsltsheet.xsl');\n$e = explode (\" \", microtime());\n$e = (float)$s[0] + (float)$s[1];\n\
  $t2 = $e - $s;\nprint (\"第二次调用 xslt_cacheable() 用了 $t2 秒。\\n\");\nprint (\"</pre>\\\
  n\");\n?>\n```\n\n与 XML 数据交换\n\n479\n\n### 与 XML 数据交换\n\n正如我们在章节开头提到的，XML 还没有“变革一切”。有些应用程序使用它来做这个做那个，但很少有流行的应用程序以任何重大方式使用它。总的来说，XML\
  \ 的出现并没有极大地改变软件世界；计算机的工作方式与 1997 年初时一样，那时几乎没有人听说过 XML。（承认，SOAP 和微软的 .NET 倡议可能会很快改变这一点……但这还有待观察。）\n\
  \n应用程序使用 XML 做的最“有用”的事情就是与另一个应用程序交换数据。而目前，将 XML 用出去的一种常见且可见的方法是使用它来共享新闻标题，显然，这也是利用了它的网络友好性。\n\
  \n\n\n\n该策略由 Netscape 在 1999 年初发布第一版基于 XML 的富媒体网站摘要（RSS）标记语言时开创，其简单方法是在服务器上的一份文档中列出新闻故事的标题和\
  \ URL。客户端应用程序可以通过定期重新读取该文档来“关注”该站点，以检查是否有任何新条目。当发现新条目时，客户端应用程序通常会以某种方式提醒用户（通过播放提示音、在任务栏中弹出标记等），并在其本地的新闻列表副本中显示新发现的标题。\n\
  \n更好的是，客户端应用程序可以同时关注多个站点，将所有标题聚合到单个列表中，这样你就可以在一个窗口中、使用单个客户端应用程序关注 Slashdot、《卫报》、Wired\
  \ 和 Salon 等网站上的新故事了。\n\n### 使用 RSS 分发内容\n\n使用 RSS 分发内容这项工作包含两个方面：构建基于 RSS 格式的新闻馈送（news\
  \ feed），以及读取 RSS 馈送。无论哪种情况，你都需要理解 RSS 文档的结构。\n\n遗憾的是，RSS 标准一直是一个变化的目标，它有多个版本——包括最初的\
  \ 0.90 版本、随后出现且仍然流行的 0.91 版本、较新但并不一定更好的 0.92 和 0.93 版本，以及 2001 年 12 月发布的全新 1.0 版本。\n\
  \n0.91 版本使用最广泛，因此我们将查看如何读取 0.91 版本 RSS 文档。但后续代码可以很容易扩展为处理多种格式（许多 RSS 阅读器应用程序已经做到了）。\n\
