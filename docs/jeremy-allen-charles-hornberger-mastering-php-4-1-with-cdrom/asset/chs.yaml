  \n**537**\n\n### 参数\n\n* `str`: 要放置在页面上的文本\n* `x`: 页面左边缘的水平偏移\n* `y`: 页面底部的垂直偏移\n\
  \n### 作用域\n\npage, pattern, template\n\n### 创建文档\n\n**537**\n\n### 参数\n\n* `str`:\
  \ 要放置在页面上的文本\n* `x`: 页面左边缘的水平偏移\n* `y`: 页面底部的垂直偏移\n* `width`: 框的宽度\n* `height`:\
  \ 框的高度\n* `align_mode`: 对齐模式\n* `feature`: 特性模式\n\n### 作用域\n\npage, pattern, template\n\
  \n### 文本属性\n\n各种文本属性可以通过 `PDF_get_parameter()` 和 `PDF_set_parameter()` 访问。\n\n**leading**\
  \ 行间距；将行间距设置为字体大小可以得到单倍行距文本。使用 `PDF_get_value()` 和 `PDF_set_value()`。\n\n**textrise**\
  \ 文本相对于基线的向上距离（或向下偏移，负值为负值）。这对于下标和上标非常有用。\n\n**horizscaling** 文本的水平缩放。大于 1 的正值表示文本被拉伸；小于\
  \ 1 的值表示被压缩。使用 `PDF_get_value()` 和 `PDF_set_value()`。\n\n**charspacing** 字符之间的（额外的）间距。使用\
  \ `PDF_get_value()` 和 `PDF_set_value()`。\n\n**wordspacing** 单词之间的（额外的）间距。使用 `PDF_get_value()`\
  \ 和 `PDF_set_value()`。\n\n**textx, texty** 文本光标（即如果调用 `PDF_show()` 时文本出现的位置）的当前水平和垂直位置。你可以通过\
  \ `PDF_get_value()` 获取这些值，并通过 `PDF_set_text_pos()` 修改它们。\n\n**underline, overline,\
  \ strikeout** 这些参数中任何一个值为 `true`（字符串而非常量）都意味着页面上绘制的文本将应用此效果。`false` 值表示不应用效果。使用\
  \ `PDF_get_parameter()` 和 `PDF_set_parameter()`。\n\n**538**\n\n### PDF\n\n### 使用路径绘制形状\n\
  \n```\nvoid PDF_setdash(int $p, float black, float white)\n```\n\n设置绘制（也称为描边）路径时使用的当前虚线模式。默认情况下，虚线模式是简单的实黑线。你可以通过\
  \ `PDF_setdash()` 将其更改为黑色和白色交替模式。`black` 和 `white` 参数指定虚线模式中应使用的黑色和白色单位数。例如，`PDF_setdash($p,\
  \ 2.5, 0.5)` 将创建一个交替段的虚线模式：2.5 个单位的黑色，随后是 0.5 个单位的白色，随后是 2.5 个单位的黑色，等等。`black` 和\
  \ `white` 的值是当前测量单位的单位，默认值设置为 1 磅（1⁄72 英寸）。\n\n\n\n\n\n# 参数\n\n- `jointype`: 0 =\
  \ 尖角连接，1 = 圆角连接，2 = 斜角连接\n\n### 范围\n页面、图样、模板\n\n```\nvoid PDF_setlinecap(int $p,\
  \ int captype)\n```\n设置线条末端使用的形状类型。默认使用“平端端”（butt-end caps，即矩形端点，每条线的末端）。其他类型是圆形端点或投影正方形端点，后者会超出线条末端。\n\
  \n### 参数\n- `captype`: 0 = 平端端点，1 = 圆形端点，2 = 投影正方形端点\n\n### 范围\n页面、图样、模板\n\n```c\n\
  void PDF_setlinewidth(int $p, float width)\n```\n设置线宽。`width` 使用当前的测量单位计算，默认值为 1\
  \ 磅（1 英寸的 1/72）。\n\n### 参数\n- `width`: 线的宽度\n\n### 范围\n页面、图样、模板\n\n```c\nvoid PDF_moveto(int\
  \ $p, float x, float y)\n```\n创建 PDF 文档\n**539**\n将当前点移动到坐标 (`x`, `y`) 指定的位置，这些坐标是相对于页面左边缘和底部边缘的单位的偏移量。在页面范围内调用\
  \ `PDF_moveto()` 会结束页面范围，并开始路径范围。\n\n### 参数\n- `x`: 水平偏移量\n- `y`: 垂直偏移量\n\n### 范围\n\
  页面、路径、图样、模板\n\n```c\nvoid PDF_lineto(int $p, float x, float y)\n```\n在当前路径中添加一条从当前点到\
  \ (`x`, `y`) 的线，其中 `x` 和 `y` 是以距离页面左边缘和底部边缘为单位计算的偏移量。调用此函数后，当前点被设置为 (`x`, `y`)。\n\
  \n### 参数\n- `x`: 水平偏移量\n- `y`: 垂直偏移量\n\n### 范围\n路径\n\n```c\nvoid PDF_curveto(int\
  \ $p, float x1, float y1, float x2, float y2, float x3, float y3)\n```\n在当前路径中添加一条从当前点到\
  \ (`x3`, `y3`) 的曲线，其中 `x3` 和 `y3` 是以距离页面左边缘和底部边缘为单位计算的偏移量。调用此函数后，当前点被设置为 (`x3`,\
  \ `y3`)。该曲线是贝塞尔曲线，通过控制点 (`x1`, `y1`) 和 (`x2`, `y2`) 绘制。\n\n### 参数\n- `x1`, `y1`,\
  \ `x2`, `y2`: 曲线的控制点\n- `x3`, `y3`: 曲线的端点\n\n### 范围\n路径\n\n```c\nvoid PDF_circle(int\
  \ $p, float x, float y, float r)\n```\n在当前路径中添加一个中心在 (`x`, `y`)、半径为 `r` 的圆。（要绘制椭圆，必须先使用不等的\
  \ `x` 和 `y` 值对坐标系进行缩放）。在页面范围内调用 `PDF_circle()` 会结束页面范围，并开始路径范围。\n\n### 参数\n- `x`:\
  \ 圆心的水平偏移量\n- `y`: 圆心的垂直偏移量\n- `r`: 圆的半径\n\n### 范围\n页面、路径、图样、模板\n\n```c\nvoid PDF_arc(int\
  \ $p, float x, float y, float r, float alpha, float beta)\n```\n从 `alpha` 度到 `beta`\
  \ 度按逆时针方向创建一个弧（即边界由度数测量定义的圆的一部分）。弧的中心点由 (`x`, `y`) 给出。弧的半径由 `r` 给出。注意 `alpha` 和\
  \ `beta` 是从 `x` 提供的正 `x` 轴逆时针方向测量的。如果在调用此函数时已经设置了当前点，则会在路径中额外添加一条从该点到弧起始点的线。**540**\
  \ 弧的端点将成为新的当前点。在页面范围内调用 `PDF_arc()` 会结束页面范围，并开始路径范围。\n\n### 参数\n- `x`: 弧中心点的水平偏移量\n\
  - `y`: 弧中心点的垂直偏移量\n- `r`: 弧的半径\n- `alpha`: 弧的起点（角度）\n- `beta`: 弧的终点（角度）\n\n### 范围\n\
  页面、路径、图样、模板\n\n```c\nvoid PDF_arcn(int $p, float x, float y, float r, float alpha,\
  \ float beta)\n```\n`PDF_arcn()` 与 `PDF_arc()` 相同，但弧是顺时针方向绘制的。`alpha` 和 `beta` 仍然是从正\
  \ `x` 轴逆时针方向测量的值。\n\n### 参数\n- `x`: 弧的起始坐标\n- `y`: 弧的起始坐标\n- `r`: 弧的半径\n- `alpha`:\
  \ 弧的起点（角度）\n- `beta`: 弧的终点（角度）\n\n### 范围\n页面、路径、图样、模板\n\n```c\nvoid PDF_rect(int\
  \ $p, float x, float y, float width, float height)\n```\n创建一个左下角位于点 (`x`, `y`) 的矩形；如果已经设置了当前路径，则此矩形将作为“完整的子路径”添加到当前路径中（这仅意味着矩形是当前路径的一部分，尽管它可能实际上并没有与路径相交）。点\
  \ (`x`, `y`) 成为新的当前点。在页面范围内调用 `PDF_rect()` 会结束页面范围，并开始路径范围。\n\n### 参数\n- `x`: 矩形左下角的水平偏移量\n\
  - `y`: 矩形左下角的垂直偏移量\n- `width`: 矩形的宽度\n- `height`: 矩形的高度\n\n### 范围\n页面、路径、图样、模板\n\
  \n```c\nvoid PDF_closepath(int $p)\n```\n如果路径是“开启的”——也就是说，如果它描述的形状是不完整的（不像圆或矩形），调用\
  \ `PDF_closepath()` 会通过创建一条从路径端点到路径起始点的线来使路径变为“关闭”。例如，你可以通过创建一个新路径、在该路径中绘制一个 180\
  \ 度的弧，然后调用 `PDF_closepath()` 来绘制一条从路径端点（即弧的端点）回到起始点的线，从而画出一个半圆。调用此函数后，当前点变为路径的起始点。**541**\
  \ 闭合路径后，当前点是未定义的。关闭路径范围。\n\n### 参数\n- 除 `p`\n\n### 范围\n路径\n\n```c\n## 路径属性\n\n你可以使用\
  \ `currentx` 和 `currenty` 属性访问当前点：\n`current_x = PDF_get_value($p, ‘currentx');`\n\
  `current_y = PDF_get_value($p, ‘currenty');`\n\n## 填充与填充\n\n```c\nvoid PDF_stroke(int\
  \ $p)\n```\n使用当前的线条设置描边路径（线条可以通过 `PDF_setlinewidth()`、`PDF_setdash()`、`PDF_setlinecap()`\
  \ 等提前设置）。调用 `PDF_stroke()` 路径范围。\n\n### 参数\n- 除 `p`\n\n### 范围\n路径\n\n```c\nvoid\
  \ PDF_fill(int $p)\n```\n如果路径已关闭，此函数将使用当前的填充颜色填充路径（稍后通过 `PDF_setcolor()` 设置）。调用\
  \ `PDF_fill()` 路径范围。\n\n### 参数\n- 除 `p`\n\n### 范围\n路径\n\n```c\nvoid PDF_fill_stroke(int\
  \ $p)\n```\n此函数填充并描边当前路径（见前两个描述）。调用 `PDF_fill_stroke()` 路径范围。\n\n### 参数\n- 除 `p`\n\
  \n### 范围\n路径\n\n*注意*\n*便利函数 `PDF_closepath_stroke()` 和 `PDF_closepath_fill_stroke()`\
  \ 可用于关闭路径（通过在路径起点和终点之间画线）并描边或填充并描边。当然，你也可以先调用 `PDF_closepath()`，然后调用 `PDF_stroke()`\
  \ 或 `PDF_fill_stroke()` 来同样的操作（只需多一行代码）。*\n\n\n\n\n如果 `colorspace` 为“rgb”，则 `c1`、`c2`\
  \ 和 `c3` 分别定义 0 到 1 之间的红色、绿色和蓝色值；`c4` 未被使用且可以省略。要将计算 RGB 颜色值时使用的标准 0–255 范围内的数字转换为\
  \ `PDF_setcolor()` 要求的 0–1 范围，只需将每个数字除以 255 即可。因此，要将填充颜色设置为黄色，你可以写道：`PDF_setcolor($p,\
  \ ‘fill’, ‘rgb’, 255/255, 255/255, 0/255)`\n\n如果 `colorspace` 的值为“cmyk”，则 `c1`–`c4`\
  \ 定义 0 到 1 之间的青色、品红、黄色和黑色。\n\n对于“spot”和“pattern”颜色空间，请参阅 *PDFlib 参考手册*。\n\n### 参数\n\
  \n- `type`: 要设置的哪种颜色\n- `colorspace`: 要使用的颜色空间\n- `c1`, `c2`, `c3`, `c4`: 颜色值，spot\
  \ 或 pattern 颜色空间除外\n\n### 作用域\n\npage (页面), pattern (图案), template (模板)\n\n### 处理图像\n\
  \n```\nint PDF_open_image_file(int $p, string type, string filename[, string stringparam[,\
  \ int intparam])\n```\n\n从文件打开图像并返回图像句柄；该句柄可以使用 `PDF_place_image()` 将图像放在页面上。`type`\
  \ 参数用于指定要打开的图像类型；接受的值为“jpeg”、“png”、“gif 或 “tiff”。关于 `stringparam` 和 `intparam` 参数的详细信息，请参阅\
  \ *PDFlib 参考手册*。`PDF_open_image_file()` 必须与后续的 `PDF_close_image()` 调用配。\n\n### 参数\n\
  \n- `type`: 图像类型\n- `filename`: 图像文件的完整路径\n- `stringparam`: “mask”、“masked”、“ignoremask”、“invert”或“page”其中之一\n\
  - `intparam`:  `stringparam` 的值而异\n\n### 作用域\n\ndocument (文档), page (页面)\n\n###\
  \ 注意\n\n`PDF_open_image()` 函数是一个更通用的函数，允许从各种来源打开图像（而不是本地文件）。详细信息请访问 www.php.net/manual/en/function.pdf-open-image.php。\n\
  \n```\nvoid PDF_close_image(int $p, int image_handle)\n```\n\n关闭由 `PDF_open_image_file()`\
  \ 或 `PDF_open_image()` 打开的图像，并释放与图像相关的资源。\n\n### 参数\n\n- `image_handle`: 由 `PDF_open_image_file()`\
  \ 或 `PDF_open_image()` 返回的打开图像句柄\n\n### 作用域\n\ndocument (文档), page (页面)\n\n```\n\
  void PDF_place_image(int $p, int image_handle, float x, float y, float scale)\n\
  ```\n\n创建 PDF 文档\n\n**543**\n\n将 `image_handle` 指的图像放置在页面上，其左下角位于 (`x`, `y`) 坐标处。`scale`\
  \ 参数用于缩放图像；值为 1 将保留原始图像大小。负值将导致图像沿水平和垂直轴翻转。\n\n### 参数\n\n- `image_handle`: 由 `PDF_open_image_file()`\
  \ 返回的打开图像句柄\n- `x`: 左下角距离左边缘的水平偏移\n- `y`: 左下角距离底部的垂直偏移\n- `scale`: 缩放因子\n\n### 作用域\n\
  \npage (页面), pattern (图案), template (模板)\n\n### 图像属性\n\n可以使用 `get_value()` 访问打开图像的各种属性。注意，这些是只读的；你无法通过\
  \ `set_value()` 更新它们。\n\n- `imagewidth, imageheight`: 图像的宽度和高度。\n- `resx, resy`:\
  \ 图像的水平和垂直分辨率。\n\n### 变换坐标系\n\n```\nvoid PDF_save(int $p)\n```\n\n保存当前状态（以及填充颜色等其他方面），以便可以使用\
  \ `PDF_restore()` 还原到原始状态。如果你需要使用简单的技术绘制复杂的形状，而这些技术在编程上会很麻烦时，这非常有用。\n\n```\nvoid\
  \ PDF_restore(int $p)\n```\n\n恢复上次保存的状态。\n\n### 平移\n\n```\nvoid PDF_translate(int\
  \ $p, float x, float y)\n```\n\n将坐标系的原点移动到 (`x`, `y`)。当文档首次打开时，原点设置为 (0,0)。\n\n\
  ### 参数\n\n- `x`: 原点距离左边缘的水平偏移\n- `y`: 原点距离底部的垂直偏移\n\n### 缩放\n\n```\nvoid PDF_scale(int\
  \ $p, float x, float y)\n```\n\n分别通过 `x` 和 `y` 水平和垂直缩放坐标系。\n\n### 参数\n\n- `x`: 水平缩放因子\n\
  - `y`: 垂直缩放因子\n\n### 旋转\n\n```\nvoid PDF_rotate(int $p, float rotation)\n```\n\n\
  将坐标系旋转 `rotation` 度。`rotation` 描述的角度是从坐标系的正 `x` 轴逆时针测量的。\n\n### 参数\n\n- `rotation`:\
  \ 旋转坐标系的度数\n\n### 玩转坐标系\n\n如果你不习惯坐标系概念，可能会发现尝试处理变换后的坐标系有些困惑。然而，坐标系变换是 PDF 编程的关键部分；它们允许你使用简单的技术绘制复杂的形状，否则这些形状在编程上将会很麻烦。\n\
  \n理解这些变换的一种方法是想象你正在纸上画画，但无法移动铅笔到页面的任何位置。相反，你必须移动纸。`PDF_rotate()` 函数因此在铅笔下方逆时针旋转纸。\n\
  \n`PDF_transform()` 函数向北、南、移动移动纸。`PDF_scale()` 函数实际上沿其水平和垂直轴拉伸或压缩纸。\n\n注意：实际上还有三个变换函数\
  \ `PDF_skew()`、`PDF_concat()` 和 `PDF_setmatrix()`，我们在这里不讨论。它们用于高级坐标系操作；详情请参阅 *PDFlib\
  \ 参考手册*。\n\n**544**\n\n列表 17.5 中的代码生成了一个复杂的 PDF 文档，说明了 `PDF_arc()` 函数的使用。然而，代码的有趣之处不在于\
  \ `PDF_arc()` 函数，而是使用坐标系变换来实现诸如在弧上放置“箭头”以及倾斜文本方向使其随上升线条等的操作。\n\n**列表 17.5: 使用坐标系变换说明弧**\
