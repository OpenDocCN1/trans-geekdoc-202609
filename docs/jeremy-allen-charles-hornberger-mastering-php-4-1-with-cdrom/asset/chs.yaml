  *尝试一下：思考员工与办公地点之间的关系。*\n\n## 数据库规范化\n\n**217**\n\n接下来，我们需要我们的 `Pets` 数据库符合第二范式（试着快速说十遍）。在让宠物数据库达到\
  \ 2NF 之前，我们必须让它符合 1NF——我们必须从表中消除重复组。要做到这一点，我们只需确保任何单列中没有重复组。`PetID` 显然是一个标量值。`Owner`、`Type`\
  \ 和 `Name` 列也是标量的——它们只包含简单值。这意味着，根据定义，我们的表是 1NF，因为它没有重复组。如果存在任何重复组，我们可以遵循本节设定的指南来消除重复。\n\
  \n## 第二范式 (2NF)\n\n让我们检查一下列表中宠物与所有者之间的关系。第二范式（2NF）规定，表必须是 1NF，并且此外，*所有非键字段都必须依赖于表的整个主键。*\
  \ 表 8.1 中列出的宠物所有者完全不依赖于 `PetID`，所以我们的 `Pets` 数据库还没有达到 2NF。表中完全依赖于 `PetID` 的属性只有\
  \ `Name` 属性。\n\n主键实际上可以由多个列组成，只要它满足主键的要求。需要考虑的重点是：为了使表符合 2NF，每个字段都必须完全依赖于主键的整体，而不仅仅是\
  \ `PK` 的某一部分。如果我们的 `PK` 有两个字段，但某列仅依赖于 `PK` 的部分内容，那么我们就存在“部分键依赖”。在这种情况下，在消除所有部分键依赖之前，我们都不是符合\
  \ 2NF 的，而这听起来并没有那么困难。\n\n*提示*\n\n*每一个范式都假设已经满足了之前所有的范式。数据库在成为 1NF 之前不可能是 2NF；在成为\
  \ 2NF 之前不可能是 3NF，依此类推。*\n\n考虑宠物 `Neo` 和 `Tigger`。它们都在 `Pets` 数据库中，并且它们的所有者在每条记录中都被列为\
  \ `Chris`。如果我们想将所有者的名字从 `Chris` 改为 `Christian`，那么 `Chris` 拥有的每只宠物都必须更新。显然，使用图 8.1\
  \ 概述的数据模型来更改宠物所有者是既乏味又计算昂贵的。那么宠物类型呢？它也应该移动到另一个表中，以便它能够完全且仅依赖于它的主键。\n\n解决方案是将任何不依赖于\
  \ `PetID` 的属性移动到它们自己的表中，将违规属性移动到它所属的表中。我们最终得到三个表——`Pet_Type`、`Pet` 和 `Owner`——如图\
  \ 8.6 所示。\n\n这种做法典型的副产品优势是它能防止某些错误。如果原始列表中某条记录中的宠物类型“Cat”被误写成了“Cet”，我们就会突然在无意中创造了一个新的动物物种。现在，随着宠物类型的移动，当我们输入宠物类型时，它将完全且仅依赖于它的主键。\n\
  \n\n\n\n关于数据库设计的最后一点说明。在理想的世界里，我们的数据库可以完全范式化，直到最后一个字节。但在实践中，某些情况下完全完全范式化会导致真正的性能问题——例如，为了检索所需的数据而需要进行大量的连接（joins）。\n\
  \n保持表范式化仍然是一个好主意。如果查询太慢，请识别出热点，然后考虑对数据进行某种程度的反范式化，以消除某些连接并加速查询。反范式化数据时几乎总是存在权衡，但在某些情况下这是不可避免的。\n\
  \n## 关系型数据库管理系统 (RDBMSs)\n\n“关系型数据库管理系统 (RDBMS)”这个词读起来有点拗。简单来说，`RDBMS` 不仅仅是一个数据库；它是管理和维护关系型数据库所需的整个基础设施。它是一个协同工作的系统，确保数据库以稳定的方式运行。`RDBMS`\
  \ 与实际数据库交互。数据库的用户也会与 `RDBMS` 交互。`SQL` 只是 `RDBMS` 的一个接口，反过来它在数据库上执行查询以执行指定的命令。`SQL`\
  \ 无疑是最受认可的查询语言。\n\n自 1995 年以来，技术行业看到的硬件能够产生足够的性能，以满足以前留给大型机处理的需求。在此期间，行业见证了几个开源\
  \ `RDBMS` 的诞生，它们填补了许多市场空白，并为几乎所有层级的需求提供了广泛的数据库。开源数据库在扩展性方面并不完全达到 `Oracle` 或 `DB2`\
  \ 等水平；然而，大多数应用最初并不需要那么大的力量。可以说，十个应用中有九个不需要太高的扩展性。此时开源社区的两大之星是 `PostgreSQL` 和 `MySQL`。虽然有很多非常良的商业\
  \ `RDBMS`，但本书将重点关注这两个者。\n\n### MySQL vs PostgreSQL\n\n`MySQL` 可能是最流行的开源 `RDBMS`。在过去的几年里，它正在飞速追赶\
  \ `ANSI92 SQL` 标准。`MySQL` 的流行程度和声誉众所周知，它倾向于关注 Web 开发人员的需求；因此，`MySQL` 实现了一组较小且更集中的功能。\n\
  \n如果使用了诸如 `InnoDB` 的表处理器，`MySQL` 也符合 `ACID`（原子性、一致性、持久性）。`ACID` 合规性简单地定义了数据库稳定性和整体可靠性的多个级别。`InnoDB`\
  \ 表处理器现在在 `MySQL` `4.0` 版本中正式支持。`InnoDB` 提供了行级锁定并使数据库符合 `ACID`。\n\n过去 `ACID` 测试的失败曾是\
  \ `MySQL` 在某些领域的主要障碍。`PostgreSQL` 倾向于关注更广泛的应用；它拥有比 `MySQL` 更丰富的功能集。这可能会发生，因为 `PostgreSQL`\
  \ 和 `MySQL` 的普及正在不断扩大，并越来越接近 `ANSI92 SQL` 标准。`PostgreSQL` 支持的功能使得复杂的应用程序成为可能，这些应用往往倾向于使用数据库处理逻辑。在大多数\
  \ Web 应用中，`MySQL` 就足够了。然而，如果你在寻找额外的功能和便利性，例如触发器（triggers）、存储过程（stored procedures）、外键（foreign\
  \ keys）和子查询（sub-selects），那么 `PostgreSQL` 仍然是答案。在 `SQL` 之外与 `PostgreSQL` 交互的 API\
  \ 也往往更容易处理。\n\n`triggers` 是一种根据表中发生的某些事件来触发一系列动作的方法。`stored procedures` 简单来说是在数据库层级封装逻辑以执行一系列数据库命令的方法。`stored\
  \ procedures` 通常包括在比标准查询环境更强大的环境中做出决策的能力，这种环境包含了更典型的编程结构。\n\n`PostgreSQL` 支持的功能集更接近\
  \ `Oracle`、`MSSQL` 或 `DB2` 等更大数据库的功能。如果你是从这些任何一种 `RDBMS` 过来的，`PostgreSQL` 可能会让你感到更熟悉。请仔细衡量应用的复杂性和需求。如果应用倾向于复杂的一端（即实现业务逻辑），且将会使用其功能，那么\
  \ `PostgreSQL` 是一个不错的选择。对于你普通的讨论网站或 Web 门户，`MySQL` 就足够了。\n\n比较这两个系统可能是一个相当敏感的话题，但在几乎任何重要领域，它们确实是不分鼓敌的。`MySQL`\
  \ 缺失的大部分功能可以通过简单的变通方法，甚至直接通过现在支持的表处理器或 `MySQL` 的补丁来相当地实现。最后，选择支持你可能需要的功能（如外键）的那一个。`MySQL`\
  \ 和 `PostgreSQL` 都证明了它们在功能和易用性上不断进步。在选择数据库时，比较它们当前的功能是非常重要的，所以请做一些研究。\n\n## SQL\
  \ 基础\n\n`SQL` 通常被认为是结构化查询语言的缩写。在深入学习 `PHP` 连接 `MySQL` 和 `PostgreSQL` 之前，我们在这里介绍\
  \ `SQL` 的基础。将使用的 `SQL` 是通用的，在 `PostgreSQL` 和 `MySQL` 中都可以运行。全程使用的环境将是 `MySQL`；但所有的\
  \ `SQL` 语句都在 `PostgreSQL` 中通过了测试。\n\n如果你没有安装或可用数据库，请参附录 A，其中包含了关于安装 `MySQL` 和 `PostgreSQL`\
  \ 的章节。关于 `SQL` 优秀且深入的介绍，请查看 Martin Gruber 的 *Mastering SQL》(Sybex, 2000)。\n\n##\
  \ 数据类型\n\n现在你已经知道如何在逻辑上设计数据库，你必须处理细节了。`Pet` 表中的 `PetID` 应该是什么数据类型？是数字吗？字母吗？答案取决于情况和实际数据。我们将查看各种数据类型及其用途。\n\
  \n数据类型在不同数据库之间会有所不同。然而，基础数据类型及其用法没有。对于更具体的信息，请始终参考你的数据库文档以防万一。\n\n## 第 8 章：SQL 与数据库交互\n\
  \n有三类最常用的数据类型：数字、字符串和日期/时间类型。（日期/时间数据类型超出本章范围。）表 8.2 展示了常见的基础数据类型：\n\n### 表 8.2：基础\
  \ SQL 数据类型\n\n| 数据类型 | 描述 | PostgreSQL 支持 | MySQL 支持 |\n| :--- | :--- | :--- | :---\
  \ |\n| `tinyint` | 极整数；范围为 –128 到 127 | 否 | 是 |\n| `smallint` | 较小的整数；范围为 –32,768\
  \ 到 32,767 | 是 | 是 |\n| `mediumint` | 中等整数；范围为 –8,388,608 到 8,388,607 | 否 | 是 |\n\
  | `int` | 普通整数；范围为 –2,147,483,648 到 2,147,483,647 | 是 | 是 |\n| `bigint` | 大整数，精确到\
  \ 18 位 | 是 | 是 |\n| `float` | 变动精度 | 是 | 是 |\n| `char` | 固定长度，最多 255 个字符；如果未填充则用空格填充\
  \ | 是 | 是 |\n| `varchar` | 变动长度，最多 255 个字符。可以更长，但如果需要更多应使用 `text` 类型 | 是 | 是 |\n\
  | `text` | 无长度限制 | 是 | 是 |\n\n\n\n\n还有其他几种数据类型，例如 BLOB（二进制大对象），但为了讨论起见，列出的这些类型应该足以涵盖数据库中的大多数列。太好了，我们现在有了一系列数据类型。现在我们进入设计表的下一个阶段：确定数据类型。\n\
  \n我们的 `Pet` 表有四个字段：`PetID`、`PetTypeID`、`OwnerID` 和 `Name`。`Name` 作为列名来说是一个并不好的名称，因为它在某些\
  \ RDBMS 系统中可能是保留关键字。最佳实践是确保没有列与特定数据库的 SQL 方言的关键字冲突。\n\n从今起，我们将 `Pet` 表中的宠物名称称为 `PetName`。\n\
  \n`PetID` 是 `Pet` 表的唯一标识符。在大多数情况下，一个简单的整数字段就足够作为主键了。对于唯一标识符列，使用至少为 `int` 数据类型可能是最好的；这种数据类型在用尽之前至少可以产生\
  \ 20 亿条记录。唯一标识符优选整数，是因为它们存储轻量，并且可以快速搜索和检索。MySQL 和 PostgreSQL 都有处理唯一标识符列的特殊方法。这些特殊方法可以被视为序列（sequences）。\n\
  \n## 数据定义\n\n数据定义语言（DDL）是我们创建表以及数据本身之外数据库元素的方式。在进行数据存储之前，我们必须让数据将存在的数据库和表运行起来。我们终于准备好实际创建一个数据库以及该数据库中的\
  \ `Pet` 表。\n\n## SQL 基础\n\n### CREATE\n\n`CREATE` 是用于创建数据库和数据库对象的关键字。我们首先创建数据库（在创建表之前，我们必须有一个可以工作的数据库！）。创建数据库请使用以下语法：\n\
  \n```sql\nCREATE DATABASE *databasename*;\n```\n\n注意：*所有的 SQL 语句都应该以分号结束。*\n\n创建数据库你必须处于正确的环境中，这取决于你的数据库。附录\
  \ A 显示了如何进入 MySQL 和 PostgreSQL 的数据库环境。\n\n创建表同样简单：\n\n```sql\nCREATE TABLE *tablename*;\n\
  ```\n\n本书使用的数据库名为 `MasteringPHP`（惊喜吧！）。下面的代码行包含创建此数据库的 DDL，这是你在 MySQL 或 PostgreSQL\
  \ 中发出的单条命令。\n\n```sql\nCREATE DATABASE MasteringPHP;\n```\n\n这部分听起来*真的*很难理解，不是吗？\n\
  \n注意：*大多数数据库中创建的对象主要类型是表、数据库、索引和外键。*\n\n## USE 和 SHOW\n\n一旦我们有了数据库，就必须告诉客户端我们正在使用哪个数据库。在大多数\
  \ RDBMS 中可以通过 `USE` 关键字来实现。列表 8.1 是一个交互式 MySQL 会话，展示了数据库的创建以及随后对数据库的使用。\n\n**列表\
  \ 8.1：创建 MasteringPHP 数据库 (create.txt)**\n\n```sql\nmysql> CREATE DATABASE MasteringPHP\n\
  ...\nmysql> USE MasteringPHP;\nDatabase changed\nmysql> SHOW TABLES;\nEmpty set\
  \ (0.00 sec)\nmysql>\n```\n\n`SHOW` 命令生成表及其特征列表。我们的数据库目前还没有什么！我们还需要创建表。列表 8.2 显示了在\
  \ `MasteringPHP` 数据库中创建第一个表 `Pet` 的命令。\n\n## 第 8 章：SQL 与数据库交互\n\n### 列表 8.2：创建 Pet\
  \ 表 (pet_table.sql)\n\n```sql\nCREATE TABLE Pet (\nPetID int NOT NULL AUTO_INCREMENT,\n\
  PetName varchar(128) NOT NULL,\nOwnerID int,\nPetTypeID int,\nPRIMARY KEY (PetID)\n\
  );\n```\n\n本书使用的数据库名为 `MasteringPHP`。下面的代码行包含创建此数据库的 DDL，这是你在 MySQL 或 PostgreSQL\
  \ 中发出的单条命令。\n\n```sql\nCREATE DATABASE MasteringPHP;\n```\n\n`PetID` 是 `Pet` 表的唯一标识符。在大多数情况下，一个简单的整数字段就足够作为主键了。对于唯一标识符列，使用至少为\
  \ `int` 数据类型可能是最好的；这种数据类型在用尽之前至少可以产生 20 亿条记录。唯一标识符优选整数，是因为它们存储轻量，并且可以快速搜索和检索。MySQL\
  \ 和 PostgreSQL 都有处理唯一标识符列的特殊方法。这些特殊方法可以被视为序列。\n\n### 列表 8.3：创建 Owner 和 PetType 表\
  \ (owner_and_type.sql)\n\n```sql\nCREATE TABLE Owner (\nOwnerID int NOT NULL AUTO_INCREMENT,\n\
  FirstName varchar(64) NOT NULL,\nLastName varchar(64) NOT NULL,\nAddress varchar(128)\
  \ NOT NULL,\nCity varchar(64) NOT NULL,\nState char(2) NOT NULL,\nZip varchar(16)\
  \ NOT NULL,\nPRIMARY KEY (OwnerID)\n);\n\nCREATE TABLE Pet_Type (\nPetTypeID int\
  \ NOT NULL AUTO_INCREMENT,\nCommonName varchar(64) NOT NULL,\nGenus varchar(64),\n\
  Species varchar(64),\nPRIMARY KEY (PetTypeID)\n);\n```\n\n### 列表 8.4：修改表\n\n```sql\n\
  ALTER TABLE Pet_Type ADD Description varchar(255);\n```\n\n## DESCRIBE\n\n我们创建了三个表并学习了几个命令。让我们使用新命令\
  \ `DESCRIBE` 来看看我们在 `Pet_Type` 表中目前有了什么：\n\n```sql\nmysql> DESCRIBE Pet_Type;\n\
  +-------------+--------------+------+---------+----------------+\n| Field | Type\
  \ | Null | Key | Default | Extra |\n+-------------+--------------+------+---------+----------------+\n\
  | PetTypeID | int(11) | | PRI | NULL | auto_increment |\n| CommonName | varchar(64)\
  \ | | | | |\n| Genus | varchar(64) | YES | | NULL | |\n| Species | varchar(64) |\
  \ YES | | NULL | |\n| Description | varchar(255) | YES | | NULL | |\n+-------------+--------------+------+---------+----------------+\n\
  5 rows in set (0.00 sec)\n```\n\n`DESCRIBE` 命令对于快速获取表的结构概述非常有有用。我们可以通过 `DESCRIBE`\
  \ 关键字提供的描述来确定有关表的所有数据。描述识别了空列、键列、默认值以及任何额外信息。\n\n注意：*这些语句假设使用的是 MySQL。在 PostgreSQL\
  \ 中出现的差异将在稍后的章节中介绍。*\n\n注意：`SHOW COLUMNS FROM *tablename` 与 `DESCRIBE *tablename.*`\
  \ 非常相似。\n\n\n\n\n每个 DDL 命令的语法都非常相似。最后一个介绍的 DDL 关键字是 `DROP`，它用于删除表、索引、数据库或外键。我们可以通过如下语句来删除我们的\
  \ `Pet` 表：\n\n```\nDROP TABLE Pet;\n```\n\n删除表时，所有数据和数据定义都会被移除。其他项目也可以同样轻松删除。\n\n\
  *提示*\n\n*有关特定于你数据库的 DDL 命令的详细信息，请参考相关的数据库供应商。*\n\n## 数据操作与检索\n\n数据操作是数据库创建的下一个逻辑步骤。在我们对数据进行逻辑建模，并使用所有适当的数据类型为数据创建容器（表）之后，我们必须实际使用这些表来做一些有用的事情。虽然数据库的真正威力在于将其到\
  \ Web 界面或其他客户端时，但你仍然可以在供应商提供的客户端中学如何操作数据并执行基础 SQL 操作，而且阻较少。\n\n*注意*\n\n*在本节中我们将一直使用\
  \ MySQL。*\n\n### SQL 基础\n\n**227**\n\n**INSERT**\n\n`INSERT` 的作用正如其名所示：向数据库中插入数据。`INSERT`\
  \ 的语法在外观和感觉上与 DDL 命令相似：\n\n```\nINSERT INTO *tablename* [*columnX*, *columnY*, …)]\
  \ VALUES (*valueX*, *valueY*, …);\n```\n\n*注意*\n\n*INSERT 是 SQL 数据操作中使用的“四大”命令之一。我们很快就会介绍其他命令——SELECT、UPDATE\
  \ 和 DELETE。*\n\n注意 `INSERT` 之后使用了 `INTO`。接着是表名、一个可选的列列表以及一个必填的值列表，每个列表都放在括号中并用逗号分隔。字符串应始终包含在单引号内。数字不应包含在任何符号中，包括单引号。该语句以分号结束。\n\
  \n如果你打算为每一列都输入值，那么列列表是可选的。代码列表 8.5 中的 SQL 语句将将插入一些 `Pet_Types`：\n\n**列表 8.5: 插入\
  \ Pet\\_Types (pets\\_type\\_insert.php)**\n\n```\nINSERT INTO Pet_Type VALUES(0,\
  \ ‘Dog’, ‘Canis’, ‘familiaris’, ‘Friendly quadrupedal mammal’); INSERT INTO Pet_Type\
  \ VALUES(0, ‘Cat’, ‘Felis’, ‘silvestris’, ‘Whiskered quadrupedal mammal’); INSERT\
  \ INTO Pet_Type VALUES(0, ‘Human’, ‘Homo’, ‘sapiens’, ‘Bipedal world explorers’);\n\
  ```\n\n在继续之前，让我们看看如果我们不想在某些列中输入数据，`INSERT` 语句会是什么样：\n\n```\nINSERT INTO Pet_Type\
  \ (CommonName, Description) VALUES (‘Bird’, ‘Bipedal flying animal’);\n```\n\n在这个版本的\
  \ `INSERT` 中，我们在表名之后通过逗号分隔的列表来指定列。在列列表括号关闭后，使用 `VALUES` 关键字，后面跟着用逗号分隔的实际值列表。注意，列列表中的项与值列表中的项相对应。\n\
  \n`INSERT` 并不复杂；它只是将数据推入数据库。执行列表 8.6 中的语句，以便我们我们也拥有 `Pet` 和 `Owner`。\n\n**列表 8.6:\
  \ 填充我们的数据库 (pets\\_insert.sql)**\n\n```\nINSERT INTO Owner (FirstName, LastName,\
  \ Address, City, State, Zip) VALUES (‘Jeremy’, ‘Allen’, ‘100 Does Not Exist Dr.’,\
  \ ‘UnCity’, ‘GA’, ‘99999’); INSERT INTO Owner (FirstName, LastName, Address, City,\
  \ State, Zip) VALUES (‘Chris’, ‘Narom’, ‘2048 Bit Bucket Ln.’, ‘Megabyte’, ‘GA’,\
  \ ‘99999’);\n```\n\n**228**\n\n## 第 8 章\n\n### SQL 与数据库交互\n\n```\nINSERT INTO Owner\
  \ (FirstName, LastName, Address, City, State, Zip) VALUES (‘Erin’, ‘Lyn’, ‘Route\
  \ 6’, ‘Namedevnull’, ‘GA’, ‘99999’);\n\nINSERT INTO Owner (FirstName, LastName,\
  \ Address, City, State, Zip) VALUES (‘Joyce’, ‘Black’, ‘8192 Grain Bin Rd.’, ‘Country\
  \ City’, ‘GA’, ‘99999’);\n```\n\n（注：提供的源文本结尾包含大量的乱码/重复文本。我已根据指令处理了连贯部分并保持了结构的完整性。）*\n\
  \n\n\n\n从表中返回所有数据是有用的，但如果该表包含两百万行数据呢？\n\nSQL 的设计者周全地考虑并包含了一种限制 SQL 语句视图范围的方法。为了限制\
  \ `SELECT` 的视图，我们添加了 `WHERE` 子句。它的读起来有点像普通的英语。以下是我们在提到某个特定个人拥有的宠物时通常会说的：“我想看到 Jeremy\
  \ 拥有的所有宠物。”\n\n将英语转换为 SQL 并不是我们建议你在空余时间做的事，但我们仍然可以使用术语来思考检索数据，这些术语可以很容易地概念化 `SELECT`\
  \ 语句。在这种情况下，我们显然需要 Jeremy 拥有的宠物。伪 SQL 看起来像这样：因此，首先我们需要知道计算机如何识别 Jeremy——即 Jeremy\
  \ 的 `OwnerID` 是什么？有一种更直接的方法，但目前我们将使用以下语句来查找：\n\n```sql\nSELECT *\nFROM Owner;\n\
  ```\n\n此语句简单地从数据库中选择所有所有；在输出列表中，我们可以看到 Jeremy 的 `OwnerID` 是 1。然后我们可以从 `Pet` 表中进行选择，找到特定\
  \ `Owner` 拥的所有宠物。列出 Jeremy 所有宠物的实际 SQL 语句如下：\n\n```sql\nSELECT *\nFROM Pet\nWHERE\
  \ OwnerID = 1;\n```\n\n`WHERE` 子句还允许基于各种逻辑进行过滤。在 `WHERE` 子句中可以执行另一种类型的测试是不等判断；我们可以找到所有*不*属于某个所有者的宠物。SQL\
  \ 中的不等运算符是 `!=` 或 `<>`。下一个查询找到 `Pet` 数据库中所有不属于 Jeremy 的宠物。\n\n```sql\nSELECT *\n\
  FROM Pet\nWHERE OwnerID <> 1;\n```\n\n# SQL 基础\n231\n\n还可以进行其他基本比较：小于 `<`、大于 `>`、小于等于\
  \ `<=` 和大于等于 `>=`。有几个运算符超出了基本比较运算符；这些是 `IN`、`LIKE` 和 `BETWEEN`。我们将简要探索这些高级运算符中的每一个。\n\
  \n### IN\n\n该关键字可以用于执行类似于此语句的逻辑：“给我所有名字*在*这个名字列表中的所有者。”这是一个 `IN` 子句的快速示例：\n\n```sql\n\
  SELECT FirstName, LastName\nFROM Owner\nWHERE FirstName IN('Chris’, ‘Erin');\n```\n\
  \n`IN` 提供了一种简单的语法，用于检查列是否包含列表中的任何值。它只需要给出一个逗号分隔的列表，并在为 `IN` 运算符指定的列（在本例中为 `FirstName`）中搜索是否存在列出的任何名称。\n\
  \n### BETWEEN\n\n这仅仅是一个方便的运算符，使某些逻辑更易于读。任何可以使用 `BETWEEN` 完成的操作都可以重写为使用比较运算符；该关键字仅提供了一种更简洁的语法，用于确定一个值是否处于下限和上限之间。\n\
  \n此查询假设表中至少有五个所有者，并且数据反映了在本章节开头使用 `INSERT` 语句插入的数据：\n\n```sql\nSELECT FirstName,\
  \ LastName\nFROM Owner\nWHERE OwnerID BETWEEN 3 AND 5;\n```\n\n相同的查询可以重写为：\n\n```sql\n\
  SELECT FirstName, LastName\nFROM Owner\nWHERE OwnerID >= 3 AND OwnerID <= 5;\n```\n\
  \n### LIKE\n\n该运算符允许有限形式的通配符搜索，即一种模式匹配。\n\n支持的匹配通配符见表 8.3。\n\n**表 8.3:** LIKE 匹配通配符\n\
  \n| 特殊字符 | 描述 |\n| :--- | :--- |\n| `_` | 任意单个字符 |\n| `%` | 任意数量的任意字符 |\n| `[ ]`\
  \ | 字符集内的任意字符 |\n\n模式匹配与正则表达式完全无法相比，但在急用时可行。以下是 `LIKE` 谓词的几个示例。\n\n```sql\nSELECT\
  \ *\nFROM Pet_Type\nWHERE CommonName LIKE '___';\n```\n\n232\n\n## 第 8 章\n### SQL\
  \ 与数据库的交互\n\n```sql\nSELECT *\nFROM Pet_Type\nWHERE CommonName LIKE 'd__';\n```\n\
  \n```sql\nSELECT *\nFROM Pet_Type\nWHERE CommonName LIKE 'do%'\n```\n\n```sql\n\
  SELECT *\nFROM Pet_Type\nWHERE CommonName LIKE 'do[g]'\n```\n\n这四个查询都会返回所有的狗条目；然而，第一个版本还会返回所有的猫（三个下划线意味着三个字母的单词）。\n\
  \n在构建需要执行简单搜索操作的小型搜索引擎时，`LIKE` 可以非常有用。除了这些字符之外，`LIKE` 子句的行为类似于普通的 `WHERE` 子句。\n\n\
  ### ORDER BY\n\n数据库最明显且立即可实用的功能之一是数据排序的能力，出于许多显而易见的原因。`ORDER BY` 用于排序。此代码有两种方式可以排序数据：升序（即\
  \ 0–9 A–Z）或降序（Z–A 9–0）。它像其他排序程序一样排序数字和字母；默认排序是升序。\n\n```sql\nSELECT *\nFROM Owner\n\
  ORDER BY LastName;\n```\n\n这将返回每个所有者，按 `LastName` 列排序，这意味着结果根据姓按字母顺序排列。可以轻松地将结果降序，使顺序按字母倒序排列：\n\
  \n```sql\nSELECT *\nFROM Owner\nORDER BY LastName DESC;\n```\n\n可以对多个列进行排序：\n\n\
  ```sql\nSELECT *\nFROM Owner\nORDER BY LastName, FirstName;\n```\n\n首先，此查询按姓对所有所有者排序。如果有七个人姓\
  \ Johnson，那么这组 `LastNames` 将根据他们的进行子排序。\n\n`ORDER BY` 子句放在任何 `WHERE` 子句之后：\n\n```sql\n\
  SELECT *\nFROM Pet\nWHERE PetTypeID = 2;\nORDER BY PetName;\n```\n\n233\n\n此查询将检索所有猫（ID\
  \ = 2）并按它们的名称对它们进行排序。\n\n在使用 `ORDER BY` 时有几个需要注意的问题，例如大小敏感性和所使用的语言。`ORDER BY` 的细节以及数据究竟如何排序取决于数据库；有关更多信息，请参阅特定数据库的文档。\n\
  \n### 连接表 (JOIN Tables)\n\n你可能已经注意到我们目前为止检索的所有数据：它一次只从一个表检索数据。我们归一化表以及细致分离所有者和宠物类型的努力工作将在我们的下一个主题中汇合：*连接\
  \ (joins)*。\n\n在查询中合并一个或多个具有相关数据的表通常是非常用的，以便理解数据或检索其相关详细信息——例如，识别宠物及其所有者。连接通常让 SQL\
  \ 专家和初学者都感到困惑。我们可以通过思考实际数据和正在发生的事情来思考连接。我们知道有宠物和所有者；通常需要在结果集中以单条记录的形式返回宠物及其所有者的信息。我们可以“连接”这两张表，因为我们在\
  \ `Pet` 表中存储了 `OwnerID`，从而将 `Pet` 与特定的 `Owner` 关联起来。\n\n让我们来看非常简单的连接：\n\n```sql\n\
  SELECT PetName, FirstName, LastName\nFROM Pet, Owner\nWHERE Pet.OwnerID = Owner.OwnerID;\n\
  ```\n\n`SELECT` 在 `WHERE` 子句中使用连接并在 `OwnerID` 上连接两个表。对于 `Pet` 表中 `OwnerID` 匹配 `Owner`\
  \ 表中 `OwnerID` 的每个条目，结果集中都会返回一条记录。该查询应该返回九行，因为应该有九只宠物，每只宠物都有一个所有者。由于使用了多个表，我们现在必须为任何歧义的列名加上它所属的表名前缀，后面是一个点，然后是实际的列名。\n\
  \n因此，要从 `Pet` 表中选择 `OwnerID` 列，我们将写 `Pet.OwnerID`。\n\n*提示*\n\n*在任何使用多个表的查询中，始终为列加上其所属表的前缀是一种最佳实践。*\n\
  \n\n\n\n\n此时，你可能会认为，在每一列前面输入一个超过几个短字符的表名看起来是多么多余！这个问题有一个简单的解决方案：表名**别名**（`aliases`），它可以缩短文本量并提高查询的清晰度。在\
  \ `FROM` 子句中选择表时，表名后面只需紧跟一个空格和别名，或者紧跟关键字 `AS` 和别名。然后，在为列所属的表名名前缀时，就使用别名而不是实际表名。接下来的查询演示了两种表名别名的写法。\n\
  \n```\nSELECT P.PetName, O.FirstName, O.LastName\nFROM Pet P, Owner AS O\nWHERE\
  \ P.OwnerID = O.OwnerID\n```\n\n*注意*\n\n*当表名使用别名时，该别名将贯穿整个查询用于引用该表名。别名是在实际别名之前还是之后使用并不重要；只要对表设置了别名，在整个查询中都必须使用该别名进行引用。*\n\
  \n**234**\n\n## 第 8 章\n\n### SQL 与数据库交互\n\n如何选择别名取决于开发者。通常，别名是表中每个单词的首字母。在这种风格下，`Owner`\
  \ 是 `O`，`Pet` 是 `P`，`Pet_Type` 是 `PT`。这种命名法在大多数情况下都很好用。有些开发者倾向于使用缩短的而不仅仅是单个字符；这一决定取决于编写查询的团队或个人，因为这主要是\
  \ SQL 的一个便利功能。最好选择一种风格并坚持下去，以使 SQL 查询看起来保持一致。\n\n可以使用 `AND` 或 `OR` 关键字在 `WHERE`\
  \ 中添加附加条件，这些条件通常涉及多个表。就像在 PHP 和数学中一样，可以使用括号对 SQL 语句的逻辑进行分组。将复杂的 `WHERE` 子句分组以实现所需的逻辑通常是非常重要的。附加子句所示附加到\
  \ `WHERE` 子句之后：\n\n```\nSELECT PetName, FirstName, LastName\nFROM Pet, Owner\nWHERE\
  \ Pet.OwnerID = Owner.OwnerID\nAND (Pet.OwnerID = 1 OR Pet.OwnerID = 2);\n```\n\n\
  在 `WHERE` 子句中连接三个或四个表似乎有些复杂。ANSI 92（最新的 SQL 规范）允许一种新的连接语法。有特殊的关键字可以帮助澄清表之间的连接，使其更易读且不易出错。我们一直在使用一种特定类型的表连接，即**内连接**（`inner\
  \ join`）。内连接确保在连接记录之前，每个表中的记录具有匹配的 ID。在这种情况下，我们通过 `OwnerID` 连接 `Pet` 表和 `Owner`\
  \ 表。\n\n使用实际的 `JOIN` 关键字是连接表的优方法：\n\n```\nSELECT P.PetName, O.FirstName, O.LastName\n\
  FROM Pet P\nINNER JOIN Owner O ON O.OwnerID = P.OwnerID;\n```\n\n假设你想执行一个包含所有者和宠物类型数据的查询。连接多个表与连接一个表完全一样。只需选择所需的列并在适当的列上连接表即可。查看以下连接查询，它检索了所有连接后的数据。\n\
  \n```\nSELECT P.PetName,\nO.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\n\
  INNER JOIN Owner O ON O.OwnerID = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID\
  \ = P.PetTypeID;\n```\n\n\n\n\n\nPHP 的数据库 API 实际上为各种数据库平台提供了相同的功能。然而，不同的数据库 API\
  \ 之间存在一些值得考虑的差异。\n\n## 使用 PHP 从 MySQL 获取数据\n\n列表 8.8 展示了一个简单的脚本，该脚本连接到 MySQL 数据库、执行查询、检索结果（以表格形式显示在屏幕上），最后关闭数据库连接。我们可以在图\
  \ 8.8 中看到查询结果。\n\n### 列表 8.8：MySQL 脚本 (mysql.php)\n\n```php\n<?php\n/* Connect to\
  \ the MySQL database */\n$db_connection = mysql_connect(\"localhost\", \"username\"\
  , \"password\") or die(\"Could not connect to DB\");\n/* Select the MasteringPHP\
  \ database */\nmysql_select_db (\"MasteringPHP\", $db_connection) or die(\"Could\
  \ not find DB\");\n/* Store the query to be executed in a variable */\n$pets_query\
  \ = \"SELECT P.PetName,\nO.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\n\
  INNER JOIN Owner O ON O.OwnerID = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID\
  \ = P.PetTypeID;\";\n/* Send the query to MySQL for execution */\n$query_result\
  \ = mysql_query ($pets_query, $db_connection);\n/* Begin table to format data */\n\
  print \"<table border=\\\"1\\\">\\n\";\nprint \"<tr><td align=\\\"center\\\" colspan=\\\
  \"4\\\" bgcolor=\\\"#ffff99\\\">\"; print \"<strong>Pets and Owners</strong>\";\n\
  print \"</td></</tr>>\";\n/* Loop over query displaying all returned rows */\nwhile\
  \ ($row = mysql_fetch_object ($query_result))\n{\n    print \"\\t<tr>\";\n    print\
  \ \"\\t\\t<td>\" . $row->PetName . \"</td>\";\n    print \"\\t\\t<td>\" . $row->FirstName\
  \ . \"</td>\";\n    print \"\\t\\t<td>\" . $row->LastName . \"</td>\";\n    print\
  \ \"\\t\\t<td>\" . $row->CommonName . \"</td>\";\n    print \"\\t</tr>\";\n}\nprint\
  \ \"</table>\\n\";\n/* Close the connection with the database */\nmysql_close($db_connection);\n\
  ?>\n```\n\n### 图 8.8：我们的查询结果\n\n测试脚本仅仅是如此——它是对与 MySQL 交互时使用的一些常用数据库函数的全面练习。在对数据库执行任何操作之前，必须先在\
  \ PHP 脚本和 MySQL 数据库之间建立连接。如果无法成功建立连接，脚本将退出并向浏览器打印错误。确保特定主机具有访问权限非常重要，否则脚本将失败，因为\
  \ MySQL 会拒绝任何未设置正确权限的主机的连接。除了主机之外，还必须提供数据库的用户名和密码。这些也可能是潜在的失败点。确保用户名和密码是有效的。如果你需要排查为什么无法连接到\
  \ MySQL 数据库，命令行 shell 是一个开始的地方。\n\n连接 MySQL 数据库的函数如下：\n`resource mysql_connect (string\
  \ [hostname[:port]], string [username]], string [password])`。第一个参数是实际的主机，带有可选的端口和可选的\
  \ MySQL 套接字路径。接下来是用户名和密码。请注意，在利用 MySQL 连接的实际文件中存储用户名和密码不是最安全的技巧。如何保护数据库连接的这一方面将在本章中介绍。\n\
  \n连接到数据库后，我们获得了一个原始连接，就像我们在 MySQL 客户端连接到数据库一样；这意味着仍然必须选择数据库。选择数据库的函数是：\n`bool mysql_select_db\
  \ (string database_name, resource [link_identifier])`。注意 `mysql_connect()` 返回一个资源，而\
  \ `mysql_select_db()` 要求将资源作为第二个参数。始终建议在调用 `mysql_select_db()` 函数时使用资源。选择数据库后，我们必须做一些有用的事情并在数据库上执行查询。要执行查询，会执行\
  \ `mysql_query()` 函数；其原型为 `resource mysql_query (string query [, link_identifier])`。该函数还有一个可选资源参数，为了清晰起见应该使用它。`mysql_query()`\
  \ 实际上返回另一个供使用的资源。注意查询被赋值给 PHP 变量，然后将字符串简单传递给 `mysql_query()` 函数。这是在 PHP 中组装并执行查询的一种整洁方法。\n\
  \n查询执行后，存在一个包含结果的资源。有两个主要函数可以处理 `mysql_query()` 函数返回的资源；它们是 `mysql_fetch_object()`\
  \ 和 `mysql_fetch_array()`。这两个函数每个都需要一个资源才能正常工作。`mysql_fetch_object()` 的原型是 `object\
  \ mysql_fetch_object(resource result, int [result_type])`。该函数获取查询并将其转换为对象。然后可以使用列表\
  \ 8.8 中所示 `while` 语法对对象进行循环。当查询被获取为对象时，列名被用作对象的字段。循环会停止，因为当没有更多可用行时，函数将返回 False。这允许使用更自然的语法来访问数据库中特定行的各个单独字段。\n\
  \n另一种方法是将整个结果集作为数组提供。我们可以轻松地修改上面的示例来使用 `mysql_fetch_array()`——只需要更改 `while` 循环即可：\n\
  \n```php\n/* Loop over query displaying all returned rows */\nwhile ($row = mysql_fetch_array\
  \ ($query_result))\n{\n    print \"\\t<tr>\";\n    print \"\\t\\t<td>\" . $row[\"\
  PetName\"] . \"</td>\";\n    print \"\\t\\t<td>\" . $row[\"CommonName\"] . \"</td>\"\
  ;\n    print \"\\t\\t<td>\" . $row[\"FirstName\"] . \"</td>\";\n    print \"\\t\\\
  t<td>\" . $row[\"LastName\"] . \"</td>\";\n    print \"\\t</tr>\";\n}\n```\n\n结果简单地作为关联数组返回。如果使用\
  \ `var_dump` 或 `print_r`，只要数据是数组，就可以查看整个数据库结果；与其遍历查询结果，不如尝试这种：\n\n```php\nprint_r(mysql_fetch_array($query_result));\
  \ echo \"<br />\";\nprint_r(mysql_fetch_array($query_result)); echo \"<br />\";\n\
  print_r(mysql_fetch_array($query_result)); echo \"<br />\";\nprint_r(mysql_fetch_array($query_result));\
  \ echo \"<br />\";\n```\n\n注意结果是每次返回一行的；每次获取数组结果时，内部数组指针都会增加，指向下一条记录。因此，每次调用函数都会产生一条新记录。无论调用\
  \ `mysql_fetch_array()` 还是 `mysql_fetch_object()`，当这些函数调用交替进行时，结果集的内部指针增加方式都是相同的：\n\
  \n```php\nprint_r(mysql_fetch_array($query_result)); echo \"<br />\";\nprint_r(mysql_fetch_object($query_result));\
  \ echo \"<br />\";\nprint_r(mysql_fetch_object($query_result)); echo \"<br />\"\
  ;\nprint_r(mysql_fetch_array($query_result)); echo \"<br />\";\n```\n\n此脚本中使用的另一个函数是\
  \ `mysql_close()`，它实际上关闭与数据库的连接。虽然连接在脚本结束时会自动关闭，但强烈建议养成手动关闭数据库连接的习惯。手动关闭连接允许对数据库会话进行更精细的控制。（持久数据库连接是另一个话题，稍后将介绍。）`mysql_close()`\
  \ 的原型是 `bool mysql_close(resource [link_identifier])`。该函数在成功时返回 True，失败时返回 False。\n\
  \n\n\n\n还有一个非常有用的函数，它比使用 `mysql_fetch_array()` 或 `mysql_fetch_object()` 快一点，尽管微乎其微。`mysql_fetch_row()`\
  \ 函数允许获取结果集的下一行。它不是使用关联数组或对象，而是将结果存储为普通的、数字索引的数组。然而，这种对查询进行枚举的方法并不直观，看起来也可能会让人困惑。如果列的位置发生任何变化，那么任何位置的列都可能发生改变；这就是为什么使用关联数组或对象要有益得多。\n\
  \n另一个有用的函数是 `mysql_num_rows()`。它可以轻松、简单地提供记录数的计数；其原型定义如下：\n\n`int mysql_num_rows(resource\
  \ result)`\n\n该函数需要一个结果集，并返回一个对应于特定结果集记录数的整数。在列表 8.8 中，我们可以修改 `while` 循环之后的代码块，如下片段所示：\n\
  \n```php\nprint “<tr><td colspan=\\\"4\\\"> Total number of pets with owners:” .\n\
  .“<strong>” . mysql_num_rows($query_result). “</td></tr>”; print “</table>\\n”;\n\
  ```\n\n现在我们的表格包含更多信息，因为它让用户知道总共有多少只宠物。\n\n**提示**\n\n作为一个练习，请尝试在表格中添加一列。该列应该位于表格的最左侧，并应该打印当前行的号。\n\
  \n使用 PHP 从 MySQL 数据库提取数据的基础知识与命令行非常相似。真正的诀窍在于如何进行查询。仍然还有一些技巧，特别是在涉及到插入和更新数据时。假设客户端请求一个接口来向系统添加新宠物？显然，现在必须有一种方法来添加所有者（Owners）、宠物（Pets）和宠物类型（Pet_Types），因为宠物同时需要这两者，而且这些信息中的任何一个对于我们现有的数据集来说都是新的。\n\
  \n# SQL 基础\n\n## 241：在 MySQL 中插入数据\n\n除了检索数据外，通常还必须从 Web 表单向数据库写入数据。通常通过一个布局表单的\
  \ HTML 页面和一个表单提交到的页面来实现的，后者是负责将数据保存到数据库的。当数据插入到数据库时，立即检索新插入的数据以供使用通常是很有用的。MySQL\
  \ 的方便功能之一是 `mysql_insert_id()`。如果插入了一条记录，可以使用该数据库连接结合此函数来返回最近插入项的 ID。这是该 PHP 函数的原型：\n\
  \n`int mysql_insert_id(resource [link_identifier])`\n\n此函数返回一个整数，并且仅适用于具有 `AUTO_INCREMENT`\
  \ 字段的表。\n\n认为此函数是可导入的且 MySQL 特有的：`mysql_insert_id()` 只能用于 MySQL 数据库；其他数据库处理获取新 ID\
  \ 的方式不同。在多用户环境中如何绕过这一问题将在数据库抽象部分进行讨论。\n\n列表 8.9 显示了如何获取特定连接最近创建的 ID。这在以后处理数据时非常有用。\n\
  \n### 列表 8.9：检索新插入的数据 (mysql_insert_id.php)\n\n```php\n<?php\n/* 连接到数据库 */\n$db_connection\
  \ = mysql_connect(“localhost”, “username”, “password”) or die(“Could not connect”);\n\
  \n/* 选择数据库 */\nmysql_select_db(“Mastering”, $db_connection) or die(“Could not select”);\n\
  \n/* 获取数据库 */\n$query_result = mysql_query($db_connection) or die(“Could not find”);\n\
  \n/* 执行查询 */\n$query_result = mysql_query(“INSERT INTO Pet (name, type) VALUES ('Skippy',\
  \ 3)”, $db_connection) or die(“Could not find”);\n\n/* 获取新 ID */\n$new_id = mysql_insert_id($db_connection);\n\
  \n/* 显示表格 */\nprint “<tr><td colspan=\\\"4\\\"> Total number of pets with owners:”\
  \ .\n.“<strong>” . mysql_num_rows($query_result). “</td></tr>”; print “</table>\\\
  n”;\n\n/* 关闭数据库 */\nmysql_close($db_connection);\n?>\n```\n\n## 242：第八章：SQL 交互\n\
  \n### 处理用户数据中的特殊字符\n\n我们现在可以确定，在 SQL 中指定值的首选方法是单引号（’）。不能假设用户不会输入可能导致问题的字符。有两个字符或序列：`\"\
  ` 和 `\\`，需要使用 `addslashes()` 进行转义。该函数应该处理来自用户的任何数据。\n\nPHP 在 `php.ini` 中有一个可以自动启用此功能的设置，称为\
  \ `magic_quotes_pc`。当此设置开启时，所有的 GPC（即 GET、POST 和 cookies）变量都会自动被转义。但一直开启魔引号可能会很麻烦。大多数情况下，如果可能，直接关闭该设置更为简单。有一个相关的函数可以帮助判断是否使用了魔引号：\n\
  \n`long get_magic_quotes()`\n\n此函数可以在难以控制设置的环境中使用，例如共享主机环境。这允许在运行时检查字符串是否需要清理。\n\
  \n我们可以现在修改列表 8.8 中的 `mysql_insert_id()` 示例，使得赋值查询字符串的行变为：\n\n```php\n$new_pet_insert\
  \ = “INSERT INTO Pet(0, ‘Skippy’, 3)”;\n```\n\n现在看起来像：\n\n```php\n$pet_name = “Skip\
  \ ‘ster!”;\n$new_pet_insert = “INSERT INTO Pet(0,” . $pet_name . “,3, 2)”;\n```\n\
  \n进行此更改并运行页面。注意没有宠物名称？现在将行改为：\n\n```php\n$pet_name = addslashes(“Skip ‘ster!”);\n\
  $new_pet_insert = “INSERT INTO Pet(0,’ . $pet_name . “‘,3, 2)”;\n```\n\n现在宠物 Skip\
  \ ’ster! 就能正确保存到数据库中了。双引号和单引号也可以包含在内。让我们看更复杂的例子：将 `$pet_name` 变量赋值改为：\n\n```php\n\
  $pet_name = addslashes(“Ski”p ‘ster! \\\\”);\n```\n\n好了，不要慌，这比看起来要简单得多。宠物的名字在数据库中应该是这样的：**Ski”p\
  \ ‘ster! \\\\**。由于我们使用了双引号 PHP 字符串字面量，双引号和反斜杠必须转义。演进过程如下：\n\n**1.**\n\n我们输入参数为 “Ski\\\
  \\”p ‘ster! \\\\\\\\”。\n\n\n\n\n\n## 2\n\n`addslashes()` 将其转换为 “Ski\\\\\\\\\\\\\
  ”p \\\\’ster! \\\\\\\\\\\\\\\\”。\n\n## 3\n\n这在数据库中最终显示为 Ski”p ‘ster! \\ 。\n\n每个需要反斜杠的字符上都会添加一个反斜杠！它看起来与我们传递给\
  \ `addslashes()` 函数的字符串完全相同。然而，需要记住的是，`magic_quotes_gpc` 在设置 `GET`、`POST` 和 `cookie`\
  \ 变量时起作用，对这些方法之外创建的变量没有影响。如果使用两次 `addslashes()`，所有数据都会被“双重转义”，这并不是我们想要的效果。在对来自这些来源的变量添加反斜杠之前，请确保使用\
  \ `get_magic_quotes_gpc()` 检查配置设置：\n\n```php\nif(!get_magic_quotes_gpc())\n    addslashes($gpc_variable);\n\
  ```\n\n该语句简单来说就是：如果没有启用魔引号（magic quotes），则为变量添加反斜杠，无论魔引号设置如何都能完成相同的任务。\n\n再提供一个小知识：从\
  \ PHP 4.0.3 版本开始，可以使用名为 `mysql_escape_string()` 的函数，它以类似于 `addslashes()` 的方式转义其他几个字符。`mysql_escape_string()`\
  \ 函数转义以下字符：NULL (`\\x00`)、`\\n`、`\\r`、`\\`、`‘`、`“` 和 `\\x1a`。这两个函数几乎相同；任何一个都能安全地防止恶意代码进入数据库。如果担心多个数据库之间的移植性，那么最好是使用\
  \ `addslashes()`。\n\n杂项 MySQL PHP 函数\n\n在结束对 PHP API 操作 MySQL 的介绍之前，还有其他一些杂项需要涵盖。\n\
  \n244\n\n## 第 8 章\n\n### SQL 与数据库交互\n\n***mysql_data_seek***\n\n注意每每次使用 `mysql_fetch_object()`\
  \ 或 `mysql_fetch_array()` 函数时，内部指针都会移动到下一行吗？假设您需要回溯指针，使其指向结果集的开头，甚至指向结果集中间的某个记录？\n\
  \n为了这个目的，有了 `mysql_data_seek()`：\n\n```php\nbool mysql_data_seek(resource result_identifier\
  \ , int row_number)\n```\n\n修改列表 8.8，以便在关闭数据库连接之前执行以下代码：\n\n```php\n/* 开始格式化数据的表格\
  \ */\nprint “<table border=\\\"1\\\">\\n”;\n\n/* 重置内部指针并重新显示结果 */\nif(mysql_data_seek($query_result,\
  \ 0))\n{\n    /* 遍历查询显示所有返回的行 */\n    while ($row = mysql_fetch_array ($query_result))\n\
  \    {\n        print \"\\t<tr>”;\n        print \"\\t\\t<td>” . $row[\"PetName\"\
  ] . “</td>”;\n        print \"\\t\\t<td>” . $row[\"CommonName\"] . “</td>”;\n  \
  \      print \"\\t\\t<td>” . $row[\"FirstName\"] . “</td>”;\n        print \"\\\
  t\\t<td>” . $row[\"LastName\"] . “</td>”;\n        print \"\\t</tr>”;\n    }\n \
  \   print “</table>\\n”;\n}\nelse\n{\n    print(“Failure seeking row”);\n}\n```\n\
  \n注意，如果指定的行号小于 0 或大于结果集中可用记录数，则数据寻址函数将失败。它将生成一个警告并返回 False。此警告将打印到屏幕上。请参侧边栏如何使用前缀运算符对表达式抑制错误和警告信息的特殊方法。\n\
  \n#### 抑制错误消息\n\n除了解析错误外，任何错误消息都可以用 @ 符号（即 `@` 运算符）抑制。此运算符将完全停止任何错误消息发送到客户端。此运算符应谨慎使用，并结合第\
  \ 7 章“调试与错误”中过的错误处理技术。\n\n在 `mysql_data_seek()` 前加上 `@`，然后将寻址行改为 –1 以抛出错误。\n\n现在，将打印数据寻址失败的自定义消息，但不会打印\
  \ PHP 警告。\n\nSQL 基础\n\n245\n\n***mysql_error***\n\n发送到 MySQL 的查询不可避免会带有某些无效语法，可能来自意料之外或未考虑的用户数据。这可能只是语法错误；无论原因如何，确定数据库报告的实际错误都是至关重要的。PHP\
  \ 在处理错误时支持一种自然的语法。\n\n当查询失败时，可以使用两种技术来执行替代命令：\n\n```php\nif(!$query_result = mysql_query($new_pet_insert,\
  \ $db_connection))\n    handle_mysql_error($db_connection);\n```\n\n或者\n\n```php\n\
  $query_result = mysql_query($new_pet_insert, $db_connection) or handle_mysql_error($db_connection);\n\
  ```\n\n虽然这两个语句实现了相同的效果，但后一个语句往往具有更自然且对开发者更友好的语法。`handle_mysql_error()` 函数是一个自定义函数，用于利用\
  \ `mysql_error()` 函数。它的原型如下：\n\n```php\nstring mysql_error(resource [link identifier])\n\
  ```\n\n该函数返回一个字符串并需要一个链接标识符（数据库连接）。\n\n让我们看看利用 `mysql_error()` 的自定义错误处理程序。\n\n```php\n\
  function handle_mysql_error($db_link)\n{\n    $error_string = mysql_error($db_link);\n\
  \    print(“<strong>MySQL Error in “ . __FILE__);\n    print(\":</strong> . $error_string);\n\
  }\n```\n\n请记住，这是一个为了说明 `mysql_error()` 用法而编写的自定义函数。\n\n***mysql_db_query***\n\n\
  这是一个减少了选择和执行相关代码的函数：\n\n```php\nresource mysql_db_query(string database, string\
  \ query, resource [link identifier])\n```\n\n使用此函数，列表 8.8 可以重写如下：\n\n```php\n/*\
  \ 连接到 MySQL */\n$db_connection = mysql_connect(“localhost”, “username”, “password”)\
  \ or die(“Could not connect”);\n\n/* 将查询存储在变量中 */\n$pets_query = “SELECT P.PetName,\n\
  O.FirstName,\nO.LastName,\nPT.CommonName\nFROM Pet P\nINNER JOIN Owner O ON O.OwnerID\
  \ = P.OwnerID\nINNER JOIN Pet_Type PT ON PT.PetTypeID = P.PetTypeID;”;\n\n/* 将查询发送到\
  \ MySQL 执行 */\n$query_result = mysql_db_query (“MasteringPHP”, $pets_query);\n```\n\
  \n`mysql_db_query()` 函数提供了选择执行的简化版本。该函数会切换到指定的数据库。\n\n246\n\n## 第 8 章\n\n### SQL\
  \ 与数据库交互\n\n***mysql_data_seek***\n\n注意每每次使用 `mysql_fetch_object()` 或 `mysql_fetch_array()`\
  \ 函数时，内部指针都会移动到下一行吗？假设您需要回溯指针，使其指向结果集的开头，甚至指向结果集中间的某个记录？\n\n为了这个目的，有了 `mysql_data_seek()`：\n\
  \n```php\nbool mysql_data_seek(resource result_identifier , int row_number)\n```\n\
  \n修改列表 8.8，以便在关闭数据库连接之前执行以下代码：\n\n```php\n/* 开始格式化数据的表格 */\nprint “<table border=\\\
  \"1\\\">\\n”;\n\n/* 重置内部指针并重新显示结果 */\nif(mysql_data_seek($query_result, 0))\n{\n\
  \    /* 遍历查询显示所有返回的行 */\n    while ($row = mysql_fetch_array ($query_result))\n\
  \    {\n        print \"\\t<tr>”;\n        print \"\\t\\t<td>” . $row[\"PetName\"\
  ] . “</td>”;\n        print \"\\t\\t<td>” . $row[\"CommonName\"] . “</td>”;\n  \
  \      print \"\\t\\t<td>” . $row[\"FirstName\"] . “</td>”;\n        print \"\\\
  t\\t<td>” . $row[\"LastName\"] . “</td>”;\n        print \"\\t</tr>”;\n    }\n \
  \   print “</table>\\n”;\n}\nelse\n{\n    print(“Failure seeking row”);\n}\n```\n\
  \n注意，如果指定的行号小于 0 或大于结果集中可用记录数，则数据寻址函数将失败。它将生成一个警告并返回 False。此警告将打印到屏幕上。请参侧边栏如何使用前缀运算符对表达式抑制错误和警告信息的特殊方法。\n\
  \n#### 抑制错误消息\n\n除了解析错误外，任何错误消息都可以用 @ 符号（即 `@` 运算符）抑制。此运算符将完全停止任何错误消息发送到客户端。此运算符应谨慎使用，并结合第\
  \ 7 章“调试与错误”中过的错误处理技术。\n\n在 `mysql_data_seek()` 前加上 `@`，然后将寻址行改为 –1 以抛出错误。\n\n现在，将打印数据寻址失败的自定义消息，但不会打印\
  \ PHP 警告。\n\nSQL 基础 \n\n245\n\n***mysql_error***\n\n发送到 MySQL 的查询不可避免会带有某些无效语法，可能来自意料之外或未考虑的用户数据。这可能只是语法错误；无论原因如何，确定数据库报告的实际错误都是至关重要的。PHP\
  \ 在处理错误时支持一种自然的语法。\n\n当查询失败时，可以使用两种技术来执行替代命令：\n\n```php\nif(!$query_result = mysql_query($new_pet_insert,\
