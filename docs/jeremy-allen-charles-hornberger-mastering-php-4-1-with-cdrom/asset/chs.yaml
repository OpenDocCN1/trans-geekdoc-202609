  \n![图像 77](img/index-511.png)\n\n486\n\n## 第 15 章\n\n### XML 与 XHTML\n图 15.11 我们的\
  \ RSS 读器的输出交换 WDDX\n\nWeb 分布数据交换 (WDDX) 标准描述了一种简单的、独立于应用程序的利用 XML 编码数据。WDDX 的意义在于允许在线应用程序发送常见的基本数据结构。WDDX\
  \ 的点在于允许在线应用程序发送常见的基本数据结构，包括字符串、数组，并与 WDDX 格式的应用程序共享。也许要理解 WDDX 最简单的方法是查看 15.16\
  \ 中的一些简单示例。首先，我们将编写一个脚本（15.16），利用产品 ID 的数组以及关于该产品是否有库存的“是/否”指示器生成 WDDX 包。\n\n列表\
  \ 15.16：简单的 WDDX 包生成器 (wddx-write.php)\n```php\n<?php\n\n$inventory = array();\n\
  \n$inventory[] = array (‘id’ => ‘1’, ‘instock’ => ‘yes’);\n\n$inventory[] = array\
  \ (‘id’ => ‘2’, ‘instock’ => ‘no’);\n\n$inventory[] = array (‘id’ => ‘3’, ‘instock’\
  \ => ‘yes’);\n\n$id = wddx_packet_start (‘inventory’);\n\nwddx_add_vars ($id, ‘inventory’);\n\
  \n$packet = wddx_packet_end ($id);\n\nprint $packet;\n\n?>\n```\n\n与 XML 数据交换\n\
  487\n\n如所示，我们使用 `wddx_packet_start()` 函数创建一个包，将 `$inventory` 数组添加到包中，最后通过调用 `wddx_packet_end()`\
  \ 生成最终版本的包。\n\n*注意*\n*我们可以使用 `wddx_serialize()` 函数用更少的行完成相同的操作；请查看 PHP 文档 www.php.net/manual/en/ref.wddx.php\
  \ 获取详情。*\n\n上述代码将生成以下 XML：\n```xml\n<wddxPacket version=’1.0’><header><comment>inventory</comment></header><data>\n\
  <struct><var name=’inventory’><array length=’3’><struct><var name='id’><string>1</string></var><var\
  \ name='instock’><string>yes</string></var></struct>\n<struct><var name='id’><string>2</string></var><var\
  \ name='instock’><string>no</string></var></struct><struct><var name='id’><string>3</string></var><var\
  \ name='instock’><string>yes</string></var></struct></array></var>\n</struct></data>\n\
  \n当然编写一个知道如何读取 WDDX 数据的脚本。列表 15.17 中的代码显示了一个将读取上述 WDDX 包并将其转换为简单 HTML 的脚本。（一如既往，如果你使用此脚本，请确保调整路径以匹配你的设置。）\n\
  \n列表 15.17：WDDX 读者 (wddx-read.php)\n```php\n<?php\n\n$packet = ‘’;\n\n$fp = fopen\
  \ (‘http://localhost/wddx-write.php’, ‘r’);\n\nwhile (!feof ($fp))\n$packet .= fread\
  \ ($fp, 2048);\n\nfclose ($fp);\n\n$data = wddx_deserialize ($packet);\n\n$inventory\
  \ = $data['inventory'];\n\nfor ($i = 0; $i < count ($inventory); $i++) {\n\nif ($inventory[$i]['instock']\
  \ == ‘yes’)\n$phrase = ‘ is in stock’;\n\nelse\n$phrase = ‘ is NOT in stock’;\n\n\
  print ‘Product ‘ . $inventory[$i]['id'] . $phrase . ‘<br />’;\n\n}\n\n?>\n```\n\n\
  XHTML\n\n\n\n\n\n在整个 20 世纪 90 代，HTML 变得越来越复杂。尽管人们曾做出严肃且有意义的尝试对其进行标准化，并阻止作者采用自定义的解决方案来编写和处理\
  \ HTML 文档，但到 1999 年，情况已经变得非常混乱。每个浏览器都支持一组不同的标签以及其各有一套文档脚本模型，作者们被迫编写大量的格式化代码，以确保他们的文档在不同平台上的外观和行为一致——或者至少相似。\n\
  \nW3C 的分析师和语言设计人员通过 `XHTML 1.0` 应对了这一挑战，这是将 HTML 重新定义为符合 XML 标准语言的首次尝试。将 `XML` 作为新版本\
  \ HTML 的基础提供了显而易见的优势：\n\n◆\n\n用于构建和操作 `XML` 文档的日益丰富的资源库可以立即用于 Web 文档。\n\n◆\n\n用\
  \ `XHTML` 编写的 Web 文档在定义上是良好（well-formed）的（因为它们必须遵循所有 `XML` 文档的各种结构规则，例如禁止标签重叠）。\n\
  \n◆\n\n得益于它们（更）统一的结构，将更容易在 Web 的主流文档处理应用程序——浏览器中集成对标准 API（如文档对象模型）的支持。这反过来将有助于减少跨浏览器兼容性问题。\n\
  \n如果说 `XHTML 1.0` 是标准化的第一步，那么 `XHTML 1.1` 就是最后的飞跃。\n\n`XHTML 1.1` 对 `XHTML 1.0`\
  \ 中仍然允许（尽管已弃用）的不符合 XML 标准的行为完全没有任何容忍度。虽然 `XHTML 1.0` 试图通过让 Web 文档作者保留旧的（糟糕的）习惯来缓解过渡，但\
  \ `XHTML 1.1` 不再那么宽容了。\n\n如果说 `XHTML 1.0` 对文档作者说“请用这种方法”，那么 `XHTML 1.1` 说的是“要么改进，要么滚蛋”。\n\
  \n除了强制执行 `XML` 良好格式的结构规则外，`XHTML 1.1` 还要求作者*仅*可以使用样式表来更改文档的呈现属性——颜色、字体、文本对齐方式等。`XHTML`\
  \ 的核心点是定义文档的*结构*；标签用于界定 `XHTML` 文档的结构组件（这是一个段落，这是一个章节，这是一个引用等）。\n\n正如 W3C 的 `XHTML\
  \ 1.1` 规范（`www.w3.org/TR/xhtml11/`）所示：*XHTML 1.1 代表了对 HTML 4 和 XHTML 1.0 的背离。最显著的是**除了已弃用的功能。总的来说，策略是定义一种结构功能丰富的标记语言，但其呈现依赖于样式表。*\n\
  \n## 切换到 XHTML\n\n将你的 Web 应用从 `HTML` 迁移到 `XHTML` 可能是件苦恼，也可能是个大麻烦；这完全取决于你使用了多少过时的、旧式的\
  \ `HTML`。如果你的 `PHP` 脚本充斥着未闭合的标签、未引号的属性值、字体标签等，请做好无聊的准备：你将花费大量时间将 `HTML` 重写为 `XHTML`（或者你需要获取如\
  \ `HTML Tidy` 之类的工具）。相反，如果你是一个严谨的 `HTML` 设计师，并且总是关闭 `p` 标签，并遵守 W3C 长期以来的建议（即 `HTML`\
  \ 文档应包含尽可能少的非结构标记），那么这应该是轻而易举的。\n\n注意，如果你遵循 `XHTML 1.0` 的 `Strict` 版本，那么你的文档可能符合\
  \ `XHTML 1.1` 标准。`XHTML 1.1` 和 `XHTML 1.0` 支持的标签集之间的主要区别在于：\n\n◆\n\n你应该始终使用 `xml:lang`\
  \ 属性而不是 `lang` 属性。\n\n◆\n\n`name` 属性不再用于 `a` 和 `map` 元素；\n\n◆\n\n否则，你的主要工作是确保 `XHTML`\
  \ 是良好格式的，并使用表 15.3 列出的元素。\n\n### 表 15.3: XHTML 中弃用的元素\n\n| 标签 | 描述 | 替换 |\n| ---\
  \ | --- | --- |\n| `applet` | 插入 applet | object |\n| `basefont` | 设置字体大小 | CSS\
  \ |\n| `center` | 居中 | CSS |\n| `dir` | 目录 | CSS |\n| `font` | 设置字体 | CSS |\n| `isindex`\
  \ | 插入用户输入 | CSS |\n| `menu` | 创建菜单列表 | CSS |\n| `s`, `strike` | 删除线 | CSS |\n|\
  \ `u` | 下划线 | CSS |\n\n`XHTML` 文档还必须以标准的 `XML` 声明开头：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\" ?>\n```\n\n## 第 15 章：XML 与 XHTML\n\n切换到 `XHTML` 的好处是你可以开始使用\
  \ `XML` 工具来处理你的文档。例如，你可以对任何 `XHTML` 文档使用本章开头“XML 结构”部分描述的 `Microsoft XML parser`。\n\
  \n同样，你可以使用 W3C 网站上的 `XHTML Validator` 来验证你的文档。\n\n然而，对于使用用户输入、数据库等动态生成 `XHTML` 文档的\
  \ `PHP` 脚本，运行每一个 URL 并确保所有 `XHTML` 正确是不切行的。\n\n为了动态检查脚本的输出是否有效，你可以将列表 15.18 中的代码添加到网站每个\
  \ URL 使用的包含文件中。\n\n### 列表 15.18: 使用 Expat 动态检查良好格式 (chkself.php)\n\n```php\n<?php\n\
  function xml_check_form ($url) {\n    $p = xml_parser_create();\n    $fp = fopen\
  \ ($url, 'r');\n    $self = '';\n    while (!feof ($fp))\n        $self .= fread\
  \ ($fp, 2048);\n    fclose ($fp);\n    if (!xml_parse ($p, $self, true)) {\n   \
  \     $r['ok'] = false;\n        $r['url'] = $url;\n        $r['errcode'] = xml_get_error_code\
  \ ($p);\n        $r['errmsg'] = xml_error_string ($r['errcode']]);\n        $r['errline']\
  \ = xml_get_current_line_number ($p);\n    }\n    else\n        $r['ok'] = true;\n\
  \    xml_parser_free ($p);\n    return $r;\n}\n\nif ($_GET['xhtml_validate'] ==\
  \ 1) {\n    $test_url = str_replace ('xhtml_validate=1', '',$PHP_SELF);\n    $r\
  \ = xml_check_form ($test_url);\n    if ($r['ok'] == false) {\n        die (“Error:\
  \ %s on line %d\\n”, $r['errmsg'], $r['errline']);\n    }\n}\n?>\n```\n\n\n\n\n\
  为了与更复杂的 PHP 应用程序配合，该系统显然需要进行修改，但基本技术仍然适用。（例如，一个使用大量 cookie 来确定其行为的 PHP 并不一定能与基础爬虫一起工作；请参阅第\
  \ 14 章“Web 应用开发”，获取某些可以模拟“实际用户”的测试软件提示。）该系统更大的弱点是，我们正在使用非验证型解析器（`Expat`）来检查我们的页面。为了检查你的\
  \ PHP 是否真的有效，你需要使用一个验证型解析器。遗憾的是，这说起来容易做起来难，因为 PHP 并不附带验证型解析器，也不包含对它的支持。（实际上，作为 `DOM\
  \ XML` 扩展基础的 `libxml` 库确实允许程序员根据 DTD 验证文档……）为了验证你的 XHTML 文档，你始终可以使用 W3C 提供的 `http://validator.w3.org/`\
  \ 验证服务（见图 15.12）。要验证一个文档，只需将其 URL 输入表单中并点击“Validate This Page”（验证此页面）按钮。该验证器支持从\
  \ HTML 2 到 XHTML 1.1 的所有内容。\n\n**图 15.12**\nW3C 的验证服务\n\n**492**\n\n## 第 15 章\n\n\
  ### XML 与 XHTML\n\n如果你的文档和/或 Web 服务器没有说明清楚，你可能还需要指明文档所使用的字符集和文档类型。当你点击“Validate\
  \ This Page”时，W3C 的验证器应用程序将从你的服务器获取文档，对其进行处理，并打印出它发现的任何错误列表。\n\n如果你想要验证的文档不在公共访问的\
  \ Web 服务器上，你也可以直接从你的计算机向服务器上传文件。\n\n若要在本地验证你的文档，你要么需要在 PHP 中通过“黑客手段（hack）”引入对验证型\
  \ XML 解析器的支持，要么使用诸如随 `libxml` 软件自带的 `xmllint` 程序。例如，如果我们尝试验证下面的 XHTML 文档（注意缺少了闭合的\
  \ `</p>` 标签）：\n\n```xml\n<?xml version=”1.0” encoding=”UTF-8”?>\n\n<!DOCTYPE html\
  \ PUBLIC “-//W3C//DTD XHTML 1.0 Strict//EN”\n“http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd”>\n\
  <html xmlns=”http://www.w3.org/1999/xhtml” xml:lang=”en” lang=”en”>\n<head>\n\n\
  <title>Hello, World!</title>\n</head>\n<body>\n<p>Hello, World!\n</body>\n</html>\n\
  ```\n\n`xmllint` 将抛出以下抱怨：\n\n```bash\n$ xmllint --valid doc.xhtml\ndoc.xhtml:11:\
  \ error: Opening and ending tag mismatch: p and body\n</body>\n^\ndoc.xhtml:12:\
  \ error: Opening and ending tag mismatch: body and html\n</html>\n^\ndoc.xhtml:13:\
  \ error: Premature end of data in tag <html xmlns=”http://www.w3.org\n```\n\n###\
  \ XHTML 1.1 中的模块化\n\n尽管 XHTML 1.0 和 XHTML 1.1 之间的主要区别在于新版本是可扩展和可定制的，但这种新功能实际上并非归功于\
  \ XML。发生的情况是 W3C 的分析师、程序员和语言专家将 XHTML 的 DTD 拆分成了独立的模块，每个模块都处理 Web 标记宇宙的一个特定部分。例如，一个模块包含了创建表单所需的所有元素和属性；另一个处理表格；还有一个处理文本。总共，有\
  \ 20 个这样的新模块（如果你算上已弃用但尚未过的 Style Attribute 模块的话）。表 15.4 显示了 XHTML 1.1 中的模块。\n\n\
  **XHTML**\n**493**\n\n**表 15.4：XHTML 1.1 中的模块**\n\n| 模块名称 | 定义的元素/属性 |\n| :--- |\
  \ :--- |\n| 结构模块 (Structure Module) | body, head, html, title |\n| 文本模块 (Text Module)\
  \ | abbr, acronym, address, blockquote, br, cite, code, dfn, div, em, h1, h2, h3,\
  \ h4, h5, h6, kbd, p, pre, q, samp, span, strong, var |\n| 超文本模块 (Hypertext Module)\
  \ | a |\n| 列表模块 (List Module) | dl, dt, dd, ol, ul, li |\n| 对象模块 (Object Module)\
  \ | object, param |\n| 呈现模块 (Presentation Module) | b, big, hr, i, small, sub, sup,\
  \ tt |\n| 编辑模块 (Edit Module) | del, ins |\n| 双向文本模块 (Bidirectional Text Module)\
  \ | bdo |\n| 表单模块 (Forms Module) | button, fieldset, form, input, label, legend,\
  \ select, optgroup, option, textarea |\n| 表格模块 (Table Module) | caption, col, colgroup,\
  \ table, tbody, td, tfoot, th, thead, tr |\n| 图像模块 (Image Module) | img |\n| 客户端图像映射模块\
  \ (Client-Side Image Map Module) | area, map |\n| 服务端图像映射模块 (Server-Side Image Map\
  \ Module) | ismap |\n| 内生事件模块 (Intrinsic Events Module) | onclick 等事件属性 |\n| 元信息模块\
  \ (Metainformation Module) | meta |\n| 脚本模块 (Scripting Module) | noscript |\n| 样式表模块\
  \ (Stylesheet Module) | style |\n| 样式属性模块（Style Attribute Module）（已弃用） | style |\n\
  | 链接模块 (Link Module) | link |\n| 基础模块 (Base Module) | base |\n| Ruby 模块 (Ruby Module)\
  \ | ruby, rb, rt, rp |\n\n### XHTML 1.1 中的模块化\n\n尽管 XHTML 1.0 和 XHTML 1.1 之间的主要区别在于新版本是可扩展和可定制的，但这种新功能实际上并非归功于\
  \ XML。发生的情况是 W3C 的分析师、程序员和语言专家将 XHTML 的 DTD 拆分成了独立的模块，每个模块都处理 Web 标记宇宙的一个特定部分。例如，一个模块包含了创建表单所需的所有元素和属性；另一个处理表格；还有一个处理文本。总共，有\
  \ 20 个这样的新模块（如果你算上已弃用但尚未过期的 Style Attribute 模块的话）。表 15.4 显示了 XHTML 1.1 中的模块。\n\n\
  对于文档作者和程序员来说，这种重写意味着这些模块可以组合以创建定制的 XHTML。这允许作者创建定义限制元素集的 DTD。特定的浏览器可以组合自己的 DTD，规定：“我们只理解以下（小部分）标签，不要给我发送大量的样式表、嵌入对象和\
  \ iframe。”然后，一旦他们发布了 DTD，Web 程序员（如你）就可以使用这些 DTD 构建符合目标平台的 XHTML 文档。此外，如果你需要构建包含独立元素（例如\
  \ `fancyobject`）的 XHTML 文档，你可以编写一个新的 DTD 来扩展 XHTML DTD，为你的文档创建一个新的 `DOCTYPE` 声明指向你的自定义\
  \ DTD，并开始在文档中插入 `<fancyobject>` 标签。\n\n虽然构建新 DTD 的过程超本书的范围，但如果你想了解更多关于模块化 XHTML，我们可以为你指明正确的方向。\n\
  \n首先，你可能想阅读 W3C 关于编写模块化 XHTML 的入门指南，标题恰好为“Building HTML Modules”：`www.w3.org/TR/xhtml-building/`。另一篇值得阅读的概述文档是“XHTML\
  \ Modularization Overview”：`www.w3.org/MarkUp/modularization`。这里有关于使用 DTD 和 XML\
  \ Schema 语言 XHTML 模块的快速介绍：`www.xml.com/lpt/a/2001/05/02/xhtmlm12n.html`。\n\n最后，所有\
  \ XHTML 模块化文档的鼻祖是 W3C 网站上的原始提案，“Modularization of XHTML”：`http://www.w3.org/TR/xhtml-modularization/`。\n\
