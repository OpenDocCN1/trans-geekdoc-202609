  \  </table>\n</form>\n</html>\n\n# 高级表单处理\n\n正如你可能从之前的之前的代码中猜到的那样，创建高效、易用的表单有很多工作是相当重复的，并且非常适合程序化的解决方案。许多程序员最终会编写自己的函数，例如之前“报告错误”章节中使用的\
  \ `flag_error()` 和 `has_error()`，以便在编写 PHP 脚本时节省时间和击键次数。\n\n随书附带的光盘中包含了我们编写的一个脚本\
  \ `Forms.php`，它定义了一个用于处理表单的原型库。它使用了面向对象的方法，类似于其他语言中的标准 GUI 库（例如 Java 的 Swing 包或用于创建用户界面的\
  \ GTK 库）。虽然它不是完整的生产级代码，但它目前的形式是可以使用的。通过使用这个库或类似的 `HTML::Form` 和 `HTML::QuickForm`\
  \ 库等工具——你可以提高工作效率并减少表单处理代码中的错误。\n\n## 表单与交互\n\n构成此库的类如表 9.5 所示`HTML_Form_Common`\
  \ 是基类。\n\n**表 9.5：Forms.php 库的类**\n* `Checkbox`（复选框）\n* `SelectMenu`（选择菜单）\n* `CheckboxSet`（复选框组）\n\
  * `PasswordField`（密码字段）\n* `RadioButton`（单选按钮）\n* `SubmitButton`（提交按钮）\n* `RadioButtonSet`（单选按钮组）\n\
  * `TextField`（文本字段）\n\n通过名称很容易判断每个类的作用。`TextField` 类用于创建“文本”类型的表单控件，`Checkbox` 类用于创建“复选框”类型的表单控件，依此类推。`HTML_Form_Common`\
  \ 是一个基类（如果你熟悉这些的话，它类似于 Java 接口），它定义了所有表单控件通用的属性和方法；每个表单控件——`TextField`、`PasswordField`\
  \ 等都继承自 `HTML_Form_Common`。\n\n`HTML_Form` 类用于创建一个表示表单的对象，并包含了处理错误的基础程序。我们库中的一个创新是引入了“组”（sets）的概念。我们定义了两个对象\
  \ `CheckboxSet` 和 `RadioButtonSet`，这对于其他 GUI 构建库的用户来说会很熟悉。这些对象允许我们将按钮和复选框分组，并对整个组执行操作。\n\
  \n对于生成表单的类似面向对象的方法，你可能还想查看 QuickForm。`HTML_Form` 对象是放置所有表单控件的容器，它还提供了自动化错误检查的功能。\n\
  \n### 伪代码示例\n\n在伪代码中，你的 PHP 脚本可能如下：\n\n```\n定义表单\n如果 (获取数据) {\n    检查错误\n    如果\
  \ (没有找到错误） {\n        处理数据\n        退出\n    }\n}\n如果 (找到错误) {\n    打印错误信息\n    打印表单\n\
  \    退出\n```\n\n遵循这种设计模式意味着大多数表单都可以生成，并且表单的用户输入可以以标准化的方式处理。表单处理库还适用于基于模板的网页设计；使用模板允许你将\
  \ HTML 与 PHP 分离，从而在决定更改网站外观时以最小的精力进行设计。此外，使用标准化的简单方法生成表单和控件意味着表单可以从外部数据源动态生成，无论是来自数据库字段还是\
  \ XML 文档元素；表单将“适应”它们包含的数据。\n\n最后，使用标准方法意味着你的表单看起来和运行都很相似，这有助于用户导航你的应用程序，有助于程序员在出现问题时进行调试。为了开始，查看一个用于用户调查的最小化表单处理脚本可能是很有用的。列表\
  \ 9.9 中的示例让人们告诉姓名（使用文本字段）、他们是否喜欢冰淇淋（使用单选按钮组），以及他们是否喜欢蓝色、黄色和洋红色（使用复选框组）。我们还会要求他们勾选单个复选框（使用不属于组的独立复选框），而不告诉他们原因。（这很像你在公司网站注册单底部看到的那些——那些本应该读作“我们可以从我们的合作伙伴那里向您发送大量垃圾邮件吗？”）我们将调查结果简单地回显给浏览器。\n\
