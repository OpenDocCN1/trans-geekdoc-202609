  \n**程序**\n\n**光盘位置**\n\nApache\n`sources\\apache\\1.3`\n\nPHP\n`sources\\php.targz`\n\
  \n只需将文件复制到 `src` 目录中。\n\n## 在 Apache 模块和 CGI 之间选择\n\nPHP 有两种基本用法：作为 Apache 模块或作为通用网关接口（CGI）解释器。每种都有优缺点。\n\
  \nApache 在与 PHP 相同的地址空间内作为模块运行。这意味着如果 PHP 崩溃，Apache 也会随之崩溃。然而，CGI 版本的 PHP 有大量的开销。性能较差，并且与模块进行通信（此处原文逻辑断层）。\n\
  \n图 A.1 展示了 CGI 版本的 PHP 不位于 Apache 相同的地址空间，而当 PHP 作为模块使用时，Apache 和 PHP 位于相同的地址空间内。\n\
  \n**图 A.1**\n\n**带有 CGI 的 Apache**\n\n**带有 PHP 模块的 Apache**\n\nPHP 使用的不同内存模型\n\n\
  PHP Apache Apache Apache Apache 和 PHP![Image 116](img/index-653)\n\n**628**\n\n\
  **附录 A**\n\n安装 PHP 快速上手\n\n\n\n\nAdobe 可便式文档格式 (PDF) 文件格式用于多种用途，其中之一是文档的精确打印。在屏幕上查看\
  \ PDF 文档的效果与打印效果完全相同；这使得 PDF 成为格式精美的报告和文档的极佳媒介，并且可以在两种方式之间进行交换。PHP 提供了动态创建 PDF 文档的支持——也就是说，可以“实时”生成数据库驱动的\
  \ PDF 报告。这是一个非常强大的功能，使得从浏览器浏览器打印报告成为一项一致且简易的任务。接下来的几个章节将展示如何为 PHP 准备实现此功能所需的库。\n\
  \n有必要对共享库和静态库进行简单说明。当库被编译为 `shared`（共享）时，多个应用程序可以访问该库提供的功能，但该库只加载到内存一次。使用共享库可以减小编译这些库的二进制文件体积，但用户计算机上必须可用该共享库。编译为\
  \ `static`（静态）的库会将整个库包含在二进制文件中；分发带有静态库的程序不需要用户已经拥有该特定库。我们将向你展示如何使用共享库编译 PHP。\n\n\
  ### 编译 zlib\n\n通常，库会有几个 `dependencies`（依赖项）。这些依赖通常是程序构建时使用的其他共享库。在 PHP 的最新版本中，如果不先安装\
  \ zlib，就无法安装 PDFlib。以下是设置 zlib 的方法。\n\n**1.**\n\nzlib 也包含在附带的 CD 中，或者从此 URL 下载：http://www.gzip.org/zlib/\n\
  \n安装并配置 APACHE 和 PHP\n\n**629**\n\n向下滚动页面并点击其中一个地理链接下载“zlib 源码，gzip 压缩的 tar 格式”。\n\
  \n**2.**\n\n在主目录下输入命令 `mkdir phplibs`（进入该主目录请输入 `cd ~`）来创建你的 PHP 库所在的目录，并将 zlib\
  \ 的“tar 包”文件移动到该 phplibs 目录中。\n\n**3.**\n\n使用以下命令解压 zlib 并进入其解压后的目录：\n```\ngunzip\
  \ -c zlib.tar.gz | tar xvf -\ncd zlib-1.x.x\n```\n（将 `x.x` 替换为你下载的正确版本。）现在当前工作目录是\
  \ `zlib-1.x.x`。\n\n现在是时候注意，PDFlib、zlib 以及大多数源码分发的编译过程非常相似；它们涉及部分或全部步骤：\n\n◆ 运行 `configure`\
  \ 脚本，它将生成 `makefiles`（这是用于编译器为特定平台和处理器编译程序的指令，包括对给定平台的任何优化）\n\n◆ 使用 `make` 命令编译文件\n\
  \n*注意*\n\n*整个编译过程可能花费很长时间。除非显示了易于识别的错误信息，否则让编译脚本完成它们工作即可。*\n\n◆ 使用可选的 `make test`\
  \ 命令检查你的编译（参见下一个子节，“使用 make test 检查编译”）\n\n◆ 切换到“超级用户”状态并使用 `make install` 命令进行安装\n\
  \n◆ 调用 `ldconfig` 配置库以供使用\n\n继续这些特定步骤以完成 zlib 的配置、编译和安装：**4.**\n\n下一步是运行 `configure`\
  \ 脚本。我们希望确保该库被编译为共享库，因此我们使用特定的开关：\n```\n./configure --enable-shared-pdlib --libdir=/usr/local\n\
  ```\n`configure` 脚本将输出一些关于操作系统、系统库中可用函数等信息。\n\n**5.**\n\n使用 `make` 编译并安装库：\n```\n\
  make\nsu\n```\n（等等，源文本将 `su` 和 `make` 混合在一起，遵循文本逻辑）：\n```\nmake\nsu\n```\n实际上，文本说的是：`make`\
  \ 然后是 `su`。\n\n\n\n[content]\n\n大多数 Red Hat 机器都预装了 Apache。尽管如此，通常需要从源码发行包重新编译 Apache。安装\
  \ PHP 就是这种需要重新编译的典型实例。\n\n要使用动态模块（例如 PHP 的动态版本），只需要在编译 Apache 时带有动态共享对象（DSO）支持即可。正如你将在稍后的章节中看到的，在静态编译\
  \ PHP 时，编译过程的处理方式不同。带有 DSO 支持的 Apache 编译允许 PHP 和 Apache 分别编译。在本书中，我们将一直对 PHP 使用\
  \ DSO 模块。这是经常重新编译 PHP 最简单的方法，而无需为了给 PHP 安装添加单个库就得忍受重新编译 PHP 和 Apache 的麻烦。\n\n![Image\
  \ 118](img/index-657_1.jpg)\n\n**632**\n\n**附录 A**\n\n# 安装 PHP 的速成课程\n\n获取 Apache\
  \ 的最新源码发行包（从附带光盘或 `http://httpd.apache.org/` 下载）并将其移动到 `src` 目录。然后你就可以解压 Apache\
  \ 并进入该目录：\n\n```bash\ngunzip -c apache_1. *x.x*.tar.gz | tar xvf -\ncd apache_1.\
  \ *x.x*.tar.gz\n```\n\n现在 Apache 可以进行配置和编译了。我们将采用最小化方法来编译 Apache；其默认配置已经足够，稍后我们只会添加将\
  \ PHP 安装为动态模块所需的必要选项。安装将使用 `/usr/local/apache` 目录。\n\n```bash\n./configure\nmake\n\
  su\nPassword: **************\nmake install\nexit\n```\n\n安装 Apache 之后，必须启动 Web 服务器。假设使用了默认的\
  \ Apache 配置，可以通过以下命令完成：\n\n```bash\n/usr/local/apache/bin/apachectl start\n```\n\
  \n为了确保 Apache 运行正常，请测试安装情况：打开你最喜欢的浏览器，并输入安装 Apache 的机器的 URL。你应该能看到图 A.2 所示的默认 Apache\
  \ 安装页面。如果你看到了这个屏幕，说明你已成功地配置、编译并安装了 Apache！\n\nApache 非常容易安装，并且在设计时考虑了在不同变 Unix 之间的移植性。\n\
  \n虽然所有可能出现的问题超出了本书的范围，但 Apache 项目确实拥有出色的文档。如果你在安装 Apache 时遇到困难，最好的起点是 Apache 安装根目录下的\
  \ `INSTALL` 文档。如果你无法看到测试页面，请确保系统符合 `INSTALL` 文档中列出的要求。\n\n*注意*\n\n*Apache 文档可以在\
  \ http://httpd.apache.org/docs/ 找到。*\n\n## 将 PHP 编译为动态 Apache 模块\n\n使用动态 Apache\
  \ 模块与使用普通 Apache 模块不同。“动态”编译过程稍微复杂一些；此外使用动态模块会有性能损失，尽管这种减少与 PHP 的 CGI 版本相比并不算严重。在生产系统或任何对性能至关重要的地方，都应该考虑静态方法。\n\
  \n现在我们只是想让运行起来，所以我们将先学习将 PHP 编译为动态 Apache 模块；静态版本将在稍后的章节中讨论。\n\n*注意*\n\n*如果你还没有设置\
  \ `zlib` 和 `PDFlib`，在在此继续之前需要先进行设置。请参附录早期章节中的说明。*\n\n![Image 119](img/index-658_1.jpg)\n\
  \n![Image 120](img/index-658_2.png)\n\n# 安装和配置 Apache 和 PHP\n\n**633**\n\n**图 A.2**\n\
  \n默认 Apache Web 页面\n\n首先，获取 PHP 发行包；你可以从附带的光盘获取或从 `www.php.net/downloads.php` 下载。将\
  \ `php-4. *x.x*.tar.gz` 压缩移动到 `src` 目录。然后是时候解压 PHP 发行包了：\n\n```bash\ngunzip -c php-4.\
  \ *x.x*.tar.gz | tar xvf -\ncd php-4. *x.x*\n```\n\n接下来，运行 PHP 的主配置脚本。PHP 有大量的编译选项可用。为了保持简单，此时我们只包含\
  \ `MySQL`、`PDF` 和 `zlib` 支持。使用以下命令将 PHP 配置为包含 `MySQL`、`PDFlib` 和 `zlib` 支持的动态 Apache\
  \ 模块。\n\n*注意*\n\n*如果你尚未安装 `MySQL`，请直接跳到“安装 RDBMS”章节，或者忽略 `--with-mysql` 选项。在配置 PHP\
  \ 使用 `MySQL` 之前，必须安装 `MySQL`。*\n\n```bash\n./configure --with-apxs=/usr/local/apache/bin/apxs\
  \ \\\n--with-pdflib=/usr/local \\\n--with-zlib=/usr/local \\\n--with-mysql\n```\n\
  \n**634**\n\n**附录 A**\n\n安装 PHP 的速成课程\n\n在配置脚本之后，我们必须编译并安装 PHP：\n\n```bash\nmake\n\
  su\nPassword: **************\nmake install\nexit\n```\n\n如果在此过程中没有错误，PHP 现在已成功安装！但在可以使用它之前还需要另一个步骤：必须重启\
  \ Apache。使用以下命令：\n\n```bash\n/usr/local/apache/bin/apachectl\n```\n\n*注意*\n\n*PHP\
  \ 4.0 版本在 pdf.c 文件中有一个错误，导致模块无法正常编译。请使用较新版本的 PHP。*\n\n 测试安装\n\n一旦 PHP 安装成功，我们需要确保它运行正常。在\
  \ Apache 目录下创建一个名为 `php_test.php` 的文件，并输入列表 A.1 中的代码。\n\n列表 A.1：PHP 测试脚本\n```php\n\
  <?php\nphpinfo();\n?>\n```\n\n如果你从安装 Web 服务器的同一台机器浏览，URL 将类似于 `http://127.0.0.1/php_test.php`。加载的页面（如图\
  \ A.3 所示）应该很长，充满了关于 PHP 如何配置的信息。目前不必过于担心页面内容；重要的是页面是否加载。\n\n## 将 PHP 编译为静态 Apache\
  \ 模块\n\n将 PHP 编译为普通的静态模块比之前描述的动态方法多几个步骤。第一步与动态模块相同：如果你已经编译了 `zlib` 和 `PDFlib`，则不需要重新编译；只需解压\
  \ Apache 和 PHP，如下：\n\n```bash\ngunzip -c apache_1. *x.x*.tar.gz | tar xvf -\ngunzip\
  \ -c php-4. *x.x*.tar.gz | tar xvf -\ncd apache_1. *x.x*.tar.gz\n```\n\n接下来，必须像之前一样配置\
  \ Apache。目前默认配置符合我们的需求：\n\n```bash\n./configure\ncd ..\n```\n\n然后，配置过程发生了一些变化。我们不再继续配置\
  \ Apache，而是现在必须配置并编译 PHP：\n\n```bash\ncd php-4. *x.x*\n./configure --with-apache=../apache_1.\
  \ *x.x* \\\n--with-pdflib=/usr/local \\\n--with-zlib=/usr/local \\\n--with-mysql\n\
  make\nsu\nPassword: **************\nmake install\n```\n\n一旦 PHP 完成编译并安装，下一步是编译 Apache。Apache\
  \ 必须配置以激活 PHP 模块：\n\n```bash\ncd ../apache_1. *x.x*\n./configure --activate-module=src/modules/php4/libphp4.a\n\
  make\n```\n\n\n\n将 `php.ini` 文件复制到适当位置，然后启动 Apache。执行这些任务后，请确保退出 root 壳：\n\n```\n\
  make install\ncd ../php-4. *x.x*\ncp php.ini-dist /usr/local/apache\n/usr/local/apache/bin/apachectl\
  \ start\nexit\n```\n\n在 Apache 运行后，请使用前一节“测试安装”中描述的步骤来验证安装。你的浏览器应该会显示与图 A.3 中的 PHP\
  \ 信息屏幕类似的界面。\n\n## 在 Windows 上设置 PHP 和 Apache\n\n在 Windows 计算机上运行 Apache 和 PHP 实际上比在\
  \ Linux 上要简单，这得益于一个简化了许多 Apache 设置选项的向导。\n\n### 在 Windows 上安装 Apache\n\n在 Windows\
