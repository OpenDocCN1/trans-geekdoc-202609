  \n如图 5.2 所示，栈是一个非常简单的数据结构。为了将数组严格视为栈，PHP 提供了三个主要的函数——`array_push()`、`array_pop()`\
  \ 和 `array_shift()`——它们简化了将数组当作栈使用的流程：\n\n## 第 6 章：面向对象编程 (OBJECT-ORIENTED PROGRAMMING)\n\
  \n### 原理\n\n此时，如果你从未听说过什么是栈，你可能在心里问自己到底能用栈来干什么。嗯，在日常的 Web 编程中，通常不会使用栈。\n\nPHP 确实提供了轻松地将数组作为栈的能力，因为这样做可以使复杂的问题变得简单。代码列表\
  \ 5.15 显示了栈的简单用法。\n\n如图 5.2 所示，栈是一个非常简单的数据结构。为了...\n\n（注：原文包含大量重复和碎片化的章节，已根据指令整合了核心技术内容）\n\
  \n\n\n\n`encapsulation`（封装）的概念是隐藏实现并对其进行抽象，并将数据和方法（函数）封装在类中。在大多数面向对象编程（OOP）语言中，都有办法隐藏对象内部数据的方法，通常使用\
  \ `public`、`protected` 和 `private` 关键字。PHP 缺乏隐藏对象数据（或字段）的技术。这意味着没有办法保护对象的实现细节，因为对象的任何字段都可以被访问。由于\
  \ PHP 无法限制或控制对对象及其内部方法和字段的访问，在 PHP 中真正的封装可以被认为在技术上是不可能的。这使得面向对象编程的原则之一变得较难实现，并留给类的实现者去妥善记录公共方法和非公共方法。\n\
  \n然而，类的终端用户无法滥用特定类的私有方法。私有方法仅仅是如此——它们对于对象的特定实例是私有的，不会被类的终端用户修改、使用、甚至看到。\n\n对象整洁地将它们的方法与全局命名空间隔离开。当过程被引入全局命名空间时，命名冲突的概率就会增加。同一个函数（在面向对象的术语中称为方法）可以在不同对象之间重复使用。例如：\n\
  \n```php\nfunction print_data\n{\n    /* 执行某些操作打印会计数据 */\n}\n\nfunction print_data\n\
  {\n    /* 执行某些操作打印客户地址详情 */\n}\n```\n\n这段代码在 PHP 中会导致错误，因为它试图在全局命名空间中定义两次相同的函数，导致了冲突。以下代码使用对象整洁地避免了这个问题：\n\
  \n```php\nclass client\n{\n    function print_data()\n    {\n        /* 打印客户详情 */\n\
  \        return 0;\n    }\n}\n\nclass bank_account\n{\n    function print_data()\n\
  \    {\n        /* 打印账户详情 */\n        return 0;\n    }\n}\n```\n\n使用对象的代码没有引入命名空间冲突，因为每个\
  \ `print_data` 方法都属于特定的对象。\n\n随着程序规模扩大，命名空间冲突可能变成问题。全局命名空间中的变量和函数也是如此。简单的解决方法是对过程技术采用谨慎的命名规范：\n\
  \n```php\nfunction account_print_data\n{\n    /* 执行某些操作打印会计数据 */\n}\n\nfunction\
  \ client_print_data\n{\n    /* 执行某些操作打印客户地址详情 */\n}\n```\n\n应用程序的健康状况和质量取决于应用程序所解决问题的复杂性，以及规划应用程序时的用心。仅仅因为一个应用程序使用了\
  \ `XYZ` 编程方法和 `ABC` 架构，并不意味着该应用程序能够立即高效地解决问题。OOP 不是编程的万灵药。没有某种终极解决方案或革命可以立即挽救一个计划不当的项目或进度落后的应用程序。成功项目的配方可以写满整本书书；OOP\
  \ 仅仅是成功应用配方中一个很可能的成分。过程式编程也可以产生与 OOP 一样高效且无全局冲突的程序；只是这种结果在 OOP 中更为根深蒂固。\n\n## 第\
  \ 6 章\n\n### 面向对象编程\n\n#### 代码复用\n\nOOP 被推崇的最大优势之一是代码复用。实现这一点的主要方法是使用类的对象。还有其他复用代码的方法，例如将几个类聚合到一个新类中，从而允许新类与现有类协同工作。类的聚合通常比继承是一个更有用且更容易上手的工具。我们很快会讨论清晰规划继承类有多重要，并考虑使用继承的替代方案。通过聚合类来解决特定问题通常是一个有效的替代方案。可重用的代码必须设计得非常仔细，否则其重用性会大幅下降，有时甚至消失。通常，对于设计易于交互的类并没有硬性规则；只有经验和设计才能创建出可重用的代码，这超出了本本书的范围。使用聚合允许对象轻松地模拟某些现实生活中的对象。通常，在初学\
  \ OOP 时，将类嵌套以便它们与其他类交互，比继承更容易管理，也更安全。\n\n考虑旧电视机上的旋钮。这些旋钮包含在一个较大的电视对象中，该对象还有一个显示极管、各种电子元件，甚至可能还有组成大旋钮的更小旋钮。很容易看到简单地聚合对象就能在编程语言中模拟现实世界的对象。\n\
  \n另一方面，继承是一个非常棘手的课题。通常，会创建复杂的类层次结构来模拟真实世界对象。这些层级结构和类扩展在设计不当时会变得臃肿。继承是创建扩展基类功能的子类的过程。*继承应当谨慎使用！*\
  \ 修改一个有多个从其派生的子类的父类会导致更改立即级联到所有子类；这一事实使得事前的良好设计成为必要。这仍然是一项很棒的工具，在谨慎应用时非常有用。\n\n\
  软件中的关系经常会变化；这种关系的动态性质导致需要 `refactor`（重构）或重新排列代码，以便层级结构能更好地模拟真实世界对象。通过重构和清理设计，程序将再次变得“正确”。编写整洁、易于扩展的应用程序很大程度上取决于前期对应用程序设计投入的精力。\n\
  \n要量化 OOP 的绝对优缺点仍然可能困难。毕竟，PHP 是一种 Web 应用程序语言，其真实目的并非为了独立解决复杂的企业级业务问题。在决定解决特定问题的最佳方法时，请记住所有这些。\n\
  \n尽管这些方面与 PHP 以及 PHP 提供的 OOP 机制的细节没有直接关系，但在设计应用程序时，选择正确的工具和语言特性是关重要的。\n\n## PHP\
  \ 的实现\n\n#### PHP 的实现\n\n现在是时候动手操作，看看对象在 PHP 中是如何工作的。我们将讨论的第一点将是具体如何定义类以及类具体的作用。然后我们将进入对象初始化和实际的实例化过程。下一个逻辑步骤是扩展一个对象。\n\
  \n在学习了如何扩展对象后，我们将讨论 PHP 中一些精细的要点。\n\n#### 定义类\n\n类本质上是数据类型的轮廓。类的定义规定了如何与类交互以及类将包含什么数据。\n\
  \n\n\n\n在本章的后续内容中，函数将通过其正式的 OOP 名称 `methods` 被称为方法。对象的其他部分是其中包含的数据：数据成员，在本章的后续内容和书中被称为\
  \ `fields`（字段）。\n\n第一个需要了解的关键字是 `class`。`class` 关键字用于定义一个类；其后紧跟类名和一组大括号，在大括号内定义字段和方法。方法和字段不能在类的声明之外定义。\n\
  \n我们将通过一个待解决的问题来介绍类。我们需要解决的问题是：一种灵活的方法来确定和存储特定用户正在使用的 Web 浏览器详情。我们将使用 `WebClient`\
  \ 类来解决这个问题。\n\n*注意*\n\n*我们演示的 `WebClient` 类是开源 Horde Application Framework 中找到的优秀浏览器检测类。对于一个充分利用\
  \ PHP 面向对象特性的顶级项目，请访问他们的网站 `www.horde.org`。此处使用的 `WebClient` 示例和完整类受 LGPL 许可证条款保护。要查看完整许可证，请参阅随书附带\
  \ CD 光盘中的 `LGPL.txt` 文件。*\n\n我们将从非常简单的开始编写类，这样我们就可以弄清沿途出现的所有小细节，而不至于被淹没。该类的整体设计的一个限制是它利用\
  \ `USER_AGENT` 字符串来确定关于浏览器的任何信息。该类最初将仅根据 `USER_AGENT` 字符串对客户端做出假设和判断。进一步的测试允许设置各种字段以提供更多客户端信息，但最初在没有更广泛测试的情况下，该类只能知道这些。该类的主要用途是存储数据并进行粗略分析，以便第一次尝试就能识别大多数用户。类以\
  \ `class` 关键字开始定义类名：\n\n```php\n<?php\n\nclass WebClient\n{\n\nvar $frames;\n\n\
  var $tables;\n\nvar $layers;\n\n}\n\n?>\n```\n\n这个类易于理解。它包含了三个字段：`frames`、`tables`\
  \ 和 `layers`。这三个字段每个都将包含一个布尔值，代表客户端是否支持 HTML/DHTML 中三个同名特征。每个字段*必须*使用 `var` 操作符进行声明。在\
  \ PHP 4 和通常情况下，这些字段声明仅仅是标识符声明。此时不应给非常量值赋值（在 PHP 4 中也无法赋值）；变量应该在构造函数中初始化（但现在不用担心构造函数）。\n\
  \n现在我们有了一个类；太棒了！我们到底做了什么？简单来说：我们定义了一个 `WebClient` 类型对象的蓝图。现在既然我们已经知道了 `WebClient`\
  \ 的确切公式，我们需要从服务器内存的原始汤中调出一个 `WebClient` 实例，并用我们无所不能的力量赋予它以生命。\n\n*注意*\n\n*当一个宇宙的主宰感觉很好，即使这个宇宙仅仅是一台服务器。*\n\
  \n### 实例化类\n\n创建一个类的实例非常简单。让我们创建一个 `WebClient` 类的实例：`$my_browser = new WebClient;`。\n\
  \n酷酷！我们有一个对象可以操作了。这很不错；现在我们需要访问它的字段并做一些有用的事情。如前所述，使用 `->` 操作符调用方法并访问字段。这允许对成员函数和数据成员进行取探和探测：\n\
  \n```php\n$my_browser->frames = true;\n\n$my_browser->tables = true;\n\n$my_browser->layers\
  \ = true;\n\nprint(“Browser Has Frames: “ . $my_browser->frames);\n```\n\n现在我们定义了一个类，实例化了一个类对象，设置了对象内部的字段，并从对象中提取了数据。第一行创建了我们刚刚创建的\
  \ `WebClient` 对象实例。接三行使用 `->` 操作符为 `$my_browser` 实例中的字段赋值。\n\n在设置字段值后，我们使用 `->`\
  \ 操作符获取刚刚设置的值，以访问 `WebClient` 对象实例 `$my_browser` 的 `frames` 字段。我们可以创建一个类的多个实例，并为对象分配完全不同的值。使用对象时，第一个且最明显的代码复用方法得到了。理想情况下，我们希望使用方法来检索和设置字段，这样内部数据就由对象维护，我们只需发送消息（调用方法）来更改数据。\n\
  \n在 PHP OOP 中，对于哪些数据对类用户是可见或不可见的并没有明确的区分。在访问和直接修改对象的字段时必须小心。在 PHP 中，不篡改数据的责任留给了类的最终消费者。\n\
  \n现在我们已经创建了类的实例，并访问了存储在实例字段中的值，是时候学习如何正确地初始化类的实例了。\n\n### 构造函数\n\n构造函数是在对象实例化时被调用的函数。构造函数会自动调用一次且仅调用一次。构造函数可以用来初始化对象；PHP\
  \ 4 强制要求在使用动态数据初始化字段时使用构造函数。在类的定义中，只有常量可以赋值对象的字段；其他所有内容放在构造函数中。\n\n类的构造函数仅仅是一个与类名完全相同的方法。这是一个\
  \ `WebClient` 类构造函数的示例：\n\n```php\n<?php\n\nclass WebClient\n{\n\nvar $frames;\n\
  \nvar $tables;\n\nvar $layers;\n\nfunction WebClient()\n{\n\n$this->frames = true;\n\
  \n$this->tables = true;\n\n$this->layers = true;\n\n}\n\n}\n\n?>\n```\n\n现在我们的构造函数变得智能了一些，并且做了一些有用的事情。构造函数判断客户端是否为\
  \ Internet Explorer 3 或更高版本，如果是则打印一条消息。\n\n记住在函数内部，如果我们想访问全局命名空间中的任何变量，必须使用 `global`\
  \ 关键字。在这里我们需要对 `$USER_AGENT` 进行一些基础测试，因此将其声明为全局变量。\n\n\n\n\n\n在大多数情况下，忘记一个对象并让垃圾回收器回收内存是没问题的。在必须对对象进行清理的情况下，应该编写一个专门为清理设计的自定义方法。没有办法可以确保该方法被调用；只有使用类的人勤奋才能保证进行适当的清理工作。\n\
  \n通常，当脚本完成时，PHP 会清理文件句柄等项。可以使用一个特殊函数在某种程度上模拟析构函数。`register_shutdown_function()`\
  \ 允许在脚本完成时调用一个函数或方法。此函数或方法*总是*会被调用的；通过这种方式，可以使用一种粗略的对象销毁形式。注册的方法或函数按照先入先出（FIFO）的顺序处理。\n\
  \n### 注意\n垃圾回收只处理回收丢失的内存。\n\n## 方法\n方法是对象实现实际功能的地方。一个*方法*（method）本质上只是类成员的函数。我们简单地通过在类内部定义一个函数来实现一个方法。然后，可以从类内部（使用对象内的特殊变量）或从对象外部调用方法。在对象内部和外部都使用\
  \ `->` 运算符向对象发送消息，让对象知道调用特定的方法。让我们看看列表 6.1 中 `WebClient` 类稍微复杂一点用法，这次包含一个非构造函数方法：**列表\
  \ 6.1：带有构造函数和方法的类 (WebClient_construct.php)**\n\n```php\n<?php\n\nclass WebClient\n\
  {\nvar $frames;\nvar $tables;\nvar $layers;\n\nfunction WebClient()\n{\nglobal $HTTP_USER_AGENT;\n\
  $this->frames = true;\n$this->tables = true;\n$this->layers = true;\n$this->msie\
  \ = false;\n$this->msie_3 = false;\n$this->msie_4 = false;\n$this->msie_5 = false;\n\
  if ((preg_match(“/MSIE ([0-9.\\]+)/”, $HTTP_USER_AGENT, $version))\n|| (preg_match(“/Internet\
  \ Explorer\\/([0-9.\\]+)/”,\n$HTTP_USER_AGENT, $version)))\n{\nlist($ver, $minor)\
  \ = explode(“.”, $version[1]);\nif($ver == 3)\n$this->is_ie3();\n}\n}\n\nfunction\
  \ is_ie3() {\n$this->msie = true;\n$this->msie_3 = true;\n/* Features not supported\
  \ */\n$this->layers = false;\n}\n}\n\n$my_browser = new WebClient;\nprint(“Before:\
  \ “ . $my_browser->layers . “<br />”);\n$my_browser->is_ie3();\nprint(“After: “\
  \ . $my_browser->layers . “<br />”);\n?>\n```\n\n这个示例中使用了一个新概念：变量 `$this`。在对象内部，`$this`\
  \ 始终指向当前对象。因此，当类内部的函数说 `$this->msie` 时，它指的是调用该函数所在对象实例的 `msie` 字段。`$this` 变量是从对象内部访问方法和字段的方便方式。在\
  \ PHP 中，这对于类的终用户来说是完全无法强制执行的，但应该始终通过方法访问字段。这些字段存储了对象的状态。虽然我们无法强制这些规则（因为任何字段都可以在对象外部显式地修改），但对内部和外部可访问字段和方法有清晰的定义仍然是良好的做法。\n\
  \n## 完整的 WebClient\n现在我们将在列表 6.2 中查看整个 `WebClient` 对象。它比之前的简单 `WebClient` 复杂得多。虽然代码很复杂，涵盖了许多常用浏览器，但它也非常直观且易于理解。这里没有新的概念或技巧——只有已经涵盖过的简单类概念。\n\
  \n###  6.2：完整的 WebClient 类 (WebClient.php)\n```php\n/*\n* 此类遵循 LGPL 协议。\n* 关于重用此代码的更多信息，请访问\
  \ http://www.fsf.org/copyleft/lgpl.html\n*/\nclass WebClient\n{\n// Form element\
  \ caching (Netscape bug)\nvar $forms_without_cache;\n// File caching (even IE bug)\n\
  var $workaround_ie_download;\n// Disposition: attachment (most bizarre)\nvar $broken_disposition\
  \ = false;\n// some JavaScript issues can be worked around pop-up windows\nvar $rather_not_popup;\n\
  // Supported\nvar $js; // JavaScript versions\nvar $js_1;\nvar $js_1_1;\nvar $js_1_2;\n\
  var $js_1_3;\nvar $js_1_4;\nvar $java;\nvar $images;\nvar $frames;\nvar $layers;\n\
  var $tables;\n// Browsers and versions\nvar $ns;\nvar $ns_3;\nvar $ns_4;\nvar $ns_5;\n\
  var $msie;\nvar $msie_3;\nvar $msie_4;\nvar $msie_5;\nvar $lynx;\nvar $links;\n\
  var $kde;\nvar $hotjava;\nvar $fresco;\n\nfunction WebClient() {\nglobal $HTTP_USER_AGENT;\n\
  $this->workaround_ie_download = false;\n$this->forms_without_cache = true;\n$this->rather_not_popup\
  \ = false;\n$this->js = true;\n$this->js_1 = true;\n$this->js_1_1 = true;\n$this->js_1_2\
  \ = true;\n$this->js_1_3 = true;\n$this->js_1_4 = true;\n$this->frames = true;\n\
