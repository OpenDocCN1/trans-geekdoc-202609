  \ IMAP 的情况下，操作要简单得多。\n\n## 了解电子邮件\n\n每封电子邮件都由两个且仅有的两个部分组成：一个包含消息信息的信封，以及消息的内容（或称正文）。例如，以下就是一个完整的电子邮件消息：\n\
  \n收件人：eddie-ray@example.com\n\n发件人：billy-bob@example.net\n\n主题：冷笑话\n\n日期：Wed, 30\
  \ Jan 2002 14:55:08 +0800\n\n你听说过那种新式的灯芯鹅绒枕头吗？\n\n584\n\n## 第 19 章\n\n### 电子邮件\n\
  \n信封包含一系列头字段，每个字段都以一个 `name:value` 对的形式写入。头字段通过一个空行与正文隔开。空行之后的所有内容都是消息的正文。常见的电子邮件在头字段和正文中都会包含比这多得多的信息，且正文可以由多个嵌套的部分和子部分组成，但基本结构始终是相同的。\n\
  \n电子邮件的传输手段简单邮件传输协议 (SMTP) 同样简单：邮件客户端连接到指定端口 (25) 上的邮件服务器并发送几个基本命令。例如，我们可以使用 Telnet\
  \ “伪造”一个 SMTP 会话，如下所示。**粗体行**是我们输入的，首先是在提示符处输入，然后在与邮件服务器的交互会话中输入。\n\n```\n$ telnet\
