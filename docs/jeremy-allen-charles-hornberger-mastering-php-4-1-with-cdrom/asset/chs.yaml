  \n#### 第一范式 (1NF)\n\n归一化使用了几种 `normal forms`（范式），即归一化数据库必须满足的规则或特征。第一范式（或 `1NF`）规定，*表中不应该有重复组。*这意味着你不应该在表内部使用数组或逗号分隔的列表来存储任何数据。这强制了某种唯一性：数组或列表内容的存在表明你的数据库尚未拆分到逻辑上不可分割的数据元素。这些类型的数据不是标量的，因此不符合\
  \ 1NF。我们的 Pets 数据库已经处于第一范式。\n\n*提示*\n\n`row`（行）是数据库中的条目，由特定项目的所有相关字段组成。例如，在地址簿中，一个人的条目就是一行；他们的姓名、地址、城市等就是不同的字段。\n\
  \n*注意*\n\n*数据库中的这些“方向”（字段和行）通常可以单独操作。你可以完全从地址簿数据库的每一行中删除 `E-Mail` 字段，而不会影响此处保留的人列表中的任何其他元素。同样，你可以从列表中删除某个特定人员，而不会影响其他条目中任何字段的任何信息。*\n\
  \n因此，我们 Companies 数据库的初稿如图 8.2 所示，包含一个带有六个字段的表。我们在数据库中输入的每家公司都将有一个 `ID` 字段、一个 `Name`\
  \ 字段等。\n\nCompany 表以多种方式重复了组。第三个字段 `EmployeeList` 名称中的 `list` 一词是一个泄露的迹象，表明它包含了非标量或非原子的值。在这个例子中，意图是将公司的员工存储在逗号分隔的列表中。这违反了第一范式。如果你必须删除一个员工，没有地方可以记录该员工，以便你去删除一个单一的、完整的元素；你必须找到并更改元素中*部分*内容。此外，你将如何记录每个员工的信息——名字、姓氏、地址等？这样做需要在\
  \ `EmployeeList` 字段内部创建“子字段”——这就是数组的定义，并表明该字段不是原子的或不可分割的。\n\n![Image 33](img/index-240_1.png)\n\
