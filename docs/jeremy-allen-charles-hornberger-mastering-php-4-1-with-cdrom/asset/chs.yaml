  \ URL 现在则显示为超链接。此外，替换后的 URL 将仅包含一个 `href` 属性。后者的技术在从用户内容中清理 URL 时非常有用——它可以消除任何带有\
  \ `onclick` 属性或类似的潜在 JavaScript 恶意代码。\n\n此示例还展示了 Perl 兼容正则表达式（PCRE）的一个巧妙特性，该特性在\
  \ POSIX 版本中是不支持的：通过在 `*` 运算符后面加上 `?` 运算符来使 `*` 运算符变为“非贪婪”。默认情况下，`*` 运算符是贪婪的：它会尽可能多地消耗文本，只要允许正则表达式中的任何后续表达式执行成功。如果这还不清楚，请考虑：在正则表达式\
  \ `/<a href=\\\"(.*)\\\"\\>(.*)<\\<\\/a>/i` 中，两个 `.*` 表达式会匹配列表 5.10 原始字符串中的两个子字符串\
  \ `http://www.sybex.com/` 和 Sybex，但它们也会匹配这两个子字符串 `http://www.sybex.com/”>Sybex</a><br\
  \ /><a href=\\\"http://www.slashdot.org/` 和 Slashdot，这显然不是我们想要反引用 `\\1` 和 `\\2`\
  \ 中得到的内容。但由于 `*` 是贪婪的（而且由于后一组匹配与第一组同样有效），后一组匹配将胜出，我们最终得到一些严重损坏的超链接。（正则表达式中后续的贪婪运算符并不重要，因为正则表达式是从左到右执行的。第一个贪婪运算符可以尽可能消耗文本；随后的贪婪运算符则被迫争夺剩余的碎片部分。）\n\
  \n我们使用 `?` 运算符结合 `*` 运算符来解决这个问题。当它紧跟在 `*` 运算符后面时，`?` 失去了原来的含义，而是告诉 `*` 变为“非贪婪”；`*`\
  \ 运算符乐意服从这一要求，尽可能少地匹配原始字符串，同时允许正则表达式中的剩余表达式执行成功。\n\n另一种选项是只需替换标签内容而不删除任何属性。代码将如下：\n\
  \n```php\n<?php\n\n$string = \"<a href=\\\"http://www.sybex.com/\\\">>Sybex Website</a><br\
  \ />\"\n. \"<a href=\\\"http://slashdot.org/\\\">>News Site</a>\";\n\n$pattern =\
  \ '/<a(.*?)>.*?<\\/a>/i';\n\n$replacement = '<a\\1>Click!</a>';\n\n$string = preg_replace($pattern,\
  \ $replacement, $string);\n\nprint($string);\n\n?>\n```\n\n现在我们可以看到如何轻松地操作 HTML\
  \ 标签。这类正则表达式可以用于验证和清理用户生成的内容。可以检查 URL 的安全性。替换的次数可以作为第四个参数传入。如果只需要替换第一个 URL，`preg_replace()`\
  \ 的调用看起来如下：`$string = preg_replace($pattern, $replacement, $string, 1);`\n\n通过将数字\
  \ `1` 作为可选的第四参数传递给 `preg_replace()`，我们限制了它执行替换的次数；换句话说，它只会替换匹配 `$pattern` 的第一个子字符串。\n\
  \n## 基于匹配模式分割字符串：preg_split()\n\n`preg_split()` 函数使用正则表达式作为分隔符来拆分字符串。在使用适当的情况下，这是另一个非常有用的工具。假设我们有一个需要拆分的日期，且该日期可以用点或斜杠分隔。使用简单的\
  \ `explode()` 调用来拆分这个字符串超出了范围，但很容易使用 `preg_split()`：\n\n`array preg_split(string\
  \ pattern, string subject [, int limit [, int flags\\]])` 列表 5.11 展示了如何使用 `preg_split()`\
  \ 来拆分日期：**列表 5.11：基于找到的字符串分割字符串**\n\n```html\n<html>\n<head>\n\n<title>preg_split</title>\n\
  </head>\n<body>\n\n<?php\n\n$date = \"10/10.95\";\n\n/* 允许的日期分隔符为 . / - */\n\n$date_array\
  \ = preg_split(\"/\\[.\\-\\/\\]/\", $date);\n\nvar_dump($date_array);\n\n?>\n</body>\n\
  </html>\n```\n\n注意，在指定的模式中，横线前面有一个反斜杠。正如之前解释的，其原因是因为字符类内部的横线是范围分隔符，必须使用反斜杠进行转义才能在正则表达式中以字面形式表示。\n\
  \n*提示*\n\n*有关 `preg_replace()` 和 `preg_split()` 的更多信息，请参阅 PHP 在线文档或附带 CD。*\n\n由于\
  \ PHP 的弱类型模型，可用的正则表达式函数能够实现非常灵活且强大的脚本。尽管 PHP 不是理想的语言，但它的表现并不糟糕。\n\n### 数组\n\n数组是\
  \ PHP 中的基础数据结构之一。数组中的任何值可以是字符串或数字；键并不局限于简单的索引。\n\nPHP 中的数组被实现为有序映射，这种数据类型接收值并将其映射到键上。因此，数组被称为*关联数组*。数组的操作有很多门道。但在对数组进行操作之前，你需要了解它们是如何创建的。\n\
  \n#### 创建数组\n\n第一种也是最基本的数组类型是数字索引数组。基本的数字索引数组如下：\n\n```php\n<?php\n\n$numeric_index\
  \ = array();\n\n$numeric_index[0] = \"Ram\";\n\n$numeric_index[1] = \"CPU\";\n\n\
  $numeric_index[2] = \"Video Card\";\n\n$numeric_index[3] = \"Hard Drive\";\n\n?>\n\
  ```\n\n第一个语句创建了一个数组变量；后续语句定义了数组元素的值，通过数字索引进行标识。\n\n另一种有用的语法是不指定任何数组索引，这将元素添加到数组末尾并使用顺序索引。\n\
  \n```php\n<?php\n\n$no_index_specified = array();\n\n$no_index_specified[] = \"\
  Ram\";\n\n$no_index_specified[] = \"CPU\";\n\n$no_index_specified[] = \"Video Card\"\
  ;\n\n$no_index_specified[] = \"Hard Drive\";\n\n?>\n```\n\n数组的键也可以是字符串，而不仅仅是数字：\n\
  \n```php\n<?php\n\n$pc_parts = array();\n\n$pc_parts[\"Memory\"] = \"256 MB\";\n\
  \n$pc_parts[\"CPU\"] = \"1 GHz Athlon Thunderbird\";\n\n$pc_parts[\"Video Card\"\
  ] = \"Matrox G400 MAX\";\n\n$pc_parts[\"Hard Drive\"] = \"IBM Desktar 40 GB\";\n\
  \n?>\n```\n\n数组也可以用稍微不同的语法创建，允许在数组中轻松定义数组。与其在数组声明中使用空括号，我们可以在这些括号内定义“子数组”，正如我们在第二章的示例中所做的那样：\n\
  \n```php\n<?php\n\n$cars = array\n\n(\n\"Ford\" => array (\"Mustang\", \"Focus\"\
  , \"F150\"),\n\"Chevy\" => array (\"Camaro\", \"Silverado\", \"Cavalier\", \"Corvette\"\
  ),\n\"Porsche\" => array (\"911\", \"Boxer\")\n);\n\n?>\n```\n\n示例中的“子数组”最终 `array()`\
  \ 调用中的值是顺序索引的。\n\n\n\n\n在 PHP 中，定义和实现数组有多种方法。只要要存储的数据表示得当，在数组声明方面，并没有所谓的“正确”或“错误”句法。创建一个数组并不是真正棘手的部分。遍历数组并操作其中包含的数据才是真正有趣的所在。\n\
  \n148 \n\n# 第 5 章\n\n## 字符串与数组\n\n#### 在数组中移动\n\n我们可以遍历数组，并在此过程中对它们进行“探测”和“处理”。有很多函数可以处理数组操作。此外，还有一些简单的方法可以遍历数组。\n\
  \nPHP 提供的遍历数组的最自然的方法之一是 `foreach` 循环结构。我们已经在第 2 章中见过 `foreach` 的实际应用了。现在，我们将看到它更高级的用法，以及一些遍历数组的替代方法（这些方法有时非常有用）。当该结构应用于数组时，它的操作本质上是：“对数组\
  \ `$xyz` 中的每个键/值值对执行某些操作”。\n\n列表 5.12 利用 `foreach` 将我们的数组内容与一些框架文本合并。\n\n**列表 5.12：使用\
  \ foreach 遍历数组**\n\n```php\n<?php\n\n$pc_parts = array();\n\n$pc_parts[\"Memory\"\
  ] = \"256 MB\";\n\n$pc_parts[\"CPU\"] = \"1 GHz Athlon Thunderbird\";\n\n$pc_parts[\"\
  Video Card\"] = \"Matrox G400 MAX\";\n\n$pc_parts[\"Hard Drive\"] = \"IBM Desktar\
  \ 40 GB\";\nforeach($pc_parts as $part_type => $part_name)\n\n{\n\n$buf = sprintf(\"\
  Part name is: <strong>%s</strong> Part value is:\n<strong>%s</strong>\", $part_type,\
  \ $part_name);\n\necho $buf . \"<br />\";\n\n}\n\n?>\n```\n\n注意 `foreach` 语句的第一个参数是要循环的数组。数组的每个元素在循环中都以\
  \ `key` => `value` 的形式可用。因此，我们用 `$part_type` 作为键，用 `$part_name` 作为值，这对应于数组中的键/值对。这使得遍历非顺序索引的关联数组变得非常简单。\n\
  \n另一种遍历数组的流行方法是结合 `list()` 和 `while` 循环。\n\n```php\nvoid list(...)\n```\n\n虽然它看起来像一个函数，但\
  \ `list` 实际上是一个语言结构，这意味着参数周围的括号并不是严格必要的。它用于通过从数组中提取值，一步到位将多个值赋值给多个变量。考虑以下示例（记住 `explode()`\
  \ 将其结果作为数组返回）：\n\n```php\nlist ($area_code, $prefix, $lastfour) = explode (\"\"\
  , \"415-555-8277\");\n```\n`list` 函数在 `while` 循环中结合 `each()` 函数使用时，提供了一种遍历数组的方法，同时可以在循环内部访问访问键和值。\n\
  \n```php\narray each(array array)\n```\n\n数组\n\n149\n\n`each()` 返回一个包含两个元素（0 和 1）的数组。第一个元素\
  \ 0 是键，第二个元素 1 是值。该函数还将数组的内部指针顺序移动到数组中的下一个项目。这意味着，如果我们对 `$pc_parts` 数组调用两次 `each()`\
  \ 函数，第一次调用将返回“Memory”键/值对，第二次调用将返回“CPU”键/值对。当数组到达末尾时，`each()` 返回 False；这就是 `while`\
  \ 循环知道停止的方式。\n\n在看代码之前，还有一个函数需要注意，即 `reset()`，它将内部数组指针重置为第一行，然后返回第一个元素。\n\n```php\n\
  mixed reset(array array)\n```\n\n列表 5.13 是列表 5.12 代码的修订版本。注意，我们在 `foreach` 循环和 `while`\
  \ 循环之间调用了 `reset()`。这是必要的，因为有一个被称为“数组内部指针”的后台计数器。每个数组都有一个内部指针，可以对其进行推进或回溯以便在数组中来回移动。许多数组操作（包括将数组传递给\
  \ `each()` 或在 `foreach` 循环中使用数组）都会导致内部指针推进 1 位。因此，在 `foreach` 循环结束时，内部指针已经过了数组的末尾。由于我们的\
  \ `while` 循环也依赖内部指针——`each()` 使用它从数组返回当前元素——我们必须首先使用 `reset()` 将内部指针重置为数组开头。\n\n\
  **列表 5.13：使用 foreach 和 while/list/each 遍历数组**\n\n```php\n<?php\n\n$pc_parts = array();\n\
  \n$pc_parts[\"Memory\"] = \"256 MB\";\n\n$pc_parts[\"CPU\"] = \"1 GHz Athlon Thunderbird\"\
  ;\n\n$pc_parts[\"Video Card\"] = \"Matrox G400 MAX\";\n\n$pc_parts[\"Hard Drive\"\
  ] = \"IBM Desktar 40 GB\";\n\nforeach($pc_parts as $part_type => $part_name)\n\n\
  {\n\n$buf = sprintf(\"Part name is: <strong>%s</strong> Part value is:\n<strong>%s</strong>\"\
  , $part_type, $part_name);\n\necho $buf . \"<br />\";\n\n}\n\necho \"<br />\";\n\
  \nreset($pc_parts);\n\nwhile (list($part_type, $part_name) = each($pc_parts))\n\n\
  {\n\n$buf = sprintf(\"Part name is: <strong>%s</strong> Part value is:\n<strong>%s</strong>\"\
  , $part_type, $part_name);\n\necho $buf . \"<br />\";\n\n}\n\n?>\n```\n\n150\n\n\
  第 5 章\n\n字符串与数组\n\n使用什么方法很大很大取决于个人喜好。最后，对于使用数字键的数组，你可以简单使用 `count()` 和 `for` 循环来处理数组。假设我们想让键按字母顺序对排序。在这种情况下，函数是\
  \ `ksort()`：\n\n```php\nvoid ksort(array array, int sort_flags)\n```\n\n第一个参数是要排序的数组；第二个参数是用来控制排序函数某些方面的标志。有三个标志（定义在表\
  \ 5.9 中）是所有排序函数通用的。\n\n表 5.9：排序标志\n\n| 排序类型 | 说明 |\n| :--- | :--- |\n| SORT_REGULAR\
  \ | 正常比较 |\n| SORT_NUMERIC | 数字比较 |\n| SORT_STRING | 字符串比较 |\n\n应该注意，排序函数不返回任何值；它们在原有处进行排序。也就是说，它们获取的是数组的引用，而不是值。这里是\
  \ `ksort()` 函数的应用：\n\n```php\n<?php\n\n$pc_parts = array();\n\n$pc_parts[\"Memory\"\
  ] = \"256 MB\";\n\n$pc_parts[\"CPU\"] = \"1 GHz Athlon Thunderbird\";\n\n$pc_parts[\"\
  Video Card\"] = \"Matrox G400 MAX\";\n\n$pc_parts[\"Hard Drive\"] = \"IBM Desktar\
  \ 40 GB\";\n\nksort($pc_parts);\n\nforeach($pc_parts as $part_type => $part_name)\n\
  \n{\n\n![图片 15](img/index-176_1.jpg)\n\n数组\n\n$buf = sprintf(\"Part name is: <strong>%s</strong>\
  \ Part value is:\n<strong>%s</strong>\", $part_type, $part_name);\n\necho $buf .\
  \ \"<br />\";\n\n}\n\n?>\n```\n\n在我们之前的代码中添加这一行后，`sprintf()` 的输出现在按键按字母顺序排列。\n\n\
  *提示*\n\n大量的其他排序函数可以在 CD 中的 PHP 文档中找到。有关更多排序函数的乐趣，请参阅 `asort()*,* `arsort()*,* `krsort()*,*\
  \ `ksort()*,* `natsort()*,* `natcasesort()*,* `sort()*,* `uksort()*,* `uasort()*,*\
  \ `usort()*,* `rsort()*,* 以及它们朋友。*\n\n151\n\n查阅出色的 PHP 文档中的数组部分，可以获得有关本章未提到的所有其他数组函数的更多信息。某些函数非常特殊，并不经常使用，但熟悉这些可用函数会让你成为更熟练的程序员。\n\
  \n#### 将数组用作字典和栈\n\n\n\n如前所述，PHP 中的数组可以用来模拟在其他语言中常见的各种复杂数据类型。虽然 PHP 的数组数据类型没有改变，但我们与数组交互的方式以及看待存储数据的视角确实发生了变化。你可能会认为，如果\
  \ PHP 数组如此强大、灵活并且能实现我所说的一切，那么它们一定很低下，但事实并非如此。PHP 数组是一种非常高效且易于操作的数据类型；为了这种效率和能力，并没有牺牲多少性能。\n\
  \n## 字典\n\n我们将检查的第一个经典“数据类型”是字典。字典是对名为 `hash table`（哈希表）的工具的更集中用法，它存储键值对。哈希表的主要优点之一是可靠的查找时间，可以确定某个键是否存在于数组中。哈希表（包括字典）的缺点之一是，无法保证数据以某种特定的顺序存储。\n\
  \n在 PHP 中，只需要不到百行代码和一个包含所有常用英语单词的文本文件，就能判断一个单词是否拼写错误。我们可以对“作为字典的数组”进行良好的测试，并在对数据集（在本例中是一个长英语单词列表）执行一些实用计算的同时，看看它能做什么。这些单词包含在配套光盘中，名为\
  \ `dictionary.txt`。这个字典绝不是完整或官方的；它只是一个很好的粗略估计，包含了你在未来一段时间内可能会遇到的每个单词。\n\n在深入代码之前，最好确切地知道我们正在做什么。接下来的代码将演示如何在包含超过\
  \ 100,000 个键的字典中检查任何键是否存在是多么快速和简单。这种查找方式正是我们判断一个单词是否拼写错误的方法。取一个可疑单词，并在我们的字典中进行查找。如果字典中没有找到该单词，说明它拼写错误了。我们将交给\
  \ PHP 的另一个任务是根据单词的长度（从一个字符到三十个字符）确定单词的出现频率。\n\n# 第 5 章\n\n## 字符串与数组\n\n*注意*\n\n\
  在仅有 128 MB RAM 的 Pentium 200 处理器上，确定一个包含 113,810 个键值对的数组是否存在某个键只需要不到一毫秒的时间。\n\n\
  列表 5.14 使用 PHP 文件函数来加载字典。它将尝试打开同一目录下名为 `dictionary.txt` 的文件，因此请务必从配套光盘将此脚本和字典文件复制到相同的位置。有关\
  \ PHP 文件函数的更多信息，请参阅第 13 章“文件与网络”；在本例中，字典是如何加载的并不重要，只要知道字典是什么即可。\n\n**列表 5.14: 字典趣\
  \ (dictionary.php)**\n\n```php\n<?php\n\n// 获取微秒级当前时间的函数。\nfunction get_microtime()\n\
  {\n    list($usec, $sec) = explode(\" \", microtime());\n    return ((double)$usec\
  \ + (double)$sec);\n}\n\n// 字典\n$arr_dictionary = array();\n\n// 用于 fread 的文件大小\n\
  $file_dict_size = filesize(\"dictionary.txt\");\n\n// 打开字典文本文件，只读模式\n$file_dict\
  \ = fopen(\"./dictionary.txt\", \"r\");\n\n// 将字典读到缓冲区\n$dict_buffer = fread($file_dict,\
  \ $file_dict_size);\n\n// 完成后关闭字典文件\nfclose($file_dict);\n\n// 获取第一个字典标记\n$dict_token\
  \ = strtok($dict_buffer, \"\\n\");\n\n// 从文本文件缓冲区获取剩余单词并\n// 存入我们的字典\nwhile($dict_token)\n\
  {\n    $dict_key = trim($dict_token);\n    $arr_dictionary[$dict_key] = strlen($dict_key);\n\
  \    $dict_token = strtok(\"\\n\");\n}\n\n// 释放缓冲区占用的内存。\nunset($dict_buffer);\n\
  \n// 在字典中搜索单词“fire’\nprint(\"Searching array with \" . count($arr_dictionary) .\
  \ \" keys.... \");\n$search_word = \"fire\";\n$start_time = get_microtime();\n$key_found\
  \ = isset($arr_dictionary[$search_word]);\n$end_time = get_microtime();\n\nif ($key_found)\
  \ {\n    // 找到逻辑\n    print(\"Finding if key exists \" . (float)($end_time - $start_time)\
  \ . \"ms\");\n}\n\n// 继续确定 n 长度单词的频率\nfor($i = 1; $i <= 30; $i++)\n{\n    print(\"\
  Detecting frequency of $i words: \");\n    $start_time = get_microtime();\n    $words\
  \ = array_keys($arr_dictionary, $i);\n    $end_time = get_microtime();\n    print(\"\
  Found \" . count($words) . \" that took \" . (float)($end_time - $start_time) .\
  \ \"ms\");\n    print(\"Percentage of words in dictionary \" . (double)(count($words)/count($arr_dictionary))*100\
  \ . \"%\");\n}\n\n?>\n```\n\n\n\n`stack`（栈）是另一种简单的数据结构，也是 PHP 数组数据类型的一种实用应用。简单来说，你可以将栈想象成类似于一叠牌牌：新值可以放在栈上，值也可以从栈中移除。大多数使用栈的程序都实现了“后进先出”（LIFO）或“先进先出”（FIFO）系统。栈通常用于存储错误消息：每当发生一个新错误时，该错误消息就会被放入栈中。然后可以从栈的顶部或底部开始逐个从栈中移除错误。\n\
  \n将某物放入栈中的操作被称为 `pushing onto the stack`（入栈）。从栈顶取出某物的操作被称为 `popping from the stack`（出栈）。图\
  \ 5.2 展示了一个向其推入多个值的栈。\n\n# 数组 (ARRAYS)\n\n**155**\n\n**图 5.2**\n\n**空栈**\n\n**Push(Z)**\n\
  \n**Push(G)**\n\n**Push(I)**\n\n**Pop()**\n\n**Read()**\n\n栈操作示例\n\nI\nG\nG\nG\n\
  G\nZ\nZ\nZ\nZ\nZ\n\n如图 5.2 所示，栈是一个非常简单的数据结构。为了将数组严格视为栈，PHP 提供了三个主要的函数——`array_push()`、`array_pop()`\
  \ 和 `array_shift()`——它们简化了将数组当作栈使用的流程：\n\n```\nint array_push (array array, mixed\
  \ var[], mixed …])\nmixed array_pop (array array)\nmixed array_shift (array array)\n\
  ```\n\n我们可以使用 `array_push()` 将项目推入栈中。`array_pop()` 和 `array_shift()` 函数允许从数组移除项目；`array_pop()`\
  \ 移除数组末尾最后一个项目（并返回其值），而 `array_shift()` 则移除数组开头的第一个项目（并返回其值）。\n\n此时，如果你从未听说过什么是栈，你可能在心里问自己到底能用栈来干什么。嗯，在日常的\
  \ Web 编程中，通常不会使用栈。\n\nPHP 确实提供了轻松地将数组作为栈的能力，因为这样做可以使复杂的问题变得简单。代码列表 5.15 显示了栈的简单用法。\n\
  \n**代码列表 5.15：栈的使用 (simplstack.php)**\n\n```html\n<html>\n<head>\n<title>Stack</title>\n\
  </head>\n<body>\n<?php\n$stack = array();\n$book_one = “Mastering PHP 4.1”;\n$book_two\
  \ = “War and Peace”;\n$book_three = “PHP Manual”;\narray_push($stack, $book_one);\n\
  array_push($stack, $book_three);\narray_push($stack, $book_two);\n\n$n = count ($stack);\n\
  while ($book = array_pop ($stack)) {\n    print (“Item $n: $book<br />\\\\n”);\n\
  \    $n--;\n}\n?>\n</body>\n</html>\n```\n\n**156**\n\n## 第 5 章：字符串与数组\n\n这个示例简单地创建了一个数组，它将伪装成一个栈。此时，如果你从未听说过什么是栈，你可能在心里问自己到底能用栈来干什么。嗯，在日常的\
  \ Web 编程中，通常不会使用栈。\n\nPHP 确实提供了轻松地将数组作为栈的能力，因为这样做可以使复杂的问题变得简单。代码列表 5.15 显示了栈的简单用法。\n\
