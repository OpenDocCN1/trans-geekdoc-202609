  \n由于您提供的文本中存在极其严重的段落重复，为了保证文档质量，我为您提取了核心逻辑内容并进行了翻译：\n\n## 选择数据传输方法：GET vs. POST\n\
  \n## 表单基础知识\n\n**271**\n\n### 什么是 HTTP 请求？\n\n每当 浏览器向服务器请求页面时，它都会向服务器发送一个 HTTP 请求。服务器反过来返回一个\
  \ HTTP 响应。HTTP（超文本传输协议）仅仅是制作这些请求和响应的标准方式。\n\n例如，如果你在网络浏览器中输入地址 `www.example.com/blank.html`，你的浏览器将向\
  \ `www.example.com` 服务器发送类似以下的内容：\n\n```\nGET /blank.html HTTP/1.1\nHost: www.example.com\n\
  User-Agent: Mozilla/4.0 (compatible; MSIE 5.01; Windows NT 5.0)\n```\n\n搞定。这是一个完整的（尽管相当小）的\
  \ HTTP 请求。正如你可能通过观察请求的第一个单词所看到的，我们的请求使用了 `GET` 方法。简而言之，这就是你每次从服务器请求 Web 页面时发生的情况。\n\
  \n为了继续我们浏览器和服务器之间的示例交换，假设 `blank.html` 是一个仅仅声明自己为空的 HTML 文件。基于此，`www.example.com`\
  \ 服务器将返回如下内容：\n\n```\nHTTP/1.1 200 OK\nDate: Fri, 16 Nov 2001 04:24:35 GMT\nServer:\
  \ Apache/1.3.19 (Unix) PHP/4.0.6\nLast-Modified: Fri, 16 Nov 2001 04:15:24 GMT\n\
  ETag: “5cdca-58-3bf492dc”\nAccept-Ranges: bytes\nContent-Length: 88\nContent-Type:\
  \ text/html\n\n<html>\n<head><title>A blank page</title></head>\n<body>See? Nothing\
  \ here.</body>\n</html>\n```\n\n就是这样——一个完整的 HTTP 响应。正如你所见，它只不过是一组“头部”（header）字段，后面紧跟着响应的“正文”（body），而正文正是我们在请求中索要的\
  \ HTML 文档内容。\n\n当使用 `GET` 方法提交表单时，浏览器会向服务器发送表单中所有成功控件的名称和值（参见本章稍后部分的“什么是成功控件？”）。浏览器通过将这些名称/值对附加在表单\
  \ `action` 属性所指定的 URL 末尾来实现此操作。例如，如果用户在以下表单的唯一字段中输入了 `orange`：\n\n```html\n<form\
  \ method=\"GET\" action=\"foo.php\">\nGive me the name of a fruit, quick:\n<input\
  \ name=\"fruit\" type=\"text\" />\n<input type=\"submit\" name=\"s\" value=\"OK\"\
  \ />\n</form>\n```\n\n**272**\n\n第 9 章\n\n## 表单与交互\n\n### 交互\n\n当使用 `GET` 方法提交表单时，浏览器会向服务器发送表单中所有成功控件的名称和值（参见本章稍后部分的“什么是成功控件？”）。浏览器通过将这些名称/值对附加在表单\
  \ `action` 属性所指定的 URL 末尾来实现此操作。例如，如果用户在以下表单的唯一字段中输入了 `orange`：\n\n（注：此处省略了原文中重复出现的完全相同段落，以保持文档可读性）\n\
  \n\n\n\n并*不能*为你提供针对窃听者或其他攻击者的任何真实安全保障，但至少它不会让这项工作变得异常轻而。\n\n尽管实际上可以让它工作，但 `GET`\
  \ 设计之初并不是为了从浏览器向服务器传输非 ASCII 数据。如果你怀疑你的读者可能会（例如）在用于允许用户提交俳句诗的 `textarea` 控件中输入日语文字符，那么使用\
  \ `GET` 将是让他们无法操作的稳妥方法。\n\n## 何时使用 POST\n\n首先，最重要的是，如果你的表单允许用户向你的服务器上传文件，你*必须*使用\
  \ `POST`。如果你不使用 `POST`，它就根本无法工作。\n\n# 第 9 章：表单与用户交互\n\n274\n\n其次，当你的表单提交产生副作用时，你就应该使用\
  \ `POST`。我们所说的副作用是什么意思？举个例子应该解释得很清楚：假设你正在构建一个交易网站。当用户填写购买股票的订单表单时，会产生明确（且严重）的副作用。以用户的名义下了一份订单购买一批股票。当订单执行时，钱款会从他们的交易账户中扣除。相比之下，比如在\
  \ Google 上搜索如何制作 *pelmeni*（一种美味的小俄罗斯方形面食，类似于饺子，但更好）的食谱。进行这种搜索完全没有任何副作用，除非你可能学到了如何制作\
  \ *pelmeni*。\n\n对于这类表单，使用 `POST` 的重要性与对搜索表单使用 `GET` 的良好原因恰恰相反：你不希望提交（或更准确地说，提交引发的副作用）发生两次。当你使用\
  \ `POST` 时，如果用户尝试重复提交表单，用户的浏览器会提醒他们。\n\n最后，正如我们之前提到的，`POST` 请求比 `GET` 请求略微具私密性。\n\
  \n## 什么是成功的控件？\n\n当表单被提交时，表单中的每个控件都会向服务器发送名称/值对（name/value pair）。只有被浏览器认为“成功”的控件，才会发送名称/值对。\n\
  \n通过在控件标签中包含 `disabled` 布尔属性，可以禁用任何表单控件；浏览器会将此类控件视为失败。在符合标准的浏览器中，客户端脚本可以动态切换控件的\
  \ `disabled/enabled` 状态。但请注意，某些浏览器的旧版本不支持此属性。此外，如果用户在浏览器中关闭了对客户端脚本的支持，你就无法依靠 `JavaScript`\
  \ 来替你禁用表单控件。\n\n在考虑到禁用控件的能力后，以下是判断表单提交时何为成功控件的基本规则：\n\n- 文本（text）、密码和 `textarea`\
  \ 控件始终是成功的，即使用户没有输入值。如果字段为空，则名称/值对中的值将是一个空字符串（\"\"\").）。\n\n- 在 `select` 菜单中，如果用户没有选择任何可用选项，则该菜单被视为失败，不会发送名称/值对。\n\
  \n- 对于复选框（checkbox）和单选按钮（radio buttons），浏览器只会向服务器发送选中项目的名称/值对。如果用户没有选择组中的任何单选按钮或复选框，浏览器将它们全部视为失败且不发送名称/值对。\n\
  \n- 文件字段始终是成功的，但如果用户没有实际选择文件要上传，浏览器通常会发送一个由字段名称和空字符串（\"\"”）组成的名称/值对。`PHP` 随后会将空字符串替换为字符串“none”，这样你就可以通过如下测试来检查是否上传了文件：\n\
  \n```php\nif ($file_field == “none”） { ... }\n```\n\n- 提交按钮（submit button）只有在具有\
  \ `name` 属性且被用户点击时才是成功的。\n\n- 重置按钮（Reset buttons）永远不会成功的。\n\n- `HTML` 规范并没有真正清楚如何处理推按钮（push-buttons），但浏览器制造商通常决定将它们视为成功的，除非它们被显式禁用。\n\
  \n## 利用 PHP 对表单的支持\n\n275\n\n`PHP` 对表单的支持是其最老的功能之一，而且并非巧合，它是最实用的功能之一。`PHP` 处理了将来自浏览器的\
  \ `GET` 和 `POST` 请求转换为你可以在 `PHP` 脚本中处理的变量所涉及几乎所有的脏活。为了说明这一点，让我们看看清单 9.2 中的简单表单。\n\
  \n### 清单 9.2：一个简单的表单 (baby-survey.html)\n\n```html\n<<html>\n<head><title>婴儿调查</title></head>\n\
  <body>\n<h1>告诉我们关于你的宝宝！</h1>\n<form action=”baby-survey-1-handler.php” method=”get”>\n\
  <p><label for=”f0”><<b>你宝宝的名字是什么？</b></label>\n<input type=\"\"text” name=\"\"name”\
  \ id=\"\"f0\"></p>\n<p><label for=\"\"f1”>你的宝宝是男是女？</label>\n<input type=\"\"radio”\
  \ name=\"\"sex” value=\"\"m” id=\"\"f1\">男\n<input type=\"\"radio” name=\"\"sex”\
  \ value=\"\"f” id=\"\"f2\">女</p>\n<p><label for=\"\"f3”>你的宝宝需要什么？</label>\n<input\
  \ type=\"\"checkbox” name=\"\"needs[]” value=\"\"stroller” id=\"\"f3\">推车\n<input\
  \ type=\"\"checkbox” name=\"\"needs[]” value=\"\"toys” id=\"\"f4\">玩具\n<input type=\"\
  \"checkbox” name=\"\"needs[]” value=\"\"food” id=\"\"f5\">食物</p>\n<p><label for=\"\
  \"f6”>上传宝宝的照片（文件大小不超过 500KB）：</label>\n<input type=\"\"file” name=\"\"needs[]” value=\"\
  \"f6” id=\"\"f6\"></p>\n<p><label for=\"\"f7”>请按 1 到 10 的标准给你的宝宝评分：</label>\n<select\
  \ name=\"\"rating” id=\"\"f7”>\n<option value=\"\"1”>1</option>\n<option value=\"\
  \"2”>2</option>\n<option value=\"\"3”>3</option>\n<option value=\"\"4”>4</option>\n\
  <option value=\"\"5”>5</option>\n<option value=\"\"6”>6</option>\n<option value=\"\
  \"7”>7</option>\n<option value=\"\"8”>8</option>\n<option value=\"\"9”>9</option>\n\
  <option value=\"\"10”>10</option>\n</select></p>\n<p><label for=\"\"f8”>你的宝宝喜欢喝什么？</label>\n\
  <select multiple name=\"\"drinks[]” id=\"\"f8”>\n<option value=\"\"juice”>果汁</option>\n\
  <option value=\"\"milk”>牛奶</option>\n<option value=\"\"water”>水</option>\n<option\
  \ value=\"\"rum_punch”>朗酒汽</option>\n</select></p>\n<p><input type=\"\"submit” name=\"\
  \"s” value=\"\"提交” /></p>\n</form>\n</body>\n</html>\n```\n\n276\n\n当用户将此表单提交到标签\
  \ `action` 属性中指定的 URL 时，`PHP` 会自动创建包含用户输入/选择值的变量。对于名称以 `[]`（两个方括号）结尾的表单控件，`PHP`\
  \ 创建数组变量；对于其他所有控件，它创建一个标量（单值）变量。这些值和变量可以通过几种方式获取：\n\n- 如果 `PHP` 配置为在全局作用域内“注册”变量，那么清单\
  \ 9.2 中的用户值将存储在以下全局变量中：**变量**\n\n**类型**\n\n*$name*\n\n标量\n\n*$sex*\n\n标量\n\n*$needs*\n\
  \n数组\n\n*$rating*\n\n标量\n\n*$drinks*\n\n数组\n\n*提示：我们将在本章后面的“配置选项”部分进一步讨论注册全局变量的主题*\n\
  \n- 如果 `PHP` 没有配置为注册全局变量，但被配置为“跟踪”表单变量，那么这些值将作为全局数组 `$_GET` 的以下元素可用：**数组元素**\n\n\
  **类型**\n\n*$_GET['name']**\n\n标量\n\n*$_GET['sex']**\n\n标量\n\n*$_GET['needs']**\n\
  \n数组\n\n*$_GET['rating']**\n\n标量\n\n*$_GET['drinks']**\n\n数组\n\n- 如果表单使用 `POST`\
  \ 提交，则变量将通过 `$_POST` 数组访问，其工作方式与上述列表中的 `$_GET` 数组相同。\n\n277\n\n\n\n\n让我们来看一个处理脚本（列表\
  \ 9.3），它确保用户输入了我们所需的所有数据，然后将结果追加到一个简单的制表符分隔文件中。\n\n**列表 9.3: 一个简单的表单处理脚本 (baby-survey-handler.php)**\n\
  \n```php\n<?php\n\n// 我们将任何错误信息存储在这里处\n\n$errors = array();\n\n// 确保他们输入了姓名、性别和评分\
  \ ...\n\nif (empty ($name))\n$errors[] = “You didn’t enter your baby’s name.”;\n\
  \nif (!isset ($sex))\n$errors[] = “You didn’t enter your baby’s sex.”;\n\nif (!isset\
  \ ($rating))\n$errors[] = “Please rate your baby.”;\n\n// 确保他们没有给宝宝喝朗姆酒\n\nif (is_array\
  \ ($drinks)) {\n$ndrinks = count ($drinks);\nfor ($i = 0; $i < $ndrinks; $i++)\n\
  if ($drinks[$i] == “rum_punch”)\n$errors[] = “You can’t feed rum punch to a baby!”;\n\
  }\n\n// 如果有错误，则打印错误页面并退出\n\n$nerrors = count ($errors);\nif ($nerrors > 0) {\nprint\
  \ (“<html><head><title>Error</title></head>\n<body><p>There were problems with your\
  \ form. Please go back to the previous page and correct the following errors:</p><ul>”);\
  \ for ($i = 0; $i < $nerrors; $i++)\nprint (“<li>” . $errors[$i] . “</li>\\n”);\n\
  print (“</ul>\\n</body>\\n</html>”);\nexit;\n}\n\n// 如果我们到达这里，格式化数据并追加到我们的数据文件中\n\
  \n$need_list = “”;\n$drink_list = “”;\n\nif (is_array ($needs))\n$need_list = join\
  \ (“, “, $needs);\n\nif (is_array ($drinks))\n$drink_list = join (“, “, $drinks);\n\
  $name = str_replace (“\\t”, “ “, $name);\n$sex = str_replace (“\\t”, “ “, $sex);\n\
  $rating = str_replace (“\\t”, “ “, $rating);\n\n$need_list = str_replace (“\\t”,\
  \ “ “, $need_list);\n$drink_list = str_replace (“\\t”, “ “, $drink_list);\n\n//\
  \ 将数据写入文件\n\n$datafile = “/tmp/baby_info_datafile”;\n$fp = fopen ($datafile, “a”);\n\
  if ($fp == false)\ndie (“Can’t open data file ‘$datafile’.\\n”);\nfwrite ($fp, $name\
  \ . “\\t” . $sex . “\\t” . $rating . “\\t” . $need_list\n. “\\t” . $drink_list .\
  \ “\\n”);\nfclose ($fp);\n?>\n\n<html\n<head><title>Thank you!</title></head>\n\
  <body><p>Thanks for taking our survey!</p></body>\n</html>\n```\n\n278\n\n首先，脚本创建一个数组来存储错误信息，并检查是否有有效的用户输入可以处理。如果它到达了\
  \ `$need_list` 声明处，说明没有错误，于是我们格式化数据。我们将数组转换为逗号分隔的列表，使得 `['a’, ‘b’, ‘c’]` 简单变为 ‘a,\
  \ b, c’。然后，因为我们在文件中中使用制表符来分隔值，我们删除了用户可能输入的任何制表符。最后，脚本将输入追加到我们的数据文件中。\n\n我们承认这个表单有点幼稚（更不用说难看了），但它确实说明了用\
  \ PHP 处理传入表单数据的基础，而且显而易见，你可以使用类似的方法来完成更有用的任务。通过稍微修改，你可以用它来构建用于读者调查的基本数据输入表单、在线购物车、错误报告系统或公告板。\n\
  \n### 配置选项\n\n有几个配置选项允许你调整 PHP 在处理传入的表单数据时的行为。在 PHP 的默认安装中（截至 4.0.6 版本），PHP 使用以下配置指令：\n\
  \n`variables_order = ‘EGPCS’`\n`register_globals = Off`\n`track_vars = On`\n`magic_quotes_gpc\
  \ = On`\n`magic_quotes_runtime = Off`\n`magic_quotes_Sybase = Off`\n`post_max_size\
  \ = 8M`\n\n在这些选项中，最重要的是 `variables_order`、`register_globals` 和 `track_vars`。让我们详细查看这三个，然后简要介绍其他的。\n\
  \n*注意*\n\n*有关关于 PHP 配置文件的更多信息，请参见附录 B，“完整配置选项”。*\n\n#### 利用 PHP 对表单的支持\n\n#### variables_order\n\
  \n`variables_order` 选项允许你指定一个列表，让 PHP 从从中自动创建变量。EGPCS 代表环境（environment）、GET、POST、cookie、服务器（server）；这些中的每一项都是传入数据的潜在来源，可能会被你的\
  \ PHP 脚本使用。对于表单而言，重要的值只有 “G” 和 “P”。\n\n为了让使用 GET 和 POST 方法发送的传入数据能够被你的 PHP 脚本使用，“G”\
  \ 和 “P” 必须出现在 `variables_order` 选项中。\n\n为了让使用 GET 和 POST 方法发送的传入数据对你的 PHP 脚本可用，只有当你也开启了\
  \ `register_globals` 时，`variables_order` 选项中字母的顺序才是重要的。\n\n#### register_globals\n\
  \n`register_globals` 选项告诉 PHP 从环境变量、GET 数据、cookie 数据、服务器变量列表中创建全局变量，这些变量是列在 `variables_order`\
  \ 选项中的。\n\n这对你的表单意味着，如果 `register_globals` 开启，与表单控件同名的全局变量将为你创建。因此，如果用户在名为 `imaginary_friend`\
  \ 的文本框中输入 “Prince Fansfo”，PHP 将自动创建 `$imaginary_friend`。\n\n但是有一个问题。如果 `variables_order`\
  \ 列表中后面出现的另一个源包含相同名称的/值对，那么 PHP 将覆盖旧值。考虑以下表单：\n\n```html\n<form method=”POST” action=”foo.php?imaginary_friend=Prince+Fansfo”>\n\
  \  输入朋友的名字：\n  <input type=\"text” name=\"imaginary_friend” />\n  <input type=\"\
  submit” />\n</form>\n```\n\n如果 `variables_order` 的值为 “GP”且 `register_globals` 已开启，那么当提交表单时，PHP\
  \ 将自动执行以下操作：\n\n1. PHP 将创建一个全局变量 `$imaginary_friend` 并将其值设置为 “Prince Fansfo”，因为我们在表单标签的\
  \ action 属性中附加了这些伪造的表单数据。\n2. PHP 将用用户在 imaginary\\_friend 文本框中输入的任何内容覆盖 `$imaginary_friend`\
  \ 的值。\n\n显然，你不会经常写这样的表单。然而，考虑一下如果 `variables_order` 的值为 “GPC”，并且在你 Web 应用程序的其他地方，访问者的浏览器设置了一个名为\
  \ `imaginary_friend` 的 cookie 会发生什么。PHP 将用 cookie 的值覆盖 `$imaginary_friend` 变量，用户的输入将丢失（至少从全局变量的角度来看）。好吧，不太可能有两个变量名为\
  \ imaginary\\_friend。但 `date` 呢？或者 `order\\_qty` 呢？\n\n如果 `variables_order` 被设置为\
  \ “GPCS”，并且由于极其糟糕但绝不可想象的运气，你为文本字段选择的名称与某个服务器内置变量的名称匹配，同样不幸的情况就会发生。\n\n\n\n\n\n最后，还有“无用垃圾”问题。通过开启\
  \ `register_globals` 功能，你会在不需要的情况下向全局命名空间——这个命名空间本应该保持尽可能整洁——充入那些根本不需要存在那里的变量。这真的是一个问题吗？不一定，但这种做法很粗率，因此更有可能在未来导致\
  \ Bug。\n\n这一切都指向一个结论：使用 `register_globals` 不是一个非常好主意，而编写依赖 `register_globals` 来始终“做正确的事”的\
  \ PHP 脚本则更糟糕。幸运的是，有一个解决方案；它被称为 `track_vars`。\n\n### track_vars\n\n`php.ini` 文件中的\
  \ `track_vars` 配置选项有点是一个遗留；从 PHP 4.0.3 开始，该功能始终是开启的。它的原始用途是告诉 PHP 自动创建全局数组，用于存储来自服务器环境变量、任何\
  \ `GET` 和 `POST` 请求、存储在访问者浏览器中的 cookie 以及服务器变量的数据。表 9.1 列出了通过这种方式创建的变量名。这些变量是“特殊”全局变量，因为它们在*任何*作用域内都是全局的——你可以在用户定义的函数和类内部访问它们，而无需使用\
  \ `global` 关键字将它们声明为全局。（关于 PHP 中变量作用域的更多信息，请参见第 4 章“控制流与函数”。）\n\n**表 9.1：由 track_vars\
  \ 功能创建的变量**\n\n| 变量 |  |\n| :--- | :--- |\n| `$_ENV` | 服务器环境变量中的变量 |\n| `$_GET`\
  \ | 通过 `GET` 传递给脚本的数据创建的变量 |\n| `$_POST` | 通过 `POST` 传递给脚本的数据创建的变量 |\n| `$_COOKIE`\
  \ | 从任何 HTTP Cookie 头部数据创建的变量 |\n| `$_SERVER` | 服务器内置变量 |\n\n*注意*\n\n在 PHP 4.1 版本之前，PHP\
  \ 使用全局变量 `$HTTP_ENV_VARS`、 `$HTTP_GET_VARS`、 `$HTTP_POST_VARS`、 `$HTTP_COOKIE_VARS`\
  \ 和 `$HTTP_SERVER_VARS`。这些变量在任何作用域内都不会自动变为可用。\n\n如果你使用这些特殊用途变量（而不是依赖 `register_globals`\
  \ 创建的通用且不可靠的全局变量），你将始终知道你的变量包含了你预期的值。而且你会知道，每当表单提交时，恰好*一个*新的全局变量会被表单数据填充——不是 `$_GET`\
  \ 就是 `$_POST`。\n\n例如，列表 9.4 显示了我们如何重写列表 9.3 中的表单处理脚本，使其更加可靠。\n\n**列表 9.4：更可靠的表单处理脚本\
  \ (baby-survey-handler-new.php)**\n\n```php\n<?php\n\n$errors = array();\n\nif (empty\
  \ ($_GET['name'])) {\n    $errors[] = “你没有输入婴儿的名字。”\n}\n\nif (!isset ($_GET['sex']))\
  \ {\n    $errors[] = “你没有输入婴儿的性别。”\n}\n\nif (!isset($_GET['rating'])) {\n    $errors[]\
  \ = “请给你的婴儿评分。”\n}\n\nif (is_array ($_GET['drinks'])) {\n    $ndrinks = count ($_GET['drinks']);\n\
  \    for ($i = 0; $i < $ndrinks; $i++) {\n        if ($_GET['drinks'][$i] == “rum_punch”)\
  \ {\n            $errors[] = “你不能给婴儿喂朗姆酒！”\n        }\n    }\n}\n\n$nerrors = count\
  \ ($errors);\nif ($nerrors > 0) {\n    print (“<html><head><title>错误</title></head>\n\
  \    <body><p>您的表单出现了问题。请返回上一页并修正以下错误：</p>\n    <ul>”);\n    for ($i = 0; $i < $nerrors;\
  \ $i++) {\n        print (“<li>” . $errors[$i] . “</li>”);\n    }\n    print (“</ul></body></html>”);\n\
  } else {\n    // 成功逻辑...\n}\n?>\n```\n\n### 利用 PHP 对表单的支持\n\n**281**\n\n*注意*\n\n\
  在 PHP 4.1 版本之前，PHP 使用全局变量 `$HTTP_ENV_VARS`、 `$HTTP_GET_VARS`、 `$HTTP_POST_VARS`、\
  \ `$HTTP_COOKIE_VARS` 和 `$HTTP_SERVER_VARS`。这些变量在任何作用域内都不会自动变为可用。\n\n如果你使用这些特殊用途变量（而不是依赖\
  \ `register_globals` 创建的通用且不可靠的全局变量），你将始终知道你的变量包含了你预期的值。而且你会知道，每当表单提交时，恰好*一个*新的全局变量会被表单数据填充——不是\
  \ `$_GET` 就是 `$_POST`。\n\n例如，列表 9.4 显示了我们如何重写列表 9.3 中的表单处理脚本，使其更加可靠。\n\n### SQL\
  \ 与用户交互\n\n**282**\n\n当你从用户那里获取数据时，必须小心。Web 应用中最常见的漏洞是 SQL 注入。这发生在你直接将用户输入插入到 SQL\
  \ 查询字符串中时。\n\n```php\n$query = \"SELECT * FROM users WHERE username = '\" . $_GET['user']\
  \ . \"\";\n```\n\n上面的示例是危险的。为什么？\n\n要理解如何防止 SQL 注入，我们需要了解 SQL 查询是如何工作的。查询是你发送给数据库的命令字符串。数据库引擎解析该字符串并确定执行命令的最佳方式。\n\
  \n当你将用户输入拼接到查询字符串时，你实际上是在允许用户更改命令本身。例如，如果用户在用户名处输入 `' OR '1'='1`，查询将变为：\n\n```sql\n\
  SELECT * FROM users WHERE username = '' OR '1'='1';\n```\n\n该查询将返回 `users` 表中的所有行，因为\
  \ `'1'='1'` 永远为真。\n\n为了防止这种情况，你应该使用预语句（Prepared Statements）。预语句允许你先定义查询结构，然后单独发送数据。数据库引擎会将数据严格视为数据，而不是可执行的代码。\n\
  \n```php\n$stmt = $pdo->prepare(\"SELECT * FROM users WHERE username = ?\");\n$stmt->execute([$_GET['user']]);\n\
  $user = $stmt->fetch();\n```\n\n通过使用预语句，用户无法更改查询结构。这是 PHP 中防止 SQL 注入的金金标准。\n\n\n\
  \n\n\n\n为表单添加文件上传控件，你只需要确保表单标签的 `method` 和 `enctype` 属性分别设置为“POST”和“multipart/form-data”，然后在表单中添加以下\
  \ HTML 即可：\n\n```html\n<input=”file” name=”file1” />\n```\n\n浏览器将显示一个看起来类似于文本字段的内容，旁边带有一个标记为“浏览”（Browse）或“选择文件”（Choose\
  \ File）的按钮，如图 9.3 所示。点击该按钮将打开浏览器的标准对话框，用于定位本地文件（如图 9.4 所示）。\n\n用户只需定位文件并点击确定。当他们点击提交按钮时，浏览器会将文件以及有关文件的信息（最重要的是文件的原始文件名和内容类型）发送到服务器。\n\
  \n在用户表单数据中检测到文件时，PHP 会自动从上传的数据中提取文件并将其存储在服务器上的临时位置。（该位置实际上是由 `php.ini` 配置文件中的 `upload_file_dir`\
  \ 选项决定的。）PHP 还会创建几个变量，允许你的脚本处理已上传的文件。如果你将表单字段命名为 `file1`，PHP 将创建表 9.3 所示的变量。注意，只有当你在配置文件中开启了\
  \ `register_globals` 选项时，才会创建全局变量，且只有当你开启了 `track_vars` 选项时，才会创建 `$HTTP_POST_FILES`\
  \ 元素；更多信息请参见上一节“配置选项”。\n\n**图 9.3**\n一个包含文件上传字段的表单\n\n**图 9.4**\nInternet Explorer\
  \ 中的选择文件对话框\n\n**利用 PHP 对表单的支持**\n\n**表 9.3：PHP 为上传的文件创建的变量**\n\n| 描述 | 变量 |\n|\
  \ :--- | :--- |\n| 文件在服务器上的位置 | `$file1`, `$HTTP_POST_FILES['file1']['tmp_name']`\
  \ |\n| 用户计算机上文件的原始名称 | `$file1_name`, `$HTTP_POST_FILES['file1']['name']` |\n| 文件大小\
  \ | `$file1_size`, `$HTTP_POST_FILES['file1']['size']` |\n| 如果可用，文件类型 | `$file1_type`,\
  \ `$HTTP_POST_FILES['file1']['type']` |\n\n*注：在 PHP 4 之前，变量是作为 `$HTTP_POST_VARS`\
  \ 数组中名为 `file1`、`file1_name`、`file1_size` 和 `file1_type` 的元素创建的。*\n\n在处理表单的 PHP\
  \ 脚本中，你必须将文件移动到永久位置；这一点在所示所示。当你的 PHP 脚本结束时，临时文件将被自动删除。注意，Web 服务器必须具有写入永久位置的权限。\n\
  \n列表 9.5：处理文件上传的简单脚本 (upload-handler.php)\n\n```php\n<?php\n// 测试确保我们得到了文件\nif(!is_array\
  \ ($HTTP_POST_FILES['file1'])) {\n    print ('<html><body>你没有上传文件</</body>></html>');\
  \ exit;\n}\n\n// 如果我们到了这里，说明我们确实得到了东西\n$f =& $HTTP_POST_FILES['file1']; // 简化输入\n\
  $dest_dir = ‘uploads’;\n$dest = $dest_dir . '/' . $f['name'];\n\n// 确保我们确实可以将文件放在它应该去的地方\n\
  if (!is_uploaded_file ($f['tmp_name'])) {\n    print (‘<html><body>错误：未上传文件。</body></html>);\
  \ exit;\n}\n\nif (!file_exists ($dest_dir)) {\n    print (‘<html><body>错误：目标目录 “‘\
  \ . $dest_dir . “ 不存在!</body></html>’);\n    exit;\n}\n\nif (!is_dir ($dest_dir))\
  \ {\n    print (‘<html><body>错误：目标目录 “‘ . $dest_dir . “不是一个目录!</body></html>’);\n\
  \    exit;\n}\n\nif (file_exists ($dest)) {\n    print (‘<html><body>错误：文件 “‘ .\
  \ $dest . “已存在!</body></html>’);\n    exit;\n}\n\n// 全部就绪，将文件移动到永久位置\n$r = move_uploaded_file\
  \ ($f['tmp_name'], $dest);\nif ($r == false) {\n    // 发生了某些问题\n    print (‘<html><body>错误：无法将文件复制到\
  \ “‘ . $dest . “。</body></html>’);\n    exit;\n}\n?>\n<html>\n<body>\n    <p>您的文件已上传到\
  \ <?php print ($dest); ?>。</p>\n    <p>点击 <a href=”<?php print ($dest); ?>”>这里</a>\
  \ 来访问该文件。</p>\n</body>\n</html>\n```\n\n\n\n\n一次显示所有错误。\n\n2.\n\n当一个字段是必填项时，要使其*极其清晰*。\n\
  \n3.\n\n不要在单独的页面显示错误信息，而是重新显示表单并在页面顶部打印错误信息。\n\n![Image 44](img/index-313.png)\n\
  \n288\n\n4.\n\n使用视觉提示标记包含错误的字段。\n\n5.\n\n使用 JavaScript 在用户输入发送到服务器之前对其进行验证……但不要依赖它。\n\
  \n### 一次显示所有错误\n\nListing 9.3（本章前面的）中的代码演示了这种方法：遍历表单中的每个字段，检查用户数据是否正确，并在发现任何错误时向\
  \ `$errors` 数组中添加错误信息。许多应用程序并没有这样做；相反，一旦检测到任何错误就会停止处理并打印错误消息，这迫使用户一个地提交表单并修正错误。更好的做法是检查用户的*所有*输入并告诉他们哪里出错了。\n\
  \n### 使必填项清晰\n\n许多网站使用星号来指示用户*必须*在该字段输入数据，并在表单顶部附带类似“带有星号的字段为必填”的消息。其他网站则用**粗体**标记必填字段，并显示类似“必填字段已**加粗**”的消息。\n\
  \n### 在页面显示错误消息\n\n在之前的示例中，我们通过打印带有错误列表的空白页面来响应用户错误。Listing 9.6 是使用这种技术的简单登录 PHP\
  \ 脚本；注意表单和 PHP 代码位于同一个文件中；表单的 `action` 属性设置为脚本的 URL。此外，当出现错误时，我们使用用户输入的信息来填充字段。\n\
  \n**图 5**\n\n显示错误信息的表单\n\n设计易用界面\n\n289\n\n**列表 9.6：显示错误消息并保留用户输入 (login.php)**\n\
  \n```php\n<?php\n\nfunction validate_user ($username, $password) // 存根\nreturn true;\n\
  }\n\n// 创建空数组存储错误消息\n$errors = array();\n$p =& $_POST; // 保存输入\n\n// 检查是否有用户输入需要处理\n\
  if (count ($p) > 0)\n{\n    // 检查用户名和密码是否设置\n    // 并确认它们包含正确类型的字符\n    if (!isset\
  \ ($p['username']) || (trim ($p['username']) == '')) {\n        $errors[] = '必须输入用户名。\n\
  \    }\n    elseif ((strlen ($p['username']) < 8) || (ereg ('[^a-zA-Z0-9]', $p['username'])))\
  \ {\n        $errors[] = '输入的用户名无效。用户名至少要有 8 个字符，且只能包含字母和数字。';\n    }\n    if (!isset\
  \ ($p['password']) || (trim ($p['password']) == '')) {\n        $errors[] = '必须输入密码。';\n\
  \    }\n    elseif ((strlen ($p['password']) < 8) || (ereg ('[^[:alnum:][:punct:][space:]]',\
  \ $p['password']))) {\n        $errors[] = '输入的密码无效。密码至少要有 8 个字符，且只能包含字母、数字、标符号和空格。';\n\
  \    }\n    if (count ($errors) == 0)\n    {\n        // 目前没有错误，尝试登录\n        $r\
  \ = validate_user ($p['username'], $p['password']);\n        // 如果失败了，那就是另一个错误\n\
  \        if ($r == false)\n            $errors[] = '登录失败。未找到用户名/密码。';\n        //\
  \ 否则，完成验证过程并退出\n        //（通常情况下，我们在这里执行一些有意义的操作）\n        else\n        {\n   \
  \         print ('<html><head><title>恭喜</title></head>\n            <body><h1>恭喜！</h1><p>你已登录！</p>\n\
  \            </body></html>');\n            exit;\n        }\n    }\n}\n/* 如果我们到达这里，要么用户输入有错误，要么用户第一次加载此页面\
  \ */\n?>\n\n<html>\n<head><title>登录表单</title></head>\n<body>\n<h1>登录表单</h1>\n<?php\n\
  // 如果有任何需要报告的错误，在这里显示\nif (count ($errors) > 0)\n{\n    $n = count ($errors);\n\
  \    for ($i = 0; $i < $n; $i++)\n        print '<br /><font color=\"red\">' . $errors[$i]\
  \ . '</font>';\n}\n?>\n<form action=\"<?php print ($PHP_SELF); ?>\" method=\"POST\"\
  >\n<table>\n    <tr><td>用户名：</td>\n    <td><input type=\"text\" name=\"username\"\
  \n    value=\"<?php if (isset($p['username'])) echo htmlspecialchars($p['username']);\
  \ ?>\"></td></tr>\n    <tr><td>密码：</td>\n    <td><input type=\"password\" name=\"\
  password\"\n    value=\"<?php if (isset($p['password'])) echo htmlspecialchars($p['password']);\
  \ ?>\"></td></tr>\n    <tr><td></td>\n    <td><input type=\"submit\" value=\"登录\"\
  ></td></tr>\n</table>\n</form>\n</body>\n</html>\n```\n\n\n\n我们随后通过为提交按钮添加一个 `onclick`\
  \ 属性来修改 HTML，该属性告诉浏览器在点击按钮时执行 `check_req_fields()` 函数，结果如下：\n\n```html\n<input type=\"\
  submit\" name=\"submit\" onclick=\"javascript: return check_req_fields()\" />\n\
  ```\n\n这里的诀窍在于了解关于启用 JavaScript 的浏览器行为的一条冷门规则：如果作为元素 `onclick` 属性值的表达式评估结果为 `False`（假），那么当该元素被激活时，与元素相关的正常操作就不会发生。（不幸的是，仅仅编写\
  \ `javascript: check_req_fields();` 是不够的；我们必须使用 `return` 关键字来显式地返回 `check_req_fields()`\
  \ 返回的 `False` 值。）提示\n\n*你可以使用同样的技巧来尝试阻止浏览器跟随超链接。*\n\n但请记住，除非你被赋予了全知之能，并且百分之百确定每一位访问你网站的访客都将使用启用\
  \ JavaScript 的浏览器，否则你不能仅仅依靠 JavaScript 来完成错误检查。（毕竟，我们中的一些工作在企业环境中，无法选择浏览器的配置——而且这些配置通常是由那些比什么都喜欢禁用此类功能的偏执系统管理员完成的。）在\
  \ JavaScript 无处不在的快乐日子到来之前，你必须在 PHP 脚本中也测试所有的用户输入。\n\n## 获取用户反馈\n\n这是 Web 应用设计的一个基本方面，但太多的网站没有给予足够的考虑。由于互联网作为应用环境具有分布式且往往不可靠的特性，Web\
  \ 应用在用户与网站交互时，需要向用户提供清晰、有意义的反馈。\n\n这不仅仅是编写我们刚刚讨论过的易于理解的错误信息那么简单。要获得真正有意义的用户反馈，你必须费心让用户确切知道点击“提交”时发生了什么。\n\
  \n例如，假设你正在为一个网站构建一个公告板系统（BBS）。当用户想在 BBS 发布消息时，他们点击一个跳转到数据输入表单的链接。当他们在文本字段中输入数据并点击提交按钮时，会发生什么？\n\
  \n### 设计易用的界面\n\n不幸的是，答案通常是：谁知道呢？在某些网站上，用户的浏览器被直接重定向回公告板。希望他们能够在其他人帖子列表的底部（还是顶部？）找到自己的帖子，并由自己验证它已被接受。在另一些网站上，他们将看到一条只写着“谢谢！”的消息，没有提供任何进一步的信息。最糟糕的网站会将用户重定向到某些完全无关的页面，让他们怀疑公告板是否在运行。\n\
  \n一个更有意义的用户界面会明确说明用户的消息已被接收并添加到公告板中。它可以将帖子的文本回显给用户，并提供一个指向页面的链接，让他们在那里编辑以纠正任何拼写错误。它还可以提供一个返回公告板的链接，使用\
  \ HTML 锚点，这样浏览器窗口会自动滚动到他们的新帖子，让他们可以带着自豪和满意的心情进行。\n\n同样的方法也适用于允许用户上传文件的表单。不要只告诉他们“您的文件已上传。谢谢。”如果他们正在上传图片文件，使用\
  \ `img` 标签实际*显示*出图片。如果是其他类型的文件，请打印该文件的链接，以便他们尝试下载（以确保它完整地到达了那里）。允许你订阅或取消邮件列表的表单也是如此；你不能只告诉用户“您的请求已收到”。你需要清晰地告诉他们请求是成功还是失败了，以及*如何*结果——类似于“电子邮件地址\
  \ foo@example.com 已从‘内华达州星际迷粉丝俱乐部新闻’邮件列表中移除。”\n\n这一切的意义在于：让你的用户放心，你的网站已经完成了它声称要做的事。因为\
  \ Web 往往比桌面应用程序遇到更多的可靠性问题，许多用户对点击提交按钮感到焦虑，担心他们的数据是否真的能到达最终目的地。通过说明并显示一切顺利完成，你将让他们对点击该按钮感到高兴。\n\
  \n## 基础设计技术\n\n易于阅读的表单更容易使用。虽然 Web 设计不是本章（或本书）的重点，但有几种技术你应该使用，以让你的表单更可靠。\n\n- 使用表格将表单控件和标签对齐成一个简单、逻辑清晰的网格。图\
  \ 9.3 中的表单说明了这种技术。\n- 对于位于表单控件左侧单元格中的任何标签，进行右对齐。同样，你可以在图 9.3 左侧的标签列看到这一点。\n- 除非你非常确定表单需要一个重置按钮，否则不要使用。因为浏览器倾向于渲染渲染重置按钮和提交按钮，用户很容易产生困惑并点错按钮，导致他们的所有数据丢失。\n\
  - 在可能的情况下，使用复选框而不是多值选择菜单，允许用户从选项菜单中做出多个选择。复选框更清楚地表明用户可以选择多个选项。而且与菜单不同，它们不需要你编写解释性文本，例如“根据需要选择任意选项。要进行多项选择，请按住\
  \ Windows 上的 Ctrl 键或 Macintosh 上的 Command 键。”\n\n## 第 9 章：表单与用户交互\n\n- 将极长的表单拆分为多页向导器。这需要在你的\
  \ PHP 中构建一些额外的逻辑，但凭借 PHP 对会话的支持，这并不难实现。（甚至更好，给你的用户在一个长表单和三个短表单之间进行选择。）\n- 添加在线帮助链接。如果你使用的控件可能会让用户困惑，或者你认为他们想要更多信息，请添加一个小链接打开一个包含描述文本的弹出窗口。例如，如果你的在线商店有多种配送选项，你可以在菜单旁边添加一个“更多信息”链接，为用户提供详细说明每个选项的窗口。\n\
  \n许多设计建议可以在其他书籍和网上找到。一个地方是 Jakob Nielsen 的 useit.com 网站。免费订阅他关于 Web 设计的坦诚且通常幽默的“Alertbox”专栏；注册页面在\
  \ httpuseit.com/alertbox/。\n\n### 保存和编辑数据\n\n一旦你从表单接收了用户输入，你就需要对其进行处理。大多数情况下，你需要将信息写入某种持久存储中。虽然你可以使用文件，但许多（如果不是大多数）数据处理应用程序最适合使用数据库保存用户输入的永久记录。\n\
  \n我们在第 8 章“SQL 与数据库交互”中讨论了数据库设计以及插入、删除和更新数据库记录的基础。在这里我们将运行一个将表单用户输入存储到数据库的示例。表单的\
  \ HTML 和处理表单内容的 PHP 代码包含在一个文件中；表单的 action 属性被设置为 `$PHP_SELF`。（内置变量 `$PHP_SELF` 始终包含当前脚本的\
  \ URL。）稍后，我们将查看允许用户编辑已创建记录的表单。\n\n\n\n\n以下代码使用了内置函数来访问 PostgreSQL 数据库。通过少量修改，你可以将其适配到几乎任何其他符合\
  \ SQL 标准的数据库。\n\n## 向数据库插入数据\n\n我们为应用程序构建的第一个表单是注册表单，如图 9.6 所示。\n\n注册表单非常简单。我们只是要求用户输入其姓和名、选择用户名和密码，如果他们想使用\
  \ cookie 在浏览器中存储用户名和密码，则勾选复选框（这样他们每次返回网站时就无需重新登录）。当用户点击 `Submit` 时，我们会进行一些基础清理工作，以确保用户输入中没有恶意内容，然后检查数据库\
  \ `USERS` 表中是否已经有相同用户名的用户。\n\n如果他们选择的用户名通过了唯一性测试，我们就会从 `users_userid_seq` 序列中获取下一个用户\
  \ ID，并用它为用户创建一个记录。\n\n`USERS` 表由六列组成，如表 9.4 所示。\n\n![Image 45](img/index-320_1.png)\n\
  \n**图 9.6** 注册表单\n\n**表 9.4:** 简化的 USERS 表\n\n| 列名 | 数据类型 |\n| :--- | :--- |\n|\
  \ userid | Integer |\n| firstname | Varchar |\n| lastname | Varchar |\n| username\
  \ | Varchar |\n| password | Varchar |\n| auth_cookie | Char(1), default ‘y’ |\n\n\
  > **警告**：为了保持代码简洁明了，这些示例中的代码没有包含完整的检查，以确保用户提交的数据是“安全的”。有关如何对表单数据进行安全检查的更多信息，请参阅第\
  \ 10 章“数据验证”。\n\n正如从列表 9.7 的代码所示，大部分工作仍然是错误检查，尽管在这种情况下我们实际上是了数据库来执行部分这些检查。\n\n##\
  \ 列表 9.7：生成和处理注册表单 (signup.php)\n\n```php\n<?php\n\nfunction flag_error ($fieldname,\
  \ $errstr)\n{\n    global $fields_with_errors, $errors;\n    $fields_with_errors[$fieldname]\
