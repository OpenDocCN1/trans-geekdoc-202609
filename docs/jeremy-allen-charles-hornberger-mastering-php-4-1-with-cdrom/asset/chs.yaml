  \n首先，我们需要为类中的方法确定一些标准的命名规范。方法将分为类型——一类是简单测试数据有效性的方法，另一类是实际上修改数据以使其符合某些要求的方法。对于执行简单有效性测试的方法，我们将使用像\
  \ `is_something()` 这样的名称，其中 `something` 是我们期望匹配的数据类型。例如，测试字符串看起来像不像一个有效的美国电话号码的方法可以命名为\
  \ `is_us_tel()`。对于实际上修改数据的方法，我们将使用主动动词作为名称。因此，一个删除字符串中所有开头和结尾空格并将多个空格压缩为单个空格的函数可以称为\
  \ `compress_whitespace()`。\n\n其次，我们需要确定一种返回有效性测试结果的标准方法。我们将简单地使用 `True` 和 `False`\
  \ 来表示有效性测试的成功或失败。因此，为了测试电话号码，我们可能会使用：\n\n```php\n$tel = $HTTP_POST_VARS['tel'];\n\
