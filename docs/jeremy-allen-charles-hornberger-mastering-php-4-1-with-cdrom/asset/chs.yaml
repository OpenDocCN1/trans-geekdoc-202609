  \ 649\n\n\n\n\n*本页特意留白*\n\n引言\n\n回到大约十年前：世界维网还处于婴儿阶段。当时的 Web 是一个为了共享信息而创建的完全静态的世界，读者没有真正的办法与网站进行交互。如果内容需要更新，则需要内容创建者的直接参与。我们现在所处的计算机革命当时并未清晰地成为日常生活的一部分。\n\
  \n今天，世界似乎充斥着触手可及的信息。互联网是一股巨大的经济力量——一个动态且充满活的地方，充满了多媒体内容，且缩写词远超人们所能理解的范围。程序员们现在有大量的编程语言可供选择。\n\
  \n欢迎使用 PHP，这是一种嵌入 HTML 的脚本语言。PHP 是一种既易用又非常强大的语言。PHP 融合了现代语言的一些优秀特性，为编写 Web 应用程序创造了一种独特且新颖的方法。PHP\
  \ 是解决你问题的正确工具吗？如果你正在开发 Web 应用程序，那么答案是肯定的。虽然有很多语言可用，但 PHP 从设计之初就考虑了 Web 开发。所有这些因素共同使得\
  \ PHP 变得非常整洁且易于使用，这种语言允许人们以最少的麻烦开发出应用程序。虽然良好的设计和适当的管理对于开发高质量软件至关重要，但正确的工具也同样重要；在\
  \ Web 开发方面，PHP 脱颖而出。\n\n动态的、数据驱动的应用程序和网站已成为实现广泛商业和通信的一种非常重要方式。PHP 是免费的，并运行在几乎所有流行的硬件平台上。将\
  \ PHP 与丰富的开源关系型数据库管理系统（RDBMS，如 MySQL、PostgreSQL 或 Interbase）相结合，你就拥有了一个强大且完全免费的开发平台。为了让一切变得更好，所有应用程序的“内部”——即源代码——也是公开的。而且\
  \ PHP 可以从个人项目扩展到极高并发的应用程序。\n\n**PHP 的发展**\n\n\n\n\n\n在 1994 年，万维网（WWW）仍处于原始状态。当时用于生成动态内容和数据驱动应用的服务器端脚本语言及工具非常少，且现有的工具充其量只是简陋。对于任何尝试为网站添加动态内容的人来说，对灵活的服务器端脚本语言的需求显而易见。`PHP`\
  \ 的原始作者 Rasmus Lerdorf 设计 `PHP`（代表 Personal Home Pages，即个人主页）是一小组 Perl 脚本，用于收集查看他简历的人的数据。初始版本可以看作是一组黑客为另一个黑客编写的简单编程工具，用于让网站更具实用性和交互性的杂务工作。\n\
  \n## xx\n\n### 引言\n\n1995 年左右，一个版本的 `PHP` 公开发发布。在拼凑了一个用于解释 HTML 表单数据的工具（称为 `FI`）之后，`PHP/FI`\
  \ 应生了。在增加了对 `mSQL`（另一个开源关系型数据库管理系统）的支持后，`PHP/FI` 开始变得真正强大。`PHP/FI` 的流行程度极大增长，在 1997\
  \ 年中期，`PHP` 引擎经历了针对版本 `3.0` 的全面重写。`PHP` 不再是创造者的个人爱好，而是一个拥有许多贡献者的大且不断发展的软件开发项目。专业软件开发者对\
  \ `PHP` 的使用率和“心智份额”仍在增长。\n\n### PHP 3\n\n从 `PHP/FI 2` 到 `PHP 3` 的升级代表了核心开发小组对 `PHP`\
  \ 的完全重写。重写是为了提高性能、扩展 `PHP` 可用的 API，并改进核心语言使其更具一致性和活性。大量的数据库 API 被添加到 `PHP 3` 中，为开发者提供了更大的灵活性和选择。`PHP\
  \ 3` 被赋予了更强大的语法来表达更传统的编程结构；此外，还增加了一有限的面向对象编程 (OOP) 特性。尽管 `PHP` 绝非完全的 OOP 环境，但这些新功能让熟悉\
  \ `OOP` 的人员能够在更熟悉的参数范围内操作。\n\n在这一“大锅”中加入数大量的改进以及在许多其他编程语言中找不到的功能，`PHP 3` 变成了一门非常强大且令人兴奋的语言。从第\
  \ 3 版本开始，`PHP` 的官方名称不再暗示“个人主页”；该语言现在简单称为 `PHP: 超文本预处理器`。\n\n### PHP 4.1\n\n`PHP\
  \ 4` 以及现在的 `4.1` 的改进没有从 `PHP/FI 2` 到 `PHP 3` 的跨越那样惊天动地，但它们是显著且值得关注的。`PHP` 已经很快，但\
  \ `PHP 4.x` 最显著且最重要的特征之一是极速 Zend 脚本引擎。`Zend Technologies` 为 `PHP` 制作了广泛的插件，包括 `Zend\
  \ Cache`。`PHP` 核心进行了许多精炼和扩展。其中某些添加内容并非免费，而是由商业公司支持。然而，大多数更改都是开源且免费的。书中还包含了几个新库和\
  \ API，将在书中进行深入介绍。\n\n`PHP` 已经发展成为一种真正的电子商务解决方案；它现在还夺取了“最常用 Apache 模块”的王座。根据 `E-Soft\
  \ Inc.` 的一项调查，截至 2002 年 1 月，`PHP` 以模块形式安装在超过 46%的 Apache 安装中。服务器端编程工具中与之接近的竞争对手是\
  \ `mod_perl`，调查中仅安装在略低于 20%的 Apache 服务器上。尽管 `E-Soft` 调查结果绝非定论，但这些统计数据引人注目，因为 `Apache`\
  \ 驱动了超过 60%的网站。\n\n### 注意\n\n实际上没有方法可以验证这些任何统计数据，这些数字仅用于展示以反映 `PHP` 的预估增长。有关调查方法的详情，请参阅\
  \ `www.securityspace.com/s_survey/data/index.html`。\n\n## 4.1 版本的新特性\n\n最新版本的 `PHP`\
  \ 包含了相对于 `4.0.x` 版本的几项重大变化。其中最显著的是与安全相关的更改，它们改变了访问用户输入的方式。\n\n### 引言\nxxi\n\n在新模型下，诸如通过表单提交并包含在\
  \ cookie 中的“外部”值现在可以通过特殊的全局数组可用：\n\n### 数组\n\n#### 目录\n\n- `$_GET`: 使用 HTTP GET\
  \ 方法提交的任何值\n- `$_POST`: 使用 HTTP POST 方法提交的任何值\n- `$_COOKIE`: HTTP Cookie 头部中的任何值\n\
  - `$_SERVER`: 由 Web 服务器创建的任何键值对\n- `$_ENV`: 来自 Web 服务器环境的任何变量\n- `$_REQUEST`: 来自\
  \ HTTP 请求的任何值\n- `$_SESSION`: 任何会话变量\n\n这些新变量类似于旧的 `$_HTTP_VARS` 变量（`$_HTTP_GET_VARS`、`$_HTTP_POST_VARS`\
  \ 等），在任何作用域内自动可用。这一更改是为了鼓励停止在全局作用域使用 `register_globals` 配置选项，这往往会引入安全问题。更多详情，请参阅\
  \ `php.net/release_4_0`。\n\n新版本还包含了通用改进，并极大提高了 Windows 速度和可靠性。\n\n### 注意\n\n2001\
  \ 年 12 月，发布了 `PHP` 的维护版本 `4.1.1`，以修复 `4.1.0` 版本中的一些错误。\n\n## PHP 的优势\n\n`PHP` 提供了什么？动态内容可以通过多种服务器解决方案提供。为特定问题选择正确的工具至关重要。`PHP`\
  \ 为 Web 应用提供了丰富的开发平台。`PHP` 提供了大量的 API，并与许多开源和商业数据库通信——换句话说，它是可操作的。`PHP` 是开源的，这意味着其内部代码是免费提供的。`PHP`\
  \ 还具有良好的移植性，适用于多种 Web 服务器和操作系统，包括 `Linux` 和 `Windows`。\n\n尽管 `PHP` 有许多优势，但在选择开发平台时，考虑应用程序的所有方面很重要。每个选项都应该经过权衡和考虑，以做出最佳选择。显然，很少有\
  \ Web 应用是用 `C++` 编写的它并非为 Web 应用开发设计。然而，`PHP`、`JSP`、`ColdFusion` 和 `ASP` 等服务器端技术正是如此。事实上，许多技术与服务器密切结合。\n\
  \n某些技术比其他技术更容易学习和使用。许多语言为了易用性而牺牲了高级功能。`PHP` 在保持易用性的同时提供了高级功能。这种可用性是选择特定编程语言开发应用程序时最重要的因素之一；如果开发团队无法高效地学习和使用某种语言，应用程序将受到影响。\n\
  \nxxii\n\n## PHP 的未来\n\n那么 `PHP` 是如何成为如此强大的，它未来将走向何方？`PHP` 取得不可争议的成功的关键因素之一是它是开源且完全免费的！考虑到此类产品的这些功能，花费数千美元购买功能与\
  \ `PHP` 类似的企业级解决方案并不罕见。尽管开发平台的价格只是企业级解决方案总成本的因素之一，但 `PHP` 能够持续成功，是因为它是经过证明的技术，而不仅仅是因为价格便宜。`PHP`\
  \ 吸引了商业支持和插件，而其核心保持 100%的免费。\n\n\n\n\n目前，PHP 并不作为一个独立的服务器运行。从严格的术语来说，它也不是一个应用服务器。PHP\
  \ 从设计之初并不是为了企业级应用而设计的。`enterprise-level`（企业级）意味着意味着处理能够扩展到大量用户执行复杂任务的应用的关键功能的能力；这种能力必须从一开始就进行规划，以达到企业级应用所需的扩展性水平。在选择开发应用程序的平台时，记住这些局限性非常重要。为了让\
  \ PHP 能够进入企业领域并在这一应用领域具有真正的竞争力，PHP 架构必须发生几项变化。\n\n可以添加到 PHP 中的功能和变化在重要性以及与其当前能力和用户的相关性上各异。我们对\
  \ PHP 可能或可能向何处发展有一些想法。在 PHP 开发团队决定下一步将 PHP 带向何方之前，这些任何功能都纯属推测。无论他们选择做什么，结果都将非常令人兴奋。\n\
  \n## PHP 作为应用服务器\n\n使 PHP 成为企业级解决方案的阶段之一，是让 PHP 成为真正的应用服务器。PHP 将成为一个常驻服务器进程，应用服务器将拥有多个线程。当\
  \ PHP 作为独立的应用服务器运行时，它可以更高效地处理数据库连接。这将允许一定数量的持久数据库连接由假设的 PHP 应用服务器不断保持开启并管理，以处理请求。这种设计带来的性能提升将是巨大的。\n\
  \n拥有常驻服务器进程在将 PHP 配合远程过程调用（RPC）协议（如 `SOAP` 或更底层的协议）使用时也会很有帮助。当发出 RPC 请求时，服务器对远程过程调用的结果做出响应。这将使\
  \ PHP 不仅能为 Web 浏览器还能为任何知道如何发送 RPC 请求的应用程序提供内容并处理请求。\n\n例如，PHP 应用服务器可以接收来自会计程序的远程调用，处理结果并将其返回给会计程序。在\
  \ PHP 服务器处理内部会计应用程序请求的同时，它也可以通过返回 `XHTML` 文档来响应来自 Web 浏览器的请求。这种情况看起来可能有些不可思议，但实际上非常常见，优势是显而易见的。整个开发方法论可以从严格处理\
  \ Web 浏览器转变为处理想象中几乎任何类型的客户端。\n\n拥有应用服务器还允许更轻松地分层编程逻辑。在应用程序中使用独立的逻辑层，可以减少编程任务之间的相互依赖（和相互交织）。一个团队只需要知道如何与业务逻辑层交互以创建\
  \ Web 浏览器界面，而另一个使用相同信息的团队可以实现与会计程序的接口。这使得界面与编程逻辑分离开。同时，另一个开发团队可以负责应用程序中提供所有逻辑并为所有不同客户端接口返回所需数据的部分，这些接口反过来处理这些数据，生成所需的信息并将其传回给请求客户端。\n\
  \n将 PHP 重写为应用服务器将代表对该语言大部分内容的完全重写。其优势是多且令人兴奋的。PHP 下一步将向何处发展是一个非常有争议的话题。\n\n## 其他改进\n\
  \n尽管将 PHP 变成真正的应用服务器无疑是改进这一资源最大的任务之一，但这绝不是唯一可能的改进方法。随着应用程序规模的扩大，需要更好的调试接口。需要更严格的类型检查。另一个引人胜的功能是将\
  \ PHP 编译为字节码的能力。\n\n## 关于 Mastering PHP 4.1\n\n我们编写 `Mastering PHP 4.1` 的目标之一是提供务实的现实场景，以帮助说明从概念到实现的功能。另一个目标是以简洁直观的方式提供信息，使掌握\
  \ Web 开发概念的学习变得不再那么痛苦。我们希望分享我们在 Web 开发方面的经验，并展示如何避开许多常见的陷阱。\n\n**注意**：已经存在一些备受推崇的技术。有关此技术的更多信息，请访问\
  \ `www.zend.com`。\n\n\n\n\n全书使用 Red Hat Linux 7 版本作为主要平台。所有代码都经过彻底测试，确保可以在全新安装的\
  \ Red Hat 7 系统上从源码编译并使用 `PHP 4.1` 运行。`PHP` 最初设计在 Unix 平台上，使用该类型的平台可以实现最高的稳定性和性能。本书的范围无法涵盖\
  \ Linux 服务器的搭建，但我们将讨论关于让 `PHP` 启动并运行的更具挑战性的问题。\n\n书中还在 Windows 安装环境上演示了许多特定的选项和技术。Windows\
  \ 上的 `PHP` 性能尚未完全与 Unix 版本平齐，但它是该语言一个不断增长的领域。\n\n在整本书中，我们会指出某些功能需要特定的安装或编译选项，但附录\
  \ A“PHP 安装速成”完整地演示了如何在 Linux 和 Windows 上安装和配置 `PHP` 以及若干相关工具，包括 Apache Web 服务器本身（Windows\
  \ Win32 版本：98、Me 和 2000）。\n\n## 本书使用的规范\n\n以下图标表示有用的提示和警告。它们被标记是为了引起你的注意，而且通常正因为如此才非常值得阅读！\n\
