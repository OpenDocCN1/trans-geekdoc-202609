  <?php print($first); ?>\" size=\"15\"><br />\n<b>Last Name:</b>\n<input type=\"\
  text\" name=\"last\"\nvalue=\"<?php print($last); ?>\" size=\"15\"><br />\n<b>Favorite\
  \ Programming Language:</b>\n<input type=\"text\" name=\"favorite_language\"\nvalue=\"\
