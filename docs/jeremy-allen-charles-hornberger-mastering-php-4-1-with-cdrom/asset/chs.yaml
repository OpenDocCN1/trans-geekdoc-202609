  我们需要为高级数据输入页面准备一个提交动作页面。根据列表 1.6 中的代码创建 `you_are_advanced.php` 并保存文件。如果出现任何错误，请确保输入的代码与列表所示完全一致，但记住你始终可以打开配套光\
  \ 光盘上的副本。\n\n# 第 1 章\n### 开始你的 PHP 探索\n\n**列表 1.6：高级动作页面 (you_are_advanced.php)**\n\
  \n```html\n<html>\n<head>\n<title>You Are Advanced! ...</title>\n</head>\n<body>\n\
  Hello <b><?php print($first); ?>You Are Advanced! ...</b>\n<?php\n$query_string\
  \ = \"\";\n$query_string .= \"?first=\" . urlencode($first);\n$query_string .= \"\
  &last=\" . urlencode($last);\n$query_string .= \"&favorite_language=\" . urlencode($favorite_language);\n\
  ?>\n<br /><br />\n<a href=\"you_are_advanced.php<?php print($query_string); ?>\"\
  >Back To Who Are Advanced</a>\n</body>\n</html>\n```\n\n\n\n\n在浏览器中打开文件，在文本框中输入姓、名以及一种你喜欢的编程语言。当你点击\
  \ `Submit` 时，检查 URL；它不包含任何键值对，但操作页面仍然接收了你的变量。使用 `POST` 方法非常简单，它还允许使用某些表单元素上传文件。\n\
  \n### GET 和 POST 之间选择\n\n在决定数据传输方法时，需要记住最重要的点是：\n\n- 传输的数据量（在 `GET` 中由查询字符串的长度表示，在\
  \ `POST` 中由 HTTP 头部的大小表示）\n- 数据的可见性\n\n`GET` 方法对路径和查询字符串长度有限制；`POST` 可以传递无限量的数据和键值对，但在某些客户端中，URL\
  \ 路径仍然受到限制。\n\n*注意*\n\n*Internet Explorer 将 `POST` 和 `GET` 的 URL 路径均限制为 `2,048`\
  \ 个字符。IE 是目前最流行的浏览器，因此从任何意义上说，这都是 URL 路径的标准接受长度。*\n\n`GET` 可能会导致意外的影响。考虑一个在表单字段中需要敏感用户数据的页面。\n\
  \n如果使用 `GET` 方法提交表单字段，敏感数据将附加到 URL 之后。如果有人路过并看到 URL 中包含的数据——或者更可能且不那么明显的，如果他们可以打开浏览器访问的\
  \ URL 历史——可能会给用户带来痛苦。\n\n在提交敏感数据或大量数据时，最好使用 `POST` 方法。`GET` 主要在需要传递少量非安全数据时发挥作用。即便如此，在不安全的通信通道（例如未通过\
  \ `SSL` 加密的典型 `HTTP` 连接）上通过 `POST` 数据也是不安全的。\n\n16\n\n# 第 1 章\n\n### 开始你的 PHP 探索\n\
  \n*提示*\n\n*如需对 `GET` 和 `POST` 进行更深入的讨论，并学习如何查看通过表单 `POST` 的的数据，请参阅第 9 章。*\n\n####\
  \ 注释代码\n\n注释是在代码内部留下小备注的方式，在计算领域几乎是处处可见；即使 `HTML` 也有可用的注释形式。从表面上看，注释似乎是一个非常直接的主题。实际上，几乎没有事情像看起来那样直接或简单。尽管关于注释代码的方法和原因可能会引起争论，但本节将尝试涵盖注释代码时的一些最佳实践。\n\
  \n关于注释的一种观点是，它们根本不应该存在；代码应该写得足够好且“自文档化”，以至于注释都是多的。这种观点认为，注释只会助长糟糕的编程和难以阅读、易理解的代码。注释会增加代码的复杂性，如果写得不好，甚至会产生误导！\n\
  \n然而，这种思维方式尽管极端，但并不罕见。虽然其逻辑并不稳固，但确实包含某些真理。一个事实是，糟糕且具有误导性的注释比没有任何注释要糟糕得多。然而，在以后需要对代码进行维护、调整或重用时，良好的注释是无价之宝。在开发或测试脚本时，注释对于临时“隐藏”你不想运行的代码段也相当方便。\n\
  \n保持一种易于维护的注释风格是重要的。`PHP` 支持使用三种不同的注释样式：\n\n- `# This is a comment, like a shell\
  \ script comment`\n- `// This is a comment, like a comment`\n- `/* This is a multi-line\
  \ comment */`\n\n```\n# This is a comment, like a shell script comment\n// This\
  \ is a comment, like a comment\n/* This is a multi-line comment */\n```\n\n\n\n\n\
  \n```php\n$query_string .= “&last=” . urlencode($last);\n$query_string .= “&favorite_language=”\
  \ . urlencode($favorite_language);\n?>\n```\n\n这段注释的作用不仅仅是重申代码在做什么。代码分组良好，因此毫无疑问它们都在执行某项共同任务，并且易于阅读和理解。使用的变量命名很好，这在很大程度上有助于理解代码。但除此之外，注释还对这几行代码正在发生的情况进行了清晰的总结。如果阅读这段代码的人不熟悉\
  \ `.=` 运算符，注释将让他们大致了解正在进行的操作。这非常有用。\n\n## 探索 PHP\n\n## 19\n\n请务必在此处保持平衡；不要不加区别地删除所有单行注释。毕竟，几乎任何注释都比代码本身更容易读——除非是那些真正荒谬的东西，比如\
  \ `$i++; // 将计数器 $i 加 1`\n\n此外，除了在极其原始的情况下外，程序员阅读自然语言文本总是比阅读源代码更快。更重要的是，注释揭示了程序员的意图，这在追踪错误时很有帮助；而代码本身做不到这一点。（代码只执行它要执行的操作，但你无法通过观察代码来判断它是否执行了程序员实际上*预期*的操作。）在快速浏览文件以“理解”某部分代码的要点时，注释也是一个极好的助手；你不需要阅读整个块，或去纠结某个正则表达式，就能知道它是用来做什么的；注释已经解释了它。\n\
  \n关于注释的最后几点说明。不要过头，编写多余的注释。\n\n用 Kernighan 和 Plauger（《编程风格元素》作者）的话来说：“不要为糟糕的代码编写注释——要重写它。”这在很大程度上是成立。当一段代码看起来异常晦密且难以理解时，添加注释可能并不能解决问题。它可能只是让难以理解的代码变得臃肿。考虑重写代码。为了使代码具有可读性和维护性而花费的时间在以后会被感激的。如果你必须违反良好的编程风格，请尽管用简洁、准确、有效的注释解释原因吧！世界不是非黑即白的。希望这些指南以及在全书中的持续使用将展示出有效的注释有多有多用。\n\
  \n*本页特意留空*\n\n![Image 9](img/index-46_1.jpg)\n\n# 第 2 章\n\n### 变量\n\n变量“记住”编程语言中的所有内容；它们保存了应用程序处理的所有数据。PHP\
  \ 也不例外，它拥有大量的变量类型。每个变量持有一个特定类型的数据块，存储在它自己的内存中。每种不同的数据类型都有自己的技巧、函数和内存要求；你将学习变量可以持有的各种数据类型，以及你可以在哪里找到更多关于特定类型的信息。\n\
  \n特定变量可以包含的数据类型以及它们的使用方式因语言而异。我们将简要比较和对比 PHP 变量与其他语言中变量的区别，并说明为什么在 Web 开发背景下，PHP\
  \ 处理变量的方式是一件好事。我们还将学习在 PHP 中处理变量的一些最佳实践，例如命名标准。\n\n### 变量理论与命名\n\n变量到底是什么？在抽象的概念层面上，变量仅仅是一个持有一小部分数据的“对象”。当在编程之外考虑\
  \ *variable*（变量）一词的定义时，它仅仅意味着*不稳定的*或*可能改变*。在同样的意义上，编程中的变量可以被改变和修改。我们可以将不同的数据存储到变量中，以修改变量所代表的数据。变量的概念非常简单：变量存储数据，且存储的数据是可更改的。变量是任何语言中编程的固有部分。\n\
  \n与变量相反，*literal*（字面量）值不能被修改；字面量无法改变，可以被视为原始数据。如果你将字符串“foo”作为参数传递给函数，无法改变字符串“foo”所代表的内容，这意味着字符串“foo”是一个字面量。\n\
  \n### PHP 变量标识符\n\n*identifier*（标识符）是字母、下划线和数字的序列。编程中的术语 identifier 与 name 同义词。\n\
  \nPHP 中的标识符是区分大小写的。PHP 中的标识符必须以美元符号开头，随后跟一个字母（ASCII 字符 65–90 [A–Z] 和 97–122 [a–z]），然后是一个扩展\
  \ ASCII 字符\n\n## 22\n\n### 变量\n\n（值 127–255），或者一个下划线。标识符可以包含字母 a–z 和 A–Z、数字 0–9\
  \ 以及扩展字符。如果标识符的值（存储在变量中的数据）不改变，那么该标识符可以被视为常量。如果标识符的值改变，它就是变量。以下是 PHP 中的一些示例变量。\n\
  \n```php\n$foo = “Jeremy Allen”;\n$bar = “Chris Moran”;\n$fOO = “Not the same as\
  \ \\$foo”; // 标识符区分大小写\n$1address = “100 Elite Dr.”; // 错误，以数字开头\n$\\$_1address\
  \ = “100 Elite Dr.”; // 这里语法是正确的\n```\n\n### 良好的命名规范\n\n变量的概念很容易；但使用信息丰富的名称命名变量的实践可能更难捉摸。通过命名良好的变量，程序的读取和流会更好，逻辑通常也更合逻辑。记住，变量名*定义*了变量是什么。变量名应该完全且精确地标识变量所代表的数据。\n\
  \n```php\n$Dd = 0;\n$DD = 128;\n$TT = 0;\n$Tt = 64;\n$VV = ($DD - $Dd)/($Tt - $TT);\n\
  ```\n\n检查之前的代码。这段代码到底在做什么？粗一看，很容易看出四个变量被赋予了值，然后进行了一些算术运算，并将结果赋值给另一个变量。但缺少了一个关键信息：这些变量代表什么。考虑以下代码段：\n\
  \n```php\n$pos_start = 0; // 以码为单位的距离\n$pos_final = 128;\n$time_start = 0; // 以秒为单位的时间\n\
  $time_end = 64;\n$ball_velocity = ($pos_final - $pos_start)/($time_end - $time_start);\n\
  ``` 现在变得很明显了，该程序正在计算以码/秒计算的速度。使用那些模糊、令人畏惧的变量名可能会让任何人做噩梦。使用冗长的名称也会变得非常麻烦。考虑以下名称 *NumberOfCharactersInDocument*。这个名字显然且精确地描述了变量将包含的内容。然而，输入三四次这个名字将是一种负担。\n\
  \n确保你的变量名能准确描述变量的内容，这样在几个月后你自己还能记得这些变量的含义！表 2.1 展示了命名良好的变量以及使用不一致变量名表示相同数据的示例。\n\
  \nPHP 与数据类型\n\n## 23\n\n表 2.1：易懂与困惑的变量名\n\n| 易于理解 | 困惑 |\n| :--- | :--- |\n| pos\\\
  _start, position\\_start | p\\_strt, PSTART |\n| velocity | V, Vv, Z1, Z2 |\n| speed\\\
  _of\\_light, spd\\_of\\_light | s\\_o\\_l, s\\_o\\_lght, SOL, X |\n\n理想情况下，变量名不应太长。但如果变量太短无法准确包含变量含义，尝试让变量名变得更精确，或许通过缩短明显的单词部分来实现。如果名字看起来太长，且可以在不丢失变量所代表含义的情况下缩短，那么就应该缩短。例如，我们可以将\
  \ *NumberOfCharactersInThisDocument* 缩短为 *DocNumChars*。\n\n\n\n\n命名变量的另一个重要因素是确保当标识符包含多个单词时，变量是易于阅读的。阅读一个没有空格的句子是非常困难的。而阅读一个通过空格在逻辑上分隔每个单词的规范句子则并不困难。\n\
  \n```php\n$variablesarenoexceptiontothisrule = 1;\n```\n\n```php\n$variables_are_no_exception_to_this_rule\
  \ = 1;\n```\n\n虽然这两个变量名都太长了，但你实际上可以阅读其中一个，而另一个则是一团杂乱字符、无法识别的模糊整体。如果变量名具有不同的单词部分，请决定一种分离这些部分的标准方法。最常用的两种方法是将每个单词部分的首字母大写，或者使用下划线分隔变量中的每个单词。\n\
  \n```php\n$well_separated_variable = 1;\n```\n\n```php\n$WellSeparatedVariable =\
  \ 1;\n```\n\n最重要的决定是选择一种风格并始终如一地使用。在同一个变量甚至同一个项目中混合使用风格会降低代码的整体质量。涉及到编程风格、变量命名、代码缩进、大括号位置、注释风格等，关于编写高质量格式化代码有一个核心思想：选择一种风格并在整个项目中始终使用该风格。如果使用相同的风格，代码将变得更加连贯并获得更高水平的质量。高效的变量命名需要练习，而且只是谜图的一部分。\n\
  \n# PHP 和数据类型\n\nPHP 是一种`弱类型语言`。这意味着根据变量使用的上下文，变量可以包含任何给定的数据类型`数据类型`指的是变量值所代表的数据类型。\n\
  \n当在 `Java` 中声明变量时，变量具有特定的类型，且变量只能分配相应类型的数据。让我们比较一下 Java 变量声明和 PHP 变量声明。Java 整数的声明看起来像这样：`int\
  \ i = 100;`\n\n## 24\n\n# 第 2 章\n\n### 变量\n\n在 Java 声明中，变量 `$i` 带有 `int` 字母的修饰。这是变量的`type`：该变量无法持有\
  \ `Java` 定义为整数以外的任何数据。如果我们尝试分配任何无法在内部转换为整数的内容，`Java` 将抛出错误。\n\n在 `PHP` 中执行相同的操作，我们使用以下代码：\n\
  \n```php\n$i = 100;\n```\n\n在 `PHP` 中，我们可以随地让变量 `$i` 变成任何类型。如果我们以后需要变量 `$i` 成为字符串，`PHP`\
  \ 不会有意见。这就是弱类型：对变量的数据类型强制执行很弱。\n\n你几乎可以认为 `PHP` 中数据类型的强制执行是不存在的的。\n\n`PHP` 允许在任何时间为变量分配任何数据类型。像这样的弱类型模型使得学习特定语言的编程变得稍微容易。虽然强数据类型模型通过语言强制执行更严谨的类型检查，但在\
  \ `PHP` 中跟踪变量的数据类型取决于程序员。通过良好的编程实践，在任何情况下，使用的类型模型都不是问题，而弱类型模型的灵活性使开发者能够在没有强类型模型强制的额外开销的情况下完成更多工作。\n\
  \n归结底，弱类型语言赋予了程序员最大的灵活性。虽然一种语言可能允许在无需担心的情况下交换数据类型，但它仍然……\n\n\n\n`var_dump()` 函数接受一个表达式作为参数。`var_dump()`\
  \ 会显示更复杂数据类型（如数组）的结构，这使其成为非常实用的调试工具。需要注意的是，`var_dump()` 函数的结果始终被发送到客户端或输出缓冲区，函数的结果不能直接赋值给变量。一个更高级的示例允许我们将\
  \ `var_dump()` 函数的结果赋值给变量，这需要使用输出缓冲来捕获写入浏览器的数据。如果你希望对结果进行任何方式的处理（例如在调试程序中进行颜色高亮），另一种实用的技术。在这里的结果简单地封装在\
  \ `pre` 标签中，以便在不修改 `$foo` 变量内容的情况下保留格式。\n\n```php\n<?php\n\n$one_or_zero = 1;\n\n\
  // 开始输出缓冲\n\nob_start();\n\n// 调用变量 dump 函数，对输出进行缓冲\n\nvar_dump($one_or_zero);\n\
  \n// 将缓冲区的内容赋值给 $foo\n\n$foo = ob_get_contents();\n\n// 清空缓冲区并关闭输出缓冲\n\nob_end_clean();\n\
  \nSCALAR DATA TYPES\n\n27\n\nprint(“<pre>” . $foo . “</pre>”);\n\n?>\n```\n\n可以将其他数据类型的数字转换为整数，反之亦然；这将在本章节后面的“类型转换”部分进行介绍。\n\
  \n### 浮点数\n\n浮点数（有时称为 `doubles` 或简单的 `floats`）比整数具有更高的精度。允许的变量的精确度和大小取决于 PHP 使用的平台。PHP\
  \ 在给变量赋值浮点数时允许使用几种不同的表示法：\n\n```php\n<?php\n\n$my_float = 1000000000000;\n\necho($my_float\
  \ . “<br />”);\n\n$my_float = 1e12;\n\necho($my_float . “<br />”);\n\n$my_float\
  \ = 1+E12;\n\necho($my_float . “<br />”);\n\n?>\n```\n\n这些赋值都为变量 `$my_float` 分配了相同的值。在大多数平台上，浮点数的精度精确约为\
  \ 14 位小数。最大尺寸通常为 1.8 × 10³08。浮点数的最大值由 IEEE 64 位格式定义；然而，某些平台可能不使用 IEEE 格式。为了获得更高的精度，请考虑使用\
  \ PHP 扩展 `BCMath` 或 `GMP` 来处理任意精度数字。\n\n**注意**\n\nBCMath 和 GMP 允许使用更大、更高精度的数字。如果需要的精度超过\
  \ PHP 提供的，请考虑检查这些包以满足你的需求。\n\n## 字符串\n\n字符串是连接在一起的字符序列。描述字符串的句子本身也是一个字符串！\n\n字符串中的每个字符仅占用\
  \ 1 字节存储。理解字符串非常重要，它们在几乎每种编程语言中都被广泛使用。理解字符串的概念很简单：取一系列字符并将它们全部连接在一起。搞定！字符串就此产生。当然，理论往往与实际实现有所不同，PHP\
  \ 中的字符串也不例外。PHP 字符串不支持 Unicode，它们使用从 0 到 255 的标准 ASCII 字符集。虽然允许 Unicode 的函数，但 PHP\
  \ 没有原生支持。\n\n**注意**\n\nPHP 对字符串没有设置大小限制。\n\n28\n\n# 第 2 章\n\n### 变量\n\n在 PHP 中定义字符串有三种方式：单引号、双引号和使用\
  \ heredoc。单引号字符串不识别许多转义字符，反斜杠和单引号除外。双引号字符串允许更多的转义字符。heredoc 语法是定义多行字符串的方便方法。\n\n\
  ```php\n$my_string = 'This is a single-quoted string';\n$my_string = \"This is a\
  \ double-quoted string with \\n and \\t\";\n$my_string = <<EOD\nThis is a multi-line\
  \ string\nusing heredoc.\nEOD;\n```\n\n表 2.3：双引号字符串序列\n\n| 转义序列 | 表示 |\n| :--- |\
  \ :--- |\n| `\\n` | 换行 (0xA) |\n| `\\r` | 回车 (0xD) |\n| `\\t` | 水平表符 (0x9) |\n|\
  \ `\\\\` | 反斜杠 (0x5C) |\n| `\\$` | 美元符号 (0x$) |\n| `\\\"` | 双引号 (0x22) |\n| `\\\
  hex` | 十进制 |\n| `\\ooo` | 进制 |\n\nSCALAR DATA TYPES\n\n29\n\n### 字符串中的变量\n\n在字符串中包含变量有两种语法：双引号和\
  \ heredoc。简单语法允许简单的变量——只需将变量名插入字符串中。这种方法最易理解和使用。\n\n复杂语法提供了一种使用大括号在字符串内包含表达式和复杂对象的方法。考虑以下使用简单语法的示例：\n\
  \n```php\n$my_favorite_car = “Mustang”;\n$my_string = “$my_favorite_cars are the\
  \ best”;\n```\n\n这个示例的结果并不符合预期。结果字符串是“are the best”。由于 `$my_string` 中变量名末尾有 `s`，PHP\
  \ 将字符串中的变量读取为 `$my_favorite_cars`，但并没有名为这个变量。在应该有变量 `$my_favorite_car` 出现的地方，输出是空白。不过，有一个简单的方法可以解决这个问题：\n\
  \n```php\n$my_favorite_car = “Mustang”;\n$my_string = “${my_favorite_car}s are the\
  \ best”;\n```\n\n\n\n\n```php\n$arr[1] = “not”;\n\n$complex = “Complex expressions\
  \ are fun... {$arr[0]} {$arr[1]}.”;\n\nprint($complex);\n\n?>\n```\n\n复杂的语法应该慎用。如果你想在字符串中包含复杂的表达式，请考虑使用字符串拼接运算符。\n\
  \n30\n\n# 第 2 章\n\n### 变量\n\n字符串拼接运算符允许运算符的左侧和右侧连接。该运算符可以使用任何可以使用字符串的地方。请看下面字符串拼接运算符实际应用的示例：\n\
  \n```php\n<?php\n\n$my_favorite_car = “Mustang”;\n\n$str = $my_favorite_car . “s\
  \ are the best. <br />”;\n\nprint($str);\n\n$str1 = “Strings are quite fun “;\n\n\
  $str2 = “to work with once you know “;\n\n$str3 = “the rules”;\n\nprint($str1 .\
  \ $str2 . $str3 . “! <br />”);\n\n$complex = “Using the concatenation operator “\
  \ . (100 * 100) .\n\n“makes complex expressions much easier to see.”;\n\nprint($complex);\n\
  \n?>\n```\n\n字符串拼接运算符用于实现与字符串内变量相同的功能，现在我们是将字符串的片段和部分组合，并清晰地分离字符串中的每个不同表达式和变量。这种方法提高了代码的可读性。\n\
  \n注意：关于字符串和拼接运算符的更多信息，请访问第 5 章。\n\n### 复杂数据类型\n\n标量值是数据的一个原子单元。标量值简单来说就是一个字母或数字，是\
  \ PHP 中最小的存储单元。绝对最小的是布尔值，它存储一个简单的是或否。在软件中，通常很难用简单的字符串和数字来表示真实世界的数据。通常需要更高级的数据表示形式。\n\
  \n复杂数据类型是超越简单标量值的数据类型。数组是最明显且直接实用的复杂数据类型之一。它们允许表示大量数据，并拥有广泛且丰富的实用函数来帮助轻松操作它们。对象是\
  \ PHP 中的另一个关键复杂数据类型。对象不仅仅是一个数据类型；对象和面向对象编程（OOP）确实是种完整的编程方法，而不仅仅是数据存储。\n\n### 数组\n\
  \n数组是 PHP 中最灵活、实用的数据类型之一。在基础层面，`array` 是一系列具有键值对的元素。一个数组的元素（或变量）作为相关变量的集合存在。在 C\
  \ 语言语言中，数组使用顺序数字进行索引。数组键从零开始，通常为每个新的键值对递增 1，键为顺序数字。PHP 中顺序编号数组的示例如下：\n\n```php\n\
  // 初始化数组\n\n复杂数据类型\n\n31\n\n$my_array = array();\n\n$my_array[0] = “Mustang”;\n\n\
  $my_array[1] = “Viper”;\n\n$my_array[2] = “Corvette”;\n\n$my_array[3] = “Camaro”;\n\
  ```\n\n数组中的每一项都可以通过程序打印：\n\n```php\nforeach ( $my_array as $car )\n{ print(“${car}s\
  \ are the best!<br />”); }\n```\n\nPHP 数组由于其灵活的本质，是非常强大的工具。在内部，数组被表示为一种有序顺序的映射（ordered\
  \ map），其中包含键值对。PHP 包含了几个函数，允许数组用作各种复杂数据结构，例如栈、队列、树、列表和字典。此外，数组会根据需要更多存储而动态增长。\n\n\
  PHP 数组也可以与关联数组结合使用，如列表 2.1 所示。使用关联表示法的数组意味着字符串字面量也可以用索引。关联数组表示非常有用。任何作为字符串的 PHP\
  \ 变量都可以作为数组键。PHP 数组可以存储在另一个数组的值中，从而轻松创建某些复杂的数据结构。这些数据结构的“复杂”并不是指它们难以理解，而仅仅是指它们代表了比单个数字或单个字符字符串更多的内容。\n\
  \n**列表 2.1：使用关联数组表示法的数组**\n\n```html\n<head>\n<title>关联数组表示法</title>\n</head>\n\
  <body>\n<?php\n\n$cars = array\n(\n“Ford” => array (“Mustang”, “Focus”, “F150”),\n\
  “Chevy” => array (“Camaro”, “Silverado”, “Cavalier”, “Corvette”),\n“Porsche” =>\
  \ array (“911”, “Boxter”)\n);\n\nob_start();\nvar_dump($cars);\n$cars_var_dump =\
  \ ob_get_contents();\nob_end_clean();\nprint(“<pre>” . $cars_var_dump . “</pre>”);\n\
  \n?>\n</body>\n</html>\n```\n\n32\n\n# 第 2 章\n\n### 变量\n\n列表 2.1 展示了关联数组表示法的有趣方面。我们创建了一个名为\
  \ `$cars` 的关联数组。每个汽车制造商——Ford、Chevy 和 Porsche——都是数组中的键。分配给 `$cars` 键的值也是数组。我们开启输出缓冲来捕捉\
  \ `var_dump()` 的结果，然后将其放在 `<pre>` 标签之间。数组的概念需要时间适应。\n\n注意：关于数组的更多信息，请参第 5 章。\n\n\
  ### 对象\n\n周围的一切都可以被看作对象，即使是水瓶。我们在软件应用程序中定义对象？瓶子里有液体吗？瓶子被打开了吗？通过过程化方法，我们将对这些数据结构进行操作。对象将这些属性封装在一个整洁的包中。\n\
  \n我们使用类关键字来定义对象的方法。类中定义的变量是属性。让我们看看如何实现一个简单的对象并实例化它，见列表 2.2。\n\n**列表 2.2：Soda 类实现**\n\
  \n```php\nclass soda\n{\n\nvar $type;\nvar $liquid_amount;\n\n// Soda 构造函数\nfunction\
  \ soda($type, $liquid_amount)\n{\n\n$this->type = $type;\n$this->liquid_amount =\
  \ $liquid_amount;\n}\n\n// 倒出一些水\nfunction pour()\n{\nprint(“Some soda is poured\
  \ out<br />”);\n} // 执行计算倒出一些水\n}\n\n// 更改水的类型\n\n特殊数据类型\n\n33\n\nfunction change_type($type)\n\
  {\n\n$this->type = $type;\n}\n\n// 显示水的类型\nfunction display_type()\n{\n\necho “Soda\
  \ Type: “ . $this->type . “<br />”;\n}\n\n}\n\n$mountain_dew = new soda(“Mountain\
  \ Dew”, 1000);\n$mountain_dew->pour();\n$mountain_dew->change_type(“The best soda\
  \ there is”);\n$mountain_dew->display_type();\n```\n\n\n\n\n类在定义后实际上才被使用。创建了一个汽水对象，并将其命名为\
  \ `$mountain_dew`。要访问 `$mountain_dew` 对象的任何字段或调用任何函数，需要使用 `->` 操作符。初始参数会被传入，并创建该汽水对象的实例。\n\
  \n类的实例化次数没有限制。在通过构造函数初始化汽水对象后，我们就可以准备好与该对象进行交互了。该类定义了三个方法和一个构造函数。这三个方法是 `pour()`、`change_type()`\
  \ 和 `display_type()`。执行现实中的动作（如倒出一些汽水）与执行编程方法可以被视为等效的。对象用于从现实对象运行的方式和思维的方式上，使编程元素更清晰地模拟现实世界的对象。\n\
  \n面向对象编程（OOP）可以写满整卷书。这里定义的类展示了 PHP 中对象和面向对象编程的初体验。\n\n注意：如果你已经熟悉第 1 到第 5 章涵盖的内容，并想学习更多关于\
  \ PHP 中的 OOP，请跳到第 6 章“面向对象编程”。\n\n### 特殊数据类型\n\nPHP 中有几种数据类型甚至不同于复杂或标量数据类型。这些数据类型相对容易识别，并用于\
  \ PHP 中的特定目的。目前 PHP 中定义的特殊数据类型只有资源（resource）数据类型和空（null）数据类型。\n\n# 第 2 章\n\n###\
  \ 变量\n\n### 资源 (Resource)\n资源是 PHP 某些函数需要的特殊数据类型，由程序员分配。然而，如果程序员没有处理，PHP 会通过垃圾回收处理资源的释放。当使用涉及资源的函数时，通常有一个函数可以处理变量的内存释放。在可能消耗大量系统资源的长时间运行脚本中，手动控制内存释放的时机是非常有用的。\n\
  \n其中一个创建外部资源的函数示例是 `xml_parser_create()`。大多数 XML 函数都需要该资源的引用才能正常工作。为了使用任何 XML 处理功能，必须先创建\
  \ XML 解析器资源。变量实际上是否为资源是在后台处理的。\n\n### 空 (Null)\nNull 可能是最容易理解、最直观的数据类型。任何被赋值为 Null\
  \ 的值都不包含任何值。空值仅意味着没有为变量设置值。关键字 `Null` 不区分大小写。Null 被视为一种特殊数据类型。\n\n### 常量 (Constants)\n\
  常量是 PHP 中值不会改变的变量。当一个变量被频繁使用时（例如 `pi` 或权限系统中的某个特定权限），使用常量会让代码更容易修改。使用常量时，不使用美元符号\
  \ `$`，只使用常量名。复杂数据类型不允许作为常量。常量一旦定义，在整个脚本执行期间就不能更改或以其他方式取消。常量的不变性允许其值用于安全关键的场景中，例如权限常量等。只有四种简单（或标量）数据类型可以赋值给常量。常量的标识符遵循与\
  \ PHP 变量相同的规则。\n\n最好避免定义任何与现有 PHP 常量或函数相同或相似到引起混淆的常量。常量一旦定义，可以在 PHP 脚本的任何地方访问。作为一项良好的设计规则，常量应使用全大写字母定义；一个仅包含大写字母的标识符可以迅速识别为常量。\n\
  \n要定义常量，我们必须使用 `define` 函数。`define` 函数要求第一个参数为字符串类型的标识符，第二个参数为实际常量值。让我们来看一些典型的代码：\n\
  \n```php\n<?php\ndefine(\"READ\", 1);\ndefine(\"SAVE\", 2);\ndefine(\"DELETE\",\
  \ 4);\n\n$constant_name = \"READ\";\nprint(constant($constant_name) . \"<br />\"\
  );\n\n$constant_name = \"SAVE\";\nprint(constant($constant_name) . \"<br />\");\n\
  \nprint(DELETE);\n?>\n```\n\n此脚本定义三个常量：`READ`、`SAVE` 和 `DELETE`。使用一个包含代表常量标识符字符串的变量时，如果我们想访问常量的值，则需要使用\
  \ `constant` 函数。`constant` 函数要求参数为字符串，如果常量存在，则返回该常量的值。最后的 `print` 语句显示，在访问常量值时不需要使用美元符号。\n\
  \n如何确定一个常量是否已经定义？当然是使用 `defined` 函数！\n\n```php\n<?php\nprint(defined(\"READ\") .\
  \ \"<br />\");\ndefine(\"READ\", 1);\nprint(defined(\"READ\"));\n?>\n```\n\n注意：在常量是动态创建的情况下，检测常量是否被定义是有用的。\n\
  \nPHP 在每个脚本中还定义了另外几个常量。表 2.4 定义了一些常用常量。\n\n**表 2.4：PHP 定义的常量**\n\n| 常量 | 是否区分大小写？\
  \ | 描述 |\n| :--- | :--- | :--- |\n| `__FILE__` | | 当前执行的文件名 |\n| `__LINE__` | |\
  \ 当前脚本正在执行的行号 |\n| `PHP_VERSION` | 是 | PHP 的版本字符串 |\n| `PHP_OS` | 是 | 操作系统的名称 |\n\
  | `TRUE` | | 真值（参见布尔类型） |\n| `FALSE` | | 假值（参见布尔类型） |\n| `NULL` | | 空值（参见空类型） |\n\
  | `E_ERROR` | 是 | 解析之外的无法恢复的错误 |\n| `E_WARNING` | 是 | 警告 |\n| `E_PARSE` | 是 | 解析错误\
  \ |\n| `E_NOTICE` | 是 | 注意 |\n| `E_ALL` | 是 | 所有错误 |\n\n# 第 2 章\n\n### 变量\n\n###\
  \ 类型转换 (Type Juggling)\n虽然有多种数据类型，但 PHP 内部处理类型时存在某些特定的机制。在某些类型转换至关的场景中，了解类型转换发生的方式是非常有用的。\n\
  \n### 类型转换 (Type Casting)\n类型转换可以使用类似于 C 语言的语法进行。将变量转换为特定的数据类型在某些操作中是关键。\n\n```php\n\
  <?php\n$my_int = 100;\nprint(\"转换为 double...\" . ((double)$my_int + 1.9));\nvar_dump($my_int);\n\
  ?>\n```\n\n要更改变量的类型，必须使用 `settype` 函数。在之前的示例中，我们可以调用 `settype` 函数强制将 `$my_int` 转换为双类型。\n\
  \n```php\n<?php\n$my_int = 100;\nprint(\"转换为 double...\" . ((double)$my_int + 1.9)\
  \ . \"<br />\");\nvar_dump($my_int);\nprint(\"<br />\");\nsettype($my_int, \"double\"\
  );\nvar_dump($my_int);\n?>\n```\n\n表 2.5 显示了变量可以转换的所有类型。\n\n**表 2.5：变量转换类型**\n\n\
  | 转换 | 目标类型 |\n| :--- | :--- |\n| (array) | 数组 |\n| (bool), (Boolean) | 布尔 |\n|\
  \ (real), (double), (float) | 浮点 |\n| (int), (integer) | 整数 |\n| (object) | 对象 |\n\
  | (string) | 字符串 |\n\n### 布尔转换\n将值转换为布尔值时，可能不太清楚具体哪些类型会转换为什么布尔值。表 2.6 列出了各种类型以及该类型必须具备的值才能转换为假值。\n\
  \n**表 2.6：布尔假值转换**\n\n| 数据类型 | 转换为假所需的值 |\n| :--- | :--- |\n| 数组 | 无元素 |\n| 布尔 |\
  \ False |\n| 浮点 | 0.0 |\n| 整数 | 0 |\n| Null | Null |\n| 对象 | 未分配任何变量 |\n| 字符串 |\
  \ 空字符串 \"\" 或 \"0\" |\n\nPHP 中的任何其他值（包括资源）在转换为布尔值时都求为真。\n\n\n\n值遵循一些简单的规则转换为字符串。当字符串以数字开头时，该字符串会被评估为数值数据类型。\n\
  \n```php\n<?php\n$my_answer = “41 is the answer to the problem” + 1;\nprint(“The\
  \ answer is... “);\nvar_dump($my_answer);\n?>\n```\n\n这段代码段将输出“The answer is...\
  \ int(42)”。如果数值数据位于字符串开头，PHP 将获取该数值值并忽略字符串的其余部分。在将字符串转换为整数后，会在整数上加 `1`。\n\n如果数值数据使用\
  \ `e` 或 `E` 写入或包含句号（`.`），该变量将被解释为浮点数（float）。然而，与之前的示例一样，如果有任何尾随字符，该变量将被解释为整数，如下代码段所示：\n\
  \n```php\n<?php\n$my_answer = 1 + “41.1e90 is the answer to the problem”;\nprint(“The\
  \ answer is... “);\nvar_dump($my_answer);\n?>\n```\n\n如果没有尾随字符串数据，数据将转换为浮点数。\n\n\
  ```php\n<?php\n$my_answer = 1 + “41.1e90”;\nprint(“The answer is... “);\nvar_dump($my_answer);\n\
  ?>\n```\n\n**38**\n\n# 第 2 章\n\n### 变量\n\n字符串转换非常简单。将其他类型的数据转换为字符串时，请参考表 2.7。\n\n\
