  \n## 使用 POP3 访问邮件\n\n一旦安装了 IMAP 扩展，登录 POP3 服务器将变得轻而易举。你需要使用的函数是 `imap_open()`，它返回一个所谓的\
  \ IMAP 流。事实上，IMAP 流是一个资源，类似于 `odbc_connect()` 返回的数据库句柄。`imap_open()` 的原型如下：\n\n\
  ```\nint imap_open (string mailbox, string username, string password [, int flags])\n\
  ```\n\n第一个参数是“邮箱箱指定符”，它定义了连接类型（POP 或 IMAP）、服务器名称、使用的端口，以及对于 IMAP 邮件服务器，要打开的远程邮箱箱名称。该指定符是一个特殊构造的字符串，在\
  \ POP 中具有以下结构：\n\n`{mailhost[:port][/protocol]][mailbox]`\n\n大括号用于包含指定符中的邮件主机名、端口和协议部分。（端口、协议和邮箱箱部分都是可选的，如中括号所示，但通常为了清晰起见应该使用它们）。要连接到位于\
  \ `pop.example.org` 且端口为 110（POP3 流量的标准端口）的机器，用户名为 `foo`，密码为 `bar`，你可以写：\n\n```\n\
  $conn = imap_open ('{pop.example.org:110/pop3}INBOX', 'foo', 'bar');\n```\n\n####\
  \ 注意事项\n\n事实上，`/protocol` 部分可以包含比仅协议指定符更多的信息，你并不限于仅指定 `/pop3` 或 `/imap`。你可以要求使用\
  \ `/pop3/ssl` 或 `/imap/ssl` 进行 SSL 加密连接，或者仅通过 `/pop3/tryssl` 或 `/imap/tryssl` 指定你偏好此类连接。参见文件\
  \ `docs/naming.txt`。\n\n`INBOX` 是一个特殊的标识符，表示要连接的邮箱箱。\n\n`imap_open()` 函数的第四个参数 `flags`\
  \ 是一个位掩码，可以使用：\n\n```\n$conn = imap_open ($mbox_spec, $user, EXPUNGE);\n```\n\n\
  使用 `EXPUNGE` 标志会在连接关闭时自动清理删除邮件。\n\n`imap_open()` 函数还接受第四个参数 `flags`，这是一个位掩码，可以使用\
  \ `READONLY`、`ANONYMOUS`、`HALF` 和 `EXPUNGE`。对于 POP3 连接，只有 `EXPUNGE` 是有用的：\n\n```\n\
  $conn = imap_open ($mbox_spec, $user, EXPUNGE);\n```\n\n使用 `EXPUNGE` 标志会在连接关闭时自动清理删除邮件。\n\
  \n## 获取邮件列表\n\n`imap_check()` 函数返回一个包含远程邮箱箱当前信息的“mailbox”对象。返回对象的属性见表 19.2（这些属性名称大小写敏感）。\n\
  \n### 表 19.2：imap_check() 返回的对象属性\n\n| 属性 |  |\n| :--- | :--- |\n| Date | 邮箱最后更改日期\
  \ |\n| Driver | 用于访问邮箱的协议（通常为“imap”、“pop3”或“nntp”） |\n| Mailbox | 邮箱箱名称 |\n| Nmsgs\
  \ | 邮箱中的邮件数量 |\n| Recent | 邮箱中“最近”邮件的数量（对于 POP3 服务器，这似乎与 Nmsgs 相同） |\n\n一旦我们知道了邮箱中的邮件总数（即\
  \ `Nmsgs` 的值），就可以检索每封邮件的信息。POP 邮箱中的邮件从 1 到 Nmsgs 顺序编号；知道这一点，我们可以调用一次 `imap_fetch_overview()`\
  \ 来获取邮箱中所有邮件的信息。该函数的原型如下：\n\n```\narray imap_fetch_overview (int imap_stream, string\
  \ sequence [, int flags])\n```\n\n第一个参数是 `imap_open()` 返回的 IMAP 流。第二个参数是“序列”标识符，可以是单个邮件编号，也可以一组邮件标识符。邮件范围可以使用起始和结束邮件编号之间的冒号来指定；例如，“4:9”表示从第\
  \ 4 到第 9 邮件。多个范围可以使用逗号分隔；“4:9,3,11:13”表示第 4 到 9 封、第 3 封以及第 11 到 13 封。因此，为了获取邮箱中所有邮件的信息，我们可以写道：\n\
  \n```\n$inbox = imap_check ($conn);\n$messages = imap_fetch_overview ($conn, '1:'\
  \ . $inbox->Nmsgs);\n```\n\n\n\n此时，`$messages` 将是一个通用对象的数组，每个对象描述一个消息的头头部信息。每个对象的属性（如表\
  \ 19.3 所示）包含了所有重要的邮件头头部值。\n\n**表 19.3：`imap_fetch_overview()` 返回对象的属性**\n\n| 属性\
  \ | 描述 |\n| :--- | :--- |\n| subject | Subject 头部字段的字符串内容。 |\n| from | From 头部字段的字符串内容。\
  \ |\n| date | Date 头部字段的字符串内容。这将按照发送者指定的格式完全给出，因此可能是不同的时区，甚至以交替格式指定。 |\n| message_id\
  \ | Message-ID 头部的字符串内容。 |\n| references | References 头部的字符串内容。如果此消息引用了其他消息（即回复消息），则该字段将包含另一个消息\
  \ ID。 |\n| size | 表示消息大小（字节）的整数。 |\n| uid | 消息在邮箱箱中的 UID（此概念适用于 IMAP 消息；对于 POP3\
  \ 邮箱箱中的消息，UID 与消息编号相同）。 |\n| msgno | 消息的编号。 |\n| flagged | 表示消息是否被标记（仅限 IMAP 邮箱箱）：1\
  \ 表示是，0 表示否。 |\n| recent | 表示消息是否被标记为最新（仅限 IMAP 邮箱箱）：1 表示是，0 表示否。 |\n| answered\
  \ | 表示消息是否被标记为已回复（仅限 IMAP 邮箱箱）：1 表示是，0 表示否。 |\n| deleted | 表示消息是否被标记为已删除（仅限 IMAP\
  \ 邮箱箱）：1 表示是，0 表示否。 |\n| seen | 表示消息是否被标记为已读（仅限 IMAP 邮箱箱）：1 表示是，0 表示否。 |\n| draft\
  \ | 表示消息是否被标记为草稿（仅限 IMAP 邮箱箱）：1 表示是，0 表示否。 |\n\n## 使用 IMAP 扩展读取邮件\n\n一旦我们在 `$messages`\
  \ 中获取了消息对象数组，遍历它们并打印收件箱内容的摘要就是轻而易举的。列表 19.3 显示了一个列出 POP 邮箱内容摘要的完整脚本。列表 19.3 的输出如图\
  \ 19.1 所示；显然，很容易修改 HTML 使输出更优雅，但并不是这里的重点。\n\n**列表 19.3：遍历 POP 收件箱 (pop_lister.php)**\n\
  \n```php\n<?php\n$user = 'fredf';\n$pass = 'ffred22';\n$host = 'localhost';\n$port\
  \ = '110';\n$proto = 'pop3';\n$inbox = 'INBOX';\n$mbox_spec = sprintf ('{%s:%s/%s}%s',\
  \ $host, $port, $proto, $inbox); $conn = imap_open ($mbox_spec, $user, $pass);\n\
  $inbox = imap_check ($conn);\n$messages = imap_fetch_overview ($conn, '1:' . $inbox->Nmsgs);\n\
  print (\"<table border=\\\"0\\\">\\n\");\nwhile ($m = current ($messages)) {\n \
  \   print(\"<< bgcolor=\\\"silver\\\">\\n\");\n    printf (\"<td>%s</td>\\n\", htmlspecialchars\
  \ ($m->date));\n    printf (\"<td>%s</td>\\n\", htmlspecialchars ($m->from));\n\
  \    printf (\"<td>%s</td>\\n\", htmlspecialchars ($m->subject));\n    print (\"\
  </tr>\\n\");\n    next ($messages);\n}\nprint (\"</table>\\n\");\nimap_close ($conn);\n\
  ?>\n```\n\n### 读取单条消息\n\n一旦确定了远程邮箱箱中消息的数量，你就可以可以使用几种技术之一访问这些消息的内容。你可以使用 `imap_body()`\
  \ 获取消息的完整内容（消息头部之后的所有内容）并将其作为一个单个字符串，然后手动进行解码；你也可以通过递归调用 `imap_fetchbody()` 来访问消息正文的各个“部分”（后者技术稍后会介绍）。`imap_body()`\
  \ 的原型为：\n\n`string imap_body (int imap_stream, int flags)`\n\n因此，要从 POP 邮箱箱中检索特定消息，你只需要这样写：\n\
  ```php\n$msg_body = imap_body ($conn, $msg_no);\nprint ($msg_body);\n```\n\n**注意：**\
  \ 你可能希望使用像 `htmlspecialchars()` 或 `strip_tags()` 的函数来确保消息内容中的特殊字符不会干扰显示。\n\n**图\
  \ 19.1：从 POP 收件箱列出的消息。** 注意，这对于渲染复杂的 MIME 消息并不是有效技术，例如带有附件的消息或包含多个版本内容的 multipart/alternative\
  \ 消息（即一个纯文本版本和一个 HTML 版本）。然而，我们可以使用 PEAR 中的 `Mail_mimeDecode` 类（在 `Mail/mimeDecode`\
  \ 文件中）。\n\n### 删除消息\n\n删除消息是一个两步过程。首先，你使用 `imap_delete()` 标记要删除的消息，然后你必须调用 `imap_close()`\
  \ 来确保它们被删除。`imap_delete()` 的原型为：\n\n`int imap_delete (int imap_stream, int|msg_number)`\n\
  \n由于调用 `imap_delete()` 实际上并没有删除消息，它们在服务器上仍然可用，如下代码所示：\n\n```php\nprint (\"Opening\
  \ connection.\\n\");\n$c = imap_open ('{localhost:110/pop3}INBOX', $user, $pass,\
  \ CL_EXPGE);\n$inbox = imap_check ($c);\nprint ($inbox->Nmsgs . \" messages in inbox\
  \ ... deleting one.\\n\");\nimap_delete ($c, $inbox->Nmsgs);\nprint (\"Message deleted.\\\
  n\");\n$inbox = imap_check ($c);\nprint ($inbox->Nmsgs . \" messages in inbox.\\\
  n\");\nimap_close ($c);\nprint (\"Connection closed.\\n\");\n```\n\n此代码生成以下输出：\n\
  ```\nOpening connection.\n8 messages in inbox ... deleting one.\nMessage deleted.\n\
  8 messages in inbox.\nConnection closed.\n```\n下次我们访问此邮箱时，实际上会少一条消息。但在调用 `imap_close()`\
  \ 之前，消息并不会删除。\n\n### 使用 IMAP 访问邮件\n\n连接到 IMAP 服务器与登录 POP3 服务器几乎相同；邮箱标识符以相同的方式构建，其服务器部分在大括号内，由远程服务器的主机、端口、协议以及可选的邮箱部分组成。将其传递给\
  \ `imap_open()`，并带有用户名、密码以及可选的用于控制连接方式细节的整数位掩码。\n\n`imap_open()` 的原型为：\n\n`int imap_open\
  \ (string mailbox, string username, string password, int flags)`\n\n要连接到本地机器上的 IMAP\
  \ 服务器并打开用户的默认邮箱，你可以使用：\n```php\n$conn = imap_open ('{localhost:143/imap}INBOX',\
  \ $user, $pass);\n```\n\n虽然邮箱标识符中的端口和协议部分是可选的，但通常应该包含。（在 Unix 服务器上，如果你没有指定端口号，`imap_open()`\
  \ 函数将尝试使用 `rsh` 连接到远程主机，而不是打开到指定的端口。）特殊邮箱名称 `INBOX` 指远程服务器上的主要入站邮件邮箱。\n\n你还可以使用第四个参数\
  \ `flags` 向 `imap_open()` 传递多个标记。适用于 IMAP 连接的标记有：\n\n| 常量 | 效果 |\n| :--- | :---\
  \ |\n| `OP_READONLY` | 以只读模式打开邮箱 |\n| `OP_HALFOPEN` | 并不实际打开任何邮箱 |\n| `CL_EXPUNGE`\
  \ | 在调用 `imap_close()` 时自动清除（expunge）消息 |\n\n\n\n\n$conn = imap\\_open ($mspec,\
  \ $user, $pass, OP\\_HALFOPEN | CL\\_EXPUNGE);` 传入 `CL_EXPUNGE` 会告诉 IMAP 扩展在连接关闭时自动从邮箱箱中删除任何“已删除”的消息。（正如我们所说的，当你调用\
  \ `imap_delete()` 时，邮件并不会从远程邮箱箱中删除；它们只是被“标记为待删除”。）如果你使用 `CL_EXPUNGE` 标志来删除邮件，在你调用\
  \ `imap_close()` 之前，邮件不会从远程邮箱箱中移除。但一旦你调用 `imap_expunge()`，被标记的邮件就会被删除。\n\n当你完成对远程服务器上邮件的操作后，你应该使用\
  \ `imap_close()` 关闭连接。`imap_close()` 的原型为：\n\n```\nint imap_close (int imap_stream\
  \ \\[, int flags\\])\n```\n\n再次，可选的 `flags` 参数可以是 0 或“立即杀死”的值 `CL_EXPUNGE`。\n\n\
  ## 获取邮箱箱列表\n\n与 POP3 不同，IMAP 协议允许用户在服务器上创建多个邮箱箱并在它们之间移动邮件。这些邮箱箱可以按层级结构排列，因此一个文件夹可能包含其他文件夹（这些文件夹可能还可以包含其他文件夹，以此此类推）。一旦你打开了与远程服务器的连接，可以使用\
  \ `imap_getmailboxes()` 函数检索所有可用邮箱箱的列表，其原型为：\n\n```\narray imap_getmailboxes (int\
  \ imap_stream, string ref, string pattern)\n```\n\n第二个参数 `ref` 通常是你传递给 `imap_open()`\
  \ 的邮箱箱指定符。但注意，它应该只包含邮箱箱指定符的服务器部分，*不包含*邮箱箱部分；因此，不是“{localhost:143/imap}INBOX”，而是将只包含“{localhost:143/imap}”。\n\
  \n第三个参数 `pattern` 是一个特殊的字符串，你可以用它将邮箱箱限制在某个特定的子集中。你可以使用通配符 `*` 和 `%` 来匹配多个邮箱箱。`*`\
  \ 表示列出层级结构中当前级别下的所有邮箱箱；`%` 表示列出所有邮箱箱。因此，要获取当前用户的所有邮箱箱列表，你可以编写类似这样的代码：`$mbox_spec\
  \ = ‘{host.example.com:143/imap}’;`\n\n```\n$conn = imap\\_open ($mbox\\_spec, $user,\
  \ $pass, OP\\_HALFOPEN);\n$mailboxes = imap\\_getmailboxes ($conn, $mbox\\_spec,\
  \ ‘\\*’);\n```\n\n另一方面，如果你不想列出所有子文件夹而只列出顶层文件夹，你会使用类似代码：\n\n```\n$mbox\\_spec = ‘{host.example.com:143/imap}’;\n\
  $conn = imap\\_open ($mbox\\_spec, $user, $pass, OP\\_HALFOPEN);\n$mailboxes = imap\\\
  _getmailboxes ($conn, $mbox\\_spec, ‘%’);\n```\n\n取决于你所连接的邮件服务器，`pattern` 参数的实际内容可能会不同。\n\
  \n例如，UW-IMAP 服务器会接受类似“~/mail/work/%”的参数，这将列出用户主目录下 `work` 子目录下的所有顶层邮箱箱。值“~/mail/work/\\\
  *”将列出 ~/mail/work 下的整个邮箱箱层级。\n\n## 使用 IMAP 扩展读取电子邮件 **599**\n\n另一方面，如果没有打开当前的邮箱箱，且你简单地将\
  \ pattern 的值指定为“*”，则 UW-IMAP 服务器可能会列出用户主目录下的所有文件和目录。裸值“*”也应该返回特殊的收件箱邮箱 INBOX。\n\n\
  `imap_getmailboxes()` 的返回值是一个对象数组，其属性如表 19.4 所示。\n\n**表 19.4: imap_getmailboxes()\
  \ 返回对象的属性**\n\n| 属性 | 说明 |\n| :--- | :--- |\n| name | 邮箱箱名称 |\n| delimiter | 邮箱箱所在层级结构的分隔符\
  \ |\n| attributes | 表示各种邮箱箱特征的整数位掩码 |\n\n你可以使用以下常量来测试 `attributes` 的值：\n\n| 常量 |\
  \ 影响 |\n| :--- | :--- |\n| LATT_NOINFERIORS | 邮箱箱没有子邮箱箱 |\n| LATT_NOSELECT | 邮箱箱无法打开\
  \ |\n| LATT_MARKED | 邮箱箱已标记标记（仅在 UW-IMAPD 下有效） |\n| LATT_UNMARKED | 邮箱箱未标记（仅在 UW-IMAPD\
  \ 下有效） |\n\n例如，我们可以如下测试 `imap_getmailboxes()` 返回的每个对象的 `attributes` 属性值：\n\n```\n\
  $mailboxes = imap_getmailboxes ($conn, $ref, ‘\\*’);\nwhile ($m = current ($mailboxes))\
  \ {\n    printf (“Mailbox %s attributes:\\\\n”, $m->name);\n    if ($m->attributes\
  \ & LATT_NOINFERIORS)\n        print (“ Mailbox has no children\\\\n”);\n    else\n\
  \        print (“ Mailbox has children\\\\n”);\n    if ($m->attributes & LATT_NOSELECT)\n\
  \        print (“ Mailbox may not be opened\\\\n”);\n    else\n        print (“\
  \ Mailbox may be opened\\\\n”);\n    if ($m->attributes & LATT_MARKED)\n       \
  \ print (“ Mailbox is marked\\\\n”);\n    else\n        print (“ Mailbox is unmarked\\\
  \\n”);\n    print (“\\\\n”);\n    next ($mailboxes);\n}\n```\n\n**600**\n\n# 第 1\
  \ 章\n\n### 读取邮件\n\n*注意*\n\n邮箱箱名称包含非 ASCII 字符。如果是这样，它们将使用 UTF-7 进行编码。你可以使用 `imap_decode()`\
  \ 对它们进行解码（获取原始值）。此函数相对于 `imap_getmailboxes()` 的缺点在于你无法判断（至少在没有进一步探测的情况下）任何邮箱箱是否为文件夹或者它们是否可以打开。由于邮箱箱在\
  \ Unix 上通常是文件夹，在 Windows 机器上的分隔符将是 /。\n\n## 切换邮箱箱\n\n一旦你使用 `imap_getboxes()` 获取了用户的邮箱箱列表，你可以使用\
  \ `imap_reopen()` 打开邮箱箱以查看其内容。`reopen()` 的原型为：\n\n```\nint imap_reopen (int imap_stream,\
  \ string mailbox, int flags)\n```\n\n第二个参数 `mailbox` 是 `imap_getboxes()` 返回的邮箱对象的名称。例如，要打开服务器连接并打印\
  \ INBOX 文件夹以及用户目录下 work 邮箱箱的邮件数量，你可以编写类似代码：\n\n```\n$server\\_spec = ‘{localhost:143/imap}’;\n\
  $conn = imap\\_open ($server\\_spec, $user, $pass);\nimap\\_reopen ($conn, $server\\\
  _spec, ‘INBOX’);\n$mbox\\_info = imap\\_check ($conn);\nprintf (“INBOX has %d messages.\\\
  \\n”, $mbox\\_info->Nmsgs);\nimap\\_reopen ($conn, $server\\_spec, ‘~/mail/work’);\n\
  printf (“~/mail/work has %d messages.\\\\n”, $mbox\\_info->Nmsgs);\nimap\\_close\
  \ ($conn);\n```\n\n`flags` 参数是一个与之前传递给 `imap_open()` 相同的整数位掩码（可能值为上述的 OP_READONLY、OP_HALFOPEN\
  \ 和 CL_EXPUNGE）。一旦你使用 `imap_reopen()` 打开了邮箱箱，就可以使用 `imap_check()` 检查其内容。\n\n*注意*\n\
  \n如果新邮箱箱名称包含非 ASCII 字符，在传递给 `imap_reopen()` 之前，对邮箱箱名称进行 UTF-7 格式编码。你可以使用 `imap_utf7_encode()`\
  \ 函数来实现，该函数接受单个参数——未编码字符串并返回编码后的值。\n\n## 获取邮箱箱信息\n\n`imap_check()` 函数用于获取当前打开邮箱箱的信息（该邮箱箱应在此之前使用\
  \ `imap_open()` 或 `imap_reopen()` 打开）。其原型为：\n\n```\nobject imap_check (int imap_stream)\n\
  ```\n\n唯一参数 `imap_stream` 是由 `imap_open()` 返回的 IMAP 流。返回值是一个描述当前邮箱状态的对象。其属性在本章较早的表\
  \ 19.2 中给出。\n\n**601**\n\n\n\n\n如果邮箱箱名称可能包含非 ASCII 字符，请使用 `imap_utf7_decode()` 对其进行解码，该函数接受一个参数——编码字符串——并返回解码后的字符串。\n\
  \n除了 `imap_check()` 外，你还可以使用以下两个函数获取关于邮箱箱邮件的类似信息：\n\n`object imap_mailboxmsginfo\
  \ (int imap_stream)`\n\n`object imap_status (int imap_stream, string mailbox, int\
  \ options)` `imap_mailboxmsginfo()` 函数与 `imap_check()` 几乎相同，唯一的区别是：除了表 19.2 中列出的属性外，返回的对象还会包含一个\
  \ `Size` 属性，该属性包含邮箱箱中所有邮件的总大小。\n\n`imap_status()` 函数返回一个类似的对象，但属性列表略有不同。\n\n`imap_status()`\
  \ 返回的对象属性是可变的，并在表 19.5 中描述；它们可以使用第三个参数 `options` 进行控制，`options` 是表中所示常数的整数位掩码。\n\
  \n**表 19.5：** `imap_status()` 返回的对象中可用的属性\n\n| 属性 | 常量 |  |\n| :--- | :--- | :---\
  \ |\n| messages | SA_MESSAGES | 邮箱箱中的邮件数量 |\n| recent | SA_RECENT | 邮箱箱中的最新邮件数量\
  \ |\n| unseen | SA_UNSEEN | 邮箱箱中的未读邮件数量 |\n| uidnext | SA_UIDNEXT | 邮箱箱将使用的下一个 UID\
  \ |\n| uidvalidity | SA_UIDVALIDITY | 指示邮箱箱中邮件的 UID 可能不再有效的常量 |\n| | SA_ALL | 返回上述所有属性。\
  \ |\n\n因此，若要从 `imap_status()` 获取一个仅包含 `messages`、`recent` 和 `unseen` 属性的对象并打印出这些属性包含的值，你可以写：\n\
  \n```php\n$status = imap_status ($conn, $mailbox, SA_MESSAGES | SA_RECENT | SA_UNSEEN);\n\
  printf (“Total Message Count: %d\\n”, $status->messages);\nprintf (“Recent Messages:\
  \ %d\\n”, $status->recent);\nprintf (“Unseen Messages: %d\\n”, $status->unseen);\n\
  ```\n\n`SA_ALL` 常量会导致返回的对象包含所有五个属性。\n\n`imap_status()` 函数的独特之处在于，它允许你获取当前打开的邮箱箱之外的邮箱信息（如果你想打印服务器上所有邮箱箱的摘要信息，而无需通过\
  \ `imap_reopen()` 分别打开每一个，这将非常有用）。\n\n## 第 19 章：电子邮件\n\n### 列出邮箱箱中的邮件\n\n一旦你知道邮箱箱中有多少邮件，就可以遍历邮件列表以获取每封邮件的基本概述信息。`imap_fetch_overview()`\
  \ 函数返回一个包含这些信息的对象：\n\n`array imap_fetch_overview (int imap_stream, string sequence\
  \ [, int flags\\])` 第一个参数是 `imap_open()` 返回的 IMAP 流。第二个参数指定要检查的邮件。使用冒号（如“4:9”）指定邮件范围。用逗号分隔邮件组和范围：“4:9,3,11:13”表示第\
  \ 4 到 9 封邮件（包含）、第 3 封邮件以及第 11 到 13 封邮件（包含）。要获取邮箱箱中所有邮件的信息，我们将使用：\n\n```php\n$inbox\
  \ = imap_check ($conn);\n$messages = imap_fetch_overview ($conn, ‘1:’ . $inbox->Nmsgs);\n\
  ```\n\n`imap_fetch_overview()` 的可选第三参数 `flags` 是一个整数位掩码，其值应为 0 或 `FT_UID`。如果使用了\
  \ `FT_UID`，则第二个参数 `sequence` 的值将被认为包含 UID 而不是邮件号。（UID 与 IMAP 邮件的邮件号不同；它们提供了引用邮件的另一种方式）。然而，由于\
  \ `imap_check()` 只返回当前邮箱箱中最大的邮件号，在这种情况下没有理由使用 `FT_UID` 标记。\n\n此时，`$messages` 将是一个通用对象的数组，每个对象描述一封邮件的头。我们可以简单地遍历数组，将每封邮件的信息打印到浏览器。每个对象的属性包含所有重要的邮件头值；这些属性在章前面的表\
  \ 19.3 中描述。\n\n### 读取单封邮件\n\n就像 POP3 邮箱箱一样，你可以通过 `imap_body()` 获取邮件的完整原始内容，也可以通过调用\
  \ `imap_body()` 递归地获取多部分 MIME 邮件的所有部分（后者技术在本章稍后的示例 Web 应用程序中演示）。\n\n`imap_body()`\
  \ 的原型为：\n\n`string imap_body (int imap_stream, int msg_number[, int flags\\])` 第三个（可选）参数\
  \ `flags` 的值是以下常数的整数掩码：\n\n- `FT_UID`: 表示第二个参数 `msg_number` 是一个 UID 而不是邮件号。\n\n\
  在 POP3 中只有一种引用邮件的方法——使用服务器分配的邮件号——而 IMAP 提供了两种方式来指定你需要的邮件：其邮件号或其 UID。\n\n### 使用\
  \ IMAP 扩展读取邮件\n\n`FT_PEEK`: 告诉 IMAP 服务器不要设置邮件的 `Seen` 标记。（通常，当你获取正文时，服务器会自动设置 `Seen`\
  \ 标记。）\n\n`FT_INTERNAL`: 告诉 IMAP 服务器返回未修改的正文（即以服务器的内部格式，无论是什么）。\n\n因此，为了获取邮件的正文，以下两个代码块是等效的：\n\
  \n```php\n$m = imap_fetch_overview ($conn, ‘1’);\n$body = imap_body ($conn, $m->uid,\
  \ FT_UID | FT_PEEK);\n```\n\n和\n\n```php\n$m = imap_fetch_overview ($conn, ‘1’);\n\
  $body = imap_body ($conn, $m->msg_no, FT_PEEK);\n```\n\n### 将邮件标记为已读、已回复等\n\nIMAP\
  \ 文件夹中的邮件可以通过某些方式“标记”以指示其状态，事实上，许多标记在某些情况发生时会自动更新（例如当使用 `imap_delete()` 标记为删除时）。例如，一旦发送了邮件回复，可以使用\
  \ `Answered` 标记将该邮件标记为已回复。表 19.6 显示各种标记；它们都以 `\\` 开头且区分大小写。虽然某些标记受远程邮件服务器的自动操作，但除了\
  \ `Recent` 标记外，这些标记的状态可以使用 `imap_setflag_full()` 和 `imap_clearflag_full()` 函数手动更新。\n\
  \n**表 19.6：IMAP 邮件标记**\n\n| 标记 | 含义 | 更新时间 |\n| :--- | :--- | :--- |\n| \\Seen |\
  \ 邮件正文已查看。 | 获取邮件正文时自动更新 |\n| \\Answered | 邮件已回复。 | 手动更新 |\n| \\Deleted | 邮件已标记为删除。\
  \ | 调用 imap\\_delete() 时自动更新 |\n| \\Draft | 邮件已标记为草稿。 | 手动更新 |\n| \\Recent | 邮件之前未读过。\
  \ | 邮件服务器自动更新（即自上一次检查此邮箱箱以来到达） |\n| \\Flagged | 邮件已被标记为紧急或需要特殊关注。 | 手动更新 |\n\n\n\
  \n\n\n`imap_setflag_full()` 和 `imap_clearflag_full()` 的原型如下：\n\n```php\nstring imap_setflag_full\
  \ (int imap_stream, string sequence, string flag, int flags)\n```\n\n```php\nstring\
  \ imap_clearflag_full (int imap_stream, string sequence, string flag, int flags)\n\
  ```\n\n`sequence` 参数可以是单条消息（例如“5”）、一组消息列表（“5,6,7”）、消息范围（“5:8”）或这些者的组合（“5,7:9”）。`flag`\
  \ 参数是一个包含你想要设置的标志名称的字符串。请注意，反斜杠字符是有意义的，因此你必须使用使用单引号来构造字符串，或者使用另一个反斜杠来转义反斜杠，如下所示：\n\
  \n```\n$str = “\\\\\\\\Flagged”;\n```\n\n最后的 `flags` 参数是一个整数位掩码，其值应为 0 或 `ST_UID`；值\
  \ `ST_UID` 表示 `sequence` 中的数字是 UID 而不是消息编号。\n\n## 操作邮箱箱 (Working with Mailboxes)\n\
  \n你可以创建新的 IMAP 邮箱箱、重命名现有邮箱箱以及删除邮箱箱。此外，你可以在邮箱箱之间来回消息。\n\n邮箱箱的名称构造取决于你是在创建/重命名/删除邮箱箱，还是在邮箱箱之间移动消息。与\
  \ `imap_reopen()` 一样，`imap_createmailbox()`、`imap_renamemailbox()` 和 `imap_deletemailbox()`\
  \ 函数需要邮箱箱的“全名”，包括服务器部分。因此，在 `mail.example.org` 机器上 `INBOX` 的全名是“{mail.example.org:143/imap}INBOX”。用户\
  \ `~/mail` 目录下的工作邮箱箱全名是“{host.example.org:143/imap}~/mail/work”。\n\n相反，在邮箱箱之间移动消息的函数使用邮箱箱的简写名称，不包含服务器部分（例如使用“~/mail/work”而不是“{home.example.com:143/imap}~/mail/work”）。\n\
  \n### 创建、重命名和删除邮箱箱\n\n用于操作邮箱箱本身的三个函数非常容易理解。它们的原型如下：\n\n```php\nint imap_createmailbox\
  \ (int imap_stream, string mbox)\n```\n\n```php\nint imap_deletemailbox (int imap_stream,\
  \ string mbox)\n```\n\n```php\nint imap_renamemailbox (int imap_stream, string old_mbox,\
  \ string new_mbox)\n```\n\n如前所述，邮箱箱名称必须是“全名”，包括服务器部分。每个函数在成功时返回 True，在失败时返回 False。\n\
  \n*注意*\n\n*如果邮箱箱名称包含非 ASCII 字符，必须使用 `imap_utf7_encode()` 函数进行编码。*\n\n### 在邮箱箱之间移动消息\n\
  \n你可以使用 `imap_mail_move()` 函数将消息从一个邮箱箱移动到另一个。它的原型如下：\n\n```php\nint imap_mail_move\
  \ (int imap_stream, string msglist, string mbox [, int flags\\])\n```\n\n第二个参数 `msglist`\
  \ 是符合常规格式的消息编号或 UID 序列（例如，消息编号 5 对应“5”、消息 3 和 9 对应“3,9”、或消息 1 到 5 对应“1:5”）。\n\n\
  第三个参数是目标邮箱箱名称。`flags` 参数是一个整数位掩码，其值可以是 0 或 `CP_UID`，表示 `msglist` 中指定的消息标识符是 UID\
  \ 而不是消息编号。\n\n请注意，移动的消息在源邮箱箱中会被标记为删除，除非你调用了另一个反斜杠。例如，要将 2 到 4 的消息从当前邮箱箱移动到 `~/mail/work`，你需要执行：\n\
  \n```\nimap_mail_move (conn, ‘2:4’, ‘~/mail/work’);\n```\n\n*注意*\n\n*你可以使用 `imap_copy()`\
  \ 函数将消息复制到另一个邮箱箱。它的原型与 `imap_mail_move()` 相同，但它接受 `CP_UID` 选项。*\n\n### 向邮箱箱添加消息\n\
  \n你可以使用 `imap_append()` 函数向邮箱箱添加一条消息。它的原型形如下：\n\n```php\nint imap_append (int imap_stream,\
  \ string mbox, string flags\\])\n```\n\n第二个参数 `mbox` 是邮箱箱的全名，包括服务器部分。如果你想向用户 `~/mail`\
  \ 目录下的邮箱箱添加消息，可以写道：\n\n```\nimap_append (conn, ‘{host.example.org:143/imap}~/mail’,\
  \ ‘message’);\n```\n\n`flags` 参数是一个整数位掩码，其值可以是 0 或 `ST_UID`。如果使用 `ST_UID`，`imap_append()`\
  \ 将第二个参数视为 UID 而不是消息编号。\n\n\n\n\n\n```php\nprint (‘<form action=”’ . $_SERVER['SCRIPT_NAME']\
  \ . ‘“ method=”POST”>’); print (‘Mail server: <input name=”pop_server” type=”text”\
  \ />’); print (‘<br />Username: <input name=”pop_user” type=”text” />’); print (‘<br\
  \ />Password: <input name=”pop_pass” type=”password” />’); print (‘<br /><input\
  \ name=”submit” value=”Login” type=”submit” />’); print (‘<input name=”do_login”\
  \ type=”hidden” value=”1” />’); print (‘</form></body></html>’);\n\n}\n\nif (!isset\
  \ ($_POST['do_login'])) {\n\nprint_login_page ();\n\nA SAMPLE WEBMAIL APPLICATION\n\
  \n**607**\n\nexit;\n\n}\n\n// check to make sure we’ve got data\n\n$tmp =& $_POST['pop_server'];\
  \ // saves typing\nif (!isset ($tmp) || !strlen (chop ($tmp)))\n\n$errors[] = ‘Enter\
  \ your mail server (e.g. mail.example.com)’;\n\n$tmp =& $_POST['pop_user'];\nif\
  \ (!isset ($tmp) || !strlen (chop ($tmp)))\n\n$errors[] = ‘Enter your username’;\n\
  \n$tmp =& $_POST['pop_pass'];\nif (!isset ($tmp) || !strlen (chop ($tmp)))\n\n$errors[]\
  \ = ‘Enter your password’;\n\nif (isset ($errors)) {\n\nprint_login_page ($errors);\n\
  \nexit;\n\n}\n\n$mailbox = ‘{‘ . $_POST['pop_server'] . ‘:110/pop3}INBOX’;\n\n$username\
  \ = $_POST['pop_user'];\n\n$password = $_POST['pop_pass'];\n\n// try to log in;\
  \ if successful, register session vars & redirect user\nif ($c = @imap_open ($mailbox,\
  \ $username, $password)) {\n\nimap_close ($c);\n\nsession_start ();\n\nsession_register\
  \ (‘mailbox’);\n\nsession_register (‘username’);\n\nsession_register (‘password’);\n\
  \nheader (‘Location: pop_frames.html’);\n\nexit;\n\n}\n\n// otherwise something\
  \ went wrong; print the login page again\n\n$errors = imap_errors ();\n\nprint_login_page\
  \ ($errors);\n\nexit;\n\n?>\n```\n\n## 列表消息\n\n当用户提交图 19.2 所示的表单时，我们尝试登录远程服务器，如果登录成功，我们将他们的\
  \ POP3 用户名、密码和服务器主机名注册到会话变量，然后将他们重定向到一个框架集，在其中显示其远程邮箱的内容。该框架集是一个非常简单的 HTML 文档；其内容显示在列表\
  \ 19.5 中。\n\n![Image 107](img/index-633_1.png)\n\n**608**\n\n## 第 19 章\n\n### 电子邮件\n\
  \n#### 图 19.2\n一个非常简单的\n\nPOP 登录表单\n\n#### 列表 19.5：主框架集 (pop_frames.html)\n```html\n\
  <html\n\n<head>\n\n<title>POP 邮件客户端</title>\n</head>\n<frameset rows=”30%,70%”>\n\
  <frame name=”A” src=”pop_msglist.php”>\n您的浏览器不支持框架</frame>\n<frame name=”B” src=”pop_viewmsg.php”>\n\
  您的浏览器不支持框架</frame>\n</frameset>\n\n</html>\n```\n\n框架集顶部部分的内容由一个简单的 PHP 脚本 `pop_msglist.php`\
  \ 生成，该脚本（再次）登录用户的邮件服务器并获取用户收件箱中的消息列表。初始输出如图 19.3 所示；生成此消息列表的代码显示在列表 19.6 中。\n\n\
  ![Image 108](img/index-634_1.png)\n\n一个示例 WEBMAIL 应用程序\n\n**609**\n\n#### 图 19.3\n\
  用户收件箱中的\n\n消息列表\n\n#### 列表 19.6：消息列表 (pop_msglist.php)\n```php\n<?php\n\nsession_start\
  \ ();\n\n$mailbox = $_SESSION['mailbox'];\n\n$username = $_SESSION['username'];\n\
  \n$password = $_SESSION['password'];\n$conn = imap_open ($mailbox, $username, $password);\n\
  $inbox = imap_check ($conn);\n$messages = imap_fetch_overview ($conn, “1:” . $inbox->Nmsgs);\n\
  print (“<table border=0 cellspacing=4>\\\\n”);\nprint (“<tr bgcolor=”silver”>\n\
  <th></th>\n<th>Date</th>\n<th>From</th>\n<th>Subject</th>\n<th>Msg#/UID</th>\n<th>Seen</th></tr>\\\
  \\n”);\n$row = ‘<tr bgcolor=”silver”>\n<td valign=”top”%s</td>\n<td valign=”top”\
  \ nowrap=”nowrap”%s</td>\n<td valign=”top”%s</td>\n<td valign=”top”%s</td>\n<td\
  \ valign=”top”%d/%s</td>\n<td valign=”top”%s</td></tr’ . “\\\\n”;\nfor ($i = 0;\
  \ $i < $inbox->Nmsgs; $i++) {\n\n$m =& $messages[$i];\n$link = sprintf (‘<a href=”pop_viewmsg.php?msgid=%d”\
  \ target=”B”>View</a>’ $m->msgno);\nprintf ($row, $m->date, $m->from, $m->subject,\
  \ $m->msgno, $m->uid, $m->seen);\n}\n\nprint (“</table>\\\\n”);\nimap_close ($conn);\n\
  \n?>\n```\n\n**610**\n\n## 第 19 章 电子邮件\n\n### 查看消息主体\n\n下一步是显示消息正体。这部分有点复杂。代码位于列表\
  \ 19.7 中。为了解释此脚本的作用，这里有一个大纲：\n\n**1.** 如果没有获取 `msgid`，则直接退出；否则，继续步骤 2。\n\n**2.**\
  \ 使用 `imap_fetch_overview()` 连接邮箱并获取对象。\n\n**3.** 接下来，使用 `imap_structure()` 获取消息的正体对象。如果消息是简单的，该对象将不包含其他对象；相反，如果是多部分（multipart）消息，该对象将包含各个部分，这些部分构成了树结构。\n\
