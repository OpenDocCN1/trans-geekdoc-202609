  \ '')\n        flag_error (‘lastname’, ‘请输入您的姓。’);\n    if (trim ($p['username'])\
  \ == '')\n        flag_error (‘username’, ‘请输入用户名。’);\n    elseif (preg_match('/^[a-z0-9]+/',\
