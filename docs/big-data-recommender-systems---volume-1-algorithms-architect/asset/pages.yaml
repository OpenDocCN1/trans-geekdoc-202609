    # 4.3.2 Context-aware recommendation systems in IoT ecosystem


    In IoT ecosystems, modern embedded systems can exploit the advantages offered
    by context-aware and profile-driven recommendations. In fact, using data from
    IoT sensors as a context-aware computation and CARS are areas of increased research.
    It should be noted that the IoT architecture creates all the properties of a bigdata
    environment, name, volume, velocity and variety called the 4 Vs. Thus, data management
    and knowledge extraction requirements imposed by bigdata environments should be
    considered when designing CARS that will be utilized in IoT ecosystems. Most RS
    follow a request-response approach in which the recommendations are provided to
    the user upon their request. However, authors in [52] introduce a proactive RSS
    that are pushed to the user when the current situation seems appropriate, without
    explicit user request. The authors present a framework of CARS that recommends
    different types of items proactively under the IoT paradigm. A major part of the
    service is the context-aware management system which utilized a neural network
    that realizes the reasoning of the context to determine whether to recommend a
    response or not what type of items to recommend. The authors in [53] present a
    novel CARS which is based on a multi-agent system (MAS) solution for generating
    personalized recommendations on mobile devices with the use of contextual data
    acquired from an IoT environment. A server-side MAS architecture for bigdata processing
    is used in order to anticipate the data processing required for the personalization
    model preparation. Context-aware recommendations for very sparse data, based on
    different sensors and IoT information, are delivered with the usage of a factorization
    technique entitled CARS. In [54], the authors propose a mechanism for providing
    recommendations combining information from IoT ecosystems as well as Web Services
    and applications. The proposed algorithm considers qualitative attributes and
    semantic information of the venues (e.g., price and atmosphere), the profile and
    habits of the users for whom the recommendation is generated and the opinions
    of the users’ influencers. CARS that attempt to leverage on IoT frameworks have
    to face various challenges imposed by the existing weaknesses of the current IoT
    landscape. Given that IoT technology companies in many different IoT devices that
    cannot be easily integrated. Beside the data and platform interoperability challenge
    in IoT ecosystems, there is a lack of standards for authentication and authorization
    of IoT edge devices something that is particularly important when services are
    handling information about user’s behavior and personal preferences.'
