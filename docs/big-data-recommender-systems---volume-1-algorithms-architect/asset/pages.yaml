    The hyperbolic recommendation-known destination (HRKD) algorithm is a simple concept
    in approach as the HPR [20]. It begins with an already selected item by a user,
    sets a specific item goal, which corresponds to a marketing goal that the RS wishes
    to promote, and attempts to find a path starting with the item-source in the item
    graph. The item-product graph has been embedded in the hyperbolic space, which
    allows for very efficient discovery of the desired path via greedy routing over
    the hyperbolic coordinates. Thus, in this case, the path discovery does not take
    place with the traditionally demanding shortest path algorithms, but rather discovered
    by comparing distances of hyperbolic coordinates (Figure 4.3). The details of
    HRKD algorithm are described in [20], where the operation, complexity analysis
    and some implementation features are presented. Furthermore, performance results
    over a simulated system can be found in [20].


    In addition, [20] presents hyperbolic recommendation-unknown destination (HRUD),
    which is an extension of the previous approach, with the objective to lead the
    recommendation path to any of a set of desired items, rather than to a very specific
    one. This serves the goal of promoting a whole set of items to different users,
    by leading them towards the specific groups of items and having them selecting
    any of them. In this case, where more diversity is desired, social features from
    the user graph can be exploited to increase the efficiency of the recommendation.
    Rather than using an item source already chosen by a specific user, or in absence
    of such an item (when a user enters the system), the recommendation path can start
    with an item already chosen by a neighbor (in the user graph) of the user under
    consideration. Starting with such an item and dictated by social association,
    the recommendation path is again determined via greedy routing, selecting items
    items in the item graph, until one of the destinations is accepted by the user.
    If no such item is reached or no such item is accepted by the user, the recommendation
    is determined unsuccessful.


