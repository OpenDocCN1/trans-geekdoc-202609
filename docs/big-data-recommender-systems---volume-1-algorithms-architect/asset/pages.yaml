    # 2.3.2. CF recommenders


    Introduction


    CF recommenders are the most popular among other recommendation approaches [8].
    They recommend items to the user based on the ratings given to the items by similar
    users. For example, let us consider User A is similar to User B. So, if User B
    has liked Item A, then it is likely that User A would also like Item A. In this
    way, CF recommenders construct a matrix of items and users which represents which
    user likes what item. This matrix is used to compute similarity among users and
    predicted ratings of items by a certain user. Table 2.1 shows an example utility
    matrix. In matrix, Users A–D have rated products P1–P7 on a rating scale of 1–5.
    Notice, from this utility matrix, we can infer the similarity of users by seeing
    what ratings they have given products. As an instance, see User A and User B,
    they seem to like similar products like ‘P1’. So, they could be said similar to
    each other. Now, see User A and User C, they seem to give opposite ratings to
    P4 and P5. So, they could be said dissimilar to each other.


    However, we do not usually infer the ratings directly by looking at the table.
    The CF recommenders use different similarity measures to compute similarity among
    users and items, which we will discuss in the upcoming subsections.'
