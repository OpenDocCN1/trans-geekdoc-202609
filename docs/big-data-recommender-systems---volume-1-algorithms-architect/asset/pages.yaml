  md: "# 204 Big data recommender systems, volume 1\n\n![](img/6d0ce7dba01af52e1c2fae47d5b04a05_220_0.png)\n\
    \n# 9.3.4 Spatial smoothing\n\nTo combat the data-sparsity problem when considering\
    \ the temporal native preferences and temporal tourist preferences, we adopt a\
    \ quad tree structure called spatial pyramid, proposed in [13], to partition and\
    \ index the corresponding geographic area. The spatial pyramid is constructed\
    \ by partitioning locations into spatial regions of varying sizes at hierarchies.\
    \ More specifically, the spatial pyramid decomposes the space into H levels. Level\
    \ 0 has only one grid cell. For a given level $h$, the space is partitioned into\
    \ four grid cells of each area. Thus, the space is partitioned recursively into\
    \ numerous cells at different levels with different granularity. The graphical\
    \ representation of the spatial pyramid is shown in Figure 9.2.\n\nThe proposed\
    \ spatial pyramid structure can encode one important assumption in spatial data\
    \ mining. The assumption is that everything is related to everything else, but\
    \ nearby things are more related than distant things and has been proposed in\
    \ [37] as the first law of geography also known as the \"spatial autocorrelation.\"\
    \ The spatial pyramid structure can encode this law in an effective manner. Specifically,\
    \ each location $l$ in the spatial pyramid can be represented by a path from the\
    \ root to its corresponding leaf node. A vector is used to describe the path,\
    \ $(l_1, l_2, ..., l_h, ..., l_l)$, where $l_i$ is a grid at level $i$ that contains\
    \ the location $l$. The proximity between two locations can be computed with the\
    \ vector representation of locations. The basic idea is that, if two locations\
    \ in the spatial pyramid share more ancestors, then these two locations are more\
    \ proximate.\n\nIf user activity data at location $l$ and time $t$ are very sparse,\
    \ the temporal native preference $\theta_{l}^{native}$ and the temporal tourist\
    \ preference $\theta_{l}^{tourist}$ may not be estimated accurately. To address\
    \ this issue, we exploit geographical correlation to enhance the prior knowledge\
    \ about the model parameters $\theta_{l}^{native}$ and $\theta_{l}^{tourist}$.\
    \ Intuitively,"
