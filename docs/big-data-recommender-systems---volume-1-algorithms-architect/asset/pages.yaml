    # 14.2 Related works


    # 14.2.1 Network intrusion detection systems (NIDSs)


    Network intrusion detection systems (NIDSs) play an important part of any network
    security architecture with the rise of fraudulent activities like spam emails
    and malware attack. There is a huge amount of network traffic accumulated by day.
    A manual way of monitoring the connection records has become impossible. The inefficiency
    of conventional methods in monitoring the network records resulted in several
    cyberattacks. Cyberattacks are launched by a computer or group of computers against
    a network, a computer or multiple computers. The goal of these attacks is to disable
    the target computer or to get admin privileges to control the system. Attackers
    achieve these goals by the malicious software, phishing URL, promised network
    which is often called as man-in-the-middle-attack. The solution to this situation
    is to develop a strong IDS. An IDS continuously monitors the network records and
    alerts the system administrator or network administrator of malicious activities.
    By the conventional methods like signature-based detection system rely on human
    intervention to thwart the different kinds of attacks.


    Signature-based detection systems compare the network traffic features with the
    set of existing signatures in the database. If the signature matches then those
    connection records are blocked. The main drawback of the signature-based detection
    system is its inefficiency in detecting new kinds of attacks. Other means of detecting
    intrusions follows anomaly-based detection. Even though these can detect new kinds
    of attacks but often result in high FPRs. This situation calls for an automatic
    detection of malicious connection records and prevents them from affecting the'
