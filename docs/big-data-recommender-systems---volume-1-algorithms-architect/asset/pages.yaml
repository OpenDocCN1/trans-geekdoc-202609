    # 9.7 Conclusion


    In this chapter, we proposed an ST-SAGE model for spatial item recommendation,
    which effectively overcomes the challenges arising from travel locality and spatial-temporal
    dynamics of user behaviors. Specifically, to combat travel locality, ST-SAGE exploited
    both the co-occurrence patterns of spatial items and their content to infer and
    transfer user items. To address spatial dynamics of user behavior, ST-SAGE incorporated
    the native tourist preference at the target location. To combat the data sparsity
    in modeling the temporal dynamics of user behaviors, we enhanced the model with
    smoothing by taking advantage of the temporal preferences of the crowd of similar
    users. To alleviate the data sparsity confronted by the inference of temporal
    preferences and tourist preferences for each region, ST-SAGE employed an additive
    framework to smooth the preferences over a well-designed spatial pyramid. We developed
    a scalable and parallel learning algorithm for ST-SAGE based on the GraphLab framework
    to improve the efficiency of the model training, and efficient top-k query techniques
    (i.e., TA) are employed to speed up the process of online recommendation. We conducted
    extensive experiments to evaluate the performance of our ST-SAGE model on real
    datasets. The experimental results reveal the advantages of ST-SAGE over other
    spatial recommendation methods, for both out-of-hometown and hometown recommendations
    in terms of both recommendation effectiveness and efficiency, which demonstrate
    the effectiveness of ST-SAGE in facilitating travel for users in their hometowns
    as well as in regions they are not familiar with.


