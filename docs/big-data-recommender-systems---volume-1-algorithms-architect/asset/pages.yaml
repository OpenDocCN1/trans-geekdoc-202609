    # 6.4 Deep generative models


    The CTR (Section 6.2.4) is a robust model that integrates LDA and PMF into a unified
    framework for recommendation. Being said, the performance of CTR strongly depends
    on the representation capability of the LDA topic model. Unfortunately, the latent
    representation learned by LDA is not effective when the auxiliary information
    is very sparse. The previous section showed that DL models are extremely good
    in learning the representations of data. When it comes to recommendation, PMF
    and its variants still reign as the state-of-the-art techniques due to their ability
    to capture and learn implicit relationship between items (and users) [32]. This
    necessitates the integration of generative and DL models to create a unified framework
    that can provide the best of both worlds. To this, we introduce two most recent
    papers on generative DL, CDAE [13] and CVAE [14].


    # 6.4.1 Collaborative denoising autoencoders


    The CDAE [13] is a hierarchical Bayesian model that bridges the gap between generative
    models and DL for recommendation. Figure 6.8 shows the graphical structure of
    CDAE, which is composed of two parts: (a) a stacked DAE (AAE) [33] and (b) the
    PMF component. The DAE is a feedforward neural network for learning representations
    (or encoding) of the input data. Similar to AEs, the DAE has an input layer, a
    hidden layer, and an output layer. The difference between these two models lies
    in the input layer, where, in DAE, the input is corrupted before passed to the
    network. The AE is then trained to reconstruct the original corrupted version.
    Figure 6.8(a) shows the graphical structure of CDAE and (b) explains that $W$
    denotes the weights of the neural network, $X_c$ is the corrupted data (i.e.,
    the input layer) and $X_0$ is the original data of $J \times S$, $J$ is the number
    of items and $S$ is the size of vocabulary. The input $X$ is usually textual contents
    of items such as product reviews and images. $l$ indicates a specific layer of
    the neural network, $L$ is the total number of layers and $\{g_1, \dots, g_L\}$
    are the'
