  md: '# Chapter 4


    # Efficient and socio-aware recommendation approaches for bigdata networked systems


    Vasileios Karyotis¹, Margarita Vitoropoulou¹, Nikos Kalatzis¹, Joanna Roussaki¹,
    and Symon Papavassiliou¹


    In this chapter, we present several approaches designed for providing efficient
    recommendations in large web systems characterized by big scales. The key feature
    of the considered approaches is that they all rely on different elements and properties
    of social/complex network analysis for addressing various deficiencies of legacy
    and current recommendation systems when very large operational scales emerge.
    The main challenges of recommendations addressed by the presented approaches are
    the diversity (novelty) of recommendations, the cold-start problem, scalability
    and noise filtering issues, as well as the efficiency of developing these approaches
    and integrating them in operational systems. This chapter aspires to provide an
    educated overview, leading to a solid fundamental background on how social/complex
    network analysis can be exploited for more effective recommendations in stringent
    environments characterized by large scales of users, items and data, cumulatively
    referred to as big network data. Furthermore, our work aims at highlighting the
    design principles that are more interesting for enabling the extension of the
    presented approaches and their combination with other current state-of-the-art
    techniques, leading to more socio-aware and efficient recommendation approaches
    in the near and longer term future.


    # 4.1 Introduction


    The proliferation of network infrastructures, user devices and software technologies
    have enabled the development of very large interconnected systems offering diverse
    products and services, enabling social activities, with characteristic examples
    including many Amazon, Google, Facebook and Twitter. The number of users in such
    systems has grown rapidly, reaching the order of billion users in many cases,
    while for each user data is maintained regarding his/her profile, activity, behavior
    and other information relevant to marketing or system-maintenance


