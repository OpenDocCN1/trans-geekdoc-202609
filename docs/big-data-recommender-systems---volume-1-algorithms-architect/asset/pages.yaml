    # 12.2.1 Privacy: definition


    Increased utilization of information technology and communication has had a major
    effect on the connections between individuals. This is predominantly related to
    individuals who use of transportable machines to interconnect with one another
    or connect the World Wide Web [11]. The word privacy has numerous subtly definitions.
    These can vary from “personal privacy” to “information privacy” from one place
    to another, which privacy alone is being used for multipurpose on the Internet
    [12]. Table 12.1 shows some definitions for privacy and information privacy.


    Meanwhile, the notion and idea of privacy is varied, one particular description
    of privacy cannot cover all characteristics of the phrase. Accordingly, based
    on the meaning of privacy, this is concerned principally with information privacy
