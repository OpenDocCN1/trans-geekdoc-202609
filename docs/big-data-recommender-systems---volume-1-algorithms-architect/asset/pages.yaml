    # 7.2.1.2 Text recommendation using an angle-based interest model


    An interest model consisting of two kinds of angle is suggested by Xu et al. [13]:
    persistence and pattern which are able to unite and form complex angles. The model
    makes of a new method to signify the long-term interest and the short-term interest;
    it also discriminates the interest in object and in the link structure of objects
    [13]. Extracting the data that stands for the interest of the texts, in the history
    of reading, what they aim to achieve. They will do so by a text-scanning mechanism
    that considers the following point:


    +   * Simulating the human reading features to emerge interest

    Link is a way to emerge interest in reading. On one side, a link is undeniably
    able to raise the chance of creating a new interest from one. The text scanning
    mechanism knows how to simulate the association process which exists in the human-reading
    process. On the other side, people undoubtedly will create impressions on the
    objects in text, and afterward they link the impressions throughout association
    in order to comprehend the text [14]. What associations are able to do is they
    develop the interest made of linked objects.

    * The data structure for calculating the angles of interest


    A weighted graph is used by data structures which is responsible to compute the
    angles of interest; it records and calculates interests where nodes are indicators
    of objects and undirected edges are indicators of associations. Interest consists
    of two weights: short-term weight represents the degree related to a short-term
    interest or edge, and the long-term weight represents the degree related to the
    long-term interest. Construction of the interest graph is totally based on the
    dynamic growth of reading history. Limitation in the amount of nouns or phrase
    is a reason of the small-sized graph.

    As shown in Figure 7.2, by scanning every text in reading history, the interest
    graph will be more enhanced. We add extracted edges and objects in every text
    and put them into the graph if they have not come into view earlier. Accretion
    assumption and proximity distribution assumption are considered by the computation
    of the short-term weight. The preceding weights will be updated immediately after
    scanning a text. Superior weight is the reflection of stronger short-term interest
    or long-term weights. The nodes with comparatively greater short-term or long-term
    weights in the interest graph are the indicator of the short-term (or long-term)
    interested objects. The connection between the objects in the text and objects
    in the interest graph is established by the degree in which a text meets the short-term
    (or long-term) object. Each interest has three different features: size of intersection,
    the short-term (or long-term) weights related to the objects in the intersection
    and the times which common objects appear in the text. To assess the degree of
    a text meeting the short-term (or long-term) object interest, a variable node
    match degree is used and its computations of three features. If we consider the
    short-term (or long-term) weight as a second attribute, it will assess the degree
    of the short-term or long-term object interest; accordingly a text contains two
    node match degrees, both having an interest graph. Node matches with a high degree
    are indications of stronger interest in objects.'
