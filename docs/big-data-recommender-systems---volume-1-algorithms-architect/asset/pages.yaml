    be identified which cell will be equal to 1 and which cell will have a zero value).
    The final equation for calculating the visibility is as follows:


    ```

    $V(k,l) = \frac{|R_k|}{M} \frac{|R_l|}{m} \quad (12.6)$

    ```


    The final privacy score based on Srivastava is given by


    ```

    $PQ(j) = \sum_{k} \beta_k V(k,l) \quad (12.7)$

    ```


    where the range of attributes can be $[1,m]$. The final privacy score gained from
    the calculation indicates the potential privacy risk of the texts which have been
    shared and published by users in online social networks.


    # Privacy-functionality score


    Domingo-Ferrer et al. [44] proposed a method for measuring the privacy risk of
    users in social networking sites. In a more specific manner, they tried to understand
    the benefits that users may obtain by sharing their information in online social
    networks, such as LinkedIn. By doing so, they computed the effectiveness that
    an individual may gain from sharing his/her information in social networks given
    by


    ```

    $PRF(j) = \frac{\sum_{i''=1}^{N_{j''}} \sum_{k=1}^{N_{i''j''}} \beta_k V(i'',j'',k)I(i,j'',k)}{1+PR}
    \quad (12.8)$

    ```


    ```

    $PRF(j) = \frac{\sum_{i''=1}^{N_{j''}} \sum_{k=1}^{N_{i''j''}} \beta_k V(i'',j'',k)I(i,j,k)}{1+\sum_{i''=1}^{N_{j''}}
    \sum_{k=1}^{N_{i''j''}} V(i'',j,k)} \quad (12.9)$

    ```


    With the following conditions:


    +   * $I(j,j'',k) = 1$ if $j''$ and $j$ are links from each other

    * 0 otherwise


    where $j$ and $j''$ are the users in the social networks, $k$ indicates the number
    of links between users and $n$ indicates the number of attributes for a user.
    By applying this formula, we become able to decide what to share with other users
    at a specific time while maintaining the effectiveness of shared information in
    the desired social network.


    # SONET: privacy monitoring and ranking


    Nepali and Wang [45] introduced a monitoring and ranking model for privacy in
    the online social network. Six components formed the SONET model. These components
    comprise the model for the social network, browse and deduce data by aggregation,
    privacy index (which is known as PIDX) and privacy invasion, privacy-preserving
    and security protection, and finally, monitoring and countermeasures that can
    be done regarding privacy breaches. The main component of the model is the PIDX
    which computes the privacy exposure of individuals based on sensitivity and visibility.
    Based on Nepali and Wang, the PIDX is a factor of an entity’s privacy'
