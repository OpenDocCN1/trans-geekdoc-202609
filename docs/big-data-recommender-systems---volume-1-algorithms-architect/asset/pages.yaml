    # ### 4.3.4 Context-aware recommendation systems and social networks


    User text and SN data have recently attracted much attention as it has been proven
    to be a valuable combination of information for improving accuracy of RSs. However,
    understanding user text and emerging community structures through knowledge extraction
    approaches is often a complicated task as relevant collections of raw data are
    of unprecedented growth, noise, uncertainties and complexities. As it is already
    stated in Section 4.3.4.1, CF approaches aim to level similarities over the behavior
    of users who share common characteristics. One of the first approaches that enhanced
    CF RSs with context information is presented in [55]. The system was able to predict
    a user''s preference in various contexts based on past experiences of other like-minded
    users who performed various actions in similar context. The system was able to
    automatically evaluate the influence of context on an activity, while adaptation
    of Pearson''s correlation coefficient used to measure the correlation between
    two different contexts with respect to their user ratings.


    The authors in [56] propose a CARS that operates processed SN information. Context
    is handled through the application of random decision trees, in order to partition
    the original user-item rating matrix and group ratings with similarities. Predictions
    of a user''s missing preference for an item are measured through matrix factorization.
    SN information is incorporated through an additional social regularization term
    that allows to constrain difference between a user and his/her friend to take
    into higher consideration (with an increased weight) friends with similar tastes.
    Similarity between the user and his/her friends is measured by past rating patterns,
    i.e., characteristics of the items that both users have commonly rated. The PCC
    [57] is utilized for similarity evaluation as it has been proven to be more accurate
    than similarity-aware approaches. Similarity of $u_i$ and his/her $u_j$ is calculated
    as


    $S(j,f) = \frac{\sum_{v \in V(i) \cap V(j)} (R_{i,v}-\hat{R}_v)(R_{j,v}-\hat{R}_v)}{\sqrt{\sum_{v
    \in V(i) \cap V(j)} (R_{i,v}-\hat{R}_v)^2} \sqrt{\sum_{v \in V(i) \cap V(j)} (R_{j,v}-\hat{R}_v)^2}}
    (4.2)


    where $v \in V(i) \cap V(j)$ is the set of items that $u_i$ and $u_j$ have commonly
    rated, and $R_i, R_j$ are the average ratings of $u_i$ and $u_j$, respectively.
    Similarity calculation is enhanced with contextual information through a context-aware
    version of PCC:


    $S_c(j,f) = \frac{\sum_{v \in V(i) \cap V(j)} w_v(R_{i,v}-\hat{R}_v)(R_{j,v}-\hat{R}_v)}{\sqrt{\sum_{v
    \in V(i) \cap V(j)} w_v(R_{i,v}-\hat{R}_v)^2} \sqrt{\sum_{v \in V(i) \cap V(j)}
    w_v(R_{j,v}-\hat{R}_v)^2}} (4.3)


    and the weight $w_v$, of each item $V_v$, is calculated based on


    $w_v = \frac{N(pcc_v)}{\sum_{v'' \in V(i) \cap V(j)} N(pcc_{v''})} (4.4)


    where the function $N(-)$ normalizes the given value to the range [0,1], and $pcc$,
    represents the PCC between $u_i$''s rating $R_v$ and $u_j$''s rating $R_v$ on
    the same item $V_v$.'
