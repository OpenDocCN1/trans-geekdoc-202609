    # 4.3 Socio-aware recommendation systems


    In this section, we present each of the family of socio-aware approaches that
    adopt elements from SNA for improving the performance, scalability, or other factors
    of RS operation. We refer to cumulatively as "socio-aware," even though the use
    of social features can be different, e.g., social structure, social properties
    and context information.


    # 4.3.1 Hyperbolic path-based recommendation system


    Nowadays, in many online systems, it is required to add diversity to the users,
    in order to increase the potential of promoting items with less popularity. This
    is especially required in very large-scale systems, characterized by bigdata order
    of magnitude, where the quantity of items available is prohibitive for detailed
    inspections, and the thematic areas of items are voluminous and diverse as well.
    The approach presented in this submission aims addressing this aspect of socio-aware
    recommendations in big network data environments.


    The main concept in this approach, which we refer to hyperbolic path-based recommendations
    (HPR), and it is depicted in Figure 4.3, is to cast the recommendation problem
    as a (path) routing problem over the item graph, after the latter has been embedded
    in the hyperbolic space.¹ A fundamental assumption is that knowledge on the interactions
    among items and users can be represented in graph form. Items corresponds to the
    nodes of the item graph and the users to the user graph. Links between pairs of
    users are determined according to a similarity function, which may correspond
    to any type of social, marketing, or other possible associations between users
    and could be of potential interest/use in the recommendation of items. Similarly,
    links between pairs of items are determined according to a different similarity
    function, which also indicates some type of association of items with respect
    to users and their preferences. A characteristic example of this association is
    the co-view metric employed for videos, defined as the ratio of number of times
    that two videos have been viewed independently and indicates that two videos will
    be both selected for viewing by a user. Links connecting items with users can
    be defined and represent the times a user has selected a specific item, creating
    a two-layer


    > Hyperbolic network embedding consists of the assignment to each node of a graph
    with coordinates in the hyperbolic space denoting its location, so that distances
    of node pairs in the hyperbolic space approximate the corresponding node distances
    measured in hops in the original graph [19]. From this mapping, the shortest path
    geometric distances between the nodes can be calculated more efficiently based
    on the hyperbolic coordinates, rather than computing shortest paths in the original
    graph.'
