    (3) defining Fuzzy-Ontology elements, (4) formalising fuzzy elements and (5) validating
    fuzzy ontology. The proposed structure of Hybrid Integration Development Approaches
    (HIDAs) for Fuzzy-Ontology for big data is shown in Figure 5.3.


