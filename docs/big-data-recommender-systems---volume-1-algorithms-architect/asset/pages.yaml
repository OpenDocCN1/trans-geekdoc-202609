    ![](img/6d0ce7dba01af52e1c2fae47d5b04a05_339_0.png)\n\nFigure 14.6 Data representation\
    \ in the form of tensor\n\n**Definition 14.2.** (Geometric average mass [32]).\
    \ The geometric average mass of block B of a relation R is defined as $\rho_{geo}(B,\
    \ R) = M_B/V_B^{(1/N)}$.\n\nThe density measure (Definition 14.3) is the negative\
    \ log likelihood of MB. The fundamental assumption used is the value on each cell\
    \ (in the tensor representation) of R follows a Poisson distribution. This has\
    \ been found in fraud detection [53].\n\n**Definition 14.3.** (Suspiciousness\
    \ [53]). The suspiciousness of a block B of a relation R is defined as $\rho_{susp}(B,\
    \ R) = M_Blog(M_B/M_R) + M_RV_B/V_R - M_Rlog(V_B/V_R)$.\n\nThe notations are $M_B$\
    \ Mass of B, $M_R$ Mass of R, $V_B$ Volume of B, $V_R$ Volume of R, $N$ the number\
    \ of dimension attributes in a relation, $S_B$ is the size of 'block B' and $\r\
    ho(B)$ is the density of block in R.\n\n# 14.5.2 Problem formulation\n\nIn this\
    \ work, the task of detecting intruders is modeled as a tensor-based unsupervised\
    \ learning problem. The key part is the arrangement of data in the form of a tensor.\
    \ We have used 7 features out of 41 features in the KDD-Cup-99 data and count\
    \ (no of a particular feature 7 features have repeated). These feature F = f1,f2,...,f7\
    \ act as the seven dimensions of tensor. Each location of the tensor is filled\
    \ with the count value. For connection records that are malicious, the count value\
    \ will be higher, or in other words, dense connection represent fraudulent activities.\
    \ So the task finally boils down to finding $k$ dense subtensors from the original\
    \ tensor."
