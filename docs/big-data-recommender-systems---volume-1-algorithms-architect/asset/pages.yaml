  md: '# Deep learning architecture for big data analytics in URL detection 319


    +   3. Convolution layers


    CNN architecture captures the spatial dependencies. The CNN architecture includes
    convolutional layers followed by max-pooling layers. The architecture of CNN we
    propose a convolution 1D layer containing 32 filters with filter length 3. The
    output of the convolution 1D layer is passed to the max-pooling 1D layer. The
    max-pooling 1D layer contains a pool length of 2. The max-pooling 1D output is
    flattened to a vector and passed to a fully connected layer with 1 neuron with
    sigmoid activation function (since it is a binary classification problem).


    +   4. DNN


    The architecture for DNN used in the experiments consists of a five-layer DNN
    with 512, 256, 126, 64, in the first, second, third, fourth hidden layer and output
    layer, respectively.


    +   5. Regularization


    Dropout plays a crucial role by avoiding overfitting. The dropout removes the
    neurons randomly while training deep learning model. In the proposed architecture,
    a dropout of 0.1 between deep layers and fully connected layers. The same dropout
    of 0.1 is used while training RNN, CNN, LSTM. The experiments when excluding dropout
    results in overfitting.


    +   6. Classification


    The probability that whether a URL is malicious or not found using the sigmoid
    function has values in the range [0,1]. The equation for the sigmoid function
    is as:


    ```

    $a = \frac{1}{1 + \exp(-x)}} (14.15)

    ```


    The loss function used is binary cross entropy function.


    ```

    $loss = -\frac{1}{N} \sum_{i=1}^{m} (y_i \times log(a_i) + (1 - y_i) \times log(1
    - a_i)) (14.16)

    ```


    where $a$ is the predicted probability and $y$ is the true label, $m$ is the total
    training examples. To minimize the binary cross entropy, we use adam optimizer.


