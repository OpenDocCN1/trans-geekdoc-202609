    # 4.3.2.3 Ordinal random fields


    An interesting observation for RSs, in general, is that users are not good at
    making consistent quantitative judgment, namely, they are not consistent with
    the same numerical rating for the same item at different times, ordinal preferences,
    i.e., relations over items, such as item- best, second best, among a set of items,
    are considered to be more consistent than like-liked users. Ordinal matrix factorization
    (OMF) [26] has been suggested as an effective method in the past. In contrast
    to numerical-ranking-based methods, OMF needs weaker assumptions when user preferences
    now represent the ordering of items. The two graphical-based approaches presented
    before, namely, the PMRF and PNs, both considered numerical user preferences.


    The work in [23] develops a unified model, denoted as ordinal RFs (ORF) combining
    elements OMF and previous MRF-based techniques. ORF model can employ any OMF representation
    and focuses on the local structure of the system, namely, on the second order
    interactions between similar users or items, also using neighborhood-based collaborative
    filtering. At the same time, it can capture the global structure as well, i.e.,
    the weaker interactions among all users and items. In general, the OMF aims at
    obtaining the ordinal distribution $Q(r_{ui}|u, i)$'
