    items that are high on the corresponding factors. The “u’s rating of item $i$
    is $r_{ui}$, which indicates the preference by user $u$ of item $i$. Higher $r_{ui}$
    values mean stronger preference, and the goal of MF is to predict the unknown
    ratings. The prediction is done by taking an inner product, $\hat{r}_{ui} = x_u^T
    y_i$. The major challenge MF is dealing with “i” to compute the mapping of each
    user and item to factors $x_u, y_i \in \mathbb{R}^f$. To learn the vectors $(x_u$
    and $y_i)$, the training is performed by minimizing the regularized squared error
    on the set of known ratings:


    ```

    $$\min_{x_u, y_i \in D} (r_{ui} - x_u^T y_i)^2 + \lambda (||x_u||^2 + ||y_i||^2)$
    \quad (7.10)$

