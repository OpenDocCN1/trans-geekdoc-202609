    # Theoretical foundations for recommender systems


    Mirza Zaeem Baig¹,, Hasina Khatoon¹, Syeda Saleha Raza², and Muhammad Qasim Pasta³


    # 2.1 Introduction


    Recommender system (RS) is software that provides suggestions to a user in decision-making
    process. The decision-making may be for commercial purpose (What things to buy?),
    for personalized applications (What movie to watch and which music to listen to?),
    or simple information retrieval (What are the most relevant papers for the topic?).
    These systems have become an important component of almost all applications that
    relate to some form of information retrieval and processing by various search
    techniques. This chapter provides the background to the theoretical foundations
    of RSs. We start with a traditional approach and discuss some commonly defined
    definitions of RSs. After justifying the need for such systems in the current
    scenario of information overload, application areas where RSs can be useful and
    productive are discussed. The list presented is not exhaustive, as many areas
    of applications are discussed. have opted to add to their applications by integrating
    with some form of RS. The next section gives a brief overview of the phases through
    which RS passes in order to perform its function. The types of RSs are discussed
    giving their advantages and disadvantages, and content-based recommenders, collaborative
    filtering (CF)-based recommenders, hybrid recommenders, image-based recommenders,
    and graph database (GDB)-based recommenders are discussed in detail. After a brief
    overview of the problems identified with the current RSs, some datasets are listed
    that may be used for research and evaluation of various RSs. The chapter ends
    with the cited references.


    ¹Department of Computer Science, National University of Computer and Emerging
    Sciences (FAST-NU), Pakistan


    ²Dhanani School of Science & Engineering, Habib University, Pakistan


    ³Department of Computer Science, Usman Institute of Technology, Pakistan'
