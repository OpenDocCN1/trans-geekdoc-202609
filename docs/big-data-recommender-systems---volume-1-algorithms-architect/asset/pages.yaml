    # 5.5.1.2 Architectural patterns as development standards


    Most components of DI approaches fall into one of three broad categories: (1)
    servers, (2) interfaces and (3) data transformations. DI architecture is simply
    the pattern made when servers relate through interfaces. The point of an architectural
    pattern is to provide a holistic view of both infrastructure and the implementations
    built it so that people can wrap their heads around them and have a common vision
    for collaboration. Also, when inheriting someone else''s work, get to speed faster
    when they have followed development standards and established patterns. Well-run
    organisations have development standards, and architectural patterns should be
    among those.


    +   - Sim for reuse and consistency: As development and architectural patterns
    are applied to multiple DI projects, the result is simplicity, which fosters the
    reuse of DI development artifacts (like jobs, routes, data transformations, interfaces),
    which in turn increases consistency in the handling of data.

    - Harmony between common infrastructure and individual solutions: For a solution
    (like a data flow or project) to be organised in a preferred architecture, the
    infrastructure (especially the DI production server and the interfaces it supports)
    must enable that.


