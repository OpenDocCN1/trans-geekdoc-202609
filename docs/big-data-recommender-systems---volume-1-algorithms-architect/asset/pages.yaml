    $\ell$ is the sequence length, the most probable next action is identified based
    on VOMC by maximizing the respective probability:


    ```

    $d_{seq}^k = \argmax_{a_{seq} \in A} [P[a^k|d]] = \argmax_{a_{seq} \in A} \left\{
    \frac{N(a^k \cdot \dots \cdot a^{k-\ell})}{N(a^{k-\ell} \cdot \dots \cdot a^{k-1})}
    \right\}$ (4.5)

    ```


    Given an update of user''s situation, the most probable user interaction in a
    current snapshot described by $s^k = [c_j^k | j = 1, \dots, \ell]$, is estimated
    by the NB model through maximization of the respective probability:


    ```

    $d_{sit}^k = \argmax_{a_{sit} \in A} [P[a^k|s^k]] = \argmax_{a_{sit} \in A} \left(
    P(a^k) \times \frac{\prod_{j=1}^{\ell} P(c_j^k)}{P(s^k)} \right)$ (4.6)

    ```


    Combining the two approaches, each outcome is weighted on the number of occurrences
    contributed in probability calculation. The interaction predicted based on both
    inputs is estimated by


    ```

    $a_{comb}^k = \argmax_{a_{comb} \in A} [w_{sit} \cdot P[a^k|s^k] + w_{seq} \cdot
    P[a^k|d]]$ (4.7)

    ```


    where $w_{sit}$ and $w_{seq}$ reflect the amount of history records used for the
    situation and sequence based user interaction prediction. Evaluation of the proposed
    approach with real datasets described [60], yielded satisfactory results especially
    in cases where users with no previous interaction histories were utilizing the
    community''s history log with the hybrid prediction mechanism in support of their
    personal predictions.


    Combining social media information along with context for improving recommendations
    is a promising approach; however involves various challenges. One important aspect
    is that often neglected is the issue of the privacy of the users. Collecting and
    processing interactions not only from the online behavior of the users (e.g.,
    social media) but also from real life activities (e.g., context types such as
    user''s location, physical activities, mood) poses serious threats to users''
    privacy. Applying the appropriate privacy protection mechanisms often increases
    the complexity but necessary overhead to the overall functionality. Beyond user
    privacy risks, recommender systems are also vulnerable to security threats. For
    example, although application of CARS in e-commerce services, at the same time
    it vulnerable to profile injection attacks, also known as “shilling attacks” [61].
    The attacker (e.g., malicious users, competing vendors) attempts to insert fake
    profiles into the user-item matrices to alter the predicted ratings on behalf
    of their advantages. Although, there are various approaches to detect and confront
    this kind of attacks, such security challenges should be considered during the
    design of CARS rather than trying to apply possible protection mechanisms on the
    top of the service.'
