    for rating prediction. AutoRec takes user personal vectors $r^{(u)}$ or item partial
    vectors $r^{(i)}$ as input and reconstruct them at output layer. Based on the
    input, it has two variants, i.e., Item-based AutoRec (I-AutoRec) and User-based
    AutoRec. Figure 6.6(c) gives an illustration of I-AutoRec. Given the input $r^{(i)}$,
    AutoRec encodes it to latent representation'
