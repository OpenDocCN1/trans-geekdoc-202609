    # 14.7 Proposed architecture for machine learning based cybersecurity


    In computer security, there is an ever-growing use of computer technology, this
    makes it important in our society. As per the national statistics 2008, 65% of
    all households in the United Kingdom were connected to the internet, which is
    approximately 16 million households (National Statistics 2008). Also, recent years
    have shown a rapid increase in the amount of computer malware. There is always
    a risk associated with computer user, even if the system is not connected to the
    internet. Also, an unattended system is always prone to unauthorized access and
    misuse of the system. If the computer is connected to a network or, the risk of
    attacks increases to a greater extent. In this situation, any computer can be
    accessed remotely by any user around the world and attempt to access personal
    and confidential information. These attacks are commonly carried out by intrusions,
    phishing URLs. In order to tackle the increase in intrusions, phishing URLs, we
    propose a cyber threat situational awareness platform for an organization. The
    high-level architecture of the proposed system is shown in Figure 14.9.


    +   - The prototype model uses deep learning and ML algorithms.

    - Due to the difficulty of supervised learning technique for getting annotated
    data, the prototype also introduces unsupervised learning techniques.


    ![](img/6d0ce7dba01af52e1c2fae47d5b04a05_347_0.png)


    Figure 14.9 Proposed architecture for machine learning based cybersecurity'
