    a tool for defining linkage workflows, which include both matching and blocking
    (indexing) steps is provided. In [23], a parallel privacy preserving blocking
    technique based on locality sensitive hashing (LSH) is presented. LSH is used
    for blocking as it provides the means of a fast comparison functionality by separating
    vectors in chunks that contain similar items. The authors combine LSH with Bloom
    filters over a MapReduce framework. Similarly, Frank et al. [24] also use Spark
    for blocking. These works can be viewed as complementary to ours, since we focus
    on the matching part of the PPRL process, and deploying an efficient blocking
    technique would improve the overall performance. In [25], Hadoop with MapReduce
    is used for providing a one-to-one matching process for data of different types.
    Given the fact that Spark offers many advantages against Hadoop [26], it is evident
    that utilizing Spark comes a promising research direction. Pt et al. [27] present
    a first approach that exploits the Spark platform to create data marts for the
    Brazilian Public Health System using large databases from the Ministry of Health
    and the Ministry of Social Development and Hunger Elimination. They use the bloom-based
    method of Schnell et al. [16] for privacy preservation inheriting the weaknesses
    we outlined above.


    A first approach to parallelizing the original work of [3] is presented in [6].
    However, in this chapter, we propose using two different encoding algorithms as
    to improve the quality of the matching results, while exploiting the Spark architecture
    so as to compromise performance.


    # 13.3 Problem formulation and background


    In this section, we formally define the problem we are solving and present the
    details of the building blocks that comprise our solution.


    # 13.3.1 Problem formulation and notation used


    Without loss of generality, let us consider two data sources, called Alice ($A$)
    and Bob ($B$), respectively, we hold $r^A$ and $r^B$ records each. We denote as
    $r^A_j$ and $r^B_j$ the $j$th attribute of these records as Alice and Bob''s respectively.


    PPRL is the problem of identifying (linking) all pairs of $r^A$ and $r^B$ records
    that refer to the same real-world entity, so that no information is disclosed
    to either A, B or any third party involved in the process besides the identifiers
    of the linked $r^A_s$ and $r^B_s$.


    Alice and Bob will use different schemes in their databases. As such, they will
    have different attributes. Let $R^A$ be Alice''s schema and $R^B$ be Bob''s schema,
    and let us assume that in these schemes, $m$ of the attributes are common between
    the two sources forming a composite key. These attributes might be names, surnames,
    addresses, birth dates. As such, none of these on its own may comprise a unique
    identifier that can be used to identify a record. We refer to these attributes
    as matching attributes or matching fields. The composite key is used to determine'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Private entity resolution for big data on Apache Spark 287


    when two records match, i.e., when they refer to the same entity. To determine
    when two records match, the respective attributes forming the composite key need
    to be compared. Considering that our data is often dirty, matching should rely
    only on a similarity or distance function.


    Let us consider a similarity function $\sim() \to [0, 1]$ and a threshold $t_i
    > 0$. Given the records $r_i^A$ and $r_j^B$ matching attributes $r_1, \dots, r_m$
    for both Alice and Bob, we define the matching function $M \to [0, 1]:


    ```

    $$\begin{cases} \sim(r_i^A, r_j^B) \ge t_i, & \forall j \in [1, m] \ \text{otherwise.}
    \end{cases}$ $\quad (13.1)$

    ```


    If $M(r_i^A, r_j^B) = 1$, then the pair $(r_i^A, r_j^B)$ is considered a possible
    match. Appropriately tuning the threshold ensures an accurate match with a low
    false positive rate.


    This process is the matching process. To preserve privacy, i.e., ensure PPM, after
    the completion of this process, the only information reveals the identifiers of
    the matched records.


    # 13.3.2 Phonetic algorithms for privacy preserving matching


    A phonetic algorithm is an algorithm that maps a word to its phonetic equivalent.
    Such methods have been broadly used in the past for supporting approximate matching
    on names [28]. Their operation is quite straightforward: for each word to be encoded,
    rules for grouping similar sounds are applied, resulting in a reduced character
    string stands for the pronunciation of the respective word. For instance, for
    the Soundex algorithm, this reduction consists of a capital letter followed by
    three digits. For example, word "Cooper", in Soundex is converted into C160.


    An interesting property of all phonetic codes is that of information suppression.
    That is, phonetic code comprises a lossy representation of its input. This lossy
    representation usually contains a string of a shorter length compared to the input
    string and more. As a result, the same output string may be derived from different
    input strings. For instance, the string "Copper" also has the same Soundex code
    with "Cooper," i.e., C160. Thus, phonetic encoding algorithms do not provide one-to-one
    mappings, and it is impossible to determine the input of the encoding algorithm
    from its output.


    This information suppression property makes phonetic algorithms appropriate for
    approximate matching as it provides fault tolerance against typographical errors.
    As mentioned with our example above, "Copper" could be the result of an error
    when typing "Cooper" yields the same phonetic code. Thus, a matching comparing
    the phonetic codes instead of the original strings would yield a match. Note that
    in this case, no distance or similarity measure is required. The problem of approximate
    matching between the original strings is reduced to performing exact matching
    between their phonetic encodings. An advantage of this property is that one does
    not have to calibrate a distance measure by setting appropriate thresholds.'
