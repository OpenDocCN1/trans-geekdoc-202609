  md: "# 174 Big data recommender systems, volume 1\n\nCNN: It is a form of neural\
    \ network commonly used for image classification.\nUnlike the other traditional\
    \ network which has densely connected layers, CNN shares weights between receptive\
    \ fields. This reduces the number of parameters and CNN employs convolution mechanism\
    \ with filters. CNN is a network that learns the filters to use, i.e., the features\
    \ to extract, in order. The network takes input data, transforms it by calculating\
    \ a weighted sum over the input and applies a nonlinear filter for this transformed\
    \ input to find an intermediate state. These three steps constitute a layer. The\
    \ commonly used nonlinear activation function is rectified linear unit (ReLU).\n\
    \nCNN constitute combination of the following layers:\n\n**Convolution layer:**\
    \ This layer contains filters, and each filter produced an image containing a\
    \ particular feature. So the output of a convolution layer will be a stack of\
    \ images called Tensor.\n\n**Maxpool layer:** This layer is used to reduce the\
    \ size of the input by merging the neighboring elements by taking the maximum\
    \ value. Hence a two-dimensional window is chosen, and it is convolved over each\
    \ image steps. After each step, it gets values which within the window; from these\
    \ values, the maximum value is chosen and over all convolution steps, a matrix\
    \ of all these chosen values is formed which is of low dimension. This will help\
    \ to reduce the number of parameters and hence the amount of computation.\n\n\
    **Fully connected layer:** In this layer, we have many units. In this layer, each\
    \ unit is connected to every other unit of the succeeding layer. Fully connected\
    \ layer map the data to higher dimension. As the density increases, the accuracy\
    \ of output also increases. In this work, the sigmoid activation function with\
    \ binary cross entropy as loss function. The entry is defined mathematically as\
    \ follows:\n\n```\n$loss(pd, ed) = -\frac{1}{N}\\sum_{i=1}^{N} [ed_i, \\log pd_i\
    \ + (1 - ed_i) \\log (1 - pd_i)]$ (8.1)\n```\n\nwhere $pd$ is a vector of predicted\
    \ probability for all samples in testing data set and $ed$ is a vector of expected\
    \ class label, values are either 0 or 1.\n\n# 8.4 Scalable architecture\n\nWith\
