    # 12.3.3 Measuring privacy in online social networks


    One of the significant tasks that should be considered in online social networks
    is privacy scoring and measurement. It is not inherently clear which information
    can result in a significant loss such as identity theft. Other risks are harder
    to measure: comments and pictures of a user, which is risk-free for a number of
    individuals, can be detrimental to others. One case is a criticism against a government
    or religion. In many countries and cultures such criticism is broadly accepted,
    whereas, in other countries, an individual can get in severe difficulties for
    performing such an act [37,38]. Another risk of using social networks is posting
    vacation information when users are abroad. Therefore, intruders could decide
    when rob the house based on the information they gather. There are several techniques
    and methods for calculating the privacy and information sharing in a public manner
    [38]. Different authors have proposed various techniques and methods from the
    algorithmic approach to statistical'
