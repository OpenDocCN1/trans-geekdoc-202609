    The value collected today regarding items or users is already exceeding the computational
    scales offered by the state-of-the-art processing algorithms [1]. This volume
    is expected to further increase in the future, since far more data sources will
    become available. For instance, in the anticipated dawn of the era of Internet
    of Things (IoT) and smart homes/buildings, diverse information regarding the daily
    routine of humans will become available, and potentially exploited by online systems
    for customized, cheaper and more efficient services/items provided [2] (e.g.,
    a smart fridge monitoring the inventory of goods and suggesting online order of
    those reaching low quantities and at discount). Within the existing and future
    systems characterized by big data, several operations or computations will need
    modification or reinventing them in order to cope with the anticipated scales
    of operation.


    In all the aforementioned web systems, and many more, it is often necessary to
    employ various forms of recommendation systems (RSs) to increase the efficiency
    of marketing and create added-value services for the users [3,4]. The RS character
    generally utilizes the techniques and software tools that generate effective suggestions
    about new or existing items for particular users or classes of users. The main
    goal of an RS is to increase the number of items sold and the corresponding financial
    revenue, while potentially promote diverse items, e.g., promote unpopular items
    in a movie database that some users may find ever interesting. Other functions
    include the creation of a more satisfying experience for users and increasing
    user fidelity (which asserts that the user interacts with the system, the more
    refined the user activity model can become, and thus, the more probable to increase
    the revenue generated by a more customized experience). By aiming at users’ preferences
    for items not already online shopping environments, and thus the associated costs
    of finding and selecting items in the online environment, the basic concept behind
    an RS is a well-designed decision-making strategy under a complex information
    environment that consists of an information-processing system that persistently
    collects data (actively or passively) on the three main entities: items, users,
    and transactions (relations between items–users or users–users, etc.).


    The success of an RS is typically evaluated by metrics such as prediction accuracy,³
    credibility and filtering efficiency [3]. Traditional recommendation


