    the main contribution to address the DI issues in big data. As example, the IKARUS-Onto
    (Imprecise Knowledge Representation and Use) methodology [40] is an approach for
    Fuzzy-Ontology development. It focuses on the provision of a methodological guideline
    for the conversion from crisp ontologies into fuzzy ones. It consists of five
