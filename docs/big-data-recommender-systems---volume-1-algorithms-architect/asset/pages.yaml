  md: '# 254 Big data recommender systems, volume 1


    # 11.6 Conclusion


    In this chapter, we discuss the security issues of big data recommender systems.
    To enhance security in big data recommender systems, we can secure HDFS in Hadoop
    with so many blocks. We introduced approaches that aim to combat attacks on the
    name node or data node. In Future, other layers of Hadoop should become more secure.
    In this chapter we introduce different methods to discover attacks on recommender
    systems. We noted that successful attacks can occur on collaborative recommender
    systems without any detailed knowledge about the system or users of the system.
    Item-based algorithms that have a robust image in fact are much vulnerable against
    Segment attacks that require a little knowledge about the system. Researches show
    that nude attacks are more difficult to detect than push attacks. We studied about
    two nude attacks: Love and Hate attack and Reverse Bandwagon attack. These attacks
    do not need detailed knowledge about the system that suffers attacks. Love and
    Hate attack need the least of knowledge about the system and has the most impact
    on the system. The hybrid recommender systems that merge collaborative recommender
    approach with other recommender systems with stronger defense component. The advantages
    of hybrid recommender systems are shown by knowledge-based component. The semantically
    enhanced item-based algorithm is an extension of standard item-based algorithms,
    which enhances the accuracy and robustness. An attacker can discover a solution
    to bias the inputs for many recommender systems simultaneously, but it is very
    difficult and takes more cost for the attacker. We introduced a supervised classification
    method to detect attacks. By using a merge of statistical approach and model-derived
    features, we can enhance the recommender system against attacks. Attacks such
    as Segment attack and Love Hate attack have malicious impacts on recommender systems.
    Many items may affect on users'' belief in big data recommender systems such as
    the system''s trustworthiness and the system''s ability to build trust. Users''
    trust depends on their perception of a big data recommender system whether it
    does its duty or not. To enhance big data recommender systems'' attacks and their
    impact on big data recommender system algorithms and to develop attack detection
    algorithms, we should trust and use big data recommender systems.


