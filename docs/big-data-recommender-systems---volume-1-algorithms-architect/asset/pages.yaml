    # 8.7.2 Windshield wiper motor


    Windshield wiper motor with an in-built permanent magnet is a most commonly used
    in automotive vehicle. It is used to drive the wiper of the vehicle to provide
    clear view to the driver. The rotation of a wiper motor makes the wiper to move
    back and forth. The motor works on an input voltage of 12 V. The motor can work
    in two different speeds; they are single speed and two speed. When the motor works
    in a normal speed, it makes 40 wipers per minute, and when it works in high speed,
    it makes 60 wipers per minute.


    Operation: A windshield wiper motor consists of an armature shaft and three brushes
    which are brush 1, brush 2 and brush g. When we connect the motor to a power supply,
    maximum of 12 V, the brushes 1 and g get current. This current received by the
    brushes generates a magnetic field. We know by Fleming''s left thumb rule that
    current, magnetic field and force are mutually perpendicular to each other. The
    magnetic field generated by the current is perpendicular to armature shaft. This
    perpendicular magnetic field creates a force on the shaft which makes the shaft
    to rotate. In this case, the magnetic fields generated by the two brushes 1 and
    g are opposite to each other, so the motor runs at high speed. Like before, the
    current generates a magnetic field on brush 2 and g. The magnetic fields on brushes
    2 and g are perpendicular to the force on copper winding. This force on copper
    winding generated by brushes 1 and g is less compared to the force generated by
    brushes 2 and g, so the armature shafts rotates at low speed in this case [25].


    # 8.7.3 Stepper motor


    The stepper motor is a brushless DC motor. It is a small piece of iron in the
    center around electromagnets are arranged. Permanent magnet stepper, Hybrid synchronous
    stepper and variable reactance stepper are the three different types of stepper
    motors. Stepper motor finds wide range of applications in the field of lasers
    and optics. It is also used in commonly used devices as printers, scanners.


    To make the shaft of the motor, power is given to one electromagnet which will
    magnetically align the gear teeth. The gear teeth tightly align to the next electromagnet
    which will make the first electromagnet turn off and turns the second electromagnet.
    This process continues for all the electromagnets which will make the shaft rotate.
    The motor has a major advantage that it can be positioned anywhere.


    Two-phase stepper motor: There are two types of stepper motors. Based on the electromagnetic
    coil arrangement, they are divided as unipolar and bipolar stepper motor. The
    difference between them is the bipolar motor has only a single winding for a phase,
    whereas a unipolar motor also has a single winding for one phase but with a center
    tap. The specification of 4SHG-050A 51S stepper motor is shown in in Table 8.3.


