    # 2.3.2.3 Hybrid recommenders


    Introduction


    The type of recommenders where multiple recommendation techniques are combined
    to produce a unified recommendation system is called hybrid recommenders [6].
    The basic idea behind this approach is to overcome the drawbacks of individual
    recommendation techniques by combining the advantageous features of different
    techniques together, and producing a unified recommender [8]. Hybrid RSSs can
    be implemented in various ways, and some of them are discussed by [6] and [8]
    as follows:


    +   - Implement different recommendation techniques individually and combine their
    predictions and recommendations.

    - Consolidate some features of content-based technique into the other one.

    - Consolidate some features of CF technique into the other one.

    - Develop a unified RS combining multiple techniques together.


    Discussion


    The hybrid RSSs are classified into seven classes that are explained by [8] and
    [15]:


    +   i. Weighted: Scores from multiple techniques are combined to produce a single
    recommendation.

    ii. Switching: Based on the context, the RS switches between the available recommendation
    techniques to produce a recommendation.

    iii. Mixed: Recommendations from a combination of different recommendation techniques
    are combined and produced at the same time.

    iv. Feature combination: Features from several different recommendation data sources
    are combined together in a single recommendation algorithm.

    v. Cascade: One recommender with higher priority refines the results produced
    by the lower priority recommenders and produces the final recommendation.

    vi. Feature augmentation: One recommender’s output is used as an input to the
    other recommender.

    vii. Meta Level: One recommender’s model learned is used as an input to the other
    recommender.'
