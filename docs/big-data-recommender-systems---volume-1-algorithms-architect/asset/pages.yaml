    There are various research efforts where recommendation algorithms utilize contextual
    data in support of personalized output. Research efforts presented in [42,43]
    are early attempts of CARS, to leverage tensor factorization techniques to enumerate
    latent features for users-context, in spaces that include more than the traditional
    two-dimensional-items model. In a similar manner, in systems presented in [44,45]
    user/device "location" is utilized as one of the most obvious cases for improving
