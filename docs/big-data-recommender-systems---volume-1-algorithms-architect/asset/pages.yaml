    # 4.2 Background on recommendation systems and social network analysis


    # 4.2.1 Recommendation systems


    In this section, we provide some background on RSs, starting with a cumulative
    definition. One of the most popularly employed definitions nowadays is that presented
    in [3], and it is based on the notion of utility function denoting the usefulness
    of an item for user.


    **Definition 4.1. (Recommendation problem).** Given a user $u \in U$, where $U$
    is the set of all users, and an item $i \in I$, where $I$ is the set of all recommendable
    items, let f(u,i) be a utility function that measures the usefulness of item $i$
    to user $u, f: U \times I \rightarrow R$, where R is a totally ordered set of
    non-negative real numbers or integers. The goal of the recommendation problem
    is is to find for each user $u \in U$ the item $i'' \in I$ over all items in $I$
    that maximizes the expected utility for this specific user $u$, namely an item


    ```

    $i_u^* = argmax_{i \in I} f(u,i).$

    ```'
