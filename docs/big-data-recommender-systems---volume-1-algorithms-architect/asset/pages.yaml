    This highlights the need for an efficient algorithm to circumvent these phishing
    activities. Developing an effective phishing URL detection system will abate the
    increasing cyber threat. The method used to detect the phishing URL is blacklisting.
    Blacklists are database of phishing URLs. The database has to be updated continuously
    in order to handle new phishing URLs. Attackers modify the phishing URL through
    obfuscation so that it "seems" legitimate and thereby fools users. Garera et al.
    [35] have mentioned four types obfuscation. They are IP-based obfuscation of host,
    domain-based obfuscation of host, obfuscating with misspelling and large host
    names. These obfuscation techniques act as a layer to hide the nature of URL.
    Blacklisting methods are easy to implement and at the same time easy to fail for
    new variants of phishing attacks and also require human involvement to update
    URL repository.


    The advance in ML techniques brought a new outlook to tackle the problem [35-38].
    ML techniques learn the behavior of phishing URLs from the training data. In addition
    to this, it learns a prediction function to classify a URL as either or benign.
    The advantage of ML-based method over blacklisting is the ability to generalize
    for new URLs. In ML-based methods, choosing the right features is the tedious
    task. Some of the featured engineering techniques is to extract host based or
    lexical features for classifying either benign or phishing. Kan and Thi [39] have
    used ML techniques for URL classification. The strength of deep learning over
    classical ML techniques is the ability to learn from the raw data. Feature engineering
    part is not necessary in deep learning. Researchers have highlighted the effectiveness
    of artificial neural network over classical ML technique for the detection of
    phishing URL.


    # 14.3 Background


    # 14.3.1 Deep neural network


    Deep learning is a subset of ML. The conventional ML technique requires feature
    engineering technique, i.e., we have to choose right features in order to obtain
    results and this purely depends on domain knowledge, whereas deep learning does
    not require feature engineering part. It learns from the raw data.


    Deep neural networks (DNNs) are distinguished from the shallow networks by their
    depth, that is, the number of hidden layers a neural network has. A shallow network
    is composed of one input and one output layer, whereas DNN contains input layer,
    several hidden layers and an output layer. These hidden layers help recognize
    more complex features. The main highlight in deep learning networks compared to'
