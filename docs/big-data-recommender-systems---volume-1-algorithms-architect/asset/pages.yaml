    and the output layer, respectively. A default learning rate of 0.01 was used for
    the experiments. We have used adam as the optimizer and categorical cross entropy
    as the loss function. The activation function used is ReLU since ReLU overcomes
    the problem of vanishing gradient in DNNs.


    +   1. Fully connected layers

    There is a connection from the neurons in the current layer to the neurons in
    the succeeding layer. That is why it is fully connected layers. These hidden layers
    help to learn the complex features. All the hidden layer uses ReLU as the activation
    function.


    +   2. Batch normalization and regularization

    The problem of overfitting the model is avoided by introducing a dropout of 0.01
    between the fully connected layers. Dropout removes the connections so that the
    model does not overfit the training samples. We used batch normalization to speed
    up the training of DNN.


