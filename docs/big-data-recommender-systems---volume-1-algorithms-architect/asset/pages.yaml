    # 11.3 Big data recommender system attacks


    In big data recommender systems, an attacker injects fake ratings to recommend
    the data that the attacker wants. These attacks are called "shilling" attacks
    [8–10]. This type of attack (profile injection attacks) is the only way to recommend
    a special product. The main goal of profile injection attacks is to change output
    of the recommender system. In a profile injection attack, an attacker creates
    a number of fake profiles to interact with big data recommender system. These
    fake profiles communicate with dummy identities to hide their original identities.


    # 11.3.1 Attack tactics


    In this chapter, we divide attacks into two types: namely push attacks and nuke
    attacks. The goals of these two types of attacks are increasing or decreasing
    the rating for items. All attacks are implemented as follows. A profile injection
    attacker to identities and builds a fake profile for each identity. It is in this
    manner that attack data are inserted into a system—no other accessing to database
    of the system is accepted. There are two issues attackers need to consider when
    building attack profiles. The first concerns the selection of items from which
    the profiles are constructed; the second relates to the ratings that are applied
    to the selected items [11].


