    The identity boundary is described as the ability to manage one''s information
    with particular groups. For example, it shows users'' behaviors in different situations:
    one at work and the other at a party. The last one is a temporal boundary. It
    shows how the conduct of individuals may differ over time [27].


    # 12.3 Taxonomy of privacy


    Privacy can be studied from different aspects: privacy concerns, scoring models
    and privacy-preserving models and approaches (Figure 12.1). The first two divisions
    illustrate the privacy concerns in online social networks and user-related concerns,
    the third part illustrates the measurement techniques of privacy of users'' data.
    The last two sections show the preserving approaches of privacy for users in online
    social networks and recommender systems.


    # 12.3.1 Privacy concerns in social networks


    Privacy in social network sites can be seen from two different perspectives. The
    first perspective is local privacy or user-centric, which is known as social privacy.
    The second perspective is global or network-centric which is known as institutional
    privacy [26]. From the user-centric perspective, users decide what to share with
    others they can create various levels and circles of friends, posts and information
    to whom they intend to share. From the global view, social networks take advantage
    of users'' information for different goals as stated and detailed in data usage
    rule and policy. Moreover, the network-centric privacy can also be from two distinctive
    approaches. Considering the first approach, the data collector is the data owner
    of the users'' information. While these social network sites have infinite access
    to a user''s data, the concerns for privacy are less if the data collector is
    trustworthy for the user.


