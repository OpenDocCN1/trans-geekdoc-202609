    Big DIs are the combination of technical and business processes used to combine
    data from disparate sources into meaningful and valuable information. A complete
    big data solution approach delivers trusted data from DHS and term referring to
    the requirement to combine the data from multiple business systems into a single
    unified view, often called a single view of truth. There are three primary components
    of DQ as follows: (1) data profiling, (2) data correction and (3) monitoring (see
    Figure 5.2). In addition, it is the process of retrieving data from multiple source
    systems and combining it in such a way that it can yield consistent, comprehensive,
    correct and correct information for the business work process, and analysis. The
    objective of big DI becomes even more important in the case of merging of similar
    organisations [5,33]. One of the key knowledge from literature is that big data
    initiatives, take account business logic system needs and challenges. It should
    also take into account the data inconsistency challenge that specific data initiatives
    will pull in addressing the DQ issues in LSDB, the COs interoperability requirements
