  md: '# 324 Big data recommender systems, volume 1


    # 14.5.3 Data set description


    The data set used is KDD-Cup-99 for the analysis. The data set is released as
    a part of Third International Knowledge Discovery and Data Mining. The competition
    is to distinguish between bad connections as intrusions and good connections named
    as normal. The data set contains 41 features. The detailed description of the
    data set is provided in [54]. Instead of using 41 features, we have used 7 features.
    These features are as follows:


    +   1. Protocol

    2. Service

    3. Src_bytes

    4. Dst_bytes

    5. Flag

    6. Host_count

    7. Src_count

    8. No of connections


    The first seven features are the dimension attribute, and the no of connections
    is the measure attribute when the data set is mapped to the tensor. The no of
    connections is obtained by taking the count of times a particular first seven
    features have occurred in the original data. These seven features act as seven
    dimensions of the tensor. Also for our experimental analysis, we did not use the
    full data set. The data set details are reported in Table 14.12. The details of
    the data set used are given in the following sections.


    # 14.5.4 Experiments and observations


    The experiments aim to find the first k dense subblocks. For the experiments,
    we use k varying from 2 to 5, i.e., k = 2 will give the first two dense subblocks
    connections. These dense subblocks connections records are assigned to suspicious
    and assigned a label as attack, whereas the remaining undetected blocks are assigned
    as normal. By using this information we create the predicted label. This metrics
    like accuracy, precision, recall, F-score is found out for each k. The detailed
    results are reported in Table 14.13 for suspiciousness, Table 14.14 for geo-measure,
    Table 14.15 for Ari-measure, Table 14.16 for measures for suspiciousness, Table
