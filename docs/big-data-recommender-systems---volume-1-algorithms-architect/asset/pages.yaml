    Geo-social influence Geo-social influence indicates that people tend to explore
    spatial items near a that or their friends have visited before [61]. Many recent
    studies [5,11,61,62] show that there is a strong correlation between check-in
    activities and geographical distance as well as social connections. Most of the
    current spatial item recommendation work mainly on leveraging the geographical
    and social influences to improve recommendation accuracy. For example, Ye et al.
    [61] have developed into spatial item recommendation by investigating geographical
    influence between locations and proposed a system that connects preferences, social
    influence and geographical influence. Chen et al. [62] have investigated the geographical
    influence through combining a multicenter Gaussian model, matrix factorization
    and social influence for location recommendation. Lian et al. [55] have incorporated
    the spatial clustering phenomenon from geweighted matrix factorization framework
    to deal with the matrix sparsity. Ference et al. [7] have designed a collaborative
    recommendation framework which considers the activity records generated by friends
    and similar users in a mixture.


    Temporal effect. The temporal effect of user check-in activities in LBSNs has
    attracted much attention from researchers. Spatial item recommendation with temporal
    effect mainly leverages temporal cyclic patterns and sequential patterns on LBSNs.
    Gao et al. [63] have investigated the temporal patterns of user check-ins in temporal
    nonuniformity and temporal consecutiveness.[64,65] focus on the task of successive
    personalized item recommendation in LBSNs by embedding the temporal patterns.
    Yin et al. have proposed a temporal recommender system [66] and modeled user behaviors
    based on intrinsic interest as well as the temporal topic in many recommender
    systems [16,41]. In recent years, deep neural networks have been successfully
    applied to many recommender systems [24,67] as word embeddings to incorporate
    auxiliary information and recurrent neural networks (RNN) to capture sequential
    properties of observed user–item interactions. Manutrumuska et al. have proposed
    a deep recurrent collaborative filtering framework with a pairwise ranking function
    that can capture user–venue interactions in a CF manner from sequences of observed
    feedback by leveraging multiplex perception and RNN architectures in [67].


    Content information. Most recently, researchers have explored the content information
    of spatial items to alleviate the problem of data sparsity. Hu et al. have proposed
    a spatial topic model for spatial item recommendation considering both spatial
