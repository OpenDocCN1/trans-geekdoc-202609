    # 12.3.4 Privacy-preserving approaches


    Current research on privacy protection can be classified into three groups [50],
    each category concentrating on an aspect of privacy. Privacy by policy considers
    access models, privacy by statistics focuses on analytical and statistical technologies
    to generate revelation mechanisms, and privacy by cryptography aims to develop
    systems to guarantee the goal of confidentiality, integrity and availability (CIA).
    While the information utility in privacy is high, there is no guarantee of privacy-preservation
    and the strength of privacy is low. In the second category,'
