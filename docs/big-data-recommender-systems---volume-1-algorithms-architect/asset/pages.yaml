    of a master machine directing tasks of a program to be executed, referred to as
    driver, to workers.


    The execution of a Spark application involves the following key entities [29].
    First, there is the driver. This is a program that considers Spark as a library
    and describes computation steps to be taken. The driver program connects to a
    computing cluster through a SparkContext. Then, there are the workers, who provide
    resources to the Spark application, namely CPU, memory and storage. On an executor,
    on the other hand, is a distinct Java Virtual machine created by Spark for each
    worker running the respective application. A set of computations is referred as
    a job. This is launched in a cluster by Spark and concludes with the results,
    which are returned to the driver program. A Spark application may consist of multiple
    jobs. Each time a job is provided to Spark, it directs a directed acyclic graph
    of stages. Each stage, in its turn is a collection of tasks, each of which comprises
    the smallest unit of work that Spark sends to an executor.


