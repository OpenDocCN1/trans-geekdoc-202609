    From the privacy score equation, it can be seen that there is a need to compute
    the visibility and sensitivity for the final measurement of users'' privacy score.
    Hence, Maximilien et al. [42] provided formulas for sensitivity and visibility:


    Maximilien et al. [42] mentioned that the sensitivity shows the difficulty of
    sharing an attribute to users freely accessible. Based on his formula, Sensitivity
    of an attribute can be calculated by


    ```

    $$\beta_k = \frac{M - |R_k|}{M}$

    ```


    where $|R_k|$ is the number of individuals that make their attributes publicly
    available. As Maximilien use a dichotomous approach, the final computed value
    for sensitivity is between [0,1], where the more sensitive attributes of a user
    have higher sensitivity score.


    The other factor that has an impact on users'' visibility, Maximilien et al. calculate
    from (12.4), which measure the probability that user l’ kth attribute is public.


    ```

    $P_{kl} = Prob[R(k,l) = 1]$

    ```


    Privacy quotient using a naive approach

    One of the models for calculating a privacy score is provided by Srivastava [43].
    In order to model his datasets, by focusing on text messages, they deploy a privacy
    quotient. With $M$ individuals and $m$ attributes, they formed a response matrix
    $(M \times m)$, which comes with a different range of attributes and users. They
    listed the profile items as follows: contact number, email, address, birth date,
    hometown, current job, job details, relationship status, interest, religious faiths
    and political views. Srivastava [43] dealt with a response matrix by assigning
    values 0 and 1 for shared information and unstructured information about the profile,
    respectively. Their privacy quotient is capable of measuring sensitivity and visibility
    of the information as the main parameters of measuring the privacy. In their formula,
    they measure sensitivity for one user in relation to how the other users share.
    For sensitivity calculation, the following formula has been proposed


    ```

    $$\beta_k = \frac{M - |R_k|}{M}$

    ```


    where $|R_k| = \sum R(k,l)$ is the sum of all public values $k$ of a column of
    profile. The other hand, visibility has been defined by the following steps:


    +   (1) $V(k,l) = Pr[R(k,l) = 1] \times 1 + Pr[R(k,l) = 0] \times 0$;

    (2) $V(k,l) = Pr[R(k,l) = 1] \times 1 + 0$;

    (3) $V(k,l) = Pr[R(k,l) = 1] \times 1$


    where $Pr[R(k,l) = 1]$ shows the probability that an attribute of a user is public,
    while $Pr[R(k,l) = 0]$ indicates that the attribute is private (by applying these
    steps, it can'
