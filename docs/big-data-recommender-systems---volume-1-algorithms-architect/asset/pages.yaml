    Our protocol for performing PPM on textual data relies on phonetic codes and exploits
    the properties phonetic encoding algorithms exhibit. The fact that phonetic codes
    exhibit information suppression and that they are not one-to-one mappings are
    the key features for ensuring privacy preservation and performing approximate'
