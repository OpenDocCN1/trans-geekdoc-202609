  md: '# Chapter 13


    # # Private entity resolution for big data on Apache Spark using multiple phonetic
    codes


    Alexandros Karasakasidis¹ and Georgia Koloniari¹


    # ## 13.1 Introduction


    Recommender systems are nowadays experiencing a significant boost due to the availability
    of big data which supply an abundance of user data such as past purchases and
    browsing history. The benefits are increased when a recommender system can use
    and combine data that come from multiple sites and illustrate a more complete
    picture of the user''s preferences and interests. However, such data often originate
    from dispersed, heterogeneous sources, and before processing and analyzing them,
    it is required to integrate or link them. The problem of linking data consists
    of identifying data that refer to the same real-world entity across the heterogeneous
    sources and is known as *record linkage or entity resolution*. As these data also
    concern human activities, privacy issues arise when linking data across different
    sources. The problem is known as *privacy preserving record linkage* (PPRL).


    In PPRL, two or more dataholders attempt to identify common entities within their
    records, without revealing to each other any additional information. As the data
    are from heterogeneous sources, they may adhere to different schemas. No common
    identifiers can be found, and so, the record-linking methods rely on attributes
    that describe these records and to all data sources, such as names, surnames and
    addresses when identifying the same individual. Thus, to determine whether two
    records match, all their respective fields must be compared. The complexity of
    matching methods is high, as records belonging to the two dataholders be compared
    against each other so to determine the matching records. To this end, blocking
    methods have been introduced [1] to reduce matching complexity by pruning out
    unlikely to match pairs of records. In addition, data is usually dirty, containing
    spelling and typographical errors, thus complicating the linkage process further.
    Exact matching cannot be performed and more expensive approximate matching methods
    are required.


    Different approaches have been applied for approximate matching in the context
    of record linkage. Most methods rely on hashing, combinations of bigrams and'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 284 Big data recommender systems, volume 1


    n-grams as well as similarity or appropriate distance measures. A popular approach
    is based on use of phonetic codes. A phonetic code is a hash of a string, based
    on its pronunciation. Phonetic codes are being used for almost a century [2] for
    duplicate detection and record linkage, due to their inherent information suppression
    properties, which make them tolerant to spelling errors. Use of phonetic codes
    reduces the problem of approximate matching of dirty data to a problem of exact
    matching of phonetic codes, leading to faster processing and rendering the use
    of distance measures redundant. However, this often comes with a cost in quality
    with regards to precision or recall.


    In this chapter, we propose a parallel protocol for PPR based on phonetic encodings
    that exploit novel big data processing engines to provide results of high quality
    in an efficient manner. Our work previously presented in [3] that is based on
    the use of the Soundex phonetic algorithm [2]. This protocol also features noise
    generation to prevent frequency attacks and encryption of actual and fake data
    to enable processing by an untrusted party. However, to cope with the low recall
    that the existence of a big percentage of dirty data may incur, we propose using
    Soundex with another phonetic algorithm, and particularly NYISIS [4]. By combining
    two phonetic encodings, our protocol becomes more robust and more tolerant to
    errors in the matching fields, as it introduces redundancy. Furthermore, as Soundex
    is particularly vulnerable to whatever occurs in the beginning of the encoded
    text; our protocol deploys another optimization by encoding the reverse of the
    original text with the second phonetic algorithm.


    To cope with the recall we rely on the use of novel parallel-processing platforms.
    In particular, we implement our protocol using Apache Spark [5]. Apache Spark,
    a general-purpose cluster computing platform, providing efficient solutions for
    a variety of analytics problems dealing with structured and unstructured as well
    as streaming data. Apache Spark is also used in [6] that utilizes preserving matching
    (PPM) using a single phonetic encoding, inheriting the low recall that the serial
    approach exhibits. Our protocol is a three party protocol use of a third, cloud-based
    party which is not necessarily required to be trusted as it handles only encrypted
    data, and no private information is leaked. Our experimental results show that
    the proposed protocol is both efficient and effective, with higher recall compared
    to approaches using only a single phonetic algorithm for encoding.


    The rest of the chapter is organized as follows. Section 13.2 summarizes work.
    In Section 13.3, we formulate the problem and briefly present the basic components
    of our approach. Section 13.4 details the proposed technique, while Section 13.5
    contains our empirical evaluation. Finally, Section 13.6 sums up with conclusions
    and some thoughts for future work.


    # 13.2 Related work


    The problem of record linkage has attracted much attention due to the importance
    and variety of its applications. Useful reviews of the most representative traditional'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Private entity resolution for big data on Apache Spark 285


    methods for record linkage can be found in [7,8]. However, the classical linkage
    problem ignored any privacy concerns and focused only on efficiency and result
    quality. Privacy issues are addressed in [9], which presents the challenges and
    specific requirements of the PPR. Latest challenges and current research directions
    are summarized in [10], including techniques providing efficient indexing, real-time
    matching, dynamic data handling, application of graph-based classification techniques
    on the privacy-preserving paradigm, interactive assessment of linked records and
    techniques for privacy-preserving data fusion. In our work, we address the problem
    of efficient approximate matching deploying photonic codes and the novel available
    parallel-processing architectures to deal with big data volumes and real-time
    processing.


    For PPM, Van Eycken et al. [11] propose the creation of a single hash string for
    an entire record, combining the linkage fields, i.e., name, address. However,
    this method is not tolerant to spelling and other errors and is only appropriate
    for exact matching. Churches et al. [12] propose a method that combines hashing
    with n-grams by using hashing. The method aims at de-identifying the Dice coefficient
    of n-grams by hashing. As shown in [13], privacy preservation of distance-based
    methods performed well only in cases of unencrypted data. Another computationally
    intensive method is presented in [14], where so as to capture the typographical
    errors which may occur within a string, various permutations of the linkage attributes
    are computed and then encrypted. Du et al. [15] propose precomputing all the linkage
    attributes possible matches, an approach that requires an extreme amount of storage
    space. Schnell et al. [16] have used Bloom filters, which combine with n-grams
    to take advantage of their approximate matching properties. However, as indicated
    in [17], under certain conditions, this method is susceptible to constraint satisfaction
    cryptanalysis. Homomorphic encryption [18] may be used for privately matching
    numerical fields [19] and is also not very efficient.


    Our approach is based on [3] which deploys photonic codes and using Soundex, we
    extend it by combining another phonetic algorithm NSYSIS. Our approach is robust
    to typos and spelling errors as using two encodings with different characteristics
    introduces redundancy and provides higher recall. Phonetic encoding schemes have
    used often for name matching and linkage so as to deal with spelling and other
    errors giving results with high quality [20]. Other well-known phonetic algorithms
    are used Metaphone [21], which assumes English phonetics. We selected to combine
    Soundex with NSYSIS since they are both popular algorithms with many available
    fast implementations and their characteristics work complementary in order to
    achieve a higher recall as was our goal.


    To move forward real-time matching and deal with big data, the novel platforms
    such as Hadoop and Spark that offer parallel processing capabilities have been
    recently deployed for record linkage [22] and particularly supporting methods
    for private blocking (indexing) [23,24] and private matching [6,25–27]. In [22],
    Hadoop is deployed to apply record-linkage using the MapReduce programming model
    and'
  merge: -1
  img_proc: true
- pgno: 302
