    # 12.4 Privacy preservation in recommender systems


    Different methods have been proposed for preserving the privacy of users in recommender
    systems. Badsha *et al.* [79] presented a pragmatic privacy-preserving content-based
    filtering recommender system which works on homomorphic encryption. To achieve
    this, they calculate item-to-item similarity of one user and then generate secure
    recommendations (provide recommendations without revealing sensitive information
    of users). Nikolaenko *et al.* [80] proposed a new method to leverage sparsity
    of data to achieve security in recommender systems, which works on matrix factorization.
    Shokri *et al.* [81] developed a distributed aggregation mechanism for individuals
    to observe the connection between user and data sent to a server that is not trusted
    in a collaborative-filtering-recommender system. They guarantee that the privacy
    of users will be kept while the least information occurs for individuals. Machanavajijala
    *et al.* [82] proposed a differential privacy-preserving method for graph-based
    social networks to consider the trade-off between utility and privacy. In their
    model, they have considered all edges of the graph and proposed an algorithm that
    was able to recommend a single node for a few target nodes. Hofmann *et al.* [83]
    proposed a privacy scheme for collaborative filtering recommender systems by factor
    analysis. They also make use of a peer-to-peer protocol to meet the privacy of
    individuals'' information in their model. The authors in [84–88] developed and
    proposed privacy-preserving algorithms and models for recommender systems. In
