  md: '# Big Data Recommender Systems


    Volume 1: Algorithms, Architectures, Big Data, Security and Trust


    First designed to generate personalized recommendations to users in the 90s, recommender
    systems apply knowledge discovery techniques to users'' data to suggest information,
    products, and services that match their preferences. In recent decades, we have
    seen an exponential increase in the volumes of data, which has introduced many
    new challenges.


    Divided into two volumes, this comprehensive set covers recent advances, challenges,
    novel solutions, and applications in big recommender systems. Volume 1 contains
    14 chapters addressing foundations, algorithms and architectures, approaches for
    big data, and trust and security measures. Volume 2 covers a broad range of application
    paradigms for recommender systems over 22 chapters.


    # About the Editors


    Osman Khalid is assistant professor at the department of computer sciences, COMSATS
    Institute of Information Technology, Abbottabad, Pakistan. His research interests
    include recommender systems, trust and reputation system, disaster response systems,
    delay tolerant networks, wireless networks, and fog computing.


    Umee H. Khan is associate professor of electrical and computer engineering at
    the North Dakota State University, USA. His research interests include optimization,
    robustness, and security of systems.


    Albert Y. Zomaya is chair of high performance computing & networking and Australian
    research councilfellow in the School of Information Technologies, the University
    of Sydney. He is also the director of the Centre for Distributed and High Performance
    Computing.


    # IET Book Series on Big Data


    Editor-in-Chief: Professor Albert Y. Zomaya, University of Sydney


    Big Data has emerged as a revolutionary theory that cuts across many technologies
    and application domains. This new book series explores the myriad research activities
    that analyze, compute, store, manage, and transport massive amounts of data, such
    as algorithm design, data mining and search, processor architectures, databases,
    infrastructure development, service and data discovery, networking and mobile
    computing, cloud computing, high-performance computing, privacy and security,
    storage, and visualization.


