  md: '# Chapter 14


    # Deep learning architecture for big data analytics in detecting intrusions and
    malicious URL N.B. Harakrishnan¹, R. Vinayakumar¹, K.P. Soman¹, Prabaran Poornachandran²,
    B. Annappa³, and Mamoun Alazab⁴


    Security attacks are one of the major threats in today’s world. These attacks
    exploit the vulnerabilities in a system or online sites for financial gain. By
    doing so, there arises a huge loss in revenue and reputation for both government
    and private firms. These attacks are generally carried out through malware interception,
    intrusions, phishing uniform resource locator (URL). There are techniques like
    signature-based detection, anomaly detection, state full protocol to detect intrusions,
    blacklisting for phishing. Even though these techniques claim to thwart cyberattacks,
    they often fail to detect new attacks or variants of existing attacks. The second
    reason why these techniques fail is the dynamic nature of attacks and lack of
    annotated data. In such a, we need to propose a system that can capture the changing
    trends of cyberattacks to some extent. For this, we used supervised and unsupervised
    learning techniques. The growing problem of intrusions and phishing URLs generates
    a need for a reliable architectural-based solution that can efficiently identify
    intrusions. This chapter aims to provide a comprehensive survey of intrusion and
    phishing URL detection techniques and deep learning. It presents and evaluates
    a highly effective deep learning architecture to automate intrusion and phishing
    detection. The proposed method is an artificial intelligence (AI)-based hybrid
    architecture for an organization which provides supervised and unsupervised-based
    solutions to tackle intrusions, and phishing detection. The prototype model uses
    various classical machine learning (ML) classifiers and deep learning architectures.
    The research specifically focuses on detecting and classifying intrusions and
    phishing detection.


