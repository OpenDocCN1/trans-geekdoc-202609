    used as a trust metric in CF methods that selects neighbors based on the metric.
    A small number of neighbors are required to stabilize the recommendation quality.
    Recommendation quality is also excellent. Furthermore, trust (consistency) propagation
    reduces the severity of the sparsity problem intrinsic to CF methods.


