    matching. As we have detailed in Section 13.3.2, their blend of properties is
    ideal for performing PPRL. However, they also exhibit some weakness.


    The intuition behind their use is that these codes are lossy representations of
    the original strings, words with similar spelling or misspellings map to the same
    phonetic code. Indeed, using Soundex for illustration, words with similar spelling
    such as "Copper" and "Cooper" yield the same code C160. However, the word "Choufoer"
    also corresponds to the same phonetic code of C160. This last word significantly
    different from the others. Unfortunately, there is no upper bound on the distance
    between two words that may yield the same phonetic code. On the other hand, the
    word "Dooper" corresponds to a different phonetic code (D160) despite its small
    scale to "Cooper."


    To address this issue, we propose using multiple phonetic encodings for the input
    records, instead of a single one. Our approach is based on the very observation
    that, different rules are followed by each phonetic algorithm, resulting in different
    conversions, there should be cases where some phonetic would work better than
    some other, being, thus, able to capture different discrepancies and vice versa.
    To this, we apply more than one algorithm to the same dataset and consider the
    union of the results.


    In our work, we use Soundex and NYSIIS, as both are very popular and have many
    efficient implementations available. We believe that their characteristics and
    the transformations they perform complementary. This fact is confirmed by our
    experimental evaluation since recall is significantly increased when Soundex is
    performed on the original string in combination with NYSIIS to reverse. The reverse
    of the original string is to cause the sensitivity phonetic-encoding errors to
    occur in the beginning of the string, as demonstrated by the example of "Dooper"
    vs "Cooper."


    It is evident that the use of multiple phonetic algorithms produces an excess
    of encoded records. The number of produced records rises even higher, considering
    that we also use fake records in noise to further enhance privacy. We employ noise
    injection, so that information is hidden by the uncertainty produced for the entire
    dataset.


    In particular, given a set of different phonetic algorithms $F$, a dataset of
    size $r$ and inserting $f$ fake records, the size $r''$ of the resulting dataset
    is equal to


    ```

    $r'' = r \times F + f$

    ```


    As our approach significantly increases the dataset size, it also requires processing
    power. To address this issue, employ a parallel engine suitable for big data processing,
    and as we show in Section 13.5, using a small cluster we result in an improved
    performance in terms of matching quality and time. The processing framework of
    our choice is Apache Spark [5].


    The procedure described thereafter may be used with other PPM methods.'
