    ones to score and measure the privacy. The main two approaches for measuring the
    privacy are dichotomous and polytous. For each approach, several models have been
    proposed to measure the privacy of users in online social networks. The most well-known
    methods related to these approaches have been discussed in this study.


    # 12.3.3.1 Dichotomous approach


    In part, first, we discuss a privacy risk formula proposed by Renner [37]. Next,
    we explain a quantifying privacy approach proposed by Becker et al. [39]. Next,
    we introduce privacy awareness enhancement that was proposed by Petkos et al.
    [40]. It is worth noting that all current privacy-scoring methods focus on the
    single source of data of individuals, whereas users share their information in
    different sources of online social networks. Finally, other models and techniques
    for calculating and measuring privacy risk are introduced.


    # Renner privacy risk formula


    Renner [37] discusses a common approach for defining privacy risk by considering
    two privacy metrics including negative consequence leakage and the likelihood
    of information leakage. This is given by


    > $Risk = Negative consequence \times Likelihood (12.1)$


    Using such a formula in the context of an online social network will come with
    a problem: both consequences and likelihood are unknown. As a case in point, it
    is not easy to define the consequences of leaving an embarrassing picture, which
    could vary from mere embarrassment in front of friends to job termination [41].
    An panier metric to assess privacy is the number of individuals who can access
    information at a certain time. Of course, this metric can merely guarantee a definite
    privacy level when the number of individuals with access is adequately small.
    In this case, a user share the information to whom he/she recognizes and trusts.
    Nevertheless, this metric is regularly used in the real world. Most individuals
    discuss privacy information on public transport as they assume that only the people
    in the compartment will hear them talking, they would never discuss the same subjects
    when talking into a microphone that everyone in the public transport could hear
    them. In addition, the arrangement of the group, likewise, needs to be taken into
    account. However, the simple metric of the group size still conveys a sense for
    how “private” or “public” some piece of information is [37].


    # Privacy risk score


    Maximilien et al. [42] proposed a privacy score model to compute the risk of users
    who participate in online social networks the dichotomous approach. For creating
    the model, they considered visibility and sensitivity of users’ information. By
    considering $\beta_k$ as the sensitivity of an attribute and $v(k,l)$ as the visibility
    of attribute $k$ of user $l$, the final scoring model is described as $PR(k,l)$,
    which is any combination of visibility multiple in sensitivity. The final equation
    is given by


    > $PR(k,l) = \beta_k \otimes v(k,l) (12.2)$'
