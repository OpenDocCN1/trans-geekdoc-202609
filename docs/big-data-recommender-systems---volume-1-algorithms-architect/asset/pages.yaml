    Apache Spark is developed by UC Berkeley AMP lab, and it is an open source. It
    is more powerful in terms of functionality from Hadoop and MapReduce [17]. It
    uses Resilient Distributed Dataset 2 that is immutable in nature and is a collection
    of distributed objects. There are two primary variables in the Spark, which are
    broadcast variable and accumulators. Because of Lazy Evaluation, actions are evaluated,
    and transformations are stored for further execution. Apache Hadoop and Spark
    process the massive amount of data based on MapReduce technique, which uses mining
    and machine-learning algorithms in different domains. Spark Mlib is also designed
    based on machine-learning algorithms. Data presentation, processing, storage,
    analysis can be done by Mlib. Apache Spark is much better compared to others in
    terms of performance, analysis and versatility. Some issues like architectural-fit,
    skill set development, adoption and measurement of business benefits still need
    to be fixed in Spark, as it seems very promising.


