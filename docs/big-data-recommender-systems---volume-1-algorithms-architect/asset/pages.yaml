    +   **Scalability:** At the same time as the numbers of users and items increase,
    traditional CF systems experience scalability difficulties. For instance, consider
    millions of customers and millions of items; a CF system requires taking instantaneously
    in online requirements, and irrespective of the user’s charges and ratings history
    provides recommendations for them all. Apparently, it requires a higher scalability
    of a CF system. To weigh up recommendations web companies such as Twitter clusters
    for machines for millions of users. Nearly all calculations take place in extremely
    large machines.

    **Cold-start problem:** The cold start is a common problem in recommendation systems.
    When systems lack enough information about a user or item, providing a reliable
    recommendation seem to be almost impossible; this is what a cold-start problem
    is at all. When a new user or item just comes into the system, no information
    about the user or item is available; as a result system fails to acquire assumption
    to suggest items to users. The cold-start problem refers to the situation when
    a new user or item enters the system. Cold-start problem is in three forms: new
    user problem, new item problem and new system problem. In all these three cases,
    providing recommendation is almost a problem. Lack of information about new users
    and unavailability of item ratings for newly added items make CF recommendations
    nearly impossible.


    Thus, what we realize is that the current systems apparently require serious enhancement
    and upgrading in order to provide high-quality recommendations.


    # 7.4 Summary


    Recently, RSs have gained much popularity; they are also used in various fields
    like music, movies, news, music, books, search queries, research papers, social
    tags and products in general. Recommendation systems are all about users and items.
    CF is used by a second class of recommendation system, these determine similarity
    of users by their item setting and/or determine similarity of items via the users
    who has preferred them. Recommendation methods are categorized as follows:


    +   1. **Content-based recommendations:** These measure similarity by looking
    for common features of the items.

    2. **Collaborative recommendations:** These determine similarity of users through
    their item setting and/or determine similarity of items by the users who have
    liked them.

    3. **Knowledge-based recommendations:** Items are recommended to the users according
    to their preferences perceived from both item''s attributes and user''s profile.

    4. **Demographic recommendations:** With the help of a demographic profile, specific
    harmonizing items can be recommended. Age, gender, etc., are demographic data
    which are obtainable explicitly and implicitly.

    5. **Hybrid recommendations:** Prior methods have many corresponding advantages
    and disadvantages when applied. So combination of different techniques which are
    collaborative, content based, demographic and utility based and knowledge-based
    is the key to enhanced performance.'
