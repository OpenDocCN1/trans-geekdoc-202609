- pgno: 15
  md: '# Foreword


    The increase in the volumes of data creates new challenges that require novel
    and more efficient solutions to handle big data and scalability issues. Today
    we are witnessing advances in many areas that are dependent on recommender systems
    such as social networks, e-commerce websites, search engines, blogs, and sensor
    networks. Many of these advances are due to the many developments in algorithms
    and analytics, wireless networking. Internet of things, high performance computing,
    and more.


    This two-volume work will serve as a source of up-to-date and innovative research
    in this continuously evolving area. The books will provide an opportunity for
    researchers to explore the use of recommender system technologies and their impact
    on enhancing our capabilities to conduct more sophisticated studies. It will also
    be an ideal reference for graduate classes focusing on big data and recommender
    systems.


    I believe that this book set is a great addition to the literature on the topic
    and should be well received by the research and development community.


    Albert Y. Zomaya


    Editor-in-Chief, The IET Book Series on Big Data'
  merge: -1
  img_proc: true
