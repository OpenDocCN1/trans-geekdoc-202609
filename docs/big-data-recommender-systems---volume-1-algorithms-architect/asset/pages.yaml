    \ is proposed, which also shows promising results. Unlike the reconstruction-based\
    \ methods, such as RBM-CF and I-AutoRec, NCF uses MF with MLP, which tries to\
    \ capture the nonlinear way interaction between users and items. The architecture\
    \ of the NCF is shown in Figure 6.7(a). It takes in a (user, item) pair as input\
    \ to a multilayer perceptron. The user and item are represented using one-hot\
    \ coding, which are first projected to the later representation in the embedding\
    \ layer. The projection is simply the multiplication of sparse user/item representation\
    \ with the embedding matrix, i.e.,UT_u^{user}$ and $VT_i^{item}$. The embedding\
    \ matrix then goes to Layer 1 of NCF layers and the Output Layer gives the rating\
    \ score\n\n```\n$$\\hat{r}_{ui} = f(UT_u^{user} \\cdot VT_i^{item} | U, \\theta)$\n\
    ```\n\nwhere $f(\\cdot)$ is the multilayer perceptron and $\theta$ are the parameters\
    \ of the network. For explicit regression, the loss function is defined as the\
    \ weighted square error\n\n```\n$$\\mathcal{L} = \\sum_{(u,i) \\in \\Theta \\\
    times \\Theta^{-}} W_{ui} \\cdot (r_{ui} - \\hat{r}_{ui})^2$\n```\n\nwhere $\\\
    Theta$ is the set of positive training data and $\\Theta^{-}$ is a subset of missing\
    \ ratings. For implicit ratings, the cross-loss is defined as\n\n```\n$$\\mathcal{L}\
    \ = - \\sum_{(u,i) \\in \\Theta \\times \\Theta^{-}} r_{ui} \\log r_{ui} + (1\
