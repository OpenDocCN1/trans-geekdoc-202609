    # 6.5 Summary


    This chapter presents some recent trends in generative and DL models for recommender
    systems. It begins by introducing classic generative models such as PMF and LDA
    and the methodology of integrating PMF with LDA to create a hybrid model called
    CTR. The second section introduces recommendation frameworks that are purely based
    on DL, where we discuss models as RBM-CF, AutoRec, NCF and RNN. The final section
    of this chapter illustrates the strengths and weaknesses of generative and DL
    models and explains the methodology of merging these techniques to create deep
    generative models such as CDAE and CVAE.


