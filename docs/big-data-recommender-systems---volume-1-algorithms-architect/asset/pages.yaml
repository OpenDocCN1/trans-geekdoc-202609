  md: '# 10 Big recommender systems, volume 1


    # 2.1.1 Definitions of RSs


    There are many definitions of RSs found in literature. RSs are defined as a decision-making
    strategy in the presence of a large, complex set of information [1]. It allows
    for listing of personalized contents and services with prioritization and personalization.
    In the current scenario of information overload from the Internet, it makes possible
    the timely access to important information. It is also referred to information
    filtering system that deals with the problem of information overload [2]. The
    purpose of RSs is to provide support to users in terms of additional knowledge
    in the form of recommendations and to provide hints about products and systems.


    A good definition from [3] states that the RSs are systems that, based on information
    about the past patterns and consumption patterns in general, recommend new items
    to the user. It is a subclass of information filtering system that seeks to predict
    the ''rating'' or ''preference'' that a user would give to an item [4]. According
    to Seroussi [5], discovery assistance is a better term for such systems and he
    argues that the RSs are systems that help users discover items they may like.


    # 2.1.2 The need for an RS


    In this era of web marketing, these systems play an important role. The goal of
    RS is to generate meaningful recommendations to users for items or products that
    interest them. It fetches more revenue for product providers and adds value to
    products and services.


    The rising trend towards the use of the Internet for an ever-growing set of applications
    has forced users to use a number of search engines. A search engine is helpful
    in finding out about object and results in the form of listing of all possible
    sources of information from all over the world. For every query made to a search
    engine, there are thousands of links suggested to the user. a user can find difficult
    to filter and narrow down the search to explore further. Moreover, a large amount
    of irrelevant information is also obtained as a result of the search. This is
    because the search engine relies on pattern matching and finding similarities.
    This problem of information overload from the Internet can be alleviated by the
    use of RSs. Using various filtering techniques, a recommendation system narrows
    down the information on the basis of the behaviour and inclination of the user.


    # 2.2 Applications of RSs


    There are a number of areas where RSs are applied and used. Some of these have
    been in use since the arrival of the Internet. There are a number of other areas
    where the deployment of RSs can be useful as this is expected to increase the
    efficiency of the underlying applications. The following subsections cover these
    areas. The presented applications may not be an exhaustive list, because many
    more areas of applications are adding RSs to explore their benefits and usefulness.'
  merge: -1
  img_proc: true
