    # 11.2.2.1 Kerberos construction


    Kerberos [6] is an authentication protocol that is used for authentication over
    the network. Using this protocol for authentication lets nodes to use nonsecure
    and cheaper channel for transmitting data. Kerberos protocol secures data by tickets.
    Kerberos can be used to increase HDFS security. To connect client and node name,
    HDFS uses Kerberos protocol RPC [7] and for connecting client and data nodes,
    HDFS uses block transfer. In this section, we use Kerberos authenticated. A node
    is using Kerberos protocol to authenticate. When a client gets a token, it means
    that the client uses Kerberos to authenticate Ticket Granting Ticket (TGT). TGT
    can be refreshed if its jobs are running for a long time. When Kerberos TGT is
    distributed to jobs. When key distribution center (KDC) receives a request from
    a task it uses TGT. By using tokens, network traffic is forbidden KDC and just
    time can be extended, but tickets are fixed. The main benefit is that if an attacker
    steals the ticket, the attacker cannot refresh the ticket.


    Also, there is another method for securing HDFS and preventing illegal access
    to file in HDFS. When clients from the data node want to achieve a block, first
    they should communicate to node name to know which data node holds blocks. Name
    node gives permissions to access files and gives block token, and data node checks
    tokens. Also, data node gives name node which enforces name node to give correct
    permissions for accessing data blocks permissions to access data blocks or, by
    verifying block token. Both token and name token are sent back to clients who
    have permission to access the location.'
