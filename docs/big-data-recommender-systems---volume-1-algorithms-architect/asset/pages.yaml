    In a similar manner, authors in [58] propose a context-aware CF RS, for m-commerce
    environments, that aims to identify and exploit influence-based hierarchies among
    users. The authors claim that in any SN, there are some individuals who have some
    inspirational power over the others leading them to their decisions and behaviors.
    Recognizing on SN data, the system identifies “impressive” users and uses their
    profile information in an attempt to make more accurate recommendations and to
    resolve the cold-start problem.


    In [59] A Simultaneous Extraction of Context and Community (SECC) model applicable
    on user context and group structures in pervasive computing environments is presented.
    As authors claim, the model can be utilized in many cases, including community-detection
    and CARSs. The proposed approach allows the seamless and simultaneous discovery
    of user latent patterns and user communities. The SECC model employs reasoning
    on user context and user interactions order to identify communities of users that
    have similar behaviors. This information is exploited for providing recommendations
    based on user profile and/or context behaviors. The SECC model adapts the theory
    of nested Dirichlet process, which allows a nested structure to be built to summarize
    data at multiple levels.


    The authors in [60] introduce the notion of pervasive computing systems and social
    media, called Community Interaction Spaces, in order to enhance interactions among
    users, communities, resources and smart environments. The proposed framework supports
    the formation of dynamic physical or virtual pervasive communities that demonstrate
    modalities for a nontrivial period. The formulated communities are exploited,
    among others, in support of mobile services proactive adaptation through the provision
    of personalized, context-aware recommendations. The system is able to build context-aware
    prediction models through data-mining techniques applied on recorded user-services
    histories of individuals that may belong to specific communities. A community
    member can then benefit from the knowledge—captured in the community behavior
    model—through recommendations for future user-device interactions and providing
    the respective recommendations. Each recommendation is accompanied by a confidence
    level that acts as an index for further handling of prediction by users or services.
    The triggering factor for initiating a recommendation can be either a performed
    user-service interaction or a user status update. The framework utilizes a hybrid
    approach for building the prediction model that allows the extraction and modeling
    of both sequential patterns of user-service interactions and situation/context-based
    patterns of interactions. For the first discrete time, variable order Markov chains
    (VOMC) are employed, while for the second, an adaptation ofive Bayes (NB) statistical
    model is utilized.


    In more details, the history of recorded user-service interactions is modeled
    as $s_t^k$ at time of observation $t_k$ ($k=1, 2, \dots, K$), where the respective
    user interaction is modeled as $s^k=\{c_1^k, c_2^k, \dots, c_n^k\}$, where $c_i^k$
    is the value of context information of type $i$, ($i=1, 2, \dots, n$). Given a
    sequence of actions $d=\{a^{t-1}, a^{t-2}, \dots, a^{t-l}\}$ where'
