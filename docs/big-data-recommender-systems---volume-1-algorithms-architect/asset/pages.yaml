    # 9.6 Related work


    With the availability of large-scale user activity records in the physical world,
    many recent works have tried to improve spatial items recommendation by exploiting
    the GPS data, geographical and social influence, temporal effect and content information
    of spatial items.


    **GPS data.** The task of spatial item recommendation is highly relevant to human
    mobility. It is traditionally studied on mobile data, i.e., cellphone-based GPS
    data. Various works have explored this information to study human mobility and
    have promoted a set of location-based applications including spatial item recommendation
    [46–50]. The raw GPS data is a sequence of time-stamped latitude/longitude pairs
    and there is no mapping information between geo-coordinates and specific real-world
    spatial items. Thus, a spatial item is extracted from users’ GPS trajectory logs
    as the stay points on which a user spends sufficient time [51,52]. The data availability
    of GPS data is limited by the user privacy problem since GPS data is obtained
    from users’ cell phones through telecommunication services. Generally speaking,
    existing systems fall into two categories: systems without or'
