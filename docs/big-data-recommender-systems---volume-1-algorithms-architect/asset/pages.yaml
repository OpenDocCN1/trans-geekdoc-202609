    **Definition 9.1. (Spatial item)** A spatial item is an item associated with a
    geographical location (e.g., a hotel or a scenic spot).


    A spatial item in world has three attributes: identifier, location and content,
    represented by $v$, $l$, and $W$, respectively. The content associated with the
    spatial items refers to the set of words describing the item, such as tags and
    categories. The location information for each spatial item $v$ in the collected
    raw datasets is in form of the (latitude, longitude) pair. A spatial pyramid [13,24,25]
    is adopted to partition and index the entire geographic area, and then index of
    the area containing this location as the identifier $l_v$ of this location. The
    granularities range from cities to streets, depending on the nature of the applications.
    The details of the spatial pyramid are described in Section 9.3.4.


    **Definition 9.2. (User home location)** Given a user $u$, following the recent
    work of [26], define the user''s home location as the place where he/she lives,
    denoted as $l_u$.


    Due to the privacy problem, user home locations are not always available. For
    a user whose home location is not explicitly given, the method proposed in [27]
    is adopted to infer the user''s home location as the cell in the spatial pyramid
    containing most of his/her check-ins.


    **Definition 9.3. (Time)** $t$ is an ordinal variable and $u$ to index the $ith$
    time slice which corresponds to a specific time period.


    The time information available for each record in the collected raw datasets is
    usually in form of timestamps (e.g., "2010-07-24, 13:45:06"). We divide the timestamps
    into time slices using predefined granularity when preprocessing the datasets.
    The model in this chapter focuses on the daily patterns of users'' behaviors as
    the experimental results show that the performance of exploring this pattern is
    best. Thus, we divide the timestamps into 24 slices based on the hours. However,
    the recommendation ability of ST-SAGE is not limited to one specific temporal
    pattern.


    **Definition 9.4. (User activity)** A user activity consists of a six tuple $(u,
    v, l, W, t, s)$.'
