    # 12.3.5.2 l-Diversity


    $l-Diversity is a method that can lessen the risks in k-anonymity regarding the
    revelation of sensitive information [61]. It guarantees that the values of sensitive
    parameters are dissimilar in each equivalence class. $l$-diversity enhances the
    privacy preservation compared with $k$-anonymity and helps to mitigate the risks
    that may occur when using $k$-anonymity, it is still likely that an adversary
    infers sensitive information. This can happen if the distribution of a sensitive
    record in a cluster is very different from the distribution of identical attributes
    in that class.


    Li *et al.* [70] showed possible attacks on $l$-diversity including skewness and
    attack intensity indicating that the $l$-diversity method cannot safeguard against
    these sorts of attacks. Table 12.6 shows that sensitive information needs to be
    “diverse” in $QI$ equivalence class. As each sensitive attribute (disease) is
    diverse within each quotient space, no individual may be reidentified.


    Manavajhalala *et al.* [61] describes a variety of $l$-diversity techniques, including
    the following:


    +   1. Distinct l-diversity: avoiding the occurrence of the most frequent value
    by 1/l in an equivalence class.


    +   2. Entropy $l$-diversity: log $(l)$ is the least acceptable entropy of the
    sensitive information distribution in each equivalence class.


    +   3. Recursive $(c,l)$-diversity: the most common value does not appear regularly.


    # 12.3.5.3 T-Closeness


    In order to solve the problems of previous methods for preventing the privacy,
    Li *et al.* [64,70] proposed an intuitive preserving model named $t$-closeness.
    They indicate that the sensitive information distribution within each $QI$ compared
    with its distribution in the original dataset should be. They also proposed an
    $(n, t)$-closeness privacy method which is more flexible [64]. In this case, the
    method bounds the number of released sensitive attributes that an adversary or
    an observer can gain from the table.


