  md: '# Theoretical foundations for recommender systems 11


    # 2.2.1 Current use of RSs


    # 2.2.1.1 Product recommendation (e-commerce)


    These RSs are meant mostly for commercial applications. For example, if we show
    the intention to buy a book having a title/author/area, the result would be accompanied
    with recommendations for similar titles or other books from the same author or
    other books from the same area. In addition, information is also provided about
    other buyers who bought the same book and also of the additional book suggestions
    in the same area or companion which others purchased. Online marketing of apparels
    and clothes also increases their sales by adding RSs.


    # 2.2.1.2 Movie or music recommendation (entertainment)


    These RSs are personalized according to the user''s likes and previous accesses.
    Such systems should have a profile of the user or similar users to give a better
    and more accurate recommendation. It may have a commercial aspect from the sellers/distributors
    of the genre of movie or music.


    # 2.2.1.3 Scholarly search and news articles


    These RSs ease the search process by profiling the user and other users who search
    from the same area or are involved in the same area of research. Political inclinations
    and the regional environment are also considered for personalized newsletters
    and news services.


    # 2.2.1.4 Services


    These RSs are built to provide recommendations for travelling, consultation, most
    suitable shopping malls, hospitals, etc.


    # 2.2.2 More areas for RSs


    Most of the time, we associate RSs with online retail trade, but there are many
    areas where RSs have found their use. Designers of various applications find value
    addition to their products by adding an RS. Decision-making is therefore easier
    in these applications. Some of the emerging areas are discussed in the following.


    # 2.2.2.1 Recommend courses for students


    On an online registration system for students of a university, this system would
    return a list of courses (based on the past courses and grades) where the student
    has the potential to do well. This would work as the advisory service that would
    include the path pattern for the same academic programme.


    # 2.2.2.2 Perform career counselling


    Based on the academic background and the social status of the user, proper career
    counselling can be performed by the system. In addition, the current trends towards
    a particular field gathered by analysing users would help in the decision-making
    process.'
