    # 4.3.2.2 Preference networks


    The work in [22] suggests preference networks (PNs), a probabilistic model for
    combining content-based with CF into a hybrid recommendation approach. The goal
    of PNs is again to estimating the user to item ratings of the utility (preference)
    matrix for only a limited set of items for each user (top-N ranking), as a user
    is typically interested in a moderate number of items.

    In PNs, each vertex of the undirected directed graph $G(V, E)$ corresponds to
    a rating $r_{ui}$ of user $u$ for item $i$ and each edge captures a relation between
    two ratings, either of item-item or user-item. Specifically, there is an edge
