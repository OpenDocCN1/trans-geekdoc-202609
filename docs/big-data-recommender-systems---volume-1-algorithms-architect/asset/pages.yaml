- pgno: 28
  md: '# Big data recommender systems, volume 1


    Besides the above, many non-traditional areas have started using RSs. Some of
    these areas are tourist guides, financial investments, matchmaking, acquiring
    of property, etc.


    The next section of the chapter describes algorithms and types of RSs. It discusses
    the phases of RSs and discusses in detail about different ways RSs could be implemented
    and used.


    # 2.3 Algorithms and theoretical foundations of RSs


    Work in the domain of RSs has been continuing since the mid-1990s [6]. Since then,
    various useful studies on RSs have been done. Some have surveyed the field of
    RSs [6,7,8,9], some have described different approaches to recommendations [6,10,11,12,13,14],
    some have thrown light on the advantages, disadvantages, and problems related
    to different approaches [6,15], while others have tried to overcome these issues.
    In this section, we will provide comprehensive detail of RSs, along with the description
    of the broad categories that encompasses the RSs.


    RS can be defined as the system that predict and recommend most suitable items
    to the users based on their characteristics. In order to do so, the RS goes through
    a set of phases. These phases are described in the next subsection.


    # 2.3.1 Phases of RSs


    RSs go through the set of the following phases to provide recommendations.


    # 2.3.1.1 Information collection


    In this phase, information related to user is collected. Using this information,
    a user profile is constructed. This profile is essential for the RSs in order
    to provide efficient predictions. There are different ways of collecting such
    information including implicit, explicit, and hybrid feedback from the user. Implicit
    feedback does not need user''s input; rather the RS implicitly collects information
    through different techniques like user''s behaviour on the system, pages visited,
    products clicked, etc. Explicit feedback requires user''s input to collect information
    and construct the profile. Generally, this is done through developing a user profile
    by letting the user fill web forms collect the information and stores it. Hybrid
    feedback combines both implicit and explicit feedback collection techniques [16].


    # 2.3.1.2 Learning phase


    In this phase, user''s features are filtered out and the relevant ones are extracted,
    which could be used in the prediction phase.


    # 2.3.1.3 Prediction/recommendation phase


    In this phase, the prediction or recommendation is made as to which items the
    user may prefer. The prediction could be made solely by using the user''s profile,
    or it may use other techniques to provide recommendations like item similarity
    measures, machine learning techniques, Bayesian techniques, and decision trees.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Theoretical foundations for recommender systems


    # 2.3.2 Types of RSs


    Although RSs are categorized into various categories, we have classified them
    into five broader categories based on the approach they follow to provide recommendations
    to the users. These categories are described in detail in the following.


    # 2.3.21 Content-based recommenders


    Introduction


    This type of RSs provides recommendations of items to a user based on the description
    of item and user''s interest. For example, if the user had a particular type of
    clothing item – which has a feature or description like ‘cotton jeans’ – in the
    past, the system would recommend to use this items that have the similar features
    or description.


    Discussion


    In content-based systems, an item profile and a user profile are constructed.
    Item profile is a collection of records that represent different characteristics
    of the item. For example, particular clothing item would have its size, colour,
    fabric, price, etc., as the specific records of its item profile. Similarly, a
    user profile contains certain information of the item that is useful for the RS
    to produce recommendations. User profile can be constructed through explicit information
    collection from the user or implicit methods for information collection about
    the user as discussed. RSs that produce user profiles are implicitly preferred
    over those that most of the users do not prefer to provide explicit information
    because the information they provide is not authentic or accurate [6,17].


    Once the item and user profiles are constructed, the RS then combines this information
    to generate recommendations for a particular user. A recommendation of an item
    ‘T$_i$'' for a user ‘U$_i$'' is generated by considering ratings R (U$_i$, t)
    where t $\in$ T (T is the set of items) and are similar to T$_i$’. Similarity
    among the items can be computed by using any similarity measures such as cosine
    distance or Jaccard distance [17].


    Recommendations in such cases could also be generated by classification algorithms,
    where the probability that a user would like an item could be estimated. These
    algorithms also help in generating N list of recommendations for a particular
    user. Other methods for producing content-based recommenders are Bayesian classifiers
    and machine learning techniques like clustering, k-nearest neighbours, decision
    trees, and neural networks [6].


    Content-based RSs have several advantages in this approach, and some of these
    are described by Poonam et al. in [8]:


    +   i. Explicit rating system in this approach provides users an independence
    and way to develop their own user profile in the system.

    ii. They can still recommend items that are not yet seen by any user. This is
    advantageous in the case when a new user joins the system.'
