    # 7.3 Recommendation systems: challenges and limitations


    Accuracy, novelty, sparsity, scalability and cold start are problems which RSs
    deal while processing or analyzing large-scale data. These terms will be defined
    as follows:


    +   - High recommendation accuracy: A good recommendation system should output
    a relatively short list of songs in which many pieces are favored by the user
    and a few pieces are not.


    +   - High recommendation novelty: RSs should be diverse and well-balanced, i.e.,
    the system''s content is wide range and informative while not diverging from the
    user''s preferences. Even though most traditional RSs use the similar ratings
    and rankings system, not all of them take diversity ofuser''s preferences into
    account, and this is the reason why they fall short of meeting user''s personalized
    requirements.


    +   - Data sparsity: In fact, loads of commercial RSs stand on large datasets,
    and a large amount of items are left untouched by the majority of users. The user-item
    matrix in CF will be extraordinarily large and sparse, and these are the challenges
    in the performances of the recommendation. Cold start is one of the common complexities
    faced by data sparsity. Recommendation items in CF is based on user''s previous
    preferences, and new users will need to rate sufficient number of items to enable
    the system to capture their preferences accurately and provide reliable recommendations.
    Items newly added to system, require to be rated by considerable number of users.
    Then they possibly will be suggested to users with similar tastes with the ones
    who have rated them. The content-based recommendation will not face any limitation
    by the new item problem, since the recommendation of an item is totally based
    on its distinct set of descriptive qualities rather than its ratings.'
