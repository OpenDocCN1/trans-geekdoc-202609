    # 5.7 Developing approaches for the crisp ontology


    It is widely accepted that there is no common existing methodological approach
    that can solve every DI problem. Adding to provide good guidelines for crisp ontology,
    various ontology development approaches have been presented. An ontology development
    approach provides a framework for scheduling activities or tasks that should be
    followed and performed during the design process. Workflows proposed by different
    approaches fare better or worse regarding efficiency, use, comprehensiveness and
    reliability. A well-organised schedule of activities proposed by ontology development
    approaches can provide methodological supports for ontology professionals. The
    most well-known ontology approaches proposed in current literature are METHOLOGY
    [34], NeOn [35], DILIGENT [36], On-To-Knowledge [37], HCOME [38] and DOGMA [31].
    In addition, Noy and McGuinness [39] presented a very descriptive simple to creating
    crisp ontologies. A set of survey papers, such as Jagger and Marsden [10], are
    also available providing references to existing ontology development approaches
    and their features. To conclude, a considerable amount of approaches can come
    in help for developing crisp ontologies. However, these approaches dedicated to
    crisp ontologies cannot be directly applied to construct Fuzzy-Ontologies due
    to major differences between Fuzzy-Ontologies and crisp ones. In order to develop
    Fuzzy-Ontologies, additional procedures, such as including fuzzy logic to approximate
    vagueness and conceptualising the fuzzified vagueness, have recognised in the
    development process.


    # 5.8 Developing HAs for Fuzzy-Ontology


