    # 13.4.3 Privacy discussion


    In this protocol, we assume that all participants exhibit an honest but curious
    behavior without collision. This means they do not deviate from the protocol,
    but they try to learn as much as possible based on the information they gather
    following the protocol''s steps, cooperating with each other. Using a third party,
    each source is unable to determine data held by other sources. It is only aware
    of its own private data. Carol is neither aware of the actual data nor the amount
    of data residing in each source, thus unable to perform a frequency attack on
    this data. This is mainly due to reasons. First, Carol are encrypted. Second,
    not all data represents actual records in the source due the fake Soundex records
    inserted by the transmission channel and the participating parties. However, this
    serves our purpose of providing privacy. The comparison of the phonetic codes
    takes place at Carol in order to prevent either source from informing information
    upon the size of the dataset of the other party. Furthermore, no information may
    be leaked from intermediate data, since no such data are generated.


