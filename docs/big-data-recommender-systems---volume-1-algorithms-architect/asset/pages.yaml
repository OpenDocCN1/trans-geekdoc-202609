    emerging complex network topologies (e.g., random, small-world (SW), scale-free)
    which, with the features indicated by various SNA metrics (e.g., the clustering
    coefficient and centrality metrics such as degree and betweenness), play an important
    role in identifying the key actors of a network as mediators, ambassadors or experts
    [5], and as in measuring the importance of each node in propagating information
    (detection of the most influential nodes).


    A random graph (RG) model over a set of N nodes can be connected with a fixed
    probability p (relational actor of network). There exist several RG models. The
    most commonly employed (Gilbert model) is G(N,p), in which every possible edge
    connects independently with probability 0 < p < 1. In the Erdős–Rényi (ER) model,
    G(N, E), a graph is chosen uniformly from the collection of all graphs that have
    N nodes and E edges. Scale-free (SF) is a type of network whose distribution follows
    a power law, at least asymptotically. That is, the fraction P(k) of the network
    having connections to other scales for large values as P(k) ~ k⁻γ, where γ is
    a parameter value which is typically in the range 2 < γ < 3, although it may lie
    outside of these [14,15]. SW networks connects to complex systems where most nodes
    are not neighbors of one another, but most nodes can be reached from every other
    where the typical distance between two randomly nodes grows proportionally to
    the logarithm of the number of nodes N, L  log N. Practically, this means that
    nodes of the network are linked by a small number of local neighbors. However,
    the distance between nodes remains small.


    The most notable metrics in SNA that are adopted by RSs can be divided into three
    categories [16]: The first focuses on the network connections via the metric of
    homophily, which measures the tendency of users to connect to the ones they consider
    similar to them (based on, e.g., demographic criteria). Centrality metrics (degree,
    betweenness, closeness) measure each of them from a different perspective, the
    importance of each node in the network, and they form a subclass of local measures
    of the second category of density-centered metrics along with the global measure
    of density, which characterizes networks to be dense when the number of edges
    is close to the maximal number of edges, or sparse. Another metric of this type,
    the average path length, is defined as the expected distance between a random
    selection of a pair of nodes in the network, according to the chosen measure (hop-count,
    Euclidean distance) for shortest paths computation [14]. Last, the segmentation-based
    category includes a set of metrics that identify networks'' structure at both
    node and network level with the most common ones to be the structural cohesion,
    which relates to networks'' connectivity and the clustering coefficient that reveals
    the extent of triadic closure in the network.


    A popular topic in SNA is the one of community detection. The goal of community
    detection in networks is to identify the groups of vertices, known as modules,
    that share common properties within the network as well as their hierarchical
    order [17]. In the case of RS, communities are mostly formed based on users''
    profile and the strength of ties, and are used as input to neighborhood-based
    collaborative filtering (CF) [5]. Identifying changes in networks'' structure
