    disclosure of pieces of information of an individual or its secrecy, while information
    privacy deals with information ownership and the consequences that information
    disclosure has on the individual and/her data-access permissions and controls.


    # 12.2.2 Online social networks, classification, and privacy


    Popularity and interest in social networks have increased considerably over the
    last era. Kaplan and Haelen [22] described social networks as applications that
    permit individuals to form profiles, send requests to friends and see other users''
    profiles. Many forms of information can be included in these profiles, including
    pictures, audio files, and even posts and blogs, each of which may be public or
    semip, to a subset of other users who use social network site [23]. LinkedIn,
    Friendster, MySpace and Facebook are among the most well-known social networks
    that attract many users share their information. In these sites, recommender systems
    can undoubtedly to support user participation by providing new friend recommendations
    or content that a user may be interested in [24].


    By raising the number of users in social networks and sharing more information
    in these sites and also with recommenders, concerns about users'' privacy increase.
    The quantity of data that social network sites collects from users is constantly
    growing while users'' data are extremely valuable for many purposes such as research,
    marketing and numerous additional goals [25]. Simultaneously, an important amount
    of sensitive information can be obtained from users'' data, which should be preserved
    against unauthorized access and revelation [26].


    As mentioned, social network sites can be categorized based on different purposes.
    Some social networks were founded for dating purposes, while other social networks
    were established for purposes such as chatting, socializing, enforcing real-life
    relationships and business. Beye et al. [12] considered two main social network
    types and provided the purpose of use of these social networks as well.


    Moreover, the functionality of each online social network site differs from the
    others. Based on their function, the social network provider may ask users different
    information to provide and share. Hence, information can be shared and disclosed
    within the different sources of social networks. Moreover, privacy concerns for
    users may increase as they share more and more information within different online
    social networks. Therefore, the privacy of a portion of information in its scope
    should be taken into account. Privacy includes protecting a portion of information
    in its scope [12]. The first dimension is breadth, which reflects the number of
    groups of people. The second factor is depth, which shows the degree of allowed
    usage. The last factor is lifetime, which indicates the duration.


    In any of these three dimensions, when a portion of data or information is moved
    outside the planned scope, maliciously or accidentally, a breach of privacy happens.
    Apart from the scope, users in online social networks are contending with privacy
    boundaries. Three boundaries have been recognized for privacy. The first boundary
    for individuals is disclosure. Users try to handle the anxiety of disclosing their
    information in a public or private manner. The second boundary is identity.'
