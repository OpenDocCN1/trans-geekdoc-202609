    $h = [h_1, h_2, ..., h_{n-f+1}] \quad (14.10)$

    ```


    where $h \in R^{n-f+1}$ and after we apply the max pooling over each feature map
    $\tilde{h} = max(h)$. This obtains the most significant features in a feature
    with the highest value is selected. However, multiple features obtain more than
    one features, and those new features are passed to a fully connected layer. A
    fully connected layer contains the $softmax$ function that gives the probability
    distribution over each class. A fully connected layer is defined mathematically
    as


    ```

    $o_i = softmax(w_{io_i} + b_i) \quad (14.11)$

    ```


    Instead of passing the newly constructed feature map $FP = CNN(x_i)$ to $softmax$,
    we pass it into LSTM to extract time domain information.


    # 14.4 Intrusion detection


    Recent and impressive results of deep learning techniques in the area of computer
    vision, NLP and speech recognition for various longstanding AI tasks has been
    motivating in applying deep learning techniques towards security tasks too. This
    paper focuses to apply these taxonomy techniques to the network-based intrusion
    detection (NIDS) specifically TCP/IP packets with a supervised deep learning method
    such as a DNN, and classical ML techniques using connection records of KDD-Cup-99
    challenge data set. To subst, we network traffic as time series, either good or
    bad. The main interest is to evaluate the performance of DNN over classical ML
    techniques such as support vector machine (SVM), random forest (RF), AdaBoost
    (AB) and logistic regression (DT), naive Bayes (NB), $k$-nearest neighbors (K-NN)
    The efficient network architecture for all deep models is best chosen based on
    comparing the performance of various network topologies and network parameters.
    The experiments of such efficient configurations of deep models are up to 1,000
    epochs with learning rate set in the range [0.01-0.05].


