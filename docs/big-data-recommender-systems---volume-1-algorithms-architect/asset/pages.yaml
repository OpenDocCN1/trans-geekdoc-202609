    # Privometer


    Talukder et al. [46] developed the Privometer to compute the leakage of users’
    sensitive information. The computed score is shown by a numerical value. After
    providing the computed score as a numerical value, the tool is able to suggest
    preventive actions, which are also known as self-sanitization actions. One of
    the main features of Privometer is considering all shared information by users
    in online networks rather than just publicly available data. In contrast, a drawback
    of the tool is that it is only applicable to social network sites that permit
    applications to acquire and retrieve individuals’ information.


    # PScore: privacy awareness enhancement


    Petkos et al. [40] proposed a framework to increase the understanding and knowledge
    of individuals who use social networks, considering privacy and security. Three
    separate features have been considered for the framework: personal preference
    of users about the sensitivity of their information, the classified structure
    of information (attributes, values and number of dimensions) to create a semantic
    organization and inferred information out of the scope of social networks. These
    three features cover the prerequisites of the framework and clearly make a distinction
    of the framework compared with other scoring models.


    Beyond scoring frameworks, some studies consider privacy settings in the online
    social network and proposed tools for better privacy configuration. Fang and Leevre
    [47] proposed a “privacy wizard” using machine-learning techniques. Mazzia et
    al. [48] proposed a graphical tool that provides options for privacy, called pViz.
    Although these scoring frameworks are able to measure and compute the privacy
    risk of users, the tools for privacy configuration can also help users and individuals
    to select the best settings for the privacy information in their profile.


    # 12.3.3.2 Polytomous approach


    The other approach for calculation of privacy is polytomous based. The difference
    of this approach with dichotomous one is in the level of shared information by
    individuals. Mentioned earlier, in the dichotomous approach, there are only two
    forms for shared information (the information is public or private), while in
    polytomous approach, we have more than two status for shared information by individuals.
    As this approach can obtain more states for shared information, it can provide
    a more accurate estimation of calculated privacy for the online social network
    users.'
