  md: '# 56 Big data recommender systems, volume 1


    Initially, provide some necessary fundamental concepts regarding information diffusion
    in SNs. Formally, information diffusion is defined as the process by which information
    is communicated through channels among the users of an SN [29]. The main factors
    influencing information diffusion are the network structure (density, centrality,
    clustering, connectivity) and the strength of influence (frequency of interactions,
    strength of influence) [27,28]. A significant aspect of SNA refers to the modeling
    of information diffusion, which can be coarsely classified as explanatory or predictive
    [30]. The goal of explanatory models is to infer the network over which information
    propagates, given the times users learn a piece of information. In contrast, in
    predictive models, the main concept is to predict the outcome of a specific diffusion
    process based on temporal or spatial characteristics [30]. Widely used graph-based
    models of information diffusion are the sender-oriented independent probabilistic
    model where node u at time t becomes active neighbor v at time t+1, with a probability
    p_uv. The process continues until no more activations occur. The receiver-oriented
    linear threshold model is the most popular of the threshold models used in studying
    diffusion. In networks, a threshold value or a set of old values are used to distinguish
    ranges of values where the behavior predicted by the model varies significantly
    [29]. Each edge uv of the network is affiliated with a weight w_uv, and each node
    v has a threshold t_v. In the case of RSs, both explanatory and predictive modeling
    approaches are employed in order to strengthen their performance.


