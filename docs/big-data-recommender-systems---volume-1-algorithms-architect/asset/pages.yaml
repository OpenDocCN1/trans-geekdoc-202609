- pgno: 2
  md: '# IET Book Series on Big Data – Call for Authors


    Editor-in-Chief: Professor Albert Y. Zomaya, University of Sydney, Australia


    The topic of Big Data has emerged as a revolutionary theme that cuts across many
    technologies and application domains. This new book series brings topics together
    within the myriad research activities in many areas that analyse, compute, store,
    manage and transport massive amount of data, such as algorithm design, data mining
    and search, processor architectures, databases, infrastructure development, service
    and data discovery, networking and mobile computing, cloud computing, high-performance
    computing, privacy and security, storage and visualization.


    Topics considered include (but not restricted to) IoT and Internet computing;
    cloud computing; peer-to-peer computing; autonomic computing; data computing;
    multi-core and many core computing; parallel, distributed and high-performance
    computing; scalable databases; mobile computing and sensor networking; green computing;
    service computing; networking infrastructures; cyberinfrastructures; e-Science;
    smart cities; analytics and data mining; Big Data applications and more.


    Proposals for coherently integrated International co-edited or co-authored handbooks
    and research monographs will be considered for this book series. Each proposal
    will be reviewed by the editor-in-chief and some board members, with additional
    external reviews from independent reviewers. Please email your book proposal for
    the IET Book Series on Big Data to: Professor Albert Y. Zomaya at albert.zomaya@sydney.edu.au
    or to the IET at author_support@theiet.org.'
