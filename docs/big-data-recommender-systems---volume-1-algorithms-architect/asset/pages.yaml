  md: '# Chapter 8


    # Deep segregation of plastic (DSP): segregation of

    plastic and nonplastic using deep learning


    K. Sreelakshmi¹, R. Vinayakumar¹, and K.P. Soman¹


    Due to industrialization and urbanization, the rapid rise in the volume and amount

    of hazardous waste and the disposal of it is becoming a burgeoning problem that
    the

    world is facing today. One of the best ways out for this problem is to collect,
    sort

    and reuse or recycle these waste. This work christened deep segregation

    of plastic (DSP) architecture which sorts waste into plastic and nonplastic

    using deep learning technique, convolutional neural network (CNN). CNN is one

    among the efficient modern machine learning techniques, which are able to provide

    maximum learning efficiency by taking raw input samples. CNN has become a state-

    of-the art method for many of the tasks existing in computer vision (CV). For
    some

    the tasks, it has performed well in comparison to the other. This has performed

    well in various tasks of CV compared to standard neural network. The developed

    framework is highly scalable on modest hardware server. The framework collects

    data from different sensors, preprocess, and analyze using distributed algorithms.

    Now this framework is specifically developed for plastic segregation. Moreover,
    the

    framework can be easily extended to handle large volumes of other waste categories
    by

    adding resources. These characteristics have made the proposed framework

    stand out from any other of similar kind. The proposed design also consists

    of a prototype which acts as a real-time classifier. The hardware setup consists
    of

    a conveyor belt over which waste materials are placed, and these are captured
    by a

    camera fitted on the system. The captured image is sent to the DSP which classifies

    it into plastic and nonplastic, and accordingly it is moved to two different bins.

    This system can reduce the human efforts in separating plastics from nonplastics
    and

    in keeping the environment near and clean. The performance of the system is analyzed

    of various data sets. These data sets are collected from public and private sources.

    Various experiments are run for identifying the optimal parameters for CNN networks

    and structures. All these experiments are run until 1000 epoch with varying learning

    rate 0.01–0.5.


    ¹Center for Computational Engineering and Networking (CEN), Amrita School of Engineering,
    Amrita

    V Vidyapeetham, India'
