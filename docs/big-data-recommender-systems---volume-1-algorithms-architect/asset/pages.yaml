    time, weather conditions) in support of user behavior classification and the next
    activity recommendation. In [47], a comprehensive survey and analysis of the state-of-the-art
    on time-aware RSs (TARS) is presented. These approaches are exploiting temporal
    context and time in user modeling and recommendation strategies in order to improve
    overall recommendations performance. The review mainly focuses on reported results
    and conclusions about how to incorporate and exploit time information within the
    recommendation processes and provides a comprehensive classification of evaluation
