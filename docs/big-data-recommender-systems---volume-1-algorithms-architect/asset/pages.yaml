    The next subsection gives an overview of popular datasets that have been used
    for evaluating and comparing RSs.


    # 2.3.3 Datasets for recommendations


    This subsection describes some publicly available datasets to evaluate recommendation
    systems. Some of these datasets contain only user-item rating data and, therefore,
    are suitable for CF techniques, while others contain product catalogue information
    which can be used to make content-based or hybrid recommendations. A brief description
    of these datasets is given in the following.


    # 2.3.3.1 MovieLens


    MovieLens dataset [53] is one of the most popular datasets used for recommendations.
    This dataset is compiled and made available by GroupLens, a research laboratory
    in the Department of Computer Science and Engineering at the University of Minnesota.
    The data was gathered through the MovieLens website, where users specify their
    preferences for movies in the form of five-star ratings. The data is in a user-item
    rating format and contains 20,000 movies by 138,000 users. In this dataset, each
    user is represented by an ID and no demographic information of the user is available.
    However, the published dataset contains only those users who have rated at least
    20 movies. For movies, in addition to IDs, their titles and genre are also available.
    This dataset is most suitable for the CF technique.


    # 2.3.3.2 Jester


    Jester [54] is a research project of UC Berkeley laboratory for Automation, Science
    and Engineering, to study social information filtering. The data are collected
    from Jester online recommendation website [55] and contains continuous ratings
    of jokes by anonymous users on a scale of -10 to +10. Multiple datasets have been
    collected over different time spans and are available on Jester''s website. The
    largest among them is the size of 4.1 million ratings of 100 jokes by 73,421 users.
    This dataset is well-suited for CF in scenarios where a large number of users
    have rated a small number of items.


    # 2.3.3.3 BookCrossing


    BookCrossing dataset [56] has been gathered through a four-week crawl from BookCrossing
    website [57]. The dataset contains 1,157,112 ratings of 271,397 distinct ISBNs,
    rated by 278,858 members of BookCrossing. The ratings are implicit and explicit
    with explicit ratings expressed on a scale of 1–10 and implicit ratings represented
    by zero. The dataset also contains some demographic information of users in the
    form of their Age and Location. Moreover, some content-based information of books,
    including book title, author, year of publication, and publisher, is gathered
    from Amazon website and is incorporated into this dataset. This dataset can, therefore,
    be used for both content-based and CF techniques of recommendation.'
