    and these images are shuffled irrespective of classes. 80% of the images are used
    for training and 20% for testing. An empty hdf5 file is created. These images
    are preprocessed and properly fed to this empty hdf5 file. This hdf5 file is used
    for training. The images are resized to dimensions of (56, 56), and each image
    has three channels. The data order goes as (56, 56, 56) if TensorFlow is used
    as backend, else the data order goes as (3, 56, 56) CV load images as BRG, hence
    it has to be converted to RGB, and this is further processed by resizing and normalizing.
    The images and labels of training and testing data are extracted using SciKit
    packaging.


    **Building neural network:** Neural network consists of convolutional layer, pooling
    layer, activation. By following parameter tuning method, best CNN network is selected.
    CNN has a parameterized function; then, the performance depends on the optimal
    parameters. Initially, two trials of experiments are run for filters in the range
    [4–32] and filter length 3 with the moderately sized CNN composed of CNN, pooling
    by fully connected layer. The CNN network with filter 32 performed well in comparison
    to the other filters. Thus, number of filters value is set to 32 for the rest
