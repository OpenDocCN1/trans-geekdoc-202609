    # 8.2 Related work


    This section discusses the related works of waste segregation. Initially, different
    machines were used to separate the waste into different categories. Few of them
    are as follows [17]:


    +   - Trommel separators/drum screens: Trommel separator consists of a rotating
    drum perforated with holes in it. This separates wastes by their sizes. When wastes
    are passed through the drum, the particles with small size pass out through the
    holes and large particles stay in the drum.

    - Eddy current separator: This is used to separate metallic materials in waste.
    It makes use of electromagnetics for dividing the wastes into ferrous and non
    ferrous categories.

    - Induction sorting: Here the system makes use of different type of sensors connected
    over a conveyor belt to separate the waste.\ Near infrared sensors: This system
    uses the reflectance property as its parameter for distinguishing various waste
    materials, since different materials exhibit different reflective properties.

    - X-ray technology: This system makes use of the density property of various material
    for distinguishing them.

    - Lastly, the manual method is the most widely used method for separating waste.
    Here the wastes are segregated manually by hand.


    George E Sakr automated the recognition of different type of wastes from images
    using learning techniques. He used two learning algorithms, namely CNN and support
    vector machines (SVM). The classifier was built to separate the waste into three
    categories: plastic, paper and metal, and the accuracies obtained for the model
    by using these models were noted and the one was implemented using Raspberry Pi
    3. A mechanical system controlled by Pi guides the waste to its initial position
    through the corresponding trash to which it classified. The final implemented
    model produced in this research had very low average execution time (0.1s) on
    the Raspberry Pi 3 [18].


    Mittal developed a smart phone-based application which detects a pile of garbage
    and identifies the location where the garbage is present by using the location
    access of the smartphones called as "spot garbage." It is built based CNN and
    the model obtained an accuracy of 87%. The model was trained by using the patches
    which extracted from the Bing Image Searches. This research showcases an architecture'
