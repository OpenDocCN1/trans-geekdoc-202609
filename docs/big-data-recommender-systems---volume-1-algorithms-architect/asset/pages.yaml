    system. Wherever there is automation, the research turns in the direction of ML.
    But the performance of ML techniques heavily depends on the training dataset.
    But in the case of cybersecurity, there is no data set that generalizes the behavior
    of all the attacks. This is because attacks are dynamic, and its patterns change
    continuously. In such a situation, the supervised learning techniques are not
    viable in the practical scenario. Other approaches depend on training a large
    volume of network data. The issue here is, there is no unified data set that captures
    the generalities of all the malicious connections. At the same time, graph-based
    methods have shown promising results in detecting anomalies. The perspective of
    sub-dense graph detection has widely used for fake review identification, anomaly
    detection, etc. In the case of fake review identification, detecting fake review
    is formulated as a dense sub-graph identification problem. Based on the motivation
    from dense sub-graph detection problem, researchers have come up with a framework
    multidimensional zoom (M-ZOOM) which detects the sub-tensor/graph of a higher
    order tensor. The highlights of M-ZOOM framework are scalability, provably accurate,
    flexible, effective as mentioned in the base paper [23]. We make use of this framework
    to model ID as an unsupervised learning problem.


    Researchers have introduced various ML-based solutions to IDS. IDS for the enhancement
    of improvement in detecting attacks is largely studied in recent days. This section
    delves into the details of used-based solutions to IDS till disclose the issues
    of the KDD-Cup-99 data set.


    Most research studies considered IDS—a classification task that finds a rating
    plane for the behaviors of normal and attacks in network data. A large number
    of methods introduced following the first paper about IDS. In that, ML and data-mining
    techniques emerged as prominent methods are largely used toward IDS. However,
    their performance is less in comparison to other areas as IDS is an evolving problem
    with new types of attacks. Due to this, IDS has been a vivid area of research
    for the past 50 years.


    The openly available data set for creating an ML model for ID is very little.
    A few data sets exist, each suffers from its own issues. A commonly observed issue
    is that the data set have failed to represent the real-time network traffic characteristics.
    KDD-Cup-99 is the most commonly used IDS data set for benchmarking the performance
    of ML models. KDD-Cup-99 data set was used as part of the ID challenge conducted
    by third International Knowledge Discovery and Data-Mining Tools Competition.
    The aim of the challenge was to classify the connection records as either benign
    or attack. Totally, 24 entries were participated and submitted their results.
    The most of the performed entries used decision tree and its criteria. After the
    challenge, the KDD-Cup-99 data set was most commonly used data set for evaluation
    of various models. Most of the research studies used 10% data set for ID in the
    case of feature reduction. Other few studies have used their own custom-built
    data sets. These custom-built in the data set were constructed using the random
    selection of connection records from 10% train and test connection records.


    After the KDD-Cup-99 challenge, many research studies have used KDD-Cup-99 for
    ID. These studies are not directly comparable to winning entries of KDD-Cup-99
    mainly due to the reason that the research studies have used variations of'
