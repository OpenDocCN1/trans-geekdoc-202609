    # 9.5.1.2 Comparative approaches


    We compare our ST-SAGE model with the following five methods representing the
    state-of-the-art spatial item recommendation techniques.


    **JIM. JIM** [29] is a joint probabilistic generative model which integrates the
    content-effect, geographical-social influence, temporal effect and word-of-mouth
    effect. The word-of-mouth effect refers to the scenario that, a target region,
    the popularity of a spatial item has a large effect on the probability of a user
    visiting that item.


    **LCA-LDA**. LCA-LDA is a location-content aware model which has recently developed
    to support spatial item recommendation for out-of-town users [16]. This model
    takes into account both personal interests and local preferences of each location
    by exploiting both item co-visiting patterns and content of spatial items. Compared
    with ST-SAGE, LCA-LDA is a traditional mixture model which ignores the rules of
    users and does not consider tourist preference and native preference. Moreover,
    LCA-LDA has not integrated the temporal information.


    **UTE+SE**. UTE+SE [9] is a collaborative recommendation model which incorporates
    both the temporal and spatial information. Given a user and his/her querying time,
    this model first finds the users sharing similar temporal preference with him/her
    and produces the time-aware recommendations based on these similar users'' historical
    records around the querying time.


    **CKNN**. CKNN, proposed in [1], projects a user''s activity history into the
    query space and models user preference using a weighted category hierarchy. When
    receiving a query, CKNN retrieves all items and users in the querying location
    then applies a user-based CF method to predict the rating of a querying user on
    an unvisited item. That the similarity between two users in CKNN is computed according
    to weights in the category hierarchy, CKNN is a hybrid recommendation method.


    **UPS-CF**. UPS-CF [7] is a collaborative recommendation framework which is specifically
    designed for out-of-town users. This framework integrates user-based collaborative
    filtering and social-based collaborative filtering. That is, it recommends spatial
    items to a target user according to the activity records of both his/her friends
    and similar users.


