- pgno: 275
  md: '# Chapter 12


    # User’s privacy in recommendation systems applying online social network data:
    a survey and taxonomy


    Erfan Aghashian$^1$, Saurab Garg$^1$, and James Montgomery$^1$


    Recommender systems have become an integral part of many social networks and extract
    knowledge from a user’s personal and sensitive data both explicitly, and implicitly.
    This trend has created major privacy concerns as users are mostly unaware of what
    data and how much data is being used and how securely it is used. In this context,
    several works have been done to address privacy concerns for usage in online social
    network data and by recommender systems. This paper surveys the main privacy concerns,
    measurements, and privacy-preserving techniques used in large-scale online social
    networks and recommender systems. It is based on historical works on security,
    privacy-preserving, statistical modeling and datasets to provide an overview of
    the technical difficulties and problems associated with privacy preserving in
    online social networks.


    # 12.1 Introduction


    Online social network services have become one of the most well-liked and accepted
    services on the Internet. These networks deliver an infrastructure that individuals
    can connect with one another, share information, exhibit their emotions and attitudes
    and shape and make a connection with distant individuals on the Internet [1, 2].
    These networks such as Facebook, LinkedIn, Google+, Twitter and other social networking
    sites have all advantages, practical (such as sharing employment in a LinkedIn
    profile) and social (like connecting with distant friends via Facebook).


    In order to increase the data utility in such social networks, recommender systems
    can deliver personalization of a collection of items to online social network
    users based on their nature. Meanwhile, the personalized suggestions and recommendations
    in these systems are heavily dependent on users’ information. This can increase
    the probability of information leakage of users in such networks [3]. Further,
    information


    $^1$Discipline of ICT, School of Technology, Environments and Design, University
    of Tasmania, Australia'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 260 Big data recommender systems, volume 1


    sharing creates real threats to a user''s privacy. In this case, there is a need
    for data protection. Fundamentally, data protection means clear sets of rules
    and regulations, policies and diverse measures that is provided for information
    security and lessening the invasion into a user''s privacy. This invasion can
    be initiated by gathering, storing and distributing private data [4]. Hence, there
    is a need to understand the various types of recommender systems, privacy concerns
    in such systems and the ways which users'' privacy can be protected.


    In this survey, we first introduce recommender systems and their techniques. Then,
    in Section 12.3, we discuss the risks and concerns for users in online social
    networking sites and explain the different methods for securing users'' privacy
    in privacy approaches. In Section 12.4, we describe the privacy-preserving models
    in online social networks and recommender systems.


    # 12.2 Recommender systems and techniques: privacy of online social network data


    A recommender system delivers a set of items that is pertinent to a specific user
    of a system [3]. This set can vary based on the nature of each online social networking
    sites. Moreover, prediction in these systems is provided based on the characteristics
    of the users, and the item itself which would be recommended to users [5]. These
    systems collaborate with users and just specific items which the users may be
    interested in [6].


    Several classifications have been mentioned and considered for recommender systems
    [6]. The most well-known one is collaborative [7] which is applicable in different
    fields of research and industry. The second method is content based. In this method,
    there is a need for long-term observation of users'' preferences in social social
    network [8]. The third technique is demographic. This technique is useful for
    the times that there is not much information about a user''s preferences. Therefore,
    demographic information such as age or education level is used in such systems
    [9]. The last type of systems is knowledge based. Providing feedback by users
    is the key point for designing the type of systems. By providing more feedback
    to the system, the knowledge of the system will improve, and better recommendations
    will be provided for users [10].


    While these systems bring many advantages for the users in online social networking
    sites, the privacy risks inherent to data gathering and processing are often undetected
    or degraded. In order to protect the privacy of a user''s sensitive information
    and avoid any security concern, there is a need to apply encryption and anonymization
    techniques for privacy preservation in recommender systems is encryption-based
    while anonymization of dataset is for privacy-preservation of online social networks
    users. In this section, first, the definition of privacy is discussed to understand
    what is considered sensitive or private information. Then, classification and
    different types of online social network are discussed to clarify the goal of
    each online social network sites and what can lead to privacy concern or risk
    for users in such sites.'
