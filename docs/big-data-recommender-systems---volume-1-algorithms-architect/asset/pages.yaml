    our model in a way by adding the effect of all the facets in the log space to
    avoid\ the inference of the massive latent “switching” variables, with the aim
    of achieving improved robustness and predictive accuracy.


    While modeling user-visiting behaviors, ST-STAGE takes into account users’ personal
    interests and dynamics of user behaviors caused by spatial-temporal drift. ST-STAGE
    learns a user’s preference as a topic-based vector, by mining both the co-occurrence
    patterns of spatial items and their associated content information (e.g., comments
    and categories). One advantage of exploiting the content information of spatial
    items is to address the locality problem in out-of-town scenarios, where the content
    information associated with spatial items serves as the medium for transferring
    preference of a user mined from his/her hometown to the unfamiliar regions.


    To adapt to temporal dynamics of user behaviors, ST-STAGE recognizes two roles
    of each individual in a specific region: local or tourist. Given a specific location
    and a specific time, ST-STAGE mines the visiting records from local users to learn
    temporal preferences visiting records from tourists to learn temporal preferences.
    Users with the same role at location are more likely to share similar preferences
    and behavior patterns at a specific time. Thus, we recommend spatial items to
    a target user $u$ at location $l$ and time $t$, we consider only u’s personal
    interests but also the temporal preferences of the crowd who have the same role
    as $u$. In this way, we leverage the crowd’s temporal preferences to overcome
    the sparsity of individuals’ activity data at out-of-town regions at a specific
    time. Specifically, given a user $u$, at time $t$ and his/her current location
    $l$, we first find a group of users sharing the same role with $u$ when they visited
    and then produce the time-aware recommendation based on their temporal preferences
    and the user’s personal interests.


    When using visiting history to learn the temporal native and tourist preferences
    of a specific region, we still face the data sparsity, especially when the target
    region is small. Given a specific region $r$ and time $t$ (e.g., at night), when
    there are insufficient visiting records generated at the given spatotemporal context,
    their native preferences and tourist preferences cannot be inferred accurately.
    To overcome the data sparsity problem, ST-STAGE integrates a adaptive spatial
    pyramid, which is a tree structure proposed in [13]. It is first constructed by
    partitioning locations of spatial items into spatial grids of varying sizes at
    different hierarchies. Then, ST-STAGE applies the additive framework [18,19] to
    learn the native preferences and tourist preferences of each region. Briefly,
    when learning the temporal native preferences and tourist preferences in a region,
    the two variables learned for all of the region’s grids in the spatial pyramid
    will be added. Given a specific region $r$ and time $t$, if there are few or no
    activities, we can still infer their native preferences and tourist preferences
    guided by their ancestor grids, which have larger scales of geo-regions and thus
    have more check-in records. Another advantage of the integration of the spatial
    pyramid is allowing users to switch between different scales of geo-regions (e.g.,
    zoom in/out a Google Map) without relearning the parameters. In this way, this
    model can be seamlessly connected with Google Map.'
