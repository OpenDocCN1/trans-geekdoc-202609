    # 14.6.3 Experiments


    This section deals with the performance evaluation of deep learning and ML techniques
    for detecting and classifying phishing URLs. The preprocessed URLs are passed
    to RNN, CNN, LSTM, IRNN, GRU, CNN-LSTM and LR with bigrams.


    # 14.6.4 Hyper-parameter tuning


    The deep learning experiments are trained using the BPTT approach. The performance
    of deep learning models like RNN, IRNN, LSTM, GRU and CNN-LSTM implicitly depends
    on the hyper-parameters. In order to reach the optimum parameters, we need to
    use for hyper-parameter tuning. We ran for for 1,000 epochs with learning rate
    0.001 and batch size 256.


    The experiments were run for three trials for 32, 64, 128, 256, 512 number of
    units/blocks with a basic LSTM network. The architecture of a basic LSTM contains
    a single LSTM/RNN/GRU/IRNN. These are followed by dropout 0.2 and fully connected
    layer with 1 neuron (since it is a binary classification problem). The performance
    with 256 memory blocks/units in LSTM/RNN/IRNN/GRU outperformed the other architectures.


    Experiments by passing bigram as input to LR showed lower performance compared
    to level architecture. The experiments were run for three trials for the filters
    4, 16, 32, 64, 128, and 512 with filter length 4 in a CNN network. The architecture
    of CNN includes convolution 1d, max-pooling 1D pool with length 2, fully connected
    layer with 1 neuron (since it is a binary classification) and sigmoid as the activation
    function. It was found that the performance of CNN with 256 filters outperformed
    the other filters. Here, we decided to fix 25 as the number of filters for the
    remaining experiments. The detailed results are reported in Table 14.20. The ROC
    curve for both the deep learning architectures and classical ML classifiers for
    phishing URL detection is shown in Figure 14.7.


