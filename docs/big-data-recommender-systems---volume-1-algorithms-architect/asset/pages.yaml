    # 2.3.2.4 Image-based recommenders


    Introduction

    This type of RSs provides recommendations to the users based on the similarity
    between the images of the products. The similarity is computed by focusing on
    different features of the product like style, colour, size, shape, and texture.


    Discussion

    There are different approaches that are being followed to develop image-based
    RSs. These approaches are commonly based on different machine learning techniques
    encompassing supervised and unsupervised learning approaches. Some of the used
    techniques involve simple feed-forward neural networks, convolutional neural networks,
    support vector machines (SVMs), etc. Table 2.2 provides an overview of different
    approaches used in different scenarios for image-based recommendations.


    # 2.3.2.5 RSs using GDBs


    The goal of recommendation systems is to generate meaningful recommendations to
    enhance the user experience in the context of choosing a possibility. This is
    usually by predicting the interest of a user based on various types of information
    [24,25,26]. The usage of graphs in recommendation systems is not something new
    and the people working in domain recommendation systems have been using graphs
    in different ways since early days of recommendation systems [25,27,28]. Aggrawal
    et al. used an approach based on graph algorithms for content-based filtering
    [27]. Silva et al. used graph to represent the social network or to recommend
    friends in a social network based on the topology of the network graphs [29].
    Huang et al. used a two-layer graph for a digital recommendation system [25].
    An attempt to produce a hybrid CF- and content filtering-based online newspaper
    recommender using graphs is discussed in [28].


    There has been tremendous work in last decade to develop new approaches for recommendation
    systems. The performance of a recommendation system is heavily dependent on the
    processing of a lot of users'' historical data [30]. GDBs have introduced new
    perspective to deal with interconnected data in huge sizes.'
