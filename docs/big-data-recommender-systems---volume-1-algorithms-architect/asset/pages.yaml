    # 14.1 Introduction


    Over the years, the internet has served as a powerful medium for communication.

    Today''s world in order to hold a successful venture, it is mandatory to have
    a web presence and proper space to manage the files and the data. The proper management
    of data and files is inevitable without computers. Despite these advantages of
    the systems that we use, there is always an attempt to access, modify and misuse
    the data of an organization/institution/individual. Data is the vital part of
    any organization, institution or individual. There so arises questions—Is there
    any unauthorized access to the system? If yes, what are the possible ways to detect
    and prevent the unauthorized entries? Intrusion detection (ID) is the approach
    to detect the unauthorized access, abuse and misuse of computer systems by external
    and insider intruders. The proliferation of heterogeneous computer network resulted
    from the task of detecting intruders very challenging. Detection of ID and phishing
    URL detection have been deployed in organizations on an experimental basis. But
    none of them provide an absolute solution to tackle the problem of detecting intruders.
    The fundamental assumption in an IDS (system) is that the behavior of an intruder
    is notably different from that of a legitimate user. The conventional techniques
    used to detect intrusions are the anomaly and rule-based misuse models. However,
    the conventional techniques easily fail in detecting new attacks.


    The commercial tools existing in the market are based on statistical measures
    or threshold approaches that use traffic parameters as packet length, inter-arrival
    time and flow size as features to learn the network traffic patterns in a particular
    time window. The commercial system may limit the performance in detecting the
    complex attacks mainly because the statistical measures are computed based on
    packet header and packet length.


    In recent days, to detect and classify the phishing activities from benign characteristics,
    self-learning systems are being used. In recent days, to detect and classify the
    phishing activities from benign characteristics, self-learning systems are being
    used. Self-learning systems is an ML method that is either supervised or unsupervised.
    Both supervised and unsupervised use a large corpus of phishing and benign connection
    records to learn the network traffic behaviors with the aim to distinguish between
    the benign and attack connections in a network. Self-learning system has the capability
    to detect the unknown intrusions that help in taking the necessary countermeasures
    in a timely manner. ML methods-based for real-time IDS are prominent methods used
    largely for IDS. They are not effectively mainly due to the model''s output in
    a high false positive rate (FPR) and ineffective in detecting the novel intrusions
    [1]. The main reason is that the ML models learn the attack patterns of simple
    features of transmission protocol (TCP)/internet protocol (IP) packets locally.
    However, the recent development of ML models resulted in a deep model of ML called
    deep learning. Deep learning models have achieved significant results in various
    long-standing AI tasks in natural language processing (NLP), image processing
    and speech recognition [2]. It has two essential characteristics: (1) ability
    to learn the complex hierarchical feature representation of TCP/IP packets globally.
    (2) Ability to memorize the past information in large sequences of TCP/IP'
