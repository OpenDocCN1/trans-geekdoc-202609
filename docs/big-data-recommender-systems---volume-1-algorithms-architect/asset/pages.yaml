    +   4. **Classification**nThe probability whether a URL is malicious or not is
    found out using the sigmoid function. The sigmoid function has values in the range
    [0, 1]. The equation for the sigmoid function is as follows:


    ```

    $a = \frac{1}{1 + \exp(-x)} \quad (14.17)$

    ```


    The loss function used is binary cross entropy function.


    ```

    $loss = -left(\frac{1}{N}\right) \times \sum_{i=1}^{m} (y_i \times \log(a_i) +
    (1 - y_i) \times \log(1 - a_i)) \quad (14.18)$

    ```


    where $a$ is the predicted probability and $y$ is the true label, $m$ is the total
    training examples. To minimize the binary cross entropy, we use adam optimizer.'
