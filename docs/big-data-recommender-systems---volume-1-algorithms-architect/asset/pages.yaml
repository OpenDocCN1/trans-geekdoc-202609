- pgno: 38
  md: '# Big data recommender systems, volume 1


    # 2.4.2 Cold start problem


    When a new user or item is entered into the system, the cold start problem arises.
    In this case, it is not easy to provide recommendations as there is not much information
    available regarding the new user or new item. Therefore, useful recommendations
    are not produced. There are three kinds of cold start problems: new user problem,
    new item problem, and new system problem.


    # 2.4.3 Scalability


    As the number of users and the size of data increases rapidly, RSs suffer from
    scalability problem and could produce inaccurate or inefficient results. In fact,
    the users demand timely recommendations, and to overcome this challenge, RSs require
    high computational resources.


    # 2.4.4 Overspecialization or diversity problem


    This problem restricts the user to get already known recommendations or recommendations
    that are very specific to their profile, which does not allow them to discover
    newly added items to the system or other available options.


    # 2.4.5 Vulnerable to attacks


    Many hackers try to promote certain items on the web by hacking the RSs, which
    makes them vulnerable to attacks. This makes it one of the major challenges faced
    by the developer of any RS.


