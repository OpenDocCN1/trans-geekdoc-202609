    # 9.2 Preliminaries about SAGE


    Our proposed model is inspired by the SAGE model [17]. SAGE is an effective generative
    mixture model in the situation where a variable is affected by several factors
    as it does not need for explicit switching variables and has been widely used
    in many existing work [20–23]. The key technical difference from traditional mixture
    models is that the mixture occurs in the natural parameters of the exponential
    family instead of distributions. Such a model is robust given limited training
    data as it does not have to infer a complex variable to distinguish the set of
    cases.


    To provide a clearer explanation of SAGE, we compare it with a traditional probabilistic
    mixture model, LCA-LDA [16], as an illustrative example. LCA-LDA is a location-content-aware
    model which aims to mimic the process of decision-making when visiting spots.
    There are two factors affecting users'' decision-making in checking in spots:
    the user’s personal interest θuserᶜ and the influence of local preference θrowᶜ
    (note that, it does not distinguish between native preference and tourist preference).
    LCA-LDA combines the two factors in a unified manner. Specifically, in this traditional
    probabilistic mixture generative model, by querying a user u at a target location
    l, the likelihood that u will prefer item v is computed by combining the two factors
    through a linear combination as follows:


    ```

    $P(v|θ_{userᶜ,rowᶜ}) = \lambda_u P(v|θ_{userᶜ}) + (1 - \lambda_u)P(v|θ_{rowᶜ})$  (9.1)

    ```


    where $\lambda_u$ is the “switching” variable and obviously it needs to be trained
    for each user. For each record, other than the latent topic, we also need to sample
    the switching variable. Thus, the complexity is doubled. Unlike the increased
    complexity, when the data is sparse, it cannot be inferred as the training data
    for each individual user even sparser. In contrast, SAGE combines the two generative
    facets through simple addition in log space, as shown in (9.2). Clearly, SAGE
    avoids the computation for latent switching variables.


    ```

    $P(v|θ_{userᶜ,rowᶜ}) = P(v|θ_{userᶜ} + θ_{rowᶜ}) = \frac{exp(θ_{u,v}^{userᶜ} +
    θ_{rowᶜ})}{\sum_{v''} exp(θ_{u,v''}^{userᶜ} + θ_{rowᶜ})}$ (9.2)

    ```


