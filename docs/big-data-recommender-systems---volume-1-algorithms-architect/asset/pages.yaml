    algorithm decreases the effect of attacks from the irritation to system''s integrity.
    In addition to make the algorithm powerful, we should use effective approaches
    for detecting attacks.


    One of the usual defenses is to make it difficult for an attacker to assemble
    a profile. These measures have a lot of costs for the owner of the system. Also,
    these measures may not be effective for recommender systems, e.g. data usage on
    logs [13].


    # 11.5.3 Detection methods


    There are some methods that to first detect and prevent profile injection attacks.
    We want to discuss the multi-strategy method for attack detection and prevention
    that contains supervised and unsupervised methods, anomaly detection and vulnerability
    analysis. Classifying profiles leads to detect suspicious profiles. Some attacks
    that do not follow these patterns of probability lower impact than attacks that
    follow them. If we have a knowledge base of attack models and are able to detect
    attack models, then attackers may use other attack models that have lower effect.
    To greater impact, larger attack models should occur and larger attack models
    are more detectable. Finally, we have to minimize the effect of profile injection
    attacks [13].


    # 11.5.3.2 Detection attributes for profile classification


    Storing data need a sparse and high-dimensional data structure. So, using supervised
    learning methods is not possible. Large number of combining needs to generate
    an appropriate training set that supports all attacks models. This idea is not
    possible and it is unrealistic. For creating a set with lower dimensions, we use
    statistical computing on profiles and use attribute reduction techniques. As we
    noted before, each profile is assigned a label that expresses an attack profile
    or an original profile [13].


    # Generic attributes for detection


    Using generic attribute technique believes that the general statistical signature
    of attack profiles is different from original profiles. The reasons of this difference
    are first for target item ratings and for the distribution filter item ratings.
    In [9], [10], [19] and [34], authors prove that an attacker may not have the entire
    knowledge of system ratings in fact. Attack have patterns deviation in comparison
    with original profiles.


    Generic attributes are used to classify the dataset and analyze its distribution
    deviation. In [34], some extended attributes are proposed as follows:


