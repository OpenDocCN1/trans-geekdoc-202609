    # 14.6 Phishing URL detection


    Phishing URL is one of the major threat in cybersecurity, Phishing URL is responsible
    for various cyberattacks like spam, identity theft, financial fraud. The growth
    on the internet increases the rate of fraudulent activities on the web. The traditional
    methods like blacklisting are inefficient in handling variants of phishing websites
    and also fails to detect new malicious website. The traditional methods require
    human intervention to update the database of phishing websites. The ML-based solution
    has shown promising results in challenging problems in security. In such a scenario,
    we propose deep learning which is a subset of ML to detect and classify phishing
    websites. In this work we have used various deep learning architecture like CNN,
    RNN, LSTM, GRU, IRNN. The experiments mentioned in the work were run till 1001
    epochs with a learning rate in the range [0.01–0.05].


    # 14.6.1 Data description of phishing URL detection


    The second task is detecting phishing URLs and classifying it into benign and
    malicious. The legitimate URLs for preparing the data are crawled from Alexa and
    DMOZ directory and phishing URLs are crawled from Phishtank and OpenPhish. The
    data statistics are described in Table 14.19. The URL which are randomly grouped
    into train and test data. These data sets are transformed into a numeric format
    using text encoding.


    # 14.6.2 URL representation


    Data representation in numeric format is very important in any ML tasks. Text
    encoding converts the raw features into numeric values. There are mainly two types
    of text representation—sequential and nonsequential representation of texts. Sequential
    representation retains the word order, whereas nonsequential representation does
    not retain the word order. We used a sequential representation of texts. Sequential
    representation involves tokenizing the sentence into words and words into characters.
    In the preprocessing stage, the uppercase character is replaced by lowercase character.
    The vocabulary is built using lowercase training characters. The second step includes
    vocabulary creation using the training data. The size of vocabulary creation acts
    as an equilibrium between the training vectors of each class and the number of
    parameters to learn the given task. The input text is converted into a list. A
    number is assigned to each unique characters in the list. Each unique id is a
    vector that denotes the size of the vocabulary. This character unique are transformed
    into feature


