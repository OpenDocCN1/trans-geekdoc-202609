- pgno: 17
  md: '# Chapter 1


    # Introduction to big data recommender systems—volume 1


    Osman Khalid¹, Faisal Rehman¹, Samee U. Khan²

    and Albert Y. Zomaya³


    # 1.1 Background


    The past few years have seen significant evolution in Internet technologies that
    has allowed the deployment of a large number of web-based social networking and
    e-commerce applications. With 7.5% rise in global Internet population from 2016,
    the current users on the Internet have increased to 3.7 billion worldwide interacting
    with thousands of online applications such as Facebook, Twitter, Instagram, YouTube,
    Amazon, and FourSquare, to name a few [1]. This rise in accumulation of huge volumes
    of data, also known as big data, on the daily basis in the form of images, videos,
    ratings, reviews, opinions, comments, remarks, feedback, and comments for any
    item that may be a product, event, individual, or service. It has been reported
    in [2] that in just a single minute, the YouTube users upload 72 new videos, Google
    receives 37,140 search queries, Facebook users share 2,460,000 pieces of content,
    Twitter users perform 473,000 tweets, Instagram users post 49,380 new photos,
    Yelp users post 380 reviews, and Pinterest users post 3,472 images. Over 2.5 quintillion
    bytes of data are created every single day, and it is estimated that by the year
    2020, 1.7 MB of data will be created every second [2].


    Powerful and versatile tools are badly needed to automatically uncover hidden
    patterns and associations from tremendous amounts of big data and transform such
    data into organized knowledge. The fields of information engineering and computational
    intelligence have made significant progress over the past decades. The potential
    ability to create intelligence from the analysis of raw data has been successfully
    applied to diverse areas, such as business, industry, sciences, social media,
    and e-commerce, to name a few. The overwhelming size of data has shifted the focus
    of research community from simple information extraction to filtering of pertinent
    information. recommender systems were introduced in early 1990s as useful information


    ¹Department of Computer Sciences, COMSATS University Islamabad, Abbottabad Campus,
    Pakistan


    ²Department of Computer Sciences, North Dakota State University, USA


    ³School of Information Technologies, University of Sydney, Australia'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Big data recommender systems, volume 1


    filtering tools for guiding users in a personalized way to discover products or
    services they might be interested in a large space of possible options [3]. These
    systems apply various data mining and knowledge discovery techniques on users''
    contextual and historical data to extract personalized recommendations in the
    form of products, services, or information that closely matches a user''s preferences
    [4]. Recommender systems consider various factors such as stability, accuracy,
    diversity, and novelty to keep a balance of recommended items in context of a
    user''s choices [3]. Now, almost every e-commerce application has an integrated
    recommender system to boost business and converting targeted suggestions to purchases.
    For example, Netflix, an online movie hosting website, has a built-in movie recommender
    system. The chief production officer, Neil Hunt, of Netflix indicated that more
    than 80% of movies are watched through recommendations, and per year, 1 billion
    dollar is generated through recommended movies [5]. It is estimated in a Microsoft
    Research report that 30% of Amazon''s page views are from recommendations [6,7].
    The popular video hosting website YouTube reported in 2010 that recommended views
    for about 60% of all video clicks from home page [8]. Similarly, the coupling
    of online networks, such as Facebook, with recommender systems created new opportunities
    for businesses that consider the social influence important for their product
    marketing. The social networks utilize recommendation engines to improve the user
    experience by personalizing the content that is provided to each user and enabling
    connections.


    The recommender systems perform their computations on user-to-item interactions
    that may be in the form of explicit ratings, or when a user selects numerical
    values from a specific evaluation system (e.g., five-star rating system), or implicit
    check-ins, which counts the number of user interactions with a particular item,
    venue, or content of interest [3]. Most online applications now allow the users
    to write text feedback about the item or service they interacted with. The basic
    idea of recommender systems is to utilize these various sources of data to infer
    customer interests. In mid-1990s, the traditional methods of recommendations were
    usually used based on user-based collaborative filtering [7]. The first step in
    such techniques was to search across users who had similar to a given user, such
    as similar patterns, and then recommend items of most similar to the given user.
    Despite initial successes, the user-based collaborative filtering faced numerous
    challenges over the years in terms of scalability and recommendation quality with
    the gradual increase in volumes of data. In recent years, the big data has defined
    by four Vs: Volume, Variety, Velocity, and Veracity [9]. Volume represents the
    amount of data in terabytes or petabytes, or more that is processed to compute
    recommendations. Variety represents the various types of data extracted from different
    sources like e-commerce sites or social networks in any format structured, unstructured,
    or semi-structured that should be handled by the system. Velocity means the speed
    with which data are generated on the Internet, e.g., large number of Amazon users
    giving feedback of thousands of items on daily basis. Finally, the Veracity means
    the reliability and trustworthiness of data. It is quite possible that reviews,
    opinions, or feedbacks are manipulated or sponsored by different stakeholders
    of online business for their personal interests [9].'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction to big data recommender systems—volume 1


    Unfortunately, algorithms based on traditional user-based collaborative filtering
    have not evolved in capacity to handle this new volume of big data in real time
    or in an online modality. One major issue faced by traditional approaches is data
    sparsity and cold start [4]. Data sparseness occurs when we have insufficient
    entries of user interactions with items, resulting in loss of recommendation quality.
    Cold start results when a user is new to the system and not have enough entries
    in the system to generate preferences. To address the issues (such as scalability)
    in traditional user-based recommendation algorithms, a variety of techniques have
    been developed over the years that attempt to reduce the dataset in a structured
    manner [7]. Such techniques utilize various data preprocessing and refinement
    phases to omit the high- or low-frequency items, or partition data by classifying
    various items. However, these models have their own limitations in dealing with
    data sparsity and cold start problems, while attempting to balance the recommendation
    qualities in terms of different evaluation metrics [10]. In recent years, numerous
    models based on item-based collaborative filtering, deep neural networks, and
    hybrid of user-item collaborative filtering have been proposed to address the
    challenges in the traditional recommendation approaches [3,4,10].


    In current era, numerous research works are in progress to improve the scalability
    and quality of big data recommendation models. The parallel computing architectures,
    such as OpenMP [11], message passing interface (MPI) [12], MapReduce [13], and
    Spark [14], have been employed to boost the recommendation computations. For instance,
    Hadoop [15] has its own system file Hadoop Distributed File System (HDFS) which
    is deployed. Hadoop distributes the data in different clusters that perform the
    computations in parallel. However, the dependencies among data present further
    challenges to parallel computation operations.


    In the past few years, numerous recommendation approaches have been proposed to
    address various challenges of recommender systems. However, there are still many
    open and unresolved issues that require novel and more efficient recommendation
    solutions to handle big data.


