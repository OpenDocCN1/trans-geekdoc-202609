    training set, and $\lambda$ is a parameter used to control the extent of regularization.
    The regularization term $\lambda (||x_u||^2 + ||y_i||^2)$ is used to avoid overfitting,
    and the value of $\lambda$ is data-dependent and usually determined by experiments.
    By taking the biases into account, the prediction of rating $r_{ui}$ could be
