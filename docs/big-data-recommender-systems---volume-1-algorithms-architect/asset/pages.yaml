    The task of detecting intrusions is a classification task in most of the research
    papers. The goal is to find a separating plane that separates the normal and phishing
    behavior in the traffic data. ID has been a challenging problem and Denning [26]
    paved a way for several research papers. In most of the research papers, data
    mining and ML-related methods are widely used. However, the performance of these
    methods is less than other techniques due to the dynamic and changing nature of
    intrusion data sets. Some technique, modeling ID as a graph-based problem has
    shown promising results. Graph partition methods have applications like clustering
    and detection of dense graph in social and biological networks. There are rich
    in graph-partition problems. Andersen et al. [27] have presented a variation of
    PageRank with a specified location for torsion partitioning algorithms. Lesovec
    and Mcauley [28] have formulated the task of detecting social circles in a network
    as a node clustering problem on a user''s ego network. Subgraph-based fraud detection
    in the area of telecommunications has been used in [29]. Akogh et al. [30] have
    proposed an algorithm named Oddball for detecting anomalies in a weighted graph.
    The study in [30] focused mainly on undirected graphs and can be extended to directed
    graphs. The study by Beutel et al. [31] proposed an efficient method called CopyCatch
    that analyzes the social graph between users and pages and also the time at which
    they are created. By identifying the lockstep page like patterns in the graph,
    the illegal page to different pages can be identified. Researchers in [32] have
    used the concept of SMR co-clustering for detecting the suspicious network connections
    in the KDD-Cup-99 data set. Research has also moved in the direction of tensor
    decomposition methods. Tensor decomposition opens a new way of analyzing the network
    traffic data and overcomes the shortcomings of the existing methods in the field
    of security. Tensor is a multidimensional array and tensor decomposition breaks
    down a tensor such as a log file into a set of components. Shin et al. [23] proposed
    a framework called M-ZOOM to identify the dense blocks in a tensor. In this work,
    we use the framework provided by [23] for classifying intrusions as either benign
    or phishing.


