    classical ML is the ability of DNN to learn the features by itself. In any deep
    learning architecture, there is a forward propagation, backward propagation and
    minimizing the loss function with respect to its parameters. These parameters
    are weights and bias. The activation function used plays a key role in training
    a neural network. One of the difficulty when activation function like sigmoid
    ($\sigma$) is used is the problem of vanishing gradient.


    As a result, when the number of layers increases, it becomes difficult to tune
    the parameters of different layers in neural network, and the problem of vanishing
    gradient becomes more significant. In Figure 14.1, the derivative of sigmoid function
    (\sigma$) is almost zero for high positive and negative values in the domain.
    This leads to vanishing gradient.


    This problem is overcome by using $ReLU$ activation function. The mathematical
    representation of $ReLU(x)$ is given below:


    ```

    $f(x) = \max(0,x)$ (14.1)

    ```


    The derivative of $ReLU$ function is 1 if $x > 0$ and 0 if $x < 0$. The gradient
    has a constant value for $x > 0$; this reduces the chance of the gradient to vanish.
    The gradient of $ReLU$ is constant, it boosts the learning during training the
    neural network. In $ReLU$ for $x<=$ the gradient is 0, the zero gradient is an
    advantage since it allows sparsity. In the case of sigmoid function, the chance
    of generating nonzero values is more which makes makes the connection representation
    in neural network dense while training. Sparsity always has an advantage over
    dense representations. A three-layer neural network is represented in Figure 14.2.'
