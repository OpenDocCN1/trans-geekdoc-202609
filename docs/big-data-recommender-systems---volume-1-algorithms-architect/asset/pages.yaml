  md: '332 Big data recommender systems, volume 1


    # 14.8 Conclusion and future work


    This work analyzed the effectiveness of the supervised and unsupervised learning
    techniques in intrusions and phishing URLs. The detection rates attained for KDD-Cup-99
    intrusion data by classical ML classifiers are closely comparable to others. Experiments
    were evaluated with a full data set and minimal features to understand the importance
    of each feature. DNN-based classification outperforms all classical ML techniques.
    This might be improved by promoting training or stacking a few more layer to the
    existing architectures or adding a new feature to the existing data. In most of
    the cases, the low-frequency attack categories produce a single connection record.
    however when concealed in other connection records, the DNN has enhanced the performance
    in detection rates in comparison to the KDD-Cup-99 challenge-winning entries and
    other published results. Due to the high computational cost in the deep learning
    architectures, we could not go for other architectures. The future work can incorporate
    the classification using other deep learning architectures like CNN, LSTM, GRU,
    IRNN and also hybrid networks like CNN-LSTM. When the model is framed as unsupervised
    learning problem, the detection rates were high. The M-ZOOM framework conveys
    the potential of unsupervised learning. In the case of phishing URL detection,
    CNN-LSTM gave the best performance. In this work, we propose an AI-based situational
    awareness platform to detect intrusions and phishing URL for an organization point
    of view. The voting schemes in the proposed architecture are a direction toward
    future work.


