    # 12.5 Conclusion and future directions


    The growing use of recommender systems in online social networks presents a privacy
    risk for the many users of these networks. The risks can be considered from two
    perspectives: measuring a user''s risk of unintended information disclosure and
    techniques to preserve users'' privacy when sharing large datasets. The general
    objective of the first perspective is to understand both dichotomous and polytymous
    approaches and the differences between them for measuring privacy. From the privacy-preservation
    perspective, the challenges in protecting the privacy of online social networks
    users and recommender systems are to propose real-time methods which can support
    a high volume of data with data types. Then, we discussed the privacy-preservation
    models (anonymization techniques and encryption-based methods) for the users in
    these two systems which provide all information sanitization and data obfuscation
    to ensure anonymity of individuals.


    As users'' participation in different types of online social media and recommender
    systems is increasing rapidly, there is a need to propose new privacy models in
    the near future that can deal with different data types, and for privacy preservation
    systems to take into account dependencies between data. Another consideration
    is resource consumption. As providing privacy requires substantial computation,
    factors that impact on computation time should be studied to identify whether
    mechanisms are required that are less computationally intensive. Modeling attacks
    is another significant issue that should be taken into account. While different
    types of attacks occur on anonymized datasets, modeling attacks on datasets with
    complicated features should be a priority so that vulnerabilities can be uncovered
    before they are exploited. Finally, there is a need to propose novel methods to
    help organizations preserve the privacy of users while these organizations are
    storing, analyzing and mining individuals'' data within their organizations.


