  md: '# 112 Big data recommender systems, volume 1


    Social network layer


    ![](img/6d0ce7dba01af52e1c2fae47d5b04a05_128_0.png)


    Figure 6.1 The collective impact of social network, product quality, temporal
    trend and personal choice over the item selection process of users


    Probabilistic generative models (PGMs) such as probabilistic matrix factorization
    (MF) [1], probabilistic latent semantic analysis (PLSA) [2] and latent Dirichlet
    allocation (LDA) [3] are powerful techniques that are capable of learning implicit
    relationships in data in a condensed feature space. While MF is predominantly
    used for collaborative filtering (CF)-based recommendation, PLSA and LDA can be
    formulated as both topic and recommendation models. Additionally, the generative
    principle adopted by these models allows them to seamlessly integrate with each
    other. For instance, the collaborative topic regression (CTR) model [4] combines
    LDA with MF to efficiently handle the cold-start problem and improve recommendation
    performance. Nevertheless, the latent representations learned by CTR are often
    not effective enough, especially when the auxiliary information is sparse. DL
    on the other hand has as the state-of-the-art technique for natural language processing,
    image analysis and speech recognition due to its ability to learn effective representations
    and capture nonlinear relationships in data [5]. Recently, it has also demonstrated
    impressive performance over applications such as YouTube video recommendation
    [6], Yahoo news recommendation and [7] and app recommendation in Google Play store
    [8]. However, it is not without its flaws; DL techniques are generally inferior
    to models such as CF in capturing and learning the similarity and implicit relationship
    between the items. This calls for the integration of PGMs and DL models to create
    a unified framework that leverages the best of both worlds.


    This chapter is organized into three main sections. The first section introduces
    the readers to some classic algorithms as PMF and LDA and illustrates the generative
    principle of a hybrid recommendation model called CTR that jointly models the'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Deep generative models for recommender systems 113


    latent interests of users and items. The second section presents recommendation
    models that are exclusively bounded by DL techniques. This includes models such
    as Restricted Boltzmann-machine-based CF (RBM-CF) [9], autoencoder (AE)-based
    recommendation (AutoRec) [10], neural CF (NCF) [11] and recurrent recommender
    network (RRN) [12]. The third section explains models such as collaborative denoising
    AE (DAE (CDAE) [13] and collaborative variational AE (VAE) (CVAE) [14] that integrates
    PGMs with DL to create a generative DL framework.


    # 6.2 Generative models


    PGMs are powerful techniques that are capable of capturing implicit relationship
    between the attributes of a dataset. This section begins by introducing the PMF,
    which will be followed by the discussion of two topic models, (1) PLSA and (2)
    LDA. Specifically, we will show how to reframe the generative principle of topic
    models for recommender systems and how to integrate PMF with topic models to create
    hybrid recommendation systems. The topics discussed in this section will serve
    as fundamentals to understand advanced recommendation models such as deep generative
    models that will be discussed in the later part of this chapter.


    # 6.2.1 Probabilistic matrix factorization


    MF [15] and its probabilistic counterpart PMF [1] are classic model-based techniques
    for CF-based recommendation. Unlike MF, the PMF follows a generative approach
    which allows the model to seamlessly integrate with topic models such as LDA and
    generative DL models as VAEs. From simple addition of attributes to a more complex
    change in the generative process, researchers have experimented with several variations
    of PMF. For example [16], incorporate travel distance, utility index and popularity
    of locations into PMF for point-of-of-interest (POI) recommendation and [17] introduce
    a new distribution into PMF to create social Poisson factorization. The graphical
    structure of PMF is shown in Figure 6.2, where $v$ represents the latent vector
    of an item, $u$ represents the latent vector of a user. The place notations $I$
    and $J$ denote the total number of users and items, respectively. PMF assumes
    that the users and the items have their respective latent attributes $u$ and $v$
    and the observed rating $r_{ij}$ is generated from these latent attributes. This
    generative process is shown in Algorithm 1 where the ratings $r_{ij}$ could be
    categorical or binary valued and $K$ is the number of latent attributes. It should
    be noted that when $r_{ij} = 0$, there


    ![](img/6d0ce7dba01af52e1c2fae47d5b04a05_129_0.png)


    Figure 6.2 Graphical structure of the probabilistic matrix factorization'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 114 Big data recommender systems, volume 1


    are two ways to interpret this scenario: (1) a user is not interested in item
    $j$ or (2) a user is unaware of this item. To resolve this ambiguity, a confidence
    parameter $c_{ij}$ is introduced where $c_{ij}$ is large when $r_{ij}$ is trusted
    more and low otherwise.


    ```

    **Algorithm 1**: Generative process of the PMF

    **for** each user $i \in I$ **do**

    | draw a latent factor $u_i \sim \mathcal{N}(0, \lambda_u^{-1}I_K)$

    **end**

    **for** each item $j \in J$ **do**

    | draw latent factor: $v_j \sim \mathcal{N}(0, \lambda_v^{-1}I_K)$

    **end**

    **for** each user-item pair $(i,j)$ **do**

    | draw a rating $r_{ij} \sim \mathcal{N}(u_i^T v_j, c_{ij}^{-1})$

    **end**

    ```


    **Parameter inference**: The objective of the PMF model is to estimate the following
    posterior distribution:


    $P(U, V|R) \propto P(R|U, V) \cdot P(U) \cdot P(V)$ (6.1)


    parameters $U$ and $V$ are learned using the maximum a posteriori (MAP) estimate.
    Expanding the appropriate likelihood using the graphical structure and taking
    the negative log of the resultant expression produces the following equation:


    $-ln P(U, V|R) \propto \frac{C_{ij}}{\lambda_{ij}^2} \sum_{(i,j)\in R} (r_{ij}
    - u_i^T v_j)^2 + \frac{1}{\lambda_u^2} \sum_{i} u_i^2 + \frac{1}{\lambda_v^2}
    \sum_{j} v_j^2$ (6.2)


    One can observe that the below equation is the squared error between the observed
    and the predicted rating along with some regularization terms $\lambda_v$ and
    $\lambda_u$. Parameters $U$ and $V$ can be obtained by performing gradient descent.


