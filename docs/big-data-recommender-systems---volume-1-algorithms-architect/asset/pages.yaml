    Recently, a new type of RS is introduced, referred to as social RSs (SRS) [5,6],
    which is based on the bilateral relation between RS and SNs. The former leverages
    the structural nature (properties and features of the entities) as well as the
    interactions between network nodes) and mechanisms of SNs, quantified by appropriate
    metrics (briefly presented in the next subsection), in order to produce more accurate
    and efficient results. Conversely, SRSs contribute to the formation and evolution
    of SNs through recommendations of individuals or groups.


    Contrary to traditional RSs, SRS can also take into consideration different relations
    among users, e.g., in the form of trust [6,7] (defined as the subjective expectation
    of one’s future behavior [10]), or influence (which is described as the importance
    of each user in propagating information), using either structural analysis (location-based
    SNA) or behavioral analysis (interaction-based SNA) [11]. The correlation between
    ratings and social score is obtained by quantifying the above features. This results
    in the definition of new, social-based similarity measures, which alleviate the
    problems of sparsity and cold-start [12]. Trust relationships increase RS coverage
    when the application of traditional similarity measures is impossible (e.g., Pearson
    correlation coefficient (PCC) can also be applied to users with overlap in items’
    ratings [13]), while users with no previous ratings may receive accurate recommendations
    by connecting to a “trusted” or “influential” user of the network. Context is
    also another form of user-item developing relations, which will be analyzed in
    more detail in Section 4.3.4.


