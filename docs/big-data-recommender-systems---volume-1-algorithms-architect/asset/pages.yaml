    # **Algorithm 1**: Actions taken by Alice and Bob to encode their data


    Input:

    - r: Plaintext dataset


    Output:

    - d: De-identified dataset


    ```

    1 d $\leftarrow \emptyset$;\2 foreach phonetic_algorithm $P_i$ do

    3 $d_1 \leftarrow Map(P(i));

    4 $d_0 \leftarrow Union(d_0, d_1);

    5 end

    6 d $\leftarrow Parallelize(RandomPhonetic());

    7 d $\leftarrow Union(do, dj);

    8 $d_4 \leftarrow Map(SHA1(dj));

    9 d $\leftarrow d_4.orderBy(rand());

    10 Collect (d)

    ```


    # 13.4.2 Protocol operation


    At the beginning of the linkage process, it is sufficient for Alice and Bob to
    agree on a set of common fields in both their data that are to be used as matching
    fields. Alice and Bob''s data do not conform to the exact same schema and usually
    exhibit heterogeneity. No prior knowledge is required by either party, and appropriate
    privacy preserving schema matching algorithms [30,31] may be deployed to determine
    these matching attributes without compromising the privacy of every party.


    Next, each party separates its own data for matching following Algorithm 1. First,
    using a *Map* operation, each of the matching fields is converted to its phonetic
    equivalent using each of the phonetic algorithms employed (lines 1–5). Afterwards,
    random phonetic codes using a *parallelize* operation are generated (line 6).
    Then, two volumes of data are merged using a *Union* operation (line 7). Next,
    all codes are encrypted through a secure hash function, e.g., SHA1 using a *Map*
    operation (line 8). Finally, the entire dataset is randomly sorted to ensure that
    Carol cannot infer which phonetic codes refer to actual real-world entities (line
    9).


    At this point, we will discuss details over the generation process. As previous
    work shows [32], the time for on-the-fly generation in a parallel environment
    overwhelms the parallel engines for big data, Spark included, consider that instead
    of moving data, which is expensive to use, computations should be moved instead.
    The fake generation procedure in our algorithm opposes this principle, as data
    is generated in parallel at each node and then they are merged with the corpus
    of the real data. However, this is the cost to be paid for increased security.
    A computationally cheaper alternative would be to precompute facts and distribute
    them before computation'
