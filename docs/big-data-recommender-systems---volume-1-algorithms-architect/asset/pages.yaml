    # 12.3.5 Privacy-preserving methods


    Anonymizing data relies on eliminating or altering the identifying variable(s)
    contained in the data, also known as personally identifiable information.³ Anonymizing
    data keeps the referenced person''s privacy as a priority while giving attention
    to a data analyzer''s needs (e.g., an analyst examining the data for identification
    of trends, patterns) [52]. Moreover, anonymization is one of the methods of providing
    sanitized data.⁴ In this process, whatever is detached and other attributes are
    perturbed. Still, there are no assurances for stopping an attack from an intruder
    and attacker who have background knowledge of the data. Therefore, there is a
    need for providing other procedures and methods for data retrieval to preserve
    the privacy of the published user profiles in online social networks [32]. From
    the personalization perspective, diverse users have dissimilar privacy preferences.
    As a case in point, some records are more important for some individuals, while
    others users may pay attention to other attributes. The current methods of personalized
    protection are “personalized access control” (e.g., attribute-based encryption
    [55]) or sensitivity personalization of a single dimension [56], while no has
    explored sensitivity personalization in multidimensional data [57].


    A variety of anonymization algorithms with dissimilar anonymization processes
    have been proposed by different authors [51,56,58–63]. Models like k-anonymity,
    $l$-diversity and t-closeness are the most accepted and accepted methods that
    deliver appropriate outcomes in anonymization. k-Anonymity [63] and $l$-diversity
    [61] are the main models proposed on privacy to quantify the degree of privacy,
    for sensitive information revelation against record linkage and attribute linkage
    attacks, respectively. Supplementary secrecy models as t-closeness [64] and $m$-invariance
    [65] are also presented for numerous attack in privacy scenarios. Numerous anonymizing
    processes are applied to maximize the advantage of anonymize datasets, as well
    as suppression [66], generalization [51,60], anatomization [67], slicing [68]
    and disassociation [69].


