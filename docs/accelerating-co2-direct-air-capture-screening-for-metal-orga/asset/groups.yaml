    # DISCUSSION


    The screening results obtained using MACE-DAC-1 with DAC-SIM allowed for a systematic
    analysis of chemical features within promising MOFs. All 161 promising candidates
    in the CoRE MOF database were further investigated. We excluded 43 chemically
    incorrect MOFs (e.g., missing hydrogen atoms or overlapping atoms due to symmetry
    issues, see Figure S16).


    Before proceeding with the analysis of the remaining MOFs, we evaluated the necessity
    of fine-tuning by comparing MACE-DAC-1 with MACE-MP. As shown in Figures S3, S4,
    and S17, MACE-MP tended to overestimate interaction energies, leading to an overestimation
    of H2O Qst compared with MACE-DAC-1. In this context, similar to the observation
    that not all promising MOFs demonstrate desirable performance in UFF + DDEC calculations,
    46 of 118 MOFs (approximately 40%) fail to be identified as promising when using
    MACE-MP instead of MACE-DAC-1.


    As shown in Figure 5A, seven chemical features, including OMS, parallel benzene
    ring (PAR), metal-electronegative atom-metal (M-X-M), uncoordinated nitrogen,
    azole linker, methyl functional group (-CH3), and electronegative functional group
    (-EN), were identified in the promising MOFs. Four of them (OMS, PAR, M-X-M, and
    uncoordinated nitrogen) were suggested in previous screening works, 15,39 and
    others (azole linker, -CH3, and -EN) were intermittently described in experimental
    works. 56–59 Among these, OMS and the azole linker appeared in nearly one-half,
    or more, of the MOF candidates. The OMS, a well-known chemical moiety, facilitates
    strong interactions between positively charged metal atoms and negatively charged
    oxygen atoms in gas molecules. However, the stronger interaction between the more
    negatively charged O atom in H2O compared with that in CO2, leads to H2O typically
    interacting


    more strongly with OMS than CO2. This suggests that OMS use should be approached
    with caution.


    Additionally, the azole linker, commonly used in MOF synthesis due to its robust
    bonding with transition metals, 60 contains nitrogen and other non-carbon atoms
    (e.g., nitrogen, sulfur, or oxygen) that actively interact with CO2 molecules.
    Given the frequent application of nitrogen-rich MOFs and porous materials in DAC
    application, azole linkers may serve a similar function within MOFs for facilitating
    CO2 capture in humid conditions.


    Apart from the two frequently observed features, the performance of promising
    MOFs containing one of the remaining five chemical features is shown in Figure
    5B to examine the role of those features in DAC application. Among them, PAR,
    identified through a screening study using classical force fields as one of the
    effective features for CO2 capture in humid conditions, 15 appeared frequently
    in the results from the DAC-SIM. The strong dispersion forces created between
    PARs form selective pockets conducive to capturing CO2. Due to its larger molecular
    size and unique pi bonds between C and O atoms, CO2 is more responsive to the
    chemical environment dominated by dispersion forces, unlike H2O. Furthermore,
    PAR is less affected by the stronger electrostatic interactions induced by H2O
    in comparison with CO2. As a result, 9 of 11 promising MOFs containing PAR show
    high selectivity, with KH ratio for CO2 to H2O exceeding 100.


    The M-X-M, a generalized form of metal-oxygen-metal (M-O-M) bridges, was proposed
    as a feature for strong CO2 adsorption from screening study with the classical
    force field approach. 15 However, this feature was not considered essential for
    constructing MOFs specifically for selective CO2 capture, as many MOFs with M-O-M
    bridges interact strongly with both H2O and CO2. However, given that the overestimation
    of H2O interaction which was observed in calculations using UFF and point charges,
    was corrected in this study, M-X-M still appeared in more than 20% of the promising
    MOFs often associated with high CO2 selectivity over H2O.


    Uncoordinated nitrogen, as defined in this study, refers to nitrogen atoms that
    are not part of metal coordination complexes or azole linkers, such as those in
    amine groups or azines. They have been experimentally recognized as promising
    functional groups for DAC applications. 61–64 The lone pair on the nitrogen atom
    create localized pockets within the framework that act as a nucleophilic site,
    facilitating strong interactions with electrophilic CO2 molecules. Consequently,
    87.5% of MOFs containing uncoordinated nitrogen exhibit CO2 Qst values exceeding
    58.9 kJ/mol (the top 25% CO2 Qst value of the candidates) and selectivity greater
    than 100. Notably, selective CO2 capture associated with amine groups occurs generally
    via chemical reaction, highlighting the need for further research to fully understand
    this selective behavior.


    For the -CH3 group, known for its hydrophobic properties, it is commonly used
    in MOFs to impart hydrophobic characteristics. 57,59 As the smallest hydrocarbon
    unit, -CH3 becomes increasingly hydrophobic with greater carbon chain length.
    Previous study has demonstrated that organic ligands with extended hydrocarbon
    chains are particularly suitable for DAC application when integrated into MOFs.
