    > **进展与潜力** 从环境空气中直接捕集 CO₂，即直接空气捕集 (DAC)，对于实现净零排放至关重要。金属有机框架 (MOFs) 是 DAC 的有前途多孔固体，但现有计算方法要么耗时很长，要么缺乏在
    MOFs 内建模 CO₂ 和 H₂O 吸附所需的精度。因此，基于计算机模拟的高通量筛选难以确定最适合 DAC 的材料。为克服这一挑战，我们开发了一个基于机器学习力场
    (MLFF) 的人工智能加速吸附模拟框架，该力场能够快速且准确地捕捉 MOF-CO₂ 和 MOF-H₂O 相互作用。它实现了对 8,000 多个 MOFs
    的筛选，发现了常规模拟遗漏的 100 多个高潜力候选材料。该计算平台可轻松被研究人员和工业界采用，以加速 DAC 及其他气体分离需求的多孔材料发现。我们的方法可以实现更高效、更具成本效益的碳捕集技术，并支持全球减排目标。


    ## 摘要


    直接空气捕集 (DAC) CO₂ 对气候变化缓解是必要的，但面临低 CO₂ 浓度和水蒸气竞争带来的挑战。金属有机框架 (MOFs) 因其高表面积和基于吸附的捕集过程而对
    DAC 具有重大前景。然而，识别最优 MOFs 受到结构复杂性和巨大化学多样性的阻碍。在此，我们通过微调基础模型，引入了一种专门用于 MOFs 中 CO₂
    和 H₂O 相互作用的机器学习力场 (MLFF)。为解决平滑问题和灾难性遗忘，我们策划了 GoldDAC 数据集，并引入了持续学习方案。我们进一步开发了 DAC-SIM，这是一个与
    MLFF 集成的分子模拟软件包，包括 Widom 插入法。随后，我们对一个广泛的 MOF 数据库进行了筛选，发现了高性能 MOFs 并确定了 DAC 应用的化学特征。该方法克服了在描述
    MOF-CO₂ 和 MOF-H₂O 相互作用方面的先前局限性，为多孔材料的 DAC 研究提供了一个可扩展且准确的框架。


