    # Conclusions


    In this work, we presented a scalable computational approach for investigating
    gas adsorption properties of materials. We developed a transferable machine learning
    forcefield, MACE-DAC, for CO2 interactions with MOFs and integrated it with a
    simulation workflow to calculate Qst and KH with high accuracy and efficiency.
    This workflow is provided as a Python package, DAC-SIM, for ease of use for various
    user purposes. We screened the CO2 and H2O adsorption properties of more than
    8,000 experimentally synthesized frameworks and identified 161 promising candidates
    that were overlooked by conventional molecular simulation methods based on classical
    force fields. Additionally, we categorized features that can be introduced to
    design porous frameworks for DAC applications. Our workflow addresses prior limitations
    associated with classical force fields and the computational demands of direct
    ab initio methods, thus providing a solid foundation for accurate and fast virtual
    material screening.


    # METHODS


    # GoldDAC database construction


    To encompass the full range of the PES of interaction energy between the framework
    and gas molecules (CO2 and H2O), interaction energies were measured by adjusting
    the positions of the molecules within the structure. Starting from the equilibrium'
  - '[PAGE 11]


    state with the presumably most stable configuration, two repulsive configurations
    were collected by moving the gas molecule closer to the structure, while three
    weak attraction configurations were collected by moving the guest molecule toward
    the pore center (details on configuration construction are provided in Note S1
    and Figure S19). Interaction energies were calculated while not considering geometry
    optimization. DFT calculations were used to compute energies for each system,
    and the gas molecule was isolated in a 10 Å cubic box to calculate its energy.
    Thus, single self-consistent field calculation was conducted for each system.


    The equilibrium state, regarded as the starting point for configuration construction,
    was collected from two different data sources: the ODAC23 database and manually
    calculated adsorption results from 26 MOFs that were identified as promising for
    CO2 capture or DAC applications.39,82 The MLFF model was trained based on optimized
    configurations collected from the ODAC23 database (training and validation set).
    First, the lowest CO2 and H2O interaction energies (interaction energies in this
    case were calculated after geometry optimization of MOF + gas system) were gathered
    for MOFs using the IS2RE database from the ODAC23 database. MOFs that met the
    following two conditions were considered: (1) the lowest CO2 and H2O binding energy
    is smaller than -0.1 eV, and (2) the number of atoms is less than 250. Last, given
    that the top 20 most frequently appearing metal atoms in the ODAC23 database were
    provided in the original paper (see Figure S1), 3 MOFs were randomly selected
    from those containing each metal type. Therefore, 60 MOFs were considered, and
    120 equilibrium configurations were collected from the ODAC23 database, considering
    both CO2 and H2O molecules. For evaluation of the trained MLFF model, an additional
    database was constructed from the equilibrium states obtained from the manually
    selected 26 MOFs. A single guest molecule was introduced into the framework, where
    it was allowed to relax while the framework remained fixed. Three to five different
    initial points were sampled, considering active adsorption sites for the guest
    molecules, and the configuration with the lowest energy was selected as the equilibrium
    state. In total, 52 equilibrium configurations were collected for both CO2 and
    H2O molecules. Further details and illustrations of these 26 MOFs are provided
    in Figure S20–S24.


    # ## Training details


    The foundation model, MACE-MP,35 was used for fine-tuning with the GoldDAC dataset,
    where the detailed data distribution of training, validation, and test sets can
    be found in Table S1. Fine-tuning was carried out over 100 epochs with a batch
    size of 4. The Adam optimizer was adopted for parameter updates,83 featuring a
    learning rate of 1e–4 and zero weight decay. The loss function ($L_{E+F}$) for
    fine-tuning was balanced equally between total energy and force predictions, with
    a ratio set at 1:1.


    For the continual learning, an additional regularization loss ($L_{continual}$)
    was introduced, computed as the root-mean-square error between energy and force
    predictions of the frozen pre-trained model and the corresponding fine-tuned model.
    Consequently, the total loss function for continual learning can be defined as:


    $L = L_{E+F} + \lambda L_{continual}$,


    where $\lambda$ represents the weighting coefficient for the continual loss, which
    was empirically set to 1.0 to achieve a balance between retaining pre-trained
    knowledge and adapting to new task-specific features.


    # ## Molecular simulation with MLFFs


    The DAC-SIM package is a python package integrated with the developed MLFF through
    the ASE calculator interface,84 for molecular simulations including Widom insertion,
    molecular dynamics, and geometry optimization. The Widom insertion simulations
    were conducted on the CoRE MOF 2019 dataset37 to determine the KH and Qst. Before
    performing the simulation, geometry optimization was implemented for each MOF
    structure. The optimization process includes a total of 30 steps, each consisting
    of 50 iterations of cell relaxation followed by 50 iterations of internal relaxation
    with the cell held fixed. The convergence criterion for the maximum force was
    set at 0.05 eV/Å to balance computational efficiency.


    For the following Widom insertion simulation, a grid with a spacing of 0.15 Å
    was generated to define potential insertion points across the unit cells. Grid
    points located within 1.5 Å of the central positions of gas molecules, such as
    the C atom in CO2 and the O atom in H2O, were excluded to avoid inserting molecules
    into blocked regions. In each iteration, a gas molecule was randomly rotated and
    placed at grid points, and their interaction energies between frameworks and gas
    molecules were calculated using MLFFs. To enhance statistical reliability, two
    independent Widom insertion simulations were performed, with each consisting of
    10,000 insertions. As shown in the convergence test conducted in three independent
    iterations for Qst and KH values in Figures S31 and 32, we set 10,000 insertions
    as the standard for our simulations, as it provides a good balance between computational
    efficiency and convergence reliability. The results from these simulations were
    averaged to calculate the final KH and Qst. The temperature was set as 300 K.


    # ## Details of molecular simulations


    DFT calculations were conducted using Vienna Ab initio Simulation Package (VASP).85–87
    The exchange-correlation terms were calculated using generalized gradient approximation
    with the Perdew-Burke-Ernzerhof functional.88 The recommended pseudopotentials
