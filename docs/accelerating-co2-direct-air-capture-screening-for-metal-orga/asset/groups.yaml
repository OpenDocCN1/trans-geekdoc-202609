    ## 利用可迁移机器学习力场加速金属有机框架的 CO₂ 直接空气捕集筛选


    Yunsung Lim, 1,3 Hyunsoo Park, 2,3 Aron Walsh, 2,* and Jihan Kim 1,4,*

    1Department of Chemical and Biomolecular Engineering, Korea Advanced Institute
    of Science and Technology (KAIST), Daejeon 34141, Republic of Korea

