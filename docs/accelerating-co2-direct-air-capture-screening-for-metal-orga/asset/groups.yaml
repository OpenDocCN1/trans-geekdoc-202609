    implement in this work. The cutoff was set as 12.8 Å and the Ewald summation method
    was adopted to consider the electrostatic potential. The pore blocking algorithm
    was not considered. The 10,000 MC cycles were iterated for both CO2 and H2O molecules
    and temperature was set as 300 K to keep consistency with DAC-SIM calculations.


    The interaction energies using a classical force field of MOFs in the test set
    were computed using Large-scale Atomic/Molecular Massively Parallel Simulator
    software.92 Consistent with the approach taken in adsorption property calculations,
    a cutoff distance of 12.8 Å was used, and the Ewald summation method was used
    to account for long-range coulombic interactions with an accuracy threshold of
    1 x 10^-5.


