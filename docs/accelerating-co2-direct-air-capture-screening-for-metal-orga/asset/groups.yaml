    该过程面临挑战，因为 CO₂ 浓度为痕量（约 400 ppm），且对 CO₂ 相对于大气水蒸气的选择性捕集较低。

    迄今，DAC 技术主要依赖使用胺和固体碱金属氢氧化物对 CO₂ 进行化学吸附，因为它们对 CO₂ 具有很强的亲和力。5,6 然而，吸附剂的再生是总运营成本的主要来源。7,8
