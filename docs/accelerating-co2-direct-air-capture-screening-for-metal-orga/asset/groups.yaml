    CO$_2$吸附与选择性分布凸显了传统筛选方法的几个局限性，我们还确定了几种新的候选材料和设计原则。


    ## 结果


    ## 直接空气捕获（DAC）应用的蒙特卡洛模拟


    直接空气捕获（DAC）面临的一个关键挑战在于识别具有强CO$_2$亲和力和对H$_2$O高选择性的材料。为应对这一挑战，在刚性框架假设下，采用Widom插入法和大正则蒙特卡洛（GCMC）等蒙特卡洛（MC）模拟，通过计算吸附焓（Q$_{st}$）和亨利定律系数（K$_H$）来确定材料的气体吸附性能。$^{38}$
    这些集成平均性能相比仅依赖单构型性质（例如最可能稳定结合位点的吸附能），能够实现更全面的评估。


    Widom插入法（如图1C所示）非常适用于低CO$_2$浓度条件下的直接空气捕获（DAC），$^{16,39,40}$ 此时稀释系统建模是适用的。该模拟涉及大量单独计算以构建集成，其中单个气体分子被随机插入MOF框架以计算集成平均相互作用能。相互作用能$E_{int}$由以下公式确定：


    ```

    $E_{int} = E(\text{system}) - E(\text{MOF}) - E(\text{gas}),$

    ```


    其中$E(\text{system})$代表吸附了气体的MOF的势能，$E(\text{MOF})$和$E(\text{gas})$分别对应MOF框架和气体分子（例如CO$_2$或H$_2$O）的势能。这种方法允许从统计力学中计算Q$_{st}$和K$_H$：


    ```

    \(\Delta H_{ads} = -Q_{st} = \frac{\langle E_{int} \exp(-\beta E_{int}) \rangle}{\langle
    \exp(-\beta E_{int}) \rangle} - k_b T\)

    ```


    ```

    $K_H = \beta \langle \exp(-\beta E_{int}) \rangle,$

    ```


    其中$\Delta H_{ads}$为吸附焓，$\beta$代表热能的倒数，定义为$\beta = \frac{1}{k_b T}$，其中$k_b$为玻尔兹曼常数，$T$为温度。若不考虑$Q_{st}$中的热项$k_b
    T$贡献，该值代表集成平均相互作用能，记作$\Delta h_i$。


    ## 基础模型微调


    已开发出多种先进的MLFF（机器学习势场，例如MACE，$^{41}$ CHGNet，$^{42}$ M3GNet，$^{43}$ 和SevenNet$^{44}$），能够准确复现多种晶体材料的DFT结果。这些模型在包含DFT总能（$E$）和原子力（$F$）的数据集上进行了大量预训练，主要采样自几何优化轨迹（如MPTraj）。$^{42}$
    其中，MACE-MP-0模型（下文为简洁起见统称为MACE-MP）$^{35}$ 凭借其将用于结构表示的原子团簇展开与用于回归的等变高阶消息传递图神经网络相结合而脱颖而出。这些模型的预训练数据集主要由无机组成物主导，有机和有机-无机固体较少；然而，MACE-MP模型在MOF（金属有机框架）系统上已显示出合理的初步结果。$^{35}$
    因此，在此基础上，我们微调了一个可迁移的MLFF，命名为MACE-DAC，专门针对MOF及其与相关气体的相互作用。


    ## GoldDAC数据集


    微调模型时的主要挑战之一是有限微调数据集导致严重过拟合的风险。在对用于MLFF的预训练基础模型进行微调时，Deng等人$^{45}$指出了一个被称为平滑（或软化）的关键问题，即模型准确预测势能面（PES）非平衡区域的能力下降，如图2A所示。这源于MLFF开发所用的训练数据主要集中于0
    K平衡构型（下文统称为平衡构型）附近，这些构型对应于PES上的局部极小值。与预训练阶段相比，平滑在微调过程中更为明显，因为该过程通常涉及使用有限数据集更新预训练模型。


    通过Widom插入法计算气体吸附性能时，准确预测整个PES尤为关键。Q$_{st}$和K$_H$值等性质对PES中的微小误差非常敏感，尤其是在相互作用能小于零的区域。这些误差源于能量项的指数加权，可能导致预测吸附性能出现显著偏差。例如，尽管PES的平衡区域通常建模良好，但排斥区域的不准确会改变PES的斜率，从而导出的热力学性质会出现显著误差。


    为克服这一挑战，我们创建了GoldDAC数据集，包含CO$_2$ + MOF、H$_2$O + MOF、MOF及气体分子计算的DFT结果。该数据集可用于微调，以提升模型在整个PES上的性能，涵盖不仅包括平衡区域，还包括排斥区和弱吸引区。训练集和验证集由60个结构构建，ODAC23数据集中出现频率最高的20种金属各随机采样三个结构。$^{39}$
    ODAC23数据库是一个综合性数据库，包含DFT水平下MOF系统用于直接空气捕获（DAC）应用的吸附计算。


    由于相互作用能不仅取决于组合体系（带有气体分子的MOF）的能量，还取决于框架和气体分子（例如CO$_2$和H$_2$O）的各自能量，因此两种构型均纳入了训练集和验证集。为实现稳健训练，这些结构中两个结构的PES数据被随机分配到训练集，而其余结构的数据用于验证。由于该数据集是为直接空气捕获（DAC）应用开发的，测试集包括文献中被确定为CO$_2$捕获有前景的26个MOF。总体而言，如表S1所示，共进行了784次DFT计算（MOF
    +气体720次，MOF 60次，气体4次）以构建训练集和验证集，并额外进行了312次DFT计算以构建测试集。GoldDAC数据集的数据构建细节在方法部分中提供。


