  mdcn: '


    直到力小于 0.03 eV/Å。在构建 GoldDAC 数据集期间，进行了不包含色散校正的额外计算。若标记为“+D3”，则采用 D3 (Becke-Johnson)
    方案进行了包含色散校正的单独计算。自旋极化计算仅针对具有开放壳层金属原子的骨架进行考虑，并对 Cu、Mn、Ni、Fe、Co、V、Nb 和 Ti 的 d 轨道应用了
    U 校正。由于微调数据库的这些 DFT 设置与用于 MACE-MP 模型预训练数据库的设置并不完全匹配，这种差异可能导致 MACE-MP 模型在评估期间出现的初始误差（更多详情请参见附录
    S3）。然而，由于相互作用能量来源于三个不同的系统（MOF + 气体、MOF 和气体），它们对 DFT 设置的微小变化相对不敏感。


    使用 RASPA2 软件计算了基于经典力场的 Q_st 和 K_H。53 两种属性均通过 Widom 插入 MC 方法计算，该方法我们在本工作中尝试实现。截断距离设置为
    12.8 Å，并采用 Ewald 求和法来考虑静电势。未考虑孔隙阻塞算法。对 CO2 和 H2O 分子均迭代了 10,000 个 MC 循环，温度设置为 300
    K 以与 DAC-SIM 计算保持一致。


    使用 Large-scale Atomic/Molecular Massively Parallel Simulator 软件计算了测试集中 MOF 的相互作用能量（基于经典力场）。92
    与吸附属性计算所采用的方法一致，使用了 12.8 Å 的截断距离，并采用 Ewald 求和法来处理长程库仑相互作用，精度阈值为 1 × 10⁻⁵。


    对于经典力场计算，骨架原子使用 UFF 建模，18 点电荷基于 DDEC21 方案分配。如果结构的 .cif 文件包含预定义电荷，则保留这些值而不做进一步修改。对于客体分子，即
    CO2 和 H2O，分别使用了 TraPPE93 和 SPC/E94 力场。


    使用 Zeo++ 软件计算了 LCD、表面积 (SA) 和体积分数 (VF) 等几何属性。95 计算 SA 和 VF 时选择的探测半径为 1.4 Å，即氦的范德华半径。我们分别进行了
    2k 和 50k 次 MC 采样来计算 SA 和 VF。


