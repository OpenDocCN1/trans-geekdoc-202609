    UFF,18 with point charges assigned based on the DDEC21 scheme. If the .cif file
    for a structure contained pre-defined charges, these values were retained without
    further modification. For guest molecules, specifically CO2 and H2O, the TraPPE93
    and SPC/E94 force fields were used, respectively.


