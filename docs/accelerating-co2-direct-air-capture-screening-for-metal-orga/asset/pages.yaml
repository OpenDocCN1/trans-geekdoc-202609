    The equilibrium state, regarded as the starting point for configuration construction,
    was collected from two different data sources: the ODAC23 database and manually
    calculated adsorption results from 26 MOFs that were identified as promising for
    CO2 capture or DAC applications.39,82 The MLFF model was trained based on optimized
    configurations collected from the ODAC23 database (training and validation set).
    First, the lowest CO2 and H2O interaction energies (interaction energies in this
    case were calculated after geometry optimization of MOF + gas system) were gathered
    for MOFs using the IS2RE database from the ODAC23 database. MOFs that met the
    following two conditions were considered: (1) the lowest CO2 and H2O binding energy
