    chemical attributes of these MOFs are anticipated to synergistically contribute
    to DAC.


    In the same vein, combining these features offers an effective strategy for designing
    MOFs. For example, SIFSIX-18-Ni,57 which demonstrated exceptional trace CO2 capture
    capabilities in humid conditions, incorporates three key features: azole linker,
    –CH3, and –EN. As shown in Figure S18, SIFSIX-18-Ni consists of a tetramethyl
    bipyrazole organic linker (a methyl functionalized azole-based linker) and a SiF62–
    pillar (an electronegative functional group). The methyl groups on the organic
    linker act as water-blocking groups and the F atoms on the SiF62– pillar are working
    as nucleophile sites to interact with the electrophilic C atom of the CO2 molecule.
    The hydrophobicity of the methyl groups creates a water-limiting pocket near the
    electronegative groups, making the pocket suitable for DAC application. By combining
    features, a range of MOFs can be designed to meet specific DAC needs, and various
    combinations can be possible from a set of seven distinct features.


    Since our work focused on the large-scale screening and evaluated performance
    using thermodynamic descriptors (Qst and KH) as a primary step, further analysis
    should be conducted on our candidates to confirm that their practical applicability
    for the real-world DAC applications. For example, given that DAC processes are
    typically conducted under humid conditions, it is essential to consider the adsorption
    performance in the presence of both CO2 and H2O for more realistic simulations,
    a consideration not addressed in this study. In practice, the adsorption of H2O
    can introduce new adsorption sites for CO2 capture. Meanwhile, at high relative
    humidity, H2O molecules can cluster due to strong H2O-H2O interactions, potentially
    blocking the pores within MOFs. Furthermore, this study assumes MOFs to be rigid,
    precluding the modeling of chemical reactions (e.g., CO2 conversion to carbamic
    acid) commonly used


    in porous materials for DAC application. Therefore, further study should focus
    on simulations that more accurately reflect practical DAC scenarios (e.g., GCMC
    simulation and simulations considering flexibility) by tackling those limitations.
    Beyond investigating the equilibrium phase at the atomistic scale, kinetic factors
    (e.g., thermal and mechanical stability, long-term stability, and adsorption kinetics)
    and process-level metrics (e.g., regeneration energy) should also be considered
    to identify practically viable candidates for DAC applications.


    # Conclusions


    In this work, we presented a scalable computational approach for investigating
    gas adsorption properties of materials. We developed a transferable machine learning
    forcefield, MACE-DAC, for CO2 interactions with MOFs and integrated it with a
    simulation workflow to calculate Qst and KH with high accuracy and efficiency.
    This workflow is provided as a Python package, DAC-SIM, for ease of use for various
    user purposes. We screened the CO2 and H2O adsorption properties of more than
    8,000 experimentally synthesized frameworks and identified 161 promising candidates
    that were overlooked by conventional molecular simulation methods based on classical
    force fields. Additionally, we categorized features that can be introduced to
    design porous frameworks for DAC applications. Our workflow addresses prior limitations
    associated with classical force fields and the computational demands of direct
    ab initio methods, thus providing a solid foundation for accurate and fast virtual
    material screening.


