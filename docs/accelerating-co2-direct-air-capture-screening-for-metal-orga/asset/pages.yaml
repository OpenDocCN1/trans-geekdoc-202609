    # Comparison with classical force field simulations


    The Widom insertion simulation results derived from our developed MLFF (MACE-DAC-1)
    using DAC-SIM were systematically compared with those obtained from a classical
    force field approach. In the classical method, the UFF combined with DDEC charges21
    (hereinafter referred to as UFF + DDEC) were used to simulate the CO2 and the
    H2O adsorption properties in the MOFs.16,17,51 UFF is interatomic potential consisting
    of empirical parameters and DDEC charges are derived from DFT calculations. UFF
    + DDEC were only used for framework atoms and customized force fields provided
    for CO2 and H2O molecules were used to model them. A total of 2,654 MOFs, having
    the calculated DDEC charges provided by Kancharalappali et al.52 were used for
    this analysis.


    Figures 4A, 4B, and S9 present the Qst distributions for CO2 and H2O, respectively,
    as computed using the DAC-SIM package with the developed MLFF and the RASPASoftware53
    with the UFF + DDEC method. The overall distribution of CO2 Qst


