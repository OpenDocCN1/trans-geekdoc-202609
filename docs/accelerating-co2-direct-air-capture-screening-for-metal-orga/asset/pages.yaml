    # In brief


    DAC of CO₂ using porous materials holds promise for achieving net-zero emissions
    but is hindered by slow, inaccurate simulations. We integrate machine learning
    models into simulation workflows to enable fast and accurate simulations, allowing
    rapid screening of thousands of materials. This framework is integrated into a
    user-friendly Python package, offering a scalable approach for data-driven materials
    discovery in carbon capture and related energy and environmental applications.


    # Highlights


    +   - MLFF improves modeling CO₂ and H₂O interaction in MOFs

    +   - Enhanced predictions with significantly lower computational cost can be
    achieved

    +   - Curated dataset and continual learning strategy improve the fine-tuning
    process

    +   - More than 100 MOFs missed by conventional methods were found suitable for
    DAC'
