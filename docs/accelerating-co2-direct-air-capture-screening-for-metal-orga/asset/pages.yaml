    # Continual learning


    Figure 2C presents the performance evaluation of the fine-tuning model using the
    GoldDAC dataset. This analysis encompasses both the foundational MACE-MP model
    and its variant, MACE-MP-0b that incorporates the analytic Ziegler-Biersack-Littmark
    repulsive potential to remove pathologies in the PES at short distances. The mean
    absolute error (MAE) for the average of all PES data, denoted as ''All'' in Figures
    2C and Table 1, exhibits a notable reduction compared with the original foundation
    models with respect to interaction energy and force predictions. This improvement
    is mainly attributed to enhance predictive accuracy in the repulsive region of
    the fine-tuning model, assisted by configurations sampled by GoldDAC dataset.


    To remedy this issue, we implemented a refined fine-tuning strategy with continual
    learning loss. This additional loss term is designed to preserve the pre-training
    model''s knowledge during the fine-tuning. Specifically, the continual learning
    loss is implemented by freezing the weights of the pre-training model and minimizing
    discrepancies in energy and force predictions between the pre-training and the
    fine-tuning model during the fine-tuning process, as illustrated in Figure 2B.
    This approach ensures that the fine-tuning process does not introduce significant
    deviations from the pre-training model, thereby ensuring the original energy balance
    between components in the interaction energy calculation.


    The fine-tuning model does decline in performance within the equilibrium and weak
    attraction regions compared with the pre-training MACE-MP models. This degradation
    can be attributed to the complexity in the interaction energy, which is not determined
    solely by the combined system''s total energy but by its energy relative to the
    isolated framework and gas molecule.


    By introducing this regularization loss, the fine-tuning process is guided to
    adapt more gradually to the new MOF data while retaining the knowledge learned
    from pre-training on inorganic materials. As shown in Figure 2C, this method prevents
    performance degradation in the equilibrium and weak-attraction regions, observed
    in the fine-tune model without the continual learning loss (termed as MACE-DAC-0),
    while maintaining the trend that significantly reduces loss in the repulsion region.
    Therefore, the continual learning model (termed as MACE-DAC-1) achieved the lowest
    MAE across all PES data. Furthermore, continual learning contributes to a stable
    reduction in force prediction loss, thereby enabling the model to achieve the
    highest performance in force predictions as well. In MACE-DAC-1, some configurations
    with 3D transition metals, open metal sites, and repulsion regions showed high
    force errors, indicating still minor challenges in capturing unusual chemical
    environments. However, our MLFF outperformed the MACE-MP'
