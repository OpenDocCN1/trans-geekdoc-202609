    # RESULTS


    # Monte Carlo simulation for DAC application


    A key challenge for DAC lies in identifying materials that exhibit strong CO$_2$
    affinity and high selectivity over H$_2$O. To address this, Monte Carlo (MC) simulations
    such as Widom insertion and grand canonical MC (GCMC) under rigid framework assumptions
    are used to determine gas adsorption properties of materials by calculating the
    heat of adsorption (Q$_{st}$) and Henry’s law coefficient (K$_H$).$^{38}$ These
    ensemble-averaged properties enable a more comprehensive evaluation than relying
    solely on single configuration properties, such as adsorption energies at the
    most likely stable binding sites.


    The Widom insertion method, as outlined in Figure 1C, is well suited for DAC under
    the condition of low CO$_2$ concentration,$^{16,39,40}$ where modeling a dilute
    system is applicable. The simulation involves numerous individual calculations
    to build the ensemble, where single gas molecules are randomly inserted into MOF
    frameworks to compute the ensemble-averaged interaction energy. The interaction
    energy $E_{int}$ is determined from:


    ```

    $E_{int} = E(\text{system}) - E(\text{MOF}) - E(\text{gas}),$

    ```


    where $E(\text{system})$ represents the potential energy of the MOF with the adsorbed
    gas, and $E(\text{MOF})$ and $E(\text{gas})$ correspond with the potential energies
    of the MOF framework and gas molecules (e.g., CO$_2$ or H$_2$O), respectively.
    This approach allows for the calculation of both Q$_{st}$ and K$_H$ from statistical
    mechanics:


    ```

    \(\Delta H_{ads} = -Q_{st} = \frac{\langle E_{int} \exp(-\beta E_{int}) \rangle}{\langle
    \exp(-\beta E_{int}) \rangle} - k_\beta T\)

    ```


    ```

    $K_H = \beta \langle \exp(-\beta E_{int}) \rangle,$

    ```


    where $\Delta H_{ads}$ is the enthalpy of adsorption, $\beta$ represents the inverse
    of the thermal energy, defined as $\beta = \frac{1}{k_b T}$, where $k_b$ is the
    Boltzmann constant and $T$ is the temperature. Without the contribution from the
    thermal term $k_\beta T$ in $Q_{st}$, the value represents the ensemble-averaged
    interaction energy, denoted as $\Delta h_i$.


    # Fine-tuning of foundation model


    A variety of advanced MLFFs (e.g., MACE,$^{41}$ CHGNet,$^{42}$ M3GNet,$^{43}$
    and SevenNet$^{44}$) have been developed that accurately reproduce the DFT results
    for a diverse set of crystalline materials. These models have undergone extensive
    pre-training on datasets with total DFT energies ($E$) and atomic forces ($F$),
    mainly sampling from geometry optimization trajectories such as MPTraj.$^{42}$
    Among these, MACE-MP-0 model (referred to hereafter as MACE-MP for simplicity)$^{35}$
    stands out with its combination of the atomic cluster expansion for structure
    representation with equivariant and high body-order message passing graph


    neural networks for regression. The pre-training datasets for these models are
    dominated by inorganic compositions with fewer organic and organic-inorganic solids;
    however, the MACE-MP model has shown reasonable preliminary results on MOF systems.$^{35}$
    Therefore, we have built on this work to fine-tune a transferable MLFF, termed
    MACE-DAC, tailored to MOFs and their interaction with relevant gases.


    # GoldDAC dataset


    One of the primary challenges in fine-tuning models is the risk of severe overfitting
    to the limited fine-tuning dataset. When fine-tuning the pre-trained foundation
    models for MLFFs, Deng et al.$^{45}$ highlight a critical issue referred to as
    smoothing (or softening), which refers to the degradation in a model’s ability
    to accurately predict the non-equilibrium regions of potential energy surface
    (PES), as shown in Figure 2A. It arises from the reason that the training data
    used for MLFF development is predominantly concentrated around 0K equilibrium
    configurations (hereafter referred to as equilibrium configurations), which correspond
    with the local minimum on the PES. The smoothing becomes more pronounced during
    fine-tuning than the pre-training stage, as this process typically involves updating
    the pre-training model with a limited dataset.


    Accurately predicting the entire PES is particularly crucial for calculating gas
    adsorption properties via the Widom insertion method. Properties such as Q$_{st}$
    and K$_H$ values are sensitive to small errors in the PES, especially in regions
    where the interaction energy is less than zero. These errors, stemming from the
    exponential weighting of energy terms, can lead to significant deviations in predicted
    adsorption properties. For instance, while equilibrium regions of the PES are
    generally well modeled, inaccuracies in the repulsion region can alter the slope
    of the PES, leading to notable errors in derived thermodynamic properties.


    To overcome this challenge, we created the GoldDAC dataset that involves DFT results
    from CO$_2$ + MOF, H$_2$O + MOF, MOF, and gas molecule calculations. This dataset
    enables fine-tuning to enhance model performance across the entire PES, encompassing
    not only equilibrium regions but also the repulsive and weak-attraction regions.
    The training and validation sets were constructed from 60 structures, with three
    structures randomly sampled for each of the 20 most frequently occurring metals
    in the ODAC23 dataset.$^{39}$ The ODAC23 database is a comprehensive database
    including adsorption calculations of an MOF system for DAC applications at the
    DFT level.


    Since the interaction energy depends not only on the energy of the combined system
    (the MOF with gas molecule) but also on the individual energies of the framework
    and the gas molecules (e.g., CO$_2$ and H$_2$O), both configurations were included
    in the training and validation sets. For robust training, PES data from two of
    these structures were randomly allocated to the training set, while data from
    the remaining structure were used for validation. Since the dataset was developed
    for DAC application, the test set comprises 26 MOFs identified in the literature
    as promising for CO$_2$ capture. Overall, as shown in Table S1, 784 DFT calculations
    (720 for MOF + gas, 60 for MOF, and 4 for gas) were conducted to construct the
    training and validation sets, and an additional 312 DFT calculations were conducted
    to'
