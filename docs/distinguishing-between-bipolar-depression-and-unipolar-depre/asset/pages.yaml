    biomarker to distinguish patients. It is important to address several limitations
    in the present study. First, although the performance of the classifier was verified
    by LOOCV method, the method of the classifier would be improved if further validated
    in future training, and classification of the classifier on the same data set.
    Therefore, the classification model requires further validation, external validation,
    and multi-center results to confirm in its clinical application. Second, although
    the study only focuses on regions, it would be necessary to study the entire brain
