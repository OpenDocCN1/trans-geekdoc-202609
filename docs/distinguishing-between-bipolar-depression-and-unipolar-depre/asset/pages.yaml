    # Distinguishing between bipolar depression and bipolar depression on the reward
    circuit activities and clinical characteristics: A machine learning analysis


    Aixia Zhang *, Dan Qiao †, Yuchen Wang, Chunxia Yang, Yanfang Wang, Ning Sun,
    Xiaodong Hu, Zhifu Liu, Kerang Zhang


    Department of Psychiatry, the First Hospital of Shansi Medical University, Tianjin
    030001, China


    # ARTICLE INFO


    # ABSTRACT


    +   Keywords:

    Bipolar depression

    Unipolar depression

    Reward circuit

    Clinical feature

    Support mechanism


    Background: Differentiating bipolar depression (BD) from bipolar depression (UD)
    is a major clinical challenge. Identifying the potential markers between these
    two diseases is vital to optimize management of depressed individuals.

    Methods: Here, we aimed to integrate neuroimaging data with machine learning method
    to classify BD and UD at the individual level. Data with an average age of 35.1
    years from 31 healthy controls (HC group) and 42 patients conversion from major
    depressive disorder (MDD) to BD and 48 patients Using graph theory and functional
    connectivity (FC) analysis we investigated the differences in reward circuits
    among three groups. We then applied a support vector machine and leave-out-cross
    validation methods to classify BD and UD patients.

    Results: Patients with MDD and BD showed decreased degree centrality of rostromedial
    thalamic nucleus (RMN) and node efficiency (NE) of left frontal nucleus. Compared
    with BD and HC, BD showed decreased NE of right MD and FC between right and left
    prefrontal cortexes.

    Limitations: The classification model used out-of-sample analysis.

    Conclusion: The reward circuit dysfunction can not provide additional information
    to assist clinical diagnosis, but also in informed treatment decision of depressed
    patients.


    # 1. Introduction


    Unipolar (UD) and bipolar depressive disorders (BD) are leading causes of depression
    worldwide (Fried, 2017). Differences in etiology, characteristics and course of
    disease present a clinical diagnostic challenge, with BD often misidentified as
    FD (Fried et al., 2003). Since BD and UD have different treatment strategies,
    an inadequate diagnosis may delay the recovery process, increased rate of switch
    to mania and suicidal behavior, and contributing to the progression of the underlying
    disorder (Koupsakis and Sun,


    2014). Early identification and discrimination between BD and UD can improve the
    safety and accuracy of treatment.

    Currently, the presence of mania and hypomania is considered the main difference
    between BD and UD according to the clinical criteria. Clinical studies have shown
    that certain epidemiology differ between BD and UD (Prim et al., 2019; Serra et
    al., 2016; Volniger and Peris, Zisóok et al., 2007), e.g., with BD usually have
    a lower female to male ratio, earlier onset, shorter duration of the state, increased
    frequency of episodes, more prominent depressive symptoms as well as poorer response
    to antidepressant drugs, and such patients even demonstrate seasonal


