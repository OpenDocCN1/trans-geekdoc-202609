  md: '# D.4. Preprocessing


    The MRI preprocessing was carried out using Data and Analysis for Brain Imaging
    (DPABI; DPABI_V4.0_19305; http://dpabi.org/). For each participant, the first
    volume was then removed to adapt to MRI reartifacts that were removed. The remaining
    images underwent preprocessing, which consists of: (1) slice timing, (2) realignment
    of volumes for head motion, (3) signal intensity correction using the Neurological
    Institute (NI) template resampled voxel size of 2 x 2 x 2 mm), (4) denoising,
    (5) nuisance correction, including 24 motion parameters, white matter, cerebellum,
    and cerebrospinal fluid. Of note, the given region of interest (ROI) was selected
    to study the structural connectivity in course, which might lead to lesions of
    volumes within ROI that affecting the extraction of motion-related artifacts in
    the connectivity analysis (Li et al., 2015).


    To minimize the effect of head movement, the points with a displacement greater
    than 0.3 and the points before/after were excluded from being included in the
    final analysis of the blood oxygen-level-dependent (BOLD) signals generated by
    the timing points. For this reason, two individuals of the MDD and BD groups were
    excluded, the 32 subjects in BD group, 48 in MDD group and 33 in HC group were
    excluded from analysis.


    # D.5. Functional connectivity


    Following the preprocessing steps, ROIs were selected based on peak coordinates
    in the functional intensity of the region, including Basolateral Prefrontal Cortex
    (bLPFC) (Li et al., 2011), Medial Prefrontal Cortex (mPFC), Anterior Cingulate
    Cortex (ACC) (Dachman et al., 2018), Medial Orbital Frontal Cortex (mOFC) (Li
    et al., 2011), Ventral Temporal Area (VTA) (Bunecek and Jung, 2003), Amygdala
    (Amy), Posterior Cingulate Cortex (PCC), Nucleus Accumbens (NAc) (2017), Haenob
    Gula (Hb) (James, 2013), and medial thalamus (MD) (Li et al., 2011). And with
    three ROIs selected, the volumes that were selected based on areas with low signal-to-noise
    ratio were excluded to be removed by MI. The then signal-to-noise ratio of each
    ROI was >50, and a linear kernel function was used in each volume, which indicates
    the quality of the ROI signal used.


    We computed the ROI-ROI connectivity matrices using DPABI tools. Pearson''s correlation
    coefficients of averaged BOLD time series each pair of ROI were constructed using
    Fisher’s z-transformation. The correlation coefficients were transformed to Z
    values using the Fisher’s, a z-score matrix of each individual FC was separately
    obtained.


    # D.6. Construction of functional network


    The reward network was constructed using GETRING (https://www.nitrc.org/projects/get),
    a graph network analysis toolbox for brain connections. A brain network is constructed
    of nodes and edges. Nodes were defined by averaged BOLD signals from each relevant
    ROI and edges were constructed by FC. To further examine, we used thresholds,
    a range of sparsity (5% ≤ 50%) with an increment of 0.05 to evaluate effects of
    thresholds. Sparsity is defined as the ratio of the number of edges in the network
    to the maximum number of


    # D.7. Network metrics


    Graph theory was performed to analyze the functional brain network at both global
    and local levels. For global level, we used global efficiency (GE) and shortest
    path length (SPL) to assess the integration of the network. For local level, we
    used local efficiency (LE) (Li et al., 2017). GE measures the efficiency of information
    flow and SPL is the average of all the shortest path length, smallest mean values
    support fast information transfer to the brain. For local level, we used degree
    centrality, between centrality (BC), nodal efficiency (NC), and local efficiency
    (LE) to assess the connectivity of a node (Li et al., 2013). DC reflects the flow
    of information within important nodes in the network. NLE quantifies the information
    propagation from nodes to others. NQ quantifies the information propagation constituted
    by its neighbor node when removed, and BC reflects the effects of node on information
    transmission other nodes.


    # D.8. Statistical analysis


    Analysis of demographic and clinical characteristics were performed using SPSS
    16.0. Chi-square test identified differences in groups and one-way variance of
    analysis (ANOVA) to assess the differences between the three groups in age and
    years of education. For HAM-24 scores, we used independent t-test between groups
    and paired t-test within the same group. Results were considered significant if
    P < 0.05.


    Then, we used Network-based Statistics (NBS) method (Zamir et al., 2010), a nonparametric
    and validated statistical analysis for controlling multiple comparisons. We used
    the permutation kernel function (5000 permutations) with NBS correction. Subnetworks
    that were significant at a level of P < 0.05 were reported. Further FC analysis
    was performed for each group with comparison with LSD.


    # D.9. Classification method


    Using the Library for Support Vector Machines (LIBSVM) software (Chang and Lin,
    2007), we used linear SVM algorithm with kernel function to determine whether
    it could be able to identify patients with MDD and the ID group based on functional
    brain metrics and clinical characteristics. The functional brain network metrics
    were selected as the features for the classification connection and/or properties
    between MDD and BD group. We also chose the clinical characteristics differences
    between BD and MD group as classification features. To evaluate the effect of
    network attributes of the reward circuit and'
