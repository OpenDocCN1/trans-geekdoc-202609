    The SVM classification model used by LOOCV showed that the characteristics of
    reward circuit are significantly better than traditional clinical methods in distinguishing
    BD and UD. We found that using a combination of reward circuit properties and
    clinical symptoms as classification features, the accuracy for distinguishing
    MD and BD can reach to 87.50%, with sensitivity and specificity being highly,
    respectively. The implications of such findings are clarifying and the classification
    method has relatively satisfactory utility in identification. This evidence-based
    protocol may help to identify clusters of depressed patients and improve the current
    system-based design for bipolar depression (Dibatat et al. 2016). Developing performance
    of classification model will help to improve in precision and enhance the accuracy
    of clinical diagnosis for depressive patients. Together, our results suggest that
    reward circuit properties and clinical features complement each other, which can
    provide more comprehensive and perfect


    characterization of BD and UD, and demonstrate from another perspective that the
