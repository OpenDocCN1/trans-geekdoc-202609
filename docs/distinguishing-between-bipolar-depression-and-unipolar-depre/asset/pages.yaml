    # 3.2.2. Group properties


    Education and head-adjusted ANOVA demonstrated that the three groups differed
    significantly in DE and RC of the MD, NE of the VP and PFC. In box comparisons,
    the BD had significantly higher RC of MD, but no difference was observed between
    the MDD and HC. The MDD group also had significantly lower NE of MD, but no difference
    was observed between the BD and HC. The BD group had significantly higher NE of
    MD, but no difference between the BD and HC. For the properties (i.e., GF, SPL,
    GL, BC, and NLE), there were no significant differences among the three groups
    (Table 2, Fig. 2).


    # 3.2.3. SVM classification


    In classification BD group from MD group using clinical characteristics (i.e.,
    somatization, cognition impairment, and sleep disturbance) resulted in an accuracy
    of 68.7%, sensitivity: 59.38%; specificity: 75.00%; (P = 0.026). When combining
    clinical characteristics with functional features, the classification of BD group
    from MD group, the accuracy reached 87.50%, sensitivity: 78.13%; specificity:
    77.08%; (P = 0.0005).


