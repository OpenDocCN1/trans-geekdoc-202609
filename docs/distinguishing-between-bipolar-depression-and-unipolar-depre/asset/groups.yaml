    # ABSTRACT


    +   Keywords:

    Bipolar depression

    Unipolar depression

    Reward circuit

    Clinical feature

    Support mechanism


    Background: Differentiating bipolar depression (BD) from bipolar depression (UD)
    is a major clinical challenge. Identifying the potential markers between these
    two diseases is vital to optimize management of depressed individuals.

    Methods: Here, we aimed to integrate neuroimaging data with machine learning method
    to classify BD and UD at the individual level. Data with an average age of 35.1
    years from 31 healthy controls (HC group) and 42 patients conversion from major
    depressive disorder (MDD) to BD and 48 patients Using graph theory and functional
    connectivity (FC) analysis we investigated the differences in reward circuits
    among three groups. We then applied a support vector machine and leave-out-cross
    validation methods to classify BD and UD patients.

    Results: Patients with MDD and BD showed decreased degree centrality of rostromedial
    thalamic nucleus (RMN) and node efficiency (NE) of left frontal nucleus. Compared
    with BD and HC, BD showed decreased NE of right MD and FC between right and left
    prefrontal cortexes.

    Limitations: The classification model used out-of-sample analysis.

    Conclusion: The reward circuit dysfunction can not provide additional information
    to assist clinical diagnosis, but also in informed treatment decision of depressed
    patients.


    # 1. Introduction


    Unipolar (UD) and bipolar depressive disorders (BD) are leading causes of depression
    worldwide (Fried, 2017). Differences in etiology, characteristics and course of
