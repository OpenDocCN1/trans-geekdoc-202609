    ## D.4. 预处理


    MRI 预处理使用脑成像数据与分析工具 (DPABI; DPABI_V4.0_19305; http://dpabi.org/) 完成。对于每个参与者，首先移除了第一个卷，以适应已消除的
    MRI 伪影。剩余图像经过了预处理，包括：(1) 层时校正，(2) 针对头部运动对卷进行重新对齐，(3) 使用神经学研究所 (NI) 模板重采样体素大小为
    2 x 2 x 2 mm 进行信号强度校正，(4) 去噪，(5) 干扰校正，包括 24 个运动参数、白质、小脑和脑脊液。注意的是，给定的感兴趣区域 (ROI)
    是为了研究过程中的结构连接性，这可能导致 ROI 内体素出现病变，从而影响连接性分析中运动相关伪影的提取（Li et al., 2015）。


    为了最小地减少头部运动的影响，将位移大于 0.3 的点及其前后的点被排除在由时间点生成的血氧水平依赖 (BOLD) 信号的最终分析之外。因此，MDD 组和
    BD 组分别有两个个体被排除，BD 组 32 名受试者、MDD 组 48 名和 HC 组 33 名被排除在分析。


    ## D.5. 功能连接


    预处理步骤之后，根据区域功能性的峰值坐标选择 ROI，包括基底前额叶皮层 (bLPFC) (Li et al., 2011)、内侧前额叶皮层 (mPFC)、前扣回
    (ACC) (Dachman et al., 2018)、内侧眶额皮层 (mOFC) (Li et al., 2011)、腹颞区 (VTA) (Bunecek
    and Jung, 2003)、杏仁核 (Amy)、后扣状回 (PCC)、伏隔核 (NAc) (2017)、海马纹体 (Hb) (James, 2013)
    和内丘脑 (MD) (Li et al., 2011)。在选出的三个 ROI 中，根据低信噪比区域选出的卷被 MI 移除。随后每个 ROI 的信噪比 >50，且每个卷均使用线性核函数，这表明所用
    ROI 信号的质量。


    我们使用 DPABI 工具计算了 ROI-ROI 连接矩阵。每对 ROI 的平均 BOLD 时间序列的 Pearson 相关系数通过 Fisher''s z
    变换构建。相关系数通过 Fisher''s 变换转换为 Z 值，分别获取了每个个体功能连接 (FC) 的 z 分数矩阵。


    ## D.6. 功能网络的构建


    奖励网络使用 GETRING (https://www.nitrc.org/projects/get) 构建，这是一个用于脑连接的图网络分析工具箱。脑网络由节点和边组成。节点由每个相关
    ROI 的平均 BOLD 信号定义，边通过 FC 构建。为了进一步检查，我们使用了阈值，即稀疏度范围（5% ≤ 50%）且步长为 0.05，以评估阈值的影响。稀疏度被定义为网络中边的数量与最大边数量的比例。


    ## D.7. 网络指标


    通过图论方法从全局和局部层面分析了功能脑网络。在全局层面，我们使用全局效率 (GE) 和最短路径长度 (SPL) 来评估网络的整合性。在局部层面，我们使用局部效率
    (LE) (Li et al., 2017)。GE 衡量信息流的效率，SPL 是所有最短路径长度的平均值，较小的均值支持信息向大脑的快速传输。在局部层面，我们使用度中心性、介中心性
    (BC)、节点效率 (NC) 和局部效率 (LE) 来评估节点的连接性 (Li et al., 2013)。DC 反映了网络中重要节点内部的信息流。NLE
    量化了从节点到其他节点的信息传播。NQ 量化了移除邻节点节点组成的信息传播，BC 反映了节点对其他节点信息传输的影响。


    ## D.8. 统计分析


    使用 SPSS 16.0 进行人口统计学和临床特征分析。卡方检验识别了组间差异，单因素方差分析 (ANOVA) 用于评估三组在年龄和教育年限上的差异。对于
    HAM-24 分，我们使用了组间独立 t 检验和组内配对 t 检验。如果 P < 0.05 则认为结果显著。


    然后，我们使用了基于网络的统计 (NBS) 方法 (Zamir et al., 2010)，这是一种用于控制多重比较的非参数验证的统计分析。我们使用了置换核函数（5000
    次置换）结合 NBS 校正。报告了 P < 0.05 水平下显著的子网络。对每组进行了进一步的 FC 分析并与 LSD 进行。


    ## D.9. 分类方法


    使用支持机库 (LIBSVM) 软件 (Chang and Lin, 2007)，我们使用带核函数的线性 SVM 算法来确定其是否能根据功能脑指标和临床特征识别
