    # 2. Materials and methods


    # 2.1. Participants


    In the past decade, neuroimaging techniques, functional MRI have been widely used
    to investigate pathological patterns of BD and UD (of Almeida, and Phillips, 2013).
    Current evidence suggests that BD and UD were "disconnection syndromes", and the
    functional brain abnormalities observed in these diseases reflect the presence
    of some connecting pathophysiological mechanisms (Jano et al., 2013). Difference,
    the abnormality of the reward circuit in BD and UD are receiving increasing attention.
    Although studies reported that patients with BD showed a shared functional connection
    between the reward center the anterior insula (AI) and the inferior parietal lobe
    (IP), which is correlated with severity of depressive symptoms, others reported
    that such connection has a certain degree of determination between the two diseases
    (64 to 47 %, 71 %, and 60 % (Elard et al., 2018)). Considering task-based MRI
    and graph theory, patients with BD and UD showed different patterns of network
    efficiency, density, path, and length of reward circuit within or without manic
    episodes (Antimanelis et al., 2016). These findings improve our understanding
    of pathophysiological processes and diseases that might differ in the early stages
    of development. However, most research is limited to the evaluation of earlier
    characteristics. Furthermore, although the effectiveness of clinical features
    in distinguishing the two diseases is not ideal, it is still the main basis of
    clinical diagnosis, while most studies have ignored the role of clinical features
    in the different disorders.


    From another point of view, majority of neuroimaging studies focused on biomarkers
    at the group level, with an inadequate focus on diagnosis at individual level.
    One solution may reside in various machine learning methods which enable algorithms
    to automatically detect repetitive patterns and intelligent decisions based on
    imaging data, such methods could help achieving individual classification and
    solve mood disorder problems in clinical settings. The support vector machine
    (SVM) on minimizing risks has available data and a higher detection accuracy than
    other types of methods (Byeon, 2015).


    In the current study, we conducted a retrospective study with neuro and clinical
    data of first-onset depressive patients who were followed up for an average of
    7.5 years. Graph theory and connectivity (FC) analysis, we investigated the differences
    in functional architectures of reward circuit between patients with bipolar disorder
    (BD) and UD at the end of follow-up period, compared with patients diagnosed of
    MD at the end of follow-up period. We used SVM to construct a classification model
    of BD and UD, with network attributes of the reward circuit and clinical characteristics
    as features. The Leave-one-out cross-validation (LOOCV) was utilized to verify
    the performance of the classification method.


    The present study included 84 patients (first-episode Bipolar Depression, BD group,
    n=34; first-onset Unipolar Depression, MD group, n=50) and 31 healthy controls
    (HC group, n=31). The data was collected from patients with an initial diagnosis
    of MD and an average of seven-year follow-up. We recruited patients with an initial
    diagnosis of MD from the Department of Psychiatry, First Hospital of Shanghai
    Medical University, Tianjin, China, during a period of 2010 to 2016. Patients
    were aged from 18 to 55 years and had no history of substance or alcohol abuse
    in community. All participants were evaluated by psychiatrists to determine the
    presence or absence of axis I depressive symptoms using the Structured Interview
    for DSM-IV (SADS-IV) and Structured Interview for Axis I Disorders (SCID). Clinical
    symptom was assessed using the Hamilton Rating Scale for Depression (HAM-D). Inclusion
    criteria for patients in the MD group included: (1) diagnosis of axis I depression;
    (2) no history of manic or hypomanic episode; (3) no history of psychiatric disorder;
    (4) a score of HAM-D not more than 24; (5) right-handed; (6) no history of substance
    or alcohol abuse; and (7) no history of psychiatric disorder and any MRI contraindications.
    Inclusion criteria for the BD group included: (1) any symptom of major depressive
    disorder; (2) history of one manic or hypomanic episode.


    Then, we followed up 96 MD patients and performed SCD during every visit. We were
    re-evaluated at 2 weeks, 8 weeks, 3 months, and 6 months after the. After the
    event,


    This study was approved by the Ethics Committee of the First Hospital of Shanghai
    Medical University. All participants signed the informed consent.


    # 2.2. MRI acquisition and processing


    MRI data were acquired on an MAGNETOM 3.0 T scanner (Siemens Medical Systems,
    Germany) with a 12-channel head coil. For high-resolution anatomical T1-weighted
    images were acquired in three planes. Restrained room with head and rubber pads
    were used to minimize head motion and noise interference. The patients were informed
    of the procedures before the MRI scan and were required to close their eyes and
    not move. Scanning of the functional regions was performed as follows: echo-planar
    imaging sequence with 32 axial slices, repetition time (TR) = 200 ms, echo time
    (TE) = 900 ms, flip angle (FA) = 90°, field of view (FOV) = 240 mm², acquisition
    matrix = 64 × 64, slice thickness = 3 mm,


    # 2.3. Image processing


    The processing includes four major stages: (1) preprocessing; (2) extraction of
    the FC matrix; (3) construction brain network from FC matrix; (4) brain network
    analysis.


