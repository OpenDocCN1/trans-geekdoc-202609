    # 4. Discussion


    At present, the depression polarity between bipolar disorder and depressive features,
    which are related to subjective and insufficient connectivity. Personalized medicine
    has the clinical goal of psychiatry for long term, and classification numerous
    biomarkers on brain connectivity are important. Considering clinical characteristics
    as the primary features for both diagnosis and the differential ability of risk
    assessment, we have conducted a retrospective study with a 7-year follow-up, using
    machine learning techniques to classify MDD patients with the combination of clinical
    features and functional features. This study show: (1) the changes in the FC of
    reward regions varies between BD and MD patients; (2) The difference in connectivity
    patterns is reflected in the local models using clinical characteristics and functional
    brain features better distinguish patients with MDD with an accuracy of 87.5%.


    One of the features observed in BD group from FD is the functional change in the
    right MD. The MD is known to be in well-behaved behavior and depressive behavior.
    Behavior affected by mood could still be affected by function or damage of hippocampus
    in MD / rodents, and adults, relapse and recovery of for novel heterogeneous stimuli
    (Akamoto et al., 2016). Such evidence suggests that the maintenance of MD patients
    from individuals is from accurately evaluating changes in effective stimuli under
    stress and uncertain situations, and that this still impair the coordination and
    integration process of behavior-behaviors.


