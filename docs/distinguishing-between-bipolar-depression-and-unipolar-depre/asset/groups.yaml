    # 基于奖励回路活动和临床特征区分双相情感抑郁与单极性抑郁障碍的机器学习分析


    Aixia Zhang *, Dan Qiao †, Yuchen Wang, Chunxia Yang, Yanfang Wang, Ning Sun,
    Xiaodong Hu, Zhifu Liu, Kerang Zhang


    山西医学大学第一医院精神科，天津 030001，中国


    # 文章信息


    # 摘要


    - 关键词：

    - 双相情感抑郁

    - 单极性抑郁障碍

    - 奖励回路

    - 临床特征

    - 支持机制


    背景：区分双相情感抑郁（BD）与单极性抑郁（UD）是临床上的一个主要挑战。识别这两种疾病之间的潜在标志物对于优化抑郁患者的管理至关重要。


    方法：本文旨在整合神经影像数据与机器学习方法，在个体水平上对BD和UD进行分类。数据来自31名健康对照（HC组）、42名从单相抑郁症（MDD）转变为BD的患者以及48名患者，平均年龄为35.1岁。通过图论和功能连接（FC）分析，我们研究了三组之间奖励回路的差异。随后，我们应用支持向量机和留一交叉法对患者分类。


    结果：MDD和BD患者显示出脑内侧丘脑核（RMN）度中心性下降以及左侧额叶节点效率（NE）降低。与BD和HC组相比，BD表现出右侧背侧核（MD）的NE降低以及左右额叶皮层之间的功能连接减少。


    局限性：分类模型使用了样本外分析。


    结论：奖励回路功能障碍不仅能为辅助临床诊断提供额外信息，还能为抑郁患者提供科学的治疗决策支持。


    # 1. 引言


    单极性抑郁（UD）和双相情感障碍（BD）是全球范围内抑郁的主要原因（Fried, 2017）。病因学、特征和病程的差异构成了临床诊断的挑战，BD常被误诊为UD（Fried
    et al., 2003）。由于BD和UD采取不同的治疗策略，诊断不当可能会延迟恢复过程，增加转化为狂躁和自杀行为的概率，并导致基础疾病的进展（Koupsakis
    and Sun, 2014）。早期识别和区分BD与UD可以提高治疗的安全性和准确性。


    目前，根据临床标准，狂躁和轻躁发作的存在被认为是BD与UD的主要区别。临床研究显示BD和UD在某些流行病学上存在差异（Prim et al., 2019;
    Serra et al., 2016; Volniger and Peris, Zisóok et al., 2007），例如，BD通常女性男女比例较低、发病较早、状态持续时间短、发作频率增加、抑郁症状更明显，且对抗抑郁药物反应较差，此类患者甚至表现出季节性症状；


    > *Aixia Zhang 和 Dan Qiao 共同第一作者。

    †山西医学大学第一医院，天津 030001，中国。

    *电子邮箱：zhenifen@xsmu.edu.cn; Liu, stomsxu@vip.163.com (K. Zhang)。


    A. Zheng


    然而，用于区分这两种疾病的临床特征在区分能力上通常不尽如人意。20%的抑郁发作患者在首次发时根据临床特征被正确确诊（Fischberg et al., 2003），大多数患者在确诊前平均花费5年。因此，识别能够帮助区分BD和UD的客观生物标志物至关重要。


    情感障碍杂志 第327卷 (2023) 46-53


    # 2. 材料与方法


    ## 2.1. 参与者


    在过去的十年里，神经影像技术（功能性磁共振）已广泛用于研究BD和UD的病理模式（of Almeida, and Phillips, 2013）。目前的证据表明，BD和UD是“连接综合征”，这些疾病中观察到的大脑功能异常反映了某些连接病理生理机制的存在（Jano
    et al., 2013）。不同的是，BD和UD奖励回路的异常正受到越来越多的关注。尽管研究报告BD患者在奖励中心、前岛叶（AI）以及下顶叶（IP）之间存在共同的功能连接，且与抑郁症状的严重程度相关，但其他研究报告这种连接在两种疾病之间具有某种程度的差异
    (64%到47%、71%和60% (Elard et al., 2018)).考虑到任务和功能连接（FC）分析，我们研究了三组之间奖励回路的差异。随后，我们应用支持向量机和留一交叉法对BD和UD患者分类。


