    行为结果的出现是由于与奖励相关的执行控制受到干扰，这可能是由奖励回路内部自下而上处理的紊乱引起的。MD 是连接亚皮下前额叶区域与奖励回路的重要区域，它接收来自杏仁核、海马体和基底节的输入，并向前额皮层、dlPFC、vmPFC、下扣带状回层（sgACC）发送输入。事实上，MD
    接收来自前额皮层的输入并维持这些区域活动的效率。换句话说，MD 可能维持了神经边缘系统环路/奖励回路的整合-处理-共享。结果，MD 的功能障碍可能导致神经回路内灵活性下降，并“诱发”个体目标导向行为的活动。


    在我们的样本中，我们观察到与 MDD 患者相比，患者不仅表现出自控程度的降低，还表现出另一个程度的 MD。结果表明，由于无法整合奖励活动，BD 患者奖励回路中的信息流可能会受到破坏。与
    MDD 患者相比，BD 患者丘脑的短时功能连接（FC）有所减弱（Xia 等人，2019），Teng 也发现 BD 患者中丘脑-纹状体回路的节连接有所减弱（Teng
    等人，2014）。我们的发现为 BD 患者表现出与奖励相关的执行控制功能障碍的原因提供了更深入的见解，这可能是由奖励回路内部“自下而上处理”的紊乱引起的。具体而言，MD
    无法整合外部效价刺激触发的刺激中的神经活动，并调节前额皮层不同功能区域之间的信息。因此，前额皮层的各个区域无法有效处理和调节信息下载，反而导致目标导向行为的波动。正如之前的研究所示，BD
    亚皮下区域的活动是……


    最近，研究表明 vmPFC 不仅与奖励回路有关，与负面情绪的产生和调节以及自我相关信息的过程有关。我们发现灰质 vmPFC 水（pg-vmPFC）与负性抑郁相关，且
    pg-vmPFC 与丘脑之间的 FC 强度与绝望感正相关（Ito 等人，2017）。Pilli 等人发现负性自我关注注意（SFA）导致……


