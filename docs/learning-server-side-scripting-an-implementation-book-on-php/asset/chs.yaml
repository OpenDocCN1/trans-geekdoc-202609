  \n我们将包含 `$_FILES[]` 变量用于上传过程。我们不会将文件存储在数据库中，而是将文件存储在服务器上（在我们的例子中是 `onlinecourse`\
  \ 文件夹），仅将文件路径存储在数据库中。\n\n```php\n<?php\nrequire('connect.php');\nif(isset($_POST['upload'])){\n\
  \ $title = $_POST['txtcontent'];\n $course = $_POST['txtcourse']’\n $filename =\
