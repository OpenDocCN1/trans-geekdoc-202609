  \n这就是服务器端将 HTML 部分渲染给浏览器的方式！也就是说，浏览器无法查看服务器端脚本代码！\n\n尝试执行更多代码以理解 HTML 是如何渲染的。\n\n\
  ---\n\n#### 2.2 变量\n\n---\n\n变量用于在 PHP 程序中存储信息。\n\n**如何使用变量？**\n\n*   变量使用 `=` 运算符赋值，变量在左侧，待求值的表达式在右侧。\n\
  *   变量的值是其最近一次赋值的值。\n\n**PHP 变量的特性：**\n\n*   变量可以在脚本的任何位置声明/赋值。\n*   变量可以（但不必）在赋值前声明。\n\
  *   变量事先不知道它将用于存储数字还是字符串。\n*   变量在赋值前使用时具有默认值。\n*   PHP 根据变量的值自动为其关联数据类型。\n*   PHP\
  \ 在必要时能很好地自动将类型从一种转换为另一种。\n\n**变量命名规则**\n\n*   变量以 `$` 符号开始，后跟变量名。\n*   变量名必须以字母或下划线字符开头。\n\
  *   变量名不能以数字开头。\n*   变量名只能包含字母数字字符和下划线（`a-z`、`A-Z`、`0-9` 和 `_`）。\n\n\n\n\n* 变量名不能包含\
  \ `+`、`-`、`%`、`(`、`)`、`.`、`&` 等字符\n* 变量名**区分大小写**（`$var` 和 `$VAR` 是不同的）\n\n**练习：**\n\
  \n你可以使用上一节的同一个 PHP 文件，也可以根据需要创建一个新文件。\n\n请始终记住：\n\n* 打开 XAMPP - 启动 Apache 服务器\n\
  * 将文件以 `.php` 扩展名保存\n* 代码需放在 PHP 标签 `<?php ?>` 内部\n\n现在让我们创建/声明变量：\n\n```php\n/*\
  \ Variables */\n\n// 存储字符串的变量\n$var1 = 'Hello';\n$var2 = \"Hello World\";\n\n//\
  \ 存储数字的变量\n$x = 5; $y = 10;\n$z = $x + $y;\n\necho \"Single quote String - \".$var1;\n\
  echo '<br>Double quote String - '.$var2;\necho \"<br>Sum of x and y = \".$z;\n```\n\
  \n**执行：**\n\n执行页面时，将获得如下输出：\n\n![2-2-1](img/image00156.jpeg)\n\n* 存储字符串/文本时必须使用单引号或双引号\n\
  * 可以将表达式赋值给变量以存储结果\n\n**变量作用域：**\n\n变量的作用域是指 PHP 脚本中可以引用或使用该变量的部分。\n\nPHP 有三种不同的变量作用域：\n\
  \n* 局部\n* 全局\n* 静态\n\n目前理解变量作用域可能有难度。我们将在讨论 PHP 函数时详细探讨它们。\n\n***\n\n#### 2.3 数据类型\n\
  \n***\n\n变量可以存储不同类型的数据，不同的数据类型可以执行不同的操作。\n\nPHP 支持以下数据类型：\n\n* String（字符串）\n* Integer（整数）\n\
  * Double（双精度浮点数）\n* Boolean（布尔值）\n* NULL（空值）\n* Array（数组）\n* Object（对象）\n* Resource（资源）\n\
  \n我们将简要了解所有类型：\n\n* **Strings（字符串）** —— 字符序列，如 `'PHP supports string operations.'`\n\
  * **Integers（整数）** —— 不带小数点的整数，如 `4195`\n* **Doubles（双精度浮点数）** —— 浮点数，如 `3.14159`\
  \ 或 `3.1`\n* **Booleans（布尔值）** —— 只有两个可能的值：`true` 或 `false`\n* **NULL（空值）** —— 一种特殊类型，只有一个值：`NULL`\n\
  * **Arrays（数组）** —— 命名并索引的其他值的集合\n* **Objects（对象）** —— 程序员定义的类的实例，可以封装特定于该类的值和函数\n\
  * **Resources（资源）** —— 特殊变量，保存对 PHP 外部资源的引用（如数据库连接）\n\n***\n\n**字符串：**\n\n字符串是字符序列。字符串可以是引号内的任何文本。可以使用单引号或双引号。\n\
  \n* 以反斜杠 (`\\\\`) 开头的某些字符序列会被替换为特殊字符\n* 变量名（以 `$` 开头）会被替换为其值的字符串表示形式\n\n转义序列替换：\n\
  \n* `\\\\n` 替换为换行符\n* `\\\\r` 替换为回车符\n* `\\\\t` 替换为制表符\n* `\\\\$` 替换为美元符号本身 (`$`)\n\
  * `\\\\\"` 替换为单个双引号 (`\"`)\n* `\\\\\\\\` 替换为单个反斜杠 (`\\\\`)\n\n**练习：**\n\n```php\n\
  /*Data Types */\n// Strings\n$string1 = \"Hello, This is a single line string\"\
  ;\n$string2 = \"<br>This is printed in new first line <br> This is the second line<br>\"\
  ;\n$string3 = \"\";   // Empty String\n$string4 = \"<br>Using \\\" quotes \\\" inside\
  \ string\";\necho $string1;\necho $string2;\necho $string3;\necho $string4;\n```\n\
  \n**执行：**\n\n![2-3-1](img/image00157.jpeg)\n\n* 由于 `$string2` 以 `<br>` 标签结尾，光标移至新行\n\
  * `$string3` 是空变量，因此不打印任何内容\n* `$string4` 以 `<br>` 标签开头。这是 `$string2` 和 `$string4`\
  \ 变量之间出现间隙的原因\n* 尝试移除和添加 `<br>` 标签，观察会发生什么\n\n**整数：**\n\n整数数据类型是介于 `-2,147,483,648`\
  \ 和 `2,147,483,647` 之间的非十进制数字。\n\n整数规则：\n\n* 整数必须至少有一位数字\n* 整数不能有小数点\n* 整数可以是正数或负数\n\
  * 整数可以用以下方式指定：十进制（基数 10）、十六进制（基数 16）、八进制（基数 8）或二进制（基数 2）表示法\n\n**双精度浮点数：**\n\n双精度浮点数或浮点数是带有小数点的数字，或以指数形式表示的数字。\n\
  \n**练习：**\n\n```php\n// Integers\n$x = 5691;\n$y = -5691;\necho \"<br>Sum of Integers\
  \ = \".($x + $y);\n// Floats\n$a = 56.940;\n$b = -56.910;\necho \"<br>Sum of Floats\
  \ = \".($a + $b);\n```\n\n**执行：**\n\n![2-3-2](img/image00158.jpeg)\n\n在代码中，如果移除表达式周围的\
  \ `()`，将触发警告。\n\n例如：将整数部分的 echo 语句更改为：\n\n```php\necho \"<br>Sum of Integers = \"\
  .$x + $y;\n```\n\n![2-3-3](img/image00159.jpeg)\n\n这意味着，echo 语句在 `$x` 处是正确的。因此表达式必须用括号括起来。\n\
  \n此外，使用下面的代码，只会打印 `$x` 和 `$y` 变量的值，而不是计算它们。\n\n```php\necho \"<br>Sum of Integers\
  \ = \".$x.\"+\".$y;\n```\n\n![2-3-4](img/image00160.jpeg)\n\n希望你理解 `echo` 对引号用法的反应。\n\
  \n**布尔值：**\n\n布尔值表示两种可能的状态：`TRUE` 或 `FALSE`。布尔值主要用于条件判断和循环（将在下一章讨论）。\n\n**空值：**\n\
  \n`Null` 是一种特殊数据类型，只能有一个值：`NULL`。数据类型为 `NULL` 的变量是未分配值的变量。\n\n如果创建变量时未赋值，它将自动被赋值为\
  \ `NULL`。也可以通过将值设置为 `NULL` 来清空变量。在布尔上下文中，它评估为 `FALSE`。\n\n**练习：**\n\n```php\n//\
  \ Boolean\n$t = TRUE;\n$f = FALSE;\necho \"<br>True - \".$t;\necho \"<br>False -\
  \ \".$f;\n// Null\n$var = NULL;\necho \"<br>Printing NULL - \".$var;\n$var_new =\
  \ \"Hello\";\necho \"<br> Testing var_new - \".$var_new;\n$var_new = NULL;\necho\
  \ \"<br> Testing var_new - \".$var_new;\n```\n\n**执行：**\n\n`FALSE` 和 `NULL` 不打印任何内容。\n\
  \n![2-3-5](img/image00161.jpeg)\n\n**如何根据赋值查找数据类型？**\n\n让我们看以下代码集：\n\n```php\n//\
  \ checking data type\n$d1 = 91;\n$d2 = 9.1;\n$d3 = \"hello\";\n$d4 = TRUE;\n$d5\
  \ = NULL;\nvar_dump($d1);\necho \"<br>\";\nvar_dump($d2);\necho \"<br>\";\nvar_dump($d3);\n\
  echo \"<br>\";\nvar_dump($d4);\necho \"<br>\";\nvar_dump($d5);\n```\n\n当你想知道变量的数据类型时，可以使用\
  \ `var_dump()` 函数。\n\n![2-3-6](img/image00162.jpeg)\n\n**如何检查变量是否不为空？**\n\n我们可以检查变量是否持有值。如果变量不持有任何值，我们称之为\
  \ `NULL`。\n\n请看下面的代码：\n\n```php\n// check for NULL\n$n1 = NULL;\n$n2 = 10;\necho\
  \ \"checking n1 = \".isset($n1);\necho \"<br>checking n2 = \".isset($n2);\n```\n\
  \n![2-3-7](img/image00163.jpeg)\n\n`isset($n1)` 将返回 `false`，因为 `$n1` 不持有任何值。\n\n\
  `isset($n2)` 将返回 `true`（`1`），因为 `$n2` 持有整数值。\n\n**对象：**\n\n从类实例化对象属于面向对象编程。你可以查看下面的示例：\n\
  \n```php\n/* $myCar is an object */\n<?php\nclass Car {\n  public $color;\n  public\
  \ $model;\n}\n$myCar = new Car();\n?>\n```\n\n执行此代码不会有任何输出。我们没有在代码中显示任何内容。我们创建了一个具有两个属性的类，并从该类创建了一个对象。\n\
  \n我们将在本章的另一节中讨论数组。\n\n资源的示例将在第 4 章讨论。\n\n***\n\n#### 2.4 内置函数\n\n***\n\nPHP 拥有内置函数，可以直接从脚本中调用以执行特定任务。\n\
  \n我们有用于处理数据类型的内置函数：字符串、数字等。我们将在以下类别中讨论其中的一些函数：\n\n* 数值函数\n* 数学函数\n* 字符串函数\n* 日期/时间函数\n\
  \nPHP 提供自动数据类型转换。我们将在处理示例时探讨这种转换。\n\n***\n\n**数值函数：**\n\n这里将讨论与整数和浮点数相关的函数。\n\n\
  PHP 具有以下函数来检查变量类型是否为整数：\n\n* `is_int()`\n* `is_integer()`\n* `is_long()`\n\n\n\n\
  ##### PHP 类型检查函数\n\n###### 浮点数类型检查\n\nPHP 拥有以下函数来检查变量的类型是否为浮点数：\n\n*   `is_float()`\n\
  *   `is_double()`\n\n###### 有限/无限值检查\n\nPHP 拥有以下函数来检查数值是有限还是无限。大于 `PHP_FLOAT_MAX`\
  \ 的数值被视为无限。\n\n*   `is_finite()`\n*   `is_infinite()`\n\n###### NaN 检查\n\nPHP 拥有函数来检查值是否**非**数字。NaN\
  \ 代表 Not a Number（非数字）。NaN 用于不可能的数学运算。\n\n*   `is_nan()`\n\n###### 数字检查\n\nPHP 函数使用以下函数来判断变量是否为数字。如果变量是数字或数字字符串，该函数返回\
  \ true。否则返回 false。\n\n*   `is_numeric()`\n\n从 PHP 7.0 开始，该函数将对十六进制形式的数字字符串（例如 `0xf4c3b00c`）返回\
  \ FALSE，因为它们不再被视为数字字符串。\n\n###### 整数转换\n\n有时你需要将数值转换为另一种数据类型。以下函数常用于将值转换为整数。\n\n\
  `(int)`、`(integer)` 或 `intval()`\n\n---\n\n###### 练习：数字函数\n\n虽然不是全部，但我已尽力包含尽可能多的函数：\n\
  \n```php\n// Numeric Functions\n\n$x = 56;\n$y = 56.7905;\n$z = acos(8);\necho \"\
  <br>x is an integer? \";\nvar_dump(is_int($x));\necho \"<br>y is an integer? \"\
  ;\nvar_dump(is_int($y));\necho \"<br>y is a float? \";\nvar_dump(is_float($y));\n\
  echo \"<br>z is a \";\nvar_dump($z);\necho \"<br> z is not a number? \";\nvar_dump(is_nan($z));\n\
  \n\n$m = 1.9e501;\n$n = 1.8e45;\necho \"<br> m is finite? \";\nvar_dump(is_finite($m));\n\
  echo \"<br> n is finite? \";\nvar_dump(is_finite($n));\necho \"<br> m is infinite?\
  \ \";\nvar_dump(is_infinite($m));\n\n\n$s = \"5679\";\necho \"<br> s is numeric?\
  \ \";\nvar_dump(is_numeric($s));\n$t = \"56.79\" + 10;\necho \"<br> t is numeric?\
  \ \";\nvar_dump(is_numeric($t));\n$r = \"Hello\";\necho \"<br> r is numeric? \"\
  ;\nvar_dump(is_numeric($r));\n```\n\n##### 执行\n\n由于变量 `$s` 完全是一个数字，PHP 会自动将字符串转换为数字。变量\
  \ `$t` 中也会发生类似的自动转换。\n\n![2-4-1](img/image00164.jpeg)\n\n尝试将变量 `$r` 的表达式更改为：\n\n\
  ```php\n$r = 10 + \"Hello\";\n```\n\n将会生成一个关于使用字符串（非数字）的警告，但最终 `$r` 将是一个数字。\n\n\
  ![2-4-2](img/image00165.jpeg)\n\nPHP 尝试将字符串转换为数字，当无法转换时，它会直接忽略，并在上述表达式中仅计算 10，因此\
  \ `is_numeric()` 返回 true。另一方面，PHP 会触发警告，指明它在数值表达式中遇到了非数字值！\n\n---\n\n##### 数学函数\n\
  \nPHP 拥有一组数学函数，允许你对数字执行数学任务。我们将在此讨论其中几个：\n\n*   `pi()` - 返回圆周率的值\n*   `min()` -\
  \ 返回参数列表中的最小值\n*   `max()` - 返回参数列表中的最大值\n*   `abs()` - 返回数字的绝对（正）值\n*   `sqrt()`\
  \ - 返回数字的平方根\n*   `round()` - 将浮点数四舍五入到最接近的整数\n*   `rand()` - 生成一个随机数\n\n######\
  \ 练习：数学函数\n\n我们将逐一查看每个函数！\n\n我们将以两种方式检查四舍五入到最接近的整数。同样，我们将检查在最小和最大限制之间生成随机数！\n\n\
  ```php\n// Mathematical Functions\n\necho \"<br>Value of pi = \".pi();\necho \"\
  <br>Highest of 12 25 9 = \".max(12,25,9);\necho \"<br>Lowest of 12 25 9 = \".min(12,25,9);\n\
  echo \"<br>Absolute value of -5.97 = \".abs(-5.97);\necho \"<br>Square root of 625\
  \ = \".sqrt(625);\necho \"<br>Rounding to nearest 7.58 = \".round(7.58);\necho \"\
  <br>Rounding to nearest 7.08 = \".round(7.08);\necho \"<br>Generate a random number\
  \ = \".rand();\necho \"<br>Generate a random number between 30 and 60 = \".rand(30,60);\n\
  ```\n\n##### 执行\n\n希望每个函数都显示了预期的结果！\n\n![2-4-3](img/image00166.jpeg)\n\n测试更多示例以加深理解！\n\
  \n---\n\n##### 字符串函数\n\n在深入函数之前，我们将首先了解**字符串连接运算符**，称为点号 (`.`)。你可能在之前的示例的 echo 语句中见过这个运算符。连接运算符的作用是连接或合并两个字符串！\n\
  \n我们将查看一些用于操作字符串的常用函数。\n\n###### 字符串长度\n\n*   `strlen(string)` 函数返回字符串的长度。\n*  \
  \ 字符串的长度常用于循环或其他函数中，当需要知道字符串何时结束时非常重要。\n\n###### 单词计数\n\n*   `str_word_count(string)`\
  \ 函数计算字符串中的单词数量。\n\n###### 字符串反转\n\n*   `strrev(string)` 函数反转字符串。\n\n###### 字符串搜索\n\
  \n*   `strpos(string, search)` 函数用于在字符串中搜索特定的字符串或字符。\n*   如果在字符串中找到匹配项，该函数将返回第一个匹配项的位置。\n\
  *   如果未找到匹配项，它将返回 FALSE。\n*   位置从 0 开始，而不是 1。\n\n###### 字符串替换\n\n*   `str_replace(find,\
  \ replace, string, count)` 函数用另一些字符替换字符串中的一些字符。\n*   `count`（可选参数）是一个计算替换次数的变量。\n\
  \n###### 练习：字符串函数\n\n我们将查看上述所有函数。\n\n```php\n// String Functions\n$str = \"Welcome\
  \ to PHP\";\necho \"<br>Example String: \".$str;\necho \"<br>Length of string =\
  \ \".strlen($str);\necho \"<br>Number of words in string = \".str_word_count($str);\n\
  echo \"<br>Reverse of string = \".strrev($str);\necho \"<br>Search P position in\
  \ string = \".strpos($str,\"P\");\necho \"<br>Replace PHP with PHP Course = \".str_replace(\"\
  PHP\",\"PHP Course\",$str);\n```\n\n##### 执行\n\n![2-4-4](img/image00167.jpeg)\n\n\
  长度包含空格字符。也就是说，空格也被计为一个字符。Welcome to PHP 中 P 的位置是 11，意味着字符串从 0 开始计数。\n\n---\n\n#####\
  \ 日期/时间函数\n\n虽然关于此主题有很多可讨论的内容，但我们将学习在 PHP 中处理日期/时间。\n\n`date()` 函数用于格式化日期和/或时间。\n\
  \n此函数将时间戳格式化为更易读的日期和时间。时间戳是一串字符，表示某一事件发生的日期和/或时间。\n\n###### 语法\n\n```php\ndate(format,\
  \ timestamp)\n```\n\n有 2 个参数：\n\n*   **format** - 这是一个必需参数。它指定时间戳的格式\n*   **timestamp**\
  \ - 这是一个可选参数，用于指定时间戳。默认为当前日期和时间\n\n###### 如何获取日期？\n\n以下是日期常用的一些字符：\n\n*   `d` -\
  \ 表示月份中的第几天（01 到 31）\n*   `m` - 表示月份（01 到 12）\n*   `Y` - 表示年份（四位数字）\n*   `l`（小写\
  \ 'L'） - 表示星期几\n\n其他字符，如 `/`、`.` 或 `-` 也可以插入字符之间以增加额外的格式。\n\n###### 如何获取时间？\n\n\
  以下是时间常用的一些字符：\n\n*   `H` - 小时的 24 小时制格式（00 到 23）\n*   `h` - 带前导零的 12 小时制格式（01 到\
  \ 12）\n*   `i` - 带前导零的分钟（00 到 59）\n*   `s` - 带前导零的秒（00 到 59）\n*   `a` - 小写的上午和下午（am\
  \ 或 pm）\n\n###### 如何指定时区？\n\nPHP `date()` 函数将返回服务器的当前日期/时间！服务器的时区是 UTC。\n\n因为我身处印度，我将使用\
  \ IST 时区！\n\n要指定时区，我们必须包含以下行：\n\n```php\ndate_default_timezone_set(\"Asia/Kolkata\"\
  );\n```\n\n####### 参考\n\n通过从下面的链接选择您的大陆，查看各个国家的时区：\n\n<https://www.php.net/manual/en/timezones.php>\n\
  \n###### 练习：日期/时间函数\n\n我们将以各种格式显示今天的日期。\n\n\n\n\n##### 日期/时间函数\n\n```php\n/* 日期/时间函数\
  \ */\n\n// 按服务器时间显示日期/时间\necho \"<br>dd-mm-yyyy 格式的日期: \" . date(\"d-m-Y\");\necho\
  \ \"<br>带星期的 dd-mm-yyyy 格式日期: \" . date(\"l, M d, Y\");\necho \"<br>带时间的默认日期格式:\
  \ \" . date(\"Y-m-d h:i:s a\");\necho \"<br>24 小时制日期格式: \" . date(\"d/m/y H:i:s\"\
  );\n\n// 按 IST 时区显示日期/时间\ndate_default_timezone_set(\"Asia/Kolkata\");\necho \"\
  <br>按 IST 时区的时间!\";\necho \"<br>带时间的默认日期格式: \" . date(\"Y-m-d h:i:s a\");\necho\
  \ \"<br>24 小时制日期格式: \" . date(\"d/m/y H:i:s\");\n```\n\n##### 执行\n\n首先，我们将按服务器的时间戳显示日期/时间。随后，我们将按\
  \ IST 时区显示，以检查时间差异！\n\n![2-4-5](img/image00168.jpeg)\n\n####### 如何使用可选参数创建时间？\n\n\
  `date()` 函数有一个可选参数。利用它，我们可以创建一个日期/时间并按指定格式显示。让我们学习如何操作：\n\n###### 语法\n\n```php\n\
  mktime(小时, 分钟, 秒, 月, 日, 年);\n```\n\n##### 实践\n\n```php\n// 创建一个日期\n$createdate =\
  \ mktime(10, 54, 06, 11, 23, 2020);\necho \"创建的日期是 23-11-2020 10:54:06 am: \" .\
  \ date(\"M d, Y H:i:s\", $createdate);\n```\n\n##### 执行\n\n![2-4-6](img/image00169.jpeg)\n\
  \n####### 如何从字符串创建日期？\n\n我们可以使用 `strtotime()` 函数从字符串创建日期。该函数用于将人类可读的日期字符串转换为 Unix\
  \ 时间戳（自 1970 年 1 月 1 日 00:00:00 GMT 以来的秒数）。\n\n###### 语法\n\n```php\nstrtotime(时间,\
  \ 现在)\n```\n\n##### 实践\n\n我们将通过各种示例来了解如何使用 `strtotime()` 函数。这将让你了解该函数的用途。\n\n```php\n\
  // 使用 strtotime() 函数（代码执行于 2020 年）\ndate_default_timezone_set(\"Asia/Kolkata\");\n\
  $today = strtotime(\"now\");\necho \"<br>字符串格式的今天日期: \" . $today;\necho \"<br>今天日期:\
  \ \" . date(\"l, M d Y, h:i:s A\", $today);\necho \"<br>从现在起 +5 小时: \" . date(\"\
  M d Y, h:i:s A\", strtotime(\"+5 hours\", $today));\necho \"<br>从现在起 +1 周: \" .\
  \ date(\"M d Y, h:i:s A\", strtotime(\"+1 week\", $today));\necho \"<br>下个周一: \"\
  \ . date(\"M d Y, h:i:s A\", strtotime(\"next Monday\", $today));\n```\n\n#####\
  \ 执行\n\n我们已使用 `strtotime()` 函数来处理日期相关查询。如果不使用时区，所有时间将采用 UTC 格式。只有获取系统时区时，你才能理解该函数的工作原理。\n\
  \n如果不使用 `date()` 函数格式化日期，`strtotime()` 的返回值将不可读。这就是为什么我们在每行代码中都包含了日期格式。为了展示日期/时间字符串的样子，我们仅以字符串格式打印了它（输出的第一行）。当字符串使用\
  \ `date()` 显示时，它将呈现为可读的日期。\n\n![2-4-7](img/image00170.jpeg)\n\n##### 注意\n\n以下是日期可采用的格式列表：\n\
  \n*   `d` - 月份中的第几天（01 到 31）\n*   `D` - 星期几的文本表示（三个字母）\n*   `j` - 不带前导零的月份中的第几天（1\
  \ 到 31）\n*   `l`（小写 'L'） - 星期几的完整文本表示\n*   `N` - 星期几的 ISO-8601 数字表示（1 代表周一，7 代表周日）\n\
  *   `S` - 月份中日期的英文序数后缀（2 个字符：st, nd, rd 或 th。配合 `j` 使用效果佳）\n*   `w` - 星期几的数字表示（0\
  \ 代表周日，6 代表周六）\n*   `z` - 年份中的第几天（0 到 365）\n*   `W` - 年份的 ISO-8601 周数（周以周一开始）\n\
  *   `F` - 月份的完整文本表示（January 到 December）\n*   `m` - 月份的数字表示（01 到 12）\n*   `M` - 月份的简短文本表示（三个字母）\n\
  *   `n` - 不带前导零的月份数字表示（1 到 12）\n*   `t` - 给定月份的天数\n*   `L` - 是否为闰年（1 表示是闰年，0 表示否）\n\
  *   `W` - ISO-8601 年份数\n*   `Y` - 年份的四位数字表示\n*   `y` - 年份的两位数字表示\n*   `a` - 小写的\
  \ am 或 pm\n*   `A` - 大写的 AM 或 PM\n*   `B` - Swatch Internet Time（000 到 999）\n* \
  \  `g` - 12 小时制的小时（1 到 12）\n*   `G` - 24 小时制的小时（0 到 23）\n*   `h` - 12 小时制的小时（01\
  \ 到 12）\n*   `H` - 24 小时制的小时（00 到 23）\n*   `i` - 带前导零的分钟（00 到 59）\n*   `s` - 秒，带前导零（00\
  \ 到 59）\n*   `u` - 微秒（PHP 5.2.2 新增）\n*   `e` - 时区标识符（示例：UTC, GMT, Atlantic/Azores）\n\
  *   `I`（大写 i） - 日期是否处于夏令时（1 表示夏令时，0 表示否）\n*   `O` - 与格林威治时间 (GMT) 的差值（小时）（示例：+0100）\n\
  *   `P` - 与格林威治时间 (GMT) 的差值（小时:分钟）（PHP 5.1.3 新增）\n*   `T` - 时区缩写（示例：EST, MDT）\n\
  *   `Z` - 时区偏移量（秒）。UTC 以西时区的偏移量为负（-43200 到 50400）\n*   `c` - ISO-8601 日期（例如：2013-05-05T16:34:42+00:00）\n\
  *   `r` - RFC 2822 格式的日期（例如：Fri, 12 Apr 2013 12:01:05 +0200）\n*   `U` - 自 Unix 纪元（1970\
  \ 年 1 月 1 日 00:00:00 GMT）以来的秒数\n\n以下预定义常量也可使用（自 PHP 5.1.0 起可用）：\n\n*   `DATE_ATOM`\
  \ - Atom（示例：2013-04-12T15:52:01+00:00）\n*   `DATE_COOKIE` - HTTP Cookies（示例：Friday,\
  \ 12-Apr-13 15:52:01 UTC）\n*   `DATE_ISO8601` - ISO-8601（示例：2013-04-12T15:52:01+0000）\n\
  *   `DATE_RFC822` - RFC 822（示例：Fri, 12 Apr 13 15:52:01 +0000）\n*   `DATE_RFC850`\
  \ - RFC 850（示例：Friday, 12-Apr-13 15:52:01 UTC）\n*   `DATE_RFC1036` - RFC 1036（示例：Fri,\
  \ 12 Apr 13 15:52:01 +0000）\n*   `DATE_RFC1123` - RFC 1123（示例：Fri, 12 Apr 2013 15:52:01\
  \ +0000）\n*   `DATE_RFC2822` - RFC 2822（Fri, 12 Apr 2013 15:52:01 +0000）\n*   `DATE_RFC3339`\
  \ - 同 `DATE_ATOM`（自 PHP 5.1.3 起）\n*   `DATE_RSS` - RSS（Fri, 12 Aug 2013 15:52:01\
  \ +0000）\n*   `DATE_W3C` - 万维网联盟（示例：2013-04-12T15:52:01+00:00）\n\n至此，这场漫长的讨论告一段落！\n\
  \n---\n\n#### 2.5 数组\n\n---\n\n数组是一种变量，可同时存放多个值。数组可在单一名称下存放多个值，你可以通过引用索引编号来访问这些值。\n\
  \n##### 数组类型\n\n在 PHP 中，有三种类型的数组：\n\n*   **索引数组** - 带有数字索引的数组\n*   **关联数组** - 带有字符串索引的数组（称为键）\n\
  *   **多维数组** - 包含一个或多个数组的数组，通过多个索引访问\n\n##### 示例\n\n假设，一名学生完成了 5 次测试并获得了分数。\n\n\
  我们创建一个名为 `$scores` 的变量。要存储 5 次测试的分数，我们将它们分别存放在 `$scores[0]`、`$scores[1]`、`$scores[2]`、`$scores[3]`\
  \ 和 `$scores[4]` 中。\n\n方括号内的数字称为索引。索引通常从 0 开始，直到数组大小减 1 为止。也就是说，如果你有 5 次测试，索引将从\
  \ 0 到 4，总共计 5 个。\n\n这是一个索引数组的示例。\n\n假设，该学生进行了 10 次测试。我们仅计算其中 5 次选定测试的分数。我们不知道这些测试的索引编号。在这种情况下，我们使用如下数组：\n\
  \n`$scores['test1']`、`$scores['test4']`、`$scores['test5']`、`$scores['test7']` 和\
  \ `$scores['test10']`\n\n数量仍然是 5 个测试分数。这里，索引是字符串。`$scores` 的索引为 test1、test4、test5、test7、test10。\n\
  \n这是一个关联数组的示例。\n\n假设，每次测试有 3 次尝试，索引为 0、1、2。0 表示第一次尝试，1 表示第二次尝试，2 表示第三次尝试。我们有一个如下数组：\n\
  \n`$scores['test1'][0]`、`$scores['test1'][1]`、`$scores['test1'][2]`\n`$scores['test4'][0]`、`$scores['test4'][1]`、`$scores['test4'][2]`\n\
  `$scores['test5'][0]`、`$scores['test5'][1]`、`$scores['test5'][2]`\n`$scores['test7'][0]`、`$scores['test7'][1]`、`$scores['test7'][2]`\n\
  `$scores['test10'][0]`、`$scores['test10'][1]`、`$scores['test10'][2]`\n\n\n\n计数为\
  \ `5*3 => 5 个测试 * 每个测试 3 次尝试 = 15`\n\n这是一个多维数组的示例。\n\n索引可以是数字或字符串。我们对第一维使用了字符串索引，对第二维使用了数字索引。因为我们只用了两个维度，所以也可以称之为二维数组。\n\
  \n###### 语法\n\n`array()` 函数用于创建数组。\n\n##### 实践\n\n现在我们将根据上述示例编写代码来创建所有三种类型的数组。\n\
  \n我们将创建三个变量 `$scores1`、`$scores2`、`$scores3` 来表示这三种类型。\n\n```php\n//Arrays\n\n//声明稍后使用的数组\n\
  $scores = array();\n\n//索引数组\n$scores1 = array(56, 57, 59, 65, 74);\necho \"Printing\
  \ indexed array: &emsp;\";\necho $scores1[0].\"&nbsp;\";\necho $scores1[1].\"&nbsp;\"\
  ;\necho $scores1[2].\"&nbsp;\";\necho $scores1[3].\"&nbsp;\";\necho $scores1[4].\"\
  &nbsp;\";\necho \"<br>\";\n\n//关联数组\n$scores2 = array(\"test1\"=>56, \"test4\"=>57,\
  \ \"test5\"=>59);\n$scores2['test7'] = 65;\n$scores2['test10'] = 74;\necho \"Printing\
  \ associative array: &emsp;\";\necho $scores2['test1'].\"&nbsp;\";\necho $scores2['test4'].\"\
  &nbsp;\";\necho $scores2['test5'].\"&nbsp;\";\necho $scores2['test7'].\"&nbsp;\"\
  ;\necho $scores2['test10'].\"&nbsp;\";\necho \"<br>\";\n\n//多维数组\n$scores3 = array(\"\
  test1\" => array(53,54,56), \"test4\" => array(51,56,57));\n$scores3['test5'][0]\
  \ = 45;\n$scores3['test5'][1] = 55;\n$scores3['test5'][2] = 59;\n$scores3['test7']\
  \ = array(61,63,65);\n$scores3['test10'] = array(71,72,74);\necho \"Printing 2-D\
  \ array: <br>\";\necho \"Test 1 - All Attempts =\".$scores3['test1'][0].\"&emsp;\"\
  .$scores3['test1'][1].\"&emsp;\".$scores3['test1'][2];\necho \"<br>Test 1 Attempt\
  \ 1 = \".$scores3['test1'][0];\necho \"<br>Test 1 Attempt 3 = \".$scores3['test1'][2];\n\
  ```\n\n##### 执行\n\n你可以尝试打印二维数组的不同索引以获得更清晰的认识！\n\n![2-5-1](img/image00171.jpeg)\n\
  \n你可能会觉得这种遍历数组的方式很困难。在下一章讨论循环时，我们将再次使用数组。在那里，我们将使用循环遍历数组，你会发现它们好用得多。\n\n##### 数组的内置函数\n\
  \n我们将在此讨论数组的两个内置函数：\n\n###### 数组的长度\n\n`count()` 函数用于返回数组的长度（元素的数量）。\n\n##### 实践\n\
  \n```php\n//声明数组\n$scores = array();\n$scores1 = array(56, 57, 59, 65, 74);\n$scores2\
  \ = array(\"test1\" => 56, \"test4\" => 57, \"test5\" => 59, \"test7\" => 65, \"\
  test10\" => 74);\n$scores3 = array(\"test1\" => array(53,54,56), \"test4\" => array(51,56,57),\
  \ \"test5\" => array(45,55,59), \"test7\" => array(61,63,65), \"test10\" => array(71,72,74));\n\
  \n//数组长度/大小\necho \"<br>Size of $scores = \".count($scores);\necho \"<br>Size of\
  \ $scores1 = \".count($scores1);\necho \"<br>Size of $scores2 = \".count($scores2);\n\
  echo \"<br>Size of $scores3 = \".count($scores3);\necho \"<br> Size of $scores3\
  \ test1's attempts - \".count($scores3['test1']);\n```\n\n##### 执行\n\n我们在一个地方声明了上述示例集中的所有数组。我们在所有\
  \ 4 个数组上执行 `count` 函数。\n\n*   空数组 `$scores` 返回 0。\n*   `$scores1`、`$scores2`、`$scores3`\
  \ 返回 5。\n*   在 `$scores3` 中，仅计算了数组第一维的大小。要获取第二维索引的计数，我们需要在 `count` 函数中指定第一维索引。\n\
  \n![2-5-2](img/image00172.jpeg)\n\n###### 数组排序\n\n数组中的元素可以按字母顺序或数字顺序、降序或升序进行排序。\n\
  \n在 PHP 中，我们有以下排序函数：\n\n*   `sort()` - 以升序对数组排序\n*   `rsort()` - 以降序对数组排序\n*   `asort()`\
  \ - 根据值以升序对关联数组排序\n*   `ksort()` - 根据键以升序对关联数组排序\n*   `arsort()` - 根据值以降序对关联数组排序\n\
  *   `krsort()` - 根据键以降序对关联数组排序\n\n##### 实践\n\n我们的所有值已经是升序了，这里我们只能尝试降序！\n\n```php\n\
  //声明数组\n$scores = array();\n$scores1 = array(56, 57, 59, 65, 74);\n$scores2 = array(\"\
  test1\"=>56, \"test4\"=>57, \"test5\"=>59, \"test7\" => 65, \"test10\" => 74);\n\
  \n//对索引数组排序\necho \"<br>Printing $scores1 - \".$scores1[0].\"&nbsp;\".$scores1[1].\"\
  &nbsp;\".$scores1[2].\"&nbsp;\".$scores1[3].\"&nbsp;\".$scores1[4];\nrsort($scores1);\n\
  echo \"<br>Printing after sorting $scores1 - \".$scores1[0].\"&nbsp;\".$scores1[1].\"\
  &nbsp;\".$scores1[2].\"&nbsp;\".$scores1[3].\"&nbsp;\".$scores1[4];\n\necho \"<br><br>Printing\
  \ $scores2 <br>\";\nvar_dump($scores2);\n\n//按值对关联数组排序\narsort($scores2);\necho\
  \ \"<br><br>Printing $scores2 after sorting by values: <br>\";\nvar_dump($scores2);\n\
  \n//按键对关联数组排序\nkrsort($scores2);\necho \"<br><br>Printing $scores2 after sorting\
  \ by keys: <br>\";\nvar_dump($scores2);\n```\n\n##### 执行\n\n我们使用 `var_dump()` 函数来获取排序后数组的值，\n\
  \n在对 `$scores2` 排序时，\n\n*   使用 `arsort()` 函数时，数组按值的降序排序。\n*   使用 `krsort()` 函数时，数组按键的降序排序。\n\
  \n![2-5-3](img/image00173.jpeg)\n\n至此，关于数组的讨论结束！\n\n---\n\n#### 2.6 用户自定义函数 - I\n\
  \n---\n\n除了 PHP 内置函数外，还可以创建自己的函数。\n\n*   函数是一组语句块，可以在程序中重复使用。\n*   页面加载时，函数不会自动执行。\n\
  *   函数通过调用函数来执行。\n\n##### 如何创建（用户自定义）函数？\n\n用户自定义函数使用关键字 `function` 声明。\n\n######\
  \ 语法\n\n```php\nfunction function_name(){\n   code to be executed;\n}\n```\n\n函数名必须以字母或下划线开头。函数名**不**区分大小写。务必选择一个能反映函数功能的名称！名称应切合用途！\n\
  \n##### 函数参数\n\n信息可以通过参数传递给函数。参数就像一个变量。\n\n参数在函数名后的括号内指定。你可以添加任意数量的参数，只需用逗号分隔即可。\n\
  \n##### 实践\n\n我们现在将看两个函数：\n\n```php\n//用户自定义函数\n\nfunction print_message(){\n echo\
  \ \"<p>Message printed from the function</p>\";\n}\n\nfunction print_message_string($str){\n\
  \ echo $str;\n}\n\nprint_message();\nprint_message_string(\"Printing from arguments\"\
  );\n```\n\n##### 执行\n\n我们打印了两条语句。第一条语句由 `print_message()` 函数打印。第二条语句作为参数传递给 `print_message_string($string)`\
  \ 函数。\n\n![2-6-1](img/image00174.jpeg)\n\n在上面的示例集中，我们不必告诉 PHP 变量是什么数据类型。PHP 会根据变量的值自动关联数据类型。由于数据类型不是严格意义上设定的，你可以做一些像将字符串添加到整数中而不引起错误的事情。\n\
  \n##### 类型声明\n\n在 PHP 7 中，添加了类型声明。这给了我们一个选项，在声明函数时指定预期的数据类型，并且通过添加严格声明，如果数据类型不匹配，将抛出“致命错误”。\n\
  \n要指定严格模式，我们需要设置：\n\n```php\ndeclare(strict_types=1);\n```\n\n它必须指定在文件的**第一行**。\n\
  \n现在尝试此代码片段：\n\n```php\ndeclare(strict_types=1);\nfunction print_message_string(int\
  \ $str){\n echo $str;\n}\nprint_message_string(\"Hello\");\n```\n\n你将收到如下致命错误：\n\
  \n![26-2](img/image00175.jpeg)\n\n尝试将函数调用替换为：\n\n```php\nprint_message_string(10);\n\
  ```\n\n输出将打印 10。\n\n希望你能理解限制参数数据类型！\n\n参数和形参意思相同。\n\n##### 何时应使用“参数”和“实参”术语？\n\n\
  *   **形参**：函数定义\n*   **实参**：函数调用\n\n\n\n\n##### 参数的默认值\n\n你也可以指定参数的默认值。\n\n当函数调用时未传递参数，将使用默认值。如果传递了参数，则使用传递的值。\n\
  \n请看下面的运行示例：\n\n```php\ndeclare(strict_types=1);\nfunction print_message_string(int\
  \ $str = 10){\n echo \"<br>\".$str;\n}\nprint_message_string();\nprint_message_string(50);\n\
  ```\n\n![2-6-3](img/image00176.jpeg)\n\n未传递参数时，输出 10。传递 50 时，输出 50。\n\n##### 返回值\n\
  \n函数在执行结束时也可以返回一个值。我们需要使用 `return` 语句。\n\nPHP 7 也支持 `return` 语句的类型声明。类似于函数参数的类型声明，启用严格模式后，类型不匹配将抛出“致命错误”。\n\
  \n要为函数返回值声明类型，在声明函数时，在右大括号（`{`）之前添加冒号（`:`）和类型。\n\n我们将通过一组示例来演示！\n\n```php\ndeclare(strict_types=1);\n\
  function sum_number(float $a, float $b){\n return ($a + $b);\n}\nfunction sum_number2(float\
  \ $a, float $b) : float{\n return ($a + $b);\n}\nfunction sum_number3(float $a,\
  \ float $b) : int{\n return ($a + $b);\n}\necho \"<br> Return value = \".sum_number(5,10);\n\
  echo \"<br> Return strict value = \".sum_number2(5,10);\n```\n\n我们将只调用前两个函数：\n\n\
  ![2-6-4](img/image00177.jpeg)\n\n现在，调用第三个函数：\n\n```php\necho sum_number3(5,10);\n\
  ```\n\n![2-6-5](img/image00178.jpeg)\n\n将抛出致命错误，因为两个浮点数相加的结果应为浮点数，而非整数。无论你如何传递参数，返回类型必须匹配！\n\
  \n##### 按引用传递参数\n\n在 PHP 中，参数通常按值传递，这意味着函数内部使用的是值的副本，传入函数的变量无法被修改。\n\n当函数参数按引用传递时，对参数的修改也会改变传入变量的值。要将函数参数变为引用，需使用\
  \ `&` 操作符。\n\n让我们通过一个示例来看看区别：\n\n```php\nfunction sum_number($a, $b){\n $a = $a\
  \ + $b;\n return $a;\n}\nfunction sum_number_ref(&$a, $b){\n $a = $a + $b;\n return\
  \ $a;\n}\n\n$a = 5;\n$b = 10;\necho \"<br>Passing by Value: <br>\";\necho \"<br>Before\
  \ Sum: $a = \".$a.\" $b = \".$b. \" Sum = \".sum_number($a,$b);\necho \"<br> After\
  \ Sum:  $a = \".$a.\" $b = \".$b;\necho \"<br><br>Passing by Reference: <br>\";\n\
  echo \"<br>Before Sum: $a = \".$a.\" $b = \".$b. \" Sum = \".sum_number_ref($a,$b);\n\
  echo \"<br> After Sum:  $a = \".$a.\" $b = \".$b;\n```\n\n![2-6-6](img/image00179.jpeg)\n\
  \n在第二个函数 `sum_number_ref()` 中，参数 `$a` 按引用传递，用 `&$a` 表示。这意味着，一旦 `$a` 被更新，即使函数执行结束，它仍保留该值。\n\
  \n而在函数 `sum_number()` 中，参数仅按值传递，无论内部发生什么计算，都只属于函数内部，函数结束后即销毁！\n\n---\n\n#### 2.7\
  \ 用户定义函数 - II\n\n---\n\n这是讨论变量作用域的合适语境。让我提醒一下各作用域：\n\n**全局** - 在函数外部声明的变量具有**全局作用域**，只能在函数外部访问。\n\
  \n**局部** - 在函数内部声明的变量具有**局部作用域**，只能在该函数内部访问。\n\n**静态** - 函数执行结束后不会被删除的局部变量。\n\n\
  让我们看一个例子！\n\n考虑以下代码片段：\n\n```php\n$x = 10;\nfunction print_x(){\n echo \"<br>Printing\
  \ from function - \".$x;\n}\nprint_x();\necho \"<br>Printing outside function -\
  \ \".$x;\n```\n\n这里，变量 `$x` 定义在全局。因此，它可以在函数外部访问。\n\n![2-7-1](img/image00180.jpeg)\n\
  \n##### 全局\n\n`global` 关键字用于在函数内部访问全局变量。\n\nPHP 还将所有全局变量存储在一个名为 `$GLOBALS[index]`\
  \ 的数组中。索引保存变量的名称。该数组也可以在函数内部访问，并可用于直接更新全局变量。\n\n##### 局部\n\n你可以在不同的函数中拥有同名的局部变量，因为局部变量只能被声明它们的函数识别。\n\
  \n##### 静态\n\n通常，当函数完成/执行后，其所有变量都会被删除。然而，有时我们希望局部变量**不**被删除。我们需要它留待后用。\n\n这样，每次调用函数时，该变量仍将保留上次函数调用时包含的信息。但该变量仍然是函数的局部变量。\n\
  \n现在，我们将看一个包含所有三种作用域的示例！\n\n###### 练习\n\n```php\n//Scopes of variables - global,\
  \ local, static\n$x = 5;\n$y = 10;\n\nfunction add_num(){\n  global $x, $y;\n  $z\
  \ = $x + $y;\n  return $z;\n}\n\nfunction add_static(){\n  static $m;\n  $m = $m\
  \ + ($GLOBALS['x'] + $GLOBALS['y']);\n  return $m;\n}\n\necho \"<br> Sum using global\
  \ x,y = \".add_num();\necho \"<br> Sum using global index = \".add_nums();\necho\
  \ \"<br> Accessing local variable z: \".$z;\necho \"<br> Addition 1 - \".add_static();\n\
  echo \"<br> Addition 2 - \".add_static();\necho \"<br> Addition 3 - \".add_static();\n\
  ```\n\n##### 执行\n\n我们尝试了使用 `global` 关键字和 `$GLOBALS[index]` 访问全局变量。同时，当在函数外部访问局部变量\
  \ `$z` 时，PHP 会发出一个提示。\n\n如果考虑静态变量 `$m`，`$m` 的值会被保留，并在函数再次调用时累加。我们调用了该函数三次！\n\n*\
  \   首次调用将 `$m` 设为 `0` 并赋值为 15。\n*   第二次调用将保留之前的值 15 并将其加到 `$m`（此时为 15）上，使其变为 30。\n\
  *   第三次调用将 15 加到已为 30 的 `$m` 上，使其变为 45。\n\n让我演算一下：\n\n**第一次调用：**\n\n`$m = 0;`\n\n\
  `$m = 0 + (5+10) = 15`\n\n**第二次调用：**\n\n`$m = 15;`\n\n`$m = 15 + (5 + 10) = 30`\n\
  \n**第三次调用：**\n\n`$m = 30;`\n\n`$m = 30 + (5 + 10) = 45;`\n\n![2-7-2](img/image00181.jpeg)\n\
  \n##### 回调函数\n\n回调函数是作为参数传递给另一个函数的函数。\n\n任何现有函数都可以用作回调函数。要使用函数作为回调函数，将包含函数名称的字符串作为参数传递给另一个函数。\n\
  \n从版本 7 开始，PHP 可以将匿名函数作为回调函数传递。匿名函数是未预先声明或定义的函数！\n\n考虑以下代码片段：\n\n```php\n//Callbacks\n\
  function get_size($str){\n return strlen($str);\n}\n$str_array = [\"PHP\",\"Server-side\"\
  ,\"Scripting\"];\n$str_size = array_map(\"get_size\",$str_array);\nprint_r($str_size);\n\
  \n//anonymous function\n$str_size2 = array_map(function($str) { return strlen($str);\
  \ },$str_array);\necho \"<p>Using anonymous function</p>\";\nprint_r($str_size);\n\
  ```\n\n这些函数的功能相同，但展示了不同的使用方式。\n\n![](img/image00182.jpeg)\n\n##### 如何在用户定义函数中使用回调？\n\
  \n用户定义的函数和方法也可以接受回调函数作为参数。要在用户定义的函数或方法内部使用回调函数，通过给变量添加括号来调用它，并像普通函数一样传递参数。\n\n让我们通过一个例子来理解！\n\
  \n```php\n//Callbacks\n\nfunction purpose($str){\n return $str.\"is used to design\
  \ web pages!<br>\";\n}\nfunction explain($str){\n return $str.\"is a server-side\
  \ scripting language!<br>\";\n}\nfunction what_is_php($str,$callfunction){\n echo\
  \ $callfunction($str);\n}\n\nwhat_is_php(\"PHP \", \"explain\");\nwhat_is_php(\"\
  PHP \",\"purpose\");\n```\n\n让我先解释一下这个例子！\n\n我们定义了两个函数 - `purpose` 和 `explain` 来显示一些消息。我们定义了第三个函数\
  \ `what_is_php` 将上述两个函数中的任意一个作为其参数传入。\n\n`purpose($str)` => `$str` 是参数\n\n`explain($str)`\
  \ => `$str` 是参数\n\n\n\n\nwhat\\_is\\_php(`$str`, `$callfunction`) => `$str` 是传递给函数的参数，`$callfunction`\
  \ 是接收该参数的函数名称！\n\n请看输出结果！\n\n![](img/image00183.jpeg)\n\nPHP 是通过 `$str` 变量提供给 `explain`\
  \ 和 `purpose` 函数的参数！还请记住，前两个函数只是返回字符串，而第三个函数才是真正包含 `echo` 语句、用于打印前两个函数返回字符串的函数。\n\
  \n***\n\n我们有东西要讨论！通常函数不必放在同一个 PHP 文件中。它们可以写在另一个 php 文件中，然后包含在你实际想要使用的页面中！\n\n明白我的意思了吗？函数可以单独定义，并在需要的地方/时间包含进来！\n\
  \n我们现在将讨论两个用于此目的的语句！\n\n**Include / Require（包含/引入）：**\n\n**include** 或 **require**\
  \ 语句会获取指定文件中存在的所有文本/代码/标记，并将其复制到使用 include 语句的文件中。\n\n当你想在网站的多个页面上包含相同的 PHP、HTML\
  \ 或文本时，包含文件非常有用。\n\n可以使用 **include** 或 **require** 语句将一个 PHP 文件的内容插入到另一个 PHP 文件中（在服务器执行之前）。\n\
  \n这两个语句完全相同，除了失败时的表现不同：\n\n*   **require** 会产生一个致命错误（`E_COMPILE_ERROR`）并停止脚本执行\n\
  *   **include** 只会产生一个警告（`E_WARNING`），脚本将继续执行\n\n因此，如果你希望即使包含的文件丢失，执行仍能继续并向用户显示输出，请使用\
  \ include 语句。对于执行流程所需的关键文件，请始终使用 require 语句。这有助于避免应用程序的安全性和完整性受到损害，以防某个关键文件意外丢失。\n\
  \n**语法：**\n\n```\ninclude 'filename';\nor\nrequire 'filename';\n```\n\n**实践：**\n\
  \n现在创建 2 个 php 文件：`file1.php` 和 `file2.php`\n\n`file1.php` 的内容：\n\n```\n<?php\n\
  function print_name($name){\n echo \"Name of the course: \".$name;\n}\n?>\n```\n\
  \n`file2.php` 的内容：\n\n```\n<?php\necho \"Try accessing function \";\nprint_name(\"\
  PHP Scripting\");\n?>\n```\n\n**执行：**\n\n尝试执行 `file2.php`：\n\n会报致命错误，提示函数名未定义\n\n\
  ![2-7-5](img/image00184.jpeg)\n\n**修改代码：file2.php**\n\n确保 `file1.php` 和 `file2.php`\
  \ 在同一位置！再次保存 `file2.php`！\n\n```\n<?php\ninclude('file1.php');\necho \"<br>Try accessing\
  \ function after include\";\nprint_name(\"PHP Scripting\");\n?>\n```\n\n尝试执行 `file2.php`：\n\
  \n![2-7-6](img/image00185.jpeg)\n\n你也可以尝试使用 require 语句执行。\n\n**提示：**\n\n*   当文件是应用程序所需时，使用\
  \ require。\n*   当文件不是必需的，且即使找不到文件应用程序也应继续运行时，使用 include。\n\n开发应用程序时，你可以将所有用户定义的函数放在一个\
  \ php 文件中，然后在需要调用其中任何函数的页面中使用它。\n\n***\n\n#### 2.8 Constants（常量）\n\n***\n\n常量是一个简单值的标识符（名称）。该值在脚本执行期间不能被改变。\n\
  \n*   默认情况下，常量区分大小写。\n*   按照惯例，常量标识符总是大写。\n*   常量名称以字母或下划线开头，后面跟任意数量的字母、数字或下划线。\n\
  *   如果你已定义一个常量，它就永远不能被更改或取消定义。\n*   与变量不同，常量在整个脚本中自动是全局的。\n*   常量只能包含标量数据（布尔值、整数、浮点数和字符串）。\n\
  \n**常量与变量的区别：**\n\n*   常量前不需要写美元符号（`$`），而变量必须写美元符号。\n*   常量不能通过简单赋值定义，只能使用 `define()`\
  \ 函数定义。\n*   常量可以在任何地方定义和访问，无需考虑变量作用域规则。\n*   一旦常量被设置，就不能被重新定义或取消定义。\n\n**语法**\n\
  \n要创建常量，请使用 `define()` 函数。\n\n```\ndefine(name, value, case-insensitive);\n```\n\
  \n参数：\n\n*   name：指定常量的名称\n*   value：指定常量的值\n*   case-insensitive：指定常量名称是否不区分大小写。默认为\
  \ false\n\n**实践：**\n\n现在，回到你一直在编码的 `section2.php`！关闭 `file1.php` 和 `file2.php`！\n\
  \n```\n//Constants\ndefine(\"PHPMARK\",75);\ndefine(\"SQLMARK\",70,true);\ndefine(\"\
  courses\",[\"PHP\",\"SQL\"]);\necho \"<br>PHP Mark - \".PHPMARK;\necho \"<br>SQL\
  \ Mark - \".SQLMARK;\necho \"<br>SQL Mark (case insensitive is true) - \".sqlmark;\n\
  echo \"<br>PHP Mark (case insensitive is false) - \".phpmark;\necho \"<br>Current\
  \ Course - \".courses[0];\n```\n\n**执行：**\n\n输出包含由 phpmark 用法触发的警告。\n\n实际上在创建 SQLMARK\
  \ 时，我们将第三个参数设为 true，这意味着该常量可以大写或小写引用，因为 case-insensitive 设置为 true！\n\n但 PHPMARK\
  \ 的第三个参数默认设为 false！\n\n![2-7-9](img/image00186.jpeg)\n\n**PHP 魔术常量：**\n\nPHP 为其运行的任何脚本提供了大量预定义常量。\n\
  \n有五个魔术常量会根据使用位置的不同而改变。例如，`__LINE__` 的值取决于它在脚本中的行号。这些特殊常量不区分大小写，如下所示：\n\n![2-8](img/image00187.jpeg)\n\
  \n我们将用 2 个常量为例来看看它们的作用：\n\n```\n//Magic Constants\n echo \"<p>Example for __FILE__</p>\"\
  ;    \n //print full path of file with .php extension    \n echo __FILE__ ; \n echo\
  \ \"<p>Example for __LINE__</p>\";    \n //print full path of file with .php extension\
  \    \n echo \"You are at Line number: \".__LINE__;  \n```\n\n![2-7-10](img/image00188.jpeg)\n\
  \n我的行号是 374，因为我注释掉了所有代码并将此片段放在最后！\n\n**请记住**：常量类似于变量，不同之处在于一旦定义，就不能更改或取消定义。\n\n\
  ***\n\n### Chapter 3: Conditionals and Loops（第 3 章：条件语句和循环）\n\n***\n\n*   3.1 Operators\n\
  *   3.2 Conditional Statements\n*   3.3 Loops\n*   3.4 Regular Expressions\n*  \
  \ 3.5 Exceptions\n\n***\n\n#### 3.1 Operators（运算符）\n\n***\n\n运算符用于对变量和值执行操作。\n\n\
  PHP 具有以下分类：\n\n*   算术运算符\n*   赋值运算符\n*   比较运算符\n*   自增/自减运算符\n*   逻辑运算符\n*   字符串运算符\n\
  *   数组运算符\n*   条件赋值运算符\n\n我们需要了解运算符，以便在条件语句和循环语句中使用它们！\n\n**Arithmetic Operators（算术运算符）：**\n\
  \n算术运算符用于数值，执行常见的算术运算。\n\n![3-1-arithmetic](img/image00189.jpeg)\n\n**Assignment\
  \ Operators（赋值运算符）：**\n\n赋值运算符用于数值，将值写入变量。PHP 中基本的赋值运算符是 `=`。这意味着左操作数被赋予右侧赋值表达式的值。\n\
  \n![3-1-assignment](img/image00190.jpeg)\n\n**Comparison Operators（比较运算符）：**\n\n\
  比较运算符用于比较两个值（数字或字符串）。\n\n![3-1-comparison](img/image00191.jpeg)\n\n**Increment /\
  \ Decrement Operators（自增/自减运算符）：**\n\n自增运算符用于增加变量的值，而自减运算符用于减少变量的值。运算符放在变量之前/之后决定了是返回增加/减少后的值，还是先返回值再增加/减少值。\n\
  \n![3-1-increment-decrement](img/image00192.jpeg)\n\n**Practice（实践）：**\n\n\n\n我们现在将练习这些运算符！希望你已经打开了一个名为\
  \ `section3.php` 的新文件。\n\n```php\n//Operators\n$x = 10;\n$y = 20;\necho \"<br>Values\
  \ of $x = \".$x.\" and $y = \".$y;\n\necho \"<br>Arithmetic Operators \";\necho\
  \ \"<br>Addition: $x + $y = \".($x + $y);\necho \"<br>Division: $y / $x = \".($y\
  \ / $x);\necho \"<br>Modulus: $y % $x = \".($y % $x);\n\necho \"<br><br>Assignment\
  \ Operators \";\n$x += $y;\necho \"Value of $x after $x += $y = \".$x;\n\necho \"\
  <br><br>Comparison Operators \";\necho \"<br>Values of $x = \".$x.\" and $y = \"\
  .$y;\necho \"<br> $x is greater than $y? \".($x > $y);\necho \"<br> Spaceship operator:\
  \ $x<=>$y \".($x <=> $y);\n$z1 = 55;\n$z2 = \"55\";\necho \"<br> $z1 is integer\
  \ 55 and $z2 is string 55\";\necho \"<br> Checking $z1 == $z2 Answer: \".($z1 ==\
  \ $z2);\necho \"<br> Checking $z1 === $z2 Answer: \".($z1 === $z2);\n\necho \"<br><br>Increment/Decrement\
  \ Operators\";\necho \"<br> $x Value: \".$x;\necho \"<br>Pre-increment ++$x = \"\
  .++$x;\necho \"<br>Post-increment $x++ = \".$x++;\necho \"<br> $x after post-increment:\
  \ \".$x;\n```\n\n**执行：**\n\n后置递增运算符返回变量 `$x` 的值，然后将其加一。这就是为什么 `$x` 的值保持为 31，随后的语句打印\
  \ `$x` 为 32 的原因。\n\n![3-1-1](img/image00193.jpeg)\n\n##### 逻辑运算符\n\n逻辑运算符用于组合条件语句。\n\
  \n![3-1-logical](img/image00194.jpeg)\n\n##### 字符串运算符\n\n专门有 2 个用于字符串的运算符。我们在 echo\
  \ 语句中已经见过其中一个了。\n\n![3-1-string](img/image00195.jpeg)\n\n##### 数组运算符\n\n它们用于比较数组。某些运算符与比较运算符类似。\n\
  \n![3-1-array](img/image00196.jpeg)\n\n##### 条件赋值运算符\n\n它们用于根据条件设置值。\n\n![3-1-conditional](img/image00197.jpeg)\n\
  \n###### 练习\n\n我们将练习下一组运算符。运算符的实际用法可以在本章即将到来的章节中找到。\n\n```php\n//Operators:\n$x\
  \ = 5;\n$y = 10;\necho \"<br>Values of $x = \".$x.\" and $y = \".$y;\n\necho \"\
  <br>Logical Operators \";\n$z1 = $x > $y;\n$z2 = $x < $y;\necho \"<br> Either of\
  \ z1 or z2 is true - \".($z1 or $z2);\n\n$test = ($x > $y) ? '$x is greater' : '$y\
  \ is greater';\necho \"<br><br>Ternary Operator: \".$test;\n\necho \"<br><br>String\
  \ Operators \";\n$str1 = \"Hello\";\n$str2 = \"World\";\necho \"<br> str1 - \".$str1.\"\
  \ str2 = \".$str2;\necho \"<br> Concatenation = \".$str1.\" \".$str2;\n$str1 .=\
  \ $str2;\necho \"<br> Concatenation assigned to str1 - \".$str1;\n\n$a = array(10,12,15);\n\
  $b = array(15,10,12);\necho \"<br><br>Array Operators:\";\necho \"<br>Checking $a\
  \ == $b - \".($a == $b);\n```\n\n**执行：**\n\n数组运算符将返回 false，因为数组 `$a` 和 `$b` 没有相同的索引（键），只有值相同！\n\
  \n也就是说，`$a[0]` = 10，`$a[1]` = 12，`$a[2]` = 15 而 `$b[0]` = 15，`$b[1]` = 10，`$b[2]`\
  \ = 12。\n\n这意味着，`$a[0]` != `$b[0]`，`$a[1]` != `$b[1]`，`$a[2]` != `$b[2]`。\n\n![3-1-2](img/image00198.jpeg)\n\
  \n我想你已经对运算符有了一些了解。下一节是关于条件语句的。我们将在这些语句中使用运算符！\n\n---\n\n#### 3.2 条件语句\n\n---\n\n\
  有时，你可能只希望在满足某个条件时才执行一组代码（代码块）。你可以在代码中使用条件语句来实现这一目的。\n\n**条件语句用于根据指定的条件执行操作。**\n\n\
  在 PHP 中，我们有以下条件语句：\n\n*   `if` 语句\n*   `if...else` 语句\n*   `if...elseif...else`\
  \ 语句\n*   `switch` 语句\n\n我们将先看这些语句的语法，然后进入实践环节。\n\n##### if 语句\n\n如果条件为真，则执行一个代码块。\n\
  \n**语法**\n\n```php\nif (condition) {\n  code to be executed if condition is true;\n\
  }\n```\n\n##### if...else 语句\n\n如果条件为真则执行一个代码块，如果条件为假则执行另一个代码块。\n\n**语法**\n\n```php\n\
  if (condition) {\n  code to be executed if condition is true;\n} else {\n  code\
  \ to be executed if condition is false;\n}\n```\n\n##### if...elseif...else 语句\n\
  \n为每个指定的条件执行不同的代码块。\n\n**语法**\n\n```php\nif (condition) {\n  code to be executed\
  \ if this condition is true;\n} elseif (condition) {\n  code to be executed if first\
  \ condition is false and this condition is true;\n} else {\n  code to be executed\
  \ if all conditions are false;\n}\n```\n\n###### 练习\n\n条件只不过是表达式罢了。\n\n```php\n\
  //Conditionals\n$x = 10;\n$y = 15;\n$z = 5;\nif($x > $y){\n echo \"x is greater\
  \ than y\";\n }\n elseif ($x > $z) {\n  echo \"x is greater than z\";\n }\n else\
  \ {\n  echo \"x is the least value\";\n}\n```\n\n**执行：**\n\n在上面的示例代码片段中，`$x` 不大于\
  \ `$y`，所以我们检查 `elseif` 条件，结果为真。因此，`elseif` 块内的语句被执行。\n\n尝试使用不同的 `$x` 值执行相同的代码，这样你就能清楚地理解条件是如何被满足的，以及相关的代码块是如何被执行的。\n\
  \n![3-2-1](img/image00199.jpeg)\n\n##### switch 语句\n\n我们使用 `switch` 语句来**从多个代码块中选择一个来执行**。实际上，它类似于\
  \ `if...elseif...else` 语句的执行，不同之处在于我们不是检查条件，而是检查表达式的结果。\n\n**语法**\n\n```php\nswitch\
  \ (n) {\n  case label1:\n    code to be executed if n=label1;\n    break;\n  case\
  \ label2:\n    code to be executed if n=label2;\n    break;\n  case label3:\n  \
  \  code to be executed if n=label3;\n    break;\n    ...\n  default:\n    code to\
  \ be executed if n is different from all labels;\n}\n```\n\n让我解释一下它的工作原理：\n\n* \
  \  我们有一个单一的表达式 `n`（通常是一个变量），它只被求值一次。\n*   然后将表达式的值与结构中每个 case 的值进行比较。\n*   如果匹配，则执行与该\
  \ case 关联的代码块。\n*   使用 `break` 可防止代码自动运行到下一个 case。\n*   如果你漏掉了 `break` 语句，匹配项之后的\
  \ case 将会被执行。\n*   如果未找到匹配项，则使用 `default` 语句。\n\n###### 练习\n\n```php\n$n = 80;\n\
  switch($n){\n  case $n > 90: echo \"Distinction\"; break;\n  case $n > 80: echo\
  \ \"First Class\"; break;\n  case $n > 70: echo \"Second Class\"; break;\n  case\
  \ $n < 40: echo \"Not completed\";break;\n  default: echo \"Completed Course\";\n\
  }\n```\n\n**执行：**\n\n我们将按原样执行代码！\n\n![3-2-2](img/image00200.jpeg)\n\n移除 `break`\
  \ 语句如下所示并执行：\n\n```php\ncase $n > 70: echo \"Second Class\";\n```\n\n![3-2-3](img/image00201.jpeg)\n\
  \n你能理解 `break` 语句的必要性吗？如果你不指定它，匹配的 case 之后的 case 将继续执行。当没有 case 匹配时会发生什么？`default`\
  \ case 会被执行！\n\n尝试将 `n` 的值改为 50，因为存在 `n > 70` 和 `n < 40` 的 case。\n\n```php\nn =\
  \ 50;\n```\n\n![3-2-4](img/image00202.jpeg)\n\n希望你已经清楚条件语句了。我们也称它们为分支语句，因为条件就像分支一样。当条件满足时，仅执行与该条件关联的分支代码。\n\
  \n---\n\n#### 3.3 循环语句\n\n---\n\n有时你希望同一代码块运行特定次数。你可以使用循环，而不是多次重复代码行。\n\n**只要指定的条件为真，循环就会反复执行同一代码块。**\n\
  \n在 PHP 中，我们有以下循环类型：\n\n*   `while`\n*   `do...while`\n*   `for`\n*   `foreach`\n\
  \n我们将查看每种循环的语法并进行练习。\n\n##### while 循环\n\n`while` 循环只要指定条件为真，就会执行一个代码块。\n\n**语法**\n\
  \n```php\nwhile (condition is true) {\n  code to be executed;\n}\n```\n\n一旦 `while`\
  \ 中的条件求值为真，大括号之间的代码就会被执行。如果条件求值为假，则不会执行代码块。\n\n###### 练习\n\n我们将计算 5 次测试成绩的总和！\n\n\
  *   5 次测试的成绩存储在 `$marks` 数组中。\n\n\n\n\n数组的大小存储在变量 `$n` 中。\n\n对于测试的计数，我们使用变量 `$i`。\n\
  \n我们还将初始化一个变量 `$sum` 来计算 5 次测试成绩的总和。\n\n```php\n//while 循环\n$i = 0;\n$marks = array(50,70,74,83,65);\n\
  $n = count($marks);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\nwhile($i <\
  \ $n){\n $sum = $sum + $marks[$i];\n echo \"<br> Value of i = \".$i;\n echo \" marks[$i]\
  \ = \".$marks[$i];\n echo \" Sum = \".$sum;\n $i++;\n}\n```\n\n**执行：**\n\n代码有什么作用？\n\
  \n*   我们声明一个数组 `$marks[]`\n*   我们初始化循环计数变量 `$i = 0`、数组大小变量 `$n = count($marks)`、求和变量\
  \ `$sum = 0`\n*   While 循环测试条件 `$i < $n`\n    *   我们打印 `$i`、`$marks[$i]` 和 `$sum`\
  \ 的值\n    *   每次迭代将 `$i` 增加 1。\n    *   循环执行直到 `$i < $n`。一旦 `$i = $n`，循环停止执行。\n\n\
  这是输出结果：\n\n![3-3-1](img/image00203.jpeg)\n\n##### do...while 循环\n\ndo...while 循环将始终执行一次代码块，然后它将检查条件，并在指定条件为真时重复循环。在这里，条件是在循环内的语句执行**之后**测试的。这意味着即使条件为假，循环也至少会执行一次其语句。\n\
  \n###### 语法\n\n```php\ndo {\t\n  要执行的代码;\n} while (条件为真);\n```\n\n#### 练习：\n\n我们现在将使用此循环重写相同的代码片段：\n\
  \n```php\n//do while 循环\n$i = 0;\n$marks = array(50,70,74,83,65);\n$n = count($marks);\n\
  $sum = 0;\necho \"Marks: \";\nvar_dump($marks);\ndo{\n $sum = $sum + $marks[$i];\n\
  \ echo \"<br> Value of i = \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \"\
  \ Sum = \".$sum;\n $i++;\n}while($i < $n);\n```\n\n执行上述代码时，您将获得与 while 循环相同的输出。我们重写相同代码的原因是为了告诉您执行是如何发生的以及条件是在哪里被检查的！\n\
  \n##### for 循环\n\n当您预先知道脚本应该运行多少次时，使用 for 循环。它的工作方式与其他两种循环类似，但我们如何指定增量计数器以及在哪里检查条件很重要！\n\
  \n###### 语法\n\n```php\nfor (初始化; 检查条件; 增量/减量) {\n  每次迭代要执行的代码;\n}\n```\n\n参数：\n\n\
  *   初始化循环计数器值\n*   检查每次循环迭代要评估的条件。如果评估为 TRUE，循环继续。如果评估为 FALSE，循环结束。\n*   增加或减少循环计数器值\n\
  \n#### 练习：\n\n不是为了让您厌烦，而是为了告诉您此循环如何工作，我们再次采用相同的示例！\n\n```php\n//for 循环\n$marks =\
  \ array(50,70,74,83,65);\n$n = count($marks);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\n\
  for($i = 0; $i < $n; $i++){\n $sum = $sum + $marks[$i];\n echo \"<br> Value of i\
  \ = \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \" Sum = \".$sum;\n}\n```\n\
  \n有一个小小的不同！我们不是在循环的代码块内部增加变量 `$i`，而是将其与初始化和测试条件一起增加。执行相同的代码，您将再次发现相同的输出！\n\n#####\
  \ foreach 循环\n\nforeach 循环仅适用于数组，用于遍历数组中的每个键/值对。\n\n###### 语法\n\n```php\nforeach\
  \ ($array as $value) {\n  要执行的代码;\n}\n```\n\n对于每次循环迭代，当前数组元素的值被赋给 `$value`，并且数组指针向后移动一位，直到到达最后一个数组元素。\n\
  \n#### 练习：\n\n同样，我们将采用相同的示例编码。这一次，我们不使用计数变量 `$i`，而是使用键/值对进行循环。请查看下面的代码：\n\n```php\n\
  //for each 循环\n$marks = array(50,70,74,83,65);\n$sum = 0;\n$i = 0;\necho \"Marks:\
  \ \";\nvar_dump($marks);\nforeach($marks as $mark){\n $sum = $sum + $mark;\n echo\
  \ \"<br> Value of i = \".$i++;\n echo \" marks[$i] = \".$mark;\n echo \" Sum = \"\
  .$sum;\n}\n```\n\n当您执行时，您将获得相同的输出。但是，您能看到遍历数组是多么容易吗？\n\n您不需要计数器，不需要增加/减少值，您只需将 `$marks`\
  \ 数组的每个数组元素作为一个名为 `$mark` 的单一值传递！在上面的代码中使用 `$i` 的目的是描述 `$mark` 变量如何从 `$marks` 数组中逐个获取值！当我们使用\
  \ foreach 循环时，根本不需要计数器变量！\n\n这就是为什么我从循环开始就尝试使用数组的原因。为了了解不同循环如何工作，我们需要使用相同的示例！通过为不同的循环执行相同的示例代码来学习，将使您更清楚地了解每个循环如何工作及其要求！\n\
  \n我们现在将看看在循环内部使用的两个语句：`break` 和 `continue`\n\n我将再次为这些语句选取相同的示例！\n\n##### Break\n\
  \n您已经见过 `break` 语句，它用于退出 switch 语句。同样，我们可以使用 `break` 语句跳出循环。\n\n#### 练习：\n\n我们有\
  \ `$marks` 数组。我们将找到第一个高于 80 的成绩。一旦找到，我们将退出循环。好吗？\n\n```php\n//break\n$marks = array(50,70,74,83,65);\n\
  $sum = 0;\necho \"Marks: \";\nvar_dump($marks);\nforeach($marks as $mark){\n if($mark\
  \ > 80) break;\n echo \"<br> Mark Value: \".$mark;\n $sum = $sum + $mark; \n echo\
  \ \" Sum = \".$sum;\n}\n```\n\n**执行：**\n\n当您尝试执行上述代码块时，成绩将累加到 74。一旦 `$mark > 80`，`break`\
  \ 语句将退出循环。\n\n![3-3-3](img/image00204.jpeg)\n\n如果您将 `break` 语句放在循环内代码块的末尾，83 也将被累加，只剩下\
  \ 65 被排除。\n\n##### Continue\n\n如果发生指定条件，`continue` 语句将中断循环中的**一次**迭代，并继续循环中的下一次迭代。\n\
  \n#### 练习：\n\n我们有值为 50,70,74,83,65 的 `$marks` 数组。我们将计算高于 60 的值的总和。为了排除 50，我们将使用\
  \ `continue` 语句。\n\n```php\n//continue\n$marks = array(50,70,74,83,65);\n$sum =\
  \ 0;\necho \"Marks: \";\nvar_dump($marks);\nforeach($marks as $mark){\n if($mark\
  \ < 60) continue;\n echo \"<br> Mark Value: \".$mark;\n $sum = $sum + $mark; \n\
  \ echo \" Sum = \".$sum;\n}\n```\n\n**执行：**\n\n当 `$mark < 60` 时，我们提到了 `continue`，这意味着循环应该继续下一次迭代。\n\
  \n![3-3-2](img/image00205.jpeg)\n\n现在您能理解 `break` 和 `continue` 之间的区别吗？\n\n`continue`\
  \ 语句继续循环迭代，跳过当前迭代，而 `break` 语句则彻底退出循环！\n\n---\n\n#### 3.4 正则表达式\n\n---\n\n正则表达式是形成搜索模式的字符序列。正则表达式可以是单个字符，也可以是更复杂的模式。正则表达式可用于执行所有类型的文本搜索和文本替换操作。\n\
  \n在 PHP 中，正则表达式是由以下部分组成的字符串：\n\n*   定界符，\n*   模式和\n*   可选修饰符。\n\n#### 定界符：\n\n定界符可以是任何非字母、数字、反斜杠或空格的字符。最常用的定界符是正斜杠\
  \ (`/`)，但当您的模式包含正斜杠时，选择其他定界符（如 `#` 或 `~`）会更方便。\n\n#### 模式：\n\n模式或搜索模式是我们用于搜索的字符序列。方括号用于查找字符范围：\n\
  \n![3-4-1-pattern](img/image00206.jpeg)\n\n**注意：**\n\n如果您的表达式需要搜索特殊字符之一，可以使用反斜杠\
  \ (`\\\\`) 进行转义。\n\n#### 修饰符：\n\n修饰符可以更改搜索的执行方式。\n\n![3-4-2-modifier](img/image00207.jpeg)\n\
  \n我们还可以在正则表达式中提及一些元字符和量词。\n\n##### 元字符\n\n元字符是具有特殊含义的字符。它们可以包含在搜索模式中。\n\n![3-4-3-metacharacter](img/image00208.jpeg)\n\
  \n##### 量词\n\n量词定义数量。这告诉搜索字符或搜索模式的出现次数。\n\n![3-4-4-quantifier](img/image00209.jpeg)\n\
  \n##### 分组\n\n\n\n##### 正则表达式函数\n\n您可以使用圆括号 `()` 将量词应用于整个模式。它们也可用于选择模式的部分内容以用作匹配。\n\
  \n我们将在何处以及如何使用这些正则表达式？我们有相应的函数来实现这一目的。我们将在这些函数中使用这些表达式。我们将在表达式中应用修饰符、量词，并将其作为函数参数使用。\n\
  \n让我直接向您展示一些函数，然后我们将进入实践环节。\n\nPHP 提供了多种函数，允许您使用正则表达式。\n\n![3-4-5-function](img/image00210.jpeg)\n\
  \n##### 实践\n\n我们将在此查看一些最常用的函数。我们将在示例中使用定界符、修饰符、量词！\n\n```php\n//正则表达式\n$str_array\
  \ = array(\"Hello World\",\"New World\",\"Welcome to New Course\", \"This is a new\
  \ course\",\"Hello is the first word tested\");\n\n//区分大小写的搜索\n$pattern1 = \"/New/\"\
  ;\necho \"<br>区分大小写的搜索模式: \".$pattern1;\nforeach ($str_array as $str){\n  echo \"\
  <br>字符串: \".$str.\" | 搜索结果 - \".preg_match($pattern1,$str);\n}\n\n//不区分大小写的搜索\n\
  $pattern2 = \"/New/i\";\necho \"<br><br>不区分大小写的搜索模式: \".$pattern2;\nforeach ($str_array\
  \ as $str){\n  echo \"<br>字符串: \".$str.\" | 搜索结果 - \".preg_match($pattern2,$str);\n\
  }\n\n$pattern3 = \"/is/i\";\necho \"<br><br>不区分大小写的搜索所有模式: \".$pattern3;\nforeach\
  \ ($str_array as $str){\n  echo \"<br>字符串: \".$str.\" | 搜索结果 - \".preg_match_all($pattern3,$str);\n\
  }\n\n$pattern4 = \"/world/i\";\necho \"<br><br>不区分大小写的替换模式: \".$pattern4;\nforeach\
  \ ($str_array as $str){\n  echo \"<br>字符串: \".$str.\" | 搜索结果 - \".preg_replace($pattern4,'universe',$str);\n\
  }\n\n//使用量词\n$pattern5 = \"/(l){2}/\";\necho \"<br><br>区分大小写的搜索所有模式: \".$pattern5;\n\
  foreach ($str_array as $str){\n  echo \"<br>字符串: \".$str.\" | 搜索结果 - \".preg_match($pattern5,$str);\n\
  }\n```\n\n在此示例代码片段中，我们使用了 5 个模式：\n\n*   `$pattern1 = \"/New/\";`\n*   `$pattern2\
  \ = \"/New/i\";`\n*   `$pattern3 = \"/is/i\";`\n*   `$pattern4 = \"/world/i\";`\n\
  *   `$pattern5 = \"/(l){2}/\";`\n\n让我们分析一下上述模式！\n\n*   此处使用的定界符是 `/`。这意味着定界符指定了模式字符串的开始和结束。\n\
  *   在末尾定界符旁边使用修饰符 `i` 将表明模式搜索应**不区分大小写**，这与默认的区分大小写搜索相反。\n*   最后一个模式使用量词指定字符 `l`\
  \ 应出现两次。\n\n##### 执行\n\n执行代码，尝试检查模式搜索的输出是否与您猜测的相同。\n\n![3-4](img/image00211.jpeg)\n\
  \n---\n\n#### 3.5 异常\n\n异常是一个描述 PHP 脚本错误或意外行为的对象。\n\n许多 PHP 内置函数/类以及用户定义的函数/类都会抛出异常。当函数遇到无法处理的数据时，异常是停止函数执行的一种好方法。\n\
  \n代码中可能存在某些位置，我们认为错误的输入可能会导致错误。对于普通用户来说，他们可能不知道如何处理输入。因此，当他们提供错误输入时，异常可以给出关于出了什么问题的适当提示。\n\
  \n由于本书不涵盖面向对象编程，我们将仅讨论与函数相关的异常。\n\n##### 异常对象\n\n异常对象包含有关函数遇到的错误或意外行为的信息。虽然这部分使用了对象，但我们将学习它以便在函数中使用。\n\
  \n我们有两个与异常相关的操作：\n\n*   **抛出异常** - 抛出信息表明发生了某些错误\n*   **捕获异常** - 说明异常是什么（提示发生了哪种错误）\n\
  \n###### 语法\n\n```php\nnew Exception(message, code, previous)\n```\n\n**参数：**\n\n\
  所有参数均为可选。\n\n*   `message` - 描述抛出异常原因的字符串\n*   `code` - 一个整数，可用于轻松区分此异常与其他同类型异常\n\
  *   `previous` - 如果此异常是在另一个异常的 catch 块中抛出的，建议将该异常传递给此参数\n\n##### 抛出异常\n\n`throw`\
  \ 语句允许用户定义的函数或方法抛出异常。当抛出异常时，其后的代码将不会被执行。\n\n如果异常未被捕获，将发生致命错误，并显示 \"Uncaught Exception\"\
  （未捕获的异常）消息。\n\n##### 实践\n\n我们现在将看一个使用异常的示例。这是一个使用异常的通用示例，以便每个人都能清楚地理解。\n\n我们将查看不抛出异常的代码片段：\n\
  \n```php\n//异常\nfunction divide($dividend,$divisor){\n\treturn ($dividend / $divisor);\n\
  }\n\necho \"<br>除法 10/5 = \".divide(10,5);\necho \"<br>除法 10/0 = \".divide(10,0);\n\
  ```\n\n![3-5-1](img/image00212.jpeg)\n\n您看到了吗？`10/0` 给出了 infinity（无穷大）。\n\n现在，我们将在代码中加入异常：\n\
  \n```php\n//异常\nfunction divide($dividend,$divisor){\n if($divisor == 0){\n\tthrow\
  \ new Exception(\"Division by zero\");\n }\n return ($dividend / $divisor);\n}\n\
  \necho \"<br>除法 10/5 = \".divide(10,5);\necho \"<br>除法 10/0 = \".divide(10,0);\n\
  ```\n\n现在，输出将是：\n\n![3-5-2](img/image00213.jpeg)\n\n当该异常发现变量 `$divisor` 的值为 0 时，它不允许函数返回任何值，从而也阻止了相关的\
  \ `echo` 语句被打印。\n\n对于使用您网页的普通用户来说，`INF` 可能不清楚，但错误消息将意味着他们的输入无效。这可能是一个小示例，因此不使用异常显示\
  \ `INF` 影响不大。此外，`INF` 值不会被进一步使用。但当您开发实时应用程序时，当一个输出被转发到程序的其他部分时，这就会变成大问题，有时会导致不受控制的循环。所以让我们练习使用异常。\n\
  \n现在，我们将看看 `catch` 语句。\n\n##### try...catch 语句\n\n为了避免上述示例中的错误，我们可以使用 `try...catch`\
  \ 语句来捕获异常并继续执行过程。\n\n###### 语法\n\n```php\ntry {\n  可能抛出异常的代码\n} catch(Exception\
  \ $ex) {\n  捕获异常时运行的代码\n}\n```\n\n`catch` 块指明应捕获哪种类型的异常以及可用于访问该异常的变量名。在上面的示例中，异常类型是\
  \ `Exception`，变量名是 `$ex`。\n\n##### 实践\n\n```php\n//异常\nfunction divide($dividend,$divisor){\n\
  \ if($divisor == 0){\n\tthrow new Exception(\"Division by zero\");\n }\n return\
  \ ($dividend / $divisor);\n}\n\necho \"<br>除法 10/5 = \".divide(10,5);\necho \"<br>除法\
  \ 10/0 = \";\ntry{\n  echo divide(10,0);\n}catch (Exception $ex){\n  echo \"Unable\
  \ to divide\";\n}\n```\n\n##### 执行\n\n![3-5-3](img/image00214.jpeg)\n\n##### try...catch...finally\
  \ 语句\n\n`try...catch...finally` 语句可用于捕获异常。无论是否捕获到异常，`finally` 块中的代码都将始终运行。如果存在 `finally`，则\
  \ `catch` 块是可选的。\n\n###### 语法\n\n```php\ntry {\n  可能抛出异常的代码\n} catch(Exception $e)\
  \ {\n  捕获异常时运行的代码\n} finally {\n  无论是否捕获异常始终运行的代码\n}\n```\n\n##### 实践\n\n我们将使用 `finally`\
  \ 重写相同的示例：\n\n```php\n//异常\nfunction divide($dividend,$divisor){\n if($divisor ==\
  \ 0){\n\tthrow new Exception(\"Division by zero\");\n }\n return ($dividend / $divisor);\n\
  }\n\necho \"<br>除法 10/5 = \".divide(10,5);\necho \"<br>除法 10/0 = \";\ntry{\n  echo\
  \ divide(10,0);\n}catch (Exception $ex){\n  echo \"Unable to divide\";\n}finally{\n\
  echo \"<br> End of Program\";\n}\n```\n\n##### 执行\n\n现在，我们将获得包含 `finally` 块中 echo\
  \ 语句的输出。\n\n![3-5-4](img/image00215.jpeg)\n\n##### 方法\n\n\n\n捕获异常时，下表展示了一些可用于获取异常信息的方法：\n\
  \n![3-5-methods](img/image00216.jpeg)\n\n**练习：**\n\n我们将结合上述讨论的方法，查看相同的编码示例。\n\n\
  希望你会产生一个疑问：如果 `try` 块被执行会发生什么？这个问题也将得到解答。\n\n```php\n//Exception\nfunction divide($dividend,$divisor){\n\
  \ if($divisor == 0){\n\tthrow new Exception(\"Division by zero\");\n }\n return\
  \ ($dividend / $divisor);\n}\n\ntry{\n  echo \"<br>Division 10/5 = \".divide(10,5);\n\
  }catch(Exception $ex){\n  echo \"No error in input\";\n}\n\necho \"<br>Division\
  \ 10/0 = \";\ntry{\n  echo divide(10,0);\n}catch (Exception $ex){\n  $code = $ex->getCode();\n\
  \  $message = $ex->getMessage();\n  $file = $ex->getFile();\n  $line = $ex->getLine();\n\
  \  echo \"Exception thrown in $file on line $line: [Code $code] $message\";\n}\n\
  ```\n\n**执行：**\n\n当 `try` 块被执行时，`catch` 块不会被执行。这类似于 `if...else` 语句的执行。两个块中只会有一个被执行！\n\
  \n希望你能理解：\n\n*   `$ex->getCode()` - 返回异常代码\n*   `$ex->getMessage()` - 从函数内部的 `Exception()`\
  \ 对象中获取消息\n*   `$ex->getFile()` - 获取抛出异常的完整文件路径\n*   `$ex->getLine()` - 获取抛出异常的行号（`Exception()`\
  \ 对象）\n\n![3-5-5](img/image00217.jpeg)\n\n如果你是新手程序员，你可能会觉得为什么要去处理这些异常。在学习和练习的语境下，你或许是对的。但在开发过程中，优秀的程序员应该定义好代码中所有可能的块，以便为最终用户避免不必要且不明确的错误。\n\
  \n希望当你开始从事实时应用开发时，会开始使用异常。\n\n---\n\n### 第 4 章：文件与表单\n\n---\n\n*   [](#part0025.xhtml)\n\
  \    #### 4.1 文件处理\n*   [](#part0026.xhtml)\n    #### 4.2 超全局变量\n*   [](#part0027.xhtml)\n\
  \    #### 4.3 表单操作\n*   [](#part0028.xhtml)\n    #### 4.4 表单验证\n*   [](#part0029.xhtml)\n\
  \    #### 4.5 文件上传\n\n---\n\n#### 4.1 文件处理\n\n---\n\n文件处理是 Web 应用程序的一个重要方面。本节介绍如何在服务器上操作文件。\n\
  \nPHP 拥有多个用于创建、打开、读取、上传和编辑文件的函数。\n\n**创建 / 打开文件：**\n\n在 PHP 中，要打开文件或将文件写入服务器，我们需要创建该文件。所有这些任务均由单个函数完成。这意味着：\n\
  \n*   当你创建时，需要打开；一旦打开，就需要将其写入服务器\n*   当你想将文件写入服务器时，显然必须打开它\n*   当你想打开一个文件时，它必须是已创建的或已存在的。\n\
  \n**函数：`fopen()`**\n\n如果对不存在的文件使用 `fopen()`，它将创建该文件，前提是该文件以写入 (`w`) 或追加 (`a`) 模式打开。写入意味着开始写入内容，而追加意味着向现有内容添加更多内容。\n\
  \n参数：\n\n`fopen(文件名, 打开模式);`\n\n我们来看看可用的各种模式：\n\n![4-1-filemodes](img/image00218.jpeg)\n\
  \n创建新文件时，需要使用 `w`。\n\n**练习：**\n\n希望你的新文件 `section4.php` 已创建并打开以供编辑。我们首先创建一个文件用于写入：\n\
  \n```php\n$testfile = fopen(\"test.txt\", \"w\");\n```\n\n执行后，你将在 `section4.php`\
  \ 所在的位置发现一个已创建的文本文件。\n\n创建了一个大小为 0 字节的新文件。该文本文档将没有内容。\n\n![4-1-1](img/image00219.jpeg)\n\
  \n**注意：** 如果尝试运行此代码时出现错误，请检查是否已授予 PHP 文件向硬盘写入信息的访问权限。\n\n*   要授予访问权限，右键点击文件夹 `PracticePHP`\
  \ => 属性 => 取消勾选“只读”\n*   转到“安全”选项卡 => 检查相应用户所需的权限\n\n你还记得第 2 节中的**资源数据类型**吗？\n\n\
  `$testfile` 属于资源数据类型——虽然不是实际类型，但它在此处持有一个资源，如文件。\n\n**向文件写入内容：**\n\n有一个函数 `fwrite()`\
  \ 可将内容写入文件。\n\n理解：\n\n*   当你打开一个文件时，该文件会被写入服务器\n*   但当你使用 `fwrite()` 写入时，意味着你正在向文件添加内容\n\
  \n希望你理解这两种“写入”的区别。当你打开文件时，你以写入模式打开，并将其指定为 `w`。而函数 `fwrite()` 则用于写入内容。\n\n有 2 个参数：\n\
  \n`fwrite(文件名, 要添加的内容);`\n\n**练习：**\n\n我们将向文件添加几个字符串字符：继续在同一个 `section4.php` 中编码：\n\
  \n```php\n$texttoadd = \"First Line of Text followed by new line character! \";\n\
  fwrite($testfile,$texttoadd);\n$texttoadd = \"Second Line of Text followed by new\
  \ line character! \";\nfwrite($testfile,$texttoadd);\n```\n\n暂不要执行，我们将关闭文件后再执行。\n\
  \n**关闭文件：**\n\n写入完成后，我们必须关闭文件。这就像打开文件后必须关闭它一样。\n\n函数 `fclose()` 负责关闭文件。\n\n**练习：**\n\
  \n在上述代码中添加以下行：\n\n```php\nfclose($testfile);\n```\n\n在完成文件操作后关闭所有文件是一个良好的编程习惯。打开的文件会占用资源。\n\
  \n现在，执行该 PHP 文件，然后前往 `text.txt` 所在的路径。打开 `text.txt`，你将看到以下几行：\n\n![4-1-2](img/image00220.jpeg)\n\
  \n**向现有文件写入内容：**\n\n**当你关闭文件，然后再次以写入模式打开它时会发生什么？**\n\n文件 `testfile.txt` 已经包含一些数据，对吧？现在，如果你以写入模式打开一个现有文件，所有现有数据将被清除，我们必须像从头创建一样，从空文件重新开始。\n\
  \n现在，让我们在 `section4.php` 中编写以下代码：\n\n```php\n$testfile = fopen(\"test.txt\", \"\
  w\");\n$texttoadd = \"New first Line! \";\nfwrite($testfile,$texttoadd);\n$texttoadd\
  \ = \"New Second Line! \";\nfwrite($testfile,$texttoadd);\nfclose($testfile);\n\
  ```\n\n现在执行文件时，内容不会被追加，而是从头覆盖原有内容。\n\n![4-1-3](img/image00221.jpeg)\n\n那么，要继续写入内容，即在不擦除现有内容的情况下追加内容，该怎么办？使用追加模式：注释掉所有之前的代码，仅保留这\
  \ 4 行。\n\n```php\n$testfile = fopen(\"test.txt\", \"a\");\n$texttoadd = \"Third\
  \ Line to existing 2 lines! \";\nfwrite($testfile,$texttoadd);\nfclose($testfile);\n\
  ```\n\n执行 PHP 文件，现在打开 `test.txt`，你将看到以下内容：\n\n![4-1-4](img/image00222.jpeg)\n\n\
  **你无法刷新一个打开的文本文档！请关闭后重新打开以查看！**\n\n现在我们完成了向文件写入内容。下一个任务是从文件读取内容。为此我们有许多函数。\n\n**读取文件：**\n\
  \n我们可以通过以下方式打开文件以进行读取：\n\n*   使用 `readfile()` 函数\n*   使用 `fread()` 函数\n\n我们将逐一介绍：\n\
  \n要执行读取文件的代码，请尝试注释掉所有写入相关的代码，仅使用读取相关的代码，以检查它们如何从现有文本文档中检索内容！\n\n**使用 `readfile()`\
  \ 函数：**\n\n它读取文件并将其写入输出缓冲区。成功时返回读取的字节数。如果你只想打开一个文件并读取其内容，`readfile()` 函数非常有用。\n\n\
  我们已经创建了一个名为 `test.txt` 的文件。让我们尝试读取同一个文件。\n\n```php\necho readfile(\"test.txt\");\n\
  ```\n\n![4-1-5](img/image00223.jpeg)\n\n注释掉 echo 语句，尝试下一个函数。\n\n**使用 `fread()` 函数：**\n\
  \n`fread()` 函数从打开的文件中读取。\n\n参数：\n\n`fread(打开的文件名, 要读取的最大字节数);`\n\n\n\n##### 文件处理与超全局变量\n\
  \n###### 代码示例：读取文件内容\n\n```php\n$filecontent = fopen(\"test.txt\",\"r\");\necho\
  \ fread($filecontent,filesize(\"test.txt\"));\n```\n\n执行后输出：\n\n![4-1-6](img/image00224.jpeg)\n\
  \n*   `filesize(file)` 是一个返回文件字节数的函数。\n\n###### 读取函数\n\n我们将介绍几个读取函数：\n\n*   读取单行：`fgets()`\n\
  *   读取单字符：`fgetc()`\n*   检查文件结束：`feof()`\n\n####### `fgets()` 函数\n\n`fgets()` 函数用于从文件中读取单行。\n\
  \n练习代码：\n\n```php\n$filecontent = fopen(\"test.txt\",\"r\");\necho fgets($filecontent);\n\
  fclose($filecontent);\n```\n\n每当调用一次 `fgets()` 函数，指针就会移动到下一行。由于只有一个 `fgets()` 函数，因此只读取了一行。\n\
  \n![4-1-7](img/image00225.jpeg)\n\n####### `fgetc()` 函数\n\n`fgetc()` 函数用于从文件中读取单个字符。\n\
  \n练习代码：\n\n```php\n$filecontent = fopen(\"test.txt\",\"r\");\necho fgetc($filecontent);\n\
  fclose($filecontent);\n```\n\n调用 `fgetc()` 函数后，文件指针移动到下一个字符。由于 `fgetc()` 只被调用一次，因此只读取了一个字符！\n\
  \n![4-1-8](img/image00226.jpeg)\n\n####### 如何读取文件直到末尾？\n\n####### `feof()` 函数\n\n\
  `feof()` 函数检查是否已到达“文件结束”（EOF）。它对于遍历未知长度的数据非常有用。\n\n练习代码：\n\n```php\n$filecontent\
  \ = fopen(\"test.txt\",\"r\");\necho \"<p>Printing character by character </p>\"\
  ;\nwhile(!feof($filecontent)){\n    echo fgetc($filecontent);\n}\nfclose($filecontent);\n\
  \n$filecontent = fopen(\"test.txt\",\"r\");\necho \"<p>Printing line by line </p>\"\
  ;\nwhile(!feof($filecontent)){\n    echo \"<p>\".fgets($filecontent). \"</p>\";\n\
  }\nfclose($filecontent);\n```\n\n我们在 `fgets()` 之后关闭文件并再次打开。为什么？因为第一个 `while` 循环到达文件末尾后，指针无法指回开头。所以我们关闭并再次打开文件以便在\
  \ `while` 循环中执行 `fgetc()`。\n\n执行结果：\n\n![4-1-9](img/image00227.jpeg)\n\n希望你理解为什么要在\
  \ `while` 循环中检查 `feof()`。原因是为了读取所有行（使用 `fgets()`）和所有字符（使用 `fgetc()`），我们在 `while`\
  \ 中使用 `!feof()` 作为条件，指示循环持续到文件结束。\n\n###### 注意事项\n\n####### 打开不存在的文件会发生什么？\n\n我们来试一下：\n\
  \n```php\n$newfile = fopen(\"newtest.txt\",\"r\");\n```\n\n输出是什么？\n\n![4-1-10](img/image00228.jpeg)\n\
  \n有一种方法可以告知用户文件不存在：\n\n```php\n$newfile = fopen(\"newtest.txt\",\"r\") or die(\"\
  Unable to open file!\");\n```\n\n![4-1-11](img/image00229.jpeg)\n\n当以下情况发生时，`die`\
  \ 语句会被执行：\n\n*   文件不存在\n*   文件未被授予打开权限\n\n它会立即终止脚本。\n\n至此，文件处理部分结束！\n\n---\n\n####\
  \ 4.2 超全局变量\n\n---\n\nPHP 中存在一些预定义变量，它们始终可访问，无论作用域如何——你可以从任何函数、类或文件中访问它们，而无需做任何特殊操作。这些变量称为超全局变量，或简称为超全局。\n\
  \nPHP 超全局变量包括：\n\n*   `$GLOBALS`\n*   `$_SERVER`\n*   `$_REQUEST`\n*   `$_POST`\n\
  *   `$_GET`\n*   `$_FILES`\n*   `$_ENV`\n*   `$_COOKIE`\n*   `$_SESSION`\n\n**超全局变量是始终在所有作用域中可用的内置变量。**\n\
  \n本章不会详细讨论每个变量。将对所有变量进行简要介绍，实际用法将在本章和下一章中处理。\n\n##### `$GLOBALS`\n\n`$GLOBALS` 用于在\
  \ PHP 脚本的任何位置访问全局变量。我们在讨论函数中的变量作用域时使用过这些变量。希望你还记得！\n\n##### `$_SERVER`\n\n`$_SERVER`\
  \ 保存关于头信息、路径和脚本位置的信息。`$_SERVER` 超全局变量有许多元素用于获取关于服务器和服务器相关实体的描述。\n\n以下是可与 `$_SERVER`\
  \ 一起使用的元素列表：\n\n![4-2-superglobals](img/image00230.jpeg)\n\n我们将在实践环节测试几个元素：\n\n\
  ```php\necho \"Server Address: \".$_SERVER['SERVER_ADDR'];\necho \"<br>Server Name:\
  \ \".$_SERVER['SERVER_NAME'];\n```\n\n![4-2-1](img/image00231.jpeg)\n\n有 3 个超全局变量用于收集和传递表单数据。我们现在只简单了解一行，将在下一节深入探讨。\n\
  \n##### `$_REQUEST`\n\n`$_REQUEST` 用于在提交 HTML 表单后收集数据。\n\n##### `$_POST`\n\n`$_POST`\
  \ 用于在使用 `method=\"post\"` 提交 HTML 表单后收集表单数据。\n\n##### `$_GET`\n\n`$_GET` 用于在使用 `method=\"\
  get\"` 提交 HTML 表单后收集表单数据。\n\n##### `$_ENV`\n\n`$_ENV` 用于从 Web 服务器返回环境变量。为了学习，我们通过一个示例演示：\n\
  \n```php\necho 'Username: ' .$_ENV['USER'];\n```\n\n![4-2-2](img/image00232.jpeg)\n\
  \n这是一个错误！没问题！\n\n让我们调试该错误！`Undefined index`：意味着我们必须定义一个 `USER` 索引！\n\n我们现在修改代码如下：\n\
  \n```php\n$_ENV['USER'] = $_SERVER['SERVER_NAME'];\n\necho 'Username: ' .$_ENV['USER'];\n\
  ```\n\n![4-2-3](img/image00233.jpeg)\n\n就这些！\n\n我们将在本章后面讨论 `$_FILES`。将在下一章讨论 `$_COOKIE`\
  \ 和 `$_SESSION`。\n\n让我们进入下一节！\n\n---\n\n#### 4.3 使用表单\n\n---\n\n我们将使用第 6 章的一个项目标题来开发一个\
  \ Web 应用程序。因此，我们现在将为该应用程序设计一些表单，并通过它们学习如何使用 PHP 处理表单。明白了吗？让我们开始吧！\n\n我将简要介绍该项目的内容。\n\
  \n**项目：** 我们将采用 **在线课程** Web 应用程序。\n\n在这个在线课程应用程序中，我们将有教授课程的讲师和学习这些内容的学习者。\n\n基本上，我们有\
  \ 2 种用户：讲师和学习者。同样，我们有 2 个主要实体：课程及其内容。\n\n我们将简单地设计表单并使用它们来学习上一节讨论的某些超全局变量。\n\n请记住，我们不验证表单中的任何数据，我们只是在学习如何发送和检索表单数据。\n\
  \n##### 设计表单\n\n让我们为讲师注册设计一个表单（讲师的注册）：\n\n从这里开始，我们将为该项目创建一个文件夹并在此基础上工作！\n\n######\
  \ 操作步骤\n\n*   在 `C:/xampp/htdocs` 中创建一个名为 `onlinecourse` 的文件夹\n*   创建一个名为 `instructor_signup.php`\
  \ 的新 PHP 文件\n\n**注意：** 即使你设计的表单仅包含 HTML 元素，为了处理表单数据，你也需要 PHP。因此，请使用 `.php` 扩展名保存文件。\n\
  \n如果你准备好了，在 XAMPP 中启动 Apache 服务器，并在浏览器中运行 `onlinecourse` 项目，如下所示：\n\n![4-3-1](img/image00234.jpeg)\n\
  \n以下是 HTML 编码片段：\n\n###### `instructor_signup.php` 文件中的设计代码\n\n\n\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>讲师注册</title>\n</head>\n<body>\n<h2>讲师注册</h2>\n<form method=\"\
  get\" action=\"\" name=\"form1\">\n<table>\n<tr>\n<th style='text-align:left;'><label>电子邮箱地址</label></th>\n\
  <td>:&emsp;</td>\n<td><input type=\"email\" name=\"txtemail\" size=\"30\" placeholder=\"\
  您的电子邮箱地址\"></td>\n</tr>\n<tr>\n<th style='text-align:left;'><label>姓名</label></th>\n\
  <td>:&emsp;</td>\n<td><input type=\"text\" name=\"txtname\" size=\"30\" placeholder=\"\
  您的姓名\"></td>\n</tr>\n<tr>\n<th style='text-align:left;'><label>资质</label></th>\n\
  <td>:&emsp;</td>\n<td><input type=\"text\" name=\"txtqualification\" size=\"30\"\
  \ placeholder=\"您的资质\"></td>\n</tr>\n<tr>\n<th style='text-align:left;'><label>国家</label></th>\n\
  <td>:&emsp;</td>\n<td><select name=\"txtcountry\">\n<option value=\"\">从列表中选择一个国家</option>\n\
  <option value=\"India\">印度</option>\n<option value=\"France\">法国</option>\n<option\
  \ value=\"Japan\">日本</option>\n<option value=\"Canada\">加拿大</option>\n</select></td>\n\
  </tr>\n<tr></tr>\n<tr>\n<th></th><td></td><td><p><input type=\"submit\" name=\"\
  signup\" value=\"注册\"></p></td>\n</tr>\n</table>\n</form>\n<hr></body>\n</html>\n\
  \n我假设您对 HTML 表单有一定的想法/理解。\n\n我只是随机使用了一些国家名称！\n\n让我解释一下代码片段的内容：\n\n我们有 4 个字段——讲师邮箱\
  \ ID、讲师姓名、讲师资质、讲师国家。我们尝试使用这 4 个字段获取输入。如果表单的 action 为空，所有数据都将提交到同一页面。目前，我们不会在任何地方保存这些数据。我们只是传递数据并使用超全局变量在同一页面打印它们。\n\
  \n执行后，您应该会看到如下效果（如果您按上述方式编码）：\n\n![4-3-2](img/image00235.jpeg)\n\n您可以按喜好设计表单。但为了学习目的，**请勿更改任何元素的名称**。我们在该表单中有以下名称：`form1`、`txtemail`、`txtname`、`txtqualification`、`txtcountry`、`signup`。请确保拼写正确。因为这些名称将发挥重要作用。\n\
  \n由于我们在此使用的方法是 get，我们可以使用 `$_REQUEST` 或 `$_GET` 变量来收集这些数据！\n\n在 `instructor_signup.php`\
  \ 文件开头编写以下代码：\n\n```php\n<?php\nif(isset($_GET['signup'])){\n  echo \"<br>您已点击注册\"\
  ;\n}\n?>\n```\n\n我们将检查表单是否已提交。该怎么做？\n\n*   将此代码添加到 php 文件中。\n*   执行该文件\n*   点击页面中的注册按钮\n\
  \n![4-3-3](img/image00236.jpeg)\n\n如果在顶部显示此消息，则表示您的表单已提交。\n\n`if(isset($_GET['signup']))`\
  \ 解释：\n\n*   如果名为 `signup` 的按钮被点击，`$_GET['signup']` 将获取值 1。\n*   `isset()` 将检查 `$_GET['signup']`\
  \ 是否有值。如果按钮未被点击，`$_GET['signup']` 将没有值，导致 `isset()` 为 false。点击时，`isset()` 返回 true。\n\
  *   当您将 `isset($_GET['signup'])` 传入 `if()` 语句时，条件评估为 true 并执行语句块。如果条件评估为 false，则不执行语句块。\n\
  \n示例：当您执行页面时，不会收到消息，只有当您点击按钮时，才会收到此消息。\n\n您能看到 URL 吗？当您使用 `$_GET` 方法时，所有值都会连同名称参数显式地显示在\
  \ URL 中。\n\n现在我们只需将所有这些值获取到变量中并打印出来。\n\n在开头添加此代码：（不仅是 echo 语句，我们还添加了几行）。\n\n```php\n\
  <?php\nif(isset($_GET['signup'])){\n   echo \"<br>您已点击注册\";\n   $email = $_REQUEST['txtemail'];\n\
  \   $name = $_GET['txtname'];\n   $qualification = $_GET[\"txtqualification\"];\n\
  \   $country = $_GET['txtcountry'];\n}\n?>\n```\n\n除非必要，我们可以使用单引号或双引号。\n\n我们将在表单下方打印详细信息。查看您的表单在何处以\
  \ `</form>` 结束。将代码片段放在 `<hr>` 标签下方：\n\n```php\n<?php\nif(isset($email)){\n  echo\
  \ \"<br>邮箱 - \".$email;\n}\nif(isset($name)){\n  echo \"<br>姓名 - \".$name;\n}\n\
  if(isset($qualification)){\n  echo \"<br>资质 - \".$qualification;\n}\nif(isset($country)){\n\
  \  echo \"<br>国家 - \".$country;\n}\n?>\n```\n\n对每个 php 变量使用 `isset()` 的原因很简单——如果您不使用，执行时\
  \ php 会搜索这些变量，如果未找到则显示错误。想检查一下吗？您可以试试！\n\n添加代码后，请确保不要刷新带有参数的 URL。\n\n执行 `http://localhost/onlinecourse/instructor_signup.php`\n\
  \n执行后，在这些字段中输入一些内容并点击注册按钮：\n\n![4-3-4](img/image00237.jpeg)\n\n您能理解它的作用吗？另外，请注意\
  \ URL 参数！\n\n您希望您的表单数据安全吗？\n\n非常简单，您只需做 2 件事：\n\n*   将表单 method 改为 \"post\"\n* \
  \  将所有 `$_GET[]` 改为 `$_POST[]` 变量。您可以更改/保留 `$_REQUEST[]`\n\n让我给出代码：\n\n```php\n\
  <?php\nif(isset($_POST['signup'])){\n    echo \"<br>您已点击注册\";\n    $email = $_REQUEST['txtemail'];\n\
  \    $name = $_POST['txtname'];\n    $qualification = $_POST[\"txtqualification\"\
  ];\n    $country = $_POST['txtcountry'];\n}\n?>\n\n<form method=\"post\" action=\"\
  \" name=\"form1\">\n```\n\n执行 `http://localhost/onlinecourse/instructor_signup.php`\n\
  \n![4-3-5](img/image00238.jpeg)\n\n看看您的 URL 有多干净！\n\n当您不确定表单是通过 get 还是 post 方法发送时，可以使用\
  \ `$_REQUEST` 检索表单变量！\n\n让我们了解一下 **GET 与 POST：**\n\nGET 和 POST 都会创建一个类似这样的数组：array(\
  \ key1 => value1, key2 => value2, key3 => value3, ...)。该数组保存键/值对，其中键是表单控件的名称，值是来自用户的输入数据。\n\
  \n您可以从任何函数、类或文件访问它们，而无需做任何特殊操作。它们在全局范围内均可访问。\n\n*   `$_GET` 是通过 URL 参数传递给当前脚本的变量数组。\n\
  *   `$_POST` 是通过 HTTP POST 方法传递给当前脚本的变量数组。\n\n###### 何时使用 GET？\n\n使用 GET 方法从表单发送的信息对所有人可见（所有变量名和值都显示在\
  \ URL 中）。\n\n*   GET 对发送信息的量有限制。\n*   限制约为 2000 个字符。\n*   然而，因为变量显示在 URL 中，所以可以将页面加入书签。这在某些情况下很有用。\n\
  *   GET 可用于发送非敏感数据。\n*   GET **绝不应** 用于发送密码或其他敏感信息！\n\n###### 何时使用 POST？\n\n使用 POST\
  \ 方法从表单发送的信息对其他人不可见（所有名称/值嵌入在 HTTP 请求的主体中）\n\n*   对发送信息的量没有限制。\n*   此外 POST 支持高级功能，例如在向服务器上传文件时支持多部分二进制输入。\n\
  *   然而，因为变量不显示在 URL 中，所以无法将页面加入书签。\n*   开发人员倾向于使用 POST 发送表单数据。\n\n---\n\n#### 4.4\
  \ 表单验证\n\n---\n\n在本节中，我们将学习如何安全地处理表单。正确验证表单数据对于保护您的数据免受黑客和垃圾邮件发送者的侵害非常重要！\n\n验证示例：\n\
  \n这 2 条验证规则依据我们的讲师注册表单。\n\n*   如果您在文本字段中提供姓名，它应包含字母和空格。\n*   如果您在邮箱字段中提供电子邮箱地址，它必须包含\
  \ @ 和域名才有效。\n*   我们也可以使用 html input 元素中的 required 属性将字段指定为必填或选填。\n\n**如何验证上一节设计的表单？**\n\
  \n我们将遵循以下步骤：\n\n\n\n\n##### 表单验证最佳实践\n\n*   使用 `htmlspecialchars()` 函数处理所有变量。使用此函数的原因是防止不必要的脚本代码被传递到姓名、邮箱等文本字段中。\n\
  *   使用 PHP `trim()` 函数从用户输入数据中去除不必要的字符（多余空格、制表符、换行符）。\n*   使用 PHP `stripslashes()`\
  \ 函数从用户输入数据中移除反斜杠（`\\\\`）。\n*   当提到 `mandatory` 属性时，检查字段是否为空。\n*   将每个验证逻辑放在单独的函数中，以避免为每个表单重复编写相同代码。\n\
  *   为每个字段生成适当的错误消息，以便用户了解其输入哪里出错。\n\n以上是通用的几个步骤。我还提示了一些函数以方便你的工作。\n\n对于我们的注册表单，我们可以尝试验证邮箱、姓名和国家字段。我们可能不会用到上述所有函数，而是会使用一些其他函数来实现我们的目的！\n\
  \n我们开始验证表单吧？\n\n*   在 `C:/xampp/htdocs/onlinecourse` 目录下创建一个名为 `validate_form.php`\
  \ 的文件\n*   在 `instructor_signup.php` 文件中包含 `validate_form.php` 文件\n\n让我展示一下要放在 `instructor_signup.php`\
  \ 开头的包含语句：\n\n```\ninclude('validate_form.php');\n```\n\n再次提醒一下字段：\n\n*   `txtemail`\
  \ - 用于邮箱地址\n*   `txtname` - 用于姓名\n*   `txtqualification` - 用于学历\n*   `txtcountry`\
  \ - 用于国家\n\n在这 4 个字段中，`txtcountry` 是从给定列表中选择的字段。但我们仍有一个要求：必须选择某个值，使该字段成为必填项！\n\n\
  这没有固定的验证规则。只要规则合适，你可以自由选择适合你字段的验证规则。\n\n我们将练习每个验证的代码片段。\n\n一旦所有验证片段准备就绪，我们将在最后更新\
  \ `instructor_signup.php` 文件！\n\n###### 验证邮箱地址\n\n如果你在输入元素中使用 `type=\"email\"` (HTML5)\
  \ 并在最新浏览器中检查，该字段将由浏览器自动验证。我们将为旧版浏览器和旧版 HTML 提供解决方案。\n\n我们将使用 `filter_var()` 函数来检查邮箱地址是否格式正确。\n\
  \n我们在 `$email` 变量中获取邮箱地址：\n\n```\n$email = $_REQUEST['txtemail'];\n```\n\n现在让我们在\
  \ `validate_form.php` 中编写一个函数：\n\n```\nfunction check_email($email){\n  if (!filter_var($email,\
  \ FILTER_VALIDATE_EMAIL)) {\n\treturn \"Invalid email address\";\n  }\n}\n```\n\n\
  代码解释：\n\n*   将变量 `$email` 作为参数传递给函数 `check_email($email)`\n*   使用 `filter_var()`\
  \ 函数验证邮箱地址格式\n*   如果格式错误，则返回错误消息\n\n###### 验证姓名\n\n我们将使用正则表达式函数 `preg_match()` 来检查姓名字段是否仅包含字母、连字符、撇号和空白字符。\n\
  \n我们在 `$name` 变量中获取姓名字段：\n\n```\n$name = $_POST['txtname'];\n```\n\n现在让我们在 `validate_form.php`\
  \ 中编写一个函数：\n\n```\nfunction check_name($name){\n  if (!preg_match(\"/^[a-zA-Z-'\
  \ ]*$/\",$name)) {\n    return \"Name must contain letters and whitespaces!\";\n\
  \  }\n}\n```\n\n代码解释：\n\n*   将变量 `$name` 作为参数传递给函数 `check_name($name)`\n*   使用 `preg_match()`\
  \ 检查姓名是否包含字母、空白字符、连字符\n*   如果格式错误，则返回错误消息\n\n###### 注册页面需要修改什么？\n\n希望你已在 `validate_form.php`\
  \ 中添加了 2 个函数。现在，我们将更新 `instructor_signup.php` 文件中的代码：\n\n共有两组 PHP 代码标签。一组出现在顶部。\n\
  \n我们已包含 `validate_form.php` 文件：\n\n```\n<?php\ninclude('validate_form.php');\nif(isset($_POST['signup'])){\n\
  \  echo \"<br>You have clicked Sign up\";\n  $email = $_REQUEST['txtemail'];\n \
  \ $name = $_POST['txtname'];\n  $qualification = $_POST[\"txtqualification\"];\n\
  \  $country = $_POST['txtcountry'];\n}\n?>\n```\n\n第二组 PHP 代码出现在底部附近：\n\n我们将在这里应用验证：\n\
  \n```\n<?php\n$display = true;\nif(isset($email) and isset($name) and isset($qualification)\
  \ and isset($country)){\n  //check field validation\n  $email_status = check_email($email);\n\
  \  $name_status = check_name($name);\n  if($email_status <> NULL){\n    echo \"\
  <p style='text-color:red;'>\".$email_status.\"</p>\";\n    $display = false;\n \
  \ }\n  if($name_status <> NULL){\n    echo \"<p style='text-color:red;'>\".$name_status.\"\
  </p>\";\n    $display = false;\n  }\n  if(empty($country)){\n    echo \"<p style='text-color:red;'>No\
  \ country chosen</p>\";\n    $display = false;\n  }\n  //display fields if no errors\
  \ found\n  if($display){\n    echo \"<br>Email - \".$email;\n    echo \"<br>Name\
  \ - \".$name;\n    echo \"<br>Qualification - \".$qualification;\n    echo \"<br>Country\
  \ - \".$country;\n  }\n}\n?>\n```\n\n代码解释：\n\n*   我们设置变量 `$display` 为 `true`\n*\
  \   我们检查所有变量是否都有值，如果是，则继续\n    *   验证邮箱字段，如果邮箱字段无效，显示消息\n    *   验证姓名字段，如果姓名字段无效，显示消息\n\
  \    *   检查是否选择了国家，否则显示消息\n    *   如果上述三个验证中的任何一个失败，则将 `$display = false`，这将不打印任何详细信息\n\
  \    *   如果验证后 `$display = true`，则打印字段\n\n让我们使用有效/无效输入数据执行。\n\n无效输入数据和输出：\n\n![4-4-1](img/image00239.jpeg)\n\
  ![4-4-2](img/image00240.jpeg)\n\n有效输入数据和输出：\n\n![4-4-3](img/image00241.jpeg)\n![4-4-4](img/image00242.jpeg)\n\
  \n> **注意：**\n>\n> 在 HTML5 中，我们有邮箱、URL、数字、搜索等文本字段，它们会在提交表单前自动验证。如果你希望使用 `type=\"\
  text\"`，你必须对它们进行验证。即使你使用了邮箱、URL 类型，强制实施验证规则也是一种好习惯，这样使用旧版浏览器的用户的输入数据也能得到验证。\n\n\
  ###### 验证 URL\n\n仅供参考，让我给出验证 URL 字段的代码。\n\n假设我们将网站的 URL 存储在 `$url` 变量中，验证代码如下：\n\
  \n```\nif (!preg_match(\"/\\b(?:(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&@#\\/%?=~_|!:,.;]*[-a-z0-9+&@#\\\
  /%=~_|]/i\",$url))\n{\n  return \"Invalid URL\";\n}\n```\n\n本节的目的是让你了解如何使用 PHP（及\
  \ PHP 函数）进行表单验证。希望你理解了如何在 PHP 中验证表单字段。下一节将介绍如何使用表单上传文件并验证文件。\n\n---\n\n#### 4.5\
  \ 文件上传\n\n---\n\n在我们的 `onlinecourse` 项目中，我们有一个获取课程内容的表单。假设我们有这本电子书的内容作为 PHP 课程。内容的格式是什么？\n\
  \n*   内容类型：pdf / ppt / doc / video\n*   内容文件：通过浏览器上传文件\n\n我们在本节要做什么？\n\n*   启用文件上传\n\
  *   设计表单并上传文件\n*   对上传的文件施加规则\n*   验证这些规则\n\n##### 启用文件上传\n\n通常，服务器会启用此功能。但在本地，我们可以检查一次。\n\
  \n*   在路径 `C:/xampp/php` 中找到你的 `php.ini` 文件\n*   使用任意文本编辑器打开该文件\n*   搜索 `file_uploads`（大约在第\
  \ 830 行）并检查 `file_uploads = on` 是否已设置\n*   如果未启用，按上述方式启用它。\n\n##### 设计课程内容表单\n\n\
  在路径 `C:/xampp/htdocs/onlinecourse` 下创建一个名为 `upload_content.php` 的新 PHP 文件。\n\n我们按如下方式创建表单：\n\
  \n*   表单必须使用 `post` 方法提交。\n*   我们应在表单元素中包含属性：`enctype=\"multipart/form-data\"`。这指定了提交表单时应使用的内容类型。\n\
  *   在输入元素的 `type` 属性中使用 `file` 将提供一个“浏览”按钮。\n\n请记住，必须应用上述规则才能使文件上传工作。\n\n以下是表单代码：\n\
  \n\n\n\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Upload Content</title>\n\
  </head>\n<body>\n<h2>Upload Course Content</h2>\n<form method=\"post\" action=\"\
  \" name=\"form2\" enctype=\"multipart/form-data\">\n<p>Choose File Type:\n<select\
  \ name='txtfiletype'>\n<option value='docx'>DOCX</option>\n<option value='pptx'>PPT</option>\n\
  <option value='pdf'>PDF</option>\n<option value='mp4'>MP4 Video</option>\n</select>\n\
  </p>\n<p>Choose File: <input type=\"file\" name=\"txtfileupload\"></p>\n<p><input\
  \ type=\"submit\" name=\"upload\" value=\"Upload File\"></p>\n</form>\n</body>\n\
  </html>\n```\n\n请看一下这个表单：\n\n![4-5-1](img/image00243.jpeg)\n\n我们仅提供了 4 种文件类型 - docx、pptx、pdf\
  \ 和 mp4 扩展名。\n\n**选中文件的上传脚本：**\n\n现在，表单已经准备好了。我们需要选择文件类型并选择要上传的文件。完成后，我们需要点击“Upload\
  \ File”按钮。\n\n下面的脚本将把文件上传到服务器。我们将首先查看代码，随后是代码解释。\n\n```php\n<?php\nif(isset($_POST['upload'])){\n\
  \ echo \"<br>You have clicked Upload File button...\";\n\n //fetching uploaded file\
  \ details\n  $file_name = $_FILES['txtfileupload']['name'];\n  $file_tmp =$_FILES['txtfileupload']['tmp_name'];\n\
  \  $file_type = $_POST['txtfiletype'];\n  $file_string = explode('.',$_FILES['txtfileupload']['name']);\n\
  \  $file_ext= strtolower(end($file_string));\n\n //check if uploaded file extension\
  \ is from the selected type\n echo \"<br>File name = \".$file_name;\n echo \"<br>File\
  \ Temp = \".$file_tmp;\n echo \"<br>File Type = \".$file_type;\n echo \"<br>File\
  \ Ext of file = \".$file_ext;\n\n if($file_type == $file_ext){\n  //uploaded file\
  \ moved to current folder\n  move_uploaded_file($file_tmp,$file_name); \n  echo\
  \ \"<br>File Uploaded successfully!\";\n  }\n  else{\n   echo \"<br>File extension\
  \ not matching!\";\n  }\n\n}\n?>\n```\n\n让我来解释一下：\n\n*   我们使用 `$_FILES[]` 超全局变量从上传的文件中检索文件名和文件的临时位置。\n\
  \n    ```php\n    $file_name = $_FILES['txtfileupload']['name'];\n    $file_tmp\
  \ =$_FILES['txtfileupload']['tmp_name'];\n    ```\n\n*   我们从表单中选定的下拉列表获取文件类型。\n\n\
  \    ```php\n    $file_type = $_POST['txtfiletype'];\n    ```\n\n*   我们分 2 步查找上传文件的扩展名：\n\
  \n    ```php\n    $file_string = explode('.',$_FILES['txtfileupload']['name']);\n\
  \    $file_ext= strtolower(end($file_string));\n    ```\n\n    *   使用 `explode()`\
  \ 函数，我们使用分隔符或分割字符 '.' 来分割字符串。也就是说，`explode()` 将文件名 `xxxx.docx` 分割为 2 个字符串，即 `xxxx`\
  \ 和 `docx`。\n\n    *   使用 `end()` 函数，我们查找末尾的字符串。也就是说，在两个字符串 `xxxx`、`docx` 中，`end()`\
  \ 选取最后一个字符串 - `docx`。\n\n*   我们打印上述所有获取的详细信息\n\n    ```php\n    echo \"<br>File\
  \ name = \".$file_name;\n    echo \"<br>File Temp = \".$file_tmp;\n    echo \"<br>File\
  \ Type = \".$file_type;\n    echo \"<br>File Ext of file = \".$file_ext;\n    ```\n\
  \n*   我们将表单选定的类型存储在 `$file_type` 中，将上传文件的扩展名存储在 `$file_ext` 中。\n\n*   我们比较 `$file_type`\
  \ 和 `$file_ext` 变量\n\n    ```php\n    if($file_type == $file_ext)\n    ```\n\n*\
  \   如果扩展名匹配，我们将文件从临时位置移动到我们正在工作的文件夹中\n\n    ```php\n    move_uploaded_file($file_tmp,$file_name);\
  \ \n    echo \"<br>File Uploaded successfully!\";\n    ```\n\n*   如果扩展名不匹配，我们只打印一条消息而不移动文件。\n\
  \n    ```php\n    echo \"<br>File extension not matching!\";\n    ```\n\n你也可以将文件移动到不同的文件夹。为了保持简单，我们将文件上传到我们当前正在工作的同一文件夹\
  \ `onlinecourse` 中。\n\n我们现在执行一下吗？\n\n浏览 `http://localhost/onlinecourse/upload_content.php`\n\
  \n在我这里，我从系统中选择了一个名为 `Content.docx` 的文件：\n\n![4-5-2](img/image00244.jpeg)\n\n你能找到临时位置吗？这是实际的上传，但是一个临时存储的地方！\n\
  \n*   一旦我们将文件移动到目标位置，我们会打印文件上传成功的消息。\n*   检查 `onlinecourse` 文件夹以查看您上传的文件！\n\n**为什么我们要移动文件？**\n\
  \n因为你无法从临时位置访问该文件！一旦程序停止执行，临时文件就会消失！你需要一个永久的位置来保存上传的文件！\n\n尝试选择像 docx 这样的文件类型并尝试上传图片文件：\n\
  \n![4-5-3](img/image00245.jpeg)\n\n你能看到上传已经发生在临时位置，但文件没有被移动到我们的位置，只是打印了一条消息，提示文件扩展名不匹配。\n\
  \n检查 `onlinecourse` 文件夹，你找不到上传的图片。你甚至可以检查临时路径，也找不到临时文件。\n\n![4-5-4](img/image00246.jpeg)\n\
  \n这就是关于文件上传脚本的全部内容。\n\n现在我们有一些上传文件时可以施加的规则，我们将快速浏览一下！\n\n假设 `$file_uploaded` 是保存文件的变量！对应的表单元素是\
  \ `$_FILES['txtfileupload']`。\n\n**检查文件是否已存在：**\n\n我们使用 `file_exists()` 函数来执行此操作。\n\
  \n```php\n// Check if file already exists\nif (file_exists($file_uploaded)) {\n\
  \  echo \"File already exists.\";\n}\n```\n\n**限制文件大小：**\n\n我们使用字节值检查文件大小。\n\n```php\n\
  // Check file size\nif ($_FILES[\"txtfileupload\"][\"size\"] > 500000) {\n  echo\
  \ \"File is too large.\";\n}\n```\n\n**限制文件类型：**\n\n我们也可以在上传脚本中使用 `if()` 条件来限制文件类型。假设我们有一个变量\
  \ `$file_type`。\n\n你可以设置如下条件：\n\n```php\n// Allow certain file formats\nif(($file_type\
  \ != \"docx\") && ($file_type != \"pptx\") && ($file_type != \"pdf\" ) && ($file_type\
  \ != \"mp4\" )){\n  echo \"Only docx, pptx, pdf and mp4 files are allowed.\";\n\
  }\n```\n\n这些条件检查上传的文件类型不是 docx、不是 pptx、不是 pdf 也不是 mp4 - 如果这 4 个扩展名都不存在，则意味着存在其他扩展名，从而向用户抛出一条消息。\n\
  \n我们将在代码片段中包含限制文件大小：\n\n我们将文件限制为 2MB。2 MB = 2097152 字节。\n\n```php\n<?php\nif(isset($_POST['upload'])){\n\
  \  echo \"<br>You have clicked Upload File button...\";\n\n  //fetching uploaded\
  \ file details\n  $file_name = $_FILES['txtfileupload']['name'];\n  $file_tmp =$_FILES['txtfileupload']['tmp_name'];\n\
  \  $file_size =$_FILES['txtfileupload']['size'];\n  $file_type = $_POST['txtfiletype'];\n\
  \  $file_string = explode('.',$_FILES['txtfileupload']['name']);\n  $file_ext= strtolower(end($file_string));\n\
  \n  //check if uploaded file extension is from the selected type\n  echo \"<br>File\
  \ name = \".$file_name;\n  echo \"<br>File Temp = \".$file_tmp;\n  echo \"<br>File\
  \ Type = \".$file_type;\n  echo \"<br>File Ext of file = \".$file_ext;\n\n  if($file_type\
  \ == $file_ext){\n    if($file_size > 2097152){\n       echo \"<br>Cannot Upload!\
  \ File > 2MB\";\n    }\n    else{\n       move_uploaded_file($file_tmp,$file_name);\
  \ \n       echo \"<br>File Uploaded successfully!\";\n    }\n  }\n  else{\n    echo\
  \ \"<br>File extension not matching!\";\n  }\n}\n```\n\n尝试上传一个大于 2 MB 的文件。它将给出一条消息，而不是将其上传到\
  \ `onlinecourse` 文件夹！\n\n我尝试上传一个 > 5MB 的 mp4 视频\n\n![4-5-5](img/image00247.jpeg)\n\
  \n根据您的需要施加限制！我们到此完成文件上传！\n\n我想你已经清楚如何使用表单并在 PHP 中上传文件了。\n\n至此，本章结束！\n\n---\n\n###\
  \ 第 5 章：Web 中的 PHP\n\n---\n\n*   [](#part0031.xhtml)\n\n    #### 5.1 会话\n\n*   [](#part0032.xhtml)\n\
  \n    #### 5.2 Cookie\n\n*   [](#part0033.xhtml)\n\n    #### 5.3 过滤器\n\n*   [](#part0034.xhtml)\n\
  \n    #### 5.4 处理 JSON 数据\n\n---\n\n#### 5.1 会话\n\n---\n\n会话是一种在多个页面间存储信息（在变量中）以供使用的方式。\n\
  \n**什么是会话？**\n\n让我们以我们在浏览器中的冲浪活动为例。我们打开一个浏览器，我们在网络上不断浏览内容。浏览器会话是在打开和关闭浏览器之间。\n\n\
  \n\n\n\n##### PHP 会话与 Cookie\n\n###### Web 环境下的会话\n\n假设你在一个 Web 应用程序中工作。你登录账户，进行一些更改，然后注销。这正是一个会话。会话会保留你的某些身份信息，以便服务器在整个会话期间知道你是谁。\n\
  \n在 PHP 中，我们使用会话变量来实现这一会话概念。会话变量通过存储用户信息以供多个页面使用来解决此问题。默认情况下，会话变量持续到用户关闭浏览器或用户注销为止。\n\
  \n会话变量保存关于单个用户的信息，并使其可供该用户在应用程序中访问的所有页面使用。每当用户登录时，该用户的会话即开始。如果有 3 个用户——`user1`、`user2`、`user3`——同时登录\
  \ Web 应用程序，将创建一个会话变量，并存储 3 个值——例如用户的 `userid`。基于 `userid`，它将识别哪个用户在应用程序中做了什么修改。\n\
  \n####### 如何启动会话？\n\n我们有用于启动会话的 `session_start()` 函数。\n\n你还记得超全局变量 `$_SESSION` 吗？`$_SESSION`\
  \ 全局变量用于设置会话变量。\n\n我们要不要通过 `onlinecourse` 项目来实践一下？\n\n##### 实践\n\n我们将在一个页面中创建会话变量，并在另一个页面中检索会话变量的值。\n\
  \n现在，你必须在 `C:/xampp/htdocs/onlinecourse` 路径下创建 2 个 PHP 文件：`page1.php` 和 `page2.php`。\n\
  \n######## 在 `page1.php` 中我们将做什么？\n\n*   设计一个表单以获取姓名字段\n*   设置会话变量并存储姓名\n\n########\
  \ 在 `page2.php` 中我们将做什么？\n\n*   从会话变量中检索存储的姓名\n*   打印检索到的姓名\n\n####### `page1.php`\
  \ 中的代码\n\n我将首先展示设计代码，然后我们将添加 PHP 代码，以便你理解如何设置会话变量。\n\n这是设计代码：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>Page 1 </title>\n</head>\n<body>\n<h3> Page 1 -\
  \ Get Name </h3>\n<form method=\"post\" name=\"form3\">\n<p><input type=\"text\"\
  \ name=\"txtname\" placeholder=\"Enter your name\"></p>\n<p><input type=\"submit\"\
  \ name=\"submit\" value=\"Submit\"></p>\n</form>\n</body>\n</html>\n```\n\n现在，我们将在页面开头添加\
  \ PHP 代码：\n\n```php\n<?php\nsession_start();\nif(isset($_POST['submit'])){\n  $_SESSION['name']\
  \ = $_POST['txtname'];\n  echo \"<br> Session variable is set: \".$_SESSION['name'];\n\
  }\n?>\n```\n\n让我解释一下 PHP 代码：\n\n*   我们使用 `session_start()` 启动一个新会话\n*   我们将姓名字段的值设置给\
  \ `$_SESSION['name']` 全局变量。\n*   我们打印存储的变量\n\n从浏览器执行 `page1.php` 并提供姓名作为输入然后按提交。以下提供了参考截图：\n\
  \n![5-1-0](img/image00248.jpeg)\n![5-1-1](img/image00249.jpeg)\n\n下一项工作是从 `page2.php`\
  \ 文件中检索此姓名。\n\n####### `page2.php` 中的代码\n\n这里没有什么可设计的。我们将直接进入 PHP 代码。\n\n```php\n\
  <?php\nsession_start();\nif(isset($_SESSION['name'])){\n  echo $_SESSION['name'];\n\
  }\nelse{\n  echo \"Nothing is stored in session variable\";\n}\n?>\n```\n\n会话变量不会像\
  \ `$_GET` 和 `$_POST` 那样单独传递给每个页面。它们是从页面开头放置的会话变量（`$_SESSION[]`）中检索的。\n\n########\
  \ 我们如何获取会话变量的值？\n\n*   我们使用 `session_start()` 打开会话\n*   我们检查 `$_SESSION['name']`\
  \ 变量是否已设置值\n*   如果已设置，我们打印该值，否则我们打印一条消息提示未存储任何内容\n\n直接从浏览器执行 `page2.php` 文件：\n\n\
  ![5-1-2](img/image00250.jpeg)\n\n故事讲完了！我们在 `page2.php` 中没有提供任何输入，却检索到了姓名。怎么做到的？\n\
  \n这就是会话变量的威力！不仅是登录详情，我们可以在会话变量中保留任何值！为了举例，我使用了登录过程。\n\n##### 注意\n\n请确保在同一个浏览器会话中执行页面：`page1.php`\
  \ 和 `page2.php`。这意味着，你不应关闭并重新打开浏览器。保持浏览器存活并执行这两个页面。\n\n####### 如何更改会话变量的值？\n\n这非常简单，只需在需要修改的地方将新值赋给会话变量即可。\n\
  \n####### 如何销毁会话？\n\n要移除所有全局设置的会话变量，我们使用 `session_unset()` 函数。\n\n要销毁会话，我们使用 `session_destroy()`\
  \ 函数。\n\n现在我们要不要向 `page2.php` 添加一些代码并测试一下？\n\n让我按如下方式修改 `page2.php` 中的代码：\n\n```php\n\
  <?php\nsession_start();\necho \"<p>Session Set</p>\";\nif(isset($_SESSION['name'])){\n\
  \ echo $_SESSION['name'];\n}\nelse{\n echo \"Nothing is stored in session variable\"\
  ;\n}\n\n//unset session variables\necho \"<p>Session Unset</p>\";\nsession_unset();\n\
  if(isset($_SESSION['name'])){\n echo $_SESSION['name'];\n}\nelse{\n echo \"Nothing\
  \ is stored in session variable\";\n}\n?>\n```\n\n执行 `page2.php` 现在将显示：\n\n![5-1-3](img/image00251.jpeg)\n\
  \n希望你能理解 `session_unset()` 之后发生了什么。\n\n现在，会话变量已被取消设置，因此单独执行 `page2.php` 时没有任何值。\n\
  \n在浏览器中执行：`http://localhost/onlinecourse/page2.php`\n\n![5-1-4](img/image00252.jpeg)\n\
  \n既然你已经取消设置了会话变量，此页面不再保存 `$_SESSION['name']` 的值。显然未存储任何内容！所以消息被打印了两次（一次用于 Session\
  \ Set，一次用于 Session Unset）！\n\n---\n\n#### 5.2 Cookie\n\n---\n\nCookie 是服务器嵌入在用户计算机上的一个小文件。每当同一台计算机通过浏览器请求页面时，它也会发送\
  \ Cookie。\n\nCookie 用于识别用户。你可以在 PHP 中创建和检索 Cookie。\n\n##### 创建 Cookie\n\n我们可以使用\
  \ `setcookie()` 函数创建 Cookie。`setcookie()` 函数必须出现在 `<html>` 标签**之前**。\n\n###### 语法\n\
  \n```php\nsetcookie(name, value, expire, path, domain, secure, httponly);\n```\n\
  \n###### 参数\n\n![5-2-parameters](img/image00253.jpeg)\n\n##### 注意\n\n发送 Cookie 时，Cookie\
  \ 的值会自动进行 URL 编码，接收时会自动解码。\n\n为了防止 URL 编码，我们必须使用 `setrawcookie()`。\n\n##### 检索 Cookie\n\
  \n我们可以使用超全局变量 `$_COOKIE` 检索 Cookie。\n\n##### 修改 Cookie 值\n\n我们只需使用 `setcookie()`\
  \ 函数将新值赋给 Cookie 即可。\n\n##### 删除 Cookie\n\n要删除 Cookie，请使用 `setcookie()` 函数并将过期日期设为过去的时间。推荐的做法是在创建\
  \ Cookie 时设置过期日期，这样你就不需要销毁它。Cookie 过期后会自动删除。\n\n##### 如何检查 Cookie 是否启用？\n\n我们将只对\
  \ `$_COOKIE` 变量执行计数。`$_COOKIE` 将值存储在数组中。因此，执行计数并结果为零将表明没有 Cookie。我们将在实践环节中直接编写代码实现。\n\
  \n##### 实践\n\n我们将通过一个示例来演示。使用那 2 个文件 `page1.php` 和 `page2.php`。\n\n*   我们将在 `page1.php`\
  \ 中设置 Cookie\n*   我们将在 `page2.php` 中检索 Cookie\n\n让我们一起为两个页面编写代码并执行它们，因为我们将 Cookie\
  \ 的过期时间设为 60 秒。60 秒后，当我们尝试加载 `page2.php` 时，它应该提示 Cookie 已被删除。\n\n##### `page1.php`\
  \ 的代码\n\n我们将仅用 `setcookie()` 函数替换 PHP 代码，而不是 `$_SESSION`。`page1.php` 中的设计代码（HTML\
  \ 部分）保持不变。\n\n```php\n<?php\nif(isset($_POST['submit'])){\nsetcookie('cookiename',$_POST['txtname'],time()\
  \ + 60);\n}\n?>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Page 1 </title>\n</head>\n\
  <body>\n<h3> Page 1 - Get Name </h3>\n<form method=\"post\" name=\"form3\">\n<p><input\
  \ type=\"text\" name=\"txtname\" placeholder=\"Enter your name\"></p>\n<p><input\
  \ type=\"submit\" name=\"submit\" value=\"Submit\"></p>\n</form>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n希望你理解 PHP 代码部分。我们只是设置了一个名为 `cookiename`、值为 `$_POST['txtname']` 的\
  \ Cookie，该值即我们在文本字段中输入的内容。该 Cookie 的过期时间被设为 60 秒。\n\n请暂勿执行。由于 Cookie 将在 60 秒后过期，你无法在\
  \ `page2.php` 中获取它。\n\n**`page2.php` 的代码：**\n\n对于此文件，我们将完全替换代码为：\n\n```php\n<?php\n\
  if(isset($_COOKIE['cookiename'])){\n  echo $_COOKIE['cookiename'];\n}\nelse{\n \
  \ echo \"Cookie has been expired\";\n}\necho \"<p>Counting Cookies : \".count($_COOKIE);\
  \ \n?>\n```\n\n两个页面都准备好了吗？\n\n按顺序执行：\n\n`localhost/onlinecourse/page1.php`\n\n输入名称并按下提交。立即执行：\n\
  \n`localhost/onlinecourse/page2.php`\n\n让我展示两个页面的截图：\n\n我们在 `page1.php` 提交后没有打印任何内容。所以这是输入界面：\n\
  \n![5-2-1](img/image00254.jpeg)\n\n点击提交后，我们再次看到表单。现在执行 `page2.php` 后，我们得到：\n\n![5-2-2](img/image00255.jpeg)\n\
  \n我的浏览器正在运行一个 Cookie，计数为 1，guest cookie 计数为 2。\n\n希望在你执行 `page2.php` 后已经过了 60 秒！\n\
  \n再次执行：`localhost/onlinecourse/page2.php`\n\n![5-2-3](img/image00256.jpeg)\n\n我浏览器的\
  \ Cookie 单独计数为 1。guest cookie 已过期。也就是说，Cookie 在 60 秒后会被自动删除。\n\n在使用应用程序时我们可能需要用到\
  \ Cookie。\n\n事实上，当你浏览某些网站时，它们会公开询问你：“我们网站使用 Cookie，这会用到你的信息，你接受还是拒绝？”你遇到过这种情况吗？如果你至今未曾留意，以后请留意观察！\n\
  \n---\n\n#### 5.3 过滤器\n\n---\n\n过滤器用于验证和清理用户的输入。验证数据是判断数据是否符合正确的形式。清理数据是从数据中移除任何非法字符。\n\
  \n在使用表单时，我们已经讨论过用户输入的验证。\n\nPHP 过滤器扩展拥有检查用户输入所需的许多函数，旨在使数据验证更轻松、更快捷。\n\n**为什么我们需要过滤器？**\n\
  \n许多 Web 应用程序接收外部输入。外部输入/数据可以是：\n\n*   来自表单的用户输入\n*   Cookie\n*   服务器变量\n*   数据库查询结果\n\
  *   Web 服务数据\n\n强烈建议始终验证外部数据！无效的提交数据可能导致安全问题并破坏你的网页！通过充分利用 PHP 过滤器，你可以确保应用程序获得正确的输入！\n\
  \n有用于验证和清理数据的过滤器。我们来看看列表！\n\n**验证过滤器：**\n\n![5-3-1-validatingfilter](img/image00257.jpeg)\n\
  \n**清理过滤器：**\n\n![5-3-2sanitizingfilter](img/image00258.jpeg)\n\n**参考：** [`www.php.net/manual/en/filter.filters.php`](https://www.php.net/manual/en/filter.filters.php)\n\
  \n**我们将在哪里使用这些过滤器？**\n\n如果你还记得表单中邮箱地址的验证，我们使用了一个带有 2 个参数的 `filter_var()` 函数。这些过滤器\
  \ ID 将在该函数内部使用。我们现在将通过充分的示例来讨论 `filter_var()` 函数。\n\n**`filter_var()` 函数：**\n\n\
  `filter_var()` 函数用于验证和清理数据。它使用指定的过滤器来过滤单个变量。它接受两个数据：你要检查的变量，以及要用于该变量的检查类型（过滤器 ID）。\n\
  \n我们将从上面的列表中查看几个 ID：\n\n*   清理字符串 - 它从字符串中移除所有 HTML 标签\n*   验证整数 - 它检查变量是否为整数（0\
  \ 不属于整数的一部分，因此可能返回 false，我们将在实践环节中探讨解决方案）\n*   验证 IP 地址 - 它检查变量是否为有效的 IP 地址\n* \
  \  清理和验证 URL - 它将先清理 URL，然后再验证它\n\n**实践：**\n\n创建一个名为 `filter.php` 的新页面（或任何你想要的文件名）。在新页面中编写此代码！\n\
  \n```php\n<?php\n$str = \"<h3>Hello World!</h3>\";\n$int = 0;\n$float = 100.09;\n\
  $ip = \"127.0.0.1\";\n$url1 = \"www.google.com\";\n$url2 = \"https://www.google.com\"\
  ;\n\necho \"<p>Before Sanitizing and Validating: </p>\";\necho \"<p> str = \".$str.\"\
  </p>\";\necho \"<p> int = \".$int.\"</p>\";\necho \"<p> float = \".$float.\"</p>\"\
  ;\necho \"<p> ip = \".$ip.\"</p>\";\necho \"<p> url1 = \".$url1.\"</p>\";\necho\
  \ \"<p> url2 = \".$url2.\"</p>\";\n\necho \"<p>Applying Sanitizing and Validating\
  \ Filters: </p>\";\n$str = filter_var($str,FILTER_SANITIZE_STRING);\necho \"<p>\
  \ str = \". $str . \"</p>\";\nif(filter_var($int, FILTER_VALIDATE_INT) === 0){\n\
  \  echo \"<p> int = \".filter_var($int, FILTER_VALIDATE_INT).\"</p>\";\n}\nif(!filter_var($float,\
  \ FILTER_VALIDATE_INT)){\n  echo \"<p>float is not an integer</p>\";\n}\nif(filter_var($ip,\
  \ FILTER_VALIDATE_IP)){\n  echo \"<p>ip - Valid IP address</p>\";\n}\n$url1 = filter_var($url1,FILTER_SANITIZE_URL);\n\
  echo \"<p> url after sanitizing = \".$url1.\"</p>\";\n$url1 = filter_var($url1,FILTER_VALIDATE_URL);\n\
  echo \"<p> url after validating = \".$url1.\"</p>\";\n$url2 = filter_var($url2,FILTER_SANITIZE_URL);\n\
  echo \"<p> url after sanitizing = \".$url2.\"</p>\";\n$url2 = filter_var($url2,FILTER_VALIDATE_URL);\n\
  echo \"<p> url after validating = \".$url2.\"</p>\";\n?>\n```\n\n执行后，我们得到如下输出：\n\
  \n![5-3-1](img/image00259.jpeg)\n\n*   当我们带 HTML 标签打印 `$str` 时，HTML 会在打印时被应用。当我们清理字符串时，它会移除\
  \ HTML 标签并仅打印字符串。\n*   当我们检查值为 0 的整数时，我们必须使用 if 条件来处理。同样，我们使用相同的过滤器通过浮点数输入来验证整数。\n\
  *   `$url1` 和 `$url2` 对用户来说是相同的 URL。但只有 `$url2` 通过验证并被打印。虽然我们这里没有清理 URL，但我们可以看到对\
  \ `$url1` 和 `$url2` 进行验证的差异。\n\n我们将看一个在特定范围内验证整数的示例。\n\n```php\n<?php\n$int1 = 50;\n\
  $int2 = 150;\necho \"<p> int1 = \".$int1.\" int2 = \".$int2.\"</p>\";\n\nif (filter_var($int1,\
  \ FILTER_VALIDATE_INT, array(\"options\" => array(\"min_range\"=>1, \"max_range\"\
  =>100))) ) {\n   echo \"<p>int1 value is within 1-100</p>\";\n} \nelse {\n   echo\
  \ \"<p>int1 value is not within 1-100</p>\";\n}\n\nif (filter_var($int2, FILTER_VALIDATE_INT,\
  \ array(\"options\" => array(\"min_range\"=>1, \"max_range\"=>100))) ) {\n   echo\
  \ \"<p>int2 value is within 1-100</p>\";\n} \nelse {\n   echo \"<p>int2 value is\
  \ not within 1-100</p>\";\n}\n?>\n```\n\n![5-3-2](img/image00260.jpeg)\n\n同样，我们应该善用这些过滤器来清理和验证用户数据。\n\
  \n---\n\n#### 5.4 处理 JSON 数据\n\n---\n\nJSON 代表 JavaScript Object Notation（JavaScript\
  \ 对象表示法）。它是一种用于存储和交换数据的语法。\n\n由于 JSON 格式是基于文本的格式，它可以轻松地发送给服务器并从服务器接收，且可被任何编程语言用作数据格式。\n\
  \n因此，我们将在本节中学习如何使用 PHP 处理 JSON 数据。\n\n我们有 2 个内置函数来处理 JSON。\n\n*   `json_encode()`\
  \ - 将值编码为 JSON 格式\n*   `json_decode()` - 将 JSON 对象解码为 PHP 对象或关联数组。\n\n既然你们中许多人可能对\
  \ JSON 不熟悉，我们将这样做：\n\n*   练习一个将关联数组转换为 JSON 格式的示例\n*   使用输出的 JSON 数据并将其解码回数组\n\n\
  **实践：**\n\n**将数组转换为 JSON：**\n\n```php\n<?php\n$array = array(\"Test1\" => 75, \"\
  Test2\" => 80, \"Test3\" => 60);\necho \"Array: \";\nvar_dump($array);\necho \"\
  <p>JSON format: </p>\";\necho json_encode($array);\n?>\n```\n\n![5-4-1](img/image00261.jpeg)\n\
  \n**将 JSON 转换为数组：**\n\n```php\n<?php\n$json = '{\"Test1\":75,\"Test2\":80,\"Test3\"\
  :60}';\necho \"<p> JSON format: \".$json.\"</p>\";\necho \"<p>JSON Decode: </p>\"\
  ;\nvar_dump(json_decode($json));\necho \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\
  ?>\n```\n\n\n\n\n`json_decode()`函数默认返回一个对象。`json_decode()`函数有一个第二个参数，当设置为`true`时，JSON\
  \ 对象会被解码为关联数组。\n\n![5-4-2](img/image00262.jpeg)\n\n你还记得第 2 章的 Object 数据类型吗？你可以将这个结果对象视为对象数据类型。\n\
  \n由于解码返回的是一个对象，我们可以单独访问解码后的值。\n\n我们可以通过 2 种方式访问：对象和数组。让我们通过一个代码片段示例来看看：\n\n```php\n\
  <?php\n$json = '{\"Test1\":75,\"Test2\":80,\"Test3\":60}';\necho \"<p> JSON format:\
  \ \".$json.\"</p>\";\necho \"<p>JSON Decode: </p>\";\nvar_dump(json_decode($json));\n\
  echo \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\n\
  $array = json_decode($json,true);\n$object = json_decode($json);\n\necho \"<p>Accessing\
  \ via Array: </p>\";\necho \"Test1 = \".$array[\"Test1\"];\necho \"<p>Accessing\
  \ via Object: </p>\";\necho \"Test2 = \".$object->Test2;\n\necho \"<p>Using Loops</p>\"\
  ;\nforeach ($array as $key => $value) {\n  echo $key.\" - \".$value.\"<br>\";\n\
  }\n?>\n```\n\n我只是在之前的代码片段中添加了检索行。\n\n![5-4-3](img/image00263.jpeg)\n\n至此，本章结束！\n\
  \nPHP 的学习和实践环节将为你提供实操经验。\n\n电子书的其余部分是关于使用 Web 应用程序实现这些概念。\n\n***\n\n### 第 6 章：设计\
  \ Web 应用程序\n\n***\n\n#### 6.1 项目大纲\n\n#### 6.2 数据库设计\n\n#### 6.3 环境搭建\n\n#### 6.4\
  \ 设置数据库表\n\n#### 6.5 Web 应用程序模板\n\n***\n\n#### 6.1 项目大纲\n\n***\n\n在接下来的章节中，我们将开发一个小型\
  \ Web 应用程序。通过开发该应用程序，我们将学习如何将应用程序连接到数据库并为用户生成动态内容。\n\n我们将该项目称为**在线课程系统**！\n\n**什么是在线课程系统？**\n\
  \n在在线课程系统中，将有来自各种主题的课程，由讲师编写并上传到网站。学习者必须注册网站并报名课程才能访问内容。学习者的学习进度将自动记录并作为报告提供给讲师。\n\
  \n我们将尽可能简单地实现，而不使任何事情复杂化。原因是，我们正在学习如何将 PHP 页面作为应用程序进行开发，并将它们连接到数据库以进行数据处理。\n\n**该应用程序需要哪些流程？**\n\
  \n我们大致有 2 类用户——讲师和学习者：\n\n![6-1-tasks](img/image00264.jpeg)\n\n以上是主要任务/流程的大纲。这并不意味着你仅限于这些任务。你可以根据需要扩展并包含任意数量的任务。本书将只涉及这些任务。\n\
  \n**项目流程：**\n\n菜单中有 3 个页面：首页、课程和登录\n\n*   在**首页**，我们将展示项目信息、列出课程及报名人数以及注册讲师列表。\n\
  \n*   在**课程页面**，我们将提供搜索功能以查找课程。\n\n    *   从搜索课程得到的搜索结果页面\n\n    *   从搜索结果链接进入的课程详情页面\n\
  \n*   在**登录页面**，我们将提供登录表单和一个注册网站的链接。\n\n    *   从登录页面链接进入的注册页面\n\n    *   登录后的用户仪表盘页面\n\
  \n    *   修改个人资料链接\n\n    *   讲师创建课程和内容\n\n    *   学习者报名和访问课程\n\n    *   讲师查看学习者进度报告\n\
  \n作为讲师：\n\n*   你需要注册\n*   你需要登录\n*   你需要创建课程并提供详情\n*   你需要上传文件作为课程内容\n*   你可以查看报名学习者列表及其进度\n\
  *   你可以修改你的个人资料\n\n作为学习者：\n\n*   你需要搜索课程\n*   你的搜索结果将是一个课程主题链接列表\n*   你将浏览链接并找到课程详情，如资格要求和成果\n\
  *   你需要报名\n*   你需要浏览课程内容，这些学习活动将被记录\n*   进度条将通知你完成了多少\n*   你可以修改你的个人资料\n\n希望从这里开始，将是完整的实操，少学多练！\n\
  \n祝学习和编码愉快！\n\n***\n\n#### 6.2 数据库设计\n\n***\n\n在本节中，我将为你提供我们即将用于此项目的数据库的数据字典。\n\n\
