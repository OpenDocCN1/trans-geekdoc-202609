  \n这次，我们将插入带有名为 `course_code` 的自增字段的数据。因为它是自增字段，每当插入一条记录，计数就会增加。如果我们提供 `NULL` 作为值，它将自动计算现有记录数并在计数上加一。假设是第一条记录，第一门课程将为\
  \ 1，当是第二门课程时，第二门课程的课程代码将为 2。\n\n```php\n<?php\nrequire('connect.php');\nif(isset($_POST['newcourse'])){\n\
  \ $title = $_POST['txtcourse'];\n $instruct = $_POST['txtinstruct'];\n $outcome\
