  \ 和 `$instructor` 变量的值在实际应用中从上一页传递过来。目前，我们只分配值。在下一章中，我们将相应地修改代码。\n\n##### 阶段 2：设计修改\n\
  \n用下面的代码替换 `main` 标签元素：\n\n```html\n<main>\n<section>\n<h3> 编辑课程详情 </h3>\n<p>\n\
