  \n至此，本章结束！下一章将把所有这些部分整合成一个连贯且可工作的应用程序。\n\n---\n\n### 第 8 章：使用应用程序\n\n---\n\n*  \
  \ 8.1 注册和登录\n*   8.2 用户仪表板\n*   8.3 修改个人资料\n*   8.4 管理课程和内容\n*   8.5 报名和课程访问\n*\
  \   8.6 主页\n*   8.7 应用程序演示\n\n---\n\n#### 8.1 注册和登录\n\n---\n\n使用任何应用程序的第一步是注册。创建账户后，你将能够登录。每当你想要访问时，都需要登录。\n\
  \n本节将指导你完成注册和登录流程。\n\n我们已经完成了用户详细信息的注册。我们尚未完成登录表单。让我为你描述一下流程：\n\n注册 -> 登录 -> 用户仪表板\n\
  \n完成注册后，你将被带到登录页面。当你成功登录时，你将被带到相应的用户仪表板页面。仪表板是你可以从中访问用户相关页面的地方。我们显然会有 2 种类型的仪表板：一种供讲师使用，另一种供学习者使用。\n\
  \n我们需要 3 个页面：\n\n*   `register.php`\n*   `login.php`\n*   `dashboard.php`\n\n我们必须从注册页面重定向到登录页面，同样从登录页面重定向到仪表板页面。在登录页面，我们将创建一个指向注册页面的链接。我们将逐个完成。在此之前，先创建另外\
  \ 2 个页面 `login.php` 和 `dashboard.php`。\n\n让我再次提醒你，要么创建文件并复制内容，要么使用“另存为”选项来创建这 2\
  \ 个文件。只有创建文件后，我们才能从 `register.php` 重定向到 `login.php`。如果没有名为 `login.php` 的页面，重定向时将会遇到\
  \ 404 页面未找到错误。\n\n\n\n\n\n##### 注册与登录流程\n\n###### 注册 - 重定向到登录\n\n希望你已准备好文件。我们现在将包含代码。完成登录流程后我们将进行测试。\n\
  \n在顶部的 PHP 代码段中有一个 `if` 代码块：\n\n```php\nif($check_insert1 and $check_insert2){\n\
  \  echo \"<script>alert('Registration successful!');</script>\";\n}\n```\n\n我们将在此\
  \ `echo` 语句中通过 JavaScript 发出重定向命令。为什么要这样做？因为我们通过此 `alert()` 获取成功消息，所以必须在此消息之后触发重定向。如果我们在\
  \ PHP 中编写重定向代码，这条警报消息将会被错过。为了稳妥起见，我们将使用 JS 编写。\n\n将代码更改为：\n\n```php\nif($check_insert1\
  \ and $check_insert2){\n  echo \"<script>alert('Registration successful!');\n  window.location.replace('login.php');</script>\"\
  ;\n}\n```\n\n这段代码表示当前页面必须替换为参数中的 URL。\n\n###### 登录流程\n\n我们将设计一个登录表单，然后像往常一样包含 PHP\
  \ 代码。登录成功后，我们将重定向到 `dashboard.php`。让我们开始吧。\n\n####### 设计表单：login.php\n\n将 `title`\
  \ 标签的内容更改为 \"User Login\"，并用以下代码替换 `main` 标签元素：\n\n```html\n<main>\n  <section>\n\
  \    <h3> User Login </h3>\n    <p>\n      <form method=\"post\" name=\"frmlogin\"\
  >\n        <p><input type=\"email\" name=\"txtuser\" size=\"40\" placeholder=\"\
  Enter your email\"></p>\n        <p><input type=\"password\" name=\"txtpwd\" size=\"\
  40\" placeholder=\"Enter your password\"></p>\n        <p><input type=\"submit\"\
  \ name=\"login\" value=\"Login\" class=\"frmbtn\"></p>\n      </form>\n    </p>\n\
  \  </section>\n</main>\n```\n\n不要输入任何详细信息！仅执行以查看页面： <http://localhost/onlinecourse/login.php>\n\
  \n![8-1-1](img/image00340.jpeg)\n\n####### 认证代码：login.php\n\n我们将像往常一样在页面顶部包含认证部分。\n\
  \n```php\n<?php\nsession_start();\nrequire('connect.php');\n$auth = true;\n$hashedpwd\
  \ = '';\nif(isset($_POST['login'])){\n  $username = $_POST['txtmail'];\n  $password\
  \ = $_POST['txtpwd'];\n  $select_user = mysqli_query($con,\"SELECT * FROM userlogin\
  \ WHERE user_mail='$username'\");\n  if($user = mysqli_fetch_row($select_user)){\n\
  \    $hashedpwd = $user[1];\n  }\n  else{\n    $auth = false;\n  }\n  if(!password_verify($password,$hashedpwd)){\n\
  \    $auth = false;\n  }\n  if($auth){\n    $_SESSION['usersession'] = $username;\n\
  \    echo \"<script>window.location.replace('dashboard.php')</script>\";\n  }\n\
  \  else{\n    echo \"<script>alert('Invalid username or password!')</script>\";\n\
  \  } \n}\n?>\n```\n\n我们来看看解释：\n\n```php\nsession_start();\n```\n\n我们将为此认证使用 `session_start()`，因为我们必须将用户名存储为会话变量。这意味着，直到用户注销/关闭会话，会话变量将保持活跃。\n\
  \n```php\n$auth = true;\n$hashedpwd = '';\n```\n\n我们初始化两个变量。如果用户名和密码与数据库记录匹配，`$auth`\
  \ 将保持 `true` 直到代码结束。如果 `$auth` 在某处变为 `false`，则意味着用户名或密码不匹配，即认证失败。`$hashedpwd` 稍后将保存用户名匹配时的密码字段。\n\
  \n```php\n$select_user = mysqli_query($con,\"SELECT * FROM userlogin WHERE user_mail='$username'\"\
  );\nif($user = mysqli_fetch_row($select_user)){\n  $hashedpwd = $user[1];\n}\nelse{\n\
  \  $auth = false;\n}\n```\n\n我们搜索 `userlogin` 表中与用户名匹配的记录。\n\n*   如果存在该用户名的用户，则将密码字段赋值给\
  \ `$hashedpwd` 变量。\n*   如果不存在该用户名的用户，则将 `$auth` 变量设置为 `false`。\n\n```php\nif(!password_verify($password,$hashedpwd)){\n\
  \  $auth = false;\n}\n```\n\n我们将表单中输入的密码与表中存储的哈希密码进行比较。我们使用专门为此目的设计的 `password_verify()`\
  \ 函数。如果密码不匹配，`$auth` 将变为 `false`。\n\n```php\nif($auth){\n  $_SESSION['usersession']\
  \ = $username;\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
  ;\n}\nelse{\n  echo \"<script>alert('Invalid username or password!')</script>\"\
  ;\n}\n```\n\n如果 `$auth` 在所有这些检查下都保持 `true`，我们将 `$username` 的值赋给会话变量 `$_SESSION['usersession']`。在此之后，我们重定向到仪表板页面。如果\
  \ `$auth` 在任何检查中变为 `false`，我们将打印无效登录消息。\n\n####### $auth 何时变为 false？\n\n*   当用户名不存在时\n\
  *   当输入的密码与表中已存储的哈希密码值不匹配时（通过 `password_verify()` 函数检查）\n\n登录部分到此结束。我们将对 `dashboard.php`\
  \ 进行一些更改，以便在此页面显示从登录页面传来的会话变量值。\n\n##### 会话变量：dashboard.php\n\n将 `title` 标签的内容更改为\
  \ \"User Dashboard\"。\n\n将以下代码行放在页面顶部：\n\n```php\n<?php\nsession_start();\nrequire('connect.php');\n\
  ?>\n```\n\n建议将 `session_start()` 放在页面开头。\n\n像往常一样，用以下代码替换 `main` 标签内容：\n\n```php\n\
  <main>\n  <section>\n    <h3> User Dashboard </h3>\n    <p>\n      <?php \n    \
  \  $usersession = '';\n      if(isset($_SESSION['usersession'])){\n        $usersession\
  \ = $_SESSION['usersession'];\n      }\n      echo \"<p>Hello \".$usersession.\"\
  </p>\";\n      ?>\n    </p>\n  </section>\n</main>\n```\n\n我们只是将会话变量的值赋给变量 `$usersession`\
  \ 并将其打印出来。\n\n##### 执行\n\n现在我们来检查一下完整流程吧？\n\n这次，我们将：\n\n*   注册一名学习者\n*   登录该学习者\n\
  *   在仪表板页面查看学习者的用户名\n\n我们必须将其作为一个应用程序来执行。所以我们将从主页跳转到注册页面。\n\n*   访问 <http://localhost/onlinecourse/>\n\
  *   点击 Login\n*   点击 Register here 链接。\n\n让我以学习者身份注册/报名：\n\n要输入的详细信息：\n\n*   Who\
  \ are you? Learner（你是谁？ 学习者）\n*   Email - learner1@onlinecourse.com\n*   Password\
  \ - password\n*   Full Name - Learner 1\n*   Details - First learner of this platform\n\
  \n让我展示这个过程。\n\n*这是一个 GIF 图片。请确保您的设备支持 GIF。*\n\n![1604664851-registration-login](img/image00341.gif)\n\
  \n希望你也拥有相同的应用流程，中间没有任何 Bug。\n\n别忘了检查 phpMyAdmin - `learners` 和 `userlogin` 表！\n\n\
  ![8-1-2](img/image00342.jpeg)\n\n![8-1-3](img/image00343.jpeg)\n\n##### 如果会话正在运行，如何重定向到仪表板？\n\
  \n我们还有一项任务要做。万一你不知不觉关闭了浏览器标签页，但你的会话仍未过期，我们必须将登录页面重定向到仪表板，而无需再次询问登录详细信息。\n\n因此，我们将在\
  \ **login.php** 文件开头添加此代码：\n\n```php\nsession_start();\nif(isset($_SESSION['usersession'])){\n\
  \  echo \"<script>window.location.replace('dashboard.php')</script>\";\n}\nrequire('connect.php');\n\
  ```\n\n*   在浏览器的 2 个标签页中执行 <http://localhost/onlinecourse/>。\n*   尝试在浏览器的一个标签页中登录。\n\
  *   在浏览器的另一个标签页中点击 Login。你将被重定向到 `dashboard.php`。\n\n我们还必须对仪表板页面进行更多更改。我们将在下一节中进行。\n\
  \n#### 8.2 用户仪表板\n\n仪表板是你可以从中访问所有必要链接的地方。\n\n在讲师的仪表板中，我们可以放置创建课程、编辑课程、上传/删除内容、查看已注册学习者进度报告、更改个人资料和注销的链接。\n\
  \n在学习者的仪表板中，我们可以放置已注册课程、访问课程、更改个人资料和注销的链接。\n\n无论我们创建哪个页面，我们有两个选择：\n\n*   在每个页面中放置所有链接\n\
  *   在单个页面（仪表板）中放置所有链接，并在每个页面中放置仪表板链接\n\n\n\n\n\n我们将采用第二种方案。我们将创建一个仪表盘页面，将所有链接放在此处，然后在需要的页面中链接该仪表盘。原因在于，当你想要扩展项目的功能/设施时，可以轻松地将它们添加到仪表盘中以供链接。\n\
  \n对于每个仪表盘链接，我们都必须进行几项检查！\n\n*   检查用户是否已登录\n*   检查用户类别 - 讲师或学习者\n\n**页面 - 检查与登出：**\n\
  \n*   我们将创建一个名为 `check.php` 的新 PHP 页面，其中将包含上述所有检查。对于每个链接到仪表盘的页面，我们将引入 `check.php`\
  \ 文件，并根据用户类别显示相应的仪表盘。\n*   我们将创建一个名为 `logout.php` 的新 PHP 页面。如果学习者试图访问讲师的页面，反之亦然，我们将强制其登出。此外，我们还需要提供一个登出链接。\n\
  \n***\n\n**登出会话：**\n\n只需创建一个名为 `logout.php` 的空白文件，并放入以下代码：\n\n```php\n<?php\nsession_start();\n\
  if(isset($_SESSION['usersession'])){\n unset($_SESSION['usersession']);\n}\nheader('Location:\
  \ login.php');\n?>\n```\n\n在取消设置会话变量后，我们重定向到 `login.php` 页面。`header()` 是一个用于重定向的\
  \ PHP 函数。到目前为止，我们使用 JavaScript 是因为我们需要向用户显示弹出消息。由于此处没有显示消息，我们使用了 PHP 函数来实现此目的。\n\
  \n执行 `http://localhost/onlinecourse/logout.php` 将带你进入 `login.php` 页面。\n\n***\n\n\
  **检查会话与类别：**\n\n我们将执行以下操作：\n\n*   检查用户是否已登录\n*   使用函数查找用户类别（讲师/学习者）\n*   使用函数查找用户姓名\n\
  \n只需创建一个名为 `check.php` 的空白文件，并放入以下代码：\n\n```php\n<?php\nsession_start();\nrequire('connect.php');\n\
  //functions\nfunction get_category($con,$id){\n $get_cat = mysqli_query($con,\"\
  SELECT * FROM userlogin WHERE user_mail = '$id'\");\n if($cat = mysqli_fetch_row($get_cat)){\n\
  \ return $cat[2];\n } \n}\nfunction get_name($con,$id,$cat){\n $str = '';\n if($cat\
  \ == 'instructor'){\n  $str = \"SELECT * FROM instructors WHERE instruct_mail =\
  \ '$id'\";\n }\n if($cat == 'learner'){\n  $str = \"SELECT * FROM learners WHERE\
  \ learn_mail = '$id'\";\n }\n $get_fname = mysqli_query($con,$str);\n if($name =\
  \ mysqli_fetch_row($get_fname)){\n   return $name[1];\n }  \n}\n//checking session\n\
  $usersession = '';\n$category = '';\n$name = '';\nif(isset($_SESSION['usersession'])){\n\
  \ $usersession = $_SESSION['usersession'];\n $category = get_category($con,$usersession);\n\
  \ $name = get_name($con,$usersession,$category);\n}\nelse{\n echo \"<script>window.location.replace('login.php');</script>\"\
  ;\n} \n?>\n```\n\n我们将首先查看这些函数：\n\n```php\nfunction get_category($con,$id){\n  $get_cat\
  \ = mysqli_query($con,\"SELECT * FROM userlogin WHERE user_mail = '$id'\");\n  if($cat\
  \ = mysqli_fetch_row($get_cat)){\n\treturn $cat[2];\n  }\n}\n```\n\n我们向该函数传递 2 个参数——数据库连接资源和用户的邮箱\
  \ ID。使用该邮箱 ID，我们查找用户的类别并返回。\n\n```php\nfunction get_name($con,$id,$cat){\n   $str\
  \ = '';\n   if($cat == 'instructor'){\n\t  $str = \"SELECT * FROM instructors WHERE\
  \ instruct_mail = '$id'\";\n   } \n   if($cat == 'learner'){\n\t  $str = \"SELECT\
  \ * FROM learners WHERE learn_mail = '$id'\";\n   }\n   $get_fname = mysqli_query($con,$str);\n\
  \   if($name = mysqli_fetch_row($get_fname)){\n\t  return $name[1];\n   }  \n}\n\
  ```\n\n我们向该函数传递 3 个参数——数据库连接资源、邮箱 ID 和用户类别。使用类别，我们查询相应的表。我们执行查询并返回用户姓名。\n\n我们现在来看会话代码：\n\
  \n```php\n//checking session\n$usersession = '';\n$category = '';\n$name = '';\n\
  if(isset($_SESSION['usersession'])){\n  $usersession = $_SESSION['usersession'];\n\
  \  $category = get_category($con,$usersession);\n  $name = get_name($con,$usersession,$category);\n\
  }\nelse{\n  echo \"<script>window.location.replace('login.php');</script>\";\n}\n\
  ```\n\n我们检查会话变量是否已设置。如果已设置，我们将其值复制到 `$usersession` 变量中。由于 `$usersession` 是一个邮箱地址（讲师表和学习者表的主键），我们将其作为参数发送给\
  \ `get_category()` 函数，并将返回值赋给 `$category` 变量。同样，我们将 `$category` 作为第三个参数发送给 `get_name()`，并将返回值赋给\
  \ `$name` 变量。\n\n如果会话变量未设置，用户将被送回 `login.php`。\n\n重定向的目的：只有已登录用户才能访问此页面！\n\n因此，包含\
  \ `check.php` 文件的任何页面都将有三个可用变量：\n\n*   `$usersession` - 邮箱 ID / 主键\n*   `$category`\
  \ - 讲师 / 学习者\n*   `$name` - 用户全名\n\n我们要设计仪表盘了吗？\n\n***\n\n**讲师仪表盘：**\n\n我们将从讲师开始。\n\
  \n讲师需要哪些菜单？\n\n*   课程 - 创建课程 / 编辑课程 / 上传内容 / 查看学习者进度报告\n*   个人资料 - 修改密码 / 修改个人资料\n\
  *   登出 - 退出仪表盘\n\n**学习者仪表盘：**\n\n我们现在来看学习者。\n\n学习者需要哪些菜单？\n\n*   报名 - 已报名课程列表 /\
  \ 访问课程\n*   个人资料 - 修改密码 / 修改个人资料\n*   登出 - 退出仪表盘\n\n从上述两个列表中，我们可以理解，我们必须为个人资料修改设计一个单独的页面。登出将只是一个指向\
  \ `logout.php` 的链接。个人资料设计将在下一节处理。\n\n我们现在将设计仪表盘。我们需要修改上一节中临时提供的代码片段。\n\n将顶部 PHP\
