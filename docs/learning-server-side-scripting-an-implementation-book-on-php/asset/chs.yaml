  <?php\necho \"checking...              ... for spaces\";\n?>\n```\n\n将只打印单个空格！\n\
  \n![2-1-5](img/image00153.jpeg)\n\n希望你现在清楚 `echo` 和 `print` 语句的作用！它们只是打印到屏幕上！\n\n\
  **注意-1：**\n\n为了演示 `echo`、`print`、空白符，我们多次使用了 `<?php ?>` 标签。实际上这不是必须的！\n\n让我把代码改成下面这样：\n\
  \n```php\n<?php\n\n//normal echo statement\necho \"Hello!\";\n\n//echo statement\
