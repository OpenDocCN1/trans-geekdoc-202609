  ;\n }\n else{\n   $newpath = 'uploads/';\n   if (!is_dir($newpath)) {\n      mkdir($newpath,\
  \ 0777, true);\n   }\n   $filepath = $newpath.strtotime(\"now\").'.'.$file_ext;\n\
  \   move_uploaded_file($filetmp,$filepath); \n   $insert = mysqli_query($con,\"\
  INSERT INTO contents VALUES (NULL,  '$title', $course, '$filepath')\");\n   if($insert){\n\
  \      echo \"<script>alert('内容上传成功！');</script>\";\n   }\n   else{\n      echo\
  \ \"<script>alert('出了点问题，请重试！');</script>\";\n   }\n  } \n}\n?>\n`\n\n让我解释一下文件上传部分：\n\
  \n```php\n$filename = $_FILES['txtfile']['name'];\n$filetmp =$_FILES['txtfile']['tmp_name'];\n\
  ```\n\n这些行将提取上传文件的文件名及其存储的临时位置。\n\n```php\n$filestring = explode('.',$_FILES['txtfile']['name']);\n\
  $file_ext= strtolower(end($filestring));\n```\n\n我们用字符串“点”分割文件名并找到文件的扩展名。\n\n```php\n\
  $exts = array('txt','rtf','doc','docx','pdf','ppt','pptx','mp4');\nif(in_array($file_ext,$exts)===false){\
  \ \n\techo \"<script>alert('你只能上传 txt, rtf, doc, docx, pdf, ppt, pptx, mp4 文件');</script>\"\
  ;\n}\nelse{ }\n```\n\n\n\n我们定义了一个数组变量 `$exts` 来存放允许的扩展名。我们使用 `in_array()` 函数将提取的扩展名与数组中的元素（扩展名）进行比较。如果扩展名不被允许，我们将以弹窗形式打印一条消息。如果扩展名被允许，则执行\
  \ `else` 部分。\n\n```\n$newpath = 'uploads/';\nif (!is_dir($newpath)) {\n  mkdir($newpath,\
  \ 0777, true);\n}\n```\n\n我们将文件存储在 `onlinecourse` 文件夹内的 `uploads` 文件夹中。但是我们有这个文件夹吗？没有！所以我们使用\
  \ `is_dir()` 函数检查该文件夹是否存在。如果不存在，它将创建一个名为 `uploads` 的文件夹，并赋予放置内容的权限。\n\n```\n$filepath\
  \ = $newpath . strtotime(\"now\") . '.' . $file_ext;\nmove_uploaded_file($filetmp,\
  \ $filepath);\n```\n\n在这里，我们尝试将文件重命名为上传时间的字符串。这可以避免同名文件被覆盖。我们获取当前时间的字符串值，并加上来自 `$file_ext`\
  \ 变量的适当扩展名。新文件路径将是 `uploads/时间字符串格式.扩展名`。我们将文件从临时位置移动到新路径。\n\n```\n$insert = mysqli_query($con,\
  \ \"INSERT INTO contents VALUES (NULL, '$title', $course, '$filepath')\");\nif ($insert)\
  \ {\n  echo \"<script>alert('Content Uploaded successfully!');</script>\";\n} else\
  \ {\n  echo \"<script>alert('Something went wrong, Try again!');</script>\";\n}\n\
  ```\n\n我们将文件路径插入数据库。插入语句的第三个值是 `1`，这是一个整数。所以，我们没有加引号。\n\n在执行此文件之前，我们需要：\n\n*   创建一些扩展名为\
  \ `txt`、`rtf`、`doc`、`docx`、`pdf`、`ppt`、`pptx` 和 `mp4` 的文件。\n*   不要将文件放在 `htdocs`\
  \ 中。将其放在其他地方（如桌面）。\n\n执行后，您可以：\n\n*   尝试上传其中一个文件\n*   尝试上传一些图片，因为它们的扩展名不被允许，检查是否显示带有消息的弹窗\n\
