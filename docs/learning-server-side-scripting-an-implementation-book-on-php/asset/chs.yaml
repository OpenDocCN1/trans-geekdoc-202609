  \n![7-6-1](img/image00327.jpeg)\n\n现在不要做任何更改或点击更新。我们到目前为止还没有添加更新代码。\n\n##### 阶段\
  \ 3：PHP 中更新字段\n\n我们在顶部有一个 PHP 片段，对吧？将这些行添加到该片段中。为了清晰起见，我将发布完整代码。\n\n\n\n\n#####\
  \ PHP 课程更新与搜索功能实现\n\n###### 更新课程信息\n\n```php\n<?php\nrequire('connect.php');\n$course\
  \ = 1;\n$instructor = 'instructor1@onlinecourse.com';\n$get_details = mysqli_query($con,\
  \ \"SELECT * FROM courses WHERE course_code = $course\");\nif ($details = mysqli_fetch_row($get_details))\
  \ {\n    $titleval = $details[1];\n    $describeval = $details[3];\n    $outcomeval\
  \ = $details[4];\n    $eligibleval = $details[5];\n}\n\n// update part\nif (isset($_POST['editcourse']))\
  \ {\n    $course = $_POST['txtcourse'];\n    $instructor = $_POST['txtinstruct'];\n\
  \    $title = $_POST['txttitle'];\n    $describe = $_POST['txtdesc'];\n    $outcome\
  \ = $_POST['txtoutcome'];\n    $eligible = $_POST['txteligible'];\n    $update =\
  \ false;\n    if ($title != $titleval) {\n        $update1 = mysqli_query($con,\
  \ \"UPDATE courses SET course_title = '$title' WHERE course_code = $course\");\n\
  \        $titleval = $title;\n        $update = true;\n    }\n    if ($describe\
  \ != $describeval) {\n        $update2 = mysqli_query($con, \"UPDATE courses SET\
  \ course_description = '$describe' WHERE course_code = $course\");\n        $describeval\
  \ = $describe;\n        $update = true;\n    }\n    if ($outcome != $outcomeval)\
  \ {\n        $update3 = mysqli_query($con, \"UPDATE courses SET course_outcome =\
  \ '$outcome' WHERE course_code = $course\");\n        $outcomeval = $outcome;\n\
  \        $update = true;\n    }\n    if ($eligible != $eligibleval) {\n        $update4\
  \ = mysqli_query($con, \"UPDATE courses SET course_eligible = '$eligible' WHERE\
  \ course_code = $course\");\n        $eligibleval = $eligible;\n        $update\
  \ = true;\n    }\n    if ($update) {\n        echo \"<script>alert('Course Updated!');</script>\"\
  ;\n    }\n}\n?>\n```\n\n####### 代码逻辑说明\n\n我们定义了 `$titleval`、`$describeval`、`$outcomeval`、`$eligibleval`\
  \ 变量来保存从数据库查询到的值，这些值用于填充表单中的 HTML 元素。\n\n```php\nif (isset($_POST['editcourse']))\
  \ {\n    $title = $_POST['txtcourse'];\n    $describe = $_POST['txtdesc'];\n   \
  \ $outcome = $_POST['txtoutcome'];\n    $eligible = $_POST['txteligible'];\n```\n\
  \n这 4 个变量用于保存更新时通过表单提交的值。\n\n```php\nif ($title != $titleval) {\n    $update1 =\
  \ mysqli_query($con, \"UPDATE courses SET course_title = '$title' WHERE course_code\
  \ = $course\");\n    $titleval = $title;\n}\nif ($describe != $describeval) {\n\
  \    $update2 = mysqli_query($con, \"UPDATE courses SET course_description = '$describe'\
  \ WHERE course_code = $course\");\n    $describeval = $describe;\n}\nif ($outcome\
  \ != $outcomeval) {\n    $update3 = mysqli_query($con, \"UPDATE courses SET course_outcome\
  \ = '$outcome' WHERE course_code = $course\");\n    $outcomeval = $outcome;\n}\n\
  if ($eligible != $eligibleval) {\n    $update4 = mysqli_query($con, \"UPDATE courses\
  \ SET course_eligible = '$eligible' WHERE course_code = $course\");\n    $eligibleval\
  \ = $eligible;\n}\n```\n\n我们设置了 4 个条件判断：\n\n*   如果数据库中的课程标题值与表单字段值不匹配，则对课程标题字段执行更新操作\n\
  *   如果数据库中的课程描述值与表单字段值不匹配，则对课程描述字段执行更新操作\n*   如果数据库中的课程成果值与表单字段值不匹配，则对课程成果字段执行更新操作\n\
  *   如果数据库中的课程资格值与表单字段值不匹配，则对课程资格字段执行更新操作\n*   我们将提交的字段值赋给 `$titleval`、`$describeval`、`$outcomeval`、`$eligibleval`，因为这些变量将保存字段中更新后的值。\n\
  \n####### 为什么要逐个字段检查而不是使用 4 条更新语句？\n\n每一次数据库更新操作都是昂贵的。这意味着你需要检索字段、执行编辑并将其更新回数据库。为了最小化数据库复杂度并优化服务器资源，我们逐个字段进行检查。实际上，我们从不每次都修改所有字段。我们仅在字段需要修改时才更新。因此，作为开发人员遵循这种方法是一种良好的实践。\n\
  \n```php\nif ($update) {\n    echo \"<script>alert('Course Updated!');</script>\"\
  ;\n}\n```\n\n我们定义了一个布尔变量 `$update` 并初始化为 `false`。每当发生更新操作时，它会变为 `true`。如果为 `true`，则提示用户已执行更新。\n\
  \n显示错误相关消息并非总是必要。在开发阶段错误消息可能有帮助，但上线（实时环境）时，除非必要，否则尽量减少它们是良好的推荐做法。\n\n####### 操作演示\n\
