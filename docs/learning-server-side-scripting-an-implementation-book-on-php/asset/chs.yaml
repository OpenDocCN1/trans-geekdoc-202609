  \ Course** 按钮。\n\n![7-6-3](img/image00329.jpeg)\n\n当你按下确定后，页面将显示更新后的值。\n\n至此，本节结束！下一节我们将学习删除数据。\n\
  \n---\n\n#### 7.5 检索数据 - II\n\n---\n\n现在我们将学习如何为课程页面提供搜索功能。\n\n##### 搜索课程\n\n正如讨论的那样，我们将提供一个搜索框和一个提交按钮。我们将使用\
  \ SQL 运算符来筛选结果。\n\n我们将继续操作 `courses.php` 文件。\n\n*   在 `<main>` 标签内部，`<h3>` 标签下方，我们将放置一个包含搜索框的\
  \ `<div>`\n*   我们将放置一个按钮以启用搜索\n*   添加相应的 PHP 代码片段\n\n用以下代码替换 `<main>` 标签元素：\n\n\
  ```html\n<main>\n<?php\n$pattern = '';\n$patternexist = false;\nif (isset($_POST['searchcourse']))\
  \ {\n    $pattern = $_POST['txtsearch'];\n    $patternexist = true;\n}\n?>\n<section>\n\
  <h3>Courses</h3>\n<div>\n<form method=\"post\" name=\"frmsearch\">\n<p><input type=\"\
  search\" name=\"txtsearch\" size=\"60\" value=\"<?php if ($patternexist) { echo\
  \ $pattern; } ?>\"></p>\n<p><input type=\"submit\" name=\"searchcourse\" class=\"\
  frmbtn\" value=\"Search Courses\"></p>\n</form>\n</div>\n<?php\nrequire('connect.php');\n\
  $query = \"SELECT * FROM courses\";\nif ($patternexist) {\n    $query = \"SELECT\
  \ * FROM courses WHERE course_title LIKE '%$pattern%' OR course_description LIKE\
  \ '%$pattern%'\";\n}\n$select_courses = mysqli_query($con, $query);\nwhile ($selected\
  \ = mysqli_fetch_row($select_courses)) {\n    echo \"<div class='cl'>\";\n    echo\
  \ \"<h4><a href='details.php?search=$selected[0]'>\" . $selected[1] . \"<a/></h4>\"\
  ;\n    echo \"<p>\" . $selected[3] . \"</p>\";\n    echo \"</div>\";\n}\n?>\n</section>\n\
  </main>\n```\n\n###### 新增代码段解释\n\n```php\n<?php\n$pattern = '';\n$patternexist =\
  \ false;\nif (isset($_POST['searchcourse'])) {\n    $pattern = $_POST['txtsearch'];\n\
  \    $patternexist = true;\n}\n?>\n```\n\n我们初始化两个变量：`$pattern` 用于存储搜索短语，一个布尔值 `$patternexist`\
  \ 用于检查搜索短语是否存在。我们对搜索按钮使用 `isset()` 检查按钮是否被点击。如果被点击，将短语赋值给变量 `$pattern` 并将 `$patternexist`\
  \ 设为 `true`，表示存在搜索短语。\n\n```html\n<div>\n<form method=\"post\" name=\"frmsearch\"\
  >\n<p><input type=\"search\" name=\"txtsearch\" size=\"60\" value=\"<?php if ($patternexist)\
  \ { echo $pattern; } ?>\"></p>\n<p><input type=\"submit\" name=\"searchcourse\"\
  \ class=\"frmbtn\" value=\"Search Courses\"></p>\n</form>\n</div>\n```\n\n这是搜索框的设计部分。`value`\
  \ 属性中包含一段 PHP 代码。该部分逻辑为：如果搜索短语存在（`$patternexist = true`），则在搜索框中显示该短语。如果不存在搜索短语，则搜索框为空。\n\
  \n```php\n$query = \"SELECT * FROM courses\";\nif ($patternexist) {\n    $query\
  \ = \"SELECT * FROM courses WHERE course_title LIKE '%$pattern%' OR course_description\
  \ LIKE '%$pattern%'\";\n}\n```\n\n该查询用于从 `courses` 表中选择所有记录。\n\n*   如果搜索框中存在搜索模式，我们使用\
  \ SQL 语法中的 `LIKE` 运算符，选择 `course_title` 或 `course_description` 字段包含搜索短语的记录。\n\n\n\
  \n\n无论是第一个查询还是这个查询将会被执行，while 循环的工作方式与之前相同。\n\n它将显示所有课程或仅显示包含该模式的选定课程。\n\n#####\
