  </p>\n</section>\n</main>\n```\n\n以学习者/讲师身份登录，检查是否收到 Hello <email> 消息。如果像上一节那样正确获取，你的代码到目前为止很完美！\n\
  \n我们将首先对 head 元素进行必要的修改：\n\n希望你知道在哪里引入 style 标签。在 `</head>` 之前引入 style 标签代码：\n\n\
  ```css\n<style>\n.cl{\n margin: 5px;\n display: inline-block;\n vertical-align:\
  \ top;\n width: 300px;\n height: 100px;\n border: 1px solid #ccc;\n}\n</style>\n\
  ```\n\n此内容与我们用于列出课程的内容相同。\n\n将 main 标签内容替换为：\n\n```php\n<main>\n<section>\n<?php\
