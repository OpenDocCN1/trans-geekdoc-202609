  \ required></p>\n<p><input type=\"submit\" name=\"changepwd\" value=\"Change Password\"\
  \ class=\"frmbtn\"></p>\n</form>\n<p><hr></p>\n<form method=\"post\" name=\"frmprofile\"\
  >\n<p><input type=\"text\" name=\"txtname\" size=\"40\" value=\"<?php echo $name;\
  \ ?>\" required></p>\n<p><textarea name=\"txtdetails\" cols=\"40\" required><?php\
  \ echo $details; ?></textarea></p>\n<p><input type=\"submit\" name=\"changeprofile\"\
  \ value=\"Update Profile\" class=\"frmbtn\"></p>\n</form>\n</section>\n</main>\n\
  ```\n\n我们根据用户类别选择表。根据选择，从相应的表中检索详细信息。由于 `instructors` 和 `learners` 表中具有相同的字段集，我们使用\
  \ `$details[2]` 元素来获取详细信息。\n\n您可以执行个人资料页面并查看设计效果：\n\n![8-3-1](img/image00346.jpeg)\n\
  \n根据设计代码，我们执行两次更新：一次用于更改密码，另一次用于更改个人资料详情。我们必须为这两次提交分别包含两个 `if(isset())` 代码块。\n\n\
  ##### 更新个人资料：profile.php\n\n###### 1. 将此代码片段添加到 PHP 文件开头（用于更改密码）\n\n```php\n<?php\n\
  include ('check.php');\nif(isset($_POST['changepwd'])){\n  $oldpassword = $_POST['txtoldpwd'];\n\
  \  $newpassword = $_POST['txtnewpwd'];\n  $get_password = mysqli_query($con,\"SELECT\
  \ * FROM userlogin WHERE user_mail = '$usersession'\");\n  $pwd = mysqli_fetch_array($get_password);\n\
  \  //verifying if old password = new password\n  if(password_verify($oldpassword,$pwd['user_pwd'])){\
  \ \n    if((strlen($newpassword) > 7) and (strlen($newpassword) < 21)){\n      $hashed\
  \ = password_hash($newpassword,PASSWORD_DEFAULT);\n      $updatepwd = \"UPDATE userlogin\
  \ SET user_pwd = '$hashed' WHERE user_mail = '$usersession'\";     \n      if(mysqli_query($con,$updatepwd)){\n\
  \         echo \"<script>alert('Password changed! Login with new password!');\n\
  \         window.location.replace('logout.php');</script>\";\n      }\n    }\n \
  \   else{\n      echo \"<script>alert('Password length must be between 8-15 characters!');</script>\"\
  ;\n    } \n  }\n  else{\n    echo \"<script>alert('Old password is wrong!');</script>\"\
  ;\n  }\n}\n?>\n```\n\n具体工作从使用 `password_verify()` 函数检查旧密码开始。\n\n*   我们从表中检索了哈希密码，并通过\
  \ `$pwd['user_pwd']` 访问它。\n*   我们使用 `password_verify()` 来比较 `$pwd['user_pwd']` 和表单中输入的\
  \ `$oldpassword`。\n*   如果密码不匹配，我们打印“Old password is wrong.”\n*   如果密码匹配，我们再对新密码的长度进行一次检查。\n\
  \    *   如果新密码长度在 8 到 15 个字符之间，则更新新密码的哈希值并向用户显示消息。\n    *   如果长度不匹配，我们打印一条消息，要求用户提供长度在\
  \ 8 到 15 个字符之间的密码。\n\n###### 2. 将以下个人资料更改提交代码追加到前面的 PHP 片段之后\n\n```php\nif(isset($_POST['changeprofile'])){\n\
  \ $newname = $_POST['txtname'];\n $newdetails = $_POST['txtdetails'];\n if($category\
  \ == 'instructor'){\n   $updateprofile1 = \"UPDATE instructors SET instruct_name\
  \ = '$newname' WHERE instruct_mail = '$usersession'\";\n   $updateprofile2 = \"\
  UPDATE instructors SET instruct_details = '$newdetails' WHERE instruct_mail = '$usersession'\"\
  ;\n }\n if($category == 'learner'){\n   $updateprofile1 = \"UPDATE learners SET\
  \ learn_name = '$newname' WHERE learn_mail = '$usersession'\";\n   $updateprofile2\
  \ = \"UPDATE learners SET learn_details = '$newdetails' WHERE learn_mail = '$usersession'\"\
  ;\n }\n if(mysqli_query($con,$updateprofile1) and mysqli_query($con,$updateprofile2)){\n\
  \   echo \"<script>alert('Profile Updated!');</script>\";\n }\n}\n```\n\n这一次，无论在何处进行更改，我们都更新了这两个字段。这只是为了向您展示两种方式都是正确的。这完全取决于开发人员。\n\
  \n希望更新过程已清楚。\n\n执行 `localhost/onlinecourse`\n\n以讲师/学习者身份登录并更新个人资料。\n\n*这是一个 GIF\
  \ 图像。请确保您的设备支持 GIF。*\n\n![1604664382-change-profile](img/image00347.gif)\n\n在下一节中，我们将着手讲师的仪表板。\n\
  \n---\n\n#### 8.4 管理课程和内容\n\n---\n\n现在，我们进入讲师类别的核心部分！\n\n讲师应该能够：\n\n*   创建新课程\n\
  *   查看现有课程\n*   编辑课程详情\n*   向课程上传内容\n*   查看已注册学习者及其进度\n\n我们有新建课程、编辑课程和上传内容的页面。对于我们在仪表板部分设计的这个页面，文件名是\
  \ `clist.php`。\n\n可以对 `dashboard.php` 页面使用“另存为”，或者创建一个新文件 `clist.php` 并从 `dashboard.php`\
  \ 复制内容。\n\n**此页面包含什么内容？**\n\n*   一个创建新课程的链接\n*   已创建的课程将以表格形式显示\n*   编辑课程的链接\n*\
  \   上传内容的链接\n*   查看学习者进度的链接\n\n我们将为讲师准备好所有页面。关于进度页面，我们将设计并使其就绪。一旦完成下一节的内容，我们将从那里执行此进度页面的工作。\n\
  \n我们开始吧？\n\n##### 显示现有课程\n\n我们将显示由讲师创建的课程：讲师 1。\n\n希望页面 `clist.php` 已经在页面开头包含了 `check.php`\
  \ 文件。如果没有，请按如下方式包含它，并添加一行：\n\n```php\n<?php include('check.php');\nif($category\
  \ == 'learner'){\n  header('logout.php');\n}\n?>\n```\n\n我们在这里还将添加一个条件：万一学习者已登录并以某种方式检索到此页面，我们可以自动将他们重定向到注销。\n\
  \n要测试这一点，以学习者身份登录并在 URL 中访问 `clist.php`；您将被注销并转到 `login.php`。\n\n##### clist.php\n\
  \n\n\n\n\n##### 课程管理页面实现\n\n###### 主页面结构\n\n```php\n<main>\n<section>\n<?php \n\
  echo \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='dashboard.php'>Dashboard</a>&emsp;<a\
  \ href='logout.php'>Logout<a/></p>\";\necho \"<h4><a href='newcourse.php'>Add New\
  \ Course</a></h4>\";\n$fetch_courses = mysqli_query($con,\"SELECT * FROM courses\
  \ WHERE course_instruct = '$usersession'\");\nif(mysqli_num_rows($fetch_courses)\
  \ == 0){\n echo \"No courses created so far!\";\n}\nelse{\n echo \"<table style='margin:0\
  \ 10%;width:80%;;text-align:left;'>\";\n echo \"<tr>\";\n echo \"<th style='width:40%;'>\
  \ Course Title </th>\";\n echo \"<th style='width:10%;'> Edit Details </th>\";\n\
  \ echo \"<th style='width:10%;'> Manage Content </th>\";\n echo \"<th style='width:20%;'>\
  \ Learners Count </th>\";\n echo \"</tr>\";\n} \nwhile($fetched = mysqli_fetch_row($fetch_courses)){\n\
  \ echo \"<tr>\";\n echo \"<td>\".$fetched[1].\"</td>\";\n echo \"<td><a href='editcourse.php?cid=$fetched[0]'>Edit</td>\"\
  ;\n echo \"<td><a href='uploadcontent.php?cid=$fetched[0]'>Add</td>\";\n $get_enrols\
  \ = mysqli_query($con,\"SELECT * FROM enroll WHERE course_code=$fetched[0]\");\n\
  \ echo \"<td>\";\n echo mysqli_num_rows($get_enrols);\n if (mysqli_num_rows($get_enrols)\
  \ > 0){\n  echo \"&emsp;<a href='reports.php?cid=$fetched[0]'>View\";\n }\n echo\
  \ \"</td>\"; \n echo \"</tr>\";\n}\necho \"</table>\";\n?>\n</section>\n</main>\n\
  ```\n\n###### 功能说明\n\n- 我们以表格形式显示课程详情，仅显示标题字段。\n- 我们提供了创建新课程的链接。\n- 为了编辑课程，我们提供了带有参数\
  \ `cid = coursecode` 的链接。\n- 为了上传内容，我们提供了带有参数 `cid` 的链接。\n- 为了查看学习者列表和进度，我们使用了相同的参数\
  \ `cid`。\n\n以讲师身份登录，点击仪表盘中的 Courses：\n\n![8-4-1](img/image00348.jpeg)\n\n我们传递了携带课程代码值的参数\
  \ `cid`。接下来的任务是：在 3 个页面中检索该参数——`editcourse.php`、`uploadcontent.php` 和 `reports.php`。\n\
  \n我们现在进行适当的更改：\n\n---\n\n###### newcourse.php\n\n我们在此不传递任何参数，但必须指示 PHP 使用 `$usersession`\
  \ 值作为讲师 ID。\n\n从表单中移除以下行：\n\n```html\n<input type='hidden' name='txtinstruct' value='instructor1@onlinecourse.com'>\n\
  ```\n\n将 PHP 片段修改为：\n\n```php\n<?php\ninclude('check.php');\nif(isset($_POST['newcourse'])){\n\
  \ $title = $_POST['txtcourse'];\n $describe = $_POST['txtdesc'];\n $instruct = $usersession;\n\
  \ $outcome = $_POST['txtoutcome'];\n $eligible = $_POST['txteligible'];\n $insert\
  \ = mysqli_query($con,\"INSERT INTO courses VALUES (NULL,'$title','$instruct','$describe','$outcome','$eligible')\"\
