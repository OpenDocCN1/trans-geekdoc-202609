  \ 标签：\n\n```php\n<?php\nprint \"<br>Normal statement\";\nprint \"<h4>HTML tag usage</h4>\"\
  ;\n//try multiple parameters\n//print \"Trying \",\"parameters\";\n?>\n```\n\n你可以在下面的输出中发现差异：\n\
