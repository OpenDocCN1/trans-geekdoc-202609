  \n```\nfunction get_progress($con,$id){\n $get_enrols = mysqli_query($con,\"SELECT\
  \ * FROM enroll WHERE enroll_id = $id\");\n $progress = 0;\n if($enrol = mysqli_fetch_row($get_enrols)){\n\
  \  $enrolid = $enrol[0];\n  $course = $enrol[2];\n  $completed = 0;\n  $contents\
  \ = mysqli_query($con,\"SELECT * FROM contents WHERE course_code = $course\");\n\
  \  $total = mysqli_num_rows($contents);\n  while($content = mysqli_fetch_row($contents)){\n\
  \     $contentid = $content[0];\n     $records = mysqli_query($con,\"SELECT * FROM\
  \ record WHERE enroll_id = $enrolid AND content_id = $contentid\");\n     if(mysqli_num_rows($records)\
  \ == 1){\n       $completed = $completed + 1;\n     }\n  }\n  $progress = round(($completed\
  \ / $total) * 100);\n }\n return $progress;\n}\n```\n\n初看时这段代码有点复杂。但它只是基于逻辑。所以，让我向你解释所用的逻辑：\n\
  \n*   使用注册 ID，我们找到学习者 ID 和课程代码。\n*   使用课程代码，我们检索与之关联的所有内容。\n*   我们将内容计数赋值给 `$total`，并将学习者的完成数\
  \ `$completed` 初始化为零。\n*   对于每个内容 ID，我们通过询问 `record` 表中是否存在具有该注册 ID 和内容 ID 的记录，来查找是否有条目。\n\
  *   如果有条目，我们将 `$completed` 变量的值加 1。\n*   对于进度计算，我们使用简单的数学公式（`completed / total *\
  \ 100`），对值进行四舍五入并返回。\n*   如果学习者尚未开始学习，我们将返回 `$progress` 变量的初始值，即零。\n\n现在，你可以将查询的每一行与这个逻辑进行对比。\n\
  \n```\n$contents = mysqli_query($con,\"SELECT * FROM contents WHERE course_code\
  \ = $course\");\n$total = mysqli_num_rows($contents);\n```\n\n这将查找该特定课程的内容数量\n\n\
  ```\nwhile($content = mysqli_fetch_row($contents)){\n  $contentid = $content[0];\n\
