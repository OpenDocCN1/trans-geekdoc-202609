  ?>\n```\n\n我们做了三项更改：\n\n- 将 `connect.php` 替换为 `check.php`。\n- 将 `$instruct` 变量赋值为\
  \ `$usersession`，而非表单提交的值。\n- 显示“新课程创建成功”弹窗后，重定向页面至 `clist.php` 以显示课程列表。\n\n请逐项进行更改，以便更好地理解！\n\
  \n---\n\n###### editcourse.php\n\n下一个要处理的文件是 `editcourse.php`，需包含参数 `cid`。\n\n#######\
  \ 表单设计调整\n\n在表单设计中，移除以下行：\n\n```html\n<input type=\"hidden\" name=\"txtinstruct\"\
  \ value=\"<?php echo $instructor;?> \">\n```\n\n由于代码片段较大，此处仅给出需替换的部分：\n\n**替换前：**\n\
  \n```php\nrequire('connect.php');  \n$course = 1;  \n$instructor = 'instructor1@onlinecourse.com';\n\
