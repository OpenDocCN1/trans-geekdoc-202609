  \ AND content_id = $contentid\");\n  if(mysqli_num_rows($records) == 1){\n\t  $completed\
  \ = $completed + 1;\n  }\n}\n```\n\n对于每个内容 ID，我们在 `record` 表中寻找匹配学习者 ID 和内容 ID 的条目。如果找到条目，`$completed`\
  \ 计数加 1。\n\n```\n$progress = round(($completed / $total) * 100);\n```\n\n进度计算部分在这里完成。\n\
