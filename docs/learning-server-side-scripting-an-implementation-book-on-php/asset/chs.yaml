  email\" name=\"txtmail\" size=\"40\" placeholder=\"Enter your Email Address\" required></p>\n\
  \        <p><input type=\"password\" name=\"txtpwd\" size=\"40\" placeholder=\"\
  Enter your Password 8-15 characters\" required></p>\n        <p><input type=\"text\"\
