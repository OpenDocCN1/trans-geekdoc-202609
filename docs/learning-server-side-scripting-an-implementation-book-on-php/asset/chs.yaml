  \n现在，我们将在这里做 2 项编辑工作：\n\n*   更改表单设计以包含所选课程的详细信息\n*   更改 PHP 片段以检索课程详细信息并进行更新\n\n\
  我们将分 3 个阶段执行此过程：\n\n*   PHP 中检索课程详细信息\n*   更新字段的表单设计\n*   PHP 中字段的更新语句\n\n#####\
  \ 阶段 1：PHP 中的检索代码\n\n首先，我们将更新顶部的 PHP 片段：\n\n```php\n<?php\nrequire('connect.php');\n\
  $course = 1;\n$instructor = 'instructor1@onlinecourse.com';\n$get_details = mysqli_query($con,\"\
  SELECT * FROM courses WHERE course_code = $course\");\nif($details = mysqli_fetch_row($get_details)){\n\
