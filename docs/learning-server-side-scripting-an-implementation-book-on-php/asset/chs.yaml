  \ 表：\n\n![7-3-4](img/image00319.jpeg)\n\n希望这个表单也搞定了！\n\n---\n\n我们现在将着手设计上传内容表单。\n\
  \n创建一个名为 `uploadcontent.php` 的新文件，或使用“另存为”选项将之前的文件保存为这个名称。\n\n**表单设计：uploadcontent.php**\n\
