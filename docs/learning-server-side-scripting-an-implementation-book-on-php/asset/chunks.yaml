    \ each line of the query with this logic.\n\n```\n$contents = mysqli_query($con,\"\
    SELECT * FROM contents WHERE course_code = $course\");\n$total = mysqli_num_rows($contents);\n\
    ```\n\nThis will find the count of contents for that particular course\n\n```\n\
    while($content = mysqli_fetch_row($contents)){\n  $contentid = $content[0];\n\
    \  $records = mysqli_query($con,\"SELECT * FROM record WHERE learn_mail = '$learner'\
    \ AND content_id = $contentid\");\n  if(mysqli_num_rows($records) == 1){\n\t \
    \ $completed = $completed + 1;\n  }\n}\n```\n\nFor every content id, we seek an\
    \ entry matching the learner id and content id in the `record` table. If an entry\
    \ is found, `$completed` count is incremented by 1.\n\n```\n$progress = round(($completed\
    \ / $total) * 100);\n```\n\nProgress calculation part is done here.\n\nLet me\
    \ show you, how to create a new course, edit course and upload content. Remember,\
    \ reports cannot be seen now!\n\n*This is a GIF image. Make sure GIF is supported\
    \ in your device.*\n\n![1604666457-instructor-dashboard](Images/image00349.gif)\n\
    \n---\n\n### 8.5 Enrolment and Course Access\n\n---\n\nWe will now work on learner's\
    \ dashboard page. Similar to instructor, a learner also has a set of tasks to\
    \ do. We will list the tasks here:\n\n*   enroll in a course\n*   access the course\
    \ - view course contents\n*   see the progress\n\nSounds to be simple right? We\
    \ have already defined a function to get the progress of a learner in a course.\n\
    \n**What are the contents of this page?**\n\n*   List of enrolled courses with\
    \ details\n*   Link to view course contents\n\nWhere should the learner enroll\
    \ from? From the `courses.php` page.\n\nWe will be modifying: `courses.php` first.\
    \ Later, we will create two pages - `elist.php` and `contents.php`\n\n---\n\n\
    **Enrolment process:**\n\nLet us first create an enroll button in `courses.php`\n\
    \n**Creating enroll button: courses.php**\n\nLet us increase the height of the\
    \ course listing box: Change the height in the `style` tag.\n\n```\n<style>\n\
    .cl{\n margin: 5px;\n display: inline-block;\n vertical-align: top;\n width: 300px;\n\
    \ height: 200px;\n border: 1px solid #ccc;\n}\n</style>\n```\n\nWe have changed\
    \ the height from 150px to 200px. We will create a form button with 40px height.\
    \ The form will be placed inside the while loop's div element.\n\nReplace the\
    \ while loop in the main tag content as:\n\n```\nwhile($selected = mysqli_fetch_row($select_courses)){\n\
    \ echo \"<div class='cl'>\";\n echo \"<h4><a href='details.php?search=$selected[0]'>\"\
    .$selected[1].\"<a/></h4>\";\n echo \"<p style='height:70px';>\".$selected[3].\"\
    </p>\";\n echo \"<form method='post'>\";\n echo \"<input type='hidden' name='txtcourse'\
    \ value='$selected[0]'>\";\n echo \"<input type='submit' name='enroll' value =\
    \ 'Enroll' class='frmbtn'>\";\n echo \"</form>\";\n echo \"</div>\"; \n}\n```\n\
    \nCheck the `courses.php` page.\n\n![8-5-1](Images/image00350.jpeg)\n\n**Enrolling\
    \ code: courses.php**\n\nAdd the following code snippet to the beginning of the\
    \ file:\n\n```\n<?php\nsession_start();\nrequire('connect.php');\nif(isset($_POST['enroll'])){\n\
    \  if(isset($_SESSION['usersession'])){\n  $usersession = $_SESSION['usersession'];\n\
    \  $course = $_POST['txtcourse'];\n  $get_enrol = mysqli_query($con,\"SELECT *\
    \ FROM enroll WHERE learn_mail = '$usersession' AND course_code = $course\");\n\
    \  if(mysqli_num_rows($get_enrol) == 0){\n    $enrol = \"INSERT INTO enroll VALUES\
    \ (NULL,'$usersession',$course,DEFAULT,NULL)\";\n    if(mysqli_query($con,$enrol)){\n\
    \      echo \"<script>alert('You are enrolled!');window.location.replace('elist.php');</script>\"\
    ;\n    }\n  }\n  else{\n    echo \"<script>alert('You are already enrolled!');window.location.replace('elist.php');</script>\"\
    ;\n  }\n }\n else{\n   echo \"<script>alert('Please login and enroll!');</script>\"\
    ;\n }\n}\n?>\n```\n\nWe make 2 checks here:\n\n*   If the user is logged into\
    \ the site (first check), \n    *   We check if the user has already enrolled\
    \ to the course (second check). If yes, we display already enrolled message.\n\
    \    *   If the user is not already enrolled, we insert a record into the `enroll`\
    \ table and confirm enrolment with a message.\n    *   In both cases, we direct\
    \ to `elist.php` after pop-up display.\n*   If the user is not logged in, we ask\
    \ to login and enroll\n\nThis time, we did not include `check.php` because, that\
    \ file is for ensuring whether users are logged in, to access those pages. But\
    \ `courses.php` is a general page that should be accessed even without logging\
    \ into the site. So we have included `connect.php` file this time.\n"
  trans: "\n\n<main>\n<section>\n<?php \necho \"<h3>Hello \".$name.\"</h3>\";\necho\
    \ \"<p><a href='clist.php'>Back to Courses<a/></p>\";\n$fetch_enrols = mysqli_query($con,\"\
    SELECT * FROM enroll WHERE course_code = $course\");\nif(mysqli_num_rows($fetch_enrols)\
    \ == 0){\n echo \"No learners enrolled so far!\";\n}\nelse{\n echo \"<table style='margin:0\
    \ 10%;width:80%;;text-align:left;'>\";\n echo \"<tr>\";\n echo \"<th style='width:30%;'>\
    \ Learner Name </th>\";\n echo \"<th style='width:30%;'> Learner Email </th>\"\
    ;\n echo \"<th style='width:20%;'> Progress </th>\";\n  echo \"</tr>\";\n} \n\
    while($enrols = mysqli_fetch_row($fetch_enrols)){\n  echo \"<tr>\";\n echo \"\
    <td>\".get_name($con,$enrols[1],'learner').\"</td>\";\n echo \"<td>\".$enrols[1].\"\
    </td>\";\n  echo \"<td><progress id='progress' value='\".get_progress($con,$enrols[0]).\"\
    ' max='100'></progress> \".get_progress($con,$enrols[0]).\"%</td>\"; \n echo \"\
    </tr>\";\n}\necho \"</table>\";\n?>\n</section>\n</main>\n\n我们以表格形式检索并显示了详细信息：\n\
    \n*   我们从 `enroll` 表中检索了学习者的 ID\n*   使用 `check.php` 中的 `get_name()` 函数，我们显示学习者的姓名\n\
    *   我们使用另一个函数 `get_progress()`，通过传递 `enroll_id` 作为参数来获取学习者的进度（我们尚未定义此函数），并使用进度条显示\n\
    \n我们之所以使用 `get_progress()` 函数，是因为不仅讲师需要，学习者在学习过程中也需要这个进度计数。因此，我们不重复计算两次进度，而是使用一个函数。\n\
    \n---\n\n在 `check.php` 中，我们必须定义一个 `get_progress()` 函数\n\n应该将此函数放在哪里？老实说，你想放哪里都行！为了统一，我们将把这个函数放在其他两个函数的下方，如下所示：\n\
    \n```\nfunction get_category() { }\nfunction get_name() { }\nfunction get_progress()\
    \ { }\n```\n\n让我们遵循这个顺序，好吗？\n\n### check.php\n\n现在，让我们看看 `get_progress()` 函数的定义。将此代码片段适当地放在页面中。\n\
    \n```\nfunction get_progress($con,$id){\n $get_enrols = mysqli_query($con,\"SELECT\
    \ * FROM enroll WHERE enroll_id = $id\");\n $progress = 0;\n if($enrol = mysqli_fetch_row($get_enrols)){\n\
    \  $enrolid = $enrol[0];\n  $course = $enrol[2];\n  $completed = 0;\n  $contents\
    \ = mysqli_query($con,\"SELECT * FROM contents WHERE course_code = $course\");\n\
    \  $total = mysqli_num_rows($contents);\n  while($content = mysqli_fetch_row($contents)){\n\
    \     $contentid = $content[0];\n     $records = mysqli_query($con,\"SELECT *\
    \ FROM record WHERE enroll_id = $enrolid AND content_id = $contentid\");\n   \
    \  if(mysqli_num_rows($records) == 1){\n       $completed = $completed + 1;\n\
    \     }\n  }\n  $progress = round(($completed / $total) * 100);\n }\n return $progress;\n\
    }\n```\n\n初看时这段代码有点复杂。但它只是基于逻辑。所以，让我向你解释所用的逻辑：\n\n*   使用注册 ID，我们找到学习者 ID 和课程代码。\n\
    *   使用课程代码，我们检索与之关联的所有内容。\n*   我们将内容计数赋值给 `$total`，并将学习者的完成数 `$completed` 初始化为零。\n\
    *   对于每个内容 ID，我们通过询问 `record` 表中是否存在具有该注册 ID 和内容 ID 的记录，来查找是否有条目。\n*   如果有条目，我们将\
    \ `$completed` 变量的值加 1。\n*   对于进度计算，我们使用简单的数学公式（`completed / total * 100`），对值进行四舍五入并返回。\n\
    *   如果学习者尚未开始学习，我们将返回 `$progress` 变量的初始值，即零。\n\n现在，你可以将查询的每一行与这个逻辑进行对比。\n\n```\n\
    $contents = mysqli_query($con,\"SELECT * FROM contents WHERE course_code = $course\"\
    );\n$total = mysqli_num_rows($contents);\n```\n\n这将查找该特定课程的内容数量\n\n```\nwhile($content\
    \ = mysqli_fetch_row($contents)){\n  $contentid = $content[0];\n  $records = mysqli_query($con,\"\
    SELECT * FROM record WHERE learn_mail = '$learner' AND content_id = $contentid\"\
    );\n  if(mysqli_num_rows($records) == 1){\n\t  $completed = $completed + 1;\n\
    \  }\n}\n```\n\n对于每个内容 ID，我们在 `record` 表中寻找匹配学习者 ID 和内容 ID 的条目。如果找到条目，`$completed`\
    \ 计数加 1。\n\n```\n$progress = round(($completed / $total) * 100);\n```\n\n进度计算部分在这里完成。\n\
    \n让我向你展示如何创建新课程、编辑课程和上传内容。记住，目前还无法查看报表！\n\n*这是一个 GIF 图片。请确保您的设备支持 GIF 格式。*\n\n\
    ![1604666457-instructor-dashboard](img/image00349.gif)\n\n---\n\n### 8.5 注册与课程访问\n\
    \n---\n\n我们现在将着手处理学习者仪表板页面。与讲师类似，学习者也有一组任务要做。我们在此列出这些任务：\n\n*   注册课程\n*   访问课程\
    \ - 查看课程内容\n*   查看进度\n\n听起来很简单对吧？我们已经定义了一个函数来获取学习者在课程中的进度。\n\n**此页面包含什么内容？**\n\
    \n*   已注册课程列表及详情\n*   查看课程内容的链接\n\n学习者应该从哪里注册？从 `courses.php` 页面。\n\n我们将首先修改：`courses.php`。稍后，我们将创建两个页面\
    \ - `elist.php` 和 `contents.php`\n\n---\n\n**注册流程：**\n\n让我们首先在 `courses.php` 中创建一个注册按钮\n\
    \n**创建注册按钮：courses.php**\n\n让我们增加课程列表框的高度：更改 `style` 标签中的高度。\n\n```\n<style>\n\
    .cl{\n margin: 5px;\n display: inline-block;\n vertical-align: top;\n width: 300px;\n\
    \ height: 200px;\n border: 1px solid #ccc;\n}\n</style>\n```\n\n我们将高度从 150px 改为了\
    \ 200px。我们将创建一个高度为 40px 的表单按钮。该表单将放置在 while 循环的 div 元素内部。\n\n替换主标签内容中的 while 循环为：\n\
    \n```\nwhile($selected = mysqli_fetch_row($select_courses)){\n echo \"<div class='cl'>\"\
    ;\n echo \"<h4><a href='details.php?search=$selected[0]'>\".$selected[1].\"<a/></h4>\"\
    ;\n echo \"<p style='height:70px';>\".$selected[3].\"</p>\";\n echo \"<form method='post'>\"\
    ;\n echo \"<input type='hidden' name='txtcourse' value='$selected[0]'>\";\n echo\
    \ \"<input type='submit' name='enroll' value = 'Enroll' class='frmbtn'>\";\n echo\
    \ \"</form>\";\n echo \"</div>\"; \n}\n```\n\n检查 `courses.php` 页面。\n\n![8-5-1](img/image00350.jpeg)\n\
    \n**注册代码：courses.php**\n\n将以下代码片段添加到文件开头：\n\n```\n<?php\nsession_start();\nrequire('connect.php');\n\
    if(isset($_POST['enroll'])){\n  if(isset($_SESSION['usersession'])){\n  $usersession\
    \ = $_SESSION['usersession'];\n  $course = $_POST['txtcourse'];\n  $get_enrol\
    \ = mysqli_query($con,\"SELECT * FROM enroll WHERE learn_mail = '$usersession'\
    \ AND course_code = $course\");\n  if(mysqli_num_rows($get_enrol) == 0){\n   \
    \ $enrol = \"INSERT INTO enroll VALUES (NULL,'$usersession',$course,DEFAULT,NULL)\"\
    ;\n    if(mysqli_query($con,$enrol)){\n      echo \"<script>alert('You are enrolled!');window.location.replace('elist.php');</script>\"\
    ;\n    }\n  }\n  else{\n    echo \"<script>alert('You are already enrolled!');window.location.replace('elist.php');</script>\"\
    ;\n  }\n }\n else{\n   echo \"<script>alert('Please login and enroll!');</script>\"\
    ;\n }\n}\n?>\n```\n\n我们在这里进行两项检查：\n\n*   如果用户已登录网站（第一项检查），\n    *   我们检查用户是否已注册该课程（第二项检查）。如果是，我们显示已注册消息。\n\
    \    *   如果用户尚未注册，我们向 `enroll` 表插入一条记录并通过消息确认注册。\n    *   在这两种情况下，弹窗显示后我们都会跳转到\
    \ `elist.php`。\n*   如果用户未登录，我们提示登录并注册\n\n这一次，我们没有包含 `check.php`，因为该文件用于确保用户已登录才能访问那些页面。但\
    \ `courses.php` 是一个通用页面，即使未登录网站也应能访问。所以这次我们包含了 `connect.php` 文件。\n\n"
