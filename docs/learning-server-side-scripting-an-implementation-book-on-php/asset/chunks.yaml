- raw: "PHP started out as a small open source project that evolved as more and more\
    \ people found out how useful it was. Rasmus Lerdorf unleashed the first version\
    \ of PHP way back in 1994.\n\n**Reasons for choosing PHP:**\n\n*   It runs on\
    \ various platforms (Windows, Linux, Unix, Mac OS X, etc.)\n\n*   It is compatible\
    \ with almost all servers used today (Apache, IIS, etc.)\n\n*   It runs efficiently\
    \ on the server side\n\n*   It supports a wide range of databases\n\n*   It is\
    \ free. Download it from the official PHP resource: [www.php.net](https://www.php.net)\n\
    \n*   PHP supports a large number of major protocols such as POP3, IMAP, and LDAP.\
    \ PHP4 added support for Java and distributed object architectures (COM and CORBA),\
    \ making n-tier development a possibility for the first time.\n\n*   PHP Syntax\
    \ is C-Like.\n\nIt is always better to learn a technology which is open source\
    \ (free). The main reason is you can explore top-to-bottom about the technology.\
    \ When you access a paid technology, your learning is limited to what you pay.\n\
    \n**Characteristics of PHP**\n\nFive important characteristics make PHP's practical\
    \ nature possible:\n\n*   Simplicity\n\n*   Efficiency\n\n*   Security\n\n*  \
    \ Flexibility\n\n*   Familiarity\n\n**Applications of PHP**\n\n*   It performs\
    \ system file functions, i.e. on a system, it can create, open, read, write, and\
    \ close files.\n\n*   It can handle forms, i.e. gather data from files, save data\
    \ to a file, send data through email, return data to the user.\n\n*   You can\
    \ add, delete, modify elements within your database through PHP.\n\n*   You can\
    \ Set and Access cookies variables.\n\n*   You can restrict users to access some\
    \ pages of your website using PHP.\n\n*   It can encrypt data.\n\n**A Note on\
    \ PHP page:**\n\n*   A PHP page / file can consist of HTML, CSS, JavaScript and\
    \ PHP codes.\n\n*   PHP files are saved using the extension .php\n\n*   Once the\
    \ code gets executed by the server, the result is returned to the browser as plain\
    \ HTML.\n\n*   The output is not limited to HTML. You can output images, PDF files,\
    \ and even Flash movies. You can also output any text, such as XHTML and XML.\n\
    \n**A Note on PHP 7 (Used in this e-book):**\n\n*   PHP 7 is much faster than\
    \ the previous popular stable release (PHP 5.6)\n\n*   PHP 7 has improved Error\
    \ Handling\n\n*   PHP 7 supports stricter Type Declarations for function arguments\n\
    \n*   PHP 7 supports new operators (like the spaceship operator: <=> )\n\nHope\
    \ you have got some idea on PHP.\n\n* * *\n\n### 1.4 Installation of PHP\n\n*\
    \ * *\n\nIf you wish to install PHP, you will additionally need a server to be\
    \ installed in your system. The reason is that, this server will enact as a web\
    \ server to execute the scripts coded in PHP.\n\nWhat do we need?\n\n1\\. PHP\n\
    \n2\\. Web Server (we will go with Apache server - this also enacts as the application\
    \ server)\n\n3\\. MySQL database\n\nWe will proceed with a quick installation\
    \ using XAMPP stack. Instead of installing PHP, Apache and MySQL separately, we\
    \ will install XAMPP which will in turn install all the necessities.\n\nNote:\
    \ Make sure you don’t have any of PHP / Apache / MySQL previously installed in\
    \ your system. In case you have a version installed, kindly uninstall them before\
    \ proceeding.\n\n**Installation Instructions:**\n\n1.  Go to XAMPP download page\
    \ - [https://www.apachefriends.org/download.html](https://www.apachefriends.org/download.html)\n\
    \n2.  Download the installer respective to your system's operating system\n\n\
    \    At the time of publishing this e-book, the stable version is 7.4.  \n\n \
    \   When I installed XAMPP for demo purpose, I used 7.3 version.\n\n3.  Installation\
    \ Steps\n\n    *   Double click XAMPP installer\n\n    *   Click Next\n\n    \
    \    ![1](Images/image00135.jpeg)\n\n    *   Select all the components and Click\
    \ Next.  \n\n        Apache, MySQL, PHP, phpMyAdmin are mandatory.\n\n       \
    \ ![2](Images/image00136.jpeg)\n\n    *   Choose a Folder (path) to install XAMPP\n\
    \n        ![3-1](Images/image00137.jpeg)\n\n    *   Uncheck the checkbox and Click\
    \ Next\n\n        ![5](Images/image00138.jpeg)\n\n    *   Click Next\n\n     \
    \   ![6](Images/image00139.jpeg)\n\n    *   Installation process\n\n        ![7](Images/image00140.jpeg)\n\
    \n    *   Click Finish (Check \\[Select\\] the checkbox to start Control Panel)\n\
    \n        ![8](Images/image00141.jpeg)\n\n    *   This is the XAMPP Control Panel\n\
    \n        ![10](Images/image00142.jpeg)\n\n    *   Start Apache Server and MySQL\
    \ to check if they are working properly\n\n        ![11](Images/image00143.jpeg)\n\
    \n    *   If PHP is successfully installed, you can see the localhost's dashboard\
    \ page!\n\n    *   Click Admin button next to Apache, you will land on [http://localhost/dashboard](#part0007.xhtml)\n\
    \n        ![final](Images/image00144.jpeg)\n\n    *   Click Admin button next\
    \ to MySQL, you will land on [http://localhost/phpmyadmin](#part0007.xhtml)\n\n\
    \        ![final2](Images/image00145.jpeg)\n\n4.  Once the installation is over,\
    \ start Apache as for now. MySQL will be needed from Chapter-6, so you can start\
    \ it later\n\n* * *\n\n### 1.5 Start Coding PHP\n\n* * *\n\n**Where do we code?**\n\
    \nPHP needs a text editor to be scripted. You can use any text editor like Notepad,\
    \ Notepad++, etc. You are free to use Visual Studio Code or any such editors or\
    \ even IDEs to script. But I recommend you not to use any IDE’s or code builders.\
    \ Code builders will assist you in coding but your learning graph will not be\
    \ proper.\n\nSo, either go with Notepad++ or any such simple text editor! I recommend\
    \ using Notepad++ due to syntax highlighting (PHP syntax will be highlighted in\
    \ colors)\n\n**Start Coding PHP:**\n\nLet us take a single line PHP script.\n\n\
    1\\. Open text editor\n\n2\\. Type the following:\n\n```\n<?php\necho \"Testing\
    \ PHP code\";\n?>\n```\n\n3\\. Create a folder named **PracticePHP** in the location\
    \ C:/xampp/htdocs. htdocs is the folder from where your web pages will be served\
    \ via localhost.This path C:/xampp/htdocs/PracticePHP will be your file saving\
    \ path.\n\n4\\. Save the file as **test.php** in the file saving path - C:/xampp/htdocs/PracticePHP\n\
    \n5\\. Make sure Apache is started in XAMPP\n\n6\\. Go to the browser and type:\
    \ [http://localhost/PracticePHP/test.php](#part0008.xhtml)\n\nHope you can see\
    \ the output as below:\n\n![testphp](Images/image00146.jpeg)\n\nIf you can see\
    \ the output, your installation and saving location are perfect. Since this is\
    \ the first script, I have posted it along with the URL of the page. Only if this\
    \ test page works, it means your system is running PHP. Else, we need to check\
    \ what went wrong!\n\nOne of the most common errors encountered is - site not\
    \ reachable. When you find site not reachable message, it means you have not started\
    \ Apache! (Apache's port 80 may not be available)\n\n**Note:**\n\nWhen you try\
    \ to open php page via double-click (as you click-open html file), it will not\
    \ be opened in browser. PHP files/pages must always be accessed via a server.\
    \ Always execute PHP pages from localhost!\n\nSay, you try executing them from\
    \ a browser using the file path (like a html file) as below, you can just see\
    \ the code.\n\n![1-5](Images/image00147.jpeg)\n\nTo process PHP script, we need\
    \ a server (Apache in our case). Do not forget it anytime!\n\nFor the rest of\
    \ the e-book,\n\n*   When I mention, **save** the file, make sure you save it\
    \ in the path - C:/xampp/htdocs/PracticePHP\n\n*   When I mention, **execute**\
    \ the script/file, it means you have to access it using browser, using the URL\
    \ - http://localhost/PracticePHP\n\nWith this, I think you know what is PHP, how\
    \ to install PHP using XAMPP and how to test a code!;\n\nFrom here, you will start\
    \ learning programming constructs in PHP. Try to execute all the code snippets\
    \ to ensure hands-on experience!\n\nHappy Learning and Coding!!!\n\n* * *\n\n\
    # Chapter 2: Essentials of PHP\n\n* * *\n\n*   [](#part0010.xhtml)\n\n    ####\
    \ 2.1 Basics\n\n*   [](#part0011.xhtml)\n\n    #### 2.2 Variables\n\n*   [](#part0012.xhtml)\n\
    \n    #### 2.3 Data Types\n\n*   [](#part0013.xhtml)\n\n    #### 2.4 Built-in\
    \ Functions\n\n*   [](#part0014.xhtml)\n\n    #### 2.5 Arrays\n\n*   [](#part0015.xhtml)\n\
    \n    #### 2.6 User-Defined Functions\n\n*   [](#part0016.xhtml)\n\n    #### 2.7\
    \ More on Functions"
