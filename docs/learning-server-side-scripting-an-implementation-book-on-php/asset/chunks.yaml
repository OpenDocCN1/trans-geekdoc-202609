  trans: "\n数组的大小存储在变量 `$n` 中。\n\n对于测试的计数，我们使用变量 `$i`。\n\n我们还将初始化一个变量 `$sum` 来计算 5\
    \ 次测试成绩的总和。\n\n```php\n//while 循环\n$i = 0;\n$marks = array(50,70,74,83,65);\n\
    $n = count($marks);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\nwhile($i\
    \ < $n){\n $sum = $sum + $marks[$i];\n echo \"<br> Value of i = \".$i;\n echo\
    \ \" marks[$i] = \".$marks[$i];\n echo \" Sum = \".$sum;\n $i++;\n}\n```\n\n**执行：**\n\
    \n代码有什么作用？\n\n*   我们声明一个数组 `$marks[]`\n*   我们初始化循环计数变量 `$i = 0`、数组大小变量 `$n = count($marks)`、求和变量\
    \ `$sum = 0`\n*   While 循环测试条件 `$i < $n`\n    *   我们打印 `$i`、`$marks[$i]` 和 `$sum`\
    \ 的值\n    *   每次迭代将 `$i` 增加 1。\n    *   循环执行直到 `$i < $n`。一旦 `$i = $n`，循环停止执行。\n\
    \n这是输出结果：\n\n![3-3-1](img/image00203.jpeg)\n\n### do...while 循环\n\ndo...while\
    \ 循环将始终执行一次代码块，然后它将检查条件，并在指定条件为真时重复循环。在这里，条件是在循环内的语句执行**之后**测试的。这意味着即使条件为假，循环也至少会执行一次其语句。\n\
    \n#### 语法\n\n```php\ndo {\t\n  要执行的代码;\n} while (条件为真);\n```\n\n#### 练习：\n\n我们现在将使用此循环重写相同的代码片段：\n\
    \n```php\n//do while 循环\n$i = 0;\n$marks = array(50,70,74,83,65);\n$n = count($marks);\n\
    $sum = 0;\necho \"Marks: \";\nvar_dump($marks);\ndo{\n $sum = $sum + $marks[$i];\n\
    \ echo \"<br> Value of i = \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo\
    \ \" Sum = \".$sum;\n $i++;\n}while($i < $n);\n```\n\n执行上述代码时，您将获得与 while 循环相同的输出。我们重写相同代码的原因是为了告诉您执行是如何发生的以及条件是在哪里被检查的！\n\
    \n### for 循环\n\n当您预先知道脚本应该运行多少次时，使用 for 循环。它的工作方式与其他两种循环类似，但我们如何指定增量计数器以及在哪里检查条件很重要！\n\
    \n#### 语法\n\n```php\nfor (初始化; 检查条件; 增量/减量) {\n  每次迭代要执行的代码;\n}\n```\n\n参数：\n\n\
    *   初始化循环计数器值\n*   检查每次循环迭代要评估的条件。如果评估为 TRUE，循环继续。如果评估为 FALSE，循环结束。\n*   增加或减少循环计数器值\n\
    \n#### 练习：\n\n不是为了让您厌烦，而是为了告诉您此循环如何工作，我们再次采用相同的示例！\n\n```php\n//for 循环\n$marks\
    \ = array(50,70,74,83,65);\n$n = count($marks);\n$sum = 0;\necho \"Marks: \";\n\
    var_dump($marks);\nfor($i = 0; $i < $n; $i++){\n $sum = $sum + $marks[$i];\n echo\
    \ \"<br> Value of i = \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \" Sum\
    \ = \".$sum;\n}\n```\n\n有一个小小的不同！我们不是在循环的代码块内部增加变量 `$i`，而是将其与初始化和测试条件一起增加。执行相同的代码，您将再次发现相同的输出！\n\
    \n### foreach 循环\n\nforeach 循环仅适用于数组，用于遍历数组中的每个键/值对。\n\n#### 语法\n\n```php\nforeach\
    \ ($array as $value) {\n  要执行的代码;\n}\n```\n\n对于每次循环迭代，当前数组元素的值被赋给 `$value`，并且数组指针向后移动一位，直到到达最后一个数组元素。\n\
    \n#### 练习：\n\n同样，我们将采用相同的示例编码。这一次，我们不使用计数变量 `$i`，而是使用键/值对进行循环。请查看下面的代码：\n\n```php\n\
    //for each 循环\n$marks = array(50,70,74,83,65);\n$sum = 0;\n$i = 0;\necho \"Marks:\
    \ \";\nvar_dump($marks);\nforeach($marks as $mark){\n $sum = $sum + $mark;\n echo\
    \ \"<br> Value of i = \".$i++;\n echo \" marks[$i] = \".$mark;\n echo \" Sum =\
    \ \".$sum;\n}\n```\n\n当您执行时，您将获得相同的输出。但是，您能看到遍历数组是多么容易吗？\n\n您不需要计数器，不需要增加/减少值，您只需将\
    \ `$marks` 数组的每个数组元素作为一个名为 `$mark` 的单一值传递！在上面的代码中使用 `$i` 的目的是描述 `$mark` 变量如何从\
    \ `$marks` 数组中逐个获取值！当我们使用 foreach 循环时，根本不需要计数器变量！\n\n这就是为什么我从循环开始就尝试使用数组的原因。为了了解不同循环如何工作，我们需要使用相同的示例！通过为不同的循环执行相同的示例代码来学习，将使您更清楚地了解每个循环如何工作及其要求！\n\
    \n我们现在将看看在循环内部使用的两个语句：`break` 和 `continue`\n\n我将再次为这些语句选取相同的示例！\n\n### Break\n\
    \n您已经见过 `break` 语句，它用于退出 switch 语句。同样，我们可以使用 `break` 语句跳出循环。\n\n#### 练习：\n\n我们有\
    \ `$marks` 数组。我们将找到第一个高于 80 的成绩。一旦找到，我们将退出循环。好吗？\n\n```php\n//break\n$marks =\
    \ array(50,70,74,83,65);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\nforeach($marks\
    \ as $mark){\n if($mark > 80) break;\n echo \"<br> Mark Value: \".$mark;\n $sum\
    \ = $sum + $mark; \n echo \" Sum = \".$sum;\n}\n```\n\n**执行：**\n\n当您尝试执行上述代码块时，成绩将累加到\
    \ 74。一旦 `$mark > 80`，`break` 语句将退出循环。\n\n![3-3-3](img/image00204.jpeg)\n\n如果您将\
    \ `break` 语句放在循环内代码块的末尾，83 也将被累加，只剩下 65 被排除。\n\n### Continue\n\n如果发生指定条件，`continue`\
    \ 语句将中断循环中的**一次**迭代，并继续循环中的下一次迭代。\n\n#### 练习：\n\n我们有值为 50,70,74,83,65 的 `$marks`\
    \ 数组。我们将计算高于 60 的值的总和。为了排除 50，我们将使用 `continue` 语句。\n\n```php\n//continue\n$marks\
    \ = array(50,70,74,83,65);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\n\
    foreach($marks as $mark){\n if($mark < 60) continue;\n echo \"<br> Mark Value:\
    \ \".$mark;\n $sum = $sum + $mark; \n echo \" Sum = \".$sum;\n}\n```\n\n**执行：**\n\
    \n当 `$mark < 60` 时，我们提到了 `continue`，这意味着循环应该继续下一次迭代。\n\n![3-3-2](img/image00205.jpeg)\n\
    \n现在您能理解 `break` 和 `continue` 之间的区别吗？\n\n`continue` 语句继续循环迭代，跳过当前迭代，而 `break`\
    \ 语句则彻底退出循环！\n\n---\n\n### 3.4 正则表达式\n\n---\n\n正则表达式是形成搜索模式的字符序列。正则表达式可以是单个字符，也可以是更复杂的模式。正则表达式可用于执行所有类型的文本搜索和文本替换操作。\n\
    \n在 PHP 中，正则表达式是由以下部分组成的字符串：\n\n*   定界符，\n*   模式和\n*   可选修饰符。\n\n#### 定界符：\n\n\
    定界符可以是任何非字母、数字、反斜杠或空格的字符。最常用的定界符是正斜杠 (`/`)，但当您的模式包含正斜杠时，选择其他定界符（如 `#` 或 `~`）会更方便。\n\
    \n#### 模式：\n\n模式或搜索模式是我们用于搜索的字符序列。方括号用于查找字符范围：\n\n![3-4-1-pattern](img/image00206.jpeg)\n\
    \n**注意：**\n\n如果您的表达式需要搜索特殊字符之一，可以使用反斜杠 (`\\\\`) 进行转义。\n\n#### 修饰符：\n\n修饰符可以更改搜索的执行方式。\n\
    \n![3-4-2-modifier](img/image00207.jpeg)\n\n我们还可以在正则表达式中提及一些元字符和量词。\n\n#### 元字符\n\
    \n元字符是具有特殊含义的字符。它们可以包含在搜索模式中。\n\n![3-4-3-metacharacter](img/image00208.jpeg)\n\
    \n#### 量词\n\n量词定义数量。这告诉搜索字符或搜索模式的出现次数。\n\n![3-4-4-quantifier](img/image00209.jpeg)\n\
    \n#### 分组\n"
