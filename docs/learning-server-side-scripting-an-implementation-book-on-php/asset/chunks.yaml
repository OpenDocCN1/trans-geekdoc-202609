    \ 59, 65, 74);\necho \"Printing indexed array: &emsp;\";\necho $scores1[0].\"\
    &nbsp;\";\necho $scores1[1].\"&nbsp;\";\necho $scores1[2].\"&nbsp;\";\necho $scores1[3].\"\
