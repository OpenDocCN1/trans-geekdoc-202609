- raw: "\n\n**ISBN: 978-93-5620-360-0**\n\n# Learning Server-Side Scripting\n\n##\
    \ AN IMPLEMENTATION BOOK ON PHP-MySQL\n\nBy\n\n### SHANMUGAPRIYAA S\n\nTitle:\
    \ Learning Server-Side Scripting\n\nAuthor: Shanmugapriyaa S\n\nPublished By:\
    \ Self-Published\n\nCopyright © 2022 Shanmugapriyaa S.\n\nAll rights reserved.\
    \ No portion of this e-book may be reproduced in whole or in part in any form.\n\
    \n# Introduction\n\n* * *\n\nWebsites in the earlier years comprised only static\
    \ web pages, that is, web page content would appear exactly the same for every\
    \ user. The need for dynamic web pages started growing, where the pages appear\
    \ different for different users. To enable a web page to display dynamic content\
    \ for different users, we require a scripting language which is used along with\
    \ HTML in web pages. One such scripting language is PHP.\n\nHTML takes care of\
    \ rendering the web page design; while PHP takes care of processing the content\
    \ inside the web page. PHP not only helps in delivering dynamic content to the\
    \ page but also helps in interacting with databases to manipulate the stored data\n\
    \nThis e-book integrates learning and application development:\n\n*   Learning\
    \ server-side scripting language - PHP\n\n*   Developing Web Application using\
    \ PHP and MySQL relational database\n\n**What will you gain on reading and practising\
    \ this e-book?**\n\n*   Know the need of scripting languages\n\n*   Install PHP\
    \ in your system\n\n*   Work with PHP syntax and check results in the browser\n\
    \n*   Understand programming constructs such as conditionals, loops, files and\
    \ use them in scripting\n\n*   Understand the use of forms and web related concepts\n\
    \n*   Design a web application\n\n*   Set up the working environment and MySQL\
    \ database\n\n*   Design relevant forms for the application\n\n*   Connect the\
    \ forms with database using PHP-MySQL\n\n*   Bind the works as a web application\n\
    \nI assume, whoever reads this e-book will have exposure to HTML and SQL.\n\n\
    This e-book will help you design and develop a web application from scratch using\
    \ PHP and MySQL.\n\nYou can consider this e-book as a self-guiding material to\
    \ make your learning comfortable.\n\nLet us start learning!\n\n* * *\n\n# Chapter\
    \ 1: Overview of PHP\n\n* * *\n\n*   [](#part0004.xhtml)\n\n    #### 1.1 Introduction\
    \ to Web Application\n\n*   [](#part0005.xhtml)\n\n    #### 1.2 Role of Server-side\
    \ Scripting\n\n*   [](#part0006.xhtml)\n\n    #### 1.3 Introduction to PHP\n\n\
    *   [](#part0007.xhtml)\n\n    #### 1.4 Installation of PHP\n\n*   [](#part0008.xhtml)\n\
    \n    #### 1.5 Start Coding PHP\n\n* * *\n\n### 1.1 Introduction to Web Application\n\
    \n* * *\n\nWe will first understand the difference between a website and a web\
    \ application.\n\nA website is a collection of web pages. The website is hosted\
    \ on a web server and accessible via browser.\n\n*A web application is a software\
    \ or program, hosted in a server, which is accessible using any web browser.*\n\
    \n**Difference between website and web application:**\n\n![1-1-websiteandapplication](Images/image00130.jpeg)\n\
    \nWeb applications can be served through websites (that is, web pages).\n\nAll\
    \ websites run on three components: the server, the database, and the client.\n\
    \n*   The server is at a remote location anywhere in the world, running a site’s\
    \ back-end architecture, processing requests, and sending pages to the browser.\n\
    \n*   The database resides on a server.\n\n*   The client is anywhere your users\
    \ are viewing your site: mobile devices, laptops, or desktop computers.\n\n**Server-side\
    \ scripting is executed by a web server** whereas, client-side scripting is executed\
    \ by a browser.\n\nWhen we talk about servers, there are indeed two servers involved\
    \ in web applications.\n\n*   Web Server\n\n*   Application Server\n\nA web server\
    \ will be sufficient for a website while a web application would need a web server\
    \ and an application server.\n\n**Web server vs Application server:**\n\n*   A\
    \ web server accepts and fulfills requests from clients for static content (i.e.,\
    \ HTML pages, files, images, videos). Web servers handle HTTP requests and responses\
    \ only.\n\n*   An application server generates dynamic content. It is a software\
    \ framework that transforms data to provide the functionality offered by an application.\
    \ Application servers enhance the interactive parts of a website making a page\
    \ different for different users based on the request.\n\nHave a look at the diagram\
    \ below for a detailed view:\n\n![webserver-webapp](Images/image00131.jpeg)\n\n\
    ![1-1-webandapplicationserver](Images/image00132.jpeg)\n\nHope you are clear with\
    \ the explanation on servers.\n\n* * *\n\n### 1.2 Role of Server-side Scripting\n\
    \n* * *\n\nIn computing terminology, both “client” and “server” refer to computers\
    \ that are used for different purposes.\n\nWe will first discuss the difference\
    \ between client-side and server-side scripting or programming.\n\n**Client-side\
    \ Programming:**\n\nA client is a computer application, such as a web browser,\
    \ that runs on a user's local computer or workstation and connects to a server.\n\
    \nIt is the program that runs on the client machine (browser) and deals with the\
    \ user interface/display and any other processing that can happen on client machine.\n\
    \n**Features of client-side programming** include:\n\n1) Interact with temporary\
    \ storage\n\n2) Make interactive web pages\n\n3) Send request to server\n\n4)\
    \ Work as an interface between server and user\n\n**Programming languages for\
    \ client-side programming** are:\n\n1) JavaScript\n\n2) VBScript\n\n3) HTML\n\n\
    4) CSS\n\n5) AJAX\n\n**Server-side Programming:**\n\nA server machine is a large-capacity\
    \ computer that can store a wide variety of files such as application files and\
    \ data files.\n\nIt is the program that runs on server dealing with the generation\
    \ of web page content.\n\n**Features of server-side programming** include:\n\n\
    1) Querying the database\n\n2) Operations over databases\n\n3) Access/Write a\
    \ file on server.\n\n4) Interact with other servers.\n\n5) Structure web applications.\n\
    \n6) Process user input.  \n\n\\[For example, if user input is a text in search\
    \ box, run a search algorithm on the data stored on server and send the results\\\
    ]\n\n**Programming languages for server-side programming** are:\n\n1) PHP\n\n\
    2) C++\n\n3) Java and JSP\n\n4) Python\n\n5) Ruby on Rails\n\nWe have now learnt\
    \ some information on client side and server side programming.\n\nLet us now learn\
    \ 2 other terminologies: front-end and back-end.\n\n**Front-end vs Back-end:**\n\
    \nFront-end development involves all the things the user sees and interacts with,\
    \ making web design and user experience as key concerns. Back-end development\
    \ covers the server and databases.\n\nIn practice, front-end development is usually\
    \ focused on client-side techniques that make use of HTML, CSS and JavaScript,\
    \ while server-side scripting remains more relevant to back-end developers.\n\n\
    Overall, this e-book is based on back-end development where we induce server-side\
    \ scripting.\n\n**Role of Server-side scripting:**\n\nThe diagram below gives\
    \ a nutshell view of the various roles done by server-side scripts.\n\n![serverside-scripting-role](Images/image00133.jpeg)\n\
    \nLet us have a tabulated look on the advantages and disadvantages of server-side\
    \ scripting:\n\n![1-2advantagesdisadvantages](Images/image00134.jpeg)\n\nThe majority\
    \ of websites now use dynamic content, much of which is managed using server-side\
    \ scripting. Without server-side scripting, the functionality of the internet\
    \ (as we know it today) would just not exist.\n\nIn this e-book, we will learn\
    \ about the server-side scripting language - PHP.\n\n* * *\n\n### 1.3 Introduction\
    \ to PHP\n\n* * *\n\n*PHP (Hypertext Preprocessor) is a programming language that\
    \ allows web developers to create dynamic content that interacts with databases.*\n\
    \n*   PHP is a widely used open source server scripting language and a powerful\
    \ tool for making dynamic and interactive Web pages.\n\n*   PHP is basically used\
    \ for developing web based software applications.\n\n*   PHP code is executed\
    \ on the server.\n\nIf you are a beginner in learning server side languages, then\
    \ PHP will be the right and the easiest choice to start with."
