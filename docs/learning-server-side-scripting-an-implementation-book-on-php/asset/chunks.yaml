    <br><br>Printing $scores2 <br>\";\nvar_dump($scores2);\n\n//Sorting associative\
    \ arrays by values\narsort($scores2);\necho \"<br><br>Printing $scores2 after\
    \ sorting by values: <br>\";\nvar_dump($scores2);\n\n//Sorting associative arrays\
    \ by keys\nkrsort($scores2);\necho \"<br><br>Printing $scores2 after sorting by\
    \ keys: <br>\";\nvar_dump($scores2);\n```\n\n**Execute:**\n\nWe use var\\_dump()\
    \ function to get the values of sorted arrays,\n\nIn sorting $scores2,\n\n*  \
    \ the array is sorted in descending order of the values when using arsort() function.\n\
    \n*   the array in sorted in descending order of the keys when using krsort()\
    \ function.\n\n![2-5-3](Images/image00173.jpeg)\n\nWith this, the discussion on\
    \ arrays comes to an end!\n\n* * *\n\n### 2.6 User-defined Functions - I\n\n*\
    \ * *\n\nBesides the built-in PHP functions, it is possible to create your own\
    \ functions.\n\n*   A function is a block of statements that can be used repeatedly\
    \ in a program.\n\n*   A function will not execute automatically when a page loads.\n\
    \n*   A function will be executed by a call to the function.\n\n**How to create\
    \ a (user-defined) function?**\n\nA user-defined function is declared using the\
    \ word function.\n\n**Syntax**\n\n```\nfunction function_name(){\n   code to be\
    \ executed;\n}\n```\n\nA function name must start with a letter or an underscore.\
    \ Function names are NOT case-sensitive. Always choose a name that reflects what\
    \ the function does! The name should serve the purpose!\n\n**Function Arguments:**\n\
    \nInformation can be passed to functions through arguments. An argument is just\
    \ like a variable.\n\nArguments are specified after the function name, inside\
    \ the parentheses. You can add as many arguments as you want, just separate them\
    \ with a comma.\n\n**Practice:**\n\nWe will look over two functions now:\n\n```\n\
    //User Defined functions\n\nfunction print_message(){\n echo \"<p>Message printed\
