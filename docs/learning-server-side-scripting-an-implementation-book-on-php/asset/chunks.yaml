    \n![2-7-9](Images/image00186.jpeg)\n\n**PHP Magic constants:**\n\nPHP provides\
    \ a large number of predefined constants to any script which it runs.\n\nThere\
    \ are five magical constants that change, depending on where they are used. For\
    \ example, the value of `__LINE__` depends on the line that it is used on, in\
    \ your script. These special constants are case-insensitive and are as follows:\n\
    \n![2-8](Images/image00187.jpeg)\n\nWe will use 2 constants for example to see\
    \ what they do:\n\n```\n//Magic Constants\n echo \"<p>Example for __FILE__</p>\"\
    ;    \n //print full path of file with .php extension    \n echo __FILE__ ; \n\
    \ echo \"<p>Example for __LINE__</p>\";    \n //print full path of file with .php\
    \ extension    \n echo \"You are at Line number: \".__LINE__;  \n```\n\n![2-7-10](Images/image00188.jpeg)\n\
    \nMy line number is 374 because I have commented all the codes and kept this snippet\
    \ in the end!\n\n**Just remember**: Constants are like variables except that once\
    \ they are defined they cannot be changed or undefined.\n\n***\n\n# Chapter 3:\
    \ Conditionals and Loops\n\n***\n\n*   [3.1 Operators](#31-operators)\n*   [3.2\
    \ Conditional Statements](#32-conditional-statements)\n*   [3.3 Loops](#33-loops)\n\
    *   [3.4 Regular Expressions](#34-regular-expressions)\n*   [3.5 Exceptions](#35-exceptions)\n\
    \n***\n\n### 3.1 Operators\n\n***\n\nOperators are used to perform operations\
    \ on variables and values.\n\nPHP has the following classification:\n\n*   Arithmetic\
    \ operators\n*   Assignment operators\n*   Comparison operators\n*   Increment/Decrement\
    \ operators\n*   Logical operators\n*   String operators\n*   Array operators\n\
    *   Conditional assignment operators\n\nWe will need to know about operators so\
    \ that we can use them in conditional and loop statements!\n\n**Arithmetic Operators:**\n\
    \nThe arithmetic operators are used with numeric values to perform common arithmetical\
    \ operations.\n\n![3-1-arithmetic](Images/image00189.jpeg)\n\n**Assignment Operators:**\n\
    \nThe assignment operators are used with numeric values to write a value to a\
    \ variable. The basic assignment operator in PHP is `=`. It means that the left\
    \ operand is assigned the value of the assignment expression on the right.\n\n\
    ![3-1-assignment](Images/image00190.jpeg)\n\n**Comparison Operators:**\n\nThe\
    \ comparison operators are used to compare two values (number or string).\n\n\
    ![3-1-comparison](Images/image00191.jpeg)\n\n**Increment / Decrement Operators:**\n\
    \nThe increment operators are used to increment a variable's value while the decrement\
    \ operators are used to decrement a variable's value. The placement of operator\
    \ before/after the variable decides whether it returns the incremented / decremented\
    \ value or returns the value first and then increments / decrements the value.\n\
    \n![3-1-increment-decrement](Images/image00192.jpeg)\n\n**Practice:**\n"
  trans: "\nwhat\\_is\\_php(`$str`, `$callfunction`) => `$str` 是传递给函数的参数，`$callfunction`\
    \ 是接收该参数的函数名称！\n\n请看输出结果！\n\n![](img/image00183.jpeg)\n\nPHP 是通过 `$str` 变量提供给\
    \ `explain` 和 `purpose` 函数的参数！还请记住，前两个函数只是返回字符串，而第三个函数才是真正包含 `echo` 语句、用于打印前两个函数返回字符串的函数。\n\
    \n***\n\n我们有东西要讨论！通常函数不必放在同一个 PHP 文件中。它们可以写在另一个 php 文件中，然后包含在你实际想要使用的页面中！\n\n\
    明白我的意思了吗？函数可以单独定义，并在需要的地方/时间包含进来！\n\n我们现在将讨论两个用于此目的的语句！\n\n**Include / Require（包含/引入）：**\n\
    \n**include** 或 **require** 语句会获取指定文件中存在的所有文本/代码/标记，并将其复制到使用 include 语句的文件中。\n\
    \n当你想在网站的多个页面上包含相同的 PHP、HTML 或文本时，包含文件非常有用。\n\n可以使用 **include** 或 **require**\
    \ 语句将一个 PHP 文件的内容插入到另一个 PHP 文件中（在服务器执行之前）。\n\n这两个语句完全相同，除了失败时的表现不同：\n\n*   **require**\
    \ 会产生一个致命错误（`E_COMPILE_ERROR`）并停止脚本执行\n*   **include** 只会产生一个警告（`E_WARNING`），脚本将继续执行\n\
    \n因此，如果你希望即使包含的文件丢失，执行仍能继续并向用户显示输出，请使用 include 语句。对于执行流程所需的关键文件，请始终使用 require\
    \ 语句。这有助于避免应用程序的安全性和完整性受到损害，以防某个关键文件意外丢失。\n\n**语法：**\n\n```\ninclude 'filename';\n\
    or\nrequire 'filename';\n```\n\n**实践：**\n\n现在创建 2 个 php 文件：`file1.php` 和 `file2.php`\n\
    \n`file1.php` 的内容：\n\n```\n<?php\nfunction print_name($name){\n echo \"Name of\
    \ the course: \".$name;\n}\n?>\n```\n\n`file2.php` 的内容：\n\n```\n<?php\necho \"\
    Try accessing function \";\nprint_name(\"PHP Scripting\");\n?>\n```\n\n**执行：**\n\
    \n尝试执行 `file2.php`：\n\n会报致命错误，提示函数名未定义\n\n![2-7-5](img/image00184.jpeg)\n\n**修改代码：file2.php**\n\
    \n确保 `file1.php` 和 `file2.php` 在同一位置！再次保存 `file2.php`！\n\n```\n<?php\ninclude('file1.php');\n\
    echo \"<br>Try accessing function after include\";\nprint_name(\"PHP Scripting\"\
    );\n?>\n```\n\n尝试执行 `file2.php`：\n\n![2-7-6](img/image00185.jpeg)\n\n你也可以尝试使用\
    \ require 语句执行。\n\n**提示：**\n\n*   当文件是应用程序所需时，使用 require。\n*   当文件不是必需的，且即使找不到文件应用程序也应继续运行时，使用\
    \ include。\n\n开发应用程序时，你可以将所有用户定义的函数放在一个 php 文件中，然后在需要调用其中任何函数的页面中使用它。\n\n***\n\
    \n### 2.8 Constants（常量）\n\n***\n\n常量是一个简单值的标识符（名称）。该值在脚本执行期间不能被改变。\n\n*   默认情况下，常量区分大小写。\n\
    *   按照惯例，常量标识符总是大写。\n*   常量名称以字母或下划线开头，后面跟任意数量的字母、数字或下划线。\n*   如果你已定义一个常量，它就永远不能被更改或取消定义。\n\
    *   与变量不同，常量在整个脚本中自动是全局的。\n*   常量只能包含标量数据（布尔值、整数、浮点数和字符串）。\n\n**常量与变量的区别：**\n\n\
    *   常量前不需要写美元符号（`$`），而变量必须写美元符号。\n*   常量不能通过简单赋值定义，只能使用 `define()` 函数定义。\n*  \
    \ 常量可以在任何地方定义和访问，无需考虑变量作用域规则。\n*   一旦常量被设置，就不能被重新定义或取消定义。\n\n**语法**\n\n要创建常量，请使用\
    \ `define()` 函数。\n\n```\ndefine(name, value, case-insensitive);\n```\n\n参数：\n\n\
    *   name：指定常量的名称\n*   value：指定常量的值\n*   case-insensitive：指定常量名称是否不区分大小写。默认为 false\n\
    \n**实践：**\n\n现在，回到你一直在编码的 `section2.php`！关闭 `file1.php` 和 `file2.php`！\n\n```\n\
    //Constants\ndefine(\"PHPMARK\",75);\ndefine(\"SQLMARK\",70,true);\ndefine(\"\
    courses\",[\"PHP\",\"SQL\"]);\necho \"<br>PHP Mark - \".PHPMARK;\necho \"<br>SQL\
    \ Mark - \".SQLMARK;\necho \"<br>SQL Mark (case insensitive is true) - \".sqlmark;\n\
    echo \"<br>PHP Mark (case insensitive is false) - \".phpmark;\necho \"<br>Current\
    \ Course - \".courses[0];\n```\n\n**执行：**\n\n输出包含由 phpmark 用法触发的警告。\n\n实际上在创建\
    \ SQLMARK 时，我们将第三个参数设为 true，这意味着该常量可以大写或小写引用，因为 case-insensitive 设置为 true！\n\n\
    但 PHPMARK 的第三个参数默认设为 false！\n\n![2-7-9](img/image00186.jpeg)\n\n**PHP 魔术常量：**\n\
    \nPHP 为其运行的任何脚本提供了大量预定义常量。\n\n有五个魔术常量会根据使用位置的不同而改变。例如，`__LINE__` 的值取决于它在脚本中的行号。这些特殊常量不区分大小写，如下所示：\n\
    \n![2-8](img/image00187.jpeg)\n\n我们将用 2 个常量为例来看看它们的作用：\n\n```\n//Magic Constants\n\
    \ echo \"<p>Example for __FILE__</p>\";    \n //print full path of file with .php\
    \ extension    \n echo __FILE__ ; \n echo \"<p>Example for __LINE__</p>\";   \
    \ \n //print full path of file with .php extension    \n echo \"You are at Line\
    \ number: \".__LINE__;  \n```\n\n![2-7-10](img/image00188.jpeg)\n\n我的行号是 374，因为我注释掉了所有代码并将此片段放在最后！\n\
    \n**请记住**：常量类似于变量，不同之处在于一旦定义，就不能更改或取消定义。\n\n***\n\n# Chapter 3: Conditionals and\
    \ Loops（第 3 章：条件语句和循环）\n\n***\n\n*   3.1 Operators\n*   3.2 Conditional Statements\n\
    *   3.3 Loops\n*   3.4 Regular Expressions\n*   3.5 Exceptions\n\n***\n\n### 3.1\
    \ Operators（运算符）\n\n***\n\n运算符用于对变量和值执行操作。\n\nPHP 具有以下分类：\n\n*   算术运算符\n*   赋值运算符\n\
    *   比较运算符\n*   自增/自减运算符\n*   逻辑运算符\n*   字符串运算符\n*   数组运算符\n*   条件赋值运算符\n\n我们需要了解运算符，以便在条件语句和循环语句中使用它们！\n\
    \n**Arithmetic Operators（算术运算符）：**\n\n算术运算符用于数值，执行常见的算术运算。\n\n![3-1-arithmetic](img/image00189.jpeg)\n\
    \n**Assignment Operators（赋值运算符）：**\n\n赋值运算符用于数值，将值写入变量。PHP 中基本的赋值运算符是 `=`。这意味着左操作数被赋予右侧赋值表达式的值。\n\
    \n![3-1-assignment](img/image00190.jpeg)\n\n**Comparison Operators（比较运算符）：**\n\
    \n比较运算符用于比较两个值（数字或字符串）。\n\n![3-1-comparison](img/image00191.jpeg)\n\n**Increment\
    \ / Decrement Operators（自增/自减运算符）：**\n\n自增运算符用于增加变量的值，而自减运算符用于减少变量的值。运算符放在变量之前/之后决定了是返回增加/减少后的值，还是先返回值再增加/减少值。\n\
    \n![3-1-increment-decrement](img/image00192.jpeg)\n\n**Practice（实践）：**\n"
