- raw: "We have one more task here, when you click the link, the details have to be\
    \ displayed. We will display the details in the same page when you click the link.\n\
    \nShall we add some more code?\n\nUse save as or create a file named **details.php**.\
    \ As usual, replace the main element with the following code:\n\n```\n<main>\n\
    <section style=\"text-align:left;padding: 0 30px;\">\n<h3>Course Details</h3>\n\
    <?php\nrequire('connect.php');\nif(isset($_REQUEST['search'])){\n $search = $_REQUEST['search'];\n\
    }\n$query = \"SELECT * FROM courses WHERE course_code = $search\";\n$select_courses\
    \ = mysqli_query($con,$query);\nif($selected = mysqli_fetch_row($select_courses)){\n\
    \ echo \"<h4>\".$selected[1].\"</h4>\";\n echo \"<h5> Instructor: \";\n $find_instructor\
    \ = mysqli_query($con,\"SELECT instruct_name FROM instructors WHERE instruct_mail\
    \ = '$selected[2]'\");\n $found = mysqli_fetch_array($find_instructor);\n echo\
    \ $found['instruct_name'];\n echo \"</h5>\";\n echo \"<h5>Description:</h5>\"\
    ;\n echo \"<p>\".$selected[3].\"</p>\";\n echo \"<h5>Outcomes:</h5>\";\n $temp\
    \ = explode(\",\",$selected[4]);\n echo \"<ul>\";\n foreach($temp as $t){\n  \
    \ echo \"<li>\".$t.\"</li>\";\n } \n echo \"</ul>\"; \n echo \"<h5>Eligibility:</h5>\"\
    ;\n $temp = explode(\",\",$selected[5]);\n echo \"<ul>\";\n foreach($temp as $t){\n\
    \   echo \"<li>\".$t.\"</li>\";\n } \n echo \"</ul>\";\n echo \"</div>\";\n}\n\
    ?>\n</section>\n</main>\n```\n\nLet me explain and then you can execute:\n\n```\n\
    if(isset($_REQUEST['search'])){\n  $search = $_REQUEST['search'];\n}\n```\n\n\
    This part is used to retrieve the search value (course code) from the previous\
    \ page <a> tag reference (search=$selected\\[0\\]).\n\n```\n$query = \"SELECT\
    \ * FROM courses WHERE course_code = $search\";\n$select_courses = mysqli_query($con,$query);\n\
    if($selected = mysqli_fetch_row($select_courses)){\n\techo \"<h4>\".$selected[1].\"\
    </h4>\";\n```\n\nWe filter the query using the course\\_code = $search condition.\
    \ So, only one record will be selected. Instead of while, we will use the if()\
    \ statement since only one record is displayed.\n\n```\necho \"<h5> Instructor:\
    \ \";\n$find_instructor = mysqli_query($con,\"SELECT instruct_name FROM instructors\
    \ WHERE instruct_mail = '$selected[2]'\");\n$found = mysqli_fetch_array($find_instructor);\n\
    echo $found['instruct_name'];\necho \"</h5>\";\n```\n\nWe have displayed the instructor\
    \ of the course here. Instructor id is stored in the course table. So, we frame\
    \ a query to fetch instructor name using $selected\\[2\\] array element which\
    \ holds the instructor id. This time, we fetch the details in an array using mysqli\\\
    _fetch\\_array(). We treat it as an associative array and retrieve the field using\
    \ the key - the name of the field in the table.\n\n```\necho \"<h5>Outcomes:</h5>\"\
    ;\n$temp = explode(\",\",$selected[4]);\necho \"<ul>\";\nforeach($temp as $t){\n\
    \  echo \"<li>\".$t.\"</li>\";\n}\necho \"</ul>\";\n```\n\nThis part is new for\
    \ us, so we will cover this here.\n\n*   explode will convert a string as string\
    \ of arrays using a separator. We have already used this in uploading file for\
    \ extracting file extension.\n\n*   We have commas separated statements in outcomes\
    \ and eligibility. So, using comma as separator, we convert the single string\
    \ to array of strings.\n\n*   Since $temp is an array, we use foreach loop to\
    \ print the array element. We print them in an unordered list for neat appearance.\n\
    \nWe use the same strategy for displaying eligibility too.\n\n**How do we execute\
    \ now?**\n\nGo to [http://localhost/onlinecourse/courses.php](#part0045.xhtml)\
    \ and click on Course Name 1:\n\n![7-4-2](Images/image00326.jpeg)\n\nSimilarly,\
    \ when you click Course 2, we will get the details of that course.\n\nWe have\
    \ done the display course part of retrieval process. We are yet to include a search\
    \ feature in the course page. Let us move to the next section.\n\n* * *\n\n###\
    \ 7.6 Updating Data\n\n* * *\n\nFor updating data, we will again use mysqli\\\
    _query() function with UPDATE statement of SQL.\n\nWe have profiles of 2 users\
    \ (instructors and learners) and course details whose fields can be updated.\n\
    \nFor editing profiles, we have to choose profile based on user category to update\
    \ the concerned table. We will pick updating course details for this section.\n\
    \nHope you have your newcourse.php file. Do a **Save as** to the file and name\
    \ it as **editcourse.php**\n\nWe will do data update for course\\_code = 1. Reason\
    \ is, when you bind pages as an application, course\\_code value will be sent\
    \ to this page via variable. Here, we are individually working on this page, so,\
    \ for now, we will go with the first course.\n\nNow, we will do 2 editing works\
    \ here:\n\n*   Change the form design to include details of selected course\n\n\
    *   Change the php segment with retrieving course details and update the same\n\
    \nWe will carry out this process in 3 phases:\n\n*   Retrieval of course details\
    \ in php\n\n*   Form design for updating fields\n\n*   Update statements for fields\
    \ in php\n\n**Phase-1: Retrieval code in php**\n\nFirst, we will update the top\
    \ php segment:\n\n```\n<?php\nrequire('connect.php');\n$course = 1;\n$instructor\
    \ = 'instructor1@onlinecourse.com';\n$get_details = mysqli_query($con,\"SELECT\
    \ * FROM courses WHERE course_code = $course\");\nif($details = mysqli_fetch_row($get_details)){\n\
    \ $titleval = $details[1];\n $describeval = $details[3]; \n $outcomeval = $details[4];\n\
    \ $eligibleval = $details[5]; \n}\n```\n\nThis code is retrieving the course details\
    \ of a particular course. Here, the course code is 1. So it is retrieving the\
    \ first course details. The values of $course and $instructor variables are passed\
    \ from the previous page in the actual application. For now, we will just assign\
    \ values. In the next chapter, we will alter the code accordingly.\n\n**Phase-2:\
    \ Design modification**\n\nReplace the main tag element with the code below:\n\
    \n```\n<main>\n<section>\n<h3> Edit Course Details </h3>\n<p>\n<form method=\"\
    post\" name=\"frmeditcourse\">\n<input type=\"hidden\" name=\"txtcourse\" value=\"\
    <?php echo $course; ?>\">\n<input type=\"hidden\" name=\"txtinstruct\" value=\"\
    <?php echo $instructor; ?>\">\n<p><input type=\"text\" name=\"txtcourse\" size=\"\
    60\" value=\"<?php echo $titleval; ?>\"></p>\n<p><textarea name=\"txtdesc\" cols=\"\
    60\"><?php echo $describeval; ?></textarea></p>\n<p><textarea name=\"txtoutcome\"\
    \ cols=\"60\"><?php echo $outcomeval; ?></textarea></p>\n<p><textarea name=\"\
    txteligible\" cols=\"60\"><?php echo $eligibleval; ?></textarea></p>\n<p><input\
    \ type=\"submit\" name=\"editcourse\" value=\"Update Course\" class=\"frmbtn\"\
    ></p>\n</form>\n</p>\n</section>\n</main>\n```\n\nThere is a small modification\
    \ done to the values of the variables. We place the values retrieved from the\
    \ database into the form. We can modify the existing values and click update.\n\
    \nExecute: [http://localhost/onlinecourse/editcourse.php](#part0046.xhtml)\n\n\
    ![7-6-1](Images/image00327.jpeg)\n\nDo not do any changes now or click update.\
    \ We have not added update code so far.\n\n**Phase-3: Update fields in php**\n\
    \nWe have a php segment in the top right? Add these lines to that segment. For\
    \ clarity, I will post the complete code."
