- raw: "You can use parentheses ( ) to apply quantifiers to entire patterns. They\
    \ can also be used to select parts of the pattern to be used as a match.\n\nWhere\
    \ and how are we going to use these regular expressions? We have functions for\
    \ that purpose. We will use these expressions in those functions. We will apply\
    \ modifiers, quantifiers in an expression and use the same as a function parameter.\n\
    \nLet me directly show you some functions and then we will go to practice session.\n\
    \n**Regular Expression Functions**\n\nPHP provides a variety of functions that\
    \ allow you to use regular expressions.\n\n![3-4-5-function](Images/image00210.jpeg)\n\
    \n**Practice:**\n\nWe will look at some of the most commonly used functions here.\
    \ We will use delimiters, modifiers, quantifiers in these examples!\n\n```\n//Regular\
    \ expression\n$str_array = array(\"Hello World\",\"New World\",\"Welcome to New\
    \ Course\", \"This is a new course\",\"Hello is the first word tested\");\n\n\
    //case sensitive search\n$pattern1 = \"/New/\";\necho \"<br>Case sensitive Search\
    \ Pattern: \".$pattern1;\nforeach ($str_array as $str){\n  echo \"<br>String:\
    \ \".$str.\" | Search result - \".preg_match($pattern1,$str);\n}\n\n//case insensitive\
    \ search\n$pattern2 = \"/New/i\";\necho \"<br><br>Case insensitive Search Pattern:\
    \ \".$pattern2;\nforeach ($str_array as $str){\n  echo \"<br>String: \".$str.\"\
    \ | Search result - \".preg_match($pattern2,$str);\n}\n\n$pattern3 = \"/is/i\"\
    ;\necho \"<br><br>Case insensitive Search all pattern: \".$pattern3;\nforeach\
    \ ($str_array as $str){\n  echo \"<br>String: \".$str.\" | Search result - \"\
    .preg_match_all($pattern3,$str);\n}\n\n$pattern4 = \"/world/i\";\necho \"<br><br>Case\
    \ insensitive Replace pattern: \".$pattern4;\nforeach ($str_array as $str){\n\
    \  echo \"<br>String: \".$str.\" | Search result - \".preg_replace($pattern4,'universe',$str);\n\
    }\n\n//using quantifiers\n$pattern5 = \"/(l){2}/\";\necho \"<br><br>Case sensitive\
    \ Search all pattern: \".$pattern5;\nforeach ($str_array as $str){\n  echo \"\
    <br>String: \".$str.\" | Search result - \".preg_match($pattern5,$str);\n}\n```\n\
    \nWe have used 5 patterns in this example code snippet\n\n*   `$pattern1 = \"\
    /New/\";`\n\n*   `$pattern2 = \"/New/i\";`\n\n*   `$pattern3 = \"/is/i\";`\n\n\
    *   `$pattern4 = \"/world/i\";`\n\n*   `$pattern5 = \"/(l){2}/\";`\n\nLet us analyse\
    \ the above patterns!\n\n*   The delimiter used here is /. It means, the delimiter\
    \ specifies the start and stop of the pattern string.\n\n*   The use of modifier\
    \ i next to delimiter at the end will say that the pattern search should be case\
    \ insensitive as opposed to default sensitive search.\n\n*   The last pattern\
    \ uses a quantifier specifying the character 'l' should occur twice.\n\n**Execute:**\n\
    \nOn execution, try to check if the pattern search is giving the same output as\
    \ you guessed.\n\n![3-4](Images/image00211.jpeg)\n\n* * *\n\n### 3.5 Exceptions\n\
    \n* * *\n\nAn exception is an object that describes an error or unexpected behaviour\
    \ of a PHP script.\n\nExceptions are thrown by many PHP in-built functions / classes\
    \ and user defined functions / classes. They are a good way to stop a function\
    \ when it comes across data that it cannot use.\n\nThere might be some places\
    \ in the code where we feel a wrong input may result in an error. To a normal\
    \ user, they might not have any clues on working with the input. So, when they\
    \ provide a wrong input, an exception can give them appropriate message on what\
    \ went wrong.\n\nSince this e-book does not cover object oriented programming,\
    \ we will discuss exceptions related to functions alone.\n\n**The Exception Object**\n\
    \nThe Exception Object contains information about the error or unexpected behaviour\
    \ that the function encountered. Though this part uses objects, we will learn\
    \ it for using in functions.\n\nWe have two actions related to exceptions:\n\n\
    *   throw an exception - throw information that some error has occurred\n\n* \
    \  catch an exception - tell what the exception is (hinting on what kind of error\
    \ has occurred)\n\n**Syntax**\n\n```\nnew Exception(message, code, previous)\n\
    ```\n\nParameters:\n\nAll the parameters are optional.\n\n*   message - A string\
    \ describing why the exception was thrown\n\n*   code - an integer that can be\
    \ used to easily distinguish this exception from others of the same type\n\n*\
    \   previous - If this exception was thrown in a catch block of another exception,\
    \ it is recommended to pass that exception into this parameter\n\n**Throwing an\
    \ Exception**\n\nThe throw statement allows a user defined function or method\
    \ to throw an exception. When an exception is thrown, the code following it will\
    \ not be executed.\n\nIf an exception is not caught, a fatal error will occur\
    \ with an \"Uncaught Exception\" message.\n\n**Practice:**\n\nWe will look into\
    \ an example now where we use an exception. This is a universal example of using\
    \ exceptions so that everyone understands it clearly.\n\nWe will look into the\
    \ code segment without throwing exception:\n\n```\n//Exception\nfunction divide($dividend,$divisor){\n\
    \treturn ($dividend / $divisor);\n}\n\necho \"<br>Division 10/5 = \".divide(10,5);\n\
    echo \"<br>Division 10/0 = \".divide(10,0);\n```\n\n![3-5-1](Images/image00212.jpeg)\n\
    \nCan you see? 10/0 gives infinity.\n\nNow, we will include exception in our code:\n\
    \n```\n//Exception\nfunction divide($dividend,$divisor){\n if($divisor == 0){\n\
    \tthrow new Exception(\"Division by zero\");\n }\n return ($dividend / $divisor);\n\
    }\n\necho \"<br>Division 10/5 = \".divide(10,5);\necho \"<br>Division 10/0 = \"\
    .divide(10,0);\n```\n\nNow, the output will be:\n\n![3-5-2](Images/image00213.jpeg)\n\
    \nThis exception does not allow the function to return any value when it finds\
    \ the value of the variable $divisor as 0, there by not allowing the relevant\
    \ echo statement also to be printed.\n\nTo a normal user using your web page,\
    \ INF may not be clear, but an error message will mean that their input is not\
    \ valid. This might be a small example so it cannot have much impact on displaying\
    \ INF without exceptions. Moreover, the INF value is not used further. But when\
    \ you develop real time applications, it becomes a big deal when one output is\
    \ forwarded to other parts of program, sometimes resulting in an uncontrolled\
    \ loop. So let us practise using exceptions.\n\nNow, we will have a look on the\
    \ catch statement.\n\n**try...catch Statement**\n\nTo avoid the error from the\
    \ example above, we can use the try...catch statement to catch exceptions and\
    \ continue the process.\n\n**Syntax**\n\n```\ntry {\n  code that can throw exceptions\n\
    } catch(Exception $ex) {\n  code that runs when an exception is caught\n}\n```\n\
    \nThe catch block indicates what type of exception should be caught and the name\
    \ of the variable which can be used to access the exception. In the example above,\
    \ the type of exception is Exception and the variable name is $ex.\n\n**Practice:**\n\
    \n```\n//Exception\nfunction divide($dividend,$divisor){\n if($divisor == 0){\n\
    \tthrow new Exception(\"Division by zero\");\n }\n return ($dividend / $divisor);\n\
    }\n\necho \"<br>Division 10/5 = \".divide(10,5);\necho \"<br>Division 10/0 = \"\
    ;\ntry{\n  echo divide(10,0);\n}catch (Exception $ex){\n  echo \"Unable to divide\"\
    ;\n}\n```\n\n**Execute:**\n\n![3-5-3](Images/image00214.jpeg)\n\n**The try...catch...finally\
    \ Statement**\n\nThe try...catch...finally statement can be used to catch exceptions.\
    \ Code in the finally block will always run regardless of whether an exception\
    \ was caught. If finally is present, the catch block is optional.\n\n**Syntax**\n\
    \n```\ntry {\n  code that can throw exceptions\n} catch(Exception $e) {\n  code\
    \ that runs when an exception is caught\n} finally {\n  code that always runs\
    \ regardless of whether an exception was caught\n}\n```\n\n**Practice:**\n\nWe\
    \ will rewrite the same example with finally:\n\n```\n//Exception\nfunction divide($dividend,$divisor){\n\
    \ if($divisor == 0){\n\tthrow new Exception(\"Division by zero\");\n }\n return\
    \ ($dividend / $divisor);\n}\n\necho \"<br>Division 10/5 = \".divide(10,5);\n\
    echo \"<br>Division 10/0 = \";\ntry{\n  echo divide(10,0);\n}catch (Exception\
    \ $ex){\n  echo \"Unable to divide\";\n}finally{\necho \"<br> End of Program\"\
    ;\n}\n```\n\n**Execute:**\n\nNow, we will get an output with the echo statement\
    \ from the finally block.\n\n![3-5-4](Images/image00215.jpeg)\n\n**Methods**"
