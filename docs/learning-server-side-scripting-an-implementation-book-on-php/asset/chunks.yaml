    \nBefore execution, let us create one more course so that we can know how `cl`\
    \ styled `div` tag works.\n\n*   Go to [http://localhost/onlinecourse/newcourse.php](#part0045.xhtml)\n\
    *   Place the values in the fields:\n    *   Title: Course 2\n    *   Description:\
    \ Description for course 2 is provided here. This course will be useful to enable\
    \ search and find feature in the courses page.\n    *   Outcome: Helps finding\
    \ courses, Helps searching courses, Helps filtering courses\n    *   Eligibility:\
    \ Anyone can search, Only registered can enrol.\n\nNow, execute the courses page.\
    \ You can execute in 2 ways:\n\n*   Go to [http://localhost/onlinecourse](#part0045.xhtml)\
    \ and click Courses menu\n*   OR Directly fetch [http://localhost/onlinecourse/courses.php](#part0045.xhtml)\n\
    \n![7-4-1](Images/image00325.jpeg)\n\nNow, you can see how these two `div` tags\
    \ are created and placed. Place your mouse (do not click) over the course title.\
    \ Left bottom corner you will find the url with the search value.\n\n*   When\
    \ you hover on Course Name 1, the url will be [http://localhost/onlinecourse/display.php?search=1](#part0045.xhtml)\n\
    *   When you hover on Course 2, the url will be [http://localhost/onlinecourse/display.php?search=2](#part0045.xhtml)\n"
  trans: "\n我们定义了一个数组变量 `$exts` 来存放允许的扩展名。我们使用 `in_array()` 函数将提取的扩展名与数组中的元素（扩展名）进行比较。如果扩展名不被允许，我们将以弹窗形式打印一条消息。如果扩展名被允许，则执行\
    \ `else` 部分。\n\n```\n$newpath = 'uploads/';\nif (!is_dir($newpath)) {\n  mkdir($newpath,\
    \ 0777, true);\n}\n```\n\n我们将文件存储在 `onlinecourse` 文件夹内的 `uploads` 文件夹中。但是我们有这个文件夹吗？没有！所以我们使用\
    \ `is_dir()` 函数检查该文件夹是否存在。如果不存在，它将创建一个名为 `uploads` 的文件夹，并赋予放置内容的权限。\n\n```\n$filepath\
    \ = $newpath . strtotime(\"now\") . '.' . $file_ext;\nmove_uploaded_file($filetmp,\
    \ $filepath);\n```\n\n在这里，我们尝试将文件重命名为上传时间的字符串。这可以避免同名文件被覆盖。我们获取当前时间的字符串值，并加上来自\
    \ `$file_ext` 变量的适当扩展名。新文件路径将是 `uploads/时间字符串格式.扩展名`。我们将文件从临时位置移动到新路径。\n\n```\n\
    $insert = mysqli_query($con, \"INSERT INTO contents VALUES (NULL, '$title', $course,\
    \ '$filepath')\");\nif ($insert) {\n  echo \"<script>alert('Content Uploaded successfully!');</script>\"\
    ;\n} else {\n  echo \"<script>alert('Something went wrong, Try again!');</script>\"\
    ;\n}\n```\n\n我们将文件路径插入数据库。插入语句的第三个值是 `1`，这是一个整数。所以，我们没有加引号。\n\n在执行此文件之前，我们需要：\n\
    \n*   创建一些扩展名为 `txt`、`rtf`、`doc`、`docx`、`pdf`、`ppt`、`pptx` 和 `mp4` 的文件。\n*   不要将文件放在\
    \ `htdocs` 中。将其放在其他地方（如桌面）。\n\n执行后，您可以：\n\n*   尝试上传其中一个文件\n*   尝试上传一些图片，因为它们的扩展名不被允许，检查是否显示带有消息的弹窗\n\
    *   转到 `C:/xampp/htdocs/onlinecourse` 检查是否创建了 `uploads` 文件夹\n*   还要检查上传的文件是否存在且内容是否仍然相同\n\
    \n**注意：** 一次只能上传一个文件\n\n执行 `localhost/onlinecourse/uploadcontent.php`\n\n![7-3-6](img/image00321.jpeg)\n\
    \n![7-3-7](img/image00322.jpeg)\n\n我上传了 `file1.txt` 和 `file2.docx`。现在让我展示一下 `uploads`\
    \ 文件夹：\n\n![7-3-8](img/image00323.jpeg)\n\n你能看到那些文件的名字吗？它们被完美地重命名了！我们要检查一下数据库吗？\n\
    \n![7-3-9](img/image00324.jpeg)\n\n**注意：**\n\n我们使用了第 4.5 章（文件上传）的相同代码，并根据应用程序进行了一些修改。\n\
    \n我想我们已经完成了插入语句。我们将继续下一节。\n\n---\n\n### 7.4 检索数据 - I\n\n---\n\n无论我们插入什么内容，以某种方式，我们都必须检索它们。我们将在菜单的课程页面上显示课程。\n\
    \n您可以将 `index.php` 另存为 `courses.php`，或者创建一个同名文件并复制内容。将 `title` 标签的内容更改为 Courses。\n\
    \n我们将做什么？\n\n1.  **显示课程**（本节任务）\n    *   从 `courses` 表中选择所有记录\n    *   以整齐的方式显示它们\n\
    2.  **搜索课程**（下一节任务）\n    *   提供一个搜索框和搜索按钮进行搜索\n    *   根据搜索短语筛选记录\n\n我们开始吧？\n\n\
    #### 显示课程：\n\n从这里开始，我们的 PHP 代码出现在 HTML 标签之间，所以请确保正确放置代码片段。\n\n用下面的代码替换 `head`\
    \ 标签元素：\n\n```\n<head>\n<title> Courses </title>\n<link rel=\"stylesheet\" href=\"\
    css/style.css\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<style>\n.cl{\nmargin: 5px;\ndisplay: inline-block;\nvertical-align: top;\n\
    width: 300px;\nheight: 150px;border: 1px solid #ccc;\n}\n</style>\n<script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js\"></script>\n\
    <script>\n$(document).ready(function(){\n if($(window).width() > 600)\n  $(\"\
    ul\").show();\n  else\n  $(\"ul\").hide();\n $(\"button\").click(function(){\n\
    \  $(\"ul\").slideToggle();\n });\n});\n</script>\n</head>\n```\n\n我们包含了一个 `style`\
    \ 标签，为课程的显示提供适当的空间。`style` 标签指定类元素 `cl` 将具有 `300px` 宽度、`150px` 高度的边框，并在较宽的屏幕上连续显示。\n\
    \n用下面的代码替换 `main` 标签元素：\n\n```\n<main>\n<section>\n<h3>Courses</h3>\n<?php\nrequire('connect.php');\n\
    $query = \"SELECT * FROM courses\";\n$select_courses = mysqli_query($con, $query);\n\
    while ($selected = mysqli_fetch_row($select_courses)) {\n echo \"<div class='cl'>\"\
    ;\n echo \"<h4><a href='details.php?search=$selected[0]'>\".$selected[1].\"<a/></h4>\"\
    ;\n echo \"<p>\".$selected[3].\"</p>\";\n echo \"</div>\";\n}\n?>\n</section>\n\
    </main>\n```\n\n让我解释一下检索过程：\n\n```\n$query = \"SELECT * FROM courses\";\n$select_courses\
    \ = mysqli_query($con, $query);\n```\n\n`$select_courses` 是一个资源类型变量，将保存表数据。\n\n\
    ```\nwhile ($selected = mysqli_fetch_row($select_courses)) { }\n```\n\n此 `while`\
    \ 循环用于遍历表中的行。`mysqli_fetch_row()` 将从包含所有记录的 `$select_courses` 变量中逐行（即逐条记录）地将数据传递给\
    \ `$selected` 变量。\n\n```\necho \"<div class='cl'>\";\necho \"<h4><a href='details.php?search=$selected[0]'>\"\
    .$selected[1].\"<a/></h4>\";\necho \"<p>\".$selected[3].\"</p>\";\necho \"</div>\"\
    ;\n```\n\n`$select_courses` 变量保存所有检索到的记录。`$selected` 变量一次保存一条记录的字段数组。每个字段可以通过索引号访问。\n\
    \n*   `course_code` 字段索引为 `0`，`course_title` 字段索引为 `1`。因此，在 `$selected[1]` 中，我们有课程标题。我们以标题\
    \ `h4` 格式显示标题。\n*   `$selected[3]` 保存 `course_description` 字段。所以，我们在段落中显示它。\n\
    *   我们将这 2 条语句包含在一个名为 `cl` 的类的 `div` 标签内。这个 `cl` 类是在 `style` 标签中定义的。这意味着，课程标题和课程描述这\
    \ 2 个字段被显示在带有 `cl` 样式的 `div` 标签内供用户查看。\n\n```\n<a href='details.php?search=$selected[0]'>\"\
    .$selected[1].\"<a/>\n```\n\n我们必须具体理解这一行。课程标题作为一个链接提供。语句 `search=$selected[0]`\
    \ 是通过此页面传递的参数。此参数可以通过 2 种方式访问：\n\n*   `$_GET['search']`\n*   `$_REQUEST['search']`\n\
    \n这将在没有表单的情况下传递所显示课程标题的课程代码值。执行后，尝试将鼠标悬停在标题上，你可以找到带有搜索值的链接。\n\n在执行之前，让我们再创建一门课程，以便了解\
    \ `cl` 样式的 `div` 标签是如何工作的。\n\n*   转到 `localhost/onlinecourse/newcourse.php`\n\
    *   在字段中填入值：\n    *   标题：Course 2\n    *   描述：Description for course 2 is provided\
    \ here. This course will be useful to enable search and find feature in the courses\
    \ page.\n    *   成果：Helps finding courses, Helps searching courses, Helps filtering\
    \ courses\n    *   资格：Anyone can search, Only registered can enrol.\n\n现在，执行课程页面。您可以通过\
    \ 2 种方式执行：\n\n*   转到 `localhost/onlinecourse` 并点击 Courses 菜单\n*   或直接访问 `localhost/onlinecourse/courses.php`\n\
    \n![7-4-1](img/image00325.jpeg)\n\n现在，你可以看到这两个 `div` 标签是如何被创建和放置的。将鼠标悬停（不要点击）在课程标题上。左下角你会找到带有搜索值的\
    \ URL。\n\n*   当悬停在 Course Name 1 上时，URL 将为 `localhost/onlinecourse/display.php?search=1`\n\
    *   当悬停在 Course 2 上时，URL 将为 `localhost/onlinecourse/display.php?search=2`\n"
