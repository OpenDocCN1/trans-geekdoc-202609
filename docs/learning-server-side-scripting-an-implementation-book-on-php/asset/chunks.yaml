    \ the file upload part:\n\n```\n$filename = $_FILES['txtfile']['name'];\n$filetmp\
    \ =$_FILES['txtfile']['tmp_name'];\n```\n\nThese lines will extract the file name\
    \ of the uploaded file and the temporary location where it is stored.\n\n```\n\
    $filestring = explode('.',$_FILES['txtfile']['name']);\n$file_ext= strtolower(end($filestring));\n\
    ```\n\nWe split the file name with the string ‘dot’ and find the extension of\
    \ the file.\n\n```\n$exts = array('txt','rtf','doc','docx','pdf','ppt','pptx','mp4');\n\
