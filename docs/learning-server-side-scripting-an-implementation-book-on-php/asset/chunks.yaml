    \ = '$outcome' WHERE course_code = $course\");\n\t$outcomeval = $outcome;\n}\n\
    if($eligible != $eligibleval){\n\t$update4 = mysqli_query($con,\"UPDATE courses\
    \ SET course_eligible = '$eligible' WHERE course_code = $course\");\n\t$eligibleval\
    \ = $eligible;\n}\n```\n\nWe have placed 4 conditions to be checked.\n\n*   If\
    \ the course title value in the database does not match with the course title\
    \ form field value, we perform an update operation on the course title field\n\
    \n*   If the course description value in the database does not match with the\
    \ course description form field value, we perform an update operation on the course\
