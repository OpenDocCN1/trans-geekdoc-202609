    \n**Table-1:** instructors\n\n![6-4-7](Images/image00284.jpeg)\n\nYou can continue\
    \ creating the second table from this screen or by clicking **New** under **onlinecourse**\
    \ in the left panel.\n\n8\\. Click the table name instructors:\n\n![6-4-8](Images/image00285.jpeg)\n\
    \nClick the Structure Tab next to Browse Tab\n\n![6-4-9](Images/image00286.jpeg)\n\
    \nThis gives you the complete structure of the table. So, from here, I will share\
    \ the screenshots of the input fields and the above structure of every table.\
    \ Make sure, you follow the steps and create tables successfully!\n\n**Table-2:**\
    \ courses\n\nWhen you click New in left panel under onlinecourse database, you\
    \ will directly get this page:\n\n![6-4-10](Images/image00287.jpeg)\n\nYou can\
    \ add number of columns and click Go (as marked) to increase the columns.\n\n\
    *   When you mark a field as A\\_I (auto increment) it automatically sets the\
    \ field as Primary Key.\n\n*   When you mark a field as Unique in Index column,\
    \ it shows a pop-up similar to Primary Key. Just do the same as we did to primary\
    \ key pop-up.\n\n![6-4-11](Images/image00288.jpeg)\n\nWhen you Save the table,\
    \ it will automatically take you to Structure tab as:\n\n![6-4-12-table2](Images/image00289.jpeg)\n\
    \n**Table-3:** contents\n\n*   We will store only path of the content in database.\
    \ Files for content will be stored separately.\n\n*   There is no need to explicitly\
    \ mention a foreign key here. When we insert records in this table, our application\
    \ does that.\n\n![6-4-13](Images/image00290.jpeg)\n\n![6-4-14-table3](Images/image00291.jpeg)\n\
    \n**Table-4:** learners\n\n![6-4-15](Images/image00292.jpeg)\n\n![6-4-16-table4](Images/image00293.jpeg)\n\
    \n**Table-5:**enroll\n\n*   For this table, we will include a default value for\
    \ learn\\_start field called CURRENT\\_TIMESTAMP which will automatically insert\
    \ the current date when inserting a new record.\n\n*   When you do this in servers,\
    \ check for server timezone because MySQL inserts date/time in server timezone!\n\
    \n![6-4-17](Images/image00294.jpeg)\n\n![6-4-18-table5](Images/image00295.jpeg)\n\
    \n**Table-6:** record\n\nThere is no primary key for this table. If you want,\
    \ you can create a separate field, but be careful when you insert records, you\
    \ have to include three values. I am avoiding primary key here because when a\
    \ learner keeps completing content, an entry is inserted. During retrieval, we\
    \ would pull details with learn\\_mail field and content\\_id field to know which\
