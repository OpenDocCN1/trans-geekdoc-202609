    \ = mysqli_query($con,\"SELECT * FROM enroll WHERE course_code=$fetched[0]\");\n\
    \ echo \"<td>\";\n echo mysqli_num_rows($get_enrols);\n if (mysqli_num_rows($get_enrols)\
