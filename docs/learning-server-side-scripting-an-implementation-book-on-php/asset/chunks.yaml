  trans: "\n计数为 `5*3 => 5 个测试 * 每个测试 3 次尝试 = 15`\n\n这是一个多维数组的示例。\n\n索引可以是数字或字符串。我们对第一维使用了字符串索引，对第二维使用了数字索引。因为我们只用了两个维度，所以也可以称之为二维数组。\n\
    \n## 语法\n\n`array()` 函数用于创建数组。\n\n## 实践\n\n现在我们将根据上述示例编写代码来创建所有三种类型的数组。\n\n我们将创建三个变量\
    \ `$scores1`、`$scores2`、`$scores3` 来表示这三种类型。\n\n```php\n//Arrays\n\n//声明稍后使用的数组\n\
    $scores = array();\n\n//索引数组\n$scores1 = array(56, 57, 59, 65, 74);\necho \"Printing\
    \ indexed array: &emsp;\";\necho $scores1[0].\"&nbsp;\";\necho $scores1[1].\"\
    &nbsp;\";\necho $scores1[2].\"&nbsp;\";\necho $scores1[3].\"&nbsp;\";\necho $scores1[4].\"\
    &nbsp;\";\necho \"<br>\";\n\n//关联数组\n$scores2 = array(\"test1\"=>56, \"test4\"\
    =>57, \"test5\"=>59);\n$scores2['test7'] = 65;\n$scores2['test10'] = 74;\necho\
    \ \"Printing associative array: &emsp;\";\necho $scores2['test1'].\"&nbsp;\";\n\
    echo $scores2['test4'].\"&nbsp;\";\necho $scores2['test5'].\"&nbsp;\";\necho $scores2['test7'].\"\
    &nbsp;\";\necho $scores2['test10'].\"&nbsp;\";\necho \"<br>\";\n\n//多维数组\n$scores3\
    \ = array(\"test1\" => array(53,54,56), \"test4\" => array(51,56,57));\n$scores3['test5'][0]\
    \ = 45;\n$scores3['test5'][1] = 55;\n$scores3['test5'][2] = 59;\n$scores3['test7']\
    \ = array(61,63,65);\n$scores3['test10'] = array(71,72,74);\necho \"Printing 2-D\
    \ array: <br>\";\necho \"Test 1 - All Attempts =\".$scores3['test1'][0].\"&emsp;\"\
    .$scores3['test1'][1].\"&emsp;\".$scores3['test1'][2];\necho \"<br>Test 1 Attempt\
    \ 1 = \".$scores3['test1'][0];\necho \"<br>Test 1 Attempt 3 = \".$scores3['test1'][2];\n\
    ```\n\n## 执行\n\n你可以尝试打印二维数组的不同索引以获得更清晰的认识！\n\n![2-5-1](img/image00171.jpeg)\n\n\
    你可能会觉得这种遍历数组的方式很困难。在下一章讨论循环时，我们将再次使用数组。在那里，我们将使用循环遍历数组，你会发现它们好用得多。\n\n## 数组的内置函数\n\
    \n我们将在此讨论数组的两个内置函数：\n\n### 数组的长度\n\n`count()` 函数用于返回数组的长度（元素的数量）。\n\n### 实践\n\n\
    ```php\n//声明数组\n$scores = array();\n$scores1 = array(56, 57, 59, 65, 74);\n$scores2\
    \ = array(\"test1\" => 56, \"test4\" => 57, \"test5\" => 59, \"test7\" => 65,\
    \ \"test10\" => 74);\n$scores3 = array(\"test1\" => array(53,54,56), \"test4\"\
    \ => array(51,56,57), \"test5\" => array(45,55,59), \"test7\" => array(61,63,65),\
    \ \"test10\" => array(71,72,74));\n\n//数组长度/大小\necho \"<br>Size of $scores = \"\
    .count($scores);\necho \"<br>Size of $scores1 = \".count($scores1);\necho \"<br>Size\
    \ of $scores2 = \".count($scores2);\necho \"<br>Size of $scores3 = \".count($scores3);\n\
    echo \"<br> Size of $scores3 test1's attempts - \".count($scores3['test1']);\n\
    ```\n\n### 执行\n\n我们在一个地方声明了上述示例集中的所有数组。我们在所有 4 个数组上执行 `count` 函数。\n\n*   空数组 `$scores`\
    \ 返回 0。\n*   `$scores1`、`$scores2`、`$scores3` 返回 5。\n*   在 `$scores3` 中，仅计算了数组第一维的大小。要获取第二维索引的计数，我们需要在\
    \ `count` 函数中指定第一维索引。\n\n![2-5-2](img/image00172.jpeg)\n\n### 数组排序\n\n数组中的元素可以按字母顺序或数字顺序、降序或升序进行排序。\n\
    \n在 PHP 中，我们有以下排序函数：\n\n*   `sort()` - 以升序对数组排序\n*   `rsort()` - 以降序对数组排序\n* \
    \  `asort()` - 根据值以升序对关联数组排序\n*   `ksort()` - 根据键以升序对关联数组排序\n*   `arsort()` -\
    \ 根据值以降序对关联数组排序\n*   `krsort()` - 根据键以降序对关联数组排序\n\n### 实践\n\n我们的所有值已经是升序了，这里我们只能尝试降序！\n\
    \n```php\n//声明数组\n$scores = array();\n$scores1 = array(56, 57, 59, 65, 74);\n\
    $scores2 = array(\"test1\"=>56, \"test4\"=>57, \"test5\"=>59, \"test7\" => 65,\
    \ \"test10\" => 74);\n\n//对索引数组排序\necho \"<br>Printing $scores1 - \".$scores1[0].\"\
    &nbsp;\".$scores1[1].\"&nbsp;\".$scores1[2].\"&nbsp;\".$scores1[3].\"&nbsp;\"\
    .$scores1[4];\nrsort($scores1);\necho \"<br>Printing after sorting $scores1 -\
    \ \".$scores1[0].\"&nbsp;\".$scores1[1].\"&nbsp;\".$scores1[2].\"&nbsp;\".$scores1[3].\"\
    &nbsp;\".$scores1[4];\n\necho \"<br><br>Printing $scores2 <br>\";\nvar_dump($scores2);\n\
    \n//按值对关联数组排序\narsort($scores2);\necho \"<br><br>Printing $scores2 after sorting\
    \ by values: <br>\";\nvar_dump($scores2);\n\n//按键对关联数组排序\nkrsort($scores2);\n\
    echo \"<br><br>Printing $scores2 after sorting by keys: <br>\";\nvar_dump($scores2);\n\
    ```\n\n### 执行\n\n我们使用 `var_dump()` 函数来获取排序后数组的值，\n\n在对 `$scores2` 排序时，\n\n*  \
    \ 使用 `arsort()` 函数时，数组按值的降序排序。\n*   使用 `krsort()` 函数时，数组按键的降序排序。\n\n![2-5-3](img/image00173.jpeg)\n\
    \n至此，关于数组的讨论结束！\n\n---\n\n## 2.6 用户自定义函数 - I\n\n---\n\n除了 PHP 内置函数外，还可以创建自己的函数。\n\
    \n*   函数是一组语句块，可以在程序中重复使用。\n*   页面加载时，函数不会自动执行。\n*   函数通过调用函数来执行。\n\n### 如何创建（用户自定义）函数？\n\
    \n用户自定义函数使用关键字 `function` 声明。\n\n### 语法\n\n```php\nfunction function_name(){\n\
    \   code to be executed;\n}\n```\n\n函数名必须以字母或下划线开头。函数名**不**区分大小写。务必选择一个能反映函数功能的名称！名称应切合用途！\n\
    \n### 函数参数\n\n信息可以通过参数传递给函数。参数就像一个变量。\n\n参数在函数名后的括号内指定。你可以添加任意数量的参数，只需用逗号分隔即可。\n\
    \n### 实践\n\n我们现在将看两个函数：\n\n```php\n//用户自定义函数\n\nfunction print_message(){\n echo\
    \ \"<p>Message printed from the function</p>\";\n}\n\nfunction print_message_string($str){\n\
    \ echo $str;\n}\n\nprint_message();\nprint_message_string(\"Printing from arguments\"\
    );\n```\n\n### 执行\n\n我们打印了两条语句。第一条语句由 `print_message()` 函数打印。第二条语句作为参数传递给 `print_message_string($string)`\
    \ 函数。\n\n![2-6-1](img/image00174.jpeg)\n\n在上面的示例集中，我们不必告诉 PHP 变量是什么数据类型。PHP 会根据变量的值自动关联数据类型。由于数据类型不是严格意义上设定的，你可以做一些像将字符串添加到整数中而不引起错误的事情。\n\
    \n### 类型声明\n\n在 PHP 7 中，添加了类型声明。这给了我们一个选项，在声明函数时指定预期的数据类型，并且通过添加严格声明，如果数据类型不匹配，将抛出“致命错误”。\n\
    \n要指定严格模式，我们需要设置：\n\n```php\ndeclare(strict_types=1);\n```\n\n它必须指定在文件的**第一行**。\n\
    \n现在尝试此代码片段：\n\n```php\ndeclare(strict_types=1);\nfunction print_message_string(int\
    \ $str){\n echo $str;\n}\nprint_message_string(\"Hello\");\n```\n\n你将收到如下致命错误：\n\
    \n![26-2](img/image00175.jpeg)\n\n尝试将函数调用替换为：\n\n```php\nprint_message_string(10);\n\
    ```\n\n输出将打印 10。\n\n希望你能理解限制参数数据类型！\n\n参数和形参意思相同。\n\n### 何时应使用“参数”和“实参”术语？\n\n\
    *   **形参**：函数定义\n*   **实参**：函数调用\n"
