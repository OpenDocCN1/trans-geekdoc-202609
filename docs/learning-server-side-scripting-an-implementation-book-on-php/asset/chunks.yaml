    \n此外，使用下面的代码，只会打印 `$x` 和 `$y` 变量的值，而不是计算它们。\n\n```php\necho \"<br>Sum of Integers\
    \ = \".$x.\"+\".$y;\n```\n\n![2-3-4](Images/image00160.jpeg)\n\n希望你理解 `echo` 对引号用法的反应。\n\
    \n**布尔值：**\n\n布尔值表示两种可能的状态：`TRUE` 或 `FALSE`。布尔值主要用于条件判断和循环（将在下一章讨论）。\n\n**空值：**\n\
    \n`Null` 是一种特殊数据类型，只能有一个值：`NULL`。数据类型为 `NULL` 的变量是未分配值的变量。\n\n如果创建变量时未赋值，它将自动被赋值为\
    \ `NULL`。也可以通过将值设置为 `NULL` 来清空变量。在布尔上下文中，它评估为 `FALSE`。\n\n**练习：**\n\n```php\n\
    // Boolean\n$t = TRUE;\n$f = FALSE;\necho \"<br>True - \".$t;\necho \"<br>False\
    \ - \".$f;\n// Null\n$var = NULL;\necho \"<br>Printing NULL - \".$var;\n$var_new\
    \ = \"Hello\";\necho \"<br> Testing var_new - \".$var_new;\n$var_new = NULL;\n\
    echo \"<br> Testing var_new - \".$var_new;\n```\n\n**执行：**\n\n`FALSE` 和 `NULL`\
    \ 不打印任何内容。\n\n![2-3-5](Images/image00161.jpeg)\n\n**如何根据赋值查找数据类型？**\n\n让我们看以下代码集：\n\
    \n```php\n// checking data type\n$d1 = 91;\n$d2 = 9.1;\n$d3 = \"hello\";\n$d4\
    \ = TRUE;\n$d5 = NULL;\nvar_dump($d1);\necho \"<br>\";\nvar_dump($d2);\necho \"\
    <br>\";\nvar_dump($d3);\necho \"<br>\";\nvar_dump($d4);\necho \"<br>\";\nvar_dump($d5);\n\
    ```\n\n当你想知道变量的数据类型时，可以使用 `var_dump()` 函数。\n\n![2-3-6](Images/image00162.jpeg)\n\
    \n**如何检查变量是否不为空？**\n\n我们可以检查变量是否持有值。如果变量不持有任何值，我们称之为 `NULL`。\n\n请看下面的代码：\n\n```php\n\
    // check for NULL\n$n1 = NULL;\n$n2 = 10;\necho \"checking n1 = \".isset($n1);\n\
    echo \"<br>checking n2 = \".isset($n2);\n```\n\n![2-3-7](Images/image00163.jpeg)\n\
    \n`isset($n1)` 将返回 `false`，因为 `$n1` 不持有任何值。\n\n`isset($n2)` 将返回 `true`（`1`），因为\
    \ `$n2` 持有整数值。\n\n**对象：**\n\n从类实例化对象属于面向对象编程。你可以查看下面的示例：\n\n```php\n/* $myCar\
    \ is an object */\n<?php\nclass Car {\n  public $color;\n  public $model;\n}\n\
    $myCar = new Car();\n?>\n```\n\n执行此代码不会有任何输出。我们没有在代码中显示任何内容。我们创建了一个具有两个属性的类，并从该类创建了一个对象。\n\
    \n我们将在本章的另一节中讨论数组。\n\n资源的示例将在第 4 章讨论。\n\n***\n\n### 2.4 内置函数\n\n***\n\nPHP 拥有内置函数，可以直接从脚本中调用以执行特定任务。\n\
    \n我们有用于处理数据类型的内置函数：字符串、数字等。我们将在以下类别中讨论其中的一些函数：\n\n* 数值函数\n* 数学函数\n* 字符串函数\n* 日期/时间函数\n\
    \nPHP 提供自动数据类型转换。我们将在处理示例时探讨这种转换。\n\n***\n\n**数值函数：**\n\n这里将讨论与整数和浮点数相关的函数。\n\n\
    PHP 具有以下函数来检查变量类型是否为整数：\n\n* `is_int()`\n* `is_integer()`\n* `is_long()`\n"
  trans: "\n* 变量名不能包含 `+`、`-`、`%`、`(`、`)`、`.`、`&` 等字符\n* 变量名**区分大小写**（`$var` 和 `$VAR`\
