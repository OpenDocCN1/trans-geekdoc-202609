    \n* * *\n\n### 6.1 Project Outline\n\n* * *\n\nIn the upcoming chapters, we will\
    \ develop a small web application. By means of developing the application, we\
    \ will learn how to connect an application to database and produce dynamic content\
    \ for users.\n\nWe will term the project as Online Course System!\n\n**What is\
    \ an online course system?**\n\nIn an online course system, there will be courses\
    \ from various topics that are authored by instructors and uploaded in the website.\
    \ Learners have to sign up to the site and enrol to the course in order to access\
    \ the contents. An automatic record of the learners' learning progress will be\
    \ done and made available as a report to the instructor.\n\nWe will try to do\
    \ it as simple as possible without complicating anything. The reason is, we are\
    \ learning how to develop php pages as an application and connect them to database\
    \ for data processing.\n\n**What processes are necessary for this application?**\n\
    \nWe broadly have 2 users - instructor and learner:\n\n![6-1-tasks](Images/image00264.jpeg)\n\
    \nThe above is an outline of the main tasks/processes. It does not mean you are\
    \ restricted to these tasks alone. You can extend and include as many as you want\
    \ as to your need. These tasks alone will be dealt in this e-book.\n\n**Flow of\
    \ Project:**\n\nThere are 3 pages in menu: Home, Courses and Login\n\n*   In Home\
    \ Page, we will present project information, list courses with number of enrolment\
    \ and list of instructors registered.\n\n*   In Courses Page, we will provide\
    \ search facility to find courses.\n\n    *   Search results page from searching\
    \ the courses\n\n    *   Course details page from search results links\n\n*  \
    \ In Login Page, we will provide login form and a link to register to the website.\n\
    \n    *   Registration Page from the link in login page.\n\n    *   User dashboard\
    \ page after login\n\n    *   Change profile link\n\n    *   Create course & content\
    \ for instructors\n\n    *   Enrol & access course for learners\n\n    *   Learners'\
    \ progress report for instructors\n\nAs an instructor,\n\n*   You need to sign\
    \ up\n\n*   You need to login\n\n*   You need to create a course and provide details\n\
    \n*   You need to upload content to course as files\n\n*   You can view list of\
    \ enrolled learners and their progress\n\n*   You can modify your profile\n\n\
    As a learner,\n\n*   You need to search a course\n\n*   Your search results will\
    \ be a list of course topics as links\n\n*   You will browse the link and find\
    \ details about course like eligibility and outcomes\n\n*   You need to enrol\n\
    \n*   You need to browse course contents and those learning activities will be\
    \ recorded\n\n*   A progress bar will notify how much you have completed\n\n*\
    \   You can modify your profile\n\nHope from here, it is going to be complete\
    \ hands-on with little to learn and more to practise!\n\nHappy learning and coding!\n\
    \n* * *\n\n### 6.2 Database Design\n\n* * *\n\nIn this section, I will provide\
    \ you the data dictionary of the database we are about to use for this project.\n\
    \n**Data Dictionary:**\n\n![6-2-1-instructor](Images/image00265.jpeg)\n\n![6-2-2-courses](Images/image00266.jpeg)\n\
    \n![6-2-3-content](Images/image00267.jpeg)\n\n![6-2-4-learner](Images/image00268.jpeg)\n\
    \n![6-2-5-enroll](Images/image00269.jpeg)\n\n![6-2-6-record](Images/image00270.jpeg)\n\
    \n![6-2-7-login](Images/image00271.jpeg)\n\nThis is the simplest of database design!\
    \ A good database should hold only mandatory details. Details that are needed\
    \ to be derived from existing fields if possible, are usually not placed inside\
    \ the database.\n\n* * *\n\n### 6.3 Setting up Environment\n\n* * *\n\nRequirements\
    \ needed for this web application:\n\n*   Apache Server\n\n*   PHP\n\n*   MySQL\n\
    \nWe have already installed the XAMPP stack for this purpose!\n\nLet me remind:\n\
    \nXAMPP is installed in C:/xampp/htdocs\n\n**Checklist:**\n\n*   Make sure Apache\
    \ is accessible via port 80. If you have changed the port, you need to execute\
    \ pages as [http://localhost:port](#part0038.xhtml)where port is the newly changed\
    \ port.\n\n*   Make sure File\\_uploads is enabled in php.ini file\n\n*   Create\
    \ database via phpMyAdmin\n\nLet us create the required database from data dictionary.\n\
    \n**Accessing phpMyAdmin:**\n\n*   In XAMPP, start both Apache and MySQL services.\
    \ Hope MySQL will be running in port 3306.\n\n*   Go to phpMyAdmin, that is, Browse\
    \ to [http://localhost/](#part0038.xhtml) and choose phpMyAdmin from the top menu.\
    \  \n\n    or  \n\n    Click Admin button next to MySQL service in XAMPP control\
    \ panel.\n\nOnce you access phpmyadmin successfully, you will end up like this:\n\
    \n![1-0-1](Images/image00272.jpeg)\n\nI have just shown you a part of the screen.\n\
    \nOn the left panel, you will have a list of databases. To the right of the above\
    \ image, you will find database server details. Make sure, you get this page!\n\
    \n**Note:**\n\nIf you have not started MySQL service, you will end up like this:\n\
    \n![1-0-0](Images/image00273.jpeg)\n\nWhenever I say, go to database or access\
    \ phpmyadmin, you need to browse to [http://localhost/phpmyadmin](#part0038.xhtml)\n\
    \n**Steps to create database:**\n\n1\\. In the image below, click New:\n\n![1-0-2](Images/image00274.jpeg)\n\
    \n2\\. You will get a screen like this:\n\n![1-0-3](Images/image00275.jpeg)\n\n\
    3\\. Enter the database name as onlinecourse\n\n![1-0-4](Images/image00276.jpeg)\n\
    \n4\\. When creation process is successful, you will be taken to the next screen\
    \ as below:\n\n![1-0-5](Images/image00277.jpeg)\n\nThus, the database is created.\
    \ We will create the tables in the next section.\n\n* * *\n\n### 6.4 Setting up\
    \ Database Tables\n\n* * *\n\nWe will create 7 tables one by one. I will explain\
    \ how to create the first table in detail.\n\nOnce you create the database, you\
