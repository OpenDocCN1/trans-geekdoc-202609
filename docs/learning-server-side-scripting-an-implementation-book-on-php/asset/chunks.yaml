  fmt: "\n`json_decode()`函数默认返回一个对象。`json_decode()`函数有一个第二个参数，当设置为`true`时，JSON对象会被解码为关联数组。\n\
    \n![5-4-2](Images/image00262.jpeg)\n\n你还记得第2章的Object数据类型吗？你可以将这个结果对象视为对象数据类型。\n\
    \n由于解码返回的是一个对象，我们可以单独访问解码后的值。\n\n我们可以通过2种方式访问：对象和数组。让我们通过一个代码片段示例来看看：\n\n```php\n\
    <?php\n$json = '{\"Test1\":75,\"Test2\":80,\"Test3\":60}';\necho \"<p> JSON format:\
    \ \".$json.\"</p>\";\necho \"<p>JSON Decode: </p>\";\nvar_dump(json_decode($json));\n\
    echo \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\n\
    $array = json_decode($json,true);\n$object = json_decode($json);\n\necho \"<p>Accessing\
    \ via Array: </p>\";\necho \"Test1 = \".$array[\"Test1\"];\necho \"<p>Accessing\
    \ via Object: </p>\";\necho \"Test2 = \".$object->Test2;\n\necho \"<p>Using Loops</p>\"\
    ;\nforeach ($array as $key => $value) {\n  echo $key.\" - \".$value.\"<br>\";\n\
    }\n?>\n```\n\n我只是在之前的代码片段中添加了检索行。\n\n![5-4-3](Images/image00263.jpeg)\n\n至此，本章结束！\n\
    \nPHP的学习和实践环节将为你提供实操经验。\n\n电子书的其余部分是关于使用Web应用程序实现这些概念。\n\n***\n\n# 第6章：设计Web应用程序\n\
    \n***\n\n#### 6.1 项目大纲\n\n#### 6.2 数据库设计\n\n#### 6.3 环境搭建\n\n#### 6.4 设置数据库表\n\
    \n#### 6.5 Web应用程序模板\n\n***\n\n### 6.1 项目大纲\n\n***\n\n在接下来的章节中，我们将开发一个小型Web应用程序。通过开发该应用程序，我们将学习如何将应用程序连接到数据库并为用户生成动态内容。\n\
    \n我们将该项目称为**在线课程系统**！\n\n**什么是在线课程系统？**\n\n在在线课程系统中，将有来自各种主题的课程，由讲师编写并上传到网站。学习者必须注册网站并报名课程才能访问内容。学习者的学习进度将自动记录并作为报告提供给讲师。\n\
    \n我们将尽可能简单地实现，而不使任何事情复杂化。原因是，我们正在学习如何将PHP页面作为应用程序进行开发，并将它们连接到数据库以进行数据处理。\n\n**该应用程序需要哪些流程？**\n\
    \n我们大致有2类用户——讲师和学习者：\n\n![6-1-tasks](Images/image00264.jpeg)\n\n以上是主要任务/流程的大纲。这并不意味着你仅限于这些任务。你可以根据需要扩展并包含任意数量的任务。本书将只涉及这些任务。\n\
    \n**项目流程：**\n\n菜单中有3个页面：首页、课程和登录\n\n*   在**首页**，我们将展示项目信息、列出课程及报名人数以及注册讲师列表。\n\
    \n*   在**课程页面**，我们将提供搜索功能以查找课程。\n\n    *   从搜索课程得到的搜索结果页面\n\n    *   从搜索结果链接进入的课程详情页面\n\
    \n*   在**登录页面**，我们将提供登录表单和一个注册网站的链接。\n\n    *   从登录页面链接进入的注册页面\n\n    *   登录后的用户仪表盘页面\n\
    \n    *   修改个人资料链接\n\n    *   讲师创建课程和内容\n\n    *   学习者报名和访问课程\n\n    *   讲师查看学习者进度报告\n\
    \n作为讲师：\n\n*   你需要注册\n*   你需要登录\n*   你需要创建课程并提供详情\n*   你需要上传文件作为课程内容\n*   你可以查看报名学习者列表及其进度\n\
    *   你可以修改你的个人资料\n\n作为学习者：\n\n*   你需要搜索课程\n*   你的搜索结果将是一个课程主题链接列表\n*   你将浏览链接并找到课程详情，如资格要求和成果\n\
    *   你需要报名\n*   你需要浏览课程内容，这些学习活动将被记录\n*   进度条将通知你完成了多少\n*   你可以修改你的个人资料\n\n希望从这里开始，将是完整的实操，少学多练！\n\
    \n祝学习和编码愉快！\n\n***\n\n### 6.2 数据库设计\n\n***\n\n在本节中，我将为你提供我们即将用于此项目的数据库的数据字典。\n\
