    \ === 0){\n  echo \"<p> int = \".filter_var($int, FILTER_VALIDATE_INT).\"</p>\"\
    ;\n}\nif(!filter_var($float, FILTER_VALIDATE_INT)){\n  echo \"<p>float is not\
    \ an integer</p>\";\n}\nif(filter_var($ip, FILTER_VALIDATE_IP)){\n  echo \"<p>ip\
    \ - Valid IP address</p>\";\n}\n$url1 = filter_var($url1,FILTER_SANITIZE_URL);\n\
    echo \"<p> url after sanitizing = \".$url1.\"</p>\";\n$url1 = filter_var($url1,FILTER_VALIDATE_URL);\n\
    echo \"<p> url after validating = \".$url1.\"</p>\";\n$url2 = filter_var($url2,FILTER_SANITIZE_URL);\n\
    echo \"<p> url after sanitizing = \".$url2.\"</p>\";\n$url2 = filter_var($url2,FILTER_VALIDATE_URL);\n\
    echo \"<p> url after validating = \".$url2.\"</p>\";\n?>\n```\n\nOn execution,\
    \ we get the output as:\n\n![5-3-1](Images/image00259.jpeg)\n\n*   When we print\
    \ `$str` with html tag, html is applied on printing. When we sanitize the string,\
    \ it removes the html tag and prints the string alone.\n*   When we check integer\
    \ for value 0, we ought to do with if condition. Similarly, we use same filter\
    \ to validate integer with float input\n*   `$url1` and `$url2` are the same URLs\
    \ for users. But only `$url2` is validated and gets printed. Though we don't sanitize\
    \ the urls here, we can see the difference for validation done on `$url1` and\
    \ `$url2`\n\nWe will look on to a validation example of integer within some range.\n\
    \n```php\n<?php\n$int1 = 50;\n$int2 = 150;\necho \"<p> int1 = \".$int1.\" int2\
    \ = \".$int2.\"</p>\";\n\nif (filter_var($int1, FILTER_VALIDATE_INT, array(\"\
    options\" => array(\"min_range\"=>1, \"max_range\"=>100))) ) {\n   echo \"<p>int1\
    \ value is within 1-100</p>\";\n} \nelse {\n   echo \"<p>int1 value is not within\
    \ 1-100</p>\";\n}\n\nif (filter_var($int2, FILTER_VALIDATE_INT, array(\"options\"\
    \ => array(\"min_range\"=>1, \"max_range\"=>100))) ) {\n   echo \"<p>int2 value\
    \ is within 1-100</p>\";\n} \nelse {\n   echo \"<p>int2 value is not within 1-100</p>\"\
    ;\n}\n?>\n```\n\n![5-3-2](Images/image00260.jpeg)\n\nSimilarly, we should make\
    \ use of these filters to sanitize and validate user data.\n\n---\n\n### 5.4 Handling\
    \ JSON Data\n\n---\n\nJSON stands for JavaScript Object Notation. It is a syntax\
    \ used for storing and exchanging data.\n\nSince the JSON format is a text-based\
    \ format, it can easily be sent to and from a server, and used as a data format\
    \ by any programming language.\n\nSo, we will learn how to handle JSON data using\
    \ PHP in this section.\n\nWe have 2 built-in functions to handle JSON.\n\n*  \
    \ `json_encode()` - to encode a value to JSON format\n*   `json_decode()` - to\
    \ decode a JSON object into a PHP object or an associative array.\n\nSince many\
    \ of you would be new to JSON, we will do this:\n\n*   Practise an example to\
    \ convert an associative array to JSON format\n*   Use the output JSON data and\
    \ decode back to array\n\n**Practice:**\n\n**Convert Array to JSON:**\n\n```php\n\
    <?php\n$array = array(\"Test1\" => 75, \"Test2\" => 80, \"Test3\" => 60);\necho\
    \ \"Array: \";\nvar_dump($array);\necho \"<p>JSON format: </p>\";\necho json_encode($array);\n\
    ?>\n```\n\n![5-4-1](Images/image00261.jpeg)\n\n**Convert JSON to Array:**\n\n\
    ```php\n<?php\n$json = '{\"Test1\":75,\"Test2\":80,\"Test3\":60}';\necho \"<p>\
    \ JSON format: \".$json.\"</p>\";\necho \"<p>JSON Decode: </p>\";\nvar_dump(json_decode($json));\n\
    echo \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\
    ?>\n```\n"
  trans: "\n\n希望你理解 PHP 代码部分。我们只是设置了一个名为 `cookiename`、值为 `$_POST['txtname']` 的 Cookie，该值即我们在文本字段中输入的内容。该\
    \ Cookie 的过期时间被设为 60 秒。\n\n请暂勿执行。由于 Cookie 将在 60 秒后过期，你无法在 `page2.php` 中获取它。\n\
    \n**`page2.php` 的代码：**\n\n对于此文件，我们将完全替换代码为：\n\n```php\n<?php\nif(isset($_COOKIE['cookiename'])){\n\
    \  echo $_COOKIE['cookiename'];\n}\nelse{\n  echo \"Cookie has been expired\"\
    ;\n}\necho \"<p>Counting Cookies : \".count($_COOKIE); \n?>\n```\n\n两个页面都准备好了吗？\n\
    \n按顺序执行：\n\n`localhost/onlinecourse/page1.php`\n\n输入名称并按下提交。立即执行：\n\n`localhost/onlinecourse/page2.php`\n\
    \n让我展示两个页面的截图：\n\n我们在 `page1.php` 提交后没有打印任何内容。所以这是输入界面：\n\n![5-2-1](img/image00254.jpeg)\n\
    \n点击提交后，我们再次看到表单。现在执行 `page2.php` 后，我们得到：\n\n![5-2-2](img/image00255.jpeg)\n\n\
    我的浏览器正在运行一个 Cookie，计数为 1，guest cookie 计数为 2。\n\n希望在你执行 `page2.php` 后已经过了 60 秒！\n\
    \n再次执行：`localhost/onlinecourse/page2.php`\n\n![5-2-3](img/image00256.jpeg)\n\n\
    我浏览器的 Cookie 单独计数为 1。guest cookie 已过期。也就是说，Cookie 在 60 秒后会被自动删除。\n\n在使用应用程序时我们可能需要用到\
    \ Cookie。\n\n事实上，当你浏览某些网站时，它们会公开询问你：“我们网站使用 Cookie，这会用到你的信息，你接受还是拒绝？”你遇到过这种情况吗？如果你至今未曾留意，以后请留意观察！\n\
    \n---\n\n### 5.3 过滤器\n\n---\n\n过滤器用于验证和清理用户的输入。验证数据是判断数据是否符合正确的形式。清理数据是从数据中移除任何非法字符。\n\
    \n在使用表单时，我们已经讨论过用户输入的验证。\n\nPHP 过滤器扩展拥有检查用户输入所需的许多函数，旨在使数据验证更轻松、更快捷。\n\n**为什么我们需要过滤器？**\n\
    \n许多 Web 应用程序接收外部输入。外部输入/数据可以是：\n\n*   来自表单的用户输入\n*   Cookie\n*   服务器变量\n*   数据库查询结果\n\
    *   Web 服务数据\n\n强烈建议始终验证外部数据！无效的提交数据可能导致安全问题并破坏你的网页！通过充分利用 PHP 过滤器，你可以确保应用程序获得正确的输入！\n\
    \n有用于验证和清理数据的过滤器。我们来看看列表！\n\n**验证过滤器：**\n\n![5-3-1-validatingfilter](img/image00257.jpeg)\n\
    \n**清理过滤器：**\n\n![5-3-2sanitizingfilter](img/image00258.jpeg)\n\n**参考：** [`www.php.net/manual/en/filter.filters.php`](https://www.php.net/manual/en/filter.filters.php)\n\
    \n**我们将在哪里使用这些过滤器？**\n\n如果你还记得表单中邮箱地址的验证，我们使用了一个带有 2 个参数的 `filter_var()` 函数。这些过滤器\
    \ ID 将在该函数内部使用。我们现在将通过充分的示例来讨论 `filter_var()` 函数。\n\n**`filter_var()` 函数：**\n\n\
    `filter_var()` 函数用于验证和清理数据。它使用指定的过滤器来过滤单个变量。它接受两个数据：你要检查的变量，以及要用于该变量的检查类型（过滤器\
    \ ID）。\n\n我们将从上面的列表中查看几个 ID：\n\n*   清理字符串 - 它从字符串中移除所有 HTML 标签\n*   验证整数 - 它检查变量是否为整数（0\
    \ 不属于整数的一部分，因此可能返回 false，我们将在实践环节中探讨解决方案）\n*   验证 IP 地址 - 它检查变量是否为有效的 IP 地址\n\
    *   清理和验证 URL - 它将先清理 URL，然后再验证它\n\n**实践：**\n\n创建一个名为 `filter.php` 的新页面（或任何你想要的文件名）。在新页面中编写此代码！\n\
    \n```php\n<?php\n$str = \"<h3>Hello World!</h3>\";\n$int = 0;\n$float = 100.09;\n\
    $ip = \"127.0.0.1\";\n$url1 = \"www.google.com\";\n$url2 = \"https://www.google.com\"\
    ;\n\necho \"<p>Before Sanitizing and Validating: </p>\";\necho \"<p> str = \"\
    .$str.\"</p>\";\necho \"<p> int = \".$int.\"</p>\";\necho \"<p> float = \".$float.\"\
    </p>\";\necho \"<p> ip = \".$ip.\"</p>\";\necho \"<p> url1 = \".$url1.\"</p>\"\
    ;\necho \"<p> url2 = \".$url2.\"</p>\";\n\necho \"<p>Applying Sanitizing and Validating\
    \ Filters: </p>\";\n$str = filter_var($str,FILTER_SANITIZE_STRING);\necho \"<p>\
    \ str = \". $str . \"</p>\";\nif(filter_var($int, FILTER_VALIDATE_INT) === 0){\n\
    \  echo \"<p> int = \".filter_var($int, FILTER_VALIDATE_INT).\"</p>\";\n}\nif(!filter_var($float,\
    \ FILTER_VALIDATE_INT)){\n  echo \"<p>float is not an integer</p>\";\n}\nif(filter_var($ip,\
    \ FILTER_VALIDATE_IP)){\n  echo \"<p>ip - Valid IP address</p>\";\n}\n$url1 =\
    \ filter_var($url1,FILTER_SANITIZE_URL);\necho \"<p> url after sanitizing = \"\
    .$url1.\"</p>\";\n$url1 = filter_var($url1,FILTER_VALIDATE_URL);\necho \"<p> url\
    \ after validating = \".$url1.\"</p>\";\n$url2 = filter_var($url2,FILTER_SANITIZE_URL);\n\
    echo \"<p> url after sanitizing = \".$url2.\"</p>\";\n$url2 = filter_var($url2,FILTER_VALIDATE_URL);\n\
    echo \"<p> url after validating = \".$url2.\"</p>\";\n?>\n```\n\n执行后，我们得到如下输出：\n\
    \n![5-3-1](img/image00259.jpeg)\n\n*   当我们带 HTML 标签打印 `$str` 时，HTML 会在打印时被应用。当我们清理字符串时，它会移除\
    \ HTML 标签并仅打印字符串。\n*   当我们检查值为 0 的整数时，我们必须使用 if 条件来处理。同样，我们使用相同的过滤器通过浮点数输入来验证整数。\n\
    *   `$url1` 和 `$url2` 对用户来说是相同的 URL。但只有 `$url2` 通过验证并被打印。虽然我们这里没有清理 URL，但我们可以看到对\
    \ `$url1` 和 `$url2` 进行验证的差异。\n\n我们将看一个在特定范围内验证整数的示例。\n\n```php\n<?php\n$int1 =\
    \ 50;\n$int2 = 150;\necho \"<p> int1 = \".$int1.\" int2 = \".$int2.\"</p>\";\n\
    \nif (filter_var($int1, FILTER_VALIDATE_INT, array(\"options\" => array(\"min_range\"\
    =>1, \"max_range\"=>100))) ) {\n   echo \"<p>int1 value is within 1-100</p>\"\
    ;\n} \nelse {\n   echo \"<p>int1 value is not within 1-100</p>\";\n}\n\nif (filter_var($int2,\
    \ FILTER_VALIDATE_INT, array(\"options\" => array(\"min_range\"=>1, \"max_range\"\
    =>100))) ) {\n   echo \"<p>int2 value is within 1-100</p>\";\n} \nelse {\n   echo\
    \ \"<p>int2 value is not within 1-100</p>\";\n}\n?>\n```\n\n![5-3-2](img/image00260.jpeg)\n\
    \n同样，我们应该善用这些过滤器来清理和验证用户数据。\n\n---\n\n### 5.4 处理 JSON 数据\n\n---\n\nJSON 代表 JavaScript\
    \ Object Notation（JavaScript 对象表示法）。它是一种用于存储和交换数据的语法。\n\n由于 JSON 格式是基于文本的格式，它可以轻松地发送给服务器并从服务器接收，且可被任何编程语言用作数据格式。\n\
    \n因此，我们将在本节中学习如何使用 PHP 处理 JSON 数据。\n\n我们有 2 个内置函数来处理 JSON。\n\n*   `json_encode()`\
    \ - 将值编码为 JSON 格式\n*   `json_decode()` - 将 JSON 对象解码为 PHP 对象或关联数组。\n\n既然你们中许多人可能对\
    \ JSON 不熟悉，我们将这样做：\n\n*   练习一个将关联数组转换为 JSON 格式的示例\n*   使用输出的 JSON 数据并将其解码回数组\n\
    \n**实践：**\n\n**将数组转换为 JSON：**\n\n```php\n<?php\n$array = array(\"Test1\" => 75,\
    \ \"Test2\" => 80, \"Test3\" => 60);\necho \"Array: \";\nvar_dump($array);\necho\
    \ \"<p>JSON format: </p>\";\necho json_encode($array);\n?>\n```\n\n![5-4-1](img/image00261.jpeg)\n\
    \n**将 JSON 转换为数组：**\n\n```php\n<?php\n$json = '{\"Test1\":75,\"Test2\":80,\"Test3\"\
    :60}';\necho \"<p> JSON format: \".$json.\"</p>\";\necho \"<p>JSON Decode: </p>\"\
    ;\nvar_dump(json_decode($json));\necho \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\
    ?>\n```\n\n"
