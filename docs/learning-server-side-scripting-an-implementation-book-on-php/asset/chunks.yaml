- raw: "Please do not check the working now! We have no file named elist.php and it\
    \ will end up in 404 file not found error.\n\nWe will create the file with listing\
    \ of enrolments and then execute the enrolment process. This page will more or\
    \ less be similar to clist.php.\n\n**Listing enrolments:**\n\nUse save as option\
    \ to create elist.php. Change title tag content as Enrollments.\n\nInclude the\
    \ following code in the beginning of the file.\n\n```\n<?php\ninclude ('check.php');\n\
    if($category == 'instructor'){\n  header('logout.php');\n}\n?>\n```\n\nHere, we\
    \ check if an instructor gets into this page by mistake with the url and redirect\
    \ to logout.php page. Only learners can access this page.\n\nReplace the main\
    \ tag content as:\n\n```\n<main>\n<section>\n<?php \necho \"<h3>Hello \".$name.\"\
    </h3>\";\necho \"<p><a href='logout.php'>Logout<a/></p>\";\n$fetch_enrolls = mysqli_query($con,\"\
    SELECT * FROM enroll WHERE learn_mail = '$usersession'\");\nif(mysqli_num_rows($fetch_enrolls)\
    \ == 0){\n echo \"No enrollments so far!\";\n}\nelse{\n echo \"<table style='margin:\
    \ 0 5%;text-align:left;'>\";\n echo \"<tr>\";\n echo \"<th style='width:30%;'>\
    \ Course Title </th>\";\n echo \"<th style='width:15%;'> Start Date </th>\";\n\
    \ echo \"<th style='width:15%;'> Completion Date </th>\";\n echo \"<th style='width:15%;'>\
    \ Access Content </th>\";\n echo \"<th style='width:15%;'> Progress </th>\";\n\
    \  echo \"</tr>\";\n} \nwhile($fetched = mysqli_fetch_row($fetch_enrolls)){\n\
    \ echo \"<tr>\";\n $get_coursetitle = mysqli_query($con,\"SELECT * FROM courses\
    \ WHERE course_code = $fetched[0]\");\n $coursetitle = mysqli_fetch_array($get_coursetitle);\n\
    \  echo \"<td>\".$coursetitle['course_title'].\"</td>\";\n echo \"<td>\".$fetched[3].\"\
    </td>\";\n if($fetched[4] == NULL){\n   echo \"<td>Not completed</td>\";\n }\n\
    \ else{\n   echo \"<td>\".$fetched[4].\"</td>\";\n }\n echo \"<td>\";\n echo \"\
    <form method='post' action='contents.php'><input type='hidden' name='txtcourse'\
    \ value='$fetched[2]'>\";\n echo \"<input type='submit' name='access' value='View'\
    \ class='frmbtn'></form>\";\n  echo \"</td>\"; \n echo \"<td><progress id='progress'\
    \ value='\".get_progress($con,$fetched[0]).\"' max='100'></progress> \".get_progress($con,$fetched[0]).\"\
    %</td>\";\n echo \"</tr>\";\n}\necho \"</table>\";\n?>\n</section>\n</main>\n\
    ```\n\n*   We have made one check while displaying retrieved fields.  \n\n   \
    \ We check if $fetched\\[4\\] = NULL (that is, completion date is NULL).  \n\n\
    \    If it is null, it means course is in progress, so we have displayed 'not\
    \ completed' message.  \n\n    If it is not null, we display the course completion\
    \ date.\n\n*   We give access to content via POST method in form. As long as the\
    \ course is free, it is not an issue. When it comes to learning paid courses,\
    \ this becomes a problem. So, on safer side, we use POST method form.\n\n*   We\
    \ have also given the action attribute in the form. So, contents.php will process\
    \ the values submitted via this form.\n\nNow, let me login as a learner and then\
    \ enroll in one of the courses.\n\n*This is a GIF image. Make sure GIF is supported\
    \ in your device.*\n\n![1604666907-enroll-course](Images/image00351.gif)\n\nThe\
    \ next work is to view the contents of the course!\n\n* * *\n\n**Accessing Course\
    \ contents:**\n\nWe have to design a page to view the course contents - the files\
    \ uploaded by the instructor.\n\n*   We will use a select box to display the contents\
    \ title. Based on title selection, appropriate content file will be displayed.\n\
    \n*   Since we have different file types, we will use iframe tag to display them\n\
    \nFirst, use save as and name the file as **contents.php**\n\nThere is nothing\
    \ in specific to design. So, as usual let us start with the php segment to be\
    \ placed in the beginning of the page.\n\n```\n<?php\ninclude ('check.php');\n\
    $course = 0;\n$contents = 0;\nif(isset($_POST['access'])){\n  $course = $_POST['txtcourse'];\n\
    }\n?>\n```\n\nWe still have some more to add. We will add it after finishing the\
    \ main tag segment. $course will hold the course code throughout the learning\
    \ process. $contents will hold the content id of the content to be displayed.\n\
    \nReplace the main tag content with:\n\n```\n<main>\n<section>\n<?php \necho \"\
    <h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='elist.php'>Back to Enrollments</a></p>\"\
    ;\necho \"<p>\";\necho \"<form method='post'>\";\necho \"<input type='hidden'\
    \ name='txtcourse' value='$course'>\";\necho \"<select name='txtcontent'>\";\n\
    echo \"<option value='999'>Choose the content title</option>\";\n$fetch_contents\
    \ = mysqli_query($con,\"SELECT * FROM contents WHERE course_code = $course\");\n\
    while($fetched = mysqli_fetch_row($fetch_contents)){\n echo \"<option value='$fetched[0]'>\"\
    .$fetched[1].\"</option>\";\n}\necho \"</select>\";\necho \"<input type='submit'\
    \ name='getcontent' value='Go' class='frmbtn'>\";\necho \"</form>\";\necho \"\
    </p>\";\n?>\n</section>\n</main>\n```\n\nIf no content title is selected, we will\
    \ submit the form with Choose the content title option which has value 999. We\
    \ will use this in the later part.\n\nGo to elist.php and click View (View link\
    \ of Course Name 1)\n\n![8-5-2](Images/image00352.jpeg)\n\nYou can find the content\
    \ titles of the course in the drop down list. Based on this selection, we will\
    \ display the content in the iframe tag.\n\nAdd few more lines to the beginning\
    \ of the file as:\n\n```\n<?php\ninclude ('check.php');\n$course = 0;\n$contents\
    \ = 0;\nif(isset($_POST['access'])){\n  $course = $_POST['txtcourse'];\n}\nif(isset($_POST['getcontent'])){\n\
    \  $course = $_POST['txtcourse'];\n  $contents = $_POST['txtcontent'];\n}\n?>\n\
    ```\n\nWe assign course code to $course and content id to $contents variables\
    \ on form submission.\n\nWe will display the content file below the form. We will\
    \ add another section element to the main tag element. There is already a section\
    \ element. Place this between </section> and </main>:\n\n```\n<section>\n<?php\n\
    if(($contents == 999) || ($contents == 0)){\n echo \"Please choose a content title!\"\
    ;\n}\nelse{\n $fetch_content = mysqli_query($con,\"SELECT * FROM contents WHERE\
    \ content_id = $contents\");\n if($fetch = mysqli_fetch_row($fetch_content)){\n\
    \   echo \"<h4>\".$fetch[1].\"</h4>\";\n   $filestring = explode('.',$fetch[3]);\n\
    \   $file_ext= strtolower(end($filestring));\n   $exts = array('doc','docx','ppt','pptx');\n\
    \   if(in_array($file_ext,$exts)){\n     echo \"<p>The content will be downloaded!</p>\"\
    ;\n   }\n   echo \"<p><iframe src='$fetch[3]' height='auto' width='80%' height='500px'\
    \ frameborder='0'></iframe></p>\";\n  }\n}\n?>\n</section>\n```\n\nHere, we check\
    \ if $contents value = 0 or 999, then we display 'Please choose a content title'\
    \ message. It means, whenever a content title is not chosen, this message will\
    \ be displayed.\n\nAs usual we find the extension of the file and if it is one\
    \ among doc, docx, ppt,pptx, it cannot be displayed in the html file. So, we print\
    \ a message that the file will be downloaded and the download starts when iframe\
    \ tag loads. If the file extension is among pdf / mp4 / txt / rtf, it gets displayed\
    \ via the iframe tag.\n\nTry selecting a content, and see the corresponding file\
    \ getting displayed or downloaded.\n\nNow, there is one more pending task!\n\n\
    **Record learner progress:**\n\nThis progress will also be recorded in the same\
    \ page.\n\nWe need to include code for inserting into record table below the iframe\
