    \ the count function.\n\n![2-5-2](Images/image00172.jpeg)\n\n**Sorting Arrays:**\n\
    \nThe elements in an array can be sorted in alphabetical or numerical order, descending\
    \ or ascending.\n\nIn PHP, we have the following the sort functions:\n\n*   sort()\
    \ - sort arrays in ascending order\n\n*   rsort() - sort arrays in descending\
