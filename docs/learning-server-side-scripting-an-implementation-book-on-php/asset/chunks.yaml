    \ Data: uploadcontent.php**\n\nWe will include $\\_FILES\\[\\] variable for uploading\
    \ process. We will not store the file in the database, we will store files in\
    \ the server (onlinecourse folder in our case) and the file path alone in the\
    \ database.\n\n```\n<?php\nrequire('connect.php');\nif(isset($_POST['upload'])){\n\
