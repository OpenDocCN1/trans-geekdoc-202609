- raw: "When catching an exception, the following table shows some of the methods\
    \ that can be used to get information about the exception:\n\n![3-5-methods](Images/image00216.jpeg)\n\
    \n**Practice:**\n\nWe will look the same coding example with the methods discussed\
    \ above.\n\nHope you will be getting a question, what happens if try block gets\
    \ executed? This question will be answered too.\n\n```\n//Exception\nfunction\
    \ divide($dividend,$divisor){\n if($divisor == 0){\n\tthrow new Exception(\"Division\
    \ by zero\");\n }\n return ($dividend / $divisor);\n}\n\ntry{\n  echo \"<br>Division\
    \ 10/5 = \".divide(10,5);\n}catch(Exception $ex){\n  echo \"No error in input\"\
    ;\n}\n\necho \"<br>Division 10/0 = \";\ntry{\n  echo divide(10,0);\n}catch (Exception\
    \ $ex){\n  $code = $ex->getCode();\n  $message = $ex->getMessage();\n  $file =\
    \ $ex->getFile();\n  $line = $ex->getLine();\n  echo \"Exception thrown in $file\
    \ on line $line: [Code $code] $message\";\n}\n```\n\n**Execute:**\n\nWhen a try\
    \ block gets executed, the catch does not get executed. It is similar to an execution\
    \ of if…else statement. Either of the block gets executed!\n\nHope you can understand:\n\
    \n*   $ex -> getCode() - states the exception code\n\n*   $ex -> getMessage()\
    \ - retrieves the message from Exception() object inside the function\n\n*   $ex\
    \ -> getFile() - retrieves the complete file path where exception is thrown\n\n\
    *   $ex -> getLine() retrieves the line number where the exception is thrown (Exception()\
    \ object)\n\n![3-5-5](Images/image00217.jpeg)\n\nIf you are a novice programmer,\
    \ you may feel like why you should get along with these exceptions. Perhaps you\
    \ are right in the context of learning and practising. But in the case of development,\
    \ a good programmer should define all possible blocks of his/her code so that\
    \ unwanted and unclear errors will be avoided for the end-users.\n\nHope you will\
    \ start using exceptions when you start working on real-time applications.\n\n\
    * * *\n\n# Chapter 4: Files and Forms\n\n* * *\n\n*   [](#part0025.xhtml)\n\n\
    \    #### 4.1 File Handling\n\n*   [](#part0026.xhtml)\n\n    #### 4.2 Superglobals\n\
    \n*   [](#part0027.xhtml)\n\n    #### 4.3 Working with Forms\n\n*   [](#part0028.xhtml)\n\
    \n    #### 4.4 Form Validation\n\n*   [](#part0029.xhtml)\n\n    #### 4.5 File\
    \ Upload\n\n* * *\n\n### 4.1 File Handling\n\n* * *\n\nFile handling is an important\
    \ aspect of a web application. This section deals with how to work with files\
    \ on a server.\n\nPHP has several functions for creating, opening, reading, uploading,\
    \ and editing files.\n\n**Creating / Opening a File:**\n\nIn PHP, in order to\
    \ open a file, or to write a file to a server, we need to create the file. All\
    \ these tasks are done by a single function. It means,\n\n*   when you create,\
    \ you need to open, once you open, you need to write it to server\n\n*   when\
    \ you want to write a file to server, you must obviously open it\n\n*   when you\
    \ want to open a file, it has to be either created or existing.\n\n**Function:\
    \ fopen()**\n\nIf you use fopen() on a file that does not exist, it will create\
    \ it, given that the file is opened for writing (w) or appending (a). Writing\
    \ means starting to write a content, while appending means adding some more content\
    \ to the existing content.\n\nParameters:\n\nfopen(name of the file, mode to open);\n\
    \nWe will just look at the various modes available:\n\n![4-1-filemodes](Images/image00218.jpeg)\n\
    \nWhen you create a new file, you need to use “w”.\n\n**Practice:**\n\nHope your\
    \ new file section4.php is already created and opened for editing. We will first\
    \ create a file for writing:\n\n```\n$testfile = fopen(\"test.txt\", \"w\");\n\
    ```\n\nOnce you execute, you will find a text file created in the location of\
    \ section4.php\n\nA new file with 0 byte size is created. The text document will\
    \ have no content.\n\n![4-1-1](Images/image00219.jpeg)\n\n**Note:** If you are\
    \ having errors when trying to get this code to run, check that you have granted\
    \ your PHP file access to write information to the hard drive.\n\n*   To grant\
    \ access, right click on the folder PracticePHP => Properties => Uncheck Read-only\n\
    \n*   Go to Security Tab => Check permissions needed for the appropriate users\n\
    \nYou remember **Resource data type** from Section 2?  \n\n$testfile belongs to\
    \ the resource data type - though not an actual type, it holds a resource such\
    \ as a file here. \n\n**Writing content to a File:**\n\nThere is a function fwrite()\
    \ which will write contents to the file.\n\nUnderstand:\n\n*   when you open a\
    \ file, the file gets written to the server\n\n*   But when you write using fwrite(),\
    \ it means you are adding content to the file\n\nHope you understand both ‘write’.\
    \ When you open a file, you open in the write mode mentioning it as ‘w’. Whereas\
    \ a function fwrite() serves for writing content.\n\nThere are 2 parameters:\n\
    \nfwrite(name of the file, content to be added);\n\n**Practice:**\n\nWe will add\
    \ few string characters to the file: Continue coding in the same section4.php:\n\
    \n```\n$texttoadd = \"First Line of Text followed by new line character! \";\n\
    fwrite($testfile,$texttoadd);\n$texttoadd = \"Second Line of Text followed by\
    \ new line character! \";\nfwrite($testfile,$texttoadd);\n```\n\nDo not execute\
    \ now, we will close the file and execute it.\n\n**Closing a File:**\n\nOnce we\
    \ finish writing, we have to close the file. It’s just like when you open a file,\
    \ you ought to close it.\n\nThe function fclose() takes care of closing the file.\n\
    \n**Practice:**\n\nAdd the following line to the above code:\n\n```\nfclose($testfile);\n\
    ```\n\nIt's a good programming practice to close all files after you have finished\
    \ working with them. An open file will be taking up resources.\n\nNow, execute\
    \ the php file and then go to the path where text.txt is located. Open text.txt,\
    \ you will find the following lines:\n\n![4-1-2](Images/image00220.jpeg)\n\n**Writing\
    \ contents to an existing file:**\n\n**What happens when you close and then open\
    \ the file again to write?**\n\nThe file testfile.txt already contains some data,\
    \ right? Now, if you open an existing file in the write mode, all the existing\
    \ data will be erased and we should start again with an empty file, as if we created\
    \ it from scratch.\n\nNow, let us just write the following code in section4.php\
    \ as:\n\n```\n$testfile = fopen(\"test.txt\", \"w\");\n$texttoadd = \"New first\
    \ Line! \";\nfwrite($testfile,$texttoadd);\n$texttoadd = \"New Second Line! \"\
    ;\nfwrite($testfile,$texttoadd);\nfclose($testfile);\n```\n\nWhen you execute\
    \ the file now, instead of appending the content, they just overwrite the content\
    \ from scratch.\n\n![4-1-3](Images/image00221.jpeg)\n\nSo, what should you do\
    \ to continue writing content, that is appending content without erasing the existing\
    \ content? Go with append mode: Comment all the previous coding and have only\
    \ these 4 lines.\n\n```\n$testfile = fopen(\"test.txt\", \"a\");\n$texttoadd =\
    \ \"Third Line to existing 2 lines! \";\nfwrite($testfile,$texttoadd);\nfclose($testfile);\n\
    ```\n\nExecute the php file and now open test.txt, you will find the following:\n\
    \n![4-1-4](Images/image00222.jpeg)\n\n**You cannot refresh an open text document!\
    \ Please close it and open again to check!**\n\nNow we have done with writing\
    \ contents to a file. The next task is to read contents from a file. We have many\
    \ functions for that purpose.\n\n**Reading a File:**\n\nWe can open a file to\
    \ read in the following ways:\n\n*   using readfile() function\n\n*   using fread()\
    \ function\n\nWe will look into one by one:\n\nFor executing code to read the\
    \ file, try commenting all write related codes and use only read related codes\
    \ to check how they retrieve content from existing text document!\n\n**Using readfile()\
    \ function:**\n\nIt reads a file and writes it to the output buffer. It returns\
    \ the number of bytes read on success. The readfile() function is useful if all\
    \ you want to do is open up a file and read its contents.\n\nWe have already created\
    \ a file named test.txt. Let us try reading the same file.\n\n```\necho readfile(\"\
    test.txt\");\n```\n\n![4-1-5](Images/image00223.jpeg)\n\nComment the echo statement\
    \ and try the next function.\n\n**Using fread() function:**\n\nThe fread() function\
    \ reads from an open file.\n\nParameters:\n\nfread(name of the open file, maximum\
    \ number of bytes to read);"
