- raw: "*   Pass all variables through htmlspecialchars() function. The reason for\
    \ using this function is unnecessary script codes will not be passed inside text\
    \ fields like name, email.\n\n*   Strip unnecessary characters (extra space, tab,\
    \ newline) from the user input data (with the PHP trim() function).\n\n*   Remove\
    \ backslashes (\\\\) from the user input data (with the PHP stripslashes() function)\n\
    \n*   Check whether the field is empty when the mandatory attribute is mentioned.\n\
    \n*   Place each validation in separate functions so that same code need not be\
    \ repeated for every form.\n\n*   Generate appropriate error message for every\
    \ field, so that the user understands what went wrong in his/her input.\n\nThese\
    \ are few steps in general. I have also hinted some functions to make your work\
    \ easier.\n\nFor our signup form, we can try validating email, name and country\
    \ fields. We may not use all the above functions. Instead, we will use some other\
    \ functions for our purpose!\n\nShall we proceed validating our form?\n\n*   create\
    \ a file named validate\\_form.php inside C:/xampp/htdocs/onlinecourse\n\n*  \
    \ include the validate\\_form.php file in instructor\\_signup.php file\n\nLet\
    \ me show you the include statement to be placed in the beginning of instructor\\\
    _signup.php:\n\n```\ninclude('validate_form.php');\n```\n\nLet me remind you the\
    \ fields once again:\n\n*   txtemail - for email address\n\n*   txtname - for\
    \ name\n\n*   txtqualification - for qualification\n\n*   txtcountry - for country\n\
    \nOut of these 4 fields, txtcountry is a field chosen from a given list. But still\
    \ we have one requirement, that is, some value has to be selected making the field\
    \ mandatory!\n\nThis is no rule set to validate this way. You are free to choose\
    \ your own rules for your fields provided they are appropriate.\n\nWe will practise\
    \ code snippets for every validation.\n\nOnce all validation snippets are ready,\
    \ we will update instructor\\_signup.php file in the last!\n\n**Validate Email\
    \ Address:**\n\nIf you are using type=email (HTML5) in input element and check\
    \ in latest browsers, this field will be automatically validated by the browser.\
    \ We will look a solution for the old browsers and for older versions of HTML.\n\
    \nWe will use the filter\\_var() function to check whether an email address is\
    \ well-formed.\n\nWe retrieve the email address in $email variable as:\n\n```\n\
    $email = $_REQUEST['txtemail'];\n```\n\nLet us now write a function in validate\\\
    _form.php:\n\n```\nfunction check_email($email){\n  if (!filter_var($email, FILTER_VALIDATE_EMAIL))\
    \ {\n\treturn \"Invalid email address\";\n  }\n}\n```\n\nLet me explain:\n\n*\
    \   We pass the variable $email as a parameter to the function check\\_email($email)\n\
    \n*   We use filter\\_var() function to validate email address format\n\n*   If\
    \ the format is wrong, it returns an error message\n\n**Validate Name:**\n\nWe\
    \ will use regular expression function preg\\_match() to check if name field contains\
    \ letters, dashes, apostrophe and whitespaces.\n\nWe retrieve the name field in\
    \ $name variable as:\n\n```\n$name = $_POST['txtname'];\n```\n\nLet us now write\
    \ a function in validate\\_form.php\n\n```\nfunction check_name($name){\n  if\
    \ (!preg_match(\"/^[a-zA-Z-' ]*$/\",$name)) {\n    return \"Name must contain\
    \ letters and whitespaces!\";\n  }\n}\n```\n\nLet me explain:\n\n*   We pass the\
    \ variable $name as a parameter to the function check\\_name($name)\n\n*   We\
    \ use preg\\_match() to check whether the name contains letters, whitespaces,dashes.\n\
    \n*   If the format is wrong, it returns an error message\n\n**What to modify\
    \ in sign up page?**\n\nHope you have added 2 functions in validate\\_form.php.\
    \ Now, we will update the code in instructor\\_signup.php file:\n\nThere are 2\
    \ sets of php coding tags. One set appears in the top.\n\nWe have included the\
    \ validate\\_form.php file\n\n```\n<?php\ninclude('validate_form.php');\nif(isset($_POST['signup'])){\n\
    \  echo \"<br>You have clicked Sign up\";\n  $email = $_REQUEST['txtemail'];\n\
    \  $name = $_POST['txtname'];\n  $qualification = $_POST[\"txtqualification\"\
    ];\n  $country = $_POST['txtcountry'];\n}\n?>\n```\n\nThe second set of php code\
    \ appears near the bottom:\n\nWe will apply validation here:\n\n```\n<?php\n$display\
    \ = true;\nif(isset($email) and isset($name) and isset($qualification) and isset($country)){\n\
    \  //check field validation\n  $email_status = check_email($email);\n  $name_status\
    \ = check_name($name);\n  if($email_status <> NULL){\n    echo \"<p style='text-color:red;'>\"\
    .$email_status.\"</p>\";\n    $display = false;\n  }\n  if($name_status <> NULL){\n\
    \    echo \"<p style='text-color:red;'>\".$name_status.\"</p>\";\n    $display\
    \ = false;\n  }\n  if(empty($country)){\n    echo \"<p style='text-color:red;'>No\
    \ country chosen</p>\";\n    $display = false;\n  }\n  //display fields if no\
    \ errors found\n  if($display){\n    echo \"<br>Email - \".$email;\n    echo \"\
    <br>Name - \".$name;\n    echo \"<br>Qualification - \".$qualification;\n    echo\
    \ \"<br>Country - \".$country;\n  }\n}\n?>\n```\n\nLet me explain the code:\n\n\
    *   We have set a variable $display to true\n\n*   We check if all variables have\
    \ a value, If yes, proceed \n\n    *   validate email field, if the email field\
    \ is not valid, display message\n\n    *   validate name field, if the name field\
    \ is not valid, display message\n\n    *   check if a country is chosen, else\
    \ display a message\n\n    *   if any of the three validation fails, then turn\
    \ $display = false, which will not print any details\n\n    *   if $display =\
    \ true even after validation, print the fields\n\nLet us execute with valid/invalid\
    \ input data.\n\nInvalid input data and output:\n\n![4-4-1](Images/image00239.jpeg)\n\
    \n![4-4-2](Images/image00240.jpeg)\n\nValid input data and output:\n\n![4-4-3](Images/image00241.jpeg)\n\
    \n![4-4-4](Images/image00242.jpeg)\n\n**Note:**\n\nIn HTML5, we have text fields\
    \ like email, url, number, search which will be auto validated before submitting\
    \ a form. If you wish to use type=text, you ought to validate them. Even if you\
    \ have email, url types, it is a good practice to impose validation rules so that\
    \ the input data of users using older browsers can also be validated.\n\n**Validating\
    \ URL:**\n\nJust for knowledge purpose, let me give you the code for validating\
    \ a URL field.\n\nAssume we store a website’s URL in $url variable, find the validation\
    \ below:\n\n```\nif (!preg_match(\"/\\b(?:(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&@#\\\
    /%?=~_|!:,.;]*[-a-z0-9+&@#\\/%=~_|]/i\",$url))\n{\n  return \"Invalid URL\";\n\
    }\n```\n\nThe intention of this section is to give you an insight on how to use\
    \ PHP (and PHP functions) for form validation. Hope you understood how to validate\
    \ form fields in PHP. The next section will deal how to upload a file using form\
    \ and validate the same.\n\n* * *\n\n### 4.5 File Upload\n\n* * *\n\nIn our onlinecourse\
    \ project, we have a form to get course contents. Say, we have this ebook content\
    \ as a PHP course. What will be the format of the content?\n\n*   content type:\
    \ pdf / ppt / doc / video\n\n*   content file: uploading files through browser\n\
    \nWhat are we going to do in this section?\n\n*   Enable file upload\n\n*   Design\
    \ a form and upload file\n\n*   Impose rules for files being uploaded\n\n*   Validate\
    \ those rules\n\n**Enabling File Upload:**\n\nGenerally, servers will have this\
    \ feature enabled. But locally, we can have a check once.\n\n*   Locate your php.ini\
    \ file in the path C:/xampp/php\n\n*   Open the file using any text editor\n\n\
    *   Search for file\\_uploads (around line 830) and check whether file\\_uploads\
    \ = on\n\n*   If it is not enabled, enable it as given above.\n\n**Designing the\
    \ course content form:**\n\nCreate a new php file named upload\\_content.php in\
    \ the path C:/xampp/htdocs/onlinecourse\n\nWe have created the form in this way:\n\
    \n*   Forms must be submitted using 'post' method.\n\n*   We should include the\
    \ attribute: enctype=\"multipart/form-data\" in the form element. This specifies\
    \ what content-type it should use when submitting the form.\n\n*   Using file\
    \ in type attribute in the input element will provide a Browser button\n\nRemember\
    \ that the above set rules have to be applied to make file uploading work.\n\n\
    Here is the form code:"
  fmt: "\n### 表单验证最佳实践\n\n*   将所有变量通过 `htmlspecialchars()` 函数处理。使用此函数的原因是防止不必要的脚本代码被传递到姓名、邮箱等文本字段中。\n\
    *   使用 PHP `trim()` 函数从用户输入数据中去除不必要的字符（多余空格、制表符、换行符）。\n*   使用 PHP `stripslashes()`\
    \ 函数从用户输入数据中移除反斜杠（`\\\\`）。\n*   当提到 `mandatory` 属性时，检查字段是否为空。\n*   将每个验证逻辑放在单独的函数中，以避免为每个表单重复编写相同代码。\n\
    *   为每个字段生成适当的错误消息，以便用户了解其输入哪里出错。\n\n以上是通用的几个步骤。我还提示了一些函数以方便你的工作。\n\n对于我们的注册表单，我们可以尝试验证邮箱、姓名和国家字段。我们可能不会用到上述所有函数，而是会使用一些其他函数来实现我们的目的！\n\
    \n我们开始验证表单吧？\n\n*   在 `C:/xampp/htdocs/onlinecourse` 目录下创建一个名为 `validate_form.php`\
    \ 的文件\n*   在 `instructor_signup.php` 文件中包含 `validate_form.php` 文件\n\n让我展示一下要放在\
    \ `instructor_signup.php` 开头的包含语句：\n\n```\ninclude('validate_form.php');\n```\n\
    \n再次提醒一下字段：\n\n*   `txtemail` - 用于邮箱地址\n*   `txtname` - 用于姓名\n*   `txtqualification`\
    \ - 用于学历\n*   `txtcountry` - 用于国家\n\n在这 4 个字段中，`txtcountry` 是从给定列表中选择的字段。但我们仍有一个要求：必须选择某个值，使该字段成为必填项！\n\
    \n这没有固定的验证规则。只要规则合适，你可以自由选择适合你字段的验证规则。\n\n我们将练习每个验证的代码片段。\n\n一旦所有验证片段准备就绪，我们将在最后更新\
    \ `instructor_signup.php` 文件！\n\n#### 验证邮箱地址\n\n如果你在输入元素中使用 `type=\"email\"` (HTML5)\
    \ 并在最新浏览器中检查，该字段将由浏览器自动验证。我们将为旧版浏览器和旧版 HTML 提供解决方案。\n\n我们将使用 `filter_var()` 函数来检查邮箱地址是否格式正确。\n\
    \n我们在 `$email` 变量中获取邮箱地址：\n\n```\n$email = $_REQUEST['txtemail'];\n```\n\n现在让我们在\
    \ `validate_form.php` 中编写一个函数：\n\n```\nfunction check_email($email){\n  if (!filter_var($email,\
    \ FILTER_VALIDATE_EMAIL)) {\n\treturn \"Invalid email address\";\n  }\n}\n```\n\
    \n代码解释：\n\n*   将变量 `$email` 作为参数传递给函数 `check_email($email)`\n*   使用 `filter_var()`\
    \ 函数验证邮箱地址格式\n*   如果格式错误，则返回错误消息\n\n#### 验证姓名\n\n我们将使用正则表达式函数 `preg_match()` 来检查姓名字段是否仅包含字母、连字符、撇号和空白字符。\n\
    \n我们在 `$name` 变量中获取姓名字段：\n\n```\n$name = $_POST['txtname'];\n```\n\n现在让我们在 `validate_form.php`\
    \ 中编写一个函数：\n\n```\nfunction check_name($name){\n  if (!preg_match(\"/^[a-zA-Z-'\
    \ ]*$/\",$name)) {\n    return \"Name must contain letters and whitespaces!\"\
    ;\n  }\n}\n```\n\n代码解释：\n\n*   将变量 `$name` 作为参数传递给函数 `check_name($name)`\n*  \
    \ 使用 `preg_match()` 检查姓名是否包含字母、空白字符、连字符\n*   如果格式错误，则返回错误消息\n\n#### 注册页面需要修改什么？\n\
    \n希望你已在 `validate_form.php` 中添加了 2 个函数。现在，我们将更新 `instructor_signup.php` 文件中的代码：\n\
    \n共有两组 PHP 代码标签。一组出现在顶部。\n\n我们已包含 `validate_form.php` 文件：\n\n```\n<?php\ninclude('validate_form.php');\n\
    if(isset($_POST['signup'])){\n  echo \"<br>You have clicked Sign up\";\n  $email\
    \ = $_REQUEST['txtemail'];\n  $name = $_POST['txtname'];\n  $qualification = $_POST[\"\
    txtqualification\"];\n  $country = $_POST['txtcountry'];\n}\n?>\n```\n\n第二组 PHP\
    \ 代码出现在底部附近：\n\n我们将在这里应用验证：\n\n```\n<?php\n$display = true;\nif(isset($email)\
    \ and isset($name) and isset($qualification) and isset($country)){\n  //check\
    \ field validation\n  $email_status = check_email($email);\n  $name_status = check_name($name);\n\
    \  if($email_status <> NULL){\n    echo \"<p style='text-color:red;'>\".$email_status.\"\
    </p>\";\n    $display = false;\n  }\n  if($name_status <> NULL){\n    echo \"\
    <p style='text-color:red;'>\".$name_status.\"</p>\";\n    $display = false;\n\
    \  }\n  if(empty($country)){\n    echo \"<p style='text-color:red;'>No country\
    \ chosen</p>\";\n    $display = false;\n  }\n  //display fields if no errors found\n\
    \  if($display){\n    echo \"<br>Email - \".$email;\n    echo \"<br>Name - \"\
    .$name;\n    echo \"<br>Qualification - \".$qualification;\n    echo \"<br>Country\
    \ - \".$country;\n  }\n}\n?>\n```\n\n代码解释：\n\n*   我们设置变量 `$display` 为 `true`\n\
    *   我们检查所有变量是否都有值，如果是，则继续\n    *   验证邮箱字段，如果邮箱字段无效，显示消息\n    *   验证姓名字段，如果姓名字段无效，显示消息\n\
    \    *   检查是否选择了国家，否则显示消息\n    *   如果上述三个验证中的任何一个失败，则将 `$display = false`，这将不打印任何详细信息\n\
    \    *   如果验证后 `$display = true`，则打印字段\n\n让我们使用有效/无效输入数据执行。\n\n无效输入数据和输出：\n\n\
    ![4-4-1](Images/image00239.jpeg)\n![4-4-2](Images/image00240.jpeg)\n\n有效输入数据和输出：\n\
    \n![4-4-3](Images/image00241.jpeg)\n![4-4-4](Images/image00242.jpeg)\n\n> **注意：**\n\
    >\n> 在 HTML5 中，我们有邮箱、URL、数字、搜索等文本字段，它们会在提交表单前自动验证。如果你希望使用 `type=\"text\"`，你必须对它们进行验证。即使你使用了邮箱、URL\
    \ 类型，强制实施验证规则也是一种好习惯，这样使用旧版浏览器的用户的输入数据也能得到验证。\n\n#### 验证 URL\n\n仅供参考，让我给出验证 URL\
    \ 字段的代码。\n\n假设我们将网站的 URL 存储在 `$url` 变量中，验证代码如下：\n\n```\nif (!preg_match(\"/\\\
    b(?:(?:https?|ftp):\\/\\/|www\\.)[-a-z0-9+&@#\\/%?=~_|!:,.;]*[-a-z0-9+&@#\\/%=~_|]/i\"\
    ,$url))\n{\n  return \"Invalid URL\";\n}\n```\n\n本节的目的是让你了解如何使用 PHP（及 PHP 函数）进行表单验证。希望你理解了如何在\
    \ PHP 中验证表单字段。下一节将介绍如何使用表单上传文件并验证文件。\n\n---\n\n### 4.5 文件上传\n\n---\n\n在我们的 `onlinecourse`\
    \ 项目中，我们有一个获取课程内容的表单。假设我们有这本电子书的内容作为 PHP 课程。内容的格式是什么？\n\n*   内容类型：pdf / ppt /\
    \ doc / video\n*   内容文件：通过浏览器上传文件\n\n我们在本节要做什么？\n\n*   启用文件上传\n*   设计表单并上传文件\n\
    *   对上传的文件施加规则\n*   验证这些规则\n\n#### 启用文件上传\n\n通常，服务器会启用此功能。但在本地，我们可以检查一次。\n\n*\
    \   在路径 `C:/xampp/php` 中找到你的 `php.ini` 文件\n*   使用任意文本编辑器打开该文件\n*   搜索 `file_uploads`（大约在第\
    \ 830 行）并检查 `file_uploads = on` 是否已设置\n*   如果未启用，按上述方式启用它。\n\n#### 设计课程内容表单\n\n\
    在路径 `C:/xampp/htdocs/onlinecourse` 下创建一个名为 `upload_content.php` 的新 PHP 文件。\n\n\
    我们按如下方式创建表单：\n\n*   表单必须使用 `post` 方法提交。\n*   我们应在表单元素中包含属性：`enctype=\"multipart/form-data\"\
    `。这指定了提交表单时应使用的内容类型。\n*   在输入元素的 `type` 属性中使用 `file` 将提供一个“浏览”按钮。\n\n请记住，必须应用上述规则才能使文件上传工作。\n\
    \n以下是表单代码：\n"
