- raw: "So, with no further delay, make those 2 pages ready. First, we will work with\
    \ registration.\n\n* * *\n\n**Registration - Redirect to Login:**\n\nHope you\
    \ have the file ready. We will include the code now. We will test it after completing\
    \ the login process.\n\nYou have an if block in the top php segment:\n\n```\n\
    if($check_insert1 and $check_insert2){\n  echo \"<script>alert('Registration successful!');</script>\"\
    ;\n}\n```\n\nWe will issue redirect command via JavaScript in this echo statement.\
    \ Why are we doing so? Since we get success message via this alert(), we have\
    \ to induce redirect after this message. If we code in php for redirection, this\
    \ alert message will be missed. For safer side, we will code in JS.\n\nChange\
    \ the code as:\n\n```\nif($check_insert1 and $check_insert2){\n  echo \"<script>alert('Registration\
    \ successful!');\n  window.location.replace('login.php');</script>\";\n}\n```\n\
    \nThis code states that the current page has to be replaced with the url in the\
    \ parameter.\n\n* * *\n\n**Login Process:**\n\nWe will design a login form and\
    \ then include php code as usual. On successful login, we will redirect to dashboard.php.\
    \ Let us start.\n\n**Design Form: login.php**\n\nChange the title tag content\
    \ as User Login and replace the main tag element with the code below:\n\n```\n\
    <main>\n<section>\n<h3> User Login </h3>\n<p>\n<form method=\"post\" name=\"frmlogin\"\
    >\n<p><input type=\"email\" name=\"txtuser\" size=\"40\" placeholder=\"Enter your\
    \ email\"></p>\n<p><input type=\"password\" name=\"txtpwd\" size=\"40\" placeholder=\"\
    Enter your password\"></p>\n<p><input type=\"submit\" name=\"login\" value=\"\
    Login\" class=\"frmbtn\"></p>\n</form>\n</p>\n</section>\n</main>\n```\n\nDo not\
    \ enter any detail! Just execute for seeing the page: [http://localhost/onlinecourse/login.php](#part0050.xhtml)\n\
    \n![8-1-1](Images/image00340.jpeg)\n\n**Authentication code: login.php**\n\nWe\
    \ will include the authentication part in the top of the page as usual.\n\n```\n\
    <?php\nsession_start();\nrequire('connect.php');\n$auth = true;\n$hashedpwd =\
    \ '';\nif(isset($_POST['login'])){\n  $username = $_POST['txtmail'];\n  $password\
    \ = $_POST['txtpwd'];\n  $select_user = mysqli_query($con,\"SELECT * FROM userlogin\
    \ WHERE user_mail='$username'\");\n  if($user = mysqli_fetch_row($select_user)){\n\
    \    $hashedpwd = $user[1];\n  }\n  else{\n    $auth = false;\n  }\n  if(!password_verify($password,$hashedpwd)){\n\
    \    $auth = false;\n  }\n  if($auth){\n    $_SESSION['usersession'] = $username;\n\
    \    echo \"<script>window.location.replace('dashboard.php')</script>\";\n  }\n\
    \  else{\n    echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n  } \n}\n?>\n```\n\nWe will look at the explanation:\n\n```\nsession_start();\n\
    ```\n\nWe will use session\\_start() for this authentication because we have to\
    \ store the username as the session variable. It means, until the user logs out\
    \ / closes session, the session variable will be alive.\n\n```\n$auth = true;\n\
    $hashedpwd = '';\n```\n\nWe initialize two variables. $auth will hold true till\
    \ the end of code if username and password matches database records. If $auth\
    \ become false somewhere, it means either username or password does not match\
    \ which means authentication fails. $hashedpwd will later hold the password field\
    \ if username matches.\n\n```\n$select_user = mysqli_query($con,\"SELECT * FROM\
    \ userlogin WHERE user_mail='$username'\");\nif($user = mysqli_fetch_row($select_user)){\n\
    \  $hashedpwd = $user[1];\n}\nelse{\n  $auth = false;\n}\n```\n\nWe search the\
    \ record of userlogin table which matches the username.\n\n*   If a user is existing\
    \ with the username, the password field is assigned to $hashedpwd variable.\n\n\
    *   If a user is not existing with the username, $auth variable is set to false.\n\
    \n```\nif(!password_verify($password,$hashedpwd)){\n  $auth = false;\n}\n```\n\
    \nWe compare the password entered in the form to the hashed password stored in\
    \ the table. We use password\\_verify() function designated for this purpose exclusively.\
    \ In case, if there is no match between passwords, $auth turns to false.\n\n```\n\
    if($auth){\n  $_SESSION['usersession'] = $username;\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
    ;\n}\nelse{\n  echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n}\n```\n\nIf $auth holds true under all those checks, we assign $username value\
    \ to a session variable $\\_SESSION\\[‘usersession’\\]. After this, we redirect\
    \ to dashboard page. If $auth turns false in any of the checks, we print invalid\
    \ login message.\n\n**When does $auth turn false?**\n\n*   When a username does\
    \ not exist\n\n*   When the entered password does not match with the hashed password\
    \ value already stored in table (checked via password\\_verify() function)\n\n\
    The login part is over here. We will do few changes in dashboard.php so that we\
    \ can display the session variable value in this page from the login page.\n\n\
    * * *\n\n**Session variable: dashboard.php**\n\nChange the title tag content as\
    \ User Dashboard.\n\nPlace the following lines in the top of the page:\n\n```\n\
    <?php\nsession_start();\nrequire('connect.php');\n?>\n```\n\nIt is advisable to\
    \ place session\\_start() in the beginning of the page.\n\nAs usual, replace the\
    \ main tag content with the code:\n\n```\n<main>\n<section>\n<h3> User Dashboard\
    \ </h3>\n<p>\n<?php \n$usersession = '';\nif(isset($_SESSION['usersession'])){\n\
    \  $usersession = $_SESSION['usersession'];\n}\necho \"<p>Hello \".$usersession.\"\
    </p>\";\n?>\n</p>\n</section>\n</main>\n```\n\nWe have just assigned the session\
    \ variable value to a variable $usersession and print the same.\n\n**Execution:**\n\
    \nShall we check the complete process now?\n\nThis time, we will:\n\n*   register\
    \ a learner\n\n*   login the learner\n\n*   see the learner's username in the\
    \ dashboard page\n\nWe have to execute this as an application. So we will travel\
    \ to registration page from the home page.\n\n*   Go to [http://localhost/onlinecourse/](#part0050.xhtml)\n\
    \n*   Click Login\n\n*   Click Register here link.\n\nLet me sign up / register\
    \ as a learner this time:\n\nDetails to be entered:\n\n*   Who are you? Learner\n\
    \n*   Email - [learner1@onlinecourse.com](#part0050.xhtml)\n\n*   Password - password\n\
    \n*   Full Name - Learner 1\n\n*   Details - First learner of this platform\n\n\
    Let me show the process.\n\n*This is a GIF image. Make sure GIF is supported in\
    \ your device.*\n\n![1604664851-registration-login](Images/image00341.gif)\n\n\
    Hope you also have the same flow of application without any bugs in between.\n\
    \nDo not forget to check phpmyadmin - learners and userlogin tables!\n\n![8-1-2](Images/image00342.jpeg)\n\
    \n![8-1-3](Images/image00343.jpeg)\n\n* * *\n\n**How to redirect to dashboard\
