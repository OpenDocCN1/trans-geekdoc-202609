    \nWe cannot use this as it is. In order to secure our database in the servers,\
    \ we have to follow the procedure of creating an username and password just for\
    \ the onlinecourse database.\n\n**How to create username and password for database?**\n\
    \nLet us get back to phpmyadmin.\n\n1\\. Access phpMyAdmin in your browser ([http://localhost/phpmyadmin](#part0042.xhtml))\n\
    \n2\\. Go to User Accounts Tab\n\n![7-1-1](Images/image00303.jpeg)\n\n3\\. There\
    \ are user accounts already created for the root user. Click Add user account\n\
    \n![7-1-2](Images/image00304.jpeg)\n\n4\\. Give the following details in the next\
    \ screen:\n\nUsername: ocuser\n\nHostname: localhost\n\nPassword & Re-type: Pass@OC20\n\
    \n![7-1-3](Images/image00305.jpeg)\n\n5\\. Click Go in the right bottom corner.\
    \ You will get the screen below:\n\n![7-1-4](Images/image00306.jpeg)\n\n6\\. Go\
