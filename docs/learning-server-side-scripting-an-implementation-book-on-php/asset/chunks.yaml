    # Date/Time Functions


    Though there are lots of discuss in this topic, we will learn about working with
    date/time in PHP.


    The `date()` function is used to format a date and / or a time.


    This function formats a timestamp to a more readable date and time. A timestamp
    is a sequence of characters, denoting the date and/or time at which a certain
    event occurred.


    ## Syntax


    ```php

    date(format, timestamp)

    ```


    There are 2 parameters:


    *   **format** - It is a required parameter. It specifies the format of the timestamp

    *   **timestamp** - It is an optional parameter to specify a timestamp. Default
    is the current date and time


    ## How to get a date?


    Here are some characters that are commonly used for date:


    *   `d` - Represents the day of the month (01 to 31)

    *   `m` - Represents a month (01 to 12)

    *   `Y` - Represents a year (in four digits)

    *   `l` (lowercase ''L'') - Represents the day of the week


    Other characters, like `/`, `.`, or `-` can also be inserted between the characters
    to add additional formatting.


    ## How to get a time?


    Here are some characters that are commonly used for time:


    *   `H` - 24-hour format of an hour (00 to 23)

    *   `h` - 12-hour format of an hour with leading zeros (01 to 12)

    *   `i` - Minutes with leading zeros (00 to 59)

    *   `s` - Seconds with leading zeros (00 to 59)

    *   `a` - Lowercase Ante meridiem and Post meridiem (am or pm)


    ## How to specify your timezone?


    The PHP `date()` function will return the current date/time of the server! The
    timezone of the server is UTC.


    Since I am in India, I am going to use the IST timezone!


    To specify the timezone, we have to include the line:


    ```php

    date_default_timezone_set("Asia/Kolkata");

    ```


