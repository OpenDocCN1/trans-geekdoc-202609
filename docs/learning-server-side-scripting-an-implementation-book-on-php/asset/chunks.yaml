    \ new file named connect.php in onlinecourse folder (C:/xampp/htdocs/onlinecourse).\
    \ Use the following code:\n\n```\n<?php\n$host = \"localhost\";\n$username = \"\
    ocuser\";\n$password = \"Pass@OC20\";\n$database = \"onlinecourse\";\n$con = mysqli_connect($host,$username,$password,$database);\n\
    if (!$con) {\n  die(\"Connection failed: \" . mysqli_connect_error());\n}\nelse\
    \ {\n  echo \"Database connected\";\n}\n?>\n```\n\n**Explanation:**\n\nWe have\
    \ created 4 variables to hold those 4 parameter values. We pass them via mysqli\\\
    _connect() built-in function and we store the result of the connection in $con\
    \ variable. $con is a resource type variable.\n\nIf the database is not connected,\
    \ it will display the if statement. If it is connected, it will display the else\
