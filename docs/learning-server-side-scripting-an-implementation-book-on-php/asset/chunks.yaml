    \n---\n\n# 第 7 章：与 MySQL 数据库交互\n\n---\n\n## 7.1 连接数据库\n\n---\n\n有三种使用 PHP 和 MySQL\
    \ 数据库协作的方式：\n\n*   `MySQLi`（过程式）\n*   `MySQLi`（面向对象）\n*   `PDO`\n\n`MySQLi` 方式适用于\
    \ MySQL 数据库系统，而 `PDO` 适用于 12 种数据库系统。\n\n在本书中，我们将采用 `MySQLi` 过程式方法。这将是出于学习目的的最合适方法。\n\
    \n从根本上说，要操作数据库，您需要建立连接。因此，我们在这里要学习的第一件事就是建立连接。\n\n**语法：**\n\n```\nmysqli_connect($servername,\
    \ $username, $password, $database);\n```\n\n*   `$servername` 是主机名\n*   `$username`\
    \ - 连接数据库的用户名\n*   `$password` - 连接数据库的密码\n*   `$database` - 要连接的数据库名称\n\n让我们看看是否已具备这些参数的值：\n\
    \n*   `$servername` 是主机名。目前我们是从本地服务器运行应用程序。主机名是 `localhost`。因此，`$servername` 的值\
    \ = `localhost`。\n*   `$database` 的值为 `onlinecourse`（在 phpMyAdmin 中创建的数据库）\n\n\
    通常，当安装 `xampp` 时，用户名为 `root` 且无密码。\n\n我们不能原样使用它。为了保护服务器上的数据库安全，我们必须遵循为 `onlinecourse`\
    \ 数据库专门创建用户名和密码的程序。\n\n**如何为数据库创建用户名和密码？**\n\n让我们回到 phpMyAdmin。\n\n1.  在浏览器中访问\
    \ phpMyAdmin（`http://localhost/phpmyadmin`）\n2.  转到“用户账户”选项卡\n\n![7-1-1](img/image00303.jpeg)\n\
    \n3.  已经为 `root` 用户创建了用户账户。点击“添加用户账户”\n\n![7-1-2](img/image00304.jpeg)\n\n4. \
    \ 在下一个屏幕中提供以下详细信息：\n\n    *   用户名：`ocuser`\n    *   主机名：`localhost`\n    *   密码和重新输入：`Pass@OC20`\n\
    \n![7-1-3](img/image00305.jpeg)\n\n5.  点击右下角的“执行”。您将看到下面的屏幕：\n\n![7-1-4](img/image00306.jpeg)\n\
    \n6.  接下来转到“全局权限”旁边的“数据库”选项卡\n\n![7-1-5](img/image00307.jpeg)\n\n7.  从列表中选择 `onlinecourse`。您将被带到：\n\
    \n![7-1-6](img/image00308.jpeg)\n\n8.  勾选所有权限。点击“执行”，您将被带到：\n\n![7-1-7](img/image00309.jpeg)\n\
    \n用户账户（用户名和密码）已创建并映射到 `onlinecourse` 数据库。执行每条命令时都会生成相应的 SQL 语法。\n\n**检查权限是否已授予：**\n\
    \n*   点击左侧面板的“主页”图标 -> 转到“用户账户”\n*   检查 `ocuser` 对应的“授权”字段是否为“Yes”。\n\n![7-1-8](img/image00310.jpeg)\n\
    \n*   如果“授权”字段为“No”，只需点击“编辑权限”，勾选所有权限，然后点击“执行”。返回此处检查，它应该会变为“Yes”。\n\n**注意：**\
    \ 如果“授权”未变为“Yes”，您将无法从应用程序建立与数据库的连接。\n\n现在，回到连接语法：\n\n因此，我们现在拥有了所有 4 个参数。\n\n\
    在 `onlinecourse` 文件夹（`C:/xampp/htdocs/onlinecourse`）中创建一个名为 `connect.php` 的新文件。使用以下代码：\n\
    \n```\n<?php\n$host = \"localhost\";\n$username = \"ocuser\";\n$password = \"\
    Pass@OC20\";\n$database = \"onlinecourse\";\n$con = mysqli_connect($host, $username,\
    \ $password, $database);\nif (!$con) {\n  die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\nelse {\n  echo \"Database connected\";\n}\n?>\n```\n\n**解释：**\n\n我们创建了 4 个变量来保存那\
    \ 4 个参数值。我们通过 `mysqli_connect()` 内置函数传递它们，并将连接结果存储在 `$con` 变量中。`$con` 是一个资源类型变量。\n\
    \n如果数据库未连接，将显示 if 语句。如果已连接，将显示 else 语句。\n\n为什么我在 if-else 中反转了条件？\n\n原因是：我们在任何地方都不需要\
    \ else 部分。仅为了检查目的，我们在 else 部分使用了 echo 语句。\n\n使用 `http://localhost/onlinecourse/connect.php`\
    \ 执行该页面\n\n![7-1-9](img/image00311.jpeg)\n\n可能的错误：\n\n1.  如果您的密码与 phpMyAdmin 中输入的不匹配，可能会被拒绝连接\n\
    2.  检查所有拼写错误\n\n现在，是时候移除连接代码的 else 部分了。让我们保留如下代码：\n\n```\nconnect.php\n<?php\n\
    $host = \"localhost\";\n$username = \"ocuser\";\n$password = \"Pass@OC20\";\n\
    $database = \"onlinecourse\";\n$con = mysqli_connect($host, $username, $password,\
    \ $database);\nif (!$con) {\n  die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\n?>\n```\n\n此后，仅当建立连接时出现错误，才会产生错误消息。\n\n**关闭连接：**\n\n脚本结束时连接会自动关闭。如果您确实想手动关闭数据库连接，只需使用：\n\
    \n```\nmysqli_close($con);\n```\n"
