    \ \"</td>\"; \n echo \"</tr>\";\n}\necho \"</table>\";\n?>\n</section>\n</main>\n\
    ```\n\n## 功能说明\n\n- 我们以表格形式显示课程详情，仅显示标题字段。\n- 我们提供了创建新课程的链接。\n- 为了编辑课程，我们提供了带有参数\
    \ `cid = coursecode` 的链接。\n- 为了上传内容，我们提供了带有参数 `cid` 的链接。\n- 为了查看学习者列表和进度，我们使用了相同的参数\
    \ `cid`。\n\n以讲师身份登录，点击仪表盘中的 Courses：\n\n![8-4-1](img/image00348.jpeg)\n\n我们传递了携带课程代码值的参数\
    \ `cid`。接下来的任务是：在 3 个页面中检索该参数——`editcourse.php`、`uploadcontent.php` 和 `reports.php`。\n\
    \n我们现在进行适当的更改：\n\n---\n\n## newcourse.php\n\n我们在此不传递任何参数，但必须指示 PHP 使用 `$usersession`\
    \ 值作为讲师 ID。\n\n从表单中移除以下行：\n\n```html\n<input type='hidden' name='txtinstruct'\
