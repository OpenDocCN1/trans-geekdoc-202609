    # PHP Type Checking Functions


    ## Float Type Checking


    PHP has the following functions to check if the type of a variable is float:


    *   `is_float()`

    *   `is_double()`


    ## Finite/Infinite Checking


    PHP has the following functions to check if a numeric value is finite or infinite.
    A numeric value that is larger than `PHP_FLOAT_MAX` is considered infinite.


    *   `is_finite()`

    *   `is_infinite()`


    ## NaN Checking


    PHP has function to check if a value is not a number. NaN stands for Not a Number.
    NaN is used for impossible mathematical operations.


    *   `is_nan()`


    ## Numeric Checking


    The PHP function uses the following function to find whether a variable is numeric.
    The function returns true if the variable is a number or a numeric string. It
    returns false otherwise.


    *   `is_numeric()`


    From PHP 7.0, this function will return FALSE for numeric strings in hexadecimal
    form (e.g. `0xf4c3b00c`), as they are no longer considered as numeric strings.


    ## Integer Casting


    Sometimes you need to cast a numerical value into another data type. The following
    functions are often used to convert a value to an integer.


    `(int)`, `(integer)`, or `intval()`


    ---


