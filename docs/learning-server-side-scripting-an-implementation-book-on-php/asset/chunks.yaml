- raw: "Now, let us see session in the context of web:\n\nAssume you work in a web\
    \ application. You log in to your account, make some changes and then log out.\
    \ This is exactly a session. A session will retain some identity of yours so that\
    \ the server knows who you are, throughout the session.\n\nIn PHP, we achieve\
    \ this session concept using session variables. Session variables solve this problem\
    \ by storing user information to be used across multiple pages. By default, session\
    \ variables last until the user closes the browser or until the user is logged\
    \ in.\n\nSession variables hold information about one single user and make it\
    \ available to all the pages the user visits within the application. Whenever\
    \ a user logs in, a session for that user is started. If there are 3 users - user1,\
    \ user2, user3 logging into the web application at the same time, one session\
    \ variable will be created and it will store 3 values - say, the userid of the\
    \ users. Based on the userid, it will identify which user has done what modification\
    \ in the application.\n\n**How do you start a session?**\n\nWe have the session\\\
    _start() function for starting a session.\n\nDo you remember superglobal variable\
    \ $\\_SESSION? $\\_SESSION global variable is used to set session variables.\n\
    \nShall we practise this via our onlinecourse project?\n\n**Practice:**\n\nWe\
    \ will create a session variable in one page and retrieve the session variable\
    \ value in another page.\n\nNow, you have to create 2 php files: page1.php and\
    \ page2.php in C:/xampp/htdocs/onlinecourse path.\n\nWhat will we do in page1.php?\n\
    \n*   Design a form to get a name field\n\n*   Set session variable and store\
    \ the name\n\nWhat will we do in page2.php?\n\n*   Retrieve the name stored from\
    \ session variable\n\n*   Print the retrieved name\n\n**Code in page1.php:**\n\
    \nI will present the design code first and then we will add php code so that you\
    \ can understand how to set a session variable.\n\nHere is the design code:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Page 1 </title>\n</head>\n<body>\n\
    <h3> Page 1 - Get Name </h3>\n<form method=\"post\" name=\"form3\">\n<p><input\
    \ type=\"text\" name=\"txtname\" placeholder=\"Enter your name\"></p>\n<p><input\
    \ type=\"submit\" name=\"submit\" value=\"Submit\"></p>\n</form>\n</body>\n</html>\n\
    ```\n\nNow, we will add php code in the beginning of the page:\n\n```\n<?php\n\
    session_start();\nif(isset($_POST['submit'])){\n  $_SESSION['name'] = $_POST['txtname'];\n\
    \  echo \"<br> Session variable is set: \".$_SESSION['name'];\n}\n?>\n```\n\n\
    Let me explain php coding:\n\n*   We start a new session using session\\_start()\n\
    \n*   We set the value of the name field to $\\_SESSION\\['name'\\] global variable.\n\
    \n*   We print the stored variable\n\nExecute page1.php from the browser and provide\
    \ a name as input and press submit. Screenshots are provided below for reference:\n\
    \n![5-1-0](Images/image00248.jpeg)\n\n![5-1-1](Images/image00249.jpeg)\n\nThe\
    \ next work is to retrieve this name from page2.php file.\n\n**Code in page2.php:**\n\
    \nThere is nothing to design here. We will directly get into php code.\n\n```\n\
    <?php\nsession_start();\nif(isset($_SESSION['name'])){\n  echo $_SESSION['name'];\n\
    }\nelse{\n  echo \"Nothing is stored in session variable\";\n}\n?>\n```\n\nSession\
    \ variables are not passed individually to each page as we do in $\\_GET and $\\\
    _POST. They are retrieved from the session variable ($\\_SESSION\\[\\]) placed\
    \ in the beginning of the page.\n\nHow do we get the session variable value?\n\
    \n*   We open the session using session\\_start()\n\n*   We check whether the\
    \ value is set for $\\_SESSION\\['name'\\] variable\n\n*   If it is set, we print\
    \ the same, else we print a message that nothing is stored\n\nJust execute page2.php\
    \ file from the browser:\n\n![5-1-2](Images/image00250.jpeg)\n\nThat's the story!\
    \ We didn't provide any input in page2.php, yet the name is retrieved. How?\n\n\
    That is the power of session variables! Not only login details, we can retain\
    \ any values in session variables! For the sake of example, I used login process.\n\
    \n**Note:**\n\nMake sure you execute the pages: page1.php and page2.php in the\
    \ same browser session. That means, you should not close and open browser. Keep\
    \ browser alive and execute both the pages.\n\n**How to change the value of a\
    \ session variable?**\n\nIt is very simple, just assign the new value to the session\
    \ variable wherever you need to modify.\n\n**How to destroy a session?**\n\nTo\
    \ remove all globally set session variables, we use session\\_unset() function.\n\
    \nTo destroy the session, we use session\\_destroy() function.\n\nNow shall we\
    \ add some code to page2.php and test this?\n\nLet me modify the code in page2.php\
    \ as below:\n\n```\n<?php\nsession_start();\necho \"<p>Session Set</p>\";\nif(isset($_SESSION['name'])){\n\
    \ echo $_SESSION['name'];\n}\nelse{\n echo \"Nothing is stored in session variable\"\
    ;\n}\n\n//unset session variables\necho \"<p>Session Unset</p>\";\nsession_unset();\n\
    if(isset($_SESSION['name'])){\n echo $_SESSION['name'];\n}\nelse{\n echo \"Nothing\
    \ is stored in session variable\";\n}\n?>\n```\n\nExecuting page2.php will now\
    \ be:\n\n![5-1-3](Images/image00251.jpeg)\n\nHope you can understand what happens\
    \ after session\\_unset().\n\nNow, session variable is unset, so that page2.php\
    \ does not have any value when executed individually.\n\nExecute in browser: [http://localhost/onlinecourse/page2.php](#part0031.xhtml)\n\
    \n![5-1-4](Images/image00252.jpeg)\n\nSince you have already unset the session\
    \ variable, this page no more holds the value of $\\_SESSION\\['name'\\]. Obviously\
    \ nothing is stored! So, the message is printed twice (once for Session Set and\
    \ once for Session Unset)!\n\n* * *\n\n### 5.2 Cookies\n\n* * *\n\nA cookie is\
    \ a small file that the server embeds on the user's computer. Each time the same\
    \ computer requests a page with a browser, it will send the cookie too.\n\nA cookie\
    \ is used to identify a user. You can create as well as retrieve cookies in PHP.\n\
    \n**Create Cookies:**\n\nWe can create a cookie using the setcookie() function.\
    \ The setcookie() function must appear BEFORE the <html> tag.\n\n**Syntax:**\n\
    \n`setcookie(name, value, expire, path, domain, secure, httponly);`\n\nParameters:\n\
    \n![5-2-parameters](Images/image00253.jpeg)\n\n**Note:**\n\nThe value of the cookie\
    \ is automatically URL encoded when sending the cookie, and automatically decoded\
    \ when received.\n\nIn order to prevent URLencoding, we have to use setrawcookie().\n\
    \n**Retrieve Cookies:**\n\nWe can retrieve cookies using the superglobal variable\
    \ $\\_COOKIE.\n\n**Modify Cookie value:**\n\nWe just need to assign the new value\
    \ to the cookie using the setcookie() function.\n\n**Delete a Cookie:**\n\nTo\
    \ delete a cookie, use the setcookie() function with an expiration date in the\
    \ past. A recommended practice is to set an expiry date when you create a cookie,\
    \ so that you need not destroy it. When cookie gets expired, it is automatically\
    \ deleted.\n\n**How do you check if cookies are enabled?**\n\nWe will just perform\
    \ a count on $\\_COOKIE variables. $\\_COOKIE will store values in arrays. So,\
    \ performing a count and resulting in zero would state there are no cookies. We\
    \ will directly code this in practice session.\n\n**Practice:**\n\nWe will work\
    \ with an example. Take those 2 files page1.php and page2.php.\n\n*   We will\
    \ set a cookie in page1.php\n\n*   We will retrieve the cookie in page2.php\n\n\
    Let us code for both pages together and execute the pages because we will set\
    \ the expiry of the cookie as 60 secs. After 60 secs, when we try loading page2.php,\
    \ it should say cookie is deleted.\n\n**Code for page1.php:**\n\nInstead of $\\\
    _SESSION, we will replace php code alone with setcookie() function. The design\
    \ code (html part) stays the same in page1.php\n\n```\n<?php\nif(isset($_POST['submit'])){\n\
    setcookie('cookiename',$_POST['txtname'],time() + 60);\n}\n?>\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Page 1 </title>\n</head>\n<body>\n<h3> Page 1 - Get Name\
    \ </h3>\n<form method=\"post\" name=\"form3\">\n<p><input type=\"text\" name=\"\
    txtname\" placeholder=\"Enter your name\"></p>\n<p><input type=\"submit\" name=\"\
    submit\" value=\"Submit\"></p>\n</form>\n</body>\n</html>\n```"
