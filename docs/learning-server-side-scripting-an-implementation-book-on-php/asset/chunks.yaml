- raw: "The json\\_decode() function returns an object by default. The json\\_decode()\
    \ function has a second parameter and when set to true, JSON objects are decoded\
    \ into associative arrays.\n\n![5-4-2](Images/image00262.jpeg)\n\nDo you remember\
    \ Object data type from Chapter-2? You can consider this resulting object as an\
    \ object data type.\n\nSince an object is returned as a result of decode, we can\
    \ access the decoded values individually.\n\nWe can access via 2 ways: object\
    \ and array. Let us see this through an example code snippet:\n\n```\n<?php\n\
    $json = '{\"Test1\":75,\"Test2\":80,\"Test3\":60}';\necho \"<p> JSON format: \"\
    .$json.\"</p>\";\necho \"<p>JSON Decode: </p>\";\nvar_dump(json_decode($json));\n\
    echo \"<p>JSON Decode To Array: </p>\";\nvar_dump(json_decode($json,true));\n\n\
    $array = json_decode($json,true);\n$object = json_decode($json);\n\necho \"<p>Accessing\
    \ via Array: </p>\";\necho \"Test1 = \".$array[\"Test1\"];\necho \"<p>Accessing\
    \ via Object: </p>\";\necho \"Test2 = \".$object->Test2;\n\necho \"<p>Using Loops</p>\"\
    ;\nforeach ($array as $key => $value) {\n  echo $key.\" - \".$value.\"<br>\";\n\
    }\n?>\n```\n\nI have just added retrieving lines to the previous coding snippet.\n\
    \n![5-4-3](Images/image00263.jpeg)\n\nWith this, we come to an end of this chapter!\n\
