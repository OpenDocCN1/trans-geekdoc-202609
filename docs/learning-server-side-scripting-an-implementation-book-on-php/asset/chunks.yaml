- raw: "It is a good practice to close the connection. But we may not use this function\
    \ in our application.\n\n**Execution of Queries:**\n\nWhen working with the database,\
    \ the first primary step is to establish connection. Once connected, we can use\
    \ SQL commands in MySQLi procedural functions.\n\nThere is a common syntax for\
    \ executing queries:\n\n```\nmysqli_query($database_connection,$query_string);\n\
    ```\n\nThere are 2 parameters:\n\n*   $database\\_connection is the resource variable\
    \ $con (the one we used to connect to the database)\n\n*   $query\\_string is\
    \ the string containing the SQL statements\n\nFor making a query in a string,\
    \ we ought to follow this:\n\n*   The SQL query must be quoted in PHP\n\n*   String\
    \ values inside the SQL query must be quoted\n\n*   Numeric values must not be\
    \ quoted\n\n*   The word NULL must not be quoted\n\nThat means, if we use double\
    \ quotes for enclosing SQL string, for string values, we will use single quotes.\
    \ When we code in practice session, we will clearly understand this.\n\nIn the\
    \ subsequent sections, we will learn to manipulate data - insert / select / update/\
    \ delete data in the application specific forms.\n\n* * *\n\n### 7.2 Inserting\
    \ Data - I\n\n* * *\n\nThere are 3 forms to insert data from user:\n\n1\\. Registration\
    \ (instructor / learner)\n\n2\\. New Course\n\n3\\. Upload Content\n\nIn registration,\
    \ we will get input from user. In new course and upload content, instructor provides\
    \ values for fields. These 3 forms will now be designed and used for learning\
    \ inserting data statements.\n\nFirst, let me start with Registration form. We\
    \ will use a single registration form and provide appropriate fields to find whether\
    \ they are instructor or learner.\n\n**Practice:**\n\n1\\. If you have kept index.php\
    \ open in a text editor, choose Save as option and save it as **register.php**\
    \ inside the onlinecourse folder\n\n2\\. When you save it, your onlinecourse folder\
    \ should have 2 files: index.php and register.php\n\nAlternative:\n\nIf you are\
    \ uncomfortable with the above process, then:\n\n*   create a new file called\
    \ register.php inside onlinecourse folder.\n\n*   copy contents from index.php\
    \ to register.php and save them.\n\n**Form Design: register.php**\n\n1\\. Change\
    \ the title tag content as User Registration\n\n2\\. Remove the contents between\
    \ main tags.\n\n3\\. Replace with the following code:\n\n```\n<main>\n<section>\n\
    <h3> User Registration </h3>\n<p>\n<form method=\"post\" name=\"frmregister\"\
    >\n<p><select name=\"txtusercategory\">\n<option value=\"\">Who are you?</option>\n\
    <option value=\"learner\">Learner</option>\n<option value=\"instructor\">Instructor</option>\n\
    </select></p>\n<p><input type=\"email\" name=\"txtmail\" size=\"40\" placeholder=\"\
    Enter your Email Address\" required></p>\n<p><input type=\"password\" name=\"\
    txtpwd\" size=\"40\" placeholder=\"Enter your Password 8-15 characters\" required></p>\n\
    <p><input type=\"text\" name=\"txtname\"  size=\"40\" placeholder=\"Enter you\
    \ Full Name\" required></p>\n<p><textarea name=\"txtdetails\" cols=\"40\" placeholder=\"\
    Enter your details\" required></textarea></p>\n<p><input type=\"submit\" name=\"\
    register\" value=\"Register\" class=\"frmbtn\"></p>\n</form>\n</p>\n</section>\n\
    </main>\n```\n\n4\\. Execute [http://localhost/onlinecourse/register.php](#part0043.xhtml)\n\
    \n![7-2-1](Images/image00312.jpeg)\n\n**Insert Data: register.php**\n\nIn the\
    \ beginning of the file, above the html declaration line, we will include the\
    \ insert code:\n\n```\n<?php\nrequire('connect.php');\n\nif(isset($_POST['register'])){\n\
    \  $category = $_POST['txtusercategory'];\n  $usermail = $_POST['txtmail'];\n\
    \  $userpwd = $_POST['txtpwd'];\n  $name = $_POST['txtname'];\n  $details = $_POST['txtdetails'];\n\
    \  \n  if((strlen($userpwd) > 7) && strlen($userpwd < 16)){\n    $userpwd = password_hash($userpwd,\
    \ PASSWORD_DEFAULT);\n    $insert1 = \"INSERT INTO userlogin VALUES ('$usernmail','$userpwd','$category')\"\
    ;\n    if($category == 'learner'){\n       $insert2 = \"INSERT INTO learners VALUES\
    \ ('$usermail','$name','$details')\";\n    }\n    if($category == 'instructor'){\n\
    \       $insert2 = \"INSERT INTO instructors VALUES ('$usermail','$name','$details')\"\
    ;\n    }\n    $check_insert1 = mysqli_query($con,$insert1);\n    $check_insert2\
    \ = mysqli_query($con,$insert2);\n    if($check_insert1 and $check_insert2){\n\
    \       echo \"<script>alert('Registration successful!');</script>\";\n    }\n\
    \    else{\n       echo \"<script>alert('Sorry! Try again!');</script>\";\n  \
    \  }\n  }\n  else{\n    echo \"<script>alert('Password should be between 8-15\
    \ characters');</script>\";\n  }\n}\n?>\n```\n\nLet me explain line by line:\n\
    \n```\nrequire('connect.php');\n```\n\nWe connect to the database in connect.php\
    \ file. So we include the connect file for this page.\n\n```\nif(isset($_POST['register'])){\
    \ }\n```\n\nThe complete set of php code works only when register button is pressed.\n\
    \n```\n$category = $_POST['txtusercategory'];\n$usermail = $_POST['txtmail'];\n\
    $userpwd = $_POST['txtpwd'];\n$name = $_POST['txtname'];\n$details = $_POST['txtdetails'];\n\
    ```\n\nWe copy the values submitted in the form to variables\n\n```\nif((strlen($userpwd)\
    \ > 7) && strlen($userpwd < 16)){\n}\nelse{\n  echo \"<script>alert('Password\
    \ should be between 8-15 characters');</script>\";\n}\n```\n\nHere, we check if\
    \ password is between 8 and 15 characters by imposing 2 conditions checking if\
    \ length is greater than 7 and less than 16. If the length does not fall between\
    \ 8 and 15, it prints a message and skips registration. If the length is between\
    \ 8-15, it proceeds inside the if block.\n\n```\n$userpwd = password_hash($userpwd,\
    \ PASSWORD_DEFAULT);\n```\n\nIt is a sin to store the password as it is, in the\
    \ database. So, we create a hash using password\\_hash() function.\n\n```\n$insert1\
    \ = \"INSERT INTO userlogin VALUES ('$usermail','$userpwd','$category')\";\nif($category\
    \ == 'learner'){\n  $insert2 = \"INSERT INTO learners VALUES ('$usermail','$name','$details')\"\
    ;\n}\nif($category == 'instructor'){\n  $insert2 = \"INSERT INTO instructors VALUES\
    \ ('$usermail','$name','$details')\";\n}\n```\n\nDuring registration, we have\
    \ to insert data into 2 tables. One table is either instructor or login, the other\
    \ table is userlogin which stores login details and user category data.  \n\n\
    $insert1 statement has the query string for userlogin table.  \n\nBased on the\
    \ category, $insert2 statement will be used. Hope you can see how double quotes\
    \ are used for query string and single quotes are used for string values.\n\n\
    ```\n$check_insert1 = mysqli_query($con,$insert1);\n$check_insert2 = mysqli_query($con,$insert2);\n\
    if($check_insert1 and $check_insert2){\n  echo \"<script>alert('Registration successful!');</script>\"\
    ;\n}\nelse{\n  echo \"<script>alert('Sorry! Try again!');</script>\";\n}\n```\n\
    \nHere, we execute mysqli\\_query() function for 2 insert statements. Hope you\
    \ remember the syntax for executing queries from the previous section.  \n\n$check\\\
    _insert1 and $check\\_insert2 will either hold true (if the query is executed)\
    \ or false (if query is not executed). If both the statements are executed and\
    \ their values are true, we print a message on successful registration. If either\
    \ of them fail, we ask the users to try again.\n\n```\n<script>alert();</script>\n\
    ```\n\nScript tag is included in the echo statement. It means content inside the\
    \ script tag is javascript code. This alert() function in JS will display a pop-up\
    \ with some message. We try to inform the user what kind of action takes places\
    \ through a pop-up instead of printing the message on the page.\n\nOne more thing!\
    \ This is not the only way to carry out insert process. What stays the same is\
    \ the mysqli\\_query() function. The way we carry out can differ in many ways\
    \ like:\n\n*   We can insert data into instructor / learner table first, if successful\
    \ we can insert data to userlogin table\n\n*   In case one table data is inserted\
    \ and the other fails, we can issue commands to reverse the inserted data by issuing\
    \ a delete command.\n\n*   Not only password, all the other fields can also be\
    \ validated before inserting data.\n\nAll these factors depend on the one who\
    \ develops the application and the conditions depend on what sort of application\
    \ is developed."
