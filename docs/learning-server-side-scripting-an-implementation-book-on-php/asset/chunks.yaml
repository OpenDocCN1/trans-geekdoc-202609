    \n```\nsession_start();\nif(isset($_SESSION['usersession'])){\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
    ;\n}\nrequire('connect.php');\n```\n\n*   Execute [http://localhost/onlinecourse/](#part0050.xhtml)\
    \ in 2 tabs of a browser.\n\n*   Try logging in one tab of the browser\n\n*  \
    \ Click Login in the other tab of the browser. You will be redirected to dashboard.php\n\
    \nWe have to make much more changes to the dashboard page. We will do it in the\
    \ next section.\n\n* * *\n\n### 8.2 User Dashboard\n\n* * *\n\nDashboard is the\
    \ place from where you can access all the necessary links.\n\nIn the instructor’s\
    \ dashboard, we can place links to create course, edit course, upload / delete\
