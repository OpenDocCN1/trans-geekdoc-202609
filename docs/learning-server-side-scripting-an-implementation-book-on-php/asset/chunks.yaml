    \  $category = get_category($con,$usersession);\n  $name = get_name($con,$usersession,$category);\n\
    }\nelse{\n  echo \"<script>window.location.replace('login.php');</script>\";\n\
    }\n```\n\n我们检查会话变量是否已设置。如果已设置，我们将其值复制到 `$usersession` 变量中。由于 `$usersession` 是一个邮箱地址（讲师表和学习者表的主键），我们将其作为参数发送给\
    \ `get_category()` 函数，并将返回值赋给 `$category` 变量。同样，我们将 `$category` 作为第三个参数发送给 `get_name()`，并将返回值赋给\
    \ `$name` 变量。\n\n如果会话变量未设置，用户将被送回 `login.php`。\n\n重定向的目的：只有已登录用户才能访问此页面！\n\n因此，包含\
    \ `check.php` 文件的任何页面都将有三个可用变量：\n\n*   `$usersession` - 邮箱 ID / 主键\n*   `$category`\
    \ - 讲师 / 学习者\n*   `$name` - 用户全名\n\n我们要设计仪表盘了吗？\n\n***\n\n**讲师仪表盘：**\n\n我们将从讲师开始。\n\
    \n讲师需要哪些菜单？\n\n*   课程 - 创建课程 / 编辑课程 / 上传内容 / 查看学习者进度报告\n*   个人资料 - 修改密码 / 修改个人资料\n\
    *   登出 - 退出仪表盘\n\n**学习者仪表盘：**\n\n我们现在来看学习者。\n\n学习者需要哪些菜单？\n\n*   报名 - 已报名课程列表\
    \ / 访问课程\n*   个人资料 - 修改密码 / 修改个人资料\n*   登出 - 退出仪表盘\n\n从上述两个列表中，我们可以理解，我们必须为个人资料修改设计一个单独的页面。登出将只是一个指向\
    \ `logout.php` 的链接。个人资料设计将在下一节处理。\n\n我们现在将设计仪表盘。我们需要修改上一节中临时提供的代码片段。\n\n将顶部 PHP\
    \ 代码段替换为：\n\n```php\n<?php\ninclude ('check.php');\n?>\n<!DOCTYPE html>\n...\n\
    </html>\n```\n\n同样，对于 main 标签内容，只保留那一行并删除其余代码，如下所示：\n\n```html\n<main>\n<section>\n\
    <h3> User Dashboard </h3>\n<p>\n<?php \necho \"<p>Hello \".$usersession.\"</p>\"\
    ;\n?>\n</p>\n</section>\n</main>\n```\n\n以学习者/讲师身份登录，检查是否收到 Hello <email> 消息。如果像上一节那样正确获取，你的代码到目前为止很完美！\n\
    \n我们将首先对 head 元素进行必要的修改：\n\n希望你知道在哪里引入 style 标签。在 `</head>` 之前引入 style 标签代码：\n\
    \n```css\n<style>\n.cl{\n margin: 5px;\n display: inline-block;\n vertical-align:\
    \ top;\n width: 300px;\n height: 100px;\n border: 1px solid #ccc;\n}\n</style>\n\
    ```\n\n此内容与我们用于列出课程的内容相同。\n\n将 main 标签内容替换为：\n\n```php\n<main>\n<section>\n<?php\
    \ \necho \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='logout.php'>Logout</a></p>\"\
    ;\necho \"<div class='cl'>\";\nif($category == 'instructor'){\n echo \"<h3><a\
    \ href='clist.php'>Courses<a/></h3>\";\n echo \"<p>Manage Courses, Content and\
    \ Reports</p>\";\n}\nif($category == 'learner'){\n echo \"<h3><a href='elist.php'>Enrolments<a/></h3>\"\
    ;\n echo \"<p>Enrolled Courses and Content Access</p>\";\n}\necho \"</div>\";\n\
    echo \"<div class='cl'>\";\necho \"<h3><a href='profile.php'>Profile<a/></h3>\"\
    ;\necho \"<p>Change password and Profile</p>\";\necho \"</div>\";\n?>\n</section>\n\
    </main>\n```\n\n对于讲师，我们添加了课程链接。对于学习者，我们添加了报名链接。我们将个人资料链接到两类用户的同一页面。登出链接位于用户名下方。\n\
    \n以学习者身份登录，\n\n![8-2-1](img/image00344.jpeg)\n\n以学习者身份登出并以讲师身份登录，\n\n![8-2-2](img/image00345.jpeg)\n\
    \n希望你理解了接下来的工作！那将是 `clist.php`、`elist.php` 和 `profile.php`。我们将从 `profile.php`\
    \ 开始。\n\n***\n\n### 8.3 修改个人资料\n\n***\n\n我们首先列出本章要完成的任务：\n\n*   设计相关表单\n    *\
    \   提供两种修改 - 一种用于密码，一种用于个人资料\n    *   禁止修改邮箱地址！\n*   添加适当的 PHP 代码片段以完成任务\n\n"
