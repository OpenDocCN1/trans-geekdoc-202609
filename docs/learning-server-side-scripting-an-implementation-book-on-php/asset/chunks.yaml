    \ method for learning purpose.\n\nBasically to work with a database, you need\
    \ to establish connection. So, the first thing we will learn here is to establish\
    \ a connection.\n\n**Syntax:**\n\n```\nmysqli_connect($servername, $username,\
    \ $password, $database);\n```\n\n*   $servername is the name of the host\n\n*\
    \   $username - username to connect to the database\n\n*   $password - password\
    \ to connect to the database\n\n*   $database - the name of the database to be\
    \ connected\n\nLet us see whether we have values for those parameters:\n\n*  \
    \ $servername is the hostname. Currently we are running the application from the\
