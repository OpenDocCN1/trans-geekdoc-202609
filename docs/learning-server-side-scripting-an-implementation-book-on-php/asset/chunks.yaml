    \n* * *\n\n### 5.3 Filters\n\n* * *\n\nFilters are used to validate and sanitize\
    \ user’s input. Validating data is determining if the data is in the proper form.\
    \ Sanitizing data is removing any illegal character from the data.\n\nWe have\
    \ already discussed on validation of user input when working with forms.\n\nThe\
    \ PHP filter extension has many of the functions needed for checking user input\
    \ and is designed to make data validation easier and quicker.\n\n**Why do we need\
    \ filters?**\n\nMany web applications receive external input. External input/data\
    \ can be:\n\n*   User input from a form\n\n*   Cookies\n\n*   Server variables\n\
    \n*   Database query results\n\n*   Web services data\n\nIt is recommended to\
    \ always validate external data! Invalid submitted data can lead to security problems\
    \ and break your webpage! By making the best use of PHP filters, you can be sure\
    \ that your application gets the correct input!\n\nThere are filters for validating\
    \ and sanitizing data. We will have a look at the list!\n\n**Validating Filters:**\n\
    \n![5-3-1-validatingfilter](Images/image00257.jpeg)\n\n**Sanitizing Filters:**\n\
    \n![5-3-2sanitizingfilter](Images/image00258.jpeg)\n\n**Reference:** [https://www.php.net/manual/en/filter.filters.php](https://www.php.net/manual/en/filter.filters.php)\n\
    \n**Where are we going to use these filters?**\n\nIf you can remember validation\
    \ of email address in forms, we used a function called filter\\_var() with 2 parameters.\
    \ These filter IDs will be used inside that function. We will now discuss the\
    \ filter\\_var() function with adequate examples.\n\n**filter\\_var() function:**\n\
    \nThe filter\\_var() function is used to validate and sanitize data. It filters\
    \ a single variable with a specified filter. It takes two pieces of data: the\
    \ variable you want to check, the type of check to use on the variable (filter\
    \ ID)\n\nWe will look at few ID's from the above list:\n\n*   Sanitizing a string\
    \ -  It removes all HTML tags from a string\n\n*   Validating an integer - It\
    \ checks whether the variable is an integer (0 is not a part of integer, so it\
    \ may return false, we will look into a solution during practice session)\n\n\
    *   Validating an IP address - It checks if the variable is a valid IP address\n\
    \n*   Sanitizing and Validating a URL - It will sanitize the URL and then validate\
    \ it\n\n**Practice:**\n\nCreate a new page called filter.php (or any filename\
    \ as you wish). Code this in a new page!\n\n```\n<?php\n$str = \"<h3>Hello World!</h3>\"\
    ;\n$int = 0;\n$float = 100.09;\n$ip = \"127.0.0.1\";\n$url1 = \"www.google.com\"\
    ;\n$url2 = \"https://www.google.com\";\n\necho \"<p>Before Sanitizing and Validating:\
    \ </p>\";\necho \"<p> str = \".$str.\"</p>\";\necho \"<p> int = \".$int.\"</p>\"\
    ;\necho \"<p> float = \".$float.\"</p>\";\necho \"<p> ip = \".$ip.\"</p>\";\n\
    echo \"<p> url1 = \".$url1.\"</p>\";\necho \"<p> url2 = \".$url2.\"</p>\";\n\n\
    echo \"<p>Applying Sanitizing and Validating Filters: </p>\";\n$str = filter_var($str,FILTER_SANITIZE_STRING);\n\
    echo \"<p> str = \". $str . \"</p>\";\nif(filter_var($int, FILTER_VALIDATE_INT)\
    \ === 0){\n  echo \"<p> int = \".filter_var($int, FILTER_VALIDATE_INT).\"</p>\"\
    ;\n}\nif(!filter_var($float, FILTER_VALIDATE_INT)){\n  echo \"<p>float is not\
    \ an integer</p>\";\n}\nif(filter_var($ip, FILTER_VALIDATE_IP)){\n  echo \"<p>ip\
    \ - Valid IP address</p>\";\n}\n$url1 = filter_var($url1,FILTER_SANITIZE_URL);\n\
    echo \"<p> url after sanitizing = \".$url1.\"</p>\";\n$url1 = filter_var($url1,FILTER_VALIDATE_URL);\n\
    echo \"<p> url after validating = \".$url1.\"</p>\";\n$url2 = filter_var($url2,FILTER_SANITIZE_URL);\n\
    echo \"<p> url after sanitizing = \".$url2.\"</p>\";\n$url2 = filter_var($url2,FILTER_VALIDATE_URL);\n\
    echo \"<p> url after validating = \".$url2.\"</p>\";\n?>\n```\n\nOn execution,\
    \ we get the output as:\n\n![5-3-1](Images/image00259.jpeg)\n\n*   When we print\
    \ $str with html tag, html is applied on printing. When we sanitize the string,\
    \ it removes the html tag and prints the string alone.\n\n*   When we check integer\
    \ for value 0, we ought to do with if condition. Similarly, we use same filter\
    \ to validate integer with float input\n\n*   $url1 and $url2 are the same URLs\
    \ for users. But only $url2 is validated and gets printed. Though we don't sanitize\
    \ the urls here, we can see the difference for validation done on $url1 and $url2\n\
    \nWe will look on to a validation example of integer within some range.\n\n```\n\
    <?php\n$int1 = 50;\n$int2 = 150;\necho \"<p> int1 = \".$int1.\" int2 = \".$int2.\"\
    </p>\";\n\nif (filter_var($int1, FILTER_VALIDATE_INT, array(\"options\" => array(\"\
    min_range\"=>1, \"max_range\"=>100))) ) {\n   echo \"<p>int1 value is within 1-100</p>\"\
    ;\n} \nelse {\n   echo \"<p>int1 value is not within 1-100</p>\";\n}\n\nif (filter_var($int2,\
    \ FILTER_VALIDATE_INT, array(\"options\" => array(\"min_range\"=>1, \"max_range\"\
    =>100))) ) {\n   echo \"<p>int2 value is within 1-100</p>\";\n} \nelse {\n   echo\
    \ \"<p>int2 value is not within 1-100</p>\";\n}\n?>\n```\n\n![5-3-2](Images/image00260.jpeg)\n\
    \nSimilarly, we should make use of these filters to sanitize and validate user\
    \ data.\n\n* * *\n\n### 5.4 Handling JSON Data\n\n* * *\n\nJSON stands for JavaScript\
    \ Object Notation. It is a syntax used for storing and exchanging data.\n\nSince\
    \ the JSON format is a text-based format, it can easily be sent to and from a\
    \ server, and used as a data format by any programming language.\n\nSo, we will\
    \ learn how to handle JSON data using PHP in this section.\n\nWe have 2 built-in\
    \ functions to handle JSON.\n\n*   json\\_encode() - to encode a value to JSON\
    \ format\n\n*   json\\_decode() - to decode a JSON object into a PHP object or\
    \ an associative array.\n\nSince many of you would be new to JSON, we will do\
    \ this:\n\n*   Practise an example to convert an associative array to JSON format\n\
    \n*   Use the output JSON data and decode back to array\n\n**Practice:**\n\n**Convert\
    \ Array to JSON:**\n\n```\n<?php\n$array = array(\"Test1\" => 75, \"Test2\" =>\
    \ 80, \"Test3\" => 60);\necho \"Array: \";\nvar_dump($array);\necho \"<p>JSON\
    \ format: </p>\";\necho json_encode($array);\n?>\n```\n\n![5-4-1](Images/image00261.jpeg)\n\
    \n**Convert JSON to Array:**\n\n```\n<?php\n$json = '{\"Test1\":75,\"Test2\":80,\"\
    Test3\":60}';\necho \"<p> JSON format: \".$json.\"</p>\";\necho \"<p>JSON Decode:\
    \ </p>\";\nvar_dump(json_decode($json));\necho \"<p>JSON Decode To Array: </p>\"\
    ;\nvar_dump(json_decode($json,true));\n?>\n```"
