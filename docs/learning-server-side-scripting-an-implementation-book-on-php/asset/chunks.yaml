- raw: "**Default value of parameter:**\n\nYou can also specify the default value\
    \ of a parameter.\n\nWhen no arguments are passed through the function, the default\
    \ value is taken up. If argument is passed, passed value will be used.\n\nLet\
    \ us see the working below:\n\n```\ndeclare(strict_types=1);\nfunction print_message_string(int\
    \ $str = 10){\n echo \"<br>\".$str;\n}\nprint_message_string();\nprint_message_string(50);\n\
    ```\n\n![2-6-3](Images/image00176.jpeg)\n\nWhen no arguments are passed, 10 is\
    \ printed. When 50 is passed, 50 gets printed.\n\n**Returning Values:**\n\nA function\
    \ can also return a value at the end of its execution. We need to use the return\
    \ statement.\n\nPHP 7 also supports Type Declarations for the **return** statement.\
    \ Similar to the type declaration for function arguments, by enabling the strict\
    \ requirement, it will throw a \"Fatal Error\" on a type mismatch.\n\nTo declare\
    \ a type for the function return, add a colon ( : ) and the type right before\
    \ the opening curly ( { )bracket when declaring the function.\n\nWe will look\
    \ at an example set!\n\n```\ndeclare(strict_types=1);\nfunction sum_number(float\
    \ $a, float $b){\n return ($a + $b);\n}\nfunction sum_number2(float $a, float\
    \ $b) : float{\n return ($a + $b);\n}\nfunction sum_number3(float $a, float $b)\
    \ : int{\n return ($a + $b);\n}\necho \"<br> Return value = \".sum_number(5,10);\n\
    echo \"<br> Return strict value = \".sum_number2(5,10);\n```\n\nWe will perform\
    \ calls only to two functions:\n\n![2-6-4](Images/image00177.jpeg)\n\nNow, call\
    \ the third function:\n\n```\necho sum_number3(5,10);\n```\n\n![2-6-5](Images/image00178.jpeg)\n\
    \nA fatal error will be thrown because adding two floats should result in a float,\
    \ not an integer. No matter, how you pass your parameters, return type must match!\n\
    \n**Passing Arguments by Reference:**\n\nIn PHP, arguments are usually passed\
    \ by value, which means that a copy of the value is used in the function and the\
    \ variable that was passed into the function cannot be changed.\n\nWhen a function\
    \ argument is passed by reference, changes to the argument would also change the\
    \ value of the variable that was passed in. To turn a function argument into a\
    \ reference, the & operator is used.\n\nLet us see the difference through an example:\n\
    \n```\nfunction sum_number($a, $b){\n $a = $a + $b;\n return $a;\n}\nfunction\
    \ sum_number_ref(&$a, $b){\n $a = $a + $b;\n return $a;\n}\n\n$a = 5;\n$b = 10;\n\
    echo \"<br>Passing by Value: <br>\";\necho \"<br>Before Sum: $a = \".$a.\" $b\
    \ = \".$b. \" Sum = \".sum_number($a,$b);\necho \"<br> After Sum:  $a = \".$a.\"\
    \ $b = \".$b;\necho \"<br><br>Passing by Reference: <br>\";\necho \"<br>Before\
    \ Sum: $a = \".$a.\" $b = \".$b. \" Sum = \".sum_number_ref($a,$b);\necho \"<br>\
    \ After Sum:  $a = \".$a.\" $b = \".$b;\n```\n\n![2-6-6](Images/image00179.jpeg)\n\
    \nIn the second function sum\\_number\\_ref(), the argument $a is passed by reference,\
    \ denoted by &$a. It means, once the $a gets updated, it retains the value even\
    \ after it comes out of the function.  \n\nWhereas, when the parameter is passed\
    \ just as value, as in function sum\\_number(), whatever calculations happen,\
    \ it belongs and stays only inside the function!\n\n* * *\n\n### 2.7 User-defined\
    \ Functions - II\n\n* * *\n\nThis will be the right context to discuss about variable\
    \ scopes. Let me remind you the scopes:\n\n**Global** - A variable declared outside\
    \ a function has a GLOBAL SCOPE and can only be accessed outside a function.\n\
    \n**Local** - A variable declared within a function has a LOCAL SCOPE and can\
    \ only be accessed within that function.\n\n**Static** - A local variable that\
    \ is not deleted even after the execution of the function.\n\nLet us see an example!\n\
    \nConsider the coding segment:\n\n```\n$x = 10;\nfunction print_x(){\n echo \"\
    <br>Printing from function - \".$x;\n}\nprint_x();\necho \"<br>Printing outside\
    \ function - \".$x;\n```\n\nHere, variable $x is defined globally. So, it is accessible\
    \ outside the function.\n\n![2-7-1](Images/image00180.jpeg)\n\n**Global**\n\n\
    The global keyword is used to access a global variable from within a function.\n\
    \nPHP also stores all global variables in an array called $GLOBALS\\[index\\].\
    \ The index holds the name of the variable. This array is also accessible from\
    \ within functions and can be used to update global variables directly.\n\n**Local**\n\
    \nYou can have local variables with the same name in different functions, because\
    \ local variables are only recognized by the function in which they are declared.\n\
    \n**Static**\n\nNormally, when a function is completed/executed, all of its variables\
    \ are deleted. However, sometimes we want a local variable NOT to be deleted.\
    \ We need it for a further job.\n\nThen, each time the function is called, that\
    \ variable will still have the information it contained from the last time the\
    \ function was called. But the variable is still local to the function.\n\nNow,\
    \ we will look onto an example with all the three scopes!\n\n**Practice:**\n\n\
    ```\n//Scopes of variables - global, local, static\n$x = 5;\n$y = 10;\n\nfunction\
    \ add_num(){\n  global $x, $y;\n  $z = $x + $y;\n  return $z;\n}\n\nfunction add_static(){\n\
    \  static $m;\n  $m = $m + ($GLOBALS['x'] + $GLOBALS['y']);\n  return $m;\n}\n\
    \necho \"<br> Sum using global x,y = \".add_num();\necho \"<br> Sum using global\
    \ index = \".add_nums();\necho \"<br> Accessing local variable z: \".$z;\necho\
    \ \"<br> Addition 1 - \".add_static();\necho \"<br> Addition 2 - \".add_static();\n\
    echo \"<br> Addition 3 - \".add_static();\n```\n\n**Execute:**\n\nWe have tried\
    \ accessing global variables using global keyword and $GLOBALS\\[index\\]. At\
    \ the same time, when the local variable $z is accessed outside the function,\
    \ a notice is issued by PHP.\n\nIf we consider static variable $m, the value of\
    \ $m is retained and then added again when the function in called. We have called\
    \ the function thrice!\n\n*   Initial call will set $m = 0 and assigns 15.\n\n\
    *   Second call will hold the previous value 15 and add it to $m (which holds\
    \ 15) making it to 30.\n\n*   Third call will add 15 to $m which is already 30\
    \ making it to 45.\n\nLet me work it out:\n\nFirst Call:\n\n$m = 0;\n\n$m = 0\
    \ + (5+10) = 15\n\nSecond Call:\n\n$m = 15;\n\n$m = 15 + (5 + 10) = 30\n\nThird\
    \ Call:\n\n$m = 30;\n\n$m = 30 + (5 + 10) = 45;\n\n![2-7-2](Images/image00181.jpeg)\n\
    \n**Callback Functions:**\n\nA callback function is a function which is passed\
    \ as an argument into another function.\n\nAny existing function can be used as\
    \ a callback function. To use a function as a callback function, pass a string\
    \ containing the name of the function as the argument of another function.\n\n\
    Starting with version 7, PHP can pass anonymous functions as callback functions.\
    \ Anonymous functions are functions that are not previously declared or defined!\n\
    \nConsider the coding segment:\n\n```\n//Callbacks\nfunction get_size($str){\n\
    \ return strlen($str);\n}\n$str_array = [\"PHP\",\"Server-side\",\"Scripting\"\
    ];\n$str_size = array_map(\"get_size\",$str_array);\nprint_r($str_size);\n\n//anonymous\
    \ function\n$str_size2 = array_map(function($str) { return strlen($str); },$str_array);\n\
    echo \"<p>Using anonymous function</p>\";\nprint_r($str_size);\n```\n\nThe functions'\
    \ purpose are the same, but the way of using them has been illustrated.\n\n![](Images/image00182.jpeg)\n\
    \n**How to use callbacks in user-defined functions?**\n\nUser-defined functions\
    \ and methods can also take callback functions as arguments. To use callback functions\
    \ inside a user-defined function or method, call it by adding parentheses to the\
    \ variable and pass arguments as normal functions.\n\nLet us understand this using\
    \ an example!\n\n```\n//Callbacks\n\nfunction purpose($str){\n return $str.\"\
    is used to design web pages!<br>\";\n}\nfunction explain($str){\n return $str.\"\
    is a server-side scripting language!<br>\";\n}\nfunction what_is_php($str,$callfunction){\n\
    \ echo $callfunction($str);\n}\n\nwhat_is_php(\"PHP \", \"explain\");\nwhat_is_php(\"\
    PHP \",\"purpose\");\n```\n\nLet me explain the example first!\n\nWe have defined\
    \ two functions - purpose and explain to display some messages. We have defined\
    \ the third function what\\_is\\_php to send any of the above 2 functions as its\
    \ parameter.\n\npurpose($str) => $str is the parameter\n\nexplain($str) => $str\
    \ is the parameter"
