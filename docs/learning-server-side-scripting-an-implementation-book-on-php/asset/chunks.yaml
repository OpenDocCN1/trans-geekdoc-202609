    \nCheck the courses.php page.\n\n![8-5-1](Images/image00350.jpeg)\n\n**Enrolling\
    \ code: courses.php**\n\nAdd the following code snippet to the beginning of the\
    \ file:\n\n```\n<?php\nsession_start();\nrequire('connect.php');\nif(isset($_POST['enroll'])){\n\
    \  if(isset($_SESSION['usersession'])){\n  $usersession = $_SESSION['usersession'];\n\
