  fmt: "\n请勿立即检查运行情况！我们没有名为 `elist.php` 的文件，这将导致 404 文件未找到错误。\n\n我们将创建一个包含注册列表的文件，然后执行注册流程。此页面或多或少将类似于\
    \ `clist.php`。\n\n### 列出注册信息\n\n使用“另存为”选项创建 `elist.php`。将 `title` 标签内容更改为 Enrollments。\n\
    \n在文件开头包含以下代码：\n\n```php\n<?php\ninclude ('check.php');\nif($category == 'instructor'){\n\
    \  header('logout.php');\n}\n?>\n```\n\n此处，我们检查讲师是否误通过 URL 进入此页面，并重定向到 `logout.php`\
    \ 页面。只有学习者可以访问此页面。\n\n替换 `main` 标签内容为：\n\n```php\n<main>\n<section>\n<?php \n\
    echo \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='logout.php'>Logout<a/></p>\"\
    ;\n$fetch_enrolls = mysqli_query($con,\"SELECT * FROM enroll WHERE learn_mail\
    \ = '$usersession'\");\nif(mysqli_num_rows($fetch_enrolls) == 0){\n echo \"No\
    \ enrollments so far!\";\n}\nelse{\n echo \"<table style='margin: 0 5%;text-align:left;'>\"\
    ;\n echo \"<tr>\";\n echo \"<th style='width:30%;'> Course Title </th>\";\n echo\
    \ \"<th style='width:15%;'> Start Date </th>\";\n echo \"<th style='width:15%;'>\
    \ Completion Date </th>\";\n echo \"<th style='width:15%;'> Access Content </th>\"\
    ;\n echo \"<th style='width:15%;'> Progress </th>\";\n  echo \"</tr>\";\n} \n\
    while($fetched = mysqli_fetch_row($fetch_enrolls)){\n echo \"<tr>\";\n $get_coursetitle\
    \ = mysqli_query($con,\"SELECT * FROM courses WHERE course_code = $fetched[0]\"\
    );\n $coursetitle = mysqli_fetch_array($get_coursetitle);\n  echo \"<td>\".$coursetitle['course_title'].\"\
    </td>\";\n echo \"<td>\".$fetched[3].\"</td>\";\n if($fetched[4] == NULL){\n \
    \  echo \"<td>Not completed</td>\";\n }\n else{\n   echo \"<td>\".$fetched[4].\"\
    </td>\";\n }\n echo \"<td>\";\n echo \"<form method='post' action='contents.php'><input\
    \ type='hidden' name='txtcourse' value='$fetched[2]'>\";\n echo \"<input type='submit'\
    \ name='access' value='View' class='frmbtn'></form>\";\n  echo \"</td>\"; \n echo\
    \ \"<td><progress id='progress' value='\".get_progress($con,$fetched[0]).\"' max='100'></progress>\
    \ \".get_progress($con,$fetched[0]).\"%</td>\";\n echo \"</tr>\";\n}\necho \"\
    </table>\";\n?>\n</section>\n</main>\n```\n\n*   我们在显示检索字段时进行了一项检查。\n\n    我们检查\
    \ `$fetched[4] = NULL`（即完成日期为 NULL）。\n\n    如果为 null，意味着课程正在进行中，因此显示“not completed”消息。\n\
    \n    如果不为 null，则显示课程完成日期。\n\n*   我们通过表单的 POST 方法提供内容访问权限。只要课程是免费的，这不是问题。但涉及付费课程学习时，这会成为一个问题。所以，为了安全起见，我们使用\
    \ POST 方法表单。\n\n*   我们还在表单中提供了 `action` 属性。因此，`contents.php` 将处理通过此表单提交的值。\n\n\
    现在，让我以学习者身份登录，然后注册其中一门课程。\n\n*这是一个 GIF 图像。请确保您的设备支持 GIF。*\n\n![1604666907-enroll-course](Images/image00351.gif)\n\
    \n下一项工作是查看课程内容！\n\n---\n\n### 访问课程内容\n\n我们必须设计一个页面来查看课程内容——即讲师上传的文件。\n\n*   我们将使用下拉选择框显示内容标题。根据标题选择，将显示相应的内容文件。\n\
    \n*   由于我们有不同的文件类型，我们将使用 `iframe` 标签来显示它们。\n\n首先，使用“另存为”并将文件命名为 **contents.php**。\n\
    \n没有特定的设计要求。所以，像往常一样，让我们从页面开头要放置的 PHP 片段开始。\n\n```php\n<?php\ninclude ('check.php');\n\
    $course = 0;\n$contents = 0;\nif(isset($_POST['access'])){\n  $course = $_POST['txtcourse'];\n\
    }\n?>\n```\n\n我们还有一些内容要添加。我们将在完成 `main` 标签片段后添加。`$course` 将在整个学习过程中保存课程代码。`$contents`\
    \ 将保存要显示的内容 ID。\n\n替换 `main` 标签内容为：\n\n```php\n<main>\n<section>\n<?php \necho\
    \ \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='elist.php'>Back to Enrollments</a></p>\"\
    ;\necho \"<p>\";\necho \"<form method='post'>\";\necho \"<input type='hidden'\
    \ name='txtcourse' value='$course'>\";\necho \"<select name='txtcontent'>\";\n\
    echo \"<option value='999'>Choose the content title</option>\";\n$fetch_contents\
    \ = mysqli_query($con,\"SELECT * FROM contents WHERE course_code = $course\");\n\
    while($fetched = mysqli_fetch_row($fetch_contents)){\n echo \"<option value='$fetched[0]'>\"\
    .$fetched[1].\"</option>\";\n}\necho \"</select>\";\necho \"<input type='submit'\
    \ name='getcontent' value='Go' class='frmbtn'>\";\necho \"</form>\";\necho \"\
    </p>\";\n?>\n</section>\n</main>\n```\n\n如果未选择内容标题，我们将提交表单，其中“Choose the content\
    \ title”选项的值为 999。我们将在后面部分使用这一点。\n\n转到 `elist.php` 并点击 View（课程名称 1 的 View 链接）\n\
    \n![8-5-2](Images/image00352.jpeg)\n\n您可以在下拉列表中找到课程的内容标题。根据此选择，我们将在 `iframe` 标签中显示内容。\n\
    \n在文件开头添加几行代码：\n\n```php\n<?php\ninclude ('check.php');\n$course = 0;\n$contents\
    \ = 0;\nif(isset($_POST['access'])){\n  $course = $_POST['txtcourse'];\n}\nif(isset($_POST['getcontent'])){\n\
    \  $course = $_POST['txtcourse'];\n  $contents = $_POST['txtcontent'];\n}\n?>\n\
    ```\n\n我们在表单提交时将课程代码赋值给 `$course`，将内容 ID 赋值给 `$contents` 变量。\n\n我们将在表单下方显示内容文件。我们将向\
    \ `main` 标签元素添加另一个 `section` 元素。已经有一个 `section` 元素。将其放置在 `</section>` 和 `</main>`\
    \ 之间：\n\n```php\n<section>\n<?php\nif(($contents == 999) || ($contents == 0)){\n\
    \ echo \"Please choose a content title!\";\n}\nelse{\n $fetch_content = mysqli_query($con,\"\
    SELECT * FROM contents WHERE content_id = $contents\");\n if($fetch = mysqli_fetch_row($fetch_content)){\n\
    \   echo \"<h4>\".$fetch[1].\"</h4>\";\n   $filestring = explode('.',$fetch[3]);\n\
    \   $file_ext= strtolower(end($filestring));\n   $exts = array('doc','docx','ppt','pptx');\n\
    \   if(in_array($file_ext,$exts)){\n     echo \"<p>The content will be downloaded!</p>\"\
    ;\n   }\n   echo \"<p><iframe src='$fetch[3]' height='auto' width='80%' height='500px'\
    \ frameborder='0'></iframe></p>\";\n  }\n}\n?>\n</section>\n```\n\n此处，我们检查 `$contents`\
    \ 值是否等于 0 或 999，然后显示“Please choose a content title!”消息。这意味着，每当未选择内容标题时，将显示此消息。\n\
    \n像往常一样，我们查找文件的扩展名，如果它是 doc、docx、ppt、pptx 之一，则无法在 HTML 文件中显示。因此，我们打印一条消息，提示文件将被下载，当\
    \ `iframe` 标签加载时下载将开始。如果文件扩展名是 pdf、mp4、txt、rtf 之一，则通过 `iframe` 标签显示。\n\n尝试选择一个内容，查看相应文件是显示还是下载。\n\
    \n现在，还有一项待办任务！\n\n### 记录学习者进度\n\n此进度也将在同一页面中记录。\n\n我们需要在 `iframe` 标签下方包含插入记录表的代码：\n\
    \n替换上面的 if 代码块：\n"
