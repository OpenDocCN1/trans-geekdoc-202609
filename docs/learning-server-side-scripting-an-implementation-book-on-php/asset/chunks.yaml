- raw: "We will start with form design! As usual use save as option or create new\
    \ file and paste contents. The file name is profile.php\n\n**Form design: profile.php**\n\
    \nIn the beginning of the file, do not forget to include the line below:\n\n```\n\
    <?php\ninclude ('check.php');\n?>\n```\n\nThis time in design, we will include\
    \ some php code for the purpose of displaying details from the database.\n\nReplace\
    \ main tag content as:\n\n```\n<main>\n<section>\n<?php \necho \"<h3>Hello \"\
    .$name.\"</h3>\";\necho \"<p><a href='dashboard.php'>Dashboard</a>&emsp;<a href='logout.php'>Logout</a></p>\"\
    ;\n$str = '';\n$details = '';\nif($category == 'instructor'){\n $str = \"SELECT\
    \ * FROM instructors WHERE instruct_mail = '$usersession'\";\n}\nif($category\
    \ == 'learner'){\n $str = \"SELECT * FROM learners WHERE learn_mail = '$usersession'\"\
    ;\n}\n$fetch_details = mysqli_query($con,$str);\nif($fetch = mysqli_fetch_row($fetch_details)){\n\
    \  $details = $fetch[2];\n}\n?>\n<form method=\"post\" name=\"frmpwd\">\n<p><input\
    \ type=\"password\" name=\"txtoldpwd\" size=\"40\" placeholder=\"Enter your old\
    \ Password\" required></p>\n<p><input type=\"password\" name=\"txtnewpwd\" size=\"\
    40\" placeholder=\"Enter your new Password 8-15 characters\" required></p>\n<p><input\
    \ type=\"submit\" name=\"changepwd\" value=\"Change Password\" class=\"frmbtn\"\
    ></p>\n</form>\n<p><hr></p>\n<form method=\"post\" name=\"frmprofile\">\n<p><input\
    \ type=\"text\" name=\"txtname\" size=\"40\" value=\"<?php echo $name; ?>\" required></p>\n\
    <p><textarea name=\"txtdetails\" cols=\"40\" required><?php echo $details; ?></textarea></p>\n\
    <p><input type=\"submit\" name=\"changeprofile\" value=\"Update Profile\" class=\"\
    frmbtn\"></p>\n</form>\n</section>\n</main>\n```\n\nWe are selecting the table\
    \ using the category of users. Based on the selection, details are retrieved from\
    \ the appropriate tables. Since we have same set of fields in both instructors\
    \ and learners table, we use $details\\[2\\] element to get the details.\n\nYou\
    \ can execute the profile page and look at the design:\n\n![8-3-1](Images/image00346.jpeg)\n\
    \nAs per design code, we are performing two updates - one to change password and\
    \ the other to change profile details. We have to include two if(isset()) for\
    \ two submissions.\n\n**Updating profile: profile.php**\n\n1\\. Add this snippet\
    \ to the beginning of php file: for changing password\n\n```\n<?php\ninclude ('check.php');\n\
    if(isset($_POST['changepwd'])){\n  $oldpassword = $_POST['txtoldpwd'];\n  $newpassword\
    \ = $_POST['txtnewpwd'];\n  $get_password = mysqli_query($con,\"SELECT * FROM\
    \ userlogin WHERE user_mail = '$usersession'\");\n  $pwd = mysqli_fetch_array($get_password);\n\
    \  //verifying if old password = new password\n  if(password_verify($oldpassword,$pwd['user_pwd'])){\
    \ \n \n    if((strlen($newpassword) > 7) and (strlen($newpassword) < 21)){\n \
    \     $hashed = password_hash($newpassword,PASSWORD_DEFAULT);\n      $updatepwd\
    \ = \"UPDATE userlogin SET user_pwd = '$hashed' WHERE user_mail = '$usersession'\"\
    ;     \n      if(mysqli_query($con,$updatepwd)){\n         echo \"<script>alert('Password\
    \ changed! Login with new password!');\n         window.location.replace('logout.php');</script>\"\
    ;\n      }\n    }\n    else{\n      echo \"<script>alert('Password length must\
    \ be between 8-15 characters!');</script>\";\n    } \n\n  }\n  else{\n    echo\
    \ \"<script>alert('Old password is wrong!');</script>\";\n  }\n}\n?>\n```\n\n\
    The exact work starts from checking old password using password\\_verify() function.\n\
    \n*   We have retrieved the hashed password from the table and accessed via $pwd\\\
    [‘user\\_pwd’\\]\n\n*   We use password\\_verify() to compare $pwd\\['user\\_pwd'\\\
    ] and $oldpassword entered in the form\n\n*   If the passwords do not match, we\
    \ print old password is wrong.\n\n*   If the passwords match, we make other check\
    \ for the length of the password. \n\n    *   If the length of the new password\
    \ is between 8 and 15 characters, the hash value of new password is updated and\
    \ message is displayed to the user\n\n    *   If the length does not match, we\
    \ print a message asking the user to provide password in between 8 and 15 character\
    \ length.\n\n2\\. Append the following profile change submission code to the previous\
    \ php segment:\n\n```\nif(isset($_POST['changeprofile'])){\n $newname = $_POST['txtname'];\n\
    \ $newdetails = $_POST['txtdetails'];\n if($category == 'instructor'){\n   $updateprofile1\
    \ = \"UPDATE instructors SET instruct_name = '$newname' WHERE instruct_mail =\
    \ '$usersession'\";\n   $updateprofile2 = \"UPDATE instructors SET instruct_details\
    \ = '$newdetails' WHERE instruct_mail = '$usersession'\";\n }\n if($category ==\
    \ 'learner'){\n   $updateprofile1 = \"UPDATE learners SET learn_name = '$newname'\
    \ WHERE learn_mail = '$usersession'\";\n   $updateprofile2 = \"UPDATE learners\
    \ SET learn_details = '$newdetails' WHERE learn_mail = '$usersession'\";\n }\n\
    \ if(mysqli_query($con,$updateprofile1) and mysqli_query($con,$updateprofile2)){\n\
    \   echo \"<script>alert('Profile Updated!');</script>\";\n }\n}\n```\n\nThis\
    \ time, we have just updated both the fields irrespective of where the change\
    \ is made. It is just to show you that either way is correct. It all depends on\
    \ the developer.\n\nHope the update process is clear.\n\nExecute [http://localhost/onlinecourse](#part0052.xhtml)\n\
    \nLogin as instructor / learner and update profile.\n\n*This is a GIF image. Make\
    \ sure GIF is supported in your device.*\n\n![1604664382-change-profile](Images/image00347.gif)\n\
    \nIn the next section, we will work on the instructor's dashboard.\n\n* * *\n\n\
    ### 8.4 Manage Courses and Contents\n\n* * *\n\nNow, we are into the core part\
    \ of Instructor category!\n\nAn instructor should be able to:\n\n*   create new\
    \ course\n\n*   view existing courses\n\n*   edit course details\n\n*   upload\
    \ content to course\n\n*   view learners enrolled and their progress\n\nWe have\
    \ pages for new course, edit course and upload content. For this page which we\
    \ designed in dashboard section, the file name is **clist.php**\n\nEither use\
    \ save as of dashboard.php page or create new file clist.php and copy contents\
    \ from dashboard.php\n\n**What are the contents of this page?**\n\n*   A link\
    \ to create new course\n\n*   Courses already created will be displayed as a table\n\
    \n*   Link to edit course\n\n*   Link to upload content\n\n*   Link to view progress\
    \ of learners\n\nWe will make all pages ready for the instructor. Regarding progress\
    \ page, we will design and make it ready. Once we complete the contents of next\
    \ section, we will execute this progress page's working from there.\n\nShall we\
    \ start?\n\n**Display existing courses:**\n\nWe will display the courses created\
    \ by the instructor - Instructor 1.\n\nHope the page clist.php already included\
    \ check.php file in the beginning of the page. If it is not done, please include\
    \ it as below along with one more line:\n\n```\n<?php include('check.php');\n\
    if($category == 'learner'){\n  header('logout.php');\n}\n?>\n```\n\nWe will also\
    \ add a condition here, in case if a learner has logged in and somehow retrieved\
    \ this page, we can redirect them to logout automatically.\n\nTo test this, login\
    \ as learner and in the url access clist.php, you will be logged out and taken\
    \ to login.php.\n\n**clist.php**"
