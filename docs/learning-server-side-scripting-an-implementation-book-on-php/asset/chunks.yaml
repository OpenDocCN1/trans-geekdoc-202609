    \ Select onlinecourse from the list. You will be taken to:\n\n![7-1-6](Images/image00308.jpeg)\n\
    \n8\\. Check all privileges. Click Go and you will be taken to:\n\n![7-1-7](Images/image00309.jpeg)\n\
    \nA user account (username and password) is created and mapped to onlinecourse\
    \ database. The corresponding SQL syntax is generated on execution of every command.\n\
    \n**Check if privileges are granted:**\n\n*   Click Home icon in the left panel\
    \ -> Go to User Accounts\n\n*   Check whether the Grant field has Yes against\
    \ *ocuser*.\n\n![7-1-8](Images/image00310.jpeg)\n\n*   If Grant field has No,\
    \ just click Edit privileges, check all privileges and then click Go. Come back\
    \ and check here, it should turn Yes.\n\n**Note:** Without Grant turning Yes,\
    \ you cannot establish connection to the database from the application.\n\nNow,\
