  trans: "\n\n# 表单设计：profile.php\n\n我们将从表单设计开始！像往常一样，使用“另存为”选项或创建一个新文件并粘贴内容。文件名为 `profile.php`。\n\
    \n在文件开头，不要忘记包含下面这行代码：\n\n```php\n<?php\ninclude ('check.php');\n?>\n```\n\n这次在设计中，我们将包含一些\
    \ PHP 代码，目的是显示来自数据库的详细信息。\n\n按如下方式替换 `<main>` 标签的内容：\n\n```php\n<main>\n<section>\n\
    <?php \necho \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='dashboard.php'>Dashboard</a>&emsp;<a\
    \ href='logout.php'>Logout</a></p>\";\n$str = '';\n$details = '';\nif($category\
    \ == 'instructor'){\n $str = \"SELECT * FROM instructors WHERE instruct_mail =\
    \ '$usersession'\";\n}\nif($category == 'learner'){\n $str = \"SELECT * FROM learners\
    \ WHERE learn_mail = '$usersession'\";\n}\n$fetch_details = mysqli_query($con,$str);\n\
    if($fetch = mysqli_fetch_row($fetch_details)){\n  $details = $fetch[2];\n}\n?>\n\
    <form method=\"post\" name=\"frmpwd\">\n<p><input type=\"password\" name=\"txtoldpwd\"\
    \ size=\"40\" placeholder=\"Enter your old Password\" required></p>\n<p><input\
    \ type=\"password\" name=\"txtnewpwd\" size=\"40\" placeholder=\"Enter your new\
    \ Password 8-15 characters\" required></p>\n<p><input type=\"submit\" name=\"\
    changepwd\" value=\"Change Password\" class=\"frmbtn\"></p>\n</form>\n<p><hr></p>\n\
    <form method=\"post\" name=\"frmprofile\">\n<p><input type=\"text\" name=\"txtname\"\
    \ size=\"40\" value=\"<?php echo $name; ?>\" required></p>\n<p><textarea name=\"\
    txtdetails\" cols=\"40\" required><?php echo $details; ?></textarea></p>\n<p><input\
    \ type=\"submit\" name=\"changeprofile\" value=\"Update Profile\" class=\"frmbtn\"\
    ></p>\n</form>\n</section>\n</main>\n```\n\n我们根据用户类别选择表。根据选择，从相应的表中检索详细信息。由于 `instructors`\
    \ 和 `learners` 表中具有相同的字段集，我们使用 `$details[2]` 元素来获取详细信息。\n\n您可以执行个人资料页面并查看设计效果：\n\
    \n![8-3-1](img/image00346.jpeg)\n\n根据设计代码，我们执行两次更新：一次用于更改密码，另一次用于更改个人资料详情。我们必须为这两次提交分别包含两个\
