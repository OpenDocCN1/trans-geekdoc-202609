  trans: "\n# 文件处理与超全局变量\n\n## 代码示例：读取文件内容\n\n```php\n$filecontent = fopen(\"test.txt\"\
    ,\"r\");\necho fread($filecontent,filesize(\"test.txt\"));\n```\n\n执行后输出：\n\n\
    ![4-1-6](img/image00224.jpeg)\n\n*   `filesize(file)` 是一个返回文件字节数的函数。\n\n## 读取函数\n\
    \n我们将介绍几个读取函数：\n\n*   读取单行：`fgets()`\n*   读取单字符：`fgetc()`\n*   检查文件结束：`feof()`\n\
    \n### `fgets()` 函数\n\n`fgets()` 函数用于从文件中读取单行。\n\n练习代码：\n\n```php\n$filecontent\
    \ = fopen(\"test.txt\",\"r\");\necho fgets($filecontent);\nfclose($filecontent);\n\
    ```\n\n每当调用一次 `fgets()` 函数，指针就会移动到下一行。由于只有一个 `fgets()` 函数，因此只读取了一行。\n\n![4-1-7](img/image00225.jpeg)\n\
    \n### `fgetc()` 函数\n\n`fgetc()` 函数用于从文件中读取单个字符。\n\n练习代码：\n\n```php\n$filecontent\
    \ = fopen(\"test.txt\",\"r\");\necho fgetc($filecontent);\nfclose($filecontent);\n\
    ```\n\n调用 `fgetc()` 函数后，文件指针移动到下一个字符。由于 `fgetc()` 只被调用一次，因此只读取了一个字符！\n\n![4-1-8](img/image00226.jpeg)\n\
    \n### 如何读取文件直到末尾？\n\n### `feof()` 函数\n\n`feof()` 函数检查是否已到达“文件结束”（EOF）。它对于遍历未知长度的数据非常有用。\n\
    \n练习代码：\n\n```php\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"<p>Printing\
    \ character by character </p>\";\nwhile(!feof($filecontent)){\n    echo fgetc($filecontent);\n\
    }\nfclose($filecontent);\n\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"\
    <p>Printing line by line </p>\";\nwhile(!feof($filecontent)){\n    echo \"<p>\"\
    .fgets($filecontent). \"</p>\";\n}\nfclose($filecontent);\n```\n\n我们在 `fgets()`\
    \ 之后关闭文件并再次打开。为什么？因为第一个 `while` 循环到达文件末尾后，指针无法指回开头。所以我们关闭并再次打开文件以便在 `while` 循环中执行\
    \ `fgetc()`。\n\n执行结果：\n\n![4-1-9](img/image00227.jpeg)\n\n希望你理解为什么要在 `while` 循环中检查\
    \ `feof()`。原因是为了读取所有行（使用 `fgets()`）和所有字符（使用 `fgetc()`），我们在 `while` 中使用 `!feof()`\
    \ 作为条件，指示循环持续到文件结束。\n\n## 注意事项\n\n### 打开不存在的文件会发生什么？\n\n我们来试一下：\n\n```php\n$newfile\
    \ = fopen(\"newtest.txt\",\"r\");\n```\n\n输出是什么？\n\n![4-1-10](img/image00228.jpeg)\n\
    \n有一种方法可以告知用户文件不存在：\n\n```php\n$newfile = fopen(\"newtest.txt\",\"r\") or die(\"\
    Unable to open file!\");\n```\n\n![4-1-11](img/image00229.jpeg)\n\n当以下情况发生时，`die`\
    \ 语句会被执行：\n\n*   文件不存在\n*   文件未被授予打开权限\n\n它会立即终止脚本。\n\n至此，文件处理部分结束！\n\n---\n\n\
    # 4.2 超全局变量\n\n---\n\nPHP 中存在一些预定义变量，它们始终可访问，无论作用域如何——你可以从任何函数、类或文件中访问它们，而无需做任何特殊操作。这些变量称为超全局变量，或简称为超全局。\n\
    \nPHP 超全局变量包括：\n\n*   `$GLOBALS`\n*   `$_SERVER`\n*   `$_REQUEST`\n*   `$_POST`\n\
    *   `$_GET`\n*   `$_FILES`\n*   `$_ENV`\n*   `$_COOKIE`\n*   `$_SESSION`\n\n**超全局变量是始终在所有作用域中可用的内置变量。**\n\
    \n本章不会详细讨论每个变量。将对所有变量进行简要介绍，实际用法将在本章和下一章中处理。\n\n### `$GLOBALS`\n\n`$GLOBALS` 用于在\
    \ PHP 脚本的任何位置访问全局变量。我们在讨论函数中的变量作用域时使用过这些变量。希望你还记得！\n\n### `$_SERVER`\n\n`$_SERVER`\
    \ 保存关于头信息、路径和脚本位置的信息。`$_SERVER` 超全局变量有许多元素用于获取关于服务器和服务器相关实体的描述。\n\n以下是可与 `$_SERVER`\
    \ 一起使用的元素列表：\n\n![4-2-superglobals](img/image00230.jpeg)\n\n我们将在实践环节测试几个元素：\n\n\
    ```php\necho \"Server Address: \".$_SERVER['SERVER_ADDR'];\necho \"<br>Server\
    \ Name: \".$_SERVER['SERVER_NAME'];\n```\n\n![4-2-1](img/image00231.jpeg)\n\n\
    有 3 个超全局变量用于收集和传递表单数据。我们现在只简单了解一行，将在下一节深入探讨。\n\n### `$_REQUEST`\n\n`$_REQUEST`\
    \ 用于在提交 HTML 表单后收集数据。\n\n### `$_POST`\n\n`$_POST` 用于在使用 `method=\"post\"` 提交 HTML\
    \ 表单后收集表单数据。\n\n### `$_GET`\n\n`$_GET` 用于在使用 `method=\"get\"` 提交 HTML 表单后收集表单数据。\n\
    \n### `$_ENV`\n\n`$_ENV` 用于从 Web 服务器返回环境变量。为了学习，我们通过一个示例演示：\n\n```php\necho 'Username:\
    \ ' .$_ENV['USER'];\n```\n\n![4-2-2](img/image00232.jpeg)\n\n这是一个错误！没问题！\n\n让我们调试该错误！`Undefined\
    \ index`：意味着我们必须定义一个 `USER` 索引！\n\n我们现在修改代码如下：\n\n```php\n$_ENV['USER'] = $_SERVER['SERVER_NAME'];\n\
    \necho 'Username: ' .$_ENV['USER'];\n```\n\n![4-2-3](img/image00233.jpeg)\n\n\
    就这些！\n\n我们将在本章后面讨论 `$_FILES`。将在下一章讨论 `$_COOKIE` 和 `$_SESSION`。\n\n让我们进入下一节！\n\n\
    ---\n\n# 4.3 使用表单\n\n---\n\n我们将使用第 6 章的一个项目标题来开发一个 Web 应用程序。因此，我们现在将为该应用程序设计一些表单，并通过它们学习如何使用\
    \ PHP 处理表单。明白了吗？让我们开始吧！\n\n我将简要介绍该项目的内容。\n\n**项目：** 我们将采用 **在线课程** Web 应用程序。\n\
    \n在这个在线课程应用程序中，我们将有教授课程的讲师和学习这些内容的学习者。\n\n基本上，我们有 2 种用户：讲师和学习者。同样，我们有 2 个主要实体：课程及其内容。\n\
    \n我们将简单地设计表单并使用它们来学习上一节讨论的某些超全局变量。\n\n请记住，我们不验证表单中的任何数据，我们只是在学习如何发送和检索表单数据。\n\n\
