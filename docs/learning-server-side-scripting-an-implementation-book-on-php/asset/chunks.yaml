- raw: "*   The size of the array is stored in variable $n.\n\n*   For counting number\
    \ of tests we use the variable $i.\n\n*   We will also initialize a variable $sum\
    \ to calculate the sum of the marks of 5 tests.\n\n```\n//while loop\n$i = 0;\n\
    $marks = array(50,70,74,83,65);\n$n = count($marks);\n$sum = 0;\necho \"Marks:\
    \ \";\nvar_dump($marks);\nwhile($i < $n){\n $sum = $sum + $marks[$i];\n echo \"\
    <br> Value of i = \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \" Sum =\
    \ \".$sum;\n $i++;\n}\n```\n\n**Execute:**\n\nWhat does the code do?\n\n*   We\
    \ declare an array $marks\\[\\]\n\n*   We initialize loop count variable $i =\
    \ 0, array size variable $n = count($marks), sum variable $sum = 0\n\n*   While\
    \ loop tests the condition $i < $n \n\n    *   We print value of $i, $marks\\\
    [$i\\] and $sum\n\n    *   Increment $i by 1 for every iteration.\n\n    *   The\
    \ loop executes till $i < $n. Once $i = $n, the loop stops executing.\n\nHere\
    \ is the output:\n\n![3-3-1](Images/image00203.jpeg)\n\n**do...while Loop**\n\n\
    The do...while loop will always execute the block of code once, it will then check\
    \ the condition and repeat the loop while the specified condition is true. Here,\
    \ the condition is tested AFTER executing the statements within the loop. This\
    \ means that the loop will execute its statements at least once, even when the\
    \ condition is false.\n\n**Syntax**\n\n```\ndo {\t\n  code to be executed;\n}\
    \ while (condition is true);\n```\n\n**Practice:**\n\nWe will now rewrite the\
    \ same code segment using this loop:\n\n```\n//do while loop\n$i = 0;\n$marks\
    \ = array(50,70,74,83,65);\n$n = count($marks);\n$sum = 0;\necho \"Marks: \";\n\
    var_dump($marks);\ndo{\n $sum = $sum + $marks[$i];\n echo \"<br> Value of i =\
    \ \".$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \" Sum = \".$sum;\n $i++;\n\
    }while($i < $n);\n```\n\nYou will get the same output as while loop on executing\
    \ the above code. The reason why we rewrite the same code is to tell you how the\
    \ execution happens and where the condition is checked!\n\n**for Loop**\n\nThe\
    \ for loop is used when you know in advance how many times the script should run.\
    \ It also works as the other 2 loops but how we specify the increment counter\
    \ and where we check the condition matter!\n\n**Syntax**\n\n```\nfor (initialize;\
    \ check condition; increment/decrement) {\n  code to be executed for each iteration;\n\
    }\n```\n\nParameters:\n\n*   Initialize the loop counter value\n\n*   Check condition\
    \ to be evaluated for each loop iteration. If it evaluates to TRUE, the loop continues.\
    \ If it evaluates to FALSE, the loop ends.\n\n*   Increment or decrement the loop\
    \ counter value\n\n**Practice:**\n\nNot to bore you, but to tell you how this\
    \ loop works, we again go with same example!\n\n```\n//for loop\n$marks = array(50,70,74,83,65);\n\
    $n = count($marks);\n$sum = 0;\necho \"Marks: \";\nvar_dump($marks);\nfor($i =\
    \ 0; $i < $n; $i++){\n $sum = $sum + $marks[$i];\n echo \"<br> Value of i = \"\
    .$i;\n echo \" marks[$i] = \".$marks[$i];\n echo \" Sum = \".$sum;\n}\n```\n\n\
    There is a small difference noted! Instead of incrementing the variable $i inside\
    \ the loop's code block, we increment it along with initialization and testing\
    \ condition. Execute the same and you will find the same output again!\n\n**foreach\
    \ Loop**\n\nThe foreach loop works only on arrays, and is used to loop through\
    \ each key/value pair in an array.\n\n**Syntax**\n\n```\nforeach ($array as $value)\
    \ {\n  code to be executed;\n}\n```\n\nFor every loop iteration, the value of\
    \ the current array element is assigned to $value and the array pointer is moved\
    \ by one, until it reaches the last array element.\n\n**Practice:**\n\nAgain,\
    \ we will take the same example coding. This time, instead of using counting variable\
