    # String Functions


    Before getting into functions, we will first know about the **string concatenation
    operator** called dot (`.`). Guess you would have seen this operator in echo statements
    in the previous examples. The use of concatenation operator is to concatenate
    or merge two strings!


    We will look at some commonly used functions to manipulate strings.


    ## String Length


    *   `strlen(string)` function returns the length of a string.

    *   The length of a string is often used in loops or other functions, when it
    is important to know when the string ends.


    ## Words Count


    *   `str_word_count(string)` function counts the number of words in a string.


    ## String Reverse


    *   `strrev(string)` function reverses a string.


    ## String Search


    *   `strpos(string, search)` function is used to search for a specific string
    or character within a string.

    *   If a match is found in the string, this function will return the position
    of the first match.

    *   If no match is found, it will return FALSE.

    *   The position starts from 0 and not 1.


    ## String Replace


    *   `str_replace(find, replace, string, count)` function replaces some characters
    with some other characters in a string.

    *   `count` (optional parameter) is a variable that counts the number of replacements.


    ## Practice: String Functions


    We will look into all the above functions.


    ```php

