  trans: "\n\n这里我的意图是教大家如何插入数据以及如何通过该语句实现注册流程。我没有验证所有其他字段，因为我在 HTML 代码中已经相应地提供了 `required`\
    \ 属性和 `type` 属性。\n\n好的，我们来执行这个页面吗？让我以讲师身份注册！\n\n执行 `http://localhost/register.php`\
    \ 并输入以下详细信息：\n\n*   类别：讲师\n*   邮箱：`instructor1@onlinecourse.com`\n*   密码：password\n\
    *   姓名：讲师 1\n*   详情：我希望开发编程课程\n\n当你点击注册时，你将获得如下弹窗：\n\n![7-2-4](img/image00313.jpeg)\n\
    \n按确定并关闭弹窗，你将看到页面保持原样！注册后该去哪里？这项工作将在下一章完成！\n\n万一你遇到一些错误：\n\n*   进入 phpmyadmin\
    \ 检查表 `instructor` 或 `userlogin` 中是否有记录条目。\n*   如果有，删除它们，修正错误并再次执行！\n*   如果没有，修正错误并再次执行！\n\
    *   因为我们在 localhost 中执行，错误会自动列在页面顶部。\n\n**查看 MySQL：**\n\n进入 phpmyadmin 并从 `onlinecourse`\
    \ 数据库中选择 `instructors` 表：\n\n![7-2-5](img/image00314.jpeg)\n\n现在，选择 `userlogin`\
    \ 表并查看密码哈希是如何形成的：\n\n![7-2-6](img/image00315.jpeg)\n\n希望你清楚如何将数据插入表中！\n\n---\n\
    \n### 7.3 插入数据 - II\n\n---\n\n我们要继续设计章节开头讨论的其他表单吗？\n\n创建一个名为 `newcourse.php` 的文件，或在\
    \ `index.php` 上使用“另存为”并将其保存为 `newcourse.php`。我们现在将创建\n\n**表单设计：newcourse.php**\n\
