    因此，应用程序所需的所有表均已创建！\n\n---\n\n### 6.5 Web 应用程序模板\n\n---\n\n**什么是模板？**\n\n它是一个现成的网页，包含布局、字体、图像和其他待包含的元素。当你准备好模板后，可以确保整个应用程序（所有网页）具有统一的设计。\n\
