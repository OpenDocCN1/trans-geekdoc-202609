    }\n\nprint_message();\nprint_message_string(\"Printing from arguments\");\n```\n\
    \n**Execute:**\n\nWe have printed two statements. First statement is printed by\
    \ print\\_message() function. Second statement is passed as an argument to the\
    \ print\\_message\\_string($string) function.\n\n![2-6-1](Images/image00174.jpeg)\n\
    \nIn the example set above, we do not have to tell PHP which data type the variable\
    \ is. PHP automatically associates a data type to the variable, depending on its\
    \ value. Since the data types are not set in a strict sense, you can do things\
    \ like adding a string to an integer without causing an error.\n\n**Type declarations:**\n\
    \nIn PHP 7, type declarations were added. This gives us an option to specify the\
    \ expected data type when declaring a function, and by adding the strict declaration,\
    \ it will throw a \"Fatal Error\" if the data type mismatches.\n\nTo specify strict,\
    \ we need to set:\n\n```\ndeclare(strict_types=1);\n```\n\nIt must be specified\
    \ on the very first line of the file.\n\nTry this code snippet now:\n\n```\ndeclare(strict_types=1);\n\
    function print_message_string(int $str){\n echo $str;\n}\nprint_message_string(\"\
    Hello\");\n```\n\nYou will be thrown fatal error as below:\n\n![26-2](Images/image00175.jpeg)\n\
    \nTry replacing the function call as:\n\n```\nprint_message_string(10);\n```\n\
    \nThe output will print 10.\n\nHope you can understand restricting the data type\
    \ of argument!\n\nArguments and Parameters mean the same.\n\n**Where should we\
    \ use the term parameter and argument?** \n\n*   Parameters: function definition\n\
    \n*   Arguments: function call"
