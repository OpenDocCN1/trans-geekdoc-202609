- raw: "```\nif($fetch = mysqli_fetch_row($fetch_content)){\n  echo \"<h4>\".$fetch[1].\"\
    </h4>\";\n  $filestring = explode('.',$fetch[3]);\n  $file_ext= strtolower(end($filestring));\n\
    \  $exts = array('doc','docx','ppt','pptx');\n  if(in_array($file_ext,$exts)){\n\
    \    echo \"<p>The content will be downloaded!</p>\";\n  }\n  echo \"<p><iframe\
    \ src='$fetch[3]' height='auto' width='80%' height='500px' frameborder='0'></iframe></p>\"\
    ;\n  $get_enrolid = mysqli_query($con,\"SELECT * FROM enroll WHERE learn_mail\
    \ = '$usersession' AND course_code = $course\");\n  $enrolid = mysqli_fetch_array($get_enrolid);\n\
    \  $eid = $enrolid['enroll_id'];\n  $check_records = mysqli_query($con,\"SELECT\
    \ * FROM record WHERE enroll_id = $eid AND content_id = $contents\");\n  if(mysqli_num_rows($check_records)\
    \ == 0){\n    mysqli_query($con,\"INSERT INTO record VALUES ($eid,$contents)\"\
    );\n } \n  if(get_progress($con,$eid) == 100){\n    mysqli_query($con,\"UPDATE\
    \ enroll SET learn_end = NOW() WHERE enroll_id = $eid\");\n  } \n}\n```\n\n* \
    \  We find the enroll\\_id using $usersession variable and $course variable\n\n\
    *   We check if content\\_id and $enroll\\_id have already been inserted in the\
    \ record table\n\n*   If it is not inserted, we insert the data to the record\
    \ table.\n\n*   When the progress reaches 100, we assign the current date as the\
    \ completion date of the course.\n\nLet me show accessing contents of course name\
    \ 1\n\n*This is a GIF image. Make sure GIF is supported in your device.*\n\n![1604667223-access-contents](Images/image00353.gif)\n\
    \nWe will look at the phpmyadmin screenshot of record table.\n\n![8-5-3](Images/image00354.jpeg)\n\
    \nShall we check the progress of learners from instructor’s dashboard?\n\nLogout\
    \ as learner and Login as instructor:\n\nYou will see a link next to number of\
    \ learners enrolled:\n\n![8-5-4](Images/image00355.jpeg)\n\nClick View to view\
    \ the learner’s progress:\n\n![8-5-5](Images/image00356.jpeg)\n\nI think, the\
    \ development of the application almost comes to an end with this! We covered\
    \ everything as per the project outline specified in the Chapter 6.1.\n\nWe are\
    \ just left with one page - the home page of the application. We will do it in\
    \ the next section.\n\n* * *\n\n### 8.6 Home Page\n\n* * *\n\nThe only thing we\
    \ have to do is to complete the home page tasks\n\n*   Display the courses and\
    \ number of enrolled learners in each course\n\n*   Display the details of Instructors\n\
    \nThey are simple retrieval processes!\n\nOpen **index.php** page.\n\nChange the\
    \ title tag content as **Online Course Home**\n\nReplace the article tag content\
    \ as:\n\n```\n<article class=\"artclass\">\n<div>\n<h3>Courses with enrollments</h3>\n\
    <?php\nrequire('connect.php');\n$get_courses = mysqli_query($con,\"SELECT * FROM\
    \ courses\");\nwhile($courses = mysqli_fetch_row($get_courses)){\n  $enrols =\
    \ mysqli_query($con,\"SELECT * FROM enroll WHERE course_code = $courses[0]\");\n\
    \  echo \"<p>\".$courses[1].\" &emsp; - &emsp; \".mysqli_num_rows($enrols).\"\
    </p>\";\n}\n?>\n</div>\n<div style='vertical-align:top;'>\n<h3>Instructors List</h3>\n\
    <?php\n$get_instr= mysqli_query($con,\"SELECT * FROM instructors\");\nwhile($instr\
    \ = mysqli_fetch_row($get_instr)){\n  echo \"<p>\".$instr[1].\" - \".$instr[2].\"\
    </p>\";\n}\n?>\n</div>\n</article>\n```\n\nWe have done simple retrievals for\
    \ displaying relevant information as per the template.\n\n```\n$get_courses =\
    \ mysqli_query($con,\"SELECT * FROM courses\");\nwhile($courses = mysqli_fetch_row($get_courses)){\n\
    \  $enrols = mysqli_query($con,\"SELECT * FROM enroll WHERE course_code = $courses[0]\"\
    );\n  echo \"<p>\".$courses[1].\" &emsp; - &emsp; \".mysqli_num_rows($enrols).\"\
    </p>\";\n}\n```\n\nWe fetch all the courses. For each course in the while loop,\
    \ we fetch enrolments made to that particular course. mysqli\\_num\\_rows($enrols)\
    \ holds the number of enrolment to the course.\n\n```\n$get_instr= mysqli_query($con,\"\
    SELECT * FROM instructors\");\nwhile($instr = mysqli_fetch_row($get_instr)){\n\
    \  echo \"<p>\".$instr[1].\" - \".$instr[2].\"</p>\";\n}\n```\n\nWe fetch all\
    \ the instructors and display two of their details: instructor's name and instructor's\
    \ details.\n\nLet me give the screenshot:\n\n![8-6](Images/image00357.jpeg)\n\n\
    * * *\n\n### 8.7 Application Demo\n\n* * *\n\nLet me show a demo video of the\
