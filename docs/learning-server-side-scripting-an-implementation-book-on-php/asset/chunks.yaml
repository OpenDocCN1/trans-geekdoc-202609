    \ 'instructor1@onlinecourse.com';\n```\n\n**替换后：**\n\n```php\ninclude('check.php');\n\
    $course = '';\n$instructor = $usersession;\nif(isset($_REQUEST['cid'])){\n  $course\
    \ = $_REQUEST['cid'];\n}\n```\n\n我们做了 4 项更改：\n\n- 引入 `check.php` 文件。\n- 将 `$course`\
    \ 初始化为空字符串。\n- 将请求参数 `cid`（课程代码）的值赋给 `$course` 变量。\n- 将 `$usersession` 的值赋给 `$instructor`\
    \ 变量。\n\n请尝试逐项更改！这将让你更清晰地了解修改内容！\n\n由于讲师已登录，我们将从 `$usersession` 变量检索值，在 `if(isset($_POST['editcourse'])){}`\
