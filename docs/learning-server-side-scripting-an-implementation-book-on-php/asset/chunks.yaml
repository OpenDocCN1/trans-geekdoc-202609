    \ empty, all the data is submitted to the same page. Right now, we are not saving\
    \ this data anywhere. We just pass the data and print them in the same page using\
    \ superglobal variables.\n\nOn execution, you should see like this (if you have\
    \ coded as above):\n\n![4-3-2](Images/image00235.jpeg)\n\nYou can design the form\
    \ as you like. But for learning purpose, don't change any element's name. We have\
    \ these names in this form: `form1`, `txtemail`, `txtname`, `txtqualification`,\
    \ `txtcountry`, `signup`. Make sure the spellings are right. Because, these names\
    \ are going to play a big role.\n\nSince the method we used here is get, we can\
    \ collect those data using `$_REQUEST` or `$_GET` variables!\n\nCode the following\
    \ in the beginning of `instructor_signup.php` file:\n\n```php\n<?php\nif(isset($_GET['signup'])){\n\
    \  echo \"<br>You have clicked Sign up\";\n}\n?>\n```\n\nWe will check if the\
    \ form is submitted. What to do?\n\n*   Add this code to the php file.\n*   Execute\
    \ the file\n*   Click Sign up button in the page\n\n![4-3-3](Images/image00236.jpeg)\n\
    \nIf you get this message displayed on top, your form is submitted.\n\n`if(isset($_GET['signup']))`\
    \ explanation:\n\n*   `$_GET['signup']` will get the value 1 if the button named\
    \ `signup` is clicked.\n*   `isset()` will check if `$_GET['signup']` has a value.\
    \ If the button is not clicked, `$_GET['signup']` will not have value, making\
    \ `isset()` to false. When it is clicked, `isset()` return true.\n*   when you\
    \ pass `isset($_GET['signup'])` inside `if()` statement, the condition is evaluated\
    \ to be true and the statement block is executed. If condition evaluates to false,\
    \ the statement block does not get executed.\n\nExample: when you executed the\
    \ page, you did not get the message, only when you clicked the button, you got\
    \ this message.\n\nCan you see the URL? When you use the `$_GET` method, all your\
    \ values will be explicitly shown in the URL along with name parameters.\n\nNow\
    \ we will just get all these values in variables and print the same.\n\nAdd this\
    \ code in the beginning: (Instead of only echo statement, we add few more lines).\n\
    \n```php\n<?php\nif(isset($_GET['signup'])){\n   echo \"<br>You have clicked Sign\
    \ up\";\n   $email = $_REQUEST['txtemail'];\n   $name = $_GET['txtname'];\n  \
    \ $qualification = $_GET[\"txtqualification\"];\n   $country = $_GET['txtcountry'];\n\
    }\n?>\n```\n\nUnless needed, we can use single or double quotes.\n\nWe shall print\
    \ the details below the form. See where your form ends with `</form>`. Place the\
    \ code snippet below `<hr>` tag:\n\n```php\n<?php\nif(isset($email)){\n  echo\
    \ \"<br>Email - \".$email;\n}\nif(isset($name)){\n  echo \"<br>Name - \".$name;\n\
    }\nif(isset($qualification)){\n  echo \"<br>Qualification - \".$qualification;\n\
    }\nif(isset($country)){\n  echo \"<br>Country - \".$country;\n}\n?>\n```\n\nThe\
    \ reason for using `isset()` for every php variable is simple - if you don’t use,\
    \ when you execute, php will search for those variables and display error if not\
    \ found. Do you want to check? You can!\n\nAfter adding code, make sure you don't\
    \ refresh the URL with the parameters.\n\nExecute `http://localhost/onlinecourse/instructor_signup.php`\n\
    \nAfter execution, give some input in those fields and click Sign up button:\n\
    \n![4-3-4](Images/image00237.jpeg)\n\nCan you understand what it does? Also, make\
    \ a note on the URL parameters!\n\nDo you want your form data to be safe?\n\n\
    Very simple, you need to do 2 things:\n\n*   change form method=\"post\"\n*  \
    \ Change all your `$_GET[]` to `$_POST[]` variables. You can change / leave `$_REQUEST[]`\n\
    \nLet me give the code:\n\n```php\n<?php\nif(isset($_POST['signup'])){\n    echo\
    \ \"<br>You have clicked Sign up\";\n    $email = $_REQUEST['txtemail'];\n   \
    \ $name = $_POST['txtname'];\n    $qualification = $_POST[\"txtqualification\"\
    ];\n    $country = $_POST['txtcountry'];\n}\n?>\n\n<form method=\"post\" action=\"\
    \" name=\"form1\">\n```\n\nExecute `http://localhost/onlinecourse/instructor_signup.php`\n\
    \n![4-3-5](Images/image00238.jpeg)\n\nSee how clean your URL is!\n\nWhen you are\
    \ not sure whether your form is sent by get or post method, you can retrieve the\
    \ form variables using `$_REQUEST`!\n\nLet us have an idea on **GET vs POST:**\n\
    \nBoth GET and POST create an array like: array( key1 => value1, key2 => value2,\
    \ key3 => value3, ...). This array holds key/value pairs, where keys are the names\
    \ of the form controls and values are the input data from the user.\n\nYou can\
    \ access them from any function, class or file without having to do anything special.\
    \ They are accessible globally.\n\n*   `$_GET` is an array of variables passed\
    \ to the current script via the URL parameters.\n*   `$_POST` is an array of variables\
    \ passed to the current script via the HTTP POST method.\n\n### When to use GET?\n\
    \nInformation sent from a form with the GET method is visible to everyone (all\
    \ variable names and values are displayed in the URL).\n\n*   GET has limits on\
    \ the amount of information to send.\n*   The limitation is about 2000 characters.\n\
    *   However, because the variables are displayed in the URL, it is possible to\
    \ bookmark the page. This can be useful in some cases.\n*   GET may be used for\
    \ sending non-sensitive data.\n*   GET should NEVER be used for sending passwords\
    \ or other sensitive information!\n\n### When to use POST?\n\nInformation sent\
    \ from a form with the POST method is invisible to others (all names/values are\
    \ embedded within the body of the HTTP request)\n\n*   It has no limits on the\
    \ amount of information to send.\n*   Moreover POST supports advanced functionality\
    \ such as support for multi-part binary input while uploading files to server.\n\
    *   However, because the variables are not displayed in the URL, it is not possible\
    \ to bookmark the page.\n*   Developers prefer POST for sending form data.\n\n\
    ---\n\n### 4.4 Form Validation\n\n---\n\nWe will learn how to process forms with\
    \ security in this section. Proper Validation of form data is important to protect\
    \ your data from hackers and spammers!\n\nExamples on validation:\n\nThese 2 validation\
    \ rules are as per our instructor form signup.\n\n*   if you provide a name in\
    \ text field, it should contain letters and whitespace.\n*   if you provide an\
    \ email address in email field, it must be valid with @ and domain name.\n*  \
    \ we can also mention a field as mandatory or optional using required attribute\
    \ in html input element.\n\n**How do we validate the form designed in the previous\
    \ section?**\n\nWe will follow some steps here:\n"
  trans: "\n<!DOCTYPE html>\n<html>\n<head>\n<title>讲师注册</title>\n</head>\n<body>\n\
