    \ Apache 即可。MySQL 将在第 6 章用到，届时再启动即可。\n\n---\n\n### 1.5 开始编写 PHP 代码\n\n---\n\n\
    **在哪里编写代码？**\n\nPHP 需要文本编辑器来编写脚本。你可以使用任何文本编辑器，如 Notepad、Notepad++ 等。你可以自由使用 Visual\
    \ Studio Code 或类似的编辑器，甚至 IDE 来编写脚本。但我建议你不要使用任何 IDE 或代码生成器。代码生成器会协助你编码，但你的学习曲线将不正确。\n\
    \n所以，请使用 Notepad++ 或类似的简单文本编辑器！我推荐使用 Notepad++，因为它有语法高亮功能（PHP 语法会以彩色高亮显示）\n\n\
    **开始编写 PHP 代码：**\n\n让我们以一个单行 PHP 脚本为例。\n\n1.  打开文本编辑器\n2.  输入以下内容：\n\n```\n<?php\n\
