    \ $z2 is string 55\";\necho \"<br> Checking $z1 == $z2 Answer: \".($z1 == $z2);\n\
    echo \"<br> Checking $z1 === $z2 Answer: \".($z1 === $z2);\n\necho \"<br><br>Increment/Decrement\
    \ Operators\";\necho \"<br> $x Value: \".$x;\necho \"<br>Pre-increment ++$x =\
    \ \".++$x;\necho \"<br>Post-increment $x++ = \".$x++;\necho \"<br> $x after post-increment:\
    \ \".$x;\n```\n\n**Execute:**\n\nThe post increment operator returns the value\
    \ of the variable `$x` and then increments it by one. That is why `$x` value stays\
    \ as 31 and then the subsequent statement prints `$x` as 32.\n\n![3-1-1](Images/image00193.jpeg)\n\
    \n### Logical Operators\n\nThe logical operators are used to combine conditional\
    \ statements.\n\n![3-1-logical](Images/image00194.jpeg)\n\n### String Operators\n\
    \nThere are 2 operators for strings specially. We have seen one of them in echo\
    \ statements.\n\n![3-1-string](Images/image00195.jpeg)\n\n### Array Operators\n\
    \nThey are used to compare arrays. Some operators are similar to comparison operators.\n\
    \n![3-1-array](Images/image00196.jpeg)\n\n### Conditional Assignment Operators\n\
    \nThey are used to set a value depending on conditions.\n\n![3-1-conditional](Images/image00197.jpeg)\n\
    \n### Practice\n\nWe will practise the next set of operators. The real use of\
    \ operators can be found in the upcoming sections of this chapter.\n\n```php\n\
    //Operators:\n$x = 5;\n$y = 10;\necho \"<br>Values of $x = \".$x.\" and $y = \"\
    .$y;\n\necho \"<br>Logical Operators \";\n$z1 = $x > $y;\n$z2 = $x < $y;\necho\
    \ \"<br> Either of z1 or z2 is true - \".($z1 or $z2);\n\n$test = ($x > $y) ?\
    \ '$x is greater' : '$y is greater';\necho \"<br><br>Ternary Operator: \".$test;\n\
    \necho \"<br><br>String Operators \";\n$str1 = \"Hello\";\n$str2 = \"World\";\n\
    echo \"<br> str1 - \".$str1.\" str2 = \".$str2;\necho \"<br> Concatenation = \"\
    .$str1.\" \".$str2;\n$str1 .= $str2;\necho \"<br> Concatenation assigned to str1\
    \ - \".$str1;\n\n$a = array(10,12,15);\n$b = array(15,10,12);\necho \"<br><br>Array\
    \ Operators:\";\necho \"<br>Checking $a == $b - \".($a == $b);\n```\n\n**Execute:**\n\
    \nThe array operator will return false because arrays `$a` and `$b` do not have\
    \ the same indices but only values!\n\nThat is, `$a[0]` = 10, `$a[1]` = 12, `$a[2]`\
    \ = 15 and `$b[0]` = 15, `$b[1]` = 10, `$b[2]` = 12.\n\nIt means, `$a[0]` != `$b[0]`,\
    \ `$a[1]` != `$b[1]`, `$a[2]` != `$b[2]`.\n\n![3-1-2](Images/image00198.jpeg)\n\
    \nI think you have got some clarity on operators. The next section is for conditional\
    \ statements. We will use operators in those statements!\n\n---\n\n### 3.2 Conditional\
    \ Statements\n\n---\n\nSometimes, you would like to execute a set of code (code\
    \ block) only when it satisfies a condition. You can use conditional statements\
    \ in your code for this purpose.\n\n**Conditional statements are used to perform\
    \ actions based on the specified conditions.**\n\nIn PHP we have the following\
    \ conditional statements:\n\n*   `if` statement\n*   `if...else` statement\n*\
    \   `if...elseif...else` statement\n*   `switch` statement\n\nWe will look into\
    \ the syntax of these statements and then go into practice session.\n\n#### if\
    \ Statement\n\nIt executes a code block if a condition is true.\n\n**Syntax**\n\
    \n```php\nif (condition) {\n  code to be executed if condition is true;\n}\n```\n\
    \n#### if...else Statement\n\nIt executes one code block if a condition is true\
    \ or another code block if that condition is false.\n\n**Syntax**\n\n```php\n\
    if (condition) {\n  code to be executed if condition is true;\n} else {\n  code\
    \ to be executed if condition is false;\n}\n```\n\n#### if...elseif...else Statement\n\
    \nIt executes different code blocks for each of the specified conditions.\n\n\
    **Syntax**\n\n```php\nif (condition) {\n  code to be executed if this condition\
    \ is true;\n} elseif (condition) {\n  code to be executed if first condition is\
    \ false and this condition is true;\n} else {\n  code to be executed if all conditions\
    \ are false;\n}\n```\n\n#### Practice\n\nConditions are nothing but expressions.\n\
    \n```php\n//Conditionals\n$x = 10;\n$y = 15;\n$z = 5;\nif($x > $y){\n echo \"\
    x is greater than y\";\n }\n elseif ($x > $z) {\n  echo \"x is greater than z\"\
    ;\n }\n else {\n  echo \"x is the least value\";\n}\n```\n\n**Execute:**\n\nIn\
    \ the above example code segment, `$x` is not greater than `$y`, so we check the\
    \ `elseif` condition, which turns to be true. And so, the statement inside the\
    \ `elseif` block gets executed.\n\nTry executing the same code with different\
    \ values of `$x`, so that you can clearly understand how a condition is satisfied\
    \ and how the associated block of code gets executed.\n\n![3-2-1](Images/image00199.jpeg)\n\
    \n#### switch Statement\n\nWe use the `switch` statement to **select one of many\
    \ blocks of code to be executed**. In fact, it actually resembles the execution\
    \ of `if...elseif...else` statement except that instead of condition, we check\
    \ with the result of the expression.\n\n**Syntax**\n\n```php\nswitch (n) {\n \
    \ case label1:\n    code to be executed if n=label1;\n    break;\n  case label2:\n\
    \    code to be executed if n=label2;\n    break;\n  case label3:\n    code to\
    \ be executed if n=label3;\n    break;\n    ...\n  default:\n    code to be executed\
    \ if n is different from all labels;\n}\n```\n\nLet me explain you the working:\n\
    \n*   We have a single expression `n` (most often a variable), that is evaluated\
    \ once.\n*   The value of the expression is then compared with the values for\
    \ each case in the structure.\n*   If there is a match, the block of code associated\
    \ with that case is executed.\n*   Use `break` to prevent the code from running\
    \ into the next case automatically.\n*   If you miss the `break` statement, the\
    \ cases following the match will be executed.\n*   The `default` statement is\
    \ used if no match is found.\n\n#### Practice\n\n```php\n$n = 80;\nswitch($n){\n\
    \  case $n > 90: echo \"Distinction\"; break;\n  case $n > 80: echo \"First Class\"\
    ; break;\n  case $n > 70: echo \"Second Class\"; break;\n  case $n < 40: echo\
    \ \"Not completed\";break;\n  default: echo \"Completed Course\";\n}\n```\n\n\
    **Execute:**\n\nWe will execute the code as it is!\n\n![3-2-2](Images/image00200.jpeg)\n\
    \nRemove the `break` statement as below and execute:\n\n```php\ncase $n > 70:\
    \ echo \"Second Class\";\n```\n\n![3-2-3](Images/image00201.jpeg)\n\nCan you understand\
    \ the need for `break` statement? If you don't specify, the cases following the\
    \ matched case keeps executing. What happens when no cases are matched? The `default`\
    \ case gets executed!\n\nTry changing value of `n = 50` because cases exist for\
    \ `n > 70` and `n < 40`.\n\n```php\nn = 50;\n```\n\n![3-2-4](Images/image00202.jpeg)\n\
    \nHope you are clear with conditional statements. We also call them as branching\
    \ statements since the conditions are like branches. When a condition is satisfied,\
    \ that associated branch of code is alone executed.\n\n---\n\n### 3.3 Loop Statements\n\
    \n---\n\nSometimes you want the same block of code to run a certain number of\
    \ times. You can make use of loops instead of repeating the code lines multiple\
    \ times.\n\n**Loops are used to execute the same block of code again and again,\
    \ as long as a certain condition is true.**\n\nIn PHP, we have the following loop\
    \ types:\n\n*   `while`\n*   `do...while`\n*   `for`\n*   `foreach`\n\nWe will\
    \ look the syntax of each loop and practise the same.\n\n#### while Loop\n\nThe\
    \ `while` loop executes a block of code as long as the specified condition is\
    \ true.\n\n**Syntax**\n\n```php\nwhile (condition is true) {\n  code to be executed;\n\
    }\n```\n\nOnce the condition in the `while` is evaluated to true, the code between\
    \ the braces gets executed. If the condition evaluates to false, the code block\
    \ does not get executed.\n\n#### Practice\n\nWe will find the sum of 5 test marks!\n\
    \n*   Marks of 5 tests are stored in `$marks` array.\n"
  trans: "\n我们现在将练习这些运算符！希望你已经打开了一个名为 `section3.php` 的新文件。\n\n```php\n//Operators\n\
    $x = 10;\n$y = 20;\necho \"<br>Values of $x = \".$x.\" and $y = \".$y;\n\necho\
    \ \"<br>Arithmetic Operators \";\necho \"<br>Addition: $x + $y = \".($x + $y);\n\
    echo \"<br>Division: $y / $x = \".($y / $x);\necho \"<br>Modulus: $y % $x = \"\
    .($y % $x);\n\necho \"<br><br>Assignment Operators \";\n$x += $y;\necho \"Value\
    \ of $x after $x += $y = \".$x;\n\necho \"<br><br>Comparison Operators \";\necho\
    \ \"<br>Values of $x = \".$x.\" and $y = \".$y;\necho \"<br> $x is greater than\
    \ $y? \".($x > $y);\necho \"<br> Spaceship operator: $x<=>$y \".($x <=> $y);\n\
    $z1 = 55;\n$z2 = \"55\";\necho \"<br> $z1 is integer 55 and $z2 is string 55\"\
    ;\necho \"<br> Checking $z1 == $z2 Answer: \".($z1 == $z2);\necho \"<br> Checking\
    \ $z1 === $z2 Answer: \".($z1 === $z2);\n\necho \"<br><br>Increment/Decrement\
    \ Operators\";\necho \"<br> $x Value: \".$x;\necho \"<br>Pre-increment ++$x =\
    \ \".++$x;\necho \"<br>Post-increment $x++ = \".$x++;\necho \"<br> $x after post-increment:\
    \ \".$x;\n```\n\n**执行：**\n\n后置递增运算符返回变量 `$x` 的值，然后将其加一。这就是为什么 `$x` 的值保持为 31，随后的语句打印\
    \ `$x` 为 32 的原因。\n\n![3-1-1](img/image00193.jpeg)\n\n### 逻辑运算符\n\n逻辑运算符用于组合条件语句。\n\
    \n![3-1-logical](img/image00194.jpeg)\n\n### 字符串运算符\n\n专门有 2 个用于字符串的运算符。我们在 echo\
    \ 语句中已经见过其中一个了。\n\n![3-1-string](img/image00195.jpeg)\n\n### 数组运算符\n\n它们用于比较数组。某些运算符与比较运算符类似。\n\
    \n![3-1-array](img/image00196.jpeg)\n\n### 条件赋值运算符\n\n它们用于根据条件设置值。\n\n![3-1-conditional](img/image00197.jpeg)\n\
    \n### 练习\n\n我们将练习下一组运算符。运算符的实际用法可以在本章即将到来的章节中找到。\n\n```php\n//Operators:\n$x =\
    \ 5;\n$y = 10;\necho \"<br>Values of $x = \".$x.\" and $y = \".$y;\n\necho \"\
    <br>Logical Operators \";\n$z1 = $x > $y;\n$z2 = $x < $y;\necho \"<br> Either\
    \ of z1 or z2 is true - \".($z1 or $z2);\n\n$test = ($x > $y) ? '$x is greater'\
    \ : '$y is greater';\necho \"<br><br>Ternary Operator: \".$test;\n\necho \"<br><br>String\
    \ Operators \";\n$str1 = \"Hello\";\n$str2 = \"World\";\necho \"<br> str1 - \"\
    .$str1.\" str2 = \".$str2;\necho \"<br> Concatenation = \".$str1.\" \".$str2;\n\
    $str1 .= $str2;\necho \"<br> Concatenation assigned to str1 - \".$str1;\n\n$a\
    \ = array(10,12,15);\n$b = array(15,10,12);\necho \"<br><br>Array Operators:\"\
    ;\necho \"<br>Checking $a == $b - \".($a == $b);\n```\n\n**执行：**\n\n数组运算符将返回 false，因为数组\
    \ `$a` 和 `$b` 没有相同的索引（键），只有值相同！\n\n也就是说，`$a[0]` = 10，`$a[1]` = 12，`$a[2]` = 15\
    \ 而 `$b[0]` = 15，`$b[1]` = 10，`$b[2]` = 12。\n\n这意味着，`$a[0]` != `$b[0]`，`$a[1]`\
    \ != `$b[1]`，`$a[2]` != `$b[2]`。\n\n![3-1-2](img/image00198.jpeg)\n\n我想你已经对运算符有了一些了解。下一节是关于条件语句的。我们将在这些语句中使用运算符！\n\
    \n---\n\n### 3.2 条件语句\n\n---\n\n有时，你可能只希望在满足某个条件时才执行一组代码（代码块）。你可以在代码中使用条件语句来实现这一目的。\n\
    \n**条件语句用于根据指定的条件执行操作。**\n\n在 PHP 中，我们有以下条件语句：\n\n*   `if` 语句\n*   `if...else`\
    \ 语句\n*   `if...elseif...else` 语句\n*   `switch` 语句\n\n我们将先看这些语句的语法，然后进入实践环节。\n\
    \n#### if 语句\n\n如果条件为真，则执行一个代码块。\n\n**语法**\n\n```php\nif (condition) {\n  code\
    \ to be executed if condition is true;\n}\n```\n\n#### if...else 语句\n\n如果条件为真则执行一个代码块，如果条件为假则执行另一个代码块。\n\
    \n**语法**\n\n```php\nif (condition) {\n  code to be executed if condition is true;\n\
    } else {\n  code to be executed if condition is false;\n}\n```\n\n#### if...elseif...else\
    \ 语句\n\n为每个指定的条件执行不同的代码块。\n\n**语法**\n\n```php\nif (condition) {\n  code to be\
    \ executed if this condition is true;\n} elseif (condition) {\n  code to be executed\
    \ if first condition is false and this condition is true;\n} else {\n  code to\
    \ be executed if all conditions are false;\n}\n```\n\n#### 练习\n\n条件只不过是表达式罢了。\n\
    \n```php\n//Conditionals\n$x = 10;\n$y = 15;\n$z = 5;\nif($x > $y){\n echo \"\
    x is greater than y\";\n }\n elseif ($x > $z) {\n  echo \"x is greater than z\"\
    ;\n }\n else {\n  echo \"x is the least value\";\n}\n```\n\n**执行：**\n\n在上面的示例代码片段中，`$x`\
    \ 不大于 `$y`，所以我们检查 `elseif` 条件，结果为真。因此，`elseif` 块内的语句被执行。\n\n尝试使用不同的 `$x` 值执行相同的代码，这样你就能清楚地理解条件是如何被满足的，以及相关的代码块是如何被执行的。\n\
    \n![3-2-1](img/image00199.jpeg)\n\n#### switch 语句\n\n我们使用 `switch` 语句来**从多个代码块中选择一个来执行**。实际上，它类似于\
    \ `if...elseif...else` 语句的执行，不同之处在于我们不是检查条件，而是检查表达式的结果。\n\n**语法**\n\n```php\n\
    switch (n) {\n  case label1:\n    code to be executed if n=label1;\n    break;\n\
    \  case label2:\n    code to be executed if n=label2;\n    break;\n  case label3:\n\
    \    code to be executed if n=label3;\n    break;\n    ...\n  default:\n    code\
    \ to be executed if n is different from all labels;\n}\n```\n\n让我解释一下它的工作原理：\n\
    \n*   我们有一个单一的表达式 `n`（通常是一个变量），它只被求值一次。\n*   然后将表达式的值与结构中每个 case 的值进行比较。\n*  \
    \ 如果匹配，则执行与该 case 关联的代码块。\n*   使用 `break` 可防止代码自动运行到下一个 case。\n*   如果你漏掉了 `break`\
    \ 语句，匹配项之后的 case 将会被执行。\n*   如果未找到匹配项，则使用 `default` 语句。\n\n#### 练习\n\n```php\n\
    $n = 80;\nswitch($n){\n  case $n > 90: echo \"Distinction\"; break;\n  case $n\
    \ > 80: echo \"First Class\"; break;\n  case $n > 70: echo \"Second Class\"; break;\n\
    \  case $n < 40: echo \"Not completed\";break;\n  default: echo \"Completed Course\"\
    ;\n}\n```\n\n**执行：**\n\n我们将按原样执行代码！\n\n![3-2-2](img/image00200.jpeg)\n\n移除 `break`\
    \ 语句如下所示并执行：\n\n```php\ncase $n > 70: echo \"Second Class\";\n```\n\n![3-2-3](img/image00201.jpeg)\n\
    \n你能理解 `break` 语句的必要性吗？如果你不指定它，匹配的 case 之后的 case 将继续执行。当没有 case 匹配时会发生什么？`default`\
    \ case 会被执行！\n\n尝试将 `n` 的值改为 50，因为存在 `n > 70` 和 `n < 40` 的 case。\n\n```php\nn\
    \ = 50;\n```\n\n![3-2-4](img/image00202.jpeg)\n\n希望你已经清楚条件语句了。我们也称它们为分支语句，因为条件就像分支一样。当条件满足时，仅执行与该条件关联的分支代码。\n\
    \n---\n\n### 3.3 循环语句\n\n---\n\n有时你希望同一代码块运行特定次数。你可以使用循环，而不是多次重复代码行。\n\n**只要指定的条件为真，循环就会反复执行同一代码块。**\n\
    \n在 PHP 中，我们有以下循环类型：\n\n*   `while`\n*   `do...while`\n*   `for`\n*   `foreach`\n\
    \n我们将查看每种循环的语法并进行练习。\n\n#### while 循环\n\n`while` 循环只要指定条件为真，就会执行一个代码块。\n\n**语法**\n\
    \n```php\nwhile (condition is true) {\n  code to be executed;\n}\n```\n\n一旦 `while`\
    \ 中的条件求值为真，大括号之间的代码就会被执行。如果条件求值为假，则不会执行代码块。\n\n#### 练习\n\n我们将计算 5 次测试成绩的总和！\n\n\
    *   5 次测试的成绩存储在 `$marks` 数组中。\n\n"
