- raw: "PHP has the following functions to check if the type of a variable is float:\n\
    \n*   is\\_float()\n\n*   is\\_double()\n\nPHP has the following functions to\
    \ check if a numeric value is finite or infinite. A numeric value that is larger\
    \ than PHP\\_FLOAT\\_MAX is considered infinite.\n\n*   is\\_finite()\n\n*   is\\\
    _infinite()\n\nPHP has function to check if a value is not a number. NaN stands\
    \ for Not a Number. NaN is used for impossible mathematical operations.\n\n* \
    \  is\\_nan()\n\nThe PHP function uses the following function to find whether\
    \ a variable is numeric. The function returns true if the variable is a number\
    \ or a numeric string. It returns false otherwise.\n\n*   is\\_numeric()\n\nFrom\
    \ PHP 7.0, this function will return FALSE for numeric strings in hexadecimal\
    \ form (e.g. 0xf4c3b00c), as they are no longer considered as numeric strings.\n\
    \nSometimes you need to cast a numerical value into another data type. The following\
    \ functions are often used to convert a value to an integer.\n\n(int), (integer),\
    \ or intval()\n\n**Practice:**\n\nThough not all, I have tried maximum functions\
    \ to be included:\n\n```\n//Numeric Functions\n\n$x = 56;\n$y = 56.7905;\n$z =\
    \ acos(8);\necho \"<br>x is an integer? \";\nvar_dump(is_int($x));\necho \"<br>y\
    \ is an integer? \";\nvar_dump(is_int($y));\necho \"<br>y is a float? \";\nvar_dump(is_float($y));\n\
    echo \"<br>z is a \";\nvar_dump($z);\necho \"<br> z is not a number? \";\nvar_dump(is_nan($z));\n\
    \n\n$m = 1.9e501;\n$n = 1.8e45;\necho \"<br> m is finite? \";\nvar_dump(is_finite($m));\n\
    echo \"<br> n is finite? \";\nvar_dump(is_finite($n));\necho \"<br> m is infinite?\
    \ \";\nvar_dump(is_infinite($m));\n\n\n$s = \"5679\";\necho \"<br> s is numeric?\
    \ \";\nvar_dump(is_numeric($s));\n$t = \"56.79\" + 10;\necho \"<br> t is numeric?\
    \ \";\nvar_dump(is_numeric($t));\n$r = \"Hello\";\necho \"<br> r is numeric? \"\
    ;\nvar_dump(is_numeric($r));\n```\n\n**Execute:**\n\nSince variable $s is completely\
    \ a number, PHP automatically casts string to number. Similar automatic casting\
    \ (conversion) happens in variable $t.\n\n![2-4-1](Images/image00164.jpeg)\n\n\
    Try changing the expression of variable $r as:\n\n```\n$r = 10 + \"Hello\";\n\
    ```\n\nA warning will be generated for using string (non-numeric) but in the end,\
    \ $r will be a numeric.\n\n![2-4-2](Images/image00165.jpeg)\n\nPHP tries converting\
    \ string to number, when it cannot do it, it simply ignores and counts only 10\
    \ in the above expression to which is\\_numeric() becomes true. On the other hand,\
    \ a warning will be triggered by PHP to specify that it has encountered a non-numeric\
    \ value in a numerical expression!\n\n* * *\n\n**Mathematical Functions:**\n\n\
    PHP has a set of math functions that allows you to perform mathematical tasks\
    \ on numbers. We will discuss few of them here:\n\n*   pi() - to return the value\
    \ of pi\n\n*   min() - to return the lowest of values in the argument list\n\n\
    *   max() - to return the highest of values in the argument list\n\n*   abs()\
    \ - to return the absolute (positive) value of a number\n\n*   sqrt() - to return\
    \ the square root of a number\n\n*   round() - rounds a floating-point number\
    \ to its nearest integer\n\n*   rand() - generates a random number\n\n**Practice:**\n\
    \nWe will look into every function!\n\nWe will check rounding in 2 ways, to nearest\
    \ integer. Similarly, we will check generating random number between a minimum\
    \ and maximum limit!\n\n```\n//Mathematical Functions\n\necho \"<br>Value of pi\
    \ = \".pi();\necho \"<br>Highest of 12 25 9 = \".max(12,25,9);\necho \"<br>Lowest\
    \ of 12 25 9 = \".min(12,25,9);\necho \"<br>Absolute value of -5.97 = \".abs(-5.97);\n\
    echo \"<br>Square root of 625 = \".sqrt(625);\necho \"<br>Rounding to nearest\
    \ 7.58 = \".round(7.58);\necho \"<br>Rounding to nearest 7.08 = \".round(7.08);\n\
    echo \"<br>Generate a random number = \".rand();\necho \"<br>Generate a random\
    \ number between 30 and 60 = \".rand(30,60);\n```\n\n**Execute:**\n\nHope every\
    \ function has displayed the expected result!\n\n![2-4-3](Images/image00166.jpeg)\n\
    \nTest more examples for your understanding!\n\n* * *\n\n**String Functions:**\n\
    \nBefore getting into functions, we will first know about the **string concatenation\
    \ operator** called dot (.). Guess you would have seen this operator in echo statements\
    \ in the previous examples. The use of concatenation operator is to concatenate\
    \ or merge two strings!\n\nWe will look at some commonly used functions to manipulate\
    \ strings.\n\n**String Length:**\n\n*   strlen(string) function returns the length\
    \ of a string.\n\n*   The length of a string is often used in loops or other functions,\
    \ when it is important to know when the string ends.\n\n**Words Count:**\n\n*\
    \   str\\_word\\_count(string) function counts the number of words in a string.\n\
    \n**String Reverse:**\n\n*   strrev(string) function reverses a string.\n\n**String\
    \ Search**:\n\n*   strpos(string,search) function is used to search for a specific\
    \ string or character within a string.\n\n*   If a match is found in the string,\
    \ this function will return the position of the first match.\n\n*   If no match\
    \ is found, it will return FALSE.\n\n*   The position starts from 0 and not 1.\n\
    \n**String Replace:**\n\n*   str\\_replace(find,replace,string,count) function\
    \ replaces some characters with some other characters in a string.\n\n*   count\
    \ (optional parameter) is a variable that counts the number of replacements.\n\
    \n**Practice:**\n\nWe will look into all the above functions.\n\n```\n//String\
    \ Functions\n$str = \"Welcome to PHP\";\necho \"<br>Example String: \".$str;\n\
    echo \"<br>Length of string = \".strlen($str);\necho \"<br>Number of words in\
    \ string = \".str_word_count($str);\necho \"<br>Reverse of string = \".strrev($str);\n\
    echo \"<br>Search P position in string = \".strpos($str,\"P\");\necho \"<br>Replace\
    \ PHP with PHP Course = \".str_replace(\"PHP\",\"PHP Course\",$str);\n```\n\n\
    **Execute:**\n\n**![2-4-4](Images/image00167.jpeg)**\n\nLength is inclusive of\
    \ space characters. That is, space is also counted as a character. P position\
    \ in Welcome to PHP is 11 by means of starting the string with 0.\n\n* * *\n\n\
    **Date/Time Functions:**\n\nThough there are lots of discuss in this topic, we\
    \ will learn about working with date/time in PHP.\n\nThe date() function is used\
    \ to format a date and / or a time.\n\nThis function formats a timestamp to a\
    \ more readable date and time. A timestamp is a sequence of characters, denoting\
    \ the date and/or time at which a certain event occurred.\n\n**Syntax:**\n\n```\n\
    date(format,timestamp)\n```\n\nThere are 2 parameters:\n\nformat - It is a required\
    \ parameter. It specifies the format of the timestamp\n\ntimestamp - It is an\
    \ optional parameter to specify a timestamp. Default is the current date and time\n\
    \n**How to get a date?**\n\nHere are some characters that are commonly used for\
    \ date:\n\n*   d - Represents the day of the month (01 to 31)\n\n*   m - Represents\
    \ a month (01 to 12)\n\n*   Y - Represents a year (in four digits)\n\n*   l (lowercase\
    \ 'L') - Represents the day of the week\n\nOther characters, like \"/\", \".\"\
    , or \"-\" can also be inserted between the characters to add additional formatting.\n\
