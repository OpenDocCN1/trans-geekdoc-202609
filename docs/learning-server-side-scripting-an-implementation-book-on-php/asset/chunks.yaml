    ## How to create a time using the optional parameter?


    We have an optional parameter in the `date()` function. Using this, we can create
    a date/time and display it in a specified format. Let us learn to do it:


    ### Syntax


    ```php

    mktime(hour, minute, second, month, day, year);

    ```


    ### Practice


    ```php

    // Create a date

    $createdate = mktime(10, 54, 06, 11, 23, 2020);

    echo "Created date is 23-11-2020 10:54:06 am: " . date("M d, Y H:i:s", $createdate);

    ```


    ### Execute


    ![2-4-6](Images/image00169.jpeg)


    ## How to create a date from a string?


    We can create a date from a string using `strtotime()` function. This function
    is used to convert a human readable date string into a Unix timestamp (the number
    of seconds since January 1 1970 00:00:00 GMT).


    ### Syntax


    ```php

    strtotime(time, now)

    ```


    ### Practice


    We will see various examples on how to use `strtotime()` function. It will give
    you the possibilities on what to do with this function.


    ```php

    // Using strtotime() function (Code was executed in the year 2020)

    date_default_timezone_set("Asia/Kolkata");

    $today = strtotime("now");

    echo "<br>Today''s date in string: " . $today;

    echo "<br>Today''s date: " . date("l, M d Y, h:i:s A", $today);

    echo "<br>+5 hours from now: " . date("M d Y, h:i:s A", strtotime("+5 hours",
    $today));

    echo "<br>+1 week from now: " . date("M d Y, h:i:s A", strtotime("+1 week", $today));

    echo "<br>Next monday from now: " . date("M d Y, h:i:s A", strtotime("next Monday",
    $today));

    ```


    ### Execute


    We have used `strtotime()` function to manipulate date related queries. If you
    don’t use timezone, all timing will be in UTC format. Only when you get your system
    timezone, you can understand how the function works.


    If we do not use the `date()` function to format the date, `strtotime()` will
    not be readable. That is why we have included date formats in every line of code.
    To show how a string of date/time looks, we have just printed it in string format
    (the first line of output). When the string is displayed using `date()`, it is
    rendered as a readable date.


    ![2-4-7](Images/image00170.jpeg)


    ## Note


    Below is the list of formats a date can take:


    *   `d` - The day of the month (from 01 to 31)

    *   `D` - A textual representation of a day (three letters)

    *   `j` - The day of the month without leading zeros (1 to 31)

    *   `l` (lowercase ''L'') - A full textual representation of a day

    *   `N` - The ISO-8601 numeric representation of a day (1 for Monday, 7 for Sunday)

    *   `S` - The English ordinal suffix for the day of the month (2 characters st,
    nd, rd or th. Works well with `j`)

    *   `w` - A numeric representation of the day (0 for Sunday, 6 for Saturday)

    *   `z` - The day of the year (from 0 through 365)

    *   `W` - The ISO-8601 week number of year (weeks starting on Monday)

    *   `F` - A full textual representation of a month (January through December)

    *   `m` - A numeric representation of a month (from 01 to 12)

    *   `M` - A short textual representation of a month (three letters)

    *   `n` - A numeric representation of a month, without leading zeros (1 to 12)

    *   `t` - The number of days in the given month

    *   `L` - Whether it''s a leap year (1 if it is a leap year, 0 otherwise)

    *   `W` - The ISO-8601 year number

    *   `Y` - A four digit representation of a year

    *   `y` - A two digit representation of a year

    *   `a` - Lowercase am or pm

    *   `A` - Uppercase AM or PM

    *   `B` - Swatch Internet time (000 to 999)

    *   `g` - 12-hour format of an hour (1 to 12)

    *   `G` - 24-hour format of an hour (0 to 23)

    *   `h` - 12-hour format of an hour (01 to 12)

    *   `H` - 24-hour format of an hour (00 to 23)

    *   `i` - Minutes with leading zeros (00 to 59)

    *   `s` - Seconds, with leading zeros (00 to 59)

    *   `u` - Microseconds (added in PHP 5.2.2)

    *   `e` - The timezone identifier (Examples: UTC, GMT, Atlantic/Azores)

    *   `I` (capital i) - Whether the date is in daylights savings time (1 if Daylight
