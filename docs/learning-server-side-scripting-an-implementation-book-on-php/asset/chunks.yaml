    \nIn the learner’s dashboard, we can place links to enrolled courses, access to\
    \ courses, change profile and log out.\n\nWhatever page we create, we have two\
    \ options:\n\n*   to place all the links in every page\n\n*   to place all the\
    \ links in a single page (dashboard) and place the dashboard link in every page"
  fmt: "\n# Registration and Login Process\n\n## Registration - Redirect to Login\n\
    \nHope you have the file ready. We will include the code now. We will test it\
    \ after completing the login process.\n\nYou have an `if` block in the top PHP\
    \ segment:\n\n```php\nif($check_insert1 and $check_insert2){\n  echo \"<script>alert('Registration\
    \ successful!');</script>\";\n}\n```\n\nWe will issue a redirect command via JavaScript\
    \ in this `echo` statement. Why are we doing so? Since we get the success message\
    \ via this `alert()`, we have to induce a redirect after this message. If we code\
    \ in PHP for redirection, this alert message will be missed. For the safer side,\
    \ we will code in JS.\n\nChange the code as:\n\n```php\nif($check_insert1 and\
    \ $check_insert2){\n  echo \"<script>alert('Registration successful!');\n  window.location.replace('login.php');</script>\"\
    ;\n}\n```\n\nThis code states that the current page has to be replaced with the\
    \ URL in the parameter.\n\n## Login Process\n\nWe will design a login form and\
    \ then include PHP code as usual. On successful login, we will redirect to `dashboard.php`.\
    \ Let us start.\n\n### Design Form: login.php\n\nChange the `title` tag content\
    \ to \"User Login\" and replace the `main` tag element with the code below:\n\n\
    ```html\n<main>\n  <section>\n    <h3> User Login </h3>\n    <p>\n      <form\
    \ method=\"post\" name=\"frmlogin\">\n        <p><input type=\"email\" name=\"\
    txtuser\" size=\"40\" placeholder=\"Enter your email\"></p>\n        <p><input\
    \ type=\"password\" name=\"txtpwd\" size=\"40\" placeholder=\"Enter your password\"\
    ></p>\n        <p><input type=\"submit\" name=\"login\" value=\"Login\" class=\"\
    frmbtn\"></p>\n      </form>\n    </p>\n  </section>\n</main>\n```\n\nDo not enter\
    \ any detail! Just execute for seeing the page: <http://localhost/onlinecourse/login.php>\n\
    \n![8-1-1](Images/image00340.jpeg)\n\n### Authentication code: login.php\n\nWe\
    \ will include the authentication part at the top of the page as usual.\n\n```php\n\
    <?php\nsession_start();\nrequire('connect.php');\n$auth = true;\n$hashedpwd =\
    \ '';\nif(isset($_POST['login'])){\n  $username = $_POST['txtmail'];\n  $password\
    \ = $_POST['txtpwd'];\n  $select_user = mysqli_query($con,\"SELECT * FROM userlogin\
    \ WHERE user_mail='$username'\");\n  if($user = mysqli_fetch_row($select_user)){\n\
    \    $hashedpwd = $user[1];\n  }\n  else{\n    $auth = false;\n  }\n  if(!password_verify($password,$hashedpwd)){\n\
    \    $auth = false;\n  }\n  if($auth){\n    $_SESSION['usersession'] = $username;\n\
    \    echo \"<script>window.location.replace('dashboard.php')</script>\";\n  }\n\
    \  else{\n    echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n  } \n}\n?>\n```\n\nWe will look at the explanation:\n\n```php\nsession_start();\n\
    ```\n\nWe will use `session_start()` for this authentication because we have to\
    \ store the username as the session variable. It means, until the user logs out\
    \ / closes the session, the session variable will be alive.\n\n```php\n$auth =\
    \ true;\n$hashedpwd = '';\n```\n\nWe initialize two variables. `$auth` will hold\
    \ `true` till the end of code if username and password match database records.\
    \ If `$auth` becomes `false` somewhere, it means either username or password does\
    \ not match, which means authentication fails. `$hashedpwd` will later hold the\
    \ password field if the username matches.\n\n```php\n$select_user = mysqli_query($con,\"\
    SELECT * FROM userlogin WHERE user_mail='$username'\");\nif($user = mysqli_fetch_row($select_user)){\n\
    \  $hashedpwd = $user[1];\n}\nelse{\n  $auth = false;\n}\n```\n\nWe search the\
    \ record of the `userlogin` table which matches the username.\n\n*   If a user\
    \ exists with the username, the password field is assigned to the `$hashedpwd`\
    \ variable.\n*   If a user does not exist with the username, the `$auth` variable\
    \ is set to `false`.\n\n```php\nif(!password_verify($password,$hashedpwd)){\n\
    \  $auth = false;\n}\n```\n\nWe compare the password entered in the form to the\
    \ hashed password stored in the table. We use the `password_verify()` function\
    \ designated for this purpose exclusively. In case there is no match between passwords,\
    \ `$auth` turns to `false`.\n\n```php\nif($auth){\n  $_SESSION['usersession']\
    \ = $username;\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
    ;\n}\nelse{\n  echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n}\n```\n\nIf `$auth` holds `true` under all those checks, we assign the `$username`\
    \ value to a session variable `$_SESSION['usersession']`. After this, we redirect\
    \ to the dashboard page. If `$auth` turns `false` in any of the checks, we print\
    \ an invalid login message.\n\n### When does $auth turn false?\n\n*   When a username\
    \ does not exist\n*   When the entered password does not match with the hashed\
    \ password value already stored in the table (checked via `password_verify()`\
    \ function)\n\nThe login part is over here. We will do a few changes in `dashboard.php`\
    \ so that we can display the session variable value in this page from the login\
    \ page.\n\n## Session variable: dashboard.php\n\nChange the `title` tag content\
    \ to \"User Dashboard\".\n\nPlace the following lines at the top of the page:\n\
    \n```php\n<?php\nsession_start();\nrequire('connect.php');\n?>\n```\n\nIt is advisable\
    \ to place `session_start()` at the beginning of the page.\n\nAs usual, replace\
    \ the `main` tag content with the code:\n\n```php\n<main>\n  <section>\n    <h3>\
    \ User Dashboard </h3>\n    <p>\n      <?php \n      $usersession = '';\n    \
    \  if(isset($_SESSION['usersession'])){\n        $usersession = $_SESSION['usersession'];\n\
    \      }\n      echo \"<p>Hello \".$usersession.\"</p>\";\n      ?>\n    </p>\n\
    \  </section>\n</main>\n```\n\nWe have just assigned the session variable value\
    \ to a variable `$usersession` and printed the same.\n\n## Execution\n\nShall\
    \ we check the complete process now?\n\nThis time, we will:\n\n*   Register a\
    \ learner\n*   Login the learner\n*   See the learner's username in the dashboard\
    \ page\n\nWe have to execute this as an application. So we will travel to the\
    \ registration page from the home page.\n\n*   Go to <http://localhost/onlinecourse/>\n\
    *   Click Login\n*   Click Register here link.\n\nLet me sign up / register as\
    \ a learner this time:\n\nDetails to be entered:\n\n*   Who are you? Learner\n\
    *   Email - learner1@onlinecourse.com\n*   Password - password\n*   Full Name\
    \ - Learner 1\n*   Details - First learner of this platform\n\nLet me show the\
    \ process.\n\n*This is a GIF image. Make sure GIF is supported in your device.*\n\
    \n![1604664851-registration-login](Images/image00341.gif)\n\nHope you also have\
    \ the same flow of application without any bugs in between.\n\nDo not forget to\
    \ check phpMyAdmin - `learners` and `userlogin` tables!\n\n![8-1-2](Images/image00342.jpeg)\n\
    \n![8-1-3](Images/image00343.jpeg)\n\n## How to redirect to dashboard if a session\
    \ is running?\n\nWe have one more task to do. In case you close a browser's tab\
    \ unknowingly, but your session is still not expired, we have to redirect the\
    \ login page to the dashboard without asking for login details once more.\n\n\
    So, we will add this code to the beginning of the **login.php** file:\n\n```php\n\
    session_start();\nif(isset($_SESSION['usersession'])){\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
    ;\n}\nrequire('connect.php');\n```\n\n*   Execute <http://localhost/onlinecourse/>\
    \ in 2 tabs of a browser.\n*   Try logging in one tab of the browser.\n*   Click\
    \ Login in the other tab of the browser. You will be redirected to `dashboard.php`.\n\
    \nWe have to make many more changes to the dashboard page. We will do it in the\
    \ next section.\n\n# 8.2 User Dashboard\n\nDashboard is the place from where you\
    \ can access all the necessary links.\n\nIn the instructor's dashboard, we can\
    \ place links to create course, edit course, upload / delete content, view enrolled\
    \ learner's progress reports, change profile and log out.\n\nIn the learner's\
    \ dashboard, we can place links to enrolled courses, access to courses, change\
    \ profile and log out.\n\nWhatever page we create, we have two options:\n\n* \
    \  To place all the links in every page\n*   To place all the links in a single\
    \ page (dashboard) and place the dashboard link in every page\n"
  trans: "\n\n# 注册与登录流程\n\n## 注册 - 重定向到登录\n\n希望你已准备好文件。我们现在将包含代码。完成登录流程后我们将进行测试。\n\
    \n在顶部的 PHP 代码段中有一个 `if` 代码块：\n\n```php\nif($check_insert1 and $check_insert2){\n\
    \  echo \"<script>alert('Registration successful!');</script>\";\n}\n```\n\n我们将在此\
    \ `echo` 语句中通过 JavaScript 发出重定向命令。为什么要这样做？因为我们通过此 `alert()` 获取成功消息，所以必须在此消息之后触发重定向。如果我们在\
    \ PHP 中编写重定向代码，这条警报消息将会被错过。为了稳妥起见，我们将使用 JS 编写。\n\n将代码更改为：\n\n```php\nif($check_insert1\
    \ and $check_insert2){\n  echo \"<script>alert('Registration successful!');\n\
    \  window.location.replace('login.php');</script>\";\n}\n```\n\n这段代码表示当前页面必须替换为参数中的\
    \ URL。\n\n## 登录流程\n\n我们将设计一个登录表单，然后像往常一样包含 PHP 代码。登录成功后，我们将重定向到 `dashboard.php`。让我们开始吧。\n\
    \n### 设计表单：login.php\n\n将 `title` 标签的内容更改为 \"User Login\"，并用以下代码替换 `main` 标签元素：\n\
    \n```html\n<main>\n  <section>\n    <h3> User Login </h3>\n    <p>\n      <form\
    \ method=\"post\" name=\"frmlogin\">\n        <p><input type=\"email\" name=\"\
    txtuser\" size=\"40\" placeholder=\"Enter your email\"></p>\n        <p><input\
    \ type=\"password\" name=\"txtpwd\" size=\"40\" placeholder=\"Enter your password\"\
    ></p>\n        <p><input type=\"submit\" name=\"login\" value=\"Login\" class=\"\
    frmbtn\"></p>\n      </form>\n    </p>\n  </section>\n</main>\n```\n\n不要输入任何详细信息！仅执行以查看页面：\
    \ <http://localhost/onlinecourse/login.php>\n\n![8-1-1](img/image00340.jpeg)\n\
    \n### 认证代码：login.php\n\n我们将像往常一样在页面顶部包含认证部分。\n\n```php\n<?php\nsession_start();\n\
    require('connect.php');\n$auth = true;\n$hashedpwd = '';\nif(isset($_POST['login'])){\n\
    \  $username = $_POST['txtmail'];\n  $password = $_POST['txtpwd'];\n  $select_user\
    \ = mysqli_query($con,\"SELECT * FROM userlogin WHERE user_mail='$username'\"\
    );\n  if($user = mysqli_fetch_row($select_user)){\n    $hashedpwd = $user[1];\n\
    \  }\n  else{\n    $auth = false;\n  }\n  if(!password_verify($password,$hashedpwd)){\n\
    \    $auth = false;\n  }\n  if($auth){\n    $_SESSION['usersession'] = $username;\n\
    \    echo \"<script>window.location.replace('dashboard.php')</script>\";\n  }\n\
    \  else{\n    echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n  } \n}\n?>\n```\n\n我们来看看解释：\n\n```php\nsession_start();\n```\n\n我们将为此认证使用\
    \ `session_start()`，因为我们必须将用户名存储为会话变量。这意味着，直到用户注销/关闭会话，会话变量将保持活跃。\n\n```php\n\
    $auth = true;\n$hashedpwd = '';\n```\n\n我们初始化两个变量。如果用户名和密码与数据库记录匹配，`$auth` 将保持\
    \ `true` 直到代码结束。如果 `$auth` 在某处变为 `false`，则意味着用户名或密码不匹配，即认证失败。`$hashedpwd` 稍后将保存用户名匹配时的密码字段。\n\
    \n```php\n$select_user = mysqli_query($con,\"SELECT * FROM userlogin WHERE user_mail='$username'\"\
    );\nif($user = mysqli_fetch_row($select_user)){\n  $hashedpwd = $user[1];\n}\n\
    else{\n  $auth = false;\n}\n```\n\n我们搜索 `userlogin` 表中与用户名匹配的记录。\n\n*   如果存在该用户名的用户，则将密码字段赋值给\
    \ `$hashedpwd` 变量。\n*   如果不存在该用户名的用户，则将 `$auth` 变量设置为 `false`。\n\n```php\nif(!password_verify($password,$hashedpwd)){\n\
    \  $auth = false;\n}\n```\n\n我们将表单中输入的密码与表中存储的哈希密码进行比较。我们使用专门为此目的设计的 `password_verify()`\
    \ 函数。如果密码不匹配，`$auth` 将变为 `false`。\n\n```php\nif($auth){\n  $_SESSION['usersession']\
    \ = $username;\n  echo \"<script>window.location.replace('dashboard.php')</script>\"\
    ;\n}\nelse{\n  echo \"<script>alert('Invalid username or password!')</script>\"\
    ;\n}\n```\n\n如果 `$auth` 在所有这些检查下都保持 `true`，我们将 `$username` 的值赋给会话变量 `$_SESSION['usersession']`。在此之后，我们重定向到仪表板页面。如果\
    \ `$auth` 在任何检查中变为 `false`，我们将打印无效登录消息。\n\n### $auth 何时变为 false？\n\n*   当用户名不存在时\n\
    *   当输入的密码与表中已存储的哈希密码值不匹配时（通过 `password_verify()` 函数检查）\n\n登录部分到此结束。我们将对 `dashboard.php`\
    \ 进行一些更改，以便在此页面显示从登录页面传来的会话变量值。\n\n## 会话变量：dashboard.php\n\n将 `title` 标签的内容更改为\
    \ \"User Dashboard\"。\n\n将以下代码行放在页面顶部：\n\n```php\n<?php\nsession_start();\nrequire('connect.php');\n\
    ?>\n```\n\n建议将 `session_start()` 放在页面开头。\n\n像往常一样，用以下代码替换 `main` 标签内容：\n\n```php\n\
    <main>\n  <section>\n    <h3> User Dashboard </h3>\n    <p>\n      <?php \n  \
    \    $usersession = '';\n      if(isset($_SESSION['usersession'])){\n        $usersession\
    \ = $_SESSION['usersession'];\n      }\n      echo \"<p>Hello \".$usersession.\"\
    </p>\";\n      ?>\n    </p>\n  </section>\n</main>\n```\n\n我们只是将会话变量的值赋给变量 `$usersession`\
    \ 并将其打印出来。\n\n## 执行\n\n现在我们来检查一下完整流程吧？\n\n这次，我们将：\n\n*   注册一名学习者\n*   登录该学习者\n\
    *   在仪表板页面查看学习者的用户名\n\n我们必须将其作为一个应用程序来执行。所以我们将从主页跳转到注册页面。\n\n*   访问 <http://localhost/onlinecourse/>\n\
    *   点击 Login\n*   点击 Register here 链接。\n\n让我以学习者身份注册/报名：\n\n要输入的详细信息：\n\n*   Who\
    \ are you? Learner（你是谁？ 学习者）\n*   Email - learner1@onlinecourse.com\n*   Password\
    \ - password\n*   Full Name - Learner 1\n*   Details - First learner of this platform\n\
    \n让我展示这个过程。\n\n*这是一个 GIF 图片。请确保您的设备支持 GIF。*\n\n![1604664851-registration-login](img/image00341.gif)\n\
    \n希望你也拥有相同的应用流程，中间没有任何 Bug。\n\n别忘了检查 phpMyAdmin - `learners` 和 `userlogin` 表！\n\
    \n![8-1-2](img/image00342.jpeg)\n\n![8-1-3](img/image00343.jpeg)\n\n## 如果会话正在运行，如何重定向到仪表板？\n\
    \n我们还有一项任务要做。万一你不知不觉关闭了浏览器标签页，但你的会话仍未过期，我们必须将登录页面重定向到仪表板，而无需再次询问登录详细信息。\n\n因此，我们将在\
    \ **login.php** 文件开头添加此代码：\n\n```php\nsession_start();\nif(isset($_SESSION['usersession'])){\n\
    \  echo \"<script>window.location.replace('dashboard.php')</script>\";\n}\nrequire('connect.php');\n\
    ```\n\n*   在浏览器的 2 个标签页中执行 <http://localhost/onlinecourse/>。\n*   尝试在浏览器的一个标签页中登录。\n\
    *   在浏览器的另一个标签页中点击 Login。你将被重定向到 `dashboard.php`。\n\n我们还必须对仪表板页面进行更多更改。我们将在下一节中进行。\n\
    \n# 8.2 用户仪表板\n\n仪表板是你可以从中访问所有必要链接的地方。\n\n在讲师的仪表板中，我们可以放置创建课程、编辑课程、上传/删除内容、查看已注册学习者进度报告、更改个人资料和注销的链接。\n\
    \n在学习者的仪表板中，我们可以放置已注册课程、访问课程、更改个人资料和注销的链接。\n\n无论我们创建哪个页面，我们有两个选择：\n\n*   在每个页面中放置所有链接\n\
    *   在单个页面（仪表板）中放置所有链接，并在每个页面中放置仪表板链接\n\n"
