    \n要处理 PHP 脚本，我们需要一个服务器（在我们的例子中是 Apache)。永远不要忘记这一点！\n\n在本书的其余部分中，\n\n*   当我提到**保存**文件时，请确保将其保存在路径\
    \ - `C:/xampp/htdocs/PracticePHP` 中\n*   当我提到**执行**脚本/文件时，意味着你必须使用浏览器，通过 URL -\
    \ `http://localhost/PracticePHP` 来访问它\n\n至此，我想你已经了解了什么是 PHP、如何使用 XAMPP 安装 PHP\
    \ 以及如何测试代码！从这里开始，你将学习 PHP 中的编程结构。尝试执行所有代码片段以确保动手经验！\n\n祝学习愉快，编码愉快！！！\n\n---\n\n\
