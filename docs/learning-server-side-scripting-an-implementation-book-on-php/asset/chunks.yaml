    \n2\\. Check for all spelling errors\n\nNow, it’s time to remove the else part\
    \ of the connection code. Let us keep it as:\n\n```\nconnect.php\n<?php\n$host\
    \ = \"localhost\";\n$username = \"ocuser\";\n$password = \"Pass@OC20\";\n$database\
