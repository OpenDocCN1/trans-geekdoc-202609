- raw: "We will practise these operators now! Hope you have opened a new file section3.php\n\
    \n```\n//Operators\n$x = 10;\n$y = 20;\necho \"<br>Values of $x = \".$x.\" and\
    \ $y = \".$y;\n\necho \"<br>Arithmetic Operators \";\necho \"<br>Addition: $x\
    \ + $y = \".($x + $y);\necho \"<br>Division: $y / $x = \".($y / $x);\necho \"\
    <br>Modulus: $y % $x = \".($y % $x);\n\necho \"<br><br>Assignment Operators \"\
    ;\n$x += $y;\necho \"Value of $x after $x += $y = \".$x;\n\necho \"<br><br>Comparison\
    \ Operators \";\necho \"<br>Values of $x = \".$x.\" and $y = \".$y;\necho \"<br>\
    \ $x is greater than $y? \".($x > $y);\necho \"<br> Spaceship operator: $x<=>$y\
    \ \".($x <=> $y);\n$z1 = 55;\n$z2 = \"55\";\necho \"<br> $z1 is integer 55 and\
    \ $z2 is string 55\";\necho \"<br> Checking $z1 == $z2 Answer: \".($z1 == $z2);\n\
    echo \"<br> Checking $z1 === $z2 Answer: \".($z1 === $z2);\n\necho \"<br><br>Increment/Decrement\
    \ Operators\";\necho \"<br> $x Value: \".$x;\necho \"<br>Pre-increment ++$x =\
    \ \".++$x;\necho \"<br>Post-increment $x++ = \".$x++;\necho \"<br> $x after post-increment:\
    \ \".$x;\n```\n\n**Execute:**\n\nThe post increment operator returns the value\
    \ of the variable $x and then increments it by one. That is why $x value stays\
    \ as 31 and then the subsequent statement prints $x as 32.\n\n![3-1-1](Images/image00193.jpeg)\n\
    \n**Logical Operators:**\n\nThe logical operators are used to combine conditional\
    \ statements.\n\n![3-1-logical](Images/image00194.jpeg)\n\n**String Operators:**\n\
    \nThere are 2 operators for strings specially. We have seen one of them in echo\
    \ statements.\n\n![3-1-string](Images/image00195.jpeg)\n\n**Array Operators:**\n\
    \nThey are used to compare arrays. Some operators are similar to comparison operators.\n\
    \n![3-1-array](Images/image00196.jpeg)\n\n**Conditional Assignment Operators:**\n\
    \nThey are used to set a value depending on conditions.\n\n![3-1-conditional](Images/image00197.jpeg)\n\
    \n**Practice:**\n\nWe will practise the next set of operators. The real use of\
    \ operators can be found in the upcoming sections of this chapter.\n\n```\n//Operators:\n\
    $x = 5;\n$y = 10;\necho \"<br>Values of $x = \".$x.\" and $y = \".$y;\n\necho\
    \ \"<br>Logical Operators \";\n$z1 = $x > $y;\n$z2 = $x < $y;\necho \"<br> Either\
    \ of z1 or z2 is true - \".($z1 or $z2);\n\n$test = ($x > $y) ? '$x is greater'\
    \ : '$y is greater';\necho \"<br><br>Ternary Operator: \".$test;\n\necho \"<br><br>String\
    \ Operators \";\n$str1 = \"Hello\";\n$str2 = \"World\";\necho \"<br> str1 - \"\
    .$str1.\" str2 = \".$str2;\necho \"<br> Concatenation = \".$str1.\" \".$str2;\n\
    $str1 .= $str2;\necho \"<br> Concatenation assigned to str1 - \".$str1;\n\n$a\
    \ = array(10,12,15);\n$b = array(15,10,12);\necho \"<br><br>Array Operators:\"\
    ;\necho \"<br>Checking $a == $b - \".($a == $b);\n```\n\n**Execute:**\n\nThe array\
    \ operator will return false because arrays $a and $b do not have the same indices\
    \ but only values!\n\nThat is, a\\[0\\] = 10, a\\[1\\] = 12, a\\[2\\] = 15 and\
    \ b\\[0\\] = 15, b\\[1\\] = 10, b\\[2\\] = 12.\n\nIt means, a\\[0\\] != b\\[0\\\
    ], a\\[1\\] != b\\[1\\], a\\[2\\] != b\\[2\\]\n\n![3-1-2](Images/image00198.jpeg)\n\
    \nI think you have got some clarity on operators. The next section is for conditional\
    \ statements. We will use operators in those statements!\n\n* * *\n\n### 3.2 Conditional\
    \ Statements\n\n* * *\n\nSometimes, you would like to execute a set of code (code\
    \ block) only when it satisfies a condition. You can use conditional statements\
    \ in your code for this purpose.\n\n**Conditional statements are used to perform\
    \ actions based on the specified conditions.**\n\nIn PHP we have the following\
    \ conditional statements:\n\n*   if statement\n\n*   if...else statement\n\n*\
    \   if...elseif...else statement\n\n*   switch statement\n\nWe will look into\
    \ the syntax of these statements and then go into practice session.\n\n**if Statement**\n\
    \nIt executes a code block if a condition is true.\n\n**Syntax**\n\n```\nif (condition)\
    \ {\n  code to be executed if condition is true;\n}\n```\n\n**if...else Statement**\n\
    \nIt executes one code block if a condition is true or another code block if that\
    \ condition is false.\n\n**Syntax**\n\n```\nif (condition) {\n  code to be executed\
    \ if condition is true;\n} else {\n  code to be executed if condition is false;\n\
    }\n```\n\n**if...elseif...else Statement**\n\nIt executes different code blocks\
    \ for each of the specified conditions.\n\n**Syntax**\n\n```\nif (condition) {\n\
    \  code to be executed if this condition is true;\n} elseif (condition) {\n  code\
    \ to be executed if first condition is false and this condition is true;\n} else\
    \ {\n  code to be executed if all conditions are false;\n}\n```\n\n**Practice:**\n\
    \nConditions are nothing but expressions.\n\n```\n//Conditionals\n$x = 10;\n$y\
    \ = 15;\n$z = 5;\nif($x > $y){\n echo \"x is greater than y\";\n }\n elseif ($x\
    \ > $z) {\n  echo \"x is greater than z\";\n }\n else {\n  echo \"x is the least\
    \ value\";\n}  \n```\n\n**Execute:**\n\nIn the above example code segment, x is\
    \ not greater than y, so we check the elseif condition, which turns to be true.\
    \ And so, the statement inside the elseif block gets executed.\n\nTry executing\
    \ the same code with different values of x, so that you can clearly understand\
    \ how a condition is satisfied and how the associated block of code gets executed.\n\
    \n![3-2-1](Images/image00199.jpeg)\n\n**switch Statement**\n\nWe use the switch\
    \ statement to **select one of many blocks of code to be executed**. In fact,\
    \ it actually resembles the execution of if…elseif…else statement except that\
    \ instead of condition, we check with the result of the expression.\n\n**Syntax**\n\
    \n```\nswitch (n) {\n  case label1:\n    code to be executed if n=label1;\n  \
    \  break;\n  case label2:\n    code to be executed if n=label2;\n    break;\n\
    \  case label3:\n    code to be executed if n=label3;\n    break;\n    ...\n \
    \ default:\n    code to be executed if n is different from all labels;\n}\n```\n\
    \nLet me explain you the working:\n\n*   We have a single expression *n* (most\
    \ often a variable), that is evaluated once.\n\n*   The value of the expression\
    \ is then compared with the values for each case in the structure.\n\n*   If there\
    \ is a match, the block of code associated with that case is executed.\n\n*  \
    \ Use break to prevent the code from running into the next case automatically.\n\
    \n*   If you miss the break statement, the cases following the match will be executed.\n\
    \n*   The default statement is used if no match is found.\n\n**Practice:**\n\n\
    ```\n$n = 80;\nswitch($n){\n  case $n > 90: echo \"Distinction\"; break;\n  case\
    \ $n > 80: echo \"First Class\"; break;\n  case $n > 70: echo \"Second Class\"\
    ; break;\n  case $n < 40: echo \"Not completed\";break;\n  default: echo \"Completed\
    \ Course\";\n}\n```\n\n**Execute:**\n\nWe will execute the code as it is!\n\n\
    ![3-2-2](Images/image00200.jpeg)\n\nRemove the break statement as below and execute:\n\
    \n```\ncase $n > 70: echo \"Second Class\";\n```\n\n![3-2-3](Images/image00201.jpeg)\n\
    \nCan you understand the need for break statement? If you don’t specify, the cases\
    \ following the matched case keeps executing. What happens when no cases are matched?\
    \ The default case gets executed!\n\nTry changing value of n = 50 because cases\
    \ exist for n > 70 and n < 40.\n\n```\nn = 50;\n```\n\n![3-2-4](Images/image00202.jpeg)\n\
    \nHope you are clear with conditional statements. We also call them as branching\
    \ statements since the conditions are like branches. When a condition is satisfied,\
    \ that associated branch of code is alone executed.\n\n* * *\n\n### 3.3 Loop Statements\n\
    \n* * *\n\nSometimes you want the same block of code to run a certain number of\
    \ times. You can make use of loops instead of repeating the code lines multiple\
    \ times.\n\n**Loops are used to execute the same block of code again and again,\
    \ as long as a certain condition is true.**\n\nIn PHP, we have the following loop\
    \ types:\n\n*   while\n\n*   do...while\n\n*   for\n\n*   foreach\n\nWe will look\
    \ the syntax of each loop and practise the same.\n\n**while Loop**\n\nThe while\
    \ loop executes a block of code as long as the specified condition is true.\n\n\
    **Syntax**\n\n```\nwhile (condition is true) {\n  code to be executed;\n}\n```\n\
    \nOnce the condition in the while is evaluated to true, the code between the braces\
    \ gets executed. If the condition evaluates to false, the code block does not\
    \ get executed.\n\n**Practice:**\n\nWe will find the sum of 5 test marks!\n\n\
    *   Marks of 5 tests are stored in $marks array."
