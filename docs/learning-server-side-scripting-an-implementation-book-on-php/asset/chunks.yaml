    \ will again use arrays. There, we will traverse arrays using loops and you will\
    \ find them far batter.\n\n**Built-in Functions of Arrays:**\n\nWe will discuss\
    \ two built-in functions of array here:\n\n**Length of Array:**\n\nThe count()\
    \ function is used to return the length (the number of elements) of an array.\n\
    \n**Practice:**\n\n```\n//Declare arrays\n$scores = array();\n$scores1 = array(56,\
