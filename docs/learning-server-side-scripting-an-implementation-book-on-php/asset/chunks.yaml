    # 日期/时间函数


    虽然关于此主题有很多可讨论的内容，但我们将学习在 PHP 中处理日期/时间。


    `date()` 函数用于格式化日期和/或时间。


    此函数将时间戳格式化为更易读的日期和时间。时间戳是一串字符，表示某一事件发生的日期和/或时间。


    ## 语法


    ```php

    date(format, timestamp)

    ```


    有 2 个参数：


    *   **format** - 这是一个必需参数。它指定时间戳的格式

    *   **timestamp** - 这是一个可选参数，用于指定时间戳。默认为当前日期和时间


    ## 如何获取日期？


    以下是日期常用的一些字符：


    *   `d` - 表示月份中的第几天（01 到 31）

