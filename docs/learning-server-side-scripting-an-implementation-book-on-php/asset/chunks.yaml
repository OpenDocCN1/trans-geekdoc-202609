- raw: "Let us use this in code:\n\n```\n$filecontent = fopen(\"test.txt\",\"r\");\n\
    echo fread($filecontent,filesize(\"test.txt\"));\n```\n\nOn executing, we get\
    \ the output:\n\n![4-1-6](Images/image00224.jpeg)\n\n*   filesize(file) is a function\
    \ to return the number of bytes of the file.\n\n**Reading Functions:**\n\nWe will\
    \ look upon few functions to read:\n\n*   read single line: fgets()\n\n*   read\
    \ single character: fgetc()\n\n*   check end-of-file: feof()\n\n**fgets() function:**\n\
    \nThe fgets() function is used to read a single line from a file.\n\nLet us practise\
    \ this code:\n\n```\n$filecontent = fopen(\"test.txt\",\"r\");\necho fgets($filecontent);\n\
    fclose($filecontent);\n```\n\nWhenever there is a call to fgets() function, the\
    \ pointer moves to the next line. Since there is single fgets() function, one\
    \ line is alone read.\n\n![4-1-7](Images/image00225.jpeg)\n\n**fgetc() function:**\n\
    \nThe fgetc() function is used to read a single character from a file.\n\nLet\
    \ us practise this code:\n\n```\n$filecontent = fopen(\"test.txt\",\"r\");\necho\
    \ fgetc($filecontent);\nfclose($filecontent);\n```\n\nAfter a call to the fgetc()\
    \ function, the file pointer moves to the next character. Since fgetc() is called\
    \ once, one character is alone read!\n\n![4-1-8](Images/image00226.jpeg)\n\n**What\
    \ do you do when you wish to read the file till the end?**\n\n**feof() function:**\n\
    \nThe feof() function checks if the \"end-of-file\" (EOF) has been reached. It\
    \ is useful for looping through data of unknown length.\n\nLet us practise this\
    \ code:\n\n```\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"<p>Printing\
    \ character by character </p>\";\nwhile(!feof($filecontent)){\n    echo fgetc($filecontent);\n\
    }\nfclose($filecontent);\n\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"\
    <p>Printing line by line </p>\";\nwhile(!feof($filecontent)){\n    echo \"<p>\"\
    .fgets($filecontent). \"</p>\";\n}\nfclose($filecontent);\n```\n\nWe close the\
    \ file after fgets() and open it again. Why? Once the first while loop reaches\
    \ the end of the file, it cannot point back to the beginning. So, we close and\
    \ then open the file again for reading to execute fgetc() in wile loop.\n\nLet\
    \ us execute the same:\n\n![4-1-9](Images/image00227.jpeg)\n\nHope you understand\
    \ why we check feof() in the while loop. The reason is in order to read all the\
    \ lines (using fgets()) and all the characters (fgetc()), we use !feof() inside\
    \ while, as a condition instructing the loop to continue till the end of the file.\n\
    \n**Note:**\n\n**What happens if you open a non-existing file?**\n\nShall we try\
    \ this?\n\n```\n$newfile = fopen(\"newtest.txt\",\"r\");\n```\n\nWhat is the output?\n\
    \n![4-1-10](Images/image00228.jpeg)\n\nThere is a way to give an information to\
    \ the user that a file is not existing:\n\n```\n$newfile = fopen(\"newtest.txt\"\
    ,\"r\") or die(\"Unable to open file!\");\n```\n\n![4-1-11](Images/image00229.jpeg)\n\
    \nThis die statement can get executed when:\n\n*   the file does not exist\n\n\
    *   the file is not granted access to be opened\n\nIt will end the script immediately.\n\
    \nWith this, file handling section comes to an end!\n\n* * *\n\n### 4.2 Superglobals\n\
    \n* * *\n\nSome predefined variables exist in PHP where they are always accessible,\
    \ regardless of scope - you can access them from any function, class or file without\
    \ having to do anything special. These variables are called superglobal variables\
    \ or simply superglobals.\n\nThe PHP superglobal variables are:\n\n*   $\\_GLOBALS\n\
    \n*   $\\_SERVER\n\n*   $\\_REQUEST\n\n*   $\\_POST\n\n*   $\\_GET\n\n*   $\\\
    _FILES\n\n*   $\\_ENV\n\n*   $\\_COOKIE\n\n*   $\\_SESSION\n\n**Superglobal variables\
    \ are built-in variables that are always available in all scopes.**\n\nWe will\
    \ not discuss every variable in this chapter itself. An introduction will be given\
    \ to all, the real usage will be dealt in this chapter and in the next chapter.\n\
    \n**$\\_GLOBALS:**\n\n$GLOBALS is used to access global variables from anywhere\
    \ in the PHP script. We used these variables while discussing variables scope\
    \ in functions. Hope you remember!\n\n**S\\_SERVER:**\n\n$\\_SERVER holds information\
    \ about headers, paths, and script locations. $\\_SERVER superglobal variable\
    \ has many elements to get description about server and server related entities.\n\
    \nYou will find a list of elements to be used with $\\_SERVER:\n\n![4-2-superglobals](Images/image00230.jpeg)\n\
    \nWe will test a few elements in practice session:\n\n```\necho \"Server Address:\
    \ \".$_SERVER['SERVER_ADDR'];\necho \"<br>Server Name: \".$_SERVER['SERVER_NAME'];\n\
    ```\n\n![4-2-1](Images/image00231.jpeg)\n\nWe have 3 superglobal variables which\
    \ are used to collect and pass data from a form. We will just know in one line\
    \ as of now and look them in depth in the next section.\n\n**$\\_REQUEST:**\n\n\
    $\\_REQUEST is used to collect data after submitting an HTML form.\n\n**$\\_POST:**\n\
    \n$\\_POST is used to collect form data after submitting an HTML form using method=\"\
    post\".\n\n**$\\_GET:**\n\n$\\_GET is used to collect form data after submitting\
    \ an HTML form using method=\"get\".\n\n**$\\_ENV:**\n\n$\\_ENV is used to return\
    \ the environment variables from the web server. For learning purpose, we will\
    \ go with an example now:\n\n```\necho 'Username: ' .$_ENV['USER'];\n```\n\n![4-2-2](Images/image00232.jpeg)\n\
    \nIt is an error! No issues!\n\nLet us debug the error! Undefined index: It means\
    \ we have to define an index USER!\n\nWe will now modify the code as:\n\n```\n\
    $_ENV['USER'] = $_SERVER['SERVER_NAME'];\n\necho 'Username: ' .$_ENV['USER'];\n\
    ```\n\n![4-2-3](Images/image00233.jpeg)\n\nThat's all!\n\nWe will discuss $\\\
    _FILES later in this chapter. We will discuss $\\_COOKIE and $\\_SESSION in the\
    \ next chapter.\n\nLet us move to the next section!\n\n* * *\n\n### 4.3 Working\
    \ with Forms\n\n* * *\n\nWe will be developing a web application using a project\
    \ title from Chapter-6. So, we will now design some forms for that application\
    \ and through that we will learn how to work with forms using php. Got it? Let’s\
    \ start then!\n\nI will just give you a small intro on what the project is all\
    \ about.\n\n**Project:** We will go with **online course** web application.\n\n\
    In this online course application, we will have instructors who teach courses\
    \ and learners who learn those stuff.\n\nBasically, we have 2 users: instructor\
    \ and learner. Same way, we have 2 more things: course and its content.\n\nWe\
    \ will simply design forms and use them to learn about certain superglobals discussed\
    \ in the previous section.\n\nRemember, we do not validate any data in the form,\
    \ we are just learning how to send and retrieve form data.\n\n**Designing a Form:**\n\
    \nLet us design a form for instructor sign up (registration of instructor):\n\n\
    From here, we will create a folder for this project and work through it!\n\n**What\
    \ to do?**\n\n*   Create a folder named onlinecourse in C:/xampp/htdocs\n\n* \
    \  Create a new php file named instructor\\_signup.php\n\n**Remember:** Even when\
    \ the form you design is just with HTML elements, in order to work with form data,\
    \ you need PHP. So, save the file with .php extension.\n\nIf you are ready, start\
    \ your Apache server in xampp and run the project onlinecourse in the browser\
    \ as:\n\n![4-3-1](Images/image00234.jpeg)\n\nHere is the coding snippet in HTML:\n\
    \n**Design Code in instructor\\_signup.php file**"
  fmt: "\n# 文件处理与超全局变量\n\n## 代码示例：读取文件内容\n\n```php\n$filecontent = fopen(\"test.txt\"\
    ,\"r\");\necho fread($filecontent,filesize(\"test.txt\"));\n```\n\n执行后输出：\n\n\
    ![4-1-6](Images/image00224.jpeg)\n\n*   `filesize(file)` 是一个返回文件字节数的函数。\n\n##\
    \ 读取函数\n\n我们将介绍几个读取函数：\n\n*   读取单行：`fgets()`\n*   读取单字符：`fgetc()`\n*   检查文件结束：`feof()`\n\
    \n### `fgets()` 函数\n\n`fgets()` 函数用于从文件中读取单行。\n\n练习代码：\n\n```php\n$filecontent\
    \ = fopen(\"test.txt\",\"r\");\necho fgets($filecontent);\nfclose($filecontent);\n\
    ```\n\n每当调用一次 `fgets()` 函数，指针就会移动到下一行。由于只有一个 `fgets()` 函数，因此只读取了一行。\n\n![4-1-7](Images/image00225.jpeg)\n\
    \n### `fgetc()` 函数\n\n`fgetc()` 函数用于从文件中读取单个字符。\n\n练习代码：\n\n```php\n$filecontent\
    \ = fopen(\"test.txt\",\"r\");\necho fgetc($filecontent);\nfclose($filecontent);\n\
    ```\n\n调用 `fgetc()` 函数后，文件指针移动到下一个字符。由于 `fgetc()` 只被调用一次，因此只读取了一个字符！\n\n![4-1-8](Images/image00226.jpeg)\n\
    \n### 如何读取文件直到末尾？\n\n### `feof()` 函数\n\n`feof()` 函数检查是否已到达“文件结束”（EOF）。它对于遍历未知长度的数据非常有用。\n\
    \n练习代码：\n\n```php\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"<p>Printing\
    \ character by character </p>\";\nwhile(!feof($filecontent)){\n    echo fgetc($filecontent);\n\
    }\nfclose($filecontent);\n\n$filecontent = fopen(\"test.txt\",\"r\");\necho \"\
    <p>Printing line by line </p>\";\nwhile(!feof($filecontent)){\n    echo \"<p>\"\
    .fgets($filecontent). \"</p>\";\n}\nfclose($filecontent);\n```\n\n我们在 `fgets()`\
    \ 之后关闭文件并再次打开。为什么？因为第一个 `while` 循环到达文件末尾后，指针无法指回开头。所以我们关闭并再次打开文件以便在 `while` 循环中执行\
    \ `fgetc()`。\n\n执行结果：\n\n![4-1-9](Images/image00227.jpeg)\n\n希望你理解为什么要在 `while`\
    \ 循环中检查 `feof()`。原因是为了读取所有行（使用 `fgets()`）和所有字符（使用 `fgetc()`），我们在 `while` 中使用 `!feof()`\
    \ 作为条件，指示循环持续到文件结束。\n\n## 注意事项\n\n### 打开不存在的文件会发生什么？\n\n我们来试一下：\n\n```php\n$newfile\
    \ = fopen(\"newtest.txt\",\"r\");\n```\n\n输出是什么？\n\n![4-1-10](Images/image00228.jpeg)\n\
    \n有一种方法可以告知用户文件不存在：\n\n```php\n$newfile = fopen(\"newtest.txt\",\"r\") or die(\"\
    Unable to open file!\");\n```\n\n![4-1-11](Images/image00229.jpeg)\n\n当以下情况发生时，`die`\
    \ 语句会被执行：\n\n*   文件不存在\n*   文件未被授予打开权限\n\n它会立即终止脚本。\n\n至此，文件处理部分结束！\n\n---\n\n\
    # 4.2 超全局变量\n\n---\n\nPHP 中存在一些预定义变量，它们始终可访问，无论作用域如何——你可以从任何函数、类或文件中访问它们，而无需做任何特殊操作。这些变量称为超全局变量，或简称为超全局。\n\
    \nPHP 超全局变量包括：\n\n*   `$GLOBALS`\n*   `$_SERVER`\n*   `$_REQUEST`\n*   `$_POST`\n\
    *   `$_GET`\n*   `$_FILES`\n*   `$_ENV`\n*   `$_COOKIE`\n*   `$_SESSION`\n\n**超全局变量是始终在所有作用域中可用的内置变量。**\n\
    \n本章不会详细讨论每个变量。将对所有变量进行简要介绍，实际用法将在本章和下一章中处理。\n\n### `$GLOBALS`\n\n`$GLOBALS` 用于在\
    \ PHP 脚本的任何位置访问全局变量。我们在讨论函数中的变量作用域时使用过这些变量。希望你还记得！\n\n### `$_SERVER`\n\n`$_SERVER`\
    \ 保存关于头信息、路径和脚本位置的信息。`$_SERVER` 超全局变量有许多元素用于获取关于服务器和服务器相关实体的描述。\n\n以下是可与 `$_SERVER`\
    \ 一起使用的元素列表：\n\n![4-2-superglobals](Images/image00230.jpeg)\n\n我们将在实践环节测试几个元素：\n\
