- raw: "We will follow the second option. We will create a dashboard page, place all\
    \ the links here and then link the dashboard in pages wherever it is needed. The\
    \ reason is when you want to expand the project features / facilities, you can\
    \ easily add them to the dashboard for linking.\n\nFor every dashboard link, we\
    \ have to make few checks!\n\n*   check if user is logged in\n\n*   check the\
    \ category of user - instructor or learner\n\n**Pages - check and logout:**\n\n\
    *   We will create a new php page called check.php while will contain all the\
    \ above checks. For every dashboard linked page, we will include check.php file\
    \ and based on user category, appropriate dashboard will be displayed.\n\n*  \
    \ We will create a new php page called logout.php. In case, if a learner tries\
    \ to access an instructor’s page, or vice versa, we will forcefully log them out.\
    \ Also, we need to provide a log out link too.\n\n* * *\n\n**Logging out of session:**\n\
    \nJust create a blank file named logout.php and place the code below:\n\n```\n\
    <?php\nsession_start();\nif(isset($_SESSION['usersession'])){\n unset($_SESSION['usersession']);\n\
    }\nheader('Location: login.php');\n?>\n```\n\nAfter un-setting the session variable,\
    \ we redirect to login.php page. header() is a php function used for redirection.\
    \ So far, we used JavaScript since we had pop-up messages displayed to the user.\
    \ Since there is no message displayed, we used php function for this purpose.\n\
    \nExecuting [http://localhost/onlinecourse/logout.php](#part0051.xhtml) will take\
    \ you to login.php page.\n\n* * *\n\n**Checking session and category:**\n\nWhat\
    \ we will do here is:\n\n*   check if the user is logged in\n\n*   find the category\
    \ of user (instructor / learner) using a function\n\n*   find the name of user\
    \ using a function\n\nJust create a blank file named check.php and place the code\
    \ below:\n\n```\n<?php\nsession_start();\nrequire('connect.php');\n//functions\n\
    function get_category($con,$id){\n $get_cat = mysqli_query($con,\"SELECT * FROM\
    \ userlogin WHERE user_mail = '$id'\");\n if($cat = mysqli_fetch_row($get_cat)){\n\
    \ return $cat[2];\n } \n}\nfunction get_name($con,$id,$cat){\n $str = '';\n if($cat\
    \ == 'instructor'){\n  $str = \"SELECT * FROM instructors WHERE instruct_mail\
    \ = '$id'\";\n }\n if($cat == 'learner'){\n  $str = \"SELECT * FROM learners WHERE\
    \ learn_mail = '$id'\";\n }\n $get_fname = mysqli_query($con,$str);\n if($name\
    \ = mysqli_fetch_row($get_fname)){\n   return $name[1];\n }  \n}\n//checking session\n\
    $usersession = '';\n$category = '';\n$name = '';\nif(isset($_SESSION['usersession'])){\n\
    \ $usersession = $_SESSION['usersession'];\n $category = get_category($con,$usersession);\n\
    \ $name = get_name($con,$usersession,$category);\n}\nelse{\n echo \"<script>window.location.replace('login.php');</script>\"\
    ;\n} \n?>\n```\n\nWe will look at the functions first:\n\n```\nfunction get_category($con,$id){\n\
    \  $get_cat = mysqli_query($con,\"SELECT * FROM userlogin WHERE user_mail = '$id'\"\
    );\n  if($cat = mysqli_fetch_row($get_cat)){\n\treturn $cat[2];\n  }\n}\n```\n\
    \nWe send 2 parameters to this function - the database connection resource and\
    \ the email id of the user. Using this email id, we find the category of the user\
    \ and return the same.\n\n```\nfunction get_name($con,$id,$cat){\n   $str = '';\n\
    \   if($cat == 'instructor'){\n\t  $str = \"SELECT * FROM instructors WHERE instruct_mail\
    \ = '$id'\";\n   } \n   if($cat == 'learner'){\n\t  $str = \"SELECT * FROM learners\
    \ WHERE learn_mail = '$id'\";\n   }\n   $get_fname = mysqli_query($con,$str);\n\
    \   if($name = mysqli_fetch_row($get_fname)){\n\t  return $name[1];\n   }  \n\
    }\n```\n\nWe send 3 parameters to this function - the database connection resource,\
    \ the email id and the category of the user. Using the category, we query the\
    \ corresponding table. We execute the query and return the user's name.\n\nWe\
    \ will look at the session code now:\n\n```\n//checking session\n$usersession\
    \ = '';\n$category = '';\n$name = '';\nif(isset($_SESSION['usersession'])){\n\
    \  $usersession = $_SESSION['usersession'];\n  $category = get_category($con,$usersession);\n\
    \  $name = get_name($con,$usersession,$category);\n}\nelse{\n  echo \"<script>window.location.replace('login.php');</script>\"\
    ;\n}\n```\n\nWe check if the session variable is set. If it is set, we copy the\
    \ value to $usersession variable. Since $usersession is an email address (primary\
    \ key of instructor and learner table), we send it as a parameter to get\\_category()\
    \ function and assign the value returned to $category variable. Similarly, we\
    \ send $category as the third parameter to get\\_name() and assign the value returned\
    \ to $name variable.\n\nIn case the session variable is not set, the user will\
    \ be sent back to login.php.\n\nPurpose of redirection: Only logged in users can\
    \ access this page!\n\nSo, three variables will be available to any page whichever\
    \ includes check.php file:\n\n*   $usersession - email id / primary key\n\n* \
    \  $category - instructor / learner\n\n*   $name - user's full name\n\nShall we\
    \ design the dashboard?\n\n* * *\n\n**Instructor Dashboard:**\n\nWe will start\
    \ with the instructor.\n\nWhat are the menus needed for an instructor?\n\n*  \
    \ Courses - create course / edit course / upload content / view report of learners’\
    \ progress\n\n*   Profile - change password / modify profile\n\n*   Logout - to\
    \ come out of dashboard\n\n**Learner Dashboard:**\n\nWe will now look for learner.\n\
    \nWhat are the menus needed for a learner?\n\n*   Enrolments - enrolled courses\
    \ list / access courses\n\n*   Profile - change password / modify profile\n\n\
    *   Logout - to come out of dashboard\n\nFrom the above 2 lists, we can understand,\
    \ we have to design a single page for profile modification. Logout will just be\
    \ a link to logout.php. Profile designing will be dealt in the next section.\n\
    \nWe will now design the dashboard. We need to alter the code segment that was\
    \ provided temporarily in the previous section.\n\nReplace the top php segment\
    \ code as:\n\n```\n<?php\ninclude ('check.php');\n?>\n<!DOCTYPE html>\n…\n</html>\n\
    ```\n\nSimilarly for the main tag content, just retain that single line and remove\
    \ the rest of the code as:\n\n```\n<main>\n<section>\n<h3> User Dashboard </h3>\n\
    <p>\n<?php \necho \"<p>Hello \".$usersession.\"</p>\";\n?>\n</p>\n</section>\n\
    </main>\n```\n\nLogin either as a learner / an instructor and check if you are\
    \ getting the Hello <email> message. If you get it correctly as done in last section,\
    \ your code is perfect so far!\n\nWe will do necessary modifications in the head\
    \ element first:\n\nHope you know where to include a style tag. Include the style\
    \ tag code (before </head>):\n\n```\n<style>\n.cl{\n margin: 5px;\n display: inline-block;\n\
    \ vertical-align: top;\n width: 300px;\n height: 100px;\n border: 1px solid #ccc;\n\
    }\n</style>\n```\n\nThis content is just the same as the one we used for listing\
    \ courses.\n\nReplace the main tag content as:\n\n```\n<main>\n<section>\n<?php\
    \ \necho \"<h3>Hello \".$name.\"</h3>\";\necho \"<p><a href='logout.php'>Logout</a></p>\"\
    ;\necho \"<div class='cl'>\";\nif($category == 'instructor'){\n echo \"<h3><a\
    \ href='clist.php'>Courses<a/></h3>\";\n echo \"<p>Manage Courses, Content and\
    \ Reports</p>\";\n}\nif($category == 'learner'){\n echo \"<h3><a href='elist.php'>Enrolments<a/></h3>\"\
    ;\n echo \"<p>Enrolled Courses and Content Access</p>\";\n}\necho \"</div>\";\n\
    echo \"<div class='cl'>\";\necho \"<h3><a href='profile.php'>Profile<a/></h3>\"\
    ;\necho \"<p>Change password and Profile</p>\";\necho \"</div>\";\n?>\n</section>\n\
    </main>\n```\n\nFor instructors, we have added courses link. For learners, we\
    \ have added enrolments link. We link the profile to the same page for both the\
    \ users. The logout link is given below the name of the user.\n\nLogin as learner,\n\
    \n![8-2-1](Images/image00344.jpeg)\n\nLogout as learner and Login as instructor,\n\
    \n![8-2-2](Images/image00345.jpeg)\n\nHope you understood the next set of works!\
    \ It would be clist.php, elist.php and profile.php. We will start with profile.php\n\
    \n* * *\n\n### 8.3 Modify Profile\n\n* * *\n\nWe will first list the tasks to\
    \ be done in this chapter:\n\n*   Design relevant form \n\n    *   Provide two\
    \ modification - one for password, one for profile\n\n    *   Changing email address\
    \ is denied!\n\n*   Add appropriate PHP code snippets for accomplishing tasks"
