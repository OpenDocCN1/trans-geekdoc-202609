  \n### 无线安全隐患\n\n本节的基础在于：无线网络天生易受各种安全威胁。课程强调了理解无线技术以有效缓解这些威胁的重要性。随着无线网络的不断发展和扩展，这一基础知识对于负责保护这些网络的网络安全专业人员变得越来越宝贵。\n\
