  \n## Wi-Fi 安全 (WPA, WPA2, WPA3)\n\n“Wireless Network Security” 模块中的 “Wi-Fi Security”\
  \ 部分侧重于 Wi-Fi 安全协议的演进——`WPA` (Wi-Fi Protected Access)、`WPA2` 和 `WPA3`。它深入探讨了这些协议的重要性及其在强化无线网络安全方面的作用。\n\
  \n### WPA：安全性的飞跃\n\n本节首先阐述初始 Wi-Fi 安全协议 `WEP` (Wired Equivalent Privacy) 的缺陷。学生将了解到\
  \ `WEP` 存在漏洞，使其极易被攻击者利用。为解决这些问题，`WPA` 应运而生，给 Wi-Fi 安全带来了显著改进。\n\n### 示例：说明 Wi-Fi\
  \ 网络 WPA 配置的 Bash 命令\n\n```bash\nwpa_supplicant -B -i wlan0 -c /etc/wpa_supplicant/wpa_supplicant.conf\n\
  ```\n\n### WPA2：强化防御\n\n在 `WPA` 奠定的基础上，`WPA2` 引入了高级加密标准 (`AES`) 作为默认加密方法。本节强调了 `AES`\
  \ 在增强无线安全方面的重要性。学生还将探讨强预共享密钥 (`PSKs`) 和企业级认证机制的使用。\n\n### WPA3：最新进展\n\n本模块向学生介绍\
  \ `WPA3`，即最新的 Wi-Fi 安全协议。`WPA3` 在加密和认证方面带来了显著改进。学生将深入了解其对暴力破解攻击的增强防护以及对开放网络的安全性改进。\n\
  \n### 示例：说明使用 WPA3-SAE (Simultaneous Authentication of Equals) 进行安全 Wi-Fi 连接的 Python\
  \ 代码\n\n```python\nimport pywpa3\n\ndef connect_to_wifi(ssid, password):\n    wifi\
  \ = pywpa3.WPA3(ssid)\n    wifi.connect(password)\n    if wifi.is_connected:\n \
  \       print(\"Connected to Wi-Fi successfully.\")\n    else:\n        print(\"\
  Connection failed.\")\n\nconnect_to_wifi(\"MyNetwork\", \"MySecurePassword\")\n\
  ```\n\n### 实施最佳实践\n\n本节提供关于实施 `WPA`、`WPA2` 和 `WPA3` 的最佳实践指导。它强调了定期更新网络硬件和固件、使用强且唯一的密码，以及及时了解安全补丁和更新的重要性。\n\
  \n### 向 WPA3 过渡\n\n学生还将了解从 `WPA2` 向 `WPA3` 的过渡，这涉及升级硬件并确保向后兼容性。该过渡是维护安全无线网络的关键方面，因为它利用了最新的安全功能。\n\
  \n“Wi-Fi Security (WPA, WPA2, WPA3)” 部分使学生深入了解 Wi-Fi 安全协议的演进及其在保护无线网络中的重要性。凭借这些知识，网络安全专业人员可以就\
  \ Wi-Fi 安全协议的选择和实施做出明智决策，确保无线通信中敏感数据的保护。\n\n## 无线网络攻击 (KRACK, Evil Twin)\n\n在 “Wireless\
