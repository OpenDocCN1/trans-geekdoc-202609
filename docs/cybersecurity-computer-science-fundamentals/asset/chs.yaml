  \n## 无线网络基础\n\n“无线网络安全”模块中的“无线网络基础”部分是对支撑无线网络的关键原则和组件的基础性探索。对于旨在有效保护这些网络的学生来说，这些知识至关重要。\n\
  \n### 无线网络的本质\n\n\n\n\n## 无线网络基础\n\n本节首先阐述无线网络在现代世界中的本质。学生将了解到，无线网络无需物理连接即可实现数据传输，提供了便利性和移动性。然而，这种便利性也带来了固有的安全挑战，这要求我们全面了解无线技术。\n\
  \n### 无线通信协议\n\n学生将深入探究诸如 `Wi-Fi (802.11)`、`Bluetooth` 和 `Zigbee` 等无线通信协议。每种协议都在特定频段内运行，并具有独特的特性。理解这些协议对于根据网络技术量身定制安全措施至关重要。\n\
  \n### 无线网络组件\n\n无线网络基础的一个组成部分是理解网络组件。这包括无线接入点、路由器、无线客户端，以及它们在建立无线连接中所扮演的角色。学生还将了解固件和软件更新在确保网络安全方面的重要性。\n\
