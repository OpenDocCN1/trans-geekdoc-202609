  \n### 安全治理\n\n网络安全课程中的“安全策略与合规”模块深入探讨了关键的安全治理部分，这是组织内有效网络安全管理的基石。安全治理为组织安全工作的决策、问责制和整体战略方向建立了框架。\n\
  \n### 1. 定义安全治理\n\n安全治理是指指导和控制组织安全方法的总体结构。它为整个网络安全计划定下基调，强调将安全实践与组织的目标、价值观和合规要求保持一致的重要性。\n\
