  \ 定义云基础设施的 HCL 代码\n\n```hcl\nresource \"aws_instance\" \"example\" {\n    ami  \
  \         = \"ami-0c55b159cbfafe1f0\"\n    instance_type = \"t2.micro\"\n    security_groups\
  \ = [aws_security_group.example.name]\n}\n```\n\n### 3. 身份与访问管理\n\n`IAM` 是云安全模型的核心支柱。学生将通过实践掌握\
  \ `IAM` 策略和角色，使用代码为云资源定义细粒度的访问控制。正确配置的 `IAM` 对于防止未经授权的访问和数据泄露至关重要。\n\n#### 示例：用于定义\
  \ IAM 策略以控制对 AWS S3 存储桶访问的 JSON 代码\n\n```json\n{\n    \"Version\": \"2012-10-17\"\
  ,\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n       \
