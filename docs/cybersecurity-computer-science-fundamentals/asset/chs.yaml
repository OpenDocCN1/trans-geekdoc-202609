  \n1. **黑客活动家**：带有恶意意图的数字行动主义\n\n\n\n\n# 网络威胁行为体与常见攻击\n\n### 黑客活动家\n\n黑客活动家是利用黑客技术推进其政治或社会议程的个人或团体。虽然他们的动机可能源于真实的事业，但其行为可能造成破坏性或毁灭性后果。代码可能被用于利用漏洞、篡改网站，或发起分布式拒绝服务（`DDoS`）攻击以推进其目标。\n\
