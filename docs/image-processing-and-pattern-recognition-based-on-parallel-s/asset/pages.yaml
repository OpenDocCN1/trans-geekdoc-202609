    Thus, the image-restoration process using vision systems based on PST is not productive.
    In contrast, the restoration of digital image is an elementary process.


    For the analysis of scenes, two sub-tasks (Duda and Hart, 1973) can be selected.
    The first is the search for the specified image as part of a single object in
    the visual scene. The second is the search for specified images among the many
    individual elements of the scene. An example of these tasks is shown in Fig. 5.12.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_95_0.png)


    Fig. 5.12: Various tasks of identification and location of the image


    In the first case, it is determined whether there are A and B elements in the
    visual scene. The scene consists of a single object AB.


    ```

    S_{AB} = S_A + S_B - S_{A \cap B} \neq S_A + S_B. (5.5)

    ```


    In the second case, it is necessary to determine the presence and localisation
    of A and B elements. But in this case, the scene consists of elements, which can
    be considered as a separate entity, as well as one whole unit.


    ```

    S_{AB} = S_A + S_B . (5.6)

    ```


    In determining the FAI of the composite figure the following formula should be
    used


    ```

    FAI_{(x)AB} = FAI(x)_A + FAI(x)_B + FAI(x)_{A,B} - FAI(x)_{A \cap B}. (5.7)

    ```


    where FAI(x)_{A,B} is the area of intersection of the copy of A figure with the
    B figure. The FAI(x)_{A \cap B} component in the first case occurs when initially
    the A figure intersects the B figure. In the second case, the component is equal
    to zero.'
