    # 8.5 The Sequence of Steps for Using Parallel Shift Technology to Describe and
    Recognise Images


    The proposed image recognition system based on the technology of parallel shift
    realises an accurate analysis of the function of intersection by quantitative
    characteristics. An important feature of such a system is the ability to classify
    images at the input.


    Like the classification characteristics of images, topological and geometric characteristics
    were used. To determine them, an analysis of images of figures with various topological
    and geometric characteristics was performed. Partially such an analysis is shown
    in this chapter. Topological characteristics were defined as: the number of vertices
    of the figure, the number of holes in the filled figure and the number of contour
    distortions.


    The number of vertices is defined as convex vertices (Fig. 8.35a) and concave
    vertices (Fig. 8.35b). In this case, concave vertices cannot exist without convex
    vertices. This means that concavity is realised only in convex figures.


    In Fig. 8.35(a) is represented the original image, and Fig. 8.35(b) is the same
    image with two concave vertices. Thus, the number of vertices increased from 6
    to 10. Therefore, the first classification characteristic is the number of vertices
    and all the images of geometric figures organise a


