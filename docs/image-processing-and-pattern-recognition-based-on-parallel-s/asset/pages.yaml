    # 4.4 Methods for Determination of Motion Parameters Using Non-cyclic Shifts


    The methods for determining the parameters of the object motion by using non-cyclic
    shifts of the image copy in the process of FAI formation are based on the determination
    of the centre of mass of the object. The continuous video stream is divided into
    frames corresponding to certain points in time. For each point in time, the position
    of the object in the receptor field is determined. Furthermore, the coordinates
    of the figure at the current moment are compared with similar coordinates at the
    time corresponding to the previous frame.


    In digital processing of information, the coordinates of the masses centre of
    the image (\(x_{cm}\) and \(y_{cm}\)) are defined as the average value of the
    coordinates of all its \(n\) elements.


    ```

    \(x_{cm} = \frac{\sum_{i=1}^n x_i}{n}\) (4.16)

    ```'
