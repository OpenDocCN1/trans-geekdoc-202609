    # 6.2 Determination of the Permissible Error Range of Values Used to Limit the
    Maximum Displacement Values


    The possible presence of noise impurities in the receptor field during recognition
    of real images encourages the introduction of certain adjustments in the calculation
    process. Limitations of values of parameters of the maximum shifts is produced
    by application of the permissible error dN. We calculate the dN parameter depending
    on the number of kNc image elements that are not removed in the process of noise
    control. The average value of noise elements in number of real images, which can
    get into the shift region of the copy at each time point, is denoted as kNc0.
    With a uniform distribution of noise, this parameter has the following value:


    $kNc_0 = kNc \cdot \frac{S_0}{S_A}$ (6.8)


    Image recognition is possible only if the value is less than the limiting values
    dN·Sv used in calculation of the maximum shear parameter. The use of this property
    is the third level of noise control. Thus, the dN value will be as follows:


    $dN \ge \frac{kNc}{S_A}$ (6.9)


    Hence, the lower boundary of the dN values for each noise level corresponds to
    the normalised number of noise elements and are not deleted in the fight against
    noise as seen in Fig. 6.1a. So, when 7 per cent < pN < 18 per cent, the value
    dN < 0.0048. Thus, for noise levels with pN < 18 per cent, the upper boundary
    of the range of the permissible error dN'
