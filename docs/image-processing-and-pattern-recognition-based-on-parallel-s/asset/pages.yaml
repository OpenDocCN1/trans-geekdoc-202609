  md: '# # Function of the Area of Intersection Formation Based on Parallel Shift
    Technology


    # ## 2.1 Mathematical Model of the Image Describing the Function of the Area of
    Intersection


    One of the applications of parallel shift technology is in the imaging processes.
    Currently, there aren’t any effective methods for handling video data than digital
    image processing. The quality of digital images increases with the increase of
    resolution capability of the devices. At the same time, the data size of the array
    that describes the image increases too. Also, the required number of operations
    to process the array goes up.


    It is necessary to reduce the number of elements, which describe the image. Among
    the attributes of the image, the one that has a quantitative expression is the
    area. By itself, the area contains information only about the size of the image.
    The use of parallel shift technology for image processing allow to form a set
    of functions for its description. A parallel shift in this case is the change
    of the spatial coordinates. Analysis of the obtained set of functions can be the
    base for performing basic image-processing tasks.


    The function of the area of intersection (FAI) depends on the area of intersection
    of the original image and its copy, which parallely shifts in the selected direction,
    as well as on a distance of shifting (Belan and Yuzhakov, 2013).


    FAIφ is defined as the intersection area of figures A and its copy B, which is
    shifted in the direction parallel to φ (Fig. 2.1a). The intersection area at each
    time point is denoted as C:


    $A \cap B = C$'
