    The analysis of the function of the area of intersection of the third triangle
    shows that the image of the third triangle is larger than the images of the first
    two triangles. In the direction of 135°, there are differences and all the partitions
    are filled. This shift direction indicates the same orientation for images of
    all triangles.


    The results of the analysis of the FAI curve for squares are presented in Figs
    8.17- 8.19.


    An analysis of the function of the area of intersection of the square shows that
    in the perpendicular shear directions the values of all the curvature coincide.
    This indicates that the figure is a square with a size of 10x10. The larger squares
    are represented on Figs 8.18 and 8.19.


    From the values obtained, it can be determined that the square has dimensions
    of 15x15 and more than the previous one.'
