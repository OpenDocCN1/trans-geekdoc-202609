- pgno: 15
  md: '# Feature Extraction Based on Parallel Image Shift Technologies


    # 1.1 Fundamentals of Understanding and of Constructing Images


    We perceive the information through our senses. One of the main sources of information
    for our brain is the human visual channel. All of us have the visual channel with
    an identical structure. There are differences in the characteristics of the channels
    determined by age, or a variety of pathological changes caused by diseases, or
    external influences, etc. However, the purpose of human visual channel is to transform
    the optical signals of the visible spectrum into a set of electrical or chemical
    signals that are received by the optic nerve in the region of the human brain,
    which is responsible for processing of visual images.


    The visual images in the surrounding world are constantly changing our photoreceptors
    (the bulbs, the sticks). The visual image is a set of optical signals that fall
    on the field of our primary receptors. This set of optical signals present the
    visual picture.


    When the optical picture falls on a medium that can record it, we use the term
    image. The physical medium, which displays the recorded optical image is called
    the media of the image (paper, storage media, optical/electronic media, etc.).


    The image may be superimposed on the carrier in two ways:


    +   • Fixation of the optical image by designing and memorising by using the physical
    storage materials or via opto-electronic storage elements.


    +   • Construction and reconstruction of images by using special graphic means.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'In the first method, complete copying is carried out of the optical pattern
    on the carrier. The accuracy of the copying is determined by the structure of
    the medium on which the image is projected. The second method uses methods which
    are based on full knowledge of image information and reconstruction of it on a
    carrier. Both the methods require the construction and use of special hardware.
    The first method does not require any specific knowledge about image structure.
    The optical pattern can be reproduced on the medium in parallel (picture, optoelectronic
    matrix and the like) or successively with different scanning means. The image
    is formed by an exact repetition of colour and brightness elements of the image.
    Such elements can be points or a specific areas of the specified shape image and
    size. The points have a minimal area and the form elements can have a large area.
    Such elements can be triangles, rectangles and various predefined geometric components
    of complex images. The second method always takes into account the adopted structure
    of the image and is characterised by a set of methods that are implemented on
    the developed hardware/software tools.


    This model of the image is created for the hardware that can implement it and
    reproduce the image on the selected medium. The model describes the image. The
    complexity of the hardware and the accuracy of the reconstruction depend on the
    chosen model. Choosing the model is one of the main tasks when constructing an
    image for modern processing and image recognition.


    In modern data processing systems, there are several basic tasks that can divided
    into tasks of reproduction images and image understanding. Image-understanding
    tasks consist of a preliminary description of the image. Description of images
    is based on the image representation of functions and by a set of elementary (discrete)
    components (e.g., pixels, cells, etc.) that are most effective in further processing.


    The image understanding task is to analysis of a geometric form of the image and
    the successful allocation of the necessary elementary components of the image
    and the links between them or the functions with which the significance of image
    definition can be obtained.


    These two tasks are opposites and occupy a major place in the construction of
    intelligent systems.


    # 1.2 Image Description


    Images can be divided into bitmap and non-bitmap images (Nixon and Aguardo, 2002;
    Solomon and Breckon, 2011).


    A bitmap is an image that includes a set of pixels (usually rectangular) on the
    opto-electronic display device or on paper and other means. Each pixel can display
    a different colour. Bitmap images are now most commonly used in most input-output
    devices. Non-bitmap image is an'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'image that is not described in pixels but is seen in elementary geometric objects,
    called primitives. In most cases, the primitive are mathematical models.


    Most often non-bitmap images are ascribed as vector images. Vector images are
    processed by using the same computational tools as that for bitmaps. They can
    be reproduced on both raster and vector on the image display device. However,
    raster images can only be displayed on raster reproduction devices.


    The vector-constructing image method faces problems of building complex images,
    since it requires storage of a large amount of primitives and their mathematical
    description. Vector images scale well without loss of information while bitmap
    images are scaled poorly. In the bitmap image after scaling, a large number of
    pixels is lost (for size reduction) and appears in increased size.


    In the optical system, an image is used as a unified optical object. The images
    in such systems are transformed by optical-mechanical means and can be divided
    into individual components. By using special optical-mechanical means the whole
    image can be displayed on the selected medium. However, in such systems there
    is the problem of storing images and of efficient software manipulation. At the
    same time, optical systems have a high speed and accuracy of images processing.
    Currently, optical image processing and recognition systems are increasingly used
    in various fields of human activities. In addition, they do not use the methods
    of computer processing and recognition. Such systems work with analog images and
    use specialised imaging methods (Pratt, 2016).


    In the modern computer systems of image displaying and image recognition, all
    the methods are implemented on the basis of the hardware and software. The most
    effective description images method is to use the structural describe (Solomon
    and Breckon, 2011; Pratt 2016). In some cases, the image is convenient to represent
    by topological description (Solomon and Breckon, 2011; Pratt 2016).


    The simplest way to describe the images, which are fed by a certain electron carrier,
    is to describe them by a set of discrete elements and function of the brightness
    in three-dimensional or two-dimensional space (Nixon and Aguardo, 2002). This
    function describes the value of the average brightness of the image in the neighbourhood
    of each discrete element (cell or pixel). The brightness function is discretised
    and determines the gradation number, on which is divided its range of values.
    For binary and grey-scale image, the gradation number is equal to or more than
    two. Based on this method are implemented the cost-effective methods of describing,
    which constitute the basis for other methods. An important requirement and limitation
    are the size and structure of the set of describing elements.


    In many problems it is enough to use a simplified description, which consist of
    selection and analysis of the image contour (Nixon and'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Aguardo, 2002; Belan, 2011; Kozhemyako et al., 2001; Bilan, 2014). To date,
    a range of edge detection methods were offered and morphological processing methods
    (Solomon and Breckon, 2011; Parker 2010). The main disadvantage of this method
    is that any calculation error depends on the parameters situation, which affects
    the accuracy of the characteristic elements.


    Simple images are more cost-effective in describing and identifying objects, as
    well as in dividing into elementary shapes that are determined by approximation
    of the original image (Solomon and Breckon, 2011; Pratt, 2016; Gonzalez and Woods,
    2008).


    One of the methods of describing complex images is a structural description. The
    method is based on the representation of images as a structure consisting of elementary
    components (terminals) (Narasimhan, 1966; Stallings, 1972; Shaw, 1969; Hancock
    et al., 2010; Gimel''farb et al., 2012). These include the syntactic description
    method that consists of selection of a set of terminals that constitute nominal
    features. A set of non-terminal symbols is being introduced, among which the first
    is determined. The rules for passing character chains with terminal and non-terminal
    symbols are defined by a set of rules of substitutions. The terminal and non-terminal
    symbols and substitution rules create a formal grammar. Options of syntactic approach
    are defined as a specific type of terminal elements and by complexity of the rules
    of substitutions. The usual syntactic approach to the description is same, but
    the loosely oriented images do not give the same grammar, that is, they make changes
    to their description.


    The imaging algorithms are based on the method of potential functions (Aizerman,
    1970), where the “elementary function of closeness” between two vectors is introduced
    and this is called the potential function. The proximity of the vectors is determined
    and its maximisation is used, which is a serial exhaustive search for all the
    vectors of the set. Also attempts are made to use other coordinate systems that
    describe the image elements.


    Often images in the topology are described that characterize the general properties
    of the image (the presence of holes or areas). These properties remain for various
    common distortions. The most common topological feature is Euler’s number G (Sossa-Azuela,
    2013; Acharya, 2006; Bishnu, 2005), which is defined by the formula


    G = C - H,


    where C – the number of associated image components H – the number of holes


    In the tasks of reproduction and image recognition the most common method to describe
    images is use of a technique that is based on the formation of vector of a geometry,
    brightness and colour features. These'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'characteristics include the area, the perimeter elements, and the moment functionals
    from the brightness function, for example, the centre of gravity of the image
    (Maier, 2012; van Assen, 2002).


    The information representation of the image is its spectral representation. The
    definitions of contour characteristics (the function of the polar φ angle, contour
    length, the distance between the centre of gravity and the contour points) are
    used. The curvature of the contour is expanded in a Fourier series and the factors
    are defined to make it possible to describe the image (Nixon and Aguardo, 2002;
    Tremeau and Borel, 1997).


    A successful description and presentation of images greatly affects the efficiency
    of their recognition as well as display.


    # 1.3 Characteristic Features of Images


    The characteristic features describe the image by using the minimum set of elements
    with minimal loss of image restoration. The characteristic features may be set
    in advance, or extracted from the image for its recognition.


    The recognition task is used when the input image is unknown. In this case, the
    characteristic features are extracted by an image recognition system itself. Recognition
    is characterised by a process that assigns an object to one of the previously
    specified fixed list (class) according to a specific set of rules in accordance
    with the intended purpose. Recognition can be carried out by any recognition system
    that generates a set of features, according to which the system determines the
    class to which the image belongs.


    Extracted characteristic features of the image at the input by a system of recognition
    provide a meaningful description of the image.


    However, at the moment there is no universal method for selection of a full set
    of characteristic features for all the images. For each class of images, a set
    of features is selected by developers of the recognition system. These characteristic
    features do not always give 100 per cent results and cannot be applicable to other
    classes of images. For example, the characteristic features of the face of a person
    (the distance between the eyes, nose length, the shape of the lips and so on)
    cannot be applicable for human fingerprints (control points, lines form and so
    on) and conversely. Moreover, all these features are set in advance by the developer
    based on his intuitive experience and a thorough study of the selected class of
    images.


    Today we can confidently assert that there are no methods and hardware that allow
    extraction of most characteristic features of the image by the recognition system
    itself. For example, the modern biometric identification system accurately enough
    recognises a face but caricatures'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'of the face cannot be recognised. At the same time, the human visual channel
    recognises faces with distortions as well as its caricatures.


    Developers typically solve special problems for image recognition with specific
    forms and brightness characteristics. Studies show that the greater the characteristic
    features extracted from the image the more accurate is the recognition result.


    Today, a number of methods have been developed that are used to extract the characteristic
    features images (Nixon and Aguardo, 2002; Pratt, 2016). All these methods are
    based on preliminary image transformation. Among such transformations are Fourier
    transformation (Nixon and Aguardo, 2002; Bracewell, 1986; Solomon and Breckon,
    2011), wavelet transformation (Nixon and Aguardo, 2002; Daubechies, 1990), Hough
    transformation (Gonzalez and Woods, 2008; Ballard, 1981), affine transformation
    (Belan, 2011; Bilan, 2014), discrete cosine transformation (Ahmed et al., 1974),
    Hartley transform (Bracewell, 1984a, Bracewell, 1984b) and other methods.


    Different types of filtration are used for extraction of the characteristic features,
    which are fully described in various literatures (Nixon and Aguardo, 2002; Gonzalez
    and Woods, 2008). All of these approaches focus on extraction of the previously
    defined characteristic features or identifies those features that can extract
    by using these methods. Thanks to these methods the number of characteristic features
    may prove excessive and may not provide a complete description of the image.


    Widespread image recognition methods do not extract the specific characteristic
    features. These include methods based on the use of artificial neural networks
    (ANN) (Xingui andShaohua, 2010; ICANN, 2014), cluster analysis (Anil K. and Jain,
    2010; Chang et al., 2012; Berklim, 2002; Islam and Ahmed, 2013) and etc. require
    preliminary preparation of images for their recognition.


    ANN uses a large database of patterns for recognition and require larger neural
    network learning costs. The most universal ANN include cognitron and neocognitron
    (Fukushima, 1983).


    Cluster analysis is to find and combine image elements through specified properties.
    These properties can be shapes, colours, etc. Cluster analysis is very effective
    in image segmentation; genetic algorithms and fuzzy sets (Tahmasobi and Harakhani,
    2012), and fractal theory (Barnsley, 1988, Saupe, 1996) are also used.


    All these methods have substantial differences, but certain advantages and disadvantages.
    The most common approach is to extract the characteristic features of an image
    by using known or developed methods and the formation of the vector of the characteristic
    features. The extracted characteristic features may be rigidly located in the
    vector or may be independent of the location. Created vector in the memory of
    patterns is recorded and the identifier belonging to the class is assigned.'
