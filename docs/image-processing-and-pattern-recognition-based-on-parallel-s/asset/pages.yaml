    # 7.6 Optical Image Recognition System Based on Parallel Shift Technology


    Modern advances in the use of light for the construction of information processing
    systems and image recognition can dramatically improve their productivity. There
    are many advantages of using light for image transmission and processing. These
    include:


    +   - Possibility of parallel image processing

    +   - Low power consumption

    +   - A small number of influences and parasitic capacitances

    +   - Absence of interaction between light rays

    +   - Absence of radiation in the external environment (high security from external
    interventions)


    The use of such advantages and existing optical and optoelectronic devices allows
    the authors to realise an optical system for image recognition based on the technology
    of parallel shift. An optical system for determining the FAI images based on parallel-shift
    technology is shown in Fig. 7.26.


    The system contains an image source (IS), optical image separator (OS), the mirror
    of initial image (MII), k mirrors of copy image (MCI1, ..., MCIk), k optical transparencies
    (OT1, ..., OTk), photodetector (FD) and the calculator of area (CA).


    The image from IS goes to the optical divider OS and divides into two streams.
    The first optical stream arrives at MII and on reflecting from it is projected
    onto FD. This image is the initial image and remains stationary over the entire
    field of the photodetector. The second optical'
