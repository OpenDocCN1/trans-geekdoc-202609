    the FAI curve changes at the last shift steps. Accordingly, the curvature value
    of the function of the area of intersection at the last step of the partitioning
    changes. In other directions, the concavity is determined on the right and above.


    In comparison to the results presented in Fig. 8.24 and Fig. 8.25, it is possible
    to determine these concavities by means of parallel shear technology. They represent
