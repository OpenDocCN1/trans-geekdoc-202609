  md: '![](img/d6ed6c69a61b1252a9084096bb4904c6_78_0.png)


    When determining the position, the point of intersection of the diagonals of the
    bounding box has a distortion due to changes in the shape of the test object.
    If the image preprocessing is performed for each shift, the trajectory would be
    smoother. The results of this method are shown only for control and are unrelated
    to the PST.


    Simulating the definition of the path of movement by analysing the cyclic FAI
    is most difficult. To determine periods (Tx1 and Ty1) we had to look for peaks
    in certain areas of continuous functions of the area of intersection. Besides
    the synchronisation process to determine the function of the area of intersection
    was difficult because of the different sizes of width and height of the receptor
    field. Resolving capacity of 640×480 was selected for the possibility of creating
    a test video file by standard means.


    The method of tracking the centre of masses of the figure in software implementation
    was most effective. This method is suitable for implementation of machine vision
    systems.


    Despite existing disadvantages in general, there is an obvious correlation between
    the data obtained by different methods. The main advantage of the methods for
    determining the parameters of movement of objects on the basis of parallel shift
    technology is the ability to handle video data with no digital image processing.'
