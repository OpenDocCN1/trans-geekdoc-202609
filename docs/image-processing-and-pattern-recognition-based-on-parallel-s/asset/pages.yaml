    # 4.2 Use of Different Types of Shifts of Image Copies in Video Processing Devices
    Based on PST


    Before proceeding to the description of the methods for determining the parameters
    of the movement of objects on the basis of the use of the parallel shift technology,
    one important point should be emphasised. It was previously mentioned that it
    is possible for formation of the function of the area of intersection using both
    cyclic and non-cyclic shifts of image copies. For example, in a cyclic shift to
    right, the following actions take place. If a copy of the figure falls outside
    the right boundary of the receptor field, it appears to be at the same level as
    the left portion of the receptor field and continues its movement to the right
    (Fig. 4.2).


    If not using a cyclic shift of the figure copy to the right, it goes beyond the
    right edge of the receptive field. Shift type is determined by the copy of the
    image matrix, which is built on the selected shift registers. In the section about
    the formation of the function of the area of intersection at the stage of pre-treatment,
    it was named as the B matrix. If it was built on the cyclic shift registers, the
    cyclic shift process is obtained. When using no cyclic shift registers, no cyclic
    shift occurs.


    Different types of copy image shift may be aplied in various devices. Methods
    of determining the object motion parameters through the use of a parallel shift
    technology will also differ. Organisation of the cyclic shift should be applied
    mainly in prosthesis of visual organs in biological beings. The biological information
    systems operate with uninterrupted stream of information, which is perceived by
    their receptors.'
