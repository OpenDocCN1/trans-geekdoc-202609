- pgno: 76
  md: 'To determine the initial object distance $l$ can be used by changing the distance
    to the object by moving the optical system itself or by changing the focal length
    of the perceiving camcorder (similar to the process of accommodation of the eye).
    Thus, value $\Delta l = l_1 - l$ is specified. For obtaining values $\sqrt{S_0}$
    and $\sqrt{S_1}$ it is necessary to determine the object area in the moments before
    ($t_0$) and after ($t_1$) by changing the focal length or the distance of displacement
    of the optical system.


    In the proposed method, $t_0$ and $t_1$ moments correspond to the establishment
    of two neighbouring frames when no cyclic shift of a copy image occurs.


    During the cyclic shift copies of the image owing to changes in the distance to
    the object, the shape of continuous functions of the area of intersection will
    change. When removing an object from the observer, a form of another FAI surge
    will be smaller in size ($S_1 < S_0$), its width will change a little ($X_{max
    0} \approx X_{max 1}$) and at the top part, the horizontal component will appear.
    When an object approaches the observer a form of regular FAI surge changes as
    follows. The maximum FAI value will not change ($S_1 = S_0$), but its width will
    change significantly ($X_{max 0} < X_{max 1}$) and at the top the horizontal component
    will appear. Examples of changing the shape of the cyclic function of the area
    of intersection are shown in Fig. 4.7.


    The distance of the object in this case should be analysed by two parameters areas
    ($S_1$ and $S_0$) and the maximum shift values ($X_{max 0}$ and $X_{max 1}$),
    to use those that vary. When removing the figure in the calculation, we use the
    value of the function of the area of intersection.


    ```

    $l = \frac{\Delta l \sqrt{S_1}}{\sqrt{S_0} - \sqrt{S_1}}$

    ```


    When approaching a figure in the calculation, the maximum shift value is used.


    ```

    $l = \frac{\Delta l \cdot X_{max 1}}{X_{max 0} - X_{max 1}}$

    ```


