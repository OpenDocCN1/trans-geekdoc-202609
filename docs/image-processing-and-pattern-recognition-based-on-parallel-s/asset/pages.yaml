- pgno: 163
  md: '# 8.3 Description of Image with the Help of Quantitative Characteristics of
    the Basic Properties of FAI


    This method differs from the method described in Section 8.2 as in that the FAI
    curve is analysed. If in the first method the numerical values of the function
    of the area of intersection are stored and processed, then in the second method,
    it is the FAI curve.


    The graphic method of analysis is described in detail and clearly by using Figs
    8.2 and 8.3.


    To implement the second method of image description, a program was developed that
    simulates the technique for analysing the FAI curve. As well as for the previous
    method, the functions of the area of intersection were formed for shear directions
    at angles: 0°, 45°, 90°, 135°, 180°, 225°, 270° and 315°. Also for research, images
    of the BMP format with a size of 500×500 discrete elements (pixels) were selected.
    The number of division steps was chosen up to seven partitions, that is, the FAI
    curve can be analysed as a whole, with the help of two sections, three sections,
    etc. The maximum number of sections of the partition of curve is seven. For larger
    image sizes, it is necessary to increase the number of sections of the FAI curve.
    However, if the image has small dimensions, then the possible number of partitions
    of the FAI curves will decrease.


    In the previous section, various deviations from the standard models of images,
    as well as their orientation were estimated. However, to determine the scale changes
    using the first method is difficult; most suitable is the second method.


    Thus, the first direction of experimental research using the second method is
    the determination of images of same shapes and different sizes. To solve this
    problem, a reference image was initially assigned, and its FAI and values of the
    FAI curvature were determined at all sections of the FAI curve partition. Even
    images of the same figure were enlarged or reduced in scale.


    Thus, sets of figures of the same shape were created. The forms were determined
    by the number of vertices in the polygon and the angles at these vertices between
    adjacent sides. For performing experimental studies the images shown in Fig. 8.13
    were selected.


    For triangles modified on a scale, the following curvature values were obtained
    for each part of the partition. The results are shown in Figs 8.14–8.16.


    Analysis shows that this is a triangle due to the analysis of the 135° direction.
    The remaining values coincide, which also indicates that this is a right-angled
    triangle whose catheterus are parallel to the coordinate axes. It is also important
    to note the dynamics of changes in curvature values of the triangle. For example,
    for the direction of the shift of 90° and for three'
