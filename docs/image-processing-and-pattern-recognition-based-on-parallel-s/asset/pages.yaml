- pgno: 44
  md: 'In the case of using neural networks, the function of the area of intersection
    and their coefficients can serve as a vector for the input of the characteristic
    features of artificial neurons. This detection method does not require a large
    amount of expenditure for information storage.


    This book is considered by means of image recognition method for reconciliation
    with etalons. It can be divided into two blocks—the first is to identify simple
    images, which FAI can be determined analytically; the second one is recognition
    of all other figures.


    Before performing, the image recognition process is subjected to a pretreatment.
    The result of this process is a binary image. For this method, the image in the
    receptor field will be considered holistic, even if it consists of several individual
    parts. Image preprocessing using parallel shift technology will be discussed in
    the following sections.


    The basic algorithm of recognition of simple figures has already been described.
    In reality there are many factors that can lead to loss of information. These
    include, for example, loss of information during rounding off calculations and
    when digitising images or noise impact. Therefore, it is necessary to use values
    of certain permissible deviations in the process of comparing.


    The result of the first recognition unit may be a decision on the identification
    of the image as a simple figure and getting its qualitative and quantitative parameters.
    The advantage of its selection from the general algorithm of recognition is the
    fact that in the case of identification of the object at this stage, you do not
    need to search among an array of etalons. This will significantly reduce the recognition
    process. Furthermore, the cost of storing information for this block is minimal.
    Etalons of simple figures are stored as templates of analytical formulas, which
    will be filled with the basic parameters of the function of the area of intersection.


    If in the previous stage a decision was not made on the identification of the
    image as a simple figure, it is necessary to switch to the recognition by a comparison
    of figure with an array of etalons. Each of the recognition units is in turn divided
    into two steps—the first stage is the fast recognition, which compares the integral
    coefficients; the second stage is detailed recognition where the function of the
    area of intersection is compared. Scheme of recognition process is shown in Fig.
    2.10.


    Overall image recognition algorithm based on the analysis FAI consists of the
    following steps:


    +   1. For obtaining real images the function of the area of intersection in two
    directions (φ and φ₁ ≠ φ).


    +   2. Identification of the main parameters of these (S₀, Xₘₐₓ, Yₘₐₓ) and real-IC
    (kₓ and kᵧ).


    +   3. In substitution IC in the formula of simple figures, values of key parameters
    are derived from the function of the area of intersection.'
