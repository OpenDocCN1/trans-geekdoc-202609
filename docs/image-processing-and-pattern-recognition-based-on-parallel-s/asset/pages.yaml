    # ## 6.3 Determination of Values Range of Acceptable Error Used in Comparison
    of Integral Coefficients


    In the process of comparing the integral ratios on the stage of image recognition
    by the method of analysis of the functions of the area of intersection, the dk
    value of permissible error is used. The need to use this parameter is determined
    by the fact that in calculating the basic parameters of the function of the area
    of intersection or in the construction of their basic functions for simple shapes,
    certain data rounding off is done. It leads to the fact that the expected data
    are different from the real values. For all types of recognised images, the noise
    removal process is used. This fact also influences further calculations because
    some parts of useful information can be deleted. In addition, data losses occur
    as a result of processing the input information arrays.


    The basis for determining the amount of allowable error dk is in the range of
    the integral coefficient values. The integral coefficients (k_φ) take the values
    from 0 to 0.5. Furthermore, efficient use of these parameters is caused by the
    opportunity to separate the general-class patterns (A) into several subclasses
    (A_i), in order to restrict the number of patterns for further detailed comparison
    of the function of the area of intersection. The number of subclasses (nA_i) is
    determined from the following formula:


    ```

    nA_i = \frac{0,5}{2 \cdot dk} = \frac{1}{4 \cdot dk} .\n(6.10)

    ```


    Separation of the pattern into subclasses is quite conditional and depends on
    the integral values of the coefficients k_φ. Graphically the selection of ranges
    of k_φ values is reflected in Fig. 6.2.


    For maximum efficiency of the integral factors in the image recognition process,
    the number of subclasses nA_i should be maximally large. Accordingly, the dk value
    should approach zero. In this case, for a detailed comparison of the functions,
    the smallest number of patterns is transferred. According to (6.10) the value
    of allowable error dk cannot exceed 0.25. This statement is valid where there
    is only one class of'
