    The a graph segment is used to implement the pattern recognition process for determining
    the spatial orientation of objects—segment b—in determination of the coordinates
    of the initial location, area c—in determining the outline of the image and in
    the fight against noise, area d—in determination of the parameters of the object.
    The FAI graph on Fig. 5.5 is schematically shown and only in one displacement
    direction of the image copy. The right boundary of b segment is chosen arbitrarily.
    It depends on the actual distance from the centre of mass of the object to the
    edge of the field receptor. The FAI area specialisation for other areas is similar.
    Here the function of the area of intersection depends on the time (t). In order
    to determine the function values dependent on the distance, it is sufficient to
    multiply the corresponding time periods on a shear rate of object copy.


    The need to take into account the Euclidean coordinate system, some of the image-processing
