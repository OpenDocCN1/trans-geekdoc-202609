- pgno: 49
  md: '# Methods of Pre-Processing Images

    Based on PST


    Analysis of the video information cannot be without its pre-treatment. There are
    currently a large number of tools and methods for the process. In different sources,
    they are called in different ways and the order of these actions is not uniquely
    determined.


    In general, pre-treatment of images may be divided into two components—modification
    and transformation.


    Modification involves performing of certain actions on the object with a view
    to change the input image to another; one that is more suitable for further processing.
    Modifying process includes, for example, pre-processing, image enhancement, binarisation
    and noise removal. The result of this process is production of a corrected image,
    which is slightly morphologically different from the input image.


    Transformation is a sequence of actions that give the result in the receipt of
    a set of image properties allowing further analysis of this or that method. The
    process of transformation includes clipping, division into layers, edge detection
    and selection of skeleton, segmentation. The result of this process is the corrected
    image in a certain way that is significantly different from the original, or a
    set of specific properties of the original image.


    Pre-treatment process of the video information is separated into two components
    and is correlated with the classification of the raster image processing methods
    that is described in Rafael C. Gonzalez papers and Richard E. Woods (Gonzalez
    et al., 2004). They share these methods into three classes—low, medium and high.
    Methods of low level are applied to input and output images; mid-level methods
    to the image input and the output with a set of properties and attributes; and
    the high-level methods provide analysis of the input digital image to produce
    certain qualitative and quantitative characteristics of the object.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Thus, modification of the image can be attributed to methods of low pretreatment.
    The process of transformation cannot unambiguously hold a similar definition.
    Such converting steps, as object selection and the edge detection methods, are
    obviously is low-level methods. Other transformation methods are used depending
    on the methods for further analysis and have a set of image properties on the
    output. Therefore, they belong to the image-processing methods of mid-level.


    Existing pre-treatment video information methods include the use of rather complex
    mathematical calculations, especially concerning the various filtering methods
    (frequency filtering, noise filters). Effectiveness of their use is based on the
    increasing power of computer technique.


    Modern signal preprocessing means include its conversion to digital form, because
    of which are called digital signal processing (DSP). In the general case, DSP
    complex consists of a computer, dedicated hardware and software. Personal computers
    may be used for solving problems with low demands on information processing speed
    as the analysis unit.


    Preprocessing of images based on parallel shift technology requires the creation
    of specialised means. At this stage, the process carried out by the authors uses
    the software model.


    Use of parallel shift technology for image processing is convenient to demonstrate
    on the example of Chinese characters. They have complex and varied shapes, with
    their shape being important and thus are suitable for creating binary images.
    In this book, a variety of image processing methods are used by the Chinese character
    for ‘dragon’ (Fig. 3.1).


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_50_0.png)


    **Fig. 3.1: Image of Chinese character ‘dragon’**


    To create the possibility of applying image processing methods based on a parallel
    shift technology, the following must be done.


    +   - Delamination is a separation of the image into several grades according
    to the brightness. The number of luminance ranges is selected depending on the
    need to address those or other problems.


    +   - Binarisation is transformation of the image into a binary matrix. This process
    is based on a comparison of the brightness of each pixel with the luminance threshold
    value. The value of the brightness of the pixel above the threshold of brightness
    in the binary image corresponding to a pixel is set to 0, and otherwise to 1.


    +   - Denoise is reduction existing in image extraneous information, which is
    not part of the input image and appears due to certain actions of external factors.
    A typical method of execution of the process is to remove the high frequency components
    of the signal spectrum.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - The next stage of preliminary image processing is the process of obtaining
    a set of functions of the area of intersection.


    The processes of the bundle and image binarisation are simple enough. Their implementation
    has no direct relation to the description of the parallel shift technology. Therefore,
    these processes in this book will not be considered in detail. These steps will
    be most important stages in analysis or raster image processing. This chapter
    will focus more on the process of removing noise.


    # ## 3.1 Edge Detection Method of Plane Figures


    Description of image preprocessing based on the technology of parallel shift will
    start by describing the process of edge detection of the binary image. This process
    was not declared previously as part of preprocessing. However, shown below is
    that edge detection has one of the stages of removal process in the binary image
    noise using parallel shift technology.


    The edge detection of image is itself one of the main tasks of the video information
    processing systems (Petrou and Kittler, 1991; Walsh and Raftery, 2002; Belan,
    2011; Spacek, 1986). Although PST involves manipulation preferably without edge
    objects, its use will allow detection of edge of the image on the stage of pretreatment.


    Here we would like to stop on the concept of object that is presented as an edge.
    This term in relation to images from different sources is treated differently.
    The contour printing image makes a clear distinction between the subject and the
    background. It is also possible to interpret the contour image as a barcode or
    image consisting of thin lines. The second interpretation will be used in this
    book, for example, the papilla-lines figure has an image with a high edge value.


    At the moment, there are many methods for edge detection of the image, which are
    used in almost in all the existing image processing and recognition systems. This
    is due to the fact that the edge carries most of the image information of the
    object. During digital data processing, edge detection occurs through the use
    of various methods of masking. One of the main disadvantages of their application
    is the need to replace the mask when the edge width is changed. Furthermore, with
    increasing width of the initial edge, the size of the mask grows too. Therefore,
    the number of operations and time required for edge detection increase.


    One of the advantages of edge detection based on parallel shift technology is
    the possibility of edge detection of a binary image of any predetermined width.
    The proposed method for edge detection can be used both for digital and non-digital
    image processing. To implement this process it is necessary to perform a small
    number of operations.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The shape that the edge will assume is a layer of given width h, which belongs
    to the figure and is on the border with the background. This value may be expressed
    in pixels in digital image processing. With non-digital image processing the h
    value can have a distant value.


    Let us consider the edge detection procedure for the variant of the digital information.
    In this case, the edge width h can be expressed in pixels. All the elements of
    the image edge of desired value of width h belong to the set C_rez. All elements
    of the image edge belong to the set of C_i, if the copy on the i units is being
    shifted.


    Then


    ```

    C_{rez} = \sum_{i=1}^{h} C_i. \qquad (3.1)

    ```


    It should be noted that C_{rez} \neq C_h.


    The C_i sets definition can be realised in two ways. For obtaining FAI, the shift
    of copy can be performed cyclically, as will be discussed in the following chapters.
    The second method is shift of the image copy in the selected directions by a predetermined
    number of pixels (or a predetermined distance in non-digital image processing).
    This method is much simpler to implement in hardware.


    Machine vision systems use the Euclidean coordinate system for the receptive field
    in digitalisation and shifts easily to organise in orthogonal directions and diagonally.
    Therefore, during software simulation of edge detection process, the shifts to
    eight directions were used.


    Part of the process of image edge detection obtained for h = 3 pixels is shown
    in Fig. 3.2. In this case, for edge points, the shifts of the copy figure in the
    four orthogonal directions are shown.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_52_0.png)'
  merge: -1
  img_proc: true
