    # 7.5 Selection and Storage of Patterns in UMFP


    The chief importance lies in the formation of a vector of basic quantitative characteristics
    that describe the image after the implementation of a parallel shift. It is necessary
    to generate a form that is easily accessible and understandable and also, effectively
    stored in the memory of templates. In addition, the generated set of values should
    not cause problems when comparing. The comparison unit should be simple and perform
    with a minimal time spent.


    In the electronic digital scheme, the received FAI is represented by a code that
    is divided into fields (Fig. 7.23), which determine the value of the function
    of the area of intersection at the appropriate time.'
