    However, during edge detection with h width, all Ci are always present for orthogonal
    and diagonal shifts.


    The technical realisation of the process of edge detection based on the technology
    of parallel shift may lead to certain errors. Let it be determined that the edge
    of specified width in the generated image is as shown on Fig. 3.3. It should be
    noted that despite the fact that the picture consists of two objects, it is a
    considered as one.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_53_0.png)


    Fig. 3.3: Image for which the contour is determined


    When the edge detection with a width of 20 pixels is done by shifting the copies
    to eight directions, the following results are obtained (Fig. 3.4).


    Errors of the process in this case will be incomplete determination of the edge
    (wrong side) and incomplete edge detection around the individual empty pixels
    (snowflakes). These errors occur when there is the image of interior angles (wrong
    side) and small voids (snowflakes).


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_53_1.png)


    Fig. 3.4: Contour definition errors when h = 20


    Problem-solving methods in the process of edge detection are the next:


    +   1. Preprocessing of the image: In the pretreatment process, the presence of
    small voids is eliminated from the binary image.


    +   2. Increasing the number of shift directions: This will provide a more detailed
    contour and increase in the number of branches of the snowflakes, bringing it
    closer to the real contour of the desired width.


    +   3. Reducing the width of the desired edge: When the desired width of the edge
    is less than four, the mentioned error is not visually noticeable.


    +   4. Investigation of primarily convex objects: This eliminates the cause of
    the internal angles. The main advantage of the proposed method is the ability
    to detect image edge of any given width.'
