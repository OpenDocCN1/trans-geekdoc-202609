    # 4.1 Determination of Spatial Orientation of Planes


    Common image recognition algorithm based on the use of parallel shift technology
    has been previously described in the book. Besides pattern recognition, this algorithm
    with minor modifications can be used to determine the spatial orientation of the
    object. In this case, the object is considered as a flat image. In the three-dimensional
    object, its surface is composed of many areas, each belonging to a separate plane
    and as a flat image. If there is an opportunity to select these areas of the common
    image, it is possible to determine their spatial orientation (Belhumeur et al.,
    1997).


    Let us assume that we have an image, the parameters of which are stored in memory
    of recognition device as A pattern. At an arbitrary location of the image in the
    space of this figure will be displayed as a B projection of the A pattern to receptor
    field plane (Fig. 4.1).


    When determining the spatial orientation of the plane with the figure, the property
    of the projection area is used.


    ```

    $S_B = S_A \cos \gamma$ (4.1)

    ```


    where $\gamma$ is the angle between the planes, which contain the A and B figures.
    These planes for sake of convenience will be called analogically A plane and B
    plane.


    $B$ plane is located perpendicularly from the intellectual system to the image.
    The peak of plane $\gamma$ angle is a straight line that forms in the plane of
    the receptive field ($B$ plane) and the $\varphi$ angle with the horizontal. When


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_66_0.png)


    Fig. 4.1: The projection B for etalon A to arbitrary plane'
