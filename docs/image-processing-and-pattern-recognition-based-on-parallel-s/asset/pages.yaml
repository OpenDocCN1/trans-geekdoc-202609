- pgno: 11
  md: '# Introduction


    Today, we make extensive use of advanced information technology. One of the main
    problems faced by the scientific community in and industry is to create new and
    more sophisticated tools to help in investigation. The development of computer
    technology made it possible to carry out a major step forward in the field of
    information processing. The next step of progress in this direction was the development
    of robotics. The need to process large volumes of information is encouraged by
    the creation of powerful intelligent systems that are based on modern achievements
    of computer technology. Intelligent Systems (IS) are necessaries to replace the
    person in the processes that entail significant physical, mental and emotional
    strains. One of the criteria to improve performance of IS is the availability
    of effective receptors (Tou and Gonzalez, 1977).


    Intelligent systems are built according to the scheme: receptor—analysis unit—effector.
    The most developed intellect is present in biological creatures, which have the
    best parameters of these components.


    Today we know that a lot of information about the world can be obtained by analysing
    the video data. For example, a person perceives 90 per cent of information by
    using the photoreceptors. Using these facts, we can conclude that in the construction
    of intelligent systems, the need is for creation of the means of information perception.


    To perform the tasks of processing video the modern man has effective receptors—the
    eyes. In most living beings, the eyes have a similar structure, and accordingly,
    video data processing passes through the same principles. The developers of machine
    vision systems are trying to achieve, and eventually surpass, the level of quality
    and efficiency of image processing.


    Opportunities of clustering and further classification of objects directly depend
    on the number of characteristic features (CF) (Shalkoff, 1989) and the appropriateness
    of their use in solving one or other image processing tasks. The more the characteristic
    features are selected from images, then'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'the total number can be divided into a greater number of classes. At this stage,
    the development of intelligent systems is restricted by the absence of unambiguous
    methods for the selection of the characteristic signs (Chen et al., 1995). All
    CF are defined by the system designer based on experience in this work.


    To visualise images, the characteristic features are obtained by analysis of their
    geometrical properties (edge detection, search areas of connectivity, calculation
    of the number of angles and others.). For hardware implementation, these processes
    require the execution of various algorithms based on a large number of mathematical
    operations that can be quite complex. This increases the time spent on data processing.


    One possibility to improve the performance of image preprocessing is to use a
    little amount of homogeneous characteristic features of object that would be formed
    by using a simple algorithm without loss in quality of information processing.
    We propose to use the simple physical quantity—the area of the image. This value
    in various multiple values of quantities can represent and describe various images
    that have different shapes and belong to different classes. For transformation
    of the area into a set of characteristic features it is necessary to perform dynamic
    changes using the parallel shift of images.


    The reason for this proposal is the fact that the human eye is composed of 120-150
    million photoreceptors, and the thickness of the optic canal is estimated at about
    1 million axons. In the processing of the video signal is used a specific grouping
    of information. In this book the image processing methods are shown that use parallel
    shift technology. Use of this technology will allow replacement of the set of
    a large number of characteristic features of the image, which are formed by different
    algorithms, sometimes with quite complex mathematical operations and homogeneous
    characteristic feature (area) (Winston, 1992). This feature is measured and is
    calculated by using simple circuit solutions.


    At this stage of development of machine vision systems a parallel shift process
    is considered by researchers solely for the purpose of normalising the image for
    further recognition. That is, they are used in their algorithms and affine transformation
    only for replacement of the input image to another, more suitable for further
    processing.


    The main hypothesis of this work is the use of parallel shift to obtain a set
    of image properties, which allows its further processing and analysis of those
    or other recognition methods. Adding the dynamics of change, the static parameter
    of the image as the area will allow it to be used for classification and definition
    of the image parameters. The image is transformed into a set of functions that
    allows processing of any means of functional analysis. The components of these
    functions will form a set of CF images for further analysis.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Now there are no methods that serve as alternatives to the digital image processing.
    Many methods and means of digital image processing have been developed. The quality
    of their performance increases with increase of power of a computing means. However,
    this quality is based on extensive increase of the resolving capacity of devices.
    A qualitative change is necessary for further progress.


    As shown below, the use of parallel shift technology (PST) allows the performance
    of all the basic processing tasks. Some of these tasks with the help of PST are
    easier to implement than using digital image processing. To improve the performance
    of the machine vision, it is advisable to build hybrid systems that will combine
    elements of digital processing and parallel shift technology. Such machine vision
    systems are especially necessary for construction of autonomous robots. The vision
    systems based on PST can be used for rapid decision-making. Digital image processing
    is necessary for the detailed analysis of images.


    The image processing system based on parallel shift technology allows the processing
    of images. To enable such processing, it is necessary to create a means for determining
    the area of intersection of the figure and its copy that moves in parallel. The
    image processing system based on PST can be used in analog computers.


    The book presents the material in eight chapters. The problems of image processing
    and pattern recognition theory based on parallel shift technology are considered.
    Methods are described for image pre-processing, such as edge detection, noise
    removal, dynamic images processing, etc. The book also displays the results of
    experiments based on the developed software models that confirm the effectiveness
    of the developed models and methods.'
  merge: -1
  img_proc: true
