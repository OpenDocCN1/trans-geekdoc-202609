    # 4.6 Comparison of Methods for Determination of Motion Parameters by Using Different
    Types of Shifts of the Image Copy


    To compare methods of determining motion parameters by using different types of
    shifts of copy of image, the software model was created. Three types of trajectories
    of the moving object were tracked. The first type—the position of the point of
    intersection of the diagonals of the bounding box is determined; the second type—a
    location of the mass centre of the figure is determined; and the third type—the
    calculation of trajectory by analysing the cyclic FAI is used.


    The video file of motion black object was used for the tests on a white background
