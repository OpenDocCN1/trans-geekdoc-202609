  md: 'With the saving of pattern functions in the form of a Fourier series it is
    possible to simulate the process of forgetting information by man. Assume that
    at the initial stage (immediately after the learning process) pattern function
    is described by a complete set of the harmonics of Fourier series. The amount
    of the series of elements will be of the same length as digitised FAI. At predetermined
    time intervals the highest numbered harmonics from the pattern series may be removed.
    Some of the information about the pattern will be lost, but will be less of necessary
    information to store. Repeated restoration of data about the object becomes necessary
    when the function is built on the basis of the existing number of harmonics, and
    will differ from the original more than a specified value. When the selected number
    of harmonics of the Fourier series (NH) is for recovery of the function of the
    area of intersection, the formula (5.3) is converted into the following:


    ```

    FAI(j) = S_0 \cdot \left( \frac{FFTN_0}{\sqrt{X_{max}}} + \frac{\sqrt{2}}{\sqrt{X_{max}}}
    \sum_{i=1}^{NH-1} FFTN_i \cdot \cos \left( \frac{\pi \cdot i \cdot (2 \cdot j
    + 1)}{2 \cdot X_{max}} \right) \right) (5.4)

    ```


    Saving the reference data as a function information will significantly reduce
    the amount of data required to store. Storing information about the images as
    of standard surfaces will ensure implementation of tasks of recognition and determining
    the spatial orientation of the 2D-objects.


    # 5.3 Application of Image-processing Methods Based on PST for Prosthetic Visual
    Organs


    The use of parallel shift technology ensures the implementation of the main tasks
    of video processing and simulates the processes related with human vision. Therefore,
    the processing of information obtained as a result of PST can be used in medicine
    to create artificial bodies of view. The basis of this technology is to obtain
    FAI, which can be converted, for example, into audio signals. Using the human
    brain’s ability to learn and adapt, it is possible to teach blind people to ‘hear’
    the image and nor is it difficult to obtain the information in a suitable format
    for the human ear from device of cyclic generation of the function signal of the
    area of intersection. But, to determine the parameters of output signal, additional
    research with specialist’s ophthalmologists and otolaryngologists is needed. The
    brightness and the amount in the scene elements may be converted to frequency
    and amplitude of the audio signal. In future, with the development of neurosurgery,
    it may be possible to give signals from receptor field directly to the visual
    area of the brain. In this case, the system ‘sensor-analysis unit’ will perform
    the role of the sensor device receiving FAI and the analysis unit will serve as
    the human brain.'
