    that have concavities, are considered. The analysis of FAI forms for such images
    show how the values of the area vary depending on the number of vertices and their
    location. This is indicated by the dynamics of the change in the FAI curve. For
    example, for a pentagon (Fig. 8.21), we see a change in the final part of the
    FAI curve, which reflects a smaller change in the area at the last steps of the
