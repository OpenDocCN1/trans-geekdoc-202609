  md: '# 5.2 Saving Template Functions of the Area of Intersection


    The analysis blocks for all variants of imaging devices should include memory
    units. For each image it is necessary to save a certain pattern surface which
    consists of the given FAI figure for 0,π directions of shift. It will allow the
    implementation of tasks of recognition of images and determination of their spatial
    orientation. Save the pattern functions for all directions 0,2π is not required,
    as the reference surface has a central symmetry.


    Only a set of FAI reflects in itself information about the form of a specific
    object. Whatever additional factors are not used in the image-processing system
    to speed up the action of processing algorithms, at the final stage it is always
    the process of comparing the actual and pattern FAI.


    Arrays of template surfaces can be stored in digital or in analog forms. Saving
    of standard surfaces in digital format entails numerous hardware costs and the
    availability of additional processing means in the comparison of functions. Before
    comparing, it is necessary to scale the real and etalon FAI.


    There are several options to reduce the amount of necessary information for storage
    of pattern surfaces; for example, to store in the database of reduced copies of
    the template images. In this case, the value of standard FAI is generated from
    a template in the process of recognition, but in increased recognition time, because
    for each stored template, it is needed to generate the pattern surface at each
    recognition. Stored etalons must be small enough to reduce the hardware cost of
    storing this information. Scaling of standard functions towards increase will
    lead to appearance of false information. Comparison of functions will be quite
    rough, leading to errors in recognition.


    Saving of pattern surfaces in analog form can, with high precision, display the
    functions of the area of intersection. A variant of this saving may be the use
    of holography. The holographic data storage methods are at research stage.


    Another method of saving the templates is to replace of the pattern FAI by a certain
    auxiliary function that depends on the input function of the area of intersection.
    The rapid transformation of the function in a Fourier series was used in software
    simulation of image processing on the basis of parallel shift technology. The
    displacement range from zero to the'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'maximum value of the shift in the chosen direction was used. This option is
    simple in the process of implementation and significantly reduces the hardware
    costs and does not require additional function-processing methods.


    The amount of information needed to store template surface as elements of auxiliary
    function depends on the number of templates in the database.


    Based on PST, image processing encourages the development of new methods of information
    storage. The set of actions for the preparation of comparison of templates and
    of real FAI at various variants of saving of standard surfaces is shown in Fig.
    5.7.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_87_0.png)


    Fig. 5.7: Procedure for preparation of comparison etalon and real FAI in different
    variants of saving etalon surfaces


    A possible solution to the problem of saving standard FAI is the use of their
    transformation into a Fourier series. As is known, such a transformation brings
    full information about the function. However, the use in processes of storage
    and restoration of data of Fourier series, which describes the function of the
    area of intersection, no given advantage is seen in reducing the amount of stored
    information. For this, storage may be used only in part of the harmonics of series
    that is similar to the low-pass filtering process.


    In addition, the value of the harmonics of Fourier series depends on the area
    of the pattern figure. For unification the size of the harmonic values needs to
    be normalised. To do this, the value of each element of a number should be divided
    by the value of the input image area. In this case, the values of all harmonics
    will be close to unity, which simplifies the storage of information in databases.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'In constructing the Fourier series, which reflect the standard FAI, the following
    formula of normalized harmonics (Mills, 2006) was used:


    $FFTN_0 = \frac{1}{S_0} \frac{1}{\sqrt{X_{max}}} \sum_{j=0}^{X_{max}-1} FAI(j)
    \quad (5.1)$


    $FFTN_i = \frac{1}{S_0} \frac{\sqrt{2}}{\sqrt{X_{max}}} \sum_{j=0}^{X_{max}-1}
    FAI(j) \cdot \cos \left( \frac{\pi \cdot i \cdot (2 \cdot j + 1)}{2 \cdot X_{max}}
    \right) \quad (5.2)$


    The value of the initial image area ($S_0$) and the maximum shift ($X_{max}$)
    are the basic parameters of the function of the area of intersection. Reverse
    recovery FAI is implemented according to the formula (5.3):


    $FAI(j) = S_0 \cdot \left( \frac{FFTN_0}{\sqrt{X_{max}}} + \frac{\sqrt{2}}{\sqrt{X_{max}}}
    \sum_{i=1}^{X_{max}-1} FFTN_i \cdot \cos \left( \frac{\pi \cdot i \cdot (2 \cdot
    j + 1)}{2 \cdot X_{max}} \right) \right) \quad (5.3)$


    The data set ($S_0, X_{max}, FFTN_{0+} + FFTN_i$) is taken from a pattern database.
    Example of saving the pattern surface of the image of the Chinese character ''dragon''
    in the form of the initial twenty harmonics of the Fourier series is shown in
    Fig. 5.8.


    In the simulation of saving standard surfaces (Belan and Yuzhakov, 2014) normalised
    harmonics of the Fourier series ($FFTN_0 + FFTN_{19}$) were used for 36 directions
    (ANGLE) in steps of 5 degrees. The directions ranging from 0 to $\pi$ were gripped
    by the need to save the pattern surface. Value of the initial area of the real
    image ($S_0$) is also stored and the maximum displacement in the selected direction
    ($X_{MAX}$) was obtained in the learning process of the recognition system. The
    value of these two parameters corresponds to the data of the real image of the
    learning sample. They are used in the process of restoration of functions of the
    area of intersection for some additional coefficients and in scaling. Because
    in modelling digital images are used, the maximum displacement is calculated in
    pixels and the initial area is equal to the number of pixels belonging to the
    image. WHAT field contains the name of the object, which is given by man; field
    INTEGR is the value of the integral coefficient for the corresponding direction.
    It is used for quickening image processing in the various processes.


    Creation of a software model of the process was intended to demonstrate image
    processing on the basis of the parallel shift technology. Therefore, the selected
    structure of the pattern database is not perfect. In the case of practical application,
    it can be normalised. Also, the automatic naming of patterns may be implemented
    (in the WHAT field). It may be both arbitrary or generated by analysing an existing
    database. But that is another topic relating to the machine learning processes,
    which are described in other scientific sources. Therefore, we will not describe
    these issues in detail.'
  merge: -1
  img_proc: true
