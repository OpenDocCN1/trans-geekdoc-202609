    Each function of the area of intersection can be represented as a set of harmonics
    of Fourier series. Then you can analyse the FAI spectrum of the entire image and
    the function of the area of intersection of each figure separately.


    Functions of the area of intersection depend on the interaction of the image elements
    at a certain time. Therefore, their analysis can be carried out similarly to the
    analysis of transient processes in electrical networks. For example, the image
    can be associated with an electrical circuit and the function of the area of intersection
    can be considered as the integral of Duhamel. Thus, using the parallel shift technology
    the process of object conversion in the function can be organized and vice versa.
    This task includes image reconstruction subtasks and scene analysis. Research
    in the given direction has not yet been carried out, but according to the authors,
