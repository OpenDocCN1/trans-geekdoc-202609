    # 5.4 Perspective Directions of Image-processing Research Using PST


    The system of images perception, which is used in the construction of parallel
    shift technology, has advantages in performing certain image-processing tasks.
    In the process of implementation of the algorithm, the information is aggregated
    and ordered that, in some cases, it leads to productivity improvement, but sometimes,
    these properties make it impossible to perform certain tasks.


    Let us consider the image-restoration issues processed by using the parallel shift
    technology. If image description is only a set of functions of the area of intersection,
    then restoration is possible in the following ways.


    Suppose we know the initial image area (parameter \(S_0\)). Let us divide this
    value into the largest possible number (\(n\)) of identical elements. The area
    of each of them is equal to \(\frac{S_0}{n}\). The visual field is divided into
    sections of the same area. The complete enumeration method determines all the
    possible options for the location of \(n\) elements of the object in the visual
    field. Thus, it is possible to choose the location of the image elements, such
    that in the formation of set FAI, these features are close in value to the elements
    of the pattern surface, which describes the object. The process of performing
    the complete enumeration is very simple, but requires a very large amount of time
    to perform.


    The second method may be stored in the image-copy memory. If required to restore
    the data from memory, the stored image is scaled to the required size. The FAI
    set in restoration is not involved. In this case, additional costs of storing
    reference image are needed. Also, if a certain class of images is stored in one
    pattern, then in restoring it cannot be identical to the required image.


    To reduce the stored information, the pattern can be represented by a set of syntax
    expression for simple shapes. Then the image reconstruction'
