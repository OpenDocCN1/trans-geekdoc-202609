  md: '# 2.5 Processing of 3D-Objects through PST


    The principles of processing parallel shift technology by using objects with more
    than two dimensions are similar to the processing of plane images. For the form
    of 3D-objects, the figure describes a set amount of functions of the volume of
    intersection.


    The function of the volume of intersection (FVI) depends on the volume of intersection
    of the original object and which is shifted parallel to the selected direction,
    from a distance of displacement. The shift to the technical implementation of
    convenience is advantageously carried out in three orthogonal directions. The
    basic parameters of the function of the volume of intersection will be the initial
    volume of the object ($V_0$), and the maximum values of shifts in orthogonal directions
    ($X_{max}$, $Y_{max}$, $Z_{max}$).


    Also, there are simple objects that FVI can be determined analytically using the
    basic parameters.


    So, the function of the volume of intersection for sphere will be as follows.


    ```

    FVI(x) = V_0 - \frac{\pi \cdot X_{max}^2 x}{4} + \frac{\pi \cdot x^3}{12} \tag{2.55}


    FVI(y) = V_0 - \frac{\pi \cdot Y_{max}^2 y}{4} + \frac{\pi \cdot y^3}{12} \tag{2.56}


    FVI(z) = V_0 - \frac{\pi \cdot Z_{max}^2 z}{4} + \frac{\pi \cdot z^3}{12} \tag{2.56}

    ```


    Integral coefficient of the sphere:


    ```

    k_{\phi} = \frac{\int_{0}^{I_{max}} FVI(i)di}{V_0 \cdot I_{max}} = \frac{3}{8}
    = const, \tag{2.58}

    ```


    where $\phi$ is direction, which is determined for the function of the volume
    of intersection; $i$ and $I_{max}$ are respectively the maximum shift and the
    shift in shear direction is $\phi$.


    While identifying the object as a sphere, we can calculate the radius:


    ```

    R = \sqrt[3]{\frac{3V_0}{4\pi}} = \frac{X_{max}}{2} \tag{2.59}

    ```


    To determine the function of the volume of intersection of the triangular pyramid
    we use similarity property figures. Then the function of the volume of intersection
    will be as follows.


    ```

    FVI(x) = \frac{V_0(X_{max} - x)^3}{X_{max}^3} \tag{2.60}

    ```'
