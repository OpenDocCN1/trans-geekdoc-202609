    The set of functions of the volume of intersection for each etalon will form a
    certain hypersurface. This hypersurface will have central symmetry; so it must
    be stored for directions and forming a hemisphere.


    The possibility of manipulation on the basis of parallel shift technology with
    3D-objects is considered purely theoretically. At present there are no effective
    detectors of the object volume and volume of the intersection of two objects.'
