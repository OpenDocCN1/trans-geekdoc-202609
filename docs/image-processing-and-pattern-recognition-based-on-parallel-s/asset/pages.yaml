  md: '![](img/d6ed6c69a61b1252a9084096bb4904c6_191_0.png)


    Fig. 8.41: Graphic display of the FAI (90°) curves for the symbol images described
    in Tables 8.9 and 8.10


    Let us consider the FAI (45°) and the FAI (135°), which are obtained for symbols
    ''5'', ''7'' and the numbers ''57'' and ''75''.


    The FAI (45°) values for the images of the symbols ''5'' and ''7'', as well as
    for images of the numbers ''57'' and ''75'' are shown in Table 8.11.


    In Table 8.11, in the sixth column, a notation is introduced that describes the
    following formula and corresponds to the sum of two FAIs (45°) for images of the
    symbols ''5'' and ''7''.


    \(\Sigma_{5,7} = FAI^{\overline{5}}(45^\circ) + FAI^{\overline{7}}(45^\circ)\)


    The shaded areas of Table 8.11 indicate matches. It also shows that up to the
    eighth step of the FAI (45°) the image of the number ''57'' is equal to the sum
    of the FAI (45°) images of the symbols ''5'' and ''7''. These sums continue until
    the moment when the FAI (45°) for the symbol of ''7'' becomes zero. This suggests
    that in the image of the number ''57'' the second symbol is ''7''. The FAI (45°)
    for the image of the number ''57'' has values greater than zero for 35 time-steps
    of the shift.


    The FAI (45°) for the image of the number ''75'' also has non-zero values of over
    35 time-steps of the shift. The values of the FAI (45°) for the image of the number
    ''75'' are equal to the sum of the FAI (45°) for the images of symbols ''5'' and
    ''7'', during the 17 time-steps of the shift. This indicates that the image of
    the symbol ''7'' starting from the eighth time-step of the shift enters the gap
    between the symbols ''7'' and ''5''. From the eighth to the seventeenth time-shifting
    steps, the image of the symbol ''7'' is placed in the space between the symbols
    ''5'' and ''7''. Starting from the eighteenth time-step of the shift, the image
    of the symbol ''7'' begins to intersect with the image of the symbol ''5'' (from
    left to right). This indicates that the image of the symbol ''7'' is located to
    the left of the symbol ''5''. The FAI (45°) curves for the images of the numbers
    ''5'', ''7'', ''57'' and ''75'' are shown in Fig. 8.42.


    The FAI (45°) analysis presented in Table 8.11 showed that recognition is affected
