  md: '# # Assessment of Productivity of the Image Processing and Recognition Systems
    Based on FAI Analysis


    The productivity of the image processing system may be evaluated according to
    various parameters. These indicators include the amount of information that is
    processed per unit of time, or the percentage of correctly recognised images among
    the plurality of images.


    Determination of the speed of information processing for image recognition system
    based on the analysis of the functions of the area of intersection is not possible.
    At the time of writing, the hardware that constitutes such a system had not been
    built. The software modelling was performed using the Delphi 7 programming language.
    In the programming model of image recognition system a working field has a size
    500×500 pixels. Its square shape is necessary for implementation of the process
    of rotation of the object in the learning phase. In this case, on the formation
    of a single FAI at an average of one second is spent. Functions of the area of
    the intersection of real image are determined for two of the orthogonal directions;
    also, the time spent directly in comparison of the FAI and integral coefficients
    of the real image with the image patterns. Obviously, for hardware implementation
    due to parallel processes the time that is necessary for processing of objects
    will be less by two orders.


    In future, an assessment of productivity of the image processing system based
    on analysis of the FAI will be carried out by the criterion of the quality of
    recognition. These processes simulate preliminary stages of image processing and
    analysis approach to the real image. Therefore, in this case, it is not possible
    to conduct identification without using acceptable parameters of errors. The image
    recognition system, based on the analysis of function of the area of intersection,
    uses three types of permissible errors.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Error $dk$ is used when comparing the integral ratios of the function of the
    area of intersection in the fast stage of the recognition process; error $dS$
    is used for comparison of the functions of the area of intersection at a detailed
    stage of the recognition process and error $dN$ is used in the formula of value
    determination of maximum shifts. Use of these errors in the image processing system
    is necessary especially in connection with certain rounding off for mathematical
    calculations, loss of information when converting data arrays and for the possible
    presence of noise in the receptor field.


    # 6.1 Evaluating the Efficiency of the Chosen Method of Removing Noise


    An important factor for each method of data processing is the selection of the
    removal of noise algorithm. The areas of the figures are analysed by methods of
    preprocessing and of image recognition on the basis of parallel shift technology.
    Noise interference in this case is considered as the individual element of the
    local groups and the contour images and lines. In addition, the noise will be
    considered as null because elements of the same nature can occur in place of the
    binary elements constituting the binary image.


    To fight with noise the contour points removal method, which has been described
    previously, may be employed. This method is quite effective at values of PSNR
    of 20 dB to 40 dB. In this range of the noise level, the deviation of scale values
    of the FAI and a variety of additional factors do not exceed 10 per cent of the
    value of real indicators.


    However, the removing point contour method has been in design stage during the
    creation of software model of the provisional processing and image recognition
    process. Therefore, to simulate the phase of noise control, 3×3 square filter
    with a threshold of 5 is used. When the sum of the binary elements of the matrix
    3×3 is greater or equal to 5, the central element is assigned a value of 1; otherwise
    it is set to 0. As shown below, the process of noise control while using this
    filter is effective for values of PSNR of 20 dB to 40 dB.


    It is also possible to use for noise control of 5×5 square filter with the threshold
    value 12. For all three ways of dealing with noise, research on the effectiveness
    of work were carried out and the research results will be displayed further.


    The value of the amount of noise elements among all the elements of the image
    can be determined, by using the value of noise inclusion percentages ($pN$). The
    values of this indicator are in the range of 0 to 100 per cent. A widely used
    PSNR parameter is a result of logarithmic dependence. This type of dependence
    is used in a wide range of input data. When input'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'data differ from each other by not more than two orders of magnitude, it is
    preferable to use a simple parameter of the noise percentage. We will show the
    relationship of the parameters PSNR and pN.


    PSNR = 20lg\left(\frac{MAXi}{\sqrt{MSE}}\right), \quad (6.1)


    where MAXi is this maximum value received by the pixel image. For a binary image
    MAXi = 1.


    The mean square error of the MSE, expressed in terms of the percentage of noise,
    will be as follows:


    MSE = \left(\frac{pN}{100}\right)^2 \cdot \quad (6.2)


    These formulas allow us to determine the relationship of the parameters PSNR and
    pN.


    PSNR = 20lg\left(\frac{100}{pN}\right). \quad (6.3)


    Some values of conformity of these parameters are shown in Table 6.1.


    | pN, per cent | PSNR, dB |

    |---|---|

    | 1 | 40,00 |

    | 5 | 26,02 |

    | 10 | 20,00 |

    | 20 | 13,98 |

    | 30 | 10,46 |

    | 40 | 7,96 |

    | 50 | 6,02 |

    | 60 | 4,44 |

    | 70 | 3,10 |

    | 80 | 1,94 |

    | 90 | 0,92 |

    | 100 | 0,00 |


    We define an algorithm of filling the receptor field by the noise elements.


    Let there be a matrix A of size i x j, which consists of elements a_{ij}, where
    a_{ij} \in [0; 1]. Then, if a_{ij} = 0 and the value of random function (100)
    = 1, a_{ij} = 1. If a_{ij} = 1, the value of random function (100) = 1, a_{ij}
    = 0. In this case, the noise components have inverted value of the input binary
    image. The input image matrix is filled approximately by one per cent'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'of the noise components. The number of possible noise per cent ($pN$) for each
    element is the probability that it is noise. This procedure must be repeated $pN$
    times to achieve the desired result. Thus, $pN = 100$ per cent is filled by the
    unit cells of half pixels of the binary matrix, which consists of zero elements.
    This occurs due to the fact that in the process of inversion there can be nullled
    elements, which previously were assigned a 1 value. However, this property does
    not affect the image recognition process for those values of noise where the noise
    removal methods are effective.


    Thus, it will be obtained for the number of noise image elements $kN$, depending
    on the percentage of noise.


    $kN = S_A \cdot \frac{pN}{100}$. (6.4)


    $S_A$ is the total area of the receptor field. Since in the programming model
    its dimensions were taken as $500 \times 500$ pixels, then $S_A = 250000$.


    An indicator of the efficiency of the method of removing noise will have a certain
    amount of noise components ($kNc$), that have remained in the receptor field due
    to implementation of noise removal process. This amount should be such that its
    influence in the analysis of the FAI will be offset by the use of permissible
    error $dN$. It should be noted that the efficiency of noise removal process in
    this research is the ability to delete the 1th element into initially empty matrix.


    To analyse efficiency of the given method, the amount of noise elements $kN$ determined
    and the number of non-deleted noise elements $kNc$ was carried out for all the
    possible noise per cent $pN$, where $pN \in [1..100]$. The studies were conducted
    for each of the three specified methods for combating noise. The procedure of
    this research is as follows:


    +   1. Each value of the noise per cent produced is filled with the empty image
