    on parallel shift technology. The hardware implementation of such a system can
    dramatically improve its performance. The proposed method has already been simulated
    by software and will be discussed in the following sections. Software implementation
    is time consuming, and thus limits the scope of application.


    In the previous paragraphs are given detailed digital diagrams of the main components
    of the image recognition system based on parallel shift technology. All proposed
    circuit solutions are presented using a digital element base. Therefore, it is
