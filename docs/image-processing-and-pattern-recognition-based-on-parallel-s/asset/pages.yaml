    To evaluate the effectiveness of the image recognition process with different
    parameters of input information, it is necessary to define the type of errors,
    the occurrence of which is possible in this process.


    As the first kind of mistake, we shall consider the case when the figure is in
    the database of templates, but in the process of identification, is assigned to
    the class of images, consisting of more than one element, and in this class is
    included the figure that is being recognised. A typical example of an error of
    this kind is optional, when the parameters of permissible errors are selected
    incorrectly.


    The second kind of error will be called in a situation when the figure is in the
    template database, but on the detailed step of identification it is assigned to
    the image class, which does not contain the given image. The main cause of error
    appearance of this kind is a high noise level. The negative influence of this
    noise cannot be deleted by the chosen method of noise removal.


    The third kind of error occurs when there is a figure-based template, but is not
    found in the database.


