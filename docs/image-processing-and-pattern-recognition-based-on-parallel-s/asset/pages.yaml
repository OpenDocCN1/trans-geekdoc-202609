- pgno: 79
  md: '# Image Processing System Based on PST


    On the basis of the proposed methods, which use parallel shift technology to implement
    a variety of image processing tasks, you can build a computer vision system. Devices
    constructed with its application can be used as an independent complex or as part
    of data processing of the hybrid system with digital image processing devices.


    In general, the intelligent systems operate by a scheme of ‘receptor—analysis
    unit—effector’. In the process of information processing in the form of ‘receptors’
    and ‘effectors’ simple sensors and manipulators are used and they do not perform
    any analytical operations. The analysis unit in this case is the processor. To
    improve the performance of IS specialised devices of perception are developed
    and the impact on the object seen as by itself begins to perform some analytic
    functions. Circuits of interaction of elements of the intelligent system in the
    implementation of tasks of perception, analysis and cooperation in the use of
    simple and specialised external devices are shown in Fig. 5.1.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_79_0.png)


    Fig. 5.1: Schemes for interaction of elements of intelligent system'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 5.1 System of Perception of Video Information


    Parallel shift technology allows transformation of the information to improve
    the performance of the units it is processing. The result of the use of parallel
    shift technology is generalised information that will simplify the processing
    of the data. In this book is described the possibility of using this technology
    for construction of specialised video-processing devices. In the above methods
    of information processing, manipulation with binary images is considered. Furthermore,
    the possibility of creation of no digital devices at this time is not sufficiently
    studied. Only the study of analog computing devices is undertaken. Due to these
    facts the video system of perception should include the steps of digitising and
    binarisation. Also it is necessary to have tools for noise control. The main blocks
    of the image-processing devices based on parallel shift technology are blocks
    of the function of the area of intersection formation and of analysis of these
    functions. The structural circuit of one of the image processing device options
    is presented in Fig. 5.2.


    Methods of dealing with noise and the formation of functions of the area of intersection
    are considered. Special attention is paid to the process of image bundle at this
    stage. There are several methods for image separation in certain areas. Morphological
    separation consists of selection of connected regions. However, to organise such
    a division by hardware methods is difficult. Therefore, at this stage it is possible
    to determine the quantitative characteristics of dividing the object into sections
    depending on the brightness of its elements. Splitting of images by morphological
    characteristics can be done during the analysis phase.


    For each biological species there is a certain range of parameters of the environment
    in which the possible perception of this or that sensory organ occurs. For example,
    a person perceives the frequency range of sound waves from 4 Hz to 16,000 Hz,
    and visually perceives the frequency waveband from 384 to 790 THz. The sensitivity
    of the sense organs to quantitative characteristics of the change is also limited.
    Waves with close rates of frequency values are perceived as equal. For hardware
    implementation of the separation process on the image portions, precise quantification
    of such areas is required. Close brightness values of the image elements fall
    into one group. This process simulates the perception of the environment by biological
    intelligent systems.


    The image may be divided into ranges in different ways. Figure 5.3 shows three
    possible variants of division of the input object in dependence on the ratio of
    the specific threshold values of brightness. For further processing all the options
    of bundle simultaneously may be used.


    Assume that the input image is divided into (m) number of sections according to
    the brightness gradations. Then each of them will be a separate image. For each
    such layer it is necessary to define a set of the'
