- pgno: 200
  md: '![](img/d6ed6c69a61b1252a9084096bb4904c6_200_0.png)


    Fig. 8.43: Graphic representation of the FAI (135°) curves for the images of the
    symbols ‘5’, ‘7’ and images of numbers ‘57’ and ‘75’


    These examples of experimental studies are considered for small groups of symbols
    in order to better understand the issue. As can be seen the groups of symbols
    can be increased, which allows recognition and reading of large numbers-sized.


    Recognising large-sized text documents is one of the tasks where the use of parallel
    shift technology gives highest efficiency. There is a large number of recognition
    tasks where parallel-shift technology can be used.


    Among other things, unlike other image processing and recognition methods, parallel
    shift technology claims to be versatile and can be used to process and understand
    a wide range of images.'
