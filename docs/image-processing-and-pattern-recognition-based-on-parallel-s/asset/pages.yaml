  md: 'Table 8.5 clearly shows the changes in the magnitude of the difference between
    adjacent shift steps for each FAI. These changes indicate the shape of the figure
    and its distortions. For greater clarity, the results of such changes for a square
    with five distorted pixels are shown in Fig. 8.10.


    If the image is not solid, but consists of pieces, the differences between the
    values of the function of the area of intersection at the adjacent steps of the
    shift may have negative values. An example of such FAI and increments is shown
    in Fig. 8.11. A complex image is presented which, when intersected with a copy,
    can give small area values at certain shift steps.


    Thus, the analysis of the obtained FAI makes it possible to determine the shape
    of the figure and the distortions in it. For successful recognition, it is first
    necessary to form an FAI for reference images and break them down into classes.
    Based on the available standards, we can determine the shape with pattern, which
    is filled with a geometric area.


    With the help of the first method, it is possible to determine the orientation
    of the figure, since the FAI figures with different orientations give equal values
    in most directions. However, in some directions of shear, they differ. An example
    of such figures and their FAI is shown in Fig. 8.12.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_160_0.png)


    Fig. 8.10: Graphic display of the results of FAI studies according to Table 8.5'
  merge: -1
  img_proc: true
