    # 8.2 Analysis of the Accuracy of Image Recognition, Based on the Obtained FAI


    The developed methods of image processing and recognition based on the parallel
    shift technology are simple and not complex in software or hardware implementation.
    The considered methods of preliminary image processing and noise control confirm
    the high efficiency in the use of the parallel shift technology. However, there
    is a need to investigate the use of parallel shift technology directly for image
    recognition.


    In order to carry out the image recognition studies, a computer simulation of
    the FAI formation method was carried out. Based on the developed program, the
    function of the area of intersection was formed for direction at the following
    angles—0°, 45°, 90°, 135°, 180°, 225°, 270° and 315°. To perform the study, images
    of the BMP format with a size of 500×500 discrete elements (pixels) are selected.


    The first area of experimental research was the determination of the deviation
    of a plane figure at the input from a standard ideal figure. To solve this problem,
    an ideal reference image was initially set and a lot of images were formed, into
    which various distortions were artificially introduced. Such distortions were
    replacement of black pixels with white ones and vice versa. Various variants of
    substitution were used, which were chosen randomly. A lot of images were formed
    with distortion of one pixel, with distortion of two pixels, etc.


    Such sets were created in order to determine the behavior of deviations from the
    standard model of the function of the area of intersection. Such an analysis makes
    it possible to establish the nature of the deviations, which in the future will
    allow us to realise the functions of a system for an accurate recognition of images
    of plane figures. For performing of the experimental studies, the images shown
    in Fig. 8.4 were selected.


    These images (Fig. 8.4) were converted into binary ones with an intensity threshold
    equal to 50 per cent. The obtained values of the function of the area of intersection
