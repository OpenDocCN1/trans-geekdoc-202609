    Thus, to determine the \(\phi\) direction, it is necessary to perform the following.
    For each of the possible directions of displacement in the range between 0 and
    \(\pi\) we get the function of the area of intersection and their integral coefficients
    of the real image. The Y class etalons are determined, which satisfy the following
