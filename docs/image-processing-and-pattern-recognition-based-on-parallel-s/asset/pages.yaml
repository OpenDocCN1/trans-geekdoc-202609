    The disadvantages of using the cyclic shift of copy image are the following:


    +   1. The inability to reach a situation of zero intersection, if the double
    maximum sizes of the figure in the direction of displacement occur at more than
    half of the width of the receptive field in the same direction.


    +   2. The time dependence: To carry out certain image processing tasks it is
    necessary to analyse different parts of the continuous cyclic functions of the
    area of intersection. The process of formation of the FAI, the length of which
    is sufficient for analysis, takes a certain period of time, i.e., you need to
    spend a few cycles of the shift copy of the image for the solution of problems.
    When moving an object, its image may shift significantly in the receptor field
    area relative to its initial position. It makes much more difficult or even impossible
    to determine its intersection with the moving copy, but the decision may be an
    increase in shear rate of the image copy.


    +   3. The hindered process of the formation of the copy of a moving image: The
    main disadvantage of methods based on non-cyclic shift images leads to a need
    for partitioning a video stream of frames at different times. It is very difficult
    to use this approach to the formation of the function of the area of intersection
    when use in non-digital IS. However, using the non-cyclic shift of the figure
    copies in the organisation of machine vision systems simplifies the construction.'
