  img_proc: true
- pgno: 74
  md: '\( y_{cm} = \frac{\sum_{i=1}^n y_i}{n} \) (4.17)


    Obviously, the number of operations when determining the coordinate of the mass
    centre of image increases with the number of its elements. In addition, it is
    not clear how to determine the coordinates in the study of no bitmap image or
    an object with an irregular location of the elements.


    Using parallel shift technology, the image coordinates of the centre of mass can
    be determined as follows. When shifting the copies of the figure in the orthogonal
    direction it is necessary to fix the time when the area of a part of the figure
    copy, which is located in the receptor field, will be equal to half the area of
    the initial image \(\left( \frac{S_0}{2} \right)\). The shift value at this time
    will be one of the coordinates of the centre of the mass (Fig. 4.5). The value
    of the coordinates of the centre of the mass in the other orthogonal direction
    is defined similarly.


    It is noted that in this case, a coordinate means the distance from the centre
    of the figure mass to the receptor field boundary. Binding to the point of origin
    is absent. When fixing the origin at a certain spot, you need to carry out appropriate
    corrections of coordinates in the centre of mass figure. For example, when fixing
    the start coordinate in the upper left corner of the receptive field, the corrected
    coordinates of the mass centre of the image (\( x''_{cm} \) and \( y''_{cm} \))
    will be as follows.


    \( x''_{cm} = T_x - x_{cm} \), (4.18)


    \( y''_{cm} = T_y - y_{cm} \). (4.19)


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_74_0.png)


    Fig. 4.5: Graphical display of the process of determining the \( x_{cm} \) coordinates
