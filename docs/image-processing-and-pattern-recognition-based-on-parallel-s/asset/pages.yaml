  md: '# # Hardware Implementation of the Image Recognition System Based on Parallel
    Shift Technology


    # ## 7.1 Generalised Model of Image Recognition System Based on Parallel Shift
    Technology


    An important factor in the theory of image recognition based on parallel shift
    technology is the hardware implementation of the proposed methods, which has good
    characteristics in comparison with existing methods. The hardware costs for implementing
    the proposed methods should be minimal and simple, having high performance with
    minimal power consumption.


    The feasible variants in realisation of the recognition system based on the technology
    of parallel shift is presented in Fig. 7.1.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_115_0.png)


    Fig. 7.1: Block diagram of the image recognition device based on the parallel
    shift technology.


    The image recognition system comprises an optical system (OS), the function of
    the area of intersection detection block (UFD), the memory'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'block of the function of the area of intersecting etalons (UMFP) and a comparing
    unit (CU).


    The input image through the OS is converted into the required format to enter
    the UFD. The UFD calculates the function of the area of intersection for the shift
    directions that are set by the user. The quantitative values of the function of
    the area of intersection are fed to the first input of the CU in comparison to
    all the template functions of the area of intersection in the UMFP. If the function
    of the area of intersection at the first input of the CU coincides with one of
    the template functions of the area of intersection from the UMFP at the second
    input, then the identifier of the template FAI is generated at the output of CU.
    This identifier indicates the membership class of the input image.


    If the UMFP does not have the function of the area of intersection of equal FAIs
    at the first input of CU, the input FAI is recorded in the UMFP and is assigned
    an identifier of belonging to the class.


    In Fig. 7.1 a well-known scheme of the recognition system is presented (Bilan,
    2014). It does not have a detailed description of a specific method nor does it
    describe how the UFD determines the FAI in several directions and how the copy
    of the input image is shifted. In addition, neither is the FAI value represented
    nor a description of the function of the area of intersection representation and
    its storage in the UMFP are given.


