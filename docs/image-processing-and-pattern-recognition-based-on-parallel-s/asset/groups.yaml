    If the method of dividing an image into equal parts of a smaller area is used,
    then the recognition accuracy can be improved. Each section is represented as
    a separate FAI, which is much smaller and accurately describes the geometric shape
    in a smaller section. Further, a larger FAI consists of a sequence of the local
    functions of the area of intersection. Thus, the image can be represented by a
    number of several types of the functions of the area of intersection—a common
    FAI for the entire image and an enlarged FAI that is composed of a set of the
    functions of the area of intersection of individual image regions. The obtained
    FAI from local FAI allows accurate description and restoration of the image.


    The parallel shift technology is effective for processing of large images, regular
    images and images with discontinuities.


    # 8.6 Advantages of Text Recognition Based on Parallel Shift Technology


    The parallel shift technology can be used for almost all types of images. However,
    there are tasks in the field of image processing and recognition, which are most
    effectively solved by using the technology of parallel shift. Such tasks of preliminary
    image processing are discussed in detail in the previous chapters. These are tasks
    of edge detection, removal of noise, analysis of the trajectory of an object in
    the visual scene etc.


    When recognizing images, effective solutions to the use of parallel shift technology
    were considered when recognizing images with different orientations and various
    changes in image sizes. Experiments for solving the described problems are presented
    as also the examples of simple images. Also the use of parallel shift technology
    allows better methods to recognise images of patterns and templates. Examples
    of recognising such images were also examined by using simple and understandable
    patterns.


    However, among all the existing problems of image recognition, there are tasks
    that can best be solved by using the technology of parallel shift. Such tasks
    are characterised by the fact that images that are recognised are complex. During
    the recognition process, complex images are divided into separate elementary elements
    and each selected image element is described by using the characteristic feature
    vector.


    One of the tasks is of recognising printed and handwritten text. To date, the
    texts are recognised mainly in the sequence given below.


    The process broken into two stages. The first stage is aimed at learning the system.
    In the process of learning of the image recognition systems, standard models of
    images of symbols are formed as also their vectors of characteristic features.
    These codes with identifiers are stored in the memory of the templates codes.'
