    20。


    在两种情况下，我们都有少量同质元素来描述对象。这些向量中的每一个都可以使用神经网络进行处理（Milanova et al., 1999; Ranganath
    and Arun, 1997; Lawrence et al., 1997; Yoon et al., 1998; Aizenberg et al., 1999;
    Minsky and Papert, 1969; Kozhemyako et al., 2001）。少量输入数据允许使用少量神经元来构建它。积分比值不超过
    0.5。归一化的傅里叶级数谐波值接近于 1。这些值使得向神经网络组织输入信息向量变得容易。


    基于交叠面积函数指标分析的计算机图像识别处理系统旨在处理任何平面图像，并可用于任何视频监控系统。由于交叠面积函数过程涉及处理大量视频数据，为了加快该过程，建立高性能专用设备是合适的。


    ## 基于 FAI 分析的图像处理和识别系统生产力评估


    图像处理系统的生产力可根据各种参数进行评估。这些指标包括单位时间处理的信息量，或多个图像中正确识别的图像百分比。


    基于交叠面积函数分析的图像识别系统信息处理速度的确定是不可能的。在撰写时，构成此类系统的硬件尚未构建。软件建模是使用 Delphi 7 编程语言进行的。在图像识别系统的编程模型中，工作字段的大小为
    500×500 像素。其方形形状对于在学习阶段实现对象旋转过程是必要的。在这种情况下，平均花费一秒钟来形成一个 FAI。真实图像的交叠面积函数确定用于两个正交方向；此外，还包括直接比较真实图像与图像模式的
    FAI 和积分系数所花费的时间。显然，对于硬件实现，由于并行过程，处理对象所需的时间将少两个数量级。


    未来，基于 FAI 分析的图像处理系统的生产力评估将按识别质量标准进行。这些过程模拟图像处理和分析的初步阶段，并接近真实图像。因此，在这种情况下，如果不使用可接受的误差参数，就无法进行识别。基于交叠面积函数分析的图像识别系统使用三种可接受误差类型。


    在快速识别阶段比较交叠面积函数的积分比值时使用误差 $dk$；误差 $dS$ 用于在详细识别阶段比较交叠面积函数；误差 $dN$ 用于最大偏移值确定公式中。在图像处理系统中使用这些误差是必要的，特别是与数学计算中的某些舍入、数据数组转换过程中的信息丢失以及接收器字段中可能存在的噪声有关。


    ### 6.1 评估所选去噪方法的效率


    每种数据处理方法的一个重要因素是选择去噪算法。图形区域基于平行平移技术的预处理和图像识别方法进行分析。在这种情况下，噪声干扰被视为局部组和轮廓图像及线条的单独元素。此外，噪声将被视为零，因为相同性质的元素可能出现在构成二值图像的二值元素所在位置。


    为对抗噪声，可以采用先前描述过的轮廓点移除方法。在 PSNR 为 20 dB 到 40 dB 的值范围内，该方法相当有效。在此噪声水平范围内，FAI 的刻度值及各种其他因素的偏差不超过真实指标值的
    10%。


    然而，在创建临时处理和图像识别过程的软件模型期间，轮廓点移除方法一直处于设计阶段。因此，为了模拟噪声控制阶段，使用带有阈值 5 的 3×3 方形滤波器。当
    3×3 矩阵的二值元素之和大于或等于 5 时，中心元素被赋值为 1；否则将其设置为 0。如下所示，使用此滤波器进行噪声控制的过程在 PSNR 为 20 dB
