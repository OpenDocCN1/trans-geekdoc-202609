    # 3.4 Model for Obtaining FAI of No Bitmap


    Most of the known pre-treatment methods consider the image as a bitmap. The object
    transformation method into a set of functions of the area of intersection allows
    processing of a bitmap image, as well as no bitmap. When transactions with no
    bitmaps occurs, the preprocessing and binarisation processes are not necessary.
    The process of separation can be realised by means of optical filters. Possible
    model for the implementation process of FAI in this case is shown in Fig. 3.12.


    Marking time t₁ corresponds to the moment the path of the light flux area of image
    S₀ appears. Time t₂ is a moment of zero crossing shape and its copy, which is
    shifted in parallel.


    In this case, Lm1 = Lm – 2S₀ + FAI(t) and the value of the function of the area
    of intersection at the site from t₁ to t₂, respectively will be equal.


    FAI(t) = Lm1 – Lm + 2S₀,


    This model for obtaining FAI of no raster images is merely exemplary in the possibility
    of its implementation. This paper considers mainly the variant of raster image
    processing. The ability to handle no bitmaps or images with an irregular arrangement
    of the elements is one of the key advantages of the application of methods based
    on parallel shift technology.


