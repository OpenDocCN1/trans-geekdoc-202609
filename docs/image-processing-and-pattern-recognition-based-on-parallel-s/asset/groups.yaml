    of the face cannot be recognised. At the same time, the human visual channel recognises
    faces with distortions as well as its caricatures.


    Developers typically solve special problems for image recognition with specific
    forms and brightness characteristics. Studies show that the greater the characteristic
    features extracted from the image the more accurate is the recognition result.


    Today, a number of methods have been developed that are used to extract the characteristic
    features images (Nixon and Aguardo, 2002; Pratt, 2016). All these methods are
    based on preliminary image transformation. Among such transformations are Fourier
    transformation (Nixon and Aguardo, 2002; Bracewell, 1986; Solomon and Breckon,
    2011), wavelet transformation (Nixon and Aguardo, 2002; Daubechies, 1990), Hough
    transformation (Gonzalez and Woods, 2008; Ballard, 1981), affine transformation
    (Belan, 2011; Bilan, 2014), discrete cosine transformation (Ahmed et al., 1974),
    Hartley transform (Bracewell, 1984a, Bracewell, 1984b) and other methods.


    Different types of filtration are used for extraction of the characteristic features,
    which are fully described in various literatures (Nixon and Aguardo, 2002; Gonzalez
    and Woods, 2008). All of these approaches focus on extraction of the previously
    defined characteristic features or identifies those features that can extract
    by using these methods. Thanks to these methods the number of characteristic features
    may prove excessive and may not provide a complete description of the image.


    Widespread image recognition methods do not extract the specific characteristic
    features. These include methods based on the use of artificial neural networks
    (ANN) (Xingui andShaohua, 2010; ICANN, 2014), cluster analysis (Anil K. and Jain,
    2010; Chang et al., 2012; Berklim, 2002; Islam and Ahmed, 2013) and etc. require
    preliminary preparation of images for their recognition.


    ANN uses a large database of patterns for recognition and require larger neural
    network learning costs. The most universal ANN include cognitron and neocognitron
    (Fukushima, 1983).


    Cluster analysis is to find and combine image elements through specified properties.
    These properties can be shapes, colours, etc. Cluster analysis is very effective
    in image segmentation; genetic algorithms and fuzzy sets (Tahmasobi and Harakhani,
    2012), and fractal theory (Barnsley, 1988, Saupe, 1996) are also used.


    All these methods have substantial differences, but certain advantages and disadvantages.
    The most common approach is to extract the characteristic features of an image
    by using known or developed methods and the formation of the vector of the characteristic
    features. The extracted characteristic features may be rigidly located in the
    vector or may be independent of the location. Created vector in the memory of
    patterns is recorded and the identifier belonging to the class is assigned.'
  - '[PAGE 21]


    However, a created vector of the characteristic features does not always give
    the desired result. Also, the more the characteristic features are the more the
    computational operations and transformations the system must perform. This reduces
    the accuracy and speed of the recognition system.


    In modern literature, almost no attention is paid to reducing the number of characteristic
    features. Authors did not know image processing and pattern recognition systems,
    which, on the basis of one or more characteristic features, would render it fully.
    These features need not necessarily be part of the image but may be the result
    of a quantitative indicator of the input image transformations.


    According to the authors, the most simple image transformation is its shift and
    a quick and easy computable setting of the image is an area. The combination of
    the operation of parallel shift and calculation of the quantitative value of the
    image area gives good results in image recognition systems. In addition, the shift
    of images and the definition of its area are easily implemented in optical systems
    that work with analog images but the result may not be in digital form.


    # 1.4 Theoretical Description of the Parallel Shift Technology


    Parallel shift technology (PST) - the process organisation of interaction of the
    object, the elements of which are described by n-dimension vectors of the characteristic
    features, with its own copy, in elements which are changing only one or more CF
    than in the original (Belan and Yuzhakov, 2013). This process is similar to parallel
    shift in the space of variable characteristic features. To provide a process to
    the parallel shift, it is necessary to choose the characteristic features which
    have numerical values, for example, coordinates, time or phase.


    Each element of the initial set is obtained by superposition pair of vectors with
    characteristic features, whereby the second element will be the element of parallel
    shifted set. The result of the interaction of vectors differs from initial vector
    characteristic features of the object and can be used for further analysis. The
    options available for analysis of the interaction of the original object and its
    copies can be any mathematical operations and the tools of analysing the sets.
    If the result obtained by parallel shift of a particular set of quantitative values
    for the different shift values, a set can be considered as a function of displacement.
    For example, there is an input object representing a sinusoidal signal. When shifting
    the sinusoidal signal-copy in phase space, its sum with an initial signal will
    be different from the sine wave and when the phase shift is by π it will be zero.


    The use of parallel shift technology is advantageous when solving image recognition
    tasks and processing of dynamic objects.'
