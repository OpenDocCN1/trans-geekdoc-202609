    # # Methods of Dynamic Images Processing Based on PST


    Modern machine vision systems involve the use of processing of video data in real
    time. In particular, as example of such systems, can be autonomous robots, assembly
    lines in manufacturing and surveillance systems (Belan and Yuzhakov, 2013). The
    development of machine vision systems can also be the basis for the human eye
    prosthesis.


    The main tasks that are solved with the help of machine vision systems are the
    following: Identification of the object of observation, determination of its spatial
    location, physical parameters and parameters of movement in space.


    Recognition involves identifying an affiliation of object to a class, which is
    the basis of the action analysis of intellectual system for further interaction
    with the object (Chen et al., 1995). Furthermore, in automated assembly lines,
    this task includes the process of determining existence of specified properties
    and the absence (or presence) which causes an assignment of the product.


    Modeling of the spatial position of objects is carried out for two coordinate
    systems (internal and external). Location of objects in the external coordinate
    system allows creation of a model of the world. This model exists objectively
    and does not depend on the actual location of IS. The outer world model is suitable
    for use in many intelligent systems, regardless of their individual characteristics.
    Geographic maps can be a simple example of external models of the world. The construction
    of these models is easiest to do with the help of external positioning devices.
    So an important achievement in this area is the use of GPS systems. However, the
    establishment of external models of the world has no relation to the parallel
    shift technology. Therefore, this aspect of video processing is not considered
    in this book.'
  - '[PAGE 65]


    Parallel shift technology allows processing of the objects that can be perceived
    by the system as a flat image. These objects should be in immediate surroundings
    with IS. Defining location relative to the internal coordinate system is necessary
    to carry out by an intelligent system the necessary acts of interaction with the
    surrounding objects. This model is subjective and individual for each IS.


    Determination of the physical parameters (linear dimension, area, volume, contour
    shape) is inextricably linked with the processes of identification and spatial
    localisation. This process allows replenishment of the environment models of real
    objects.


    The main characteristics of object motion parameter are direction, distance and
    speed of displacement. Some systems use the parameter as acceleration, but it
    is just a derivative of the velocity. Therefore, it is not related to the basic
    parameters of motion. Knowledge of motion parameters gives the intelligent system
    the opportunity to construct the algorithm of the following actions in time. This
    becomes one of the main tasks of intelligence-prediction of the future for a timely
    response to the impact of external factors.


    Hardware implementation of video surveillance process is based on the use of system’s
    ‘sensor-analysis unit’. The system uses various types of sensors. Basically it
    is usual (or special) video camera, but can also use ultrasonic echolocation devices
    and other devices to signal the spatial location of the object. The number and
    type of sensors are selected on the basis of the need to achieve the goal which
    is implemented by this intelligent system and its geometric parameters.


    The difference in ordinary and specialised cameras is that a first-class camera
    fixes the image for further transmission to the analysis unit. The second class
    of cameras has built-in processor system, which transforms images in a certain
    way that allows it to accelerate further analysis.


    The video surveillance systems can be part of both fixed and mobile intelligent
    systems. The advantage of stationary systems is the ability to use a wide range
    of different types of sensors and the possibility of their location in free space.
    Biological beings, autonomous robots and video surveillance systems in transport
    belong to moving objects. Use of sensors in these cases is limited to the size
    of the organism or the technical means. To determine the spatial location and
    the physical parameters of external objects, it is advisable to use a binocular
    video system, laser sensors and devices like ultrasonic echolocation.


    An important factor in image processing is the speed of information exchange within
    the video surveillance system. Obviously, at the stages of perception and preliminary
    preparation of data for further analysis, the system built on the basis of PST
    operates more slowly than in the case of direct data transmission to the analysis
    unit. The process of forming a set of functions of the area of intersection leads
    to certain time expenses.'
