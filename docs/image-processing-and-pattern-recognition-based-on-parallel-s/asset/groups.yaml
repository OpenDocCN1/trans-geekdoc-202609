    \ 前言  \n\n计算机图像处理和识别系统的发展是人工智能的主要方面之一。目前，除了数字图像处理之外，没有处理视频信息的有效方法。本书提出了一些基于平行剪切技术的图像处理替代方法和算法。将这些方法与数字图像处理结合使用，将能够构建混合图像处理系统。这些方法和算法也可用于模拟计算机。\
    \  \n\n本书不以点阵形式描述图像，而是描述为一组函数。通过分析这些函数，已开发出图像处理的方法和算法，利用这些方法可以解决图像处理的主要任务。将图像描述为一组函数，可以操作栅格和非位图图像。只分析一种定量特征——图像面积。使用平行平移技术还可以处理由不规则排列元素组成的图像。科学工作是根据这一分类构建的。\
    \  \n\n本书致力于开发和研究将多种变换应用于计算机图像处理和识别的方法。与已知方法不同，所提方法使用较少的特征来描述图像，并减少了系统中的计算操作次数。基于平行平移技术，开发了物体形状与交叠区域函数之间关系的数学模型。本书描述了图像识别方法、物体空间方向确定、其运动参数以及图形轮廓确定方法。还描述了使用各种输入图像参数的模式识别效率研究。\
