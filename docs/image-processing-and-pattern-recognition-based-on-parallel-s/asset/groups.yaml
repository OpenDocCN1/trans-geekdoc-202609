    are defined to make it possible to describe the image (Nixon and Aguardo, 2002;
    Tremeau and Borel, 1997).


    A successful description and presentation of images greatly affects the efficiency
    of their recognition as well as display.


    # 1.3 Characteristic Features of Images


    The characteristic features describe the image by using the minimum set of elements
    with minimal loss of image restoration. The characteristic features may be set
    in advance, or extracted from the image for its recognition.


    The recognition task is used when the input image is unknown. In this case, the
    characteristic features are extracted by an image recognition system itself. Recognition
    is characterised by a process that assigns an object to one of the previously
    specified fixed list (class) according to a specific set of rules in accordance
    with the intended purpose. Recognition can be carried out by any recognition system
    that generates a set of features, according to which the system determines the
    class to which the image belongs.


    Extracted characteristic features of the image at the input by a system of recognition
    provide a meaningful description of the image.


    However, at the moment there is no universal method for selection of a full set
    of characteristic features for all the images. For each class of images, a set
    of features is selected by developers of the recognition system. These characteristic
    features do not always give 100 per cent results and cannot be applicable to other
    classes of images. For example, the characteristic features of the face of a person
    (the distance between the eyes, nose length, the shape of the lips and so on)
    cannot be applicable for human fingerprints (control points, lines form and so
    on) and conversely. Moreover, all these features are set in advance by the developer
    based on his intuitive experience and a thorough study of the selected class of
    images.


