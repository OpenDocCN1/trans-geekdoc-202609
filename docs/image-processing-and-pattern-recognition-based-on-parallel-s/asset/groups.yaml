    ## 8.3 借助 FAI 基本属性的定量特征描述图像


    该方法与第 8.2 节中描述的方法不同，在于分析 FAI 曲线。如果在第一种方法中存储和处理交叉区域面积函数的数值，那么在第二种方法中，则是 FAI 曲线。


    图形分析方法通过使用图 8.2 和 8.3 详细且清晰地描述。


    为实现图像的第二种描述方法，开发了一个模拟 FAI 曲线分析技术的程序。与前一种方法一样，为 0°、45°、90°、135°、180°、225°、270°
    和 315° 的剪切方向形成了交叉区域面积函数。另外，为研究选择了 BMP 格式、大小为 500×500 个离散元素（像素）的图像。划分步骤数最多选择七个分区，即可以整体、通过两段、三段等分析
    FAI 曲线。曲线划分的最大段数为七段。对于更大的图像尺寸，有必要增加 FAI 曲线的段数。但是，如果图像尺寸较小，则 FAI 曲线的可能分区数量会减少。


    在上一节中，估计了图像标准模型的各种偏差及其方向。但是，使用第一种方法确定比例变化比较困难；第二种方法最为合适。


    因此，使用第二种方法进行实验研究的第一个方向是确定形状相同、尺寸不同的图像。为解决此问题，最初指定了一张参考图像，并确定了其 FAI 以及 FAI 曲线划分所有段处的
    FAI 曲率值。即使是相同图形的图像也被放大或缩小了比例。


    因此，创建了形状相同的图形集。图形的形式由多边形的顶点数及相邻边在该顶点处的角度决定。为进行实验研究，选择了图 8.13 所示的图像。


