  - '[PAGE 179]


    Thus, images can be divided into classes according to the shape of the contour
    and by the content inside the contour. All these images of geometric shapes can
    have their names, like planes, houses, windows, faces, people, etc. This applies
    to individual objects of geometric shapes. If images have complex shapes, then
    the use of parallel shift technology requires additional preliminary transformations,
    which are aimed at selection of individual objects in the visual sphere. In future,
    analysis of the function of the area of intersection of each selected object in
    the image and the determination of its location is carried out.


    According to the conducted research, it is possible to formulate the following
    recommendations for realisation of the description and recognition of images.
    The process of description and recognition of images based on the technology of
    parallel shift can be represented by the following steps:


    +   1. The function of the area of intersection of images at the input of the
    image recognition system is formed.

    +   2. A set of values of the increments of the FAI curve is formed.

    +   3. The presence of local extremes on the curve of the formed FAI is determined.

    +   4. According to the obtained FAI, the geometric shape of the image of the
    figure is determined and referred to the corresponding class of polygons.

    +   5. From the obtained values, the curvatures of the FAI curve as per the scale
    of the recognised triangle is determined.

    +   6. If there are sharp drops or local extremes, then the gaps in the image
    are determined.

    +   7. According to the analysis of the function of the area of intersection and
    the curvature of the function of the area of intersection, the presence of holes
    and their topology is determined.

    +   8. The shape of the FAI curve is determined by the presence of patterns and
    regular images.

    +   9. If a template image is not found in the base of the standards, then the
    obtained FAI is assigned an identifier, and it and the curvature values are written
    into the base of the standards.


    The fourth step includes additional operations for recording distortion in the
    image and distortion of the contour, which can lead to false recognition of the
    image.


    Also, for recognition, the limits of the deviation of the FAI values and the curvature
    values of the function of the area of intersection are assigned. If the FAI values
    fall within the permissible limits, then this image is identified by a reference
    image, where the value of the FAI value lies within these limits. Analogously,
    the admissible boundaries for the curvatures of the FAI curve are assigned.'
