    0} \approx X_{max 1}$) and at the top part, the horizontal component will appear.
    When an object approaches the observer a form of regular FAI surge changes as
    follows. The maximum FAI value will not change ($S_1 = S_0$), but its width will
    change significantly ($X_{max 0} < X_{max 1}$) and at the top the horizontal component
    will appear. Examples of changing the shape of the cyclic function of the area
    of intersection are shown in Fig. 4.7.


    The distance of the object in this case should be analysed by two parameters areas
    ($S_1$ and $S_0$) and the maximum shift values ($X_{max 0}$ and $X_{max 1}$),
