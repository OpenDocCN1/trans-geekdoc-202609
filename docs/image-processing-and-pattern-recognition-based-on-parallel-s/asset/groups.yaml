    流半透明镜 MCI1 通过，每个镜子将一部分光通量反射到光电探测器 FD 上。在此情况下，第一个 MCI1 的位置使得图像从其上反射并落在光电探测器上，偏移量为一个离散图像（所选方向上的单位距离）。来自
    MCI1 的光流第二部分送入 MCI2。来自 MCI2 的光通量投射到光电探测器上。在此情况下，来自 MCI2 的光学图像相比原始图像偏移了两个单独的离散图像落在
    FD 上。MCI3 在光接收器的视场中实现三个离散间隔的图像偏移，而 MCIk 在光电探测器视场中实现 k 个离散间隔的图像偏移。


    每次只有一个透明片开始传输光学信号。在每个 MCI1 和光电探测器之间放置一个 OT1。最初，第一个光学透明片 OT1 打开，来自第一个 MCI1 和 MII
    的光通量照射到 FD 上。


    在两束光交汇处，光学信号的强度大于来自 MII 的光学信号强度。光电探测器作为阈值元件工作，并固定由强度大于来自 MII 的光学信号强度的光流覆盖的区域。面积计算器形成结果。该结果可以是模拟形式或数字形式。


    FAI 的值可以以模拟形式或数字形式书写。由于我们先前已考虑数字电子形式，今后将考虑交集面积函数的模拟存储和表示形式。


    借助图 7.26，基于光学系统的图像在交集面积函数中的转换过程变得清晰。然而，这种系统仅在一个方向上实现 FAI 的获取过程。在所有方向上形成交集面积函数的光学系统结构如图
    7.27 所示。


    第二个系统与第一个系统的区别在于，第二个系统中添加了光纤图像分配器（FOID）和四个光学可控透明片（OCT0、OCT90、OCT180、OCT270）。第二个系统的工作方式与第一个系统相同。但是，在第二个系统中，还可以将原始图像按四个角度（0°、90°、180°、270°）旋转。图像旋转通过使用
    FOID 实现。输入原始图像送入 FOID 的输入光圈，并分配到四根光纤上，这些光纤为 FOID 的输出。每根光纤的输出光圈相对于 FOID 的输入光圈分别旋转
    0°、90°、180° 和 270°。光学信号仅从一根光纤的输出送入 FOID，这是因为只有一个光学透明片允许光学信号通过。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_136_0.png)


    图 7.27：剪切方向 FAI 图像形成光学系统


    如果 OCT90 为透明状态，则输入图像投射到旋转了 90° 的光电探测器上。为了进行偏移，依次切换位于每个 MCI 之后的光学透明片 OT。OCT 和 OT
    的这种状态使系统能够计算 FAI(90°)。因此，OCT 状态为系统提供偏移方向，而 OT 状态则在所选方向上实现图像偏移。如果输出 FOID 处的光纤数量增加，偏移次数和接收到的
    FAI 数量也会增加。光学透明片可以通过光学或电信号控制，但需要对系统中所有光学模块进行严格对准。


    存储计算出的交集面积函数的任务仍然存在。已知各种光学存储器构建方案，并以光学形式存储。这种存储器可以成功应用于存储交集面积函数的值。然而，作者建议考虑一种将每个
    FAI 表示为一组光学信号强度值的存储器。


    每个交集面积函数由一排发光元件表示（图 7.28）。


    光学信号强度值 FAI_i 在发光元件中的记录通过控制输入（CI）上的信号进行。发光存储元件（LEME）的结构如图 7.29 所示。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_137_0.png)


    图 7.28：单方向计算出的交集面积函数存储线结构


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_138_0.png)


    图 7.29：存储器发光元件的功能图


    发光存储元件包括可控功率元件（CEE）和发光元件（VD）。可控功率元件与 VD 包含在同一电路中。CEE 的电阻值 R_CEE 通过控制输入


    (CI)。电阻 R_CEE 限制流过 VD 的电流大小。因此，VD 发出的光强度与电流大小成正比。


    有许多方案实现了可控功率元件的原理。CEE 电阻可以通过电信号或光信号进行控制。在这种情况下，可控功率元件即使在切断供电电压后也必须保持其电阻。通电后，发光元件应发射固定强度的光学信号。


    因此，通过设置必要的 CEE 电阻来实现交集面积函数的记录。即使在断开供电电压时，该电阻仍会保持。要读取交集面积函数的值，需要连接供电电压，然后发光元件会发射相应强度的光学信号。


    交集面积函数存储器可以由多层存储器组成。FAI 存储器的一层如图 7.30 所示。


    增加存储层数可以增加 FAI 存储容量。这种存储器不需要显著的功耗且速度高。


