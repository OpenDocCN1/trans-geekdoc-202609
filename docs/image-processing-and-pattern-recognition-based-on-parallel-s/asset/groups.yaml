    Hardware process can be implemented as follows. We use two matrices (A and B),
    one of which (B) is a set of shift registers. Depending on the type of functions
    obtained in the intersection area, the shift may be cyclic or not. Reasons for
    obtaining various types of the function of the area of intersection will be described
    in the following chapters. The matrix A is filled with the input image elements
    aij. This A matrix is copied into matrix B, in which the shift occurs by a signal
    of control device. Appropriate cell arrays combine elements of logical multiplication.
    The outputs of U gates are fed to summation block-level output signal and the
    value of which corresponds to the FAI value for the current time shift. Construction
    of the summation block may be implemented using standard logic components (encoders,
    counters, multiplexers, analog-to-digital converters). Rotation of the functions
    of area of intersection should be carried out continuously until the stop signal
    system is reached. Non-cyclic shift is performed before the absence of the intersection
    shape and its copies, or when reaching the FAI threshold with the influence of
    noise effects threshold (dN). Block diagram of the device receiving FAI on Fig.
    3.11 is shown below.


    In the functions of the area of intersection, the flat binary image is considered
    as image on input. The matrix elements are set to 0 or 1. To study the halftoned
    image, the gradients of luminance change at appropriate points to be seen as elements
    of input matrix. This opens up broad prospects for application of different methods
    of interaction between the elements of the image and its copy. Studies have not
    been conducted in this direction though.


