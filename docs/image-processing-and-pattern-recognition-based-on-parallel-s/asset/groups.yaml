    ## 7.4 现代 CAD 系统中确定 FAI 的主要硬件模块建模


    基于并行移位技术的图像识别系统需要硬件实现。此类系统的硬件实现可显著提升其性能。所提方法已通过软件进行仿真，并在后续章节中讨论。软件实现耗时，从而限制了应用范围。


    前文给出了基于并行移位技术的图像识别系统主要组件的详细数字图。所有提出的电路方案均采用数字元件基础呈现。因此，建议将这些电路实现为 FPGA 上的嵌入式系统。为对
    FPGA 进行编程，使用各种软件 CAD（http://www.xilinx.com, http://www.altera.com, http://www.aldec.com）。这些
    CAD 系统的界面因生产 FPGA 的公司而异。


    最流行的是 Xilinx、Altera 等公司的产品。所述方法的作者使用 Xilinx 芯片并采用该公司开发的软件。Xilinx 软件 CAD 包含以下内容（http://www.xilinx.com）：


    - Alliance Series 软件包，包括用于追踪和接入原理图及文本编辑器的模块，并引入其他公司的项目。

    - Foundation Series 软件包，包括使用电路技术、VHDL / Verilog 综合、功能建模、晶片追踪及追踪后仿真。


    - WebFitter 是 XC9500 系列 CPLD 的 FPGA 追踪器。该产品仅通过 Internet 提供，并物理位于 Xilinx 服务器上。用户仅可使用界面。

    - WebPack 可通过 Internet 免费分发，用于 HS9500 系列 FPGA 和 CoolRunner 以及 FPGA 和 Spartan-II
    芯片 Virtex-E XCV300E 家族的软件开发。通过 Internet 免费下载并在 PC 上安装。

    - Vivado CAD 专注于大量使用 IP 核（无论是 Xilinx 或其他制造商提供的，还是由项目开发者创建的）。


    所有这些软件产品均可从 Xilinx 网站下载（http://www.xilinx.com）。


    同时，任何数字电路均可使用专用编程语言（VHDL, Verilog, Abel 等）进行描述。使用这些语言描述的模型可用于几乎所有软件 CAD 系统。为实现识别系统，采用了
    VHDL（Ashenden, 1990; Zimmermann, 1998; Rushton, 1998; Pong, 2006; Ashenden, 2001;
    Mealy and Tappero, 2012）。


    使用 VHDL 语言，项目可按不同层次结构表示：


    - 行为级

    - 寄存器传输级

    - 使用延迟模块的功能-逻辑级

    - 考虑开关时间的逻辑元件级

    - 基于项目单个组件的级别，这些组件存储在专用库中


    生成的 VHDL 代码加载至所选 CAD，该 CAD 生成位图文件。此文件用于对所选 FPGA 进行编程。


    为准备项目，使用了多个 CAD 系统——Active-HDL, WebPack 和 Vivado。借助它们，系统主要组件以 VHDL 代码形式得到。这种方法允许确定
    FPGA 主要元件的使用百分比。这使得可以确定项目成本和主要操作的时间，以及评估能耗水平。


    考虑系统基本元件的实现。仿真未考虑系统各逻辑元件的延迟。


    仿真的第一个元件是第一个 A1 矩阵（Fig. 7.5），用于原始图像的静态存储。第一个 A1 矩阵由同质存储元件组成。根据所执行的功能，第一矩阵的元件表示为
    RS 触发器，可轻松通过 VHDL 描述。此类 RS 触发器的模型如 Fig. 7.16 所示。


    '
