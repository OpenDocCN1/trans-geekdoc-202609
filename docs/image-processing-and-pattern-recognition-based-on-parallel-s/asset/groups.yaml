    ## 8.4 图案图像 FAI 的实验分析


    平行移位技术可以有效地用于具有复杂结构并用于形成各种图案的图像，尤其是用于描述和分析填充不同图案的图像的方法。此类图像具有交叠区域面积函数，其形状由一组局部极值组成。图案是一个


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_172_0.png)


    由线条、颜色和阴影组成的图像。图案还构成了基于重复和组成元素交替的模板。此类图案构成装饰图案。


    图 8.27: 所选剪切方向 FAI 值变化值分布直方图


    这种形式取决于图像中间隙的存在。图像中间隙的大小决定了 FAI 曲线上局部极大值的大小。图 8.26 中给出了螺旋图像此类 FAI 的示例。显然，用第二种方法估计交叠区域面积函数需要大量的划分和额外计算。因此，估计此类
    FAI 最合适的方法是使用基于估计相邻移位时间步面积值变化动态的方法。


    图像中不连续性的第一个指标是数量代码中存在负数，该负数反映了 FAI 曲线变化的动态，如表 8.6 所示。不连续性的性质也通过分析各个方向获得的 FAI 来确定。具有水平和垂直不连续性的图像示例，以及它们的
    FAI 和不同划分数量的曲率计算结果，分别在图 8.28 和 8.29 中给出。


    对所得值的分析表明，第一种和第二种方法都适用于确定图像中的不连续性。图 8.28 显示了剪切方向 90° 的垂直不连续性，因为该方向交叠区域面积函数的曲线几乎是一条直线。然而，仅凭一个方向无法判断不连续性的存在。还需要分析其余方向。在我们的示例中，这些方向的交叠区域面积函数具有局部极大值，表明图像中存在间隙。基于移位方向
    0°、45°、90° 和 135° 的交叠区域面积函数，可以清楚地看出图像中存在垂直间隙。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_173_0.png)


    图 8.28: 具有垂直不连续性的图像示例及其在剪切方向 0°、45°、90° 和 135° 下的 FAI


    对于第二个示例（图 8.29），直线将 FAI 映射到 0° 移位方向。其余的交叠区域面积函数具有曲线形状。曲率的大小决定了断裂宽度以及断裂两侧图像部分的宽度。这也可以从相应划分段上的曲率值中确定。


    两个示例均用于使用平行移位技术初步理解不同图案的描述。为了描述识别不同图案的技术，使用了图 8.30 所示的图像。


