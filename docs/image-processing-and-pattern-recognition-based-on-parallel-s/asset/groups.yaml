    用于仿真示例的所有图像均为二值图像。它们可以是凸形、不规则形状，或由多个对象组成。


    傅里叶级数谐波数取决于图案的数量和形式。在软件建模过程中发现，创建凸图形的图案FAI时，最好使用前五个傅里叶谐波。创建非凸图形的图案FAI时，只需使用前十个傅里叶谐波。创建由多个对象组成的图形的图案FAI时，只需使用前二十个傅里叶谐波。在所有这些情况下，重建的FAI与真实FAI的偏差在每个位移步长上不超过真实函数值的10%。此外，在选择与特定FAI对应的等模时，可以使用FAI函数特定部分的真实值与图案值的平均偏差。图5.9展示了使用不同数量的傅里叶级数谐波来恢复FAI的函数图表模板示例。


    | FAI方向 | 用于恢复等模FAI的傅里叶级数谐波数量 | | |

