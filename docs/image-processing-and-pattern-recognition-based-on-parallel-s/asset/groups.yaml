    The first analysis of the obtained results of the FAI formation in Fig. 8.5, was
    to determine the amount of deviation of distorted figures from the basic standard
    figure. As a basic standard model of figure, any figure can be selected. For our
    experiment, we chose the solid (filled) polygons (square, triangle and pentagon).
    The convex figures have been selected.


    For each template figure, a set of distorted figures has been formed. The distortions
    were replacement of black pixels by white. The functions of the area of intersection
    for all formed sets of images were also formed. The analysis showed that deviation
    in any of the possible directions of the shift does not exceed 2n (where n is
    the number of distorted black pixels).


    However, this value may not be present in all directions. In the obtained FAI,
    differences are observed in the first value of the shift. The decrease in differences
    is determined by the number of pixels P that are located between the edge of the
    hole and the edge of the figure in the corresponding shift direction (Fig. 8.9).


