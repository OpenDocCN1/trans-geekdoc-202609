    在构建反映标准 FAI 的傅里叶级数时，采用了以下归一化谐波公式（Mills, 2006）：


    $FFTN_0 = \frac{1}{S_0} \frac{1}{\sqrt{X_{max}}} \sum_{j=0}^{X_{max}-1} FAI(j)
    \quad (5.1)$


    $FFTN_i = \frac{1}{S_0} \frac{\sqrt{2}}{\sqrt{X_{max}}} \sum_{j=0}^{X_{max}-1}
    FAI(j) \cdot \cos \left( \frac{\pi \cdot i \cdot (2 \cdot j + 1)}{2 \cdot X_{max}}
    \right) \quad (5.2)$


    初始图像面积（$S_0$）和最大位移（$X_{max}$）的值是交集面积函数的基本参数。逆恢复 FAI 根据公式（5.3）实现：


    $FAI(j) = S_0 \cdot \left( \frac{FFTN_0}{\sqrt{X_{max}}} + \frac{\sqrt{2}}{\sqrt{X_{max}}}
    \sum_{i=1}^{X_{max}-1} FFTN_i \cdot \cos \left( \frac{\pi \cdot i \cdot (2 \cdot
    j + 1)}{2 \cdot X_{max}} \right) \right) \quad (5.3)$


    数据集（$S_0, X_{max}, FFTN_{0+} + FFTN_i$）取自模式数据库。图 5.8 显示了以傅里叶级数最初二十个谐波形式保存汉字“龙”的模式表面的示例。


    在保存标准表面的模拟中（Belan 和 Yuzhakov, 2014），用于 36 个方向（ANGLE），步长为 5 度，采用了傅里叶级数的归一化谐波（$FFTN_0
    + FFTN_{19}$）。由于需要保存模式表面，范围从 0 到 $\pi$ 的方向被涵盖。真实图像的初始面积（$S_0$）的值也被存储，所选方向的最大位移（$X_{max}$）在识别系统的学习过程中获得。这两个参数的值对应于学习样本真实图像的数据。它们在交集面积函数的恢复过程中用于某些额外系数和缩放。由于建模中使用数字图像，最大位移以像素计算，初始面积等于属于图像的像素数量。WHAT
    字段包含由人赋予的对象名称；INTEGR 字段是相应方向的积分系数值。它用于加快各种过程中的图像处理。


    创建该过程的软件模型旨在基于平行移位技术演示图像处理。因此，所选的模式数据库结构并不完美。在实际应用中，它可以进行归一化。此外，还可以实现模式的自动命名（在
    WHAT 字段中）。命名可以是任意的，也可以通过分析现有数据库生成。但这属于另一个与机器学习过程相关的话题，在其他科学来源中有所描述。因此，我们不会详细描述这些问题。


