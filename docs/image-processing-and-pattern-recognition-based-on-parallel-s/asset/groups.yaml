  mdcn: "\n\n感受野中物体位移的距离和方向是通过分析每对相邻帧图像质心的调整坐标来确定的。\n\n## 4.5 确定移动物体距离的方法\n\n前面各节中描述了允许定义视方向垂直平面内物体运动参数的方法。这些方法无法确定所研究图像的距离。以下是一种通过分析交叉区域面积函数来确定物体距离的方法。\n\
    \n为了对物体进行空间定位，需要确定到其的距离。物体距离的定义有多种方法，例如，利用超声波定位、激光以及双眼视觉系统构建。为了不采用其他特性技术，PST被用于确定此参数。2D物体距离的测定可以利用图4.6的相似性特性来实现。\n\
    \n根据这些特性\n\n```\n\\frac{l + \\Delta l}{l} = \\frac{Y_{max 0}}{Y_{max 1}} = \\\
    sqrt{\\frac{S_0}{S_1}}, \\quad (4.20)\n```\n\n由此得出\n\n```\nl = \\frac{\\Delta\
    \ l \\sqrt{S_1}}{\\sqrt{S_0} - \\sqrt{S_1}}. \\quad (4.21)\n```\n\n其中 \\(l\\)\
    \ – 初始物体距离；\\(Y_{max0}\\) 和 \\(S_0\\) – 时刻 \\(t_0\\) 时的 FAI(y) 参数；\\(l_1\\) –\
    \ 到物体的距离；\\(Y_{max1}\\) 和 \\(S_1\\) – 时刻 \\(t_1\\) 时的 FAI(y) 参数。\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_75_0.png)\n\
    \n图 4.6：确定物体距离过程的图形模型\n\n要确定初始物体距离 \\(l\\)，可以通过移动光学系统本身或改变感知摄像机的焦距来改变到物体的距离（类似于眼睛的调节过程）。由此，指定\
    \ \\(\\Delta l = l_1 - l\\)。为了获得 \\(\\sqrt{S_0}\\) 和 \\(\\sqrt{S_1}\\) 的值，需要通过改变焦距或光学系统的位移距离，在变化前（$t_0$）和变化后（$t_1$）时刻确定物体面积。\n\
    \n在所提方法中，$t_0$ 和 $t_1$ 时刻对应于建立两个相邻帧，此时不发生副本图像的循环移位。\n\n在由于物体距离变化而对图像副本进行循环移位时，交叉区域面积连续函数的形状会发生变化。当物体远离观察者时，另一种\
    \ FAI 峰的形状尺寸会变小（$S_1 < S_0$），其宽度变化不大（$X_{max 0} \\approx X_{max 1}$），并且在顶部会出现水平分量。当物体靠近观察者时，常规\
    \ FAI 峰的形状变化如下。最大 FAI 值不变（$S_1 = S_0$），但其宽度会显著变化（$X_{max 0} < X_{max 1}$），并且在顶部会出现水平分量。交叉区域面积循环函数形状的变化示例见图\
    \ 4.7。\n\n在这种情况下，物体距离应通过两个面积参数（$S_1$ 和 $S_0$）以及最大位移值（$X_{max 0}$ 和 $X_{max 1}$）进行分析，使用变化的那些。在计算中移除图形时，使用交叉区域面积函数的值。\n\
    \n```\n$l = \\frac{\\Delta l \\sqrt{S_1}}{\\sqrt{S_0} - \\sqrt{S_1}}$\n```\n\n\
    在计算中接近图形时，使用最大位移值。\n\n```\n$l = \\frac{\\Delta l \\cdot X_{max 1}}{X_{max 0} -\
    \ X_{max 1}}$\n```\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_76_0.png)\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_76_1.png)\n\
    \na) 删除物体  \nb) 物体靠近  \n\n图 4.7：循环 FAI 形状变化示例\n\n使用所给方法确定物体距离受限于组织确定图像区域的过程以及副本快速平行移位的可能性。在使用图像副本的循环移位时，移位速度非常重要。它越大，我们就能越准确地确定物体位置。\n\
    \n## 4.6 使用图像副本不同类型移位的运动参数确定方法比较\n\n为了比较使用图像副本不同类型移位确定运动参数的方法，创建了软件模型。跟踪了移动物体的三种轨迹类型。第一种类型——确定边界框对角线交点的位置；第二种类型——确定图形的质心位置；第三种类型——使用分析循环\
    \ FAI 计算轨迹。\n\n测试使用了带有白色背景、AVI 格式、分辨率 640×480 的移动黑色物体视频文件。视频文件中各帧序列如图 4.8 所示。\n\
    \n三种类型物体运动轨迹图像的结果如图 4.9 所示。\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_77_0.png)\n\
    \n![](img/d6ed6c69a61b1252a9084096bb4904c6_78_0.png)\n\n在确定位置时，由于测试物体形状的变化，边界框对角线交点存在失真。如果对每次移位执行图像预处理，轨迹会更平滑。该方法的结果仅用于控制展示，与\
    \ PST 无关。\n\n通过分析循环 FAI 模拟运动路径的确定最为困难。为了确定周期（Tx1 和 Ty1），我们需要在交叉区域面积连续函数的特定区域寻找峰值。此外，由于感受野宽度和高度的不同，确定交叉区域面积函数的同步过程也很困难。选择\
    \ 640×480 分辨率是为了能够通过标准手段创建测试视频文件。\n\n软件实现中跟踪图形质心的方法效果最好。该方法适用于机器视觉系统的实现。\n\n尽管总体存在不足，但不同方法获得的数据之间存在明显的相关性。基于平行移位技术的确定物体运动参数的方法的主要优势是能够在不进行数字图像处理的情况下处理视频数据。\n\
    \n## 基于 PST 的图像处理系统\n\n基于所提方法（这些方法利用平行移位技术实现各种图像处理任务），可以构建计算机视觉系统。采用该技术构建的设备可以作为独立系统，也可以作为与数字图像处理设备结合的混合系统数据处理的一部分使用。\n\
    \n通常，智能系统按照“感受器—分析单元—执行器”的方案运行。在以“感受器”和“执行器”形式进行的信息处理过程中，使用简单的传感器和操纵器，它们不执行任何分析操作。在此情况下，分析单元是处理器。为了提高\
    \ IS 的性能，开发了专门的感知设备，对物体的影响本身开始执行某些分析功能。智能系统元素在执行感知、分析和合作任务时使用简单和专用外部设备的交互电路如图\
    \ 5.1 所示。\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_79_0.png)\n\n图 5.1：智能系统元素交互方案\n\
    \n## 5.1 视频信息感知系统\n\n平行移位技术允许转换信息以改善其正在处理的单元的性能。使用平行移位技术的结果是广义化信息，这将简化数据处理。本书描述了使用该技术构建专用视频处理设备的可能性。在上述信息处理方法中，考虑了对二值图像的操作。此外，目前非数字设备的创建可能性尚未得到充分研究。只进行了模拟计算设备的研究。基于这些事实，视频感知系统应包括数字化和二值化步骤。还需要具有噪声控制工具。基于平行移位技术的图像处理设备的主要模块是交叉区域面积函数形成模块和这些函数的分析模块。一种图像处理设备选项的结构电路如图\
    \ 5.2 所示。\n\n考虑了处理噪声和形成交叉区域面积函数的方法。在此阶段，特别关注图像束的过程。存在几种在特定区域进行图像分离的方法。形态分离包括选择连接区域。然而，通过硬件方法组织这样的分区是困难的。因此，在此阶段，可以根据其元素的亮度确定将对象划分为各部分的定量特征。按形态特征分割图像可以在分析阶段进行。\n\
    \n对于每个生物物种，环境参数都有一定范围，在此范围内可能发生某种感觉器官的感知。例如，人感知声波频率范围为 4 Hz 至 16,000 Hz，并视觉感知\
    \ 384 至 790 THz 的频率波段。感觉器官对变化定量特征的敏感性也是有限的。频率值接近的波被感知为相等。为了在图像部分上实现分离过程的硬件实现，需要对这些区域进行精确量化。图像元素的接近亮度值归为一组。该过程模拟了生物智能系统对环境的感知。\n\
    \n图像可以以不同的方式划分为范围。图 5.3 显示了三种可能的输入对象分割变体，具体取决于亮度特定阈值的比率。为了进一步处理，可以同时使用所有分组选项。\n\
    \n假设输入图像按亮度级数分为 (m) 个部分。然后每个部分将是一个独立的图像。对于每个这样的层，有必要定义一组\n\n"
