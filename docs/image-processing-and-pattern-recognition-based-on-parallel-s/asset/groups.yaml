    # 4.5 Methods for Determining Distance of a Moving Object


    In the previous sections the methods that allow definition of the parameters motion
    of the object in a plane that is perpendicular to the direction of view are described.
    These methods do not allow determination of the distance to the studied image.
    The following is a method for determining the distance to an object by analysing
    the function of the area of intersection.


    For spatial localisation of the object, it is necessary to determine the distance
    to it. Definitions of distances to an object can be done in many ways, for example,
    using an ultrasonic echolocation, laser and the binocular vision system building.
    In order not to apply the other character technology, PST is being used for determining
    this parameter. Determination of the distance to the 2D object can be performed
    by using the similarity properties of Fig. 4.6.


    According to these properties


    ```

    \frac{l + \Delta l}{l} = \frac{Y_{max 0}}{Y_{max 1}} = \sqrt{\frac{S_0}{S_1}},
    \quad (4.20)

    ```


    wherefrom


    ```

    l = \frac{\Delta l \sqrt{S_1}}{\sqrt{S_0} - \sqrt{S_1}}. \quad (4.21)

    ```


    where \(l\) – the initial object; \(Y_{max0}\) and \(S_0\) – FAI(y) parameters
    at time \(t_0\); \(l_1\) – distance to the object; \(Y_{max1}\) and \(S_1\) –
    FAI(y) parameters at time \(t_1\).


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_75_0.png)


