    第二个方法是图8.3中描述的方法。这种方法（图8.3）允许将X轴分为两个段。但是，两个段无法提供较高的FAI分析精度。因此，在X轴分割的每个实施例中都使用所有获得的值。该方法分析整个交叉区域函数。有必要确定单位间隔长度变化的距离（
    \(x_i^l - x_{i-1}^l = \Delta x\) ）。


    也可以分为两段、四段、五段等。还存在其他有效的分析变体。据我们认为，有效的分析可以是搜索中线最大偏差的方法，或者在FAI图中搜索极值的方法。


