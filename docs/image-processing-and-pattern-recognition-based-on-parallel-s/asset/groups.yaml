    # Methodology of Experimental Studies in Recognition Process Based on Parallel
    Shift Technology


    # 8.1 Selection and Analysis of Characteristic Features of Images Based on Parallel
    Shift Technology


    The first chapter dealt with the formation and extraction of characteristic features
    in known methods of image processing and recognition. All these methods can be
    divided into two classes—the first is the methods determined by the fact that
    they form the characteristic features by measuring the selected geometric elements
    of the image. Such elements can be area, perimeter, vertices, angles at the vertices
    of a polygon, geometric centre, distances between various local image objects,
    etc.


    In fact, the first-class systems measure the quantitative values of the selected
    geometric elements. From the measured values, a vector of characteristic features
    is formed. Each characteristic feature is a measured value of the system. Systems
    of the first class rigidly realise the given functions, for example, almost all
    known systems for face recognition perform the formation of a vector with characteristic
    features, which consist of quantities like distance between selected control points.
    The same approach is used in biometric identification systems where fingerprints
    are used.


    The system of first class consist of software and hardware that measure pre-selected
    values. However, the vector with characteristic features, consisting only of measured
    values, does not give a complete description of the images, especially images
    that are changed in scale or with changed orientation.


    The second class of methods is based on the transformation of the original image
    and the extraction of implicit characteristic features, the'
  - '[PAGE 141]


    quantitative values of which identify only the image. This approach has been given
    the right to life due to the fact that it gives strict quantitative values that
    increase the accuracy of image recognition. Such characteristic features include:
    wavelet transformation coefficients (Daubechies, 1990), potential functions (Aizerman
    et al., 1970), area intersection functions (Belan and Yuzhakov, 2013; Belan and
    Yuzhakov, 2013a; Belan et al., 2014a), pulse sequence characteristics (Belan,
    2011; Belan and Belan, 2013), features of wireless sensor networks (Lu et al.,
    2008; Simek et al., 2011; Heinzleman et al., 2002) and other quantities.


    All these values are obtained by using additional transformations that represent
    the image by an array of quantities. In fact, the geometric characteristics can
    be represented by a set of quantities that depend on the structure of the converter.
    This approach can be represented by the following model:


    I \xrightarrow{T} F


    where I is an array of image points that have a certain brightness, colour and
    geometric shape; T is the function of transformation of input I array; and F is
    a vector of characteristic features that is obtained due to superimposition transformation
    of T into I array.


    Consider a simple example of image transformation and description. To do this,
    we choose the Radon transformation, which differs from the methods considered
    in this book (Belan and Motornyuk, 2013; Bilan et al., 2014). Using the Radon
    transformation, the image is represented by projections that are received in selected
    directions. The more projections is the more accurate the image description.


    Each projection consists of numbers. Each number is determined by the number of
    ones on the corresponding line. Each logic ''1'' encodes the state of a single
    image point. For example, if the number in the projection is 5, then on the straight
    perpendicularical projection there are five single cells. A set of projection
    codes describes an input image. Examples of the graphic representation of Radon
    projections for simple and complex images are shown in Fig. 8.1.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_141_0.png)


    Fig. 8.1: Examples of graphic representation of Radon projections for a brightness
    level of 37 per cent'
  - '[PAGE 142]


    For the example presented, the real images were binarised by a brightness level
    of 50 per cent. After binarisation, Radon projections were obtained.


    The Radon transformation is one of a variety of methods for extracting and forming
    a vector of characteristic features. This method is easily accessible for understanding
    and is widely used in various applications (Belan and Motornyuk, 2013; Bilan et
    al., 2014).


    Transformation and description of the image based on parallel shift technology
    can be carried out by two methods:


    +   1. Description of the image using the function of the area of intersection.


    +   2. Description of the image by means of quantitative characteristics of the
    basic properties of the received FAI.


    The first method is based on the construction of an array of numbers that represent
    the function of the area of intersection. These numbers are obtained by measuring
    and calculating the function of the area of intersection at each time-step. This
    is a method of direct measurement of the area, which is a geometric characteristic.
    Recognition in the first method of description consists of a sequential search
    and simultaneous comparison of all the FAI numbers with the numbers of the template
    functions of the area of intersection that are stored in the template storage
    unit. If there is a case of coincidence in all the FAI numbers, it is decided
    that the image at the input is the image whose FAI template coincides with the
    input function of the area of intersection.


    The codes of the function of the area of intersection, which are stored as template
    FAI, have a specific identifier. Also, all recognised and identified images have
    an identifier belonging to the class.


    However, for real images, not all the numbers of the generated FAI at the input
    can coincide with all the numbers of the template FAI. Herewith, the image can
    be recognised correctly. For this purpose, the amount of permissible deviations
    in the quantities is established and the percentage of matched numbers form the
    FAI code. In addition, the locations of the matched and non-matched numbers in
    the FAI code are determined. Such values are determined experimentally. The results
    of the experimental research will be presented in the following sections.


    The second method is based on analysis of the form of the received FAI. As described
    earlier, the function of the area of intersection is a curve in a two-dimensional
    coordinate system. The FAI curve at the initial coordinate is equal to the maximum
    value of the FAI_max, and at the last coordinate FAI=0. The last coordinate corresponds
    to the value for which FAI=0. The last coordinates have different values for different
    images and for different directions of the shift. The curved line of the function
    of the area of intersection connects the initial and final coordinates.'
