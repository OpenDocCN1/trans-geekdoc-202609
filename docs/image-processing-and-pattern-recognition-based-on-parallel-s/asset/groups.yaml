    该过程依据输入图像中噪声元素的现有百分比（pN）进行。使用了以下参数来确定效率系数：


    - kC – 用于识别的圆形图像数量。

    - kCn – 系统未识别的圆形图像数量。

    - eC – 圆形识别效率系数。


    圆形识别效率系数的值由以下公式确定：


    \( eC = \frac{kC - kCn}{kC} \). (6.16)


    我们用类似的参数表示正方形（kS, kSn, eS）、矩形（kR, kRn, eR）和三角形（kT, kTn, eT）。


    在图形识别过程中，使用了以下误差值：dk = 0.04，dS = 0.1，dN = 0.01。这些值对应于解析计算的范围。


    图形识别过程旨在找出从 0% 到 20% 的噪声包含百分比，对应于所选方法有效噪声去除的范围。对于每个 pN，每个类别的简单图形提交了总共 500 张测试图像（kC
    = kS = kR = kT = 500）。使用获得的系数值，计算了 pN 参数等于 0%、5%、10%、15% 和 20% 时简单图形识别效率系数的平均值（eAs）。效率系数按以下公式计算：


    \( eAs = \frac{eC + eS + eR + eT}{4} \). (6.17)


    简单图形识别效率系数的平均值随噪声百分比的变化关系如图 6.4 所示。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_109_0.png)


    图 6.4：简单图形识别效率系数的平均值随噪声百分比图形变化


    这些研究结果表明，应用平移技术识别简单图形的效率与所选噪声控制方法的效率之间存在相关性。此外，应指出受输入图像面积影响的数据值是任意的。小对象生成对识别效果有负面影响。输入图像面积与识别性能之间的关系将在今后研究中考虑。


    对于标准图像识别过程，无法解析确定误差值。在图形识别过程中，使用了以下误差值：dk = 0.04，dS = 0.1，dN = 0.01。这些可容许误差参数与用于简单图形研究的相似。


    为确定模式阵列中模式图形识别效率，采用了一套用 Arial 72 pt 字体打印的拉丁字母和西里尔字母数字。应指出，该系统并非专门用于识别印刷体字体。选择此类标准是为了便于创建模板图像，并由于其形状多样（Krzyzak
    et al., 1990）。


    为了研究基于识别系统中噪声干扰百分比的模板图像识别有效性，提交了 700 张数字和 Arial 72 pt 字体大写拉丁字母图像。对于每个干扰噪声百分比（pN），从
    0% 到 20% 以 5% 为步长提交了测试图像。因此，每个噪声百分比下每张图像均处理了 20 次。唯一的例外是字母“I”，因为在 Arial 字体中它是一个矩形，被系统识别为对应简单图形。这一事实使得无法使用该图像来评估标准图形识别的有效性。模式图形识别效率比（eE）随噪声百分比的图形显示如图
    6.5 所示。


    \( eE = \frac{nE}{700} \) (6.18)


    其中 nE 为每个噪声百分比下正确识别的模式数量。


    简单图形识别与模板识别有效性之间存在明显相关性。除了噪声包含对图像识别效率的影响外，TPS 的使用还受其他因素影响。


    第一类误差的存在表明图像的快速识别步骤已成功通过。测试对象被归入标准形状类别的非唯一性和定义是由于以下原因：


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_111_0.png)


    - 使用快速傅里叶变换时，模式值交叉区域面积函数恢复的精度与识别 dS 值不匹配。

    - 系统无法区分镜像图形（例如，字母 R 和 Я，P 和 b）。

    - 某些 Arial 符号在正交方向上的图像提供相同的 FAI（例如，字母 H 和 П）。

    - 对于选定的可容许误差值（dk 和 dS），某些图像给出相似结果；即，系统基于对旋转角度的不变性可以将某些图像识别为同一图像（例如，图 6 和 9）。


    消除模糊识别的原因如下。可以通过以更多数量的快速傅里叶变换谐波形式存储模式，或直接将模式保存为一组函数来提高 FAI 恢复的精度。这两种方式都预计会增加模式数据库，并特别关注细节阶段比较的缩放函数过程。为了识别镜像图像，或者为了解决第一类误差第三个出现原因的问题，有必要以与第一次不同的方向（不是
    90°，而是其他角度）对图像进行第二次扫描。FAI 生成也可以针对三个（或更多）平移方向执行，使用三个（或更多）元素的元组来识别图像。借助这些方法，可以中和模板表面中心对称性的影响。这种对象表示需要对非正交平移过程的过程组织进行高精度计算。


    应指出，字母的形状比简单图形更不规则。因此，使用平移技术的这种模式识别方法的效率取决于可识别对象的凸度程度。这一事实是由于在缩放和变换函数阶段丢失信息，导致交叉区域比较详细过程的结果发生变化的结果。


    基于平移技术使用的图像识别的主要参数之一是输入图形面积（S₀）。有必要研究图像识别效率随该参数的变化。


    数字化输入图像是由 1×1 大小的正方形创建的元素矩阵。因此，对于较小的输入图像面积值，在感知步骤中会发生显著变化，导致信息失真。例如，直径为 2 像素的圆被表示为
    2×2 的正方形。此外，在存在噪声元素或删除噪声期间，初始面积可能会发生显著变化。这将影响识别过程。因此，确定允许进一步识别的输入图像边框的最小尺寸非常重要。


    为了确定图像识别效率随输入图形面积值的变化，进行了统计数据收集。选择了多组 2000 个简单图形，其可容许误差参数（dk = 0.04，dS = 0.1，dN
    = 0.01）以及噪声包含百分比（pN）为 0% 和 10%。该过程获得的数据反映在图 6.6 中。


