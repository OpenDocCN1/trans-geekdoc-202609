    正方形（其中 $X_{\max} = Y_{\max}$）的面积交叉函数：


    $$

    FAI(x) = (X_{\max} - x) \cdot \frac{X_{\max} \cdot S_0 - x \cdot \sqrt{S_0 \cdot
    (X_{\max}^2 - S_0)}}{X_{\max}^2} \quad (2.23)

    $$


    $$

    FAI(y) = (X_{\max} - y) \cdot \frac{X_{\max} \cdot S_0 - y \cdot \sqrt{S_0 \cdot
    (X_{\max}^2 - S_0)}}{X_{\max}^2} \quad (2.24)

    $$


    我们利用平行移位下的三角形相似性原理来确定三角形的面积交叉函数：


    $$

    FAI(x) = \frac{S_0 \cdot (X_{\max} - x)^2}{X_{\max}^2} \quad (2.25)

    $$


    $$

    FAI(y) = \frac{S_0 \cdot (Y_{\max} - y)^2}{Y_{\max}^2} \quad (2.26)

    $$


    当将输入图像识别为三角形时，无法立即使用一对正交偏移的面积交叉函数基本参数来确定图形的定量特征。这是因为存在四个未知数（三角形的三条边及其一条边与水平方向的倾角）。三角形的参数可以通过其旋转来确定。需要达到一种情况，即三角形某一边与水平方向的倾角为零。在此情况下，三角形的一条长边将等于最大水平位移。


    位移将尽可能最大。然后，使用两组面积交叉函数的基本参数，我们可以确定三角形的定量特征。


    图 2.8 显示了定义三角形参数集之一的过程的图形表示。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_37_0.png)


    图 2.8: 确定三角形参数过程的图形表示


    三角形基本参数与其定量参数之间的关系，请参见以下公式集。


    $$

    S_0 = \frac{a \cdot X_{max} \cdot \cos \psi}{2} = \frac{b \cdot Y_{max} \cdot
    \cos \varphi}{2} = \frac{ab \sin \gamma}{2} \quad (2.27)

    $$


    $$

    \frac{4S_0^2}{X_{max} Y_{max}} = X_{max} Y_{max} + 2S_0 = ab \cos \varphi \cos
    \psi \quad (2.28)

    $$


    \(\frac{a}{b} = \frac{Y_{\max} \cos \varphi}{X_{\max} \cos \psi} ; \frac{X_{\max}}{\sin
    \gamma} = \frac{b}{\cos \varphi} ; \frac{Y_{\max}}{a} = \frac{a}{\cos \varphi}\)
    (2.29)


    \(b \cdot \sin \varphi = l_x ctg \psi\) (2.30)


    \(Y_{\max} + l_y = a \cdot cos \psi\) (2.31)


    \(X_{\max} + l_x = b \cdot cos \varphi\) (2.32)


    \(a \cdot sin \psi = l_y ctg \varphi\) (2.33)


    \(Y_{max}l_x = X_{max}l_y\) (2.34)


    \(\frac{l_x}{X_{\max}} = \frac{l_y}{Y_{\max}} = \frac{X_{\max}}{b \cos \varphi}
    = \frac{Y_{\max}}{a \cos \psi} = \frac{2S_0 - X_{\max} Y_{\max}}{X_{\max} Y_{\max}}\)

    \(= \frac{b \cos \varphi - X_{\max}}{X_{\max}} = \frac{a \cos \psi - Y_{\max}}{Y_{\max}}\)
    (2.35)


    \(\frac{X_{\max} Y_{\max}}{2S_0} = 1 - tg \varphi tg \psi\) (2.36)


    为了确定三角形的定量参数，需要对其进行旋转。例如，将边 \(a\) 置于垂直位置。此时 \(a = Y_{max}\)，\(\psi = 0\)，上述所有公式均大大简化。旋转过程中三角形边长不变。将备用两组公式。这样就可以确定三角形各边长度及其相对于水平方向的原始倾角
    \(\varphi\)。


    矩形的面积交叉函数取决于相对于偏移方向 \(\varphi$ 的倾角 \(\alpha$。根据矩形尺寸（\(a$ 和 \(b$）的比例，倾角 \(\alpha$
    有三种可能性：


    \(\sin \alpha \cdot cos \alpha = \frac{S_0}{X_{\max} \cdot Y_{\max}}\) (2.37)


    \(tg \alpha = \frac{X_{max}}{Y_{max}}\) (2.38)


    \(\sin^2 \alpha = \frac{S_0}{X_{max} \cdot Y_{\max}}\) or \(cos^2 \alpha = \frac{S_0}{X_{max}
    \cdot Y_{\max}}\) (2.39)


    在进一步计算 \(\sin 2\alpha$ 时，选项 \(\sin^2 \alpha$ 和 \(cos^2 \alpha$ 是相同的。


    '
