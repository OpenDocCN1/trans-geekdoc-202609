  mdcn: "\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_139_0.png)\n\n图 7.30: 基于光发射器标尺的内存\
    \ FAI 矩阵\n\n## 基于平行位移技术的识别过程实验研究方法论\n\n### 8.1 基于平行位移技术的图像特征选取与分析\n\n第一章讨论了已知图像处理和识别方法中特征的形成和提取。所有这些方法可以分为两类——第一类是通过测量图像的选定几何元素来形成特征的方法。此类元素可以是面积、周长、顶点、多边形顶点处的角、几何中心、各种局部图像对象之间的距离等。\n\
    \n事实上，第一类系统测量所选定几何元素的定量值。从测量值中，形成一个特征向量。每个特征都是系统的一个测量值。第一类系统严格实现给定的功能，例如，几乎所有已知的人脸识别系统都会执行由特征组成的向量的形成，这些特征由所选控制点之间的距离等量组成。相同的方法也用于使用指纹的生物识别系统。\n\
    \n第一类系统由测量预选值的软件和硬件组成。然而，仅由测量值组成的特征向量无法对图像给出完整的描述，特别是缩放或方向发生变化的图像。\n\n第二类方法基于原始图像的变换和隐式特征的提取，其定量值仅用于标识图像。由于这种方法能给出提高图像识别精度的严格定量值，因此这种方法具有合理性。此类特征包括：小波变换系数（Daubechies,\
    \ 1990）、势函数（Aizerman et al., 1970）、面积交集函数（Belan and Yuzhakov, 2013; Belan and\
    \ Yuzhakov, 2013a; Belan et al., 2014a）、脉冲序列特征（Belan, 2011; Belan and Belan, 2013）、无线传感器网络特征（Lu\
    \ et al., 2008; Simek et al., 2011; Heinzleman et al., 2002）及其他量。\n\n所有这些值都是通过附加变换获得的，这些变换用一组量来表示图像。事实上，几何特征可以由一组依赖于转换器结构的量来表示。该方法可由以下模型表示：\n\
    \nI \\xrightarrow{T} F\n\n其中 I 是具有特定亮度、颜色和几何形状的图像点数组；T 是输入 I 数组的变换函数；F 是由将 T 叠加变换到\
    \ I 数组上而获得的特征向量。\n\n考虑图像变换和描述的简单示例。为此，我们选择 Radon 变换，它不同于本书中考虑的方法（Belan and Motornyuk,\
    \ 2013; Bilan et al., 2014）。使用 Radon 变换，图像由在选定方向上接收的投影表示。投影越多，图像描述越准确。\n\n每个投影由数字组成。每个数字由相应线上\
    \ 1 的数量确定。每个逻辑 '1' 编码单个图像点的状态。例如，如果投影中的数字为 5，则在垂直于投影的直线上有五个单元。一组投影代码描述输入图像。简单和复杂图像的\
    \ Radon 投影图形表示示例见图 8.1。\n\n![](img/d6ed6c69a61b1252a9084096bb4904c6_141_0.png)\n\
    \n图 8.1: 亮度级别为 37% 的 Radon 投影图形表示示例\n\n对于所举示例，实际图像按 50% 的亮度级别进行二值化。二值化后，得到了 Radon\
    \ 投影。\n\nRadon 变换是提取和形成特征向量的多种方法之一。该方法易于理解，并广泛应用于各种应用（Belan and Motornyuk, 2013;\
    \ Bilan et al., 2014）。\n\n基于平行位移技术的图像变换和描述可以通过两种方法进行：\n\n- 1. 使用面积交集函数对图像进行描述。\n\
    - 2. 通过接收到的 FAI 的基本属性的定量特征对图像进行描述。\n\n第一种方法基于构建表示面积交集函数的数字数组。这些数字通过在每个时间步测量和计算面积交集函数来获得。这是一种面积的直接测量方法，面积是一种几何特征。第一种描述方法中的识别包括顺序搜索并同时将所有\
    \ FAI 数值与存储在模板存储单元中的面积交集模板函数的数值进行比较。如果所有 FAI 数值都存在一致情况，则判定输入图像是其 FAI 模板与输入面积交集函数相吻合的图像。\n\
    \n作为模板 FAI 存储的面积交集函数代码具有特定的标识符。此外，所有被识别和确认的图像都具有属于该类的标识符。\n\n然而，对于实际图像，输入中生成的\
    \ FAI 不一定所有数值都与模板 FAI 的所有数值一致。尽管如此，图像仍可以被正确识别。为此，建立了量的可允许偏差量以及构成 FAI 代码的匹配数值的百分比。此外，确定\
    \ FAI 代码中匹配和不匹配数值的位置。这些值是通过实验确定的。实验研究结果将在以下部分中介绍。\n\n第二种方法基于对接收到的 FAI 的形状进行分析。如前面所述，面积交集函数是二维坐标系中的一条曲线。FAI\
    \ 曲线在初始坐标处等于 FAI_max 的最大值，在最后一个坐标处 FAI=0。最后一个坐标对应于 FAI=0 的值。对于不同的图像和不同的位移方向，最后坐标有不同的值。面积交集函数的曲线连接初始坐标和最终坐标。\n\
    \n因此，至少存在一个方向，使得图像的 FAI 曲线形状与另一图像不同。使用第二种方法分析 FAI 曲线的形状。为了分析形状，在 FAI 曲线的选定部分使用曲率值。曲率由以下公式定义：\n\
