    # Preface


    The development of computer image processing and recognition systems is one of
    the main aspects of artificial intelligence. Currently, there are no effective
    methods for video information manipulation other than digital image processing.
    A number of alternative methods and algorithms for processing images based on
    parallel-shear technology are proposed in this book. Using these along with digital
    image processing will enable the building of a hybrid image processing system.
    The methods and algorithms can also be used in analog computers.


    The book describes images not in the form of an array of points, but as a set
    of functions. Methods and algorithms for image processing have been developed
    by analyzing these functions, using these it is possible to solve the main tasks
    of image processing. Description of images as a set of functions allows one to
    manipulate both raster and non-bitmap images. Only one quantitative characteristic
    is analyzed - the area of the image. The use of parallel shift technology also
    makes it possible to process images consisting of irregularly arranged elements.
    Scientific work is built in accordance with this classification.


    The book is devoted to the development and research of methods of applying multiple
    transformations for computer processing and image recognition. Unlike the known
    methods, the proposed method uses a smaller number of the characteristic features
    to describe images and the number of computational operations in the system are
    reduced. Based on parallel shift technology, a mathematical model of the relationship
    between the form of the object and the functions of the intersection area, was
    developed. Methods of image recognition, determination of spatial orientation
    of objects, parameters of their movement and determination of the contour of a
    figure are described in the book. The study of the efficiency of pattern recognition
    with various parameters of the input image, are described.


    The book is intended to help researchers in the development of artificial intelligence,
    robotics, software and hardware applications.'
