    ```

    R = \sqrt[3]{\frac{3V_0}{4\pi}} = \frac{X_{max}}{2} \tag{2.59}

    ```


    To determine the function of the volume of intersection of the triangular pyramid
    we use similarity property figures. Then the function of the volume of intersection
    will be as follows.


    ```

