    - 1. “胡椒”类型噪声：二值图像视觉场中被填充为值“1”的单元。

    - 2. “盐”类型噪声：二值图像视觉场中被零填充。

    - 3. “盐”和“胡椒”类型噪声：这是前两种类型的组合。


    在噪声去除过程中，有必要将上述边缘检测方法应用平移技术。在此情况下，必须移除定义为轮廓图像的所有图像部分。所需轮廓宽度 h 越大，被视为噪声并从视觉场中移除的对象尺寸就越大。但在此情况下，关于图像的大量有用信息将丢失。属于对象宽边界的大量项目将消失。由第二种类型噪声形成的内部区域中噪声显著增加。为了最大限度地减少噪声去除过程对图像轮廓的影响，我们定义最小宽度
    h = 1。带有噪声的字符“龙”图像示例以及在 34 dB 噪声级别去除边缘点的结果如图 3.5 所示。


    有必要评估去除边缘点时的信息损失以及在此情况下识别对象的能力。图 3.6 给出了无噪声包含的字符“龙”的 FAI (x)，图 3.5 显示了诸如“胡椒”之类的噪声的存在。在存在诸如“盐”和“胡椒”之类的噪声时，PSNR
    = 34 dB。


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_55_0.png)


    图 3.5：利用轮廓识别过程进行噪声控制


