    increased permissible error values. So, at a detailed stage of functions, comparison
    to one class of different images can be assigned. As seen in Fig. 3.8, the maximum
    distortions of functions of the area of intersection occurs at the beginning or
    near to the value of maximum shift if there are deformation factors. This depends
    on the shift direction. In any case, the initial area is changed due to the presence
    of noise. If, in the direction shift of image copy, there are inclusions of noise,
    then significant FAI distortions may occur at the end of the function. This is
    analogous to the factors which lead to the use of the permissible error dN.


    It is necessary to limit the increase in the value of the parameter dS. To resolve
    this issue on a detailed comparison stage, not all values function of the area
    of intersection are used; only a range of values, where the expected deviation
    is minimal can be taken into account. Figure 3.10 shows that the length of this
    range has the value of 70 per cent of the maximum shift in the selected direction.


    Since the limitation of range values for functions comparison helps to neutralise
    the influence of image distortion, it can be considered as the fourth level of
    noise control.


    ### 3.3 Technical Methods for FAI Preparation


    The main objective of flat image preprocessing, when using parallel shift technology,
    is to convert the two-dimensional image into a set of functions of the area of
    intersection.


    As shown previously, the function of the area of intersection is inexactly related
    to the shape of the object. So their use is possible for the image recognition
    process. The process of obtaining the functions of image area of intersection
    and its copies is easy to implement in hardware.


    When digital image is processed, the process of obtaining the function of the
    area of intersection takes place as follows:


    - 1. For the input image array size of $k \times m$, consisting of elements $a_{ij},
    (a_{ij} \in [0;1])$ creates a copy (array of elements $b_{ij}$).

    - 2. $S_0 = \sum_{i=1}^k \sum_{j=1}^m a_{i,j}$

    - 3. It starts a parallel shift of image copies in the selected $\varphi$ direction.

    - 4. At every shift $t$ step intersection array which consists of elements $c_{ij}$
    ($c_{ij} = 1$ if $a_{ij} = 1$ and $b_{ij} = 1$ is created; otherwise it is $c_{ij}
    = 0$).

    - 5. $FAI(t) = \sum_{i=1}^k \sum_{j=1}^m c_{i,j}$

