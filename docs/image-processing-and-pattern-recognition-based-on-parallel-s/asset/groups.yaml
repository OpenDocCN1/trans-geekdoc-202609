    # ## 4.3 Methods for Determining Movement Parameters Using Cyclic Shifts


    The use of parallel shift technology allows determination of the motion parameters
    of the object. The main parameters of the movement will assume the direction and
    distance of the object displacement in the receptor field. Let''s describe methods
    for determining the motion parameters of the object by using cyclic shifts of
    the image copies in the formation of the function of the area of intersection.


    If the original image is still, the function of the area of intersection is periodic
    and symmetrical with respect to each of the points of complete coincidence of
    the input image, subject to real state, and its copy, which is being shifted (Fig.
    4.3).


    Here the parameters of the function of the area of intersection equals the following
    values: FAI period (T)—width of the receptive field in shear by horizontal and
    height in shear vertically; the width of each FAI splash (function portion that
    corresponds to a non-zero crossing)—2X_max or 2Y_max respectively with shift direction;
    and the maximum FAI amplitude—the area of the input image (S_0). Orthogonal directions
    of displacement are selected for ease of hardware implementation. The period (T)
    is calculated in units of distance measurement. This is useful for raster image
    processing. For non-raster image, it is convenient to express this option by velocity
    of the copies shear (V) and time (t), for which there is a defined process.


    For example, \( T = Vt_T \) or \( X_{max} = Vt_{X_{max}} \)


    where \( t_T \) is execution time for the shift of the image copy on the width
    of the receptor field; and \( t_{Xmax} \) is time of displacement on the value
    of the maximum shift.


    ![](img/d6ed6c69a61b1252a9084096bb4904c6_71_0.png)


    **Fig. 4.3:** Process image of the cyclic shift and a schematic representation
    of the cyclic FAI (x) graph'
  - '[PAGE 72]


    If the image, for which the motion parameters are determined, moves in the receptor
    field in the orthogonal direction, then the cyclic shift of copies in the same
    direction is the period (T) of function which will vary depending on the direction
    of motion of the figures. While moving in the direction of displacement of the
    copy, the period between the peaks function (call it T1) due to the Doppler effect
    will be greater than T, and in the reverse direction it would be less.


    Suppose the image does not move in the orthogonal direction and the copy of the
    shift takes place so fast that during the calculation of the intersection area,
    the figure has no time to be shifted in the direction of perpendicular to the
    shift. Then each splash of cyclic FAI will be symmetric, but its amplitude is
    less than the fixed input image. In this case, the period of the function (T1)
    is defined as the distance between the centres of two adjacent bursts with maximum
    amplitude.


    Let us assume that a copy of the figures moves to the right in determining FAI
    (x) and in determining the FAI (y), it moves up and the centre of mass of the
    figure is at the origin of the coordinates. Assume that there is no movement in
    the orthogonal direction, then the tangent of the angle of the direction of motion
    pictures ($\alpha$) will be equal to:


    tg$\alpha$ = $\frac{\Delta T_y}{\Delta T_x}$ = $\frac{T_{y1} - T_y}{T_{x1} - T_x}$,
    (4.12)


    where $T_{y1}$ is FAI (y) period for the moving image, $T_y$ – FAI (y) period
    for a still image, and $T_{x1}$ and $T_x$ are the corresponding FAI (x) periods.

    When the orthogonal movement of the object,


    $\Delta T_y = T_{y1} - T_y = 0,$ (4.13)


    if the object moves horizontally,


    $\Delta T_x = T_{x1} - T_x = 0,$ (4.14)


    If the object moves vertically, while moving in the vertical movement the direction
    $\alpha$ angle is equal to $\frac{\pi}{2}$

    The distance of the object displacement for one period of offset copy will be
    as following:


    $\Delta T = \sqrt{\Delta T_x^2 + \Delta T_y^2}.$ (4.15)


    It should be noted that determining time of the parameters $\Delta T_x$ and $\Delta
    T_y$ must be synchronised. For this purpose, in hardware implementation, the width
    and height parameters of the receptor field ($T_x$ and $T_y$) should be same.'
