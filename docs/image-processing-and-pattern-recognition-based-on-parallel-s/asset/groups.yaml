  - '[PAGE 90]


    All the images used examples of simulations were binary. They could be convex,
    irregularly shaped or comprise several objects.


    The Fourier series harmonic number depends on the amount and form of patterns.
    In the process of software modelling it was revealed that to create a pattern
    FAI of convex figures, it is better to use the first five Fourier harmonics. To
    create a pattern FAI of no convex figures it is enough use the first ten harmonics
    of the Fourier. To create a of pattern FAI of figures consisting of several objects
    it is enough to use the first twenty Fourier harmonics. In all these cases the
    deviation reconstructed FAI and the real FAI do not exceed 10 per cent of the
    value of the real function at each displacement step. Also, when choosing an etalon
    that corresponds to a specific FAI, the average deviation of the real value and
    the pattern value for a specific section of the FAI function may be used. Examples
    of graph template of functions by using different numbers of the Fourier series
    harmonics for the restoration of FAI are shown in Fig. 5.9.


    | Direction FAI | Number of the Fourier series harmonics used in the recovery
