    projected image. For this, a two-layer matrix medium is used. Each layer is represented
    by a matrix. The first and second matrices store the initial image. In the first
    matrix, the image is fixed and the second matrix shifts the image in the selected
    direction. The intersection area is determined by an additional layer. Each cell
    of this layer gives signals if it belongs to the intersection area.


