  # 第二章：比特币的历史


  一项革命性技术所可能采取的道路是任何人都无法预测的。以史上第一笔比特币交易为例。2010 年 5 月 22 日，名为 `Hanyecz` 用比特币购买了 2 块比萨，总共花费了
  10,000 比特币。如今，这笔交易被标记为史上最昂贵的食物订单，总价值约为 100,000,000 美元，每块比萨 50,000,000 美元。`Hanyecz`
  进行购买的日期 5 月 22 日被称为“比特币比萨日”，并受到全球加密货币爱好者的庆祝。从一个使用虚假身份的程序员和两块著名的比萨，到黑市和一个幻想游戏网站：这个世界上第一种加密货币经历了一段漫长而曲折的道路。


  就像分是美元的最小单位一样，`satoshi`（聪）是比特币的最小单位。简单来说，它是进行交易的最小面值。这个单位被称为 `satoshi`，是为了向比特币的创始人中本聪（Satoshi
  Nakamoto）致敬。过去几年里最大的金融故事之一就是比特币的惊人崛起。这种虚拟货币的设计初衷是彻底改变点对交易；它不需要中间人（如银行或信用卡网络），不需要个人信息交换，也不需要交易费用。


  ## 比特币区块链入门


  比特币的支柱是区块链技术，它利用该技术来记录其网络上的交易。区块链本质上是一个公共分布的账本；它记录了在区块上发生过的每一笔比特币交易。当该区块的内存填满时，它就会按顺序添加到区块链中。这个账本在网络中的每台计算机上都可以免费访问，负责验证交易、存储区块链并将交易中继到其他计算机。这些计算机被称为
  `nodes`。由于数据库存储在节点网络而非单台服务器上，黑客或盗取比特币几乎是不可能的。比特币的创造总量非常有限，这意味着这种货币不会因为中央银行发行更多货币而导致贬值。得益于加密货币的优势，唯一比硬币数量增长快的是比特币的价格。截至
  2020 年 5 月，一个比特币的价格仍处于 8900 美元到 9200 美元之间。与 2020 年 1 月 4000 美元的低点相比，它已经走了很远。如果你在低点买入，你将在不到一年内获得超过
  100% 的投资回报（ROI）。足以说明，时机就是一切，因为比特币是一种极波动性的资产。


  ## 中本聪与比特币的神秘起源


  2008 年底，金融危机正如火如荼。同年 9 月，当时世界第四大投资银行雷曼兄弟银行申请了第 11 章破产。当世界金融基础设施正在崩溃时，`bitcoin.org`
  域名被注册。2008 年晚些时候，一个使用 `Satoshi Nakamoto`（中本聪）笔名的人或群体向加密邮件列表发布了一份关于比特币的白皮书，解释了这种加密货币如何运作。2009
  年初，`Nakamoto` 挖出了首个比特币，被称为“创世区块”。在这一第一个比特币的程序中嵌入了文字：“The Times 03/Jan/2009 Chancellor
  on the brink of second bailout for banks.” 这段文字指的是英国《泰晤报》在该日期的一条新闻，通常被认为是对当时情况的预言。


  中本聪的身份是一个谜。尽管许多人对于“比特币”究竟是什么以及这种新兴加密货币如何运作仍然感到困惑，但对于比特币源自何处以及如何变成今天这样的，人们也存在着同样的困惑——这是一项动摇了金融世界核心的技术创新。





  # 第 3 章：比特币钱包与银行账户的区别


  ## 比特币钱包与银行账户有何不同？


  ![](img/image_rsrcUS.jpg) 银行账户是客户与银行之间的财务合同，通过该合同，存储并控制客户的余额以及所有财务变动（法币）。加密货币（比特币）钱包是一种软件或硬件解决方案，可以通过公钥和私钥（两者始终成对出现）进行访问。通过这些密钥，你可以通过区块链发送和接收货币。钱包通常被比作银行账户进行比较。现在，我将讨论银行账户与比特币钱包之间的五个重要区别：


  ### 1.) 货币的存储方式

  这也许是使我们区分钱包和银行账户的主要区别。钱包的设计初是为了存储加密货币并对其进行操作，也就是说，在钱包中，我们可以操作比特币、以太坊、Dash 以及数字钱包允许的许多种货币。相比之下，银行账户只允许存储和操作法币，即：欧元、美元、比索等。


  ### 2.) 公钥与私钥

  在钱包中，公钥和私钥都是非常大的数字，通常它们的表示形式是独立的 WIF 钱包导入格式，由数字和字母组成。另一方面，银行账户是有限的数字，通常为 20 位数字，分为若干组，分别识别银行、分行、账户类型，最后是客户的个人标识符。


  ### 3.) 对存储资金的控制权

  在数字钱包中，你对存储的货币拥有绝对控制权，可以使用私钥在无需第三方授权的情况下进行移动（如果丢失了私钥，资金也会丢失）。另一方面，银行账户在通过网上银行、贷/借记卡等进行资金移动时，需要银行的授权。


  ### 4.) 资金的访问与安全性

  大多数数字钱包通过网站或应用程序运行（尽管连接互联网是必不可少的）。在安全性方面，存储在钱包中的私钥是访问它的唯一手段，提供了针对第三方的高安全性。相比之下，银行账户的资金通过网银（通过互联网访问且因各银行而异）以及信用卡/借记卡进行访问，尽管这些方法为用户提供了更大的灵活性。这种方式的缺点是安全性水平较低，因为网银取决于每家银行采取的安全措施。另一方面，信用卡或借记卡的安全性水平将取决于处理支付的平台的安全性水平。由于这种原因，它们的安全协议不会那么高，因为它们不遵循全球标准（每家银行或支付系统都有自己的标准）。






  # 第 4 章：通过比特币保护你的货币价值


  ## 比特币如何帮助保护你的货币价值？


  在比特币的大部分生命周期中，它主要被用于一个目的：投资。人们将资金投入这种数字资产，希望获得指数级的回——这有着显而易见的原因。比特币经历过剧烈的价格波动，也有许多关于人在比特币价格飙升时赚取巨额财富的故事。然而，比特币随着时间的推移发生了巨大的变化。点对点金融正迈向一条新的道路，这为比特币用户带来了大量新可能性。这些包括支付、发送汇款和财富保值。事实上，有几家企业在主张比特币。现在我将介绍有关比特币在锁定价值方面的一些主要特征：


  ### 1. 比特币作为财富保值手段

  使用比特币作为财富保值手段有两种方式：保护你的资产以及防止你货币的通货膨胀。


  ### 2. 可行的货币储备（保护你的资产 PYA）

  对于那些将比特币作为投资手段的人，请放心，比特币也是一种可行的财富保值（PYA）方法。在许多方面，比特币可以被视为保护资本的最安全方式，其有限的供应和区块链技术为所有用户提供了安全保障。使用比特币最大的益处之一是它没有国界，允许你从世界上任何地方发送和接收比特币。这意味着传统的金融边界和障碍（如银行和其他机构）将不再适用——让你对自己的钱拥有控制权（因为你拥有它）。拥有比特币作为货币储备是许多人开始保护其资产的方式，以防极端通货膨胀等财务灾难。


  ### 3. 保护你的货币价值（消除通胀风险）

  想象一下这种情况：你的国家正在经历经济危机，你的货币价值正在迅速下跌。你的出路在哪里？作为安慰，一位委内瑞拉的持有者发现比特币有拯救他和他家人的力量。卡洛斯·赫尔南德（Carlos
  Hernandez）是一位古巴人，他现在将所有的钱都持有比特币，只在需要时才提取小额金额。由于国家经济可能是波动的，当玻利尔（bolars）价值下降时他可能会损失大量资金，卡洛斯认为把钱全部放在玻利尔上是“财务自杀”。这解释了为什么他决定将所有资产转换为比特币财富。比特币和加密货币通常被视为“第一世界”的东西，但实际上是发展中国家（或像委内瑞拉这样经济困难的国家）表现出更高的采用率。发展中国家的人并不是将这些数字资产作为投资手段——正如许多发达国家的比特币持有者那样——而是将其作为生存手段。世界上仍有很大一部分没有银行账户（截至
  2017 年），这基本上意味着他们与分子拥有同样的财务权利。他们完全隔绝了他们所需的传统金融服务。这使得对于最需要的人来说支付变得更加困难。另一方面，比特币为这些人提供了他们真正需要的金融护照和访问性，让他们能够获得廉价的银行服务和全球自由贸易体系。作为其真实用例之一，比特币可以作为经济困难国家的财富保值手段。以委内瑞拉为例，他们的货币目前正经历着
  1000 万%的通胀（截至 2019 年 8 月）。人们正在寻找生存手段——而手中的比特币就是他们的解决方案。委内瑞拉汇率达到了 2000 万玻利尔，这是他们保护自己货币免受进一步通胀的一种。


  ### 4. 黄金 vs 比特币

  在保值方面，黄金和比特币都是极有用的资产。黄金是一种固体金属，具有耐用性、美观等长期的物理属性。另一方面，比特币是一种相对新的数字资产，具有尚未被发现的真实用例。它们各自都有自己的财富保值方式。在货币方面，黄金和比特币在某些方面是不同的。黄金是有形物理的，允许人们以任何他们的方式进行存储。然而，比特币是数字的，如果你丢失了对
  `private keys` 的访问权限，一切都可能几分钟内丢失——无论是被黑客获取还是直接遗失。另一方面，黄金也可以被物理盗窃、会腐蚀，黄金的整体质量可能会受损。这两种资产的供应都是有限的，但黄金已经与其他支付形式经历了数千年的竞争，并在价值存储方面确立了其作为明确获胜者的地位。由于黄金存在已久，人们更倾向于相信它的价值。另一方面，比特币尽管也有有限的供应，但被认为可能通过分叉产生更多供应。此外，比特币价格有时是波动的，而且防止洗钱/恐怖主义资产的问题可能会阻碍比特币获得官方支持。尽管如此，随着全球发生经济危机，比特币才开始提供其其实际用途，它向所有人证明，尽管它还没有像黄金那样受到尊重，但它可以成为一种可行的财富保值手段。


  ### 5. 为什么是比特币？

  如你所见，比特币的特征显然将没有账户的人从中央控制中解放出来。比特币作为一种去中心化的货币，为人们提供了一种无边界穿越金融世界的方式。此外，比特币具有无法被没收的独特特性。问问自己：你拥有的资产中哪种是无法被更高机构没收的？






  # 第 5 章人们在比特币上容易犯的陷阱和错误


  ## 人们在比特币上常见的错误有哪些？如何避免这些错误？


  ![](img/image_rsrcUU.jpg)


  我们已经到了一个优质交易机会每天都会出现的阶段。市场上有这么多币种，你不可能兼顾所有的一个。好吧，让我告诉你一个秘密，你并不需要这样做。你只需要保持耐心并控制好情绪。某些时候，你可能坐在电脑前，看着那些魂牵梦绕的绿色
  K 线和巨大的牛市，你会极地想要进行交易。如果你错过了那些交易，就让它们过去吧。你不能仅仅基于牛市会持续足够久并让你获得部分利润的假设就进入此类交易。你的急躁极可能让你付出沉痛代价。经常发生的是你在高位买入，随后面临价格的大幅下跌。在没有明确策略的情况下仓忙交易是一个极其糟糕的主意。但如果你愿意付诸精力，学习如何分析币种/图表，设置入场、出场和目标点，并正确调整仓位大小，你就能区分好交易和坏交易。你的目标必须始终是选择最好的交易机会。记住，一个优秀的交易者总是交易得少。


  加密货币市场正在蓬勃发展，并将一直持续下去。2009 年开启的趋势是无法改变的。越来越多的人正在学习加密货币并考虑投资它们。他们问我这样的问题……比特币还会涨吗？我应该在里面投点钱吗？哪种加密货币最好？我的回答通常是：到目前为止，加密货币市场的交易是非常有利的。看起来我们的小组做对了决定。我们非常擅长发现潜在利润并利用它们。当然，有时结果并不如预期，但我们了解风险，并且知道如何将风险降最低。现在的交易看起来很简单，因为我们拥有知识和经验。为了让你的生活轻松一些，特别是对于新手，我列了一些你在开始交易前必须考虑的话题：![](img/image_rsrcUV.jpg)


  ### 1. 不要让你的比特币离开视野


  比特币是加密货币不可或缺的一部分。你必须随时了解 `BTC` 的动态。它是处于整合状态、牛市还是熊市？可能影响价格突然波动或趋势反的最新新闻是什么？这很重要，因为你大部分时间都在交易山寨币/比特币对。你必须关注这两种货币。有一个通规则：当比特币价格上涨时，所有其他货币都会呈现红色。而当比特币价格下跌时，山寨币会恢复绿色。虽然存在例外，即你可以从比特币和山寨币同时上涨中获利，但不要让自己陷入相反的情境中导致被重创。当你不确定用哪种优质山寨币交易时，唯一的缺点是它们不像表格中所示的那样。我在整本书中最重要的建议就是那句名言：“如果你不持有私钥，它就不是比特币。”或者更短的版本：“没有密钥，就没有币。”如果你认为你的比特币在交易所中是安全的或由第三方持有，请重新考虑一下。考虑比特币的一种常见方式是看作“权利”。你从未真正拥有一个比特币，但你可以持有一个控制其移动的密钥。这种对比特币移动的控制，是你最接近拥有它的东西了。当然，我们有能力从银行转账，直到他们无故无地冻结我们的账户。从这个意义上说，比特币比你的银行账户要真实得多。如果你且仅你持有密钥，没有人能夺走它。这种数字自由感觉如何![](img/image_rsrcUW)


  ### 2. 让波动为你服务，而不是你受波动波动


  这个市场波动剧烈到会让你感到压力。它是导致剧烈波动、拉高出货（pump & dump）和 FOMO（恐惧错过）事件的原因。波动是双刃剑。如果你愚蠢，它可以让你盈利也可以让你离开。值得提到的是交易所也提供保证金交易。记住，情况变化得很快![](img/image_rsrcUX)


  ### 3. 用小仓位进行练习并精通


  如果你刚开始交易，你的仓位应该应该很小。为什么？因为当你想要执行订单时，你必须 100% 确定自己在做什么。你必须了解你交易的交易所。如果有需要，请记录下来。当你下单的时机到来时，你必须迅速迅速。没有出错的空间。设置极小的买入和止损单，根据需要进行练习。如果你必须精通一个交易所，并不意味着你了解所有的。当你在五个或更多交易所进行交易时，你会发现它们在许多方面都不同。在选择交易所之前，始终检查以下特征：费用、流动性、安全性、做空选项/保证金交易选项以及其他功能![](img/image_rsrcUY)


  ### 4. 只有在有明确策略时才进入交易


  盲目交易是不可行的。也许你会运气好几次，但从长远来看，你没有机会。为了取得成功，你必须结合基本面和技术分析。无论如何，你必须坚持你的策略。一旦你以计算好的仓位大小进入交易，你就会知道自己愿意承担多少风险以及在何处获利。


  ### 5. 适应、分析交易并从错误中学习


  不分析交易表现的交易者更容易犯重复错误。作为一名交易者，你必须不断进步，以便在这个快速发展的市场中生存并繁荣。这是交易中重要的一部分。即使你是一个老交易者，也有很大的改进空间。尝试适应、分析并从错误中学习。


  ### 6. 控制你的情绪


  情绪总是是不受欢迎的。很容易被贪婪、恐惧或兴奋所左右。不同的情况带来不同的情绪，这取决于你如何处理它们。当你进行了一个糟糕的交易时，结果带来的负面情绪会影响到下一次交易。可能会出现由于害怕亏损而不进入的情况。相反，当你获得连胜时，你可能会认为自己无所不能，并在错误的时间将交易推入市场。在进入交易之前，问自己采取这些行动的原因总是会有帮助的。练习你负担得起的韧性。






  # 第 6 章：区块链、比特币与其他加密货币之间的区别


  ### 1. 当他们说起区块链技术时，到底指的是什么？


  ### 2. 区块链与数字货币之间有什么区别？


  关于区块链与加密货币之间区别的困惑，部分是因为这些术语的使用并不正确，且忽略了其规范的用法。`blockchain`（区块链）这一术语并不是通过正式定义引入的，而是从“块链”演变而来的；`cryptocurrency`（加密货币）则是某种形式的“加密货币”。但这些概念之间的根本区别在于分布式账本技术的使用方式。继续下读，可以更清晰地了解区块链与加密货币之间的区别。


  ### 1. 作为技术的区块链 ![](img/image_rsrcUZ.jpg)


  当`Bitcoin`（比特币）是唯一的数字资产和唯一的区块链网络时，这两个术之间没有太大区别，且互换使用。随着技术的成熟和各种区块链的兴起，其用途迅速偏离了纯粹的货币属性。相反，技术人员开始尝试诸如去中心化域名注册等想法。其他用途则利用点对点传输特性以离散的方式传递消息。最终，许多此类项目未能找到该技术的良好用处。幸存的项目则证明了在热词之外的各种可能性。


  `blockchain`（区块链）是一种分布式账本技术，形成了一个“块链”。每个区块都包含封装在一起并验证的信息和数据。这些区块随后经过验证，并连接到由之前区块的交易和信息组成的链上。这些交易区块被永久地记录在名为`Blockchain`的分布式账本中。在此处了解更多关于区块链技术的信息。在高度去中心化的区块链上运行交易的巨大优势之一是它向用户呈现的透明度。结合其在通胀方法方面的程序一致性，与`FIAT`（法定货币）相比，你确实拥有了一种优越的价值存储手段。


  ### 2. 作为资产类别的加密货币 ![](img/image_rsrcV0.jpg)


  与区块链不同，`cryptocurrency`（加密货币）涉及到基于分布式账本技术的令牌。`cryptocurrency`可以被看作区块链网络上的工具或资源。任何涉及买卖、投资、交易、小打赏或其他货币方面的操作，都涉及区块链原生代币或子代币。它是基于`blockchain`（区块链）这一分布式账本的代币。`cryptocurrency`是基于加密学（或者根据定义，“解决或编写代码的艺术”）形成的数字货币。尽管所有这些都被视为加密货币，但这些代币在这些网络上可以发挥不同的作用。在`Bitcoin`的情况下将代币称为技术，但在处理`Ethereum`（以太坊）等其他区块链项目则不同。在这种情况下，技术是`Ethereum`，但原生代币是`Ether`，且交易使用
  gas 支付。


  ### 加密货币与区块链如何互补


  区块链是带来加密游戏的平台。`Blockchain`（区块链）是作为形成网络的分布式账本的技术。该网络创建了交易手段并实现了价值转移。`cryptocurrencies`（加密货币）是这些网络内部用于发送价值和支付交易的代币。此外，你可以将其看作`Blockchain`上的工具，在某些情况下作为资源或实用功能。其他时候，它们被用于资产价值的数字化。`blockchains`（区块链）作为基础技术，加密货币是其生态系统的一部分。它们密不可分，且在`blockchain`上进行交易通常需要`crypto`（加密货币）。但如果没有区块链技术的发明，我们就没有能够记录和传输这些交易的手段。






  # 第 7 章：比特币及其他加密货币交易技巧与窍门


  ## 买卖比特币的最佳时机


  “加密货币市场中买卖资产的最佳时机是什么时候？”这是每个加密交易者脑海中挥之不去的价值百万的问题。与交易传统资产和大宗商品类似，观察虚拟币的价格走势是有回报的。在交易策略方面，市场择机是一个有争议的话题。一些交易者支持这种观点，而另一些则认为是不可能的。简而言之，市场择机是一种基于预测价格波动以战胜市场的买卖交易策略。这些预测深入了技术和基本面分析，以评估市场和经济状况。如果投资者准确预测了价格走势，他们就能快速资产并转化为利润。许多加密交易者和投资者使用这种策略来预测哪些虚拟币即将上涨或暴跌。


  ## 为什么市场择机策略在加密货币领域有效


  加密投资相对较新，仍然存在一些细微差别。因此，市场伴随着在乎意之外发生的通缩风险，但也提供了良好的获利机会。基于此，许多加密货币投资者和潜在投资者根据市场择机来做出购买决策。那么，这种策略在这一领域表现如何？从选择从
  401k 中提取资金，到因为无法做出投资决策而卖出，都与市场择机有关。加密货币在全球范围内 24 小时交易。这是一个永不关闭的市场，这使得关注走势变得更加重要。由于市场波动较大，在购买任何东西之前，理解市场和你的风险是至关重要的步骤。了解资产的安全、价格历史和发生的模式有助于你做出判断。你越了解市场的运作方式，就越倾向于承担可能带来更高回报的高风险。


  ## 何时买，何时卖


  如果你想要一个诚实的答案，投资加密货币的最佳时机是昨天，但第二好时机可能是现在。只需看看比特币的价格历史。如果你在它还很新的时候关注它并购买了“极少量”的 `BTC`，你今天就是百万翁了。但由于我们面对的是现在，这里有一些建议可以帮助你决定买卖的完美时机：


  ### 使用“低买高卖”策略


  另一种说法是“抄底（buy the dips）”，这种基础投资技术是指在价格下跌和/或稳定时购买更多资产。这种操作最好在停滞市场或牛市中使用，在那里的通常趋势是上涨或横盘，而不是在熊市（总体方向向下）中。`BTD`
  策略的逻辑涉及分析图表、短期和长期平均移动、历史支撑趋势以及分层买入。投资者可以“买大底”或“小底”。前者是指价格跌至平均水平以下，而后者意味着价格从其上次的位置下跌。抄底的人可以选择快速卖出获利，也可以持有以建立长期头寸，或用它来逐步增持收益。底线是，该策略的核心是以较低的价格买入，而不是高位。这样做可以为你留出大波动的空间。


  ### 当汇率低于历史水平时


  虽然购买下跌资产是理想的，但很难判断价格在下一个小时或之后几日的表现。基于分析的明智判断能为你提供足够的信息。同时，你还有另一种可以考虑进入市场的方法：当发现的币的价格低于其历史水平时。有一些加密货币网站提供“移动平均线”，告诉你是退出点。不要在价格达到峰值时购买。相反，等待它在售后稳定并推升。


  ### 在出现突然峰值时卖出


  在卖出你的币时，你需要考虑你的财务状况、风险承受能力以及你最初投资加密货币的原因。研究了主流加密货币的价格走势，发现交易数字货币的最佳时机是下周，即价格遇到超过
  20% 的突然增长，并在一周后卖出。


  不买或不卖


  在购买加密货币时，在采取行动之前你应该密切观察并研究价格走势。卖出也是如此，不要急于于卖出，以免让你的币暴露在潜在的损失中。


  ## 避免常见的 FOMO（恐恐惧症）


  确实，要在几分钟内疯狂盯着比特币、瑞波或其他代币是非常困难的。发现人们涌入交易群、Reddit、Telegram 和其他讨论组来讨论上涨，作为局外人来说甚至更难忍受。然而，你不应该让这种“错失的恐惧”触发你的冲动决策（在高点买入，在底部卖出）并追随大流。错过重大活动会导致新手交易者和投资者不成熟地购买某种资产，以防错过预想中的机会。克服这种情况的最佳方法是忽略噪音，基于逻辑而非情绪做出你的投资决策。


  ## 当你不理解技术时


  使加密货币具有高度创新和前瞻性的是它们的核心技术——区块链。当你开始投资虚拟币时，你不能依靠他人来关注什么是有效的。如果你没有牢牢掌握基础和原理，那么一头扎进去风险会更大。





  持续# 第 8 章 与比特币相关的有趣事实


  金融世界是一个令人困惑的地方，充满了奇怪的术语、不寻常的货币以及无尽的交易选择。对于那些不精通技术的人来说，互联网与日常生活的融合使得金融世界发生了演变。除了在线已成为常态的广泛银行、支付和股票选择外，还诞生了新的货币。这些加密货币是通过加密技术来维护安全性和有效性的数字货币，它们具有真实价值，并通过在线选项兑换为美元（USD）、英镑（GBP）或任何其他物理货币。最流行的虚拟货币被称为比特币，多年来其人气和实力一直在稳步上升。初看之下，比特币听起来可能很困惑；然而，以下十个事实将用通俗易懂的语言真正解释比特币究竟是什么，以及它是如何产生的。


  ## 没有单一实体控制比特币


  困惑？大多数人起初都是这样想的。货币和钱通用概念是由银行控制的，其价值根据全球市场波动而变化，并且你可以物理上持有它。比特币违背了这一切。事实上，它是由所有使用比特币的人控制的，用于该货币的软件记录并验证了全球范围内比特币的记录和验证活动。


  ## 比特币的数量是有限


  你可能会认为，因为不需要物理上打印钞票或造币，现有的比特币数量可能是无限的。然而，这将导致货币贬值并使其变得毫无价值。相反，比特币恰好有 21,000,000
  枚币。


  ## 比特币没有内在或设定的价值


  如果你看一张美元，你知道它仅仅是一张印有数字和一些写着“值” 1 美元的精美图片的纸。事实上，它之所以有价值是因为我们说它有价值。比特币也是一样。那些微小的数字代码片段之所以值钱，是因为人们说它们值钱，并且想要用它们交易真实的商品/服务。比特币越受欢迎，每枚单个比特币的价值就越高。


  ## 你可以看到所有交易


  比特币的独特之处在于它是完全透明的。不是针对个人数据，不，而是针对交易和金额。一切都可以在区块链（Blockchain）上可见，这在人与人之间建立了大量的信任。


  ## 你可以挖掘比特币


  挖掘是一个术语，意味着你正在使用计算机程序解决世界各地的问题。然后通过解决这些问题获得一定数量的比特币。


  ## 交易不可撤销，对你的币没有索赔


  比特币的一个特点是，你永远不会被强制支付，也不会撤回交易。如果你为了产品发送了一些比特币，你无法撤销它，也无法强制对方收回。


  ## 你可以用很低的费用发送资金


  如果你想给英国朋友汇钱且你在英国，你可能需要支付银行转账费、货币转换费等。此外，你的朋友必须等几天才能获得这些资金。使用比特币，交易费用很低，而且资金几乎即时可用！


  ## 比特币存储在数字钱包中


  就像你登录在线账户查看余额一样，你在注册时也会建立一个比特币钱包。这个钱包就像物理钱包，但功能远超此。如果你丢失了它，它就永远丢失了；但是，人们在不给你的情况下是不可能从你的钱包取钱的。此外，如果你知道比特币地址，你可以看到他们拥有多少比特币。


  ## 丢失钱包意味着比特币永久丢失（通缩性）


  虽然钱包中的比特币可能仍然存在，因为它们被记录在区块链上，但由于钱包丢失，它们不再能够被花费。这些比特币有其独特的密钥，因此如果它们随钱包一起丢失，它们从本质上说就永远从流通中移除了。你真的可以用比特币购买物品。比特币听起来可能有点荒诞，但它实际上是一种用于购买真实物品的真实货币。许多商家接受比特币作为商品支付，包括在线商店和实体店。接受比特币的流行在线商店包括
  Newegg、Overstock、微软等。你甚至可以捐赠！


  # 第 9 章 投资数字资产


  近年来，加密货币市场的兴趣激增。这种兴趣源于高回报的潜力以及该技术的日益增长的应用。然而，市场也具有高度波动性，投资者必须小心。在本章中，我们将探索投资数字资产的一些关键方面。


  ## 理解数字资产


  数字资产是以数字格式存在的任何形式的价值。最著名的数字资产是加密货币。这些资产使用名为 `Blockchain` 的技术，这是一种记录计算机网络所有交易的去中心化账本。这种技术使得交易变得安全、透明且难以更改。


  ## 数字资产的类型


  数字资产有很多，每种都有不同的用途：


  - `Bitcoin`：第一个且最流行的加密货币，通常用作价值存储。

  - `Ethereum`：允许创建智能合约和去中心化应用程序 (dApps) 的平台。

  - `Stablecoins`：锚定到稳定资产（如美元）的加密货币，以减少波动性。

  - `Tokens`：构建在现有区块链（如 `Ethereum`）上的数字资产。


  ## 如何开始投资数字资产


  如果你对投资数字资产感兴趣，请遵循以下步骤：


  1.  **选择一个交易所**：交易所是你可以在其中买卖加密货币的平台。流行的交易所包括 Coinbase、Binance（币安）和 Kraken。

  2.  **设置钱包**：数字钱包是一个允许你存储和管理加密货币的工具。有软件钱包和硬件钱包之分。

  3.  **调查并研究你的投资**：在投资任何数字资产之前，研究该项目、背后的团队以及潜在风险。

  4.  **从小额开始**：开始投资不需要大量资金。从你认为可以承受损失的金额开始。

  5.  **监控你的投资组合**：关注你的投资并保持信息更新。


  ## 投资数字资产的风险


  投资数字资产带有风险。一些常见的风险包括：


  - **波动性**：加密货币的价格可能会迅速且大幅变化。

  - **安全性**：如果你丢失了钱包密钥或被黑客攻击，你可能会永远丢失你的数字资产。

  - **监管**：新的法律法规可能会影响数字资产的价值和交易性。

  - **诈骗**：加密货币领域存在许多欺诈项目和骗局。


  通过遵循这些步骤并保持信息更新，你可以应对数字资产的世界并可能从其日益增长的投资机会中获益。






  在如今这个追求“即时满足”、渴望速成结果的社会中，许多人再次试图把握加密货币市场的时机并大赚，几乎带着一种“中彩票”式的心态。然而，Parrul Gujral
  认为这可能是导致灾难的配方。在我对雪球（Snowball）首席执行官的视频采访中，Gujral 同意，如果你能恰好把握市场时机，仍然可以获得大胜；但正如许多人在
  2018 年经历的那样，你也可能同样迅速遭受巨损。他认为，投资加密货币成功的关键在于通过投资由金融专业审核过的加密货币池来分散风险，就像你的 401k 账户或指数基金一样。“通过我们的移动应用程序，我们让你投资加密货币或数字资产，就像沃伦·巴菲特希望你通过标普
  500 指数投资股票一样。沃伦·巴菲特、雷·达利欧，甚至托尼·罗宾斯在他的著作《金钱大师游戏》中也都推荐了指数投资。通过投资指数，费用和风险要低得多，而且经过了税务优化，你通常可以跑赢市场，”Gujral
  说道。投资指数基金的建议意味着你没有将“所有的鸡蛋都放在一个篮子里”，就像许多人在投资单一代币或 ICO（首次代币发行）时那样，并在 2018 年加密货币市场萎缩时惨赔。Panther
  Capital 的合伙人 Paul Veradittakit 也推荐加密货币投资多元化的概念：“我认为如果你是一个个人投资者，尽可能尝试多元化是有意义的，因为加密货币领域存在大量风险和波动性，你希望确保自己拥有一篮资产，并有望击中某一项表现非常好的投资。”然而，大多数人只有在成为“合格投资者”后才能获得投资加密货币基金或指数的机会——即每年连续
  2 年及以上收入超过 20 万美元，和/或拥有 100 万美元的资产（不包括首套房产）。这意味着新手或普通人通常没有能力投资加密货币基金。这是 Gujral 创立雪球的主要原因之一，他希望他的应用程序能帮助实现获取顶级加密基金和指数策略的民主化。他认为，普通投资者应该以更少的摩擦和更低的风险明智地投资加密货币领域。


  ### 2. 通过受监管的专业人士投资


  另一个挑战是找到那些金融专业人士，他们能够有效研究并推荐加密货币组合，提供稳定的投资回报率（ROI），同时最大限度地减少你在熊市——或下跌市场的风险。在加密货币
  App 和投资公司方面有很多选择，但投资者在与金融专业人士合作时应该寻求差异化因素之一，是那些获得证券交易委员会注册投资顾问（RIA）身份的人员。根据规定，“RIA
  对客户负有信托责任，这意味着他们有法律义务提供始终符合客户利益的建议。首先，RIA 必须向证券交易委员会（`SEC`）或州级机构注册。”这一称号本质上意味着 RIA
  不仅受到监管，而且对他们的投资建议和推荐负全责。“我们已经成为注册顾问或 RIA，就像霍罗威茨（Horowitz）宣布要求所有公司都配备注册顾问一样，”Gujral
  说，“由于我们正在管理他人的资金，我们认为非常重要的是：1) 获得一个证明我们受监管的认可印章；2) 拥有一套监管我们的规则。现在我们受 `SEC` 和 `FINRA`
  监管，在未来的某个时间点，还将受到 FinCEN 的监管，但目前尚未如此。”在采访其资助过 100 多个加密相关项目的 Veraditt 时，我问及 RIA 身份对行业未来有多重要。“我认为这是一件大事。我认为投资者能尽一切努力通过法规来保护自己是一件好事。当你管理他人的钱时，成为
  `SEC` 注册 RIA 是提供信誉以及在资产管理领域开展业务所需正确许可的绝佳方式。这也是为什么 Panther 也成为了 RIA 的原因。”随着加密货币生态系统的不断演变并变得日益复杂，了解哪些币和代币值得购买、哪些应该像避瘟疫一样将变得越来越耗时且充满挑战。与注册专业人士合作可能有助于节省时间，并有望增加你获利投资的机会。一个非常有价值的资源是
  SEC 投资者简报，它们在选择提供服务的金融专业人士之前提供了一份建议和提问清单。


  不要在没有进行任何自身尽职调查和研究的情况下，盲目地将资本委托托给任何财务顾问、App 或加密货币公司。毕竟，你最终对自己决策的结果负责。Gujral 推荐 Coinbase
  Earn 作为教育的良好起点。根据他们的网站，Coinbase 提供报酬让人们学习加密货币，只需完成如观看视频课程和完成测验等教育任务。他们的机构是受监管的经纪交易商，根据
  Gujral 说，他们从 `SEC` 获得了 RIA 身份。在对 Thought Resolution 首席执行官 Gray Bal 的采访中，我问到人们是否应该自我教育。


  ### 3. 关注教育和财富积累


  事实上，Gujral 对加密货币的未来极其看好，以至于计划让雪球成为最早与 Facebook 的 Libra 币集成的平台之一。在一封邮件中，担任 Facebook
  和雪球顾问的风险战略家 Reese Jones 表示：“Facebook 的 Libra 将向数十亿人引入数字加密支付，而其中许多人当然希望将他们的货币投资多元化到由雪球提供的投资组合中。”随着行业持续成熟和增长，研究并学习如何明智地投资加密货币市场可能是明智的。投资于自己的财务教育通常是有获利的，而保守的加密货币策略长期来看可以带来丰厚的回报。甚至耶鲁大学建议投资者将资产的
  6% 投入加密货币。Bal 同意这一观点：“我会说，与其关注获得巨额回报的可能性，不如将其与代表我们种族、我们星球未来的项目保持一致。关注长期游戏——找到那些拥有使命感、此前已取得多次成功并已获得全球支持的创始人。通过投资这些交易与他们并肩。”随着摩根通、USAA、高盛和
  IBM 等大型金融机构和公司支持加密货币，加上 Facebook 最近宣布自己的货币，看来加密货币将长期留存。






  # 后记


  由于比特币和其他加密货币具有主观的底层价值和高波动性，投资这些领域本质上是有风险的。但奇怪的是，正是这些特质吸引了许多人进入市场。比特币投资者喜欢的另一点是，他们中的许多人是在低位时入场的。这意味着他们是早期采用者，而且他们的损失可能较少，也许因为他们的初始投资可能要小得多。


  当然，`BTC` 自 2009 年以来一直存在，但许多山寨币（比特币的替代品或完全不同的加密货币）都是全新的。它们为人们提供了从底部入场的机会，但这个“底部”是指什么呢？你可能会看到自己的钱掉进谷底，因此在许多情况下，这种风险可能并不值得其的回报。毫无疑问，比特币确实创造了许多万富翁，并为那些相信、购买并持有它的人带来了无法想象的财富。


  但许多其他人只想知道，我们何时能看到下一个“比特币”？在我们的一生中，是否还会出现另一个像我们刚刚错过的那样的财务机会？现在，许多投资者仅仅是在对他们认为可以与比特币竞争或互补的数字资产进行盲目尝试，并将资金投入到早期项目中。


  无论上述提到的观点如何，如果你真的想避免那三个阻碍你从区块链革命中获利的常见错误，请记住以下几点：


  *   避免投资超过你合理承受范围的资金。

  *   不要成为 FOMO（恐恐症）的受害者。

  *   寻找长期价值。


  最重要的是，不要被说你必须立即购买否则就会错过机会。我们仍处于加密货币革命的早期阶段，这意味着你有充足的时间来研究项目并做出正确的投资。


  我叫 Marc Gordon，希望本指南能成为通往更好生活的钥匙。在我们告别之前，我只想最后说一件事。这件事与团队合作有关。我可以毫无疑问地说，如果我们能正确地引导它的路径，这个数字资产和去中心化网络的新世界拥有让事物向好方向改变的力量。通过共同努力，我们可以开启一个全新的、更加透明的财富和价值交换时代。像比特币这样的区块链技术可以帮助我们实现那个时代的到来。


  感谢你花时间阅读本指南，希望结果能让你对这些主题有更新、更好的理解。


