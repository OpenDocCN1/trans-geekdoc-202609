- '# 比特币基础：比特币与区块链初学者指南




  ![](img/image_rsrcU6.jpg)





  ## 前言

  ![](img/Bitcoin](image_rsrcU7.jpg)

  你发现了《比特币基础》并选择学习更多关于比特币、区块链、分布式账本技术以及价值交换未来的知识，这已经说明了很多。我们即将共同开始一段旅程，这可能会完全改变你对金钱的态度。特别是那种旧式的钱，即所谓的货币，由政府随心所欲地发行。比特币是一种新型货币，其运作方式与传统的法定货币（FIAT）非常不同。


  ![](img/image_rsrcU8.jpg)

  这里是对你需要了解的比特币事实的快速介绍。我们从哪里开始？嗯，首先，没有任何个人、公司或组织在控制比特币。因为它是由庞大网络驱动的去中心化货币。它使用一种被称为“区块链”的网络类型。比特币是一种资产，而比特币网络就是区块链（一种具有独特属性的特殊网络）。下面的引言最好地解释了比特币与区块链之间的区别：“区块链是技术。比特币仅仅是其潜力的首次表现。”
  – Marc Kindberg![](img/image_rsrcU9)


  回到正点。在继续之前真正需要解释的事实是：当你拥有比特币时，你并不像拥有衣服或汽车那样真正拥有它。它不是 true 意义上你可以触碰或持有的东西。实际上，拥有比特币意味着拥有将其发送给某人的能力，或者如果你愿意，就持有它。另一个优势是因为被称为“私钥”的东西，这是一种唯一的加密密码。只要你不与任何人分享此密钥，或不将其放在容易被发现的地方（如你的电脑或电子邮件），你的比特币将非常安全。当你是唯一持有钱包私钥的人时，你就可以访问你的资金。你可以乐意地使用免费下载的数字钱包来发送、接收和存储它。在创建比特币钱包后，你将能够安全地发送和接收。非常重要点是，由于没有银行或其他金融机构可以访问你的钱包，所以你负责保管它。比特币出现于
  2008 年全球危机，当时银行被发现滥用借款人的资金、操纵系统并收取高昂费用。为了解决这些问题，创建者希望让比特币所有者掌控交易，消除中间人，降低利率并使交易透明化。他们创建了一个分布式网络系统，人们可以以透明的方式控制自己的资金。


  ## 比特币经历了快速增长

  ![](img/image_rsrcUA.jpg)

  比特币在相对短的时间内迅速增长并传播。在全球范围内，从美国的一大型珠宝连锁店到波兰的一家私立医院，都在接受比特币。戴尔（Dell）、PayPal、微软（Microsoft）、Expedia
  等数十亿美元的大型正在处理比特币。网站在推广比特币，杂志正在出版比特币新闻，论坛在讨论加密货币和比特币交易。比特币有自己的应用程序编程接口（API）、价格指数、交易交易所和汇率。然而，比特币也存在一些问题，如黑客侵入账户、比特币的高波动性以及长时间的交易延迟。在其他地方，特别是第三世界国家的人发现比特币是绕过中间人进行转账的可靠渠道。尽管人们将比特币称为去中心化货币，但我更倾向于将其认为是一种电子资产，除了关于哪个政府支持它以及由谁设定利率的问题之外（这些问题通常是理解比特币的心理障碍）。作为一种电子资产，你可以购买比特币、拥有它们并将其发送给其他人。目前（2020
  年 4 月），大约已经产生了 1830 万个比特币。这个数字每隔 10 分钟左右增加约 25 个比特币，约定的上限为 2100 万个，最后几个比特币应该在 2140
  年之前产生。![](img/image_rsrcUB.jpg)






  # 第 1 章 什么是比特币？


  比特币是一种数字货币，由一个名为中本聪（Satoshi Nakamoto）的未知个人或团体于 2008 年正式创建。因此，比特币背后的代码遵循了由这位神秘且匿名的开发者中本聪（或一个倾向于使用该名称作为某种盾牌的群体）在白皮书中提出的理念。


  关于它可能是由一个群体而非个人制作的理论源于对名字的粗略翻译：在日语中，这个名字大致翻译为：Satoshi：思维清晰、机敏、明智；Naka：内部或关系；Moto：基础![](img/image_rsrcUC.jpg)。我们将这些组合在一起，意味着与健全货币保持清晰的思维和明智的关系。这是一个新价值交换系统的基础。无论这个新技术奇迹的背后究竟是谁，比特币网络在
  2009 年首次上线，当时其源代码作为开源软件发布。比特币承诺比传统的在线支付机制具有低的交易手续费，并由去中心化机构运营，与政府发行的货币不同。没有物理形态的比特币，只有存储在云端公共账本上的余额——这些余额以及所有的比特币交易都通过海量的计算能力进行验证。比特币不由任何银行或政府发行或支持，单个比特币也不具备商品意义的价值。尽管它不是法定货币，比特币在人气上一直很高，并引发了数百种其他虚拟货币的诞生，这些统称为“山币”（Altcoins）。


  ## 了解比特币 ![](img/image_rsrcUD.jpg


  比特币是一种加密货币。比特币代币的余额使用公共和私“密钥”存储，这些密钥是通过创建它们时使用的数学加密算法连接的长数字和字母字符串。公钥（类似于银行账户号码）作为向世界公布的地址，其他人可以向其发送比特币。私钥（类似于
  ATM 密码）则被视为受保护的秘密，仅用于授权比特币交易。


  比特币密钥不应与比特币钱包混淆，钱包是一个物理或数字设备，用于便利比特币的交易并允许用户跟踪硬币的所有权。“钱包”一词有点误导性，因为比特币的去中心化特性意味着它从未存储“在”钱包中，而是去中心化地存储在区块链上。


  **样式说明：** 根据比特币基金会的说法，在指代该实体或概念时，“Bitcoin”的首字母大写，而在指代货币数量（例如“我交易了 20 bitcoin”）或单位本身时，则使用小写的“bitcoin”。复数形式可以是“bitcoin”或“bitcoins”。比特币也常简称为
  BTC。


  ## 比特币如何工作 ![](image_rsrcUE.jpg


  比特币是最独立运行的数字货币之一。拥有计算能力并运营网络的个人和实体（被称为“矿工”）其动力来自奖励（一个新的比特币区块）和以比特币支付的交易。这些可以被认为是维护网络安全的去中心化权威。新的比特币以固定的、周期性的速率分配给矿工，使得总供应量接近
  2100 万![](image_rsrcUF)。目前，有数百万比特币尚未被开采。通过这种方式，比特币（以及任何通过类似过程生成的加密货币）与法币不同；在中心化银行系统中，货币的分配速率与需求增长相匹配，而像比特币这样的去中心化系统则根据算法提前设定速率。


  比特币挖掘是分配比特币的过程。通常，挖矿需要解决计算困难的难题来发现新区块，并将其添加到区块链。在贡献区块链的过程中，挖矿添加并验证了整个网络的交易。为了向区块链添加区块，矿工将获得几个比特币形式的奖励；奖励每
  210,000 个区块减半。2009 年区块奖励为 50 个新比特币，目前为 12.5 个。随着越来越多的比特币被创建，挖矿过程的难度——即涉及的计算量——就会增加。挖矿难度从
  2009 年比特币诞生时的 1.0 开始；到年底仅为 1.18。截至 2019 年 10 月，挖矿难度已超过 12 万亿。曾经，普通的台式计算机就可以用于挖掘过程；现在，为了应对这种难度，矿工必须使用昂贵的复杂的专用集成电路（ASIC）和更先进的处理器，如图形处理器（GPU）。这些复杂的挖掘处理器被称为“矿机”。一个比特币可以细分为小数点后八位（一个比特币的亿分之一），这个最小单位被称为
  Satoshi。如果有必要，并且参与的矿工主张，比特币最终可以细分为更多的小数位。






  # 第二章：比特币的历史


  一项革命性技术所可能采取的道路是任何人都无法预测的。以史上第一笔比特币交易为例。2010 年 5 月 22 日，名为 `Hanyecz` 用比特币购买了 2 块比萨，总共花费了
  10,000 比特币。如今，这笔交易被标记为史上最昂贵的食物订单，总价值约为 100,000,000 美元，每块比萨 50,000,000 美元。`Hanyecz`
  进行购买的日期 5 月 22 日被称为“比特币比萨日”，并受到全球加密货币爱好者的庆祝。从一个使用虚假身份的程序员和两块著名的比萨，到黑市和一个幻想游戏网站：这个世界上第一种加密货币经历了一段漫长而曲折的道路。


  就像分是美元的最小单位一样，`satoshi`（聪）是比特币的最小单位。简单来说，它是进行交易的最小面值。这个单位被称为 `satoshi`，是为了向比特币的创始人中本聪（Satoshi
  Nakamoto）致敬。过去几年里最大的金融故事之一就是比特币的惊人崛起。这种虚拟货币的设计初衷是彻底改变点对交易；它不需要中间人（如银行或信用卡网络），不需要个人信息交换，也不需要交易费用。


  ![](img/image_rsrcUG.jpg)


  然而，尽管许多人对于“比特币”究竟是什么以及这种新兴加密货币如何运作仍然感到困惑，但对于比特币源自何处以及如何变成今天这样的，人们也存在着同样的困惑——这是一项动摇了金融世界核心的技术创新。


  ## 比特币区块链入门


  ![](img/image_rsrcUH.jpg)


  比特币的支柱是区块链技术，它利用该技术来记录其网络上的交易。区块链本质上是一个公共分布的账本；它记录了在区块上发生过的每一笔比特币交易。当该区块的内存填满时，它就会按顺序添加到区块链中。这个账本在网络中的每台计算机上都可以免费访问，负责验证交易、存储区块链并将交易中继到其他计算机。这些计算机被称为
  `nodes`（节点）。由于数据库存储在节点网络而非单台服务器上，黑客或盗取比特币几乎是不可能的。黑客必须同时破解大多数节点。比特币的创造总量非常有限，这意味着这种货币不会因为中央银行发行更多货币而导致贬值。得益于加密货币的优势，唯一比硬币数量增长更快的是比特币的价格。截至
  2020 年 5 月，一个比特币的价格仍处于 8900 美元到 9200 美元之间。与 2020 年 1 月 4000 美元的低点相比，它已经走了很远。如果你在低点买入，你将在不到一年内获得超过
  100% 的投资回报（ROI）。足以说明，时机就是一切，因为比特币是一种极波动性的资产。


