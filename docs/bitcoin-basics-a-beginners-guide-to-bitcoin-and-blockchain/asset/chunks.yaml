    # Chapter 5 The Pitfalls and Mistakes People Make with Bitcoin


    ## WHAT ARE SOME COMMON MISTAKES PEOPLE MAKE WITH BITCOIN AND HOW TO PREVENT THEM?


    ![](image_rsrcUU.jpg)


    We’ve reached a point where good trading opportunities occur on a daily basis.
    With so many coins out there, it’s impossible to be on top of all of them. Well,
    let me tell you a secret, you don’t have to be. You have to be patient and in
    control of your emotions. Some days you’ll be sitting on your computer, looking
    at those haunting green candles and big bull runs, and you’ll want to trade so
    badly. If you missed out on those trades, let them go. You can’t enter such trades
    based just on the assumption that the bull-run will continue long enough for you
    to gain a portion of those profits. There’s a big chance that your impatience
    will cost you dearly. It often happens that you buy at the top and face a big
    drop in price afterward. Entering in a hasty trade without a clear strategy is
    a terrible idea. But if you put in some effort and learn how to analyze the coin/chart,
    set up an entry, exit, and target points and adjust position size correctly, you
    will be able to know the difference between a good and a bad trade. Your goal
    must always be to pick the best possible trade. And remember a good trader always
    trades less.


    The cryptocurrency market is booming, and it will continue to do so. What started
    in 2009 can’t be undone. More and more people are learning about cryptocurrencies
    and are thinking about investing in them. They ask me questions like… Is bitcoin
    going to rise even more? Should I invest some money in there? Which cryptocurrency
    is the best? My answer usually goes something like this: trading in the cryptocurrency
    market has been extremely profitable so far. It seems like our group has made
    the right moves. We got really good at spotting potential profits and taking advantage
    of them. Of course, sometimes things don’t turn out expected, but we know the
    risks, and we know how to minimize them. Trading nowadays seems simple, because
    we have the knowledge and the experience. In order to make your life a little
    easier, especially for beginners, I listed some of the topics, you have to take
    into consideration before you start trading: ![](image_rsrcUV.jpg)


    ### 1. Don’t Let Your Bitcoin Out of Sight


    Bitcoin is an essential part of cryptocurrencies. You must always know what `BTC`
    is doing. Is it in a consolidation state, a bull run, or in a bear run? What’s
    the latest news that might influence sudden price change or a trend reversal?
    This is important because you’ll be mostly trading with an altcoin/bitcoin pair.
    You’ll have to keep an eye on both currencies. There’s a general rule that when
    bitcoin’s price is rising, all other currencies will be in red numbers. And when
    bitcoin’s price decreases, alts will be back in the green. There are exceptions
    where you will profit from both bitcoin and altcoin going up, but don’t get caught
    in the opposite scenario where you’ll get slammed. When you’re not sure what to
    trade with good altcoin. The only downside is that they are not as the table.
    The most important advice I have in this entire book is the famous quote: “If
    you don’t hold the private keys, it’s not bitcoin.” Or a shorter version of this,
    “not keys, not coins.” If you think your bitcoins are safe in an exchange or being
    held by a third party, think again. A common way to think about bitcoins is to
    think about rights. You never truly hold a bitcoin but you can hold a key to control
    its movement. That control of a bitcoin’s movement is the closest thing you will
    ever get to ownership of it. Sure we have the ability to move money from our bank
    until they arbitrarily freeze our account for no reason. In this sense Bitcoin
    is a lot more real than your bank account is ever been. If you and only hold the
    keys, nobody can take that away. How’s that digital freedom ![](image_rsrcUW)


    ### 2. Volatility works for you, not you


    This market is so volatile you’ll get stressed from it. It’s caused big moves,
    pump & dump, and FOMO events. Volatility works both ways. It can make you or leave
    you if foolish. It’s worth mentioning that exchanges offer margin trading as well.
    Keep in mind that things can change quickly ![](image_rsrcUX)


    ### 3. Practice with a small trading position and master the


    If you just started trading, your position size should be small. Why? Because
    you have to be 100% sure of what you are doing when you want to execute a order.
    You have to know around exchange you are trading on. Write things down if needed.
    When the time comes for you to place orders, you will have to act quickly. There
    will be no room for error. Place a tiny buy and stop orders, and practice as much
    as needed. If you must master one exchange, it doesn’t mean you know them all.
    When you trade on five or more exchanges, you will notice they differ in many
    ways. Before choosing an exchange, always check the following characteristics:
    fees, liquidity, security, option for short/option for margin trading, and other
    features ![](image_rsrcUY)


    ### 4. Enter a trade only when you have a clear strategy


    Going in a trade blind is a no-go. Maybe’ll get lucky a couple of times, but in
    the long run, you don’t stand a chance. In order to achieve success, you have
    to combine fundamental and technical analysis. You have to stick to your strategy,
    no matter what. Once you enter a trade with calculated position size, you will
    know how much risk are you willing to take and where you will take your profit.


    ### 5. Adapt, analyze trades and learn from your mistakes


    Traders who don’t analyze their trading performance are more prone to make repetitive
    mistakes. As a trader, you must constantly improve in order to survive and thrive
    in this fast-paced market. This is a vital part of trading. There’s lots of room
    for improvement, even if you are an experienced trader. Try to adapt, analyze
    and learn from your mistakes.


    ### 6. Control your emotions


    Emotions are constantly not wanted. It’s easy to get carried away by greed, fear,
    or excitement. Different situations bring different emotions, and it is up to
    how you will handle them. When you have a bad trade, the negativity surrounding
    the outcome can carry over into the next trade. It may happen that you won’t enter
    next due to the fear of losing. On the contrary, when you have a winning streak,
    you might think you’re invincible and push trades into the market at the wrong
    time. Before entering a trade, it always helps to ask yourself for the reasons
    behind the actions that you’re about to take. Practice resilience you can afford
    the money.

