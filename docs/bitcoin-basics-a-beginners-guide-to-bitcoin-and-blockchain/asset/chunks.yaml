    ## Foreword

    ![](Bitcoin](image_rsrcU7.jpg)

    The fact that you found “Bitcoin Basics” and made the choice to learn more about
    Bitcoin, blockchain, distributed ledger technology and the future of value exchange
    already says a lot. We are about to begin a journey together that may completely
    change your attitude towards money. Especially the old kind of money, referred
    to as currency and endlessly issued by governments at whim. Bitcoin is a new type
    of money that works very differently from traditional FIAT currency.


    ![](image_rsrcU8.jpg)

    Here’s a quick introduction covering the facts you need to know about Bitcoin.
    Where do we begin? Well, first of all, person, company, or organization is in
    control of Bitcoin. This is because it’s a decentralized currency powered by a
    huge network of people. It uses a type of network referred to as blockchain. Bitcoin
    is an asset and the bitcoin network is blockchain (a special type of network with
    unique properties). The following quote best explains the difference between Bitcoin
    and blockchain: “Blockchain is the tech. Bitcoin is merely the first manifestation
    of its potential.” – Marc Kindberg ![](image_rsrcU9)


    Back to the main point. What really needs to be explained before moving forward
    is the fact that when you own Bitcoin you don’t really own it like a shirt or
    a car. It’s not something you can touch or hold in the true sense. In reality,
    owning bitcoin means having the power and ability to send it to someone or simply
    hold on it if you’d prefer. Another advantage is because of something called private
    key, a unique encryption password. Your bitcoin will be extremely safe as long
    you don’t share this key with anyone or put it in a place it can easily found
    like your computer or in your email. When you are the only one who holds the private
    key to your wallet, you have access to your funds. You’ll gladly send, receive,
    and store it using a digital wallet which you can download for free. After creating
    a Bitcoin wallet you will have the ability to both send and receive securely.
    It’s really important to remember that because no bank or other financial institution
    has access to your wallet, you’re in charge of keeping it. Bitcoin emerged out
    of the 2008 global crisis when banks were caught misusing borrowers'' money, manipulating
    the system, and charging exorbitant fees. To address such issues, creators wanted
    to put the owners of bitcoin in charge of the transactions, eliminate the middleman,
    cut interest rates and make transactions transparent. They created a distributed
    network system where people could control their funds in a transparent way.


    ## Bitcoin Has Experienced Rapid Growth

    ![](image_rsrcUA.jpg)

    Bitcoin has grown rapidly and spread in a relatively short period of time. Across
    the world, companies from a large jewelry chain in the U.S., to a private hospital
    in Poland, accept bitcoin. Multi-billion dollar corporations such as Dell, PayPal,
    Microsoft, Expedia, etc., are dealing in bitcoins. Websites promote bitcoins,
    magazines are publishing bitcoin news, and forums are discussing cryptocurrencies
    and trading in bitcoins. Bitcoin has its own Application Programming Interface
    (API), price index, trading exchanges, and exchange rate. However, there are issues
    with bitcoins such as hackers breaking into accounts, high volatility of bitcoins,
    and long transaction delays. Elsewhere, particularly people in third world countries
    find bitcoins as a reliable channel for transferring money bypassing intermediaries.
    Although people refer to bitcoin as a decentralized currency, I prefer to think
    of it as an electronic asset, aside questions around which government backs it
    and who sets the interest rate, which is often a mental block in understanding
    bitcoin. As an electronic asset, you can buy bitcoins, own them, and send them
    to someone else. Currently (April 2020), there are around 18.3 million bitcoins
    that have been created. This number will increase by about 25 bitcoins every 10
    minutes or so, with an agreed limit of 21 million, the last of which should be
    created a little before the year 2140. ![](image_rsrcUB.jpg)

