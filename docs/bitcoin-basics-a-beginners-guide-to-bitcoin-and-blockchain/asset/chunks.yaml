    ## 前言

    ![](img/Bitcoin](image_rsrcU7.jpg)

    你发现了《比特币基础》并选择学习更多关于比特币、区块链、分布式账本技术以及价值交换未来的知识，这已经说明了很多。我们即将共同开始一段旅程，这可能会完全改变你对金钱的态度。特别是那种旧式的钱，即所谓的货币，由政府随心所欲地发行。比特币是一种新型货币，其运作方式与传统的法定货币（FIAT）非常不同。


    ![](img/image_rsrcU8.jpg)

    这里是对你需要了解的比特币事实的快速介绍。我们从哪里开始？嗯，首先，没有任何个人、公司或组织在控制比特币。因为它是由庞大网络驱动的去中心化货币。它使用一种被称为“区块链”的网络类型。比特币是一种资产，而比特币网络就是区块链（一种具有独特属性的特殊网络）。下面的引言最好地解释了比特币与区块链之间的区别：“区块链是技术。比特币仅仅是其潜力的首次表现。”
    – Marc Kindberg![](img/image_rsrcU9)


    回到正点。在继续之前真正需要解释的事实是：当你拥有比特币时，你并不像拥有衣服或汽车那样真正拥有它。它不是 true 意义上你可以触碰或持有的东西。实际上，拥有比特币意味着拥有将其发送给某人的能力，或者如果你愿意，就持有它。另一个优势是因为被称为“私钥”的东西，这是一种唯一的加密密码。只要你不与任何人分享此密钥，或不将其放在容易被发现的地方（如你的电脑或电子邮件），你的比特币将非常安全。当你是唯一持有钱包私钥的人时，你就可以访问你的资金。你可以乐意地使用免费下载的数字钱包来发送、接收和存储它。在创建比特币钱包后，你将能够安全地发送和接收。非常重要点是，由于没有银行或其他金融机构可以访问你的钱包，所以你负责保管它。比特币出现于
    2008 年全球危机，当时银行被发现滥用借款人的资金、操纵系统并收取高昂费用。为了解决这些问题，创建者希望让比特币所有者掌控交易，消除中间人，降低利率并使交易透明化。他们创建了一个分布式网络系统，人们可以以透明的方式控制自己的资金。


    ## 比特币经历了快速增长

    ![](img/image_rsrcUA.jpg)

    比特币在相对短的时间内迅速增长并传播。在全球范围内，从美国的一大型珠宝连锁店到波兰的一家私立医院，都在接受比特币。戴尔（Dell）、PayPal、微软（Microsoft）、Expedia
    等数十亿美元的大型正在处理比特币。网站在推广比特币，杂志正在出版比特币新闻，论坛在讨论加密货币和比特币交易。比特币有自己的应用程序编程接口（API）、价格指数、交易交易所和汇率。然而，比特币也存在一些问题，如黑客侵入账户、比特币的高波动性以及长时间的交易延迟。在其他地方，特别是第三世界国家的人发现比特币是绕过中间人进行转账的可靠渠道。尽管人们将比特币称为去中心化货币，但我更倾向于将其认为是一种电子资产，除了关于哪个政府支持它以及由谁设定利率的问题之外（这些问题通常是理解比特币的心理障碍）。作为一种电子资产，你可以购买比特币、拥有它们并将其发送给其他人。目前（2020
    年 4 月），大约已经产生了 1830 万个比特币。这个数字每隔 10 分钟左右增加约 25 个比特币，约定的上限为 2100 万个，最后几个比特币应该在
    2140 年之前产生。![](img/image_rsrcUB.jpg)


