    # 第二章：比特币的历史


    一项革命性技术所可能采取的道路是任何人都无法预测的。以史上第一笔比特币交易为例。2010 年 5 月 22 日，名为 `Hanyecz` 用比特币购买了 2
    块比萨，总共花费了 10,000 比特币。如今，这笔交易被标记为史上最昂贵的食物订单，总价值约为 100,000,000 美元，每块比萨 50,000,000
    美元。`Hanyecz` 进行购买的日期 5 月 22 日被称为“比特币比萨日”，并受到全球加密货币爱好者的庆祝。从一个使用虚假身份的程序员和两块著名的比萨，到黑市和一个幻想游戏网站：这个世界上第一种加密货币经历了一段漫长而曲折的道路。


    就像分是美元的最小单位一样，`satoshi`（聪）是比特币的最小单位。简单来说，它是进行交易的最小面值。这个单位被称为 `satoshi`，是为了向比特币的创始人中本聪（Satoshi
    Nakamoto）致敬。过去几年里最大的金融故事之一就是比特币的惊人崛起。这种虚拟货币的设计初衷是彻底改变点对交易；它不需要中间人（如银行或信用卡网络），不需要个人信息交换，也不需要交易费用。


    ![](img/image_rsrcUG.jpg)


    然而，尽管许多人对于“比特币”究竟是什么以及这种新兴加密货币如何运作仍然感到困惑，但对于比特币源自何处以及如何变成今天这样的，人们也存在着同样的困惑——这是一项动摇了金融世界核心的技术创新。


    ## 比特币区块链入门


    ![](img/image_rsrcUH.jpg)


    比特币的支柱是区块链技术，它利用该技术来记录其网络上的交易。区块链本质上是一个公共分布的账本；它记录了在区块上发生过的每一笔比特币交易。当该区块的内存填满时，它就会按顺序添加到区块链中。这个账本在网络中的每台计算机上都可以免费访问，负责验证交易、存储区块链并将交易中继到其他计算机。这些计算机被称为
    `nodes`（节点）。由于数据库存储在节点网络而非单台服务器上，黑客或盗取比特币几乎是不可能的。黑客必须同时破解大多数节点。比特币的创造总量非常有限，这意味着这种货币不会因为中央银行发行更多货币而导致贬值。得益于加密货币的优势，唯一比硬币数量增长更快的是比特币的价格。截至
    2020 年 5 月，一个比特币的价格仍处于 8900 美元到 9200 美元之间。与 2020 年 1 月 4000 美元的低点相比，它已经走了很远。如果你在低点买入，你将在不到一年内获得超过
    100% 的投资回报（ROI）。足以说明，时机就是一切，因为比特币是一种极波动性的资产。


    ## 中本聪与比特币的神秘起源


    ![](img/image_rsrcUJ.jpg)


    2008 年底，金融危机正如火如荼。同年 9 月，当时世界第四大投资银行雷曼兄弟银行申请了第 11 章破产。当世界金融基础设施正在崩溃时，`bitcoin.org`
    域名被注册。2008 年晚些时候，一个使用 `Satoshi Nakamoto`（中本聪）笔名的人或群体向加密邮件列表发布了一份关于比特币的白皮书，解释了这种加密货币如何运作。2009
    年初，`Nakamoto` 挖出了首个比特币，被称为“创世区块”。在这一第一个比特币的程序中嵌入了文字：“The Times 03/Jan/2009 Chancellor
    on the brink of second bailout for banks.”（《泰晤报》2009 年 1 月 3 日：首相面临银行第二次救助的边缘）。这段文字指的是英国《泰晤报》在该日期的一条新闻，通常被认为是对当时情况的预言。由于加密货币的优势，唯一比硬币数量增长快的是比特币的价格。由于注：此处原文重复，2008
    年晚些时候，一个使用 `Satoshi Nakamoto` 笔名的人或群体发布了一份关于比特币的白皮书，解释了这种加密货币如何运作。由于注：此处原文重复，由于注：此处原文重复）这段文字……通常被认为……中本聪的身份是一个谜。由于数据库存储在节点网络而非单台服务器上，黑客或盗取比特币几乎是不可能的。黑客必须同时破解大多数节点。比特币的创造总量非常有限，这意味着这种货币不会因为中央银行发行更多货币而导致贬值。得益于加密货币的优势，唯一比硬币数量增长快的是比特币的价格。截至
    2020 年 5 月，一个比特币的价格仍处于 8900 美元到 9200 美元之间。与 2020 年 1 月 4000 美元的低点相比，它已经走了很远。如果你在低点买入，你将在不到一年内获得超过
    100% 的投资回报（ROI）。足以说明，时机就是一切，因为比特币是一种极波动性的资产。


