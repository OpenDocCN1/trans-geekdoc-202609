    # Chapter 4: Preserving the Value of Your Money with Bitcoin


    ## HOW BITCOIN CAN HELP PRESERVE THE VALUE OF YOUR MONEY?


    For most of bitcoin’s lifespan, it has been used for mainly one purpose: investment.
    People put their money into the digital asset with hopes that they would receive
    an exponential amount of returns—and there is a clear reason for it. Bitcoin has
    seen its fair share of price swings, and there have been many stories of people
    earning a lot of money when the price of bitcoin skyrock. However, bitcoin has
    evolved a lot over time. Peer-to-peer finance is taking a new course, and it has
    led to a flurry of new possibilities for bitcoin users. These include making payments,
    sending remittances, and wealth preservation. As a matter of fact, there are several
    businesses asserting bitcoin. I will now cover some of the main features regarding
    Bitcoin as it pertains to locking in value:


    ### 1. Bitcoin as a means of wealth preservation

    The idea of using bitcoin as a means of wealth preservation can be done in two
    ways: preserving your assets and preventing inflation on your currency.


    ### 2. A Viable Money Reserve (Preserving Your Assets PYA)

    For those who are using bitcoin as a means of investment, rest assured to know
    that bitcoin is also a viable method for the preservation of wealth (PYA). In
    many ways, bitcoin can be seen as the safest way to preserve your capital, its
    limited supply and blockchain make it safe for all users. One of the biggest perks
    of using bitcoin is that it has no borders, allowing you to send and receive bitcoin
    from anywhere in the world. This means that traditional financial borders and
    barriers such as banks and other institutions will no longer be applicable—allowing
    you to have control over your money (as you are in possession of it). Having a
    money reserve with bitcoin is something a lot of people are starting to protect
    their assets as well in case of financial disaster such as extreme inflation.


    ### 3. Protecting the Value of Your Money (Eliminating Inflationary Risk)

    Imagine this: your country is experiencing an economic crisis and the value of
    your currency is dropping rapidly. What’s your way out? To comfort, a Venezuelan
    holder learned that bitcoin has the power to save him and his family. Carlos Hernandez,
    a Cuban native, now holds all his money in bitcoin and only withdraws small amounts
    when necessary. As a country’s economy can be volatile, and he could lose a lot
    of money when bolars’ value goes down, Carlos thinks that keeping his money all
    in bolars is “financial suicide.” This explains why he decided to convert all
    his assets into bitcoin wealth. Bitcoin and cryptocurrency are usually seen as
    something “first world,” but it’s actually the developing countries (or countries
    with struggling economies like Venezuela) that have shown more adopting them.
    Rather than using these digital assets as a means of investment—how a lot of bitcoin
    holders in developed countries use bitcoin—people in developing countries are
    using them as a means of survival. A big portion of the world still remains unbanked
    (as of 2017), which basically means that they have the same financial rights as
    terrorists. They are completely cut off from traditional financial services as
    they they need. This makes payments much harder for people who need them the most.
    On the other hand, bitcoin gives these people the financial passport and accessibility
    they really need, allowing them to gain access to affordable banking and the global
    free trade system. As one of its real-use cases, bitcoin can be used as a means
    of wealth preservation for countries with struggling economies. Take Venezuela
    as example, their currency is currently experiencing inflation of 10 million percent
    (as of August 2019). People are looking for means of survival—and bitcoin in hand
    as their solution. Venezuela hit 20 million bolars as it’s a way for them to protect
    their currency from further inflation.


    ### 4. Gold vs. Bitcoin

    Gold and bitcoin are both extremely useful assets when it comes to preservation.
    Gold is a solid metal and has long been physical properties such as durability,
    beauty. On the other hand, bitcoin is a relatively new digital asset with real-use
    cases that are yet to be discovered. Each of them has their own wealth preservation.
    In terms of currency, gold and bitcoin are different in ways. Gold is tangible
    and physical, allowing people to store it whatever way they want. Bitcoin, however,
    is digital, and if you lose access to your `private keys`, all can be lost within
    a matter of minutes—whether to hackers or just lost in general. On the other hand,
    gold can also be physically stolen, can erode, and the general quality of the
    gold can be tarnished. Both assets have limited supply, but gold has gone through
    thousands of years of competition with other forms of payment and secured its
    spot as the clear winner when it comes to the store of value. Because gold has
    been around for so long, people are more likely to believe in its value. Bitcoin,
    on the other hand, despite having a limited supply as well, is believed to be
    potentially forked for more supply. Moreover, the price of bitcoin is volatile
    at times, and the prevention of money laundering/terrorist assets can hinder bitcoin
    from getting official support. Nevertheless, with economic crises happening over
    the world, bitcoin is just beginning to provide its real-life uses, and it’s showing
    everyone that although it’s not as respected as gold yet, it can be a viable means
    of wealth preservation.


    ### 5. Why Bitcoin?

    As you can see, the features of bitcoin evidently emancip the unbanked from central
    control. Bitcoin, as a decentralized currency, provides people a means of traversing
    through the financial world without borders. In addition, bitcoin has the unique
    trait of being unable to be confiscated. Ask yourself: which of the assets you
    own is non-confiscable by a higher authority?

