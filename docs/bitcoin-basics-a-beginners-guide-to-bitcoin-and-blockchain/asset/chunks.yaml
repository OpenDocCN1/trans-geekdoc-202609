    # Chapter 3: The Difference Between a Bitcoin Wallet and a Bank Account


    ## WHAT MAKES A BITCOIN WALLET DIFFERENT FROM A BANK ACCOUNT?


    ![](image_rsrcUS.jpg) A bank account is a financial contract between a client
    and a bank, through which the balance and all the financial movements of the client
    (fiat money) are stored and controlled. A cryptocurrency (Bitcoin) wallet is a
    software or software hardware solution that can be accessed with keys, both public
    and private (which always go together). With these keys you can send and receive
    currencies through the Blockchain. Often wallets are usually compared to bank
    accounts. Now I’m going to discuss five important differences between a bank account
    and a Bitcoin wallet:


    ### 1.) The Way Currency is Stored

    This is perhaps the main difference that allows us to distinguish between a wallet
    and a bank account. A wallet is made to store cryptocurrencies and operate with
    them, that is, in a wallet, we can operate with Bitcoin, Ethereum, Dash, and as
    many currencies (as the digital wallet allows). On the other hand, bank accounts
    only allow storing and operating fiat money, that is: euros, dollars, pesos, etc.


    ### 2.) Public and Private Keys

    In a wallet, both the public key and the private key are very large numbers, and
    generally, their representation is in a separate WIF wallet import format, consisting
    of numbers and letters. On the other hand, bank accounts are limited numbers,
    generally of 20 numerical digits that are divided into groups that identify the
    bank, the branch, the type of account, and finally, the individual identifier
    of the client.


    ### 3.) Control Over Stored Money

    In a digital wallet, you have absolute control over the currencies that are stored,
    able to move without authorization from third parties by using the private key
    (if the private key is lost, the money is also lost). On the other hand, a bank
    account requires authorization from the bank for movements through online banking,
    credit/debit, etc.


    ### 4.) Accessing Money and Security

    Most digital wallets work through websites or applications (though an internet
    connection is indispensable). In terms of security, the private key stored in
    the wallet is the only means to access it, offering high security against third
    parties. On the other hand, in a bank account, the money is accessed through online
    banking (which is accessed via the Internet and varies according to each bank)
    and through credit/debit cards, although these methods offer more flexibility
    to the user. The point against this is that the level of security is lower because
    online banking depends on the security measures applied to each bank. On the other
    hand, the level of security of credit or debit cards will depend on the level
    of security of the platform where the payments have been processed. Because of
    this their security protocols will not be so high because they do not follow global
    standards (each bank or payment system has its own standards).

