    # Chapter 6: The Difference Between Blockchain, Bitcoin and Other Cryptocurrencies


    ## 1. WHAT EXACTLY DO THEY MEAN WHEN THEY SAY BLOCKCHAIN TECHNOLOGY?


    ## 2. WHAT IS THE DIFFERENCE BETWEEN BLOCKCHAINS AND DIGITAL CURRENCIES?


    Part of the confusion around what is blockchain versus what is cryptocurrency
    is due in part that the terms have come into use incorrectly and without regard
    to their proper usage. Instead of being introduced by formal definition, the term
    `blockchain` developed from a “chain of blocks.” `cryptocurrency` is a sort-ofmau
    of “cryptographic currency.” But the fundamental difference between these concepts
    has to do with how distributed ledger technology is used. Keep reading for a clearer
    idea of the difference between blockchains and cryptocurrencies.


    ### 1. Blockchain As A Technology ![](image_rsrcUZ.jpg)


    When `Bitcoin` was the only digital asset and the only blockchain network, there
    wasn’t much of a distinction between the terms, and they were used interchangeably.
    As the technology matured and a variety of blockchains blossomed, the uses quickly
    diverged from the pure money aspect. Instead, technologists experimented with
    ideas like a decentralized name registry. Other uses utilized the peer-to-peer
    aspect to deliver messages in a discrete way. In the end, many of these projects
    failed to find good use of technology. The projects standing helped demonstrate
    what was possible beyond buzzwords.


    A `blockchain` is a distributed ledger technology that forms a “chain of blocks.”
    Each block includes information and data that are bundled together and verified.
    These blocks are then validated and strung onto the chain of transactions and
    information in previous blocks. These blocks of transactions are permanently recorded
    in the distributed ledger that is the `Blockchain`. Learn more about blockchain
    technology here. Some of the greatest benefits to running transactions on a highly
    decentralized blockchain is the transparency it presents to users. Combined that
    with the programmed consistency regarding inflationary methods and you truly have
    a superior store of value when compared to `FIAT` currencies.


    ### 2. Cryptocurrency as an Asset Class ![](image_rsrcV0.jpg)


    Contr with Blockchain, `cryptocurrency` has to do with the use of tokens based
    on the distributed ledger technology. `cryptocurrency` can be seen as a tool or
    resource on a blockchain network. Anything dealing with buying, selling, investing,
    trading, microtipping, or other monetary aspects deals with a blockchain native
    token or subtoken. It is a token based on the distributed ledger that is a `blockchain`.
    `cryptocurrency` is a digital currency formed on the basis of cryptography, or
    by definition, “the art of solving or writing codes.” Although all are considered
    cryptocurrencies, these tokens can serve different purposes on these networks.
    Referring to the token as the technology in the case of `Bitcoin`, but is different
    when dealing with other blockchain projects like `Ethereum`. In this case the
    technology is `Ethereum`, but the native token is `Ether`, and transactions are
    paid in gas.


    ### How Cryptocurrencies and Blockchain Complement Each


    Blockchain is the platform that brings cryptocur play. The `Blockchain` is the
    technology that serves as the distributed ledger that forms the network. This
    network creates the means for transacting and enables transferring value. `cryptocurrencies`
    are the tokens used within these networks to send value and pay for transactions.
    Furthermore, you can see them as a tool on `Blockchain`, in some cases serving
    as a resource or utility function. Other times they are used for the digitizing
    value of an asset. `blockchains` serve as the basis technology, in which cryptocurrencies
    are a part of ecosystem. They go hand in hand, and `crypto` is often necessary
    to transact on a `blockchain`. But without the invention of `blockchain` technology,
    we would not have a means for these transactions to be recorded and transferred.

    '
