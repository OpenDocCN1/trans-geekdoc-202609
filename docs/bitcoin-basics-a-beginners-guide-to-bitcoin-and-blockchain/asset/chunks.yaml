    # Afterword


    Investing in Bitcoin and other cryptocurrencies is inherently risky due to their
    subjective underlying value and high volatility. But oddly, these same traits
    are actually bringing many people into the market. Another thing that Bitcoin
    investors like is the fact that many of them got in on the ground floor. This
    means that they’re early adopters and they have less to lose perhaps because their
    initial investment may have been much smaller.


    Sure, `BTC` has been around since 2009, but many of the altcoins (substitutes
    for Bitcoin or completely different cryptocurrencies altogether) are new. They
    offer people a chance to get in on the ground floor, but the ground floor of what?
    You may see your money fall through the floor so the risk may not be worth the
    reward in many cases. Without a doubt Bitcoin has made millionaires and brought
    unimaginable wealth to the people who believed in it, purchased it and held onto
    it.


    But many others just want to know, when we will see the next Bitcoin? Will there
    ever be another financial opportunity like the one we have just missed in our
    entire lifetimes? Numerous investors are now simply taking wild shots at digital
    assets they believe could compete or compliment Bitcoin and they are putting money
    into projects early.


    Regardless of points mentioned above, if you really want to avoid the three common
    mistakes that will work counter to prospering from the blockchain revolution,
    keep these points in mind:


    *   Avoid investing more than you can reasonably afford.

    *   Don’t fall victim to FOMO.

    *   Look for long-term value.


    Above all, don’t be convinced that you must buy right away or you’ll miss out.
    We’re still very early in the cryptocurrency revolution, meaning you have plenty
    of time to research projects and make the right investments.


    My name is Marc Gordon, and I hope this guide can act as a key to a better life.
    I’d just like to say one last thing before we part ways. That thing relates to
    teamwork. I can confidently say beyond a doubt that this new world of digital
    assets and decentralized networks has the power to change things for the better
    if we can direct its path correctly. Together, we can bring about a new, more
    transparent age of wealth and value exchange. Blockchain technologies like Bitcoin
    can help us bring that age about.


    Thank you for taking the time to read this guide and I hope as a result that you’ve
    been able to gain a new and better understanding of these topics.


    Sincerely,

    Marc Gordon


    ## About the Author


    Marc Gordon is a human rights activist, computer programmer and cryptocurrency
    expert. Beyond that he prides himself on being able to explain complex concepts
    like `Bitcoin`, `blockchain` and distributed ledger technology to the masses.
    In a new age, a digital currency revolution is taking place and it’s something
    we have never seen before. It will transform the world as we know it and become
    the new way in which value transactions primarily take place. Marc Gordon’s passion
    for creating high quality non-fiction titles about cryptocurrencies and technology
    is undeniable and he will continue to deliver world class titles to his beloved
    readers.


    ## Do Not Go Yet


    One Last Thing To Do If you enjoyed this book or found it useful, I’d be very
    grateful if you’d post a short review on Amazon. Your support really does make
    a difference, and I read all the reviews personally so I can get your feedback
    and make this book even better. Thanks again for your support!

    '
