    # 第 1 章 什么是比特币？


    比特币是一种数字货币，由一个名为中本聪（Satoshi Nakamoto）的未知个人或团体于 2008 年正式创建。因此，比特币背后的代码遵循了由这位神秘且匿名的开发者中本聪（或一个倾向于使用该名称作为某种盾牌的群体）在白皮书中提出的理念。


    关于它可能是由一个群体而非个人制作的理论源于对名字的粗略翻译：在日语中，这个名字大致翻译为：Satoshi：思维清晰、机敏、明智；Naka：内部或关系；Moto：基础![](img/image_rsrcUC.jpg)。我们将这些组合在一起，意味着与健全货币保持清晰的思维和明智的关系。这是一个新价值交换系统的基础。无论这个新技术奇迹的背后究竟是谁，比特币网络在
    2009 年首次上线，当时其源代码作为开源软件发布。比特币承诺比传统的在线支付机制具有低的交易手续费，并由去中心化机构运营，与政府发行的货币不同。没有物理形态的比特币，只有存储在云端公共账本上的余额——这些余额以及所有的比特币交易都通过海量的计算能力进行验证。比特币不由任何银行或政府发行或支持，单个比特币也不具备商品意义的价值。尽管它不是法定货币，比特币在人气上一直很高，并引发了数百种其他虚拟货币的诞生，这些统称为“山币”（Altcoins）。


    ## 了解比特币 ![](img/image_rsrcUD.jpg


    比特币是一种加密货币。比特币代币的余额使用公共和私“密钥”存储，这些密钥是通过创建它们时使用的数学加密算法连接的长数字和字母字符串。公钥（类似于银行账户号码）作为向世界公布的地址，其他人可以向其发送比特币。私钥（类似于
    ATM 密码）则被视为受保护的秘密，仅用于授权比特币交易。


    比特币密钥不应与比特币钱包混淆，钱包是一个物理或数字设备，用于便利比特币的交易并允许用户跟踪硬币的所有权。“钱包”一词有点误导性，因为比特币的去中心化特性意味着它从未存储“在”钱包中，而是去中心化地存储在区块链上。


    **样式说明：** 根据比特币基金会的说法，在指代该实体或概念时，“Bitcoin”的首字母大写，而在指代货币数量（例如“我交易了 20 bitcoin”）或单位本身时，则使用小写的“bitcoin”。复数形式可以是“bitcoin”或“bitcoins”。比特币也常简称为
    BTC。


    ## 比特币如何工作 ![](image_rsrcUE.jpg


    比特币是最独立运行的数字货币之一。拥有计算能力并运营网络的个人和实体（被称为“矿工”）其动力来自奖励（一个新的比特币区块）和以比特币支付的交易。这些可以被认为是维护网络安全的去中心化权威。新的比特币以固定的、周期性的速率分配给矿工，使得总供应量接近
    2100 万![](image_rsrcUF)。目前，有数百万比特币尚未被开采。通过这种方式，比特币（以及任何通过类似过程生成的加密货币）与法币不同；在中心化银行系统中，货币的分配速率与需求增长相匹配，而像比特币这样的去中心化系统则根据算法提前设定速率。


    比特币挖掘是分配比特币的过程。通常，挖矿需要解决计算困难的难题来发现新区块，并将其添加到区块链。在贡献区块链的过程中，挖矿添加并验证了整个网络的交易。为了向区块链添加区块，矿工将获得几个比特币形式的奖励；奖励每
    210,000 个区块减半。2009 年区块奖励为 50 个新比特币，目前为 12.5 个。随着越来越多的比特币被创建，挖矿过程的难度——即涉及的计算量——就会增加。挖矿难度从
    2009 年比特币诞生时的 1.0 开始；到年底仅为 1.18。截至 2019 年 10 月，挖矿难度已超过 12 万亿。曾经，普通的台式计算机就可以用于挖掘过程；现在，为了应对这种难度，矿工必须使用昂贵的复杂的专用集成电路（ASIC）和更先进的处理器，如图形处理器（GPU）。这些复杂的挖掘处理器被称为“矿机”。一个比特币可以细分为小数点后八位（一个比特币的亿分之一），这个最小单位被称为
    Satoshi。如果有必要，并且参与的矿工主张，比特币最终可以细分为更多的小数位。


