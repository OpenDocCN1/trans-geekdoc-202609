    a pool of cryptocurrencies that are vetted by financial professionals, just like
    your 401k accounts or index funds. "With our mobile app, we let you invest in
    cryptocurrencies or digital assets like Warren Buffet wants you to invest in stocks
    through the S&P 500. Warren Buffett, Ray Dalio, and even Tony Robbins in his book,
    Money Master Game, all recommend index investing. By investing in an index, the
    fees and risks are much lower, it''s tax-optimized, and you can typically outperform
    the market," Gujral said. The recommendation of investing in an index fund means
    you''re not putting "all your eggs in one basket" like many people did when they
    invested in a single coin or ICO and lost big when the cryptocurrency market deflated
    in 2018. Paul Veradittakit, a partner at Panther Capital, also recommends the
    concept of diversifying cryptocurrency investments: "I think if you''re an individual
    investor, it makes sense to try to diversify as much as possible just because
    there is a lot of risk in cryptocurrency and a lot of volatility, and you want
    to make sure that you have a basket of them and hopefully hit on one of the investments
    that will do very well." However, most people only have access to invest in crypto
    funds or indices if they are an accredited investor -- someone who makes over
    $200,000 for 2+ consecutive years and/or has $1 million of assets, not counting
    primary real estate. This means the novice or average person typically doesn''t
    have the ability to invest in a crypto fund. It is a major reason why Gujral founded
    Snowball and hopes his app will help democratize access to the best crypto fund
    and index strategies. He believes the average investor should be able to wisely
    invest in the cryptocurrency sector with less friction and reduced risk.


    ## 2. Invest Through Regulated Professionals


    Another challenge is finding those financial professionals who can effectively
    research and recommend a portfolio of cryptos that provide a steady return-on-investment
    (ROI) while minimizing your exposure to a bear -- or down -- market. There are
    a plethora of options when it comes to cryptocurrency apps and investment firms,
    but one of the differentiating factors investors should seek when working with
    financial professionals are those who earned Registered Investment Advisor (RIA)
    status by Securities Exchange Commission. According to it, "RIA have a fiduciary
    duty to their clients, which means they have a legal obligation to provide advice
    that always as clients'' best interest. As first word RIA are required to register
    with either Securities Exchange Commission (`SEC`) or state." This designation
    essentially means that RIA are not only regulated but also fully responsible for
    their investment advice and recommendations. "We’ve become a registered advisor
    or RIA, just like Horowitz announced require all of firms to have registered advisors,"
    said Gujral. "Since we are managing people and felt it was extremely to 1) have
    a stamp of approval that we are regulated and 2) have a set of rules regulating
    us. Now regulated by `SEC` and `FINRA`, and at some point in the horizon, we will
    also be regulated by FinCEN, but not yet." During an interview with Veraditt,
    whose firm funded over 100 crypto-related projects, I asked how important the
    RIA designation is for the future of industry. "I think it''s a big deal. I think
    it''s good that investors do whatever they can protect themselves with regulations.
    When you are managing others'' money, becoming an RIA with the `SEC` is a great
    way to provide credibility and have the right license to do what you want across
    asset management. Its why Panther became an RIA as well." As cryptocurrency ecosystem
    continues to evolve and become more complex, it will only become time-consuming
    and challenging to know which coins and tokens are worth buying and which ones
    to avoid like plague. Working with registered professionals may help save time
    and hopefully increase your odds of a profitable investment. A worthwhile resource
    is the SEC investor bulletins which provide a list of tips and questions to ask
    before selecting a financial professional as a service to investors.


    Regardless to ignorantly entrust your capital to any financial advisor, app, or
    crypto company without doing any of your own due diligence and research. After
    all, you''re ultimately responsible for the outcome of your decision. Gujral recommended
    Coinbase Earn as a good place to start for education. According to their site,
    Coinbase offers to pay people to learn about cryptocurrencies as people complete
    educational tasks like watching video lessons and completing quizzes. Their organization
    is a regulated broker-dealer, and according to Gujral, they received their RIA
    designation from the `SEC`. During an interview with Gray Bal, the CEO of Thought
    Resolution, I asked people should educate themselves.


    ## 3. Focus On Education And Wealth Accumulation


    In fact, Gujral is so bullish on the future of crypto that he plans to have Snowball
    among the first to integrate with Facebook''s Libra coin. In an email, Reese Jones,
    a venture strategist who serves as an advisor to both Facebook and Snowball stated,
    “Facebook’s Libra will introduce billions of people to digital crypto payments,
    and many of those people, of course, want to diversify their money investments
    into portfolios facilitated by Snowball.” As the industry continues to mature
    and grow, it may be wise to research and learn how to invest in the crypto markets
    intelligently. Investing in your financial education is usually profitable, and
    a conservative cryptocurrency strategy could pay big dividends in the long run.
    Even Yale suggests that investors should put up to six percent of their assets
    into cryptocurrencies. Bal concurs, "I would say, instead of focusing on the possibility
    of making massive amounts of returns, make it aligning with a project that speaks
    for the future of our race, our planet. Focus on the long game -- find the founders
    who have a mission, have multiple successes before and are already funded by the
    world. Play along them by investing in these deals." With major financial institutions
    and corporations like JPMorgan, USAA, Goldman Sachs and IBM backing crypto, as
    well as Facebook''s recent announcement of their own coin, it seems cryptocurrencies
    are here to stay.

