  mdcn: "\n\n架构。\n\n| 类型 | 对齐保证 |\n|---|---|\n| bool, uint8, int8 | 1 |\n| uint16,\
    \ int16 | 2 |\n| uint32, int32 | 4 |\n| float32, complex64 | 4 |\n| 数组 | 取决于元素类型\
    \ |\n| 结构体 | 取决于字段类型 |\n| 其他类型 | 原生字长（native word）的大小 |\n\nGo 规范规定：\n\n- 对于结构体类型的变量：`unsafe.Alignof(x)`\
    \ 是 x 每个字段 f 的 `unsafe.Alignof(x.f)` 值中的最大值，但至少为 1。\n- 对于数组类型的变量：`unsafe.Alignof(x)`\
    \ 与变量元素类型的对齐方式相同。\n\n官方 Go 编译器确保类型的大小是对齐保证的倍数。\n\n## 2.5 结构体填充 (Struct padding)\n\
    \n为了满足之前的对齐保证规则，Go 编译器可能会在结构体类型某些字段之后填充一些字节。填充后的值会被计入结构体的大小。结构体的大小可能不是其字段大小的简单和。\n\
    \n例如，以下代码所示的结构体类型在 64 位架构上的大小为 24。\n\n```go\ntype T1 struct {\n    a int\n   \
    \ // 这里填充了 7 字节\n    b int64\n    c int16\n    // 这里填充了 6 字节。\n}\n```\n\n其大小为\
    \ 24 的原因是：\n\n- 结构体类型的对齐保证与其字段中最大的对齐保证相同。这里是类型 `int64` 的对齐保证（8，一个原生字长）。这意味着结构体类型值中字段\
    \ b 和 a 之间的距离是 8 的倍数。聪明的编译器应该选择最小可能的值：8。为了得到所需的大小，在字段 a 之后填充了 7 字节。\n- 结构体类型的大小必须是该结构体对齐保证的倍数。考虑到字段\
    \ c 的存在，最小可能的大小是 24 (8x3)，聪明的编译器应该使用该大小。为了得到所需的大小，在字段 c 之后填充了 6 字节。\n\n结构体类型大小计算中的字段顺序。如果我们更改上述结构体类型字段\
    \ b 和 c 的大小，结构体的大小将变为 16。\n\n```go\ntype T2 struct {\n    a int\n    // 这里填充了\
    \ 1 字节\n    c int16\n    // 这里填充了 4 字节\n    b int64\n}\n```\n\n我们可以使用 `unsafe.Sizeof`\
    \ 函数来获取值/类型的大小。例如：\n\n```go\npackage main\nimport \"unsafe\"\n\ntype T1 struct\
    \ {\n    a int8\n    b int64\n    c int16\n}\n\ntype T2 struct {\n    a int8\n\
    \    c int16\n    b int64\n}\n\nfunc main(){\n    // 打印的值是在\n    // 64 位架构上获得的。\n\
    \    println(unsafe.Sizeof(T1())) // 24\n    println(unsafe.Sizeof(T2())) // 16\n\
    }\n```\n\n我们可以将填充字节视为一种内存浪费的形式，是程序性能、代码可读性和内存节省之间权衡的结果。\n\n在实践中，我们应该让相关字段相邻以获得良好的可读性，只有在确实需要时才以节省内存的方式排列字段。\n\
    \n## 2.6 值拷贝成本与小尺寸类型/值\n\n拷贝值的成本大约与该值的大小正比。在现实中，CPU 缓存、CPU 指令和编译器优化也会影响值的拷贝成本。\n\
    \n值拷贝操作通常发生在赋值赋值。下一节将列出更多的值拷贝操作。\n\n为了实现高执行性能，如果可能，我们应该尝试避免\n\n- 在循环中拷贝大量大尺寸的值。\n\
    - 拷贝大型数组和结构体。\n\n Go 中的某些类型属于小尺寸类型。它们的值被官方标准 Go 编译器经过特殊优化，使得拷贝成本始终很小。\n\n但什么是小尺寸类型呢？并没有正式的定义。事实上，定义取决于特定的\
    \ CPU 架构和编译器实现。在官方标准 Go 编译实现中，除了大尺寸结构体和数组类型，Go 中的所有其他类型都可以被视为小尺寸类型。\n\n什么是小尺寸结构体和数组值？同样没有正式定义。官方\
