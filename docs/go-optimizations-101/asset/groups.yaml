    \ `append` 用的第一个参数进行裁剪，尝试节省内存（并消耗更少的 CPU 资源）。\n\n一个示例：\n\n```go\npackage main\n\
    \nfunc main() {\n\tx := make([]byte, 100, 500)\n\ty := make([]byte, 500)\n\ta\
    \ := append(x, y...)\n\tb := append(x[:len(x):len(x)], y...)\n\tprintln(cap(a))\
