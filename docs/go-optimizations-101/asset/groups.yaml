    \ we know the call will allocate\n\nIf an append call allocates and there are\
    \ no more elements to be appended to the result slice, then it is best to clip\
    \ the first argument of the append call, to try to save memory (and consume less\
    \ CPU resources).\n\nAn example:\n\n```go\npackage main\n\nfunc main() {\n\tx\
    \ := make([]byte, 100, 500)\n\ty := make([]byte, 500)\n\ta := append(x, y...)\n\
    \tb := append(x[:len(x):len(x)], y...)\n\tprintln(cap(a)) // 1024\n\tprintln(cap(b))\
    \ // 640\n}\n```\n\nThe outputs shown as comments are for Go 1.17. For Go 1.18,\
    \ the above program prints:\n\n896\n640\n\nSurely, if we confidently know that\
    \ the free capacity of the first argument slice of an append call is enough to\
    \ hold all appended elements, then we should not clip the first argument.\n\n\
    ## 8.5 Grow slices (enlarge slice capacities)\n\nThere are two ways to grow the\
    \ capacity of a slice x to c if the backing array of the slice is needed to be\
    \ re-allocated in the growth.\n\n```go\n// way 1\nfunc Grow_MakeCopy(x []T, c\
    \ int) []T {\n    r := make([]T, c)\n    copy(r, x)\n    return r[:len(x)]\n}\n\
    ```\n\n```go\n// way 2\nfunc Grow_Online(x []T, c int) []T {\n    return append(x,\
    \ make([]T, c-len(x))...[:len(x)])\n}\n```\n\nBoth of the two ways are specially\
    \ optimized by the official Go compiler. As mentioned above, the make call in\
    \ way 1 doesn't reserve elements in r[:len(x)]. In way 2, the make doesn't allocate\
    \ allocations at all.\n\nIn theory, with the two optimizations, the ways have\
    \ comparable performance. But benchmark results show way 1 is a little more performant.\n\
    \nNote, before the official Go compiler implementation v1.20, the optimization\
    \ for 2 doesn't work if the type of the first argument of the append call is a\
    \ named type. For example, the following Grow_Online_Named function is much slower\
    \ than the above Grow_Online function.\n\n```go\ntype S []T\nfunc Grow_Oline_Named(x\
    \ []T, c int) []T {\n    return append(x, make(S, c-len(x))...[:len(x)]) // Fixed\
    \ missing bracket\n```\n\nThis flaw has been fixed since Go toolchain v1.20.\n\
    \n## 8.6 Try to grow a slice in one step\n\nAs mentioned, how slices grow in append\
    \ calls is implementation specific, which means the result of a slice growth is\
    \ unspecified by Go specification.\n\nIf we predict the max length of a slice\
    \ at coding time, we should allocate the slice with the max length as capacity,\
    \ to avoid some possible allocations caused by more slice growth.\n\nIf a slice\
    \ is short-lived, we could allocate it with an estimated large capacity. There\
    \ might be some memory wasted temporarily, but the element memory will be released\
    \ soon. Even there might still be several allocations saved.\n\n## 8.7 Clone slices\n\
    \nSince Go toolchain version 1.15, the most efficient way to clone a slice is\
    \ the make+copy way:\n\n```go\nsCloned := make([]T, len(s))\ncopy(sCloned, s)\n\
    ```\n\nFor many cases, the make+copy way is a little faster than the following\
    \ append way, because mentioned above, an append might allocate and zero some\
    \ extra elements.\n\n```go\nsCloned := append([]T(nil), s...)\n```\n\nFor example,\
    \ in the following, 8191 elements are allocated and zeroed.\n\n```go\nx := make([]byte,\
    \ 1<<15+1)\ny := append([]byte(nil), x...)\nprintln(cap(y) - len(x)) // 8191\n\
    ```\n\n## 8.8 Merge two slices\n\nThere is not a universally perfect way to merge\
    \ two slices into a new slice."
  mdcn: "\nGo 1.18+ 中的新算法分配的内存通常比 Go 1.17 中的旧算法少。\n\n请注意，每次切片扩容都需要一次内存分配。因此在编程中我们应该尽量减少切片扩容的次数。\n\
    \n`copy` 和 `append` 函数之间（直到 Go 工具链 1.21）另一个细微区别是：`copy` 函数在检测到两个切片的第一个元素地址相同时将不会复制元素，而\
    \ `append` 函数会进行此类检测。\n这意味着，在下面的代码中，`copy` 调用比 `append` 调用效率高得多。\n\n```go\nvar\
    \ x = make([]T, 10000)\ncopy(x, x)\nx = append(x[:], y...)\n```\n\n演示这种差异的一个具体示例是下面所示两个\
    \ `DeleteSliceElements` 函数；当 `len == j` 时，使用 `copy` 的版本比使用 `append` 的版本性能得多。\n\
    \n```go\nfunc DeleteSliceElements(s []T, i, j int) []T {\n\ts = s[i:j] // 边界检查\n\
