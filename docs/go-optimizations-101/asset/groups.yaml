    \nconst N = 1000\ntype T struct {\n x int\n}\n//go:noinline\nfunc f(t *T) {\n\
    \ t.x = 0\n for i := 0; i < N; i++ {\n t.x += i\n}\n}\n//go:noinline\nfunc g(t\
    \ *T) {\n var x = 0\n for i := 0; i < N; i++ {\n x += 1\n}\n t.x = x\n}\n```\n\
    \n```go\nvar t = &T{}\n\nfunc Benchmark_f(b *testing.B) {\n    for i := 0; i <\
    \ b.N; i++ {\n        f(t)\n    }\n}\n\nfunc Benchmark_g(b *testing.B) {\n   \
    \ for i := 0; i < b.N; i++ {\n        g(t)\n    }\n}\n```\n\n基准测试结果：\nBenchmark_f-4\
    \    2402 ns/op\nBenchmark_g-4    461.3 ns/op\n\n函数 `g` 使用局部变量 `x` 来存储总和，并在最后将总和赋值给结构体字段。官方\
    \ Go 编译器足够智能，仅为函数 `g` 的循环生成寄存器处理汇编指令。\n\n函数 `f` 实际上等同于下面声明的函数 `h`。\n\n```go\n\
    //go:noinline\nfunc h(t *T) {\n    x := &t.x\n    for i := 0; i < N; i++ {\n \
    \       *x += 1\n    }\n}\n```\n\n因此，这里引入的建议实际上等于上一章引入的建议（避免在循环中进行不必要的指针解引用）。\n\
    \n## 7.2 小尺寸结构体经过特殊优化\n\n这在值拷贝成本以及小尺寸类型/值中讨论过。\n\n## 7.3 通过调整字段顺序来缩小结构体体积\n\n\
    结构体的字段顺序可能会影响结构体的大小，这在之前的章节提到过。\n\n# 第 8 章\n\n# 数组与切片 (Arrays and Slices)\n\n\
    ## 8.1 避免使用大数组类型的字面量作为比较操作数\n\n例如，在下面的代码中，函数 `CompareWithGlobalVar` 优优函数 `CompareWithLiteral`（针对官方\
    \ Go 编译器 v1.21）。\n\n```go\npackage arrays\n\nimport \"testing\"\n\ntype T [1000]byte\n\
    \nvar zero = T{}\n\nfunc CompareWithLiteral(t *T) bool {\n\treturn *t == T{}\n\
    }\n\nfunc CompareWithGlobalVar(t *T) bool {\n\treturn *t == zero\n}\n\nvar x T\n\
    var r bool\n\nfunc Benchmark_CompareWithLiteral(b *testing.B) {\n\tfor i := 0;\
    \ i < b.N; i++ {\n\t\tr = CompareWithLiteral(&x)\n\t}\n}\n\nfunc Benchmark_CompareWithGlobalVar(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tr = CompareWithGlobalVar(&x)\n\
    \t}\n}\n```\n\n```go\n}\n```\n\n基准测试结果：\nBenchmark_CompareWithLiteral-4 21214032\
    \ 52.18 ns/op\nBenchmark_CompareWithGlobalVar-4 36417091 31.03 ns/op\n\n通过使用 `-S`\
    \ ，我们可以发现编译器为函数 `CompareWithGlobalVar` 生成的指令比函数 `Literal` 少。这就是为什么 `CompareWithGlobalVar`\
    \ 性能更好。对于小数组，两者的性能差异很小。请注意，未来的编译器版本可能会进行改进以消除两者之间的性能差异。\n\n## 8.2 使用 Go 1.17 引入的切片转指针转换\n\
    \nGo 1.17 引入了切片到指针的转换。我们可以使用多种转换来拷贝切片。发现，在任何平台上，如果被拷贝切片的元素大于 64，转换方式的性能优于内置的 `copy`\
    \ 函数。\n\n```go\npackage arrays\n\nimport \"testing\"\n\nconst N = 64\n\nvar r\
    \ []byte\nvar s = make([]byte, N)\n\nfunc init() {\n\tprintln(\"=========\", N)\n\
    \tr = make([]byte, N)\n}\n\nfunc copy2(d []byte, s []byte) {\n\t*([N]byte)(d)\
