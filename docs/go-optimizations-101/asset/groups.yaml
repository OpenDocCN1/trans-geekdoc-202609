    \ {\n    for i := range t.a {\n        t.a[i] = i\n    }\n}\n```\n\nTo move nil\
    \ array pointer checks out of the loop, should copy the array field to a local\
    \ variable, then adopt the trick above:\n\n```go\n//go:noinline\nfunc f1(t *T)\
    \ {\n    a := *t.a\n    for i := range a {\n        a[i] = i\n    }\n}\n```\n\n\
    Or simply derive a slice from array pointer:\n\n```go\n//go:noinline\nfunc f2(t\
    \ *T) {\n    a := t.a[:]\n    for i := range a {\n        a[i] = i\n    }\n}\n\
