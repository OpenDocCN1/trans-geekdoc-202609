    \ function will become inline-able ready. Here, for demo purpose, we use two place\
    \ for loops.\n\n## 13.1.6 Manual inlining is often more performance than auto-inlining\n\
    \nAn example:\n\n```go\npackage functions\n\nimport \"testing\"\n\nconst N = 100\n\
    \n// This function is inline-able.\nfunc Slice2Array(b []byte) [N]byte {\n\treturn\
    \ *(*[N]byte)(b)\n}\n\n//==================================\n```\n\n```go\nvar\
    \ buf = make([]byte, 8192)\nvar r [128]byte\n\nfunc Benchmark_ManualInline(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ {\n\t\tr[i&127] = *(*[N]byte)(buf)\n\t}\n}\n\n\
    func Benchmark_AutoInline(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\t\
    r[i&127] = Slice2Array(buf) // inlined\n\t}\n}\n```\n\nThe benchmark results:\n\
    Benchmark_ManualInline-4 5.134 ns/op\nBenchmark_AutoInline-4 11.49 ns/op\n\nFrom\
    \ the results, we could find that manual-inlining is more performance than auto-inlining,\
    \ least for this specified case.\n\nThe official standard Go compiler will be\
    \ improved in future versions so that automatic inlining will become smart.\n\n\
    ## 13.1.7 Inlining might do negative impact on performance\n\nFor some compiler\
    \ implementation flaws, sometimes, inlined calls might perform worse than non-inlined\
    \ ones. Here is an example:\n\n```go\npackage functions\n\nimport \"testing\"\n\
    \ntype T [8]byte\n\nvar r, s T\n\n//noinline\nfunc not_inline_able(x1, y1 *T)\
    \ {\n\tx, y := x1[:], y1[:]\n\tfor k := 0; k < len(T); k++ {\n\t\tx[k] = y[k]\n\
    \t}\n}\n\nfunc inline_able(x1, y1 *T) {\n\tx, y := x1[:], y1[:]\n\tfor k := 0;\
    \ k < len(T); k++ {\n\t\tx[k] = y[k]\n\t}\n}\n\nfunc Benchmark_not_inlined(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ {\n\t\tnot_inline_able(&r, &s)\n\t}\n}\n\nfunc\
    \ Benchmark_auto_inlined(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tinline_able(&r,\
    \ &s)\n\t}\n}\n\nfunc Benchmark_manual_inlined(b *testing.B) {\n\tfor i := 0;\
    \ i < b.N; i++ {\n\t\tfor k := 0; k < len(T); k++ {\n\t\t\tr[k] = s[k]\n\t\t}\n\
    \t}\n}\n```\n\nThe benchmark results:\nBenchmark_not_inlined-4 127.9 ns/op\nBenchmark_auto_inlined-4\
    \ 196.4 ns/op\nBenchmark_manual_inlined-4 196.4 ns/op\n\nThe implementation flaw\
    \ (the official Go compiler v1.21) presents the manual. Future compiler versions\
    \ might fix the flaw.\n\n## 13.2 Pointer parameters/results vs. non-pointer parameters/results\n\
    \nArguments and return values of functions are passed by copy in Go. Large-size\
    \ types cause copy costs. To avoid high copy costs caused by large-size type T,\
    \ we could use pointer type instead. However, please note that pointer parameters/results\
    \ have their own drawbacks. Pointer/result types also increase the possibility\
    \ of stack growing. For some scenarios, they might cause more heap allocations.\
    \ The following code shows the effect of copy costs.\n\n```go\npackage functions\n\
    \nimport \"testing\"\n\ntype T5 struct{ a, b, c, d, e float32 }\n\n//noinline\n\
    func Add5_TT(x, y T5) (z T5) {\n\t\tz.a = x.a + y.a\n\tz.b = x.b + y.b\n\tz.c\
    \ = x.c + y.c\n\tz.d = x.d + y.d\n\tz.e = x.e + y.e\n\treturn\n}\n\n//noinline\n\
    func Add5_PPP(z *T5, y *T5) {\n\tz.a = x.a + y.a\n\tz.b = x.b + y.b\n\tz.c = x.c\
    \ + y.c\n\tz.d = x.d + y.d\n\tz.e = x.e + y.e\n}\n```\n\n```go\nfunc Benchmark_Add5_TT(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tvar x, y T5\n\t\tAdd5_TT(x,\
    \ y)\n\t}\n}\n\nfunc Benchmark_Add5_PPP(b *testing.B) {\n\tfor i := 0; i < b.N;\
    \ i++ {\n\t\tvar x, y T5\n\t\tAdd5_PPP(&x, &y)\n\t}\n}\n```\n\nThe benchmark results:\n\
    | Benchmark_Add5_TT | 17.73 ns/op |\n| Benchmark_Add5_PPP | 11.95 ns/op |\n\n\
    From the above results, we get that the function Add5_PPP is more efficient than\
    \ the function Add5_TT. For small-size types, the benchmarks invert. The reason\
    \ is the official standard compiler optimizes some operations on small-size values.\n\
    \n## 13.3 Named results vs. anonymous results\n\nIt is often said that generally\
    \ named results make function more performant. This is true for many cases, but\
    \ not for some ones. For example, in the following two CopyToArray implementations,\
    \ the one with a named result is slower than the one with an anonymous result.\n\
    \n```go\npackage functions\n\nimport \"testing\"\n\nconst N = 1<<12\nvar buf =\
    \ make([]byte, N)\nvar r = [128][N]byte\n\nfunc Benchmark_CopyToArray_Named(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tr[i&127] = CopyToArray_Named(buf)\n\
    \t}\n}\n\nfunc Benchmark_CopyToArray_Unnamed(b *testing.B) {\n\tfor i := 0; i\
    \ < b.N; i++ {\n\t\tr[i&127] = CopyToArray_Unnamed(buf)\n\t}\n}\n\nfunc CopyToArray_Named(b\
    \ []byte) (ret [N]byte) {\n\t// if b == nil { defer print() }\n\tcopy(ret[:],\
    \ b)\n\treturn ret\n}\n\nfunc CopyToArray_Unnamed(b []byte) [N]byte {\n\t// if\
    \ b == nil { defer print() }\n\tvar ret [N]byte\n\tcopy(ret[:], b)\n\treturn ret\n\
    }\n```\n\nThe benchmark result:\nBenchmark_CopyToArray_Named-4 408.3 ns/op\nBenchmark_CopyToArray_Unnamed-4\
    \ 547.5 ns/op\n"
