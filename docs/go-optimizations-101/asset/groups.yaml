    s = s[:index+1]\n}\n\nfunc flb(s []byte, index int) {\n\ts = s[index-1] = 'a'\
    \ // line 12: Found IsInIndex\n\ts = s[:index]\n}\n```\n\n```go\nfunc fic(a [5]int)\
    \ {\n    _ = a[0]\n    _ = a[4]\n}\n```\n\n```go\nfunc fid(s []int) {\n    if\
    \ len(s) > 2 {\n        _, _, _ = s[0], s[1], s[2]\n    }\n}\n```\n\n```go\nfunc\
