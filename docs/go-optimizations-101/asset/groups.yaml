    \   m[99] += 1\n    }\n}\n\nfunc Benchmark_addition(b *testing.B) {\n    for i\
    \ := 0; i < b.N; i++ {\n        m[99] = m[99] + 1\n    }\n}\n```\n\n基准测试结果：\n\n\
    | Benchmark | Result |\n| :--- | :--- |\n| Benchmark_increment-4 | 11.31 ns/op\
    \ |\n| Benchmark_plusone-4 | 11.21 ns/op |\n| Benchmark_addition-4 | 16.10 ns/op\
    \ |\n\n# 11.3 map 中的指针\n\n如果 map 的 key 和元素类型不包含指针，那么在 GC 周期的扫描阶段，垃圾回收器将不会扫描 map\
    \ 的项。这可以节省大量时间。这个提示也适用于 Go 中其他类型的容器，如切片（slices）、数组和通道（channels）。\n\n# 11.4 使用字节数组代替短字符串作为\
    \ key\n\n在内部，每个字符串都包含一个指针，该指针指向字符串的底层字节。因此，如果 map 的 key 或元素类型是字符串，那么在 GC 周期中需要扫描\
    \ map 的所有条目。\n\n如果我们能让 map 条目使用的字符串值具有一个最大长度，且该最大长度较小，那么我们可以使用数组 `[N] byte` 来代替字符串类型（其中\
    \ N 是最大长度）。如果 map 中的条目数量很大，这样做将节省大量的垃圾回收扫描时间。\n\n例如，在下面的代码中，`mapB` 的条目不包含指针，而\
    \ `map` 的（字符串）key 包含指针。垃圾回收器将在 GC 周期的扫描阶段跳过 `mapB`。\n\n```go\nvar mapA = make(map[string]int,\
