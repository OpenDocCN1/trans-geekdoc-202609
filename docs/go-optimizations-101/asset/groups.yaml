  mdcn: "\n\n# 11.2 aMap[key]++ 比 aMap[key] = aMap[key] + 1 效率高\n\n在语句 `aMap[key]\
    \ = aMap[key] + 1` 中，key 被哈希了两次，但在语句 `aMap[key]++` 中，它只被哈希了一次。\n\n同样地，`aMap[key]\
    \ += value` 比 `aMap[key] = aMap[key] + value` 更高效。\n\n可以通过以下基准测试代码证明这一点：\n\n```go\n\
    package maps\n\nimport \"testing\"\n\nvar m = map[int]int()\n\nfunc Benchmark_increment(b\
    \ *testing.B) {\n    for i := 0; i < b.N; i++ {\n        m[99]++\n    }\n}\n\n\
