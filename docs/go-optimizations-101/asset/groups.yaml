    \ i++ {\n\t\tr = [1]func(){}{}\n\t}\n}\n```\n\n基准测试结果：\n\n| Benchmark | ns/op\
    \ | B/op | allocs/op |\n|---|---|---|---|\n| Benchmark_SmallInt32Field-4 | 3.387\
    \ ns/op | 0 B/op | 0 allocs/op |\n| Benchmark_ZeroFloat64Element-4 | 3.584 ns/op\
    \ | 0 B/op | 0 allocs/op |\n| Benchmark_BlankStringField-4 | 3.528 ns/op | 0 B/op\
    \ | 0 allocs/op |\n| Benchmark_NilSliceField-4 | 3.931 ns/op | 0 B/op | 0 allocs/op\
    \ |\n| Benchmark_NilFunctionElement-4 | 1.134 ns/op | 0 B/op | 0 allocs/op |\n\
    \n基于基准测试结果的总结（截至 Go v1.21）：\n\n- 指针值的装箱比非指针值的装箱快得多。\n- map、通道和函数的装箱与指针值一样快。\n\
    - 常量值的装箱与指针值一样快。\n- 固定大小值的装箱与指针值一样快。\n- 任意整数类型（8 位除外）的非常量小值（[0, 255] 之间）装箱比指针值慢约\
    \ 3 倍。\n- 浮点/字符串/切片零值的装箱比指针值慢约 3 倍。\n\n- 非常量小整数值（超出 [0, 255] 范围）或非零浮点值的装箱比指针值慢约\
    \ 20 倍或更多。\n- 非空切片或非空非常量字符串值的装箱比指针值慢约 50 倍或更多。\n- 只有一个字段（元素）的结构体（数组）的小整数或零布尔/数值/字符串/切片/指针值与装箱该字段（元素）一样快。\n\
    \n因此，如果在代码执行的热点路径上进行了值装箱分配，建议装箱成本较小的值。\n\n## 14.2 尝试通过将接口赋值给接口来消除内存分配\n\n有时，我们需要在接口值中装箱非接口值。有两种方法实现此目标：\n\
    \n1. 在第一个接口值中装箱非接口值，然后在第二个中装箱非接口值。\n2. 在第一个接口值中装箱非接口值，然后将第一个赋值给第二个。\n\n如果装箱值需要分配，哪种性能更优？毫无疑问，可以通过下面的基准测试代码证明。\n\
    \n```go\npackage main\n\nimport \"testing\"\n\nvar v = 9999999\nvar x, y interface{}\n\
    \nfunc Benchmark_Box(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tx = v\
    \ // 需要一次分配\n\t\ty = v // 需要一次分配\n\t}\n}\n\nfunc Benchmark_BoxAssign(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ {\n\t\tx = v // 需要一次分配\n\t\ty = v // 无分配\n\t}\n\
    }\n```\n\n基准测试结果：\n\n| Benchmark_Box-4 130.5 ns/op 16 B/op 2 allocs/op |\n| Benchmark_BoxAssign-4\
    \ 68.31 ns/op 8 B/op 1 allocs/op |\n\n第二种方法节省了一次分配，因此性能更优。\n\n在实践中，当同一个非接口值传递给\
    \ `fmt` 标准包提供的打印函数（这些函数的参数大部分类型为 interface{}）时，可以使用该提示。\n"
