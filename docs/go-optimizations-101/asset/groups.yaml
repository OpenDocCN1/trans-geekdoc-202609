    \ |\n| Benchmark_B-4 | 1543 ns/op | 0 B/op | 0 allocs/op |\n| Benchmark_C-4 |\
    \ 1609 ns/op | 0 B/op | 0 allocs/op |\n\nFrom a short-period view, the C way is\
