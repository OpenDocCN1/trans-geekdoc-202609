    }\n```\n\nWe can view the padding bytes as a form of memory wasting, a trade-off\
    \ result between program performance, code readability and memory saving.\n\n\
    In practice, we should make related fields adjacent to get good readability, and\
    \ only order fields in the memory saving way when it really needs.\n\n## 2.6 Value\
    \ copy costs and small-size types/values\n\nThe cost of copying a value is approximately\
