  mdcn: "\n\n## 5.10 使用 Go 工具链 v1.19 引入的内存限制策略避免频繁的 GC 循环\n\nGo 标准编译器 v1.19 引入了一种新的调度策略：内存限制策略。该策略可以通过\
    \ `GOMEMLIMIT` 环境变量或 `runtime/debug.MemoryLimit` 函数进行配置。此内存限制设置了 Go 运行时使用的内存上限。换句话说，如果\
    \ Go 使用的内存总量（近似）超过了限制，当限制不再被超过时，将启动新的垃圾回收过程。内存限制的默认值为 `MaxInt64`，这实际上是禁用了该策略。\n\
    \n`GOMEMLIMIT` 环境变量可以有一个可选单位。支持的后缀包括 B、KIB、MIB、GiB 和 TiB。没有单位的值表示 B（字节）。内存限制和新的堆内存百分比策略可能会相互影响。为了演示目的，让我们禁用新的堆内存百分比策略并启用内存限制策略，以运行上面的\
    \ `gctrace` 示例。否则，`GOMEMLIMIT` 环境变量将无法被识别，因此自动垃圾回收将被关闭。\n\n```\n$ go version 1.19\n\
    GOMEMLIMIT=157MiB GODEBUG=gctrace=i go run gctrace\ngc 1 0.283s 1%: 153->156 MB\
    \ 157 MB goal, ...\ngc 2 0.784s 1%: 151->152 MB 155 MB goal, ...\ngc 3 1.445s\
    \ 1%: 149->151 MB 152 MB goal, ...\ngc 4 2.113s 1%: 148->150 MB 152 MB goal, ...\n\
    gc 5 2.765s 1%: 148->150 MB 152 MB goal, ...\ngc 6 3.394s 1%: 147->150 MB 152\
    \ MB goal, ...\ngc 7 4.006s 1%: 147->147 MB 152 MB goal, ...\ngc 8 4.653s 1%:\
    \ 147->147 MB 152 MB goal, ...\ngc 9 5.326s 1%: 148->152 MB 152 MB goal, ...\n\
    gc 10 6.007s 1%: 148->149 MB 152 MB goal, ...\n```\n\n从输出中可以看出，内存限制策略还可以让 GC 间隔变得大得多且交错分布。\n\
    \n内存限制策略的目标之一是提供一种官方方法来替代内存气球（memory ballast）技巧。对于 Go 程序，如果合理设置了内存限制值，就能实现该目标。然而，有时很难为内存限制选择一个合适的值。如果该值小于\
    \ Go 程序实际需要的内存量，GC 循环将频繁启动。与上述所示的内存气球方案相比，这是一个缺点。请阅读关于使用内存限制策略的建议（其中包含了一篇理解 Go\
    \ 垃圾回收的优秀文章）。\n\n## 第 6 章\n\n## 指针\n\n## 6.1 避免在循环中进行不 nil 数组指针检查\n\n当前的官方标准 Go\
    \ 编译器实现（v1.21.n）中存在一些缺陷。其中之一是某些 nil 数组指针检查没有移动到循环之外。这里有一个示例展示了这一缺陷。\n\n```go\n\
    // unnecessary-checks.go\npackage pointers\nimport \"testing\"\nconst N = 1000\n\
    var a [N]int\n//go:noinline\nfunc g0(a [N]int) {\n    for i := range a {\n   \
    \     a[i] = i // line 12\n    }\n}\n//go:noinline\nfunc g1(a [N]int) {\n    _\
    \ = a // line 18\n    for i := range a {\n        a[i] = i // line 20\n    }\n\
    }\nfunc Benchmark_g0(b *testing.B) {\n    for i := 0; i < b.N; i++ { g0(&a) }\n\
    }\n\nfunc Benchmark_g1(b *testing.B) {\n    for i := 0; i < b.N; i++ { g1(&a)\
    \ }\n}\n```\n\n让我们使用 `-S` 编译器选项运行基测试，得到了以下输出（省略了无关文本）：\n\n$ go test -bench -gcflags=-S\
    \ unnecessary-checks.go\n\n```\n00004 00004 (unnecessary-checks.go:12) TESTB AL,\
    \ (AX)\n00006 00006 (unnecessary-checks.go:12) MOVQ CX, (AX)(CX*8)\n...\n00000\
    \ 00000 (unnecessary-checks.go:18) TESTB AL, (AX)\n00002 00002 (unnecessary-checks.go:18)\
    \ XORL CX, CX\n00004 00004 (unnecessary-checks.go:19) BMP 13\n00006 00006 (unnecessary-checks.go:20)\
    \ MOVQ CX, (AX)(CX*8)\n```\n\nBenchmark_g0-4 494.8 ns/op\nBenchmark_g1-4 399.3\
    \ ns/op\n\n从输出中我们可以发现 `g1` 的实现比 `g0` 的实现性能更好，即使它多了一行（第18行）。为什么？答案在汇编输出中。在 `g0`\
    \ 的实现中，`TESTB` 指令是在循环内生成的，而在 `g1` 的实现中，`TESTB` 指是在循环外生成的。循环用于检查参数是否为 nil 指针。对于这种这种情况，检查一次可以避免编译器实现中的缺陷。还有第三种实现性能与\
    \ `g1` 实现一样快。第三种实现使用了从数组指针派生的切片。\n\n```go\n//go:noinline\nfunc g2(x *[N]int) {\n\
