    \nif condition {\n    counter++\n} else {\n    counter--\n}\n\nif condition {\n\
    \    f()\n} else {\n    g()\n}\n```\n\ncould be replaced with:\n\n```go\n// Package-level\
    \ maps.\nvar boolToInt = map[bool]int{true: 1, false: 0}\nvar boolFunc = map[bool]func(){true:\
    \ f, false: g}\n\n// Within a function ...\nvar condition bool\ncondition = evaluateCondition()\n\
    \ncounter += boolToInt[condition]\n\nboolFunc[condition]()\n```\n\nIf there are\
    \ many identical if-else blocks used in code, using maps with bool keys will reduce\
    \ many boilerplate and make code look much cleaner. For most cases, this is generally\
    \ good. However, of Go toolchain v1.21, the map way is not very efficient from\
