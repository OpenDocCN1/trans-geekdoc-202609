  md: "\n# Chapter 12\n\n## Channels\n\n## 12.1 Programming with channels is fun but\
    \ channels are not the most performant way for some cases\n\nThe channel might\
    \ be fun to use, but it is not the most efficient way for some scenarios. In the\
    \ current official standard Go compiler implementation (version 1.21), channels\
    \ are slower than the other synchronization ways. This could be proved by the\
    \ following benchmark code.\n\n```go\npackage channels\n\nimport (\n  \"sync\"\
    \n  \"sync/atomic\"\n  \"testing\"\n)\n\nvar g int32\n\nfunc Benchmark_NoSync(b\
    \ *testing.B) {\n  for i := 0; i < b.N; i++ {\n    g++\n  }\n}\n\nfunc Benchmark_Atomic(b\
    \ *testing.B) {\n  for i := 0; i < b.N; i++ {\n    atomic.AddInt32(&g, 1)\n  }\n\
    }\n\nvar m sync.Mutex\n\nfunc Benchmark_Mutex(b *testing.B) {\n  for i := 0; i\
    \ < b.N; i++ {\n    m.Lock()\n    g++\n    m.Unlock()\n  }\n}\n\nvar ch = make(chan\
    \ struct{}, 1)\nfunc Benchmark_Channel(b *testing.B) {\n    for i := 0; i < b.N;\
    \ i++ {\n        ch <- struct{}\n        g++\n        <-ch\n    }\n}\n```\n\n\
    The benchmark results:\n\n| Benchmark_NoSync-4 | 2.246 ns/op |\n| Benchmark_Atomic-4\
    \ | 7.112 ns/op |\n| Benchmark_Mutex-4 | 14.25 ns/op |\n| Benchmark_Channel-4\
    \ | 61.44 ns/op |\n\nFrom the results, we could find that using channels to concurrently\
    \ increase a value is much slower than the other synchronization ways. The atomic\
    \ way is the best.\n\nIf it is possible, we should try not to share a value between\
    \ multiple goroutines, so that we don't need synchronizations for all the value.\n\
    \n## 12.2 Use one channel instead of several ones to avoid using select blocks\n\
    \nFor a select code block, the more case branches are in it, the more CPU consuming\
    \ the code block is. This could be proved by the following benchmark code.\n\n\
    ```go\npackage channels\n\nimport \"testing\"\n\nvar ch1 = make(chan struct{},\
    \ 1)\nvar ch2 = make(chan struct{}, 1)\n\nfunc Benchmark_Select_OneCase(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        select {\n        case ch1 <- struct{}:\n\
    \            <-ch1\n        }\n    }\n}\n\nfunc Benchmark_Select_TwoCases(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        select {\n        case ch1 <- struct{}:\n\
    \            <-ch1\n        case ch2 <- struct{}:\n            <-ch2\n       \
    \ }\n    }\n}\n```\n\nThe benchmark results:\n\nBenchmark_Select_OneCase-4 58.90\
    \ ns/op\nBenchmark_Select_TwoCases-4 115.3 ns/op\n\nSo we should try to limit\
    \ the number of case branches within a select code block.\n\nThe official standard\
    \ Go compiler treats a select code block with only one case branch (and without\
    \ default branch) as a simple general channel.\n\nFor some cases, we merge multiple\
    \ channels as, to avoid the performance loss on executing multi-case select code\
    \ blocks. We could use an interface type or a struct as the channel element type\
