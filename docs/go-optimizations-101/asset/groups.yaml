    \ 版本，最后拷贝发生在拷贝 9 元素数组和拷贝 10 元素数组之间（元素大小为一个原生字长）。类似的情况是拷贝 9 字段结构体和拷贝 10 字段结构体（每个字段的大小为一个原生字长）。\n\
    \n证明如下：\n\n```go\npackage copy\n\nimport \"testing\"\n\nconst N = 1024\ntype Element\
