    \ ns/op\nBenchmark_f2-4 511.3 ns/op\nBenchmark_f3-4 390.1 ns/op\nBenchmark_f4-4\
    \ 387.6 ns/op\n\nThe results verify our previous conclusions. Note, f2 function\
    \ mentioned in the benchmark results is declared as:\n\n```go\n//go:noinline\n\
    func f2(t *T) {\n    a := *t.a\n    for i := range a {\n        a[i] = i\n   \
    \ }\n}\n```\n\nThe f2 implementation is not as fast as f3 and f4 implementations,\
    \ but it is faster than f0 and f1 implementations. However, that is another story.\
    \ If the elements of an array field are not modified (only read) in the loop,\
    \ then the f1 way is as performant as f3 and f4 way. Personally, for most cases,\
    \ I think we should try to use the slice (the f4 way) to get the best performance,\
