  - '[PAGE 22]


    # Chapter 3


    # Memory Allocations


    # 3.1 Memory Allocation units


    The basic memory allocation units are called memory blocks. A memory block is
    a continuous memory segment. As aforementioned, at run time, a value part is carried
    on a single memory block.


    A single memory block might carry multiple value parts. The size of a memory block
    must not be smaller than the size of any value part it carries.


    When a memory block is carrying a value part, we may say it is referencing the
    memory block.


    Memory allocation operations will consume CPU resources to find the suitable memory
    blocks. So the more memory blocks are created (for memory allocations), the more
    CPU resources are consumed. In programming, we should try to avoid unnecessary
    memory allocations to get better code execution performances.


    # 3.2 Memory allocation places


    Go runtime might find a memory block on the stack (one kind of memory zone) of
    a goroutine or the heap (the other kind of memory zone) of the whole program to
    carry some value parts. The finding-out process is called a (memory) allocation.


    The memory management manners of stack and heap are quite different. For most
    cases, finding a block on stack is much cheaper than on heap.


    Collecting stack memory blocks is much cheaper than collecting heap memory blocks.
    In fact, stack memory blocks don''t need to be collected. The stack of a goroutine
    could be actually viewed as a single memory block, and it will be collected when
    the goroutine exits.


    On the other hand, when all value parts being carried on/by a heap are not used
    any more (in other words, no alive value part is still referencing the memory
    block), the memory block will be viewed as garbage and automatically collected
    eventually, during runtime garbage collection cycles, which might consume certain
    CPU resources (garbage collection) will be talked in detail in a later chapter).
    Generally, the more memory blocks are allocated on heap, the larger pressure is
    made for garbage collection.'
  - '[PAGE 23]


    As heap allocations are much more expensive, only heap memory allocations contribute
    to the allocation metrics in Go code benchmark results. But please note that allocating
    on stack still has a cost, though it is often comparatively much smaller.


    The escape analysis module of a Go compiler could detect some value parts will
    be only used by one goroutine and try to let those value parts allocated on stack
    at run time if certain extra conditions are satisfied. Memory allocations and
    escape analysis will be explained with more details in the next chapter.


    # 3.3 Memory allocation scenarios


    Generally, each of the following operations will make at least one allocation.


    +   * declare variables

    * call the built-in new function.

    * call the built-in make function.

    * modify slices and maps with composite literals.

    * convert integers to strings.

    * concatenate strings by using +.

    * convert between strings by byte slices, and vice versa.

    * convert strings to runes.

    * box values into interfaces (converting non-interface values into interfaces).

    * append elements to a slice and the capacity of the slice is not large enough.

    * put new entries into maps and the underlying array (to store entries) of map
    is not large enough to store the new.


    However, the official Go compiler makes some special code optimizations so that
    certain cases, some of the above listed operations will not make allocations.
    These optimizations will be introduced later in this book.


    # 3.4 Memory wasting caused by allocated memory blocks larger than needed


    The sizes of different memory blocks might be different. But they are not arbitrary.
    In the official Go runtime implementation, for memory blocks allocated on heap,


    +   * some memory block size classes (no more than 32768 bytes) are predefined.
    As of the official Go compiler version 1.21.x, the smallest size classes are 8,
    16, 24, 32, 48, 64, 80 and 96 bytes.

    * For memory blocks larger than 32768 bytes, each of them is always composed of
    multiple memory pages. The memory page size used by the official Go runtime (1.21
    versions) is 8192 bytes.


    So,


    +   * allocate a byte (heap) memory block for the value which size is in the range
    [33, 48], the size of the memory block is general (must be at least 48). In other
    words, there might be up to 5 bytes wasted (if the value size is 33).

    * create a byte slice with 32769 elements on heap, the size of the memory block
    carrying the elements of the slice is 40960 (32768 + 8192, 5 memory pages). In
    other words, 8191 bytes are wasted.'
