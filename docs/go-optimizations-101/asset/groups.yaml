    # 5.6 Try to generate less short-lived memory blocks to lower atomic frequency


    In practice, most garbage come from short-lived temporary value parts. Such short-lived
    value parts are often allocated in the following scenarios:


    +   - concatenation. Many concatenated result strings are passed as arguments
    of some function calls, then they will be discarded immediately. For some cases,
    to produce the final strings, many intermediate temporary strings are created.

    - conversion between string and byte slice. The conversion results will be used
    then discarded soon. For safety, such a conversion duplicate the underlying bytes.
    A memory block allocation is needed for the duplication.

    - box non-interface value into interfaces. The interfaces will be used then discarded
    soon.

    Most value operations need one allocation.


    There are some other scenarios in which short-lived value parts will be generated.


    In programming, we will to generate less short-lived value parts to lower automatic
    GC frequency.


    # 5.7 Use new heap memory percentage strategy to control automatic GC frequency


    The value parts that contain pointers and are known clearly by Go runtime are
    called (scannable) root value parts (call roots below). Roots mainly come from
    the value parts allocated'
