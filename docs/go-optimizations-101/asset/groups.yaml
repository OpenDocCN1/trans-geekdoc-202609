    \ *testing.B) {\n\tvar x = make(chan interface{})\n\tgo func() { for { x <- i\
    \ } }()\n\tgo func() { for { x <- \"hello\" } }\n\tb.ResetTimer()\n\tfor i :=\
    \ 0; i < b.N; i++ {\n\t\tselect {\n\t\tcase v = <-x:\n\t\t\tswitch v := v.(type)\
    \ {\n\t\t\t\tcase int: vx = v\n\t\t\t\tcase string: vy = v\n\t\t\t}\n\t\t}\n\t\
    }\n}\n\nfunc Benchmark_OneChannel_Struct(b *testing.B) {\n\ttype T struct { x\
