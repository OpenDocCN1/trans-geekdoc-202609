    }\n```\n\nThe benchmark results:\n\n| Benchmark_TwoChannels-4 | 1295 ns/op |\n\
    | Benchmark_OneChannel_Interface-4 | 940.9 ns/op |\n| Benchmark_OneChannel_Struct-4\
    \ | 851.0 ns/op |\n\nFrom the results, we could get that two-case select blocks\
    \ are slower than one-case select blocks. In some cases, merging several channels\
    \ into one is a good way to improve performance.\n\n## 12.3 Try-send and try-receive\
