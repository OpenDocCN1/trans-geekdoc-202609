    \n896\n640\n\n当然，如果我们确信知道 `append` 调用中第一个参数切片的空容量足够容纳所有追加元素，那么我们就不应该对第一个参数进行裁剪。\n\
    \n## 8.5 扩容切片（增大切片容量）\n\n如果在扩容过程中需要重新分配切片的底层数组，有两种方法可以将切片 `x` 的容量扩展到 `c`。\n\n\
    ```go\n// 方式 1\nfunc Grow_MakeCopy(x []T, c int) []T {\n    r := make([]T, c)\n\
