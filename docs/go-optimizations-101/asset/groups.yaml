  - "[PAGE 120]\n\n# 11.2 aMap[key]++ is more efficient than aMap[key] = aMap[key]\
    \ + 1\n\nIn the statement aMap[key] = aMap[key] + 1, the key is hashed twice,\
    \ but in the statement aMap[key]++, it is only hashed once.\n\nSimilarly, aMap[key]\
    \ += value is more efficient than aMap[key] = aMap[key] + value.\n\nThese could\
    \ be proved by the following benchmark code:\n\n```\npackage maps\n```\n\n```\n\
    import \"testing\",\n```\n\n```\nvar m = map[int]int()\n```\n\n```\nfunc Benchmark_increment(b\
    \ *testing.B) {\n    for i := 0; i < b.N; i++ {\n        m[99]++\n    }\n}\n```\n\
    \n```\nfunc Benchmark_plusone(b *testing.B) {\n    for i := 0; i < b.N; i++ {\n\
    \        m[99] += 1\n    }\n}\n```\n\n```\nfunc Benchmark_addition(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        m[99] = m[99] + 1\n    }\n}\n```\n\
    \nThe benchmark results:\n\n| Benchmark_increment-4 | 11.31 ns/op |\n| Benchmark_plusone-4\
    \ | 11.21 ns/op |\n| Benchmark_addition-4 | 16.10 ns/op |\n\n# 11.3 Pointers in\
    \ maps\n\nIf the key and element type of a map don't contain pointers, then in\
    \ the scan phase of a GC cycle, the garbage collector will not scan the entries\
    \ of the map. This could save much time. This tip is also valid for other kinds\
    \ of container in Go, such as slices, arrays and channels.\n\n# 11.4 Using byte\
    \ arrays instead of short strings as keys\n\nInternally, each string contains\
    \ a pointer, which points to the underlying bytes of string. So if the key or\
    \ element type of a map is a string, then all the entries of the map needs to\
    \ be scanned in GC cycles."
  - "[PAGE 121]\n\nIf we can make the string values used in the entries of a map have\
    \ a max length and the max length is small, then we could use the array [N] byte\
    \ to replace the string types (where N is the max length). Doing this will save\
    \ much garbage collection scanning time if the number of the entries in the map\
    \ is very large.\n\nFor example, in the following code, the entries of mapB contains\
    \ no pointers, the (string) keys of map contains pointers. Garbage collector will\
    \ skip mapB during the scan phase of a GC cycle.\n\n```\nvar mapA = make(map[string]int,\
    \ 1 << 16)\nvar mapB = make(map[[32]byte]int, 1 << 16)\n```\n\nAnd please note,\
    \ the official standard compiler makes special optimizations on whose key sizes\
    \ are 4 or 8 bytes. From the point of view of saving CPU, it is better to use\
    \ map[8]byteV instead of map[5]byteV, and it is better to use map[32]V instead\
    \ of map[16]V.\n\n# ## 11.5 Lower map element modification performance\n\nIn the\
    \ previous \"strings and slices\" chapter, it has been mentioned that a byte-slice-to-string\
    \ conversion appearing as the index in a map element retrieval expression doesn't\
    \ allocate, but such conversions in L-value map element index expressions will\
    \ allocate.\n\nSometimes, we could lower the frequency of using such conversions\
    \ in L-value map element index expressions to improve program performance.\n\n\
    In the following example, the B way (pointer element way) is more performant than\
    \ the A way. The reason is B map element modification requires values. The elements\
    \ in the B are pointers, once they are created, they are never changed.\n\n```\n\
    package maps\n\nimport \"testing\"\n\nvar counterA = make(map[string]int)\nvar\
    \ counterB = make(map[string]*int)\nvar key = make([]byte, 64)\n\nfunc IncA(w\
    \ []byte) {\n\tcounterA[string(w)]++\n}\n\nfunc IncB(w []byte) {\n\tp := counterB[string(w)]\n\
    \tif tp == nil {\n\t\tp = new(int)\n\tcounterB[string(w)] = tp\n}\n\t*tp++\n}\n\
    \nfunc Benchmark_A(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\tfor i := range\
    \ key {\n\t\tIncA(key[:i])\n\t}\n\t}\n}\n```"
  - "[PAGE 122]\n\n```\nfunc Benchmark_B(b *testing.B) {\n\\for i := 0; i < b.N; i++\
    \ {\n\tfor key := range key {\n\t\tIncB(key[:])\n\t}\n}\n```\n\nThe benchmark\
    \ results:\n\n| Benchmark | ns/op | B/op | allocs/op |\n| --- | --- | --- | ---\
    \ |\n| Benchmark_A-4 | 11600 ns/op | 2336 B/op | 62 allocs/op |\n| Benchmark_B-4\
    \ | 1543 ns/op | 0 B/op | 0 allocs/op |\n\nAlthough the B (pointer element) is\
    \ less CPU consuming, it creates many pointers, which increases the burden of\
