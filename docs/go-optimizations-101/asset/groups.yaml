    \ []T, c int) []T {\n    return append(x, make([]T, c-len(x))...[:len(x)])\n}\n\
    ```\n\n两种方法都经过官方 Go 编译器的优化。如上述，方式 1 中的 `make` 调用没有在 `r[:len(x)]` 中预留元素。在方式 2 中，`make`\
    \ 根本没有产生分配。\n\n理论上，由于有了这两种优化，两种方法的性能相当。但基准测试结果显示方式 1 性能略好。\n\n注意，在官方 Go 编译器实现\
