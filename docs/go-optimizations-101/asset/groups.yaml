    # 8.3 The built-in make and append function implementations


    Go is not, so generally, the slices allocated by a make call will be zeroed in
    the make call.


    Since Gochain v1.15, the official Go compiler makes a special optimization: in
    the following code, elements within y[:m], where m is the return value of the
    copy call, will not be zeros in the make call, for they will be overwritten by
    the subsequent copy call.


    ```

    y = make([]) // assume the return value is m

    copy(y, x)

    ```


    The optimization is often used to copy slices:


    ```

    y = make([], len(x))

    copy(y, x)

    ```


    Up to now Gochain v1.21, the optimization has not been implemented perfectly yet.
    In the following code, elements within s[:len(x)] will still be zeroed in the
    make call, which is actually unnecessary.


    ```

    s = make([], len(x) + len(y))

    copy(s, x)

    copy(s[len(x):], y)

    ```


    Another imperfection of this optimization is that several requirements must be
    satisfied to make it work:


    +   - the cloned slice must present as a pure or qualified identifier.

    - the make call must only take two arguments.

    - the copy call must not present as an expression in another statement.


    In other words, the optimization only works for the first case in the following
    code:


    ```

    var s = make([], 100000)


    // case 1:

    y = make([], len(s)) // works

    copy(y, s)

    ```'
