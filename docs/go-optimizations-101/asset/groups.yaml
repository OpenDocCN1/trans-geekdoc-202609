    \ BCE（边界检查消除）。BCE 可以避免一些不必要的检查，使得标准 Go 编译器能够生成更高效的程序。\n\n以下将列出一些示例，展示 BCE 在什么情况下生效，在什么情况下不生效。\n\
    \n我们可以使用 `-d=ssa/check_bce` 编译器选项来显示哪些代码行需要边界检查。\n\n## 10.1 示例 1\n\n一个简单的示例：\n\
    \n```go\n// example1.go\npackage main\n\nfunc fla(s []struct{}, index int) {\n\
