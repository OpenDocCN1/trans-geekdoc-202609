  md: "\n## 5.10 Use Go toolchain v1.19 introduced memory limit strategy to avoid\
    \ frequent GC cycles\n\nGo standard compiler v1.19 introduced a new scheduling\
    \ strategy: the memory limit strategy. The strategy may be configured via the\
    \ GOMEMLIMIT environment variable or through the runtime/debug.MemoryLimit function.\
    \ This memory limit sets a maximum on the total amount of memory that Go runtime\
    \ should use. In other words, if the total amount of memory Go uses (approximately)\
    \ surpasses the limit, a new garbage collection process will start when the limit\
    \ is no longer exceeded. The default value of the memory limit is MaxInt64, which\
    \ effectively disables this strategy.\n\nThe GOMEMLIMIT environment variable may\
    \ have an optional unit. The supported suffixes include B, KIB, MIB, GiB, and\
    \ TiB. A value without a unit means B (bytes). The memory limit and the new heap\
    \ memory percentage strategy may affect each other. For demonstration purposes,\
    \ let's disable the new heap memory percentage strategy and enable the memory\
    \ limit strategy to run the gctrace example shown above. Otherwise, the GOMEMLIMIT\
    \ environment variable will not be recognized so automatic garbage collection\
    \ will be turned off.\n\n```\n$ go version 1.19\nGOMEMLIMIT=157MiB GODEBUG=gctrace=i\
    \ go run gctrace\ngc 1 0.283s 1%: 153->156 MB 157 MB goal, ...\ngc 2 0.784s 1%:\
    \ 151->152 MB 155 MB goal, ...\ngc 3 1.445s 1%: 149->151 MB 152 MB goal, ...\n\
    gc 4 2.113s 1%: 148->150 MB 152 MB goal, ...\ngc 5 2.765s 1%: 148->150 MB 152\
    \ MB goal, ...\ngc 6 3.394s 1%: 147->150 MB 152 MB goal, ...\ngc 7 4.006s 1%:\
    \ 147->147 MB 152 MB goal, ...\ngc 8 4.653s 1%: 147->147 MB 152 MB goal, ...\n\
    gc 9 5.326s 1%: 148->152 MB 152 MB goal, ...\ngc 10 6.007s 1%: 148->149 MB 152\
    \ MB goal, ...\n```\n\nFrom the output, we can see that the memory limit strategy\
    \ can also make GC intervals much larger and staggering.\n\nOne goal of the memory\
    \ limit strategy is to provide an official way to replace the memory ballast trick.\
    \ For Go programs, if the memory limit values are set properly, the goal will\
    \ be achieved. However, sometimes it is difficult to choose a proper value for\
    \ the memory limit. If the value is smaller than the amount of memory Go program\
    \ really needs, GC cycles will start frequently. This is a disadvantage compared\
    \ to the memory ballast solutions shown above. Please read the suggestions for\
    \ using the memory limit strategy (that containing an excellent article to understand\
    \ garbage collection in Go).\n\n## Chapter 6\n\n## Pointers\n\n## 6.1 Avoid unnecessary\
    \ nil array pointer checks in a loop\n\nThere are some flaws in the current official\
    \ standard Go compiler implementation (v1.21.n). One of them is some nil array\
    \ pointer checks are not moved out of loops. Here is an example to show this flaw.\n\
    \n```go\n// unnecessary-checks.go\npackage pointers\nimport \"testing\"\nconst\
    \ N = 1000\nvar a [N]int\n//go:noinline\nfunc g0(a [N]int) {\n    for i := range\
    \ a {\n        a[i] = i // line 12\n    }\n}\n//go:noinline\nfunc g1(a [N]int)\
    \ {\n    _ = a // line 18\n    for i := range a {\n        a[i] = i // line 20\n\
    \    }\n}\nfunc Benchmark_g0(b *testing.B) {\n    for i := 0; i < b.N; i++ { g0(&a)\
    \ }\n}\n\nfunc Benchmark_g1(b *testing.B) {\n    for i := 0; i < b.N; i++ { g1(&a)\
    \ }\n}\n```\n\nLet's run the benchmarks with the -S compiler option, the following\
    \ outputs are got (uninterested texts are omitted)\n\n$ go test -bench -gcflags=-S\
    \ unnecessary-checks.go\n\n```\n00004 00004 (unnecessary-checks.go:12) TESTB AL,\
    \ (AX)\n00006 00006 (unnecessary-checks.go:12) MOVQ CX, (AX)(CX*8)\n...\n00000\
    \ 00000 (unnecessary-checks.go:18) TESTB AL, (AX)\n00002 00002 (unnecessary-checks.go:18)\
    \ XORL CX, CX\n00004 00004 (unnecessary-checks.go:19) BMP 13\n00006 00006 (unnecessary-checks.go:20)\
    \ MOVQ CX, (AX)(CX*8)\n```\n\nBenchmark_g0-4 494.8 ns/op\nBenchmark_g1-4 399.3\
    \ ns/op\n\nFrom the outputs, we could find that the g1 implementation is more\
