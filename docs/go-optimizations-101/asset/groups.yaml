    \ The following benchmark code shows the performance differences between these\
    \ ways.\n\n```go\npackage channels\n\nimport \"testing\"\n\nvar vx int\nvar vy\
    \ string\n\nfunc Benchmark_TwoChannels(b *testing.B) {\n\tvar x = make(chan int)\n\
    \tvar y = make(chan string)\n\tgo func() { for { x <- i } }()\n\tgo func() { for\
