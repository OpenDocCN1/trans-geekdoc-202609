    - For a variable of a struct type: unsafe.Alignof(x) is the largest of all values\
    \ unsafe.Alignof(x.f) for each field f of x, but at least 1.\n- For a variable\
    \ of an array type: unsafe.Alignof(x) is the same as the alignment of a variable's\
    \ element type.\n\nThe official Go compiler ensures that the size of a type is\
    \ a multiple of the alignment guarantee.\n\n## 2.5 Struct padding\n\nTo satisfy\
    \ alignment guarantee rules previously, Go compilers may pad some bytes after\
    \ certain fields of struct types. The padded values are counted for struct sizes.\
    \ The size of a struct may not be a simple sum of the sizes of its fields.\n\n\
    For example, the size of the struct type shown in the following code is 24 on\
    \ 64-bit architectures.\n\n```go\ntype T1 struct {\n    a int\n    // 7 bytes\
    \ are padded here\n    b int64\n    c int16\n    // 6 bytes are padded here.\n\
    }\n```\n\nThe reason why its size is 24:\n\n- The alignment guarantee of the struct\
    \ type is the same as its largest alignment guarantee of its fields. Here is the\
    \ alignment guarantee (8, a native word) of type int64. This means the distance\
    \ between the field b and a of a value of the struct type is a multiple of 8.\
    \ Clever compilers should choose the minimum possible value: 8. To get the desired\
    \ size, 7 bytes are padded after the field a.\n- The size of the struct type must\
    \ be a multiple of the alignment guarantee of the struct type. Considering the\
    \ existence of the field c, the minimum possible size is 24 (8x3), which should\
    \ be used by clever compilers. To get the desired size, 6 bytes are padded after\
    \ the field c.\n\nFields order in struct type size calculations. If we change\
    \ the size of fields b and c of the above struct type, the size of the struct\
    \ will become to 16.\n\n```go\ntype T2 struct {\n    a int\n    // 1 byte is padded\
