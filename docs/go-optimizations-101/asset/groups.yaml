    \ 32 字节，则其间接部分（其底层字节）将分配在栈上，否则分配在堆上。然而，转换常量字符串（到字节切片）的阈值放宽到 64K (64 * 1024) 字节。\n\
    - 如果类型 T 的大小大于 64K (64 * 1024) 字节，则 T 值通过 new(T) 分配，且 &T() 将分配在堆上。\n- 如果 make([]T,\
    \ N) 的底层数组 []T 的大小大于 64K (64 * 1024) 字节，则底层数组将分配在堆上。在这里，N 是一个常量，因此编译器可以在编译时做出决策。如果它不是常量且大于\
    \ 0，则底层数组将始终被分配在堆上。\n- 在变量声明中，如果变量直接部分的大小大于 10M (10 * 1024 * 1024) 字节，则直接部分将分配在堆上。\n\
    \n以下是一些展示这些阈值效果的示例。\n\n示例 1：\n\n```go\npackage main\n\nimport \"testing\"\n\n\
    const t = \"123456789ABCDEF\" // len(t) == 16\nconst S = t + t + t + t + t //\
    \ len(S) == 80\nvar bs33 = make([]byte, 33)\n\nfunc f(w byte) func() {\n    return\
    \ func() {\n        _ = string(w) // string(w) 不逃逸\n    }\n}\n\nfunc g(v string)\
