    \ 大为 4 或 8 字节进行了特殊优化。从节省 CPU 的角度，使用 `map[8]byte` 代替 `map[5]byte` 更好，使用 `map[32]byte`\
    \ 代替 `map[16]byte` 更好。\n\n## 11.5 降低 map 元素修改性能\n\n在之前的“字符串和切片”章节中提到，出现在 map 元素检索表达式索引中的字节切片到字符串的转换不会分配内存，但在左值（L-value）map\
    \ 元素索引表达式中的此类转换将会分配。\n\n有时，我们可以通过降低在左值 map 元素索引表达式中使用此类转换的频率来提高程序性能。\n\n在下面的示例中，B\
    \ 方式（指针元素方式）性能优于 A 方式。原因是 B 方式 map 元素修改需要值。B 中的元素是指针，一旦创建，它们永远不会改变。\n\n```go\n\
