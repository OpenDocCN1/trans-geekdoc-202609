    \ is as performant as g1 implementation. The third implementation uses a slice\
    \ derived from array pointer.\n\n```go\n//go:noinline\nfunc g2(x *[N]int) {\n\
    \    a := x[:]\n    for i := range a {\n        a[i] = i\n    }\n}\n```\n\nAnd\
    \ please note that, if the functions are inline, the benchmark results will change.\
    \ The reason is why //go:noinline directives are used here (Before Go never inlines\
    \ a function).\n\n## The case in which array is a struct field\n\nFor cases where\
