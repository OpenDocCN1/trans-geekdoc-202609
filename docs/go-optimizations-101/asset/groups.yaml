    }\n```\n\n*(注：原文代码 Benchmark_OneChannel_Struct 逻辑不完整，此处已根据逻辑补全翻译上下文)*\n\n基准测试结果：\n\
    \n| Benchmark_TwoChannels-4 | 1295 ns/op |\n| Benchmark_OneChannel_Interface-4\
    \ | 940 ns/op |\n| Benchmark_OneChannel_Struct-4 | 851 ns/op |\n\n从结果可以发现，合并多个\
    \ channel 的性能优于执行多分支 select 代码块。\n\n# 第 13 章\n\n## 函数\n\n## 13.1 函数内联 (Inlining)\n\
    \n官方标准 Go 编译器会自动内联一些小函数以提高速度。请看这个例子：\n\n```go\n// inline.go\npackage inline\n\n\
    func bar(a int) int {\n\treturn a + 1\n}\n\nfunc foo(x, y int) int {\n\treturn\
    \ bar(x) + y\n}\n```\n\n使用 -m 选项编译它：\n\n```bash\n$ go build -gcflags=\"-m\" inline.go\n\
    # command-line arguments\n./inline.go:4:6: can inline bar\n./inline.go:8:6: inlining\
    \ call to bar\n./inline.go:9:6: inlining call to bar\n```\n\n从输出中我们知道，编译器认为 bar\
    \ 函数是可以内联的，foo 函数将被扁平为：\n\n```go\nfunc foo(x, y int) int {\n\tvar a = x + 1\n\t\
    var b = a + y\n\treturn b\n}\n```\n\n内联后，原本在调用 bar 函数时的某些栈操作被节省，从而提高了性能。内联会增大\
    \ Go 二进制文件的大小，所以编译器只内联小函数。\n\n### 13.1.1 哪些函数是可以内联的？\n\n函数需要多小？函数内的每条语句都有内联成本。如果函数内所有语句的总成本不超过编译器设置的阈值，那么编译器认为该函数可以内联。\n\
    \n我们可以使用 -m 选项显示为什么某些函数可以内联而另一些不能。仍然使用这个例子：\n\n```bash\n$ go build -gcflags=\"\
