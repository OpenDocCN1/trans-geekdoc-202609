    # # Chapter 2


    # ## Value Parts and Value Sizes


    # ### 2.1 Values and value parts


    In Go, a value of some kinds of types always contains only one part (in memory),
    whereas a value of other kinds of types might contain more than one part. If a
    value contains more than one part, then one of the parts is called the direct
    part and the others are called indirect parts. The direct part references the
    indirect parts.


    If a value always contains one part, then the part may be also called the direct
    part of the value, and we say the value has no indirect parts.


    In the official Go compiler implementation, each value of the following kinds
    of types always contains one part:


    +   * boolean types

