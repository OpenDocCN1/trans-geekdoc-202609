    • Boxing a struct (array) value with only one field (element) which is a small\
    \ integer or a zero boolean/numeric/string/slice/point value is as fast as boxing\
    \ that field (element).\n\nSo, if value boxing allocations are made on the hot\
    \ paths of code execution, it is recommended to box values with small boxing costs.\n\
    \n# 14.2 Try to void memory allocations by assigning interface to interface\n\n\
    Sometimes, we need to box a non-interface value in two interface values. There\
    \ are two ways to achieve the goal:\n\n+   1. box the non-interface value in the\
    \ first interface value then box the non-interface value in the second one.\n\
    2. box the non-interface value in the first interface value then assign the first\
    \ to the second one.\n\nIf the box value needs an allocation, which is more performant?\
    \ No doubly, the way which could be proved by the following benchmark code.\n\n\
    package main\n\n```\nimport \"testing\"\n\nvar v = 9999999\nvar x, y interface{}\n\
    \nfunc Benchmark_Box(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tx = v\
