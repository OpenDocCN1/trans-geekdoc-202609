    \ to avoid memory fragments.\n\n## 5.5 Memory wasting caused by sharing memory\
    \ blocks\n\nSometimes, multiple value parts are carried on the same memory block\
    \ (allocated on heap). The memory block can only be collected when all these value\
    \ parts become unused. In other words, a tiny value part carried on a memory block\
    \ will prevent the memory block from being collected, even if the tiny value part\
    \ occupies a small portion of the memory block.\n\nGenerally, such situations\
    \ happen in the following cases:\n\n- several elements of a slice (or array or\
    \ string) are still alive but others unused.\n- fields of a struct value are still\
    \ alive but others unused.\n- a hybrid of the above two.\n\nThe following is an\
    \ example which shows one such situation. In the example, the 1000 elements of\
    \ the slice are all carried on the same memory block.\n\n```go\npackage main\n\
    \nimport (\n    \"log\"\n    \"runtime\"\n    \"time\"\n)\n\nfunc main() {\n\t\
    log.SetFlags(0)\n\n\tvar s = make([]int, 1000)\n\tfor i := range s {\n\t\ts[i]\
    \ = 1\n\t\truntime.SetFinalizer(&s[i], func(v interface{}) {\n\t\t\tlog.Println(\"\
    element\", *v.(*int), \"is collected\")\n\t\t})\n\t}\n\n\tvar p = &999\n\truntime.GC()\n\
    \n\t// log.Println(*p) // 999\n\ttime.Sleep(time.Second)\n}\n```\n\nRun this program,\
    \ it will print:\n\nelement 999 is collected\nelement 998 is collected\nelement\
    \ 997 is collected\n...\nelement 1 is collected\nelement 0 is collected\n\nThe\
    \ output indicates that the new GC cycle (triggered by the manual runtime GC call)\
    \ makes the memory block carrying the slice elements collected, otherwise the\
    \ finalizers of these elements will not get executed.\n\nLet's turn on its length.\
    \ Print(*p) line and run the program again, then it will merely print 999, which\
    \ indicates the memory block carrying the slice elements is still not collected\
    \ when the manual GC cycle ends. Yes, fact the last element in the slice will\
    \ still be used prevents the memory block from being collected.\n\nWe may copy\
    \ the long-lived value part (so that it will be carried on a small memory block)\
    \ to the old larger memory block collected. For example, we replace the following\
    \ line in the above program (with the log.Println(*p) line turned on):\n\n```go\n\
    var p = &[999]\nwith\nvar v = a[999] // make a copy\nvar p = &v\n```\n\nthe GC\
    \ will make the memory block carrying the slice elements collected.\n\nThe return\
    \ results of some functions in the standard strings (or bytes) packages are substrings\
    \ (or slices) of some arguments passed to these functions. Such functions include\
    \ Fields, Split and Trim functions. Similarly, we should duplicate such a substring\
    \ (or slice) if it is long lived its length is small, and the corresponding argument\
    \ is short but has a large length; otherwise, the memory block carrying the underlying\
    \ bytes of (the result and the result).\n\n## 5.6 Try to reduce GC pressure.\n\
    \nNo matter how the GC pacer is (and will be), the basic principles to reduce\
    \ GC pressure include:\n\n- allocate less short-lived memory blocks on heap (garbage\
    \ collection production speed).\n- create less pointers (scan work load control).\n\
    \nWhen a local value is allocated on heap, an implicit pointer is created on stack\
    \ to reference the local value so that the value part is traceable (from stacks).\
    \ This means reducing heap allocations is helpful to reduce pointers.\n\nMemory\
    \ allocations and pointer creations are inevitable in programming. If we need,\
    \ just do it. We don't need to deliberately avoid pointers with a lot of efforts.\n\
    \nIn fact, pointers could often be used to reduce costs. Whether or not some pointers\
    \ depends on specific situations. We should only avoid using pointers in the situations\
    \ where their drawbacks are obvious.\n\nWe should to avoid unnecessary memory\
    \ allocations, especially unnecessary memory locations. However, for many reasons,\
    \ such as language safety and API design restrictions, unnecessary memory allocations\
    \ are hard to be avoided totally. Go is not C, we should acknowledge and accept\
    \ the fact. After all, Go provides more conveniences than C.\n\n## 5.7 Use GC\
    \ to control GC frequency\n\nThe GC variable sets the target percentage for the\
    \ heap after a GC cycle. The default value is 100, which means the heap will double\
    \ when the next GC cycle is triggered. You can change this value using the GOGC\
    \ environment variable or by calling `runtime/debug.SetGCPercent`.\n\nIf the GC\
    \ value is negative, GC is disabled.\n\nWhen the GC value is positive, the Go\
    \ runtime will calculate the target heap size for the next GC cycle using the\
    \ following formula:\n\n```\ntarget heap size = live heap * (1 + GOGC/100)\n```\n\
    \nFor example, if GOGC is 100, the target heap size will be twice the live heap.\
    \ If GOGC is 200, the target heap size will be three times the size of the live\
    \ heap.\n\nBy increasing GOGC, you can reduce the frequency of GC cycles but also\
    \ increase the memory usage. By decreasing GOGC, you can reduce memory usage but\
    \ increase the frequency of GC cycles.\n"
