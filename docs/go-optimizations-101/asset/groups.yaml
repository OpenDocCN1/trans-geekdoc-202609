    \ many pointers, which increases burden of scanning in GC cycle. But B is more\
    \ efficient.\n\nWe could use extra counter (a slice) and map the indexes to table\
    \ to avoid many allocations and creating many pointers, as the following code:\n\
    \n```go\nvar wordIndexes = make(map[string]int)\nvar wordCounters []int\n\nfunc\
    \ IncC(w []byte) {\n\tif i, ok := wordIndexes[string(w)]; ok {\n\t\twordCounters[i]++\n\
    \t} else {\n\t\twordCounters = append(wordCounters, 1)\n\t}\n}\n\nfunc Benchmark_C(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tIncC(key[:])\n\t}\n}\n```\n\
    \nThe benchmark results:\n\n| Benchmark | ns/op | B/op | allocs/op |\n| :--- |\
