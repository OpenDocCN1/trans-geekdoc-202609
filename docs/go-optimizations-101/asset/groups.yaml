    function) is also determined, at compile time. At runtime, once the stack frame
    of the function is marked the memory addresses of all value parts allocated on
    the stack within the function call are all determined consequently, which is why
    allocating memory blocks on stack is much faster than heap.


    # 4.4 Stacks growth and shrinkage


    At runtime, a cursor is used to mark the boundary between the used part and available
    part of a goroutine. The cursor will move forwards (towards the available part)
    when entering a deeper function call and move backwards (towards the used part)
    when a goroutine fully exits. move-forwards and move-backwards steps are equal
    to the stack frame size of the respective function calls. Go runtime uses this
    way to mark stack frames for function calls.


    The stack size of a goroutine might be dynamic at runtime. In the implementation
    of the official Go runtime, version 1.19, the initial size of a stack is always
    2KiB; since version 1.19, the default initial stack size is still 2KB.


    For some goroutines, as functions go deeper and deeper, and more and more call
    frames are needed on the stack, the current stack size might become insufficient.
    Stacks will grow on demand during the execution of a goroutine. On the contrary,
    when the function call depth becomes shallower and shallower the stack size of
    a goroutine will become too large. So stacks might also shrink. However, to avoid
    growing and shrinking too frequently, a stack will not shrink immediately as soon
    as it becomes too large. The stack will shrink only when it is too large during
