    }\n```\n\nThe future versions of the standard Go compiler will become smarter\
    \ so that the unnecessary bound checks will be eliminated later.\n\n# Chapter\
    \ 11\n\n# Maps\n\nIn Go, the capacity of a map is unlimited in theory, it is only\
    \ limited by available memory. That is why the built-in cap function doesn't apply\
    \ to maps.\n\nIn the official Go runtime implementation, maps are implemented\
    \ as hashtables internally. Each map/hashtable maintains a backing array to store\
    \ map entries (key-value pairs). Along with more and more entries are put into\
    \ a map, the size of the backing array might be thought as too small to store\
    \ more entries, thus a new larger backing array will be allocated and the current\
    \ entries (in the old backing array) will be moved to it, then the old backing\
    \ array will be discarded.\n\nIn the official Go runtime implementation, the backing\
    \ array of a map will never shrink, even if all entries are deleted from the map.\
    \ This is a form of memory wasting. But in practice, this is seldom a problem\
    \ and actually often good for proper performances.\n\n# 11.1 Clear map entries\n\
    \nBefore Go 1.21, we could use the following loop to clear all entries in a map:\n\
    \n```go\nfor key := range aMap {\n    delete(aMap, key)\n}\n```\n\nThe loop is\
    \ specially optimized (except with NaN keys) so that its execution is very fast.\
    \ However please note that, as mentioned above, the backing array of the clear\
    \ map doesn't shrink after the loop. Then how to release the backing array of\
    \ the map? There are two ways:\n\n```go\naMap = nil\n// or\naMap = make(map[K]V)\n\
    ```\n\nIf there will be new entries to be put in the map after it is cleared,\
    \ the former way is preferred; otherwise, the latter (release) way are preferred.\n"
