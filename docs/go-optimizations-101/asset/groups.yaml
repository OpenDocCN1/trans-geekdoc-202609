    \n这在栈和逃逸分析章节中提到过。\n\n然而，没必要犹豫使用接口方法。对于大多数情况，整洁的设计比更优性能更重要。而且官方 Go 编译器会在编译时对某些接口方法调用进行去虚化（de-virtualize）。\n\
    \n## 14.4 在频繁调用的小函数中避免使用接口参数和结果\n\n由于大多数值装箱（value boxing）操作都需要内存分配，如果函数在代码执行过程中被大量频繁地调用，我们应该尝试避免声明带有接口参数和结果的小函数（包括方法）。\n\
    \n例如，在标准的 `image` 包中，有很多 `At(x, y int) color.Color` 和 `Set(x, y int, c color.Color)`\
    \ 方法，它们被声明实现 `imagedraw.Image`。`color.Color` 类型是一个接口类型：\n\n```go\ntype Color interface\
    \ {\n    RGBA(r, g, b, a uint32)\n}\n```\n\n调用 `At` 和 `Set` 方法会导致短寿命内存分配（为了对非接口值装箱），并且调用\
    \ `color.RGBA` 接口方法会消耗额外的 CPU 资源（用于查找虚表且无法内联）。这些方法在图像处理应用中可能被大量调用，导致代码执行效率非常差。为了缓解这个问题，Go\
    \ 1.17 引入了一个新的接口类型 `image/draw.RGBA64Image`：\n\n```go\ntype RGBA64Image interface\
    \ {\n    Image\n    RGBA64At(x, y int) color.RGBA64\n    SetRGBA64(x, y int, c\
    \ color.RGBA64)\n}\n```\n\n新添加的方法 `RGBA64At` 返回一个非接口类型 `color.RGBA64`，而新增的方法 `SetRGBA64`\
    \ 接受 `color.RGBA64` 参数。\n\n```go\ntype RGBA64 struct {\n    R, G, B, A uint16\n\
    }\n```\n\n通过使用 `RGBA64At` 和 `SetRGBA64` 方法，可以节省大量的内存分配和 CPU 资源，从而大幅提高代码的执行效率。\n"
