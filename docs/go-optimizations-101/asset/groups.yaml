    At runtime, before entering the execution of a function call, Go runtime will
    mark a memory segment on the stack for the call (to allocate stack memory blocks).
    The memory segment is called the stack frame of the function call and its size
    is the stack frame size of the called function. As mentioned before, the frame
    size is calculated at compile time.


