    of the contents in this book are based on the official standard compiler and runtime
    implementation.


    Life is full of trade-offs, the programming world is, too. In programming, we
    often need to make trade-offs between code readability, maintainability, development
    efficiency, and program efficiency, etc. Even for one of the aspects, there are
