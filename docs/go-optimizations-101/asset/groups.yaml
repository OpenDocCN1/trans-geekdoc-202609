  md: "\n# 13.4 Try to store intermediate calculation results in local variables\n\
    \nUsing local variables to store intermediate calculation result will make code\
    \ get a chance to be better optimized by the compiler so that a better performance\
    \ will be got. An example:\n\n```go\npackage functions\n\nimport \"testing\"\n\
    \nvar sum int\n\nfunc f(s []int) {\n    for _, v := range s {\n        sum +=\
    \ v\n    }\n}\n\nfunc g(s []int) {\n    var n = 0\n    for _, v := range s {\n\
    \        n += v\n    }\n    sum = n\n}\n\nvar s = make([]int, 1024)\n\nfunc Benchmark_f(b\
    \ *testing.B) {\n    for i := 0; i < b.N; i++ {\n        f(s)\n    }\n}\nfunc\
    \ Benchmark_g(b *testing.B) {\n    for i := 0; i < b.N; i++ {\n        g(s)\n\
    \    }\n}\n```\n\nThe benchmark mark results:\n\n```\nBenchmark_f-4 3293 ns/op\n\
    Benchmark_g-4 654.1 ns/op\n```\n\n# 13.5 Avoid using deferred calls in loops\n\
    \nSince v1.14, the official Go compiler has specially optimized open-ended deferred\
    \ calls (the deferred calls which are not within loops). But the costs of deferred\
    \ calls within loops are still high. This could be proved from the following example:\n\
    \n```go\npackage functions\n\nimport \"testing\"\n\nvar n int\nfunc inc() {\n\
    \  n++\n}\n\nfunc f(n int) {\n  for i := 0; i < n; i++ {\n    defer inc()\n  \
    \  inc()\n  }\n}\n\nfunc g(n int) {\n  for i := 0; i < n; i++ {\n    func() {\n\
    \      defer inc()\n      inc()\n    }()\n  }\n}\n\nfunc Benchmark_f(b *testing.B)\
    \ {\n  n = 0\n  for i := 0; i < b.N; i++ {\n    f(100)\n  }\n}\n\nfunc Benchmark_g(b\
    \ *testing.B) {\n  n = 0\n  for i := 0; i < b.N; i++ {\n    g(100)\n  }\n}\n```\n\
    \nThe benchmark results:\n\n| Benchmark_f-4 | 33232 ns/op 2 B/op 0 allocs/op |\n\
    | Benchmark_g-4 | 5237 ns/op 0 B/op 0 allocs/op |\n\nThe reason why function g\
    \ is much more performant than function f is that deferred calls which are not\
    \ directly in loops are specially optimized by the official standard Go compiler.\
    \ The function g wraps the code in the loop into an anonymous function so that\
    \ the deferred call is not directly enclosed in the loop.\n\nPlease note that,\
    \ the two functions are not equivalent to each other in logic. If this is a problem,\
    \ then the anonymous function trick should not be used.\n\n# 13.6 Avoid using\
    \ deferred calls if extreme high performance is demanded\n\nEven if the official\
    \ standard Go compiler has specially optimized open-ended deferred calls, such\
    \ a deferred call has a small extra overhead comparing non-deferred calls. And\
    \ as above mentioned, currently (Go toolchain v1.21n), a function containing deferred\
    \ calls is not inlineable. So please try to avoid using deferred calls in a piece\
    \ of code if extreme high performance is demanded for the piece of code.\n\n#\
    \ 13.7 The arguments of a function call will be always evaluated when the call\
    \ is invoked\n\nFor example, the following program prints 1, which means the string\
    \ concatenation expression + w is evaluated, if the parameter s is actually not\
    \ used in the debugPrint function at run time.\n\n```go\npackage main\n\nimport\
    \ (\n    \"log\"\n    \"testing\"\n)\n\nvar debugOn = false\n\nfunc debugPrint(s\
    \ string) {\n    if debugOn {\n        log.Println(s)\n    }\n}\n\nfunc main()\
    \ {\n    stat := func(f func()) int {\n        allocs := testing.AllocsPerRun(10,\
    \ f)\n        return int(allocs)\n    }\n\n    var h, w = \"hello \", \"world!\"\
    \n\n    var n = stat(func() {\n        debugPrint(h + w)\n    })\n\n    println(n)\
    \ // 0\n}\n```\n\nOne way to avoid unnecessary argument is to change debugOn to\
    \ a constant. But some programs might need to change the value on the fly, so\
    \ this way is not feasible. We could let debugPrint function return a bool and\
    \ call the function in a boolean operation, like the following code shows:\n\n\
    ```go\npackage main\n\nimport (\n  \"log\"\n  \"testing\"\n)\n\nvar debugOn =\
    \ false\n\nfunc debugPrint(s string) bool {\n    if debugOn {\n        log.Println(s)\n\
    \        return true\n    }\n    return false\n}\n\nfunc main() {\n    stat :=\
    \ func(f func()) int {\n        // ...\n    }\n    // ...\n}\n```\n\nIn the above\
    \ code, the analysis shows by making use of the trick introduced in stack and\
    \ escape analysis, we could rewrite the function f as the following shows, to\
    \ prevent the argument x from escaping to heap.\n\n```go\npackage main\n\nimport\
    \ (\n    \"strconv\"\n    \"testing\"\n)\n\nvar sink interface{}\n\n//go:noinline\n\
    func escape(x interface{}) {\n    sink = x\n}\n\nfunc main() {\n    var a = f(100)\n\
    \    println(a)\n}\n\nfunc f(x int) string {\n    if x >= 0 && x < 10 {\n    \
    \    return \"0123456789\"[x]\n    }\n    x2 := x // x2 escapes to heap\n    return\
    \ g(&x2)\n}\n\nfunc g(x *int) string { // for demo purpose\n    return strconv.Itoa(*x)\n\
    }\n```\n\n# 13.8 Try to make values escape to heap in hot paths\n\n# Chapter 14:\
    \ Interfaces\n\n## 14.1 Box values into and unbox values from interfaces\n\nAn\
    \ interface value could be viewed as a box to hold at most one non-interface value.\
    \ A nil interface value holds nothing. On the contrary, that assertion could be\
    \ viewed as a value unboxing operation.\n\nWhen a non-interface value is assigned\
    \ to an interface value, generally, a copy of the non-interface value will be\
    \ boxed in the interface value. In the official Go compiler implementation, generally,\
    \ the copy of the non-interface value is allocated somewhere and its address is\
    \ stored in the interface value.\n\nSo generally, the cost of boxing a value is\
    \ approximately proportional to the size of the value.\n\n```go\npackage interfaces\n\
    \nimport \"testing\"\n\nvar r interface{}\n\nvar n16 int16 = 12345\nfunc Benchmark_BoxInt16(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ { r = n16 }\n}\n\nvar n32 int32 =\
    \ 12345\nfunc Benchmark_BoxInt32(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\
    \ r = n32 }\n}\n\nvar n64 int64 = 12345\nfunc Benchmark_BoxInt64(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ { r = n64 }\n}\n\nvar f64 float64 = 1.2345\nfunc\
    \ Benchmark_BoxFloat64(b *testing.B) {\n\tfor i := 0; i < b.N; i++ { r = f64 }\n\
    }\n\nvar s = \"Go\"\nfunc Benchmark_BoxString(b *testing.B) {\n    for i := 0;\
    \ i < b.N; i++ { r = s }\n}\n\nvar x = []int{1, 2, 3}\nfunc Benchmark_BoxSlice(b\
    \ *testing.B) {\n    for i := 0; i < b.N; i++ { r = x }\n}\n\nvar a = [100]int{}\n\
    func Benchmark_BoxArray(b *testing.B) {\n    for i := 0; i < b.N; i++ { r = a\
    \ }\n}\n```\n\nThe benchmark results:\n\n| Benchmark_BoxInt16-4 | 16.62 ns/op\
    \ 2 B/op 1 alloc/op |\n| Benchmark_BoxInt32-4 | 16.36 ns/op 4 B/op 1 alloc/op\
    \ |\n| Benchmark_BoxInt64-4 | 19.51 ns/op 8 B/op 1 alloc/op |\n| Benchmark_BoxFloat64-4\
    \ | 20.05 ns/op 8 B/op 1 alloc/op |\n| Benchmark_BoxString-4 | 56.57 ns/op 16\
    \ B/op 1 alloc/op |\n| Benchmark_BoxArray-4 | 247.2 ns/op 196 B/op 1 alloc/op\
    \ |\n"
  mdcn: "\n\n# 13.4 尝试将中间计算结果存储在局部变量中\n\n使用局部变量存储中间计算结果可以让编译器有机会进行更好的优化，从而获得更好的性能。例如下：\n\
    \n```go\npackage functions\n\nimport \"testing\"\n\nvar sum int\n\nfunc f(s []int)\
    \ {\n    for _, v := range s {\n        sum += v\n    }\n}\n\nfunc g(s []int)\
    \ {\n    var n = 0\n    for _, v := range s {\n        n += v\n    }\n    sum\
    \ = n\n}\n\nvar s = make([]int, 1024)\n\nfunc Benchmark_f(b *testing.B) {\n  \
    \  for i := 0; i < b.N; i++ {\n        f(s)\n    }\n}\nfunc Benchmark_g(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        g(s)\n    }\n}\n```\n\n基准测试结果：\n\n\
    ```\nBenchmark_f-4 3293 ns/op\nBenchmark_g-4 654.1 ns/op\n```\n\n# 13.5 避免在循环中使用\
    \ defer 调用\n\n从 v1.14 开始，Go 官方编译器已经专门优化了开放延迟调用（即不在循环内的延迟调用）。但循环内延迟调用的代价仍然很高。可以通过以下示例证明：\n\
    \n```go\npackage functions\n\nimport \"testing\"\n\nvar n int\nfunc inc() {\n\
    \  n++\n}\n\nfunc f(n int) {\n  for i := 0; i < n; i++ {\n    defer inc()\n  \
    \  inc()\n  }\n}\n\nfunc g(n int) {\n  for i := 0; i < n; i++ {\n    func() {\n\
    \      defer inc()\n      inc()\n    }()\n  }\n}\n\nfunc Benchmark_f(b *testing.B)\
    \ {\n  n = 0\n  for i := 0; i < b.N; i++ {\n    f(100)\n  }\n}\n\nfunc Benchmark_g(b\
    \ *testing.B) {\n  n = 0\n  for i := 0; i < b.N; i++ {\n    g(100)\n  }\n}\n```\n\
    \n基准测试结果：\n\n| Benchmark_f-4 | 33232 ns/op 2 B/op 0 allocs/op |\n| Benchmark_g-4\
    \ | 5237 ns/op 0 B/op 0 allocs/op |\n\n函数 g 性能远高于函数 f 的原因是，不直接在循环中的延迟调用被 Go 官方标准编译器进行了专门优化。函数\
    \ g 将循环中的代码封装在一个匿名函数中，使得延迟调用没有直接包含在循环内。\n\n请注意，这两个函数在逻辑上是不等价。如果这是一个问题，则不应该使用匿名函数技巧。\n\
    \n# 13.6 如果追求极高性能，请避免使用 defer 调用\n\n即使 Go 官方标准编译器已经专门优化了开放延迟调用，与非延迟调用相比，这种延迟调用仍有额外的额外开销。如上所述，目前（Go\
    \ 工具链 v1.21n），包含延迟调用的函数是不可内联。因此，如果某段代码需要极高的性能，请尝试避免在该段代码中使用 defer 调用。\n\n# 13.7\
    \ 函数调的参数在调用时始终会被求值\n\n例如，以下程序打印 1，这意味着即使参数 `s` 在运行时没有在 `debugPrint` 函数中使用，字符串拼接表达式\
    \ `+ w` 仍然被求值。\n\n```go\npackage main\n\nimport (\n    \"log\"\n    \"testing\"\
    \n)\n\nvar debugOn = false\n\nfunc debugPrint(s string) {\n    if debugOn {\n\
    \        log.Println(s)\n    }\n}\n\nfunc main() {\n    stat := func(f func())\
    \ int {\n        allocs := testing.AllocsPerRun(10, f)\n        return int(allocs)\n\
    \    }\n\n    var h, w = \"hello \", \"world!\"\n\n    var n = stat(func() {\n\
    \        debugPrint(h + w)\n    })\n\n    println(n) // 0\n}\n```\n\n避免不参数的方法是将\
    \ `debugOn` 改为常量。但某些程序可能需要动态更改值，所以这种方法不可行。我们可以让 `debugPrint` 函数返回 bool 并在布尔运算中调用该函数，如下代码所示：\n\
    \n```go\npackage main\n\nimport (\n  \"log\"\n  \"testing\"\n)\n\nvar debugOn\
    \ = false\n\nfunc debugPrint(s string) bool {\n    if debugOn {\n        log.Println(s)\n\
    \        return true\n    }\n    return false\n}\n\nfunc main() {\n    stat :=\
    \ func(f func()) int {\n        // ...\n    }\n    // ...\n}\n```\n\n在上面的代码中，分析显示通过利用栈和逃逸分析引入的技巧，我们可以将函数\
    \ `f` 重写如下所示，以防止参数 `x` 逃逸到堆。\n\n```go\npackage main\n\nimport (\n    \"strconv\"\
    \n    \"testing\"\n)\n\nvar sink interface{}\n\n//go:noinline\nfunc escape(x interface{})\
    \ {\n    sink = x\n}\n\nfunc main() {\n    var a = f(10)\n    println(a)\n}\n\n\
    func f(x int) string {\n    return strconv.Itoa(x)\n}\n\nfunc g(x int) string\
    \ {\n    return strconv.Itoa(x)\n}\n```\n\n# 13.8 接口装箱与逃逸\n\n## 14: 接口\n\n接口值可以被视为对非接口值的装箱。nil\
    \ 接口值不任何内容。相反，当非接口值赋值给接口值时，通常该非接口值会被装箱，其地址存储在接口值中。在 Go 官方实现中，通常装箱一个值的代价与值的大小成正比。\n\
    \n```go\npackage interfaces\n\nimport \"testing\"\n\nvar r interface{}\n\nvar\
    \ n16 int16 = 12345\nfunc Benchmark_BoxInt16(b *testing.B) {\n\tfor i := 0; i\
    \ < b.N; i++ { r = n16 }\n}\n\nvar n32 int32 = 12345\nfunc Benchmark_BoxInt32(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ { r = n32 }\n}\n\nvar n64 int64 =\
    \ 12345\nfunc Benchmark_BoxInt64(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\
    \ r = n64 }\n}\n\nvar f64 float64 = 1.2345\nfunc Benchmark_BoxFloat64(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ { r = f64 }\n}\n\nvar s = \"Go\"\nfunc Benchmark_BoxString(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ { r = s }\n}\n\nvar x = []int{1, 2,\
    \ 3}\nfunc Benchmark_BoxSlice(b *testing.B) {\n\tfor i := 0; i < b.N; i++ { r\
    \ = x }\n}\n\nvar a = [100]int{}\nfunc Benchmark_BoxArray(b *testing.B) {\n\t\
    for i := 0; i < b.N; i++ { r = a }\n}\n```\n\n基准测试结果：\n\n| Benchmark_BoxInt16-4\
    \ | 16.62 ns/op 2 B/op 1 alloc/op |\n| Benchmark_BoxInt32-4 | 16.36 ns/op 4 B/op\
    \ 1 alloc/op |\n| Benchmark_BoxInt64-4 | 19.51 ns/op 8 B/op 1 alloc/op |\n| Benchmark_BoxFloat64-4\
    \ | 20.05 ns/op 8 B/op 1 alloc/op |\n| Benchmark_BoxString-4 | 56.57 ns/op 16\
    \ B/op 1 alloc/op |\n| Benchmark_BoxSlice-4 | 45.5 ns/op 24 B/op 1 alloc/op |\n\
    | Benchmark_BoxArray-4 | 247.2 ns/op 196 B/op 1 alloc/op |\n\n"
