    \nimport (\n    \"log\"\n    \"testing\"\n)\n\nvar debugOn = false\n\nfunc debugPrint(s\
    \ string) {\n    if debugOn {\n        log.Println(s)\n    }\n}\n\nfunc main()\
    \ {\n    stat := func(f func()) int {\n        allocs := testing AllocsPerRun(10,\
    \ f)\n        return int(allocs)\n    }\n\nvar h, w = \"hello \\ \"world!\"\n\n\
    var n = stat(func(){\n    debugPrint(h + w)\n})\n\nprintln(n) // 1\n```\n\nOne\
    \ way to avoid the unnecessary argument evaluation is to change the debugOn value\
    \ to a constant. But some programs might need to change the value on the fly,\
    \ so this way is not always feasible. We could let the debugPrint function return\
    \ a bool result and call the function in a boolean-and operation, like the following\
    \ code shows:\n\n```\npackage main\n```"
