  md: "# Chapter 13\n\n# Functions\n\n# 13.1 Function inlining\n\nThe official standard\
    \ Go compiler will automatically inline some small functions to improve code execution\
    \ speed.\n\nLet's look at an example:\n\n```\n// inline.go\npackage inline\n\n\
    func bar(a\n```\n\nBuild it with single -m compiler option:\n\n```\n$ go build\
    \ -gcflags=\"-m\" inline.go\n# command-line-arguments\n./inline.go:4:6: can inline\
    \ bar\n./inline.go:9:13: inlining call to bar\n./inline.go:10:13: inlining call\
    \ to bar\n./inline.go:11:13: inlining call to bar\n./inline.go:12:13: inlining\
    \ call to bar\n```\n\nFrom the output, we know that the compiler thinks the bar\
    \ function is inline-able, the foo function will be automatically flattened as:\n\
    \n```\nfunc foo(x, y int) int {\n    var a = x+y - y+y + 2 * (x - y)\n    var\
    \ b = y+y - x+x + 2 * (y - x)\n```"
