    \ or not variables a and b escape has a very small effect on overall program performance.\
    \ But the tip introduced here might be helpful elsewhere.\n\n# 4.8.3 Memory size\
    \ thresholds used by the compiler to make allocation decisions\n\nTo avoid crashes\
    \ by goroutine stacks exceed the maximum stack size, even though the compiler\
    \ makes that a value is used by only one goroutine, it will still let the value\
    \ allocated on heap if the value is larger than a threshold. There are several\
    \ such thresholds used by the official Go compiler (v1.21n):\n\n+   - in a conversion\
    \ between string and byte slice, the result string or byte slice contains no more\
    \ than 32 bytes, then its indirect part (its underlying bytes) will be allocated\
    \ on stack, otherwise on heap. However, the threshold of converting a constant\
    \ string (to byte slice) is relaxed to 64K (64 * 1024) bytes.\n- if the size of\
    \ a type T is larger than 64K (64 * 1024) bytes, then T values are allocated by\
    \ new(T) and &T() will be allocated on heap.\n- if the size of the backing array\
    \ []T of the make([]T, N) is larger than 64K (64 * 1024) bytes, the backing array\
    \ will be allocated on heap. Here, N is a constant so that the compiler could\
    \ make decisions at compile time. If it is not a constant and larger than zero,\
    \ the backing array will be always allocated on heap."
