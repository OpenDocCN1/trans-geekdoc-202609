    \ 11.21 ns/op |\n| Benchmark_addition-4 | 16.10 ns/op |\n\n# 11.3 Pointers in\
    \ maps\n\nIf the key and element type of a map don't contain pointers, then in\
    \ the scan phase of a GC cycle, the garbage collector will not scan the entries\
    \ of the map. This could save much time. This tip is also valid for other kinds\
    \ of container in Go, such as slices, arrays and channels.\n\n# 11.4 Using byte\
    \ arrays instead of short strings as keys\n\nInternally, each string contains\
    \ a pointer, which points to the underlying bytes of string. So if the key or\
    \ element type of a map is a string, then all the entries of the map needs to\
    \ be scanned in GC cycles."
