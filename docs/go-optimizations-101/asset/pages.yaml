  md: "For example, the standard image package, there are many At(x, y int) color.Color\n\
    and Set(x, y int, c color.Color) methods, which are declared to implement the\n\
    imagedraw.Image. The type color.Color is an interface type:\n\n```\ntype Color\
    \ interface {\n    RGBA(r, g, b, a uint32)\n}\n```\n\nCalling At and Set methods\
    \ causes short-lived memory allocations (for boxing non-interface\nvalues) and\
    \ calling the color.RGBA interface method consumes a bit extra CPU resources (for\n\
    looking up a virtual table and not inline-able). These methods are very likely\
    \ called massively in\nimage processing applications, which leads to a very bad\
    \ code execution efficiency. To alleviate\nt problem, Go 1.17 introduced a new\
    \ interface type, image/draw.RGBA64Image:\n\n```\ntype RGBA64Image interface {\n\
    \    Image\n    RGBA64At(x, y int) color.RGBA64\n    SetRGBA64(x, y int, c color.RGBA64)\n\
    }\n```\n\nThe new added method RGBA644t returns a non-interface type color.RGBA64,\
    \ and the new added\nmethod SetRGBA64 accepts a color.RGBA64 argument.\n\n```\n\
    type RGBA64 struct {\n    R, G, B, A uint16\n}\n```\n\nBy using the RGBA64At and\
    \ SetRGBA64 methods, many memory allocations and CPU resources\nare saved, so\
    \ that code execution efficiency is improved much."
