  md: "# Chapter 10\n\n# BCE (Bound Check Eliminate)\n\nGo is a memory safe language.\
    \ In array/slice/string element indexing and sublice operations, Go runtime will\
    \ check whether or not the involved indexes are out of range. If an index is out\
    \ of range, a panic will be produced to prevent the invalid index from doing harm.\
    \ This is called bounds checking.\n\nBounds checks make our code run safely, on\
    \ the other hand, they also make our code run slower. This is a trade-off a safe\
    \ language must be made.\n\nSince Gochain v1.7, the standard Go compiler has started\
    \ to support BCE (bounds elimination). BCE can avoid some unnecessary checks,\
    \ so that the standard Go compiler could generate more efficient programs.\n\n\
    The following will list some examples to show in which cases BCE works and in\
    \ which cases BCE doesn't work.\n\nWe could use the -d=ssa/check_bce compiler\
    \ option to show which code lines need bound checks.\n\n# 10.1 Example 1\n\nA\
    \ simple example:\n\n```\n// example1.go\npackage main\n\nfunc fla(s []struct{},\
    \ index int) {\n\ts = s[index] // line 5: Found IsInBounds\n\ts = s[index]\n\t\
    s = s[index:]\n\ts = s[:index+1]\n}\n\nfunc flb(s []byte, index int) {\n\ts =\
    \ s[index-1] = 'a' // line 12: Found IsInIndex\n\ts = s[:index]\n}\n```"
