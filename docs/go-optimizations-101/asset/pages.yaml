    \ two allocations.\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"io\"\n\
    \    \"testing\"\n)\n\nfunc main() {\n    stat := func(f func()) int {\n     \
    \   allocs := testing.AllocsPerRun(100, f)\n        return int(allocs)\n    }\n\
    \n    var x = \"aaa\"\n    var n = stat(func() {\n        // 3 allocations\n \
    \       fmt.Fprint(io.Discard, x, x, x)\n    }) // 3\n\n    var m = stat(func()\
    \ {\n        var i interface{} = x // 1 allocation\n        // No allocations\n\
    \        fmt.Fprint(io.Discard, i, i, i)\n    })\n    fmt.println(m) // 1\n}\n\
    ```\n\n# 14.3 Calling interface methods needs a little extra cost\n\nCalling an\
    \ interface method needs to look up a virtual table to find the called concrete\
    \ method. calling a concrete method through an interface value prevents the method\
    \ from being inlined.\n\n```\npackage interfaces\n\nimport \"testing\"\n\ntype\
    \ BinaryOp interface {\n    Do(x, y float64) float64\n}\n\ntype Add struct {}\n\
    \nfunc (a Add) Do(x, y float64) float64 {\n    return x+y\n}\n```"
