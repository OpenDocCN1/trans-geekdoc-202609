    \n```\n//inline2.go\npackage inline\n\nfunc bar(a, b int) int {\n    return a*a\
    \ - b*b + 2 * (a - b)\n}\n\nfunc foo(x, y int) int { // line 8\n    var a = bar(x,\
    \ y)\n    var b = bar(y, x)\n    var c = bar(a, b)\n    var d = bar(b, a)\n  \
    \  return c*c + d*d\n}\n\nfunc foo2(x, y int) int { // line 16\n    var a = x*y\
    \ - y*y + 2 * (x - y)\n    var b = y*y - x*x + 2 * (y - x)\n    var c = a*a -\
