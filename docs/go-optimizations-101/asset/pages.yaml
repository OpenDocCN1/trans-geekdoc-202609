  md: "This book doesn't provide suggestions to avoid memory fragments.\n\n# 5.5 Memory\
    \ wasting caused by sharing memory blocks\n\nSometimes, multiple value parts are\
    \ carried on the same memory block (allocated on heap). The memory block can only\
    \ be collected when all these value parts become unused. In other words, a tiny\
    \ value part carried on a memory block will prevent the memory block from being\
    \ collected, even if the tiny value part occupies a small portion of the memory\
    \ block.\n\nGenerally, such situations happen in the following cases:\n\n+   -\
    \ several elements of a slice (or array or string) are still alive but others\
    \ unused.\n- fields of a struct value are still alive but others unused.\n- a\
    \ hybrid of the above two.\n\nThe following is an example which shows one such\
