  md: "# 8.5 Grow slices (enlarge slice capacities)\n\nThere are two ways to grow\
    \ the capacity of a slice x to c if the backing array of the slice is needed to\
    \ be re-allocated in the growth.\n\n```\n// way 1\nfunc Grow_MakeCopy(x []T, c\
    \ int) []T {\n    r := make([]T, c)\n    copy(r, x)\n    return r[:len(x)]\n}\n\
    ```\n\n```\n// way 2\nfunc Grow_Oline(x []T, c int) []T {\n    return append(x,\
    \ make([]T, c-len(x))...[:len(x)]\n}\n```\n\nBoth of the two ways are specially\
    \ optimized by the official Go compiler. As mentioned above, the make call in\
    \ way 1 doesn't reserve elements in r[:len(x)]. In way 2, the make doesn't allocate\
    \ allocations at all.\n\nIn theory, with the two optimizations, the ways have\
    \ comparable performance. But benchmark results show way 1 is a little more performant.\n\
    \nNote, before the official Go compiler implementation v1.20, the optimization\
    \ for 2 doesn't work if the type of the first argument of the append call is a\
    \ named type. For example, the following Grow_Online_Named function is much slower\
    \ than the above Grow_Online function.\n\n```\ntype S []T\nfunc Grow_Oline_Named(x\
    \ []T, c int) []T {\n    return append(x, make(S, c-len(x))...[:len(x)]\n}\n```\n\
    \nThis flaw has been fixed since Go toolchain v1.20.\n\n# 8.6 Try to grow a slice\
    \ in one step\n\nAs mentioned, how slices grow in append calls is implementation\
    \ specific, which means the result of a slice growth is unspecified by Go specification.\n\
    \nIf we predict the max length of a slice at coding time, we should allocate the\
    \ slice with the max length as capacity, to avoid some possible allocations caused\
    \ by more slice growth.\n\nIf a slice is short-lived, we could allocate it with\
    \ an estimated large capacity. There might be some memory wasted temporarily,\
    \ but the element memory will be released soon. Even there might still be several\
    \ allocations saved.\n\n# 8.7 Clone slices\n\nSince Go toolchain version 1.15,\
    \ the most efficient way to clone a slice is the make+copy way:"
