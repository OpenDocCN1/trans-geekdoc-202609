  md: "The new algorithm in Go 1.18+ often allocates less memory than the old one\
    \ in Go 1.17.\n\nPlease note, each slice growth needs one memory allocation. So\
    \ we should try to grow slices less times in programming.\n\nAnother subtle difference\
    \ (up to Go toolchain1.21) between the copy and append functions is that the copy\
    \ function will not copy elements when it detects the addresses of the first elements\
    \ of its two slices are identical, yet the append function performs such detections.\n\
    This means, in the following code, the copy call is much more efficient than the\
    \ append call.\n\n```\nvar x = make([]T, 10000)\ncopy(x, x)\nx = append(x[:],\
    \ y...)\n```\n\nA concrete example demonstrating this difference in practice,\
    \ is the two DeleteSliceElements functions shown below, when len == j, the version\
    \ using copy is much performant than the version using append.\n\n```\nfunc DeleteSliceElements(s\
    \ []T, i, j int) []T {\n\ts = s[i:j] // bounds check\n\treturn append(s[:i], s[j:]...)\n\
    }\n\nfunc DeleteSliceElements(s []T, i, j int) []T {\n\ts = s[:j] // bounds check\n\
    \treturn s[:i+copy(s[i:], s[j:])]\n}\n```\n\n# 8.4 Try to clip the first argument\
    \ of an append call if we know the call will allocate\n\nIf an append call allocates\
    \ and there are no more elements to be appended to the result slice, then it is\
    \ best to clip the first argument of the append call, to try to save memory (and\
    \ consume less CPU resources).\n\nAn example:\n\n```\npackage main\n\nfunc main()\
    \ {\n\tx := make([]byte, 100, 500)\n\ty := make([]byte, 500)\n\ta := append(x,\
    \ y...)\n\tb := append(x[:len(x):len(x)], y...)\n\tprintln(cap(a)) // 1024\n\t\
    println(cap(b)) // 640\n}\n```\n\nThe outputs shown as comments are for Go 1.17.\
    \ For Go 1.18, the above program prints:\n\n896\n640\n\nSurely, if we confidently\
    \ know that the free capacity of the first argument slice of an append call is\
    \ enough to hold all appended elements, then we should not clip the first argument."
