  md: "# 13.1.3 The go:ninline comment directive\n\nSometimes, we might want calls\
    \ to a function to get inlined, for study and testing purposes, or to make a caller\
    \ of the function inline-able (see below for an example), etc. Besides the several\
    \ ways we introduced, we could also use the go:ninline comment directive to achieve\
    \ this goal. The compiler will not inline the add function in the following code,\
    \ even if the add function is very simple.\n\n```\npackage main\n//go:ninline\n\
    func add(x, y int) int {\n    return x + y\n}\n\nfunc main() {\n    println(add(1,\
    \ 2))\n}\n```\n\nHowever, please note that this is not a formal way of avoiding\
    \ inlining. It is mainly intended to be used in standard package and Go toolchain\
    \ developments. But personally, I think this directive will be supported in a\
    \ long term.\n\n# 13.1.4 Write code in the ways which are inline costly\n\nGenerally,\
    \ we should try to make more functions inline-able, to get better execution performance.\n\
    \nBesides the rules above, we should know that different code implementation ways\
    \ might have different inline costs, even if the code differences are subtle.\
    \ We could make use of this fact to try different implementation ways to find\
