  md: '# # Chapter 2


    # ## Value Parts and Value Sizes


    # ### 2.1 Values and value parts


    In Go, a value of some kinds of types always contains only one part (in memory),
    whereas a value of other kinds of types might contain more than one part. If a
    value contains more than one part, then one of the parts is called the direct
    part and the others are called indirect parts. The direct part references the
    indirect parts.


    If a value always contains one part, then the part may be also called the direct
    part of the value, and we say the value has no indirect parts.


    In the official Go compiler implementation, each value of the following kinds
    of types always contains one part:


    +   * boolean types

    * numeric types (int8, uint8, int16, int32, uint32, int64, uint64, int, uintptr,
    float32, float64, complex64, complex128)

    * pointer types

    * unsafe pointer types

    * struct types

    * array types


    And a value of the following kinds of types may contain one or more indirect parts:


    +   * slice types

    * map types

    * channel types

    * function types

    * interface types

    * string types


    When assigning/copying a value, only the direct part of the value is copied. After
    copying, the direct parts of the destination and source values both are referencing
    the indirect parts of the source value (if the indirect parts exist).


    At run time, each value is carried on one memory block (memory blocks will be
    explained in a following chapter). So, if a value contains two parts, the value
    is very possibly distributed on two memory blocks.


    (Note: The terminology value part was invented by the Go 101 series books. It
    is not widely'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'used in Go community. Personally, I think the terminology makes some conveniences
    when making some explanations.)


    # 2.2 Value/type sizes


    The size of a value part means how many bytes are allocated in memory to store
    the value part at run time.


    The size of a value exactly equals to the size of the direct part of the value.
    In other words, the indirect parts of a value don''t contribute to the size of
    the value. The reason? It has been mentioned above: when assigning/copying a value,
    only the direct part of the value is copied and the indirect parts might be shared
    by multiple values, so it is not a good idea to let the same indirect parts contribute
    to value sizes.


    In the official Go compiler implementation, the sizes of all values of a specific
    type are all the same. The same value size is also called as the size of that
    type.


    In the official Go compiler implementation, the sizes of all types of the same
    kind are all the same, except struct and array kind types. From memory allocation
    point of view,


    +   * A struct value holds all its fields. In other words, a struct value is composed
    of all its fields. At runtime, the fields of a struct are allocated on the memory
    block as the struct itself. Copying a struct value means copying the fields of
    the struct value. So all the fields of a struct value contribute to the size of
    the struct value.


    +   * Like slices, an array holds all its elements. In other words, an array is
    composed of all its elements. At runtime, the elements of an array are allocated
    on the same memory block as the array itself. Copying an array means copying all
    the elements of the array value. So all elements of an array contribute to the
    size of the array.


    A pointer doesn''t hold the value being referenced (pointed) by the pointer. The
    value being referenced by the pointer value doesn''t contribute to the size of
    the pointer value (so nil pointers and non-nil pointers have the same size). The
    two values may be allocated on two different memory blocks, copying one of them
    will not copy the other.


    Internally, a slice uses a pointer (on the direct part) to refer to all its elements
    (on the indirect part). The length and capacity (two ints) of a slice are stored
    on the direct part of the slice. From memory allocation point of view, it doesn''t
    hold its elements. When assigning a slice value to another slice, none of the
    slice got holds its elements. After assigning, the source slice and the destination
    slice both (but not) hold the same elements. The elements of a slice don''t contribute
    to the size of a specified type. This is why of all slice types are the same.


    In the official Go compiler implementation, channel values and function values
    are all represented as pointers internally. This fact is important to understand
    some later optimizations made by the official standard Go compiler.


    In the official Go compiler implementation,


    +   * a string references all its bytes (on the indirect part), though in logic,
    we can also think a string holds all its containing bytes. The length information
    of a string is stored on the direct part of the string as an int value.


    +   * an interface value just references its dynamic value, though in logic, we
    can also think an interface value holds its dynamic value.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 2.3 Detailed type sizes


    The following table lists the sizes (used in the official Go compiler) of all
    the 26 kinds of types in Go. In the table, word means one native word (4 bytes
    on 32-bit architectures and 8 bytes on 64-bit architectures).


    | Type Kind | Size | Required by Go Specification |

    |---| int, uint | 1 word | Architecture dependent, 4 bytes on 32-bit architectures
    and 8 bytes on 64-bit architectures. |

    | int8, uint8 (byte) | 1 byte | 1 byte |

    | int16, int16 | 2 bytes | 2 bytes |

    | int32 (rune), uint32, float32 | 4 bytes | 4 bytes |

    | int64, uint64 | 8 bytes | 8 bytes |

    | float64, complex64 | 8 bytes | 16 bytes |

    | complex128 | 1 word | Large enough to store the uninterpreted bits of a pointer
    value. |

    | bool | 1 byte | Unspecified |

    | string | 2 words | Unspecified |

    | array | (element value size) (array length) | The size of an array type is zero
    if its element type has a zero size. |

    | pointer (safe or unsafe) | 1 word | Unspecified |

    | slice | 3 words | Unspecified |

    | map | 1 word | Unspecified |

    | channel | 1 word | Unspecified |

    | function | 1 word | Unspecified |

    | interface | 2 words | Unspecified |

    | struct | (the sum of sizes of all fields) (the number of padding bytes) | The
    size of a struct type is zero if it contains no fields that have a size greater
    than zero.|


    Struct padding will be explained in the section next.


    # 2.4 Memory alignments


    To utilize CPU instructions and get the best performance, the (start) addresses
    of the memory blocks allocated for (the direct parts of) values of a specified
    type must be aligned as multiples of an integer. N is called the alignment guarantee
    of that type.


    For a type T, we can call `Alignof(t)` to get its field alignment guarantee of
    type T, where t is a non-field value of type T, and call `Alignof(x, t)` to get
    its field alignment guarantee of type T, where x is a struct value and t is field
    value. In the current Go compiler implementation, the field alignment guarantee
    and the general alignment guarantee of a type are always equal to each other.


    The following table lists the alignment guarantees by the official Go compiler
    for all kinds of types. Again, one native word is 4 bytes on 32-bit architectures
    and 8 bytes on 64-bit'
