  md: "# # Chapter 14\n\n# # Interfaces\n\n# ## 14.1 Box values into and unbox values\
    \ from interfaces\n\nAn interface value could be viewed as a box to hold at most\
    \ one non-interface value. A nil interface value holds nothing. On the contrary,\
    \ that assertion could be viewed as a value unboxing operation.\n\nWhen a non-interface\
    \ value is assigned to an interface value, generally, a copy of the non-interface\
    \ value will be boxed in the interface value. In the official standard Go compiler\
    \ implementation, generally, the copy of the non-interface value is allocated\
    \ somewhere and its address is stored in the interface value.\n\nSo generally,\
    \ the cost of boxing a value is approximately proportional to the size of the\
    \ value.\n\npackage interfaces\n\n```\nimport \"testing\"\n\nvar r interface{}\n\
    \nvar n16 int16 = 12345\nfunc Benchmark_BoxInt16(b *testing.B) {\n\tfor i := 0;\
    \ i < b.N; i++ { r = n16 }\n}\n\nvar n32 int32 = 12345\nfunc Benchmark_BoxInt32(b\
    \ *testing.B) {\n\tfor i := 0; i < b.N; i++ { r = n32 }\n}\n\nvar n64 int64 =\
    \ 12345\nfunc Benchmark_BoxInt64(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\
    \ r = n64 }\n}\n\nvar f64 float64 = 1.2345\nfunc Benchmark_BoxFloat64(b *testing.B)\
    \ {\n\tfor i := 0; i < b.N; i++ { r = f64 }\n}\n```"
