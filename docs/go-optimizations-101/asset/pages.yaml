    \ a better performance. And the official Go compiler is to de-virtualize some\
    \ interface method calls at compile time.\n\n# 14.4 Avoid using interface parameters\
    \ and results in small functions which are called frequently\n\nBecause most value\
    \ boxing operations need memory allocations, we should try to avoid declaring\
    \ small functions (including methods) with interface parameters and results if\
    \ the functions are called massively and frequently in code execution."
