  md: "# Chapter 9\n\n# String and Byte Slices\n\n# 9.1 Conversions between strings\
    \ and byte slices\n\nStrings could be viewed as element-immutable byte slices.\
    \ With the guarantee that the content (the bytes stored in) of a string will never\
    \ be modified, any function can safely use the content of the string without worrying\
    \ about the content of the string being modified elsewhere.\n\nTo make the guarantee\
    \ (the bytes stored in will never be modified), when converting a string to byte\
    \ slice, the string and the result byte slice should not share byte elements.\
    \ This means that the string content (bytes) will be duplicated and stored into\
    \ the result byte slice (one memory allocation is needed). Similarly, for the\
    \ same reason, converting a byte slice to string, the byte slice content (the\
    \ byte elements of the slice) will be duplicated and stored into the result string\
    \ too (one memory allocation is needed).\n\nIn fact, under some situations, the\
    \ duplications are not necessary. The current Go compiler makes several special\
    \ optimizations to avoid duplications for some simple cases. Such optimizations\
    \ will be listed.\n\n# 9.1.1 A-to-byte-slice conversion following the range keyword\
    \ doesn't allocate\n\nIf we use the standard Go compiler to build the following\
    \ code, the performance difference between the function f and the function g is\
    \ negligible. The reason is the []byte(s) conversion used in function f doesn't\
    \ make allocations.\n\n```\nfunc f(s string) {\n    for i, b := range byte(s)\
    \ {\n        // do something with i and b\n    }\n}\n```\n\n```\nfunc g(s string)\
    \ {\n    for i := 0; i < len(s); i++ {\n        b := s[i]\n        // do something\
    \ with i and b\n    }\n}\n```"
