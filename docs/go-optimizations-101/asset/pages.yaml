    \nValue parts allocated on heap may be referenced by value parts allocated on\
    \ either heap or stack, but value parts allocated on a stack may only be referenced\
    \ by value parts allocated on the same stack. If a value part is being referenced\
    \ by another value part allocated on heap, then the former (the referred one)\
    \ must also be allocated on heap. This means value parts being referenced by package-level\
    \ variables must be heap allocated.\n\n# 4.2.1 Escape analysis examples\n\nThe\
    \ -m compiler option is used to show escape analysis result. Let's view an example.\n\
    \n```\n// escape.go\npackage main\n\nfunc main() {\n\tvar\n\ta = 1 // moved to\
