  md: "For example, the concat function in the following code is not inline-able,\
    \ for its inline cost is 85 (larger than the threshold 80).\n\n```\nfunc concat(bss\
    \ ...byte) byte {\n    n := len(bss)\n    if n == 0 {\n        return nil\n  \
    \  } else if n == 1 {\n        return bss[0]\n    } else if n == 2 {\n       \
    \ return append(bss[0], bss[1]...)\n    }\n\n    var m = 0\n    for i := 0; i\
    \ < len(bss); i++ {\n        m += len(bss[i])\n    }\n\n    var r = make([]byte,\
    \ 0, m)\n    for i := 0; i < len(bss); i++ {\n        r = append(r, bss[i]...)\n\
    \    }\n    return r\n}\n```\n\nIf, in practice, most are concatenating two bytes,\
    \ then we could rewrite the above code as the following shown. The inline cost\
    \ of the concat function becomes 74 so that it is inline-able now. That means\
    \ the hot path will be inlined.\n\n```\nfunc concat(bss ...byte) byte {\n    if\
    \ len(bss) == 2 {\n        return append(bss[0], bss[1]...)\n    }\n\n    return\
    \ concatSlow(bss...)\n}\n```\n\n```\n//go:noinline\nfunc concatSlow(bss ...byte)\
    \ byte {\n    if len(bss) == 0 {\n        return nil\n    } else if len(bss) ==\
    \ 1 {\n        return bss[0]\n    }\n\n    var m = 0\n    for i := 0; i < len(bss);\
    \ i++ {\n        m += len(bss[i])\n    }\n\n    var r = make([]byte, 0, m)\n \
    \   for i := 0; i < len(bss); i++ {\n        r = append(r, bss[i]...)\n    }\n\
    \    return r\n}\n```"
