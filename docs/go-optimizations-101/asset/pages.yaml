- pgno: 132
  md: "```\nvar c = a*a - b*b + 2 * (a - b)\nvar d = b*b - a*a + 2 * (b - a)\nreturn\
    \ c*c + d*d\n}\n```\n\nAfter the flattening, some stack operations originally\
    \ happening when calling the bar functions are saved so that code execution performance\
    \ improves.\n\nInlining will make Go binaries larger, so compilers only inline\
    \ calls to small functions.\n\n# 13.1.1 Which functions are inline-able?\n\nHow\
    \ small for a function is enough to be capable of inlined? Each statement within\
    \ a function has an inline cost. If the sum cost of all the statements doesn't\
    \ exceed the threshold set by the compiler, then the compiler thinks the function\
    \ could be inlined.\n\nWe can use double -compiler option to show why some functions\
    \ are inline-able but others aren't. Still use this example:\n\n```\n$ go build\
    \ -gcflags=\"-m\" inline.go\n# command-line-arguments\n./inline.go:4:6 can inline\
    \ bar with cost 14 as:\n./inline.go:8:6 cannot inline foo: cost 96 exceeds budget\
    \ 80\n```\n\nFrom the output, we can learn that the function is not inline-able,\
    \ for its inline cost is 96, which exceeds the threshold (80, without enabling\
    \ profile-guided optimization).\n\nRecursive functions will never get inlined.\
    \ For example, the sumSquares function shown in the following code is not inline-able.\n\
    \n```\npackage main\n\nfunc sumSquares(n uint) uint {\n\tif n == 0 {\n\t\treturn\
    \ 0\n\t}\n\treturn sumSquares(n-1) + n*n\n}\n\nfunc main() {\n\tprintln(sumSquares(5))\n\
    }\n```\n\nBesides the above rules, for various reasons, currently (v1.21.n), the\
    \ official standard Go compiler never inlines functions containing:\n\n+   - built-in\
    \ recover function calls\n- defer calls\n- go calls\n\nFor example, in the following\
    \ code, the official standard Go compiler (v1.21.n) thinks of all the fn functions\
    \ are inline-able but none of the gN functions.\n\n```\nfunc fi(s []int) int {\n\
    \treturn cap(s) - len(s)\n}\n```"
