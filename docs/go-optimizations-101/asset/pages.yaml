  md: "# 11.2 aMap[key]++ is more efficient than aMap[key] = aMap[key] + 1\n\nIn the\
    \ statement aMap[key] = aMap[key] + 1, the key is hashed twice, but in the statement\
    \ aMap[key]++, it is only hashed once.\n\nSimilarly, aMap[key] += value is more\
    \ efficient than aMap[key] = aMap[key] + value.\n\nThese could be proved by the\
    \ following benchmark code:\n\n```\npackage maps\n```\n\n```\nimport \"testing\"\
    ,\n```\n\n```\nvar m = map[int]int()\n```\n\n```\nfunc Benchmark_increment(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        m[99]++\n    }\n}\n```\n\n```\nfunc\
    \ Benchmark_plusone(b *testing.B) {\n    for i := 0; i < b.N; i++ {\n        m[99]\
    \ += 1\n    }\n}\n```\n\n```\nfunc Benchmark_addition(b *testing.B) {\n    for\
    \ i := 0; i < b.N; i++ {\n        m[99] = m[99] + 1\n    }\n}\n```\n\nThe benchmark\
