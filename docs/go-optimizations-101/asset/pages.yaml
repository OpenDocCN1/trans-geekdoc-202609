    \ generally a good idea to tell to small memory blocks allocated on stack if it\
    \ is possible.\n\nThe following will introduce some facts and tips to control\
    \ memory block allocation places.\n\n# 4.8.1 Ensure a value is allocated on heap\n\
    \nFor some scenarios, we might expect some values which are only used in the current\
    \ goroutine to be allocated on heap run time. There are two ways to make sure\
    \ a value v escapes to heap run time:\n\n+   1. another value allocated on heap\
    \ reference the value v.\n2. two goroutines v and at least one goroutine modifies\
    \ v after they both start.\n\nHere, only the first will be talked about.\n\nThe\
    \ standard packages use a trick like the following code to show some values for\
    \ escape. The trick uses a package-level variable sink = x (which is allocated\
    \ on heap) to reference the value which is expected to escape. The sink optimized\
    \ but will still affect the decisions made by the escape analysis module. Please\
    \ note that, a value expected to escape should be passed to the escape function.\
    \ Generally, the passed value is a pointer to the value expected to escape.\n\n\
    ```\nvar sink interface{ }\n\n//go:noinline\nfunc escape(x interface{}) {\n  \
    \  sink = x\n    sink = nil\n}\n```"
