  md: "# 13.6 Avoid using deferred calls if extreme high performance is demanded\n\
    \nEven if the official standard Go compiler has specially optimized open-ended\
    \ deferred calls, such a deferred call has a small extra overhead comparing non-deferred\
    \ calls. And as above mentioned, currently (Go toolchain v1.21n), a function containing\
    \ deferred calls is not inlineable. So please try to avoid using deferred calls\
    \ in a piece of code if extreme high performance is demanded for the piece of\
    \ code.\n\n# 13.7 The arguments of a function call will be always evaluated when\
    \ the call is invoked\n\nFor example, the following program prints 1, which means\
    \ the string concatenation expression + w is evaluated, if the parameter s is\
