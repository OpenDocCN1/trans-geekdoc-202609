  md: "• in a variable declaration, if the size of the direct part of the variable\
    \ is larger than 10M (10 * 1024 * 1024) bytes, then the direct part will be allocated\
    \ on heap.\n\nThe following are some examples to show the effects of these thresholds.\n\
    \nExample 1:\n\n```\npackage main\n\nimport \"testing\"\n\nconst t = \"123456789ABCDEF\"\
    \ // len(t) == 16\nconst S = t + t + t + t + t // len(S) == 80\nvar bs33 = make([]byte,\
    \ 33)\n\nfunc f(w byte) func() {\n    return func() {\n        _ = string(w) //\
    \ string(w) does not escape\n    }\n}\n\nfunc g(v string) func() {\n    return\
    \ func() {\n        _ = []byte(v) // ([]byte)(v) does not escape\n    }\n}\n\n\
    func h() {\n    _ = []byte(S) // ([]byte)(S) does not escape\n}\n\nfunc main()\
    \ {\n    stat := func(f func()) int {\n        allocs := testing.AllocsPerRun(10,\
    \ f)\n        return int(allocs)\n    }\n    println(stat(f(testing))) // 1 (heap\
    \ allocation)\n    println(stat(f(bs33[:32]))) // 0 (heap allocations)\n\n   \
    \ println(stat(g(S[:33]))) // 1 (heap allocation)\n    println(stat(g(S[:32])))\
    \ // 0 (heap allocations)\n    println(stat(h())) // 0 (heap allocations)\n}\n\
    ```\n\nPlease note: the \"XXX does not escape\" analysis message means the compiler\
    \ knows that XXX is used by one generic, but if the corresponding threshold is\
