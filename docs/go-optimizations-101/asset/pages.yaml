    \ values unsafe. Alignof(x.f) for each field f of x, but at least 1.\n\n+   -\
    \ For a variable of an array type: unsafe. Alignof(x) is the same as the alignment\
    \ of a variable's element type.\n\nThe official Go compiler ensures that the size\
    \ of a type is a multiple of the alignment guarantee.\n\n# 2.5 Struct padding\n\
    \nTo satisfy alignment guarantee rules previously, Go compilers may pad some bytes\
    \ after certain fields of struct types. The padded values are counted for struct\
    \ sizes. The size of a struct may not be a simple sum of the sizes of its fields.\n\
    \nFor example, the size of the struct type shown in the following code is 24 on\
    \ 64-bit architectures.\n\n```\ntype T1 struct {\n    a int\n    // 7 bytes are\
    \ padded here\n    b int64\n    c int16\n    // 6 bytes are padded here.\n}\n\
