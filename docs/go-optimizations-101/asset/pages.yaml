    \ is the alignment guarantee (8, a native word) of type int64. This means the\
    \ distance between the field b and a of a value of the struct type is a multiple\
    \ of 8. Clever compilers should choose the minimum possible value: 8. To get the\
    \ desired size, 7 bytes are padded after the field a.\n- The size of the struct\
    \ type must be a multiple of the alignment guarantee of the struct type. Considering\
    \ the existence of the field c, the minimum possible size is 24 (8x3), which should\
