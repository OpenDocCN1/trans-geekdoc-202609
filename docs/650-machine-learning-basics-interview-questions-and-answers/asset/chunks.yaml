    # Polynomial Regression and Regularization Quiz


    ## Question 1: Overfitting Risks

    **Question:** A business stakeholder wants to use a very high-degree `Polynomial
    Regression` for forecasting, arguing that it fits the historical data perfectly.
    How would you explain the risks of this approach and suggest a more robust method?


    - Option 1: Encourage the high-degree approach

    - Option 2: Explain the risk of overfitting and suggest using cross-validation
    or regularization

    - Option 3: Ignore the stakeholder''s suggestion

    - Option 4: Focus only on training data


    **Correct Response:** 2

    **Explanation:** The high-degree approach is prone to overfitting and may not
    generalize well to future data. Explaining this risk and suggesting more robust
    methods such as `cross-validation` or `regularization` can help in building a
    more reliable forecasting model.


    ## Question 2: Defining Overfitting

    **Question:** In `Polynomial Regression`, a higher degree can lead to \_\_\_\_\_\_\_\_\_`,
    where the model learns the noise in the data.


    - Option 1: underfitting

    - Option 2: overfitting

    - Option 3: stability

    - Option 4: accuracy


    **Correct Response:** 2

    **Explanation:** A higher degree in `Polynomial Regression` may cause the model
    to fit the noise in the data, leading to `overfitting`.


    ## Question 3: Regularization Techniques

    **Question:** To prevent overfitting in `Polynomial Regression`, you might use
    techniques like \_\_\_\_\_\_\_\_\_`, \_\_\_\_\_\_\_\_\_, or \_\_\_\_\_\_\_\_\_
    regularization.


    - Option 1: Lasso, Ridge, Elastic Net

    - Option 2: Lasso, Accuracy, Elastic Net

    - Option 3: Ridge, Stability, Elastic Net

    - Option 4: Lasso, Ridge, Stability


    **Correct Response:** 1

    **Explanation:** `Lasso`, `Ridge`, and `Elastic Net` regularization techniques
    can be used to prevent overfitting in `Polynomial Regression` by adding constraints
    to the coefficients.


    ## Question 4: Training vs. Test Data

    **Question:** When a `Polynomial Regression` model is overfitted, it will perform
    well on the \_\_\_\_\_\_\_\_\_ data but poorly on the \_\_\_\_\_\_\_\_\_ data.


    - Option 1: training, test

    - Option 2: test, training

    - Option 3: training, validation

    - Option 4: validation, training


    **Correct Response:** 1

    **Explanation:** An overfitted `Polynomial Regression` model will fit the `training`
    data very well but perform poorly on unseen `test` data.


    ## Question 5: Validation Methods

    **Question:** If a `Polynomial Regression` model is suspected of overfitting,
    you can perform \_\_\_\_\_\_\_\_\_\_ to validate the model''s performance across
    different subsets of the data.


    - Option 1: cross-validation

    - Option 2: accuracy testing

    - Option 3: stability testing

    - Option 4: noise filtering


    **Correct Response:** 1

    **Explanation:** `cross-validation` can be used to validate the model''s performance
    across different subsets of the data and can help detect `overfitting`.


    ## Question 6: Visualizing Overfitting

    **Question:** Overfitting in `Polynomial Regression` can be visualized by a graph
    where the polynomial curve fits even the \_\_\_\_\_\_\_\_\_ in the training data.


    - Option 1: linearity

    - Option 2: stability

    - Option 3: noise

    - Option 4: accuracy


    **Correct Response:** 3

    **Explanation:** A graph showing overfitting in `Polynomial Regression` will exhibit
    the polynomial curve fitting even the `noise` in the training data, not just the
    underlying trend.


    ## Question 7: Degree Selection Impact

    **Question:** In the context of `Polynomial Regression`, using too low a degree
    may lead to \_\_\_\_\_\_\_\_\_`, while too high a degree may lead to \_\_\_\_\_\_\_\_\_.


    - Option 1: underfitting, overfitting

    - Option 2: overfitting, underfitting

    - Option 3: stability, instability

    - Option 4: accuracy, inaccuracy


    **Correct Response:** 1

    **Explanation:** Using too low a degree may cause the model to be too simple and
    `underfit` the data, while too high a degree can lead to a complex model that
    `overfits` the data.


    ## Question 8: Purpose of Regularization

    **Question:** What is the primary purpose of using `regularization` techniques
    in Machine Learning models?


    - Option 1: Increase accuracy

    - Option 2: Reduce overfitting

    - Option 3: Increase model complexity

    - Option 4: Enhance data visualization


    **Correct Response:** 2

    **Explanation:** `regularization` techniques are used to prevent `overfitting`
    by adding constraints to the model, thus helping it to generalize better on unseen
    data.


    ## Question 9: L1 Penalty

    **Question:** Which `regularization` technique adds `L1` penalty, causing some
    coefficients to be exactly zero?


    - Option 1: Ridge

    - Option 2: Lasso

    - Option 3: Elastic Net

    - Option 4: nan


    **Correct Response:** 2

    **Explanation:** `Lasso` regularization adds an `L1` penalty, causing some of
    the coefficients to become exactly zero, effectively removing those features from
    the model.


    ## Question 10: Ridge vs. Lasso

    **Question:** What is the main difference between `Ridge` and `Lasso` regularization?


    - Option 1: `Ridge` uses `L1` penalty, `Lasso` uses `L2` penalty

    - Option 2: `Ridge` uses `L2` penalty, `Lasso` uses `L1` penalty

    - Option 3: Both use `L1` penalty

    - Option 4: Both use `L2` penalty


    **Correct Response:** 2

    **Explanation:** `Ridge` regularization uses an `L2` penalty, which shrinks coefficients
    but keeps them non-zero, while `Lasso` uses an `L1` penalty, leading to some coefficients
    being exactly zero.


    ## Question 11: ElasticNet Mechanics

    **Question:** How does `ElasticNet` combine the properties of both `Ridge` and
    `Lasso` regularization?


    - Option 1: Uses `L1` penalty only

    - Option 2: Uses `L2` penalty only

    - Option 3: Uses both `L1` and `L2` penalties

    - Option 4: Does not combine properties


    **Correct Response:** 3

    **Explanation:** `Elastic Net` combines both `L1` and `L2` penalties, thus including
    properties of both `Ridge` (`L2`) and `Lasso` (`L1`) regularization.


    ## Question 12: Irrelevant Features

    **Question:** Which `regularization` method would you likely use if you suspect
    some of the features are entirely irrelevant?


    - Option 1: Ridge

    - Option 2: Lasso

    - Option 3: Elastic Net

    - Option 4: nan


    **Correct Response:** 2

    **Explanation:** `Lasso` regularization is useful when some features are suspected
    to be irrelevant, as it can set the coefficients for those features to zero, effectively
    removing them.


    ## Question 13: Ridge vs. Lasso Penalization

    **Question:** How does `Ridge` regression differ in the way it penalizes large
    coefficients compared to `Lasso`?


    - Option 1: `Ridge` eliminates coefficients, `Lasso` reduces them

    - Option 2: `Ridge` reduces coefficients, `Lasso` eliminates them

    - Option 3: Both eliminate coefficients

    - Option 4: Both reduce coefficients


    **Correct Response:** 2

    **Explanation:** `Ridge` regularization reduces the size of coefficients but keeps
    them non-zero, while `Lasso` can eliminate some coefficients by setting them to
    zero.


    ## Question 14: Bias-Variance Tradeoff

    **Question:** How do the hyperparameters in `Ridge` and `Lasso` affect the bias-variance
    tradeoff?


    - Option 1: Increase both bias and variance

    - Option 2: Reduce bias, increase variance

    - Option 3: Increase bias, reduce variance

    - Option 4: No effect


    **Correct Response:** 3

    **Explanation:** The hyperparameters in `Ridge` and `Lasso` control the regularization
    strength. Increasing them increases bias but reduces variance, helping to prevent
    `overfitting`.


    ## Question 15: ElasticNet Strength

    **Question:** Can you explain the impact of `regularization` strength on the coefficients
    in `ElasticNet`?


    - Option 1: Increases coefficients

    - Option 2: Decreases coefficients proportionally

    - Option 3: Varies based on `L1/L2` ratio

    - Option 4: No impact


    **Correct Response:** 3

    **Explanation:** `ElasticNet` combines `L1` and `L2` penalties, so the impact
    on coefficients depends on the balance between `L1` and `L2`, controlled by the
    hyperparameters.


    ## Question 16: ElasticNet Preference

    **Question:** In what situations would `ElasticNet` be preferred over `Ridge`
    or `Lasso`?


    - Option 1: When features are uncorrelated

    - Option 2: When multicollinearity is high

    - Option 3: When all features are equally important

    - Option 4: When model complexity is not a concern


    **Correct Response:** 2

    **Explanation:** `ElasticNet` is preferred when there''s multicollinearity and
    you want to balance between `Ridge` and `Lasso`, as it combines the properties
    of both.


    ## Question 17: Objective Function

    **Question:** How does the objective function differ between `Ridge`, `Lasso`,
    and `ElasticNet`?


    - Option 1: `Ridge` and `Lasso` have the same objective

    - Option 2: `Ridge` uses `L2`, `Lasso` uses `L1`, `ElasticNet` uses both

    - Option 3: `Ridge` uses `L1`, `Lasso` uses `L2`, `ElasticNet` uses neither

    - Option 4: No difference


    **Correct Response:** 2

