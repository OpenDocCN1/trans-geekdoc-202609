    Option 2: Unsupervised Learning


    Option 3: Reinforcement Learning


    Option 4: Semi-supervised Learning


    Correct Response: 2


    Explanation: Unsupervised Learning does not require labeled data and works by
    finding hidden patterns and structures in the data.


