    Question: Bootstrapping involves resampling with replacement from the dataset
    to create "n" \_\_\_\_\_\_\_\_\_ datasets.


    Option 1: resampled


    Option 2: copied


    Option 3: additional


    Option 4: bootstrap


    Correct Response: 4


    Explanation: Bootstrapping is a statistical method that involves resampling with
    replacement from the dataset to create "n" "bootstrap" datasets. It allows estimating
    the distribution of a statistic by creating many resampled datasets and calculating
    the statistic for each.


    Question: The \_\_\_\_\_\_\_\_\_ method in Cross-Validation ensures that each
    fold maintains the same proportion of different classes as the complete dataset.


    Option 1: k-fold


    Option 2: stratified


    Option 3: repeated


    Option 4: proportional


    Correct Response: 2


    Explanation: The stratified method in Cross-Validation ensures that each fold
    maintains the same proportion of different classes as the complete dataset. It
    aims to preserve the percentage of samples for each class, especially important
    when working with imbalanced class distributions.


    Question: When using Bootstrapping for estimating the standard error of a statistic,
    the process involves repeatedly resampling the data \_\_\_\_\_\_\_\_ times.


    Option 1: n


    Option 2: k


    Option 3: infinite


    Option 4: multiple


    Correct Response: 1


    Explanation: When using Bootstrapping for estimating the standard error of a statistic,
    the process involves repeatedly resampling the data "n" times. The resampling
    is performed with replacement, and statistical measures are calculated for each
    bootstrap sample, providing an empirical distribution from which the standard
    error can be estimated.


    Question: In the context of model evaluation, Bootstrapping can be used to assess
    the \_\_\_\_\_\_\_\_\_ of a statistical estimator or a machine learning model.


    Option 1: bias


    Option 2: variance


    Option 3: robustness


    Option 4: stability


    Correct Response: 4


    Explanation: In the context of model evaluation, Bootstrapping can be used to
    assess the stability of a statistical estimator or a machine learning model. By
    repeatedly resampling with replacement and observing the changes in estimates,
    one can gain insights into the stability and reliability of the model or estimator.


    Question: What is the Mean Squared Error (MSE) in the context of regression models?


    Option 1: Sum of absolute differences between predictions and actuals


    Option 2: Sum of squared differences between predictions and actuals


    Option 3: Average of absolute differences between predictions and actuals


    Option 4: Average of squared differences between predictions and actuals


    Correct Response: 4


    Explanation: The Mean Squared Error (MSE) is the average of the squared differences
    between the predicted values and the actual values. It''s a common metric for
    evaluating the performance of regression models by giving more weight to larger
    errors.


    Question: How does the Root Mean Squared Error (RMSE) differ from Mean Squared
    Error (MSE)?


    Option 1: RMSE is the square of MSE


    Option 2: RMSE is the square root of MSE


    Option 3: RMSE is half of MSE


    Option 4: RMSE is the sum of MSE


    Correct Response: 2


    Explanation: The Root Mean Squared Error (RMSE) is the square root of the Mean
    Squared Error (MSE). While MSE measures the average squared differences, RMSE
    provides a value in the same unit as the original data. This makes RMSE more interpretable
    and commonly used when comparing model performance.


    Question: What does the Mean Absolute Error (MAE) metric represent in regression
    analysis?


    Option 1: Sum of absolute errors


    Option 2: Average of absolute errors


    Option 3: Sum of squared errors


    Option 4: Average of squared errors


    Correct Response: 2


    Explanation: The Mean Absolute Error (MAE) represents the average of the absolute
    errors between the predicted values and the actual values. Unlike MSE, MAE does
    not square the errors, so it doesn''t give extra weight to larger errors, making
    it more robust to outliers. It provides an understanding of how much the predictions
    deviate from the actual values on average.


    Question: How is the R-Squared value used in assessing the performance of a regression
    model?


    Option 1: Measures the total sum of squares


    Option 2: Measures the error variance


    Option 3: Measures the explained variance ratio


    Option 4: Measures the model''s complexity


    Correct Response: 3


    Explanation: The R-Squared value, also known as the coefficient of determination,
    measures the ratio of the explained variance to the total variance. It provides
    a statistical measure of how well the regression line approximates the real data
    points, with a value between 0 and 1. A higher R-Squared value indicates that
    more of the variance is captured by the model.


    Question: What is the Adjusted R-Squared, and how does it differ from the R-Squared?


    Option 1: More robust to outliers


    Option 2: Takes into account the number of predictors


    Option 3: Less sensitive to errors


    Option 4: More accurate in predicting future data


    Correct Response: 2


    Explanation: The Adjusted R-Squared differs from the regular R-Squared by taking
    into account the number of predictors in the model. While R-Squared will generally
    increase as more variables are added, regardless of their usefulness, the Adjusted
    R-Squared adjusts for this by penalizing the inclusion of irrelevant features.
    It''s useful when comparing models with different numbers of predictors.


    Question: Why might one prefer to use MAE over MSE in evaluating a regression
    model?


    Option 1: MAE gives more weight to larger errors


    Option 2: MAE is less sensitive to outliers


    Option 3: MAE is more computationally expensive


    Option 4: MAE considers the direction of errors


    Correct Response: 2


    Explanation: One might prefer to use Mean Absolute Error (MAE) over Mean Squared
    Error (MSE) because MAE is less sensitive to outliers. While MSE squares the differences
    and thus gives more weight to larger errors, MAE takes the absolute value of the
    differences, providing an equal weighting. This makes MAE more robust when there
    are outliers or when one doesn''t want to overly penalize larger deviations from
    the true values.


    Question: How does the choice of loss function such as MSE or MAE affect the training
    of a regression model?


    Option 1: MSE is less sensitive to outliers; MAE is more computationally intensive


    Option 2: MSE emphasizes larger errors more; MAE treats all errors equally


    Option 3: MSE requires more computational resources; MAE is more robust to noise


    Option 4: MSE and MAE have no significant difference in the training process


    Correct Response: 2


    Explanation: The choice between Mean Squared Error (MSE) and Mean Absolute Error
    (MAE) has a significant impact on the training process. MSE squares the errors,
    emphasizing larger mistakes more, while MAE takes the absolute value of the errors,
    treating all errors equally. This means that models using MSE are more sensitive
    to outliers, while those using MAE may be more robust.


    Question: Explain the mathematical difference between MSE and RMSE and their interpretation.


    Option 1: MSE is the square of RMSE; RMSE is less interpretable


    Option 2: RMSE is the square of MSE; MSE provides values in the original unit


    Option 3: MSE is the square root of RMSE; RMSE emphasizes larger errors more


    Option 4: RMSE is the square root of MSE; MSE is in squared units


    Correct Response: 4'
