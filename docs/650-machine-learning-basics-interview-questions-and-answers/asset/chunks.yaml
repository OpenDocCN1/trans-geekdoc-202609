    Option 1: overfitting


    Option 2: underfitting


    Option 3: underfitting


    Option 4: overfitting


    Correct Response: 3, 4


    Explanation: A high-bias, low-variance model tends to underfit, while a low-bias,
    high-variance model tends to overfit. These terms describe how the model fits
    to the training data.


    Question: Cross-validation, such as \_\_\_\_\_\_\_-fold cross-validation, can
    help in detecting and preventing overfitting.


    Option 1: 5


    Option 2: 10


    Option 3: 3


    Option 4: any number


    Correct Response: 4


    Explanation: Any number of folds can be used in cross-validation, although commonly
    used numbers include 5 and 10. Cross-validation helps in model validation and
    prevents overfitting.


    Question: The addition of \_\_\_\_\_\_\_\_\_ in the loss function is a common
    technique to regularize the model and prevent overfitting.


    Option 1: weights


    Option 2: bias


    Option 3: regularization terms


    Option 4: learning rate


    Correct Response: 3


    Explanation: Regularization terms (like L1 or L2 penalties) in the loss function
    constrain the model, reducing the risk of overfitting by preventing large weights.


    Question: What is the primary purpose of using Cross-Validation in Machine Learning?


    Option 1: To increase the training speed


    Option 2: To select optimal hyperparameters


    Option 3: To estimate the model''s performance on unseen data


    Option 4: To enhance the model''s complexity


    Correct Response: 3


    Explanation: Cross-Validation''s primary purpose is to estimate the model''s performance
    on unseen data by dividing the dataset into training and validation sets. It provides
    a more reliable evaluation than using a single static validation set.


    Question: How does Cross-Validation help in reducing overfitting?


    Option 1: By adding noise to the data


    Option 2: By regularizing the loss function


    Option 3: By allowing a more robust estimate of model performance


    Option 4: By increasing the dataset size


    Correct Response: 3


    Explanation: Cross-Validation reduces overfitting by allowing for a more robust
    estimate of the model''s performance. By using different splits of the data, it
    ensures that the model''s validation is not overly reliant on a specific subset,
    helping to detect if the model is overfitting to the training data.


    Question: Explain the concept of k-fold Cross-Validation. What does "k" signify?


    Option 1: Number of layers in a deep learning model


    Option 2: Number of iterations in training


    Option 3: Number of features in the dataset


    Option 4: Number of equally-sized folds the data is divided into


    Correct Response: 4


    Explanation: In k-fold Cross-Validation, "k" signifies the number of equally-sized
    folds the data is divided into. The model is trained on (k-1) folds and validated
    on the remaining fold, repeating this process k times. The average performance
    across all k trials provides a more unbiased estimate of the model''s capability.


    Question: What is Bootstrapping, and how does it differ from Cross-Validation?


    Option 1: A technique to reduce bias


    Option 2: A method for resampling data with replacement


    Option 3: A technique for training ensemble models


    Option 4: A type of Cross-Validation


    Correct Response: 2


    Explanation: Bootstrapping is a method for resampling data with replacement, used
    to estimate statistics about a population from a sample. It differs from Cross-Validation,
    where data is split without replacement to validate the model. Bootstrapping is
    more about estimating the properties of an estimator, while Cross-Validation assesses
    the model''s performance.


    Question: Why is Bootstrapping an essential technique in statistical analysis?


    Option 1: It allows training deep learning models


    Option 2: It enables the estimation of the distribution of a statistic


    Option 3: It provides a method for feature selection


    Option 4: It speeds up computation


    Correct Response: 2


    Explanation: Bootstrapping is essential in statistical analysis because it allows
    estimating the distribution of a statistic, even with a small sample. By repeatedly
    resampling with replacement, it creates numerous "bootstrap samples," enabling
    the calculation of standard errors, confidence intervals, and other statistical
    properties.


    Question: Can you explain the differences between Leave-One-Out Cross-Validation
    (LOOCV) and k-fold Cross-Validation?


    Option 1: LOOCV is a specific case of k-fold with k=1


    Option 2: LOOCV uses k folds, while k-fold uses LOOCV folds


    Option 3: LOOCV is faster than k-fold


    Option 4: LOOCV is a specific case of k-fold with k equal to the number of observations


    Correct Response: 4


    Explanation: Leave-One-Out Cross-Validation (LOOCV) is a specific case of k-fold
    Cross-Validation, where k equals the number of observations in the dataset. In
    LOOCV, each observation is used as a validation set exactly once, whereas in k-fold,
    the dataset is divided into k equally-sized folds. LOOCV is computationally more
    intensive but may provide a less biased estimate.


    Question: How can Cross-Validation help in hyperparameter tuning?


    Option 1: By reducing computation time


    Option 2: By improving model accuracy directly


    Option 3: By allowing repeated testing on the same validation set


    Option 4: By providing robust performance estimates to select the best hyperparameters


    Correct Response: 4


    Explanation: Cross-Validation enables hyperparameter tuning by providing a robust
    estimate of the model''s performance across different data splits. This process
    helps to find hyperparameters that generalize well to unseen data, minimizing
    the risk of overfitting, and allowing a more informed selection of optimal hyperparameters.


    Question: What are the potential drawbacks of using k-fold Cross-Validation?


    Option 1: Higher bias and low variance


    Option 2: Lack of statistical estimation properties


    Option 3: Increase in computation time and potential leakage of validation into
    training


    Option 4: No drawbacks


    Correct Response: 3


    Explanation: k-fold Cross-Validation can increase computational time as the model
    is trained k times on different subsets of the data. Also, improper implementation
    can lead to data leakage between validation and training sets. It generally provides
    a more unbiased estimate of model performance but comes at the cost of increased
    computation.


    Question: Explain the Bias-Variance tradeoff in the context of Cross-Validation.


    Option 1: Increasing k increases both bias and variance


    Option 2: Increasing k decreases bias but may increase variance


    Option 3: Increasing k increases bias but decreases variance


    Option 4: Increasing k decreases both bias and variance


    Correct Response: 2'
