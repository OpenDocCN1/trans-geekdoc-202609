    \n**正确答案：** 3\n\n**解释：** 二分类处理两个类别，而多分类处理的是两个以上的类别。与二分类相比，多分类问题可能更复杂，需要不同的处理方法或算法。\n\
    \n## 问题：不平衡分类问题中的挑战是什么？\n\n- 选项 1：没有挑战\n- 选项 2：对多数类产生 `Overfitting`\n- 选项 3：所有类别的等比例表示\n\
    - 选项 4：平衡数据\n\n**正确答案：** 2\n\n**解释：** 不平衡分类问题（即类别分布不均）可能导致模型偏向多数类。这会导致模型在少数类上的性能不佳，需要特殊的技术来解决。\n\
    \n## 问题：决策边界在分类问题中起什么作用？\n\n- 选项 1：分离特征\n- 选项 2：将数据分离成簇\n- 选项 3：在特征空间中分离类别\n-\
