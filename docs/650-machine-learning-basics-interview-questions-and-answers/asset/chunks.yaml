    **问题：** 半监督学习在存在大量数据和少量数据时特别有用。


    - 选项 1：labeled

    - 选项 2：unlabeled

    - 选项 3：semi-supervised

    - 选项 4：supervised


    **正确答案：** 2


    **解析：** 当存在大量未标记数据和少量标记数据时，使用半监督学习。


    **问题：** 机器学习中哪个术语指的是模型用于进行预测的输入变量？


    - 选项 1：Labels

    - 选项 2：Features

    - 选项 3：Predictors

    - 选项 4：Targets


    **正确答案：** 2


    **解析：** `Features` 是模型用于进行预测的输入变量。


    **问题：** 在机器学习语境下，模型尝试预测的值的术语是什么？


    - 选项 1：Features

    - 选项 2：Labels

    - 选项 3：Predictors

    - 选项 4：Clusters


