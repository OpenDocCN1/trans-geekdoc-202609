    considers the average distance between all pairs of points in two clusters.


    Option 1: Complete Linkage


    Option 2: Single Linkage


    Option 3: Average Linkage


    Option 4: Ward''s Method


    Correct Response: 3


    Explanation: Average Linkage considers the average distance between all pairs
    of points in two clusters. It falls between the Single and Complete Linkage methods,
    often providing a balance that avoids some of the extremes of either method. It
    can be a good choice when clusters are relatively compact but not necessarily
    spherical.


    Question: The visualization tool used to represent the arrangement of the clusters
