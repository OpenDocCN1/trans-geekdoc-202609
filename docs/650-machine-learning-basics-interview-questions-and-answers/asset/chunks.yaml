    Option 2: Difficulty in validation


    Option 3: Requires more data


    Option 4: Uses only labeled data


    Correct Response: 2


    Explanation: The primary challenge in unsupervised learning is the difficulty
    in validation since there are no predefined labels to assess the model''s accuracy.


    Question: How are rewards and penalties used to guide the learning process in
