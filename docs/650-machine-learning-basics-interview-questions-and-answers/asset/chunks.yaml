    Option 2: Can''t handle non-linear data


    Option 3: Too many parameters


    Option 4: Too easy to implement


    Correct Response: 2


    Explanation: The linear kernel in SVM is limited to handling linearly separable
    data. Other kernels, like polynomial or RBF, can transform the feature space to
    handle non-linear data.


    Question: You are given a dataset that is not linearly separable. How would you
    use SVM with the Kernel Trick to classify the data?


    Option 1: Apply a linear kernel only


    Option 2: Apply a non-linear kernel to transform the feature space


    Option 3: Increase data size


    Option 4: Reduce data size


    Correct Response: 2


    Explanation: The Kernel Trick with a non-linear kernel (such as RBF) can transform
    the feature space, making it linearly separable, and thus classify non-linear
