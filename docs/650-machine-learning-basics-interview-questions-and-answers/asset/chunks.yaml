- raw: 'Explanation: The Mean Squared Error (MSE) measures the average of the squared
    differences between the predicted values and the actual values, resulting in squared
    units. The Root Mean Squared Error (RMSE) is the square root of MSE, thus providing
    a value in the same unit as the original data. RMSE is often considered more interpretable
    for this reason.


    Question: What are the limitations of using R-Squared as the sole metric for evaluating
    the goodness of fit in a regression model?


    Option 1: R-Squared is sensitive to outliers; doesn''t consider the number of
    predictors


    Option 2: R-Squared always increases with more predictors; doesn''t account for
    bias


    Option 3: R-Squared provides absolute error values; not suitable for non-linear
    models


    Option 4: R-Squared always increases with more predictors; doesn''t penalize complexity
    in the model


    Correct Response: 4


    Explanation: One major limitation of R-Squared is that it always increases with
    the addition of more predictors, regardless of whether they are relevant. This
    can lead to overly complex models that don''t generalize well. R-Squared doesn''t
    penalize for complexity in the model, making it possible to achieve a high R-Squared
    value with an overfitted model. It might not always be the best sole metric for
    assessing the goodness of fit.


    Question: How is the Adjusted R-Squared value computed, and why is it often preferred
    over R-Squared?


    Option 1: Adjusted R-Squared considers bias; preferred for simplicity


    Option 2: Adjusted R-Squared adds a penalty for more predictors; preferred for
    its robustness to outliers


    Option 3: Adjusted R-Squared includes mean error; preferred for interpretability


    Option 4: Adjusted R-Squared includes a penalty for more predictors; preferred
    for its consideration of model complexity


    Correct Response: 4


    Explanation: The Adjusted R-Squared value is computed by including a penalty term
    for the number of predictors in the model, unlike the regular R-Squared. This
    makes it often preferred over R-Squared, especially when dealing with multiple
    predictors, as it takes into consideration the complexity of the model. The adjustment
    ensures that only meaningful predictors enhance the model''s performance, avoiding
    the tendency of R-Squared to increase with more variables.


    Question: In what situations would RMSE be a more appropriate metric than MAE?


    Option 1: When the model needs to be robust to outliers


    Option 2: When smaller errors are more critical to penalize


    Option 3: When larger errors are more critical to penalize


    Option 4: When the model requires a metric in squared units


    Correct Response: 3


    Explanation: RMSE can be more appropriate than MAE when larger errors are more
    critical to penalize. Since RMSE squares the errors before averaging them, it
    gives more weight to larger errors compared to MAE. This characteristic of RMSE
    can be more suitable in applications where large deviations from the actual values
    are considered more detrimental than smaller ones.


    Question: What are the implications of using R-Squared vs. Adjusted R-Squared
    in a multiple regression model with many predictors?


    Option 1: R-Squared favors complex models; Adjusted R-Squared is more sensitive
    to noise


    Option 2: R-Squared provides better interpretability; Adjusted R-Squared favors
    simple models


    Option 3: R-Squared favors more predictors without penalty; Adjusted R-Squared
    penalizes unnecessary predictors


    Option 4: R-Squared is better for small datasets; Adjusted R-Squared is only applicable
    to linear models


    Correct Response: 3


    Explanation: In multiple regression models with many predictors, using R-Squared
    may favor the inclusion of more predictors without penalizing for their irrelevance,
    leading to potentially overfitted models. In contrast, Adjusted R-Squared includes
    a penalty term for unnecessary predictors, providing a more balanced assessment
    of the model''s performance. It helps in avoiding the trap of increasing complexity
    without meaningful gains in explanatory power.


    Question: You have developed a regression model, and the R-Squared value is very
    close to 1. What could this indicate, and what would you check?


    Option 1: Perfect fit; Check for underfitting


    Option 2: Perfect fit; Check for overfitting


    Option 3: Good fit; No need to check anything


    Option 4: Poor fit; Check for bias


    Correct Response: 2


    Explanation: An R-Squared value close to 1 typically indicates a nearly perfect
    fit, but this might be a sign of overfitting. It is essential to verify the model''s
    performance on unseen data, as it may be capturing noise and specificities of
    the training data rather than the underlying trend. Cross-validation or a hold-out
    validation set can help in this assessment.


    Question: In a situation where the MAE is significantly lower than the RMSE, what
    might this tell you about the distribution of the errors in your model?


    Option 1: Errors are uniformly distributed; no large outliers


    Option 2: Many small errors, few large outliers


    Option 3: Many large errors, few small outliers


    Option 4: Errors are normally distributed; no impact on model


    Correct Response: 2


    Explanation: When the Mean Absolute Error (MAE) is significantly lower than the
    Root Mean Squared Error (RMSE), it likely indicates that the model has many small
    errors and a few large outliers. RMSE, being sensitive to larger errors, would
    be higher, while MAE would be less impacted by those larger errors. An analysis
    of the residuals can further elucidate the nature of these errors.


    Question: A colleague is assessing a regression model using only the Adjusted
    R-Squared. What considerations or additional metrics might you suggest, and why?


    Option 1: Include RMSE; because it''s more interpretable


    Option 2: Include MAE; because it''s less sensitive to outliers


    Option 3: Include both RMSE and MAE; for a more comprehensive assessment


    Option 4: Include MSE; because it''s the standard metric


    Correct Response: 3


    Explanation: While Adjusted R-Squared is useful, including both Root Mean Squared
    Error (RMSE) and Mean Absolute Error (MAE) provides a more comprehensive assessment.
    RMSE can help in understanding how the model is penalizing larger errors, and
    MAE can give an indication of the model''s sensitivity to outliers. Together,
    they offer a more nuanced view of the model''s performance.


    Question: You observe that the R-Squared value increases as you add more variables
    to your regression model, but the Adjusted R-Squared value decreases. What could
    this imply?


    Option 1: Model is becoming more accurate; continue adding variables


    Option 2: Model is overfitting; remove some variables


    Option 3: Model is underfitting; add more significant variables


    Option 4: Model is biased; change the loss function


    Correct Response: 2


    Explanation: The observed pattern where R-Squared increases but Adjusted R-Squared
    decreases implies that the added variables are not contributing meaningful information.
    R-Squared tends to increase with more variables, but Adjusted R-Squared penalizes
    for unnecessary complexity. This pattern could be a sign of overfitting, and some
    variables might need to be removed or the selection process revisited.


    Question: Your regression model''s MSE is high, but the MAE is relatively low.
    What might this indicate about the model''s error distribution, and how would
    you investigate further?


    Option 1: Model has consistent errors; needs more training


    Option 2: Model has frequent large errors; needs regularization


    Option 3: Model has many small errors, but some significant outliers; analyze
    residuals


    Option 4: Model is perfect; no further investigation required


    Correct Response: 3'
