    Option 1: No Effect


    Option 2: Make Predictions Unreliable


    Option 3: Increase Accuracy


    Option 4: Make Predictions More Reliable


    Correct Response: 2


    Explanation: If the assumptions of Simple Linear Regression are not met, the reliability
    of the predictions may be compromised, and the model may become biased or inefficient.


    Question: You are using Simple Linear Regression for a time-series dataset, and
    the residuals show a pattern. What does this imply, and what might be the remedy?


    Option 1: Model is Perfect


    Option 2: Autocorrelation Present, Use Time-Series Model


    Option 3: Multicollinearity, Remove Variables


    Option 4: Normal Distribution, No Remedy Needed


    Correct Response: 2


    Explanation: If residuals show a pattern in a time-series dataset, autocorrelation
    might be present, violating the independence assumption. A time-series model like
