    Option 2: Use a Nonlinear Transformation


    Option 3: Increase Sample Size


    Option 4: Remove Outliers


    Correct Response: 2


    Explanation: If linearity is violated, applying a nonlinear transformation to
    the independent or dependent variable could help in capturing the underlying relationship.


    Question: You are working on a project where Simple Linear Regression seems appropriate,
    but the independent variable is categorical. How would you handle this situation?


    Option 1: Treat as Continuous Variable


    Option 2: Ignore the Variable


    Option 3: Use Dummy Variables


    Option 4: Change the Dependent Variable


    Correct Response: 3


    Explanation: For a categorical independent variable in Simple Linear Regression,
    you can create dummy variables to represent the categories.


    Question: The slope of your Simple Linear Regression model is close to zero, but
    the intercept is significant. What does this indicate, and what could be the potential
    reason?


    Option 1: Strong Relationship, Outliers


    Option 2: No Relationship, Constant Value of Dependent Variable


    Option 3: Weak Relationship, Lack of Variation in Independent Variable


    Option 4: Error in Model, Incorrect Data


    Correct Response: 3


    Explanation: A slope close to zero may indicate a weak or no relationship between
    the variables, and this could be due to a lack of variation in the independent
    variable.


    Question: While estimating the coefficients in Simple Linear Regression, you find
    that one of the assumptions is not met. How would this affect the reliability
