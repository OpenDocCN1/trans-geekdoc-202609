    performance and choose the one that gives the best validation accuracy.


    Question: You have trained an SVM but the decision boundary is not fitting well
    to the data. How could adjusting the hyperplane parameters help?


    Option 1: Change the kernel''s color


    Option 2: Modify the regularization parameter ''C''


    Option 3: Increase the size of the hyperplane


    Option 4: Reduce the number of support vectors


    Correct Response: 2


    Explanation: Adjusting the regularization parameter ''C'' controls the trade-off
    between margin maximization and error minimization, helping to fit the decision
    boundary better.


    Question: How would you handle a situation in which the SVM is performing poorly
    due to the choice of kernel?


    Option 1: Ignore the issue


    Option 2: Change the dataset


    Option 3: Change to a more appropriate kernel using cross-validation


    Option 4: Use only linear kernel


    Correct Response: 3


    Explanation: Changing to an appropriate kernel using cross-validation can enhance
    the performance if the current kernel is not suitable for the data.


    Question: How would you optimize the hyperparameters in an SVM to achieve the
    best performance on a specific dataset?


    Option 1: Guess the hyperparameters


    Option 2: Use grid search or random search with cross-validation


    Option 3: Use only the default values


    Option 4: Optimize the kernel only


    Correct Response: 2


    Explanation: Utilizing techniques like grid search or random search with cross-validation
    allows for systematic hyperparameter tuning to achieve the best performance.


    Question: You have built an SVM for a binary classification problem but the model
    is overfitting. What changes can you make to the kernel or hyperparameters to
    improve the model?


    Option 1: Increase the kernel''s complexity


    Option 2: Change to a simpler kernel or adjust the regularization parameter ''C''


    Option 3: Ignore overfitting


    Option 4: Change the kernel''s color


    Correct Response: 2


    Explanation: Overfitting can be mitigated by choosing a simpler kernel or adjusting
    the regularization parameter ''C'', allowing for a better balance between bias
    and variance.


    Question: In SVM, the \_\_\_\_\_\_\_\_\_ kernel allows for complex transformations
    of data, making it possible to find a hyperplane even in non-linearly separable
    data.


    Option 1: Linear


    Option 2: Polynomial


    Option 3: RBF


    Option 4: Sigmoid


    Correct Response: 3


    Explanation: The Radial Basis Function (RBF) kernel allows for complex transformations,
    making it suitable for non-linearly separable data.


    Question: The \_\_\_\_\_\_\_\_\_ hyperplane in SVM maximizes the margin between
    the support vectors of different classes.


    Option 1: Decision


    Option 2: Optimal


    Option 3: Random


    Option 4: Fixed


    Correct Response: 2


    Explanation: The optimal hyperplane in SVM is the one that maximizes the margin
    between support vectors of different classes.


    Question: If the data is linearly separable, using a \_\_\_\_\_\_\_\_\_ kernel
    in SVM will create a linear decision boundary.


    Option 1: RBF


    Option 2: Sigmoid


    Option 3: Polynomial


    Option 4: Linear


    Correct Response: 4


    Explanation: Using a linear kernel in SVM will create a linear decision boundary
    when the data is linearly separable.


    Question: The regularization parameter ''C'' in SVM controls the trade-off between
    maximizing the margin and minimizing the \_\_\_\_\_\_\_\_\_.


    Option 1: Variance


    Option 2: Margin


    Option 3: Kernel size


    Option 4: Misclassification


    Correct Response: 4


    Explanation: The ''C'' parameter controls the trade-off between maximizing the
    margin and minimizing misclassification.


    Question: In the context of SVM, the support vectors are the data points that
    lie closest to the \_\_\_\_\_\_\_\_\_.


    Option 1: Kernel


    Option 2: Margin


    Option 3: Hyperplane


    Option 4: Data center


    Correct Response: 3


    Explanation: Support vectors are the data points that lie closest to the hyperplane
    and influence its position and orientation.


    Question: To handle non-linear patterns in the data, SVM uses the Kernel Trick
    to transform the data into a \_\_\_\_\_\_\_\_\_ space.


    Option 1: Linear


    Option 2: Non-linear


    Option 3: Fixed


    Option 4: Unchanged


    Correct Response: 2


    Explanation: The Kernel Trick can transform the data into a non-linear space,
    allowing for the classification of non-linear patterns.


    Question: What is the main function of the Gini Index in a Decision Tree?


    Option 1: Measure Purity


    Option 2: Increase Complexity


    Option 3: Reduce Overfitting


    Option 4: Determine Leaf Nodes


    Correct Response: 1


    Explanation: The Gini Index measures the impurity or purity of a split in the
    Decision Tree.


    Question: Why is entropy used in Decision Trees?


    Option 1: Increase Size


    Option 2: Measure Purity


    Option 3: Increase Efficiency


    Option 4: Predict Outcome


    Correct Response: 2


    Explanation: Entropy is used to measure the purity of a split, helping to determine
    the best attribute for splitting at each node.


    Question: How do pruning techniques affect a Decision Tree?


    Option 1: Increase Complexity


    Option 2: Increase Size


    Option 3: Reduce Overfitting


    Option 4: Decrease Accuracy


    Correct Response: 3


    Explanation: Pruning techniques remove branches from the tree to simplify the
    model and reduce overfitting.


    Question: What is the primary difference between the Gini Index and entropy when
    used in Decision Trees?


    Option 1: Scale


    Option 2: Complexity


    Option 3: Units


    Option 4: Calculation Method


    Correct Response: 4


    Explanation: Gini Index and entropy are both used to measure purity, but they
    are calculated differently. Entropy uses logarithms, while Gini Index does not.


    Question: What is the goal of using entropy as a criterion in Decision Trees?


    Option 1: Increase Efficiency


    Option 2: Measure Purity


    Option 3: Increase Complexity


    Option 4: Predict Outcome


    Correct Response: 2


    Explanation: The goal of using entropy is to measure the purity or impurity of
    a split, guiding the selection of the best attribute for splitting.


    Question: Why might pruning be necessary in the construction of a Decision Tree?


    Option 1: Increase Complexity


    Option 2: Reduce Overfitting


    Option 3: Increase Size


    Option 4: Determine Leaf Nodes


    Correct Response: 2


    Explanation: Pruning is necessary to remove unnecessary branches, simplifying
    the model and reducing the risk of overfitting the training data.


    Question: What are the different types of pruning techniques, and how are they
    applied to a Decision Tree?


    Option 1: Reduced Error Pruning, Cost Complexity Pruning


    Option 2: Random Pruning, Error Pruning


    Option 3: Partial Pruning, Cost Pruning


    Option 4: Hybrid Pruning, Complexity Pruning


    Correct Response: 1


    Explanation: Reduced Error Pruning involves replacing a subtree with a leaf node
    if it doesn''t decrease the validation accuracy, while Cost Complexity Pruning
    adds a penalty term to control tree complexity. These techniques help prevent
    overfitting by reducing the complexity of the Decision Tree.


    Question: How does the use of the Gini Index compare to entropy in terms of computational
    efficiency in building a Decision Tree?


    Option 1: Gini Index is more computationally efficient


    Option 2: Entropy is more computationally efficient


    Option 3: Both are equally efficient


    Option 4: Neither is efficient


    Correct Response: 1


    Explanation: Gini Index is more computationally efficient because it does not
    involve calculating logarithms like entropy does. Although they often produce
    similar results, the Gini Index is generally preferred when computational resources
    are limited.


    Question: What is the impact of pruning on the bias-variance tradeoff in a Decision
    Tree model?


    Option 1: Increases bias, reduces variance


    Option 2: Reduces bias, increases variance


    Option 3: Increases both bias and variance


    Option 4: Reduces both bias and variance


    Correct Response: 1'
