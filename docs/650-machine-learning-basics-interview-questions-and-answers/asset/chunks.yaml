    Option 1: Data size


    Option 2: Use of labeled data


    Option 3: Complexity


    Option 4: Application


    Correct Response: 2


    Explanation: The main difference is the use of labeled data. Supervised Learning
    uses labeled data, while Unsupervised Learning does not.


