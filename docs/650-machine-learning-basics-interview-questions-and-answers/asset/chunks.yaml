    Question: Which type of learning is typically used for clustering, where data
    is grouped based on similarities?


    Option 1: Supervised Learning


    Option 2: Reinforcement Learning


    Option 3: Semi-supervised Learning


    Option 4: Unsupervised Learning


    Correct Response: 4


    Explanation: Unsupervised Learning is used for clustering, where the algorithm
    groups data based on similarities without needing labeled data.


    Question: How does reinforcement learning differ from supervised learning in terms
    of feedback and learning process?


    Option 1: Uses labeled data


    Option 2: No feedback involved


    Option 3: Feedback through rewards/penalties


    Option 4: Both learn from environment


    Correct Response: 3


    Explanation: Reinforcement learning uses feedback through rewards and penalties
    to guide the learning process, unlike supervised learning with labeled data.


