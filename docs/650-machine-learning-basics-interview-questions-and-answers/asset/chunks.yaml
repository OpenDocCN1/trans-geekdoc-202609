    Option 1: Branches


    Option 2: Leaves


    Option 3: Nodes


    Option 4: Lines


    Correct Response: 1


    Explanation: In a dendrogram, the height of the branches represents the distance
    at which clusters are merged. The higher the branch, the greater the distance,
    indicating that the clusters being merged are less similar. This information can
    guide the selection of the number of clusters and provides insights into the underlying
    structure of the data.


    Question: The \_\_\_\_\_\_\_\_\_ linkage method in Hierarchical Clustering minimizes
    the variance of the distances between clusters.


    Option 1: Complete Linkage


    Option 2: Single Linkage


    Option 3: Average Linkage


    Option 4: Ward''s Method


    Correct Response: 4


    Explanation: Ward''s Method minimizes the variance of the distances between clusters.
    It considers the sum of squared deviations from the mean and tends to create equally
    sized clusters. This method can be beneficial when we want compact, spherical
    clusters and when minimizing within-cluster variance is a primary consideration.


    Question: Hierarchical Clustering can be either agglomerative, where clusters
    are built from the bottom up, or divisive, where clusters are split from the top
    down. The most common method used is \_\_\_\_\_\_\_\_\_.


    Option 1: Divisive


    Option 2: Agglomerative


    Option 3: Complete Linkage


    Option 4: Single Linkage


    Correct Response: 2


    Explanation: Agglomerative method is the most commonly used approach in Hierarchical
    Clustering. It builds clusters from the bottom up, starting with individual data
    points and merging them into progressively larger clusters. This method allows
    for the creation of a dendrogram, which can be analyzed to choose the optimal
    number of clusters and understand the hierarchical relationships within the data.


    Question: What does DBSCAN stand for in the context of clustering algorithms?


    Option 1: Data-Based Scan Algorithm


    Option 2: Density-Based Spatial Clustering of Applications with Noise


    Option 3: Distribution-Based Scan Clustering


    Option 4: Dynamic-Based Scan Algorithm


    Correct Response: 2


    Explanation: DBSCAN stands for Density-Based Spatial Clustering of Applications
    with Noise. It''s a clustering algorithm that groups together points that are
    closely packed based on a density function, separating areas where points are
    concentrated from areas that are sparse or contain noise.


    Question: In DBSCAN, what does the term ''Epsilon'' refer to?


    Option 1: Error Rate


    Option 2: Estimated Density


    Option 3: Edge Distance


    Option 4: Maximum Radius of the Neighborhood


    Correct Response: 4


    Explanation: In DBSCAN, ''Epsilon'' refers to the maximum radius of the neighborhood
    around a data point. If there are enough points within this radius (defined by
    MinPts), the point is considered a core point, leading to the formation of a cluster.
    It''s a critical parameter affecting the clustering result, controlling how close
    points must be to form a cluster.


    Question: What role does ''MinPts'' play in the DBSCAN algorithm?


    Option 1: Minimum Percentage of Cluster Separation


    Option 2: Minimum Points to Form a Cluster


    Option 3: Minimum Distance Between Points


    Option 4: Minimum Potential for a Cluster


    Correct Response: 2


    Explanation: ''MinPts'' in DBSCAN refers to the minimum number of points required
    to form a dense region. It''s used in conjunction with the Epsilon parameter to
    decide whether a particular region can be considered a cluster. It controls the
    density requirement for clustering, determining how many points must be within
    the Epsilon radius for a region to be considered dense.


    Question: Is DBSCAN sensitive to the choice of Epsilon and MinPts? Why or why
    not?


    Option 1: No, they are auto-calculated parameters


    Option 2: Yes, they define the shape of the clusters


    Option 3: Yes, they influence the density of clusters


    Option 4: No, they have minimal effect on the outcome


    Correct Response: 3


    Explanation: DBSCAN is indeed sensitive to the choice of Epsilon and MinPts. These
    parameters are crucial in determining the density of the clusters, as Epsilon
    controls the maximum radius of the neighborhood, and MinPts sets the minimum number
    of points required to form a dense region. Selecting inappropriate values can
    lead to suboptimal clustering results.


    Question: How does DBSCAN handle outliers compared to other clustering algorithms?


    Option 1: Ignores them completely


    Option 2: Treats them as individual clusters


    Option 3: Considers them as part of existing clusters


    Option 4: Treats more isolated points as noise


    Correct Response: 4


    Explanation: DBSCAN has a unique way of handling outliers, treating more isolated
    points as noise rather than forcing them into existing clusters or forming new
    clusters. This approach allows DBSCAN to identify clusters of varying shapes and
    sizes while ignoring sparse or irrelevant points, making it more robust to noise
    and outliers compared to some other clustering methods.


    Question: Why is DBSCAN often preferred for data with clusters of varying shapes
    and sizes?


    Option 1: It relies on statistical modeling


    Option 2: It uses fixed-size clusters


    Option 3: It depends on density rather than distance


    Option 4: It requires manual setting for each cluster shape


    Correct Response: 3


    Explanation: DBSCAN is preferred for data with clusters of varying shapes and
    sizes because it depends on density rather than a specific distance metric. This
    means that DBSCAN can identify clusters with arbitrary shapes and sizes based
    on the density of data points within a region, rather than relying on a fixed
    distance or shape constraint. This makes it versatile for complex clustering tasks.


    Question: How does the choice of Epsilon affect the clustering results in DBSCAN?


    Option 1: It changes the clustering speed


    Option 2: It affects the minimum points in a cluster


    Option 3: It determines the radius of the neighborhood around a point


    Option 4: It modifies the clustering algorithm''s underlying formula


    Correct Response: 3


    Explanation: The choice of Epsilon in DBSCAN determines the maximum radius of
    the neighborhood around a data point. By adjusting this value, one can control
    how close points must be to form a cluster, affecting the clustering''s granularity,
    shape, and size. It''s a crucial parameter to tune for achieving desired clustering
    results.


    Question: What are the criteria for a point to be considered a core point in DBSCAN?


    Option 1: Being within Epsilon of at least MinPts other points


    Option 2: Being the central point of a cluster


    Option 3: Having the minimum distance to all other points in a cluster'
