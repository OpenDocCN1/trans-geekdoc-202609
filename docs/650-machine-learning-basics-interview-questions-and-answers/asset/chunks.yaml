- raw: 'Explanation: The method of least squares is commonly used in Simple Linear
    Regression to estimate the coefficients by minimizing the sum of squared errors.


    Question: If the residuals in Simple Linear Regression are not evenly spread around
    the regression line, it is a sign of \_\_\_\_\_\_\_\_\_.


    Option 1: Homoscedasticity


    Option 2: Linearity


    Option 3: Heteroscedasticity


    Option 4: Overfitting


    Correct Response: 3


    Explanation: If the residuals are not evenly spread, it is a sign of heteroscedasticity,
    where the variability of the residuals is unequal across levels of the explanatory
    variable.


    Question: The assumption that the relationship between the independent and dependent
    variable is linear in Simple Linear Regression is called the assumption of \_\_\_\_\_\_\_\_\_.


    Option 1: Linearity


    Option 2: Independence


    Option 3: Normality


    Option 4: Homoscedasticity


    Correct Response: 1


    Explanation: The assumption of linearity ensures that the relationship between
    the independent and dependent variable is linear, which is fundamental to Simple
    Linear Regression.


    Question: The \_\_\_\_\_\_\_\_\_ in Simple Linear Regression represents the value
    of the dependent variable when the independent variable is zero.


    Option 1: Slope


    Option 2: Intercept


    Option 3: Residual


    Option 4: Coefficient


    Correct Response: 2


    Explanation: The intercept in Simple Linear Regression represents the value of
    the dependent variable when the independent variable is zero. It''s the point
    where the regression line crosses the Y-axis.


    Question: The slope coefficient in Simple Linear Regression gives the \_\_\_\_\_\_\_\_\_
    change in the dependent variable for a one-unit change in the independent variable.


    Option 1: Constant


    Option 2: Absolute


    Option 3: Marginal


    Option 4: Incremental


    Correct Response: 3


    Explanation: The slope coefficient in Simple Linear Regression gives the marginal
    change in the dependent variable for a one-unit change in the independent variable.


    Question: If the assumptions of Simple Linear Regression are violated, the coefficient
    estimates may become \_\_\_\_\_\_\_\_\_, and predictions may not be reliable.


    Option 1: Biased


    Option 2: Optimized


    Option 3: Efficient


    Option 4: Improved


    Correct Response: 1


    Explanation: If the assumptions of Simple Linear Regression are violated, the
    coefficient estimates may become biased, leading to unreliable predictions.


    Question: What is multicollinearity in the context of Multiple Linear Regression?


    Option 1: High correlation among variables


    Option 2: Lowering the bias of the model


    Option 3: Reducing overfitting


    Option 4: Adding interaction effects


    Correct Response: 1


    Explanation: Multicollinearity refers to a situation where two or more independent
    variables in a Multiple Linear Regression model are highly correlated with each
    other.


    Question: How does multicollinearity affect the performance of a Multiple Linear
    Regression model?


    Option 1: Makes coefficients unstable


    Option 2: Enhances prediction accuracy


    Option 3: Simplifies the model


    Option 4: Increases bias


    Correct Response: 1


    Explanation: Multicollinearity can make the coefficient estimates unstable and
    unreliable, causing difficulty in interpreting the individual effect of each predictor.


    Question: What are some common methods to detect multicollinearity in a dataset?


    Option 1: VIF, Correlation Matrix


    Option 2: Adding more data


    Option 3: Regularization techniques


    Option 4: Feature scaling


    Correct Response: 1


    Explanation: Common methods to detect multicollinearity include calculating the
    Variance Inflation Factor (VIF) and examining the correlation matrix among variables.


    Question: What is an interaction effect in Multiple Linear Regression?


    Option 1: A combined effect of two variables


    Option 2: Removing irrelevant features


    Option 3: Linear relationship between variables


    Option 4: Model optimization


    Correct Response: 1


    Explanation: An interaction effect occurs when the effect of one variable on the
    dependent variable depends on the level of another variable. It shows the combined
    effect.


    Question: How can interaction effects be included in a Multiple Linear Regression
    model?


    Option 1: By creating new variables for interactions


    Option 2: By using more data


    Option 3: By increasing model complexity


    Option 4: By reducing variables


    Correct Response: 1


    Explanation: Interaction effects can be included by creating new variables that
    represent the product of two interacting variables, allowing for combined effects
    to be modeled.


    Question: Why might it be important to consider interaction effects in a Multiple
    Linear Regression model?


    Option 1: It captures complex relationships


    Option 2: It simplifies the model


    Option 3: It reduces bias


    Option 4: It increases accuracy independently


    Correct Response: 1


    Explanation: Considering interaction effects is essential to capture complex relationships
    between variables that might not be apparent when considering each variable separately.


    Question: What are the consequences of ignoring multicollinearity in a Multiple
    Linear Regression model?


    Option 1: Unstable coefficients, difficulties in interpretation


    Option 2: Increased accuracy


    Option 3: Simpler model


    Option 4: Improved efficiency


    Correct Response: 1


    Explanation: Ignoring multicollinearity can lead to unstable coefficient estimates
    and difficulties in interpreting the individual effect of predictors, reducing
    the model''s reliability and interpretability.


    Question: Explain the Variance Inflation Factor (VIF) and its role in detecting
    multicollinearity.


    Option 1: Measure of how much the variance of an estimated coefficient increases
    when predictors are correlated


    Option 2: Measure of model''s fit


    Option 3: Measure of residual errors


    Option 4: Measure of model complexity


    Correct Response: 1


    Explanation: VIF quantifies how much the variance of an estimated regression coefficient
    increases when predictors are correlated. A high VIF indicates multicollinearity,
    potentially affecting the model''s stability.


    Question: How can Ridge Regression be used to mitigate multicollinearity in Multiple
    Linear Regression?


    Option 1: By adding a penalty term to the coefficients


    Option 2: By removing correlated variables


    Option 3: By increasing model complexity


    Option 4: By reducing the number of samples


    Correct Response: 1


    Explanation: Ridge Regression adds a penalty term to the coefficients, shrinking
    them and mitigating the impact of multicollinearity. This regularization technique
    helps stabilize the estimates.


    Question: What is the statistical interpretation of interaction effects in Multiple
    Linear Regression?


    Option 1: Combined effect of two variables affecting the dependent variable


    Option 2: Transforming variables into linear space


    Option 3: Removing irrelevant features


    Option 4: Minimizing overfitting


    Correct Response: 1


    Explanation: Interaction effects statistically represent the combined effect of
    two or more variables on the dependent variable. They capture relationships that
    are not apparent when variables are considered separately.


    Question: How can centering variables help in interpreting interaction effects
    in Multiple Linear Regression?


    Option 1: By reducing multicollinearity between main effects and interaction terms


    Option 2: By increasing model accuracy


    Option 3: By simplifying the model


    Option 4: By increasing prediction speed


    Correct Response: 1


    Explanation: Centering variables (subtracting the mean) can reduce multicollinearity
    between main effects and interaction terms, making it easier to interpret the
    individual and combined effects of the variables.


    Question: You have a dataset with a high degree of multicollinearity. What steps
    would you take to address this before building a Multiple Linear Regression model?


    Option 1: Ignore it


    Option 2: Remove all correlated variables


    Option 3: Apply feature selection or dimensionality reduction techniques


    Option 4: Increase the size of the dataset'
