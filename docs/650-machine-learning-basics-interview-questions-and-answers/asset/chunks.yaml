    Option 4: feature selection


    Correct Response: 1


    Explanation: "Accuracy metrics" that consider both within-class and between-class
    variances can be used to evaluate the performance of an LDA model. It gives a
    comprehensive view of how well the model has separated the classes.


    Question: What is overfitting in the context of machine learning?


    Option 1: Fitting the model too loosely to the data


    Option 2: Fitting the model too closely to the training data


    Option 3: Reducing model complexity


    Option 4: Enhancing generalization


    Correct Response: 2


    Explanation: Overfitting occurs when a model fits the training data too closely,
    capturing the noise and outliers, making it perform poorly on unseen data.


    Question: What is underfitting, and how does it differ from overfitting?


    Option 1: Fitting the model too loosely to the training data; opposite of overfitting


    Option 2: Fitting the model too closely to the training data; same as overfitting


    Option 3: Enhancing model complexity; similar to overfitting


    Option 4: Reducing model complexity; similar to overfitting


    Correct Response: 1


    Explanation: Underfitting is when a model fits the training data too loosely and
    fails to capture the underlying pattern, the opposite of overfitting, where the
    model fits too closely.


    Question: Why is it problematic for a model to fit too closely to the training
    data?


    Option 1: It increases model simplicity


    Option 2: It improves generalization


    Option 3: It leads to poor performance on unseen data


    Option 4: It reduces model bias


    Correct Response: 3


    Explanation: Fitting too closely to the training data leads to overfitting and
    poor performance on unseen data, as the model captures noise and fails to generalize
    well.


    Question: Why is underfitting also considered an undesirable property in a machine
    learning model?


    Option 1: It reduces model bias


    Option 2: It increases model complexity


    Option 3: It fails to capture underlying patterns


    Option 4: It enhances generalization


    Correct Response: 3


    Explanation: Underfitting is undesirable because it fails to capture the underlying
    patterns in the training data, leading to poor performance on both training and
    unseen data.


    Question: What are some common techniques to avoid overfitting?


    Option 1: Reducing model complexity, Regularization, Cross-validation


    Option 2: Increasing model complexity, Regularization, Cross-validation


    Option 3: Reducing model complexity, Adding noise, Cross-validation


    Option 4: Increasing model complexity, Adding noise, Cross-validation


    Correct Response: 1'
