    ### 问题：简单线性回归中的截距是什么？如何解释它？

    - 选项 1：X 轴上的线起点

    - 选项 2：当 X 为 0 时 Y 的值

    - 选项 3：Y 的最大值

    - 选项 4：X 的最小值


    **正确答案：2**


    **解释：** `Simple Linear Regression` 中的截距是自变量 (`X`) 为 0 时因变量 (`Y`) 的值。它代表了回归线与 Y
    轴的交点。


    ---


    ### 问题：简单线性回归的系数是如何估计的？

    - 选项 1：通过聚类

    - 选项 2：通过最小化残差平方和

    - 选项 3：通过分类

    - 选项 4：通过最大化方差


    **正确答案：2**


    **解释：** `Simple Linear Regression` 中的系数是通过最小化残差平方和来估计的。这种方法确保了直线尽可能地拟合观测数据。


    ---


    ### 问题：通常使用什么方法来估计简单线性回归中的系数？

    - 选项 1：极大似然估计

    - 选项 2：最小化绝对误差之和

    - 选项 3：最小化残差平方和

    - 选项 4：神经网络训练


    **正确答案：3**


    **解释：** 在 `Simple Linear Regression` 中，用于估计系数的方法是最小化残差平方和，这种方法被称为 `普通最小二乘法` (`OLS`)。


    ---


    ### 问题：解释简单线性回归中的同方差性假设。

    - 选项 1：所有误差均为 0

    - 选项 2：对于所有 X 值，误差方差相等

    - 选项 3：变量之间的线性关系

    - 选项 4：所有变量都是独立的


    **正确答案：2**


    **解释：** 同方差性是一种假设，认为误差的变异性在自变量的所有水平上都是恒定的。如果违反了这一假设，可能会导致估计的低效。


    ---


    ### 问题：简单线性回归中的线性假设意味着什么？

    - 选项 1：自变量是线性的

    - 选项 2：两个变量都是分类的

    - 选项 3：因变量与自变量之间的关系是线性的

    - 选项 4：因变量是线性的


