    `\_\_\_\_\_\_\_` is a metric that measures the average magnitude of errors in
    a set of predictions, without considering their direction.


    - Option 1: `MAE`

    - Option 2: `RMSE`

    - Option 3: `R-Squared`

    - Option 4: `Adjusted R-Squared`


    **Correct Response:** 1


    ### Explanation

    The Mean Absolute Error (`MAE`) is a metric that measures the average magnitude
    of errors without considering their direction. It calculates the average of the
    absolute differences between predicted and actual values. Unlike squared errors,
    it does not give more weight to larger errors, making it less sensitive to outliers.
    This property makes it a useful measure in various contexts.


    ### Question

    While `R-Squared` describes the proportion of variance explained by the model,
    `\_\_\_\_\_\_\_` adjusts this value based on the number of predictors, providing
    a more nuanced understanding of the model''s fit.


    - Option 1: `R-Squared`

    - Option 2: `Adjusted R-Squared`

    - Option 3: `MSE`

    - Option 4: `RMSE`


    **Correct Response:** 2


    ### Explanation

    `Adjusted R-Squared` is an extension of `R-Squared` that adjusts the value based
    on the number of predictors in the model. While `R-Squared` describes the proportion
    of variance explained by the model, `Adjusted R-Squared` takes into account the
    complexity of the model by considering the number of predictors. This leads to
    a more nuanced understanding of the model''s fit, particularly when comparing
    models with different numbers of predictors.


    ### Question

    What is `Accuracy` in the context of classification metrics?


    - Option 1: `Total correct predictions / Total predictions`

    - Option 2: `True Positives / (True Positives + False Negatives)`

    - Option 3: `False Positives / Total predictions`

    - Option 4: `True Negatives / (True Negatives + False Positives)`


    **Correct Response:** 1


    ### Explanation

    `Accuracy` is the ratio of correct predictions to the total number of predictions.
    It gives an overall measure of how well the model is performing, but may not be
    suitable for imbalanced datasets where one class dominates.


    ### Question

    What does `Precision` measure in classification problems?


    - Option 1: `True Positives / (True Positives + False Negatives)`

    - Option 2: `True Positives / (True Positives + False Positives)`

    - Option 3: `False Positives / Total predictions`

    - Option 4: `True Negatives / (True Negatives + False Positives)`


    **Correct Response:** 2


    ### Explanation

    `Precision` is the ratio of true positive predictions to the sum of true positives
    and false positives. It focuses on the accuracy of the positive predictions and
    is particularly important when the cost of false positives is high.


    ### Question

    How is `Recall` defined in classification, and when is it an important metric
    to consider?


    - Option 1: `True Positives / (True Positives + False Negatives)`

    - Option 2: `True Positives / (True Positives + False Positives)`

    - Option 3: `False Positives / Total predictions`

    - Option 4: `True Negatives / (True Negatives + False Positives)`


    **Correct Response:** 1


    ### Explanation

    `Recall` is the ratio of true positive predictions to the sum of true positives
    and false negatives. It measures the ability to correctly identify all relevant
    instances and is crucial when the cost of false negatives is high, such as in
    medical diagnoses.


    ### Question

    What is the `F1-Score`, and why might you use it instead of Precision and Recall?


    - Option 1: `Harmonic mean of Precision and Recall`

    - Option 2: `Arithmetic mean of Precision and Recall`

    - Option 3: `Geometric mean of Precision and Recall`

    - Option 4: `nan`


    **Correct Response:** 1


    ### Explanation

    The `F1-Score` is the harmonic mean of `Precision` and `Recall`. It balances both
    metrics and is particularly useful when you need to seek a balance between Precision
    and Recall and there is an uneven class distribution.


    ### Question

    What is the `Confusion Matrix`, and what information does it provide about a classification
    model?


    - Option 1: `A matrix representing classification errors`

    - Option 2: `A matrix representing model''s coefficients`

    - Option 3: `A matrix representing model''s hyperparameters`

    - Option 4: `A matrix representing feature importance`


    **Correct Response:** 1

