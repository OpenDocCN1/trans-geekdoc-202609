    ### 问题 1：训练用于评估；测试用于预测

    **正确答案：** 3

    **解释：** 在机器学习中，`training`（训练）数据集用于模型学习模式，而 `testing`（测试）数据集用于评估模型在未见数据上的性能。


    ### 问题 2：哪个术语用于描述一组用于评估机器学习模型性能的输入变量及其对应的目标值集合？

    - 选项 1：验证集

    - 选项 2：：训练集

    - 选项 3：测试集

    - 选项 4：评估集


    **正确答案：** 3

    **解释：** `Testing set`（测试集）是一组用于评估机器学习模型性能的输入变量和相应的目标值。它有助于评估模型在未见数据上的表现如何。


    ### 问题 3：机器学习中的特征（features）与目标（targets）有何不同？为什么两者都是必不可少的？

    - 选项 1：特征是预测值；目标是输入

    - 选项 2：特征是输入；目标是预测值

    - 选项 3：特征和目标是相同的

    - 选项 4：这些定义均不正确


    **正确答案：** 2

    **解释：** `features`（特征）是用于预测的输入变量，而 `targets`（目标）是模型试图预测的值。对于监督学习来说，两者都是必不可少的，使用
    `features` 来预测对应的 `targets`。


    ### 问题 4：将数据集分为训练集和测试集的意义是什么？它如何影响模型评估？

    - 选项 1：改进聚类；影响回归

    - 选项 2：增强训练；减少测试

    - 选项 3：有助于学习；评估泛化能力

    - 选项 4：增强预测；降低准确率


    **正确答案：** 3

    **解释：** 将数据集划分为 `training`（训练）和 `testing`（测试）集有助于模型从 `training` 集中学习模式，并使用 `testing`
    集评估其对未见数据的泛化能力。这确保了模型性能是在训练期间未使用的数据上进行评估的。


    ### 问题 5：解释在构建机器学习模型时特征选择（feature selection）和特征工程（feature engineering）的重要性。

    - 选项 1：提高训练速度；对准确率产生负面影响

    - 选项 2：增强聚类；减少训练时间

    - 选项 3：提高模型性能；降低复杂度

    - 选项 4：增强预测；增加复杂度


    **正确答案：** 3

    **解释：** `feature selection`（特征选择）和 `engineering`（工程）对于提高模型性能和降低复杂度至关重要。它们有助于选择最相关的
    `features` 并对其进行转换以实现最优模型学习，从而可能提高准确性和效率。


    ### 问题 6：在机器学习模型中，对训练和测试使用相同的数据会有什么风险？

    - 选项 1：准确率提高；减少偏差

    - 选项 2：过拟合风险；不现实的性能估计

    - 选项 3：减少训练时间；增加偏差

    - 选项 4：增加复杂度；减少训练时间


    **正确答案：** 2

    **解释：** 使用相同的数据进行 `training`（训练）和`testing`测试）会导致 `overfitting`（过拟合）风险，并提供不现实的性能估计。模型在训练期间已经见过所有数据，因此可能无法很好地泛化到新的、未见的实例。


    ### 问题 7：如何通过训练和测试数据检测过拟合（overfitting）和欠拟（underfitting）？

    - 选项 1：高训练误差检测过拟合；低测试误差检测欠拟

    - 选项 2：低训练误差和高测试误差检测过拟合；高训练和测试误差检测欠拟

    - 选项 3：低训练误差检测欠拟；低测试误差检测过拟合

    - 选项 4：低复杂度检测过拟合；高复杂度检测欠拟


    **正确答案：** 2

    **解释：** 当 `training error`（训练误差）较低但 `testing error`（测试误差）较高时，即可检测到存在 `overfitting`（过拟合），因为模型对训练数据的拟合程度太，但未能泛化。当
    `training` 和 `testing errors`（训练和测试误差）都很高时，即可检测到 `underfitting`（欠拟），表明模型未能捕捉到底层趋势。


    ### 问题 8：描述机器学习中特征、目标、训练和测试概念是如何相互关联的。

    - 选项 1：特征和目标用于聚类；训练和测试用于预测

    - 选项 2：特征和目标无关；训练和测试交替使用

    - 选项 3：特征用于预测目标；训练是学习模式；测试评估性能

    - 选项 4：特征用于预测；目标用于评估；训练和测试无关


    **正确答案：** 3

    **解释：** `features`（特征）是用于预测 `targets`（目标）的输入变量。`training`（训练）涉及从 `features` 中学习模式以预测
    `targets`，而 `testing`（测试）则评估这种学习泛化到未见数据的程度。这些概念对于构建和评估监督学习模型至关重要。


    ### 问题 9：你正在处理一个特征丰富的项目。你如何决定将哪些特征包含在模型中为什么？

    - 选项 1：使用所有特征

    - 选项 2：应用特征选择技术

    - 选项 3：随机挑选特征

    - 选项 4：仅使用数值特征


    **正确答案：** 2

    **解释：** 应用如 `mutual information`（互信息）、`correlation-based methods`（基于相关的方法）或 `tree-based
    methods`（基于树的方法）等 `feature selection`（特征选择）技术有助于移除无关或冗余的 `features`。这通过减少 `overfitting`（过拟合）和提高可解释性提高了模型性能。


    ### 问题 10：在训练准确率高但测试准确率低的情况下，可能存在什么问题？你会如何解决？

    - 选项 1：模型欠拟合

    - 选项 2：模型过拟合

    - 选项 3：训练数据太小

    - 选项 4：测试数据太大


    **正确答案：** 2

    **解释：** 当模型在训练数据上表现良好但在测试数据上表现糟糕时，发生了 `overfitting`（过拟合）。这可能是模型复杂度过高的结果。解决方案包括使用交叉验证、正则化或通过移除不必要的
    `features` 来简化模型。


    ### 问题 11：在获得一个关于目标的明确说明的情况下，你该如何操作以构建预测模型？

    - 选项 1：猜测目标

    - 选项 2：忽略数据

    - 选项 3：咨询领域专家或分析数据

    - 选项 4：构建回归模型


    **正确答案：** 3

    **解释：** 咨询领域专家或通过 `EDA`（探索性数据分析）分析数据有助于识别潜在的 `targets`（目标）和相关性。这种协作和调查的方法确保了预测模型与底层模式和相关领域一致。


    ### 问题 12：你用小训练集和大测试集训练了一个模型。你可能会遇到哪些挑战？如何解决它们？

    - 选项 1：过拟合

    - 选项 2：欠拟

    - 选项 3：同时出现过拟合和欠拟

    - 选项 4：数据完全平衡


    **正确答案：** 3

    **解释：** 小的 `training set`（训练集）可能导致 `overfitting`（过拟合），即模型记忆了训练数据的噪声。相反，如果模型未能捕捉到模式，也可能导致
    `underfitting`（欠拟）。使用交叉验证、`bootstrapping`（自助法）或通过额外的相关数据增加训练集有助于平衡模型的泛化能力。


    ### 问题 13：你被要求为给模型优化特征。你会使用哪些策略？为什么？

    - 选项 1：特征工程

    - 选项 2：特征缩放

    - 选项 3：特征工程和缩放

    - 选项 4：随机特征选择


    **正确答案：** 3


    '
