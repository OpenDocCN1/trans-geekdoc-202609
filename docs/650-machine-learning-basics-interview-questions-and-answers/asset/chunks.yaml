    Explanation: You could explain the interaction effect by stating that the effect
    of one variable on sales depends on the level of another variable. For example,
    the effect of advertising on sales might depend on the season, and the interaction
    term captures this dependency in the model.


    Question: Multicollinearity occurs when two or more independent variables in a
    Multiple Linear Regression model are highly \_\_\_\_\_\_\_\_\_\_\_.


    Option 1: correlated


    Option 2: different


    Option 3: unrelated


    Option 4: significant


    Correct Response: 1


    Explanation: Multicollinearity refers to a situation where two or more independent
    variables in a regression model are highly correlated, making it difficult to
    isolate the effect of individual variables on the dependent variable.


    Question: To detect multicollinearity in a dataset, one common method is to calculate
    the \_\_\_\_\_\_\_\_\_\_\_ Inflation Factor (VIF).


    Option 1: Variance


    Option 2: Variable


    Option 3: Validation


    Option 4: Vector


    Correct Response: 1


    Explanation: The Variance Inflation Factor (VIF) is a measure used to detect multicollinearity.
    It quantifies how much a variable is inflating the standard errors due to its
    correlation with other variables. A high VIF indicates multicollinearity.


    Question: Interaction effects in Multiple Linear Regression can be represented
    by adding a \_\_\_\_\_\_\_\_\_\_\_ term for the interacting variables.


    Option 1: multiplied


    Option 2: additive


    Option 3: subtractive


    Option 4: divided


    Correct Response: 1


    Explanation: Interaction effects are represented by adding a multiplied term for
    the interacting variables in the model. It captures the combined effect that is
    not simply additive and reflects how the response variable changes when both interacting
    variables change together.


    Question: When multicollinearity is present in a dataset, it can make the coefficients
    of the variables \_\_\_\_\_\_\_\_\_\_\_ and hard to interpret.


    Option 1: unstable


    Option 2: stable


    Option 3: reliable


    Option 4: insignificant


    Correct Response: 1


    Explanation: Multicollinearity can make the coefficients of the variables unstable
    and sensitive to small changes in the data. This makes the interpretation of individual
    coefficients unreliable and the model difficult to interpret.


    Question: One method to mitigate multicollinearity is to apply \_\_\_\_\_\_\_\_\_\_\_
    regression, which adds a penalty term to the loss function.


    Option 1: Ridge


    Option 2: Lasso


    Option 3: Logistic


    Option 4: Polynomial


    Correct Response: 1


    Explanation: Ridge regression is a technique that can mitigate multicollinearity
    by adding a penalty term to the loss function. The penalty term helps in reducing
    the effect of correlated variables, leading to more stable coefficients.


    Question: Centering variables in Multiple Linear Regression helps to reduce the
    \_\_\_\_\_\_\_\_\_\_\_ and ease the interpretation of interaction effects.


    Option 1: multicollinearity


    Option 2: mean


    Option 3: variance


    Option 4: complexity


    Correct Response: 1


    Explanation: Centering variables (subtracting the mean) helps to reduce multicollinearity,
    especially when interaction effects are included. This eases the interpretation
    of the coefficients and reduces potential issues related to multicollinearity
    with interaction terms.


    Question: What is Polynomial Regression in the context of Machine Learning?


    Option 1: A type of linear regression


    Option 2: A non-linear regression that fits polynomial equations


    Option 3: An algorithm for clustering


    Option 4: A classification method


    Correct Response: 2


    Explanation: Polynomial Regression is a type of regression analysis that fits
    a polynomial equation to the data. It allows for more complex relationships between
    the dependent and independent variables compared to linear regression.


    Question: How does Polynomial Regression differ from Simple Linear Regression?


    Option 1: It uses more variables


    Option 2: It fits a straight line


    Option 3: It fits a polynomial curve


    Option 4: It is used only for classification


    Correct Response: 3


    Explanation: While Simple Linear Regression fits a straight line to the data,
