    Question: What term is used to refer to a set of input variables and their corresponding
    target values used to evaluate a Machine Learning model''s performance?


    Option 1: Validation set


    Option 2: Training set


    Option 3: Testing set


    Option 4: Evaluation set


    Correct Response: 3


    Explanation: The "Testing set" is a set of input variables and corresponding target
    values used to evaluate a Machine Learning model''s performance. It helps in assessing
    how well the model will perform on unseen data.


    Question: How do features in Machine Learning differ from targets, and why are
    both necessary?


    Option 1: Features are predictions; Targets are input


    Option 2: Features are input; Targets are predictions


    Option 3: Features and targets are the same


    Option 4: None of these definitions are correct


    Correct Response: 2


    Explanation: Features are the input variables used to make predictions, while
    targets are the values the model is trying to predict. Both are necessary for
    supervised learning, where features are used to predict the corresponding targets.


    Question: What is the significance of dividing a dataset into training and testing
    sets, and how does it affect model evaluation?


    Option 1: Improves clustering; Affects regression


    Option 2: Enhances training; Reduces testing


    Option 3: Helps in learning; Assesses generalization


    Option 4: Enhances prediction; Reduces accuracy


    Correct Response: 3


    Explanation: Dividing a dataset into training and testing sets helps the model
    to learn patterns from the training set and assesses its generalization to unseen
    data using the testing set. It ensures that the model''s performance is evaluated
    on data not used during training.


    Question: Explain the importance of feature selection and engineering in building
    a Machine Learning model.


    Option 1: Improves training speed; Affects accuracy negatively


    Option 2: Enhances clustering; Reduces training time


    Option 3: Improves model performance; Reduces complexity


    Option 4: Enhances prediction; Increases complexity


    Correct Response: 3


    Explanation: Feature selection and engineering are vital for improving model performance
    and reducing complexity. They help in choosing the most relevant features and
    transforming them for optimal model learning, thus potentially increasing accuracy
    and efficiency.


    Question: What is the risk of using the same data for both training and testing
    in a Machine Learning model?


    Option 1: Increase in accuracy; Reduction in bias


    Option 2: Risk of overfitting; Unrealistic performance estimates


    Option 3: Reduction in training time; Increase in bias


    Option 4: Increase in complexity; Reduction in training time


    Correct Response: 2


    Explanation: Using the same data for training and testing leads to the risk of
    overfitting and provides unrealistic performance estimates. The model will have
    seen all the data during training, so it might not generalize well to new, unseen
    instances.


    Question: How can overfitting and underfitting be detected through training and
    testing data?


    Option 1: Overfitting detected by high training error; Underfitting by low testing
    error


    Option 2: Overfitting detected by low training error and high testing error; Underfitting
    by high training and testing errors


    Option 3: Underfitting detected by low training error; Overfitting by low testing
    error


    Option 4: Overfitting detected by low complexity; Underfitting by high complexity


    Correct Response: 2


    Explanation: Overfitting is detected when there is low training error but high
    testing error, as the model fits the training data too well but fails to generalize.
    Underfitting is detected when both training and testing errors are high, indicating
    that the model fails to capture underlying trends.


    Question: Describe how the concepts of features, targets, training, and testing
    are interrelated in Machine Learning.


    Option 1: Features and targets are for clustering; Training and testing for prediction


    Option 2: Features and targets are unrelated; Training and testing are used interchangeably


    Option 3: Features are used to predict targets; Training is learning patterns;
    Testing evaluates performance


    Option 4: Features are for prediction; Targets for evaluation; Training and testing
    are unrelated


    Correct Response: 3


    Explanation: Features are the input variables used to predict targets. Training
    involves learning the patterns from features to predict targets, and testing evaluates
    how well this learning generalizes to unseen data. These concepts are essential
    in building and evaluating supervised learning models.


    Question: You are working on a project where you have an abundance of features.
    How do you decide which features to include in your model and why?


    Option 1: Use all features


    Option 2: Apply feature selection techniques


    Option 3: Randomly pick features


    Option 4: Use only numerical features


    Correct Response: 2


    Explanation: Applying feature selection techniques like mutual information, correlation-based
    methods, or tree-based methods helps in removing irrelevant or redundant features.
    This enhances the model''s performance by reducing overfitting and improving interpretability.


    Question: In a situation where the training accuracy is high but the testing accuracy
    is low, what could be the issue, and how might you solve it?


    Option 1: Model is underfitting


    Option 2: Model is overfitting


    Option 3: Training data is too small


    Option 4: Testing data is too large


    Correct Response: 2


    Explanation: Overfitting occurs when a model performs well on the training data
    but poorly on unseen data. This could be a result of high complexity in the model.
    Solutions can include using cross-validation, adding regularizations, or simplifying
    the model by removing unnecessary features or reducing the complexity of the model
    itself.


    Question: You are given a dataset without clear instructions on what the targets
    are. How would you proceed to build a predictive model?


    Option 1: Guess the targets


    Option 2: Ignore the data


    Option 3: Consult with domain experts or analyze the data for insights


    Option 4: Build a regression model directly


    Correct Response: 3


    Explanation: Consulting with domain experts or analyzing the data through exploratory
    data analysis (EDA) can help identify potential targets and correlations within
    the data. This collaborative and investigative approach ensures that the predictive
    model is aligned with the underlying patterns and relevant subject matter.


    Question: You''ve trained a model with a small training set and a large testing
    set. What challenges might you encounter, and how could they be addressed?


    Option 1: Overfitting


    Option 2: Underfitting


    Option 3: Both Overfitting and Underfitting


    Option 4: Data is perfectly balanced


    Correct Response: 3


    Explanation: A small training set might lead to overfitting, where the model memorizes
    noise from the training data. Conversely, it might also lead to underfitting if
    the model fails to capture the underlying pattern. Cross-validation, bootstrapping,
    or augmenting the training set with additional relevant data can help balance
    the model''s ability to generalize.


    Question: You''ve been asked to optimize the features for a given model. What
    strategies might you use, and why?


    Option 1: Feature engineering


    Option 2: Feature scaling


    Option 3: Both feature engineering and scaling


    Option 4: Random feature selection


    Correct Response: 3'
