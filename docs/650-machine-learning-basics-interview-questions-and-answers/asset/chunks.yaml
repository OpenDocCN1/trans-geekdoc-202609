    Explanation: Reinforcement Learning is used in smart energy management systems
    to make real-time decisions. Agents are trained to control energy consumption
    in various components, optimizing efficiency and reducing costs based on immediate
    feedback.


    Question: In what way does Machine Learning support the pharmaceutical industry
    in drug discovery and development?


    Option 1: Supply Chain Management


    Option 2: Marketing Strategies


    Option 3: Image Recognition


    Option 4: Drug Discovery and Development


    Correct Response: 4


    Explanation: Machine Learning supports the pharmaceutical industry by analyzing
    biological data to predict potential drug interactions, identifying promising
    compounds, enhancing drug design, and accelerating the overall drug discovery
    and development process.


    Question: Explain the application of clustering algorithms in customer segmentation
    for marketing strategies.


    Option 1: Text Classification


    Option 2: Clustering Customers


    Option 3: Image Recognition


    Option 4: Supply Chain Management


    Correct Response: 2


    Explanation: Clustering algorithms are used in customer segmentation to group
    customers based on similar characteristics or behaviors. These clusters help marketing
    teams to target specific segments with tailored marketing strategies, improving
    engagement and conversion rates.


    Question: You''re tasked with improving the recommendation system of an e-commerce
    platform. What Machine Learning techniques would you consider implementing?


    Option 1: Collaborative Filtering, Content-Based Filtering


    Option 2: Image Recognition, Text Classification


    Option 3: Supply Chain Optimization, Clustering


    Option 4: Weather Prediction, Fraud Detection


    Correct Response: 1


    Explanation: Collaborative Filtering and Content-Based Filtering are widely used
    in recommendation systems. Collaborative Filtering uses user-item interactions,
    while Content-Based Filtering uses item attributes to make personalized recommendations.


    Question: A hospital wants to utilize Machine Learning to predict patient readmission
    rates. How would you approach this problem?


    Option 1: Clustering, Image Recognition


    Option 2: Supervised Learning, Predictive Modeling


    Option 3: Weather Prediction, Text Classification


    Option 4: Fraud Detection, Supply Chain Management


    Correct Response: 2


