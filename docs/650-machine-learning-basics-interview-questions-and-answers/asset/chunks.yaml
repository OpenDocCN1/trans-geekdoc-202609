    Question: Name a popular algorithm used in classification problems.


    Option 1: Linear Regression


    Option 2: Decision Trees


    Option 3: Clustering


    Option 4: Principal Component Analysis


    Correct Response: 2


    Explanation: Decision Trees are a popular algorithm used in classification problems.
    They work by recursively partitioning the data into subsets based on feature values,
    leading to a decision on the class label.


    Question: How do multi-class classification problems differ from binary classification
    problems?


    Option 1: Multi-class has more features


    Option 2: Multi-class has two classes; binary has multiple


    Option 3: Multi-class has multiple classes; binary has two


    Option 4: No difference


    Correct Response: 3


    Explanation: Binary classification deals with two classes, while multi-class classification
    deals with more than two. Multi-class problems can be more complex and require
    different handling or algorithms compared to binary classification.


    Question: What are the challenges in imbalanced classification problems?


    Option 1: No challenges


    Option 2: Overfitting to the majority class


    Option 3: Equal representation of all classes


    Option 4: Balanced data


    Correct Response: 2


    Explanation: Imbalanced classification problems, where the classes are not equally
    represented, can lead to models that are biased towards the majority class. This
    can result in poor performance on the minority class, requiring special techniques
    to address.


    Question: What is the role of a decision boundary in classification problems?


    Option 1: Separating features


    Option 2: Separating data into clusters


    Option 3: Separating classes in the feature space


    Option 4: Separating training and test data


    Correct Response: 3


    Explanation: A decision boundary is a hypersurface that partitions the underlying
    feature space into classes. It plays a crucial role in determining the class label
    of a new data point based on which side of the boundary it lies.


    Question: Explain the difference between hard and soft classification.


    Option 1: Hard uses algorithms; soft uses manual classification


    Option 2: Hard provides class labels; soft provides class probabilities


    Option 3: Hard requires more data; soft requires less


    Option 4: No difference


    Correct Response: 2


    Explanation: Hard classification provides specific class labels, whereas soft
    classification provides probabilities for each class, allowing for more nuanced
    insights into the confidence of a prediction.


    Question: What are some common performance metrics used in evaluating classification
    models?


    Option 1: Mean Squared Error, R-squared


    Option 2: Precision, Recall, F1 Score


    Option 3: Clustering Coefficient, Density


    Option 4: Eigenvalues, Eigenvectors


    Correct Response: 2


    Explanation: Common performance metrics for classification include Precision (positive
    predictive value), Recall (sensitivity), and F1 Score (harmonic mean of precision
    and recall). These metrics help to assess the model''s ability to correctly classify
    positive cases.


    Question: How does hyperparameter tuning influence the performance of a classification
    model?


    Option 1: No influence


