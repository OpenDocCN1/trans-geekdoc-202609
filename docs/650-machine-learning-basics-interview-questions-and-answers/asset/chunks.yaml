    Question: How do hyperplanes differ in hard-margin SVM and soft-margin SVM?


    Option 1: Color difference


    Option 2: Difference in dimensionality


    Option 3: Flexibility in handling misclassifications


    Option 4: Difference in size


    Correct Response: 3


    Explanation: Hard-margin SVM does not allow any misclassifications, while soft-margin
    SVM provides flexibility in handling misclassifications.


    Question: What role does the regularization parameter ''C'' play in an SVM?


    Option 1: Controls visualization


    Option 2: Controls balance between margin maximization and error minimization


    Option 3: Increases computation time


    Option 4: Reduces data size


    Correct Response: 2


    Explanation: The regularization parameter ''C'' in SVM controls the trade-off
    between maximizing the margin and minimizing classification errors.


    Question: How can you tune hyperparameters in SVM to prevent overfitting?


    Option 1: Increasing data size


    Option 2: Using appropriate kernel and regularization


    Option 3: Changing the color of hyperplane


    Option 4: Reducing feature dimensions


    Correct Response: 2


    Explanation: Tuning hyperparameters like the choice of kernel and regularization
    helps in controlling model complexity to prevent overfitting in SVM.


    Question: What are the limitations of using the linear kernel in SVM, and how
