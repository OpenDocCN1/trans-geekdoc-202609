    Option 1: Apply Reduced Error Pruning or Cost Complexity Pruning


    Option 2: Increase tree depth


    Option 3: Add more features


    Option 4: Use the entire dataset for training


    Correct Response: 1


    Explanation: Applying pruning techniques like Reduced Error Pruning or Cost Complexity
    Pruning reduces the tree''s complexity, leading to a less computationally expensive
