    Question: Explain the assumption of homoscedasticity in Simple Linear Regression.


    Option 1: All Errors are Zero


    Option 2: Equal Variance of Errors for All Values of X


    Option 3: Linearity between Variables


    Option 4: All Variables are Independent


    Correct Response: 2


    Explanation: Homoscedasticity is an assumption that the variability of the errors
    is constant across all levels of the independent variable(s). If this assumption
    is violated, it can lead to inefficiency in the estimates.


    Question: What does the assumption of linearity imply in Simple Linear Regression?


    Option 1: Independent Variable is Linear


    Option 2: Both Variables are Categorized


    Option 3: Relationship between Dependent and Independent Variables is Linear


    Option 4: Dependent Variable is Linear


    Correct Response: 3


    Explanation: The assumption of linearity implies that the relationship between
    the dependent and independent variables is linear. A non-linear relationship may
    lead to biased or inefficient estimates.


    Question: How can you test for multicollinearity in Simple Linear Regression,
    and why is it important?


    Option 1: By Checking Residuals, Reduces Overfitting


    Option 2: By Examining Correlations between Variables, Prevents Confounding Effects


    Option 3: By Checking Accuracy, Improves Prediction


    Option 4: By Checking Variance Inflation Factor (VIF), Prevents Unstable Estimates


    Correct Response: 4


    Explanation: Multicollinearity can be detected by checking the Variance Inflation
    Factor (VIF). It is important as multicollinearity can lead to unstable estimates
    and make it difficult to interpret individual coefficients.


    Question: Explain how the coefficients of Simple Linear Regression can be interpreted
    in terms of correlation.


    Option 1: Coefficients Determine Correlation


    Option 2: Coefficients Indicate No Correlation


    Option 3: Coefficients Represent the Strength and Direction of the Relationship


    Option 4: Coefficients Are Independent of Correlation


    Correct Response: 3


    Explanation: The coefficients in Simple Linear Regression represent the strength
    and direction of the relationship between the dependent and independent variables,
    and they provide information on how changes in one variable are associated with
    changes in the other.


    Question: What could be the potential problems if the assumptions of Simple Linear
    Regression are not met?


    Option 1: No Impact on Model


    Option 2: Model May Overfit


    Option 3: Model May Become Biased or Inefficient


    Option 4: Model Will Always Fail


    Correct Response: 3


    Explanation: If the assumptions of Simple Linear Regression are not met, the model
    may become biased or inefficient, leading to unreliable estimates. It may also
    affect the validity of statistical tests.


    Question: You have fitted a Simple Linear Regression model and discovered heteroscedasticity
    in the residuals. What impact could this have, and how might you correct it?


    Option 1: No Impact, No Correction Required


    Option 2: Inefficiency in Estimates, Transform the Dependent Variable


    Option 3: Biased Estimates, Increase Sample Size


    Option 4: Always Leads to Overfitting, No Correction Possible


    Correct Response: 2


    Explanation: Heteroscedasticity could lead to inefficiency in the estimates, making
