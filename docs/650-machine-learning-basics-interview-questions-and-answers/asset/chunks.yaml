  trans: "\n\n### 问题：\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 方法侧重于寻找能最佳区分不同类别的变量线性组合，这在分类问题中非常有用。\n\
    \n- 选项 1：聚类 (clustering)\n- 选项 2：缩放 (scaling)\n- 选项 3：归一化 (normalization)\n- 选项\
    \ 4：线性判别分析 (Linear Discriminant Analysis)\n\n**正确答案：4**\n\n**解析：** `Linear Discriminant\
    \ Analysis` (`LDA`) 专注于寻找能最佳区分不同类别的特征线性组合。它在目标是区分不同类别或组的分类问题中特别有用。\n\n### 问题：在使用\
    \ `PCA` 时，在应用算法之前必须对数据进行 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 以确保每个特征的贡献相等。\n\n-\
    \ 选项 1：聚类 (clustered)\n- 选项 2：可视化 (visualized)\n- 选项 3：归一化 (normalized)\n- 选项\
    \ 4：转换 (transformed)\n\n**正确答案：3**\n\n**解析：** 在应用 `PCA` 之前，数据必须经过 `normalized`（归一化），以确保每个特征对主成分的贡献相等。数据归一化意味着每个特征的均值为\
    \ `0`，标准差为 `1`，从而没有任何特征主导其他特征。\n\n### 问题：降维通常用于克服 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_ 问题，即当特征数量相对于观测值过多时，会导致过拟合。\n\n- 选项 1：维度灾难 (curse of dimensionality)\n- 选项\
    \ 2：多重共线性 (multicollinearity)\n- 选项 3：缩放 (scaling)\n- 选项 4：过拟合 (overfitting)\n\
    \n**正确答案：4**\n\n**解析：** 当模型相对于数据量和噪声过于复杂时，就会发生 `overfitting`（过拟合）问题，这在特征过多时发生。降维技术可以通过简化特征空间来降低\
    \ `overfitting` 的风险。\n\n### 问题：名为 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 的技术用于非线性降维，提供了一种在保留实例间关系的同时减少维度的方法。\n\
    \n- 选项 1：聚类 (clustering)\n- 选项 2：t-SNE\n- 选项 3：PCA\n- 选项 4：归一化 (normalization)\n\
