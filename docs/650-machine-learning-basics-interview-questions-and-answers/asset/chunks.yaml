    选项 4: 取决于数据


    **正确答案：** 1


    **解释：** 特征选择涉及从原始特征中选取子集，而特征提取涉及将原始特征转换为新集合。特征提取通常产生原始特征的组合，而特征选择保留原始特征但减少其数量。


    ### 问题 13：PCA 机制

    主成分分析（PCA）是如何作为一种降维方法工作的？

    选项 1: 选择主特征

    选项 2: 通过最大化方差

    选项 3: 通过最小化方差

    选项 4: 分类特征


    **正确答案：** 2


    **解释：** 主成分分析（PCA）通过将原始特征转换为一组互不相关的特征（称为主成分）来工作。它是通过最大化这些新轴上的方差来实现的，这意味着第一个主成分解释了最多的方差，第二个次之，以此类推。


    ### 问题 14：PCA 与 LDA

    PCA 和线性线性分析（LDA）作为降维技术的主要区别是什么？

    选项 1: PCA 是无监督的，LDA 是有监督的

    选项 2: PCA 最大化类内方差，LDA 类

    选项 3: 两种技术的方法相同

    选项 4: PCA 是 LDA 的类型


    **正确答案：** 1


    **解释：** PCA 和 LDA 的主要区别在于 PCA 是一种无监督技术，它最大化数据的总方差，而 LDA 是一种监督技术，它最大化类间方差并最小化类内方差。这使得
    LDA 在标签可用时更合适，而 PCA 在没有标签的情况下。


    ### 问题 15：特征值和特征向量

    解释特征值和特征向量在 PCA 中的作用。

    选项 1: 特征值代表方差，特征向量代表方向

    选项 2: 特征值代表方向，特征向量代表方差


    '
