    Option 1: Increase the number of observations


    Option 2: Apply PCA and use principal components


    Option 3: Add interaction terms


    Option 4: Use a non-linear regression model


    Correct Response: 2


    Explanation: Multicollinearity arises when features are highly correlated with
    each other, and it can be mitigated by applying PCA. By transforming the data
    into principal components, which are uncorrelated, the multicollinearity problem
    is resolved. Using the principal components in the regression model ensures that
    the feature relationships are captured without redundancy. Other options do not
    address the issue of multicollinearity directly.


