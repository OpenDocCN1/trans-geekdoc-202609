- raw: 'Explanation: Pruning a Decision Tree leads to a simpler model, which can increase
    bias but reduce variance. This tradeoff helps to avoid overfitting the training
    data and often results in a model that generalizes better to unseen data.


    Question: In the context of Decision Trees, how can overfitting be controlled
    using pruning techniques?


    Option 1: By reducing the tree complexity


    Option 2: By increasing the tree complexity


    Option 3: By reducing the training data


    Option 4: By increasing the number of features


    Correct Response: 1


    Explanation: Overfitting in Decision Trees can be controlled using pruning techniques
    by reducing the tree''s complexity. By removing branches that add little predictive
    power, the model becomes less sensitive to noise in the training data and generalizes
    better to unseen examples.


    Question: Imagine you have a Decision Tree that is overfitting the training data.
    How would you apply pruning to address this issue?


    Option 1: Remove irrelevant branches


    Option 2: Increase tree depth


    Option 3: Use the entire dataset for training


    Option 4: Ignore irrelevant features


    Correct Response: 1


    Explanation: Pruning involves removing branches that have little predictive power,
    reducing the model''s complexity and sensitivity to noise in the training data.
    By removing irrelevant branches, the overfitting issue can be mitigated, and the
    model may generalize better to unseen data.


    Question: You are building a Decision Tree and need to decide between using the
    Gini Index or entropy. How would you make this decision based on the dataset and
    the problem you are trying to solve?


    Option 1: Always use Gini Index


    Option 2: Always use entropy


    Option 3: Choose based on computational efficiency and dataset characteristics


    Option 4: Use both simultaneously


    Correct Response: 3


    Explanation: The choice between Gini Index and entropy depends on computational
    efficiency and dataset characteristics. Gini Index is often faster to compute,
    while entropy might provide slightly different splits. Analyzing the specific
    problem and dataset can guide the optimal choice.


    Question: You are tasked with optimizing a Decision Tree that is underperforming.
    What pruning techniques might you consider, and why?


    Option 1: Cost Complexity Pruning, Reduced Error Pruning


    Option 2: Increase tree depth


    Option 3: Increase the number of features


    Option 4: Add more training data


    Correct Response: 1


    Explanation: Cost Complexity Pruning and Reduced Error Pruning are techniques
    to control the complexity of the tree, preventing overfitting and potentially
    improving performance. They help by removing branches that do not add significant
    predictive power to the model.


    Question: Your Decision Tree is suffering from high bias. How could adjusting
    the parameters related to entropy or the Gini Index help in this scenario?


    Option 1: Increase tree complexity by fine-tuning split criteria


    Option 2: Reduce tree complexity by fine-tuning split criteria


    Option 3: Add more training data


    Option 4: Remove features


    Correct Response: 1


    Explanation: High bias often means the model is too simple. Adjusting the parameters
    related to entropy or the Gini Index to create more complex splits can help capture
    underlying patterns in the data, thereby reducing bias and potentially improving
    predictive accuracy.


