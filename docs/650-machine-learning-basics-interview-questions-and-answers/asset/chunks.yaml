    ## Question 10

    In `Hierarchical Clustering`, the `_\_\_\_\_\_\_\_\_` linkage method considers
    the distance between the closest points of two clusters.


    - Option 1: `Complete Linkage`

    - Option 2: `Single Linkage`

    - Option 3: `Average Linkage`

    - Option 4: `Ward''s Method`


    **Correct Response**: 2


    **Explanation**: `Single Linkage` considers the minimum distance between the closest
    points of two clusters. This can lead to chain-like clusters and is sensitive
    to noise and outliers. It''s useful when we want to identify clusters with irregular
    shapes.

