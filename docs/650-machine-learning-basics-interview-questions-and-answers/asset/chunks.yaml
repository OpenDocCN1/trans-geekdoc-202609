    Option 2: AI requires least data, followed by Machine Learning and Deep Learning


    Option 3: Deep Learning requires most data, Machine Learning less, and AI least


    Option 4: Machine Learning requires most data, followed by AI and Deep Learning


    Correct Response: 3


    Explanation: Deep Learning usually requires the most data to train effectively,
    followed by Machine Learning, with AI generally requiring the least (since AI
    includes non-learning methods).


    Question: How do training techniques differ between traditional Machine Learning
    and Deep Learning?


    Option 1: Deep Learning uses fewer hyperparameters


    Option 2: Machine Learning requires more data


    Option 3: Deep Learning relies on neural networks with multiple layers


    Option 4: Machine Learning uses more complex algorithms


    Correct Response: 3


    Explanation: Deep Learning uses neural networks with multiple layers and various
    training techniques like backpropagation, while traditional Machine Learning may
    use different algorithms and methods.


    Question: What are the limitations of Deep Learning as compared to other Machine
    Learning techniques?


    Option 1: Easier interpretability and requires more data


    Option 2: Requires less data and is more complex


    Option 3: More interpretable and less efficient


    Option 4: Requires more data and is often less interpretable


    Correct Response: 4


    Explanation: Deep Learning typically requires more data for effective training
    and often results in models that are less interpretable compared to traditional
    Machine Learning models.


    Question: How do interpretability and explainability vary between AI, Machine
