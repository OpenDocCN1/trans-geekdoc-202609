    accurate classification.


    Question: \_\_\_\_\_\_\_\_ is a type of classification where there are more than
    two classes.


    Option 1: Binary classification


    Option 2: Imbalanced classification


    Option 3: Overfitting


    Option 4: Multiclass classification


    Correct Response: 4


    Explanation: Multiclass classification refers to the classification problems where
    there are more than two classes to be predicted. This contrasts with binary classification,
    which involves just two classes.


    Question: In classification, the \_\_\_\_\_\_\_\_ metric is often used to evaluate
    the balance between precision and recall.


    Option 1: Accuracy


    Option 2: F1 Score


    Option 3: Mean Squared Error


    Option 4: R-squared


    Correct Response: 2


    Explanation: The F1 Score is the harmonic mean of precision and recall, providing
    a single metric that balances the trade-off between these two important metrics.


    Question: When classifying text data, the \_\_\_\_\_\_\_\_ method can be used
    to convert text into numerical format for analysis.


    Option 1: Clustering


    Option 2: Bag-of-Words


    Option 3: Normalization


    Option 4: Principal Component Analysis


    Correct Response: 2


    Explanation: The Bag-of-Words (BoW) method represents text as a numerical vector
    where each element corresponds to the frequency or presence of a word in the document.
    It is commonly used in text classification tasks.


    Question: The \_\_\_\_\_\_\_\_ technique in classification helps in enhancing
    the model''s ability to generalize by using different subsets of data during training.


    Option 1: Clustering


    Option 2: Overfitting


    Option 3: Cross-validation


    Option 4: Feature extraction


    Correct Response: 3


    Explanation: Cross-validation is a technique where the dataset is partitioned
    into different subsets (folds), and the model is trained and tested on different
    combinations of these folds. It helps in assessing the model''s ability to generalize
    to unseen data.


    Question: What is the primary purpose of using Logistic Regression?


    Option 1: Predicting continuous outcomes


    Option 2: Predicting binary outcomes


    Option 3: Clustering data


    Option 4: Finding correlations


    Correct Response: 2


    Explanation: Logistic Regression is mainly used to predict binary outcomes (e.g.,
    yes/no, true/false). It models the probability that the dependent variable belongs
    to a particular category.


    Question: How does Logistic Regression differ from Linear Regression?


    Option 1: Uses the same equations


    Option 2: Models binary outcomes


    Option 3: Both are used for clustering


    Option 4: No difference


    Correct Response: 2


    Explanation: While Linear Regression is used to predict continuous outcomes, Logistic
    Regression is used to model binary outcomes. They use different mathematical functions
    to accomplish this.


    Question: In Logistic Regression, what function is used to model the probability
    of the dependent variable?


    Option 1: Linear function


    Option 2: Sigmoid function


    Option 3: Polynomial function


    Option 4: Exponential function


    Correct Response: 2


    Explanation: Logistic Regression uses the Sigmoid function to model the probability
    of the dependent variable. It maps any input into a value between 0 and 1, which
    is ideal for binary classification.


    Question: What type of problems is Logistic Regression mainly used to solve?


    Option 1: Regression problems


    Option 2: Clustering problems


    Option 3: Binary classification problems


    Option 4: Unsupervised learning problems


    Correct Response: 3


    Explanation: Logistic Regression is mainly used to solve binary classification
    problems, where the goal is to classify instances into one of two classes.


    Question: What is the Odds Ratio in the context of Logistic Regression?


    Option 1: A type of loss function


    Option 2: A measurement of how changes in one variable affect the odds of a particular
    outcome


    Option 3: A data preprocessing technique


    Option 4: A clustering metric


    Correct Response: 2


    Explanation: The Odds Ratio is a measure that quantifies how a change in one variable
    affects the odds of a particular outcome. In Logistic Regression, it is often
    used to interpret the coefficients of the predictors.


    Question: How is the Logit function related to Logistic Regression?


    Option 1: It is an alternative name for Logistic Regression


    Option 2: It is a type of cost function


    Option 3: It''s the inverse of the Sigmoid function and maps probabilities to
    log-odds


    Option 4: It''s used for multi-class classification


    Correct Response: 3


    Explanation: In Logistic Regression, the Logit function is the inverse of the
    Sigmoid function. It maps probabilities to log-odds and forms the link function
    in logistic modeling.


    Question: Explain how the Odds Ratio is interpreted in Logistic Regression.


    Option 1: As a measure of feature importance


    Option 2: As a probability measure


    Option 3: As a measure that quantifies the effect of a one-unit increase in a
    predictor on the odds of the response


    Option 4: As a clustering metric


    Correct Response: 3


    Explanation: The Odds Ratio in Logistic Regression quantifies the effect of a
    one-unit increase in a predictor variable on the odds of the response variable.
    An Odds Ratio greater than 1 indicates an increase in the odds, and less than
    1 indicates a decrease.


    Question: How does the Logit function transform the probability in Logistic Regression?


    Option 1: Maps probability to odds


    Option 2: Maps probability to log-odds


    Option 3: Maps odds to probability


    Option 4: Maps odds to log-odds


    Correct Response: 2


    Explanation: The Logit function in Logistic Regression takes a probability and
    maps it to log-odds. It''s the inverse of the Sigmoid function used to model probabilities.


    Question: In what situations would it be appropriate to use Logistic Regression
    with the Logit link function?


    Option 1: Multi-class classification


    Option 2: Binary classification with linear relationship between predictors


    Option 3: Binary classification with a nonlinear relationship between predictors


    Option 4: All regression problems


    Correct Response: 2


    Explanation: Logistic Regression with the Logit link function is particularly
    suited for binary classification problems where there is a linear relationship
    between the predictors and the log-odds of the response.


    Question: What are the underlying assumptions of Logistic Regression?


    Option 1: Linearity, Independence, Normality, Equal Variance


    Option 2: Linearity of predictors and log-odds, Independence of errors, No multicollinearity


    Option 3: No assumptions required


    Option 4: Nonlinearity, Dependence, Non-Normality


    Correct Response: 2


    Explanation: Logistic Regression assumes a linear relationship between predictors
    and log-odds, independence of errors, and no multicollinearity among predictors.
    It does not assume normality or equal variance of errors.


    Question: How do you assess the fit of a Logistic Regression model?


    Option 1: Accuracy only


    Option 2: Precision and recall only


    Option 3: Using metrics such as AUC-ROC, confusion matrix, log-likelihood, etc.


