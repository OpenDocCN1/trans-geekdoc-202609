    Option 1: Less complex and easier to train


    Option 2: More complex and easier to interpret


    Option 3: More complex and requires more data and computation


    Option 4: Less complex and requires less data


    Correct Response: 3


    Explanation: Deep Learning models are typically more complex, requiring more data
    and computational resources, which can make training and tuning more challenging.


    Question: What are the hardware requirements for Deep Learning compared to conventional
    Machine Learning algorithms, and why is there a difference?


    Option 1: Similar, as they both require the same computational resources


    Option 2: Less for Deep Learning due to simpler models


    Option 3: More for Deep Learning due to more complex models and parallel processing


    Option 4: More for Machine Learning due to more data requirements


    Correct Response: 3


    Explanation: Deep Learning typically requires more hardware resources, such as
