    ---


    ### Question

    In what scenarios might a custom distance metric be needed in `KNN`, and how would
    you go about implementing it?

    - Option 1: When data is uniform

    - Option 2: When using standardized data

    - Option 3: When data has specific characteristics

    - Option 4: When `K` is very large


    **Correct Response:** 3


    **Explanation:** A custom distance metric might be needed when data has specific
    characteristics that require a particular measure of similarity. Implementation
    involves defining a function that captures these characteristics.


    ---


    ### Question

    How does the curse of dimensionality impact the K-Nearest Neighbors (`KNN`) algorithm,
    and what are some ways to address this issue?

    - Option 1: Improves accuracy, addressed by adding more dimensions

    - Option 2: Reduces accuracy, addressed by increasing `K`

    - Option 3: Makes distance measures less meaningful, addressed by dimension reduction

    - Option 4: Enhances speed, addressed by increasing data size


    **Correct Response:** 3


    **Explanation:** The curse of dimensionality can make distance measures less meaningful
    in `KNN`, and this issue can be addressed through dimensionality reduction techniques
    like `PCA`.


    ---


    ### Question

    Explain how weighting the contributions of the neighbors can improve the `KNN`
    algorithm''s performance.

    - Option 1: Increases bias

    - Option 2: Reduces complexity

    - Option 3: Improves sensitivity to outliers

    - Option 4: Allows more influence from nearer neighbors


    **Correct Response:** 4


    **Explanation:** Weighting the contributions of the neighbors allows nearer neighbors
    to have more influence on the prediction, often leading to improved performance
    in `KNN`.


    ---


    ### Question

    You are given a dataset where the features have different units and scales. How
    would this affect `KNN`, and what should be done to handle this scenario?

    - Option 1: Ignore the scaling

    - Option 2: Perform feature engineering

    - Option 3: Scale the features

    - Option 4: Increase the value of `K`


    **Correct Response:** 3


    **Explanation:** Different units and scales can distort distance measures in `KNN`.
    Scaling the features to a common range can remedy this problem.


    ---


    ### Question

    You implemented the `KNN` algorithm, and the model is performing poorly. What
    are the parameters you would tune, and how would you approach choosing the optimal
    `K` and distance metric?

    - Option 1: Increase `K` and use Euclidean distance

    - Option 2: Use cross-validation to find optimal `K` and distance metric

    - Option 3: Reduce dimensions and use any distance metric

    - Option 4: Use the same `K` for all datasets


    **Correct Response:** 2


    **Explanation:** Utilizing cross-validation helps in finding the optimal value
    of `K` and selecting an appropriate distance metric, leading to improved performance
    in `KNN`.


    ---


    ### Question

    In a situation where the data is densely packed in some regions and sparse in
    others, how would the choice of `K` and distance metric influence the results,
    and what would be the best approach?

    - Option 1: Choose a large `K` and any distance metric

    - Option 2: Choose a small `K` and ignore distance metric

    - Option 3: Choose an appropriate `K` and distance metric, considering data distribution

    - Option 4: Choose a fixed `K` and distance metric


    **Correct Response:** 3


    **Explanation:** Considering the data distribution and choosing an appropriate
    value of `K` and distance metric can help address the issue of varying data density.


    ---


    ### Question

    You are faced with a multi-class classification problem. How would the choice
    of `K` and distance metric affect the KNN algorithm''s ability to differentiate
    between classes?

    - Option 1: It has no effect

    - Option 2: Choice of `K` affects precision, distance metric affects generalization

    - Option 3: Choice of `K` affects recall, distance metric affects speed

    - Option 4: Choice of `K` and distance metric carefully affects differentiation
    between classes


    **Correct Response:** 4


    **Explanation:** The careful selection of `K` and distance metric can greatly
    affect the KNN algorithm''s ability to differentiate between classes in multi-class
    classification.


    ---


    ### Question

    You are using `KNN` for a regression problem. What are the special considerations
    in selecting `K` and the distance metric, and how would you evaluate the model''s
    performance?

    - Option 1: Choose large `K` and any metric, evaluate using accuracy

    - Option 2: Choose small `K` and Euclidean metric, evaluate using precision

    - Option 3: Choose `K` and metric considering data characteristics, evaluate using
    regression metrics

    - Option 4: Choose fixed `K` and Manhattan metric, evaluate using recall


    **Correct Response:** 3


    **Explanation:** Selecting `K` and distance metric considering the data characteristics
    and evaluating the model using regression metrics like `RMSE` or `MAE` is the
    right approach for `KNN` in regression.


    ---


    ### Question

    You notice that your `KNN` model is highly sensitive to outliers. What might be
    causing this, and how could the choice of `K` and distance metric help in alleviating
    this issue?

    - Option 1: Outliers have no effect

    - Option 2: Choose a small `K` and ignore outliers

    - Option 3: Choose a larger `K` and an appropriate distance metric to mitigate
    sensitivity

    - Option 4: Focus only on the majority class


    **Correct Response:** 3

