    Question: What is regression in the context of Machine Learning?


    Option 1: A method for classification


    Option 2: A method for clustering


    Option 3: A method for predicting a continuous output


    Option 4: A method for text analysis


    Correct Response: 3


    Explanation: Regression in Machine Learning is a supervised learning technique
    used to predict a continuous output or numerical value based on input variables.


    Question: Which type of regression would be suitable for predicting a continuous
    output?


    Option 1: Logistic Regression


    Option 2: Linear Regression


    Option 3: Cluster Regression


    Option 4: K-Nearest Neighbors


    Correct Response: 2


    Explanation: Linear Regression is suitable for predicting a continuous output,
    as it models the relationship between dependent and independent variables through
    a linear equation.


    Question: How does linear regression differ from nonlinear regression?


    Option 1: They differ in the number of variables used


    Option 2: They differ in the complexity of the model


    Option 3: They differ in the accuracy of predictions


    Option 4: They differ in the number of outputs


    Correct Response: 2


    Explanation: Linear regression assumes a linear relationship between the dependent
    and independent variables, while nonlinear regression can model more complex relationships
    that are not strictly linear.


    Question: What does the term "multicollinearity" mean in the context of regression?


    Option 1: Multiplying the coefficients


    Option 2: Multiple regression models


    Option 3: High correlation between predictor variables


    Option 4: Multiple target variables


    Correct Response: 3


    Explanation: Multicollinearity refers to a situation where predictor variables
    in a regression model are highly correlated with each other, which can make it
    challenging to interpret the individual effects of predictors.


    Question: How is the coefficient of determination (R-Squared) used in regression
    analysis?


    Option 1: To detect multicollinearity


    Option 2: To describe the correlation between variables


    Option 3: To measure the goodness of fit of the model


    Option 4: To select the best features


    Correct Response: 3


    Explanation: The coefficient of determination (R-Squared) is used to measure how
    well the regression model fits the observed data. It represents the proportion
    of variation in the dependent variable that is explained by the independent variables.


    Question: What''s the difference between simple linear regression and multiple
    linear regression?


    Option 1: One uses time series data, the other doesn''t


    Option 2: One uses one predictor, the other uses more than one


    Option 3: One is for classification, the other for regression


    Option 4: One is linear, the other is nonlinear


    Correct Response: 2


    Explanation: Simple linear regression involves one independent variable to predict
    the dependent variable, while multiple linear regression uses two or more independent
    variables for prediction.


    Question: Can you explain the assumptions underlying linear regression?


    Option 1: Normality of residuals, Constant variance, Independence of residuals,
    Linearity of relationship


    Option 2: Independence of features, Normality of target variable, Linearity of
    relationship, Constant variance


    Option 3: Normality of residuals, Linearity of relationship, Multicollinearity,
    Independence of features


    Option 4: Normal distribution of errors, Linearity of relationship, Independence
    of residuals, Constant variance


    Correct Response: 4


    Explanation: Linear regression assumes that the relationship between the dependent
    and independent variables is linear, errors are normally distributed, residuals
    are independent, and the variance of residuals is constant across all levels of
    the independent variables. These assumptions guide the model''s performance and
    interpretation.


    Question: What are the advantages and limitations of using Ridge regression over
    ordinary linear regression?


    Option 1: Reduces overfitting, Tackles multicollinearity, Lower bias, Lower variance


    Option 2: Increases bias, Reduces variance, Tackles multicollinearity, Can cause
    underfitting


    Option 3: Reduces overfitting, Increases variance, Lower bias, Lower variance


    Option 4: Increases bias, Reduces variance, Reduces multicollinearity, Can cause
    overfitting


    Correct Response: 2


    Explanation: Ridge regression helps in reducing overfitting by penalizing large
    coefficients through L2 regularization. It can handle multicollinearity but increases
    bias, potentially leading to underfitting. Ordinary linear regression lacks these
    regularization properties.


    Question: How does Lasso regression differ from Ridge regression?


    Option 1: Lasso uses L1 regularization, Ridge uses L2


    Option 2: Lasso uses L2 regularization, Ridge uses L1


    Option 3: Both use L1 regularization


    Option 4: Both use L2 regularization


    Correct Response: 1


    Explanation: Lasso (Least Absolute Shrinkage and Selection Operator) regression
    uses L1 regularization, which can lead to some coefficients being exactly zero,
    thus performing feature selection. Ridge regression uses L2 regularization, which
    shrinks the coefficients but doesn''t set them to zero. These different regularization
    techniques define their behavior and application.


    Question: In what scenarios would you prefer Polynomial Regression over Simple
    Linear Regression?


    Option 1: When the relationship is linear


    Option 2: When the relationship is quadratic or higher-order


    Option 3: When the relationship is logarithmic


    Option 4: When the data is categorical


    Correct Response: 2


    Explanation: Polynomial Regression is preferred over Simple Linear Regression
    when the relationship between the dependent and independent variables is not linear
    but can be modeled as a polynomial (quadratic, cubic, etc.). Polynomial regression
    can capture more complex patterns in the data, making it suitable for non-linear
    relationships.


    Question: Explain how the ElasticNet regression combines the properties of Ridge
    and Lasso regression.


    Option 1: By using both L1 and L2 regularization


    Option 2: By alternating between L1 and L2 regularization


    Option 3: By using a weighted average of L1 and L2


    Option 4: By using neither L1 nor L2 regularization


    Correct Response: 1


    Explanation: ElasticNet regression combines the properties of Ridge and Lasso
    by using both L1 and L2 regularization. This hybrid approach combines Lasso''s
    ability to perform feature selection with Ridge''s ability to handle multicollinearity,
    providing a balance that can be fine-tuned using hyperparameters.


    Question: How can you assess the accuracy and reliability of a regression model''s
    predictions?


    Option 1: Through classification metrics


    Option 2: Through clustering metrics


    Option 3: Through regression metrics like RMSE, R-Squared, MAE


    Option 4: Through text analysis


    Correct Response: 3


    Explanation: The accuracy and reliability of a regression model''s predictions
    can be assessed through regression metrics like Root Mean Squared Error (RMSE),
    R-Squared, Mean Absolute Error (MAE), etc. These metrics provide quantitative
    measures of how well the model''s predictions align with the actual values, considering
    both the direction and magnitude of errors.


    Question: Imagine you have a dataset where the relationship between the variables
    is cubic. What type of regression would be appropriate, and why?


    Option 1: Linear Regression


    Option 2: Polynomial Regression of degree 3


    Option 3: Logistic Regression


    Option 4: Ridge Regression


    Correct Response: 2'
