    Question: You have two datasets: one with 10,000 instances and one with 100,000.
    How would the size of the datasets impact the choice of Machine Learning algorithm?


    Option 1: Larger datasets always require more complex models


    Option 2: Size doesn’t impact the choice of algorithm


    Option 3: Larger datasets may require more careful consideration of computational
    efficiency


    Option 4: Size only impacts the choice of hyperparameters


    Correct Response: 3


    Explanation: Larger datasets may require more computational resources, so choosing
    an algorithm that can handle the computational complexity might be critical. The
    choice might not be solely determined by the size, but it can certainly impact
    the decision.


    Question: In a text classification task, why might you choose a Naive Bayes classifier
    over a more complex model like a deep learning algorithm?


    Option 1: Naive Bayes always outperforms deep learning


    Option 2: Deep learning is not suitable for text classification


    Option 3: Naive Bayes might be preferred for its simplicity and efficiency, especially
    with limited data


    Option 4: Deep learning requires less preprocessing


    Correct Response: 3


    Explanation: Naive Bayes is a probabilistic classifier that can be simpler and
    more computationally efficient, especially when dealing with small or medium-sized
    datasets. In contrast, deep learning models might require more data and computational
    resources.


    Question: A company wants to predict customer churn based on historical data.
    What considerations must be made in selecting and tuning a Machine Learning model
    for this task?


    Option 1: Selecting the most complex model available


    Option 2: Ignoring feature engineering


    Option 3: Considering the business context, available data, model interpretability,
    and performance metrics


    Option 4: Focusing only on accuracy


    Correct Response: 3


    Explanation: Predicting customer churn requires understanding the business context,
    the nature of the data, and the need for model interpretability. Metrics such
    as precision, recall, and F1-score might be more relevant than mere accuracy.


    Question: In developing a recommendation system, how would collaborative filtering
    be implemented, and what challenges might arise?


    Option 1: By analyzing only the content of the items


    Option 2: By leveraging user-item interactions and facing challenges such as cold
    start and data sparsity


    Option 3: By ignoring user preferences


    Option 4: By analyzing only user behavior without considering items


    Correct Response: 2


    Explanation: Collaborative filtering uses user-item interactions to make recommendations,
    often facing challenges such as the cold start problem (new users/items with no
    interactions) and data sparsity (limited interactions available).


    Question: You are working with a medical dataset to predict a particular disease.
    What ethical considerations must be taken into account when building and deploying
    this model?


    Option 1: Focus only on achieving high accuracy


    Option 2: Ignore privacy and consent


    Option 3: Consider fairness, transparency, privacy, and informed consent


    Option 4: Ignore the potential biases in the data


    Correct Response: 3


    Explanation: Ethical considerations in medical predictions include ensuring fairness
    (avoiding biases), transparency (explainability), privacy (protecting sensitive
    information), and obtaining informed consent from the patients.


    Question: How would you approach the problem of data leakage during the preprocessing
    and modeling phase of a Machine Learning project?


    Option 1: Ignore the problem as it has no impact


    Option 2: Split the data before any preprocessing and carefully handle information
    from the validation/test sets


    Option 3: Mix the test and training data for preprocessing


    Option 4: Use the same preprocessing techniques on all data regardless of splitting


    Correct Response: 2


    Explanation: To prevent data leakage, it''s crucial to split the data before any
    preprocessing, ensuring that information from the validation or test sets doesn''t
    influence the training process. This helps maintain the integrity of the evaluation.


    Question: In the context of Machine Learning, the term \_\_\_\_\_\_\_\_\_ refers
    to the algorithm''s ability to generalize from the training data to unseen data.


    Option 1: Overfitting


    Option 2: Optimization


    Option 3: Generalization


    Option 4: Regularization


    Correct Response: 3


    Explanation: Generalization refers to the model''s ability to make accurate predictions
    on new, unseen data, as opposed to fitting only to the training data.


    Question: \_\_\_\_\_\_\_\_\_ learning is a type of Machine Learning where the
    model learns by interacting with an environment to achieve a goal.


    Option 1: Supervised


    Option 2: Unsupervised


    Option 3: Reinforcement


    Option 4: Semi-supervised


    Correct Response: 3


    Explanation: Reinforcement learning is a type of learning where an agent learns
    to make decisions by interacting with an environment, receiving feedback in the
    form of rewards or penalties.


    Question: The process of fine-tuning a Machine Learning model by changing its
    settings or \_\_\_\_\_\_\_\_\_ is vital for achieving optimal performance.


    Option 1: Features


    Option 2: Hyperparameters


    Option 3: Algorithms


    Option 4: Targets


    Correct Response: 2


    Explanation: Hyperparameters are the settings or parameters of a machine learning
    model that are defined prior to training and are fine-tuned to optimize performance.


    Question: If a model performs well on the training data but poorly on the validation
    data, it may be suffering from \_\_\_\_\_\_\_\_\_.


    Option 1: Underfitting


    Option 2: Generalization


    Option 3: Optimization


    Option 4: Overfitting


    Correct Response: 4


    Explanation: Overfitting occurs when a model fits too closely to the training
    data and captures noise, leading to poor performance on unseen data such as the
    validation set.


    Question: The \_\_\_\_\_\_\_\_\_ is a crucial aspect of a Machine Learning model
    that quantifies how well the model''s predictions match the actual targets.


    Option 1: Loss function


    Option 2: Learning rate


    Option 3: Activation function


    Option 4: Optimization algorithm


    Correct Response: 1


    Explanation: The loss function quantifies the difference between the predicted
    values and the actual targets, guiding the learning process.


    Question: In unsupervised learning, the model learns to find patterns and structures
    from \_\_\_\_\_\_\_\_\_ data, where no specific output values are provided.


    Option 1: Labelled


    Option 2: Unlabelled


    Option 3: Sparse


    Option 4: Balanced


    Correct Response: 2


    Explanation: In unsupervised learning, the model learns from unlabeled data, finding
    hidden patterns and structures without specific output values or guidance.


    Question: What is the broad field of study that encompasses Machine Learning,
    Deep Learning, and other computational techniques to enable intelligent decision-making?


    Option 1: Deep Learning


    Option 2: Computational Science


    Option 3: Artificial Intelligence


    Option 4: Data Mining


    Correct Response: 3


    Explanation: Artificial Intelligence (AI) is the broad field that includes Machine
    Learning, Deep Learning, and other techniques aimed at creating intelligent systems.


    Question: Which term refers to a subset of AI that deals with algorithms designed
    to identify patterns and make decisions with minimal human intervention?


    Option 1: Data Mining


    Option 2: Neural Networks


    Option 3: Machine Learning


    Option 4: Robotics


    Correct Response: 3'
