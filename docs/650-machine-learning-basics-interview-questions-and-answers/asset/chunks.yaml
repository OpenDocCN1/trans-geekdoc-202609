    ### Regularization Overview

    Explanation: Regularization is a technique to reduce overfitting by adding a penalty
    term to the loss function. Common techniques include `L1` (lasso) and `L2` (ridge)
    regularization, which penalize large coefficients in a model.


    ### Question: What is the concept of Polynomial Regression?

    - Option 1: Linear equation with multiple variables

    - Option 2: Non-linear equation with one variable

    - Option 3: Non-linear equation using polynomial features

    - Option 4: Linear equation with one variable


    **Correct Response: 3**


    Explanation: `Polynomial Regression` is a form of regression analysis where the
    relationship between the independent variable and the dependent variable is modeled
    as a polynomial. It allows for more complex relationships by including polynomial
    terms in the regression equation.


    ### Question: Can you differentiate between Logistic Regression and K-Nearest
    Neighbors (KNN) in terms of use case and functionality?

    - Option 1: `LR` is for classification, `KNN` for regression; `LR` uses probability,
    `KNN` uses distance

    - Option 2: `LR` is for regression, `KNN` for classification; `LR` uses distance,
    `KNN` uses probability

    - Option 3: `LR` is for classification, `KNN` for regression; `LR` uses distance,
    `KNN` uses probability

    - Option 4: `LR` is for classification, `KNN` for classification; `LR` uses probability,
    `KNN` uses distance


    **Correct Response: 4**


    Explanation: `Logistic Regression` is used for classification and models the probability
    of a binary outcome. `KNN` is also used for classification but works by considering
    the ''K'' nearest data points. The fundamental difference lies in the approach:
    `LR` uses a logistic function, while `KNN` uses distance metrics.


    ### Question: Explain how a Decision Tree works in the context of Machine Learning.

    - Option 1: Based on entropy, splits data at each node

    - Option 2: Based on distance, groups data at each node

    - Option 3: Based on gradient, organizes data at each node

    - Option 4: Based on complexity, combines data at each node


    **Correct Response: 1**


    Explanation: A `Decision Tree` works by splitting the data into subsets based
    on feature values. This is done recursively at each node by selecting the feature
    that provides the best split according to a metric like `entropy` or `Gini impurity`.
    The process continues until specific criteria are met, creating a tree-like structure.


    ### Question: What is the principle behind the Random Forest algorithm?

    - Option 1: Single decision tree, increased bias

    - Option 2: Ensemble of trees, reduced variance

    - Option 3: Ensemble of trees, increased complexity

    - Option 4: Single decision tree, reduced bias


    **Correct Response: 2**


    Explanation: `Random Forest` is an ensemble learning method that operates by constructing
    multiple decision trees during training and outputs the mode of the classes for
    classification or the mean prediction of individual trees for regression. By combining
    many trees, it generally reduces overfitting and provides a more accurate prediction.


    ### Question: Can you explain the main types of clustering in Unsupervised Learning?

    - Option 1: Hierarchical, Divisive

    - Option 2: Hierarchical, `K-Means`, Gaussian Mixture

    - Option 3: Divisive, `K-Means`, Gaussian Mixture

    - Option 4: `K-Means`, Hierarchical, Neural Network


    **Correct Response: 2**


    Explanation: `Clustering` in `Unsupervised Learning` refers to grouping data points
    that are similar to each other. The main types include `Hierarchical` (building
    nested clusters), `K-Means` (partitioning data into ''K'' clusters), and `Gaussian
    Mixture` (using probability distributions to form clusters).


    ### Question: In a situation where the features in your dataset are at very different
    scales, which regularization technique would you choose and why?

    - Option 1: `L1 Regularization` because of sparsity

    - Option 2: `L2 Regularization` because of scalability

    - Option 3: `L1 Regularization` because of complexity

    - Option 4: `L2 Regularization` because of sensitivity to noise


    **Correct Response: 2**


    Explanation: `L2 Regularization` (`Ridge`) would be chosen when features are at
    different scales because it scales the coefficients without completely eliminating
    them, preserving information. It can prevent overfitting while considering all
    features.


    ### Question: You''re given a dataset with several features, some of which are
    highly correlated. How would you handle this using dimensionality reduction techniques?

    - Option 1: Applying `K-Means Clustering`

    - Option 2: Applying `Principal Component Analysis (PCA)`

    - Option 3: Applying `Random Forest`

    - Option 4: Applying `L1 Regularization`


    **Correct Response: 2**


    Explanation: `Principal Component Analysis` (`PCA`) would be used to handle high
    correlation among features. It reduces dimensionality by creating new uncorrelated
    variables that capture the variance present in the original features.


    ### Question: You''ve built a classification model, but it''s highly sensitive
    to changes in the test data. What could be the issue and how would you fix it?

    - Option 1: Overfitting; Cross-validation

    - Option 2: Underfitting; Add more features

    - Option 3: Overfitting; Increase regularization

    - Option 4: Underfitting; Use different model


    **Correct Response: 1**


    Explanation: The issue could be `overfitting`, where the model performs well on
    training data but poorly on unseen data. Fixing this might involve using `cross-validation`
