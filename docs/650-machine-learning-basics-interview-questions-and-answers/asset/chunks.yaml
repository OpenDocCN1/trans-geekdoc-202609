    Option 4: transformed


    Correct Response: 3


    Explanation: Before applying PCA, the data must be normalized to ensure that each
    feature contributes equally to the principal components. Normalizing the data
    means that each feature will have a mean of 0 and a standard deviation of 1, thus
    ensuring that no feature dominates the others.


    Question: Dimensionality reduction is often used to overcome the \_\_\_\_\_\_\_\_\_\_\_
    problem, where having too many features relative to the number of observations
    can lead to overfitting.


    Option 1: curse of dimensionality


    Option 2: multicollinearity


    Option 3: scaling


    Option 4: overfitting


    Correct Response: 4


    Explanation: The overfitting problem occurs when a model is too complex relative
    to the amount and noise of the data, which can happen when there are too many
    features. Dimensionality reduction techniques can help by simplifying the feature
    space, reducing the risk of overfitting.


    Question: The technique called \_\_\_\_\_\_\_\_\_\_\_ can be used for nonlinear
    dimensionality reduction, providing a way to reduce dimensions while preserving
    the relationships between instances.


    Option 1: clustering


    Option 2: t-SNE


    Option 3: PCA


    Option 4: normalization


    Correct Response: 2


    Explanation: t-SNE (t-distributed Stochastic Neighbor Embedding) is a technique
    used for nonlinear dimensionality reduction. It''s effective at preserving the
    relationships between instances in the reduced space, making it suitable for complex
    datasets where linear methods like PCA might fail.


    Question: What is the primary goal of Principal Component Analysis (PCA) in data
    analysis?


    Option 1: Reducing computation time


    Option 2: Maximizing the variance of the data


    Option 3: Clustering data


    Option 4: Removing all outliers


    Correct Response: 2


    Explanation: The primary goal of PCA is to transform the data into a new coordinate
    system where the variance is maximized. This helps in reducing dimensions while
    preserving as much information as possible in the main components.


    Question: In PCA, what do Eigenvalues represent?


    Option 1: Amount of variance explained by each component


    Option 2: Direction of the new coordinate system


    Option 3: Scale of the data


    Option 4: Noise in the data


    Correct Response: 1


    Explanation: Eigenvalues in PCA represent the amount of variance that is accounted
    for by each corresponding eigenvector. The larger the eigenvalue, the more variance
    the principal component explains.


    Question: In the context of PCA, what is the role of Eigenvectors?


    Option 1: Representing noise in the data


    Option 2: Representing the direction of maximum variance


    Option 3: Representing outliers in the data


    Option 4: Normalizing the data


    Correct Response: 2


    Explanation: Eigenvectors in PCA represent the direction of maximum variance in
    the data. They define the directions along which the original data is projected
    to create the principal components.


    Question: How is the amount of variance explained related to Eigenvalues in PCA?


    Option 1: Smaller eigenvalues explain more variance


    Option 2: Eigenvalues are unrelated to variance


    Option 3: Larger eigenvalues explain more variance


    Option 4: Eigenvalues represent the mean of the data


    Correct Response: 3


    Explanation: In PCA, the amount of variance explained by each principal component
    is directly related to its corresponding eigenvalue. Larger eigenvalues mean that
    more variance is explained by that particular component.


    Question: What does the first principal component in PCA represent?


    Option 1: The least amount of variance in the data


    Option 2: The direction of minimum variance


    Option 3: The direction of maximum variance


    Option 4: The mean of the data


    Correct Response: 3


    Explanation: The first principal component in PCA represents the direction of
    maximum variance in the data. It''s the line (or hyperplane in higher dimensions)
    that best captures the structure of the data by explaining the most variance.


    Question: Can you briefly explain how Eigenvectors are used in PCA?


    Option 1: To normalize the data


    Option 2: To calculate the mean of the data


    Option 3: To determine the direction of maximum variance


    Option 4: To cluster the data


    Correct Response: 3


    Explanation: Eigenvectors are used in PCA to determine the directions of maximum
    variance in the data. They define the axes along which the data is projected to
    form the principal components, preserving most of the information.


    Question: How can the Eigenvalues in PCA be used to determine the significance
    of the corresponding Eigenvectors?


    Option 1: By indicating the mean of each eigenvector


    Option 2: By defining the direction of the eigenvectors


    Option 3: By showing the noise in the data


    Option 4: By representing the amount of variance captured


    Correct Response: 4


    Explanation: In PCA, eigenvalues are used to determine the significance of the
    corresponding eigenvectors by representing the amount of variance captured by
    each component. The larger the eigenvalue, the more significant the component.


    Question: Explain the process of selecting the number of principal components
    in PCA.


    Option 1: By selecting all eigenvectors


    Option 2: By using the elbow method and the cumulative explained variance


    Option 3: By choosing an arbitrary number


    Option 4: By using only the first eigenvector


    Correct Response: 2


    Explanation: The number of principal components in PCA can be selected by considering
    the cumulative explained variance and looking for an "elbow" in the plot, where
    adding more components does not significantly increase the explained variance.


    Question: What is the mathematical relationship between Eigenvalues and Eigenvectors
    in PCA?


    Option 1: They are the same


    Option 2: They are inversely related


    Option 3: Eigenvalues are scalar multiples of eigenvectors


    Option 4: They are unrelated


    Correct Response: 3


    Explanation: In PCA, eigenvalues and eigenvectors have a mathematical relationship
    where the eigenvalues are scalar multiples of the eigenvectors. They form the
    eigenvalue-eigenvector equation for the covariance matrix.


    Question: How is the amount of variance explained calculated in PCA?


    Option 1: By summing all eigenvalues


    Option 2: By dividing each eigenvalue by the sum of all eigenvalues


    Option 3: By multiplying the eigenvalues with the mean


    Option 4: By taking the square root of the eigenvalues


    Correct Response: 2


    Explanation: The amount of variance explained by each principal component in PCA
    is calculated by dividing the corresponding eigenvalue by the sum of all eigenvalues,
    and often expressed as a percentage.


    Question: What are the potential drawbacks of using PCA for dimensionality reduction?


    Option 1: It always improves model performance


    Option 2: It removes all noise and outliers


    Option 3: It can lead to information loss and doesn''t consider class labels


    Option 4: It normalizes the variance of the data


    Correct Response: 3


    Explanation: The potential drawbacks of using PCA include the risk of information
    loss since it only considers variance, not class labels, and might remove meaningful
    information that doesn''t align with the directions of maximum variance.'
