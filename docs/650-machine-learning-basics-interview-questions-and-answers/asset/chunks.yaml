- raw: 'Question: Can you discuss the geometric interpretation of Eigenvectors in
    PCA?


    Option 1: They represent clusters in the data


    Option 2: They define the scaling of the data


    Option 3: They define the direction of maximum variance


    Option 4: They align with the mean of the data


    Correct Response: 3


    Explanation: Geometrically, eigenvectors in PCA define the direction of maximum
    variance in the data. They are the axes along which the original data is projected,
    transforming it into a new coordinate system where variance is maximized.


    Question: You have a dataset with many correlated features, and you decide to
    use PCA. How would you determine which Eigenvectors to keep?


    Option 1: By choosing the eigenvectors with the highest eigenvalues


    Option 2: By selecting the eigenvectors with negative eigenvalues


    Option 3: By randomly selecting eigenvectors


    Option 4: By using all eigenvectors without exception


    Correct Response: 1


    Explanation: You would keep the eigenvectors corresponding to the highest eigenvalues,
    as they explain the most variance in the data. The lower the eigenvalue, the less
    significant the corresponding eigenvector.


    Question: You have applied PCA to your dataset and the first three principal components
    explain 95% of the variance. What does this signify, and how would you proceed?


    Option 1: This means that 5% of the data is missing, so you should reapply PCA


    Option 2: This means that 95% of the variance is captured, so you may choose to
    proceed with these components


    Option 3: This indicates an error in the PCA process


    Option 4: This means that the data is uniformly distributed and PCA is not needed


    Correct Response: 2


    Explanation: The first three principal components explaining 95% of the variance
    means that most of the original information is captured, and you may proceed with
    these components if the loss of 5% is acceptable.


    Question: After applying PCA to your dataset, you find that some Eigenvectors
    have very small corresponding Eigenvalues. What does this indicate, and what action
    might you take?


    Option 1: This indicates a problem with the data and you must discard it


    Option 2: This indicates that these eigenvectors capture little variance, and
    you may choose to discard them


    Option 3: This means that you must include these eigenvectors


    Option 4: This is an indication that PCA is not suitable for your data


    Correct Response: 2


    Explanation: Very small eigenvalues indicate that the corresponding eigenvectors
    capture little variance, and discarding them would reduce dimensions without losing
    much meaningful information.


    Question: You''ve applied PCA but the variance explained by the first few components
    is very low. What could be the underlying issue and how might you remedy it?


    Option 1: The data is too complex for PCA, so you should switch algorithms


    Option 2: The data is not centered, so you should center it before applying PCA


    Option 3: The data has no variance, so PCA is not applicable


    Option 4: The eigenvalues have been miscalculated and you should recalculate them


    Correct Response: 2


    Explanation: If the variance explained by the first few components is very low,
    it may be because the data is not centered. Centering the data by subtracting
    the mean is a necessary preprocessing step for PCA.


    Question: In a scenario where dimensionality reduction is essential but preserving
    the original features'' meaning is also crucial, how would you approach using
    PCA?


    Option 1: You would avoid PCA and use another method


    Option 2: You would perform PCA on a subset of the original features


    Option 3: You would use PCA without considering the original features'' meaning


    Option 4: You would carefully interpret the principal components in terms of original
    features


    Correct Response: 4


    Explanation: In this scenario, careful interpretation of the principal components
    in terms of the original features would be the key to preserve their meaning while
    still benefiting from dimensionality reduction.


    Question: You are working with a large dataset, and you want to reduce its dimensionality
    using PCA. How would you decide the number of principal components to retain,
    considering the amount of variance explained?


    Option 1: By always selecting the first two components


    Option 2: By retaining components explaining at least a predetermined threshold
    of variance


    Option 3: By consulting with domain experts


    Option 4: By always retaining all principal components


    Correct Response: 2


    Explanation: The number of principal components to retain can be decided based
    on a predetermined threshold of variance explained. For example, you may choose
    to keep components that together explain at least 95% of the total variance.


    Question: In PCA, the Eigenvectors are also known as the \_\_\_\_\_\_\_\_ of the
    data.


    Option 1: directions


    Option 2: components


    Option 3: principal directions


    Option 4: eigendata


    Correct Response: 3


    Explanation: In PCA, the Eigenvectors, also known as the "principal directions,"
    define the directions in which the data varies the most. They form the axes of
    the new feature space and capture the essential structure of the data.


    Question: The Eigenvalue corresponding to each principal component in PCA determines
    the \_\_\_\_\_\_\_\_ of that component.


    Option 1: direction


    Option 2: magnitude


    Option 3: normalization


    Option 4: scaling


    Correct Response: 2


    Explanation: In PCA, the Eigenvalue corresponding to a principal component determines
    its "magnitude," representing the amount of variance that component explains in
    the original data. A higher Eigenvalue indicates more significant variance explained
    by that component.


    Question: The percentage of total variance explained by a principal component
    in PCA can be calculated by dividing the Eigenvalue of that component by the \_\_\_\_\_\_\_\_.


    Option 1: sum of all Eigenvalues


    Option 2: magnitude of Eigenvectors


    Option 3: number of components


    Option 4: number of Eigenvectors


    Correct Response: 1


    Explanation: The percentage of total variance explained by a principal component
    is calculated by dividing its Eigenvalue by the "sum of all Eigenvalues." This
    ratio gives the proportion of the dataset''s total variance that is captured by
    that specific component.


    Question: In PCA, if an Eigenvalue is close to zero, it indicates that the corresponding
    Eigenvector may \_\_\_\_\_\_\_\_.


    Option 1: be discarded


    Option 2: explain high variance


    Option 3: be a principal component


    Option 4: be of high magnitude


    Correct Response: 1


    Explanation: If an Eigenvalue in PCA is close to zero, it means that the corresponding
    Eigenvector (principal direction) may "be discarded" as it explains very little
    variance within the data. This can help in reducing dimensionality while retaining
    essential information.


    Question: The \_\_\_\_\_\_\_\_ component in PCA explains the highest amount of
    variance within the data.


    Option 1: last


    Option 2: first


    Option 3: median


    Option 4: random


    Correct Response: 2


    Explanation: The "first" principal component in PCA explains the highest amount
    of variance within the data. It is aligned with the direction of the maximum spread
    of the data and forms the most substantial part of the dataset''s structure.


    Question: In the context of PCA, the \_\_\_\_\_\_\_\_ are unit vectors that define
    the directions of maximum variance, whereas the \_\_\_\_\_\_\_\_ represent the
    magnitude of variance in those directions.


    Option 1: Eigenvectors, Eigenvalues


    Option 2: Eigenvalues, Eigenvectors


    Option 3: principal components, Eigenvectors


    Option 4: principal directions, magnitudes


    Correct Response: 1


    Explanation: In PCA, the "Eigenvectors" are unit vectors that define the directions
    of maximum variance in the data, whereas the "Eigenvalues" represent the magnitude
    of variance in those directions. Together, they form the core mathematical components
    of PCA.


    Question: What is the primary goal of Linear Discriminant Analysis (LDA) in machine
    learning?'
