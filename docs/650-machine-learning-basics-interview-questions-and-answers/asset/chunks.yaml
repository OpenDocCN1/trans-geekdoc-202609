    **Question:** The term `\_\_\_\_\_\_\_\_\_\_` is used to describe a model that
    performs well on the training data but poorly on the unseen data.


    - Option 1: Underfitting

    - Option 2: Cross-validation

    - Option 3: Overfitting

    - Option 4: Bootstrap


    # Correct Response: 3


    **Explanation:** Overfitting refers to a situation where a model is trained too
    well on the training data and performs poorly on unseen data because it has learned
    the noise and specific patterns in the training data, rather than the underlying
    trend.


    **Question:** What is the primary goal of Machine Learning?


    - Option 1: Data storage

    - Option 2: Data visualization

    - Option 3: Data prediction and generalization

    - Option 4: Data cleaning


    **Explanation:** The primary goal of Machine Learning is to build models that
    can predict and generalize from data, making decisions or predictions based on
    input data.


    **Question:** Which type of Machine Learning algorithm would be best suited for
    predicting a continuous value?


    - Option 1: Clustering

    - Option 2: Classification

    - Option 3: Regression

    - Option 4: Reinforcement Learning


    # Correct Response: 3


    **Explanation:** Regression algorithms are designed to predict continuous values,
    such as stock prices or temperatures, by learning the relationship between independent
    and dependent variables.


    **Question:** What is the main difference between supervised and unsupervised
    learning?


    - Option 1: The algorithms used

    - Option 2: The data size

    - Option 3: The use of labeled data

    - Option 4: The complexity of the models


    # Correct Response: 3


    **Explanation:** Supervised learning uses labeled data where the output is known,
    while unsupervised learning deals with unlabeled data and finds hidden patterns
    without guidance on the expected outcome.


    **Question:** Which Machine Learning approach allows the system to learn and make
    decisions from experience?


    - Option 1: Supervised Learning

    - Option 2: Unsupervised Learning

    - Option 3: Semi-Supervised Learning

    - Option 4: Reinforcement Learning


    # Correct Response: 4


    **Explanation:** Reinforcement Learning allows the system to learn and make decisions
    through trial and error, receiving rewards or penalties, and learning from experience
    to achieve a specific goal.


    **Question:** In which type of Machine Learning does the model learn from labeled
    data?


    - Option 1: Unsupervised Learning

    - Option 2: Semi-Supervised Learning

    - Option 3: Reinforcement Learning

    - Option 4: Supervised Learning


    # Correct Response: 4


    **Explanation:** Supervised Learning involves training a model on a labeled dataset,
    meaning the desired output for each input is known. The model learns to predict
    the output from the input data.


    **Question:** What term is used to describe a model''s ability to perform well
    on unseen data?


    - Option 1: Overfitting

    - Option 2: Generalization

    - Option 3: Training

    - Option 4: Validation


    # Correct Response: 2


    **Explanation:** Generalization refers to a model''s ability to perform well on
    unseen data, not just on the training data. It measures how well the model has
    learned the underlying patterns rather than memorizing the training data.


    **Question:** What is the bias-variance tradeoff in Machine Learning?


    - Option 1: A tradeoff between the complexity and the size of a model

    - Option 2: A tradeoff between the learning rate and the number of epochs

    - Option 3: A tradeoff between underfitting and overfitting

    - Option 4: A tradeoff between supervised and unsupervised learning


    # Correct Response: 3


    **Explanation:** The bias-variance tradeoff refers to the balancing act between
    underfitting (high bias, low variance) and overfitting (low bias, high variance).
    A model with high bias oversimplifies the problem, while high variance tends to
    overcomplicate it.


    **Question:** Explain the difference between parametric and non-parametric models.


    - Option 1: The number of features used

    - Option 2: The flexibility in form

    - Option 3: The use of hyperparameters

    - Option 4: The ability to update parameters during training


    # Correct Response: 2


    **Explanation:** Parametric models assume a specific form for the function they''re
    approximating, such as a linear relationship, and have a fixed number of parameters.
    Non-parametric models make fewer assumptions about the function, often resulting
    in more flexibility.


    **Question:** How does the choice of loss function affect the learning process
    in Machine Learning?


    - Option 1: It determines the learning rate

    - Option 2: It defines the optimization algorithm

    - Option 3: It measures how well the model''s predictions match the true values

    - Option 4: It selects the type of regularization


    **Correct Response: 3


    **Explanation:** The loss function measures the discrepancy between the predicted
    values and the actual values, guiding the optimization process. Different loss
    functions can emphasize different aspects of the error, influencing how the model
    learns.


    **Question:** What are the main challenges in training a Machine Learning model
    with imbalanced datasets?


    - Option 1: Computational complexity

    - Option 2: Overfitting to the majority class

    - Option 3: Dimensionality reduction

    - Option 4: Lack of suitable algorithms


    # Correct Response: 2


    **Explanation:** Training on imbalanced datasets can lead to models that are biased
    towards the majority class, since they have seen more examples of it. This can
    make the model perform poorly on the minority class.


    **Question:** How can feature scaling affect the performance of certain Machine
    Learning algorithms?


    - Option 1: It increases the number of features

    - Option 2: It changes the distribution of the data

    - Option 3: It helps algorithms converge faster and perform better

    - Option 4: It increases the computational complexity of the model


    **Explanation:** Feature scaling normalizes or standardizes the features, making
    them all on a similar scale. This can help gradient descent-based algorithms converge
    faster and may lead to better performance for distance-based algorithms like `KNN`.


    **Question:** Describe the role of hyperparameter tuning in the performance of
    a Machine Learning model.


    - Option 1: It adjusts the weights during training

    - Option 2: It selects the type of model to be used

    - Option 3: It optimizes the model''s parameters before training

