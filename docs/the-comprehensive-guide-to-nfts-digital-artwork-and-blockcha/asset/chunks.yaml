- fmt: '

    Governments and regulating bodies have been slow to categorize and regulate other
    digital assets, like cryptocurrency, but they are finally getting there. According
    to many industry watchers, it was the lethargy of government to classify and regulate
    (or not regulate) blockchain technology that kept it from growing faster than
    it did. Investors were concerned that governments might suddenly declare cryptocurrency
    trading illegal, just as they, the investors, had finished investing heavily in
    it. Investing in something totally unregulated is a wild thing to do. It’s like
    playing a game for which there are no written rules. But as the years went by,
    major world governments gradually aligned around a few basic tenets. By looking
    at these tenets, we can make some educated predictions about what the future will
    hold for NFTs.


    ### Taxation


    Let’s start with taxation.


    In the eyes of the `IRS`, cryptocurrency and blockchain-based assets are treated
    as property. The `IRS` uses the phrase `“virtual currency"` to describe crypto,
    but it is still treated as property. When cryptocurrency is sold, those involved
    in the transaction must declare any gain or loss from the sale. If you are paid
    in cryptocurrency by someone in exchange for performing a service, you must also
    declare that to the `IRS`. However, in the eyes of the `IRS` you have technically
    been paid `with a piece of property`. Likewise, if you receive a gift of cryptocurrency,
    it is considered a gift of property, not of money.


    ### Regulation of Crypto


    And what about regulation of crypto? Here is where the lines are a little blurrier.


    Experts still disagree about whether it is more appropriate to regulate cryptocurrencies
    as securities or commodities. `Securities` are things like stocks and bonds. People
    invest in them because they can be expected to increase or decrease in value.
    The most common interaction with a security is a long-term investment hold. `Commodities`
    are physical goods like oil, hogs, or corn. Most buyers of commodities purchase
    the goods `before they actually exist`. The buyer purchases the commodity at a
    set price, and then the goods are delivered in the future. Buyers are betting
    that the price of their commodity will rise beyond the sale price, and then the
    commodities can be resold for a profit. Importantly, commodities are regarded
    as essentially fungible. Corn here can replace corn over there. The same with
    hogs and barrels of oil.


    In the United States, securities are regulated by the `Securities and Exchange
    Commission` (`SEC`), and commodities are regulated by the `Commodities Future
    Trading Commission` (`CFTC`).


    Blockchain-based tokens sort of straddle the line between securities and commodities.


    For example, some cryptocurrencies, like `Bitcoin`, have a set and limited supply.
    Only 21 million `Bitcoins` will ever be mined. This gives it the property of `a
    finite physical thing`. There are also finite amounts of gold, silver, and platinum
    waiting in the earth to be mined. Gold, silver, and platinum are definitely commodities,
    so examined from this angle, it may seem that cryptocurrency should be viewed
    as a commodity as well.


    But there are also cryptos like `Dogecoin`. `Dogecoin` was created so that miners
    will generally mine 5 billion new coins per year. `However`, that total number
    is not capped. At various times, the creators of `Dogecoin` have decided to allow
    extra amounts of the digital currency to be created, even though this created
    the specter of inflation. A central authority determining that new currency can
    be issued, with no hard and fast ceiling in sight? This sounds less like a commodity,
    and more like a security issued by a government.


    There are other strange aspects to crypto that also seem to stymie regulators.
    `Bitcoins` can be broken up and sold fractionally, and now usually are. If a hardware
    store accepts `Bitcoin` as a method of payment, I can walk into that store and
    buy a hammer with a fraction of a `Bitcoin`. If I have a physical bar of gold
    with me, would I be able to buy that same hammer by breaking off a tiny piece
    of gold? Or what if I only had a $100 bill, the hammer was $10, and the store
    had no change? Almost certainly, the hardware store would not accept a strip torn
    off of my Benjamin Franklin.


    And what about the fact that—by the best estimates of crypto experts—about 20
    percent of all `Bitcoins` are `not owned by anybody` . . . because they have been
    irreparably lost. This includes `Bitcoins` held in digital wallets for which the
    passwords have been forgotten, or `Bitcoins` that were held on physical external
    drives that were destroyed. Is this comparable to anything? It’s true that commodities
    are often used up—hogs and corn are eaten, oil is refined—but they are not simply
    lost. The `Federal Reserve` destroys paper money when it becomes old and worn
    out, but that’s a very small amount. (There is between 1 and 2 trillion dollars
    in physical US currency in circulation at any given moment. The US only destroys
    a number of bills valued in the low billions each year. And when it comes to money
    that people just accidentally misplace—or lock in a physical safe that cannot
    be opened—that number is far, far less.)


    ### Use Cases


    But the most interesting—and probably the most controversial—aspect of the classification
    argument around block-chain currencies is: “What can they be used for?”


    Hogs can be eaten or kept as pets. Gold can be used for industrial purposes, and
    is universally regarded as possessing great beauty. Even if pork fell out of favor
    with chefs, and gold became superseded by another precious metal as “most beautiful,”
    there is almost no chance that their value could ever fall to absolute zero.


    But what about something like `Bitcoin`?


    Examined one way, `Bitcoins` have a tremendous number of uses. They can immediately
    enable secure transaction across great distances, they can allow users to transact
    in a world free from the limitations of fiat currency, and they offer unparalleled
    accessibility as financial instruments.


    Examined another way, `Bitcoins` have `no use at all`. They correlate to nothing
    in the physical world that people are typically willing to pay for. They can’t
    be eaten, burned, smoked, or physically admired. This has caused some skeptics
    to argue that `Bitcoins` are worth nothing at all. That the benefits of `Bitcoins`
    are just they make it easy to move around.


    Across human history, different entities and groups have issued their own physical
    currencies. Many of these currencies are worthless today, except as historical
    oddities. These skeptics believe that once the aura of mystery and novelty surrounding
    `Bitcoin` has been stripped away, it will return to a value of essentially zero.


    These extreme swings in assessment of future value also contribute to the difficulty
    of deciding how cryptocurrency ought to be regulated.


    (It should be noted that not every country is thinking about these questions in
    the same way. In Great Britain, for example, the government has created the umbrella
    of `cryptoassets`, and beneath that, given different cryptos different classifications
    based on the nature of the coin. Some are considered `electronic money` and regulated
    like cash. Others are classified as `security coins` because they have characteristics
    connecting them to financial securities. Others still, like `Bitcoin`, fall under
    the classification of `unregulated coin`.)


    When it comes to NFTs, their status as a blockchain-backed token means that this
    status will influence how they’re regulated. However, that’s only 50 percent of
    the story. The other half is that NFTs generally take the form of visual art,
    so we can look for them to be regulated alongside the art market.


    The good news here is that many of the things that concern regulators in the art
    world *may not apply to NFTs*.

