    artists because of the way they’re going to integrate these three areas—physical
    items, digital items, and experiences.


    In fact, I predict NFTs will entirely disrupt the music industry.


    Here’s how it might work . . .


    Using NFTs to create and issue tickets, the musical artist will sell tickets directly
    to fans for their upcoming concerts. These concert tickets will be both “pieces
    of art” in that they’ll be NFTs that the fans will own forever and can display
    proudly, but they will also function as keys to unlock further experiences between
    the fan and the artist. The NFT ticket will provide “proof of fandom” just like
    a T-shirt that you purchased at a concert proves to your friends on Monday that
    you went to the big show that weekend. But it will also do more . . .


    After the concert, the artist can use the NFT to keep in touch with the fans.
    The first way of doing this would be to allow NFT-holders to listen to or download
    a recording of the show they attended. And once the fan takes advantage of this
    download, they have started a digital relationship with the artist, and that can
    become much deeper.


    The fan’s NFT can unlock special information about the band. Multiple NFTs can
    serve to unlock different levels of rewards or experiences. You might get early
    access to the next album, or early access to front-row tickets during the next
    tour.


