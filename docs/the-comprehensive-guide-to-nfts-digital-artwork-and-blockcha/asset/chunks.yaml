- fmt: '

    Today, however, branding goes far beyond the Nike swoosh on your shoe. It includes
    nearly every aspect of the brand’s identity, activity, and performance. It can
    include advertising, endorsements, marketing and communication pieces, loyalty
    programs, and more. Yet the one constant in all of these elements will always
    be `product differentiation`. There’s always something that makes your brand different
    from all the others. Something that makes it `special` and `desirable`.


    When it is correctly cultivated, a brand becomes worth more than the sum of its
    parts. Customers come to value a particular brand favorably, and it can take on
    a life (and value) of its own. There are many cases of “zombie brands” in which
    a business may have long since gone under, but their symbol continues to be an
    integral part of the culture.


    Next, consider the phrase “on brand.” Then consider how frequently the phrase
    is used regarding things `outside of physical good`. A politician’s speech is
    said to be “on brand.” A singer’s new album? “on brand” (or not, depending on
    the music). “Brand” comes to refer to an expected aspect of a product or service
    that satisfies customers in a way they expect, whether or not it is a physical
    good.


    A business, a political party, even a person, can be a brand.


    ### NFTs and Brand Identity


    NFTs hold the potential to add to the ways in which brands can express themselves,
    connect with customers and fans, and define their own identities. NFTs can tell
    consumers more about the brand, identify the benefits of the product, express
    brand values or beliefs, or simply comport a sense of the brand’s personality
    and sense of itself.


    We’ve seen firsthand how NFTs can be seamlessly incorporated into an artist’s
    or business’s existing brand. We frequently work with brands to help ensure that
    they optimize their `NFTs` in order to have the biggest impact in the marketplace.
    Here, we’ll outline some of this work to give you a sense of how `Static NFTs`
    are integrated with preexisting brands.


    When we help a client who is expanding into the NFT marketplace, we work with
    them to create a standalone branded gallery environment. This is a “central hub”
    where potential customers and supporters can come to view the NFT content. This
    virtual gallery looks like an extension of the creator’s brand. It doesn’t feel
    like the customer is going to an online art gallery, or to an “outside source”
    of some kind. Rather, from the moment they click, visitors understand that they
    are still in a space that’s a part of the brand itself.


    The design of the `Static NFTs` themselves should also carry the branding of the
    business. However, this is general advice, and always remains general. The businesses
    should feel that it’s up to them to determine how this branding will work. Businesses
    are tremendously protective over their branding, and have in-house brand custodians
    in their marketing and communications departments. These folks will be passionate
    about overseeing that branding is correctly and appropriately deployed in a piece
    of content like an NFT.


    Our partners feel comfortable working with us because they retain full creative
    control. And at the end of the day, they have the final say.


    We can also help the client understand that although it’s a new technology, the
    NFT is not an exotic “other” that will be some kind of curveball for their branding
    department to deal with. Rather, the NFT can be a familiar extension of whatever
    they already make. They may produce physical collectible content items—like baseball
    cards or figurines—or they may simply have existing branding that can be worked
    into a collectible `Static NFT`. For example, an automobile company doesn’t usually
    view its products as “collectible”—except by the very wealthy—but they will have
    strong branding across all platforms. This brand identity can be incorporated
    easily into something like collectible NFTs featuring popular cars.


    ### NFT Launch Strategies


    When it’s time for a business to offer their `Static NFTs` for the first time,
    we want to make that an event! Right now, it’s not challenging to get the launch
    of NFTs into the news because there’s so much interest in the new technology.
    But as the novelty wanes, what will be more important will be helping to ensure
    that a company’s core customer group is made aware of the NFTs. We want them to
    understand how to access and collect the NFTs, but it’s also important that we
    help customers see how NFTs can function as an extension of their fandom and enthusiasm
    for the product.


    The most prominent NFTs are showcased and shown in their own environments. This
    is also (obviously) the case whenever a creator or brand has a single NFT for
    sale. If an NFT is important enough, then everything about the announcement and
    the sale will be tailored in service to that NFT.


    We also help ensure clients launch their NFT on a selected schedule that’s optimized
    through our relationship with our creator. Timing is everything, and we let our
    clients understand not just how and where, but `when` to release their NFT. An
    NFT launch can coincide with the launch of another new product. It can be used
    as part of a larger campaign to signal a brand’s commitment to twenty first–century
    technology. It can also introduce an important new revenue stream. We work to
    ensure brands enjoy the benefit of optimal timing in the marketplace.


    And at the highest level, we listen to our clients. We learn what they’re hoping
    to achieve. We learn what makes their customers feel passion for their products.
    And we help them determine how their launch of an NFT can integrate with the rest
    of their brand and contribute to overall awareness.


    ### Creating value for the client with a dynamic NFT


    Another one of our central tasks is to assist any client in maximizing the value
    of a `Dynamic NFT` program that can help them grow their brand.


    Just a few examples of this work include:


    - **Incorporating rewards programs:** Does our client want holders of their NFTs
    to receive discounts at a business? Should customers with NFTs accrue redeemable
    rewards points? The possibilities are wide open. We help our partners think long-term
    about the ways that NFTs can let customers build ever-stronger relationships with
    their brand.

    - **Providing a fanbase with access to unique experiences:** For someone like
    a musician, `Dynamic NFTs` can function as digital keys that unlock special experiences,
    like a concert or art opening. The NFT can make the fan aware of a special event,
    while at the same time serving as the admission pass to get inside. These NFTs
    can create a sense of exclusivity for “superfans” that make them feel closer to
    the artists they enjoy.

    - **Providing a fanbase with access to unique services:** At many good restaurants,
    there’s a special menu for those “in the know”—and then there’s the regular menu
    for everyone else. Just as it can serve as a passport that opens up special event
    access, an NFT can also open up access to a whole new menu of products and services.
    Consumers who connect with a brand by purchasing an NFT are likely to be very
    committed to the brand, and therefore more likely to be interested in additional
    special services.

    - **Providing a fanbase with access to limited product drops:** In the same vein
    as the above, NFT holders will be among the most likely to snap up special, limited
    edition productions that a brand may provide. The fact that those without the
    `Dynamic NFT` will not even know these offerings exist can create an optimal sense
    of FOMO that drives business for these special offerings (and drives it directly
    to the community that will be most likely to buy).

