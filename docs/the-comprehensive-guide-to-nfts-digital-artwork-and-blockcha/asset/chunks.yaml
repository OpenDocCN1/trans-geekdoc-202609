    are the best solution for the problems of today . . . and of tomorrow.


    **Blockchain and the problem of provenance**


    Blockchain is the technology that makes the NFT revolution possible, so understanding
    it is key.


    Oftentimes, the easiest way to wrap your head around a complicated new invention
    is to start with the question: “What problem was this designed to solve?” When
    it comes to blockchain, the answer is the problem of provenance. That is, the
    history of ownership.


    Blockchain is a digital “living ledger” that grows each time it is used for something.
    Generally, this “use” will be a financial transaction. Blockchain cannot be altered
    inappropriately, and it cannot be forged or counterfeited. A blockchain exists
    electronically, and requires a digital record—powered by a computer server—to
    maintain the integrity of its living ledger. Each time a transaction occurs, that
    transaction is recorded on this digital ledger. This ledger is transparent, so
    any participant in the technology can see it, and can verify that it happened.
    The transactions are also time-stamped and irreversible. (There are no “returns”
    in the world of block-chain. A transaction can’t be reversed, recalled, or undone.
    Something can be sold and resold, but there is no “undo” button.) Blockchain transactions
    also have the quality of “unanimity”—that is to say, all participants in the network
    agree to the validity and binding nature of all blockchain transactions.


    Blockchain transactions are secure because everyone involved in the chain is also
    involved in verifying the transactions. (This is sort of like if everyone using
    a physical piece of currency—like the US dollar—was also involved in checking
    bills for authenticity, and likewise making sure all bills were being legally
    used by the last person who had obtained them through a transaction.) Blockchain-backed
    currencies and tokens prevent forgery and fakery because of this kind of technological
    transparency. If someone tried to tamper with a block on a blockchain, every other
    user of the same blockchain would immediately know. This would be like if a counterfeiter
    bleached a $1 bill and reprinted the design of a $100 bill on top of it; everyone
    using that currency would immediately know. This is one reason that—although it
    runs on digital technology—a blockchain can’t be “hacked” in the way a computer
    network can. Furthermore, most blockchain networks are getting bigger all the
    time, adding more users to the chain; this makes transactions on the chain safer
    and safer, because there are always more users who would notice if anything were
    amiss.


    To best understand the technology, it may be helpful to consider blockchain’s
    most prominent example, which is definitely Bitcoin. The blockchain that runs
    Bitcoin was created by a mysterious person (or persons) known as “Satoshi Nakamoto.”
    In creating his cryptocurrency, Nakamoto devised a way that the history of each
    Bitcoin would be verified electronically with a digital timestamp, and a record
    of each Bitcoin would be maintained in an electronic ledger. What would power
    this ledger? The answer is Bitcoin mining.


    Nakamoto designed his system such that the record of all Bitcoin transactions
    could be decentralized and maintained by a network of computers around the world
    that were actively “mining” Bitcoins. We use the word mining, but what these computers
    are actually doing is solving a series of complex mathematic problems that then
    maintain the chain of transactions in the Bitcoin ledger. (Why would anyone do
    this mining? Because the miners are rewarded periodically for this work with new
    Bitcoins of their own.) There are some downsides to this model, such as environmental
    implications—which we’ll address—but as a system for maintaining the integrity
    of Bitcoin, this mass collaboration/verification model works well.


    Bitcoin solves the problem of provenance, but it also does so much more. Bitcoins
    are not physical. They’re not made of a substance that can be used for anything.
    They certainly can’t be redeemed for gold (or other valuable metals), like some
    hard currencies can. Many of the advantages of Bitcoin, however, are in other
    things that they *can’t* do. Namely, they can’t be faked in any way. There is
    no such thing as a fake Bitcoin. Paper currency can be (and widely is) faked.
    When you pick up a $100 bill, you have no idea of its origins. You don’t know
    if it was born in the US Mint or in a North Korean forgery operation. That information
    is not available to you as the person touching the currency. But with Bitcoin,
    that information is not only available, but it’s an integral part of that piece
    of currency.


    Alongside forgery is theft. A pickpocket can steal money from your wallet and
    then spend it freely without a merchant being any the wiser. Bitcoins are not
    possible to “steal” in the traditional sense of the word because the record of
    ownership transactions is imprinted on the blockchain.'
