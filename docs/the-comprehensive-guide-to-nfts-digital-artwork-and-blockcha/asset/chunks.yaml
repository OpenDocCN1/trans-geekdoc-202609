    easy answer. Can digital currency—like the Bitcoins that preceded NFTs—count as
    art?


    Actually, maybe they can.


    Money has been used in (or as) art many times before, and several artists have
    simply exhibited physical piles of currency as artworks in galleries. In 2017,
