  raw: 'Those regulating and monitoring the art world are interested in preventing
    a very specific set of crimes. NFTs will have their histories tied to the blockchain,
    so forgery (and fraud and impersonation) won’t be a problem. (As noted, a few
    artists have claimed that their copyrighted works were turned into NFTs without
    their permission. However, these instances are very rare, and can be quickly remedied.)


    A trickier issue will be money laundering, which is increasingly the number-one
    priority of art market regulators. There are several ways that fine art can be
    used to turn “dirty money” (such as from drug dealing or other criminal enterprises)
    into “clean money.” For example, someone with “dirty money” finds an auction house
    or art dealer that will accept cash with no questions asked. They buy a work of
    art, and then immediately turn around and sell the art for approximately the same
    amount. Now they have a receipt for this second art sale, and that provides a
    “legitimate” method for how they obtained the money. Some money launderers have
    used variations on this, such as buying an artwork with dirty money, and then
    using its value to secure a loan of clean money from a financial institution.
    Other versions include simply colluding with a purchaser to inflate the cost of
    an artwork, selling it “back and forth” and bringing more illegal money into a
    legal transaction each time.


    Another major concern in the art world is price fixing. (We examined how NFTs
    will be immune to this in an earlier chapter.) Still other regulators look for
    art that may have been stolen or “appropriated” during wars or terrorist incursions.
    Art in this category may not have been sold as “art” before. The items may simply
    be cultural antiquities that have been looted by bandits or invading soldiers.


    Even the least tech-savvy regulators are going to be able to understand that NFTs
    are not going to be faked. And because of their link to the blockchain, there
    will be significant builtin safeguards against price fixing. And NFTs certainly
    aren’t going to be looted when soldiers go pillaging museums after a battle.


    This leaves money laundering, which is probably going to be the focus for regulators
    when it comes to NFTs. Despite the fact that NFTs are purchased digitally, regulators
    are still going to be very interested in the provenance of funds. “How did you
    get the money that was used to purchase the NFT?” is going to be the question.
    Buyers of NFTs will need to be prepared to answer it.


    So.


    Given this complex network of concerns and ambiguities, how are NFTs likely to
    be classified and regulated in the years ahead?


    Here’s my best guess:


    The decisions are unlikely to be a binary, in which it’s either *entirely* this,
    or *entirely* that. Regulators may decide that an NFT that takes the form of a
    $12 digital cat is fundamentally different from an NFT that’s a $69-million collage
    sold by Christie’s.


    Regulators may also decide that certain NFTs should not be treated the same. NFTs
    that are simply used as a certificate of authenticity correlating to a physical
    item are unlikely to be seen as a security. But for NFTs that are offered to investors
    *with the explicit promise of increasing value*—like tokenized ownership in a
    work of art—there’s a chance regulators could absolutely find that those NFTs
    should be regulated like securities.


    There’s also a strong chance that the “marketing language” or “pitch” used to
    sell the NFTs to buyers will determine how they are regulated. For example, if
    NFTs are pitched to consumers as collectibles, and the advertising around them
    makes this clear, then regulators may agree that they should not be any more closely
    watched than the sale of physical figurines. However, if those selling NFTs do
    a sales pitch making the NFTs sound like speculative investments that can be bought
    and sold for a quick return, then regulators are going to take a very different
    view. Believe it or not, this kind of advertising/positioning can make a *huge*
    difference.


    Another turning point will involve how issuers of NFTs behave *vis-à-vis* attempts
    to influence the market. Do the companies that are creating Static NFTs and making
    them available for sale simply pass along the products to buyers, taking a small
    percentage as they do so? Or, do they themselves stockpile their own collections
    of NFTs—in addition to the ones they sell—and try to influence the market as a
    way of driving up the prices *of their own NFT holdings*? If the latter scenario
    becomes common, then regulators may again decide that NFT art is functioning like
    a security as opposed to a collectible digital figurine or baseball card.


    If NFTs *are* classified as a security, there will be serious drawbacks for creators,
    artists, and those in the business of selling NFTs. Those selling and buying NFTs
    will—in many cases—be required to register with the SEC. They will also face new
    limitations. The transfer of NFTs would be regulated, and so would the marketing.
    Commercials and print ads for NFTs would probably have to include disclosures
    related to their potential performance as investments. Consequences for error
    would also be more dire. For example, in a universe where NFTs were *not* considered
    securities, accidentally mis-labeling, misidentifying, or inaccurately describing
    an NFT would simply be a mistake. At worst, a charge of “false advertising” might
    be leveled. But in a universe where NFTs *are* considered securities, providing
    *any* wrong information about an NFT would be a serious crime and a violation
    of securities laws. Those who ran afoul would be open to severe criminal and civil
    penalties.


    Finally, “wild card” regulation scenario—which is less likely, but nonetheless
    worth bringing up—is what will happen if regulators (and other government entities)
    get interested in NFTs that can “unlock” discounts or tickets to special events,
    and decide that they constitute membership in a private club. This would be tricky
    because almost every US state has its own definition of what constitutes a club.
    Under the Civil Rights Act of 1964, clubs are allowed to exclude certain groups
    “accidentally” but not on purpose, and that exclusion cannot be the reason for
    the club. For example, a yachting club can be “accidentally” all white because
    all of the people with yachts who have applied to join so far have happened to
    be white, but the yacht club can’t intentionally exclude nonwhite yachters. We
    know that NFTs will be used to offer special access to clubs, groups, and events.
    An entirely different kind of regulation—involving civil rights law—could come
    into play if these NFTs granting access begin to be considered “club memberships.”
    Because of this, businesses will want to avoid regulation by making sure they
    use NFTs in accordance with all laws governing nondiscrimination and exclusion.


    In the meantime, what should businesses and creators in the NFT space do in order
    to remain compliant (and to limit risk generally)? Well, if you’re a creator or
    platform and you plan to “pitch” NFTs, *don’t pitch them like securities*. If
    you have no other course available than to emphasize and sell NFTs that are like
    securities, *plan to be regulated*, and don’t do anything that would break a rule
    if your NFTs were securities in the eyes of the law.'
