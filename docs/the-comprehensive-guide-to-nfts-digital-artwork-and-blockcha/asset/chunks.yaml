    ### Immersive Experiences


    `VR` and `AR` are being used in so many industries that it’s getting hard to keep
    track. But the combination of `NFTs` with `VR` and `AR` experiences are going
    to take things to a whole new level.


    A `VR` or `AR` experience can take the form of a `Dynamic NFT`. For example, a
    brand could reward loyal customers with an `NFT` containing an exclusive digital
    experience that changes over time that they could then access a device such as
    `Oculus Rift` or `HTC Vive`.


    Or what about `AR`? A brand might issue an `NFT` to its most loyal customers inviting
    them to an exclusive new product premiere, but make the map to get there an `AR`
    experience. A flashing dotted line—that only those with the correct `NFT` could
    see—might stretch across the city. Following it would lead to the product launch
    venue where a big digital “X” marks the spot.


    ### Evolution of Digital Art


    You might think of `AR` as a close cousin of `VR`. `AR` is a little more serious,
    and a little more focused on the “real world.” To give an example, a worker on
    the oil rig might wear an `AR` visor. The visor would at first appear to be translucent,
    but when activated it could give him special information invisible to the naked
    eye. When the worker glanced at a pressure valve, the visor might display a large
    number hovering over the valve. A vat containing a dangerous chemical might flash
    red to the worker, warning them of the extra danger. When the worker looked at
    his colleagues on the rig, workers with certain skill sets and job titles might
    have one color above them, while others might have different colors; if the worker
    needed to quickly find an employee to help him with an issue, it would be easy
    for him to glance around and spot the right person, even if all the workers are
    wearing identical uniforms.


    `Static NFTs` purchasers of `Static NFTs` will not only be able to view artwork
    on their walls, but will also be able to immerse themselves within a transformative
    spatial experience contained within an `NFT`.


    Some artists will grant the holder of their artwork with the ability to unlock
    additional artworks and experiences.

