  raw: 'Charities, philanthropies, and nonprofit institutions have many elements in
    common with operas, museums, and cultural institutions. Both receive substantial
    income from large donors, but also rely on smaller amounts of income from many
    individuals.


    Charities need to know their donor base and forge deep ties with them. Luckily,
    NFTs are going to help these sorts of mission-driven nonprofits to interact with
    their bases at a level never before seen.


    In order to serve their core missions, charities need to make their presence known.
    They need to present themselves as the best route for addressing the problem upon
    which they focus—whether it’s working to cure a disease, improving the environment,
    or addressing a social problem. To do this, they pursue traditional advertising
    and awareness campaigns, and also use social media. And—just like cultural institutions—
    charities often host branded annual events, like “runs/walks for the cause” which
    can help to further raise funds while giving their supporters the chance to socialize
    and connect personally instead of virtually.


    Charities also depend on storytelling, perhaps more so than traditional businesses.
    Charities need to put a human face (or sometimes an animal face) on their cause.
    They need to show who they are helping, and how. They need to demonstrate impact,
    and they must do this at a macro and micro level. They can talk about thousands
    of sick people cured, hungry people fed, or acres of Brazilian rainforest preserved.
    However, they also introduce those whose lives have been personally impacted by
    the organization’s good works.


    NFTs will help charities by providing both increased segmentation and increased
    personalization. Charities thrive by creating lists of donors who give at certain
    levels. However, they also keep lists of donors who are engaged at certain levels,
    and in certain ways. Who responds to a call to action on Facebook or Twitter?
    Who responds only when an entreaty is physically mailed to their house? Who shows
    up for events and gatherings? Who responds to marketing material when it’s driven
    by data, and who gives only when instead they see intimate personal profiles of
    those who have been helped by the charity?


    With NFTs, not only will these things become increasingly easy for nonprofits
    to know, but in addition, supporters of the charities will be able to incorporate
    NFTs into their “personal storytelling” both digitally and at events. The potential
    for cultivating new “evangelists” for the cause has never been greater.


    Donors who support a charity at a certain level, or in a certain way, can be rewarded
    with a unique NFT attesting to their donation of money and/or time. These NFTs
    can have a visual component, and can be used by the supporters to display their
    affection for the charity. Certain NFTs can also unlock benefits such as tickets
    to balls, galas, and other events that the charity may hold. Donors who are interested
    in personal stories of people helped by the charity can have this preference tracked
    in NFT-form. This will allow the charity to make more effective solicitations
    of the donor in the future, and can also help the donor to stay engaged.


    ![images](images/f0025-01.jpg)


    *Musicians Room Service International have partnered to raise significant funds
    for philanthropic organizations through the release of NFTs*.


    Over time, the use of NFTs can help a charity organization demonstrate its presence
    in the community, and the depth of its reach with donors at all levels. (We should
    hasten to add here that nonprofits dedicated to preserving the environment will
    want to use Proof of Stake NFTs exclusively . . . but you knew that already.)
    Demonstrating engagement through NFTs will bring more attention to your charity,
    help create opportunities for cause marketing (partnerships between nonprofit
    and for-profit organizations for a mutual cause), and can demonstrate in a quantifiable
    way that your organization is having a great impact on the cause you serve.


    *Virtual reality and augmented reality*


    Virtual reality (VR) and augmented reality (AR) have uses in art, commerce, finance,
    worker safety, and storytelling—and a whole lot of other places too. For the sake
    of clarity, we’ll make them a discrete industry category here, but they have applications
    all over.


    In case you’re a bit shaky on the difference, VR is usually considered a “computer
    simulation” of an entirely virtual world. Think of someone putting on a headset
    that gives them a 360-degree view in a video game, or that puts them right in
    the middle of a movie unfolding on all sides. Some VR experiences are passive,
    and the person inside the reality just sits (or stands) back and watches. Other
    VR environments allow the user to interact with their virtual world. In addition
    to entertainment, VR has applications for training and education. Pilots can fly
    100 risk-free VR missions before they ever get into an actual flight deck.


    You might think of AR as a close cousin of VR. AR is a little more serious, and
    a little more focused on the “real world.” To give an example, a worker on an
    oil rig might wear an AR visor in addition to his hard hat. The visor would at
    first glance appear to be translucent—allowing him to see the world around him—but
    when activated the visor could give him special AR information invisible to the
    naked eye. When the rig worker glanced at a pressure valve, the visor might display
    a large number hovering over the valve showing the pressure reading. A vat containing
    a dangerous chemical might flash red to the worker, warning them of the extra
    danger. When the worker looked at his colleagues on the rig, workers with certain
    skill sets and job titles might have one color hovering above them, while others
    might have different colors; if the worker needed to quickly find a skilled employee
    to help him with an issue, it would be easy for him to glance around and spot
    the right person, even if all the workers are wearing identical uniforms.


    VR and AR are being used in so many industries that it’s getting hard to keep
    track. But the combination of NFTs with VR and AR experiences are going to take
    things to a whole new level—and probably boost their usage even further!


    A VR or AR experience can take the form of a Dynamic NFT. For example, a brand
    could reward loyal customers with an NFT containing an exclusive digital experience
    that changes over time that they could then access using a device such as an Oculus
    Rift or HTC Vive.


    Or what about AR? A brand might issue an NFT to its most loyal customers inviting
    them to an exclusive new product premiere, but make the map to get there an AR
    experience. A flashing dotted line—that only those with the correct NFT could
    see—might stretch across the city. Following it would lead to the product launch
    venue where a big digital “X” marks the spot. What a remarkable way to get people
    excited to come to an opening, meet and greet, or first access event!


    There’s also reason to think that VR and AR will be an important integration with
    Static NFTs.


    By combining technology with creativity, digital art will truly enter the future
    and become fully immersive. Many who work in the space have been asking “What’s
    after animation and 3D?” The answer is: a major push blurring the boundaries of
    reality using VR and AR.


    Purchasers of Static NFTs will not only be able to view artwork on their walls,
    but will also be able to immerse themselves within a transformative spatial experience
    contained within an NFT.


    Some artists will grant the holder of their artwork with the ability to unlock
    additional artworks and experiences.'
