  raw: 'But just because an NFT won’t “be” in your house hanging on the wall, doesn’t
    mean that it won’t be yours, or won’t be secure. (It can hang on your wall, if
    you wish, and be seen through a television screen, etc.) To the contrary, your
    NFT artwork may literally be the most secure thing that you own. It will almost
    definitely be the most secure work of art that you own. As we’ve seen, because
    the blockchain technology in NFTs literally imprints the history *of* the work
    *on* the work, authentication and provenance can be known instantly. Even with
    the carbon-dating of canvases, and the discerning eyes of trained art historians,
    forgeries and fakes can still be passed off as the real thing in the work of physical
    art. (Or a stolen painting may be “found” years later after a questionable chain
    of ownership.) But when a piece of art is an NFT, this possibility is eliminated
    completely.


    ![images](images/f0006-01.jpg)


    *Artist Urs Fischer created tension between himself and his art dealer by launching
    NFTs, but ultimately found the transition extremely lucrative*.


    The NFT will “be” on the blockchain, but it will also be yours however you wish
    to exhibit it.


    **So then how did we get from blockchain to NFT art?**


    Did NFTs begin with Beeple? Certainly not. Finding the precise origins of NFTs
    can be somewhat difficult. Unique digital items have been around for a few years.
