    两种模型都基于密码学。它们验证交易并确保区块链中的每项物品都维护其完整性。为了做到这一点，`Proof of Work` 使用计算机必须解决的独特数学方程。对于像
    `Bitcoin` 这样广泛使用的加密货币——它使用 `Proof of Work` 模型——这需要世界各地的大量计算机时刻工作。


    （注：由于提供的原文存在大量段落重复，此处译文已根据“不要重复输出原文”的指令进行了去重处理，以确保输出的清晰与专业。）


