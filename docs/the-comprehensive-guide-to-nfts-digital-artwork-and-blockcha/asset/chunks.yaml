- fmt: '

    One fascinating example that may give us a clue to that future is coming from
    a new blockchain-based game called `Alien Worlds`. In this game, users compete
    to colonize and build upon alien landscapes. They form alliances and allegiances
    with one another, yet may break them when the time seems right. Once land in the
    game is controlled, it can be mined for an in-game crypto called `Trillium`. When
    it is mined, the `Trillium` can be used as the players see fit—to purchase land,
    build alliances, purchase NFT-based items, and so forth. Importantly, the creators
    of `Alien Worlds` have not specified that the `Trillium` mined in the game may
    only be used in the game. To the contrary, they have created a block-chain-based
    currency that users would also be able to trade in the real world. Ingeniously,
    this arrangement seems to blur the line between which mining is “real” and which
    mining is simply “playing a game.”


    Another great example worth discussing comes from a game developer called `AnRKey
    X`, which is developing a video game called `Battle Wave 2323`. While the game
    has not been officially launched, the format will be battle- and weapon-themed,
    with players picking characters and competing against one another in combat. Weapons
    and outfits will be part of the game—in the form of NFTs, of course—but that’s
    not all. Players will be able to `stake` NFTs in matches when they compete against
    one another. This represents a serious step forward. In most fighting games, one
    merely fights for bragging rights. Yet in `Battle Wave 2323`, players will have
    the ability to challenge foes and potentially win their unique and valuable NFTs.


    As NFTs and gaming evolve together, there will also potentially be some tough
    questions that will need to be answered. First and foremost, regulators will need
    to answer when “gaming” becomes “gambling.” If a skill-based video game allows
    players to lose or win NFTs worth thousands of dollars, then how is this similar
    to, or different from, boxers betting on themselves in a boxing match?


    In the United Kingdom, legislators have already taken steps to limit elements
    of video games like loot boxes. With a loot box, a player opens a mysterious opaque
    digital box that contains a random assortment of equipment to help them in the
    game. Loot boxes can be earned through gameplay, but they can also be purchased.
    British public health experts became concerned that video game loot boxes could
    give children a taste for online gambling. A study by a charity called `GambleAware`
    released in early 2021 found that 5 percent of video gamers spent over $100 per
    month on loot boxes. Considering how popular video games are, that’s a huge number
    of people. And the press has carried sensational stories of children who incurred
    extremely high charges on their parents’ credit cards though loot box use.


    While video game manufacturers have insisted that loot boxes do not constitute
    or encourage gambling—and console manufacturers like `Sony` and `Microsoft` have
    installed controls to limit the purchasing of loot boxes on user accounts— there
    remains a strong backlash against them.


    A future on the horizon where NFTs worth thousands are won and lost online will
    probably make the kerfuffle over loot boxes look like a mild disagreement in comparison.
    Limitations on who can play games with NFTs may be placed. The losers may be gamers
    under eighteen or twenty-one, who will be limited from playing some games in the
    same way they’re limited from stepping into a casino or betting on a sport.


    On the other side of the coin, there is a tremendous amount of money that stands
    to be made from the video game playing audience that is not yet eighteen or twenty-one.
    Something tells us that the companies targeting this market are going to be clever
    enough to incorporate NFTs into games for youngsters somehow. It would be foolish
    to count out the gaming industry when it comes to finding a way to reach their
    target markets.


    In conclusion, video games represent another sphere where NFTs are all but guaranteed
    an incredibly rich future. The architecture is already in place, and we have every
    indicator that consumers will pounce once NFT integration into games begins.


    ## Cultural institutions and venues


    Museums, orchestras, ballets, and venues of all sorts will be able to harness
    the power of NFTs to reverse trends of diminishing sales and waning interest.
    They will be able to connect and reinvigorate their “tribes” of fans, and reposition
    themselves for powerful and meaningful growth. By connecting with their core demographics
    and implementing NFTs across lines of media to reach their audiences, cultural
    institutions will be able to leverage their assets to connect the right audience
    members to the right cultural experiences.


    Cultural institutions straddle two worlds because they rely on both benefactors
    and paying customers in order to survive. How they access and engage these two
    groups generally makes the difference between merely surviving or fully thriving.
    NFTs can play a role in reaching out to both wealthy patrons and fans.


    Cultural institutions are uniquely positioned to engage with their patrons and
    donors because they are machines for offering unique and wonderful experiences.
    There are the ballets and symphonies they produce, and the paintings and sculptures
    they put on display. Yet they can also draw on these assets to give their supporters
    up close and in-person events and special access in recognition of their support.


    In an NFT-driven scenario, cultural institutions can solicit donations from wealthy
    supporters just as they do now. But while in times past, a donation above a certain
    dollar amount might have garnered a special invitation to a reception or event—or
    the chance to purchase front row tickets to an event before anybody else—the qualifications
    for these rewards were sometimes nebulous or unclear. And in some cases, a patron
    might hesitate to make a major donation if they knew that they already had plans
    on the night of the grand gala that was to be the award.


    Patrons of the arts will also enjoy the automatic access to institutional events
    that they will be able to unlock with NFTs. The NFT tied to a contribution will
    function as a digital key, unlocking special experiences and surprises, designed
    to delight the most ardent supporters.


    And with an NFT digital ticketing system coupled with `Verifiable Credentials`,
    these rewards can be easily customized and personalized to suit donors in new
    and exciting ways. Does one donor only attend operas where baritones are featured?
    We can get that man a behind scenes event with the opera company’s baritones as
    a “thank you” for his latest generous donation.


    This is also true for the general audience ticketholders who may not make large
    donations, but still show their support through event attendance and dollars spent
    at the gift shop. We can also get to know these consumers through the NFTs tied
    to their digital ticket purchases. Cultural institutions can use the corresponding
    information to reach out with offerings that may be up their alley, and can make
    exclusive purchases available to them—much like a luxury brand would—that verify
    that have been a part of certain cultural events.


    NFTs can enable fans of a museum or concert hall to gain access to the kind of
    custom benefits that can make them feel special and turn them into regular customers.
    From early seating and early entrance to events, to access to special areas, to
    gifts and takeaways.


    NFTs will be an exciting new way for consumers to align their love for cultural
    institutions with other aspects of their lives. Everyone jokes about the prevalence
    of “NPR tote bags” among those who give to public radio. NFTs may just give those
    tote bags a run for their money in the years ahead!

