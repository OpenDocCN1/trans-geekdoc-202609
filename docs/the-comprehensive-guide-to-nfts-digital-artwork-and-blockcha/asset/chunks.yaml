    # What happens next?


    Nobody comes through the door (except for a very small number of ultra-wealthy
    patients who can afford to pay out of pocket).


    Concerned, you turn to your hospital CFO and ask, “What’s going on? Why don’t
    we have more customers? I’ve built the best hospital for miles around!”


    Your CFO explains the problem: Most people pay for their health care *with health
    insurance*—which they get through their employer, or from a government exchange.
    The health insurance companies determine which hospitals and doctors’ offices
    will be covered by their insurance. They call this “being in-network.”


    “Say no more!” you tell your CFO.


    You immediately set up a meeting with the largest health insurance company in
    your area. At this meeting, you showcase the high quality of the hospital you’ve
    built, and make a case for the excellent care that patients will receive there.


    “Wow,” replies the health insurance executive. “It looks like you’ve really created
    a top-tier hospital. If people using our insurance go to your facility for treatment,
    it appears they are going to be cared for extremely well.”


    And then, just when you think you’ve sealed the deal, the insurance executive
    leans across his or her desk and asks, “So, what are you going to do for *me*?”


    “Do . . . for you?” you ask innocently. “What do you mean? Isn’t it enough that
    I’ve spent all this money to build the best hospital in the area?”


    Both amused and bemused at your lack of worldliness, the executive will gently
    explain it to you this way: “If we choose to put your hospital in our insurance
    network, you’ll immediately get thousands of paying customers. If we choose *not*
    to add you to our network, you’ll have to subsist on self-pay customers, government
    programs, and a difficult patchwork of other payment methods. In other words,
    you *really* want to be in our insurance network. So, what if you do something
    for us in exchange? Specifically, what if you give people who come to your hospital
    with our insurance a discount of about 50 percent, right off the top. We’ll call
    that an ‘In-Network Discount’ on their bill. So if there’s a heart surgery that
    costs $100,000 on the price list, we’d like you to only charge us $50,000.”


    For a tense moment, you pause and try to think through your response. To your
    dismay, you realize the insurance executive is correct. If your hospital is going
    to be viable, you’ll need to forge partnerships with insurance companies. But
    on the other hand, what they’re asking is enormous. The prices at your hospital
    have been carefully set to generate the income you need to keep providing good
    care, maintain your facilities, and to pay the salaries of your well-qualified
    staff. And yet this insurance company wants every single one of their insured
    to get 50 percent off. How can you make that economically viable?


    You walk out of the meeting with the insurance executive and immediately take
    out your cell phone and dial your CFO.


    “How did the meeting go?” the CFO asks.


    “Great,” you tell them. “There’s just one thing—we’re going to double prices.”


    And . . . scene.


    ## The Economic Dilemma


    This thought experiment is not meant to pin all the blame for America’s health-care
    issues onto insurance companies, but it does show a common perspective of one
    of the major players. Because hospitals know that insurance companies will demand
    large discounts for their members—and because hospitals absolutely need to be
    inside insurance networks in order to get patients—hospitals don’t have an option
    other than artificially inflate prices so that they’ll still be able to turn a
    profit after network discounts are applied. But where does this leave a person
    paying out of pocket? The answer is, unfortunately, in a very bad position. A
    wealthy person paying without insurance may simply be annoyed to learn they’re
    being charged approximately twice the rate of an insurance company. But an uninsured
    person of limited means may incur medical debts that are financially ruinous,
    or may choose not to pursue treatment at all.


    ## Perspectives on Health Care


    Now let’s look at this complex issue from another angle— which is hopefully an
    angle in which NFTs will also be applicable as part of a solution.


    America is a land of great political diversity. State by state, and region by
    region, Americans often have extreme and sometimes opposing political views. When
    it comes to health care, some hold that it is a scandal that the US has not yet
    adopted a “single payer” system found in nations like Canada and England in which
    the government (a.k.a. the single payer of hospital bills) picks up the tab for
    most health care. Under such a system, citizens could still choose private pay
    options if they wanted to, but government-funded care would always be available.
    At the other end of the spectrum, large groups of Americans also believe that
    single payer care would result in “socialized medicine” which would lead to poor
    service, poor medical outcomes, and the government exerting inappropriate control
    over a citizen’s health-care decisions.


    Though attitudes about how health-care should be funded are still shifting, by
    and large the current mix of attitudes continues to create an absurd landscape
    for hospitals and health-care providers. For example, the vast majority of Americans
    say that hospitals should always be compelled to save someone’s life in an emergency.
    If someone is walking past a hospital and suddenly has a heart attack, and the
    hospital can save their lives, Americans say that the hospital should be compelled
    to treat that person—whether or not they have insurance or the ability to pay.
    At the same time, a majority of American have *not* agreed that these situations
    should simply be paid for by the government.


    So the health-care industry has been told that in some situations they are required
    to provide treatment, and yet the US government has also made clear that—so far—it
    will not serve as intermediary to ensure that hospitals are paid for what they
    do. American politicians have sort of thrown the ball back to the health-care
    providers and said, “You guys figure it out from here.”


    Consequently, hospitals are forced to deal with what they call a “payer mix.”
    It’s industry lingo that means there is going to be a “mix” of customer types
    when it comes to payment. Some patients (or their insurance companies) will pay
    100 percent of their hospital bill, some will pay a portion of their hospital
    bills, and some will nothing at all. The mix is different for every hospital.
    Health-care providers who serve prosperous communities where people tend to have
    employer-provided insurance will have a mix that includes very few patients who
    don’t pay their bills. Other hospitals that serve communities of people who tend
    to be uninsured, underinsured, and lower-income will have a very small amount
    of people in their “mix” who pay 100 percent of their bills, and many who only
    pay a portion, or who pay nothing at all.


    Consider how this payer mix situation will *also* impact the prices hospitals
    are forced to set. (Imagine if you ran a hardware store where the government mandated
    that anyone who came through the door and wanted to buy a hammer—and be billed
    for it later—had to be sold the hammer. And you knew that some customers would
    pay the bill for their hammers, many would not pay, or would only pay a little.
    How would you have to price your hammers in order to stay in business?)

