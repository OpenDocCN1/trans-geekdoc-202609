    比特币也免于任何与政府或中央监管实体挂钩而带来的风险。例如，政府可以突然宣布某种纸币可以兑换为 100 美元黄金，因此其“价值”为 100 美元。或者 200
    美元。或者突然不再能兑换此前支持的物品。当政府这样做时，可能会导致通货膨胀、通缩、货币操纵以及全范围的混乱。但 `Bitcoin` 无法兑换任何实体，它的价值始终取决于人们愿意为它支付多少。而且它具有极高的流动性，易于售卖或转换。政府还可以根据需要通过发行更多货币来逐渐贬值。相反，`Bitcoin`
    无法通过这种方式贬值，因为 `Bitcoins` 的数量是独特且固定的。在剩余的 `Bitcoins` 挖完，将不再有新的进入流通。（这种终局性和唯一性将在我们深入探讨
    `NFTs` 的优势时发挥作用）。


    最后，`Bitcoin` 通过将政府几乎完全排除在外，解决了中心权威的问题。（尽管并非完全排除。需要注意的是，某些政府已明确禁止了 `Bitcoin` 等加密货币的交易）。`Bitcoins`
    是唯一的，当它们属于你时，它们可以永远属于你。但政府如果愿意，可以收回所有的纸币并将其替换为新发行的、更新后的纸币。当你拥有政府发行的实体货币时，总存在可能——尽管非常微小——该政府可以发布新的法律或裁决，对你的实体货币产生负面影响。


    这种紧张关系也存在于艺术与金世界的交汇点——这里 `blockchain` 技术和 `NFTs` 将具有至关重要的作用。在艺术世界，压迫性的政府可能会将一幅绘画或其他艺术作品宣布为淫秽、“反革命”或其他叛逆行为——因此将其非法或没收。想象一下，如果一件精美且昂贵的艺术品突然变得非法持有！但当资产以电子方式和非物理形式被拥有时，政府物理上没夺一个货币单位或艺术品的能力将变成一个棘手得的问题。对于政府来说，要要实施此类压迫性规则将是极其困难。


    ![images](img/f0002-01.jpg)


    《瑞克和莫蒂》的创始人 Justin Roiland 为一个 `NFT` 赚了超过 100 万美元，该 `NFT` 由一张简笔画的《辛普森一家》角色裸体草图组成。


    总之，`blockchain` 是一种自我保护的数字账本，记录了账本上的所有内容以及与此相关的所有合法反应。它解决了溯源、伪造和各种物理欺骗的问题。当被用作货币支撑时，它在防止不当的政府干预和监管方面也迈出了巨大一步。


    ### 如果那是区块链，那么什么是 NFT ？


    简单来说，一个 `NFT` 是一个由 `blockchain` 支持的数字代币——就像 `Bitcoin` 一样。然而，`NFT` 还代表一个独特的数字文件——而不是货币单位——这个数字文件通常以视觉艺术作品、`GIF`、音频文件或类似物品的形式存在。


    另一种思考方式是，`NFT` 是一件与 `blockchain` 绑定的数字艺术、视频或音频，就像一个 `cryptocurrency` 单位一样。然而，虽然同一种
    `cryptocurrency` 的单位在技术上都是独特的，但它们的价值也都是相同的。（你现在就可以上网查一下 `Bitcoin` 值多少钱。那个数字将是所有
    `Bitcoins` 的市场价格）。`NFTs` 可能由同一个 `blockchain` 支持，但在大多数情况下，它们的价值是不同的——就像它们是独特的艺术品一样。因为它们确实是。


    而且就像艺术品一样，数字 `NFT` 艺术品没有像你可以查阅 `Bitcoin` 价格那样的可以查阅的“市场价”。数字 `NFT` 艺术品不会有一个你可以查阅的“市场价”，就像你可以查阅
    `Bitcoin` 的价格一样。数字 `NFT` 艺术品不会有一个你可以查阅的“市场价”，就像你可以查阅 `Bitcoin` 的价格一样。数字 `NFT`
    艺术品不会有一个你可以查阅的“市场价”，就像你可以查阅 `Bitcoin` 的价格一样。

