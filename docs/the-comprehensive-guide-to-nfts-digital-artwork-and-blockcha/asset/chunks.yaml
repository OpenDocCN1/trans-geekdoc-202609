  trans: '

    基于 NFT 的艺术与传统实体艺术的另一个共同点是，它们都是由人类创作的。捕捉为 NFT 的数字艺术利用了计算机技术，但归根结底，是一位真实活着的艺术家在按下键盘。在当今的艺术市场上，了解创作艺术的艺术家将比以往任何时候都更加重要。


    原因是 NFT 呈现了一个艺术史上独一无有的局面，因为对于所有 NFT 来说，我们仍然非常接近“元年”。几乎所有创作过 NFT 艺术品的艺术家仍然在世。在绘画或雕塑世界，作品获得最高拍卖价格的大多数艺术家已不在人世。他们中的许多人早在几个世纪前就去世了。但不知为何，NFT
    艺术家现在的价格已经可以与艺术界的一些老大师并肩齐，但不同在于他们还没有去世（在很多情况下甚至还很年轻）。你可以在 Twitter 和 Instagram
    上关注他们，如果你喜欢，甚至可以与他们面面。这是一种令人震惊的改变，无论怎么强调都不为过。（尽管如此，我们会尝试使用斜体。）


    高端收藏艺术出现了一种完全全新的格式，而且几乎在该格式下工作的每一位艺术家仍然在世。如果你能在 Facebook 上加梵高的的朋友，或者给马蒂斯发邮件，或者订阅巴斯基亚的在线通讯会怎么样？对于基于
    NFT 的艺术家，1）你可以这样做，2）如果你计划成为一名严肃的 NFT 收藏家，你绝对应该这样做。几个世纪后，21 世纪 10 年代末和 20 年代初将被艺术界称为
    NFT 的“黄金时代”。不仅是因为这是 NFT 登场的时候，还因为当时所有原始 NFT 艺术家仍然在世并创作艺术。遥远的收藏家将对今天 NFT 收藏家获得的机遇深表嫉妒和羡慕。历史上充满了收藏家成为艺术家赞助人——和/或个人朋友的例子，这导致了对许多艺术家作品的令人印象深刻的收藏。我们不是说你必须亲自与艺术家套近，但现在是一个充实自己并至少考虑了解那些在
    NFT 格式下工作的艺术家的好时机。这样的机会在收藏史上非常罕见！


    现在也是进入 NFT 艺术领域的绝佳时机，因为我们还没有看到“黑暗物质”或“黑暗收藏家”的影响力将会如何……仅仅是因为他们还没有建立。


    对于那些不熟悉的人，这些“黑暗”相关术语在艺术界通常用来指代对市场施加无形手的力量——这些力量往往让艺术市场表现出不理性的方式。因为这很重要——而且绝对具有影响
    NFT 定值的潜力——让我们来看一个假设的例子。假设有一位名叫“Andy W.”的多产 20 世纪视觉艺术家。再假设 Andy 在一生中创作了成千上万幅绘画和版画，今天有成千上人在收藏他的作品。一些艺术收藏家拥有的作品如此，以至于他们在他的作品中拥有重大的财务利益。现在，假设一张由
    Andy 签名的名为“Marilyn”的著名女演员版画通常在拍卖会上以 100 万美元出售。让我们进一步说，即将的一场拍卖中，几件这样的签名玛丽琳将在大型拍卖行待售，但许多艺术行业专家指出，市场上已经充斥着大量的玛丽琳；他们推测市场可能会过饱和，因此价格可能会下跌。


    然而，在拍卖当天发生了一非常奇怪的事情。每当一张玛丽琳上拍出售时，最初会有一些热烈的竞价，但当价格达到约 50 万美元时，竞价就变得乏力。但每当这种情况发生时，一小群匿名竞买者就会加入。该小组的成员相互竞价，将价格推高到
    100 万美元左右。然后其中一人以该价格买下了这张玛丽琳。这种模式似乎在场拍卖拍卖提供的每件 Andy 作品上都发生过。


    刚刚发生了什么？为什么一群匿名买家会冲出来，防止签名玛丽琳以其看似自然的半价（50 万）出售，而是通过推高价格并自己支付一个不必要的高价？艺术界的一个肮脏的秘密是，这些匿名（或简单说未知的）买家可能是代表富有的收藏家行动的“代持买家”，这些收藏家已经拥有了许多这样的
    Andy W. 签名玛丽琳。他们推高价格是因为对他们来说，确保在有更多作品加入市场时，这些作品的价格不会下跌是他们的利益。而艺术拍卖可以作为艺术品的一种“交易”场所——在此时，特定艺术家或类型艺术的价值可以被设定。例如，假设我是一个富有的艺术收藏家，拥有
    100 张每件价值约 100 万美元的签名玛丽琳。如果在一次艺术拍卖会上，一张与我的相似的玛丽琳仅以 50 万美元的价格出售，那么艺术估值师可能会认为市场已经饱和，而玛丽琳的真实价值现在就是这个新金额。我刚刚损失了
    5000 万美元的财富！但现在想象我知道这可能会发生，所以我派人代表我参加拍卖，如果那张玛丽琳似乎将低于 100 万美元出售，我就让我的人把价格推高到那个数字。我只花了
    100 万美元就省了 5000 万美元。


    ![images](img/f0028-01.jpg)


    Pak 是一个加密艺术家，能够在保持完全匿名的情况下出售他们的作品。


    通过这种方式，传统市场在涉及艺术品销售和定价时，可能会感受到这种诡异、奇怪且看似不合逻辑的操控。当然，收藏艺术品归根结底只是另一种形式的艺术，这意味着某一天我们可能会看到这些黑暗力量发挥作用。然而重要的是，目前它们还没有施加强有影响（如果有的话）。收藏
    NFT 艺术品的另一个考虑因素是机构的角色。著名博物馆和文化机构将购买美术品和/或接受它们作为捐赠，这也是艺术市场的一个关键驱动力。艺术市场之外的人低估了博物馆接受捐赠作品所带来的影响力和力量。

