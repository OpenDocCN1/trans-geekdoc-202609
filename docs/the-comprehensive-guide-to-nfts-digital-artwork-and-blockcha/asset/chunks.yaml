    艺术收藏家的处也会变得更好。NFT 将让那些以前从未想过自己能担任这一角色的人群也能参与艺术收藏。想一下当人们使用“艺术收藏家”这个词时，他们通常会想到什么（以及谁）。这通常是指有能力购买精美术品的人，但不仅于此。他们可能还需要依赖专家“向导”来引导他们发现那些可能最有投资价值的作品。他们应该有物理空间来存储购买的艺术品（无论是在座庄庄的豪宅里，还是在气候控制的存储设施中）。我们想象中的这类人生活环境足够安全，不必太担心他们的收藏品会从墙上被偷。我们想象他们离艺术销售中心足够近，以至于一旦决定出售某件艺术品，可以安排许多合格的潜在买家进行交易。


    将此与 NFT 爱好者潜在收藏的世界进行对比。由于作品是以数字形式呈现的——而且任何人可以在任何地方进行购买——NFT 收藏家不需要生活在有联系的沿岸精英中，也不需要知道购买作品的正确场所和人。任何地方的任何人都可以在网上发现下一位伟大的
    NFT 艺术家。而销售 NFT 的艺术家和实体，一旦有人对作品出价，就没有理由拒绝交易。他们甚至可能没有这种能力。（在精美术品界，画商知道，*谁*购买了某位在世艺术家的作品，就有潜力影响该艺术家后续作品的价格。因此，希望某位艺术家作品的市场价值上升的画商，首要希望是这件作品能被一家领先的博物馆购买。如果无法实现这一点，那么一位已经购买过许多经典派艺术家作品的顶尖收藏家就是次优选择。列表底端是一个以前从未买过艺术品的初次收藏家。有可靠的传闻说，画商会直接拒绝向那些（在画商看来）缺乏足够既有收藏的收藏家出售绘画。）易见，NFT
    的兴起将完全颠覆这一局面。艺术界将不再有“内部人士”和“后台交易者”来决定谁值得购买某些东西。


    对于想要投资艺术——但是艺术收藏的新手，或者恰好住在没有强有力艺术社区的物理位置的消费者来说，这种影响将在多个方面带来一种重要的公平。购买艺术可以成为创造跨代家庭财富的一种方式。它是美国梦的重要组成部分。而
    NFT 可能会为工薪家庭开启这一全新的资产类别。我们能看到更多像 Beeple 那样飙升至八位数的 NFT 销售吗？肯定的。但我们也看到许多艺术家以三位到四位数的价格出售
    NFT。由于它们与区块链的联系以及 NFT 带来的其他潜在优势，这些艺术品极有可能与它们那些价格昂贵到天文数字的“表兄弟”一起逐渐升值。即使是价值的微小增长，也有可能对获得作品的家庭产生意义的长期影响。简而言之，NFT
    将一种通常仅供极富人享有的投资模式，并帮助它变成越来越多人负担得起的东西。


    这也是一个很有把握的领域，即未来的创新将极大地帮助收藏家。点对点模式以及在线策展人正在进行的初步工作，展示了该领域未来可能实现的一些兴奋事物。我们只需拭目以待。


    现在许多聪明且富有创意的人正在回答的一个特别有趣的问题是：“一旦你买了一个 NFT，展示它的*最佳*方式是什么？”


    就像在触感艺术世界一样，拥有一件艺术品最好的部分之一可能是让人们知道你拥有它带来的文化资本。（我注意到，有些人人倾向于安静地收藏，只需让他们的艺术品静静地、在视线之外升值。这也是一种很好的模式。我不在这里评判！）但对于那些希望将展示快感作为
    NFT 购买体验一部分的人来说，未来几年将开发出大量的选择。有些可能是含蓄的。有些可能是直接且俗艳的。有些可能需要技术知识。但实际上任何以任何价位购买 NFT
    的人，都能找到一种有趣且令人兴奋的方式来分享他们的新投资。


    在下一节中，我们将继续观察 NFT 革命将为所有人带来的积极优势——并探讨如果我们操作方法得当，NFT 将如何避开某些困扰过加密货币的陷阱。


    # 第三部分


    ## NFT 的前行之路


    NFT 的广泛采用具有跨越整个行业的革命性潜力，并可能引发自加密货币和 `Bitcoin` 引入以来未曾见的变革。NFT 的影响还可能更加强大，因为 NFT
    能够保存文化遗产、数据和数字信息——本质上是地久天的。


    NFT 也还准备好具有革命性，因为数字伙伴关系允许几乎任何人（或任何品牌）来创建一个。


    铸造自己的加密货币通常需要在时间、技术和资金上投入大量，并使用加密货币交易所来促进货币的发布。是的，自 `Bitcoin` 之后已经发行了大量的加密货币。（行业领袖估计，截至
    2021 年初大约有四千种加密货币。）然而，与现在正在创造以及未来将创造的 NFT 相比，这个数字完全显得微不足道。随着品牌开始理解将其内容作为 NFT 销售的益处——以及使用
    NFT 与客户群体进行互动并建立建立桥梁——我们将看到 NFT 在各个学科和行业的应用出现近乎指数级的爆炸。在企业层面，有理由相信 NFT 可能会像今天的社交媒体一样，成为营销部门不可或缺的一部分。（正如各国营销部门在
    21 世纪初增加“社交媒体明星”一样，在不久的将来，他们可能会为“NFT 明星”投放广告。）


    ![images](img/f0016-01.jpg)


    *匿名艺术家 Pak 一直是 NFT 创新的先驱*。


    NFT 易于创作，非常有用，而且很快就会产生大量的 NFT——出现在我们生活中几乎涉及任何数字内容的每一个领域。


    是的，像《每一天：前 5000 天》这样的重大艺术品作为 NFT 将享有特殊优势，但更、更易获得的购买品也是如此。随着一切趋向数字化，像球卡之类的收藏品很快就会向
    NFT 转型。即使是消费能力有限的年轻人，也能享受到知道自己独拥有独特副本带来的兴奋感。


    NFT 未来之路的另一个重要部分将由艺术家们自己塑造。创意人士曾多少听过那句老掉牙的调：“我们付不起你的报酬，但这将是很好的曝光。”好吧，有了 NFT，报酬和曝光*将手并并行*。创意作品作为
    NFT 销售时是独特的物体，但并不意味着艺术品本身在数字形式下不能展示。艺术品被看到的越多，其升值的可能性就越大。因此，NFT 所有者可以在享受其数字资产升值的同时，仍然根据自己的意愿向其他人展示实物艺术品。这真是一两兼得！

