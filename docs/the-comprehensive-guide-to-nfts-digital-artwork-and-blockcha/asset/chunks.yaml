    And one day, far in the future, in a marketplace where NFTs are so common they
    hardly raise an eyebrow, we may look back in amusement knowing that it seems to
    have all started with collectible digital cats.


    ## Are there any areas of controversy within crypto, blockchain, and NFTs?


    Blockchain technology has seen its fair share of skepticism and criticism. At
    this point, I suppose we should be used to it!


    Since the dawn of time, new inventions and innovations have given rise to confusion
    regarding the unfamiliar new product. In some unfortunate cases, this has set
    the stage for consumers making purchases in which they did not fully understand
    what they were buying—or even for outright fraud.


    The good news is that blockchain-backed technology is becoming more familiar to
    everyone, including people who may not be on the leading edge of tech (or tech
    savvy at all). The essentials of what blockchain is and how it works are getting
    out there. Everyone has heard of `Bitcoin`—which is a start—even if they don’t
    know how it works or how to buy it. While there is still the potential for miscommunication,
    an increasingly educated consumer base means that in general there is less confusion
    around blockchain technology.


    The even better news is that, when it comes to NFTs, their unique technology is
    providing a strong counter to much of the criticism that their predecessors experienced.


    Cryptocurrencies like `Bitcoin`, for example, have long been criticized for their
    energy consumption and carbon footprint. How can a digital coin—that you can’t
    even hold or touch—have a carbon footprint in the “real world”? The answer is:
    because `Bitcoin` maintains its blockchain by mining, the miners will always need
    electricity to power the computers doing the mining. As `Bitcoin` has grown—and
    more and more of the coins have been mined—the cost of mining has accelerated
    ever upward. A study by the University of Cambridge published in early 2021 reported
    that, globally, `Bitcoin` mining now uses approximately as much electricity each
    year as the country of Argentina. All of this power use raises the specter of
    carbon emissions and elevates the carbon footprint of `Bitcoin`. And alas, most
    of the energy powering `Bitcoin` mining does not yet come from renewable sources
    (even though `Bitcoin` enthusiasts are promising that this is soon going to change).
    The good news is that contemporary NFTs can be produced in ways that have only
    the smallest fraction of the environmental impact of something like a `Bitcoin`
    (again, more on this later.) If they are rolled out the right way, NFTs won’t
    have to create the energy drain that Bitcoins do.


    Other criticisms of blockchain products have come from enabling “pump and dump”
    schemes, or schemes in which a cryptocurrency with no value has been launched
    to intentionally dupe newcomers. For example, as the value of `Bitcoin` slowly
