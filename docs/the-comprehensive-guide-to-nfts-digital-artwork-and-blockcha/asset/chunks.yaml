    Imagine the connection to the action for “superfans” (be they wealthy individuals
    or corporations) if they owned the NFT for a space on the uniform of their favorite
    athletic team?


    When NFTs correlate 1:1 to items and spaces in the real world, sports and sports
    entertainment stand to benefit. And again, it’s not just teams.


    Individual athletes—even ones who play team sports—will be empowered by the opportunities
    that NFTs bring.


    With the rise of interest among athletes in the lifestyle space, athletes will
    be able to bring their creative vision applicable to the lifestyle categories
    to new levels. NFTs will provide athletes with a direct line of communication
    with their fanbases. This will change the balance of power even further in the
    athlete’s favor. When it comes to offering access to new sneakers, performance
    gear, training tips, tickets to sporting events—or anything at all that the athlete
    wants to share—the sports players themselves are going to have more of the power
    when it comes to connecting with—and selling to—the fanbase.


    ![images](images/f0022-01.jpg)


    *NFL star Rob Gronkowski launched his own NFT website: [GronkNFT.com](http://www.GronkNFT.com)*.


    In summary, professional sports might be the best real-world example we have of
    NFTs creating explosive new revenue lines while empowering brands, creators, and
    individuals.


    And it’s just getting started.


    *Video games*'
