  trans: '


    NBA 比赛的 NFT 对粉丝来说之所以有意义，有很多原因。


    在某些情况下，粉丝想要购买一张他们亲身参加过的比赛图像 NFT——这在某种程度上是保存赛程单的数字类比。在其他情况下，粉丝则希望在历史上最重要的比赛之一中感受到所有权。如果出现了一次史诗级的投篮、盖帽或扣篮，作为粉丝的他们来说，能够永远拥有那一个瞬间将是非凡的。而其他
    NBA Top Shot 的客户似乎喜欢这种未知的快感，热于投资包含几张“神秘”NFT 的低价卡包。


    NBA Top Shot 还是一个现场实验室，其他体育团队可以在此观察关于价格优化的 NFT 业务实时实验。NBA 拥有海量的——尽管技术上是有限的——内容，追溯到
    1946 年联盟的第一场比赛。这些内容如何才能实现最佳商业变现？比赛历史上最令人记忆的图像应该多快发布？我们目睹了 NBA Top Shot 在“仅发布标志性时刻的单一
    NFT 图片”与“发布有限的标志性时刻 NFT（每个像艺术家签名版画一样具有独特编号）”之间反复权衡。


    我们还在观察 NBA Top Shot 如何学习对其 NFT 进行品牌化和主题化，以契合观众的兴趣。目前对主题化的 NFT 卡包有大量的实验，例如伟大的扣篮、新秀表现、全明星、后起之星等等。NBA
    Top Shot 网站定期提供这些主题包的限量版，并注明它们售罄的速度有多快，以强调其稀缺性。


    “这些听起来很好，”你可能会说，“但如果这些粉丝是在花钱买 NFT，*而不是*购买其他的 NBA 收藏品呢？换句话，你如何知道 NBA Top Shot 没有在蚕食其他
    NBA 资产呢？”


    诚然，受 COVID-19 影响，2020 年和 2021 年的情况很难预测，但有一个巨大的指标显示 NFT 没有损害其他以 NBA 为导向的利润线：篮球卡。实体篮球卡在
    2020 年底和 2021 年期间了巨大增长，并在 2021 年 2 月底一张单卡以 460 万美元的创纪录价格成交，达到了高潮！如果 NFT 的崛起对实物收藏品产生了影响，这种影响也是积极的而非消极的。


    甚至 NBA 球员自己也开始了收藏，这进一步推动了对产品的关注。NBA 球员经常在社交媒体上发布他们开启 NFT 卡包的视频。有时他们希望得到自己的 NFT，但大多数球员似乎只是像其他人一样单纯享受收藏。


    随着 2021-2022 NBA 赛季的开启，另一个变得更具衡量性的因素是：向 NFT 的转型是否推动新一波粉丝进入场馆。区块链技术的爱好者发展出了自己独特的文化，而
    NBA 已成为首个接触这种文化的职业体育联盟。NBA 向数字收藏品粉丝迈出了一步，如果结果我们看到新粉丝占据了更多场馆座位，这可能并不意外。那些最初纯粹将
    NBA NFT 视为收藏品和投资工具的人，可能会变成篮球粉丝。


    同样值得注意的是，NBA Top Shot 的 NFT 可能作为连接收藏体育 NFT 与收藏*艺术品*（objets d’art）之间的“桥梁”。所有的比特币都是唯一的，但它们本身并不具有收藏价值。除了历史之外，任何一个比特币都不会显示出其他一个比特币无法比拟的特殊之处。虽然
    NFT 艺术品具有具有吸引力的视觉元素，但很难知道是什么让它们具有价值。（这适用于所有艺术形式。为什么梵高的作品比你高中最好的艺术学生画的最佳作品更值钱？你如何发现这种区别？你如何知道该投资其中一个而不是另一个？）


    但 NBA 中精湛的技艺成就让理解定价变得稍微简单了一些。即使是非专业人士，也能很快接受这样一个观点：比赛中某些关键动作和图像之所以是最核心的，是因为它们所代表的意义。在数字收藏家习惯于从加密货币转向数字篮球比赛动作后，他们可能会从捕捉篮球动作的
    NFT 转向 NFT 精美艺术品。因此，通过这种方式，所有领域都将再次受益。


    随着 NFT 的扩展，未来的几个月和几年将继续回答我们关于职业体育如何与粉丝建立联系的问题。目前，NBA 是当地少数几个项目之一。但当职业橄榄球、棒球、冰球等运动也拥有授权的
    NFT 时，市场会如何反应？随着消费者探索其他运动，NBA NFT 的需求会下降还是会继续上升？也许更紧迫的问题是，NBA 是否会因为“抢占先机”获得回报？回顾加密技术的历史及其驱动它的趋势，有充分理由相信，虽然其他体育联盟也可能在
    NFT 上取得成功，但它们将嫉妒 NBA 所获得的早期优势。


    ## 个人运动员


    我们研究了整个联盟，但个人运动员又是呢？


    这个领域也发生着有趣的创新。2021 年 3 月底，一位名叫 Oleksandra Oliynykova 的克罗地亚网球运动员（注：原文为网球手）将她右臂的一个空间作为
    NFT 卖掉了。虽然在运动服上出售空间的概念并不新鲜，但 Oliynykova 通过出售与其与区块链挂钩的手臂空间独占所有权，将此推向了新的高度。Oliynykova
    将赋予该空间所有者展示任何他们选择内容的权利——以临时纹身的形式——只要这不违反她所参加的网球比赛规则或不宣扬仇恨。重要的是，Oliynykova 是一位な新星，她的排名虽然不是顶尖，但正在上升。因此，随着她水平的提高，这个
    NFT 的价值具有天数字增长的潜力。


    现在让我们把这个真实案例扩展到理论层面。如果可以拥有球员身上某个空间的 NFT，为什么不能拥有多个球员的呢？为什么不能拥有一个球队的呢？想象一下，如果“超级粉丝”（无论是富有的个人还是公司）拥有他们喜爱的运动球队球衣某个空间的
    NFT，他们与比赛之间的联系将是怎样的？


    当 NFT 与现实世界中的物品和空间 1:1 对应时，体育和体育娱乐将从中受益。再次，这不仅仅是球队。


    个人运动员——即使是参加集体运动的运动员——也将从 NFT 带来的机遇受益。随着运动员对生活方式领域兴趣增加，他们将能够将适用于生活方式类别的创意愿景提升到新的高度。NFT
    将为运动员与其粉丝群体提供一条直接的沟通渠道。这将进一步使权力平衡向运动员一方倾斜。在提供新球鞋、性能装备、训练技巧、体育赛事门票——或运动员想要分享的任何东西时——运动员本身在连接和向粉丝群销售方面将拥有更多的话语权。


    ## 结论


    总结来说，职业体育可能是我们所看到的关于 NFT 如何在创造爆发性新收入增长的同时，赋能品牌、创作者和个人的最佳现实案例。


    而这才刚刚开始。


