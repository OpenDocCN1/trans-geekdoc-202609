    to see serious artists taking second and third looks at what can be created in
    the digital arena. There are a finite number of Sistine Chapel ceilings that can
    be painted in the flesh and blood world, but everything changes when artists become
    comfortable working in the world of VR!


    **Beyond NFTs**


    In what other spheres is blockchain technology making an impact? Read on.


    *Real estate*


    Real estate has been quietly benefitting from blockchain technology for some time
    already, and it stands to continue that trend.


    Real estate began as an industry built around face-to-face transactions. One thinks
    of personal meetings with agents, touring properties in person, and showing up
    in offices to sign stacks of paperwork. However, digital innovation has helped
    the industry grow, become more accessible, and remain more competitive. Just a
    generation ago, it was difficult to imagine viewing a property for sale “virtually.”
    Now, it’s difficult to imagine the home buying process without this.


    With innovators like Stephane De Baets tokenizing ownership of the property we
    are seeing still new ways that block-chain technology and real estate can be connected.
    Yet even changes like the one Stephane has facilitated do not paint the entire
    picture of what will soon become possible in the world of real estate.


    Blockchain technology will make real estate leaner, faster, and more agile. When
    properties are tokenized, trading those tokens will allow for new ownership scenarios.
    Let’s say a prominent commercial property has gone into bankruptcy. It has been
    seized and will be sold at auction by the bank. However, instead of auctioning
    the entire building off to one bidder, what if the bank tokenizes the ownership
    into a hundred thousand tokens? Theoretically, an enterprising bidder could purchase
    all the tokens and own the property outright. But a more realistic—and interesting—scenario
    is that the building will have multiple owners. As the property is once again
    made available to tenants, the value of those tokens will increase. (And to help
    the initial auction, the bank can—if it wants to—specify that the tokens can be
    sold back to the bank for a certain amount of fiat currency.)


    Blockchain technology can also help the real estate market by speeding up transactions,
    and lowering costs and fees. Handling everything from taxes, to lawyers, to listings
    takes time and people. But new platforms and payment methods may facilitate the
    construction of a new industry “norm” in which transactions are recorded on the
    blockchain, and “middlemen” get cut out because they’re rendered unnecessary.
    Things like the past ownership of a property, what was paid for the property,
    and *when* it was paid, can all be recorded on the blockchain. And so can every
    issue with the property that ever arose.


    This lack of middlemen coupled with the immediacy with which a property’s history
    can be known will lead to increased liquidity. Look, the real estate market is
    *always* going to be influenced by external forces, and the appreciation of properties
    will *always* necessitate the passage of time. However, when buyers and sellers
    *do* decide that the time is right for a sale to happen, they can both pull the
    trigger much more quickly with blockchain. And when it comes to fractional ownership—with
    blockchain-backed tokens being traded on exchanges like cryptocurrency—then the
    sale of fractions of a property can be practically instantaneous.


    Finally, not to get too philosophical about it, but another important benefit
    to the rise of blockchain technology within real estate is likely to be a powerful
    restoration of transparency and public trust—which has the potential to help the
    entire industry do better.


    Perhaps no economic bubble or crash in living memory has cut so deeply as the
    “housing bubble” which precipitated the crash of 2008. For years—and in an environment
    that was largely unseen by the public and regulators—the mortgage lending industry
    began relaxing standards for mortgage loan applications. New industry terms like
    NINA and NINJA loans crept their way into the lexicon, and were used to refer
    to these unsound new classes of borrowers. (NINA stood for “No Income No Assets”
    and NINJA for “No Income No Job or Assets.” Essentially, banks were now willing
    to provide mortgage without verifying an applicant’s income, assets, or employment
    status.) And once these risky applicants received their loans, they were often
    shoehorned into mortgages that they misunderstood and would not be able to repay.
    The most common of these was the adjustable rate mortgage. In most cases, an adjustable
    rate mortgage meant that the borrower would pay a low fixed mortgage rate for
    the first five years of the loan. But after that, it would “adjust” up to be tied
    to a market rate. Most borrowers did not understand how dramatic this adjustment
    could be, and they felt generally confident with the idea of their mortgage payment
    increasing somewhat because they could generally count on their incomes going
    up year-over-year. Then the adjustments began to hit, and horrified homeowners
    realized that their mortgage payments were going to go up drastically—in some
    cases doubling or even tripling. And in the subsequent recession this caused,
    many people all across the country lost their jobs, which further limited the
    ability of many to make their mortgage payments.


    There were certainly other important factors in the 2008 mortgage debacle. These
    NINA and NINJA loans were sub-prime, yet Wall Street trading companies purchased
    the risky loans, bundled and repackaged them in such a way that they appeared
    to be much safer than they were, and sold them to pension funds, retirement funds,
    governments, and other entities. Then when the loans could not be repaid, these
    buyers of the bundled loans were left “holding the bag” financially speaking.
    While, again, many bad actors were to blame in this crisis, there were ultimately
    home mortgages at the core of what was being sold, and the incident will forever
    be the “mortgage crisis.” As you might imagine, the fallout for the housing industry
    was dreadful. The market correction that began in 2008 saw home values fall by
    about 30 percent. Many homeowners were left underwater, and it is debatable if
    the housing market ever truly recovered.


    But with important information about home ownership preserved on the blockchain,
    the ability for a massive real estate catastrophe to slowly generate in the darkness
    while nobody’s watching becomes almost unimaginable. The block-chain can capture
    every part of a real estate transaction, including who purchased the property,
    and what level of qualification that buyer had. With this account of record, it
    would not be possible to purchase a bundle of risky mortgages and believe they
    were truly safe investments (unless you intentionally avoided doing your research).
    All of that information you’d need to know about what you were buying would be
    there on the blockchain.


    Because an NFT-driven future will be a world in which transaction information
    can be verified peer-to-peer, everyone will feel much safer investing in real
    estate.


    There was considerable disagreement in 2008 and after regarding who had failed
    to sound the alarm. Clearly—everyone seemed to agree— *someone* had been responsible
    for ensuring this kind of thing didn’t happen. But it seemed that nobody could
    quite agree on who that responsible person was.


    With blockchain backing real estate, that need for centralized oversight won’t
    be necessary. A decentralized marketplace will have trust and verification built
    into the system.


    The potential for fraud and misrepresentation will be very small, and regulators
    will not be needed in the way they were back in 2008.'
