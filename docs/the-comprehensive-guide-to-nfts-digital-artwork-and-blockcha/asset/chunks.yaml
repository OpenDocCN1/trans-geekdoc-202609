- fmt: '

    There are businesses that can help creators “mint” their NFTs, but also platforms
    to assist in the sale of NFTs, valuers to help artists and investors understand
    the fair price of these digital pieces, and consultants to help collectors curate
    their collections.


    Luxury brands are asking themselves how a luxury purchase can include an NFT that
    then “unlocks” further high-end experiences, unique services, access to new merch
    launches, collaborations, etc. Sports companies are preparing for massive growth
    in the digital space that will be fueled by NFTs. And companies of all sorts that
    are customer-facing are preparing to connect directly with those future customers
    somewhere along the digital blockchain.


    ![images](images/f0011-01.jpg)


    `Grimes made $5.8M in a matter of minutes selling original NFT art.`


    Businesses realize that the very lexicon itself has expanded. As people trend
    toward the “authentic” and “true,” buyers will increasingly want to own the genuine
    and unique version of something. Just as uniqueness exists in the physical world,
    so too will it now exist in the digital one.


    With more and more people discovering this format every day, it’s going to be
    well-nigh impossible to “put the toothpaste back in the tube.” NFTs are here to
    stay.


    In the next section we’ll explore the types of NFTs businesses and brands are
    creating, and look at where we can expect those NFTs to create the most opportunity.


    ![images](images/f0012-01.jpg)


    `NFT art by creator Hashmask has sold for over $800,000.`


    # PART TWO


    ## An NFT . . . but What Kind of NFT


    We’re already seeing how NFTs will present a revolution for fine artists, brands,
    luxury fashion designers, elite athletes, musicians, and entertainers. We are
    forging new partnerships with clients excited to move into the space. Even prior
    to the writing of this book, our client list included Warner Brothers Entertainment,
    Barney’s New York, MoMA, and the NBA.


    The work we’ve done so far can serve as a guide to the kind of NFT opportunities
    that are out there for major brands and creators.


    In this section, we’ll look at some of the choices brands face when they are thinking
    about how to implement NFTs in their area of growth.


    To begin, let’s look at the very first choice brands have to make.


    ### Static or dynamic


    NFTs have the ability to function as tokens that can be recognized at digital
    points of contact with a brand.


    Think about how such a thing could be used in the world of, say, retail . . .
    .


    This NFT? It will entitle you to 10 percent off in any of our retail boutiques.


    That NFT? It will function as your entrance ticket to our exclusive secret event
    for our best customers.


    This other NFT? It lets us contact you when we have breaking news about updates
    for that product you bought. In fact, the NFT is embedded in the product.


    But first, it’s helpful to understand that NFTs come in two types: Static and
    Dynamic.


    “Static” for our purposes means an NFT that is self-contained. It does *not* necessarily
    mean “unmoving.” Static NFTs can take the form of still images, yes, but they
    can also include 3D, animated, VR, AR, GIFs, short videos, etc. They can also
    include audio elements (sounds), or be completely silent. So a picture, a video,
    or an audio file NFT can all be Static NFTs.


    Static NFTs usually create revenue by generating money for their creator in their
    initial sale. (They can also create revenue in perpetuity with each future transaction,
    if such a condition is specified on the blockchain. For example, it’s specified
    that each time the NFT is sold, the creator gets 5 percent of that sale price.)


    Static NFTs include NFTs sold as fine art. So when most people today use the term
    “NFT,” they are typically referring to a Static NFT. When you’re looking at (or
    listening to) a Static NFT, then what you’re experiencing is the whole width and
    breadth of what it is and what it does. It will forever be that—no more, no less.
    It may *move*—if it’s animated, for example—but it never *changes*.


    ![images](images/f0013-01.jpg)


    `Artists like WhisBe have found considerable success with NFTs containing animations.`


    **Dynamic NFTs are different.**


    Dynamic NFTs bring all the same initial qualities of Static NFTs (they may be
    video, animated, VR, pictures, GIFs, music, etc.), but they have the capacity
    to be updated through an additional connection. It may be a connection back to
    the original artist or business that created the NFT, or it may simply connect
    to a network that allows it to be updated according to preset rules. With a Dynamic
    NFT, the digital asset remains responsive to (and connected to) the issue’s original
    design, messaging, and conditions.


    ![images](images/f0014-01.jpg)


    Here’s an example of the distinction. A Static NFT of a LeBron James basketball
    card would contain his lifetime stats *up to the moment that the NFT was created*,
    and those stats would never change as LeBron continued to play new games. A Dynamic
    NFT of the same basketball card could be programmed to always update a basketball
    card whenever LeBron played another NBA game, continually keeping current.


    A Dynamic NFT can also be programmed to act in concert *with other NFTs*. For
    example, an NFT of a baseball card might be programmed to have one background
    color—or one animation—as individual members of a professional team are gradually
    collected. But when that collector buys *all* the NFTs of the entire roster of
    a certain team, the NFT could “notice” this and change to an entirely new background
    color in recognition of the achievement.


    Dynamic NFTs can also be synced to capture and preserve information about the
    users themselves . . .


    Consider a video game with a Dynamic NFT. It could constantly update each time
    the user gets a new high score. (And any dragons slain and maidens rescued could
    be preserved on the blockchain forever!)


    Consider an automobile owner. If a Dynamic NFT were connected to the car’s vitals,
    then when it came time for resale, there would be no question about how long the
    car had been owned, where it had been driven, and how frequently the oil had been
    changed. All this information would be irrevocably preserved on the blockchain.


    Or what about integrating a Dynamic NFT with a fitness app/tracker? A jogger’s
    fastest time, max heart rate, or number of steps per day could be preserved on
    an NFT that would update each time the athlete hit a new personal best.


    A Dynamic asset provides ongoing engagement with the issuer, and also holds the
    potential for ongoing transaction functionalities.


    Right now, when the general public thinks of NFTs, they think of Static NFTs.
    All the thinkpieces in magazines are about NFTs functioning as collectible works
    of art. But what’s happening behind the scenes and out of view is the laying of
    the groundwork for a whole world of these Dynamic NFTs.


    To be clear, this doesn’t mean that Static NFTs are going to go away. As you’ll
    see in the following sections, both Static and Dynamic NFTs are going to work
    together to create opportunities for artists, businesses, and brands.


    ### Static NFTs as part of a comprehensive branded environment


    Brands stand to be positively changed by the rise of NFTs (both kinds). In the
    21st century, brands are becoming more multifaceted and dynamic, and the very
    definition of what (or even who) qualifies as a brand has been changing rapidly.


    Historically, a “brand” was defined as anything that denoted a product had been
    made by (or sold by) a certain business. This is an ancient, primal definition.
    (Think about the physical “branding” of cattle that’s been going on for millennia.)

