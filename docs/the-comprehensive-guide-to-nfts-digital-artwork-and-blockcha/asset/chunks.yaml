    # 接下来会发生什么？


    没有人进门来（极少数能够负担得起自费费富患者除外）。


    你忧心忡忡地转向你的医院财务总官（CFO），问道：“怎么了？为什么我们没有更多客户了？我建立了周围几英里最好的医院！”


    你的财务总官解释了这个问题：大多数人通过*医疗保险*来支付医疗费用——这些保险是通过他们的雇主获得的，或者是从政府交易平台获得的。医疗保险公司决定哪些医院和诊所会被他们的保险覆盖。他们将此称为“网络内（being
    in-network）”。


    “不用多说！”你对财务总官说。


    你立即与当地最大的医疗保险公司安排了会议。在会议上，你展示了你所建造的医院的高质量，并为患者在那里将获得的卓越医疗服务提供了论据支持。


    “哇，”医疗保险公司的高管回答道，“看起来你确实创建了一家顶尖医院。如果使用我们保险的人去你们的机构接受治疗，他们似乎将得到极好的照顾。”


    然后，就在你认为已经板上钉同时，保险高管倾过办公桌问道：“那么，你打算为*我*做什么？”


    “为你……做什么？”你天真地问，“你什么意思？我花了这么多钱来建造当地最好的医院，这难道还不够吗？”


    这位高管对你缺乏世俗经验感到既好笑又困惑，他会温柔地向你解释：“如果我们选择将你的医院纳入我们的保险网络，你将立即获得成千上万的付费客户。如果我们选择*不*将你加入我们的网络，你就不得不依靠自费客户、政府计划以及其他支付方式的艰难拼凑来维持生存。换句话之，你*真的*想进入我们的保险网络。那么，如果你作为交换为我们做点什么怎么样？具体来说，如果你给持有我们保险来你医院的人提供大约
    50% 的折扣，直接从顶部减免。我们会在他们的账单上将其称为‘网络内折扣’。所以，如果价格单上的某心脏手术费用为 10 万美元，我们希望你只向我们收取 5,000
    美元。”


    在紧张的时刻，你停顿了一下，试图思考你的回答。令你失望的是，你意识到这位保险高管是正确的。如果你的医院想要生存下去，你就需要与保险公司建立合作伙伴关系。但另一方面，他们的要求是巨大的。你医院的定价经过仔细设定，以产生你继续提供良好医疗服务、维护设施以及支付你高素质员工薪水所需的收入。然而，这间保险公司却希望他们的每一位被保险人员都能获得
    50% 的折扣。你如何能让这在经济上可行呢？


    你离开与保险高管的会议，立即拿出手机拨通了财务总官的电话。


    “会议进展得怎么样？”财务总官问。


    “很好，”你告诉他们，“只有一件事——我们要价格翻倍。”


    然后……场景结束了。


    ## 经济困境


    这个思想实验并不是为了将美国医疗保健问题的全部责任归咎于保险公司，但它确实展示了主要参与者之一的一种常见观点。因为医院知道保险公司会要求其成员获得大幅折扣——而且医院为了获得患者绝对必须进入保险网络——所以医院除了人为抬高价格外没有其他选择，这样它们在应用网络折扣后仍然能够盈利。但这对自费的人来说意味着什么境地？答案是，遗憾的是，他们处于一个非常糟糕的境地。一个没有保险的自费富人可能只是对发现被收取的费用大约是保险公司的两倍感到懊恼。但一个手段有限的无保险者可能会承担巨额的医疗债务。


