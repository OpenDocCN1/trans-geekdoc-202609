- fmt: '

    Finally, we should limn one other large major issue the industry faces, and that’s
    in-network and out-of-network access to care. Many consumers—who `have` health
    insurance—don’t grasp the way that their health insurance company may have negotiated
    different coverage agreements with different providers. For example, say a town
    has three hospitals, but a resident’s insurance company may have negotiated different
    relationships with each of them. If that resident seeks care at `Hospital A`,
    it may be totally covered, while care at `Hospital B` may be only partially covered,
    and `Hospital C` not covered at all. While consumers are usually directed to the
    doctors and hospitals that have the most favorable network relationships, everyone
    seems to know someone who has found themselves in a situation where they were
    referred to a specialist that was not in-network and incurred large charges. In
    emergency situations, a physician best-qualified to treat a patient may be called
    in without consideration as to whether or not that provider’s fee is covered by
    the network. Adding to the confusion, in some cases, physicians from different
    provider networks can have offices located in the same hospital.


    In addition to these large, macro-level, systemic problems, the health-care industry
    faces challenges related to their ongoing dependence on outdated technology. Infamously,
    hospitals often still use fax machines and rely on paper filing systems for patient
    medical records. In the health-care industry, small inefficiencies have the potential
    to impact patient care.


    So, these are the issues we face. Now, how can blockchain and similar digital
    innovations help this important but troubled industry move in the right direction?


    ### Transparency

    The first issue will involve price transparency. To put it bluntly, hospitals
    don’t like talking about their prices. This recalcitrance has manifold reasons.
    There is the prickly need to accommodate the discounts demanded by insurance companies,
    as discussed earlier. There is a resistance to openness and competition, and often
    simply a resistance to the large cultural and logistical changes that would be
    necessary to achieve complete openness about prices. But think about it. How many
    industries can `you` name where there’s no easy access to prices for services
    rendered?


    Some hospitals are receptive to the idea of price transparency, but even these
    pioneers are often hesitant to “go first” when it comes to making the prices available.
    Because it’s so rare, the effects on that first hospital to jump into the pool
    are mostly unknown, and the risks seem to outweigh any possible benefits. This
    situation keeps even reform-minded hospitals preserving the status quo.


    But what if there were a powerful force that could compel transparency, and offer
    such efficiencies and benefits that consumers would all but demand it?


    Blockchain may be that solution. They can usher in a new era of price transparency
    for hospitals by tying prices to specific aspects of the hospital experience (a
    major surgery, a quick check-in with a physician, a few aspirin from a nurse),
    and by eliminating the confusion that comes with the cost of an entire “hospital
    stay.”


    With prices listed on the blockchain, consumers will have access to exactly what
    the costs of medical services are, and have been over time at an institution.


    When consumers get a taste of transparent pricing, it will drive demand across
    the industry, and also create trust between patients and health-care providers.
    Patients will become more educated about how the industry works. Many people don’t
    think about why the price of health care can be high. But when consumers see the
    reasons behind the initial prices hospitals must set, it may spur them to support
    insurance industry regulation and reform, or even political action.


    Most importantly, transparency may encourage certain people to be more likely
    to seek care, which can be potentially lifesaving.


    ### Patient Care

    Verifiable credentials may also help to improve patient care once the patients
    are inside the hospitals. Medical records are moved from facility to facility
    as patients move. In the best cases, this happens seamlessly, but in far too many
    notable cases, medical records can be incomplete. Physicians have to generate
    entirely new medical histories each time they see a new patient. Blockchain technology
    could make it easy for physicians to be certain they had a definitive, tamper-proof,
    and complete record of a patient’s history each time they had a visit. Patients
    traveling abroad could travel with their medical history secured on the blockchain.
    This could help ensure that whatever might arise, wherever in the world they were,
    the local physicians would have what they needed to give treatment. A peer-to-peer
    network between international hospitals would also make this arrangement possible,
    and would require no action on the part of patients.


    Addressing the many challenges facing American health care is one of the biggest
    projects that could be undertaken with any new technology. But with something
    as powerful as blockchain technology, reformers will have a powerful new weapon.
    We can all hope that it leads to fair and equitable pricing, and superior patient
    care.


    ### Government

    Perhaps one day we’ll elect politicians in a transparent, blockchain supported
    voting system, but even before then, how do we ensure that they do what they were
    elected to do? (At least, most of the time . . .) How do we eliminate corruption?
    How do we ensure government runs effectively and efficiently?


    Blockchain technology has roles to play in all of these questions. While some
    of the challenges of government work may always be intractable, there’s good reason
    to think that block-chain technology can help governments of all sizes make substantial
    improvements along many fronts.


    Probably the biggest issue facing government is corruption. More specifically,
    the ways in which public funds are used can be extremely vulnerable to inappropriate
    influence.


    Look, governments `need` to spend money. They need to pave roads and build playgrounds.
    They need to hire workers to perform essential services. But they are supposed
    to do this in a way that does not reward the friends and family members of the
    politicians in power.


    Corruption involving public funds is an issue in every country around the world—whether
    large or small, rich or poor. Any scalable solution that could address it in a
    meaningful way would literally have a positive impact for every nation on earth.


    So how can blockchains help? Blockchains can help by making the public procurement
    process completely transparent. They can eliminate ambiguity surrounding who offered
    what, and when. They can also make the decision-making process of the officials
    more transparent, eliminating the possibility of “shady backroom deals.”


    For example, let’s say a local government needs to hire a construction company
    to build a new bridge. Ten different construction companies put in bids. The elected
    official charged with making the final decision has ties to some of the construction
    companies. (Maybe one is owned by his brother, and another by one of his college
    friends.) How can the elected official prove that whatever company he picks was
    selected free from undue influence?


    The answer is that the election official can initiate a block-chain backed process
    that facilitates third-party oversight and makes crucial components of the bids
    transparent and unable to be retroactively altered.

