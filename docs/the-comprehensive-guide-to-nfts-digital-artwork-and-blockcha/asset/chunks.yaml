  raw: 'Also, make certain that anyone encouraging the public to buy your NFTs would
    not violate rules governing securities if your NFTs were considered to be securities.
    For example, the SEC has investigated celebrities for endorsing or advertising
    securities products (like stocks) on their social media accounts without disclosing
    their relationship to the company behind the stock. (For example, not disclosing
    that they are a paid endorser of the brand.) We’ve seen already that this includes
    blockchain-based products. In July of 2017, the SEC issued a “Report of Investigation”
    into celebrity endorsements of cryptocurrency ICOs. The SEC noted that: “Any celebrity
    or other individual who promotes a virtual token or coin that is a security must
    disclose the nature, scope, and amount of compensation received in exchange for
    the promotion.” If you use celebrity endorsements, make sure the celebrities disclose
    their relationship to you. If endorsers are unpaid, but own NFTs that your company
    sells, make sure this is also stated.


    When it comes to regulators from the world of fine art, it is likely that the
    two areas of focus will be 1) ensuring that persons purchasing NFTs understand
    precisely what they are (and aren’t) buying—at least while NFTs are still “new,”and
    2) ensuring that NFTs are not used to launder money. The first goal can be accomplished
    with simple consumer education. Artists who sell NFTs directly, and platforms
    that sell NFTs from multiple creators, should just have an educational page—or
    at least links out to one—to help art buyers who may be new to the space understand
    what they get with an NFT.


    ![images](images/f0030-01.jpg)


    *To the surprise of many, Paris Hilton has used her notoriety to create positive
    change via NFTs. Back in March 2020, she sold one of the first notable NFTs—a
    drawing of a kitten she’d done on her iPad—for $17,000, with all proceeds going
    to charity*.


    To prevent regulatory agencies from stepping in as a response to money laundering
    concerns will be trickier. However, the NFT community can by putting in place
    its own safeguards and industry best practices. At a very high level, these might
    include things like:


    • Creating protocols for filing “suspicious activity reports.” As an industry-wide
    procedure, anyone dealing with an NFT transaction that, for any reason, felt a
    bit “fishy” should have a way to easily report this to the authorities for further
    investigation.


    • Doing additional due diligence whenever a purchaser has a known history of criminal
    activity such as art fraud.


    • Flagging third party purchases of NFTs. That is, noting instances in which Person
    A sells an NFT to Person B, but Person C pays for it.


    • Conducting regular risk assessments of fraud in the marketplace, and training
    employees on how to detect and prevent fraud.


    Despite the inherent built-in safeguards against fraud in every NFT, regulators
    will still find it heartening to see self-regulation. Steps like those outlined
    above are not challenging or cumbersome when compared to engaging with a formal
    government regulatory body.


    In conclusion, the final regulatory status of NFTs involves guesswork—yes—but
    it’s educated guesswork. With just a little creativity, it can be easy to see
    the issues that may impact NFT regulation in the future. By preparing to navigate
    those issues now, everyone involved in the NFT ecosystem will be better positioned
    for long-term success.


    **Slow build, explosion, or slow fade?**


    Beyond regulation, the other big unknown for companies in the NFT space is how
    NFTs will grow from here. For example, will we see a slow and gradual adoption
    by the marketplace? Will we see a sudden trajectory that sends their prevalence
    skyrocketing? Or will they swell and then fade, possibly even receding from usage
    in the marketplace?


    It should be clear by now that we believe NFTs have a strong and reliable place
    in the future of art, commerce, and marketing. Even so, let’s examine all possible
    pathways for the future, and consider how “the rest of the story” of NFTs is likely
    to play out.


    The first scenario is that NFTs will continue to gain slow and steady footholds
    across industries, and take incremental steps forward. Each new business that
    tries using NFTs is going to be “taking one for the team” or at least taking a
    risk without guarantee of a reward at the end of it. But when one industry leader
    demonstrates the strong business advantages of working with NFTs, it will be challenging
    for others in the same space to avoid the urge to jump in the pool. Investors
    too will gradually become comfortable with NFTs as an asset class. The advantage
    of provable ownership rights will be irresistible. Collectors may realize this
    gradually, but they *will* realize it. Artists may be uncomfortable with NFTs
    at first, but they will follow the trends and eventually realize that NFTs can
    represent an entirely new income stream. As the technology slowly expands and
    creating NFTs becomes easier, cheaper, and more environmentally friendly, everyone
    can get involved in the game. Kids may start creating NFTs *just because it’s
    fun*. In this scenario, most people who get involved in NFTs will understand what
    NFTs are, what blockchain is, and pretty much everybody involved will have reasonable
    expectations for what we can expect from the technology.


    In a second scenario, NFTs take off very quickly, and *not* everybody understands
    what they are doing when they go out and get involved. The atmosphere is driven
    by FOMO.


    Businesses jump into the NFT space before they completely understand 1) how NFTs
    can be used, and 2) in what ways NFTs can be optimized for *their* industry. Though
    it might sound like a good thing for NFTs to take off quickly, problems can arise
    if companies feel they “have to” launch NFTs.


    It might sound like a strange analogy, but historians agree that a sort of FOMO
    like this led to the opening stages of the First World War. Countries heard that
    other countries were beginning to arm for a big conflict, so *they* started arming
    for a conflict for fear of appearing unready. They did it just because everyone
    was doing it, whether or not it made any sense to! It became a self-fulfilling
    prophecy, with a horrible result.


    If enough large brands jump into NFTs “early and often,” smaller or less agile
    brands may feel there’s something wrong with them—or that they’ll appear weak
    or out of touch—if they don’t follow this lead. And what’s the result? A lot of
    companies with NFTs they don’t know how to sell. Dynamic NFTs that aren’t particularly
    targeted, and don’t do a good job of forming connections with customers. Static
    NFTs that go uncollected. Problematically, this will result in NFTs looking less
    useful and promising than they actually are. The reason will be that businesses
    and brands didn’t look before they leapt. They rolled out NFTs that aren’t useful.
    Now, the NFT marketplace will be able to recover from this initial over-reach.
    The genuinely useful and desirable NFTs will still connect with consumers. However,
    the “boom and bust” feeling will leave a bad taste in peoples’ mouths for quite
    some time.


    The other scenario—the worst one, but, in my opinion, also the least likely one—is
    that NFTs will exist in a diminished form and businesses and artists might fail
    to take advantage of the benefits they bring. How could this happen? Well, with
    Static NFTs, the art market could decide that digital art isn’t as important as
    physical art. Art historians would deem NFTs unworthy of serious study. Or the
    demand could fail to maintain.'
