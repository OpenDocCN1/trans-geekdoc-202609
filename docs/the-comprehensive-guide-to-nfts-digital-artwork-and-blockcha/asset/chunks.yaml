    所以，我们之前提到，这将是一个关于 NFT 和区块链技术将如何影响不同机构、领域和企业的列表。然而，我们并没有承诺所有这些影响都将是积极的。涉及到“大科技”和“大数据”时，肯定会有一个输家。


    让我们从一开始就注意到，大科技不会被 NFT 彻底瓦灭，但有理由怀疑大科技将被“削去棱角”。在许多行业观察者看来，这种事情发生得时候时候。


    随着区块链技术和 NFT 的普及，消费者与技术公司之间的动态关系预料中会发生变化。NFT 和可验证凭证是受区块链支持的数据。但像 `Facebook`、`Google`、`Microsoft`
    和 `Apple` 这样的大科技公司，大部分收入来自你的数据交易。你听过那句老话了：“如果你没有为产品付费，那么`你`就是产品。”在技术领域这句话确实如此。科技公司了解了关于你的一切（或`几乎`一切），然后出售这些知识。大科技知道你在线去了哪里，你在文档中输入了什么，你购买了什么，你在哪些数字广告上停留了多久
    . . 它知道你深夜访问哪些购物网站，把东西放入虚拟购物车但实际上没有结算。大科技可以听你的电话通话，或者如果你的手机恰好在身边，听你与真实真人的交谈。它可以注意到你在文档中键入的击键，即使你没有在线。


    使用这些强大——且往往令人不安的工具，大科技公司正在收集关于其用户的大量信息。然后他们通过不同方式出售这些信息来使其变现。他们可以出售非常有针对性的广告位，因为他们已经知道谁对某种产品或服务感兴趣。许多科技公司还将将你的数据打包并出售给第三方。我们还看到这些公司试图慢慢渗透入我们生活的其他部分；他们推出支付系统、类信用卡产品和产品市场——希望扩大我们选择在他们平台上所做的事情范围。


    当一家大科技公司向潜在广告商推销自己时，它会说：“对于你的客户，我了解他们喜欢的一切。我知道他们感兴趣什么。我知道他们`已经`想要什么，并且我知道如何把东西放在他们面前，以`促使`他们想要新东西。”


    而且，在很大程度上，这并不是虚张声势。


    在了解消费者关注的事以及思考这些欲望如何可能变现方面，科技公司`确实`非常高明。


    但也许他们`太`高明了 . . .


    美国政府似乎也是这么认为。尽管该行业进行了大量的游说，大科技公司的首席执行官仍经常被传到国会，就他们对在线客户数据的近乎垄断做出解释。国会成员指控大科技的各种行为，从故意传播虚假信息到服务外国势力利益，再到越界并过度深涉美国人的隐私。


    虽然这些听证会可能是件好事——而且会员和议员表达的担忧是非常真实的——但存在一种可能性，我们即将拥有一个强大的新工具来从大科技手中夺回我们的数据。那个工具是由区块链技术支持的主权身份（`SSI`）。


    ![images](img/f0026-01.jpg)


    *音乐家 Mike Dean 与艺术家 Shepard Fairey 合作了具有音频和视觉元素的 NFT*。


    `SSI` 是以去中心化的方式管理的。这意味着消费者拥有自己的数据。消费者任何想在区块链上保留任何，都可以被保留。对于对此感兴趣的消费者来说，将不再需要在科技公司网站那些“对用户不友好”的部分进行一系列晦涩的点击，才能挖掘显示“Facebook/Google/Apple
    对我了解什么”的数据。相反，消费者将能够使用基于区块链的系统自己并`为`自己存储那些信息。


    `SSI` 的兴起还将通过减少数据获取的机会来削弱大科技/数据的控制力。因为 NFT 和 `SSI` 将赋能创作者和机构加强与客户的个人关系——并直接向他们出售物品——大科技经常扮演的中介/中间功能将被减少。


    今天，我可能是我喜欢的音乐家粉丝的一个 `Facebook` 群组成员。因为 `Facebook` 拥有这些粉丝优秀的数据库，音乐家（或他们的唱片公司和管理层）可能会使用这个
    `Facebook` 群组发布有关巡演日期或新专辑何时上市的公告。


    但在一个充满 `SSI` 和 NFT 的世界里，我喜欢的音乐家已经会有关于我的大量大量信息了。音乐家直接向我卖票，每张票都是一个 NFT，可以解锁更多层次的访问权限。我参加过哪些演出、买过什么商品、听过哪些歌曲的记录都被捕获在区块链上——可能作为一种可验证凭证。简而言之，音乐家比
    `Facebook` 任何时候都更了解我（至少在我的音乐品味方面），而且音乐家与我交流并向我卖东西比 `Facebook` 好。


    通过 NFT 和 `SSI`，创作者与消费者之间的关系将发生转变，因为消费者将拥有自己的数据。虽然说大科技目前拥有大量消费者数据是正确的，但 `SSI` 将逐渐允许他们夺回。越来越多，消费者将直接与品牌交易。将发展出一种一对一的关系，其中数据将交换，但在封闭的圆圈内。消费者可以对他们喜欢的音乐家说：“我选择把我的数据交给你，且仅给你。”数据以主权方式由消费者拥有，他们不会被强制交出去。相反，他们将根据自己的选择进行分享，只有在他们想要的时候。


    政治家将继续争论大科技公司对你的数据应该有多大的访问权限。这不是一个很快解决的问题。但随着越来越多的创作者和公司开始涉足 NFT 领域，这些数据巨头坚固的现代建筑中可能会开始出现裂缝。缓慢地，随着时间的推移，他们将开始被解除武装。


    最后，我们应该注意到这种变化并不一定对像 `Facebook` 这样的企业产生不利。消费者将拥有直接与品牌互动的选择，这将迫使大科技关注其核心能力。它将不得不找到竞争的方法，并将会改进。它将不再过度扩张。竞争让每个人变得更好，并为消费者带来更好的产品。大科技是时候面对一些真正的竞争了。这种竞争将通过区块链技术实现。


    我是否在这一节中漏掉了你的行业或业务？如果是的话，别担心。无论你喜不喜欢，NFT 和区块链仍然在路上。坦率地说，凭我微弱的力量无法增加或减少它们将带来的改变。

