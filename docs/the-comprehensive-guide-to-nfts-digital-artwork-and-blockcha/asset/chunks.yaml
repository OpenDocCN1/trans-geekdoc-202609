    \n**Author’s Note**\n\nThis is a book about a new and emerging technology. As\
    \ such, it is almost certain that by the time you read these pages, the world\
    \ of Non-Fungible Tokens (NFTs) will have changed. More specifically, it will\
    \ have grown, evolved, and expanded into new areas, and in ways that include new\
    \ players and technologies. The record prices for NFT works of art mentioned in\
    \ this book may be broken. The largest and most lucrative partnerships with artists,\
    \ athletes, and fashion brands to create NFTs may have been superseded and eclipsed.\
    \ Businesses launching their own NFTs may—and, in fact, probably will—have accelerated\
    \ at a remarkable pace since the time of this writing, and created NFT-based innovations\
    \ and products that are not included here.\n\nHowever, this is also a book about\
    \ the basic, fundamental truths of NFTs—what they are, where and how they can\
    \ be applied, and where they hold the potential to create powerful disruptions\
    \ in our lives. These fundamentals will not change as time goes by. Rather, they\
    \ will be used in exciting new ways, and in new areas, and this will be happening\
    \ all the time . . . including after this book goes to press.\n\nAs champions\
    \ of NFTs, we wouldn’t have it any other way.\n\n—Marc Beckman\n\n**Introduction**\n\
    \n“What just happened?”\n\nThis was the question that seemed to echo across the\
    \ art world—and then across the *entire* world—as news spread of a remarkable\
    \ and unusual sale by Christie’s auction house in early March of 2021. A digital\
    \ collage entitled *Everydays: The First 5000 Days*, by an American artist known\
    \ only as Beeple, had sold for a staggering $69.3 million. The sale price alone\
    \ made this transaction remarkable news. But there was something more. Something\
    \ that took this transaction from the realm of the rare into the land of the positively\
    \ game changing.\n\nWhat had been sold by Christie’s was not a canvas. Or a print.\
    \ Or a sculpture. Or anything that could be touched or felt or held in someone’s\
    \ hand.\n\n![images](images/f0001-01.jpg)\n\nWhat had just sold for this staggering\
    \ sum had come in the form of an NFT, or non-fungible token. Technically speaking,\
    \ it was a digital file, but not just *any* digital file. The artwork contained\
    \ a token verifying the unique nature of the piece, and tracing the record of\
    \ the work’s ownership back to the very circumstance of its creation. The token\
    \ meant that the work could never be altered or changed by anyone save the new\
    \ owner—who turned out to be a famous blockchain investor—and that no facsimile\
    \ or reproduction of the work could ever truly be created, because any reproduction\
    \ would lack this unique, distinguishing token.\n\nConfused?\n\nMany in the art\
    \ world certainly were, at least initially. But this sense of bemusement was soon\
    \ followed by a creeping feeling that something very important had just occurred—\
    \ something with the potential to change transactions—and even the very notion\
    \ of “ownership”—forever.\n\nThese are, after all, times of remarkable change\
    \ . . . especially in the digital world."
