    但仅仅因为 NFT 不会“挂”在你家里的墙上，并不意味着它不属于你，或者它是不安全的。（如果你愿意，它也可以挂在你的墙上，通过电视屏幕看到等。）相反，你的
    NFT 艺术品可能从字面上是你拥有的最安全的东西。它几乎肯定是你拥有的最安全的艺术品。正如我们所看到的，由于 NFT 中的区块链技术字面上将作品的历史*印刻在*作品*上*，认证和来源可以立即知。即使对画布进行碳定年法，并有受过训练的艺术史学家的锐眼光，在实体艺术作品中，伪品仍然可能被充当真品。（或者被盗的画可能在多年可疑的所有权链后才被“找到”。）但当一件艺术品是
    NFT 时，这种可能性被完全消除了。


    ![images](img/f0006-01.jpg)


    艺术家 Urs Fischer 通过发布 NFT 与他的艺术交易商制造了紧张关系，但最终发现这种转型极其获利。


    NFT 将“存在”于区块链上，但无论你以何种方式展示它，它都属于你。


    ### 那么，我们是如何从区块链变为 NFT 艺术的？


    NFT 是从 Beeple 开始的吗？显然不是。寻找 NFT 的确切起源可能相当困难。独特的数字物品已经存在几年了。但这些独特的数字物品是什么时候从商品跨越到“艺术”的界限的呢？


    这无疑引出了一个更大的问题“什么是艺术？”，这个问题没有简单的答案。数字货币——比如 NFT 之前的比特币——能被算作艺术吗？


    事实上，也许它们可以。


    钱以前曾多次被用作（或作为）艺术，几位艺术家曾直接在画廊中将物理堆的货币作为艺术品展示。2017 年，艺术家 Danai Anesiadou 将一公斤黄金密封在塑料中并宣布这是一件艺术品。1994
    年，Bill Drummond 和 Jimmy Cauty 执行了一件“艺术作品”，他们在火中烧掉了一百万英镑纸币。


    在 NFT 之前，数字货币的形式是否已经作为艺术发挥作用？这是可能的。（而且这是艺术史学家在未来几年一定会争论的话题。）然而，该领域的大多数人认为，第一批正式的数字
    NFT 艺术作品*可能*是 CryptoPunks，紧随其后的是 2017 年 11 月底首发的 CryptoKitties。CryptoKitties 是（仍然是）基于以太坊的区块链游戏，允许用户收集和繁殖数字猫通过强大的
    CryptoKitties 在线社区，用户可以创建自己的独特猫——这些猫作为 NFT 永远存在——并相互进行交易和出售。在发布后的第一周内，CryptoKitties
    的用户购买了价值 100 万美元的数字猫图像！


    ![images](img/f0007-01.jpg)


    Larva Labs 的 CryptoPunks 已以数百万美元出售。


    虽然在线猫作为一场巨大艺术革命的先驱似乎有些严肃，但人们购买这些猫的原因与任何人购买精美艺术品相同。这些图片很好看。购买它们很有趣。你可以从中赚钱，因为你购买的是一种增值的资产。这是一种证明你“知情”且“有文化养”（或至少是“在线文化”）的方式。这也是一种在从财务上支持艺术家的同时表达你兴趣的方式。


    ![images](img/f0008-01.jpg)


    CryptoKitties 还展示了 NFT 艺术的一个定义性和革命性特征，即它几乎任何财富水平的收藏家都可以获得。价格最低的 CryptoKitty NFT
    起仅 12 美元。


    开发者们（正确地）察觉到这些猫 NFT 只是收藏级数字艺术伟大交响乐的序奏，他们迅速着手创建在线市场，在这些市场上可以买卖 NFT——并让该领域的新艺术家可以将他们的作品转换为
    NFT。2018 年，包括 SuperRare、OpenSea、Nifty Gateway 和 MakersPlace 在内的多个 NFT 市场已经运行。


    在大多数情况下，这些 NFT 市场通过抽取每笔 NFT 的百分比来盈利。作为回报，他们将 NFT 推现在买家面前，并促进交易。


    ![images](img/f0009-01.jpg)


    随着这些在线市场的兴起，更多的玩家加入了游戏。


