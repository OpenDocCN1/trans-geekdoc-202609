  trans: '


    # 引言


    NFT 将使我们追踪某人如何获得奢侈品的能力变得如激光般精准，而穿戴这些物品很快将带来一种前所未有的炫耀资本。


    假设某项 NFT 被视为 `required` 用以验证某人是否具备购买奢侈品所需的经验。这种经历可以是与冠军自由潜水员一起潜水，没错，也可以从事慈善工作、为环保事业捐款、参加特殊活动，或通过某种形式的挑战或测试。NFT
    将赋予时尚和奢侈品牌创造比以往任何产品都更接近“毕业戒指”产品的能力。它们将是可穿戴的时尚品，同时也标志着特定的`verified`成就。任何人都可以佩戴潜水表来表示自己喜欢潜水，但特定的
    NFT 手表只会发放给那些曾与特定潜水员训练过的人，以此此类推。


    ![images](img/f0020-01.jpg)


    *创作者 Calvin Harris 举办了一场别特殊的 NFT 销售——只有已经拥有 100 个 NFT 的收藏家才有资格购买他的作品*。


    显然，这里跨界联名的潜力是巨大的。体验提供商将能够与时尚品牌合作开发这些“经验证明”类物品。这些可能性简直令人惊叹！


    ## 可持续性与伦理


    NFT 还可以用来帮助奢侈品牌履行它们在环境可持续制造和公平劳工实践方面的承诺。随着千禧一代日益关注时尚的伦理方面面，一个可以验证企业伦理行为的 NFT 将成为核心。现在已经不是秘密了，几乎任何人都可以`claim`
    自己是“环保的”、“人性化的”或任何你喜欢的词汇。然而，如果这些标准可以由外部实体进行验证——并且该实体可以通过写入产品区块链的 NFT 来确认这一点——那么游戏规则将再次改变。（这将影响远超奢侈品和时尚领域。各行业的商品都希望通过基于区块链的验证，证明它们的生产过程是公平、公正且尊重环境。）


    ## 客户关系


    此外，NFT 将通过让时尚奢侈品牌与客户之间的联系更加真实和自然，来帮助这些品牌。客户将能够以以前无法实现的方式说：“我觉得这个品牌真的很懂我”。行业研究一贯表明，消费者希望与高端品牌建立个人关系。他们希望获得个性化的服务，也希望获得个性化的产品。他们希望奢侈品牌在生活的重要时刻陪伴他们，同时也希望看到品牌随着他们自身的成长而演变。


    通过 NFT，奢侈品牌将能够为他们的客户创建一个可以被捕捉的真实体验“网络”。仅仅根据其客户具备的购买资格，奢侈品牌就能以一种目前无法实现的水平，“知晓”其客户可验证的事实。因为它是数字化且基于区块链的，这不需要一线员工对每一位进门的顾客都掌握百科全书般的知识；他们可以像查询客户账户一样轻松地调取信息。无论是店面销售还是在线购买，品牌都能以以前所未有的方式展示他们与客户的联系。


    ## 数字艺术与设计


    静态 NFT 可能也是奢侈时尚品牌的一个巨大增长领域。他们能够从原创时尚艺术、新的数字艺术品和新的数字商品中创造价值。收藏级 NFT 可以发布以补充实体时尚产品，且两者可以共享品牌形象。更重要的是，这些数字时尚品在进入市场时完全没有任何限制。奢侈时尚设计师可以使用它们创造出物理世界中永远无法实现的物品。NFT
    不像处理面料或皮革时会有同样的限制！设计师可以做任何他们想做的事。NFT 还可以为设计师提供一个机会，展示他们草稿书中未入“最终入选”的物品。如果一个品牌对某种设计采取了某种方案，但另一个仅作为收藏级静态
    NFT 发布的替代设计变得指数级流行，那么该品牌可以随时转型，考虑将该物品投入现实世界的生产中。


    而且，这不仅仅仅仅是落选的设计！


    NFT 可以锻造设计合作伙伴关系，其中 NFT 是现实世界与虚拟世界之间的秘密纽带。例如，Gucci 可以推出新款标志性鞋。他们可以在自己的实体店中销售实体鞋，并通过他们的数字平台销售该鞋的静态
    NFT 艺术品。然后，通过与 `Roblox`、`Fortnite` 或《动物森森》等在线游戏合作，Gucci 可以销售 NFT 的游戏版本，让玩家在数字数字身上穿上同样的
    Gucci 鞋子。（有关游戏可能性的更多信息请参阅后续章节。）


    时尚品牌是创造力的动态孵化器。他们制作插画、草图、广告活动、摄影、时尚秀等。探索和纪念这个创意世界的 NFT 可能对品牌追随者具有极大的吸引力。物品可以作为静态
    NFT 销售，也可以作为动态 NFT 销售，重新构 VIP 奖励俱乐部的增值部分。通过拥有品牌的珍贵作品，消费者成为了一个专属群体的成员，获得获得新产品发布的独家访问权、参加特殊活动（店店、工作坊、时尚秀）、获得独特服务等。


    在动态 NFT 驱动的未来，奢侈客户将由他们喜爱的品牌所“知晓”。客户将欣赏这种个性化的关怀，以及他们被赋予的、通过所穿的衣服和使用的品牌来表达自己的兴趣、成就和冒险的能力。


    事实上，NFT 将成为时尚品牌正常业务流程中一种自然的商业和营销延伸。


    ## 运动与运动员


    随着运动团队寻找在 21 世纪与粉丝联系的方法，并寻找寻找变现和增长品牌的新方法，种种迹象表明，NFT 将是把他们的努力提升更高水平的工具。


    `NBA Top Shot` 允许 NBA 将捕捉历史上某些精彩篮球时刻的 NFT 变现，并帮助粉丝对联盟产生新的所有感和联系。


    '
- fmt: '

    There are many reasons why an NFT from an NBA game can be meaningful for a fan.


    In some cases, fans want to purchase an NFT with an image from a game they personally
    attended—sort of a digital analog to saving the program. In other cases, fans
    want to feel a sense of ownership in one of the most important games of all time.
    If there’s an epic shot, block, or slam dunk, it speaks to them as fans to be
    able to own a piece of that forever. And other NBA Top Shot customers seem to
    like the thrill of the unknown, investing in the low-priced packs containing several
    “mystery” NFTs.


    NBA Top Shot is also a live laboratory where other sports teams can watch live
    NFT business experiments with price optimization. The NBA has an enormous—yet
    technically finite—amount of content, stretching back to the league’s first game
    in 1946. How can this content best be monetized? How quickly should the game’s
    all-time most memorable images be released? We get to watch as NBA Top Shot vacillates
    between issuing only a single NFT image of an iconic moment, to releasing a limited
    amount of NFTs of an iconic moment with each one uniquely numbered like an artist’s
    signed print.


    We’re also watching NBA Top Shot learn how to brand and theme its NFTs to jive
    with audience interest. There is considerable experimentation now with themed
    packs of NFTs, such as great dunks, rookie plays, All Stars, rising stars, and
    so on. The NBA Top Shot website regularly offers limited editions of these themed
    packs, and notes how quickly they sell out in order to emphasize their scarcity.


    “This is all well and good,” you might say. “But what if these fans are spending
    money on NFTs *instead of* buying other NBA collectibles? That is to say, how
    do you know NBA Top Shot isn’t cannibalizing other NBA properties?”


    It’s true that 2020 and 2021 have been difficult to chart because of the impact
    of COVID-19, but there is one one big indicator that NFTs don’t hurt other NBA-oriented
    profit lines: basketball cards. Physical basketball cards saw enormous growth
    in late 2020 and 2021, capped off by the sale of a single card in late February
    of 2021 for a record setting $4.6M! If the rise in NFT is having an effect on
    physical collectibles, it’s in a positive, not negative, direction.


    Even the NBA players themselves are getting into collecting, which further drives
    attention to the product. NBA players routinely post videos on their social media
    of them opening packs of NFTs. Sometimes they hope to get an NFT of themselves,
    but mostly the players seem to simply enjoy collecting, just like everyone else.


    One thing that will also become more measurable when the 2021–2022 NBA season
    opens up is if the movement into NFTs drives a new wave of fans into the stands.
    Enthusiasts of blockchain technology have developed their own unique culture,
    and the NBA has become the first professional sports league to reach out to that
    culture. The NBA has taken a step toward fans of digital collectibles, and it
    may not be a surprise if we see new fans putting more backsides in stadium seats
    as a result. Those who initially sought out NBA NFTs strictly as collectibles
    and investment vehicles may become basketball fans.


    It’s also worth pointing out that NBA Top Shot’s NFTs may function as a “bridge”
    between collecting sports NFTs and collecting *objets d’art*. Bitcoins are all
    unique, but they aren’t collectible for their own own. Other than its history,
    one Bitcoin isn’t going to show something special that another Bitcoin can’t.
    And while NFT works of art have enticing visual elements, it can be difficult
    to know what makes them valuable. (This can be true across all forms of art. Why
    is a Van Gogh worth more than the best painting by the best art student at your
    high school? How would you spot the difference? How would you know to invest in
    one and not the other?)


    But great feats of skill in the NBA make understanding pricing a bit easier. Even
    non-experts can quickly become comfortable with the idea that certain crucial
    plays and images from games are the most important because of what they represent.
    After digital collectors get comfortable moving from cryptocurrency to digital
    basketball plays, they may move from NFTs that capture basketball plays to NFT
    works of fine art. So, in this way, all boats would be lifted yet again.


    As NFTs expand, the months and years ahead will continue answering our questions
    about how pro sports can connect with fans. Right now, the NBA is one of the only
    games in town. But what will the market do when there are licensed NFTs for professional
    football, baseball, hockey, and so on? Will the demand for NBA NFTs decline as
    consumers explore other sports, or will it continue to rise? Perhaps more pressingly,
    will there be a reward for the NBA for “getting in first”? Looking at the history
    of crypto technology, and the trends that drive it, there’s good reason to believe
    that while other sports leagues may also have success with NFTs, they’re going
    to envy the early advantage the NBA has gained.


    ## Solo Athletes


    We’ve looked at an entire league, but what about solo athletes?


    There are interesting innovations happening in this space as well. In late March
    of 2021, a Croatian tennis player named Oleksandra Oliynykova sold a space on
    her right arm as an NFT. While the concept of selling space on a sports uniform
    is not new, Oliynykova took things to the next level by selling exclusive ownership
    to the space on her arm tied to the block-chain. Oliynykova will give the owner
    of the space the right to display anything of their choosing—in the form of a
    temporary tattoo—as long as it does not violate rules of the tennis matches in
    which she plays or promote hate. Importantly, Oliynykova is an up-and-coming player,
    whose rankings are not in the top-most, but are nonetheless rising. Thus, the
    value of this NFT has the potential to rise astronomically as she rises.


    Now let’s take this real-world example and expand into the theoretical. If one
    can own the NFT for a space on a player, why not several players? Why not a team?
    Imagine the connection to the action for “superfans” (be they wealthy individuals
    or corporations) if they owned the NFT for a space on the uniform of their favorite
    athletic team?


    When NFTs correlate 1:1 to items and spaces in the real world, sports and sports
    entertainment stand to benefit. And again, it’s not just teams.


    Individual athletes—even ones who play team sports—will be empowered by the opportunities
    that NFTs bring. With the rise of interest among athletes in the lifestyle space,
    athletes will be able to bring their creative vision applicable to the lifestyle
    categories to new levels. NFTs will provide athletes with a direct line of communication
    with their fanbases. This will change the balance of power even further in the
    athlete’s favor. When it comes to offering access to new sneakers, performance
    gear, training tips, tickets to sporting events—or anything at all that the athlete
    wants to share—the sports players themselves are going to have more of the power
    when it comes to connecting with—and selling to—the fanbase.


    ## Conclusion


    In summary, professional sports might be the best real-world example we have of
    NFTs creating explosive new revenue lines while empowering brands, creators, and
    individuals.


    And it’s just getting started.

    '
