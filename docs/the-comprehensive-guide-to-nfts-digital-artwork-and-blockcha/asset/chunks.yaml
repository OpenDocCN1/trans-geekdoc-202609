  raw: 'NFTs will add a laser precision to our ability to know how someone was able
    to obtain a luxury item, and wearing that item will soon carry a level of bragging-rights
    heretofore never imagined.


    Suppose an NFT was *required* in order to verify that someone has had the experience
    necessary to purchase a luxury good. This experience could be diving with a champion
    free diver, yes, but it could also be performing philanthropic work, donating
    money to an environmental cause, attending a special event, or passing some form
    of challenge or test. NFTs will give fashion and luxury brands the ability to
    create products that are closer to “class rings” than anything else. They will
    be wearable fashion items that also signal specific *verified* accomplishments.
    Anyone can wear a diving watch to signal that they enjoy diving, but specific
    NFT watches will only be issued to those who have trained with specific divers,
    and so on.


    ![images](images/f0020-01.jpg)


    *Creator Calvin Harris held an NFT sale with a twist—only collectors who already
    owned 100 NFTs were eligible to purchase his work*.


    Obviously, the potential for cross branding here is huge. Providers of experiences
    will be able to partner with fashion brands on these “proof of experience” items.
    The possibilities are really staggering!


    NFTs can also be issued to help luxury brands keep their own promises around environmentally
    sustainable manufacturing and fair labor practices. As millennials increasingly
    show that they care about the ethical side of fashion, an NFT that can verify
    ethical corporate behavior is going to be central. It’s no longer a secret that
    just about anybody can *claim* to be “eco-friendly” or “humane” or whatever you
    like. However, if these standards can be verified by an external entity—and that
    entity can confirm it with an NFT written into the product’s blockchain—then the
    game changes once again. (This will have impacts well beyond luxury and fashion.
    Goods across the board will want blockchain-based verification that they have
    been produced fairly, equitably, and with respect for the environment.)


    In addition, NFTs will help fashion luxury brands by making their connections
    to customers feel more real and organic. Customers will be able to say “I feel
    like this brand really knows me” in ways that haven’t been possible before. Industry
    research consistently shows us that consumers want a personal relationship with
    high-end brands. They want service that is personalized, and products that are
    personalized, too. They want luxury brands to be there for them at important moments
    in their lives, and they also want to see the brand evolving as they themselves
    evolve.


    Using NFTs, luxury brands will be able to create a “web” of authentic experiences
    that can be captured for their customers. Simply by virtue of what their customers
    qualify to purchase, luxury brands can “know” verifiable facts about their clients
    at a level not currently possible. Because it will be digital and blockchain-based,
    this will not require front line workers to maintain an encyclopedic knowledge
    of each person who walks through the door; they’ll be able to pull it up as easily
    as they can pull up a customer’s account. Whether in-store sales or online purchases,
    brands will be able to show their connection to their customers in ways never
    before seen.


    Static NFTs may also represent a tremendous growth area for luxury fashion brands.
    They will be able to create value from original fashion art, new digital artwork,
    and new digital merchandise. Collectible NFTs can be released to complement physical
    fashion product, and the two can share branding. More importantly, these Digital
    Fashion Items step into the ring with absolutely no limits. Luxury fashion designers
    can use them to create items that would never be possible in the physical world.
    NFTs don’t come with the same restraints you get when working with fabric or leather!
    Designers can do just about anything they want. NFTs can also give designers a
    chance to showcase items from their sketchbooks that didn’t make the “final cut.”
    And if a brand decides to go one way with a design, but an alternative design
    released only as a collectible static NFT becomes exponentially popular, then
    the brand can always pivot and look at putting that item into production in the
    real world.


    And it doesn’t just have to be also-ran designs!


    NFTs can forge design partnerships where NFTs provide a secret link between the
    real world and the virtual one. For example, Gucci could launch a new trademark
    shoe. They would sell the physical shoes in their physical boutiques, and could
    sell Static NFT artwork of the shoe through their digital presence. Then through
    a partnership with online games such as Roblox, Fortnite, or Animal Crossing,
    Gucci could sell the in-game version of the NFT, allowing gamers to put their
    same Gucci shoes on their digital avatar. (Look for more about the possibilities
    for games in a following section.)


    Fashion houses are dynamic incubators of creativity. They produce illustrations,
    sketches, ad campaigns, photography, fashion shows, and more. NFTs exploring and
    commemorating this creative world are likely to have extreme attraction for devotees
    of the brand. Items can be sold as Static NFTs, but also as Dynamic NFTs that
    reimagine the added value component for VIP rewards clubs. By owning the valuable
    pieces of the brand, consumers become members of an exclusive group who gain exclusive
    access to new merchandise drops, attend special events (in-store, in atelier,
    fashion shows), are provided with unique services, and more.


    In a Dynamic NFT-driven future, luxury customers will be “known” by brands they
    enjoy. Customers will come to appreciate the personalized touch and the ability
    they’ll be given to express their interests, accomplishments, and adventures in
    the clothing they wear and the brands they use.


    Indeed, NFTs will become a natural commercial and marketing extension within a
    fashion brand’s normal course of business.


    *Sports teams and athletes*


    As sports teams look for ways to connect with fans in the twenty-first century,
    and find new ways to monetize and grow their brands, there’s every sign that NFTs
    are going to be the tool that takes their efforts to the next level.


    NBA Top Shot is allowing the NBA to monetize NFTs that capture some of the most
    exciting basketball moments of all time, and is helping fans feel a new sense
    of ownership and connection to the league.


    ![images](images/f0021-01.jpg)


    *The UFC has released NFTs featuring Conor McGregor and other stars*.


    NBA Top Shot is the NBA’s vehicle for selling NFTs to fans. The NBA is already
    the second most popular and profitable sports league in the United States after
    the NFL, so when the league went into NFTs, some in the industry were skeptical
    that fans who already paid for tickets, TV packages, authentic jerseys, videos
    games—and everything else NBA-branded—would also go in for a unique digital representation
    of their favorite moments from the game.


    But to put it succinctly, the naysayers have already been proved wrong. Resoundingly
    so.


    Less than nine months since launch, NBA Top Shot already has over eight hundred
    thousand user accounts and has generated over half a billion dollars in new revenue.


    The NFTs available on NBA Top Shot offer both quality and quantity, accessibility
    and exclusivity. On the one hand, “packs” of NFTs (similar to packs of physical
    sports trading cards) are available for as little as nine dollars. On the other,
    the most desirable NBA Top Shot NFTs have already sold for upwards of $200,000.
    (Several collectors have already amassed NBA Top Shot NFT collections valued at
    multiple millions of dollars.)'
