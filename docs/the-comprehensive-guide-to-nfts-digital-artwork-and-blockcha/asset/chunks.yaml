- fmt: '

    So, we said that this was going to be a list of how NFTs and blockchain technology
    will impact different institutions, fields, and businesses. However, we didn’t
    promise you that all of these impacts were going to be positive. And when it comes
    to “big tech” and “big data,” it’s definitely the case that there’s going to be
    a loser.


    Let us note right off the bat that big tech is not going to be completely undone
    by NFTs, but there’s reason to suspect that big tech will be “taken down a peg.”
    In the opinion of many industry observers, it’s high time that such a thing happened.


    The dynamic that consumers have with technology companies should predictably change
    when blockchain technology and NFTs become widespread. NFTs and verifiable credentials
    are data backed up on the blockchain. But big tech companies like `Facebook`,
    `Google`, `Microsoft`, and `Apple` make most of their money trading in your data.
    You’ve heard that old saying: “When you’re not paying for the product, then `you`
    are the product.” It’s very true when it comes to technology. Tech companies learn
    everything about you (or `almost` everything), and then they sell that knowledge.
    Big tech knows where you go online, what you type into documents, what you purchase,
    what digital ads you linger on . . . It knows which shopping sites you go on late
    at night, putting something in your virtual basket but not actually checking out.
    Big tech can listen to your phone conversations, or your conversation with actual
    live people if your phone happens to be present. It can notice the keystrokes
    you are typing into a document, even if you are not online.


    Using these powerful—and often unsettling—tools, big tech companies are amassing
    large amounts of information about their users. They then monetize this information
    by selling it in different ways. They can sell very targeted ad space because
    they already know who may be interested in a product or service. Many tech companies
    also bundle and sell your data to third parties. We’ve also seen these companies
    trying to slowly slide into other parts of our lives; they launch payment systems,
    credit card–like products, and product marketplaces—hoping to expand the number
    of things we will choose to do on their platforms.


    When a big tech company is pitching itself to potential advertisers, it says,
    “When it comes to your customers, I know all the things they like. I know what
    they’re interested in. I know what they `already` want, and I know how to put
    something in front of their eyes to `make` them want something new.”


    And, largely, this is not a bluff.


    Tech companies `are` enormously skilled when it comes to learning about the things
    that matter to consumers, and figuring out how those desires can be potentially
    monetized.


    But maybe they are `too` skilled . . .


    The United States government seems to think so. Despite significant lobbying by
    the industry, the CEOs of big tech have been routinely dragged in front of congress
    to account for this near-monopoly on online customer data. Members of congress
    have accused big tech of everything from intentionally promoting misinformation
    to serving the interests of foreign powers to crossing a line and delving too
    deeply into Americans’ privacy.


    While these hearings are probably a good thing— and the concerns voiced by the
    congress members and senators are very real—there is a possibility that we are
    about to have a powerful new tool for taking back our data from big tech. That
    tool will be self-sovereign identity (`SSI`) backed by block-chain technology.


    ![images](images/f0026-01.jpg)


    *Musician Mike Dean collaborated with artist Shepard Fairey on NFTs with audio
    and visual elements*.


    `SSI` are managed in a decentralized manner. This means consumers own their own
    data. Anything that a consumer would like to preserve on the blockchain, can be
    preserved. For consumers with this interest, it will no longer take a series of
    obscure clicks in the “customer unfriendly” part of a tech company’s website to
    unearth data showing “what Facebook/Google/Apple knows about me.” Instead, that
    consumer will be able to store that information by themselves and `for` themselves
    using a blockchain-based system.


    The rise of `SSI` will also weaken the grip of big tech/data by creating fewer
    opportunities for data to be captured. Because NFTs and `SSI` will empower creators
    and institutions to strengthen their personal relationships with customers—and
    to sell things directly to them—the middleman/intermediary function that big tech
    so often plays will be reduced.


    Today, I might be part of a `Facebook` group for fans of my favorite musician.
    Because `Facebook` has an excellent data pool on these fans, the musician (or
    their record company and management) might use this `Facebook` group to drop announcements
    regarding dates on an upcoming tour, or when a new album will be available for
    sale.


    But in an `SSI`- and NFT-rich world, my favorite musician is already going to
    have lots and lots of information about me. The musician sells me tickets directly,
    and each ticket is an NFT that can unlock more and more layers of access. A record
    of what shows I’ve attended, what merchandise I buy, and what songs I listen to
    is all captured on the block-chain—potentially as a verifiable credential. In
    short, the musician already knows me better than `Facebook` ever could (when it
    comes to my musical taste, at least), and the musician can communicate with me,
    and sell things to me, better than `Facebook` can.


    With NFTs and `SSI`, the relationship between creator and consumer will shift
    because the consumer will own their data. Though it is correct to say that big
    tech currently does own large amounts of consumer data, `SSI` will gradually allow
    them to take it back. More and more, the consumer will transact directly with
    the brand. A one-on-one relationship will be developed in which data will be exchanged,
    but in a closed circle. A consumer can say to a musician they like, “I choose
    to give my data to you, and only you.” Data is owned by the consumer in sovereign
    fashion, and they cannot be compelled to give it out. Rather, they will share
    it by choice, only when and if they want to.


    Politicians will continue to argue over how much access big tech companies should
    have to your data. This is not an issue that is going to resolve itself quickly.
    But as more creators and companies begin to dip their toes into the NFT pool,
    cracks may begin to appear in the solid modern edifice of these data giants. Very
    slowly, and over time, they will begin to be disarmed.


    To conclude, we should note that this change does not necessarily bode ill for
    businesses like `Facebook`. The fact that consumers will have the option to interact
    directly with brands will push big tech to focus on its core capabilities. It
    will have to find ways to compete and it will improve. It will no longer overextend
    itself. Competition makes everyone better, and brings better products to the consumer.
    It’s high time big tech had some real competition. That competition is going to
    be enabled by blockchain technology.


    Did I fail to mention your industry or business in this section? If we did, don’t
    worry. NFTs and blockchains are still on the way whether you like it or not. It’s
    frankly beyond my poor power to add or detract from the changes they’re going
    to bring. Wherever technology is used in the future, this technology is going
    to be there.


    ## PART FIVE


    **New Opportunities for Investing**

