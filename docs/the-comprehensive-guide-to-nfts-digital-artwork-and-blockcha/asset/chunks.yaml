- fmt: '

    People want to own NFTs, but they also want to own companies involved in NFTs.
    During the first months of 2021, NFTs have been given a boost via strong interest
    from investors. The search for “NFT stocks”—that is, stocks that will support
    or benefit from the coming NFT boom—have surged. Some of this is coming from disciplined
    investors, but a certain part of it is doubtless being generated by the sense
    of FOMO that has driven so much recent technology investment. The point, however,
    is that the interest is real—and by all indicators it is growing.


    Businesses that provide services that allow shared asset ownership of NFTs—or
    provide new ways for investors to get involved with NFTs—have done well across
    the board and are experiencing remarkable spikes in stock prices. Sometimes, just
    a rumor of associations with NFTs is enough to garner interest. Consider that
    in late March of 2021, word leaked that Hall of Fame Resorts & Entertainment would
    simply be looking into focusing on NFTs. The company’s stock nearly doubled in
    24 hours!


    Companies have also seen surges of interest simply because of NFT “one offs.”
    For example, Twitter CEO Jack Dorsey famously sold an NFT of his first-ever tweet
    for $2.9 million. (It didn’t hurt that the NFT was sold in a bidding war between
    other famous tech icons. An NFT of a tweet by Elon Musk similarly sold in a bidding
    war for $1.1 million.) Dorsey didn’t profit personally from the NFT, and pledged
    to give all money he made from the transaction to organizations fighting poverty
    in Africa. However, this was more than a stunt or a way to raise money for charity.
    It was a signal that Twitter very much intends to be and to stay at the leading
    edge of digital innovation.


    If you’re looking to “invest in NFTs” you really have three routes; you can purchase
    NFTs themselves, you can invest in a business that is a part of the blockchain
    “backend” of NFT technology, or you can invest in an existing company— that may
    not even be a tech company at all—which has announced that it is going to incorporate
    NFTs into its products and services.


    ![images](images/f0027-01.jpg)


    Let’s examine all three routes.


    ### Purchasing NFTs


    Investing in NFTs themselves is similar to purchasing works of fine art. The opportunity
    for the purchaser is that the work may go up in value and be resold. (Optimally,
    a work of art will be resold in an auction scenario, with potential buyers bidding
    up the price.) Just as when you are investing in physical art, when you’re investing
    in NFTs, it helps to know “what kind of investor you are.”


    First of all, do you have any personal appreciation for art? Do you get a positive
    feeling from knowing that you own something beautiful? Or are you strictly mercenary?
    Are oil paintings and digital NFT images utterly interchangeable in your mind?
    Determining whether you personally have an aesthetic interest in the NFT art you
    intend to buy is a good first step in the process.


    Next, it’s important to know your own risk tolerance, and what your timeline is
    for an investment window. Are you the kind of person who feels most comfortable
    with a “slow and steady” gain, that’s predictable and lasts many years? Or are
    you okay with substantial risk—and scenarios in which you may lose money on an
    investment—if you also have the potential to reap large rewards quickly? There
    are NFTs available for sale that represent both of these extremes, and everywhere
    in between.


    How much do you know about the performance of NFTs as art? Chances are, you don’t
    know very much because almost nobody knows very much. And don’t believe anyone
    who tells you that they have long term information about the performance of NFTs,
    because there has not yet been a long term! (The person who tells you this is
    either exaggerating, or else has a very different definition of “long term” than
    most of us.) Whatever your level of knowledge going in, you’ll want to learn as
    much as you can—right along with everyone else. The NFT market is growing, and
    new communities are springing up online overnight. It can be great to join others
    online to discuss NFTs, but always vet the information you get with the careful
    eye you’d apply to anything that might impact your financial future.


    It’s also important to keep NFTs as a fraction of your portfolio. Even those who
    are spending millions on NFTs right now are not going “all in.” There’s a reason
    for that. It’s not that NFTs are more or less reliable investments than artworks
    that live in the physical world; it’s that the volatility of the art market means
    it should only be a fraction of what you own. (There is a very small number of
    people who make their full-time job art collecting and sales. But unless you’re
    going to make buying and selling NFTs into your new 9 to 5, you will want to ensure
    it doesn’t comprise the majority of your assets —digital or otherwise.)


    You’ll also want to consider how much liquidity is important to you. Traditional
    works of physical art are not very liquid. If you want to convert them into cash—and
    get anywhere near a good price—you’re going to have to begin a long sales process
    that often involves connecting with an auction house. With NFTs, you’ll have more
    options. You may still wish to sell your NFT through an auctioneer or broker,
    but many of the benefits that auction houses could bring are baked into the NFT’s
    blockchain. A potential purchaser of your art won’t need a report on the provenance.
    They won’t wonder where and when the work of art is created. The “authenticity
    guarantee” that blockchain brings may mean that both buyers and sellers become
    more comfortable doing NFT transactions independently. (And removing the cut that
    auction houses would take.) No one yet knows precisely how liquid the NFT art
    market will be once it gets going, but it’s a safe bet that NFTs will always be
    somewhat more liquid than traditional physical artworks.

