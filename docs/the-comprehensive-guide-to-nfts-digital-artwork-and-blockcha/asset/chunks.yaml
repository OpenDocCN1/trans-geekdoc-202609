  raw: 'Things will be better for art collectors too. NFTs will make art collecting
    possible for demographics who might never before have seen themselves in that
    role. Consider what (and who) one typically thinks of when the term “art collector”
    is used. It’s someone with the means to purchase fine art, but also more than
    that. It is someone who may be relying on expert “sherpas” to guide them to the
    work that is likely to be the best investment. It’s someone with the physical
    space to store the art that’s being purchased (either in an appropriately stately
    manse, or in a climate controlled storage facility). We picture a person in a
    living situation secure enough that they are not too worried that their collected
    pieces will be stolen off their walls. We picture someone close enough to the
    nexus of art sales that—should they decide to part with a work of art—a sale to
    many qualified potential buyers can be arranged. Contrast this with the world
    of the potential collection of an NFT enthusiast. Because the work is presented
    digitally—and can be purchased from anywhere, by anyone—the NFT collector does
    not need to live among connected coastal elites, or know the right places and
    people to buy from. Anyone, anywhere can discover the next great NFT artist online.
    And artists and entities selling NFTs will have no reason to turn down a transaction
    once an offer on a work is made. They may not even have that ability. (In the
    world of fine art, art dealers know that *who* has purchased a work by a living
    artist will have the potential to impact the price of subsequent pieces by the
    same artist. Thus, art dealers wishing to see the market value of a certain artist’s
    work ascend hope foremost that the work is purchased by a leading museum. If that
    cannot be accomplished, a leading collector who has already purchased many works
