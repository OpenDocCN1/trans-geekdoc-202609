  trans: '


    我们也不能忽略创作者们本身。静态 `NFTs` 是艺术，而艺术是由艺术家创造的。创作者们会继续将 `NFTs` 视为一种有趣且具有参与感的创作媒介吗？他们会从长远来看认为这在艺术上是令人满意的吗？画家将自己的画作制作成
    `NFT` 是否会感到自豪和快乐（或者至少感到银行账户进账了一笔可观的额外收入）？艺术世界可能是变幻莫测。如果创作者们决定 `NFTs` 并不令人满意——或者认为出现的其他技术更令人满意——那么他们可能会停止使用
    `NFTs` 创作艺术品。另一个挑战是如果市场认为——尽管 `NFTs` 确实是精艺术，而且确实具有巨大的数字效益——但它们本身并不值很多钱。我们已经看到
    `NFTs` 价格的剧烈波动。例如，在 2021 年 2 月到 2021 年 4 月之间，平均 `NFT` 的价格从约 4,000 美元下降到约 1,250
    美元。这可能是市场短期的简单调整，但也可能是 `NFTs` 的价值无法维持在四位数的信号。如果每个人都认为 `NFTs` 是销售原创艺术的一种极佳且有效的方式……但同时也认为它们应该定价在
    25 美元左右呢？Beeple 6,900 万美元的成交可能被作为一个特例载入史册，而非常态。（注：没有长期市场数据表明这可能是事实。）最后，`NFTs`
    可能会因为它们与特定区块链和加密货币绑定的方式而变成其现状的幻影。2021 年 4 月，CNN 报道称 `Ethereum` 的价值在 2021 年增长了
    180% 以上，同时指出 `Ethereum` 是支持 `NFT` 交易的首选加密区块链网络。这有点进入了阴谋论的领域，但如果 `NFTs` 是由 `Ethereum`
    大持者作为一种市场操纵的形式所推动的呢？这虽然是异想且具有假设性的，但 `NFTs` 的流行在某种程度上与推高该技术涉及其他方面价值的愿望联系起来，在技术上是有可能的。


    ### 未来情景与市场展望


    存在三种主要情景。`NFTs` 可能会与一种尚不存在的新技术相结合。它们可能被以新的方式利用。它们可能因尚未引起关注的艺术方面而受到青睐。


    归根结底，前方的道路看起来是有希望的。支撑 `NFTs` 的实用性并不是观点或趋势的问题。在区块链上验证内容和所有权的独特能力，使使得 `NFTs` 仍然是目前最安全的内容形式。无论有多少艺术家转向
    `NFTs` 或是远离 `NFTs`，它们将仍然是那种最易于收集、存储最简单且防盗最安全的的艺术形式。这纯粹是一个事实。


    毫无疑问，我们将在 `NFT` 价格的“正弦波”中经历高峰和低谷——当然不是每个 `NFT` 艺术家都能期待像 Beeple 那样的经历——但我们极不太可能看到断崖式的下跌。在任何新技术中，都会有追风者和投机者。有些人会认为
    `NFTs` 本身就永远值得关注和具有价值。但随着技术一次一次地证明自己，“真正”的 `NFTs` 会胜出，而那些误解该技术用处的人将会出局。


    如果你问我，`NFT` 的未来仍然极其光亮。在几乎任何现实的情景下，`NFTs` 都会占据上风。


    ### 结语


    `NFTs` 最令人兴奋的事情之一是，世界上最有才华的人中仍有人第一次听说它们。在未来的几十年里，`NFTs` 将如何被用于分享艺术作品、建立社区并赋能创作者和品牌？金融世界和金融交易将如何受到
    `NFTs` 起起的影响？良好的政府将如何变得更好的政府？


    我们并不知道所有的答案，但如果最近的历史可以作为参考，有许多令人兴奋的改变正向我们来，而且还没有人想过！


    想一下 2010 年，一家披萨店接受一万个 `Bitcoins` 来换两块大披萨还是一条新闻。（今天，这意味着那些披萨每个价值约 2.5 亿美元。）我们现在看到的
    `NFTs` 早期活动可能类比于这桩“史上最伟大的披萨买卖”。*我们只是不知道*。但这种兴奋感和可能性现在就在我们身边。


    它也是安全的。`NFTs` 受益于区块链的支持，而区块链在过去的几年里已经经过了审查、修订和监管。当投资者理解他们将获得由区块链支持的东西时，他们确切知道自己得到了什么，并可以毫不犹豫地投入。


    我们还生活在一个财富极极度不平等的时代。越来越多地，人们普遍感到，那些富有且有人脉的人拥有最好的机会获取能够让他们增加财富的工具。这是一个复杂的问题，必须从许多角度来处理，但毫无疑问，`NFTs`
    可以对艺术和投资市场产生强大且民主化的力量。像 `NFTs` 这样的艺术品将消除那些可以提供艺术来源的传统门人。相反，这种来源将被构建在区块链中，并供任何人访问。艺术将向一个全新的投资者阶层开放，富有有人脉将不再是先决条件。


    '
