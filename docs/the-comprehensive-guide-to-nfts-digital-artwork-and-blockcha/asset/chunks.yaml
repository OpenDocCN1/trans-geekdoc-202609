    it was a piece of art. And back in 1994, Bill Drummond and Jimmy Cauty performed
    an “art piece” in which they burned a million British pounds in currency notes
    in a fire.


    Had forms of digital currency already functioned as art, prior to NFTs? It’s possible.
    (And is something art historians will surely debate in years to come.) However,
    most in the space agree that the first proper works of digital NFT art were *probably*
    CryptoPunks, closely followed by CryptoKitties, which premiered in late November
    of 2017. CryptoKitties was (and still is) an Ethereum-based blockchain game that
    allows users to collect and breed digital cats. Through the robust CryptoKitties
    online community, users could create their own unique cats—which exist forever
    as NFTs—and trade them with and sell them to one another. Within the first week
    of its launch, users of CryptoKitties purchased over $1M of these digital cat
    images!


    ![images](images/f0007-01.jpg)


    *CryptoPunks by Larva Labs have sold for millions of dollars*.


    While online cats might seem a bit unserious as the progenitors of a massive artistic
    revolution, people were buying these cats for the same reasons that anybody buys
    fine art. The images were nice to look at. Buying them was fun. You could make
    money from them because you were purchasing an appreciating asset. It was a way
    to show that you were “in the know” and “cultured” (or at least “online cultured”).
    And it was a way of expressing your interests while supporting artists financially.


    ![images](images/f0008-01.jpg)


    CryptoKitties also showed one of the defining and revolutionary features of NFT
    art in that it was accessible to collectors at almost any level of wealth. The
    most modestly priced CryptoKitty NFTs started at just $12.


    Sensing (correctly) that these cat NFTs were just the opening notes in the great
    symphony of collectible digital art, developers quickly set to work creating online
    marketplaces where NFTs could be bought and sold—and where artists new to the
    space could have their creations turned into NFTs. In 2018, a number of NFT marketplaces
    such as SuperRare, OpenSea, Nifty Gateway, and MakersPlace, were up and running.


    In most cases, these NFT marketplaces make money by taking a percentage of each
    NFT sold. In return, they get the NFTs in front of the eyes of buyers, and facilitate
    the transactions.


    ![images](images/f0009-01.jpg)


    With the rise of these online marketplaces, even more players started to get in
    the game. Literally. One of the most prominent entities to join the NFT space
    after CryptoKitties was the NBA’s official platform for selling game highlights—NBA
    Top Shot. In its first half-year operation, NBA Top Shot has done approximately
    $400 million in business!


    The success of NBA Top Shot is important because it showed that a community of
    fans who might not be tech-inclined would take the steps to become so if it meant
    they could engage with their favorite sport in an exciting new way. Another, similar
    example would be the rock band Kings of Leon releasing an album in early 2021
    as an audio NFT. Their fans were willing to make the leap to NFT, and the album
    made millions of dollars for the band.


    The story of the journey from blockchain to NFTs can also be seen in the way we’re
    watching NFTs change the nature of art collecting as a financial venture—especially
    when it comes to how works can be resold. To cite just one prominent example,
    a group of art collectors calling themselves Metapurse purchased twenty NFT artworks
    by Beeple in January of 2021. They then fractionalized their ownership of the
    works into tokens, and then they made those tokens available for sale to the public.
    Thousands of people bought them. Going by the value of the tokens at the time
    of this writing, the twenty works of art have now increased in value approximately
    six-fold.


    Try doing *that* with a Rembrandt.


    ![images](images/f0010-01.jpg)


    *Everyone’s getting into the act. Bhad Bhabie, a.k.a. the “Cash Me Outside” girl,
    has auctioned 20 NFTs based on her famous meme*.


    So now, we’re at this point where there seems to be endless opportunity and continual
    innovation as we see blockchain connecting in new ways with the technology.


    At least for the moment, there appears to be an endless appetite for NFT products.
    And even fan bases that may not be “into tech” are proving willing to take the
    leap to get to NFTs. But with this success comes legitimate questions about where
    NFTs will go next. Artists are constantly experimenting with new forms of art
    that can be created virtually. Developers are thinking about what else can be
    sold virtually (or sold as an NFT). For example, there is a booming market in
    virtual NFT real estate. You might not be able to own a mansion in real life,
    but now users can purchase one in a virtual world. We’re also seeing collectors
    scramble to figure out the best ways to exhibit their NFTs. Businesses are doing
    this too as they wish to develop and launch their own unique NFT products. And
    when you have a product, you want to get it in front of the eyes of your customers.
    But *who are your customers* and *how are they going to find your NFTs*? That’s
    what we’re still figuring out.


    From this evolving landscape, a solid piece of wisdom has already emerged: Don’t
    bet against NFTs. People who said that NFTs would remain small and niche were
    wrong. Those who claimed that only people who worked in the tech industry would
    ever purchase NFTs were also demonstrably incorrect. And those who claimed that
    NFTs “might be well and good for the unwashed tech-proletariat” but “we’ll never
    see those things being sold by the great auction houses for millions of dollars?”
    You guessed it; also wrong.


    What walls are NFTs going to break through next? While nobody can predict the
    future for certain, in this book we’ll identify top candidates for places that
    NFTs will probably take off next.'
