  trans: '

    有些企业可以帮助创作者“铸造”他们的 NFT，但也有协助销售 NFT 的平台、帮助艺术家和投资者理解这些数字作品公道价格的估值师，以及帮助收藏家策划其收藏品的顾问。


    奢侈品牌正在自我反思，如何让奢侈品购买能够包含一个 NFT，从而“解锁”进一步的高端体验、独特服务、新产品发布访问权、联名合作等。体育公司正在为数字领域的巨幅增长做准备，而这种增长将由
    NFT 驱动。此外，各行面向客户的公司也正准备在数字区块链的某处直接与这些未来的客户建立联系。


    ![images](img/f0011-01.jpg)


    `Grimes 在短短几分钟内通过出售原创 NFT 艺术品赚了 580 万美元。`


    企业意识到，词汇本身已经扩张了。随着人们趋于追求“真实性”和“真实”，买家将越来越想要拥有某个事物的真实且独特的版本。就像独特性在物理世界中存在一样，现在也将存在于数字世界。


    随着每天都有越来越多的人发现这种格式，想要“把牙膏挤回管子里”几乎是不可能的了。NFT 将长久存在。


    在下一节中，我们将探索企业和品牌创建的 NFT 类型，并观察我们预计这些 NFT 在何处创造最大的机会。


    ![images](img/f0012-01.jpg)


    `由创作者 Hashmask 的 NFT 艺术品以超过 80 万美元的价格售出。`


    # 第二部分


    ## 一个 NFT…… 但它是哪种 NFT


    我们已经看到 NFT 将如何为纯艺术家、品牌、奢侈时尚设计师、精英运动员、音乐家和娱乐人员带来一场革命。我们正与渴望进入这一领域的客户建立新的伙伴关系。甚至在写这本书之前，我们的客户名单中就已包括华纳兄弟娱乐、纽约巴尼百（Barney’s
    New York）、纽约现代博物馆（MoMA）和 NBA。


    我们到目前为止的工作可以为大型品牌和创作者面临的 NFT 机会提供指南。


    在本节中，我们将看看品牌在考虑如何在其增长领域实施 NFT 时所面临的一些选择。


    首先，让我们看看品牌必须做出的第一个选择。


    ### 静态或动态


    NFT 能够作为令牌运行，在与品牌的数字接触点处被识别。


    想想这种东西在例如零售世界中如何被使用……


    这个 NFT 如何？它将让你在我们的任何零售精品店享受 10% 的折扣。


    那个 NFT 如何？它将作为你参加我们为顶级客户举办的专属秘密活动的入场券。


    另外这个 NFT 如何？它让我们在关于你购买的产品更新有突破性新闻时联系你。事实上，NFT 被嵌入在产品中。


    但首先，了解 NFT 分为两种类型：静态（Static）和动态（Dynamic）很有帮助。


    对我们而言，“静态”意味着一个自给自足的 NFT。它*并不一定*意味着“不移动”。静态 NFT 可以以静态图像的形式存在，是的，但它们也可以包括 3D、动画、VR、AR、GIF、短视频等。它们还可以包括音频元素（声音），或者完全静音。因此，一张图片、一段视频或一个音频文件
    NFT 都可以静态 NFT。


    静态 NFT 通常通过在初始销售中为创作者产生产生收入。（如果区块链上指定了此类条件，它们还可以在未来的每次交易中持续产生收入。例如，规定每当出售 NFT
    时，创作者将获得销售价格的 5%。）


    静态 NFT 包括作为纯艺术出售的 NFT。因此，当今天大多数人使用“NFT”一词时，他们通常指的是静态 NFT。当你查看（或聆听）一个静态 NFT 时，你体验的是它的本质和功能的全部宽度。它将永远代表它是什么以及它能做什么。


    静态 NFT 通常通过在初始销售中为创作者产生资金来创造收入。静态 NFT 包括作为纯艺术出售的 NFT。因此，当今天大多数人使用“NFT”一词时，他们通常指的是静态
    NFT。当你查看（或聆听）一个静态 NFT 时，你所体验的是它的本质和功能的全部宽度。它将永远代表它是什么以及它能做什么。


