    If NFTs could work in the world of fine art, then what about the world of sports
    imagery, or fashion photography, or music, or important historical documents?
    The list goes on and on.


    It became clear that anything that was bought, sold, collected, or inherited stood
    to be impacted in a positive way by NFTs. Artists and photographers were about
    to find remarkable new revenue streams, and previously unimagined incarnations
    for their work. Brands were going to find new ways of connection with their customers.
    Entertainers and video game developers were going to immerse fans in ways never
    before dreamed of.


    I wanted to write this book because, frankly, this powerful change is coming whether
    people like it or not. In an era when the disrupting and upending of entire industries
    has become a regular occurrence, negotiating the “NFT-transition” will be an important
    part of businesses staying competitive in the twenty-first century.


    In this book, my goal is to provide you with a solid overview of NFTs, and to
    take away the “mystery” that some people felt when *Everydays: The First 5000
    Days* was sold. I’ll lay out NFTs’ relationship to blockchain and digital currency
    to help you to understand how NFTs work precisely. We’ll explore the nuts-and-bolts
    of how NFTs will help creators monetize their creative assets in exciting new
    ways, and how collectors can strike at the right time to invest in a completely
    original form of asset. Finally, I will help prepare you to *act now* in preparation
    for this new world just on the horizon.


    It was one thing to explain what Bitcoin even *was* ten years ago, but quite another
    to forecast what Bitcoin would *mean*.


    If you want to understand what happened in March of 2021, why it matters today,
    and how to position yourself for success in the world it’s about to bring about,
    then read on . . .


    PART ONE


    **Meet Your Guide**


    Who am I? How did I get involved in NFTs? And how did I come to be your personal
    Virgil, leading you through this strange and exotic new landscape?


    I am best known as the founder of the award-winning agency, DMA United, which
    combines commercially oriented principles with branding and advertising. I like
    to say that DMA United operates “at the intersection of style and design.” A small
    sampling of DMA United’s clients includes the NBA, Karl Lagerfeld, MoMA, LVMH,
    Warner Brothers Entertainment, Sony Music, and the estate of Nelson Mandela.


    I am also an attorney with a JD degree, and an adjunct professor at NYU Stern’s
    MBA Program, where I serve as Co-Chair of NYU Stern’s Luxury & Fashion Council.
    I live in New York City with my wife and two kids.


    My pathway into NFTs hedged on a chance meeting.


    It came down to an encounter with Stephane De Baets. Stephane works in finance,
    real estate, and hospitality. He’s always been a really forward-thinking guy whom
    I respect immensely. On the fateful night, I’d caught up with Stephane at a restaurant
    he owns in SoHo called the Chefs Club. Ostensibly, we were there to explore doing
    some branding and advertising for the restaurant. We were discussing our shared
    passion for innovation and futurism, when Stephane told me he had recently purchased
    the St. Regis Hotel in Aspen “through blockchain.”'
