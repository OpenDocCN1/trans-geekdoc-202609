- fmt: '

    ## Leveraging technology for in-community communications


    Among the most exciting offerings of a Dynamic NFT is fostering connections within
    your fanbase community that can help improve brand awareness, and also help people
    who purchase your NFT to make the transition from “customer” to “fan of the brand.”
    Just about every brand wants to foster fan communities and help them grow. By
    helping to ensure that NFTs function as “keys” to unlock admission to brand communities,
    we help ensure that fans connect with other fans, and help that fandom grow.


    Obviously, there’s a lot here, and not every part of this Dynamic NFT menu suits
    every partner we work with. But if you want to skip ahead, [Part Four](#08_Part04.xhtml)
    of this book contains more specific examples of how NFTs are being used (and will
    be used in the future) by different industries.


    ## Empowering artists, creators, and investors together


    One of the most exciting and satisfying parts of my job right now is knowing that
    we’re going to be a part of a powerful new force that will help people get paid
    for doing something they love. NFTs are going to allow a new wave of artists and
    creators to make a living through art. And at the same time, artists and brands
    are going to be able to use technology to engage with their fans in ways that
    were literally undreamed of just a generation ago. A direct and personal relationship
    with the fan, with the consumer, with the owner of the art.


    NFTs are going to create a new “layer” of artwork. That is to say, we’re going
    to add an entirely new item to the list of resultant content involved with a work
    of art. There is the original work, there are photographic reproductions of the
    work, there are signed prints of the work, there are officially licensed replicas—and
    so on—and, now, there is the NFT.


    ![images](images/f0015-01.jpg)


    Artist Naomi Osaka has released a number of works as NFTs.


    Right away, this gives many artists and content creators a new revenue stream
    because it gives them something new to sell. For example, a painter paints a painting.
    She may sell the physical painting, she may license various reproductions of the
    painting as the copyright holder, and now she also may sell the NFT.


    Some work is created digitally, and it has sometimes been a challenge for digital
    artists to make the case that their “original” is as legitimate, unique, and saleable
    as something painted with oil on canvas. Here too, giving digital artists the
    ability to sell an utterly unique NFT of their work, with its originality and
    provenance built into the blockchain, has the power to make meaningful transformative
    change for artists.


    And while original paintings on canvas might still run into the problem of forgeries
    and fakes, as we’ve noted, NFTs will present the public with a work which is utterly
    “un-fakeable.”


    If you think about it, this will likely increase the value of NFTs compared to
    comparable works of physical art that can be forged. The media is full of thrilling
    tales of art forgers fooling experts. Whenever a painting or similar physical
    work of art comes up for sale—even when offered by a very reputable firm— there
    is always a non-zero chance that the work may not be authentic. We know from history
    that art buyers are always taking a risk. But what if there were no risk? No risk
    at all? This is what NFTs will bring to the table, and it’s also a reason why
    NFTs will be able to command a price that doesn’t carry that “baked in” possibility
    that a work might not be genuine. This is a tangible benefit, and it adds to the
    value of NFTs in the eyes of collectors. (Just think . . . You can be a collector
    of physical art pieces and be reasonably sure that most of the pieces in your
    collection are genuine, or you can be a collector of NFTs and be absolutely sure.
    Which sounds like a more attractive area in which to invest?)


    NFT’s will also empower creators by eliminating many of the barriers and intermediaries
    between the artist and their customer. The artist will be able to sell NFTs directly
    to the consumer. They will be only minimally subject to any form of corporate
    control. Government control will likewise be very limited. Local attempts at art
    censorship, for example, will not last long in the age of the NFT; they can too
    easily be circumvented.


    NFTs will also bring to bear an entirely new aesthetic and digital canvas with
    which creators can experiment. It’s only once in a great while that an invention
    or innovation allows that to happen. Photography. Film and moving images. Digital
    photography and digital canvasses. And now NFTs. With each new creation, artists
    took the technology and made great art. They expanded the media itself and used
    it in new ways. We’ll forecast here and now that the next decade will see creators,
    artists, and brands beginning to curate works of art for optimization as an NFT
    in ways we can’t even imagine now. Literally and figuratively, NFTs are a brand
    new canvas upon which a new generation of artists will learn to paint.


    This will be viewable also in the unique aspects of NFTs connected to their evolution
    over time, and their ability to interact with other NFTs. Because it is digital
    and backed by the blockchain, nothing stops an artist from designing an NFT that
    changes physically each time it is sold. Or bid upon. Or gifted to someone. Or
    inherited. Likewise, as digital entities NFTs will have the potential ability
    to interact with other NFTs. Imagine a canvas that begins life as one color, but
    changes when the owner also owns a different NFT by the same artist. As an art
    collector purchases NFT after NFT from the same collection, the collector’s digital
    canvas might continue to update and change. Or it might not. This is just one
    of the fun technical possibilities that will be available to artists.


    The rise of the NFT will also have numerous impacts in areas like equity and civil
    rights. One way it will do this is by disrupting the current centralized access
    points for artists, which have resulted in a very homogenous landscape from which—
    even today—many diverse voices appear to be excluded. For example, according to
    the research paper “Glass Ceilings in the Art Market” posted in the `Social Science
    Research Network` (`SSRN`) in February of 2020, over 96 percent of artwork sold
    at auction is produced by men. There are still very few women artists represented
    in the most lucrative art sales. And research from CUNY’s Guttman College conducted
    in 2016 found that just over 80 percent of artists represented in top New York
    City galleries are white. When that same Guttman College survey looked at only
    US-born artists, it found that 88 percent were white. The same study also found
    that artists in top New York galleries are overwhelmingly represented by graduates
    from a small handful of selective (and expensive) colleges and universities, virtually
    all of which are located in Los Angeles, Chicago, or along the Eastern Seaboard.
    When it comes to gender, race, and economic and geographic diversity, we can do
    better. Frankly, we must do better. If the art world is not profoundly embarrassed
    by this situation, it should be. NFTs can help make positive change happen by
    moving art away from being something curated by a small and insular group of elites.
    NFTs will be open and available in online virtual galleries accessible to anyone,
    anywhere with a computer. There will be no geographical limitations that keep
    an artist from a rural or Southern location in the US from having their work seen—while
    someone in New York has easy access. There will be no need for a gallery scene
    in one location to dominate. In short, NFTs will present an opportunity for a
    new, level playing field. Not only will this hopefully lead to a more diverse
    and gender-balanced group of prominent artists, but it will also allow artists
    across income levels and geographies to have a greater chance of making a living
    by selling their art.

    '
