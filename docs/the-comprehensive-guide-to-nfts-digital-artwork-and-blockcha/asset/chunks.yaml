  trans: '

    此外，请确保鼓励公众购买你的 NFT 的任何人，在你的 NFT 被视为证券时，不会违反监管证券的规则。例如，`SEC` 曾调查过名人在其社交媒体账户上背书或广告证券产品（如股票），但未披露他们与股票背后公司的关系。（例如，未披露他们是该种的付费代言人。）我们已经看到，这其中包含了基于区块链的产品。2017
    年 7 月，`SEC` 针对名人对加密货币 ICO 的背书发布了一份“调查报告”。`SEC` 指出：“任何推广证券类虚拟代币或硬币的名人或其他个人，必须披露为换取推广而收到的报酬的性质、范围和金额。”如果你使用名人背书，请确保这些名人披露他们与你之间的关系。如果代言人没有获得报酬，但拥有你公司出售的
    NFT，请确保也说明这一点。


    涉及到纯艺术领域的监管机构时，可能的两个关注点是：1) 确保购买 NFT 的人员准确了解他们正在（以及没有）买到什么——至少在 NFT 仍处于“新”阶段时；2)
    确保 NFT 不被用于洗钱。第一个目标可以通过简单的消费者教育来实现。直接销售 NFT 的艺术家以及销售多个创作者 NFT 的平台，应该设立一个教育页面——或至少提供指向该页面的链接——以帮助可能接触该领域的新艺术买家理解
    NFT 能提供什么。


    ![images](img/f0030-01.jpg)


    令许多人惊讶的是，帕丽·希尔顿（Paris Hilton）利用她的知名度通过 NFT 创造了积极的变化。2020 年 3 月，她将首批著名的 NFT 之一——她在
    iPad 上画的一只小猫画——售价为 17,000 美元，所有收益都捐给了慈善。


    要防止监管机构因应对洗钱担忧而介入，将更加棘手。然而，NFT 社区可以通过建立自己的保护机制和行业最佳实践来做到。在很高的层面上，这些可能包括：


    - 创建提交“可疑活动报告”的协议。作为一种行业内的程序，任何处理由于任何原因感到有些“可疑”的 NFT 交易的人，都应该有一种轻松向当局报告以进行进一步调查的方法。

    - 当购买者有已知犯罪活动记录（如艺术欺骗）时，进行额外的尽职调查。

    - 标记第三方购买 NFT 的行为。即，记录 `Person A` 将 NFT 卖给 `Person B`，但由 `Person C` 付的实例。

    - 对市场中的欺诈进行定期风险评估，并培训员工如何检测和防止欺诈。


    尽管每个 NFT 都具有固有的防欺诈内置机制，但监管机构仍然会看到自我监管而感到欣慰。与与政府监管机构打交道相比，上述步骤并不具有挑战性，也不繁琐。


    总之，NFT 的最终监管状态涉及猜测——是的——但这是一种有据可依的猜测。只需一点创造力，就能很容易看到未来可能影响 NFT 监管的问题。通过现在就开始准备应对这些问题，NFT
    生态系统中的每一个人都将为长期成功占据良好位置。


    ## 缓慢增长、爆发还是缓慢衰退？


    除了监管之外，NFT 领域公司面临的另一个大未知是 NFT 从此将如何增长。例如，我们会看到市场缓慢而渐进的采纳吗？我们会看到一个突然的轨迹，使其普及率飙升吗？还是说它们会膨胀然后衰退，甚至可能从市场中使用撤消失？


    到目前应该很清楚，我们相信 NFT 在艺术、商业和营销的未来具有坚实且可靠的地位。尽管如此，让我们检查未来所有可能的路径，并考虑 NFT 的“后续故事”可能会如何发展。


    第一种情况是，NFT 将继续在各行业中缓慢稳固地立足，并采取小步前进。每一家尝试使用 NFT 的新业务都将是在“为团队牺牲”，或者至少在没有最终回报保证的情况下承担风险。但当一个行业领导者展示了与
    NFT 合作的强大业务优势时，同领域的其他人想要避开想要跳入水的冲动将变得具有挑战性。投资者也将逐渐习惯 NFT 作为一种资产类别。可证明的所有权优势将是不可抵挡的。收藏家可能会逐渐意识到这一点，但他们*会*意识。艺术家起初可能对
    NFT 感到不适，但他们会遵循趋势，并最终意识到 NFT 可以代表一种全新的收入来源。随着技术的缓慢扩展，创建 NFT 变得更容易、更便宜且更加环保，每个人都可以参与进来。孩子们可能开始创建
    NFT *仅仅是因为很有趣*。在这种情况下，大多数参与 NFT 的人将理解 NFT 是什么、区块链是什么，并且几乎每个参与者对我们能从这项技术中期待什么都有合理的预期。


    第二种情况，NFT 迅速飞起，而并不是每个人在参与时都理解自己在做什么。这种氛围是由 FOMO（恐恐惧症）驱动的。


    企业在完全理解 1) NFT 如何被使用，以及 2) NFT 可以以何种方式针对*他们的*行业进行优化之前，就跳入了 NFT 领域。尽管 NFT 快速飞起听起来像是件好事，但如果公司觉得他们“必须”推出
    NFT，问题就会出现。


    这听起来可能是一个奇怪的类比，但历史学家认为，这种 FOMO 导致了第一次世界大战的开启阶段。各国听到其他国家开始为一场大冲突武装，因此*他们*也因为担心显得没有准备好而开始为冲突做准备。他们这样做仅仅是因为每个人都在这样做，无论这是否有意义！这变成了一个自我实现的预言，并导致了可怕的结果。


    如果有足够多的大品牌“早期且频繁地”加入 NFT，较小或不灵敏的品牌可能会觉得自己有问题——或者认为如果他们跟进，就会显得软弱或脱节。结果是什么？很多公司拥有他们不知道如何销售的
    NFT。没有特别针对性的动态 NFT，无法很好地与客户建立联系。没有被收纳的静态 NFT。问题在于，这将导致 NFT 看起来比它们实际上更没用、更没前景。原因是企业和品牌在跳跃之前没有观察。他们推出了没用的
    NFT。现在，NFT 市场将能够从最初的过度扩张中恢复。真正有用且理想的 NFT 仍然会与消费者建立联系。然而，这种“繁荣与衰落”的感觉将在很一段时间内让人们感到不悦。


    另一种情况——最糟糕的一种，但在我看来也是可能性最小的一种——是 NFT 将以萎缩的形式存在，企业和艺术家可能无法利用它们带来的好处。这会如何发生？嗯，对于静态
    NFT，艺术市场可能会决定数字艺术没有物理艺术重要。艺术史学家将认为 NFT 不值得认真研究。或者需求可能无法维持。


    '
- fmt: '

    We also can’t leave out the creators themselves. Static `NFTs` are art, and art
    is made by artists. Will creators continue to find `NFTs` a fun and engaging medium
    in which to work? Will they determine it’s artistically satisfying in the long
    haul? Will a painter having his or her painting made into an `NFT` feel a sense
    of pride and pleasure (or at least the sense of a nice additional revenue going
    into their bank account)? The art world can be fickle. If creators decide that
    `NFTs` aren’t satisfying—or that another technology to emerge is more satisfying—then
    it’s possible they could move away from creating artworks using `NFTs`. Another
    challenge would be if the marketplace determines that—while `NFTs` are definitely
    fine art, and definitely carry tremendous digital benefits— they simply aren’t
    worth a lot of money. We’ve already seen tremendous fluctuation in prices of `NFTs`.
    For example, between February of 2021 and April of 2021, the price of the average
    `NFT` went from about $4,000 to about $1,250. This could be a simple correction
    in the market over the short term, but it could also be a sign that the value
    of `NFTs` is not going to stay in the four figures. What if everyone decides that
    `NFTs` are an excellent and useful way of selling original art . . but also that
    they deserve to be priced at about $25? Beeple’s $69-million sale might go down
    in history as an anomaly, rather than the rule. (Note: There is no long-term market
    data to suggest this might be true.) Finally, `NFTs` could become a ghost of their
    current selves because of the way they are tied to specific blockchains and cryptos.
    In April of 2021, CNN reported that the value of `Ethereum` had increased more
    than 180 percent in 2021, while at the same time noting that `Ethereum` is the
    preferred crypto blockchain network for supporting `NFT` transactions. This gets
    a little into conspiracy theory territory, but what if `NFTs` were being pushed
    by large holder of `Ethereum` as a form of market manipulation? This is far-fetched
    and hypothetical, but the idea that the popularity of `NFTs` could somehow be
    connected to a desire to spike the value of some other aspect of the technology
    involved is technically a possibility.


    ### Future Scenarios and Market Outlook


    There are three major scenarios. `NFTs` could become integrated with a new technology
    that doesn’t even exist yet. They could be harnessed in new ways. They could be
    appreciated for artistic aspects that aren’t even on the radar yet.


    At the end of the day, however, the road ahead looks promising. The utility that
    underpins `NFTs` is not a matter of opinion or trend. The unique ability to verify
    content and ownership along the blockchain still makes `NFTs` the most secure
    form of content around. No matter how many artists turn toward or away from `NFTs`,
    they will remain the form of art that is easier to collect, simplest to store,
    and most secure against theft. This is simply a fact.


    There’s no question that we will experience peaks and troughs in the “sine wave”
    of `NFT` pricing—and certainly not every `NFT` artist can expect an experience
    like Beeple’s—but it is extremely unlikely that we are going to see a precipitous
    fall. In any new technology, there are going to be bandwagon jumpers and opportunists.
    Some people are going to think that `NFTs` for their own sake are always worthy
    of attention and value. But as the technology proves itself again and again, “true”
    `NFTs` prevail, and those who misunderstand the usefulness of the technology simply
    get out of the game.


    If you ask me, the future for the `NFT` remains extremely bright. In just about
    any realistic scenario, `NFTs` come out ahead.


    ### Final thoughts


    One of the most exciting things about `NFTs` is that some of the most talented
    people in the world are still just hearing about them for the first time. How
    will `NFTs` be used in the decades ahead to share works of art, to create communities,
    and empower creators and brands? How will the world of finance and financial transactions
    be impacted by the rise of `NFTs`? How will good government become even better
    government?


    We don’t know all the answers, but if recent history is any indicator, there are
    a number of exciting changes headed our way that nobody’s even thought of yet!


    Consider that in 2010, it was news when a pizza restaurant agreed to accept ten
    thousand `Bitcoins` in exchange for two large pizzas. (Today, that would make
    those pizzas worth about $250 million each.) The early activity we’re seeing now
    with `NFTs` might be analogous to this “greatest pizza deal of all time.” *We
    just don’t know*. But this kind of excitement and possibility is all around us
    now.


    It is also safe. `NFTs` benefit from being underpinned by blockchain, which has
    already been reviewed, revised, and regulated in the preceding years. When investors
    understand that they will be acquiring something backed by blockchain, they know
    exactly what they are getting, and can dive in without hesitation.


    We’re also living in times of greatly exaggerated wealth inequality. More and
    more, there is a pervasive feeling that those who are already wealthy and connected
    have the best access to the tools that will enable them to grow that wealth. This
    is a complex issue that must be approached from many angles, but there’s no doubt
    that `NFTs` can exert a powerful and democratizing force on the art and investing
    markets. Works of art like `NFTs` will do away with the traditional gatekeepers
    that can give art provenance. Instead, that provenance will be built into the
    blockchain, and available for anyone to access. Art will be opened up to an entirely
    new class of investor, and being connected and already wealthy will not be a prerequisite.


    In addition to the financial aspects, a powerful cultural change is going to come
    with `NFTs`. In the past, owning a work of art meant just that—you owned something.
    But with `NFTs`, the benefits of ownership are going to be multifaceted and dynamic.
    Ownership might entitle you to special things—from admissions to clubs only unlocked
    by `NFTs`, to simpler things like discounts and special offers. Your `NFT` may
    be able to interact and combine with other `NFTs` to form things greater than
    the sum of their parts. Artists will know immediately when their work sells, and
    for how much. Confusions about ownership, provenance, and forgeries will become
    a relic of “the before time.”


    Owning an `NFT` is special and new. It will connect millionaires and billionaires
    who bid on items at art auctions, with teens and tweens who think their $12 `NFT`
    cat picture is really neat. It will also be mysterious. Because `NFTs` can do—
    and *be*— many different things, when someone tells you they own an `NFT`, it
    could mean all kinds of things.


    And what else?


    We don’t yet know what else.


    But that’s the thing we get to discover together.

    '
