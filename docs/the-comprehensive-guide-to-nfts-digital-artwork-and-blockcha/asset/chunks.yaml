  trans: '


    一个可能为我们的未来提供线索的迷人例子来自一个名为 `Alien Worlds` 的新型区块链游戏。在游戏中，用户竞争以殖民并开发外星景观。他们之间结成联盟和效诚关系，但也可能在时机合适时打破这些关系。一旦游戏中的土地被控制，就可以开采一种名为
    `Trillium` 的游戏内加密货币。一旦开采，玩家可以根据自己的意愿使用 `Trillium`——例如购买土地、建立联盟、购买基于 NFT 的物品等等。重要的是，`Alien
    Worlds` 的创建者并没有规定在游戏中开采的 `Trillium` 只能在游戏内。相反，他们创建了一种用户可以在现实世界中进行交易的区块链货币。巧妙的是，这种安排似乎模糊了哪种采矿是“真实的”、哪种采矿仅仅是“玩游戏”的界限。


    另一个值得讨论的绝例来自一个名为 `AnRKey X` 的游戏开发者，他们正在开发一款名为 `Battle Wave 2323` 的视频游戏。虽然游戏尚未正式发布，但其格式将以战斗和武器为主题，玩家将选择角色并在战斗中相互竞争。武器和服装将成为游戏的一部分——当然是以
    NFT 的形式存在——但这并非全部。玩家在相互竞争时可以在比赛中 `stake`（质押）NFT。这代表了巨大的进步。在大多数格游戏中，人们仅仅是为了虚荣心而战。但在
    `Battle Wave 2323` 中，玩家将有能力挑战对手并可能赢得他们独特且价值的 NFT。


    随着 NFT 和游戏共同演进，可能还会出现一些需要回答的棘手问题。首先，监管机构需要回答何时“游戏”会演变成“赌博”。如果一个基于技巧的视频游戏允许玩家输掉或赢得价值数千美元的
    NFT，那么这与拳击手在拳击赛中自己自己有什么相似或不同之处呢？


    在英国，立法者已经采取措施限制视频游戏中的开盲箱（loot boxes）等元素。通过开盲箱，玩家打开一个神秘且不透明的数字盒子，里面装有随机的设备以帮助他们在游戏中。盲箱可以通过游戏过程获得，但也可以购买。英国公共健康专家担心，视频游戏盲箱可能会让儿童产生在线赌博的兴趣。名为
    `GambleAware` 的慈善机构在 2021 年初发布的一项研究发现，5% 的视频玩家每月在盲箱上的花费超过 100 美元。考虑到视频游戏的普及，这是一个庞大的数字。媒体也报道了轰动性的新闻，关于儿童通过使用盲箱在父母的信用卡上产生了极高额的用的案例。


    尽管视频游戏制造商坚称盲箱并不构成或鼓励赌博——而且像 `Sony` 和 `Microsoft` 这样的主机制造商已经安装了限制用户账户购买盲箱的控制措施——但对其仍然存在着强烈的反弹。


    一个触手可及的未来，价值数千的 NFT 将在网上赢得和失去，这可能会让关于盲箱的喧闹相比之下像细微的分歧。对于谁可以玩带有 NFT 的游戏可能会受到限制。失败者可能是未成年或未满二十一岁的玩家，他们在玩某些游戏方面受到限制，就像他们进入赌场或对体育赛事投注受到限制一样。


    硬币的另一面是，未满十八或二十一岁的视频游戏观众中蕴藏着巨大的利润。某些事情告诉我们，针对这一市场的公司将足够聪明，以某种方式将 NFT 整合到青少年的游戏中。在寻找进入目标市场的方法方面，排除游戏行业是愚蠢的。


    结论是，视频游戏是另一个 NFT 几乎可以获得极其丰富未来的领域。架构已经就绪，我们有每一个迹象表明，一旦 NFT 开始整合游戏，消费者就会扑而出。


    ## 文化机构与场所


    博物馆、乐团、芭蕾舞团各种场所将能够利用 NFT 的力量扭转销售下降和兴趣减的趋势。他们能够连接并重振他们的粉丝“部落”，并重新定位自己以实现强大且有意义的增长。通过与核心人口群体建立联系并在跨媒体领域实施
    NFT 以触达受众，文化机构将能够利用资产将正确的观众成员连接到正确的文化体验。


    文化机构跨越两个世界，因为它们的生存依赖于捐助者也依赖付费客户。他们如何接触和参与这两个群体通常决定了是仅仅生存还是充分繁荣。NFT 在接触富有的赞助人和粉丝方面可以发挥作用。


    文化机构是提供独特精彩体验的机器，他们有自己的芭蕾舞和交响乐，以及他们展示的绘画和雕塑。然而，他们还可以利用这些资产为他们的支持者提供近距离面对面的活动和特殊特权，以感谢他们的支持。


    在 NFT 驱动的场景下，文化机构可以像现在一样向富有的支持者征集捐款。但在过去，超过某个美元金额的捐赠可能会获得参加招待会或活动的特别邀请——或者在任何其他人之前购买活动前排票的机会——但这些奖励的资格有时是模糊或不的。在某些情况下，如果赞助者知道自己在颁奖的盛大晚宴当晚已有计划，他们可能会犹豫进行大额捐赠。


    艺术赞助者也将自动获得可以通过 NFT 解锁的机构活动。与捐赠绑定的 NFT 将作为数字钥匙，解锁特殊的体验和惊喜，旨在让最热烈的支持者快乐。


    随着 NFT 数字票务系统结合 `Verifiable Credentials`（可验证凭证），这些奖励可以轻松定制和个性化，以新颖和兴奋的方式适应捐赠者。是否有捐赠者只参加有男低声出的歌剧？我们可以为那位安排一个与歌剧院男低声的幕后活动，作为对他最新慷慨捐款的“感谢”。


    这对于可能不进行大额捐赠但仍通过参加活动和在礼品店消费来表现支持的普通观众持有者也是如此。我们也可以通过与其数字门票购买绑定的 NFT 了解这些消费者。文化机构可以使用相应的信息来提供可能符合他们口味的服务，并为他们提供专属购买机会——就像奢侈品牌一样——证明他们参与过某些文化活动。


    NFT 可以让博物馆或音乐厅的粉丝获得某种定制福利，这些福利可以让他们感到特别，并将他们变成常客。从活动的提前座位和提前入场，到进入特殊区域，再到礼物和纪念品。


    NFT 将是消费者的一种兴奋的新方式，将他们对文化机构的热爱与其生活的其他方面联系起来。每个人都在开玩笑说公共电台捐款的人中流行的“NPR 布袋包”。在未来几年，NFT
    可能会让这些布袋面临不小的压力！


