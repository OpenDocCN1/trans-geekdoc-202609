    正由于这一漏洞/系统/豁免条款，美术馆对 NFT 的兴趣在未来几年内将对 NFT 的定价至关重要。如果形成广泛的共识，即博物馆*将*接受 NFT 艺术捐赠作为其收藏，那么整个
    NFT 艺术市场将得到推动。当这种情况*真的*发生时，NFT 的价格普遍将会上涨。明智的投资者可能想要现在就入场，因为这正开始发生。


    ### 市场时机与周期


    在投资 NFT 艺术时，另一个重要的考虑因素是市场的整体时机。目前，我们仍然处于早期。然而，当 NFT 艺术的接受度开始像多米诺骨牌一样倒下时，我们可能会在某个时刻达到临界点的“爆发”。当这种情况发生时，熟悉的模式将会出现。当普通大众以及那些通常不处于技术前沿的投资者——开始感觉到繁荣的市场正在进行时，会有很多人追随大流。这可能会导致整个范围内价格出现小规模的人为推高，因为投资者们希望在并不真正了解市场的情况下赚快钱。


    真正的 NFT 投资者将理解并欣赏 NFT 艺术作品的益处，并希望随着价值的逐渐增加而长期持有它们。但那些跳入市场并制造价格飙升的人通常只会为真正的投资者增加混乱。价格会出现一次飙升，即使是理智的投资者也会产生一种发生了一场繁荣与衰退的印象。（我们在加密货币投资中也看到了这种模式。）


    ### 给明智投资者的策略


    那么明智的 NFT 投资者可以做什么呢？当你感觉到最初的、人为的爆发正在进行时，请保持冷静并持有你的 NFT。现在不是购买的时机，也不是卖出的时机。如果有帮助，请记住
    2017 年底 `Bitcoin` 价格发生的情况。突然的繁荣使价格以人为的速度飙升至 20,000 美元。那些在这个价格急于售出的人——假设这是 `Bitcoin`
    能够达到的最高价值——以及在这个价格买入以寻求快速获利的人，从长期来看都是亏损的！（在本文写作时，`Bitcoin` 徘徊在 60,000 美元左右。）让市场回调，然后恢复长期（更长期）收藏。当你周围的人表现不理性时，这是你保持清醒最可靠的方法。


    ### 相比传统艺术的优势


    购买 NFT 相比传统艺术的最后一个但可能显而易见的优势是，你不需要将存储和/或维护和/或修复成本考虑入投资价格。即使你住在一个小工作室公寓里，你的 NFT
    投资组合也可以是巨大的。你也不需要像为 `Picasso` 的画布那样为你的 NFT 投防艺术大盗保险。你的所有权建立在区块链上，这一事实使得像“粉红豹”那样的艺术大盗的想法变得某种过时的产物！


    ### 结论


    总之，谈到以增加财富为目标收藏 NFT 艺术时，没有人在这场游戏中领先得太远，因为这场游戏本身才刚刚开始。通过学习基础知识并积极学习你所能学习的一切，你已经处于或接近队列的领先位置，因为*这一切现在正在发生*。将艺术收藏的基本原理应用于这种艺术的新表现形式，你会发现自己拥有一份在未来多年内可能令人向往的收藏。


    #### 投资让 NFT 可能的业务


    如果你正在寻找 `NFTs`，请考虑 `NFTs`...（为了简洁，文本继续）


