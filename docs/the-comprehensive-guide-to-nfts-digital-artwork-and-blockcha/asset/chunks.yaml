- fmt: '

    Another benefit to artists and content creators is going to be how and when they
    are paid. Under the historical model, artists only receive compensation the first
    time that an individual work of art they’ve created is sold. Artists like painters
    will retain the right to sell reproductions of the work in most cases—like posters
    made from their painting—but in any future instances in which their painting is
    sold from one collector to another, they will earn no new money.


    ## Enter NFTs


    With an `NFT`, a creator can place protocols into the block-chain itself prescribing
    that whenever the `NFT` is sold or resold, the artist is entitled to a portion
    of the sale. Or a press announcement. Or whatever conditions the artists might
    wish to assign.


    NFTs will also give artists and creator the ability to sell work entirely digitally,
    and without an intermediary, if they so choose. If creators want, they can contract
    to display their `NFT` in a digital gallery to get more eyes on their work, but
    nothing stops them from selling their work directly from their own websites and
    keeping the percentage that might otherwise go to an art gallery or sales agent.
    NFTs will also take away the anonymity of art purchasing. An artist can know who
    purchased one of their previous works, and/or who owns it currently. Then they
    can use the information to follow-up with a collector when they have a new work
    to sell. (In a world still reeling from the aftereffects of the `COVID-19 virus`,
    the advantages of being able to buy and sell art without physically going to a
    gallery hardly need to be stated.)


    Some critics of the ongoing NFT revolution have expressed bafflement that collectors
    are willing to pay hundreds of thousands of dollars for a `GIF` of a digital cat
    when it’s sold as an `NFT`, when the same `GIF` could be copied and pasted online
    for free. This “criticism” actually emphasizes the benefits of the `NFT` artwork
    for artists. The collectors are buying the digital work of art . . . but they’re
    not only buying the digital work of art. They are buying one copy in particular.


    Imagine there are two identical-looking paintings on physical canvases. They’re
    so identical that each single brushstroke looks the same. What’s more, the canvas
    and paint used is identical. The only visible difference is that one of the canvases
    was painted by an old master three hundred years ago, and the other was painted
    by a master forger using antique tools and paints. The authentic painting by the
    master might be worth many millions of dollars, while the forgery will be worth
    considerably less, even though it’s virtually identical. Why? Ultimately, this
    is because the art collector is purchasing the fact that a celebrated old master
    painted this work at the moment that he or she did. It’s not about whether the
    two paintings look the same. One was created by a certain person at a certain
    time, and the other wasn’t.


    Next, let’s look at one of the most important junctures in the path ahead for
    the `NFT`. Metaphorically speaking, it’s just up the road. We’ll have to decide
    which way to go very soon. And when we make that decision, it will have large
    ramifications for the blockchain itself.


    ## Proof of work versus proof of stake


    One of the most important choices for `NFTs` will be whether they choose to rely
    on blockchains that utilize a `Proof of Work` model, or a `Proof of Stake` model.
    Don’t worry if these terms are new to you; we’ll explain them now.


    `Proof of Work` and `Proof of Stake` are different kinds of blockchain technology.
    They both allow a transaction along the blockchain to be verified without the
    assistance of a third party. However, although they both end up at the same place,
    they “get there” in very different ways.


    Both models are based upon cryptography. They verify transactions and ensure that
    every item in the blockchain maintains its integrity. To do this, `Proof of Work`
    uses unique mathematical equations that must be solved by computers. With a widespread
    crypto like `Bitcoin`—which uses the `Proof of Work` model—this requires a vast
    array of computers all around the world to be working at all times to track transactions.
    As noted earlier, the miners are periodically rewarded for their mining with a
    coin of their own. And under this system, miners with the most powerful computers
    will be all but assured of reaping the majority of the benefits.


    Under `Proof of Stake`, cryptography is still used to verify history and transactions
    and reward network participants. However, everyone verifying the transaction has
    a “stake” in what is going on. With `Proof of Stake` cryptos, users can choose
    to stake a number of the coins or cryptos they hold in order to verify transactions,
    and a “winner” will be randomly chosen from those who have chosen to stake coins/cryptos
    to validate a particular block. For some `Proof of Stake` networks, it’s like
    buying raffle tickets; the more you stake, the greater chance you have of winning.
    And if anyone ever attempted to validate a “bad block,” they would lose their
    stake—so it helps assure a correct outcome for the process via both a carrot and
    a stick.


    These models also work differently when it comes to environmental output. This
    might be the most important difference between them.


    As noted earlier, the electricity used to process `Proof of Work` transactions
    just for `Bitcoin` now uses as much electricity as the country of Argentina! But
    `Proof of Stake` models use millions of times less energy.


    We know that `Proof of Work` blockchain technology is effective at accomplishing
    its central stated goal, but we also know there’s a tremendous environmental cost.
    But what if there was another technology that was just as effective, but accomplished
    the same goal with a negligible environmental impact? As you’ll see, this question
    is no longer hypothetical.


    ## Environmental impact


    While many of the most notable `NFTs`—like `Beeple’s` work among them—are backed
    by `Proof of Work` platforms like `Ethereum`, `Proof of Stake` platforms are the
    future. I believe this is fact, and not opinion.


    With `Proof of Stake`, verification will come from a consensus (as opposed to
    using supercomputers racing to solve math problems). All network participants
