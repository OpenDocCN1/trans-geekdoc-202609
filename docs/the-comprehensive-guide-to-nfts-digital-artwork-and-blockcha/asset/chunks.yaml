- fmt: '

    Bitcoin is also free from any risks that come from being tied to a government
    or central regulatory entity. For example, a government can suddenly declare that
    a currency note can be redeemed for—and is therefore “worth”—$100 in gold. Or
    $200. Or is suddenly no longer redeemable for the thing that formerly backed it.
    When governments do this, it can cause inflation, deflation, currency manipulation,
    and general chaos across the board. But a `Bitcoin` is redeemable for nothing
    physical, and is always worth whatever people are willing to pay for it. And it
    is incredibly liquid and easy to sell or convert. A government can also gradually
    devalue currency whenever it sees fit by printing more money. `Bitcoin`, to the
    contrary, cannot be devalued in this way because a unique and finite number of
    `Bitcoins` has already been set. After the remaining `Bitcoins` are mined, there
    will never been new ones added to circulation. (This quality of finality and uniqueness
    will come into play as we look more deeply at the advantages of `NFTs`).


    Finally, `Bitcoin` solves the problem of central authority by keeping government
    almost totally out of the picture. (Though not completely. It should be noted
    that certain governments have outright banned the trading of cryptocurrencies
    like `Bitcoin`). `Bitcoins` are unique, and when they are yours, they can stay
    yours forever. But a government, if it so wishes, can recall all its currency
    notes and replace them with newly-issued, updated ones. When you own physical
    money issued by a government, there is always the possibility—however small—that
    that same government can issue new laws or rulings that will impact your physical
    money in a negative way.


    This kind of tension is also felt where the worlds of art and money intersect—a
    spot where `blockchain` technology and `NFTs` will be centrally important. In
    the art world, a repressive government might declare a painting or other artwork
    to be obscene, “antirevolutionary,” or otherwise treasonous— and so outlaw or
    confiscate it. Imagine if a beautiful and expensive work of art were suddenly
    illegal to own! But when assets are owned electronically and as non-physical manifestations,
    the government’s ability to physically seize a unit of currency or piece of art
    becomes a much trickier prospect. Enforcement of these kind of repressive rules
    would be incredibly difficult for a government to actually implement.


    ![images](images/f0002-01.jpg)


    Rick and Morty creator Justin Roiland made over $1 million for an `NFT` comprised
    of a crudely-drawn sketch of character from The Simpsons nude.


    In summary, a `blockchain` is a self-preserving digital ledger that keeps records
    of everything on the ledger, and all legitimate reactions related to it. It solves
    the problem of provenance, counterfeiting, and all kinds of physical deception.
    When used to back a currency, it also takes great steps to prevent inappropriate
    government interference and regulation.


    ### If that’s blockchain, then what is an NFT?


    Put simply, an `NFT` is a digital token backed by `blockchain`— just like a `Bitcoin`
    is. However, an `NFT` also represents a unique digital file—as opposed to a unit
    of currency—and this digital file usually takes the form of visual artwork, a
    `GIF`, an audio file, or something similar.


    Another way to think about it is that an `NFT` is a piece of digital art, video,
    or audio that is tied to the `blockchain` like a unit of `cryptocurrency`. Yet
    while units of the same `cryptocurrency` are all technically unique, they are
    also all worth the same amount. (You can go online right now and look up how much
    a `Bitcoin` is worth. That number will be the going rate for all `Bitcoins`).
    `NFTs` may be backed by the same `blockchain`, but in most cases they are going
    to be worth different amounts of money—just as though they were unique works of
    art. Because they are.


    And just like a work of art, a digital `NFT` art piece won’t have a “going rate”
    you can look up, like you can look up the price of a `Bitcoin`. There’ll be a
    record of the purchase price of your `NFT`, but if you want to find out how much
    you can get for it now, you’ll have to auction it off or put it up for sale some
    other way. (There will also be rules of thumb relating to certain artists that
    experts will be able to issue. For example, what does an early Salvador Dalí oil
    painting typically go for? Or a late-stage Cézanne? Art world experts will be
    able to provide very educated guesses, but we’ll still never know for certain
    until the painting actually goes on sale.)


    Thinking of `NFTs` as “unique digital works of art, like paintings or videos”
    is necessary but not sufficient. That is to say, the art world is where `NFTs`
    seem to have “broken through” first. But as you’ll see later in this book, there
    are going to be massive applications across all kinds of industries for digital
    representations that enjoy all the benefits of being tied to a `blockchain`.


    ![images](images/f0003-01.jpg)


    Musician Casey Spooner released a music video as an `NFT`.


    ### When I buy an NFT, what exactly am I buying?


    When most people ask this question, they are again referring to an `NFT` that’s
    a work of digital art, so let’s start there.


    ![images](images/f0004-01.jpg)


    An art collector purchasing an `NFT` buys a unique and secure digital token—backed
    by `blockchain`—representing ownership of that digital work of art. Put plainly,
    you get one digital file. The file contains a copy of the artwork, and it’s also
    tied to the `blockchain`.


    Seems simple, right? But, as you might imagine, to reduce `NFT` art to these details
    sort of misses the point. There’s much more to it, which becomes apparent when
    you understand that upon purchasing the `NFT`, your doing so enters the `blockchain`
    and becomes a part of the `NFT` itself.


    To put it another way, when you buy an `NFT`, you buy the fact that you have bought
    the `NFT`. The fact of your doing so is secured on the history of that `NFT` for
    all time, and this fact becomes verifiable by anyone, anywhere, as part of the
    `blockchain`.


    You own the digital file. You own it forever (or at least until you sell it).
    And anyone on the `blockchain` will be able to verify that fact at any time.


    Another useful question is: What don’t you buy when you buy an `NFT`?


    Well, you don’t own the rights to the work, or to representations of it; that
    copyright still rests with the creator/artist. (If you bought the copyright in
    addition to the `NFT`, then you would also own these things. However, most purchasers
    of `NFT` art do not do this.) Buying an `NFT` is more like buying a digital work
    of art with a unique serial number. It is up to the artist or creator how many
    `NFTs` like yours exist. A good analogy might be a limited-edition baseball card,
    wristwatch, or print reproduction of a painting. Yours may be “1 of 100” or “1
    of 1.” The important thing is—like baseball cards, or watches, or prints—it is
    unique and can still go up in value, still be sold, and still be traded. It also
    has the unique advantage of authenticity that is backed by the `blockchain`.


    Is this a new and different sort of art collecting? Absolutely. But so is everything
    when it first comes on the scene. Remember: `NFTs` are not “better” or “worse”
    to own than traditional forms of art. They are a new way to own art entirely.


    ![images](images/f0005-01.jpg)


    Contemporary artist Takashi Murakami has explored numerous aspects of `NFTs`,
    including copyright implications for the artist.


    ### Where will my NFT “be” and how can I see it?


    Technically speaking, your `NFT` will exist on a `blockchain` supported by a server.
    For as long as the `blockchain` exists, your `NFT` will exist.


    In the case of `NFTs` that take the form of still images or video clips, you will
    be able to view your `NFT` wherever you have a screen or device on which to display
    it. How people “see” your `NFT` will largely largely up to you.

