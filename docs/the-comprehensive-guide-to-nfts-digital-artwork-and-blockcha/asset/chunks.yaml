  trans: '

    买家将了解房产的历史以及该物业的交易情况。卖家将了解寻求购房的人员。而那些进行代币化房地产交易——以及未来必会出现的所有其他区块链衍生品交易的人将发现，他们的交易可以更快速、更安全，而且不需要政府监管。


    # 旅游与休闲


    酒店、航空公司、赌场、预订服务、旅行社、租车公司——这些只是构成旅游和休闲行业的少数参与者。虽然存在某些程度的垂直整合，但这些行业在很大程度上由许多独立的公司和连锁机构组成，它们必须协同工作（偶尔通过官方合作伙伴关系）才能共同取得成功。`NFTs`
    和基于区块链的产品可以帮助这些行业克服许多集体性障碍，并让他们能够合作以新的方式服务消费者。


    通过使用数字区块链技术，旅游和休闲服务提供者能够更直接地与客户联系，并利用 `NFTs` 与这些客户建立关系。这将有助于消除巨型预订网站（如 `Expedia`、`Priceline`
    和 `[Hotels.com](http://www.Hotels.com)`）对该行业的垄断。


    当消费者开始习惯直接与航空公司、酒店、租车公司以及探险/体验公司交易时，他们就不再需要依赖预订网站。而当这些独立的旅游行业提供者能够为客户提供定制化的优惠（通常通过
    `NFTs`）时，消费者就不会再觉得必须通过一个让这些提供者相互竞争的网站来购买，以确保自己买得划算。


    消费者的另一个巨大优势将来自建立一个点对点的环境，在这个环境里，旅游行业的推荐可以被证实是真实且自然的。按照目前的格局，旅游和休闲业务充斥着“软文”内容，以及伪装成原创、无偏内容提供者的推荐/评论网站，但这些网站实际上通过为某些旅行公司产生推荐引流来获利，和/或者为了换报酬而扭曲其编辑推荐。这些网站通常让消费者很难判断某个评论或推荐是否具有客观性。这让消费者感到警备，且确定是否能找到任何可以信赖的来源。但点对点的社区可以改变这一点。


    当推荐、折扣、旅游政策和奖励被代币化和/或连接到区块链时，旅行者可以很自在地相互分享信息——优惠、折扣和推荐的来源可以被清楚地验证，甚至可以在二级市场上出售。旅游和休闲提供者甚至可以发行一个
    `NFT` 作为折扣。


    这个折扣的条件是什么？谁有资格获得？所有内容都在区块链上为消费者说明明了。


    `NFTs` 和代币的流动也可以作为激励。例如，想象一个网站，消费者可以在那里为同行的旅行者留下反馈和推荐。每写一条评论或提供一个建议，评论者就会获得一份数字奖励。它可以是一个可以获得酒店或航空公司折扣的
    `NFT`，也可以是评论网站发行的 `crypto`，随后可用于进行与旅行相关的购买。潜在的旅行者可以就某个地点提问，而回答问题的人也将获得数字奖励。这将激励旅游专家定期为该网站贡献内容以赚取数字奖励，网站访问者会觉得他们拥有了一个可靠的信息来源，其评论是由真实的旅行者提供的——而不是通过受秘密赞助的内容。同时，奖励这些真实评论的公司将获得关于访问者和贡献者的知识，其具体程度是其他格式中是不可能实现的。


    基于区块链的产品能够协助旅游行业的另一种方式是关于奖励计划——特别是奖励积分计划。作为航空公司行业的一项长期特征，旅行者现在已经非常习惯根据他们的常客里程获得免费里程和升级。然而，当一家航空公司破产或被竞争对手收购时会发生什么？或者当消费者只是想将他们辛苦赚来的里程用于飞行以外的事情时会发生什么？在太多的情况下，里程/积分永久丢失且从不兑换。（或者在某些情况下，它们可以在旅行者不喜欢的竞争航空公司那里兑换。）但如果不是由每家航空公司根据其认为合适的任何条件发行自己的积分，而是旅游行业同意统一结算一种
    `crypto`、`NFT` 或其他区块链支持的产品呢？（“AirCoin”和“MilesCoin”听起来是很不错的名字！）消费者可以预订机票，而不必担心他们的积分有一天丢失。因为积分是安全的且永久可兑的，旅行者将倾向于比现在飞得更频繁，确信他们获得的奖励将永远安全。如果旅行者突然决定他们更倾向于乘坐火车或船只旅行呢？他们可以进入交易所，在点对点的交易网络中出售或易物他们赚取的里程。再次，大家都赢了！


    在未来的日子里，旅游品牌将处于独特地从 `NFTs` 中获利——如果和当他们愿意跨越到一个由 NFT 技术支撑的世界时。


    # 医疗保健


    大多数人同意美国的医疗保健体系存在问题。美国人均医疗保健支出比任何国家都多，但一项接再一项的研究表明，美国人并没有获得最好的护理，也没有最好的健康结果。医疗成本和医疗保险价格逐年上涨，似乎没有人知道该怎么办。虽然许多美国人认为医疗保健系统需要彻底的改革，但几乎每个人都会同意，它可以变得更高效、更少困惑。


    因为这是一个许多人对此持有激烈意见的行业，所以知道它也可以通过区块链技术的兴起而改变，并可能在许多方面得到改进，是非常令人兴奋的。

