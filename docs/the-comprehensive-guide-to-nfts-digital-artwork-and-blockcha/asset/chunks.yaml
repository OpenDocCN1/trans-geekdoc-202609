  trans: '

    政府和监管机构在对加密货币等数字资产进行分类和监管方面一直进展缓慢，但他们正逐渐取得进展。根据许多行业观察者的说法，正是政府在区块链技术进行分类和监管（或不监管）方面的迟缓，阻碍了其以比现在的速度增长。投资者们担心政府可能会突然宣布加密货币交易非法，而此时他们（这些投资者）刚刚在其中投入了巨额资金。投资一种完全不受监管的东西是一件疯狂的事。这就像是在玩一个没有书面规则的游戏。但随着时间的推移，世界主要政府逐渐在几项基本原则上达成了共识。通过观察这些原则，我们可以对
    NFT 的未来做出一些科学的预测。


    ### 税收


    让我们从税收开始。


    在 `IRS`（美国国家税务局）看来，加密货币和基于区块链的资产被视为财产。`IRS` 使用“虚拟货币”一词来描述加密，但它仍然被视为财产。当出售加密货币时，交易双方必须申报出售产生的任何收益或亏损。如果你因提供服务而获得加密货币报酬，你也必须向
    `IRS` 申报。然而，在 `IRS` 看来，你技术上是“用一份财产”获得了报酬。同样，如果你收到加密货币礼物，它被视为财产礼物，而非货币礼物。


    ### 加密货币的监管


    加密货币的监管呢？这里的界限就变得模糊了一些。


    专家们对于将加密货币作为证券还是商品进行监管更为合适仍存在分歧。`证券`是指股票和债券之类的物品。人们投资于这些物品是因为可以预期其价值会增加或减少。与证券最常见的互动是长期投资持有。`商品`是指石油油、猪肉或玉米等实物货物。大多数商品买家在商品`实际存在之前`就购买了它们。买家以设定价格购买商品，然后商品在未来交付。买家赌注其商品价格将高于销售价格，然后就可以转售商品以获利。重要的是，商品被认为本质上是同质的。这里的玉米可以替代那里的玉米。猪肉和桶装油也是如此。


    在美国，证券由`证券交易委员会`（`SEC`）监管，商品则由`商品期货交易委员会`（`CFTC`）监管。


    基于区块链的代币某种程度上跨越了证券和商品之间的界限。


    例如，某些加密货币（如 `Bitcoin`）具有固定且有限的供应。世界上永远只会开采 2100 万个 `Bitcoins`。这使其具有`有限物理实物`的属性。地球中也有有限数量的黄金、银和白金等待开采。黄金、银和白金绝对是商品，因此从这个角度来看，加密货币似乎也应该被视为商品。


    但也有像 `Dogecoin` 这样的加密货币。`Dogecoin` 的创建是为了让矿工通常每年挖出 50 亿枚新硬币。`然而`，这个总数并没有上限。在不同时期，`Dogecoin`
    的创建者曾决定允许创建额外的数字货币，尽管这引发了通货膨胀的阴影。一个中央机构决定可以发行新货币，且没有可见的硬性上限？这听起来不像商品，而更像是由政府发行的证券。


    加密货币还有其他奇怪的方面似乎也让监管机构感到困扰。`Bitcoins` 可以被拆分成小份出售，而且现在通常都是这样做的。如果一家五金店接受 `Bitcoin`
    作为支付方式，我可以走进那家店，用一部分 `Bitcoin` 买一把锤子。如果我手里有一块金条，我能通过切下一小块金来买同一把锤子吗？或者如果我只有一张 100
    美元钞，锤子是 10 美元，而商店没有找钱呢？几乎可以肯定，五金店不会接受从我那张富杰明·富兰林纸钞上撕下的一条。


    而且，根据加密货币专家的最佳估计，大约有 20% 的 `Bitcoins` `不被任何人拥有`……因为它们已经不可修复地丢失了。这包括存储在忘记密码的数字钱包中的
    `Bitcoins`，或存储在已损坏物理外部硬盘上的 `Bitcoins`。这能与任何事物相比吗？事实，商品经常会被消耗——猪和玉米会被食用，石油会被精炼——但它们并不是简单的丢失。`联邦储备委员会`在纸币变旧磨损时会销毁，但那数量非常小。（在任何时刻，流通的实体美元现金在
    1 万亿到 2 万亿美元之间。美国每年销毁的钞票价值仅几十亿美元。至于人们偶然不小心丢失——或锁在打不开的物理保险箱里的钱——那个数字要小得多。）


    ### 用场景


    但围绕区块链货币分类争论中，最有趣——可能也是最有争议的方面是：“它们能做什么？”


    猪肉可以吃掉，也可以作为宠物。黄金可以用于工业目的，并被普遍认为具有巨大的美感。即使猪肉不再受厨师青睐，黄金被另一种贵金属作为“最美”的金属所取代，它们的价值几乎没有可能跌到绝对零。


    但像 `Bitcoin` 这样的东西呢？


    从一个角度看，`Bitcoins` 有极多用途。它们可以立即实现跨越远距离的安全交易，允许用户在一个不受法币货币限制的世界中进行交易，并作为金融工具提供了无与伦比的便利性。


    从另一个角度看，`Bitcoins` `完全没有用途`。它们与物理世界中人们通常愿意支付的任何东西都没有关联。它们不能被食用、燃烧、抽烟或实物欣赏。这导致一些怀疑者认为
    `Bitcoins` 一无价值。认为 `Bitcoins` 的益处仅仅在于便于移动。


    在人类历史上，不同的实体和群体发行过自己的物理货币。其中许多货币在今天是毫无价值的，只能作为历史奇事。这些怀疑者认为，一旦环绕 `Bitcoin` 的神秘感和新鲜感被剥离，它将回到本质为零的价值。


    对未来价值评估的极端波动也导致了决定如何监管加密货币的困难。


    （需要注意的是，并非每个国家都以相同的方式思考这些问题。例如，英国政府创建了`cryptoassets`（加密资产）这一伞术语，并在其根据货币的性质给不同的加密货币不同的分类。一些被视为`电子货币`并像现金一样受到监管。另一些由于具有与金融证券相关的特征而被归类为`证券币`。还有一些（如
    `Bitcoin`）属于`无监管币`的类别。）

