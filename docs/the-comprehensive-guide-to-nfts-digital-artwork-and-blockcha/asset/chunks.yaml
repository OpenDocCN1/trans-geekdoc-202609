    *通过区块链？* 我想。*怎么做？为什么？* 但他告诉我的越多，我就越清楚地发现他的疯狂行为其实是有章法的！这种区块链支持的购买方式开启了新的业务可能。正如他向我解释的，Stephane
    使用瑞吉酒店（St. Regis）作为资产，支持了一种新型加密货币的发行——`Aspen Digital Token`，或称 `AspenDigital`——这让合条件的投资者能够获得物业本身的少数股权。最终，这使得酒店约
    20% 的股份由这些少数投资者完全购买并所有。其余 80% 仍由 Stephane 公司拥有。但事实并非如此。`AspenDigital` 代币的持有者被邀请加入一个特殊的奖励和优惠计划，每当他们访问物业时，该计划就会激活。即使是持有少量
    `AspenDigital` 的所有者，在瑞吉酒店入住期间的所有消费都可以获得 20% 的现金返还，而大额持有者可以获得高达 50% 的返还。


    Stephane 的此举让我大开眼界。他不仅让投资过程民主化，还让小玩家也能拥有由区块链 100% 支持的强大投资。与此同时，他还在物业本身创造了完全全新的互动方式。


    但是，正如我在后的几天里学到的，Stephane 尚未结束 . . .


    当 COVID-19 疫情袭来时，Stephane 和我很早就预见到餐厅将面临巨大的压力，许多餐厅将无法生存。这一次，Stephane 和我以*义务服务（*pro
    bono）*的方式共同努力，寻找数字代币不仅可以支持餐厅主，还能创造一种触及厨房员工和零工经济工作者的滴漏效应。我们开发了一个简单的交换机制，客户可以进入餐厅并支付
    500 美元购买一种数字代币，该代币在 COVID-19 之后可以兑换价值 1,000 美元的餐饮服务。这额外的 500 美元充当了预付款，帮助厨房在疫情期间维持运营，这种模式促成了一种专注于餐厅社区的新型加密货币。


    不言而喻，我对我在区块链和加密货币领域看到的现象变得非常感兴趣——尤其是因为这远超大多数人在构想区块链支持的交易时的思维范围。这些创新者正在做完全新颖的事，我开始探索它可能如何与我在
    DMA United 的世界产生交叉。


    时尚、艺术、职业体育、社会正义——这一切都可能受到这些新工具的影响。2020 年 5 月，数字收藏和独特品牌所有体验的概念促使我试点 `Truesy`——这是一个
    NFT 市场，它精准击中了 DMA United 社区中设计、品牌和时尚汇的“甜点”。


    现在你知道我是谁了。接下来，我将更多地解释为什么我认为区块链是解决当下及未来问题的最佳解决方案 . . .


    ## 区块链与溯源问题


    区块链是让 NFT 革命成为可能的技术，因此理解它是关键。


    通常，理解一个复杂新发明的最简单方法是从提问开始：“这个设计是为了解决什么问题？”涉及到区块链时，答案是溯源问题。即，所有权的历史。


    区块链是一个数字“活账本”，每发生一次就会增长一次。区块链是一个数字“活账本”，每发生一次就会增长一次。区块链是一个数字“活账本”，每发生一次就会增长一次。区块链是一个数字“活账本”，每发生一次就会增长一次。区块链是一个数字“活账本”，每发生一次就会增长一次。区块链是一个数字“活账本”，每发生一次就会增长一次。（等等，让我精简一下这部分以保持清晰）。


    为了最好理解这项技术，考虑区块链最著名的例子可能会帮助，即 `Bitcoin`。运行 `Bitcoin` 的区块链是由一个名为 `Satoshi Nakamoto`（中本聪）的神秘人物（或人物）创建的。在创建他的加密货币时，`Nakamoto`
    设计了一个系统，使得所有 `Bitcoin` 交易记录可以由全球范围内活跃 `mining` 的计算机网络进行去中心化的维护。


    我们使用 `mining`（挖矿）这个词，但这些计算机实际上在做的是解决一系列复杂的数学问题，然后维护交易链。（为什么要进行这种 `mining` 呢？因为矿工会定期因这项工作获得他们自己的新
    `Bitcoin` 作为奖励。）这种模型有一些缺点，例如对环境的影响——我们稍后讨论——但作为一种维护 `Bitcoin` 完整性的系统，这种大规模协作/验证模型运行良好。


    `Bitcoin` 解决了溯源问题，但它还做得更多。`Bitcoin` 不是物理的。它们不是由可以用于任何东西的物质制成的。它们当然不像某些硬通币那样兑换成黄金（或其他贵金属）。然而，`Bitcoin`
    的许多优势在于它们无法做到的事情上。也就是说，它们无法以任何方式被伪造。不存在虚假的 `Bitcoin`。纸币可以被伪造（而且确实被广泛伪造）。当你拿起一张
    100 美元钞票时，你不知道它的来源。你不知道是在美国造币厂产生的，还是在朝鲜的伪造行动中产生的。作为接触货币的人，你无法获得这些信息。但对于 `Bitcoin`，这些信息不仅可用，而且是那枚货币不可分割的一部分。


