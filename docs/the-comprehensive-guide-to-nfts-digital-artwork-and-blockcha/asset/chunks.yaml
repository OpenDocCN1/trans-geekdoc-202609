    the consumer will own their data. Though it is correct to say that big tech currently
    does own large amounts of consumer data, SSI will gradually allow them to take
    it back. More and more, the consumer will transact directly with the brand. A
    one-on-one relationship will be developed in which data will be exchanged, but
    in a closed circle. A consumer can say to a musician they like, “I choose to give
    my data to you, and only you.” Data is owned by the consumer in sovereign fashion,
    and they cannot be compelled to give it out. Rather, they will share it by choice,
    only when and if they want to.


    Politicians will continue to argue over how much access big tech companies should
    have to your data. This is not an issue that is going to resolve itself quickly.
    But as more creators and companies begin to dip their toes into the NFT pool,
    cracks may begin to appear in the solid modern edifice of these data giants. Very
    slowly, and over time, they will begin to be somewhat disarmed.


    To conclude, we should note that this change does not necessarily bode ill for
    businesses like Facebook. The fact that consumers will have the option to interact
    directly with brands will push big tech to focus on its core capabilities. It
    will have to find ways to compete and it will improve. It will no longer overextend
    itself. Competition makes everyone better, and brings better products to the consumer.
    It’s high time big tech had some real competition. That competition is going to
    be enabled by blockchain technology.


    Did I fail to mention your industry or business in this section? If we did, don’t
    worry. NFTs and blockchains are still on the way whether you like it or not. It’s
    frankly beyond my poor power to add or detract from the changes they’re going
    to bring. Wherever technology is used in the future, this technology is going
    to be there.


    PART FIVE


    **New Opportunities for Investing**'
