  trans: '

    在遥远的某一天，在一个 NFT 已经普及到让人们几乎不再大动于色的市场里，我们可能会带着戏谑的心回首过去，发现这一切似乎都是从收藏级数字猫咪开始的。


    ## 加密货币、区块链和 NFT 领域是否存在争议区域？


    区块链技术经历过不少少量的怀疑和批评。事到如今，我想我们应该已经习惯了这些了！


    从远古以来，新的发明和创新总会引发人们对不熟悉的新产品的困惑。在某些不幸的情况下，这为消费者在完全不了解自己在买什么的情况下进行购买——甚至导致了赤裸裸的欺诈——下了笔。


    好消息是，区块链支持的技术正变得越来越熟悉，包括那些可能并不处于技术前沿（或根本不精通技术）的人。区块链是什么以及它是如何运作的核心要素正在广为人知。每个人都听过
    `Bitcoin`——这是一个良好的开始——即使他们不知道它是如何运作的或如何购买。虽然仍然存在误解的可能，但受过教育的消费者群体不断扩大，意味着通常情况下，对区块链技术的困惑在减少。


    更棒的消息是，对于 NFT 而言，其独特的技术正为其前身所经历的大多数批评提供了强有力的反击。


    例如，`Bitcoin` 等加密货币长期以来因其能源消耗和碳足迹而受到批评。一种你甚至无法握或触摸的数字货币，如何在“现实世界”中产生碳足迹？答案是：因为
    `Bitcoin` 通过挖矿来维护其区块链，矿工总是需要电力来驱动执行挖矿的计算机。随着 `Bitcoin` 的增长——越来越多的币被挖出——挖矿成本不断加速。剑桥大学于
    2021 年初发表的一项研究报告称，全球 `Bitcoin` 挖矿每年使用的电量大约相当于阿根廷国家。所有这些用电引发了碳排放的阴影，并增加了 `Bitcoin`
    的碳足迹。遗憾的是，为 `Bitcoin` 挖矿提供动力的大部分尚未来自可再生能源（尽管 `Bitcoin` 爱好者承诺这很快就会发生变化）。好消息是，现代
    NFT 的生产方式对环境的影响仅为 `Bitcoin` 之类产品的极小部分（这一点后文将详细介绍）。如果以正确的方式推出，NFT 将不必像比特币那样样的产生能量消耗。


    对区块链产品的其他批评还源于其助成了“拉高出货”骗，或者通过推出毫无价值的加密货币来故意欺骗新者的计划。例如，当 `Bitcoin` 的价值在 2010 年代初缓慢但稳定地增长时，加密货币市场充斥着每周发布的新型“硬币”。这些新币的创建者中，许多人只是为了赚取快钱。为了赚这笔快钱，他们可能会推出一种与毫无意义的噱头相关的加密货币——“为鹦形鹉爱好者打造的新代币，每个养了鹦形鹉的人都会想用！”——然后发行十亿个币。其中一半将在加密交易所上出售，另一半由硬币创建者保留。例如，如果这种新币的价值仅达到一分钱，创建者就可以卖掉他们手中的五亿个
    `ParakeetCoin`，凭空变出 `$20M` 并走人而去。持币者（以及各地的鹦形鹉爱好者）

