  trans: '

    人们想要拥有 NFT，但也想拥有参与 NFT 的公司。在 2021 年的前几个月，由于投资者的浓厚兴趣，NFT 受到了巨大的推动。对“NFT 股票”——即将支持或受益于即将到来的
    NFT 热潮的股票——的搜索激增。其中一部分源于自律的投资者，但无疑有一部分是由近期驱动大量科技投资的 FOMO（恐恐症）情绪产生的。然而，关键点在于这种兴趣是真实的——而且从所有指标来看，它正在增长。


    提供 NFT 共享资产所有权服务，或为投资者参与 NFT 提供新途径的企业普遍表现良好，股价正经历显著的飙升。有时，仅仅是与 NFT 关联的传闻就足以吸引关注。考虑
    2021 年 3 月底，有消息传出 Hall of Fame Resorts & Entertainment 将仅考虑专注于 NFT。该公司的股价在 24
    小时内几乎翻了一倍！


    公司也仅仅因为 NFT 的“一次性事件”而经历了兴趣的激增。例如，推特首席执行官杰克·多森（Jack Dorsey）曾以 290 万美元的价格卖出了他第一条推文的
    NFT。（该 NFT 是在其他知名科技偶像之间的竞价中卖出的，这倒也没有什么影响。埃隆·马斯克（Elon Musk）的推文 NFT 同样在竞价中以 110
    万美元售出。）多森本人并未从该 NFT 中获利，并承诺将交易获得的所有资金捐给在非洲对抗贫困的组织。然而，这不仅仅是一个噱头或为慈善筹款的方式。它是一个信号，表明推特非常打算并一直处于数字创新的前沿。


    如果你正在寻找“投资 NFT”，实际上三条路线：你可以购买 NFT 本身，你可以投资作为 NFT 技术区块链“后端”一部分的企业，你可以投资一家现有公司——这家公司可能根本不是科技公司——它已宣布将
    NFT 整合到其产品和服务中。


    ![images](img/f0027-01.jpg)


    让我们检查这三条路线。


    ### 购买 NFT


    投资 NFT 本身类似于购买艺术品。对于购买者来说，机会在于作品价值可能会升值并转售。（理想情况下，艺术品将在拍卖场景中转售，潜在买家将推高价格。）就像你投资实体艺术一样，当你投资
    NFT 时，了解“你是哪种投资者”会有帮助。


    首先，你对艺术是否有任何个人鉴赏？当你知道自己拥有某种美事物品时，你会产生积极的感觉吗？还是你是一个纯粹的逐利者？在你脑海中，油画和数字 NFT 图像完全完全替代的吗？确定你对打算购买的
    NFT 艺术是否具有审美兴趣，是该过程中良好的第一步。


    其次，了解你自己的风险承受能力以及你的投资窗口时间线至关重要。你是那种对“慢速且稳健”的、可预测且持续多年的收益感到最舒适的人吗？还是你愿意接受巨大的风险——以及可能在投资中亏损的情况——只要你有潜力快速获得巨额回报？市上有待售的
    NFT 代表了这两种极端，以及两者之间的任何状态。


    你对 NFT 作为艺术品的表现了解多少？很可能你并不非常了解，因为几乎没有人非常了解。不要相信任何告诉你他们拥有关于 NFT 表现长期信息的人，因为目前还没有所谓的“长期”！（告诉你这种话的人要么是在夸大，要么对“长期”的定义与我们大多数人完全不同。）无论你进入时的知识水平如何，你都想和其他人一样尽可能多地学习。NFT
    市场正在增长，新的社区一夜夜之间在网上涌现。在网上与他人讨论 NFT 可能是很棒的，但始终要用对待任何可能影响你财务未来的事的审慎眼光来审查你获得的信息。


    将 NFT 保持在你投资组合的一小部分也很重要。即使是那些现在花费数百万购买 NFT 的人也没有“全投入”。这是有原因的。并不是因为 NFT 比物理世界中的艺术品更可靠或不可靠；而是艺术市场的波动性意味着它只应该是你拥有资产的一小部分。（极少数人将收藏和艺术作为全职工作。但除非你打算买卖
    NFT 变成你新的 9 5 工作，否则你将希望确保它不占资产（数字或其他）的大部分。）


    你还需要考虑流动性对你有多重要。传统的实体艺术品流动性不高。如果你想将其转换为现金——并获得相当的价格——你将不得不开始漫长的销售过程，这通常涉及联系拍卖行。有了
    NFT，你会有更多选择。你可能仍然希望通过拍卖师或经纪人出售你的 NFT，但拍卖行能带来的许多优势已经植入 NFT 的区块链中了。你艺术品的潜在买家不需要来源报告。他们不会好奇艺术品是在何时、何时创作的。区块链带来的“真实性保证”可能意味着买卖双方在独立进行
    NFT 交易时变得更加舒适。（并且去除了拍卖行的抽成。）还没有人确切知道 NFT 艺术市场一旦会有多大的流动性，但可以肯定，NFT 将永远比传统的实体艺术品具有更高的流动性。

