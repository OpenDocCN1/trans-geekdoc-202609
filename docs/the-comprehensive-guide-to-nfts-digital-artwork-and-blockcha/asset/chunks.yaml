- fmt: '

    Ethereum currently claims that it is migrating to Proof of Stake. However, it
    has been making this claim since 2014. Ethereum has to do this via a “hard fork”
    which presents a huge challenge. All users will have to update at once. Perhaps
    because of this issue, Ethereum has been dragging its feet. Those of us who build
    systems and make art that uses block-chain need to advocate for a better way *now*.


    We’re certainly hoping that the Proof of Stake model can become the dominant one,
    and help ensure that the environmental impact of NFTs stays very minimal.


    We’re at an important juncture for blockchain technology. We have to decide what
    kind of future we want. Blockchain and NFTs can rush forward under an unsustainable
    model like Proof of Work. This will render growth impossible beyond a certain
    point, will put an incredible tax on the environment, and might eventually cause
    the technology to “flame out” and die. Or we can make a shift—and not even a particularly
    painful one—and transition to Proof of Stake models for the foreseeable future.
    This will allow blockchain technology to continue to grow in an environmentally-sustainable
    way. Sounds like a no-brainer, right? Well, as we see in so many issues today,
    there is knowing the right thing to do, and then there is making the break to
    actually do it. Those who wish to invest in blockchain for the long term will
    have to take a brave step and break with their cohorts and colleagues in the space.


    This leads us to another aspect of the path forward for block-chain technology
    . . .


    ## NFTs will need to last


    One of the interesting challenges that blockchain technology will help solve is
    what happens to an NFT if the company that has created it goes out of business.
    For example, companies like `OpenSea` are now among the leaders in selling NFTs.
    But as a purely hypothetical situation, what if `OpenSea` were ever to go out
    of business? Tech companies fail all the time, and it’s a reasonable scenario
    for a consumer to wonder about. Can you still prove that you own the NFT if the
    company that sold it to you doesn’t exist, and/or is no longer around to provide
    verification?


    The good news is that this problem can be—and *is* being—solved.


    We’re working on using InterPlanetary File Systems (or `IPFSs`) to ensure that
    anyone who buys an NFT know that their purchase still exists if something were
    to happen to the company selling them. An `IPFS` is a peer-to-peer network that
    can share data and information through a digital file sharing system that connects
    multiple devices. It is decentralized, but still allows for file storage between
    peers. Any peer in the network can request content verification from any other
    peer.


    The `IPFS` model will replace the current model in which a business selling NFTs
    might do so by renting space on Amazon’s servers. If something were to happen
    to that business’s ability to rent the space (or to `Amazon` itself) the ability
    to verify ownership of that NFT might be dicey, to say the least.


    But the `IPFS` model is instead going about the transaction in such a way that
    it distributes the metadata throughout peer networks. The `NFP` data will be on
    the blockchain itself, and will essentially be able to live forever.


    The added security that this will bring is going to be important as more and more
    consumers consider dipping their toes in the digital world. Many people hesitated
    to invest in cryptocurrency in the 2010s because they’d heard about the `Mt. Gox`
    fiasco in which a Bitcoin exchange based in Japan announced that approximately
    850,000 Bitcoins had been stolen from user wallets. Though about 200,000 were
    later recovered, the majority were never found. Even for members of the public
    unfamiliar with the inner workings of cryptocurrency—or perhaps *especially* for
    them—this was just another reason to steer clear of blockchain investment. There
    was this sense that crypto meant spending your hard-earned money to invest in
    a thing that might just suddenly disappear one day.


    While the fallout, follow-up, and litigation resulting from the `Mt. Gox` debacle
    are still ongoing, there’s no question that it created confusion and set back
    the adoption of crypto unnecessarily. If NFTs are going to become as pervasive
    as they deserve to be, and reach their full potential, consumers need to understand
    that purchasing an NFT is a sure thing. The technology backing the purchase is
    strong, and there is no chance—even under far-fetched circumstances—that the NFT
    itself will unexpectedly cease to exist.


    By pursuing `IPFS`-based approaches in the NFT marketplace, we can ensure that
    happens and lay the groundwork for a strong and lasting future for NFTs.


    In the end, however, what gives us hope is that the coming impact across industries
    will bring new players into the space who will demand that NFTs are created the
    right way. They will demand security and environmental sustainability. It’s one
    thing when artists and crypto investors get onboard. But when businesses of all
    types start to use NFTs, they will exert a pull—in the right direction—the likes
    of which we haven’t seen.


    In the next section, we’ll look specifically at how the rollout of NFTs across
    industries is likely to occur, and what it will mean for all of us.


    # PART FOUR


    ## The Impact of NFTs Across Industries: What to Expect in the Years Ahead


    We’re in the early stages. In early 2021, we were still really at the top of the
    first inning. However, we can still forecast the kind of changes that are probably
    going to ripple out from this starting point. Businesses will learn from one another.
    Certain industries will notice “good tricks” that are effective with NFTs, and
    adopt them.


    Most of all, we’re going to see a very significant evolution of artwork and visual
    representation using NFTs. There’s going to be a powerful transition from static
    art to dynamic art on NFTs. This will do two things: One, it will create more
    value over time. And two, dynamic art will create a lot of value for brands from
    a marketing perspective.


    It is this unlocking of value that will be translated across all industries through
    their advertising, marketing, and direct communication with their customers. It’s
    the rising tide that’s going to lift all boats.


    ![images](images/f0017-01.jpg)


    *Artist Kevin Abosch created blockchain-backed digital art back in 2018, before
    NFT was a term people knew*.


    Now let’s look at how the rise of NFTs can be harnessed by artists, businesses,
    and creators—and what the resulting impacts will be upon their industries.


    ### Musical artists


    Performers, musical artists, and bands are in the business of selling physical
    items, digital items, and experiences to their audiences.


    Let’s start with the physical. Those among us who are a little older can still
    remember records being sold in record stores. Then it was tapes. Then CDs. And
    though most music is now sold digitally, many artists still sell physical items
    like t-shirts, posters, and other “merch” to their fans. (Though there have been
    resurgences of vinyl in recent years, consumers now purchase music overwhelmingly
    through digital downloads and subscription-based streaming services.) For a few
    old timers, it may have been a challenge to “make the leap” to digital, but today
    the vast majority of music fans are now comfortable accessing their favorite musicians’
    work on a digital platform.


    ![images](images/f0018-01.jpg)


    *DJ and producer Steve Aoki released an 11-part NFT series that has resulted in
    one of the most lucrative launches so far*.


    Musicians also sell experiences. Attending a concert is an experience. Camping
    out at a three-day music festival is an experience. Attending an exclusive backstage
    “meet and greet” is an experience. In fact, as the profits from music sales have
    grown ever-leaner over the past twenty years, many professional musicians now
    earn the bulk of their incomes from this category.

