  trans: '


    我认为 NFT 在音乐人领域具有爆发性成功的潜力，因为它们将整合这三个领域——实物物品、数字物品和感官体验。


    事实上，我预测 NFT 将彻底颠覆音乐产业。


    ### 这种运作模式可能是这样的 . . .


    通过使用 NFT 创建并发行门票，音乐人可以直接向粉丝出售即将举行的演唱会票。这些演唱会门票既是“艺术品”（因为它们是粉丝可以永久拥有并自豪展示的 NFT），同时，它们也将作为解锁粉丝与艺人之间进一步体验的钥匙。NFT
    门票将提供“粉丝身份证明”，就像你在演唱会上购买的 T 恤可以让你在周一向朋友证明，你上个周末去参加了那场盛事一样。但它还能做更多事情 . . .


    演唱会结束后，艺人可以使用 NFT 与粉丝保持联系。这种做法的第一种是允许 NFT 持有者收听或下载他们参加过的演出的录音。一旦粉丝利用了这次下载，他们就与艺人建立了数字关系，而且这种关系可以变得更加深层。


    粉丝的 NFT 可以解锁关于该乐队的特殊信息。多个 NFT 可以用于解锁不同等级的奖励或体验。你可能会获得下一张专辑的优先体验权，或者下一次巡演期间获得前排票的优先购买权。


    如果你是一个音乐人，你可能想要出售一些特殊的奢侈品或体验。例如，你在上一次巡演期间在舞台上弹过的吉他。或者在异国他乡与极少数特殊粉丝一起进行的奢华沉浸式静修。但你如何识别那些愿意为这些产品投入巨额资金的“超级粉丝”呢？同样，你可以使用
    NFT 兼门票。如果一个人拥有你上一次巡演每场演出的 NFT 票，他们可能愿意并且解锁这些特殊的终极体验。


    该系统的额外好处在于，监管实物门票销售的机构可以被完全剔除，消除“中间人”，并可能为表演者和粉丝降低成本。NFT 还可以消除演唱会门票的倒卖和其他非法交易行为。


    NFT 可以帮助音乐人识别潜在的新粉丝（甚至可以帮助粉丝自己注意到：嘿，我真的很喜欢正在听的这支很棒的新乐队）。让我们解释一下这是如何运作的。


    到目前为止，我们只关注过通过货币交易获取 NFT。但如果存在*其他方式*来获取或解锁 NFT 呢？是的，音乐人可能会通过现金支付来向粉丝提供某种 NFT，但如果艺人是以交换某种活动的方式给粉丝提供
    NFT 呢？例如，让我们假设一个消费者在音乐流媒体服务上听了某艺人的新歌 100 次。在第百次收听后，消费者收到来自艺人的通知，告诉他们由于是是这首歌的粉丝，他们获得了一份
    NFT。这个 NFT 可能会解锁艺人提供的福利，例如接触新音乐的机会、参加新粉丝聚会的邀请，或即将举行的当地演唱会的免费门票。从艺人的角度来看，通过“奖励”型
    NFT 向粉丝迈出这一步，是将潜在粉丝或普通粉丝转化为死忠粉丝的绝佳方式！这对于粉丝社区本身也有意义。每个人都喜欢炫耀自己是第一个发现某个很棒的新音乐人的人（“*你*什么时候发现他们的？噢，真的吗？你能通过给我看你前百次收听的
    NFT 来证明这一点吗？”）。


    未来，音乐粉丝将从购买专辑、歌曲或演唱会门票转变为购买“粉丝身份的所有权”。这种所有权概念将带来一种特殊俱乐部的感觉。人们可能用来证明自己是粉丝群体一部分的传统“信号”仍然存在，但路径可能有所不同。例如，一个青少年可能还会穿着推广他们最喜乐队的最新
    T 恤。但获得那件 T 恤的故事将不再是“我在网上订购的”，甚至不是“我去了演唱会在并在周边帐里买的”。相反，粉丝将通过收集展示对乐队不同投入程度的 NFT
    来解锁获得那件 T 恤的访问权限。


    ### 奢侈时尚品牌


    时尚品牌将从 NFT 的实施中获得巨大利益，尤其是随着他们的行业日益依赖电子商务。时尚和奢侈品品牌在 NFT 帮助实现的许多元素中蓬勃发展，例如独占性、稀缺性和特殊邀请。


    时尚品牌力求赢得消费者的信誉。他们渴望在消费者中获得广泛的知名，但同时又通过创造排他性文化来运营。时尚和奢侈品消费者想要时尚且制作精良的物品，但他们也想要不是任何人都能得到的东西。


    “奢侈”捕捉了一种对世界的态度。它强调质量优先，但也用于表达购买者的生活方式目标和优先事项。那些获得并佩戴奢侈时尚的人在告诉世界他们拥有财富，能够获得独家产品，但他们也在广播他们对世界的某些优先事项和观点。通过这种方式，可能会发现最贵的商品/品牌并不总是最令人渴望的。


    ![images](img/f0019-01.jpg)


    *超级模女凯特·莫斯（Kate Moss）出售了一系列以她各种姿态呈现的 NFT*。


    然而，仍然令人渴望的是成为“圈内人士”、“高科技”、“与独占性连接”以及“领先潮流”。


    奢侈时尚品牌已经在努力将他们的产品与专属体验联系起来。NFT 将在此基础上绝对使其周围的可能性发生爆炸式增长。


    #### 这里是这种做法的一个例子 . . .


    沛爱达（Panerai）是一个瑞士/意大利的豪华腕表品牌，属于丽轩集团（Richemont Group）。2019 年，他们宣布推出一款以世界冠军自由潜水运动员吉尧·内里（Guillaume
    Néry）命名的潜水表。从独占性来看，这款腕表价格高达五位数，且全球限量 15 块。这已经非常有排他性了，但沛爱达并未于此。最棒的是，购买这块表将使主者获得与内里本人一起学习潜水的机会。


    所以，让我们思考一下这意味着什么。如果你了解高端腕表并遇到佩戴沛爱达内里的人，你就知道他们：1) 拥有财富，2) 有人脉获得这种限量版腕表，并且 3) *被邀请*与世界上最伟大的潜水员之一一起学习潜水。


