- fmt: '

    When seeking out a business in the NFT business to partner with or otherwise build
    a mutual relationship, the over-arching rule is to look for people who understand
    the space, have a passion for the product, and who are in it for the long term.
    Whenever a new innovation like NFTs hit the market, opportunists are going to
    swoop in and try to take advantage of the situation for short-term gain. Frustratingly,
    these opportunists only want a quick buck. They don’t truly have a passion for
    digital, and they don’t have the experience in the space. So how can you be certain
    that you’re dealing with the right kind of provider? We’re not here to make specific
    recommendations, but we can emphasize one important word: community.


    There is a deep and genuine sense of community among people working in this space.
    They share a passion for innovation, know the lexicon, and know where NFTs are
    going. Those in this community are interested in building something for the long
    term, something that’s going to last, and something that brings important change
    along with it.


    Anybody who merely emphasizes to your brand that some fast money can be made by
    jumping into NFTs is probably proposing a jump that you don’t want to take.


    ## Investing in the businesses that will incorporate NFTs


    When a new technology arrives on the scene, businesses— just like consumers—will
    adopt that technology at different rates, and along reliable pattern lines. There
    are always going to be:


    * Pioneers/leading-edge adopters

    * Early adopters

    * General adoption participants

    * “Feet draggers”


    Whether we’re talking about typewriters or computers or cellular technology, when
    new innovations with general, across-the-board applications show up, businesses
    almost always respond in ways that have them falling into these categories.


    In some cases, being at or near the leading-edge can have a tremendous business
    advantage for a company. In other cases, adoption of this new technology does
    not give a company a business edge, and may even be an expense that doesn’t result
    in a tangible advantage—but needs to be implemented just to maintain basic competitiveness.


    **Pioneers** are those who are frequently working in the industry developing the
    new technology (or a subset of that industry). These pioneers are going to have
    special knowledge, and will become implementers of the technology well before
    anyone else. Most of their work happens “behind the scenes.” When new breakthroughs
    happen for pioneers, the general business community (and the general public) is
    not yet aware of what’s happening.


    **Early adopters** are those who immediately see the business advantage offered
    by a new technology, and incorporate it into their own business as soon as they
    possibly can. They represent perhaps 10 to 15 percent of those who will transition
    to the new technology. These adopters are the first to take the risk with the
    technology, but also the first to reap the rewards it offers. These folks are
    also usually evangelists for the tech. Others in the industry will watch these
    early adopters closely, and use their results as an indicator of when it’s time
    for them to take the leap themselves.


    **General adoption** occurs when a majority of businesses decide that a new technology
    is appropriate for them, and that it is safe, necessary, and reliable. When new
    technology comes to market, those who adopt it in this category represent the
    vast majority of the technology’s consumers—about 70 percent. Some of the folks
    in this category are making this change because they want to, and others because
    they feel they have to, but when the market reaches this point it means the change
    is inevitable. This technology is going to happen.


    Finally, there will always be a small percentage of **those who drag their feet**
    when it comes to these things. This category is not large, and is usually composed
    of businesses who are struggling and feel they cannot afford to implement a new
    technology, or else are willing to risk that their business/product/service can
    thrive without it. (And there are always going to be a few avowed luddites who
    simply choose to resist change for its own sake.) In many cases, we see a business
    cost to being in this category, with very little advantage.


    You (the reader) and I (the author) know the competitive advantages that NFTs
    can bring, and we’ve looked at how NFTs are going to revolutionize a vast number
    of industries. But many investors don’t have our knowledge and are still unsure.
    And that gives you, the reader, an advantage when it comes to investing in the
    early adopter businesses.


    As noted earlier, only about 10 to 15 percent of businesses fall into this category.
    However, we aren’t anywhere near those numbers yet. There is still plenty of opportunity
    to identify the businesses that will enjoy the competitive advantages of early
    NFT adoption. At the rate things are going, by the end of 2021, we’ll be lucky
    if we see 2 percent of businesses adopting NFT technology in a meaningful way.
    There’s still a lot of space to get into this game.


    When you’re considering making an investment in a company implementing NFTs, ask
    yourself if the business stands to benefit according to any of the methods outlined
    in this book. Will the NFTs create a more direct connection between a business
    (or an artist) and their customers (or fans)? Does the business have a fan base
    that is likely to want to collect NFTs? Will new business efficiencies be unlocked
    and will the blockchain add value?


    We’re in a continually evolving space, so look for changes and updates to occur
    all the time. There will almost definitely be uses for NFTs that are not yet known,
    even by those of us working on the leading edge. (Again, this is a good thing!)
    When you see an early adopter business that is proposing to use NFTs in a new
    or novel way, they may have genuinely hit upon an important new application for
    the technology. You’ll have to do your own due diligence and trust your instincts.


    Wherever you choose to invest, connecting with the businesses who are ahead of
    the curve is where you’ll want to be. Those willing to leap into the NFT world
    with both feet are going to see a massive competitive advantage. The difference
    between them and the 70-ish percent of businesses that follow after the “general
    adoption” phase is going to be a big one. The big gains are going to be made in
    the next few years.


    ## Final questions: regulation


    We’ve looked at the benefits of NFTs, and the directions NFTs need to go. We’ve
    examined how certain brands are likely to be impacted by the rise of NFTs, and
    also at how and where NFTs are going to create tremendous opportunities for growth.


    ![images](images/f0029-01.jpg)


    Pioneering subway graffiti artist Futura 2000 cut his teeth making art outside
    the law. Now he is active in NFTs.


    We’ll close by examining the unsettled questions still surrounding NFTs. These
    are areas where we don’t yet know all of the answers. However, by identifying
    these areas of ambiguity and making a point to keep an eye on them, we can be
    ready to react swiftly whenever news breaks.


    Exactly how will NFTs be regulated and taxed in the decades ahead?


    These questions are at the very core of what the NFT future is going to hold.

