    以太坊目前声称它正在转向权益证明机制（Proof of Stake）。然而，自 2014 年以来它一直在做出这一主张。以太坊必须通过“硬分叉”来实现这一点，这是一个巨大的挑战。所有用户都必须同时进行更新。也许因为这个问题，以太坊一直在拖延。我们这些构建系统和创作使用区块链艺术品的人，需要在*现在*就倡导一种更好的方法。


    我们确实希望权益证明模型能够成为主流模型，并帮助确保 NFT 对环境的影响保持在最低。


    我们正处于区块链技术的一个重要转折点。我们必须决定想要什么样的未来。区块链和 NFT 可以在工作量证明（Proof of Work）这种不可持续的模型下飞速发展。这将导致增长在达到某一点后无法继续，给环境带来难以想象的负担，并最终可能导致技术“熄灭”并消亡。或者，我们可以进行转变——甚至不是特别痛苦的转变——并在可预见的未来过渡到权益证明模型。这将允许区块链技术以一种环境可持续的方式持续增长。听起来是显而易见的事，对吧？嗯，正如我们在今天的许多问题中看到的，知道正确应该做是一回事，而采取行动真正去执行是另一回事。那些想要长期投资区块链的人必须迈出勇敢的一步，与该领域的同伴和同事断绝关系。


    这引导我们思考区块链技术未来道路的另一个方面……


    ## NFT 需要持久存在


    区块链技术将帮助解决的有趣挑战之一是：如果创建 NFT 的公司倒闭了，NFT 会发生什么？例如，像 `OpenSea` 这样的公司现在是销售 NFT 的领军者。但作为一个纯假设性的情况，如果
    `OpenSea` 某天倒闭了呢？科技公司屡处倒闭，对于消费者来说，这是一个合理的疑问。如果卖给你 NFT 的公司不存在了，和/或不再能提供验证，你还能证明你拥有该
    NFT 吗？


    好消息是，这个问题可以被——而且*正在被*解决。


    我们正在努力使用星际文件系统（或 `IPFSs`），以确保任何购买 NFT 的人知道，如果销售它们的公司发生了什么事，他们的购买内容仍然存在。`IPFS`
    是一种点点网络，可以通过连接多个设备的数字文件共享系统来共享数据和信息。它是去中心化的，但仍然允许节点之间进行文件存储。网络中的任何节点都可以向任何其他节点请求内容验证。


    `IPFS` 模型将取代目前的模式，在模式中，销售 NFT 的企业可能通过租赁 Amazon 服务器上的空间来运营。如果该企业租赁空间的能力（或 `Amazon`
    本身）发生变故，那么验证该 NFT 所有权的能力可能会变得——至少可以这么——岌岌可危。


    但 `IPFS` 模型是以这种方式处理交易的：将元数据分布在整个节点网络中。`NFP` 数据将位于区块链本身，并本质上能够永远存在。


    随着越来越多的消费者考虑涉足数字世界，这带来的额外安全性将是至关重要的。在 2010 年代，许多人对投资加密货币犹豫不决，因为他们听过 `Mt. Gox`（门头交易所）的惨剧，一家位于日本的比特币交易所宣布约
    850,000 枚比特币从用户钱包中被盗窃。尽管后来追回了约 200,000 枚，但大多数从未被找回。即使对于不熟悉加密货币内部运作机制的普通大众——或者可能*特别是*对于他们来说——这只是避开区块链投资的另一个理由。当时有一种感觉，加密货币意味着花掉辛苦赚来的钱去投资一种某天可能突然消失的东西。


    虽然由于 `Mt. Gox` 灾难引发的影响、后续和诉讼仍在进行，但毫无疑问，它造成了混乱，并在必要的情况下推后了加密货币的采用。如果 NFT 要像它们应得的那样无处不在并发挥其全部潜力，消费者需要理解购买
    NFT 是一件有保障的事。支持购买的技术是强有力的，没有任何可能——即使在极端极端的情况下——NFT 本身会意外停止存在。


    通过在 NFT 市场中追求基于 `IPFS` 的方法，我们可以确保这种情况的发生，并为 NFT 强大且持久的未来奠定基础。


    然而，最终带给我们希望的是，即将来的跨行业影响将带来新玩家进入该领域，他们将要求以正确的方式创建 NFT。他们将要求安全性和环保性。艺术家和加密货币投资者加入是一回事。但当各种类型的企业开始使用
    NFT 时，它们将产生一种我们从未见过的、朝正确方向的拉力。


    在下一节中，我们将专门介绍 NFT 跨行业的推出可能会如何发生，以及这对我们所有人意味着什么。


    # 第四部分


    ## NFT 跨行业的影响：未来几年的预期


    我们正处于早期。在 2021 年初，我们还处于第一局的顶端。然而，我们仍然可以预测可能会从这个起点扩散出的各种变化。企业之间将相互学习。某些行业将注意到对
    NFT 有效的“妙招”，并采纳它们。


    最重要的是，我们将看到使用 NFT 的艺术品和视觉呈现发生非常显著演变。NFT 上将出现从静态艺术到动态艺术的强力转型。这将实现两件事：第一，它将随时间推移创造更多价值；第二，动态艺术将从营销角度为品牌创造价值。


    这种价值的释放将通过所有行业的广告、营销和与客户的直接沟通来实现。这就像大浪行舟。


    ![images](img/f0017-01.jpg)


    *艺术家 Kevin Abosch 在 2018 年就创建了区块链的数字艺术，当时 NFT 还是一个为人知的词*。


    现在让我们 NFT 的兴起如何被艺术家、企业和创作者利用——以及这对他们的行业产生什么影响。


    ### 音乐艺术家


    表演者、音乐艺术家和乐队经营的是向观众出售实体物品、数字物品和体验的业务。


    让我们从实体物品开始。我们中年龄大一点的人仍然记得在唱片店买唱片。然后是磁带。然后是 CD。虽然大多数音乐现在通过数字方式销售，但许多艺术家仍向粉丝出售 T
    恤、海报和其他“周边商品”等实体物品。（尽管近年来胶片有所复兴，但消费者现在绝大多数通过数字下载和订阅流媒体服务购买音乐。）对于少数老派来说，向数字“跨越”可能是一个挑战，但今天绝大多数音乐粉丝已经习惯在数字平台上获取他们喜爱的音乐作品。


    ![images](img/f0018-01.jpg)


    *DJ 和制作人 Steve Aoki 发布了一个包含 11 部分的 NFT 系列，这是迄为止收益最丰厚的发布之一*。


