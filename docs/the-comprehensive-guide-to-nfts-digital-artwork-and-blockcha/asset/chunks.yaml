  raw: 'Because of this loophole/system/exemption, the interest of fine art museums
    in NFTs will be paramount to NFT pricing in the years ahead. If a broad-based
    consensus grows that museums *will* accept donations of NFT art to their collections,
    then the market for NFT art overall will be boosted. The prices of NFT stand to
    rise generally when this *does* happen. Wise investors may want to get in now,
    just as this is beginning to occur.


    Another important consideration when it comes to NFT art investing will be overall
    timing in the marketplace. Right now, we’re still in the early days. Yet when
    the dominoes begin to fall in terms of acceptance of NFT art across the board,
    it’s very likely that at some point we’re going to reach a critical mass “boom.”
    When this happens, familiar patterns will emerge. When the general public—and
    investors not normally on the leading edge of technology—begin to have the sense
    that a booming market is underway, a lot of people will jump on the bandwagon.
    This can have the effect of creating a small and artificial bump in prices across
    the board as investors hope to make a quick buck without really understanding
    the market. True NFT investors will understand and appreciate the benefits of
    NFT artwork, and will want to hold them over the long term as their value gradually
    increases. But those who jump in and create a run-up in the market generally only
    muddy the waters for true investors. A spike happens, and even sensible investors
    can come away with the impression that a boom and bust has occurred. (We see this
    pattern in cryptocurrency investing as well.)


    So what can a smart NFT investor do? When you have the sense that an initial,
    artificial boom is underway, remain calm and hold on to your NFTs. This is the
    wrong time to buy, and the wrong time to sell. If it helps, remember what happened
    to the price of Bitcoin in late 2017. The sudden boom sent prices hurtling at
    artificial speed up to $20,000. Those who anxiously sold at this price—assuming
    this was the most valuable Bitcoin would ever get—and those looking for a quick
    profit who bought at this price, both lost in the long term! (At the time of this
    writing, Bitcoin hovers around $60,000.) Let the market correct, then resume collecting
    for the long(er) term. This is the surest way to keep your head when those around
    you are not acting rationally.


    A final, but perhaps obvious advantage of purchasing NFTs over traditional art
    is you won’t have to factor storage and/or maintenance and/or restoration costs
    into the price of your investment. Even if you live in a small studio apartment,
    your NFT investment holdings can be enormous. You also won’t need to insure your
    NFTs against art thieves in the same way you’d need to insure a canvas by Picasso.
    The fact that your ownership is built into the blockchain makes the notion of
    a Pink Panther–like art thief something of a relic!


    In conclusion, when it comes to collecting NFT art with an eye to growing wealth,
    nobody is very far “ahead in the game” because the game itself has just begun.
    By getting yourself educated on the fundamentals and proactively learning all
    that you can, you’re already going to be at or near the head of the pack because
    *this is all happening right now*. Apply the basic fundamentals of art collecting
    to this new manifestation of art, and you can find yourself with a collection
    that may be envied for many years to come.


    *Investing in the businesses making NFTs possible*


    If you’re looking for opportunities that will accompany the rise of NFTs, consider
    the businesses that will support and accommodate every aspect of an NFT-based
    transaction. In this section, we’ll review some of the most important businesses
    providing support to this new economy.


    When it comes to the nuts-and-bolts of the business model of most NFT marketplaces,
    most take a transactional fee. What do they do to earn that fee? They work with
    creators, businesses, brands, and innovators to create NFTs. In some cases they
    finance the engineering and the programming, and can provide the creators with
    creative team members to augment the process with artists and animators. (This
    is a little bit similar to the way an artist like Jeff Koons will augment his
    own creations with a workshop of helpers.) Then, when the NFT sells, the marketplace
    pays the artist the majority of the profit, keeping a small transactional fee
    for themselves.


    So, at a rubber-meets-the-road level, marketplaces are helping brands and artists
    to build and sell their NFTs, and keeping a small percentage of the profit for
    themselves. But in my line of work we’re also doing something else. From a slightly
    higher elevation—metaphorically speaking—we’re trying to build a community of
    like-minded individuals across the creative spectrum from fashion, sports, entertainment,
    and human rights—and giving them new tools to express themselves. We also curate
    the list of brands we work with in a way that opens the door for cross-branding
    opportunities and new promotions. For example, the cultivated consumer might appreciate
    listening to the music of one artist, and at the same time discovering new clothing
    from another brand that we feature, and also giving back to a social issue through
    a nonprofit that has engaged with our space using NFTs. I believe that if we focus
    on building the community over the long term, the value will not be transitory
    in nature. We’re extending content to galvanize community in the long term. (More
    in a moment on why this is so important.)


    There’s a lot of interest in getting into the business of helping brands and individual
    artists create digital art, digital collectibles, and tokenizing (and NFT-izing)
    products for customers. Some businesses are creating specializations for themselves
    within this space. For example, they focus on helping artists create one-off pieces
    that will qualify as fine art and become suitable for fine art collectors. They
    will also work with artists to create limited series of the same work, and then
    position them in the same way a painter will sell signed prints. Other digital
    companies are cultivating specialties in digital collectibles. These companies
    will focus on brand partnerships and typically connect with preexisting content
    companies to turn their existing properties into collectible NFTs. The collectible
    NFTs can take the form of cards, videos clips, or badges that function as tokens
    with customer benefits when interacting with the parent brand. (For example, a
    collectible NFT may also give the customer a 10 percent discount when presented
    at that company’s store.)


    Other NFT companies will still cultivate specialties in redemption and tokenization
    offers, and in embedding NFTs in products that already exist. They will help musicians
    release music as NFTs, and video content creators to release their videos as NFTs.
    The unique data that the NFTs will bring will help these content creators grow
    new connections with their fans, and use those connections to optimize product
    launches in the future.


    Yet other businesses in this space are going to develop the ways to showcase NFTs
    after consumers have purchased them. Sure, there are a few people who buy a work
    of fine art, a T-shirt from last weekend’s big concert, or a nifty collectible,
    and choose to hide it away in a secret vault in the basement. But these eccentrics
    are few and far between! For most consumers, much of the fun and excitement of
    purchasing new pieces of content will come from being able to share it with friends.
    Developers are going to create digital carousels to feature NFTs. They’re going
    to find ways that NFTs can be exhibited on personal websites, and it’s not a stretch
    to forecast that social media profiles may also begin offering ways to showcase
    NFTs. Other developers will help consumers curate personal digital galleries where
    NFTs can be displayed.'
