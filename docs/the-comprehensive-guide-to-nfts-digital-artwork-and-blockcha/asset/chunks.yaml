  raw: 'This is a technology that can have a sort of “critical mass” effect on supply
    chain. When enough players in the industry become accustomed to working with and
    using blockchains to secure the integrity of the chain of goods, then a network
    effect will be achieved, and that can create efficiencies felt across the board.


    *Security and cybersecurity*


    Much of security and cybersecurity hinges on two questions: “Who are you?” and
    “Should you be here?”


    When an employee walks through the security gate at their corporate office and
    flashes a badge, they are wordlessly answering both of these questions. This is
    who I am, and I’m here today because I’m an employee (or visitor).


    Likewise, when an employee types a name and password into a computer in order
    to access secure information, they are again answering these two questions.


    Yet for all of the security guards and cybersecurity reminders from the IT department,
    we still have not solved the problems of physical security and cyber security.
    Numbers fluctuate annually, but retailers generally lose around $60 billion per
    year in theft. And when it comes to cybercrime, globally, thieves are estimated
    to steal as much as half a trillion dollars each year.


    Blockchain and NFTs will be a powerful tool in the war to stop crime and help
    businesses improve their security.


    On the physical crime and retail side, NFTs can play a role in helping guard against
    impersonation and identity theft. For example, ID badges can be faked, and even
    scannable badges with digital technology can be hacked. But what about verfiable
    credentials? They are unique and tied to the block-chain. Imagine a worker passing
    though security with a verfiable credential badge. When the security guard scans
    the badge, they would be doing more than making sure the photo on the front matches
    the person, and that swiping the badge brings up the correct name on their computer.
    They would also be checking the badge against the blockchain itself. It would
    be impossible for a criminal to fake such a badge because the blockchain would
    immediately know.


    And what about retail theft? Incorporating blockchain verfiable credentials (potentially
    coupled with NFTs) into physical items would help prevent black market dealers
    from reselling unauthorized goods. From another perspective, resale shops and
    pawn shops could be doubly certain that they were not buying stolen goods. A prospective
    buyer could inspect a token to ask, “Does this show a record on the blockchain
    of being sold?” If the item has been sold legitimately, that information can be
    added to the blockchain. Conversely, if there’s no record of the sale, a prospective
    buyer cannot claim to have had no knowledge that they were purchasing something
    illegally.


    In addition, blockchain’s basic technology would give all users on the chain immediate
    access to anything inappropriate or criminal that might be occurring. Unauthorized
    users could be immediately detected, and from every direction. And there would
    be no delay in detecting this. It wouldn’t be, “We were hacked!” but rather, “We
    are being hacked at this very moment!”


    Knowing who everyone is—and if they should be doing what they’re doing—will always
    be at the core of safety and cybersecurity. Verifiable credentials—in some cases
    tied to NFTs—will help make it easier to immediately establish identity, establish
    what goods have been used in which transactions, and make sure that only qualified
    people are looking to secure online locations. There will always be questions
    to ask to keep businesses and information secure, but in a future of NFTs, they’ll
    hopefully be fewer and farther between.


    *Insurance*


    The insurance industry is going to be able to use blockchain technology to provide
    faster service to customers, operate in an atmosphere of increased customer confidence,
    and—most importantly—prevent fraud.


    Although the insurance industry is constantly innovating and improving, it is
    still beset by stereotypes and misunderstandings that can make it difficult for
    customers to feel confident. There’s a popular conception/feeling that even when
    insurance premiums are fully up to date and coverage has been secured, that insurance
    companies will still find a way to “not pay” when a customer needs to use a policy.
    In most cases, this stems from situations in which someone has failed to pay their
    policy minimum, or someone has simply not understood their policy. Nonetheless,
    the stereotype, and the resulting mistrust, still very much exists today.


    Blockchains can provide a record (for the consumer and the insurance company alike)
    to verify that coverage has indeed been secured. It can help insurance companies
    provide clear frameworks for the product they offer, and can help insured consumers
    understand what they are purchasing when they buy the insurance.


    Insurance companies depend on the data they use to formulate insurance rates for
    large populations. This data needs to be accurate. Even the smallest mistakes
    can result in big losses. If an insurance company is looking at data on, say,
    the rate of vehicle accidents by drivers who live in a certain zip code, they
    need that information to be timely and accurate. If this regular data were stored
    on the blockchain, the insurance company would have a record of precisely when
    the relevant statistics were updated, and would always know where to look in order
    to find the most current information possible.


    Using a blockchain can also help prevent insurance fraud. One of the ways it can
    do this is by verifying whether an insurance policy is current or not. In most
    situations today where proof of insurance is required, we’re often still talking
    paper documents. We carry paper proof of insurance cards in our wallets to verify
    car insurance, and plastic cards to verify that we have health and dental insurance.
    But providers generally need to call or login to insurance company websites to
    verify that the card which corresponds to an insurance policy is still in effect.
    But what if instead of a physical card, we carried documents tied to a blockchain
    that we could bring up on our personal devices? These would immediately be able
    to verify things like coverage status and amount of coverage. This would prevent
    anyone from using an outdated document to fraudulently claim coverage.


    Or what about verifying information that an applicant gives to an insurance company?
    Whether it’s employment status, income, driving record, health status—or a similar
    category—these facts could all be immediately verifiable for an insurance company.


    Blockchain technology will also allow insurance companies to provide better service.
    Property and casualty insurance claims can be processed more quickly. Insurance
    policies can specify that payouts will be made using blockchain backed “smart
    contracts”—self-executing documents in which the agreement between two parties
    (such as a buyer and a seller) is built into the blockchain and will automatically
    happen when the right conditions are met in a trackable and irreversible way.


    Smart contracts could automatically issue policies when the correct conditions
    are met, and automatically send payments to policyholders (making payments happen
    much faster). They would also create great clarity for consumers, eliminating
    any mystery as to why a claim had (or had not) been paid.


    Any innovation that can create trust and clarity in the insurance industry will
    be welcome. Both insurer and insured do best when they trust one another, when
    they have access to the same data, and when they feel comfortable that no false
    representations can be made. Blockchain technology will help the insurance industry
    to fight fraud, pay claims more quickly, and verify information accuracy. This
    should go a long way toward improving customer responsiveness, and creating useful
    business efficiencies.


    *Big tech*'
