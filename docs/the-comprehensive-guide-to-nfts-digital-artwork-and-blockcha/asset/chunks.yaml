- fmt: '

    Video games are an industry where NFTs are perfectly primed to explode. All the
    elements are ready to make the entrance of a new technology an absolutely groundbreaking
    event. You’ve got an audience accustomed to digital products and transactions,
    and paying for things online. Gamers are already familiar with peer-to-peer networks
    and forging connections online. But as much as any of this, with games, you have
    a culture that strives to have a literally unique gaming experience. Avatars have
    gone from uniform/identical, to slightly customizable, to completely customizable.
    In many contemporary video games, it’s not uncommon to be able to design a character’s
    facial features, gender, clothing, and so on. Just about every element is unique
    to that gamer playing that character. But what happens when the game is completed?
    What’s left to do when the gamer is waiting around and hoping for the sequel?


    ### NFTs After the Game


    This is the beginning of how NFTs can intersect with games played digitally. The
    idea that a much beloved avatar—with whom the gamer has literally spent hundreds
    or thousands of hours—might be forever lost after the game is beaten is deeply
    unsatisfying. But NFTs will allow players to preserve their character and its
    accomplishments on the blockchain forever—or sell it to someone looking to play
    the game next. The same things that are preserved on an NFT related to a professional
    athlete—his or her game stats, unique appearance, and a GIF of their signature
    move—can also be captured for a video game avatar. Just as an athlete might enjoy
    looking over a physical trophy case, a gamer can assemble a digital trophy case.
    Each time they complete a game, they can create an NFT of their hero that will
    be preserved on the blockchain for all time—even if operating systems change,
    or gaming consoles move on to the “next gen.”


    ### During the Game


    So that’s a scenario for “after the game.” What about before the game has been
    completed? What about during the game? Here too, NFTs bring the capacity for a
    transformative experience.


    In the most popular cross-platform online games—Fortnite would be a good example—players
    are rewarded for in-game accomplishments by receiving new items, weapons, and
    equipment. These things can then be used to give their character a competitive
    advantage in the game—better camouflage, a more powerful gun, etc.—but they can
    also be used to give each player’s avatar a tailored appearance. These items can
    stay with the avatar from game to game once acquired, becoming essentially a permanent
    part of the experience. Yet while many of the items players so enthusiastically
    collect are very rare—the algorithm causing them to occur only very occasionally—they
    are not literally unique items. If you’ve got a super special outfit or weapon,
    it still stands to reason that someone, somewhere else in the gaming universe
    has precisely the same loadout.


    But what if they couldn’t? What if it was impossible for another player to have
    the same weapon, shield, or character dance move—because yours was an NFT?


    Blockchain technology will allow game companies to design completely unique items
    available to only one player out of the thousands and thousands who might be playing
    the same game. Once they are obtained by the player, they can be traded or sold
    (as the game allows) just like any other NFT. In massive multiplayer games, this
    will give the players an entirely new way to make their characters distinctive
    and add continuity to the gaming experience.


    ### Digital Real Estate and Value


    So far in 2021, much has been made of the selling of “digital real estate” using
    NFTs. In just one example, in February of 2021 a player paid about $1.5 million
    for multiple digital properties in a video game called Axie Infinity. Using real
    money to purchase virtual items in video games is not new; it’s been around for
    as long as computers and consoles have been able to process digital transactions.
    But previous in-game purchases have never been so astronomical. Before NFTs, players
    might pay an extra $20 to upgrade their character’s weapon or appearance, or $60
    to unlock an “add-on” portion of gameplay (such as new lands to explore or additional
    quests for a character to perform). It should be noted that these previous in-game
    transactions have generated substantial criticism from the gaming community. For
    example, a game might be priced at $60, but require another $20 to unlock all
    character traits, and another $60 to unlock all of the quests—with these latter
    portions available only through digital in-game purchases. In these cases, the
    gaming community will typically argue that the list price of $60 was deceptive,
    and that the game simply should have been priced at $140, and had all of the content
    included in the initial version.


    ![images](images/f0023-01.jpg)


    ![images](images/f0024-01.jpg)


    What can take in-game purchases from two figures to seven figures? The answer
    is: the thing being purchased. People are willing to pay for exclusivity. People
    are willing to pay more for something that’s produced in a limited edition than
    they are for something that comes in unlimited amounts.


    People are willing to pay dues to belong to exclusive clubs, associations, and
    societies. Having something unique and special makes people feel good, and they’ll
    pay top dollar to feel that way.


    NFTs will change video games because the things that can be purchased will not
    only add to the experience of the game for the player, but they will create a
    singular uniqueness that everyone playing the game will be able to see and feel.
    Imagine purchasing a castle or spaceship or sword within a game, and knowing that
    you’re the only player in the entire world with it or that it was previously owned
    by a top gamer or celebrity. Yours is a “one of one” and a rare collectible.


    ### Investment and Future


    It’s also plain that there’s going to be the potential for gamers to make these
    new in-game purchases as investments. (At least in games that enable players to
    purchase things and also to sell things. . . . This is a functionality that players
    will soon demand.) Say I’m playing a brand new video game that just debuted. The
    jury’s out on it and the reviews are still coming in, but I like the game so I
    spend 1,000 real-world dollars to buy a unique magic sword for my character. In
    a few months, many other gamers have followed my lead and discovered this game.
    It becomes massively popular, and goes from thousands of players to millions.
    Now the demand for my sword is exponentially higher, and I may be able to turn
    around and sell it for ten or more times what I paid. (Conversely, those who bet
    incorrectly will suffer the opposite effects. Those who purchased in-game unique
    items solely for the purpose of reselling them later—and not out of any genuine
    passion for the game—will lead to a loss.)


    Some companies are already setting up shop as a hub where users can buy, sell,
    and trade unique in-game possessions, from clothing to real estate, in NFT form.
    If virtual property catches on, consumers in the future may remember the present
    as akin to halcyon days of a digital “Oklahoma land rush” in which vast amounts
    of space were available virtually to all comers for very little outlay of cash.


    Video games are also a space where we’re clearly going to see innovations we haven’t
    even thought about yet. There are bound to be uses for NFTs that we haven’t imagined,
    and which go beyond merely “NFT-izing” the weapons and costumes currently sold
    in video games.

    '
