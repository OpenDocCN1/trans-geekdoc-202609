- fmt: "\nAnother thing that NFT-based art and traditional physical art both have\
    \ in common is that they’re made by humans. Digital art captured as an NFT makes\
    \ use of computer technology, but at the end of the day there is a real live artist\
    \ pressing the keys. Getting to know the artists who are making art is going to\
    \ be more important than ever in today’s art market. \n\nThe reason is that NFTs\
    \ present a situation unique in art history because we’re still very close to\
    \ “Year 1” for all NFTs. Virtually all artists who have made an NFT artwork are\
    \ still alive. In the world of paintings or sculptures, the majority of the artists\
    \ whose work is commanding the highest sale prices are no longer alive. Many of\
    \ them died centuries ago ago. But somehow, NFT artists are now commanding prices\
    \ up there with some of the old masters of the art world, but the difference is\
    \ they’re not dead (and in many cases not even old). You can follow them on Twitter\
    \ and Instagram, and even get to know them personally if you like. This is a jarring\
    \ change that really can’t be overemphasized. (We’ll try italics, though.) \n\n\
    There is an entirely new format for high-end collectible art and virtually every\
    \ single artist working in the format is still alive. What if you could Facebook\
    \ friend Van Gogh, or email Matisse, or subscribe to Basquiat’s online newsletter?\
    \ With NFT-based artists, 1) you can, and 2) you absolutely should if you plan\
    \ on becoming a serious collector of NFTs. Centuries in the future, the late 2010s\
    \ and early 2020s will be remembered in the art world as the “golden age” of NFTs.\
    \ Not only because this was when NFTs came on the scene, but also because this\
    \ was when all of the original NFT artists were still alive and making art. Collectors\
    \ in the far future will be deeply jealous and envious of the opportunities presented\
    \ to NFT collectors today. History is full of examples of collectors who became\
    \ patrons of artists—and/or personal friends of them—and this resulted in an impressive\
    \ collection of many of that artists’ works. We’re not saying you have to schmooze\
    \ with an artist personally, but this is a great time to educate yourself and\
    \ at least consider getting to know the artists who are working in the NFT format.\
    \ Chances like this come along very seldom in the history of collecting!\n\nIt\
    \ is also a great time to get into NFTs-as-art because we have not yet seen what\
    \ the pull of “dark matter” or “dark collectors” will be . . . simply because\
    \ they haven’t been established yet.\n\nFor those unfamiliar, these “dark”-terms\
    \ are often used in the art world to refer to forces that exert an unseen hand\
    \ on the marketplace—frequently making it seem as though the art market is behaving\
    \ in irrational ways. Because it’s important—and definitely has the potential\
    \ to influence NFT pricing—let’s look at a hypothetical example. Let’s say there\
    \ was a prolific twentieth-century visual artist named “Andy W.” Let’s also say\
    \ Andy made thousands of paintings and prints over his lifetime, and today there\
    \ are thousands of people who collect his work. Some art collectors own so much\
    \ of it that they have a significant financial stake in his work. Now, let’s say\
    \ that a print signed by Andy of a famous actress named “Marilyn” typically sells\
    \ at auction for $1 million. Let us further say that there’s an upcoming auction\
    \ in which several of these signed Marilyns will be offered for sale at a major\
    \ auction house, but many art industry experts are pointing out that there are\
    \ already a glut of Marilyns out there; they conjecture that the market may be\
    \ flooded, so prices could drop. \n\nHowever, on the day of the auction, a very\
    \ strange thing happens. Each time a Marilyn goes up for sale, there is initially\
    \ a bit of enthusiastic bidding, but it kind of peters out when the price gets\
    \ to about $500,000. But each time this occurs, a small group of anonymous bidders\
    \ jumps in. The members of this group bid against one another, and bid the price\
    \ up to around $1 million. Then one of them buys the Marilyn for that amount.\
    \ And this pattern seems so occur for each of Andy’s works offered at this auction.\
    \ \n\nWhat just happened? Why would a cadre of anonymous buyers swoop in to prevent\
    \ the signed Marilyns from being sold at their seemingly organic price of half\
    \ a mil, by bidding up the price and paying an unnecessarily high amount themselves?\
    \ A dirty secret of the art world is that the anonymous (or simply unknown) buyers\
    \ were probably “straw purchasers” acting on behalf of wealthy collectors who\
    \ already own lots of these signed Marilyns by Andy W. They are bidding up their\
    \ price because it is in their interest to ensure that the price of these works\
    \ does not dip as more are added to the marketplace. And art auctions can serve\
    \ as a kind of “exchange” for works of art—at which, the value of a particular\
    \ artist or type of art can be set. For example, let’s say I’m a wealthy art collector\
    \ and I own 100 signed Marilyns valued at about $1 million each. If there’s an\
    \ art auction in which a Marilyn similar to mine is sold for only $500,000, then\
    \ art valuers may decide that the market must be saturated, and the true value\
    \ of a Marilyn is now this new amount. I just lost $50 million of wealth! But\
    \ now let’s imagine that I know this might occur, so I have someone attend the\
    \ auction on my behalf, and if it appears the Marilyn is going to sell for less\
    \ than $1 million, I have my person bid it up to that. I just spent $1million\
    \ to save myself $50 million.\n\n![images](images/f0028-01.jpg)\n\nPak is a crypto\
    \ artist who has been able to sell their work maintaining complete anonymity.\n\
    \nIn this way, the traditional market can feel this eerie, strange, and illogical-seeming\
    \ pull exert when it comes to artwork sales and pricing. Of course, collectible\
    \ artwork is—at the end of the day—just another form of art, which means that\
    \ one day it is likely we will see these dark forces at work. Yet importantly,\
    \ for the moment, they are not exerting a strong force (if any). Another consideration\
    \ when collecting NFT artwork is the role of institutions. The fact that prestigious\
    \ museums and cultural institutions will buy works of fine art, and/or accept\
    \ them as donations, is also a key driver of the art market. Those outside the\
    \ art market underestimate the pull and power that comes from museums accepting\
    \ donated works.\n"
  raw: 'Another thing that NFT-based art and traditional physical art both have in
    common is that they’re made by humans. Digital art captured as an NFT makes use
    of computer technology, but at the end of the day there is a real live artist
    pressing the keys. Getting to know the artists who are making art is going to
    be more important than ever in today’s art market. The reason is that NFTs present
    a situation unique in art history because we’re still very close to “Year 1” for
    all NFTs. Virtually all artists who have made an NFT artwork are still alive.
    In the world of paintings or sculptures, the majority of the artists whose work
    is commanding the highest sale prices are no longer alive. Many of them died *centuries*
    ago. But somehow, NFT artists are now commanding prices up there with some of
    the old masters of the art world, but the difference is they’re not dead (and
    in many cases not even old). You can follow them on Twitter and Instagram, and
    even get to know them personally if you like. This is a jarring change that really
    can’t be overemphasized. (We’ll try italics, though.) *There is an entirely new
    format for high-end collectible art and virtually every single artist working
    in the format is still alive*. What if you could Facebook friend Van Gogh, or
    email Matisse, or subscribe to Basquiat’s online newsletter? With NFT-based artists,
    1) you can, and 2) you absolutely *should* if you plan on becoming a serious collector
    of NFTs. Centuries in the future, the late 2010s and early 2020s will be remembered
    in the art world as the “golden age” of NFTs. Not only because this was when NFTs
    came on the scene, but also because this was when *all* of the original NFT artists
    were still alive and making art. Collectors in the far future will be deeply jealous
    and envious of the opportunities presented to NFT collectors today. History is
    full of examples of collectors who became patrons of artists—and/or personal friends
    of them—and this resulted in an impressive collection of many of that artists’
    works. We’re not saying you *have* to schmooze with an artist personally, but
    this is a great time to educate yourself and at least consider getting to know
    the artists who are working in the NFT format. Chances like this come along very
    seldom in the history of collecting!


    It is also a great time to get into NFTs-as-art because we have not yet seen what
    the pull of “dark matter” or “dark collectors” will be . . . simply because they
    haven’t been established yet.


    For those unfamiliar, these “dark”-terms are often used in the art world to refer
    to forces that exert an unseen hand on the marketplace—frequently making it seem
    as though the art market is behaving in irrational ways. Because it’s important—and
    *definitely* has the potential to influence NFT pricing—let’s look at a hypothetical
    example. Let’s say there was a prolific twentieth-century visual artist named
    “Andy W.” Let’s also say Andy made thousands of paintings and prints over his
    lifetime, and today there are thousands of people who collect his work. Some art
    collectors own so much of it that they have a significant financial stake in his
    work. Now, let’s say that a print signed by Andy of a famous actress named “Marilyn”
    typically sells at auction for $1 million. Let us further say that there’s an
    upcoming auction in which several of these signed Marilyns will be offered for
    sale at a major auction house, but many art industry experts are pointing out
    that there are already a glut of Marilyns out there; they conjecture that the
    market may be flooded, so prices could drop. However, on the day of the auction,
    a very strange thing happens. Each time a Marilyn goes up for sale, there is initially
    a bit of enthusiastic bidding, but it kind of peters out when the price gets to
    about $500,000. But each time this occurs, a small group of anonymous bidders
    jumps in. The members of this group bid against one another, and bid the price
    up to around $1 million. Then one of them buys the Marilyn for that amount. And
    this pattern seems so occur for each of Andy’s works offered at this auction.
    What just happened? Why would a cadre of anonymous buyers swoop in to prevent
    the signed Marilyns from being sold at their seemingly organic price of half a
    mil, by bidding up the price and paying an unnecessarily high amount themselves?
    A dirty secret of the art world is that the anonymous (or simply unknown) buyers
    were probably “straw purchasers” acting on behalf of wealthy collectors who already
    own lots of these signed Marilyns by Andy W. They are bidding up their price because
    it is in their interest to ensure that the price of these works does not dip as
    more are added to the marketplace. And art auctions can serve as a kind of “exchange”
    for works of art—at which, the value of a particular artist or type of art can
    be set. For example, let’s say I’m a wealthy art collector and I own 100 signed
    Marilyns valued at about $1 million each. If there’s an art auction in which a
    Marilyn similar to mine is sold for only $500,000, then art valuers may decide
    that the market must be saturated, and the *true* value of a Marilyn is now this
    new amount. I just lost $50 million of wealth! But now let’s imagine that I know
    this might occur, so I have someone attend the auction on my behalf, and if it
    appears the Marilyn is going to sell for less than $1 million, I have my person
    bid it up to that. I just spent $1million to save myself $50 million.


    ![images](images/f0028-01.jpg)


    *Pak is a crypto artist who has been able to sell their work while maintaining
    complete anonymity*.


    In this way, the traditional market can feel this eerie, strange, and illogical-seeming
    pull exert its force when it comes to artwork sales and pricing. Of course, collectible
    NFT artwork is—at the end of the day—just another form of art, which means that
    one day it *is* likely that we will see these dark forces at work upon it. Yet
    importantly, for the moment, they are not exerting a strong force (if any at all).
    This means that those seeking to invest in NFT works of art can probably bet that
    they are getting something priced at what it’s actually worth—free of the pull
    of secret forces.


    Another important consideration when collecting NFT artwork is the role of institutions.
    The fact that prestigious museums and cultural institutions will buy works of
    fine art, and/or accept them as donations, is also a key driver of the art market.
    Those outside the art market often underestimate the pull and power that comes
    from museums accepting donated works of fine art.


    Here’s how it works: I’m a very wealthy person, and a high-end work of art is
    offered for sale to me at $50 million. I wonder if I should buy it. There are
    risks involved. The artist could fall out of favor and the value could go down.
    An undiscovered trove of work by the artist could be unearthed, flooding the marketplace
    and drastically lowering prices. In such scenarios, I might have trouble selling
    the work for what I paid, and I could lose wealth. However, because museums accept
    art from this artist as donations, I have another route—almost an “escape valve”—that
    helps me to feel comfortable making the purchase. When I make a donation of a
    work of art to a museum or institution, I know that I can declare the value of
    the art on my taxes as a charitable donation. So, if, one day, I have millions
    of dollars in income that I’d like to not pay taxes on—a common situation for
    a wealthy guy like me—I can use a donation of this artwork to avoid paying those
    taxes (because the price of the artwork will be credited as a charitable donation
    against my other income). This may make me comfortable pulling the trigger on
    purchasing that expensive work of art.'
