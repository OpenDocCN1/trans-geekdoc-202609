- fmt: '

    Buyers will know the history of properties and the transactions on that property.
    Sellers will know about the person seeking to purchase a property. And those trading
    in tokenized real estate—and all of the other blockchain derivatives that are
    sure to come—will find that they can transact things more quickly, with much greater
    safety, and without the need for government regulation.


    # Travel and leisure


    Hotels, airlines, casinos, booking services, tour companies, rental car companies—these
    are but a few of the players that make up the travel and leisure industries. While
    some vertical integration does exist, these industries are largely made up of
    many separate companies and chains that must work in tandem—or occasionally through
    official partnerships—to be collectively successful. `NFTs` and blockchain-based
    products can help these industries overcome a number of collective hurdles, and
    allow them to work together to serve consumers in new ways.


    Using digital blockchain technology, travel and leisure providers will be able
    to connect more directly with customers, and use `NFTs` to create relationships
    with those customers. This will help eliminate the stranglehold that massive booking
    sites—like `Expedia`, `Priceline`, and `[Hotels.com](http://www.Hotels.com)`—have
    over the industry.


    When consumers begin to feel comfortable dealing directly with airlines, hotels,
    car rental companies, and adventure/experience companies, then they won’t need
    to rely on booking sites. And when these individual travel industry providers
    are able to offer customized deals to their customers—often through `NFTs`—then
    consumers won’t feel like they need to make a purchase through a site where these
    providers are pitted against one another in order to feel they are getting a good
    deal.


    Another great advantage for consumers will come from building a peer-to-peer environment
    in which recommendations in the travel industry can be confirmed as organic and
    genuine. As the landscape currently stands, the travel and leisure business is
    inundated with “advertorial” content, and recommendation/review websites that
    masquerade as providers of original, unbiased content, but which in fact make
    money by generating referrals to certain travel companies, and/or that skew their
    editorial recommendations in exchange for compensation. These websites often make
    it very difficult for consumers to tell if a review or recommendation is objective
    or not. This leaves consumers wary and unsure if it’s possible to find any source
    to trust. But peer-to-peer communities can change this.


    When things like recommendations, discounts, travel policies, and rewards are
    tokenized and/or connected to the blockchain, travelers can feel comfortable sharing
    information with one another—and the sources of deals, discounts, and recommendations
    can be clearly verified and even sold on the secondary market. A travel and leisure
    provider can even issue a discount as an `NFT`.


    What are the circumstances of this discount? Who is eligible for it? Everything
    is clarified for consumers right there on the blockchain.


    The flow of `NFTs` and tokens can also work as incentives. For example, imagine
    a website where consumers could go to leave feedback and recommendations for their
    fellow travelers. With every review written or tip given, the reviewers would
    receive a digital reward. It could be an `NFT` that would grant a discount from
    a hotel or airline company, or it could be a `crypto` issued by the review site
    that could then be used to make a travel-related purchase. Prospective travelers
    could pose questions about a locale, and those answering the questions would also
    receive digital rewards. This would create incentives for travel experts to regularly
    contribute to the site to earn digital rewards, and visitors to the site would
    feel that they had a trustworthy source of info with reviews provided by authentic
    travelers—not through secretly sponsored content. Meanwhile, the company rewarding
    these organic reviews will be able to obtain a level of knowledge about visitors
    and contributors with a degree of specificity not possible in other formats.


    Another way that blockchain-based products will be able to assist the travel industry
    is when it comes to reward programs—specifically reward points programs. A longstanding
    feature of the airline industry, travelers are by now quite accustomed to earning
    free miles and upgrades based on their frequent flyer points. Yet, what happens
    when an airline goes out of business, or is purchased by a competitor? Or what
    happens when a consumer simply wants to use their hard earned miles for things
    other than flights? In too many cases, the miles/points are lost forever and never
    redeemed. (Or, in some cases, they become redeemable at a competitor airline which
    the traveler dislikes.) But what if, instead of each airline issuing its own points
    under whatever conditions it sees fit, the airline industry agreed to settle on
    a `crypto`, `NFT`, or other blockchain backed product? (“AirCoin” and “MilesCoin”
    seem like pretty good names!) Consumers could book flights without being concerned
    that their points might one day be lost. Because points were safe and redeemable
    forever, travelers would be inclined to fly even more than they already do, confident
    that the perks they’d earned would always be secure. And what if a traveler suddenly
    decided they preferred traveling by train or boat? They would be able to go onto
    an exchange and sell or barter the miles they’d earned in a peer-to-peer trading
    network. Again, everybody wins!


    In the days ahead, travel brands will be uniquely positioned to cash in on `NFTs`—if
    and when they’re willing to make the leap to a world that’s underpinned by NFT
    technology.


    # Health care


    Most people agree that the United States health-care system has problems. Americans
    spend more on health care per capita than any other nation, but study after study
    shows that Americans do not receive the best care or have the best health outcomes.
    Health-care costs and health insurance prices rise year after year, and no one
    seems to know what to do about it. While many Americans believe the health-care
    system needs a complete overhaul, virtually everyone will agree that it could
    be made more efficient and less confusing.


    Because this is an industry about which so many people have passionate opinions,
    it’s very exciting to know that it too can be changed by the rise of blockchain
    technology, and potentially improved in many ways.


    The problems with the health-care industry are multifaceted, but to understand
    how they can be corrected through block-chain technology, we need to outline them
    in very general terms.


    The biggest issue with health care is probably cost. “Why does our health care
    cost so much?” is the frequent refrain. Pressed to be more specific, consumers
    will usually articulate their concerns as: “Why are hospital bills so high, and
    why does my health insurance premium increase so astronomically year-over-year?”
    (Others still voice frustration with the fact that these problems seem most acute
    within the United States, but not in many other developed countries.) To answer
    this—and to see how blockchain can help—let’s look at it from the perspectives
    of the different players involved. We’ll begin with the hospitals themselves,
    since they’re the ones that set prices.


    Here’s a thought experiment: Imagine you win the Mega Millions lottery or the
    Powerball, and suddenly come into hundreds of millions of dollars. You think your
    town could use a better hospital, so you decide to spend your winnings to create
    one. You build a fancy new hospital building, fill it full of top-of-the-line
    medical equipment, and populate it with skilled doctors from all the top medical
    schools. Then, on opening day, you open the doors of your hospital and prepare
    to start doing business.

