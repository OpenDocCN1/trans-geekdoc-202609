  trans: '


    ## 利用技术进行社区内交流


    动态 NFT（Dynamic NFT）最令人兴奋的特性之一，是在你的粉丝社区内建立联系，这不仅有助于提高品牌知名度，还能帮助购买你 NFT 的人们从“客户”转变为“品牌粉丝”。几乎每个品牌都希望培养粉丝社区并帮助他们成长。通过帮助确保
    NFT 成为解锁品牌社区准入许可的“钥匙”，我们确保了粉丝之间能够建立联系，并帮助该粉丝群不断壮大。


    显然，这里包含很多内容，而且动态 NFT 菜单中的每一个部分并不适用于我们合作的每一位合作伙伴。但如果你想跳过前面，本书的第四部分包含了关于不同行业如何使用（以及未来如何使用）NFT
    的更多具体示例。


    ## 共同赋能艺术家、创作者和投资者


    我目前工作中最令人兴奋和满足的部分之一，是深知我们将成为一种强大新力量的一部分，帮助人们为他们热爱的事情获得报酬。NFT 将允许一波新的艺术家和创作者通过艺术维持生。与此同时，艺术家和品牌将能够利用技术，以仅仅一代人以前无法想象的方式与粉丝互动。与粉丝、消费者、艺术品所有者建立直接且个人化的关系。


    NFT 将为艺术品创造一个全新的“层”。也就是说，我们将在与艺术作品相关的产出列表中添加一个完全全新的项目。这里有原作、有作品的摄影复制品、有作品签名的印刷品、有官方授权的复制品等等——而现在，有了
    NFT。


    ![images](img/f0015-01.jpg)


    艺术家大坂直美子（Naomi Osaka）已以 NFT 的形式发布了许多作品。


    这立即为许多艺术家和内容创作者带来了新的收入来源，因为这给了他们新的可以销售的东西。例如，一位画家画了一幅画。她可以出售实物画作，可以作为版权持有者对画作的各种复制品授权，而现在她还可以出售
    NFT。


    有些作品是数字化创作的，对于数字艺术家来说，要证明他们的“原作”与画布上油画的画品一样合法、独特且具有销售价值，有时一直是一项挑战。在这里，赋予数字艺术家出售其作品的完全独特的
    NFT 的能力（其原创性和来源已内置在区块链中），能够为艺术家带来有意义的变革性变化。


    虽然画布上的油画可能仍会遇到伪造品和假品的问题，正如我们所指出的， NFT 将向公众呈现一件完全“无法伪造”的作品。


    如果你仔细考虑，与可以被伪造的同类实体艺术品相比，这可能会增加 NFT 的价值。媒体上充斥着关于艺术品伪造者欺骗专家的惊险传闻。每当有一幅画作或类似的实体艺术品待售时——即使是由非常有声誉的公司提供的——总存在作品可能不是正品的概率。我们从历史中知道，艺术买家总是在冒着风险。但如果没有风险呢？完全没有风险呢？这就是
    NFT 将带来的价值，这也是为什么 NFT 能够开出不带有那种“作品可能非真”的“内置”可能性的价格。这是一个实实在在的利益，它增加了 NFT 在收藏家眼中的价值。（想看……你可以成为实物艺术品的收藏家，并有理由确信你收藏的大多数作品是真品；或者你可以成为
    NFT 收藏家并绝对确定。听起来哪一个是更具吸引力的投资领域？）


    NFT 还通过消除艺术家与其客户之间的许多障碍和中介来赋能创作者。艺术家将能够直接向消费者出售 NFT。他们将仅受到任何形式公司控制的极小影响。政府控制也将非常有限。例如，地方性艺术审查的尝试在
    NFT 时代将不会长久；它们太容易地被绕过了。


    NFT 还将带来一个全新的审美和数字画布，创作者可以在此进行实验。只有在极少数情况下，发明或创新才能允许这种情况发生。摄影。电影和动态影像。数字摄影和数字画布。现在是
    NFT。随着每一个新作品的诞生，艺术家们利用技术创造了伟大的艺术。他们扩展了媒介本身，并以新的方式使用它。我们现在预测，未来十年将看到创作者、艺术家和品牌开始以我们现在无法想象的方式，将艺术品作为
    NFT 进行优化。从字面和比喻的角度来说，NFT 都是一个全新的画布，新一代艺术家将在上面学习绘画。


    这从 NFT 随时间演变的独特方面以及它们与其他 NFT 交互的能力中也能看到。因为它是数字的并由区块链支持，没有任何能阻止艺术家设计一种在每次出售、竞价、赠送给他人或继承时都会发生物理变化的
    NFT。同样，作为数字实体，NFT 具有与其他 NFT 互动的潜力。想象一个画布，生命开始时是一种颜色，但当所有者拥有同一位艺术家的另一个 NFT 时，它就会改变。当收藏家从同一个系列中一个一个购买
    NFT 时，收藏家的数字画布可能会继续更新和变化。也可能不会。这只是艺术家将拥有的有趣技术可能性之一。


    NFT 的兴起还将公平和民权等领域产生许多影响。其实现这一点的一种方式是打破艺术家目前的中心化接入点，这些点导致了非常同质化的格局，直到今天，许多多样化的声音似乎被排除在外。例如，根据
    2020 年 2 月发表在社会科学研究网络 (`SSRN`) 上的论文《艺术市场中的玻璃天花板》，拍卖出售的艺术品 96% 以上由男性创作。在利润最丰厚的艺术品销售中，女性艺术家的仍然非常少。纽约市立大学（CUNY）盖特曼学院
    2016 年进行的一项研究发现，纽约顶级画廊代理的艺术家 80% 以上是白人。当该项调查仅针对美国出生的艺术家时，发现 88% 是白人。同一项研究还发现，纽约顶级画廊的艺术家绝大多数来自少数几个选拔（且昂贵的）大学和学院，而这些大学几乎全部位于洛杉矶、芝加哥或大西洋沿岸。在性别、种族以及经济地理多样性方面，我们可以做得更好。坦地说，我们必须做得更好。如果艺术界对这种情况不感到深表羞愧，那么他们应该。NFT
    可以通过让艺术不再是由一个少数而封闭的精英群体策展的东西，来帮助积极变革的发生。


    '
- fmt: '

    Things will be better for art collectors too. NFTs will make art collecting possible
    for demographics who might never before have seen themselves in that role. Consider
    what (and who) one typically thinks of when the term “art collector” is used.
    It’s someone with the means to purchase fine art, but also more than that. It
    is someone who may be relying on expert “sherpas” to guide them to the work that
    is likely to be the best investment. It’s someone with the physical space to store
    the art that’s being purchased (either in an appropriately stately manse, or in
    a climate controlled storage facility). We picture a person in a living situation
    secure enough that they are not too worried that their collected pieces will be
    stolen off their walls. We picture someone close enough to the nexus of art sales
    that—should they decide to part with a work of art—a sale to many qualified potential
    buyers can be arranged.


    Contrast this with the world of the potential collection of an NFT enthusiast.
    Because the work is presented digitally—and can be purchased from anywhere, by
    anyone—the NFT collector does not need to live among connected coastal elites,
    or know the right places and people to buy from. Anyone, anywhere can discover
    the next great NFT artist online. And artists and entities selling NFTs will have
    no reason to turn down a transaction once an offer on a work is made. They may
    not even have that ability. (In the world of fine art, art dealers know that *who*
    has purchased a work by a living artist will have the potential to impact the
    price of subsequent pieces by the same artist. Thus, art dealers wishing to see
    the market value of a certain artist’s work ascend hope foremost that the work
    is purchased by a leading museum. If that cannot be accomplished, a leading collector
    who has already purchased many works by canonical artists is next-best. At the
    bottom of the list would be a first-time collector who has never before bought
    a work of art. There are reliable tales of art dealers simply refusing to sell
    paintings at all to collectors who—in the dealer’s opinion—lack an adequate preexisting
    collection.) It’s easy to see how the rise of NFTs will upend this utterly. There
    will be no “insiders” and “backroom dealers” in the art world deciding who is
    worthy of purchasing something.


    The impact of this for consumers who would like to invest in art—but who are new
    to art collecting, or happen not to live in a physical location with a strong
    art community—is going to be an important leveling of things in more ways than
    one. Buying art can be a way to create intergenerational family wealth. It can
    be an important component of achieving the American dream. And NFTs can potentially
    open up this entirely new asset class for working families. Will we see more NFT
    sales like Beeple’s, soaring high into eight figures? Of course. But we’re also
    seeing many NFTs for sale by artists in the three- to four-figure range. Because
    of their connection to the blockchain and the other potential advantages that
    NFTs bring, it’s very possible that these works of art will gradually appreciate
    alongside their more astronomically-expensive cousins. And even a little increase
    in value has the potential to make a meaningful long-term impact on the family
    that acquires them. In short, NFTs will take a mode of investing typically available
    only to the very wealthy and help it become something more and more people can
    afford.


    This is also an area where it’s a good bet that future innovations are going to
    help collectors out a lot. Peer-to-peer and the nascent work being done by online
    curators is showing some of the exciting things that are going to be possible
    in this area. We’ve only to wait and see.


    One particularly interesting question being answered by lots of smart and creative
    people right now is: “Once you’ve bought an NFT, what’s the *best* way to show
    it off?”


    Just as in the world of tactile art, one of the best parts of owning a piece of
    art can be the cultural capital of letting people know you have it. (I’ll note
    that some prefer to collect quietly, simply letting their artwork appreciate quietly
    and out of sight. That’s a fine model too. I’m not here to judge!) But for those
    who want the thrill of display to be part of the NFT-buying experience, a vast
    array of options are going to be developed in the years ahead. Some may be subtle.
    Some may be direct and garish. Some may require technical knowledge. But virtually
    anyone who purchases an NFT at any price point will be able to find a fun and
    exciting way to share their new investment.


    In the next section, we’ll continue to look at the positive advantages the NFT
    revolution will bring for everyone across the board—and also examine how, if we
    do things the right way, NFTs will avoid some of the pitfalls that have dogged
    cryptocurrency.


    # PART THREE


    ## Paths Forward for the NFT


    The widespread adoption of NFTs has the potential to be revolutionary across industries,
    and to spark change at a level not seen since the introduction of cryptocurrency
    and `Bitcoin`. The impact of NFTs also has the potential to be even more powerful
    because of the way NFTs can preserve cultural artefacts, data, and digital information—essentially
    for all time.


    NFTs are also poised to be revolutionary because digital partnerships allow almost
    anyone—or any brand—to create one.


    Minting your own cryptocurrency usually requires a significant investment of time,
    technology, and money, and the use of a crypto exchange to facilitate the currency’s
    launch. Yes, a whole lot of cryptocurrencies have been issued since `Bitcoin`.
    (It’s been estimated by industry leaders that there were approximately four thousand
    cryptos as of early 2021.) However, that figure utterly pales when compared to
    the number of NFTs that are being created now, and will be created in the future.
    As brands begin to understand the benefits of selling their content as NFTs—and
    using NFTs to interact with, and build bridges to, their customer bases—we’re
    going to see something close to an exponential explosion of the amount of NFTs
    being used across disciplines and industries. At the corporate level, there’s
    reason to believe that NFTs may become as integral to marketing departments as
    social media is today. (Just as marketing departments across the country had to
    add a “social media rockstar” in the early 2000s, it’s likely that they’re going
    to be posting ads for “NFT rockstars” in the very near future.)


    ![images](images/f0016-01.jpg)


    *Anonymous crypto-artist Pak has been a leader in early innovation for the NFT*.


    NFTs are easy to create, they’re very useful, and there are going to be lots and
    lots of them very soon—in just about every area of our lives that involves something
    digital.


    Yes, major works of art like *Everydays: The First 5000 Days* will enjoy special
    advantages as NFTs, but so will smaller and more accessible purchases. With everything
    moving to digital, collectibles like trading cards will make the transition to
    NFT very soon. Even youngsters with more modest spending power are going to be
    able to enjoy the excitement that comes along with knowing they alone own the
    unique copy of something.


    Another important part of the NFT path forward will be forged by the artists themselves.
    How many times have creative types heard that old chestnut, “We can’t afford to
    pay you, but it’ll be great exposure.” Well, with NFTs, payment and exposure *will
    go hand in hand*. Creative works will be unique objects when sold as an NFT, but
    that doesn’t mean that the art itself cannot be displayed while it is in digital
    form. The more that a work of art is viewed, the more the chances of it going
    up in value. So the owner of the NFT gets to enjoy their digital asset appreciating
    in value, while still being able to exhibit the physical art to everyone else
    as they see fit. It’s a two-fer!

