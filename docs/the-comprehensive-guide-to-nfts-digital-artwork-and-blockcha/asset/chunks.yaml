- fmt: '

    Another way that blockchain technology could make this kind of process less vulnerable
    to corruption would be to engage smart contracts. Let’s say that the elected official
    has a list of “dealbreaker” requirements around the project. (Overall cost, materials
    to be used, timeline, number of local workers to be hired, etc.) The elected official
    could design a smart contract that automatically rejects any bid failing to meet
    these minimum requirements. But more excitingly, the smart contract could be designed
    to automatically `accept` any bid that `does` meet a certain set of criteria.
    In this way, the reasons for accepting one bid over another would be perfectly
    transparent. There would be no question as to `why` they were accepted, because
    they `had` to be accepted once offered.


    To be sure, the above example does not prevent `all` avenues for corruption within
    the procurement process. (A corrupt official could still secretly tell his friend
    the threshold in the smart contract that would automatically win the contract,
    for example.) But it still takes a monumental step forward in eliminating the
    possibility of anything untoward occurring in the process. And in addition to
    things like procurement, this system could be expanded to any other government
    function where the allocation of money is troublingly opaque. The bestowing of
    grants and charity dollars, the funding of neighborhood infrastructure, and the
    disbursement of social assistance money could all occur with the central information
    made public on the blockchain.


    ## Registries and Ownership


    The other way that this technology would make governments massively more efficient
    and less corrupt is when it comes to registries for companies, land, homes, and
    all other forms of government-tracked ownership.


    All around the world, corruption occurs because it is very difficult for the press
    or for government watchdogs to learn who owns businesses and land.


    Let’s say there’s a neighborhood in a particular city with great demand for gas
    stations. However, the local zoning laws do not permit gas stations to be built
    on most of the existing lots. Members of the city council have the power to change
    the zoning on a lot. In this scenario, a corrupt member of the city council might
    quietly purchase a couple of houses in this neighborhood and re-zone them for
    gas stations, doubling or tripling their value. Then when he left office—or, if
    he were particularly brazen, while still in office—he could sell the houses to
    a company that builds gas stations.


    Frustratingly, scenarios like this occur all the time, because it is difficult
    to easily access information regarding who owns certain assets. But here again,
    help is on the way! Blockchains can create everlasting records of who owns certain
    properties. Any change in ownership will be recorded on the block-chain, so it’ll
    be easy to look up who bought something, who sold it, and when. Blockchain can
    be used to create central registries for property and business transactions that
    can easily be cross-checked for local politicians and elected officials. The fact
    that ownership records are now being tracked will have a cascade effect, dis-incentivizing
    other types of crime. Using properties or businesses to pay bribes, return favors,
    or launder ill-gotten money will become much rarer. Would-be criminals will certainly
    want to think twice before keeping this kind of transaction on the blockchain.


    This kind of public property record can also—in some situations—keep the government
    from “pushing the little guy around.”


    The issue of “land rights” is one about which citizens can become extremely passionate.
    When it comes to who owns what land, there can be a frustrating amount of ambiguity.
    Who has the rights to hunt or fish on land, or to access the natural resources
    resting on or running through it, is not always clear. But by putting this information
    into a central, searchable database where title registries are on the block-chain,
    a secure, updated, and publicly verifiable resource can be created. People can
    easily look up where property lines fall, and know what their rights are for their
    property. This will eliminate ambiguity, frustration between neighbors, illegal
    hunting and poaching, and more.


    Nascent rumblings are already underway in certain states. In 2019, Florida created
    a blockchain task force to study how state, county, and municipal governments
    could benefit from blockchain-based recordkeeping.


    Back in the day, paying your property taxes in Bitcoin seemed like it would be
    a radical change, or a far-distant “science fiction” future. Now we’re already
    envisioning futures where governments will be open and freer from corruption,
    and where ownership will be clear and searchable. It’s just one more way that
    blockchain technology will become a powerful agent of change and progress.


    ## Supply chain


    Businesses that work in supply chain logistics bringing products to market can
    also see efficiencies from incorporating blockchain technology.


    There are several different definitions of “supply chain” and different ideas
    about who technically operates in this space. We’re not here to split hairs, and
    we can go with a “big tent” definition, because there are so many related areas
    in which blockchain technology can be useful for this space.


    Those in the supply chain need information. They need to know where goods are
    that have already been sent “down the chain.” They need to be able to see up the
    chain. They need to know what the situation is at the retail consumer market endpoint.
    They need to ensure that their own movements and updates are synchronized with
    the market.


    For these reasons, supply chain work revolves around trust. Can I trust the information
    I am getting about the status of the chain? Do I trust a vendor or partner enough
    to take their word implicitly? Should this (`could` this) trust be automated?


    Up and down the blockchain, there are tools to create trust and/or verify facts
    for supply chain businesses. When a warehouse worker inspects goods on a pallet,
    he does not know if the goods inside the packaging necessarily match what is presented
    on the label. He also doesn’t immediately know the history or “story” of that
    pallet. But what if the worker could scan a code on the side of the pallet and
    access the pallet’s entire shipment history? That `NFT` would give instant access
    to the pallet’s entire shipment history. It would tell the worker where it had
    been and when, and who was involved when it was transferred. If any “pinch points”
    or problem areas emerge, the data reporting it will have 100 percent integrity.
    Nobody will be able to fudge what happened when something fails to be delivered
    on time.


    For particularly high-value items, shipping with blockchain technology will add
    security. Unique identifiers on packaging can help ensure that nothing is stolen
    or lost during shipment. Turning in a false manifest—or using a fake inventory
    list—will not be possible, because the real list will be tied to the blockchain.
    (There are already some real world examples of this. For example, De Beers has
    built a block-chain-based supply chain tracing program for its diamonds.)


    This technology is also going to come in handy in situations where provenance
    and history are important. For example, the origin countries of fruits and vegetables
    can also be tracked in this manner. (Did those fruits and vegetables go through
    a country with polluted air? Etc.) And shippers who ship goods from (or through)
    countries with a high rate of illegal activity or contraband will have less to
    worry about when it comes to being regulated or searched by the government. That
    information will already be on the blockchain.

