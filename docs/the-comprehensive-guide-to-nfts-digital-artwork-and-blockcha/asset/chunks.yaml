    *Through blockchain?* I thought. *How? Why?* But the more he told me, the more
    it became clear that there had been a method to his madness! The blockchain-backed
    aspect of the purchase had opened up new business possibilities. As he explained
    to me, Stephane had used the St. Regis as an asset to back the launch of a new
    crypto—the `Aspen Digital Token`, or `AspenDigital`—which let qualified investors
    take minority stakes in the property itself. Ultimately, this allowed about 20
    percent of the hotel to be purchased and owned entirely by these minority investors.
    The other 80 percent stayed in the possession of Stephane’s company. But that
    wasn’t all. Holders of `AspenDigital` tokens were welcomed into a special rewards
    and privileges program that activated whenever they visited the property. Owners
    of even a small amount of `AspenDigital` would receive 20 percent cash back on
    all money spent during their stay at the St. Regis, and large coinholders could
    receive as much as 50 percent back.


    I was blown away by what Stephane had done here. Not only had he democratized
    the investment process; he had allowed for even small players to own powerful
    investments that were 100 percent supported by blockchain. And in the same stroke,
    he was creating entirely new interactions with the property itself.


    But, as I learned in the days to follow, Stephane wasn’t yet finished . . .


    When the COVID-19 pandemic hit, Stephane and I saw early-on that restaurants would
    be under tremendous strain, and many would simply not survive. This time, Stephane
    and I worked together, in a *pro bono* manner, to find ways that digital tokens
    could be used not only to support restaurant owners, but also to create a trickle-down
    effect that would reach the kitchen staff and gig economy workers. We developed
    a simple exchange by which a customer could enter a restaurant and pay $500 for
    a digital token that could be exchanged for $1,000 worth of dining in the future,
    after COVID-19. The extra $500 functioned like an advance that helped to keep
    kitchens afloat through the pandemic, and the model resulted in the creation of
    a new form of crypto focused on the restaurant community.


    Needless to say, I became very intrigued by what I saw happening in blockchain
    and crypto—especially because it was going above and beyond what most people think
    of when they visualize a blockchain-backed transaction. These were innovators
    doing entirely new things and I started to explore how it might intersect with
    my world at DMA United.


    Fashion, art, professional sports, social justice—all of this stood to be impacted
    by these new tools. In May of 2020, the concept of digital collectibles and unique
    brand ownership experiences led me to pilot `Truesy`—an NFT marketplace that really
    hit DMA United’s community in its “sweet spot” where design, branding and fashion
    meet.


    Now you know who I am. Next, I’ll explain a little more about why I think blockchains
    are the best solution for the problems of today . . . and of tomorrow.


    ## Blockchain and the problem of provenance


    Blockchain is the technology that makes the NFT revolution possible, so understanding
    it is key.


    Oftentimes, the easiest way to wrap your head around a complicated new invention
    is to start with the question: “What problem was this designed to solve?” When
    it comes to blockchain, the answer is the problem of provenance. That is, the
    history of ownership.


    Blockchain is a digital “living ledger” that grows each time it occurs. Blockchain
    is a digital “living ledger” that grows each time it occurs. Blockchain is a digital
    “living ledger” that grows each time it occurs. Blockchain is a digital “living
    ledger” that grows each time it occurs. Blockchain is a digital “living ledger”
    that grows each time it occurs. Blockchain is a digital “living ledger” that grows
    each time it occurs. (Wait, let me streamline this section for clarity).


    To best understand the technology, it may be helpful to consider blockchain’s
    most prominent example, which is `Bitcoin`. The blockchain that runs `Bitcoin`
    was created by a mysterious person (or persons) known as `Satoshi Nakamoto`. In
    creating his cryptocurrency, `Nakamoto` devised a system such that the record
    of all `Bitcoin` transactions could be decentralized and maintained by a network
    of computers around the world that were actively `mining`.


    We use the word `mining`, but what these computers are actually doing is solving
    a series of complex mathematic problems that then maintain the chain of transactions.
    (Why would anyone do this `mining`? Because the miners are rewarded periodically
    for this work with new `Bitcoin` of their own.) There are some downsides to this
    model, such as environmental implications—which we’ll address—but as a system
    for maintaining the integrity of `Bitcoin`, this mass collaboration/verification
    model works well.


    `Bitcoin` solves the problem of provenance, but it also does so much more. `Bitcoin`
    are not physical. They’re not made of a substance that can be used for anything.
    They certainly can’t be redeemed for gold (or other valuable metals), like some
    hard currencies can. Many of the advantages of `Bitcoin`, however, are in other
    things that they can’t do. Namely, they can’t be faked in any-way. There is no
    such thing as a fake `Bitcoin`. Paper currency can be (and widely is) faked. When
    you pick up a $100 bill, you have no idea of its origins. You don’t know if it
    was born in the US Mint or in a North Korean forgery operation. That information
    is not available to you as the person touching the currency. But with `Bitcoin`,
    that information is not only available, but it’s an integral part of that piece
    of currency.

