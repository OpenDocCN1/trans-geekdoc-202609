  trans: '


    对于艺术家和内容创作者来说，另一个优势将是他们获得报的方式和时间。在历史模式下，艺术家只有在他们创作的单件艺术作品首次出售时才能获得报酬。像画家这样的艺术家在大多数情况下将保留出售作品复制品的权利——例如根据他们的绘画制作的海报——但在未来任何一次将他们的绘画从一个收藏家转卖给另一个收藏家的情况下，他们将无法获得任何新资金。


    ## NFT 的出现


    通过 `NFT`，创者可以在区块链本身中植协议，规定每当 `NFT` 出售或转售时，艺术家都有权获得销售额的一部分。或者一份新闻公告。或者艺术家可能希望指定的任何条件。


    NFT 还让艺术家和创作者能够完全数字化的方式出售作品，并且在他们选择的情况下，不需要通过中间机构。如果创者愿意，他们可以约定在数字画廊中展示他们的 `NFT`，以让作品获得更多关注，但没有什么能阻止他们直接从自己的网站出售作品，并保留那些本该属于画廊或销售代理的百分比。NFT
    还会消除艺术购买的匿名性。艺术家可以知道是谁购买了他们之前的某件作品，和/或目前是谁拥有它。然后他们可以利用这些信息，在有新作品出售时与收藏家进行跟进。（在一个仍在
    `COVID-19 病毒` 后影响中震荡的世界里，无需亲身前往画廊即可买卖艺术品的优势无需多言。）


    对正在进行的 NFT 革命的某些批评者表示困惑，为什么收藏家愿意为一张作为 `NFT` 出售的数字猫 `GIF` 支付数十万美元，而同一个 `GIF` 可以在网上免费地复制和粘贴。这种“批评”实际上强调了
    `NFT` 艺术品对艺术家的益处。收藏家购买的是数字艺术品 . . . 但他们不仅购买了数字艺术品。他们购买的是特定的一个副本。


    想象物理画布上有两幅看起来完全相同的画。它们是如此相同，以至于每一笔看起来都完全一样。而且，使用的画布和颜料也是相同的。唯一可见的区别是，其中一块画布是由一位老大师在三百年前创作的，而另一块是由一位伪造大师使用古董工具和颜料创作的。大师创作的真品可能价值数百万美元，而伪作品的价值会低得多，尽管它几乎一模一样。为什么？归根结底，这是因为收藏家购买的是一位著名的老大师在那个特定时刻创作了这件作品的事实。这并不关乎两幅画看起来是否相同。其中一是由特定人在特定时间创作的，而另一幅不是。


    接下来，让我们看看 `NFT` 未来道路上最重要的转折点之一。比喻地说，它就在路前方。我们很快就必须决定走哪个方向。当我们做出那个决定时，它将对区块链本身产生巨大影响。


    ## 工作量证明与权益证明


    `NFTs` 最重要的选择之一将是它们选择依赖于利用 `Proof of Work`（工作量证明）模型的区块链，还是 `Proof of Stake`（权益证明）模型。如果这些术语对你来说很新，不要担心；我们现在就解释它们。


    `Proof of Work` 和 `Proof of Stake` 是不同的区块链技术。它们都允许在没有第三方协助的情况下对区块链上的交易进行验证。然而，尽管它们最终都达到了同一个点，但它们“到达”的方式非常不同。


    这两种模型都基于密码学。它们验证交易并确保区块链中的每项物品都维护其完整性。为了做到这一点，`Proof of Work` 使用计算机必须解决的独特数学方程。对于像
    `Bitcoin` 这样广泛使用的加密货币——它使用 `Proof of Work` 模型——这需要世界各地的大量计算机时刻工作。


