- fmt: '

    I think that NFTs have the potential to be explosively successful with musical
    artists because of the way they’re going to integrate these three areas—physical
    items, digital items, and experiences.


    In fact, I predict NFTs will entirely disrupt the music industry.


    ### Here’s how it might work . . .


    Using NFTs to create and issue tickets, the musical artist will sell tickets directly
    to fans for their upcoming concerts. These concert tickets will be both “pieces
    of art” in that they’ll be NFTs that the fans will own forever and can display
    proudly, but they will also function as keys to unlock further experiences between
    the fan and the artist. The NFT ticket will provide “proof of fandom” just like
    a T-shirt that you purchased at a concert proves to your friends on Monday that
    you went to the big show that weekend. But it will also do more . . .


    After the concert, the artist can use the NFT to keep in touch with the fans.
    The first way of doing this would be to allow NFT-holders to listen to or download
    a recording of the show they attended. And once the fan takes advantage of this
    download, they have started a digital relationship with the artist, and that can
    become much deeper.


    The fan’s NFT can unlock special information about the band. Multiple NFTs can
    serve to unlock different levels of rewards or experiences. You might get early
    access to the next album, or early access to front-row tickets during the next
    tour.


    If you’re the musical artist, you might have special luxury items or experiences
    you’d like to sell. For example, the guitar you played onstage during the last
    tour. A luxury, immersive retreat with yourself and just a few special fans in
    an exotic locale. But how do you identify the ultra-mega-fans who might be willing
    to invest serious money in these offerings? Again, you can use the NFTs-cum-tickets.
    A person who has an NFT ticket from every show on your last tour might be willing
    and able to unlock these special ultimate experiences.


    Additional benefits of this system will be that agencies that regulate the selling
    of physical tickets can be cut out entirely, eliminating the “middleman” and potentially
    cutting costs for performers and fans. NFTs can also eliminate scalping and other
    illegal dealing in concert tickets.


    NFTs can help musical artists identify potential new fans (and even help the fans
    themselves notice that, hey, they’re really digging this great new band they’re
    listening to). Let’s explain how this might work.


    So far, we’ve only been looking at NFTs being acquired through monetary transactions.
    But what if there were *other ways* that NFTs could be acquired or unlocked? Yes,
    a musical artist might provide a certain kind of NFT to fans in exchange for a
    cash payment, but what if instead the artist gave their fans an NFT in exchange
    for a certain activity. For example, let’s say that a consumer listens to an artist’s
    new song 100 times on a music streaming service. After the hundredth listen, the
    consumer receives a notification from the artist letting them know that since
    they’re such of a fan of the song, they’ve been gifted an NFT. This NFT might
    unlock benefits from the artist such as access to new music, an invitation to
    a gathering for new fans, or free tickets to an upcoming local concert. From the
    artist’s perspective, taking this first step toward fans with a “reward”-NFT can
    be a great way to turn potential fans or casual fans into diehard ones! This also
    has implications for the fandom community itself. Everybody likes to brag about
    being the first to discover a great new musical artist. (“When did *you* discover
    them? Oh really? Can you prove it by showing me the NFT for your first hundred
    listens?”)


    In the future, music fans will go from purchasing an album, song, or concert ticket
    to buying ownership of a fandom. This ownership concept will bring the sense of
    a special club along with it. The traditional “signals” one might employ to show
    that you’re a part of fandom will still be there, but the route may be different.
    For example, a teenager might still wear the newest T-shirt promoting their favorite
    band. But the story of obtaining that T-shirt won’t be “I ordered it online” or
    even “I went to the concert and bought it in the merch tent.” Instead, the fan
    will have unlocked access to the shirt through the collection of NFTs that demonstrate
    different levels of commitment to the band.


    ### Luxury fashion brands


    Fashion brands stand to benefit tremendously from the implementation of NFTs,
    especially as their industry comes to rely more and more on e-commerce. Fashion
    and luxury brands thrive on many of the elements that NFTs help make possible,
    such as exclusivity, rarity, and special invitation.


    Fashion brands strive for credibility with consumers. They desire wide name recognition
    among consumers, yet at the same time operate through creating a culture of exclusivity.
    Fashion and luxury consumers want items that are trendy and well-made, but they
    also want things that not just anybody can get.


    “Luxury” captures an attitude toward the world. It puts a primacy on quality,
    but is also used to express the lifestyle goals and priorities of the purchaser.
    Those who acquire and wear luxury fashion are telling the world that they have
    wealth, and that they have access to exclusive products, but they are also broadcasting
    that they have certain priorities and views about the world. In this way, it may
    emerge that the most expensive goods/brands are not always the most coveted.


    ![images](images/f0019-01.jpg)


    *Supermodel Kate Moss sold a series of NFTs featuring her depicted in a variety
    of poses*.


    Yet what *does* remain coveted is being “in the know,” “high tech,” “connected
    to exclusivity,” and “ahead in the game.”


    Luxury fashion brands are already working to connect their products to exclusive
    experiences. NFTs are going to take this and absolutely explode the possibilities
    surrounding it.


    #### Here’s one example of how it could be done . . .


    Panerai is a luxury Swiss/Italian wristwatch brand, owned by the Richemont Group.
    In 2019, they announced the launch of a diving watch named for the world-champion
    freediver Guillaume Néry. In terms of exclusivity, the watch would be priced well
    into five figures, and would be offered in an extremely limited edition of just
    fifteen watches total. That’s pretty exclusive, but Panerai wasn’t done. To top
    it off, purchasing the watch would entitle the owner to a diving lesson with Néry
    himself.


    So, let’s think about what this means. If you know about high-end watches and
    you encounter someone wearing the Panerai Néry, then you know that 1) have money,
    2) are connected enough to obtain a watch issued in such a limited edition, and
    3) have *been invited to* take diving lessons with one of the world’s greatest
    living divers.


    Those italics are important. Some people purchasing the watch in question might
    not wish to try diving personally. They might simply wish to have the mystique
    accompanying their purchase, or they might only like the look of the watch.


    But what if watch collectors *had* to have successfully completed the experience
    in order to gain access to the watch?


    And what if that was verified by an NFT? Consider how exclusive it would be then!


    When we encounter someone with an exclusive luxury brand piece, there are many
    possibilities around how they obtained it. Maybe they were a regular customer
    at a boutique, and have been clued-in to new arrivals. Maybe they have a connection
    at the brand itself, or know someone who works there. Perhaps they are an important
    influencer, and the brand is paying *them* to wear the piece. There are many different
    scenarios under which the consumer obtained the item. Almost all say something
    generally flattering about the consumer, but we don’t know precisely which one
    is at play.

