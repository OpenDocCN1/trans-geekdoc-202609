    在寻找 NFT 领域的合作伙伴或与此建立互利关系时，总括的原则是寻找那些了解该领域、对产品充满热情，并且打算长期经营的人。每当有像 NFT 这样的新创新事物进入市场时，投机分子就会就会蜂拥而上，试图利用形势获取短期利益。令人沮丧的是，这些投机分子往往只想赚取快钱。他们对数字领域并没有真正的热情，而且在该领域缺乏经验。那么，你如何能确定自己交易的是正确类型的供应商呢？我们并不是来这里提供具体建议的，但我们可以强调一个重要的词：社区。


    在这个领域工作的人们之间存在着一种深层且真实的社区感。他们共同拥有创新的热情，熟悉行业术语，并知晓 NFT 的去向。这个社区中的成员对构建长期事物感兴趣，那些经经久远的东西，以及能够带来重大变革的东西。


    任何仅仅向你的品牌强调通过跳入 NFT 可以赚到快钱的人，可能都在提议一种你并不想尝试的跳跃。


    ## 投资将整合 NFT 的业务


    当一项新技术出现时，企业和消费者一样，会以不同的速度并遵循可靠的模式线来采用这项技术。始终会有：


    *   先驱/前沿采用者

    *   早期采用者

    *   大众采用参与者

    *   “拖延者”


    无论我们讨论的是打字机、计算机还是蜂窝技术，当具有通用性应用的新创新出现时，企业的反应几乎总是会让它们落入这些类别中。


    在某些情况下，处于或接近前沿可以为公司带来巨大的业务优势。在另一些情况下，采用这项新技术并不会给公司带来竞争优势，甚至可能是一项没有产生实质优势的支出——但为了维持基本的竞争力，必须实施。


    **先驱**是那些经常在行业内开发新技术（或该行业的某个子领域）的人。这些先驱将拥有特殊知识，并在任何其他人之前成为技术的实施者。他们的大部分工作发生在“幕后”。当先驱取得新突破时，主流商业界（以及普通大众）尚未意识到发生了什么。


    **早期采用者**是那些能够立即看到新技术所提供的业务优势，并尽可能将其整合到自己业务中的人。他们可能占了转向新技术的人的 10% 到 15%。这些采用者是首批承担技术风险的人，但也是首批获得其所提供回报的人。这些人通常也是该技术的传教士。行业中的其他人会密切关注这些早期采用者，并利用他们的结果作为指标，判断何时是他们自己该迈出那一步的时候。


    **大众采用**发生在大多数企业决定某项新技术对他们是合适的，并且是安全、必要且可靠的时刻。当新技术进入市场时，这一类别的采用者代表了该技术的大部分消费者——约占
    70%。这一类别中的一些人是因为他们想要而做出改变，另一些人是因为他们觉得必须这样做，但当市场达到这一点时，意味着变化是不可避免的。这项技术将会发生。


    最后，在涉及这些事情时，总会有一小比例的**拖延者**。这一类别并不大，通常由那些正在挣扎并认为自己负担不起实施新技术的企业组成，或者愿意承担其业务/产品/服务在没有这项技术的情况下也能蓬荣发展的风险。（而且总会有几个自认不宣的卢德主义者，他们仅仅是为了反对变化而选择抵抗。）在很多情况下，我们看到处于这一类别会带来业务成本，而几乎没有优势。


    你（读者）和我（作者）知道 NFT 能带来的竞争优势，并且我们观察了 NFT 如何彻底改变大量行业。但许多投资者并没有我们的这些知识，仍然犹豫不决。这让你（作为读者）在投资早期采用者企业时拥有了优势。


    正如前面提到的，只有大约 10% 到 15% 的企业属于这一类别。然而，我们现在远未达到这些数字。仍然有大量机会去识别那些将从早期采用 NFT 中获得竞争优势的企业。按照目前的发展趋势，到
    2021 年底，如果我们能看到 2% 的企业以有意义的方式采用 NFT 技术，我们就已经很幸运了。进入这个游戏仍然有很大的空间。


    当你考虑对一家实施 NFT 的公司进行投资时，问问自己，该业务是否能根据书中概述的任何方法从中受益。NFT 是否会在企业（或艺术家）与其客户（或粉丝）之间建立更直接的联系？该企业是否拥有可能想要收集
    NFT 的粉丝群？新的业务效率是否会被释放，区块链是否会增加价值？


    我们处于一个不断演变的空间，因此要寻找不断发生的变化和更新。NFT 几乎会有一些连我们这些在最沿工作的人都尚且不知的用途。（再次强调，这是好事！）当你看到一家早期采用者企业提议以一种新或新颖的方式使用
    NFT 时，他们可能真的发现了该技术的一个重要新应用。你将不得不进行自己的尽职调查并相信你的直觉。


    无论你选择在哪里投资，与领先于潮流的企业建立联系是你应该所在的地方。那些愿意双脚跳入 NFT 世界的人将看到巨大的竞争优势。


