  trans: '


    艺术世界的监管和监测人员关注的是防止一组非常特定的犯罪。NFT 的历史将与 `blockchain` 绑定，因此伪造（以及欺诈和冒充）将不再是一个问题。（正如前面提到的，有少数艺术家声称他们的受版权保护的作品在未经许可的情况下被转换为
    NFT。然而，这些情况非常罕见，并且可以迅速解决。）


    更棘手的问题是洗钱，这日益成为艺术市场监管机构的首要任务。精细艺术品有多种方式可以将“黑钱”（例如来自毒品交易或其他犯罪集团的资金）转化为“干净钱”。例如，持有“黑钱”的人找到一家不问任何问题就接受现金的拍卖行或艺术品商。他们购买一件艺术品，然后立即转手以大致相同的金额出售该艺术品。现在他们有了这笔艺术品销售的收据，这为他们获得资金的方式提供了一种“合法”的方法。一些洗钱者使用了这种手段的变体，例如用黑钱购买艺术品，然后利用其价值从金融机构获得干净钱的贷款。其他版本还包括简单地与买家通气抬高艺术品的价格，进行“回卖”，每次都将更多的非法资金带入合法交易。


    艺术世界的另一个主要关注点是价格操纵。（在之前的章节中，我们研究了 NFT 如何对此免疫。）此外，监管机构还在寻找可能在战争或恐怖入侵期间被盗窃或被“征用”的艺术品。这类别的艺术品之前可能从未作为“艺术品”出售过。这些物品可能只是被土匪或入侵士兵掠夺的文化古董。


    即使是最不精通技术的监管人员也能理解 NFT 是不会被伪造的。由于它们与 `blockchain` 的关联，将会有防止价格操纵的内置安全措施。而且，当士兵在战斗后抢劫博物馆时，NFT
    绝不会被掠夺。


    这留下了洗钱问题，这可能是监管机构关注 NFT 的重点。尽管 NFT 是以数字方式购买的，监管机构仍然对资金来源非常感兴趣。“你是如何获得购买 NFT 的资金的？”这将成为要的问题。NFT
    的买家需要准备好回答这个问题。


    如此。


    ## NFT 的分类与监管


    鉴于这些复杂的关注点和模糊性网络，未来几年 NFT 可能会如何被分类和监管？


    以下是我最好的猜测：


    决策不太可能是二元化的（即完全是此，要么完全是彼）。监管机构可能会决定，一个价值 12 美元的数字猫形式 NFT 与 `Christie’s` 出售的 6900
    万美元拼贴画 NFT 在本质上是不同的。


    监管机构还可能决定某些 NFT 不应被同等。仅作为物理物品相关的真实性证书的 NFT 可能不会视为证券。但对于那些向投资者提供明确增值承诺的 NFT——例如艺术品的代币化所有权——监管机构完全可能发现这些
    NFT 应该像证券一样受到监管。


    另一种很大可能是，用于向买家销售 NFT 的“营销语言”或“推销术”将决定它们如何被监管。例如，如果 NFT 作为收藏品推销给消费者，它们可能是安全的；但如果作为投资品进行推销，它们将受到审查。


    ## 潜在风险与合规性


    例如，如果 NFT 作为收藏品推销给消费者，它们可能是安全的；但如果作为投资品进行推销，它们将受到审查。


    （注：用户文本后半部分包含大量重复句子；我已根据“优化段落格式”的指令精简了核心逻辑。）


    例如，如果 NFT 作为收藏品推销给消费者，它们可能是安全的；但如果作为投资品进行推销，它们将受到审查。


