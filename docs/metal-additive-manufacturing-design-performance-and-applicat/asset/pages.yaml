    # 3.2. Microstructural Characterization


    The microstructure of the additively manufactured metal parts was investigated
    using a Phenom ProX instrument (ThermoFisher Scientific, Waltham, MA, USA) scanning
    electron microscope (SEM) equipped with both a backscattered electron detector
    (BSD) and a secondary electron detector (SED) for enhanced characterization. This
    combination of detectors ensured a comprehensive analysis of the microstructure.
    Figure 3a illustrates the microstructure of specimens fabricated with a low energy
    density. Large areas of unmelted powder particles are evident, indicating incomplete
    fusion with the surrounding material. These unfused regions contribute to surface
    irregularities and microstructural discontinuities, which could potentially have
    a detrimental effect on the mechanical performance of the final parts. To illustrate
    this point further, Figure 3a presents higher magnification SEM images of specimens
    produced with a low energy density (50 J/mm³). Unmelted particles are clearly
    visible within the microstructure. Conversely, as the energy density'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'during printing increased, the presence of these unfused regions diminished.
    Figure 3b,c, corresponding to energy densities of 100 J/mm³ and 150 J/mm³, respectively,
    demonstrate a significant reduction in unmelted particles. This improved melting
    efficiency translates to smoother surfaces and potentially enhanced mechanical
    properties.


    ![](img/7578a5220236942261475fd7af81489e_78_0.png)


    Figure 3. SEM images of the specimens: (a) low energy density (50 J/mm³), (b)
    medium energy density (100 J/mm³), (c) high energy density (150 J/mm³).


    # 3.3. Nanoindentation Creep Behavior


    In order to study the creep behavior with nanoindentation tests, the data collected
    during the holding stage of the experiment were used. The experimental data during
    the holding stage could be well-fitted with the following equation [16]:


    ```

    h = hi + a(t-ti)1/2 + b(t-ti)1/4 + c(t-ti)1/8   (8)

    ```


    where h is the indenter displacement during the holding stage; t is creep time;
    and hi, ti, a, b, and c are the best-fit parameters that came from Equation (8).


    The experimental data and fitted creep displacement and time curve for S1 with
    VED of 50 J/mm³ without nitridation during the nanoindentation holding stage are
    typically depicted in Figure 4. The red line represents the fitted curve according
    to Equation (8) and the blue dots show the experimental results. Furthermore,
    Table 4 shows the values of the best-fit parameters from Equation (8). It is clearly
    revealed that the fitted curve presents an almost perfect agreement with the experimental
    results for the ambient-temperature creep of the H13 additively manufactured hot
    work tool steel during the holding stage of the nanoindentation test. The best-fit
    parameters have been found with the aid of a command line-driven graphing utility
    (Gnuplot/www.gnuplot.info, accessed from 2 September 2022 until 15 December 2022),
    where the parameters that satisfy Equation (8) according to the collected data
    from the experiments have been calculated.'
