    # 3.3. Hardness


    A Vickers hardness test was conducted to examine the effect of the absence of
    a coating layer on material strength during the forming process of uncoated steel
    sheets. Hardness is generally known to correlate with material strength. Kim et
    al. [28] reported that the Vickers hardness of a boron steel sheet is approximately
    450 Hv after the hot stamping thermal cycle. Based on phase transformation tests,
    Li et al. [29] demonstrated that the Vickers hardness of boron steel is 459 Hv
    at a cooling rate of 30 °C/s and that the hardness increases proportionally with
    the rise in cooling rate. In this paper, Vickers hardness was measured using a
    SHIMAZU HMV-2R (Shimadzu Corporation, Kyoto, Japan) device under the condition
    of applying a load of 980.7 mN for 10 s. Figure 10 shows the Vickers hardness
    measurement results for both coated and uncoated steel sheets. To examine the
    effect of cooling pattern changes due to differences in contact conditions between
    the material and the die, hardness was measured in the top, wall, and flange areas.
    The hardness was measured seven times at 1 mm intervals. The overall average hardness
    of the coated and uncoated steel sheets was measured at 481 Hv and 513 Hv, respectively,
    with higher values observed for the uncoated steel sheets. Therefore, it was confirmed
    that uncoated materials are more advantageous for strength securement in hot stamping,
    which requires rapid'
