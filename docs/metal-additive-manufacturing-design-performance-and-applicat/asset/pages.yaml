    718 and Ti6Al4V alloys. In summary, there are few studies on the preparation of
    Ti6Al4V/Inconel 718 gradient materials by arc additive manufacturing; in particular,
    the discussion on microstructure and mechanical properties is relatively limited.


    The premise of preparing gradient materials is to prepare intact composite materials,
    so the microstructure and mechanical properties of composite materials often affect
    the properties of gradient materials. In the process of deposition, heat input
    will affect the microstructure and mechanical properties of composite materials.
    In this paper, Ti6Al4V and Inconel 718 wires are selected as Ti6Al4V and Inconel
    718 welding equipment, and the wire feeding speed of the two wires is fixed to
    prepare Ti6Al4V/Inconel 718 composite materials with different deposition currents.
    The effects of different deposition currents on the microstructure and mechanical
    properties of Ti6Al4V/Inconel 718 composites were investigated. By comparing the
    morphologies of the intermetallic phases in the composites under different deposition
    currents, the causes of the crack sections were analyzed. In addition, the microhardness
    of the samples prepared by different deposition currents was evaluated. It can
    expand the application field of arc additive manufacturing direct deposition Ti6Al4V/Inconel
    718 composites.


    # 2. Experimental Details


    The experiment adopts a single arc deposition system, which mainly includes a
    TIG welding machine, servo motor mobile platform, and wire feeding mechanism.
    The working principle is shown in Figure 1. The Ti6Al4V and Inconel 718 wires
    are heated by an arc heat source. The two wires are placed on one side and the
    wire feeder can achieve different wire feed speeds. The system uses 99.999% high-purity
    argon as the protection gas.'
