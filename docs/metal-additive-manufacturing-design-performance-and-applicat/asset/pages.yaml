  md: '# Metal 3D-Printed Bioinspired Lattice Elevator Braking Pads for Enhanced Dynamic
    Friction Performance


    Nikolaos Kladovasilikas 1,*, Eleftheria Maria Pechlivani 1, Ioanna K. Sfampa 2,
    Konstantinos Tsongas 3, Apostolos Korlos 3, Constantine David 4 and Dimitrios
    Tzovaras 1


    +   1 Centre for Research and Technology Hellas, Information Technologies Institute
    (CERTH/ITI),

    +   57001 Thessaloniki, Greece; riapесhl@iti.gr (E.M.P.); dimitrios.tzovaras@iti.gr
    (D.T.)

    +   2 R&D Department, KLEEMANN Group, 61100 Kilkis, Greece; i.sfampa@kleemannlifts.com

    +   3 Advanced Materials and Manufacturing Technologies Laboratory, Department
    Industrial Engineering and

    +   Management, School of Engineering, International Hellenic University, 57001
    Thessaloniki, Greece;

    +   ktsongas@ihu.gr (K.T.); apkorlos@ihu.gr (A.K.)

    +   4 Manufacturing Technology and Production Systems Laboratory, Department of
    Mechanical Engineering,

    +   International Hellenic University, 62124 Serres, Greece; david@ihu.gr

    +   * Correspondence: nikolad@iti.gr


    Abstract: The elevator industry is constantly expanding creating an increased
    demand for the integration of high technological tools to increase elevator efficiency
    and safety. Towards this direction, Additive Manufacturing (AM), and especially
    metal AM, is one of the technologies that could offer numerous competitive advantages
    in the production of industrial parts, such as integration of complex geometry,
    high manufacturability of high-strength metal alloys, etc. In this context, the
    present study has 3D designed, 3D printing manufactured, and evaluated novel bioinspired
    structures for elevator safety gear friction pads with the aim of enhancing their
    dynamic friction performance and eliminating the undesired behavior properties
    observed in conventional pads. Four different friction pads with embedded bioinspired
    surface lattice structures were formed on the template of the friction surface
    of the conventional pads and 3D printed by the Selective Laser Melting (SLM) process
    utilizing tool steel H13 powder as feedstock material. Each safety gear friction
    pad underwent tribological tests to evaluate its dynamic coefficient of friction
    (CoF). The results indicated that pads with a high contact surface area, such
    as those of car tire-like and extended honeycomb structures, exhibit high CoF
    of 0.549 and 0.459, respectively. Based on the acquired CoFs, Finite Element Models
    (FEM) were developed to access the performance of braking pads under realistic
    operation conditions, highlighting the lower stress concentration for the aforementioned
    designs. The 3D-printed safety gear friction pads were assembled in an existing
    emergency progressive safety gear system of KLEEMANN Group, providing sufficient
    functionality.


    Keywords: bioinspired surface lattices; additive manufacturing; selective laser
    melting; dynamic friction; elevator''s braking pads; tribological analysis; finite
    element models


    Citation: Kladovasilikas, N.; Pechlivani, E.M.; Sfampa, I.K.; Tsongas, K.; Korlos,
    A.; David, C.; Tzovaras, D. Metal 3D-Printed Bioinspired Lattice Elevator Braking
    Pads for Enhanced Dynamic Friction Performance. *Materials* **2024**, *17*, 2765.
    https://doi.org/10.3390/ma17112765


    +   Academic Editor: Yong-Cheng Lin

    +   Received: 17 May 2024

    +   Revised: 29 May 2024

    +   Accepted: 4 June 2024

    +   Published: 5 June 2024


