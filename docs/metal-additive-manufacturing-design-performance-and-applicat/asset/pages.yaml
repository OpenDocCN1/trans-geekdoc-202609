    # Figure 1. Flowchart of the current research work.


    # 2. Material and Methods


    # 2.1. Materials and Sample Preparation


    The material that has been selected to be investigated is the OERLIKON MetcoAdd™
    H13-A (Westbury, NY, USA), an air-hardenable, iron-chromium martensitic steel
    powder. Its chemical composition according to the manufacturer is shown in Table
    1.


    # Table 1. PSD, Hall flow, and chemical composition for H13A powder according
    to the manufacturer.


    | Nominal Range (µm) | D90 (µm) | D50 (µm) | D10 (µm) | Hall Flow (s/50 g) |

    |---|---|---|---|---|

    | -45 + 15 | 50 | 34 | 21 | ≤25 |

    | \multicolumn{5}{c}{Weight Percent (nominal)} |

    | Fe | Cr | Mo | Si | V | C |

    | Balance | 5.2 | 1.3 | 1.0 | 1.0 | 0.4 |


    To achieve the desired mechanical behavior of H13 hot work tool steel, various
    printing parameters were considered. The energy imparted to the material is a
    very important variable in the SLM process, because it directly affects the characteristics
    of the molten pool during formation and, consequently, the properties of the final
    part. This energy is known as volumetric energy density (VED), measured in J/mm³,
    and is described as follows:


    ```

    VED = \frac{P}{V * h * t} \left[ \frac{J}{mm^3} \right] \tag{1}

    ```


    where P is the laser power (J/s), V is the scanning speed (mm/s), h is the hatch
    width (mm), and t is the layer thickness (mm). Katanick et al. explored a range
    of printing parameters [28]. The component with the highest density, exhibiting
    a relevant density of 99% and a porosity of less than 0.01%, was fabricated utilizing
    a volumetric energy density of 760 J/mm³. This was accomplished with settings
    of 152 W laser power, 100 mm/s scanning speed, 40 mm hatch spacing, and 50 mm
    layer thickness. In the current work, the hatch width was selected constant at
    40 µm, and the layer thickness at 25 µm. The variables were the scanning speed
    and the laser power. The different combinations of printing parameters are presented
    in Table 2.'
