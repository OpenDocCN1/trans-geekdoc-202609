    by selective laser melting”, providing research findings on the design and performance

    of metal AM. Xia P. et al. [2] contributed a paper entitled “Study on Microstructure
    and

    Thermal Cracking Sensitivity of Deposited Ti6Al4V/Inconel 718 Composites Made
    by

    Two-Wire Arc Additive Manufacturing by Current”, providing research findings on
    the

    performance of metal AM. Lee J. et al. [3] contributed a paper entitled “Study
    On Surface

    Quality Analysis Of An Uncoated Boron Steel And Its Oxide Layer Suppression Method
    For

    Hot Stamping”, providing research findings on the performance of metal AM. Perrone
    A.

