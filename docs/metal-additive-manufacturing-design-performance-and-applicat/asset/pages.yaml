    # 3. Results


    # 3.1. Macro-, Microstructure, and Phase Composition of the WAAM Ti-6Al-4V Samples


    To study structural evolution of the deposited metal as depended on their thermal
    history, the walls were arbitrarily divided into three parts designated as bottom,
    middle and top (Figures 2a and 3a). The macrostructures of all the Ti-6Al-4V samples
    obtained using “coldArc” WAAM and both layer deposition strategies are represented
    by former columnar-equiaxed primary \(\beta\)-grains, within which the \(\alpha\)-phase
    exists in the form of lathes and Widmanstätten structures (Figures 2b–d and 3b–d).


