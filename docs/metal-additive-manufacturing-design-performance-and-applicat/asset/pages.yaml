    The internal discrepancies at the rests, tissue stops, and lingual bars (IDR,
    IDT, and IDL, respectively) were measured. In addition, the overall internal discrepancy
    (IDO), comprising the average values of the IDR and IDT, was calculated.


    # 2.5. Statistical Analysis


    The sample size of 10 per group was determined based on the statistical significance
    level set at α = 0.05 and power (1 − β) of 0.8 with an effect size of 0.6. The
    Shapiro–Wilk test was performed to examine the normality and all data followed
    normal distribution (p > 0.05). One-way analysis of variance and a post hoc Tukey''s
    multiple comparison test were performed to determine differences between the three
    groups (α = 0.05). The data were analyzed using statistical software (SPSS Statistics
    version 23.0, IBM Corp., Somers, NY, USA), and the analysis graphs were created
    using the graphing software (GraphPad Prism 10, Boston, MA, USA).


    # 3. Results


    The overall internal discrepancies (IDOs) and internal discrepancies at rests,
    tissue stops, and lingual bars (IDR, IDT, and IDL, respectively) of mandibular
    RPD metal frameworks fabricated using three methods are presented in Figure 4.
    The RPC group shows significantly higher IDOs than the SLM and CON groups (p =
    0.001 and 0.019, respectively), whereas the IDOs of the SLM and CON groups do
    not differ significantly (p = 0.633). The CON group has the lowest mean IDR (p
    = 0.010, p < 0.001), whereas the SLM group has the lowest IDT (p = 0.001, p =
    0.025). The RPC group, combined with resin 3D printing and casting, shows the
    highest IDRs and IDTs with significant differences. For the IDLs, no significant
    differences are noted among the three groups. The mean IDRs, IDTs, and IDLs of
    the mandibular RPD frameworks in the three groups are presented in Table 1.


    ![](img/7578a5220236942261475fd7af81489e_103_0.png)


