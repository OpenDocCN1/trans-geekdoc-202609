  md: '![](img/7578a5220236942261475fd7af81489e_133_0.png)


    Figure 11. X-ray diffractograms obtained from the as-quenched Ti-6Al-4V-0 (a)
    and Ti-6Al-4V-1 (b) samples.


    The quenching of Ti-6Al-4V-0 samples resulted in the redistribution of the XRD
    peak intensities compared to those of the as-built samples so that a predominant
    orientation is observed for the (101)α/α'' reflections (Figure 11a). For the as-quenched
    Ti-6Al-4V-1 samples, the X-ray diffraction patterns were identical to those obtained
    on the as-built ones with a predominant orientation of (101)α/α'' over the entire
    height of the product.


    However, the magnitude of the elastic microstrains of the α/α'' lattice depended
    on the height of the wall (Figure 12). The as-built Ti-6Al-4V-0 samples demonstrated
    that their elastic microstrain values increased with the wall''s height. The quenching
    of the Ti-6Al-4V-0 samples allowed us to decrease their elastic microstrains,
    but they retained they dependence on the wall''s height (Figure 12a). The as-quenched
    Ti-6Al-4V-1 samples did not show any linear dependence on the wall''s height,
    thus showing a maximum in the middle part of the wall (Figure 12b).


    ![](img/7578a5220236942261475fd7af81489e_133_1.png)


    Figure 12. Elastic microstrains on the as-built and as-quenched Ti-6Al-4V-0 (a)
    and Ti-6Al-4V-1 (b) samples.


    # 3.3. Microhardness


    The microhardness profiles for the as-built and as-quenched Ti-6Al-4V-0 and Ti-6Al-4V-1
    samples allowed us to observe that both the as-built and as-quenched Ti-6Al-4V-0
    samples were characterized by the microhardness number scatter, which was greater
    than that found in the case of the Ti-6Al-4V-1 sample (Figure 13a,b). The average
    value of microhardness of the as-built deposited Ti-6Al-4V-0 was 3.4 GPa, which
    then increased to 3.6 GPa after quenching (Figure 13a). For Ti-6Al-4V-1 samples,
    the microhardness numbers were slightly lower than those of Ti-6Al-4V-0 and had
    a smaller scatter (Figure 13b). The average microhardness values of the as-built
    and as-quenched samples were 3.1 GPa and 3.4 GPa, respectively (Figure 13b).'
