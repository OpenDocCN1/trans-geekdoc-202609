    # Metal Additive Manufacturing: Design, Performance, and Applications


    Nikolaos Kladovasilakis 1,*, Konstantinos Tsongas 2,* and Dimitrios Tzetzis 3,*


    +   1 Centre for Research and Technology Hellas, Information Technologies Institute
    (CERTH/ITI),

    +   57001 Thessaloniki, Greece

    +   2 Advanced Materials and Manufacturing Technologies Laboratory, Department
    of Industrial Engineering and

    +   Management, School of Engineering, International Hellenic University, 57001
    Thessaloniki, Greece

    +   3 Digital Manufacturing and Materials Characterization Laboratory, School
    of Science and Technology,

    +   International Hellenic University, 14th Km Thessaloniki-Moudania, Thermi,
    57001 Thessaloniki, Greece

    +   * Correspondence: nikoklad@iti.gr (N.K.); ktsongas@ihu.gr (K.T.); d.tzetzis@ihu.edu.gr
    (D.T.)


    The rapid evolution of metal additive manufacturing (AM) has led to transformative

    advancements across various industries, including aerospace, healthcare, automotive,
    and

    energy. While this groundbreaking technology holds immense promise, its widespread

    adoption faces significant challenges that demand innovative solutions in design,
    per-

    formance optimization, and application-specific development. The Special Issue
    titled

    “Metal Additive Manufacturing: Design, Performance, and Applications” addresses
    these

    challenges by serving as a dedicated platform for disseminating cutting-edge research

    and pioneering insights. By presenting novel methodologies, rigorously evaluating
    ma-

    terial properties, and showcasing state-of-the-art real-life applications, this
    collection of

    high-quality scientific papers aims to deepen our understanding and accelerate
    the imple-

    mentation of metal AM in industry.


    This Special Issue comprises 10 high-quality papers authored by 47 contributors
    from

    22 distinguished institutes and organizations worldwide, reflecting the collaborative
    and

    interdisciplinary nature of this Special Issue. The studies featured in this Special
    Issue build

    on a foundation of 381 conducted and published works, culminating in comprehensive

    and novel findings that advance the field. The significant response from the scientific

    community further underscores the significance of this Special Issue, with over
    9600 reads

    recorded within the first nine months of its release.


    Received: 31 December 2024

    Accepted: 22 January 2025

    Published: 25 January 2025

    Citation: Kladovasilakis, N.; Tsongas, K.; Tzetzis, D. Metal

    Additive Manufacturing: Design, Performance, and Applications.

    Materials 2025, 18, 545. https://

    doi.org/10.3390/ma18030545

