- pgno: 63
  md: 'To prevent the development of significant craters or directional formations,
    the target undergoes rotation and displacement during deposition, a practice followed
    in our previous research. Ultraviolet-visible lasers are frequently utilized due
    to their effective interaction with various target materials. The pulsed laser
    beam strikes the target surface at a 45° angle, delivering a power density ranging
    from 0.1 to 1 GW/cm², within nanosecond durations. Depending on specific parameters,
    metallic films are deposited on the substrate at rates typically measured in tenths
    of an angstrom per laser pulse. A notable strength of PLD lies in the strong adherence
    of these films to the substrate, a characteristic that has been consistently highlighted.
    Measurements using time-of-flight techniques indicate that the plasma’s average
    ion kinetic energy can vary significantly, potentially reaching several hundred
    electron volts, depending on the laser intensity [39–42]. The QE of the films
    is typically measured in a high vacuum system where the photocathode is aligned
    in front of the anode such that a laser beam can be focused on the photocathode
    surface without affecting the anode. An intense electric field, within the megavolt
    per meter range, is applied between the anode and cathode, and the emitted current
    is measured with respect to the laser energy hitting the photocathode surface.
    The QE of the photocathodes prepared by PLD was studied using a custom-built photodiode
    cell, designed according to the specifications mentioned earlier, as illustrated
    in Ref. [31].


    # 3. Photocathodes Assembly


    # 3.1. Hybrid and Non-Conventional Configurations of Metallic Photocathodes


    Previous studies extensively cover the operational principles and characteristics
    of traditional MPs [3,19,43]. Copper is frequently used in these applications
    due to its high chemical stability, long lifespan, low electrical resistivity,
    good thermal conductivity and economical cost, which enhance the quality factor
    of RF cavities. Nevertheless, Cu exhibits a low QE of 2.0 × 10⁻⁵ at 266 nm [17],
    necessitating the utilization of powerful UV lasers to overcome its high WF (see
    Table 2). Even photocathodes based on Mg with a WF of 3.6 eV require the use of
    the fourth harmonic of a Nd:YAG laser (266 nm, 4.66 eV) or the third harmonic
    of a Ti:sapphire (267 nm, 4.64 eV). That means much less energy and stability
    of the drive laser. On the contrary, the low WF value of Y (3.1 eV) allows one
    to drive photocathodes based on this metal with the third harmonic (355 nm, 3.5
    eV) of the Nd:YAG laser. However, many facilities still use Mg [44] as a photocathode
    due to its relatively high QE (7.6 × 10⁻⁴ at 266 nm) and to the lower chemical
    reactivity than that of Y. These two metals react with hydrogen- and oxygen-containing
    molecules such as H₂, H₂O, CO₂, and O₂, forming hydrides and oxides on the surface
    [45]. However, it is important to note that the oxidation processes in bulk metal
    photocathodes are significantly less severe compared to those in semiconductor
    photocathodes. Recently, “smart” cathodes designed with thin films to enhance
    QE and extend longevity have been developed. The hybrid design, featuring a thin
    film realized on the middle part of a conventional metallic cathode (see Figure
    1a,c), has been implemented for both MPs and SCPs. Figure 2a,b illustrate the
    collected charge vs. the function of laser energy for Y thin films on Cu in a
    hybrid configuration and for Cu bulk after laser cleaning. The linear correlation
    between the collected charge and laser energy suggests that photoemission takes
    place through a one-photon absorption mechanism. Additionally, the minimal space
    charge effect, resulting from the low collected charge, further supports this.
    The slope corresponding to the continuous line correlates to the QE value [32].
    Figure 2a,b illustrate that the QE of the Y thin film on Cu is substantially greater
    than that of bulk Cu under identical conditions and is also corroborated by the
    literature [21]. The most important photo-emissive properties of the metals used
    in metallic and superconducting photocathodes are shown in Table 2.'
