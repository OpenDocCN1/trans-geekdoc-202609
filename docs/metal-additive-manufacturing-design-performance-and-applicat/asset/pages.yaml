    # 3. Results


    # 3.1. 3D-Printed Friction Pads


    The developed friction pads with advanced surface geometry were additively manufactured
    via the SLM 3D printing technique, as shown in Figure 5a. The 3D printing process
    was performed in a low concentration of oxygen (<1%) to avoid oxidation phenomena.
    Moreover, all four designed friction pads were fitted on the 3D printer’s platform
    in ZYX orientation as presented in Figure 5b. The overall 3D printing process
    lasted around 13 h indicating the rapid fabrication nature of AM technology. It
    is worth mentioning that the 3D prints were structurally flawless, without any
    visible defects and voids. Furthermore, the 3D-printed specimens were weighted
    with a high-accuracy scale and their weight values were found close to nominal
    values revealing negligible porosity for the structures. Then, the 3D-printed
    friction pads underwent the post-processing treatment of support removal and sandblasting
    in order to be finished. Finally, the developed friction pads were assembled in
    the system of a safety gear showing sufficient fit and functionality, as illustrated
    in Figure 5c.


    ![](img/7578a5220236942261475fd7af81489e_116_1.png)'
