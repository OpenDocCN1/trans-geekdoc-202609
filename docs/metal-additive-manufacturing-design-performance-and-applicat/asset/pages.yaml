    # 2.2. Nanoindentation Test


    Nanoindentation experiments were conducted using a Shimadzu DUH-211S instrument
    (Kyoto, Japan) equipped with a Berkovich diamond tip (included angle: 65°, tip
    radius: 100 nm). Cylindrical specimens were used for the conducted nanoindentation
    tests. The calculation method of Oliver and Pharr has been used in order to determine
    the indentation hardness and the elastic modulus of the SLM printed parts [29].
    The indentation’s maximum depth in the following function can be used in order
    to determine the hardness (H):


    ```

    H = \frac{P_{max}}{A} \quad (2)

    ```


    where P<sub>max</sub> is the maximum applied load measured at the maximum depth
    of penetration (h<sub>max</sub>), and A is the projected contact area between
    the indenter and the film. For a perfect Berkovich indenter, A can be calculated
    as a function of the contact indentation depth h<sub>f</sub> as


    ```

    A = 33\sqrt{3}h_f^2 \tan^2 65 = 23.96h_f^2 \quad (3)

    ```


    The contact indentation, known as h<sub>f</sub> can be calculated using the following
    formula:


    ```

    h_f = h_{max} - \varepsilon \frac{P_{max}}{s} \quad (4)

    ```


    where \(\varepsilon\) is a geometric constant that takes a value of 0.75 for an
    indenter with the shape of a pyramid, and S is the contact stiffness. The contact
    stiffness, S, can be revealed as the gradient of the unloading curve at the point
    of maximum load as


    ```

    s = \left( \frac{dP}{dh} \right)_{h=h_{max}} \quad (5)

    ```


    The reduced elastic modulus E<sub>r</sub> is given by


    ```

    E_r = \frac{S}{2\beta} \sqrt{\frac{\pi}{A}} \quad (6)

    ```


    where \(\beta\) is a constant that is determined by the shape of the indenter.
    For the Berkovich indenter used in this case, the value of \(\beta\) is set to
    1.034. Following this, the elastic modulus of the specimen (E<sub>s</sub>) can
    be computed as per the following formula:'
  merge: -1
  img_proc: true
- pgno: 76
  md: '```

    \frac{1}{E_r} = \frac{1 - \nu_s^2}{E_s} + \frac{1 - \nu_i^2}{E_i} (7)

    ```


    where \nu_{i,s} and E_{i,s} describe the Poisson’s ratio and elastic modulus,
    respectively. Furthermore, for a diamond indenter, the Poisson’s ratio (\nu_i)
    is 0.07 and the elastic modulus (E_i) is 1140 GPa. The specimen’s elastic modulus
    (E_s) and hardness (H) are calculated using the equations mentioned above.


    The instrument possesses a load resolution of 0.196 µN. All tests were performed
    at room temperature. The nanoindentation procedure involved applying a controlled
    load profile to the surface of the filaments via the diamond tip. The load profile
    consisted of a continuous increase to a peak value of 800 mN, held constant for
    a dwell time of 3 s (creep time), followed by a complete unload to zero force.
    The indentation depth was continuously monitored as a function of the applied
    load. The average of 10 individual measurements was employed to determine the
    elastic modulus and hardness of the material.


    # 2.3. Nitridation


    Concerning the next step of the nanoindentation experiments, the specimens underwent
    surface treatment via nitridation to investigate their influence on mechanical
    behavior. The nitrification program employed a two-stage cooling process and it
    is depicted in Figure 2. The program encompassed a total duration of 20 h and
    11 min. During the initial phase (4 h and 12 min), the temperature steadily increased
    to reach the target value of 397 °C. Subsequently, ammonia gas was introduced
    into the furnace chamber (4 h and 42 min). The temperature was then elevated further
    to 500 °C within the next hour (5 h and 46 min). This stage marked the initiation
    of the first nitrifying step, which concluded at 8 h and 25 min. The second stage
    commenced with another temperature ramp, reaching a peak of 530 °C at 13 h and
    24 min. This stage concluded the nitriding process. A two-step cooling sequence
    followed. The first stage reduced the temperature to 255 °C by 15 h and 24 min.
    The final cooling stage brought the temperature down to 70 °C, signifying the
    completion of the nitridation program at 20 h and 11 min.


    ![](img/7578a5220236942261475fd7af81489e_76_0.png)


    Figure 2. (a) Indentation hardness of H13 hot work tool steel, (b) modulus of
    elasticity before and after the nitrification process, and (c) nitrification temperature–time
    program.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 3. Results and Discussion


    # 3.1. Nanoindentation Test Results


    Figure 2 depicts the results for the hardness and the modulus of elasticity. For
    all the selected parameters, 10 sets of specimens were fabricated for each printing
    parameter and the standard deviation of them is also depicted in this figure.
    Specimen 16 demonstrated the utmost hardness, reaching 6191 ± 60 MPa. It becomes
    clear that as the VED increases, there is a corresponding rise in hardness. The
    greatest modulus of elasticity was observed in specimens 6 through 14 and 16,
    each surpassing 215,000 MPa. On the other hand, specimens 1 and 2 presented the
    minimal elastic modulus, falling below 150,000 MPa. These reduced modulus values
    are due to the use of varied printing parameters, which were inadequate for achieving
    the required mechanical performance standards. In terms of indentation depth,
    specimen 16 showed the most advantageous properties, with an indentation depth
    of 2.11 ± 0.01 μm. The largest indentation depth was recorded for specimen 1 at
    2.7 ± 0.01 μm, a result of choosing additive manufacturing parameters that did
    not meet the necessary mechanical performance benchmarks.


    Nitirification significantly enhanced the nanoindentation behavior of H13 hot
    work tool steel, making it more resistant to the extreme conditions of extrusion.
    Hardness increased by up to 51.23% (Table 3), with specimen 16 exhibiting the
    highest value (8960 ± 77 MPa) after treatment. The effect on elastic modulus was
    less pronounced, with an average increase of around 4.3%. However, all specimens
    displayed a modulus exceeding 215,000 MPa.


