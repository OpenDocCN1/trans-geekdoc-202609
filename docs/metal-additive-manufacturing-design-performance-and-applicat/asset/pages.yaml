  md: '# 4. Discussion


    The Ti-6Al-4V-1 samples were built with the use of arc torch weaving that resulted
    in smaller β-Ti grains and a more uniform grain structure compared to those of
    Ti-6Al-4V-0 samples obtained without the weaving. The epitaxial growth of the
    primary β-Ti grains in the melt pool is determined by the temperature gradient
    and the associated change in solidification conditions [45,46]. The temperature
    gradient, nucleation, and growth rate of β-Ti grains are significantly affected
    by heat input during the additive manufacturing, with a higher temperature gradient
    typically following less heat input near the liquidus line. Such conditions at
    the solidification front are accompanied by higher cooling rates, as shown elsewhere
    [47].


    Excessive heat input and possible overheating are known to be problems affecting
    the stability of the wire arc additive manufacturing process [48,49]. The “coldArc”
    WAAM features control over the metal transfer via the rapid cycling between arcing
    and short-circuit modes that requires instantaneous power measurements at the
    end of each short-circuit mode and immediately before the arc ignition [41]. This
    ensures a smooth transfer process with a significantly reduced energy input compared
    to the conventional WAAM. Consequently, the wire arc deposition of the Ti-6Al-4V
    alloy assisted with “coldArc” technique occurs due to the solidification of a
    relatively “cold” melt pool, which limits the imposed temperature gradient and,
    consequently, the columnar growth of the initial β-Ti grains. However, it can
    be argued that the high heat capacity and low thermal conductivity of the Ti-6Al-4V
    alloy can lead to significant heat accumulation during the sequential deposition
    of layers, as well as to the long-term reheating of the previously deposited layers
    to the temperatures corresponding to the α→β phase transformation, thus making
    them capable of supporting the epitaxial growth of β-Ti grains.


    Deliberate changes in layer deposition speed and the use of low-frequency transverse
    arc oscillations may interfere with the epitaxial grain growth and promote the
    formation of a more uniform structure with columnar grains of lower aspect ratio
    as compared to those solidified without using these oscillations.


    According to [49,50], excessively high layer deposition speed can lead to insufficient
    melting of the wire, increase the nucleation center number in the melt pool and
    thus promote the formation of smaller equiaxed grains in the neighborhood of the
    columnar ones. However, this was not observed in the present experiment. On the
    other hand, combined action of oscillations and use of “coldArc” and CMT processes
    may contribute to extra grain nucleation centers [51].


    The use of forced oscillations with a frequency close to that of the natural frequency
    of the melt pool (10–200 Hz) may cause a resonance phenomenon in the melt pool
    with corresponding improvements in stirring the melted pool metal [52–54]. In
    addition, the continuous oscillations transmitted via a wire feed mechanism may
    further improve the stirring of the melt pool, promote fragmentation of dendrites,
    and grain refinement in the dendrite mushy zone [55]. Fragments of dendrites and
    grains remain in the melt pool and serve as centers of the β-Ti grain nucleation
    to provide a competitive grain growth mechanism.


    The microstructural inhomogeneities discussed above can affect the mechanical
    characteristics of the WAAM Ti-6Al-4V. In the titanium α/β alloys, the effective
    dislocation glide length is determined by the average size of α-colonies and the
    size of α-laths in Widmanstätten structures [56]. Reducing the size of α-laths
    and α-colonies will increase the amount of high angle boundaries which serve as
    dislocation barriers and thus increase the dislocation density along the α/β interfaces
    that will contribute to improvements of the yield strength and hardness. Therefore,
    as the size of α-lath decreases, an increase in hardness can be expected. However,
    the α-lath sizes may be determined for both basket-weave and lath-like microstructures,
    while α-colonies can allow dislocations to easily glide over significant distances
    and thus reduce the strength properties of the material [57]. These two features
    can compensate each other and lead to minimal deviations from average hardness
    values (Figure 9).'
