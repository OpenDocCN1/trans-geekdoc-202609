  md: '![](img/7578a5220236942261475fd7af81489e_132_0.png)


    Figure 9. Mean aspect ratio values for primary columnar and size of equiaxial
    $\beta$-Ti grains ($d_{av}$): Ti-6Al-4V-0 (a) and Ti-6Al-4V-1 (b) as-quenched
    samples. I/d—mean aspect ratio of primary columnar $\beta$-grains; $d_{av}$—mean
    size of equiaxed primary $\beta$-grains.


    The quenching of the Ti-6Al-4V-0 samples allowed us to obtain more uniform aspect
    ratio values relating to the primary $\beta$-Ti grains (Figure 9a). The mean aspect
    ratio (I/d) values calculated for the bottom, middle, and top parts of the wall
    are 3.4 ± 1.1, 3.4 ± 1.1, and 3.6 ± 1.3, respectively (Figure 9a). For the as-quenched
    Ti-6Al-4V-1 samples, the average aspect ratio values did not change compared to
    those of the as-built ones, and they were 2.6 ± 0.5, 2.8 ± 0.7, and 3.4 ± 1.2
    (Figure 9b).


    According to TEM (Figure 10a,b,d,e)), the volume fraction of $\alpha''$-Ti increased
    significantly after quenching in both the Ti-6Al-4V-0 and Ti-6Al-4V-1 samples
    (Figure 10c,f). At the same time, the $\beta$-phase was partially retained between
    the $\alpha$-plates in the as-quenched Ti-6Al-4V-1 samples (Figure 10e), as confirmed
    by the corresponding XRD pattern (Figure 11).


    ![](img/7578a5220236942261475fd7af81489e_132_1.png)


    Figure 10. TEM bright-field images of microstructures in as-quenched Ti-6Al-4V-0
    (a–c) and Ti-6Al-4V-1 (d–f) samples.'
