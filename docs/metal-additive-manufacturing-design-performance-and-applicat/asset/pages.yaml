    reported that SLM-fabricated RPD frameworks had acceptable accuracies; however,
    among the frameworks with a large span and more retainers and clasps, the conventional
    casting technique exhibited slightly better fit and accuracy. Moreover, Soltanzadeh
    et al. [30] evaluated the accuracy and fit of maxillary RPD frameworks fabricated
    by conventional casting and 3D printing techniques with stone and 3D-printed resin
    models. Both methods revealed clinically acceptable adaptation (50–311 μm), but
    the conventional casting groups exhibited better overall fit and higher accuracy.
    The poorest fit was observed at the anterior palatal straps fabricated using the
    3D printing technique.


    Studies on 3D-printed RPD metal frameworks regardless of maxilla and mandible
    have previously been conducted. Tregerman et al. [16] compared the clinical fit
    of RPD metal frameworks fabricated by three workflows—conventional casting pathway,
    SLM 3D printing with extraoral scanning of the stone cast, and SLM 3D printing
    with intraoral scanning—and concluded that the completely digital workflow had
    the lowest misfit. Al-mufleh et al. [39] compared patient satisfaction with RPDs
    using frameworks fabricated by conventional casting and SLS 3D printing, revealing
    that higher satisfaction was achieved with the RPDs obtained using SLS 3D-printed
    frameworks. Peng et al. [40] compared the trueness of RPD metal frameworks fabricated
    by SLM and 3D-printed resin-casting. The frameworks fabricated by SLM 3D printing
    exhibited higher trueness than those by the combined method. Summarizing the results
    of recent studies, SLM 3D printing and conventional casting techniques demonstrated
    similar accuracies for fabricating RPD metal frameworks within a clinically acceptable
    range, as evidenced in this study.


    For the internal gap between a rest and a rest seat, the mean distance per rest
    was reported as 69–387 μm [41] and 193–203 μm [42]. Lee et al. [34] studied the
    accuracy of RPD frameworks fabricated through a combined method. The mean IDR
    of 249.27 ± 134.84 μm, which was higher than previously reported values on casted
    RPD frameworks, was obtained. Oh et al. [35] obtained IDRs in the range of 211.91
    ± 16.84 to 259.26 ± 45.41 μm without significant differences among the three manufacturing
    methods. Souza Curinga et al. [27] achieved the IDR range of 20–279 μm for conventional
    cast frameworks and 30–272 μm for 3D-printed frameworks, which did not indicate
    a significant difference. The IDRs in the aforementioned studies are in the range
    of 20–387 μm, whereas those in this study were lower, indicating clinically acceptable
    values.


    The internal discrepancies of lingual bars, which have not been previously investigated,
    were also measured in this study, whereby no significant differences were noted
    among the three groups. The default value of 200 μm was set for lingual relief
    in CAD subtracted from the IDLs of the SLM and RPC groups because wax relief under
    a lingual bar was not performed in the CON group owing to the absence of undercuts.
    We also tried to identify specific tendencies depending on the locational factors
    among three groups, such as the tooth-borne area versus tooth and mucosa-borne
    area; however, it was difficult to observe particular trends. The table and figures
    of the additional regional analysis are included in the Supplementary Materials
    (Supplemental Table S1, Figures S1 and S2).


    Nonetheless, this study had certain limitations. First, this work was an in vitro
    study with different conditions than that with an actual patient’s oral mucosa.
    The edentulous area of a patient is covered with elastic soft tissue and saliva,
    whereas the master cast is not. Thus, there might be differences compared to results
    obtained from in vivo studies. Second, finishing and polishing can have various
    influences on the results. However, the complete adaptation of the RPD framework
    on the cast is difficult to achieve without finishing and polishing, and an actual
    RPD framework is fitted into the patient’s oral cavity after complete polishing.
    Therefore, the measurement of polished frameworks was considered inevitable and
    appropriate. However, all 30 frameworks were finished and polished by a'
