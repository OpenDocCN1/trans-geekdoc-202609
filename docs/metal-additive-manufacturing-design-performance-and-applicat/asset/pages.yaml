    # 2.4. Tribological Analysis


    The first step before conducting the tribological analysis was the roughness measurements
    of the surface of the 3D-printed parts. The surface roughness analysis was performed
    using the Wyko® NT Series optical profiler (Veeco Instruments Inc., Plainview,
    NY, USA), NT1100 Optical Profiling System. This system employs white light interferometry
    for high-resolution 3D surface roughness measurements. Specimens’ profiles were
    assessed utilizing the optical surface profilometer, specifically focusing on
    the friction surface of the 3D-printed H13 pads. Discussing surface roughness
    alongside tribological results'
