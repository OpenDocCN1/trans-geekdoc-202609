    # 3.2. The Influence of Processing Parameters on Porosity


    According to the simulation results of the molten pool, the combination of the
    processing parameters in the green part of Figure 6 was selected for porosity
    simulation. In addition, the new variable scan spacing was added. There are many
    reasons that affect the porosity. In the manufacturing process, the entrained
    gas in the powder may remain in the part. Contaminant degassing may occur during
    the formation of the molten pool. During the solidification process, a small amount
    of gas vapor may also be retained in the molten pool, forming pores inside the
    part. The results are shown in Figure 7; when the scanning spacing does not exceed
    0.1 mm and the laser power is 300 W, the porosity is low.


    ![](img/7578a5220236942261475fd7af81489e_17_1.png)


    Figure 7. The simulation results of porosity.


    Considering the simulation results of molten pool and porosity, the optimized
    process parameters are as follows: laser power 300 W, scanning speed 1000 mm/s,
    layer thickness 30 μm, scanning spacing 0.1 mm.


