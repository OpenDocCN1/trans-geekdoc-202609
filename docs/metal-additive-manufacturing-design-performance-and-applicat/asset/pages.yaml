    |---|---|---|---|---|

    | P1 | Cladding | - | - | Cladding |

    | P2 | | | Ethanol cleaning | |

    | P3 | | Milling | Air Blasting | |

    | P4 | | | Laser Cleaning | |

    | P5 | | | Table Tilting | |


    This lubricant was applied to the corresponding specimens according to Table 2.
    Two sets of tests were carried out—with a concentration of 5% of the lubricant
    in the cutting liquid for the first set and 100% for the second one. These concentrations
    were chosen as the most commonly used for the machining of IN718. The specimens
    are named according to the following rule—each sample is named PS_C, where S (from
    1 to 5) indicates the process chain and cleaning method according to Table 2,
    and C is the concentration of the lubricant in the cutting liquid (5 or 100).
    For example, P5_100 means that 100% concentration of the lubricant in the cutting
    liquid and the cleaning method P5 were used.


    # 2.3. Experimental Characterisation


    The cross sections were ground flat with SiC papers from 240 to 4000 and polished
    with 1 μm and 0.1 μm diamond suspension. The cross sections were analysed on a
    Keyence'
