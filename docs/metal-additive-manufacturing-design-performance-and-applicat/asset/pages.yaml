    # 1. Introduction


    The elevator industry is constantly expanding, driven by the development of cities
    and the increasing demand for high-rise buildings [1,2]. Concurrently, the imperative
    for safer and more efficient vertical transportation in buildings of all types
    persists. Technological advancements in this sector enable the development of
    elevators with superior performance and safety standards. Adherence to safety
    regulations is paramount in both the construction and operation phases of elevators.
    Mechanical components, such as emergency braking systems and safety gears, play
    a critical role in elevator safety and are required by national and European regulations
    [3,4].

    Progressive safety gear is a mechanical device used to deal with situations of
    potential danger, such as exceeding the descent speed or breaking the means of
    suspension, for'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'example, wire ropes [5.6]. In these cases, an innovative grab is activated
    automatically, ensuring the immediate stop of the elevator cabin movement and
    protecting the occupants from possible accidents. In detail, this progressive
    safety gear can be placed both under the cabin, to avoid sudden downward and/or
    upward movement, and under the counterweight, in the event that the lower space
    in the shaft, and in particular under the travel of the counterweight, is accessible.
    The basic elements of the progressive safety gear include the friction plate (pad),
    the housing, disc springs, and the gripper wheel. In order to avoid over-acceleration
    of the elevator, especially for elevators with a nominal speed of more than 1
    m/s, the progressive safety gear is used according to the state of the art. Figure
    1 shows an indicative image of an existing progressive safety gear system along
    with its position on the elevator''s system. Specifically, the following phases
    can be distinguished in the operation of the progressive safety gear:


    +   i. The resting phase, where the wheel is at a safe distance (a few millimeters)
    from the guide rails, while the friction plate is at a short distance of 1–3 mm
    from the guide rails.

    +   ii. Activation phase, where the wheel has just touched the guide rails

    +   iii. The wedging phase is where the wheel moves and comes into contact with
    the guide rails until the gap between the guide rails and the back is zero, at
    which point the safety gear begins to brake.

    +   iv. After the guide rails are in contact with the friction plate, the springs
    are compressed and thus the friction forces develop gradually, resulting in progressive
    braking.


    ![](img/7578a5220236942261475fd7af81489e_110_0.png)


    Figure 1. Image of an indicative existing progressive emergency braking system
    along with its position on the elevator''s system.


    The main disadvantages of existing commercial safety gears in the elevator progressive
    emergency braking system are the damages caused both on the safety gear itself
    and the guide rails during activation. More specifically, when the safety gear
    of an elevator is activated, the friction plates strongly deform the guide rails''
    surfaces leading to complete failure after one or at most two times of emergency
    braking, forcing their replacement. These incidents increase the cost of maintenance
    and the operational costs of the elevator due to the downtime period, which in
    many cases is highly undesirable, especially in buildings where the elevator system
    is a vital infrastructure, such as in hospitals. In addition, with the existing
    morphology of the commercial friction plates, it becomes difficult to predict
    the behavior of the material, since instead of achieving immobilization of the
    cabin (or counterweight) through the frictional forces developed; the results
    often are the plastic deformation of the guide rails due to partial penetration
    of the friction plate into guide rails body. This behavior also leads to an undesirable
    experience for the passengers of the elevator, increasing the possibility of their
    injury. In order to address the aforementioned issues, in recent decades, both
    the research community and the elevator industry examined'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'and developed novel solutions optimizing the performance and reliability of
    the progressive safety gear. There are numerous submitted patents in this direction.
    However, there is a lack of published literature about the examination of innovative
    patterns in the contact area of a friction plate to increase its dynamic frictional
    performance.


    In this context, the current study proposes the technical solution of integrating
    hierarchical biomimetic patterns on the surface of a friction pad in order to
    develop and manufacture pioneering friction pads, with optimal production techniques
    and advanced materials. The employment of this novel approach is expected to provide
    a smoother immobilization of the elevator, reducing the possibility of injury
    of the passengers, and avoiding the unpleasant experience of a sudden and emergency
    elevator stop. In addition, it is anticipated to increase the lifetime of the
    specific components, due to the existence of large diffusion canals, reducing
    the maintenance intervals and costs of an elevator. More specifically, in this
    paper, the development of four innovative friction plates for the safety gear
    of the elevator emergency braking system were developed. These advanced morphologies
    were based on the application of bio-inspired hierarchical patterns, i.e., specific
    repeated geometric shapes, which can significantly improve the tribological behavior
    of a surface. This innovation of hierarchical patterns design can be incorporated
    into various types of elevator safety gear offering comparative advantages. In
    detail, the superiority of these new morphologies of the present study is in the
    application of a biomimetic friction surface design process, i.e., in copying
    the morphology of natural patterns with proven high adhesion, such as the sole
    of a frog’s rear ends. The developed morphologies are the honeycomb, extended
    honeycomb, speckled honeycomb, and car-tire geometries with a biomimetic design.
    The designed friction pads were additively manufactured using the Selective Laser
    Melting (SLM) technique and a tribological analysis was performed for each one.
    Then, based on the results of tribological analyses, i.e., coefficient of friction
    (CoF), the produced braking pads were numerically evaluated via Finite Element
    Analyses (FEAs) under realistic loads. Figure 2 presents the flowchart of the
    current study.


    ![](img/7578a5220236942261475fd7af81489e_111_0.png)


    Figure 2. Flowchart of the current study.


    # ## 2. Materials and Methods


    # ### 2.1. Problem Statement


    Progressive safety gears are widely utilized in the elevator industry, increasing
    the safety and reliability of elevator systems. Typically, the progressive safety
    gear of a commercial elevator consists of two friction pads with a trapezoidal
    configuration to achieve progressive deceleration. In this way, the immobilization
    of the elevator occurs smoothly avoiding potential injuries to the passengers.
    However, in order to achieve the immobilization of an elevator, there is a need
    to create a friction force (opposite to the movement of the elevator) on the guide
    rails greater than its overall weight force. According to existing standardization
    [7], the overall weight force of an elevator is provided by the following equation
    (Equation (1)). Where P is the mass of the empty cabin which includes the masses
    of doors, walls, floor, roof, and cabin sling. On the other hand, Q is the payload
    of an elevator, which is the maximum weight it can carry for the selected cabin
    [8]. Furthermore, g is the gravitational acceleration (9.81 m/s²) and FOS is the
    factor of safety which ensures that deceleration of the elevator occurs. The value
    of this property is usually around 2.


    ```

    Total Braking Force = (P + Q) × g × FOS (1)

    ```'
