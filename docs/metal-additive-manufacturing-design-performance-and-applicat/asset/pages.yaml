    # 3. Optimization of SLM Processing Parameters


    # 3.1. The Influence of Processing Parameters on the Molten Pool


    The schematic diagram of the molten pool shape is shown in Figure 4. The shape
    of the molten pool is greatly affected by the process parameters, which are mainly
    reflected in the width and depth of the molten pool. Therefore, the same method
    as the previous study was used to study the influence of process parameters on
    the molten pool geometry [24,25].'
