- pgno: 24
  md: '# Study on Microstructure and Thermal Cracking Sensitivity of Deposited Ti6Al4V/Inconel
    718 Composites Made by Two-Wire Arc Additive Manufacturing by Current


    Peng Xia, Xin Ye * and Guangshun Zhang


    School of Materials Science and Engineering, Shanghai University of Engineering
    Science, Shanghai 201620, China; xia159112@163.com (P.X.); zhang16140225@163.com
    (G.Z.) * Correspondence: yexin@sues.edu.cn; Tel.: +86-67791474


    Abstract: Ti6Al4V/Inconel 718 composites were prepared using arc additive manufacturing
    technology at different deposition currents. The properties of the composites
    directly influence the performance of the gradient materials, while heat input
    further affects the composites’ properties. The results indicate that at a deposition
    current of 35 A, Ti elements diffuse into the Inconel 718 alloy. Increasing the
    current leads to the formation of brittle intermetallic compounds such as TiNi,
    Cr2Ti, and Fe2Ti in the deposited layer. At deposition currents below 50 A, no
    cracks appear, but cracks develop at a current of 50 A. Additionally, the microhardness
    of the deposited layer increases with higher deposition currents. Compared to
    the 35 A condition, microhardness rises by 31.51% at a current of 50 A. This research
    can expand the application field of the arc additive manufacturing of direct deposition
    Ti6Al4V/Inconel 718 composites.


    Keywords: arc additive manufacturing; microstructure; Ti6Al4V/Inconel 718 composites;
    mechanical properties


    # 1. Introduction


    The ongoing advancement of the aerospace sector has led to an increased demand
    for more sophisticated spacecraft, particularly in the area of dissimilar metal
    connection structures. These structures must now meet the dual requirements of
    high performance and lightweight design [1–3]. Therefore, more and more researchers
    have begun to pay attention to the connection of dissimilar metals and obtained
    Ti/Al, Mg/Al, Fe/Al, Ti/Ni, and other composite components [4–8]. Among them,
    Ti6Al4V alloy and Inconel 718 alloy are widely used in the aerospace field due
    to their excellent properties, so there is increasing attention on the connection
    between titanium-based alloy and nickel-based superalloy [9,10]. The structure
    composed of the connection of Ti6Al4V alloy and Inconel 718 superalloy can effectively
    reduce the mass of the parts and adapt to high-temperature environments [11,12].
    However, due to the differences in thermal physical property parameters such as
    the thermal expansion coefficient and thermal conductivity coefficient of dissimilar
    metals, cracks will occur in the connection process of titan-based alloy and nickel-based
    superalloy [13–15], and the preparation of gradient materials can improve this
    situation. In addition, when dissimilar metals are connected, composite materials
    are often formed at the joint, in which brittle intermetallic compounds (IMCs)
    such as Ti2Ni and Ni3Ti are easily formed, which further increases the brittleness
    of dissimilar joints [14,16,17]. Therefore, the microstructure and mechanical
    properties of composite materials play an important role in the preparation of
    gradient materials.


    In the process of dissimilar metal connection, new composite materials will inevitably
    be formed, so some researchers achieve a dissimilar metal connection by changing
    the alloy’s composition layer by layer. Sun et al. [18] prepared the Inconel 625/Ti6Al4V
    component using laser additive manufacturing technology and studied the changes
    in the composition and structure of the alloy from Ti6Al4V to Inconel 625. The
    results show that the phase'
  merge: -1
  img_proc: true
