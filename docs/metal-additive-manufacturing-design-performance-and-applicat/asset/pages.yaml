  img_proc: true
- pgno: 136
  md: 'This study demonstrates the effect of using the “coldArc” regime in the WAAM
    on the Ti-6Al-4V on the microstructure and mechanical characteristics that allowed
    us to obtain the maximum strength and ductility of the alloy compared to those
    known from the literature. The obtained UTS is higher than that recommended by
    the ASTM F1108 standard for deformable Ti-6Al-4V (UTS > 860 MPa, Figure 11). This,
    along with the process’s ability to reduce structural and mechanical anisotropy,
    makes the “coldArc” technology the preferred method for the additive manufacturing
    on Ti-6Al-4V and other Ti alloys. At the same time, “coldArc” for Ti-6Al-4V requires
    subsequent heat treatment and cannot be used immediately after manufacturing,
    because the anisotropy of mechanical properties is not eliminated completely even
    with the use of welding torch weaving (Figure 11). Considering the current mechanical
    characteristics of the WAAM Ti-6Al-4V-1, the “coldArc” process combined with the
    arc torch weaving has great potential for additive manufacturing on this alloy.
    However, further research is required to optimize the process and develop ideal
    pre- and post-processing routes for the final product.


    # 5. Conclusions


    In the present study, defect-free WAAM walls were grown from Ti-6Al-4V alloy with
    the use of the “coldArc” technology and welding torch weaving. The microstructural
    features of the resulting products were investigated to establish the “process–microstructure–property”
    relationships. Based on the results obtained, the following conclusions were made:


    It was shown that “coldArc” WAAM with transverse 1 Hz oscillations of a welding
    torch resulted in the formation of a more uniform grain structure over the entire
    height of the wall. This effect may be related to the improved melted pool stirring
    and agitation, which is the dominant factor in achieving dendrite fragmentation
    and grain refinement during solidification. The use of weaving in combination
    with the “coldArc” technique allowed us to reduce the aspect ratio of the primary
    β-Ti grains in the as-built walls, especially when examining the middle part of
    the wall. This finding was expected from considering the fact that heat conductivity
    of the top part of the wall was lower as compared to that of the middle part.


    Quenching the samples in water from 900 °C led to the formation of a more uniform
    grain structure in the Ti-6Al-4V-0 samples built without the welding torch weaving
    mode. The microstructure (grain size, phase composition, orientation, etc.) and
    mechanical properties become identical to those found in the as-built Ti-6Al-4V-1
    samples obtained with the welding torch weaving.


    Quenching had virtually no effect on the structure and properties of samples obtained
    with the “coldArc” WAAM weaving mode.


    After quenching, the relative elongation decreased in both cases. It has been
    shown that the use of the “coldArc” technology is promising for the additive manufacturing
    and high-performance production of Ti-6Al-4V products with a high level of mechanical
    properties if mechanical anisotropy has been eliminated.


