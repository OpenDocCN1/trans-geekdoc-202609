    # 4. Discussion


    The null hypothesis was rejected owing to significant differences in the accuracy
    of the mandibular RPD metal frameworks fabricated using the three manufacturing
    methods. There were no significant differences between the IDOs of the SLM and
    CON groups, whereas the RPC group showed a higher IDO than the other two groups,
    which can be ascribed to the higher error tendency of the RPD frameworks of the
    RPC group. Although the RPC group eliminated the steps of fabricating a refractory
    cast and waxing, which could result in inaccuracies owing to the physical properties
    of wax [6], it was implicated in the errors from the steps of 3D printing of castable
    resin patterns and in those from the steps of conventional investing and casting.
    According to Revilla-Leon and Ozcan [17], discrepancies can be incorporated into
    each step of a digital dental workflow. The 3D printer parameters, the material
    used (which has its optimal activation range of wavelength), power, and exposition
    time for AM on the 3D printers can affect the accuracy of the printed objects
    [17].


    The accuracy of the rests and tissue stops, which are structural components of
    the RPD frameworks that directly contact the tooth or tissue, differed significantly
    among the three groups. The CON group showed the highest accuracy for the rests,
    and the SLM group had the highest accuracy for tissue stops. The RPC group had
    the lowest accuracy for both components. In 2020, Tasaka et al. [36] reported
    that the accuracy of mandibular RPD metal frameworks differed depending on the
    structural component comparing SLS technology-based 3D printing and 3D-printed
    resin pattern casting, which is consistent with the results of this study. In
    2019, Bajunaid et al. [37] compared the accuracy of mandibular RPD frameworks
    fabricated by SLM technology-based 3D printing and conventional casting through
    measuring four rest zones with a digital microscope. The zones with the highest
    fit and accuracy among the two groups differed, which is also consistent with
    this study.


    As this study was conducted on the mandibular RPD frameworks, it was also compared
    with previous studies on the maxillary RPD frameworks. Oh et al. [35] compared
    the accuracy of maxillary RPD metal frameworks under similar conditions with this
    study, concluding that there were no significant differences among the three groups
    of SLM, RPC, and CON; however, the IDOs (226.99–365.30 μm) were all higher than
    those of this study (101.70–143.70 μm). The mean IDR of the three groups in this
    study was also lower by approximately 110 μm than that of the study of Oh et al.
    [35]. This difference could be ascribed to different factors. First, the palatal
    contact area was not included in the mandibular RPD frameworks, which can reduce
    the interferences before the contact of rests and rest seats. In contrast, the
    maxillary RPD frameworks could have early interferences due to the palatal contact
    of a major connector. Second, the measurement criteria differed. “Point” measurement
    was employed in the previous study, whereas “area” measurement was employed in
    this study. The “area” measurement can reduce the contingency of manual'
