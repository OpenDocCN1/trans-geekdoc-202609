  md: '# Thermal Behavior and Mechanical Properties of Different Lattice Structures
    Fabricated Using Selective Laser Melting


    Hui Liu 1, Gaoshen Cai 1,2,*, Kai Peng 1, Haozhe Jin 1,3,* and Antonov Alexander
    4


    +   1 School of Mechanical Engineering, Zhejiang Sci-Tech University, Hangzhou
    310018, China

    +   2 Key Laboratory of Advanced Manufacturing Technology of Zhejiang Province,
    School of Mechanical Engineering, Zhejiang University, Hangzhou 310027, China

    +   3 Institute of Flow-Induced Corrosion, Zhejiang Sci-Tech University, Hangzhou
    310018, China

    +   4 Innovative Technologies of Mechanical Engineering Faculty, Yanka Kupala
    State University of Grodno, 230023 Grodno, Belarus

    +   * Correspondence: caigaocan@zstu.edu.cn (G.C.); haozhejin@zstu.edu.cn (H.J.)


    Abstract: In this study, the size of molten pool and the porosity of parts under
    different processing parameters are studied using numerical simulation. According
    to the results, the appropriate processing parameters were selected to simulate
    the temperature and residual stress distribution during the forming process of
    body-centered cube (BCC), face-centered cube (FCC) and rhombic dodecahedron (Dode)
    lattice structures. In addition, three lattice structures were fabricated via
    selective laser melting (SLM) technology, and quasi-static compression experiments
    were carried out to study their mechanical properties. The results show that the
    high temperature parts of the three structures are all under the node and their
    adjacent pillars, and the closer to the nodes, the higher the temperature. The
    residual stress of the Dode structure is the highest, reaching 1218.2 MPa. It
    is also found that the residual stress in the Z direction is the largest, which
    plays a dominant role in the forming process. Through compression experiments,
    it is found that diagonal shear failure occurs in all three lattice structures,
    and Dode shows the best compression performance.


    Keywords: selective laser melting; residual stress; numerical simulation; lattice
    structure; mechanical property


    # 1. Introduction


    Titanium alloys have the advantages of low density, corrosion resistance, excellent
    fatigue strength and heat resistance [1]. Due to these characteristics, titanium
    alloys have great potential as lightweight structural materials. The excellent
    properties of Ti6Al4V make it widely used, such as gas turbines, automotive parts
    and medical implants and prostheses, which are welcomed by many industries [2,3].


    A lattice structure has the advantages of light weight, high specific strength
    and great heat dissipation. It has attracted much attention in aerospace, biomedical
    and other fields [4–6]. The traditional manufacturing methods of a lattice structure
    include investment casting [7], snap fit, expanded metal sheet, metallic wire
    assembly [8], etc. However, it is difficult to manufacture geometrically complex
    parts using traditional manufacturing techniques. Additive manufacturing technology
    can overcome this difficulty and realize the manufacture of complex structures.


    Selective laser melting (SLM) is a common metal additive manufacturing technology
    [9,10]. SLM technology uses a laser as a heat source to selectively melt the powder
    according to the sleeve of the model, and the powder is repeatedly melted until
    the part is manufactured [11,12]. Although the preparation of lattice structures
    using SLM technology has a good prospect, defects will occur due to the limitations
    of the process itself [13]. In addition, the powder particles undergo two processes
    of rapid melting and rapid solidification in the SLM forming process, resulting
    in large thermal stress and temperature difference,'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'resulting in large residual stress and warpage deformation, affecting the accuracy
    and mechanical properties [14,15]. In order to improve the forming quality, it
    is necessary to study the residual stress.


    Zhao et al. [16] studied the influence of different processing parameters on the
    residual stress of SLM-formed parts. It is found that the size and temperature
    gradient of molten pool are affected by the change of processing parameters. The
    larger the temperature gradient of the molten pool, the larger the residual stress,
    and the maximum residual stress there is in the overlapping area of the molten
    pool. The research of Wang et al. [17] showed that laser power, scanning speed
    and scanning strategy have different effects on the residual stress of parts,
    and the distribution of residual stress can be controlled by changing the processing
    parameters. In addition, it has also been found that there is a heat accumulation
    effect in the process of SLM manufacturing parts, and the existence of the heat
    accumulation effect makes the residual stress increase. Gan et al. [18] found
    that the angle and diameter of the lattice structure pillar significantly affect
    the residual stress. The residual stress can be reduced by increasing the inclination
    angle and decreasing the diameter of the pillar. The change of pillar length has
    little effect on the residual stress.


    The measurement methods of residual stress include the drilling method, neutron
    diffraction method, X-ray method, etc. [19]. The drilling method requires holes
    to be drilled on the surface of the component, which is difficult to achieve for
    a lattice structure. Tobias et al. [20] introduced a non-destructive neutron diffraction
    method to measure the residual stress in lattice structures. However, they proposed
    that due to the particularity of the lattice structure, it is difficult to obtain
    accurate results and prone to errors.


    At present, there are relatively few studies on the thermal behavior of lattice
    structures. Therefore, several types of lattice structures such as BCC, FCC and
    Dode were selected in this study, and the temperature change and residual stress
    distribution of the Ti6Al4V lattice structure were systematically studied. The
    parts were prepared using SLM technology, and their compression response and failure
    behavior were studied.


    # ## 2. Materials and Methods


    # ### 2.1. Materials and Manufacturing


    The raw material is Ti6Al4V powder produced by Bright Laser Technologies Co.,
    Ltd. (Xi’an, China). The chemical composition of the powder is listed in Table
    1. JSM-5610LV scanning electron microscopy (SEM) images show that the morphology
    of the observed powder particles is close to spherical, as shown in Figure 1.


    # **Table 1.** Chemical compositions (wt.%).


    | Alloying Elements | Ti | Al | V | Fe | C | N | H | O |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | wt.% | Bal. | 5.5–6.75 | 3.5–4.5 | ≤0.30 | ≤0.08 | ≤0.05 | ≤0.015 | 0.08–0.13
    |


    Bal.: Balance, the amount of remaining ingredients.


    The lattice structures were fabricated using the company’s BLT-A300 + 3D printer
    using laser power of 300 W, scanning speed of 1000 mm/s, scanning spacing of 0.1
    mm and layer thickness of 0.03 mm, as shown in Figure 2.


    In order to test the mechanical properties of the lattice structures, a quasi-static
    compression experiment was carried out using a microcomputer-controlled electronic
    universal testing machine (manufactured by Ji’nan Tenson Testing Machine Manufacturing
    Co., Ltd., Jinan, China) with a maximum load of 100 kN, and the compression was
    carried out at a speed of 1 mm/min until the part failed. Then, the fracture morphology
    was observed via SEM, and the fracture mechanism of the samples were analyzed.'
