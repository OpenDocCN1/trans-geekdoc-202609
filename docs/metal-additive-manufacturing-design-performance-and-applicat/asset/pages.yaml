  md: 'load holding, a very high creep strain rate was measured and then the creep
    strain rate decreased rapidly. This phenomenon may occur due to work hardening
    caused by the plastic deformation, corresponding to the transient creep. After
    a holding time of 2.3 s, an almost steady-state creep phase is depicted and a
    very slow decrease in the creep strain rate with increasing creep time is revealed
    [20]. From Figures 6 and 7, it is evident that there is no important change concerning
    the creep strain rate over the creep time for both VED and nitrification, but
    a small decrease in the creep strain rate with the use of nitrifications can be
    detected. Liu et al. concluded to the same insensitivity concerning the steady
    creep strain rate due to the dislocation creep phenomenon [30]. In each diagram,
    a detailed image has been superimposed, where the difference between the different
    aging conditions is more clearly visible.


