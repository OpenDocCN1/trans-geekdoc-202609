  md: '# # Accuracy of Mandibular Removable Partial Denture Frameworks Fabricated
    by 3D Printing and Conventional Techniques


    Soonam Kim 1,†, Kyung Chul Oh 2,† and Jee-Hwan Kim 2,*


    1 Department of Dentistry, Graduate School, Yonsei University, Seoul 03722, Republic
    of Korea; snkim2016@gmail.com

    2 Department of Prosthodontics, College of Dentistry, Yonsei University, Seoul
    03722, Republic of Korea; kyungabc@yuhs.ac

    * Correspondence: jee917@yuhs.ac; Tel.: +82-2-22283161; Fax: +82-2-3123598

    † These authors contributed equally to this work.


    **Abstract:** Herein, we used digital superimposition to evaluate the accuracy
    of metal frameworks for mandibular removable partial dentures fabricated using
    three techniques. Thirty master casts of a mandibular dentiform were categorized
    into three groups (n = 10) based on the framework manufacturing method: selective
    laser melting-based metal three-dimensional (3D) printing (SLM), digital light
    projection-based resin 3D printing and subsequent casting (RPC), and conventional
    casting (CON). The master casts were scanned twice, initially after preparation
    and subsequently after attaching silicone using the frameworks. These scan files
    were digitally superimposed to measure the silicone thickness. Statistical analysis
    was conducted using SPSS Statistics (Version 23.0, IBM Corp., Somers, NY, USA).
    One-way ANOVA and a post hoc Tukey’s multiple comparison tests were performed
    to determine differences among the three groups (α = 0.05). The RPC group exhibited
    significantly higher overall and mean internal discrepancies at rest and tissue
    stops than the SLM and CON groups, which exhibited statistically insignificant
    differences. Thus, SLM fabrication resulted in comparable accuracy to that achieved
    by CON, whereas sequentially performing resin 3D printing and casting induced
    inferior accuracy. However, all frameworks across the three groups were clinically
    acceptable.


    **Keywords:** accuracy; removable partial denture framework; selective laser melting;
    superimposition; 3D printing


    # ## 1. Introduction


    Manufacturing methods for the metal frameworks of removable partial dentures (RPDs)
    have recently transitioned from conventional lost-wax techniques to computer-aided
    design (CAD) and computer-aided manufacturing (CAM) techniques, specifically metal
    three-dimensional (3D) printing. Considering the history of the manufacturing
    methods of RPD metal frameworks, the transition to the current direct 3D-printed
    RPD frameworks provides an innovative path. Fauchard first reported the use of
    metal structures in an RPD in 1728, whereby he used metal labial and lingual bars
    to connect two carved ivory blocks of the designed RPD [1,2]. In the late 1890s,
    over 160 years later, the lost-wax casting technique was introduced in dentistry
    to fabricate metal prostheses, including RPD metal frameworks. However, it comprised
    complex procedures, the making of a refractory cast, waxing, investing, and casting,
    thereby requiring a large amount of labor and time [3–5]. Moreover, the distortion
    of the wax pattern on a refractory cast caused inaccuracies in the RPD frameworks,
    which can hinder the success of the RPD treatment [6]. Despite these drawbacks,
    conventional casting techniques were used for over a century until CAD/CAM technology
    was introduced in dentistry in the 1970s, bringing revolutionary changes in the
    manufacturing methods for all components from inlays to RPD metal frameworks [7–11].'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Early CAD/CAM methods involved milling, which is a subtractive technique. However,
    this technique had several disadvantages, such as the wear of cutting tools, complicated
    shapes or undercut areas, wastage of cutting chips, long processing time, and
    shrinkage [12,13]. As such, 3D printing technology has replaced the milling method
    as it bypasses these limitations. It is an additive manufacturing (AM) technique
    that produces 3D objects by adding materials in layers, rendering it highly efficient
    in manufacturing complex-shaped objects [4]. Currently, several 3D printing technologies,
    such as stereolithography (SLA), digital light projection (DLP), selective laser
    sintering (SLS), and selective laser melting (SLM), are used depending on the
    material and energy sources. In this study, SLM and DLP were used [9–11,14].


    SLA was the first 3D printing technique patented in the 1980s and has been used
    to manufacture various objects. It involves using ultraviolet lasers to polymerize
    resin in layer thicknesses ranging from 10 to 100 µm [15,16]. DLP, which was invented
    by Larry Hornbeck of Texas Instruments in 1987 [17], has a resolution and use
    range similar to that of SLA. In fact, DLP and SLA are considered to be in the
    same AM category by the American Section of the International Association for
    Testing Materials [17]. However, the primary difference between these methods
    is the light source, that is, the image is formed by an arc lamp or micromirrors,
    respectively. DLP has a shorter processing time than SLA as the projecting light
    can cure an entire layer at once [16,18]. The number of micromirrors determines
    the resolution of the projected image in DLP [17,19]. SLA was first used to print
    resin sacrificial patterns for RPD frameworks from 3D CAD models in the early
    2000s; however, the method required casting [20]. Later, the direct printing of
    metal RPD frameworks using an SLM 3D printer was achieved, thereby eliminating
    the complex conventional casting processes, except for finishing and polishing
    [21,22].


    SLM involves melting metal powder using a high-energy laser beam, fusing, and
    solidifying it in layers according to the CAD information [14,16]. SLM and SLS
    principles are similar; however, the primary difference between the two methods
    is the material used [14], that is, SLS and SLM are preferred for ceramics/polymers
    and metals, respectively. Meanwhile, Suzuki et al. [13] stated that various materials,
    including metals, could be used in SLS, and the difference between SLS and SLM
    is the method of manipulating the powder. In particular, SLM involves melting
    the powder, whereas SLS entails sintering it. Alageel et al. [22] stated that
    SLM involves the full melting of metal powder, whereas SLS involves its partial
    melting. In this study, the term SLM implies the metal 3D printing technique.


    The use of SLM-fabricated RPD frameworks has increased recently; however, conventional
    casting techniques remain time- and labor-intensive. To generalize the use of
    convenient metal 3D-printed frameworks, the advantageous properties of 3D-printed
    chrome–cobalt (Co–Cr) alloy should be proven, and the accuracy of the frameworks
    should be comparable to that of conventional cast frameworks. Several studies
    have reported that SLM-fabricated Co–Cr alloys have more homogeneous microstructures
    than cast Co–Cr alloys, resulting in enhanced mechanical properties [14,23–27].
    For the accuracy of metal 3D-printed RPD frameworks, recent review articles concluded
    that RPD frameworks fabricated with SLM and conventional casting exhibited similar
    accuracy within the clinically acceptable range [13,27–29]. However, certain studies
    have noted that although the accuracy values are clinically acceptable, the internal
    discrepancies of SLM-fabricated RPD frameworks are larger than those of conventionally
    cast frameworks [30–32]. Moreover, the studies on mandibular 3D-printed RPD frameworks
    are limited. Mandibular RPD frameworks are u-shaped and have a significantly smaller
    contact area with tissue than maxillary RPD frameworks owing to the absence of
    a palatal area, where most of the contact with maxillary RPD frameworks is concentrated,
    which might affect the internal adaptation of the components of RPD frameworks.
    In addition, despite the various methods employed to investigate the accuracy
    of RPD frameworks manufactured through CAD/CAM techniques [30–37], comparative
    studies on the three types of fabrication methods using reliable digital measurements
    are rare. Previous research predominantly compared metal'
  merge: -1
  img_proc: true
- pgno: 100
  md: '3D printing with conventional casting techniques, often relying on point measurements,
    which have higher contingency compared to area measurements.


    In this study, we compared the accuracy of mandibular RPD frameworks fabricated
    using three different methods through digital analysis with area measurement.
    The methods evaluated were SLM-based metal 3D printing, DLP-based resin 3D printing
    followed by casting, and conventional lost-wax casting. The null hypothesis was
    that there would be no significant differences in the accuracy of the three mandibular
    RPD metal frameworks.


    # ## 2. Materials and Methods


    # ### 2.1. Master Cast Fabrication and Evaluation of Trueness


    A Kennedy Class II Modification 1 mandibular dentiform (YS-RPD; M. Tech, Gimcheon,
    Republic of Korea) was used in this study. The dentiform was scanned using a tabletop
    scanner (T500; Medit, Seoul, Republic of Korea) after preparing the rest seats
    and guiding planes for the left second premolar, right first premolar, and right
    second molar. The scanning data were saved as a reference file in standard tessellation
    language (STL). Thirty master casts were fabricated through repeated impressions
    of the dentiform with vinyl polysiloxane (Aquasil XLV; Dentsply Sirona, Konstanz,
    Germany) and pouring with a type 4 ultrahard die stone (Snow Rock Gypsum; DK Mungyo
    Co., Gimhae, Republic of Korea). The master casts were divided into groups of
    10 for metal 3D printing (SLM group); 10 for the combination method, resin 3D
    printing, and casting (RPC group); and the remaining 10 for conventional casting
    (CON group).


    All casts were individually scanned using the same tabletop scanner, and the data
    were saved as STL files. To prove that the master casts of the three groups did
    not differ, every STL file of the 30 master casts was individually superimposed
    over the reference file. The trueness of each master cast was verified using the
    best-fit alignment of the metrology software (GOM Inspect 2018; Carl Zeiss GOM
    Metrology GmbH, Braunschweig, Germany).


    # ### 2.2. Fabrication of RPD Frameworks Using Three Methods


    All 30 RPD frameworks were identically designed to have a lingual bar as a major
    connector, an I-bar-type clasp on the left second premolar, and basic C clasps
    on the right first premolar and second molar. The frameworks of the SLM group
    were designed with CAD software (Dental system 2019; 3Shape A/S, Copenhagen, Denmark)
    after electronic surveying, and the virtual frameworks were printed out directly
    using an SLM technology-based metal 3D printer (NCL-M2150X; Nanjing Chamlion Laser
    Technology Co., Nanjing, China) using Co-Cr alloy powder (ChamTiger; Shinseki
    International Inc., Seoul, Republic of Korea). The support-attached 3D-printed
    frameworks were subjected to heat treatment according to the manufacturer’s instructions
    to release stress and optimize the mechanical properties (Figure 1A). The frameworks
    of the RPC group were designed using the same CAD software; however, the virtual
    frameworks were printed out as resin sacrificial patterns using a DLP technology-based
    resin 3D printer (Pro3D printer SRP1902A; SprintRay Inc., Los Angeles, CA, USA)
    and 3D-printable resin material (S-plastic cast 2.0; Graphy Inc., Seoul, Republic
    of Korea). Conventional investing and casting were performed on the 3D-printed
    castable frameworks (Figure 1B). Finally, for the CON group, the framework design
    was manually drawn on each master cast, and the refractory casts were fabricated
    through impressions of the master casts with a reversible hydrocolloid material
    (Polyflex; Dentsply Sirona, Konstanz, Germany) and pouring (rema Exakt; Dentaurum
    GmbH, Ispringen, Germany). The wax patterns on the refractory casts were invested
    with a phosphate-bonded investment material (BC-VEST P-Plus; Bukwang, Busan, Republic
    of Korea) and cast with the Co-Cr alloy (Biosil F; Degudent, Hanau, Germany) (Figure
    1C). Tissue stops of the CON group were made in the same location as in the SLM
    and RPC groups. The three kinds of mandibular RPD metal frameworks prior to finishing
    and polishing and the 3D-printed resin pattern for the RPC group are presented
    in Figure 2. Finishing and polishing processes were performed on 30 RPD frameworks
    to be adapted to the corresponding master casts. The design procedures were implemented
    by an experienced prosthodontist,'
