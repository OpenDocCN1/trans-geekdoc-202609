  md: 'in hybrid MPs, particularly those created by pulsed-laser deposition (PLD)
    on Cu substrates with yttrium (Y) and, to a lesser extent, magnesium (Mg) thin
    films. These metals have demonstrated higher quantum efficiency (QE) compared
    to Cu, yielding promising results [17–21]. Therefore, we have studied and developed
    new photocathode layouts called “hybrid configuration”, based mainly on thin films
    of Mg or Y [18,21]. In the hybrid configuration depicted in Figure 1a, a layer
    of thin metal film is applied to the central area of the substrate using PLD.
    These films have shown strong adherence and a satisfactory photoemission performance,
    evidenced by their QE [17,22]. However, the laser cleaning process necessary before
    the photoemission effect reduces the thickness of these already thin films (0.1–2
    μm), significantly shortening their lifespan [3,23,24].


    ![](img/7578a5220236942261475fd7af81489e_61_0.png)


    To address this issue, another novel configuration has been introduced [24]. Here,
    the thin film deposited by PLD is designed to improve the bulk material’s photoemission
    and enhance the electrical compatibility with the RF-Gun cavity. This new MP proto-type
    features a Y disk (25 mm diameter, 5 mm thickness) with a thin Cu film, leaving
    a 6 mm middle circular section of the Y substrate exposed as the emitting area,
    as shown in Figure 1b. This configuration allows the photoemission to occur directly
    from the Y bulk, while the RF gun cavity interacts with the surrounding Cu surface.
    This engineered setup integrates the advantageous combination of the high QE and
    low work function (WF) of Y with the necessary electrical compatibility suitable
    for Cu-based NCRF guns.


    An analogous approach has been suggested for SCPs [25]. While pure Nb can function
    as a photocathode material within Nb SRF guns, its low QE limits the electron
    beam intensity [2]. Efforts to enhance SCP performance have included covering
    the Nb bulk with a thin lead (Pb) film [15], which is known as hybrid configurations
    which have also been explored, as illustrated in Figure 1c. However, Pb films
    tend to oxidize when exposed to air, which, although less severe than other semiconductor
    photocathodes, still poses a challenge [26,27]. Like MPs, the main drawback of
    hybrid SCPs is the thinning of materials due to the laser cleaning required to
    rejuvenate the emissive surface. To mitigate this, a similar innovative configuration
    has been proposed for SCPs. This involves a Pb substrate coated by a thin Nb film,
    with the central area masked to serve as the electron source (see Figure 1d).
    This design maintains the cavity’s Q-value and does not compromise the applicable
    electric fields. These special configurations are not necessary to develop semiconductor
    photocathodes, such as gallium arsenide (GaAs) and cesium telluride (Cs2Te) for
    their superior QE compared to traditional metal photocathodes. GaAs, in particular,
    is notable for its negative electron affinity surface, which dramatically enhances
    QE when activated with cesium and oxygen [28,29]. However, these materials often
    suffer from rapid degradation due to chemical reactions with residual gases in
    the vacuum system, which necessitates frequent reactivation [30]. Furthermore,
    the operational lifespan of semiconductor photocathodes can be limited by the
    damage incurred during the high-intensity laser cleaning process, similar to the
    challenges faced with metallic and superconducting counterparts [30]. Advanced
    techniques, such as atomic layer deposition (ALD) and'
