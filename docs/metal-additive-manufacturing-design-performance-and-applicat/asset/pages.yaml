  md: 'direction. This method can be easily implemented by slight modification of
    G-code and requires no modification of the current setup. Method P5 includes no
    specific cleaning besides tilting the machine table by 90 ° for 5 s to let the
    liquid drop off from the milled surface. This method is also easily implementable
    and the fastest, but the cleaning quality is reduced to a very low level.


