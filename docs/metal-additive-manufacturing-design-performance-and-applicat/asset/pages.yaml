  md: '![](img/7578a5220236942261475fd7af81489e_48_0.png)


    Figure 4. Oxide layer formation of the uncoated boron steel due to oxygen contact.


    # 3.2. Oxide Layer


    For a more precise analysis of surface layer changes, the SEM (scanning electron
    microscope) equipment was employed to observe coated and uncoated boron steel
    sheets before and after heating. The equipment used for observations is the QUANTA
    200F (FEI Company, Hillsboro, OR, USA). First of all, point EDS measurements were
    carried out to investigate the composition of the surface scale of the uncoated
    boron steel sheet. Figure 5 shows the result of point EDS measurements of the
    surface scale. The composition of the surface scale was Fe 80.74 wt% and O 19.26
    wt% components, and it reveals that the surface scale is the oxide layer of Fe
    and O.


    ![](img/7578a5220236942261475fd7af81489e_48_1.png)


    Figure 5. Point EDS composition analysis of uncoated boron steel sheets after
    heat treatment.


    The Al-Si-coated specimen was analyzed using EDS mapping in order to investigate
    the change in the composition at the coating layer before and after heat treatment.
    As shown in Figure 6, Al-Si coating layer is transformed into the mixed intermetallic
    layer of Al-Si and Fe after the heat treatment. As shown in Figure 6, fine cracks
    and internal voids are observed in the rough intermetallic layer, which are generated
    during the rapid quenching process. Such compounds are known to have low fracture
    toughness, promoting the formation and growth of fine cracks [24,25]. As a result
    of the diffusion and alloying of components, the coating thickness is increased
    from 19.79 µm to 38.14 µm after heat treatment.'
