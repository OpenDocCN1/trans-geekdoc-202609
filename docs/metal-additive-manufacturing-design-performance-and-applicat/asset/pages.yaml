    # 3.3. Finite Element Analyses


    After the conduction of tribological analyses, the obtained results, notably the
    CoF, were used to accurately simulate the mechanical performance of each designed
    friction pad under realistic loads. Therefore, utilizing the measured CoF for
    each design, the corresponding vertical force was evaluated, as listed in Table
    3. The evaluation process was performed based on the biggest standardized elevator
    system with P + Q = 2600 kg according to Equations (1)–(3). It is obvious that
    the necessary vertical force that should be applied in order to decelerate the
    elevator and eventually stop it is strongly related to the interface CoF. In particular,
    when the CoF at the interface is low, it necessitates an increase in vertical
    force exerted in the opposite direction stressing the braking pad.'
