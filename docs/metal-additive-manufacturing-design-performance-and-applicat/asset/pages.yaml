  md: 'The temperature measured by the pyrometer of the heater was 1320–1340 °C. The
    temperature of the charge leaving the heater is about 10–20 °C higher than that
    measured when the charge is lying on the feeder and waiting to be received by
    the operator. In turn, the working temperature of the tools is 200–250 °C. The
    heated charge material is fed into the roughing pass, in which roughing forging
    takes place by way of two blows, and next, in the finishing pass, one blow is
    performed. The final shape of the product is obtained as a result of hot trimming
    of the forging. A certain problem is the cooling off of the tools during forging,
    which is caused by the small volume of the deformed material with respect to the
    mass of the dies and the insufficient energy provided to the tools as a result
    of deformation and its work being exchanged into heat. In one forging cycle, the
    tools are in contact for a maximum of 0.5 s, whereas during the remaining time,
    the tools cool down as a result of radiation, conduction, and, to a small extent,
    convection with the environment. This is an issue which, in the case of process
    automation, should also be solved in order to ensure prolonged work of the robots,
    without the necessity of frequent heating of the tools. Preliminary plans include
    the use of fast induction heating [49].


    To sum up the performed analyses referring to the current technology, we should
    state that the production of a forging directly from a bar causes the formation
    of excessive flash, which is disadvantageous both with respect to die durability
    and a large material loss. Additionally, forging in a manual system causes a lack
    of stability and repeatability in the process, a decreased efficiency, and also
    translates to a lowered quality of the forged items and the formation of forging
    defects. For this reason, in order to improve the current technology, changes
    and solutions were introduced consisting of the development and design of a new
    tool construction with the consideration of forging in a robotized system. One
    of the implemented solutions is the use of an additional rolling pass for a preliminary
    re-forming of the material and the use of a longer charge in order to ensure the
    so-called tickworm, enabling the grip and holding of the charge/forging by the
    manipulators’ grippers during the robotized forging process. To the current length
    of the input material in the form of a cylindrical bar, taking into account three
    times the length of a single forging together with the technological allowance,
    an allowance should be applied on both sides (about 20–30 mm each) for the so-called
    forceps, which will allow robots to hold the rod on both sides while forging.
    Additionally, a decision was made to reduce the charge diameter from 20 mm to
    18 mm, which should translate to smaller material losses and lowered energy–force
    parameters. Introducing automation and robotization of the currently realized
    technology should make it possible to solve the above problems and bring measurable
    benefits as well as improve the current forging process.


    # 3.2. An Ideal Slug Forging and Rolling Pass


    Before designing the rolling pass, we should first determine the ideal slug forging.
    To that end, we should calculate the section areas of the forging together with
    the flash in the particular areas. As the whole consists of three identical forgings,
    it is enough to calculate the section areas of one forging and next reflect it
    on the others. The assumed initial data are the die model, from which we cut out
    the body of the forging together with the flash, 10 mm wide, which is a sufficient
    value in the aspect of an easy-to-fill (during forging) shape of the connecting
    rod as well as a small height in reference to the width. On this basis, the particular
    section areas of the isolated body of the fogging were determined with respect
    to the length (Figure 4).


    The diagram of the section presented this way was smoothed so that it would be
    possible to use the correlated ideal slug forging for the preparation of the rolling
    pass (Figure 4c). With the data referring to the ideal slug forging, a rolling
    pass for a round bar, 14 mm in diameter, was designed. It was assumed that it
    would be a closed rolling pass, that is, of an elliptical shape. In such a case,
    according to the literature, the width of the pass b (the larger diameter of the
    ellipsis) should correspond to 3/2 of the height h (the smaller diameter of the
    ellipsis). The complete 3D model used to prepare the roller is shown in Figure
    4d. Next, as a result of further research, a roller with a magazine was'
