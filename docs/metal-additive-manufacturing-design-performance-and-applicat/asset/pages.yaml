    # ## 2. Hot Stamping Test Method


    # ### 2.1. Equipment Setup


    Al-Si-coated boron steel is known to prevent the formation of an oxide layer by
    blocking the oxygen contact during the hot stamping process [17]. For using uncoated
    boron steel sheets, the surface quality and property should be investigated to
    observe the oxide layer formation and to ensure the mechanical properties of hot-stamped
    parts.


    An experimental setup, as shown in Figure 1, is constructed in order to reproduce
    the hot stamping process. An atmosphere furnace has the capability of heating
    up to approximately 1000 °C, and a mechanical press can make hat-type specimens
    by using a hot stamping die. A water-cooling chiller is connected to the stamping
    die for rapid cooling, and a thermometer is used to monitor the temperature at
    the stamping die. The 300 mm × 300 mm sample was heated up to 950 °C and stabilized
    for 10 min. After that, they rapidly cooled down to 10 °C or below within 5 s
    for the martensite phase transformation in the die. 22MnB5 1.0 t steel sheets,
    produced by Arcelor Mittal, with and without Al-Si coating layer, were used for
    experiments. The chemical composition and the mechanical strength of 22MnB5 base
    metal are presented in Table 1.


    ![](img/7578a5220236942261475fd7af81489e_46_0.png)


    ![](img/7578a5220236942261475fd7af81489e_46_1.png)


    ![](img/7578a5220236942261475fd7af81489e_46_2.png)


    Figure 1. Main test devices for the hot stamping test.


    Table 1. Chemical compositions and mechanical strength of 22MnB5 base metal.


    | | Chemical Compositions [wt%] | | | | | | | Mechanical Strength [MPa] | |

    |---|---|---|---|---|---|---|---|---|---|---|

    | C | Mn | B | Si | P | S | Cr | Yield Stress | Tensile Stress |

    | 0.24 | 1.10 | 0.003 | 0.26 | 0.014 | 0.001 | 0.14 | 1254 | 1545 |


    # ### 2.2. Test Procedure


    To observe the surface property changes after hot stamping for both uncoated and
    Al-Si-coated materials, specimens were subjected to the same heat treatment conditions.
    The specimens were heated by the controllable atmosphere furnace up to 950 °C
    and stabilized for 10 min. Subsequently, they were quenched and formed simultaneously
    using a 200-ton servo press with a water-cooled die that was pre-cooled to below
    10 °C. The time taken for the material to reach the press was approximately 5
    s. The detailed test procedure is presented in Figure 2.'
