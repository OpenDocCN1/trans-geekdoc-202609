  md: '![](img/7578a5220236942261475fd7af81489e_16_0.png)


    Figure 4. Molten pool shape.


    Through the combination of different processing parameters, a variety of combinations
    are obtained. The influence of processing parameters on the molten pool is shown
    in Figure 5. With the increase of laser power, the depth, width and length of
    the molten pool increase. With the increase of scanning speed, the depth and width
    of the molten pool decrease, and the length of the molten pool decreases first
    and then increases. In the study of Chen [26] and Zhao et al. [27], the influence
    of process parameters on the size of the molten pool is consistent with the rule
    in this study.


    ![](img/7578a5220236942261475fd7af81489e_16_1.png)


    Figure 5. Molten pool size of different processing parameters: (a) 0.03 mm layer
    thickness and (b) 0.04 mm layer thickness.


    The remelting densification mechanism is proposed as a method to eliminate residual
    pores. When the current powder layer is melted, sufficient energy input allows
    the previous layer of powder to melt again, which is beneficial to reduce the
    porosity of the previous layer [28]. Therefore, in order to obtain a good molten
    pool, at least a depth of 2.5 layers of molten pool is required, because the penetration
    depth of 2.5 layers can reduce the porosity by remelting the previous layer. The
    molten pool morphology of different process parameters is shown in Figure 6. Different
    patterns represent different weld pool sizes. The orange square indicates that
    the depth of the molten pool is too shallow, the blue dots indicate that the molten
    pool is too deep, the yellow triangle indicates that the molten pool is too long,
    and the green stars indicate that the size of the molten pool is reasonable. Compared
    with 0.04 mm layer thickness, 0.03 mm layer thickness can produce a more suitable
    molten pool size.'
