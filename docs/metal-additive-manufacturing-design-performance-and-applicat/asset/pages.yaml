    # 2.2. Numerical Simulation


    The thermal behavior of SLM is very complex. To obtain accurate simulation results,
    it is necessary to have the temperature control equation, heat source model, initial
    conditions and boundary conditions. In this study, an Nd: YAG fiber laser was
    used for SLM, and the laser energy density was approximately Gaussian distribution.
    The Gaussian heat source function is shown in Equation (1) [21]:


    ```

    \( q = \frac{2AP}{\pi R_L^2} \exp(-\frac{2r^2}{R_L^2}) \) (1)

    ```


    where A is the laser absorption rate of the powder, P is the laser power, R_L
    is the radius of the laser spot, and r is the radial distance from the node to
    the center of the laser spot.


    In addition, the correct initial conditions and boundary conditions should be
    set. Equation (2) is the initial condition.


    ```

    \( T|_{t=0} = T_0(x,y,z,t) \) (2)

    ```


    where T is the ambient temperature.


    The boundary conditions in the numerical simulation model can be expressed using
    Equation (3) and (4), respectively [22]:


    ```

