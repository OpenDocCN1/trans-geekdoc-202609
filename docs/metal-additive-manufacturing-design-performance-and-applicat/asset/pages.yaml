    # 3. Hot Stamping Test Results


    # 3.1. Surface Investigation


    Hot stamping experiments were performed with hat-type specimens in order to observe
    the growth of the oxide layer and to investigate the surface property of the coated
    and uncoated boron steel sheet. Figure 3 shows test specimens according to the
    coating layer. The specimen with Al–Si coating layer shows only the heat-affected
    color change due to the rapid temperature change during the heating and quenching
    process, and no oxide layer was observed as shown in Figure 3a. This aligns with
    the known characteristic of Al–Si coating preventing the formation of oxide layers
    by blocking contact with the atmosphere after heating [17]. As shown in Figure
    4, the heated material generates an oxide layer due to contact with oxygen in
    the air during the transport process, and after rapid cooling during the component
    forming process, a thick oxide layer exists as shown in Figure 3b.


    ![](img/7578a5220236942261475fd7af81489e_47_1.png)


    Figure 3. Hat-type specimens before and after the hot stamping test: (a) uncoated
    material; (b) coated material.'
