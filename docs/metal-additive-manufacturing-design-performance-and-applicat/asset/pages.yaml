    # 4. Discussion


    An important parameter in this process is the temperature after cladding, before
    milling, and after milling, which can affect the porosity and microstructure of
    the parts. The specimen surface temperature after cladding was similar for all
    specimens due to the same process parameters and, therefore, was not considered.
    After cladding, there was a dwell time applied for about 15 min for technological
    reasons (tool change, part height measurement, etc.), when the specimens cooled
    down to temperatures below 50 °C. Also, a coolant was used during the milling
    process which ensured that the temperature was reduced without further affecting
    the material structure. This also ensured that the temperature of the specimen
    surface after milling and before the start of the cladding of the next segment
    was in the ambient temperature range.


    Regarding the laser cleaning method, it may be noted that laser surface treatment
    involves high-temperature thermal processing, which can critically impact the
    final product quality. High temperatures can lead to thermal erosion and surface
    imperfections, such as micro-cracks and cavities, limiting the practical applications
    of laser processing [21]. However, in this work, the laser parameters were chosen
    to minimize the thermal effects'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'but, at the same time, effectively remove the liquid from the investigated
    area. No remelted layer or defects due to laser influence are observed on cross-sections
    of P4 specimens.


    It is important to control the porosity level since it has a negative effect on
    the mechanical properties [22,23]. According to the porosity analysis, it can
    be concluded that the cutting liquid has a negative influence on the quality of
    the interface in the segmental cladding. The reference specimen P1 shows higher
    porosity values, probably due to the fact that the surface is rough (typical for
    the DMD process). The air or laser-assisted cleaning methods showed almost the
    same effectiveness in reducing porosity. The specimen with ethanol cleaning showed
    the lowest porosity value. The specimen P5 shows the highest porosity values.
    Porosity is probably formed due to the vapourising liquid bubbles trapped in the
    molten material. Therefore, the different cleaning methods showed comparable effectiveness
    as they removed cutting liquid from the surface.


    Analysis of carbon content did not detect increased values at the interface in
    any of the samples studied. The assumption of carbon saturation of the alloy is
    related to the composition of the lubricant—consisting of more than 80% carbon.
    These results may be due to the fact that the lubricant present in the cutting
    fluid evaporates in the process faster than the diffusion of carbon into the alloy.


    For high-performance materials like Inconel 718, manufacturers strive to reduce
    hydrogen levels to below 1 ppm if possible, especially for critical applications
    [19]. Control of the hydrogen level is important due to the risk of hydrogen embrittlement
    [24,25]. The hydrogen content analysis showed that the hydrogen concentration
    in the specimens is slightly elevated for this material. Ideally, keeping the
    hydrogen content as low as possible minimises the risk of hydrogen embrittlement.
    Sample P5_5 showed an increased hydrogen content of up to 3 ppm, which, in accordance
    with the data from the research [10], can lead to a decrease in fracture strain
    from 40% to 30% being attributed to hydrogen embrittlement. The elevated hydrogen
    content in specimens produced with 5% lubricant at the interface could be due
    to the vaporization and dissociation of water and oil in the plasma created by
    the laser beam. Hydrogen is then resolved in the metal melt pool.


    These defects can seriously affect the strength and durability of the material,
    especially in critical applications where high reliability is required. The importance
    of controlling the hydrogen content cannot be overestimated, as even a slight
    increase in the content of this element leads to a significant reduction in the
    ductility of the alloy through the mechanism of hydrogen embrittlement. The results
    of the study emphasise the need for the implementation of cleaning methods prior
    to cladding in the studied process to reduce porosity and hydrogen uptake.


    # ## 5. Conclusions


    The results obtained allow a comparison of segment-by-segment cladding without
    and with the use of milling between segments, as well as different methods of
    cleaning the obtained interface. The following conclusions can be drawn:


    +   - It is important to perform the top milling of the “base” segment in a segment-by-segment
    DMD process as it flattens the surface, resulting in a higher interface quality;

    +   - In terms of porosity, tilting of the machine table has been shown to be
    the least effective compared to all the other applied methods. Air blasting and
    laser-assisted cleaning methods have proven effective in reducing porosity and
    can be relatively easily implemented in the existing process chain as it can be
    automated. Ethanol cleaning has shown the best results in this respect but is
    the most economically unfavourable solution due to the difficulties in automation
    and implementation in a continuous process;

    +   - Cleaning the part surface is necessary not only to reduce porosity but also
    to reduce hydrogen saturation on the surface, which can lead to hydrogen embrittlement.
    This effect is more pronounced with an emulsion than with a pure lubricant because
    of the significant influence of water in this liquid.'
