- pgno: 106
  md: 'single experienced board-certified laboratory technician to minimize the undesirable
    effect on the result of this study. If the processes that need to be applied equally
    to all samples, such as finishing and polishing, were carried out by different
    technicians, it would be difficult to ensure accurate comparisons among the groups
    since this study was based on an experiment requiring group comparison under the
    same conditions. Lastly, the manual designation of the border lines of the measurement
    areas can affect the measurement values finely. Owing to the nature of digital
    measurement in the metrology program, the value changes finely each time it is
    measured depending on the selected location. Therefore, we conducted measurements
    multiple times with careful selection of the border lines.


    However, to date, metal 3D printing using SLM technology is the most convenient
    method for manufacturing RPD frameworks, which can reduce the time and labor required
    for conventional laboratory processes. To produce more accurate RPD frameworks
    than conventional cast frameworks, further studies using various metal 3D printers
    and software programs are essential. Further, more in vivo studies on the accuracy,
    fitness, and longevity of metal 3D-printed RPD frameworks are needed until the
    use of metal 3D-printed RPD frameworks becomes generalized.


    Overall, the following conclusions were drawn in this study: (1) SLM-fabricated
    RPD frameworks exhibited an overall accuracy similar to that of conventional cast
    RPD frameworks; and (2) a combined method of resin 3D printing and casting demonstrated
    inferior accuracy. However, all frameworks in the three groups were clinically
    acceptable.


