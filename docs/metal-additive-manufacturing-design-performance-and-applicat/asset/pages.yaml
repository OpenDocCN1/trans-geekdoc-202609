  md: 'After the roughness analysis of the 3D-printed surface of the developed friction
    pads, the next step was the conduction of tribological analysis. All specimens
    were examined under the same conditions and indicative images from this process
    are illustrated in Figure 7 for the car-tire-like pad (a) and for the honeycomb
    pad (b). It is obvious that the direction of the probe is the same as the elevator
    movement direction in order to obtain relatable tribological results.


    ![](img/7578a5220236942261475fd7af81489e_118_0.png)


    Figure 7. Indicative images of the (a) car-tire-like and (b) honeycomb friction
    pads during the pin-on-disc tribological tests.


    Based on the tribological analysis, the honeycomb and honeycomb speckled configurations
    exhibited coefficients of friction (CoF) of 0.317 and 0.372, respectively. Remarkably,
    these values suggest a nearly identical pattern in their tribological behavior,
    owing to their closely matched CoF. However, the speckled variant displayed a
    slightly elevated CoF, likely attributable to the presence of speckles on its
    surface. This subtle distinction underscores the influence of surface texture
    on frictional dynamics, accentuating the importance of detailed analysis in tribological
    investigations. In the length of the sliding distance, we discern an excitation
    in Figure 8 due to the gap among the cells. For the extended honeycomb configuration,
    three excitations were observed, with the maximum CoF reaching 0.6. Additionally,
    the average CoF remained notably high, approximately around 0.459. In the car-tire-like
    configuration, the CoF is notably higher, reaching 0.549. This marked increase
    in CoF value highlighted the unique characteristics of the car-tire-like pattern,
    wherein its structural intricacies likely contributed to heightened frictional
    interaction. The car-tire-like pattern demonstrates the highest CoF, surpassing
    all the other configurations, solidifying its position as the configuration with
    the highest frictional propensity. This distinction underscores the diverse tribological
    behaviors manifested across different configurations, each bearing its own signature
    of frictional response.'
