- pgno: 51
  md: 'cooling. The hardness differences at various measurement locations were not
    considered significant when taking into account the scatter in the data, suggesting
    that the impact of the contact conditions between the die and the material on
    hardness is minimal. Despite the differences due to the presence or absence of
    a coating layer and contact conditions, the hat-type specimen can achieve the
    desired tensile strength in all areas.


    ![](img/7578a5220236942261475fd7af81489e_51_0.png)


    Figure 10. Vickers hardness of uncoated and coated boron steel sheets.


    # 3.4. Summary


    For the boron steel with Al–Si coating, as expected, no oxide layer was observed
    on the surface during the heat treatment and hot stamping processes. However,
    microcracks and pores were identified within the coating layer due to the different
    thermal expansion coefficients. Additionally, the elements clearly distinguished
    in the coating layer before heat treatment diffused during the heat treatment,
    forming a Fe3(AlSiFe) alloy layer inside the coating layer, which could potentially
    compromise the weldability. The coating thickness also increased approximately
    two-fold. On the other hand, the uncoated boron steel exhibited irregular and
    uneven oxide layers on the surface when exposed to the atmosphere during the heat
    treatment process. Hot stamping simulation tests revealed that the oxide layer
    thickness could be preserved, peeled off, or compressed according to the die shape.
    The oxide layer thickness was observed to be over 20 μm, which could cause weldability
    issues in the assembly process of automotive parts. The use of uncoated steel
    sheets is expected to be advantageous for securing material strength.


    During the hot stamping process using uncoated 22MnB5 material, the oxidation
    reaction was most pronounced at the point of material transfer. This observation
    indicated that the material, upon being heated and transferred, came into contact
    with atmospheric oxygen, leading to the initiation and rapid growth of the oxide
    layer. Therefore, to ensure the surface quality of uncoated 22MnB5 material during
    hot stamping, controlling the contact between the heated material and oxygen during
    transfer is crucial for maintaining surface quality. Therefore, further research
    on new forming technologies is needed to suppress the formation of oxide layers
    in order to ensure the surface quality and weldability of uncoated steel sheets.'
