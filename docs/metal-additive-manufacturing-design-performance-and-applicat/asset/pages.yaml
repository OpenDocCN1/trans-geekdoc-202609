    the dendritic structure.


    # 4.2. Crack Analysis


    The size of the welding heat input significantly influences the stress levels
    in the workpiece; generally, higher heat input leads to increased stress [40].
    In this study, cracks occurred in the prepared composites at a deposition current
    of 50 A. As the deposition current increases, the high-temperature residence time
    is prolonged. SEM-EDS analysis of the composite material reveals the presence
    of MC carbides along the dendrite axis, indicating that these carbides precipitate
    during the solidification of liquid metal. The presence of MC carbides contributes
    to stress concentration in the workpiece, which can deteriorate its mechanical
    properties. Additionally, the presence of Laves phases also impacts the mechanical
    performance of the workpiece.


    Microstructural analysis of the composites under different deposition currents
    reveals that at a deposition current of 50 A, there is a significant presence
    of Laves phases in both the interdendritic regions and along the dendrite axes.
    The presence of these Laves phases predisposes the workpiece to liquefaction cracking,
    adversely affecting its mechanical properties. Furthermore, SEM and EDS analyses
    of the fractured sections indicate that the failure mode is a cleave fracture,
    with a substantial presence of secondary phases detected at the fracture site.
    Solidification precipitation analysis suggests that these secondary phases primarily
    consist of the Laves phase, Ni3Ti, and TiNi. XRD analysis also indicates the presence
    of Fe2Ti and Cr2Ti in the composite. It has been documented that the Fe2Ti, Ni3Ti,
    and Cr2Ti phases are brittle intermetallic compounds [41,42]. The combined influence
    of the Laves phase and these secondary phases contributes to the crack formation
    in the composite.


    # 4.3. Hardness Analysis


    The microhardness of the composite increases with the increase in the deposition
    current. The secondary phase precipitation will also affect the microhardness
    of the composite. When the deposition current is small, the secondary phases such
    as Ti-Cr and Ti-Fe in the composite are less precipitated. When the deposition
    current increases, more secondary phases are generated, which increases the microhardness
    of the composite. In addition, the dendrites of the material are often filled
    with crystals with high solute content, resulting in segregation, which will affect
    the mechanical properties of the alloy, and the smaller the dendrite spacing,
    the more favorable the alloy properties [43]. The secondary dendrite'
