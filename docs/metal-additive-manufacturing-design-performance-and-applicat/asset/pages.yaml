- pgno: 58
  md: 'welding quality. Future research should focus on determining the optimal oxygen
    control conditions by analyzing the correlation between oxide layer formation
    and welding quality.


    # 5. Conclusions


    This study aimed to compare and analyze the surface property changes of boron
    steel during the hot stamping process, depending on the presence or absence of
    Al–Si coating, and to develop an atmosphere-controlled hot stamping technology
    for applying uncoated boron steel to ultra-high-strength automotive parts. Hot
    stamping experiments using a hat-shaped specimen showed that while no oxide layer
    formed on the Al–Si-coated steel, a thick oxide layer was observed on the uncoated
    steel due to exposure to atmospheric oxygen at high temperatures. This oxide layer
    not only deteriorates the surface quality of the uncoated steel but also significantly
    hinders weldability during the assembly of automotive parts. Surface hardness
    analysis revealed that the Vickers hardness of uncoated steel was, on average,
    32 Hv higher than that of Al–Si-coated steel, suggesting that uncoated steel may
    be more advantageous for securing part strength. However, the formation of a thick
    oxide layer poses a significant risk to weld quality, making process technology
    to suppress oxide formation essential for the practical application of uncoated
    steel.


    To address this issue, a new lab-scale hot stamping simulator was developed. This
    equipment was designed to perform forming experiments in an environment where
    the amount of oxygen in the atmosphere could be controlled to suppress oxide layer
    formation. The system uses a donut-shaped induction heating coil to heat the material
    to over 1000 °C and quickly transfer it to a forming die for rapid cooling and
    shaping through an automated transfer system. The oxygen concentration in the
    simulator was controlled using nitrogen gas and a vacuum pump, allowing the analysis
    of oxide layer formation under various oxygen levels. The experiment results showed
    that when the oxygen level in the atmosphere was below 6%, the thickness of the
    oxide layer decreased significantly, and in near-vacuum conditions, almost no
    oxide layer formed. These findings indicate that controlling the oxygen concentration
    can effectively suppress oxide layer formation in uncoated steel, improving both
    surface quality and weldability.


    In conclusion, this study confirms that for uncoated boron steel to be applied
    in ultra-high-strength automotive parts, effective oxygen control during the hot
    stamping process is essential. By implementing such technology, it is expected
    that manufacturing costs can be reduced while simultaneously ensuring the strength
    and weld quality of uncoated steel parts.


