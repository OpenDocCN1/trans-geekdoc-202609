- pgno: 121
  md: '# 4. Conclusions


    In the current study, elevator progressive safety gear pads with bio-inspired
    contact surface structures were designed and developed in order to increase their
    durability and efficiency. More specifically, four different friction pads with
    embedded bio-inspired surface lattice structures were designed on the template
    of the conventional pad, namely the honeycomb, speckled honeycomb, extended honeycomb,
    and car-tire-like structures. Then, these designs were additively manufactured
    utilizing the SLM 3D printing technique in order to assess their compatibility
    with the existing system and experimentally evaluate their tribological behavior.
    The results revealed that the pads with high contact surface area, i.e., car-tire-like
    and extended honeycomb structure, possess high CoF with 0.549 and 0.459, respectively.
    Moreover, in the context of this paper, FEMs were developed according to the tribological
    behavior of each designed friction pad. The results of the numerical analyses
    showed that the friction pads with high CoF exhibit lower stress, increasing the
    durability and efficiency of the part. In addition, all designs were compared
    with the conventional friction pad and revealed superior performance. Then, through
    the conducted FEA, the developed friction pads experienced significantly lower
    stress than the construction material strength paving the way for further experimental
    evaluation through actual application to elevator progressive safety gear. To
    conclude, it is expected that the reduced loads and stress that the new designs
    exhibited will increase the number of uses of the braking pads, increasing their
    life cycle and reducing the maintenance cost and downtime of an elevator system.
    In addition, the uniform distribution of the stresses deriving from the applied
    braking force indicates smoother contact between the pads and the guide rails
    mitigating the risk of deforming them.


