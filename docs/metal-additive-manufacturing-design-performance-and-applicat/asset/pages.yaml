    # ## 3.4. SEM and Element Content Analysis


    To investigate the tissue composition of samples deposited under various current
    conditions, scanning electron microscopy (SEM) and energy dispersive spectrometry
    (EDS) point analyses were conducted on each deposited layer. The detailed results
    are presented in Figure 7 and Table 4. By combining the information from Figure
    4a, Figure 7a,e, and Table 4, it can be concluded that the black phase (P1) between
    the columnar crystals exhibits the highest carbon (C) content, suggesting the
    presence of MC carbide. MC carbides play a crucial role in nickel-based alloys.
    Even a small amount of MC carbides can enhance strength by inhibiting dislocation
    movement and stabilizing grain boundaries [15]. At the position corresponding
    to the crystal axis (P2), the concentrations of Ni, Cr, and Fe are elevated. This
    may be attributed to the low deposition current in the WAAM process, which leads
    to a rapid cooling rate and results in an uneven distribution of Ti and Ni in
    the molten pool. Therefore, Ni and Ti do not fully integrate, with some Ti diffusing
    into the matrix and forming a eutectic structure. Consequently, when the deposition
    current is set at 35 A, a small amount of the TiNi phase is formed. In the precipitated
    phase (P3), the Ti content is 68.52 at%, while the Ni content is 23.47 at%. This
    suggests that the precipitated phase may consist of Ti2Ni particles.


    As the electric current increases, the columnar crystal structure in the deposited
    layer gradually differentiates, as illustrated in Figure 7b. Figure 7f provides
    a localized magnification, revealing numerous small “villous” structures at the
    grain boundaries (P5). According to energy dispersive spectroscopy (EDS) scanning
    analysis, the concentrations of Ti, Ni, Cr, and Fe do not show significant differences.
    This phenomenon may be attributed to the increased heat input, allowing the Ti
    in the molten pool to fully diffuse and form intermetallic compounds with Ni,
    Cr, and Fe. Thus, it can be inferred that this “fluff”-like phase may consist
    of a eutectic structure composed of Ti, Ni, Cr, and Fe elements. At the P4 position
    of the grain (Figure 7f), the Ti element content is significantly higher than
    the Ti element content at the P2 position (Figure 7e). This may be attributed
    to the increased heat input associated with the higher current, which facilitates
    the binding of Ti atoms to Ni atoms. Consequently, the increased heat input promotes
    atomic diffusion and enhances the formation of compounds with other atoms. The
    concentrations of Ti, Cr, and Fe atoms in both the dendrite axis and interdendritic
    structure are similar. By correlating this with the X-ray diffraction (XRD) data,
    it can be inferred that Ti atoms interact with Cr, Fe, and Ni atoms to form intermetallic
    compounds such as Cr2Ti, Fe2Ti, and TiNi. Additionally, Nb and Mo atoms are not
    detected in the grains (P4). This may be attributed to the diffusion of heavy
    elements, such as Nb and Mo, into the interdendritic region during solidification,'
