- pgno: 22
  md: '# 6. Conclusions


    In this study, the processing parameters were optimized via numerical simulation.
    The temperature and residual stress distribution of different cell lattice structures
    were studied using the optimization results. The compression performance of the
    lattice structure was tested. The following main conclusions are drawn:


    +   (1) The influence of different processing parameters on the molten pool and
    porosity were studied, and the optimization was carried out based on this. The
    optimized parameters were: laser power 300 W, scanning speed 1000 mm/s, powder
    thickness 0.03 mm and scanning spacing 0.1 mm.


    +   (2) The thermal behavior evolution of the Ti6Al4V lattice structure in the
    SLM forming process was studied. The high temperature parts of the three structures
    are all on the lower side of the node and its adjacent pillars, and the closer
    to the node, the higher the temperature. The temperature of the Dode structure
    reaches the highest, followed by the BCC structure, and the smallest is the FCC.


    +   (3) The node of the lattice structure is the main area of residual stress
    distribution, which is closely related to the high temperature distribution at
    the node. From the residual stress in different directions, the residual compressive
    stress exists at both ends of the part. The residual stress in the X and Y directions
    is close, and the residual stress in the Z direction has the greatest influence
    on the forming process. Moreover, the residual stress of the lattice structure
    of different cells is significantly different. The residual stress of Dode is
    the highest, reaching 1218.2 MPa. FCC is the second, and BCC is the lowest.


    +   (4) The compression performance of different cell lattice structures is very
    different. The Dode structure has the highest elastic modulus and compressive
    strength, reaching 478.72 MPa and 32.25 MPa, showing the best compression performance
    among the three.


