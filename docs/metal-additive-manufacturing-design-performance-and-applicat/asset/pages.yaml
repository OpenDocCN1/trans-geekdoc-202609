  md: '# # Various Configurations for Improving the Efficiency of Metallic and Superconducting
    Photocathodes Prepared by Pulsed Laser Deposition: A Comparative Review


    Alessio Perrone 1,2, Muhammad Rizwan Aziz 3,* and Francisco Gontad 3


    +   1 Dipartimento di Matematica e Fisica “E. De Giorgi”, Università del Salento,
    73100 Lecce, Italy; alessio.perrone@unisalento.it

    +   2 INFN-Istituto Nazionale di Fisica Nucleare, 73100 Lecce, Italy

    +   3 Laser Applications Centre, Asociación de Investigación Metalúrgica del Noroeste,
    36410 Porriño, Spain; francisco.gontad@aimen.es

    +   * Correspondence: muhammadrizwan.aziz@unisalento.it


    Abstract: This paper presents an innovative exploration of advanced configurations
    for enhancing the efficiency of metallic and superconducting photocathodes (MPs
    and SCPs) produced via pulsed laser deposition (PLD). These photocathodes are
    critical for driving next-generation free-electron lasers (FELs) and plasma-based
    accelerators, both of which demand electron sources with improved quantum efficiency
    (QE) and electrical properties. Our approach compares three distinct photocathode
    configurations, namely: conventional, hybrid, and non-conventional, focusing on
    recent innovations. Hybrid MPs integrate a thin, high-performance, photo-emissive
    film, often yttrium or magnesium, positioned centrally on the copper flange of
    the photo-injector. For hybrid SCPs, a thin film of lead is used, offering a higher
    quantum efficiency than niobium bulk. This study also introduces non-conventional
    configurations, such as yttrium and lead disks partially coated with copper and
    niobium films, respectively. These designs utilize the unique properties of each
    material to achieve enhanced photoemission and long-term stability. The novelty
    of this approach lies in leveraging the advantages of bulk photoemission materials
    like yttrium and lead, while maintaining the electrical compatibility and durability
    required for integration into RF cavities. The findings highlight the potential
    of these configurations to significantly outperform traditional photocathodes,
    offering higher QE and extended operational lifetimes. This comparative analysis
    provides new insights into the fabrication of high-efficiency photocathodes, setting
    the foundation for future advancements in electron source technologies.


    Keywords: quantum efficiency; pulsed-laser deposition; thin films; metallic and
    superconducting photocathodes; photocathode configuration


    Citation: Perrone, A.; Aziz, M.R.; Gontad, F. Various Configurations for Improving
    the Efficiency of Metallic and Superconducting Photocathodes Prepared by Pulsed
    Laser Deposition: A Comparative Review. Materials 2024, 17, 5257. https://doi.org/10.3390/ma17215257


    Academic Editors: Gulkoheng Quan, Nikolaos Kladovasilakis, Konstantinos Tsongas
    and Dimitrios Tzetzis


    Received: 24 July 2024

    Revised: 30 September 2024

    Accepted: 25 October 2024

    Published: 29 October 2024


    # # 1. Introduction


    Research into traditional metallic photocathodes (MPs) and superconducting photocathodes
    (SCPs) has attracted considerable attention due to their ability to generate high-brightness
    electron beams, their fast photoemission, which leads to a low temporal spread,
    the larger availability of electrons leading to the shortest time between electron
    pulses, or better electrical coupling with metallic cavities [1–5]. These technologies
    play crucial roles in the latest X-ray spectrum free-electron lasers (FELs) and
    are pivotal for advancements in particle-driven plasma wakefield accelerators
    [6–11]. The ongoing demand for electron beams characterized by high peak currents
    and minimal dark emittance has prompted researchers to explore alternative materials,
    moving beyond the conventional use of copper (Cu) and niobium (Nb) in Normal-Conducting
    Radio Frequency (NCRF) and Superconducting Radio Frequency (SRF) guns [12–16].
    Recent years have seen progress


