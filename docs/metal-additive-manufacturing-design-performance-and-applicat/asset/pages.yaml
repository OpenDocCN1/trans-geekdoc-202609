  md: 'VHX-1000 digital microscope (Keyence, Osaka, Japan). Kalling II was used as
    an etchant to reveal the microstructure. In the polished condition, the porosity
    was determined from ten cross-sections by image analysis with the software ImageJ
    (version 1.51p, ImageJ, Bethesda, MD, USA).


    A Zeiss EVO 10 scanning electron microscope (SEM, Carl Zeiss AG, Jena, Germany)
    equipped with an Oxford Instruments X-MaxN detector for energy-dispersive X-ray
    spectroscopy (EDS, Oxford Instruments, Abingdon, UK) was used for SEM and EDS
    analysis of the specimens. The EDS method can be used for qualitative analyses
    of light elements (B, C, etc.), although even quantitative analyses can be performed
    with a proper selection of parameters [20].


    # 2.4. Hydrogen Measurement


    Hydrogen content determination was conducted using the hot gas extraction (HGE)
    method on the LECO ONH 836 (LECO, Ann Arbor, MI, USA) machine. At least three
    specimens (~0.5 g mass of each specimen) were extracted and measured for each
    DMD cube for hydrogen determination. The specimens were extracted from the middle
    of the specimen from the interface zone.


    To calculate the hydrogen concentration change in the specimen over time, Fick’s
    diffusion law calculations were performed. Fick’s Laws of Diffusion provide the
    foundational principles for describing the transport of atoms within a medium.
    Fick’s First Law states that the flux of atoms moves from regions of high concentration
    to low concentration, proportional to the concentration gradient. Mathematically,
    it is expressed as:


    ```

    J = -D \frac{\partial C}{\partial x}, \quad (1)

    ```


    where J is the diffusion flux, D is the diffusion coefficient, C is the concentration,
    and x is the spatial coordinate.


    Fick’s Second Law, which is derived from the first law under the assumption of
    a constant diffusion coefficient, addresses the change in concentration over time:


    ```

    \frac{\partial C}{\partial t} = D \frac{\partial^2 C}{\partial x^2} \quad (2)

    ```


    This equation describes how diffusion causes the hydrogen concentration to evolve
    within the Inconel 718 specimen.


    The diffusion process was modelled using a Gaussian distribution, centred at the
    middle of the specimen with an offset of 0.4 mm, to represent the hydrogen concentration
    profile. This assumption represents the increased H concentration in the layer
    below the interface. The Gaussian model was chosen for its physical relevance
    in many diffusive processes. The concentration profile at any position x and time
    t was estimated using the equation:


    ```

    C(x, t) = C_{m,init} exp \left( - \frac{(x)^2}{2 \sigma_0^2} \right) \quad (3)

    ```


    where C_{m,init} is the peak concentration at the initial time.


    The peak concentration was adjusted based on the spread of the distribution to
    ensure mass conservation:


    ```

    C_{m,init} = C_{m,current} \times \frac{\sigma_{current}}{\sigma_0} \quad (4)

    ```


    where \sigma_{current} is the standard deviation after the selected time, calculated
    as \sigma(t) = \sqrt{4Dt}.


