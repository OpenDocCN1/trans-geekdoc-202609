    # ## 4. Discussion


    # ### 4.1. Solidification of Composite Materials Under Different Deposition Currents


    In the composite materials prepared by Ti6Al4V and Inconel 718 alloys, the intermetallic
    compounds are mainly dominated by the Ti-Ni binary system. Figure 12 shows the
    Ti-Ni binary phase diagram [31]. According to the analysis of the Ti-Ni binary
    phase diagram, when the content of Ti and Ni atoms is close to 1:2, the eutectic
    reaction will occur, and new phase TiNi and Ni3Ti metal compounds will be formed
    in the composite material. However, Inconel 718 alloy contains more elements,
    and in the WAAM process, elements other than Ni in Inconel 718 alloy will still
    combine with Ti elements to form Ti-Fe phase and Ti-Cr phase. It has been reported
    that Fe2Ti metal compounds are described as the C14_LAVES phase [32] in crystallography,
    while Cr2Ti metal compounds are also described as the Laves phase [33].


    The theoretical basis of the thermodynamic calculation is the CALPHAD method (computational
    phase diagram) [34]. When the Gibbs energy of the whole system is at its minimum,
    the system is in equilibrium. In some regions, the equilibrium state may be a
    mixture of various phases or simply a stable single phase. In a multicomponent
    system, the Gibbs energy of the phase can generally be expressed by the following
    equation:


    $$ G_m = \sum_i x_i G_i^o + RT \sum_i x_i ln x_i + \sum_i \sum_j > 1 x_i x_j \sum_V
    \Omega_V (x_i - x_y)^2 \quad (3) $$


    where $G_m$ is the Gibbs energy of the phase, $\sum_i x_i G_i^o$ is the Gibbs
    energy of pure components, $RT \sum_i x_i ln x_i$ is the ideal entropy, $\sum_i
    \sum_j > 1 x_i x_j \sum_V \Omega_V (x_i - x_y)^2$ is a paired interaction term
    with interaction parameters, $x_i, x_y$ are the molar fraction of the different
    alloy components, $T$ is temperature, and $R$ is a gas constant. $\Omega_V$ is
    the interaction coefficient that depends on the value of $V$. When the value of
    $V$ provides values of 0 and 1, it corresponds to the normal solution model. In
    practice, the value usually does not exceed 2 [35].


    The equilibrium phase diagram of multicomponent alloy and the fraction of phase
    equilibrium at each temperature can be calculated by the thermodynamic calculation
    principle [36]. Although there is a deviation between the non-equilibrium heating
    and cooling process and the theoretical temperature in the equilibrium state,
    the relative magnitude relationship between each temperature is unchanged, so
    the theoretical temperature in the equilibrium state can be used to analyze the
    solidification and precipitation of each phase in the cooling process.


    In this work, EDS analysis was carried out on the dendrite axes and interdendrites
    in the composite materials under different deposition currents, the average alloying
    elements contents were obtained, and the solid–liquids theoretical temperature
    was calculated to obtain the precipitation temperature of the corresponding components.
    The results show that no Laves phase is found in the composite prepared when the
    deposition current is 35 A, that is, no Laves phase is precipitated during the
    cooling process. During the cooling process, $\gamma$, $\eta$, and BCC phases
    were precipitated from the dendritic axis. It has been reported that the $\eta$
    phase is an intermetallic compound phase based on the Ni3Ti component [37]. The
    structure of BCC is body-centered cubic, and the structure of the TiNi phase is
    reported to be body-centered cubic [31].


    Figure 12b shows the mass fraction and temperature curves of precipitation and
    liquefaction of $\gamma$ phase, $\eta$ phase, and BCC phase calculated under the
    equilibrium state when the deposition current is 35 A. It can be seen that the
    liquid phase temperature of the dendrite axis is high, so the dendrite axis solidifies
    first in the cooling process, and'
