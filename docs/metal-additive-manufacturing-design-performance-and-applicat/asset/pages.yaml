    The obtained test results referring to the microstructure confirm that introducing
    process robotization into the current technology has no negative effect on the
    microstructural changes, as the grain size, as well as the hardness and microstructure,
    are according to the requirements. In turn, referring to the grain size results
    obtained from the technological trials to FEM, we can state that the grain size
    is one grade lower (5 according to ASTM, that is about 65 µm) with respect to
    the modeling results (6 according to ASTM, that is 40 µm). On this basis, we can
    state that automatizing the current forging process realized in a multiple system
    through a transfer from a manual to an automatized process brings only advantageous
    aspects (dimension–shape precision and microstructure) as well as additionally
    ensures stability and repeatability of the production process. This said, before
    introducing the newly developed forging technology into series production, further
    tests and investigations should be carried out under industrial conditions.


    # 5. Conclusions


    The study presents the results referring to an improvement as well as the possibilities
    of introducing robotization into the currency-realized technology of precision
    forging on a hammer to produce connecting rod forgings with the use of mainly
    numerical modeling. Based on the analysis of the state of the art, it was proven
    that the available literature provides hardly any thorough studies or solutions
    for robotized forging seats; what is more, robotization cannot be treated as a
    universal solution. For this reason, the article has proposed a solution of optimizing
    the presently realized process of forging connecting'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'rod forgings with the consideration of the aspects of robotization, e.g., by
    way of developing an additional rolling pass, reducing the diameter and mass of
    the charge material, and holding the charge/slug forging by robots’ grippers.
    The investigations included a complex analysis of the present forging technology
    to determine the key areas requiring improvement/changes and next designing a
    new tool construction and modeling the technology by means of the calculation
    package Forge 3.0 NxT through multi-variant numerical simulations of the newly
    developed forging process. The obtained results have been verified under industrial
    conditions and correlated with respect to the forgings obtained in the technology
    realized so far. The attempts at introducing robotization aimed mostly at making
    the present manual process stable and repeatable, which would increase the quality
    of the forgings and at the same time reduce the rejection rate as a result of
    eliminating the errors produced by the operator. The obtained results of technological
    tests have confirmed that the introduced and then implemented changes were proper
    and brought measurable benefits. Both the dimension-shape accuracy and the hardness
    and microstructure are according to the requirements. The additional rolling pass
    reduced the forging forces and energy by over 30% and decreased the number of
    hammer blows by one, with respect to the manual process, which should also translate
    to an increased hardness of the forging instrumentation. This said, in order to
    ultimately verify the elaborated solution, it is necessary to perform further
    examinations and tests including a much longer operation time. It should also
    be emphasized that the presented results point to a big potential of the use of
    numerical modeling methods, as it currently enables full analysis of the process
    (including simulation of the microstructure development) as well as improvement
    of the given forging process.


