    # 4.3. Evaluation of Oxide Layer


    Forming tests on hat-type specimens made of uncoated steel sheets were conducted
    using a lab-scale hot stamping simulator, with heating and pressure control, to
    examine the effects of oxygen levels. After stabilizing the atmosphere according
    to the oxygen level, the material was heated by an induction coil, transferred
    to the hot stamping die by an automatic transfer device, and then formed into
    a hat-type specimen inside the die using water cooling. To observe the amount
    of oxide layer formation based on oxygen levels, forming tests were conducted
    under oxygen conditions of 0% (vacuum-like), 2%, 4%, 6%, and 21% (atmosphere),
    as shown in Figure 18. Under the vacuum-like condition, almost no oxide layer
    was observed. However, as the oxygen level increased, the amount of oxide layer
    also gradually increased, and at 6% oxygen, the oxide formation was almost similar
    to that observed under atmospheric conditions.


    For a more quantitative observation, samples were taken from the top area under
    different oxygen conditions because the top area is the most susceptible to oxide
    layer formation. The thickness of the oxide layer was measured using an optical
    microscope. The equipment used for observations is the ECLIPSE MA22 (Nikon, Tokyo,
    Japan). Figure 19 shows the optical microscope images for each condition. When
    the amount of oxygen is close to a vacuum condition, almost no oxide layer forms.
    As the oxygen level gradually increases, the thickness of the oxide layer also
    increases proportionally, and at an oxygen level of 6%, an oxide layer similar
    to that formed under atmospheric conditions is observed. This shows that the oxide
    layer of uncoated boron steel is highly sensitive to the amount of oxygen.'
