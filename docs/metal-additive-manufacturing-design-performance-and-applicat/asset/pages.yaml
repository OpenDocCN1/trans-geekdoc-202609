    | hi = 2.55421 | ±0.0002216 (0.0087%) |

    | ti = 12.6707 | ±0.01187 (0.09366%) |


    The research data presented in Figure 5 illustrate the creep displacement-time
    curves, which were derived through the process of nanoindentation. These curves
    represent the outcomes for 16 distinct conditions of volumetric energy density
    (VED), both with and without the application of a nitridation heat-treating process,
    as detailed in Table 5. The results of this study underscore the substantial impact
    of both VED and nitridation on the creep behavior of the material under investigation.
    In the case of specimens that did not undergo nitriding, an increase in VED from
    50 J/mm³ to 150 J/mm³ led to a notable decrease of 31.32% in creep displacement,
    changing from 0.0166 µm to 0.0114 µm. Similarly, specimens that were subjected
    to nitriding displayed a 33.79% reduction in creep displacement, decreasing from
    0.0145 µm to 0.0096 µm, when the same VED values were applied. It is worth noting
    that the process of nitrification consistently resulted in a reduction of creep
    displacement across all VED conditions, with an average decrease observed to be
    24.54%.


    These findings highlight the synergistic effect of VED and nitrification on enhancing
    the creep resistance of H13 hot work tool steel, which was fabricated using the
    selective laser melting (SLM) technique. The combination of a VED of 150 J/mm³
    and the application of a nitriding treatment resulted in the lowest observed creep
    displacement, indicating the potential for optimizing the material''s performance
    in this regard.'
