- pgno: 102
  md: 'measurement step (Section 2.4). Each RPD framework was fitted onto the corresponding
    master cast using silicone. Before fitting, the intaglio surface of the framework
    was coated with a thin layer of petroleum jelly (Vaseline, Unilever, Greenwich,
    CT, USA) to prevent the silicone from attaching to the framework. Additionally,
    a thin adhesive liquid (3M ESPE Polyether Adhesive, 3M ESPE AG, Bayern, Germany)
    was applied to the measuring areas of the cast to prevent detachment of the silicone
    during framework removal. Mixed vinyl polysiloxane (Fit Checker Advanced; GC Corp.,
    Tokyo, Japan) was applied to the intaglio surface of the rests, tissue stops,
    and lingual bars. The framework was immediately fitted onto the corresponding
    cast and carefully removed after the silicone hardened, leaving the silicone intact
    on the casts. If any gap was detected between the silicone and the measuring area
    of the cast, the process was repeated after cleaning the cast. Each master cast
    with silicone was rescanned using the tabletop scanner. All scanning procedures
    were performed without a powder coating.


    # 2.4. Measurement of the Internal Discrepancies of the RPD Frameworks


    The measurement steps using the 3D metrology software are presented in Figure
    3. The two types of STL files, namely that of the master cast only and the silicone-attached
    master cast, were superimposed using a local best-fit alignment function of the
    metrology software (GOM Inspect 2018, Carl Zeiss GOM Metrology GmbH, Braunschweig,
    Germany) to measure the thickness of the silicone, representing the internal discrepancy
    of the framework (Figure 3A). The mean deviation values in the eight areas of
    the RPD framework were measured: three rests (35R, 44R, and 47R), four tissue
    stops (36T, 37T, 45T, and 46T), and a lingual bar. The borderlines of the measuring
    areas were manually created in each master cast following a certain standard to
    ensure designation consistency. Each borderline was chosen to be slightly away
    from the edge, and the perpendicular borders of lingual bars were selected at
    the distal sides of the canines (Figure 3B). Each selected patch was inspected
    using the “surface comparison on actual” function of the metrology software and
    visualized using color mapping and tabulating the mean and maximum deviation values
    (Figure 3C).


    ![](img/7578a5220236942261475fd7af81489e_102_0.png)


    Figure 3. Screenshots of the measurement steps with the 3D metrology software.
    The thickness of the imprinted silicone material representing the internal discrepancies
    was measured by superimposing'
