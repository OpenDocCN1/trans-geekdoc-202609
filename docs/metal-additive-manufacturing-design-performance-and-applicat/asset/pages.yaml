  md: 'Article


    # Study on Surface Quality Analysis of an Uncoated Boron Steel and Its Oxide Layer
    Suppression Method for Hot Stamping


    Jiho Lee, Junghan Song and Gihyun Bae *


    Flexible Manufacturing R&D Department, Korea Institute of Industrial Technology,
    Incheon 21999, Republic of Korea; jksg0319@kitech.re.kr (J.L.); jhsong@kitech.re.kr
    (J.S.) * Correspondence: baegh@kitech.re.kr; Tel.: +82-32-850-0318


    Abstract: This study investigates the effects of hot stamping on boron steel surface
    properties, comparing uncoated steel to Al-Si-coated steel, with a focus on developing
    atmosphere-controlled hot stamping technology. Experiments using a hat-shaped
    specimen revealed that uncoated steel formed a thick oxide layer due to exposure
    to atmospheric oxygen at high temperatures, negatively impacting surface quality
    and weldability. In contrast, the Al-Si-coated steel showed no oxide formation.
    Although uncoated steel exhibited higher average Vickers hardness, the detrimental
    effects of the oxide layer on weld quality necessitate advancements in process
    technology. A lab-scale hot stamping simulator was developed to control atmospheric
    oxygen levels, utilizing a donut-shaped induction heating coil to heat the material
    above 1000 °C, followed by rapid cooling in a forming die. Results demonstrated
    that maintaining oxygen concentrations below 6% significantly reduced oxide layer
    thickness, with near-vacuum conditions eliminating oxide formation altogether.
    These findings emphasize the critical role of oxygen control in enhancing the
    surface quality and weldability of uncoated boron steel for ultra-high-strength
    automotive applications, potentially reducing manufacturing costs while ensuring
    part performance.


    Keywords: hot stamping; boron steel sheet; oxide layer; atmosphere control; induction
    heating module


    Citation: Lee, J.; Song, J.; Bae, G. Study on Surface Quality Analysis of an Uncoated
    Boron Steel and Its Oxide Layer Suppression Method for Hot Stamping. Materials
    2024, 17, 5563. https://doi.org/10.3390/ma17225563


    Academic Editors: Dimitrios Tzetzis, Konstantinos Tsongas and Nikolaos Kladovasilikis


    Received: 18 October 2024 Revised: 11 November 2024 Accepted: 12 November 2024
    Published: 14 November 2024


    Copyright: © 2024 by the authors. Licensee MDPI, Basel, Switzerland. This article
    is an open access article distributed under the terms and conditions of the Creative
    Commons Attribution (CC BY) license (https://creativecommons.org/licenses/by/4.0/).


    # 1. Introduction


    Due to recent environmental concerns and strengthened fuel efficiency regulations,
    the demand for eco-friendly vehicles is increasing. Many global automotive companies
    are producing electric vehicles as a means to satisfy various environmental regulations
    by replacing traditional internal combustion engines. In order to achieve maximum
    driving range with a single battery charge, the weight of the vehicle has become
    crucial for environmentally friendly vehicles. To reduce vehicle weight, many
    companies are increasing the application of hot stamping components to ensure
    collision performance and passenger safety. As evidence of this, after the initial
    application of hot stamping components made of boron steel in a Saab vehicle in
    1984 [1], the production ratio of hot stamping increased from 3 million to 8 million
    in 1987 and further surged to 170 million in 2007 [2]. In 2023, the hot stamping
    market is expected to expand to approximately 1.28 billion components. Accordingly,
    research related to hot stamping production technology is actively being conducted.


    The hot stamping method is suitable for producing high-strength products required
    for passenger safety by forming the material with high elongation and low strength
    under a high temperature of over 900 °C and then quenching it to the martensitic
    steel in order to achieve very high strength over 1.5 GPa. The quenching process
    involves rapid cooling at speeds exceeding approximately 27 K/s from the martensite
    transformation temperature, ranging from 425 °C (martensite start point) to 280
    °C (martensite finish point) [3]. Materials commonly used for hot stamping include
    alloys with boron additions such as 22MnB5, 27MnB5, and 37MnB5. Boron-added alloys
    are preferred in hot stamping, as boron steel'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'is known to be the only type of steel capable of generating a martensitic microstructure
    after hot stamping [4]. Boron steel sheets typically have tensile strength levels
    of around 600 MPa before heat treatment. Through the martensitic transformation
    of the material after hot stamping, it is known to achieve tensile strengths of
    approximately 1.5 GPa [4].


    Numerous researchers have investigated component manufacturing technologies utilizing
    uncoated hot stamping steel sheets. From a materials technology perspective, various
    experimental analyses have been conducted to ensure and enhance the mechanical
    properties of materials, with the cooling rate selected as a key variable [5–7].
    Concurrently, from a process technology perspective, researchers have focused
    on optimizing the hot stamping process to improve forming quality and productivity
    [8–12]. Furthermore, a variety of studies have been conducted to analyze heat
    transfer and material deformation mechanisms in the hot stamping process, aiming
    to enhance process efficiency [13–16]. These collective studies have continuously
    advanced component manufacturing technologies that utilize uncoated hot stamping
    steel sheets.


    Hot-stamped boron steels without Al-Si coating layer generate an oxide scale on
    the surface when exposed to air under austenitizing conditions. To control this
    oxide layer, methods such as using boron steel sheets coated with Al-Si for oxidation
    prevention [17] or applying oil for anti-oxidation on the surface [18] can be
    employed. Physical methods involving shot blasting can also remove the oxide layer
    [18,19]. While these methods offer the advantage of controlling the oxide layer
    during hot stamping, the presence of a coating layer on the surface for oxidation
    control can lead to the melting of the coating layer during welding. Additionally,
    when using oil for oxidation prevention, research data indicates a decrease in
    interfacial heat transfer coefficients (IHTC), affecting the microstructure and
    mechanical properties [20]. The Al-Si coating layer, when subjected to rapid heating
    rates, can experience premature heating, causing the coating layer to slide and
    leading to issues such as coating layer displacement. Moreover, the production
    cost of hot-stamped parts should be increased due to material and process patents
    related to Al-Si-coated boron steel sheets.


    To overcome these drawbacks, it is important to suggest an alternative hot stamping
    method by using an uncoated boron steel sheet. Taylor et al. [21] illustrated
    a schematic of the hot stamping process for uncoated steel sheets, demonstrating
    that this process generally includes an additional shot blasting step to remove
    the oxidation scale. This additional step requires extra production equipment
    and extends the processing time, resulting in increased manufacturing costs for
    hot-stamped parts using uncoated steel sheets. The comparatively higher manufacturing
    cost, as opposed to coated steel sheets, presents a significant obstacle to the
    use of non-coated steel sheets. Consequently, even with the additional costs associated
    with paying for material and process patents held by Arcelor Mittal, most automotive
    body component manufacturers opt to use Al-Si-coated steel sheets. Chen et al.
    [22] emphasized the cost-saving advantages of uncoated hot stamping processes
    in automotive part manufacturing. Additionally, Kim et al. [23] demonstrated through
    an economic efficiency analysis that using uncoated steel sheets in hot stamping
    processes can reduce production costs and improve efficiency. Therefore, to reduce
    the manufacturing cost of hot-stamped components, automotive companies and body
    component manufacturers are seeking the development of press-forming technology
    that can suppress the formation of oxide layers on non-coated steel sheets. It
    means that preventing or controlling oxide layer growth should be a core technology
    for using uncoated boron steel sheets.


    This paper deals with the quantitative investigation of the surface quality of
    a hot-stamped part and its improvement method of the oxide layer for uncoated
    boron steel sheet. Initially, the heat treatment results with hat-type specimen
    were compared according to the presence of the Al-Si coating layer in order to
    observe the effect of the coating layer on the surface quality and mechanical
    properties. To investigate methods for suppressing the oxide layer on uncoated
    steel sheets, a lab-scale hot stamping simulator was developed to replicate the
    heating and forming processes under controlled atmospheric conditions.'
