  md: 'respectively. A large number of dimples are observed in each lattice structure,
    which is characteristic of the ductile fracture of metals. A ductile fracture
    is beneficial for the structure to absorb more energy. Secondary cracks and holes
    are found in Figure 13c. The reason for the secondary crack is that the lattice
    structure tends to expand outward during the loading process of the compression
    experiment, resulting in high tension in the weak area in the middle of the pillar,
    resulting in a mixed fracture. The hole is generated by the gas residue during
