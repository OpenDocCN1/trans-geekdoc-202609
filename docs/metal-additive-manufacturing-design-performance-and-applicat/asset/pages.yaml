  md: '# 3.2. The Influence of Heat Treatment on the Structural-Phase State of the
    “coldArc” WAAM Ti-6Al-4V Samples


    The quenching of the Ti-6Al-4V samples from 900 °C followed by cooling in water
    did not provide any significant microstructural changes (Figure 8). The macrostructure
    of the WAAM Ti-6Al-4V samples obtained using both layer deposition strategies
    consisted of columnar-equiaxed primary β-grain boundaries within which the α-phase
    acquired lamellar, needle-like, and Widmanstätten structures (Figure 8). However,
    after the subtransus quenching, an increase in the volume fraction of the α′ phase
    was observed. The mean size of equiaxed grains did not change and was identical
    to that of the as-built samples; for samples Ti-6Al-4V-0 and Ti-6Al-4V-1, the
    corresponding mean grain sizes are 0.4 ± 0.1 mm and 0.3 ± 0.1 mm, respectively
    (Figure 9).


    ![](img/7578a5220236942261475fd7af81489e_131_0.png)


