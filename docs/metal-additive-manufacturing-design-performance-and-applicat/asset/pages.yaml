    Figure 9 is the residual stress distribution map of different cell lattice structures.
    It can be found that among the three structures, the equivalent residual stress
    of the Dode structure is the largest, reaching 1218.2 MPa. The stress of the FCC
    structure reached 1164.4 MPa, and the stress of the BCC structure reached 1159.9
    MPa. The complexity of the Dode structure makes the internal heat dissipation
    poor, so that it has the greatest residual stress. The maximum residual stress
    of each structure is at the node, which is because the temperature at the node
    is higher than at other parts in the forming process (Figure 8), and there is
    a large temperature gradient.


