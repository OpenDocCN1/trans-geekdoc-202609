- pgno: 115
  md: 'is important because it directly influences friction and wear behavior, providing
    crucial insights into material interactions and performance. It is worth noting
    that the most crucial roughness parameters for the specimen’s surface and profile
    were obtained according to international standards [17,18].


    In a series of tribological experiments conducted by a Tribolab Universal Material
    Testing (UMT) apparatus, employing a pin diameter of 6.56 mm, a standardized normal
    force of 50 N was applied to a distance of 10 mm with a sliding velocity of 1
    mm/s. These meticulously controlled parameters served as the foundation for a
    rigorous examination of frictional dynamics and wear characteristics inherent
    to diverse material compositions [19,20]. Utilizing the advanced capabilities
    of the UMT TriboLab from Bruker (Billerica, MA, USA), a pin-on-disc configuration
    was employed to investigate the tribological behavior of AM H13 steel specimens.
    These specimens were designed as safety braking pads, featuring various configurations
    including honeycomb, honeycomb speckled, extended honeycomb, car-tire-like, and
    pyramid structures. The focus of the investigation centered on determining the
    CoF, a widely accepted standard parameter of friction. This parameter is calculated
    from the force sensor signal, considering both the normal and longitudinal forces
    acquired simultaneously. By analyzing the CoF, insights into the frictional characteristics
    of each configuration were acquired, facilitating a comprehensive understanding
    of their tribological performance. This setup facilitated a focused inquiry into
    the tribological properties of these design patterns examined, aiming to discern
    their performance under controlled conditions. All tests were performed at least
    five times at room temperature, on the region between fixation holes.


    # 2.5. Finite Element Models


    In order to evaluate fast, accurately, and reliably the performance of the developed
    friction pads, finite element models (FEMs) were developed based on the results
    of tribological analysis. For this purpose, the ANSYS Workbench (ANSYS, Inc.,
    Canonsburg, PA, USA) simulation platform was utilized and, more specifically,
    its static module. The employed material model was a bilinear isotropic hardening
    in which the elastic section emerged from the aforementioned material properties
    and the plastic section occurred after the yield stress point with a tangent modulus
    of 10,000 MPa based on the experimental results of a previous study [12]. The
    next step was the creation of the computational mesh, which was defined after
    the conduction of mesh sensitivity analyses regarding the maximum von Mises stress
    in order to extract mesh-independent results. This analysis led to mesh with tetrahedral
    elements and a minimum size of 0.4 mm with total mesh elements ranging from around
    100,000 to 125,000 elements depending on the applied geometry of the structure.
    Regarding the fixation condition of the analyses, each friction pad was set to
    have zero displacements on the plane of each support hole and zero displacements
    on the back of each pad where the spring set was applied. On the other hand, for
    the loading condition, the worst-case scenario of a commercial passenger elevator
    was chosen with P + Q at 2600 kg and two progressive safety gears. Moreover, the
    overall force applied to the friction surface of each pad was analyzed in two
    different components, namely the vertical force and braking/friction force. The
    braking/friction force has a direction opposite to the movement of the elevator
    and it is constant due to the fact that the same value for this force results
    in the immobilization of the elevator regardless of the applied surface pattern
    of each pad. In contrast, the necessary vertical force in order to create the
    friction force is dependent on the coefficient of friction of each developed friction
    pad. Therefore, the evaluation of this force component for each case was performed
    utilizing the results of the tribological analysis. It is worth mentioning that
    in the context of this study, a commercial friction pad was also tested in order
    to provide a comprehensive benchmark for the designed braking pads. Figure 4 presents
    an indicative example of the commercial friction pad with the fixation and loading
    conditions that have been considered in the developed FEM.'
