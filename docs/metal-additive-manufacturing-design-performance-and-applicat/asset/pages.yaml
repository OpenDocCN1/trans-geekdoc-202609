    In this paper, we present our findings on MPs and SCPs, focusing on the non-conventional
    configurations developed to enhance the photoemission performance and extend their
    operational lifespan. The advantages and disadvantages of the three different
    photocathode configurations are reported in Table 1.


    # Table 1. Advantages and disadvantages of the different photocathode configurations.


    | Configuration | MP | SCP | Lifetime | QE |

    | :--- | :--- | :--- | :--- | :--- |

    | Conventional | Cu disk | Nb disk | Relatively long ¹ | Relatively small ² |

    | Hybrid | Cu disk with a Y thin film deposited on the central area | Nb disk
    with a Pb thin film deposited on the central area | Shorter than conventional
    ³ | Higher than conventional ⁴ |

    | Non-conventional | Y disk with a Cu annular thin film | Pb disk with a Nb annular
    thin film | Much higher than hybrid ⁵ | Higher than conventional ⁴ |


    ¹ High chemical inertness; ² High WF; ³ Thinning of the film due to the laser
    cleaning treatment; ⁴ Low WF; ⁵ Bulk as photoelectron source.


    # 2. The Choice of the Deposition Technique


    Various techniques have been employed to deposit metallic thin films used as electron
    sources [15,31,32]. Among these methods, the PLD technique stands out for its
    ability to ensure the robust bonding of metallic films to substrates, even when
    applied at an ambient temperature [21,32,33]. When selecting a deposition technique
    for metals such as Cu, Mg, and Pb for photocathode applications, the PLD technique
    presents distinct advantages over other Physical Vapor Deposition (PVD) methods.
    Techniques such as thermal evaporation, electron beam evaporation, sputter deposition,
    cathodic arc deposition, and molecular beam epitaxy (MBE) each have specific drawbacks
    that make them less suitable for high-quality photocathode fabrication.


    Thermal evaporation often suffers from contamination due to the inclusion of impurities
    in the evaporated material. Additionally, achieving precise control over the film
    thickness is challenging, and scaling the process for larger substrates is problematic
    [34]. Moreover, the adherence of the film deposited by this technique is poor
    [31]. Electron beam evaporation, while offering some improvements, introduces
    high equipment costs and substrate heating issues that can damage sensitive materials.
    This method also struggles with precise thickness control, particularly for materials
    with high melting points [35].


    Sputter deposition, another common PVD technique, frequently induces stress in
    the films, leading to potential cracking or delamination. Its lower deposition
    rates extend the process times, and the high-energy ions used can damage the substrate
    [36]. Cathodic arc deposition, although capable of high deposition rates, produces
    droplets that result in rough surfaces and film defects. This method also causes
    significant substrate heating and potential contamination from the cathode material
    [34].


    MBE, known for producing high-quality films, is hindered by extremely high costs,
    slow deposition rates, and the requirement for ultra-high vacuum conditions. These
    factors increase the operational complexity and restrict the throughput, making
    MBE less suitable for large-scale applications [37].


    In contrast, PLD offers numerous advantages. It can produce high-quality, uniform
    thin films with smooth surfaces and provides precise control of the deposited
    films’ thickness. PLD is versatile, capable of depositing a wide range of materials,
    including complex alloys and compounds, while minimizing contamination due to
    the laser ablation process. Despite its relatively low deposition rates, it is
    suitable for thin films, and can be optimized to minimize substrate heating and
    damage. These attributes make PLD a superior choice for the deposition of metals
    like Cu, Mg, and Pb for photocathode applications [38].


    A common setup for PLD involves a high vacuum chamber made of stainless steel
    (10⁻⁵–10⁻⁶ Pa), where the substrate is placed parallel to the target, typically
    4–5 cm apart.'
