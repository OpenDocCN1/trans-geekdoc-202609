    # 5. Results and Discussion


    # 5.1. Quasi-Static Compression Experiment


    Figure 11 shows the stress–strain curves of different lattice structures. The
    compression performance of different lattice structures is very different. Multiple
    peaks are observed in the stress–strain curve, and the final feature is that the
    stress drops sharply and the parts are damaged. The slope of the curve represents
    the elastic modulus, and the first peak stress represents the compressive strength.
    The slope of the Dode structure in the elastic stage is significantly larger than
    that of BCC and FCC. The strain at the first peak stress of all the structures
    is very close, but the peak stress is very different. The mechanical properties
    of the three lattice structures are shown in Table 3. The Dode structure has the
    highest elastic modulus and compressive strength, showing the best compression
    performance. Although FCC has a higher elastic modulus and compressive strength
    than BCC, it can be seen from Figure 10 that the bearing capacity decreases sharply
    after the first damage, and begins to be lower than the BCC structure after the
    strain reaches about 0.14.


    ![](img/7578a5220236942261475fd7af81489e_19_1.png)


    Figure 11. Stress–strain curve of different lattice structures.'
