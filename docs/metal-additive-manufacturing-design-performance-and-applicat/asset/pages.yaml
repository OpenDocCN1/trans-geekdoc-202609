  md: 'Nevertheless, Inconel is a hard-to-machine material [4], and the heat generated
    by machining is excessive due to its high toughness and strength, even at high
    temperatures. Due to its low thermal conductivity, heat is concentrated on the
    tool surface during the machining of Inconel, which leads to increased tool wear.
    During the machining of these alloys, the temperature and stresses near the cutting
    tool edge are significantly high, making it susceptible to damage such as flank
    wear, notching wear, and edge chipping. These issues result in a reduced tool
    lifespan and a decline in the integrity of the finished surface [5]. Additionally,
    welding and adhesion of the machined material to the cutting tool frequently occur,
    causing severe notching and altering the tool’s rake face due to the subsequent
    pull-out of the coating and tool substrate [6]. Therefore, various cooling and
    lubrication methods are used in the milling process to reduce cutting forces and
    tool wear. For nickel alloys, a great variety of methods such as dry cutting,
    flood cutting, cryogenic cutting, and cryogenic minimum quantity lubrication can
    be used for this purpose [7]. Despite the variety of methods, cutting fluid cutting
    using water-oil emulsions with a concentration of about 3–9% or minimal quantity
    lubrication (MQL) is most common in industry [8]. Based on this, it was concluded
    that the use of cutting fluids in both the combined DMD and milling process will
    be unavoidable for hard-to-machine materials in most cases. It may lead to interface
    contamination in the sequential surfacing and milling process. The following sections
    present research on the combined process, highlighting the significance of ongoing
    investigations in this field and reviewing the current state of the art.


    Researchers [9–13] studied the machinability of IN718 produced by AM methods.
    Their findings showed the influence of the porosity and heat treatment on the
    cutting forces, tool wear, or surface roughness. These results indicate a strong
    interest in the topic of machining parts produced by AM methods.


    Song et al. [14] reported on a hybrid approach called “3D welding and milling”
    that combines gas metal arc welding with milling. The study focuses on the early
    stages of process development and characterises parts fabricated using this approach.
    It delves into the results, highlighting the unique capabilities of this hybrid
    process in fabricating metallic prototypes and potentially overcoming limitations
    of surface finish and accuracy often associated with additively manufactured parts.


    Soffel et al. [15] focused on the fabrication of parts using casting, interface
    milling, and DMD. They reveal that different processing routes impact the mechanical
    properties and bonding quality of the final product. This highlights the importance
    of understanding how DMD and milling interact at the interface level.


    Authors like Barckhoff [16] and Alsher et al. [17] have noted that before laser
    welding, any lubricants on the surface should be cleaned off to prevent the formation
    of gas bubbles and pores. Cortina et al. [18] analysed the impact of using cutting
    fluid in a hybrid manufacturing process that combines additive and machining operations
    of IN718. The paper examines whether DMD after machining is feasible without requiring
    intermediate cleaning to remove residual cutting fluids. It concludes that if
    the part surface is not adequately cleaned after machining, it could lead to poor
    quality in the subsequent laser additive operation. However, in this work, only
    the porosity of the prepared samples was evaluated. In addition, the samples themselves
    are only single-layered on a forged substrate, which does not fully reflect the
    real combined manufacturing process of 3D parts, which is a multilayer cladding
    on an already deposited part of the workpiece.


    It is known that cutting fluids, remaining in the zone of interaction with the
    laser during further cladding, are subjected to heating, vaporisation, and dissociation,
    which can accelerate the diffusion of hydrogen or carbon into the material, leading
    to undesirable effects such as hydrogen embrittlement. Aiello et al. [19] investigated
    the effect of H content in IN718 manufactured by Selective Laser Melting (SLM).
    Tests were carried out at hydrogen concentrations up to 28 parts per million (ppm).
    The results show hydrogen embrittlement at hydrogen concentrations starting from
    2.7 ppm (drop in elongation at break by about 10%). This suggests a significant
    effect of hydrogen concentration on the properties of IN718.'
