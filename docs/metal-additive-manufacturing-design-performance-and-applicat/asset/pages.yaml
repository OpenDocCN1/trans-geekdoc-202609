  md: 'Furthermore, the values of the steady creep strain rate (é) and the creep stress
    exponent (n) for the different VED conditions without and with the stage of nitrification
    are shown in Tables 6 and 7, respectively. It is evident that the steady creep
    strain rate does not vary significantly with the VED values. The values are very
    low and as a result very sensitive to change that it will not be safe to make
    a clear assumption. The main reason for this may be that despite the values of
    VED, there might be important differences to the printing parameters from which
    the VED are revealed. This might be a good starting point for future research.
    However, concerning the creep stress exponent (n), it seems that with increasing
    the VED from 50 J/mm³ to 150 J/mm³, there is a total decrease of 43.32% (from
    6.67 to 3.78) for non-nitrided specimens. Similarly, the nitrided specimens exhibited
    a 50.73% reduction (from 5.48 to 2.70). Finally, nitrification consistently reduced
    the stress exponent (n) across the majority of VED conditions, with an average
