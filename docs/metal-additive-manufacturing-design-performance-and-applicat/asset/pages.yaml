    # 3.3. Organizational Characterization by Optical Microscopy


    To study the effect of different heat inputs on the microstructure of the same
    composite material (V_Inconel 718: V_Ti6Al4V=2:1), the metallographic morphology
    of the samples was observed under different deposition currents using an optical
    microscope. Figure 4 displays the optical microscopy characterization for each
    deposition current. Figure 4a shows the optical microstructure at a deposition
    current of 35 A, with the Ti6Al4V/Inconel 718 composite in the upper part and
    the Inconel 718 layer in the lower part. The upper section is predominantly composed
    of columnar crystals, intermingled with some long black bars among the branches
    of the columnar crystals. In the WAAM process, the solid–liquid interface gradually
    advances into the liquid phase region. During this advancement, the solute undergoes
    redistribution, resulting in a phenomenon of component supercooling within a certain
    distance. This instability of the flat solid–liquid interface ultimately leads
    to the formation of columnar crystals. As the liquid phase region is influenced
    by solute redistribution, solute aggregation occurs, which is manifested as microscopic
    segregation [27]. From the Figure 4a, it can be observed that tiny secondary dendrites
    are present on the sides of the columnar crystals, with an average distance of
    5.16 μm between these secondary dendrites.


    With the increase in the deposition current, the columnar crystals in the deposited
    layer gradually undergo differentiation. Figure 4b shows the optical microstructure
    at a deposition current of 40 A. From the Figure 4b, it can be observed that some
    of the grains are arranged in an orderly manner, while a discontinuous black phase
    is present between the grains. In addition, long straight columnar crystals can
    be observed in the Figure 4b, which is formed due to the instability of the solid–liquid
    interface resulting from the supercooling of the composition. Under conditions
    of rapid cooling, columnar crystals are formed more readily. In comparison to
    Figure 4a, when the deposition current is 40 A, the heat input increases, leading
    to a longer temperature residence time on the workpiece under the same heat dissipation
    conditions. As a result, the cooling rate becomes relatively slower. At the microscopic
    level, the number of columnar crystals decreases, with some larger columnar crystals
    gradually transforming into smaller grains, leading to an increase in the spacing
    between columnar crystals. As some of the heat is conducted in the direction of
    the deposited additive, a negative temperature gradient develops in the liquid
    phase, perpendicular to the crystal axis. This results in the formation of a secondary
    crystal axis along the primary crystal axis [27]. The presence of secondary dendrites
    can be observed in the Figure 4b, with the average distance between the secondary
    dendrites measuring 6.38 μm.'
