  md: 'The hot gas extraction method was used to measure the hydrogen content, and
    the most representative specimens P1, P2, and P5 were selected for analysis. The
    measurement results are shown in Figure 4. The graph shows that the hydrogen content
    in the interface of samples P1, P2, and P5_100 is below 2 ppm. Sample P5_5, on
