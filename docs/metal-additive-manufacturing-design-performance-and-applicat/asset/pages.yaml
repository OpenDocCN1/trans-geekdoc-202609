  md: '# # Effect of “ColdArc” WAAM Regime and Arc Torch Weaving on Microstructure
    and Properties of As-Built and Subtransus Quenched Ti-6Al-4V


    Anna Zykova, Nikolai Savchenko, Aleksandra Nikolaeva, Aleksander Panfilov, Andrey
    Vorontsov, Vyacheslav Semenchuk, Denis Gurianov, Evgeny Kolubaev and Sergei Tarasov
    *


    Institute of Strength Physics and Materials Science of the Siberian Branch of
    the RAS, pr. Academicheskiy, 2/4, Tomsk 634055, Russia; zykovaap@mail.ru (A.Z.);
    savnick@ispms.ru (N.S.); nikolaeva@ispms.ru (A.N.); alexpl@ispms.ru (A.P.); vav@ispms.ru
    (A.V.); svm_70@ispms.ru (V.S.); gurianov@ispms.ru (D.G.); eak@ispms.ru (E.K.)
    * Correspondence: tsy@ispms.ru; Tel.: +7-3822-286-815


    Citation: Zykova, A.; Savchenko, N.; Nikolaeva, A.; Panfilov, A.; Vorontsov, A.;
    Semenchuk, V.; Gurianov, D.; Kolubaev, E.; Tarasov, S. Effect of “ColdArc” WAAM
    Regime and Arc Torch Weaving on Microstructure and Properties of As-Built and
    Subtransus Quenched Ti-6Al-4V. Materials 2024, 17, 2325. https://doi.org/10.3390/ma17102325


    Abstract: Defect-free thin-walled samples were built using wire arc additive manufacturing
    (WAAM) combined with the “coldArc” deposition technique by feeding a Ti-6Al-4V
    welding wire and using two deposition strategies, namely with and without the
    welding torch weaving. The microstructures formed in these samples were examined
    in relation to mechanical characteristics. The arc torch weaving at 1 Hz allowed
    us to interfere with the epitaxial growth of the β-Ti columnar grains and, thus,
    obtain them a lower aspect ratio. Upon cooling, the α/α′+β structure was formed
    inside the former β-Ti grains, and this structure proved to be more uniform as
    compared to that of the samples built without the weaving. The subtransus quenching
    of the samples in water did not have any effect on the structure and properties
    of samples built with the arc torch weaving, whereas a more uniform grain structure
    was formed in the sample built without weaving. Quenching resulted also in a reduction
    in the relative elongation by 30% in both cases.


    Keywords: wire arc additive manufacturing; “coldArc”; deposition strategy; quenching;
    microstructure; mechanical properties


    # ## 1. Introduction


    Wire-arc additive manufacturing (WAAM) is a layer-by-layer metal deposition process
    using wire as a source material and an arc discharge as an energy source [1,2].
    This technology is considered economical and efficient, as well as suitable for
    the fabrication of large-sized metal products [1] due to its manufacturability,
    relatively high speed of metal deposition, and low cost of equipment compared
    to other additive manufacturing methods [2]. Titanium alloys are widely used in
    various industries, such as aerospace, energy, nuclear, and biomedicine due to
    their excellent combination of strength and ductility [1,3–5]. At the same time,
    the use of traditional subtractive metalworking methods to produce shaped titanium
    alloy parts means a significant increase in the production costs. The development
    of additive technologies offers an alternative way for fabricating near net-shape
    machine parts from using a layer-by-layer method, growing them from a melt pool.
    At the same time, the epitaxial growth of primary columnar β-Ti grains is observed
    with almost all additive manufacturing methods, subsequently leading to the formation
    of large α/β colonies with wide α-laths that contribute to the anisotropy of properties
    and reduce the strength.


    During the WAAM process, solidification always occurs through the growth of primary
    grains from the melt pool bottom under the conditions of a temperature gradient
    and heat removal through the substrate [6–9]. The relevant studies have shown
    that the primary β-Ti grains of Ti-6Al-4V alloy produced by WAAM are similar to
    those obtained using laser [10–12] and electron beam additive manufacturing methods
    [13–16]. Thus, almost all'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'additive methods that utilize fusion of the source materials give a primary
    cast structure characterized by large columnar β-Ti grains (several millimeters
    wide and almost the entire height of the product), in which, at low cooling rates,
    decomposition occurs with the formation of grain-boundary α-Ti grains and α/β
    colonies, characterized by low strength and high ductility. With a further decrease
    in the cooling rate or under the influence of cyclic reheating, the β-laths can
    experience further decomposition with the formation of α/α″ and α/α₂ structures
    [17].


    Higher cooling rates are achieved in WAAM as compared to those in wire electron
    beam additive manufacturing that may cause the transformation of α/β structures
    into α/α′ ones, and such a transformation may increase strength but simultaneously
    impair the ductility [18,19]. When additively forming a Ti-6Al-4V part, prolonged
    heating can also lead to high residual stresses [20]. Thus, products obtained
    via additive methods are characterized by either an insufficient level of strength
    associated with the formation of large primary β-Ti grains and their decomposition
    into coarse α/β colonies, or low plasticity due to the formation of α/α′ colonies.
    It should be added that the in situ refinement of primary β-Ti grains is possible
    by breaking the dendrites growing in the melted pool by intensifying the liquid
    metal stirring by means of mechanical vibrations, sonication (cavitation), and
    mechanical interpart impact treatment.


    Another specificity of the additively manufactured materials is that successive
    reheating of the as-deposited layers occurs in them, leading to the formation
    of heat-affected bands [17], in which the as-deposited microstructures are subjected
    to extra structural and phase transformations such as the β→α/α″ and β→α/α₂. Mending
    such a structural inhomogeneity may require post-deposition heat treatment.


    The modification of deposition strategies may be one of the approaches to interfere
    with the epitaxial growth of primary columnar β-Ti grains. Plasma or welding torch
    weaving is an effective way of optimizing the geometry of welding beads and increasing
    the deposition rate in WAAM [21,22]. In particular, using larger weaving amplitudes
    in combination with a low torch speed and low wavelength allows for the production
    of walls of larger dimensions [23]. A novel approach to weaving was developed
    by Ni et al. [24] for WAAM on curved surfaces that allowed for the improvement
    of their dimensional accuracy. It was also shown [25] that plasma torch weaving
    had a positive effect on the structure and strength of reheated zones in the multi-pass
    plasma-transferred arc Fe-Cr-Mo-C coatings.


    Among numerous publications devoted to WAAM on Ti-6Al-4V, there are ones dedicated
    to studying the effect of different deposition strategies. For instance, Zhou
    et al. studied the effect of co-directional and reciprocating deposition strategies
    on structure and mechanical strength, but no weaving was applied in the deposition
    process [26]. A circular weaving deposition strategy was applied for wire additive
    manufacturing of Ti-6Al-4V with the use of the cold metal transfer technique [27].
    Unfortunately, no data were reported that could shed light on the effect of low-frequency
    weaving. No literature sources were, however, discovered that reported on a direct
    study of the effect of arc or plasma torch weaving in WAAM on the structure and
    characteristics of as-built Ti-6Al-4V.


    It may happen, however, that the use of arc torch oscillations in WAAM has positive
    effect on the structural homogeneity of the WAAM on Ti-6Al-4V.


    Alternative solutions may be microalloying the melt pool to extend the constitutional
    undercooled zone and, thus, increase the probability of homogeneous grain nucleation
    [28] or intensifying the heterogeneous grain nucleation by adding refractory inoculation
    particles [29]. The first two approaches involve increased design complexity,
    while admixing alloying and inoculation additives is not always desirable from
    the viewpoint of maintaining the chemical composition.


    Numerous studies have been carried out to identify the mechanisms determining
    the microstructural evolution during WAAM and post-heat treatment. For example,
    the microstructure and mechanical properties of Ti-6Al-4V obtained by the WAAM
    method were studied after applying five types of the subtransus heat treatment
    (SHT), from temperatures up to 950 °C [30]. It was found that all five SHT types
    served to improve both'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'the ultimate strength and ductility. The effect of SHT and hot isostatic pressing
    on the strength and ductility of Ti-6Al-4V after WAAM was investigated [31]. It
    was found that various thermal processes directly affect the mechanical properties
    through the dependence of the strength on the \(\alpha\)-grain size [31]. However,
    it was reported [32] that no significant differences in microstructural or mechanical
    properties were found after the heat treatment of Ti6Al4V in vacuum (at 720 °C
    for 120 min), in air, or in argon. All the heat-treated specimens demonstrated
    both yield and tensile strengths that met the requirements of the AMS4928 standard.
    A number of sources also indicated the refinement of \(\beta\)-grains, the modification
    of texture, and residual stresses relieving in the WAAM products after rolling
    under high pressure [6,8] or sonication [33,34].


    As mentioned above, the microstructure of the alloy, including the grain size
    and morphology, is significantly dependent on the thermal history during the WAAM.
    In other words, if the thermal conditions during deposition are properly controlled,
    both the desired microstructures and acceptable mechanical properties can be achieved.
    Varying the cooling rate by means of interpass cooling with compressed CO2 showed
    a slight improvement in tensile strength and a slight decrease in elongation due
    to the formation of the \(\alpha''\)-phase [35,36]. The Ti-6Al-4V wall was obtained
    by the WAAM with the use of cold metal transfer (CMT) technique and was then subjected
    to heat treatment [37]. It was shown [37] that the as-built Ti-6Al-4V wall had
    a microstructure consisting of acicular \(\alpha''\)-martensite with a small amount
    of lamellar \(\alpha/\beta\) colonies and showed acceptable hardness and tensile
    strength. The martensitic \(\alpha''\)-Ti phase can be eliminated by annealing
    at 900 °C for 4 h and cooling with the furnace. At the same time, the tensile
    strength of the heat-treated sample was significantly lower than the tensile strength
    of the original sample [37].


    Thus, thermal post-processing of an additively manufactured sample is a realistic
    route to provide the desired combination of strength and ductility, but it will
    require additional costs and time. However, it may be more expedient to control
    the product manufacturing process using techniques that ensure strictly controlled
    heat input, such as, for example, “coldArc”, which uses a power source with real
    time control of the arc discharge ignition and metal transfer [38,39]. The interplay
    between WAAM process parameters and deposition strategies which utilize the arc
    (plasma) torch oscillations is very complicated and multifactorial [23,40]. The
    use of special WAAM deposition techniques such as CMN or “coldArc” makes this
    relationship even more complicated, but it still needs further investigations.


    In relation to the above-discussed and other papers about using the WAAM process
    on Ti6Al4V, this work combined WAAM deposition techniques such as “coldArc” with
    arc torch weaving and evaluated their effect on the grain structure. Thermal post-processing
    of the samples was carried out to study the necessity of such a procedure for
    samples obtained by the above-described methods, as well as for understanding
    the evolution of the microstructure and mechanical properties.


    The objective of this study was to elucidate the effect of arc torch weaving on
    the microstructure and characteristics of the WAAM Ti-6Al-4V samples obtained
    with the use of “coldArc” technology.


    # 2. Materials and Methods


    Welding wire of Ti-6Al-4V, with a diameter of 1.6 mm, was used with the following
    chemical composition, wt.%: 4.1 ± 0.5 Al, 3.19 ± 0.2 V, Ti—balance. The wire was
    melted by the arc discharge in a flow of shielding gas (He 99.8%) and then transferred
    into a melted pool on a 2.5 mm thick rectangular substrate made of commercial
    pure titanium. The wire arc additive manufacturing (WAAM) was carried out using
    a 6-axis industrial robot FANUC Robot ARC Mate 100iD (FANUC Europe Corporation,
    Luxemburg] with a welding torch and an EWM Titan XQ R 400 Pulse inverter power
    supply (EWM GmbH, Mündersbach, Germany) with “coldArc” technology. The WAAM parameters
    are presented in Table 1.'
