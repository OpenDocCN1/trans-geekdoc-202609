- pgno: 52
  md: '# 4. Oxide Layer Improvement


    # 4.1. Development of a New Hot Stamping Simulator


    The issue of oxide layer formation during the hot stamping process of uncoated
    steel sheets occurs because the material rapidly reacts with oxygen in the atmosphere
    at high temperatures, leading to the formation of an oxide layer. In particular,
    controlling the oxygen concentration in the atmosphere is crucial to suppressing
    the formation of the oxide layer. Developing a new lab-scale simulator that can
    replicate the hot stamping process is a very important approach to achieve this.


    A lab-scale simulator allows for a quantitative analysis of the oxide layer thickness
    under various conditions, such as oxygen concentration and temperature, providing
    critical data for process optimization. Figure 11 shows the schematic diagram
    of the hot stamping simulator. The experimental equipment consists of a heating
    zone and a forming zone, including a transfer system for continuous forming after
    heating. To control the oxygen content in the atmosphere during the experiment,
    the entire equipment is sealed within a vacuum chamber. A nitrogen gas injection
    system was introduced to enhance the efficiency of atmospheric control. With this
    configuration, the vacuum chamber and nitrogen gas injection system allow the
    setting of controlled atmospheric conditions, making it possible to simulate the
    hot stamping process of uncoated steel sheets through the heating-transfer-forming
    sequence.


    ![](img/7578a5220236942261475fd7af81489e_52_0.png)


    Figure 11. Schematic diagram of an atmosphere-controllable hot stamping simulator.


    Figure 12 shows the manufactured experimental equipment. In the heating zone,
    a 300 mm × 300 mm specimen is placed on a transfer jig and heated using a pancake-shaped
    induction coil installed above it. Once the specimen reaches the target temperature,
    it is transferred to the stamping zone via a transfer device operated by a mechanical
    motor, where it is then formed by an upper die driven by a hydraulic cylinder.
    During this process, both the upper and lower dies are cooled with water, creating
    rapid cooling conditions that promote martensitic structure formation. For oxidation
    layer control experiments, an atmosphere control system was implemented as previously
    described, using a vacuum system to evacuate air from the chamber while injecting
    nitrogen gas to quickly reach the desired oxygen level. Using this newly developed
    hot stamping simulator, forming tests on non-coated hot stamping steel sheets
    were conducted at different oxygen levels to study the potential for oxidation
    layer suppression.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/7578a5220236942261475fd7af81489e_53_0.png)


    Figure 12. Lab-scale hot stamping simulator.


    # 4.2. Establishment of the Experimental Condition


    The simulator equipment uses a pancake-shaped induction coil to heat material
    of 300 mm × 300 mm size to temperatures above 950 °C. Due to the shape of the
    coil and the thermal deformation of the specimen, temperature variations occur
    at different positions. Therefore, a heating test was conducted to select the
    optimal output of the heating module for achieving the target temperature and
    to determine the analysis area for surface layer examination based on temperature
    variations. To measure the temperature distribution of the specimen, a FLIR A700
    (FLIR Systems, Wilsonville, OR, USA) infrared camera capable of measuring temperatures
    up to 2000 °C was used. Figure 13 shows the heating performance test of the material
    using the FLIR camera. First, the material was heated under a 12 kW condition,
    and Figure 14 illustrates the distribution of the oxide layer formed after the
    heating test. Through this preliminary heating test, it was confirmed that the
    material was heated in line with the shape of the coil and that the oxide layer
    formed accordingly. The FLIR camera was used to select 1/4 of the dome-shaped
    specimen for measurement, considering the measurement range. Three thermocouples
    were attached to the wall section and flange section to measure the reference
    temperature for calibration.


    ![](img/7578a5220236942261475fd7af81489e_53_1.png)


    Figure 13. Equipment configuration for the performance evaluation of the heating
    module.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/7578a5220236942261475fd7af81489e_54_0.png)


    Figure 14. Locations of thermocouple attachment considering the heated area.


    Afterward, heating tests were conducted according to the output of the heating
    module, and the temperature distribution was observed using the FLIR camera. Figure
    15 shows the temperature distribution map corresponding to the heating module
    output. Since the target temperature for the hot stamping process is above 950
    °C, this area was marked in yellow on the temperature distribution map. Through
    the heating test, it was confirmed that an output of 20 kW is required to maintain
    the target temperature across a wide area of the hat-type specimen. Therefore,
    the optimal output for forming tests under controlled oxygen conditions was set
    to 20 kW.


    To verify the atmosphere control performance of the vacuum chamber, the changes
    in oxygen content according to nitrogen gas pressure were observed. The oxygen
    content was controlled by simultaneously removing air from the chamber using a
    vacuum pump and injecting nitrogen gas. To check the oxygen level inside the chamber,
    an oxygen analyzer was installed as shown in Figure 16. The oxygen analyzer was
    moved between the heating section, transfer section, and forming section to measure
    the changes in oxygen content over time, ensuring uniformity in the oxygen distribution.
    Figure 17 shows the history of oxygen content changes according to nitrogen gas
    pressure and time. It was confirmed that the oxygen content could be controlled
    to below 1% over time. However, when the nitrogen pressure was low at 5 kPa, it
    took over 80 min to control the oxygen content to below 1%, and non-uniformity
    in oxygen distribution across different positions was observed. To improve this,
    when the nitrogen gas pressure was increased to 7.2 kPa, the time required to
    achieve the same level of oxygen control was reduced to under 25 min, and the
    oxygen distribution became uniform across the chamber. Therefore, it is considered
    that a nitrogen gas pressure of 7.2 kPa is appropriate for atmosphere control.'
