  md: '# # Improvement of the Technology of Precision Forging of Connecting Rod-Type
    Forgings in a Multiple System, in the Aspect of the Possibilities of Process Robotization
    by Means of Numerical Modeling


    Marek Hawryluk 1,*, Łukasz Dudkiewicz 1,2, Sławomir Polak 1, Artur Barełkowski
    1, Adrian Miżejewski 2 and Tatiana Szymańska 2


    +   1 Department of Metal Forming, Welding and Metrology, Wrocław University of
    Science and Technology, Łukasiewicza Street 5, 50-370 Wrocław, Poland; lukasz.dudkiewicz@pwr.edu.pl
    (Ł.D.); slawomir.polak@pwr.edu.pl (S.P.); artur.barełkowski@pwr.edu.pl (A.B.)

    +   2 Schraner Polska, Łotnicza Street 21G, 99-100 Łęczyca, Poland; amiżejewski@schraner.pl
    (A.M.); tszymanska@schraner.pl (T.S.)

    +   * Correspondence: marek.hawryluk@pwr.edu.pl


    **Abstract:** The study refers to the application of numerical modeling for the
    improvement of the currently realized precision forging technology performed on
    a hammer to produce connecting rod forgings in a triple system through the development
    of an additional rolling pass to be used before the roughing operation as well
    as preparation of the charge to be held by the robot’s grippers in order to implement
    future process robotization. The studies included an analysis of the present forging
    technology together with the dimension–shape requirements for the forgings, which
    constituted the basis for the construction and development of a thermo-mechanical
    numerical model as well as the design of the tool construction with the consideration
    of the additional rolling pass with the use of the calculation package Forge 3.0
    NxT. The following stage of research was the realization of multi-variant numerical
    simulations of the newly developed forging process with the consideration of robotization,
    as a result of which the following were obtained: proper filling of the tool impressions
    (including the roller’s impression) by the deformed material, the temperature
    distributions for the forging and the tools as well as plastic deformations (considering
    the thermally activated phenomena), changes in the grain size as well as the forging
    force and energy courses. The obtained results were verified under industrial
    conditions and correlated with respect to the forgings obtained in the technology
    applied so far. The achieved results of technological tests confirmed that the
    changes introduced into the tool construction and the preform geometry reduced
    the diameter, and thus also the volume, of the charge as well as provided a possibility
    of implementing robotization and automatization of the forging process in the
    future. The obtained results showed that the introduction of an additional rolling
    blank resulted in a reduction in forging forces and energy by 30% while reducing
    the hammer blow by one. Attempts to implement robotization into the process were
    successful and did not adversely affect the geometry or quality of forgings, increasing
    production efficiency.


    Citation: Hawryluk, M.; Dudkiewicz, Ł.; Polak, S.; Barełkowski, A.; Miżejewski,
    A.; Szymańska, T. Improvement of the Technology of Precision Forging of Connecting
    Rod-Type Forgings in a Multiple System, in the Aspect of the Possibilities of
    Process Robotization by Means of Numerical Modeling. *Materials* **2024**, *17*,
    1087. https://doi.org/10.3390/ma17051087


    Academic Editors: Dimitrios Tzetzis, Konstantinos Tsongas and Nikolaos Kladovaslakis


    Received: 30 January 2024

    Revised: 15 February 2024

    Accepted: 22 February 2024

    Published: 27 February 2024


    **Keywords:** hammer precision forging; forging FEM modeling; robotization; technology
    improvement


    Copyright: © 2024 by the authors. Licensee MDPI, Basel, Switzerland. This article
    is an open access article distributed under the terms and conditions of the Creative
    Commons Attribution (CC BY) license (https://creativecommons.org/licenses/by/4.0/).


    # ## 1. Introduction


    Connecting rods are elements that join the drive systems in many machines and
    devices, including petrol chainsaws used, e.g., in the woodworking industry. They
    constitute an important safety element of the drive system and for this reason,
    they have to be characterized by high dimension–shape precision, quality, and
    performance properties [1]. In large lot production, for forgings of the connecting
    rod type, hot precision forging is applied in open or closed dies, usually on
    crank and screw presses, as well as hydraulic'
  merge: -1
  img_proc: true
- pgno: 141
  md: hammers, often in multiple systems, in order to improve the production efficiency
    with the preservation of the high product quality [2]. The obtained forgings are
    subjected to flash trimming as well as some additional procedures (cooling, thermo-chemical
    treatment, shot peening, finishing treatment through machining, defectoscopic
    tests, and final inspection). The process of producing connecting rod-type forgings,
    especially in multiple systems, still constitutes a big challenge and a not entirely
    solved problem, as, in the die forging processes, a huge role is played by the
    development of a proper tool construction and working impression geometry as well
    as selection of the correct technological parameters of the process, which translates
    to technology efficiency and product quality, with the consideration of tool durability.
    This is of significant importance in the case when the forgings are required to
    have an additionally specified structure and hardness, which are obtained as a
    result of both the forging process and, often, a proper thermal treatment [3].
    The most important factors affecting these aspects are the technological parameters,
    the shape and quality of the tools as well as the number of operations, the geometry
    of the preform and the slug forging, and also the thermal parameters affecting
    the tribological conditions [4,5]. Although the forging technology is relatively
    well-known, the proper preparation of the forgings, especially ones of a complicated
    shape, will fulfill the precision and quality requirements demanded from the constructors
    and technologists, as well as operators, to possess extensive knowledge and experience
    [6]. A certain aid as well as solution in the increase in stabilization and efficiency
    of production is the introduction of automatization and robotization of the forging
    processes [7], however, it is an additional challenge, requiring time and financial
    resources. The literature provides few applications of effective automatization
    and robotization of die forging processes, which, however, are dedicated to specific
    types of forgings, and each one requires an individual approach [8,9]. This creates
    the need to design the technology from scratch, as it requires a redesign of the
    tools and consideration of the role of the robots’ grippers in the process [10].
    In the case of hot die forging, one should also consider the abrasive wear of
    the tools’ working impressions during production, which causes material losses,
    which, in turn, increase the forging volume at the expense of the forging material,
    which makes the gripping of the forging by the robot significantly more difficult,
    and this should also be considered in the design of automated forging processes.
    In the case of forging process automatization, one should especially take into
    account not only the vibration but also the large elastic deflections of the whole
    tool sets, which requires the application of compensation in the gripper joints/their
    docking, or the application of other solutions [11]. Such solutions coupled by
    means of machine communication enable control of the slide as well as the time
    of the hold-up for the required time [12,13]. This is also connected with the
    implementation of additional sensors and detectors, elements of electronics, as
    well as the application of specialized software, and also the necessity of performing
    numerous tests and trials [14]. The attempts at introducing automatization and
    robotization of hot forging processes, in the case of using at least a part of
    the outdated machinery park, are even more difficult [15,16]. At the same time,
    at every stage of the technological line, there is a potential risk of the occurrence
    of a defect/problem lowering the quality of the products or causing unfulfillment
    of the geometrical or microstructural requirements (improper structure after forging,
    inappropriate hardness, etc. [17]. Also, many times, the cause of the errors identified
    at a given stage is an improperly developed technology, also in the aspect of
    robotization, and/or it not being followed at the earlier stages of the process
    [18]. As we know, a properly elaborated industrial process of plastic treatment
    requires the realization of numerous experiments and tests, which is connected
    with huge costs and a lot of devoted time [19], and still, the most important
    stage of design and optimization is the final verification of the developed process
    under industrial condition [20,21]. For this reason, at present, for the analysis,
    optimization, or elaboration of new technology, engineering programs based on
    CAD/CAM/CAE are used, which are aided by IT tools [22–24], as well as the very
    popular numerical modeling, which often constitutes an independent tool [25,26].
    The simultaneous application of many methods and techniques aiding the
  merge: -1
  img_proc: true
- pgno: 142
  md: 'design, simulation, and production enables a global and complex approach to
    the given problem [27,28]. The available literature provides many studies and
    articles referring to the use of numerical modeling techniques for the analysis
    and optimization of plastic-forming processes. In such a case, numerical modeling
    based on FEM/FVM [29] is mostly applied for the determination of the optimal shape
    and dimensions of the slug forging, as well as the material flow and filling of
    the impression, and also the temperature field, both in the forging and the tools,
    or for the determination of the deformation distribution, and even the grain size
    after the process [30]. The studies [31,32] apply FEM for a complex analysis of
    the forging process in order to improve the analyzed technology. In turn, in the
    works [33,34], FEM was used for an analysis of the process of flash trimming.
    The currently used calculation packages are equipped with more and more functions
    enabling an even better and more thorough analysis of the metal forming processes
    [35–37], making it possible, e.g., to analyze the wear of the dies and forging
    punches (Forge, QFORM, Simufact, Deform) [38,39]. More and more often, in FEM
    [40,41], special functions for flaw detection are applied [42]. The application
    of such functions by the user makes it possible to significantly shorten the implementation
    time of a new project and limit the errors, e.g., during the design of new instrumentation
    taking into account the gripping by the robots’ grippers [43]. Although numerical
    modeling and IT tools [44] significantly change the role and scope of the experiment
    to the virtual dimension, the real experiment remains, on the one hand, the best
    and most necessary verification, and on the other hand, it is the most expensive
    and time-consuming stage of design [45]. Nonetheless, numerical modeling has been
    and still is a very convenient, fast, and most commonly applied tool for the analysis
    and optimization of production processes, including the robotization and automatization
    of die forging processes [46]. What is more, a continuous expansion of such IT
    tools with new functions and capabilities makes it possible to approach the real
    experiment even closer. The additional support of the numerical modeling results
    with measurement techniques (3D scanning, etc.), as well as microstructure examinations,
    enables a complex analysis of the whole technology, as well as its improvement
    and development [47,48]. The aim of the research is to construct a proper numerical
    model of a hot forging process of producing a connecting rod forging in a triple
    system, in order to improve the current technology, especially in the aspect of
    introducing an additional rolling pass (to increase efficiency), as well as optimizing
    the technological parameters of the process and the possibilities of robotization
    of the precision forging process realized so far.


    # ## 2. Test Subject and Methodology


    In the research, an analysis was performed of a 3-type forging elongated forgings-high
    (with a stem) with protrusions of a connecting rod type, produced in a triple
    system. Figure 1a presents the application of this forging product. A CAD model
    of a single forging is shown in Figure 1b. A dimensioned forging is presented
    in Figure 1c.


    ![](img/7578a5220236942261475fd7af81489e_142_0.png)


    Figure 1. View of (a) a CAD model, (b) a photograph of the forgings after the
    consecutive stages of the manual production process, and (c) a single-dimensioned
    forging.


    The current process of producing a connecting rod forging is realized in 2 forging
    operations: roughing and finishing forging. The charge material is a bar, with
    a diameter'
