    to the most careful cleaning being applied. The specimen P1 shows higher porosity
    values in comparison with P2, P3, and P4 due to the non-smooth and oxidized surface
    generated as the last layer by DMD in P1 compared to the milled surfaces in the
    other process chains. The results for the three applied cleaning techniques (P2,
    P3, P4) show very close results at approximately 0.1%, not depending on the cutting
    liquid concentration. The specimen P5_100 shows the highest porosity for these
