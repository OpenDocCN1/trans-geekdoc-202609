    # 3. Results and Discussion


    The research was divided into a few stages, among which the first three included
    an analysis of the technology implemented so far in the manual system, as well
    as the design and modeling of the forging process with the consideration of the
    aspects of robotization. In turn, the last stage referred to preliminary tests
    under industrial conditions for verification of the performed research.


    # 3.1. Analysis of the Current Technology in a Manual System


    Forgings characterized by an elongated shape with a big difference between the
    cross-sections along the length, such as connecting rods, are usually made from
    a slug forging, in which the material is already preliminarily formed. Forgings
    can be produced in different ways. The most efficient method is the use of dedicated
    machines, i.e., forging rolling mills, in which the milling can take place by
    the method of transverse rolling or periodic rolling. However, in the case of
    no rolling mill, the forming process can happen directly on the hammer through
    open or semi-open die forging in the dedicated spot on the die. In the current
    process of forging a connecting rod, a multiple system is used, in which three
    forgings are made from a round bar. The forging process takes place in two operations.
    The first forging operation, i.e., roughing, consists of flattening a cylindrical
    preform placed on the diameter. This operation involves the highest pressures
    and material deformations. The second operation is finishing forging, as a result
    of which we obtain a shape close to that of the ready product. The lubricant is
    used as a mixture of graphite with water in proportion 1:16. The efficiency of
    the current technology is 2100 items per shift (700 leaves); the cycle time for
    the manual process is 19 s. Figure 3 shows the thermograms from the process for
    the charge, the tools, and the forging.


    ![](img/7578a5220236942261475fd7af81489e_144_1.png)


    Figure 3. View with the temperature distribution during forging: (a) the charge
    lying on the feeder; (b) the temperature results for upper tools; (c) the results
    of lower tools; and (d) the temperature of forging.'
