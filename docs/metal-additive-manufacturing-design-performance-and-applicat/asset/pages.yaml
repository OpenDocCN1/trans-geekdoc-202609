    rapidly. Therefore, for the hot stamping of uncoated boron steel, it is necessary
    to control the atmosphere to minimize the amount of oxygen in the environment
    during formation. Otherwise, surface oxide layer removal through processes such
    as shot peening will be required, which increases manufacturing costs and becomes
    an obstacle to using uncoated boron steel sheets. However, in actual component
    manufacturing processes, controlling the oxygen level close to a vacuum to suppress
    the oxide layer is highly challenging. It is more practical to introduce a threshold
    oxygen level condition in the hot stamping process of uncoated steel that ensures'
