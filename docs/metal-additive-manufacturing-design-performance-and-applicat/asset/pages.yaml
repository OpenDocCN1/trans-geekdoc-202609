    # ### 2.3. Material Selection and Additive Manufacturing


    After the design of friction pads, the next stage is the manufacturing process
    for these parts. The first step in this process is the material selection. The
    existing friction pads are fabricated from tool steels in order to withstand the
    increased braking loads. In this context, for the developed friction pads, the
    high-strength H13 tool steel was selected as the construction material. The upper
    section of Table 1 lists the basic properties of the H13 tool steel. These properties
    were provided by the manufacturer (OC Oerlikon, Freienbach, Switzerland) of the
    raw material for metal additive manufacturing and from a previously published
    study on 3D-printed H13 tool steel [12].'
