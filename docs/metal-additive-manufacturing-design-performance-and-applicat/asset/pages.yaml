- pgno: 72
  md: '# # Nanoindentation Creep Behavior of Additively Manufactured H13 Steel by
    Utilizing Selective Laser Melting Technology


    Evangelos Giarmas 1, Emmanouil K. Tzimtizis 1, Nikolaos Kladovasilikis 1,2, Dimitrios
    Tzovaras 2 and Dimitrios Tzetzis 1,*


    +   1 Digital Manufacturing and Materials Characterization Laboratory, School
    of Science and Technology, International Hellenic University, 14th km Thessaloniki-Moudania,
    Thermi, 57001 Thessaloniki, Greece; e.giarmas@ihu.edu.gr (E.G.)

    +   2 Centre for Research and Technology Hellas—Information Technologies Institute
    (CERTH/ITI), 57001 Thessaloniki, Greece

    +   * Correspondence: d.tzetzis@ihu.edu.gr


    **Abstract:** Nowadays, H13 hot work steel is a commonly used hot work die material
    in the industry; however, its creep behavior for additively manufactured H13 steel
    parts has not been widely investigated. This research paper examines the impact
    of volumetric energy density (VED), a critical parameter in additive manufacturing
    (AM), and the effect of post heat-treatment nitrification on the creep behavior
    of H13 hot work tool steel, which is constructed through selective laser melting
    (SLM), which is a powder bed fusion process according to ISO /ASTM 52900:2021.
    The study utilizes nanoindentation tests to investigate the creep response and
    the associated parameters such as the steady-state creep strain rate. Measurements
    and observations taken during the holding phase offer a valuable understanding
    of the behavior of the studied material. The findings of this study highlight
    a substantial influence of both VED and nitrification on several factors including
    hardness, modulus of elasticity, indentation depth, and creep displacement. Interestingly,
    the creep strain rate appears to be largely unaltered by these parameters. The
    study concludes with the observation that the creep stress exponent (n) shows
    a decreasing trend with an increase in VED and the application of nitrification
    treatment.


    **Keywords:** additive manufacturing; selective laser melting; creep properties;
    nanoindentation


    # ## 1. Introduction


    Additive manufacturing (AM) has become a major focus of research in recent years.
    This process involves building by precisely adding material layer by layer. AM
    offers advantages over traditional manufacturing, such as faster production, reduced
    waste, superior customization, and the ability to create near-net shapes. Laser-based
    AM is particularly useful for metallic parts in various industries. However, AM’s
    inherent complexity, arising from multiple design and process variables, poses
    challenges for researchers and limits the availability of commercial technologies
    [1–3].

    Driven by the rising demand for AM, particularly selective laser melting (SLM),
    the need for improved process development, especially for novel powder materials,
    has intensified. In SLM, a high-power laser melts a layer of powder, building
    a solid part layer by layer. The laser power, layer thickness, hatch width, and
    scanning speed are crucial parameters that control the build process and significantly
    impact both the build rate and the mechanical properties of the final part. Each
    material requires a specific set of these parameters to achieve desired qualities
    like high density and surface roughness [4–6]. SLM enables the rapid production
    of complex, functional metallic parts. Like other AM methods, SLM allows the creation
    of intricate geometries and features that are challenging or impossible with traditional
    methods like machining or pressure casting. It also offers the unique ability
    to manufacture parts with intricate internal cooling channels and lattice'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'structures, and consolidate multiple components into single, functional units
    [6–13]. This versatility, coupled with the wide availability of various metallic
    powders, makes SLM a highly attractive AM technology.


    To ensure that metal AM parts are suitable for industrial use, it is important
    to understand their mechanical behavior. This necessitates conducting experiments
    to assess vital mechanical behavior such as tensile strength and elongation. Numerous
    studies have already explored the impact of various printing configurations (like
    process parameters, build orientation, and so on) on the mechanical performance
    of H13 tool steel components produced through additive manufacturing [14–19].
    However, beyond tensile testing, nanoindentation is a commonly employed technique
    for assessing mechanical properties at submicron levels and holds significant
    value for experimental studies in the basic physics of materials. It facilitates
    the identification of individual occurrences like the activation of dislocation
    sources, the onset of shear instability, and phase changes during the testing
    process, by leveraging high-precision load-displacement data [20].


    Recently, there has been a strong focus on studying the creep behavior and mechanisms
    of micro- and nanostructured materials and thin films using nanoindentation creep
    tests [21,22]. Nanoindentation creep experiments offer several distinct benefits
    over conventional uniaxial creep tests. They can precisely measure localized creep
    characteristics like those of a thin film applied to a substrate, which cannot
    be determined using traditional uniaxial creep tests. Additionally, nanoindentation
    creep methods do not require a significant specimen volume, and multiple repeated
    tests can be conducted on a single sample. The duration of these tests is also
    considerably less than that of a standard uniaxial creep test [23]. Nguyen et
    al. [24] investigated the nanomechanical properties of H13 steel fabricated using
    the SLM method. The study focused on the interrelationship between the nanoindentation
    strain rate and hardness. The strain-rate sensitivity exponent (m = 0.022) of
    this material indicated that the nanoindentation hardness increased in a range
    of 8.41–9.18 GPa with an increase in the strain rate ranging from 0.002 to 0.1
    s⁻¹. In another research, the main focus was the relationship between the nanoindentation
    strain rate and hardness. The strain-rate sensitivity values were 0.022, 0.019,
    0.027, 0.028, and 0.035 for SLM H13 at laser scan speeds of 100, 200, 400, 800,
    and 1600 mm/s, respectively. This indicates that the hardness increases as the
    strain rate increases. Notably, the hardness values of the SLM H13 at the 200
    mm/s laser scan speed are the highest and least sensitive to the strain rate compared
    to the H13 samples at other scan speeds [25,26].


    In the current paper, the influence of crucial process-related additive manufacturing
    parameters on the mechanical and creep behavior of H13 hot work tool steel was
    investigated with the aid of nanoindentation tests. Additionally, the influence
    of nitrification has been studied. More specifically, the influence of volumetric
    energy density (VED) on the creep displacement, the creep strain rate, and the
    creep stress exponent (n) was studied. Other similar studies have utilized a generalized
    physical model (so-called “Maxwell–Voigt”) in order to reveal the plastic origin
    of high-entropy metallic glasses [27]. The presented research is very critical,
    because not too many similar studies are available in the literature concerning
    AM H13 hot work tool steel. The primary objective of this study is the investigation
    of the creep behavior of additively manufactured H13 hot work tool steel, with
    the intent of integrating it into standard industrial operations as a substitute
    for traditionally produced steel. Given the lack of comparable research, this
    investigation is poised to yield numerous significant findings. Figure 1 depicts
    the applied methodology of the present research paper.'
