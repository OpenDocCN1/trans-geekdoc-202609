    and S.T.; formal analysis, A.Z, A.N., A.P., N.S., D.G., V.S. and A.V.; investigation,
    D.G., N.S., A.P., A.V. and V.S.; data curation, V.S., A.Z. and A.N.; writing—original
    draft preparation, A.Z., S.T. and N.S.; writing—review and editing, S.T.; project
    administration, E.K.; funding acquisition, E.K. and A.Z. All authors have read
    and agreed to the published version of the manuscript.


    Funding: This research was funded by Government research assignment for ISPMS
    SB RAS, project FWRW-2024-0001.


    Institutional Review Board Statement: Not applicable.


    Informed Consent Statement: Not applicable.


    Data Availability Statement: The data presented in this study are available on
    request from the corresponding author.'
