  md: 'The increase in microhardness values after quenching for both layer deposition
    strategies may be due to the increased volume fraction of the α''-Ti phase.


    ![](img/7578a5220236942261475fd7af81489e_134_0.png)


    Figure 13. Microhardness profiles of as-built and as-quenched Ti-6Al-4V-0 (a)
    and Ti-6Al-4V-1 (b) samples.


    # 3.4. Mechanical Strength


    Tensile stress–strain curves of as-quenched Ti-6Al-4V-0 and Ti-6Al-4V-1 samples
    obtained without and with the arc torch weaving show that their mechanical characteristics,
    such as yield strength (YS), ultimate tensile strength (UTS), and relative elongation
    (ε), depend on the wall’s height (Figure 14). The yield strength values for Ti-6Al-4V-0
    in the bottom, middle, and top parts of the product are 531 ± 17, 701 ± 20, and
    725 ± 21 MPa, respectively; the same characteristics of the Ti-6Al-4V-1 samples
    are 560 ± 18, 770 ± 21, and 837 ± 25 MPa (Figure 14a). The bottom parts of the
    Ti-6Al-4V-0 walls demonstrate their UTS and ε at the levels of 698 ± 19 MPa and
    18%, respectively, while for the Ti-6Al-4V-1 samples, they are 643 ± 18 MPa and
    14%, respectively (Figure 14a). The UTS values in the middle and upper parts of
    the as-quenched Ti-6Al-4V-0 and Ti-6Al-4V-1 samples are identical and amount up
    to 903 ± 28 MPa. In this case, the relative elongation values in the middle and
    upper parts of the Ti-6Al-4V-0 wall are 11 and 18%, respectively, as compared
    to the 10 and 8%, respectively, measured on the Ti-6Al-4V-1 samples. Quenching
    allowed us to increase the tensile strength in the bottom part of both the Ti-6Al-4V-0
    and Ti-6Al-4V-1 samples up to 780–800 MPa (Figure 14b). At the same time, the
    UTS values in the middle and upper parts did not change and were at the level
    of ~920 MPa, while the relative elongation was reduced to 5% (Figure 14b).


    ![](img/7578a5220236942261475fd7af81489e_134_1.png)


    Figure 14. Tensile stress–strain curves obtained from as-quenched Ti-6Al-4V-0
    (a) and Ti-6Al-4V-1 (b) samples.'
