    ![](img/7578a5220236942261475fd7af81489e_93_0.png)


    Figure 4. Hydrogen content of the investigated specimens, measured by the hot
    gas extraction method. P1 is marked with a different pattern since it does not
    refer to any cleaning technique and liquid concentration.


    The hydrogen concentration in the specimens was measured 60 days after they were
    fabricated. They were stored at 20 °C and cut right before the HGE. Therefore,
    it was assumed that the concentration in the specimen interface decreased due
    to diffusion. To calculate the change in hydrogen concentration in the specimen
    with time, Fick’s diffusion law calculations were carried out. The diffusion coefficient
    D was assumed to be 5 × 10−15 m2/s, according to Aiello et al. [19]. The average
    value for the P5_5 sample, which is 2 ppm, was used in the calculations. The equations
    used were described in Section 2, and the results are shown in Figure 5.


    It can be seen that the width of the distribution increased over time, and the
    peak concentration decreased. The calculation showed that immediately after fabrication
    the concentration was 3.2 ppm. This change is relatively small for such a time
    interval due to the low Inconel diffusion coefficient and the absence of elevated
    temperature.


    Also, by extracting the HGE sample from the middle of the DMD sample, the capture
    of a small part of the material not exposed to hydrogen can be assumed, which
    might have affected the measurement results to a small extent, reducing them.
    Therefore, the authors estimate that the real concentrations in the interface
    zone are slightly higher.


    The results of carbon content measurement by EDS are shown in Figure 6. Four lines
