  md: 'Thus, the problem of using coolant in hybrid processes is an important issue
    that requires further study. Research in this direction can assist in determining
    the need for an additional technological cleaning operation, which is likely to
    increase the cost of the process and the final product. The aim of this study
    is to investigate the effect of interface cleaning methods in a combined DMD +
    milling process on the quality of the interface itself by studying the porosity,
    carbon and hydrogen content on multi-layer samples. To the best of the authors’
    knowledge, the impact of liquids on the subsequent DMD process has not been investigated
    in such detail previously.


    # 2. Materials and Methods


    # 2.1. Experimental Setup


    The nickel-based superalloy Inconel 718 (Oerlikon Metco AG, Oerlikon, Switzerland)
    was selected for the experiments. A 5-axis combined milling and DMD machine GF
    HPM 450 U (Georg Fischer AG, Schaffhausen, Switzerland) was used for additive
    buildup of specimens. Additive manufacturing of the DMD structures was performed
    with the integrated laser processing system Ambits S5 from HMT (Hybrid Manufacturing
    Technologies, Midlands, UK) that includes an IPG YLR-1000-MM-WC (IPG Photonics
    Corporation, Oxford, MA, USA) fibre laser. The working distance of the processing
    head was set at 8.0 mm, which resulted in an approximate melt pool width of 2.2
    mm. Argon is used as shielding gas, nozzle protection, and powder carrier gas
    at flow rates of 8 L/min, 6 L/min, and 4 L/min, respectively. The material composition
    of the used powder is detailed in Table 1.


    # Table 1. Inconel 718 composition.


    | Element | Fe | Ni | Cr | Nb + Ta | Mo | Ti | Al | C | N | O |

    |---|---|---|---|---|---|---|---|---|---|---|

    | wt.% | 18.1 | 53.4 | 18.9 | 5.1 | 3.05 | 0.88 | 0.44 | 0.05 | 0.02 | 0.01 |


    The milling step was carried out with a metalworking fluid (MWF) semi-synthetic
    water-miscible cooling lubricant Viscotex Zubora 67H Ultra (VISCOTEX Schmiertechnik
    AG, Altstätten, Switzerland). The selected MWF was recommended for the milling
    of IN718 by the machine manufacturer. The density of the MWF is 0.97 g/cm³ at
    15 °C. The tests were conducted with 100% lubricant and 5% concentration emulsion.


    For the milling tests, a Fraisa W00410404 end mill with W50410013 cutting inserts
    (Fraisa SA, Bellach, Switzerland) was used. Cutting parameters were chosen in
    accordance with recommendations from the manufacturer: cutting speed—40 m/min,
    feed per tooth—0.04 mm, axial infeed depth—1 mm, radial infeed depth—15 mm (30
    mm is maximal for this tool), spindle speed—320 revolutions per minute, feed rate—51
    mm/min.


    # 2.2. Fabrication of the Specimens


    The geometry of the specimens is shown in Figure 1. The scanning raster orientation
    was changed by 45° for each layer (Figure 1b). The scanning speed was 200 mm/min
    for the contour and 333 mm/min for the raster [15]. The specimens were produced
    segment by segment, with intermediate machining between the segments. The segment
    height is 4 mm, and the whole specimen is 8 mm. These dimensions were chosen to
    be representative of process conditions in a massive segment. Five sets of three
    specimens were fabricated for each lubricant concentration with different cleaning
    techniques applied to the interface between segments (Table 2). Method P1 was
    chosen as the reference, demonstrating the cladding process on top of the uncleaned
    and unprocessed DMD part. Method P2 includes manual cleaning with ethanol—a proven,
    but manual technique. Method P3 includes cleaning with air blasting—a method which
    can be relatively easily implemented and automatised but might require machine
    modification. Method P4 includes the laser treatment of the surface with a defocused
    laser beam with a power of 1000W to evaporate liquid before cladding. Defocusing
    was carried out by moving the nozzle 10 mm in the +Z'
