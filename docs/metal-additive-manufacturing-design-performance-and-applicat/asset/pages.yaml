    The results of porosity measurement by the optical method are presented in Figure
    3. The porosity was measured on the polished specimens in three areas of the interface
    for each specimen. The measurements took place no further than one layer away
    from the interface. The porosity result for a DMD specimen, fabricated without
    interim milling, is 0.1%. The results of specimen P1_5 show porosity values comparable
