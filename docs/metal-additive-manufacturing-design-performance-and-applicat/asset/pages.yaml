  md: 'designed, which served to reduce the amount of energy needed for the deformation
    in the rolling pass. However, after the simulation, this solution was abandoned
    because there were no noticeable differences between the rollers in both versions,
    whereas the use of a magazine would involve unnecessary milling. After being connected
    to the lower and upper die (Figure 5), the roller obtained its final shape.


    ![](img/7578a5220236942261475fd7af81489e_146_0.png)


    Figure 4. View of (a) a forging model with the predicted flash, (b) a diagram
    of the forging’s sections, (c) a correlated ideal slug forging, and (d) a 3D model
    used to prepare the roller.


    ![](img/7578a5220236942261475fd7af81489e_146_1.png)


    Figure 5. A 3D model of (a) the upper die with the roller and (b) the lower die
    with the roller.


    In order to avoid the flash moving between the dies, in the area of its possible
    occurrence, the gap between the dies, 1.6 mm high, was expanded up to the border
    of the locks.


    # 3.3. Modeling of the Forging Process with Rolling


    The forging process of connecting rod-type forging on a robotized station will
    be realized with the application of an additional rolling operation, which was
    developed in order to reduce the diameter of the charge material from 20 mm to
    18 mm. Special attention in the simulation was paid to the rolling operation,
    for which a dozen or so variants were created. During the deformation process,
    the tips of the bar were not deformed as they were to be held by the robots. The
    conditions assumed in the calculations of the forging process on the automatized
