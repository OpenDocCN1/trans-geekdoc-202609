  md: "# 4. Conclusions\n\nThe effect of volumetric energy density (VED) and the use\
    \ of nitrification as a heat-treating process on the creep behavior of H13 hot\
    \ work tool steel produced with the SLM process, and relevant creep parameters\
    \ such as steady creep strain rate (ε̇) and the creep stress exponent (n), were\
    \ investigated in the presented research using nanoindentation tests. Concerning\
    \ the hardness, the modulus of elasticity, and the indentation depth, specimen\
    \ 16 with a VED of 150 J/mm³ exhibits the most favorable characteristics both\
    \ before and after the nitrification process. Nitrifcation significantly enhanced\
    \ the nanoindentation behavior of H13 hot work tool steel. Hardness increased\
    \ by up to 51.23%, with specimen 16 exhibiting the highest value (8960 ± 77 MPa)\
    \ after heat treatment. The effect on the elastic modulus was less pronounced,\
    \ with an average increase of around 4.3%. However, all specimens displayed a\
    \ modulus exceeding 215,000 MPa after nitrification. Moreover, a significant influence\
    \ of both VED and nitrification on creep behavior has been revealed. Non-nitride\
    \ specimens displayed a 31.32% reduction in creep displacement (from 0.0166 μm\
    \ to 0.0114 μm) as the VED increased from 50 J/mm³ to 150 J/mm³. Similarly, nitride\
    \ specimens exhibited a decrease in creep displacement of 33.79% (from 0.0145\
    \ μm to 0.0096 μm) at these VED levels. Furthermore, nitrification consistently\
    \ reduced creep displacement across all VED conditions, with an average decrease\
    \ of 24.54%. Finally, despite that the steady creep strain rate does not vary\
    \ significantly with the aging process, the creep stress exponent (n) seems to\
    \ decrease by 43.32% (from 6.67 to 3.78) for non-nitrided specimens and 50.73%\
    \ for the nitride ones.\n\nTo sum up, the aforementioned studies pave the path\
    \ for initiating considerations of the creep behavior in additively manufactured\
    \ H13 steel components. Given the criticality of creep resistance in the high-performance\
    \ applications typically associated with these metals, understanding this behavior\
    \ is paramount.\n\nAuthor Contributions: Conceptualization, E.G. and D.T. (Dimitrios\
    \ Tzetzis); methodology, E.G. and D.T. (Dimitrios Tzetzis); software, E.G.; validation,\
    \ N.K. and E.K.T.; formal analysis, E.G. and E.K.T.; investigation, E.G.; resources,\
    \ E.K.T., N.K. and D.T. (Dimitrios Tzovaras); data curation, E.G. and E.K.T.;\
    \ writing—original draft preparation, E.G.; writing—review and editing, E.G.,\
    \ N.K., D.T. (Dimitrios Tzovaras) and D.T. (Dimitrios Tzetzis);; visualization,\
    \ E.G. and N.K.; supervision, D.T. (Dimitrios Tzetzis); project administration,\
    \ D.T. (Dimitrios Tzetzis). All authors have read and agreed to the published\
    \ version of the manuscript.\n\nFunding: This research received no external funding.\n\
    \nInstitutional Review Board Statement: Not applicable.\n\nInformed Consent Statement:\
    \ Not applicable.\n\nData Availability Statement: The raw data supporting the\
    \ conclusions of this article will be made available by the authors on request.\n\
    \nConflicts of Interest: The authors declare no conflicts of interest.\n\n# References\n\
    \n+   1. Payne, G.; Ahmad, A.; Fitzpatrick, S.; Xirouchakis, P.; Ion, W.; Wilson,\
