    from ref. [21] and Figure 2b reproduced from ref. [17]).


    As previously noted, Y and Mg films deposited by the PLD technique typically range
    from hundreds of nanometers to a few micrometers in thickness, often insufficient
    to endure'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'repeated cleaning processes required for operational use. Thicker films, whether
    deposited by PLD or other methods, often result in high mechanical strain and
    cracking, leading to the detachment of the film from the RF gun back flange. Several
    approaches have been suggested to resolve this problem, including friction welding
    [52], hot isostatic pressing [53] and press-fitting bulk disks [47].


    However, inserting a disk of another material into the middle section of a Cu
    photocathode introduces minute discontinuities between the two metals, causing
    undesirable electrical discharges and reducing the RF cavity’s quality factor.
    On the contrary, the discontinuity between the substrate and the thin film in
    the non-conventional layout is very smooth. Thus, the non-conventional configuration
    mentioned earlier and shown in Figure 1b,d appears to be the most effective alternative
    to prevent these issues and the thinning process [48]. This innovative design
    allows the metallic photocathode to retain the photoemissive properties of Y bulk
    [24]. Indeed, with the present assembly, the laser cleaning process is related
    to bulk metal (Y or Mg) and not to the thin film. The most thoroughly investigated
    MP in this non-conventional setup is a Cu thin film annually realized on a Y disk
    (see Figure 1b), combining photoemissive characteristics of Y with electrical
    properties of Cu. The conductive Cu thin films were analyzed morphologically,
    structurally and electrically to ensure their suitability for application. Scanning
    electron microscopy (SEM) showed the presence of small droplets on the Cu surface,
    albeit in smaller quantities compared to other metal deposition techniques [2].


    The structural characteristics of the Cu film on the Y substrate, deposited by
    sub-ps laser pulses, utilized as a photocathode, were analyzed by X-ray diffraction
    (XRD). The XRD pattern in Figure 3 indicates peaks corresponding to the (111),
    (200) and (220) crystallographic planes of Cu, while other peaks are attributed
    to the Y polycrystalline substrate. Both morphological and structural analyses
    indicate the Cu film’s promising properties for application, and its high adherence
    to the Y substrate is also confirmed.


    ![](img/7578a5220236942261475fd7af81489e_65_0.png)


    Figure 3. XRD pattern of Cu film deposited by PLD technique on a Y disk by sub-ps
    laser pulses. The peaks labeled as * can be ascribed to the Y polycrystalline
    (reproduced from ref. [48]).


    This excellent physical performance is mainly tied to the substantial kinetic
    energy of particles within the Cu plasma during the laser ablation procedure.
    The mean electrical resistivity of a 100 nm thick Cu film on a Y substrate was
    measured at 2.3 × 10−6 Ω·cm, translating to a sheet resistance of 3.1 × 10−1 Ω/sq
    [24]. This measured resistivity value is about 36% higher than that of bulk high-purity
    Cu (1.69 × 10−6 Ω × cm) [54], likely due to electron scattering caused by the
    atomic-scale surface roughness of the deposited film [55].


    # 3.2. Hybrid and Non-Conventional Configurations of Superconducting Photocathodes


    Superconducting photocathodes leverage the unique properties of superconducting
    materials to generate high-brightness electron beams with minimal energy dissipation.
    Nb and Pb are the most commonly used materials in SCPs due to their favorable
    superconducting properties. Due to its high critical temperature and good mechanical
    properties,'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'is widely used in SRF cavities. Pb, although having a lower critical temperature,
    offers a higher QE when used as a photoemissive material. The combination of these
    materials in hybrid configurations aims to utilize the high QE of Pb and the robust
    superconducting characteristics of Nb [25]. The deposition methods, like PLD,
    for creating these hybrid configurations are critical as they affect the film’s
    adherence, uniformity, and overall performance. The challenge of maintaining surface
    cleanliness and preventing oxidation is paramount, as these factors directly impact
    the photoemissive efficiency and lifespan of SPCs. The hybrid configuration for
    superconducting photocathodes (SCPs) primarily incorporates Nb and Pb metals.
    These devices are created by depositing a thin Pb film onto a Nb substrate employing
    numerous deposition methods, such as electroplating, arc deposition, sputtering,
    and thermal evaporation [15,31,34,56–58]. Figure 4 shows the XRD pattern of the
    Nb film, indicating that the PLD film is largely amorphous, with a weak peak around
    38° corresponding to the (110) crystalline planes. Other peaks are attributed
    to the Pb substrate.


    ![](img/7578a5220236942261475fd7af81489e_66_0.png)


    Figure 4. XRD pattern of the Nb PLD film deposited on Pb substrate (reproduced
    from ref. [25]).


    Figure 5a,b display the electron charge emitted from a Pb thin film prepared by
    PLD in a hybrid configuration compared to Pb bulk versus the laser energy.


    ![](img/7578a5220236942261475fd7af81489e_66_1.png)


    Figure 5. Charge of the electrons emitted from (a) Pb film prepared by PLD in
    hybrid configuration and (b) Pb bulk before (□) and after (■) laser cleaning treatment
    (reproduced from ref. [50]).'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The QE values for Pb bulk and Pb thin film are \(7 \times 10^{-5}\) and \(8
    \times 10^{-5}\) at 266 nm, respectively [50], which are significantly higher
    than the \(3.2 \times 10^{-6}\) QE of the Nb bulk at 248 nm [13]. However, it
    is observed that a slight space charge effect occurs at laser energies exceeding
    35 \(\mu\)J. Despite the good chemical stability of Pb, its surface oxidizes when
    exposed to air, necessitating laser cleaning before its use in SRF guns. As with
    MPs, these cleaning processes lead to the thinning of the photoemitting surface,
    compromising the performance and lifespan. Consequently, alternative mechanical
    and physical solutions have been explored by various research groups.


    In a non-conventional set-up, a configuration was proposed where a Pb disk is
    entirely coated with a Nb thin film, excluding its central surface, which serves
    as the photo-emitting area (Figure 1d) [25]. As in the case of metallic photocathodes,
    in the non-conventional configuration the drive laser acts on the Pb bulk and
    not on the thin film. Mechanical solutions face similar challenges as those with
    MPs; thus, PLD appears to be an optimal technique for depositing highly adherent
    thin films. The Nb films were analyzed for their morphological, structural and
    electrical properties, as well as mechanical properties.


    Nano-indentation analysis determined the mechanical properties of the Nb film,
    revealing a good hardness value of \(2.8 \pm 0.3\) GPa [25]. It is crucial to
    avoid surface scratches on photocathodes, as these can cause electrical discharges
    under the high electric fields in superconducting cavities.


    Another vital characteristic of SCPs are their electrical compatibility with superconducting
    cavities. Figure 6 shows the sample resistance as a function of temperature, with
    two noticeable discontinuities: one at 9.3 K, corresponding to the critical temperature
    of Nb, and another at 7.3 K, near the critical temperature of Pb [25].


    ![](img/7578a5220236942261475fd7af81489e_67_0.png)


    **Figure 6.** Electrical resistance evolution of the sample Nb thin film on Pb
    substrate with the temperature (reproduced from ref. [25]).


    In this non-conventional configuration, SCPs have similar photoelectrical properties
    to Pb bulk. These findings indicate that the non-conventional setups for both
    MPs and SCPs show the greatest potential and dependability among the various proposed
    configurations (see Tables 1–4).'
