  md: 'Therefore, the braking force (BF) for each safety gear is evaluated by the
    following equation. This equation indicates the necessary vertically applied force
    (VF) from the friction pads to guide rails in order to achieve the desired friction
    force (Equation (3)). Where \(\mu\) is the experimental coefficient of friction
    between the friction pad and the guide rail.


    \(\begin{aligned} BF &= \frac{\text{Total Braking Force}}{2} \\ VF &= \frac{BF}{\mu}
    \end{aligned}\)

    (2)

    (3)


    From the aforementioned analysis, it is obvious that in order to immobilize an
    elevator, a sufficient amount of vertical force should be applied on the guide
    rails, much higher than the weight force, due to the fact that the coefficient
    of friction ranges between 0 and 1. This amount of vertical force often severely
    damages the guide rails, increasing dramatically the maintenance cost after an
    emergency brake activation. Therefore, elevator manufacturers explore novel ways
    to reduce the amount of vertical force. The most straightforward technique to
    reduce the vertical force is to increase the coefficient of friction between the
    friction pads and the guide rails. According to the datasheet of the KLEEMANN
    Group elevator manufacturer, the existing friction pads exhibit a coefficient
    of friction of around 0.3. Hence, in the scope of this paper, novel surface architectured
    materials are employed on the surface of the friction pad in order to increase
    the coefficient of friction and thereby reduce the applied vertical force offering
    efficient and smooth elevator immobilization without damaging its guiding system.


    # 2.2. Design of Bio-Inspired Braking Pads


    In the context of this study, four different surface-architected materials were
    employed with the aim of increasing the surface’s coefficient of friction. These
    structures were inspired by natural structures with high dynamic friction performance,
    such as the pads of a frog’s back legs and the pads of cheetah legs for honeycomb
    structures and for car-tire-like structures, respectively [9,10]. The selected
    surface-architected materials, i.e., extended honeycombs, honeycombs, speckled
    honeycombs, and a car-tire-like structure, were integrated into the structure
    of existing friction pads as it is presented in Figure 3. In general, honeycomb
    configurations are employed in the automotive industry [11] for braking applications
    showing enhanced braking performance, therefore, three of the four chosen structures
    belong to this category. On the other hand, the car-tire structure has been designed
    to have traction on the road, thus the corresponding structure (car-tire-like)
    was a suitable candidate for an elevator braking pad. The concept behind the selection
    of these structures was to create consecutive extended contact surfaces with sufficient
    channels for debris removal. In this way, the accumulated friction increases the
    coefficient of friction between the pad and the smooth surface of the guide rail
    minimizing the damage due to the reduced vertical force and the uniform removal
    of metal filings during the braking process. The designed dimensions of the employed
    structures were chosen in order to offer high printability for the developed friction
    pads and ensure sufficient diffusion channel width. The thickness of each structure’s
    elements (i.e., for unit cell) was 2 mm in order to provide an extended life cycle
    (i.e., more than one use) for the braking pad without compromising their mechanical
    performance. It is worth mentioning that the design process was performed in the
    SolidWorks™ design platform (Dassault Systèmes SE, Vélizy-Villacoublay, France).'
