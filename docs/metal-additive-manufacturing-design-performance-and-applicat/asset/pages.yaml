    higher, resulting in the highest microhardness observed.


    # 5. Conclusions


    +   1. The Ti6Al4V/Inconel 718 composite material was successfully fabricated
    using Ti6Al4V and Inconel 718 welding wires as raw materials, employing the double-wire
    Wire and Arc Additive Manufacturing (WAAM) deposition method at various deposition
    currents. However, it was observed that an increase in the deposition current
    correlated with the emergence of cracks within the composite material.


    +   2. As the deposition current increases, the secondary dendrite spacing in
    the deposition samples first increases and then decreases. At a deposition current
    of 35 A, the secondary dendrite spacing measures 5.16 μm, while at 50 A, it reduces
    to 3.96 μm. Notably, the samples prepared at a deposition current of 35 A exhibit
    good morphology, with no visible cracks or defects.


    +   3. At a deposition current of 35 A, the microstructure primarily consists
    of a nickel-based alloy, with Ti elements dispersed along the dendrite axis through
    diffusion. At deposition currents of 40 A and 45 A, the contents of titanium,
    nickel, chromium, and iron between the dendrite axis and the dendrites show minimal
    variation. However, at 50 A, TiNi, Cr2Ti, and Fe2Ti are predominantly deposited
    on the dendrite axis, while MC carbide is also found there. Additionally, Ni3Ti
    is mainly deposited between the dendrites.


    +   4. At a deposition current of 50 A, cracks appear in the prepared sample,
    exhibiting a cleavage fracture. The excessive heat input leads to stress concentration
    in the deposited layer, surpassing the yield strength of the alloy and resulting
    in a cracked cross-section.


    +   5. The hardness data indicate that the microhardness of the sample increases
    with the current. Specifically, when the current rises to 50 A, the microhardness
    shows a 31.51% increase compared to the value at 35 A.


