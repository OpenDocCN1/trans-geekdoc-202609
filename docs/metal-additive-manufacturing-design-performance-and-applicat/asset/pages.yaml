    with low CoF are stressed more than the ones with higher CoF, leading to faster
    and abrupt part failure. Indeed, the conducted FEAs have shown similar results,
    as presented in Figure 9. More specifically, friction pads with the structures
    of extended honeycombs (Figure 9d) and car-tire-like (Figure 9e) exhibited lower
    stress concentrations, uniformly distributing the applied loads. In addition,
    the commercial friction pad (Figure 9a) and the friction pad with honeycomb structure
    (Figure 9b) revealed similar mechanical performance in terms of equivalent von
    Mises stress showing a maximum von Mises stress value of around 170 MPa. On the
    other hand, the friction pad with speckled honeycomb structure (Figure 9c) concentrated
    the highest stress reaching 212 MPa, due to the localized high stress concentration
    regions derived from its honeycomb spots. It is worth noting that the main stress
    concentration regions are observed around the support holes of the part, indicating
    the increased applied loads on the bolts/screws. Finally, it is clear from the
    numerically extracted mechanical behavior of the designed friction pads that the
    metal 3D-printed structures are capable of withstanding the friction loads providing
    promising results for further experimental examination. In conclusion, the higher
    coefficient of friction configurations exhibited optimal stress distribution,
    thereby preventing abrupt failure and ensuring more uniform load distribution
    across braking pads, as revealed by the conducted FEAs.


