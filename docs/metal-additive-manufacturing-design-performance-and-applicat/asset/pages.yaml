    The dominant creep mechanism and the ambient-temperature creep behavior of the
    materials can be studied by Equation (10) of the stress (s) and the creep strain
    rate ($\dot{\varepsilon}$) [21]:


    ```

    $\dot{\varepsilon} = \alpha \sigma^n$ (10)

    ```


    where n is the creep stress exponent and $\alpha$ is a material constant. The
    stress in a nanoindentation test should be connected to the pressure applied by
    the indenter. From the relationship of H = P/A = P/24.56hc² (where P is the holding
    load and A is the projected contact area of the Berkovich tip), the following
    equation for the creep stress in the holding stage can be easily assumed based
    on $\sigma$ = (H/3)/(hmax/h)² [22]. Moreover, the creep stress exponent n is derived
    by determining the slope of the ln $\dot{\varepsilon}$ versus ln$\sigma$ plot
    according to Equation (11):


    ```

    $n = \frac{d(ln\dot{\varepsilon})}{d(ln\sigma)}$ (11)

    ```'
