    # 3.5. Cracks


    Titanium alloys are important structural materials, while nickel-based alloys
    are considered superalloys. Due to their high thermal expansion coefficients,
    cracks are prone to develop during deposition. In the WAAM process, no cracks
    were observed in the deposited layers at deposition currents below 50 A. However,
    at a deposition current of 50 A, cracks were detected in the deposited layer.
    Figure 9 illustrates the macroscopic view of the partial cracks, as well as high-rate
    SEM images. No cracks were found in the first layer, but the crack section in
    the second layer Ti6Al4V/Inconel 718 appeared disconnected, with an uneven crack
    morphology. High-magnification SEM images (shown in Figure 9b–d) of the crack
    section reveal a microfracture morphology characterized by river and cleavage
    patterns, indicating a cleavage fracture mechanism.


    To investigate the phase composition of the crack section, an EDS scanning analysis
    of its microstructure was conducted. Figure 10 presents a high-magnification SEM
    image of the fracture bottom, revealing a precipitated phase A. EDS analysis indicates
    that the atomic ratio of oxygen to iron is approximately 1.6:1, suggesting that
    the precipitate is likely iron oxide. At position B, the ratio of nickel to titanium
    atoms is about 1:1, with the chromium and iron content being similar to that of
    titanium and nickel. However, the carbon content is relatively high, leading to
    the speculation that the main phase at position B is MC carbide. Previous studies
    have shown that small amounts of MC carbide can impede dislocation movement and
    stabilize grain boundaries, thus providing strengthening; however, excessive MC
    can result in stress concentration, reducing the alloy''s durability and contributing
    to crack formation [15]. At position C, the nickel atom content is highest, with
    titanium, chromium, and iron content being comparable. This leads to the speculation
    that the phase at this position may be a eutectic structure of brittle intermetallic
    compounds formed by Ni, Ti, Cr, and Fe.'
