    # 3. Results and Discussion


    # 3.1. Single-Layer Deposition Analysis


    To determine the appropriate process parameters, the ratio of two types of welding
    wire is adjusted by varying the speed of the wire feeder. After fixing the wire
    feeding speed for both types of welding wire, different deposition currents are
    applied to prepare the sediment. Figure 2 shows the deposition morphologies under
    different deposition currents. As the current increases, the roughness of the
    deposited layer also increases significantly, primarily due to the increase in
    the viscosity of the liquid metal. Van et al. [25,26] studied the relationship
    between heat input and forming quality, and the results showed that the lower
    the heat input, the smoother the surface of the sedimentary components. This is
    consistent with the morphology of the samples deposited in this work. At higher
    cooling rates, the wettability and diffusivity of liquid metals are reduced, resulting
    in poorer adhesion. Furthermore, when the current reaches 50 A, cracks appear
    on the surface of the layer.


    ![](img/7578a5220236942261475fd7af81489e_27_0.png)


    # Figure 2. Sedimentary morphologies of different sedimentary currents: (a) 35
    A, (b) 40 A, (c) 45 A, and (d) 50 A.


    # 3.2. XRD Phase Analysis


    The wire feed speed of Inconel 718 is twice that of Ti6Al4V. According to Formulas
    (1) and (2), when the element ratio of titanium to nickel is 1:2, a deposited
    layer is prepared using these two welding wires. During the deposition process,
    Ti-Ni intermetallic compounds are formed. In addition, Inconel 718 alloy also
    contains a certain amount of Cr and Fe, which may also form intermetallic compounds
    with Ti. The X-ray diffraction method was used to analyze the phases of the sediments
    prepared under different sedimentation currents, as shown in Figure 3. All the
    samples exhibited the TiNi phase, Ni3Ti phase, Cr2Ti phase, α-Ti phase, and Fe2Ti
    phase.'
