    # 4. Trials under Industrial Conditions and Numerical Modeling Verification


    During the robotization of the forging process, it was decided that, from the
    moment of placing the heated material onto the die to the moment of it being moved
    to the hot trimming operation, the formed element would be held on both sides
    by the robots’ grippers, which would be moving synchronically during all the forging
    operations (Figure 14a). This would ensure stable support in two points, which
    would prevent the material from sliding out. The three robots assigned for the
    work would be performing the following tasks.


    ![](img/7578a5220236942261475fd7af81489e_151_0.png)


    Figure 14. View of (a) an idea of the simultaneous work of both robots, (b) the
    simulation on the robotized station in the RobotStudio program, and (c) the CAD
    model of forged elements, the so-called “leaves”, with single forgings.


    Robot R1 supports the heated bar, which has been moved out of the induction heater,
    and places it above the lower die in such a way that the other end can be gripped
    by robot R2. Both robots manipulate the forging during the forging process, after
    which robot R1 releases its grip and the further manipulation takes place only
    by robot R2, which intercepts the forgings connected by the flash and next, places
    them in the trimming press tool through the side window. Figure 14b presents the
    preliminary forging tests performed on the robotized station.


    In order to verify the properness of the forgings produced on the robotized seat,
    measurements of selected forged elements were made. In the first place, 3D scanning
    was carried out of the test batch of the connecting rod forgings collected from
    the forging process before the trimming. Presented below are representative scanning
    results. A cloud of points in the form of a triangle grid was obtained, which,
    after the measurement data equalization, was analyzed by means of the GOM software
    (version 2019). Figure 15 shows exemplary 3D scanning results in the form of a
    colored map of deviations for one leaf randomly selected from the whole series.


    ![](img/7578a5220236942261475fd7af81489e_151_1.png)


    Figure 15. Results of 3D scanning of the K22 forging.'
