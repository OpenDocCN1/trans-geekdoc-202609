- pgno: 49
  md: '![](img/7578a5220236942261475fd7af81489e_49_0.png)


    Figure 6. EDS mapping analysis of Al-Si-coated boron steel sheets before and after
    heat treatment.


    The oxide layer thickness was quantitatively measured by optical microscope with
    a hat-type specimen of uncoated boron steel sheet in order to investigate the
    oxide layer residual due to the different contact mechanisms between die and sheet
    during the hot stamping. Figure 7 shows the captured location of samples from
    the hat-type uncoated specimen. As shown in Figure 8, the oxide layer thickness
    was 23.46 μm, 1.81 μm, and 7.55 μm at the top, wall, and flange locations, respectively.
    At the top location, the thickest oxide layer was observed due to no contact between
    the die and the sheet. On the contrary, most of the oxide layer was removed in
    the wall location because severe contact occurs when the sheet slides against
    the die during the forming. At the flange location, the thickness is decreased
    due to the high compression of the die at the bottom dead center of the press
    slide. Most spot welds are made at the top and flange areas in the auto-body assembly
    process. It means that the thick oxide layer can deteriorate the welding quality
    by using an uncoated boron steel sheet in the hot stamping. Therefore, a novel
    stamping method is required to reduce or control the oxide layer formation in
    order to utilize the uncoated boron steel sheet for ultra-high-strength automotive
    parts.


    ![](img/7578a5220236942261475fd7af81489e_49_1.png)


    Figure 7. Sample-capturing locations of the hat-type specimen.'
