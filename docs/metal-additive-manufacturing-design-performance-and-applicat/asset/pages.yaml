    of the two STL files by local best-fit alignment function of the metrology software,
    (B) manual selection of each measurement area, and (C) selected border lines at
    eight measurement areas (three rests, four tissue stops, and one lingual bar area)
    and color mapping of the areas (green represents good fit, yellow to red represents
