    # 5.2. Deformation Behavior


    Figure 12 shows the deformation of each lattice structure during the compression
    experiment. In the initial stage of the compression experiment, slight deformation
    occurred in each structure. As the pressure continues to be applied, the pillars
    of the bottom unit deform and extend outward, and the bottom deformation of the
    FCC structure is the most significant. They have different deformation mechanisms
    after the yield stage. The failure of the three structures occurs at the nodes.
    The pillars at the fracture of the BCC structure are compressed in a horizontal
    direction, and the direction of the pillars at the fracture of the FCC structure
    is almost unchanged. Both are caused by the bending collapse of the pillars. The
    relative slip of the Dode structure occurs along the 45° direction. Finally, all
    three structures form extrusion bands along the 45° direction, resulting in catastrophic
    damage. In the compression process, it is found that the compression performance
    of the lattice structure substrate will be affected after laser cutting. Laser
    cutting causes the hardness of the bottom pillar to increase, the plasticity to
    decrease, and the bottom pillar is more likely to break under load.


    ![](img/7578a5220236942261475fd7af81489e_20_0.png)


    Figure 12. Deformation mode of lattice structure: (a) BCC, (b) Dode and (c) FCC.


