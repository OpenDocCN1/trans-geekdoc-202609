    # D-SmartML: A Distributed Automated Learning Framework


    Ahmed Abd Rahman, Mohamed El Hew

    Nile University

    Giza, Egypt

    [A.Rahman@nu.edu.eg,melhew@nu.edu.eg]

    Radwa Elshawi, Sherif Sakr

    University of Tartu

    Tartu, Estonia

    {radwa.elshawi,sherif.sakr}@ut.ee


    **Abstract—**machine learning is a crucial role in the harnessing of massive data
    amount every day. The process of building high-quality machine learning models
    requires literacy and time-consuming various machine learning applications without
    having a good experience with effectively tuning their hyper-parameters, it has
    been noted that many scientists can not scale with the growing data and volumes
    in our global world. Recently, several limitations of machine learning have been
    developed by the process of Combined Selection and Hyper-parameter tuning (CASH).
    It has been built on machine learning libraries (e.g. skikit-learn) that can only
    work on a single node and are not capable to scale and handle large data volumes.
    In this paper, we propose a distributed SmartML framework on Apache Spark, a distributed
    data processing framework. Our framework is equipped to integrate machine learning
    selection and different automated hyper-parameter tuning techniques: distributed
    grid search, distributed random search and hyperband optimization. We demonstrate
    the performance over state-of-the-art framework for Distributed ML optimization,
    Transmogrify.


    scientists with strong knowledge and good experience. Then, we are witnessing
    a growing interest to support the process of building machine learning pipelines
    with the presence of a human in the loop to be dramatically reduced. Particular,
    AutoML techniques are enabling the widespread use of machine learning technique
    by domain experts and non-technical users.


    Recently, several frameworks have been designed to support Combined Selection
    and Hyper-parameter tuning (CASH) [12], [14]. For example, Auto-Weka [6] is an
    automation framework for the CASH problem that has been developed on top of the
    popular machine learning library, Weka. It is based on Bayesian optimization using
    model-based algorithm configuration (SMAC) and structured Pareto search [14].
    We present AutoML framework that has been implemented on top of the popular python
    scikit-learn machine learning library. In our work, we presented SmartML [6] a
    package for CASH optimization using SMAC algorithm on top of R, a popular statistical
    computing programming language.


    # I. INTRODUCTION


    Recently, we have witnessed a continuous increase in the size of data produced
    by various fields of systems, devices and sources. It has been reported that there
    are 25 quintillion bytes of data being generated over 90% of the world in 2020,
    has been generated in the past two years. On the one hand, the more data there
    is, the more the results and the results that machine learning can produce. In
    this Big Data era, it is a winning goals lately achieved by machine learning and
    deep learning techniques in a wide range of fields [15]. On the other hand, this
    situation is increasingly contributing towards a potential data science crisis,
    similar to the software crisis [5], due to the need of having an increasing number
    of automated


    We present D-SmartML, Scala-based Distributed AutoML, a machine learning package
    implemented on top of Apache Spark, a distributed data processing framework. D-SmartML
    is equipped with a machine learning mechanism [8] for automated algorithm selection
    and supervised hyperparameter tuning techniques: grid search, random search and
    hyperband optimization. As a distributed framework, D-SmartML enhances the power
    of


