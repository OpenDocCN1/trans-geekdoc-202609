    AutoSkLearn (C columns) can provide a competitive performance for the relatively
    small datasets. As the size of the datasets grow, the centralized framework is
    outperformed by the distributed framework, especially for the largest datasets
    (20.7 GB and 24.6 GB), the centralized solution won Out-Of-Memory (OOM). The result
    also shows that the hybrid algorithm (i columns) for the different datasets and
    time budgets. In particular, for 7, 10, 11 and 12 for the times of 100, 300, 600
    and 1800 seconds the result is very best. The random search algorithm was not
    able to complete its models training for four and three datasets (with 0% accuracy)
    within the time budgets of 100 and 300 seconds. Hyperband algorithm was not able
    to complete models for only two and three datasets. Both distributed algorithms
    were able to handle all datasets at the time budgets of 600 and 1800 seconds which
    reflects the scalability advantage of the distributed systems.


    # III. EXPERIMENTAL EVALUATION


    We have conducted experiments to evaluate the performance of D-SMartML. The experiments
    ran on a Spark cluster, deployed on Google Cloud, with one master node with4 CPUs,
    16 GB RAM and worker nodes. Each worker node has 8 CPUs, 30 GB RAM and 500GB HDD.
    Our experiments have been conducted using 17 datasets from OpenML and UCI repositories.
    The sizes of our datasets range from 2MB to 7.5GB.


    A major factor for AutoML systems is the time budget which is allocated for the
    search process to identify the best performing model. The higher the chance for
    the AutoML system to explore various options in the search space and the higher
    probability to get a better recommendation. However, the better the time budget,
    the higher consumption cost, which could be translated into a monetary bill in
    the case of cloud-based resources. Any AutoML search process is likely to identify
    (near)optimal model in such a time. Thus, our first experiment has been designed
    to compare the performance of two centralized framework, AutoSkLearn, with D-SmartML
    implementation for the random search and hyperband algorithms (using four time
    budgets: 100, 300, 600 and 1800 seconds). The grid search has been conducted as
    it is designed to systematically attempt and evaluate all combinations of hyper-parameters
    without consideration for the time budget. For each dataset, 80% of the data has
    been used for the training phase and 20% for the testing phase.


    Table 10 shows the centralized solution of


    TransmogrAI is a Scale-based AutoML library, deployed by Salesforce, on Apache
    Spark. The automate process of TransmogrAI is performed as a grid search. We compared
    D-SmartML (using Hyperband) and TransmogrAI (Grid Search) using 15 datasets. This
    experiment focuses on finding the best model for each dataset (based on accuracy)
    in the shortest time. Therefore, we measured the time of each framework for the
    different time budgets of 100, 300, 600 and 1800 seconds.


