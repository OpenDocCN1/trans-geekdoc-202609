  mdcn: "\n# 2020 IEEE 第40 次国际分布式计算系统会议 (ICDCS)\n\n# D-SmartML: 一种分布式自动化学习框架\n\nAhmed\
    \ Abd Rahman, Mohamed El Hew\n尼罗大学\n吉萨，埃及\nA.Rahman@nu.edu,melhew@nu.eg\nRadwa\
    \ Elshawi, Sherif\n塔图大学\n爱沙尼亚\nradwa.elshawi,sherif.sakr@ut.ee\n\n**摘要**机器学习在利用海量数据方面起着至关重要的作用。构建高质量的机器学习模型需要大量的专业知识和耗时来调优超参数。在全球范围内，我们注意到许多科学家无法随着增长的数据量进行扩展。最近，人们已经开发了一些框架来支持自动化算法选择和超参数调优（CASH）。然而，许多现有的机器学习库（例如\
    \ `scikit-learn`）只能在单节点上工作，并且无法扩展并处理大规模数据量。在本文中，我们提出了一种基于 Apache Spark 的分布式 SmartML\
    \ 框架。我们的框架配备了不同的自动化调优技术：网格搜索、随机搜索和 Hyperband 优化。我们展示了该框架在分布式 ML 优化上的最先进性能。对于具有强大知识和良好经验的科学家来说，我们正目睹着在人类参与的情况下，构建机器学习流水线的兴趣日益增长。特别是，AutoML\
    \ 技术正使领域专家和非技术用户能够广泛使用。最近，已有几个框架被设计用于支持 CASH（算法选择和超参数调优）。例如，`Auto-Weka` [6] 是一个在流行的\
    \ Weka 机器学习库上开发的用于 CASH 问题的框架，基于模型的配置优化（SMAC）和结构化帕累托搜索 [14]。我们展示了一个在流行的 `scikit-learn`\
    \ 机器学习库上实现的 AutoML 框架。在我们的工作中，我们提出了 SmartML [6]，这是一个使用流行的 R 语言语言进行 SMAC 优化的包。\n\
    \n# I. 引言\n\n最近，我们见证了各个领域系统、设备和来源产生的数据量持续增加。据报道，过去两年中全球生成了 25 亿字节的数据。一方面，数据越多，机器学习和深度学习技术产生的结果就越多。在大数据时代，由于需要增加自动化算法的数量，这种情况日益导致了潜在的数据科学危机，类似于软件危机\
    \ [5]。另一方面，由于每个配置的巨大成本（例如时间和计算资源），处理大量分类器时，我们提出了一种基于 Apache Spark 的数据处理框架 D-SmartML，这是一种分布式\
    \ AutoML。D-SmartML 配备了机器学习机制 [8]，用于自动化算法选择和监督超参数调优技术：网格搜索、随机搜索和 Hyperband 优化。作为一个分布式框架，D-SmartML\
    \ 增强了……\n\n> *Forbes：我们每天产生多少数据* 2018年5月21日\n2557-8411/S83.$31.00/2020\nDOI 10.1109/ICDCS4774.2020.000115\n\
    授权用户限制至：埃塞斯特大学。2021年5月31日 04:03:03 UTC 来自 IEEE Xplore。适用限制。\n\n# 算法 1：Hyperband\
    \ 算法\n\n```\n输入：R, T, P\n输出：性能最佳的模型\n初始化 s_{max} = ⌊|R|⌋\nfor s ∈ {s_{max}, s_{max}\
    \ - 1, ..., 0}\n  if (T < Total(s)) then\n    n = ⌊s + 1⌋, r = R/s\n    / 为 T\
    \ 开始 (n, r) 迭代减半\n    while T < T\n    h = get(Hyperparameters, Configuration(n))\n\
    \    for i ∈ {0, ..., s}\n      n_i = n * r^i\n      r_i = r^i\n      M = evaluate_with_Time(r_i,\
    \ T), P)\n      h = topK(M, ⌊n_i/k⌋)\n    end\n  endif\nend\nreturn (best model)\n\
    ```\nimg/29a2b2cbd7acd1fd203e1aa5bbc88f9d_1.png\n\n# II. D-SMART 架构\n\n为了解决大规模数据集上的\
    \ AutoML 计算复杂度，图1了 D-SMART 的组件和框架架构，它由十一个分类器组成。sparkML：随机森林、逻辑回归、决策树、朴素贝叶斯和梯度提升树。我们通过实现线性判别分析和二次判别分析扩展了该包。sparkML\
    \ 提供的任何新分类器都可以包含。\n\n元学习是从各种任务中获得的先前经验中学习，并减少学习新任务所需的过程。对于任何优化，目标都是有效缩小搜索空间，以便选择或从少数分类器开始，这在处理大量分类器时，由于每个配置的成本很高（例如时间和计算资源），对于减少输入数据具有重要意义。\n\
    \n算法由两个循环组成：迭代减半（Successive Halving）以及带有不同预算和超参数数量调用内部循环的外层循环。我们使用了 `spark.ml`\
    \ 中的模型并行能力，以便在集群具有足够计算能力的情况下并行模型。库暴露了一个参数来控制发送到 Spark 调度器的作业数量，可以更好地利用集群资源。\n\n\
    AutoSkLearn 可以为较小的数据集提供竞争性的性能。随着数据集规模的增大，集中框架性能被分布式框架超越，特别是对于最大的数据集（20.7 GB 和\
    \ 24.6 GB），集中解决方案会导致内存溢出（OOM）。结果还显示，不同数据集和时间预算的混合算法是最好的。为了开发这个元模型，我们选择了元特征（样本量、偏度和峰度）。为了解决这一挑战，我们开发了元模型（样本量、偏度和峰度）。超参数优化的主要目标是确定机器学习可以返回不同的性能。D-SMART\
    \ 支持许多技术：网格搜索、随机搜索和迭代减半。如算法 1 所示，算法返回四个参数：\n\n- R：定义分配给单个配置的最大资源量。\n- j：控制在每次迭代减半中丢弃配置的比例。\n\
    - P：定义并行程度：内部循环，其\n\n# III. 实验评估\n\n我们进行了实验来评估 D-SmartML 的性能。实验在部署在 Google 云上的\
    \ Spark 集群上运行，主节点 4 个 CPU、16 GB 内存，工作节点具有 8 个 CPU、30 GB 内存和 500GB HDD。我们的实验使用了来自\
    \ OpenML 和 UCI 仓库的 17 个数据集。我们数据集的大小从 2MB 到 7.5GB 不等。\n\n# IV. 演示场景\n\nD-SmartML\
    \ 是作为一个基于 Scala 的开发的，DSmartML 发布在 Maven 仓库中。在实验中，我们首先介绍了面临的所有挑战以及我们框架的主要目标。特别是，我们将展示集中式学习库（例如\
    \ `Auto-Weka`、`Auto-Sklearn`、`SmartML`）无法处理大规模数据集。然后，\n\n> https://www.openml.org/\n\
    > http://archive.uci.edu/ml/index.php\n> 分配给集中工具的计算资源（CPU，内存）等于分布式框架的资源量。\n> https://autoai.com/\n\
    > 我们报告的是数据集的一个子集由于空间限制。\n> 每次比较中的最佳值已用加粗字体和下划线标记。\n\n> https://github.com/salesforce/TransmogrAI\n\
    \n> D-SmartML 的源代码可用于：github.com/DataSystemsGroupUP/Distributed-SmartML,\n\n>\
    \ https://maven.apache.org/artifact/com.DataSystemsGroupUP/D-SmartML/0.0.1/\n\n"
