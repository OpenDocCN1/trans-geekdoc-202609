    # 2020 IEEE 40th International Conference on Distributed Computing Systems (ICDCS)


    # D-SmartML: A Distributed Automated Learning Framework


    Ahmed Abd Rahman, Mohamed El Hew

    Nile University

    Giza, Egypt

    [A.Rahman@nu.edu.eg,melhew@nu.edu.eg]

