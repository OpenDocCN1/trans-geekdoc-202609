    we will show how our approach, with few lines of code¹¹⁴, can help to tackle this
    challenge by demonstrating that the power of a computing cluster can help the
    end-users identify the machine learning algorithms and their hyperparameter settings
    that achieve optimal or near optimal results with little effort. We will also
    show how the performance of different hyperparameter tuning techniques (grid search,
    random search and hyperband) differ. The users will be able to monitor the progress
    of the search process as the library returns a stream of models when the best
    budget is discovered during any part of the search space.


    Finally, as part of our objective, we will provide the audience with the chance
    to compare the performance of D-SmartML using various datasets.


