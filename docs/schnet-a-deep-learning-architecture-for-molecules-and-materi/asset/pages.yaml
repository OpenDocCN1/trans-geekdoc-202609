    \ $a_z$ are initially randomized and optimized during training. They represent\
    \ atoms of a system disagreeing any information about their environment for now.\n\
    \n# B. Atom-wise layers\n\nAtom-wise layers are dense layers that apply separately\
    \ to the representations $x_i$ of each atom\n\n```\n$x_i^{(l+1)} = W^l x_i + b,$\n\
    ```\n\nSince W and biases $b$ are shared across atoms, our architecture remains\
    \ scalable with respect to the number of atoms. While the atoms are represented\
    \ through the network, they transform them and process information about the atomic\
    \ environments incorporated through interaction layers.\n\n# C. Interaction layers\n\
    \nThe interaction layers of SchNet refine the atom representation based on pairwise\
    \ interactions with the surrounding atoms. Here we model this with continuous-filter\
    \ convolution layers (which are generalizations of the continuous convolution\
    \ operation, e.g., Gaussians$^{27}$ or radial basis functions). This is necessary\
    \ because atoms are not located on regular-grid pixels, but can be located at\
    \ arbitrary positions. Therefore, using a filter-tensor, as in conventional convolutional\
    \ layers, is not applicable. We need to model the filters using atom-wise representations\
    \ $x_i$ at positions $R$, we model the interactions of the atom with all surrounding\
    \ atoms\n\n```\n$x_i^{(l)} = (x_i^{(l)} * W^{(l)}) = \\sum_{j \\in \\mathcal{N}(i)}\
    \ O^{(l)}(r_i - r_j),$\n```\n\nwhere '$$' denotes the element-wise multiplication.\
    \ Now we perform filter-wise convolutions for computational efficiency. Cross-feature\
    \ processing is subsequently performed by atom-wise layers, thus instead of a\
    \ filter tensor, we use a filter-generating network $x \rightarrow W$ that maps\
    \ the atoms to the corresponding value of the filter bank (see Sec. II).\n\nSchNet\
    \ is a variant of the earlier proposed Deep Tensor Neural Networks (DNNs)$^{25}$\
    \ and therefore shares a basis of their building embeddings, interaction refinements\
    \ and atom-energy contributions. At each layer, the system is represented through\
    \ using pairwise interactions between atoms. In the DNN framework, interactions\
    \ and interaction distances are modeled by layers, termed interactions. This can\
    \ be approximated using a low-rank factorization for computational efficiency$^{42-44}$\
    \ SchNet uses continuous-filter-networks to model the interaction term. In the\
    \ following, we describe the layers and how they are assembled to form the SchNet\
    \ architecture. For Fig. 1.\n\n# A. Atom-wise embeddings\n\nAn atomic system can\
    \ be described by a set of $n$ atoms with charges $Z = (Z_1, \\dots, Z_n)$ and\
    \ positions $R = (r_1, \\dots, r_n)$. The layers of SchNet, are described by a\
    \ tuple of feature maps $X^l = (x_1^l, \\dots, x_n^l)$, with $x_i^l$ with number\
    \ of feature maps, $F$\n\n![](img/8414c867baf7c2cb6823215231b56027_2_0.png)\n\n\
    A filter layer with atom-wise layers constructs the residual mapping of an interaction\
    \ block (see Fig. i). We use a shifted softplus $softplus(x - 0.5) + 0.5$ as activation\
    \ functions throughout the network. The shifting ensures that $softplus(0)=0$\
    \ and convergence of the network while having infinite order of connectivity.\
    \ This allows us to smooth potential energy surfaces, forces, and second derivatives\
    \ that are required for training with forces as well as the vibrational modes."
