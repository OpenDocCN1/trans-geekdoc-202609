  md: "![](img/8414c867baf7c2cb6823215231b56027_3_0.png)\n\nFIG. 2. The filtering-generating\
    \ network shown in SchNet (left) and 5×5 filters through generated filters (right)\
    \ from the atoms under periodic boundary conditions (columns rows). Each filter\
    \ is learned from and generates the effect of an interaction on a feature atom\
    \ and representation located in the center of the filter. The number of neurons\
    \ is\n\nthe model and include chemical knowledge. We choose a fully connected\
    \ neural network that takes the vector pointing from atom i to its neighbor j\
    \ as an input to obtain the fitted values $W(r_i - r_j)$ (see Fig. 2, left). This\
    \ allows us to include invariance of molecules and materials into the model.\n\
    \n$r_{cut}$. We find that the training is more stable when normalizing the filter\
    \ response $x^{(k+1)}$ by the number of atoms within the cutoff range. Figure\
    \ 2 (right) shows selection of generated filters with PBCs, with a diamond crystal\
    \ unit cell and a hexagonal graphite. As for diamond and graphite are superpositions\
    \ of single-atom filters over their respective layers, they reflect the structure\
    \ of the lattice. Note that the single-atom filters are equivariant due to the\
    \ orientation, the periodic filters rotate equivariantly with the orientation\
    \ of the lattice, which still keeps this property rotational invariance. Although\
    \ we only incorporate basic invariances in the filters, careful design of the\
    \ filtering-generating network provides the possibility to incorporate further\
    \ chemical knowledge in the network.\n\n# 1. Rotational invariance\n\nIt is straightforward\
    \ to include rotational invariance by computing pairwise distances using of relative\
    \ positions. We expand the distance in a basis of Gaussians\n\n```\n$e_k(r_i,\
    \ r_j) = \\exp(-\\gamma(||r_i - r_j|| - \\mu_{ij})^2)$\n```\n\nwith cepts, centered\
    \ on a uniform grid from the neighbor and the distance cutoff. This has the effect\
    \ of decorrelating the filter values, which improves the conditioning of the optimization\
    \ problem. The number of Gaussians and the hyper parameter determine the resolution\
    \ of the filter. We set the grid spacing and scaling parameter to be 0.1 $1/\t\
    ext{\\AA}^2$ for all models in this work.\n\n# 2. Periodic boundary conditions\n\
    \nFor atomic with periodic boundary conditions (PBCs), each atom feature vector\
    \ $x_i$ is equivalent across all periodic positions, i.e., $x_i = x_{i+R}$. Due\
    \ to the linearity of the convolution, we therefore apply the PBCs to the filter\
    \ to accurately describe the atomic interactions while keeping the invariance\
    \ to the choice of the unit. Given a filter $W^{(l)}(r_{ij}-r_{ij})$ over we obtain\
    \ the convolution\n\n```\n$x_i^{(l+1)} = \\frac{1}{n_{neighbors}} \\sum_{j \\\
    in neighbors} x_j^{(l)} \\odot W^{(l)}(r_{ij}-r_{ij})$\\n\\n$x_i^{(l+1)} = \\\
    frac{1}{n_{neighbors}} \\sum_{j \\in neighbors} x_j^{(l)} \\odot (W^{(l)}(r_{ij}-r_{ij}))$,\n\
    ```\n\nThis filter $W$ now depends on the PBCs of the system as we sum over all\
    \ periods within the given cutoff\n\nFinally, a property $P$ of a molecule or\
    \ material is derived from the obtained atomic-wave representations. We use the\
    \ fully connected prediction network (see in Fig. 1). Depending on whether the\
    \ property is intensive or extensive, we calculate the final prediction $P$ by\
    \ summing or averaging over the atomic contributions, respectively.\n\nSince the\
    \ internal atom embeddings are equivariant to rotation of atoms, the filters are\
    \ independently applied to each atom and through continuous-filters convolution\
    \ over all neighboring atoms, indexing equivariance is retained in the atomic-representations.\
    \ Therefore, the prediction of properties as over-atom weights guarantees invariance.\n\
    \nWhen predicting atomic forces, we use a SchNet predicting the energy with respect\
    \ to the atomic positions\n\n```\n$\\hat{E}(Z_1, ..., Z_n, r_{ij1}, ..., r_{ijn})\
    \ = \\frac{\\partial \\hat{E}}{\\partial r_i}(Z_1, ..., Z_n, r_{ij1}, ..., r_{ijn})$\n\
    ```\n\nWhen using a rotationally invariant model, this ensures rotationally equivariant\
    \ force predictions and guarantees an energy conserving field.$^{21}$"
