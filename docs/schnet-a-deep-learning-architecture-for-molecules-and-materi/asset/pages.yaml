  md: '# F. Training


    We train SchNet for each property target P by minimizing the squared loss


    ```

    $$\ell(P, P) = ||P - P\|^2$$

    ```


    For the training of energies and forces of molecular trajectories, we use the


    ```

    $$\ell((E, F_1, ..., F_n), (\hat{E}, \hat{F}_n)) = \rho ||E - \hat{E}||^2 + \frac{1-\rho}{N_{atoms}}
    \sum ||F_i - \hat{F}_i||^2 \quad (5)$

    ```


    where rho is a trade off between energy and force loss. All models are trained
    with mini-batch stochastic descent using the ADAM optimizer with mini-batches
    of 32. We decay the learning rate exponentially with ratio of 0.996 every 100
    epochs. In each experiment, we split the data into a training set of given size
    N and use a validation set for early stopping. We determine the maximum number
    of atoms being located within a given cutoff cost of a training step scales linearly
    with the system size since we preprocess the indices of nearby atoms.


    ![](img/8414c867baf7c2cb6823215231b56027_4_0.png)


    # III. RESULTS


    # A. Learning molecular properties


    We train SchNet models to predict various properties of the QM dataset[33] of
    131 small molecules with up to nine atoms from CONF. Following Gilmer et al.[29]
    and Faber et al.[10] we use a validation set of 10000 molecules. We sum over atomic
    error for P_i for all properties


    We use T interaction blocks and atoms with 64 feature dimension to predict up
    to $10^4$ gradient descent parameters. Since we are small, we do not use a cutoff.
    For the Gaussian expansion, we use a range up to 2 Å to contain atoms. The prediction
    errors of errors are listed in Table I, where we compare the


    to the message-passing neural network-22 we use additional bond information from
    atomic positions to learn a molecular representation. SchNet predictions of the
    polarizability a and the electrostatic potential (R^2) fall noticeably off in
    terms of accuracy. This is because of the decomposition of energy into atomic
    combinations, which is not appropriate for these properties. For SchNet et al.[29]
    we employed a selected variant[56] that obtains a global representation and does
    not suffer this issue. SchNet reaches or overshoots in 2 out of 8 blocks, from
    a decomposition into atomic combinations that is not appropriate for properties.


    Figure 3 shows learning curves of SchNet for the total energy U_i with T $\in$
    {1, 2, 3} interaction blocks compared to the best performing DNN with T=3 interaction
    blocks. The best error blocks only show an improvement from 0.01 eV to 0.014 eV
    with 1100 training examples. After then the differences become more significant
    and T=6, while using higher parameters, the lower errors. In addition, the model
    requires less epochs to converge; using 1100 training examples reduces the required
    number of epochs from 2000 to less than 750 with T=6.


