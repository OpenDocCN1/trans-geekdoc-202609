    # IV. CONCLUSIONS


    Instead of painstakingly designing mechanical forces or machine learning descriptors,
    deep learning allows us to learn from first principles what adapts to the task
    and scale, and from hand, property prediction across chemical compound space to
    force the configurational space of single molecules. The design challenge has
    been shifted to modeling quantum neural architecture. This gives rise to the possibility
    to encode quantum constraints and symmetries within the model without losing locality
    of a neural network. It is crucial to be able to capture e.g., the full potential-energy
    surface, and in particular, its anharmonic behavior,


