    \ benzene, toluene, methane, pyrazine, and propane.\n\ntrained with $T=3$ interaction\
    \ blocks and $F=64$ feature maps using only energies as using the combined loss\
    \ for energies and forces from Eq. (5) with $p=0.1$. This trade-off constitutes\
    \ to operate a single model that performs on energies and forces for a fair comparison\
    \ with GDML. We do not use a distance cutoff due to the small molecules and a\
    \ range up to 20 $\text{\\AA}$ for the Gaussian expansion to cover all distances.\
    \ In Sec. III E, we will see that even lower errors are achieved when using two\
    \ SchNet models for energies and forces.\n\nSchNet shows significant advantage\
    \ of the additional force information, reducing energy and force errors by 1-2\
    \ orders of magnitude compared to energy only training on the small training set.\
    \ With 50,000 examples, the improvements are less apparent as the potential energy\
    \ surface is\n\nalready well-sampled at this. On the small training set, SchNet\
    \ outperforms GDML on the more flexible malonaldehyde and ethanol, while GDM reaches\
    \ lower errors on the MD trajectories that include all aromatic rings. A potential\
    \ reason is that GDML defines orders of atoms in the molecule, while the SchNet\
    \ architecture is invariant to indexing which constitutes a greater advantage\
    \ in the more flexible molecules.\n\nWhile GDML is more data-efficient than a\
    \ neural network, SchNet is scalable to larger datasets. It obtains MAEs of energies\
    \ and forces of 0.23 kcal/mol and 0.33 kcal/(mol/$\text{\\AA}$), respectively.\
