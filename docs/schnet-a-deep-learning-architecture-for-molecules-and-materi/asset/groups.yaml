    ## 附录 B：模拟细节


    $C_{20}$ 的参考数据是在 NVE 环境下，使用 500 K 温度、Nose-Hoover 热力器且时间步长为 1 fs 的经典分子动力学生成的。力和能量使用
    DFT 计算，采用了非经验交换相关泛函 (GGA) 水平的 PBE$^{39}$ 以及 Tkatchenko-Scheffler 方法 (TS$^{40}$)
    以考虑范德华相互作用。计算是使用 QE 中实现的全电子平面波基组完成的。


    量子性质通过费曼路径积分通过虚分子动力学 (PIMD) 引入。PIMD 模拟使用 C 语言实现的 SchNet 模型进行。积分步长设置为 5 fs，以确保在环量子近似
    (RQA)$^{41}$ 的 NVE 系综内能量守恒。在 PIMD 中，原子核的处理由颗粒的数量控制。在我们 $C_{20}$ 的示例中，我们看到使用八个颗粒可以得到收敛的径向分布函数
    $g(r)$，如图 11 所示。


