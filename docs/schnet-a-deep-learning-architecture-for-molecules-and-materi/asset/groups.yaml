    # SchNet – 一用于分子和材料的深度学习架构


    K. T. Schütt,1 H. E. Sauceda,2 P.-J. Kindermans,1 A. Tkatchenko,3,4 and K.-R.
    Müller,1,4,5**

    1柏林工业大学机器学习小组, 10623 Berlin, Germany

    2马克斯·普朗克学会弗里德里希·胡贝尔研究所, 14195 Berlin, Germany

    3卢森堡大学物理与材料研究所, L-1511 Luxembourg, Luxembourg

    4马克斯·普朗克计算机学院

    5韩国大学脑认知工程系, Anam-dong, Seongbuk-gu, Seoul 136-733, South Korea


    (收于2017年12月16日；2018年3月8日；发表于2018年3月29日)


    深度学习已人工智能、网络、文本和图像搜索、语音识别以及生物信息学引发了范式转移，并在化学物理领域的影响日益增长。广而言，机器学习和深度学习非常适合表示量子力学相互作用、建模非线性势能面或增强化学化合物空间的探索。在这里，我们介绍了深度学习架构
    SchNet，它专门设计用于通过连续滤波器卷积层对原子系统进行建模。我们通过准确预测跨越化学空间的分子和材料的化学性质，展示了 SchNet 的能力，其中我们的模型学习了跨越周期表中原子类型的合理嵌入。最后，我们利用
    SchNet 预测小分子动力学模拟的势能面和能量守恒场，并对初始原子结构的 C20 富勒烯的量子力学性质进行了示例性研究。由 AIP 出版：https://doi.org/10/


    # I 引言


    加速发现具有所需性能的材料是计算化学和材料科学中长期面临的挑战。在探索海量化学空间时，精确量子化学计算的成本被证明是难以企及的。近年来，人们不断努力使用机器学习来克服这一瓶颈，除非一组简化的描述符允许我们准确地预测化学性质1–15或势能面16–25。虽然这些方法使用了费力手工构建的描述符，但深度学习已经能够利用图神经网络从分子结构预测性质。27。然而，由于缺乏平衡态下的原子位置，这些方法仅限于电子结构。最近，开发了从原子类型和位置中学习取向的模型。28–30。虽然神经网络通常被认为是“黑箱”，但最近人们投入了更多努力来解释其预测结果，以理解其运行机制。这可以通过训练模型31或直接设计具有可解释性的模型来实现。对于量子化学，我们中的一些人已经提出了这种基于深度张量神经网络（DNNs）的架构，不仅能够学习原子环境的表示，还能从空间和化学相关的角度为量子力学嵌入提供见解。28


    在这里，我们基于这项工作，介绍了深度学习架构 SchNet，它允许通过对复杂的相互作用进行建模，以预测势能面或加速化学空间的探索。在 DNNs 中，SchNet
    还能通过构造表示遵循原子系统基本对称性（构造不变性、旋转和平移不变性以及原子索引的不不变性）的分子和材料。这些方法在没有进一步约束的情况下预测完整的构型，并且势能面使用连续滤波器（卷积层）39
    进行建模，通过专门设计的滤波器神经网络变得更具解释性。我们证明了所有这些方法都允许我们引入周期性边界条件（PBCs），从而实现对多种体相晶体力和和能量的准确预测。SchNet
    和 DNNs 都提供了局部化学势，并提供了新的表示见解。28。对所得表示的分析表明，SchNet 学习了化学合理的原子类型嵌入，捕捉了周期表的结构。最后，我们使用由
    SchNet 在化学经典数据上训练的能量守恒场，进行路径积分动力学（PIMD）模拟。


    4 schutt@tu-ber.de

    5 alexander.tkatchenko@mueller.de

    6 klaus-muller@tu-ber.de


    J. Chem. Phys. 148, 241722 (2018)241722 Schütt 等人。


    ## B. 原子级层


    原子级层是分别应用于每个原子表示 $x_i$ 的稠密层


    由于 $W$ 和偏置 $b$ 在原子之间共享，我们的架构对于原子数量保持可扩展性。虽然原子通过网络表示，但它们变换并处理有关……的信息


    ## C. 相互作用层


    SchNet 的相互作用层根据与周围原子的两对相互作用精炼原子表示。在这里，我们使用连续滤波器层（连续操作的推广，例如高斯函数或径向基函数）对此进行建模。这是必要的，因为原子并不位于规则网格上，而是可以位于任意位置。因此，像卷积层那样使用滤波器张量是不可行的。我们需要逐逐地建模滤波器


    ## A. 原子级嵌入


    原子系统可以由一组 $n$ 个原子描述，其电荷 $Z = (Z_1, \dots, Z_n)$ 和位置 $R = (r_1, \dots, r_n)$。SchNet
    的层由特征图元组 $X^l = (x_1^l, \dots, x_n^l)$ 描述，其中 $x_i^l$ 的特征图数量为 $F$


    带有原子级层的滤波器层构建了相互作用块的残差映射（见图 i）。我们在整个网络中使用偏移的 softplus 函数 $softplus(x - 0.5) +
    0.5$ 作为激活函数。偏移确保了 $softplus(0)=0$ 和网络的收敛，同时具有无限阶的连接性。这使我们能够平滑势能面、力以及用于力训练所需的二阶导数以及振动模式。


