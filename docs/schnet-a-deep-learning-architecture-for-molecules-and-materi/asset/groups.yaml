    ## A. Atom-wise embeddings


    An atomic system can be described by a set of $n$ atoms with charges $Z = (Z_1,
    \dots, Z_n)$ and positions $R = (r_1, \dots, r_n)$. The layers of SchNet, are
    described by a tuple of feature maps $X^l = (x_1^l, \dots, x_n^l)$, with $x_i^l$
