    这种权衡是为了运行一个在能量和力上均表现良好的模型，以便与 GDML 进行公平比较。由于分子较小，我们没有使用距离截断，且高斯展开的范围高达 20 $\text{\AA}$
    以覆盖所有距离。在节 III E 中，我们将看到当使用两个 SchNet 模型分别处理能量和力时可以获得更低的误差。


    SchNet 显示了额外力信息的显著优势，与在小训练集上仅进行能量训练相比，其能量和力的误差降低了 1-2 个数量级。在 50,000 个样本的情况下，由于势能面在该规模下已经得到了很好的采样，改进变得不再明显。在小训练集上，SchNet
    在柔活性更高的丙酮醛和乙醇上表现优于 GDML，而 GDML 在包含所有芳香环的 MD 轨迹上达到了更低的误差。一个可能的原因是 GDML 定义了分子中原子的顺序，而
    SchNet 架构对索引是不不变的，这在柔活性更高的分子中构成了更大的优势。


    虽然 GDML 的数据效率比神经网络高，但 SchNet 可以扩展到更大的数据集。它获得的能量和力的平均绝对误差 (Es) 分别为 0.23 kcal/mol
    和 0.33 kcal/(mol$\text{\AA}$)。值得注意的是，SchNet 使用超过 1000 次参考计算的能量和力组合损失进行训练的效果优于对
    50,000 个样本的能量进行训练。


    E. 在 C$_{20}$-呋喃醚分子动力学中的应用


    在基准集上展示了 SchNet 后，我们使用 ML 驱动的 C$_{20}$-呋喃醚 MD 模拟进行了方法选择。这种中等分子具有复杂的势场，需要用正模式和自由度来描述。在这里，我们使用
