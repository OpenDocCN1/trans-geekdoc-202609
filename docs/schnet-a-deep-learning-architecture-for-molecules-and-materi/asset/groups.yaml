    \ cutoff range. Figure 2 (right) shows selection of generated filters with PBCs,\
    \ with a diamond crystal unit cell and a hexagonal graphite. As for diamond and\
    \ graphite are superpositions of single-atom filters over their respective layers,\
    \ they reflect the structure of the lattice. Note that the single-atom filters\
    \ are equivariant due to the orientation, the periodic filters rotate equivariantly\
    \ with the orientation of the lattice, which still keeps this property rotational\
    \ invariance. Although we only incorporate basic invariances in the filters, careful\
    \ design of the filtering-generating network provides the possibility to incorporate\
    \ further chemical knowledge in the network.\n\n# 1. Rotational invariance\n\n\
    It is straightforward to include rotational invariance by computing pairwise distances\
    \ using of relative positions. We expand the distance in a basis of Gaussians\n\
    \n```\n$e_k(r_i, r_j) = \\exp(-\\gamma(||r_i - r_j|| - \\mu_{ij})^2)$\n```\n\n\
    with cepts, centered on a uniform grid from the neighbor and the distance cutoff.\
    \ This has the effect of decorrelating the filter values, which improves the conditioning\
    \ of the optimization problem. The number of Gaussians and the hyper parameter\
    \ determine the resolution of the filter. We set the grid spacing and scaling\
    \ parameter to be 0.1 $1/\text{\\AA}^2$ for all models in this work.\n\n# 2. Periodic\
    \ boundary conditions\n\nFor atomic with periodic boundary conditions (PBCs),\
    \ each atom feature vector $x_i$ is equivalent across all periodic positions,\
    \ i.e., $x_i = x_{i+R}$. Due to the linearity of the convolution, we therefore\
    \ apply the PBCs to the filter to accurately describe the atomic interactions\
