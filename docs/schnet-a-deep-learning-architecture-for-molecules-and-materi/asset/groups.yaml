    ## APPENDIX B: SIMULATION DETAILS


    The reference data for $C_{20}$ were generated using classical molecular dynamics
    in the NVE environment at 500 K using the Nose-Hoover thermostat with a time step
    of 1 fs. The forces and energies were computed using DFT with the non-empirical
    exchange-correlation functional (GGA) level of theory of PBE$^{39}$ and the Tkatchenko-Scheffler
    method (TS$^{40}$) to account for van der Waals interactions. The calculations
    were done using all-electrons with a plane wave basis set implemented in QE.


    The quantum nature is introduced through imaginary molecular dynamics (PIMD) via
    Feynman''s path integral. The PIMD simulations were done using the SchNet model
    implemented in C. Integration time step was set to 5 fs to ensure energy conservation
    within the NVE ensemble with a ring quantum approximation (RQA)$^{41}$. In PIMD,
    the treatment of nuclei is controlled by the number of beads. In our example for
    $C_{20}$, we see that using eight beads gives a converged radial distribution
    function $g(r)$ as shown in Fig. 11.


