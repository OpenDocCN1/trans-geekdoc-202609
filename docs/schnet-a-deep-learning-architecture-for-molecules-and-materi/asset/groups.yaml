    \ 3 显示了 SchNet 在 $T \\in \\{1, 2, 3\\}$ 个相互作用块下对总能量 $U_i$ 的学习曲线，与具有 $T=3$ 个相互作用块的性能最好的\
    \ DNN 相比。使用 1100 个训练示例，最佳误差仅从 0.01 eV 改进到 0.014 eV，所需的 epoch 数量从 2000 减少到少于 750。\n\
