    ## E. Application to molecular dynamics of C$_{20}$-furanide


    After demonstrating our SchNet on the benchmark set, we performed a method selection
    using ML-driven MD simulation of C$_{20}$-furanide. This mid-sized molecule has
    a complex potential field that requires to be described with normal modes and
    degrees of freedom. Here we use SchNet to perform analysis of basic properties
    of C$_{20}$ when including quantum effects. The reference data generated by running
    molecular MD at 300 K in the generalized gradient approximation (GGA) level of
    theory used the Perdew-Burke$^{39}$ exchange-correlation functional and Zhang-Schffler$^{40}$
    method. Further details about the simulations can be found in Appendix B.


    By training SchNet on DFT at the PBE+vdW levels, we reduced the simulation time
    by orders of magnitude from 11 hours using 32 cores to 10 ms using NVIDIA GTX1080.
    This allows us to perform long simulations with DFT accuracy at low cost, which
    is making this feasible.


