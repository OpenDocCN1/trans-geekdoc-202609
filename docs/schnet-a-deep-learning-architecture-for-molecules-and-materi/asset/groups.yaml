    相互作用的量子行为，以改进分子和材料。


    源自块体晶体和形成能的数据集。最重要的是，我们在 PBE+dW 理论水平下对富勒烯 C60 执行了经验分子动力学研究，这在常见的 DFT 方法中是无法兼容的。随后的结果指导了未来的工作，例如更大的分子和周期性系统，以及向深度学习架构的进一步开发以辅助化学研究。


    ## IV. 结论


    深度学习不需要费力地设计机械力或机器学习描述符，它让我们能够从第一性原理学习适应任务和规模的内容，并实现从跨化学化合物空间的属性预测到单个分子力空间预测的手处理。设计挑战已转向量子神经架构的建模。这使得在不丢失神经网络局部性的情况下，在模型中编码量子约束和对称性成为可能。能够捕捉完整的势能面，特别是其非谐行为是至关重要的。


    ## 致谢


    这项工作得到了德国联邦教育与研究部 (BMBF) 为柏林大数据中心 (BIDC) 的支持（编号 01510134）。此外，还来自 DG（编号 MU 98/2021）、欧盟
    2020 年研究计划或 Sklodowska-Curie 资助协议编号 65769、韩国研究基金会资助的 BKI 项目（编号 2014-05741）以及韩国政府资助的信息与通信促进协会
    (ITEP)的支持（编号 2017-0-00451）。AT 感谢来自欧洲研究委员会 (ERC-CoG 资助)的支持。


    我们介绍了深度学习模型 SchNet，它已应用于各种领域，从不同分子和材料数据集的化学性质预测，到势能面和能量守恒力的高精度预测。作为深度神经网络的变体，SchNet
    在设计上遵循旋转、平移和排列不变性，并能够模拟周期性边界条件。SchNet 不仅产生快速且准确的预测，还允许我们使用局部化学势来学习学习表示。我们发现基础化学知识得到了恢复。


