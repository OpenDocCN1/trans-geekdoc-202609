- pgno: 142
  md: '4. When you are changing to a different data center for a disaster recovery
    scenario, which of the following could pose a challenge to the authentication
    systems over a geographic distance?


    +   A. Regulations

    B. Latency

    C. Redundancy

    D. Interoperability


    +   B. Authentication systems, as a security check, enforce limited time requirements
    for authentication tokens and any checks to be performed and validated. If it
    takes longer than the allowed time, the request will be considered stale and invalid,
    and it will likely loop back to try the process again. If a large geographic distance
    exists and network latency occurs, it is possible on some systems, if they have
    short validity periods, for authentications to fail and for system access to be
    denied.


    +   A is incorrect because regulations are always a concern, especially over a
    large geographic distance, where some variances are almost guaranteed. However,
    this is not the best answer because it is not specific to authentication systems
    and their operational usage.


    +   C is incorrect because redundancy is not something that will be impacted by
    geographic distance between data centers. Systems can have redundancy implemented
    in a variety of ways, regardless of where they are actually hosted or the distance
    between them.


    +   D is incorrect because interoperability will be a global issue across the
    entire enterprise, not one specifically impacting authentication systems. With
    most modern authentication systems, interoperability is also not a primary concern
    because these systems are specifically designed to be multiplatform and flexible.


