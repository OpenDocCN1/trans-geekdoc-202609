    +   - A. Read

    - B. Copy

    - C. Delete

    - D. Write'
  merge: -1
  img_proc: true
- pgno: 239
  md: '+   B. Information rights management (IRM) technologies extend the security
    controls available to protect data beyond those offered by the operating systems.
    The ability to control the copying of a file is one of those controls. With standard
    operating system controls, if a user can read a file, they can also copy the file,
    which is something that IRM can control.


    +   A, C, and D are incorrect. Read, delete, and write are all operations that
    can be controlled by operating system permissions and security controls.


