- pgno: 12
  md: '# INTRODUCTION


    Starting a few years ago, the term cloud took its place within the modern lexicon
    and became commonly used in everyday dialogue, even by lay persons with no connection
    to, training for, or expertise in the IT industry. It has become common in commercials
    targeting the public at large, and is often used as a main selling point for services
    and offerings. Those who do not understand what cloud computing is, let alone
    how it works, have largely come to understand it as a positive feature, feeling
    that it means higher reliability, faster speed, and overall more beneficial consumer
    experience. Also, many companies are flocking to the benefits and features of
    cloud computing at a rapid pace.


    With this enormous paradigm shift in the industry, the need for skilled professionals
    who understand cloud computing has grown at a similarly rapid pace. This demand
    applies to professionals in all facets of computing, but the unique aspects and
    features of cloud computing make the need for skilled security personnel paramount
    to any organization in order to properly safeguard and protect their systems,
    and data.


    Cloud computing represents a new dynamic in IT experts—and IT security experts—look
    at protecting data and the various techniques and methodologies available to them.
    Some of you here will be experienced security professionals and already hold other
    certifications such as the CISSP. For others, this certification may be your first
    as a security professional. Some of you have been working with cloud computing
    from its onset, while others will be learning the cloud bases for the first time.
    This volume of practice exams is designed to complement the CCSP Certified Cloud
    Security Professional All-in-One Exam Guide and aims to aid anyone approaching
    this challenging exam, regardless of background or specific experience in security
    or general computing.


    These practice exams, along with the CCSP Certified Cloud Security Professional
    All-in-One Exam Guide, will give you the information you need to pass the CCSP
    exam, as well as hopefully expand your understanding and knowledge beyond just
    being able to answer exam questions. My hope is that you find some joy in the
    practice exam as desktop references for the core concepts and approaches to cloud
    computing and cloud security.


    The structure of the All-in-One Exam Guide is closely aligned with the subjects
    of the official exam guide from (ISC)² and the practice exams are designed in
    the same manner.


    Regardless of your background, experience, and other certifications, I hope you
    find the world of cloud computing and its unique demands to be enlightening, challenging,
    and intellectually stimulating. Cloud represents a very dynamic and exciting new
    direction in computing, and one that seems likely to be a major paradigm for the
    foreseeable future.


    # Why Get Certified?


    Obtaining an industry standard certification that is widely respected and recognized
    will serve the career of any IT professional. With cloud computing growing rapidly
    and more organizations claiming to leverage its potential, the CCSP will serve
    as an independent verification of'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'your skills and understanding of these concepts to any employer or regulatory
    agency. The CCSP can benefit anyone working in IT security at any level, from
    starting security analysts up to an organization''s chief information security
    officer (CISO). Although the CCSP will in many cases complement security certifications,
    such as the CISSP it can also serve as a first or standard-certification as well.


    # # How to Get Certified


    The following steps and requirements for the CCSP were valid at the time of writing,
    but as with anything in the IT industry and its rapidly changing landscape, you
    should always verify directly with (ISC)² to the most current requirements. The
    website for the CCSP can be found at https://www.isc2.org/ccsp.


    The following are the requirements to obtain the CCSP certification:


    +   * Experience A candidate must have five years of full-time IT experience.
    Within these five years, you must have three years minimum experience in IT security,
    and at least one year minimum in least one of the CCSP domains. If a candidate
    has the CCSK certificate from the CSA, and the CISSP from (ISC)² can be used solely
    to fulfill the entire experience requirement for the CCSP.

    * Exam The candidate must register for and pass the CCSP certification exam. Information
    about registration and the fees required can be found on the CCSP website listed
    earlier. The exam is four hours in duration, with 125 questions. A candidate must
    successfully pass the exam with a scaled score of 700 out of 1000 points.

    * Endorsement Upon meeting the experience requirements and successfully passing
    the exam, a candidate must have their application endorsed by a current (ISC)²
    certification holder. This endorsement must be done by someone who knows the candidate
    and can attest to the validity of their experience and professional credentials.

    * Maintenance After being awarded the CCSP, a certification holder must complete
    continuing professional education (CPE) requirements and pay annual maintenance
    fees (AMFs). Refer to the official (ISC)² site for current information about both
    requirements.


    # # CCSP Domains


    While it is assumed that you have studied and prepared for this exam using a resource
    such as the CCSP Certified Cloud Security Professional All-in-One Guide, the following
    is a brief introduction to each domain covered by the CCSP exam (it can also serve
    as a refresher).


    # # Domain I: Architectural Concepts and Design Requirements


    The Architectural Concepts and Design Requirements domain lays the foundation
    for a strong understanding of the basics of cloud computing. These building blocks
    and foundations are based on the ISO/IEC 17788 standard. The domain defines the
    different and crucial roles that individuals and other entities will play within
    a cloud implementation, from the perspective of'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'the cloud service provider and the cloud customer. It outlines the key characteristics
    of cloud computing, including on-demand self-service, broad network access, multitenancy,
    rapid elasticity and scalability, resource pooling, and measured service. It also
    introduces the key blocks for a cloud environment, such as virtualization, storage,
    networks, and the underlying infrastructures that host and control them.


    # Domain 2: Cloud Data Security


    The Cloud Data Security domain delves into design, principles, and best practices
    for systems and applications to protect data, taking into account all types of
    systems, services, virtual machines, networks, and storage technologies within
    the hosting environment. Domain 2 outlines the cloud data lifecycle, which shows
    how data flows from its creation through its disposal, and how it is handled through
    various uses and activities while it remains within a system or application.


    # Domain 3: Cloud Platform and Infrastructure Security


    A cloud environment consists of both physical and virtual infrastructure, and
    both carry with them unique security concerns and requirements. Whereas cloud
    systems are built on virtualization and components, underneath virtualization
    layers are physical hardware and security requirements, the same as a traditional
    data center. This includes access to physical systems, such as the BIOS and hardware
    layers, as well as the software that hosts and maintains the virtualized environments
    on top of them. Any breach of security or controls on the physical layer could
    put all virtual hosts managed within it at risk. Security controls within a cloud
    environment apply to the standard set of resources: network and communications,
    storage, and computing. However, the use of virtualization also requires the the
    consideration of security in regard to the management plane that is used to control
    and manage the virtual machines. Domain 3 delves into the cloud-specific risks,
    the risks associated with virtualization, and the specific count-measure strategies
    that can be employed to offset them.


    # Domain 4: Cloud Application Security


    Using cloud environments and cloud technologies is quickly gaining in popularity
    for both their cost and flexibility. Cloud environments offer incredible efficiencies
    and ease with quick bringing-environments and virtual machines online for developers,
    and costs are incurred only while they are live and operating; the lead time and
    costs associated with procuring environments or testers in a traditional data
    center are largely mitigated in a cloud environment. In order for optimal cloud
    development to be leveraged, especially with security in mind, the Cloud Security
    Professional and the developers will need a solid understanding of the realities
    of cloud environments, what is required to secure them, as well as the common
    threats and vulnerabilities facing the cloud.


    # Domain 5: Operations


    The Operations domain outlines the planning for data centers, including both the
    physical and logical layers and technologies employed. This also incorporates
    environmental concerns and needs are addressed with physical requirements, including
    reliable and redundant access to cooling and electrical resources, as well as
    adequate protection from natural disasters and environmental issues.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Domain 6: Legal and Compliance


    Domain 6 is focused on the legal and regulatory compliance requirements for IT
    systems, including how they are specifically related to cloud computing and its
    many unique facets. Cloud computing presents many distinct risks and challenges
    because it spans different regulatory or national borders, and as such is subjected
    to many different requirements, which sometimes are in conflict with each other.
    The domain covers legally mandated controls from the perspective of multiple jurisdictions,
    as well as legal risks specific to cloud computing. The particular definitions
    and legal requirements for personal information and privacy as they relate to
    jurisdictional controls are included, as well as the differences between contractual
    and regulated personal data protections.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Architectural Concepts and Design Requirements Domain


    Domain 1 is focused on the following topics:


    +   - Cloud computing players and terms

    - Cloud computing essential characteristics

    - Cloud service categories

    - Cloud deployment models

    - Security concepts relevant to cloud computing

    - Certifications

    - Cloud cost-benefit analysis

    - Cloud architecture models


    Domain 1, which covers architectural concepts and design requirements, forms the
    basis for cloud computing technologies and defines their key components and characteristics.
    Cloud computing is a model for enabling ubiquitous, convenient, on-demand network
    access to a shared pool of configurable computer resources (e.g., networks, servers,
    storage, applications, and services) that can be rapidly provisioned and released
    with minimal management effort or service provider interaction. This cloud model
    is composed of five essential characteristics, three service models, and four
    deployment models.


    Differing from the classic data center model of server hardware, network applications,
    cabling, power units and environmental controls, cloud computing is predicated
    on the concept of purchasing "services" to comprise various levels of automation
    and support based on the needs of the customer at any various point in time. Compare
    that to the classical data center model, which requires a customer to have purchased
    and configured systems to their maximum capacity at all times, regardless of the
    need due to business cycles and changing demands.'
  merge: -1
  img_proc: true
