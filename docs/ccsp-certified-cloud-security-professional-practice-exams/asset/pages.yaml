- pgno: 68
  md: '# Comprehensive Answers and Explanations


    +   1. Which of the following pieces of data about an individual would be considered
    a direct identifier?


    +   A. Job title


    +   B. Educational history


    +   C. Income


    +   D. Phone number


    +   D. A phone number is considered a direct identifier because it is unique to
    a residence or individual. With a phone number as a sole piece of information,
    a specific individual can be readily and quickly identified, meeting the precise
    definition of a direct identifier.


    +   A is incorrect because a job title is not specific enough to identify an individual
    in almost all circumstances. With most job titles, unless attached to a specific
    organization, the description could easily apply to a large number of individuals
    and therefore cannot be tied to a specific person.


    +   B is incorrect because educational history, including schools attended and
    degrees conferred, would not specific enough to tie to an individual and would
    apply to a large number of possible people. Therefore, it would not be considered
    a direct identifier.


    +   C is incorrect because income would be a seemingly arbitrary number that could
    apply to a very large number of jobs and individuals and therefore, by itself,
    would not be a direct identifier to a specific individual.


    +   2. When DLP is used to protect data in use, where would the DLP solution and
    software be deployed?


    +   A. On the client


    +   B. On the application server


    +   C. Network perimeter


    +   D. Data layer


    +   A. For a DLP solution to work for data in use, it would need to be installed
    on the actual client where the processing was taking place. This could be anything
    from a mobile device to a desktop computer, laptop, or software client. By being
    installed at the client level, the DLP solution would be able to closely watch
    how the data is being used and to apply policies appropriately.


    +   B is incorrect because the application server is under control of the organization
    and the data owner. When on a client, a user has a broad range of things they
    can do with the data, but an application server will be limited to what it is
    programmed to do and is controlled by the application owner.


    Chapter 2: Cloud Data Security Domain

    53'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'C is incorrect because installing DLP at the network perimeter would be for
    controlling and monitoring data in transit, not data in use, as there is no processing
    or use of the data at the network perimeter level.


    D is incorrect because the data layer is where data at rest would be applicable,
    not where the data is being actually used or consumed as it would be on a client.


    # 3. Which cloud storage uses an opaque value or descriptor to categorize and
    organize data?


    +   A. Volume


    +   B. Object


    +   C. Structured


    +   D. Unstructured


    B. Object storage works by utilizing a flat file system, where each item is housed
    with an opaque handler or descriptor. When files are accessed, the object storage
    is called with the descriptor or opaque value and then presented to the application
    or client.


    A is incorrect because volume storage provides a logical storage container to
    the virtual machine, where it is utilized much as a traditional file system, with
    directory structures and file-naming conventions chosen by the application developers
    or administrators, rather than the use of an opaque value.


    C is incorrect because structured storage, used with PaaS enables database storage,
    where items are categorized in a logical and consistent manner.


    D is incorrect because unstructured storage is used with PaaS and is employed
    to store files and objects that do not fit within the structured storage type—typically,
    support files or web files such as images, style sheets, and so on.


    # 4. Which content analysis is the least efficient and slowest of the available
    data discovery methods, which of the following aspects of the data make discovery
    the most challenging?


    +   A. Size


    +   B. Throughput


    +   C. Quality


    +   D. Source


    C. With any content analysis, the quality of the data poses the biggest challenge
    to data discovery. Content can be freeform and may come in a variety of formats,
    with little to no consistency. Variations in spelling and word use can also make
    content analysis very challenging because there is no standardization to build
    discovery rules against.


    A is incorrect because the size of the data by itself does not pose any direct
    challenges to data discovery. Although large data sets will require more time
    or processing to evaluate, the size does not correlate necessarily to the quality
    problems that pose a significant challenge.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'B is incorrect because throughput may impact performance and processing time
    does not pose the type of challenge in the evaluation of content that quality
    does.


    D is incorrect because the source of the data has no direct bearing on the quality
    of data or the ability to evaluate it.


    +   5. Which of the following actions do NOT fall under the "create" phase of
    the cloud data lifecycle?


    +   A. Newly created data


    +   B. Data that is imported


    +   C. Data that is archived


    +   D. Data that is modified


