- pgno: 254
  md: '# About the CD-ROM


    The CD-ROM included with this book comes complete with Total Tester customizable
    exam software with 250 practice exam questions, and a secured PDF copy of the
    book.


    > NOTE If you do not have a CD-ROM drive, you may download the Total Tester by
    simply going to this URL:

    www.totalsem.com/126003165d/

    Also, to access the secured book PDF, visit McGraw-Hill Professional''s Media
    Center by going to this URL:

    https://www.mhprofessionalresources.com/mediacenter/

    Enter your e-mail address and this 13-digit ISBN: 978-1-260-03136-2.

    You will then receive an e-mail message with a download link for the book PDF.


    # System Requirements


    The software requires Windows Vista or later and 30MB of hard disk space for full
    installation, in addition to a current or prior major version of Chrome, Firefox,
    Internet Explorer, or Safari. To run, the screen resolution must be set to 1024x768
    or higher. The secured book PDF requires Adobe Acrobat, Adobe Reader, or Adobe
    Digital Editions to view.


    # Total Tester Premium Practice Exam Software


    Total Tester provides you with a simulation of the CCSP exam. Exams can be taken
    in Practice Mode, Exam Mode, or Custom Mode. Practice Mode provides an assistance
    window with references to the book, explanations of the correct and incorrect
    answers, and the option to check your answer as you take the test. Exam Mode provides
    a simulation of the actual exam. The number of questions, types of questions,
    and time allowed are intended to be an accurate representation of the exam environment.
    Custom Mode allows you to create exams from selected domains or chapters, and
    you can further customize the number of questions and time allowed.

    To take a test, launch the program and select CCSP from the Installed Question
    Packs list. You can then select Practice Mode, Exam Mode, or Custom Mode. All
    exams provide an overall grade and a grade broken down by domain.'
  merge: -1
  img_proc: true
- pgno: 255
