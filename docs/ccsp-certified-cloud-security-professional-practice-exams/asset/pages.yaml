    goal and purposes of auto-scaling.


    +   B is incorrect because penetration testing would not be done immediately upon
    new systems being enabled via auto-scaling. Certainly penetration testing against
    the image before it is created and finalized for use with auto-scaling is desirable,
    but the correct time is not immediately after a system is enabled.


    +   C is incorrect because performing baseline applications after a new virtual
    machine is enabled would negate the benefits and speed of auto-scaling, and with
    the use of an image for all new systems, it would create redundant work versus
    a baseline application before the image is finalized.


