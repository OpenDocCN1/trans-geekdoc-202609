- pgno: 178
  md: '10. Which process is used to properly maintain balanced resources across a
    cloud environment and to respond to changing needs from conditions due to auto-scaling?


    +   A. DCOM


    +   B. Distributed optimization


    +   C. Dynamic optimization


    +   D. Elasticity


    +   C. Dynamic optimization is the process through which the cloud environment
    is constantly maintained to ensure that resources are available when needed and
    that physical nodes do not become overloaded or near capacity while others are
    underutilized.


    +   A is incorrect because DCOM refers to the Distributed Component Object Model,
    which is a set of Microsoft interfaces and services that can be requested by systems
    throughout a network.


    +   B is incorrect because distributed optimization is a distractor term that
    sounds similar to the correct answer.


    +   D is incorrect because elasticity refers to the ability of a cloud environment
    to resize resources to meet current demand, either through increasing or decreasing
    them; dynamic optimization is the more correct answer in this case because it
    refers to analysis and determination, not just the ability to adjust resource
    levels.


    11. Which TLS protocol handles the secure communications between parties, specifically
    the send/receive operations?


    +   A. Handshake


    +   B. Transmission


    +   C. Negotiation


    +   D. Record


    +   D. The TLS record protocol handles the actual transmission of secure information
    over the encrypted channel. It only handles the sending and receiving of secure
    data and relies on the handshake protocol for all information to handle the transmission.


    +   A is incorrect because the handshake protocol of TLS negotiates and establishes
