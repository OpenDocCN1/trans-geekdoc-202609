  md: '37. Which type of cloud deployment requires the least amount of involvement
    from the cloud provider to make logs available to the cloud customer?


    +   A. PaaS


    +   B. IaaS


    +   C. SaaS


    +   D. DaaS


    +   B. Within Infrastructure as a Service (IaaS), the cloud customer is responsible
    for managing its own systems and virtual appliances. Therefore, with full administrative
    access, the customer by default have access to all event data and logs from its
    systems. The only involvement necessary from the cloud provider would be when
    logs from an infrastructure level, outside the control of the cloud customer,
    are required.


    +   A is incorrect because Platform as a Service (PaaS) is maintained by the application
    down by the cloud provider, and typically without the cloud customer having any
    type of administrative access. With PaaS, the event data often needs to be exposed
    by the cloud provider in order for the cloud customer to access it.


    +   C is incorrect because Software as a Service (SaaS) is completely closed and
    the application entirely maintained by the cloud provider. Any access to event
    or log data will need to be facilitated by the cloud provider.


    +   D is incorrect because Desktop as a Service (DaaS) is completely closed and
    the application entirely maintained by the cloud provider. Any access to event
    or log data will need to be facilitated by the cloud provider.


