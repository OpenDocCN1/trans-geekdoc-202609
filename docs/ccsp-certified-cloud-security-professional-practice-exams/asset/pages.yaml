- pgno: 233
  md: '# Comprehensive Answers and Explanations


    1. Which cloud service category is most associated with auto-scaling offerings
    for a cloud customer?


    +   A. IaaS


    +   B. PaaS


    +   C. SaaS


    +   D. DaS


    B. Platform as a Service (PaaS) is most associated with auto-scaling, as PaaS
    offers a fully configured and deployable hosting environment, where the cloud
    customer''s application code and data are the additional components needed to
    make everything functional. It allows for programmatic and automatic expansion
    of an environment to meet current need with minimal additional configuration required
    from the cloud customer, as opposed to IaaS.


    A, C, and D are incorrect. Although Infrastructure as a Service (IaaS) allows
    for auto-scaling as well, PaaS entails the least overhead for the cloud customer
    and enjoys the greatest ease of automatic expansion. Software as a Service (SaaS)
    and Desktop as a Service (DaaS) are environments maintained by the cloud provider,
    and although they offer auto-scaling in many instances, they are not applications
    deployed specific to the cloud customer.


    2. Which of the following is NOT considered one of the core building-block technologies
    of cloud computing and services offered by cloud providers?


    +   A. CPU


    +   B. Memory


    +   C. Operating systems


    +   D. Storage


    Operating systems are not one of the key components of the cloud computing resources
    and services offered by a cloud provider. Depending on the cloud service category,
    operating systems may not even be a factor at all, such as with IaaS, where they
    are the sole responsibility of the cloud customer, and they are certainly not
    a universal factor across all cloud service categories.


    A, B, and D are incorrect. CPU, memory, and storage are key building blocks of
    cloud computing that are universal across all cloud service categories. They form
    the basis for measured services and resource pooling.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '3. If an organization desires to utilize multiple cloud providers for the purposes
    of redundancy and disaster recovery strategies, which cloud deployment model would
    be the most appropriate?


    +   A. Hybrid


    +   B. Private


    +   C. Public


    +   D. Community


    +   A. A hybrid cloud solution utilizes multiple different cloud deployment models
    to meet an organization’s needs. It allows an organization to use different providers
    and types of services, but in a way where the systems are compatible and interchangeable.


    +   B, C, and D are incorrect. Public, private, and community cloud deployment
    models are single systems that do not enjoy the diversity of a hybrid cloud across
    multiple providers or deployment models.


    4. Which of the following strategies to ensure data deletion and unrecoverability
    is most likely to be available within a cloud environment?


    +   A. Degussing


    +   B. Cryptographic erasure


    +   C. Overwriting


    +   D. Shredding


    +   B. Cryptographic erasure involves the purposeful destruction of encryption
    keys that were used to protect data. The keys keys ensures that the encryption
    cannot be undone or recovered, or at least not any time frame that would be useful
    or practical. Because this process is entirely software based, it would be available
    in any cloud environment.


    +   A, C, and D are incorrect. Degauss and shredding are physically destructive
    methods used against storage media, which due to resource pooling and multitenancy,
    almost certainly never be available in a cloud environment. In the case of a private
    cloud, they would be highly unlikely because multiple systems and applications
    share the same physical storage. Overwriting, although software based, would be
    very difficult to ensure in a cloud environment data is constantly moving between
    different systems, and ensuring that all locations are known, or even to be overwritten,
    is virtually impossible.


    5. Which key aspect of cloud computing allows the cloud customer to administer
    their configurations or provisioned services without the need to interact or be
    involved with the cloud provider and its staff?


    +   A. Resource pooling


    +   B. Measured service'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# C. Multitenancy


    # D. On-demand self-service


    ☑ On-demand self-service allows a cloud customer to provision resources or change
    configurations on their own, without the need to interact with the staff of the
    cloud provider. This is typically accomplished through a web portal and tools
    provided by the cloud provider.


    ☑ A, B, and C are incorrect. Resource pooling and multitenancy both pertain to
    having a large pool of resources and services that are shared between different
    applications and customers with a cloud environment, neither concept specifically
    pertains to administration. Measured service pertains to only incurring billing
    and charges for services the cloud customer actually uses, and for the duration
    of their, but does not pertain to their administration.


    +   6. Which of the following properties of an application will lead to the biggest
    cost-savings potential with a move into a cloud environment?


    +   A. Heavy utilization


    +   B. Light utilization


    +   C. Cyclical utilization


    +   D. Internal utilization


    ☑ C. An application that experiences cyclical utilization, where some periods
    have high utilization and others have low, has the potential to realize substantial
    cost savings within a cloud environment due to measured service. With a traditional
    data center, an application needs to be built to handle the highest possible utilization,
    with substantial resources idling at other times. Within a cloud environment,
    systems can be expanded for high-utilization periods and then scaled down during
    lower periods, saving money.


    ☑ A, B, and D are incorrect. High utilization and low utilization steady-states
    would not realize savings in a cloud environment versus a traditional data center,
    where they can be planned and designed for. Internal utilization versus public
    utilization would not result in a cost difference.


    +   7. Which of the following standards pertains to the accreditation of cryptographic
    modules?


    +   A. FIPS 140-2


    +   B. PCI DSS


    +   C. NIST 800-53


    +   D. ISO/IEC 27001


    ☑ A. The FIPS 140-2 criterion is published by the federal government of the United
    States and pertains to the accreditation of cryptographic modules. Although it
    was published in 2002, long before cloud computing came into existence, the heavy
    usage of and reliance on encryption within cloud computing makes it relevant to
    the cloud security professional.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'B, C, and D are incorrect. The Payment Card Industry Data Security Standard
    (PCI DSS) is an industry regulation, published by the major credit card brands,
    and required of vendors that utilize processing and networks for the major card
    brands. The NIST 800-53 regulates systems and data utilized by the US federal
    government for all non-national security systems. ISO/IEC 27001 is a widely recognized
    international security certification and guidelines program.


    +   8. Which cloud model lays out a vision for IT Service Management, encompassing
    best-practice recommendations covering a wide variety of IT services and operations?


    +   A. SABSA


    +   B. ITIL


    +   C. TOGAF


    +   D. NIST SP 500-293


    +   B. The IT Infrastructure Library (ITIL) is a collection of papers and concepts
    to lay out a vision for IT Service Management (ITSM). It is essentially a collection
    of best practices to give companies of all sizes (but more targeted to large companies)
    a framework for providing both IT services and user support.


    +   A, C, and D are incorrect. The Sherwood Applied Business Security Architecture
    (SSA) provides a group of components that can be used in part or whole as an approach
    to security architecture of any system. The Open Group Architecture Framework
    (TOGAF) is meant to be an open enterprise architecture model that is intended
    to be a high-level design approach. The NIST Cloud Technology Roadmap, put out
    by the NIST of the US federal government in special publication “SP 500-293,”
    is a comprehensive guide for US government agencies and their use of and migration
    to cloud computing platforms.


    +   9. Which phase of the cloud secure data lifecycle is where data is viewable
    to customers or users?


    +   A. Use


    +   B. Share


    +   C. Store


    +   D. View


    +   B. The “share” phase of the cloud secure data lifecycle is where data is made
    to the users or customers of an application or system.


    +   A, C, and D are incorrect. The “use” phase is where data is accessible to
    the application for processing or modification. The “store” phase is where data
    is committed to storage of any type. The “view” phase is not part of the cloud
    secure data lifecycle.


    +   10. Which cloud storage type is typically accessed via an API or web service
    call?


    +   A. Volume


    +   B. Structured'
  merge: -1
