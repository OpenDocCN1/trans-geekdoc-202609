  md: '8. DHCP is heavily used within cloud environments to maintain network configurations
    in a centralized manner. Which of the following is NOT a network configuration
    that plays a role with DHCP?


    +   A. IP address


    +   B. Hostname


    +   C. MAC address


    +   D. Gateway


    +   B. Hostname resolution is provided via the Domain Name System (DNS) and is
    not provided as part of the network configuration for a specific server.


    +   A is incorrect because the IP address is one of the core network configuration
    items provided by DHCP to a server.


    +   C is incorrect because the MAC address is what the DHCP servers use to track
    and maintain network configuration settings for a host.


    +   D is incorrect because a gateway address would be assigned by a DHCP server
    as part of the network configuration given to the host.


    9. Which component of the ITIL framework includes dependency checks?


    +   A. Change management


    +   B. Continuity management


    +   C. Release management


    +   D. Availability management


    +   A. The change management process oversees the entire implementation and release
    of changes to a production environment, including management approvals, notifications,
    and testing/validation. As part of the approval process, a dependency check is
    done to validate the scope of potential impact and to ensure that a proper validation
    plan is fully in place.


    +   B is incorrect because continuity management is focused on planning for the
    successful recovery of systems or services after an unexpected outage, incident,
    or disaster.


    +   C is incorrect because release management is focused on the actual execution
    of a production release, including validation. The main focus is on properly napping
    all out steps for a release and then configuring and deploying it. Although dependency
    validations will be part of a release management process, they are performed after
    the checks will have been done as part of the change management process.


    +   D is incorrect because availability management is focused on making sure system
    resources, processes, personnel, and toolsets are properly allocated and secured
    to meet SLA requirements for performance.'
  merge: -1
