  md: 'function, it is possible for the user to be able to elevate access, either
    intentionally or accidentally. The application should verify authorization as
    a user accesses each new function or piece of data.


    +   B is incorrect because security misconfiguration refers to a system baselines
    were not correctly applied, unauthorized changes were made, or security patches
    and updates from the vendor were not applied.


    +   C is incorrect because sensitive data exposure occurs when protected data,
    such as PII or credit card information, is not properly encrypted or masked, and
    is thus susceptible to attackers. This exposure refers to specific data within
    the application and is not directly related to specific functions of the application.


    +   D is incorrect because unvalidated redirects and forwards occurs when an application
    allows links or redirects but does not properly validate or secure them. This
    enables an attacker to potentially redirect users through a legitimate and secure
    application to an external site for phishing attempts or other malware attacks.
    This site will appear to be safe and legitimate to the users because it originated
    from a trusted application.


    +   3. Where would be the most appropriate location for an XML firewall within
    a system architecture?


    +   A. Between the presentation and data layers


    +   B. Between the application and data layers


    +   C. Between the firewalls and application servers


    +   D. Before the firewalls


    +   C. An XML firewall validates XML data before it reaches an application server.
    The appliance can perform validation as well as control what users or services
    are allowed to access specific XML functions of an application. Positioning the
    XML firewall between the firewalls and applications allows for initial network
    filtering based on origination and destination of packets before the content analysis
    of the appliance is performed before the traffic is allowed to reach the application
    servers.


    +   A is incorrect because the data would have already reached the application
    servers and been consumed by them before accessing the data layer, which would
    allow potentially malformed or dangerous XML data into the application and through
    processing being scrutinizedized.


    +   B is incorrect because the data would have already reached the application
    servers and been consumed by them before accessing the data layer, which would
    allow potentially malformed or dangerous XML data into the application and through
    processing being scrutinizedized.


    +   D is incorrect because a system would not network validation done before content
    validation. A firewall can block or allow specific traffic from legitimate origins
    as a first line of defense at a much lower overhead processing cost compared to
    the content analysis required by an XML firewall.'
