- pgno: 237
  md: '+   C. Unstructured


    +   D. Object


    +   \u273 D. Object storage is data storage that operates as an API or a web service
    call. Rather than being in a file tree structure and accessible as a traditional
    hard drive, data is stored as objects in an independent system and given a key
    value for reference and retrieval.


    +   \u271 A, B, and C are incorrect. Volume storage is allocated to a server with
    IaaS and functions the same as a traditional file system that''s managed by the
    operating system. Structured storage, used with PaaS, resembles database storage
    with predefined structures, and unstructured storage is also used with PaaS to
    host support files as images and style sheets.


    11. Which data security and privacy practice uses an opaque value for sensitive
    data fields that can be mapped back to the original value if needed?


    +   A. Anonymization


    +   B. Tokenization


    +   C. Obfuscation


    +   \u273 B. Tokenization is the practice of utilizing a random and opaque "token"
    value in data to replace what otherwise would be a sensitive or protected data
    object. The token value is usually generated by the application with a means to
    map it back to the actual real value.


    +   \u273 A, C, and D are incorrect. Masking and obfuscation involve replacing
    sensitive values in data sets with random or garbage values. They are typically
    used when making data sets for testing in non-production environments, where the
    format of the data is important but the exact values are not. Anonymization involves
    removing indirect identifiers from data that it cannot be traced back to a specific
    individual.


    12. Which phase of the cloud data lifecycle represents the first opportunity to
    apply security controls to protect data?


    +   A. Create


    +   B. Use


    +   C. Share


    +   D. Store


    +   \u273 D. Immediately after the "create" phase has been completed, the data
    must be committed to some sort of storage system, such as a database or file system.
    This represents the first time where security controls can be applied to the data,
    based on the type of storage system used and the classification of the data.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'A, B, and C are incorrect. The "create" phase is simply data is created or
    generated, but not until the data is stored or written can security controls be
    applied. The "use" and "share" phases occur after the "store" phase, so neither
    would be the first instance where security controls can be applied.


    # 13. Which of the following is NOT one of the main methods of data discovery
    processes?


    +   - A. Checksums

    - B. Metadata

    - C. Labels

    - D. Content analysis


    +   A. Checksums, where a value is derived based on the overall data object, are
    often used for ensuring the integrity of data. If any alterations to the file
    have been made from the original, the checksum of the file will compute to a different
    value. Checksums would not be used for data discovery.


    +   B, C, and D are incorrect. Metadata, labels, and content analysis are the
    three main types of data discovery. Metadata involves use of information about
    the data (filenames, creator, dates, and so on) to determine classification. Labels
    use data categories and their headings, such as database fields, to determine
    classification, and content analysis runs searches against the actual data for
    pattern matching and keywords.


    # 14. Which jurisdiction has implemented policy regulations that are known as
    the "right to be forgotten" protections?


    +   - A. United States

    - B. Russia

    - C. European Union

    - D. APEC


    +   C. The European Union is widely recognized as implementing the most comprehensive
    and strong data privacy and security regulations. The "right to be forgotten"
    provision protects a user''s right and ability to have their presence and information
    removed from search engine indexes and results.


    +   A, B, and D are incorrect. The United States lacks a national privacy regulation
    that is universal, and Russia and the Asian-Pacific Economic Cooperation (APEC)
    have only implemented varying degrees of privacy regulations. None have implemented
    requirements as stringent or comprehensive as the EU''s "right to be forgotten"
    provisions.


    # 15. Which of the following functions can be controlled by IRM technologies,
