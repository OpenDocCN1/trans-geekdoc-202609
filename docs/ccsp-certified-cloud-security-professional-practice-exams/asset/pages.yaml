    +   4. In a traditional data center, resources are owned, controlled, and maintained
    by a single entity for their exclusive use for services and systems. Within a
    cloud environment, this infrastructure is shared among many different customers.
    What is this concept?


    +   A. Co-location


    +   B. Elasticity


    +   C. System sharing


    +   D. Resource pooling


    D. Resource pooling is largely what separates a traditional data center from a
    cloud in regard to computing resources. In a traditional data center, resources
    are allocated to specific systems or applications, and for the most part are not
    shared. Within a cloud, the entire hardware infrastructure is viewed as an aggregate
    and then allocated according to the various cloud customers and applications hosted
    within it. This is typically a massive pool of resources that not only can handle
    the typical operational load of the hosted applications, but also allow for expansion
    through auto-elasticity or cycles of some applications.


    A is incorrect because co-location refers to the hosting of multiple applications
    or systems within the same physical hardware, but not necessarily through the
    use of pooled and allocated resources. This can also be done within a traditional
    data center, where any level of hardware can be shared, including networking,
    physical floor space, cooling, and power. The typically detailed nature of resources
    within a co-location setup is what differentiates it from resource pooling within
    a cloud environment.


    B is incorrect because elasticity refers to the ability for systems, services,
    and applications to automatically expand or shrink to meet actual needs at the
    time. If the applications are written to support elasticity, then as load changes
    are detected in the environment and meet predefined thresholds, the cloud environment
    can dynamically and rapidly resize the resources allocated to meet exactly what
    is needed, rather than having resources on standby to handle any sudden increase
    in demand.


    C is incorrect because system sharing is provided as an erroneous answer. Although
    it is a similar type of answer to resource pooling, it is not a typically used
    or official for anything related to cloud computing, or this specific question.'
