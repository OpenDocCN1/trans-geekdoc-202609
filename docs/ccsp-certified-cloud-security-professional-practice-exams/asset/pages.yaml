    both in testing and planning?


    +   A. Recovery of services

    B. Change management processes

    C. Staff availability and demands

    D. Restoration of services


    +   D. Once a BCDR event has concluded, and the regular data center and hosting
    resources are available again, it is crucial to conduct an orderly return to normal
    operations. Although BCDR plans tend to be very detailed and thoroughly tested
    for moving production operations to a recovery site, the same level of detail
    and testing is not often perfect for returning services to normal operations.
    With this oversight, an organization can be incurring substantial delays, costs,
    or even potentially downtime during its data and services to their normal operating
    state.


    +   A is incorrect because the recovery of services during disaster tends to be
    the overwhelming focus of any BCDR plan and testing, and is not something that
    would be overlooked at all.


    +   B is incorrect because most BCDR planning does a good job of ensuring that
    change management processes have been followed to ensure system consistency and
    documentation, and these processes are not typically overlooked during planning
    and testing.


    +   C is incorrect because the availability of staff and the demands placed upon
    them are tightly coupled with the restoration of services, and as such would not
    be overlooked.


