- pgno: 220
  md: 'A. The United States lacks an overall comprehensive privacy regulation for
    data protection. Although various regulations pertain to specific types of data
    or institutions, there is no single, comprehensive regulation for personal information
    or privacy protection.


    B is incorrect because the European Union has long been one of the top drivers
    of data privacy and personal protection. It issued Directive 95/45 EC in 1995,
    which established data privacy as a human right.


    C is incorrect because Russia put into effect Russian Law 526-FZ in 2015, which
    requires all data and processing for personal information on Russian citizens
    to be done by systems and applications that physically reside and are hosted within
    the borders of the Russian Federation.


    D is incorrect because Germany is part of the European Union, and as such, it
    is covered under the privacy policies and regulations the EU has issued.


    # 29. An audit scope statement defines the entire process and procedures to be
    used while conducting of an audit. Which of the following items is NOT something
    that would be found in an audit scope statement?


    +   A. Exclusions

    B. Costs

    C. Certifications

    D. Reports


    B. The costs of the audit are not something that is included in an audit scope
    statement. They would be determined by contract separately. Although the intended
    scope of the audit will likely have an impact on costs, they are not included
    in the audit scope statement.


    A is incorrect because any exclusions to the audit—either systems, applications,
    or services, as well as any particular features that are not to be included—would
    be a core component of the audit scope statement.


    C is incorrect because any required certifications on the part of the auditors
    or the organization would be a core component of the audit scope statement.


    D is incorrect because the final reports, including format, are defined as part
