    may find ways to elevate privileges after authentication, and it catches cases
    where a user''s access may have changed since he initially authenticated.


    +   A. is incorrect because the account provisioning process is where the user''s
    identity is provided and verified before get credentials issued. It does not play
    a role in the authorization of a user as he accesses an application or data.


    +   C is incorrect because authorization will typically be performed upon successful
    authentication, but doing so only at that point leaves data susceptible to elevation-of-privilege
    attacks, and therefore it is not an optimal solution.


    +   D. is incorrect because the change management process may be used to grant
    roles and access initially, especially in the case of privileged or administrative
    users, but it would not play any role in system operations as that access is being
    used.


