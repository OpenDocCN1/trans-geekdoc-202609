  md: '# # Cloud Platform and Infrastructure Security Domain


    Domain 3 is focused on the following topics:


    +   * Physical aspects of a cloud environment

    * Key components that make up a cloud environment

    * Risks associated with cloud computing

    * The design and planning for cloud-based security controls

    * Auditing in a cloud environment

    * Disaster recovery and business continuity in a cloud environment


    Cloud platforms bring unique benefits to an organization and have many attractive
    capabilities for performance and scalability. They also remove the focus on hardware
    and instead focus on business requirements and measured service—all for a lower
    total cost running your own data center. However, cloud platforms also bring unique
    challenges and risks because of these very same factors. This chapter goes over
    those risks and challenges as well as how to address and mitigate them, and it
    covers the disaster recovery and business continuity requirements and benefits
    in a cloud environment.'
