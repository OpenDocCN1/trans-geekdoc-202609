    move services or data to an alternative hosting location.


    A, B, and D are incorrect. An earthquake, flood, and utility outage are widespread
    events that have the potential to affect an entire data center, and as such could
    be reasons for the triggering of a declared disaster and invocation of a BCDR
    plan.


    28. Which of the following metrics are tested during a BCDR exercise to ensure
    management objectives are being achieved?


    +   A. RPO and RTO

