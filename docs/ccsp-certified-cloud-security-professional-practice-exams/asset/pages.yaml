    the actual forwarding of traffic are separate from each other. With cloud computing,
    this separation is important because it allows the administrators of the cloud
    network to quickly and dynamically adjust network flows and resources based on
    the current needs and demands of cloud customers. With the separation from the
    actual network components, a cloud provider can build management tools that allow
    staffers using web portals or cloud administrative'
