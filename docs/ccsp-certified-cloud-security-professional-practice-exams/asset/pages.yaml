- pgno: 173
  md: '# Comprehensive Answers and Explanations


    1. Which TLS protocol is responsible for performing authentication between parties
    and ndetermining encryption algorithms?


    +   A. Record


    +   B. Negotiation


    +   C. Handshake


    +   D. Transmission


    +   C. The handshake protocol of TLS negotiates and establishes the connection
    between two parties and enables the secure communications channel that will then
    handle secure data transmission. The protocol exchanges all information needed
    to authenticate and negotiate the encryption algorithms to be used as to create
    the session ID for the transaction.


    +   A is incorrect because the record protocol of TLS entails the encryption and
    authentication of the actual packets used for transmission of data over the secure
    channel, but it''s only capable of the actual transmission and is not involved
    in the establishing or negotiation of the connection.


    +   B is incorrect because negotiation is a component of the handshake protocol,
    but it''s only one part of it and is not a protocol by itself.


    +   D is incorrect because the transmission of data is a component of the record
    protocol but is not a protocol of TLS by itself.


    2. You are designing a new data center, and management considers it imperative
    that best practices are followed for the cabling layout and design, especially
    considering the complexity of modern data centers. What standard would you look
    to in fulfilling this requirement?


    +   A. BISCI


    +   B. IDCA


    +   C. NFPA


    +   D. Uptime Institute


    +   A. Building Industry Consulting Services International (BISCI) issues certifications
    and develops standards in the area of complex cabling for data systems. Their
    standards are focused on cabling design and setups and includes specifications
    on power, energy, efficiency, and hot/cold aisle setups.


    +   B is incorrect because the International Data Center Authority (IDCA) established
    the Infinity Paradigm, which is intended to be a comprehensive data center design
    and operations framework. The Infinity Paradigm differs from other standards by
    shifting away from a tiered architecture and instead embracing a macro-level approach,
    where the entire data center is considered as a whole.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   C is incorrect because the National Fire Protection Association (NFPA)
    publishes a large collection of standards regarding fire protection for almost
    any type of facility, although it does offer ones specifically focused on data
    centers.


    +   D is incorrect because the Uptime Institute publishes the most widely used
    standard for data center design based on a tiered-topology approach. This standard
    has four tiers, each progressively adding layers and requirements for redundancy
    and fault tolerance.


    3. At which layer does the IPSec protocol operate to encrypt and protect communications
    between two parties?


    +   A. Network


    +   B. Application


    +   C. Transport


    +   D. Data link


    +   A. IPSec works at the network layer of the OSI model. The network layer provides
    the actual routing and switching for packets and data transmission between nodes.


    +   B is incorrect because the application layer provides application and end-user
    processes, such as file transfers, web browsing, and e-mail.


    +   C is incorrect because the transport layer provides data transmissions similar
    to what IPSec is used for, but it operates at a higher level with more capabilities
    than are used by IPSec.


    +   D is incorrect because the data-link layer provides packet encoding and decoding
    as well as handles errors from the physical layer, but it does not contain the
    routing and forwarding capabilities necessary for IPSec.


    4. Which set of standards contains the publication titled "National Electric Code"
    and serves as guidance for complex and high-capacity electrical systems, including
    safety and emergency cutoff procedures and requirements?


    +   A. IDCA


    +   B. NFPA


    +   C. BISCI


    +   D. Uptime Institute


    +   B. The National Fire Protection Association (NFPA) publishes a large collection
    of standards regarding fire protection for almost any type of facility, and does
    offer ones specifically focused on data centers. These standards cover the overall
    electrical systems within data centers, including emergency procedures and requirements
    for the immediate cutoff of power in case of an emergency.


    +   A is incorrect because the International Data Center Authority (IDCA) established
    the Infinity Paradigm, which is intended to be a comprehensive data center design
    and operations framework. The Infinity Paradigm differs from other standards'
  merge: -1
  img_proc: true
