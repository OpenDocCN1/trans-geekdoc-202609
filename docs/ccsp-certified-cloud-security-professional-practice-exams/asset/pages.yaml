- pgno: 27
  md: '# ANSWERS

    Comprehensive Answers and Explanations


    1. Which concept of cloud computing pertains to the ability for a cloud customer
    and users to access their services through a variety of different devices and
    locations?


    A. Interoperability


    B. Open source


    C. Broad network access


    D. Single sign-on


    +   C. Broad network access pertains to the availability of cloud resources from
    virtually any network, and through any type of device. This can be from corporate
    networks or from the public Internet on virtually any type of connection. In regard
    to devices, while many cloud services are accessed via web browsers and mobile
    applications, it is possible to use any type of thick or thin desktop client that
    is appropriate as well.


    +   A is incorrect because interoperability refers to the ease with which one
    can move or reuse components of an application or service. For systems and applications
    with a high level of interoperability, the customer is not bound or locked in
    a particular cloud provider, and has the option to move between them. This allows
    for great flexibility for a cloud customer, and the ability to continually shop
    for the best financial and feature options from different cloud providers.


    +   B is incorrect because "open source" refers to a style and methodology of
    software development and distribution, not the manner in which the applications
    themselves are accessed once deployed. With open source software, the full source
    code is available for distribution to anyone who wants it, even if binary distributions
    are offered as well. This allows for understanding or auditing of the source code,
    as well as for those interested to contribute to the software development. It
    also offers the opportunity for someone to modify the source code for their particular
    needs. Many commonly used applications are open source, such as Apache, Perl,
    PHP, MySQL, and even the Linux operating system.


    +   D is incorrect because, although single sign-on is very often a component
    of cloudbased applications, it is not a requirement, nor does it refer specifically
    to the manner in which applications or services are accessed. Single sign-on systems
    offer the ability for users to sign into one source and then, through cookies,
    tokens, or some other method of maintaining state, pass from one application to
    another without having to authenticate for each one.


