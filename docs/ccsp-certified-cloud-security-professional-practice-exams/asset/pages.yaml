- pgno: 204
  md: '# Comprehensive Answers and Explanations


    1. The nature of cloud computing and how it operates make complying with data
    discovery and disclosure orders more difficult. Which of the following concepts
    provides the biggest challenge in regard to data collection, pursuant to a legal
    order?


    +   A. Portability


    +   B. Multitenancy


    +   C. Reversibility


    +   D. Auto-scaling


    +   B. In a traditional data center, where an organization owns and controls all
    systems, data, and physical equipment, it is very easy to isolate and duplicate
    anything. Within a cloud environment, with multitenancy and many customers sharing
    the same resources, it isn''t practical for the cloud provider to make easy snapshots
    or isolate physical storage systems or servers. Different collection methods are
    necessary in a cloud environment, which often are more labor or cost intensive,
    and with additional complexity involved.


    +   A is incorrect because portability refers to the ability for a system, service,
    or application to move with ease between different cloud providers. It gives additional
    flexibility to a cloud customer and prevents vendor lock-in, which would eliminate
    a cloud customer from seeking competition and constantly shopping for cheaper
    services or better support.


    +   C is incorrect because reversibility refers to the ability of a cloud customer
    to easily remove their data, systems, and applications from a cloud provider,
    with certainty that it has been securely and completely removed. The requirements
    for removal, including methods and timelines, should be covered by the contract
    between the cloud customer and cloud provider.


    +   D is incorrect because auto-scaling pertains to a cloud environment''s ability
    to programmatically adjust the necessary resources to meet current demand, either
    by adding or removing allocated resources.


    2. Which security concept pertains to protecting sensitive information from disclosure
    but also ensuring it is accessible to the appropriate parties?


    +   A. Confidentiality


    +   B. Integrity


    +   C. Availability


    +   D. Privacy'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'A. Confidentiality pertains to the protection of sensitive information from
    unauthorized parties, either through accidental disclosure or by the actions of
    malicious actors. It has a second component that is related to ensuring that data
    is available to authorized parties and provisioned for appropriate access.


    B is incorrect because integrity refers to ensuring that data has not been corrupted
    or altered through unauthorized or inappropriate actions. It is solely focused
    on the format and correctness of the data, and may be used in conjunction with
    confidentiality in some instances. However, data is not required to be protected
    or to be sensitive in nature for integrity to be a necessary concern.


    C is incorrect because availability pertains to data being accessible when necessary
    and in a secure manner. It may involve sensitive data or can be completely open
    and public dissemination, but with requirements for access and availability for
    crucial operations.


    D is incorrect because privacy is considered a subset of confidentiality, as it
    is focused on personal data and the right or ability to control how it is collected
    or used, as well as the ability to remove it from a system or application when
    desired or no long necessary for use.


    3. With cloud computing crossing any jurisdictional boundaries, it is a virtual
    certainty that conflicts will arise between differing regulations. What is the
    major impediment to resolving conflicts between multiple jurisdictions to form
    an overall policy?


    +   A. Language differences


    +   B. Technologies used


    +   C. Licensing issues


    +   D. Lack of international authority


    D. The biggest problem with resolving jurisdictional conflicts is the lack of
    an international authority. Each jurisdiction, typically along national lines,
    establishes its own rules and laws pertaining to data protection. When conflicts
    between jurisdictions arise, it is incumbent upon those jurisdictions to work
    out the issue. Typically, no centralized authority exists at the international
    level that can be used to resolve potential conflicts or to mediate.


    A is incorrect because language differences would not be a significant impediment.
    Although it is quite likely that you could encounter language differences when
    dealing across borders with different locales, these are easily overcome with
    translators, or even computer programs that can handle translations well.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'B is incorrect because the technologies used would not serve as a hindrance
    to regulations compliance in any significant way that is unique to multiple jurisdictions.
    Technologies always need to match compliance requirements to an acceptable standard,
    so hosting across multiple jurisdictions is not a unique circumstance in this
    regard.


    C is incorrect because licensing issues are also not unique across jurisdictions,
    nor do they directly play into issues with regulatory compliance. They are more
    central to contractual issues.


    # 4. Which of the following regulations originates from a professional or industry
    organization, rather than from a legal or governmental authority?


    +   A. PCI DSS


    +   B. FISMA


    +   C. HIPAA


    +   D. SOX


    +   A. The Payment Card Industry Data Security Standard (PCI DSS) was first implemented
    in 2004 and was designed by the major credit card brands to ensure that a minimal
    level of security standards was being used by merchants when processing credit
    card payments and utilizing their networks. It was implemented by industry groups
    and companies rather than a legal or governmental authority.


    +   B is incorrect because the Federal Information Security Management Act (FISMA)
    was signed into law in 2002 in the United States and pertains to the security
    of federal government IT systems and outlines requirements for agency security
    programs.


    +   C is incorrect because the Health Insurance Portability and Accountability
    Act (HIPAA) was implemented by the United States in 1996 and provides security
    for the privacy and protection of personal medical records.


    +   D is incorrect because the Sarbanes-Oxley Act (SOX) became law in the United
    States in 2002 and sets requirements for publicly traded companies and public
    accounting firms in regard to disclosure and recordkeeping.


    # 5. What is a common method of verifying the integrity of a file that has been
    downloaded from a site or vendor distribution, to ensure it has not been modified
    during transmission?


    +   A. File size


    +   B. Checksum


    +   C. Filename


    +   D. Metadata'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'B. A checksum is the output of an algorithm processing a cryptographic hashing
    function against piece of data or a file. The same algorithm can be run again
    at another time and compared to the original, true value to determine if the file
    has been altered at its original and correct state. Using a checksum is an easy
    and quick way to determine if a file has been altered or tampered with in any
    way.


    A is incorrect because file size would not be a reliable method for determining
    if a file has been altered at all, as modifications can be made that would not
    alter the size of a file yet could substantially change the contents of the data.


    C is incorrect because filenames can easily be changed at any time, and there
    is no way to know if the filename presented is the correct or original value.


    D is incorrect because metadata represents attributes of the data itself and can
    easily be manipulated, altered, or forged.


    # 6. The Safe Harbor program was developed to bridge the gap in privacy regulations
    between different jurisdictions. Which two jurisdictions are involved in the program?


    +   A. The United States and Japan

    B. Russia and the European Union

    C. The United States and the European Union

    D. The European Union and Japan


    C. The Safe Harbor program was designed by the US Department of Commerce as a
    voluntary set of regulations that a company can use to meet the stricter privacy
    and data protection requirements of the European Union, and thus allow United
    States companies to comply with contractual and regulatory requirements necessary
    to doing business within EU borders.


    A is incorrect because the Safe Harbor program pertains to the United States and
    the European Union, not the United States and Japan.


    B is incorrect because the Safe Harbor program pertains to the United States and
    the European Union, not Russia and the European Union.


    D is incorrect because the Safe Harbor program pertains to the United States and
    the European Union, not the European Union and Japan.


    # 7. Regulatory frameworks can come from a variety of jurisdictions, both legal
    and professional. Which of the following regulatory frameworks pertains to the
    handling of credit card transactions?


    +   A. PCI DSS

    B. FISMA'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'C. HIPAA


    D. FIPS 140-2


    +   A. The Payment Card Industry Data Security Standard (PCI DSS) is a regulatory
    framework developed by the major credit card brands, designed to set minimum standards
    for merchants to follow when processing and transmitting data across networks
    and interacting with their payment systems.


    +   B is incorrect because the Federal Information Security Management Act (FISMA)
    is a United States government law that pertains to the protection and security
    of systems used by government agencies and their contractors.


    +   C is incorrect because the Health Insurance Portability and Accountability
    Act (HIPAA) is a United States government law that pertains to the protection
    of medical records and personal privacy related to them.


    +   D is incorrect because the FIPS 140-2 standards were developed by the government
    of the United States and pertain to the certification of cryptographic modules
    used within systems.


    # 8. Audits are regularly undertaken by an organization in both internal and external
    formats, to ensure regulatory or corporate policy compliance, among many other
    potential factors. Which of the following is NOT evaluated as part of an internal
    audit?


    A. Efficiency


    B. Regulations


    C. Design plans


    D. Costs


    +   B. Compliance with regulations is considered an external audit. It is done
    by an independent third party that does not have any stake or financial interests
    in the organization undergoing the audit. Most regulations have specific requirements
    as to the type of audit, and in some cases who the appropriate auditors should
    be selected from as well.


    +   A is incorrect because efficiency—specifically, operational efficiency—is
    a key component of internal audits that is done to improve business processes
    and streamline operations.


    +   C is incorrect because design plans are something that would be evaluated
    as part of an internal audit, with a goal of assisting in efficiency and determining
    appropriate level of resources.


    +   D is incorrect because costs are not a factor in regulatory compliance audits
    at all and are instead a component of internal audits, typically with an eye toward
    any changes that can be made to reduce overall operating costs.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '9. What principle must always been included with an SOC 2 report?


    +   A. Confidentiality


    +   B. Security


    +   C. Privacy


    +   D. Processing integrity


    +   B. The SOC 2 reports are composed of five principles: confidentiality, processing
    integrity, availability, privacy, and security. If a principle other than security
    is desired, the security principle must also be included, as it is required for
    all reports.


    +   A is incorrect because confidentiality is a principle of the SOC 2 reports
    that pertains to the protection of sensitive information and compliance with any
    regulations required to be applied to it, but it is not a required principle to
    be included in all reports.


    +   C is incorrect because privacy is a principle of the SOC 2 reports that pertains
    to the protection of personal information to meet an organization’s privacy policy,
    as well as any applicable regulations, but it is not a required principle of all
    SOC reports.


    +   D is incorrect because processing integrity is a principle of the SOC 2 reports
    that pertains to ensuring that only authorized parties can manipulate data, and
    only so in an appropriate manner, but it is not required as a principle with all
    reports.


    10. What will determine the responsibilities for both the cloud provider and the
    cloud customer in the event of litigation impacting a system or service?


    +   A. Contract


    +   B. SLA


    +   C. Regulation


    +   D. SOW


    +   A. In the event of any litigation, either against the cloud customer’s systems
    or services against the cloud provider, the contract should clearly document the
    responsibilities and duties of each party as far as communication and compliance.


    +   B is incorrect because the service level agreement (SLA) will specify specific
    operational thresholds and performance metrics, but would not be the appropriate
    document for litigation responsibilities.


    +   C is incorrect because regulations will dictate minimum standards for security
    and configurations, but will not determine the responsibilities or duties on behalf
    of the cloud provider or cloud customer in regard to compliance with litigation.


    +   D is incorrect because a statement of work (SOW) will document the specific
    work items and tasks necessary to turn a contract into an actual implementation,
    but will not document or dictate duties or responsibilities for compliance with
    litigation.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '11. The first step with an internal information security management system
    (ISMS) involves defining an organization''s security policies. After security
    policies have been defined, what is the next step in the process?


    +   A. Risk assessment


    +   B. Scope definition


    +   C. Implement controls


    +   D. Continuous improvement


    B. After the formulation of security policies, the next step is to define the
    scope of the ISMS efforts, which will define and drive all future activities and
    determine what is to be included and to what extent.


    A is incorrect because the risk assessment occurs after the defining of security
    policies and determining the scope. The risk assessment is then used to determine
    how to approach the known risks with an eye toward regulatory compliance or management
    expectations.


    C is incorrect because controls are implemented after the risk assessment has
    been completed and the scope and need for control have been appropriately determined.
    Implementing controls prior the completion of the risk assessment increases the
    likelihood of controls that do not meet objectives or that incur additional costs
    or gaps in compliance.


    D is incorrect because continuous improvement is the last component, after the
    ISMS has been properly determined and implemented, with an eye toward ongoing
    operations and adherence to regulatory compliance, for both new and existing regulations.


    12. Without direct access by customers to the underlying infrastructure of a cloud
    environment, coupled with their limited knowledge of many operations and configurations,
    what can be used for customers to gain assurance of security controls and implementations?


    +   A. SLAs


    +   B. Contracts


    +   C. Regulations


    +   D. Certifications


    D. With a cloud customer having very limited insight into the configuration and
    operational practices of a cloud provider, certifications are often used to provide
    assurances that standards are met, as well as specifics in regard to minimum settings
    and protection standards. With certification programs publishing publicly available
    standards and frameworks, having an independently verified audit to show adherence
    can provide a cloud customer with confidence in the cloud provider''s practices;
    this can also serve as a means of compliance with their own regulations.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'A is incorrect because service agreements (SLAs) are intended to outline performance
    metrics and expectations for support and implementations; it would not be used
    as a means to gain assurances concerning security implementations and configurations.


    B is incorrect because contracts document the broad parameters and high-level
    points of a business relationship. They formalize regulations and expectations
    between the cloud customer and the cloud provider, but do not serve to provide
    assurance or validation for specific configurations, but only the requirement
    to do.


    C is incorrect because regulations will dictate specific requirements for configurations
    and minimum standards, but will not provide assurance of their implementation
    in the way that certifications will. In fact, in many instances, certifications
    are designed specifically to comply with regulations.


    13. Cloud environments pose many unique challenges for a data custodian to properly
    adhere to policies and the use of data. What poses the biggest challenge for a
    data custodian with a PaaS implementation, over and above the same concerns with
    IaaS?


    # A. Access to systems


    # B. Knowledge of systems


    # C. Data classification rules


    # D. Contractual requirements


    B. In order for a data custodian to do his job with a high degree of confidence,
    he needs to have extensive knowledge of systems and configurations, including
    the security controls in place and how they are implemented. With a cloud implementation,
    the depth of knowledge is going to be much shallower than it would be with a traditional
    data center, where full control is likely. This is even more of a struggle within
    a cloud when PaaS is used and the cloud provider is responsible for the majority
    of the system configurations and administration.


    A is incorrect because access to systems does pose a challenge, especially with
    the much more limited access available in a PaaS implementation, it does not pose
    the same level of challenge as knowledge of the systems and the underlying infrastructure.


    C is incorrect because data classification rules will be universal regardless
    of the particular hosting model used. Whether the data is hosted under IaaS or
    PaaS will not make any difference in classification rules.


    D is incorrect because contractual requirements would not have any impact on the
    challenges a data custodian faces, nor are there any differences between IaaS
    and PaaS hosting deployments.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '14. During the lessons learned phase of an audit, reducing duplication is key
    for lowering both costs and time involved for staff with audits. Which of the
    following will prevent elimination of duplication in many instances?


    +   A. Corporate policies


    +   B. Vendor recommendations


    +   C. Regulations


    +   D. Stakeholders


    +   C. Although many areas of duplication are possible to eliminate with a thorough
    evaluation after audits have been completed, requirements that come from regulations
    will prevent the total elimination of duplication. Regulations have specific audit
    requirements that must be fulfilled, and will typically not allow substitution
    of other audit results, or the acceptance of equivalences. Regulations typically
    require specific auditors, sometimes even performed by specific auditors, that
    must be satisfactorily completed.


    +   A is incorrect because corporate policies can always be adjusted to allow
    for the elimination of duplication with audits. Because the company controls its
    own policies, it also has control over the modification of them, or the acceptance
    of similar audits to fulfill requirements.


    +   B is incorrect because vendor recommendations will not directly play into
    audits. Auditors may use best practice recommendations from vendors as input into
    their testing plans and methodologies, but that decision is subjective and always
    open to modification.


    +   D is incorrect because stakeholders not often have direct influence on audits
    and how they are conducted, beyond perhaps mandating specific certifications or
    standards that should be followed. However, stakeholders can always allow for
    modifications, whereas regulations will not be flexible in most instances for
    individual organizations.


    15. The ISO/IEC 27001:2013 security standard contains 14 different domains that
    cover all areas of IT operations and procedures. Which of the following is NOT
    one of the domains listed in the standard?


    +   A. Legal


    +   B. Management


    +   C. Assets


    +   D. Supplier Relationships


    +   A. The ISO/IEC 27001:2013 security standard contains 14 different domains,
    but legal is not one that''s specifically mentioned. However, though legal is
    not specifically mentioned, like many other concepts, it can be found throughout
    many of the other domains to varying degrees.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'B is incorrect because management is one of the 14 individual domains contained
    in the ISO/IEC 27001:2013 standard:


    C is in correct because assets is one of the 14 individual domains contained in
    the ISO/IEC 27001:2013 standard.


    D is incorrect because supplier relationships is one of the 14 individual domains
    contained in the ISO/IEC 27001:2013 standard.


    # 16. What is the process that requires searching, identifying, collecting, and
    securing electronic data or records for use within criminal or civil legal matters?


    A. Disclosure


    B. Subpoena


    C. Retention


    D. eDiscovery


    D. eDiscovery is the process that requires searching, identifying, collecting,
    and securing electronic data or records, typically to be used for criminal or
    civil legal matters. It is similar to the discovery process typically used for
    evidence collection or document production in the course of a legal inquiry, just
    specifically focused on electronic records and the particular needs and processes
    required for them.


    A is incorrect because although disclosure could pertain to handing over the evidence
    to the requesting authority pursuant to the Discovery order, it is not an official
    term used here.


    B is incorrect because a subpoena is a legal mechanism to compel the production
    and turning over of records, but it''s a more general term that isn''t specific
    to electronic evidence. It would, however, serve as the official legal way of
    compelling an eDiscovery process.


    C is incorrect because retention refers to storing and archiving of data for a
    period of time to meet regulations or policies.


    # 17. What vehicle will delineate the responsibilities for compliance and data
    collection pursuant to an eDiscovery request?


    A. SLA


    B. Contract


    C. Regulation


    D. SOW


    B. When dealing with possible eDiscovery in a cloud environment, where responsibilities
    are shared between the cloud customer and cloud provider, it is essential for
    the contract to outline responsibilities and the requirements for their completion,
    including time requirements.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'A is incorrect because service level agreement (SLA) is used to determine if
    contractual obligations are being met, based on agreed-upon metrics and requirements.


    C is incorrect because regulations play a key role in the scope and requirements
    of eDiscovery order; they are not a factor in how information is collected or
    the specific responsibilities for its collection.


    D is incorrect because a statement of work (SOW) defines the actual work to implement
    contractual requirements as well as the scope, but it does not relate to compliance
    with an eDiscovery order.


    # 18. Which type of report is considered for “general” use and does not contain
    any sensitive information.


    +   A. SOC 1


    +   B. SAS-70


    +   C. SOC 3


    +   D. SOC 2


    +   C. SOC 3 reports are very similar in approach and substance to SOC 2 reports,
    but they are designed for general use and do not contain any sensitive information.


    +   A is incorrect because SOC 1 reports are designed for restricted use, and
    only for internal staff, current customers, or auditors on behalf of regulators.


    +   B is incorrect because SAS-70 reports are actually deprecated at this time,
    but even in widespread use, they were considered restricted-use reports and were
    similar to SOC 1 reports.


    +   D is incorrect because SOC 2 reports, although more broad in substance and
    duration than SOC 1 reports, are still considered “restricted use” and not for
    public dissemination.


    # 19. Which of the following would NOT be used as input toward the gap analysis
    aspect of an audit?


    +   A. Customer feedback


    +   B. Stakeholder interviews


    +   C. Documentation review


    +   D. Audit testing


    +   A. Customer feedback, although very important to an organization, would be
    a factor in a gap analysis, because it would not have any impact on security configurations
    or their deviations from policy or baselines.


    +   B is incorrect because stakeholder interviews form an important part of an
    audit review and the gathering of information on processes, decisions, and implementation
    policies.


    Chapter 6: Legal and Compliance Domain

    199'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'C is incorrect because documentation review is a key component of an audit
    and gap analysis because it forms the basis for policies and regulations, as well
    as the specific implementations that an organization feels are prudent and should
    be in place.


    D is incorrect because actual audit testing is perhaps the most important part
    of an audit because it determines whether the configurations and controls in place
    actually match those documented in policy or regulation should be in place.


    20. Data is used by many different roles within an organization. Although all
    roles have the responsibility for protecting the data and conforming to any policies
    governing its use or access, which role is specifically responsible for determining
    the appropriate controls to be applied as well as appropriate use?


    +   A. Data custodian


    +   B. Data owner


    +   C. Data originator


    +   D. Database administrator


    B. The data owner is responsible for determining the appropriate controls for
    data, as well as ensuring they are applied and enforced. The data owner sets the
    policy for the use of the data, taking into account any regulations and policies,
    and oversees that the data is used appropriately within those rules.


    A is incorrect because the data custodian works with the data owner on appropriate
    use and processing of data. This is a technical role rather than a managerial
    role.


    C is incorrect because data originator is the role that creates the data, through
    a variety of means or processes, but is not responsible for overseeing or enforcing
    policy on its protection or appropriate use.


    D is incorrect because database administrator is a purely technical role that
    has a duty to follow and enforce policy but does not determine controls or appropriate
    use.


    21. Many processes are substantially different between fulfilling an eDiscovery
    request in a cloud environment versus a traditional data center. Which of the
    following concepts is a major factor within a cloud environment?


    +   A. Broad network access


    +   B. Measured service


    +   C. Elasticity


    +   D. On-demand self-service


    B. Measured service is a cloud concept in which a cloud customer only pays for
    the resources they are actively using and have allocated. This becomes an important
    concept when dealing with eDiscovery orders because substantial disk space may
    be needed to make copies of data or to preserve it, pursuant to the order. During
    the time the disk is being used, an organization could potentially incur substantial
    extra costs from the cloud provider, unless accommodations have been made via
    the contract.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'A is incorrect because broad network access pertains to the ability to access
    cloud resources of the public Internet, through a variety of different devices
    or clients. It would not have a significant impact on the fulfillment of an EDiscovery
    order.


    C is incorrect because elasticity pertains to the ability for a cloud environment
    to adjust resources as needed to meet the current demands of a service or system,
    either in an increasing or decreasing capacity. This is typically done via automated
    measures and would not be a significant factor in the successful fulfillment of
    an EDiscovery order.


    D is incorrect because on-demand self-service pertains to the ability of a cloud
    customer to automatically request and provision resources within a cloud environment,
    without having to involve the staff of the cloud provider. Although this may factor
    into the ability of a cloud customer to allocate additional resources to accommodate
    an EDiscovery order fulfillment, it would not be a substantial factor in it.


    # 22. Which type of PII will often have public disclosure requirements for any
    compromise of personal data?


    +   A. Contractual


    +   B. Jurisdictional


    +   C. Regulated


    +   D. Sensitive


    C. Regulated PII is data that is protected by law or regulation and carries with
    it the enforcement of the jurisdiction governing its use and protection. Most
    regulations also stipulate disclosure requirements that an organization must follow
    for the unauthorized or inappropriate release or compromise of PII information
    to the affected individuals.


    A is incorrect because contractual PII is data that has mandated protection requirements
    based solely on the contract between the cloud customer and cloud provider. This
    may have disclosure requirements as part of it, but not with the same force or
    requirements as regulated PII.


    B is incorrect because jurisdictional is not a type of PII protection. Regulated
    PII is applied to the jurisdiction level and is the most appropriate answer.


    D is incorrect because "sensitive" typically refers to data that has particular
    protection requirements or would be of high value for someone to obtain. However,
    it is not a specific type of PII, nor are there any specific and direct requirements
    for its use and protection.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '23. Which of the following laws is highly related to the preservation and retention
    of electronic records?


    +   A. HIPAA


    +   B. Safe Harbor


    +   C. SOX


    +   D. GLBA


    +   C The Sarbanes-Oxley Act (SOX) of 2002 pertains to the records publicly traded
    companies, accounting firms, and many other types of organizations must retain.
    It specifies not only the type of records that must be preserved but also the
    duration of retention.


    +   A is incorrect because the Health Insurance Portability and Accountability
    Act (HIPAA) of 1996 pertains to the protection of patient privacy and medical
    records. It is not focused on the preservation or retention of electronic records.


    +   B is incorrect because the Safe Harbor program was developed by the United
    States Department of Commerce for US companies as a way to bridge the privacy
    laws between the United States and the European Union and comply with the more
    strict requirements.


    +   D is incorrect because the Gramm-Leach-Bliley Act (GLBA) of 1999 is focused
    on how financial institutions handle the private information of individuals. It
    is not specifically focused on records retention or preservation.


    24. During an SOC 2 audit, the change management policies and procedures of an
    organization are evaluated. Which principle of the SOC 2 audit includes this evaluation?


    +   A. Security


    +   B. Privacy


    +   C. Processing integrity


    +   D. Availability


    +   A. The change management policies and practices of an organization are included
    as part of the security principle of the SOC 2 report. The change management principle
    pertains to how an organization determines what changes are needed as well as
    how they are approved, implemented, tested, and verified. The goal is to ensure
    that all changes are done in a methodical and controlled manner, with appropriate
    approvals and safeguards to prevent unauthorized changes.


    +   B is incorrect because the privacy principle does not have subcomponents.
    It is focused on how an organization uses, collects, and stores personal and private
    information, and it does so in a manner that conforms to the organization''s stated
    policy privacy as well as any pertinent regulations, laws, or standards requirements.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'C is incorrect because the processing integrity principle does not have subcomponents.
    It is focused on how an organization’s systems process information, and it does
    so in a manner that is accurate, verified, and done only by authorized parties.


    D is incorrect because the availability principle focuses on how a system has
    requirements and expectations for uptime and accessibility, and it is able to
    meet those requirements within parameters by contract or expectation.


    # 25. Which of the following is NOT one of the steps involved in the audit plan?


    +   A. Define objectives


    +   B. Remediation


    +   C. Define scope


    +   D. Lessons learned


    B. Remediation of any findings or deficiencies is handled after the completion
    of an audit, but it is not part of the actual audit. Although strategies for remediation
    are often discussed with auditors to ensure steps taken will satisfy the deficiency,
    the actual remediation of them is not part of the audit itself.


    A is incorrect because the lessons learned analysis is the first step in the formulation
    of the audit plan. The objectives take into account policies and regulations,
    as well as the risk acceptance level desired, in order to form the outline of
    the overall audit, including the purpose of the audit.


    C is incorrect because defining the scope of the audit occurs after the defining
    of objectives. The scope includes what exactly will be included in the audit,
    as well as how things will be tested. It serves as the official map for the audit
    and all the steps and processes that must be completed as part of it.


    D is incorrect because the lessons learned analysis is performed after the audit
    has been conducted. It represents the opportunity to review the audit and the
    steps taken to accomplish it, including the scope, and serves to refine audits
    and processes.


    # 26. ISO/IEC 27018 was developed to establish standards for privacy involving
    cloud computing. One of its key components specifies the type and frequency of
    audits. Which of the following represents the type and frequency of audits established
    under the standard?


    +   A. Independent, yearly


    +   B. Internal, every six months


    +   C. Independent, every six months


    +   D. Internal, yearly


    A. Under the ISO/IEC 27018 standards, audits should be completed by an independent
    entity that does not have any financial or management stake in the organization
    or application, and should be done at least yearly.'
  merge: -1
  img_proc: true
