- pgno: 52
  md: '# C. Overwriting


    # D. Zeroing


    A. Degaussing is as such would physically altering or removing the magnetic nature
    of storage hardware, and such would not be available within a cloud environment.
    This is due to resource pooling and multitenancy, as well as the dynamic nature
    of a cloud, where data can be moved and stored in different places constantly.


    B is incorrect because cryptographic erasure involves the destruction of the keys
    used to encrypt the data, and it''s available on any type of system. It is a very
    commonly used method within cloud environments for secure deletion of data.


    C is incorrect because overwriting involves writing over the sectors where the
    data was written and stored. Although this is trickier in a cloud environment
    based on the dynamic nature of data, overwriting may be available in situations
    where physical destruction of media would not.


    D is incorrect for the same reasons as overwriting, as zeroing is the same process
    but involves null values to data sectors.


    # 45. Which of the following types of threats is often made possible via social
    engineering tactics?


    # A. Data loss


    # B. System vulnerabilities


    # C. Advanced persistent threats


    # D. Insufficient diligence


    C. Advanced persistent threats occur when an attacker is able to gain access to
    a system and reside there for a long period of time without being detected. This
    is usually done to snoop on or collect information over time. It is often accomplished
    through social engineering tactics to gain access to valid and real accounts so
    that access can be performed without detection.


    A is incorrect because data loss refers to an organization losing access to data
    or the data becoming corrupted, without appropriate backups or means of access.
    This typically occurs due to hardware or system failure or due to the destruction
    or corruption of encryption keys.


    B is incorrect because system vulnerabilities can occur based on misconfigurations
    or poor patching practices; they do not involve the actions of a malicious actor.


    D is incorrect because insufficient diligence occurs when an organization has
    not properly planned a system deployment or migration, and therefore has left
    itself vulnerable to security threats.'
