- pgno: 56
  md: '# Cloud Data Security Domain


    Domain 2 is focused on the following topics:


    +   - The cloud data lifecycle

    - How storage systems differ between cloud hosting models

    - How to design security strategies for data protection within a cloud environment

    - The process of data discovery and how it relates to data classification

    - Privacy acts and how they relate to cloud environments

    - Data rights management and information rights management concepts

    - The identification and collection of even data within a cloud environment, and
    how to leverage and analyze it for business value and regulatory compliance


    As with any application or system, the data contained within is the most important
    and valuable aspect to a company or organization. Although many of the principles
    of data security and protection will be the same within a cloud environment as
    a traditional data data center, a cloud environment presents some unique differences
    and challenges.'
