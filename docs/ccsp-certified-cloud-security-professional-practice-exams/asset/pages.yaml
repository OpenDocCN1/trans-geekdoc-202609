- pgno: 3
  md: '# ABOUT THE AUTHOR


    Daniel Carter, CCSP, CISSP, CISM, CISA, is currently working as a senior systems
    engineer at Johns Hopkins University & Medicine. An IT security and systems professional
    for almost 20 years, Daniel has worked extensively with web-based applications
    and infrastructure, as well as LDAP and federated identity systems, PKI, SIEM,
    and Linux/Unix systems. He is currently working with enterprise authentication
    and single sign-on systems, including cloud-base deployments. Daniel holds a degree
    in criminology and criminal justice from the University of Maryland, and a master''s
    degree in technology management, with a focus on homeland security management,
    from the University of Maryland, University College.


    # About the Technical Editor


    Gerry Sneeringer, CISSP has been an IT professional with the University of Maryland
    for the past 30 years. He has been involved in customer support, systems programming,
    system administration (including the operation of one of the Internet''s root
    domain name servers), and network engineering. For the past 16 years, Gerry has
    been the head of security in the university''s central IT office. He currently
    serves as the university''s chief information security officer, overseeing the
    protection of university computing services hosted locally locally and in the
    cloud. Gerry holds a bachelor''s degree in computer science from the University
    of Maryland.'
  merge: -1
  img_proc: true
