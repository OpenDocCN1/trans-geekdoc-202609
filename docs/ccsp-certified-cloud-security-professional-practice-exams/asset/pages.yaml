    A. With any BCDR test, the main objective is to ensure the BCDR plan is designed
    to meet both the recovery point objective (RPO) and the recovery time objective
    (RTO) established by management.


    B, C, and D are incorrect. During a BCDR test, the overall costs are not considered
    part of the testing or plan. Downtime is provided as a similar concept to the
    RTO, but is not the best or correct response.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '29. What type of common vulnerability is exploited by sending commands through
    input fields in an application in an attempt to bypass application security?


    +   A. Cross-site scripting


    +   B. Cross-site request forgery


    +   C. Insecure direct object references


    +   D. Injection


    +   D. An injection attack is where a malicious actor sends commands or other
    arbitrary data through input and data fields with the intent of having the application
    or system execute the code as part of its normal processing and queries.


    +   A, B, and C are incorrect. Cross-site scripting is an attack where a malicious
    actor is able to send untrusted data to a user''s browser without going through
    any validation or sanitization process, or where the code is not properly escaped
    from processing by the browser. Insecure direct object references occur when a
    developer has in their code reference to something on the application side, such
    as a database key, the directory structure of the application, configuration information
    about the hosting system, or any other information that pertains to the workings
    of the application that should not be exposed to users or the network. A cross-site
    request forgery forces a client that has to authenticate to an application to
    send forged requests under the user''s own credentials to execute commands and
    requests that the application thinks are coming from a trusted client and user.


    30. What type of security testing testers who have knowledge of the systems, and
    in most cases access to the source code as well, and is performed offline systems?


    +   A. DAST


    +   B. SAST


    +   C. Pen


    +   D. RASP


    +   B. Static application security testing (SAST) is a method used to test and
    analyze the components of an application. It is considered "white-box" testing
    in that the people running the tests have knowledge of and access to the source
    code and systems involved.


    +   A, C, and D are incorrect. Dynamic application security testing (DAST) is
    considered "black box" testing of an application and is run against live systems.
    The people running the test do not have any special knowledge of the system. testing
    is typically a "black-box" test and is run in the same manner and with the same
    toolsets that an attacker would attempt to use against an application. Runtime
    application self-protection (RASP) is typically run against systems that have
    the ability to tune and focus their security measures based on actual environment
    variables and the particular attack methods being used against them.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '31. What type of software is often considered secured and validated via community
    knowledge?


    +   A. Proprietary


    +   B. Object-oriented


    +   C. Open source


    +   D. Scripting


    +   C. The most popular and widely used open source software packages have undergone
    extensive code review, testing, collaborative development, and scrutiny, which
    is not possible with proprietary software packages that are closed source and
    protected. With this level of scrutiny and the ability for any organization to
    evaluate and analyze the code from these packages, many consider them to be among
    the most secure and stable packages available in the industry.


    +   A, B, and D are incorrect. Proprietary software is closed source and not available
    for review or validation outside of the company that has created it, and as much
    would not be considered secure via community knowledge. Both object-oriented and
    scripting are types of coding and software development and do not depend on community
    knowledge for security.


    32. During which stage of the SDLC process should security be consulted and begin
    its initial involvement?


    +   A. Testing


    +   B. Design


    +   C. Development


    +   D. Requirement gathering


    +   D. Requirements gathering and feasibility is the first stage, and it is appropriate
    for security to be included as part of this stage. Security should be included
    at the project''s inception or at least from the very earliest stages to ensure
    proper controls and technologies are being used, as well as to ensure security
    is always considered with each decision made.


    +   A, B, and C are incorrect. The testing, design, and development phases of
    the SDLC all come after the initial requirements gathering phase, and as such
    they would be too late to involve involve security to ensure project success and
    objectives are met.


    33. What security concept does the letter R represent the DREAD threat risk model?


    +   A. Reversibility


    +   B. Reproducibility


    +   C. Redundancy


    +   D. Resiliency


    +   B. The R of the DREAD threat risk model refers to reproducibility, which in
    this case means a quantitative measure as to the ease and sophistication required
    to reproduce an exploit.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'A, C, and D are incorrect. Reversibility refers to the ability for a cloud
    customer to completely remove all data and services from a cloud environment,
    with assurance that the data has been securely and completely removed. Resiliency
    and redundancy both pertain to an application or service adjusting to problems
    or load issues to maintain an acceptable level of performance, but they are not
    related to the DREAD threat risk model.


    34. For security purposes, a university keeps its student and faculty data separated
    from each other within a system. What security concept does this strategy illustrate?


    +   A. Sandboxing

    B. Isolation

    C. Segregation

    D. Compartmentalization


    +   A. Sandboxing involves the segregation and isolation of information or processes
    from other information and processes within the same system or application, typically
    for security concerns. This is generally used for data isolation, as keeping different
    communities and populations of users isolated from others with similar data.

    B, C, and D are incorrect. Segregation, isolation, and compartmentalization are
    all similar concepts, but none is the correct term in this case.


    35. Which of the following would be appropriate to use in conjunction with an
    RSA token for a multifactor authentication system?


    +   A. Thumb drive

    B. Access card

    C. Password

    D. Mobile device code generator


    +   C. A password would be appropriate to use in conjunction with an RSA token
    for a multifactor authentication system because a password is something a user
    knows, whereas the RSA token represents something the user has. As such, they
    are factors of different categories.


    +   A, B, and D are incorrect. An access card, thumb drive, or mobile device with
    a code generator would not be appropriate to use in conjunction with an RSA token
    for a multifactor authentication system because each one is something a user possesses.
    Therefore, they are all the same type of factor.


    36. What is the recommended relative humidity level for a data center, per recommendations
    from ASHRAE?


    +   A. 40–60 percent

    B. 20–30 percent

    C. 50–70 percent

    D. 24–36 percent'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'A. The recommended relative humidity rate for a data center, the American Society
    of Heating, Refrigeration, and Air Conditioning Engineers (ASHRAE), is 40–60 percent.


    B, C, and D are incorrect. None of the other options available is the recommended
    humidity rate per ASHRAE.


    +   37. Which protocol allows for the use of storage commands over a TCP network
    rather than a physical connection?


    +   A. IPSec


    +   B. SCSI


    +   C. VPN


    +   D. iSCSI


    D. The most prevalent communications protocol for network-based storage is iSCSI,
    which is a protocol that allows for the transmission and use of SCSI commands
    and features over a TCP-based network.


    A, B, and C are incorrect. SCSI is used for storage commands and functions over
    a physical connection, not a network. IPSec is used for secure communications
    and encryption between two devices, and a virtual private network (VPN) is used
    to allow for secure connections and tunneling from public networks into a trusted
    zone.


    +   38. DRS is used for managing all aspects of clustered systems. Which of the
    following represents what DRS stands for?


    +   A. Dynamic resource state


    +   B. Distributed resource scheduling


    +   C. Distributed resource selection


    +   D. Dynamic resource scheduling


    B. Distributed resource scheduling (DRS) is used within all clustering systems
    as the method for clusters to provide high availability, scaling, management,
    and workload distribution and balancing of jobs and processes.


    A, C, and D are incorrect. None of the other options presented is what the acronym
    DRS stand for.


    +   39. Which strategy involves a fake production system to lure attackers in
    order to learn about their tactics?


    +   A. IDS


    +   B. Honeypot


    +   C. IPS


    +   D. Firewall'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   A. Honeypot is a system isolated from the production system but designed
    to appear to an attacker as part of the production system and containing valuable
    data. However, the data on a honeypot is bogus data, and it is set up on an isolated
    network so that any compromise of it cannot impact any other systems in the environment.


    +   A, C, and D are incorrect. An intrusion detection system (IDS) monitors for
    specific types of network signatures and then alerts staff to such instances,
    whereas an intrusion prevention system (IPS) can actively block such events, rather
    than just alerting about them. A firewall is used to block network traffic based
    on origin and destination IP addresses, combined with port and protocol.


    40. Which network protocol allows for the centralized administration and configuration
    of network settings for systems hosted within the network?


    +   A. DNS


    +   B. IPSec


    +   C. DHCP


    +   D. VLAN


    +   C. The Dynamic Host Configuration Protocol (DHCP) is used to assign an IP
    address and the associated network configuration settings to a system within a
    centralized administrative system, rather than having the settings for the host
    themselves.


    +   A, B, and D are incorrect. Domain Name System (DNS) resolves common names
    for servers, systems, or services to their associated IP address for network connectivity.
    IPSec is used for secure communications and network transmissions between two
    hosts. VLANs are used for segregating a physical network into logical networks.


    41. What type of management involves minimizing the impact of disruptions to services
    or operations?


    +   A. Incident management


    +   B. Problem management


    +   C. Continuity management


    +   D. Availability management


    +   A. Incident management is focused on limiting the impact of disruptive events
    on an organization and their services, returning their state to full operational
    status as quickly as possible.


    +   B, C, and D are incorrect. Continuity management, or business continuity,
    is focused on planning for the successful restoration of systems and services
    following an unexpected outage, incident, or disaster. The focus of problem management
    is to analyze and identify potential issues and to put processes and mitigations
    in place to prevent predictable problems from ever occurring in the first place.
    Availability management is focused on making system resources, processes, personnel,
    and toolsets properly allocated and secured to meet SLA requirements for performance.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '42. One approach to dealing with risk is often compared to taking insurance
    against risk becoming realized. What type of risk mitigation strategy does this
    refer to?


    +   A. Accept

    B. Avoid

    C. Mitigate

    D. Transfer


    D. Risk transfer is the process of having another entity assume the risk from
    the organization. One thing to note, though, is that risk cannot always be transferred
    to another entity. A prime example of transfer is the use of insurance policies
    to cover the financial costs of successful risk exploits; however, this will not
    cover all issues related to risk transfer because an organization can face nonfinancial
    penalties, such as the loss of reputation, business, or trust.


    A, B, and C are incorrect. Through risk mitigation, an organization takes steps,
    such as buying new systems or technologies, to prevent any exploits from happening.
    In an instance where the cost to mitigate outweighs the cost of accepting the
    risk and dealing with any possible consequences, an organization may opt to simply
    deal with an exploit if and when it occurs. Risk avoidance is when an organization
    opts to limit or remove vulnerable services or systems rather than taking another
    risk strategy


    43. An eDiscovery order typically encompasses data that fits within all of the
    following categories of an organization’s processes except which one?


    +   A. Possession

    B. Custody

    C. Control

    D. Creation


    D. Whether or not an organization is the creator of specific data is not one of
    the core components of what typically encompasses an eDiscovery order.


    A, B, and C are incorrect. An eDiscovery order typically encompasses data that
    is under the control, custody, or possession of an organization.


    44. Which United States program was designed to attempt to bridge the differences
    between US and European privacy requirements for the purposes of commerce?


    +   A. GLBA

    B. Safe harbor

    C. HIPAA

    D. SOX'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   B. The Safe Harbor regulations were developed by the Department of Commerce
    and meant to bridge the gap between the privacy regulations of the European Union
    and the United States. With the lack of an adequate privacy law or protection
    from the federal level in the US, European privacy regulations generally prohibit
    the exporting (or sharing) of personally identifiable information (PII) from Europe
    to the United States.


    +   A, C, and D are incorrect. The Gramm-Leach-Bliley Act (GLBA) is focused on
    PII as it relates to financial institutions. The Health Insurance Portability
    and Accountability Act (HIPAA) is focused on the security controls and for confidentiality
    of medical records. The Sarbanes-Oxley (SOX) Act regulates accounting and financial
    practices used by organizations.


    45. What type of reports are considered restricted and commonly used to detail
    the financial reporting controls of an organization?


    +   A. SAS-70


    +   B. SOC 2


    +   C. SOC 1


    +   D. SOC 3


    +   C. The SOC 1 reports are the effective direct replacement for the SAS-70 reports.
    They are focused specifically on controls for financial reporting. The SOC 1 reports
    are considered restricted-use reports in that they are intended for a small and
    limited scope of controls auditing, and are not intended to be expanded into greater
    use. They are focused specifically on internal controls as they relate to financial
    reporting.


    +   A, B, and D are incorrect. Although SAS-70 reports are very similar to SOC
    1 reports, they have been deprecated and replaced greatly on SOC 1 reports, and
    as this is not the best answer. SOC 2 reports expand greatly on SOC 1 reports
    and apply to a broad range of service organizations and types, whereas SOC 1 is
    only for financial organizations. SOC 3 reports are similar to SOC 2 reports in
    scope, design, and structure, with the main difference between SOC 2 and SOC 3
    being the audience they are intended for: SOC 3 reports are designed for public
    consumption.


    46. Which of the following represents the most commonly used metrics for risk
    categorization?


    +   A. Minimal, low, moderate, high, critical


    +   B. Low, medium, high


    +   C. Low, moderate, high


    +   D. Low, medium, high, critical


    +   A. The most commonly used metrics for risk categorization are minimal, low,
    moderate, high, and critical. The other options represent some but not all of
    the metrics


    +   B, C, and D are incorrect. commonly used for risk categorization.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '47. When forming a contract with a cloud provider, which of the following would
    not be a direct component of the actual contract?


    A. Definitions


    B. Incident response


    C. Metrics


    D. Uptime requirements


    +   ☑. Uptime (or availability) requirements are not typically a direct component
    of a contract with a cloud provider. The uptime and availability requirements
    would be a key component of the service level agreement (SLA).


    +   ☑ A, B, and C are incorrect. The contract should include agreed-upon definitions
    of any terms and technologies. How the cloud provider will handle incident response
    for any security or operational incidents, as well as how communication will be
    provided to the cloud customer, are key components of a contract. The contract
    will clearly define what criteria should be measured as far as system performance
    and availability are concerned, as well as the agreement between the cloud customer
    and cloud provider as how these criteria will be collected, measured, quantified,
    and processed.


    48. Modern systems and applications bridge many different services and systems.
    What is the overall management of an entire system commonly referred to?


    +   A. Holistic management


    +   B. Supply-chain management


    +   C. Comprehensive management


    +   D. Configuration management


    +   ☑ B. With the nature of modern applications being built on a myriad of different
    components and services, the supply chain of any system or application can rapidly
    expand to a scale far outside a single organization.


    +   ☑ A, C, and D are incorrect. The other options provided are similar-sounding
    terms but none is the appropriate answer for this question.


