- pgno: 108
  md: '# Comprehensive Answers and Explanations


    1. Data centers have components that are either internal or external redundancies.
    Which of the following is considered an internal redundancy?


    +   A. Generators


    +   B. Power feeds


    +   C. Power distribution units


    +   D. Building access points


    +   C. Power distribution units are internal to a data center. They distribute
    power to racks, internal chillers, and any other internal systems that need direct
    power feeds. Because they are completely internal to the data center, they are
    considered an internal redundancy.


    +   A is incorrect because generators are external to a data center and provide
    electrical feeds in the event of a utility outage. Because they sit outside of
    the data center and provide power inward, they are considered an external redundancy.


    +   B is incorrect because power feeds come from external utilities or generators
    and send electrical power into the data center. Because they originate from outside
    the center, they are considered external redundancies.


    +   D is incorrect because building access points provide staff access to internal
    layers of a data center from the outside. Because they provide external access
    to the data center, they are considered external redundancies.


    2. Limits within a cloud environment can be either hard limits or flexible capable
    of adjusting to current demands and circumstances. Which of the following concepts
    encapsulates allowing a limit to adjust to current circumstances, without the
    actual limit value changing?


    +   A. Loaning


    +   B. Borrowing


    +   C. Adapting


    +   D. Scaling


    +   B. Limits can be set as either hard or flexible within a cloud environment.
    When limits are flexible, rather than adjusting the actual limits when it is necessary
    to exceed them, the system allows customers or other systems to borrow resources,
    which are allocated to the customer or system in need. This maintains the actual
    limit in the system going forward, but allows for temporary expansion under certain
    circumstances.


    +   A is incorrect because the correct term is borrowing, not loaning.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'C is incorrect because the correct term is borrowing, not adapting.


    D is incorrect because the correct term is borrowing, not scaling.


    3. When dealing with a cloud environment that has resource pooling and multitenency,
    a cloud customer may want contractual assurances that sufficient resources to
    start and operate their services will always be available. What is this type of
    assurance?


    +   A. Limit


    +   B. Reservation


    +   C. Share


    +   D. Guarantee


    B. A reservation is a minimum resource level guaranteed to a customer within a
    cloud environment. A reservation can pertain to the two main aspects of computing:
    memory and processing. With a reservation in place, a cloud customer is guaranteed
    by the cloud provider to have at minimum the necessary resources available to
    power on and operate any of its services. In large cloud environments with numerous
    customers, this feature can be of particular importance in the case of denial
    of service attacks or high utilization of resources by other hosts and systems
    it offers a guaranteed minimum level of operations to all customers.


    A is incorrect because limits are put in place to enforce the maximum allowable
    utilization of memory or processing by a cloud customer. These limits can be done
    at either the virtual machine level or a comprehensive level for a customer. They
    are meant to ensure that enough cloud resources cannot be allocated or consumed
    by a single host or customer to the detriment of other hosts and customers. With
    cloud computing features such as auto-scaling and on-demand self-service, limits
    can be either hard (or fixed) or flexible and allowed to change dynamically. When
    typically, limits are allowed to change dynamically based on current conditions
    and consumption, it is done by "borrowing" additional resources rather than a
    change to the actual limits themselves.


    C is incorrect because the concept of shares within a cloud environment is used
    to mitigate and control customer requests for resource allocations in case the
    environment does not have the current capability to provide the needed resources.
    Shares work by prioritizing hosts within a cloud environment through a weighting
    system that is defined by the cloud provider. When periods of high utilization
    and allocation are reached, the system automatically uses the scoring of each
    host based on its share value to determine which hosts get access to the limited
    resources still available. The higher the value a particular host has, the more
    resources it will be allowed to utilize.


    D is incorrect because although the term guarantee sounds similar in concept to
    reservation, it is not the correct term being asked for by the question.


    CCSP Certified Cloud Security Professional Practice Exams

    94'
  merge: -1
  img_proc: true
