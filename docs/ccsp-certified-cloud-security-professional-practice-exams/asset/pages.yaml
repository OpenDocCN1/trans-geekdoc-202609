- pgno: 51
  md: 'A is incorrect because if a specific software version is required, this would
    limit the customer to only cloud service providers that offer that specific software
    and version. Depending on how specific or rare the required software version is,
    a cloud customer could be limited to a small number of cloud providers, or even
    to a single cloud provider.


    C is incorrect because application environments are required to run code and runtimes,
    and being dependent on a specific one can lock an organization into specific cloud
    providers. Depending on how specific or rare the required application environment
    is, a cloud customer could be limited to a small number of cloud providers, or
    even to a single cloud provider.


    D is incorrect because being regulations, especially ones specific to certain
    data, may dictate that specific cloud providers, or even a single cloud provider,
    must be used in order to maintain compliance.


    # 43. Within a cloud environment, which location would be the LEAST effective
    for a cloud customer to expect the implementation of security controls?


    +   A. Border perimeter


    +   B. DMZ


    +   C. Between the data and application zones


    A. In a traditional data center, the border perimeter of the network is a common
    place for security devices and controls to be implemented, to stop traffic of
    certain types or from origins from even getting to the IT systems within it. However,
    in a cloud environment, especially with multitenancy, the ability to place anything
    at a network perimeter will likely be completely impossible, and even if it is
    possible, will be extremely limited.


    B is incorrect because DMZ can still be implemented within logical network segmentations
    and virtual network devices in a cloud environment.


    C is incorrect because VLAN segmentation is available and heavily used to logically
    separate network within a cloud environment. Between VLANs would be an effective
    location for security controls or devices.


    D is incorrect because logical network zones can be created within a cloud environment
    and would be a very common and strategic place for security controls or devices
    to be implemented.


