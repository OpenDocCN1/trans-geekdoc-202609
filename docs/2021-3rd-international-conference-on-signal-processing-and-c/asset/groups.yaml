    **摘要：** 本研究展示了准确率达 98.30% 的胸膜分类识别。为了评估机器学习算法的有效性，将其分为来自肺癌诊断数据集中患者的临床和健康数据。我们根据患者健康数据开发并测试了多种与肺疾病相关的机器学习算法，旨在引导患者进行早期或早期检测方案。在不同参数下进行操作并实现了相应的成功水平。测试了多种算法以实现约
    98.30 的成功率。在所认可的算法中，*线性判别分析*（Linear Discriminant Analysis）提供了最有效的隔离过程。**关键词：**
    胸膜检测，机器学习与对比分析。


    血液或淋巴系统。“转移”术是指癌症扩散到身体其他部位。原发性肺癌生长在肺部，继发性肺癌始于身体其他部位，扩散并最终进入肺部。癌症有很多类型，并非所有类型都相同。胸膜癌是近期导致许多男女死亡的癌症。肺癌死亡的人数正在增加。四分之三的肺癌在扩散后才被发现。癌症每年杀死全球760
    万人，占所有死亡人数的 13%（世卫组织）。最常见的肺癌类型是小细胞和大细胞肺，根据它们在显微镜下的外观进行分类：小细胞肺癌（SCLC）和小细胞肺癌（NSCLC）。在人工智能的帮助下，研究人员已将机器学习用于医学分析。潘传全
    使用机器学习方法研究了中医学（TCM）临床试验中的疾病分类。


    # 引言


    肺癌是由人体内正常细胞的异常生长引起的。癌细胞在肺组织内不正常生长，它们会破裂并迅速生长在肌肉中。随着肿瘤生长并损伤向血液供应氧气的组织，它似乎并没有扩散。胸膜属于淋巴系统，通过淋巴结和胸腔释放淋巴液。肺部的正常淋巴结位于胸部中心，肺癌经常扩散至此。肺癌分为两大类：非小细胞癌和小细胞癌。根据其特征，它们被分为特定类型的肺癌。根据分类，肺癌有四种：I、II、III
    和 IV。肿瘤的大小、位置和方位被用于评估测量。最具致命性的危险组织通过血液或淋巴系统扩散全身。


    - 约 235,700 例肺癌病例（男性 119,600 例，女性 116,660 例）

    - 约肺癌死亡人数（男性 69,410 人，女性 62,470 人）

    这些数据基于 2016 年至 2021 年间诊断为 NSCLC 的的人群。


    非小细胞肺癌 5 年相对生存率表

    | SEER 阶段 | 5 年相对生存率 |

    | :--- | :--- |

    | 局部 | 63% |

    | 区域 | 35% |


    # III. 提出的方法


    本文所提方法的主要目的是通过机器学习算法提高肺-胸膜癌分期的准确性。


    - 1. 逻辑回归算法。

    2. 支持向量机算法。

    3. 决策树分类器。

    4. K-近邻算法。

    5. 线性判别分析。


    # A. 逻辑回归算法


    逻辑回归理论可用于解决二分类问题。Sigmoid 函数（也称为激活函数）是一个 S 型曲线，它可以根据实值在 0 到 1 之间变化，但并不直接限于这些范围。逻辑函数有助于我们确定对数几率（log
    or issues），被用于衡量概率。逻辑回归对默认类的概率（即输入 (X) 属于默认类的概率）$P(X) = P(Y = 1 | X)$。将逻辑回归应用于研究的数据，准确率为
    96.61%。


    # B. 支持向量机


    支持向量机（SVM）是一种快速且可靠的分类算法，在有限数据量的情况下优于其他算法。此外，损失是一种可以寻找分割点的方法。SVM 的学习问题对应于高维输入和标量输出
    $y$ 的某些未知且非线性依赖（映射函数）$y=f(x)$。。由于没有关于概率函数的信息，因此可以学习一种特征分布。$D(x,y) = X^T Y$，其中
    $t$ 代表训练数据对，且等于训练数据大小 $D$，此外，它被添加到 $d_i$ 中，其中 $d_i$ 代表（目标）值。支持向量机应用于研究的数据，准确率为
    96.61%。


    # C. 决策树分类器


    决策树的目的是通过基于一组数据表示决策规则，来测试一组数据规则或问题以预测目标变量的值。决策树的目的是提取信息。通过条件 4 中的 $H$ 方法计算熵。$Entropy(H)$
    是数据集 $S$ 内的不确定性程度，$S$ 是正在计算熵的当前集合；$C:[Gini]$ 是 $S$ 中的类集合。work 是 $C$ 中组件数量的结束。


