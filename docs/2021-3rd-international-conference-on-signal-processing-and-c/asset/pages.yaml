    **Abstract:** Identification of pleural carcinoma classification with 98.30% accuracy
    is presented in this work. To evaluate the effectiveness of the Machine Learning
    Algorithms, which is divided into clinical, and health data from patients who
    were part of the collection of lung cancer diagnostic data. We developed and tested
    various machine-learning algorithms associated with lung disease based on patient
    health data and to guide patients in early or early detection options. Operations
    are performed with different parameters and success levels are achieved. Various
    algorithms were tested to achieve success rates of approximately 98.30. Among
    the agreed algorithms, *Linear Discriminant Analysis* provides the most effective
    isolation process. **Keywords:** Pleural detection, Machine Learning and Comparative
    Analysis.


