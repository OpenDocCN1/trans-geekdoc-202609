    # INTRODUCTION


    Lung cancer is caused by the abnormal growth of normal cells in the body. Cancer
    cells do not grow normally within lung tissue, they break and grow quickly and
    muscle. As the tumor grows and damages tissue in ways that supply oxygen to the
    blood it does not appear to spread. The pleura is to lymphatic system, which releases
    lymph through the nodes and chest. Normal nodes in the lungs are located in the
    center of the chest, lung cancer often spreads. Lung cancer is divided into two
    main groups, non cell carcinoma and small cell carcinoma. These are assigned to
    certain types of lung cancer depending on their characteristics. According to
    categories, there are four types of lung cancer: I, II, III and IV. The size of
