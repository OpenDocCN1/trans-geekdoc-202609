    # E. Linear Discriminant Analysis


    In the way that key component analysis (PCA) and feature analysis of integral
    of variables better define data, LDA does. The LDA made a concert effort to distinguish
    between groups. The PCA, on the other hand, ignores analysis of performance on
    differences rather than similarities. Discrimination analysis is different because
    it is not a dependent process; it requires a distinction between dependent and
    independent variables. LDA approaches the problem by using the conditional probability
    density functions p(x|y=0) and p(x|y=1) are Normal with mean and covariance parameters
    (μ,Σ) and (μ'',Σ'').


    (x-μ)ᵀΣ⁻¹(x-μ)+ln(x-μ'')ᵀΣ''⁻¹(x-μ'')+ln|Σ''/|Σ|


    Linear Discriminant is applied and an accurate value of 99.30 obtained.


