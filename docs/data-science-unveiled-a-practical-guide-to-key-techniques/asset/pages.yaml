- pgno: 408
  md: '# The Concept of Gradient Descent


    Before delving into the mechanics of backpropagation, it’s essential to grasp
    the concept of gradient descent. Gradient descent is an optimization algorithm
    that iterates over the parameters of a function to find its minimum value. In
    the context of neural networks, this function is the loss (or cost) function,
    which represents the difference between the predicted outputs and the actual outputs.


    The gradient of a function at a particular point is the vector of partial derivatives
    of the function with respect to its parameters. It points in the direction of
    the steepest ascent. By moving in the opposite direction (the steepest descent),
    gradient descent seeks to reduce the function’s value—minimizing the loss in the
    case of neural networks.


    ```

    # Pseudo-code for gradient descent while not converged:

    compute_gradient(loss_function, parameters) = parameters - learning_rate

    * gradient

    ```'
