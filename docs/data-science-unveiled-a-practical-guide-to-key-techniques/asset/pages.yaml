- pgno: 244
  md: '# Descriptive Statistics


    Descriptive statistics serve as the foundation for data understanding and interpretation,
    summarizing key characteristics of datasets through a collection of measures and
    graphs without making assumptions or inferencing about the data.


    Measures of Central These include the mean, median, and mode, which inform us
    about the central or typical values within a dataset. The mean, calculated as
    the sum of all data points divided by the number of points, provides the arithmetic
    average. However, it is sensitive to outliers. The median, the middle value when
    the data points are ordered, is less affected by outliers and therefore provides
    a better central tendency measure for skewed distributions. The mode represents
    the most frequently occurring value in the dataset.


    Measures of These measures tell us about the spread of the data around the central
    values. The key metrics include variance, which is the average of squared differences
    from the mean, and standard deviation, which is the square root of the variance,
    providing a measure of spread in the same unit as the data. The difference between
    the maximum and minimum values, gives us a basic sense of dispersion. Quantiles,
    including quartiles and percentiles, divide the data into equal parts and further
    aid in understanding data distribution.


    An illustrative summary using Python’s popular pandas library demonstrates the
    ease with which one can compute these descriptive statistics:'
  merge: -1
  img_proc: true
