  md: '# Testing for Stationarity


    Detecting stationarity can often be challenging through visual inspection alone.
    Consequently, several statistical tests have been developed:


    Augmented Dickey-Fuller (ADF) tests for the presence of a unit root in a univariate
    time series. If the test statistic is less than the critical value, we reject
    the null hypothesis of a unit root, indicating stationarity.

    KPSS KPSS (Kwiatkowski-Phillips-Schmidt-Shin) test checks for stationarity around
    a deterministic trend. Unlike the ADF test, here the null hypothesis is that the
    time series is stationary.


    Let''s look at a simple example using the Augmented Dickey-Fuller test with Python:


    ```

