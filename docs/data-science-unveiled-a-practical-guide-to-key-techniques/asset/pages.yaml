- pgno: 506
  md: '# Ambiguity in Human Language


    One of the paramount challenges in NLP is the inherent ambiguity found in human
    languages. Ambiguity manifests in various forms—lexical, syntactic, and semantic—posing
    considerable hurdles for machines to interpret the intended meaning of the text
    accurately.


    Lexical when a word has multiple meanings. For instance, the word "bank" can refer
    to a financial institution or the land alongside a river. Syntactic about the
    structure of a sentence which can lead to more than one interpretation. An example
    would be "Visiting relatives can be annoying," where it''s unclear if relatives
    are visiting or if the act of visiting relatives is annoying.


    Semantic when the meaning of a sentence can be interpreted in different ways.
    For instance, "He saw the man with the telescope" can mean either using a telescope
    to see the man or seeing a man who has a telescope.


    Resolving such ambiguities demands contextual understanding and the ability to
    infer meaning from the surrounding text or external knowledge sources.'
  merge: -1
  img_proc: true
