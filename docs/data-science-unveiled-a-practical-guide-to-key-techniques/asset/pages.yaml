- pgno: 371
  md: '# Boosting


    Boosting refers to a family of algorithms that transform weak learners into strong
    ones. The fundamental concept behind boosting is to train a series of weak models,
    each correcting its predecessor, eventually converge to a highly accurate prediction
    rule. A ‘weak learner’ is a model that performs slightly better than random guessing.
    In contrast, a ‘strong learner’ is a highly accurate prediction model. Boosting
    sequentially applies the weak classification algorithm to repeatedly modified
    versions of the data, thereby producing a sequence of weak classifiers.


    One of the most prominent boosting algorithms is AdaBoost(Adaptive Boosting).
    The steps involved in the AdaBoost algorithm are as follows:


    +   Initially, assign equal weights to all instances in the training dataset.

    Train a weak learner on the dataset.

    Increase the weights of misclassified instances so that subsequent learners focus
    on difficult cases.

    Repeat the process for a specified number of iterations.

    Combine the weak learners into a single strong learner by weighting their individual
    predictions.


    The mathematical formulation of the final model in AdaBoost involves the sum of
    the weighted predictions of the weak learners, as shown below:'
