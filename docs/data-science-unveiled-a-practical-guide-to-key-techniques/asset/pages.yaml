    If the p-value is less than or equal to the significance level $\le$ the null
    hypothesis is rejected in favor of the alternative hypothesis. This outcome suggests
    that the observed effect is statistically significant and unlikely to have occurred
    by chance alone. Conversely, if the p-value is greater than the significance level
    $>$ is insufficient evidence to reject the null hypothesis, implying that any
    observed effect could be due to random variation.


    Low $\le$ indicates strong evidence against the null hypothesis, suggesting that
    the effect is significant.


    High $>$ indicates weak evidence against the null hypothesis, suggesting that
    the effect may not be significant.'
  merge: -1
