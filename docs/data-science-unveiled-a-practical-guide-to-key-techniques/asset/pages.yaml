- pgno: 19
  md: '# Types of Data


    Understanding the types of data is fundamental to mastering data science. Data
    can be broadly classified into quantitative and qualitative data, each with its
    unique characteristics and methods of analysis.


    Quantitative data is numerical and can be measured or counted. It is further divided
    into two subtypes: discrete and continuous data. Discrete data represent items
    that can be counted and are presented as whole numbers. Examples of discrete data
    include the number of students in a class or the number of cars in a parking lot.
    On the other hand, continuous data represent measurements and can take on any
    value within a range. Examples include height, weight, and temperature. These
    distinctions are crucial for selecting the appropriate statistical methods and
    tools for data analysis.


    Qualitative data, also known as categorical data, encompasses non-numeric data
    that can be classified into categories. This type of data is subdivided into nominal
    and ordinal data. Nominal data represent categories without any intrinsic ordering.
    Examples include names of cities, types of cuisine, or colors of cars. In contrast,
    ordinal data have a clear ordering or ranking but do not measure the exact difference
    between rankings. Examples include survey responses like "satisfied," "neutral,"
    and "dissatisfied," or educational levels such as high school, bachelor’s, and
    master’s degrees.


    To illustrate these concepts, consider the following examples encoded in a simple
    Python program:'
  merge: -1
  img_proc: true
- pgno: 20
  md: '```

    # Example of handling different types of data in Python # Quantitative

    data number_of_students = 30 # Discrete temperature = 36.6 # Continuous

    # Qualitative data cities = ["New York", "London", "Tokyo"] # Nominal

    satisfaction_levels = ["satisfied", "neutral", "dissatisfied"] # Ordinal of

    Students:, number_of_students) temperature) cities Levels:\nsatisfaction_levels

    ```


    The output of this program would be:


    Number of Students: 30

    Temperature: 36.6

    Cities: [''New York'', ''London'', ''Tokyo'']

    Satisfaction Levels: [''satisfied'', ''neutral'', ''dissatisfied'']


    In addition to understanding the different types of data, data scientists must
    also be adept at handling missing data, which can significantly impact the outcomes
    of data analysis. Strategies for dealing with missing data include imputation,
    exclusion, and using algorithms that support missing values.


    Furthermore, in the realm of big data and advanced analytics, structured and unstructured
    data play pivotal roles. Structured data, which adheres to a predefined format,
    is easily searchable, while unstructured data, which lacks a specific format or
    organization, poses more challenges in analysis but holds valuable insights.'
  merge: -1
  img_proc: true
