    of a non-stationary data series result = adfuller(data) Statistic: %f % result[0]
    %f % result[1]

    ```


    A typical output might look like this:


    ADF Statistic: 1.757188

    p-value: 0.998375


    In this output, a high p-value suggests that the null hypothesis of a unit root
