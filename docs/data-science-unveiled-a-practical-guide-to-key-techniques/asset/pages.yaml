  md: '# Hypothesis Testing in EDA


    One of the foundational aspects of Exploratory Data Analysis (EDA) is hypothesis
    testing, a statistical method that allows researchers and data scientists to make
    inferences about a population based on sample data.

    Hypothesis testing plays a pivotal role in EDA as it helps in decision-making,
    informs about the statistical significance of observed effects, and guides further
    research directions. This section deep-dives into the principles of hypothesis
    testing, its types, and the application in the context of EDA.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Understanding Hypothesis Testing


    Hypothesis testing starts with the formulation of two opposing hypotheses: the
    null hypothesis and the alternative hypothesis or The null hypothesis represents
    a statement of no effect or no difference and serves as the starting assumption
    for the test. The alternative hypothesis, on the other hand, represents a statement
    of an effect or difference.


    The essence of hypothesis testing is to determine whether the observed data provide
    sufficient evidence to reject the null hypothesis in favor of the alternative
    hypothesis. This decision is made based on a test statistic that quantifies the
    difference between the observed data and what would be expected under the null
    hypothesis. The significance of this difference is then evaluated against a predefined
    significance level typically set at 0.05 or 5%.'
  merge: -1
  img_proc: true
- pgno: 206
