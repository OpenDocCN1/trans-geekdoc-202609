    when the categories have an inherent order (ordinal data). With ordinal encoding,
    each unique category value is assigned an integer based on its order.


    For example, consider a column Size with three categories: Small, Medium, and
    Large. An ordinal encoding of these categories might assign 1 to Small, 2 to Medium,
