- pgno: 70
  md: '# 2. Imputation


    Imputation involves replacing missing values with estimates based on other observed
    data. Various imputation techniques exist, ranging from simple strategies, like
    mean or median imputation, to more complex methods, like k-nearest neighbors (KNN)
    imputation or Multiple Imputation by Chained Equations (MICE).


    Mean/Median Missing values are replaced with the mean or median of the observed
    values. Suitable for numerical data and when the data is MCAR. However, it can
    lead to biased estimations of variances and covariances. KNN Each missing value
    is imputed using the most similar observed values. The similarity is determined
    by the distance metric (e.g., Euclidean distance).


    A sophisticated method that models each variable with missing values as a function
    of other variables in a round-robin fashion. It is useful for dealing with both
    MAR and MNAR data.


    Considering a simple mean imputation example:


    ```

    # Assuming ''data'' is your DataFrame and ''age'' has missing values

    mean_age = data[''age''].mean() inplace=True

    ```'
  merge: -1
  img_proc: true
