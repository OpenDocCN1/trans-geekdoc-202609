  md: '# Handling Outliers in Data


    Outliers in a dataset are values that diverge significantly from the majority
    of the data. These aberrant observations can arise due to various reasons, including
    measurement errors, data entry errors, or genuine variations in the dataset. Outliers
    can greatly influence the outcome of statistical analyses and predictive modeling,
    often leading to misleading conclusions. Therefore, detecting and appropriately
    dealing with outliers is a crucial step in Exploratory Data Analysis (EDA).'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Detecting Outliers


    The first step in handling outliers is to identify them. There are several methods
    for detecting outliers, some of which include:


    Standard Deviation If the data is normally distributed, then around 68% of data
    values lie within one standard deviation of the mean, and about 95% are within
    two standard deviations. Data points that fall beyond these ranges can be considered
    outliers.


    Interquartile Range (IQR) The IQR is the difference between the third quartile
    (Q3) and the first quartile (Q1). Data points that fall below Q1 - 1.5 * above
    Q3 + 1.5 * often considered outliers.


    A visual method for detecting outliers. Points that fall outside of the whiskers
    of the boxplot are considered outliers.


    Data points with a Z-score (the number of standard deviations from the mean) above
    a threshold, typically 3 or -3, are considered outliers.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Handling Outliers


    Once outliers have been detected, the next step is to decide how to deal with
    them. The method of handling outliers heavily depends on the context and the nature
    of the data. Some common approaches include:


    Removing In cases where outliers are due to errors in data collection or entry,
    it might be appropriate to simply remove them from the dataset. Transforming Applying
    transformations (e.g., logarithmic, square root) can reduce the effect of outliers.


    Outliers are capped at a certain value, either the minimum or maximum value in
    the dataset or a value defined based on domain knowledge. Replace outliers with
    more representative values, such as the mean, median, or a value computed using
    regression or another predictive modeling technique.


    Example: Removing Outliers Using IQR Method


    Let''s walk through an example of detecting and removing outliers using the IQR
    method.


    ```

    # Python code example import pandas as pd # Example dataset data = {''Value'':
    [12, 15, -1, 100, 102, 50, 16, 17, 18]} df = pd.DataFrame(data) # Calculating
    Q1 and Q3 Q1 = df[''Value''].quantile(0.25) Q3 = df[''Value''].quantile(0.75)
    IQR = Q3 - Q1 Defining outliers outliers = df[df[''Value''] < (Q1 - 1.5 * IQR)
    | (df[''Value''] > (Q3 + 1.5 * IQR))] # Removing outliers df_cleaned = df[((df[''Value'']
    < (Q1 - 1.5 * IQR)) | (df[''Value''] > (Q3 + 1.5 * IQR))]

    ```'
  merge: -1
  img_proc: true
