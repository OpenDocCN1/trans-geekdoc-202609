    learn a probabilistic representation of the input data. Unlike standard autoencoders,
    VAEs model the latent representation as a probability distribution, typically
    Gaussian, thereby introducing randomness into the encoded representations. This
    approach not only aids in generating diverse and novel samples but also improves
    the robustness of the model.


    The key to VAEs lies in their loss function, which comprises two terms:


