- pgno: 515
  md: '# Characteristics of Time Series Data


    Time series data is fundamentally different from cross-sectional data. While cross-sectional
    data captures a snapshot at a single point in time, time series data tracks the
    same subject across multiple time periods, unveiling patterns or trends that occur
    over time. Key characteristics of time series data include:


    Temporal The value at a given time point is often dependent on previous values,
    indicating that the observations are not independent. This dependence is a crucial
    aspect to consider when modeling time series data. Many time series exhibit recurring
    patterns or cycles over specific intervals due to seasonal effects. Identifying
    and adjusting for seasonality is essential for accurate forecasting.


    Over long periods, time series data may show a general direction of movement,
    either upward, downward, or stationary. Recognizing a trend helps in understanding
    the overall behavior of the data.


    Random fluctuations or variability in the data that do not follow a discernible
    pattern are termed noise. This inherent volatility complicates analysis and prediction.'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# Stationarity


    One of the fundamental concepts in time series analysis is stationarity. A time
    series is considered stationary if its statistical properties, such as mean, variance,
    and autocorrelation, do not change over time. Stationarity is a desirable property
    because many analytical tools and models assume or require it. To assess stationarity,
    visual inspection of plots, statistical tests (like the Augmented Dickey-Fuller
    test), or both can be employed. If a series is found to be non-stationary, transformations
    such as differencing can be applied to achieve stationarity.'
  merge: -1
  img_proc: true
