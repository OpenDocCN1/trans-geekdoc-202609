- pgno: 320
  md: '# Understanding p-values


    A p-value is the probability of observing data at least as extreme as the data
    observed, under the assumption that the null hypothesis is true. It reflects how
    compatible the observed data are with the assumption that the null hypothesis
    is correct. Importantly, a p-value does not measure the probability that the null
    hypothesis is true; rather, it assesses the extent to which the observed data
    deviate from the predictions of the null hypothesis.


    The calculation of a p-value depends on the test statistic used, which in turn,
    is derived from the type of data and the specific hypothesis being tested. Test
    statistics could include the t-statistic in a t-test, the F-statistic in analysis
    of variance (ANOVA), or the z-score in a z-test, among others.'
