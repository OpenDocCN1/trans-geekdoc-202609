- pgno: 67
  md: '# Understanding the Nature of Missing Data


    Before delving into strategies for handling missing values, it is crucial to comprehend
    the nature of the missingness. Missing data can primarily be categorized into
    three types:


    Missing Completely at Random The likelihood of a data point being missing is the
    same across all observations. Here, the missingness of data is unrelated to the
    recorded or unrecorded values.


    Missing at Random The probability of a data point being missing is not uniform
    but is related to some of the other observed data in the dataset.


    Missing Not at Random A scenario where the missingness is related to the reason
    the data is missing. Here, the missing values themselves have information.


    Recognizing the type of missing data is critical as it influences the choice of
    technique to manage it.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Techniques for Handling Missing Values


    Several strategies can be employed to deal with missing values, each with its
    pros and cons. Choosing the right approach depends on the context of your data,
    the extent of the missingness, and the type of missing data (MCAR, MAR, MNAR).'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   1. Listwise Deletion


    One straightforward approach is Listwise where rows with any missing values are
    removed. Though this method is simple, it can lead to loss of data, especially
    if the dataset has a high percentage of missing values. Its use is only recommended
    when the dataset is large enough to withstand the reduction or when the missingness
    is MCAR.


    Original Dataset: 1000 rows

    Rows after Listwise Deletion: 800 rows'
