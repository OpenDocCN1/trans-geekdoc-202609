- pgno: 179
  md: '# Central Tendency: Mean, Median, Mode


    At the heart of univariate analysis lies the concept of central tendency, which
    gives us an idea of the average or most common values in our dataset. There are
    three primary measures:


    The average of all values in a dataset and is calculated by dividing the sum of
    all values by the number of values.

    The for the middle value when the data is arranged in ascending or descending
    order. If the dataset has an even number of observations, the median is the average
    of the two middle numbers.

