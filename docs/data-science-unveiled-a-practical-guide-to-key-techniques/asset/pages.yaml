- pgno: 437
  md: '# Overfitting and Underfitting


    One of the most predominant challenges in training deep learning models is avoiding
    overfitting while ensuring the model is not underfitting. Overfitting occurs when
    the model learns the training data too well, including its noise and outliers,
    making it perform poorly on new, unseen data. Conversely, underfitting happens
    when the model is too simple to capture the underlying structure of the data.


    techniques, such as and regularization, add a penalty to the loss function based
    on the complexity of the model. This discourages the model from becoming overly
    complex and memorizing the training data. is a regularization technique where
    randomly selected neurons are ignored during training. This encourages the model
    to learn more robust features that are useful in conjunction with many different
    random subsets of the other neurons. Data augmentation involves creating new training
    samples through random transformations of the existing data. This enhances the
    diversity of the training set and helps in reducing overfitting.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Vanishing and Exploding Gradients


    Deep neural networks often suffer from the problem of vanishing and exploding
    gradients, which greatly hampers their ability to learn. The vanishing gradient
    problem occurs when the gradients of the loss function approach zero, making the
    weights update insignificantly. Meanwhile, exploding gradients happen when the
    gradients of the loss function become too large, leading to divergent behavior
    in the weights update.


    Weight initialization of the network’s weights can alleviate these issues. Xavier
    initialization and He initialization are strategies that adjust the weights’ scale
    based on the number of input and output neurons, promoting a stable flow of gradients.


    Batch normalization normalizes the output of a previous activation layer by subtracting
    the batch mean and dividing by the batch standard deviation. This stabilizes the
    learning process and significantly reduces the problem of vanishing/exploding
    gradients.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# Optimization Challenges


    Finding the global minimum of the loss function in a high-dimensional space is
    another significant challenge. Deep learning models may get stuck in local minima
    or saddle points, where the gradient is zero but which are not the optimal solutions.


    Adaptive Learning Rate such as Adam, RMSprop, and AdaGrad adjust the learning
    rate during training. They help in navigating the optimization landscape more
    effectively by modulating the step size based on the historic gradient information.

    is a method that helps accelerate gradients vectors in the correct directions,
    thus leading to faster converging. It does this by adding a fraction of the update
    vector of the past steps to the current update vector.'
