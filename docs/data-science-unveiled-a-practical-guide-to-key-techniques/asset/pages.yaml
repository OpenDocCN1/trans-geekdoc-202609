- pgno: 373
  md: '# Bagging


    Bagging, which stands for Bootstrap AGGregating, is another ensemble method designed
    to improve the stability and accuracy of machine learning algorithms. It involves
    creating multiple copies of the original training dataset using bootstrap sampling,
    training a separate model on each copy, and then combining their outputs (either
    by averaging or voting) to make a final prediction. The most famous implementation
    of bagging is the Random Forest algorithm, which utilizes decision trees as base
    learners.


    The key steps involved in bagging are as follows:


    +   - Create multiple subsets of the original dataset with replacement (bootstrap
    samples).

    - Train a separate model on each subset.

    - Aggregate the predictions from all models to make a final prediction.


    The aggregation step typically involves averaging for regression problems or majority
    voting for classification problems.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Stacking


    Stacking, or stacked generalization, is an ensemble technique that involves combing
    various classification or regression models using a meta-classifier or a meta-regressor.
    The base level models are trained based on a complete training set, then the meta-model
    is trained on the outputs of the base level model as features. This approach allows
    the stacked model to learn how to best combine the predictions from multiple models.


    The general procedure for stacking includes:


    +   Splitting the training dataset into two disjoint sets.

    Training several base learners on the first part.

    Making predictions with the base learners on the second (validation) set.

    Using the predictions from the base learners as input features, and the correct
    responses as outputs to train a higher level learner.


    Here is a simple code example of implementing stacking:


    ```

    from sklearn.ensemble import StackingClassifier

    sklearn.linear_model import LogisticRegression from sklearn.tree import

    DecisionTreeClassifier from sklearn.svm import SVC # Define base

    learners base_learners = [(''dt'', DecisionTreeClassifier()), SVC())] #

    Define meta-learner meta_learner = LogisticRegression() #

    StackingClassifier stacked_model =

    StackingClassifier(estimators=base_learners,

    final_estimator=meta_learner)

    ```'
  merge: -1
  img_proc: true
