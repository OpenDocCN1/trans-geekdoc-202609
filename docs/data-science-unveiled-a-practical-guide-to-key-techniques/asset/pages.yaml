  md: '# Handling Categorical Data: Encoding Techniques


    Categorical data, often referred to as qualitative data, includes values that
    represent categories - for example, names of cities, types of cuisine, or product
    categories. While human analysts can easily interpret such data, most machine
    learning algorithms cannot directly handle categorical data. They require numbers
    as input to perform operations. This necessitates the transformation of categorical
    data into numerical format, a process known as encoding. This section delves into
    various encoding techniques, elucidating their applications, advantages, and potential
    drawbacks.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# One-Hot Encoding


    One-hot encoding is one of the most prevalent methods for converting categorical
    data into a numerical format. This technique involves creating new columns for
    each category of the variable, where each column corresponds to a category and
    contains binary values: 1 if the category is present, and 0 otherwise.


    Consider a simple example of a dataset with a categorical column Color having
    three categories: Red, Green, and Blue. Using one-hot encoding, we can transform
    this into three columns, each representing one color with binary values.


    ```

    import pandas as pd # Example dataframe data = {''Red'', ''Green'', ''Blue'',
    ''Green''}; df = pd.DataFrame(data) # Applying one-hot encoding encoded_df = pd.get_dummies(df,
    columns=[''Color''])

    ```


    | Color_Blue | Color_Green | Color_Red |

    |---|---|---|

    | 0 | 0 | 1 |

    | 1 | 1 | 0 |

    | 2 | 0 | 0 |

    | 3 | 0 | 1 |


    Although one-hot encoding is straightforward and highly effective for nominal
    categorical data (categories without intrinsic order), it can lead to high memory
    consumption and poorer model performance due to the addition of many columns,
    a situation often referred to as the "curse of dimensionality."'
  merge: -1
  img_proc: true
