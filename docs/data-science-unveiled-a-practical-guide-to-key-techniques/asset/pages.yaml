- pgno: 311
  md: '# Key Non-Parametric Tests


    Several non-parametric tests are commonly used in data analysis, each serving
    a different purpose, from comparing medians to testing for correlation without
    assuming linearity. Below is an overview of some of the most frequently employed
    non-parametric statistical tests:


    Mann-Whitney U Used to compare differences between two independent groups on a
    single, ordinal outcome variable. It is the non-parametric equivalent of the independent
    samples t-test.

    Wilcoxon Signed-Rank This test is utilized for comparing two related samples,
    matched samples, or repeated measurements on a single subject to assess whether
    their population mean ranks differ.

    Kruskal-Wallis H An extension of the Mann-Whitney U test for comparing more than
    two groups. It evaluates whether samples originate from the same distribution.

    Spearman’s rank correlation Used to measure the strength and direction of association
    between two ranked variables. Unlike Pearson’s correlation, it does not assume
    a linear relationship between the variables.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Advantages and Limitations


    The primary advantage of non-parametric statistics is their versatility. They
    can be effectively used with data of any level of measurement, be it nominal,
    ordinal, interval, or ratio. Furthermore, they are more robust against outliers
    and skewed distributions, thus providing a reliable alternative when parametric
    assumptions are violated.


    However, non-parametric methods are not without limitations. One of the chief
    drawbacks is that they generally have less power than their parametric counterparts.
    In other words, if the assumptions of parametric tests are met, then these tests
    can be more sensitive in detecting differences or associations. Additionally,
    non-parametric methods often provide less insight into the magnitude of effects
    or differences, focusing instead on the ranks of data points rather than their
    actual values.'
