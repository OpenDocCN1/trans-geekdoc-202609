  md: '# Resampling Methods


    Resampling methods are among the most straightforward and commonly used strategies
    to address imbalanced datasets. They adjust the class distribution of a dataset
    either by adding copies of the minority class (oversampling) or by removing instances
    from the majority class (undersampling).'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Oversampling the Minority Class


    One popular technique for oversampling is the Synthetic Minority Oversampling
    Technique (SMOTE). SMOTE generates synthetic examples of the minority class by
    interpolating between existing examples. The following pseudocode showcases the
    basic idea behind SMOTE:


    For each minority class sample x: Find its nearest minority class neighbors Select
    one of these neighbors y Generate a new sample on the line connecting x and y


    It is crucial to apply oversampling only on the training data to prevent information
    leakage into the validation or test sets.'
  merge: -1
  img_proc: true
