  md: '# Word Embeddings: Vector Representations of Text


    Word embeddings are a transformative approach in Natural Language Processing (NLP)
    that map words or phrases from the vocabulary to high-dimensional vectors of real
    numbers. The core idea behind word embeddings is to capture the semantic meanings,
    syntactic properties, and the relationships between words in a dense, low-dimensional
    vector space. This is fundamentally different and more efficient than traditional
    sparse representations like one-hot encoding, where the context and similarity
    between words are completely ignored.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# Understanding the Concept


    To truly appreciate the power of word embeddings, consider the example of one-hot
    encoding. In this traditional approach, each word in the vocabulary is represented
    by a vector where only one element is 1, and the rest are 0. The dimensionality
    of this vector equals the size of the vocabulary, leading to huge, sparse vectors
    for large vocabularies. This representation is not only memory inefficient but
    also fails to capture any form of semantic or syntactic similarity between words.


    Word embeddings address these limitations by representing words in a compact,
    dense vector space, typically of a few hundred dimensions. For instance, the words
    "king" and "queen" might be close to each other in the vector space, reflecting
    their semantic similarity.'
  merge: -1
  img_proc: true
- pgno: 477
  md: '# Generating Word Embeddings


    There are several methods to generate word embeddings, with Word2Vec, GloVe, and
    fastText being the most popular ones. These methods rely on the hypothesis that
    words occurring in similar contexts tend to have similar meanings.'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# Word2Vec


    Introduced by Mikolov et al., Word2Vec offers two architectures: Continuous Bag
    of Words (CBOW) and Skip-gram.


    In CBOW, the model predicts a target word based on context words surrounding it.

    Conversely, Skip-gram predicts context words from a target word.


    The objective of both architectures is to position words with similar contexts
    close to each other in the vector space.


    Consider the Skip-gram model represented by the following Python code snippet.


    ```

    from gensim.models import Word2Vec sentences = [["the", "quick",

    "brown", "fox", "jumps", "over", "the", "lazy", "dog\]] model =

    Word2Vec(sentences, vector_size=100, window=5, min_count=1,

    workers=4) word_vectors = model.wv

    ```


    Here, vector_size defines the dimensionality of the word vectors, window specifies
    the maximum distance between the current and predicted word, and min_count ignores
    all words with total frequency lower than this.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# GloVe: Global Vectors for Word Representation


    GloVe models leverage the entire corpus statistics to learn word vectors.

    The model aims to encode the probability of finding a word in a context in the
    structure of vector space, effectively capturing linear substructures of the word
    vector space.'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# fastText


    FastText, an extension of the Word2Vec model, treats each word as composed of
    character n-grams. This enables capturing the meaning of shorter words and allows
    the embedding of words not seen during training by summing the n-gram vectors.'
  merge: -1
