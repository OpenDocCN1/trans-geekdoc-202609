  md: '# Examples of p-value interpretation


    Let us consider a practical example where a researcher is testing whether a new
    drug is effective in reducing blood pressure more than the current standard of
    care. The null hypothesis states there is no difference in effectiveness between
    the new drug and the standard of care, while the alternative hypothesis suggests
    that the new drug is more effective.


    After conducting a statistical test, the researcher calculates a p-value of 0.03.
    Setting a significance level of $\alpha=$ the researcher compares the p-value
    to


    Since the p-value is less than the significance level, the null hypothesis is
    rejected, and the researcher concludes that there is statistically significant
    evidence to suggest the new drug is more effective than the standard of care in
    reducing blood pressure.'
