  md: '# Inferential Statistics


    While descriptive statistics outline the main features of a data sample, inferential
    statistics leverage this information to make predictions or inferences about a
    larger population from which the sample was drawn. Central to inferential statistics
    are the concepts of probability distributions, hypothesis testing, and confidence
    intervals.


    Probability Understanding the shape and characteristics of the distribution of
    a dataset is crucial. The normal distribution, or Gaussian distribution, is among
    the most important in statistics due to its natural occurrence in many phenomena.
    Characterized by its bell-shaped curve, it is fully described by its mean and
    variance.

    Hothesis This involves making assumptions or hypotheses about a population and
    then using sample data to support or refute these hypotheses. The key output of
    hypothesis tests, measures the probability of observing the sample data, or something
    more extreme, if the null hypothesis about the population is true.

    Confidence These are range estimates within which we expect the true value of
    a population parameter to fall, with a certain level of confidence. For example,
    a 95% confidence interval for the mean indicates that if we were to take 100 different
    samples and compute their confidence intervals, approximately 95 of those intervals
    would contain the true population mean.


    A constant companion in the journey of understanding and executing inferential
    statistical analysis is the which assesses the strength of the evidence against
    the null hypothesis. Its calculation typically assumes'
  merge: -1
  img_proc: true
