- raw: '## [THE PROSOCIAL ENGINEER](#Contents.xhtml#rch10)


    Throughout this book, we have explored the techniques of prosocial engineering
    and influence. From the words we speak to the tone we use, every aspect of our
    interactions with others can influence them toward our intended outcomes. But
    there is one more factor that can influence a person’s outcomes: the environment
    in which these interactions take place.


    Once you’ve explored how The Upper Hand promotes successful influence in your
    own interactions, you might start to notice how the same principles of human behavior
    shape how people interact in different spaces. Why is it that most people prefer
    certain paths in a park? Why do grocery stores stock candy in a specific aisle
    and at the checkout? Why does one friend’s house feel inviting while another’s
    manages to inspire dinners out at restaurants? Could a salesperson close more
    leads than another just based on having a “better” office?


    When it comes to design, we may not always be consciously thinking of how to put
    others at ease, but there are plenty of professionals, organizations, and companies
    considering it. Just as a stage sets the scene for a dramatic performance, the
    physical spaces we inhabit play a vital role in shaping human behavior. From the
    ambient lighting to the temperature of the air, environmental cues can subtly
    nudge people toward certain actions and decisions. In the hands of a skilled social
    engineer, the environment becomes another way to subtly guide a subject to a prosocial
    outcome.


    Make no mistake: social engineering is most powerful through communication—hence
    the “social” part. That being said, there is one mitigating factor that, while
    not as strong or dependable as The Upper Hand, can still impact the seamlessness
    of an interaction. Social engineering is all about influencing others, but it’s
    not always limited to one-on-one or even group interactions. Social engineering
    is all around us, and once you know what you’re looking for, you’ll see it in
    more places than you’d expect.


    ### Social Engineering and the Environment


    The modern world is designed through social engineering. The more we learn about
    how humans interact in the world, the more that knowledge informs environmental
    factors. Modern architecture, city planning, marketing and advertising, and interior
    design are all influenced by social engineering.


    Social engineering guides how people operate in most spaces. When we understand
    the core principles of common human behaviors, we can recognize how much social
    engineering is all around us, attempting to influence our everyday choices. From
    your favorite amusement park to your go-to convenience store, you experience subtle
    nudges toward one decision or another everywhere you go.


    One of the most famous examples of socially engineered environments exists in
    the Disney theme parks. In Orlando, the Magic Kingdom’s park design puts the customer
    experience first, going so far as to dig out and create a man-made lagoon that
    all guests must cross to move from the parking lot to the theme park. Guests are
    literally transported to a new land via boat or monorail, and that’s only the
    beginning.


    Once guests arrive at the Magic Kingdom, the first sight they see is a towering,
    glittering castle. The pavement is replaced with brick pathways. Scents of fresh
    popcorn and baked goods are pumped up into the streets through hidden vents. As
    far as they look, guests will struggle to find any modern technologies to distract
    them from their fantastical experience. They’re inside the magic now, and great
    pains were taken to ensure they’re not removed before they decide to leave.


    Magic Kingdom is broken up into five different lands: Main Street USA, Fantasyland,
    Tomorrowland, Frontierland, and Adventureland. Each is meant to fully envelop
    its guests, but for this to be effective, the park needed a way to separate them
    for both guests and employees. It would break immersion to see a Jack Sparrow
    on Main Street or a colonial woman strolling through the futuristic Tomorrowland.


    To stop mismatching employees from breaking immersion, the park designers built
    a series of underground tunnels called the Utilidors below the park. Employees
    can arrive at work, put on their costumes, and make their way to their land without
    seeing a single guest along the way. The tunnels are also perfect hidden passages
    for trash removal, delivery management, and shortcuts for emergency services.
    The guests see the fantasy while the Utilidors help with managing the park’s reality.


    The Magic Kingdom’s design hides its modern features for the sake of immersion.
    For example, each building on the park’s main entrance strip, Main Street USA,
    has an American flag at the top. However, if you look closely, you’ll notice none
    of the flags are real—each one is missing either a star or a stripe. That’s because
    the flags are faux decorations to hide the poles beneath them, which are actually
    lightning rods, there to protect guests from Florida’s surprise summer storms.


    The park is also famously efficient, though it hides it well. Main Street USA
    is built on a slight upward slope so that guests take their time moving toward
    the castle (and through all the shops) but hustle back down when it’s time to
    leave for the night. In every land, there’s a trash can about every 30 paces,
    which influences guests to toss their trash in the available bins instead of on
    the ground. These bins have pneumatic chutes under them that suck the trash down
    into the Utilidors for easy cleanup.


    Each Disney park, from Anaheim to Tokyo to Paris, is designed to influence guests
    to tap into their inner child. By putting the guest experience first, the Walt
    Disney Company sees larger returns from their guests. Adults are more likely to
    buy a giant sundae or a Mickey Mouse T-shirt when the world they’re in deems it
    socially acceptable. The Disney theme parks are a testament to modern social engineering,
    and they’re only improving their efforts as the science of influence grows.


    You don’t have to make the trip to a Disney park to see social engineering at
    work, though. There is proof of social engineering in your everyday life. Take
    your local grocery chain, for example: the store is designed to socially engineer
    a more pleasant—and therefore more lucrative—shopping experience.


    Most grocery stores take the principles of The Upper Hand into consideration when
    designing their store. A grocery store’s layout, music, lighting, and even the
    scents wafting through the aisles are proven influence factors for the average
    customer.^([1](#Notes.xhtml#ch10note1a)) The human drives for safety, connection,
    and self-identity protection are all accounted for in grocery spaces. The design
    considers the mind-body feedback loop and makes use of the fact that we, as humans,
    are our brains.


    The layout of a store can influence how safe a customer feels—are the aisles big
    enough for them to move freely? Are the exits clearly marked and easily accessible?
    Since the COVID-19 pandemic, many stores increased space between aisles to maintain
    social distancing. Some of us may not consciously notice these small safety factors,
    but our brains take note of how safe we are in any given space. The safer we feel,
    the more we can focus on shopping.


    Most grocery stores have spaces designed for communication and connection. Sometimes
    they’re free sample stands, where customers chat and snack with friendly customer
    service representatives. Other times, stores have entire community gathering areas.
    They’re often coffee shops, bars, or even small food courts within the grocery
    stores.^([2](#Notes.xhtml#ch10note2a)) These seating areas offer customers a place
    to catch up with neighbors or meet for a drink. Sometimes they double as spaces
    for demonstrations like cooking classes, seminars, and health fairs. They offer
    space for customers to stick around, spend more, and come back again.'
