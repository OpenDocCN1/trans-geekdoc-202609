- raw: 'Our growing awareness of negative influence makes it more difficult for these
    manipulators to function. High-pressure sales tactics are still widely used, but
    most people try their best to avoid pushy salespeople. The techniques might work
    in the moment, but they feel wrong to the person on the receiving end. And while
    some people willingly enter a situation where the salesperson is clearly manipulative,
    they proceed with caution, careful to avoid any attempts to trick them. As an
    example, people still visit psychics and fortune tellers, but many visitors go
    for entertainment. They’re well equipped to resist being duped. As for manipulation
    in the business world, perceived trustworthiness is still a tactic that works,
    but unless an individual or company can demonstrate consistent trustworthiness,
    they lose out on customers, sales, and deals.


    The more light we shed on our experiences with manipulators, the less shade they
    have to hide in. We can ensure we reap even better rewards by sticking to ethically
    sound, psychologically healthy forms of influence.


    There will always be bad actors who take advantage of other people. For every
    person who learns how to bring out the best in others, there will be someone who
    learns how to bring out the worst. However, if you look closely at the ones who
    rely on fear, coercion, and confusion, you’ll see the tiny cracks forming in their
    pillars of trust. It never takes long for those cracks to grow into fissures.
    It’s only a matter of time before their whole manipulative structure comes tumbling
    down.


    We can achieve even better outcomes by avoiding negative tactics and relying on
    prosocial engineering instead. By using the principles of The Upper Hand, we can
    ethically influence others by empowering their innate desire to cooperate instead
    of relying on ruses, manipulation, and coercion to get our way.


    Now, if prosocial engineering is so stable, why do people even bother using negative
    tactics to get what they want? Why bother building a complex, harebrained scheme
    when you could simply ask nicely for cooperation from other people? Why pretend
    to be trustworthy instead of actually *being* trustworthy? The simple answer,
    as we’ll discover in the next chapter, is that prosocial influence may be the
    more ethical option, but it’s certainly not the easier one.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 3](#Contents.xhtml#rch03)


    ## [OVERCOMING INFLUENCE MISCONCEPTIONS](#Contents.xhtml#rch03)


    Influencing others is easy—influencing others with only the best intentions and
    ethical motivations is harder. It requires you to get to know people. It requires
    you to tell the truth, always, even if the truth isn’t what others want to hear.
    And sometimes, it requires you to compromise on the best possible outcome for
    *you* and accept the best possible outcome for *everyone.*


    In the quest for successful influence, there will always be shortcut strategies
    that rely on manipulation, coercion, and domination. These can make The Upper
    Hand seem overly complicated, but that’s because the shortcuts don’t consider
    the wants, needs, and level of consent of the person being influenced.


    The caveat to shorter, more ethically ambiguous strategies is that *easy* doesn’t
    equal *right*, especially when it comes to fostering human connections. Like the
    glow that lures moths to a flame, these negative influence techniques often lead
    us astray, ultimately putting us—and the people we influence—in danger of being
    burned.


    Influencing others with shortcut solutions creates short-term results. This doesn’t
    always mean the influence takes less time—manipulations like long cons still take
    years to pull off. However, when someone sets in motion an influence strategy
    that relies on trickery, they also flip a proverbial hourglass. It’s only a matter
    of time before the target discovers they’ve been had, and when that happens, the
    resulting damage is irreparable. Their trust crumbles, which causes relationships
    to end, deals to fall apart, and reputations to disintegrate.


    Let’s pretend, for this example, you’re a real estate agent. A young couple hoping
    to buy their first home comes to you. Are you going to convince them to purchase
    the home that’s out of their budget so you can increase your commission? Are you
    going to persuade them that all the extra land, extra square footage, and expensive
    customizations on this house are worth stretching their wallets as thin as possible,
    all for a bigger commission check?


    It’s possible, even probable, for you to convince this couple to do what you want.
    You can influence them to act outside their own best interest by luring them in
    with the sparkling countertops and manicured lawn. But what does this decision
    do for you in the long run?


    Real estate agents rely on referrals. This couple might have friends, family members,
    or coworkers looking to move to the area. This one check might be huge, but if
    you choose to take advantage of these first-time homebuyers, you’re not likely
    to make a lasting relationship with them. They’re not going to recommend you to
    anyone they know, and they might even retaliate by leaving negative reviews for
    your firm. As first-time buyers, they’re likely to sell again as their family,
    financial status, and relationship grow. If you take advantage of them now, they’re
    not going to reach out to you when they’re ready to sell. By using short-term
    strategies to secure one deal, you risk costing yourself more deals in the future.


    The Upper Hand overcomes the most common flaws of traditional influence tactics
    by approaching interactions from the perspectives of everyone involved. This strategy
    for influencing others examines the long-term effects on relationships, ensuring
    continuous, genuine, and mutually beneficial collaboration. These techniques focus
    on enduring fulfillment, rather than small, fleeting victories secured through
    unsavory methods.


    If you, the real estate agent, decide to use The Upper Hand to close your deals,
    you put yourself in a position for greater success. You can approach this young
    couple with the intention of finding them the best possible starter home, knowing
    the whole way that your commission depends on closing. You start by getting to
    know them well—one is a painter, the other is a mechanic. They’re not worried
    about guest rooms or a large dining space, but they do want an open, airy floor
    plan to make their comings and goings feel more seamless.


    Instead of finding them the priciest lot in the neighborhood, you focus instead
    on finding a home with a large garage and a space that can easily serve as a studio.
    You show the couple comparable homes around them, letting them weigh their options
    alone and making yourself available to weigh in when they want your advice. When
    they settle on a home, you keep them in the loop throughout the entire buying
    process. They’re so thrilled, they leave you glowing reviews on multiple real
    estate sites, and every few months, they tag you as a recommendation online. The
    next year, you end up selling a home to their couple friends too.


    To some people, prosocial influence may seem like the obvious choice when it comes
    to cooperating with others. However, when your prosocial influence strategies
    take longer, require more effort, and pay off in smaller dividends, it grows harder
    to walk the straight and narrow path. Little white lies seem tempting. Small sidesteps
    into coercion feel all too easy. This is how the misconceptions about prosocial
    influence form—because too often, people start out on the right path but find
    themselves struggling to remember the right way isn’t always the easy way.'
