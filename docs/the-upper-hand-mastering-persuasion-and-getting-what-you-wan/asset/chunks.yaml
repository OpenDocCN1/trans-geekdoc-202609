- raw: 'It’s likely you and John share even more commonalities, perhaps a preference
    for cotton over tweed, or a favorite local cocktail bar. The more you and John
    connect over your commonalities, the more you can find: maybe you both live in
    the same city, you enjoy the same types of movies, or you have similar ideas for
    future business endeavors. You now have an opportunity to band together under
    a bespoke banner, all because you reached out and established a connection.


    If the other potential sellers in the room are also wearing well-tailored ensembles,
    you might need a more customized approach to create a tribe with John. Creating
    a tribe between *only* two people is most effective in scenarios where you want
    the other person to feel a special connection with *only* you. In this case, John
    may appreciate the chance to offer tailoring recommendations, but it’s also possible
    some of the other suits will chime in with *their* recommendations, strengthening
    the connection with the whole room, but weakening any potential bond between only
    you and John. Then your one-on-one conversation devolves into a group discourse
    around double-breasted blazers, and you lose your advantage with your potential
    customer.


    Instead of commenting on John’s suit, you can pivot to find a connection that
    only applies to the two of you in this situation. Here are a few rapid-fire examples:


    If you and John are the first to arrive at the meeting, you can create a tribe
    around valuing timeliness. “If you’re not early, you’re late, am I right?”


    If you and John meet by the coffee pot, you can create a tribe around your coffee
    preferences: “There’s a great coffee shop down on Main. Have you ever been? Their
    dark roast is unmatched.”


    If you and John appear to have absolutely nothing in common except the same quality
    of suit, you can make small talk until you find something to relate about: How
    was his drive in? (Does he drive a similar car to you?) How was his weekend? (Does
    he spend his weekends on the same activities as you?) Is he local, and how long
    has he lived here? (Are there any local spots the two of you can share stories
    about?)


    Eventually, it’s almost guaranteed you and John can form a tribe. In fact, if
    you practice this strategy with every person in the room, you’re bound to form
    a tribe with almost everyone individually, or as a group, just like the new boss
    in this chapter’s opening story. Humans have more in common with each other than
    we think, and creating a tribe is all about finding one commonality that both
    people find interesting, valuable, or unique. Doing so helps ebb the cortisol
    we sometimes feel when meeting someone new.


    Creating a tribe on a larger scale can be as simple as uniting a group under a
    single, simple banner for a short period of time. The best speakers open their
    talks with experiences or stories the audience can relate to. Coaches unite their
    players around a shared team identity and team objectives. Flight attendants bring
    together entire planes of people from different cultures, classes, and contexts
    by uniting them around the one thing they all have in common: wanting a safe flight
    to their destination.


    If you’re looking to create a tribe with a team before pitching a tough project,
    the best way to do so is by offering a shared experience right at the start. Bring
    in some breakfast for everyone and allow opportunities to bond over bagel preferences.
    Better yet, bring the team to a restaurant and create conversation around menu
    options. The more you share with your team, the more opportunities you have to
    align with them personally and professionally.


    Creating a tribe around shared interests like favorite foods, hobbies, or past
    experiences lays a strong foundation for collaboration. Interactions that foster
    connection on a personal level allow trust and camaraderie to grow, which leads
    to more opportunities for successful influence. As long as your efforts to connect
    with others are genuine, they can serve as powerful tools for beginning to gain
    trust and utilizing The Upper Hand.


    ### Finding Balance: Calibrating for Connection


    Successfully creating a tribe with another person requires you to strike a balance
    between offering a compliment, creating a connection, and passing judgment. If
    your attempt at creating a tribe is too subtle, the other person may simply think
    you’re offering a polite compliment, and the conversation skids to a stop with
    a small “thanks.” On the flipside, if you come on too strong, they may overlook
    your attempt to bond and instead consider your comment judgmental, which essentially
    ruins your chance to influence them.


    Compliments alone, when they’re sincere, aren’t tools for influence. The only
    goal of a sincere compliment is to let someone know you admire them, whether it’s
    for their outfit, their personality, or a choice they’ve made. Compliments rarely
    open the door to a conversation on their own. In some cases, a compliment can
    lead to a tribe-creation opportunity, but if that’s your goal when offering a
    compliment, the compliment isn’t sincere anymore.


    Be mindful of the kinds of compliments you offer. Complimenting someone’s appearance
    may seem like an easy start, but you never know how someone else feels about themselves,
    especially not right away. One man’s “doe eyes” are another man’s “beady bugeyes,”
    and you don’t make quick progress by accidentally pointing out a person’s sensitivity.
    That’s not to say you should never compliment someone’s appearance—it’s simply
    a riskier move to compliment someone’s complexion than it is to compliment their
    T-shirt.


    If you offer a sincere compliment to someone with whom you’d like to create a
    tribe, follow it up with a connection opportunity. This doesn’t diminish the genuineness
    of your compliment; instead, it expands your compliment into a conversation. Most
    of the time, a simple expansion around *why* you admire this particular trait
    enough to compliment it is opportunity enough. However, be careful using this
    approach, since clumsy wording may accidentally tip the connection scales out
    of your favor.


    Sometimes, compliments + context + delivery ≠ connection. Miscommunications and
    misinterpretations always have the potential to throw off your influence equations.
    When this happens, sincerity can appear as passive aggression, or even judgment.
    While this may not be your intention, if your interaction partner feels even slightly
    threatened, your window for influence starts sliding closed. Better to add more
    context than not enough.


    Like Goldilocks, we want to find a strategy for creating a tribe that feels just
    right, making sure our interaction partners feel valued, interested, and comfortable.


    Too subtle: “I like your T-shirt.” *Oh, thanks.*


    Too harsh: “I like your T-shirt. I always want to wear a nice band tee, but I’m
    always afraid I’ll feel underdressed.” *Um* … *does that mean you think I’m underdressed
    right now?*


    Just right: “I like your T-shirt. That band is one of my favorites—what did you
    think of their last album?” *Oh, thanks! I thought it was pretty good, but it’s
    a pretty big step away from their old music. What about you?*


    Striking a balance between offering compliments, building connections, and avoiding
    judgment is crucial to creating tribes with others. The door you open when you
    invite others to share a tribe with you must be as welcoming as possible. Meaningful
    connections create opportunities to align others both personally and professionally,
    paving the way for successful influence.


    Once you’ve got the other person on your side of the threshold, you can strengthen
    the bonds between you with the next practice of The Upper Hand, which covers deeper
    connection opportunities over shared goals, values, and beliefs.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 6](#Contents.xhtml#rch06)


    ## [SPEAK THEIR LANGUAGE](#Contents.xhtml#rch06)'
