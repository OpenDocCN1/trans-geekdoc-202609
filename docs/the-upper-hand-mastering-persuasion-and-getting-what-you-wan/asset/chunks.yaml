- raw: 'He managed to cinch a meeting with representatives from Super 8, but the interaction
    would be an uphill battle. First, Super 8 had stated they weren’t very interested
    in expanding internationally. Second, the idea of bringing franchising to China
    wasn’t necessarily novel—and it wasn’t something he could patent and hold back
    for another offer. Once Mitch presented the business plan, Super 8 could easily
    take his idea and enact it on their own, without him. And after sinking two months
    of time and effort—plus hefty expenses—into research to formulate the business
    plan, he *really* wanted to be the one to enact it.


    Super 8 could swindle the business plan, but Mitch had an ace up his sleeve too:
    he instinctively knew how to wield The Upper Hand. While Mitch didn’t know The
    Upper Hand by name, he did know enough about people—what they want, how they behave,
    and how to earn their trust—to wield it during this interaction.


    Entering the boardroom, Mitch’s hands felt clammy. He set down his materials on
    the conference table, slyly wiping his hands on his suit before shaking each Super
    8 representative’s hand. He made sure to ask for each individual’s name, even
    the minutes taker. Immediately after shaking hands, he quickly Created a Tribe
    (which we’ll cover in more detail soon) with the whole room, making a quip about
    how there were no wet noodles in the room—everyone had strong handshakes, which,
    he suggested, was a good omen.


    Mitch felt a bit lighter seeing smiles and smirks around the room at his comment,
    and he transitioned into presenting his slide deck. He showcased his expertise
    by presenting his work with other similar mid-tier brands, using the technique
    of Speaking Their (Super 8’s) Language. He didn’t suggest Super 8 would become
    the next Hilton or Four Seasons—they would remain a dependable, budget-friendly
    option for consumers in the States—and that’s exactly the brand image they would
    retain abroad. In fact, Mitch pointed out, it was an advantage to be a budget
    chain to break into the hotel market in China, since many of the country’s independent
    motels had low price points.


    The Super 8 team members shifted in their seats. Mitch wasn’t sure if it was out
    of interest or boredom, but they were all looking at his slides. Occasionally
    a rep would glance at the printed version of his pitch deck in front of them.
    The only other noise in the room was the scribbling of a pen—the notetaker keeping
    the minutes.


    Mitch forged ahead, addressing the elephant in the room: his lack of direct experience
    in hotels. This was what he figured would be Super 8’s biggest concern when it
    came to partnering with him. He metaphorically Pantsed Himself by admitting the
    obvious drawback to him leading the project. However, he told the room, he knew
    the Chinese market better than anyone else they could hire, and his business plan
    proved he was more than capable of learning the ropes. He spoke about how he preferred
    honesty and reliability in his business relationships, and admitting his lack
    of direct experience was part of that mindset.


    When he reached the final slide in his presentation, everyone was leaning forward.
    Then the screen went black, and the notetaker hopped up to flick the lights on.
    The body language around the room seemed to indicate a positive response to Mitch’s
    proposal, but it was too soon to make the ask. He knew to squeeze too hard, and
    ask for a “yes” immediately, would backfire. He used Hold, Don’t Squeeze, and
    backed off, instead trying a completely different route from what most people
    would use.


    “Guys, listen,” Mitch said, “I’m either going to leave here today with a signed
    letter of intent, or I’m going to leave this plan here as a gift to you.”


    The Super 8 reps exchanged surprised expressions. One opened his mouth to speak,
    then closed it, frowning. No one quite knew how to respond—it’s not every day
    an entrepreneur makes a pitch, defends its probability of success, and then offers
    to give it away for free. Was this some sort of trick?


    Mitch saw the unspoken question hanging in the air. It was time to squeeze, just
    a little.


    “Don’t get me wrong—I want to lead this project,” he clarified. “I know I’m the
    one who can make it happen. But I want to see this brand in China whether I introduce
    it or not. Franchising is part of China’s future. Economy hotel chains are part
    of China’s future. This plan proves it.”


    The Super 8 team shared another round of glances before one representative spoke.


    “Mitch, I have a feeling you’ll leave with a signed letter of intent,” he said,
    tearing a piece of legal paper off its pad. He clicked his pen. “Let’s discuss
    what that letter says. Take a seat.”


    By the time the meeting ended, Mitch had a signed letter of intent. Within a year,
    he secured the rights to build up Super 8 hotels in China. Within five years,
    under Mitch’s supervision, Super 8 grew into one of the largest economy chains
    in the country.^([1](#Notes.xhtml#ch01note1a)) It was a long-term, mutually beneficial
    outcome for both parties.


    When I interviewed Mitch about his story, I noticed his attitude toward Super
    8 differed from how many people think about influencing others. Many people assume
    getting what they want is a zero-sum game, and so to influence is to engage in
    a battle that will result in winners and losers. Yet Mitch’s viewpoint was and
    is different.


    “This isn’t misdirection. It’s not deception. It’s curation,” Mitch told me. “I
    didn’t go into the deal trying to prove who was right and who was wrong … we’re
    both right by the end.”


    Mitch wasn’t trying to “beat” the Super 8 boardroom—he wanted them to cooperate.


    Back in 2003, Mitch didn’t have much leverage, but he knew how to build trust,
    connect with others, inspire confidence, and gauge his own pressure. Wielding
    The Upper Hand isn’t magic—it taps into the same principles of influence and persuasion
    humans have used for millennia. The difference is the techniques of The Upper
    Hand make the framework act more like a hand of guidance than a hand of force.


    Business deals often feel like mind games, but we don’t have to resort to cutthroat
    strategies or dishonest tactics to seal a deal, raise capital, or win contracts.
    Understanding the science behind effective influence can help anyone gain The
    Upper Hand in any interaction, whether that’s closing a deal, convincing grandma
    to give up driving, or having an excellent first date.


    Gaining The Upper Hand in any interaction is not about exploitation or leveraging
    force but rather establishing trust and engaging the human instinct to cooperate.
    Understanding the foundational principles of human behavior will empower you to
    navigate both personal and professional situations effectively, creating interactions
    where everyone wins.


    ### Deconstructing the Myth of Influence


    There is a motto where I work: “Leave others feeling better for having met you.”


    As the Director of Education at Social-Engineer LLC, I follow the company’s motto
    in all my work. Our CEO, Chris Hadnagy, set up this motto to be a guiding light
    in the world of influence and social engineering. Our engineers reveal system
    and security weaknesses for clients by using manipulation, coercion, and high-pressure
    tactics—all methods The Upper Hand avoids. When you spend half your days pretending
    to live on the dark side of social engineering, it can be tough to find your way
    back to the light. Chris’s motto helps keep everyone at Social-Engineer aligned
    with an ethical approach to their duties.


    When you dive into the world of social engineering and influence, there are temptations
    everywhere. Securing the “yes” through ethical, meaningful, and mutually beneficial
    means can feel tedious. If you’re not laser-focused on maintaining morality, it’s
    all too easy to slide into manipulation. When the time comes to choose between
    prosocial influence or coercion, I find myself repeating: “leave others feeling
    better for having met you.”'
