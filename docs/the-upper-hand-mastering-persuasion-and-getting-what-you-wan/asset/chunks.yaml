- raw: 'On the flip side, speaking the same language also means knowing when to hold
    back, resisting the urge to challenge another person’s worldview. I struggle with
    this myself when I speak to people who don’t believe in evolution, because I am
    a staunch believer in the overwhelming scientific evidence supporting evolution.
    However, I have had a few occasions where I worked with creationists. In these
    situations, if the topic arises, I don’t blindly agree, as that would be disingenuous
    of me, but I also don’t verbally attack the person in front of me. Doing so would
    only put them on the defensive, which does nothing to make either of us feel valid.
    Instead, I do not bring up the topic unless directly asked. When asked, I simply
    present the science, citing the peer-reviewed text and evidence that have influenced
    my knowledge.


    Remember, the brain is more comfortable validating its currently held beliefs.
    If you try to change someone’s entire moral code over a cup of coffee, the coffee
    might end up all over your clothes. You don’t have to agree with someone on every
    concept to connect and collaborate, or to influence them. You must simply share
    a basic understanding that as long as your conflicting ethical values don’t affect
    your shared goal, you still have an opportunity to work together.


    When you set out to speak someone’s language, you must tread carefully. Hold back
    from making an attempt until you’re comfortable with the amount of information
    you know about them. If someone mentions their kids, don’t assume their whole
    identity is being a parent. If someone brings up their favorite politician, make
    a note not to trample on their opinions, but don’t write them off as an extremist.
    If what they say is intriguing to you, speak their language by asking about it.
    If it’s not interesting to you, or you sense you won’t agree, don’t follow that
    thread of information. As long as you stay respectful, authentic, and cooperative,
    there will be other parts of their self-identity you can connect with authentically.


    Speaking their language allows people to identify as part of the same in-group.
    And when two people feel they are part of the same in-group, they are more likely
    to be receptive to one another. In a business environment, setting aside time
    to speak the same language as potential partners, customers, and stakeholders
    increases the odds of them feeling connected to you, which improves your odds
    of success. Cold calls, sales, and negotiations can be tough because they don’t
    utilize any sort of identity sharing (or if they do it’s often disingenuous).
    But when you present yourself as a trustworthy face in a sea of strangers, your
    influence job becomes easier.


    ### How to Investigate, Validate, Relate


    We can break down how to speak someone’s language into three parts: investigate,
    validate, and relate. When I interviewed with Northampton, I did much of the investigation
    before the meeting started. Then it was fairly easy to validate and relate during
    the interview. However, with strangers, or when meeting with new people, you’ll
    likely have to spend a bit more time investigating before you can validate and
    relate—a.k.a. speak their language.


    Let’s break down an instance of one entrepreneur using this tactic to eventually
    secure a pitch meeting.


    Two businessmen, we’ll call them Freud and Darwin, are seated next to each other
    at a networking event in New York City. Freud is an entrepreneur looking to secure
    funding for his next project. Darwin is a venture capitalist hoping to invest
    in emerging tech. While the two wait for the day’s events to begin, Freud turns
    toward Darwin and strikes up a conversation.


    “Beautiful morning, isn’t it?” he says, nodding toward the sunlight streaming
    through the tall windows behind them.


    “Yes, it is,” says Darwin.


    Freud follows up: “Are you here visiting, or are you a New York local? Your accent
    suggests you’re not from around here.”


    “Indeed,” says Darwin, “I moved here several years ago. It’s a little crowded,
    but at least the park is quieter this time of year, and there’s not as many gray
    days as in London.”


    “Oh, wow. I love London—I lived there for a time. Beautiful city. Great pubs.”


    “I do miss a pub. They’re not the same here. Too posh.” Darwin pauses and studies
    Freud. “So, what brings you to the conference, then?”


    “Oh, you know, same as most people—looking to connect with other entrepreneurs
    and funders. What about you?”


    “Ah, go on then,” Darwin says, raising his eyebrows. “Don’t hold back now, let
    me hear about your big idea.”


    “Oh, well,” Freud replies, “it wouldn’t be fair of me to blab on about myself
    until I hear what sorts of ideas you invest in.”


    Darwin gives a bemused look. He explains succinctly that his fund is interested
    in lifesaving tech.


    “Oh, like medical devices, or bio-hacking breakthroughs, or …?” Freud queries.


    “Any of those and more, I guess,” Darwin says with a shrug. “Whatever has a good
    chance of saving lives.”


    “Huh,” Freud says. His big idea is a gaming app for adults with addiction. The
    clinical trials showed promising results, but they need investors to run a bigger
    trial and help lobby support from health insurance companies. But before he reveals
    this, Freud wants to know more about Darwin’s self-identity and worldview, his
    “language.”


    “That’s very noble of you,” Freud says. “Can I ask why or how you got into that
    area? Most of the VCs I’ve met so far are more concerned with numbers and returns.
    Not that I blame them. That’s important too.”


    “Well, of course,” Darwin says. “We can’t fund anyone if we don’t have any funds
    to begin with. But as to your question about how I got into the field …” Darwin
    then explains a personal experience that inspired him to follow his passions and
    invest in lifesaving tech. Freud nods along, paying sharp attention to the information
    Darwin shares.


    The lights in the auditorium flash twice, signaling the session is about to begin.


    “That’s really cool,” Freud acknowledges. “Looks like we’re about to start here—but,
    if it’s amenable to you, I’d love to grab lunch and talk further, or set aside
    time to pitch to your firm. In short, I’m building tech to help addicts recover.
    And now that I have some more information on what sorts of ideas you’re investing
    in, I think it could be worthwhile to talk.”


    “Doesn’t sound like a bad idea,” Darwin hedges.


    “You know,” Freud sighs, as the lights dim and the crowd around them quiets, “saving
    lives is pretty important to me and my company too.”


    “Alright, yeah. Let’s talk,” Darwin agrees.


    Let’s break down this conversation, specifically Freud’s line of questioning.
    The two men went from total strangers to potential business partners in the span
    of a few minutes. First, Freud took a swing at creating a tribe by pointing out
    the nice weather. It didn’t work to crack open the conversation, so he followed
    up with another common question that could draw the two into a tribe: Where are
    you from? When Darwin revealed a new detail—that he previously lived in London—Freud
    was able to connect to that piece of information.


    Note: Freud could have picked up a thread of conversation regarding New York City,
    and there’s no saying which option is better or worse. However, when attempting
    to create a tribe (and then speak their language) it is more effective to connect
    over what feels more authentic to you first.'
