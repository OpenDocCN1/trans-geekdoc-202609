  trans: '


    你可以在互动结束后、在合适的时间地点识别出自己的情绪体验。采取这一步可以避免对你的情绪调节过程产生负面影响。如果你压抑了情绪反应而不稍后进行处理，就有损害你自我信任的风险。当时将情绪暂时“搁置”起来是可以的，但如果你永远忽略它们，你的架子最终会变得杂乱无章。当那些有用的物品被积压的情绪阻挡时，想要把它们拿下来就会变得困难。


    一旦你在互动之外有了空闲，就进行一次自我评估——一次“整理架子”——以重新调整你的自我信任。例如，让我们想象这样一个互动：你的朋友宣布她要和一个你无法忍受的男人结婚。你过去告诉过她你对那个男人的看法，有时她似乎能理解你的观点，但她最终总是会回到他身边。当你听到这个消息时，你当时把失望搁置了并祝贺了她，但现在你不确定自己是否做出了正确的选择。


    你可以问自己一些自我评估的问题来更好地理解状况。既然你已经搁置了情绪，未来与这位朋友的互动会变得更加困难吗？你是否计划在以后更合适的日期处理你架子上的东西？当你离开那个互动后，你的情绪反应现在感觉还那么强烈吗，还是说环境引起了比预期更强烈的反应？


    在这种情况下，隐藏你对朋友新未婚夫的感受 `could` 影响未来的互动。因此，你意识到你 `do` 需要处理你的感受，但你相信她的宣布并不是做这件事的正确时机。现在你已经花了一些时间思考这个想法，你知道你的情绪反应源于对朋友未来幸福的真正担心，而不是对她未婚夫的无理厌恶。你决定，你当时的情绪反应是有效的，你决定将其搁置起来也是如此。


    现在你已经处理了你的观点和情绪反应，你可以决定如何进展了。你设定了一个时间与朋友见面，并你对她的忧虑。然而，你不是冲动地通过抗议或抱怨做出反应，而是形成一个同理心的询问，这要么让你对朋友的选择感到自信，要么帮助她意识到某些需要与未婚夫解决的问题。无论如何，结果都是你朋友的幸福——但如果你根据本能做出反应，结果可能是你们友谊的终结。


    ## 在外外


    对意外的离题最好的反应就是不反应。你越能表现得不为为、专注且不经意，就越能增强自己的影响力。然而，保持稳健的扑克脸需要对情绪调节技巧有强大的掌握。


    如果你能限制任何传播气质突然变化的非语言信号，你更有可能保持 `The Upper Hand`（占据主动）。克制住通过揉搓脖子、脸部或手臂等手势自我安抚的冲动。尽量不要抖腿、挪动脚或调整姿势。将你的注意力从自己的情绪转移到和你互动的人的情绪上——这将帮助你镜像他们的非语言信号，而不是通过自己的信号让任何人察觉。


    留出你需要的时间，对触发你搁置情绪的原因做出理性的、有策略的回应。你可以通过一系列深呼吸来帮助你的情绪调节过程。当你让自己回到冷静、平衡的状态时，你的停顿将是力量的。房间里的其他人不需要知道你正在平复心情——他们可能认为你像挥舞着自信旗帜一样利用这种停顿。


    当你努力重新获得情绪平衡时，你可以权衡未来的各种选择。处理你的忧虑的风险与搁置它的回报相比是什么？如果你选择搁置它，这些信息在进一步的互动中有什么用？如果你在朋友宣布订婚后转身逃跑，你就有让她对生气的风险。然而，如果你选择稍后处理你的忧虑，你可以重启过去关于她那个有问题的未婚夫的话题，并增加婚礼——以及婚姻——这一分量让她去考虑。


    让沉默在你和互动伙伴之间留存可能会感到不舒服，但有时沉默对你有利。如果触发你的的言论是无礼的、冒犯的或错误的，让它像有毒云一样悬在空中，可能会导致说这句话的人自我纠正。当你希望从他人那里获取信息时，沉默也是有效的——人们在长时间的沉默中感到不安，通常会用有价值的信息来填充。


    搁置情绪是保持互动处于正轨的一项宝贵练习。`The Upper Hand` 需要一些策略，但培养情绪智能技能也至关重要，这样你就能实时适应各种惊喜。然而，正如所有的
    `Upper Hand` 原则一样，`Shelve It`（搁置它）练习并不是万能的解决方案。在某些情况下，搁置情绪实际上是 `wrong`（错误）的。如果你的目标是与他人进行合乎且有意义的合作，那么可能会出现时刻，让你的反应自由流露是实现这一目标的唯一方法。


    ## 何时忽略架子


    人们多久会读错你的名字？似乎无论某个人的名字听起来多么简单，总有人会读错。我的一个朋友 Corrine 把她的名字读作“Curr-inn”。她遇到过各种奇奇怪且尴尬的读法尝试——“Core-een”、“Core-eye-n”，还有有些完全不不谱，像
    Karen、Korean 或 Corn。有时她觉得很烦人，但有时，她只是付笑置之。


    由于 Corrine 的名字被读错的情况往往多于没有，她并不急于纠正别人。她从经验中知道人们在被纠正后会感到尴尬，她不喜欢让别人有那种感觉。相反，她搁置了她的纠正以让他们感到舒适。当她忽略未纠正咖啡师、收银员或接待员的名字时，这种做法并不算什么，但有时她避免纠正那些注定会遇到的人……这产生了一个问题。


    几年前，Corrine 参加了一份新工作的面试。当面试官叫她“Core-een”时，她没有纠正他，因为她不想在会议开始时就纠正别人。她顺利通过了面试，当第二次面试开始时，她再次拒绝纠正他。当
    CEO 叫 Corrine 到办公室进行介绍时，她也没有纠正他们的发音。


    每当 Corrine 在办公室遇到新面时，她都必须选择：我是应该正确读我的名字，还是使用别人使用的发音？如果她正确读出名字，她增加了面试官、小组和 CEO
    发现她在整个招聘过程中从未纠正过的概率。如果她读错了，她最终会被贴上一个与自己名字完全不符的标签。如果有人喊道“嘿，Core-een’，过来！”她会回应吗？她怀疑不会。


    几周以来，Corrine 一直无法决定怎么办……直到有人为她做出了决定。是一个名叫 Peter 的男人，来自外部机构，正在进行点名。


    “Corrine？”他喊道，正确地读出了她的名字。


    “实际上是 Core-een，”CEO 对她眨眨眼睛说。


    “是吗？”Peter 问，“我女儿也叫这个名字。”


    他们困惑地看着 Corrine。她脸红了。她向 CEO 报以一个小小的、歉意的微笑。


