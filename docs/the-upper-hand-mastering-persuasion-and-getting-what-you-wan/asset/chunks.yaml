- raw: 'Sarah must keep showing signs that she is on Bob’s side. She must recognize
    his pain point and reassure him that by accepting an interview with her, he is
    making progress in alleviating that pain. She must also convince him that she’s
    invested in his progress. She’s aligned with his goal. She wants to help him,
    but he must help her too.


    Sarah can’t convince Bob she is competent enough to help him if she’s not confident
    in her abilities. She can display confidence by setting strong expectations for
    their meeting. She demonstrates her experience interviewing others by anticipating
    Bob’s needs, and addressing common concerns before Bob even recognizes them. She
    knows her position as the person with The Upper Hand, and she uses it respectfully.


    “I have a tape recorder here,” she says, pointing to a device on the table, “but
    it’s just a quick way for me to keep notes while keeping my full attention on
    you. The recording itself will never leave my possession. No one but me will hear
    your voice. Is that okay with you?”


    “Yes, that’s fine,” says Bob.


    Having received permission, Sarah flicks on the recorder.


    Now, Sarah has addressed Bob’s physical discomfort. The next step is for her to
    approach Bob with empathy, increasing her perceived trustworthiness and encouraging
    him to feel comfortable with her.


    “I reached out to you for this interview because you’re one of the dockworkers
    for FishCo,” Sarah says, “and it’s my understanding that you’ve experienced the
    unsafe working conditions that FishCo claims their employees don’t go through.”


    “Yes, that’s right,” Bob says. “They don’t give us the right tools for the job.
    The boxes we unload from FishCo ships are heavy, but they don’t give us back braces.
    The carts we need to move stuff from the boats are all broken, and they don’t
    replace them for us. We have to move it all by hand.”


    “That must be really hard for you,” says Sarah. “Have you had a lot of back pain
    as a result?”


    “Yes, ma’am,” says Bob. “Tell me more about your day-to-day life at FishCo’s docks,”
    Sarah says.


    Throughout the interview, Sarah lets Bob set the pace. She asks open-ended questions
    and allows him to speak at his leisure. She offers breaks, keeps his water glass
    full, and waits patiently when he shows signs of resistance. She uses mutual self-disclosure,
    revealing relevant personal details about herself as a display of trust in Bob,
    which has the effect of making Bob feel it is safe to share as well. And when
    Bob struggles to make his point, she does not push back—she displays confidence
    in herself and in Bob.


    Her last consideration is to present competence. Sarah wants Bob to know she is
    confident in her own abilities, but confidence alone doesn’t equal competence.
    She could be the world’s most confident journalist for no reason other than her
    own ego. If she wants to earn higher levels of cooperation, she must show Bob
    that she’s the right journalist for the job.


    Sarah accomplishes this by asking the right questions. She did her research on
    FishCo before reaching out to Bob for the interview. When he’s finished answering
    her open-ended questions, she follows up with questions that guide him toward
    the answers she needs most.


    “So, you mentioned your back pain earlier,” she says, “I’ve spoken with a few
    other employees who share your pain. They had trouble finding medical care for
    their issues since FishCo doesn’t provide health insurance to their dockworkers.
    Can you tell me more about your own experience? Did you tell your boss about your
    pain? Did you seek help from a doctor?”


    “Yes, I told him, but he told me not to see a doctor because I’d get fired,” said
    Bob. “He said FishCo doesn’t do worker’s compensation.”


    “That sounds like a tough situation,” Sarah replied. “Can you tell me the name
    of the person who told you this?”


    Here, Bob hesitates. He struggles to answer the question because he’s worried
    doing so will come back to haunt him. He doesn’t want to lose his job, and revealing
    his boss’s name narrows down the potential “snitch” on his team.


    If Sarah wants the answer to her question, she’s going to need a little added
    pressure. She doesn’t need to squeeze the information out of Bob—doing so would
    only make him more stressed. Instead, she can guide him toward the right decision
    by reminding him of the stakes and their shared goal.


    “I know this is hard for you,” Sarah says, seeing his concern, “and you don’t
    have to answer any questions that make you uncomfortable. If you don’t want me
    to name your boss, I won’t. I just want you to know that if we don’t hold these
    people accountable for their actions, it’s going to be hard to make any real change.
    It’s easy to deny accusations if there aren’t credible stories to support them.
    Attaching a name makes it credible, traceable.”


    “Okay,” Bob says, “I understand. I’ll give you his name. But you’re not going
    to use mine, right?”


    “Right,” Sarah says, smiling.


    By the end of the interview, Sarah gains all the information she needs to write
    the perfect exposé on FishCo’s work environment. She kept Bob comfortable enough
    to elicit the right information from him. She showed confidence and competence,
    which made him trust her with his story. She maintained the right amount of pressure—even
    though it changed over the course of the interview—to keep Bob talking without
    making him feel cornered. Together, Bob and Sarah took the best possible steps
    to achieve their goals through collaboration.


    Approaching interactions with the intention to set a shared goal, maintain high
    levels of comfort, and form long-lasting relationships primes you for better pressure
    management. Your goals prevent you from exerting undue pressure on people when
    they don’t immediately give you the results you need.


    How do you determine how much pressure to apply to an interaction? You start by
    learning as much as you can about the person you want to influence. What kind
    of pressure can they handle without feeling offended, coerced, or threatened?
    Ask plenty of open-ended questions. You can ask about similar experiences they’ve
    had in the past—what worked out well? What didn’t? If they answer, “I felt scammed,”
    that might be a signal to take the interaction slow so you can build up trust.
    However, they might say, “The last guy strung me along for six months!” That’s
    your cue to take a more straightforward approach when you make the big ask.


    You can also avoid undue pressure by giving transparent answers to the questions
    you’re asked. Open, honest answers that directly address concerns and provide
    crucial information build trust. An authentic question-and-answer session is a
    key component of any influential interaction, and when it’s done well, it gives
    everyone what they need to feel confident and capable to say yes.


    Some people will need more than one interaction to influence. This is especially
    true if your first interaction is also your first time meeting them. Since people
    build trust in you by seeing consistent, competent results, they may need more
    time to familiarize themselves with you. Recognizing that the first meeting doesn’t
    always result in an official agreement helps remove some of the pressure on you
    and your interaction partner.


    Dumping information on another person in an interaction can add unintentional
    pressure, so spreading out information over time can be helpful. Humans’ short-term
    memories can hold a finite amount of information, which limits the amount of progress
    we can make during a single interaction.^([5](#Notes.xhtml#ch09note5a)) Big projects
    or agreements are more difficult to detail, and they make it harder for the person
    agreeing to keep all the terms at the front of their minds. Once their working
    memory is full, any additional information will only overwhelm them.'
