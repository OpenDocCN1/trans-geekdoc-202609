- raw: 'You can recognize your emotional experience once the interaction is over,
    in the right time and place. Taking this step avoids a negative impact on your
    emotional regulation process. If you restrain an emotional response without addressing
    it later, you risk damaging your sense of self-trust. It’s okay to shelve your
    emotions in the moment, but if you ignore them forever, your shelf will end up
    cluttered and disorganized. It’ll become more difficult to take the useful items
    down when they’re blocked by pent-up emotions.


    Once you have a free moment outside of the interaction, conduct a self-assessment—a
    shelf-tidying—to realign with your self-trust. As an example, let’s imagine an
    interaction where your friend announced their engagement to a man you can’t stand.
    You’ve told her in the past how you feel about him, and sometimes she seems like
    she sees your points, but she always ends up back on his arm. When you heard the
    news, you shelved your disappointment and congratulated her in the moment, but
    now you’re not sure you made the right choice.


    You can ask some self-assessing questions to better understand the situation.
    Will future interactions with your friend be more difficult now that you’ve shelved
    your emotions? Are you planning to address what’s on your shelf at a later, more
    appropriate date? Does your emotional response still feel as strong now that you’re
    out of that interaction, or did the context cause a stronger reaction than expected?


    In this scenario, hiding your feelings about your friend’s new fiancé *could*
    affect future interactions. So, you realize you *do* need to address your feelings,
    but you’re confident that her announcement wouldn’t have been the right moment
    to do so. Now that you’ve had some time to sit with the idea, you know your emotional
    response stems from a true concern for your friend’s future happiness and not
    from a petty dislike of her fiancé. Your emotional response in the moment was
    valid, you decide, and so was your decision to shelve it.


    Now that you’ve processed your perspective and your emotional response, you can
    decide how to move forward. You set a time to meet with your friend and address
    your worries for her. However, instead of reacting impulsively with protests or
    complaints, you can form an empathetic inquiry that either helps you feel confident
    in your friend’s choice or helps her recognize some issues to address with her
    fiancé. Either way, the outcome is your friend’s happiness—but if you’d reacted
    on emotional instinct, the outcome may have been the end of your friendship.


    #### *On the Outside*


    The best reaction to a surprising digression is no reaction. The more you can
    do to appear unfazed, focused, and nonchalant, the more you’ll aid your own influence.
    However, maintaining a solid poker face requires a strong grasp on emotional regulation
    skills.


    If you can limit any nonverbal cues that broadcast sudden changes in temperament,
    you’re more likely to keep The Upper Hand. Resist the urge to self-soothe with
    gestures like rubbing your neck, face, or arms. Try not to bounce your legs, shuffle
    your feet, or adjust your position. Redirect your attention from your own emotions
    to the emotions of the person you’re interacting with—this will help you mirror
    their nonverbal cues instead of tipping anyone off with your own.


    Take the time you need to form a rational, strategic response to what triggered
    you to shelve it. You can help along your emotional regulation process with a
    series of deep breaths. As you bring yourself back down to a calm, balanced demeanor,
    your pause can be powerful. The other people in the room don’t need to know you’re
    collecting yourself—they may think you’re wielding the pause like a banner of
    confidence.


    While you work to regain emotional balance, you can weigh your options for moving
    forward. What is the risk of addressing your concern versus the reward of shelving
    it? How can this information, should you choose to shelve it, be useful in further
    interactions? If you turn and run from your friend after her engagement announcement,
    you risk making her angry with you. However, if you choose to address your concerns
    later, you can renew past conversations about her problematic fiancé with the
    added weight of a wedding—and a marriage—for her to consider.


    It may feel uncomfortable to let silence linger between you and your interaction
    partner, but sometimes silence can work in your favor. If the statement that set
    you off was rude, offensive, or incorrect, letting it hang in the air like a noxious
    cloud may cause the person who said it to self-correct. Silence is also useful
    when you’re hoping to elicit information from others—people grow uncomfortable
    in long silences, and they often fill it with valuable information.


    Shelving your emotions is a valuable practice for keeping an interaction on track.
    The Upper Hand requires some strategy, but it’s also crucial to develop emotional
    intelligence skills so you can adapt in real time to surprises. However, as is
    true with all Upper Hand principles, the Shelve It practice isn’t a one-size-fits-all
    solution. There are some situations in which shelving your emotions is actually
    the *wrong* move. If your goal is an ethical, meaningful collaboration with another
    person, there may come a time when letting your response flow freely is the only
    way to make it happen.


    ### When to Ignore the Shelf


    How often do people pronounce your name incorrectly? It seems like no matter how
    simple any given person’s name appears, there’s always someone who pronounces
    it wrong. A friend of mine, Corrine, pronounces her name “Curr-inn.” She’s gotten
    all kinds of funny and embarrassing attempts to pronounce it—“Core-een,” “Core-eye-n,”
    and some that aren’t even close, like Karen, Korean, or Corn. Sometimes she finds
    it annoying, but other times, she just laughs it off.


    Since Corrine’s name is mispronounced more often than not, she’s not quick to
    correct people on it. She knows from experience that people are usually embarrassed
    after they’re corrected, and she doesn’t like to make people feel that way. Instead,
    she shelves her corrections to make them feel more comfortable interacting with
    her. This practice isn’t a big deal when she neglects to correct a barista, a
    checkout clerk, or a receptionist, but sometimes she avoids correcting people
    she’s bound to run into again … which creates an issue.


    A few years back, Corrine took an interview for a new job. She didn’t correct
    the interviewer when he called her “Core-een,” because she didn’t want to start
    the meeting by correcting someone. She nailed the interview, and when her second
    interview started, again she refused to correct him when he introduced her to
    a panel. When the CEO called Corrine to her office for an introduction, she didn’t
    correct their pronunciation either. It wasn’t until her first official day at
    work that she realized how big her mistake had grown.


    Every time Corrine met someone new in the office, she had to choose: *do I pronounce
    my name correctly, or do I use the pronunciation other people are using?* If she
    said her name correctly, she increased the odds of the interviewer, panel, and
    CEO finding out she never corrected them throughout her hiring process. If she
    pronounced it incorrectly, she’d end up labeled with a name nowhere near her own.
    Would she even respond if someone called out, “Hey ‘Core-een,’ come here!”? She
    doubted it.


    For weeks, Corrine couldn’t decide what to do … until someone made the choice
    for her. It was a man named Peter, who came from an outside organization and was
    in the middle of a roll call.


    “Corrine?” he called out, correctly pronouncing her name.


    “It’s actually Core-een,” said the CEO, winking at her.


    “Is it?” Peter asked. “That’s my daughter’s name too.”


    Both looked at Corrine with confusion. Her face flushed. She offered a small,
    apologetic smile to her CEO.'
