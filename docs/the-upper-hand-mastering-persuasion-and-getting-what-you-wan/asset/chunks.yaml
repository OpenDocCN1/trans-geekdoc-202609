- raw: 'The trust Ryan earned from Fink seemed genuine, when in reality, it was carefully
    curated for manipulation. Influence always begins with building trust and confidence
    in initial interactions. Ryan fooled Fink into believing they had plenty of commonalities:
    they were on the same train, they were headed to the same hotel, they both loved
    French cuisine, etc. What Fink didn’t know was that he’d been a mark on Ryan’s
    radar for months. Ryan purposely ended up on his train, and he intentionally booked
    a room at Fink’s hotel. He’d done his research on Fink ahead of time, which allowed
    him to play the part of Fink’s perfect match.


    After his initial influence strategy went perfectly, Ryan finalized his efforts
    with a demonstration of trustworthiness. When Ryan suggested they turn the wallet
    in, he proved he was a man of integrity. This final act solidified his perceived
    trustworthiness.


    Trust is a powerful force when it comes to influence, and sometimes we don’t know
    it’s been misplaced until it’s too late.


    Fink was so convinced of Ryan’s trustworthiness that he had no trouble following
    him to the tracks the next day and placing a bet on a “sure thing” horse. Ryan
    asked Fink to cover the initial $25,000 bet, promising the payout would be well
    worth it. When the horse won, Fink felt even more assured in his judgment. It
    wasn’t until Ryan recommended they bet their new winnings on the *next* horse
    that Fink caught on to his mistake. But by then, the final race results were called,
    Ryan had disappeared, and the money was gone. Only then did Fink realize his error
    in judgment.


    For the rest of his life, Fink struggled to make business deals with others. Not
    only did Ryan irreparably damage Fink’s trust in him—he damaged Fink’s trust in
    *anyone.* Every person he met made Fink remember his old “friend” and caused him
    to blush with shame. Rather than risk another letdown, he decided he’d never fully
    trust anyone again. His past, present, and future relationships suffered as a
    result.


    Over a hundred years later, people are still irreparably damaged every day by
    all sorts of fraudsters—from mediums and fortune tellers to Ponzi schemers and
    cult leaders. These people make a show out of their trustworthiness, then rob
    their victims blind over the course of weeks, months, or years. They use social
    engineering for their own gain and perpetuate the myth that all influence is dangerous.


    The tactics of The Upper Hand do incorporate trust, because trust is necessary
    to wield any kind of influence. However, what sets this framework apart is its
    intention: The Upper Hand requires *real, earned trust* instead of perceived trust.
    There’s no lying about your trustworthiness when you’re prosocially influencing
    another person.


    When influence becomes exploitation, influence becomes unethical. Influence’s
    shady reputation comes from those who exploit trust and confidence through manipulation.
    They convince people to act outside their own best interest. They influence with
    intent to cause harm.


    ### The Progression of Control


    Trust is the first step in most forms of manipulation, and the easiest way to
    earn it is through word of mouth. We trust a real estate agent because a friend
    recommended them. We trust a business coach because another CEO recommended them.
    We trust the new employee because we trust the hiring officer.


    Modern-day fraudsters like Bernie Madoff, a man who defrauded thousands of investors
    via his wealth management firm, use similar tactics to cult leaders and con artists.
    Madoff recruited his victims through referrals from wealthy individuals. If your
    ultra-rich friend introduces you to their trusted financial advisor, you’re probably
    not going to question their authenticity too closely. Madoff also met his marks
    through exclusive clubs reserved for high-net-worth people. The victims likely
    assumed, if he’s in this club, he must be legit.


    The quickest and easiest way to gain someone’s trust is to borrow it. When you
    meet a new person through a mutually trusted acquaintance, like a friend, family
    member, or colleague, you’re much more likely to appear trustworthy. Despite the
    fact that a mutual connection doesn’t equate to trustworthiness, our brains are
    more comfortable accepting the unfamiliar when it’s introduced by the familiar.
    Criminals and manipulators know this, and they use it to their advantage.


    Madoff had a reputation for being selective with his business partners. He chose
    his marks solely through internal referrals. This made him appear more trustworthy
    upon first meeting. He would present his marks with an investment opportunity,
    and he would emphasize they were only receiving the offer because they came highly
    recommended. He made a show of selecting them, recruiting them, and securing their
    money to make them feel valuable. His investors were members of an exclusive club,
    and if you’re lucky enough to hear an offer, you’d better jump at the chance to
    be included, no questions asked.


    Since Madoff “earned” trust through existing connections, his victims were more
    likely to make concessions for his unethical behaviors. When he didn’t deliver
    on his promises, his marks were hesitant to call him out. They carried on without
    raising an alarm, lest they appear untrustworthy to either the person who referred
    them to Bernie or to Bernie himself. Meanwhile, he made off with millions by taking
    control of their trust.


    This is how unethical social engineers create long cons: they create a progression
    of control. Their tactics begin with small signs of perceived trustworthiness—returning
    a full wallet, relying on friendly references—and take advantage of that trust
    to convince their marks to act certain ways. The more a mark trusts them, the
    more they can encourage the mark to act on their behalf. That’s how the fraudsters
    take control, one tiny concession at a time.


    Criminals aren’t the only manipulators familiar with the progression of control.
    Entire organizations take advantage of perceived trustworthiness to manipulate
    people into giving up their time, money, and energy for little to no reward. Toxic
    corporate environments often follow this pattern, and without interference, those
    environments can turn downright cultish.


    First, the leadership team works to gain a new employee’s trust, often aided by
    internal referral programs. A candidate is referred by a trustworthy connection,
    and they transfer that trust from their connection to the company itself. Once
    the candidate is hired, they’re more willing to trust the company, since they
    were introduced through a trusted connection. The company works to maintain that
    trust at first; they make the candidate feel special, and they offer opportunities
    for promotions, benefits, and more—as long as the candidate demonstrates loyalty.


    When you unknowingly join a corporate cult, you’re influenced to fall in line
    with its culture from day one—it’s how you keep your job, which is how you keep
    putting food on the table. If a company culture doesn’t promote individualism,
    creativity, or expressive freedom, you’re quick to pick up a “don’t rock the boat”
    mentality. You fall in line for safety and security. Meanwhile, the company’s
    control grows, and no one inside is brave enough to address it.


    Take Sue, for example. When Sue signed on as a data analyst at MegaCo, she couldn’t
    wait for her first day. Her interview was exciting—the CEO even stopped in to
    greet her in person! All signs pointed to the perfect position, and she trusted
    this company to value her as an employee. To say she was optimistic would be an
    understatement.'
