- raw: 'When a person feels their identity is under attack, they often experience
    a stress response. If someone’s identity is strongly tied to their job, and then
    they are laid off, they may feel extra stress in being untethered from their self-image.
    Similarly, if we disparage or question a person’s self-perception while also trying
    to persuade them, our attempts to influence are unlikely to succeed.


    On the flip side, if we can resonate with someone’s self-identity and connect
    with it, our messages become more appealing to the other party. Brands attempt
    to influence consumers to purchase their products and services by appealing to
    common values. Celebrities gain and lose followers when they speak passionately
    about their political views. And social media apps keep us scrolling by showing
    us more of the content we “like”—which is usually content that appeals to our
    self-identity.


    People are driven to preserve their self-identity as they move through the world,
    and sometimes this drive is more important to them than the truth. When self-identity
    is questioned, confronted, or contradicted, it’s uncomfortable. People often avoid,
    undermine, or dismiss notions that invite inconsistency into their perceived reality
    … which isn’t an ideal outcome for an influence attempt.


    The human brain struggles to hold on to two conflicting, similarly valued beliefs—this
    struggle is known as cognitive dissonance. Decisions about which belief to choose
    are made in the newest parts of our brains. Maybe we’ll evolve to build broader
    subjective realities that can account for contradicting ideas, but until then,
    we’re more likely to enter fight-or-flight mode than rationally accept a challenge
    to our most valuable beliefs.


    A person’s self-identity can affect how cooperative they want to be, how safe
    they feel, and how willing they are to make a deal with you. If you appeal to
    a person’s self-identity, you’re more likely to create a connection. If you infringe
    on a person’s self-identity, your chances of influencing them decrease, especially
    if they find your infringement offensive to who they are.


    Self-identity is relative; what is a compliment to one person’s self-identity
    may be an insult to another. When Dylan first approached me about grant writing
    and my academic background, I was interested in a possible collaboration. But
    when it became clear he wanted me more as a salesperson with no real autonomy
    or power, I lost interest. Instead of appealing to my expertise, Dylan appealed
    to skills unrelated to what I consider most important to who I am.


    Rather than attempting to influence someone to *think* differently (for which
    they’d have to change their self-perception), it’s much more effective to show
    them how working with you falls in line with their existing self-identity, beliefs,
    and values. If Dylan had led with sincere respect for my true expertise (behavioral
    science, not OSINT), perhaps we’d be working together.


    ### Entwining Principles with Practice


    These five biopsychosocial principles address the underlying drives of all human
    decision-making. This knowledge is paramount to wielding The Upper Hand. The coming
    five practices—Create a Tribe, Speak Their Language, Pants Yourself, Shelve It,
    and Hold, Don’t Squeeze—are *how* we’ll take the five principles and put them
    into action in our influential interactions.


    In the next section of the book, we’ll cover these five practices. We’ll review
    how each practice considers the principles we’ve covered in this chapter, the
    “digits” of The Upper Hand, and uses them to inform approaches to influence. Each
    practice takes you through all the considerations you can make in your interactions
    to increase your odds of securing the “yes.”


    In the next few chapters, we’ll explore how the knowledge of human decision-making
    informs the five practices of The Upper Hand framework. While it’s tempting to
    view the next sections as a sort of playbook for influence, The Upper Hand is
    not a one-size-fits-all guide. Following its practices won’t guarantee flawless
    influence attempts. Additionally, there is no set order in which you must use
    these practices. Some of them may not even apply in every interaction. While The
    Upper Hand may not act as a step-by-step instruction manual, it *does* act as
    a toolkit you can use to grow into a master influencer.


    The reality of the human experience is that we’re all different. Each person brings
    their own experiences, biases, and interpretations to every interaction. The best
    influence strategies start with The Upper Hand as a foundation, then rely on you
    to adapt in the moment as you learn more information. In essence, The Upper Hand
    is a guide, and it’s meant to help you reach your ultimate goal: effective, ethical,
    long-lasting influence.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 5](#Contents.xhtml#rch05)


    ## [CREATE A TRIBE](#Contents.xhtml#rch05)


    It’s your first day as manager at a new company. How are you going to convince
    your new team to trust you, respect you, and cooperate with you? Old-school tactics
    might advise you to establish a power dynamic, reminding your new teammates who’s
    boss. When you want something done, you don’t ask, you demand. You don’t earn
    respect—you command it from your subordinates.


    These old lessons in leadership come from the very beginning of human social groups.
    About 300,000 years ago, early humans created tribes around strong, dominant leaders.
    These leaders were typically the most dominant “alpha” males. They ensured the
    group’s survival by protecting against predators so the others could focus on
    gathering food and securing shelter. The first social groups in recorded history
    only had about 10 to 15 members, but as time went on and these groups merged,
    their respective leaders clashed.


    When two or more nomadic groups of humans collided, their leaders took on a conquer-or-be-conquered
    mentality. Brute force and violence resulted in a surrender or a murder, and the
    winner took the leadership role. As humans established permanent homes and stopped
    roaming as much, tribal leaders gained influence through conquest, raids, pillages,
    and war. Dominance reigned, and only the most aggressive tribes survived.


    It wasn’t until the civilizations that would eventually become ancient Rome and
    Greece formed that leadership grew to include more than forceful survival. These
    cultures were the first to consider leaders who valued education, rational thought,
    and the pursuit of knowledge. Ancient philosopher Aristotle posited that the best
    leaders were the ones who pursued virtues and led with reason, not raw aggression.


    The popularity of ideological leaders grew, especially among humans with more
    brains than brawn. People became more motivated by a shared system of beliefs
    rather than a collective fear of challenging authority. However, it didn’t take
    long (about 100 years) for advantageous people to dominate this form of leadership,
    turning idea-driven societies into dictatorships. This was the era of Hitler,
    Stalin, Mussolini, and Mao.^([1](#Notes.xhtml#ch05note1a)) Instead of dominating
    through straightforward public violence, they influenced their followings through
    fear, treachery, and manipulation.


    While dictators throughout history collected power at alarming rates, it was always
    short term. They did nothing to reduce the amount of human suffering within their
    tribes. They established regimes based in fear, not trust. They dominated instead
    of cooperating, and many people fled from them as a result. These subjects risked
    punishment, persecution, and death, all to break free from such a flawed leadership
    style. The subjects who didn’t choose flight eventually chose to fight, and they
    enacted violent evictions on these oppressive leaders.'
