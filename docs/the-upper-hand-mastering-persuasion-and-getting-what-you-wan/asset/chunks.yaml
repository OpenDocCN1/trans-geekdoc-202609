- raw: 'When the brain processes new information, whether it’s an obvious visual threat
    or a complex social situation, its first determination is how this information
    impacts our immediate survival. Sometimes this evaluation takes place in our conscious
    minds—like when we look down over a steep ledge or see a bear off in the distance—but
    most of the time, we’re not aware of how often our brains are checking our survival
    odds.


    Survival drives stimulate the fight-flight-freeze response. When the amygdala,
    the part of the brain that processes emotions, receives threatening information,
    it sends a distress signal out. This signal is received by the hypothalamus, which
    then communicates to the rest of the brain to trigger fight-or-flight mode. This
    response floods the body with stress hormones like cortisol and adrenaline, which
    provides a physical advantage in the upcoming interaction.


    The fight-or-flight response affects almost every part of the body. The heart
    beats faster to increase blood supply for running or fighting. Small airways open
    wider to increase oxygen intake, giving the brain a higher level of alertness.
    Glucose moves from temporary storage inside the body to transfer energy quickly.
    The entire body remains on red alert until it receives a new signal from the hypothalamus
    that the threat is gone, defeated, or neutralized.


    The survival response, like all psychological drives, has its pros and cons. The
    brain’s survival procedures help us leap out of the way of a moving car before
    we’re even aware of the danger, which makes them useful. However, since the survival
    response comes from the oldest part of our brains, it’s not adept at differentiating
    between the threats our ancestors faced and the psychological and social ones
    we face today. The brain enacts the same response to a snarling lion as it does
    to a pushy salesperson. The context of the response is irrelevant to influence
    strategies—the existence of the response is what matters.


    Sometimes, people trigger the survival drive to coerce others. While this can
    get a “yes” in the immediate term, it doesn’t lead to lasting influence. The car
    salesperson might be able to coerce one sale from an individual, but it’s unlikely
    they’ll be able to get the second sale from that same individual. Buying a car
    was stressful with that salesperson! It’s not an interaction most people will
    want to repeat.


    Since survival is a priority in any given situation, it is often a barrier in
    successful influence. To gain The Upper Hand, we must avoid triggering the survival
    drive. Otherwise, the brain will be distracted trying to neutralize the threat,
    rather than thinking about making a decision. If you want someone to be cooperative,
    you must first make them feel safe.


    The brain can’t focus on decision-making during an interaction if it perceives
    an imminent threat. It will instead be guided by the drive to survive, which can
    be difficult to predict, making influence harder. To encourage cooperation and
    long-term “yeses,” influencers must avoid triggering the drive to survive. (More
    on how to do this in the coming chapters.)


    We can think of the survival drive as the index finger of The Upper Hand: it’s
    useful in many contexts, and while it sometimes gets in the way—have you ever
    accidentally hammered your index finger instead of a nail? It’s not fun—there
    is no doubting how useful it is. Both the index finger and our survival instincts
    are great at pointing out danger, although neither are always adept at helping
    us escape it. However, when using influence, making a point to accommodate the
    human survival drive is sure to help you gain The Upper Hand.


    #### *Connect and Cooperate: The Middle Finger*


    “Giving the finger”—presenting only the middle finger on the hand toward someone
    or something—is a sign of disrespect in many Western countries. However, this
    middle digit, when thrown up, can help foster *or* fend off one of our most persistent
    drives: to connect and cooperate with others.


    In 1968, a US Navy ship named the USS *Pueblo* was captured by North Korea. While
    the US government struggled to find a way to get their men back, North Korean
    officials built a propaganda campaign around them. They released photos and films
    of their captives, claiming they were treating the men with the utmost respect.
    What these officials didn’t realize, thanks to the nonverbal language barrier
    between Americans and North Koreans, was that in every shot, the Navy men were
    displaying exactly how they felt about their imprisonment by flipping their middle
    fingers to the camera.


    “It helped us survive and kept morale up,” said one of the crew-members during
    an interview years later. “For that little period of time, we were in charge of
    our own lives.”^([4](#Notes.xhtml#ch04note4a))


    These men were held captive for almost a year, and during that time, throwing
    up their middle fingers in a small rebellion was a key part of their survival.
    It helped them connect with each other and communicate their true feelings to
    the outside world. On one hand, the gesture worked as a prank—when North Korean
    officers noticed, the men claimed they were flashing a “good luck” gesture. On
    the other hand, they shared a crucial message with the world: “don’t let their
    propaganda fool you; we are prisoners here.”


    While the brain is wired to survive, it is also wired to make connections with
    others. Some people will argue that survival is more important than connecting
    with other humans—after all, another person could kill us. However, research isn’t
    so clear-cut on this.


    Humans have evolved as a social species. Our brains are wired to seek out connection
    with each other, and we are rewarded with a cocktail of feel-good neurotransmitters
    when our search pays off. It would be easy to assume we only seek out connections
    to mate and pass on our genes, but the drive to connect with others appears in
    the brain long before a human is capable of reproducing.


    Making connections with others—parents, siblings, friends, strangers—is how humans
    have survived for millennia. Humans are one of the only animals on Earth born
    completely helpless. A human infant can’t walk, find food, or protect itself from
    danger for *several years*. For a baby to avoid starvation, dehydration, or any
    other thousand ways to die, they must rely on other humans to care for them while
    they continue to develop outside of the womb.


    The more our ancestors grouped and built communities, the more often they survived
    the dangers of their times. The drive to survive and the drive to connect and
    cooperate grew to be inter-twined—as modern humans, we are dependent on our “tribe”
    to meet both needs.


    As a baby grows into an adolescent, they still rely on other people for support.
    They might be smart enough to remember where and when the wild trees bear fruit,
    but not strong enough to raise shelter or hunt for animals alone. Thousands of
    years ago, it was easier to take down an angry elephant with a group of humans.
    Today, it’s easier to face losing a job, receiving a hard diagnosis, or months
    of imprisonment in a strange country with a support system.


    The Upper Hand framework taps this powerful drive to connect and cooperate. Additionally,
    the most skilled social engineers also wield humans’ innate social drives. Being
    connected and cooperating with others makes us feel safe. When a person feels
    socially safe, their brain gets a rush of the neurotransmitter oxytocin.


    Oxytocin is often known as “the love hormone” or “the cuddle hormone,” but it’s
    perhaps better understood as the “social trust” hormone.^([5](#Notes.xhtml#ch04note5a))
    We don’t only receive oxytocin from hugging, kissing, and skin-to-skin contact—we
    receive oxytocin when we hold eye contact with others, sing in unison, or see
    others perform a good deed for another person. Oxytocin feels good—it’s how our
    brains reward us for securing connection with others, which ultimately benefits
    our chances for survival.'
