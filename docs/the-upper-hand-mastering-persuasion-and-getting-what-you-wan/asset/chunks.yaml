- raw: '### Why It Works: Mutual Self-Disclosure


    Researcher and storyteller Brené Brown says, “Vulnerability is not about weakness;
    it’s our greatest measure of courage.” When we show vulnerability to others, we
    demonstrate honesty, transparency, and, most important for our purposes, trustworthiness.
    We make room for collaboration by clearing out any expectations of perfection
    or inauthenticity. We let other people know that although we’re dressed up, spotlit,
    or leading the conversation, we’re human beings first, and human beings don’t
    always operate at full capacity. It takes courage to admit our imperfections,
    and it can be a relief when someone else does the same.


    The power of vulnerability lies in trust. In layperson’s terms, pantsing yourself
    shows humility and lets others know you don’t take yourself too seriously. When
    you pants yourself, you make a proactive attempt to connect through emotions and
    experience. And often, this act of self-disclosure helps to relieve tension without
    forcing anyone else to be the butt of the joke (pun intended).


    Pantsing yourself is an act of self-disclosure. Self-disclosure is a display of
    honesty and transparency, which promotes trust.^([1](#Notes.xhtml#ch07note1a))
    You’re demonstrating to someone that you have nothing to hide. This practice can
    also shift the tide before it pushes you too far in the wrong direction.


    In a way, pantsing yourself has a similar effect to taking off a restrictive pair
    of pants at the end of a long day. With one motion, you’re free of a biting waistline,
    scratchy texture, and stuffy fabric. It’s a relief to break out of the day’s uniform
    and slide into a pair of sweats. It feels good to be free from the pressure.


    Directly addressing the tension surrounding an interaction can also feel like
    a relief. A quick statement, like “Wow, I’m really nervous!” or “I’m a bit off
    today, so bear with me as we move forward,” can make all the difference in an
    interaction’s level of tension. These little moments of self-disclosure (vulnerability)
    show you are being honest and transparent.


    If one person’s mind is in a state of stress, tension, or fear, they may be more
    difficult to influence. When a person is caught in their own internal dialogue
    and sense of the world, it can be difficult for them to consider another person’s
    lived experience. Pantsing yourself distracts from the other person’s distractions,
    giving them time to feel more comfortable, confident, and competent.


    The Pants Yourself practice is based in The Upper Hand’s middle and pinky fingers—the
    human desires to connect, cooperate, and maintain a strong self-identity. By pantsing
    yourself during a stressful situation, you offer the interaction an opportunity
    to stop, reset, and begin again from a more cooperative place. You avoid insulting
    or embarrassing others, allowing them to maintain their self-identity and regain
    control over their emotional responses. Sometimes, a little pantsing is all it
    takes to break out of a high-pressure mindset.


    A friend of mine named Kara spent a few months working in a surprisingly high-pressure
    environment: the Walt Disney World theme parks. The culture there was the epitome
    of “the customer is always right.” One winter, Florida experienced an unusual
    cold snap. As soon as the golden sun dipped below the Cinderella castle, temperatures
    dropped from 60 degrees Fahrenheit to below freezing. The guests at the theme
    park were caught off guard by the cold, and every night, they flooded the gift
    shops to buy up all the blankets.


    Except … it *is* Florida, and blankets aren’t exactly high-demand products. In
    fact, there was only one blanket style in the entire park: a promotional product
    that customers received for spending $75 or more on other merchandise. Without
    that qualifying total, cashiers couldn’t even ring the blanket up.


    Customers surged like angry waves against the cash registers. In their defense,
    it was a high-pressure situation for them too—after spending thousands of dollars
    to make their kids feel real magic, they were now forced to either spend more
    money or let their kids freeze during the fireworks. It was probably that high
    stress that made them all refuse to acknowledge that maybe, just *maybe,* they
    should have checked the weather before heading out for the day. So instead, they
    screamed, stomped, and shook their freezing babies at the cashiers.


    Kara, panicking as a small fight broke out over an Elsa beach towel, noticed something.
    Her register was teeming, but the one on the other side of the store seemed calmer.
    She could make out an actual line forming. The voices were quieter and slower.
    The cashier behind that counter, a young woman named Taryn, was *laughing.* What
    was going on over there?


    “Hey, what’s with Taryn’s register?” Kara called to a coworker.


    “Oh, people are giving her a break because she’s still got the training badge.”


    *The training badge! Of course!* At Disney parks, new employees have a special
    training badge they wear for the first two weeks. It’s a red ribbon with gold-threaded
    letters that say “Earning My Ears.” These badges function for Disney employees
    like “Student Driver” stickers function on bumpers. They’re meant to project the
    message: “Please spare me, I’m new!”


    Kara ducked into the back and found a stray training badge. She slapped it below
    her name tag with a small smile. She knew some people still kept their training
    badges handy, but until now, she didn’t know why.


    Almost instantly, the crowd around Kara’s register settled. Instead of screaming
    at her, customers gave her sympathetic smiles. They showed her patience when she
    couldn’t immediately answer their questions. (“No, sorry, I don’t know if the
    Sleeping Beauty dress-up costume is warmer than a T-shirt.”) When she told them
    the blanket couldn’t be rung up as a separate purchase, they sighed and left without
    arguing.


    *This is the* real *magic,* Kara thought, straightening the training badge.


    Disney’s training badges allow new employees (and old ones who need a little break)
    to pants themselves to their customers. The badge self-discloses for the employee
    right away. When the customers see the badge, it reminds them the person behind
    the counter isn’t some animatronic built to serve them Mickey-shaped pretzels—they’re
    a human being, and they’re still building up some confidence.


    Not everyone can wear self-disclosure on their uniforms, but the lesson stands:
    pants yourself to earn some patience, empathy, and understanding from others.
    Whether you’re at a theme park or in an office suite, sometimes the perfect way
    to deflate the tension is to remind others of your imperfections.


    Imagine walking into a competitor’s boardroom for a high-stakes meeting with the
    CEO. It’s your team’s responsibility to leave the meeting with a signed deal outlining
    a partnership between your businesses. Your career is riding on this one interaction,
    and if you leave empty-handed, you’re bound to face some backlash. This CEO, Margaret
    Smith, has a reputation of being a no-nonsense-bordering-on-cutthroat businesswoman,
    and the idea of meeting with her sends you reeling.


    When Margaret enters the boardroom, she’s a few minutes late and still exudes
    a cool confidence. She’s got a stack of prepared papers that sits taller than
    your whole briefcase. She’s perfectly composed, and it only takes her a few minutes
    to settle in before signaling she’s ready to start the meeting. *She doesn’t look
    like a person,* you think to yourself, *she looks like a business robot.*


    “Thank you for meeting with us today, and thank you for your patience. It’s been
    one of those mornings,” she says with a laugh. “Anyways, I know we’re all aware
    of how important this meeting is for both of our companies, and I’m sure we’re
    all a bit on edge. But let’s not focus on the stakes. Let’s focus on how we, as
    leaders in our industry, can come together to set new standards.”'
