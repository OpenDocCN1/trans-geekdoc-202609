    T-shirt logo, can influence how we respond to others in our environment.


    It’s crucial to note that we’re not only inclined to respond more efficiently
    to the familiar; we also respond less efficiently to the unfamiliar. When we enter
    situations we find unfamiliar, our stress response is triggered. `Cortisol` levels
    rise to help us spot danger, escape routes, and weak points lurking in our surroundings.
    This stress response might have been advantageous when exploring a new, wild territory,
    but it’s less helpful when entering a potential customer’s boardroom for the first
    time. Similarly, when we invite business partners to our familiar environment,
    their stress response may impact their presence.


    Creating a tribe limits the brain’s responses to the unknown during an interaction.
    By aligning ourselves with the other people, we wave a bright banner around the
    room and use it to represent our shared values, interests, and goals. We unite
    underneath this banner, which bolsters us to accomplish more together.


    ### How to Create a Tribe


    Mastering the skill of connecting over commonalities requires some subtlety. This
    strategy isn’t simply about offering up your favorite hobbies and interests to
    see if your interaction partner shares them with you. It’s about actively eliciting
    information from your interaction partner to determine what their interests are,
    then offering up ways they connect with your own. If you try to fake, force, or
    fabricate a connection, you slip into the sphere of manipulation, and you risk
    breaking trust. However, if you come on too strong, you risk appearing pushy or
    manipulative, which decreases your odds of forming genuine connections and trust.


    Creating a tribe requires you to highlight commonalities without appearing opportunistic.
    By drawing attention to what you and another person have in common, you open a
    door to your tribe for them to step through. How successful you are at inviting
    them through depends on how you open the door: how wide you swing it, how long
    you leave it open, and how inviting you make the space on the other side.


    There are variations of the `Create a Tribe` practice. You can choose whichever
    suits your influence strategy best. Creating a tribe between you and one other
    person is the most obvious choice. However, sometimes creating a tribe with another
    person and purposely excluding others from joining triggers the parts of our brains
    excited by exclusivity, which can be more valuable in certain situations. Finally,
    you can create a tribe with multiple members at once, which is a trickier task
    to accomplish, but can merit strong results if done well.


    Creating a tribe with another person requires more than a compliment—it’s about
    pointing out what aligns you and your interaction partner best. Sometimes the
    initial effort to create a tribe does resemble a compliment, but it must go deeper
    than that.


    Say you’re looking to practice creating a tribe with a potential customer, a man
    named `John`. “That’s a nice suit,” is a compliment. “That’s a nice suit. I’ve
    been looking for a local tailor to make my suits fit better. Who do you use?”
    is a connection point. You and `John` are similar because you both have interest
    in tailored suits—not simply suits off the rack. You compliment `John`’s style,
    and, with more context, it’s clear to `John` you have a genuine interest in the
    suit beyond pure flattery.

