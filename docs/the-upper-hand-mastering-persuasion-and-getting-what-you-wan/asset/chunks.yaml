    relationships to secure referrals for new business. She landed public speaking
    roles by presenting other people’s work. She went from an associate to a trainer
    in less than a year, all because she was charming and presented like a hard worker.


    Meanwhile, I bided my time and took the slow road. I ensured every concept I claimed
    was entirely my own. I collaborated with others, but I made sure never to overstep
    their expertise or credit their contributions. I wasn’t as quick to land speaking
    roles or training groups as Diane, but I felt morally sound in my long-term strategy.


