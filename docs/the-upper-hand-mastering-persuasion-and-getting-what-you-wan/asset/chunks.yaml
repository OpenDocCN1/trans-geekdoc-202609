    Leno didn’t see the risk he took when he squeezed Bezos. He lacked the ability
    (as many of us do) to see the future. He couldn’t predict Bezos’s success. During
    a time when the internet was little than a tool for chatting with strangers and
    ordering books, Leno the fool for placing undue pressure on a man who would become
    one of the richest people in the world.


    Today, most of us know the value of pressure during interactions. We know applying
    pressure to a situation can cause undue anxiety for everyone. Time pressure, financial
    pressure, and social pressure all risk causing stress responses in people. If
    we hold a meeting with a business associate by saying “I want money, and you’re
    going to give it to me … or else,” Steve will squirm under the pressure and feel
    trapped or cornered. Or he’ll just get up and walk out. Either way, his thought
    process will stop, and his brain will transfer its energy instead to fight-or-flight
    response.


    Once Steve’s stress response kicks in, he might respond with anger, aggression,
    or a swift exit from the interaction. And once he leaves, he’s not likely to come
    back. He doesn’t care to find out what “or else” means.


    While squeezing an interaction too tightly is problematic, a loose, laid-back
    situation isn’t always the right option either. Too little pressure might not
    properly motivate action. A meeting to secure a new project needs little pressure.
    Otherwise, everyone grows frustrated when that meeting veers off track, stalls
    out, or runs out of time.


    A key component of The Upper Hand is the perfect level of pressure. But we must
    be cautious with how we use it because once we add pressure to a situation, it
    is difficult to remove. We can’t toss out threat and then backtrack to building
    rapport—we’ve already squeezed too hard.


    For better or worse, salespeople are notorious for applying undue pressure. You’ve
    likely met the salesperson who tries to send you home even though you told them
    you’re just looking. You’ve met the salesperson who, upon seeing you approach,
    launches into a speech about the latest technology. He walks you through the pitch
    before you even have a chance. They all try to convince you to buy what they are
    selling, but they only succeed in chasing you off.


