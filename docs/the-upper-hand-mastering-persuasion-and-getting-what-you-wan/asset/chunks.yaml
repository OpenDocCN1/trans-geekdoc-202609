- raw: 'Domineering leadership might work for kings, dictators, and tyrants with armies
    behind them, but only for short periods of time. Since our days as small, nomadic
    tribes led by brutish alphas, we’ve learned more about human behavior, relationships,
    and motivations. If you choose to lead your new team like an authoritarian ruler,
    you inspire mutiny, not cooperation.


    The best way to get what you want from others is to inspire connection (and thereby
    trust). The most successful influencers inspire others to believe what they say,
    value their advice, and accept their influence. Once you’ve made it clear you’re
    not out to get anyone, you can gain better results by offering tempting choices.


    It’s not typically easy to build trust with total strangers, but you can reduce
    the odds of triggering their stress response to make them feel, if not bonded,
    at least safe. Before you can think about convincing your team members to work
    with you, you must convince them to talk to you in the first place. It’s easier
    to influence people with whom you’ve already established a positive relationship.
    Striking up chitchat with a friend or colleague you already know feels natural,
    which makes transitioning to influence feel natural. These people feel connected
    to you, and they trust you not to lead them astray. It’s more difficult to influence
    a stranger, even when you have some form of power over them.


    As the new manager at a company, you might decide the best way to make a good
    first impression is to make yourself available. Instead of shutting yourself in
    your new office as a show of force, you decide to take a walk around the office.
    You see your new team members busy at work. You smile and nod as you pass by,
    but one desk catches your eye, and you stop for a closer look. There is a framed
    picture on the desk of a family posing in front of the Grand Canyon.


    “Wow, what a great picture,” you say to the young man at the desk. “I was just
    there last year. Isn’t it beautiful?”


    “Oh, yeah!” he says. “That’s from our trip a few years ago. It was one of the
    best trips we’ve taken. The kids loved it.”


    “I can see by those big smiles! How old are they now? What are their names?”


    You spend another few minutes chatting with the young man—you learn his name is
    Marco, that he’s head of logistics—before continuing your stroll. You stop at
    another desk to comment on the football logo on Marketing Mike’s desktop background;
    it’s your favorite team too (and it actually is)! A few desks over, you and Sarah
    from accounting discover you both worked for the same company 10 years back. You
    learn from Jamie over in sales that the team goes out for drinks on Thursdays,
    and that managers are always welcomed to join.


    Before lunch, you realize you’ve met every member of your new team without holding
    a single meeting. A group of them invites you to a local restaurant, where you
    learn even more about one another. They talk about their work, what they’re excited
    about, and what they’re dreading. After lunch, Jamie pulls you aside.


    “We’re really excited to have you here,” she says. “You seem like a great fit.
    The whole team loves you already.”


    By the time you hold your first official team meeting a few weeks later, it’s
    clear you’ve established a baseline of trust. The team might not accept your new
    initiatives with enthusiasm, but they hear you out and ask thoughtful questions.
    They ask your opinion on strategies they’ve used for years before you joined.
    The whole team works together, and there’s a clear path to success by the time
    the meeting ends.


    What you’ve done here is utilize the first practice of The Upper Hand: Create
    a Tribe. Crafting a sense of unity and community, a “tribe,” around some commonality
    establishes an initial bond with another person. These bonds are quick and easy
    to form around simple things, such as shared interests, physical attributes, and
    experiences, from long lines in the grocery store to vacation destinations to
    former workplaces.


    People often create a tribe when they strike up conversations with others. A customer
    at the cafe might notice the barista is wearing a Pittsburgh Steelers button on
    their apron and make a comment about the most recent game. You might strike up
    a conversation with a person who’s wearing the same watch as you, asking them
    what prompted the purchase. You might share a wry laugh about forgetting to bring
    a book to read in the long line at a grocery store. Creating a tribe positions
    you as a nonthreatening member of the same team.


    Starting an interaction with a shared interest creates a sense of familiarity.
    Typically, we humans are on the alert when confronted with strangers. By finding
    something to connect over, we put others and ourselves at ease—we feel psychologically
    safer, if only slightly.


    Finding a shared interest with another person (or people) triggers an oxytocin
    release for everyone involved. This hormone counters the stress hormone cortisol
    and primes us for a more positive social experience. The more we connect, the
    more oxytocin we trigger (in ourselves and others), and the safer we feel.


    Creating a tribe is like a warmup for your interaction. In fact, most “icebreaker”
    prompts used in the corporate world are designed for people on a team to create
    a tribe together. It seems simple enough when you think about it—people bond better
    when they have something in common—but too often, people ignore this practice,
    diving straight into a pitch. Like any warmup exercise, whether it’s in the office,
    the gym, or a local hangout, choosing to skip this first practice can make gaining
    The Upper Hand more difficult.


    Think for a moment about a recent interaction you’ve shared with a stranger—how
    did it start? It’s doubtful that a stranger approached you and said, “Hello, I’d
    like to start a conversation with you.” Instead, it’s more likely you and the
    stranger connected over something you have in common. Maybe you said, “cool shirt,”
    because their shirt depicts a band you like, or, “How do you know James?” because
    you met at James’ retirement party. You may have even commented on the recent
    weather. (This is sort of a last grasp at connection, but hey, I’m British, so
    it’s my go-to small talk!)


    To successfully wield The Upper Hand, you must allow the other person to feel
    safe. Creating a tribe with them is a way to align yourselves as allies, signaling
    that you’re not a threat nor an obstacle to their well-being. It’s a way to indirectly
    say, “Hey, fellow human, we’re in this together.” Once the two of you feel united
    under the same banner, you’re in a much better position to practice your influence
    skills. Their calm, safe state allows them the space to think critically about
    your eventual offer, making it more likely for you to secure an enthusiastic “yes.”


    ### Why It Works: Utilizing the Principles of The Upper Hand


    When it comes to influence, it’s good to keep in mind the three C’s: comfort,
    confidence, and competence. When meeting someone new, you’ll want them to feel
    comfortable speaking with you, confident in their role in the conversation, and
    competent enough to fulfill their role in a collaboration. Maintaining a safe
    environment is a precursor to comfort, just as comfort is a precursor to confidence
    and competence.


    As humans, we’re more likely to cooperate with others when we see them as members
    of the same tribe or social group. We feel more comfortable, confident, and competent
    within our tribes. We’re not just emotionally motivated to support other tribe
    members—we’re biologically motivated too. The Create a Tribe practice shows us
    how to leverage what we have in common with others to appeal to the survival drive—the
    pointer finger principle of The Upper Hand.'
