    He waits patiently there, exactly where customers can find him should they decide
    they *do* need his help. You are free to peruse the shelves at your leisure, so
    you do! You find a pair of pants you like, but you don’t see it in your size.
    Lucky for you, there’s someone up front who can help you with that.


    Since you’re feeling safer in this scenario, you have no trouble approaching the
    salesman and asking him where you can find extra sizes.


    “Oh, no worries,” he starts. “I’ll check the back for you, and come find you.”


    You wander off into the shoe department, and he finds you trying on some sneakers.
    You don’t need new sneakers, but as he hands you the correct-sized pants, he inquires
    after the ones you picked out.


    “What drew you to those shoes?” he asks.


    You mention you were thinking you could use a new pair for an upcoming vacation.


    “Oh, cool, where’re you headed?”


    You mention the Grand Canyon and Tucson for the emerging foodie cuisine.


    “Sounds amazing,” he says. “You’ll have to compare views with Yosemite!” He pauses,
    looking at the shoes you’ve picked out. “Those sneakers would work with these
    pants—let me know if you need anything else.” He returns to his post.


    There is some pressure here, but it’s virtually undetectable. He connects with
    you, affirms your shoe choice, but applies no pressure to buy—he doesn’t even
    mention the buy-one-get-one-free deal on the shoes. The salesman isn’t necessarily
    playing it cool—he’s just not applying heavy pressure like so many others do.
    You’re more likely to approach him with any other questions than any other salesperson
    on the floor, since he successfully helped you once already. His confident smile
    and competent behavior make him more approachable. Instead of pressuring you to
    choose to buy from his store, he simply responds to the choices you make as you
    make them.


    By the time you’re finished in the store, you’ve rounded up six items with the
    help of the salesman. You asked him where to find shirts on sale, and he showed
    you the best selection in the clearance section. You happily grabbed three tees.
    When it comes time to check out, he suggests you open the store credit card to
    receive another 10 percent off your purchase. There’s no annual fee, and you can
    cancel it at any time. The salesman looks at you with a kind, reassuring smile.
    You agree.


    In this new scenario, the salesman’s simple, low-pressure guidance allowed him
    to hold greater influence when it came time to make the big ask—having you sign
    up for the store credit card. Rather than acting like a human pop-up ad, he took
    on the role of a gentle guide. He was ready to help if needed, but unwilling to
    seem desperate for a deal. He allowed you freedom to make your own decisions over
    the items you bought, which made you more likely to buy. By holding off on aggressive
    influence tactics, he managed to meet his goal.


    That is the power of the Hold, Don’t Squeeze practice.


    ### How to Hold, Not Squeeze


    Mastering this practice is like mastering any handshake, helping-hand gesture,
    or perfect hug. It’s all about creating the three C’s: comfort, confidence, and
    competence. As any interaction goes on, maintaining a balance of pressure and
    leeway sets you up best for success.


    Mastering this practice relies on active listening, empathy, and trustworthiness.
    Once you’ve got a firm grip on those social skills, you’re well prepared to adapt
    your influence strategy, adjusting pressure levels to ensure the perfect interaction.


    Let’s examine how to execute Hold, Don’t Squeeze practice through an interaction
    between a journalist and the person they’re interviewing. The journalist, Sarah,
    must convince her subject, Bob, to give as much information as possible for her
    hard-hitting story about mistreatment of low-level employees at the company where
    he works. There’s a lot at stake in this interaction. Bob wants to tell the truth
    without losing his job, and Sarah wants to expose the company without putting
    herself, her news site, or Bob at risk.


    Sarah’s first move is to make Bob as comfortable as possible. A comfortable level
    of pressure during an interaction can motivate the other person to make a decision
    or provide information freely, without force or coercion. Sarah chooses a public
    yet intimate space to meet with Bob—a local coworking space—that’s comfortable
    enough to motivate open information sharing. She rents out a private room with
    glass walls, ensuring their conversation is private but not restricted. She even
    chooses the seat farthest from the door so Bob feels safe to leave the conversation
    at any point.


    Once the two are seated, Sarah begins the interview by letting Bob know she’s
    aware of the risk he’s taking. She thanks him for choosing to trust her, and she
    promises not to use his name in her report. She reminds him he is free to step
    out or leave altogether whenever he wants. Then, to ensure total comfort, she
    asks him outright if there’s anything else she can do to make him feel more comfortable.


    “Is there anything I can get you? Water, tea?” she asks. “I have snack chips too.”


    “A glass of water would be nice,” Bob says.


    “No problem,” says Sarah, who pours him a glass.

