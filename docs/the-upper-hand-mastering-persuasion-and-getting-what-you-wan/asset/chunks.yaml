    一旦他建立了一个部落，弗洛伊德就开始了调查。他将“你为什么来这里？”这个问题抛回给了达尔文。接着，当达尔文没有回答这个问题而是提出了一个新问题时，弗洛伊德转移话题以继续自己的调查。达尔文对弗洛伊德的询问给出了平淡的回答，于是弗洛伊德追问更多细节，并最终触动了某种神经。“救命技术”这个词听起来很有情感。弗洛伊德先认可了达尔文（“你真高尚”），然后进一步调查，找出“救命技术”是与达尔文的自我认同或价值体系有关，还是仅仅是他投资领域中使用的一种说辞。


    达尔文通过分享一个个人故事，透露了“救命技术”对他而言具有独特的重要性。弗洛伊德随后真诚地认可道：“那太酷了。”认可可以通过其他语言、非语言符号或两者的结合来实现。


    注意，弗洛伊德还认可了达尔文一个未说出的担忧。风险投资世界围绕着金钱回报。诚然，一些伟大的想法会显而易见的胜者脱颖而出，但生存下来的风投支持企业通常也有稳健的财务计划。弗洛伊德知道这一点并认可了这一事实，展示了他对该行业的认知。


    最后，弗洛伊德产生了共鸣。他重申了达尔文的观点，用达尔文的热情来表述自己的商业想法：“我正在开发技术来帮助成瘾者恢复。”最后，弗洛伊德直接表达了共鸣，说：“拯救生命对我和我的公司也很重要。”


    每一次互动都是不同的，但这个例子展示了挖掘他人信息以建立联系并最终合作的一些方法。这段对话证明了即使是两个除了场所外没有任何共同点的完全陌生人，仍然可以建立联系。弗洛伊德本可以坐在任何其他风险投资人旁边，找到一些共同的“语言”，并获得一次路演会议——也许是一个对游戏、成瘾、心理健康或与保险公司或医疗保健提供者合作感兴趣的风险投资人。


    礼貌、诚实的对话对某些人来说是自然的，但对另一些人来说，保持对话可能很困难。有时对方并不健谈，或者他们开始谈论一个你不熟悉的话题，你不清楚如何进行调查、认可或产生共鸣。在这种情况下，有几种额外的技巧可以帮助我们使用他们的语言，即使来回对话没有多少共同点。


    - **模仿：** 当我们试图与某人建立联系时，倾向于微妙地模仿他们的语调、语速和节奏、语音旋律以及句法。即使是重复对方所说的话这种简单行为也能增加对话的益处。对模仿的研究表明，它可以为模仿者带来积极结果，例如财务利益、他人信任度的增加、销售额的提高、对请求的遵循度增加以及感知吸引力的提升。一个简单的例子是，如果你交谈的人说话缓慢且安静，你可以稍微放慢语速，增加额外的停顿，并稍微降低你的声音。


    - **主动倾听：** 主动倾听向说话者反映共情，这已被证明在对话中可以产生更积极的结果。我们通过模仿、保持眼神交流、提开放式问题以及对对方的话提供无条件的积极关注来展示主动倾听。专注于主动倾听的研究表明，它可以为模仿者带来积极结果，例如财务利益、他人信任度的增加、销售额的提高、对请求的遵循度增加以及感知吸引力的提升。


    - **开放式体语言：** 当我们试图与某人建立联系时，倾向于微妙地模仿他们的语调、语速和节奏、语音旋律以及句法。即使是重复对方所说的话这种简单行为也能增加对话的益处。一个简单的例子是，如果你交谈的人说话缓慢且安静，你可以稍微放慢语速，增加额外的停顿，并稍微降低你的声音。


    - **封闭式肢体语言：** 当我们试图与某人建立联系时，倾向于微妙地模仿他们的语调、语速和节奏、语音旋律以及句法。即使是重复对方所说的话这种简单行为也能增加对话的益处。


    ### 适应对话


    我的一个朋友曾经给我讲过失败的互动故事，完全是因为那个销售员忽略了适应。我的朋友艾莉（Aly）当时 19 岁，对买车的门门道并不了解，所以她带着父亲一起来。她找到了她想要的车——一辆`2018
    Fusion`——并准备签字。销售员在展厅里很友好且乐于助，但转而开始硬推销。


    “我们这里有几种保修，真的可以对汽车的使用产生很大影响，”那个女人说，“想让我为你过一遍这些吗？”


    艾莉看向了她父亲。


    “我们对任何保修都不感兴趣，”他说，“我为`Ford`工作很多多年了。我完全打算修理任何出现的问题。”


    “我明白了，”销售员说，抿了着嘴，“你知道的，这些车比以前复杂得多。以`AC`（空调）单元为例，它的功能与主显示器的软件结合在一起。如果`AC`坏了，你面临的问题将比简单更换零件要大得多。”


    “我确信我们能处理好，”他说。


    “艾莉，”她开始说，“我知道你父亲认为他能控制局面，但他不会永远在身边，而且你不希望你的`AC`在没有备用计划的情况下坏掉。我确定他也会赞同，他不希望自己的女儿在酷热的天气下没有`AC`的情况下开车。”


    那一刻，艾莉和她父亲都变得脸硬了。他们交换了一个眼神，意味着：这段对话结束了。艾莉的父亲盯着那个销售员，就像在看一个他刚刚用鞋底蹭过的虫子。


    “如果你们放下来任何一份不是最终销售协议的纸，我们就走人。”


    销售员脸色发白，现在显然意识到她犯了错误。

