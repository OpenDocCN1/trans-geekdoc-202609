- raw: 'In extreme situations, your emotional reactions can put you in real danger.
    Take, for example, cases of road rage—bursts of anger, aggression, or even violence
    from motorists. When someone cuts you off in traffic or swerves without warning,
    you’re likely to swell with anger. That anger comes from your fear for your own
    safety. If you act on emotional impulse, you might throw up a middle finger, honk
    your horn in anger, or toss a string of curse words out the window as the offender
    passes. If they see or hear you, it’s likely they’ll grow angry too. And when
    two angry people confront each other on the road, the results are often far more
    dangerous than they are on foot.


    Most drivers experience some form of road rage. In fact, the average driver experiences
    about 27 instances of road rage in their life.^([3](#Notes.xhtml#ch08note3a))
    Feeling road rage is one thing, but acting on it is a totally different experience.
    The people who lash out at other drivers as a result of road rage put themselves,
    and others, in danger.


    Why are people so unwilling to shelve their road rage? Psychologists believe it’s
    because they’re not actually thinking about the other people inside the cars around
    them:


    “The heavy metal of a car is a safe haven,” remarked Ava Cadell, PhD, during an
    interview concerning road rage accidents. “Road ragers don’t think about the consequences
    or even about other people on the road as real people with real families.”


    When you don’t consider the person behind the other wheel, you don’t consider
    how dangerous they can be. They might be prone to violence. They might have a
    gun, and they might be willing to use it. In fact, in the United States alone,
    at least 413 people were injured or killed by road rage incidents involving a
    gun in 2022. These incidents translate to an average of one person shot, injured,
    and/or killed every 16 hours.


    Although you might feel justified cursing at a truck while it passes you illegally
    on the shoulder, it’s best to shelve your anger. Cars are dangerous enough on
    their own—it’s in drivers’ best interest to minimize risk when on the road. You
    don’t want to risk your own safety for the sake of being right about traffic laws.
    You never know how far the other driver will go to feel superior over you.


    In an influential interaction, responding to surprise deviations like a rage-ridden
    driver will only cause you to fail. If you decide to chastise your interaction
    partner for making the wrong decision, however small it may be, you’ll lose them
    altogether. You’ll stop making them feel comfortable and trigger their stress
    response instead. Then, they’ll either dive into a rage-fueled argument with you,
    or they’ll flee the scene as fast as possible. Either way, they’ll lose trust
    in your ability to collaborate and, worst of all, the next time they’re out and
    about, they’ll avoid coming across your path ever again.


    Shelve It is hard to learn because it requires emotional discipline, but it’s
    a skill anyone can learn. However, before going through some pointers on how to
    practice, it might help to understand *why* this technique works. I hope you don’t
    find the commonalities with real-world shelves too surprising.


    ### Why It Works: Shelve It


    Shelves help us declutter. At home, shelves provide storage for all kinds of useful
    items—kitchen cabinets for dishes and utensils, garden shelves for trowels and
    pots, and bookshelves for, well, books. Putting things away on their assigned
    shelf creates the space you need to be productive. You can’t use kitchen counters
    if they’re cluttered with every dish you own. You can’t garden if the plot is
    full of spare pots. You can’t work at your desk if it’s covered in your favorite
    books. You need space to work, and shelves help provide it.


    When you choose to shelve difficult emotions, objections, and distractions during
    an interaction, what exactly are you creating space for? The answer is connection.
    Emotions, objections, and distractions are points of possible contention. When
    you clear out your differences, you leave more room for commonalities.


    With points of contention out of the way, people feel more comfortable and safer
    in interactions. This is necessary if they are to share information—especially
    private information. People are also more likely to feel comfortable entering
    into a collaboration when there are no obstacles in their way. When emotions,
    objections, and distractions are placed on the shelf, what’s left is a safe, comfortable
    space for establishing connections and forming trust.


    If you know the person you must interact with is fundamentally different from
    you, then it’s in your best interest to shelve it. You may sit on opposite sides
    of the political aisle. You may have opposing views, beliefs, or moral standards.
    However, in an influence interaction, what matters is what you have in common.
    Any differences will only get in the way.


    Instead of focusing on your thoughts and feelings, shelve them and focus instead
    on the other person’s wants, needs, and goals. This doesn’t neglect or remove
    your own motivations—they’re on the shelf, not in the garbage—but it does allow
    you to tailor your influence strategy more effectively to the person in front
    of you.


    The Shelve It practice is most valuable in the exact situations where it’s the
    hardest to use. It’s heavily based on The Upper Hand’s pinky finger: the self-identity
    preservation instinct. However, this principle is also what makes Shelve It so
    tempting to ignore. I’m talking about moments in interactions when someone, either
    accidentally or on purpose, makes a remark about something you consider near and
    dear to who you are. This insult cascades through all the Upper Hand digits—it
    threatens your identity, spikes your heart rate from anger, and makes your desire
    to cooperate fizzle out. Depending on the severity of the insult, it might even
    make you feel like your safety is at risk. I’ve had people comment on my size
    as a compliment before, but saying, “You’re so small, I could throw you across
    the room!” doesn’t exactly foster feelings of safety.


    In these moments, shelving your rebuttal can feel more like you’re betraying yourself
    than saving your chances of success. But choosing to act on your emotional response
    could cost you that elusive “yes,” so you must proceed with caution. A small verbal
    victory feels good in the moment, but that feeling fades if your actions also
    tank the deal.


    Most of us have experienced situations like these, although the severity of them
    varies. A friend of mine once went to a job interview in a business casual suit.
    Since the interviewer couldn’t see my friend’s full tattoo sleeve, he didn’t realize
    his faux pas when he mentioned the last interviewee came in with “those ridiculous
    doodles” all over their arms.


    “It’s not technically against policy,” the interviewer said, “but it’s obviously
    unprofessional.”


    My friend was tempted to rip off her suit jacket just to see the look on the interviewer’s
    face when he realized his mistake. She also considered offering up a different
    opinion, letting him know that for some people, tattoos are a form of self-expression
    that doesn’t indicate their level of professionalism. Instead, she nodded politely
    and took a long sip from a glass of water. The interviewer filled in the silence
    by starting the official interview.


    Another friend of mine was waiting for a pitch meeting to begin when one man—the
    other team’s lead—made a cutting remark about an Ivy League university. My friend,
    having graduated from the university mentioned, had to shelve a knee-jerk response
    to defend his alma mater. He knew his defense would only set him apart from these
    people, and he needed to focus on what they had in common if he wanted to sell
    them on his pitch.'
