- raw: 'Dr. Maroño offers a fascinating perspective on influence and sociability,
    portraying social engineering as the art and science of building relationships
    that are mutually beneficial, ethical, and rewarding. She redefines influence
    not as a mysterious force, but as a skill rooted in understanding human behavior
    and the factors that drive connection and cooperation. By breaking down the science
    of why certain behaviors foster trust and mutual benefit, she illustrates how
    influence is more about purposeful, prosocial efforts than manipulation. This
    approach brings clarity to the ways we can all create meaningful connections that
    are not only effective but also enjoyable.


    Every so often, a book emerges that genuinely deserves our attention, and this
    is one of those rare finds. It’s a resource for everyone—from individuals seeking
    personal insight to parents, managers, HR professionals, and negotiators. With
    clear, science-backed guidance from an author with the expertise to make these
    concepts immediately practical, this book sheds light on the workings of the human
    mind. It offers tools for enhancing relationships and communication, making it
    invaluable in both personal and professional spheres.


    *The Upper Hand* offers a fresh and ethical approach to influence, grounded in
    solid research and proven best practices. Dr. Maroño, an award-winning academic
    and gifted communicator, artfully combines storytelling with empirical science
    to share insights that resonate deeply. This isn’t about outdated tactics or instilling
    unnecessary fear, apprehension, or artificial scarcity; rather, it’s a guide to
    harnessing evidence-based, ethical strategies that build trust and foster genuine
    relationships. Dr. Maroño’s expertise shines through in every chapter, making
    complex concepts accessible, practical, and highly relevant for readers across
    personal and professional realms. From how we speak to the words we choose, you
    will quickly see that even the smallest of things matter. Your eyes will see the
    world differently, one in which influence is all around us: subtle, nuanced, pervasive,
    and inevitably shaping many of our decisions. Knowing these techniques is as important
    or perhaps even more so than utilizing these techniques.


    You don’t need a background in science or psychology to grasp the insights offered
    here, which are refreshingly clear, practical, and easy to apply. With Dr. Maroño’s
    guidance, you’ll find yourself building more meaningful connections but also having
    a greater understanding of the world around you.


    While many books offer surface-level insights, *The Upper Hand* stands apart by
    delving into the biological and neurological foundations of influence, providing
    a rich, evidence-based perspective that builds confidence in each technique. Dr.
    Maroño unpacks the science behind social engineering, a term often misunderstood,
    revealing that it’s really about creating meaningful relationships, building lasting
    foundations, and crafting solutions to social challenges.


    This book doesn’t just inform; it transforms your understanding of human connection,
    showing you why these methods work and how to apply them effectively. It may be
    the most impactful read of the decade, making now the perfect time to explore
    its insights and practical wisdom.


    Whether you’re a seasoned professional or just beginning, these principles will
    elevate your approach to connecting with others. This book is a learning journey,
    and one that will leave you not only satisfied but genuinely equipped with proven
    skills for fostering cooperation, building trust, and making an impact. Dive into
    this journey with Dr. Maroño and come away with tools to truly transform your
    interactions for a lifetime.


    —Joe Navarro


    Body Language Expert, Bestselling Author


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [INTRODUCTION](#Contents.xhtml#rintro)


    As humans, we have the innate ability to influence others. We are constantly influencing
    one another, even when we don’t know it. How we speak to others, how we dress,
    and how we interact with the world around us influences how others see us. We
    even influence people by *not* interacting with them (ever given someone the cold
    shoulder?).


    Influence is the process of affecting others’ behaviors, thoughts, or decisions.
    Most people immediately think of influence as manipulation. But, as a behavioral
    scientist, I’ve come to understand there is a distinct difference between the
    two. And, surprisingly, the most effective influence strategies in today’s connected
    world actually avoid manipulation, coercion, or high-pressure tactics. Instead,
    they rely on building trust and a desire to cooperate—innate human drives we’ve
    shared as a species for millennia.


    From my years of neurological, biological, psychological, and forensic research,
    plus my experience as a practitioner and the trusted insights of my colleagues,
    I’ve come to create a framework for connection and influence: The Upper Hand.
    I’ve been testing out these practices and principles for years, even before I
    had names for them. They helped me grow from a struggling PhD student who constantly
    heard from friends, family, and mentors that my goals were “too ambitious” to
    achieving a lifelong dream: training agents of the US Secret Service.


    The Upper Hand is a framework for using influence through ethical, mutually beneficial
    means. It takes the current science of human behavior into account, guiding its
    users through the most effective strategies for influence. Everyone who reads
    this book will leave with new strategies for connecting with others and making
    a lasting impact in their lives.


    In 2023, a (now retired) supervisory Secret Service agent sent me and my boss,
    Chris Hadnagy, an email thanking us for helping him gain a full confession from
    a suspect accused of sexually abusing a minor. It was a shock to both of us. He
    told us he listened to our podcast, *The Social Engineer*, which aims to help
    listeners learn more about psychology from various experts in the field. My series,
    *The Doctor Is In*, consists of Chris and me discussing all things psychology
    and behavioral science.


    On his way in to work, Brad turned on an episode of *The Doctor Is In*—an episode
    about learned helplessness. In this episode, I mentioned that many individuals
    who have experienced sexual abuse may attempt to regain a sense of control over
    their bodies and lives by engaging in hypersexual behavior. It’s a maladaptive
    coping mechanism to reclaim agency over their own sexuality and body.


    When Brad heard this, he felt a stroke of inspiration and approached his next
    interview from a new perspective. That morning, Brad received a full confession
    from the predator. Then he sent the email to Chris and me, informing us that,
    thanks to our episode, a predator would be put away for life. When I responded
    to Brad’s email, I told him I’d be happy to connect with him and offer any additional
    insights into his work. I was honored to contribute to putting away dangerous
    predators.


    This exchange marked the beginning of an influential relationship between Brad
    and me. We maintained a strong working relationship. Any time he reached out to
    me, I was always keen to help. I greatly admired the work he did, and I felt honored
    to contribute whenever I could.'
