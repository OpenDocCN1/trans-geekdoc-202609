- raw: 'Jay earns his powerful position every time he meets with a new client by staying
    true to himself. He exudes authenticity. Jay doesn’t see his clients as celebrities,
    but as people with whom he’d be happy to share a drink. He doesn’t enter any deals
    thinking about how the project could earn him cash or fame; he sees his projects
    as a collaboration between artist and subject, and strategizes the best way to
    meet both people’s goals.


    His mission is to keep his clients comfortable, despite the high-pressure nature
    of his work. Jay must convince every client to step out of their comfort zone.
    He needs them to be vulnerable with their bodies so their honest emotions come
    through in the photos. Whether they’re showing humility, power, confidence, sadness,
    happiness, or any combination of emotion, they have to *feel* it to show it, and
    they can’t feel anything but discomfort if Jay doesn’t lay the groundwork.


    In 2006, Jay landed his first meeting with an A-list celebrity. The client’s agency
    set the meeting in an empty conference room near their office. Jay arrived first
    and sat down in a gray chair, at a gray table, looking at the gray walls. He started
    unpacking his belongings, but after a few moments, he stopped.


    *This is awful*, he thought, watching the gray clock tick gray seconds away. (The
    second hand was red, but the seconds *felt* gray, you know?) Jay felt stifled
    here, like he was about to pitch an insurance plan instead of an art project.
    *There’s no way he’ll listen to me like this*.


    When the celebrity arrived, Jay greeted him warmly but didn’t sit back down. Before
    they dove into business, Jay moved toward the door.


    “Do you want to go get some coffee? It’s stuffy here. Let’s find a more comfortable
    place to talk.”


    “Sure,” the client said with a smile, “that sounds lovely. I know a great place
    right down the street.”


    Jay wanted out of the gray conference room because it didn’t allow him space to
    be himself. He wasn’t a businessman—he was an artist, and he felt stifled in a
    conference room. Now, in a bustling coffee shop full of sights, sounds, colors,
    and space, he felt more authentic. Instead of sitting next to each other at a
    comically large conference table, the two could sit across from each other directly,
    like two friends.


    Since then, Jay’s never taken any special considerations for his celebrity clients.
    Part of what makes Jay so appealing to his Hollywood clients is how little he
    cares about their stardom. In fact, he often goes out of his way to *ignore* any
    recent news about them, whether it’s true or not.


    “Every time I meet someone new, I like to meet them on a human-to-human level,”
    Jay told me. “I don’t want to know who they married or divorced or how long they
    were in rehab or what awards they won. I want to know how their day is going.”


    When Jay enters a business relationship with a client, he ignores whatever power
    dynamics existed before and balances out their relationship by getting to know
    the person, not the persona. He wants to work together to make the best possible
    piece of art. Once his client expresses the same goal, it doesn’t matter who’s
    more famous. All that matters is that they both succeed.


    The trust built between Jay and his clients lasts long after the photoshoots are
    finished. Since his trustworthiness is authentic, his business interactions often
    evolve into the beginning of friendships. He always gives clients his personal
    phone number, and he encourages them to reach out for any reason. Sometimes they
    do, and other times he reaches out to them—he’s the type of guy who remembers
    birthdays and anniversaries, and he’s quick to send off a celebratory text. When
    he travels for a shoot, Jay reaches out to old clients in the area, always willing
    to catch up over a cup of coffee.


    While Jay’s connections certainly help his business, that’s not the reason he
    connects with people. He genuinely cares about the people he meets. He values
    the trust he builds with them. His clients recognize his trustworthiness, authenticity,
    and professionalism, so they refer him to *their* friends, who meet him and connect
    with him just as quickly. Jay’s business thrives *because* he uses prosocial influence
    with his clients. It’s not a skill he developed as an afterthought to a successful
    business; it’s how he built his success in the first place.


    Jay’s mindset differs from other business owners who rely on short-term strategies
    to success. Other photographers see their clients as simple subjects, as valuable
    to the shoot as a bowl of fruit. These photographers enter deals thinking, “What
    can this subject do for me?” instead of a more collaborative, balanced mindset
    of, “What can we do together?” While self-serving photographers might see spikes
    of success when a photo goes viral, Jay is the one building a slow, steady, stable
    reputation in his industry.


    Business practices like the ones Jay employs demonstrate what it looks like to
    secure The Upper Hand. Lasting influence that yields long-term success needs trust.
    Trust not only makes for a more ethical exchange but ensures the people on both
    sides of an interaction feel comfortable and confident in their decision-making
    process. The “yes” we secure from using The Upper Hand is genuine, because both
    parties’ goals and expectations are aligned.


    But what happens when a business’s practices aren’t designed with trustworthiness
    in mind? What results can we expect from situations that are engineered to pressure
    the “yes” instead of securing it through ethical, considerate means? If you’re
    looking for proof that unethical influence is most likely to go wrong, you can
    find it by simply turning on your TV.


    ### Swimming with Sharks


    ABC’s *Shark Tank* is an American reality show that relies on some of the most
    high-pressure influence tactics out there. The premise of the show puts insane
    pressure on the contestants by itself—landing a spot on an international TV series
    has serious implications for the business owners—and the influence techniques
    employed by the show only make the experience more stressful, ultimately creating
    an environment rife with unethical influence.


    Each season, thousands of entrepreneurs compete to present their product to high-profile
    investors on *Shark Tank* in hopes of securing a business deal. They must make
    pitches compelling enough to convince the sharks—the investors, who are fierce,
    frenzied, and predatory—to make an offer on the spot. There are other versions
    of this show around the world, as well as similar series like *Lion’s Den Finland*
    and the Canadian *Dragons’ Den.*


    Across the United States, business owners look to this show to guide them through
    interactions in which they seek to influence investors. They falsely believe that
    when they see a shark make a deal with a business owner, they’re watching successful
    influence in action. In reality, they’re watching a high-pressure situation in
    which coercive strategies actually influence the contestants, not the sharks.


    The business owners who make pitches on *Shark Tank* and its sister shows feel
    so much pressure to secure a “yes” from the sharks, they don’t realize how the
    deal hurts them long term. This pressure comes from the people at home who support
    them, the sharks they look up to, and even the producers of the show, who warn
    entrepreneurs that if they don’t accept a deal, their segment isn’t likely to
    make the episode’s final cut. If an offer comes, the pressure to accept, negotiate,
    or decline can be overwhelming for the small-time entrepreneurs, and limits their
    critical thinking skills. They might say “yes” in the moment, but it doesn’t take
    long for the regret to sink in.'
