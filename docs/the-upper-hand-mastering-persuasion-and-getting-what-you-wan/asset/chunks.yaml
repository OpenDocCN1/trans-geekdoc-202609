- raw: 'When she sat down at her desk on that first morning, there was a T-shirt with
    the company logo folded neatly for her. Underneath was a copy of the employee
    handbook. The company’s mission was plastered across the front: “Big Benefits
    for the Little Guy.” Sue loved that her new job cared so much about the average,
    everyday person. She thought of herself as a giver, and she felt right at home
    when she saw MegaCo wanted to give too.


    Every person Sue met on her first day was kind and welcoming. They all swore by
    their jobs, saying MegaCo was the best company in the world.


    “I don’t even know what I’d do without this job,” said the receptionist. “It’s
    the best job I’ve ever had.”


    The personal sacrifices started small: Sue tried to be the first one in the office
    and the last one out. However, her coworkers were doing the same thing, so it
    wasn’t uncommon for Sue to be at her desk from 7 AM to 7 PM. She skipped lunch
    here and there to deliver a product before its deadline. She memorized the company’s
    slogan and mission statement, which was helpful, because her manager gave her
    a “company pop quiz” every few weeks.


    Before she knew it, Sue found herself a member of a corporate cult. There was
    no sign of coercion on the surface, only collaboration. It felt great to work
    in a place where everyone was on the same page, striving toward the same goal.
    Sue was rewarded for her dedication with kind words, small bonuses, and extra
    perks like coffee vouchers and coupons for the in-office masseuse.


    Her managers dangled an ever-upcoming promotion as long as she kept up the good
    work. Sue felt like a sucker on the inside, but she was too nervous to say so.
    She really wanted that promotion. Whenever anyone asked about her job, she said
    the same thing she heard on her first day: it’s the best one she’s ever had.


    Sue’s situation is probably familiar to most people: it’s easy to make one concession
    at a time, not noticing how much is given up incrementally. It’s not that people
    shouldn’t make concessions or compromise. However, being aware of these concessions
    helps us avoid sneaking influence.


    When we neglect to notice and accurately label our concessions, we can fall right
    into the palm of someone’s hand. Often, the manipulator will isolate their marks,
    so the options appear few and far between. Sue invested so much in her job that
    it became extra difficult to leave. Quitting would mean giving up not just her
    livelihood, but also her lifestyle, social circle, and a large part of her identity.


    This is where misplacing trust in the wrong person, group, or organization can
    be dangerous. But it’s hard to determine where to place trust, especially when
    it comes to the manipulators who know how to hijack our natural inclination to
    make connections. When a person escalates to isolating another human being psychologically,
    this is a very clear indication of the most devious kind of manipulation.


    ### The Psychology of Manipulation


    Manipulative people take advantage of the psychological mechanisms that encourage
    humans to share, cooperate, and connect. They hack the trust system. They tap
    into our natural prosocial instincts to develop relationships, and take advantage
    of our natural interest in positive outcomes. It’s difficult to convince another
    person to put themselves at risk for no reason, so manipulators influence how
    their marks think about the possible rewards.


    No person who is well versed in manipulation reveals controlling tendencies at
    the start of a relationship—that would eliminate trust. Instead, they only present
    their most charming traits. They appear kind, supportive, and empathetic. They
    swear that as long as you stay loyal to them, they will stay loyal to you. You
    trust them because you’re psychologically inclined to do so. After all, your friend
    trusts them. And they are in the same social club as you are.


    The first psychological mechanism that manipulators want to suppress is critical
    thought. Critical thought invites doubt, withholding, and suspicion, which are
    thought processes that threaten manipulation attempts. Some of the most susceptible
    targets for manipulation are people without sharp critical thinking skills or
    with heightened naïveté, because they don’t question a kind-presenting person.
    These victims also typically give the manipulator the benefit of the doubt.


    The critical thought process in our brains isn’t instant. We respond to new information
    emotionally before we respond logically. This happens because when we receive
    new information, it’s first processed through the amygdala—the part of the brain
    that evokes an emotional response. Then, the information is passed to the prefrontal
    cortex for interpretation. This process is why we sometimes act before we think
    in high-stress or emotionally charged situations. Taking a step back from an emotional
    impulse and waiting for the critical thought process helps us make better decisions—but
    manipulators know this, and they’ll do their best to bypass it.


    Manipulators try to bypass critical thinking by stopping the thought process *before*
    the prefrontal cortex responds. They evoke an emotional response in their victims,
    then follow it with a quick, high-pressure decision. For example, a psychic waves
    their hands and says, “I see a man with a bald head and a round belly. He wants
    to speak with you.” You picture your late grandfather. But before you realize
    that this description applies to *most* older men, the psychic follows up with,
    “He says he loves you and misses you. Do you want to speak with him?”


    This suppression strategy is often a go-to tool for cult leaders. They use this
    tactic to test the loyalty of their followers. They ask for demonstrations of
    trust, like cutting off contact with the outside world, shaving your head, or
    committing a crime on their behalf. Before you can think critically about what
    they’re asking, they shut down your thought process by accusing you of disloyalty.
    That triggers a new emotional response—fear of rejection. The leader threatens
    your bond, but they make it seem like *you’re* the one putting it at risk. By
    taking advantage of how your brain processes information, the leader manipulates
    you into acting in ways you wouldn’t normally consider.


    Another psychological process that can be hijacked is the brain’s reward system.
    Manipulators take advantage of the human brain’s neural reward network to “retrain”
    their victims’ perception of the world. The more your brain rewards you during
    interactions with a manipulator, the more bonded you feel to them, and the less
    likely you are to break your perceived connection.


    Every human brain contains a neural reward network. Specifically, the ventral
    striatum (VS), the orbitofrontal cortex (OFC), and the amygdala (alongside some
    smaller regions working in the background) work together to reward us for positive
    social interactions. The VS anticipates how rewarding the interaction may be and
    activates accordingly. The amygdala is responsible for measuring the intensity
    of an interaction as it happens. The OFC determines how positive the interaction
    is for us. The more positive, intense, and potentially rewarding the interaction,
    the more we experience a flood of positive hormones.^([2](#Notes.xhtml#ch02note2a))


    Since humans are a social species, our brains’ reward networks are extremely active
    when we experience cooperation. Whether we’re showing signs of cooperation or
    perceiving them from an interaction partner, our reward networks light up when
    they see potential for connection through cooperation. Working toward a shared
    goal—a deadline, a successful event, or even a mutually pleasant evening—is rewarding
    for everyone involved. But what happens when the goal we’re working toward is
    disingenuous?'
