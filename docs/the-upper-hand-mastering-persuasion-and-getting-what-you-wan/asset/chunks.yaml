    他成功地争取到了与超级酒店（Super 8）代表会面的机会，但这次互动将是一场苦战。首先，超级酒店曾表示过他们对国际扩张并不感兴趣。其次，将特许经营引入中国的想法并不新鲜——而且这不是他可以申请专利并留着以等待其他报价的东西。一旦米奇（Mitch）提交了商业计划书，超级酒店就可以轻松拿走他的想法并自行实施，而不需要他。在投入了两个月的心血以及巨额费用进行研究以制定这份计划书后，他*真的*想成为那个执行该计划的人。


    超级酒店可以骗取这份商业计划书，但米奇也有他的底牌：他直觉地知道如何运用`占据优势`（The Upper Hand）。虽然米奇并不知道`占据优势`这个术语，但他对人的了解足够——他们想要什么、行为如何以及如何赢得他们的信任——足以在这次互动中运用它。


    进入会议室时，米奇感到手心出汗。他把材料放在会议桌上，在与每位超级酒店代表握手之前，狡猾地在西装上擦了擦手。他确保询问了每个人的名字，甚至包括记录员。握手后，他迅速地与房间里的所有人`建立了一个圈子`（Created
    a Tribe，我们很快会详细介绍），并开玩笑说房间里没有“软面条”——每个人的握手力度都很大，他暗示这是一个吉兆。


    看到房间里的人听到他的话后微笑或会意，米奇觉得心里轻松了一些，并开始演示他的幻灯片。他通过展示与其它类似中端品牌的合作案例来证明自己的专业知识，使用了`说他们的（超级酒店的）语言`（Speaking
    Their Language）技巧。他并没有建议超级酒店要成为下一个希尔顿或四季伊酒店——他们将仍然是美国消费者可靠且实实的选择——而这恰恰是他们在海外将保留的品牌形象。事实上，米奇指出，作为一个廉价连锁，进入中国酒店市场是一项优势，因为中国许多独立旅馆的价位较低。


    超级酒店的团队成员在座位上挪动了一下。米奇不确定他们是因为好奇还是无聊，但他们都在看着他的幻灯片。偶尔，会有代表看一眼他们面前演示文稿的打印版。房间里唯一的噪音是钢笔的沙沙声——记录员正在做记录。


    米奇继续推进，直面那个显而易见的问题：他缺乏酒店行业的直接经验。他认为这是超级酒店在与他合作时最担心的问题。他通过承认自己领导项目的明显劣势，这在比喻上是`自揭了裤子`（Pantsed
    Himself）。然而，他告诉大家，他比他们能雇的任何人都更了解中国市场，而且他的商业计划书证明了他完全有能力学习门道。他谈到自己在业务关系中偏好诚实和可靠，而承认缺乏直接经验正是这种心态的一部分。


    当他到达演示的最后一张幻灯片时，每个人都向前倾斜了身体。这时屏幕黑了，记录员跳起来打开了灯。房间里的肢体语言似乎对米奇的提议给出了积极反应，但现在提出要求还为过早。他知道不能用力过猛立即索要一个“是”。

    '
