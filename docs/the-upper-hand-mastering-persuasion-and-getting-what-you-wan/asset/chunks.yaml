- raw: 'It’s crucial to use the Pants Yourself technique mindfully and ethically.
    It’s not about faking vulnerability or using it as a manipulative tactic. Instead,
    it’s about sharing your true emotions and concerns to bring people back together,
    reinforcing your efforts toward a common goal and a shared sense of understanding.


    ### How to Pants Yourself


    Why is this technique called “Pants Yourself”? It’s because it’s a way to openly,
    honestly, and ethically expose yourself to the people around you. Share your emotions.
    Share your concerns. Address the “but” in the room … as long as you say it’s *your*
    “but” (yes, this pun again). Presenting your shortcomings without passing judgment
    on them helps reduce intimidation, increase connection, and disrupt stress responses.


    If you recognize someone else is suffering during an interaction—whether they’re
    squirming under pressure, struggling to make a decision, or looking for an excuse
    to leave—pantsing yourself avoids derailing your strategy. Some people might decide
    to address the issue directly by pointing it out. “Steve, I sense you’re upset.
    Would you rather talk about this later?” Sure, this method shows emotional awareness,
    but it also might embarrass Steve. It’s an accusatory statement. You might seem
    like the one with The Upper Hand, but in reality, you’ve actually made Steve less
    receptive to your influence.


    Instead, you can set Steve free from his stressed emotional state, letting him
    out of the interaction without blame. Pants yourself by saying, “I’m sorry, I
    want to solve this problem together, but I’m losing my composure a bit. Can we
    come back to this later?” You’ve still addressed the issue directly this way.
    But by taking on the blame, you’ve also taken control of the interaction.


    When you use the Pants Yourself practice, it’s important to remain composed. Keep
    a level tone and calm body language, and make a simple statement about your feelings.
    When you express your emotions, make sure your statement is free from blame. For
    example, “I feel ignored” isn’t an emotion; it’s an interpretation of what someone
    else is doing. Instead, focus the statement on yourself: “I’m struggling to express
    my ideas in a way that’s easy to comprehend, and I’m getting frustrated.”


    Once you have stated the emotional component, suggest a time to reconvene. The
    new time will depend on the situation. Sometimes five-minute breaks are easy to
    fit in. Other times, it might be a week before you can meet with the other person
    again.


    When the situation is diffused, you can set a new strategy to gain The Upper Hand.
    If you choose to regroup after a short break, take a few minutes to read the room
    when you reconvene. If everyone’s feeling calmer, great! You can carry on with
    the interaction. However, if the tension is still in the room with you, it might
    be best to start over on a new day. Offer a follow-up meeting or reconnect with
    a text or email the next day. This approach gives everyone a chance to disconnect,
    reflect, and come back with fresh energy.


    The Pants Yourself practice is valuable when seeking The Upper Hand because it
    acknowledges that some interactions veer off course. Influence isn’t always smooth.
    People make mistakes, grow frustrated, get distracted. This practice gives agency
    back to influencers when negotiations don’t go perfectly. And in some cases, it
    can right the course of the interaction immediately.


    Not even master influencers operate without error all the time. Pantsing yourself
    destigmatizes the fumbles, blunders, and pratfalls we all experience in our everyday
    lives. It brings some levity to any interaction and reminds all involved of our
    humanity. After all, the most ethical influence cannot function without the constant
    reminder that we’re all human, and we’re all working toward the same wholesome
    goals.


    There’s a sense of freedom you gain when you embrace the power of pantsing yourself.
    It feels good to acknowledge unspoken tension. It’s nice to know others feel the
    same undercurrents of emotions in any given interaction. By bringing attention
    to it, you make it easier to solve.


    By practicing empathy, understanding, and vulnerability by pantsing ourselves,
    we can create more harmonious and respectful relationships in our daily interactions.
    The next time you find yourself stuck in a stressful, frustrating, or overwhelming
    situation, fear not! You can always find a safe way out by pantsing yourself.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 8](#Contents.xhtml#rch08)


    ## [SHELVE IT](#Contents.xhtml#rch08)


    The practice in the previous chapter, Pants Yourself, covers how to share information
    with others to make your interactions more successful. The practice you’re about
    to learn, Shelve It, covers the opposite. Shelve It is a practice in figuring
    out when to *hold back* information to earn and keep The Upper Hand.


    Imagine you’re about to sit down at your desk to work. You reach for your computer
    mouse, but it’s blocked by errant books, pens, and papers. While each of these
    items are important tools you use throughout your day, right now, they’re distractions.
    When your main goal is to check your email, anything in your way is simple clutter.


    Later in the day, when you need a pen and paper, your mouse might get in your
    way too. Your background music is invaluable during concentrated work sessions,
    but it’s a hindrance during meetings. Your team’s messaging channel is useful
    when you have questions for your coworkers, but when its incessant *ding* notifications
    pull you out of your work, it creates an obstacle to work.


    Each of these items is important to your daily work, but they’re all important
    at different times, for different reasons, and in different contexts. How do you
    clear enough space to work throughout the day while still keeping your tools within
    reach? You bring the ones you need to the center of your work, and you put the
    rest away for when you need them. In other words, you shelve them.


    When you use the Shelve It practice, you take inventory of the tools on your inner
    shelf and strategically decide what to use, what to ignore, and what to push away
    to avoid temptation. As you work toward gaining influence, there are bound to
    be some parts of yourself better left to the side, so you can focus on successful
    outcomes. Any tools you sometimes use that may cause rifts in an influence interaction—personal
    biases, beliefs, and emotional impulses—stay on the shelf.


    Since The Upper Hand has you operating from a place of open communication, some
    of your interactions are bound to take surprising twists and turns. Some conversations
    may divert into topics that make you uncomfortable, frustrated, or even upset.
    They may infringe on your personal beliefs, or they may inspire a gut reaction
    to argue against them. However, if you want to maintain The Upper Hand, you can’t
    be distracted by these small diversions from your influence strategy. Instead,
    you can acknowledge them, dismiss them, and redirect the conversation back to
    your ultimate goal.


    During influential interactions, reacting strongly to information, especially
    in a negative way, is risky. It’s one matter to react with enthusiasm (“You grew
    up near Grayshott? No way, so did I!”), because the energy spike *could* throw
    someone off, but they’re more likely to match your energy than dismiss it when
    it comes from a commonality. However, it’s another matter when your reaction is
    negative (“You like *pop music?* I’d never be caught dead listening to Lady Gaga.”),
    because it makes the person you’re speaking with feel resistance. Your response
    might be authentic, but your authenticity could cause them to bristle, which will
    throw off your strategy.'
