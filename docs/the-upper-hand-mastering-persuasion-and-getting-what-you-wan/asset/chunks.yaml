- raw: 'Many of us have seen people with a natural talent for influence. These people
    are so charming, commanding, and eloquent, they seem to have a hold on an entire
    room the moment they walk in. While it may be confounding or even annoying to
    see these talented influencers at work, with the right knowledge, anyone can appear
    just as gifted once they sharpen their persuasion skills.


    The Upper Hand is the toolkit for graduating from influencer to master. The Upper
    Hand takes the innate abilities most—if not all—human beings have; considers their
    biological, social, and psychological makeup; and uses science to build predictable,
    ethical, and consistently successful techniques that will get you a “yes” that
    lasts long after you leave the other person’s presence.


    As we’ve seen, using conventional influence techniques can secure an immediate
    “yes.” But it often leaves the person you’ve influenced feeling disconcerted,
    with a sense that something is “off.” Then, when the person has time away from
    your influence to think about the offer, your persuasion usually doesn’t last.
    I was reminded of how tenuous these immediate “yeses” can be when someone tried
    to use these techniques on me.


    In 2023, I was invited to speak on a panel for an annual cybersecurity conference.
    This event focuses on changes, updates, and strategies for protection in the cybersecurity
    industry. It was a great opportunity, and the fact that it was hosted in Barcelona
    made it even more tempting.


    The panel discussion went well, and afterward I was milling about with my own
    colleagues and attendees when a well-dressed man approached me. He looked to be
    in his mid-thirties. He introduced himself as Dylan.


    “Dr. Abbie,” Dylan said, “I just wanted to say that I loved your comments today.”


    “Thank you,” I said. He seemed pleasant enough, but he was leaning toward me in
    a way that suggested he was about to ask for a favor.


    “You know,” he continued, “I’ve just started a cybersecurity company, and I was
    wondering if you had any advice on securing grants. I took note of your strong
    academic background.”


    I acknowledged with a “mmhmm.”


    “I mean, you do behavior analysis, *and* you have a PhD in psychology? Really
    incredible CV. I’m pretty blown away!”


    I felt the tingle of alarm bells in the back of my brain. I don’t mind compliments,
    but something felt off. What was he after?


    “Thank you,” I said curtly.


    “Well, I’ll have to gather my thoughts on what sorts of support my team could
    use on the grants … Can we set up a call to talk further? I know you’re probably
    busy for the rest of the conference.”


    “Um,” I looked around for Areesa, who manages my consulting work. I couldn’t spot
    her in the crowd. I sensed if I said no, I’d be stuck in this conversation for
    longer. A “yes” was probably the quickest way to get rid of him. “Yeah, sure.”


    We exchanged contact details. At least the next time we met, it would be through
    a computer screen, and Areesa would be there to talk about consulting fees.


    The day of the meeting approached, and Dylan asked to adjust the time. Areesa
    couldn’t make the new time. I was already a bit uncomfortable, and I considered
    canceling. But if I could secure a lucrative consulting contract, it would benefit
    not only me but the whole company.


    I logged on to the meeting, and after we exchanged generic pleas-antries, I listened
    while Dylan spent 20 minutes explaining his situation: how he got started, what
    his company does, and how fast it’s growing. He told me most of the company’s
    positions were filled now, but he still needed to find a CEO. He needed to raise
    capital while he searched for someone to fill that role. Some of his business
    partners were on a board of directors for another company, and instead of consulting
    for current grant proposals, Dylan wanted me to pitch to this other company on
    his behalf.


    “I can just see you now,” he said, “stood up on a stage, representing our brand.
    I researched you earlier today, and I know these guys are gonna love the blend
    of psychology, cyber security, and your OSINT expertise … They might toss a check
    or two right up onstage with you. You really are the perfect fit.”


    Again, a flash of … nerves? Anger? It was becoming clear to me he didn’t really
    research my background or expertise that closely—I’m not an open-source intelligence
    (OSINT) expert as he mentioned.


    “Well,” I said, “here’s what I can do. I’ll connect you with Areesa, who can discuss
    details of consulting. I charge an hourly fee for my consulting work, and I specialize
    in the human side of security. I do not carry out OSINT. In the meantime, I noticed
    you don’t have a human security sector for your business—let me put you in touch
    with Chris, our CEO. He can help you there.”


    “Great, Abbie. Thanks so much, and I’ll speak with you again soon.”


    A few hours after the meeting, I had enough time to process the interaction. I
    considered the red and green flags that appeared to me in hindsight after our
    meeting. I considered our first in-person meeting as well.


    Some interactions give us “gut feelings” that are easy to dismiss. However, if
    we dissect our reactions from a biological, psychological, and sociological perspective—biopsychosocial,
    for short—we can see how gut feelings are a result of larger, more complex reactions.
    Every “sense” is a signal from the brain and body, and if we understand which
    senses we trigger in others in an interaction, we can be more ethical and effective
    persuaders. We need to avoid triggering negative, stress-stimulating senses, and
    instead trigger positive feelings that allow for critical thought and genuine
    connection.


    The first red flag came when Dylan rescheduled our meeting, excluding Areesa.
    Areesa keeps track of my availability, public presence, and level of interest
    with new opportunities—and she often measures it faster than I do myself. For
    me, a meeting on the details of my public speaking without Areesa is like a movie
    screening in a language I don’t speak.


    With this change in social dynamics, I experienced a psychological and biological
    change too. I felt less mentally prepared, which changed my emotional state from
    one of cautious optimism to nervous anticipation. My body registered the psychological
    change, and instead of seeking a reward, it switched on my threat avoidance mechanisms.
    I grew uncomfortable.


    The red flag during the virtual meeting was more subtle, but it concerned *how*
    Dylan praised me. All his “compliments” reduced me to my physical appearance.
    In fact, he admitted he “saw” me as the perfect fit for his company before he
    ever saw my credentials. He wasn’t interested in what I would say to investors
    once I was up on a stage. Well, I’m not a spokesperson, nor am I a company mascot—I’m
    a scientist, and a doctor at that.


    The discomfort I felt rising throughout that interaction came from my unconscious
    mind processing all these little jabs at once. While I consciously focused on
    him talking—and boy, did he have plenty to say—my unconscious mind processed massive
    amounts of information, parsing out the hidden messages in his words. This meant
    more cortisol, which meant more anxiety. My body and my unconscious mind wanted
    me out of the situation as soon as possible.


    When I suggested Dylan meet with Chris, I thought I’d done so genuinely, but I
    realized in hindsight I had deeper motivations. First, I wanted off that call.
    Second, I trusted Chris to give me his honest take after meeting Dylan, and I
    hoped it would align with mine. Somewhere in my mind, I knew to reach out to Chris
    to validate my “gut feeling.” I filled in Chris that Dylan would be coming his
    way, and caught Areesa up on the potential consulting work.'
  fmt: '

    Many of us have seen people with a natural talent for influence. These people
    are so charming, commanding, and eloquent, they seem to have a hold on an entire
    room the moment they walk in. While it may be confounding or even annoying to
    see these talented influencers at work, with the right knowledge, anyone can appear
    just as gifted once they sharpen their persuasion skills.


    The Upper Hand is the toolkit for graduating from influencer to master. The Upper
    Hand takes the innate abilities most—if not all—human beings have; considers their
    biological, social, and psychological makeup; and uses science to build predictable,
    ethical, and consistently successful techniques that will get you a “yes” that
    lasts long after you leave the other person’s presence.


    As we’ve seen, using conventional influence techniques can secure an immediate
    “yes.” But it often leaves the person you’ve influenced feeling disconcerted,
    with a sense that something is “off.” Then, when the person has time away from
    your influence to think about the offer, your persuasion usually doesn’t last.
    I was reminded of how tenuous these immediate “yeses” can be when someone tried
    to use these techniques on me.


    ### The Cybersecurity Conference in Barcelona


    In 2023, I was invited to speak on a panel for an annual cybersecurity conference.
    This event focuses on changes, updates, and strategies for protection in the cybersecurity
    industry. It was a great opportunity, and the fact that it was hosted in Barcelona
    made it even more tempting.


    The panel discussion went well, and afterward I was milling about with my own
    colleagues and attendees when a well-dressed man approached me. He looked to be
    in his mid-thirties. He introduced himself as Dylan.


    “Dr. Abbie,” Dylan said, “I just wanted to say that I loved your comments today.”


    “Thank you,” I said. He seemed pleasant enough, but he was leaning toward me in
    a way that suggested he was about to ask for a favor.


    “You know,” he continued, “I’ve just started a cybersecurity company, and I was
    wondering if you had any advice on securing grants. I took note of your strong
    academic background.”


    I acknowledged with a “mmhmm.”


    “I mean, you do behavior analysis, *and* you have a PhD in psychology? Really
    incredible CV. I’m pretty blown away!”


    I felt the tingle of alarm bells in the back of my brain. I don’t mind compliments,
    but something felt off. What was he after?


    “Thank you,” I said curtly.


    “Well, I’ll have to gather my thoughts on what sorts of support my team could
    use on the grants … Can we set up a call to talk further? I know you’re probably
    busy for the rest of the conference.”


    “Um,” I looked around for Areesa, who manages my consulting work. I couldn’t spot
    her in the crowd. I sensed if I said no, I’d be stuck in this conversation for
    longer. A “yes” was probably the quickest way to get rid of him. “Yeah, sure.”


    We exchanged contact details. At least the next time we met, it would be through
    a computer screen, and Areesa would be there to talk about consulting fees.


    ### The Virtual Meeting


    The day of the meeting approached, and Dylan asked to adjust the time. Areesa
    couldn’t make the new time. I was already a bit uncomfortable, and I considered
    canceling. But if I could secure a lucrative consulting contract, it would benefit
    not only me but the whole company.


    I logged on to the meeting, and after we exchanged generic pleas-antries, I listened
    while Dylan spent 20 minutes explaining his situation: how he got started, what
    his company does, and how fast it’s growing. He told me most of the company’s
    positions were filled now, but he still needed to find a CEO. He needed to raise
    capital while he searched for someone to fill that role. Some of his business
    partners were on a board of directors for another company, and instead of consulting
    for current grant proposals, Dylan wanted me to pitch to this other company on
    his behalf.


    “I can just see you now,” he said, “stood up on a stage, representing our brand.
    I researched you earlier today, and I know these guys are gonna love the blend
    of psychology, cyber security, and your `OSINT` expertise … They might toss a
    check or two right up onstage with you. You really are the perfect fit.”


    Again, a flash of … nerves? Anger? It was becoming clear to me he didn’t really
    research my background or expertise that closely—I’m not an open-source intelligence
    (`OSINT`) expert as he mentioned.


    “Well,” I said, “here’s what I can do. I’ll connect you with Areesa, who can discuss
    details of consulting. I charge an hourly fee for my consulting work, and I specialize
    in the human side of security. I do not carry out `OSINT`. In the meantime, I
    noticed you don’t have a human security sector for your business—let me put you
    in touch with Chris, our CEO. He can help you there.”


    “Great, Abbie. Thanks so much, and I’ll speak with you again soon.”


    ### Analyzing the Red and Green Flags


    A few hours after the meeting, I had enough time to process the interaction. I
    considered the red and green flags that appeared to me in hindsight after our
    meeting. I considered our first in-person meeting as well.


    Some interactions give us “gut feelings” that are easy to dismiss. However, if
    we dissect our reactions from a biological, psychological, and sociological perspective—biopsychosocial,
    for short—we can see how gut feelings are a result of larger, more complex reactions.
    Every “sense” is a signal from the brain and body, and if we understand which
    senses we trigger in others in an interaction, we can be more ethical and effective
    persuaders. We need to avoid triggering negative, stress-stimulating senses, and
    instead trigger positive feelings that allow for critical thought.


    The first red flag came when Dylan rescheduled our meeting, excluding Areesa.
    Areesa keeps track of my availability, public presence, and level of interest
    with new opportunities—and she measures it faster than I do. For me, a meeting
    on the details without Areesa is like a movie screening in a language I don’t
    speak.


    With this change in social dynamics, I experienced a psychological and biological
    change too. I felt less prepared, which changed my emotional state from one of
    cautious optimism to nervous anticipation. The red flag during the virtual meeting
    was more subtle, but it concerned how Dylan praised me. All his “compliments”
    reduced me to my physical appearance. In fact, he admitted he “saw” me as the
    perfect fit for his company before he ever saw my credentials. He wasn’t interested
    in what I would say to investors once I was up on a stage. Well, I’m not a spokesperson,
    nor am I a company mascot—I’m a scientist, and a doctor at that.


    The discomfort I felt rising throughout that interaction came from my unconscious
    mind processing all these little jabs at once. While I consciously focused on
    him talking—and boy, did he have plenty to—my unconscious mind processed massive
    amounts of information, parsing out the hidden messages in his words. This meant
    more cortisol, which meant more anxiety. My body and my unconscious mind wanted
    me out of the situation as soon as possible.


    When I suggested Dylan meet with Chris, I thought I’d done so genuinely, but I
    realized in hindsight I had deeper motivations. First, I wanted off that call.
    Second, I trusted Chris to give me his honest take after meeting Dylan, and I
    hoped it would align with mine. Somewhere in my mind I knew to reach out to Chris
    to validate my “gut feeling.” I filled in Chris that Dylan would be coming his
    way, and caught Areesa up on the potential consulting work.

    '
  trans: '


    我们中的许多人都见过那些天生具有影响力天赋的人。这些人充满魅力、威严十足且口才伶俐，他们一走进房间，似乎就能掌控全场。虽然看到这些才华横溢的影响者大作为可能会让人困惑甚至恼火，但只要掌握正确的知识，任何人在磨炼说服技巧后，都可以变得像他们一样天赋异禀。


    《上位优势》（The Upper Hand）是从影响者蜕变为大师的工具箱。它利用了大多数（如果不是全部）人类拥有的内在能力；考虑了他们的生物、社会和心理构成；并利用科学构建出可预测、符合道德且持续成功的技巧，这些技巧将让你在离开对方现场很久之后，依然能获得一个持久的“是”。


    正如我们所见，使用传统的影响力技巧可以获得即时的“是”。但它往往会让你影响的人感到不安，觉得有些“不对劲”。那么，当那人远离你的影响并开始思考那个提议时，你的说服力通常不会持久。当有人试图在我身上使用这些技巧时，我想起了这些即时的“是”是多么脆弱。


    ### 在巴塞罗举办的网络安全大会


    2023 年，我受邀参加一个年度网络安全大会的小组讨论演讲。该活动关注网络安全行业的变化、更新和保护策略。这是一个极佳的机会，而会议在巴塞罗纳举办的事实让它更具吸引力。


    小组讨论进展得很顺利，结束后，我正和自己的同事以及与会者一起走动，这时一位西装革履的男子走向了我。他看起来三十出头。他自我介绍自己叫迪兰（Dylan）。


    “Abbie 博士，”迪兰说，“我只是想说，我非常喜欢你今天的观点。”


    “谢谢，”我说。他看起来挺和蔼的，但他向我倾斜的姿势暗示他正准备寻求帮助。


    “你知道的，”他继续说道，“我刚创办了一家网络安全公司，我想知道你在获取资助方面有什么建议吗。我注意到了你深厚的学术背景。”


    我发出了“嗯”的示意。


    “我的意思是，你做行为分析，*而且*还有心理学博士学位？简历简直不可思议了。我完全被震撼了！”


    我感到脑后部响起了警报声。我不介意赞美，但有些感觉不对。他想要什么？


    “谢谢你，”我简短地回答。


    “好吧，我得整理一下我的团队在资助方面可能需要哪些类型的支持……我们可以安排一次电话详谈吗？我知道你在会议接下来的时间里可能很忙。”


    “嗯，”我环顾寻找管理我咨询工作的阿里莎（Areesa）。我在人群中没有发现她。我感觉到如果我拒绝，我就会被困在这段对话中更久。说声“好”可能是打发他最快的方法。“好的，没问题。”


    我们交换了联系方式。至少我们下次见面就会通过电脑屏幕了，而且 Arees 莎会在那里讨论咨询费的问题。


    ### 虚拟会议


    会议日期临近，迪兰请求调整时间。Arees 莎没时间参加新时间。我已经感到有些不舒服，并考虑过取消。但如果我能获得一份丰厚的咨询合同，不仅对我自己，对整个公司都有处处。


    我登录会议，在交换了一些场场客套的问候后，我开始倾听，迪兰花了 20 分钟解释他的情况：他是如何起家的，他的公司是做什么的，以及增长有多快。他告诉我公司大部分职位现在已经填满了，但他仍然需要寻找
    CEO。他在寻找合适人选的同时需要筹集资金。他的的一些业务伙伴在另一家公司的董事会中，迪兰不想让我为目前的资助提案提供咨询，而是希望我代表他向那家公司进行推销。


    “我能想象出你的样子，”他说，“站在台上，代表我们的品牌。我今天早些时候查了你的资料，我知道那些家伙会喜欢心理学、网络安全以及你对`OSINT`（开源情报）专长的结合……他们可能会直接在舞台上给你递上一两张支票。你真的是最完美的人选。”


    再次，闪过一丝……紧张？愤怒？对我来说已经很清楚，他并没有真正仔细研究过我的背景或专业知识——我并不是他所说的开源情报（`OSINT`）专家。


    “好吧，”我说，“我可以这么做。我会帮你联系上 Arees 莎，她可以讨论咨询的细节。我的咨询工作按小时收费，我专长安全领域的人性方面。我不开展`OSINT`工作。同时，我注意到你的业务还没有人为安全部门——让我联系我们的
    CEO 克里斯（Chris），他可以在那方面为你提供帮助。”


    “太好了，Abbie。非常感谢，我们很快会再联系。”


    ### 分析红灯与绿灯


    会议几小时后，我有足够的时间处理那次互动。我思考了事后对我出现的红灯（警示信号）和绿灯（积极信号）。我也考虑了我们第一次面对面的交流。


    有些互动带给我们的“直觉”，这些直觉很容易被忽视。然而，如果我们从生物、心理和社会学的角度来剖析反应——简称为生物心理社会模型（biopsychosocial），我们就能看到直觉是复杂反应的结果。每一个“感”都是大脑和身体的信号，如果我们了解自己在互动中触发了哪些感，我们就能成为更有道德且更有效的说服者。我们需要避免触发负面的压力感，转而引发批判性思考的积极感受。


    第一个红灯出现在迪兰重新安排会议并排挤 Arees 莎时。Arees 莎监控我的空档、公众形象以及对新机会的兴趣——她比我衡量得更快。对我来说，没有 Arees
    莎参与的细节讨论就像看一场我听不懂语言的电影。


    随着这种社交动态的变化，我也经历了心理和生理上的变化。我感到准备不足，这让我的情绪状态从谨慎乐观转变为紧张的期待。虚拟会议中的红灯更为微妙，但它关乎迪兰是如何赞美我的。他所有的“赞美”都将我简化为了我的外表。事实上，他承认在看清我的资历之前，就已经将我看作他公司的完美人选。他并不在乎我站在台上对投资者会说什么。好吧，我不是发言人，也不是公司的吉祥物——我是一个科学家，而且还是博士。


    在整个互动中我感到的不适源于我的潜意识在同时处理这些微小的冲击。当我主意识聚焦在听他说话时（他确实有很多话想），我的潜意识在处理海量信息，解析着他话语中的隐藏信息。这意味着更多的皮质醇分泌，意味着更多的焦虑。我的身体和潜意识想让我尽快离开这个境地。


    当我建议迪兰见见克里斯时，我以为我是出于诚意，但事后我意识到我有更深层的动机。首先，我想结束那通电话。其次，我信任克里斯在见到迪兰后会给我真实的看法，我希望这能与我的观点一致。在我的脑海深处，我知道要联系克里斯来验证我的“直觉”。我向克里斯告知了迪兰会找他，并向
    Arees 莎同步了潜在的咨询工作。


    '
