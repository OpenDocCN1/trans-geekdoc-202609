- raw: 'So what is influence exactly, and how does it differ from social engineering?
    While many of us have undoubtedly heard the word “influence” in dozens of contexts,
    our idea of what it means in a biopsychosocial context may be a bit skewed. The
    word “influence” has taken on a negative connotation over the last few decades.
    Social media’s propagation of “influencers” makes us think of vapid, low-effort
    salespeople pushing products in obvious and sometimes subliminal posts. Being
    “under the influence” of a substance or person conjures the idea of not being
    in control of our own actions.


    It’s difficult to say influence in and of itself is positive or negative. Humans
    influence one another every day. How you answer the phone influences how the caller
    responds. When you give advice to a trusted friend, you may influence their decisions.
    When you make silly faces at a wailing baby, you attempt to influence their mood
    in hopes that the baby smiles, laughs, or at least stops crying. These instances
    of influence aren’t malicious or selfish—they pepper our daily lives with meaning
    and connection.


    Since influence itself is neither wholly positive nor negative, most people will
    say the *way* we influence others is either positive or negative. Influencing
    and being influenced is inescapable, but there is a line between ethical and unethical
    methods of influence. Putting someone in a state of stress where that pressure
    can induce a “yes” is unethical. But being transparent, presenting options, and
    then receiving a “yes” is perfectly ethical.


    When we think about what it means to influence others, many of us shy away from
    the idea. We think influencing someone else means breaching their trust. However,
    influence is only successful because others trust us.


    Social engineering is an oft-misunderstood subcategory of influence. Chris has
    a clear definition for the term, and he’s been using it for the last few decades:
    “Social engineering is any act that influences a person to take an action that
    may or may not be in their best interest.”^([2](#Notes.xhtml#ch01note2a)) The
    definition is broad because social engineering isn’t always positive or negative.
    Sometimes, social engineering helps “human hackers” break into secure systems,
    from email addresses to government networks. Other times, social engineering helps
    crisis counselors calm down a victim to help them start their healing process.


    Social engineering is a practice for eliciting information from others—and with
    the power to draw out information (of all kinds) comes great responsibility. Information
    elicitation on its own is not inherently good or evil. Manipulating a situation
    to extract a social security number from a victim to use in fraudulent activities
    is obviously unethical. However, eliciting information from a stranger in a waiting
    room about where they’re from, why they’re waiting, and what kind of movies they
    like is simply the beginning of a connection.


    Many people only consider social engineering’s negative tactics. And it’s true
    that con artists and fraudsters do sometimes employ principles of social engineering.
    Creating a situation rife with panic, fear, and confusion *is* social engineering.
    However, the crucial separation between positive and negative social engineering
    is the *intention* behind the act. If someone uses social engineering to swindle
    another person, their intention is unethical, but that doesn’t make the method
    morally wrong. Without factoring intention, social engineering may sound like
    subterfuge, but it really depends on the goal.


    Say, for example, you want to buy a friend the perfect surprise birthday gift.
    Using techniques from social engineering, it’s possible to find out what they
    want without asking outright. You can find indirect, unsuspecting ways to ask
    what they might want (or need). When you’re over at their house next, you might
    notice they use a beat-up cheese grater, possess a rusty watering can, and are
    self-conscious about their lack of throw pillows and blankets. The next time the
    two of you are talking decor, you ask guiding questions that reveal their aesthetic
    preferences and how frequently they shred cheese. You might note that they’re
    highly accident-prone, so a cheese grater with an added safety mechanism is the
    best choice. After some first-class noticing and social engineering to elicit
    information, you can be confident in which gift will produce the most delight.
    This is social engineering used for good—otherwise known as prosocial engineering.


    Prosocial engineering involves purposely influencing another person toward cooperation
    without the intention to cause psychological harm. In the personal and professional
    realm, opportunities for influence appear on a daily basis. Influencing your boss
    to let you take on more responsibility could lead to a resume and salary boost
    for you, and your boss being able to go home by six o’clock instead of eight.
    Mending a rift between two colleagues could mean less drama in your day-to-day
    work life. Persuading a friend who loves ramen to try pho could open up their
    palate to a whole new cuisine—and if they hate it, now you know for sure you’ll
    need to find another friend if you want to try the next new pho restaurant that
    opens. Knowing the benefits you reap from interactions go hand in hand with others’
    rewards—this is how you become a prosocial engineer. The choices we make define
    who we are, who we will be, and how others see us.


    Prosocial engineers recognize the value in understanding fundamental human desires
    for connection, safety, and valuable relationships. They approach all interactions
    from an empathetic, cooperative perspective. They want more than a transaction
    with the people they influence—they want a long-lasting collaboration that reaps
    rewards for both sides. Prosocial engineers don’t convince others to work *for*
    them; they convince others to work *with* them to reach a shared goal.


    A prosocial engineer operates like a gardener in their greenhouse, fostering each
    relationship based on what best helps it grow. Each plant in the greenhouse has
    different needs—soil density, water tolerance, sunlight sensitivity—but the basic
    principles of plant growth are the same. Similarly, even though every human has
    a unique perspective, experience, and drive, the fundamental functions of our
    brains are the same. Botany helps us understand how plants thrive and grow. Psychology
    helps us understand how other humans think. That’s why The Upper Hand works—it’s
    the hand that encourages growth in the form of thriving, cooperative relationships.


    Instead of aiming to control interactions, prosocial engineers aim to shape the
    flow of conversation toward mutual success. No one can fully control every factor
    of an interaction without coercive control—it would be as impossible as growing
    a tree without light, water, or soil. Instead, prosocial engineers arm themselves
    with knowledge about how to best encourage growth, then adapt their strategies
    to make sure their efforts are fruitful.


    Prosocial engineers leave others better off, just for the simple act of meeting
    them.


    At Social-Engineer, we keep this mantra front and center because of the nature
    of our work. Many of our engineers teach clients about social engineering by showing
    them how it can be used against them. The analysts hack into systems, elicit personal
    information, and emulate real-world attacks, all to help clients find their vulnerabilities.
    It’s tempting to resort to unethical practices for the sake of training—after
    all, that’s what the real bad guys would do—but we avoid making clients feel vulnerable
    or discriminated against, since doing so would make them too uncomfortable to
    learn from us. By keeping the company motto in mind, we all remember to focus
    on education, not manipulation.'
