- raw: 'In the coming sections, we’re going to address the three most common misconceptions
    about influence. The first concerns the addition of the word “prosocial.” While
    influence is about getting what you want regardless of means, prosocial influence
    takes an ethically informed approach that ensures your strategies avoid manipulation,
    coercion, or other unethical forms of influence. The second misconception surrounding
    influence is the idea that it requires you to exude confidence or power, even
    if doing so doesn’t reflect your most authentic self. The final misconception
    concerns the definition of successful influence. You might think you’ve succeeded
    if you convince the other person to strike a deal with you, but those deals don’t
    always turn out well in the long run and may even come back to haunt you later.


    These misconceptions about influence stem from the people who rely on short-term
    techniques. When people rely on short-term influence strategies to secure a single
    “yes” from others, they fail to realize how temporary that “yes” is. They only
    secured cooperation under the guise of the false information they provide, whether
    it concerns their motives, personality, or mutual success. As soon as the person
    they’ve influenced sees through them, the relationship is over.


    I came across one of these flimsy influencers when I first started working in
    the private sector. One woman, I’ll call her Diane, introduced herself to me right
    away. She claimed she was an ally, and she looked the part of a professional.
    She seemed to share my genuine passion for behavior analysis, and she was always
    quick to ask about my most recent projects, theories, and breakthroughs. I thought
    she was interested in my work … until I saw the truth.


    One day, I sat in on one of Diane’s presentations. I wanted to show my support
    for someone I thought was a friend and colleague. Imagine my surprise when her
    main theories looked identical to my own. I even recognized a few tidbits I’d
    discussed with *other* coworkers. Her presentation was a patchwork of stolen ideas.


    *Okay, Abbie, let’s not jump to conclusions,* I thought, seething nonetheless.
    *Science is collaborative. Maybe she simply forgot to cite you.*


    Then it happened again. And again. Her work landed her promotion after promotion,
    despite her only skill appearing to be wrapping up other people’s ideas in neat
    little packages. She cleverly aligned herself with the more prestigious people
    in the industry, and she rode their coattails up the ranks. She created flimsy
    relationships to secure referrals for new business. She landed public speaking
    roles by presenting other people’s work. She went from an associate to a trainer
    in less than a year, all because she was charming and presented like a hard worker.


    Meanwhile, I bided my time and took the slow road. I ensured every concept I claimed
    was entirely my own. I collaborated with others, but I made sure never to overstep
    their expertise or discredit their contributions. I wasn’t as quick to land speaking
    roles or training groups as Diane, but I felt morally sound in my long-term strategy.


    A few years in, Diane suggested forming a supportive think tank for some of the
    women in our field. I joined with a few of my colleagues. The group was meant
    to be an informal meeting of the minds, giving us the platform to discuss our
    works and potentially link up to work out some issues together. Diane also claimed
    it would be a bonding experience.


    “Don’t be surprised if we all hate each other by the end of this,” she said with
    a laugh on that first day. “That’s just what happens when you have honest conversations
    with each other.”


    The rest of us shared an uneasy look, as if to say, *Um, no, that’s not my experience.*
    In the weeks that followed, the group devolved from a professional think tank
    to a reality TV aftershow. Every time one of us brought up a new idea, Diane redirected
    the conversation with her bile, saying things like, “It’s interesting you bring
    that up, because just yesterday, Abbie mentioned to me that you’re not even qualified
    in that field.”


    In reality, I’d simply mentioned to Diane that the idea was so prevalent in the
    scientific community that it was attracting the attention of researchers outside
    of its main discipline. Diane took my words and twisted them into an insult directed
    at the people I saw as friends and colleagues. And she didn’t just do it to me—each
    of us, when presented from Diane’s perspective, *did* hate each other.


    After a few weeks of this “group,” one of the women asked if we could talk. She
    told me that no one wanted to go back because of how Diane made them feel. She
    seemed more like a puppet master than a coach, and they were tired of her tugging
    on their strings. Plus, as one of them pointed out, she was clearly using the
    science they discussed in the group to inform her new speeches. So, the group
    disbanded, and none of us left with a shred of trust for Diane.


    We weren’t the only ones to lose taste for Diane after only a few weeks. The more
    I paid attention to her, the more I saw her short-term influence wear off. For
    example, she secured quite a few public talks, but she never secured them twice.
    No one asked her to return for follow-up events. She took on new clients, but
    once those contracts ended, she never heard from them again. She looked the part
    of a valued employee, but she was never invited out with anyone when the day ended.
    She had no relationships in the office. Any time she made a connection at work,
    she drained it for all it was worth, then tossed it aside.


    Like anyone who relies on manipulation and false personas, Diane’s resources were
    finite. It only took a few years for her to reach the limits of her influence.
    By refusing to consider how her relationships could be mutually beneficial, Diane
    caused people to distance themselves from her to avoid her one-sided “cooperative”
    proposals. People learned to keep their mouths shut when she entered a room. If
    Diane’s name was attached to new projects, no one wanted to work on them. Her
    speaking engagements dried up, and no new organizations would hire her—by then,
    word had spread about her tendency to “borrow” ideas from other, more qualified
    professionals.


    On her journey to success, Diane burned every bridge she crossed the moment she
    reached the other side. She didn’t think about the consequences until she faced
    the edge of a cliff with no support and no way to backtrack. Meanwhile, the rest
    of us took longer routes to success. We learned how to build bridges together.
    When we reached the same cliff face, we supported each other. We crossed over
    and left Diane behind. If she didn’t want to succeed together, we were fine with
    leaving her to face her mistakes.


    ### Single-Serve Sales


    There’s no doubt that manipulation, coercion, and domination can be effective
    influence techniques. They work well for single-serve interactions where the influencer
    and influencee aren’t expecting to interact again. However, they’re detrimental
    for people who want ongoing relationships with others. How often do car salespeople,
    cold callers, or knickknack hawkers expect repeat customers? Without concern for
    long-term relationships, they’re free to choose their influence strategy based
    on single interactions. However, people with long-term aspirations, like managers,
    executives, leaders, and teammates, can’t rely on short-term tactics.


    For an example of short-term success, look no further than New York City, especially
    around Times Square. Here, the streets are littered with street vendors selling
    everything under the sun: faux designer bags, “custom” artwork (purchasable in
    bulk), the full box set of *Law & Order* on DVD, homemade jewelry, and more. These
    vendors may tell you the bags are genuine, the art is handmade, and a full *Law
    & Order* set is impossible to find anywhere else.'
