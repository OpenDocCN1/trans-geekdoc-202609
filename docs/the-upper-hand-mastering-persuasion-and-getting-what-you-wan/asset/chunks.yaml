- raw: 'By trying to be someone he’s not, Joey accidentally embarrasses himself (or
    would have, if he was smart enough to understand his mistake) and puts his friends’
    adoption efforts at risk. He only resolves his mistake by delivering a new, meaningful,
    authentic letter directly to the adoption agency. Monica and Chandler panic at
    first … until the adoption agency calls them geniuses! By securing a letter from
    a child, they demonstrated how well the couple speaks the same language as him—they
    guessed little Joey must be eight or nine, based on his drawings!


    When I interviewed for the lecturer position, I didn’t try to be someone I’m not.
    I simply showcased the parts of myself that would best fit the university’s mold.
    That doesn’t mean the other parts of me were hidden; I didn’t hide my lack of
    lecturing experience or my missing certifications. Instead, I showcased my willingness
    to learn and earn.


    We all speak many languages, sometimes on a daily basis. The way we interact with
    our families differs from how we interact with our coworkers. We greet our friends
    differently than we greet strangers at checkout counters. The jokes we tell our
    partners might not translate well in polite company, but that doesn’t stop us
    from cackling in the privacy of our own homes. We adjust and adapt to keep ourselves
    and the people around us comfortable. It’s part of being human.


    We put more conscious effort into sharing a language when we put together job
    applications. We’ve all taken job descriptions and matched some of the language
    with our qualifications on paper. Tailoring a resume and cover letter with keywords
    you believe will catch the hiring team’s attention isn’t dishonest; it’s just
    good job-hunting.


    There’s nothing wrong with bringing someone’s attention to your most complimentary
    traits. As long as you aren’t hiding your authentic self in the process, you can
    maintain honest, inviting interactions this way. The university lecturers wanted
    to know about my qualifications for the job, so I spoke the educators’ language.
    It’s not the language I’d use with my dad, my best friend, or the barista at my
    local coffee shop. But it was the best fit for this particular interaction, and
    it undoubtedly influenced the eventual job offer I received from Northampton.


    ### Why It Works: The Comfort of Commonalities


    When you’re a stranger in a strange land, your brain goes into high alert. You
    stay on the verge of a full fight-or-flight response, constantly scanning for
    any threats to your survival. You could be all alone or surrounded by people,
    but if you can’t communicate effectively with them, they do nothing to ease your
    nerves. They might even make you more nervous. But recognizing the sound of your
    own language sends out a signal of potential safety, and your brain urges you
    to follow that voice!


    Whether you’re lost in the Peruvian jungle or acting as a sole company representative
    at a convention, finding someone who speaks your language motivates you to connect
    with them, and vice versa. It’s a strength-in-numbers instinct. That initial connection
    grows as you two uncover shared beliefs, histories, and aspirations. The more
    you relate, the stronger your desire to collaborate becomes.


    We’re considering The Upper Hand’s thumb and pinky for this practice: We Are Our
    Brains and Self-Identity Protection. To speak someone else’s language, we must
    recognize the cognitive functions and biases that impact how others move through
    the world. Once we have a basic understanding of a person’s worldview, we can
    use that information to influence our approach. Then, we can form a stronger connection,
    which increases the odds for successful influence.


    People will likely have a hard time communicating with someone who literally doesn’t
    speak their language, but so, too, is it difficult to communicate with someone
    who speaks a language of different values and morals. We (and our brains) like
    to confirm and validate our existing beliefs, and we gravitate toward people and
    groups who facilitate this. We’re more likely to be convinced of messaging when
    it comes from someone in our in-group.


    The tendency to seek out what confirms or strengthens our world view is called
    confirmation bias, and it applies to information as well as connections. Conflicting
    information, especially when it applies to our worldview, is psychologically distressing.
    The brain would much rather reinforce (and seek reasons to reinforce) existing
    neural pathways than challenge them or break them down. As powerful and adaptive
    as they are, brains want to conserve energy, and deviating from existing neural
    pathways to create new ones is energy heavy.


    Familiarity is psychologically safer than its opposite. When we speak someone’s
    language, we suggest a familiarity with what they hold sacred. We set their minds
    at ease by assuring them we’re not a threat to their worldview. We make them feel
    comfortable by validating their self-identity, or at least validating their desire
    to keep it intact. We make them want to work with us because we assign ourselves
    to the same in-group, the same team, which helps the other person feel their self-identity
    is safe.


    Each of us has a sense of who we are, however blurry that sense may be. In sociology,
    the concept of the self and self-identity is separate; the self (the essence of
    a person) is a mental concept of who a person is across contexts, built from social
    relationships and socializations. Self-identity is separated because sociologists
    believe each person has multiple identities to use in different social settings.
    For example, you might have one self-identity you use with your friends and another
    you show in the workplace. The clothes you wear, the jokes you make, and the tasks
    you take on are probably different in each setting.


    Our self-identities are built out from our perceptions, beliefs, and values concerning
    the world around us. The three main components of our sense of self are how we
    value ourselves, how capable we feel, and how much control we have over our own
    lives.^([2](#Notes.xhtml#ch06note2a)) Our values around loyalty, creativity, and
    compassion may be strong across all identities, but manifest differently depending
    on the setting. The one piece all our identities have in common is how valuable
    they are to us.


    My work is a massive part of all my identities. I consider myself a scientist
    above all else. Whether I’m actively working or hanging out with my friends, my
    identity as a scientist saturates my sense of self. I’ve said it before in this
    chapter and I’ll undoubtedly say it again before the book is through—the best
    way to get me going is to ask a question about psychology. You start speaking
    my language with science, and I’ll keep talking until you stop me.


    Since my professional passions are always at the forefront of my identity, I’m
    also quick to recognize people who try to influence me without appealing to my
    identity. And if someone either accidentally or purposefully insults my role as
    a scientist, it’s almost guaranteed I’ll never willingly collaborate with them.
    My worldview is shaped by science, and if I can’t share it, I can’t share myself.'
