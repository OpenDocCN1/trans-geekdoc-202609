- raw: 'Every new interaction is a game. The rules follow a basic risk-versus-reward
    pattern: you give information—a risk—in hopes of receiving a helpful response—a
    reward. In a job interview, you provide information about your professional life
    in hopes of “winning” a job offer. On a first date, you give information about
    yourself in hopes of “winning” a relationship—or at least a second date. When
    you tell your doctor about the strange symptoms you’re experiencing, you’re hoping
    to “win” a diagnosis and a treatment plan.


    When you approach interactions with the sole intent of coming out the winner,
    you add a new rule: someone has to be the loser. But not all interactions must
    end with a winner and a loser. In fact, the best interactions are the ones where
    everyone wins. A successful interview ends with both the interviewer and interviewee
    feeling excited about their interaction. A great first date means both people
    enjoyed their time together. A successful medical appointment ends with a satisfied
    patient and a doctor who has completed a job well done.


    The Upper Hand is an influence strategy for “winning” interactions without requiring
    a “loser.” I’ve spent years studying nonverbal communication, trust, and the psychological
    mechanisms underpinning human decision-making. I’ve learned even the most high-stakes,
    stressful interactions can end in a mutually beneficial agreement. And I designed
    the techniques of The Upper Hand to promote influence without stealing, scamming,
    or coercing someone else.


    Gaining The Upper Hand requires strict ethical values—it’s a form of prosocial
    engineering. Prosocial engineering is as it sounds—it’s the positive side of social
    engineering. It involves purposely influencing another person toward cooperation
    without the intention to cause psychological harm. It is devoid of any negative
    intentions, and works to advance the collective good, not exploit it. In the personal
    and professional realm, opportunities for influence appear on a daily basis. We
    are presented with situations we could benefit from, and we must make decisions
    that either help or hurt us, and help or hurt others. The choices we make define
    who we are, who we will be, and how others see us.


    In a world where companies and customers, business associates, interested parties,
    and stakeholders are more connected than ever before, it’s essential to make use
    of The Upper Hand. Positive interactions (business reviews, references, etc.)
    come from prosocial engineering strategies. Sticking to ethical influence techniques
    leads to better long-term relationships and more beneficial outcomes, which serve
    our best interest for decades.


    And when we secure a “yes,” it’s not a coerced, tentative “… sure.” It’s a “Hell
    yes, let’s do it!”


    Throughout this book, we’ll dive into the latest persuasion science and dissect
    how the current literature doesn’t go far enough to explain how many of the traditional
    influence tactics actually work (and why in certain situations they fail outright).


    But before we can get into all of that, we need to address a common *resistance*
    to adopting social engineering and influence strategies: the pervasive myth that
    using any form of influence means manipulating others. The field of influence
    is sometimes overshadowed by the dark, dirty, and downright devious tactics used
    by con artists and swindlers. Before we can fully explore the light side of influence—prosocial
    engineering—we must be aware of what happens on the dark side.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 2](#Contents.xhtml#rch02)


    ## [THE DARK SIDE OF SOCIAL ENGINEERING](#Contents.xhtml#rch02)


    Social engineering is a popular weapon for con artists, manipulators, and gaslighters
    who wish to win over their marks by nefarious means. They use influence tactics
    to gain a mark’s trust, then swindle, emotionally harm, or take advantage of them.
    Their stories are passed along in hopes that the more people there are who know
    about their schemes, the fewer people will fall for them.


    We can’t let swindlers, fraudsters, and manipulators mar the reputation of social
    engineering and persuasion. Instead, we can combat their negative influence by
    learning to recognize their go-to techniques. Once we see how *not* to use influence,
    we’re better positioned to see how to use it properly for positive, ethical gains.


    Influence and social engineering rely on trust. Gaining trust quickly and easily
    is a skill that can be used for good or for evil. In the hands of a grade school
    teacher, championship softball coach, or visionary entrepreneur, this talent can
    be the difference between making an impact or falling flat. However, in the hands
    of someone with negative intentions, like a con artist, a white-collar criminal,
    or a fraudster, misplaced trust can lead to serious harm. Gaining trust through
    honest means requires similar skills and techniques to gaining trust dishonestly.
    What differs is how the trust is used once it’s gained. By studying people who
    have made a living off abusing others’ trust, we can learn their most common techniques
    and avoid falling prey to them … or repeating them.


    William Fink, a wealthy real estate man, was on a business trip to Miami in the
    year 1908.^([1](#Notes.xhtml#ch02note1a)) On the train south, he ventured to the
    bar car and struck up a conversation with a fascinating man named James Ryan.
    Fink discovered Ryan, like himself, had grown up in Kansas City. They spoke of
    their shared fondness for French cooking. And, it turned out, they had booked
    the same hotel in Miami. The more they talked, the more Fink liked Ryan. They
    had so much in common and seemed to have similar tastes.


    After checking in that afternoon, they decided to grab dinner together in the
    hotel restaurant. The conversation jumped from business to politics to family
    life. Ryan was extremely well traveled and had been to many of the same places
    as Fink. The two men joked and laughed together well into the night. And at the
    end of the meal, Ryan graciously picked up the check.


    As they were getting up to leave, Ryan kicked something under the table with his
    foot. Stooping down, he discovered a billfold lying on the floor.


    “Someone forgot their wallet!” he said, eyes wide. “Should we look inside to determine
    whose it is?” He looked up at Fink, who nodded.


    In the wallet, the men found $400 in cash. There was also a membership card for
    a prestigious-looking social club, with a full name on it.


    “We ought to get this back to its owner, don’t you think?” Ryan asked.


    “Yes, certainly,” Fink responded. “Perhaps we might inquire at the front desk
    as to whether the wallet’s owner is staying here at the hotel.”


    “That’s a fine idea,” Ryan beamed.


    Fink and Ryan spent nearly eight hours together, and over the course of their
    partnership, Fink grew convinced of Ryan’s trustworthiness. Back in the early
    1900s, keeping $400 in a wallet equated to about $12,000 in today’s money. Anyone
    who could turn away a clear opportunity to gain without consequence must be trustworthy.


    The trust Fink placed in his new companion was exactly what Ryan needed. While
    Fink believed he’d met a true friend, Ryan had other plans for their relationship:
    a popular long con called “the payoff,” in which he and several other con men
    would go on to swindle Fink of $25,000 (over $750,000 in today’s dollars).'
