    ## [Chapter 7](#Contents.xhtml#rch07)


    ## [PANTS YOURSELF](#Contents.xhtml#rch07)


    Sometimes, interactions take unexpected turns. We might make a faux pas, or fumble
    a simple handshake or hug. Sometimes people have bad days and take offense to
    a benign comment or request. They might blow a statement out of proportion, and
    if we’re unsure of how to calm the other person down, we might find ourselves
    caught in an argument unrelated to our influence goals.


    When interactions go astray, all is not lost, but course-correcting can be tricky.
    Every interaction requires at least two people, but you’re only in control of
    what your side of the interaction can contribute. The other side might feel annoyed,
    distracted, uncomfortable, or they might feel some combination of these emotions.
    When you sense you’re losing The Upper Hand, you can rein it back in with a showstopping
    move—you can Pants Yourself.


    In one episode of *Parks and Recreation*, a popular American comedy series, one
    character literally pantses herself to take back The Upper Hand. Leslie Knope,
    deputy director of the Pawnee Parks and Recreation Department, agrees to host
    a charity telethon, but instead of an easy daytime slot, she ends up hosting the
    night shift from 2 AM to 6 AM. Leslie tries her best to drum up viewers during
    her time slot, and she decides she needs something special to air.'
