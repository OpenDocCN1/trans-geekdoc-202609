- raw: 'Strangely enough, Dylan’s “ask” got bigger when he spoke with Chris, despite
    having no rapport with him. Chris debriefed me after the call and shared that
    Dylan had tried to poach me from Social-Engineer to work for his cybersecurity
    startup as the acting CEO, a role I neither wanted nor was qualified for. When
    Chris questioned why he wanted me, let’s just say there was no mention of anything
    skills-based, but instead talk of how “sex sells” and he needed a young woman
    to make the company look appealing to investors. Chris and I had a good laugh,
    and when Dylan followed up with me, I cut all contact with him.


    Dylan may have been good at persuading investors, professionals, and experts to
    meet with him, yet I sensed his influence likely wore off once he wasn’t face-to-face—or
    screen-to-screen—with the person he was trying to influence. Sure, he successfully
    secured initial “yeses.” But after that, with time to consider his offer, I suspected
    others, like me, backed out.


    When people like Dylan use traditional techniques to influence, they often leave
    the other party uncomfortable, even consciously skeptical. Dylan likely didn’t
    realize the effect his flimsy influence tactics, not to mention clear disregard
    for ethics, had. He ignored my expertise in favor of my appearance. He ignored
    my current position in favor of what he wanted for me. He ignored my comfort and
    confidence during the interaction in favor of his own. If he was really serious
    about hiring me, his attempts to do so didn’t make me want to maintain a continuous
    working relationship.


    The Upper Hand framework provides a deeper understanding of how influence works
    during an interaction. Analyzing any interaction from a biopsychosocial perspective
    can be beneficial, but it’s crucial for interactions based around making deals—particularly
    deals with high stakes and long-term implications.


    Influence works best when it builds from an understanding of human biopsychosocial
    reactions. Ignoring how the body, mind, and social climate relate to an influence
    attempt is a surefire way to crash and burn. To truly gain The Upper Hand, we
    need every component functioning well, giving us a firm grip on the interaction.


    ### Understanding How The Upper Hand Works


    There are five key principles to consider before making a play for The Upper Hand
    in every interaction. Each principle considers how to address the psychological
    drives occurring in every human brain. When you successfully wield The Upper Hand,
    you address the most important psychological drives motivating critical interactions.
    Since the brain is such a complex system, made up of interconnected parts, these
    drives can be conscious or subconscious, depending on which part of the brain
    processes them.


    These drives come from the three parts of the brain we’ve developed over thousands
    of years of evolution—the old, the middle, and the new. The old part of the brain
    deals with survival issues, like breathing, eating, drinking, and staying warm
    and safe enough to stay alive. This part of the brain is often colloquially called
    the reptilian brain, or the crocodile brain, because like crocodiles, it is most
    concerned with basic survival needs.


    The middle brain handles our emotions. The middle brain is also responsible for
    our social skills, and feels joy and pain from social situations. The middle brain
    sends signals to our body about how we’re feeling. When a friend rejects our ideas
    for dinner plans, the little hurt we might feel is sent by the middle brain.


    The new brain, the most recently developed in evolutionary history, takes care
    of logic, critical thought, and complex information processing. These newest parts
    (which are still about 1.5 million years old^([1](#Notes.xhtml#ch04note1a))) are
    often called the executive functioning center, and it includes parts like the
    neocortex. The executive functioning parts of the brain make it possible for us
    to have emotional responses and resist acting on them.


    The Upper Hand framework takes the old, middle, and new parts of the brain into
    consideration and accounts for the underlying psychological components that affect
    everyone involved in each interaction.


    Each principle of The Upper Hand is mapped to a digit of the human hand. Like
    our fingers, each principle can function alone in specific interactions, but they
    are most powerful when they’re understood together, serving as a holistic guide
    to using influence effectively.


    #### *We Are Our Brains: The Thumb*


    An opposable thumb is a unique trait that separates humans from other species
    in the animal kingdom. Thumbs are required for precise gripping, holding, and
    grabbing objects. It’s how we evolved to make and use tools, and some evolutionary
    scientists believe that once our precise grip evolved, humans only learned to
    walk on two feet because our hands were busy.^([2](#Notes.xhtml#ch04note2a)) The
    thumb is also the only digit that can easily touch all the others, which makes
    it the perfect digit to encapsulate this first principle.


    The human brain is the most obvious trait separating us from other species. There
    is nothing on the planet with the kind of efficient processing power resting between
    our ears. There’s a reason supercomputers and processors are so often compared
    to the human brain—the structure of computers was informed and inspired by an
    understanding of the human brain’s neural network. Consider how complex a supercomputer
    is, then multiply that by a thousand—that’s how intricate, powerful, and complex
    our brains are.


    We aren’t simply creatures with brains—we *are* our brains. Yes, we have heads,
    shoulders, knees, and toes, but our brains allow us to have thoughts and control
    our bodies instead of being ruled by external stimuli. To understand ourselves
    and others, we must understand how our brains work on a mechanical level. Ignoring
    the brain’s role as the driver of every decision a person makes is like ignoring
    our thumbs’ role in the simple task of picking up an object.


    The human brain is powerful, but it also requires massive amounts of energy to
    keep it running smoothly. The brain only makes up about 2 percent of our body’s
    overall mass, but it takes up around 20 percent of our body’s energy.^([3](#Notes.xhtml#ch04note3a))
    Just as supercomputers need massive amounts of energy to process information,
    so, too, do our brains.


    Because our brains require so much energy, they are prone to conserving energy
    wherever they can. One method brains use to save energy is to send information
    down well-worn neural pathways instead of forging new ones, resulting in some
    cognitive shortcuts. Thinking critically—that is, using the executive functioning
    power of our brain—is highly taxing. This is why we might break out the calculator
    to do fairly easy mental math, and have trouble changing habits and long-standing
    emotional reactions. It’s not impossible to change our behavior, but it takes
    far less energy to carry on with existing behavior.


    When we set out to influence someone, we must first understand the brain is in
    charge. Cognitive functions, biases, and drives all contribute to a person’s choices,
    whether or not the individual is conscious of it. Tapping into this understanding
    helps us assess interactions from an informed position, ultimately maintaining
    a stronger, more effective grip with The Upper Hand.


    #### *The Drive to Survive: The Index Finger*


    If you are reading this sentence, it is because every single one of your ancestors,
    since the beginning of time, successfully passed down a brain built for surviving.
    Their instincts, drives, and tendencies helped them accomplish the ultimate biological
    drive: they passed down their genes and perpetuated the cycle of evolution.'
