  trans: '

    无论我们的部落是由原始的狩猎采集者组成的，还是现代足球狂热分子组成的，我们的大脑都知道人多力量大。通过与我们有共同想法、目标和兴趣的人相处，我们会在环境中感到更加安全。要判断另一个人是否对我们构成威胁并不总是容易的，但当我们发现共同点时，我们就找到了熟悉感，这让我们感到安全。


    建立部落同时也利用了我们与与生的连接与协作驱动力，即《优势》（`The Upper Hand`）中的“中指原则”。仅仅与他人站在同一个房间里并将他们视为我们部落的一部分是不够的。我们必须通过寻找共同点来建立联系。


    在英国，很少有比围绕喜爱的足球（Soccer）队形成的部落更强大的部落了。在英超赛季的任何一个周六，你走进英国的任何一家酒吧，都能发现一群身穿喜爱球队纪念品的粉丝，正盯着周围的几十台电视看比赛。当他们的球队进球时，粉丝们会通过拥抱、拍背和从街上都能听到的欢呼声来分享他们的。当他们的球队输球时，他们也会分享悲伤。但他们的同胞之谊是否延伸到了球场之外呢？


    2005 年，一项经典研究旨在确定这些英国足球粉丝部落在脱离体育背景后，其影响延伸得有多远。科学家设计了实验来测试两个长期竞争对手的粉丝——`利物浦足球俱乐部`和`曼彻联`。这两支球队自
    20 世纪 80 年代以来一直处于竞争状态，他们的粉丝以互相仇视而闻名。每支球队的粉丝都有一个针对对方的竞争性口号，在`利物浦对曼联`比赛后发生冲突也并不罕见。


    实验选取了 45 名自认的`曼联`男性粉丝，并让他们接触一个事件：另一个人（一个陌生人）在距离主体约 15 英尺的地方绊倒摔地。那个陌生人痛苦地大叫着并捂着脚踝，穿着`曼彻`球衫、`利物浦`球衫或一件普通的、无品牌的
    T 恤。目标是衡量原始的`曼彻`粉丝在注意到陌生人后是否会干预。他们根据`1`到`5`的标准进行评分，其中`1`意味着受试者从未看到陌生人摔倒，`5`意味着受试者竭力帮助陌生人站起来，并护送他寻求进一步帮助。


    在`35`名有效参与者中（10 人因完全没有注意到陌生人而被排除），出现了一种模式：13 名`曼彻`粉丝中有`12`名获救——这超过了 90%！然而，只有
    33%（12 人中的 4 人）穿普通衬衫的陌生人得到了同样的帮助。`利物浦`粉丝被救的数量更少，仅为 10 人中的三个（30%）。


    实验者理论认为，虽然参与者帮助`利物浦`粉丝的可能性并不低，但他们似乎更有可能帮助自己的`曼彻`粉丝。换句话说，他们的反应更有可能是正面的（识别出共同点），而不是负面的（基于差异选择忽视）。


    实验人员用新的参与者再次进行了测试，但进行了一处细微的改变。这次，参与者被引导不要把自己看作`曼彻`粉丝，而是泛指的足球粉丝。这个新类别扩大了他们的感知社交群体，包含了`利物浦`粉丝。正如预期的那样，帮助倒倒的`利物浦`粉丝的参与人数显著增加（从
    30%增加到 70%），而帮助普通衬衫陌生人的人数则更低（从 33%下降到 22%）。


    这项实验的结果表明，我们天生更容易对我们认为熟悉的事物做出反应。在紧急情况下，我们的大脑会在提供帮助让自己面临风险之前，在无意识层面寻找相似性——即部落成员。即使是最小形式的部落认同，如熟悉的
    T 恤标志，也能影响我们对他人的反应方式。

