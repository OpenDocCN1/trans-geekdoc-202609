    —Joe Navarro, #1 Bestselling Author and Leading Body Language Expert


    “*The Upper Hand* is a master class in trust and influence, showing the power
    of cooperation over coercion. Dr. Maroño provides practical tools to approach
    conversations with confidence, making this book a cornerstone for transforming
    your personal and professional life.”


    —Brad Beeler, Supervisory Special Agent, US Secret Service


    “Dr. Abbie’s *The Upper Hand* is a groundbreaking guide to ethical influence and
    persuasion. Rooted in the science of social engineering, it empowers readers to
    achieve their goals, build meaningful connections, and create desired outcomes—all
    without the need for manipulation.”


    —Judd Shaw, Speaker, Author, Attorney, and Serial Entrepreneur


    “Dr. Abbie’s *The Upper Hand* is an essential playbook for business professionals.
    This book is packed with actionable techniques that will sharpen your ability
    to connect, negotiate, and lead with authenticity and effectiveness. It is an
    indispensable guide for executives, managers, and anyone striving to lead with
    impact.”


    —Guillermo de Nicolas, Founder and CEO, Panther Capital Group


    “Dr Abbie’s book is a true game-changer. Packed with cutting-edge insights, practical
    strategies, and compelling examples, this book arms you with the tools to influence
    and thrive in any situation. A must-read for anyone looking to elevate their communication
    and negotiation skills.”


    —Giles Paley-Phillips, Award-Winning Author, Podcaster, and Screenwriter


    “Dr. Abbie Maroño has been one of the most requested guests ever on *The Mojo
    Sessions—*and for good reason. Abbie has the unique ability to take the valuable
    research from her lab and from others around the world, and distill it in a way
    to help us better understand ourselves and how we interact with the world. Abbie
    is smart, genuine, and articulate, and her empathic nature makes it easy for us
    to relate to her work. *The Upper Hand* beautifully outlines the latest principles
    of social engineering, challenging the current constructs we use in our interactions
    and shows how through some clever changes, we can prosper in our negotiations
    and communication with others.”


    —Gary Bertwistle, Keynote Speaker, Author, and Host, *The Mojo Sessions* podcast


    “*The Upper Hand* is a modern, science-backed guide to winning friends and influencing
    people. Get what you want—no leverage needed! This insightful book reveals the
    art of social engineering and secrets used by highly successful people, presented
    in a practical guide.”


    —Nadia Ait, Cofounder and CEO, Body Language Academy


    “Dr. Abbie’s new read *The Upper Hand* is not just another run of the mill book
    on persuasion, It is the blueprint of understanding human behavior and building
    trust with integrity. Packed with actionable insights, it teaches you to influence
    ethically, whether in your career, relationships, or everyday life. This is the
    book that will help you finally feel like you can now truly connect and succeed.”


    —Shawn Livingston, Keynote Speaker, Podcaster, and Combat Veteran


