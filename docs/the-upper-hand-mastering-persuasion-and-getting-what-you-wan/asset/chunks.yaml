  trans: '


    “哦我的天呐！”CEO 惊呼道，“你在这里待了一个一个月了！你从没告诉过我读错了你的名字！”


    Corrine 起初选择“搁置”这件事是为了避免让别人尴尬，但她最终却制造了更多的尴尬。她因为拒绝解决问题而让自己陷入尴尬，也因为让同事们继续用错误的名称称呼她而让她共事的人感到尴尬。此外，对于
    Corrine 未能修复像“同事如何认同她”如此重要的问题，她的 CEO 既感到困惑又有些沮丧。


    虽然对于互动双方之间微小的不协调，将问题搁置置是有帮助的，但某些妥协实际上会降低建立关系的可能性。如果对方透露出他们反对你的核心信念之一，你很难与他们建立信任。如果他们采取了违反你道德准则的行为，你可能觉得结束互动比压抑自己的反应更舒服得多。我们仍然可以体面地离开这些场合，但我们必须离开，否则我们就有失去**主动权**的风险。


    `Shelve It`（搁置）练习帮助你跳出自我障碍。然而，人类在生物学、社会和心理学上的设计决定了我们在处于危险时会阻碍自己。当我们选择搁置问题时，必须记住这一点——我们是在为合作腾出空间，而不是向自己和他人隐瞒宝贵的反应。如果我们的“架子”上堆满了秘密情感和信念，我们就无法与他人进行公开且合乎标准的合作。相反，我们可以通过筛选哪些内容该放在“架子上”，来实现产生成功影响的深层互动。


    [OceanofPDF.com](https://oceanofpdf.com)


    # 第 9 章


    ## 握住，不要用力


    握手是一种强大的非语言工具。这是一种跨越了大多数文化的姿态，在来自不同国家的人见面时，它的优先级高于鞠躬、贴颊吻和拥抱。通过伸出手握手，人类传递了信任和合作的意愿。通过身体接触，我们触发了催产激素（纽激素）的释放。握手看起来是一个简单的动作，但也是一个充满信息的动作。


    掌握完美的握手是一门微妙的艺术。首先，你必须了解你的观众，以便知道与陌生人握手时施加何种压力。不同的文化有不同的握手礼仪。有些文化偏好有力而简短的握手，而另一些文化则通过短而轻柔的抓握进行介绍。有时，性别在谁发起握手或谁完全避免握手方面起着作用。一旦你对他人在介绍中需要什么有了基础性的理解，就可以掌握影响他们的最佳方法。


    在美国，一次好的握手达成了一种平衡。松散、软绵绵的“死鱼式”握手暴露了软弱。它让握手背后的那个人看起来很顺从。用力的、抽动式的握手会让接收者失去平衡，让握手的人看起来太有侵略性、专横，且通常令人反感。持续过长的握手让人感觉太亲密，而太短的握手则让人感到被忽视。要掌握人的第一印象，你必须首先掌握握手的艺术。


    `The Upper Hand`（主动权）框架与完美握手的艺术之间有许多相似之处。两者都需要压力、力度和灵活性之间的平衡才能发挥有效作用。我们想要一种传达自信的坚固握持，但我们不想用力挤。我们想要在正确的时间给予恰当的压力。我们想要握住，而不是用力。


    这项最后的 `Upper Hand` 练习是为了在互动中寻找压力的完美平衡，这种平衡延伸到了最初握手之外。它被贴切地称为“握住，不要用力”（Hold, Don’t
    Squeeze）。这是一项引导互动向预期结果发展的练习，确保你只在正确的时间为了正确的原因施加额外的压力。你必须建立起时机感，并敏锐地感知何时该保持、何时该施压、何时该完全收手。


    更好，当你知道如何专业地握住而不用力时，你会对他人何时试图挤压你有更敏锐的直觉。


    信不信由，曾有一段时间，亚马逊仅仅是一家在线书店。这项业务正在巨额亏损，投资者们很难证明向任何互联网公司注资是合理的，更不用说 [Amazon.com](http://Amazon.com)。但创始人夫·贝佐斯并未动摇。


    1999 年，当数百家其他互联网企业在互联网泡沫破裂的压力崩溃时，贝佐斯参加了《杰·莱诺深夜秀》来推广 [Amazon.com](http://Amazon.com)。莱诺对贝佐斯令人困惑的商业策略进行了严厉询问。


    “我不明白这一点，”莱诺说，“这家公司价值几十亿。”


    “是的，”贝佐斯说。


    “而且每当我拿起报纸，它每年亏的钱都比前一年还多。”


    “是的，”贝佐斯再次说道。


    “这家公司从未盈利过，”莱诺说。


    “确实如此，”贝佐斯笑着说道。


    两人之间陷入了片刻的沉默，莱诺试图理解这个想法。贝佐斯保持沉默，耐心地等待莱诺跟上思路。仿佛为了表现他的困惑，莱诺从办公桌下掏出一支带有 [Amazon.com](http://Amazon.com)
    品牌的品牌的铅笔，配有一个地球形状的铅笔头和一些叮当作作响的小零件。他指着它，仿佛在说：“为什么要用这个？”观众爆发阵大笑。


    “现在，为什么……它是怎么——为什么——怎么……为什么？”莱诺结结巴巴地说，表现出一种只有顶尖深夜节目主持人才能掌握的困惑感。


    “看起来像是一门新的数学课，不是吗？”贝佐斯说。


    这次采访凸显了贝佐斯和 [Amazon.com](http://Amazon.com) 在 90 年代末和 21 世纪初面临的大部分怀疑。这家公司直到 2001
    年才实现盈利。尽管如此，批评者并没有困扰到贝佐斯。尽管莱诺试图施加压力让他解释，贝佐斯保持了镇定。他没有动摇。他知道如何成功地经营业务，尽管他人需要时间才能看到他眼前的道路。


    '
