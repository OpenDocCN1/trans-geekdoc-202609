- raw: 'Once he’d created a tribe, Freud investigated. He lobbed the question of “What
    brings you here?” back to Darwin. Then, when Darwin didn’t answer the question
    and asked a new one instead, Freud deflected to continue his own investigation.
    Darwin offered up a beige answer to Freud’s inquiry, so Freud pressed him for
    more specifics and, finally, hit a nerve of sorts. “Lifesaving tech” has an emotional
    ring to it. Freud validated Darwin (“That’s very noble of you”) before investigating
    further, drawing out whether “lifesaving tech” was connected to Darwin’s self-identity
    or value system, or if it was just a line he used in the world of investing.


    Darwin, through sharing a personal story, revealed that “lifesaving tech” is uniquely
    important to him. Freud then validated with a genuine, “That’s really cool.” Validation
    can come from other words, nonverbals, or a combination of the two.


    Note that Freud also validated an unspoken concern for Darwin. The venture capital
    world revolves around monetary returns. Sure, some great ideas rise to the top
    as obvious winners, but the venture-backed businesses that survive usually have
    solid financial plans too. Freud knew this and validated that fact, demonstrating
    his own awareness of the industry.


    Finally, Freud related. He reiterated Darwin’s viewpoint, phrasing his business
    idea in terms of Darwin’s passion: “I’m building tech to help addicts recover.”
    Lastly, Freud related directly, saying, “Saving lives is pretty important to me
    and my company too.”


    Every interaction is different, but this example displays some ways to uncover
    information about another person to connect and eventually cooperate. This conversation
    demonstrates how even two complete strangers, with seemingly nothing in common
    but a shared venue, can still form a connection. Freud could have sat next to
    any other venture capitalist, found some shared “language,” and secured a pitch
    meeting—maybe a venture capitalist who was passionate about gaming, addiction,
    mental health, or partnering with insurance companies or health care providers.


    Polite, honest conversation comes naturally to some people, but for others, it
    can be difficult to keep the conversation moving. Sometimes the other person isn’t
    very talkative, or they start talking about an unfamiliar topic, and it’s unclear
    how you might investigate, validate, or relate. In these circumstances, there
    are a few additional techniques that help us speak their language, even if the
    back-and-forth dialogue doesn’t have much in common.


    •**Mimicry:** When we’re trying to connect with someone, we tend to subtly mimic
    their tone of voice, rate and rhythm of speech, speech melody, and syntax.^([3](#Notes.xhtml#ch06note3a))
    Even the simple act of speaking back the same words spoken by the other person
    can increase conversational benefits. Studies into mimicry show that it can yield
    positive results for the mimicker, like financial benefits, increased trust toward
    them, increased sales numbers, increased compliance toward requests, and increased
    perceived attractiveness. As an easy example, if the person you’re speaking with
    talks slowly and quietly, you can slow your speech a little bit, add extra pauses,
    and lower your voice ever so slightly.


    •**Active listening:** Active listening reflects empathy back at the person speaking,
    which has been shown to create more positive results during conversations.^([4](#Notes.xhtml#ch06note4a))
    We demonstrate active listening by mimicking, maintaining eye contact, asking
    open-ended questions, and offering unconditional positive regard for what the
    other person says. Studies focused on the effect of active listening on the listener’s
    perceived impression show that when we use active listening skills, the people
    we listen to build a more positive opinion of us.


    •**Open body language:** Our bodies communicate more than we think, especially
    when we’re not actively adjusting them. Open body language, like upright posture,
    uncrossed arms, and uptilted chins, communicates openness—a willingness to listen.
    Closed body language, like slumped shoulders, crossed arms or hands in pockets,
    and shifting gazes, makes us seem uninterested or even uncomfortable. We want
    to appear engaged in the conversation to increase trustworthiness.


    Since every interaction is different, it isn’t possible to lay out the perfect
    plan for speaking someone else’s language. Instead, these basic strategies provide
    a selection from which we can pick and choose based on what feels right in the
    moment. People are naturally conversational, and as long as we make the effort
    to feel and foster comfort, we’re one step closer to positively influencing the
    interaction.


    Some of these strategies will fit perfectly into an influential interaction, while
    others may feel too clunky or forced. It’s impossible to know with 100 percent
    certainty how your interaction partner will react to your conversational skills.
    That’s why the best influencers and social engineers prepare themselves by learning
    the tools, preparing their techniques, and using that knowledge for quick adaptations.


    ### Adapting to the Conversation


    The art of influence requires a strong plan and a willingness to abandon that
    plan if the need arises. Make sure to conduct your research and planning beforehand,
    then allow for adaptations during the interaction. You must stay perceptive, picking
    up on subtle changes in conversational undercurrents. Then, when new information
    presents itself, use it to inform your approach and correct your course.


    Sometimes, an attempt to make your interaction partner feel comfortable by sharing
    their language backfires. You might “strike a nerve” without intending to, which
    throws you off course and threatens to damage your budding relationship. If this
    happens to you, don’t panic—there are ways to come back from a misstep. However,
    if you choose to push through the pain without correcting your approach, you’re
    doomed to lose The Upper Hand.


    A friend of mine once told me a story about a sales interaction that went sour
    in seconds, all because the saleswoman neglected to adapt after committing a conversational
    faux pas. My friend Aly was 19 and didn’t know much about the ins and outs of
    the car-buying experience, so she brought her dad along to help her out. She found
    the car she wanted—a used 2018 Ford Fusion—and went to sign the paperwork. The
    saleswoman, who was friendly and helpful out on the floor, pivoted to make the
    hard sell.


    “We’ve got several warranties here that can really make a difference in the life
    of the car,” the woman said. “Do you want me to walk you through them?”


    Aly looked to her father.


    “We’re not interested in any of the warranties,” he said. “I’ve been working on
    Fords for years. I fully intend on fixing anything that goes wrong.”


    “I see,” said the saleswoman, pursing her lips. “You know, these cars are much
    more complicated than they used to be. Take the AC unit, for example. The functionality
    is combined with the software in the main display. If the AC goes out, you’ll
    have a bigger problem than a simple part switch.”


    “I’m sure we can manage,” he said.


    “I’m sure you could,” she replied. Then she turned her attention to Aly.


    “Aly,” she started, “I know your dad thinks he’s got this under control, but he’s
    not going to be around forever, and you don’t want your AC going out without a
    backup plan. And I’m sure he’d agree that he doesn’t want his daughter driving
    around without AC in the dead heat of summer.”


    At that moment, Aly and her dad both steeled. They shared a look that said: this
    conversation is over. They let the saleswoman’s words linger in the air, filling
    the space with their hostility. Aly’s dad stared down the saleswoman like she
    was a bug he’d just scraped off his shoe.


    “If you put down a single piece of paper that isn’t the final sales agreement,
    we’re walking out.”


    The saleswoman blanched, now clearly realizing she’d made a mistake.'
