- raw: 'I didn’t help Brad because I wanted anything from him; I helped him because
    I believed in his work. I believed my expertise could help him build trust with
    those he interviewed. It may seem hard to believe someone facing a life sentence
    could come to trust the person interrogating them, but my hope is that, as you
    read on, you’ll come to understand how crucial trust is for any influence strategy.
    You’ll learn about people like former FBI agent and spy catcher Joe Navarro, my
    good friend and mentor, who still receives messages from people he put in prison—ones
    who have served their time and now want his advice. He was never unfair or manipulative
    with the people he interrogated, and they still trust him years later.


    Influence, at its core, is about trust. When we ask our friends for advice, we
    are influenced by their answer because we trust their judgment. When we ask our
    bosses for help at work, we do so because we trust them to guide us. Our parents
    influence our morals, beliefs, personalities, and worldview, all because they
    are the first people in our lives to gain our trust or, sadly for some, lose it.
    Trust strengthens a person’s ability to influence, as well as their chance of
    success.


    Without trust, influence becomes manipulation. Manipulative people affect others
    through fear, anger, and control. Manipulation is influence without a relationship,
    without connection, and is therefore an antisocial tactic. Manipulation is only
    successful when it comes at the cost of other people’s well-being. Using manipulation,
    control, or coercion may work in the short term, but in the end, manipulators
    are more likely to land on the other end of Brad’s interrogation room.


    You can form lasting, beneficial relationships without taking advantage of others.
    Humans are neurologically wired to connect and collaborate, and this innate drive
    doesn’t make us weak or naive. Instead, it positions us to make the most of our
    relationships.


    Influence works best when it builds from an understanding of human biology, psychology,
    and sociology—a biopsychosocial approach. Rising from amateur status to master
    influencer means taking a holistic account of what happens to a human inside and
    outside of their body when they interact with others. To truly gain The Upper
    Hand, we need every component functioning well, ensuring the comfort, confidence,
    and competence of every person we influence.


    Our interactions with other people influence the trajectory of our lives. Positive
    interactions lead to genuine connections, grown from a mutual desire to learn,
    share, and collaborate. These connections can create lasting friendships. They
    can foster lucrative business relationships. They can even help propel us forward
    in life in new, unexpected ways. In my own journey, influence helped me establish
    genuine, meaningful connections with others, who all helped me get where I am
    today.


    After I spent a few months trading knowledge with Brad, he presented Chris and
    me with a unique opportunity. He told us he was part of a team putting together
    a training seminar for the Internet Crimes Against Children Task Force Program
    (ICAC). He wanted us to speak at this training. Chris and I didn’t need to think
    about it—we jumped at the opportunity right away. Once he knew we were interested,
    Brad presented our credentials to his supervisor and the ICAC event organizer,
    who swiftly accepted the proposal. You can imagine our excitement when we received
    the invitation.


    Before we knew it, Chris, Brad, and I were standing center stage, looking out
    over a sea of special agents: local police, detectives, Secret Service, and Department
    of Homeland Security agents were all in attendance. I’d love to get specific and
    tell you some names, but then I’d have to kill you, and then someone would probably
    have to kill me (kidding, of course).


    This training was a dream come true for me, but more than that, it reminded me
    of the power of influence. These officials gained new strategies for eliciting
    information by connecting, collaborating, and earning trust. These strategies
    could save the lives of hundreds, maybe even thousands of children. It could stop
    the cycle of abuse from carrying on to more generations. The ripple effect of
    prosocial influence could stretch far beyond that ICAC stage, reaching people
    I’d never meet, never know, never hear from—but their lives would be fundamentally
    changed, maybe even saved.


    And what I taught in that training only covered a fraction of what you’re about
    to learn.


    By the time you reach the end of this book, you’ll have new influence strategies
    to help you master your interactions on a daily basis. You’ll learn small-scale
    influence, the kind that will help you leverage your restaurant choice for lunch
    with friends. Next time you buy a car, you’ll walk off the lot with a better deal
    than most people have ever heard of. You’ll know how to swiftly convince your
    family to let you host holidays so you don’t have to travel (or, if you’re not
    the hosting type, you’ll convince someone else to host). You’ll come up with hundreds
    of new strategies for getting what you want from others, all without ever feeling
    like you’re being dishonest or inauthentic.


    These small-scale benefits are only the beginning. When used for larger goals,
    influence can ripple out to touch the lives of countless people. In Brad’s case,
    when he used influence to secure a confession from a predator, he saved children’s
    lives. By preventing the abuse of children, he also made it less likely those
    children would grow up to continue a cycle of abuse that could have carried on
    for generations. Influence on a large scale doesn’t only make your life better—it
    makes the world better.


    Influence skills, when harnessed with an understanding of the human brain, can
    also create lifelong benefits. Your reputation as a confident, competent professional
    who makes others comfortable just by talking with them will ripple out beyond
    your current reach. Before long, you might end up with new opportunities you didn’t
    even set out for on your own. Whether you’re looking to sell more homes as a real
    estate agent, earn new clients as a consultant, or secure a confession as an investigator,
    you’ll find more success after mastering The Upper Hand. You’ll see the patterns
    of human behavior in every interaction and learn to gracefully steer encounters
    toward positive outcomes.


    After we finished our presentation at the ICAC, audience members approached us
    with kind words. “This is the best training I have ever been to,” one person said.
    “I already have a plan to put what I’ve learned here to use,” another said. “I’ve
    been in law enforcement for 34 years, but I truly believe one can always learn
    new things, and I learned a lot today. I will put into practice what I learned
    and pass it on to others.” Before we left for the evening, the event facilitators
    invited us to present again. This time, they asked us to present at their next
    training in Seattle for a nationwide training event.


    We said yes.


    I’m still in the early stages of my professional life, yet I know the success
    I’ve achieved so far is not from my work alone. Opportunities like the ICAC training
    come from the relationships I’ve built with others. The people with whom I’ve
    connected, the collaborations we take on together, are the cornerstone of my success.
    I’ve climbed to professional heights I never thought I’d see, much less see in
    my first decade as an expert.'
