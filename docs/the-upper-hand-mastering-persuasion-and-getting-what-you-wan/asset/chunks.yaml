- raw: 'This reward system is what manipulators prey on when they offer the victim
    a special opportunity. By framing the offer as rare and showing the mark that
    they have a lot to gain if they do what they are being asked, con artists and
    cult leaders whip the ventral striatum into a frenzy. Nobody wants to miss out
    on a potentially amazing opportunity.


    The final psychological process that manipulators take advantage of involves shame.
    Manipulators will use shame to their advantage by triggering it in their victims.
    Shaming victims into giving up information, acting out against the mark’s better
    judgment, and submitting to their will gives the manipulator the upper hand by
    the worst means.


    Humans feel shame when we act against our own self-interest. It’s an unpleasant
    feeling because it’s meant to stop us from repeating those actions again. We feel
    shame when we hurt someone’s feelings because it hinders our connection with them.
    We feel shame when we trip up on a word because it damages our projection of intelligence
    or put-togetherness. We feel shame when we betray someone’s trust because it goes
    against our biological instinct to cooperate. When a bad actor uses shame against
    us, it doesn’t simply influence the way we behave—it changes how we see ourselves.


    Say, for example, you have a partner who is manipulative. After yet another night
    of them crashing through the door at 2 AM with no explanation or warning, you
    decide to confront them. *I deserve an answer,* you think, *and I’m going to get
    one.*


    “Where have you been? And why didn’t you respond to my texts at 11 PM? I was worried
    about you,” you say, keeping your voice calm.


    Instead of answering you directly, your partner spits back, “Can’t I have any
    space around here? You’re so suffocating. You always want to know every single
    thing I’m up to. It’s not healthy.”


    This is where shame starts to creep in. Your cheeks burn red as your thoughts
    race, *I wasn’t trying to be overbearing. Am I being too demanding?*


    “I’m not saying I need to know everything. I was just worried. I don’t sleep well
    when you’re—”


    “Oh, right, so now it’s *my* fault you can’t sleep? You need me here every time
    you want to take a nap? I have my own life. My own friends! You can’t ask me to
    drop everything just so you can be more comfortable. That’s so unfair of you to
    ask.”


    Now the shame is rolling through you, but there’s some confusion too. *Being afraid
    of someone coming in at 2* AM *doesn’t seem weird* … *how did this become my fault?
    Is it my fault? Am I being unreasonable?*


    You’d never considered yourself unreasonable before, but your partner—whom you
    love, trust, and feel close to—is *so* angry at you. There’s no way you’re totally
    innocent here, right? How else could this conversation take such a sharp turn?


    “I was just … I was worried …”


    “I’m a full-grown adult,” your partner snaps. “I’m perfectly capable of coming
    home in one piece. I don’t need you to worry about me.”


    Somehow, the conversation ends, and you’re left feeling defeated. Not only are
    you embarrassed about failing to get an answer, you’re also embarrassed about
    wanting an answer in the first place. You thought your worrying was a normal reaction
    to not knowing where to find someone you love, but now it feels … invasive? Selfish?
    Over-bearing? And you *do* share the house with your partner, and they can technically
    come and go as they please—what does all this say about you?


    This is called gaslighting, and it’s one of the most insidious forms of manipulation.
    A gaslighter is quick to establish trust with their victim, then use that trust
    to make the victim question their perception, memory, and sense of identity. Gaslighters
    twist words, give false information, and weaponize feelings of closeness to gain
    control over their victims. Once a skilled gaslighter has their hooks in you,
    it’s almost impossible to escape because by the time you leave, you hardly know
    yourself anymore.


    After escaping the clutches of a manipulative person, whether it’s a toxic boss,
    a cult leader, or an emotionally abusive partner, the victim is never the same.
    Their ability to trust is irreversibly damaged. Their brain rewires itself to
    take more caution when forming connections in the future. Making independent decisions
    is more difficult. Rediscovering their identity is a long, complicated process
    that can be painful, or even traumatizing.


    The average person has enough empathy to avoid using long-term manipulation tactics.
    We shudder at the thought of making another person agree with us out of fear,
    frustration, or false pretenses. Most of us recognize the widespread harm manipulation
    can cause. However, there will always be bad actors who want power and control
    more than genuine connections with others. By recognizing their most common strategies,
    we can protect ourselves from falling for them and stop ourselves from taking
    any rules out of their playbooks. After all, their tactics only offer temporary
    rewards, and they’re followed by long-lasting consequences.


    ### Sobering Up: When the Influence Wears Off


    The problem with relying on manipulative influence—other than the obvious moral
    implications—is that it’s fragile. It only lasts as long as the victim is unaware.
    Mediums can’t pretend to channel the same ghost forever. Salespeople can’t keep
    making dishonest sales pitches to the same marks. Business leaders can’t maintain
    long-term partnerships when the initial agreement is dishonest. As soon as the
    trust is broken, the relationship is over, and it’s unlikely to form again.


    Modern-day instances of malicious influence have raised our collective guard.
    We’re more suspicious of potentially manipulative interactions with others. No
    one wants to feel that cold, stinging realization that comes after falling for
    someone else’s schemes.


    Most of us can think of a time or two when we made a choice out of manipulative
    pressure, then regretted it later. There’s a reason those moments sit so clearly
    in our minds: our brains take special care of memories that teach us avoidance
    lessons. Memories of times when we were duped, manipulated, coerced, or pressured
    are high-priority memories. They are prioritized during the memory consolidation
    process (how the brain transfers short-term memories into long-term memories)
    in hopes of preventing us from falling for the same trap twice.


    Fear learning, or fear memory, is the strongest form of memory consolidation for
    the same reason: experiences that scare us are worth avoiding.^([3](#Notes.xhtml#ch02note3a))
    We’re more likely to remember negative events, whether they’re scary, frustrating,
    or otherwise upsetting. We store that interaction in an easy-to-reach place in
    our minds so we’re less likely to experience it again.


    Even a single negative interaction with a manipulator can put a person on edge
    for years. One high-pressure sale that ends in buyer’s remorse is enough to skirt
    salespeople in the future. One bad relationship with an emotional abuser can cause
    trust issues that take years to untangle. Ex-cult members often undergo full deprogramming
    processes with psychology experts. Once you’ve experienced manipulation, even
    on a small scale, you’re likely more aware of any attempts you come across in
    the future.


    People are more aware (and on guard) than ever of potentially manipulative interactions.
    Our interconnected world makes it easier to share stories of fraudsters, which
    gives many of us the opportunity to avoid these interactions without ever experiencing
    them firsthand. Viral videos show us what to look for when they call out shady
    salespeople. Documentaries showcasing Ponzi schemes and multilevel marketing scams
    teach us to look out for similar shakedowns. Warning posts go out in communities
    when local business leaders take advantage of their customers.'
