- raw: 'Leno didn’t see the risk he took when he squeezed Bezos. He lacked the ability
    (as many of us do) to see the future. He couldn’t predict Bezos’s success. During
    a time when the internet was little more than a tool for chatting with strangers
    and ordering books, Leno couldn’t have known this interview would circulate for
    years, painting him as the fool for placing undue pressure on a man who would
    become one of the richest people in the world.


    Today, most of us know the value of pressure during interactions. We know applying
    pressure to a situation can cause undue anxiety for everyone involved. Time pressure,
    financial pressure, and social pressure all risk causing stress responses in people.
    If we hold a financial meeting with a business associate, we can’t begin the meeting
    by saying, “I want money, Steve, and you’re going to give it to me … or else.”
    Steve will squirm under the pressure and feel trapped or cornered. Or he’ll just
    get up and walk out. Either way, his critical thought process will stop, and his
    brain will transfer its energy instead to his fight-or-flight response.


    Once Steve’s stress response kicks in, he might respond with anger, aggression,
    or a swift exit from the interaction. And once he leaves, he’s not likely to come
    back. He doesn’t care to find out what “or else” means.


    While squeezing an interaction too tightly is problematic, a loose, laid-back
    situation isn’t always the right option, either. Too little pressure might not
    properly motivate action. A meeting to secure funding for a new project needs
    a little pressure. Otherwise, everyone grows frustrated when that meeting veers
    off track, stalls out, or runs out of time without a plan.


    A key component of The Upper Hand is the perfect level of pressure. But we must
    be cautious with how we choose to use it, because once we add pressure to a situation,
    it’s difficult to remove. We can’t toss out an ominous threat and then backtrack
    to building rapport—we’ve already squeezed too hard.


    For better or worse, salespeople are notorious for applying undue pressure. You’ve
    likely met the car salesperson who tries to send you home in a new car even though
    you told them you’re *just looking today*. You’ve met the electronics salesperson
    who, upon seeing you approach him, launches into a speech about the latest television
    technology. He walks you through the models before you even have the chance to
    say you’re looking for a phone charger, not a TV. You’ve undoubtedly answered
    the cold caller who insists on running through their pitch before they put you
    on the do-not-call list. They all try to convince you to buy what they’re selling,
    but they only succeed in chasing you off.


    This is the kind of pressure that’s best avoided. Those salespeople are not pressuring
    you to make the best decision for yourself—they’re pressuring you to raise their
    commission. They’re acting unethically by using you to further themselves, ignoring
    how the situation affects you. If you choose to add pressure to an interaction,
    you must ensure it’s necessary to help the other person make the right decision
    overall, not the right decision for you alone.


    The right level of pressure requires you to understand whether the other person
    is ready to give an answer on their own time. You can’t shoot for the big “yes”
    during an influential interaction before you know everyone involved is ready to
    hear it, understand it, and agree to it. A gentle, adaptive level of pressure
    throughout an interaction is the only solution that results in long-term, ethical
    relationships, both in and out of the business world.


    ### Why It Works: A Helping Hand


    How do we respond to people in trouble? We offer a hand, whether it’s to offer
    help, show support, or give sympathy. We apply light pressure, as if to say, “I
    understand, and I’m sorry.” When people seem lost, we extend a hand for them to
    hold, and we guide them forward. If we squeeze a little, it’s only for a fraction
    of a second to emphasize a point or sentiment. We don’t hold so tight they can’t
    escape our grasp, nor do we linger long enough to make them uncomfortable.


    The Upper Hand works best when it acts as guidance, not coercion. When using influence,
    you must guide the other person to the best conclusion without dragging them.
    People respond best when they feel free to make their own decisions. Ample time,
    information, and consideration invites thoughtful engagement and ownership into
    the interaction. By using influence, we guide the thought process toward the most
    useful information that informs their decision. We don’t hide details, twist words,
    or force decisions—doing so would only set us up to fail.


    When people feel pressured into saying yes, they lose the ability to think critically.
    It doesn’t matter if they’re considering a business deal, a purchase, or some
    other kind of agreement. When they feel squeezed, the brain, sensing danger, diverts
    processing power away from the logical brain center (the prefrontal cortex) and
    supplies it to centers for emotional responses (the amygdala). People then become
    more susceptible to manipulative influence—the kind that preys on their emotions—but
    they’re also more likely to regret falling for that influence later.


    Interactions that rely on pushy, coercive, or demanding tactics can also backfire
    by causing psychological reactance. If someone tries to influence you, and you
    feel your freedom is threatened—freedom to make a choice, take an action, or think
    critically in your own time—you’re more likely to resist influence until the threat
    is gone.^([4](#Notes.xhtml#ch09note4a)) Further, since reactance is widely considered
    a motivational state, it may encourage you to take the opposite action being suggested.
    You might start an argument, abruptly storm off, or, in extreme cases, strike
    out at the threat. Even if you don’t escalate the situation, you’re likely to
    form a negative opinion of the person threatening your freedom.


    The amount of reactance you feel largely depends on how big the threat feels to
    your freedom. Small threats, like a spurt of traffic on the way to a meeting,
    can cause some annoyance. Larger threats, like surprise expenses you can’t afford,
    urgent tasks you can’t complete on time, or blocked exits you can’t use, are bound
    to trigger more aggressive or even hostile reactions.


    How hard will you fight for your freedom? Imagine you walk into a clothing store
    and a salesman greets you at the front door. He asks if you need any help, and
    you say politely that no, you don’t need help, you’re just browsing. You make
    to move on, but he stops you and lists off every deal in the store that day. You
    wait for him to finish, a little annoyed, but then he dives right into the benefits
    of opening a store credit card. You don’t want to be rude … but you also *don’t
    care* about his sales pitch, and now he’s limiting your perceived freedom to move
    around the store unbothered.


    When he finally stops talking, you walk briskly to the other side of the store
    to look around. You find a rack of jackets and start flipping through them, only
    to see him standing on the other side of the rack.


    “Those are half price today,” he says with a smile.


    You smush the jackets together and move to a wall of jeans. You hardly have time
    to unfold a pair in your size before you see his shadow creep up next to you.


    “Do you want me to hold those up at the counter for you?” he asks.


    You shake your head and drop the pants. You head to the shoe department and duck
    beneath the rows of cubbies. You’re safe now, or so you think. But just as you
    pop your head up to scan for the sneakers, you see his headset bobbing above the
    cubbies, like a shark’s fin cutting through water. You can’t see his lips move,
    but his words trail after you:


    “All shoes are buy one pair, get one freeeeeeee!”'
