  trans: '

    另一方面，说同一种语言也意味着要适时收敛，克制挑战他人世界观的冲动。在与不相信进化论的人交谈时，我自己也会为此挣扎，因为我是支持进化论的压倒性科学证据的坚定信者。然而，我有几次与创造论者共事的经历。在这些情况下，如果提到这个话题，我不会盲目认同，因为那样对我来说是不虚假的），但也不会在口头上攻击面前的人。这样做只会让他们产生防御心理，对我们任何一方感到被认可都没有帮助。相反，除非被直接问及，否则我不会提起这个话题。当被问及时，我只是简单地呈现科学事实，引用影响我知识的同行评审文本和证据。


    记住，大脑更倾向于验证其目前持有的信念。如果你试图在喝咖啡时改变别人的整个道德准则，那咖啡可能会洒满你的衣服。你不需要在每个概念上都与他人达成一致才能建立联系、合作或对其产生影响。你只需要分享一个基本的理解：只要你们冲突的伦理价值观不影响共同的目标，你们就有合作合作的机会。


    当你打算说某人的语言时，必须谨慎行事。在对一个人的了解程度感到自在之前，克制不要尝试。如果有人提到他们的孩子，不要假设他们的整个身份就是父母。如果有人提及其他们喜欢的政客，记住不要践踏他们的观点，但也不要将他们斥为极端分子。如果他们说的话对你很有趣，通过询问它来使用他们的语言。如果对你没趣，或者你预感到自己不会认同，就不要顺着那个信息线索下去。只要你保持尊重、真实和合作，你可以在他们自我身份的其他部分与他们真实地建立联系。


    说他们的语言让人们认同自己是同一个内部群体的一部分。当两个人感觉自己属于同一个内部群体时，他们更容易接受彼此。在商业环境中，花时间与潜在合作伙伴、客户和利益相关者说同一种语言，会增加他们感到与你有联系的概率，从而提高你的成功率。冷启动、销售和谈判可能很困难，因为它们没有利用任何形式的身份共享（即使利用了往往也是虚假的）。但当你作为一个陌生人海洋中展现出一个值得信赖的面孔时，你的影响力工作就会变得更容易。


    ### 如何调查、验证、建立联系


    我们可以将如何说某人的语言分解为三个部分：调查、验证和建立联系。当我参加 Northampton 的面试时，在面试开始之前做了大量的调查工作。在面试期间，验证和建立联系就相当容易了。然而，对于陌生人，或者在与新朋友见面时，你可能需要花更多时间进行调查，才能进行验证和建立联系——亦说说他们的语言。


    让我们来看一个企业家如何利用这一策略最终获得路演会议的案例。


    两位商人，我们称他们为 `Freud` 和 `Darwin`，在纽约的一场社交活动上并肩坐。`Freud` 是一个寻求为下一个项目筹资金的创业者。`Darwin`
    是一个希望投资新兴技术的风险投资家。当两人等候天的活动开始时，`Freud` 转向 `Darwin` 开启了话匣。


    “天气真好，不是吗？”他说，指了指他们身后高窗户洒进来的阳光。


    “是的，很美，”`Darwin` 说。


    `Freud` 接着问：“你是来旅游的，还是纽约当地人？你的口音表明你不是这儿的人。”


    “确实，”`Darwin` 说，“我几年前搬到这儿了。这里有点挤，但至少这个季节公园比较安静，而且不像伦敦有那么多阴天。”


    “噢，哇。我我很喜欢伦敦——我曾在那儿住过一段时间。很美丽的城市。酒吧也很棒。”


    “我确实很想念酒吧。这儿不一样。太雅气了。”`Darwin` 停顿了一下，审量着 `Freud`。“那么，你来参加会议是为了什么？”


    “噢，你知道的，和大多数人一样——寻找与其他创业者和资金方建立联系。你呢？”


    “啊，说吧，”`Darwin` 挑起眉毛说，“别客气，让我听听你的大想法。”

    '
