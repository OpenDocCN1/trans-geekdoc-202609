    Her second and third mistakes came in rapid succession: she invoked the eventual
    death of `Aly’s father`. I don’t think I’m making too strong of a statement when
    I say you should never use someone’s impending death as a means for influence.
    Then, she immediately followed up her harrowing remark by implying that without
    this warranty, `Aly’s father` would be dooming her to discomfort from beyond the
    grave! She thought that by directing these comments to `Aly`, she was softening
    the blow, but she only made the argument more offensive.


    With a few small adjustments, the saleswoman could have made the interaction more
    pleasant for everyone. At any point in the conversation the woman could have investigated,
    validated, and related to better understand how to tailor her message about warranties
    and extra features to `Aly` and her dad.


    Let’s examine how this conversation could have benefited the saleswoman if she
    had tried speaking their language instead.


    “We’ve got several warranties here that can really make a difference in the life
    of the car,” the woman said. “Do you want me to walk you through them?”


    Aly looked to her father, and he shook his head.


    “We’re not interested in any of the warranties,” he said, “I’ve been working on
    `Fords` for years. I fully intend on fixing anything that goes wrong.”


    “Oh, that’s great! My father was a car man, too, and he knew how to fix everything
    from a broken taillight to a blown gasket. Do you work in a shop, or do you work
    on cars for the fun of it?”


    “I love cars,” Aly’s dad said, “and I had a similar experience with my dad. We
    used to spend more time working on our cars than we did driving them. There’s
    almost nothing I can’t tinker with from memory, and if there is, I can figure
    it out with a little research.”


    The saleswoman smiled and said, “Well, Aly, it seems like you’ve got a grade A
    mechanic here to help you out. Now, in just the last two years, these newer cars
    have integrated a lot more of their hardware with their software. Have you worked
    on a `Ford` since the overhaul?”


    “I haven’t,” said Aly’s dad, “but I’m an electrical engineer in my day job. I’m
    just as much of a software guy.”


    “That’s excellent! Wow, an electrical engineer? You definitely seem like you’ve
    got this under control. Now, Aly, I do want to check in with you here—it sounds
    like your dad is the perfect mechanic. And that’s a great solution for you as
    long as you live nearby. I know you said earlier that part of your reason for
    choosing this car is because you’ve put a lot of miles on your old one. Are you
    big into traveling?”


    “I am,” Aly said, nodding.


    “I see,” said the saleswoman, “and are you also planning on living locally for
    the next few years?”


    “Well, my plan is actually to move further south eventually,” she said. “The winters
    are a little too cold for my liking.”


    “Me too! Every winter I tell myself it’s time to buy a condo in Miami,” the saleswoman
    said with a laugh. “I just want to add, then, that if you’re planning to move
    south or travel a long distance from home, you might be too far away for emergency
    car repairs if something goes wrong with the car. The warranty gives you and your
    dad peace of mind that if you have trouble anywhere in the `US`, the mechanic
    at any `Ford dealer` closest to your location can take a look and make some repairs
    for you, no problem. Even if they’re just little fixes to hold you over until
    you make it back to Dad.”


    “That’s a good point …” Aly said, looking at her dad. He shrugged. “Well, let’s
    walk through some of those warranties, just in case.”


    This time, the saleswoman attempts to understand Aly and her dad’s language before
    launching into a spiel. Instead, she investigated and validated Aly’s dad’s skills,
    and she withheld any judgments about his car-repair prowess. Then, she reinforced
    his skills by calling him Aly’s personal mechanic. When he still refused the warranties,
    she adapted, pivoting her approach on a potential issue without insulting anyone.
    Again, he refused, but his refusal was a little more indirect, leaving her an
    opening to move on to Aly.


    Here, the saleswoman related information Aly gave earlier. She validated and related
    to Aly’s weather preferences, showing they shared the same opinions. Finally,
    she brought the sale back, and invoked a positive image, detailing how much easier
    her life could be if a grade A mechanic, like her father, was right around the
    corner at all times.


    The saleswoman didn’t agree with Aly or her dad about the choice to decline warranties,
    but that didn’t stop her from continuing her strategy.


    ## Chapter 7


    ## PANTS YOURSELF


    Sometimes, interactions take unexpected turns. We might make a faux pas, or fumble
    a simple handshake or hug. Sometimes people have bad days and take offense to
    a benign comment or request.


    When interactions go astray, all is not lost, but course-correcting can be tricky.
    Every interaction requires at least two people, but you’re only in control of
    what your side of the interaction can contribute. When you sense you’re losing
    The Upper Hand, you can rein it back in with a showstopping move—you can Pants
    Yourself.


    In one episode of *Parks and Recreation*, a popular American comedy series, one
    character literally pantses herself to take back The Upper Hand. Leslie Knope,
    deputy director of the Pawnee Parks and Recreation Department, agrees to host
    a charity telethon, but instead of an easy daytime slot, she ends up hosting the
    night shift from 2 AM to 6 AM.

