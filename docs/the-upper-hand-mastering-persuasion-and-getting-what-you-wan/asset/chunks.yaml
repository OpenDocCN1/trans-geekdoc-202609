    Maroño 博士对影响力和社交性提供了一个迷人入胜的视角，将社会工程描绘为一种构建互利、合伦理且有回报关系的艺术与科学。她重新定义了影响力，使其不再是一种神秘的力量，而是一种根于对人类行为以及驱动连接与协作因素理解的技能。通过剖析某些行为为何能促进信任和互利的科学，她阐明了影响力更多是关于有目标的、亲社会的努力，而非操纵。这种方法为我们所有人创造既有效又愉悦的有意义连接提供了清晰的思路。


    偶尔会出现一本真正值得我们关注的书，而这本就是其中极其罕见的发现之一。它是一本适合每个人的资源——从寻求个人见解的个人到父母、经理、人力资源专业人士和谈判专家都是。凭借作者能够使这些概念立即转化为实践的专业知识，以及书中清晰的、有科学支持的指导，这本书揭示了人类大脑的运作机制。它提供了增强关系和沟通的工具，使其在个人和职业领域都具有无价的价值。


    《优势》（The Upper Hand）


    《优势》提供了一种新鲜且伦理的影响力方法，其基于坚实的研究和经过证明的最佳实践。Maroño 博士作为一位屡获殊荣的学者和天赋异的交流者，巧妙地将故事与实证科学相结合，分享了引发深度共鸣的见解。这并非关于过时的策略或灌输不必要的恐惧、担忧或人为的稀缺性；相反，它是利用基于证据的、伦理策略的指南，这些策略建立信任并培养真正的关系。Maroño
    博士的专业知识在每一章中闪光，使复杂的概念对于跨个人和职业领域的读者来说通俗易懂、实用且高度相关。从我们说话的方式到我们选择的词汇，你会很快发现即使是最小的事情也至关重要。你将看到一个不同的世界，影响力无处不在：微妙、细致、无孔不入，并避免地塑造着我们的许多决定。了解这些技术与运用这些技术同样重要，甚至可能更为重要。


    你不需要具备科学或心理学背景就能理解这里提供的见解，这些见解非常清澈、实用且易于应用。在 Maroño 博士的指导下，你会发现自己在建立更有意义的连接的同时，对周围的世界有了更深入的理解。


    虽然许多书籍提供了浅层的见解，但《优势》通过深入探讨影响力的生物和神经学基础脱颖而出，提供了一个丰富的、基于证据的视角，增强了对每种技术的信心。Maroño
    博士解析了社会工程背后的科学（这是一个经常误解的术语），揭示了它实际上是关于建立有意义的关系、建立持久的基础以及为社会挑战制定解决方案。


    这本书不仅提供信息，它转化了你对人类连接的理解，向你展示了为什么这些方法有效以及如何有效地应用它们。这可能是十年来最具影响力的读物，现在是探索其见解和实践智慧的完美时机。


    无论你是资深专业人士还是初学者，这些原则都将提升你与他人建立联系的方式。这本书是一段学习之旅，它将不仅让你感到满意，还将让你真正掌握经过证明的技能来促进合作、建立信任并产生影响力。与
    Maroño 博士一起开启这段旅程，获得真正改变终生互动的工具。


    — 乔·纳瓦罗（Joe Navarro）

    肢体语言专家，畅销书作者


    [OceanofPDF.com](https://oceanofpdf.com)


    ## 引言


    作为人类，我们天生具有影响人的能力。我们不断地影响着他人，即使在我们不知道的时候。影响力是影响他人行为、思想或决策的过程。大多数人会立即认为影响力就是操纵。但作为一名行为科学家，我逐渐理解两者之间本质的区别。惊讶的是，当今世界上最有效的影响力策略避免了操纵、强制或高压手段。相反，它们依赖于建立信任和合作意愿——这是我们几千年来共有的人类本能。


    根据我在神经学、生物学、心理学领域的多年研究，加上我的实践经验以及同事们可靠的见解，我创建了一个影响力框架：《优势》（The Upper Hand）。《优势》是一个通过伦理、有利的手段使用影响力的框架。它考虑了目前的人类行为科学，引导用户采用最有效的策略。每个读这本书的人都会带着与他人联系并产生持久影响的新策略离开。


    2023 年，一位（现已退休的）秘密局执法探向我和老板 Chris Hadnagy 发来一封邮件，感谢我们帮助他从一名指控虐待成年人的嫌疑者获得了完整的供词。这对我们两个来说都是一个震惊。他告诉我们他听了我们的播客《社会工程师》（The
    Social Engineer），该节目旨在帮助听众从该领域的各种专家那里学习更多心理学。我的系列《医生来了》（The Doctor Is In）由 Chris
    和我讨论心理学和行为科学的所有方面组成。


    Brad 在上班的路上打开了《医生来了》的一集节目——关于“习得性无助”的一集。在这一集中，我提到许多经历过性侵犯的个人可能会通过参与过度性行为来重新获得对身体和生活的控制感。这是一种为了夺回自身性欲和身体自主权的适应不良应对机制。


    当 Brad 听到这些时，他感到灵光一现，并以新的视角处理了他的下一次访谈。当天，Brad 获得了那个罪犯的完整供词。然后他给我和 Chris 发了邮件，告诉我们由于我们的那集节目，一个罪犯将终身入狱。当我回复
    Brad 的邮件时，我告诉他我很乐意与他联系，并为他的工作提供额外的见解。能为关押危险罪犯贡献力量我感到荣幸。


    这次交流标志着 Brad 和我之间富有影响关系的开始。我们保持着良好的合作关系。每当 Brad 联系我时，我总是乐意帮助。我非常佩服他所的工作，并在有机会贡献时感到非常荣幸。


    '
