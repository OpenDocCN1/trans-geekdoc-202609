    Her words invite the same kind of refreshment you’d feel if someone opened all
    the windows in the office. You know what “one of those mornings” means, even if
    the symptoms vary—traffic, cold coffee, mismatched socks, kids missing the bus—and
    you’re reminded that Margaret *is* a person, just like you. No one rolled her
    out of the CEO-Bot Charging Closet just to take this meeting. She woke up this
    morning and faced one tiny blunder blunder after another, just like you do sometimes.


    At first, you had no way to know for sure if you were the only one feeling anxious.
    But when Margaret brought up her own anxiety along with everyone else’s, the room
    became united under a common set of stakes. Finally, Margaret strengthened that
    unity by announcing a shared goal—a goal everyone was there to achieve.


    In other words, Margaret pantsed herself, and everyone felt better.


