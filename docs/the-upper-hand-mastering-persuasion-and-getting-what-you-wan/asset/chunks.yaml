    for dinner plans, the little hurt we might feel is sent by the middle brain.


    The new brain, the most recently developed in evolutionary history, takes care
    of logic, critical thought, and complex information processing. These newest parts
    (which are still about 1.5 million years old^([1](#Notes.xhtml#ch04note1a))) are
    often called the executive functioning center, and it includes parts like the
    `neocortex`. The executive functioning parts of the brain make it possible for
    us to have emotional responses and resist acting on them.


    The `Upper Hand` framework takes the old, middle, and new parts of the brain into
    consideration and accounts for the underlying psychological components that affect
    everyone involved in each interaction.


    Each principle of `The Upper Hand` is mapped to a digit of the human hand. Like
    our fingers, each principle can function alone in specific interactions, but they
    are most powerful when they’re understood together, serving as a holistic guide
    to using influence effectively.


    #### We Are Our Brains: The Thumb


    An opposable thumb is a unique trait that separates humans from other species
    in the animal kingdom. Thumbs are required for precise gripping, holding, and
    grabbing objects. It’s how we evolved to make and use tools, and some evolutionary
    scientists believe that once our precise grip evolved, humans only learned to
    walk on two feet because our hands were busy.^([2](#Notes.xhtml#ch04note2a)) The
    thumb is also the only digit that can easily touch all others, which makes it
    the perfect digit to encapsulate this first principle. The human brain is the
    most obvious trait separating us from other species. There is nothing on the planet
    with the kind of processing power resting between our ears. There’s a reason supercomputers
    and processors are so often compared to the human brain—the structure of computers
    was informed and inspired by an understanding of the human brain’s neural network.


    We aren’t simply creatures with brains—we *are our brains*. Yes, we have heads,
    shoulders, knees, and toes, but our brains allow us to have thoughts and control
    our bodies instead of being ruled by external stimuli. To understand ourselves
    and others, we must understand how our brains work on a mechanical level. Ignoring
    the brain’s role as the driver of every decision person makes is like ignoring
    our thumbs’ role in picking up an object.


    The human brain is keep it smoothly. The brain only makes up about 2 percent of
    our body’s overall mass, but it takes up around 20 percent of our body’s energy.^([3](#Notes.xhtml#ch04note1a))
    Just as supercomputers need massive amounts of energy to process information,
    so, too, do our brains.


    Because our brains require so much energy, they are prone to conserving energy
    wherever they can. One method brains use to save energy is to send information
    down well-worn neural pathways instead of forging new ones, resulting in some
    cognitive shortcuts. Thinking critically—that is, using the executive functioning
    power of our brain—is highly taxing. This is why we might break out the calculator
    to do fairly easy mental math, and have trouble changing habits and long-standing
    emotional reactions. It’s not impossible to change our behavior, but it takes
    far less energy to carry on with existing behavior.


    When we set out to influence someone, we must first understand the brain is in
    charge. Cognitive functions, biases, and drives all contribute to a person’s choices,
    whether or not the individual is conscious of it.


    If you are reading this sentence, it is because every single one of your ancestors,
    since the beginning of time, successfully passed down a brain built for surviving.
    Their instincts, drives, and tendencies helped them accomplish the ultimate biological
    drive: they passed down their genes and perpetuated the cycle of evolution.

