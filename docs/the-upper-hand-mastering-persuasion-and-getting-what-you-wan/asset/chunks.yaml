    Social engineering is an oft-misunderstood subcategory of influence. Chris has
    a clear definition for the term, and he’s been using it for the last few decades:
    “Social engineering is any act that influences a person to take an action that
    may or may not be in their best interest.” The definition is broad because social
    engineering isn’t always positive or negative. Sometimes, social engineering is
    used to help people, such as protecting their accounts. Other times, it is used
    to trick people into giving up sensitive information or money.


    Social engineering is the art of hacking people. While a traditional hacker uses
    software and scanners to find vulnerabilities in code, a social engineer uses
    psychology and manipulation to find vulnerabilities in people. They exploit human
    traits like trust, fear, and the desire to be helpful to bypass security measures.


    Common social engineering tactics include:

    - **Phishing**: Sending fraudulent emails to trick individuals into revealing
    sensitive information.

    - **Vishing**: Using phone calls to manipulate victims.

    - **Smishing**: Using text messages to deliver malware or links.

    - **Pretexting**: Creating a fabricated scenario (a pretext) to gain trust and
    extract information.

    - **Tailgating**: Following an authorized person into a restricted area.


    To protect yourself from social engineering, it is important to be aware of these
    tactics. Always be skeptical of unsolicited requests for information, especially
    if they come via email or phone. Verify the identity of anyone asking for sensitive
    data through a known, trusted channel. Use multi-factor authentication (MFA) to
    add an extra layer of security to your accounts.

