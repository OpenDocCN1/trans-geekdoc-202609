    我帮助布拉德（Brad）并不是因为想从他那里得到什么；我帮助他是因为我相信他的工作。我相信我的专业知识可以帮助他与受访者建立信任。听起来可能很难相信一个面临终身监禁的人会信任审讯他们的人，但我希望随着你阅读的深入，你将理解信任对于任何影响力策略来说是多么至重要。你将了解到像前
    FBI 探员、间谍捕手乔·纳瓦罗（Joe Navarro）这样的人，他是我的好朋友兼导师，他仍然收到被他关进监狱的人的消息——那些已经服完刑并现在想寻求他建议的人。他对被审讯的人从来不不公，也不操纵，多年后他们仍然信任他。


    ## 影响力的核心


    影响的核心在于信任。当我们向朋友寻求建议时，我们受到他们答案的影响，因为我们信任他们的判断。当我们在工作中向老板寻求帮助时，我们这样做是因为我们信任他们能引导我们。父母影响着我们的道德、信仰、性格和世界观，这一切是因为他们是我们生命中第一批获得我们信任（或者对某些人来说，遗憾的是失去了信任）的人。信任增强了一个人的影响力能力，以及成功的机会。


    ## 影响力 vs. 操纵


    没有信任，影响力就变成了操纵。操纵性的人通过恐惧、愤怒和控制来影响他人。操纵是在没有关系、没有连接的情况下的影响，因此是一种反社会的策略。只有当以他人的福祉为代价时，操纵才是成功的。使用操纵、控制或胁迫在短期内可能有效，但最终，操纵者更有可能落在布拉德审讯室的另一端。


    你可以在不利用他人的情况下建立持久且有益的关系。人类在神经上天生倾向于连接与协作，这种本能驱动力并没有让我们变得软弱或天真。相反，它使我们能够充分利用人际关系。


    ## 生物心理社会方法


    当影响力建立对人类生物学、心理学和社会学的理解之上——即一种生物心理社会方法时，其效果最好。从业余转变为影响力大师，意味着要全面考虑人类在他人互动时，身体内外的发生的一切。要真正获得`The
    Upper Hand`（优势），我们需要每个组件都良好运行，确保我们所影响的每一个人都感到舒适、自信和胜任。


    我们与他人的互动影响着我们生活的轨迹。积极的互动导致真实的连接，这种连接源于学习、分享和协作的共同愿望。这些连接可以创造持久的友谊。它们可以培养有利的业务关系。它们甚至可以帮助以新的、意想不到的方式推动我们在生活中向前迈。在我自己的旅程中，影响力帮助我与他人建立了真实、有意义的联系，他们都帮助我取得了今天的成就。


    ## ICAC 的机会


    在与布拉德交流知识几个月后，他为克里斯（Chris）和我提供了一个独特的机会。他告诉我们，他是一个团队的一部分，正在为针对儿童的网络犯罪任务小组（`ICAC`）策划一场培训研讨会。他希望我们在这次培训中演讲。克里斯和我不需要思考——我们立刻抓住了这个机会。一旦他知道我们感兴趣，布拉德就向他的主管和
    ICAC 活动组织者提交了我们的资质，对方迅速接受了提议。你可以想象当我们收到邀请时是多么的兴奋。


    不知不觉间，克里斯、布拉德和我站在舞台中心，面对着一片特勤探员的海洋：当地警察、侦探、秘密勤务局和国土安全局特工全部到场。我很想具体地告诉你们一些名字，但那样我就得杀掉你们，然后可能就有人得杀了我（当然是开玩笑的）。


    这次培训对我来说是梦想成真，但更重要的是，它提醒了我影响力的力量。这些官员通过连接、协作和赢得信任，获得了获取信息的新策略策略。这些策略可以挽救数百甚至数千儿童的生命。它可以阻止虐待循环持续到更多后代。亲社会影响力的涟漪效应可能远超那个
    ICAC 舞台，触及我永远不会遇见、认识、从未听过他们消息的人——但他们的生活将发生根本性的改变，甚至可能被拯救。


    而我在那次培训中教的仅占你即将学习的一小部分。


    ## 你将学到什么


    当你读完这本书时，你将拥有新的影响力策略，帮助你掌握日常互动。你将学习小规模的影响，那种可以帮助你利用与朋友午餐时对餐厅选择的技巧。下次你买车时，你离开展厅时拿到的优惠将比大多数人听过的都要更优。你将知道如何迅速说服你的家人让你主持节日活动，这样你就不用旅行了（或者，如果你不是那种主持类型，你会说服别人来主持）。你将想出成百种新策略从他人那里获得你想要的东西，而完全感觉不到不诚实或虚假。


    这些小规模的收益仅仅是一个开始。当用于更大的目标时，影响力可以产生涟漪，触及无数人的生活。在布拉德的情况下，当他利用影响力从一个掠食者那里获得供词时，他拯救了儿童的生命。通过防止虐待儿童，他还使得这些儿童长大后继续这种本可能持续的虐待循环。大规模的影响不仅让你的生活变得更好，它让世界变得更好。


    '
