  trans: '

    既然 `Shark Tank` 并不是一个创业者蓬勃发展的环境，为什么这个节目仍在延续？为什么像 `Bombas` 袜子、`Scrub Daddy` 海绵和
    `Comfy` 可穿式毯子这样的产品最终能获得巨大的成功？为什么老板们仍然竞争着推销自己的产品？答案很简单：虽然交易在现实世界中往往会破裂，但它们是非常精彩的电视节目。


    `Shark Tank` 的流程之所以能制作出引人入目的节目，因为它具有戏剧性。心跳加速、类似《大鲨》的主题曲、忧郁的灯光以及情绪多变的“鲨鱼”让观众目如痴胶。观众越多，企业获得的曝光就越高，因此老板们争夺获得关注的机会，这通常意味着无论交易是否符合自己的最佳利益都会接受。


    然而，在镜头背后，`Shark Tank` 采用了一些负面影响技术来维持那种电视级的戏剧效果。整个互动过程经过了社会工程的设计，充满了压力。从踏入片场的第一步起，创业者就通过一条长长的走廊进入“鱼池”，走廊墙上的屏幕显示着真鲨在他们周围环游。这创造了一种沉浸式体验，让创业者感觉自己正在进入鲨鱼的巢，增加了皮质醇水平并让局面更加紧张。


    当创业者到达主舞台时，他们看到“鲨鱼”们坐在高高平台上的豪华椅子上。这立刻确立了捕食者与猎物之间的界限，以及一种“他们对抗我”的心。一旦创业者开始推演，鲨鱼们中断他们、互相抢话或在推演结束前直接拒绝交易的情况并不少见。`Shark
    Tank` 上起的影响策略可能是如此令人崩溃，以至于有些创业者在压力下崩溃。一位参赛者甚至在推演过程中在舞台上晕倒了。从那时起，节目配备了一位精神科医生，所有创业者在完成推演后都会与他们会面。这种环境不是协作性的，而是对抗性的。


    将陌生体验的压力与达成交易的压力结合在一起，就成了做出遗憾商业决策的完美配方。大多数创业者并不习惯出现在电视上。即使他们有一些拍摄商业广告的经验，`Shark
    Tank` 的环境无疑更加不安。明亮的舞台灯光、闪烁的摄像头以及所有后台工作人员的目光可能完全让人感到措手不及。这种环境在设计上没有任何地方是让创业者感到舒适的。这正是节目赌注所在。


    在现实世界中，商业交易很少像 `Shark Tank` 呈现的那样运作——事实上，即使在 `Shark Tank` 上达成的交易，运作方式也不像看起来那样。节目中的许多人物带着握手协议离开，但许多人在压力平复后经历了严重的“买家之悔”。他们意识到，当他们不再对明星崇拜或恐台时，为了区区的
    100,000 美元卖掉一半业务并不是最佳决定。他们意识到自己受节目的影响有多大，并感到羞愧、忧伤，有时还会愤怒。


    这些情绪对于长期伙伴关系的开始并不是好预兆，因此 `Shark Tank` 的交易在拍摄完成后破裂的情况并不罕见。在节目前七季介绍的交易中，只有约 27%
    真正成交了。

    '
