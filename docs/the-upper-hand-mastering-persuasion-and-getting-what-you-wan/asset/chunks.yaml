- raw: 'Whether our tribe is made up of primitive hunter-gatherers or modern football
    fanatics, our brains know there is strength in numbers. By associating with other
    people who share ideas, goals, and interests with us, we feel more secure in our
    environment. It’s not always easy to tell whether another person is a threat to
    us, but when we find a commonality, we find familiarity, which makes us feel safe.


    Creating a tribe also utilizes our innate drive to connect and cooperate, the
    middle finger principle of The Upper Hand. It’s not enough to simply stand in
    the same room as others to see them as part of our tribe. We must forge a connection
    by finding out what we have in common.


    In England, there are few tribes stronger than the ones formed around a favorite
    football (soccer) team. On any given Saturday during the Premier League season,
    one could step into any pub in England and find groups of fans dripping in memorabilia
    from their favorite team, watching the game on the dozens of TVs around them.
    When their team scores, the fans share their enthusiasm with hugs, claps on the
    back, and cheers heard from streets away. When their teams lose, they share their
    grief too. But does their camaraderie extend beyond what happens on the field?


    In 2005, a classic study set out to determine how far these English football fan
    tribes extended when taken out of a sports-based context.^([2](#Notes.xhtml#ch05note2a))
    Scientists designed experiments to test two long-standing rival teams’ fans—Liverpool
    Football Club and Manchester United. These two teams have shared a rivalry since
    the 1980s, and their fans are known to hate each other. Each teams’ fans have
    a rival chant about the others, and it’s not uncommon for fights to break out
    following a Liverpool vs. Manchester game.


    The experiment took 45 male, self-identified Manchester United fans and exposed
    them to an incident where another person—a stranger—tripped and fell about 15
    feet away from the subject. The stranger, yelling in pain and gripping his ankle,
    had on either a Manchester shirt, a Liverpool shirt, or a plain, unbranded shirt.
    The goal was to measure whether the original Manchester fan, once he noticed the
    stranger, would intervene. They were ranked on a scale of 1 through 5, where 1
    meant the subject never saw the stranger fall, and 5 meant the subject went out
    of his way to help the stranger up, then escorted him for further assistance.


    Out of the 35 valid participants (10 were removed for not noticing the stranger
    at all), a pattern emerged: 12 out of 13 Manchester fans were rescued—that’s over
    90 percent! However, only 33 percent, or four out of 12, plain-shirt strangers
    received the same help. The number of Liverpool fans saved was even smaller at
    only three out of 10 (30 percent).


    The experimenters theorized that while the participants weren’t *less* likely
    to help Liverpool fans, they appeared *more* likely to help their fellow Manchester
    fans. In other words, their responses were more likely positive (recognizing a
    commonality) than negative (choosing to ignore based on difference).


    The experimenters ran the test again with new participants, but with one slight
    change. This time, the participants were primed to think of themselves not as
    Manchester fans, but as football fans in general. This new category expanded their
    perceived social group to *include* Liverpool fans. As expected, the number of
    participants who helped up the fallen Liverpool fans grew significantly (from
    30 percent to 70 percent) while the number for plain-shirted strangers dropped
    even lower (from 33 percent to 22 percent.)


    The results of this experiment indicate we’re wired to respond better to what
    we find familiar. In an emergency situation, our brains work on an unconscious
    level to seek similarities—members of our tribe—before we put ourselves at risk
    by offering help. Even the smallest form of tribal identification, like a familiar
    T-shirt logo, can influence how we respond to others in our environment.


    It’s crucial to note that we’re not only inclined to respond more efficiently
    to the familiar; we also respond *less* efficiently to the *un*familiar. When
    we enter situations we find unfamiliar, our stress response is triggered. Cortisol
    levels rise to help us spot danger, escape routes, and weak points lurking in
    our surroundings. This stress response might have been advantageous when exploring
    a new, wild territory, but it’s less helpful when entering a potential customer’s
    boardroom for the first time. Similarly, when we invite business partners to our
    familiar environment, their stress response may impact their presence.


    Creating a tribe limits the brain’s responses to the unknown during an interaction.
    By aligning ourselves with the other people, we wave a bright banner around the
    room and use it to represent our shared values, interests, and goals. We unite
    underneath this banner, which bolsters us to accomplish more together.


    ### How to Create a Tribe


    Mastering the skill of connecting over commonalities requires some subtlety. This
    strategy isn’t simply about offering up your favorite hobbies and interests to
    see if your interaction partner shares them with you. It’s about actively eliciting
    information from your interaction partner to determine what *their* interests
    are, then offering up ways they connect with your own. If you try to fake, force,
    or fabricate a connection, you slip into the sphere of manipulation, and you risk
    breaking trust. However, if you come on too strong, you risk appearing pushy or
    manipulative, which decreases your odds of forming genuine connections and trust.


    Creating a tribe requires you to highlight commonalities without appearing opportunistic.
    By drawing attention to what you and another person have in common, you open a
    door to your tribe for them to step through. How successful you are at inviting
    them through depends on *how* you open the door: how wide you swing it, how long
    you leave it open, and how inviting you make the space on the other side.


    There are variations of the Create a Tribe practice. You can choose whichever
    suits your influence strategy best. Creating a tribe between you and one other
    person is the most obvious choice. However, sometimes creating a tribe with another
    person and purposely excluding others from joining triggers the parts of our brains
    excited by exclusivity, which can be more valuable in certain situations. Finally,
    you can create a tribe with multiple members at once, which is a trickier task
    to accomplish, but can merit strong results if done well.


    Creating a tribe with another person requires more than a compliment—it’s about
    pointing out what aligns you and your interaction partner best. Sometimes the
    initial effort to create a tribe *does* resemble a compliment, but it must go
    deeper than that.


    Say you’re looking to practice creating a tribe with a potential customer, a man
    named John. “That’s a nice suit,” is a compliment. “That’s a nice suit. I’ve been
    looking for a local tailor to make my suits fit better. Who do you use?” is a
    *connection* point. You and John are similar because you both have interest in
    tailored suits—not simply suits off the rack. You compliment John’s style, and,
    with more context, it’s clear to John you have a genuine interest in the suit
    beyond pure flattery. Validating John’s appearance, then asking him for a recommendation
    is an opportunity for the two of you to connect. You’re clearly two people who
    value a well-fitted suit—what else do you have in common?'
