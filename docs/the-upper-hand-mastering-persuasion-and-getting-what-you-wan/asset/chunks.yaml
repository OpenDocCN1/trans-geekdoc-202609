- raw: 'The drive to survive is largely driven by cortisol, the main stress hormone,
    whereas the drives to connect and cooperate are ruled by our instinct to seek
    oxytocin. Instead of making the person we’re trying to influence stressed out
    to force a decision that benefits us, we can trigger their desire to connect and
    cooperate, motivating them to make a decision that is mutually beneficial.


    Understanding how the drive to connect and cooperate works is crucial for successfully
    wielding The Upper Hand. The desire to connect and cooperate is just as strong
    as the survival drive—it just operates in a different way.


    Of course, there are other factors that can make attempts to connect more likely.


    #### *Mind-Body Feedback Loop: The Ring Finger*


    The ring finger got its name because it’s the finger for promise rings, engagement
    rings, and wedding bands. An old belief claims that the ancient Egyptians popularized
    this finger as the ring finger because of its connection to the heart; they believed
    there was a vein in the ring finger that ran directly to the heart. We eventually
    discovered that wasn’t true, but the symbolism stuck around—the ring finger still
    symbolizes the connection between mind (love) and body (heart).


    Our brains constantly collect internal and external information, process it, and
    respond to it. Signals come and go from the brain, either requesting action or
    responding to information. If we feel physically cold, our brains send a series
    of signals to make us throw on a jacket. Once we do, our brain receives signals
    that help it determine whether we’re comfortable or if we need another layer.
    This is the mind-body feedback loop—a constant cyclical process between mind and
    body.


    Understanding the mind-body feedback loop in our brains contextualizes common
    emotional and physical cues. This loop doesn’t have as much of a sway on a person’s
    choices as their survival odds or their drive to cooperate, but it’s still a factor
    worth considering. It can tip the odds of successful persuasion in your favor.


    Most of us know how torturous it is to sit through a business meeting on an empty
    stomach. You end up more interested in the ticking clock than the presentation
    in front of you. Your stomach lets out thunderous rumbles every few seconds, and
    when someone mentions the “stakeholders,” you start daydreaming about a juicy
    ribeye. Until you satisfy your hunger, you can’t think clearly. You might even
    have trouble controlling your temper because you’re subconsciously or consciously
    focused on your next meal.


    While hunger is an easy signal to read, there are some subtler physical signals
    we struggle to decipher. Many emotions evoke similar sets of physiological symptoms,
    which isn’t a problem most of the time, since emotions are regulated by the middle,
    less conscious part of our brains. However, when we’re asked to consciously label
    our emotional state, we often misattribute one emotion to another.


    For example, one study examined the misattribution of arousal, which refers to
    the tendency to confuse fear with sexual attraction.^([6](#Notes.xhtml#ch04note6a))
    Experimenters asked a group of men to cross two bridges: one was sturdy and short,
    the other tall and rickety. After the men crossed a bridge, a woman who asked
    them questions from a seemingly unrelated survey stopped them. She gave each man
    her phone number and told them to call if they had any questions or comments about
    her survey.


    Most men who crossed the rickety bridge gave the woman a call. Meanwhile, the
    men who met her after crossing the stable bridge weren’t as moved by the woman’s
    presence. Why? Well, when the rickety bridge group encountered the woman, their
    hearts were racing, their breathing was short, and their hands were shaking. What
    could be the cause if not this polite woman asking them questions?


    Of course, it was the bridge that made the difference. The adrenaline the men
    felt after crossing a fear-inducing bridge felt, to them, like a sign of attraction
    when they met this woman. The men who crossed the stable bridge didn’t have any
    physical sensations of arousal, so they were less likely to call the woman after
    the encounter.


    The idea that our minds and bodies influence each other is known as embodied cognition.
    Physical states inform our impressions, which can affect our decisions. However,
    the mind-body connection exists outside of our conscious awareness most of the
    time, so we’re not always aware of how our physical environment weighs on our
    mental states.


    We can find examples of embodied cognition in everyday language. Our experiences
    in the physical world influence our cognition and are reflected in how we express
    ourselves. Expressions like “my heart is broken,” “I’m in over my head,” and “it
    hurts to think about” are all physical descriptions we use to express sensations.


    One of the most powerful examples of embodied cognition is the relationship between
    physical and social warmth. When babies’ brains form their first neural pathways
    concerning warmth, there is a connection between the physical and social sensation.
    The warm, physical feeling of a mother’s womb before birth and a mother’s warm
    skin after birth is entangled with the social sensations of caring, nurturing,
    and loving. As babies grow, the neural pathway strengthens, and the connection
    between the two sensations grows stronger as well.


    It’s hard to imagine that an act as simple as holding a warm drink could influence
    how warmly you perceive a new person, but it’s true.^([7](#Notes.xhtml#ch04note7a))
    The connection works in the opposite direction too—meeting someone we perceive
    as “warm” and kind can make us feel physically warmer. Along the same lines, feeling
    physically cold can influence how detached, unfeeling, or “cold” we perceive a
    new person.


    Knowledge of the mind-body connection and embodied cognition help us effectively
    wield The Upper Hand. Making a meeting room as comfortable as possible helps eliminate
    mind-body connection factors that could distract or dissuade people. Comfortable
    temperatures, seating options, and even food and drink choices are just a few
    of the factors that could help you maintain an edge during an interaction.


    #### *Self-Identity: The Pinky Finger*


    The final principle of The Upper Hand may seem like a smaller consideration when
    compared to the larger principles like survival and connection, but it’s still
    a crucial component to ensuring successful influence. This principle is all about
    the drive to maintain self-identity. This applies both to your sense of self—your
    beliefs, morals, and values—and the self-identity of the other party. Believe
    it or not, people are less willing to cooperate with you if you bring their sense
    of self into question.


    Each of us lives with a set of biases that make up how we see other people, ourselves,
    and our place in the world. Whether we like it or not, every interaction we experience
    shapes our reality and either builds or strengthens our biases. This is a normal
    part of brain function—biases come from our brains creating mental shortcuts to
    better process information. Without knowing it, we form stereotypes, judgments,
    and assumptions about other people, places, and belief systems. These biases then
    dictate our behaviors.


    Biases may be conscious or subconscious. They need not be positive nor negative,
    but they can be harmful. Unconscious biases can lead people to discriminate against
    others without cause. For example, a male hiring manager with gender bias may
    overlook a female candidate, influenced by a subconscious bias that male candidates
    are better suited to executive roles. The man may not recognize the gender bias
    in himself—he simply feels the male candidate is a “better fit.”'
