- raw: 'A third friend had a date rescheduled at the last minute for a time when her
    kids would be home. She needed a babysitter on short notice, so she called up
    her brother. He agreed, but only on the condition that she go see *Fast X* with
    him in theaters that weekend. Instead of reminding her brother that she *hated*
    action movies, or that she hadn’t seen the previous movies in the franchise, she
    shelved her objections and agreed. After all, she was getting what she wanted,
    and a movie with her brother was a small price to pay.


    The Shelve It practice helps you get out of your own way when it comes to influence.
    It gives you the space you need to connect. When the moment comes when you know
    a clever comeback isn’t the solution, but the opportunity is *just so tempting,*
    having the emotional discipline to make the right choice can be a huge asset.
    Learning to have emotional discipline, though, is a process. So, let’s explore
    how to train this skill.


    ### How to Shelve It


    Since the Shelve It practice is all about emotional discipline, it requires two
    base skills: mindfulness and empathy. In practice, knowing how to shelve it means
    knowing how to control your internal and external reactions to situational surprises.
    Mindfulness and empathy will help you manage your emotional reactivity. So, to
    learn how to shelve it, we’ll start by exploring a way to practice mindfulness
    and empathy, then we’ll dive into how to manage emotional reactivity in the moment.


    Not many people recognize the importance of mindfulness and empathy in business,
    but those who do see unprecedented success. Their knowledge, understanding, and
    control over their own minds equip them to relate to the minds of others. To train
    these skills, there is one practice that engages them both: mindful meditation.


    Mitch Presnick, the franchise founder for Super 8 in China from [chapter 1](#Chapter01.xhtml),
    is a big proponent of mindful meditation. He’s been meditating for over three
    decades, and he credits this practice with his strong sense of empowerment, self-control,
    and empathy. In our discussion about his business success, he said, “There are
    two kinds of people: people who have mastered their minds, and people who have
    been mastered by their minds.”


    He’s correct in this attribution. Studies have shown meditation is beneficial
    to sustained attention, response inhibition, and cognitive functions like critical
    thinking and decision-making strategies.^([4](#Notes.xhtml#ch08note4a)) By mastering
    his own mind, Mitch has also mastered his strategy for gaining The Upper Hand.


    When Mitch sets out to gain The Upper Hand in his interactions, he starts with
    empathy. He strategizes from the perspective of the person he wants to influence,
    not from inside his own head. “I don’t focus on what it would take for me to succeed
    first,” he said. “I want to figure out what success looks like for them, and then
    see how I could fit into that image.”


    When Mitch approached the Super 8 board, he shelved any tactics that distracted
    from his goal. He could have designed a strategy around how American franchises
    saw great success, and used data from his home country to demonstrate the potential
    in China. Businesspeople have tried and failed to prove potential by comparing
    one country to the other. However, Mitch knew better. He recognized this approach
    wouldn’t draw attention to the similarities between America and China—it would
    only serve to show the differences. Instead, he shelved his notions about American
    success and collected data on the Chinese market as it stood then.


    By setting aside the tempting comparisons between these two vastly different countries,
    Mitch made room for research that addressed what this panel *actually* considered
    important: the future of the hotel industry in China. He connected with their
    shared interest in forging a path to a new kind of business model in China. This
    successful connection helped the panel trust him. Ultimately, the panel decided
    their decision to work with him would be a safe, comfortable choice. And Mitch’s
    eventual business wins proved the panel correct.


    There’s bound to be some resistance whenever you practice influence, and if the
    resistance comes unexpectedly, it can be discouraging or even overwhelming. The
    more resistance you face, the harder it is to shelve your emotions of frustration
    or disheartenment. If you’re not prepared for this possibility, you may end up
    snagged by your own emotional reactivity and plunged into a downward spiral of
    negative emotions. Meditation and mindfulness strengthen your ability to respond
    to resistance without any emotions, objections, or distractions in the way.


    Mindfulness, often built up through meditation, has been shown to decrease emotional
    reactivity. In one study, people were assigned a number of tasks and asked to
    complete them while presented with emotionally disturbing images.^([5](#Notes.xhtml#ch08note5a))
    Those who practiced mindful meditation could more easily disengage from the images
    and refocus on each task. Those who didn’t meditate were regularly distracted.
    Those who meditated had an easier time putting their negative emotions on the
    shelf, leaving cognitive space for critical thinking and decision-making.


    Holding back emotional reactivity is the core of the Shelve It practice. Holding
    back frustration, confusion, annoyance, offense, and other common emotional responses
    during tricky influence situations is hard. But by setting aside your reactions,
    you also set aside any friction in your interaction. This technique mitigates
    the risk of insulting, discomforting, or creating resistance in the person you’re
    trying to influence.


    Recognizing the importance of the Shelve It practice, especially in business-based
    influence interactions, can lead to unparalleled success at securing The Upper
    Hand. Mastering your own thoughts and emotions can enhance your ability to understand
    and connect with others. This gives you the strongest chance for achieving your
    ultimate goal—successful, ethical influence.


    When it comes to using the Shelve It practice *in the moment*, there are two components
    to be aware of: your inner and outer response. Emotional reactivity manifests
    both in your head and through your behavior, and it’s not enough to only master
    one. If you can’t control your inner reactivity, then your emotions, objections,
    and distractions will show on your face. And if you can’t control your outer reactivity,
    then your thoughts will likely be derailed too. So, let’s see how we can apply
    mindfulness and empathy to managing our inner and outer reactivity.


    #### *On the Inside*


    The first step you’ll want to take when an emotional reaction takes you by surprise
    is to acknowledge it. Yes, that comment about your weight was uncalled for. Of
    course, a remark that undermines your effort is frustrating. It’s normal to feel
    bristled when someone makes an incorrect assumption about you. Just because you
    don’t plan to address your emotional response in the moment doesn’t mean it’s
    not worth addressing at all—your response is valid.


    If you don’t acknowledge your own distress, it’s bound to buzz around in your
    mind like a persistent fly, distracting you from the task at hand. Make a mental
    note to revisit the issue once your interaction is over. That way, your stress
    response recognizes you’re taking action, even if the action is postponing action.
    This allows you to level out your internal cortisol levels, which will help you
    refocus on the next step of your interaction.'
