- raw: 'Similarly, you can prevent yourself from feeling overloaded with information
    by doing research ahead of time. Preparation allows you to be more considerate
    in your answers and questions. It can aid in adapting lines of questioning during
    an interaction. At first, it might seem difficult to hold a bunch of knowledge
    about a person or company as you attempt to influence them, but, like any skill,
    with practice it becomes easier to see where to head during an interaction.


    Ample time for processing is equally beneficial for the influencer. The more prepared
    you are before you attempt to influence someone, the more likely you are to learn
    new information. Giving yourself time to process how any new information affects
    your influence strategy will make it even stronger. It takes a master influencer
    to adjust an influence strategy moment by moment.


    Account for this slow-burning influence by planning ahead. If you need to secure
    a simple “yes” by Friday, you’d better start the influence process on Monday,
    not Thursday. If the other person feels like there isn’t enough time to properly
    assess the situation, they may feel the pressure isn’t worth the potential reward.
    Providing ample time for the other person to think through what they’re agreeing
    to makes them more likely to agree. It also makes you less likely to succumb to
    unethical practices, making them feel uncomfortable, frustrated, or trapped because
    of you.


    The downside to a slower, multiple-interaction approach is that you run the risk
    of losing the other person’s attention. You can mitigate this risk by securing
    smaller “yeses” that build up to a bigger, final “yes.” For example, during the
    first interaction, you can gain a small “yes” by simply collecting contact information.
    This opens the door for scheduling future meetings. During the next few meetings,
    you can assign small, easy tasks for them to complete to keep the momentum up.
    Have them read an article that relates to your shared goal. Give them a thought
    prompt to revisit between meetings. By asking them to invest time between interactions,
    you retain their attention and make them more familiar with your overall goal.


    It’s difficult to prescribe a formula to know the right moment to squeeze *just
    enough* for a final “yes.” Every situation is different. Sometimes there is a
    bit of time pressure that makes the slow game impossible. Some situations are
    dire enough to exclude signs of enthusiasm (like planning a funeral or transitioning
    out of a relationship). There is no clear-cut sign to determine when a person
    is perfectly primed to finish a deal. It would be great if the human brain triggered
    a nonverbal response that signaled that we’re in the endgame. It would be amazing
    if someone scratched their head and rubbed their tummy as an unconscious sign
    of susceptibility, but alas, we’re simply not wired that way.


    Instead of searching for an elusive sign that someone is ready to collaborate,
    it’s a more reliable approach to gauge how balanced an interaction feels as it
    goes on. If the pressure feels too high—if you feel your stress response bubbling
    up or see signs of the same in the other person—it’s a good time to relieve some
    of the pressure with a break, a digression, or another slight adjustment. If you
    feel frustrated by a slow, unyielding conversation, you can turn up the pressure
    a little at a time, like you’re trying to find the perfect shower temperature
    without burning yourself. Keep comfort, confidence, and competence at the forefront
    while you interact with others, and you’re more likely to see signs to raise or
    lower the pressure.


    ### When to Let Go


    Influence is powerful, but it’s not magic. There is no guarantee that even a perfectly
    executed influence strategy will succeed. In some situations, you’re bound to
    recognize there is no happy ending for everyone involved. These are the cases
    in which you must decide the right moment to let go.


    Holding on too tightly to someone who wants to leave an interaction is almost
    guaranteed to ruin your influence. You’ll trigger their stress response, which
    will cause them to wrench themselves free of you, and you’ll lose any leverage
    you’ve gained. If you recognize the other person isn’t ready to give a final answer,
    it’s best to let go, rather than forcing them to turn a potential “yes” into a
    “no” by squeezing too hard.


    When your influence plan relies on you securing a final decision, letting go can
    feel like failing. It can be stressful to think about extending your plan to include
    extra interactions and longer sustained influence. This is especially true if
    you’re facing a deadline, or you’re expected to defend the delay to other people.
    When this stress strikes, it’s tempting to shift tactics and deliver an ultimatum
    to the person you’re trying to influence. At least that way, you might think,
    you’ll have an answer one way or another.


    Ultimatums are threats disguised as choices. “If you don’t act now, you’ll lose
    this offer” seems like it presents two options: make a decision now or don’t.
    However, there is a hidden threat in there: “say yes, or I’ll raise the price,
    change the terms, or stop negotiating altogether.” You slide into the world of
    unethical influence, since this tactic means making the other person feel like
    their vulnerabilities are leveraged, forcing them to act outside their own free
    will. Ultimatums are manipulative, and they’re more likely to backfire than a
    straightforward, “It’s time to make a decision.”


    Forcing an ultimatum on someone is another way to trigger psychological reactance.
    Presenting an ultimatum is like forcing iron bars to fall from the sky—you trap
    the other person in a cage and dangle the keys in front of them. This changes
    the dynamic of the relationship and, in turn, changes the goal of the other person.
    They stop wanting to work together, and focus instead on how to get their freedom
    back.


    If you do resort to an ultimatum, you lose The Upper Hand. You slide from influence
    to coercion. Even if the other person accepts your terms, the pressure you’ve
    applied will leave both of you in an insecure relationship. You’ll both worry
    that your terms were only accepted out of fear, force, or obligation. Trust will
    erode. Reaching goals will be harder. And when the deal is done, it’s unlikely
    you’ll ever make another.


    Instead of squeezing a final answer out of someone, it’s much more effective to
    practice patience. Dismissing time pressure or a frantic need for a definite answer
    makes the other person feel more comfortable. When they have time to think through
    their choice, determine trustworthiness, and examine all the pros and cons of
    an agreement, they’ll feel safer and more comfortable, which makes them more likely
    to agree with enthusiasm.


    When you sense an interaction dwindling out without a final decision, *let it
    go.* Inform the other person you’re always available to talk through any questions,
    comments, or concerns. Schedule a follow-up interaction to continue the influence
    process on a timetable they’re most comfortable using. Leave the door open for
    them to come back to you instead of locking them inside. Demonstrate trustworthiness
    by giving them enough room to move in and out of interactions with you freely.
    It might seem paradoxical, but letting them leave can be the most likely way to
    ensure they’ll come back.


    The Upper Hand framework isn’t 100 percent guaranteed in any interaction; that’s
    what makes it honest. All influence strategies have the potential to fail because
    they rely on consistent results from inconsistent creatures. Humans are fickle.
    Our experiences are unique, our feelings are complex, and our decision-making
    skills depend on a plethora of underlying factors. The best we can do is utilize
    our understanding of how the brain works and what drives people to cooperate.
    That’s how we earn success.


