- raw: 'You can avoid causing unnecessary resistance by employing the Shelve It practice.
    If you’re trying to influence Valerie, the CEO, and she mentions that she knows
    the earth is flat, you might feel it’s your responsibility to tell her she’s wrong.
    However, she’s more likely to dislike your response (and dislike you) than she
    is to hear you out. Instead, shelve it. Maintain a respectful demeanor by nodding
    politely. Acknowledge her (through gritted teeth, perhaps) with a neutral phrase
    like, “That’s an interesting perspective. It reminds me of …” then slowly steer
    the conversation back to what you have in common—a goal that has nothing to do
    with the curvature of the earth.


    Now, as you’ll see later in the chapter, not every interaction is well suited
    for the Shelve It practice. It’s worth keeping in mind that your opinions, beliefs,
    and emotions may not help you during influence attempts. Keep the three C’s in
    mind: comfort, competence, and confidence. You must ensure your interactions take
    place in a comfortable environment, not a space for arguments. You want to project
    confidence, not arrogance. And, finally, you want everyone involved to feel competent
    enough to contribute to the interaction, which is hard to do when you’re trapped
    in a heated debate.


    By shelving your emotional reactions, your personal opinions, and any other factors
    unnecessary for influence, you keep them in mind without drawing attention to
    them. Later, when the interaction is finished and your influence is successful,
    those items are still on the shelf waiting for you. This practice isn’t about
    removing parts of yourself or hiding them from view—it’s about temporarily setting
    aside the things that may impact your influence strategy.


    ### Dusting the Shelf: Emotional Intelligence


    The Shelve It practice is, at its core, emotional discipline. Humans are emotional
    beings, and our emotions sometimes trigger us to act without critical thought.
    But once we take action, we can’t take it back. When we shelve a strong emotional
    reaction, we limit the potential damage our emotional responses can cause on our
    interactions.


    There’s an old story by an unknown author that teaches the importance of emotional
    discipline. It goes by many names, but I call it “The Boy with the Temper.”^([1](#Notes.xhtml#ch08note1a))
    It goes like this:


    *There once was a little boy who had a very bad temper. His father handed him
    a bag of nails and said that every time the boy lost his temper, he had to hammer
    a nail into the wooden fence.*


    *On the first day, the boy hammered 37 nails into the fence.*


    *Gradually, the boy began to control his temper, and the number of nails he hammered
    into the fence slowly decreased. He discovered it was easier to control his temper
    than to hammer those nails into the fence.*


    *Finally, the day came when the boy didn’t lose his temper at all. He told his
    father the news, and the father suggested that the boy should now pull out a nail
    every day he kept his temper under control. The days passed and the young boy
    was finally able to tell his father that all the nails were gone. The father took
    his son by the hand and led him to the fence.*


    *“You have done well, my son, but look at the holes in the fence. The fence will
    never be the same. When you say things in anger, they leave a scar just like this
    one. It won’t matter how many times you say ‘I’m sorry.’ The wound is still there.”*


    It’s likely that many of us have driven nails through conversations without thinking
    about the scars they leave behind. When it comes to influence, it’s crucial we
    leave the nails on the shelf for safekeeping instead of hammering them into others.
    Even if we win an argument, make valid points, or succeed at changing minds, we
    do so at the expense of keeping The Upper Hand.


    If you struggle to stop yourself from reaching for the nails in a conversation,
    you might benefit from stronger emotional discipline. Emotional discipline comes
    from emotional intelligence, which is your level of awareness, control, and expression
    of your emotions. This may seem like a simple skillset, but many people find it
    deceptively difficult.


    Emotional intelligence can be broken down into three main skills: self-awareness,
    self-control, and self-regulation. People with high emotional intelligence are
    masters of their own emotions. They can recognize an emotional spike, identify
    the cause, resist the urge to act on it, and bring themselves back to baseline.
    The stronger their emotional intelligence, the more control they have over their
    interactions with others.


    The first skill, self-awareness, refers to how well you recognize your own emotions.
    A person with strong self-awareness can answer the following questions without
    hesitation: What makes you angry? What calms you down? What makes you sad? What
    excites you? What are you most afraid of? Once you’re aware of what causes you
    to feel strong emotions, you can adjust your approach to different environments.


    Self-control refers to how well you respond to emotional spikes. Say you’re the
    world’s biggest fan of Taylor Swift, and Bryce from the office is trashing her
    newest album. Do you engage and argue with him? Do you ignore him? Do you offer
    your opinion but accept her music isn’t for everyone? You might be furious at
    Bryce’s obtuse, uncultured taste, but how you choose to express that emotion depends
    on how well you control it. No matter how amazing Taylor’s album is, it’s probably
    not worth you exploding with rage and losing your job.


    Finally, self-regulation refers to how efficiently you reduce a spike in emotions.
    Bringing yourself back down from a fit of rage, a moment of panic, or a burst
    of uncontrollable laughter is no small task. Emotional responses affect the entire
    body. Your heart rate and blood pressure rise. Your muscles tense. Your breathing
    shifts. Whether they cause you to buzz with energy or faint from overwhelm, your
    emotional responses are distracting. The better your self-regulation, the faster
    you can calm your response and resume interactions with others.


    If emotional responses are natural, why must we spend so much time and energy
    fighting them? If you want to scream at your coworker for trash-talking about
    your interests, doesn’t that desire come from somewhere natural inside of you?
    The easy answer is, yes, your emotional responses *are* natural, but like plenty
    of evolutionary traits they haven’t caught up with modern social norms.


    Our emotional responses are driven by our fight-or-flight response, which is helpful
    in some situations and outdated in others. If you run into a bear in the woods,
    your fear would motivate you to break into a mad dash. Or, if your brain thinks
    you could take the bear, you might feel a sense of rage that causes you to sock
    the bear right in the nose. In today’s modern world, we’re much more likely to
    run into social danger than physical danger, but our psychological responses have
    a hard time telling the difference.


    This is why it sometimes feels so good to retaliate in a social situation. When
    we secure the last word, deliver a witty comeback, or “win” an argument, our brains
    process the win as equal to a swift punch to a bear snout.^([2](#Notes.xhtml#ch08note2a))
    It makes us feel like we’re taking back control from whatever triggered the spike
    in our emotions—fear, embarrassment, anger, etc.—and therefore handling a threat.


    While it might feel good temporarily to prove another person wrong, it can come
    at the cost of your relationship. Interactions between the two of you will become
    tense if you start a feud in the wrong place at the wrong time. If your interaction
    partner is equally poor at self-control, the argument might escalate and threaten
    your safety. Even if you’re arguing in favor of a topic that resonates with who
    you are at your core, it’s best to take how you feel and shelve it—at least until
    you’ve secured The Upper Hand.'
