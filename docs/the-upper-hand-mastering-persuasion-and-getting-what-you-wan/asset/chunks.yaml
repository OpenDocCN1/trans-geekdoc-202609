- raw: 'The human brain (and body) contains a complex reward system that floods us
    with feel-good hormones like oxytocin when we cooperate. When we spend too much
    time alone, we suffer on a neurochemical level, with increased levels of cortisol,
    a major stress hormone, in our bloodstream. Fortunately, cortisol, or stress,
    can be mitigated by oxytocin, typically labeled as the “love hormone” but more
    aptly recognized as the “social trust” hormone.^([4](#Notes.xhtml#ch01note4a))
    We’ll be exploring this in more depth in the next chapter.


    Oxytocin plays a role in every person-to-person interaction. When two people,
    even strangers, cooperate with each other, they each get a boost of oxytocin.
    The brain feels safe and rewards us with a specific sensation. Even watching two
    people cooperate can give us an oxytocin boost. The phrase “faith in humanity
    restored” is often repeated after watching one person do a good deed for another—and
    the feeling that stimulates that turn of phrase is likely a little oxytocin boost.


    Thousands of studies have centered around why humans are so keen to cooperate,
    but in 2023, a group of scientists wanted a more holistic view.^([5](#Notes.xhtml#ch01note5a))
    They had questions about the consistency of cooperation, like: What qualities
    make a person more cooperative? Are some people cooperative in certain situations
    but uncooperative in others? Similarly, are some people more likely to inspire
    cooperation in others? Are there people who are naturally *un*cooperative? To
    better understand the nature of cooperation, these scientists designed an experiment
    to test its limits.


    The scientists went into the experiment knowing how vital trust is in any human
    interaction. Additional research has shown that when people decide to cooperate
    with each other, they consciously and unconsciously suss out the other person.
    The human brain makes split-second judgments on prosocial traits like trustworthiness,
    generosity, and competence. It takes our brains about 33 milliseconds to decide
    whether another person appears trustworthy.^([6](#Notes.xhtml#ch01note6a)) Once
    our brains determine an individual is trustworthy, we’re more likely to cooperate
    with them.


    The experimenters determined the best way to test effects on cooperation was to
    put subjects through a series of games. They designed 10 different games for the
    subjects to play. Each game covertly tested how personalization affects prosocial
    behavior. That is, how the degree of familiarity between two players affected
    their willingness to cooperate. The experimenters wanted to find out if knowing
    the other players in the game would lead a subject to cooperate at higher rates.
    Just as it’s harder to leave spiteful comments on a close friend’s social media
    post, it’s often more difficult to treat an opponent badly if you see their face
    and know who they are.


    Since each study participant was subject to the same rules, let’s look at the
    game experiments through the eyes of a single participant: we’ll call her Donna.
    Before she started to play, Donna had her photo taken. Then, she was asked a few
    questions in front of a camera. The video would not have sound, they told her—it
    was simply for identification purposes.


    Then, Donna sat down in front of a computer and saw a set of six other players’
    photos. She scored the photos on a scale of 1–5 (1 being the lowest) for eight
    traits: generous, trustworthy, rational, risk-taking, greedy, angry, happy, and
    attractive.


    Once the person-scoring was finished, the games began. The first game was called
    The Dictator Game, and the prompt appeared on Donna’s computer (paraphrased for
    simplicity):


    *You have 100 points (money) in your pocket when you meet a person in need on
    the street. They tell you they need money to get back on their feet, and their
    request equates to exactly 100 points. Now you have to decide how much to give
    this person, if anything at all. Please notice that your interaction partner (the
    person in need) is a real participant in this experiment. All the points you give
    them will be transferred to them, and all the points you keep will stay with you.*


    For the first round, Donna had to choose how many points to give each player.
    For the second round, before she made her decision, Donna watched a 20-second
    video of the person in need before making a choice. The video was a silent clip
    of Donna’s partner chatting with one of the scientists. Donna noticed her partner’s
    kind eyes and soft smile. The third round presented her with a video of a new
    stranger—a new partner—with rosy cheeks and a big, goofy grin.


    The rest of the games followed the same pattern: Donna read the rules and chose
    an outcome. Each game was modeled after a real-life scenario; Donna played as
    a peach vendor, a lottery winner, and a long-distance cyclist. The first round
    of each game gave no information about her partner, and the next two rounds gave
    her video clips of the person on the other end of the game.


    Donna’s results—along with the results for the other 180 participants—revealed
    that seeing the video clips of other players influenced her cooperation. Donna
    distributed points more generously after seeing videos, as did the other players
    in the game. When her partners saw her face during the games, they were more cooperative
    and generous, knowing she was on the other end. (The results also suggest this
    group of strangers was adept at accurately guessing a person’s level of generosity
    from just a photo.)


    None of the participants had to give away their points, but many did, particularly
    after seeing videos of the other players. Just a small bit of connection—a video
    of a person—induced a bump in generosity toward others. In essence, it was easier
    for participants to say “yes” to giving away their points when they felt higher
    levels of trust. (It’s important to note that other studies have shown the opposite
    can be true too: when trust is broken, retaliation occurs—more on this in the
    coming chapters.)


    Not everyone will trust you or cooperate with you all the time. If it were that
    easy, we could point-blank ask for what we want and consistently receive it. Part
    of what makes influence tricky—especially in business—is knowing there will be
    resistance. There are hoops to jump through to approve budgets. There are processes
    for how to implement new tools. There are protocols for how to hire new employees.
    You can’t ask for a rule to change and expect it to change for you, because it’s
    a rule that doesn’t only affect you.


    When you craft a pitch or guide a business interaction, you prepare to meet resistance
    ahead of time. Yes, people are inclined to cooperate with each other, but it’s
    still a risk-versus-reward situation. In Mitch’s case, he knew he had a business
    plan that would benefit Super 8, yet it was still a risk for the Super 8 team
    to work with him, someone they had known for only several hours. Mitch needed
    to quickly build trust and encourage cooperation to chip away at their resistance
    and secure a “yes.” He knew the business game, and he knew how to ensure everyone
    playing could win.


    In any game, from freeze tag to canasta, there is one rule so basic that most
    instructions don’t even include it: *the players must trust each other.* In a
    game of chess, you must trust your opponent isn’t using outside help to strategize.
    If you’re playing go fish, you must trust the other players to be honest about
    the cards in their hands. And if you’re sharing information with someone new,
    you must trust they won’t use it to cheat you. Trust is a central component of
    all interactions, because it is crucial to overcoming resistance.


    ### A Prosocial Game'
