- raw: 'These crafty vendors rely on short-term tactics to influence your decision
    to buy because they don’t expect to ever see you again. They may trigger a sense
    of scarcity by recruiting another vendor to feign interest in the bag you’re eyeing.
    They may act pushy, aggressive, or domineering to intimidate you into handing
    over the cash and moving along, or they may take the opposite approach and celebrate
    your “rare find” with you. What do they care if the vendor around the corner is
    selling the same item, or if the handles fall off your designer bag 10 minutes
    later? They have a no-refund policy. As long as you pay, they don’t care how you
    feel about the interaction.


    Short-term strategies don’t care to consider how they affect their targets. They’re
    not concerned with the effects of buyer’s remorse. Whether you’re buying a Fucci
    or agreeing to attend a business course, you’ll probably have a moment of reflection
    once the dopamine rush wears off. You may realize you didn’t actually need another
    bag, or that you didn’t research any other courses before signing up for this
    one. You may even recognize in hindsight how little information the salesperson
    gave you before demanding a decision. Buyer’s remorse doesn’t feel good for anyone,
    and it certainly doesn’t reflect well on the salesperson who caused it.


    While short-term strategies have a home with the street vendors of the world,
    they have no place in business. In today’s professional environment, most deals
    are pitched with the intention of collaborating for months, even years at a time.
    These deals require huge commitments of time, resources, and money. Before businesspeople
    agree to work together, they must feel like they can trust the other people involved—and
    if anyone stinks of manipulation, it’s likely the deal will fail.


    When the trust we place in others is broken, we feel betrayed. Betrayal is emotionally
    painful, but our brains process social and physical pain similarly.^([1](#Notes.xhtml#ch03note1a))
    The human brain responds to the pain and stores that sensation as a learning experience.
    It reminds us not to trust that person next time, lest we feel that pain again,
    and worse. The reminder also extends to people we haven’t yet given trust to,
    but who exhibit similar traits to people who betrayed us in the past.


    We’re less likely to take it personally when a street vendor betrays us than when
    a colleague does, since we probably didn’t place much trust in the street vendor
    in the first place. However, we probably do trust the people on our teams, so
    when they abuse that trust, it hurts us. When people take advantage of trust to
    wield influence, they cause pain for others.


    If Diane had approached her colleagues with any sort of consideration for how
    *they* might feel about giving up their research, she might have ended up more
    successful today. If she’d recognized collaboration as an effective, ethical path
    forward, she could have joined forces with some of the best minds in the industry.
    She could have developed a reputation for supporting her colleagues’ ideas by
    promoting them in her speaking engagements, courses, and media appearances. She
    could have built strong relationships with the other women in her field if she
    hadn’t taken advantage of them. Now, her career is stuck at a standstill while
    the rest of us keep growing.


    ### Authenticity Is the Best Advocate


    People who choose manipulation, fabrication, or coercion overlook the basic human
    drive to seek authenticity, which is a fundamental aspect of influence. Humans
    crave the truth. This craving is not a conscious choice, but a result of evolutionary
    psychology embedded in our neural circuitry.


    Inside the human brain, an intricate neural network operates below our conscious
    mind. It shapes our perceptions, decisions, and interactions. In the realms of
    influence and persuasion, the brain operates like a conductor leading an orchestra.
    Its processes, biases, and preferences guide our interactions as they unfold.
    If anyone in the orchestra chooses to stray from the conductor’s guidance, the
    performance quickly devolves into an off-key, unconvincing cacophony.


    Our brains have evolved to distinguish inauthenticity in record time. This evolution
    comes from an initial drive to detect incongruencies in our environment, which
    once helped our ancestors survive in a world where unfamiliarity meant danger.
    Today, this wiring prompts us to question the veracity of what we see and hear
    from others, making us skeptical of anyone who appears too polished or too good
    to be true.


    Any influence approach that sidesteps openness, trust, or authenticity is a short-term
    strategy. Long-term success comes to the people who decide to approach interactions
    with honesty—about their goals, their personalities, and their plans to succeed.
    Perceived authenticity goes hand in hand with perceived trustworthiness, as long
    as you’re not authentically evil. That’s why so many American political groups
    poll with the beer question.


    The beer question is a thought experiment politicians use to determine how authentic
    and likable a candidate appears.^([2](#Notes.xhtml#ch03note2a)) The question—“With
    which candidate would you rather have a beer?”—has nothing to do with anyone’s
    political beliefs, platforms, or agendas. Instead, it measures the more “human”
    elements of a candidate, bringing them down from the political sphere and placing
    them in the people’s favorite bar. The beer question doesn’t determine which candidate
    is the best fit; it simply points out which is the most likable. The question
    reveals a deeper truth about humans—mere perception of authenticity sometimes
    inspires feelings of trust.


    Any position that relies on a consensual power dynamic requires trust. Politicians
    who lose the people’s trust (in theory, at least) can lose reelections. If a Realtor
    loses a customer’s trust, they lose the sale too. A CEO who loses the board’s
    trust will struggle to find a new position as word spreads of their betrayal.
    This doesn’t mean the person with power has to be successful at all times—people
    are generally more forgiving about failure when they believe the person who failed
    had good intentions and tried their best. Whether they succeed or fail, the person
    in power must remain honest, open, and authentic.


    A good friend of mine, Jay Simpson, is a celebrity photographer who exemplifies
    how crucial trust and mutual consent are in the professional world. Jay holds
    a position of power over his clients—he convinces them to become extremely vulnerable,
    both physically and mentally, while he snaps photos. Not only does Jay work with
    celebrities who are used to guarding their vulnerability from the public, he also
    showcases his art with big-name businesses like Calvin Klein, Nike, Target, and
    New York Fashion Week. He must convince his clients to be open with him, against
    their instincts, while both he and his clients know their collaboration will likely
    share this vulnerability with the world. This vulnerability is crucial, though,
    because it allows the photos’ audience to connect with the client, therefore increasing
    *their* trust in the client’s celebrity status.


    Jay’s role allows him to witness a side of these celebrities that the public almost
    never sees. While he collects the most beautiful moments with his camera, he also
    sees every moment in between, when this celebrity sheds their persona and becomes
    another human, one with their own self-image concerns. He must convince them to
    stay vulnerable despite their insecurities, even though doing so with a less ethical
    photographer could result in a scandal. Jay could use his position of power for
    selfish gains—and some people have asked him to—but it’s not who he is, nor is
    it someone he wants to be.'
