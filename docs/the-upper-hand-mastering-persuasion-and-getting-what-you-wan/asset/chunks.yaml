- raw: 'Over the years, as I’ve moved through the world of social engineering, I recognized
    how little the average person knows about their own susceptibility. Most people
    lack a fundamental understanding of how social engineering tactics can subtly
    influence them into giving up sensitive information. Although most people know
    not to share their date of birth, social security number, or bank account information
    with strangers, if they’re convinced of someone’s trustworthiness (or benign-ness),
    that knowledge fails to protect them.


    I decided to write a book on influence and social engineers because I want people
    to know themselves and others better—what makes us open to sharing, willing to
    cooperate, and apprehensive about working with others. I want them to see signs
    of manipulation before it’s too late. And when it comes to practicing influence
    techniques in their own lives, I want people to feel like they can be effective
    without being unethical. That’s why I developed The Upper Hand.


    The Upper Hand framework enables prosocial engineers to transition from principle
    understanding to tactical application, drawing a firm line between ethical influence
    and manipulation. The framework provides the tools you need to succeed without
    crossing that line. Gaining The Upper Hand in any interaction is not about exploitation
    or leveraging force, but rather establishing trust and engaging the human instinct
    to cooperate. Understanding the foundational principles of human behavior will
    empower you to navigate both personal and professional situations effectively,
    creating interactions where everyone wins.


    Mastering prosocial influence takes practice. At Social-Engineer, every new employee—whether
    they’re intending to become a social engineer or working in IT—attends an intensive
    week of training sessions. This helps all of us better understand influence, social
    engineering, and information elicitation, preparing us to protect ourselves from
    malicious influence and ethically influence others.


    During each training session, we were given homework assignments to help us practice
    prosocial engineering in and out of the workplace. These assignments grew tougher
    as the sessions went on. One early assignment asked us to find a stranger, strike
    up a conversation, and learn their last name, birthday, and reason for visiting
    Orlando by the end of our interaction. Another asked us to learn a secret from
    a stranger. A final (and tricky) assignment asked us to get an answer to the question:
    “What’s your biggest regret in life?” Every assignment required us to gain the
    trust of a stranger and connect with them on a level deeper than most first interactions
    go.


    I’m not a social engineer by trade, but I know the principles of influence well
    enough to incorporate them into my everyday life. Small-scale influence builds
    larger influence. Like with any skill, the more you practice, the better you perform.
    It’s difficult to imagine finding out a stranger’s biggest regret now, but after
    some practice, you’ll be surprised how easily people willingly share intimate
    information with you. When you present yourself as a kind, trustworthy, cooperative
    person, people won’t just accept your influence—they’ll actively seek out your
    input.


    “Leaving people better for having met you” can sound like a tall order because
    it requires being in touch with the intention preceding the influence. Sometimes
    intentions are obvious and easy to evaluate. To Super 8, Mitch’s intentions were
    clear: sure, he was motivated by his own professional success, but his presentation
    didn’t focus on only his success. He focused instead on his genuine desire to
    bring reliable accommodation to the millions and billions of citizens and tourists
    in China. There’s nothing wrong with admitting how you stand to benefit in an
    interaction—in fact, avoiding selfish intentions will only damage trust. The key
    is to acknowledge what you stand to gain, then ensure your focus remains on mutual
    benefits stemming from ethical intentions. When ethical intentions are clear,
    trust comes easier. And this is crucial, because—as you’ll read in the next nine
    chapters—trust is the foundation of influence.


    ### Trust: The Foundation of Influence


    Wielding The Upper Hand requires a solid understanding of trust’s role in any
    interaction. Though the human brain is wired to cooperate and connect with others,
    it’s also wired to avoid the untrustworthy. If the brain senses false trust or
    manipulation, attempts at influence can dramatically backfire.


    In the US TV show *The Office,*^([3](#Notes.xhtml#ch01note3a)) Andy Bernard is
    the perfect example of influence backfiring. When he first appears, Andy brags
    to the camera about his ability to influence his new coworkers by using basic
    manipulation tactics: “name repetition, personality mirroring, and never breaking
    off a handshake.” He sees some initial success from these tactics, but it doesn’t
    take long for his officemates to see through his ploy. Once they recognize his
    influence as fake, they dislike him, and it takes a long time for him to earn
    their trust again.


    In the real world, it takes more than a few gimmicks to convince people to trust
    you, listen to you, and ultimately cooperate with you long term. Leverage such
    as a power dynamic can be intimidating enough to force temporary cooperation,
    but it creates a fragile relationship. As soon as the dynamic shifts, the relationship
    may end, and the barriers to forming a new, equal relationship are higher.


    Popular media often portrays influence as a means to strong-arm others into agreement.
    When Andy’s initial influence attempts don’t win over his coworker Dwight Schrute,
    he tries to convince Dwight that he is actually Dwight’s superior. (Spoiler alert
    if you haven’t seen *The Office*: it doesn’t work. Also, who hasn’t seen *The
    Office* by now?) Myths surrounding influence often relate it to social shortcuts,
    tricks, and manipulative tactics, condemning it to fail and cause long-term adverse
    effects on relationships and self-worth.


    When I first started my undergraduate program in psychology, I believed influence
    was mostly a negative concept too. I was convinced people were primed for deception.
    I believed people were innately selfish. One person would happily disadvantage
    another for better chances of survival, and so everyone always had to be on the
    lookout for liars and cheats. But as I began my doctoral degree at the United
    Kingdom’s University of Lancaster, the research in the field of social psychology
    suggested otherwise.


    Yes, the human brain is wired to survive at all costs. However, our survival is
    better guaranteed in a group setting, where we can pool resources and benefit
    from one another’s skills. Every human needs connection with and cooperation from
    other humans to survive and thrive.


    In fact, humans are some of the most cooperative animals on the planet. Other
    animals do cooperate with each other, but many other social mammals typically
    keep their cooperation limited to relatives or packmates. Humans cooperate with
    total strangers every day: we pile into buses and planes together, wait in lines
    at the pharmacy together, and drive cars according to the shared rules of the
    road. We might not always benefit from cooperating with others (it might cost
    us an extra minute in the queue), but we do it anyway.


    Why?


    The short answer is that humans are an extremely social species. Our brains are
    wired to identify with social groups, like families, communities, and societies.
    Our chances of survival are greater when we’re in a group—there is safety in the
    herd. The more positive connections an individual has, the more resources are
    at their disposal, so the greater their chance of survival.'
