    So what is influence exactly, and how does it differ from social engineering?
    While many of us have undoubtedly heard the the word “influence” in dozens of
    contexts, our idea of what it means in a biopsychosocial context may be a bit
    skewed. The word “influence” has taken on a negative connotation over the last
    few decades. Social media’s propagation of “influencers” makes us think of vapid,
    low-effort salespeople pushing products in obvious and sometimes subliminal posts.
    Being “under the influence” of a substance or person conjures the idea of not
    being in control of our own actions.


