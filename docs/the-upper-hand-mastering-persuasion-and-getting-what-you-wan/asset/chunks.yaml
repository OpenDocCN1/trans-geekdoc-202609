- raw: 'Grocery stores put a lot of effort into making customers feel comfortable
    while they shop. We, as influencers, already know how the mind and body affect
    each other’s comfort levels. The grocery store designers know this, too, which
    is why they put physical and mental comfort on their priority list. They pump
    warm air in the winter and cool air in the summer to keep the temperatures pleasant.
    Even the music they play keeps customers moving at a leisurely pace through the
    aisles.^([3](#Notes.xhtml#ch10note3a)) When they slow down, they feel calmer—and
    they spend more.


    Grocery products even go so far as to make their packaging appeal to their customers’
    self-identity. If you’re someone who feels self-conscious about what they put
    in their cart, you can curb that feeling with packages covered in “All-Natural”
    and “Organic.” Even if the product’s nutritional value is no better than the full-fat,
    extra-processed alternative, it looks healthier. It makes people feel better about
    their choices when shopping.


    All these factors come together to create an experience that encourages spending
    time, money, and energy inside grocery stores. Smaller techniques like putting
    “essential” items—milk, bread, and eggs—at the back of the store does the same.
    Grocery store designers use social engineering to increase their profits, their
    reputation, and their customer satisfaction.


    Even online, social influence determines how likely we are to choose certain businesses,
    products, and activities. Online reviews help potential customers decide whether
    to engage with a business. Google reviews and Yelp give broad reviewers a place
    to share their experiences with others. Some apps and websites have their reviews
    built right in, like Uber, Airbnb, and [Booking.com](http://Booking.com).


    There is a strong, looping connection between humans’ biopsychosocial imperatives
    and our everyday decisions. When we see the connection for what it is—social engineering—we
    can revolutionize the way we interact with the “real world” around us. We can
    recognize how it works on us, then make it work for us.


    ### Crafting Lasting Influence


    The environmental considerations for social engineering can help you build a space
    designed for influence. You don’t have to be an architect or an interior designer
    to create rooms that cultivate meaningful interactions. Knowledge about what makes
    people feel comfortable, confident, and competent can enhance your meeting spaces
    to influence the people you invite inside. By incorporating your newfound human
    behavior expertise into your environment, you practice being a prosocial engineer.


    You can redesign your office to help you facilitate influence in a business setting.
    Building a socially engineered office is all about striking balance: you want
    the space to feel comfortable enough to avoid distraction, but not so comfortable
    that people see it as a second break room. Soft but bright lighting, one or two
    armchairs, and a midrange temperature should suffice. You want your office to
    portray your competence, so it must stay neat and organized. But if it’s so neat
    that it feels sterile, you’re likely to hinder your perceived trustworthiness.
    A few family photos, a framed diploma, and a knickknack or two strike a safe balance.
    Finally, you pick out a desk chair that’s slightly taller than the other seating
    in the room. It’s a small touch, but it makes you feel confident, so it works.


    If you’re taking a larger business meeting in a public space, your knowledge of
    influence can still help you choose a place even if you haven’t designed it yourself.
    Restaurants like barbecues or buffets don’t bode well for influence—no one wants
    to talk business when they’re covered in sauce, nor when someone leaves the table
    every 10 minutes. A place with neat, small meal choices is better suited for conversation.
    You can further encourage everyone’s comfort by choosing a restaurant with plenty
    of food options, like vegetarian, vegan, and dairy-free food, and both alcoholic
    and nonalcoholic drink options. That way, no one struggles to find their favorite
    options, and space is freed up to focus on the interaction.


    At home, you can even rearrange the places you gather most to influence social
    interactions. Rooms with semicircle seating promote conversations, while rooms
    with all furniture huddled around a TV are perfect for group movie nights. Circular
    dining room tables are best for creating group conversations that feel intimate,
    while long, rectangular tables tend to cause smaller conversations to crop up
    at either end. Bright lighting promotes energy, while dimmer settings create a
    sense of intimacy that can be valuable for private conversations between one or
    a few people. Whether you’re socializing in a family room, dining room, or backyard
    patio, the design choices you make can help foster a thriving gathering.


    As you continue on your journey to master The Upper Hand, you will undoubtedly
    see your impact on the world around you. On a small scale, you’ll see meaningful
    improvement in your ability to make new connections, business partners, and even
    friends. The relationships you made before will soar to new heights when you reap-proach
    them from a perspective of mutually beneficial collaboration. Once you make a
    conscious effort to connect with the people in your life, you may realize how
    little you actually connected before. You might even learn new things about people
    you’ve known for years.


    On a larger scale, your mastery of The Upper Hand can encourage better decisions
    within your team, your company, and your community. The more you strive to make
    your team feel comfortable, competent, and confident, the more empowered they
    become. Who knows what new accomplishments they’ll earn under your new, ethical,
    influential approach? Your colleagues and even your bosses may be surprised by
    the levels of success you achieve once you’ve got a proven strategy for fostering
    collaboration.


    Outside of the workplace, you may find new interest in influencing parts of your
    community. You might feel strongly enough to start a petition, influencing your
    neighbors to band together over a shared cause. You may use your influence for
    community betterment, organizing litter cleanups, tree-planting groups, or support
    chains for local families down on their luck. Or perhaps your influence works
    as simply as encouraging your local coffee shop owner to provide more seating,
    giving customers more room to hang out, feel comfortable, and buy a second cup
    of joe.


    The influence strategies you use will determine your legacy. Will you go on to
    be known as one of the most cunning, influential masters of human instinct, like
    the great Sherlock Holmes? Or will you resort to manipulating, cheating, and playing
    mind games with your victims, like his nemesis, Professor Moriarty? How you are
    known among your colleagues and community depends on how you choose to interact
    with the people around you.


    The legacy of a person’s impact rests not on fleeting transactions, but on the
    lasting impressions they create through consistent, positive, connection-rich
    interactions. When you choose to use your knowledge of influence to help people
    make better decisions, you create positive change. You instill value and meaning
    into your relationships. You make people’s lives easier, more successful, and
    better for having met you.


    When you consistently use prosocial engineering in your interactions, people won’t
    just join your tribe; they’ll seek it out. They won’t just speak your language
    once; they’ll learn it long term so they can share a stronger, longer connection
    to you. They’ll know you well enough to see when you’re struggling and pants themselves
    so you don’t have to. They’ll show you every item on their inner shelves and appreciate
    every item resting on yours. As you make a habit of reaching out with an open
    hand, you’ll be surprised how often the people in your life will do the same for
    you.'
