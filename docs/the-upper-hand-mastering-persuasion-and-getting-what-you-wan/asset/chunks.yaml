    ## [UNDERSTANDING INFLUENCE](#Contents.xhtml#rpart1)


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 1](#Contents.xhtml#rch01)


    ## [WIELDING THE UPPER HAND](#Contents.xhtml#rch01)


    What does it mean to gain the upper hand on another person? The common responses
    to this question often center around leveraging something—connections, intelligence,
    charm, beauty, money, status, or insider knowledge—that gives you an advantage
    during an interaction. But what do you do if you have none of those things? How
    do you get what you want? And is it possible to get it without jeopardizing existing
    and potential relationships?


    It is possible to gain the upper hand over someone, even a complete stranger,
    with no leverage at all. And this is important to note, because leverage isn’t
    failproof. Even if you have an IQ of 180, a face that rivals Helen of Troy, and
    a loaded Swiss bank account, these traits don’t guarantee you’ll get what you
    want from others.


    Leverage, by definition, requires some amount of force. Force creates friction
    in an interaction and erodes trust. There’s no guarantee someone will be swayed
    by the leverage you possess. A developer might offer $50,000 over asking on a
    property, yet the homeowner sells to a young couple with dreams of raising their
    children in the home. A former underwear model may lose a client-facing receptionist
    gig to a dowdy fiftysomething with a little more experience. A parent threatens
    punishment, but the teenager still disobeys.


    When leverage fails, people often turn to tricks and schemes, applying more force
    rather than laying off the pressure. They might use resource scarcity or time
    pressure, or take advantage of a power dynamic to drive desired behavior. These
    tactics can work in the short term, but when they’re used over longer periods,
    such as in modern business dealings, they often ruin relationships. And some of
    the most important deals require months or even years of cooperation from both
    parties—which is impossible when one side makes the other feel betrayed.


    There is a path you can walk to gain your desired outcome without using manipulative
    tactics. I call it The Upper Hand.


    The Upper Hand is my framework for using influence without resorting to unethical,
    manipulative persuasion strategies. This framework draws from modern behaviorism
    to present the most effective strategies for influence. When you use The Upper
    Hand, you gain the ability to enter a conversation without any leverage at all
    and still walk away with exactly what you wanted. This framework isn’t dishonest,
    coercive, or even sneaky—in fact, it’s more intuitive than any manipulative strategies,
    because it’s built on our natural instinct to trust others.


    Mitchell Presnick is a man who intuited how to wield The Upper Hand early in his
    career. Today, Mitch is an entrepreneur with over 30 years of investing experience
    in China. He’s brought multiple American brands to the massive markets in China,
    including Anheuser-Busch, Edelman, Proctor & Gamble, Mars Inc., Johnson & Johnson,
    and more.


    These days, Mitch has a reputation of success he can leverage in his business
    deals. But back in late 2003, Mitch only had a business plan—one he needed funding
    and partners for. His idea was to bring a model of business to China it had never
    practiced before: franchising.


    Former colleagues and friends called him crazy—the model was prime for American
    and Western capitalism, but it would never work in the Chinese economy. Yet Mitch
    knew there was an opportunity in China, and that the first type of franchise business
    that would thrive there would be budget hotels. It wasn’t sexy, it didn’t have
    the allure franchising, say, the Four Seasons would, but Mitch had a hunch it
    would work.


    Before China hosted budget chain hotels—much less American-brand hotels—all consumers
    had to go on when assessing a hotel in China was the price. These were the days
    before websites like [Booking.com](http://Booking.com) or Kayak informed guests
    of what to expect at an independent hotel. A cheap hotel could be immaculate,
    and an expensive hotel could host more rats than humans. Mitch believed customers
    wanted consistency more than luxury, that most customers would opt for the comfort
    and trust of a recognizable brand, even if it cost a little bit more than the
    average independent Chinese hotel at the time.


    To make his dream a reality, Mitch couldn’t rely on a flashy slide deck, high-pressure
    sales tactics, or “creative” numbers. And acting aloof or as if his plan had several
    bidders lined up would be deceptive. If he was going to secure a partnership,
    he needed the business leaders to trust him.'
