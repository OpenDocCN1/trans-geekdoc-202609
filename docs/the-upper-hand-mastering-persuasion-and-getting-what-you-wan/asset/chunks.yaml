- raw: 'Her words invite the same kind of refreshment you’d feel if someone opened
    all the windows in the office. You know what “one of those mornings” means, even
    if the symptoms vary—traffic, cold coffee, mismatched socks, kids missing the
    bus—and you’re reminded that Margaret *is* a person, just like you. No one rolled
    her out of the CEO-Bot Charging Closet just to take this meeting. She woke up
    this morning and faced one tiny blunder after another, just like you do sometimes.


    At first, you had no way to know for sure if you were the only one feeling anxious.
    But when Margaret brought up her own anxiety along with everyone else’s, the room
    became united under a common set of stakes. Finally, Margaret strengthened that
    unity by announcing a shared goal—a goal everyone was there to achieve.


    In other words, Margaret pantsed herself, and everyone felt better.


    Self-disclosure is crucial in developing and maintaining trust in any relationship.^([2](#Notes.xhtml#ch07note2a))
    It deepens interactions and allows people to understand each other on a deeper
    level. And self-disclosure often leads to *mutual self-disclosure*. When one person
    shares a vulnerability, people are more likely to share one of their own.


    Mutual self-disclosure suggests that people share vulnerabilities with people
    they trust. Friends swap secrets because they trust each other not to share them
    beyond the group. Colleagues share gossip between office walls and trust they
    won’t leave the building. At Disney’s parks, the newbies’ vulnerability isn’t
    a secret, and they trust the customers to show kindness. At the very least, they
    trust their managers to support them if the badge doesn’t protect them from the
    most impatient parkgoers. Mutual self-disclosure creates more connection and promotes
    successful, healthy, long-term relationships.


    When you share a vulnerability, you extend trust to others, which gives them the
    opportunity to return it. This mutual display of trust is evidence you have The
    Upper Hand. If someone shares with you that they aren’t at their best mentally,
    they must trust you’re not going to use that information against them. They’re
    more likely to trust you with their own vulnerabilities once you’ve shared yours
    with them.


    Of course, there is always a risk that self-disclosure will not go as planned.
    Being vulnerable doesn’t guarantee you’ll be met with open arms. People might
    even feel more uncomfortable when you share a vulnerability. You might be rejected
    or dismissed. Worse, the information you disclose could be used against you. But
    the Pants Yourself practice is less about revealing deep dark secrets, and more
    about addressing the emotional elephants in the room.


    Often, self-disclosure doesn’t just help us wield The Upper Hand—it can make us
    feel better in an interaction.^([3](#Notes.xhtml#ch07note3a)) Instead of struggling
    to stay composed when we are frustrated, anxious, or otherwise stressed, pantsing
    yourself can help you be more *you*. It takes cognitive effort to present a calm
    emotion while suppressing an uncomfortable feeling. Taking off our “masks” can
    be a cognitive relief.


    The Pants Yourself practice is especially useful when the people around you aren’t
    emotionally aware. If your coworker Steve’s face is growing redder by the minute
    but he’s too stubborn to take a deep breath, pantsing yourself might burst his
    rage bubble. Being vulnerable with him pumps the brakes on his own brain processes.
    In a professional context, being vulnerable can be jarring enough to interrupt
    the brain’s automatic emotional thinking and allow for a moment of contemplative
    thought. Without interruption, Steve’s anger will continue to build. Meeting Steve’s
    anger with more intense emotions only fuels his emotional state. Instead, meet
    Steve’s tension with the opposite: emotional release.


    By showing vulnerability, you shine a light on the humanity hiding beneath your
    composure. It demonstrates that you are not the threat. Believe it or not, people
    prefer making deals with people more than they like working with chatbots or picture-perfect
    professionals.^([4](#Notes.xhtml#ch07note4a)) They prefer sharing a common goal
    with someone who shows them empathy and compassion, not perfection or unrealistic
    behavior models. When highly competent people admit to a small pratfall, their
    colleagues tend to like them even more.^([5](#Notes.xhtml#ch07note5a)) Seeing
    a leader pants themselves reminds us that, hey, we’re all human here.


    ### Don’t Fake It


    Like all good things, pantsing yourself works best in moderation. The first few
    times you use this practice, people will be relieved, understanding, and empathetic.
    But if you’re consistently the first one to drop your emotional trousers the moment
    a situation gets a little tense, this technique will lose its potency. For this
    practice to remain effective, you must use it mindfully.


    If you’re not mindful about when and how you pants yourself, you run the risk
    of appearing manipulative, coercive, or deceitful. You must avoid presenting inauthentic
    vulnerabilities, sharing vulnerabilities in the wrong context, or pantsing yourself
    for the wrong reasons. Inauthentic motivations create inauthentic results.


    There’s a fine line between pantsing yourself as a solution and pantsing yourself
    as an excuse. Let’s say your team has a massive presentation due at the end of
    the month, but one team member (Steve again) hasn’t finished their section. Instead
    of chastising Steve for slacking off, you inform the higher-ups that you’d like
    more time to prepare yourself. This is all new material, you explain, and the
    more time you have to prep, the more likely you are to succeed. They understand
    and give you an extra week. Great!


    Meanwhile, you approach Steve and ask him how you can help him finish his section.
    He responds with, “This content is confusing, I don’t have enough time to finish,
    and I’m just going to do it wrong anyway. Could you just do it for me?” He looks
    up at you with sad, puppy dog eyes, and you catch yourself before you say yes.


    Steve has pantsed himself here, but once you move past the initial emotional response,
    you realize his adaptive tactic. He’s using self-deprecation to get out of doing
    the work. He’s giving an excuse without a solution. He shows a vulnerability—a
    lack of confidence and time. He *wants* you to feel sorry for him and take the
    work off his plate.


    When people expose vulnerabilities to gain sympathy instead of empathy, it makes
    others uncomfortable. In this example, since you’re an empathetic person, Steve’s
    pantsing prompts you to want to comfort him, disagree with his self-deprecation,
    or present a solution for him. Realistically, none of these options solve the
    problem at hand. You don’t have a real solution, and you’re probably feeling *more*
    stressed instead of relieved.


    Steve’s tactic provides a short-term solution—you’re out of time here, so you
    take on his share of the work. However, next time you have a presentation like
    this, you’re less likely to invite Steve to contribute. Instead of fostering collaboration,
    Steve showed you he can’t be trusted to finish the job. He took advantage of your
    empathy. He may think his pantsing gave him The Upper Hand in the short term …
    but when he sees the pink slip on his desk a few months later, he knows he made
    a mistake.


    Pantsing yourself requires genuine vulnerability to be effective. Operating from
    an inauthentic place to make excuses, ignore responsibilities, or distract from
    mistakes doesn’t result in true influence—it makes others mistrustful and uncomfortable.
    Only by being transparent, authentic, and vulnerable can you prove yourself trustworthy
    and create a foundation for genuine interactions.'
