- raw: 'Now, if *Shark Tank* isn’t an environment where entrepreneurs thrive, why
    is the show still running? How did some of the products, like Bombas socks, Scrub
    Daddy sponges, and Comfy wearable blankets, end up wildly successful? Why do business
    owners still compete to pitch their products? The answer is simple: while the
    deals often fall apart in the real world, they make great TV.


    *Shark Tank*’s process makes engaging television because it’s dramatic. The thumping,
    *Jaws*\-like theme song, the moody lights, and the temperamental sharks keep viewers
    enthralled. The more people watch, the more exposure businesses gain, so business
    owners jump at the chance to be featured, which often means accepting a deal whether
    it’s in their best interest or not.


    Behind the camera, though, *Shark Tank* resorts to some negative influence techniques
    to maintain that TV-grade drama. The whole interaction is socially engineered
    to be stressful. From their first step on set, entrepreneurs enter “the tank”
    via a long hallway walled with screens showing real sharks circling them. This
    creates an immersive experience that makes entrepreneurs feel like they’re entering
    the sharks’ lair, increasing cortisol levels and adding more stress to the situation.


    When the entrepreneurs reach the main stage, they see the “sharks” seated in lush
    chairs on a raised platform. This immediately secures the divide between predator
    and prey, as well as a “them versus me” mentality. Once entrepreneurs begin their
    pitch, it’s not uncommon for sharks to interrupt them, talk over each other, or
    outright dismiss the deal before the pitch is over. The influence tactics at work
    on *Shark Tank* can be so overwhelming, some entrepreneurs buckle under the pressure.
    One contestant actually fainted on the stage in the middle of his pitch. Since
    then, the show has kept a psychiatrist on hand, and all entrepreneurs meet with
    them right after finishing their pitch.^([3](#Notes.xhtml#ch03note3a)) The environment
    isn’t collaborative; it’s combative.


    Compound the pressure of an unfamiliar experience with the pressure to make a
    deal, and you have the perfect recipe for regretful business decisions. Most of
    these entrepreneurs aren’t used to being on television. Even if they’ve had some
    experience filming commercials, the *Shark Tank* environment is undoubtedly less
    comfortable. The bright stage lights, glinting cameras, and all the backstage
    crew members’ gazes can be downright overwhelming. Nothing about this environment
    is comfortable for the entrepreneur by design. It’s what gives the show its stakes.


    In the real world, business deals rarely function how *Shark Tank* makes them
    appear—in fact, not even the deals made on *Shark Tank* function the way they
    appear. Plenty of the show’s featured businesspeople walk away with a handshake
    deal, but many experience severe buyer’s remorse when their stress levels out.
    They realize, once they’re no longer starstruck or stage-frightened, that giving
    away half their business for a measly $100,000 wasn’t the best decision. They
    realize how much they were influenced by the show and feel embarrassed, distraught,
    and, sometimes, angry.


    These emotions don’t bode well for the beginning of a long-term partnership, so
    it’s not uncommon for *Shark Tank* deals to fall through after filming is done.
    Only about 27 percent of the deals featured in the show’s first seven seasons
    actually closed.^([4](#Notes.xhtml#ch03note4a)) Sometimes the sharks pull out
    of the deal, too, after looking deeper into the entrepreneur’s hard data. They
    know as well as the entrepreneurs do that if they enter a deal feeling lied to,
    taken advantage of, or reluctant to move forward, the deal is dead in the water.


    The majority of successful business deals come out of environments designed for
    comfort, confidence, and critical thought. Shortcut solutions work every once
    in a while, but for every Scrub Daddy success story, there are dozens of stories
    like the ShowNo Towel, You Smell Soap, and Hy-Conn. When people are placed in
    high-stress, coercive situations, they might say yes, but the “yes” doesn’t last.


    Influence techniques can be useful during negotiations, but those negotiations
    only produce long-term success when they’re based in trust. High-pressure influence
    tactics lead people to get carried away by the short-term solution, distracting
    them from the negative consequences looming just out of their foresight.


    Using scenarios like the ones presented in investment shows like *Shark Tank*
    will cause business owners to engage in unethical influence. They can result in
    breaches of trust, missed business opportunities, or worse, a total collapse of
    the company. Environments built to foster high-pressure decisions, coercion, or
    manipulation only make it harder to secure The Upper Hand.


    ### A Glowing Reputation


    Today, relying on influence tactics that only secure short-term wins isn’t just
    a bad business plan—it can ruin careers. Word travels fast in our digital age.
    Online reviews are a massive consideration for growing companies. If you’re known
    for your cutthroat negotiation skills or your manipulative business dealings,
    you’ll struggle to secure any business, new or old.


    If your reputation precedes you, make sure it’s a good one. Every time you give
    in to the temptation of shortsighted influence tactics, you risk your reputation.
    One little slip here and there isn’t likely to ruin you, but even the smallest
    deviation into the world of unethical influence could cause you to be “canceled”
    if the world at large uncovers your tricks. People don’t appreciate being used,
    manipulated, or conned, and if they feel like you’re guilty, they’re quick to
    denounce you.


    In the case of Diane, she believed her unethical influence only mattered on a
    case-by-case basis. By the time her errors caught up to her, it was too late to
    change, and her business suffered as a result. She earned a reputation for disingenuousness,
    and it will likely follow her for the remainder of her career.


    Compare her story with Jay, who built a prominent photography career thanks to
    his consistent authenticity, reliability, and openness. Jay has established such
    a reliable reputation, he has the luxury of choosing the people with whom he collaborates.
    He bases his decisions on whether he feels the same trust and authenticity he
    extends to others, since their projects are the ones he finds most rewarding.


    In the business world, maintaining a trustworthy and ethical reputation is crucial
    for long-term success. People who prioritize mutual consent, authenticity, and
    transparency in their dealings tend to build lasting relationships based on mutual
    respect and shared goals. These qualities not only maintain existing relationships
    but also help you attract valuable partnerships through your positive reputation.
    By consistently demonstrating ethical behavior, you can distinguish yourself from
    others in your industry and earn the respect of your peers, colleagues, and clients
    alike.


    Creating, sharing, and engaging in authentic interactions with others is the best
    way to secure The Upper Hand. When you ensure you’ve considered the perspective
    of the person you’d like to influence, you guarantee the relationship grows out
    of a mutual desire to succeed. The more meaningful relationships you foster this
    way, the more opportunities you’ll have to build a strong reputation. Your presence
    online and in person is bound to grow alongside the relationships you nurture.
    Prosocially motivated people shine bright enough for everyone to see, and their
    light attracts other people who value honest, ethical interactions as well.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Part II](#Contents.xhtml#rpart2)


    ## [USING INFLUENCE](#Contents.xhtml#rpart2)


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 4](#Contents.xhtml#rch04)


    ## [GETTING A GRIP ON THE UPPER HAND](#Contents.xhtml#rch04)'
