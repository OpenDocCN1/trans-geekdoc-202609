- raw: 'Creating a tribe with a stranger is a great first step to make them feel safe
    with you. However, if you want to increase your power to influence, you need a
    stronger connection. If creating a tribe is how we invite someone through an open
    door to an interaction, speaking their language is how we make them feel comfortable
    inside.


    When I say this practice of The Upper Hand is “Speak Their Language,” I’m not
    suggesting you learn a new language. Instead, focus on sharing a common context
    in your conversations. Find out what’s important to the other person, then build
    a sort of “shop talk” around your shared beliefs, values, and goals. By doing
    so, you show the person you’d like to influence you’re someone with whom they
    can connect, communicate, and collaborate.


    Showing people we speak their language means carefully crafting how we reflect
    back what they consider respectful, meaningful, or trustworthy. Speaking someone’s
    language can be as simple as holding back curse words around your politically
    correct grandmother, or repeating industry-specific terms when discussing a friend’s
    job. I love when people come up to me after a speech and say things like, “Your
    talk was amazing!” But if someone approaches me with, “Your speech got me thinking
    … what are your thoughts on the underlying neurological mechanisms responsible
    for embodied cognition?” I light up like the Rockefeller Christmas tree.


    Years back, I applied for a lectureship position at Northampton University in
    the United Kingdom. I wanted the position with all my heart, so I put all my time
    and energy into practicing for the interview. It wasn’t enough for my resume to
    match their job description; every candidate would meet most, if not all, of their
    qualifications. If I wanted to stand out, I had to show them more. I couldn’t
    present as the perfect candidate for a university lecturer—I needed to present
    as the perfect candidate for a Northampton lecturer. When I entered that interview
    space, I needed to show the hiring team how well I spoke Northampton’s language.


    This interview took place during the COVID-19 pandemic, so the meeting was virtual.
    Without the in-person advantage, my influence strategy was limited. Still, I did
    the best I could with what I had. I made sure the background visible in the video
    call portrayed professionalism (as best as it could from a university dormitory
    room). I dressed for success from top to bottom, not only to present well on camera,
    but to make myself feel more confident and capable. I made sure I had a warm cup
    of tea on hand to soothe my nerves.


    By the time the interviewers signed on, I was as prepared as I could be. I knew
    all their names, specific fields of study, and most recent publications. I could
    practically picture myself on the other end of this interaction in the future.


    I greeted each interviewer personally, then the interview began in earnest. As
    we went forward, my anxious energy converted into excitement. I knew the answers
    to their questions. I had memorized mottoes, acronyms, and ideal subject matters
    for the school. By the time the more specific questions came, I felt more comfortable
    than ever.


    “What do you consider your ideal lecturing environment?”


    I had taken special preparations for this question. At the time, Northampton University
    was in the process of swapping out large lecture theaters in favor of smaller,
    more intimate halls. A recent finding at the school discovered that smaller groups
    helped facilitate more independent learning and were more accommodating for neurodiverse
    students and staff.


    “I thrive in small groups as opposed to grand lecture halls,” I said. “I find
    that smaller groups feel more connected and give students more chances to communicate
    with me and with each other. I know large spaces have their benefits in some cases,
    but overall, I find smaller halls to be more rewarding for everyone.”


    “I see,” said another interviewer, marking up her notepad. I watched her circle
    something a few times.


    “So,” the first interviewer continued, “if you were to fill this position, how
    do you think your research will fit in with the university’s greater collection?”


    “That’s a great question,” I said, “and I have a few ideas already. I noticed
    that Professor Halt is currently researching age-related cognitive decline, which
    would be an interesting collaboration with my work on nonverbal communication
    skills. I also think a collaborative effort between the clinical team working
    on complex trauma and my work examining the life histories of serial killers could
    bring in some valuable work for the university.”


    As I spoke, I watched another interviewer’s eyebrows raise as he considered my
    response. I could see his pen scratch a short note at the bottom of the screen.
    I waited patiently for him to set his pen back down.


    “You have clearly done your research, Ms. Maroño,” he said briefly.


    The interview continued for a while longer. The interviewers left me with a line
    that wasn’t a “yes,” but wasn’t a “no” either.


    “Regardless of the outcome,” one had said, “I am sure you are someone we would
    love the opportunity to collaborate with.”


    As I closed the screen of my laptop, I was terrified and nervous. But I was also
    satisfied I had done all I could. I knew I was unlikely to be the best candidate
    based only on my written credentials, but I was confident I had shown my passion
    for this school, at this time, with this staff. I had put in the time and the
    effort to find what makes Northampton unique and how I would fit.


    There is power in communication, whether it’s verbal or nonverbal. By adjusting
    how you present yourself to best complement what the other person finds familiar,
    appropriate, and comfortable, you immediately give yourself The Upper Hand during
    your interaction. Your effort to speak their language inhibits any stress response
    they may have, and it also sets up an unconscious desire to connect with you.


    Sharing a language with someone else doesn’t require you to be dishonest or inauthentic.
    It doesn’t require any unethical practices. During my interview, I didn’t lie
    or make anything up. I didn’t embellish my qualifications, nor did I pretend my
    knowledge was some stroke of luck or coincidence. I wanted my interviewers to
    know how much I prepared. I wanted them to take notice of our shared language,
    not only as academics, but as people who were passionate about Northampton.


    If you try to speak someone’s language from an inauthentic position, you’re more
    likely to make a fool of yourself than make a new connection. Take Joey Tribbiani
    from the TV show *Friends*, for example.^([1](#Notes.xhtml#ch06note1a)) Joey is
    a lot of things—he’s sweet, he’s kind, he’s charming—but he isn’t very intelligent.
    When his best friends need a recommendation letter for an adoption agency, they
    don’t initially ask for his help.


    “We don’t think of you as really being so much … with the words,” Monica says.


    Joey wants to prove them wrong, so he sets out to write the most intelligent letter
    he’s ever written. Instead of learning “big words” to help make a genuine case
    for his friends’ adoption request, he opts for the thesaurus option on his computer.
    He swells up with pride when he presents the final draft … totally unaware that
    what he’s written doesn’t make any sense.


    “They are humid, prepossessing homo sapiens with full-sized aortic pumps,” Chandler
    reads out from the letter.


    “And hey, I really mean it, dude,” Joey replies, beaming.


    “Joey, I don’t think we can use this,” Monica says. “You signed it ‘Baby Kangaroo
    Tribbiani!’”'
