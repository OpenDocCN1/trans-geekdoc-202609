- raw: 'That’s the beauty of The Upper Hand at work: my invaluable relationships,
    in both my professional and personal life, began with a little bit of influence.
    I’ve never tricked anyone into thinking I’m someone I’m not. I’ve never made anyone
    think I can offer something more than what I have. I’ve simply strategized ways
    to put my best foot forward during interactions, ensuring the best parts of myself
    are available to those who need those skills most. In return, they often do the
    same for me, not because they feel they have to, but because they want to.


    How we interact with other people matters. As we move through this life, we constantly
    encounter opportunities for influence. The classes we attend, the jobs we take,
    and the events we attend give us countless chances to change our lives by making
    new connections with the people we encounter along the way. Despite the innate
    power of influence, few of us actually spend much time thinking about the best
    ways to use it. The Upper Hand changes this by helping us understand everyday
    influence and how to harness it.


    In the coming chapters of this book, I will guide you through how to wield The
    Upper Hand with skill and integrity. You’ll learn how to get what you want from
    others while building and maintaining trust. We’ll see how the techniques of The
    Upper Hand can be applied in all types of situations, from high-stakes boardroom
    meetings to getting directions from strangers.


    You’ll learn how to jump-start trust and “Create a Tribe,” sometimes with a single
    comment. You’ll learn how the “Speak Their Language” technique can deepen connections
    and demonstrate your expertise. In the “Pants Yourself” chapter, we’ll explore
    the power of transparency and vulnerability in encouraging cooperation. For the
    technique “Hold, Don’t Squeeze,” we’ll dissect the stress response that often
    has us pushing for a close too hard too soon. And in “Shelve It,” we’ll see how
    resisting retaliation consistently gives you The Upper Hand.


    Influence is powerful, and The Upper Hand is a tool for wielding that power responsibly.
    As you move through this book, learning the principles and practices within, you’ll
    see how influence can get you what you want without you even needing to ask. That
    doesn’t mean you’re playing mind games, nor does it mean you’re taking advantage
    of some hidden flaw in humanity. Instead, it means making the most of your relationships
    with others. The Upper Hand is about becoming such a positive influence on people,
    they’ll want to collaborate with you however they can, because being a part of
    something with you is more meaningful than going it alone.


