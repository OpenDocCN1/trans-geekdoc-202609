    (`ICAC`). He wanted us to speak at this training. Chris and I didn’t need to think
    about it—we jumped at the opportunity right away. Once he knew we were interested,
    Brad presented our credentials to his supervisor and the ICAC event organizer,
    who swiftly accepted the proposal. You can imagine our excitement when we received
    the invitation.


    Before we knew it, Chris, Brad, and I were standing center stage, looking out
    over a sea of special agents: local police, detectives, Secret Service, and Department
    of Homeland Security agents were all in attendance. I’d love to get specific and
    tell you some names, but then I’d have to kill you, and then someone would probably
    have to kill me (kidding, of course).


    This training was a dream come true for me, but more than that, it reminded me
    of the power of influence. These officials gained new strategies for eliciting
    information by connecting, collaborating, and earning trust. These strategies
    could save the lives of hundreds, maybe even thousands of children. It could stop
    the cycle of abuse from carrying on to more generations. The ripple effect of
    prosocial influence could stretch far beyond that ICAC stage, reaching people
    I’d never meet, never know, never hear from—but their lives would be fundamentally
    changed, maybe even saved.


    And what I taught in that training only covered a fraction of what you’re about
    to learn.


    ## What You Will Learn


    By the time you reach the end of this book, you’ll have new influence strategies
    to help you master your interactions on a daily basis. You’ll learn small-scale
    influence, the kind that will help you leverage your restaurant choice for lunch
    with friends. Next time you buy a car, you’ll walk off the lot with a better deal
    than most people have ever heard of. You’ll know how to swiftly convince your
    family to let you host holidays so you don’t have to travel (or, if you’re not
    the hosting type, you’ll convince someone else to host). You’ll come up with hundreds
    of new strategies for getting what you want from others, all without ever feeling
    like you’re being dishonest or inauthentic.


    These small-scale benefits are only the beginning. When used for larger goals,
    influence can ripple out to touch the lives of countless people. In Brad’s case,
    when he used influence to secure a confession from a predator, he saved children’s
    lives. By preventing the abuse of children, he also made it less likely those
    children would grow up to continue a cycle of abuse that could have carried on.
    Influence on a large doesn’t only make your life better—it makes the world better.

