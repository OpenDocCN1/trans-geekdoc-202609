    influence one another every day. How you answer the phone influences how the caller
    responds. When you give advice to a trusted friend, you may influence their decisions.
    When you make silly faces at a wailing baby, you attempt to influence their mood
    in hopes that the baby smiles, laughs, or at least stops crying. These instances
    of influence aren’t malicious or selfish—they pepper our daily lives with meaning
    and connection.


    Since influence itself is neither wholly positive nor negative, most people will
    say the `way` we influence others is either positive or negative. Influencing
