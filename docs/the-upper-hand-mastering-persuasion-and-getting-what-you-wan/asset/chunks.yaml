- raw: 'Serendipitously, Leslie’s friend and coworker, Mark, confesses to her that
    he plans to propose to his girlfriend, Ann. Ann is also Leslie’s best friend.
    Leslie is thrilled for the two of them, then has an idea: she could use Mark’s
    proposal as entertainment. Leslie convinces Mark to propose on camera during the
    telethon.


    “On television, though?” Mark asks.


    “Yes!” Leslie says, “We talked about it being something big, and I don’t think
    we can get a hot air balloon this time of night.”


    “It would make a great story,” Mark says during a confessional. “I trust Leslie.”


    So, Mark leaves the telethon to go home and grab his grandmother’s ring. Leslie,
    thrilled about her brilliant idea to bring in some viewers and donations, announces
    a “really amazing thing” scheduled for the end of the telethon. She fills the
    time slots with more boring acts but keeps teasing viewers with an act they won’t
    want to miss.


    In the meantime, while Mark is still gone, Ann visits the telethon set to talk
    to Leslie.


    “I think I need to break up with Mark,” Ann says.


    Leslie’s eyes nearly pop out of her head.


    “I’ve just been feeling for a while like something’s missing,” Ann continues,
    “and I kept thinking about the question you asked me before … about whether or
    not he’s the one. And he’s not.”


    “Mark really loves you,” Leslie says, avoiding eye contact with Ann, “and I think
    he’s ready to take this to the next step.”


    “He doesn’t know what he’s ready for,” says Ann, “but I think I do.”


    “Well,” Leslie laughs, “I guess you’re just going to have to marry him and figure
    it out!”


    Ann looks at her sideways. “No … no.”


    “No! Why would you do that? Good for you, Ann,” Leslie mumbles, and leaves her
    best friend confused and a little frustrated. Leslie rushes outside and calls
    Mark to tell him the proposal is off … but he doesn’t answer.


    The telethon timer ticks down to the final three minutes of Leslie’s time slot,
    and she grows more anxious about Mark’s whereabouts. Maybe it’s a good thing Mark
    is late—then Leslie can avoid a disastrous on-air proposal and the embarrassment
    of her friend Ann. Leslie takes the microphone and goes onstage to break the news
    of a canceled surprise.


    “I know we promised a special event coming up,” she begins, but when Mark sneaks
    through the backstage crowd and waves the ring to Leslie, she’s thrown off.


    “Should I come up now?” Mark whispers from behind the camera.


    Leslie shakes her head and whispers, “no,” but Mark doesn’t get the message. He
    comes up and joins her onstage, looking lovingly at Ann, who’s manning one of
    the telethon’s phone lines.


    “No!” Leslie says again, thinking quickly. “What we’re going to do is … we’re
    going to pull our pants down! That’s what we’re going to do—everyone is going
    to pull their pants down for diabetes!”


    Leslie unbuckles her pants, and the camera crew cuts to a “Technical Difficulties”
    screen. When the show returns, it’s time for another local leader, Joan, to start
    her time slot.


    “You just *love* flashing your ass, don’t you?” Joan says with a smirk.


    “When it’s for a good cause, Joan,” Leslie says quietly, rebuckling her pants.


    Leslie’s choice to pants herself is a little more literal than this Upper Hand
    practice suggests. But viewers of *Parks and Recreation* know Leslie’s literal
    exposure is a physical representation of an emotional exposure. To viewers, Leslie
    held her feelings in for the entirety of the episode, but in finally being honest
    and vulnerable, she corrects the course of an interaction. In pantsing herself,
    Leslie halts the flow of Mark proposing, averting on-air embarrassment for both
    Mark and her friend Ann.


    When I say to pants yourself, I’m not suggesting you literally pull your pants
    down—I’m referring to the practice of being vulnerable in front of the person
    or people you’re influencing. Maintaining transparency, vulnerability, and authenticity
    provides the best foundation for genuine engagements with others, and proves you
    are worthy of others’ trust. By being open with how you’re feeling, you can let
    the other person off the hook for being resistant, stressed, or frustrated in
    an interaction. You can avoid losing The Upper Hand by drawing attention away
    from the tension in the interaction and turning it on yourself—you can pants yourself.


    It’s hard to be vulnerable with others, especially during high-stakes conversations.
    Vulnerability is risky because there’s no guarantee you stand to gain anything
    by being transparent. It’s this risk that drives others to clam up or avoid addressing
    the obvious rising frustration or tension in an interaction, particularly in a
    professional setting. People who grow frustrated in a business negotiation often
    keep their emotions to themselves, even when it’s obvious they are upset.


    When you pants yourself, you exert control over your interaction. Leslie, though
    she looked a bit ridiculous, did take back control of the situation. Ideally,
    we don’t need to resort to literally pantsing ourselves to take back control.
    Pantsing yourself can be as simple as saying a few words.


    Take back focus of the situation by expressing a bit of vulnerability. If an event-planning
    meeting begins to escalate, rather than calling out the rising tempers of two
    colleagues, call on your own feelings. You might say: “I apologize, everyone,
    but I’m getting frustrated, and I’d like a 10-minute break to regroup and reset.
    Is everyone okay with that?”


    Had you called attention to your colleagues’ emotional states instead of your
    own, it’d be the equivalent of pantsing *them*. Trying to pants others doesn’t
    usually work. Again, many people are unwilling to be vulnerable, and pantsing
    them can come across as patronizing rather than empathetic, particularly in professional
    contexts.


    Additionally, we often are unaware of the full context of others’ emotional states.
    The two arguing colleagues in your meeting might be upset because of the topics
    you’re all discussing, or it’s possible they had a disagreement earlier in the
    day. Pantsing others often backfires.


    When we pants ourselves, we give the other person an out. In a way, we take the
    fall without taking the blame, while we take back The Upper Hand by suggesting
    a course of action to resolve tension.


    In other, more intense interactions, where you want to end the interaction—perhaps
    someone is so heated as to border on threatening—pantsing yourself allows you
    to exit the interaction with grace. There are some cases where an interaction
    is too far gone to maintain The Upper Hand. In these cases, it’s better to end
    the interaction and try again another day than to keep pushing. To gracefully
    exit, you might say something like: “I don’t feel like I’m being productive anymore
    today. Can we break and pick this up tomorrow morning?”


    This isn’t some magician’s illusion meant to hide what’s really going on from
    the other people in the room—it’s simply a point of focus that you and others
    can use to break from, adjust, or end a high-pressure situation before it’s ruined.


    In the *Parks and Recreation* episode, Leslie follows up with Mark after pantsing
    herself to make sure he’s okay. She catches him just as he’s about to leave the
    television set. He’s confused and frustrated.


    “I’m sorry, Mark,” Leslie says. “I think I was a little tired when I told you
    that you should do that. I don’t think that that’s something Ann wants. Not on
    TV.”


    “So *that’s* why you pulled your pants down,” Mark says, smiling a little and
    relaxing his shoulders.


    “Yeah,” Leslie says. She blinks a few times, exhaustion taking over, then widens
    her eyes. “Wait, what did I do?”


    When you pants yourself, it’s like stopping a train hurtling for disaster. Instead
    of crashing and burning, you take the tension out of the room and let everyone
    off the hook gracefully. You offer an easy out for everyone involved and prevent
    emotions from tampering with your influence attempts. The interaction stops escalating
    and falls back under your control.'
