- raw: '“Oh my god!” the CEO exclaimed, “you’ve been here a month! You never told
    me I was pronouncing your name wrong!”


    Corrine’s initial choice to shelve it came from the desire to save others from
    embarrassment, but she ended up creating *more* embarrassment later. She embarrassed
    herself by refusing to address a problem, and she embarrassed the people she worked
    with by letting them continue to call her by the wrong name. Plus, her CEO was
    both confused and a little frustrated by Corrine’s failure to fix something as
    important as the way people at work identified her.


    While it’s helpful to shelve it for small incongruencies between interaction partners,
    some concessions actually decrease the possibility of building a relationship.
    If the other person reveals they’re against one of your core beliefs, you’re not
    likely to build trust with them. If they take an action that violates your moral
    code, you may feel more comfortable ending the interaction than shelving your
    reaction. We can still leave these situations respectfully, but we must leave
    them, or we risk losing The Upper Hand.


    The Shelve It practice helps you step out of your own way. However, humans are
    biologically, socially, and psychologically designed to stand in our own ways
    when we’re in danger. We must keep this in mind when we choose to shelve it—we’re
    clearing space for cooperation, not hiding valuable responses from ourselves and
    others. We can’t openly and ethically collaborate with others if our shelves are
    cluttered with secret feelings and beliefs. Instead, we can have meaningful interactions
    that result in successful influence by picking and choosing what goes on the shelf.


    [*OceanofPDF.com*](https://oceanofpdf.com)


    ## [Chapter 9](#Contents.xhtml#rch09)


    ## [HOLD, DON’T SQUEEZE](#Contents.xhtml#rch09)


    The handshake is a powerful nonverbal tool. It’s a gesture that transcends most
    cultures, taking precedence over bows, pecks on the cheek, and hugs between two
    people from different countries meeting. By reaching out for a handshake, humans
    signal trust and a willingness to cooperate. Through physical contact, we trigger
    a release of oxytocin, the bonding hormone. A handshake may seem like a simple
    gesture, but it’s a telling one too.


    There is a subtle art to mastering the perfect handshake. For one, you must know
    your audience to know what kind of pressure to apply when shaking a stranger’s
    hand. Different cultures have different handshaking etiquette. Some cultures prefer
    strong, short handshakes, while others make introductions with short, gentle grasps.
    Sometimes, gender plays a role in who initiates the handshake, or who avoids them
    altogether.^([1](#Notes.xhtml#ch09note1a)) Once you have a foundational understanding
    of what others need from your introduction, you can master the best approach for
    influencing them.


    In America, there is a balance struck in a good handshake. Loose, floppy, “dead
    fish” handshakes betray weakness. They make the person behind the hand seem submissive.
    Crushing, jerky handshakes that throw the receiver off balance make the person
    shaking seem too aggressive, domineering, and generally off-putting. Handshakes
    that last too long feel too intimate, while handshakes that are too short feel
    dismissive. To master your first impressions with people, you must first master
    the art of a handshake.


    There are a lot of parallels between The Upper Hand framework and the art of the
    perfect handshake. Both require a balance of pressure, firmness, and flexibility
    to be used effectively. We want a firm hold that portrays confidence, but we don’t
    want to squeeze with force. We want the right amount of pressure for the right
    amount of time. We want to hold, but not squeeze.


    This final Upper Hand practice is for finding the perfect balance of pressure
    during an interaction, one that extends beyond the initial handshake. It’s aptly
    called “Hold, Don’t Squeeze.” Hold, Don’t Squeeze is a practice for guiding interactions
    toward desired outcomes, ensuring you only apply extra pressure at the right time,
    for the right reason. You must build up your sense of timing and develop a keen
    sense for when to hold, when to throw in a bit of pressure, and when to pull away
    altogether.


    Better yet, when you know how to expertly hold without squeezing, you’ll have
    a better sense for when others are trying to squeeze you.


    There was a time, believe it or not, when Amazon was nothing more than an online
    bookstore. The business was hemorrhaging money, and investors were struggling
    to justify giving money to *any* internet company, much less [Amazon.com](http://Amazon.com).
    But founder Jeff Bezos was undeterred.


    In 1999, when hundreds of other internet businesses were collapsing under the
    pressure of the dot-com bust, Bezos went on the *The Tonight Show with Jay Leno*
    to promote [Amazon.com](http://Amazon.com).^([2](#Notes.xhtml#ch09note2a)) Leno
    grilled Bezos about the confusing business strategy.


    “Here’s the thing I don’t understand,” said Leno. “The company is worth billions.”


    “Yes,” said Bezos.


    “And every time I pick up the paper, each year it loses more money than it lost
    the year before.”


    “Yes,” Bezos said again.


    “The company has *never* made a profit,” Leno said.


    “That’s right,” Bezos said, cracking a smile.


    A silence passed between the two while Leno tried to wrap his head around the
    idea. Bezos held the silence, waiting patiently for Leno to catch up. As if to
    demonstrate his confusion, Leno reached down into his desk and pulled out an [Amazon.com](http://Amazon.com)\-branded
    pencil, complete with a globe-shaped pencil topper and some jingly bits. He gestured
    at it as if to say, “Why this?” and the audience roared with laughter.


    “Now, why … how does it—why—how does it … why?” Leno stammered, demonstrating
    a sense of confusion only the best late-night TV hosts can master.


    “Seems like a new math, doesn’t it?” Bezos said.


    This interview highlighted much of the skepticism Bezos and [Amazon.com](http://Amazon.com)
    faced during the late ’90s and early 2000s. The company wouldn’t turn a profit
    until 2001.^([3](#Notes.xhtml#ch09note3a)) Still, critics didn’t bother Bezos.
    Despite Leno’s attempt to pressure him into an explanation, Bezos held his composure.
    He wasn’t deterred. He knew how to run his business successfully, even though
    it would take time for others to see the path in front of him.


    Leno, on the other hand, tried to apply undue pressure to Bezos. He tried to squeeze.
    For most people, probing questions about their business’ plummeting profits would
    likely trigger a full-blown stress response. After all, for most entrepreneurs,
    their business is tied directly to their safety and security. Defending their
    vision on national television would cause sweaty palms and foreheads. They might
    even feel offended or attacked, and take off. The TV host took a risk by squeezing
    Bezos too tight, but Bezos knew how to withstand the pressure.


    Instead of bailing on the interview or even jumping to defend his business, Bezos
    kept his cool. He laughed at Leno’s confusion. He maintained eye contact, open
    body language, and a sense of calm amusement. He even waited for Leno to ask directly
    before he explained why the business wasn’t worth giving up. He didn’t apply pressure
    back on Leno, but instead maintained a calm, open demeanor, which made him look
    sympathetic to the audience.


    Leno lost The Upper Hand when he squeezed Bezos, despite his more advantageous
    role in the interaction. At the time, Leno had the comfort of his own stage seat,
    the support of the audience, and the confidence to undermine his guest. He held
    a more powerful role as the interviewer. He could’ve chosen to establish an on-air
    rapport with Bezos, but instead he positioned himself as an adversary.'
