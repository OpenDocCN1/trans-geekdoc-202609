    \ et al. (2020)。然而，诊断仅基于制造商（Genourob，法国拉瓦尔）建议的三个阈值下，健康膝与病理膝在134 N处测得的松弛度绝对差值：0至1.5\
    \ mm（健康）；1.5至3.0 mm（部分撕裂）；超过3 mm（完全撕裂）。\n\n这种静态方法并非通用，并解释了不同研究中获得的灵敏度和特异度存在较大差异，差异可超过20%（Beauraain,\
