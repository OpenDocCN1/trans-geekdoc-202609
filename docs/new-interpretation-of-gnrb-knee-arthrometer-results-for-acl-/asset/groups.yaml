    \ & Emanuel, 2016）。\n\n## 2. 材料与方法\n\n使用非侵入性方法进行准确的临床检测对于确定最有效的治疗方法至关重要。因此，本文主要关注GNRB®，旨在提高其诊断准确性。尽管如此，由于其高可靠性，关节镜检查在众多研究中被视为“金标准”，因为它允许外科医生直接观察ACL的状况（Crawford\
    \ et al., 2007）。手术报告将在整个研究中作为比较的基础，并为ML模型提供目标。\n\n### 2.1. GNRB®及其结果的局限性\n\nGNRB®基于Lachman测试（Torg\
