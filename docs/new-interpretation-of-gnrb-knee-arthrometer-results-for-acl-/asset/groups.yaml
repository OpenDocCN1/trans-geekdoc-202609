    of one group in its training set will tend to predict the majority class and must
    be corrected. An arbitrary selection of healthy patients reduced them to 515 (36%)
    with 492 complete tears (36%) and 377 partial tears (28%). Partial LCA ruptures
    represent less than 30% because they are less operated than complete ruptures.


    # 2.2.2. Input parameter selection


    Machine learning algorithms require that the input parameters be carefully chosen
    and present on all samples. Parameters allow the models to establish links between
    the training data and the arthroscopy diagnoses that are the reference. Above
    150 N, a modest proportion of patients have laxity measurements. To maintain the
    1384 samples, we could keep GNRB® tests performed only at 67 N, 89 N, and 134
    N. The same problem is observed in Klouche’s study (Klouche et al., 2015) on the
    difficulty of reproduction in the concrete case if the force applied is too great.
    The slope coefficient P2 calculated using the laxity measurements is retained.
    This aligns with Bercovy’s (Bercovy & Weber, 1995) description that laxity alone
    is not a sufficient parameter to describe the biomechanical behavior of the ACL
    Clamping force is accepted as a critical parameter (Algahtani et al., 2018; Bouguennec
    et al., 2015) and can be a new input parameter in the same way as the patient’s
    gender or age. Pearson’s coefficient confirms that the clamping force impacts
    the quality of the measurements with a score above 0.40 (one knee) and 0.22 (laxity
    difference). Gender had similar scores, unlike age (score < 0.10), which was therefore
    ignored as an input parameter. These results are consistent with a recent study
    (Klasan et al., 2020) showing that male investigators had a significantly higher
    mm laxity reading than females. The input parameters are the laxity measurements
    at three translation forces (67 N, 89 N, and 134 N), the P2 coefficient, the clamping
    force, and gender.


    # 2.2.3. Validation of the panel with respect to GNRB recommendation


    Once the complete database has been created, it seems important to check the consistency
    of the data. The GNRB® documentation advises to keep the measurements only if
    the difference in clamping force is less than 20 N. Retain 5% ineligible data
    to add a bias to the models by imposing a greater generalization on them (Fig.
    2). Fig. 2 shows that the data are consistent given the three thresholds analysis
    with a specificity above 95%. However, several samples with partial and total
    tears have a laxity difference of less than 1.5 mm confirming the previous state
    of the art. The accuracy observed with this dataset is 70% with the three threshold
    diagnosis methods and is therefore consistent. The current solution does not seem
    robust to a random selection of measurements, although it is admissible.


    # 2.3. Data mining using machine learning


    The second stage is to establish the Machine Learning algorithms to maximize the
    differentiation between a healthy and an ACL tear.


    # 2.3.1. Most popular techniques


    No type of machine learning algorithm is better than the others. The choice depends
    on the problem, the number of input variables (6), samples (1384), and the issue.
    Our problem is to predict a diagnosis among three classes: healthy (0), partial
    tear (1), or total tear (2). Algorithms like Naive Bayes used for textual prediction
    are not suitable. Regression, Clustering, and neural network techniques (Mahesh,
    2020; Zhou, 2021) have been implemented with the database. The first two methods
    are unsuitable for the problems because there is no linear relationship and different
    scales between the data. In the case of neural networks, interpretability was
    complex, and the limited amount of data made it difficult to ensure reliable and
    robust results. Increasing the amount of various data would allow us to solve
    this problem, but we decided not to study it because of the risk of artificial
    data (Hairy, 2021). All these techniques have therefore been discarded.


    Support Vector Machine (SVM) (Zhou, 2021) techniques reduce the classification
    problem to a hyperplane. Several models were trained (e.g SVC — Support Vector
    Machine or BGD — Batch Gradient Descent), but only SGD was retained due to its
    high sensitivity. The results using the SVC algorithm seems promising because
    the separation is likely to be a straight line parallel to the x-axis around 1.5
    mm. The choice was to select SGD due to its better performance (speed & accuracy)
    and ability to adapt to new data in real-time. It is the first study with AI to
    diagnose ACL tears, and new data can be added regularly, which is a significant
    advantage. The 3D representation (Fig. 2) shows that each patient has at least
    four neighbors with the same result. The K-plus-neighbor algorithm is based on
    this principle and makes a prediction based on the similarities of a reference
    set. In addition to being easy to implement and highly adaptable to complex data,
    Knn is robust to noisy data. It should be accurate, especially considering that
    patients are in batches of 4-5 with the same diagnosis. Ultimately, it aims to
    approach human analysis by comparing measurements with those of other patients
    who have similar results to make a diagnosis. Consequently, this model should
    always be included as a reference due to its qualities and adaptability to the
    problem.


    Decision trees are based on the same principle as GNRB®’s analysis with higher
    conditions and could be worthwhile to exploit. The decision trees were excluded
    due to the requirement for a shallow depth to avoid overfitting. As a result,
    the diagnoses were primarily based on differences in laxity, leading to inferior
    results. A single tree cannot capture the relationships between all the parameters.
    It excludes variables considered less significant than, for example, laxity. An
    alternative approach would be to use a random forest instead of a single tree,
    which provides a robust solution that incorporates all variables.


    # 2.3.2. Ensemble learning


    Ensemble learning techniques are based on the assumption that combining methods
    with different predictions would result in a new, more accurate solution (Learnia,
    2022; Zhou, 2021). However, three conditions had to be fulfilled :


    +   1. no model should have an accuracy of less than 50;

    +   2. the predictions of each model must be sufficiently different;

    +   3. a large amount of data is required;


    The Bagging consists (Learnia, 2022; Zhou, 2021) of training an algorithm on different
    parts of the training set to obtain the most varied predictions possible. Of all
    the labels, the one most present will correspond to the predicted diagnosis. One
    of the most popular algorithms is RandomForest (RF), which should enable effective
    detection of ACL ruptures despite sometimes very close measures. It combines predictions
    from multiple decision trees, which helps reduce the bias and variance inherent
    in a single decision tree. This allows for a robust interpretation of the data,
    even in cases where the relationships are non-linear and the interactions between
    variables are subtle. Thus, this model addresses the issues associated with previous
    decision trees, making it an excellent choice.


    Boosting algorithms (Learnia, 2022; Zhou, 2021) such as GradBoost and AdaBoost
    were excluded due to poor sensitivity–specificity trade-off. The main criterion
    for their exclusion is a high sensitivity to outliers as well as the risk of overfitting.
    Database include measurements that are heterogeneous depending on the clamping
    force and the patient, who may be hypermobile. Although these flaws can be mitigated,
    early implementations were strengthened because a decrease in diagnostic accuracy
    was noticeable.


    The machine learning algorithms of Voting and Stacking have been subject to a
    more in-depth study due to their numerous advantages. The first advantage is that
    combining multiple individual models should result in a final model that is more
    accurate, robust, and generalizable. The second advantage is the ability to model
    more complex phenomena than what an individual model could achieve. Among the
    most accurate models mentioned in the previous section, a wise choice has to be
    made:'
