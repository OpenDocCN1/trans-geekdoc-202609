    ## 4. 讨论


    本研究最重要的发现是，尽管有以往研究结果，但不建议使用三个阈值。确实，我们的诊断建议优于 Beaurin F 和 Beldae J（Beaurain, 2020）。缺乏有利于诊断的数据预选以及数据的显著增加，根据表
    2，证明了这种方法的局限性。该研究证实了以往的观察，特别是关于 1.5 mm 阈值，需要重新评估（Klouche et al., 2015; Mouarbes
    et al., 2018）。机器学习应用与松弛度测量统计相结合，可以实现更精确的方法（+5%）。所创建方法的主要优势是灵敏度和特异度比约为 94%，部分 ACL
    撕裂的检出率超过 55%（表 2）。PPV（阳性预测值）和 NPV（阴性预测值）表明，仅依赖松弛度不足以确保患者的可靠诊断。


    考虑性别、握力或不同牵引力下的松弛度等额外参数，证明了 GNRB® 比 MRI 提供更准确的解决方案（表 3）。一个解释是部分和完全 ACL 撕裂的区分度更好（+10%），断裂检测得到改善（+0.3%）。结果支持
    2011 年（Van Dyck et al., 2011）的一项研究的发现，该研究表明，经验丰富的放射科医生执行的标准协议 1.5-T MRI 可能不足以可靠地诊断前交叉韧带断裂。相反，与更近期的研究比较表明，结果与
    MRI 诊断相似（Zhao et al., 2020）。我们拟议方案的准确率为 92%，而 MRI 为 95%，后者更受青睐。ACL 撕裂（部分和全）的检测显示
    MRI 为 95%，GNRB 为 93%（表 2）。区分两种断裂类型的结果远高于文献中报道的结果（表 1）。这种差异可以归因于更新的数据和可用数据点数量较少，其中只有
    66 例病例有 MRI，而本研究中有 256 例（169/1384 + 88 来自布列斯特）。该研究（Zhao et al., 2020）不得不因为严格的选择标准（如膝部病理病史）而排除患者。此外，有些人无法进行
    MRI，例如孕妇或有妨碍 MRI 的医疗设备的人。这进一步支持提供一种同样准确、更具成本效益且避免辐射暴露的替代诊断方案的价值。


    该研究并不暗示 GNRB® 优于 MRI，因为 MRI 在临床实践中至关重要且无法替代。此外，使用 MRI 报告中的结论存在解释性，可能因放射科医生的经验水平等因素而异，这可能解释了观察到的结果差异。


    最具争议的一点是本研究与现有研究之间的结果差异。在我们的情况中，多个数据集（测试集、MRI 集、验证集）的灵敏度和特异度最多变化 3%，与已发表研究中的 20%
    相比较低（表 1）。数据选择过程不清楚或未说明，这可能解释了准确率的差异。此外，它仅依赖松弛度来建立诊断，牵引力在 134N 到 250N 之间变化（Jenny
    et al., 2013; Klouche et al., 2015; Mouarbes et al., 2018）。超过 134 N 的测量对大多数患者来说证明是不可能的，使得难以以普遍化的方式解释这些测量。松弛度是一个根据
    GNRB® 配置可能大幅变化的参数（Bouguennec et al., 2015）。因此，只能基于我们的数据来证明所提议解决方案的有用性。


    然而，应注意，所有结果都在 1384 个不同测量值上通过交叉验证进行了验证，并在 88 名新患者中得到了确认。由于 GNRB® 测量值的可用性有限，没有其他研究进行过如此深入的分析和比较。例如，49
    名患者（Di Iorio et al., 2014）与 118 名患者（Klouche et al., 2015）之间的比较研究将因巨大的数据差距而无法得出结论。


    基于该设备及相关分析的新诊断方法，从而证明了该解决方案在检测和表征 ACL 撕裂方面的鲁棒性和相关性。唯一可能值得讨论的决定是保留拧紧差值超过 40 N 的值，这比接受两个松弛度测量为有效的限值高出一倍（Théo
    Cojean et al., 2023）。其意图是避免在决策过程中出现占主导地位的参数，但排除它们可能会产生更好的结果。因此，所有研究在受监管的研究框架内共享数据以建立标准化测试基将是有益的。新数据库可以带来更一致的解决方案比较，并能够基于多样化且全面的数据集开发更有效的诊断方法。


    两种具有明显优势的机器学习模型的关联是值得商榷的，尤其是因为三个阈值尚未重新评估。单一模型本可以足以展示 AI 在诊断中的贡献。然而，这种方法允许创建一个新模型，该模型似乎是利用
    GNRB 等动态松弛度测量设备测量的最佳解决方案，收益约为 10%。尽管如此，通过动态确定三个松弛度阈值来修改用于加强诊断决策的阈值，仍有显著改进的可能性。


    可能需要审查超参数的选择，这些超参数在训练和测试期间被自动选择以最大化精度与损失比。尽管这种选择允许快速添加新数据并评估新集，但手动或更统计的方法可能会提高诊断质量。探索
    Scikit-Learn 建议的所有超参数的影响，而不仅仅是最重要的超参数（例如 KNN 的邻居数量），是进一步改进的一个领域。


    训练数据集中，记录的 1384 条数据中不到 30% 的患者有断裂，这可能解释了为什么该模型对这种损伤的准确率约为 62%。因此，有必要获取更多由关节镜检查确诊的这种断裂患者的松弛度测量值。增加数据应该会产生更准确、更强大的模型，以便进行更全面的评估。其他试验的测量值未公布，这是一个局限，因为合作可能有助于改进此解决方案并找到新的解决方案。未来，我们需要找到一种方法，让每个研究都遵循伦理委员会的规则共享其数据。


    一种替代方案是应用过采样来增加样本量，这可能提高准确率。由于担心在数据库中产生偏差且缺乏技术知识，目前排除了人工平衡数据选择。另一个可能的改进是动态确定三个松弛度阈值并修改用作诊断辅助的阈值。


    最后，所有研究都缺乏可以进一步探索的“人性”维度，例如医生对膝关节不稳定的看法。添加其他由医生使用 Jerk、Lachman 或 MRI 结果评估的方法也可能提高准确率。存在各种诊断方法，但它们总是被比较而从未结合。


    ## 5. 结论


    结论：本研究表明，仅包括基于松弛度差异测量的阈值参数，执行了


