  mdcn: "\n## 基于机器学习的ACL损伤诊断支持中GNRB®膝关节动态仪结果的新解读\n\nJean Mouchotte a,*, Matthieu LeBerre\
    \ a, Théo Cojean b, Henri Robert c\n\na 数据与机器人学习实验室（LDR）, ESIEA, 拉瓦尔, 53 000,\
    \ 法国  \nb 里昂大学, 古斯塔夫·埃菲尔大学, 克劳德·贝尔纳里昂1大学, LBMC UMRT 9406, 里昂, F-69622, 法国  \n\
    c 上昂中心医院, 马恩河畔谢托-贡蒂耶, 53 200, 法国\n\n## 文章信息\n\n- ACL撕裂  \n- AI医疗诊断  \n- 关节动态测量\
    \  \n- GNRB®  \n- 机器学习  \n- 诊断准确性  \n- 膝关节前向松弛度  \n\n## 摘要\n\n目的：GNRB是一种关节动态仪，也是一种替代诊断方法，其成本低于MRI，在前十字韧带（ACL）撕裂检测中的准确性高于KT-1000。膝关节动态松弛度测试分析更为复杂，需要一种通用的解释新方案。假设是，使用基于人工智能（AI）的解决方案将使我们能够获得比目前三种松弛度阈值方案更准确、更稳健的非侵入性诊断方法。\n\
    \n方法：AI可以通过利用先进算法并纳入广泛的额外参数来增强该分析的可靠性，从而实现更精确的诊断。现有流程仅依赖设备获得的松弛度差值，忽略了夹持力等有影响因素。通过考虑更广泛的参数集并采用经过良好校准的模型，在不同机器学习（ML）模型和集成学习之间进行了比较研究，以获得最佳折中方案。校正过程将利用当前解决方案的统计分析。\n\
    \n结果：投票法、堆叠法与阈值松弛度方法的关联结果显示，与使用1384次GNRB®测量的当前方案相比，准确率提高了6%，撕裂检测率提高了约13%。预测诊断对模型未知患者的新数据也更具鲁棒性，并通过验证数据库得到证实。\n\
    \n结论：首次将机器学习模型引入使用GNRB设备的ACL撕裂检测中。GNRB与机器学习的结合令人鼓舞，其效果优于目前的静态诊断方法。它可以作为MRI的补充方案进行集成和推荐。\n\
    \n## 1. 引言\n\n前十字韧带（ACL）断裂是一种常见的膝关节损伤，涉及变向和转体等复杂动作。该病理的诊断是一个公共卫生问题，因为患者平均需要咨询三位医生才能获得结果（Micheo\
    \ et al., 2010）。目前，ACL撕裂诊断的可靠性取决于进行临床检查的医疗专业人员的经验，其中包括Lachman测试（Branch et al.,\
    \ 2010; Torg et al., 1976）。然而，在许多情况下，可能需要MRI等进一步检查来确诊。MRI是诊断ACL撕裂最常用的非侵入性检查，尽管部分断裂、扫描技术或膝痛会影响其准确性（Chang\
    \ et al., 2013; Crawford et al., 2007; Ebrahimpour et al., 2014; Phelan et al.,\
    \ 2016）。因此，开发了成本更低、更易于操作且无辐射暴露的解决方案。此外，\n\nMRI无法直接评估膝关节松弛度，主要用于评估相关撕裂。\n\n1980年代，美国人引入了具有动态松弛度的KT1000（Balasch\
    \ et al., 1999）。它测量胫骨相对于股骨的相对前向抽屉运动，利用关节动态仪提供胫骨平移的客观测量。由Roland Jacob开发的Rolimeter（Schuster\
    \ et al., 2004）以及通过Telos（Pässler & März, 1986）进行的应力X线摄影已被引入作为补充诊断方法。然而，许多因素都可能影响结果质量，例如检查者经验、夹持力、定位或腿部旋转。因此，大量文献报告称这些设备存在固有的不准确性和可重复性差，导致结果主观且不可靠（Bouguennec\
    \ et al., 2015; Collette et al., 2012; Jenny et al., 2017; Lefevre et al., 2014）。因此，开发了一种新的关节动态仪，即GNRB®。\n\
    \n| | GNRB® | | | | MRI | | | |\n|---|---|---|---|---|---|---|---|---|\n| | 完全\
    \ | | 部分 | | 完全 | | 部分 | |\n| | Sn | Sp | Sn | Sp | Sn | Sp | Sn | Sp |\n| Robert\
    \ et al. (2009) | 70% | 99% | 80% | 87% | | | | |\n| Klouche et al. (2015) | 92%\
    \ | 96% | 92% | 98% | | | | |\n| Di Iorio et al. (2014) | | | 72% | | 84% | 92%\
    \ | | |\n| Beauraain (2020) | 73% | | 62% | | 76% | | 30% | |\n| Lefevre N | 84%\
    \ | 81% | 87% | 87% | | | | |\n| Beldame J | 62% | 75% | | | | | | |\n| Phelan\
