    训练集中某一组群的数据倾向于预测多数类，因此必须进行纠正。对健康患者进行任意选择后，样本减少至 515 例（36%），其中 492 例为完全撕裂（36%），377
    例为部分撕裂（28%）。部分 ACL 断裂所占比例不到 30%，因为其手术率低于完全断裂。


    ## 2.2.2. 输入参数选择


    机器学习算法要求输入参数经过精心挑选，并且在所有样本中均存在。参数使模型能够建立训练数据与作为参考的关节镜诊断之间的关联。当力大于 150 N 时，只有少数患者有松弛度测量数据。为保持
    1384 个样本，我们可以仅保留在 67 N、89 N 和 134 N 下进行的 GNRB® 测试。同样的问题也在 Klouche 的研究（Klouche
    et al., 2015）中被观察到，即当施加的力过大时，在具体病例中难以重现。使用松弛度测量值计算的斜率系数 P2 被保留。这与 Bercovy（Bercovy
    & Weber, 1995）的描述一致，即单靠松弛度不足以描述 ACL 的生物力学行为。夹紧力被接受为关键参数（Algahtani et al., 2018;
    Bouguennec et al., 2015），并可像患者的性别或年龄一样作为新的输入参数。Pearson 系数证实，夹紧力对测量质量有影响，得分分别高于
    0.40（单膝）和 0.22（松弛度差值）。性别得分相似，而年龄（得分 < 0.10）则因此被忽略为输入参数。这些结果与最近的一项研究（Klasan et
    al., 2020）一致，该研究显示男性研究者测得的 mm 松弛度读数显著高于女性。输入参数包括三种平移力（67 N、89 N 和 134 N）下的松弛度测量值、P2
    系数、夹紧力和性别。


    ## 2.2.3. 相对于 GNRB 建议的面板验证


    创建完整数据库后，检查数据一致性似乎很重要。GNRB® 文档建议仅在夹紧力差小于 20 N 时保留测量值。保留 5% 的不合格数据，通过强加更强的泛化能力来为模型增加偏差（图
    2）。图 2 显示，基于三个阈值分析，数据具有一致性，特异度高于 95%。然而，部分和完全撕裂的若干样本的松弛度差小于 1.5 mm，印证了之前的技术现状。使用该数据集观察到的准确率为
    70%，采用三个阈值诊断方法，因此具有一致性。当前解决方案对测量的随机选择似乎不够鲁棒，尽管其是可接受的。


    ## 2.3. 使用机器学习进行数据挖掘


    第二阶段是建立机器学习算法，以最大限度地提高健康膝盖与 ACL 撕裂之间的区分度。


    ### 2.3.1. 最常用技术


    没有哪种机器学习算法比其他算法更好。选择取决于问题、输入变量数量（6）、样本数（1384）以及具体问题。我们的问题是预测三个类别中的诊断：健康（0）、部分撕裂（1）或完全撕裂（2）。像用于文本预测的朴素贝叶斯等算法不适用。回归、聚类和神经网络技术（Mahesh,
    2020; Zhou, 2021）已在该数据库上实现。前两种方法不适用于此问题，因为数据之间不存在线性关系且量级不同。对于神经网络，可解释性较复杂，且数据量有限使得难以确保结果可靠且稳健。增加各种数据的量可能解决这个问题，但由于人工数据的风险（Hairy,
    2021），我们决定不进行研究。因此，所有这些技术都被舍弃了。


