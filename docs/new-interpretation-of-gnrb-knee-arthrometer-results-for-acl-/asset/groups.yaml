    Increasing the data should result in a more accurate and robust model for a more
    comprehensive evaluation. The measurements from the other trials are not published,
    which is a limitation because collaboration could help improve this solution and
    find new ones. In the future, we need to find a way for each study to share its
    data following the rules of the ethics committees.


    An alternative is to apply oversampling to increase the sample size could improve
