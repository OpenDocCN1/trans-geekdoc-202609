    # 4. Discussion


    The most important finding of this study is that using three thresholds is not
    recommended despite previous study results. Indeed, our diagnostic proposal is
    better than that of Beaurin F and Beldae J (Beaurain, 2020) . The absence of pre-selection
    of data in favor of a diagnosis and the significant increase in data demonstrate
    the limitations of this approach according to the Table 2. The study confirms
    previous observations, particularly regarding the threshold of 1.5 mm, which requires
    reevaluation (Klouche et al., 2015; Mouarbes et al., 2018). Machine Learning applications
    combined with laxity measurement statistics allow for a much more precise approach
    (+5%). The main strength of the created method is the sensitivity and specificity
    ratio of around 94%, with a detection rate of partial ACL tears beyond 55% (Table
    2). The PPV (positive predictive value) and NPV (negative predictive value) demonstrate
    that relying solely on laxity is insufficient to ensure a reliable diagnosis in
    a patient.


    Considering additional parameters like sex, grip strength, or laxity at different
    translating force demonstrated that GNRB® offers a more accurate solution than
    MRI (Table 3). An explanation is the better differentiation between partial and
    complete ACL tears (+10%) and improved detection of ruptures (+0.3%). Results
    support the findings of a 2011 (Van Dyck et al., 2011) study that showed that
    a standard protocol 1.5-T MRI performed by experienced radiologists might not
    be sufficiently reliable for diagnosing anterior cruciate ligament rupture. Instead
    of, comparison with a more recent study demonstrates that the results are similar
    to MRI diagnoses (Zhao et al., 2020). The accuracy is 92% for our proposed solution
    compared to 95% for MRI, favoring the latter. Detection of ALC tears (partial
    and total) shows 95% for MRI and 93% for GNRB (Table 2). The results for distinguishing
    between the two types of ruptures are very high compared to those reported in
    the literature (Table 1). This difference can be attributed to more recent data
    and the smaller number of data points available, with only 66 cases having an
    MRI compared to 256 (169/1384 + 88 from Brest) in this study. The study (Zhao
    et al., 2020) had to exclude patients due to strict selection criteria, such as
    a history of knee pathologies. Also, some people cannot do IRM as pregnant women
    or individuals with medical devices that prevent MRI. Further supports the value
    of offering an alternative diagnostic solution that is equally accurate, more
    cost-effective, and avoids radiation exposure.


    The study does not suggest that GNRB® is superior to MRI because it is essential
    in clinical practice and cannot be replaced. Furthermore, the use of conclusions
    from MRI reports is subject to interpretation. They may vary depending on factors
    such as the level of experience of the radiologist, which could explain the observed
    differences in results.


    The most controversial point is the difference in results between this study and
    existing studies. In our case, sensitivity and specificity with multiple datasets
    (test base, MRI base, validation base) vary by a maximum of 3%, which is low compared
    with 20% in published studies (Table 1). The data selection process is unclear
    or not explained, which may explain the discrepancies in accuracy. Furthermore,
    it relies solely on laxity to establish a diagnosis with varying translation forces
    between 134N and 250N (Jenny et al., 2013; Klouche et al., 2015; Mouarbes et al.,
    2018). Measurements above 134 N proved impossible


    for most patients, making it difficult to interpret these measurements in a generalized
    way. Laxity is a parameter that can vary greatly depending on the configuration
    of the GNRB® (Bouguennec et al., 2015). Therefore, it is only possible to demonstrate
    the usefulness of the proposed solution based on our data.


    However, it should be noted that all results were verified on 1384 different measurements
    with cross-validation and confirmed on 88 new patients. No other study has conducted
    such in-depth analyses and comparisons due to the limited availability of GNRB®
    measurements. For example, a comparative study between 49 (Di Iorio et al., 2014)
    and 118 (Klouche et al., 2015) patients will be inconclusive due to a large data
    gap.


    The new diagnostic method based on this device and related analyses thus demonstrates
    the robustness and relevance of the solution for detecting and characterizing
    an ACL tear. Only the decision to retain values with tightening differences of
    more than 40 N, which is twice the limit value for accepting two laxity measurements
    as valid (Théo Cojean et al., 2023), may be open to discussion. The intention
    was to avoid having dominant parameters in the decision-making process, but their
    exclusion could potentially yield better results. Hence, it would be beneficial
    for all studies to share their data within a regulated research framework to establish
    a standardized test base. New DB could lead to a more coherent comparison of solutions
    and enable the development of a more effective diagnostic method with a diverse
    and comprehensive data set.


    The association of two machine learning models with clear advantages is debatable,
    especially as the three thresholds have not been re-evaluated. A single model
    could have been sufficient to demonstrate the contribution of AI in diagnostics.
    However, this approach allows the creation of a new model that appears to be the
    best solution for leveraging dynamic laximetry device measurements such as GNRB,
    with gains of around 10%. Nevertheless, a significant improvement is possible
    by dynamically determining the three laxity thresholds to modify those used to
    reinforce diagnostic decisions.


    It may be necessary to review the choice of hyperparameters, which are automatically
    selected to maximize the precision-to-loss ratio during training and testing.
    Although this choice allows for the quick addition of new data and evaluation
    of new sets, a manual or more statistical approach may increase the quality of
    diagnostics. Exploring the impact of all the hyperparameters suggested by Scikit-Learn
    and not just the most important ones (e.g. neighbor number for a Knn) is an area
    for further improvement.


    The training dataset contains less than 30% of patients with rupture among the
