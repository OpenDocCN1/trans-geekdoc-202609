    the training base to compare their diagnoses with MRI diagnoses. The reference
    remains the arthroscopy result. The comparison shows that the proposed solution
    detects ruptures better than MRI (sensitivity) by more than 1% (Table 3). The
    difference is insignificant since some of the MRI results are from the 2010s.
    Furthermore, MRI provides a better diagnosis if the rupture is total. On the other
    hand, GNRB® with Machine Learning remains more efficient in differentiating a
    partial tear from a complete tear (Table 3). Significant gain proves that this
    device is interesting to use before, after, or without MRI because it is less
    expensive and simpler to implement. Only the threshold method, which reaches barely
    70% detection, is inferior and should not be recommended.


    # 3.3. Validation of the robustness


    The Brest Hospital could evaluate the proposed model using 88 GNRB® measurements
    from former patients following the device''s usage recommendations. This is the
    first study that utilizes a second dataset established from a different source
    to validate the quality and robustness of its solution. The practitioners and
    the device used in this study are entirely independent from the training dataset,
    which consists of 1384 measurements.


    The thresholds allow for a rupture in 87.80% compared to 92.68% with our solution.
    The difference in sensitivity with the results in Table 2 is 3%, compared to over
    20% with the three thresholds (Table 1). Results demonstrate the robustness and
    quality of the proposed AI-based solution even in the face of new data. Finally,
    the MRI results showed that the rupture was not qualified for 2 of the 88 patients
    in this ultimate study. The same observation is made with our solution but with
    two different patients and allows us to conclude that the two solutions are at
    least equivalent to ACL tears detection.'
