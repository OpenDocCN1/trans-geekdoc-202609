    # ## 2.4.3. New diagnostic process with diagram explanation


    By incorporating all the suggested improvements from the previous subsections,
    it is possible to achieve a new diagnostic process. This process combines statistical
    analysis to reinforce the decisions of the selected ensemble Machine Learning
    models: Voting (2Knn + RForest) and Stacking (Knn + SGD + RForest). The aim is
    to offer a better trade-off between sensitivity and specificity while improving
    the qualification of a rupture as either partial or complete. Fig. 3 represents
    the new diagnostic suggested as a process diagram.


    # ## 2.5. Statistical analysis


    Firstly, the left part aims to improve the qualification of ruptures defined as
    partial or complete. Once ACL tear is diagnosed by the Voting method, a first
    condition (Δ < 3.0 mm) aims to align with the analyses conducted in Section 2.4.2:


    Statistical analyses were performed using XLSTAT (Addinsoft, Paris, France), a
    software suite for data analysis and statistics in Microsoft Excel (Microsoft
    Corporation, Redmond, Washington, US). Confusion matrices were used to compare
    the ML models and assess the significance of differences, using sensitivity, specificity,
    positive predictive value, and negative predictive value as indicators of proportions.
    Significance was set at p < 0.05 for all analyses.


    +   - When exceeding 3 mm and the second condition (stack_label=2) fulfilled,
    it will be possible to classify the rupture as complete, regardless of the label
    predicted by the first model (Voting). Otherwise, the probability table is added
    to the one provided by the voting decision. The aim is to reinforce the idea that
    a patient has a complete rupture without forcing it.


    Simultaneously, the Matplotlib visualization library plot ROC curves for five
    different approaches evaluated on the same portion of the dataset (training and
    testing). It provides an overall measure of the performance of a machine-learning
    model and facilitates the comparison of different approaches.


    All hyperparameters were automatically selected to achieve the best trade-off
    between accuracy and loss during model training. Choices were checked manually
    to ensure consistency, such as the optimal number of neighbors K, which was 6,
    consistent with an interpretation of Fig. 2.'
