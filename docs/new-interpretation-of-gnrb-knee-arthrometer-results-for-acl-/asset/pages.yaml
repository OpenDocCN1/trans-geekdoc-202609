    # ## 3. Results


    All methods compare the same data using successive cross-validation with the same
    parameters: sex, relative difference of laxity (67 N, 89 N, 134 N) and P2 coefficient.
    The objective is to ensure that the predicted diagnoses are not arbitrary or too
    specific to the training data. They use the relative difference in laxity measurement
    because it increases the accuracy by 4% and the distinction between my two types
    of ACLs tears by 2%.


    # ### 3.1. AI method comparisons


    The accuracy of decision trees was about 5% lower than that of SGDs, leading to
    their exclusion. SGD was the second-best method, with a sensitivity close to 90%,
    excluding ensemble learning algorithms (Table 2). By standard normalization to
    maximize accuracy, the KNN algorithm achieved a detection rate (specificity) of
    over 85% and sensitivity above 90%.


    Based on the experiment results presented in Table 2, the GNRB® solution recommended
    for diagnosis has an accuracy equivalent to 70% as three other methods. However,
    artificial intelligence


    algorithms outperformed the three-threshold solution, achieving a diagnosed rupture
    rate of 81% and an accuracy of 69.50%. Although the Random Forest algorithm did
    not perform as well as KNN, it could improve specificity. This explains why the
    Vote method, which combines multiple algorithms, can correctly distinguish a healthy
    ACL from a ruptured ACL with rates higher than 91% (sensitivity + specificity)
    and appears to be the most efficient solution at this stage.


    The ROC curves demonstrate (Fig. 4) that the solution using the three thresholds
    is significantly less effective than the AI solutions, as it consistently falls
    below the other models. The curves for the Voting model consistently outperform
    the others, indicating that this model has better classification performance across
    all decision thresholds. However, Table 2 shows that the Stacking model has an
    area of 0.87 compared to 0.84 for complete injuries, confirming its usefulness
    in qualifying this type of rupture. The standalone KNN model performs worse than
    the Voting and Stacking models, further reinforcing the choice of model combination
    to achieve even higher precision.


    # ### 3.2. Evaluation of the proposed new AI-based method


    The new ML model provided results that were at least slightly inferior or superior
    to the thresholds method with no significant differences'
