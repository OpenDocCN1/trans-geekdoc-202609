    When comparing the areas under the curves (Fig. 4), the proposed solution consistently
    outperforms the others, although the difference remains small compared to the
    Voting model, which is the second most accurate method. The new model is the only
    one to achieve an area of 0.90 for detecting complete rupture and almost 1.0 for
