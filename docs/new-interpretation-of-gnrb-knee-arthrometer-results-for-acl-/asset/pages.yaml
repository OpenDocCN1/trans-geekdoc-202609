  md: '# New interpretation of GNRB® knee arthrometer results for ACL injury diagnosis
    support using machine learning


    Jean Mouchotte a,*, Matthieu LeBerre a, Théo Cojean b, Henri Robert c


    a Learn Data & Robotics Laboratory (LDR), ESIEA, LAVAL, 53 000, France

    b Univ Lyon, Univ Gustave Eiffel, Univ Claude Bernard Lyon 1, LBMC UMRT 9406,
    Lyon, F-69622, France

    c Centre Hospitalier du Haut Anjou, Château-Gontier-Sur-Mayenne, 53 200, France


    # ARTICLE INFO


    +   - ACL tears

    +   - AI medical diagnosis

    +   - Arthrometry

    +   - GNRB®

    +   - Machine learning

    +   - Diagnostic accuracy

    +   - Knee anterior laxity


    # ABSTRACT


    Purpose: GNRB is an arthrometer and alternative diagnostic method less expensive
    than MRI and more accurate than KT-1000 in Anterior Cruciate Ligament (ACL) tears
    detection. Dynamic knee laxity tests are more complex to analyze and will require
    a new solution of universal interpretation. The hypothesis is that using a solution
    based on Artificial Intelligence (AI) will allow us to obtain a more accurate
    and robust non-invasive diagnostic method than the current solution with three
    laxity thresholds.


    Method: AI can enhance the reliability of this analysis by utilizing advanced
    algorithms and incorporating a wide range of additional parameters, leading to
    more precise diagnostics. The existing process solely rely on laxity differences
    obtained from the device, overlooking influential factors like clamping force.
    By considering a broader set of parameters and employing well-calibrated models
    a comparative study was performed between different Machine Learning (ML) models
    and Ensemble Learning to get the best compromise. The correction process will
    leverage statistical analysis of the current solutions.


    Results: Association of Voting, Stacking and threshold laxity methods results
    report a 6% increase in accuracy and approximately 13% improvement in tear detection
    compared to the current solution with 1384 GNRB® measurements. Predicted diagnoses
    are also more prone to new data from patients unknown to the model and confirmed
    using a validation database.


    Conclusion: A first ML model was introduced in ACL tears detection using GNRB
    device. GNRB coupled with ML was encouraging with better results than the current
    static diagnostic method. It could be integrated and recommended as a complementarity
    solution to MRI.


    # 1. Introduction


    Anterior cruciate ligament (ACL) rupture is a common knee injury that involves
    complex movements such as cutting and pivoting. The diagnosis of this pathology
    is a public health issue because a patient must consult an average of three doctors
    to obtain a result (Micheo et al., 2010). The reliability of ACL tear diagnosis
    is currently dependent on the experience of the healthcare professional conducting
    the clinical examination, which includes Lachman test (Branch et al., 2010; Torg
    et al., 1976). However, in many cases, further examinations such as MRI may be
    required to confirm the diagnosis. MRI is the most commonly used non-invasive
    examination for diagnosing ACL tears, although partial rupture, scanning technique,
    or knee pain impacts its accuracy (Chang et al., 2013; Crawford et al., 2007;
    Ebrahimpour et al., 2014; Phelan et al., 2016). Less expensive and easier solutions
    without radiation exposure have therefore been developed. Moreover,


    it cannot directly assess knee laxity and is mainly used to assess the associated
    tears.


    In the 1980s, Americans introduced the KT1000 with dynamic laxity (Balasch et
    al., 1999). It measures the relative anterior tibial drawer movement to the femur,
    providing an objective measurement of tibial translation using an arthrometer.
    The Rolimeter (Schuster et al., 2004), developed by Roland Jacob, and stress radiography
    via Telos (Pässler & März, 1986) have been introduced as complementary diagnostic
    methods. However, many factors can affect the quality of the results, such as
    examiner experience, clamping force, positioning, or leg rotation. As a result,
    a large body of literature reports the inherent inaccuracy and poor reproducibility
    of these devices, resulting in subjective and unreliable results (Bouguennec et
    al., 2015; Collette et al., 2012; Jenny et al., 2017; Lefevre et al., 2014). Therefore,
    a new arthrometer, the GNRB®, has been developed.'
