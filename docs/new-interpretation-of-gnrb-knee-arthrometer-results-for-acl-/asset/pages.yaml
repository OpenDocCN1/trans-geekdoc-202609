    # 2.4. New diagnosis process


    The study could have stopped at the evaluation of the last two models, Voting
    and Stacking, as it already represents an innovation in the absence of studies
    for diagnosing an ACL rupture. The hypothesis was made that it was possible to
    find new interpretations of the data and machine learning models to achieve even
    more accurate diagnoses. This section aims to innovate by combining the current
    static methods with an AI model, for example. The hypothesis is that using the
    most accurate model (Voting) and reinforcing its decisions with a precise rupture
    detection model (Stacking) and another model for healthy patients (Three thresholds)
    would be relevant (Table 2). Additionally, new interpretations of the data can
    be made.


    # 2.4.1. Input parameters and interpretation


    The first modification was to increase the impact of the laxity measurement to
    134 N based on Klouche''s assumption that a higher translation force will result
    in higher accuracy. The experiments showed that there was no gain but a decrease
    in accuracy. The fact of not observing a gain remains coherent because it allows
    a greater diversity of measurements and a generalization of the model thanks to
    a dynamic analysis of the data.


    A second assumption is that a healthy patient would obtain a measurement close
    to zero against negative values in an ACL tear. Changing the interpretation of
    laxity could increases accuracy and improves the


