    Fig. 1. The results of the statistical analysis demonstrate the probability that
    a diagnosis based on the proposed 3 mm threshold is correct. This threshold is
    recommended by the GNRB device manufacturers.


    discrimination between healthy. Consequently, the newly implemented discrimination
    method will use the relative difference. This is a first key differentiating factor
    in implementing a new method in addition to AI and should increase sensitivity
    with limited impact on specificity to achieve a rate beyond 90%.


    # 2.4.2. Increasing sensitivity and ACL tears distinctions


    This part proposes a solution that no longer involves comparing but rather associating
    three diagnostic methods (Voting, Stacking, Thresholds) in order to leverage the
    advantages of each method. Indeed, this approach involves creating a meta-model,
    similar to ensemble learning methods like voting, by combining multiple diagnostic
    methods together.


    First change is to support or modify voting decisions based on statistical analysis.
    The study analyzes the distribution of measurements according to the diagnoses
    to demonstrate the proportion in which a diagnosis is correct based on the thresholds
    suggested by the GNRB device manufacturer (Fig. 1). It allows for influencing
    the predicted result by the voting method using the thresholds in two well-defined
    cases:


    +   - beyond this threshold, there are less than 1% of patients without tears.
    A complete tear will then replace the AI prediction in the case of a healthy patient;

    +   - there are 30% of partials and 70% of complete tears beyond 3 mm. If the
    result is a tear (partial or total or Δ > 3.0 mm), a probability table ([0; 0.30;
    0.70]) will be added to the predictions to accentuate the diagnosis in favor of
    a total rupture;


    Beyond the change in the interpretation of values, which is a new approach, reinforcing
    the diagnosis through statistical analysis is a significant addition. This modification
    affects the probability of a diagnosis being true after a prediction by the trained
    models. This addition is a deliberate choice to improve the distinction between
    partial and complete ruptures. The final modification involves reusing part of
    this'
