    # ## 10.4 Model Performance


    How much the regression line fits the data set is determined by the goodness of
    fit. Optimization is the process of selecting the best model from a group of competing
    models.


    # ## 10.4.1 R-Squared Method


    A statistical technique that assesses the goodness of fit is R-squared.


    On a scale of 0-100 percent, it evaluates the strength of the correlation between
    the dependent and independent variables.


    A good model is one in which the R-square value is high since it indicates that
    there is little variation between the predicted and actual values.


    It is called coefficient of determination or a coefficient of multiple determination
    for a multiple regression task.


    # ## 10.4.2 Mean Squared Error (MSE)


    The mean squared error tells us how much a regression line fits a set of data
    points. It is a function that gives the relationship with the anticipated value
    of the squared error loss. The term “mean square error” refers to the'
