- pgno: 82
  md: '# Synthesis and Time Analysis of FPGA-Based DIT-FFT Module for Efficient VLSI
    Signal Processing Applications


    Siba Kumar Panda1*, Konasagar Achyut2 and Dhruba Charan Panda3


    1Xeedo Technologies Pvt Ltd, Bangalore, India


    2J.B. Institute of Engineering & Technology, Hyderabad, India


    3Department of Electronics Science, Berhampur University, Odisha, India


    # Abstract


    Now is the era of high-speed processors with reconfigurable architectures. The
    dedicated architectures have a wide variety of applications in signal processing,
    image processing, and audio/video processing provinces. Further implementation
    of those dedicated architectures in FPGA/ASIC level plays an important role. Synthesis
    and static timing analysis of FPGA-based Decimation in Time Fast Fourier Transform
    (DIT-FFT) architecture for VLSI signal processing application is presented in
    this chapter. This work presents a continuous flow such as RTL design, simulation,
    synthesis, and implementations as well as timing investigation of the designed
    module. The architecture is designed and verified for different values of N and
    converted to corresponding gate level netlist using synthesis. Post-synthesis,
    utilization and power report are recorded. The post-implementation and timing
    confirm that the design for N=8 consumes 780 LUTs (logic), 257 registers (BRAMs),
    0.163Won-chip power, set up slack 3.258ns, hold slack 0.430ns with timing cohesively
    meeting at 24ns. Post-timing analysis, physical layout of the designed circuit
    with proper routing is also obtained. The implementations were carried out using
    vivado IDE tool with Artix7 FPGA board in 28nm technology.


    Keywords: Critical path delay, DIT-FFT, data path delay (DPD), FPGA, LUT, static
    timing analysis (STA), slack


    *Corresponding author: panda.sibakumar08vssut@gmail.com'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 5.1 Introduction


    In wireless network systems, ICs have to process signal to extract the original
    information. This processing takes place after the data pass through several analog
    components such as ADCs, Op amps, etc. To make them work accordingly a solemn
    course of action is brought up right from RTL till the GDSII [1]. Likewise in
    billion transistor one such bunch of digital signal processing core uses a dedicated
    section in which to process complex signal [2–21]. Many algorithms have been implemented
    to process the composite data associated with complex signals. The FFT is an integral
    part of DSP. This algorithm allows the processor to convert the integration from
    one domain to other. Many works have been done to reduce the complexity of this
    algorithm, such as Prime Factor FFT algorithm, Bruun''s FFT algorithm, Rader''s
    FFT algorithm, Bluestein''s FFT algorithm, Cooley-Tukey FFT algorithm and Hexagonal
    FFT algorithm. In this paper, we have considered Cooley-Tukey algorithm, also
    known as Decimation in Time – Fast Fourier Transform (DIT-FFT). To improve its
    performance for VLSI implementation, Rauf et al. in [4], have proposed a design
    based on split radix with user-defined input resolution. Also, Radix 4 butterfly
    structured DIT FFT algorithm, using floating point calculations as in [7] by Prabhu
    et al. In [8], Nuenfeld et al. have come up with improvised radix 2 and radix
    4 butterfly architectures concentrating on low power consumption. Paul et al.
    have proposed floating point FFT algorithm considering energy efficient butterfly
    units in [11]. Ma et al. in [12] have implemented pipelined architecture for radix
    2 FFT algorithm on FPGA. A use of ganged butterfly engine enabled the design to
    compute in 11µs at 200MHz frequency. XOR gate topology with adder compressors
    in the butterfly structures of radix 2 DIT FFT has shown to use 5.69mW of power
    in an optimized single pipelined structure. Design of FFT architecture given by
    Cooley-Tukey is used for SOC telecom-based applications as classified by Saponara
    et al. in [14]. They used the architecture for OFDM and MIMO schemes at 12.375MHz.
    In [15], Huang et al. have used the concept of offset binary coding (OBC) mechanism
    along with sliding block distributed arithmetic (SDBA). This considerably reduced
    the usage of available LUT slices, RAMs, etc., in FPGA. Table 5.1 summarizes the
    state-of-art on VLSI implementation of DIT-FFT module. However, the synthesis
    and timing analysis of the DIT-FFT module is rarely reported in open literature
    [16]. This work makes an attempt to provide a step-by-step process to achieve
    this. This is necessary for digital signal processor and cryptographic applications.'
