    # 5.4 Static Timing Analysis of Designed Circuit


    We performed the STA for our design, helping us to perform timing checks such
    as setup and hold timing checks for the entire design in four possible paths:
    All registers pins to all registers, all input pins to all registers, all registers
    to all output pins and all input pins to all output pins. The proposed approach
    for STA could be observed from Figure 5.8. This helped the design to meet the
    specific operable clock frequency so that the original data isn’t lost at any
    micro architectural block of a design. Setup timing check allows the data to arrive
    at a flip flop/register before a clock signal can arrive, and hold timing check
    ensures that the data is stable until the clock signal has gone low. After getting
    timing summary, the frequency at which the design has met the setup slack as well
    as hold slack for four paths mentioned above, are included in Table 5.3. Based
    on the specified clock period/clock frequency the power consumed and area utilization
    has also been brought into the consideration. As we are performing STA after RTL
    generated netlist, we do not have any crosstalk or clock tree paths for'
