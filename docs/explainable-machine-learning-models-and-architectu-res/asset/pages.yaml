    # ## 5.5 Result and Discussion


    The values related to timing are the parameters obtained by the design for several
    input sampling sizes (N = 2, 4, & 8). After synthesis of the design, the utilization
    parameters for FPGA are shown in Table 4.3. From the available 134600 LUTs, 365
    BRAM tiles, and 740 DSP blocks, 0.7% of LUT, 75% of BRAM tiles and 2.97% of DSP
    has been utilized for N = 8 sample inputs. Similarly, for N = 4, 0.18% of LUTs,
    25% of BRAM tiles, and 1.49% of DSP blocks have been utilized; for N = 2, 0.05%
    of LUTs, 10% of BRAM tiles, and 0.41% of DSP blocks have been utilized. Post timing
    fixation values in Table 4.4 confirm that the proposed DIT-FFT architecture designed
    with offset binary representation for complex twiddle factors justifies the synthesis
    and the time period required for four different paths subsequently divided to
    meet the overall design. With this, we can ensure that the design is error free
    with respect to pin to pin time stipulation.


    # ## 5.6 Conclusion


    Timing analysis is an important pathway towards signing off any chip because engineers
    must be aware how fast the chip/task is going to run, how fast the data is reaching
    the output from input ports of design. This work shows a practice towards the
    synthesis and timing analysis of DIT-FFT'
