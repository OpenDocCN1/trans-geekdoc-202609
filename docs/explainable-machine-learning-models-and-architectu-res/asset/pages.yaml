    # ## 2.2.2 SIFT (2004)


    In SIFT algorithm (Scale-invariant feature transform) image processing and recognition
    we try to reduce the image to a set of locally distinct points together with the
    information of said points. We then look for those points in other images and
    if the data matches, we can say that the image is similar, even if it is from
    a different viewpoint [4]. The initial goal of the SIFT method is to compare two
    images (or two image parts) that can be deduced from each other (or from a common
    image) by a rotation, a translation, and a scale change. The method turns out
    to be robust also to rather large changes in viewpoint angle, which explains its
    success [13].


    We take a patch around the key point into account and use intensity values or
    the changes in intensity values, i.e., the image gradience in this area is used
    to describe it and turn it into a Descriptor Vector.


    Now if we have multiple images where we detect the same key points, we can conclude
    that these are the same images; here, being the same does not necessarily mean
    being the same as they can be from different angles and with different lighting
    conditions.


    The two images need not be the same, but they are of the same location from varying
    angles, and by matching the key points in the images we can conclude that they
    are of the same place [4, 14].


    # ## Computation of the SIFT Key Points


    The locally distinct points or key points are found using the Difference of Gaussians
    Approach, which means the taken image is blurred using Gaussian Blur at different
    magnitudes. Then all the images are subtracted from each other and then we stack
    the difference images on top of each other. Then we look for extreme points, so
    points where the neighbours in the X-Y image space are as well as in the space
    of different levels of smoothing which are locally distinct and which stand out;
    they are the key points. This is done not only for one image resolution; it is
    also performed on an image pyramid which means images which are differently scaled
    in size to find key points that also are distinct concerning scale changes, i.e.,
    if you''re closer to an object you''ll find the same key point if you''re further
    away [3].'
