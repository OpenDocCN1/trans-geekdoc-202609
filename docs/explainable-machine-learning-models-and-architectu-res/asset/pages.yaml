  md: '# 12.8 Challenges in IoT-Based Smart City Projects


    Broadly, the challenges can be divided into two sections: *Technological* (with
    respect to security of the systems and privacy) and *Financial-Economic* (with
    respect to Investment and IoT-based business models).


    # 12.8.1 Technological Challenges


    # 12.8.1.1 Privacy and Security


    In a world where data is constantly increasing, security and privacy are major
    concerns in every development. Since IoT involves having essential city infrastructure
    on the internet, in smart cities, security, along with privacy, is a major concern.
    Any hiccup in the city’s services can irritate its residents and put human lives
    and property in jeopardy. In the modern world of the digital revolution, cybercrime
    is the new tactic in world politics. This somehow makes smart cities vulnerable
    to malicious attacks. So, data encryption is a must for the transmission and reception
    process in the IoT network. There could be instances of people’s data being used
    in unwanted ways especially when there is the proliferation of sensor technologies.
    The participation and cooperation of citizens are crucial in this regard, and
    solutions will necessitate processes that collect data as per the measured task
    while ensuring private information confidentially [21].


    # 12.8.1.2 Smart Sensors and Infrastructure Essentials


    Smart sensors are the most essential part of the IoT network. These devices are
    manufactured by a host of vendors, differentiated by sensing abilities, sensing
    mechanisms, connectivity protocols, data formats, and measurement standards. Any
    smart city project will be a success if these smart sensors exchange data, allow
    and perform scheduling of tasks, and aggregate data for final decision-making.
    The use of open protocols and data formats is one of the solutions to enable communication
    between all these devices. The use of “standard” access point nodes for IoT systems
    is another solution (not readily available, however), whereby devices can communicate
    using several different communication protocols. Some manufacturers have made
    their products compatible with specific network protocols [22].'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 12.8.1.3 Networking in IoT Systems


    The concept of the network layer is to put the sensed data into action. The quality
    of service and output in IoT largely depends on the capability of sensing, the
    transmission and reception abilities of other devices, and the cloud. A huge challenge
    for us now is to provide networking to these devices to enable constant communication
    between them. Current networking technologies and routing protocols are inadequate
    for providing networking services to smart city components. Providing efficient
    and dynamic routing protocols that can suit IoT requirements and function with
    both stationary and mobile devices is one answer to this problem (having mobility
    and throughput requirements that need to be met for acceptable quality of service)
    [23–27].


    # 12.8.1.4 Big Data Analytics


    IoT-connected devices generate massive volumes of data, which is predicted to
    continue to grow year after year. To make use of this data and continuously improve
    the services provided in smart cities, the most up-to-date and powerful big data
    analytics techniques are required. The development of scalable algorithms (so
    that they may be utilized across a wide range of applications) should take into
    account the fact that they can work with both structured and unstructured data.
    New data fusion techniques must also be developed to combine them in meaningful
    ways and extract inferences and patterns. Deep learning is one of the disciplines
    that has piqued academics’ interest since it can make use of enormous volumes
    of data to get better results for many applications [25].


    # 12.8.2 Financial - Economic Challenges


    As highlighted earlier in this chapter, the attempt to estimate or model IoT’s
    economic value is still at a nascent stage. In addition to that, the economic
    and financial viability of business models of organizations involved in IoT is
    evolving and naturally so. Some organizations follow data-driven business models
    (such as Fitbit Wearables) which while providing helpful data for users, monetize
    on the same data for the wellness industry, etc. Some others apply the outcome-based
    business model. This is seen in the bike and bicycle rentals business which enables
    geotagging of the vehicles. As a consequence, there is no single successful business
    model at work; rather a combination of approaches needs to be figured out before
    a firm'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'invests in IoT. On the other hand, the economic viability of using such a technology
    is subject to the needs of the clients [26–32].


    Therefore for firms that are transitioning into the IoT business, the cost of
    switching will be naturally high due to the size of the investments that are to
    be made. This implies that the business model the firm decides to opt for makes
    a lot of difference in its profit function. Given the flexibility involved in
    the application of IoT, sector-specific, tailor-made IoT solutions are relatively
    easier to finance and later, sell, rather than a broad umbrella of IoT services.
    Small is indeed beautiful in the case of IoT business, to borrow the title of
    E. F. Schumacher’s popular book. The other challenge that arises is connecting
    with the stakeholders involved. The money that is put into developing and further
    selling IoT products can take time to return (return on investment) but is high.
    This calls for patience from the business side. Therefore scalability of products
    must be factored into the business. For firms involved in the purchase of IoT
    products, while the cost is no doubt high, the priority should be to look at the
    long-term prospects of higher revenues due to smarter management of operations
    [32–35].


    To conclude, the repeated security concerns of using IoT as enunciated in the
    previous subsection would result in a secondary investment to be made to strengthen
    the security apparatus of IoT to prevent hacking or otherwise to prevent malfunctioning
    of the sensors and other connected devices. This would raise the cost of IoT components
    for companies. Thus, a foray into the world of IoT presents a million opportunities
    to help our cities become better while also presenting an equal number of challenges
    with respect to the business models, the viability of technology at a large and
    small scale, in addition to aspects of security and database safety.


    # ## 12.9 Role of Explainable AI


    Artificial Intelligence (AI) is one of the disruptive technologies that has a
    potential to change urban living. Tremendous data-driven decision applications
    for a smart city such as smart transportation, online education, e-healthcare,
    smart grid, and public governance, etc., can use AI to reduce cyber vulnerabilities
    such as threats, attacks, damages, or unauthorized access. To do so, smart cities
    require smart, which is a combination of SHM and AI algorithms. However, the black-box
    nature of these algorithms hinders the exploitation of full potential of AI in
    these smart city practice. XAI is supposed to enhance the transparency, thus the
    confidence in these algorithms.'
