  md: '# 12.1 Introduction


    In today’s day and age, it is necessary to embrace new technologies such as IoT,
    Blockchain, etc., and apply them for everyone’s well-being. The world-renowned
    Nobel Laureate in Economics from Massachusetts Institute of Technology, Professor
    Robert Solow, noted in his path-breaking Solow–Swan Model, that it was technological
    advancements that drove economic growth. In contrast to the earlier chain of thought,
    this model was a mix of capital (implying heavy machinery, plants, and buildings),
    and labor (workers employed), that generated growth. In this background, the rapid
    changes that are occurring in the fields of electronics, communication, and other
    related aspects of engineering should be looked at from that perspective—aiding
    in overall progression. One can draw an analogy between such advancements from
    the fact that it was the invention of the wheel in ancient times, and then on
    to the spinning jenny, steam engines, and further on, modern locomotives and steel
    blast furnaces, that were developed in the Industrial Revolution in England in
    the 19th century, which then led to even faster technological growth in the West.
    The overall result was an increase in the net growth of the economy. Likewise,
    the development of the internet and its multidimensional applications has given
    birth to innovation, including the Internet of Things or IoT, which is fast becoming
    the new wheel of change; its impact on today’s lifestyles and those of tomorrow
    is going to be quite phenomenal. To put things in perspective, while the internet
    has connected human beings living in different places through different media,
    it also has created a system, through which even devices can be connected in real
    time.


    In this context, we treat IoT as having the potential to act as a catalyst for
    the growth of various cities, which are contributing in a major way to the growth
    in Gross domestic product (GDP) already. With large investments coming into our
    cities to make them “smarter” and more future-ready, it is imperative to apply
    such path-breaking technology to improve our cities and upgrade the existing physical
    and social infrastructure to meet the needs of changing times. In this chapter,
    we make a case for applying IoT in multiple sectors in different cities, as it
    aids in monitoring the status of existing infrastructure, and enables policymakers
    to track the changes over time. Such investments in new-age technology will promote
    growth, both directly and indirectly by first creating efficient systems and then
    creating a boom for domestic alternatives for IoT and reducing dependency on foreign
    technology [1].


    In this chapter, we provide holistic coverage of IoT in Smart Cities projects.
    We start by discussing the fundamental components for an IoT-based'
