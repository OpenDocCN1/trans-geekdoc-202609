  md: '# Website Development with Django Web Framework


    Sanmukh Kaur*, Anuranjana and Yashasvi Roy


    Amity School of Engineering and Technology, Amity University Uttar Pradesh, Noida,
    India


    # Abstract


    This chapter deals with the study of Django Web Framework, features of this framework
    and use of its inbuilt tools for web development. Further, it shows practical
    implementation of this framework through designing an architecture of a basic
    website and development of this website which has features like user registration,
    login-logout and user activity tracking through Django framework in backend. It
    highlights frontend development of user-friendly webpages using open-source CSS
    and Java Script-based design templates by Bootstrap, its customization and integration
    of these templates with Django Framework.


    Keywords: Django, Python, HTML, CSS, MVT architecture, bootstrap


    # 9.1 Introduction


    Python is a generic programming language that can be used for making GUI applications
    and desktop applications as well as web applications [1]. It is also used for
    data analytics and visualization. Its simple syntax rules make its code more readable
    and maintainable than other languages. Due to various open-source Python frameworks,
    libraries, and development tools available it reduces software development cost
    significantly and any developer can use these frameworks for its product development
    and can integrate them.


    *Corresponding author: sanmukhkaur@gmail.com'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'One of the open-source Python frameworks for web development is Django [2].
    It is a high-level Python web framework that enables quick development of maintainable
    and secure websites. It is free and open-source web framework, has an active developer’s
    community, great documentation, and various options for free technical support
    [3].


    Django was at first developed between 2003 and 2005 by a website development group
    assigned to developing and maintaining a newspaper site. The process of creation
    of different websites by the group resulted in reusing the same codes and designing
    patterns which on further development took the form of a generic web development
    framework that was open sourced in July 2005 as the “Django” project.


    # ## 9.2 Salient Features of Django


    Some of the salient features of Django are discussed below.


    # ### 9.2.1 Complete


    Django works on the “Everything included” theory and gives nearly all that software
    engineers should develop “out of the box”. Since all that is required is the one
    “product”, then everything works flawlessly together, follows steady planned standards,
    and has broad and detailed documentation.


    # ### 9.2.2 Versatile


    Django can be used to develop any type of website whether it is content management
    systems, social networking, or news websites. It can be integrated with any framework
    and can transfer or show content in practically any configuration (counting HTML,
    JSON, XML, RSS channels and so on).


    # ### 9.2.3 Secure


    Django assists designers with staying away from numerous common security botches
    by giving a system that is designed to protect the website automatically. For
    instance, Django provides secure methods to manage user account and password details,
    eliminating common flaws like creating vulnerability through putting session information
    to the cookies or directly storing passwords in raw form instead of converting
    them to hash code (unidirectional) and then saving it in database. Django empowers'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'insurance against numerous vulnerabilities by default, like SQL infusion, cross-site
    demand fabrication, clickjacking, and cross-site prearranging.


    # 9.2.4 Scalable


    Django follows a component/model-based “shared-nothing” architecture (i.e., every
    component of architecture works independently and doesn’t interfere with others,
    therefore it can be customized as per need). Due to proper separation between
    its different components, it can be scaled up for increasing traffic by addition
    of hardware (servers) at any point like caching servers, application servers,
    or database servers. Some of the heavy traffic sites, like Instagram, have successfully
    managed to scale up using Django to fulfill their demands.


    # 9.2.5 Maintainable


    Django code is coded using well-defined design principles and well-defined patterns
    that help in development of easily maintainable and code which can be reused.
    It uses the DRY (Don’t Repeat Yourself principle) so there is no unwanted duplication,
    and hence results in reduction in the amount of coding. Django also encourages
    the grouping of somewhat related functionalities into reusable applications and,
    at a lower level, same group related code into a module under the MVC (Model View
    Controller) pattern.


    # 9.2.6 Portable


    Django, which is written in Python, supports many platforms. It means that the
    developer is not bound to have its own specific server platform and can use many
    systems like Linux, Mac OS X, and Windows. Moreover, Django is also supported
    by various web-hosting cloud services, which often provide Django specific services.


    # 9.3 UI Design


    Django is a high-level Python Web framework. It has an easy to use UI. It has
    a pragmatic design to encourage fast web development. It has HTML, CSS and JavaScript
    support. It also includes multiple templates as it follows the model–template–views
    architectural pattern.


    # 9.3.1 HTML


    The Hyper Text Markup Language, or HTML, is the standard markup lan-guage for
    various component designing which is to be displayed in a web'
