    # 5.2 Implementation of DIT-FFT Algorithm


    # 5.2.1 A Quick Overview of DIT-FFT


    The basic element of DSP block is signal. A signal carries information between
    two terminals. All the continuous time varying signals, after being converted
    to quantized discrete signal (digital), are sent to DSP cores. A DFT is a method
    to convert a time domain signal to frequency domain which holds amplitude, frequency
    and phase values. These values are later used for high-speed computational process.
    The basic equation of DFT is,


    ```

    X(K) = \sum_{n=0}^{N-1} x(n)w_N^{kn} (5.1)

    ```


    where K = 0,1,2,3.....N-1, x(n) is input signal amplitude at time n and \(w_N^{kn}
    = e^{-j2\pi n/N}\) called a twiddle factor representing complex information.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In this, N-Point DFTs are partitioned recursively into N/2 DFTs in butterfly
    structure. This form of dividing DFT blocks is the simplest form of FFT algorithms,
    known as Radix-based DFT. A DFT of N-length sequence can be calculated by using
    N/2 DFT blocks repeatedly until we are left with only one DFT block for all input
    samples, providing the final output value. Figure 5.1 shows the DIT-FFT algorithm.


    ![](img/d2107fc60629942e7da5355e47fcc33d_85_0.png)


