    The data was then trained using five models: Linear Regression, Ridge Regression,
    Decision Trees, Random Forest Regressor and Gradient Boosting Regressor.


    The Decision Tree, Random Forest Regressor and the Gradient Boosting Regressor
    were found to be the most optimal training models having the highest R Square
    Value among all the models. The Root Mean Squared Error values for these models
    was between 0.2 and 0.5, meaning they were accurately predicting the target values.
    This meant that these models were the best fit for the given data and optimal
    for using for a forecast model.'
