    # 10.2.3 Artificial Intelligence Forecasting


    An AI-based forecasting approach optimizes forecasts using a combination of ML
    techniques. After that, the system chooses a model that is specially tailored
    for the specific business metric that is being forecast.


    # 10.2.3.1 Artificial Neural Network (ANN)


    ANNs are computing systems modelled after the biological neural networks found
    in human brains.


    Artificial neurons, a group of interconnected nodes or units that roughly mimic
    the neurons in a human brain, are the foundation of an ANN. Similar to how synapses
    in the human brain function, every link can interact with neighbouring neurons.
    A perceptron can trigger neurons that are attached to it after processing signals
    given to it. The total of a neuron''s inputs is determined by a non-linear function
    that determines the output of each neuron. Edges are the terms for connections.
    The weight of neurons regularly varies during learning [6].


    A connection''s signal strength might be raised or lowered depending on the weight.
    It''s possible for neurons to have a threshold they must pass through in order
    to send a signal. Neurons frequently combine together to form layers. Different
    layers may change their inputs in different ways. Signals move through the layers
    from the first one (the input layer) to the last one, maybe several times (the
    output layer). The Figure 10.1 shows the comparison between a biological neuron
    and a neural network. It highlights the inputs and outputs of a biological neuron
    and compares them to an artificial neuron.'
