- pgno: 70
  md: 'A modest intentional alteration to an audio source that is imperceptible to
    human ears, and which causes a machine-learning model to malfunction, is known
    as an adversarial audio assault. Since adversarial attacks have the potential
    to lead such models to make inaccurate predictions, this raises security concerns
    regarding the machine learning algorithms. In [16], the authors presented some
    adversarial attack, which has a high impact on audio signals and evaluated the
    resistance of learning modules. They proposed an approach to secure the audio
    signals from adversarial attacks by representing the audio signal as DWT (discrete
    wavelet transform) form and SVM. Various pre-processing units are included for
    enhancing spectrogram, generating, reducing dimension, and smoothing. Features
    are extracted from patches of spectrogram using SURF (speed-up robust feature)
    algorithm. K-means is used for further clustering. SVM is used to train the dataset.


    In [17], features are extracted in both domains time and frequency. In time domain
    short-time energy and ZCR are calculated and the centroid of audio frequency spectrum,
    sub-band energy ratio and mel-frequency cepstral coefficients were calculated
    in frequency domain extraction. The SVM technique is used to classify the audio
    signal. The design classifies the audio signal effectively and has an accuracy
    of 90%.


    Classifying the audio takes multiple stages, like labelling, extracting, and classifying
    using training set from audio base. Figure 4.2 shows the block diagram of audio
    classification. The audio will collect using audio/magnetic sensors, or microphone.
    The audio will undergo filtration to remove noise from the raw audio signal. The
    filter signal then divides into frames or labels for further process. Features
    will extract for classification. Using learning module and training dataset the
    audio will be classified and send to devices using Bluetooth.


    ![](img/d2107fc60629942e7da5355e47fcc33d_70_0.png)


    # Figure 4.2 Block diagram of audio classification using ML.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The flow chart shown in Figure 4.3 classifies the data according to training
    data. After noise removal EMI kernel sends the data to ML classifier. The steps
    are as follows:


    +   1. Start.

    +   2. Data is send by EMI attenuator which is task from the user.

    +   3. If the task==1, it means the instruction given by the user is movement
    of the wheelchair, otherwise it moves to accessing the computer or smartphone.

    +   4. Yes: moves to next block and compares the data by training data. No: Moves
    to the next decision step.

    +   5. If the data matches the training data, then the command is given and flow
    will end. Otherwise, moves to the 2nd block and again collects the data.

    +   6. Steps 4 and 5 will repeat for accessing computer and smartphone.

    +   7. End.


    ![](img/d2107fc60629942e7da5355e47fcc33d_71_0.png)


    Figure 4.3 Flow chart of machine learning classifier.'
