  md: '# Artificial Intelligence-Based Active Virtual Voice Assistant


    Swathi Gowroju*, G. Mounika, D. Bhavana, Shaik Abdul Latheef and A. Abhilash


    1CCSE, Sreyas Institute of Engineering and Technology, Hyderabad, Telangana, India


    # Abstract


    As we all know, there are many voice assistants which determine the user’s intent
    which can be identified by the user input in spoken or textual form. Unlike the
    other voice assistants, here we can open multiple tabs or apps concurrently. Though
    the input is taken, the voice assistant will be activated till the user says to
    exit the app. It is a very useful tool for reminders, searching, opening, and
    saving applications as the user needs. The proposed virtual-based voice assistant
    helps people to communicate with the computer, which indeed saves time. The processes
    which are to be implemented will work under AI modules like speech recognition,
    pyttsx3, and operating system. This new version has added three features. They
    are movie recommender, book recommender, and some Covid protection features. The
    movie recommender and the book recommender work on the users’ interests. For example,
    the movie recommender helps users to find the best movie according to their interest
    in different genres and displays it based on the IMDB ratings and the number of
    users watching. This also includes series recommenders too, like web series. The
    same process is applied to book recommender. The books are displayed according
    to user interests based on author and genres (romcoms, thrillers, etc.). Because
    of the rapid spread of Covid-19, precautions should be taken mandatorily. All
    the Covid symptoms are stored in our database, through which users can receive
    information and advice based on their symptoms. All these processes work under
    AI modules like speech recognition, pyttsx3, and operation system.


    Keywords: Speech recognition, pyttsx3, operation system


    *Corresponding author: swathigowroju@sreyas.ac.in'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 6.1 Introduction


    This voice assistant works just like other voice assistances such as Siri and
    Google Assistant. In this project, artificial intelligence modules are used. It
    will detect the speech and save it in the database and then retrieve it from the
    database and execute the command given by the user and delete it from the database.
    To do this process, AI modules are used, such as, to recognize speech, speech
    recognition module is used, to detect the voice of the user and respond to it
    correctly, pyttsx3 module is used, and also for searching files in the folders,
    OS (operating system) modules are implemented. To open other applications and
    websites like Google, Firefox, YouTube, Wikipedia, and web browser modules are
    used. As the interactions between the user and your window assistant skills are
    in free form, the assistant will understand the language naturally without any
    interruptions and also in the view of context. It consists of a special feature,
    i.e., we can open multiple tabs or apps concurrently. Although the input is taken,
    the voice assistant will be in activate mode until the user says to exit the app.
    If not, the assistant keeps on taking the commands given by the user.


    Aside from the lack of research in the field, many of these efforts face difficulties
    in retrieving BIM data using speech recognition systems. Keyword-based search
    engines are one of the most common pitfalls. Autodesk’s Voice 360 plugin, for
    example, is used to accomplish Forge Viewer instructions. The user can use voice
    recognition to give instructions instead of mouse and keyboard inputs. Moreover,
    the Voice 360 plugin uses rule key phrases and is limited to a list of eligible
    items [1]. The small handful of keywords in lexicon search engines is a significant
    limitation.


    Moreover, finding accurate results is difficult when the recall and precision
    attributes used during the search are limited [2]. Words that have different meanings
    or phrases that serve the same purpose produce irrelevant search results [2].
    Motawa [9] created another search approach for searching BIM data, this time using
    the IFC database to create an NLP-based repository for scanning BIM data. This
    technique is indeed limited because the IFC pattern focuses on object relationships.
    It signifies that all of an element’s detailed data is not transferred to the
    IFC template [3].


    With the foregoing in mind, there is a need to develop a manageable information
    source proficient in fetching fractal data in BIM models by multiple users with
    varying levels of experience in voice assistant software applications, thereby
    reinforcing the paper’s purpose.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'However, there is a significant knowledge gap in the building projects for
    this. It is frightening to research the subject. Few attempts have been made to
    use AI voice commands to socialize with BIM models. Shin et al. [7] created a
    framework for BIMASR (building information modeling automatic speech recognition)
    to allow BIM people to engage with the BIM model using natural language (NL)-based
    questions. The developed solution, however, is extensive and contains multiple
    tasks. The solution was built around the Google Cloud API for speech recognition
    and the Oracle database with the Eclipse platform for interacting with Dynamo.


    Furthermore, the originality of a study in the building construction discipline
