    ognition or classifying the data files, it is also helpful in ATs. Using speech

    as a base to control multiple devices for assisting the able and unable bod-

    ies is the main focusing area in biomedical application. The tongue is the

    least effective organ in the whole body; it is easy to access speech as input

    for devices to control. In the paper [8], the authors designed a TDS for

    accessing the computer and PWC (power wheelchair). In addition to the

    navigation of a 50-m obstacle course, three control strategies were utilized

    to drive the PWC. Additionally, the two Likert scale questionnaires used to

    evaluate the qualitative aspects of its use – one short (eight questions) and

    one longer (46 questions) – were used to evaluate some of the qualitative

    aspects of using the TDS.


    The authors of [9], discuss customized TDS circuitry. Computers can be

    controlled independently by moving the tongue, and directing commands

    to them. Tracers such as neodymium magnets placed on the tongue are

    used to track tongue movements. As the tongue moves, the magnetic field

    inside and around the mouth varies. Inductive magneto-inductive sensors

    on a headset are mounted bilaterally to detect the variations. A portable

    screen is connected wirelessly to the raspberry-pi to transmit the inform-

    ation. A wireless TDS is designed [10] to control the smartphones. By

    using permanent magnetic traces pierced on tongue, the commands are'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'detected. This TDS is linked to iPhone using wireless customized module for
    accessing the wheelchair, light, computer, television, and telephone.


    In paper [11], the authors designed an intraoral-TDS (iTDS) to control smartphone,
    PWS and computer. A dual-band antenna is shared between band 915 MHz and 433 MHz
    and a coil is shared with the lower band 27 MHz, in order to minimize external
    RF interference effects. Battery charging is also shared to reduce overall size
    and weight of the Transmitter (Tx). To maintain the wireless link robustness in
    mouth environment dynamically, the Tx incorporates two adaptive matching networks
    at 433 MHz and 915 MHz, respectively.


    There are different modules involved to implement the audio classifying module
    [12–14] as shown in Figure 4.1. For processing the audio, we need to consider
    amplitude, duration, frequency, sampling rate, etc. The modules included in the
    development of an audio classifier using learning techniques are a microphone
    or audio sensor to collect the raw audio data, filters for removing the noise,
    MLC to classify the data according to the training dataset, and Bluetooth module
    for processing the classified data to a device.


    In [15], an audio-visual fusion was developed for obtaining both audio and visual
    paths to identify the emotions of a user using video. VAD (voice activity detector)
    is used as a pre-processing stage to eliminate the background noise and segment
    out the noise not related to speech. It uses short-time energy and zero crossing
    rate (STE and STZCR) as the features. The audio analyser and feature-level fusion
    are developed for speech classification. The multiple outputs are produced from
    the audio path because the speech signal is divided into multiple sub-portions
    with particular lengths.


