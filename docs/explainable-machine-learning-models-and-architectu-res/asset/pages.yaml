    Every design that relates to ASIC requires a unique mask set during chip production,
    unlike customized FPGAs. By tailoring the circuits and connectors to the requirements
    of each individual application, it is possible to achieve high levels of performance
    and density. Nonetheless, there is a rapid increase in the cost of the mask sets
