    # 11.4.4 Wind Power Density Analysis (WPD)


    The WPD value is the major factor for the wind energy potential assessment of
    a wind location and also evaluating economic feasibility to form a potential wind
    farm. The model of WPD defines the distributions of wind energy at several wind
    speed values and proportional to the cube of wind speed. Its value is represented
    in W/m2 depends on the wind location, air density and the wind speed and derived
    as follows:'
  merge: -1
  img_proc: true
- pgno: 232
  md: '\( WPD = \frac{P}{A} = \frac{1}{2} \rho v^3 \) (11.11)


    Where P is a wind power measured in Watts, A stands for a swept area in m2, \(\rho\)
    states the air density (\(\rho = 1.225kg/m3\)) and v represents the wind speed
    in m/s. Considering all these, the distribution of wind speed is taken into account
    and then WPD can be expressed as


    \( \frac{P}{A} = \frac{1}{2} \rho \int_{0}^{\infty} v^3 f(v) dv \) (11.13)


    For evaluating WPD of a particular distribution, the wind power density distribution
    function f(v) can be expressed as


    \( \frac{P}{A} = \frac{1}{2} \rho v^3 f(v) \) (11.14)


    The best fit of WPD is calculated as follows,


    \( eWPD = \left( \frac{WPDo - WPDest}{WPDo} \right) 100\%\) (11.15)


    Where WPDo is the observed Wind power Density from Measured values, WPDests the
    estimated values from Distribution Fitting and eWPD is the error between observed
    and estimated.


    # 11.4.4.1 Comparison of Wind Power Density


    The annual WPD comparison with MFO estimated parameters and seasonal wind power
    density for the three locations are given in Table 11.22 and Table 11.23, respectively.


    The three locations of different landscapes such as offshore, nearshore, and onshore
    are considered. Wind power density is evaluated after carrying goodness of fit
    with RMSE and R2 using probability distribution methods. The goodness of fit eWPD
    indicates the wind power density how best the particular distribution to suit
    the location.


    Table 11.24 shows the Wind Power Density calculated from different distributions
    along with measured value during seasonal periods for three'
