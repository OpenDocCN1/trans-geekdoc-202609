- pgno: 192
  md: '# 11.2.4 Goodness of Fit


    The goodness of fit is a statistical analysis method for qualifying the ten wind
    probability distributions taken for evaluation to match with actual data measured.
    The best Correlation Coefficient (R2) and Root Mean Square Error (RMSE) [7] scored
    the wind distribution method, which is the best suitable for the defined location.
    The fitness of ten distributions arrived at using R2 and RMSE and can be calculated
    as follows.


    RMSE calculates the residuals of the measured data and frequency of examined PDF,


    \( RMSE = \left[ \frac{1}{n} \sum_{i=1}^{n} (y_i - x_i)^2 \right]^{0.5} \)


    Where n stands for the number of bins, y<sub>i</sub> is the observed data plotted
    in a histogram, and x<sub>i</sub> is estimated probability distribution (PDF)
    of wind distribution. The evaluated RMSE value which is close to zero is the best
    fit.


    The R<sup>2</sup> evaluates the linear correlation between measured data and predicted
    values from PDF functions


    \( R^2 = 1 - \frac{\sum_{i=1}^{n} (y_i - x_i)^2}{\sum_{i=1}^{n} (y_i - \bar{y})^2}
    \)


    Where \(\bar{y}\) is the mean of the total observed value. The evaluated value
    of R2 ranges between 0 to 1 and close to 1 is the best fit.


