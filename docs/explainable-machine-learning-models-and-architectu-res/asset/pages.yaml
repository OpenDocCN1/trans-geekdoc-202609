- pgno: 74
  md: 'the performance of the system. Those are Serial Peripheral Interface, external
    magnetic interference attenuation and classifier. The block diagram of the local
    processor is given in Figure 4.3.


    The flow diagram (Figure 4.5) shows the raw data transmitted to perform an action/command
    given by the user using audio processing module.


    The design steps are:


    +   i) the user gives the command as audio/voice instruction.

    +   ii) the raw data will track by magnetic sensors.

    +   iii) these magnetic sensors send the data to the processor; SPI will collect
    the data and processes it to EMI kernel.

    +   iv) In the EMI kernel the data noise will attenuate and noise-free data is
    send to ML classifier.

    +   v) ML classifier compares the data which is processed by dataset which was
    already given to the device as training data. The final instruction/command is
    detected by using classification algorithms.

    +   vi) The ML classifier sends the output as command to the devices.


    The magnetic sensors are attached to the user tongue, which collects the raw data
    from the user and sends the data to the processor through magnetic fields generated
    by sensors. The processor should be within the surroundings because the magnetic
    field does not cover up the maximum area. A lot of sensors are available, and
    the sensors are selected by their accuracy performance. The hall effect sensors
    can acquire 1% output error, which is very low. Hall effect sensors are particularly
    suitable for high-current or low-voltage applications.


    # 4.4 Application of Proposed FPGA-Based ML Models


    One of the applications of a machine learning module in the biomedical field is
    Assistive technology (AT). There are a number of ATs available in the market that
    help individuals to independently communicate with the environment through their
    body movements and senses. They are able to send commands through various sensor
    modalities, such as eye movements, facial expressions, head motion, voice recognition
    systems, electromyography switches, electroencephalogram (EEG) and electrooculogram
    (EOG).'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'One AT is TDS, in which all the devices that are operated by tongue/ voice
    are included. People who are suffering from paralysis and damaged spinal cord
    can use these devices without stressing out, because tongue nerves are the least
    effective nerves in the whole body. Using TDS is easy for SCI (spinal cord injury)
    and paralyzed patients. The authors in [18] designed a tongue-operated system.
    Force sensitive resistors are used to send data to the controller, which controls
    the surrounding of the users in four different modes: communication with caretaker,
    emergency contact, home automation, and controlling the wheelchair. This methodology
    does not require any installation or piercing of magnetic sensors or ICs.


    In paper [19], a neuromorphic binaural auditory sensor designed completely in
    spike domain is analyzed in terms of its architecture, design flow, and FPGA implementation.
    The paper presented a model of the digital cochlea that decomposes audio signals
    using pulse frequency modulation rather than classical digital signal processing
    techniques. By using an address-event representation interface, it provides a
    set of frequency- decomposed audio information based on spike information encoded
    directly as spikes. The experiment implemented a 64-channel auditory system on
    a Virtex-5 FPGA board. Various audio signals were used to stimulate the system
    to characterize its response.


    In [20], the authors developed and implemented a processor for stress detection
    using two learning algorithms SVM and KNN, considering the different physiological
    sensors used to collect features to monitor stress detection. Heart rate, heart
    rate variability, galvanic skin response, and accelerometer are the physiological
    sensors that are considered to collect the input data for detecting stress. The
    data is collected by performing shooting tasks, and by manipulating the performance
    feedback. Three levels of stress were stimulated: no feedback (low-stress), medium
    and high. The experiment was conducted considering 16 features and resulting in
    a 35-second window to elaborate on the stress. The design is implemented on Artix-7
    FPGA board and ASIC post-layout in 65 nm CMOS technology.


    In [21], the authors designed and implemented an image quality assessment (IQA).
    This is useful to identify the visual quality automatically without others’ judgment.
    IQA is classified into three depending on the availability of reference images.
    References: full reference (FR), reduced reference (RR) and no reference (NR);
    this means complete reference, partial availablely and no reference needed. ML
    algorithms – SVM, RT (regression tree), non-linear regression (NLR), artificial
    neural networks (ANN) and fuzzy logic (FL) are used to estimate the IQA Implemented
    using C code on VIVADO HLS and the design was tested on Virtex-7 FPGA board. TDS
    is implemented on IGLOO nano FPGA board [22], which is ultra-low-power'
  merge: -1
