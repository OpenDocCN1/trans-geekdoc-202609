  md: '# ## 11.2 Wind Data Analysis Methods


    Wind energy is created on the earth surface due to uneven heating. Also, the wind
    resource varies with increase or decrease or is made turbulent by factors such
    as hilly area, bodies of water, buildings, and vegetative lands. Also, wind speeds
    in a location are subject to variation in nature by time of day, seasonal, and
    according to weather events. The wind data analysis of different landscapes such
    as onshore, nearshore and offshore are carried out in the subsequent sections.
    Wind characteristics at the selected location, wind power density in a location
    and wind distribution fitting are presented.


    # ### 11.2.1 Wind Characteristics Parameters


    The primary data collection sensors of most wind resource assessment are carried
    out by taking ground-level wind parameters using meteorological instruments mounted
    on tall towers and modern instruments like Sodar and Lidar devices [10]. The important
    parameters for any wind monitoring program are the wind speed, wind direction,
    and air temperature. The parameters normally measured in a wind location are shown
    in Table 11.1.


    # ### 11.2.2 Wind Speed Distribution Methods


    The wind speed [11] and its frequency of occurrence to form a wind distribution
    pattern is vital information and is used directly for estimating the wind turbine
    power output. The wind frequency distribution represents the number of times in
    the period of data collected that the observed speed falls within particular bins.
    The wind speed bins have a typically 0.5 or 1 m/s space and cover at least the
    range of speeds from 0 to 25 m/s or more which is defined for the turbine power
    curve. The usual reports for analysis are presented in bar chart/histogram and
    input as table. The probability density function is represented as mathematical
    one which visualizes the probable pattern of wind speed, which is random in nature
    in a continuous period. The wind distribution methods are analysed with cumulative
    distribution function (CDF) and probability density function (PDF).'
