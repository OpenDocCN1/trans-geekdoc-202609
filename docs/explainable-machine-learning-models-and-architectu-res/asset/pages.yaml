  md: 'becomes the basis for the sustenance of agriculture and the farmer’s profit
    and livelihood. The difference, however, lies in the scale and intensity of IoT’s
    applications; the base being networking and use of AI along with data collected
    in real time. The emergence of IoT creates a multidimensional impact that translates
    into primarily three effects: Technological, economic, and social, in that order.
    The emergence of the market for IoT and IoT-based products in India as noted in
    [6] shows that the potential is very high. IoT in a sense can be called the catalyst
    that drives the discovery of oil (i.e., data). The markets still seem to be in
    an early phase of development but with start-ups focusing on IoT-based solutions
    to small problems such as checking levels of water as well as pollution in lakes
    and setting up a lake grid to aid in monitoring their toxicity. Therefore the
    technological aspect generates supply effects to meet rising demand in the society
    for such technology. To use economics jargon, we can say it follows Say’s Law
    (which states that supply for a good finds its demand under certain assumptions).
    The market for IoT appears to be monopolistic (at the moment) with a varying degree
    of differentiated products (solutions) proposed or put forth by various IT companies
    and other tech firms.


    While the net effect of IoT is positive on the economic front, many other effects
    need to be pointed out in this chapter. In terms of technology, there would be
    delays in implementation and constant maintenance of IoT infrastructure and this
    would raise a company’s cost element. Furthermore, on the economic front, while
    things might seem hunky-dory with the adoption of IoT, there is a very good chance
    of the value of IoT-related products fluctuating in a big way due to the customization
    of such a technology. As argued by [5] it might even result in a digital divide
    with the fairly well off being able to utilize IoT for homes while others would
    miss out due to the costs involved in accessing such technology. But that said,
    the social consequences can be very hard to predict. Further on the economic front
    is the viability of switching to IoT; not every company would find a need to use
    the technology. In addition to this, the issue of financial prospects of companies
    engaged in developing such technology comes into the picture. The authors in [5]
    opine that IoT is hampered by a lack of compelling and sustainably profitable
