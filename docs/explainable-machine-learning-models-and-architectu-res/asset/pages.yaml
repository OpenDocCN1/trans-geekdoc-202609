    # ## 8.2 Algorithms Employed for Performance Monitoring


    # ### 8.2.1 Artificial Neural Networks


    Information-processing systems called artificial neural networks (ANNs) provide
    appealing alternatives to traditional approaches like numerical modelling techniques,
    analytical techniques, or empirical modelling solutions because they generalise
    by abstraction and learn from observations [20, 21].


    ANNs are straightforward to utilise and have the capacity to describe multi-dimensional
    nonlinear interactions. Additionally, the neural network approach is quick to
    respond and versatile (i.e., the same modeling technique may be utilised for passive/active
    devices/systems). These characteristics have made the ANN method popular as a
    strong tool in many fields, including pattern recognition, voice processing, control,
    and bio-medical engineering. More recently, it has also been used in RF modelling,
    microwave design, and optical performance monitoring. Often, the


