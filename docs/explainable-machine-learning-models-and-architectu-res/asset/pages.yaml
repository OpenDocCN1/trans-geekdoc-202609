    \ a result of this forecast.\n\n+   3. Straight-Line Method or Historical Growth\
    \ Rate Method\n+   This approach is quite straightforward and frequently utilised\
    \ by organisations that are experiencing growth and anticipate continuing gains\
    \ in revenue. Finding the historical revenue growth and extrapolating it to the\
    \ future is how the straight-line technique is computed.\n\n+   4. Moving Average\
    \ Method\n+   Comparable to the straight-line approach, the moving average method\
    \ only considers the bits of historical data that are chosen to be most useful\
    \ for a certain business, rather than the complete set.\n\n+   5. Weighted Moving\
