    Multiple layers of processing units known as neurons make up an ANN. The coefficients
    below reflect the strength of the connections between each neuron and the neurons
    in the next layers. The correlations between sets of input-output data that represent
    properties of the device or system under examination are discovered by ANNs. The
    outputs of the ANN are compared to the desired outputs, and errors are determined,
    after the input vectors are given to the input neurons and the output vectors
    are generated. As soon as the network has seen all of the training sets, error
    derivatives are computed and added for each weight. The weights for the neurons
    are updated using the error derivatives, and training is continued until the errors
    achieve the desired low levels. The levels of ANN are shown in Figure 8.2.


