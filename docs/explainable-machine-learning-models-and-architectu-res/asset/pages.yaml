  md: '# ## 11.4.1 Wind Characteristics


    The detailed wind statistical analysis for Jafrabad Station (Mast-Nearshore),
    Gulf of Khambhat station (Offshore) and Kayathar station (Onshore) are presented
    in the subsequent sections. The primary wind characteristics of any wind studies
    to ascertain the wind resource feasibility are Mean wind speed, Standard deviations
    of wind, wind directions, and Turbulence Intensity. To make the wind project technically
    viable, the collected statistical analysis is used to determine the site eligibility
    for wind turbines selection and energy yield from the turbines. The statistical
    analysis of wind speed, wind direction, along its relation is represented by the
    Wind rose plot. The mean wind speed over the periods for seasonal, monthly, and
    annual analysis represent the energy contained in the wind and also for the analysis
    of turbulence intensity to turbines class of operation. The Probability Density
    Functions (PDF) for fitting the wind power potential analysis, wind speed distribution
    and statistical characteristics are presented in the following sections.


