  md: '# ## 2.4 Convolutional Neural Network Architecture


    It is a Deep Learning system that can take in an input image, give various characteristics
    and objects in the image importance (learnable weights and biases), and be able
    to tell one from the other. Comparatively speaking, a CNN requires substantially
    less pre-processing than other classification methods. While filters in older
    methods are hand-engineered, CNNs can learn these filters/characteristics with
    adequate training. CNN is crucial in information bases, where there is a need
    to prepare many hubs and boundaries (e.g., picture handling) [20]. Shown below
    in Figure 2.3 is the architecture of a CNN.


    The architecture of CNN’s is divided into different layers and is defined below:


    +   - **Convolutional layer** - The convolutional layer, which determines the
    output of linked input in an open area, is the fundamental component of the convolutional
    neural network. A two-dimensional activation guide of the track is created by
