    # Affine Transformations


    Depending on variations to the camera and its settings, the illumination, and
    the object itself, images of even an identical object might differ significantly.
    For monitoring, searching, and comprehending photos, one option to handle some
    of these changes is to utilize a description of the object that is unaware of
    some of the modifications stated above. Commonly employed for this purpose are
    affine invariants [15].


    # Affine Invariance


    This means that surfaces are considered the same under affine transformations,
    i.e., linear transformations x → Ax + b, including squeezing and shearing [15].


    # 2.2.3 ASIFT


    ASIFT or Affine Scale-invariant Feature Transform is based on SIFT but unlike
    SIFT, ASIFT can accommodate all the six properties and is capable of simulating
    with enough accuracy even the distortion caused by the camera’s optical axis direction.
    The ASIFT approach replicates all picture views that may be obtained by altering
    the two camera axis orientation parameters, namely the latitude and longitude
    angles. The SIFT approach is then used to cover the remaining four parameters
    [13].


    # Advantages of ASIFT over SIFT


    +   - When the number of matches produced by the SIFT algorithm is significant,
    ASIFT has better accuracy than SIFT [4, 13].'
