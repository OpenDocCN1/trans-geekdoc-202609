  md: '# 11.1 Introduction


    As technological developments and populations grow, the electricity consumption
    need also increases, which leads to environmental pollution conditions regarding
    the type of fuels used for power production. The types of fuel like fossil fuel–based
    generation from coal, oil-based, threatens change in climatic condition with increased
    carbon emission and pollution particles suspended in air.


    As per Paris Agreement commitments, to keep the rise in average global temperature
    closer to 1.5 °C, the government of India has set an ambitious target of achieving
    a total of 175 GW of renewable energy capacity including 60 GW of wind capacity
    by 2022 [1].


    In depth analysis to be carried out wind characteristics and its potential is
    necessary for wind turbines installation in onshore, nearshore and offshore areas.
    The methodology adopted at least a period of one year, for data collection through
    local site survey, by installing anemometers, pressure and temperature humidity
    sensors, Lidar wind measurements in the land, coastal mast areas. The ground-level
    measurements are taken as a primary data for accuracy over satellite data. For
    wind potential history for past years, nearby wind stations and neighbouring stations
    like airport are taken for reference [2].


    This study, focus on applying machine learning optimization techniques for analysing
    wind characteristics and wind distribution methods using the wind data collected
    in onshore location Kayathar (TamilNadu) and offshore location from Gulf of Khambhat
    (Gujarat) along with nearshore location from Jafrabad (Gujarat) for analysis.
    The analysis focuses on how wind characteristics behave in onshore, nearshore
    and offshore areas [3] by comparing the results obtained. Ten wind speed distributions
    methods are considered for analysis along with unimodal conventional distributions.
    Weibull [4, 5], Rayleigh, Gamma, Nakagami, Generalized Extreme Value, Log Normal,
    Inverse Gaussian, Rician and Birnbaum Sandras [6] and bimodal-WW were used for
    wind resource assessment. In the wind resource assessment earmarked locations,
    the impact of bimodality is taken into consideration and mixed Weibull methods
    are adopted. The results and observations aid in effective deployment of wind
    farms in onshore and offshore areas.'
