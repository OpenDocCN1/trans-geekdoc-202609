    \ more current data is more reliable than older data.\n+   \n+   This results\
    \ in a more accurate forecast that takes the altering sales trends into account\
    \ by giving the more recent years a numerical weight to boost their impact on\
    \ the estimate. This process is referred to as exponential smoothing, and it can\
