  md: '# # Also of Interest


    # ## By the same editors


    *MACHINE LEARNING TECHNIQUES FOR VLSI CHIP DESIGN*, Edited by Abhishek Kumar,
    Suman Lata Tripathi, and K. Srinivasa Rao, ISBN: 9781119910398. This cutting-edge
    new volume covers the hardware architecture implementation, the software implementation
    approach, and the efficient hardware of machine learning applications with FPGA
    or CMOS circuits, and many other aspects and applications of machine learning
    techniques for VLSI chip design.


    *INTELLIGENT GREEN TECHNOLOGIES FOR SMART CITIES*, Edited by Suman Lata Tripathi,
    Souvik Ganguli, Abhishek Kumar, and Tengiz Magradze, ISBN: 9781119816065. Presenting
    the concepts and fundamentals of smart cities and developing “green” technologies,
    this volume, written and edited by a global team of experts, also goes into the
    practical applications that can be utilized across multiple disciplines and industries,
    for both the engineer and the student.


    *DESIGN AND DEVELOPMENT OF EFFICIENT ENERGY SYSTEMS*, edited by Suman Lata Tripathi,
    Dushyant Kumar Singh, Sanjeevikumar Padmanaban, and P. Raja, ISBN 9781119761631.
    Covering the concepts and fundamentals of efficient energy systems, this volume,
    written and edited by a global team of experts, also goes into the practical applications
    that can be utilized across multiple industries, for both the engineer and the
    student. NOW AVAILABLE!


    *Electrical and Electronic Devices, Circuits, and Materials: Technical Challenges
    and Solutions*, edited by Suman Lata Tripathi, Parvez Ahmad Alvi, and Umashankar
    Subramaniam, ISBN 9781119750369. Covering every aspect of the design and improvement
    needed for solid-state electronic devices and circuit and their reliability issues,
    this new volume also includes overall system design for all kinds of analog and
    digital applications and developments in power systems. NOW AVAILABLE!'
