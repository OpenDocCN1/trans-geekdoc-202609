    # 2.2.4 SURF (2006)


    A quick and reliable approach for local, similarity-invariant representation and
    comparison of pictures is the SURF method (Speeded Up Robust Features). The SURF
    approach''s key appeal is its ability to compute operators quickly using box filters,
    enabling real-time applications like tracking and object detection [17].


    # Motivations behind SURF:


    +   • Faster detection of key points

    +   • Less complicated

    +   • Scale and rotation invariant and invariant to photometric changes

