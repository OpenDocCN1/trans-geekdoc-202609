  md: '# 10.3.3.2 Prediction of Categorical Variables


    Additional categorical variables may also be used to predict categorical variables.
    However, this topic is about categorizing a new dataset into the existing classes
    of datasets rather than forecasting a value. Categorical variable decision trees
    address classification-type issues in which a class rather than a value is the
    output.


    # 10.3.4 Random Forest Regressor


    After numerous classifications, decision tree algorithm have now been trained
    to different datasets, a random forest learning method is made use of, which uses
    averaging to increase projected accuracy and reduce overfitting.


    The outcome is dependent on multiple decision trees instead of just one because
    each one was precisely trained using that specific sample of data, so there is
    less volatility when we mix them all at once.


    In a classification problem, the solution is determined by the simple majority
    classifier. In a regression problem, the overall output is the mean of each result.
    This is described as an aggregation.


    Using several decision trees and a process called Bootstrap and Aggregation, sometimes
    known as bagging, Random Forest is an aggregation technique that can perform both
    classification and regression tasks.


