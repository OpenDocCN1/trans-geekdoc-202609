  md: '# Conclusion


    This paper highlighted the generational improvements in the algorithms used in
    the field of image recognition/classification, aiming at the shortcomings of each
    listed algorithm and how it was further improved upon. Through the literature
    review of multiple research papers, we discovered that algorithms that were once
    hailed as state-of-the-art algorithms like SIFT [3] had been improved upon. SIFT’s
    derivative ASIFT [13], for example, improved upon a lot of flaws in SIFT [4],
    and finally SURF [17] was the fastest of them all. The main flaw with these algorithms
    is that they are hand-engineered and thus do not learn the representation by itself;
    it is hard coded, and that’s why CNNs have an edge over these.


    CNN has made great strides in picture processing and vision-based tasks, which
    has rekindled analysts’ interest in ANNs. In this exceptional situation, a few
    research projects have been conducted to determine the convolutional neural network’s
    performance on these tasks [31]. Convolutional neural networks’ progressions can
