  md: '# Integral Images


    In 1984, the Integral Image or Summed-Area Table was first shown. A rectangular
    subset of a grid or the sum of values (pixel values) in each image can be quickly
    and accurately calculated using the Integral Image (the given image). It can be
    used to determine the average intensity inside a certain image, or this is its
    primary usage. They allow for fast computation of box-type convolution filters.
    The entry of an integral image IΣ (x) at a location x = (x,y)T represents the
