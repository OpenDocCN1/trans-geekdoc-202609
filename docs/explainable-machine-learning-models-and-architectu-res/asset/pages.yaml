    # 12.2 Technological Progress: A Brief History


    The spark of advancement was lit when man invented the wheel in the Chalcolithic
    Age. The wheel kept moving, and with that, the world progressed. The Industrial
    Revolution is a process of transformation from an agrarian and handicraft economy
    to an industry-dominated one. Many other changes, including socioeconomic and
    cultural changes, were involved in the Industrial Revolution. The first Industrial
    Revolution is marked by mechanization and dates back to the 1780s. This was the
    time when steam power was put into application and railroads started. The second
    Industrial Revolution was marked by mass production and electrical power as a
    stepping stone for technological advancements [2].


    With the development of many natural and synthetic resources and with a combination
    of machines, this era gave rise to the automatic industry. Computers made their
    way after the 1960s, and advancements in technology automated the process of production.
    The era is marked by markets flooded with electronics. And then came the time
    when the need was felt for our devices to be smart! Three Industrial Revolutions
    later, we are now experiencing the fourth Industrial Revolution, or better called
    the Digital Revolution. The Internet is the wheel here, that is driving all the
    change. As shown in Figure 12.1, this industrial revolution has impacted every


    ![](img/d2107fc60629942e7da5355e47fcc33d_246_0.png)


    Figure 12.1 Industrial revolution with technology.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'industry, transforming the entire system of production, management, and even
    governance, driving the IoT adoption to full swing.


    # ## 12.3 What is the Internet of Things (IoT)?


    IoT has been the buzzword for quite a few years now. The idea of devices being
    able to communicate with each other just as efficiently as humans do with one
    another has paved the way for major developments in communication and related
    engineering fields. What exactly is IoT? The Internet of Things is a collection
    of devices, embedded with sensing and processing capabilities, that connect and
    communicate with each other over the internet. This enables seamless communication
    between people, processes, and things with minimal human intervention and using
    low-cost computing, data analytics, cloud, and advanced mobile technologies [3].
    IoT can be thought of as a light bulb that can be controlled with a smartphone
    application or even a driverless car. Both of them are IoT and work on the same
    principle.


    From a small LED to an airplane, it is possible to connect anything into the IoT.
    The sensors add an element of digital intelligence, by virtue of which, devices
    communicate without human intervention, leading to a smarter and more responsive
    environment around us. We are already investing in smart cities projects and sensors
    are deployed everywhere to help us understand and control the environment.


    How big is IoT? Well, the network is getting bigger and bigger every day. IoT
    applications are everywhere—security cameras and devices, automotive, and healthcare
    (especially for monitoring of chronic diseases) are the fastest-growing sectors
    for IoT. Smart City projects are the key feature of IoT, generating large amounts
    of data with big infrastructure (including traffic lights, toll plazas, etc.)
    already in place. Sensors spread across the entire region produce large amounts
    of data that make use of cloud and big data analytics to add further intelligence
    to the system [4].


    # ## 12.4 Economic Effects of Internet of Things


    In [5] the authors note that the economic value of IoT is a continuous process
    and it is not merely a technology but connects various interdependent systems
    which are continuously evolving. An analogy can be drawn about the weather and
    agriculture and the overall setup wherein weather'
  merge: -1
  img_proc: true
