    # 12.6 Architecture for Smart Cities


    With the help of a generic five-layered structure, the IoT unifies various processes
    such as data sensing, collection, transmission/reception, storage, and processing.
    Each layer functions on the information from the preceding layer. The Sensing
    layer, also known as the Perception layer, is the first. This layer’s primary
    function is to detect the external world, which it accomplishes through the use
    of sensors that may collect data on physical quantities of interest in any application
    [11]. It also contains actuators that may act on tangible objects, such as RFID
    scanners for scanning RFID tags. The data acquired by the sensing layer (through
    sensing) is then sent on to the Middleware layer using wireless network technologies
    such as Wi-Fi, cellular internet, Zigbee, and Bluetooth, among others, in the
    networking layer [12]. As the name implies, the Middleware layer primarily serves
    as a generic interface between the sensing layer hardware and the Application'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'layer [13–15]. The acquired data is used in the application layer to provide
    customers with services via various APIs and database management services. It
    is the relationship between what the sensor collects and what we perceive as users
    (the decision). The Business layer is connected to the application layer and is
    responsible for defining plans and policies that aid in the administration of
    the entire system.


    # 12.6.1 Networking Technologies


    The functioning of the Internet of Things in a Smart City has mostly relied on
    the integration of information acquired by individual sensing devices strategically
    deployed across the smart city. The “smart” in the future city structure is defined
    by the collaborative use of data from these individual sensing units to make complicated
    decisions and provide seamless services to inhabitants [16]. Even in circumstances
    where devices are mobile, wireless technologies must be employed as physical links
    to enable the collective use of data from these devices to communicate data [17].


    The internet allows mobile technology such as computers, smartphones, and other
    electronic devices all over the world to interface with one another, allowing
    for instant information transfer [18]. However, with IoT, the internet may not
    be the only communication channel; instead, an application may consist of a local
    network of sensing units that can exchange data and send data to a central node
    through a multi-hop communication protocol (or a hub or a gateway).


    # 12.6.2 Network Topologies


    In Smart City initiatives, three basic IoT network topologies are widely employed.
    These include point to point, star, and mesh topologies, as well as other non-IoT
    topologies like trees. Devices are connected in a point-to-point way in a point-to-point
    topology. If two nodes desire to share data, the data must hop and pass via each
    node in the network between them. This topology isn''t the best choice because
    it has a low fault resilience rating, and packet delivery suffers when any of
    the intermediate nodes fail. However, under a Star architecture, data is exchanged
    to a central node rather than each node transmitting data to the cloud independently.
    The Mesh network topology enables all devices to communicate with one another.
    It has a wider range since data sent to a specific node might travel numerous
    hops over the network. This improves the packet delivery as alternate paths can
    be used in case of a faulty network.'
