  md: 'layer. The number of hidden layers and neurons is a crucial design factor for
    ANNs since it affects the network’s ability to learn [22].


    Regardless of the fact that ANNs have been effectively employed for many years,
    technological advancements are forcing ANNs to perform at higher and higher levels
    due to the growing number of datasets. Deep neural networks (DNNs), models based
    on deep learning, may now be used to tackle these performance problems since they
    have the speed and accuracy to handle massive amounts of data in parallel using
    graphic processing units. A network is often referred to as a DNN when it includes
    two to ten hidden layers [Figure 8.3] and is capable of learning complicated functions
    more quickly than the conventional ANNs (also called shallow neural networks)
    [23]. Sigmoid activation functions have historically been utilised by DNNs; however,
    when hidden layers are added, the network starts to perform worse and converge
    more slowly. As a result, a unique DNN architecture known as deep rectifier neural
    networks was created, which replaced the sigmoid activation functions along with
    rectifier linear functions.


    # 8.2.3 Convolutional Neural Networks


    The weight matrices of a convolutional neural network (CNN), a particular type
