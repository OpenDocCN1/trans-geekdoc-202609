    Executives need qualitative forecasting to aid in decision-making for the business.
    Making decisions about how much inventory to keep on hand, whether to hire new
    employees, and how to modify a company’s sales procedures can all be informed
    by qualitative forecasting. Qualitative forecasting is also essential for creating
    initiatives like marketing campaigns because it can identify the aspects of a
    company’s service that should be highlighted in advertisements. Some benefits
    of qualitative forecasting include the ability to predict future trends and phenomena
    in business and the usage of knowledge from experts in a company’s industry. The
    ability to use sources other than numerical data is one of the benefits as well.


    # 10.2.1.1 Industries That Use Qualitative Forecasting


    +   1. Sales: Companies in sales can use qualitative forecasting to assist them
    in making decisions about how much of a product to manufacture and when to order
    extra inventory.

