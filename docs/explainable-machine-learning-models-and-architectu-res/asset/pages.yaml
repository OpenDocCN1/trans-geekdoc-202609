  md: '# 12.6.3 Network Architectures


    The structure of the network deployed for a particular application is known as
    network architecture. As mentioned in previous sections, IoT devices do not always
    need to be linked to the internet; instead, distributed connection architectures
    can be used, with only one device collecting and sending data to the cloud. In
    such instances, the arrangement of the devices is crucial. The three major types
    of network architectures deployed for IoT-based smart cities are as follows.


    # 12.6.3.1 Home Area Networks (HANs)


    These are short-range networks that often entail data transfer to a single central
    node that collects and sends data to the cloud. These networks use low-power communication
    protocols including Zigbee, Bluetooth, and Wi-Fi.


    # 12.6.3.2 Field/Neighborhood Area Networks (FANs/NANs)


    Field Area Networks (FANs) have a longer communication range than HANs and are
    used to connect a consumer to a utility provider (for example, in a smart grid).


    # 12.6.3.3 Wide Area Networks (WANs)


    Wide Area Networks (WANs) are network topologies that allow people to communicate
    across great distances. These networks are not as dense as HANs or FANs, and they
    rely on cellular services, physical connections like fiber optics, and a set of
    low-power protocols developed specifically for WANs. WANs are used in a variety
    of Smart City applications, including Smart Grids because they connect various
    substations.


    # 12.6.3.4 Network Protocols


    The application determines the network type, and the communication protocol employed
    in a smart city application must provide the desired Quality of services (QoS).
    Different networking protocols in the IoT can be used in a variety of applications,
    depending on their characteristics.


    All parts of our lives are being digitized thanks to the Internet of Things. This
    digitization process is linked to the addition of enhanced sensing nodes in every
    domain of smart infrastructure in smart cities. Not only'
