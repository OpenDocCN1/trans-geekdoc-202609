- pgno: 52
  md: 'Multiplexer (PSM) [5]. Advanced FPGA has about 1,100 input output blocks and
    3,30,000 logic blocks.


    The CLB referred to is the composition of i) Logic Block, ii) Interconnect, iii)
    Input-output blocks.


    **Logic Block:** The programmable logic block is responsible for providing digital
    systems with the fundamental elements necessary for computation and storage. A
    fundamental logic element includes programmable logic, a flip-flop, and fast carry
    logic [5], to reduce the amount of space and the time it takes to process information.


    Modern FPGAs are comprised of a variety of distinct blocks, such as memory blocks
    and multiplexers. Memory used for configuration is utilized across all logic blocks,
    to regulate the function of each individual element.


    **Interconnect:** To finish off a user-defined design unit, the programmable routing
    creates a connection between “logic blocks and input/output blocks” [5], so that
    they can communicate with one another.


    **Input-Output Blocks:** The input-output blocks serve as a programmable interface
    between the routing architecture and the logic blocks, allowing these two layers
    to communicate with components, which are external to the system.


    Recent advances in hybrid devices facilitates extensible processing features in
    reconfigurable device technology, where FPGA is housed with an embedded core through
    an AXI bus interface. This hybrid platform design leads to achieve low-latency
    communication between user logic in the FPGA, with low power concentric workloads
    on the CPU, by putting the FPGA and CPU on the same chip. By combining measurements
    from many sensor systems, it is possible to circumvent the issues that exist when
    employing stand-alone systems. The idea of implementing the FPGA, along with CPU
    and its functionalities, will be discussed in the next section.


    # 3.1.6 Reconfigurable Architectures


    Gerald Estrin proposed the idea of building a computer with a conventional CPU.
    The reconfigurable hardware triggers the idea of developing a reconfigurable computing.
    The main processor acts equivalent to that of a reconfigurable hardware. The hardware
    intends to perform another task, once the prior task got completed. This approach
    initiates the base for developing a hybrid computer architecture that combines
    speed of hardware and flexibility of software [6]. Field-programmable gate arrays
    (FPGAs) are reconfigurable devices with several computational units,'
  merge: -1
  img_proc: true
- pgno: 53
  md: whose functioning is controlled by a cluster of programmable configuration bits.
    The spatial orientation of the device changes relative to time and application,
    to apply the best computing strategy, to speed up a particular or specific application.
    The device structure will be reoriented once again, to accommodate a new application
    in a sequential manner. The structure of reconfigurable devices can be modified
    by changing the entire hardware or a part of the hardware at the time of compilation.
    Downloading a logic in the modified device structure provides flexibility that
    functions in contrast with Von Neumann computers, which consist of a set of instructions
    to be carried out sequentially during run time. The program should be adaptable
    to the hardware, to perform in association with the flexibility of the reconfigurable
    systems. This makes the system perform better, for any application, which are
    adaptive to a reconfigurable environment. In short, General-Purpose Computers
    are well known for their performance and Application Specific Integrated Circuits
    (ASIC) for their flexibility; the performance and flexibility are the two important
    aspects for any reconfigurable structure. Reconfigurable computing bridges the
    performance leverage between hardware and software by intending an excellent flexibility
    than hardware, while potentially attaining higher efficiency than software [4].
    Designing a single device with both the GPC's flexibility and the ASIC's performance
    is preferable and possible through the reconfiguration approach. ASIC implementation
    strategy often results in a quicker, more compact, and lower power design than
    an FPGA implementation. However, the demand for hybrid (ASIC-FPGA) devices is
    being driven by the rising market demands for design flexibility. To accommodate
    numerous design alternatives with a single mask set, designers must combine ASIC
    circuits having high density with intrinsic flexibility of FPGA circuits [4].
    To shorten design time and promote standardization, it is possible to construct
    a “base design” that may be used by succeeding devices in repetition with remarkable
    modifications. Since most consumer and workplace goods come in a variety of low-
    to high-end configurations, it is possible to use this underlying design approach,
    by adding new features to each model. This idea can be used in a variety of devices,
    such as computers, printers, fax machines, and scanning equipment. FPGA’s multiply,
    accumulate and processing capability enables the collaboration with DSP applications.
    When designing a DSP system, parallel structures and arithmetic algorithms can
    be used to maximize efficiency and outperform single or multipurpose DSP devices.
    By combining the capabilities of ASICs and FPGAs in a single design, it is possible
    to improve the performance of a system in ways that are not possible with just
