  md: '# # Applications of Artificial Neural Networks in Optical Performance Monitoring


    Isra Imtiyaz¹, Anuranjana¹*, Samukh Kaur² and Anubhav Gautam²


    ¹Department of Information Technology, ASET, Amity University Uttar Pradesh, Noida,
    India ²Department of Electronics & Communication Engineering, ASET, Amity University
    Uttar Pradesh, Noida, India


    # ## Abstract


    The calculation and collection of numerous physical properties of transmitted
    signals and different optical network components is known as optical performance
    monitoring (OPM). Interest in OPM has increased as a result of advancements in
    optical networking, particularly with regard to signal quality metrics including
    optical signal-to-noise ratio (SNR), Q-factor, and dispersion. This paper reviews
    OPM algorithms and their advantages and disadvantages. It also reviews artificial
    intelligence (AI) methods in optical networks, and applications of AI in optical
    networking, optical impairments, and component faults.


    **Keywords:** ANN, optical performance monitoring, LSTM, optical impairments


    # ## 8.1 Introduction


    Optical communication is long-distance communication that uses light to transport
    information. It can be done visually or using electronic instruments. Optical
    wireless communication (OWC) is a type of optical communication wherein unguided
    infrared (IR), visible, or ultraviolet (UV) light is used to transmit a signal.
    It is mostly used for short-distance communication. Visible light communication
    (VLC) has been recognised as a possible indoor high-speed wireless solution for
    short-distance access as a'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'form of OWC integrating communication with illumination [1]. Free space optical
    communication (FSO) is another type of optical communication technology which
    uses free-space light propagation to wirelessly transport data via computer networking
    or telecommunications. Some merits of FSO are that free space optics is a versatile
    network that provides faster speeds than broadband and requires a small initial
    expenditure. High data rates comparable to optical fibre cable data rates can
    be attained, yet error rates are very low, and the incredibly narrow laser beam
    allows for an endless number of FSO lines to be established in a specific region.
    But along with this, there are some limitations too, for example, when flying
    birds, trees, and tall structures arrive in the line of sight (LOS) of the FSO
    system''s broadcast, they can momentarily block a single beam. Also, temperature
    differences between air packets would occur as a result of heat rising from earth
    and man-made drivers such as heating ducts. Temperature differences can create
    amplitude fluctuations in the signal, resulting in “picture dance” at the FSO
    receiving end [2].


    OPM is the assessment and acquisition of numerous physical properties of transmitted
    signals and optical network components. OPM features are critical to ensuring
    a stable network operation and play an important role in providing flexibility
    and improving overall network efficiency. OPM is key to ensure the reliability
    of optical networks and it comprises three levels as shown in Figure 8.1 [3].
    The determination of the optical domain parameters necessary for transport and
    channel management at the WDM layer constitutes the first layer, known as the
    transport or WDM channel management layer monitoring. Examples of real-time measurements
    at the transport layer include those of channel existence, wavelength registration,
    power levels, and spectral optical sound to noise ratio (OSNR). The monitoring
    of the optical signal or channel quality layer, which locks onto a single wavelength
    and conducts tests that are sensitive to signal transitions, is the second level.
    The analogue eye and eye statistics, the Q-factor, the electronic SNR, and damage
    that arises inside the eye as a result of dispersion


    ![](img/d2107fc60629942e7da5355e47fcc33d_141_0.png)


    Figure 8.1 Different layers in OPM.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'and nonlinear effects are examples of aspects that may be evaluated in the
    signal quality layer. Monitoring data protocol information and protocol performance
    constitute the third level of OPM named PPM. This involves the use of digital
    measurements to deduce characteristics of the analogue optical signal, such as
    the BER [4].


    When other transmission distortions, including chromatic dispersion (CD) and polarisation
    mode dispersion (PMD), are adjusted in digital coherent optical receivers, OSNR
    is the metric that has the greatest impact on bit error rate (BER) [5]. Based
    on linear interpolation of either the noise level as from spectral gaps amongst
    signals, the conventional OSNR monitoring technique employed optical spectrum
    analysers (OSA). However, due to the low resolution of conventional diffraction-grating
    based OSAs, the spectral gap in ultra-dense wavelength division multiplexing (UDWDM)
    or super channel transmission systems is blurred or even non-existent (about 0.02
    nm) [6].


    Additionally, the ASE noise at the spectral gap may be significantly suppressed
    due to the cascaded filtering effect (CFE) caused by the optical filtering components
    contained in the optical nodes, such like optical add-drop multiplexers (OADM)
    but rather wavelength selective switches (WSS), rendering the interpolation-based
    method ineffective [7].


    Optical networks will be extremely vulnerable to damaging and data-degraded fibre-based
    impairments as system capacity rises. Due to the wide spectrum of high-rate signals,
    some of the most significant impairments are CD, PMD, and OSNR. In order to sustain
    system performance, the network’s capacity to determine the severity of the limitations
    is crucial. OPM can be accomplished out through monitoring data changes and identifying
    “real-time” changes brought on by different impairments, so that a change in one
    impact would alter a measured parameter [8]. This can use electrical post-processing
    procedures in the specific situation of coherent detection [9] or optical techniques
    to monitor the changes inside a radio frequency (RF) tone power or in the spectral
    channel power distribution [10].


    Interest in OPM has increased as a result of advancements in optical networking,
    particularly with regard to signal quality metrics like OSNR, Q-factor, and dispersion.
    These sophisticated monitoring techniques may allow fault management and quality-of-service
    (QoS) monitoring to be expanded into the optical domain [11]. Table 8.1 lists
    different algorithms employed for optical performance estimation and monitoring
    along with their advantages and disadvantages.


    In [3], the authors say that the need for optical network capacity has been rising
    substantially as a result of the development of 5G technology, high-definition
    video, and the internet of things. Low-margin optical'
