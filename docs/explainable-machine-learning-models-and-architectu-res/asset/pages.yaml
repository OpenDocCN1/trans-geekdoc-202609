    # 10.3.2 Ridge Regression


    The model-tuning technique called as ridge regression can be used to evaluate
    any data that displays multi-collinearity. This method performs L2 regularization.
    When the issue of multi-collinearity emerges, least-squares are unbiased, and
    fluctuations are considerable, predicted values diverge significantly from actual
    values (Figure 10.4).


    In ridge regression, the means of the variables—both dependent and independent—are
    subtracted, and their standard deviations are divided. Since we need a means to
    indicate whether the variables in a particular formula are standardised or not,
    this is a challenge for notation. In terms of standardisation, all ridge regression
    calculations are based on standardised variables. Before being shown, the computed
    regression coefficients are scaled back to their initial value [8].


