    hybrid designer without programmable base is forced to choose FCI (Forced Carry
    Input) logic at the chip level, which changes from time to time. The programmers
    usually bypass the design requirements, finalization strategy that potentially
    delay the release of the finished device. ASIC and programmable logic can work
    together on a single device to satisfy circumstances. In addition to other challenges
