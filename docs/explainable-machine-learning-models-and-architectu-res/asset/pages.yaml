    # 4.6 Conclusion


    Reconfigurable architectures like FPGA can be used for the implementation of machine
    learning model to observe a real-time response with improvement in accuracy, speed
    and power consumption. This process of implementation is followed by identifying
    the suitable machine learning algorithm for any specific task and implementing
    it through HDL code, synthesis and bitstream generation using simulation software
    like Xilinx Vivado. The generated bitstream is used to implement the same on FPGA
    board or prototyping before proceeding to the layout and fabrication of ASIC.


