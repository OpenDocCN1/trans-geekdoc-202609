    # 7.3 CNN Architecture


    Convolutional neural networks (CNN/ConvNet) consists of three different words
    which describe the functioning of the Deep Learning–based model. The three words
    are Convolution, Neuron, and Network. Convolution is the operation between two
    functions and it produces a third function which describes the relation between
    the two original functions. Here, one of the original functions is input data
    and the other is the parameters which change with each training figures to get
    the desired output. A convolution is fundamentally sliding a filter over the input
    image data. In machine learning a neuron is the basic building block of a model
    that calculates a weighted average of its inputs with necessary biases and at
    last adds non-linearity to the result. In data communication, we pass data through
    many layers of routers, access points, or hubs, thus forming a network. Hence,
    here we pass input data and its modifications through many layers; thus the model
    is called a network. CNN accepts an image’s data as input. Taking an image directly
    as input saves several variables and confusions in the model. The model does dot
    product between inputs and filter matrix basically of small size sliding all over
    the image. The output at the end of the network however is given with a percentage
    value for each possibility.


    Basic neural network (BNN) takes a single vector input. It consists of many hidden
    layers and like CNN, these layers further consist of many neurons. Layer wise
    study shows that every neuron of the next layer is linked to the neurons of the
    previous layer. At the end, a fully connected (FC) layer is attached to all previous
    layer neurons and produces an output in the form of percentage values. A basic
    neural network structure is presented in Figure 7.1.


    A BNN takes single vectors as inputs so a 2D image cannot fit in such a model.
    Colored image is 3D and third dimension of basic colors red, green, blue (RGB)
    make colored images real. In general, a Canadian Institute for Advanced Research
    (CIFAR-10) image is used in CNN. A CIFAR-10 image has a dimension of 32 × 32 ×
    3 (i.e., 32 pixels each side and 3 shades). Also, if we consider making a 3D vector
    into a single vector, the size of the vector for a CIFAR image will be 32 × 32
    × 3 = 3072 parts along with a number of parameters for reconverting the vector
    back to a 3D matrix. For an image of size 256 × 256 × 3 the number climbs up to
    196,608 for the first layer.'
