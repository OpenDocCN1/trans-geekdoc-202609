  md: '# 7.7 Future Research Directions


    ICT along with cloud computing techniques ensures a robust scheme for machine
    learning (ML) and deep learning (DL) skills. Recently researchers investigated
    the 5G system as a candidate to offer groundwork for intelligent wireless networks
    to deal with congregated claims. ML-centered signal processing algorithms can
    pave the way to the progress of future intelligent wireless networks (B5G). DL
    typically comprises two phases, viz. training and testing. In practical application
    of real communications systems only the testing phase is useful. The training
    phase is customarily finished offline. A trained DL model can thus accomplish
    many objectives lacking the requirement for retraining. In this regard, we can
    use the proposed CNN algorithm with some modifications.


    The implementation of CNN in Automatic modulation classification (AMC) has revealed
    hopeful accuracy. AMC is the method of categorizing the modulation pattern of
    a signal and is an essential method of non-cooperative communication. By using
    time-frequency channeled input to CNN, an enhancement of feature dimension will
    occur for CNN input. Henceforth the lost info like phase or frequency deviation
    can be simply caught in energy variation of time-frequency map. Hence the CNN
    method proposed here can be applied in AMC for enhancing the classification capability.


