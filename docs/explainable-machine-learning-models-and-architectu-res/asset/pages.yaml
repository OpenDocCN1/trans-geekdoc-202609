    # ## 11.5 Research Summary


    The wind energy potential assessments evaluated using ten wind distribution methods
    along with Bimodal influence factors and MFO Machine Learning Optimization methods
    in the wind prone locations of onshore, offshore and nearshore with different
    landscape are summarized and shown in Table 11.25.


    The application of Moth Flame Optimization in wind resource assessment for estimating
    the parameters is explored with multiple wind distributions and their behavior
    on different landscapes under bimodality influences. In India, Tamil Nadu and
    Gujarat stand top on wind energy generation. The major hurdle is the Low voltage
    ride through (LVRT) issue [32], because the power generating plants should not
    get disconnected from the grid and must continue to operate through short periods
    of low grid voltage. Wind Power Generating farms connected above 66 kV need to
    stay connected in the grid as per Indian Electricity Grid Code (IEGC). The power
    generating plants act as a fault recovery by generating reactive power compensation
    to support the grid during system faults. Some of the old wind turbines with stall
    regulation type, the provision of putting add on LVRT is technically not possible.
    It is noted that about 11,510 such turbines were installed till April 2014 in
    India which have to be replaced with new wind turbines to make smooth grid operation.
    The Active Network Management describes the control systems that manage generation
    and load for specific purposes to implement in India to control the wind turbines
    during high grid frequency. But SCADA integration and network communication have
    to be strengthened. During a higher rate of renewable energy injecting in the
    grid, the control of renewable energy [34–36] should be adopted to maintain the
    grid by modernizing network and information technology systems.


    The field data measurements, history of data available in the archive, and satellite
    data are the basic data analytics sources for wind resource assessment. However,
    raising standards of data quality through big data [33] analytics will help to
    make the wind and solar resource assessment with high accuracy.'
