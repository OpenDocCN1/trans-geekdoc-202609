- pgno: 195
  md: 'The main difference between flames and moths is the way they are treated and
    updated in every iteration. The moths act as a search agents moving around the
    search space, while flames are the best position of corresponding moths obtained
    by the current iteration. The equation for getting best optimal value is given
    as


    Mi = S(M_p, F_j)


    Where Fj indicates the j-th flame, M_i indicates the i-th moth and S is the spiral
    function. The spiral function of the moth is represented as


    S(M_i, F_j) = D_i \cdot e^{bt} \cdot \cos(2\pi t) + F_j


    Where b is a constant for defining the shape of the logarithmic spiral, D_i indicates
    the distance of the i-th moth for the j-th flame and t is a random number. D_i
    is calculated as follows,


    SD_i = |F_j - M_i|


    When the position of a moth gets changed, the moth can converge or exploit in
    the given search space by changing the value ‘t’. A mechanism to solve the number
    of flames during each iteration is as follows,


    flame no = round\left( N - l * \frac{N - 1}{T} \right)


    Where l is the number of current iterations, N is the maximum number of flames
    and T is the maximum number of iterations. The objective function considered for
    minimization of estimated Bimodal Weibull distribution parameters by MFO and observed
    actual wind speed distribution is derived as


    \xi^2 = \sum (fest - fo)^2'
