  md: '# 4.3 Audio Processing Module Using Machine Learning


    Reconfigurable FPGA board is useful in implementing and prototyping different
    design modules for any kind of signal processing. Here, all the algorithms are
    implemented through programming in Verilog HDL or VHDL using Xilinx Vivado. Through
    HDL, we can generate RTL level design block, synthesise and generate a bitstream
    for implementation on FPGA.


    A basic model of audio signal processing is shown through the block diagram in
    Figure 4.1. The proposed model consists of three major parts/ blocks which help
    the device to transfer the data/instruction and decides


