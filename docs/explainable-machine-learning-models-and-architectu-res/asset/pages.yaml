    # ## 11.4.2 Wind Distribution Fitting


    For estimating the wind energy potential to extract wind power meritoriously,
    accurate wind distribution modeling is essential. The performance of targeted
    location wind potential assessment hinges on the selection of the PDF to picture
    the computed wind speed behavior plotted in the frequency distribution.


    The collected wind speed data is to fit into ten numbers of wind distribution.
    These are Weibull, Rayleigh, Birnbaum Sandras (BS), Gamma (GM), Inverse-Gaussian
    (IG), Rician (RI), Log-Normal (LN), Nakagami (NK), Generalized Ext. Value (GEV)
    and Bimodal Weibull-Weibull (BM) distribution methods. The bimodal-WW method is
    adopted because the visual traces of probability distribution function have similarity
    on Bimodal with two peaks. The bimodal nature is predicted by numerical calculations
    of mean and standard deviation [29, 30]. The goodness of fit and best-fitted wind
    distribution is ascertained with RMSE and R² methods by comparing actual measured
    data with individual wind distribution methods through probability density functions.
    In this work, three methods, namely the Maximum Likelihood (ML), Expectation-Maximization
    algorithm (EM) for the Bimodal-Weibull-Weibull method, and the Moth Flame Optimization
    (MFO) for Bimodal-Weibull-Weibull Methods are used to estimate the parameters
    of wind speed distributions. The EM method consists of two steps, namely Expectation-step
    (E-step) and the Maximization-step (M-step). The E-step computes the conditional
    expectation and the M-step maximizes the expectation. The parameters of the bimodal
    and multimodal distribution are estimated by an iterative procedure until convergence
    is reached. Also, the Bimodal (Weibull-Weibull) parameters shown in Table 11.2
    and Figure 11.4 are estimated through MFO with objective function by minimizing
    the error between Estimated and Observed Probability Density Function (PDF).


    The distribution of wind speed data, also known as wind frequency distribution,
    is presented by histogram plots which is a usual method of'
