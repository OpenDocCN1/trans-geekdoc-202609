    Likewise, other cities have experimented with IoT to solve their respective issues
    in their manner. This section shall provide detailed information on the same.


    At the outset, it is essential to state that from the government side, there has
    been a determined push to create 100 smart cities (from 2015) with an investment
    of up to Rs. 70 billion and the objective of creating them [19–23].


    One of the important characteristics is the use of smart solutions to improve
    infrastructure and services in area-based development [20]. In addition, the Government
    of India’s Ministry of Electronics and Information Technology (MEiTY) has released
    an IoT Policy Document (2016) that details the government’s perspective on this
    new era of technology. It states that the key to the Internet of Things’ success
    will be the creation of open platforms for simplicity of use and low cost, the
    development of scalable models, and the utilization of citizens as sensors. It
