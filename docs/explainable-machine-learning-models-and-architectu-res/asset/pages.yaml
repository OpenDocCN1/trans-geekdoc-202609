  md: '# Hessian Matrix


    A square matrix of second-order partial derivatives of a scalar-valued function,
    or scalar field, is known as the Hessian matrix or Hessian. It describes a function
    with many variables'' local curvature. It’s a refined way to package all the information
    of the second derivatives of a function.


    **Hessian matrix-based interest points**: Surf utilizes the Hessian matrix due
    to its efficiency and precision in computing. Surf depends on the determinant
    of the Hessian matrix to choose the scale and position rather than employing a
    separate measure (Hessian-Laplace detector). The Hessian of a given pixel looks
    something like this:


    ```

    H = \begin{bmatrix} \frac{\partial^2 f}{\partial x^2} & \frac{\partial^2 f}{\partial
    x \partial y} \\ \frac{\partial^2 f}{\partial y \partial x} & \frac{\partial^2
    f}{\partial y^2} \end{bmatrix} (2.6)

    ```


    For adapting to any scale, we filtered the image by a Gaussian kernel, so given
    a point X = (x, y), the Hessian matrix H(x, σ) in x at scale σ is defined as:


    ```

    H(x, σ) = \begin{bmatrix} L_{xx}(x, σ) & L_{xy}(x, σ) \\ L_{xy}(x, σ) & L_{yy}(x,
    σ) \end{bmatrix} (2.7)

    ```


    where Lxx(x_ ) is the convolution of the Gaussian second order derivative with
    the image I at position x, and Lxy (x_ ) and Lyy (x_ ) follow suit. Although Gaussians
    are the best choice for scale-space analysis, they must be discretized and cropped.


    First, convolution with a Gaussian kernel must be used to determine the Hessian
    matrix''s determinant, and then the second-order derivative. Following Lowe’s
    success with DoG approximations (SIFT), SURF uses box filters to enhance the approximation
    (both convolution and second-order derivative). Due in part to the fact that these
    approximative second-order Gaussian derivatives can be calculated using integral
    pictures regardless of size at a very cheap computational cost, SURF is fast.'
  merge: -1
  img_proc: true
