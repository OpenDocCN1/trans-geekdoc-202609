- pgno: 194
  md: 'orientation is the main inspiration of MFO algorithm. During the night, moths
    navigate by maintaining a fixed angle to the moon. This mechanism for traveling
    long distances occurs in a straight line. MFO is a promising metaheuristic algorithm
    and is applied in various optimization problems in a wide range of fields, such
    as medical applications, image processing, engineering design, power and energy
    systems, and economic dispatch.


    The MFO working methodology is based on the individuals/set of moths (M) called
    population and flame (F). The best position of moths in the moth-flame combination
    contains one flame per moth. During each iteration, the flame will get updated
    on any better solution found. The matrix OM has the corresponding fitness (objective)
    value, which can be represented as follows:


    ```

    \(

    M = \begin{bmatrix}

    m_{11} & m_{12} & \cdots & m_{1d} \\

    m_{21} & m_{22} & \cdots & m_{2d} \\

    \vdots & \vdots & \vdots & \vdots \\

    m_{n1} & m_{n2} & \cdots & m_{nd}

    \end{bmatrix}

    \) (11.5)

    ```


    ```

    \(\text{and } OM = \begin{bmatrix}

    I(m_{11}, m_{12}, \cdots, m_{1d}) \\

    I(m_{21}, m_{22}, \cdots, m_{2d}) \\

    \vdots \\

    I(m_{n1}, m_{n2}, \cdots, m_{nd})

    \end{bmatrix} = \begin{bmatrix}

    OM_1 \\

    OM_2 \\

    \vdots \\

    OM_n

    \end{bmatrix}\)

    ```


    Where I is the objective function, n is the number of moths and d is the number
    of variables. Each moth flies around its corresponding flame. Therefore, the moths
    matrix and flames matrix is the same size. The matrix F, set of flames, while
    the matrix OF represents the corresponding fitness value and can be expressed
    as follows.


    ```

    \(

    F = \begin{bmatrix}

    F_{11} & F_{12} & \cdots & F_{1d} \\

    F_{21} & F_{22} & \cdots & F_{2d} \\

    \vdots & \vdots & \vdots & \vdots \\

    F_{n1} & F_{n2} & \cdots & F_{nd}

    \end{bmatrix}

    \text{ and } OF = \begin{bmatrix}

    I(F_{11}, F_{12}, \cdots, F_{1d}) \\

    I(F_{21}, F_{22}, \cdots, F_{2d}) \\

    \vdots \\

    I(F_{n1}, F_{n2}, \cdots, F_{nd})

    \end{bmatrix} = \begin{bmatrix}

    OF_1 \\

    OF_2 \\

    \vdots \\

    OF_n

    \end{bmatrix}

    \) (11.6)

    ```'
