    # 1.1.5 K-Means Clustering


    It is one of the clustering techniques in unsupervised learning algorithm. It
    classifies number of clusters from given dataset; and for each cluster, k centers
    are defined [9] as shown in Figure 1.5. This k centers are placed in a calculated
    way due to various locations which cause different results. Hence the better way
    is to place each cluster away from the others.


    # 1.1.6 Principal Component Analysis


    It is used to convert a set of observation of correlated variables to linearly
