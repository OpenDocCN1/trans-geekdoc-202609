- pgno: 48
  md: '# Efficient Architectures and Trade-Offs for FPGA-Based Real-Time Systems


    L.M.I. Leo Joseph*, J. Ajayan, Sandip Bhattacharya and Sreedhar Kollem


    Department of Electronics and Communication Engineering, School of Engineering,

    SR University, Warangal, Telangana, India


    # Abstract


    Real-time monitoring gives accurate timely information, crucial for any pro-

    duction enhancement and decision-making. The most recent technology for

    field-programmable gate arrays (FPGA) has blurred the gap between hardware

    and software. By combining measurements from many sensor systems, it is pos-

    sible to circumvent issues which exist when employing stand-alone systems. This

    chapter emphasizes the significance of design strategies and algorithm devel-

    opment from several vantage points, as well as their implementation in diverse

    real-time systems, employing reconfigurable and hybrid approaches. Employing a

    configurable soft-core processor, on an FPGA will give the adaptability necessary

    for interfacing with a variety of sensors.


    Keywords: FPGA, real-time systems, hybrid architectures, hardware

    acceleration, SVM, CNN, Zynq, Pynq


    # 3.1 Overview of FPGA-Based Real-Time System


    The system whose response seems accurate in a defined time or real time is

    a real-time system [1]. Flight control mechanisms and real-time monitors

    are two examples of real-time systems. Real-time systems find applications

    in different forms pertaining to different application. Real-time systems are

    classified into two types based on the timing constraints: i) Hard real-time

    system ii) Soft real-time system.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '**Hard real-time system:** Hard real-time system performs tasks as expected
    without any missing deadline [2]. If the performance of the system deviates and
    violates the deadline, then the entire process suffers with tardiness. Tardiness
    is a measure of deviation of the system from its expected deadline. Tardiness
    decreases the overall efficiency of the system abruptly. Flight controllers can
    be modelled under the category of Hard real-time system.


    **Soft real-time system:** Soft real-time system performs tasks with the exception
    that it may miss the deadline for certain tasks [2]. If the performance of the
    system deviates and violates the deadline, then there will be no serious effects,
    except in rare cases. The system effectiveness is in inverse proportion with tardiness.
    Tardiness decreases the overall efficiency of the system abruptly. Crossover networks
    and multiplexing switches are examples of soft real-time systems.


    # ## 3.1.1 Key Elements of Real-Time System


    There are three key elements necessary for the operation of real-time systems:


    i) Work model, ii) Resource Model, iii) Algorithms.


    The necessity of the elements is listed below:


    +   a) Work model explores the system and its application.

    +   b) Resource model highlights the available resources for any system development
    for an application.

    +   c) Algorithms reveals the usage of resources for an application.


    # ## 3.1.2 Real-Time System and its Computation


    Real-time system comprises Real-time clocks to maintain and track the current
    time, which ensures the completion of a task within a deadline. A reference model
    architecture along with a real-time Programming Language specifies tasks, which
    must be completed within a specific time. The revolution in IC technology with
    add-ons as FPGA, Microcontrollers and processors ascertains the possibility of
    Real-time digital emulation [3]. CPU-based computing bases are imposed with sequential
    design, which limits the extension of these platforms in the real-time environments.
    In this aspect a flexible computing platform is essential that handshakes the
    CPU-based platforms with real-time systems. The preceding point can be realized
    through a flexible reconfigurable digital computing platform'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'called a field-programmable gate array (FPGA). FPGA can be used as a base for
    the design, and computation of a low-power CMOS chips. These chips have a flexible
    programmable logic, which enables its usages in bench-top systems.


    # 3.1.3 FPGA Functionality and Applications


    Field Programmable Gate Arrays (FPGAs) comprise the grid of programmable interconnects,
    which establish connection among reconfigurable logic blocks (CLBs). FPGAs can
    be customized from the user end as per the user''s requirements and application
    needs. Application Specific Integrated Circuits (ASICs) are dedicated FPGAs made
    specifically for a specified design purpose that are non-customizable in nature
    [3]. (OTP) FPGAs (programmed once at a time) are design specific but it has limited
    outreach, in comparison with general purpose FPGA, due to its limitation and non-customizable
    nature.


    FPGAs provide an effective alteration for any type of design. In the same aspect
    ASIC also place a vital role in terms of competing technology. The two technologies
    ASIC and FPGAs are compared by means of information. The proposition between these
    two technologies should be considered before choosing either of them for the design
    purpose. In earlier days, FPGAs were used in design that required high operating
    speed, high design complexity, and higher volume designs. The advancement in the
    IC technologies enables the FPGA to offer better frequency in the range of MHz.


    # 3.1.4 FPGA Applications


    The previous section reveals that FPGAs seem preferable for the development of
    real-time applications. The programming approach of FPGAs acts as a challenging
    platform for many vendors like Xilinx and Altera to offer comprehensive solutions
    to many designs, which requires reconfigurable hardware, software and predefined
    IP cores, for utilizing third-party applications. The utilization of FPGAs in
    different domains are as summarized below:


    +   **Automotive** – The FPGA-based interior design of an automotive ensures driver
    safety and comfort, and inclusion of entertainment systems make the design commercially
    viable.


    +   **Consumer Electronics** – Common household electronics are tailored nowadays
    with embedded chips that find applications in the Digital Television displays,
    Wearable gadgets display, set-top boxes [3].'
