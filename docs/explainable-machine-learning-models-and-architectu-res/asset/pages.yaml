    for at least a 6% share of the worldwide IoT sector (IoT Policy Document, Government
    of India, 2016). Key areas that the policy noted for IoT’s applications were Smart
    water, smart environment, remote health monitoring, smart agriculture, smart waste
    management, smart safety, and smart supply chain and logistics are just a few
    examples of smart technologies. As is evident, it misses out on smart transport
    using IoT for which examples have been mentioned earlier in this paper. However,
    the policy goes on to illustrate all the right intentions from the government
    with plans to focus on R&D and capacity building with a five-pillar approach.
    Such an approach to changing the technological landscape is a welcome change.


    Against this backdrop, with an IoT policy in place, we look at the progress made
    in a few cities in India and the technology that has been utilized. Cities like
