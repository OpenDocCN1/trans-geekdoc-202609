  md: 'The three assumptions made by ridge regression are independence, linearity,
    and constant variance. Since ridge regression does not provide confidence intervals,
    it is not required to believe that the error distributions are normally distributed.


    # 10.3.3 Decision Tree


    Decision trees are used by artificial intelligence to draw conclusions based on
    the data available from prior judgments. These conclusions are also given values
    and utilised to predict the expected future course of action.


    Decision trees are quantitative, algorithmic models for ML that assess and discover
    answers to a range of problems and possible outcomes. Decision trees are therefore
    aware of the rules for making decisions in particular settings based on the information
    at hand. The learning process is ongoing and feedback-based. As a result, learning
    outcomes get better over time (Figure 10.5).


    # 10.3.3.1 Prediction of Continuous Variables


    Continuous variables can be predicted using one or more predictors. A continuous
    variable decision tree is the name of the decision tree model that is employed
    to represent such values. Different types of continuous decision trees address
    regression-type issues. In these circumstances a continuous, variable, and numerical
    output is predicted using labelled datasets.


