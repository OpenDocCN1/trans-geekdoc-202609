  md: '# IoT to Scale-Up Smart Infrastructure in Indian Cities: A New Paradigm


    Indu Bala1*, Simarpreet Kaur2, Lavpreet Kaur3 and Pavan Thimmajavjala4


    1SEEE, Lovely Professional University, Phagwara, Punjab, India

    2Baba Banda Singh Bahadar Engineering College, Fatehgarh Sahib, Punjab, India

    3Journalism and Mass Communication Department, Punjabi University, Patiala, India

    4Economic Policy Analyst, Nikore Associates, Hyderabad, India


    # **Abstract**


    This paper presents a perspective regarding IoT, detailing its fundamentals linking
    it to technological evolution and further dwells on the nitty-gritty of IoT and
    the principles that need to be followed along with the technicalities involved.
    It emphasises how IoT is being implemented in a few Indian cities, as part of
    the drive to make Indian cities “smart” with the creation of a smart infrastructure
    which adds in a big way to the overall push to create a Digital India. Finally,
    the paper lays out the concerns that emerge from the use of such technology, in
    general, highlighting both the technological and financial challenges involved.


    In this context, further research can be conducted at a more city-centric level
    to determine how individual cities are performing on the IoT front. In addition,
    it would be more interesting to see what business models Indian firms that are
    in the IoT business adopt, given the policy that has been outlined by MeITY on
    IoT. The importance of explainable AI-based multidisciplinary work to improve
    the scalability of various types of IoT services and their economic viability
    is discussed while reviewing the economic impact of the adoption of IoT at the
    city and state level using various econometric techniques.


    **Keywords:** Internet of Things, smart city, network architecture challenges,
    protocols


    *Corresponding author: i.rana80@gmail.com'
  merge: -1
  img_proc: true
