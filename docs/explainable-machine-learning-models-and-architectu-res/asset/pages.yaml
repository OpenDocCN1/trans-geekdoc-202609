- pgno: 14
  md: '# Preface


    Machine learning and deep learning modules are now an integral part of many smart
    and automated systems where signal processing is performed at different levels.
    Signal processing in the form of text, image or video needs large data computational
    operations at the desired data rate and accuracy. Large data requires more use
    of integrated circuit (IC) area with embedded bulk memories that further lead
    to more IC area. Trade-offs between power consumption, delay and IC area are always
    a concern of designers and researchers. New hardware architectures and accelerators
    are needed to explore with efficient machine learning models. Many real-time applications
    like processing of biomedical data in healthcare, smart transportation, satellite
    image analysis, and IoT-enabled systems still have a lot of scope for improvements
    in terms of accuracy, speed, computational powers and overall power consumption.
    The current proposal deals with the efficient machine and deep learning models
    that support high-speed processors with reconfigurable architectures like graphic
    processing units (GPUs) and Field programmable gate arrays (FPGAs) or any hybrid
    system.


    This book will cover the hardware architecture implementation of the machine algorithm.
    The software implementation approach and efficient hardware of the machine learning
    application with FPGA will be the distinctive feature of the book. Security in
    biomedical signal processing will also be a key focus.'
  merge: -1
  img_proc: true
