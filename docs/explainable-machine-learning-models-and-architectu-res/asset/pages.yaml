  md: '# ### 8.2.4 Support Vector Regression (SVR)


    SVMs, or support vector machines, are widely used to solve classification issues.
    However, there is little evidence supporting the use of SVMs in regression. Support
    Vector Regression is the name for these models (SVR). With SVR, we have the freedom
    to specify the level of error that we will tolerate in our model, and it will
    locate the best line (or hyperplane, in higher dimensions) that fits the data
    [16].


    # ### 8.2.5 Support Vector Machine (SVM)


    A popular discriminant method due to the statistical learning theory is the support
    vector machine (SVM) [27]. Its potent capacity to generalise to unknown data is
    one of its key advantages. The empirical risk minimization principle is used extensively
    in conventional methodologies to ensure that training-related errors are kept
    to a minimum [28]. SVM is based on the idea of structural risk reduction, which,
    in contrast to traditional methods, aims to reduce the upper bound of the promotion
    error in order to achieve an optimal network structure by achieving a balance
    between both the complexity of the model and the complexity of something like
    the training error [29].


    # ### 8.2.6 Kernel Ridge Regression (KRR)


    Ridge regression as well as classification are combined with the kernel trick
    in kernel ridge regression (KRR). In the space created by the relevant kernel
    and the data, it subsequently learns a linear function. This correlates directly
    to a non-linear method in the original space for non-linear kernels. The model
    developed by Kernel Ridge has the exact same structure as SVR. KRR employs squared
    error loss while SVR uses E-insensitive loss; both are paired with l2 regularisation.
    The loss functions, however, are different. In contrast to SVR, fitting Kernel
    Ridge is often quicker for medium-sized datasets and can be done in closed-form.
    As opposed to SVR, which adopts a sparse model for E>0 at prediction time, the
    acquired model is non-sparse and so as a result slower [30].


    # ### 8.2.7 Long Short-Term Memory (LSTM)


    In 1997, Hochreiter and Schmidhuber created the Long Short-Term Memory (LSTM),
    which consists of multiple neural layers with a few control gates in each neuron
    [31]. Recurrent neural networks of the LSTM'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'type are able to learn order dependency. Four neural networks and a large number
    of memory cells arranged in a chain pattern form up the LSTM. A cell, an input
    gate, an output gate and a gate to eliminate previous data form a typical LSTM
    unit. The gates regulate the flow of information in and out of the cell, and the
    cell retains values for arbitrarily long periods of time. Time series of indefinite
    duration can be categorized and predicted with the LSTM algorithm [19]. These
    gate architectures increased long-term dependency prediction accuracy and addressed
    the vanishing gradient issue in recurrent neural networks. By using the sigmoid
    function on the concealed state from the previous time step as well as the current
    input data, the forget gate deleted the data regarding the current state [32].


    # 8.3 Artificial Intelligence (AI) Methods, Performance Monitoring and Applications
    in Optical Networks


    AI entities as well as systems have the capacity to perform biological processes,
    with a focus on human cognitive processes, to carry out activities similar to
    learning and decision-making. Virtual personal assistants, smart cars, purchase
    prediction, speech recognition, and smart home devices are just a few examples
    of AI applications that are almost universal. These and other AI-based technologies
    are already transforming our daily lives in ways that improve human productivity,
    safety, and health, even influencing how we communicate and have fun. For instance,
    throughout the past few decades, there has been a lot of research into how AI-based
    techniques might be used to enhance the performance in telecommunication networks,
    with implications for transmission, switching, and network management. Rather
    than sitting on the sidelines, optical communication networks and systems have
    begun to apply this discipline to AI-based optical networking, through photonic
    devices to control and management [33].


    # 8.3.1 Performance Monitoring


    Adapting to time-varying link performance metrics, such as optical signal to noise
    ratio (OSNR), nonlinearity factors, chromatic dispersion (CD), and polarisation
    mode dispersion, is a difficulty in network control and management (PMD). This
    subsection examines whether using AI approaches to monitor some of the factors
    mentioned are appropriate.


    In order to perform network-diagnosis and take corrective action (such as fixing
    damage, operating compensators or equalisers, or rerouting traffic around less-than-optimal
    links), physical properties of transmitted optical signals must be estimated and
    acquired [25].'
