  md: '# 12.5 Infrastructure and Smart Infrastructure:

    The Difference


    Infrastructure, in general, refers to a physical framework such as airports,

    seaports, rail lines, roads, power, machinery and equipment, land, educa-

    tion and healthcare facilities, financial safety nets, and the organizational

    wherewithal at both the government and private industry level needed for

    a state to function efficiently. At the macro level, there is a clear distinction

    regarding the types of infrastructure:


    +   1. Economic Infrastructure

    +   2. Social Infrastructure


    In the event of the Coronavirus disease (COVID-19) pandemic, many

    economists have for instance been advocating spending more on infra-

    structure to increase growth. The question that follows is, growth of what?

    Economic infrastructure at the outset is encapsulated by the broad umbrella

    of construction of buildings, colonies, retail chains, commercial markets

    for goods and services used on a day-to-day basis, railway networks, road

    networks—highways, outer ring roads, peripheral roads—waterways, and

    sea and airports along with the availability of internet and adequate power

    supply (which in turn requires a mix of power plants and renewable power

    sources). In a sense, economic infrastructure provides the necessary tools

    to boost growth. More often than not, cities are where economic infra-

    structure gets concentrated which then generates a process of urbanization

    and brings about changes in the occupational structure of the economy.

    Today, cities act as a nerve center for economic as well as financial infra-

    structure with manufacturing hubs related to each sector located around

    major cities as seen in the case of Mumbai, Hyderabad, Pune, Chennai,

    Delhi NCR, Chandigarh, and Bangalore. Building economic infrastructure

    is impossible without building the necessary technological infrastructure,

    and this is where IoT is playing a key role in terms of improving staffing,

    and it is expected to play an even bigger role in the future [7].


    Likewise, when it comes to social infrastructure, it primarily refers to

    the broad elements that drive social change. Under this umbrella, social

    overheads such as schools, colleges, and research institutes along with

    the provision of healthcare, parks, green spaces, etc., can be considered.

    Therefore the broad network of educational institutions, the healthcare

    sector along with healthcare facilities (dealing with wide-ranging health

    ailments and providing the best care possible) come under the gamut of'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'social infrastructure. Access to affordable and timely healthcare and quality
    education become important determinants of the quality of social infrastructure.
    Technology is equally important here as it not only streamlines the methods involved
    (be it teaching or improving health care and treatment) but also adds to the efficiency
    factor. It shows learning can be imparted more effectively while surgeries are
    done with much more precision causing minimum harm to the patients while enabling
    schools, colleges, and hospitals to monitor progress in various areas. IoT’s applications
    in the health sector are already underway in various forms, be it for physicians
    to keep track of patients’ health parameters or for hospitals to keep track of
    the status of medical equipment and status of patients in different rooms along
    with other essential requirements [8].


    # 12.5.1 What is Smart Infrastructure?


    Now that we have an understanding of the distinction between social and economic
    infrastructure, it is essential to know what smart infrastructure can consist
    of. Smart infrastructure leverages technological advancements and applies them
    to critical areas to boost the existing infrastructure. A smart system uses a
    data feedback mechanism to give evidence for making intelligent decisions. Based
    on data collected from sensors, the system may monitor, measure, evaluate, communicate,
    and act. To improve performance, smart infrastructure responds intelligently to
    changes in its surroundings as per user demands and other infrastructure [7].
    Smart Infrastructure is the consequence of merging physical and digital infrastructure
    to provide adequate data for faster and less expensive decision-making. Smart
    infrastructure can revolutionize the efficient use of available infrastructure
    as well as a construction project, presenting a £4.8 trillion challenge and opportunity
    [8]. We can therefore say, smart infrastructure provides a medium for the entire
    infrastructural set up to be dynamic rather than static and respond to changes
    that occur in the system and thus connects the physical (both social and economic)
    to the digital world. A key outcome of this amalgamation is thus generation of
    real-time data for various purposes. We would now be able to identify which part
    of the city has more traffic than others and manage the congestion problem accordingly.
    In addition, this would tell us about the frequency of the metro rail or the number
    of passengers using it in real time.


    Using IoT, the organizations involved would be able to generate big data for further
    analysis and better performance of operations. Airports, for instance, would now
    be able to better predict at what time the number of flights taking off and landing
    would be the highest (peak time of'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'operations) and plan out the flight schedules better with airlines that serve
    the airports concerned. A mix of sensors, IoT applications, and networks along
    with GIS and GPS technology help generate big data and positively drive outcomes.
    Therefore, while it creates a complex network involving many agencies and parties,
    it enables smooth functioning and better synergy within and between organizations.
    When this is looked at from the perspective of Indian cities, we can say that
    we are embracing the change and using technology in a big way [9].


    # 12.5.2 What are the Principles of Smart Infrastructure?


    Smart infrastructure and systems would have to be versatile to changing requirements
    and environments, along with evolving technologies. This necessitates the development
    of a smart infrastructure framework, which will make its use more convenient [10].


    It is necessary to adopt the broad framework as shown below to enable policymakers,
