- pgno: 153
  md: '# 8.4.3 Timing


    Timing jitter can happen instantly (bit-to-bit) or build up gradually over multiple
    bit cycles. There are countless underlying causes that fall under these categories,
    and many of the degrading effects appear in more than one area. The fundamental
    causes encompass all possible ways of component failure; hence they cannot be
    predicted in advance. It is useful to further categorise impairments into optical
    transmission impairments or component failure effects.


    # 8.4.4 Component Faults


    Incorrectly installed or configured equipment, individual or multiple component
    malfunctions, damage to or intrusion into the network are all examples of component
    problems. It is impossible to fully catalogue the effects of such problems since
    they affect networks and components with as many different configurations as possible.
    Consider the failure mechanisms of an optical amplifier as an example to understand
    the variety of possibilities. Reduced power will occur at specific locations along
    the transmission line or inside specific amplifier internal compartments as a
    result of failing pump lasers. These low power levels may be amplified further
    and become surplus noise, which will be seen in the optical spectrum. Although
    excessive noise on the signal can also be caused by unstable pump lasers, it might
    not be visible in the optical spectrum in this instance. The signal levels will
    be high if the pump laser''s power control loop malfunctions and it runs high,
    which can promote a variety of nonlinear transmission phenomena like cross-phase
    (XPM) or self-phase modulation (SPM) [3].


    Electronic switches, multiplexers, and regenerators—which typically incorporate
    SONET/SDH layer performance monitoring—are replaced by optical components in transparent
    networks. One trades off the greater capital equipment cost of integrating optical
    monitoring (to replace the electronic monitoring) against increased operating
    expenses due to more challenging troubleshooting by introducing the optical components
    with lower monitoring capacity. If the two costs scale similarly, this trade-off
    is acceptable. How network troubleshooting costs scale up is unclear. This trade-off
    was necessary in the past due to the high cost of optical performance monitoring.
    Critical optical technologies like tunable filters and spectrometers have lately
    become more widely available and have reduced the cost of many optical monitoring
    solutions [34].'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 8.4.5 Transmission Impairments


    In addition to poor network performance, there are numerous well-known and maybe
    countless negative effects of optical transmission that must be avoided or under
    control. Optically impairing factors such as amplifier noise, chromatic dispersion,
    and polarisation mode dispersion are carefully controlled in order to achieve
    extended connection lengths. As distance and channel count increase, inter-channel
    interactions cause noise to increase. Interactions between impairments make it
    difficult to predict, monitor, and control nonlinear impairments. XPM has a dispersion-dependent
    effect. As a result, the distance and channel configuration affect network performance
    [35].


    While the usage of optical switching elements will influence how different impairments
    need to be monitored, distance is the main factor driving enhanced optical monitoring
    to mitigate transmission impairments. For instance, chromatic dispersion in static
    point-to-point systems might only be checked to ensure proper network installation
    or for in-service compensation. Chromatic dispersion may need to be checked for
    issues in a reconfigurable network since the accumulated dispersion and its effects
    will alter as the network evolves. Additionally, in an optical switching system,
    each channel will have a distinct history, therefore performance and cumulative
    impairments should be assessed per channel, identifying failures. Additionally,
    single-channel impairments are less likely to be linked to component alarms, especially
    when those components operate across the whole WDM spectrum. For these reasons,
    improved per-channel OPM may be needed for activities like wavelength routing
    as well as network reconfiguration to help with problem diagnostics [34].


    # 8.4.6 Fault Management in Optical Network


    The identification, diagnosis, resolving, and monitoring of defects in a network
    are referred to as fault management. Whenever a component or monitor alarm is
    set off or a customer report is submitted, the defect is identified. Many errors
    can be fixed by software tricks like remotely resetting a circuit pack, or they
    can be self-healing. The main defect indicators are bit error alarms at the network
    end terminals or in the client equipment. For instance, fibre cuts will cause
    alarm indication signals and launch a repair effort [3].


    In optical network fault management systems, a failure that is signalled by an
    alarm at the end terminal often needs to be localised and diagnosed. Ideally,
    software would automate this process. A monitor must be able to'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'identify the issue that led to the end terminal alarm in order to be effective.

    The monitors must, for this reason, have sensitivity that is equivalent to or

    greater than the end terminal receiver, where sensitivity is defined in re-

    lation to a certain impairment. The sensitivity specifications for a particular

    monitor will change based on where it is utilised in the network. The net-

    work becomes noisier as time goes on, and distortion moves throughout

    the dispersion map. The sensitivity requirements for a specific place are

    based on the noise and distortion combined at that point [34, 36].


    # ## 8.5 Conclusion


    Interest in OPM has increased as a result of advancements in optical net-

    working. In this paper, we have reviewed the algorithms used for optical

    performance monitoring (i.e., ANN, DNN, CNN, SVR, SVM, KRR &

    LSTM) and found out about the advantages and disadvantages of each of

    them. This paper also demonstrates the different layers of OPM, applica-

    tion of AI in optical performance monitoring and the fault management in

    optical networks.


