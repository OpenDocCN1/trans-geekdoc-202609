    # 8.3.2 Applications of AI in Optical Networking


    AI has a lot of options for automating activities and incorporating intelligent
    decision making in network planning, dynamic control, and management of network
    resources, covering challenges such as connection setup, self-configuration, and
    self-optimization. These opportunities are made possible by prediction and estimation
    using historical data and current network state [33].


    # 8.4 Optical Impairments and Fault Management


    Three basic forms of optical impairments include noise distortion and timing.


    # 8.4.1 Noise


    Random fluctuations in the signal that are frequently regarded as a Gaussian process
    and therefore can vary depending on the signal level.


    # 8.4.2 Distortion


    The average waveform of the signal is modified, for instance, when the marks and
    spaces are taken independently. Burst errors and BER floors can result from distortion,
    which can also be signal level and pattern dependent.'
