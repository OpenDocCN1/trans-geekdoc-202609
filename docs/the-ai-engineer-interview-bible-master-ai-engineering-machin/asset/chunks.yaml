    第二章


    ## 理解就业市场中的 AI 工程


    ## AI 工程作为一种职业的兴起


    几十年来，AI 被认为是一门学术学科，由研究人员和理论模型主导。但在过去的 10 年里，我们看到了从 AI 研究向 AI 部署的剧变。


    ### 为什么对 AI 工程师需求巨大


    AI 模型已经成熟，公司不再仅仅需要研究——他们需要能够实现 AI 的工程师。行业正在从实验性项目转向生产就绪的系统。


    *   AI 模型不再仅仅是研究；它们需要被构建、优化和部署。

    *   深度学习和 Transformer 模型（例如 `GPT`、`LLaMA`）需要规模。

    *   重点已转向 AI 部署和系统架构。


    ## AI 工程角色的类型


    并非所有的 AI 角色都相同。理解这些角色之间的差异对你的职业生涯至关重要。


    ### 1. 机器学习工程师 (MLE)


    主要关注：构建、训练和优化机器学习模型。机器学习工程师负责：


    *   为真实世界应用开发 ML 模型（例如，推荐系统、`欺诈检测`）。

    *   将模型部署到生产和云环境中。

    *   与数据流水线和 `MLOps` 协作。


    你可以在哪里找到这种角色：科技公司、金融、电子商务（Netflix, Spotify）。

    关键技能：`Python`、`TensorFlow`、`PyTorch`、`Pandas`、`NumPy`。


    ### 2. AI 研究科学家


    主要关注：开发新的 AI 架构、算法和方法论。AI 研究人员关注：


    *   开发新的深度学习架构（例如 `transformers`、`diffusion models`、强化学习）。

    *   撰写学术论文并向 `NeurIPS` 和 `ICML` 等会议贡献内容。

    *   实验 `自监督学习`和生成式 AI。


    你可以在哪里找到这种角色：OpenAI、DeepMind、Google Brain、Meta AI、顶尖研究大学。

    关键技能：深度学习、数学建模、`PyTorch`、`TensorFlow`。


    ### 3. 深度学习工程师


    主要关注：为高复杂度任务训练、微调和部署深度学习模型。这些工程师专注于：


    *   处理海量神经网络、`LLMs` 和计算机视觉。

    *   为实时应用优化模型（例如语音识别、图像生成）。

    *   使用先进的硬件加速器，如 `GPUs`、`TPUs` 和自定义 AI 芯片。


    你可以在哪里找到这种角色：自动驾驶汽车（Tesla, Waymo）、NLP 公司（Anthropic, OpenAI）、生成式 AI 初创公司。

    关键技能：`PyTorch`、`TensorFlow`、`CUDA`、模型压缩、量化、`GPU 并行`、`Hugging Face`。


    ### 4. AI 产品工程师


    主要关注：将 AI 技术与现实世界的产品开发相结合。


    *   将 AI 研究转化为市场就绪的应用。

    *   在面向消费的产品中开发 AI 驱动的功能（例如 AI 聊天机器人、AI 驱动搜索、自动内容审核）。

    *   平衡准确性、成本和用户体验。


    你可以在哪里找到这种角色：科技初创公司、SaaS AI 公司、电子商务。

    关键技能：AI APIs、全栈开发、产品思维、模型服务、云 AI 部署。


    ## 雇主期望 AI 工程师具备的关键技能


    AI 工程是要求严苛的技术领域之一。雇主期望候选人具备软件工程、系统设计和 AI 模型专业知识的混合技能组合。


