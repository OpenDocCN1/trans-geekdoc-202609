    ## 第一章


    ## 引言


    ## AI 工程师面试的现实


    人工智能正在重塑每一个行业，从金融、医疗保健到机器人和自主系统。对 AI 工程师的需求急剧增长，但面试过程仍然是一项巨大的挑战。许多候选人认为，准备 AI
    工程师面试与准备标准的软件工程师职位面试是一样的。这是一个导致失败的致命错误。


    招聘经理不仅仅是在寻找会写代码的人；他们正在寻找理解 AI 独特挑战的人才。AI 工程师面试要求候选人考虑：


    *   模型选择与权衡——理解何时使用 CNN、Transformer 还是扩散模型（Diffusion Models）。

    *   数据流水线设计——处理大规模 AI 工作负载、数据预处理和特征工程。

    *   针对 AI 的系统设计——理解延迟、可扩展性和分布式计算。

    *   生产级部署——在受限环境中实现模型落地。


    传统的软件工程面试侧重于数据结构、算法和通用应用的系统设计（例如设计一个可扩展的 Web 服务）。然而，AI 工程师面试超出了这些范围，引入了 AI 特有的复杂性。


    ## 本书涵盖的内容


    本书并不是另一本列出主题并让你自己解决剩下的问题的指南。相反，它提供了一种系统的方法，帮助你在最高水平上掌握 AI。与通用的编码面试书籍不同，本书专门关注：


    *   核心 AI 概念与基础。

    *   AI 面试题的框架。

    *   AI 系统设计与部署。

    *   薪资谈判策略。

    *   职业成功的战略性定位。


    每一章的设计都建立在前一章的基础上，确保知识的逻辑递进。当你读完这本书时，你将不仅理解 AI 面试，而且准备好主宰它们。


    ## 本书的读者群体


    本书为旨在进入高端 AI 岗位的严肃候选人设计。它假设读者在编程和技术问题解决方面拥有坚实的基础，但不需要机器学习博士学位或在 FAANG 公司的经验。


    ### 主要读者群：


    *   **转型 AI 的软件工程师**：拥有深厚编程背景，需要掌握 AI 基础和系统设计的开发者。

    *   **机器学习工程师与数据科学家**：希望精炼技能并通过 AI 专项面试的 AI 从业者。

    *   **进入行业的 AI 研究人员**：拥有学术 AI 知识，但需要关注现实世界系统实现和部署的人士。

    *   **目标 FAANG 和顶级 AI 初创公司的资深 AI 工程师**：希望精炼面试策略、提高薪资 Offer 并进入领导岗位的专业人士。

    *   **进入 AI 工程岗的计算机科学毕业生**：目标是初级 AI 岗位但缺乏结构化准备资源的候选人。


    如果你属于上述任何一类，本书将成为你应对 AI 就业市场、攻克面试并获得顶级 Offer 的终极指南。


