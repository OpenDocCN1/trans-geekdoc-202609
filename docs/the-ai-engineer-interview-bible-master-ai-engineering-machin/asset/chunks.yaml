    * Python 是 AI 开发的主流语言（`NumPy`, `Pandas`, `SciPy`, `Scikit-learn`）。

    * 深度学习框架：`PyTorch`, `TensorFlow`, `JAX`。

    * 数据流水线工具：`Apache Spark`, `Dask`, `SQL`, 特征存储。


    ## 2. 系统设计与 AI 基础设施


    * 可扩展的 AI 架构（处理高吞吐 AI 工作负载）。

    * AI 部署与推理流水线（`TensorRT`, `ONNX`, 模型量化）。

    * 云端 AI 与 MLOps（`AWS SageMaker`, `Google Vertex AI`, `Kubernetes`, 针对 ML 的 `CI/CD`）。


    ## 3. 模型优化与部署


    * 使用模型剪枝、蒸馏和缓存降低推理延迟。

    * 理解准确性、速度和成本效益之间的权衡。


    ## 4. 大规模 AI 与生产挑战


    * 向量数据库与嵌入（`FAISS`, `Weaviate`, `Pinecone`）。

    * LLM 与 Transformer 模型（微调 `GPT`, `BERT`, `LLaMA`）。

    * AI 可观测性与监控（检测模型漂移、缓解偏差）。


    第三章


    ## 面试 AI 与系统设计基础


    ## 弥合 AI 知识与系统设计之间的差距


    大多数准备技术面试的 AI 工程师侧重于编码问题——从零开始编写神经网络、优化 ML 模型以及调试 `PyTorch` 或 `TensorFlow` 脚本。虽然编码能力至关重要，但仍是不够。


    在 `FAANG`、`OpenAI`、`Tesla` 以及其他顶级 AI 公司，设计、优化和扩展 AI 驱动系统的能力与如何训练深度学习模型同样关键。AI
    不再仅仅关于创建模型——它关于将 AI 集成真实的、生产就绪的基础设施，能够处理数百万用户、海量数据集和严格的性能限制。


    ## 核心 AI 概念与技术基础


    在深入研究 AI 系统设计之前，候选人必须证明对 AI 基础有深入理解——不仅是在理论层面，而是要能够转化为可扩展、生产就绪的 AI 解决方案。


    ### AI vs 机器学习 vs 深度学习


    许多候选人在面试中无法清晰地阐述 `AI`、`ML` 和深度学习之间的区别。虽然这些术语经常互用，但它们指的是不同的问题解决方法：


    * 人工智能 (`AI`) – 一个包含基于规则的系统、专家系统、搜索算法和机器学习的广泛领域。

    * 机器学习 (`ML`) – `AI` 的子集，其中系统从数据中学习模式，而不是通过显式编程。

    * 深度学习 (`DL`) – `ML` 的子集，它利用多层神经网络来提取特征并学习复杂的表示。


    面试小贴士：


    一个常见的面试问题是：


    “你如何决定使用传统的 `ML`（例如 `Random Forest`、`SVM`）还是深度学习（`CNNs`、`Transformers`）？”


    候选人必须解释：


    * 计算权衡——`DL` 需要更多的计算资源和标注数据。

    * 可解释性——传统的 `ML` 模型更容易调试和解释。

    * 用例对齐——`CNNs` 用于图像数据，`Transformers` 用于 NLP（语言处理）等。


    ### 神经网络与模型架构


    面试官会期望候选人理解各种深度学习架构以及何时使用它们：


    * 全连接网络 (`FCNs`)

    * 卷积神经网络 (`CNNs`)

    * 循环神经网络 (`RNNs`)

    * Transformers (`GPT`, `BERT`, `LLaMA`)

    * 扩散模型


    ### 特征工程与预处理


    数据预处理至关重要。AI 工程师必须理解：


    * 缩：`MinMax`, `Z-score`

    * 降维：`PCA`, `t-SNE`

    * 处理不平衡数据：`SMOTE`

    * 特征选择：`SHAP` 值


    ### 训练、评估与模型优化


    关键评估指标：


    * 分类：`Precision`, `Recall`, `F1-score`, `ROC-AUC`

    * 回归：`RMSE`, `MAE`, `R-squared`


