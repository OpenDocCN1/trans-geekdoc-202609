  trans: '

    LinkedIn 是 AI 职场社交最强大的工具——但前提是必须策略性使用。


    ## 如何针对 AI 职位优化你的 LinkedIn：


    - `标题至关重要`：“机器学习工程师 | 可扩展 AI 架构师 | LLM 优化专家” > “软件工程师”

    - 在“项目”栏目中`置顶顶级 AI 项目`。

    - 在总结中使用`AI 专用关键词`，以确保在招聘人员搜索时具有可见性。

    - `与 AI 思想领袖互动`——对 AI 论文、系统设计讨论和招聘帖子发表评论可以增加曝光率。


    ## AI 内推的触达策略：


    - `识别目标公司的招聘经理`（FAANG、OpenAI、顶尖 AI 初创公司）。

    - `发送简洁的消息`。


    ### AI 内推的冷启动私信模板：


    ```

    Hey [Hiring Manager’s Name], I admire your work on [specific AI project]. I’m
    an AI engineer specializing in [your expertise] and recently built [relevant project].
    I’d love to connect and hear about how your team approaches [specific AI challenge].
    Let me know if you’re open to chatting. Thanks!

    ```


    ### 为什么这有效：


    - 消息具有个性化（非通用模板）。

    - 展示了技术相关性（而非单纯急于找工作）。

    - 将发送者定位为同行，而非求职者。


    ## 2. 利用 AI 会议与聚会


    ### 顶尖的 AI 招聘发生地


    AI 会议是社交的金矿，因为它们吸引了招聘经理、AI 研究人员以及寻找人才的初创公司创始人。


    ### 参加的顶级 AI 会议：


    - `NeurIPS`（神经信息处理系统）——深度学习、Transformer、生成式 AI 的顶级 AI 会议。

    - `CVPR`（计算机视觉与模式识别）——对于专注于视觉模型、机器人或自动驾驶 AI 的 AI 工程师至关重要。

    - `ICML`（机器学习国际会议）——高影响力的 AI 研究与企业级应用。

    - `Google I/O`, `AWS re:Invent`, `Microsoft Ignite` —— 特定行业的 AI 工程师职位及招聘活动。


    ### 获得 AI 职位的会议策略：


    1. 参加公司赞助的招聘说明会——FAANG 和 OpenAI 经常会在 AI 会上宣布招聘轮次。

    2. `与演讲者和研究人员互动`——评价他们的工作，提问有见地的 AI 问题。

    3. `利用社交活动和黑客松`——许多 AI 初创公司直接从黑客松和竞赛中招聘。


    ### 会议开场示例：


    ```

    “我看了你关于可扩展 LLM 推理的演讲。你们团队是如何处理生产环境中模型漂移的？”

    ```


    ### 为什么这有效：


    - 专业的 AI 讨论 > 随机求职。

    - 展示了深厚的知识，让你成为一个令人深刻的候选人。


    ## 3 贡献开源 AI 项目


    ### 被 AI 招聘经理关注的最快方法


    贡献高影响力 AI 开源项目会立即提升你在 AI 招聘圈的信誉和可见度。


    ### 职业成长的顶级 AI 开源项目：


    - `Hugging Face Transformers` —— LLM 微调、NLP 优化、开源 AI 研究。

    - `FastAI` —— 为速度和效率设计的深度学习框架。

    - `PyTorch` —— FAANG、Tesla、OpenAI 使用的核心深度学习框架。

    - `Ray` (`RLlib`, `Serve`) —— 可扩展 AI 训练、强化学习基础设施。


    ### 如何在开源 AI 贡献中脱而出：


    - 从`修复小 Bug`开始以了解项目。

    - 进行`性能优化`——公司重视提高 AI 效率的工程师。

    - 在 `GitHub issues` 和 `Slack 频道`中`参与活跃讨论`。

    - 你的工作`发布见解`（博客文章、关于 AI 优化的 LinkedIn 析）。


    ### 为什么这有效：


    - FAANG AI 招聘经理会积极监控顶尖开源贡献者。

    - 公开 AI 贡献比私有公司项目更能证明技能。


    ## 获得顶尖 Offer：谈判与定位


    ### 如何让 AI 工程师职位的薪资最大化


    一旦获得 AI Offer，谈判至关重要——顶级 AI 工程师往往因为未能充分优化薪资而错失 50,000 至 200,000 美元。


    AI 薪资包括：


    - `底薪` (Base Salary) → 固定金额，但在 FAANG 通常有上限。

    - `股权` (Equity) (`Stock`, `RSUs`) —— 顶尖 AI 公司中最具谈判价值的组件。

    - `绩效奖金` (Performance Bonuses) —— 如果你有竞争性的 Offer，可以协商。

    - `入职奖金` (Signing Bonus) —— 如果得当，可以翻倍或三倍。


    ### FAANG AI Offer 谈判策略：


    1. 使用 `Levels.fyi` & `Blind` 对你的 Offer 进行基准对比。

    2. 延迟给出预期薪。

    3. 利用竞争性 Offer 创建竞价大战。

    4. 请求`股权刷新` (equity refreshers) 和增加入职奖金。


    ### AI Offer 谈判脚本：


    ```

    “I’m really excited about this opportunity. I also have an offer from [another
    top AI company] with a total comp of [$X]. If we can improve the equity component,
    I’d be happy to move forward.”

    ```


    ### 为什么这有效：


    - 利用了竞争而不显得具有侵略性。

    - 将谈判聚焦在总薪包上。

    - 让 FAANG 招聘经理增加 `RSUs` 而非底薪（底薪通常是固定的）。


    ## 第七章


    ## 附录：AI 工程师薪资谈判与 Offer 优化


    ### 在 FAANG 和顶级 AI 公司实现薪资最大化


    AI 工程是科技领域薪酬最高的最领域之一，但大多数工程师因未能优化薪资而错失收益。


    ### 7.1 理解 AI 薪资


    核心洞察：底薪并不是 AI Offer 中最重要的部分。


    #### 1. AI Offer 的四个组成部分


    - **底薪 (Base Salary)**：FAANG 中级工程师通常为 150,000–250,000 美元；通常有上限。

    - **股票期 (`RSUs`/`Equity`)**：最具谈判价值的组件；在高级别，四年内的授予金额可超过 100 万美元。

    - **绩效奖金 (Performance Bonuses)**：通常为底薪的 10%–25%；并非保证且视公司而异。

    - **入职奖金 (Signing Bonus)**：可以翻倍或三倍；范围从 25,000 到 200,000 美元。


    #### 谈判策略：


    - 重点谈判股票和入职奖金，而不仅仅是底薪。

    - 理解归属周期（vesting schedules）——大多数 `RSUs` 在四年内归属，但某些公司（如 `Meta`、`Amazon`）在前两年集中授予股票。


    '
