    2b is formed by a nucleophilic attack of benzoic acid. Intermediate 2c undergoes
    cyclization to form the oxadiazepine, which is then treated with triphenylphosphine
    to yield the desired 1,3-oxadiazole compound (see Figures S2 and Tables S1, S2,
    and S3). Supporting data and files are available at: chorapal.github.io/n/sulfonimine.


    The energy profile in the proposed mechanism also suggested that reactivity of
    cyclic sulfamides would be faster than that of cyclic N-sulfonimine. The first
    half of the reaction mechanism, formation of intermediate, is independent of the
    type of carboxylic acid or cyclic N-sulfonimine (Figures S2 and S3). In both cases,
    the rate-limiting step is the attack of the PNC group on the N-sulfonimine with
    free energy (ΔG‡) of 16.3 kcal/mol and 18 kcal/mol respectively. This suggests
    that both reactions will occur quickly, and it is expected that the cyclic N-sulfonimine
