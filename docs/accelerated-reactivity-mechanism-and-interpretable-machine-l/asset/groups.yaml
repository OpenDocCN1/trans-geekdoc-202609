    # 有机快报 (Organic Letters)


    pubs.acs.org/orgLett


    快报 (Letter)


    # N-磺酰亚胺快速多组分反应的加速活性与可解释机器学习


    Krupal P. Jethava, Jonathan Fife, Yingqi Chen, Ahmad Hossain, and Gaurav Chopra®


    引用本文：Org. Lett. 2020, 22, 8480–8486


    在线阅读


    访问 | 统计 | 关于我 | 文章信息 | 补充信息


    **摘要：** 我们开发了化学反应性流程图，以帮助化学家利用在少量反应上训练的具有统计稳健性的机器学习模型来预测结果。我们通过预测反应活性和生成密度泛函理论（DFT）计算开发了
    N-磺酰亚胺多组分反应。模型学习到的直观化学特征预测了 N-磺酰亚胺与多种羧酸的非均相反应活性。预测的验证表明，结果解释对人类化学家有用。


    ![](img/1d5f606e947f4a2e3677c86c4febc4f1_0_0.png)


    计算机辅助有机化学在预测化学反应条件和自动化合成方面具有潜力¹¹¹ 近年来，基于机器学习（ML）的方法已成功应用于药物发现、先导化合物优化、定量结构-活性关系（QSAR）¹²
    以及逆合成规划¹³。传统上，活性预测是一项难题，需要特定的数据集来训练机器学习模型¹⁴¹⁵。实验数据库需要大量的手动示例来检查原料的可行性，以确定其是否发生反应。需要注意的是，大多数使用数据库的机器学习模型仅报告文献中成功的反应，因为失败的反应很罕见。因此，对于通过成功和失败反应数据研究的特定案例，可以对此类数据集进行训练。最近，一些数据集被用于测试（在没有实验验证的情况下）狄尔斯-阿尔尔德反应中的区域异构体、立体异构体、对映异构体¹⁶
    以及对映选择性¹⁷。在该化学中学习到的化学特征在探索某些反应条件下筛选活性是繁琐的。因此，关于使用机器学习方法对预测活性进行前瞻性验证的文献有限¹⁷¹⁸ 据我们所知，我们提供了首次快速且一ポット的多组分反应，通过训练多组分反应来探索非均相活性，并通过训练人类可解释的机器学习模型来识别活性的化学模式，分别预测并测试多组分反应中新底物的活性。


    选择 N-磺酰胺是因为 N-磺酰胺是有机化学中重要的物种之一，用于各种转化。N-磺酰亚胺是反应⁹和亲核加成¹⁰亲电碳的良好来源。我们报道了分离的碳-氮键硫活性的几种反应¹¹¹
    今天，磺酰胺用于解释杂环。磺酰胺利用磺酰胺的多功能性，用于迈克尔加成¹²、环加²³、芳基烷化²⁴ 或烷基化²⁵策略（方案 1）。


