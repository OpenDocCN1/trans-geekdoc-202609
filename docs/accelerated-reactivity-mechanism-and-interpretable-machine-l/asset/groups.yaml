    ![](img/1d5f606e947f4a2e3677c86c4febc4f1_3_0.png)


    **图 2.** 化学反应流程图。胺与酸之间反应底物的决策树。(A–C) 模型如何分配预测反应活性的规则的图化说明。(D) 在所有数据上生成的最终自助抽样（bootstrapped）流程图，彩色框中列出了每个规则的细节。(E–H)
    使用训练数据这些规则的示例。方框代表图 D 中的特征，流程图中的黄色线根据化学特征显示反应结果。


    5c 的产率分别为 53% 和 37%。此外，分别使用三甲氧基取代的N-磺酰胺（N-磺酰胺）和 4-氰基取代的N-磺酰胺（N-磺酰胺）实现了 5d 和 5e
    的合成，并获得了目标化合物 5d 和 5e。


    链状和环状 N-磺酰胺的异质性促使开发了一个用于成功和意外反应的预测模型。我们分别使用分子指纹（ECFP）5 对羧酸和 N-磺酰胺训练了两个模型。对于 0–3
    的指纹半径，未观察到碰撞。我们在表 S3 中列并报告了 N-磺酰胺与羧酸之间是否发生反应。决策树的目标是利用有限反应数据生成的指纹来预测“成功（Worked）”。为了解决这个问题，对这两个决策树进行了
    1000 次验证，以采样为每个反应创建的不同可能模型（见表 S2 和 S3）。通过决策树的自助抽样评估来确定我们模型预测实验结果的稳健性（参见支持信息中的自助抽样结果表格），详情请参考本工作中所用学习方法的介绍。最终模型在
    ECFP 半径为 3 时获得了 0.076 的化学统计值，表明在有限训练数据（20 次运行）上的可靠性有所提高。这种方法产生了图 2A–D 所示的具有特征的化学反应图，用于研究反应以确保模型具有预测性，同时保持可解释性。图
    2D 中的模型化学反应流程图用于在给定训练反应次数的情况下评估反应底物。模型的第一个决策是针对连接在芳香环上的羧酸基，其中最后一种酸导致无反应的预测（图 2E
    显示了一个缺乏失败案例的示例）。接下来，模型检查环己烷 6 位的取代情况，该预测为无反应（图 2F 所示的特征案例示例）。接着，模型检查羧酸对位的取代情况，由于缺乏这些特征导致了失败。失败案例如图
    2G 所示。请注意，如果存在碳以外的杂原子，则预测磺酰胺的 7 位或芳香环上发生二乙胺取代。随后，ML 模型给出最终决策（见图 2H，其中仅显示了唯一通过条件的的反应）。该决策得到了胺取代导致成功结果的支持。在这一步中，我们测试了
    1（不含胺的 N-磺酰胺）与 2b（对甲苯甲酸）之间的反应，并注意到反应发生了。相反，反应 1b（带有氨基取代的 N-磺酰亚胺）和 2d（4-羟基苯甲酸）未发生。这些结果表明最终决策可以显示对甲苯甲酸和氨基取代。最后，我们测试了
    2d 与链状 N-磺酰亚胺 4a，以查看该规则是否适用于链状 N-磺酰亚胺，反应确实发生了。这些反应如方案 S 所示，展示了我们的 ML


