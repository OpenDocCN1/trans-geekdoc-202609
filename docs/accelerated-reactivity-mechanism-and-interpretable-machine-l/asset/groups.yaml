    未需要的二噁唑

    磺酰胺与二噁唑之间的直接连接尚未探索。二噁唑骨架在许多活性化合物和药物制剂中是独特的特有骨架（图 S1）。因此，磺酰胺连接的 1,3-二噁唑可用于新骨架的设计。


    我们从以下想法开始：环 N-磺酰亚胺、酰基 N-磺酰亚胺和芳胺是已知的。为了确定羧酸的活性模式，我们使用密度泛函理论（DFT）优化了参数并利用碳原子的性质识别了最合适的异构体（图
    S1）。两种环 N-磺酰亚胺对亲核攻击非常敏感，因为第二个反应伙伴更具亲核性，并且有助于使用各种范围的羧酸。然后，衍生物的合成作为一种用于快速多组分反应 N-磺酰胺的前瞻性策略。


    ![](img/1d5f606e947f4a2e3677c86c4febc4f1_1_2.png)


