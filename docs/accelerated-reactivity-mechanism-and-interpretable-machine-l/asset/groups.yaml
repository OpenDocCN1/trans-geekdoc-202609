    Letter


    # # Accelerated Reactivity and Interpretable Machine Learning of N-Sulfonylmines
    toward Fast Multicomponent Reactions


    Krupal P. Jethava, Jonathan Fife, Yingqi Chen, Ahmad Hossain, and Gaurav Chopra®


    Cite This: Org. Lett. 2020, 22, 8480–8486


    Read Online


    ACCESS | Metrics & Me | Article Information | Supporting Information


    **ABSTRACT:** We developed chemical reactivity flowcharts to help chemists predict
    outcomes using statistically robust machine models trained on a small number of
    reactions. We developed N-sulfonylimine multicomponent reactions by predicting
    reactivity and generating density functional theory. Intuitive chemical features
    learned by the model predicted heterogeneous reactivity of N-sulfonylimine with
    diverse carboxylic acids. Validation of the predictions shows that outcome interpretation
    is useful for human chemists.


    ![](img/1d5f606e947f4a2e3677c86c4febc4f1_0_0.png)


    Computer-assisted organic chemistry has potential for predicting chemical reaction
    conditions and for automating synthesis.¹¹ In recent years, machine learning (ML)-based
    approaches have been successfully applied to drug discovery, lead optimization,
    quantitative structure-activity relationships (QSAR),¹² and retrosynthetic planning.¹³
    Traditionally, reactivity prediction is a hard problem which requires specific
    data sets to train ML models.¹⁴¹⁵ Experimental databases require a large number
    of manual examples to check the feasibility of starting materials to determine
    if it reacts. It is important to note that most ML models using databases report
    only successful reactions in the literature as unsuccessful reaction is rare.
    Thus, for a specific case studied through both successful and unsuccessful reaction
    data, it is possible to train on such data sets. Recently some data sets were
    used to test without experimental validation of regioisomers, stereoisomers, diastereoisomers
    in Diels–Alder reaction,¹⁶ and enantioselectivity.¹⁷ Chemical features learned
    in this chemistry is tedious to explore screening reactivity under certain reaction
    conditions. To, there is limited literature for prospective validation of predicted
    reactivity using ML methods.¹⁷¹⁸ We provide the first, to the best of our knowledge,
    of a fast and one-pot


    multicomponent reaction to explore heterogeneous reactivity by training a human
    interpretable ML model that identifies chemical patterns of reactivity to predict
    and test the reactivity of new substrates in the multicomponent reaction respectively.

    Selected N-sulfonylmines because N-sulfonylmines are one of the important species
    in organic chemistry that is used for a variety of transformations. N-sulfonylimine
    is a good source of electrophilic carbon for reaction⁹ and nucleophilic addition.¹⁰
    We have reported several reactions in the reactivity of a carbon-nitrogen bond
    sulfide isolated.¹¹¹ Today, a sulfamide is used in present to interpreting heterocycles.
    Sulfonamides are used in Michael addition,¹² cycloaddition,²³ arylation alkylation,²⁴
    or alkylation²⁵ strategy by leveraging the versatility of sulfamide (Scheme 1).


