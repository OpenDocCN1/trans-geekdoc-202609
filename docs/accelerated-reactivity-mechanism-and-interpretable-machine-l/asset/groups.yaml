    # 方案 1 探索 N-磺酰-磺酰亚胺对于多组分反应活性的策略


    来自胺和醛。值得注意的是，由于几个原因，原位形成并不总是理想的：

    (i) 反应在某些反应条件下可能是不稳定的²

    (ii) 离子的形成高度取决于其原料（醛或胺），并且可能取决于我们想要使用的试剂。此外，氯丙烯可以作为催化剂代替碳酸。为了解决这些问题，我们首次报道了使用
