    多组分反应（MCRs）吸引了化学家在没有构建块的情况下快速创建分子库。这些 MCR 高度取决于原料、溶剂、催化剂和当量。理解特定 MCR 的原料活性对于识别多样化的结果至关重要。机器学习模型可以建议磺酰胺类型以避免浪费时间和精力。在这工作中，我们开发了环或非环
    N-磺酰亚胺 MCR 来生成化学骨架。Ramazani 等¹⁴ 和 Yudin 等¹¹ 分别报道了使用 1,3-二噁唑骨架与芳香原料的四组分反应，使用异氰基苯磷（PINC）作为反应伙伴。在之前的研究中，原位生成了目标产物
    3a（表 2）和羧酸（2b）。最初，我们进行了优化以获得当二氯甲烷（DCM）在 -10 °C 下添加时的优化反应条件（见补充信息）。


