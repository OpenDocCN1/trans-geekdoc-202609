    N-sulfonimine 4a reacted with benzoic acid (2a) under optimized conditions, the
    reaction afforded the desired product (5a) in good yield (Scheme 2), but with
    a longer reaction time than expected (<5 min). This led us to investigate the
    mechanism and energy profile of intermediates and transition states in formation.


    To gain mechanistic insight into the reactions, we used DFT with PCM solvent in
    dichloromethane at -10 ℃ to identify transition states and intermediates (Figure
    S2) and cyclic N-sulfonimine (Figure S3). In the proposed mechanism, the nucleophilic
    attack of the carbamide on the PNC group of cyclic N-sulfonimine 1. The intermediate
    2b is formed by a nucleophilic attack of benzoic acid. Intermediate 2c undergoes
    cyclization to form the oxadiazepine, which is then treated with triphenylphosphine
    to yield the desired 1,3-oxadiazole compound (see Figures S2 and Tables S1, S2,
    and S3). Supporting data and files are available at: chorapal.github.io/n/sulfonimine.


    The energy profile in the proposed mechanism also suggested that reactivity of
    cyclic sulfamides would be faster than that of cyclic N-sulfonimine. The first
    half of the reaction mechanism, formation of intermediate, is independent of the
    type of carboxylic acid or cyclic N-sulfonimine (Figures S2 and S3). In both cases,
    the rate-limiting step is the attack of the PNC group on the N-sulfonimine with
    free energy (ΔG‡) of 16.3 kcal/mol and 18 kcal/mol respectively. This suggests
    that both reactions will occur quickly, and it is expected that the cyclic N-sulfonimine
    would be faster than the cyclic N-sulfonimine, which was also observed experimentally.


    Next, using the optimized conditions, we investigated various carboxylic acid
    derivatives. The reaction of the diethylamine-terminal sulfonamide (1b) with benzoic
    acid afforded the desired product 3b in 40%. The reaction of sulfonamide 1b with
    p-tolic acid (2b) also formed product 3c in 17%. In addition, reaction of methyl-substituted
    sulfonamide 1c with benzoic acid (2a) formed expected product 3d in moderate yield
    (S2). However, naphthyl amide (1d) did not react


