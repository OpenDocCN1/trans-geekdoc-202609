    strategy was used to predict reactions by MCR by a human chemist. The results
    show that the final decision of the model was predicted by two different features:
    reaction type and outcome. The additional clarity provided by this rule as they
    show p-methyl substitution in acyclic is responsible for reactivity and a p-hydroxy
    substitution leads to decreased reactivity for cyclic N-sulfonylimine. It also
    suggests that cyclic-sulfonylimines are more reactive than the cyclic counterparts,
    yet they also react similarly. Therefore, the use of bootstrapping is essential
    for developing reliable models for smaller datasets, and the use of decision tree
    models on positive and negative reactions help human and chemist predict outcomes.


    In summary, we have demonstrated that MCR of acyclic and cyclic sulfonylimines
    was used as a representative reaction type to develop ML outcomes in a broader
    perspective. The final and peculiar mechanism of N-sulfonylimines was evaluated
    using DFT calculation to understand the critical role of transition states and
    intermediates. Bootstrapping design and chemical reactivity flowchart explained
    the choices made by the model to predict outcomes. The ML approach can be extended
    to explore any MCR or any chemical reaction used to predict outcomes with a quick
    and efficient manner. In addition, the generated chemical library could be supported
    by Suzuki coupling,¹¹⁷ or group transform reaction under appropriate conditions,
    providing a framework for fast MCRs, understanding the reaction mechanism, and
    identifying features for the reactivity of compounds that results in successful
    reactions to save valuable time for chemists to avoiding dead-end leads.'
