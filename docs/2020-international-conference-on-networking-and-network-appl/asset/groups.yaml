    # 2020 International Conference on Networking and Network Applications (NaNA)


    ## Deep Learning as a Service Based on Encrypted Data


    Xinhong Hei¹

    College of Computer Science and Engineering

    Xi''an University of Technology

    Xi''an, China

    heixong@xaut.edu.cn


    Xiaoling Liang², Yichuan Wang², Wenjiang Ji²

    Lei Zhu²

    ²College of Computer Science and Engineering

    Xi''an University of Technology

    Xi''an, China

    chuan@xaut.edu.cn


    **Abstract—** With the widespread promotion of 4G/5G network technology and the
    development of Internet of Things (IoT), more and enterprises begin to make use
    of their powerful computing and technology to perform deep neural networks for
    help them classification, regression, recognition, NLP and others. This not only
    brings convenience to people, but also causes leakage of users'' private data.
    In this paper, we propose a method to design a deep learning model based on Secure
    multi-party computation (MPC). In the process, we realize that the only model
    exists on the encrypted data of users, and in the experimental part, we show that
    the classification accuracy of the encrypted model is 99.21%, which is close to
    the unencrypted result. The classification accuracy is lower than the test result,
    but better than the existing deep learning network model that can realize data
    privacy.


    *Keywords:* Network; Homomorphic encryption; IoT; Deep learning; MPC


    **Introduction.** The concept of artificial intelligence has been pushed to a
    new height in history, and deep learning is a branch of artificial intelligence.
    According to the report, many companies, including Google, Facebook, baidu, and
    alibaba, have also benefited from its field which focuses on the technologies
    of these goals and targets. In recent, deep learning is now making remarkable
    progress. With the rapid development of cloud service, these enterprises provide
    the corresponding deep learning model in the cloud to provide services for users
    according to the different requirements for users. On the one hand, it provides
    users with powerful services. On the other hand, after uploading their data, such
    as photos, video, and so on, to the cloud computing, users will face the risk
    of privacy leakage caused by their subsequent usage. In this case, we know that
    the neural network model will get better with the increase and diversification
    of the dataset. In areas such as finance and health, laws or regulations do not
    allow the personal data, so we may not be able to get a good deep learning model
    based on limited data [1]. With modern society paying and more attention to privacy,
    to ensure the privacy of data and the effectiveness of algorithms in the process
    of learning has become a major problem in the field of machine learning.


    The appearance of homomorphic encryption makes the application of ciphertext in
    field of learning possible. Rivest was the first to forward the concept of homomorphic
    encryption in 1978 [8]. Homomorphic encryption is a form of encryption, which
    allows people to perform algebraic operations on ciphertext to obtain the result
    of encryption. The ciphertext will be decrypted to obtain the result. There are
    many homomorphic encryption algorithms available, and most are additive, such
    as Bacon and Paillier [3], as well as RSA [4] and ElGamal that support homomorphic
    encryption. In 2009, [5], Gentry Li proposed a homomorphic encryption algorithm
    based on ideal lattice, which became a solution that can realize all attributes
    of homomorphic encryption. Although it is widely used in machine learning, but
    it cannot be applied in the process of the scheme itself, has computational model
    and high security.


    Although the theory of homomorphic encryption can perform calculations, but in
    the practice, we should pay attention to the characteristics of the encryption:
    only support input data; the depth of computation needs to be fixed, and the addition
    cannot be carried out indefinitely. Homomorphic encryption does not support multiplication
    and comparison. Therefore, homomorphic encryption cannot be applied to deep learning.


    In the following paragraphs, we will discuss these problems provide solutions.
    And our contributions are follows:


    - We combine deep learning with homomorphic encryption algorithm and a deep learning
    network model based on secure Multi-party computing (MPC) to ensure data privacy
    when users use the code deep learning model.


    Our experimental results using the convolutional neural network show that the
    classification rate of the encrypted Mist dataset can reach 99.21%, which is very
    close to the result without plaintext, also close to the accuracy of state-of-the-art
    model. The classification rate of cipher-10 encrypted dataset can reach 98.5%,
    higher than the result in plaintext, and better than the existing deep learning
    network that can realize data privacy and the unit sample takes an average of
    11 seconds to complete an inference in the cloud.


    ## II. HOMOMORPHIC CRYPTOGRAPHY


    In essence, homomorphic encryption refers to such encryption by adding and multiplying
    on the ring, and then encptions the result. Below we introduce working steps of
    Paillier algorithm.


    ### A. Key generation


    Take two large primes p and q, and calculate their product N and the least common
    $\lambda$ of p-1 and q-1:


    $N = pq$

    $\lambda = \text{lcm}(p-1, q-1)$


    If an integer $g \in Z_N^*$ is randomly selected, $Z_{N^2}$ represents the set
    of all less than $N^2$, where $\lambda$ is the private key and $(N, g)$ is the
    public key.


    ### B. The encryption process


    If $m \in Z_N$ is the ciphertext to be encrypted, the encryption algorithm is
    as follows:


    $c = E[m,r] = g^m r^n \pmod{N^2}$


    Among them: $m \in Z_N^*$ is a randomly selected integer, c is the encrypted data.
    For the same plaintext $c$, c will be generated by the different ciphertext $c$
    but the same can be restored after decryption.


    ### Decryption process


    If $c \in Z_{N^2}$ is the ciphertext to be decrypted, the decryption algorithm
    is as follows:


    $L(u) = \frac{u-1}{N}$

    $L(c^\lambda \mod N^2) = L(g^m \mod N^2) \mod N$


    Where, $L(\cdot)$ is defined as:


    $L(u) = \frac{u-1}{N} \quad (5)$


    $D[E[m_i,r_i]E[m_j,r_j]] = m_i + m_j \pmod N \quad (7)$


    ### D. Processing of real numbers


    Paillier encryption is only defined for non-negative integers less than N. Since
    we want to use signed integers and floating point numbers, values should be encoded
    as a valid before encryption. The preprocessing of negative and floating point
    numbers is:


    - Signed integers are relatively easy: we utilize the modular arithmetic properties
    of the Paillier encryption. We choose to represent integers between -N/3 and N/3
    for decoding the resulting result. And we can detect negative values by dividing
    by that.

    - Represent floating point numbers is a harder task. We use a variant of fixed-precision
    arithmetic by multiplying the factor by a large number (e.g. $10^6$) and rounding
    the resulting result.


    The complete process of real numbers scheme is available at data6.esiro.au.


    ## III. CONVOLUTION NEURAL NETWORK


    CNN (Convolution Neural Network), a class of forward neural network that includes
    convolutional computing and a deep structure, is one of the representative of
    deep learning [7-8]. The convolutional neural network has representation ability
    and can run shift-invariant classification of input according to its hierarchical
    structure. it is also known as ''Shift-invariant Artificial Neural Networks (SIANNN)''
    [9]. Below, we introduce Layers in CNN respectively:

