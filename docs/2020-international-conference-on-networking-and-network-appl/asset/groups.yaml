    1) Input layer: The input layer is of the entire neural network. In the convolutional
    network for image processing, it generates the pixel matrices of an image.


    2) Convolutional layer: The convolutional layer generally uses filters to extract
    abstract features. The forward propagation of the filter is the process of calculating
    the nodes in the output layer''s input matrix matrix. Generally, the filter uses
    3x3 or 5x5. Let''s show you how a 2x2*3 node becomes a 1x1 output unit. In formula
    (8), the weight of the first node of the output unit nodes, represents the first
    corresponding element. In formula (9), is the activation function. So the value
    of the first node is identity. Finally, the forward propagation of the convolutional
