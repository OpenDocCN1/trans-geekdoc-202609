  md: '1) Input layer: The input layer is of the entire neural network. In the convolutional
    network for image processing, it generates the pixel matrices of an image.


    2) Convolutional layer: The convolutional layer generally uses filters to extract
    abstract features. The forward propagation of the filter is the process of calculating
    the nodes in the output layer''s input matrix matrix. Generally, the filter uses
    3x3 or 5x5. Let''s show you how a 2x2*3 node becomes a 1x1 output unit. In formula
    (8), the weight of the first node of the output unit nodes, represents the first
    corresponding element. In formula (9), is the activation function. So the value
    of the first node is identity. Finally, the forward propagation of the convolutional
    layer is to move a filter from the upper left corner of the current layer to the
    lower right, and calculate each corresponding identity during the movement.


    ```

    $y = \sum w_{ij}x_{ij} + b$

    ```


    ```

    $g(t) = f(y)$

    ```


    3) Pooling layer: The function of pooling layer is to reduce the size of activation
    matrix. Effectively pooling is used to average pooling and max pooling. Because
    we apply the property of homomorphic encryption to CNN, but do not support the
    operation of taking the maximum value, the pooling layer of subsequent models
    will use all averaging pooling.


    4) Full connection layer: Each node in this is connected to all nodes in the next
    layer. We can use the convolutional layer and pooling layer mentioned above as
    the process of image feature extraction. After feature extraction, full connection
    layer is needed to complete classification.


    5) Activation layer: Activation functions are used to realize nonlinearity. There
    are several activation functions such as $ReLU(x) = max(0,x)$, $Tanh(2x-1)$. The
    activation function [1-12] is used in our model.


    According to the above introduction of concepts in CNN, we find that the forward
    propagation of CNN network performs two kinds of operations: weighted sum and
    addition multiplication for homomorphic encryption. In the weighted sum, it is
    very similar to the property of Paillier which is introduced in the previous section.
    According to the description of third section, we use code to encapsulate, so
    that the ciphertext can be added directly, and the final result is the same as
    obtained by performing the same operation. Because the activation function is
    nonlinear, it does not meet the property of homomorphic encryption mentioned above.
    Next, we propose a solution to this problem.


    # IV. THE PRACTICAL APPLICATION


    # A. MPC


    In order to combine the Paillier algorithm with CNN, we must solve the problem
    that the nonlinear activation function cannot satisfy the addition of homomorphic
    encryption and the property of scalar multiplication homomorphism.


    Thus, we draw Secure multi-party Computation (Secure Multi-party Computation referred
    as MPC). The root of MPC lie in Yao [13-14] which belongs to the millions of people
    who want to find out who is worth without revealing the amount of which. In terms,
    secure multi-party computation is a sub-domain of cryptography, which allows multiple
    parties to process data without trust, the results, and that neither party can
    get any information than what it deserves in others.


    Based on the above considering the actual application scenario, we design our
    own interactive structure. Structure in Figure 1 shows the architecture of party
    A and B [12]. The model owner can upload the model to the cloud, at the same time,
    the user can upload the encrypted data to the cloud for inference using the model,
    we return the result of the ciphertext to the user, the user has a key for encryption
    and decryption.


    ![](img/41a65dda49972fe2c7a242e2bc64b079_2_0.png)


    Fig. 1 Data transfer architecture.


    # B. Activation function processing


    We define E(x) and D(x) as encryption and decryption, respectively, and define
    A(x) as:


    ```

    $A(x) = \begin{cases} D(x) & 1 \ D(x) & 0 \end{cases} (10)

    ```


    In next cloud model, we can remove the activation function, and when the cloud
    returns to the layer containing activation functions (convolution and full connection
    layer), the calculation result of the convolutional layer is with formula (8)
    or the weighted sum of the unit is returned to the cloud for settlement, and the
    calculation result of x*A(x) is returned to the next layer of cloud input network
    for calculation. This operation until the last layer generates and decrypts it.'
