    \ homomorphic encryption refers to such encryption by adding and multiplying operations\
    \ on the ring, and then encptions the ciphertext after the result is equivalent.\
    \ Because of this, people can allow a third party to process the data without\
    \ revealing the information. Below we introduce the working steps and properties\
    \ of Paillier algorithm.\n\n# A. Key generation\n\nTake two large primes p and\
    \ q, and calculate their product N and the least common multiple $\\lambda$ of\
    \ p-1 and q-1\n\n```\n$N = pq$\n$\\lambda = \text{lcm}(p-1, q-1)$\n```\n\nIf an\
    \ integer $g \\in Z_N^*$ is randomly selected, $Z_{N^2}^*$ represents the set\
    \ of all Numbers in $Z_{N^2}$ that are interpolate with $N^2$, and $Z_{N}^*$ is\
    \ the integer less than $N^2$, where $\\lambda$ is the private key and $(N, g)$\
    \ is the public key.\n\n# B. The encryption process\n\nIf $m \\in Z_N$ is the\
    \ ciphertext to be encrypted, the encryption algorithm is as follows:\n\n```\n\
    $c = E[m,r] = g^m r^n \\pmod{N^2}$\n```\n\nAmong them:\n\n$m \\in Z_N^*$ is a\
    \ randomly selected integer, c is the encrypted data. For the same plaintext $c$,\
    \ c will be generated by the different ciphertext $c$ but the same can be restored\
    \ after decryption\n\n# Decryption process\n\nIf $c \\in Z_{N^2}$ is the ciphertext\
    \ to be decrypted, the decryption algorithm is as follows:\n\n```\n$L(u) = \\\
    frac{u-1}{N}$\n$L(c^\\lambda \\mod N^2) = L(g^m \\mod N^2) \\mod N$\n```\n\nWhere,\
