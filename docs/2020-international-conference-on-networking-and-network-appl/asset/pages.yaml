  md: '# V. EXPERIMENT


    In this section we introduce our experiment. We implement our scheme using Python3.6
    on a server with Intel(R) i7 CPU, 32G RAM, Nvidia GTX 2080Ti GPU. For simplicity,
    this experiment was tested on a computer, regardless of linkage and delivery time.


    generated after encrypting each pixel point. In fact, the encrypted image has
    lost its original information intuitively. However, to prevent the attacker from
    analyzing the original image through histogram, we have listed its histogram,
    in the third column of Fig. 4. It can be seen that the attacker cannot obtain
    the statistical features of the original image from the histogram. Thus, the security
    of uploading the sample can be guaranteed without the disclosure of private keys.


    # A. Model training


    MNIST handwritten character [14] was used to train the CNN network model which
    is shown in Fig. 2. The MNIST dataset contains 60000 handwritten digits. Each
    image is a 28*28 pixel array, where value of each is a positive integer in the
    range [0,255]. We used the training part of this dataset, consisting of 50,000
    images, to train the CNNs and the remaining 10,000 images for testing.


    ![](img/41a65dda49972fe2c7a242e2bc64b079_3_0.png)


    Fig. 2 CNN network architecture


    In the training process, batchsize=128, learning-rate=0.001, convolution kernel
    size (3,3,20),(3,5) were selected, using the pooling layer (2,2), and the stride
    length was 1. In order to enhance the generalization ability of the model, each
    pixel point is divided by 25, so that the value of the sample is between [0,1].
    The test dataset can reach a high accuracy of 99.62%, as shown in Fig. 3. This
    is of great importance to the substance process on the experiment sample. Finally,
    we trained the model locally to simulate the role of the cloud service provider.


    ![](img/41a65dda49972fe2c7a242e2bc64b079_3_1.png)


    Fig. 4. Sample, encrypted sample and encrypted sample histogram


    After loading the data from the cloud, the output of each layer of the model interacts
    with the local area, and the time for encryption and decryption has the greatest
    impact on the overall efficiency. According to the description in [1], it is necessary
    to note to maintain a persistent connection with the server, the attacker as user
    sends data to the cloud easily according to the result of the model parameters,
    so the inference process, we can show the full layer connection with the attacker
    with probability to join false neurons, or disturb neurons [14].


    ![](img/41a65dda49972fe2c7a242e2bc64b079_3_2.png)


    Fig. 5 Different layers of data dimensions


    ![](img/41a65dda49972fe2c7a242e2bc64b079_3_3.png)


    Fig. 3 Accuracy and loss curve during training


    # B. Model inference processes


    In the sample of MNIST, we used the Paillier homomorphic encryption to process
    each pixel once and then input the model for inference. But to facilitate analysis,
    here must ensure that the encrypted number [0,255], and we can use the cipher
    image to decrypt, but Paillier encryption in the ciphertext gets very large, so
    we can here the ciphertext for data 8-bit operation, guarantees in the image show
    each pixel gray value is between [0,255]. As shown in Fig. 4, the first column
    is our original handwritten character, and the second is the ciphertext sample


    It seems that the main factor determining the inference time of the model is the
    amount of data to be encrypted and decrypted as well as the number of times. According
    to our algorithm, the data quantity refers to the data dimension of each layer
    either the convolution and bias parameters of the model itself in inference. As
    shown in Fig. 5, we list the data size of each layer after the removing the activation
    layer. The number of encryption and decryption is related to the number of layers
    of Model as well. To, only need to process the data when it is uploaded to the
    cloud. The rest of the model needs to interact with the local interface for decryption
    except the activation layer. Number of times it needs to be decrypted is equal
    to the number of model layers.'
