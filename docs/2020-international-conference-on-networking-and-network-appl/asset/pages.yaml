    ```\n$D[E[m_i,r_i]E[m_j,r_j]] = m_i + m_j \\pmod N \\quad (7)\n```\n\n# D. Processing\
    \ of real numbers\n\nPaillier encryption is only defined for non-negative integers\
    \ less than N. Since we want to use signed integers and floating point numbers,\
    \ values should be encoded as a valid before encryption. The preprocessing of\
    \ negative and floating point numbers is:\n\n+   Signed integers are relatively\
    \ easy: we utilize the modular arithmetic properties of the Paillier encryption.\
    \ - We choose to represent integers between -N/3 and N/3 for decoding the resulting\
