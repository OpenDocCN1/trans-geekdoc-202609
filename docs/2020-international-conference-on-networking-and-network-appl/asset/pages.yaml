  md: 'Next, we discuss the optimization of encryption and decryption efficiency.
    In order to improve the encryption and decryption time, we use GMPY to optimize
    the homomorphism algorithm code. GMPY is superior to the C-Coded Python implementation
    which supports multiple-precision arithmetic. GMPY adds support for MR (the corrected
    real floating-point arithmetic) and MPC (complex floating-point libraries), which
    also updates the API and naming conventions to be more consistent and supports
    additional functions.


    We compare the time to encrypt a sample with and without GMPY. Table I shows the
    results of homomorphic encryption when keylength=302. It can be seen that in the
    case of not affecting the CPU and RAM memory, encryption and decryption time have
    a very significant difference. In the experiments, we are using GMPY optimized
    library for encryption and decryption work.


    # TABLE I. WHEN KEYLENGTH=302, THE EFFECT OF GMPY ON THE ENCRYPTION TIME OF A
    SAMPLE


    | Lib | RAM | Time |

    |---|---|---||

    | No GMPY | 10.6% | 166MB | 233.5s |

    | GMPY | 10.6% | 166MB | 24.37s |


    # TABLE II. THE IN OF KEY LENGTH ON THE EFFICIENCY OF SAMPLE ENCRYPTION AND DECRYPTION


    | Key length | 512 | 768 | 1024 | 2048 |

    |---|---|---|---|---||

    | 1 sample/s | 0.281 | 0.589 | 1.167 | 2.707 | 24.39 |

    | 64 samples | 13.175 | 37.506 | 72.286 | 146.562 | 529.103 |


    We have noticed that current asymmetric encryption is mainly based on the factorization
    of large prime numbers, and it is that encryption and decryption time increases
    rapidly with the increase of key length, the corresponding security also increases.
    In addition, the key length should not be too large to maintain the efficiency
    of the plaintext. According to the above, the gray value of the sample will be
    processed [0,1] before entering the model, so in the model process value, the
    generation is more important. For security, the key length is set 512 bit in the
    experiment. In the industrial production environment, the length of key length
    can be appropriately increased to the requirements of security.


