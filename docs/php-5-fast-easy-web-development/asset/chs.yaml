  \n## 检查 php.ini\n\n在开始使用会（sessions）之前，检查你的 `php.ini` 文件中的一个值。找到这段文本并仔细阅读：\n\n```ini\n\
  ; 传递给 save_handler 的参数。在文件的情况下，这是存储\n; 数据文件的路径。注意：Windows 用户必须更改此\n; 变量才能使用 PHP\
  \ 的会函数。\n\n[此处省略了更详细的文本]\n\nsession.save_path = /tmp\n```\n\n`php.ini` 文件中的内容本质上是，你必须修改\
  \ `session.save_path` 的值，以便文件可以写入一个存在的目录。此更改主要影响 Windows 用户，而且修改非常简单。\n\n在 `session.save_path`\
  \ 的 `=` 之后输入目录名称。例如，我在 Windows 上的 `php.ini` 文件包含：\n\n```ini\nsession.save_path =\
  \ c:\\temp\n```\n\n进行更改后，重启 Apache 使更改生效。如果你使用的是 Linux/Unix，`/tmp` 是一个标准目录，除非你出于某些迫切原因想要更改它，否则可以保持不变。\n\
  \n[](itss://chm/8934final/LiB0088.html)\n\n![](img/index-226_1.png)\n\n![](img/index-226_2.png)\n\
  \n![](img/index-226_3.png)\n\n![](img/index-226_4.png)\n\n![](img/index-226_5.png)\n\
  \n![](img/index-226_6.png)\n\n[](itss://chm/8934final/LiB0089.html)\n\n## 什么是会（Session）？\n\
  \n从时间角度来说，*session*（会）是指用户访问网站期间。在编程世界，会就像一个大数据块，可以包含各种变量和值。\n\n这个数据块有一个标识字符串，例如\
  \ `940f8b05a40d5119c030c9c7745aead9`。当会启动时，该标识字符串会自动发送给用户，通过名为 `PHPSESSID` 的 cookie（可以通过\
  \ `$_COOKIE[PHPSESSID]` 访问）。\n\n在服务器端，会创建一个同名的临时文件（`940f8b05a40d5119c030c9c7745aead9`）。\n\
  \n[](itss://chm/8934final/LiB0089.html)\n\n![](img/index-227_1.png)\n\n![](img/index-227_2.png)\n\
  \n![](img/index-227_3.png)\n\n[](itss://chm/8934final/LiB0090.html)\n\n## 理解会变量（Session\
  \ Variables）\n\n在 Web 服务器上的临时文件中存储了会变量（及其值）。由于这些值和变量没有保存在数据库中，因此不需要额外的系统资源来连接和从数据库表中提取信息。你可以通过\
  \ `$_SESSION` 超全局变量访问会变量。\n\n例如，一个临时会文件可能包含以下内容：\n\n```\ncount|s:7:\"76\";\nvalid|s:7:\"\
  yes\";\n```\n\n在这个示例中，`count` 和 `valid` 是会变量名，`76` 和 `yes` 是它们对应的值。然而，为了将变量放入会，你必须显式地将其添加到\
  \ `$_SESSION` 超全局变量中。一旦添加，就可以提取该值（如示例中的 `$_SESSION[count]` 所示所示）。\n\n当你尝试检索会变量时，序列如下（假设你想获取\
  \ `$_SESSION[count]` 的值）：\n\n1. PHP 解析器从用户 cookie 获取 `PHPSESSID`。\n2. PHP 解析器找到匹配的临时文件。\n\
  3. 在会文件中，PHP 解析器查找 `count` 并找到其值（例如 `76`）。\n4. `$_SESSION[count]` 等于 `76`。\n\n接下来，使用会启动你自己的用户计数脚本。\n\
  \n## 启动会\n\n启动会非常简单。你只需调用 `session_start()` 函数，PHP 就会处理剩下的工作：发送 cookie 并创建临时文件。\n\
  \n1. 在你的文本编辑器中打开一个文件，启动 PHP 块，然后调用 `session_start()` 函数：\n\n```php\n<?php\nsession_start();\n\
  ```\n\n**注意** `session_start()` 函数实际上执行了多项任务。首先，它确定当前用户是否已启动会，如果有必要则启动一个。由于 `session_start()`\
  \ 的用途，请在所有会相关的脚本开头使用它。\n\n2. 创建包含消息的字符串，然后关闭 PHP 块：\n\n```php\n$msg = \"started\
  \ a session...\";\n?>\n```\n\n3. 输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Start\
  \ a Session</TITLE>\n</HEAD>\n<BODY>\n```\n\n4. 显示消息字符串：\n\n```php\n<?php echo \"\
  $msg\"; ?>\n```\n\n5. 添加一些 HTML 使文档合法：\n\n```html\n</BODY>\n</HTML>\n```\n\n6. 将文件保存为\
  \ `session.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n![](img/index-228_1.jpg)\n\n![](img/index-228_2.jpg)\n\
  \n7. 打开浏览器并输入 [`127.0.0.1/session.php`](http://127.0.0.1/session.php)。\n\n如果你在上次脚本和现在之间没有关闭浏览器，你的旧会将保持激活状态，你不会看到\
  \ cookie 对话框。你应该只会看到下图（或适用于你浏览器的界面）。点击“允许”后，消息将显示。\n\n这是否有启发性？在下一节中，注册注册实际的值并观察它的变化。\n\
  \n## 注册和修改会变量\n\n此脚本的目标是在会期间注册变量并更改它。\n\n1. 在文本编辑器中打开一个文件，启动 PHP 块，然后调用 `session_start()`\
  \ 函数：\n\n```php\n<?php\nsession_start();\n```\n\n2. 注册变量 `count`：\n\n```php\nsession_register('count');\n\
  ```\n\n**注意** 现在，只要这个会存在，变量 `$_SESSION[count]` 均可用。目前该变量没有值。\n\n3. 增加 `$_SESSION['count']`\
  \ 的值：\n\n```php\n$_SESSION['count]++;\n```\n\n4. 创建包含消息的字符串，包括 `$_SESSION[count]`\
  \ 的值：\n\n```php\n$msg = \"<P>You've been here \".$SESSION['count'].\"times. Thanks!</p>\"\
  ;\n```\n\n5. 关闭 PHP 块并输入以下 HTML：\n\n```html\n?>\n<HTML>\n<HEAD>\n<TITLE>Count Me!</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n6. 显示消息字符串：\n\n```php\n<?php echo \"$msg\"; ?>\n```\n\n\
  7. 添加一些 HTML 使文档合法：\n\n```html\n</BODY>\n</HTML>\n```\n\n8. 将文件保存为 `countme.php`，并将此文件放在你的\
  \ Web 服务器的文档根目录下。\n\n9. 打开浏览器并输入 [`127.0.0.1/countme.php`](http://127.0.0.1/countme.php)。\n\
  \n除非你在上次脚本和现在之间关闭了浏览器，否则你的旧会将处于激活状态，你不会看到 cookie 对话框。你应该只会看到下图。\n\n![](img/index-230_1.jpg)\n\
  \n![](img/index-230_2.jpg)\n\n![](img/index-230_3.png)\n\n![](img/index-230_4.png)\n\
  \n![](img/index-230_5.png)\n\n多次刷新页面，观察计数器在每次刷新后如何增加 1。例如，我刷新了页面八次，最后看到了下一页显示的图形。在下一节中，你处理的不仅仅是访问计数——你是在用户会期间设置并显示用户偏好。\n\
  \n## 使用会管理用户偏好\n\n除了简单的访问计数器，你还可以在用户访问你的网站时管理他们的偏好。在这个三步示例中，你将启动一个会，询问用户的字体族和基础字体大小偏好，在后续页面上显示这些偏好，并允许用户改变主意并重置值。\n\
  \n### 启动会并注册默认值\n\n在此脚本中，你将启动会并注册 `font_family` 和 `font_size` 变量。显示的 HTML 将是一个允许你更改偏好的表单。\n\
  \n1. 在你的文本编辑器中打开一个文件，启动 PHP 块，然后调用 `session_start()` 函数：\n\n```php\n<?php\nsession_start();\n\
  ```\n\n\n\n\n\n2. 启动一个 `if...else` 块来检查 `font_family` 和 `font_size` 之前的值。如果当前会话中不存在值，则分配默认值并将其添加：\n\
  \n```php\nif ((!$_SESSION['font_family']) || (!$_SESSION['font_size'])) {\n    $font_family\
  \ = \"sans-serif\";\n    $font_size = \"10\";\n    $_SESSION['font_family'] = $font_family;\n\
  \    $_SESSION['font_size'] = $font_size;\n}\n```\n\n3. 如果确实存在值，从 `$_SESSION` 超全局变量中提取这些值：\n\
  ```php\n} else {\n    $font_family = $_SESSION['font_family'];\n    $font_size =\
  \ $_SESSION['font_size'];\n}\n```\n\n**注意** 因为用户将返回此脚本以重置她的显示偏好，你必须考虑到变量值必须始终从会话本身提取。如果你只是简单将变量添加到会话而不检查之前的值，那么每次加载页面时，这些变量的值都会被覆盖为空字符串。\n\
  \n4. 关闭 PHP 块并输入以下 HTML：\n```html\n?>\n<HTML>\n<HEAD>\n<TITLE>My Display Preferences</TITLE>\n\
  ```\n\n5. 创建一个样式表块，以 `<STYLE>` 标签开始：\n```html\n<STYLE type=\"text/css\">\n```\n\n\
  6. 为 `BODY`、`P` 和 `A` 标签添加样式表项目。混合 HTML 和 PHP 以显示 `$font_family` 和 `$font_size`\
  \ 的当前值：\n```css\nBODY, P, A {font-family:<? echo \"$font_family\"; ?>;\nfont-size:<?\
  \ echo \"$font_size\"; ?>pt;font-weight:normal;}\n```\n\n7. 为 `H1` 标签添加样式表项目。混合\
  \ HTML 和 PHP 以显示 `$font_family` 的值和修改后的 `$font_size`（基础值加 4）：\n```css\nH1 {font-family:<?\
  \ echo \"$font_family\"; ?>;\nfont-size:<? echo $font_size + 4; ?>pt;font-weight:bold;}\n\
  ```\n\n8. 关闭 `</STYLE>` 标签并继续编写 HTML，添加一个标题并开始表单。假设表单方法为 `POST` 且动为 `session02.php`：\n\
