  \n2. 点击“发送通讯”按钮提交表单。你将看到已发送通讯的电子邮件地址的确认。\n\n3. 如果你的地址在订阅者表中，请检查你的邮箱。\n\n![](img/index-322_1.jpg)\n\
  ![](img/index-322_2.png)\n![](img/index-322_3.png)\n![](img/index-322_4.png)\n\n\
  你应该在信箱中收到一封格式精美的通讯！\n\n### 故障排除你的邮件列表机制\n\n如果你收到如“Warning: Can't connect”（无法连接）之类的错误，你必须确保已修改了\
  \ `php.ini` 文件中的 SMTP 值。这个主题在第 8 章，“发送电子邮件”中介绍，这是一个简单的修复方法。\n\n使用这种邮件列表机制时的另一个常见问题是，如果你的列表足够长，脚本将会超时。这就是为什么不要使用这种机制向大型接收者列表发送通讯的原因之一。因为此脚本所做的只是多次执行\
  \ `mail()` 函数，它没有考虑到真实邮件列表软件中的队列因素，而后者的设计是为了减轻你发件邮件服务器的负担。\n\n为了解决脚本超时的问题，你可以在脚本执行期间重置计时器。基本上，通过在\
  \ `while` 循环中插入以下行，你可以在每次调用 `mail()` 函数之前将计时器重置为 0：\n\n```php\nset_time_limit(0);\n\
  ```\n\n你的 `while` 循环现在看起来是：\n\n```php\nwhile ($row = mysql_fetch_array($result))\
  \ {\n    set_time_limit(0);\n    $email_addr = $row['email\\_addr'];\n    mail(\"\
  $email_addr\", stripslashes($_POST[$subject]),\n    stripslashes($_POST['newsletter']),\
  \ $headers);\n    echo \"newsletter sent to: $email_addr<br>\";\n}\n```\n\n记住，这并不能减轻发件邮件服务器的负担。它只是允许脚本在可能会超时的情况下继续运行。\n\
  \n在下一章中，你将处理另一个项目。当你创建一个网站时，你会想要知道关于访问者的数字——谁、什么、在哪里以及如何。你的下一个项目将是为这些指标构建一个自定义的报告机制。\n\
