  [](itss://chm/8934final/LiB018)\n\n# 第 24 章：创建自定义日志和报告\n\n### 概述\n\n如果你正在为公众构建网站，你很可能想知道哪些部分最受欢迎，等等。虽然许多工具记录了访问，但你可以创建一些代码段将特定信息存储在数据库中。在本章中，你学习：\n\
  \n* 创建简单的访问计数机制\n* 在页面上显示访问计数\n* 跟踪表单提交\n\n### 使用 MySQL 进行访问计数\n\n为了获取网站特定子部分的访问信息，即使只是主页，你可以创建一个简单的数据库表和相应的\
  \ PHP 代码段。\n\n### 创建数据库表\n\n使用现在熟悉的表格创建过程，首先你将创建一个简单的数据库表来保存所有的访问记录。\n\n1. 打开你的网络浏览器并输入\
  \ [**http://127.0.0.1/show\\_createtable.html**](http://127.0.0.1/show_createtable.html)。\n\
  2. 在表名字段中输入 **page\\_track**。\n3. 在字段数量字段中输入 **5**。\n4. 点击“转到第 2 步”按钮。你应该看到一个包含五行的表单，对应你想在\
  \ page\\_track 表中创建的五个字段。\n\n\n\n\n2. 在第一行中，为字段名称（Field Name）输入 `page_name`，在字段类型（Field\
  \ Type）下拉菜单中选择 `varchar`，并指定字段长度（Field Length）为 50。\n\n3. 在第二行中，为字段名称输入 `page_desc`，并在字段类型下拉菜单中选择\
  \ `text`。\n\n4. 在第三行中，为字段名称输入 `user_agent`，并在字段类型下拉菜单中选择 `text`。\n\n5. 在第四行中，为字段名称输入\
  \ `date_added`，并在字段类型下拉菜单中选择 `date`。\n\n完成后的表单应该如所示所示。\n\n6. 点击 `Create Table`（创建表格）按钮创建\
  \ `page_track` 表。\n\n![](img/index-326_1.jpg)\n\n在下一节中，你将创建一个代码片段，将跟踪信息写入 `page_track`\
  \ 表。\n\n### 创建代码片段\n\n“代码片段”（Code snippet）是一个高度技术性的术语，意思是“一小段代码”。我关于“高度技术性”部分是开玩笑的，但代码片段通常不符合长脚本的标准。相反，它只是为了一个简单的目的。在这种情况下，你的代码片段将向\
  \ `page_track` 表写入一些基本信息，然后愉快地显示一些相当无聊的 HTML。\n\n1. 在你的文本编辑器中打开新文件，并开始一个 PHP ：\n\
  \n```php\n<?\n```\n\n2. 创建四个变量，对应 `page_track` 表中的四个非 ID 字段，并给它们赋予一些值：\n\n```php\n\
  $page_name = \"sample 1\";\n$page_desc = \"This is a sample page of no use.\";\n\
  $user_agent = getenv(\"HTTP_USER_AGENT\");\n$date_added = date(\"Y-m-d\");\n```\n\
  \n3. 创建变量来存储表所在的数据库名称以及表本身：\n\n```php\n$db_name = \"testDB\";\n$table_name = \"\
  page_track\";\n```\n\n4. 按照你之前的方法添加连接信息：\n\n```php\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\") or die(mysql_error());\n```\n\n5. 按照你学到的方法选择数据库：\n\
  \n```php\n$db = @mysql_select_db($db_name, $connection) or die(mysql_error());\n\
  ```\n\n6. 创建一个 SQL 语句，将值插入 `page_track` 表的四个字段中，将 ID 字段留空以便自动增加：\n\n```php\n$sql\
  \ = \"insert into $table_name values('', '$page_name', '$page_desc', '$user_agent',\
  \ '$date_added')\";\n```\n\n7. 执行查询，然后关闭 PHP 块：\n\n```php\n$result = @mysql_query($sql,$connection)\
  \ or die(mysql_error());\n?>\n```\n\n你刚刚创建了代码片段，它看起来应该是这样的：\n\n```php\n<?\n//set\
  \ up static variables\n$page_name = \"sample 1\";\n$page_desc = \"This is a sample\
  \ page of no use.\";\n$user_agent = getenv(\"HTTP_USER_AGENT\");\n$date_added =\
  \ date(\"Y-m-d\");\n\n//set up table and database names\n$db_name = \"testDB\";\n\
  $table_name = \"page_track\";\n\n//connect to server and select database\n$connection\
  \ = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\") or die(mysql_error());\n\
  $db = @mysql_select_db($db_name, $connection) or die(mysql_error());\n\n//build\
  \ and issue query\n$sql = \"insert into $table_name values('', '$page_name', '$page_desc',\
  \ '$user_agent', '$date_added')\";\n$result = @mysql_query($sql,$connection) or\
  \ die(mysql_error());\n?>\n```\n\n现在在代码片段之后直接创建一些填充用的 HTML：\n\n```html\n<HTML>\n\
  <HEAD>\n<TITLE>Sample Page #1</TITLE>\n</HEAD>\n<BODY>\n<h1>Useless Sample Page\
  \ #1</h1>\n<P>This sample page serves no real purpose!</p>\n</BODY>\n</HTML>\n```\n\
  \n将文件保存为 `sample_page1.php`，并将其放在你的 Web 服务器的文档根目录下。为了让你的报告更有趣，再创建一个这样的示例文件，这样你就有比这一个文件更多的内容可以计数。将\
  \ `sample_page1.php` 复制为 `sample_page2.php`，并将 `sample_page2.php` 中的前两个变量更改为如下：\n\
  \n```php\n$page_name = \"sample 2\";\n$page_desc = \"Another useless sample page.\"\
  ;\n```\n\n将 `sample_page2.php` 中的 HTML 块替换为此内容：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Sample\
  \ Page #2</TITLE>\n</HEAD>\n<BODY>\n<h1>Useless Sample Page #2</h1>\n<P>I can't\
  \ believe how useless this page is!</p>\n</BODY>\n</HTML>\n```\n\n现在保存此文件并将其将其放在你的\
  \ Web 服务器的文档根目录下。接下来，你将多次访问这些页面以启动内部计数。\n\n1. 打开你的浏览器并输入 `http://127.0.0.1/sample_page1.php`。\n\
  \n2. 打开你的浏览器并输入 `http://127.0.0.1/sample_page2.php`。\n\n\n\n\n你已经在 `page_track`\
  \ 表中拥有了所有这些很棒的数据，现在是时候创建一个简单的页面来为你统计所有数据了。既然已经这么简单，你不需要费力筛选晦涩的 Apache 访问日志，或安装额外的软件软件包来显示统计数据！\n\
  \n首先从对你跟踪的页面总访问次数（包含所有项）进行简单计数开始。\n\n1. 在你的文本编辑器中打开一个新文件，并开始一个 PHP 块：\n\n```php\n\
  <?\n```\n\n2. 创建变量来存储表所在的数据库名称，以及表本身：\n\n```php\n$db_name = \"testDB\";\n$table_name\
  \ = \"page_track\";\n```\n\n3. 按照你之前的方法添加连接信息：\n\n```php\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n```\n\n4. 按照你学过的方法选择数据库：\n\
  \n```php\n$db = @mysql_select_db($db_name, $connection) or die(mysql_error());\n\
  ```\n\n5. 创建一个 SQL 语句来统计 page_track 表中的所有记录：\n\n```php\n$count_sql = \"select count(page_name)\
  \ from $table_name\";\n```\n\n6. 执行查询：\n\n```php\n$count_res = @mysql_query($count_sql,\
  \ $connection) or die(mysql_error());\n```\n\n7. 创建一个变量来存储当前结果集中的特定计数，然后关闭 PHP 块：\n\
  \n```php\n$all_count = @mysql_result($count_res, 0, \"count(page_name)\");\n?>\n\
  ```\n\n8. 添加这些 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>My Access Report</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>My Access Report</h1>\n```\n\n9. 将 HTML 和 PHP 混合，打印表名以及表中被跟踪的访问次数：\n\
  \n```html\n<P><strong>Total Accesses Tracked in\n<? echo \"$table_name\"; ?>:</strong>\
  \ <? echo \"$all_count\"; ?></p>\n```\n\n10. 添加更多的 HTML 以使文档合法：\n\n```html\n</BODY>\n\
  </HTML>\n```\n\n11. 将文件保存为 `access_report.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n你的代码看起来应该是：\n\
  \n```php\n<?\n//set up table and database names\n$db_name = \"testDB\";\n$table_name\
  \ = \"page_track\";\n//connect to server and select database\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or die(mysql_error());\n//issue query and select results\n$count_sql\
  \ = \"select count(page_name) from $table_name\";\n$count_res = @mysql_query($count_sql,\
  \ $connection) or die(mysql_error());\n$all_count = @mysql_result($count_res, 0,\
  \ \"count(page_name)\");\n?>\n\n<HTML>\n<HEAD>\n<TITLE>My Access Report</TITLE>\n\
  </HEAD>\n<BODY>\n![](img/index-332_1.jpg)\n<h1>My Access Report</h1>\n<P><strong>Total\
  \ Accesses Tracked in <? echo \"$table_name\";\n?>:</strong> <? echo \"$all_count\"\
  ; ?></p>\n</BODY>\n</HTML>\n```\n\n接下来，测试它！打开你的 浏览器并输入 [`127.0.0.1/access_report.php`](http://127.0.0.1/access_report.php)。\n\
  \n你会看到一个带有标题和一些文本的 HTML 页面，随后是你对所有页面的访问计数。在这个示例中，我访问了两个示例页面总共 12 次。\n\n### 显示用户代理\
  \ (User Agents)\n\n在本节中，你对 access_report.php 脚本进行一些细微修改，以显示并统计访问你页面的不同 Web 浏览器。\n\
  \n1. 在你的文本编辑器中打开 access_report.php。\n\n2. 在 PHP 闭合标签之前，创建一个 SQL 语句，用于查找 page_track\
  \ 表中 `user_agent` 字段中的所有唯一记录，统计这些记录，并按降序返回结果：\n\n```php\n$user_agent_sql = \"select\
  \ distinct user_agent, count(user_agent) as count\nfrom $table_name group by user_agent\
  \ order by count desc\";\n```\n\n3. 执行查询：\n\n```php\n$user_agent_res = @mysql_query($user_agent_sql,\
  \ $connection)\nor die(mysql_error());\n```\n\n4. 稍后你将在 `while` 块内创建一个符号列表。先在 `while`\
  \ 块外部开始符号列表：\n\n```php\n$user_agent_block = \"<ul>\";\n```\n\n5. 开始 `while` 循环。`while`\
  \ 循环将为结果集 ($user_agent_res) 中的每个记录创建一个名为 `$row_ua` 的数组：\n\n```php\nwhile ($row_ua\
  \ = mysql_fetch_array($user_agent_res)) {\n```\n\n6. 获取记录的各个元素并给它们起好名字：\n\n```php\n\
  $user_agent = $row_ua['user_agent'];\n```\n\n7. 在 `while` 块中通过创建一个符号项来向 `$user_agent_block`\
  \ 添加内容。该符号项将显示用户代理名称。然后，该符号项将显示该用户代理的访问次数。在向 `$user_agent_block` 添加后，关闭 `while`\
  \ 循环：\n\n```php\n$user_count = $row_ua['count'];\n$user_agent_block .= \"\n<li>$user_agent\n\
  <ul>\n<li>$user_count\n</ul>\";\n}\n```\n\n8. 关闭你创建的符号列表：\n\n```php\n$user_agent_block\
  \ .= \"</ul>\";\n```\n\n9. 在 HTML 部分添加以下内容，然后保存文件：\n\n```html\n<P><strong>Browsers\
  \ Used:</strong>\n<? echo \"$user_agent_block\"; ?>\n```\n\n你的代码看起来应该是这样的：\n\n```php\n\
  <?\n//set up table and database names\n$db_name = \"testDB\";\n$table_name = \"\
  page_track\";\n//connect to server and select database\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or die(mysql_error());\n//issue query and select results\n$count_sql\
  \ = \"select count(page_name) from $table_name\";\n$count_res = @mysql_query($count_sql,\
  \ $connection) or die(mysql_error());\n$all_count = @mysql_result($count_res, 0,\
  \ \"count(page_name)\");\n//issue query and select results for user agents\n$user_agent_sql\
  \ = \"select distinct user_agent, count(user_agent) as count\nfrom $table_name group\
  \ by user_agent order by count desc\";\n$user_agent_res = @mysql_query($user_agent_sql,\
  \ $connection)\nor die(mysql_error());\n//start agent block\n$user_agent_block =\
  \ \"<ul>\";\n//loop through results\nwhile ($row_ua = mysql_fetch_array($user_agent_res))\
  \ {\n$user_agent = $row_ua['user_agent'];\n$user_count = $row_ua['count'];\n$user_agent_block\
  \ .= \"\n<li>$user_agent\n<ul>\n<li>$user_count\n</ul>\";\n}\n//finish up user block\n\
  $user_agent_block .= \"</ul>\";\n?>\n\n<HTML>\n<HEAD>\n<TITLE>My Access Report</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>My Access Report</h1>\n<P><strong>Total Accesses Tracked in\
  \ <? echo \"$table_name\";\n?>:</strong> <? echo \"$all_count\"; ?></p>\n<P><strong>Browsers\
  \ Used:</strong>\n<? echo \"$user_agent_block\"; ?>\n</BODY>\n</HTML>\n```\n\n![](img/index-334_1.jpg)\n\
  \n\n\n\n```php\n$page_name_block = \"<ul>\";\n```\n\n### 5. 开始 while 循环\nwhile 循环将为结果集\
  \ (`$page_name_res`) 中的每条记录创建一个数组 `$row_pn`：\n\n```php\nwhile ($row_pn = mysql_fetch_array($page_name_res))\
  \ {\n```\n\n### 6. 获取记录的各个元素并给它们起好名字：\n```php\n$page_name = $row_pn['page_name'];\n\
  $page_desc = $row_pn['page_desc'];\n$page_count = $row_pn['count'];\n```\n\n###\
  \ 7. 添加到 $page_name_block\n通过创建一个列表项目和一个额外的项目列表来实现。列表项目将显示所访问的页面名称。然后，第二个项目列表将显示该页面的访问次数。在添加到\
  \ `$page_name_block` 后，关闭 while 循环：\n\n```php\n$page_name_block .= \"\n<li>$page_name\
  \ (\\\"$page_desc\\\")\n<ul>\n<li><em>accesses per page: $page_count</em>\n</ul>\"\
  ;\n}\n```\n\n### 8. 关闭你在 $page_name_block 中创建的项目列表：\n```php\n$page_name_block .=\
  \ \"</ul>\";\n```\n\n### 9. 在 HTML 部分添加以下内容，然后保存文件：\n```html\n<P><strong>Individual\
  \ Pages:</strong>\n\n<?php echo \"$page_name_block\"; ?>\n```\n\n你的新代码应该像这样：\n\n\
  ```php\n<?\n//设置表名和数据库名\n$db_name = \"testDB\";\n$table_name = \"page_track\";\n\
  \n//连接到服务器并选择数据库\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\"\
  )\nor die(mysql_error());\n$db = @mysql_select_db($db_name, $connection) or die(mysql_error());\n\
  \n// 发布查询并选择数量统计结果\n$count_sql = \"select count(page_name) from $table_name\";\n\
  $count_res = @mysql_query($count_sql, $connection) or die(mysql_error());\n$all_count\
  \ = @mysql_result($count_res, 0, \"count(page_name)\");\n\n// 发布查询并选择用户代理统计结果\n\
  $user_agent_sql = \"select distinct user_agent, count(user_agent) as count\nfrom\
