  \n![](img/index-11_6.png)\n\n# 谁应该读这本书？\n\n本书专为对 Web 开发环境概念有一般了解的人士设计，无论是 Linux/Unix\
  \ 还是 Windows。安装和配置相关的章节假设你熟悉自己的操作系统以及构建（Linux/Unix 系统上）或安装（Windows 上）软件的基本方法。\n\n\
  讨论如何使用 PHP 编程的章节占据了大部分内容，假设读者没有先验知识。\n\n\n\n\n这种语言。然而，如果你具有其他编程语言（如 `C` 或 `Perl`）的经验，你会发现这些课程非常简单。同样，如果你使用过其他数据库（如\
  \ `Oracle` 或 `Microsoft SQL Server`），那么在学习 MySQL 相关的章节时，你将拥有良好的基础。\n\n在阅读本书之前，唯一的要求是你理解如何使用\
  \ `HTML` 创建静态网页内容。如果你刚刚开始进入 Web 开发的大门，你仍然可以使用这本书，但你应该考虑先学习 `HTML` 教程。如果你能够熟练创建基础文档并将其上传到你的\
  \ Web 服务器，那么你就没问题了。\n\n[](itss://chm/8934final/LiB0006.html)\n\n![](img/index-12_1.png)\n\
