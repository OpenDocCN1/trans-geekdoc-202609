  \n# 第一部分：入门\n\n### 概述\n\n由于其效率和易用性，MySQL 是大多数 Web 开发者的选择数据库。此外，MySQL 是免费的，运行在多个平台上，并且其文档非常出色。在使用\
  \ PHP 时，最好的方法是在开发机上设置 MySQL，以便更好地理解过程。为此，如果你有 Linux 工作站或服务器，MySQL 可能已经包含在操作系统发行版中，你可能已经安装了它。在这种情况下，你应该检查\
  \ MySQL 网站，并在有新版本时下载。\n\n本章中的安装说明基于 MySQL AB 分发的 MySQL 4.0.x 版本。\n\n**注意** 如果你的\
  \ ISP 使用 MySQL 而他们仍在使用 3.23 版本，不要担心——可以使用书中所有的数据库示例。\n\n## 章节列表\n\n- 第 1 章， 安装与配置\n\
  - 第 2 章， 安装 Apache\n- 第 3 章， 安装 PHP\n- 第 4 章， 创建示例数据库\n- 第 5 章， 创建示例表\n- 第 6 章，\
  \ MySQL 在 MySQL (Windows 或 Linux)\n- 第 7 章， MySQL 在 MySQL\n- 第 8 章， 总结\n\n## 在 Windows\
  \ 上安装 MySQL\n\n在 Windows 95/98/NT/2000/XP/2003 上的 MySQL 安装过程基于提供的可执行设置程序\n\n\n\n\
  \n\n由 MySQL AB 提供。一旦下载了 zip 压缩，你只需要将其内容解压到临时目录并运行 `setup.exe` 应用程序。在 `setup.exe`\
  \ 应用程序安装完 MySQL 服务器和客户端程序后，你就可以启动 MySQL 服务器了。\n\n1.  访问 MySQL 4.0.x 下载页面，地址为 [`www.mysql.com/downloads/`](http://www.mysql.com/downloads/)\
  \ mysql-4.0.html，并找到页面上的 Windows 部分。有两个选项；你想要那个没有标记“without installer”（不带安装程序）的选项。换句话说，你想要安装程序版本，但它没有被明确命名。\n\
  \n2.  点击 `Download` 链接将带你进入镜像站点页面。选择离你最近的镜像站点，点击 `HTTP` 或 `FTP` 链接下载文件。使用 `HTTP`\
  \ 方法通常速度更快。\n\n3.  一旦 zip 文件下载到你的硬盘上，请将其内容解压到临时目录。\n\n4.  从临时目录找到 `setup.exe` 文件并双击它开始安装。你将看到安装向导的第一个界面，如下所示。点击\
  \ Next 继续。\n\n5.  安装过程的第二个屏幕包含有关安装位置的宝贵信息。默认安装位置是 `C:\\mysql`，但如果你计划将 MySQL 安装在不同的位置，此屏幕将显示你必须自行进行的一些更改。此屏幕的信息对于想要将\
  \ MySQL 启动服务的 Windows NT 用户来说也重要。阅读这些信息并记录与你情况相关的内容，然后点击 Next 继续。\n\n![](img/index-19_1.jpg)\n\
  \n![](img/index-19_2.jpg)\n\n![](img/index-19_3.jpg)\n\n6.  在安装过程的第三个屏幕，你可以选择安装位置。如果你想将\
  \ MySQL 安装在默认位置，点击 Next 继续。否则，点击 `Browse` 并导航到你选择的位置，然后点击 Next 继续。\n\n7.  第四个屏幕让你选择安装方法——典型（Typical）、紧（Compact）或自定义（Custom）。选择\
  \ `Typical`，并点击 Next 继续。\n\n![](img/index-20_1.jpg)\n![](img/index-20_2.jpg)\n\n\
  8.  现在安装过程将接管并将文件安装到相应的位置。当过程完成后，你将看到完成确认。点击 Finish 完成设置过程。\n\nMySQL 现在已安装在你的系统上。然而，从\
  \ MySQL AB 安装 MySQL 后，你不会在 Windows 开始菜单中找到任何快捷方式，因此现在你必须手动启动过程。如果你导航到 `C:\\mysqlbin`\
  \ 目录，你会发现许多已就绪的应用程序。这些应用程序之一名为 `WinMySQLadmin`，它是刚开始使用 MySQL 的 Windows 用户的极朋友。如果你双击此文件，它将启动\
  \ MySQL 服务器 并在任务栏中放置一个红绿灯图标。如果你右键点击此图标，可以启动图形用户界面来维护和监控你的新服务器。\n\n**注意** 第一次访问 `WinMySQLadmin`\
  \ 时，它会要求你创建一个用户名和密码。选择一个用户名/密码对并继续。\n\n`WinMySQLadmin` 会自动解释环境信息，例如 IP 地址、机器名称等。顶部的标签允许你查看系统信息并编辑\
  \ MySQL 配置选项。要关闭 MySQL 服务器和/或 `WinMySQLadmin` 工具，再次右键点击任务栏中的红绿灯图标并选择相应的选项。只要 MySQL\
  \ 服务器正在运行，你就可以通过控制窗口运行额外的应用程序，例如 MySQL 监器。\n\n在下一节中，你将学习如何手动启动 MySQL 并执行一些操作以熟悉该系统。\n\
  \n### 测试你的 MySQL 安装\n\n在本节中，你将在控制台窗口通过命令行使用 MySQL 实用程序。在 PHP 中使用 MySQL 时，你将发布相同类型的命令，只是在\
  \ PHP 代码的上下文中。利用本\n\n![](img/index-21_1.jpg) 节的信息来熟悉你将在书中后面要处理的命令类型和响应。\n\n### 启动\
  \ MySQL\n\n要手动启动 MySQL（不使用之前描述的 GUI），进入 Windows 开始菜单，选择“运行”，输入 `c:\\mysql\\bin`\
  \ 并回车。\n\n**注意** 如果你将 MySQL 安装在不同的目录，请在之前的命令中替换该目录名称。\n\nMySQL 进程现在后台运行。你现在可以连接到\
  \ MySQL 并创建数据库和表。\n\n## 创建测试数据库\n\n在继续之前，你应该了解以下内容：\n- 数据库是表的集合。\n- 表包含一组记录，也称为行。\n\
  - 所有记录具有相同数量的字段。\n- 每个字段对数据的一部分进行分类。\n\n在本节中，你将攻克第一个元素并创建一个数据库。使用的实用程序是 `mysqladmin`\
  \ 程序，它允许你从命令行管理 MySQL。\n\n进入 Windows 开始菜单，选择“运行”，输入 `mysqladmin create testDB` 并回车。\n\
  \n命令处理完毕后，窗口将短暂闪烁并关闭。接下来，你添加一个表。\n\n## 创建测试表\n\n在本节中，你将在数据库中创建一个表。使用的实用程序是 `mysql`\
  \ 程序，它允许你从命令行管理 MySQL。\n\n1.  进入 Windows 开始菜单，选择“运行”，输入 `mysql` 并回车。\n\n当 MySQL\
  \ 监器启动时，它会提供自己的提示符。习惯用分号（`;`）结束你的命令，因为。\n\n2.  在提示符处输入 `use testDB`; 并回车。\n\n![](img/index-22_1.jpg)\n\
  ![](img/index-22_2.jpg)\n\n如果数据库存在且你有权限访问它，MySQL 监器将响应 Database changed。\n\n现在既然你已经连接到\
  \ MySQL 监器，你需要告诉它使用哪个数据库。等等，我们已经这样做过了。通过输入 `show tables` 并回车来验证表。\n\nMySQL 监器将响应当前数据库中所有表的列表。\n\
  \n是时候创建一个表了。此表将有一个用于 ID 的列和一个用于文本的列。\n\n**注意** 关于创建表细节的更多信息，请参阅 附录 D，“数据库规范化和 SQL\
  \ 参考”。\n\n3.  在提示符处输入 `create table test_table (test_id int, test_note text);` 并回车。\n\
  \n此语句创建了一个名为 `test_table` 的表。在表中，它创建了一个类型为 `int`（整数）的 `test_id` 列。它还创建了一个类型为 `text`\
  \ 的 `test_note` 列。\n\nMySQL 监器将响应 Query OK。它还会告诉你影响了多少行以及完成任务花费多长时间。\n\n4.  要验证特定表中的字段名和类型，使用\
  \ `explain` 命令。在这种情况下，输入 `explain test_table;` 并回车。\n\n![](img/index-23_1.jpg)\n\
  ![](img/index-23_2.jpg)\n\nMySQL 监器将响应所选表中所有字段及其类型的列表。这是一个非常实用的命令，用于跟踪你的表设计。\n\n\
  是时候向你的表中插入几行数据了，因为这正变得相当无聊。第一行的 ID 将为 1，注释将是“This is a note.”。\n\n6.  要插入此行，输入 `insert\
  \ into test_table values('1', 'This is a note.');` 并回车。\n\nMySQL 监器将响应 Query OK。它还会告诉你影响了多少行以及完成任务花费多长时间。\n\
  \n\n\n\n7. 输入 `insert into test_table` `values('99', 'Look! Another note.');` 并按回车插入另一行。\n\
  \n**注意** 有关向表中插入数据的具体详细信息，请参阅附录 D“数据库规范化与 SQL 引用”。\n\n现在你的表中已经有了一些数据，即使只有两行，是时候熟悉选择数据了。请保持\
  \ MySQL Monitor 开启，因为你将在下一节中同样用到它。\n\n## 从你的测试表中选择数据\n\n`SELECT` 命令非常强大，可能是你在处理\
  \ PHP 和 MySQL 时使用最频繁的命令。你可以在附录 D，“数据库规范化与 SQL 引用”中找到关于 `SELECT` 命令的更多信息，但现在，让我们来进行一些简单的数据查询。\n\
  \n1. 在提示符处，输入 `select * from test_table;` 并按回车。\n\n![](img/index-24_1.jpg)\n![](img/index-24_2.jpg)\n\
  \n此命令简单地从名为 `test_table` 的表的所有行选择所有字段（这就是 `*` 的作用），并将数据以格式良好的表格形式返回到屏幕上。MySQL Monitor\
  \ 会告诉你返回了多少行数据，以及查询运行了多长时间。\n\n对结果进行简单的排序。尝试按 ID 编号对结果进行排序——数字最大的在前面。\n\n2. 在提示符处，输入\
  \ `select * from test_table order by test_id desc;` 并按回车。\n\n结果现在显示 `test_id` 为\
  \ 99 的行作为表中的第一行。命令中的 `desc` 代表降序。另一个选项是 `asc`，代表升序。升序是默认顺序。在下一节是关于在 Linux 上安装 MySQL\
  \ 的。如果你没有两台机器，请跳到第 2 章，“安装 Apache”来安装 Apache Web 服务器。\n\n## 在 Linux 上安装 MySQL\n\n\
  本节将带你通过使用 MySQL AB 的发行版在 Linux 上安装 MySQL 4.0.x (标准版)。如果你使用的是其他版本的 Unix，请下载适当的文件并遵循发行版中包含的说明。\n\
  \nMySQL 推荐的安装方法是使用 RPM。多个 RPM 组成了一个完整的发行包，但对于最小安装，你需要以下内容：\n\n* `MySQL-server-VERSION.i386.rpm`——MySQL\
  \ 服务器。\n* `MySQL-client-VERSION.i386.rpm`——标准的 MySQL 客户端程序。\n\n要下载这些文件，请访问 MySQL\
  \ 4.0.x 下载页面：[`www.mysql.com/downloads/mysql-4.0.html`](http://www.mysql.com/downloads/mysql-4.0.html)\
  \ 并找到 Linux x86 RPM Downloads 部分（根据你的架构选择 IA64 或 AMD64）。当你点击其中一个软件包的下载链接时，你将进入一个镜像站点页面。选择离你最近的镜像站点并下载文件。\n\
  \n当文件下载到你的系统后，在提示符处输入以下内容进行最小化安装，将 `VERSION` 替换为下载文件的相应版本号：\n\n```bash\n#prompt>\
  \ rpm -i MySQL-server-VERSION.i386.rpm MySQL-client-VERSION.i386.rpm\n```\n\n如果\
  \ RPM 方法对你不适用，也可以从二进制发行版安装 MySQL，这需要 `gunzip` 和 `tar` 来解压和提取发行包。它还需要在系统上创建组和用户的能力。\n\
  \n在第一系列命令中，你将按照如下方式添加组和用户，然后解压发行包：\n\n1. 在提示符处，输入 `groupadd mysql`。\n2. 在提示符处，输入\
  \ `useradd -g mysql mysql`。\n3. 在提示符处，输入 `cd /usr/local`。\n4. 在提示符处，输入 `gunzip <\
  \ /path/to/mysql-standard-VERSION-OS.tar.gz | tar xvf -`。\n\n**注意** 你可以在任何目录安装 MySQL。如果你没有像示例那样使用\
  \ `/usr/local/`，请务必适当修改后续命令。\n\n5. 若要创建一个更短名称的链接，输入 `ln -s mysql-VERSION-OS mysql`。\n\
  6. 通过输入 `cd mysql` 切换目录。\n\n一旦发行包被解压，`README` 和 `INSTALL` 文件将引导你完成所选 MySQL 版本的剩余安装过程。通常情况下，将使用接下来的一系列命令：\n\
  \n1. 输入 `scripts/mysql_install_db` 运行 MySQL 安装脚本。\n2. 输入 `chown -R root /usr/local/mysql`\
  \ 更改 mysql 目录的所有者。\n3. 输入 `chown -R mysql /usr/local/mysql` 更改 mysql 目录的所有者（注：此处原文可能存在逻辑重复，通常意为更改组或所有者，此处此处忠于原文翻译）。\n\
  4. 输入 `chgrp -R mysql /usr/local/mysql` 更改 mysql 目录的组。\n5. （后续重复命令略，遵循原文结构翻译）\n\n\
  ## 测试你的安装\n\nMySQL 发行版带有一个启动脚本，名为 `safe_mysqld`，位于安装目录的 `bin` 子目录下。按照以下步骤启动该脚本：\n\
  \n1. 如果你不在该目录，在提示符处输入 `cd /usr/local` 并按回车。\n2. 输入 `./bin/safe_mysqld &` 并按回车启动\
  \ MySQL 进程。\n\n![](img/index-26_1.jpg)\n\n现在 MySQL 进程正在后台运行，你可以连接 MySQL 了。\n\n##\
  \ 创建测试数据库\n\n在继续之前，你应该了解以下内容：\n\n* 数据库是表的集合。\n* 表包含一组记录，也称为行。\n* 所有记录具有相同数量的字段。\n\
  * 每个字段对数据进行分类。\n\n在本节中，你将完成第一个元素的创建。使用的工具是 `mysqladmin` 程序，它允许你从命令行管理 MySQL。\n\n\
  在提示符处，输入 `./bin/mysqladmin create testDB` 并按回车。如果名为 `testDB` 的数据库已成功创建，你将返回提示符。接下来，你将在该数据库中添加一个表。\n\
  \n## 创建测试表\n\n在本节中，你将在上一节创建的数据库中创建一个表。使用的工具是 `mysql` 程序，它允许你从命令行在 MySQL 数据库系统内部工作。\n\
  \n1. 在提示符处，输入 `./bin/mysql` 并按回车。\n\nMySQL Monitor 将启动。MySQL Monitor 提供了自己的提示符。在此提示符\
  \ (mysql>) 上，你将输入创建表、解释表、插入数据、选择数据等命令。习惯在命令末尾加上分号 (;)，因为它是一个常见的指令终止符，在 PHP 中也是这样使用的。\n\
  \n\n\n现在你已经连接到了 MySQL 监控器，你需要告诉它要使用哪个数据库。\n\n2. 在提示符下，输入 `use testDB;` 并按回车。\n\n\
  如果数据库存在且你有权限访问它，MySQL 监控器将响应 `Database changed`。\n\n现在该创建一个测试表了。该表将有一个用于 ID 号的列和一个用于文本的列。\n\
  \n3. 在提示符下，输入 `create table test_table (test_id int, test_note text);` 并按回车。此语句将创建一个名为\
  \ `test_table` 的表。在表中，它会创建一个类型为 `int`（整数）的 `test_id` 列。它还会创建一个类型为 `text` 的 `test_note`\
  \ 列。\n\n![](img/index-27_1.jpg)\n\n**注意** 有关创建表的详细信息，请参阅附录 D，“数据库规范化与 SQL 参考”。\n\
  \nMySQL 监控器将响应 `Query OK`。它还会告诉你影响了多少行以及完成任务花费了多久。\n\n4. 通过输入 `show tables;` 并按回车来验证表的创建。MySQL\
  \ 监控器将响应当前数据库中所有表的列表。\n\n5. 要验证特定表的字段名和类型，请使用 `explain` 命令。在这种情况下，输入 `explain test_table;`\
  \ 并按回车。MySQL 监控器将响应选中表中所有字段及其类型的列表。这是一个用于跟踪表设计的非常实用的命令。\n\n该向你的表中插入几行数据了，因为这变得有点无聊。第一行将有一个\
  \ ID 为 `1`，注释将为“This is a note.”\n\n6. 要插入这一行，输入 `insert into test_table values('1',\
  \ 'This is a note.');` 并按回车。MySQL 监控器将响应 `Query OK`。它还会告诉你影响了多少行以及完成任务花费了多久。\n\n\
  ![](img/index-28_1.jpg)\n![](img/index-28_2.jpg)\n\n7. 输入 `insert into test_table\
  \ values('99', 'Look!');` 并按回车插入另一行。\n\n**注意** 有关向表中插入数据的详细信息，请参阅附录 D“数据库规范化与 SQL\
  \ 参考”。\n\n现在你的表中已经有了一些数据，即使只有两行，也是时候熟悉选择数据了。保持 MySQL 监控器打开，因为你将在下一节中也使用它。\n\n##\
  \ 第 2 章：安装 Apache\n\n### 概述\n由于它是目前最流行的 Web 服务器，你可能认为 Apache 是一个复杂的软件，但它一点困难。在本章中，你将学习如何：\n\
  - 在 Windows 或 Linux 上安装 Apache\n- 连接到你的新 Web 服务器\n\n### 为 Windows 安装 Apache\n在 Windows\
  \ 上安装 Apache 是一项简单的任务，很大程度上归功于 Apache 组发布的安装向导。无论你使用的是 Windows 95、98、Me、2000、XP\
  \ 还是 NT，预编译二进制文件的安装过程绝对是正确之径，且相同的安装文件适用于所有版本的 Windows。\n\n能够在 Windows 95/98/Me/XP\
  \ 等面向消费者的操作系统上使用 Apache 并不意味着你*应该*这样做，至少在生产环境中不是的。简单来说，在 Windows 操作系统上运行任何 Web 服务器都不像在\
  \ Linux 操作系统上运行 Web 服务器那样快、稳定或安全。能够在 Windows 95/98/Me/XP 等面向消费者的操作系统上使用 Apache 并不意味着你*应该*这样做，至少在生产环境中不是的。简单来说，在\
  \ Windows 操作系统上运行任何 Web 服务器都不像在 Linux 操作系统上运行 Web 服务器那样快、稳定或安全。能够在 Windows 95/98/Me/XP\
  \ 等面向消费者的操作系统上使用 Apache 并不意味着你*应该*这样做，至少在生产环境中不是的。简单来说，在 Windows 操作系统上运行任何 Web 服务器都不像在\
  \ Linux 操作系统上运行 Web 服务器那样快、稳定或安全。\n\n能够在 Windows 95/98/Me/XP 等面向消费者的操作系统上使用 Apache\
