  注意：在此 SQL 语句中，你正在使用 `concat()` 函数（MySQL 字符串函数）从两个已存在的字段创建一个新字段，合并 `artist_fn` 和\
  \ `artist_ln`，并在中间留一个空格。使用 `artist_fullname` 将此新值分配给该字段。例如，假设你拥有 David Gray 的专辑《White\
