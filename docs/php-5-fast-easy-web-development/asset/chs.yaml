  \n# 附录 F：获取帮助\n\n开源社区优秀的方面之一是人们渴望帮助你学习尽可能多的知识，以便你也能成为一名支持者。然而，在向整个社区提问之前，你可能应该尝试自己寻找答案。这包括阅读现有的手册和常见问题（FAQs）、搜索邮件列表存档以及访问网站。很有可能其他人也遇到过和你相同的问题。\n\
  \n本书以及我写的其他书籍的网站是 [`www.thickbook.com/`](http://www.thickbook.com/)。你可以在那里找到书籍勘误、从书中下载的代码、书籍及其他项目的推荐，以及我在空闲时间想到的任何其他内容。书籍勘误将帮助你判断问题是由于印刷过程中的错误导致的，还是你应该重读该章节的内容再次尝试。\n\
  \n## PHP 资源\n\nPHP 相关的网站、新闻组和邮件列表非常丰富，这里列出的只是可用资源中的一小部分。\n\n### 网站\n\n这些网站大部分由普通人在业余时间维护，因此如果你使用了他们的任何资源，请尝试在能力范围内范围内通过帮助他人解决问题来回馈社区，向代码库贡献代码段等。\n\
  \n[www.php.net](http://www.php.net/)\n\nPHP 的主页是 http://www.php.net.](http://www.php.net/)。这里有注释版的在线手册，以及\
  \ PHP 常见问题、错误报告、提供 PHP 服务的 ISP 链接、新闻文章以及更多内容！\n\n[www.zend.com](http://www.zend.com/)\n\
  \nZend Technologies 是 PHP Zend 引擎背后的团队为 PHP 开发人员创建了一个门户网站。这个个性化的网站不仅展示了你如何使用 PHP\
  \ 构建高流量的动态网站，还提供了关于如何在所有在线应用中最大化 PHP 潜力的提示、资源和课程。\n\n**DevShed [(www.devshed.com)](http://www.devshed.com/)**\n\
  \n该网站包含许多用户提交的教程、新闻文章、采访以及服务器端编程语言的竞争分析。涵盖了 PHP 以及开发者感兴趣的许多其他主题，如服务器和数据库。\n\n**PHPBuilder\
  \ [(www.phpbuilder.com)](http://www.phpbuilder.com/)**\n\n这是一个非常适合中级和高级 PHP 开发者的教程网站。它包含了针对现实世界应用的“如何做”专栏，例如“考虑到搜索引擎的动态页面构建”、“生成可读密码”等等大量内容。\n\
  \n[**WeberDev (www.weberdev.com)](http://www.weberdev.com/)\n\n作为 PHP 开发者长期喜爱的网站，该网站包含了许多编程语言的开发技巧和提示（为了公平起见），以及一个供所有人添加自己的代码段、教程等内容的内容管理系统。它有一个非常棒的周更通讯和高流量。去看看吧！\n\
  \npx.sklar.com 这是一个简陋的代码库，但当你只需要代码段时，谁需要图形呢？借鉴“随手公益”的心态，先拿一个代码段开始，当你觉得可以分享时再添加你自己的。\n\
  \nWebmonkey (hotwired.cos/webmonkey/) 带给我们带来 Wired 杂志的公司也带来了 HotWired，它催生了 Webmonkey，这是一个开发者的资源网站，有一个专门针对\
  \ PHP 的板块。不要把自己限制在 Webmonkey 的 PHP 部分，因为在其他板块也有大量信息可用。\n\n![](img/index-393_1.png)\n\
  ![](img/index-393_2.png)\n\nPHP KnowledgeBase (ts.com) PHP KnowledgeBase 包含了 PHP\
  \ 邮件列表提出的问题和解答。任何人都可以在网站上回答问题或提出新问题。\n\n**邮件列表**\n\n有几个高流量的邮件列表可以使用英语以及其他语言进行 PHP\
  \ 讨论。在提问时请记住网络礼仪：保持礼貌，尽可能提供多个示例（如果你在描述问题），提供你的系统信息（如果你在寻找解决方案），我有没有提到过要说“请”和“谢谢”吗？你可以在\
  \ [www.php.net/mailing-lists.php.](http://www.php.net/mailing-lists.php) 找到邮件列表信息。英语邮件列表已存档并可在\
  \ http://marc.theaims.com/.](http://marc.theaims.com/) 进行搜索。只需查找 WWW 标题下的 PHP 相关列表即可。\n\
  \n**用户组**\n\n有时，在现实生活中认识其他开发者证明很有帮助。你可以在 http://www.phpusergroups.org/.](http://www.phpusergroups.org/)\
  \ 找到 PHP 用户组列表。\n\n![](img/index-394_1.png)\n![](img/index-394_2.png)\n![](img/index-394_3.png)\n\
  ![](img/index-394_4.png)\n![](img/index-394_5.png)\n![](img/index-394_6.png)\n\n\
  ## MySQL 资源\n\n之前列出的许多 PHP 相关网站也包含使用 MySQL 开发的信息，但 http://www.mysql.com/](http://www.mysql.com/)\
  \ MySQL 网站是获取全面 MySQL 信息的起点。在线 MySQL 手册巨大，但它写得非常好且非常实用，它的规模不应该吓到你。你可以在 http://www.mysql.com/doc/.](http://www.mysql.com/doc/)\
  \ 找到手册。如果你在寻找对 MySQL 的快速介绍，我写了一本名为《24 小时精通 MySQL》的书，在全球书店都有售。其他推荐的 MySQL 书包括 Paul\
  \ DuBois 写的任何著作（事实上，他负责了 MySQL 手册的大部分内容！）\n\n与 PHP 一样，有几个高流量的邮件列表可以使用英语以及其他语言进行\
  \ MySQL 讨论。你可以在 http://www.mysql.com/documentation/lists.html,](http://www.mysql.com/documentation/lists.html)\
  \ 找到邮件列表信息，MySQL 邮件列表已存档并可在 http://marc.theaims.com/.](http://marc.theaims.com/)\
  \ 进行搜索。\n\n![](img/index-395_1.png)\n![](img/index-395_2.png)\n![](img/index-395_3.png)\n\
