  ### 显示目录内容\n\n尽管你可能信，这个脚本在 Windows 下非常有效。\n\n1. 打开一个新的文本编辑器并开始 PHP 块：\n\n```php\n\
  <?\n```\n\n2. 创建一个变量来存储目录路径：\n\n```php\n$dir_name = \"/Documents/Owner/Desktop/\"\
  ;\n```\n\n3. 创建句柄并使用 `opendir()` 函数打开指定的目录：\n\n```php\n$dir = opendir($dir_name);\n\
  ```\n\n4. 启动一个 `while` 循环，使用 `readdir()` 函数来决定何时停止。`readdir()` 函数返回目录中的下一个文件名，并将值赋值给变量\
  \ `$file_name`：\n\n```php\n$file_list = \"<ul>\";\nwhile ($file_name = readdir($dir))\
  \ {\n```\n\n5. 使用 `if` 语句过滤掉 `.` 和 `..`：\n\n```php\nif ($file_name != \".\" && $file_name\
  \ != \"..\") {\n```\n\n6. 如果 `$file_name` 不是其中之一，将其添加到 `$file_list` 中：\n\n```php\n\
  $file_list .= \"<li>$file_name</li>\";\n```\n\n7. 关闭 `if` 语句：\n\n```php\n}\n```\n\
  \n8. 将闭合的 `ul` 标签添加到列表中：\n\n```\n$file_list .= \"</ul>\";\n```\n\n9. 关闭目录：\n\n```\n\
  closedir($dir);\n```\n\n10. 关闭你的 PHP 块，然后向显示界面添加一些 HTML：\n\n```php\necho \"<html>\"\
  ;\necho \"<head>\";\necho \"<title>目录列表</title>\";\necho \"</head>\";\necho \"<body>\"\
  ;\n```\n\n11. 打印目录名称：\n\n```php\necho \"<h1>Files in $dir_name</h1>\";\n```\n\n\
  12. 打印列表：\n\n```php\necho $file_list;\n```\n\n13. 关闭 HTML 标签：\n\n```php\necho \"\
  </body>\";\necho \"</html>\";\n```\n\n```php\n?>\n```\n\n\n\n\n```php\n$msg = \"\
  <P>File created!</P>\";\n?>\n```\n\n6. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Creating\
  \ a New File</TITLE>\n</HEAD>\n```\n\n![](img/index-124_1.jpg)\n\n<BODY>\n```\n\n\
  7. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n8. 添加更多一些 HTML 以使文档有效：\n\n```html\n\
  </BODY>\n</HTML>\n```\n\n9. 将文件保存为 `newfile.php`，并将此文件放置在你的 Web 服务器的文档根目录下。\n\n\
  10. 打开你的 浏览器并输入 `http://127.0.0.1/newfile.php`。\n\n如果文件创建成功，你应该能看到下图所示的成功消息。\n\n\
  然而，如果文件创建失败，你将看到一个糟糕的解析错误（parse error）。你可以通过为 `$filename` 使用无效值来强制报错，例如：\n\n```php\n\
  $filename = \"/bozo/mydata.txt\";\n```\n\n当你运行脚本时，你将看到类似下图的内容。\n\n![](img/index-125_1.jpg)\n\
  \n虽然 `die()` 函数通过打印指定的错误消息来完成它的工作，但 PHP 会根据函数执行失败抛出它自己的警告（warnings）。你可以通过在函数前面使用\
  \ `@` 符号来抑制 PHP 的错误和警告。\n\n在你的脚本中，修改此行：\n\n```php\n$newfile = fopen($filename, \"\
  w+\") or die(\"Couldn't create file.\");\n```\n\n修改为：\n\n```php\n$newfile = @fopen($filename,\
  \ \"w+\") or die(\"Couldn't create file.\");\n```\n\n![](img/index-126_1.jpg)\n\n\
  保存文件并通过你的 浏览器访问脚本。你现在只会看到来自 `die()` 函数的消息，而不再有其他警告。\n\n### 检查文件是否已存在\n\n为了避免在文件系统中周处操作时出现任何可能的清理错误，你可以使用\
  \ `file_exists()` 函数在创建文件之前检查文件是否已存在。下一个脚本将执行此操作，并无论结果如何都会打印消息。\n\n1. 在你的文本编辑器中打开一个新文件并开始一个\
  \ PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储文件的完整路径（使用你自己的文件路径）：\n\n```php\n$filename\
  \ = \"/Documents and Settings/Owner/Desktop/misc/mydata.txt\";\n```\n\n**注意** 是的，这和你可能在上一节中创建的同一个文件。没关系，因为可能会触发错误检查！\n\
  \n3. 启动一个 if…else 语句来检查 `file_exists()` 函数的真/假结果：\n\n```php\nif (file_exists($filename))\
  \ {\n```\n\n4. 创建一个变量来存储关于文件存在性的消息：\n\n```php\n$msg = \"<P>File already exists.</P>\"\
  ;\n```\n\n5. 继续 `else` 语句，以便在文件不存在时执行操作：\n\n```php\n} else {\n```\n\n6. 创建一个文件指针并使用\
  \ `fopen()` 函数打开第 2 步中指定的文件进行读写。如果文件没有正常打开，`die()` 函数将导致脚本结束并显示消息。\n\n```php\n$newfile\
  \ = @fopen($filename, \"w+\") or die(\"Couldn't create file.\");\n```\n\n7. 创建一个变量来存储成功消息：\n\
  \n```php\n$msg = \"<P>File created!</P>\";\n```\n\n8. 关闭文件指针、if…else 语句以及你的 PHP\
  \ 块：\n\n![](img/index-127_1.jpg)\n\n```php\nfclose($newfile);\n}\n?>\n```\n\n9.\
  \ 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Creating a New File</TITLE>\n</HEAD>\n\
  <BODY>\n```\n\n10. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n11. 添加更多一些 HTML\
  \ 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n12. 将文件保存为 `newfile-checkfirst.php`，并将此文件放置在你的\
  \ Web 服务器的文档根目录下。\n\n13. 打开你的 浏览器并输入 `http://127.0.0.1/newfile-checkfirst.php`。\n\
  \n假设你使用了之前创建的文件名，你应该能看到下一图所示的失败消息。如果你将 `$filename` 的值更改为不存在的文件并再次访问脚本，你将看到成功消息。因为仅仅创建一个文件很无聊，在下一节中你将学习如何向文件写入数据。\n\
  \n字体 向文件追加数据\n\n下一个脚本的目标是向文件追加数据。如果文件存在，脚本将直接向其中写入数据。如果文件不存在，它将在写入数据之前被创建。\n\n1.\
  \ 在你的文本编辑器中打开一个新文件并开始一个 PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储文件的完整路径名（使用你自己的文件路径）：\n\
  \n```php\n$filename = \"/Documents and Settings/Owner/Desktop/misc/textfile.txt\"\
  ;\n```\n\n![](img/index-128_1.jpg)\n\n3. 创建一个名为 `$newstring` 的变量来存储你想写入文件的字符串。\n\
  \n4. 创建一个文件指针并使用 `fopen()` 函数打开第 2 步中指定的文件进行读写。如果文件没有正常打开，`die()` 函数将导致脚本结束。\n\n\
  ```php\n$newfile = @fopen($filename, \"w+\") or die(\"Couldn't create file.\");\n\
  ```\n\n5. 使用 `fwrite()` 函数将 `$newstring` 写入 `$myfile`。如果写入失败，`die()` 函数将导致脚本结束。\n\
  \n```php\n@fwrite($myfile, $newstring) or die(\"Couldn't write to file.\");\n```\n\
  \n6. 创建一个变量来存储成功消息：\n\n```php\n$msg = \"<P>File has data in now.</p>\";\n```\n\n\
  7. 关闭文件指针和 PHP 块：\n\n8. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Adding Data\
  \ to a File</TITLE>\n</HEAD>\n<BODY>\n```\n\n9. 打印消息：\n\n```php\n<? echo \"$msg\"\
  ; ?>\n```\n\n10. 添加更多一些 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n11. 将文件保存为\
  \ `writedata.php`，并将此文件放置在你的 Web 服务器的文档根目录下。\n\n12. 打开你的 浏览器并输入 `http://127.0.0.1/writedata.php`。\n\
  \n![](img/index-129_1.jpg)\n\n### 从文件中读取数据\n\n你现在将创建一个脚本来读取上一节创建的文件。\n\n1. 在你的文本编辑器中打开一个新文件并开始一个\
  \ PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储文件的完整路径名（使用你自己的文件路径）：\n\n```php\n$filename\
  \ = \"/Documents and Settings/Owner/Desktop/misc/textfile.txt\";\n```\n\n3. 创建一个文件指针并使用\
  \ `fopen()` 函数以只读模式打开第 2 步中指定的文件。如果文件无法打开，`die()` 函数将导致脚本结束。\n\n```php\n$whatoread\
  \ = @fopen($filename, \"r\") or die(\"Couldn't open file\");\n```\n\n4. 创建一个变量 `$file_contents`\
  \ 并使用 `fread()` 函数从打开的文件指针 (`whatoread`) 中读取行，直到文件中没有内容：\n\n```php\n$file_contents\
  \ = fread($whatoread, filesize($filename));\n```\n\n5. 创建一个变量来打印消息，包括文件的内容：\n\n\
  ```php\n$msg = \"The file contains:<br>$file_contents\";\n```\n\n6. 关闭文件指针和 PHP\
  \ 块：\n\n```php\nfclose($whatoread);\n?>\n```\n\n![](img/index-130_1.jpg)\n\n7. 添加此\
  \ HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Reading Data From a File</TITLE>\n</HEAD>\n\
  <BODY>\n```\n\n8. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n9. 添加更多一些 HTML 以使文档有效：\n\
  \n```html\n</BODY>\n</HTML>\n```\n\n那确实是写入文件的字符串，但那些换行符去哪里了？换行符对 浏览器没有任何意义，浏览器只渲染\
  \ HTML。幸运的是，PHP 开发团队具有极好的远见，创建了 `nl2br()` 函数（换行到换行标签；懂了吗？）。对 `readdata.php` 脚本做一些微调：\n\
  \n1. 在包含 `fread()` 函数的行之后添加此行：\n\n```php\n$new_file_contents = nl2br($file_contents);\n\
  ```\n\n\n\n\n\n```php\nnl2br($file_contents);\n```\n\n2. 修改 `$msg` 字符串，使其看起来像这样：\n\
  \n```php\n$msg = \"The file contains:<br>$new_file_contents\";\n```\n\n3. 保存文件。\n\
  \n现在在你的网络浏览器中打开此文件，注意换行符，如下所示。\n\n![](img/index-131_1.jpg)\n\n在下一节中，你将看到相同的消息，但不是将其打印在屏幕上，而是通过电子邮件发送它。\n\
  \n## 通过电子邮件发送文件内容\n\n如果你正在将 HTML 表单的结果保存到纯文本文件中，并且你只想在特定时间读取它们，可以编写一个简单的脚本，根据需要将文件通过电子邮件发送给你。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储包含数据的文件的完整路径（使用你自己的路径）：\n\
  \n```php\n$filename = \"/Documents and Settings/Owner/Desktop/misc/textfile.txt\"\
  ;\n```\n\n3. 创建文件指针并使用 `fopen()` 函数以只读模式打开第 2 步指定的文件。如果文件没有正常打开，`die()` 函数将导致脚本结束并显示消息。\n\
  \n```php\n$whattoread = @fopen($filename, \"r\") or die(\"Couldn't open file\");\n\
  ```\n\n4. 创建一个名为 `$file_contents` 的变量，使用 `fread()` 函数从打开的文件指针（`$whattoread`）读取所有行，只要文件中还有行：\n\
  \n```php\n$file_contents = fread($whattoread, filesize($filename));\n```\n\n5. 创建一个变量来存储你的电子邮件地址：\n\
  \n```php\n$to = \"you@yourdomain.com\";\n```\n\n6. 创建一个用于邮件主题的变量：\n\n```php\n$subject\
  \ = \"File Contents\";\n```\n\n7. 创建一个用于额外邮件头头的变量：\n\n```php\n$mailheaders = \"\
  From: My Web Site <genericaddress@yourdomain.com> \\n\";\n```\n\n8. 使用 `$file_contents`\
  \ 字符串作为第三参数（消息）填充 `mail()` 函数：\n\n```php\nmail($to, $subject, $file_contents, $mailheaders);\n\
  ```\n\n9. 创建一个变量在屏幕上打印一条消息：\n\n```php\n$msg = \"<P>Check your mail!</P>\";\n```\n\
  \n10. 关闭文件指针和你的 PHP 块：\n\n![](img/index-132_1.jpg)\n![](img/index-132_2.png)\n![](img/index-132_3.png)\n\
  ![](img/index-132_4.png)\n\n```php\nfclose($whattoread);\n?>\n```\n\n11. 添加此 HTML：\n\
  \n```html\n<HTML>\n<HEAD>\n<TITLE>Mailing Data From a File</TITLE>\n</HEAD>\n<BODY>\n\
  ```\n\n12. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n13. 添加更多 HTML 以使文档有效：\n\
  \n```html\n</BODY>\n</HTML>\n```\n\n14. 将文件保存为 `mailcontents.php`，并将此文件放置在你的 Web\
  \ 器的文档根目录下。\n\n15. 打开你的网络浏览器并输入 [`127.0.0.1/mailcontents.php`](http://127.0.0.1/mailcontents.php)。\n\
  \n正如消息所说，去检查你的邮件吧！你应该有一封邮件在等待你，其中打印了文件的内容。\n\n与之前的脚本不同，你不需要使用 `nl2br()` 函数，因为你并不是在浏览器窗口中显示文本。纯文本电子邮件将保留原始的换行符。\n\
  \n[](itss://chm/8934final/LiB0047.html)\n\n![](img/index-133_1.png)\n![](img/index-133_2.png)\n\
  ![](img/index-133_3.png)\n[](itss://chm/8934final/LiB0048.html)\n\n## 文件系统维护\n\n\
  下一系列脚本将帮助你执行非常基础的文件系统任务，例如复制、重命名和删除文件。记住，只有当 PHP 用户拥有适当的权限时，你才能执行文件系统函数。\n\n## 复制文件\n\
  \n`copy()` 函数非常简单：它只需要知道原始文件名和新文件名仅此而已。\n\n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n```php\n\
  <?\n```\n\n2. 创建一个变量来存储原始文件的完整路径（使用你自己的路径）：\n\n```php\n$orig_filename = \"/Documents\
  \ and Settings/Owner/Desktop/misc/textfile.txt\";\n```\n\n3. 创建一个变量来存储新文件的完整路径（使用你自己的路径）：\n\
  \n```php\n$new_filename = \"/Documents and Settings/Owner/Desktop/misc/textfile.bak\"\
  ;\n```\n\n4. 创建一个变量来存储函数的真/假结果。通过在函数前使用 `@` 来抑制警告，并在函数失败时使用 `die()` 打印消息：\n\n```php\n\
  $success = @copy($orig_filename, $new_filename) or die(\"Couldn't copy file\");\n\
  ```\n\n5. 使用 `if...else` 语句根据结果打印消息：\n\n```php\nif ($success) {\n```\n\n6. 如果复制成功，打印一条确认消息：\n\
  \n```php\n$msg = \"Copied $orig_filename to $new_filename\";\n```\n\n7. 如果复制失败，进入\
  \ `else` 部分：\n\n```php\n} else {\n$msg = \"Couldn't copy file\";\n}\n```\n\n8. 添加此\
  \ HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Copying Files</TITLE>\n</HEAD>\n<BODY>\n\
  ```\n\n9. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n10. 添加更多 HTML 以使文档有效：\n\n\
  ```html\n</BODY>\n</HTML>\n```\n\n11. 将文件保存为 `copycontents.php`，并将此文件放置在你的 Web 器的文档根目录下。\n\
  \n12. 打开你的网络浏览器并输入 [`127.0.0.1/copycontents.php`](http://127.0.0.1/copycontents.php)。\n\
  \n![](img/index-134_1.jpg)\n\n## 重命名文件\n\n与 `copy()` 函数一样，`rename()` 函数只需要原始文件名和文件名。在这种情况下，你只是在重命名它而不是复制。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储原始文件的完整路径（使用你自己的路径）：\n\
  \n```php\n$orig_filename = \"/Documents and Settings/Owner/Desktop/misc/textfile.bak\"\
  ;\n```\n\n3. 创建一个变量来存储新文件的完整路径（使用你自己的路径）：\n\n```php\n$new_filename = \"/Documents\
  \ and Settings/Owner/Desktop/misc/textfile.old\";\n```\n\n4. 创建一个变量来存储函数的真/假结果。通过在函数前使用\
  \ `@` 来抑制警告，并在函数失败时使用 `die()` 打印消息：\n\n```php\n$success = @rename($orig_filename,\
  \ $new_filename) or die(\"Couldn't rename file\");\n```\n\n5. 使用 `if...else` 语句根据结果打印消息：\n\
  \n```php\nif ($success) {\n```\n\n6. 如果重命名成功，打印一条确认消息：\n\n```php\n$msg = \"Renamed\
  \ $orig_filename to $new_filename\";\n```\n\n7. 如果重命名失败，进入 `else` 部分：\n\n```php\n\
  } else {\n$msg = \"Couldn't rename file\";\n}\n?>\n```\n\n8. 添加此 HTML：\n\n```html\n\
  <HTML>\n<HEAD>\n<TITLE>Renaming Files</TITLE>\n</HEAD>\n<BODY>\n```\n\n9. 打印消息：\n\
  \n```php\n<? echo \"$msg\"; ?>\n```\n\n10. 添加更多 HTML 以使文档有效：\n\n```html\n</BODY>\n\
  </HTML>\n```\n\n11. 将文件保存为 `renamecontents.php`，并将此文件放置在你的 Web 器的文档根目录下。\n\n12.\
  \ 打开你的网络浏览器并输入 [`127.0.0.1/renamecontents.php`](http://127.0.0.1/renamecontents.php)。\n\
  \n![](img/index-135_1.jpg)\n\n## 删除文件\n\n在下一节：中还有一个文件维护函数。在使用 `unlink()` 函数时要非常小心，因为一旦你删除了文件，它就彻底消失了。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储要删除的文件的完整路径（使用你自己的路径）：\n\
  \n\n\n\n\n```php\n$filename = \"/Documents and Settings/Owner/Desktop/misc/textfile.old\"\
  ;\n```\n\n3. 创建一个变量来存储函数的真/假（true/false）结果。在函数前使用 `@` 符号来抑制警告，如果函数失败，使用 `die()`\
  \ 打印消息：\n\n```php\n$success = @unlink($filename) or die(\"Couldn't delete file.\"\
  );\n```\n\n4. 启动一个 `if…else` 语句，根据函数的执行打印适当的消息：\n\n```php\nif ($success) {\n```\n\
  \n5. 如果成功，消息字符串应该打印出删除的确认信息：\n\n```php\n$msg = \"Deleted $filename\";\n```\n\n6.\
  \ 继续编写处理失败情况的语句，然后关闭你的 PHP 块：\n\n```php\n} else {\n\n$msg = \"Could not delete file.\"\
  ;\n}\n\n?>\n```\n\n**Note** 与之前的脚本一样，在这种情况下使用 `else` 语句并不是必须的，但为了提供默认结果，这是一个良好的习惯。\n\
  \n7. 添加以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Delete a File</TITLE>\n</HEAD>\n\
  <BODY>\n```\n\n8. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n9. 添加更多 HTML 以使文档有效：\n\
  \n```html\n</BODY>\n</HTML>\n```\n\n10. 将文件保存为 `deletefile.php`，并将此文件放置在你 Web 服务器的文档根目录下。\n\
  \n11. 打开你的网络浏览器并输入 [`127.0.0.1/deletefile.php`](http://127.0.0.1/deletefile.php)。\n\
  \n![](img/index-137_1.jpg)\n![](img/index-137_2.jpg)\n![](img/index-137_3.png)\n\
  ![](img/index-137_4.png)\n![](img/index-137_5.png)\n\n通过将 `$filename` 的值更改为不存在的内容，检查你的错误处理是否有效：\n\
  \n```php\n$filename = \"/bozo/textfile.old\";\n```\n\n通过你的 Web 浏览器访问该脚本，你应该能看到这个：\n\
  \n[在下一章中，]你将创建一个两步过程（前端表单和后端脚本），用于从 Web 浏览器上传文件到你的文件系统。\n\n![](img/index-138_1.png)\n\
  ![](img/index-138_2.png)\n![](img/index-138_3.png)\n![](img/index-138_4.png)\n![](img/index-138_5.png)\n\
  ![](img/index-138_6.png)\n\n# 第 10 章：上传文件到你的网站\n\n### 概述\n\n如果你需要一个从远程位置向网站上传文件的快速接口，可以使用\
  \ `PHP` 创建一个两步表单和脚本接口。在本章中，你将学习如何：\n\n* 创建用于上传文件的 HTML 表单\n* 创建处理文件上传的 PHP 脚本\n\n\
  ![](img/index-139_1.png)\n![](img/index-139_2.png)\n![](img/index-139_3.png)\n![](img/index-139_4.png)\n\
  ![](img/index-139_5.png)\n![](img/index-139_6.png)\n\n## 检查你的 php.ini 文件\n\n在开始上传文件之前，检查你的\
  \ `php.ini` 文件中的几个值。查找这段文本：\n\n```ini\n;;;;;;;;;;;;;;;;\n; File Uploads ;\n;;;;;;;;;;;;;;;;\n\
  ; 是否允许 HTTP 文件上传。\nFile\\_uploads = On\n; HTTP 上传文件的临时目录（如果未指定，将使用系统默认值）。\n;upload\\\
  _tmp\\_dir =\n; 允许上传的文件的最大大小。\nUpload\\_max\\_filesize = 2M\n```\n\n为了确保文件上传过程顺利运行，请进行以下修改：\n\
  \n1. 通过删除开头的分号来取消 `upload_tmp_dir` 行的注释。\n2. 在 `upload_tmp_dir` 的 `=` 之后输入目录名称。\n\
  3. 如果你想允许更大的上传，请更改 `upload_max_filesize` 的字节数。\n\n例如，在 Windows 系统上，`php.ini` 文件的这部分可能如下所示：\n\
  \n```ini\n;;;;;;;;;;;;;;;;\n; File Uploads ;\n;;;;;;;;;;;;;;;;\n; 是否允许 HTTP 文件上传。\n\
  file\\_uploads = On\n;HTTP 上传文件的临时目录（如果未指定，将使用系统默认值）。\nupload\\_tmp\\_dir = /temp\n\
  ; 允许上传的文件的最大大小。\nipload\\_max\\_filesize = 2M\n```\n\n如果你没有使用 Windows，只要你希望文件放置在\
  \ `/tmp`（默认值），就不需要修改 `upload_tmp_dir` 的值。\n\n![](img/index-140_1.png)\n![](img/index-140_2.png)\n\
  ![](img/index-140_3.png)\n![](img/index-140_4.png)\n![](img/index-140_5.png)\n![](img/index-140_6.png)\n\
  \n## 理解该过程\n\n通过接口向 Web 服务器上传文件的过程包含很多步骤。花点时间理解这个过程，你需要：\n\n* 一个 HTML 表单\n* 一个要上传的文件\n\
  * 一个用来存放它的脚本\n\n该过程如下：\n\n1. 用户访问 HTML 并看到一个文本字段。\n2. 用户浏览硬盘并选择一个文件。\n3. 用户点击提交按钮。\n\
  4. 选择的文件到达 Web 服务器，进入临时目录。\n5. PHP 脚本检查操作并将文件移动到目标目录。\n\n**Note** PHP 用户（如 \"www\"\
  ）必须对目标目录具有写入权限。如果你遇到权限问题，请联系系统管理员。从创建表单开始。\n\n## 创建表单\n\n创建一个上传文件的 HTML 表单。你可以根据需要创建多个文件的表单。\n\
  \n1. 在文本编辑器中打开新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Upload a File</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>Upload a File</h1>\n```\n\n2. 开始你的表单。假设方法为 `POST`，动为 `do_upload.php`。由于你要发送的不只是文本，使用\
  \ `ENCTYPE` 属性：\n\n```html\n<FORM METHOD=\"POST\" ACTION=\"do_upload.php\" ENCTYPE=\"\
  multipart/form-data\">\n```\n\n3. 为文件的输入字段。假设你要上传图片，将输入字段命名为 `img1`：\n\n```html\n\
  <p>要上传的文件:<br>\n<INPUT TYPE=\"file\" NAME=\"img1\" SIZE=\"30\"></p>\n```\n\n**Note**\
  \ 表单中的 `TYPE=\"file\"` 属性将显示一个带有浏览按钮的输入字段。\n\n4. 添加提交按钮，然后关闭表单并添加更多 HTML 使文档有效：\n\
  \n```html\n<p><INPUT TYPE=\"submit\" NAME=\"submit\" VALUE=\"Upload File\"></p>\n\
  </FORM>\n</BODY>\n</HTML>\n```\n\n5. 将文件保存为 `upload_form.html`，并将此文件放置在你 Web 服务器的文档根目录下。\n\
  6. 打开你的网络浏览器并输入 [`127.0.0.1/upload_form.html`](http://127.0.0.1/upload_form.html)。\n\
  \n![](img/index-142_1.jpg)\n![](img/index-142_2.jpg)\n![](img/index-142_3.png)\n\
  ![](img/index-142_4.png)\n\n在下一节中，你将创建一个处理文件上传的脚本。\n\n## 创建上传脚本\n\n花时间记住以下列表——它包含了成功上传文件后自动放入\
  \ `$_FILES` 超局变量中的变量。`img1` 的基础来自于原始表单中输入字段的名称。\n\n* `$_FILES[img1][tmp_name]`：该值指向\
  \ Web 服务器上的临时文件。\n* `$_FILES[img1][name]`：该值是被上传文件的实际名称。例如，如果文件名是 `me.jpg`，则 `$_FILES[img1][name]`\
  \ 的值为 `me.jpg`。\n* `$_FILES[img1][size]`：上传的文件大小（字节）。\n\n\n\n\n\n# `$_FILES[img1][type]`.\
  \ 上传文件的 MIME 类型，例如 `image/jpg`。\n\n**注意** MIME 类型表示正在传输的内容的类型。例如，JPEG 文件的 MIME 类型为\
  \ `image/jpg`，Microsoft Word 文档的 MIME 类型为 `application/msword`。\n\n此脚本的目标是获取上传的文件，将其复制到\
  \ Web 器的文档根目录，并向用户返回一个确认，其中包含上述列表中所有变量的值。\n\n1. 在你的文本编辑器中打开一个新文件，并开始一个 PHP 块：\n\n\
  ```php\n<?\n```\n\n2. 创建一个 `if……else` 语句来检查 `$_FILES[img1]` 中是否有值。`if ($_FILES[img1]\
  \ != \"\") {`\n\n3. 如果 `$_FILES[img1]` 不为空，则执行 `copy` 函数。在函数名之前使用 `@` 来抑制警告，并使用\
  \ `die()` 函数在 `copy()` 函数失败时结束脚本并显示消息。\n\n```php\n@copy($_FILES[img1][tmp_name],\
  \ \"/usr/local/apache2/htdocs/$_FILES[img1][name]\") or die(\"Couldn't copy the\
  \ file.\");\n```\n\n**注意** 如果你的 Web 器的文档根目录不是步骤 3 所示的 `/usr/local/apache2/htdocs/`，请更改路径以匹配你自己的系统。例如，Windows\
  \ 用户可能会使用 `/Program Files/Apache Group/Apache/htdocs/`。\n\n4. 继续 `else` 语句以处理未上传文件的情况：\n\
  \n```php\n} else {\ndie(\"No input file specified\");\n}\n```\n\n5. 关闭 `if……else`\
  \ 语句，然后关闭你的 PHP 块：\n\n```php\n}\n?>\n```\n\n6. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n\
  <TITLE>文件上传成功</TITLE>\n</HEAD>\n<BODY>\n<H1>成功!</H1>\n```\n\n7. 将 HTML 和 PHP 混合，打印一行显示上传文件的各种元素（名称、大小和类型）的值：\n\
  \n```html\n<P>You sent: <? echo $_FILES[img1][name]; ?>, a <? echo $_FILES[img1][size];\
  \ ?> byte file with a mime type of <? echo $_FILES[img1][type]; ?>.</P>\n```\n\n\
  8. 添加更多 HTML 以使文档有效：\n\n```html\n</BODY>\n```\n\n![](img/index-144_1.jpg)\n![](img/index-144_2.png)\n\
  ![](img/index-144_3.png)\n![](img/index-144_4.png)\n</HTML>\n```\n\n9. 以 `do_upload.php`\
  \ 命名保存文件。代码看起来应该如下所示。\n\n在下一节中，你终于可以上传文件了！\n\n[](itss://chm/8934final/LiB0053.html)\n\
  \n![](img/index-145_1.png)\n![](img/index-145_2.png)\n![](img/index-145_3.png)\n\
  ![](img/index-145_4.jpg)\n[](itss://chm/8934final/LiB0054.html)\n\n# 使用你的表单和脚本上传文件\n\
  \n这是真理的时刻，你屏住呼吸测试脚本。\n\n1. 打开你的网络浏览器并输入 [`127.0.0.1/upload_form.html`](http://127.0.0.1/upload_form.html)。\n\
  \n2. 使用“浏览”按钮找到你想要上传的文件。\n\n**注意** 此示例使用了我自己机器上的文件，因此图片看起来可能与你的结果不完全相同。文件的完整路径应该出现在表单字段中。\n\
  \n3. 点击“上传文件”按钮。将出现结果屏幕，提供你刚刚上传的文件的信息。\n\n**注意** 除非你在复制到系统之前通过检查文件类型来限制想要上传的文件类型，否则允许你的文件上传脚本仅供你自己或其他信任的源使用。\n\
  \n![](img/index-146_1.jpg)\n![](img/index-146_2.png)\n![](img/index-146_3.png)\n\
  ![](img/index-146_4.png)\n\n这很简单！你现在是一个文件系统大师了。在下一章中，你也将成为一名数据库大师。\n\n[](itss://chm/8934final/LiB0054.html)\n\
