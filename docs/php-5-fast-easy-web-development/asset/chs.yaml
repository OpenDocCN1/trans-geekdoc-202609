  \ en-US; rv:1.4) Gecko/20030624 Netscape/7.1 (ax).`\n\n这是另一个常见的 `HTTP_USER_AGENT`\
  \ 值：\n\n`Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)`\n\n此值指的是 Windows 上的\
  \ Microsoft Internet Explorer (MSIE) 6.0 版本。有时你会看到 MSIE 返回一个看起来像 Netscape 值的 `HTTP_USER_AGENT`\
  \ 值，例如这一个，它以 Mozilla 开头，直到你注意到该值显示它是兼容的且实际上是 MSIE 6.0。\n\n![](img/index-83_1.jpg)\n\
  ![](img/index-83_2.png)\n![](img/index-83_3.png)\n![](img/index-83_4.png)\n\n最后，不要忽略纯文本浏览器！Lynx\
  \ 的 `HTTP_USER_AGENT` 值看起来像这样：\n\n`Lynx/2.8rel.3 libwww-FM/2.14`\n\n让我们找到你的 `HTTP_USER_AGENT`。\n\
  \n1. 在你的文本编辑器中打开一个新文件。\n2. 打开一个 PHP 块，然后使用 `getenv()` 将 `HTTP_USER_AGENT` 的值放在名为\
  \ `$agent` 的变量中：\n\n```php\nphp\n$agent = getenv(\"HTTP_USER_AGENT\");\n```\n\n\
  3. 将 `$agent` 的值打印到屏幕上，并关闭 PHP 块：\n\n```php\necho \"You are using $agent\";\n?>\n\
  ```\n\n4. 将文件保存为 `useragent.php`，然后将此文件放在你 Web 服务器的文档根目录下。\n5. 打开网页浏览器并输入 `http://127.0.0.1/useragent.php`。\n\
  \n你的当前 `HTTP_USER_AGENT` 值将打印在屏幕上。\n\n**注意** 你的用户代理字符串可能与所示的不同，因为每个浏览器、版本和平台都会创建它自己的标识字符串。\n\
  \n\n\n\n5. 关闭你的 PHP 块并添加一些 HTML 以开始显示：\n\n```php\n?>\n\n<HTML>\n\n<HEAD>\n\n<TITLE>浏览器匹配结果</TITLE>\n\
