  [](itss://chm/8934final/LiB0124.html)\n\n## 使用 PHP 解析 XML\n\n在本节中，你将看到几个 PHP 如何使用本章之前创建的\
  \ `messages.xml` 文件解析有效 XML 文档的示例。这些基础脚本向你展示了使用 PHP 解析 XML 文件的逐步方法。与书中的所有内容一样，这都是为了给学习建立基础。\n\
  \n第一个示例脚本将仅仅将 `messages.xml` 文件加载到 XML 解析器中，然后让解析器显示它找到的各个元素。\n\n1. 在你的文本编辑器中打开一个新文件并开始\
  \ PHP 块：\n\n```php\n<?\n```\n\n2. 使用 `simplexml_load_file()` 函数将 `messages.xml`\
  \ 文件的内容加载到一个名为 `$xml` 的对象中：\n\n```php\n$xml = simplexml_load_file('messages.xml');\n\
  ```\n\n3. 使用 `var_dump()` 函数打印输出，然后关闭 PHP 块：\n\n```php\nvar_dump($xml);\n```\n\n\
  4. 将文件保存为 `xml.php` 并将其放在 Web 服务器的文档根目录下。顺带提，某些浏览器的当前版本（如 Microsoft Internet Explorer\
  \ 和 Netscape）允许你使用其内置的样式表以树形格式查看 XML 文档。第一图显示了打开所有元素的 `messages.xml` 文件的原始视图，而下一图显示了折叠了\
  \ `MessageAuthor` 元素的 `messages.xml` 文件。\n\n（注：此处根据上下文逻辑修正了原文中可能存在的乱码或重复描述错误，确保翻译通顺）\n\
