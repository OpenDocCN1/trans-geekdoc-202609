  \n一些预定义常量包括：\n\n- `__FILE__` 正在解析的脚本文件名。\n- `__LINE__` 正在解析的脚本中的行号。\n- `PHP_VERSION`\
  \ 使用的 PHP 版本。\n- `PHP_OS` 使用 PHP 的操作系统。\n\n让我们来测试这些常量：\n\n1. 在你的文本编辑器中打开一个新文件并开启一个\
