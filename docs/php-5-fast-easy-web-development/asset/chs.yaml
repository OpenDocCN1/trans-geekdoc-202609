  \n## 使用 Cookie 变量\n\n在使用 cookie 时有一个元素大多数人都会忘记，直到他们花费几个小时尝试调试一个根本没有错误的东西（我曾经历过这种事）。当网络浏览器接受一个\
  \ cookie 时，在发送下一次 HTTP 请求之前，你无法提取它的值。\n\n换句话说，如果你在第 1 页设置了一个名为 `name` 值为 `Julie`\
  \ 的 cookie，在用户到达第 2 页（或第 5 页或第 28 页——任何不是初始设置 cookie 的页面）之前，你无法提取该值。\n\n## 在身份验证中使用\
