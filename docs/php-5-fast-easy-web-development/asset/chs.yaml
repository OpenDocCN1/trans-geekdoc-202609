  </em><br>\n\n(由 \".$Book->BookPublisher.\", 发布，\n\nISBN: \".$Book->BookISBN.\")<br>\n\
  \n<font color=red>price:</font> \\\\$\".$Book->BookPrice.\"</p>\n\n<hr noshade>\"\
  ;\n\n}\n\n?>\n```\n\n当你用浏览器访问此文件时，你将看到类似下图的内容。`xmlparse.php` 脚本提供了一个读取 XML 文档并处理其内容的基本示例。要进一步学习这一概念，请查看\
