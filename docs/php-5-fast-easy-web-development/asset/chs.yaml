  \        $table_names[$table_num] = mysql_tablename($tables, $table_num);\n    \
  \    $table_list .= \"<li>$table_names[$table_num]\";\n        //增加计数\n        $table_num++;\n\
  \    } // 关闭内部 while 循环\n    // 关闭符号列表\n    $table_list .= \"</ul>\";\n    // 将\
  \ table_list 添加到 db_list\n    $db_list .= \"$table_list\";\n    // 增加计数\n    $db_num++;\n\
  } // 关闭外部 while 循环\n// 关闭数据库符号列表\n$db_list .= \"</ul>\";\n?>\n```\n\n\n\n\n\n```php\n\
  $msg =\"<P>Database has been deleted!</P>\";\n\n}\n\n?>\n\n<HTML>\n\n<HEAD>\n\n\
