  \n### 概述\n\n通过简单的 PHP 脚本，你可以对文件系统进行任何操作——毕竟它是归属于你的！在本章中，你将学习如何：\n\n- 显示目录内容\n- 创建新文件\n\
  - 打开现有文件并向其追加数据\n- 复制、重命名和删除文件\n\n[](itss://chm/8934final/LiB0044.html)\n\n![](img/index-119_1.png)\n\
