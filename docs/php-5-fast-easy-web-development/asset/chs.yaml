  现在是时候检查最终结果了。打开你的网络浏览器并输入 [`http://127.0.0.1/access_report.php`](http://127.0.0.1/access_report.php)。\n\
  \n你将看到一个带有标题和一些文本的 HTML 页面，随后是所有页面达到的访问次数。\n\n你还将看到用户代理的列表以及每种类型的总访问次数。最后，你将看到所有已访问页面的列表，以及短描述和具体信息。\n\
  \n\n\n\n书——书籍有标题和章节，每个章节都包含段落等。一个 XML 文档中只有一个根元素。使用书籍的示例，该元素可以命名为 `Book`，标签 `<Book></Book>`\
  \ 包围了所有其他信息。\n\n但我在这里使用的是的是系统消息的示例，因此将根元素命名为 `SystemMessage`，并向你的 `messages.xml`\
  \ 文档添加一个起始标签：\n\n```xml\n<SystemMessage>\n```\n\n接下来，向你的文档中添加任何后续元素——可以命名为 `children`。使用系统消息的示例，你需要\
  \ `title`、`body`、`author` 和 `date` 信息。将这些子元素命名为 `MessageTitle`、`MessageBody`、`MessageAuthor`\
  \ 和 `MessageDate`。但如果你想同时获取作者的名字和电子邮箱地址怎么办？没问题——你只需要在父元素内部创建另一组子元素（该父元素恰好也是根元素的一个子元素）。例如，仅仅\
  \ `<MessageAuthor>` 元素看起来可能像这样：\n\n```xml\n<MessageAuthor>\n<MessageAuthorName>Joe\
  \ SystemGod</MessageAuthorName>\n<MessageAuthorEmail>systemgod@someserver.com</MessageAuthorEmail>\n\
  </MessageAuthor>\n```\n\n总之，你的 `messages.xml` 示例文档可能如下：\n\n```xml\n<?xml version=\"\
  1.0\" ?>\n<!--Sample XML document -->\n<SystemMessage>\n<MessageTitle>System Down\
  \ for Maintenance</MessageTitle>\n<MessageBody>Going down for maintenance soon!</MessageBody>\n\
  ![](img/index-340_1.jpg)\n![](img/index-340_2.jpg)\n<MessageAuthor>\n<MessageAuthorName>Joe\
  \ SystemGod</MessageAuthorName>\n<MessageAuthorEmail>systemgod@someserver.com</MessageAuthorEmail>\n\
  </MessageAuthor>\n<MessageDate>March 4, 2004</MessageDate>\n</SystemMessage>\n```\n\
  \n在创建有效的 XML 文档时，请记住两个非常重要的规则：\n\n1. XML 是区分大小写的，因此 `<Book>` 和 `<book>` 是不同的元素。\n\
  2. 所有 XML 标签必须正确关闭，XML 标签必须正确嵌套，且不允许标签交叉。\n\n将 `messages.xml` 文件（或类似的文件）放在你 Web\
  \ 服务器的文档根目录下，以便在后的示例中使用。顺带提，某些浏览器的当前版本（如 Microsoft Internet Explorer 和 Netscape）允许使用使用内置的样式表以树形格式查看\
