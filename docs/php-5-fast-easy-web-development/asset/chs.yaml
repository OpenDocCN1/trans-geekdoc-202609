  ![](img/index-342_7.png)\n[](itss://chm/8934final/LiB0123.html)\n\n## 准备在 PHP 中使用\
  \ XML\n\nPHP 中的 XML 功能基于 `libxml2` 库，并在 PHP 配置和安装时默认启用——无论是在 Linux/Unix 还是 Windows\
  \ 平台上都是如此。\n\n你可以通过查看 `phpinfo()` 函数的输出来判断你的 PHP 安装中是否启用了 XML 支持。下图显示了在启用 XML 的安装中你会看到的某些\
  \ XML 相关的条目。\n\n**注意**：你不会在 `phpinfo()` 输出中按此顺序看到这些项目，因为在已启用元素的字母顺序显示中，它们之间会有好几个其他条目。\n\
  \n一旦你确认 PHP 中启用了 XML 支持，就可以在你的系统上进行解析、转换甚至生成 XML 了。本章中使用的所有示例都基础，再次，如果你感兴趣深入处理 XML，我建议阅读额外的书籍或\
  \ PHP 手册中的条目 [(http://www.php.net/manual/)](http://www.php.net/manual/)。\n\n[](itss://chm/8934final/LiB0123.html)\n\
