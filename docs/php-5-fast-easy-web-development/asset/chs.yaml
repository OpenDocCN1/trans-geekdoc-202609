  \ `ServerName` 不正确，你将无法连接到 Apache。正如配置文件本身所说的：“你不能随便发明主机名并希望它们有效。”如果你不知道完整的全机名，可以使用\
  \ IP 地址。如果你有一个静态 IP 地址（即不会改变的地址），请使用它作为你的 `ServerName`。如果你使用的是不分配静态 IP 的拨号连接（即你的\
  \ IP 地址在每次连接到互联网提供商时都会变化），你将不得不每次拨号时更改 `httpd.conf` 中的 IP 地址。\n\n![](img/index-34_1.jpg)\n\
