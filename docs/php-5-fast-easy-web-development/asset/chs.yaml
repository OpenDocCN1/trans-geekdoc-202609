  ![](img/index-39_3.png)\n\n### 在 Windows 上安装 PHP\n\n在 Windows 上安装 PHP 并不是通过向导界的。基本上您只需要解压一些文件并移动它们。没什么大不了。\n\
  \n### 注意\n\n好的，如果您打算使用 Microsoft IIS、Microsoft PWS 或其他 Web 服务器，本书基于使用 Apache 作为\
  \ Web 服务器并手动安装 PHP。请阅读软件中包含的安装说明。\n\n要下载 Windows 版 PHP 分发包，请访问 PHP 网站的下载页面：[`www.php.net/downloads`](http://www.php.net/downloads)\n\
  \n1. 从 Windows 部分点击 PHP 5.x.x 压缩包链接，其中 x.x 指版本。目前 Windows 版本为 5.0.RC1，后续所有安装将基于此版本。未来版本将遵循相同的安装程序；适当替换新版本即可。下载完成后，双击文件\
  \ `php-5.0.RC1-Win32.zip`。您选择的解压缩程序（如 WinZip 或 PKZip）将打开此文件。\n2. 将文件提取到硬盘根目录下的 `php`\
  \ 目录中。\n\n现在您已经拥有了所有的基础 PHP 分发文件，只需要移动其中一些即可。\n\n**注意** 如果您更改了安装目录名称，请务必在本章剩余说明中替换您的新目录名称。\n\
  \n1. 使用 Windows 资源管理器……进入 `C:\\php` 目录。\n2. 将 `php.ini-dist` 文件重命名为 `php.ini` 并将其移动到\
  \ `C:\\WINDOWS\\`、`C:\\WINNT\\` 或您放置 `*.ini` 文件的任何位置。\n3. 将 `php5ts.dll` 移动到 `C:\\\
  WINDOWS\\SYSTEM\\`、`C:\\WINDOWS\\SYSTEM\\` 或您放置 `*.dll` 文件的任何位置。\n\n## 配置 Apache\
  \ 使用 PHP\n\n为了让基础 PHP 与 Apache 工作，您需要对 Apache 配置文件进行一些细微修改。\n\n您可以作为 CGI 二进制文件或作为\
  \ Apache 模块安装 PHP。PHP 组织（以及我）目前的建议是\n\n\n\n\n建议使用模块版本，因为它提供了更高的性能和一些额外功能。然而，取决于你特定的操作系统，在使用模块时你可能会遇到高级功能产生某些冲突。此外，使用\
  \ CGI 版本而不是模块版本将允许你创建虚拟主机，每个虚拟主机都有其自己的 PHP CGI 可执行文件，从而允许 PHP 以命名用户的身份运行而不是默认的 Apache\
  \ 进程所有者的身份运行。\n\n如果你想安装 CGI 版本，请阅读 PHP 手册中 `http://www.php.net/manual/` 的安装信息。在\
  \ `http://www.php.net/manual/` 下一节， 中，你将学习如何为 Apache 2 服务器安装 PHP 模块版本。\n\n## PHP\
  \ 的 Apache 模块版本\n\n要配置 Apache 使用模块版本，你需要移动一个 PHP 文件，并对 Apache 配置文件 `httpd.conf`\
  \ 进行一些修改，该文件位于 Apache 安装目录下的 `conf` 目录中。\n\n1. 从 Windows 开始菜单中选择 `Program Files`、`Apache\
  \ HTTP Server 2.0.49`、`Configure Apache Server`、`Edit the Apache httpd.conf Configuration\
  \ File`。\n2. 查找类似于所示的文本区域。\n3. 在该区域的末尾添加以下代码：\n\n```\nLoadModule php5_module\nc:/php//php5apache2.dll\n\
  ```\n\n![](img/index-40_1.jpg)\n![](img/index-40_2.jpg)\n\n接下来，你必须向 `httpd.conf`\
  \ 文件添加一条指令来定义 PHP 文件使用的扩展名。常见的扩展名是 `.php` 和 `.phtml`，但你可以使用任何你扩展名。\n\n4. 查找类似于所示的文本区域。\n\
  5. 添加以下行：\n\n```\nAddType application/x-httpd-php .phtml .php\n```\n\n6. 保存并关闭 `httpd.conf`\
  \ 文件。\n\n此最终修改告诉 Apache，每当请求扩展名为 `.php` 或 `.phtml` 的文件时，Apache 都应该在向 Web 浏览器发送任何输出之前，利用模块版本的\
  \ PHP 解析器。\n\n## 测试 PHP 安装\n\n现在你已经对 `httpd.conf` 文件进行了所有修改——无论使用哪种配置方法——你可以使用你在\
  \ 第 2 章， “安装 Apache”中学会的方法重启 Apache。为了测试 Apache 和 PHP 是否配合良好，接下来你创建一个简单的 PHP 脚本来测试你的安装。PHP\
  \ 脚本和其他文件（HTML、图像等）应该放置在 Web 服务器的文档根目录下。对于 Apache 来说，文档根是 Apache 安装目录下的 `htdocs`\
  \ 目录。\n\n1. 在你的文本编辑器中打开新文件并输入以下内容：\n\n```php\n<?php phpinfo(); ?>\n```\n\n![](img/index-41_1.jpg)\n\
  ![](img/index-41_2.png)\n![](img/index-41_3.png)\n![](img/index-41_4.png)\n\n2.\
  \ 将文件保存为 `phpinfo.php` 并此此放在 Web 服务器的文档根目录下。\n\n**注意** 务必确保你的文件扩展名为 `.php` 或 `.phtml`（或你为\
  \ PHP 配置的其他扩展名）。基于 Windows 的文本编辑器经常会在文件名末尾添加隐藏的 `.txt` 文件扩展名。如果这种情况发生在你身上，你的脚本将不会解析为\
  \ PHP，而仅作为文本。所以请留意你的扩展名！\n\n3. 打开你的 浏览器并输入 `http://127.0.0.1/phpinfo.php`。\n\n**注意**\
  \ 如果你在安装 Apache 时使用了不同的服务器名称，请在此处以及整本书中替换它。\n\n`phpinfo.php` 脚本的输出应该是一个充满系统和环境信息的长页面。当你尝试弄清楚哪些功能可用时，这些信息非常有帮助。如果你浏览结果，你会发现以下扩展已预安装（还包括许多其他扩展）：\n\
  \n- Perl 兼容正则表达式支持\n- ODBC 支持\n- Session 会话支持\n- XML 支持\n- MySQL 支持\n\n预装了这些项目意味着你不需要任何额外文件。有关获取额外文件的更多信息，请参阅\
  \ 附录 A， “编程的绝对基础”并学习语言的基础。\n\n[content]\n等待，提供的源文本在后半部分存在大量的重复和痕迹。我将根据提供的指令清理逻辑流：\n\
  3. 输入 `cd /usr/local/src/` 并回车进入 `/usr/local/src/`。\n4. 输入 `gunzip php-5.0.RC1.tar.gz`\
  \ 并回车解压源文件。\n5. 输入 `tar -xvf php-5.0.RC1.tar` 并回车解提取文件。这将创建一个目录结构，然后让你回到提示符处。父目录将是\
  \ `/usr/local/src/php-5.0RC1/`。\n6. 输入 `cd php-5.0RC1` 并回车进入父目录。\n7. 输入以下内容并回车准备构建\
  \ PHP：\n\n```\n./configure --prefix=/usr/local/php5 --with-mysql=/usr/local/mysql\
  \ --with-apxs2=/usr/local/apache2/bin/apxs\n```\n\n**注意** 在配置指令中，使用你自己的 MySQL 和\
  \ Apache 路径，如果它们位于文件系统的其他地方。\n\n配置脚本将运行其检查配置并创建 Makefile 的过程，然后让你回到提示符处。\n8. 输入\
  \ `make` 并回车。安装过程的第二步将在屏幕上产生许多行输出。完成后，你将回到提示符处。\n9. 输入 `make install` 并回车。安装过程的最后一步将在屏幕上产生许多行输出。完成后，你将回到提示符处。\n\
  \n## 配置 Apache 使用 PHP\n\n安装过程已将模块放置在 Apache 目录结构中的正确位置。现在在启动启用 PHP 的 Apache 之前，你必须对\
  \ `httpd.conf` 文件进行一些修改。\n\n1. 使用你喜欢的文本编辑器打开 `httpd.conf` 文件。\n2. 查找以下行，它是安装过程插入到文件中的：\n\
  \n```\nLoadModule php5_module modules/libphp5.so\n```\n\n\n\n\n你希望这一行被取消注释，因此确保它是取消注释的（如所示）。\n\
  \n3. 查找以下行：\n\n![](img/index-43_1.jpg)\n\n## AddType 允许你为特定文件类型添加或覆盖 MIME 配置文件 `mime.types`。\n\
  \n`AddType application/x-tar .tgz`\n\n4. 在这些行中添加以下内容：\n\n`AddType application/x-httpd-php\
  \ .phtml .php`\n\n5. 保存并关闭 `httpd.conf` 文件。\n\n此项修改告诉 Apache，每当请求扩展名为 `.php` 或 `.phtml`\
  \ 的文件时，Apache 都应该在将任何输出发送到 浏览器之前，先通过 PHP 解析器运行该文件。\n\n一旦对 `httpd.conf` 完成了这些更改，你就可以启动\
