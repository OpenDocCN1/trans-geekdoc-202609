  [](itss://chm/8934final/LiB0083.html)\n\n# 第 16 章：使用 Cookies\n\n### 概述\n\nCookies\
  \ 是非常的小工具，但当坏人滥用它们时，它们在媒体中名誉不佳。如果你使用得当，这些小小的文本片段可以让你的开发工作变得简单得多。在本章中，你将学习如何：\n\n\
  * 设置 cookie\n* 从 cookie 中提取数据\n* 修改你的用户身份验证程序以使用 cookie\n\n[](itss://chm/8934final/LiB0083.html)\n\
  ![](img/index-214_1.png)\n![](img/index-214_2.png)\n![](img/index-214_3.png)\n![](img/index-214_4.png)\n\
  ![](img/index-214_5.png)\n![](img/index-214_6.png)\n[](itss://chm/8934final/LiB0084.html)\n\
  \n### 什么是 Cookies？\n\nCookies 是发送到用户浏览器的文本片段。Cookies 可以帮助你创建购物车、用户社区和个性化网站。不建议在\
  \ cookie 中存储敏感数据，但你可以存储一个唯一标识字符串，该字符串与数据库中安全存储的用户数据匹配。\n\n以购物示例为例。假设你为一个用户分配了一个标识变量，这样你就可以跟踪他在访问你的网站时的行为。首先，用户登录，你发送一个带有变量的\
  \ cookie，这些变量旨在表示：“这是 Joe，Joe 应该留在这里”。当 Joe 在你的网站上闲逛时，你可以在每一个页面上说：“你好，Joe！”如果 Joe\
  \ 点击浏览了你的目录并选择了 14 件物品进行购买，你可以跟踪这些物品，并在 Joe 进入结算区域时将它们一次性显示。\n\n[](itss://chm/8934final/LiB0084.html)\n\
  ![](img/index-215_1.png)\n![](img/index-215_2.png)\n![](img/index-215_3.png)\n![](img/index-215_4.jpg)\n\
  [](itss://chm/8934final/LiB0085.html)\n\n### 设置 Cookies\n\n在开始设置 cookies 之前，先确定你将如何使用它们以及在何时设置它们。无论你决定设置什么\
  \ cookie，请记住，在向浏览器发送任何其他内容之前**必须**设置 cookie，因为 cookie 实际上是头部信息的一部分。\n\n如果你听从了这个警告，你就不会花几个小时去想为什么会收到“无法添加头部信息”（Cannot\
  \ add header information）的错误。这个示例代码正是如此。它产生了下所示的错误。每当你看到这个错误时，假设你在时间到达之前已经向网络浏览器发送了*某些内容*。这包括空格、换行符或你实际上看到的文本。\n\
  \n![](img/index-216_1.jpg)\n\n`setcookie()` 函数用于一次设置一个 cookie，它接受六个参数：\n\n*   **Name（名称）。**\
  \ 存储在全局 `$_COOKIE` 中的变量名，并在后续脚本中可以访问。\n*   **Value（值）。** 传递给 name 参数的的值。\n*   **Expiration（过期时间）。**\
  \ 设置一个特定时间，该时间后 cookie 值将不再可访问。没有特定过期时间的 cookie 在网络浏览器关闭时过期。\n*   **Path（路径）。**\
  \ 决定 cookie 对哪些目录有效。如果 `path` 参数中是单斜杠，则 cookie 对 Web 服务器上的所有文件和目录都有效。如果指定了特定目录，则该\
  \ cookie 仅对该目录内的页面有效。\n*   **Domain（域名）。** Cookies 仅对设置它的主机和域名有效。如果没有指定域名，默认值为生成\
  \ cookie 的服务器的主机名。`domain` 参数字符串中必须至少包含两个点才能有效。\n*   **Security（安全性）。** 如果安全参数为\
  \ 1，则 cookie 将仅通过 HTTPS 传输，即通过安全的 Web 服务器传输。\n\n接下来这一行是一个名为 `id` 的 cookie 示例，值为\
  \ `55sds809892jjsj2`。此特定 cookie 在四小时后过期（当前时间加 14,400 秒），它对域名 `yourdomain.com` 下文档根目录下的任何页面都有效。\n\
  \n```\nsetcookie(\"id\", \"55sds809892jjsj2\", time()+14400, \"/\" ,\".yourdomain.com\"\
  ,0);\n```\n\n在下一节中，你将学习 cookie，并看到如何在身份验证方案中使用它们或仅用于通用的用户跟踪。\n\n在开始开始设置 cookies\
  \ 之前，先确定你将如何使用它们以及在何时设置它们。无论你决定设置什么 cookie，请记住，在向浏览器发送任何其他内容之前绝对必须设置 cookie，因为 cookie\
  \ 实际上是头部信息的一部分。\n\n如果你听从了这个警告，你就不会花几个小时去想为什么会收到“无法添加头部信息”（Cannot add header information）的错误。这个示例代码正是如此。它产生了下所示的错误。每当你看到这个错误时，假设你在时间到达之前已经向网络浏览器发送了*某些内容*。这包括空格、换行符或你实际上看到的文本。\n\
  \n![](img/index-216_1.jpg)\n\n`setcookie()` 函数用于一次设置一个 cookie，它接受六个参数：\n\n*   **Name（名称）。**\
  \ 存储在全局 `$_COOKIE` 中的变量名，并在后续脚本中可以访问。\n*   **Value（值）。** 传递给 name 参数的的值。\n*   **Expiration（过期时间）。**\
  \ 设置一个特定时间，该时间后 cookie 值将不再可访问。没有特定过期时间的 cookie 在网络浏览器关闭时过期。\n*   **Path（路径）。**\
  \ 决定 cookie 对哪些目录有效。如果 `path` 参数中是单斜杠，则 cookie 对 Web 服务器上的所有文件和目录都有效。如果指定了特定目录，则该\
  \ cookie 仅对该目录内的页面有效。\n*   **Domain（域名）。** Cookies 仅对设置它的主机和域名有效。如果没有指定域名，默认值为生成\
  \ cookie 的服务器的主机名。`domain` 参数字符串中必须至少包含两个点才能有效。\n*   **Security（安全性）。** 如果安全参数为\
  \ 1，则 cookie 将仅通过 HTTPS 传输，即通过安全的 Web 服务器传输。\n\n接下来这一行是一个名为 `id` 的 cookie 示例，值为\
  \ `55sds809892jjsj2`。此特定 cookie 在四小时后过期（当前时间加 14,400 秒），它对域名 `yourdomain.com` 下文档根目录下的任何页面都有效。\n\
  \n```\nsetcookie(\"id\", \"55sds809892jjsj2\", time()+14400, \"/\" ,\".yourdomain.com\"\
  ,0);\n```\n\n在下一节中，你将学习 cookie，并看到如何在身份验证方案中使用它们或仅用于通用的用户跟踪。\n\n### 计算时间\n\n如果你想指定一个过期日期或时间，最简单的方法是让\
  \ PHP 为你向前计数，这个值应该是整数（自 1970 年 1 月 1 日以来的秒数），你可以通过 `time()` 函数获取，并增加一些秒数。\n\n如果你设置\
  \ cookie 时没有时间限制，它会在用户关闭浏览器时自动过期。这在用户共享电脑时很有用；你可能希望 cookie 仅持续 15 分钟，以便在用户访问商店的前\
  \ 15 分钟内获得折扣。\n\n表 16.1 显示了 `setcookie()` 函数中 `time()+n` 的常见用法。\n\n**表 16.1：常见时间**\n\
  \n| 值 | 定义 |\n| :--- | :--- |\n| time()+60 | 当前之后的 1 分钟 |\n| time()+900 | 当前之后的\
  \ 15 分钟 |\n| time()+1800 | 当前之后的 30 分钟 |\n| time()+3600 | 当前之后的 1 小时 |\n| time()+14400\
  \ | 当前之后的 4 小时 |\n| time()+43200 | 当前之后的 12 小时 |\n| time()+86400 | 当前之后的 24 小时 |\n\
  | time()+259200 | 当前之后的 3 天 |\n| time()+604800 | 当前之后的 1 周 |\n| time()+2592000 |\
  \ 当前之后的 30 天 |\n\n### 设置测试 Cookie\n\n这个小脚本的目标只是设置测试 cookie 并在屏幕上打印消息。在开始之前，请确保你没有任何个人防火墙设置阻止传入\
  \ cookie。此外，修改你的网络浏览器偏好，在设置 cookie 前提示你。这是观察服务器尝试向你的浏览器发送 cookie 的唯一方法。\n\n1. 在文本编辑器中打开一个新文件并启动\
  \ PHP 块。然后创建一组名为 `$cookie_name`、`$cookie_value`、`$cookie_expire` 和 `$cookie_domain`\
  \ 的变量，并给它们赋予如下值：\n\n```php\nphp\n$cookie_name = \"test_cookie\";\n$cookie_value\
