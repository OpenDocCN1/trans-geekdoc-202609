  \ 元素。PHP 开发团队和所有文档贡献者对整个 PHP 手册付出了巨大的努力，没有必要重复轮子。然而，由于本附录仅涉及 PHP 知识的一小部分，在 PHP 邮件列表上提问之前，请先检查\
  \ PHP 手册。\n\n**注意** 在所有这些示例中，当函数中出现 string 或 int 等内容时，它是你自己的字符串或整数的占位符。\n\n## PHP\
  \ 开始和结束标签\n\n为了将 PHP 代码与 HTML 结合，必须对 PHP 代码进行转义或将其与 HTML 隔离开。PHP 引擎会将 表 B.1 所示标签对之间的任何内容视为\
  \ PHP 代码。\n\n### 表 B.1：基础 PHP 开始和结束标签\n\n| 起始标签 | 结束标签 |\n| :--- | :--- |\n| `<?php`\
  \ | `?>` |\n| `<?` | `?>` |\n| `<script language=\"php\">` | `</script>` |\n\n##\
  \ 变量\n\n你创建变量来表示数据。例如，以下变量存储了销售税的值：\n\n```php\n$sales_tax = 0.0875;\n```\n\n此变量包含一个\
  \ SQL 语句：\n\n```php\n$sql = \"SELECT * FROM MY_TABLE\";\n```\n\n在确定新变量的值时，可以引用其他变量的值：\n\
  \n```php\n$tax_total = $sales_tax * $sub_total;\n```\n\n以下是变量名的特性：\n- 它们以美元符号 (`$`)开头。\n\
  - 它们不能以数字开头。\n- 它们可以包含数字和下划字符 (`_`)。\n- 它们大小敏感。\n\n以下是一些常见的变量类型：\n- 浮点数 (floats)\n\
  - 整数 (integers)\n- 字符串 (strings)\n\n这些类型由 PHP 根据它们出现的上下文来决定。\n\n### 浮点数 (Floats)\n\
  \n以下每个变量都是浮点数。浮点数也被带有小数点的数字。\n\n```php\n$a = 1.552;\n$b = 0.964;\n$sales_tax = 0.875;\n\
  ```\n\n### 整数 (Integers)\n\n整数是正、负整数、零或不带小数点的数字。以下每个变量都是整数：\n\n```php\n$a = 15;\n\
  $b = -521;\n```\n\n### 字符串 (Strings)\n\n在双引号内分组的一系列字符被视为字符串：\n\n```php\n$a = \"\
  I am a string.\";\n$b = \"<P>This book is <strong>cool</strong>!\";\n```\n\n你也可以在字符串中引用其他变量，它们会在你的脚本执行时被替换。例如：\n\
  \n```php\n$num = 57; // 一个整数\n$my_string = \"I read this book $num times!\"; //\
  \ 一个字符串\n```\n\n当你运行脚本时，`$my_string` 变为 \"I read this book 57 times!\"\n\n## 来自\
