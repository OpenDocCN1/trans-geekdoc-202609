  \n# PHP 适合你吗？\n\n只有你才能决定 `PHP` 是否应该是你的选择，无论你是为个人还是商业用途开发网站。我只能说，在商业领域，我已经在所有流行的服务器端语言——Active\
  \ Server Pages (ASP)、ColdFusion、JavaServer Pages (JSP)、Perl 和 PHP——在许多平台和各种 Web\
  \ 服务器上取得了不同程度的成功。PHP 对我来说是正确的选择：它灵活、快速、要求简单，但输出强大。\n\n在决定是否在大规模或商业环境中使用 PHP 之前，考虑你对这些问题的回答：\n\
  \n你能够绝对确定你将始终使用相同的 Web 服务器和软件吗？如果不能，请寻找适用于所有类型 Web 服务器的跨平台工具：PHP。\n\n你将一直拥有完全由 ASP（或\
  \ Java Server Pages 或 ColdFusion）开发者组成的相同开发团队吗？还是你会使用任何可用的人员，因此需要一种易于学习且语法上类似于 C\
  \ 和 Perl 的语言？如果你有理由相信你的 ASP 或 JSP 或 ColdFusion 开发者可能会从地球上消失，不要使用那些工具——使用 PHP。\n\n\
  内存和服务器负载是问题吗？如果是，不要使用浪费内存的臃肿第三方软件——使用 PHP。\n\n结论是：PHP 很简单，尽管试一下吧！如果你喜欢它，就继续使用。它是开源的，所以去改进它。加入邮件列表并帮助他人。如果你不喜欢它，损失的只是买书的钱，而且软件不会让你的机器完全无法运行。\n\
