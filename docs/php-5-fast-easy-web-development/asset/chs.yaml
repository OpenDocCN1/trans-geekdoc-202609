  \ 显示特定平台的 HTML\n\n不仅浏览器之间存在差异，平台之间也存在。这种差异在字体和字体大小上最为明显。在 Windows 世界中，你有诸如 Times\
  \ New Roman 和 Courier New 之类的字体。这些字体的微小版本出现在 Macintosh 和 Linux/UNIX 平台上；它们被称为 Times\
  \ 和 Courier。不仅如此——字体大小的显示方式也完全不同。Macintosh 或 Linux 上的 10 点字体有时几乎无法辨认，但如果你将其增加到 11\
  \ 或 12 点，就没问题了。然而，如果要在 Windows 上查看同一个 12 磅字体，它看起来就像你的文本正试图接管世界一样。\n\n那么该怎么办呢？使用你新的模式匹配技能从\
  \ `HTTP_USER_AGENT` 字符串中提取平台，然后显示特定平台的 HTML。就像通过匹配关键词来确定平台（你在上一节中做过的那样）一样，你也需要知道你正在寻找什么。在下一个脚本中，你将检查关键词\
  \ \"Win\" 和 \"Linux\"，并在你的 HTML 结果页面中打印一个适当的样式表块。\n\n1. 在你的文本编辑器中打开一个新文件，启动一个 PHP\
  \ 块，并使用 `getenv()` 将 `HTTP_USER_AGENT` 的值放在名为 `$agent` 的变量中：\n\n```php\n<?\n\n$agent\
  \ = getenv(\"HTTP_USER_AGENT\");\n```\n\n2. 开始一个 `if…else` 语句来找到 `preg_match()`\
  \ 函数中哪一个成立，从搜索 \"Win\" 开始：\n\n```php\nif (preg_match(\"/Win/i\", \"$agent\")) {\n\
  \    $style = \"win\";\n}\n```\n\n3. 继续该语句，测试 \"Linux\"：\n\n```php\nelse if (preg_match(\"\
  /Linux/i\", \"$agent\")) {\n    $style = \"linux\";\n}\n```\n\n4. 创建 Windows 样式表块：\n\
  \n```php\n$win_style = \"<style type=\\\"text/css\\\">p, ul, li {font-family:Times\
  \ New Roman, Courier New;font-size:12pt;}h1 {font-size:18pt;font-weight:bold;}h2\
  \ {font-size:14pt;font-weight:bold;}strong {font-weight:bold;}em {font-style:italic;}</style>\"\
  ;\n```\n\n5. 创建 Linux 样式表块：\n\n```php\n$linux_style = \"<style type=\\\"text/css\\\
  \">p, ul, li {font-family:Times, Courier;font-size:10pt;}h1 {font-size:16pt;font-weight:bold;}h2\
  \ {font-size:12pt;font-weight:bold;}strong {font-weight:bold;}em {font-style:italic;}</style>\"\
  ;\n```\n\n6. 关闭你的 PHP 块并添加一些 HTML 以开始显示：\n\n```php\n?>\n\n<HTML>\n\n<HEAD>\n\n<TITLE>Platform\
  \ Matching</TITLE>\n<?php\nif ($style == \"win\") {\n    echo \"$win_style\";\n\
