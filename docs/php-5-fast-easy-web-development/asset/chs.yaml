  \n## 第 23 章：管理简单的邮件列表\n\n### 概述\n最终你的网站会有访问者，有一天你可能还想向他们发送新闻邮件。你可以使用 PHP 和 MySQL\
  \ 创建一个非常简单的订阅和发布机制。在本章中，你将学习如何：\n- 创建一个订阅/取消订阅脚本\n- 创建一个发送新闻邮件的前端\n- 创建一个向你数据库中所有接收者发送新闻邮件的脚本\n\
  \n![](img/index-308_1.png)\n![](img/index-308_2.png)\n![](img/index-308_3.png)\n\
  ![](img/index-308_4.png)\n![](img/index-308_5.png)\n\n### 关于邮件列表的简述\n有很多非常好的邮件列表应用程序可以向大量电子邮件地址发送邮件。你在本章中构建的系统类型应仅用于少于几个电子邮件地址的小列表。本章描述的系统源于我某一天的懒惰，当时我不想下载和安装任何第三方软件。我只是做了一些非常简单的文件来执行任务。这就是\
  \ PHP 的美之处：它是一门如此简单的语言，有时编写几个脚本比下载东西要容易。当你的邮件列表变大时，请转向更健壮的邮件应用程序。\n\n![](img/index-309_1.png)\n\
  ![](img/index-309_2.png)\n![](img/index-309_3.png)\n![](img/index-309_4.png)\n\n\
  ### 开发订阅机制\n在向邮件列表发送邮件之前，你需要建立订阅基础。一个简单的订阅/取消脚本将处理这些事情！该脚本的作用是在 MySQL 数据库表中添加或删除记录。\n\
  \n### 创建 subscribers 表\n该 表有三个字段，正如表 23.1 所示。你可以根据需要拥有更多或更少的字段。\n\n**表 23.1：subscribers\
  \ 表的字段**\n\n| 字段名 | 说明 |\n| `id` | 自增 ID 号 |\n| `email_addr` | 订阅者的电子邮件地址 |\n| `date_added`\
  \ | 用户订阅日期 |\n\n接下来，你将使用熟悉的脚本创建此表！\n\n1. 打开网络浏览器并输入 [http://127.0.0.1/show_createtable.html]。\n\
  2. 在表名字段中输入 `subscribers`。\n3. 在字段数量字段中输入 `3`。\n4. 点击进入步骤按钮，你将看到三行，对应你想要创建的三个字段：\n\
  \   - 在第一行，输入 `id` 作为字段名，从类型下拉菜单中选择 `int`，勾选主键复框，并勾选自增复框。\n   - 在第二行，输入 `email_addr`\
