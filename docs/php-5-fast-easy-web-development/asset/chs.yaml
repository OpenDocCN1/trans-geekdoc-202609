  if (($_POST[subject] == \"\") || ($_POST[newsletter] == \"\") {\n    header(\"Location:\
  \ http://127.0.0.1/send_newsletter.html\");\n    exit;\n}\n```\n3. 继续 if…else 块：\n\
  ```php\n} else {\n```\n4. 创建变量存储表所在的数据库以及表本身：\n```php\n$db_name = \"testDB\";\n\
  $table_name = \"subscribers\";\n```\n5. 如你所学的那样，连接数据库服务器并选择数据库：\n```php\n$connection\
