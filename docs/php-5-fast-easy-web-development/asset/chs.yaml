  \n[](itss://chm/8934final/LiB0027.html)\n\n# 第 5 章：介绍变量与运算符\n\n### 概述\n\n在上一章中，你学习了解析\
  \ PHP 代码的过程以及代码输出是如何在你的浏览器中显示的。在接下来的几个章节中，你将学习一些 PHP 语言的内部工作机制——当这些部分组合在一起时，它们实际上产生一个运行的脚本！在本章中，你将学习如何：\n\
  \n- 识别并使用变量\n- 识别并使用运算符\n\n[](itss://chm/8934final/LiB0027.html)\n\n![](img/index-60_1.png)\n\
  ![](img/index-60_2.png)\n![](img/index-60_3.png)\n![](img/index-60_4.png)\n![](img/index-60_5.png)\n\
  ![](img/index-60_6.png)\n\n[](itss://chm/8934final/LiB0028.html)\n\n### 什么是变量？\n\
  \n变量是特定值的表示，例如“蓝色”或 `19349377`。通过给变量赋值，你可以在脚本的其他地方引用该变量，而且该值将始终保持不变（除非你更改了它，你稍后会学到这一点）。\n\
  \n要创建一个变量，请执行以下操作（在脑海中完成）：\n\n1. 想一个好名字！例如，如果我想创建一个变量来存储用户名，我会把变量命名为：\n   `username`\n\
  2. 在该名字前面加上一个美元符号（`$`）：\n   `$username`\n3. 在名字后使用等号（`=`）为该变量分配一个字面值。将值放在引号中：\n\
  \   `$username = \"joe\"`\n4. 给变量赋值是一条指令，因此它应该以分号结束：\n   `$username = \"joe\";`\n\
  \n就是这样——一个名为 `username` 且值为 `joe` 的变量。在本章的晚些时候，你将对你的变量进行一些令人兴奋的操作（例如数学运算）。\n\n###\
  \ 为你的变量命名\n\n正如你所看到的，变量以美元符号（`$`）开头，后面跟着一个有意义的名字。变量名不能以数字字符开头，但可以包含数字和下划字符（`_`）。此外，变量名是区分大小写的，这意味着\
  \ `$YOURVAR` 和 `$yourvar` 是两个不同的变量。\n\n创建有意义的变量名是减少编码头疼问题的另一种方法。例如，如果你的脚本处理姓名和密码值，不要创建一个名为\
  \ `$n` 的变量表示姓名，创建一个名为 `$p` 的变量表示密码——这些都不是有意义的名字。如果你在几周后拿起那个脚本，你可能会认为 `$n` 是“数字”（number）的变量而不是“姓名”（name），而\
  \ `$p` 代表“页面”（page）而不是“密码”（password）。\n\n[](itss://chm/8934final/LiB0028.html)\n\
  \n![](img/index-61_1.png)\n![](img/index-61_2.png)\n![](img/index-61_3.png)\n![](img/index-61_4.png)\n\
  \n[](itss://chm/8934final/LiB0027.html)\n\n![](img/index-61_5.png)\n\n### 变量类型\n\
  \n你将学习 PHP 变量的两种主要类型：标量（*scalar*）和数组（*array*）。标量变量只包含一个值，而数组包含一组值。你可以在附录 B 中找到关于变量的详细信息。\n\
  \n当你给变量赋值时，你将学习 PHP 的类型：\n\n- **整数**（integer）。整数数字，例如 `123`。\n- **浮点数**（floating-point）。带有小数点的数字，例如\
  \ `12.34`。\n- **字符串**（string）。文本，例如 `\"hello\"`。\n\n当你编写 PHP 脚本时，变量可以是局部的（*local*）或全局的（*global*），其区别在于它们的定义和使用范围。当你创建自己的函数（执行特定任务的可用代码块）时，你可以将变量定义为全局的。也就是说，你可以定义它们可以被其他脚本访问。\n\
  \n\n\n\n\n`constant`（常量）是一个在脚本执行过程中不能改变的值的标识符。一旦常量被赋值，它在整个常量的执行生命周期内都会保持不变。常量可以是用户定义的，你也可以使用\
  \ PHP 始终提供的某些预定义常量。与普通变量不同，常量名称前面没有 `$` 符号，并且通常使用大写字母以区别于标量变量（scalar variables）。接下来，你将测试用户定义的类型。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开启一个 PHP 块：\n```php\n<?\n```\n\n2. 用于定义常量的函数是 `define()`，它需要常量的名称和你想赋予它的值。在这里，你定义了一个名为\
  \ `MYCONSTANT` 的常量，值为 `\"This is a test of defining constants.\"`。\n\n```php\ndefine(\"\
  MYCONSTANT\", \"This is a test of defining constants.\"); own```\n\n3. 打印常量的值，然后关闭\
  \ PHP 块：\n\n```php\necho MYCONSTANT;\n```\n\n4. 将文件另存为 `constants.php` 并将其放置在你的\
