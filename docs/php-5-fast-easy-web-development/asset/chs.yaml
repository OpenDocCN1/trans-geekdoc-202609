  \ 代码，这是正确的，因为这段 PHP 代码已经执行了：\n\n```php\n<?\n![](img/![](index-51_1.jpg)\n\necho\
  \ \"<P><em>Hello World! I'm\n\nusing PHP!</em></P>\";\n\n?>\n```\n\n此代码块包含三个元素：命令（`echo`）、字符串（`<P><em>Hello\
  \ World! I'm using PHP!</em></P>`）和指令终止符（`;`）。\n\n现在请熟悉 `echo`，因为这可能是你用得最频繁的命令。`echo`\
  \ 语句用于输出信息——在这种情况下，它是为了打印这段 HTML 输出：\n\n`<P><em>Hello World! I'm using PHP!</em></P>`\n\
  \n下一节 讨论了一个常见的错误，希望你能够避免它。\n\n## 指令终止符的重要性\n\n指令终止符，也称为分号（`;`），在命令的末尾是绝对要求的。指令终止符告诉\
  \ PHP 解析器：“我已经完成了这个命令，请尝试下一个。”\n\n如果你不在命令末尾加上分号，PHP 解析器就会产生困惑，你的代码将显示错误。\n\n接下来的步骤将向你展示这些错误是如何产生的，重要的是如何修复它们：\n\
  \n1. 在你的文本编辑器中打开一个新文件。\n2. 输入以下 HTML：\n```html\n<HTML>\n<HEAD>\n<TITLE>制造一个错误</TITLE>\n\
  </HEAD>\n<BODY>\n```\n3. 输入以下 PHP 代码：\n```php\n<?\necho \"<P>I am trying to produce\
  \ an error</P>\" ownecho \"<P>Was I successful?</P>\";\n?>\n```\n4. 添加更多一些 HTML\
  \ 以使文档有效：\n```html\n</BODY>\n</HTML>\n```\n5. 将文件保存为 `errorscript.php`。\n![](img/index-52_1.jpg)\n\
  6. 将此文件放在你 Web 服务器的文档根目录下。own\n7. 打开你的 浏览器并输入 [`http://127.0.0.1/errorscript.php`](http://127.0.0.1/errorscript.php)。\n\
  \n多么糟糕的错误！错误信息显示错误在第 8 行。查看脚本的第 7 行和第 8 行：\n\n```php\necho \"<P>I am trying to produce\
  \ an error</P>\"\necho \"<P>Was I successful?</P>\";\n```\n\n第 7 行没有指令终止符，第 8 行开始了一个新命令。PHP\
  \ 解析器不喜欢，它通过产生解析错误来告知你。\n\n这个错误很容易修复：\n\n1. 打开 `errorscript.php` 文件。\n2. 在第 7 行的末尾添加指令终止符（`;`）：\n\
  ```php\necho \"<P>I am trying to produce an error</P>\";\n```\n3. 保存文件。\n4. 将此文件放在你\
  \ Web 服务器的文档根目录下。\n5. 打开你的 浏览器并输入 [`http://127.0.0.1//errorscript.php`](http://127.0.0.1//errorscript.php)。\n\
  \n![](img/index-53_1.jpg)\n![](img/index-53_2.jpg)\n![](img/index-53_3.png)\n![](img/index-53_4.png)\n\
  ![](img/index-53_5.png)\n\n在你修复第 7 行后，PHP 解析器就可以处理该文件，其余输出都是成功的。通过密切关注分号等内容来避免此类及其他错误，正如你在下一节中，将学会的那样，引号。\n\
  \n## 转义你的代码\n\n在以分号结束命令的同时，还要注意引号。当你在引号内部使用引号时，使用反斜杠（`\\`）将它们区分开。以下步骤展示了当代码没有转义时会发生什么，以及如何修复：\n\
  \n1. 在你的文本编辑器中打开一个新文件。\n2. 输入以下 HTML：\n```html\n<HTML>\n<HEAD>\n<TITLE>另一个错误</TITLE>\n\
  </HEAD>\n<BODY>\n```\n3. 输入以下 PHP 代码：\n```php\n<?\necho \"<P>Was I successful?</P>\"\
  ;\n?>\n```\n4. 添加更多一些 HTML 以使文档有效：\n```html\n</BODY>\n</HTML>\n```\n5. 将文件保存为 `errorscript.php`。\n\
  6. 将此文件放在你 Web 服务器的文档根目录下。\n7. 打开你的 浏览器并输入 [`http://127.0.0.1/errorscript.php`](http://127.0.0.1/errorscript.php)。\n\
  \n另一个解析错误！查看 PHP 代码：\n\n```php\necho \"<P>Was I successful?</P>\";\n```\n\n因为你在引号内使用了引号，内部对必须区分开。这个错误也有简单的修复方法：\n\
  \n1. 打开 `errorscript.php` 文件。\n2. 在第 9 行，使用反斜杠转义引号：\n```php\necho \"<P>Was I successful?></P>\"\
  ;\n```\n3. 保存文件。\n4. 将此文件放在你 Web 服务器的文档根目录下。\n5. 打开你的 浏览器并输入 [`http://127.0.0.1/errorscript.php`](http://127.0.0.1/errorscript.php)。\n\
