  \n## 控制结构\n\n程序本质上是由系列语句组成的。控制结构正如其名，控制这些语句的执行方式。它们通常围绕一系列条件构建，例如“如果天空是蓝色的，就出去玩”。在这个例子中，条件是“如果天空是蓝色的”，语句是“出去玩”。\n\
  \n控制结构利用大括号 `{}` 将语句组与程序的其余部分隔离开。以下是常见控制结构的示例；记住它们将会让你的生活轻松得多。\n\n### if...else\
  \ if...else\n\n`if...else if...else` 结构根据所测试表达式的值来执行语句。在接下来的 `if` 语句示例中，测试的表达式是\
  \ `$a 等于 10`。\n\n```php\nif ($a == \"10\") {\n    // 执行某些代码\n}\n```\n\n在对 `$a` 进行求值后，如果发现它的值为\
  \ 10（即如果条件为真），则将执行大括号内的代码。如果发现 `$a` 的值是 10 以外的其他值（如果条件为假），该代码将被忽略，程序继续运行。\n\n为了在\
  \ `$a` 值不为 10 时提供另一种系列语句，可以向结构中添加 `else` 语句，以便在条件为假时执行一段代码：\n\n```php\nif ($a ==\
  \ \"10\") {\n    echo \"a equals 10\";\n} else {\n    echo \"a does not equal 10\"\
  ;\n}\n```\n\n`else if`（或一个单词：`elseif`）语句可以添加到结构中，在进入最后的 `else` 语句之前评估另一个表达式。例如，以下结构首先评估\
  \ `$a` 是否等于 10。如果该条件为假，则评估 `else if` 语句。如果发现为真，则执行其大括号内的代码。否则，程序继续到最后的 `else` 语句：\n\
  \n```php\nif ($a == \"10\") {\n    echo \"a equals 10\";\n} else if ($b == \"8\"\
  ) {\n    echo \"b equals 8\";\n} else {\n    echo \"a does not equal 10 and b does\
  \ not equal 8.\";\n}\n```\n\n你可以单独使用 `if` 语句，也可以作为 `if...else` 或 `if...else if...else`\
  \ 语句的一部分。无论你选择哪种，你都会发现这个结构是你程序中非常有价值的元素！\n\n### while\n\n与 `if...else if...else`\
  \ 结构不同（每个表达式只求值一次并根据其真假值执行操作），`while` 语句会持续循环直到表达式为假为止。换句话说，`while` 循环在表达式为真时持续。\n\
  \n例如，在接下来的 `while` 循环中，只要 `$a` 的值小于或等于 3，就会在屏幕上打印 `$a` 的值并加 1：\n\n```php\n$a = 0\
  \ // 设置起点\nwhile ($a <= \"3\") {\n    echo \"a equals $a<br>\";\n    $a++;\n}\n\
  ```\n\n### for\n\n与 `while` 循环不同，`for` 循环用于预先知道要执行代码块的次数的情况。`for` 语句有三个部分：初始化、条件和增/递减。\n\
  \n```php\nfor ($i = 0; $i < 5; $i++) {\n    echo \"Iteration: $i<br>\";\n}\n```\n\
  \n\n\n\n\n例如，当你通过 GET 方法提交 HTML 表单时，每个键/值对都会放入全局变量 `$_GET` 中。如果你的表单输入字段命名为 `first_name`\
  \ 和 `last_name`，且用户输入了值 `Joe` 和 `Smith`，那么键/值对就是 `first_name/Joe` 和 `last_name/Smith`。在\
  \ `$_GET` 数组中，这些变量表示如下：\n\n```php\n$_GET[\"first_name\"] // value is \"Joe\"\n$_GET[\"\
  last_name\"] // value is \"Smith\"\n```\n\n你可以使用 `each()` 和 `list()` 函数以这种方式遍历数组，打印数组中每个元素的键和值：\n\
  \n```php\nwhile (list($key, $val) = each($_GET)) {\n    echo \"$key has a value\
  \ of $val<br>\";\n}\n```\n\n### reset()\n`reset()` 函数将指针重置到数组的开头。其语法为\n`reset($array_name);`\n\
  \n### shuffle()\n`shuffle()` 函数随机打给定数组的元素。其语法为\n`shuffle($array_name);`\n\n### sizeof()\n\
  `sizeof()` 函数统计数组中的元素个数。在下面的示例中，`$a` 被赋值为等于 `$colors` 数组元素的个数：\n```php\n$a = sizeof($colors);\n\
  ```\n如果 `$colors` 包含值 `blue`、`black`、`red` 和 `green`，则 `$a` 被赋值为 4。\n\n### MySQL\
  \ 数据库连接函数\n存在许多 PHP 函数用于连接和查询 MySQL 服务器。以下是一些基本函数及其语法。请参阅 [`www.php.net/manual/`](http://www.php.net/manual/)\
  \ PHP 手册获取 MySQL 函数的完整列表——函数非常多！\n\n### mysql_connect()\n此函数打开与 MySQL 的连接。它需要服务器名、用户名和密码：\n\
  ```php\n$connection = mysql_connect(\"servername\",\"username\",\"password\");\n\
  ```\n\n### mysql_select_db()\n此函数在 MySQL 服务器上选择一个数据库供后续查询使用。它需要一个有效的已建立连接：\n```php\n\
  $db = mysql_select_db(\"myDB\", $connection);\n```\n\n#### mysql_query()\n此函数发布\
  \ SQL 语句。它需要一个打开的数据库连接：\n```php\n$sql_result = mysql_query(\"SELECT * FROM SOMETABLE\"\
  ,$connection);\n```\n\n### mysql_error()\n此函数在你的连接或查询出现问题时返回一个有意义的错误消息。它通常用于 `die()`\
  \ 函数的上下文中，如下：\n```php\n$sql_result = mysql_query(\"SELECT * FROM SOMETABLE\",$connection)\n\
  or die(mysql_error());\n```\n\n### mysql_fetch_array()\n此函数自动将 SQL 语句的结果行放入一个数组中：\n\
  ```php\n$row = mysql_fetch_array($sql_result);\n```\n\n### mysql_num_rows()\n此函数返回结果集的行数：\n\
  ```php\n$num = mysql_num_rows($sql_result);\n```\n\n## 日期和时间函数\n基础 PHP 日期时间函数允许你轻松格式化时间戳，用于数据库查询和日历函数，也可以简单地在订单收据上打印日期。\n\
  \n### date()\n`date()` 函数返回当前的服务器时间戳，根据给定的参数集进行格式化。其语法为\n`date(format, [timestamp]);`\n\
  如果未提供时间戳参数，则假设为当前时间戳。表 B.7 显示了可用的格式。\n\n**表 B.7：date() 函数格式**\n\n| 字符 | 含义 |\n|\
  \ :--- | :--- |\n| a | 打印 \"am\" 或 \"pm\" |\n| A | 打印 \"AM\" 或 \"PM\" |\n| h | 12\
  \ 小时制的小 (01 到 12) |\n| H | 24 小时制的小 (00 到 23) |\n| g | 不带前导零的 12 小时制小时 (1 到 12)\
  \ |\n| G | 不带前导零的 24 小时制小时 (0 到 23) |\n| i | 分钟 (00 到 59) |\n| s | 秒 (00 到 59) |\n\
  | Z | 秒的时区偏移量 (-43200 到 43200) |\n| U | 自 Unix 纪元以来（1970 年 1 月 1 日 00:00:00 GMT）的秒数\
  \ |\n| d | 两位数字日期 (01 到 31) |\n| j | 不带前导零的两位数字日期 (1 到 31) |\n| D | 文本格式的星期几 (Mon\
  \ 到 Sun) |\n| l | 长文本格式的星期几 (Monday 到 Sunday) |\n| w | 数字格式的星期几，星期日到星期六 (0 到 6)\
  \ |\n| F | 长文本格式的月份 (January 到 December) |\n| m | 两位数字月份 (01 到 12) |\n| n | 不带前导零的两位数字月份\
  \ (1 到 12) |\n| M | 三字母文本的月份 (Jan 到 Dec) |\n| Y | 四位数年份 (2000) |\n| y | 两位数年份 (00)\
  \ |\n| z | 两位数字年份 (01) |\n| t | 月份中的天 (31) |\n| S | 英文后缀 (st, nd, rd, th) |\n| W\
  \ | 一周数 (01 到 53) |\n| W | 纪元以来的年份中的周数 |\n\n### reset()\n`reset()` 函数将指针重置到数组的开头。其语法为\n\
  `reset($array_name);`\n\n### shuffle()\n`shuffle()` 函数随机给定数组的元素。其语法为\n`shuffle($array_name);`\n\
  \n### sizeof()\n`sizeof()` 函数统计数组中的元素个数。在下面的示例中，`$a` 被赋值为等于 `$colors` 数组元素的个数：\n\
  ```php\n$a = sizeof($colors);\n```\n如果 `$colors` 包含值 `blue`、`black`、`red` 和 `green`，则\
  \ `$a` 被赋值为 4。\n\n#### MySQL 数据库连接函数\n存在许多 PHP 函数用于连接和查询 MySQL 服务器。以下是一些基本函数及其 语法。请参阅\
  \ [`www.php.net/manual/`](http://www.php.net/manual/) PHP 手册获取 MySQL 函数的完整列表——函数非常多！\n\
  \n### mysql_connect()\n此函数打开与 MySQL 的连接。它需要服务器名、用户名和密码：\n```php\n$connection = mysql_connect(\"\
  servername\",\"username\",\"password\");\n```\n\n### mysql_select_db()\n此函数在 MySQL\
  \ 服务器上选择一个数据库供后续查询使用。它需要一个有效的已建立连接：\n```php\n$db = mysql_select_db(\"myDB\", $connection);\n\
  ```\n\n#### mysql_query()\n此函数发布 SQL 语句。它需要一个打开的数据库连接：\n```php\n$sql_result = mysql_query(\"\
  SELECT * FROM SOMETABLE\",$connection);\n```\n\n### mysql_error()\n此函数在你的连接或查询出现问题时返回一个有意义的错误消息。它通常用于\
  \ `die()` 函数的上下文中，如下：\n```php\n$sql_result = mysql_query(\"SELECT * FROM SOMETABLE\"\
  ,$connection)\nor die(mysql_error());\n```\n\n### mysql_fetch_array()\n此函数自动将 SQL\
  \ 语句的结果行放入一个数组中：\n```php\n$row = mysql_fetch_array($sql_result);\n```\n\n### mysql_num_rows()\n\
  此函数返回结果集的行数：\n```php\n$num = mysql_num_rows($sql_result);\n```\n\n## 日期和时间函数\n基础\
  \ PHP 日期时间函数允许你轻松格式化时间戳，用于数据库查询和日历函数，也可以简单地在订单收据上打印日期。\n\n### date()\n`date()` 函数返回当前的服务器时间戳，根据给定的参数集进行格式化。其语法为\n\
  `date(format, [timestamp]);`\n如果未提供时间戳参数，则假设为当前时间戳。表 B.7 显示了可用的格式。\n\n**表 B.7：date()\
  \ 函数格式**\n\n| 字符 | 含义 |\n| :--- | :--- |\n| a | 打印 \"am\" 或 \"pm\" |\n| A | 打印 \"\
  AM\" 或 \"PM\" |\n| h | 12 小时制的小 (01 到 12) |\n| H | 24 小时制的小 (00 到 23) |\n| g | 不带前导零的\
  \ 12 小时制小时 (1 到 12) |\n| G | 不带前导零的 24 小时制小时 (0 到 23) |\n| i | 分钟 (00 到 59) |\n\
  | s | 秒 (00 到 59) |\n| Z | 秒的时区偏移量 (-43200 到 43200) |\n| U | 自 Unix 纪元以来（1970 年\
  \ 1 月 1 日 00:00:00 GMT）的秒数 |\n| d | 两位数字日期 (01 到 31) |\n| j | 不带前导零的两位数字日期 (1 到\
  \ 31) |\n| D | 文本格式的星期几 (Mon 到 Sun) |\n| l | 长文本格式的星期几 (Monday 到 Sunday) |\n| w\
  \ | 数字格式的星期几，星期日到星期六 (0 到 6) |\n| F | 长文本格式的月份 (January 到 December) |\n| m | 两位数字月份\
  \ (01 到 12) |\n| n | 不带前导零的两位数字月份 (1 到 12) |\n| M | 三字母文本的月份 (Jan 到 Dec) |\n| Y\
  \ | 四位数年份 (2000) |\n| y | 两位数年份 (00) |\n| z | 两位数字年份 (01) |\n| t | 月份中的天 (31) |\n\
  | S | 英文后缀 (st, nd, rd, th) |\n| W | 一周数 (01 到 53) |\n| W | 纪元以来的年份中的周数\n\n### reset()\n\
  `reset()` 函数将指针重置到数组的开头。其语法为\n`reset($array_name);`\n\n### shuffle()\n`shuffle()`\
  \ 函数随机给定数组的元素。其语法为\n`shuffle($array_name);`\n\n### sizeof()\n`sizeof()` 函数统计数组中的元素个数。在下面的示例中，`$a`\
  \ 被赋值为等于 `$colors` 数组元素的个数：\n```php\n$a = sizeof($colors);\n```\n如果 `$colors` 包含值\
  \ `blue`、`black`、`red` 和 `green`，则 `$a` 被赋值为 4。\n\n## 文件系统函数\n内置的文件系统函数可能非常强大——如果使用不当会有危险。\n\
  \n### chmod(), chgrp(), and chown()\n像命令一样，`chmod()`、`chgrp()` 和 `chown()` 函数修改目录或文件的权限、组和所有者。语法如下：\n\
  `chmod(\"filename\", mode);`\n`chgrp(\"filename\", newgroup);`\n`chown(\"filename\"\
  , newowner);`\n\n### copy()\n`copy()` 函数非常类似于 `cp` 命令：它需要一个文件名和一个目标来复制文件。`copy()`\
  \ 的语法为\n`copy(\"source filename\", \"destination\");`\nPHP 用户必须对目标有写入权限。\n\n###\
  \ fopen()\n`fopen()` 函数打开指定的文件或 URL 用于读取写入。`fopen()` 的语法为\n`fopen(\"filename\",\
  \ \"mode\")`\n打开 URL 在文件名字符串开头使用 `http://` 或 `ftp://`。URL 只能读取。如果文件名以其他字符开头，将从文件系统打开并返回文件指针。否则，假设文件位于本地文件系统。指定的模式决定了是打开读取、写入还是两者。表\
  \ B.8 列出了有效的模式。\n\n**表 B.8：fopen() 函数模式**\n\n| 模式 | 描述 |\n| :--- | :--- |\n| r |\
  \ 只读。文件指针在文件的开头。 |\n| r+ | 读写写。文件指针在文件的开头。 |\n| w | 只写。文件指针在文件的开头，且文件被截断为零。如果文件不存在，则尝试创建。\
  \ |\n| w+ | 读写写。文件指针在文件的开头，且文件被截断为零。如果文件不存在，则尝试创建。 |\n| a | 只写。文件指针在文件的末尾（它向文件中追加内容）。如果文件不存在，则尝试创建。\
  \ |\n| a+ | 读写写。文件指针在文件的末尾。 |\n\n\n\n\n\n# 读取与写入\n\n文件指针当前位于文件末尾（它会向文件追加内容）。如果文件不存在，则尝试创建它。\n\
  \n### x\n创建并打开一个仅用于写入的文件。文件指针位于文件的开头。如果文件已存在，则操作将失败。\n\n### x+\n创建并打开一个可读也可写的文件。文件指针位于文件的开头。如果文件已存在，则操作将失败。\n\
  \n### fread()\n使用 `fread()` 函数从打开的文件指针中读取指定数量的字节。它的语法为\n\n```php\nfread(filepointer,\
  \ length);\n```\n\n### fputs()\n`fputs()` 函数向打开的文件指针写入内容。它的语法为\n\n```php\nfputs(filepointer,\
  \ content, [length]);\n```\n必须打开文件指针才能向文件写入内容。`length` 参数是可选的。如果不指定，则将所有内容写入文件。\n\
  \n### fclose()\n使用 `fclose()` 函数关闭打开的文件指针。它的语法为\n\n```php\nfclose(filepointer);\n\
  ```\n\n### mkdir()\n类似于 shell 命令 `mkdir`，`mkdir()` 函数在文件系统上创建一个新目录。它的语法为\n\n```php\n\
  mkdir(\"pathname\", mode);\n```\nPHP 用户必须对指定的目录具有写入权限。\n\n### rename()\n正如其名所示，`rename()`\
  \ 函数尝试为现有文件重命名。它的语法为\n\n```php\nrename(\"oldname\", \"newname\");\n```\nPHP 用户必须拥有修改文件的权限。\n\
  \n### rmdir()\n类似于 shell 命令 `rmdir`，`rmdir()` 函数从文件系统上删除一个目录。它的语法为\n\n```php\nrmdir(\"\
  pathname\");\n```\nPHP 用户必须对指定的目录具有写入权限。\n\n### symlink()\n`symlink()` 函数从文件系统上的现有文件或目录到指定的链接名称创建一个符号链接。它的语法为\n\
  \n```php\nsymlink(\"targetname\", \"linkname\");\n```\nPHP 用户必须对指定的目录具有写入权限。\n\n\
  ### unlink()\n`unlink()` 函数从文件系统删除一个文件。它的语法为\n\n```php\nunlink(\"filename\");\n\
  ```\nPHP 用户必须对该文件具有写入权限。\n\n# HTTP 函数\n\n用于发送特定 HTTP Header 和 Cookie 数据的内置函数是 PHP\
  \ 开发大型 Web 应用程序的关键部分。幸运的是，这些函数的语法非常易于理解和实现。\n\n### header()\n`header()` 函数输出一个 HTTP\
  \ Header 字符串，例如位置重定向。此输出必须在向浏览器发送任何其他数据（包括 HTML 标签）之前发生。\n\n**注意**：此信息值得反复强调：不要在发送\
  \ `header()` 之前尝试向浏览器发送任何类型的信息。你可以在 `header()` 之前执行任何类型的数据库操作或计算，但你不能向屏幕上打印任何内容——即使是一个换行符也不行。\n\
  \n例如，使用 `header()` 函数将用户重定向到新位置，可以使用此代码：\n\n```php\nheader(\"Location: http://www.newlocation.com\"\
  );\nexit;\n```\n\n**提示**：在 `header()` 语句后紧跟 `exit` 命令。这可以确保代码不会继续执行。\n\n### setcookie()\n\
  `setcookie()` 函数向用户发送 cookie。cookie 必须在向浏览器发送任何其他 Header 信息之前发送。`setcookie()` 的语法为\n\
  \n```php\nsetcookie(\"name\", \"value\", \"expire\", \"path\", \"domain\", \"secure\"\
  );\n```\n\n例如，你将使用以下代码发送一个名为 `username` 值为 `joe` 的 cookie，它在 `testcompany.com` 域名的所有目录下均有效一小时：\n\
  \n```php\nsetcookie(\"username\",\"joe\", time()+3600, \"/\", \".testcompany.com\"\
  );\n```\n\n\n\n\n\n不过那样很无聊。假设你想要一个带有 `phpuser` 前缀的唯一 ID。你可以使用：\n\n```php\n$id =\
  \ uniqid(\"phpuser\");\necho \"$id\";\n```\n\n你会得到类似 `phpuser38b320a6b5482` 的结果。\n\
  \n但如果你使用一些真正酷的东西，比如：\n\n```php\n$id = md5(uniqid(rand()));\necho \"$id\";\n```\n\
  \n你将得到一个像 `999d8971461bedfc7caadcab33e65866` 的 ID。\n\n## 程序执行函数\n\n你可以使用 PHP 内置的程序执行函数来运行系统上存在的程序，例如加密程序、第三方图像处理程序等。对于所有程序执行函数，PHP\
  \ 用户必须拥有执行给定程序的权限。\n\n### `exec()`\n\n`exec()` 函数执行一个外部程序。其语法为： \n\n`exec(command,\
  \ [array], [return_var]);`\n\n如果指定了数组，`exec()` 函数的输出将追加到该数组中。如果指定了 `return_var`，它将被赋值为程序的返回状态值。\n\
  \n例如，你可以使用以下代码对服务器进行五次 ping 并打印输出：\n\n```php\n$command = \"ping -c5 www.thickbook.com\"\
  ;\nexec($command, $result, $rval);\nfor ($i = 0; $i < sizeof($result); $i++) {\n\
  \    echo \"$result[$i]<br>\";\n}\n```\n\n### `passthru()`\n\n与 `exec()` 函数一样，`passthru()`\
  \ 函数执行一个外部程序。两者的区别在于 `passthru()` 返回操作的原始输出。`passthru()` 的语法为：\n\n`passthru(command,\
  \ return_var);`\n\n如果指定了 `return_var`，它将被赋值为程序的返回状态值。\n\n### `system()`\n\n`system()`\
  \ 函数执行一个外部程序并在执行时显示输出。其语法为：\n\n`system(command, [return_var]);`\n\n如果指定了 `return_var`，它将被赋值为程序的返回状态值。\n\
  \n例如，你可以使用以下代码对服务器进行五次 ping 并打印原始输出：\n\n```php\n$command = \"ping -c5 www.thickbook.com\"\
  ;\nsystem($command);\n```\n\n## 正则表达式函数\n\n### `ereg_replace()` 和 `eregi_replace()`\n\
  \n`ereg_replace()` 和 `eregi_replace()` 函数替换字符串中的模式实例并返回新字符串。`ereg_replace()` 函数执行大小写敏感匹配，而\
  \ `eregi_replace()` 执行不区分大小写的匹配。以下是这两个函数的语法：\n\n`ereg_replace(pattern, replacement,\
  \ string);`\n`eregi_replace(pattern, replacement, string);`\n\n例如，你可以使用以下代码将字符串\
  \ \"I really love programming in ASP!\" 中的 \"ASP\" 替换为 \"PHP\"。\n\n```php\n$old_string\
  \ = \"I really love programming in ASP!\";\n$new_string = ereg_replace(\"ASP\",\
  \ \"PHP\", $old_string);\necho \"$new_string\";\n```\n\n如果 \"ASP\" 是混合大小写的（例如 \"\
  aSp\"），请使用 `eregi_replace()` 函数：\n\n```php\n$old_string = \"I really love programming\
  \ in aSp!\";\n$new_string = eregi_replace(\"ASP\", \"PHP\", $old_string);\necho\
  \ \"$new_string\";\n```\n\n### `split()`\n\n`split()` 函数使用特定的分隔符（逗号、分号和空格）将字符串拆分为数组。其语法为：\n\
  \n`split(pattern, string, [limit]);`\n\nlimit 是可选的。如果指定了 limit，`split()` 函数将在指定位置处停止。\n\
  \n## 会话处理函数\n\n会话（Session）处理是在用户浏览你的网站时保存数据的一种方式。数据可以是变量或整个对象。这些简单的函数只是 PHP 的一部分；更多信息请参见\
  \ `http://www.php.net/` 手册。\n\n### `session_start()`\n\n`session_start()` 函数在会话尚未启动时启动会话，或者在会话已存在时恢复会话。该函数不接受参数，只需将其放在代码的开头即可调用：\n\
  \n```php\nsession_start();\n```\n\n### `session_destroy()`\n\n`session_destroy()`\
  \ 函数有效地销毁当前会话的变量和值。该函数不接受参数，只需将其放在你的代码中即可调用：\n\n```php\nsession_destroy();\n```\n\
  \n## 字符串函数\n\n本节仅介绍 PHP 内置字符串处理函数的皮，但如果你理解了这些，你的编程生活将会变得轻松！\n\n### `addslashes()`\
  \ 和 `stripslashes()`\n\n在从数据库插入和检索数据时，`addslashes()` 和 `stripslashes()` 函数非常重要。插入数据库的文本通常包含特殊字符（单引号、双引号、反斜杠），这些字符必须先进行转义。`addslashes()`\
  \ 函数即为此功能，使用如下语法：\n\n`addslashes(string);`\n\n同样，`stripslashes()` 函数返回去掉反斜杠的字符串，使用如下语法：\n\
  \n`stripslashes(string);`\n\n### `chop()`, `ltrim()` 和 `trim()`\n\n这三个函数都从字符串中移除空白字符。`chop()`\
  \ 从字符串的末尾移除空白，`ltrim()` 从开头移除空白，而 `trim()` 则移除两端的空白。\n\n`chop(string);`\n`ltrim(string);`\n\
  `trim(string);`\n\n### `echo()`\n\n`echo()` 函数输出内容。其语法为：\n\n`echo (parameter1, parameter2,\
  \ ...)`\n\n例如：\n\n```php\necho \"I'm using PHP!\"; // 输出 I'm using PHP!\necho 2;\
  \ // 输出 2\n```\n\n### `explode()` 和 `implode()`\n\n`explode()` 函数使用给定的分隔符将字符串拆分为数组。其语法为：\n\
  \n`explode(separator, string);`\n\n例如：\n\n```php\n$color_list = \"blue,black,red,green,orange\"\
  ;\n$colors = explode(\",\", $color_list);\n```\n\n`implode()` 函数将数组通过给定的分隔符转换为字符串。其语法为：\n\
  \n`implode(separator, array);`\n\n例如：\n\n```php\necho implode(\",\", $colors); //\
  \ 输出 blue,black,red,green,orange\n```\n\n### `htmlspecialchars()` 和 `htmlentities()`\n\
  \n`htmlspecialchars()` 和 `htmlentities()` 函数将字符串中的特殊字符转换为可接受的 HTML 实体表示。`htmlspecialchars()`\
  \ 函数转换小于号（<` 变为 `&lt;`）、大于号（>` 变为 `&gt;`）、双引号（\"` 变为 `&quot;`）和和（`&` 变为 `&amp;`）。`htmlentities()`\
  \ 函数将 ISO-8859-1 字符集中的字符转换为正确的 HTML 实体。以下是这些函数的语法：\n\n`htmlspecialchars(string);`\n\
  `htmlentities(string);`\n\n### `nl2br()`\n\n`nl2br()` 函数将 ASCII 换行符替换为 HTML 换行 `<BR>`。其语法为：\n\
  \n`nl2br(string);`\n\n例如：\n\n```php\necho nl2br(\"Hello\\nWorld\"); // 输出 Hello<br\
  \ />World\n```\n\n\n\n\n将字符串视为整数并将其格式化为十六进制数（大写字母）\n\n```\nsprintf(directives, string);\n\
  ```\n\n例如，要将数字 5 转换为 $5.00（五美元），请使用：\n\n```php\n$newnumber = sprintf(\"%0.02f\"\
  , 5);\n```\n\n### `strlen()`\n\n`strlen()` 函数返回给定字符串的长度。其语法如下：\n\n```php\nstrlen(string);\n\
  ```\n\n### `strtolower()`\n\n`strtolower()` 函数返回一个所有字母字符都转换为小写的给定字符串。其语法如下：\n\n\
  ```php\nstrtolower(str);\n```\n\n### `strtoupper()`\n\n`strtoupper()` 函数返回一个所有字母字符都转换为大写的给定字符串。其语法如下：\n\
  \n```php\nstrtoupper (str);\n```\n\n### `substr()`\n\n`substr()` 函数根据指定的起始位置和可选的最终长度返回字符串的一部分。其语法如下：\n\
  \n```php\nsubstr(string, start, [length]);\n```\n\n如果起始位置为正数，则从字符串的开头开始计数。如果起始位置为负数，则从字符串的末尾开始计数。\n\
  \n同样，如果使用了可选的长度参数且为正数，则从字符串的开头开始计数。如果使用了长度参数且为负数，则从字符串的末尾开始计数。\n\n例如：\n\n```php\n\
  $new_string = substr(\"PHP is great!\", 1); // 返回 \"HP is great!\"\n$new_string\
  \ = substr(\"PHP is great!\", 0, 7); // 返回 \"PHP is \"\n$new_string = substr(\"\
  PHP is great!\", -1); // 返回 \"!\"\n$new_string = substr(\"PHP is great!\", -6, 5);\
  \ // 返回 \"great\"\n```\n\n![](img/index-370_1.png)\n\n![](img/index-370_2.png)\n\
  \n![](img/index-370_3.png)\n\n### `ucfirst()`\n\n`ucfirst()` 函数将字符串中的第一个字母字符改为大写字符。其语法如下：\n\
  \n```php\nucfirst(string);\n```\n\n### `ucwords()`\n\n`ucwords()` 函数将字符串中每个单词的首字母改为大写。其语法如下：\n\
  \n```php\nucwords(string);\n```\n\n### 变量函数\n\n两个基本的变量函数 `isset()` 和 `unset()` 帮助你在应用程序的作用范围内管理变量。\n\
  \n`isset()` 函数确定变量是否存在。`unset()` 函数显式地销毁指定的变量。以下是每个函数的语法：\n\n```php\nisset(var);\n\
  unset(var);\n```\n\n如果变量存在，`isset()` 函数返回 `true`；不存在则返回 `false`。\n\n[](itss://chm/8934final/LiB0131.html)\n\
  \n![](img/index-371_1.png)\n\n![](img/index-371_2.png)\n\n![](img/index-371_3.png)\n\
  \n[](itss://chm/8934final/LiB0132.html)\n\n### 附 C：编写你自己的函数和对象\n\n随着你编写代码变得越来越熟，你可能会发现很多时候反复编写相同的代码段。其中一个典型的例子是书中到处使用的数据库连接代码。你曾多少次在心里想：“这真的太重复了！”我确定，这种情况经常发生。这就是编写自己的函数派上用场的地方。\n\
  \n在 PHP 中编程时，你将使用预定义函数来实现某些结果。例如，`mail()` 函数是一个用于发送邮件的预定义函数。`mysql_connect()` 函数是一个连接到\
  \ MySQL 数据库的预定义函数。构成这些函数的代码被构建在 PHP 脚本引擎中，因此你永远看不见它们。\n\n然而，你可以编写自己的函数并在脚本中使用它们，甚至可以将你自己的函数存储在外部文件中，仅在需要时使用。\n\
  \n### 函数的结构\n\n函数具有非常特定的结构，如下面的代码所示，其中 `[function name]` 和 `[arguments]` 应该替换为你自己的函数名和任何你可能想使用的参数：\n\
  \n```php\nfunction [function_name] ([arguments]) {\n    // 代码\n}\n```\n\n当你创建一个函数时，在函数名前之前要加上字面单词\
  \ `function`。在 `function` 单词和你的函数名之后，是一组括号内的参数列表。参数是可选的，因为如果你不想，就不必向函数传递任何参数——它们之间用逗号分隔，并持有你的函数完成其任务或多项任务所需要的值。\n\
  \n在参数之后，你打开一组大括号，输入你所有的代码，最后闭上大括号。例如，下面的函数（称为 `multiplier`）接受一个名为 `$num` 的参数，并将该值乘以\
  \ 5。\n\n```php\nfunction multiplier ($num) {\n    $answer = $num \\* 5;\n}\n```\n\
  \n假设你已经确定 `$num` 等于 8，并且这就是你传递给 `multiplier` 函数的数值。利用你自己的数学技巧，你知道 `$answer` 将等于\
  \ 40。为了将该数字传回你的脚本（函数外部），你必须返回该值。\n\n### 从函数返回值\n\n从函数中返回值的基本方法是使用 `return` 语句。通常，该语句位于函数的末尾，如下：\n\
  \n```php\nfunction multiplier ($num) {\n    $answer = $num \\* 5;\n    return $answer;\n\
  }\n```\n\n**注意** `return` 语句可以位于函数的任何位置，但当使用时，它会结束函数的执行。这意味着被执行的代码是脚本中调用 `return`\
  \ 语句的那一行。\n\n当你使用 `return` 语句时，你就可以像这样这样在代码中调用该函数了：\n\n```php\necho multiplier(5);\n\
  ```\n\n这种用法将在你的屏幕上显示以下内容：\n\n40\n\n因为你将 8 作为 `$num` 参数传递给 `multiplier()` 函数，所以 `$answer`\
  \ 变为 40。因为 `$answer` 作为函数操作的结果被返回了，并且你使用了 `echo` 后紧跟函数调用，你是在告诉 PHP 打印函数内代码的结果。在这种情况下，该结果就是数字\
  \ 40。\n\n**注意** 你也可以使用 `return` 语句获取多个值，但仅当这些值是数组或对象的一部分时。\n\n![](img/index-372_1.png)\n\
  \n![](img/index-372_2.png)\n\n![](img/index-372_3.png)\n\n\n\n\n```php\n$db = @mysql_select_db($db_name,\
  \ $connection)\nor die(mysql_error());\n}\n```\n\n与其在每个脚本中反复输入这两行代码，想象一下你只需要输入这个：\n\
  \n```php\ndb_connect();\n```\n\n如果你的主机名、用户名、密码或数据库名称发生变化，你只需要在一个地方更改这些信息——即 `db_connect()`\
  \ 函数代码。现在唯一的技巧就在于将这个函数存放在哪里。显然，如果你创建一个函数是为了重用其内部的代码，你并不希望该函数成为脚本的一部分。相反，你应该将函数存放在一个单独的文件中（或包含其他函数的文件中），并根据需要使用\
  \ `include()` 或 `require()` 将这些信息拉取到你的脚本中。\n\n### 使用 `include()` 和 `require()`\n\
  \n`include()` 和 `require()` 函数本质上是相同的：当它们被调用时，被包含的文件中的代码就会调用它的脚本的一部分。从该点起，被包含文件中的任何内容都可以在调用它的脚本中使用。\n\
  \n当无法打开要包含的文件时，`include()` 和 `require()` 的区别就体现出来了。这可能是因为权限错误，或者可能是文件不在指定位置。当使用\
  \ `include()` 失败时，你会得到一个警告，但代码会尽可能继续执行，也就是说，如果它需要另一个文件中的函数，那么执行效果就大糟糕了！当 `require()`\
  \ 找不到或打开文件时，你将得到一个致命错误（fatal error），PHP 将完全停止处理代码。\n\n包含的文件看起来与其他任何 PHP 文件一样，以 PHP\
  \ 标签开始并以关闭 PHP 标签结束。例如，假设你有一个名为 `myfunctions.php` 的文件，包含以下代码：\n\n```php\n<?\n/*\
  \ multiplier() 函数将数字乘以 5 并返回结果 */\nfunction multiplier($num) {\n    $answer = $num\
  \ * 5;\n    return $answer;\n}\n\n/* db_connect() 函数连接到我的数据库 */\nfunction db_connect()\
  \ {\n    $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n \
  \   or die(mysql_error());\n    $db = @mysql_select_db($db_name, $connection)\n\
  \    or die(mysql_error());\n}\n?>\n```\n\n那么，在你需要连接数据库的实际 PHP 脚本中，你将会有：\n\n```php\n\
  <?\n// 包含有你所需的函数的文件\ninclude(\"/path/to/myfunctions.php\");\n\n// 调用函数\ndb_connect();\n\
  \n// 现在你可以执行诸如查询和获取结果等操作\n?>\n```\n\n显然，这是一个将包含文件作为函数库的简单示例，但你可能已经看到了它的用处！在任何有重复代码的地方，都考虑使用你自己的函数来替换它。你可以拥有多个文件，其中充满了根据任务适当命名的函数库。当你练习确定函数可以使用何时时，你可以轻松地优化你的代码。自己尝试一下吧——书中使用了大量的重复代码，你可以快速地将它们转换为你自己的紧凑型应用程序！\n\
  \n## 操作对象\n\n在本书的有时，我提到了“面向对象编程”，指的是一种比本书所基础的脚本（过程式）更复杂的编程类型。对象就像是一个理论上的盒子——里面有变量、函数等——它存在于名为\
  \ `class`（类）的模板结构中。虽然可视化一个简单的变量（例如值为红色的 `$color`，或一个包含三个或四个元素的数组 `$rainbow`）很容易，但有些人发现可视化对象时感到很困难。\n\
  \n现在，尝试将对象想象成一个两边都有输入和输出的小盒子。输入机制被称为 `methods`（方法），而方法拥有 `properties`（属性）。在本节中，你将查看类、方法和属性如何共同工作以产生各种输出。这将让你对面向对象编程的内容有一个良好的了解，如果你在构建应用程序时想走那条路线。要学习更多关于该主题的内容，请查看\
  \ PHP 手册中的“Classes and Objects”章节，地址为 http://www.php.net/manual/en/language.oop.php。\n\
  \n对象有一个结构，被称为 `class`（类）。在 `class` 中，定义了一组特征。例如，假设你创建了一个“房屋类”。在房屋类中，你可能有建筑类型、面积和颜色等特征。每个房屋对象都使用所有特征，但它们被初始化为不同的值，例如单层住宅、1500\
  \ 和白色铝护墙，或者公寓、786 和浅褐色抹灰层。\n\n由于类的结构非常紧密，但又是自包含且相互独立的，因此它们可以从一个应用程序复用到另一个应用程序。例如，假设你在一个项目中编写了一些文本格式类，并决定可以在另一个项目中使用该类。\n\
  \n### 创建对象\n\n创建对象非常简单；你只需要声明它：\n\n```php\nclass myClass {\n// 代码写在这里\n}\n$object1\
  \ = new myClass();\n```\n\n现在你已经有了一个 `class`，你就可以创建一个对象的实例：\n\n```php\n<?\nclass\
  \ myClass {\n    // 代码写在这里\n}\n$object1 = new myClass();\necho \"$object1 is an\
  \ \".gettype($object1);\n?>\n```\n\n如果你将这段代码保存为 `objtest.php`，将其置于文档根目录，并用网络浏览器访问它，你将在屏幕上看到：`is\
  \ an object`。\n\n### 对象的属性\n\n在对象内部声明的变量被称为属性（properties）。标准的做法是在类顶部声明你的变量。这些属性可以是值、数组甚至是对象。例如：\n\
  \n```php\nclass myHouse {\n    var $type = \"condo\";\n    var $sqfootage = \"786\"\
  ;\n    var $color = \"tan stucco\";\n}\n```\n\n现在，当你创建一个 `myHouse` 对象时，它拥有这三个属性，你可以引用它们。以下展示了它是如何工作的：\n\
  \n```php\n<?\nclass myHouse {\n    var $type = \"condo\";\n    var $sqfootage =\
  \ \"786\";\n    var $color = \"tan stucco\";\n}\n$house = new myHouse();\necho \"\
  I live in a \".$house->color.\" \".$house->sqfootage.\"square foot \".$house->type;\n\
  ?>\n```\n\n如果你将这段代码保存为 `myHouse.php`，将其置于文档根目录，并用网络浏览器访问，你将在屏幕上看到：`I live in a tan\
  \ stucco 786 square foot condo`。\n\n### 对象方法\n\n方法（Methods）为你的对象增加了功能；对象不再仅仅包含属性，而是会执行有用的操作。例如，以下类输出一个字符串：\n\
  \n```php\n<?php\nclass anotherClass {\n    function sayHello() {\n        echo \"\
  HELLO!\";\n    }\n}\n$object1 = new anotherClass();\n$object1->sayHello();\n?>\n\
  ```\n\n如果你将包含此代码的文件放在文档根目录并用网络浏览器访问，你将在屏幕上看到：`HELLO!`。\n\n所以，方法看起来和作用起来和普通函数一样，但它是定义在类框架之内的。使用\
  \ `->` 运算符在脚本上下文中调用对象方法。如果对象中存储了任何变量，该方法能够访问这些变量以完成自己的目的。例如：\n\n```php\n<?\nclass\
  \ anotherClass {\n    var $name = \"Joe\";\n    function sayHello() {\n        echo\
  \ \"HELLO! My name is \".$this->name;\n    }\n}\n$object1 = new anotherClass();\n\
  $object1->sayHello();\n?>\n```\n\n\n\n\n\n如果你保存此代码并将其放在文档根目录下，然后用网络浏览器访问它，你将在屏幕上看到以下内容：\n\
  \nHELLO! My name is Joe\n\n特殊变量 `$this` 用于引用当前实例化的对象。每当对象引用自身时，你必须使用 `$this` 变量。将\
  \ `$this` 变量与 `->` 操作符结合，允许你在类内部访问类的任何属性或方法。\n\n### 构造函数\n\n构造函数是一个存在于类中的函数，如果它的名称与类相同，那么在使用\
  \ `new classname` 创建类的新实例时它会被自动调用。使用构造函数允许你为类提供参数，这些参数会在第一次被调用时立即被处理。你将在下一节中看到构造函数的实际作用。\n\
  \n### 对象继承\n\n在学习了对象、属性和方法的基础知识后，你就可以开始研究对象继承了。类的继承顾如其名：一个类继承其父类的功能。这里展示了一个示例：\n\
  \n![](img/index-377_1.png)\n![](img/index-377_2.png)\n![](img/index-377_3.png)\n\
  \n```php\n<?\nclass myClass {\n    var $name = \"Joe\";\n\n    function myClass($n)\
  \ {\n        $this->name = $n;\n    }\n\n    function sayHello() {\n        echo\
  \ \"HELLO! My name is \".$this->name;\n    }\n}\n\nclass childClass extends myClass\
  \ {\n    //代码写在这里\n}\n\n$object1 = new childClass(\"Child of Joe\");\n$object1 ->\
  \ sayHello();\n?>\n```\n\n如果你保存此代码，将其放在文档根目录下，并用网络浏览器访问它，你将在屏幕上看到以下内容：\n\nHELLO!\
  \ My name is Child of Joe\n\n这些行构成了构造函数：\n\n```php\nfunction myClass($n) {\n   \
  \ $this->name = $n;\n}\n```\n\n该函数的命名与它所属的类相同：`myClass`。然后你看到定义了 `childClass`，但它没有包含任何代码。在这个示例中，它的目的是为了演示对父类的继承。继承是通过使用\
  \ `extends` 子句实现的，例如：\n\n```php\nclass childClass extends myClass {\n```\n\n因为使用了这个子句，第二个类继承了第一个类的元素。像大多数面向对象编程的元素一样，继承在尝试让代码具有活性时非常有用。假设你创建了一个文本格式化类，用于组织和存储数据、将其格式化为\
  \ HTML 并结果输出到浏览器——这是你自己的杰作。现在假设你有一个客户想使用这个概念，但他不想将内容格式化为 HTML 并发送到浏览器，而是想将其格式化为纯文本并保存到文本文件中。没问题——你只需要添加几个方法和属性即可搞定。最后，客户回来了，他真的希望将数据格式化并作为电子邮件发送——那么，见鬼，为什么不顺便也创建\
  \ XML 格式的文件呢？\n\n如果你将编译和存储类与格式化类分开——为每种不同的交付方式（HTML、文本、电子邮件和 XML）设置一个类——你本质上就拥有了父子关系。将父类考虑为持有编译和存储方法的类。格式化类是子类——它们从父类继承信息并根据自己的功能输出结果。\n\
  \n这个简短的附录完全没有涵盖面向对象编程的所有方面——大学专门教授这一主题的系列课程。然而，你确实学习了如何创建类并从类实例化对象，如何创建和访问类的属性和方法，如何构建新类，以及如何从父类继承特性。你现在应该拿起一本关于面向对象编程的书而不会感到完全不知所措。\n\
  \n[](itss://chm/8934final/LiB0134.html)\n\n![](img/index-378_1.png)\n![](img/index-378_2.png)\n\
  ![](img/index-378_3.png)\n\n[](itss://chm/8934final/LiB0135.html)\n\n# 附录 D：数据库规范化与\
  \ SQL 参考\n\n书中使用的数据库表是为了简单而设计的，帮助你理解 PHP 和 MySQL 之间的基本交互。这些不是“规范化”的数据库。“规范化”是一个当你开始创建详细的数据库驱动应用程序时经常听到的词，它需要一种不同的思维方式——在看到眼前的关系之前，先以关系式的方式进行思考。在本附录中，你将学习数据库规范化的基础知识，以及\
  \ SQL 语言的一些关键元素。\n\n### 理解数据库规范化\n\n数据库规范化本质上是一组规则，允许你以这种方式组织数据库，使得你的表在适当的情况下相关，并且对于未来的增长和关系具有灵活性。规范化使用的规则集被称为\
  \ `范式`（normal forms）。如果你的数据库设计遵循第一组规则，则它被视为第一范式。如果遵循了前三组规范化规则，你的数据库就被认为处于第三范式。\n\
  \n### 应用范式\n\n在解释范式之前，让我们从一个需要被规范化的东西开始。在数据库的情况下，`平表`（flat table）是需要规范化的典型示例。平表就像包含许多列数据的电子表格。在平表中，表之间没有关系，所有数据都在这一个表中。这种方案并不是最高效的，比一组规范化的表占用更多的硬盘空间。\n\
  \n假设你有一个存储学生和课程信息的表。你可能在平表中拥有以下字段，如表 D.1 所示：\n\n### 表 D.1：学生表\n\n| 字段名称 | 说明 |\n\
  | :--- | :--- |\n| StudentName | 学生姓名 |\n| CourseID1 | 学生参加的第一门课程 ID |\n| CourseDescription1\
  \ | 学生参加的第一门课程描述 |\n| CourseInstructor1 | 学生参加的第一门课程教师 |\n| CourseID2 | 学生参加的第二门课程\
  \ ID |\n| CourseDescription2 | 学生参加的第二门课程描述 |\n| CourseInstructor2 | 学生参加的第二门课程教师\
  \ |\n\n你可能会多次重复 `CourseID`、`CourseDescription` 和 `CourseInstructor` 列，以涵盖学生学术生涯中可能参加的所有课程。虽然冗余，但这是创建单个平表存储信息时使用的方法。消除冗余是数据库规范化的第一步，因此接下来我们将这个平表转换为第一范式。\n\
  \n### 将表转换为第一范式\n\n第一范式的主要规则如下：\n\n- 消除重复信息\n- 为相关数据创建单独的表\n\n观察平表设计，它包含许多重复的学生和课程字段集，你可以识别出学生和课程是两个不同的主题。将你的学生和课程平表转换为第一范式意味着你要创建两个表：一个用于学生（命名为\
  \ `students`），另一个用于学生加课程（命名为 `students_courses`）。你可以在表 D.2 和 D.3.中看到新的表设计。\n\n\n\
  \n\n\n## 表 D.2：学生表 (students)\n\n| 字段名称 | 描述 |\n| :--- | :--- |\n| `StudentID` |\
  \ 学生的唯一 ID。此新字段现在是主键。 |\n| `StudentName` | 学生姓名。 |\n\n## 表 D.3：学生课程表 (students_courses)\n\
  \n| 字段名称 | 描述 |\n| :--- | :--- |\n| `StudentID` | 学生的唯一 ID，对应 `students` 表中的某项。\
  \ |\n| `CourseID` | 学生正在修的课程 ID。 |\n| `CourseDescription` | 学生所修课程的描述。 |\n| `CourseInstructor`\
  \ | 学生所修课程的讲师。 |\n\n你现在的两个新表代表了从一个学生到多门课程的一对多关系。学生可以选修任意数量的课程，不再受限于扁平表中存在的 `CourseID`/`CourseDescription`/`CourseInstructor`\
  \ 组合数量。你仍然还有一些工作要做的，下一步是将这些表转换为第二范式（Second Normal Form）。\n\n字体 将表转换为第二范式\n\n第二二范式的基本规则是：\n\
  非主键属性不依赖于主键的部分\n\n用通俗的话说，这意味着如果表中的字段没有完全与主键相关，你就必须继续对它们进行处理。在 `students` 和课程示例中，这意味着将课程拆分到单独表中，使得原始的扁平表现在只是一个包含唯一学生的表。\n\
  \n`CourseID`、`CourseDesc` 和 `CourseInstructor` 可以变成一个名为 `courses` 的表，主键为 `CourseID`。然后\
  \ `students_courses` 表应该只包含两个字段：`StudentID` 和 `CourseID`。你可以在 表 D.4 和 表 D.5. 中看到新的表设计。\n\
  \n## 表 D.4：课程表 (courses)\n\n| 字段名称 | 描述 |\n| :--- | :--- |\n| `CourseID` | 课程的唯一\
  \ ID |\n| `CourseDescription` | 课程描述 |\n| `CourseInstructor` | 课程讲师 |\n\n## 表 D.5：新的学生课程表\
  \ (students_courses)\n\n| 字段名称 | 描述 |\n| :--- | :--- |\n| `StudentID` | 学生的唯一 ID，对应\
  \ `students` 表中的某项。 |\n| `CourseID` | 正在修的课程的唯一 ID，对应 `courses` 表中的某项。 |\n\n信不信，你可以对这个示例更进一步，达到第三范式（Third\
  \ Normal Form）。\n\n### 将表转换为第三范式\n\n第三范式的规则是：\n任何属性都不依赖于其他非主键属性\n\n这条规则简单意味着你需要查看你的表，并确定是否存在可以进一步拆分且不依赖于键的字段。考虑移除重复数据，你就会找到答案——讲师。通常，一个讲师会教多门课。然而，`courses`\
  \ 表中的 `CourseInstructor` 字段并不是任何类型的键。因此，如果你为了效率和维护纯目的而拆分这些信息并创建一个单独表，那就是第三范式。看看新的课程表，以及讲师\
  \ 表，在表 D.6 和 表 D.7 中。\n\n## 表 D.6：课程表 (courses)\n\n| 字段名称 | 描述 |\n| :--- | :---\
  \ |\n| `CourseID` | 课程的唯一 ID |\n| `CourseDescription` | 课程描述 |\n| `CourseInstructorID`\
  \ | 讲师 ID，对应 `instructors` 表中的某项 |\n\n## 表 D.7：讲师表 (instructors)\n\n| 字段名称 | 描述\
  \ |\n| :--- | :--- |\n| `InstructorID` | 讲师唯一 ID |\n| `InstructorName` | 讲师姓名 |\n\
  | `InstructorNotes` | 关于讲师的备注 |\n\n第三范式通常足以消除冗余并允许灵活性和增长。接下来，你对书中之前用过的 `my_contacts`\
  \ 表进行规范化。\n\n### 规范化 my_contacts 表\n\n在原始的 `my_contacts` 表中，重复信息并不多，但如果你将其扩展为真正的地址录，重复信息就会非常容易出现。在地址录中，人们通常有家庭和工作的联系信息、多种电话方式（座机、手机等），甚至有多个电子邮件地址。将所有这些元素拆分到单独的表中，并通过主键将信息附加到人身上会有意义得多。表\
  \ D.8 显示了原始的 `my_contacts` 表作为参考。\n\n## 表 D.8：原始 my_contacts 表\n\n| 字段名称 | 描述 |\n\
  | :--- | :--- |\n| `id` | 为条目创建一个唯一的 ID 号 |\n| `f_name` | 人的名 |\n| `l_name` | 人的姓\
  \ |\n| `address1` | 地址的第一行 |\n| `address2` | 地址的第二行 |\n| `address3` | 地址的第三行 |\n\
  | `postcode` | 邮政编码或邮编 |\n| `country` | 人所在的国家 |\n| `prim_tel` | 主电话号码 |\n| `sec_tel`\
  \ | 次电话号码 |\n| `email` | 电子邮件地址 |\n| `birthday` | 人的生日 |\n\n现在识别将存在不同表的不同区域：地址、电话和电子邮件对于这个示例来说。表\
  \ D.9， 表 D.10， 和 表 D.11 显示这些新表。\n\n## 表 D.9：地址表\n\n| 字段名称 | 描述 |\n| :--- | :---\
  \ |\n| `id` | 为条目创建一个唯一的 ID 号 |\n| `address1` | 地址的第一行 |\n| `address2` | 地址的第二行\
  \ |\n| `address3` | 地址的第三行 |\n| `postcode` | 邮政编码或邮编 |\n| `country` | 人所在的国家 |\n\
  \n## 表 D.10：电话表\n\n| 字段名称 | 描述 |\n| :--- | :--- |\n| `id` | 为条目创建一个唯一的 ID 号 |\n\
  | `prim_tel` | 主电话号码 |\n| `sec_tel` | 次电话号码 |\n\n## 表 D.11：电子邮件表\n\n| 字段名称 | 描述\
  \ |\n| :--- | :--- |\n| `id` | 为条目创建一个唯一的 ID 号 |\n| `email` | 电子邮件地址 |\n\n这些新表都包含\
  \ `contact_id` 键，它对应主表中的某项。作为主表的基础 `my_contacts` 表现在看起来像[表 D.12]。\n\n## 表 D.12：新的\
  \ my_contacts 表\n\n| 字段名称 | 描述 |\n| :--- | :--- |\n| `id` | 为条目创建一个唯一的 ID 号 |\n\
  | `f_name` | 人的名 |\n| `l_name` | 人的姓 |\n| `birthday` | 人的生日 |\n| `contact_id` |\
  \ 对应子表条目的键 |\n\n有了这些新表，你将拥有一更灵活（且规范化的！）表集来维护联系信息。\n\n## 基础 MySQL 参考资料\n\n在本节中，你将简要查看结构化查询语言\
  \ (SQL)，以及你可以配合 MySQL 使用的一些基本函数，这些函数可以让开发变得更容易。访问 [`www.mysql.com/`](http://www.mysql.com/)\
  \ 获取完整的 MySQL 函数和语言元素，或者为了获得使用 MySQL 的良好介绍，可以购买我的书籍《24 小时学会 MySQL》。\n\n**注意** 在整个附录中，括号内的任何内容都应视为占位符文本。例如，在命令中用实际的数据库名称替换\
  \ `[yourDBName]`。\n\n在涉及 MySQL 函数的部分，请意识到这些函数是 MySQL 特有的，不适用于其他数据库如 Oracle、Microsoft\
  \ SQL Servers 甚至是 SQLite（你将在附录 E 中学习）。\n\n\n\n\n然而，SQL 的基本元素对于此类支持 SQL 的数据库都是通用的。\n\
  \n## 创建或删除数据库\n\n从最简单的操作开始，你可以使用 SQL `CREATE` 命令来创建一个新数据库。语法如下：\n\n```sql\nCREATE\
  \ DATABASE [yourDBName];\n```\n\n当你使用此命令创建数据库时，你实际上只是创建了一个目录，用于存放构成数据库中表的文件。\n\n\
  若要从系统中删除整个数据库，请使用 `DROP` 命令：\n\n```sql\nDROP DATABASE [yourDBName];\n```\n\n在使用\
  \ `DROP` 命令时请务必极其小心，因为一旦删除了数据库，所有的表也会随之移除！\n\n## 创建或删除表\n\n你也可以使用 SQL `CREATE` 命令在当前数据库中创建一个表。语法如下：\n\
  \n```sql\nCREATE TABLE [yourTableName] ([fieldName1] [type], [fieldName2] [type],\
  \ ...) [options]\n```\n\n若要从当前数据库中删除表，请使用 `DROP` 命令：\n\n```sql\nDROP TABLE [yourTableName];\n\
  ```\n\n在使用 `DROP` 命令时请务必极其小心，因为一旦你删除了表，它们就消失了！\n\n## 修改表\n\nSQL `ALTER` 命令让你有机会修改特定表的元素，例如重命名列、更改列的类型、添加列、删除列等。以下是一些常见用法：\n\
  \n要向表中添加一列，请使用此命令：\n\n```sql\nALTER TABLE [yourTableName] ADD [newColumn] [fieldDefinition];\n\
  ```\n\n要从从删除删除一列，请使用此命令：\n\n```sql\nALTER TABLE [yourTableName] DROP [columnName];\n\
  ```\n\n要将列从一种类型更改另一种类型，请使用此命令：\n\n```sql\nALTER TABLE [yourTableName] CHANGE [columnName]\
  \ [newfieldDefinition];\n```\n\n要在表中创建一个唯一列，请使用此命令：\n\n```sql\nALTER TABLE [yourTableName]\
  \ ADD UNIQUE [columnName] ([columnName]);\n```\n\n要对表的某列建立索引，请使用此命令：\n\n```sql\n\
  ALTER TABLE [yourTableName] ADD INDEX [columnName] ([columnName]);\n```\n\n使用 `ALTER`\
  \ 命令避免了因为拼错字段名或犯了其他微小错误而删除整个表并重新创建它。\n\n## 在表内插入、更新或替换\n\nSQL `INSERT` 和 `REPLACE`\
  \ 命令逐条记录地填充你的表。`INSERT` 的语法为：\n\n```sql\nINSERT INTO [yourTableName] ([fieldName1],\
  \ [fieldName2], ...)\nVALUES ('[value of fieldName1]', '[value of fieldName2]'...);\n\
  ```\n\n在插入记录时，确保用单引号或双引号分隔字符串。如果你在字符串周围使用单引号，且要添加的数据包含单引号，请在 `INSERT` 语句中使用转义单引号（`\\\
  '`）来避免错误。同样，如果你在字符串周围使用双引号并想在数据中包含双引号，请在 `INSERT` 语句中对其转义（`\\\"`）。\n\n这里是一个需要转义的字符串示例：\n\
  `O'Grady said \"Wow\"`\n\n如果你用双引号包含字符串，`INSERT` 语句将如下：\n\n```sql\nINSERT INTO table_name\
  \ (column_name) VALUES (\"O'Grady said \\\"Wow\\\"\");\n```\n\n如果你改用单引号包含字符串，`INSERT`\
  \ 语句将如下：\n\n```sql\nINSERT INTO table_name (column_name) VALUES ('O\\'Grady said\
  \ \"Wow\"');\n```\n\n`REPLACE` 语句与 `INSERT` 语句具有相同的语法和要求。唯一的区别是，当替换基于唯一值时，你使用 `REPLACE`\
  \ 来覆盖表中的某条记录：\n\n```sql\nREPLACE INTO [yourTableName] ([fieldName1], [fieldName2],\
  \ ...)\nVALUES ('[value of fieldName1]', '[value of fieldName2]'...);\n```\n\n`UPDATE`\
  \ 命令修改记录的部分而不替换整条记录。若要更新表中的整列数据为相同的新值，请使用此命令：\n\n```sql\nUPDATE [yourTableName]\
  \ SET [fieldName] = '[new value]\n```\n\n如果你只想更新特定的行，请使用 `WHERE` 子句：\n\n```sql\n\
  UPDATE [yourTableName] SET [fieldName] = '[new value]' WHERE [some expression];\n\
  ```\n\n`UPDATE` 是一个非常强大的 SQL 命令。例如，你可以对现有记录执行字符串函数和数学函数，并使用 `UPDATE` 命令修改它们的值。\n\
  \n## 从表中删除删除数据\n\n与 SQL `DROP` 命令一样，在使用 `DELETE` 时如果不注意自己在做什么，可能会生产环境中导致灾难性的后果。一旦你删除了表或删除了记录，它就永远消失了。不要害怕——只要小心即可。要删除表的所有内容，请使用以下命令：\n\
  \n```sql\nDELETE FROM [yourTableName];\n```\n\n若你只想删除特定的行，请使用 `WHERE` 子句：\n\n```sql\n\
  DELETE FROM [yourTableName] WHERE [some expression];\n```\n\n如果你准备开始删除记录，请确保你有备份，以防万一。每个人都会犯错——希望以后再也不会。\n\
  \n## 从表中查询数据\n\n在创建数据库驱动的网站时，SQL `SELECT` 命令可能是你工具箱中最常用的命令。`SELECT` 命令根据你定义的标准选择表中的某些记录。这是\
  \ `SELECT` 的基本语法：\n\n```sql\nSELECT [field names] FROM [table name]\nWHERE [some\
  \ expression]\nORDER BY [field names];\n```\n\n要选择表中的所有记录，请使用此命令：\n\n```sql\nSELECT\
  \ * FROM [yourTableName];\n```\n\n要只选择表中给定列的条目，请使用此命令：\n\n```sql\nSELECT [columnName]\
  \ FROM [yourTableName];\n```\n\n要选择表中的所有记录并按特定顺序返回，请对 `ORDER BY` 使用表达式。例如，如果你有一个用于记录条目的日期字段，并且你想按从新到旧的顺序查看所有记录条目，请使用此命令：\n\
  \n```sql\nSELECT * FROM [yourTableName] ORDER BY [dateField] DESC;\n```\n\n`DESC`\
  \ 代表降序。要按从旧到新的顺序，使用 `ASC`。`ASC` 是升序的。\n\n## MySQL 特有的字符串函数\n\n此列表列出了 MySQL 文档中常用的字符串函数。访问\
  \ `http://www.mysql.com/doc/` 查看更多。\n\n你可以使用 `CONCAT` 连接值：\n\n```sql\nSELECT CONCAT([field1],[field2])\
  \ AS [newName] FROM [yourTableName];\n```\n\n将结果转换为小写使用 `LOWER()` 函数：\n\n```sql\n\
  SELECT LOWER([field1],[field2]) FROM [yourTableName];\n```\n\n将结果转换为大写使用 `UPPER()`\
  \ 函数：\n\n```sql\nSELECT UPPER([field1],[field2]) FROM [yourTableName];\n```\n\n\
  ## MySQL 特有的日期和时间函数\n\n此列表列出了 MySQL 文档中常用的日期和时间函数。访问 `http://www.mysql.com/doc/`\
  \ 查看更多。\n\n使用 `DAYOFWEEK()` 函数获取几几（1 = 周日，2 = 周一，...）：\n\n```sql\nSELECT DAYOFWEEK([date])\
  \ FROM [yourTableName];\n```\n\n使用 `WEEKDAY()` 函数获取工作日（0 = 周一，1 = 周二，...）：\n\n```sql\n\
  SELECT WEEKDAY([date]) FROM [yourTableName];\n```\n\n**注意** `DAYOFWEEK()` 和 `WEEKDAY()`\
  \ 函数的区别在于周的起始点。当你获取星期几时，周是从第 1 天（周日）开始的。当你获取工作（工作日）时，周是从第 0 天（周一）开始的。\n\n使用 `DAYOFMONTH()`\
  \ 函数获取日期中的几天（1 到 31）：\n\n```sql\nSELECT DAYOFMONTH([date]) FROM [yourTableName];\n\
  ```\n\n使用 `DAYOFYEAR()` 函数获取一年中的第几天（1 到 366）：\n\n```sql\nSELECT DAYOFYEAR([date])\
  \ FROM [yourTableName];\n```\n\n使用 `MONTH()` 函数获取日期中的月份（1 到 12）：\n\n```sql\nSELECT\
  \ MONTH([date]) FROM [yourTableName];\n```\n\n\n\n\n`SELECT MONTH([date]) FROM [yourTableName];`\n\
  \n使用 `MONTHNAME()` 函数从日期字段中获取月份名称（January, February, ...）。语法如下：\n\n```sql\nSELECT\
  \ MONTHNAME([date]) FROM [yourTableName];\n```\n\n使用 `DAYNAME()` 函数从日期字段中获取星期名称（Monday,\
  \ Tuesday, ...）。语法如下：\n\n```sql\nSELECT DAYNAME([date]) FROM [yourTableName];\n\
  ```\n\n使用 `WEEK()` 函数从日期字段中获取周数（0 到 53）。可以周日（0）或周一（1）作为周的开始。语法如下：\n\n```sql\nSELECT\
  \ WEEK([date], [0 or 1]) FROM [yourTableName];\n```\n\n使用 `YEAR()` 函数从日期字段中获取年份（1000\
  \ 到 9999）。语法如下：\n\n![](img/index-385_1.jpg)\n![](img/index-385_2.png)\n![](img/index-385_3.png)\n\
  ![](img/index-385_4.png)\n\n```sql\nSELECT YEAR([date]) FROM [yourTableName];\n\
  ```\n\n### 使用 SHOW 命令\n\n有几种类型的 `SHOW` 命令，它们会产生输出帮助你管理 MySQL 数据库。执行这些命令的常用方法是通过\
  \ MySQL Monitor（MySQL Monitor），即 MySQL 的命令行界面，你在第 1 章，“安装和配置 MySQL”中使用它。\n\n基本的\
  \ `SHOW` 命令是 `SHOW DATABASES` 和 `SHOW TABLES`，它们只需显示服务器上数据库和表的名称。如果你使用 `SHOW CREATE\
  \ TABLE` 命令，它会向你显示创建指定表的精确 SQL 语句。\n\n如果你需要知道表的结构，但不一定需要创建它的 SQL 命令，可以使用 `SHOW COLUMNS`\
  \ 命令：\n\n```mysql\nmysql> SHOW COLUMNS FROM [testTable];\n```\n\n出于管理目的，`SHOW STATUS`\
  \ 和 `SHOW VARIABLES` 命令可以快速提供关于你的数据库服务器的重要信息。有关这些命令产生的许多行输出的更多信息，请参阅 MySQL 手册的相关部分，地址为\
  \ [shttp://www.mysql.com/doc/](http://www.mysql.com/doc/)。\n\n[](itss://chm/8934final/LiB0136.html)\n\
