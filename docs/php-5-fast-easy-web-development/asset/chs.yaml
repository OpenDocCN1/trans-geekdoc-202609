  \n# 第四部分：了解你的 MySQL 数据库\n\n## 目录列表\n\n- 第 11 章： 建立与探索\n- 第 12 章： 创建数据库表\n- 第 13\
  \ 章： 向表中插入数据\n- 第 14 章： 选择并显示数据\n\n[](itss://chm/8934final/LiB0055.html)\n\n![](img/index-148_1.png)\n\
  ![](img/index-148_2.png)\n![](img/index-148_3.png)\n![](img/index-148_4.png)\n![](img/index-148_5.png)\n\
  ![](img/index-148_6.png)\n[](itss://chm/8934final/LiB0056.html)\n\n## 第 11 章：建立与探索\n\
  \n### 概述\n\n在安装 MySQL 的过程中，你应该创建一个示例用户。在开始经常使用数据库之前，你需要了解一下权限系统。在本章中，你将学习：\n\n-\
  \ 连接到 MySQL\n- 列出数据库\n- 创建数据库\n- 删除（删除）数据库\n\n### 使用用户权限\n\n当你安装 MySQL 时，你是以 root\
  \ 用户身份工作的。**注意** 如果你通过互联网服务访问 MySQL，你可能只有一个可用用户。默认情况下，该用户拥有所有权限。\n\n### 创建新用户\n\n\
  如果你拥有添加用户的权限，执行此任务的最简单方法是使用 `GRANT` 命令。`GRANT` 命令的基本语法如下，其中 `[privilege list]` 是你想赋予新用户的权限占位符。\n\
  \n`GRANT [privilege list] ON databasename.tablename TO username@host IDENTIFIED\
  \ BY \"password\";`\n\n你可以授予多种权限，更多信息请访问 MySQL 手册 [`www.mysql.com/doc/G/R/GRANT.html`](http://www.mysql.com/doc/G/R/GRANT.html)。现在，我们将授予用户所有权限。\n\
  \n1. 从命令行启动 MySQL monitor，使用与你的文件系统相关的 `mysql` 可执行文件路径\n\n2. 在 mysql> 提示符下选择名为 `mysql`\
  \ 的数据库：\n\n```sql\nuse mysql;\n```\n\n3. 输入以下 SQL 语句，根据需要替换你自己的用户名和密码。通配符 `*` 授予所有数据库和表的权限：\n\
  \n```sql\nGRANT ALL ON *.* TO spike@localhost IDENTIFIED BY \"9sj7En4\";\n```\n\n\
  4. 在 mysql> 提示符下退出 MySQL monitor：\n\n```sql\nexit\n```\n\n5. 使用 `mysqladmin` 程序发布命令重新加载权限表：\n\
  \n```bash\nmysqladmin reload\n```\n\n新用户（`spike`）现在可以使用密码 `9sj7En4` 访问所有数据库和表。从现在起，所有的数据库连接脚本将使用该用户。请在适当的地方替换你自己的用户名和密码。\n\
  \n## 连接到 MySQL\n\n此脚本的目标仅仅连接到运行在你的机器（localhost）上的 MySQL。\n\n1. 在你的文本编辑器中打开一个新文件，并开始一个\
  \ PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来保存 `mysql_connect()` 函数的结果：\n\n\n\n\n\n\
  ```php\n$connection = mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n```\n\
  \n注意：`mysql_connect()` 函数需要主机名、用户名和密码（按此顺序）。\n\n3. 为 `mysql_connect()` 所在添加一个 `die()`\
  \ 函数，以便在连接失败时结束脚本并显示消息。在 `die()` 函数中，使用 `mysql_error()` 函数。发生错误时打印的消息是 MySQL 发送的原始错误信息。新行应该如下所示：\n\
  \n```php\n$connection = mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\nor\
  \ die(mysql_error());\n```\n\n4. 测试 `$connection` 的值。如果它为 `true`，则已成功连接到 MySQL，并创建了一个变量来存储消息：\n\
  \n```php\nif ($connection) {\n$msg = \"success!\";\n}\n```\n\n注意：如果无法连接，脚本将通过 `die()`\
  \ 函数结束。\n\n5. 结束你的 PHP 代码块，然后添加 HTML：\n\n```html\n?>\n\n<HTML>\n<HEAD>\n<TITLE>MySQL\
  \ Connection</TITLE>\n</HEAD>\n<BODY>\n```\n\n6. 打印消息字符串：\n\n```php\n<? echo \"\
  $msg\"; ?>\n```\n\n7. 添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n\
  8. 将文件保存为 `db_connect.php`，并将此文件放在你 Web 服务器的文档根目录下。\n\n9. 打开 浏览器并输入 `http://127.0.0.1/db_connect.php`。\n\
  \n![](img/index-151_1.jpg)\n\n如果你输入了正确的用户名和密码，你应该会得到成功的结果。\n\n## 破坏你的连接脚本\n\n任何当你与数据库打道时，都会遇到错误。这是不可避免的。这就是为什么我想向你展示一些常见错误以及如何妥善处理它们。\n\
  \n你将对 `db_connect.php` 脚本进行修改，只需通过更改用户名即可导致连接失败。\n\n1. 将用户名更改为 `buffy`（除非 `buffy`\
  \ 是真实用户！），使连接行如下所示：\n\n```php\n$connection = mysql_connect(\"localhost\", \"buffy\"\
  , \"9sj7En4\")\nor die(mysql_error());\n```\n\n2. 保存文件，然后打开 浏览器访问 `http://127.0.0.1/db_connect.php`。\n\
  \n![](img/index-152_1.jpg)\n![](img/index-152_2.jpg)\n\n这真是某种糟糕的响应！至少它准确地告诉了哪里错了，而且提示了好几次：用户\
  \ `buffy` 无法连接到 MySQL。你可以通过在 `mysql_connect()` 函数名之前放置一个 `@` 来抑制其中一个糟糕的警告，并只显示来自\
  \ `die()` 函数的消息。试一下。\n\n1. 在 `mysql_connect()` 函数之前添加一个 `@`，保留错误的用户名：\n\n```php\n\
  $connection =\n@mysql_connect(\"localhost\", \"buffy\", \"9sj7En4\")\nor die(mysql_error());\n\
  ```\n\n2. 保存文件，然后打开 浏览器访问 `http://127.0.0.1/db_connect.php`。\n\n![](img/index-153_1.png)\n\
  ![](img/index-153_2.png)\n![](img/index-153_3.png)\n\n通过此更改，警告被抑制了，只显示来自 `die()`\
  \ 函数的消息。这是来自 `mysql_error()` 函数的有意义错误输出。如果你能将糟糕的错误和警告减少到最低，当你的数据库在高峰访问期间决定变得不可用时，整体用户体验会愉快得多（参见\
  \ `8934final/LiB005.html`）。\n\n## 在服务器上列出数据库\n\n现在你已经成功使用 PHP 连接到 MySQL，是时候熟悉一些与\
  \ MySQL 相关的内置函数了。在本节中，你将使用以下函数：\n\n- `mysql_list_dbs()`——用于列出 MySQL 服务器上的数据库。\n\
  - `mysql_num_rows()`——返回结果中的行数。\n- `mysql_tablename()`——尽管名称如此，但它可以从结果中提取表或数据库的名称。\n\
  \n此脚本的目标是列出本地 MySQL 服务器上的所有数据库。\n\n1. 在你的文本编辑器中打开新文件并开始一个 PHP 代码块：\n\n```php\n<?\n\
  ```\n\n2. 创建一个变量来存储 `mysql_connect()` 函数的结果。包含 `@` 以抑制警告，以及 `die()` 函数以便在连接失败时结束脚本并显示消息：\n\
  \n```php\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n\
  or die(mysql_error());\n```\n\n3. 创建一个变量来存储 `mysql_list_dbs()` 函数的结果。包含 `@` 以抑制警告，以及\
  \ `die()` 函数以便在脚本无法获取列表时结束并显示消息：\n\n```php\n$dbs = @mysql_list_dbs($connection)\
  \ or die(mysql_error());\n```\n\n注意：`mysql_list_dbs()` 函数的唯一参数是当前连接的标识符。\n\n4. 你将遍历结果并动态填充列表。在循环外部开始该列表：\n\
  \n```php\n$db_list = \"<ul>\";\n```\n\n5. 开始计数器。你需要它来循环：\n\n```php\n$i = 0;\n```\n\
  \n6. 开始一个 `while` 循环。只要 `$i` 的值小于 `$dbs` 的行数，循环就会继续：\n\n```php\nwhile ($i < mysql_num_rows($dbs)){\n\
  ```\n\n7. 一旦你进入 `while` 循环内部，从结果中获取数据库名称：\n\n注意：变量 `$i` 被替换为它的值，因此在第一次循环中是这样的：\n\
  \n```php\n$db_names[$i] = mysql_tablename($dbs, $i);\n```\n\n8. 将当前数据库名称添加到列表中：\n\
  \n```php\n$db_list .= \"<li>$db_names[$i]</li>\";\n```\n\n9. 在关闭 `while` 循环之前增加你的计数：\n\
  \n```php\n$i++;\n```\n\n10. 关闭 `while` 循环、结束列表以及你的 PHP 代码块：\n\n```php\n}\n$db_list\
  \ .= \"</ul>\";\n?>\n```\n\n11. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>MySQL\
  \ Connection</TITLE>\n</HEAD>\n<BODY>\n<P><strong>Databases on localhost</strong></P>\n\
  ```\n\n12. 打印消息字符串：\n\n```php\n<? echo \"$db_list\"; ?>\n```\n\n13. 添加一些额外的 HTML\
  \ 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n14. 将文件保存为 `db_listdb.php`。\n\n合并来看，你的代码应该像这样：\n\
  \n```php\n<?\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\"\
  )\nor die(mysql_error());\n$dbs = @mysql_list_dbs($connection) or die(mysql_error());\n\
  $db_list =\"<ul>\";\n$i = 0;\nwhile ($i < mysql_num_rows($dbs)){\n$db_names[$i]\
  \ = mysql_tablename($dbs, $i);\n$db_list .= \"<li>$db_names[$i]</li>\";\n$i++;\n\
  }\n$db_list .=\"</ul>\";\n?>\n<HTML>\n<HEAD>\n<TITLE>MySQL Databases</TITLE>\n</HEAD>\n\
  <BODY>\n<P><strong>Databases on localhost</strong></P>\n<? echo \"$db_list\"; ?>\n\
  </BODY>\n</HTML>\n```\n\n将此文件放在你 Web 服务器的文档根目录下，然后打开你的 浏览器并输入 `http://127.0.0.1/db_listdb.php`。\n\
  \n你的列表可能会有所不同，取决于你在第一章中玩了多少，但你至少应该看到 MySQL 系统数据库（`mysql`）以及第一章创建的数据库（参见 `8934final/LiB001.html#40`testDB）。接下来，你向此脚本添加另一个循环来打印每个数据库中的表。\n\
  \n![](img/index-156_1.jpg)\n![](img/index-156_2.png)\n![](img/index-156_3.png)\n\
  ![](img/index-156_4.png)\n\n\n\n\n\n# 创建数据库\n\n1.  创建一个变量来存储 `mysql_list_dbs()`\
  \ 函数的返回值。包含 `@` 符号以抑制警告，并使用 `die()` 函数以便在脚本无法获取列表时结束脚本并显示消息：\n\n```php\n$dbs = @mysql_list_dbs($connection)\
  \ or die(mysql_error());\n```\n\n2.  你将遍历结果并动态填充一个项目符号列表。在循环外部开始该符号列表：\n\n```php\n\
  $db_list = \"<ul>\";\n```\n\n3.  启动一个计数器。你将在循环中需要它：\n\n```php\n$db_num = 0;\n```\n\
  \n**注意** 使用 `$db_num` 而不是 `$i` 作为计数器，因为在此脚本的某一个点上，你将有两个计数器同时运行。\n\n4.  开始一个 `while`\
  \ 循环。只要 `$db_num` 的值小于 `$dbs` 结果值的行数，该循环就会继续执行：\n\n```php\nwhile ($db_num < mysql_num_rows($dbs))\
  \ {\n```\n\n5.  一旦进入 `while` 循环，获取结果中当前行反映的数据库名称：\n\n```php\n$db_names[$db_num]\
  \ = mysql_tablename($dbs, $db_num);\n```\n\n6.  将当前数据库名称添加到项目符号列表中：\n\n```php\n\
  $db_list .= \"<li>$db_names[$db_num]\";\n```\n\n7.  创建一个变量来存储 `mysql_list_tables()`\
  \ 函数的返回值。包含 `@` 符号以抑制警告，并使用 `die()` 函数以便在脚本无法获取列表时结束脚本并显示消息：\n\n```php\n$tables\
  \ = @mysql_list_tables($db_names[$db_num]) or die(mysql_error());\n```\n\n**注意**\
  \ `mysql_list_tables()` 函数唯一必要的参数是当前数据库的名称。\n\n8.  你将遍历结果并动态填充一个项目符号列表。在循环外部开始该符号列表：\n\
  \n```php\n$table_list = \"<ul>\";\n```\n\n9.  启动一个计数器。你将在第二个循环中需要它：\n\n```php\n\
  $table_num = 0;\n```\n\n10. 开始一个 `while` 循环。只要 `$table_num` 的值小于 `$tables` 结果值的行数，该循环就会继续执行。\n\
  \n```php\nwhile ($table_num < mysql_num_rows($tables)) {\n```\n\n11. 一旦进入 `while`\
  \ 循环，获取结果中当前行反映的表名称：\n\n```php\n$table_names[$table_num] = mysql_tablename($tables,\
  \ $table_num);\n```\n\n12. 将当前表名称添加到项目符号列表中：\n\n```php\n$table_list .= \"<li>$table_names[$table_num]\"\
  ;\n```\n\n13. 在关闭 `while` 循环之前增加计数：\n\n```php\n$table_num++;\n```\n\n14. 关闭内部 `while`\
  \ 循环和表的符号列表：\n\n```php\n}\n$table_list .= \"</ul>\";\n```\n\n15. 将 `$table_list`\
  \ 的值添加到 `$db_list` 中，然后在关闭外部 `while` 循环之前增加你的计数：\n\n```php\n$db_list .= \"$table_list\"\
  ;\n$db_num++;\n}\n```\n\n16. 关闭数据库的符号列表，然后关闭你的 PHP 块：\n\n```php\n$db_list .= \"\
  </ul>\";\n?>\n```\n\n17. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>MySQL Tables</TITLE>\n\
  </HEAD>\n<BODY>\n<P><strong>localhost 上的数据库和表</strong>:</P>\n```\n\n18. 打印消息字符串：\n\
  \n```php\n<?php echo \"$db_list\"; ?>\n```\n\n19. 添加更多 HTML 以使文档有效：\n\n```html\n\
  </BODY>\n</HTML>\n```\n\n20. 以 `db_listtables.php` 命名保存文件。\n\n你的代码看起来应该像这样：\n\n\
  ```php\n<?\n//连接代码\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\"\
  )\nor die(mysql_error());\n\n//获取数据库列表\n$dbs = @mysql_list_dbs($connection) or die(mysql_error());\n\
