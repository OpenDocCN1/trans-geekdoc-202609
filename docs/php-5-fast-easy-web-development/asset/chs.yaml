  echo \"<P>Original value of $a is $a and \\$b is $b</P>\";\n```\n\n**Note** 如果转义美元符号\
  \ `\\$$，它会被解释为变量。\n\n3. 添加两个值并打印结果：\n\n```php\n$c = $a + $b;\necho \"<P>Added \\\
  $a and \\$b and got $c</P>\";\n```\n\n4. 减去两个值并打印结果：\n\n```php\n$c = $a - $b;\n\
  echo \"<P>Subtracted \\$b from \\$a and got $c</P>\";\n```\n\n5. 拼接一个字符串并打印结果：\n\
  \n```php\n$c .= \"string\";\necho \"<P>Final answer: $c</P>\";\n```\n\n6. 关闭你的 PHP\
  \ 块并添加一些 HTML，以便结果打印到屏幕上。\n\n```php\n?>\n</body>\n</HTML>\n```\n\n### 算术运算符（Arithmetic\
  \ Operators）\n\n算术运算符只需执行数学任务。查看 `Table 5.2`：\n\n| 运算符 | 示例 | 操作 |\n| :--- | :---\
