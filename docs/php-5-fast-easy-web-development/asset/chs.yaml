  \ `http://127.0.0.1/comparisonscript.php`。\n\n\n\n\n\n## 一个方法\n\n一个动作\n\n一个提交按钮\n\
  \n在你的 HTML 代码中，表单的第一行看起来类似于这样：\n\n```html\n<FORM METHOD=\"post\" ACTION=\"yourscript.php\"\
  >\n```\n\n当你点击 HTML 表单中的提交按钮时，变量将通过指定的 `METHOD` 发送到由 `ACTION` 指定的脚本。该方法可以是 `POST`\
  \ 也可以是 `GET`。从表单传递到 PHP 脚本的变量被放在名为 `$_POST` 或 `$_GET` 的全局变量中，取决于表单的方法。在下一节，中，你将看到它是如何工作的，通过创建一个\
  \ HTML 表单和一个伴随的 PHP 脚本，该脚本将根据表单输入执行计算。\n\n## 创建计算表单\n\n在本节中，你将为计算脚本创建前端。此表单将包含两个输入字段和一个用于选择计算类型的单选按钮。\n\
  \n1. 在你的文本编辑器器中打开一个新文件。\n2. 输入以下 HTML：\n```html\n<HTML>\n<HEAD>\n<TITLE>Calculation\
  \ Form</TITLE>\n</HEAD>\n<BODY>\n```\n3. 开始你的表单。假设方法为 POST，动作是一个名为 `calculate.php`\
  \ 的脚本：\n```html\n<FORM METHOD=\"post\" ACTION=\"calculate.php\">\n```\n4. 为第一个值创建一个输入字段，并带有一个文本标签：\n\
  ```html\n<P>Value 1: <INPUT TYPE=\"text\" NAME=\"val1\" SIZE=10></P>\n```\n5. 为第二个值创建一个输入字段，并带有一个文本标签：\n\
  ```html\n<P>Value 2: <INPUT TYPE=\"text\" NAME=\"val2\" SIZE=10></P>\n```\n6. 添加一个提交按钮：\n\
  ```html\n<P><INPUT TYPE=\"submit\" NAME=\"submit\" VALUE=\"Calculate\"></P>\n```\n\
  7. 关闭表单并添加更多 HTML 以使文档有效：\n```html\n</FORM>\n</BODY>\n</HTML>\n```\n8. 将文件保存为 `calculate_form.html`，并将此文件放置在你的\
  \ Web 服务器的文档根目录下。\n9. 打开你的网络浏览器并输入 [`127.0.0.1/calculate_form.html`](http://127.0.0.1/calculate_form.html)。\n\
  \n![](img/index-77_1.jpg)\n\n你将看到一个包含 Value 1 和 Value 2 字段以及一个 Calculate 按钮的表单。花一点时间检查\
  \ HTML 表单，理解变量是如何获取名称的。\n\n提交时，此表单将向你的脚本发送两个变量 `$_POST[val1]` 和 `$_POST[val2]`，因为这些是每个文本字段中使用的\
  \ `NAME`。这些变量的值是用户在表单字段中输入的值。还有一个项目需要添加：一组单选按钮，用于确定在两个值上执行的计算类型。\n\n1. 在你的文本编辑器中打开\
  \ `calculate_form.html`。\n2. 在提交按钮之前添加此代码块：\n```html\n<P>Calculation:<br>\n<INPUT\
  \ TYPE=\"radio\" NAME=\"calc\" VALUE=\"add\"> add<br>\n<INPUT TYPE=\"radio\" NAME=\"\
  calc\" VALUE=\"subtract\"> subtract<br>\n<INPUT TYPE=\"radio\" NAME=\"calc\" VALUE=\"\
  multiply\"> multiply<br>\n<INPUT TYPE=\"radio\" NAME=\"calc\" VALUE=\"divide\">\
  \ divide</P>\n```\n3. 保存文件并将其放置在你的 Web 服务器的文档根目录下。\n4. 打开你的网络浏览器并输入 [`127.0.0.1/calculate_form.html`](http://127.0.0.1/calculate_form.html)。\n\
  \n![](img/index-78_1.jpg)\n\n你的表单现在将包含 Value 1 和 Value 2 字段、一组单选按钮和一个 Calculate\
  \ 按钮。现在，除了两个值（`$_POST[val1]` 和 `$_POST[val2]`）之外，一个名为 `$_POST[calc]` 的变量也将被发送到你的脚本。进入下一节并创建计算脚本。\n\
  \n## 创建计算脚本\n\n根据 `calculate_form.html` 中的表单动作，你需要一个名为 `calculate.php` 的脚本。该脚本的目标是接受两个值（`$_POST[val1]`\
  \ 和 `$_POST[val2]`）并根据 `$_POST[calc]` 的值执行计算。\n\n1. 在你的文本编辑器中打开一个新文件。\n2. 开始一个 PHP\
  \ 块并准备一个 if 语句来检查三个值的存在：\n```php\n<?php\nif ($_POST[val1] == \"\") || ($_POST[val2]\
  \ == \"\") || ($_POST[calc] == \"\") {\n    // 此处有更多代码\n}\n```\n该语句的意思是：“如果这三个变量中的任何一个没有值，执行其他操作。”\n\
  3. 将“此处有更多代码”替换为以下两行：\n```php\nheader(\"Location: calculate_form.html\");\nexit;\n\
  ```\n![](img/index-79_1.jpg)\n\n这两行中的第一行输出一个头部语句——在这种情况下，它是重定向回表单。第二行是退出脚本。\n4.\
  \ 确保在其他值之前，开始一个 if 语句，根据 `$_POST[calc]` 的值进行计算：\n```php\nif ($_POST[calc] == \"\
  add\") {\n    $result = $_POST[val1] + $_POST[val2];\n} elseif ($_POST[calc] ==\
  \ \"subtract\") {\n    $result = $_POST[val1] - $_POST[val2];\n} elseif ($_POST[calc]\
  \ == \"multiply\") {\n    $result = $_POST[val1] * $_POST[val2];\n} elseif ($_POST[calc]\
  \ == \"divide\") {\n    $result = $_POST[val1] / $_POST[val2];\n}\n```\n5. 开始输出\
  \ HTML：\n```html\n<HTML>\n<HEAD>\n<TITLE>Calculation Result</TITLE>\n</HEAD>\n<BODY>\n\
  ```\n6. 使用 PHP 代码显示值：\n```php\necho \"$result\";\n```\n```html\n<P>计算结果为：</P>\n\
  ```\n7. 关闭 HTML：\n```html\n</BODY>\n</HTML>\n```\n8. 将文件保存为 `calculate.php`，并将此文件放置在你的\
