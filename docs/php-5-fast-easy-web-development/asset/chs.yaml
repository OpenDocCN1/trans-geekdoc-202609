  ![](img/index-33_2.jpg)\n\n## 在 Windows 上配置 Apache\n\n要运行 Apache 的基础安装，你唯一需要做的更改是服务器名称，你可能在安装向导期间已经完成了操作。但是，如果你为服务器名称输入了虚拟信息，或者想修改基本配置的任何其他部分，现在就是采取行动的时候了。\n\
  \nApache 的主配置文件名为 `httpd.conf`，位于 Apache 安装目录下的 `conf` 目录中。因此，如果你的安装目录是 `C:\\Program\
