  ### 什么是运算符（Operator）？\n\n在上一节中，你使用了赋值运算符 `=` 为变量赋值。\n\n还有其他类型的赋值运算符，以及其他类型的运算符。运算符的基本功能是对变量的值进行某种操作。这种“操作”可以是赋值、改变一个值，也可以是比较两个或多个值。\n\
  \n以下是 PHP 运算符的主要类型：\n\n- **赋值运算符（Assignment operators）。** 给变量赋值。也可以增加或减少变量当前的值。\n\
  - **算术运算符（Arithmetic operators）。** 使用这些运算符时会发生加法、减法、除法和乘。\n- **比较运算符（Comparison\
  \ operators）。** 比较两个值并返回真或假。\n- **逻辑运算符（Logical operators）。** 确定状态。\n\n### 赋值运算符（Assignment\
  \ Operators）\n\n你已经见过赋值运算符：`=`并不意味着“等于”！相反，`==`（两个等号）意味着“等于”，而 `===`（三个等号）意味着“完全相同”。本章其余部分将专门讨论\
  \ PHP 中使用的一些主要运算符。\n\n查看 `Table 5.1` 中的赋值运算符：\n\n| 运算符 | 示例 | 操作 |\n| :--- | :---\
  \ | :--- |\n| `=` | `$a = b` | 赋值 |\n| `+=` | `$a += 3` | 通过增加当前值来改变变量的值 |\n| `-=`\
  \ | `$a -= 3` | 通过从当前值中减去来改变变量的值 |\n| `.` | `$a .= \"string\"` | 将字符串接到当前值 |\n\n\
  **Table 5.1 赋值运算符**\n\n| 运算符 | 示例 | 操作 |\n| :--- | :--- | :--- |\n| `=` | `$a =\
  \ b` | 赋值 |\n| `+=` | `$a += 3` | 增加当前值 |\n| `-=` | `$a -= 3` | 减去当前值 |\n| `.` |\
  \ `$a .= \"string\"` | 拼接字符串 |\n\n创建一个显示赋值运算符工作的脚本。\n\n```html\n<HTML>\n<head>\n\
  <title>Assignment Operators</title>\n</head>\n<body>\n```\n\n1. 在你的文本编辑器中打开一个文件并输入以下\
