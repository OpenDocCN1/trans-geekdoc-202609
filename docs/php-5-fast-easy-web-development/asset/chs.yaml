  \ 可以根据你的需要变得强大，也可以非常精简，但一个通用的原则是只添加你真正需要的功能。例如，如果你没有连接 Oracle 数据库的计划，就不需要启用对 Oracle\
  \ 函数的支持。但 PHP 是非常可扩展的，这意味着你可以随时添加功能——例如，如果你的公司决定购买 Oracle 许可证！\n\n#### Windows 扩展\n\
