  \ | 小于等于 |\n\n这些比较中任何一个的结果都是 `true` 或 `false`。这并不有趣，但你可以使用 `if...else` 和 `while`\
  \ 等控制语句对结果进行操作，以执行特定任务。\n\n创建一个简单的脚本来显示某些比较的结果，使用 `if...else` 控制语句将结果打印到屏幕上。\n\n\
  1. 在你的编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Using Comparison\
  \ Operators</TITLE>\n</HEAD>\n<BODY>\n```\n\n2. 开始一个 PHP 块，创建两个带有值的变量并打印这些值：\n\n\
