  \n要停止 Apache，可以输入 `./bin/apachectl stop` 并按回车。现在请保持它运行，因为下一步是通过 浏览器连接到服务器，现在不是关闭它的时机。\n\
  \n在 Apache 运行时，您可以使用任选的浏览器连接到服务器。URL 将是您作为 `ServerName` 使用的任何内容——实际名称或 IP，或者是 `localhost`\
  \ 名称或 IP。\n\n### 注意\n\n记住，只有您可以使用 `127.0.0.1` 或名称 `localhost` 连接到您的 Web 服务器。本书假设您将使用\
