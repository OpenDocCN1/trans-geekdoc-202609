  \n## 数组\n\n简单来说，数组是包含字符串的集合。在以下示例中，`faveave_``一个数组：index-354_1.png)\n![](img/index-354_2.png)\n\
  ![](img/index-354_3.png)\n\n```php\n$fave_colors[0] = \"red\";\n$fave_colors[1]\
  \ = \"blue\";\n$fave_colors[2] = \"black\";\n$fave_colors[3] = \"white\";\n```\n\
  \n数组元素从 0 计数。\n\n## 运算符\n\n运算符是表示特定操作的符号。例如，`+`算术运算符加上两个值，而=`赋值运算符将值赋给变量。\n\n###\
  \ 算术运算符\n\n算术运算符与简单数学非常相似，如表 B.2.\n\n### 表 B.2：算术运算符\n\n| 运算符 | 示例 | 动作 |\n| :---\
  \ | :--- | :--- |\n| `+` | `$b = $a + 3;` | 相加值 |\n| `-` | `$b = $a - 3;` | 减去值\
  \ |\n| `*` | `$b = $a * 3;` | 乘法 |\n| `/` | `$b = $a / 3;` | 除法 |\n| `%` | `$b =\
  \ $a % 3;` | 返回模或余数 |\n\n### 赋值运算符\n\n=`是基础赋值运算符：\n\n```php\n$a = 124; // $a 的值为\
  \ 124\n```\n\n其他赋值运算符显示在表 B.3.\n\n### 表 B.3：赋值运算符\n\n| 运算符 | 示例 | 动作 |\n| :--- |\
  \ :--- | :--- |\n| `+=` | `$a += 3;` | 将变量的值更改为当前值加上右侧的值 |\n| `-=` | `$a -= 3;`\
  \ | 将变量的值更改为当前值减去右侧的值 |\n| `.=` | `$a .= \"string\";` | 将右侧的值\"string\"拼接（附加）到当前值上\
  \ |\n\n**比较运算符**\n\n\n\n\n\n比较运算符用于比较两个值。比较的结果会返回真（true）或假（false）值。比较运算符见表 B.4.\n\
  \n### 表 B.4: 比较运算符\n\n| 运算符 | 定义 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于\
  \ |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n### 增增/递减运算符\n\
  \n![](img/index-356_1.png)\n![](img/index-356_2.png)\n![](img/index-356_3.png)\n\
  \n增增/递减运算符正如其名：对变量进行加或减（参见表 B.5.）。\n\n### 表 B.5: 增增/递减运算符\n\n| 运算符 | 用法 | 定义 |\n\
  | :--- | :--- | :--- |\n| `++$a` | 前增 | 加 1 并返回 `$a` |\n| `$a++` | 后增 | 返回 `$a`\
  \ 然后对 `$a` 加 1 |\n| `--$a` | 前递减 | 减 1 并返回 `$a` |\n| `$a--` | 后递减 | 返回 `$a` 然后对\
  \ `$a` 减 1 |\n\n### 逻辑运算符\n\n逻辑运算符允许你的脚本判断条件的状态，并在 `if...else` 或 `while` 语句的上下文中，根据条件的真假执行执行特定的代码（参见表\
  \ B.6.）。\n\n### 表 B.6: 逻辑运算符\n\n| 运算符 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `!`\
  \ | `!$a` | 如果 `$a` 不为真，则为真 |\n| `&&` | `$a && $b` | 如果 `$a` 和 `$b` 都为真，则为真 |\n\
  | `||` | `$a || $b` | 如果 `$a` 或 `$b` 其中之一为，则为真 |\n\n[](itss://chm/8934final/LiB0129.html)\n\
