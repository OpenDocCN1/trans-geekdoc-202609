  \n## 第 12 章：创建数据库表\n\n### 概述\n\n你拥有这个非常棒的数据库服务器，名为 `testDB` 的数据库中只有一个名为 `test_table`\
  \ 的表。这样有什么趣呢？在本章中，你将学习如何：\n\n* 规划数据库表\n* 识别某些数据类型的陷阱\n* 识别唯一字段的重要性\n* 遵循创建表的两步流程\n\
  * 创建一个存储个人音乐目录的表\n\n![](img/index-165_1.png)\n![](img/index-165_2.png)\n![](img/index-165_3.png)\n\
  \n### 规划你的表\n\n创建表很容易——规划才需要费脑力。创建一个简单的表，你只需要给它起个名字。但那样表就很无趣，因为它不包含任何列（字段），也无法存储任何数据。因此，除了名称之外，你还应该知道你想在表中拥字段数量以及字段类型。\n\
  \n#### MySQL 基础数据类型\n\n表中的所有字段都被赋予了特定的数据类型定义。`data type` 定义了字段中允许的数据类型。对于某些数据类型定义，你还必须定义在该字段中允许的最大长度，但其他类型被假设具有其特定类型的特定长度。\n\
  \n恰当的定义字段是非常重要的。例如，如果你有一个用于存储录音名称的字段，它是 50 个字符的 `varchar` 字段，但你尝试向该字段中填入一个 100 字符的字符串，那么你的字符串将在\
  \ 50 个字符处截断。\n\n正确定义字段以使数据能够放入字段中不仅很重要，而且如果你使用错误的 `SQL syntax` 定义字段，表将根本无法创建。例如，如果你想对某个字段使用\
  \ `text` 数据类型，则不能指定长度：它被自动假设具有特定的长度。\n\n表 12.1 显示了你将用到的一些常用类型。如需完整列表，请阅读 MySQL 手册。\n\
  \n#### 表 12.1：一些 MySQL 数据类型\n\n| 数据类型 | 定义 |\n| :--- | :--- |\n| `TINYINT` | 一个非常小的整数，可以是带符号或无符号的。如果有符号，允许范围是\
  \ -128 到 127。如果没有符号，允许范围是 0 到 255。 |\n| `SMALLINT` | 一个小整数，可以是带符号或无符号的。如果有符号，允许范围是\
  \ -32768 到 32767。如果没有符号，允许范围是 0 到 65535。 |\n| `MEDIUMINT` | 一个中等整数，可以是带符号或无符号的。如果有符号，允许范围是\
  \ -8388608 到 8388607。如果没有符号，允许范围是 0 到 16777215。 |\n| `INT` | 一个普通大小的整数，可以是带符号或无符号的。如果有符号，允许范围是\
  \ -2147483648 到 2147483647。如果没有符号，允许范围是 0 到 4294967295。 |\n| `BIGINT` | 一个大整数，可以是带符号或无符号的。如果有符号，允许范围是\
  \ -9223372036854775808 到 9223372036854775807。如果没有符号，允许范围是 0 到 18446744073709551615。\
  \ |\n| `FLOAT` | 可以包含小数的浮点数。 |\n| `DECIMAL` | 用于精确值的固定点数。 |\n| `DATE` | YYYY-MM-DD\
  \ 格式的日期。 |\n| `DATETIME` | YYYY-MM-DD HH:MM:SS 格式的日期和时间。 |\n| `TIMESTAMP` | 记录日期和时间戳。\
  \ |\n| `CHAR` | 固定长度字符串。 |\n| `VARCHAR` | 变长度字符串。 |\n| `BLOB` | 用于存储二进制数据的二进制大对象。\
  \ |\n| `ENUM` | 必须从列表中选择的值。 |\n\n### 定义字段\n\n本章的总体目标创建一个表。花点思考你想知道的信息：标题和艺术家，可能还有唱片、获取日期以及你自己的笔记。我考虑了我自己的表想要的内容，我决定将其命名为\
  \ `my_music`，如表 12.2 所示。\n\n#### 表 12.2：my_music 的字段\n\n| 字段名称 | 描述 |\n| :--- |\
  \ :--- |\n| `id` | 为条目创建一个唯一 ID 号 |\n| `format` | 是 CD、磁带还是 LP 片？ |\n| `title` |\
  \ 录音的标题 |\n| `artist_fn` | 艺术家的名 |\n| `artist_ln` | 艺术家的姓或团体名称 |\n| `rec_label`\
  \ | 唱片公司 |\n| `my_notes` | 我对录音的想法 |\n| `date_acq` | 获取日期 |\n\n#### 唯一字段的重要性\n\n\
  使用唯一 ID 数字不仅有助于你跟踪数据，而且在将来，还能帮助你尝试\n\n\n\n\n建立多个表之间的关系。在 `my_music` 表中，将有一个 `ID`\
  \ 字段。使用此字段作为唯一字段，而不是 `title` 字段，将允许你的表中存在两个同名的录音。例如，如果你拥有 Indigo Girls 乐队的专辑 `Strange\
  \ Fire`，你可以在表中有两个条目：一个是 1987 年发布的版本，另一个是 1989 年重新发布的版本（听我的就吧）。\n\n如果不使用唯一标识符，你将只能在表中选择放入一个版本，这会让你的表将不非常准确。我希望这个简单的例子能传达出在表中每条记录中拥有一个唯一标识符的重要性。随着你创建更多数据库驱动的元素，唯一标识符的使用将在本书剩余部分变得更加明显。\n\
  \n[](itss://chm/8934final/LiB0064.html)\n\n![](img/index-167_1.png)\n\n![](img/index-167_2.png)\n\
  \n![](img/index-167_3.png)\n\n[](itss://chm/8934final/LiB0065.html)\n\n## 两步表单序列\n\
  \n创建数据库表的两步表单序列似乎有些多此。毕竟，你在第 1 章 创建 `test_table` 时，已经看到了基础的建表 SQL 语句：\n\n```\ncreate\
  \ table test_table (test_id int, test_note text);\n```\n\n使用 PHP 脚本创建表时，你做的只是向 MySQL\
  \ 发送完全相同的查询。然而，你可以给这个过程系上一条漂亮的丝带（创建一个基于表单的界面），并将其称为管理界面！\n\n在创建管理界的过程中，你将从一个 HTML\
  \ 表单开始，然后创建一个 PHP 脚本，从该表单获取信息并动态创建另一个表单。最后，你将创建一个发送实际 SQL 查询的脚本。\n\n###  1 ：字段数量\n\
  \n此 HTML 表单将包含两个输入字段：一个用于表名，另一个用于你希望表包含的字段数量。\n\n1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\
  \n```html\n<HTML>\n<HEAD>\n<TITLE>创建数据库表：第 1 步</TITLE>\n</HEAD>\n<BODY>\n<H1>第 1\
  \ 步：名称与数量</H1>\n```\n\n2. 开始你的表单。假设方法为 `POST`，动作动名为 `do_showfielddef.php` 的脚本：\n\
  \n```html\n<FORM METHOD=\"POST\" ACTION=\"do_showfielddef.php\">\n```\n\n3. 为表名创建一个带有文本标签的输入字段：\n\
  \n```html\n<P><strong>表名：</strong><br>\n<INPUT TYPE=\"text\" NAME=\"table_name\"\
  \ SIZE=30></P>\n```\n\n4. 为表中的字段数量创建一个带有文本标签的输入字段：\n\n```html\n<P><strong>字段数量：</strong><br>\n\
  <INPUT TYPE=\"text\" NAME=\"num_fields\" SIZE=5></P>\n```\n\n5. 添加一个提交按钮，然后关闭表单并添加更多\
  \ HTML 使文档有效：\n\n```html\n<P><INPUT TYPE=\"submit\" NAME=\"submit\" VALUE=\"进入第\
  \ 2 步\"></P>\n</FORM>\n</BODY>\n</HTML>\n```\n\n6. 将文件保存为 `show_createtable.html`，并将此文件放在\
  \ Web 服务器的文档根目录下。\n\n7. 打开你的浏览器并输入 [`127.0.0.1/show_createtable.html`](http://127.0.0.1/show_createtable.html)。\n\
  \n在下一节中，你将遵循过程的第 2 步，创建一个根据 `$_POST[table_name]` 和 `$_POST[num_fields]` 的值动态创建另一个表单的脚本。\n\
  \n![](img/index-168_1.jpg)\n\n### 2 步：定义你的字段\n\n在第一步中，你创建了变量来存储表名（`$_POST[table_name]`）和你想放在表中的字段数量（`$_POST[num_fields]`）。在这一步中，你创建一个\
  \ PHP 脚本来显示进一步定义字段所需的额外表单元素：名称、类型和长度。\n\n1. 在你的文本编辑器中打开一个新文件并启动 PHP 块：\n\n```php\n\
  <?\n```\n\n2. 检查 `$_POST[table_name]` 和 `$_POST[num_fields]` 是否确实输入了值。如果没有，将用户引导回表单并退出脚本：\n\
  \n```php\nif ((!$_POST[table_name]) || (!$_POST[num_fields])) {\n    header(\"Location:\
  \ show_createtable.html\");\n    exit;\n}\n```\n\n3. 开始构建名为 `$form_block` 的字符串，从表单动作和方法开始。假设方法为\
  \ `POST`，动名为 `do_createtable.php` 的脚本。记得转义你的引号！\n\n```php\n$form_block = \"\n<FORM\
  \ METHOD=\\\"POST\\\" ACTION=\\\"do_createtable.php\\\">\n```\n\n**注意** 因为脚本正在创建一个表单，`$form_block`\
  \ 将持有 HTML 结构。\n\n4. 添加一个隐藏输入字段来存储 `$_POST[table_name]` 的值：\n\n```php\n$form_block\
  \ .= \"<INPUT TYPE=\\\"hidden\\\" NAME=\\\"table_name\\\" VALUE=\\\".$_POST[table_name].\"\
  \\\">\n```\n\n5. 从表头行开始开始表格：\n\n```php\n$form_block .= \"\n<TABLE CELLSPACING=5\
  \ CELLPADDING=5>\n<TR>\n<TH>字段</TH><TH>类型</TH><TH>长度</TH>\n</TR>\";\n```\n\n6. 开始遍历\
  \ `$_POST[num_fields]` 值的循环：\n\n```php\nfor ($i = 0; $i < $_POST[num_fields]; $i++)\
  \ {\n```\n\n7. 在循环内为你定义的每个字段添加一个 `TR`：\n\n```php\n$form_block .= \"\n<TR>\n<td><INPUT\
  \ TYPE=\\\"text\\\" NAME=\\\"field_name[$i]\\\" SIZE=\\\"30\\\"></td>\n```\n\n8.\
  \ 在下一个单元格中，创建一个包含常用字段类型的下拉列表：\n\n```php\n<td>\n<SELECT NAME=\\\"field_type[$i]\\\
  \">\n<option value=\\\"char\\\">char</option>\n<option value=\\\"date\\\">date</option>\n\
  <option value=\\\"float\\\">float</option>\n<option value=\\\"int\\\">int</option>\n\
  <option value=\\\"text\\\">text</option>\n<option value=\\\"varchar\\\">varchar</option>\n\
  </SELECT>\n</td>\n```\n\n9. 在最后一个单元格中，为字段长度创建一个文本字段，并关闭你的表格行：\n\n```php\n<td><INPUT\
  \ TYPE=\\\"text\\\" NAME=\\\"field_length[$i]\\\" SIZE=\\\"5\\\"></td>\n</TR>\"\
  ;\n```\n\n10. 结束循环：\n\n```php\n}\n```\n\n11. 将最后一段 HTML 块添加到 `$form_block` 字符串中：\n\
  \n```php\n$form_block .= \"\n<TR>\n<TD COLSPAN=3\"><INPUT TYPE=\\\"submit\\\" VALUE=\\\
  \"创建表\\\"></td>\n</TR>\n</TABLE>\n</FORM>\";\n```\n\n12. 结束 PHP 块并输入以下 HTML：\n\n\
  ```html\n?>\n<HTML>\n<HEAD>\n<TITLE>创建数据库表：第 2 步</TITLE>\n</HEAD>\n<BODY>\n```\n\
  \n13. 添加一个漂亮的标题，让用户知道他们正在查看什么。混合 HTML 和 PHP 以包含 `$_POST[table_name]` 变量的值：\n\n```html\n\
  <h1>为 <? echo \"$_POST[table_name]\"; 定义字段</h1>\n```\n\n14. 显示 `$form_block` 的内容：\n\
  \n\n\n\n\n```php\n<? echo \"$form_block\"; ?>\n```\n\n15. 添加一些额外的 HTML 代码以使文档格式规范：\n\
  \n</BODY>\n\n</HTML>\n\n16. 将文件保存为 `do_showfielddef.php`，并将此文件放在你 Web 服务器的文档根目录下。\n\
  \n你的代码看起来应该是这样的：\n\n```php\n<?php\n//验证重要输入\nif ((!$_POST['table_name']) || (!$_POST['num_fields']))\
  \ {\n    header(\"Location: show_createtable.html\");\n    exit;\n}\n\n//开始创建用于显示的表单\n\
  $form_block = \"\n<FORM METHOD=\\\"POST\\\" ACTION=\\\"do_createtable.php\\\">\n\
  <INPUT TYPE=\\\"hidden\\\" NAME=\\\"table_name\\\" VALUE=$_POST['table_name']\\\"\
  >\n<TABLE CELLSPACING=5 CELLPADDING=5>\n<TR>\n<TH>FIELD NAME</TH><TH>FIELD TYPE</TH><TH>FIELD\
  \ LENGTH</TH></TR>\";\n//从 0 开始计数直到达到字段数量\nfor ($i = 0; $i <$_POST['num_fields'];\
  \ $i++) {\n    //向表单添加，每个字段占一行\n    $form_block .= \"\n<TR>\n<TD ALIGN=CENTER>\n\
  <INPUT TYPE=\\\"text\\\" NAME=\\\"field_name[]\\\" SIZE=\\\"30\\\"></TD>\n<TD ALIGN=CENTER>\n\
  <SELECT NAME=\\\"field_type[]\\\">\n<OPTION VALUE=\\\"char\\\">char</option>\n<OPTION\
  \ VALUE=\\\"date\\\">date</option>\n<OPTION VALUE=\\\"float\\\">float</option>\n\
  <OPTION VALUE=\\\"int\\\">int</option>\n<OPTION VALUE=\\\"text\\\">text</option>\n\
  <OPTION VALUE=\\\"varchar\\\">varchar</option>\n</SELECT>\n</TD>\n<TD ALIGN=CENTER>\n\
  <INPUT TYPE=\\\"text\\\" NAME=\\\"field_length[]\\\" SIZE=\\\"5\\\"></TD>\n</TR>\"\
  ;\n}\n//完成表单\n$form_block .= \"\n<TR>\n<TD ALIGN=CENTER COLSPAN=3><INPUT TYPE=\\\
  \"submit\\\" VALUE=\\\"Create Table\\\"></TD>\n</TR>\n</TABLE>\n</FORM>\";\n?>\n\
  \n<HTML>\n<HEAD>\n<TITLE>创建数据库表：第 2 步</TITLE>\n</HEAD>\n<BODY>\n<H1>为 <? echo \"\
  $_POST['table_name']\"; 定义字段</H1>\n<? echo \"$form_block\"; ?>\n</BODY>\n</HTML>\n\
  ```\n\n在下一节中，你将准备创建表。\n\n### 开始建表过程\n\n![](img/index-171_1.jpg)\n\n### 开始建表过程\n\n\
