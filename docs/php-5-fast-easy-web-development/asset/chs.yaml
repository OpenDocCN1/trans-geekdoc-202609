  你会看到消息已发送的确认。\n\n![](img/index-116_1.jpg)\n\n## 出错时保存值\n\n你可能在原始脚本注意到注意到如果你犯了错误，表单会被重置，你会丢失输入的值。对原始的\
  \ `$form_block` 进行简单的修改即可解决这个问题。只需在表单字段上添加 `VALUE` 属性以保存之前的任何值。\n\n1. 在文本编辑器中打开\
  \ `allinone_form.php`。\n\n2. 在 `$form_block` 变量内部，修改“Your Name”的输入字段：\n```html\n\
  <INPUT type=\"text\" NAME=\"sender_name\" VALUE=\"<?_POST[sender_name]?>\" SIZE=30>\n\
