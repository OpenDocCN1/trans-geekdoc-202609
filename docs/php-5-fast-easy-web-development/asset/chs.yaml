  ![](img/index-100_6.png)\n[](itss://chm/8934final/LiB0040.html)\n\n# 第 8 章：发送电子邮件\n\
  \n### 概述\n\n使用 PHP 将表单内容发送到指定的电子邮件地址非常简单，以至于你会怀疑为什么没有更多人每天都这样做。在本章中，你将学习如何：\n\n\
  * 修改 PHP 配置文件以便你可以发送邮件\n* 创建并发送简单的反馈表单\n* 使用 `$PHP_SELF` 变量创建一个带有自定义错误消息的反馈表单\n\n\
  [](itss://chm/8934final/LiB0040.html)\n![](img/index-101_1.png)\n![](img/index-101_2.png)\n\
  ![](img/index-101_3.png)\n![](img/index-101_4.png)\n![](img/index-101_5.png)\n![](img/index-101_6.png)\n\
  [](itss://chm/8934final/LiB0041.html)\n\n### 使用 SMTP 服务器\n\nSMTP 是 Simple Mail Transfer\
  \ Protocol（简单邮件传输协议）的缩写，SMTP 服务器是一台传输邮件的机器，就像 Web 服务器是在被请求时显示网页的机器一样。SMTP 服务器有时被称为发站邮件服务器，这引出了我的观点——你需要这样的服务器来完成本章中的练习。在\
  \ Linux/Unix 上，`Send mail` 和 `Qmail` 是流行的包。在 Windows 上，通常使用 Windows NT Service Pack\
  \ 中的 SMTP 服务或 Windows 2000 操作系统中内置的服务。\n\n然而，如果你已经在个人机器上作为开发环境的一部分安装了 Apache、PHP\
  \ 和 MySQL，那么你可能没有在本地运行 SMTP。如果是是的话，你可以访问可能已经向你提供的可用发件邮件服务器。\n\n**注意** 如果你跳过了本书的前三章，并且作为互联网服务提供商的虚拟主机包的一部分使用\
  \ PHP，那么 SMTP 服务器应该已经安装在该机器上，并且 PHP 应该已经正确配置为可以访问它。\n\n如果你的机器通过拨号连接、DSL、电缆或其他类型的访问连接到互联网，你可以使用互联网服务提供商的发件邮件服务器。例如，如果你的开发机器是一台通过\
  \ DSL 连接互联网的 Windows 设备，你可以使用类似 [mail.yourprovider.com](http://www.mail.yourprovider.com/)\
  \ 作为你的发件邮件服务器。经验法是，无论你在电子邮件客户端（Eudora、Outlook、Netscape Mail 等）中配置了什么作为发件邮件服务器，它在你的\
  \ PHP 代码中作为 SMTP 服务器也能正常工作。诀窍在于让 PHP 意识到这个小事实，你接下来将学到它。\n\n### php.ini 中与 SMTP 相关的更改\n\
  \n在 php.ini 主配置文件中，有几个指令需要设置，以便 `mail()` 函数能够正常工作。用文本编辑器打开 php.ini 并查找这些行：\n\n```ini\n\
  [mail function]\nFor Win32 only.\nSMTP = localhost\n; For Win32 only.\nsendmail_from\
  \ = me@localhost.com\n; For Unix only. You may supply arguments as well (default:\
  \ 'sendmail -t -i').\n;sendmail_path =\n```\n\n如果你使用的是 Windows，你将修改前两个指令 `SMTP`\
  \ 和 `sendmail_from`。如果你计划使用你 ISP 的发件邮件服务器（在本例中，假设它叫 DSLProvider.net），则 php.ini 中的项将如下：\n\
  \n```ini\nSMTP = mail.dslprovider.net\n```\n\n第二个配置指令是 `sendmail_from`，这是在发件邮件的\
  \ From 头中使用的电子邮件地址。它可以在邮件脚本本身中被覆盖，但通常作为默认值运行。例如：\n\n```ini\nsendmail_from = youraddress@yourdomain.com\n\
  ```\n\n当然，将 <youraddress@yourdomain.com> 替换为你自己的地址。如果你在 Linux 或 Unix 变体上，`sendmail_path`\
  \ 是你唯一需要担心的它看起来类似于：\n\n```ini\nsendmail_path = /usr/sbin/sendmail\n```\n\n或者，如果你使用的是\
  \ Qmail：\n\n```ini\nsendmail_path = /var/qmail/bin/sendmail\n```\n\n在 `sendmail_path`\
  \ 指令中，你也可以设置配置标志来指定，例如 `sendmail_path = /usr/sbin/sendmail -t -i`。在更改 php.ini 后，重启\
  \ Web 服务器并使用 `phpinfo()` 函数验证已生效。\n\n![](img/index-102_1.png)\n![](img/index-102_2.png)\n\
  ![](img/index-102_3.png)\n[](itss://chm/8934final/LiB0042.html)\n\n### 反反馈表单\n\n\
  简单的反馈表单通常包含响应者的姓名、电子邮件地址以及一个消息文本区域。在本节中，你创建两个文件：一个是反馈表单，一个是处理它的 PHP 脚本。\n\n####\
  \ 创建反馈表单\n\n1. 在文本编辑器中打开一个新文件。\n2. 输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>反馈表单</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n3. 开始你的表单。假设方法为 POST，操作是一个名为 simpleform.php 的脚本：\n\n```html\n\
  <FORM METHOD=\"POST\" ACTION=\"simpleform.php\">\n```\n\n4. 为用户姓名创建一个输入字段并带有标签：\n\
  \n```html\n<P><strong>您的姓名：</strong><br>\n<INPUT type=\"text\" NAME=\"sender_name\"\
  \ SIZE=\"30\"></P>\n```\n\n5. 为电子邮件创建一个输入字段并带有标签：\n\n```html\n<P><strong>您的电子邮件：</strong><br>\n\
  <INPUT type=\"text\" NAME=\"sender_email\" SIZE=\"30\"></P>\n```\n\n6. 创建一个用于消息的文本区域并带有标签：\n\
  \n```html\n<P><strong>您的消息：</strong><br>\n<TEXTAREA NAME=\"message\" COLS=\"30\"\
  \ ROWS=\"5\"></TEXTAREA></P>\n```\n\n7. 添加一个提交按钮：\n\n```html\n<P><INPUT TYPE=\"\
  submit\" NAME=\"submit\" VALUE=\"发送表单\"></P>\n```\n\n8. 关闭你的表单并添加一些 HTML 使文档有效：\n\
  \n```html\n</FORM>\n</BODY>\n</HTML>\n```\n\n9. 将文件保存为 simple_form.html，并将此文件放在\
  \ Web 服务器的文档根目录下。\n10. 打开浏览器并输入 [`127.0.0.1/simple_form.html`](http://127.0.0.1/simple_form.html)。\n\
  \n![](img/index-103_1.jpg)\n![](img/index-103_2.jpg)\n你应该看到一个包含姓名文本字段、电子邮件文本字段、消息文本区域以及一个写着“发送表单”按钮的表单。\n\
  \n#### 创建邮件表单的脚本\n\n根据 simple_form.html 中的表单操作，你需要一个名为 simpleform.php 的脚本。该脚本的目标是接收格式为\
  \ `$_POST[sender_name]`、`$_POST[sender_email]` 和 `$_POST[message]` 的文本，发送电子邮件，并向浏览器显示确认。\n\
  \n1. 在文本编辑器中打开一个新文件。\n2. 开始一个 PHP 块，然后混合加入一些错误检查代码：\n\n```php\n<?\nif (($_POST['sender_name']\
  \ == \"\") ||\n    ($_POST['sender_email'] == \"\") ||\n    ($_POST['message'] ==\
  \ \"\")) {\n\n    header(\"Location: simple_form.html\");\n    exit;\n}\n```\n\n\
  3. 开始构建消息字符串，它将包含电子邮件本身的内容：\n\n```php\n$msg = \"来自网站的电子邮件\\n\";\n```\n\n\n\n\n\n\
  **注意** 接下来的几步骤将通过拼接较短的字符串继续构建消息字符串，形成一个长消息字符串。\n\n![](img/index-104_1.jpg)\n\n5.\
  \ 通过添加发送者的电子邮件地址条目继续构建消息字符串：\n```php\n$msg .= \"Sender's E-Mail:\\t$_POST[sender_email]\\\
  n\";\n```\n\n6. 通过添加消息条目继续构建消息字符串：\n```php\n$msg .= \"Message:\\t$_POST[message]\\\
  n\";\n```\n\n7. 创建一个变量来存储接收者的电子邮件地址（替换为你自己的地址）：\n```php\n$to = \"you@youremail.com\"\
  ;\n```\n\n8. 创建一个变量来存储邮件的主题：\n```php\n$subject = \"Web Site Feedback\";\n```\n\n\
  9. 创建一个变量来存储额外的邮件头：\n```php\n$mailheaders = \"From: My Web Site <genericaddress@yourdomain.com>\\\
  n\";\n```\n\n**注意** 邮件头是邮件开头的字符串，它们构建了邮件的结构并使其成为有效邮件的关键。\n\n10. 将以下内容添加到 `$mailheaders`\
  \ 变量：\n```php\n$mailheaders .= \"Reply-To: $_POST[sender_email]\\n\";\n```\n\n11.\
  \ 添加 `mail()` 函数：\n```php\nmail($to, $subject, $msg, $mailheaders);\n```\n\n12.\
  \ 关闭你的 PHP ：\n```php\n?>\n```\n\n尽管这段代码会发送邮件，你应该向用户的屏幕返回一些内容，让他知道表单已发送。否则，他可能会坐在那里不断点击“提交此表单”（Send\
  \ This Form）按钮。\n\n13. 开始 HTML 输出：\n```html\n<HTML>\n<HEAD>\n<TITLE>Simple Feedback\
  \ Form Sent</TITLE>\n</HEAD>\n<BODY>\n```\n\n14. 添加一些信息来告诉用户发生了什么：\n```html\n<H1>The\
  \ following e-mail has been sent:</H1>\n```\n\n15. 为“姓名”（Your Name）字段添加文本标签并显示用户的输入，并对其他字段执行相同的操作：\n\
  ![](img/index-105_1.jpg)\n```html\n<P><strong>Your Name:</strong><br>\n<? echo \"\
  $_POST[sender_name]\"; ?>\n<P><strong>Your E-Mail Address:</strong><br>\n<? echo\
  \ \"$_POST[sender_email]\"; ?>\n<P><strong>Message:</strong><br>\n<? echo \"$_POST[message]\"\
  ; ?>\n```\n\n16. 添加更多 HTML 以确保文档是有效的：\n```html\n</BODY>\n</HTML>\n```\n\n17. 将文件保存为\
  \ `send_simpleform.php`，并将此文件放置在 Web 服务器的文档根目录下。你的代码看起来应该像下图所示。\n\n在下一节中，你将提交表单并看到所有不同类型的字符串函数开始工作。\n\
  \n## 提交表单并获取结果\n\n现在你已经创建了前端表单和后端脚本，是时候尝试它们了。\n\n1. 打开 浏览器并输入 `http://127.0.0.1/simple_form.html`。\n\
  2. 在“姓名”（Your Name）字段中输入你的名字。\n3. 在“电子邮件地址”（Your-Mail Address）字段中输入你的邮箱。\n4. 在“消息”（Message）字段中输入以下内容：PHP\
  \ is so cool!\n5. 点击“提交此表单”（Send This Form）按钮。你输入的信息以及邮件已发送的确认将出现。现在检查你的邮箱，看看是否有消息在等待你。\n\
  ![](img/index-106_1.jpg)\n![](img/index-106_2.jpg)\n\n1. 在文本编辑器中打开 `send_simpleform.php`。\n\
  2. 将制表符 `\\t` 替换为两个空格来修改 Sender's Name：\n```php\n$msg .= \"Sender's Name: $_POST[sender_name]\"\
  ;\n```\n3. 将制表符 `\\t` 替换为四个空格来修改 Sender-Mail：\n```php\n$msg .= \"Sender's Mail:\
  \ $_POST[sender_email]\";\n```\n4. 将制表符 `\\t` 替换为十个空格来修改 Message：\n```php\n$msg\
  \ .= \"Message: $_POST[message]\";\n```\n5. 保存文件并将其上传到服务器。\n![](img/index-107_1.jpg)\n\
  ![](img/index-107_2.png)\n![](img/index-107_3.png)\n![](img/index-107_4.png)\n\n\
  在下一节中，你为空字段创建自定义错误消息，并将发送邮件的两个步骤简化为一个整合脚本。\n![](img/index-108_1.png)\n![](img/index-108_2.png)\n\
  ![](img/index-108_3.png)\n\n## 带有自定义错误消息的表单\n\n在上一节中，你创建了两个独立的文件。一个包含前端（表单），另一个包含后端（脚本）。在本节中，你学习在表单动作中使用\
  \ `$_SERVER[PHP_SELF]` 变量来创建一个包含表单和脚本的单一文件，并在必需字段未完成后创建自定义错误消息。\n\n## 创建初始脚本\n\n\
  正如之前章节，创建表单/脚本对的第一步是创建前端表单。然而，在整合表单中，表单只是脚本的第一部分。\n\n1. 在文本编辑器中打开一个文件。\n2. 输入以下\
  \ HTML：\n```html\n<HTML>\n<HEAD>\n<TITLE>All-In-One Feedback Form</TITLE>\n</HEAD>\n\
  <BODY>\n```\n3. 开启 PHP 块，然后创建一个变量 `$form_block` 来存储整个表单。从表单动作开始，假设方法为 `POST` 动作为\
  \ `$_SERVER[PHP_SELF]`：\n```php\n$form_block = \"<FORM METHOD=\\\"POST\\\" ACTION=\\\
  \"$_SERVER[PHP_SELF]\\\">\";\n```\n**注意** 由于变量内部放入了一个长字符串，很会有引号。记得用反斜杠转义所有的引号！\n\
  \n4. 为用户姓名创建一个带文本标签的输入字段：\n```html\n<P><strong>Your Name:</strong><br>\n<INPUT type=\"\
  text\" NAME=\"sender_name\" SIZE=30></P>\n```\n5. 为用户电子邮件地址创建一个带文本标签的输入字段：\n```html\n\
  <P><strong>Your E-Mail Address:</strong><br>\n<INPUT type=\"text\" NAME=\"sender_email\"\
  \ SIZE=30></P>\n```\n6. 创建一个带文本标签的文本区域来存放消息：\n```html\n<P><strong>Message:</strong><br>\n\
  <TEXTAREA NAME=\"message\" COLS=30 ROWS=5 WRAP=\"virtual\"></TEXTAREA></P>\n```\n\
  7. 添加一个提交按钮：\n```html\n<P><INPUT TYPE=\"submit\" NAME=\"submit\" VALUE=\"Send This\
  \ Form\"></P>\n```\n8. 关闭表单，然后添加结束引号和分号：\n```php\n</FORM>\";\n```\n9. 关闭 PHP 块，并添加更多\
  \ HTML 以确保文档有效：\n```php\n?>\n</BODY>\n</HTML>\n```\n10. 将文件保存为 `allinone_form.php`。\n\
  \n如果你在浏览器中查看这段代码，你只会会在标题栏看到一个标题。迫切的问题应该是：“为什么我们在变量 `$form_block` 中需要所有的 HTML？”在下一节中，你将向脚本添加内容，根据某些操作显示特定的代码块。`$form_block`\
  \ 中的字符串就是这些块之一。\n![](img/index-109_1.jpg)\n\n## 为脚本添加错误检查\n\n计划是使用全局变量 `$_SERVER[PHP_SELF]`，它的值为当前脚本名称。在本例中，`$_SERVER[PHP_SELF]`\
  \ 的值为 `allinone_form.php`。当你将 `$_SERVER[PHP_SELF]` 作为表单动作时，你是在说：“当点击提交按钮时，重新加载此脚本并执行操作”，而不是“当点击提交按钮时，去找另一个脚本并执行操作”。\n\
  \n现在你已经有了脚本的壳，思考一下这个整合脚本必须做什么：\n- 显示表单\n- 提交表单\n- 检查错误\n- 在不发送邮件的情况下打印错误消息\n- 如果未发现错误则发送邮件\n\
  \n对脚本进行一些修改以帮助它确定应该执行的操作。在 `$form_block` 变量内部，提交按钮的 HTML 代码之前，添加此行：\n```html\n<INPUT\
  \ type=\"hidden\" name=\"op\" value=\"ds\">\n```\n此行创建了一个隐藏变量 `$_POST[op]`，其值为 `ds`。“op”代表“操作”（operation），而“ds”代表“做点事”（do\
  \ something）。是我起的名字，与任何编程语言无关。你可以给它们起任何名字，只要你理解它们的作用（你很快就会看到）。\n\n\n\n\n\n`$_POST[op]`\
  \ 变量仅在表单提交后存在。因此，如果 `$_POST[op]` 的值不是 `ds`，说明用户还没有见过表单。如果用户还没见过表单，你就需要显示它，因此在 PHP\
  \ 代码块结束之前添加以下 `if…else` 语句：\n\n```php\nif ($_POST[op] != \"ds\") {\n    // 他们需要看到表单\n\
  \    echo \"$form_block\";\n}\n```\n\n你还没有完成，但你的代码现在看起来应该像这样：\n\n![](img/index-110_1.jpg)\n\
  \n在下一步中，你将进行几次修改以添加错误信息。如果提交了表单，`$_POST[op]` 的值将是 `ds`，现在你必须考虑到这种情况。假设所有表单字段都是必填的；在检查\
  \ `$_POST[op]` 的值之后，检查所有字段是否有值。\n\n1. 继续 `if…else` 语句：\n```php\nelse if ($_POST[op]\
  \ == \"ds\") {\n```\n\n2. 在父语句中添加一个 `if` 语句来检查值。从 `$_POST[sender_name]` 开始：\n```php\n\
  if ($_POST[sender_name] == \"\") {\n```\n\n3. 为 `$_POST[sender_name]` 创建一个名为 `$name_err`\
  \ 的错误信息：\n```php\n$name_err = \"<font color=red>Please enter your name!</font><br>\"\
  ;\n```\n\n4. 将 `$send` 的值设置为 \"no\"：\n```php\n$send = \"no\";\n```\n\n5. 为 `$_POST[sender_email]`\
  \ 创建一个相似的 `if` 语句：\n```php\nif ($_POST[sender_email] == \"\") {\n    $email_err\
  \ = \"<font color=red>Please enter your e-mail address!</font><br>\";\n    $send\
  \ = \"no\";\n}\n```\n\n6. 为 `$_POST[message]` 创建一个相似的 `if` 语句：\n```php\nif ($_POST[message]\
  \ == \"\") {\n    $message_err = \"<font color=red>Please enter a message!</font><br>\"\
  ;\n    $send = \"no\";\n}\n```\n\n7. 开始一个 `if…else` 语句来处理 `$send` 的值：\n```php\n\
  if ($send != \"no\") {\n    // 可以发送了！\n}\n```\n\n8. 创建一个变量来存储收件人的邮箱（替换为你自己的）：\n\
  ```php\n$to = \"you@youremail.com\";\n```\n\n9. 创建一个变量来存储邮件的主题：\n```php\n$subject\
  \ = \"All-in-One Web Site Feedback\";\n```\n\n10. 创建一个变量来存储额外的邮件头：\n```php\n$mailheaders\
  \ = \"From: My Web Site <genericaddress@yourdomain.com> \\n\";\n```\n\n11. 向 `$mailheaders`\
  \ 变量添加：\n```php\n$mailheaders .= \"Reply-To: $_POST[sender_email]\\n\";\n```\n\n\
  12. 构建消息字符串：\n```php\n$msg = \"E-MAIL SENT FROM WWW SITE\\n\";\n$msg .= \"Sender's\
  \ Name: $_POST[sender_name]\\n\";\n$msg .= \"Sender's E-Mail: $_POST[sender_email]\\\
  n\";\n$msg .= \"Message: $_POST[message]\\n\\n\";\n```\n\n13. 添加 `mail()` 函数：\n\
  ```php\nmail($to, $subject, $msg, $mailheaders);\n```\n\n14. 添加一个简单的语句让用户知道邮件已发送，并去掉\
  \ `if` 语句：\n```php\necho \"<P>Mail has been sent!</p>\";\n```\n\n15. 继续 `if…else`\
  \ 语句来处理 `$send` 为 \"no\" 的值：\n```php\nelse if ($send == \"no\") {\n```\n\n16. 打印错误信息：\n\
  ```php\necho \"$name_err\";\necho \"$email_err\";\necho \"$message_err\";\n```\n\
  \n17. 再次打印表单：\n```php\necho \"$form_block\";\n```\n\n18. 关闭当前的 `if…else` 块和父 `if…else`\
  \ 块：\n```php\n}\n```\n\n19. 保存文件。整个代码应该是这样的：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>All-In-One\
  \ Form</TITLE>\n</HEAD>\n<BODY>\n<?php\n$form_block = \"\n<FORM METHOD=\\\"POST\\\
  \" ACTION=\\\"$SELF\\\">\n<P>Your Name:</br>\n<INPUT type=\\\"text\\\" NAME=\\\"\
