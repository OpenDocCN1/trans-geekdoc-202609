  ##分为八部分，每部分对应特定的主题组。每个部分的章节都是在之前章节信息的基础上构建的：\n\n- 第一部分， “入门”，将引导你完成 `MySQL`、`Apache`\
  \ 和 `PHP` 的安装和配置。在继续之前，你需要你需要完成第一部分 中的课程，除非你已经拥有了这些技术的可以运行的安装版本。\n- 第二部分， “PHP 编程的绝对基础”，将教你\
  \ `PHP` 语言的基础知识，从变量和语言的核心结构开始。大量的实战示例将让你养成编写代码、上传代码并测试结果的习惯。\n- 第三部分， “从简单内容开始”，基于在前章节中学到的基础知识，帮助你创建多部分脚本并显示动态内容等。\n\
  - 第四部分， “了解你的 MySQL 数据库”，向你介绍通用数据库的概念，特别是 `MySQL`，并向你展示如何创建 `PHP` 脚本与 `MySQL` 通信并执行各种任务。\n\
  - 第五部分， “用户身份验证与追踪”，向你展示如何使用 `PHP` 限制对应用程序的访问，如何设置 Cookie 以及处理用户会话（包括用户偏好的存储）。\n\
  - 第六部分， “创建自己的联系人管理系统”，包含了几个章节，引导你设计并创建一个特定类型的应用程序，在本例中联系人管理系统（称为基于网络的通讯录）。\n- 第七部分，\
  \ “其他项目示例”，包含了致力于其他流行类型项目的章节，例如管理邮件列表、创建自定义报告以及处理 `XML`。\n- 第八部分， “附录”，包含了若干关于 `PHP`\
  \ 和 `SQL` 语言的简便参考资料，以及其他信息，包括如何使用 `SQLite` 以及去哪里寻找帮助和额外的教程。\n\n[](itss://chm/8934final/LiB0007.html)\n\
