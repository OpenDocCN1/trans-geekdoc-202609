  \ Value 2 输入 27。\n2. 选择 add，并点击 Calculate 按钮。\n\n加法计算的结果将显示在屏幕上。\n\n## HTTP 环境变量\n\
  \n当 Web 浏览器向 Web 服务器发送请求时，它会随请求一起发送一系列额外的变量。这些变量被称为环境变量，它们对于显示动态内容或授权用户非常有用。\n\n\
  `phpinfo()` 函数会显示关于你的 Web 服务器软件和正在运行的 PHP 版本的大量信息，以及基础 HTTP 环境。让我们看看你有什么。\n\n1.\
  \ 在你的文本编辑器中打开一个新文件。\n2. 输入以下行 PHP 代码：\n```php\n<?php\nphpinfo();\n?>\n```\n\n\n\n\
  \n\n```php\n<? phpinfo(); ?>\n```\n\n3. 将文件保存为 `phpinfo.php`，并将此文件放在你 Web 服务器的文档根目录下。\n\
  \n4. 打开网页浏览器并输入 `http://127.0.0.1/phpinfo.php`。\n\n你应该能看到一个充满了有趣信息的长页面。\n\n**注意**\
  \ 这些信息会有所不同，不仅在不同的机器之间不同，在不同的平台和版本之间也不同。你的运行结果将会有所不同，但整体模板是相同的。\n\n向下滚动，寻找标题为 `Apache\
  \ Environment` 的部分。在接下来的章节中，你将学习如何使用此处找到的环境变量：`REMOTE_ADDR` 和 `HTTP_USER_AGENT`。要了解\
  \ `phpinfo()` 输出中显示的其他一些 `HTTP` 环境变量的解释，请访问 `http://hoohoo.ncsa.uiuc.edu/cgi/env.html`。\n\
  \n## 获取和使用 REMOTE_ADDR\n\n默认情况下，环境变量以 `$VAR_NAME` 的形式供 PHP 脚本使用。例如，`REMOTE_ADDR`\
  \ 环境变量已经包含在 `$REMOTE_ADDR` 中。然而，为了绝对确保你读取的是正确的值，你可以使用 `getenv()` 函数将值赋值给你选择的变量。\n\
  \n![](img/index-82_1.jpg)\n\n`REMOTE_ADDR` 环境变量包含请求机器的 IP 地址。让我们获取你的 `REMOTE_ADDR`\
  \ 值。\n\n1. 在你的文本编辑器中打开一个新文件。\n2. 打开一个 PHP ，然后使用 `getenv()` 将 `REMOTE_ADDR` 的值放在名为\
  \ `$address` 的变量中：\n\n```php\nphp\n$address = getenv(\"REMOTE_ADDR\");\n```\n\n\
  3. 将 `$address` 的值打印到屏幕上，并关闭 PHP 块：\n\n```php\necho \"Your IP address is $address.\"\
  ;\n?>\n```\n\n4. 将文件保存为 `remoteaddress.php`，然后将此文件放在你 Web 服务器的文档根目录下。\n5. 打开网页浏览器并输入\
  \ `http://127.0.0.1/remoteaddress.php`。\n\n你的当前 IP 地址将打印在屏幕上。\n\n**注意** 你的 IP 地址将与此处显示的不同，此处是我运行此脚本时的\
  \ IP 地址。\n\n[在下一节中，]你将获取另一个实用的环境变量 `HTTP_USER_AGENT` 的值，该环境变量包含了所用浏览器的标识字符串。\n\n\
  ## 获取和使用 HTTP_USER_AGENT\n\n`HTTP_USER_AGENT` 变量包含浏览器类型、浏览器版本、语言编码和平台。例如，以下值字符串指的是\
