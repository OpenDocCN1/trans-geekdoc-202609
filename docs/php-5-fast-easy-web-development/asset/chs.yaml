  [](itss://chm/8934final/LiB0001.html)\n\n# 引言\n\n如果四年前你告诉我这本小书会受欢迎到需要出第三版，我会笑话你的。但这本书的风格和内容证明非常适合\
  \ PHP 初级学者。`Fast & Easy Web Development`（快速轻松 Web 开发）风格是一种步步渐进的、通过示例学习新编程语言的路径——而且配有图片！与大多数编程书籍中那些冗长的纯文本章节不同，`Fast\
  \ & Easy Web Development` 风格吸引了 PHP 初学者，特别是对编程整体感兴趣的用户。\n\n这第三版考虑了来自前两个版本的反馈，但保持了原始的内容结构和学习路径。例如，前三章专门用于在你的\
  \ Windows 或 Linux 机器上运行 `Apache`、`MySQL` 和 `PHP`。你可能会对它有多简单以及你上手速度有多快感到惊讶——这将是好事，因为你需要这三种技术都能正常工作才能继续课程。\n\
  \n在本版中，增加了一些章节以为练习你的新技能提供额外的项目，并涵盖了 `PHP` 5 版本中出现的新元素。完成本书后，你将在 Web 技术基础和应用设计方面拥有坚实的基础，并准备好学习更高级的主题和编程方法。然而，在进入所有这一切之前，请花点时间熟悉\
  \ PHP 以及为什么它是一种如此值得学习和使用的语言。\n\n## 什么是 PHP？\n\n它的正式名称是 `PHP: Hypertext Preprocessor`（超文本预处理器），是一种服务端脚本语言。当你的\
  \ Web 浏览器访问 URL 时，它正在向 Web 服务器发送请求。当你请求一个 `PHP` 页面，类似于 `[`www.yourcompany.`](http://www.yourcompany/)\
  \ com/home.php` 时，Web 服务器唤醒 `PHP` 解析引擎并说：“嘿！在我向这个人的 Web 浏览器返回结果之前，你得做些什么。”然后，`PHP`\
  \ 解析引擎运行 `home.php` 中的 way `PHP` 代码并返回结果输出。该输出作为文档中 HTML 代码的一部分传回 Web 服务器，然后传递给你的浏览器，由浏览器显示给你。\n\
  \n[](itss://chm/8934final/LiB0001.html)\n![](img/index-7_1.png)\n![](img/index-7_2.png)\n\
  ![](img/index-7_3.png)\n![](img/index-7_4.png)\n![](img/index-7_5.png)\n![](img/index-7_6.png)\n\
  [](itss://chm/8934final/LiB0002.html)\n\n## PHP 简史\n\n1994 年，一位非常有前瞻性的男人 Rasmus\
  \ Lerdorf 开发了一套工具，使用解析引擎来解释此地各处的几处宏。它们并不奢华：一个访客簿、一个计数器以及其他在 Web 婴儿时期很酷的“首页”元素。他最终将这些工具与他编写的一个表单处理（FI）包结合在一起，添加了一些数据库支持。\n\
  \n由于开源软件精神，全世界的开发者都开始贡献 `PHP`。到 1997 年，已有 50,000 个网站使用 `PHP` 来完成各种任务。\n\n那时，在 Zeev\
  \ Suraski 和 Andi Gutmans 的全力协助下，PHP 3.0 诞生了。1998 年 6 月发布了 PHP 3.0，它支持多平台、众多数据库以及\
  \ SNMP（简单网络管理协议）和 IMAP（互联网消息访问协议）。\n\n随后，PHP 4.0 诞生了。它对 PHP 核心进行了重新思考，并重写了脚本语言本身。自\
  \ PHP 4 发布以来，PHP 开发团队和 Zend Technologies 产生了一个比 3.0 性能提升了近 50 倍、功能丰富的产品。\n\n如果这还不够，`PHP\
  \ 5` 几乎一直在开发中，直到我们今天这样一个适用于过程化或面向对象脚本的更快速、功能更强大的语言，它在企业级应用中有一席之地。\n\n[](itss://chm/8934final/LiB0002.html)\n\
  ![](img/index-8_1.png)\n![](img/index-8_2.png)\n![](img/index-8_3.png)\n![](img/index-8_4.png)\n\
  ![](img/index-8_5.png)\n![](img/index-8_6.png)\n[](itss://chm/8934final/LiB003.html)\n\
  \n## PHP 能做什么？\n\nPHP 可以做你想做的任何事，除了坐在地上旋转。实际上，通过一点动态图像处理和动态 HTML，它可能也能做到。\n\n根据\
  \ PHP 手册，“该语言的目标是让 Web 开发者快速编写动态页面。”\n\n以下是 PHP 的一些常见用途，你将在书中学习到：\n\n- 执行系统功能：在系统上创建、打开、读取、写入和关闭文件；执行系统命令；创建目录并修改权限。\n\
  - 从表单收集数据：将数据保存到文件、通过电子邮件发送并返回处理后的数据。\n- 访问数据库并生成内容，或为添加、删除和修改数据库元素创建 Web 界面。\n\
  - 设置 Cookie 并访问 Cookie 变量。\n- 开启会并使用会变量和对象。\n- 限制对网站部分的访问。\n- 创建图像。\n- 加密数据。\n\n\
  这些只是基础日常用途。PHP 还包括集成 Java Servlet、XML 以及许多其他高级功能。可能性是无限的。\n\n\n\n\n\n[](itss://chm/8934final/LiB0004.html)\n\
  \n# 为什么选择 PHP 5？\n\n语言的不断发展是自然趋势，而 `PHP 5` 正是做这一点——它的变化代表了该语言增长和发展的下一步。`PHP 4` 本身并没有根本性的错误，事实上，本书的大部分内容都可以在运行\
  \ `PHP 4` 而非 `PHP 5` 的服务器上。`PHP 5` 的变化围绕着语言的高层方面，即对象模型。\n\n如果你是从其他编程语言转向 `PHP` 的，特别是高度结构化、特定为面向对象的语言，那么切换到一个恰好能处理面向对象编程的灵活过程化语言可能会令人沮丧。但是，易用性和健壮性是新程序员最初被\
  \ `PHP` 吸引的原因之一——学习曲线并不陡峭，而且它能够完成任务。\n\n然而，这为在企业环境中工作的 `PHP` 用户带来了营销上的问题。某些决策者可能不会认为\
  \ `PHP` 适用于企业级应用开发，因为它不是像 `C` 甚至 `Java` 那样经过时间考验的结构化、面向对象的编程语言。开发者可能没有时间或机会通过展示\
  \ `PHP` 和 `C` 的示例来向经理说服他们，尽管 `PHP` 和 `C` 在执行相同任务时具有相同的结构、安全性、可用性和异常处理能力。\n\n正是由于这些问题，出现了\
  \ `PHP 5` 的开发路线，其主要目标是改进对象模型，培养编程规范，并专门设计一个满足面向对象开发者需求的 `PHP` 版本，允许他们与 `Java`、`.NET`\
  \ 以及其他企业级框架接口。\n\n但初学者（可能是本书的主要读者）在工作的第一天不会面对对象、类、`.NET` 或 XML 集成。这些用户只需要一种快速、灵活的语言来创建基础动态网站，`PHP\
  \ 5` 满足了需求。尽管 `PHP 5` 包含了增强的脚本引擎和大幅改进的面向对象框架，`PHP` 社区和 `Zend Technologies` 认可并欣赏使其普及的用户根源。正如\
  \ `PHP 4` 一样，`PHP 5` 不强制你使用你需要的语言元素。\n\n# PHP 5 变化概述\n\n由于本书未提供面向对象视角的 `PHP` 编程教程，本节将不会详细介绍\
  \ `PHP 5` 的对象模型变化。对此，我强烈推荐 Harry Fuecks 的文章“[PHP5: Coming Soon to a Webserver Near\
  \ You](http://www.sitepoint.com/article/1192/)”（即将来到你的 Web 服务器），该文章对 `PHP 5` 中相关的更改进行了出色的剖析，以及如何实现它们。\n\
  \n`PHP 5` 的其他几个主要特性包括嵌入数据库引擎 `SQLite`。这完全不是为了替换 `MySQL`、`PostgreSQL` 或 `Oracle`\
  \ 这样健壮的数据库。相反，这种简单、快速的数据库可以在文件和内存中存储数据，因此非常适合会话数据和应用配置等信息——虽然本书选择 `MySQL` 作为数据库，但你可以在附录\
  \ E “使用 SQLite”。\n\n另一个变化在 XML 领域。`PHP 4` 使用了多个第三方库来控制 XML 解析和渲染，因此没有单一可靠的 XML 渲染和解析机制。`PHP\
  \ 5` 提供了一个 XML 库 —— Gnome 的 `libxml`，作为 `DOM` 扩展的基础。该库非常快速且功能齐全，因此是 `PHP` 中重建 XML\
  \ 功能的坚实基础。你将在第 25 章 “处理 XML”中学习更多如何在 `PHP 5` 中处理 XML。\n\n# 与 PHP 4 的向后兼容\n\n变更日志和\
  \ `PHP` 手册总是指示新实现是否会在旧版本中引起问题，因此即使不看常用函数的条目，至少也要仔细阅读变更日志。然而，`PHP 5` 的大部分关注的是附加功能而非完全替换现有元素。如果你在使用\
  \ `PHP 4` 学习 `PHP`，你可能会发现你的脚本并不*需要*重写。\n\n需要重写和为了利用新功能而重写脚本是完全不同的——你可能想为了利用新的面向对象功能而重写，但你可能不必这样做。如果你的代码主要是过程化的（如书中的脚本所示），那么有超过\
  \ 95% 的概率不需要重写。\n\n同样，如果由于开发或产品目的，你无法在自己的机器上安装 `PHP`（如第 3 章 “安装 PHP”所示），并且必须使用 `PHP\
  \ 4`，请不要担心。书中教的任何 `PHP 4` 中无法运行的内容都会被此类指出。\n\n[](itss://chm/8934final/LiB0004.html)\n\
