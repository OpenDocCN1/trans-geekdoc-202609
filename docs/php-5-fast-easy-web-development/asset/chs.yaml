  \n### 附录 E：使用 SQLite\n\n### 概述\n\n在附录 D，“数据库规范化和 SQL 参考”中，你学习了规范化数据库的重要性以及扁平文件的潜在问题。然而，在许多情况下，你的\
  \ PHP 可能只需要单个数据库表，这并没有问题。例如，假设你只是在归档通过网站设置的简单联系表单的内容，作为备份以防邮件发送的版本从未到达。简单的表可能包含姓名、电子邮件地址、注释和日期的字段——没有必要对其进行规范化！如果你发现自己处于没有数据库的开发环境，且某些强制要求你必须安装一个，PHP\
  \ 5 引入了另一个选项——利用 SQLite 的能力，SQLite 是基于 SQL 接口的扁平文件数据库。\n\n注意：SQLite 在 PHP 5 中默认启用。有关超出本附录涵盖范围的更多详细信息，请访问\
  \ SQLite 网站 [`www.sqlite.org/`](http://www.sqlite.org/) 或在 PHP 手册中搜索 SQLite 部分 [`www.php.net/sqlite/`](http://www.php.net/sqlite/)。要使用\
  \ SQLite，你仍然必须对数据库、表和字段如何协同工作有基本的理解。你在书中学到的所有关于连接数据库、发布查询和获取结果的过程仍然有效，不同在于你学会了使用\
  \ MySQL 特有的函数向 MySQL 服务器发送命令。SQLite 有它自己的一组函数，你用它们执行相同类型的任务。\n\n[](itss://chm/8934final/LiB0137.html)\n\
  ![](img/index-387_1.png)\n![](img/index-387_2.png)\n![](img/index-387_3.png)\n[](itss://chm/8934final/LiB038.html)\n\
  \n#### SQLite 的实战示例\n\n本节逐步介绍了使用 SQLite 版本处理数据库工作时的一些基本任务。在进行任何操作之前，你必须创建一个数据库：\n\
  \n1.  在你的文本编辑器中打开一个新文件并开始 PHP 块：\n```php\n<?\n```\n2.  使用 `sqlite_open()` 函数从文档根目录打开数据库——不要担心它还没有创建，因为如果文件不存在，该函数将创建它。如果命令失败，`sql_error_string()`\
  \ 函数将显示任何错误消息：\n```php\n$db = sqlite_open(\"../test.db\") or die(sql_error_string());\n\
  ```注意：你可能会发现创建或打开 SQLite 数据库没有使用用户名或密码。这是因为 SQLite 数据库技术上只是一个普通文件，除了对放置文件的目录具有读写权限外没有其他要求。\n\
  \n3.  关闭 PHP 块：\n```php\n?>\n```\n将此文件保存为 `sqlite1.php` 并将其放在 浏览器的文档根目录下。访问 [`127.0.0.1/sqlite1.php`](http://127.0.0.1/sqlite1.php)\
  \ 来创建数据库。\n注意：如果脚本执行成功，将没有任何输出。只有当脚本执行失败时，才会看到消息。\n\n现在你已经有一个可以工作的 SQLite 数据库，可以继续创建表和发布查询了。\n\
  \n#### 使用 SQLite 创建表和存储数据\n\n当你使用 MySQL 创建表时（实际上在任何关系型数据库系统中创建表时），你特地定义了字段类型和长度。例如，你可能有一个\
  \ 25 字符的 `varchar` 字段 `name`，或者一个 `datetime` 字段 `start_date`。SQLite 是*松散类型*的，这意味着所有字段的内容无论其实际类型是什么，都被存储为字符串。因此，SQLite\
  \ 不要求你在创建表时定义字段，如果你定义了，它们将被忽略。\n\n在接下来的示例中，你将创建一个只存储名、姓和电子邮件地址的表，并向表中填充几条记录：\n\n\
  1.  在你的文本编辑器中打开一个新文件并开始 PHP 块：\n```php\n<?\n```\n2.  使用 `sqlite_open()` 函数打开之前创建的数据库：\n\
  ```php\n$db = sqlite_open(\"../test.db\") or die(sql_error_string());\n```\n3. \
  \ 使用 `sqlite_query()` 函数发布创建表命令：\n```php\nsqlite_query($db, \"CREATE TABLE my_friends\
  \ (first_name, last_name, email)\");\n```\n4.  使用 `sqlite_query()` 函数使用 SQL `INSERT`\
  \ 命令添加几个条目：\n```php\nsqlite_query($db, \"INSERT INTO my_friends VALUES ('John',\
  \ 'Smith', 'john@smith.com')\");\nsqlite_query($db, \"INSERT INTO my_friends VALUES\
  \ ('Jane', 'Doe', 'jane@doe.com')\");\nsqlite_query($db, \"INSERT INTO my_friends\
  \ VALUES ('Julie', 'Meloni', 'julie@thickbook.com')\");\n```\n5.  关闭 PHP 块：\n```php\n\
  ?>\n```\n\n完整的脚本应该是这样的：\n```php\n<?\n$db = sqlite_open(\"../test.db\") or die(sql_error_string());\n\
  sqlite_query($db, \"CREATE TABLE my_friends (first_name, last_name, email)\");\n\
  sqlite_query($db, \"INSERT INTO my_friends VALUES ('John', 'Smith', 'john@smith.com')\"\
  );\nsqlite_query($db, \"INSERT INTO my_friends VALUES ('Jane', 'Doe', 'jane@doe.com')\"\
  );\nsqlite_query($db, \"INSERT INTO my_friends VALUES ('Julie', 'Meloni', 'julie@thickbook.com')\"\
  );\n?>\n```\n将此文件保存为 `sqlite2.php` 并将其放在 浏览器的文档根目录下。访问 [`127.0.0.1/sqlite2.php`](http://127.0.0.1/sqlite2.php)\
  \ 来发布这些 SQLite 命令。再次，如果脚本执行成功，将没有任何输出。只有当脚本执行失败时，才会看到消息。\n\n\n\n\n现在你已经在 SQLite\
  \ 表中有了记录，可以检索它们了。同样，这个过程与从 MySQL 表中检索数据非常相似。\n\n1.  在你的文本编辑器中打开一个新文件并开始一个 PHP 块：\n\
  ```php\n<?\n```\n\n2.  使用 `sqlite_open()` 函数打开你之前创建的数据库：\n```php\n$db = sqlite_open(\"\
  ../test.db\") or die(sql_error_string());\n```\n\n3.  使用 `sqlite_query()` 函数发布一个\
  \ `SELECT` 命令，旨在按姓氏升序顺序检索记录：\n```php\n$r = sqlite_query($db, \"SELECT * FROM my_friends\
  \ ORDER BY last_name ASC\");\n```\n\n4.  检查结果，如果查询未成功，则打印消息：\n```php\nif (!$r) {\n\
  \    echo \"Sorry, no records.\";\n} else {\n```\n\n5.  添加一个 `while` 循环来处理成功的查询。此循环将使用\
  \ `sqlite_fetch_array()` 函数，它的工作方式与你在整本书中使用的 `mysql_fetch_array()` 函数完全相同：\n```php\n\
  while ($record = sqlite_fetch_array($r)) {\n```\n\n6.  为你从表中提取的每个字段创建变量：\n```php\n\
  $_first_name = $record[first_name];\n$last_name = $record[last_name];\n$email =\
  \ $record[email];\n```\n\n7.  将每条记录打印到屏幕，然后关闭 `while` 循环、`if...else` 块和 PHP 块：\n\
  ```php\necho \"record: $last_name, $first_name ($email) <br>\";\n}\n}\n?>\n```\n\
  \n你的整个代码应该像这样：\n```php\n<?\n$db = sqlite_open(\"../test.db\") or die(sql_error_string());\n\
  $r = sqlite_query($db, \"SELECT * FROM my_friends ORDER BY last_name ASC\");\nif\
  \ (!$r) {\n    echo \"Sorry, no records.\";\n} else {\n    while ($record = sqlite_fetch_array($r))\
  \ {\n        $first_name = $record[first_name];\n        $last_name = $record[last_name];\n\
  \        $email = $record[email];\n        echo \"record: $last_name, $first_name\
  \ ($email) <br>\";\n    }\n}\n?>\n```\n\n![](img/index-389_1.jpg)\n\n将此文件保存为 `sqlite3.php`\
  \ 并将其放在 Web 浏览器的文档根目录下。访问脚本 [`127.0.0.1/sqlite3.php`](http://127.0.0.1/sqlite3.php)\
  \ 以发布这些 SQLite 命令并显示输出。\n\n现在你已经看到处理 SQLite 的过程在过程上与处理其他数据库是类似的，你可以快速浏览一下下一节 来获取一些其他有用信息。\n\
  \n## 使用 SQLite 执行其他任务\n\n在之前的章节中，你已经学习了如何创建 SQLite 数据库和表，以及向这些表插入和从表中选择元素。可以安全地推断，你可以类似发布\
