  \ Web 诞生以来，她一直在开发基于 Web 的应用程序，对第一个 GUI Web 浏览器出现时的兴奋心情记忆犹新。她是多本关于 Web 编程语言和数据库主题的书籍作者，你可以在多种语言中找到她的作品，包括中文、意大利语、葡萄牙语、波兰语甚至塞尔维亚语。\n\
