  ![](img/index-54_5.png)\n\n现在引号已经转义了，PHP 解析器就可以处理该文件，其余输出都是成功的。通过密切关注分号等内容来避免此类及其他错误，正如你在下一节中，将学会的那样，引号。\n\
  \n## 注释你的代码\n\n为代码编写注释是一个良好的习惯。HTML 和 PHP 注释在书中被广泛用于解释代码块。习惯阅读注释，并尝试养成使用它们的习惯。编写清晰、无\
  \ Bug 且包含注释和大量空白以便于阅读的代码，将使你在开发者同行中广受欢迎，因为他们不需要太费力。\n\n\n\n\n非常难弄清楚你的代码到底在做什么。在下一章中，你将学习关于变量的所有知识，或者，正如我喜欢称呼的那样，“那些带有美元符号的东西”。\n\
