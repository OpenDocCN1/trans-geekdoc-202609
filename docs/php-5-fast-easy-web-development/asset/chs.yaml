  ![](img/index-318_2.png)\n![](img/index-318_3.png)\n\n## 开发邮件发送机制\n\n现在你已经有了订阅/取消机制，可以创建一个非常基础的表单和一个邮件发送脚本。该邮件发送机制将你的表单内容发送到表中的每一个地址。\n\
  \n## 创建邮件通讯表单\n\n当我说你会创建一个“简单”的表单时并没有开玩笑。我只是使用了一个用于邮件主题的文本字段和一个用于正文的文本区域。只要适当修改表单和脚本，你可以使用任意数量字段。\n\
  \n1. 在文本编辑器中打开一个文件并输入：\n```html\n<HTML>\n<HEAD>\n<TITLE>Send a Newsletter</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>Send a Newsletter</h1>\n```\n2. 开始你的表单。假设方法为 `POST`，动作为 `do_send_newsletter.php`：\n\
  ```html\n<FORM METHOD=\"POST\" ACTION=\"do_send_newsletter.php\">\n```\n3. 为邮件主题创建一个带标签的输入字段：\n\
  ```html\n<P>Give it a subject:</br>\n<input type=\"text\" name=\"subject\" size=30>\n\
  ```\n4. 为邮件正文创建一个带标签的文本区域：\n```html\n<P>Newsletter body:</br>\n<textarea name=\"\
  newsletter\" cols=50 rows=10 wrap=\"virtual\"></textarea>\n```\n5. 添加一个提交按钮：\n```html\n\
  <p><input type=\"submit\" name=\"submit\" value=\"Send Newsletter\"></p>\n```\n\
  6. 关闭表单并添加一些 HTML 使文档有效：\n```html\n</FORM>\n</BODY>\n</HTML>\n```\n7. 将文件保存为 `send_newsletter.html`，并将此文件放在\
  \ Web 服务器的文档根目录下。\n8. 打开浏览器并输入 [`127.0.0.1/send_newsletter.html`](http://127.0.0.1/send_newsletter.html)。\n\
  ![](img/index-319_1.jpg)\n你会看到一个包含主题文本字段、消息区域和一个 Send Newsletter 按钮的表单。\n在下一节中，你会创建一个后端脚本。该脚本将期望两个变量：`$_POST[subject]`\
  \ 和 `$_POST[newsletter]`。\n\n## 创建发送邮件的脚本\n\n根据 `send_newsletter.html` 中的表单动作，你需要脚本\
  \ `do_send_newsletter.php`。该脚本的目标是接受 `$_POST[subject]` 和 `$_POST[newsletter]` 中的文本，然后以电子邮件的形式发送给\
