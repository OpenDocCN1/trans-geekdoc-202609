  \n### 比较运算符\n\n你可能不会感到意外，比较运算符用于比较两个值。和算术运算符一样，你可能已经见过大多数比较运算符，但可能不知道它们称为什么。看一眼\
  \ 表 5.3，然后你就可以开始为此节创建测试脚本了。\n\n### 表 5.3：比较运算符\n\n| 运算符 | 定义 |\n| :--- | :--- |\n\
