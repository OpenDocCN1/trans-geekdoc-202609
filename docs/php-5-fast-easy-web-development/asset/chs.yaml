  $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\") or die(mysql_error());\n\
  $db = @mysql_select_db($db_name, $connection) or die(mysql_error());\n//构建并发布查询\n\
  $sql = \"SELECT \\* FROM $table_name WHERE username = \\\"\\$_POST[username]\\\"\
