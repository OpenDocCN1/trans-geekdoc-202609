  \ `Terraform` 等工具或云服务商的管理控制台高效地预配虚拟机。\n\n# 在 AWS 上为 PHP 8 创建虚拟机的 Terraform 代码示例\n\
  \n```hcl\nresource \"aws_instance\" \"php_app\" {\n  ami           = \"ami-0c55b159cbfafe1f0\"\
