  \ 容器为部署 `PHP 8` 应用程序提供了轻量级且一致的环境。您可以将应用程序容器化，并使用 `Kubernetes` 等容器编排平台来管理和扩展容器。\n\
  \n# PHP 8 应用程序的 Dockerfile 示例\n\n```dockerfile\nFROM php:8.0-apache\nCOPY . /var/www/html/\n\
