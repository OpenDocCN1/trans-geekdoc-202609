  trans: '

    [content]

    其中一些内容引发了科幻想象，促使人们担心人工推理将超越人类并掌控世界。归根结底，我们的机器实际上将想要执行我们能做的一切事情，而且做得得更好。我们的 PC
    将超越我们并抛弃我们。尽管存在通常的恐惧感，但计算机化推理仍然是一个年轻的领域，有很长的路要走。虽然它在短期内可能不会掌控世界，但 AI 已经改变了如今的劳动力市场，并在未来将继续对其进行变革。


    过去需要人类推理的职业现在可以通过 AI 实现。工业设施、临床分析，甚至出租车都可以利用人工推理和 AI 来完成。信息正在变成一个始终具有重要意义的研究领域。信息中的示例可能用人类大脑难以解读，这就是我们使用机器来识别模式的原因。


    在金融领域，AI 正被用于识别虚假陈。目前的计算能够识别货币交易何时具有虚假陈属性。组织可以通过感知词汇示例和注定虚假的审计发布时间来发现伪造的调查卷。


    我们的电话使用语音识别来理解我们说的话并对我们的请求做出反应。社交媒体利用复杂信息分析来识别照片中的模式，在我们开始标记之前就能识别出图像中是谁。这一切都是通过
    AI 的数据收集和翻译完成的。照片中告诉我们是谁的示例是经过 AI 模型分析和增强的信息。


    1959 年，Arthur Samuel 首次提出了“AI”这一术语。作为麻省理工学院（MIT）的毕业生，他决定编写一个可以玩国际棋的计算机程序。他选择国际棋是因为它们相对简单，而且由于国际棋包含许多潜在策略。这发生在
    IBM 的深蓝（Deep Blue）之前，但其假设非常相似：让计算机随着时间的推移通过新信息进行学习。


    计算机思考了每个棋子的位置以及每一个可能的移动。每一步移动都有一个胜率评分。计算包含了棋盘上的棋子数量以及升王棋子数量等因素。


    计算保留了它遇到的每种位置组合，这种循环被称为重复学习。对于这些组合中的每一个，它都记住了胜率评分。在几年里，Samuel 与机器进行了无数次游戏，教它它如何玩。


    编写 AI 的目的是为了告知机器运行得如何，并找出如何击败对手。机器需要找出如何下国际棋，并找出如何减少错误以获胜。这是 AI 首次在软件工程或人工推理之外被讨论为一个独立的自主研究领域。


    斯坦福大学将 AI 称为“研究让计算机在没有明确指令的情况下行动的学科”。Samuel 的计算机不需要被定制来记住每个国际棋的可能移动。总而言之，机器获得的“经验”充当了信息，它从每场游戏中获得信息以改进其获胜策略。见解为
    AI 提供了构建和机制。尽管 1959 年引入了 AI 术语，但自 20 世纪 90 年深蓝出现以来，它一直被视为软件工程的一个不同领域。


    典型的 PC 编程使用信息指令来协调模型。一个例子是在你的 `python` 窗口中输入 `4+4`。它将给你答案 `8`。在其他条件相同的情况下，AI 是一个可以解决复杂问题的强大工具，但它并不是灵丹妙药。它需要仔细的实施和理解才能发挥其全部潜力。

    [/content]

