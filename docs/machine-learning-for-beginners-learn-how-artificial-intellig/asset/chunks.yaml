    向下滚动直到你看到工作框架的概览。选择你的工作框架。它将根据你的工作框架，为你提供在其网站上引入相关内容的指南。此时，你就准备好开始在 Python 的世界中探索了。我强烈建议利用网络上可以获得的免费初学者
    Python 教学练习。EdX 有一个免费的 Python 初学者教学练习，这是一个非常棒的起点。同样，利用像 Reddit 这样的社区，那里有无数常见问题已经得到了详尽解答，而且人们也在不断分享
    AI 领域的相关信息。


    ## 算法


    当你拥有了数据以及控制它的工具和编程能力后，你需要将它们结合起来。将你的数据放到你的程序中。刚开始时，可以在网上寻找免费的数据集进行处理。`Kaggle.com`
    是免费的，拥有大量 `CSV` 格式的信息集可供浏览，一旦你在 `Python` 中引入了 `Pandas` 库，处理这些数据将变得简单。


    起初，最好的算法是用于监督学习的直接回归，以及用于无监督学习的 `k-means` 聚类。这些将是一个相当简单的起点，从那里开始你可以向不同的模型努力。


    ## 可视化工具


    你拥有了数据，并且已经使用其中一种编程语言创建了模型，你有一整套数据科学库来帮助你更快地完成。你的电脑运行良好，你可以自由地创建模型。


    你可能已经创建了显示迷结果的模型，但要将其转化为通俗易懂的语言并与伙伴讨论你的发现，你需要以一种易于想象的方式对其进行组织。如果你是一个营销项目上的数据研究员，你可能创建了一个帮助对流失客户进行分类并预测购买意向模式的模型。无论如何，假设你需要将这些结果传给营销团队的其他成员，你需要弄清楚如何表述，以便即使是不熟悉数据科学的人也能理解你的结果。将你的数据整理成大纲、图表和视觉效果将有助于提升你的研究能力。当你与对数据研究感兴趣的群体交流时，能够创建数据的感知视图至关重要。


    数据专家的一个知名工具集是 `Tableau`。这类设备被称为数据可视化编程。在某些公司，有的代表其整个工作包括将难以理解的数据以一种易于想象的方式引入。


    像这样的场景通常被依赖数据做出决策的组织使用。这种场景非常有用，因为它通常易于使用，并且可以通过其基础看到连续的数据。你可以用你的数据调整用于制作报告和图表的仪表板。它还允许你向组织内的其他人分享你的结果。可以使用该场景根据你在编程语言中分解出的数据创建图表和散点图。


    ## 有用的进阶内容


    当你刚开始时，这些工具可能对你并不重要，但讨论其中一些并思考之后可能有用会有帮助，可能会非常有趣。这本书可能只是你通往 AI 大师之路的起点，所以当你取得一定进展后，可以在其他时候再次参考这份清单。


    你应该继续思考非结构化数据的处理。通常，这需要更高级的项目，因为它们更难管理和控制。这类信息通常表现为极其复杂，以至于人类大脑在没有工具帮助的情况下无法进行调查，但这正是
    AI 发展的方向。利用神经网络来模拟人类思想的元素，谁能说不定未来将会怎样呢。


    随着对 AI 的研究越深，我们的数据也变得越大。AI 的潜力结果在不断增长。未来的重要信息将不再具有我们熟悉的完美结构，类似于可以放入电子表格的那种类型的数据。


    这类数据还需要更强大的计算机硬件和软件来能够处理这些海量信息。通常使用某种云计算软件来承载大量信息，以及专门用于数据分析的 `GPU`。这种高级别的计算可以帮助同时处理多个移动点。所需的数学知识也变得更加困难。算法的结合。


    ## 结论


    希望在读完这本书后，你对机器学习的基本原理有了良好的理解。你现在已经接触了几种不同类型的流行机器学习模型及其用途。我们探索了高级数据科学家如何使用机器学习来创建预测，以及他们在引入新数据时为了创建准确且可靠的预测所需要的参数。


    数据科学和机器学习的优妙之处在于其广泛的应用范围。如果你去获得机器学习的经验，那么就有广泛的工作和机会来处理各种类型的数据。无论你是否喜欢竞争和商业冲刺带来的快感，并想使用预测股票涨跌的模型，或者猜测客户下次将买什么。又也许你对医学和健康保健感兴趣；你可以应用机器学习来改进癌症诊断，并对疾病的特征以及它将如何影响不同个体获得新的见解。无论你的兴趣所在，机器学习都有机会被植入以改进我们已经能做的事情。


    世界变得越紧联系，可用数据就会越多。几乎每个人都有某种类型的智能设备在记录和追踪他们的用户数据。数据科学家正在发现更有创意的方式来学习和解释那些数据。机器学习是数据科学家检查超出人类理解范围的趋势的一种，这意味着我们的预测将继续变得更加准确，我们的数据将更有用。


    计算机只会变得越来越强大，这种力量将变得越发易获得，这意味着机器学习和数据科学将不再仅仅是术语，而是广泛应用的寻找价值信息的方法。


    '
