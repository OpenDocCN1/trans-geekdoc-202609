  trans: '

    我们大多数人会在某个随机周期间逛超市。超市是利用商品布局来促进销售的理想案例。某些超市会对自身进行分类，将相关性较高的商品放在一起。冷冻商品有自己的通道，而叶类蔬菜则有它们的位置。他们这样做有两个原因：其一是让顾客更容易找到所需的物品，其次是提升了客户体验。同样，商品布局可以帮助客户接触到那些他们会购买、但在之前进店时并未寻找的商品。


    除了将蔬菜放置在相似通道之外，超市还有另一种可以执行的方法来引导客户走向特定商品。他们可能会推断出购买特定商品的客户的特征，并利用这些特征推荐其他随机商品。例如，你可以预计在蔬菜区购买了新鲜蔬菜的人通常饮食得更健康。你可以将滑奶昔放在蔬菜区，或者放在存放新鲜水果的同一个冷柜中。如果一个客户进来寻找特种酿酒，你可以用零食诱惑他们，并注意到与
    `12 packs` 装淡啤酒所在区域相似的架子。


    ## 关联过滤


    如果你觉得这一切听起来很不错，那么你即将开始理解一种被称为“关联过滤”（community separating）的程序。这是一种通常用于网页展示的 AI
    方法。如果你的搜索信息显示你一直在阅读前往坎昆的机票通过证，你可能会开始在你的程序上看到泳衣的广告。


    展示信息的研究人员一直在试图回答这个问题：我们如何利用数据来确定如何将商品与其目标市场进行对接？这涉及到利用数据将两个互不相关的物品关联起来以驱动销售。


    这是一种根据你对客户的认知向客户提供建议的方法。AI 经常可以发现客户中我们可能未曾过搜索的相似之处或购买行为。这是智能时代开始出现的一种强大营销工具。过去，大多数广告公司需要依靠直觉来发现他们的目标市场。现在，数据研究人员可以使用定量信息来更准确地描勒理想客户的画像。如果你对在数字营销中使用
    AI 感兴趣，这是一个你应当熟悉的课题。


    关联过滤与向客户推销相似商品不同。你是根据从不同客户那里收集的信息，对客户的口味或偏好做出预测。你基于在两件商品之间发现的关系做出这种预测，然后对商品 `Y`
    与商品 `X` 一起购买的概率采取行动。你利用这些关系的评估来决定向谁展示什么。


    `Spotify` 在推荐音乐时也使用类似的循环。它利用了你一段时间以来所喜爱的所有音乐信息。如果两个艺术家之间存在联系，意味着许多人的曲库中都有这两位艺术家，那么模型就可以预测你可能喜欢另一位艺术家的概率。


    你商店里的商品越多，发现这些关系就越严谨。理想情况下，你将寻找商店里每种独特商品组合之间的关系。


    ## 先验算法


    这种发现你有多可能因为购买另一件商品而喜欢另一件商品的技术被称为 `Apriori Algorithm`（先验算法）。需要满足三个模型条件，以确认两件商品之间存在联系，并且你应该在商店里以某种方式将它们关联。


    主规则是 `support`（支持度）。它为你提供了关于特定商品流行度的估算。在你所有的交易中，这个物品出现在人们购物篮中的频率是多少？


    后续部分是两件商品之间的置信度（trust）。客户在购买 `X` 商品时购买 `Y` 商品的可能性有多大？最后，商品 `Y` 的 `lift`（提升度）是多少？最终，在
    `Y` 单独流行度的基础上，人们购买 `Y` 同时购买 `X` 的概率有多大。


    模型还可以利用购买记录、社交媒体参与度等信息，对你可能喜欢的商品类型做出预测。这使其成为 AI 而非仅仅是数据分析，因为模型是在寻找相似之处，但开发者并没有要求特定的产出。也许数据中存在某些要素或特征是软件工程师甚至没有意识到的。可能通过不受干预的
    AI，信息告诉我们这两类客户之间存在高度关联。这些关系发生在我们周围，表现为人群群体之间的相似性。偶尔，这需要一个好的计算机模型来识别。


    ## 金融


    金融业正经历 AI 使用的扩张。数据科学和 AI 模型的利用尚未充分开发。曾经单调且需要大量人工工作时间的工作，现在应该可以通过计算机在几分钟内完成。


    除了客户支持外，银行现在能够衡量和调查大量客户的合同和财务数据，这在制作信用报告和预测客户贷款违约概率方面将是一项工作。AI 程序可以查看以交易为标记的背景，然后银行再决定是否向该个人提供贷款。


    ## 垃圾邮件检测


    一个简单的 AI 工具的典型例子是垃圾邮件识别。假设我们正在利用机器学习来描述关键因素，模型将在邮件中具有某些搜索的属性。模型可能会搜索特定的短语或表达式来区分邮件是否为垃圾邮件。像“购买”或“节省”之类的词可能会在你收到垃圾邮件时让你的收件箱知情。但这种策略的问题在于，在很多情况下，这些词并不真的意味着垃圾邮件。


    '
