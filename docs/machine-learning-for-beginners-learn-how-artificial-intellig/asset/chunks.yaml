  trans: '

    你应该熟悉你的数据集，并利用直觉来思考合适的聚类数量，以及可以获得什么样的对比。在任何情况下，一旦我们面临的少数可能的聚类方式，我们的直觉和对信息的感知就没那么有用了。


    ## 降维


    当你在使用降维技术时，你正在通过压缩信息来消除不必要的元素。基本上，你是在减少数据集中因素的数量。


    当我们在模型中拥有海量因素时，我们就面临着维度问题的风险。维度问题是针对大型数据集模型特有的问题，并会影响预测的准确性。当我们拥有众多因素时，我们需要更大的群体和测试群体来构建我们的模型。有了如此多的因素，很难获得足够的信息来形成许多潜在组合，以构建一个拟合良好的模型。


    如果假设我们使用了过多的因素，我们同样可能会经历过拟合。过拟合是让信息研究人员考虑降维的根本问题。


    我们应该挑选我们不需要或多余的信息。如果我们有一个预测某人薪资的模型，我们需要一个提到他们“第一喜好”是什么的变量吗？可能不需要。我们可以将其从数据集中剔除。通常情况下，判断一个变量何时应该被删除并不那么自然。我们可以使用一些工具来确定哪些因素是不那么重要的。


    `Principal Component Analysis`（主成分分析）是一种降维策略。我们获取旧的因素排列并以某种方式将其转换为更现代的一组。我们创建的这些集合被称为主成分。在减少因素数量与保持模型精度之间存在着权衡。


    我们同样对因素的优势进行归一化。确保它们在相似的比例尺上被完全赋值，这样就不会放大某个变量的重要性。例如，假设某些因素是在 0 到 1 范围内的概率估计，而另一些因素是按超过
    100 的整数估计的。


    `Linear Discriminant`（线性判别分析）是另一种降维技术，它通过合并组件或因素，而不是完全丢弃它们。


    `Kernel Principal Component`（核主成分分析）是第三种降维策略。在这里，因素被设置为另一组。这种模型是非线性的，它将给我们比原始信息远得多的对真实边界的理解。


    # 神经网络


    ![](img/Image00017.jpg)


    神经网络是一种被称为深度学习的 AI 类型。它可能是目前 AI 最先进的策略，真正理解它的工作原理可能需要博士学位。你可以针对机器学习中最专门的模型类型撰写一整本书。


    神经网络是旨在模仿人类大脑内部连接方式的计算机框架。在你的体内，你有数以亿计的神经元，它们相互连接，并通过你的脊髓向上进入你的大脑。它们由根状枢纽连接，这些枢纽通过每个神经元传递信息，尽可能沿着链向上移动，直到到达你的大脑。


    虽然目前计算机还无法完全复制这一点，但我们提取这一规律应用于计算机神经网络，以模拟人类大脑学习的能力：即感知模式，并从新数据的揭示中推导出信息。


    归功于神经网络，我们所有的 AI 模型也是如此。数据通过神经网络被处理成数学信息。通过提供数学值，我们使它能够利用计算来做出预测。


    这与大脑中的神经元类似，信息从顶部开始向下传递，首先被隔离成枢纽。神经网络利用枢纽传递每一层。神经网络包含三个部分：输入层、隐藏层和输出层。


    在下方的图像中，我们神经网络的可视化表示，圆圈代表组织中的每个枢纽。在左侧，我们有输入层；这是数据进入的地方。数据通过输入层后，它将经过几个隐藏层。隐藏层是信息通过各种特征和功能解决一切的地方。隐藏层在信息数据集中寻找模式。隐藏层是发生“魔法”的地方，因为信息正在被模式排列，而这些模式如果我们手动排列的话很可能无法察觉到。每个枢纽都有一个权重，有助于决定正在被排列组件的含义。


    ![](img/Image00018.jpg)


    这些神经网络的最佳用途是完成一项对人类来说简单，但对计算机来说惊奇困难的任务。回顾书的开头，当我们讨论思考和归纳思维时。我们的人类大脑对于归纳思维是一个有用的资产；我们相对于现代计算机的优势是可以以惊人的速度计算海量数据。我们模仿人类推理来构建神经网络，因为我们正试图教计算机如何像人类一样“推理”。这是一项严峻的挑战。神经网络的一个真实例子就是我们提到的模型，我们将神经网络应用于对人类来说极其简单但对计算机来说极具挑战的任务中。


    神经网络可以消耗巨大的计算能力。神经网络成为测试标准的主要解释，是构建准确模型所需的数据集量。假设你需要模型来确定如何分类照片，照片之间有很多细微的差异，模型应该学会如何有效地完成这项工作。这引出了下一个问题，即神经网络正常工作所需的因素数量。


    '
