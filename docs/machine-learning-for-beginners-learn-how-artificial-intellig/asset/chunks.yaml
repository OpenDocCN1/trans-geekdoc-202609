    云创新的到来让规模较小的组织能够更容易地访问海量数据集，而不需要巨大的信息存储空间。目前，AI 已成为软件工程中的一个独特领域，在 AI 和数据科学领域投入大量时间的人已成为一个独立的领域。


    如今，关联的事物越来越多，网络也在不断变得越来越大。这意味着信息的获取途径正在扩大，而且信息源也在不断演变。事实上，甚至人们的汽车也装有电脑，这意味着当他们开车时，正在产生可以被解读的信息。到目前为止，大多数美国人携带手机网购并使用应用程序出行。人们利用手机控制家用设备，这是另一个可能的数据源。还有
    Fitbit 和智能手表，允许人们追踪自己的健康信息。


    关联的设备、电脑和手机越多，总的来说，在数据收集和思考数据方面的潜在结果就越显著。这种万物互联的状况——手机、智能汽车等——让人们担心自己可能面临丢失隐私信息的风险。他们害怕自己的安全受到威胁，有人在不断监控他们。无论如何，AI
    和数据分析让我们的生活变得简单许多。追踪正确的物品变得更容易，路线变得更简单，发现新音乐也更简单了。这一切都归功于 AI。


    ## 图像识别


    AI 用途之一是数据的排序和分类。这种排序甚至可以用于图像的特征化。网络索引利用这种算法来识别照片，而社交媒体平台目前在照片被标记之前就会使用人脸识别来区分照片中的人物。他们通过从其他照片中积累的信息获此。如果你的社交媒体账号可以识别你另一张照片中的脸，那是因为它利用来自各种不同照片的信息为你创建了模型。


    图像识别方法需要深度学习模型。深度学习模型由人工神经网络组成，我们将在本书的后部分进行更广泛的讨论。深度学习是 AI 中最复杂的一种，其中数据通过几个隐藏的节点层进行过滤。它们被称为隐藏层，是因为模型是自主的，这意味着模型识别出的特征不是由数据科学家预先挑选的。通常，这些特征是模型独立识别的设计。神经网络中识别的特征可能非常复杂，任务越复杂，模型拥有的层就越多。图像排序模型可能只有几层，而自动驾驶汽车将拥有
    1 到 200 层左右的隐藏层。


    由于计算能力可用性的提高，我们最近在这方面取得了巨大进步。想象一下，将大量数据点同时通过许多堆叠的节点所需的处理能力。随着电脑的改进和处理大量数据成本的降低，深度学习和人工神经网络在最近变得更加可行。特别是云的出现，它允许数据科学家在不使用额外物理空间的情况下访问海量数据。


    有一个名为 `ImageNet` 的网站，对于受图像特征化和神经网络启发的数据科学家来说是一个巨大的财富。ImageNet 是一个图像数据库，可以免费供 AI
    使用。其理念是，通过将其免费开放，AI 方法的发展将成为全球数据科学家的一项有益努力。


    ImageNet 的数据库在其集中包含约 1400 万张照片，有超过 21,000 个潜在的类别集合。这为数据科学家提供了一个机会，让他们访问并排序照片，以学习和探索关于神经网络的不同途径。


    每年，ImageNet 都会举办全球数据科学家竞赛，为图像特征化制作新模型。每年竞争都越来越激烈。现在他们开始转向识别视频而不是图像，这意味着所需的复杂性和处理能力水平将继续大幅发展。利用数据中的大量照片，ImageNet
    竞赛在最近几年中在图像识别方面取得了重大进展。


    如今的图像排序模型需要能够进行明确识别的技术。无论两张照片是否应该被归为同一类，它们看起来可能完全不同。你如何创建一个能够识别它们的模型呢？


    例如，取这两张不同的树的照片。如果你正在制作一个对树的照片进行分类的神经网络模型，那么你最好需要模型将它们都归类为树的照片。人类可以感知到这些都是树的照片，但照片的元素会使得用
    AI 模型对其进行分类变得极其困难。


    特征之间的差异越小，特征化就越简单。如果你所有的树的照片都看起来像左侧的图片一样，树完整呈现且每一处细节都清晰可见，那么制作模型就会简单得多。遗憾的是，这会导致过拟合，并且当模型熟悉像右侧那样的照片时，你的模型将无法对其进行正确归类。我们需要我们的模型能够对数据进行分组，即使这些数据并不容易排序。

    '
