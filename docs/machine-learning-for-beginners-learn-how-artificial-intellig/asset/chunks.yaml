  trans: '

    尽管如此，要明确告诉电脑如何区分猫科和犬科动物基本上是不可能的。在其他相等的情况下，你给电脑大量的关于猫科和犬科照片的准备信息，并告诉电脑哪些照片是猫，哪些照片是狗。最后，该模型应该有能力向你展示新的、隐藏的图片中是像猫的特征还是像狗的特征。


    明确修改的指令的问题在于它们无法发生改变。万一我使用一种具有显式指令的编程语言精确地引导电脑，那么在那个时刻，程序将能够非常出色地执行这项任务，但仅限于该项任务。当它获取新数据时它不会改变，当它执行不准确时它也不会修改其策略。


    一段时间后，AI 模型实际上会随着信息的变化而想要改变自己，以便在不断变化的环境中调整并保持准确。这提供了一个巨大的优势，因为它让我们的模型更具灵活性以适应变化，而变化正不断发生在我们周围。没有人工智能和人工推理，我们的电脑将没有跟上的方法。


    # 什么是人工智能？


    20 世纪 50 年代，不同的科学家开始培养主要的机器推理机器。在此之前，人工推理领域仅进行过少量的测试；特别是在下一次世界大战期间的破译工作中。这是一个新兴领域，最初只有少数几个小组知道它的潜力。


    目前，人工智能被应用于许多领域的各种用途中，包括批判性思维、学习、安排、思考和逻辑。它使电脑能够执行通常需要人类直觉才能完成的任务。为了“采取类似于人类的心态”，电脑需要它们可以从中学习的信息。


    计算机推理在人们心中占据着近乎传奇的地位。我敢打赌，如果你对大多数人说“人工智能”这个词，他们脑中会出现机器人走动表现得像人的图像。这种对人工意识的科幻化让人们在听到这个术语时保持警惕。尽管如此，它并没有像听起来那么可怕。它在医学、商业、交通和通信领域取得了巨大的进步。尽管在该领域已经取得了惊人的进步，但对有意识电脑的误解仍然遥不可及。总而言之，自动驾驶汽车、电脑以及会说话的手机出现融合了想象力。


    ## 日常中的 AI


    尽管这听起来更像是科幻电影里的东西，人工智能现在已经大量存在于我们的生活中。如果你从一开始就觉得它听起来很诡异，让我帮你回顾一下人工推理近期为我们的生活带来的所有创新。


    每当你打开 Netflix 时，你都在阅读一份列表，它列出了你看过的节目和重过的电影。它将该列表转换为信息并生成了另一份建议列表。根据你实际上喜欢的电影，它预测了你可能会喜欢的电影。这是由
    AI 完成的，它是人工智能的一个子集。


    如果你有一部手机，你可以使用语音指令来手动搜索东西。你告诉手机你正在寻找当地的餐厅，手机会说：“正在寻找你当地的餐厅。”在几秒钟内，结果列表就出现了，你不需要输入任何内容。它识别了你的声音并理解了你说的话。这是自然语言处理的一部分，AI
    的另一个子集。每当你打开邮箱发现你的邮件里有垃圾邮件时；你的电子邮件系统正在学习如何更好地识别垃圾邮件。这是另一种 AI。


    与此类似，人工智能并不真的像我们可能想象的那样，拥有需要接管一切事物的机器人。目前，它比那友好得多。它同样具有强大的支持性，并且能够学习我们无法明确编程它去执行的事情。


    ## 归纳推理与学习


    人工智能需要许多人称为“模拟思维”的东西，也称为机器思维。当人们学习新事物并得出结论时，我们经历了一种被称为“归纳推理”的互动。我们获取数据片段来得出新的结论。通常，并没有我们被要求遵循的既定标准。我们通过直觉获得知识并得出我们自己的准则。例如，我可以告诉你去年
    12 月下了好几次雪。据此，今年 12 月还会下雪。一月总是冷的，所以今年一月也会很冷。因此，我应该带件外套。


    我们出生时并不是天生就知道每年 12 月都会下雪，或者一月是很冷的。我们通过经验吸收了这些内容，并利用归纳推理对未来的十二月和一月做出推测。根据我们的归纳推理，我们做出了明智的选择，提前做好计划并在明年冬天带上外套。


    我们在 12 月看到雪、一月感到寒冷的经历就是我们的“信息”。这些是我们从当前处境不断获取的贡献。


    人们的思考方式与机器不同，因为我们不理解数学数据模型。我们从好奖和坏惩以及我们在日常生活中体验到的情感中获益。让电脑使用归纳推理将使我们接近拥有“类人机器”。


    与此类似，为了让电脑学习，它们需要可以从中学习的信息。大部分信息应该是数学的，目标是使其被数值模型和计算所解读。如果我们给电脑足够的信息，它将建立边界来规划自己的模型或计算，根据相关知识预测新情况。这就是
    AI 的前提。给电脑提供经验，以便它能通过归纳推理在未来预测新的结果。


    ## 数据的力量


    人工智能特别有趣，因为电脑现在在某些任务上比人更出色。它们可以在几秒钟内对包含大量特征的数据集得出数值推理。地球上没有人类能如此快速地处理那样的数据。如果我们能利用
    AI 分析来自包含 100 个因素的复杂数据集的信息，我们可能可以发现物理上极其复杂且难以识别的模式和示例。这就是电脑成为特别有价值工具的原因，也是为什么它们帮助在数据科学领域取得了巨大进步。利用电脑进行数据分析使得发现你不知道存在或可能没有想到的模式和相似之处变得更加简单。


    在某些任务中，电脑的表现并不理想。这些任务对我们来说似乎非常简单，比如区分猫图像和狗图像之间的差异。然而，对于电脑来说，分类这些内容异常困难。这正是计算机推理面临的挑战所在。

