    虽然我们将会处理支持向量（piece support vectors），但随后它们被用于对那些无法用直线划分的类别进行排序。划分线可以采取许多形状（直接、非线性、多项式、螺旋前提、sigmoid
    形式）。


    回顾一下我们刚刚讨论的基于直线边界的分组，其排列方式类似于附图：


    ![](img/Image00014.jpg)


    在这张图中，我们的信息可以用一条直线来表征，将两个明显的分类信息隔离开。如果信息能够像这样一致地划分，那将非常有利；但遗憾的是，事实通常并不那么平滑和干净，很多时候你应该将信息隔离成像这样的样子：


    ![](img/Image00015.jpg)


    在这个模型中，信息无法通过直接边界线进行隔离。因此，考虑到这些，我们应该使用一种被称为“部分划分”（portion stunt）的程序。它利用信息焦点之间的相似比例来对它们进行特征描述。


    ## 朴叶贝斯 (Naïve Bayes)


    回顾监督学习主要章节提到的贝叶斯假设。在朴叶贝斯模型中，指示器被认为是独立的。该模型在使用并不困难，并且适用于海量数据集。它经常用于帮助分类垃圾邮件。


    我们在这里使用了贝叶斯标准公式。贝叶斯定理的可能性在于，通过在我们已知的知识中添加新的重要数据，我们可以根据这些新数据更新我们的见解。假设我们需要知道今晚下雨的概率，我们可以简单地统计每年下雨的天数。然而，在那个时候，我们发现下雨发生在今天凌晨。你认为这将如何影响今晚下雨的概率？


    沿着这些思路，当我们获得更多关于事件的数据时，我们预测某事发生概率的能力将进一步提高。在数值上，贝叶斯假设如下：


    ![](img/Image00016.gif)


    通过这种方式，我们可以利用贝叶斯假设对新的信息焦点进行分组。函数的作用在于，当我们给定另一个信息点时，根据该信息点的组成部分，确定该信息点落在某一分类的概率。


    # 无监督学习


    无监督机器学习利用未标记的信息。数据研究人员对结果一无所知。计算应该自动发现模式，而这些示例将是模糊的。在结构通常不显眼的地方发现模式。计算会自动发现数据分段。模型在一堆通常是未标记且不可识别的信息中搜索示例和模式。无监督学习允许我们发现那些没有计算机研究人员无法察觉的模式。有时，海量数据包含示例，试图筛选其中的每一个细节来寻找模式是非常的。


    这对于观察购买者的购买意愿很有用，你可以根据他们行为中的模式将客户归组成不同的类别。模型可能会发现市场不同子集之间购买行为的相似之处，但如果你没有模型来过滤这些庞杂且混乱的信息，你永远无法理解这些示例的概念。无监督学习的优势在于，能够在海量数据中找到那些在没有模型帮助的情况下无法识别的示例或特质。


    无监督学习的一个真实例子是位置欺诈检测。欺诈对于金融机构来说可能是一个大问题，由于大量的日常客户，如果没有 AI 工具的帮助，机构很难识别欺诈。模型可以学会如何识别欺诈，因为策略会随着技术的进步而变化。假设你需要管理新的、未知的欺诈手段，那么此时你应该使用一个能够在特定条件下识别欺诈的模型。


    由于识别欺诈，拥有更多信息是明智的。欺诈识别服务应该使用一系列 AI 模型，以便成功反击欺诈。同时使用监督模型和无监督模型。据估计，到明年（2020 年），每年的虚假万事达交易将达到
    320 亿美元。欺诈识别模型将（万事达交易）分类为真实或虚假。


    它们可以根据时段或购买区域等因素进行排序。如果一个发货人通常进行 20 美元左右的交易，突然来自一个异常地区有一笔 8000 美元的交易，那么，模型极有可能将这笔交易标记为欺诈。


    使用 AI 进行欺诈检测的测试在于，大多数交易并不是虚假的。如果在非假交易中即使存在大量的欺诈交易，那么信用卡行业将变成一个不可行的行业。欺诈卡交易的程度很小，不足以让模型产生此类偏。。来自异常地区的
    8000 美元订单虽然可疑，但它更有可能是持卡人的旅行而非虚假交易。无监督学习使得识别可疑购买行为变得更容易，例如奇怪的运输区域和客户调查中的异常跳转。


    ## 聚类 (Clustering)


    聚类是无监督学习的一个分支。分组是将相似事物聚集在一起的任务。当我们使用分组时，我们可以识别属性并根据这些属性对信息进行排序。如果我们使用 AI 进行营销，聚类可以帮助我们识别客户和潜在客户群体中的相似之处。无监督学习可以帮助我们将客户归分为我们在没有
    AI 帮助的情况下可能无法做分类。当你处理许多因素时，它也可以帮助你对信息排序。


    ## K-Means 聚类


    K-Means 聚类的工作原理与 K 近邻相似。你选择一个数字来决定你需要看到的簇数量。你继续进行分组和重新计算，直到簇变得更加清晰有序。


    你的信息围绕质心（centroids）聚集，质心是你在图上选择的、用于将信息分组的中心。你随机选择它们，并且你有 k 个。当你将信息与模型关联时，信息点被归类到最近质心的分类中，通过欧几里距离进行计算。然后，你计算包含每个质心的所有信息点的平均值。重复这种交互，直到你的结果保持非常相似，并得到了预测的簇。每个信息点只允许属于一个簇。

