    ## K 最近邻


    K-最近邻可能是数据特征化中最清晰且应用广泛的技术。它是一种用于分类和回归的监督学习类型，也是最基础的分类算法。基本上，它涉及到获取一个信息点并将其与散点图中最已知且最近的聚集在一起。


