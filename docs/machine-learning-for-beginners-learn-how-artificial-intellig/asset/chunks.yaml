    假设你有几场即将到的相关考试需要复习。你可以记住你认为会在考试中出现的每一个方程式，并期望在考试当天当天，你实际上只想简单地将新数据连接到你已经有效保留的内容中。或者，你可以更深入地专注；弄清楚每道配方是如何运作的，目标是在任何情况、条件变化时都能交付出色的结果。过拟合的模型就像是背下了考试的配方。如果新信息相似，它会表现得非常出色；但当出现多样性时，它将无法如何调整。通常情况下，如果你的模型在准备信息上表现良好，但在测试信息上表现不佳，你就可以判断你的模型是否过拟合了。


    当我们检查模型的表现时，可以利用损失估值（loss value）来量化。


    损失估值是模型的预测值与真实值之间的差异。


    神经网络的困难之一是，完全无法确定显式输入与输出之间的关系。隐藏层之所以被称为隐藏层，是因为它们太复杂了，以至于很难考虑去解释或弄懂。


    最简化的神经网络被称为感知机（perceptron）。它的简单性来自于它只有一层信息通过的层。信息层连接到一个排列隐藏层，随后的预测是二分类。每当我们提到一种表征方法是成对的时，这意味着它只是在由
    `0` 和 `1` 的两个独特类别之间进行分类。


    感知机由弗兰克·罗森布特（Frank Rosenblatt）首次发明。如果你想学习神经网络，熟悉感知机是一个明智的想法。感知机与其他神经网络模型使用类似的交互，但通常你将处理更多的层和更多的潜在输出。当获取信息时，感知机会会将输入与其赋予的权重相乘。然后，这些特征权重之和连接到激活函数。激活函数在最后告诉信息它属于哪一类，从而预测输出。


    如果你碰巧在图表上查看感知机，它的线看起来像这样：


    ![](img/Image00019.gif)![](img/Image00020.gif)


    判别图的线看起来像一个阶段，有两个属性，分别在 `1` 的一侧或另一侧。轨迹线的不同侧是模型根据信息源将预测的各种类别。正如你从图中看到的，它有点粗糙，因为类别之间的线之间几乎没有区别。事实上，某些信息变量的微小变化也会导致预测输出变为另一个类别。它不会在你用于准备的第一个数据集之外保持一致，因为它是一项阶段性工作。


    感知机的替代方案是一种称为 sigmoid 神经元（sigmoid neuron）的模型。使用 sigmoid 神经元的规则优势是它不是二分类的。与可以将信息分分为两个类别的感知机不同，sigmoid
    产生的是概率而不是排列。下面的图片显示了 sigmoid 神经元的弯曲


    ![](img/Image00021.gif)


    注意 `one` 附近的弯曲状态，那里信息像感知机那样被分类；轨迹使得很难仅通过极小的差异对信息进行分类。使用 sigmoid 神经元，信息是由其落在给定类的概率预测的。正如所示，线在
    `one` 处弯曲，这意味着信息点落在给定类别的概率在 `one` 之后增加，但它仅仅是一个概率。


    # 强化学习


    ![](img/Image00022.jpg)


    强化学习是我们的第三种 AI。与无监督学习一样，它没有提供信息源。强化学习模型应该自己找到如何做到最好。然后，数据人员根据模型预测结果的能力提出进一步改进模型的建议，这种能力通过观察预期与真实值之间的差异来评估。这是最具革命性的
    AI 类型，AI 的很大一部分将来将在这里完成。


    把它想象成玩游戏；从长期来看，你通过赢和输来学习。你通过玩来弄清楚如何赢，你对游戏越熟悉，就越理解获胜的机制。一段时间后，数据人员在模型收集和循环信息时给模型提供反馈。它接收一个奖励信号，这样它知道自己何时工作有效或预测了某些结果。因此，“主宰”比赛给计算提供了正向反馈。这种
    AI 被用于游戏、机器人、路径规划和自动驾驶汽车。


    ## Q 学习


    在 Q 学习中，模型与其当前环境交互以完善自己。你从有一组状态开始。状态是环境中的在你当前情境中作为障碍和道路存在的物体。被称为 `S`。在象棋中，它将是你所有棋子可以移动的方式，就像你对手所有棋子的位置。这些都是状态。


    潜在的移动被称为 `A`。如果你是一个兵兵，你的潜在移动是向前移动一格。如果你是一车车，你的潜在移动是按顺序向任何路径移动。`Q` 是模型的值，从 `0`
    开始。随着你玩游戏，`Q` 完全取决于它与环境的交互。随着负面交互，分数 `Q` 下降。随着正向关联，分数 `Q` 上升。计算找出如何移动以便增加数字 `Q`。起初，它是随机的。一段时间后，这些随机发展为
    `Q` 带来确定和负面影响，机器弄清楚每次移动对 `Q` 分数的意义。


    ## SARSA 动作奖励状态


    SARSA 与 Q 之间只有微小的区别。它们也都用于给模型提供奖励反馈。

