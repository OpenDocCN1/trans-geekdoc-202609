    在演示中，我们提到信息科学领域最常用的语言是 `Python`、`R` 和 `C++`。选择哪种最适合你将取决于你的经验以及你希望如何管理信息。


    ## Python


    `Python` 是信息科学领域最广受认可的语言。它由 `Guido Van Rossum` 于 1991 年创建，其引人注目之处在于比其他编程语言更容易阅读。如今，它仍在被创建和进一步开发。学习它并不晦涩，并且适用于大多数相关信息类型。它在简单信息控制之外也有应用，这些应用在
    AI 领域将非常有价值。


    `Python` 有几个可以引入的免费扩展包，这些包旨在为你提供常规信息科学工具的替代方案。这些包为 AI 中常用的代码提供了不同的实现方式，这使得你需要的工作更少。


    ### Python 库


    - `Pandas` 是使用 `python` 的信息研究人员必不可少的工具库。它允许你更加从容地控制时间序列数据和普通数据集。它以行和列的形式显示你的信息，使其更容易管理，就像你在
    `Microsoft Excel` 中查看数据一样。它在网上很容易找到并允许下载。当你查看 `CSV` 设计的数据时，`Pandas` 非常有用。

    - `Numpy` 是一个利用 `python` 加快数据处理的实用程序。它的工作原理类似于 `Matlab`，可以处理网格和多维数据。它将帮助你更轻松地导入大型数据集。

    - `Scikit-learn` 是另一个 AI 工作库。通过 `Scikit learn`，你将轻松访问我们之前提到的许多通常用于 AI 的算法。诸如分类、回归、聚类、支持向量、随机森林和
    `k-means` 等算法都有简单的快捷径，因此已经替你完成了大部分繁琐的编码工作。


    ## R


    `R` 是第三个选择。它是免费且开源的。`R` 可用于数据挖掘和 AI。它因其易用性而在信息科学初学者中非常有名。虽然它无法处理高级 AI 任务所需的大型数据集，但如果你是信息科学和计算机编程的新手，它绝对不是一个糟糕的起点。


    ## 硬件要求


    为了运行这些项目，你需要一台 `PC`。通常情况下，标准的 `PC` 或个人电脑就足以衡量中等规模的数据集，特别是当你刚接触 AI 领域时。


    ### GPUs


    尽管 `GPUs`（图形处理单元）已经存在相当了，但它们的可用性最近得到了扩展，这使得信息科学变得更加开放。这是信息科学领域的一次飞跃，因为该领域目前不再局限于拥有大型电脑的实验室。


    `GPUs` 以作为电脑游戏背后的力量而闻名。它们允许 PC 无延迟地解释不同的目标，这对于准备海量数据至关重要。现在 `GPUs` 允许我们用更少的计算设备完成更多的工作。相比之下，`CPU`
    拥有许多控制单元，允许数据同时进行处理。与其拥有许多控制单元相比，`GPU` 拥有大得的核心，这些核心可以同时处理各种循环。一张 `GPU` 卡可以包含接近
    5000 个处理器。这对人工智能和 AI 来说是一项重大进展。它们可以帮助让神经网络的处理变得快得多。


    ## C 和 C++


    `C` 和 `C++` 是其他常用的信息科学语言。`C++` 的优势在于它是一种极其强大的语言。它可以快速地处理巨大的数据索引。使用大型数据集的信息研究人员经常因为其速度和处理能力而选择
    `C++`，特别是在处理超过 TB 级的数据集时。`C++` 大约在一秒内处理一个 GB 的数据。这对于深度学习算法、具有 5-10 层的神经网络模型以及海量数据集特别有用。这种模型对于速度不够快的编程来说可能过载。如果你正在进行高级
    AI 开发并且有多个 `GPUs`，那么 `C++` 可能是最适合你的语言。`C++` 可以做任何事情；它是一种极其灵活的语言。


    缺点是 `C++` 的库没有 `Python` 那么广泛。这意味着当你为你的信息和模型编写代码时，可能没有任何准备工作就开始了。无论你选择做什么项目，在编写代码时都会遇到障碍。拥有在你卡住时能帮助你的库将使你学习和工作得更快。


    # 开发模型


    ![](img/Image0026.jpg)


    开始 Python 的另一种选择是引入 Anaconda。`Anaconda` 的奇妙之处在于它提供了每个 Python 扩展包，因此在编写程序时不需要一个个引入包。它包含了你需要的每一个库，适用于几乎每种特殊的功能。


    ### Anaconda 环境


    大多数 Python 用户将从一个名为 `IDLE` 的改进环境开始。它实际上非常简单，并为学习如何编写 `python` 代码提供了一个良好的配置。当你在
    Windows PC 上安装 Python 时，它会自带。如果你有一台 Linux PC，它可以使用，但你需要独立安装。


    `Anaconda` 在数据集方面非常有名，它会让你的编码更简单更快速，特别是当你仍在尝试弄懂事情时。


    重要的库之一是 `Spyder` 和 `Jupyter`。这两者都是集成开发环境，这意味着它们是你编写代码的窗口，但它们比标准的命令行窗口高级，并具有保存和导出/导入代码的选择。

