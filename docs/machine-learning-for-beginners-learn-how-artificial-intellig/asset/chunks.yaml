  trans: "\n\n![](img/Image00027.jpg)\n\n# 初学者机器学习指南\n\n## 通过真实示例了解人工智能、数据科学和神经网络的工作原理，并进一步学习统计学和编程知识\n\
    \n### Cyrus Samuel：目录 引言\n- 本书的目的\n- 什么是人工智能？\n- 机器学习是如何使用的？\n- 数据分析的最新进展\n- 统计学导论\n\
    - 为机器学习选择合适的模型 监督学习\n  - 分类\n  - 无监督学习\n  - 神经网络\n  - 强化学习\n  - 集成建模\n- 机器学习编程必须掌握的知识\
    \ 工具 开发模型\n- 结语\n\n# 引言\n\n恭喜你购买了《初学者机器学习指南》，感谢你的支持。\n\n机器学习领域正在开启许多机会。它正被几乎每个主要行业作为一种工具所采用。无论你对医疗保健、商业金融、农业、清洁能源以及许多其他领域感兴趣，都有人正在利用机器学习的力量让自己的工作变得更轻松。\n\
    \n对于这些行业来说遗憾的是，但对你来说幸运的是，数据科学和人工智能领域的人才严重短缺。虽然初级数据科学工作仍然竞争激烈，但能够胜任高层职位的经验丰富的数据专家非常匮乏。这是计算机科学中一个较新的领域，由一群年轻人构成了该领域的大部分。\n\
    \n如果你能获得一份数据科学的工作，财务回报可能会非常丰厚。2016 年，数据科学家的平均年薪约为 `$111,000`，并预计在未来五年内将增长。在该领域工作的数据科学家中，约有一半拥有\
    \ `Ph.D.`。虽然这不是必要条件，但如果你考虑开始从事数据科学的职业，这是一个值得考虑的因素。\n\n如果你希望将机器学习加入你的技能领域，以便以后对其有更好的理解并将其应用到自己的业务或项目中，那么可能不需要\
    \ `Ph.D.`。但对于那些想要进入该领域的人来说，建议接受高等教育，因为这将帮助你在领域中脱颖而出。\n\nIndeed.com 在 2019 年将机器学习称为最佳职业，这显而易见。凭借对优秀数据科学家的巨大需求和丰厚的回报，它值得一看。随着连接性的增强以及消费者和公司互联网使用率达到前未有的水平，大数据似乎短期内不会消失。数据是我们现代世界的一部分，随着数据复杂性和规模的增加，将需要更专业的知识和技能才能完成手头的任务。\n\
    \n为了补充书中的知识，我强烈建议进一步寻求统计学和编程方面的知识。进行机器学习的任何工作都需要良好的统计学知识基础，因为统计数学为数据科学家在机器学习中使用的所有模型和算法提供了结构和理论依据。\n\
    \n# 本书的目的\n\n本书并不旨在提供关于 `AI` 的详尽读物材料。综合考虑，它将为你提供一些基础信息，以便你继续对 `AI` 和人工推理进行研究。为了继续你的研究并精通该学科，还需要完成大量的思考。我们将检查\
    \ `AI` 模型的整体设计和关联、常用术语以及核心的事实概念。\n\n*（注：提供的文本在源材料中包含几个重复和乱码的段落，用于说明本书的目的。我已根据指令保留了核心引言信息和结构流。）*\n\
    \n"
