- raw: 'Now that you know the basic theory of machine learning, it''s time for you
    to keep going and find ways to apply and practice the knowledge. If you are interested
    in being a data scientist that specializes in machine learning, this book is only
    the beginning of the process. I highly recommend you commit yourself to learn
    a language like Python, R, or C++. It’s the next step in becoming a data scientist,
    and in applying these machine learning theories to actual models and algorithms.
    Thanks to the internet, there is a vast number of books, videos, and tutorials
    available for free that will take you through the process of learning computer
    languages. There has never been a better time to learn how to code and create
    your own models. This book is only a small piece of a large collection of information
    available on the subject. If you’re serious about machine learning, then this
    shouldn’t be the only book you read.


    You can find entire books describing the process of specific models. Neural networks
    are a field that is so advanced that you could find entire books based on that
    specific type of model alone. It''s not a bad idea to pick up a few statistics
    study guides so that you can refer to them when you have a question. Be on the
    lookout for possible sources of data that you might be able to utilize, and potential
    questions that may be interesting to explore with statistical mathematics.


    The job opportunities alone are enough reason to pursue further knowledge in the
    field. There is a shortage of experienced data scientists who can apply the methods
    and techniques listed in this book. This means there is an opportunity for someone
    who will get their hands dirty and start coding their own models. There are businesses
    and organizations out there, right now, searching for people who can use this
    information properly. Keep in mind that this demand won''t exist forever. Already,
    universities across the globe are creating new degree programs specifically geared
    towards data science as a blend of computer science and statistics. This means
    that the next generation of data scientists is already on their way.


    So, begin your learning now. Find an online tutorial and some free datasets online
    and start figuring out how to regress and classify, using this book as a guide.
    Learn each model one at a time. Find examples on the internet of finished models
    and try to see if you can replicate the results. It takes time to learn programming
    languages, so be patient and seek out new opportunities to learn and adapt your
    skills.


    Try one of the online communities specific to statistical modeling to cut your
    teeth and learn from what other data scientists are doing. I advise you to check
    out Kaggle.com. It’s a website that hosts statistical modeling competitions for
    aspiring data scientists. Different companies and organizations post contests
    with the datasets included. It''s a great way to experiment with a variety of
    tasks and get data to work with. Old contests are also available online, with
    a large number of associated tutorials on youtube.com and other data science communities
    for you to learn from. It''s probably the best way for an aspiring data scientist
    to expand his/her resume and network with other data scientists.'
  fmt: '

    Now that you know the basic theory of machine learning, it''s time for you to
    keep going and find ways to apply and practice the knowledge. If you are interested
    in being a data scientist that specializes in machine learning, this book is only
    the beginning of the process. I highly recommend you commit yourself to learn
    a language like `Python`, `R`, or `C++`. It’s the next step in becoming a data
    scientist, and in applying these machine learning theories to actual models and
    algorithms.


    Thanks to the internet, there is a vast number of books, videos, and tutorials
    available for free that will take you through the process of learning computer
    languages. There has never been a better time to learn how to code and create
    your own models. This book is only a small piece of a large collection of information
    available on the subject. If you’re serious about machine learning, then this
    shouldn’t be the only book you read.


    ### Expanding Your Knowledge

    You can find entire books describing the process of specific models. Neural networks
    are a field that is so advanced that you could find entire books based on that
    specific type of model alone. It''s not a bad idea to pick up a few statistics
    study guides so that you can refer to them when you have a question. Be on the
    lookout for possible sources of data that you might be able to utilize, and potential
    questions that may be interesting to explore with statistical mathematics.


    ### Career Opportunities

    The job opportunities alone are enough reason to pursue further knowledge in the
    field. There is a shortage of experienced data scientists who can apply the methods
    and techniques listed in this book. This means there is an opportunity for someone
    who will get their hands dirty and start coding their own models. There are businesses
    and organizations out there, right now, searching for people who can use this
    information properly. Keep in mind that this demand won''t exist forever. Already,
    universities across the globe are creating new degree programs specifically geared
    towards data science as a blend of computer science and statistics. This means
    that the next generation of data scientists is already on their way.


    ### How to Start

    So, begin your learning now. Find an online tutorial and some free datasets online
    and start figuring out how to regress and classify, using this book as a guide.
    Learn each model one at a time. Find examples on the internet of finished models
    and try to see if you can replicate the results. It takes time to learn programming
    languages, so be patient and seek out new opportunities to learn and adapt your
    skills.


    ### Community and Practice

    Try one of the online communities specific to statistical modeling to cut your
    teeth and learn from what other data scientists are doing. I advise you to check
    out `Kaggle.com`. It’s a website that hosts statistical modeling competitions
    for aspiring data scientists. Different companies and organizations post contests
    with the datasets included. It''s a great way to experiment with a variety of
    tasks and get data to work with. Old contests are also available online, with
    a large number of associated tutorials on `youtube.com` and other data science
    communities for you to learn from. It''s probably the best way for an aspiring
    data scientist to expand his/her resume and network with other data scientists.

    '
  trans: '

    既然你已经掌握了机器学习的基础理论，现在是时候继续前进，寻找应用和实践知识的方法了。如果你兴趣成为一名专精机器学习的数据科学家，那么这本书仅仅是过程的开始。我强烈建议你投入精力学习如
    `Python`、`R` 或 `C++` 等语言。这是成为数据科学家的下一步，也是将这些机器学习理论应用于实际模型和算法的关键一步。


    得益于互联网，有大量的免费书籍、视频和教程供你选择，它们将引导你完成学习语言的过程。现在是学习编程和创建自己模型的最佳时机，没有之一。这本书只是该领域海量信息中的一小部分。如果你对机器学习认真的，那么这不应该是你阅读的唯一书籍。


    ### 扩展你的知识

    你可以找到描述特定模型过程的完整书籍。神经网络是一个如此的领域，以至于仅仅这种特定类型的模型就能找到整本书。准备几本统计学学习指南也是不坏主意，这样你在遇到问题时可以查阅。留意你可能利用的潜在数据来源，以及可能通过统计数学进行探索的潜在问题。


    ### 职业机会

    仅仅是就业机会就足以成为在该领域追求进一步知识的理由。目前缺乏能够应用本书中所列方法和技术的经验丰富的数据科学家。这意味着，对于那些愿意实干并开始编写自己自己模型的人来说，存在机会。现在就有许多企业和组织正在寻找能够正确使用这些信息的人。请记住，这种需求不会永远存在。全球各地的大学已经在创建专门针对数据科学的新学位课程，将其视为计算机科学与统计学的结合。这意味着下一代数据科学家已经在路上了。


    ### 如何开始

    所以，现在就开始你的学习吧。找一个在线教程和一些免费数据集，并以本书为指南，开始研究如何进行回归和分类。一次学习一个模型。在互联网上寻找已完成模型的示例，尝试看看是否可以复制这些结果。学习编程语言需要时间，请保持耐心，并寻找新机会来学习和适应你的技能。


    ### 社区与实践

    尝试加入针对统计建模的在线社区来磨练自己并从其他数据科学家的实践中学习。我建议你查看 `Kaggle.com`。这是一个为有抱负的数据科学家举办统计建模竞赛的网站。不同的公司和组织会发布包含数据集的比赛。这是尝试各种任务并获取可用数据的绝佳方式。网上还可以找到旧的比赛，并在
    `youtube.com` 以及其他数据科学社区上有大量相关的教程供你学习。这可能是一个有抱负的数据科学家来说，扩展简历和与其他数据科学家建立人脉的最佳方式。

    '
