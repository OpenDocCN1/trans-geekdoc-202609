    ## 逻辑回归/分类


    这种策略用于特征化因变量和全量因素。逻辑回归的概率依赖于自变量。它赋予因素“是”或“否”的值来对其排序。通常用于成对分类。


    当你无法通过直接边界将信息划分为若干类时（如上面的模型所示），这就是你应该使用的技术。它可能是最著名的 AI 计算算法之一。它不仅将结果分类，还向我们展示了类别存在的概率。


    我们通过取概率函数来实现此模型，其中 `p` 是事件发生的概率；


    ![](img/Image00011.gif)此外，建立一个名为 `logit` 的方程


