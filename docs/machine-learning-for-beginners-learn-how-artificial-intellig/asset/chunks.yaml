    分类模型将向我们展示某个属于哪种分类。这些分类由软件工程师在开始定义。一个可以使用随机森林的特征化模型示例是：判断传入垃圾邮件应该进入你的“收件箱”还是“垃圾邮件”封包。


    为了构建模型，我们创建了我们的 `Y` 可能属于两个分类：`spam`（垃圾邮件）和非垃圾邮件。我们编写模型来搜索可能表明垃圾邮件的关键词或特定的电子邮件地址。“购买”或“优惠”等词汇的存在将帮助模型判断邮件是否属于垃圾邮件类或非垃圾邮件类。计算接收信息，从长远来看，它通过对比其预测结果与结果的真实值进行学习。从长远来看，它对模型进行微小的调整，因此计算在长期运行中变得更加有效。


    # 分类


    在本书的多次中，我们提到了特征化模型。虽然我们有效引用的一部分模型适用于特征化，但接下来将是更复杂的学习模型，它们被显式用于分类。


    该配置需要标记信息并做出非一致的预测。在特征化问题中，图表是非线性的。特征化问题可能有两个类，或者更多。特征化模型可能是 AI 和数据科学中应用最广泛的部分。


    排序的主要类型是二分类。通过二分类，信息被特征化为两个分类，并用 `1` 或 `0` 表示。我们称之为二分类，是因为只有两个潜在的分类，而我们的所有信息都属于其中之一。


    然而，在某些情况下我们多个类，为此我们使用多分类排序模型。同样，我们还有直接选择边界，其中信息被隔离在边界的一侧或另一侧。并不是所有信息都能被归类到选择边界的一侧。


    主图展示了一个使用直接选择边界的排序示例。在接下来的图片中，几乎有两个类，但它们不是可以直接划分的。在第三幅图中，信息焦点是混合的，直线边界特征化是荒谬的。根据你使用的信息类型，有不同的模型决策会适用于不同的任务。


