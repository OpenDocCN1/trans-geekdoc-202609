  xxx\")}[/**end-code]**\n\n# 案例研究 - 健康丰收园艺者与区块链革命 # 让我们通过社区园艺者用农产品交换加密货币的视角，来看看我们学到的区块链知识。Liam\
  \ 是当地社区园艺小组 Wholesome Bounty Gardeners 的成员，成员之间互相交易农产品。他创建了名为 `WBG Blockchain` 区块币的交易，被称为“花园币”。区块链如何提供帮助？他知道需要存储不可篡的交易数据，防止被黑客更改硬币数量，链引用之前的标识符，一旦创建就无法更改，称为不可篡改账本。他不想只在自己的电脑上运行，因此将其写入多台计算机，实现去中心化控制，节点点对点无需权威。那么，他为什么没有权限呢？所有账户都在区块链上，去信任的设计显示了生成的私钥对接收公钥，对等发送、分发、私用查看、发送链接。`PrivateKeyExample`\
  \ 示例看起来像 [8efe77fc...bcbce][有人猜到重复密钥是不可能的，因为空间大小与沙子和原子相比]\n\n\n\n*   *在已知、可观测的宇宙中，原子数量估计在\
  \ 1 × 10⁷⁸ 到 1 × 10⁸³ 之间。*\n\n因此，私钥组合的数量远多于沙粒、星星以及整个宇宙中的原子总和。这意味着私钥组合极其庞大；要复制或猜测它们几乎是不可能的。\n\
  \n**So**，猜测他人的 **private**（密钥）也几乎是不可能，**但如果有人丢失了自己的 private key 呢？**\n\nLiam 意识到因为\
  \ **private** 钥匙一旦丢失就无法恢复，**于是向 WBG（Wholesome Bounty Gardeners）社区通报了保护自己 **private\
  \ keys** 的若干方法。**第一步**，他告诉大家除了他的 _Private_ 键外，*还会有一个由十二词秘密种子短语（*seed phrase*）生成该\
  \ Private Key*，这样他们*（them）*比记住 *(his)* [the] 私有键更容易记忆单词。（Members could commit this\
  \ Seed Phrase **(seed-phrase)** to memory so they will not lose access **[their]**\
