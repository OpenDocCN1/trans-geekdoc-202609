  \n![](img/image00164.jpeg)![](img/image00152.jpeg) 第 6 章\n\n# 构建你的加密货币防御\n\n## 核心要点\n\
  \n*加密货币诈骗逐年增加。你必须保持警惕并采取安全措施，以确保你的加密资产安全。你有许多方法可以保护你的加密资产。采取对你有效的方法。记住，一旦黑客盗走了你的加密货币，它就彻底消失了。*\n\
  \n## 加密货币诈骗正在增加\n\n加密货币诈骗每年增长十倍以上。投资者投入加密市场的资金越多，对诈骗者和欺诈者的吸引力越大。\n\n人们每天都在加密市场上亏钱。遗憾的是，新投资者很容易通过诈骗、糟糕的投资和黑客攻击损失大量资金。加密投资者知道这些诈骗是为了吸引你的兴趣并偷取你的加密资产。遗憾的是，这些诈骗变得越来越具有吸引力和说服力，看起来类似于合法的报价和投资。\n\
  \n这些诈骗类似于银行账户和信用卡诈骗。主要的区别在于加密货币诈骗使用了计算机编程、互联网通信和黑客技术。此外，犯罪者很难被抓住，因为加密货币无国，可以从世界上任何地方访问。所以，祝你好运让执法部门看到回加密资产。\n\
  \n本章将为你简要概述最常见的加密货币诈骗。在我们开始之前，让我直说吧：没有办法可以判断一个加密代币、区块链、加密交易所或其他类型的加密货币相关产品是否完全合规。你所做的最多就是寻找迹象，证明广告中的加密货币或区块链投资确实如其描述。\n\
  \n## 虚假加密交易所\n\n虚假加密交易所提供与合法交易所类似的服务。区别在于，欺诈交易所针对特定的加密代币。虚假交易所运营者的目标是在关闭交易所并消失之前，收集尽可能多的加密代币私钥。\n\
  \n当你无法将加密代币移动到另一个地址、兑换它们或将其交换其他加密代币时，你会发现欺诈交易所存在问题。虚假交易所的操作会将问题归咎于技术，然后带着你的加密资产溜。不幸的是，你和其他平台用户将永远无法找回被盗的加密资产。此外，虚假交易所运营者可能永远不会发现，也不会被强制为其犯罪负责。\n\
  \n### *识别虚假加密交易所*\n\n当你研究加密交易所时，问问自己几个问题。如果你无法对这些问题找到满意的答案，请远离该交易所。\n\n问题如下：\n\n\
  *   你能找到有关加密交易所运营人员的详细信息吗？\n*   你能看到交易所运营者的社交媒体账户和简介吗？\n*   交易所运营者的简介和账户是否活跃并保持更新？\n\
  *   该交易所具有高流动性吗？\n*   加密交易所是否有足够的资金投入来支持其增长、扩张和维护？\n*   加密交易所是否有中等到高交易量？\n*   加密交易所是否存储了你的加密代币的私钥？\n\
  *   加密交易所是否要求你提供个人信息？\n*   该加密交易所在加密爱好者中声誉良好吗？\n*   是否有关于该交易所客户服务的投诉？\n*   该加密交易所在\
  \ Twitter、Discord 或 Reddit 上有讨论吗？\n*   加密爱好者在在该交易所进行交易时遇到过问题吗？\n\n## 如何保护自己\n\n\
  如果你没有使用知名的 `CEX`，请将你的加密货币从 `CEX` 账户转移到你的私人钱包。此外，在注册账户时限制给予 `CEX` 的信息。注意，有些人的身份在使用提供给加密交易所的信息时被盗了。最后，如果一个交易所便宜得离谱且看起来令人不可置信，它可能是一个虚假交易所。\n\
  \n## 虚假加密钱包\n\n加密投资者可能会因将加密货币存储在虚假加密钱包而被盗。这些钱包可以从互联网下载或从网上商店获得。问题在于，这些钱包并不是合法的软件程序；它们是诈骗者创建的，旨在窃取你的加密资产。它们的名称通常与著名的加密货币和加密交易所相似。他们这样做是为了利用成熟加密公司的信誉。\n\
  \n### *识别虚假加密钱包*\n\n在选择加密钱包之前：\n\n*   研究该公司。\n*   查看其性能历史、投诉记录和社交媒体论坛上的相关信息。\n*\
  \   如果你发现任何红旗或可疑物品，请远离它。\n\n## 隐藏钱包\n\n隐藏钱包是黑客放在你的电脑或智能手机中的加密钱包，用于偷取你的加密货币。部署隐藏钱包是通过黑客访问你的电子设备，在上面创建一个钱包，并给隐藏钱包一个与你的加密钱包地址相似的地址。然后黑客会进入你的电脑，定位你复制过加密钱包地址的地方，并将地址更改为隐藏钱包的地址。\n\
  \n\n\n\n\n隐藏钱包骗局之所以能成功，是因为人们经常复制自己的加密货币钱包地址，但很少检查（以确保其无误）。因此，在购买加密代币时，他们会将代币存入该隐藏钱包，因为他们没有意识到复制的地址不再是他们加密货币钱包的地址。他们只有在检查加密钱包余额并发现余额不正确时才会发现问题。\n\
  \n请注意，受害者无法访问隐藏钱包（例如，提现存入的代币、在交易中使用代币），因为只有黑客可以访问隐藏钱包的内容。\n\n## 拉高出货计划（PUMP-AND-DUMP\
  \ SCHEMES）\n\n一群人决定从加密货币中赚快钱。首先，他们都在低市场价格购买了大量的特定加密代币。然后，在购买完加密代币后，他们来到自己的社交媒体账户（例如\
  \ `Twitter`、`Discord`、`Reddit`），将最近购买的低价值加密代币推广为下一个重大投资机会。\n\n骗子通过虚假新闻人为提高市场价格，从而增加对加密代币的需求。当市场价格持续上涨时，会有更多人关注并购买该加密代币。随着时间的推移，由于代币热度越来越高，其价格将继续增长。在某个时刻，拉高出货计划的组织者将开始慢慢出售他们的代币以获取丰厚利润。随后，计划组织者会将所有持仓抛向市场。在他们离开币后，代币的市场价格将急剧下跌。随着价格下跌，新投资者将开始出售他们的加密货币，因为他们担心失去初始投资。遗憾的是，随着更多投资者出售持仓，代币价格会跌得更快。结果，代币价格可能会回到最初的低市场价值，甚至跌得更低。在价格上涨时购买加密代币的投资者可能会损失他们的初始投资。\n\
  \n### 识别拉高出货计划\n\n在你根据从社交媒体论坛或“朋友”那里获得的建议开始购买加密代币之前，请仔细研究该加密代币。将这些建议看作是在深夜走过路时，一个看起来可疑的随机陌生人给你的信息。简而言之，不要假设你在社交媒体论坛上听到或读到的所有内容都是真实的，或有研究支持。这些地方也是寻找拉高出货计划替代品（又称受害者）的好地方。\n\
  \n在将资源投入这项可能获利的投资之前，请问自己以下问题并获得满意的答案：\n\n*   为什么这个加密代币会有需求？\n*   为什么这个加密代币的市场价格在上涨？\n\
  *   是谁在推动这个加密代币？\n*   你能验证收到的关于该加密代币的任何信息吗？\n*   研究该加密代币后，它对你来说似乎是一项合理的投资吗？\n\n\
  ## 托销骗局（SHILLING SCAM）\n\n加密货币持有者传播他们所持有代币的虚假信息以增加其需求。他们的目标是将代币价格推高到他们可以卖币并获得丰厚利润的水平。被骗购买加密货币的人创造了需求，这也是其价格随时间推移增加的原因。在某个时刻，托销（shills）将出售他们的持仓（即将其抛向市场），导致代币的市场价格像落石一样下跌。新投资者将无法获得预期的利润，或者会失去初始投资。由于他们不是骗局的一分子，他们不会成为该骗局成功的受益者。\n\
  \n### 识别托销骗局\n\n为了防止自己成为托销骗局的受害者，在你购买他人推销的热门代币之前，请问自己几个问题并获得满意的答案。问题是：\n\n*   是谁提供了关于加密货币的信息？\n\
  *   你能验证收到的关于该代币的任何信息吗？\n*   人们为什么想拥有这种加密货币？\n*   该代币的市场历史是否表明其目前的价值增长是自然增长的？\n\n\
  因为回答这些问题并获得满意的答案可能具有挑战性，仅仅因为你无法回答并不意味着该代币没有被托销（[纠正注：由于回答这些问题并获得满意的答案可能很困难]）。在购买他人推销的热门代币时（例如\
  \ `Dogecoin`），在这种情况下，你可能需要放手一掷并希望结果良好。\n\n新投资者将无法获得预期的利润，或者会失去初始投资。因为他们不是骗局的一部分，他们不会成为该骗局成功的受益者。\n\
  \n## 网络钓鱼骗局（PHISHING SCAMS）\n\n骗子利用电子邮件和短信欺骗你向他们提供加密货币资产。在电子邮件或短信中，他们会试图获取你的个人信息、加密钱包密码和其他信息。他们通常使用看起来正式的电子邮件或短信发送这些信息。\n\
  \n在对潜在的钓鱼骗局做出回应之前，请执行以下操作：\n\n*   研究提供优惠的机构。\n*   研究该优惠以及类似的优惠。\n*   了解信息要求哪些信息，以及这些信息是否可能被用于窃取你的资产。\n\
  *   确定哪些信息是你不会给一个无名陌生人的。\n\n记住，生活中没有免费午餐！！\n\n## 名人/网红冒充者（CELEBRITY/INFLUENCER IMPERSONATORS）\n\
  \n警惕收到的所谓名人或网红的任何邮件。除非你与这些人及其社交圈有联系，否则他们不会向你发送私人邮件说服你参加加密赠送或活动。你现在应该意识到，你收到的邮件很可能是冒充名人或网红的人发的。骗子希望你因为收到著名人物的邮件而印象深刻并兴奋，以至于忽略邮件中的可疑之处，信任他们并给你他们想要的东西。例如，如果你收到一封来自你崇拜但从未谋面的人的邮件，那是你崇拜的人概率有多大？\n\
  \n任何向你提供投资建议的垃圾电子邮件或短信都是可疑的。将它们看作来自意图不明的陌生人的建议。在回复此类信息时，不要提供可以被用来对你不利或窃取身份的个人信息（例如母亲的姓氏、社会安全号码）。\n\
  \n## SIM 卡攻击（SIM HACK）\n\n许多加密货币投资者使用手机进行加密货币交易和交易。他们还使用手机检查加密钱包余额、购买加密代币并执行其他加密相关任务。\n\
  \n\n\n\n\n想要访问受害者加密货币代或加密钱包的黑客可能会通过破解智能手机来实现。黑客只需要对你的 SIM 卡进行一次破解。在在那一次性攻击中，他们可以向你的手机下载病毒，甚至翻阅你的文件。此外，他们可以在你的智能手机上放置代码，让黑客查看你手机上的活动、从你的手机将信息发送给他们，并允许他们更改你手机上的信息。他们还可以加密你的文件，然后向你索要赎金。\n\
  \n黑客喜欢攻击 SIM 卡，因为大多数智能手机用户从未意识到他们的手机被黑客破解了。诈骗子之所以能从 SIM 攻击中逃脱法，是因为通常人们不会定期检查手机是否有病毒、恶意软件或奇怪的软件。此外，他们在检查加密钱包余额并发现金额不正确之前，通常并意识不到问题的存在。\n\
  \n### 它是如何实现的\n\n黑客可以通过联系手机运营商并冒充你的身份来访问你的智能手机。他们会向你的手机运营商提供你的出生日期、社会安全号码、母姓等信息，以便他们获取你的账户信息并进行更改。他们获取你信息的另一种方法是贿赂手机运营商的员工来提供线索。不幸的是，他们从大多数手机运营商员工那里花费不到\
  \ 200 美元就能获得你的数据。\n\n### 识别 SIM 攻击\n\n为了避免 SIM 卡被破解导致加密资产被盗，请采取以下措施：\n\n*   永远不要将手机连接到你的加密账户。\n\
  *   仅使用座机或免费的 Google Voice 号访问你的加密账户。\n*   使用发送到手机的代码确认你的加密账户。\n*   在你的加密账户上使用双重身份验证系统。\n\
  *   如果你使用手机，请为你的加密账户设置唯一的 PIN 和安全问题。\n*   在你的加密账户上使用强密码或获取密码管理器。\n*   使用虚拟专用网络（VPN）来隐藏你的互联网连接。\n\
  \nVPN 会加密你的 IP 地址。当你的 IP 地址被隐藏时，政府机构、公司、广告商和潜在的黑客将难以在网上定位你的电子设备（例如笔记本电脑、智能手机、台式电脑）。由于他们无法快速识别或跟踪你的\
  \ IP 地址，他们就不可能窃取你的个人信息、干扰你的加密交易或在你的电子设备上放置 Cookie 和恶意软件。VPN 在公共网络和私有网络上均可工作。它有一系列价格和计划。有关\
  \ VPN 的更多信息，请查看 ExpressVPN、Mullvad、Nord VPN、SurfShark、hide.me 和 Proton VPN。\n\n\
  ## 非对称赠送活动\n\n诈骗子喜欢利用社交媒体活动设置非对称赠送活动。在这些骗局中，诈骗子承诺向先给他们发送加密代币的人赠送免费加密代币。然后，诈骗子告诉潜在受害者，在交出加密代币后将获得更多的加密代币作为回报。不幸的是，现实是，在收到你的加密代币后，你再也不会收到他们的任何消息了。\n\
  \n### 避免非对称赠送\n\n永远不要将你的加密代币发送给某人的加密钱包，并期望他们会还给你并通过更多的加密代币作为奖励。为什么会有人这样做呢？他们从中能得到什么？世界上没有免费的午餐。如果有人给你提供免费的午餐，请寻找猫腻。\n\
  \n## 避免通过黑客或诈骗被盗加密货币的通用规则\n\n*   不要告诉所有人你有加密货币，特别是在社交媒体上。\n*   避免与你不认识的人在聊天中进行私信。通常情况下，攻击者会先联系你。\n\
  *   不要下载或点击你不确定安全的软件或链接。\n*   永远不要给任何人你的秘密助记词（seed phrase）、私钥或加密钱包密码。\n*   为不同用途准备多个电子邮件账户（例如：一个用于访问交易所，一个用于通信等）。攻击者可能会尝试使用你的电子邮件并查看是否有结果，来访问你在不同加密交易所的加密货币账户。\n\
  \n## 保护你的托管加密账户、私钥和秘密助记词\n\n对于中心化交易所（CEX）上的托管钱包和加密钱包，你应该使用三部分账户账户授权系统。不幸的是，最常见的双重身份验证（2FA）系统是不安全的，因为它容易受到攻击。黑客仍然可以破解这三部分系统，但需要更长的时间且更具挑战性。\n\
  \n让我们检查 2FA 系统，然后看看支持它的第三部分。\n\n### 2FA\n\n在 2FA 系统中，如果不输入至少两项安全数据，你就无法访问加密账户。首先，加密账户持有者将输入用户名和密码，然后被要求输入发送到其电子邮件账户或智能手机的代码。\n\
  \n### 破解电子邮件账户\n\n电子邮件账户长期以来一直容易受到攻击。我们经常读到数据泄露或黑客入侵电子邮件账户的新闻。如果你只使用 2FA，黑客可以进入你的电子邮件，点击“忘记密码”链接（谁没有忘记过一次密码呢？），并在你的账户内部重置密码。重置密码后，黑客将获得你加密账户的完全访问权限。\n\
  \n### SIM 卡劫持\n\n短信 信息有问题，因为 SIM 卡劫持已变得常见且简单。在 SIM 卡劫持中，黑客联系你的手机运营商，声称由于丢失 SIM 卡或智能手机而陷入困境。黑客会要求手机公司将你的号码切换到新的\
  \ SIM 卡或智能手机。在运营商将你的号码更改到黑客的 SIM 或智能手机后，黑客可以快速完成访问加密账户所需的 2FA 验证过程。\n\n### 身份验证器应用\n\
  \n如果你使用 Google Authenticator、Microsoft Authenticator 或 Authy 等身份验证器应用，黑客必须额外努力才能进入你的账户。这些应用并不困难也不费时间，但你必须在每个交易所账户上设置它们。关于身份验证器应用设置最重要的点是，你必须存储你的账户备份密码。如果你丢失了手机或电子邮件的访问权限，可以使用账户备份密码重新生成你的\
  \ Authy 账户。为了防止身份验证器应用备份密码和加密账户秘密助记词出现问题，请采取以下措施：\n\n*   将屏幕上显示的备份密码抄在纸上。确保它易于阅读，并使用不易褪色的墨水或不会随时间快速降化的纸张（例如，墨水遇水后无法识别）。\n\
  *   将备份密码复制两次，并将每个副本放在不同的安全位置（例如，保险箱内）。\n*   将密码刻在防酸、防火、防震的不锈钢上。\n*   将备份密码存储在受密码保护的\
  \ USB 闪盘中。\n*   设置一个你仅用于加密相关活动的电子邮件地址。这样，如果黑客获取了你的主电子邮件账户的访问权限，他们无法获取你的加密账户。\n*\
  \   永远不要给任何人你的秘密助记词或备份密码。\n*   永远不要将秘密助记词或备份密码存储在计算机、智能手机、平板电脑等设备上。\n\n## 强加密钱包密码指南\n\
  \n\n\n\n\n使用长度为 12 个字符或更长的密码。随着长度的增加，它们变得更加健壮和安全。强密码应混合大写字母、小写字母、特殊字符和数字。模式应该是随机的，输入时的键盘路径不应该是易记的。它们也不应包含你的个人信息、位置或任何黑客可以根据你的背景或对你的熟悉程度所推测的内容。此外，不要在相同或不同账户上重复使用旧密码。\n\
  \n## 生成强密码\n\n如果你不确定如何生成强密码，这里有一些你可以采用的方法⁴：\n\n*   使用如 `NordPass` 等密码生成器应用程序创建你的密码。\n\
  *   使用短语并对其进行缩写。\n*   从字典中选择随机单词，并使用不同的特殊字符和数字将它们组合起来。\n*   使用缩写的名言。\n*   在密码中使用表情符号。表情符号是特殊字符、标点符号和数字的组合。例如：\n\
  \n![](img/image00154.jpeg)\n\n*   为所有账户使用相似的密码，但更改开头或结尾，使其针对每种类型的账户进行专门化。\n\n![](img/image00169.jpeg)![](img/image00156.jpeg)第\
  \ 7 章\n\n# 如何寻找加密货币明藏\n\n## 核心信息\n\n投资者主要使用基本面分析和技术分析来决定想要交易或购买哪些加密货币。基本面研究侧重于研究加密项目并估计其增长、寿命和市场价值的。相比之下，技术分析侧重于观察历史价格波动，并利用资产的市场趋势对未来价格波动做出预测。最终，你应该选择一种反映你的风险承受能力和对资产认知的投资/交易策略（例如，购买公司的一部分与交易公司的股份）。\n\
  \n## 基本面分析 VS 技术分析\n\n### 基本面分析\n\n基本面分析（`FA`）要求投资者花费大量的时间、精力和努力研究公司，并确定其“真实”（又内在）市场价值和增长潜力。这种分析最计划购买并持有资产超过一年的的人。\n\
  \n根据“奥马哈神谕”、最著名的 FA 投资者沃伦·巴菲特的说法，基本面分析被认为是想要积累家族财富并实现财务独立的人的最佳投资策略。\n\n### 技术分析\n\
  \n技术分析（`TA`）通常由短期投资者/交易者使用，因为他们的市场成功取决于在最佳价格点进行交易。TA 关注资产在市场中的历史表现，并利用其之前的表现来预测未来的价格波动。其工具使用价格波动的趋势、总结随时间波动的数学方程，以及交易者可以使用计算机分析识别的其他类型的市场信号。\n\
  \n使用 TA 工具做出交易决策的投资者通常使用使用多个工具来确定市场趋势以及他们应该何时入场和离场。最著名的 TA 投资者是那些在 2021 年成功交易 `DOGE`（狗狗币）、`AMC`（Amnext）和\
  \ `COSS`（加密一站式解决方案）并从低市值短暂飙升至平层大气层发财的人。\n\n在本章中，我们将回顾 FA 和 TA 的基础知识。虽然两种分析技术都无法保证作为加密货币交易者或投资者在市场上的成功，但你应该选择适合你的一种种。\n\
  \n## 加密货币基本面分析 (FA)\n\n`FA` 查看加密项目的运营、管理、分配和潜力。此外，它还衡量了可能影响加密货币市场估值的方面。\n\n## 定性与定量分析\n\
  \n投资者审查加密货币的关键特征。考虑的因素包括：\n\n*   管理\n*   治理\n*   组织结构\n*   专利\n*   专有技术\n*   品牌\n\
  *   市场利基\n*   市场规模\n*   竞争对手\n*   市场周期\n*   财务报表（例如：资产负债表、利润表、现金流量表）\n\n### 运营：管理、治理\n\
  \n作为投资者，你希望决策者有技能和经验做出对价值产生积极影响的决策。\n\n### 技术优势：专利、专有技术、共识算法\n\n加密公司可以在不同的区块链上发行加密代币（例如\
  \ `USDT`、`USDC`）或主要发行（例如 `BTC`、`XRP`、`DOT`）。代币的用途越高，其市场价值和需求越大。用途有限的加密代币必须产生高需求，因为否则没有人会购买它们。为了让限量代币产生高需求，它必须占据一个未开发的市场利基（例如\
  \ `XRP`）。\n\n融入加密代币生态系统运营、发行、被动投资机会或程序中的技术也会影响其声誉。加密货币投资者通常倾向于获取不太可能被黑客、因运营规划或维护失误而无法使用、或过时的公司发行的加密代币。总之，所有这些问题可能会显著减少对加密货币的需求，如果更严重，还会消除其需求。\n\
  \n### 代币经济学\n\nTokenomics 指代币的供应、销毁和使用。此外，投资者/交易者应该了解代币是否有自己的生态系统、它是否可以在多个区块链上使用、是否在加密货币交易所交易，以及公司如何向公众分配代币。\n\
  \n### 代币供应\n\n供应有限的代币可能会随时间增值，特别是公司每年销毁相当比例的代币。此外，如果加密货币的代币供应无限，你想知道代币是如何发发的：\n\n\
  *   公司每年铸造多少代币？\n*   公司每年销毁多少代币？\n\n### 代币获取性\n\n在 `CEXs` 上购买的代币比只能在 `DEXs` 上购买的代币更有信誉，因为\
  \ `DEXs` 对加密代币的上市要求比 `CEXs` 低。由于标准宽松，`DEXs` 有比 `CEXs` 更多低价值和欺诈性的代币。\n\n\n\n\n\n\
  如果该代币进行过首次币发行（`ICO`）或正计划进行，请仔细考虑创始人、开发团队和外部投资者所持有的代币比例。如果公众没有拥有大部分代币，那么这是一个红旗，表明代币的创建者对其没有信心，并且他们认为该代币随着时间的推移（即多年后）将没有价值。\n\
  \n当公众不持有大部分代币或只有少数人持有时，该代币的价值很容易被操纵，并迅速抛售获利。认为其代币具有价值和盈利未来的代币发行者，分配给创始人和开发团队的代币占比。他们通过不同的发行将大部分代币释放给公众，供利益相关者购买。\n\
  \n### 品牌\n品牌指的是代币或区块链的声誉。如果一个品牌广为人知且声誉良好，其价值可能会高于市场特征所合理的水平。品牌情绪可能会导致人们购买并持有用途有限、开发糟糕且缺乏独特性的代币（例如，`DOGE`、`SHIB`）。因此，如果你正在考虑投资这些币，你应该知道该代币的市场价值多大程度上取决于人们的情感因素。\n\
  \n### 品牌强度\n`Bitcoin`的市场价值取决于其社区对代币的情感投入。尽管该代币可能永远不会回到其在第一季度达到的价格水平，但其持有者渴望投入他们的财务资金。对于这两种代币，它们的品牌非常强大，以至于在投资者没有仔细研究它们的情况下仍继续吸引投资者。就像`Coca-Cola`、`Pepsi`、`Amazon`、`Nike`和`Apple`一样，品牌驱动了客户忠诚度。\n\
  \n### 社区支持与参与\n在评估代币的价值及其未来增长潜力时，其社区支持和参与是决定其真实价值的关键因素。活跃、参与且不断发展的在线社区对于加密代币的大规模采用至关重要。如果没有大规模采用或不断发展的社区，代币的价值或可用性可能增加。代币社区的讨论驱动了兴趣和需求。当人们对加密货币的兴趣和需求很高时，其他潜在投资者/交易者将产生兴趣并投资该代币。此外，区块链开发者更有可能创建一个将加密货币整合到项目中的应用程序。\n\
  \n### 市场特征：利基、规模、监管\n在估计代币价值的潜在增长时，你必须考虑市场规模、市场估值、市场的独特性以及监管如何影响其运营。例如，如果你可以轻松用其他代币替代感兴趣的特定币，那么它的利基市场就过于普通且受到严格监管，因此可能不会有高需求。另一方面，如果对该代币的需求或需求很低，你不应该期望其市场价值会上升。\n\
  \n### 财务报表\n投资者和交易者还会审查加密代币发行公司的资产负债表、利润表和现金流量表。\n\n#### 资产负债表\n资产负债表记录了公司的资产、负债和权益。公司控制公司资产，包括现金、库存和建筑。公司的负债包括短期和长期贷款、公司债券和其他类型的公司债务。权益由公司拥有的公司股份组成。\n\
  \n#### 利润表\n公司利润表包括关于公司在特定期间收益、支出以及业务利润的报告。公司可以使用它来评估公司从运营以及投入运营的资金产生收入和利润的效率。\n\
  \n#### 现金流量表\n该表单是公司在一段时间内现金流入和流出的记录。此表单包含以下信息：\n1. 投资活动现金（`CFI`）：用于购买资产的现金以及出售其他资产（例如设备、建筑、业务）的收益。\n\
  2. 筹资活动现金（`CFF`）：发行和贷款资金的现金收益。\n3. 经营活动现金流（`OCF`）：日常经营产生的现金收益。\n\n## 白皮书审查\n在评估代币时，财务部分列出的绝部分或所有信息应出现在代币的白皮书中。如果白皮书中没有这些信息，或者开发团队没有发布关于这些信息的发布稿，你应该警惕投资。\n\
  \n你必须判断该加密项目看起来是合法的还是骗取投资者资金的手段之一。白皮书写得不好并不意味着加密项目会失败。相反，一份完美的白皮书并不能保证加密项目会成功。\n\
  \n### 白皮书与虚假首次发行\n请注意，首次发行和其他公开代币发行是骗取新手投资者资金的流行方式。骗子产生的白皮书看起来非常有吸引力，通常具有精美的图形，并且往往复制其他项目。\n\
  \n假的 ICO 往往：\n* 资金薄弱\n* 缺乏活跃和参与的在线社区\n* 在技术原理方面存在巨大空白\n* 将大部分代币分配给项目相关人员\n* 没有完成任何实质性里程碑\n\
  * 有短期展望\n\n这些是它们的主要缺点，因为它们不计划让代币增值、实用或长期“生存”。因此，它们想将代币卖给公众，并带着投资者的资金消失。\n\n## 链上分析\n\
  在评估区块链时，你应该将以下因素纳入其收益产生能力和性能分析：\n1. 交易数量：区块链在特定时期处理的交易表明了区块链的活跃程度及其服务的需求。交易总数将包括加密钱包之间的资金转移，因此你不能直接接受这个数字。\n\
  2. 交易价值：交易或一组交易中的资金价值。\n3. 活跃地址数量：计算活跃地址的方法不同。最简单的方法是计算在此期间内发送和接收地址的数量。\n4. 交易费用：查看平台用户支付的交易费用。大型用户在拍卖中竞出的成本越高，平台就越成功。\n\
  \n\n\n\n\n### 5. 区块链攻击\n如果一个区块链被反复黑客，你可能想要避开它。具有足够支持、良好代码和流量的区块链通常不容易被破解。请注意，加密货币区块链不同于加密交易所，因此你不能将同样的逻辑应用于加密交易所。尽管如此，你应该对被攻击过的加密交易所保持警惕，特别是当它被攻击过多次时。\n\
  \n### 6. 区块链停机\n如果区块链因为交易过载或由于平台用户过度使用其服务导致崩溃而不得不暂停活动，你可能想要避开它。在流量大时，区块链处理交易的速度可能会慢很多，但它们不应该崩溃。如果区块链中断超过一次，你应该仔细研究开发团队以及他们采取了什么措施来防止这种情况再次发生。\n\
  \n### 7. 区块链补丁\n无论区块链的代码有多完美，总会有某些遗漏并导致问题。你寻找的不是代码完美的区块链，而是具有良好代码、警觉的编码人员和安全人员，并且有证据表明运营商和开发者能够在问题给平台用户造成麻烦之前发现并修复区块链代码中的问题。\n\
  \n## 基本面分析的 4 个基本假设\n\n基本面分析（FA）有四个基本假设，只有当这些假设有效或合理真实时，FA 才能反映公司的“真实”价值：\n\n1.\
  \ 当前股价没有反映公司的实际价值。\n2. `FA` 值更好地反映公司的“真实”股票价值。\n3. 随着时间的推移，股价将反映计算出的 `FA` 值。目前尚不知道公司股价需要多久才能反映\
  \ FA 估值。这可能需要几天、几个月，甚至几年。\n4. 关注特定行业及其公司的投资者可以计算该行业公司的内在价值，并找到以折价买入股票的机会。\n\n##\
  \ 技术分析 (TA)\n\n加密货币的技术分析（TA）基于道格斯理论，该理论有六个基本原则。这六个原则是：\n\n1. 资产的市场价格代表了资产的“真实”价值（包括交易者的预期和市场情绪）。\n\
  2. 你应该根据以下市场趋势判断价格波动：\n3. 主趋势/大趋势趋势，持续几个月到一年以上。\n4. 你可以在主大趋势中找到次级趋势；这些趋势持续几周，是主大趋势的市场修正。\n\
  5. 次要趋势/短期趋势，持续 1–2 周。\n6. 主趋势有三个连续阶段，分别是：\n7. 积累 – 买家买入资产，或卖家卖出资产。他们的市场活动不影响投资价格。\n\
  8. 公众参与 – 更多交易者注意到并遵循新的市场趋势，他们的交易活动导致资产价格迅速变化。\n9. 分发 – 在投机狂热的时期，经验丰富的交易者会派发持仓。\n\
  10. 不同的 TA 指标必须相互确认市场信号。加密货币对之间运动的相关性是你可以在加密市场中观察到的。\n11. 价格移动时成交量必须增加。如果成交量随价格波动而增加，价格遵循市场趋势。然而，如果成交量随价格波动而减少，价格则背离市场趋势移动。\n\
  12. 趋势会一直持续，直到市场出现明显的信号表明它将发生反转。价格通常遵循趋势，而不是改变趋势。\n\n主趋势中的反转可能很难识别，并且往往类似于次级波动。\n\
  \n## 技术分析 (TA) 工具\n\nTA 工具主要分为五大类。这些类别是：\n\n1. 交易统计（例如，成交量）\n2. 蜡烛图分析\n3. 图表形态\n\
  4. 阻力位和支撑位\n5. 技术指标\n\n交易者经常结合使用 TA 工具来解读市场。他们这样做是因为如果工具给交易者提供相同的信号，它们就相互确认。如果有两个或更多工具相互确保，交易者就可以确信对价格波动的市场预测是正确的，或者更有可能是准确的。此外，这些工具可以指示市场趋势的强度，市场趋势越强，交易者正确读取或解读它的几率就越大。\n\
  \nTA 工具帮助交易者减少市场风险和交易错误。然而，它们不能消除所有的交易风险。例如，交易者永远无法确定自己对市场趋势的预测是正确的，因为这些趋势在某种程度上是相似的。此外，交易者永远不知道一个趋势会持续多久，以及变化得有多快。\n\
  \n### 加密货币并不完全适合 TA\n\n此外，你无法根据之前的市场表现完全预测加密货币市场的波动。此外，你不能简单地将加密资产的价格波动与真实的全球事件、经济或投资相关联；因此，它的波动性更加不可预测。\n\
  \n## 通用 TA 工具组件\n\n本节将回顾大多数 TA 工具用于确定市场趋势的关键因素。回顾的元素包括分析时间框架、成交量、蜡烛图、支撑和阻力位以及图表形态（例如看涨、看跌、反转、突破）。\n\
  \n### 分析时间框架\n\n观察加密货币价格移动没有理想的周期，这意味着观察期主要取决于你的交易策略。\n\n交易者关注不同长度的时间，是因为他们从事的是短期或长期交易。所以，让我们看看观察时间如何根据交易者的类型而变化。\n\
  \n* 剥线交易者快速进出的交易者（在 1–5 分钟内）。\n* 日内交易者在一天内进出。他们通常查看 5 分钟、15 分钟和 60 分钟的市场图。\n* 持仓交易者偏好长期交易，持续时间从\
  \ 1 天到几周不等。\n\n在简洁的时间框架内交易通常对于波动大、高投机性的市场更好。\n\n### 成交量\n\n成交量是指特定时期内交易的加密货币数量，用于指示市场趋势的强度。更强劲的趋势成交量更高，弱势的趋势成交量较低。\n\
  \n## 蜡烛图\n\n蜡烛图深受经验丰富和缺乏经验投资者的欢迎。蜡烛图显示了资产在特定期间内的价格移动。蜡烛有实体，颜色为红色或绿色，最多有两个影。\n\n\
  * 绿色蜡烛图\n底部是开盘价，顶部是收盘价。收盘价高于开盘价，因此被视为看涨。\n\n* 红色蜡烛图\n底部是收盘价，顶部是开盘价。因为开盘价高于收盘价，因此被视为看跌。\n\
  \n## 蜡烛强度\n\n资产价格的变化源于市场中激进的买卖和订单量。如果当前价格有许多卖单，价格将会下降。然而，如果当前价格有很多买入单，价格将会上涨。\n\n\
  简而言之，当卖单超过买入单时，资产价格下跌。但相反，当买方订单超过卖方订单时，价值就会上升。\n\n\n\n\n\n由于大量的市场买卖是基于情绪的，因此说明资产买卖积极性的\
  \ K 线（蜡烛图）展示了投资的价格走势以及交易该资产的人的情绪状态。\n\n你可以从 K 线的结构中看出其强度；它们有一个实体，以及零到最多两根影线（烛）。影线是从\
  \ K 线的顶部和底部延伸出的线条。\n\n让我们回顾一下不同的 K 线强度。\n\n![](img/image00160.jpeg)\n\n*来自 Financial\
  \ Freedom Trading 的图片“K 线强度”。⁸*\n\n1. 最强的 K 线具有长长的实体，且没有上影或下影。这种类型的蜡烛标志着当前价格走势将持续。价格走势仍可能改变方向，但可能性较低。（**极强信号**）\n\
  2. 这仍然是强 K 线，它具有长长的实体，且在价格走势相反的方向上有较短的上/下影。价格可能会继续向相同方向移动，但有微小的概率改变。（**强信号**）\n\
  3. 蜡线实体中等大小，上下影也都是中等大小。这是一个中等信号。当前价格走势可能会持续。然而，价格方向发生变化的风险很大。（**中等强信号**）\n4. 实体比中等小但不是短实体，且有两根中等长度的上下影，这种中等信号在平均强度范围内前景最不利。价格方向发生变化的机会很大，但更有可能继续向相同方向移动。（**弱中等信号**）\n\
  5. 这根 K 线具有较小的实体和一根沿着价格走势方向延伸的长上/下影。K 线的开价、收盘价和接近信号较弱。价格走势改变方向的机会极佳。\n6. 最弱的 K 线信号。它有一个纤细的实体和一根沿着价格走势方向延伸的长上/下影。这种\
  \ K 线标志着投资者应该为价格方向的变化做好准备。（**最弱信号**）\n\n# 图表模式\n\nK 线创建了交易者可以用来衡量、读取和预测市场的图表模式。随着你阅读和解读图表模式能力的提高，你将进行策略性交易并降低交易风险。最重要的是，你将更有机会获得更获利的交易。交易者寻找的交易模式有：\n\
  \n### 涨涨 K 线模式\n\n这种交易信号意味着资产价格正在上涨。如果交易者以良好的位置、低成本进入市场，并在主要价格峰值处卖出，你在最大化价格峰值或刚达到峰值后将从交易中获利。\n\
  \n![](img/image00161.jpeg)\n\n*来自 Financial Freedom Trading 的图片“看涨 K 线”。⁹*\n\n##\
  \ 看跌 K 线模式\n\n此模式标志着资产价格正在下跌，现在不是买入的时机。如果可能，在价格下跌到让你亏损、无利或获利极少之前卖出该投资。相反，当资产价格触及最低点时，那是买入该资产的完美时机，然后在价格再次达到峰值时卖出。\n\
  \n![](img/image00162.jpeg)\n\n*来自 Financial Freedom Trading 的图片“看跌 K 线”。¹⁰*\n\n\
  ## 看涨反转模式\n\n看涨反转模式标志资产下跌的价格将改变方向并上涨。它是一个反转模式，因为熊市趋势变成了牛市趋势。\n\n## 看跌反转模式\n\n看跌反转模式标志资产上涨的价格将改变方向并下跌。它是一个反转模式，因为牛市趋势变成了熊市趋势。\n\
  \n头肩底图表模式向你展示了看涨和看跌反转模式。此外，在比特币市场数据也可以找到头肩底图表模式。\n\n![](img/image00163.jpeg)\n\n\
  *来自 Financial Freedom Trading 的图片“如何交易头肩底模式”。¹¹*\n\n![](img/image00165.jpeg)\n\n\
  *来自 Crypto News，2019 年 6 月 10 日的图片。¹²*\n\n## 持续趋势模式\n\n此信号意味着市场趋势将持续一段未知的时间（即超过一根\
  \ K 线）。它允许交易者进入/退出头寸并建立丰丰的交易。\n\n在上面的头肩底图表模式中，价格突破了支撑线并继续向下移动（熊市趋势）。\n\n## 支撑位与阻力位\n\
  \n带有 K 线的市场图表具有支撑线和阻力线。支撑线是你沿着 K 线底部绘制的线。它代表了一段时间内低价的总体方向。阻力线是你沿着 K 线顶部绘制的线。\n\n\
  支撑象征着资产抵御价格下跌市场压力的强度。支撑越强，价格跌破它的可能性就越小。\n\n阻力象征着资产防止价格上涨的强度。阻力越强，资产价格高于它的可能性就越小。\n\
  \n支撑线和阻力线在市场图表上形成常见的形状。起初，你可能很难在图表中“看到”形状，但随着时间的推移和练习，你将能够识别不同的图表形状以及它们告诉你关于资产市场趋势的信息。\n\
  \n你可以在下面的图中观察到主要和次要的支撑与阻力。\n\n![](img/image00166.jpeg)\n\n*来自 Financial Freedom\
  \ Trading 的图片“主要与次要支撑阻力”。¹³*\n\n## 突破模式\n\n当资产价格跌破支撑线或突破阻力线时，价格突破了趋势。如果你能预测突破，你就可以进行获利的交易。下面的图表显示了一些突破模式。\n\
  \n![](img/image00167.jpeg)\n\n*来自 Financial Freedom Trading 的“突破模式”。¹⁴*\n\n## 其他\
  \ TA 工具\n\n还有其他 TA 分析工具可以用来读取和解读加密市场。虽然我们在这里无法介绍它们，但你可以研究这个最流行的列表。你应该使用你感到最熟悉、信任并有信心引导加密决策的工具。\n\
  \n常用的 TA 指标有：\n\n* 能量潮指标 (`OBV`)\n* 累积分布线 (`A/D Line`)\n* 平均方向指数 (`ADX`)\n* 阿润指标\n\
  * 移动平均收敛发散 (`MACD`)\n* 相对强度指数 (`RSI`)\n* 随机指标\n\n## 模拟交易\n\n准备好交易加密货币了吗？\n\n如果你有一个可以使用虚拟货币交易的演示账户，你会感到更舒服吗？\n\
  \n那么，可以使用模拟交易来练习交易技巧。模拟交易是使用虚拟资金交易的演示账户。交易后，你可以观察市场决策的结果并制定策略以优化市场表现。\n\n许多公司提供免费演示账户，因此你不应该付费。如果可能，从你未来感兴趣合作的公司获取一个演示账户。记住，许多公司允许在其平台上交易加密加密货币。\n\
  \n如果你决定开设模拟交易，你可能考虑的一些公司有：\n\n* Webull\n* eToro\n* AvaTrade\n* Interactive Brokers\n\
  * TradeStation\n* Thinkorswim\n* Capital.com\n* Tradier\n* FOREX.com\n\n## 在大海中寻找你的针\n\
  \n你现在准备好开发你的加密货币交易技能了。市场上有成千上万种加密货币，因此你有很多选择。如果你倾向于处理具有历史记录和大量市场数据的加密货币，请考虑市值最高的那些。\n\
  \n\n\n\n\n使用你的模拟交易账户或你选择的任何方式来练习和测试你的交易策略，请关注以下一个或多个加密货币：\n\n* 比特币原生币 (`BTC`)\n\
  * 比特币现金原生币 (`BCH`)\n* 以太坊原生币 (`Ether`)\n* 波卡币原生币 (`DOT`)\n* 去中心化世界原生币 (`MANA`)\n\
  * 狗狗币原生币 (`DOGE`)\n* 卡尔达原生币 (`ADA`)\n* 泰达原生币 (`USDT`)\n\n# 现在就开始积累你的加密货币财富！\n\n\
  你拥有开发和提高加密货币交易技能所需的一切。从今天开始吧！当你对模拟交易感到自在且自信时，就开始投资加密货币。\n\n注意，不要做一个一劳永逸的模拟交易者！\n\
  \n在某个时刻，你必须投入加密货币交易并投入你自己的资金。\n\n如果你在开始积极交易方面遇到困难，请设定一个交易日期，并在交易中投入少量资金。最终，你必须“破釜成舟”，让自己暴露在加密市场中，无论好坏。\n\
  \n记住：凭借经验和（一些）运气，会出现巨大的机会和财富。![](img/image0171.jpeg)[](Images/image0168.jpeg)\n\n\
  # 第 8 章从加密货币中获利以及创造跨代财富的钥匙\n\n## 核心信息\n\n想要成为百万富翁并创造跨代财富的加密货币投资者必须是自律、冷静且注重记录的投资者，以设定目标、里程碑和市场出场策略。总的来说，加密货币投资者积累财富的最佳计划是投资具有长期前景的资产。\n\
  \n## 什么是跨代财富？\n\n当你实现了跨代财富时，意味着你在储蓄和投资中积累了一笔巨额财富，这笔财富具有韧性、自我维持能力，更重要的是它是安全的。因此，你的子孙后将从你一生创造的财富中受益。\n\
  \n如今，普通人可以通过加密投资的倍数效应创造跨代财富。机会仍然存在；在 2021 年，有更多的加密货币增加了价值。然而，创造跨代财富不是一种暴富计划。你必须长期坚持；实现它需要坚持下去，不要让情绪误导你。\n\
  \n历史上第一次，加密货币使成为富翁的机会民主化。此外，在财富保护方面，加密货币可以成为保持家族财富完整并将其传给后代的基石。由于市值超过 4000 亿美元，估计由于比特币的并行上涨，产生了\
  \ 18,000 名新的百万富翁。此外，比特币的崛起可能仅处于婴儿阶段，并且是在全球范围内发生的，这意味着积累巨额财富是一个稀有机会；从历史上看，财富转移主要发生在区域规模上。\n\
  \n由于加密货币具有不可预测且防黑客的 SHA 加密密钥——一种将数据字符串转换为精确 256 位数据的哈希算法——加密货币是保护跨代财富的不可思议的工具，因为它们几乎不可能被没收。你可以记住生成加密货币钱包的秘密种子助词，这个种子助词可以传给后代，也许甚至不需要第三方信托。此外，特定加密货币发行的代币数量是有限的，这是对抗通货膨的重要对冲。你能想象将比特币留给孙辈，并让其价值随着时间的积累，在他们成年时价值\
  \ 100 万美元或 500 万美元吗？通过将你积累的财富存储在加密货币中，你更有机会保护和增加你的家族财富，并抵御未来多年的通货膨胀。\n\n通过确保你的财富树拥有深根，让你的财富树持续生长。深根源于对具有良好投资回报的增长领域进行合理的投资。加密货币、区块链技术和加密相关行业不会消失。它们正在演变，以满足不同市场未满足的需求，并更有效地管理商业交易。\n\
  \n现在，你可能怀疑加密货币作为长期投资的可行性，因为它的市场突然起伏，而没有明显的原因作为市场转变的。好吧，这种情况在股市中也会发生。然而，股市的变化有一些潜在的解释，因为股市与现实世界的有形资产和服务相钩。尽管有关于上市公司的信息以及\
  \ 24/7 全候播放可能影响它的每个国际事件的新闻广播，但对于大多数投资者来说，战胜股市很难。\n\n明明的投资者知道，当市场动荡且他们不确定如何处理他们的加密货币投资时，他们应该什么都不做。你在选择加密货币投资时的尽职调查、对市场活动的研究、你（理想情况下）与其抽离，以及你预定的投资出场计划将告诉你该做什么。但在大多数时候，你应该什么都不做。只需静候并观察市场的自我重置。\n\
  \n具有长期心态的投资者不在乎市场的每日波动。相反，他们关注大局、他们随时间的投资表现，以及向投资组合中增加有价值投资的机会。例如，沃伦·巴菲是一个非常成功的投资者，他进行长期投资（几十年）。当资产价值突然下跌或出现熊市时，他并不会卖掉资产。相反，当市场处于谷底时，他会寻找随时间产生良好可持续回报的绝佳投资。简而言之，你的意图和行动之间必须保持一致。出于恐惧做出选择与长期投资策略是不一致的。\n\
  \n到此为止，你已经决定采取长线策略并创造跨代财富（否则，你为什么要读这本书呢？）。然而，你保持抽离自信、实践尽职调查并观察市场的决心促使你继续前进，并掌握加密富翁的技术和心态。\n\
  \n# 制定长期投资游戏计划\n\n## 你的决策过程\n\n\n\n\n花些时间研究并为你寻找最适合的加密货币投资。找到适合你的投资意味着，如果你对风险的承受能力较低且投入加密货币市场的资金有限，你就不想投资衍生品、差价合约（CFDs）或高风险加密货币代币（例如首次代币发行\
  \ [ICOs]）。然而，如果你有很多钱可以花，并且能够忍受高风险投资而不会感到沮丧，那么高风险、高投机性的加密货币投资可能是一个不错的选择。同样，如果你是进入市场并希望投资于风险较低且具有市场历史的保守资产，请将资金投入传统代币（例如：`Bitcoin`、`Ether`）。\n\
  \n# 投资目标\n\n投资目标首位，其次弄清楚投资什么以及何时卖出就会变得容易。每次进行投资时，都要写下该投资的目标。例如，如果你的目标是投资 1,000 美元并偿还\
  \ 4,500 美元的债务，以此为重点。然而，如果你的目标是创造跨代财富，你必须找到合适的项目，战略性地投入你的资金，并寻找有前景的长期投资。此外，跟踪每种资产的进展，以便识别出哪些是最盈利的，以及你未来可能想要退出或避开的资产。\n\
  \n## 交易与持有 (HODLING)\n\n大多数人倾向于三种加密货币投资策略之一。这三种策略是日交易、`HODLing` 以及混合。\n\n## 交易\n\
  \n交易通常指日交易或短期加密货币投资。交易者试图在特定时间进入和退出仓以快速获利。在建立特定立场之前，交易者会确定交易时机、买卖的市场价格，以及在寻求短期收益时对高水平市场波动的承受能力。\n\
  \n尽管交易对某些人来说可能非常获利，但大多数人都会亏钱，或者收益被损失抵消。此外，交易的成功取决于在正确的时间、正确的地点做出正确的决定。它要求交易者在执行交易策略时保持冷静、独立行动，并置于市场混乱之外。简而言之，成功的加密货币交易者通常不成群行动或不随大流。\n\
  \n## 持有 (HODLing)\n\n`HODLing`，或称“拼了死也要持有”，是指加密货币投资者长期投资加密货币代币。长期可能是 1 年、10 年或更久。无论投资期多久，他们都承诺持有加密货币代币，并等待代币成熟或达到预定的卖出时间。`HODLers`\
  \ 以观察市场、做出明智的投资决策以及不受大多数日交易者的市场驱动决策的影响为荣。\n\n加密货币 `HODLing` 是建立和保持跨代财富的三大支柱之一，其他支柱还包括房地产、贵金属、股票、债券和人寿保险。\n\
  \n相反，`HODLers` 聚集在一起，相互支持，并在度过市场波动时等待他们的代币增值或回到其高市场估值。最传奇的 `HODLers` 是加密货币世界的沃伦·巴菲特。他们从\
  \ `ICO` 之后购买后就一直持有他们的 `Bitcoin` 和 `Ether` 代币。多年持有代币让其中一些人成为了亿万翁、更多百万富翁，并且大量人获得了丰厚的利润。尽管如此，为了达到那个水平，他们多年持有代币让其中一些人成为了亿万翁、更多百万富翁，并且大量人获得了丰厚的利润。\n\
  \n# 通过持有创造跨代财富\n\n如果你想通过 `HODL` 创造跨代财富，你必须首先找到值得投资的加密货币代币，这里有一些你应该完成的一些标准事项。做以下事情将增加你找到值得\
  \ HODL 的代币的机会。\n\n### 阅读白皮书\n\n加密项目的白皮书应该详细说明区块链开发者为何创建该项目、其目的、随着时间的推移如何发展、哪些人感兴趣，以及开发团队计划如何维护。虽然区块链的推广者使用白皮书进行营销，但它们也应该是详尽的文章。如果白皮书缺乏关于代币的详细信息，说明它写得不好，可能是项目无法持久的信号。最后，如果它与另一个代币的白皮书太相似，应该引起警惕。新的区块链开发者不应该复制白皮书或模仿他人。白皮书缺乏真实性是一个巨大的危险。\n\
  \n### 研究创始人和开发团队\n\n为了推动代币的发展、发布和维护，你需要具有愿景、加密货币和区块链技术背景以及某些行业人脉的创始人和开发团队。他们还应该拥有可以追溯的在线形象。例如，他们应该在\
  \ `LinkedIn` 上拥有简介，成为在线加密论坛的一部分，并参与过至少一个加密项目。创始人和开发团队不需要拥有完美的技术背景；作为一个整体，他们应该互补，并提供开发、发布和维护加密货币代币所需的技能、人才、知识和专业知识。\n\
  \n### 评估项目的里程碑\n\n区块链开发者创建加密项目是为了长期投资、实用性和价值，并且在启动区块链之前应该列出里程碑。开发者应该已经实现了一些初步里程碑；此外，应该有证据表明团队正在积极迈下一个里程碑，并为获得更多里程碑奠定基础。简而言之，开发者应该留出资金用于代币的维护和开发、一个产生更多收入以投资代币的系统，以及积极努力将资金重新投入代币及其为用户提供的服务。缺乏这种对代币的财务投入，它很可能不是一个优秀的长期投资。\n\
  \n### 调查代币社区\n\n能够持久的加密代币需要一个支持它们、传播其信息、为其创造需求并对其持有感兴趣的社区。你可以在 `Twitter`、`Reddit`、`Discord`\
  \ 和 `Facebook` 上找到加密社区。如果你想投资某种代币，请关注关于该代币的言和讨论。然而，你不应该假设听到或读到的关于感兴趣代币的一切都是真实的。论坛讨论中可能混杂一些金子般信息，将为你提供关于去哪里研究该代币、项目的预期寿命以及是否有人认为该代币是骗局的线索。\n\
  \n\n\n\n请注意，如果你发现社区正专注于炒作代币并推高其需求，你应该保持警惕。诈骗者炒作代币通常通过“拉高后出售”（pump-and-dump）计划或其他诈骗手段，其目的是推高代币价值，以便使持有大量代币的小少数投资者能够以高于市场合理价格将其卖出。这些骗局只奖励那些在市场崩盘前套现的人。在代币价值大幅增加后买入，或在市场价格下跌前未卖出的投资者，往往会亏损或获利极微。\n\
  \n### 追踪资金流向\n\n在投资代币之前，先研究谁持有大部分代币。如果创始人和开发团队计划项目增值、进行长期投资并拥有庞大的社区，那么他们需要公众持有大部分（大于\
  \ 50%）的代币。\n\n远离那些创始人、开发团队和大投资者持有大部分代币的代币和项目。如果公众仅持有 30%的代币，项目利益相关可能会在价值上升到一定水平时抛售代币。此外，如果创始人和开发团队要求投资者用高价值代币兑换他们新推出的代币，这可能是一个骗局。在足够的投资者用\
  \ `Bitcoin`、`Ether`、`XRP` 等兑换新代币后，项目运营者可以关闭项目并带着高价值代币消失。遗憾的是，在这种情况下，投资者将持有毫无价值的代币，且无法获得任何正义。\n\
  \n### 代币的实用性\n\n具有长期市场未来的代币必须是有用的。代币应该满足加密市场某些未满足的需求。如果某个代币主导了其设计的细分市场，就会产生需求。此外，该代币及其区块链的独特之处将使其能够建立并保持强大的市场地位。\n\
  \n例如，`Ether` 的创建是为了用于交易、价值存储和作为奖励。此外，随着 `Ethereum` 区块链演托管 `NFTs`、智能合约和 `DeFi` 交易，`Ether`\
  \ 的价值和需求持续增长。而且，`Ether` 的开发团队和创始人不断推动 `Ether` 在后开发的区块链和加密代币面前保持竞争力。\n\n最后，后来区块链开发者开发了与\
  \ `Ethereum` 兼容的代币和区块链，以便其用户能够从新的创新区块链中受益，而不会失去访问 `Ethereum` 区块链的收益。因此，很明显，将 `Ether`\
  \ 作为长期投资是有意义的。\n\n## 如何长期持有（HODL）\n\n如果你计划通过长期持有（HODLing）成为百万翁或创造跨代财富，你必须以正确的心态对待。在这一节中，我列出了作为加密货币投资者建立财富思维必须做的事情。\n\
  \n## 长期考虑\n\n记住，这是一种长期投资策略，而不是一种暴富计划。这里的真正秘密在于市场时间。你对技术的投资将服务于大众，并每年创造复利价值。因此，你现在的投入在未来可能会带给你\
  \ 10 倍、100 倍甚至 1000 倍的回。\n\n## 你必须播下财富的种子\n\n你对加密货币的初始投资就像种下一种子，让它生根，并随着时间的推移收获增长回报。\n\
  \n## 值得持有的加密货币\n\n以下是几种值得持有的加密货币，它们符合在我们基本分析中得分极高的标准，并有望为长期投资产生巨大的倍数效应。请参考书开头的链接获取我们的免费礼物。该报告对这些非凡的加密货币及其革命性区块链的独特品质进行了深度分析。\n\
  \n*   `Bitcoin Cash (BCH)`\n*   `Cardano (ADA)`\n*   `Theta (THETA)` & `Theta Fuel\
  \ (TFUEL)`\n\n本书中的信息仅代表观点，仅供参考。本书中的信息仅代表观点，仅供参考。\n\n在任何市场，尤其是数字资产市场，理解你投资的风险和动态是至关重要的。如果你不了解这些信息或不确定如何保护你的资产，请寻求专业的投资建议。为了确保你的长期成功和生存，请不要过度暴露风险，并记住注意你的风险。\n\
  \n## 通过定额成本法进行长期持有\n\n由于长期持有（HODLing）是一场持久战，而不是为了一夜暴富，因此你的策略是对你选择的区块链进行定额成本投入。什么是定额成本法？`Forbes`\
  \ 杂志将其定义为“一种在购买股票、交易交易基金（ETF）或共同基金时管理价格风险的策略。与其一次性以单一价格投资某特定证券，不如通过定额成本法将你想要投资的金额分成若干份，并在定期内分次买入小额。”\n\
  \n这种策略是以固定的间隔小额买入你值得持有的加密货币，而不是试图择机入市。当市场下跌时，多买一点；当出现大幅下跌时，买得更多。但永远记住，这些是你可以承受损失的钱，或者是你出于任何原因不需要钱。\n\
  \n## 准备好应对高低\n\n加密货币市场波动剧烈。如果你想获得长期持有的回报，你必须在市场波动期间坚持航向，并在目睹代币市值急剧上升或下跌时无所作为。但对投资策略的坚定是基于稳健的研究，正如前面所述。由于加密货币市场与基本世界的波动并不挂钩，很难择机和预测。简而言之，为你购买的每种代币制定一个投资策略，除非市场条件或其他因素值得你改变计划，否则请坚持。记住，你的成功取决于你何时买入和卖出的决定。因此，你的成功最终是你自己的责任。\n\
  \n## 现金\n\n将 20% 的投资资金保留为法币（例如 `USD`、`EUR`、`GBP`），以便在市场下跌或出现其他绝佳机会时购买代币。\n\n## 获利卖目标\n\
  \n设定你的卖出目标并坚持。记住，你的卖出目标基于你试图实现的财务目标（例如还债、交学费）。不要把目标定得太离谱（例如 10 亿美元、买一支 NBA 球队）。\n\
  \n\n\n\n\n请注意，这是盈利投资的关键之一。*成功的投资取决于设定正确的卖出目标，而不是在正确的时间出售。*¹⁸ 因此，当加密货币价格上涨时，请密切你的卖出目标。当市场价格达到你的卖出目标时，`SELL`\
  \ 持仓比例的 10% 到 20%。请注意，某些加密货币交易所提供自动卖出选项，按指定价格卖出。然而，`不要卖掉全部仓位`，因为币价可能会再次上涨。例如，假设你投资了一个代币\
  \ $1,000，当市场上涨时，你的投资现在变成了 $2,000，而不是卖掉全部 $2,000 的仓位。你卖出仓位的 20%，即 $400，你仍然持有价值 $1,600\
  \ 的投资。当你的币价再次翻倍并达到 $3,200 时，再次卖出 20%，赚取 $640 的利润。因此，你的收益是 $400 和 $640，超过了你最初的 $1,000\
  \ 投资——而你仍持有价值 $2,560 的投资。随着币价持续上涨，继续增量地卖出 10% 到 20% 的持仓。一旦市场开始下跌，你可以决定是否通过`dollar-cost\
  \ averaging` 将收益投回，或者使用利润偿还或购买你为财务目标设定的任何东西。记住，这是一个长战；可能需要几个月甚至几年才能达到卖出目标。保持耐心，要知道你已经种下了财富的种子并正在收获回报。\n\
  \n你必须记住，你的卖出目标是基于币价值的。如果你有一个低价值代币，期望其市场价格上涨到比特币的水平是愚蠢的。当然，这可能会发生，但你应该根据代币的潜在市场成功和需求为它们设定现实的卖出目标。\n\
  \n### 加入社区\n\n不要单打独斗！全球数百万加密投资者正刚刚开始，学习市场，并尝试建立跨世代的财富。你可以从他们那里学习、获得支持并鼓励，但你必须努力成为加密社区的一部分。你可能会在线或当地发现一些优秀的投资小组、投资大师或讨论论坛。敞开自己，去结识加密爱好者并扩大你的加密网络。\n\
  \n让我们回顾你的 HODL 计划：\n\n*   进入 HODL 计划的最佳方式是对你的加密货币投资进行`dollar-cost average`。不要一次性全部投入。\n\
  *   在市场大幅上涨之前，尽早设定你的卖出目标。始终跟踪你加密货币的原始购买价格。\n*   记住，现金也是一种寸。始终保留现金储备，以便在价格下跌时买入。\n\
  \n## 再投资你的利润\n\n再投资对投资者来说是一个巨大的挑战，因为这意味着投资者已成功从市场中获利。然而，这也意味着你必须决定何时获得了足够的利润，以及何时等待更多利润。\n\
  \n在从投资中提取利润之前，问自己以下问题：\n\n*   我为什么要买这个代币？\n*   我对这个加密代币的投资目标是什么？\n*   我持有这个代币感到舒适吗，还是卖掉部分投资对我更好？\n\
  *   在什么种点我对获利感到舒适（50%、100%、300%、500% 等）？\n*   我的收益是否有更好的投资机会？\n\n当你决定从投资中提取出一部分利润后，应该立即对其进行再投资。然而，在再投资之前，你应该对你的选择进行彻底研究，并根据你的目标、财务状况和时间限制做出最佳决策。\n\
  \n再投资利润时，你可能考虑的一些投资包括：\n\n*   加密挖掘\n*   投资新的加密代币\n*   租赁物业\n*   偿还你当前的债务（例如：信用卡、房贷、学贷款）\n\
  *   HODLing（长期持有）\n\n如果你不想出售你的加密代币，并希望在持有它们的同时从中获利，你可以采取以下操作：\n\n*   将你的加密代币借给其他加密投资者（即`P2P\
  \ loans`）\n*   参与短期加密交易以获取快速利润，即在一个交易所低价买入代币，并立即在另一个交易所高价卖出（即`arbitrage`）\n\n##\
  \ 投资组合多元化\n\n当你再投资利润时，你的目标应该是收益最大化、损失最小化并降低整体风险。为了对市场低迷，尝试投资受不同市场状况影响的资产。此外，通过在股票和加密市场之外的资产类别中分散你的投资也将受益。\n\
  \n## 投资加密货币时不要的事\n\n大多数加密投资者失败是因为他们在管理加密货币投资时没有保持冷静、中立的心态。尽管他们打算坚持投资策略，但他们往往会成为\
  \ FUD（恐惧、不确定、怀疑）和 FOMO（错失恐惧）的受害者。让我们检查 FUD 和 FOMO，看看你是否正落入圈套。\n\n### FUD\n\n大多数加密投资者是情绪化交易者。他们的情绪往往决定了他们对市场变化的反应。有趣的是，FUD\
  \ 可以影响个人、投资小组和社区——甚至可以成为一种市场特征的感觉。\n\n*   **恐惧 (Fear)** – 恐惧源于过度担心你会遭受财务损失或无法实现财务状况最大化。这也是由于对自己的投资策略、直觉或过程缺乏信心引起的感觉。\n\
  *   **不确定 (Uncertainty)** – 不确定性是加密投资中一种难以抑制和隔离的感觉，因为加密市场具有波动性、不可预测性、与现实需求脱节且具有高度投机性。加密世界中没有人能确定任何事情。此外，加密代币的价值可以在不到一个月内增加\
  \ 1000%，然后在几周后下跌超过 5000%。不知道代币价格是否会再次反弹、何时反弹以及它将保持强势多久，这种瘫痪的不确定性阻碍了一些最优秀的投资计划和策略。\n\
  *   **怀疑 (Doubt)** – 怀疑是一种隐性的感觉，尽管有些人竭力以理性、经过计算的方式进行投资，仍受其困扰。投资者可能会执结于自己是否做得足够以保护投资、最小化损失和最大化收益。此外，当加密市场的波动性和不可预测性使你深思熟虑的投资计划和策略变得毫无意义时，这种感觉很难根除或抑制。不幸的是，极具可能的投资者会因为自我怀疑而屈协，因为他们想避免过去遭受的市场损失，并做出那个最后一时刻的投资决策，以避免像某些加密投资同行一样遭受财务毁灭。\n\
  \n#### 击败 FUD\n\n你可以通过以下方法击败 FUD：\n\n*   设定清晰可行的投资目标和里程碑。\n*   保持多元化的投资组合。\n*  \
  \ 识别 FUD 何时占据你，并为此制定应对机制。你的目标是显著减少——如果不是消除——并控制它。\n*   设定在市场中采取特定行动的指南，除非少数情况下否则不要偏离计划。\n\
  *   记录你何时交易资产、为什么交易以及交易的结果。\n*   关注市场以及你投资组合中的加密资产的动态。你对加密市场的知识和市场交易经验将帮助你远离 FUD，并防止你成为其受害者。\n\
  \n### FOMO\n\n\n\n\n\nFOMO，或“错失恐惧症”，驱动了大量的加密货币投资。大多数投资者梦想通过购买加密货币代（例如 `Bitcoin`、`Ether`、`Dogecoin`、`Shiba`）将几千美元变成数百万。这是一种强大的驱动力，随着普通人成为加密货币投资者，它导致了一些受害者，并可能引发巨大的混乱。\n\
  \n## FOMO 为诈骗者和欺诈者创造了完美猎物\n加密货币诈骗者和欺诈者从 FOMO 中获取巨额利润，他们推销庞氏骗、金字塔骗、地毯攻击（rug pulls）、拉高出货（pump\
  \ and dump）、推广计划和其他欺诈方案。遗憾的是，人们不想被排除在活动之外。这种欲望会让他们抛弃顾虑，利用有限的知识做出错误的决定。\n\n## FOMO：经济不确定性的虚假良药\n\
  FOMO 本质上是一种群体心理，它剥夺了投资者做出明智决策的正确心态。FOMO 迫使普通投资者在不理解区块链技术的情况下进行加密货币投资。在这些动荡和全球低迷的时期，人们正在寻找替代收入来源来支持自己、资助退休，并为后代留下什么。\n\
  \n## FOMO 迫使普通投资者进行不负责的投资\n当普通人读到加密货币投资者还清了房贷、贷款和信用卡债时，他们也想获得赚那种钱的机会。遗憾的是，大多数进入加密货币市场的普通投资者并不了解风险，没有仔细研究他们的投资，也没有明确的投资策略和目标。简而言之，他们是寻找易于猎物的老练诈骗者和欺诈者的完美受害者。此外，许多人甚至负债投资加密货币（例如从银行取款）。遗憾的是，信贷投资是一种禁忌策略，因为加密货币投资者可能随时失去所有投资资金。现在，遗憾的是，我们看到投资者冒着损失退休资金和支付生活费用能力（例如房贷、公用事业）的风险，换取可能获利的机会。\n\
  \n## FOMO 降低了投资者的抑制力\nFOMO 降低了投资者做出风险决策的抑制力。作为 FOMO 的反应，他们更有可能做出冲动决定，承担超出承受能力的风险，并参与缺乏理性推理的行为。因此，虽然加密货币爱好者对越来越多的人购买加密货币感到兴奋，但人们非常担心新投资者正在冒过度的储蓄风险。新手和缺乏经验投资者无法在极端遗憾的情况下放弃他们的加密货币损失，并在不负责任地参与加密货币市场。\n\
  \n## 击败 FOMO\n要击败 FOMO，你必须接受你无法抓住每一个加密货币浪。你必须承认加密货币投资是赌博，市场和其他所有投资者一样存在风险，而且最好的投资计划和策略并不有效。尽管如此，你不能仅仅盲目跟随他人，因为他们看起来表现良好并精通市场。接受你必须考虑投资目标和里程碑，做出经过充分推理和仔细研究的决定以击败\
  \ FOMO。对于加密货币投资者要成为百万翁并创造跨代财富来说，YOLO（人生只有一次）和 *carpe diem*（及时行）也不是你应该拥抱的投资口号。\n\n\
  ## 决定行动\n信息的质量和来源声誉取决于你的感知。当建议是免费的时，人们往往会忽视它而不采取行动。然而，当他们必须牺牲时间、金钱和能量来获取时，它就会变得更有价值，人们更有可能采取行动并赋予其巨大的价值。因此，当你投入某事中时，你更有可能付诸行动。\n\
  \n此时，你已经投入了时间、金钱和思想来学习加密投资以及如何创造跨代财富。然而，为了完成实现目标的之旅，你必须做一件事：\n\n**现在就行动！！！**\n\n\
  # 第 9 章：你的加密货币税务指南\n\n## 核心信息\n*美国国税局（IRS）期望加密货币投资者对其加密货币投资交税。虽然税务报告要求、征税和税务触发因素仍在完善中，但根据法律，你需要报告你的加密货币资产、持仓和清算情况。*\n\
  \n本章提供的信息税务建议，而是税务教育。本加密货币投资入门指南只能为你提供开始加密货币投资之旅的基础知识。在本章中，你将回顾加密货币税收的基础知识，以及在美国为了税务合规你必须做的事情。与其他任何重要事项一样，你应该寻求具有处理加密货币经验的税务律师、税务会计师或报税人员的税务指导。\n\
  \n## 美国国税局与加密货币税务\n美国国税局（IRS）（又称老山姆）想要从你的加密利润中分一杯。幸运的是，你可以从资本利得和所得税中扣除加密货币损失。你将支付的最高资本利得税为\
  \ 20%，支付的最高所得税为 37%。虽然某些关于加密货币的税务指南是清晰的，但其他是模糊的。例如，目前尚不清楚 IRS 短期内会对某些交易（例如 `DeFi\
  \ protocols`）征税。\n\n## 加密货币带来了税务义务\n[content]\n加密货币为你提供了积累巨大财富的极大机会。但遗憾的是，它也可能让你陷入税务审计，并因为未缴税而支付巨额费用。\n\
  \n与所有投资一样，IRS 想要从你的财富中分一杯羹并了解你的资产。为了正确报告这些信息，你必须记录你在加密货币账户上进行的一切（例如：购买、卖出、交易、质押、挖矿）。此外，你甚至可以选择使用加密货币税务软件来报税。\n\
  \n你的加密货币、加密钱包、加密交易和加密货币投资并不属于一个能产生税务报表或表格或具有内置会计系统的组织系统。\n\n建立财富并避免与 IRS 产生问题的部分在于记录你的加密货币交易、持仓和投资。为了做到这一点，你必须建立一个有组织的系统，可以在其中输入有关加密货币投资的信息。\n\
  \n如果你组织良好，有一套完善的系统，记录所有的交易数据，并对投资组合有清晰的了解，你在报税期间会表现良好，且不会因为错误报告税务而亏钱。\n\n## 加密货币税务基础\n\
  你有义务对你的加密货币收益纳税，并允许从收入和投资利得中扣除损失。目前，IRS 无法完全追踪你的加密税务义务。然而，IRS 仍然可能知道你从加密货币投资中赚了多少钱。\n\
  \n\n\n\n\n美国政府已开始要求加密交易所记录谁向谁发送了资金，以及你以法币货币发送和兑回的金额。其目的是防止加密货币投资者参与非法交易和资助恐怖主义。为了实现这一点，他们开始要求加密交易所报告兑回的加密货币，并对在加密交易所提现的交易保留记录。\n\
  \n由于你是初级加密货币投资者，我们将关注你可能需要支付的加密税：资本利得税和普通所得税。请注意，美国税务局（IRS）将加密货币视为财产。\n\n即使你以盈利的价格出售证券，也会产生资本利得税。如果你持有证券的时间于一年，则属于短期资本利得，被视为收入。然而，在出售前持有加密货币超过一年则属于长期资本利得。因此，长期资本利得的税率低于所得。\n\
  \n长期资本利得税率取决于你的所得税层级，在联邦层面可能为 0%、15% 或 20%。此外，高收入纳税人可能需要对其资本利得或其他款项缴纳 `3.8%` 的净投资收益税。\n\
  \n## 应纳税加密货币交易\n\n### 交易加密货币\n当你使用法币购买加密货币时，这不属于纳税事件。然而，如果你用一种加密货币交易另一种加密货币，例如用一种加密代币交易另一种加密代币（例如，用\
  \ `Bitcoin` 购买 `Ether`），这被视为纳税事件。此外，如果由于加密交易导致你的资产价值增加，这些收益可能需要纳税。\n\n### 兑回加密货币\n\
  如果你将加密货币兑换为法币、贵金属或宝石、房产或其他资产，则会触发纳税事件。如果你在兑回加密货币时获利（卖价高于买价），你必须为资本利得纳税。但是，如果你在出售加密货币时亏损（卖价低于买价），你可以使用亏损来减少你的资本利得税或所得税。\n\
  \n### 应纳税普通所得\n如果你因提供服务或商品而获得加密货币报酬或奖励，你的收益将作为普通所得征税。例如，如果你的工作以加密货币支付工资，这些资金将作为普通所得征税。此外，通过质押和挖掘加密货币获得的任何收入都被视为普通所得。此外，作为质押和挖掘活动奖励而获得的任何加密货币将作为普通所得征税。\n\
  \n### 用于商品和服务的加密货币\n用于支付商品和服务的加密货币可能作为普通所得或资本利得征税，这取决于你购买和花费加密代币的时间。此类支付可能包括创建 `smart\
  \ contracts` 的费用、支付区块链交易费、支付加密相关服务费用以及任何其他可以证明为合理加密相关支出的费用。\n\n### 非纳税加密事件\n某些加密交易不会触发加密货币税的缴纳。在参与这些交易时，你必须保留良好的记录，以便你的税务律师/会计师能够充分说明每个加密事件，并在\
  \ IRS 审计你时，你可以提供相关的书面证据。\n\n- **捐赠**\n假设你捐赠了加密货币，且没有收到任何服务、商品或其他价值作为交换。在这种情况下，你可以将你的加密货币捐赠申请慈善税抵扣，前提是你的捐赠对象是\
  \ `501(c)(3)` 慈善机构。\n\n- **赠与**\n你可以向家人及等人赠送加密货币，而无需为赠与纳税。但是，你可以送给接收者的金额有终身限制。\n\
  \n- **购买并持有加密货币**\n对于选择购买并持有（又称 `HODL`）加密货币的人，IRS 不要求你在出售或交易所购买的加密货币之前支付任何税。相反，你的税费将基于你持有加密货币的时间、该年度资本利得与亏损的差额、税收抵扣以及普通所得税率。\n\
  \n- **在加密钱包/账户之间传输加密货币**\n在不同的加密钱包/账户之间传输加密货币不是纳税事件。因此，将你的加密代币从中心化交易所移动到你的加密钱包不会触发税务事件，将加密货币从一个钱包移动到另一个也不会触发税务事件。\n\
  \n## 可能纳税的加密货币交易\n\n- 以加密货币支付的工资\n- 以加密货币支付商品和服务（例如，转账费）\n- 将加密代币兑换为法币\n- 使用加密代币支付商品和服务\n\
  - `P2P` 加密贷款的利息\n- 通过挖掘、质押和流动性池获得的加密代币\n- 推荐奖励（例如，`Binance` 推荐）\n- 从“学习赚币”活动获得的加密代币（例如，`Coinbase\
  \ Earn`、`CoinMarketCap Earn`）\n- 从看视频赚币平台获得的加密货币（例如，`Odyssey`）\n- 从浏览赚币平台获得的加密货币（例如，`Permission.io`\
  \ 浏览器扩展、`Brave browser`）\n- 从玩游戏赚币 (`P2E`) 游戏获得的加密货币\n- 从购物赚币平台获得的加密货币（例如，`Lolli`）\n\
  - 从共享地址赚币平台获得的加密货币（例如，`Moon Faucet`）\n- 使用稳定币购买加密代币\n- 在加密钱包之间移动加密货币收取的传输费\n- 通过空投和区块链硬分获取的加密代币\n\
  - 通过出售、交易和花费通过空投和区块链硬分获取的加密代币而获得的代币和法币\n- 在你收到赠送代币后，对其进行兑回、交易和用于支付商品服务的交易\n\n##\
  \ 免税加密货币交易\n\n加密货币持有者不需要对以下内容纳税：\n\n- 使用法币购买加密代币（例如，`USD`、`GBP`、`JPY`、`EUR`）\n-\
  \ `HODLing` 加密货币\n- 在加密钱包之间传输加密货币（但是，费用可能需要纳税）\n- 向 `501(c)(3)` 批准的慈善机构捐赠加密货币\n\
  - 在以下条件下向他人赠送加密货币：\n    - 2021 年最多赠送 `$15,000`，2022 年为 `$16,000`\n    - 每位接收者的终身限制：2021\
  \ 年为 1170 万美元，2022 年为 1216 万美元\n- 创建 `NFTs`\n\n注意：此外，区块链硬分不征收税，因为平台用户在硬分启动时不会收到新代币。\n\
  \n\n\n\n\n对于传统的股票投资，如果你想在亏损卖股时进行税收扣除，你不能在 30 天内卖出该股票并以更低的价格买回。同样，如果你在 30 天内买回了你亏损卖出的同一股票，你将被不允许从税款中扣除该损失。\n\
  \n在加密资产方面，美国国税务局（IRS）尚未禁止在 30 天内亏损出售加密货币并在价格较低时买回相同的加密货币代币。然而，如果你这样做，IRS 可能会对你进行审计。如果\
  \ IRS 审计了你并认定你的加密货币交易缺乏“经济实质”，那么你将无法使用这些扣除项来抵消你的税务义务。\n\n最终，你必须决定是否愿意为了在卖出亏损代币后不到\
  \ 30 天内买回该代币而承担 IRS 审计的风险——或者你是否准备好放弃在不到 30 天内买回亏损卖出的加密货币可能获得的潜在利润。\n\n## 短期与长期资本利得税率表\n\
  \n### 短期资本利得定义\n短期资本利得是指获得资产后不足一年即出售所获得的利润，并按普通收入征税。例如，日内交易者持有加密货币代币不足一年的所获利润将按常规收入征税。\n\
  \n如果你对加密货币代币的处置符合短期资本利得/损失的定义，那么它将视视为普通收入。因此，你应该将这些收益/利润加入你的普通收入，并从你的普通收入中扣除损失。\n\
  \n2021 年和 2022 年的联邦普通税率表列如下。\n\n### 长期资本利得定义\n长期资本利得是指持有一年或以上后出售的资产（例如：兑换为法币、交易或用于支付商品和服务）。根据你纳税年度的普通收入税率档和资本利得情况，它们将按\
  \ 0%、15% 和 20% 的税率征税。\n\n长期资本利得税率表列如下。\n\n只有当纳税人的普通收入和资本利得少于 0% 税率档列出的最高金额时，才适用\
  \ 0% 的税率。\n\n### 通用加密货币税务信息\n* 所有属于应税事件的加密交易都必须向 IRS 报告。\n* 当你在钱包之间转移加密货币、持有（HODL）加密货币、向\
  \ 501(c)(3) 慈善机构捐赠加密货币、赠加密货币（适用某些条件）或使用法币购买加密货币时，你不需要为这些交易纳税。\n* 所有在美国获得许可的主要加密交易所必须对其平台用户完成了解您的客户（KYC）协议。\n\
  * 当你使用法币购买加密货币代币时，加密交易所会收集并存储你的银行信息。\n* 当你将加密货币代币转入交易所的托管加密钱包时，加密交易所会将托管加密货币钱包与其所有者进行匹配。\n\
  * 许多加密交易所正在向 IRS 及其平台用户发送 1099 表格。\n* IRS 将加密货币代币视为财产。当你出售、交易或使用加密货币支付商品和服务时，你必须对这些交易纳税，并且必须支付资本利得税和所得税。\n\
  * IRS 在针对几家加密交易所的诉讼中胜诉（例如 Kraken、Poloniex、Coinbase）。法官在这些案件中裁定，加密交易所必须与 IRS 共享其平台用户的数据。\n\
  \n## 通用加密货币税务报告基础\n\n在确定你纳税年度的税务责任时，你必须小心执行以下操作：\n* 仔细检查你每笔加密交易详情。\n* 了解每个加密货币代币的成本基础（原始购买价格）。\n\
  * 了解每个加密货币代币的公平市场价值（FMV）。\n* 计算在处置每个加密货币代币时是赚了钱还是遭受了损失。\n* 识别每笔交易应分配为长期或短期资本利得/损失。\n\
  * 填写正确的税务表格并将其提交给 IRS（附带所需的证明文件）。\n* 将你的加密货币记录保留至少 6 年，因为 IRS 可以在你报税后对你进行长达 6 年的审计。\n\
  \n### 确定加密货币代币的成本基础\n代币的成本基础是你获得代币当日的成本。如果你通过加密投资获得了奖励的加密货币（例如：空投），那么你必须使用该代币在授予时的\
  \ `FMV`。对于被赠送或捐赠给你（或你的组织）的代币，你应该使用原始加密货币代币持有者记录的成本基础，或赠送/捐赠给你当天该加密货币代币的 `FMV`。\n\
  \n请注意，你对加密交易只能使用一种会计方法。加密货币持有者最常用的会计系统类型是先进先出（`FIFO`）、后进先出（`LIFO`）、高进先出（`HIFO`）和指定日期法。\n\
  \n请咨询税务会计师、律师或税务专业人士（例如：税务申报、记账员）。他们可以解释各种方法的优缺点。\n\n为了方便记录加密交易，请确定交易应按资本利得还是普通收入征税，并提交相应的税务表格。\n\
  \n## 缴纳加密货币税\n加密货币税在你缴纳年度税时缴纳。但假设你受到其他税务安排（例如：海外纳税人），在这种情况下，你应该咨询会计师或律师了解如何缴纳加密货币税。税务专业人士可以帮助你避免欠交税务义务而产生的罚款和利息。\n\
  \n## 你需要的税务表格\n\n### 8949 表\n* 适用人群：在财年内有资本利得或亏损的纳税人。\n* 所需信息：必须输入所有加密处置数据。你需要将数据分为短期和长期持有期。\n\
  \n### D 表（1040 表）\n* 适用人群：在财年内有资本利得或亏损的纳税人。\n* 所需信息：该表汇总了 `8949 表`，并包含了当年的短期和长期资本利得/损失。\n\
  \n### 1 表（1040 表）\n* 适用人群：在财年内从加密货币获得某种形式收入的纳税人。\n* 所需信息：在表格第 8 行输入你的加密交易总收入。\n\n\
  ### FBAR（海外银行和金融账户报告）\n* 适用人群：在财年内任何时间，非美国交易所的法币或特定外国金融资产总价值超过 10,000 美元的纳税人必须提交\
  \ `FBAR`。\n* 所需信息：必须输入外国账户详情以及你在财年内内的最高法币价值。\n\n### FATCA（海外账户税务合规法）\n* 适用人群：在财年最后一天法币或特定外国金融资产价值超过\
  \ 50,000 美元，或在财年内任何时间在非美国交易所超过 75,000 美元的纳税人。\n* 所需信息：必须输入外国账户详情，以及你在财年内的最高法币价值和期末余额。\n\
  \n\n\n\n如果您拥有的加密货币交易较少或数量很少，可以手动填写 `Form 8949`。然而，假设您在一年中通过多个交易所进行了多次加密货币交易，并使用了大量的钱包。在这种情况下，要将所有交易整合在一起以确定您的盈亏可能是一项非常耗时的任务。因此，你可以利用在线加密货币税收服务，它可以帮助你整合所有的加密货币交易并自动生成\
  \ `Form 8949`。\n\n## 手动申报加密货币税款\n\n*   填写 `Form 8949`。要做到这一点，你必须输入在纳税年度内处置的所有应纳税加密货币。\n\
  *   在 `Form Schedule D` 上报告来自 `Form 8949` 的所有净加密货币资本收益和亏损（包括短期和长期收益和亏损）。\n*   在\
  \ `Form Schedule 1` 上报告您来自空投、区块链硬分叉、流动性池、奖金、推荐奖励等的加密货币收入。\n*   自雇或经营加密货币业务且有加密货币收入的纳税人必须填写\
  \ `Form Schedule C`。\n*   完成您的纳税表 `Form 1040`，并将您完成的其他表格附在您的税务申报中。\n*   将填写后的表格提交给\
  \ `IRS`（美国国税务局）。\n\n## 使用加密货币在线报税软件\n\n您可以参考本书的附录部分获取关于加密货币税收申报软件的建议。但为了准备使用在线报税软件，您需要将所有的交易数据组织在一个地方。请参阅下方关于创建文件夹文件系统以整合所有加密货币交易所和钱包交易详情的建议。\n\
  \n## 管理原始加密货币交易数据\n\n1. 下载您加密货币交易所和钱包的所有交易数据。\n2. 在该文件夹创建一个名为 `Tax Year`（纳税年度）的文件夹。在\
  \ `Tax Year` 文件夹中，为当年使用过的每个加密交易所创建一个文件夹。`DOWNLOADED-RAW` 文件夹将包含您直接从交易所或钱包下载的所有交易数据。其理念是让下载的数据完全不经修改。`MODIFIED-IMPORT`\
  \ 文件夹将包含税收软件为了正确导入所需的任何格式更改。\n\n示例：\n\n```\n2022/Coinbase/DOWNLOADED-RAW\n2022/Coinbase/MODIFIED-IMPORT\n\
  2022/EXODUS-WALLET/DOWNLOADED-RAW\n2022/EXODUS-WALLET/MODIFIED-IMPORT\n```\n\n在每个\
  \ `MODIFIED-IMPORT` 文件夹中，使用文件名格式 `{exchange/wallet}-{tax year}-{today’s date in\
  \ mm-dd-yy}-IMPORT.xls` 包含年度交易数据。\n\n**示例：** `Coinbase-2022-04-01-2023-IMPORT.xls`\n\
  \n不要更改 `DOWNLOADED-RAW` 文件夹中从交易所或钱包下载的文件名。以下是加密货币交易所或钱包存储在交易日志中的示例（例如列标题）：\n\n*\
  \   日期（格式）（例如 `01 Jan 2022 12:00:00 GMT`）\n*   交易类型（买/卖/交易/挖矿奖励）\n*   出售的币数量\n*\
  \   出售的币价格\n*   出售的币名称\n*   购买的币数量\n*   购买的币种名称\n*   以美元计算的购买币价格（成本基准）\n*   交易费用\n\
  *   加密货币交易所\n*   加密货币交易所所在的司法管辖区（例如美国、加拿大、瑞士）\n\n将所有的交易数据归档到这些文件夹中，当税季到来时，你将拥有一个所有税务数据的仓库，可以将其导入到报税软件中。加密货币税软件会自动生成您的\
  \ `Form 8949`，然后你可以将其发送给会计师或使用可以完成该表的软件。你必须将所有表格提交给 `IRS`。可以考虑 `TurboTax` 和 `TaxAct`。\n\
  \n## 创建您的加密货币主组合\n\n跟踪加密货币持仓量、收益和亏损的一种极佳方法是创建一个主组合，以便在完成纳税表所需的记录。然后，你可以参考以下内容来解决加密货币问题。\n\
  \n创建主组合的过程如下：\n\n*   使用加密货币服务创建主组合以查看代币总额。其中一些网站提供免费服务，如 `CoinGecko`。\n*   通过代币跟踪网站准确记录您的交易，这将帮助您保持信息更新。\n\
  \n## 结论\n\n我们刚刚经历了一场精彩的加密货币发现之旅！自从从第一章开始，这是一段非常棒的旅程。首先，我们有了一个秘密蓝图，帮助您处于正确的状态，以进行加密货币投资冒险。此外，我们决定让加密货币投资主要服务于我们的目标，并且我们不会怀疑自己或让情绪控制我们的决策。我们学习开始建立基础知识。\n\
  \n为了帮助建立加密货币的基础知识，我们回溯了过去，看看社会和国家传统是如何使用物品作为财富的。随着我们进入现代，解决方案正在变得变得数字化。了解货币如何随时间推移保持财富价值以及这些货币经历的所有挑战，是帮助您评估并找到可以投资的区块链和加密货币的第一步。\n\
  \n\n\n此外，我们研究了评估和选择加密货币交易所的方法，以及中心化交易所与去中心化交易所之间的差异。更重要的是，我们发现了保护加密货币免受骗子或试图获取我们私钥的黑客侵害的方法。所以，如果某个名人给你发邮件，要求你分享私钥以参加抽奖，现在你知道要\
  \ `stay far away` 了！我们还学习了通过不落入硬销（shilling）诈陷阱或不参与骗子的不对称赠送活动来保护我们的加密投资。如果一件事好得不可真实，那么它很可能不是真的。\n\
  \n当你开启加密货币之旅时，所有这些基础知识都关重要。你不希望错过这些保护数字资产的方法，否则这将是一次非常昂贵的经历。\n\n随后，我们评估了通过基本面分析和技术分析投资加密货币的方法。对于技术分析，如果你花时间练习阅读\
  \ K 线图以识别看涨或看跌指标，将帮助你提升交易技能，并为让加密货币投资成为实现财务目标和梦想的一种提供新见解。然后我们进入了一个关键且兴奋的话题：利用区块链的独特特性创造跨代财富的可能性和机会。加密货币尚未实现大规模普及，其巨大的倍增效应仍然广泛可用。总而言之，区块链革命和这些投资倍增器的可用创造了一个独特的机会，普通人可以创造巨额财富并将其传下一代。\n\
  \n最后，我们采取了必要的预防措施，学习了加密货币税收以及整合和组织所有交易所交易日志的重要性，以便在纳税季到来时，你准备好为会计师生成所需的税务文件。此外，我们还学习了管理税收的方法，这样我们不必花费无数小时来创建报表。现在，我们可以通过不断构建概览投资组合来跟踪加密货币的盈亏，从而避免所有的头疼问题。\n\
  \n最后，我恳请你采取行动！继续你的加密货币探索之旅，继续建立你的投资技能和专业知识。我保证，正如我们在开头说的那样，一旦你下决心、投入努力、获取最佳信息并不断练习，你将在实现财务和个人目标方面变得越来越出色。你将拥有巨大的能力，让这个时代的革命性技术为你的财务需求、目标和梦想服务。\n\
