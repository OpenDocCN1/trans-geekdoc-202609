  \n![](img/image00147.jpeg)![](img/image00143.jpeg)\n\n## 第二章\n\n# 对加密货币世界持有正确的观点\n\
  \n**核心要点**\n\n* 加密货币是金钱的最新演变。\n* 区块链技术实现了无边界、去信任的点对点交易。\n* 它还开启了传统金融之外的许多交易类型。\n\
  \n## 为什么加密货币如此重要？\n\n加密货币为普通人提供了真正的财务主权和跨越世代的财富创造潜力。那些意识到收益机会的人会在合适的时刻进行投资；随着采用率的增长，它获得了社会动力，直到加密货币变得无处不在——惠及任何寻求财务独立或通过战略投资实现跨代财富积累的人。\n\
  \n**货币的定义**\n\n货币作为社会对劳动生产力价值的共同衡量标准，适用于人类和物品；被共识接受的货币作为商品和服务的介质，因此社区使用这种社会认可的货币来评估物品价值\n\
  \n## 货币的历史\n\n货币系统从物物交换向数字货币演进⁴让我们看看社会是如何从交换服务/商品转向通过互联网传输电子数据的：\n\n### 物物交换\n在广泛的物物交换系统下，参与者直接交换其他商品/服务，例如：鞋匠用鞋子换木匠的木桌子，但供应限制防止了直接交换，需要多个中间步骤，例如寻找愿意交易牛的人，然后进行一系列交易，最终在收到牛后再次交换目标物品，例如鞋匠可能需要找到接受鞋的人收到牛，最后获得想要的桌子。当首选商品不可用时就会出现问题，需要间接路线，导致效率低下、时间、精力和能量资源的浪费，整个系统效率低下，阻碍了经济增长和繁荣，普遍需求需要改进，因此转向了自然物品、主权国家货币、金属、纸质金本等，每种货币解决了之前方法的特定缺点，现代经济继续完善了更可靠、可扩展、高效的替代方案。\n\
  \n\n\n在 19 世纪下半叶，各国政府决定以黄金作为货币 backing。与其他国家的纸币相比，由黄金支持的纸币更易于交换；因此，这些国家比未依赖黄金背书的本地发行纸币更广泛接受\
  \ **gold-backed paper money**。原因在于：持有 `gold`-backed 纸钱时，可前往银行或财务机构将该 `paper` 换成对应价值的\
  \ `gold`。\n\n### *Fiat Currency – Paper Money without the Gold Standard*\n\n20 世纪初至\
  \ 30 年代，**the** [standard](https://en.wikipedia.org/wiki/Gold_standard) 被一些国家退出。这些民族希望\
  \ **[to] increase** `[amount]` 的流通量而不必增加 `[need]` 的储备——即无抵押印钞。**By this decade**,所有国家均已放弃\
  \ fractional reserves（仅部分流通额度被资产担保）。简言之：**does not support entire supply**。\n\n\
  这种新型 fiat‑based 体系使中央银行为所欲打印大量货币却毫无实物后盾其核心问题：政府可以随意增发票据导致购买力衰减举例说明快速资本缩水引起通胀社会长期拥有能力下降\n\
  \n### *Credit Cards*\n\n二十世纪初 金融机构推出信用卡最初主要服务富裕、名声显赫且人脉关系密切的人士随后逐步向全社会开放信用卡公司先垫款相信持卡人最终会偿还从而获利多家提供商开始提供高息低余额选项特别面向收入较低阶层这类群体常把刷卡视为基本生活费娱乐紧急支出但因收入难以覆盖花销导致债务累积\
