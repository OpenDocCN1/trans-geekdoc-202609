  - 案例研究 - 健康丰收园艺者与区块链革命
- - '##'
  - 让我们通过社区园艺者用农产品交换加密货币的视角，来看看我们学到的区块链知识。Liam 是当地社区园艺小组 Wholesome Bounty Gardeners
    的成员，成员之间互相交易农产品。他创建了名为 `WBG Blockchain` 区块币的交易，被称为“花园币”。区块链如何提供帮助？他知道需要存储不可篡的交易数据，防止被黑客更改硬币数量，链引用之前的标识符，一旦创建就无法更改，称为不可篡改账本。他不想只在自己的电脑上运行，因此将其写入多台计算机，实现去中心化控制，节点点对点无需权威。那么，他为什么没有权限呢？所有账户都在区块链上，去信任的设计显示了生成的私钥对接收公钥，对等发送、分发、私用查看、发送链接。`PrivateKeyExample`
    示例看起来像 [8efe77fc...bcbce][有人猜到重复密钥是不可能的，因为空间大小与沙子和原子相比]
