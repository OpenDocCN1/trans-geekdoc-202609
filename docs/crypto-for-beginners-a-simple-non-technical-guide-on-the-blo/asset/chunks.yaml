    you can manually fill out `Form 8949`. However, suppose you have made many cryptocurrency
    transactions throughout the year on multiple exchanges and used numerous wallets.
    In that case, it might be quite a lengthy task to stitch all the transactions
    together to determine your gains or losses. So instead, you can leverage an online
    crypto tax service that helps you stitch all the cryptocurrency transactions together
    and automatically generate `Form 8949`.


    ## MANUALLY FILING YOUR CRYPTO TAXES


    * Complete `Form 8949`. To do this, you must enter all taxable crypto you disposed
    of during the tax year.

    * Report all net crypto capital gains and losses from `Form 8949` on `Form Schedule
    D` (includes short-term and long-term gains and losses).

    * Report your crypto income from airdrops and blockchain hard forks, liquidity
    pools, bonuses, referral rewards, etc., on `Form Schedule 1`.

    * Taxpayers who are self-employed or running a crypto business and have crypto
    income must complete `Form Schedule C`.

    * Complete your tax return, `Form 1040`, and attach the other forms you completed
    to your tax filing.

    * File the completed forms with the `IRS`.


    ## USING A CRYPTOCURRENCY ONLINE TAX PREPARATION SOFTWARE


    You can reference the appendix section in this book for recommendations on cryptocurrency
    tax filing software. But to prepare for using the online tax software, you need
    to organize all your transaction data in one place. See the recommendations below
    on creating a folder file system to consolidate all your cryptocurrency exchange
    and wallet transaction details.


    ## MANAGE RAW CRYPTOCURRENCY TRANSACTIONAL DATA


    1. Download all your transaction data for your cryptocurrency exchanges and wallets.

    2. Create a folder called `Tax Year` in that folder. In the `Tax Year` folder,
    create folders for each crypto exchange you worked with during that year. The
    `DOWNLOADED-RAW` folder will contain all the transaction data you downloaded directly
    from the exchange or wallet. The idea is to have the downloaded data completely
    unmodified. The `MODIFIED-IMPORT` folder will contain any formatting changes required
    by the tax software for it to be correctly imported.


    Example:


    ```

    2022/Coinbase/DOWNLOADED-RAW

    2022/Coinbase/MODIFIED-IMPORT

    2022/EXODUS-WALLET/DOWNLOADED-RAW

    2022/EXODUS-WALLET/MODIFIED-IMPORT

    ```


    Within each `MODIFIED-IMPORT` folder, include the transaction data for the year
    using the file name format `{exchange/wallet}-{tax year}-{today’s date in mm-dd-yy}-IMPORT.xls`.


    **Example:** `Coinbase-2022-04-01-2023-IMPORT.xls`


    Do not change the file name for the files downloaded from the exchange or wallet
    in the `DOWNLOADED-RAW` folder. An example of what the cryptocurrency exchange
    or wallet stores in the transaction logs (e.g., column headings):


    * Date (format) (e.g., `01 Jan 2022 12:00:00 GMT`)

    * Transaction Type (Buy/Sell/Trade/Mining Rewards)

    * Number of Coins Sold

    * Price of Coin Sold

    * Name of Coin Sold

    * Number of Coins Bought

    * Coin Name Bought

    * Price of Coin Bought in USD (Cost Basis)

    * Transaction Fees

    * Cryptocurrency Exchange

    * Jurisdiction in which crypto exchange is based (e.g., US, Canada, Switzerland)


    Archive all your transaction data into these folders, and when tax time comes
    around, you will have a repository of all your tax data that you can import into
    the tax software. The cryptocurrency tax software will automatically generate
    your `Form 8949`, which you can then send to your accountant or use software that
    can complete it. You must submit all forms to the `IRS`. Consider `TurboTax` and
    `TaxAct`.


    ## CREATE YOUR CRYPTOCURRENCY MASTER PORTFOLIO


    An excellent way to keep track of your overall cryptocurrency holdings, gains,
    and losses throughout the year is to record them in a master portfolio. Then,
    you can quickly reference them if your crypto tax professional has questions on
    each transaction’s classification and needs further calculations on gains or losses
    required to complete the required tax forms.


    The process of creating a master portfolio is described below:


    * Create a master portfolio using the cryptocurrency portfolio service to view
    your total number of crypto tokens and their value. You can reference the Cryptocurrency
    Charting and Portfolio services in the appendix. Some of these websites provide
    free services, such as `CoinGecko.com`.

    * Accurately record all your transactions on a coin tracking website, which will
    keep you updated on your portfolio and help you plan your next strategic market
    move.


    ## CONCLUSION


    What a swell journey of cryptocurrency discovery we just went on! It’s been quite
    a ride since we began in the first chapter. First, we started with a secret blueprint
    to help put you in the right mindset for your cryptocurrency investing adventure
    and quickly build your foundational knowledge. We learned first to decide that
    we want to make cryptocurrency investing primarily serve the purpose we want and
    that we will not doubt ourselves and let our emotions control our decisions. In
    addition, we went over the many benefits and opportunities currently and quickly
    becoming available to us via cryptocurrency. Once we decided to make cryptocurrency
    investing a tool for achieving the goals we wanted, we started to build the fundamental
    knowledge to help us wield this new financial tool.


    To help build your foundational knowledge of cryptocurrency, we traveled back
    in time to see how societies and nations have traditionally used objects as a
    store of wealth. And as we move to more modern times, the solution is vastly becoming
    digital. Understanding how countries keep the value of wealth through currency
    over time and all the different challenges these currencies underwent is the first
    step to gaining perspective and insight into helping you evaluate and find a winning
    blockchain and cryptocurrency you can invest in. For example, we see the negative
    impact of high inflation in our current fiat system. We can now look for cryptocurrencies
    with a finite number of minted coins, whereby the coin’s value may be ever-increasing
    due to supply and demand. We can also see that not only is having a limited number
    of coins minted an essential factor, but now we can also analyze how the coins
    are distributed and how much of the coin is burned to determine the viability
    of a cryptocurrency. In addition, we can see the vast importance of having faster
    transaction speeds and the robustness of the blockchain to endure all the challenges
    a currency system faces. A top-tier blockchain that can quickly process transactions,
    consistently make plans to increase transaction speed, and has limited or no downtime
    is a sure long-term win.


    Additionally, we see how revolutionary blockchains are by their decentralized,
    cryptographic, consensus-driven algorithms and immutable ledger characteristics.
    All of these critical characteristics help make cryptocurrency virtually unconfcatable
    and secure. Moreover, we can see how the blockchain creates trust without needing
    a third party by having a public ledger and allowing peer-to-peer transactions.
    All these unique features of this revolutionary technology are second to none
    and are helping re-shape the world we know positively. In addition to learning
    about the revolutionary blockchain technology, we learned how to set up our first
    cryptocurrency account on `Coinbase` and safely secure and store our newly purchased
    coins in non-custodial wallets. Non-custodial means it is in our possession, and
    no one can take it away from us. It’s one of the keys to creating multi-generational
    wealth and a key pillar in asset diversification and security. Finally, we learned
    about different cryptocurrency wallets’ unique characteristics. Each type of wallet
    offers extra flexibility and security to fit your cryptocurrency needs.

