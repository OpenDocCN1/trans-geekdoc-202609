    由于大量的市场买卖是基于情绪的，因此说明资产买卖积极性的 K 线（蜡烛图）展示了投资的价格走势以及交易该资产的人的情绪状态。


    你可以从 K 线的结构中看出其强度；它们有一个实体，以及零到最多两根影线（烛）。影线是从 K 线的顶部和底部延伸出的线条。


    让我们回顾一下不同的 K 线强度。


    ![](img/image00160.jpeg)


    *来自 Financial Freedom Trading 的图片“K 线强度”。⁸*


    1. 最强的 K 线具有长长的实体，且没有上影或下影。这种类型的蜡烛标志着当前价格走势将持续。价格走势仍可能改变方向，但可能性较低。（**极强信号**）

    2. 这仍然是强 K 线，它具有长长的实体，且在价格走势相反的方向上有较短的上/下影。价格可能会继续向相同方向移动，但有微小的概率改变。（**强信号**）

    3. 蜡线实体中等大小，上下影也都是中等大小。这是一个中等信号。当前价格走势可能会持续。然而，价格方向发生变化的风险很大。（**中等强信号**）

    4. 实体比中等小但不是短实体，且有两根中等长度的上下影，这种中等信号在平均强度范围内前景最不利。价格方向发生变化的机会很大，但更有可能继续向相同方向移动。（**弱中等信号**）

    5. 这根 K 线具有较小的实体和一根沿着价格走势方向延伸的长上/下影。K 线的开价、收盘价和接近信号较弱。价格走势改变方向的机会极佳。

    6. 最弱的 K 线信号。它有一个纤细的实体和一根沿着价格走势方向延伸的长上/下影。这种 K 线标志着投资者应该为价格方向的变化做好准备。（**最弱信号**）


    # 图表模式


    K 线创建了交易者可以用来衡量、读取和预测市场的图表模式。随着你阅读和解读图表模式能力的提高，你将进行策略性交易并降低交易风险。最重要的是，你将更有机会获得更获利的交易。交易者寻找的交易模式有：


    ### 涨涨 K 线模式


    这种交易信号意味着资产价格正在上涨。如果交易者以良好的位置、低成本进入市场，并在主要价格峰值处卖出，你在最大化价格峰值或刚达到峰值后将从交易中获利。


    ![](img/image00161.jpeg)


    *来自 Financial Freedom Trading 的图片“看涨 K 线”。⁹*


    ## 看跌 K 线模式


    此模式标志着资产价格正在下跌，现在不是买入的时机。如果可能，在价格下跌到让你亏损、无利或获利极少之前卖出该投资。相反，当资产价格触及最低点时，那是买入该资产的完美时机，然后在价格再次达到峰值时卖出。


    ![](img/image00162.jpeg)


    *来自 Financial Freedom Trading 的图片“看跌 K 线”。¹⁰*


    ## 看涨反转模式


    看涨反转模式标志资产下跌的价格将改变方向并上涨。它是一个反转模式，因为熊市趋势变成了牛市趋势。


    ## 看跌反转模式


    看跌反转模式标志资产上涨的价格将改变方向并下跌。它是一个反转模式，因为牛市趋势变成了熊市趋势。


    头肩底图表模式向你展示了看涨和看跌反转模式。此外，在比特币市场数据也可以找到头肩底图表模式。


    ![](img/image00163.jpeg)


    *来自 Financial Freedom Trading 的图片“如何交易头肩底模式”。¹¹*


    ![](img/image00165.jpeg)


    *来自 Crypto News，2019 年 6 月 10 日的图片。¹²*


    ## 持续趋势模式


    此信号意味着市场趋势将持续一段未知的时间（即超过一根 K 线）。它允许交易者进入/退出头寸并建立丰丰的交易。


    在上面的头肩底图表模式中，价格突破了支撑线并继续向下移动（熊市趋势）。


    ## 支撑位与阻力位


    带有 K 线的市场图表具有支撑线和阻力线。支撑线是你沿着 K 线底部绘制的线。它代表了一段时间内低价的总体方向。阻力线是你沿着 K 线顶部绘制的线。


    支撑象征着资产抵御价格下跌市场压力的强度。支撑越强，价格跌破它的可能性就越小。


    阻力象征着资产防止价格上涨的强度。阻力越强，资产价格高于它的可能性就越小。


    支撑线和阻力线在市场图表上形成常见的形状。起初，你可能很难在图表中“看到”形状，但随着时间的推移和练习，你将能够识别不同的图表形状以及它们告诉你关于资产市场趋势的信息。


    你可以在下面的图中观察到主要和次要的支撑与阻力。


    ![](img/image00166.jpeg)


    *来自 Financial Freedom Trading 的图片“主要与次要支撑阻力”。¹³*


    ## 突破模式


    当资产价格跌破支撑线或突破阻力线时，价格突破了趋势。如果你能预测突破，你就可以进行获利的交易。下面的图表显示了一些突破模式。


    ![](img/image00167.jpeg)


    *来自 Financial Freedom Trading 的“突破模式”。¹⁴*


    ## 其他 TA 工具


    还有其他 TA 分析工具可以用来读取和解读加密市场。虽然我们在这里无法介绍它们，但你可以研究这个最流行的列表。你应该使用你感到最熟悉、信任并有信心引导加密决策的工具。


    常用的 TA 指标有：


    * 能量潮指标 (`OBV`)

    * 累积分布线 (`A/D Line`)

    * 平均方向指数 (`ADX`)

    * 阿润指标

    * 移动平均收敛发散 (`MACD`)

    * 相对强度指数 (`RSI`)

    * 随机指标


    ## 模拟交易


    准备好交易加密货币了吗？


    如果你有一个可以使用虚拟货币交易的演示账户，你会感到更舒服吗？


    那么，可以使用模拟交易来练习交易技巧。模拟交易是使用虚拟资金交易的演示账户。交易后，你可以观察市场决策的结果并制定策略以优化市场表现。


    许多公司提供免费演示账户，因此你不应该付费。如果可能，从你未来感兴趣合作的公司获取一个演示账户。记住，许多公司允许在其平台上交易加密加密货币。


    如果你决定开设模拟交易，你可能考虑的一些公司有：


    * Webull

    * eToro

    * AvaTrade

    * Interactive Brokers

    * TradeStation

    * Thinkorswim

    * Capital.com

    * Tradier

    * FOREX.com


    ## 在大海中寻找你的针


    你现在准备好开发你的加密货币交易技能了。市场上有成千上万种加密货币，因此你有很多选择。如果你倾向于处理具有历史记录和大量市场数据的加密货币，请考虑市值最高的那些。


