  trans: "\n\n美国政府已开始要求加密交易所记录谁向谁发送了资金，以及你以法币货币发送和兑回的金额。其目的是防止加密货币投资者参与非法交易和资助恐怖主义。为了实现这一点，他们开始要求加密交易所报告兑回的加密货币，并对在加密交易所提现的交易保留记录。\n\
    \n由于你是初级加密货币投资者，我们将关注你可能需要支付的加密税：资本利得税和普通所得税。请注意，美国税务局（IRS）将加密货币视为财产。\n\n即使你以盈利的价格出售证券，也会产生资本利得税。如果你持有证券的时间于一年，则属于短期资本利得，被视为收入。然而，在出售前持有加密货币超过一年则属于长期资本利得。因此，长期资本利得的税率低于所得。\n\
    \n长期资本利得税率取决于你的所得税层级，在联邦层面可能为 0%、15% 或 20%。此外，高收入纳税人可能需要对其资本利得或其他款项缴纳 `3.8%` 的净投资收益税。\n\
    \n## 应纳税加密货币交易\n\n### 交易加密货币\n当你使用法币购买加密货币时，这不属于纳税事件。然而，如果你用一种加密货币交易另一种加密货币，例如用一种加密代币交易另一种加密代币（例如，用\
    \ `Bitcoin` 购买 `Ether`），这被视为纳税事件。此外，如果由于加密交易导致你的资产价值增加，这些收益可能需要纳税。\n\n### 兑回加密货币\n\
    如果你将加密货币兑换为法币、贵金属或宝石、房产或其他资产，则会触发纳税事件。如果你在兑回加密货币时获利（卖价高于买价），你必须为资本利得纳税。但是，如果你在出售加密货币时亏损（卖价低于买价），你可以使用亏损来减少你的资本利得税或所得税。\n\
    \n### 应纳税普通所得\n如果你因提供服务或商品而获得加密货币报酬或奖励，你的收益将作为普通所得征税。例如，如果你的工作以加密货币支付工资，这些资金将作为普通所得征税。此外，通过质押和挖掘加密货币获得的任何收入都被视为普通所得。此外，作为质押和挖掘活动奖励而获得的任何加密货币将作为普通所得征税。\n\
    \n### 用于商品和服务的加密货币\n用于支付商品和服务的加密货币可能作为普通所得或资本利得征税，这取决于你购买和花费加密代币的时间。此类支付可能包括创建\
    \ `smart contracts` 的费用、支付区块链交易费、支付加密相关服务费用以及任何其他可以证明为合理加密相关支出的费用。\n\n### 非纳税加密事件\n\
    某些加密交易不会触发加密货币税的缴纳。在参与这些交易时，你必须保留良好的记录，以便你的税务律师/会计师能够充分说明每个加密事件，并在 IRS 审计你时，你可以提供相关的书面证据。\n\
    \n- **捐赠**\n假设你捐赠了加密货币，且没有收到任何服务、商品或其他价值作为交换。在这种情况下，你可以将你的加密货币捐赠申请慈善税抵扣，前提是你的捐赠对象是\
    \ `501(c)(3)` 慈善机构。\n\n- **赠与**\n你可以向家人及等人赠送加密货币，而无需为赠与纳税。但是，你可以送给接收者的金额有终身限制。\n\
    \n- **购买并持有加密货币**\n对于选择购买并持有（又称 `HODL`）加密货币的人，IRS 不要求你在出售或交易所购买的加密货币之前支付任何税。相反，你的税费将基于你持有加密货币的时间、该年度资本利得与亏损的差额、税收抵扣以及普通所得税率。\n\
    \n- **在加密钱包/账户之间传输加密货币**\n在不同的加密钱包/账户之间传输加密货币不是纳税事件。因此，将你的加密代币从中心化交易所移动到你的加密钱包不会触发税务事件，将加密货币从一个钱包移动到另一个也不会触发税务事件。\n\
    \n## 可能纳税的加密货币交易\n\n- 以加密货币支付的工资\n- 以加密货币支付商品和服务（例如，转账费）\n- 将加密代币兑换为法币\n- 使用加密代币支付商品和服务\n\
    - `P2P` 加密贷款的利息\n- 通过挖掘、质押和流动性池获得的加密代币\n- 推荐奖励（例如，`Binance` 推荐）\n- 从“学习赚币”活动获得的加密代币（例如，`Coinbase\
    \ Earn`、`CoinMarketCap Earn`）\n- 从看视频赚币平台获得的加密货币（例如，`Odyssey`）\n- 从浏览赚币平台获得的加密货币（例如，`Permission.io`\
    \ 浏览器扩展、`Brave browser`）\n- 从玩游戏赚币 (`P2E`) 游戏获得的加密货币\n- 从购物赚币平台获得的加密货币（例如，`Lolli`）\n\
    - 从共享地址赚币平台获得的加密货币（例如，`Moon Faucet`）\n- 使用稳定币购买加密代币\n- 在加密钱包之间移动加密货币收取的传输费\n-\
    \ 通过空投和区块链硬分获取的加密代币\n- 通过出售、交易和花费通过空投和区块链硬分获取的加密代币而获得的代币和法币\n- 在你收到赠送代币后，对其进行兑回、交易和用于支付商品服务的交易\n\
    \n## 免税加密货币交易\n\n加密货币持有者不需要对以下内容纳税：\n\n- 使用法币购买加密代币（例如，`USD`、`GBP`、`JPY`、`EUR`）\n\
    - `HODLing` 加密货币\n- 在加密钱包之间传输加密货币（但是，费用可能需要纳税）\n- 向 `501(c)(3)` 批准的慈善机构捐赠加密货币\n\
    - 在以下条件下向他人赠送加密货币：\n    - 2021 年最多赠送 `$15,000`，2022 年为 `$16,000`\n    - 每位接收者的终身限制：2021\
    \ 年为 1170 万美元，2022 年为 1216 万美元\n- 创建 `NFTs`\n\n注意：此外，区块链硬分不征收税，因为平台用户在硬分启动时不会收到新代币。\n\
    \n"
