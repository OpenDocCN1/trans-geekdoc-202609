    # BUILDING YOUR CRYPTOCURRENCY DEFENSES


    ### Take-Home Message


    *Crypto scams are increasing every year. You must be vigilant and take security
    precautions to make sure that you secure your crypto assets. There are numerous
    ways you can protect your crypto assets. Do the things that work best for you.
    Remember that once hackers steal your crypto, it’s gone for good.*


    ## CRYPTOCURRENCY SCAMS ARE ON THE RISE


    Cryptocurrency scams increase more than tenfold every year. The more money investors
    put into the crypto market, the more attractive it is to scammers and fraudsters.


    People lose money every day in the crypto market. Unfortunately, new investors
    are susceptible to losing tons of money via scams, shoddy investments, and hacking.
    Crypto investors know that these scams and frauds exist to attract your interest
    and steal your crypto assets. Unfortunately, these scams are getting more attractive
    and persuasive and can look similar to legitimate offers and investments.


    These scams are like the ones used with bank accounts and credit cards. The primary
    difference is that crypto scams use computer programming, Internet communication,
    and hacking skills. In addition, the perpetrators are hard to catch because cryptocurrency
    is borderless and can be accessed from anywhere in the world. So, good luck getting
    law enforcement to see them and get your crypto assets back.


    This chapter will give you a brief overview of the most common crypto scams. Before
    we start, let me be blunt: There is no way to know whether a crypto token, blockchain,
    crypto exchange, or another type of crypto-related offering is entirely legitimate.
    The most you can do is look for signs that the advertised crypto or blockchain
    investment is what it claims to be.


    ## FAKE CRYPTO EXCHANGES


    The fake crypto exchanges offer services similar to legitimate crypto exchanges.
    The difference is that fraudulent exchanges target specific crypto tokens. The
    goal of the phony crypto exchange operators is to collect the private keys of
    as many crypto tokens as possible before they shut down the exchange and disappear.


    You will realize there is a problem with the fraudulent exchange when you cannot
    move your crypto tokens to another address, redeem them, or exchange them for
    other crypto tokens. The operators of the fake crypto exchange will blame the
    problems on technology and then abscond with your crypto assets. Tragically, you
    and the other platform users will never recover your stolen crypto assets. Moreover,
    the fake crypto exchange operators will most likely never be found or forced to
    answer for their crimes.


    ### *Spotting Fake Crypto Exchanges*


    When you research the crypto exchange, ask yourself several questions. If you
    can’t find satisfying answers to these questions, stay away from the crypto exchange.


    The questions are:


    *   Can you find detailed information about the people operating the crypto exchange?

    *   Can you see the crypto exchange operators’ social media accounts and profiles?

    *   Are the exchange operators’ profiles and accounts active and up-to-date?

    *   Does the exchange have high liquidity?

    *   Is there enough capital invested in the crypto exchange to fund its growth,
    expansion, and maintenance?

    *   Does the crypto exchange have medium to high trading volume?

    *   Does the crypto exchange store your crypto tokens’ private keys?

    *   Are you required to give the crypto exchange your personal information?

    *   Does the crypto exchange have a good reputation with other crypto enthusiasts?

    *   Are there any complaints about the crypto exchange’s customer service?

    *   Is the crypto exchange being discussed on Twitter, Discord, or Reddit?

    *   Have crypto enthusiasts had any problems conducting crypto transactions on
    the crypto exchange?


    ## HOW TO PROTECT YOURSELF


    If you are not using a well-known `CEX`, transfer your crypto tokens out of your
    `CEX` account and into your private wallet. Also, limit the information you give
    the `CEX` when registering your account. Note that some people have had their
    identities stolen using the information they provided to fake crypto exchanges
    to open their accounts. Finally, if an exchange is incredibly cheap and seems
    too good to be true, it is probably a phony crypto exchange.


    ## FAKE CRYPTO WALLETS


    Crypto investors can have their crypto tokens stolen by storing them in a fake
    crypto wallet. These wallets can be downloaded from the Internet or acquired from
    online shops. The problem is that these wallets are not legitimate software programs;
    they are created by scammers who want to steal your crypto assets. They usually
    have names similar to famous cryptocurrencies and crypto exchanges. They do this
    because they want to borrow the credibility of the established crypto company.


    ### *Spotting a Fake Crypto Wallet*


    Before you choose a crypto wallet:


    *   Research the company.

    *   Check its performance history, customer complaint record, and social media
    forums for information about it.

    *   If you spot any red flags or questionable stuff, stay away from it.


    ## HIDDEN WALLETS


    Hidden wallets are crypto wallets in your computer or smartphone that have been
    put there by a hacker to steal your crypto. Deploying hidden wallets is done via
    the hacker getting access to your electronic device, creating a wallet on it,
    and giving the hidden wallet an address similar to your crypto wallet. The hacker
    will then go into your computer and locate places where you have copied your crypto
    wallet’s address and change the address to the hidden wallet’s address.

