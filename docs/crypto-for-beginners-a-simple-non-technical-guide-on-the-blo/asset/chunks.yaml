- raw: "Use passwords that are 12 characters long or longer. As passwords increase\
    \ in length, they become more robust and secure. Strong passwords use a mix of\
    \ uppercase and lowercase letters, special characters, and numbers. The patterns\
    \ should be random, and the keyboard path to typing it should not be memorable.\
    \ They should also not include your personal information, location, or anything\
    \ hackers can guess based on your background or familiarity with you. Also, don’t\
    \ reuse old passwords on the same or different accounts.\n\n## GENERATING STRONG\
    \ PASSWORDS\n\nIf you are unsure of how to generate strong passwords, here are\
    \ some ways you can do it⁴:\n\n*   Use a password generator app like NordPass\
    \ to create your password.\n\n*   Use a phrase and abbreviate it.\n\n*   Choose\
    \ random words from the dictionary and combine them using different special characters\
    \ and numbers.\n\n*   Use a famous quote that is abbreviated.\n\n*   Use emoticons\
    \ in your password. Emoticons are combinations of special characters, punctuation,\
    \ and numbers. Examples:\n\n![](Images/image00154.jpeg)\n\n*   Use similar passwords\
    \ for all your accounts but change the beginning or ending so that it is specialized\
    \ for each type of account.\n\n![](Images/image00169.jpeg)![](Images/image00156.jpeg)CHAPTER\
    \ 7 \n\n# HOW TO FIND CRYPTOCURRENCY GEMS\n\n**Take-Home Message**\n\n*Investors\
    \ primarily use fundamental and technical analysis to decide which cryptocurrencies\
    \ they want to trade or purchase. Fundamental research focuses on studying the\
    \ crypto project and estimating its potential for growth, longevity, and market\
    \ value. In comparison, technical analysis focuses on looking at historical price\
    \ movements and making predictions about future price movements using the asset’s\
    \ market trends. Ultimately, you should choose an investing/trading strategy that\
    \ reflects your risk tolerance and perception of assets (e.g., purchasing a piece\
    \ of the company vs. trading parts of a company). *\n\n## FUNDAMENTAL ANALYSIS\
    \ VS. TECHNICAL ANALYSIS\n\n*Fundamental Analysis*\n\nFundamental analysis (FA)\
    \ requires an investor to spend lots of time, energy, and effort studying a company\
    \ and determine its “true” (AKA intrinsic) market value and growth potential.\
    \ This analysis is best for people who plan to acquire and hold an asset for more\
    \ than a year. \n\nIt is generally believed to be the best investment strategy\
    \ for people who want to build generational wealth and become financially independent,\
    \ according to Warren Buffett, the “Oracle of Omaha,” the most famous FA investor.\n\
    \n*Technical Analysis*\n\nTechnical analysis (TA) is most often used by short-term\
    \ investors/traders because their market success depends on making trades at optimal\
    \ price points. TA focuses on the historical performance of an asset in the market\
    \ and uses its prior performance to predict its future price movements. Its tools\
    \ use trends in price movements, mathematical equations that summarize price movements\
    \ over time, and other kinds of market signals that traders can identify using\
    \ computer analysis.\n\nInvestors using TA tools to make trading decisions often\
    \ use more than one to determine the market trend and what trades they should\
    \ enter and exit. The most famous TA investors are those who made a fortune by\
    \ successfully trading DOGE (Dogecoin), AMC (Amnext), and COSS (Crypto One-Stop\
    \ Solution) when they briefly went from low market value to stratospheric levels\
    \ in 2021. \n\nIn this chapter, we will review the basics of FA and TA. Although\
    \ neither analysis technique can guarantee success in the market as a crypto trader\
    \ or investor, you should choose the one that fits your interests, lifestyle,\
    \ and level of time commitment.\n\n## CRYPTOCURRENCY FUNDAMENTAL ANALYSIS (FA)\n\
    \nFA looks at a crypto project’s operations, management, and future market prospects\
    \ and helps the investor determine if the crypto token is over- or undervalued.\
    \ In addition, it measures the aspects of a project that are likely to affect\
    \ a crypto firm’s financial success and longevity.\n\nThis analysis technique\
    \ incorporates a crypto firm’s revenue, capital, asset distribution, brand, online\
    \ community activity, future growth potential, return on equity, liabilities,\
    \ and other information into the investor’s estimation of the value, future potential,\
    \ and potential longevity of the cryptocurrency issuer.\n\n## QUALITATIVE & QUANTITATIVE\
    \ ANALYSIS\n\nInvestors review the key characteristics of the company that issued\
    \ the cryptocurrency. Some factors considered are its:\n\n*   Management\n\n*\
    \   Token’s Competitiveness/Competitive Advantage\n\n*   Organizational Structure\n\
    \n*   Patents\n\n*   Proprietary Technology \n\n*   Brand \n\n*   Corporate Governance\n\
    \n*   Market Niche\n\n*   Market Size\n\n*   Competitors\n\n*   Market Regulation\n\
    \n*   Business Cycles\n\n*   Financial Statements (e.g., balance sheet, income\
    \ statement, statement of cash flow)\n\n*Operations: Corporate Management, Governance,\
    \ Organizational Structure*\n\nAs an investor, you want to know the company’s\
    \ decision-makers and how the company makes decisions. In short, you want to be\
    \ sure that the decision-makers at the company have the skills and experience\
    \ necessary to make decisions that will positively impact the value of the cryptocurrency\
    \ you are purchasing or trading.\n\n*   Technological Advantages: Patents, Proprietary\
    \ Technology, Consensus Algorithm\n\nCrypto firms can issue crypto tokens hosted\
    \ on different blockchains (e.g., USDT, USDC) or primarily on their blockchains\
    \ (e.g., BTC, XRP, DOT). You can easily distinguish the success of a cryptocurrency\
    \ by the market niches they occupy—the greater the utility of a crypto token,\
    \ the greater its market value and demand. Crypto tokens with limited uses must\
    \ generate high demand, because if they don’t, no one will buy or use them. For\
    \ a limited token to create high demand, it must occupy an underserved market\
    \ niche or have users who need its services (e.g., XRP). \n\nThe technology incorporated\
    \ into the operations of a crypto token’s ecosystem, issuance, passive investment\
    \ opportunities, or procedures can also significantly affect its market valuation\
    \ and reputation. \n\nCrypto investors generally prefer to acquire crypto tokens\
    \ issued by firms that are not likely to be hacked, become unusable due to faulty\
    \ operational planning or maintenance, or become obsolete. In summary, all these\
    \ issues will most likely significantly diminish the demand for cryptocurrency\
    \ or, if more severe, extinguish its need.\n\n*    Tokenomics\n\nTokenomics refers\
    \ to the supply, burning, and use of the token. In addition, investors/traders\
    \ should know if the token has its ecosystem, if it can be used on more than one\
    \ blockchain, whether it’s traded on crypto exchanges, and how the company distributes\
    \ the token to the public.\n\n*   Token Supply\n\nTokens with a limited supply\
    \ are likely to increase in value over time, especially if the company burns a\
    \ notable percentage of tokens annually. Moreover, if a cryptocurrency has an\
    \ unlimited supply of tokens, you’ll want to know: \n\n*   How are the tokens\
    \ being issued?\n\n*   How many tokens does the company mint each year? \n\n*\
    \   How many tokens does the company burn each year?\n\n*   Token Accessibility\n\
    \nTokens bought on CEXs have more credibility than tokens you can only purchase\
    \ on DEXs because DEXs have lower listing requirements for crypto tokens than\
    \ CEXs. Due to their relaxed standards, DEXs have more low value and fraudulent\
    \ tokens than CEXs. So, when investing in crypto tokens, as a beginning investor,\
    \ protect yourself by focusing on crypto tokens that can be bought on CEXs and\
    \ have several cryptocurrency pairs. The more cryptocurrency pairs a token has\
    \ on a CEX, the easier it is to buy/sell/trade.\n\n*   Token Distribution"
