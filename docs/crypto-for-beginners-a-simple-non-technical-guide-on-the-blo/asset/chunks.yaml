- raw: 'Hackers who want to access their victims’ crypto tokens or crypto wallets
    may do that by hacking their smartphones. Hackers only have to hack your SIM card
    one time. During that one-time hack, they can download viruses to your phone or
    even look through your files. Moreover, they can put code on your smartphone that
    lets hackers view activity on your phone, have information sent to them from your
    phone, and allows them to alter information on your phone. They can also encrypt
    your files and then ransom them back to you.


    Hackers like hacking SIMs because most smartphone users never realize that hackers
    hacked their smartphones. Scammers can get away with SIM hacks because, generally,
    people don’t regularly check their phones for viruses, malware, or strange software.
    Furthermore, they are usually unaware of a problem until they check their crypto
    wallet balances and realize they are incorrect.


    *How It’s Done*


    Hackers can access your smartphone by contacting your phone service carrier and
    impersonating you. They will provide your phone service carrier with your date
    of birth, social security number, mother’s maiden name, etc., so they can get
    your account information and change it. Another way they get your information
    is by bribing your phone service carrier’s employees to give them the lead. Sadly,
    they can get your data for less than $200 from most phone service carrier employees.


    *Spotting a SIM Hack*


    To avoid having your SIM hacked and having your crypto assets stolen, do the following:


    *   Never connect your mobile phone to your crypto account.


    *   Only access your crypto account using a landline or a free Google Voice number.


    *   Use codes sent to your phone to confirm your crypto account.


    *   Use a two-factor authentication system on your crypto account.


    *   If you use your mobile phone, set a unique PIN and security questions on your
    crypto account.


    *   Use a strong password on your crypto accounts or get a password manager.


    *   Use a virtual private network (VPN) to conceal your Internet connection.


    VPNs encrypt your IP address. When your IP address is hidden, government agencies,
    companies, advertisers, and would-be hackers have difficulty locating your electronic
    device (e.g., laptop, smartphone, desktop) online. Because they cannot quickly
    identify or track your IP address, they are less likely to be able to steal your
    personal information, interfere with your crypto transactions, or place cookies
    and malware on your electronic device. VPNs work on public and private networks.
    There is a range of prices and plans. For more information on VPNs, please look
    at ExpressVPN, Mullvad, Nord VPN, SurfShark, hide.me, and Proton VPN.


    ## ASYMMETRICAL GIVEAWAYS


    Scammers love to set up asymmetrical giveaways using social media campaigns. In
    the scams, the scammers promise to give away free crypto tokens to people who
    send them crypto tokens first. Then, the scammers tell the would-be victims that
    they will receive significantly more crypto tokens in return after giving up their
    crypto tokens. Unfortunately, the reality is that after they receive your crypto
    tokens, you will never hear from them again.


    *Avoiding Asymmetrical Giveaways*


    Never send your crypto tokens to someone’s crypto wallet with the expectation
    that they will send them back and reward you by giving you more crypto tokens.
    Why would anyone ever do that? What do they get from it? There are no free lunches
    in life. If someone offers you a free lunch, look for the catch.


    ## GENERAL RULES FOR AVOIDING HAVING YOUR CRYPTOCURRENCY STOLEN VIA HACKING OR
    SCAMS


    *   Don’t tell everyone you have cryptocurrency, especially on social media.


    *   Avoid direct messages on chats with people you don’t know. Usually, the attacker
    will contact you first.


    *   Don’t download software or click on links that you are not sure are safe and
    secure.


    *   Never give anyone your secret seed phrase, private keys, or crypto wallet
    password.


    *   Have multiple email accounts for various purposes (e.g., one for accessing
    exchanges, one for communications, etc.). An attacker might try to access your
    cryptocurrency accounts on different crypto exchanges by using your email and
    seeing if they get any results.


    ## PROTECTING YOUR CUSTODIAL CRYPTO ACCOUNTS, PRIVATE KEYS, AND SECRET SEED PHRASES


    For custodial wallets and crypto wallets on CEXs, you should use a three-part
    account authorization system. Unfortunately, the most common two-factor authorization
    (2FA) system is not secure because it is vulnerable to hacking. Hackers can still
    hack the three-part system, but it takes more time and is more challenging.


    Let’s examine the 2FA system, then look at the third part that backs it up.


    ## 2FA


    In the 2FA system, you cannot access the crypto account without inputting at least
    two pieces of security data. First, crypto account holders will input their username
    and password and then be required to input a code sent to their email account
    or smartphone.


    ## HACKING EMAIL ACCOUNTS


    Email accounts have been vulnerable to hacking for some time. We regularly read
    about data breaches or hackers hacking into email accounts. If you only use 2FA,
    a hacker can hack into your email, click the “Forgot Password” link (who hasn’t
    forgotten their password at least once?), and reset your password from inside
    your account. After resetting your password, the hacker will have full access
    to your crypto account.


    ## SIM SWAPPING


    SMS messages are problematic because SIM swapping has become quite common and
    is very easy. In SIM swapping, a hacker contacts your mobile service carrier and
    claims to be in distress because of a lost SIM card or smartphone. The hacker
    will then ask the mobile phone company to switch your phone number to a new SIM
    card or smartphone. After the carrier changes your phone number to the hacker’s
    SIM or smartphone, the hacker can quickly complete the 2FA authentication process
    required to access your crypto account.


    ## AUTHENTICATOR APPS


    If you use an authenticator app like Google Authenticator, Microsoft Authenticator,
    or Authy, a hacker will have to go the extra mile to get into your account. These
    apps are not difficult or time-consuming, but you must set them up on each crypto
    exchange account. The most important thing to note about authenticator app setup
    is that you must store your account backup password. You can use the account backup
    password to regenerate your Authy account if you lose your phone or email access.
    It would help if you never gave anyone this password, because it is the key to
    your crypto kingdom.


    To prevent problems with the authenticator app backup password and your crypto
    account secret seed phrase, do the following:


    *   Copy the backup password as written on the screen to a piece of paper. Make
    sure that it is easy to read, and use ink that cannot easily fade or paper that
    cannot degrade quickly over time (e.g., the ink becomes unreadable when wet).


    *   Copy the backup password twice and place each copy in a different safe location
    (e.g., a safety deposit box).


    *   Engrave the password on stainless steel that is acid-proof, fire-proof, and
    shockproof.


    *   Store the backup passwords on password-protected USBs.


    *   Set up an email address that you use only for crypto-related activities. This
    way, if your hackers gain access to your primary email account, the hacker will
    not get access to your crypto accounts.


    *   Never give anyone your secret seed phrase or backup password.


    *   Never store your secret seed phrase or backup password on a computer, smartphone,
    tablet, etc.


    ## GUIDELINES FOR STRONG CRYPTO WALLET PASSWORDS'
