    # 构建你的加密货币防御


    ### 核心要点


    *加密货币诈骗逐年增加。你必须保持警惕并采取安全措施，以确保你的加密资产安全。你有许多方法可以保护你的加密资产。采取对你有效的方法。记住，一旦黑客盗走了你的加密货币，它就彻底消失了。*


    ## 加密货币诈骗正在增加


    加密货币诈骗每年增长十倍以上。投资者投入加密市场的资金越多，对诈骗者和欺诈者的吸引力越大。


    人们每天都在加密市场上亏钱。遗憾的是，新投资者很容易通过诈骗、糟糕的投资和黑客攻击损失大量资金。加密投资者知道这些诈骗是为了吸引你的兴趣并偷取你的加密资产。遗憾的是，这些诈骗变得越来越具有吸引力和说服力，看起来类似于合法的报价和投资。


    这些诈骗类似于银行账户和信用卡诈骗。主要的区别在于加密货币诈骗使用了计算机编程、互联网通信和黑客技术。此外，犯罪者很难被抓住，因为加密货币无国，可以从世界上任何地方访问。所以，祝你好运让执法部门看到回加密资产。


    本章将为你简要概述最常见的加密货币诈骗。在我们开始之前，让我直说吧：没有办法可以判断一个加密代币、区块链、加密交易所或其他类型的加密货币相关产品是否完全合规。你所做的最多就是寻找迹象，证明广告中的加密货币或区块链投资确实如其描述。


    ## 虚假加密交易所


    虚假加密交易所提供与合法交易所类似的服务。区别在于，欺诈交易所针对特定的加密代币。虚假交易所运营者的目标是在关闭交易所并消失之前，收集尽可能多的加密代币私钥。


    当你无法将加密代币移动到另一个地址、兑换它们或将其交换其他加密代币时，你会发现欺诈交易所存在问题。虚假交易所的操作会将问题归咎于技术，然后带着你的加密资产溜。不幸的是，你和其他平台用户将永远无法找回被盗的加密资产。此外，虚假交易所运营者可能永远不会发现，也不会被强制为其犯罪负责。


    ### *识别虚假加密交易所*


    当你研究加密交易所时，问问自己几个问题。如果你无法对这些问题找到满意的答案，请远离该交易所。


    问题如下：


    *   你能找到有关加密交易所运营人员的详细信息吗？

    *   你能看到交易所运营者的社交媒体账户和简介吗？

    *   交易所运营者的简介和账户是否活跃并保持更新？

    *   该交易所具有高流动性吗？

    *   加密交易所是否有足够的资金投入来支持其增长、扩张和维护？

    *   加密交易所是否有中等到高交易量？

    *   加密交易所是否存储了你的加密代币的私钥？

    *   加密交易所是否要求你提供个人信息？

    *   该加密交易所在加密爱好者中声誉良好吗？

    *   是否有关于该交易所客户服务的投诉？

    *   该加密交易所在 Twitter、Discord 或 Reddit 上有讨论吗？

    *   加密爱好者在在该交易所进行交易时遇到过问题吗？


    ## 如何保护自己


    如果你没有使用知名的 `CEX`，请将你的加密货币从 `CEX` 账户转移到你的私人钱包。此外，在注册账户时限制给予 `CEX` 的信息。注意，有些人的身份在使用提供给加密交易所的信息时被盗了。最后，如果一个交易所便宜得离谱且看起来令人不可置信，它可能是一个虚假交易所。


    ## 虚假加密钱包


    加密投资者可能会因将加密货币存储在虚假加密钱包而被盗。这些钱包可以从互联网下载或从网上商店获得。问题在于，这些钱包并不是合法的软件程序；它们是诈骗者创建的，旨在窃取你的加密资产。它们的名称通常与著名的加密货币和加密交易所相似。他们这样做是为了利用成熟加密公司的信誉。


    ### *识别虚假加密钱包*


    在选择加密钱包之前：


    *   研究该公司。

    *   查看其性能历史、投诉记录和社交媒体论坛上的相关信息。

    *   如果你发现任何红旗或可疑物品，请远离它。


    ## 隐藏钱包


    隐藏钱包是黑客放在你的电脑或智能手机中的加密钱包，用于偷取你的加密货币。部署隐藏钱包是通过黑客访问你的电子设备，在上面创建一个钱包，并给隐藏钱包一个与你的加密钱包地址相似的地址。然后黑客会进入你的电脑，定位你复制过加密钱包地址的地方，并将地址更改为隐藏钱包的地址。


