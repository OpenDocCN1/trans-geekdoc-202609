    hope it works out for you. But as always, never commit more capital to a questionable
    investment than you can comfortably avoid losing without regret.


    ## PHISHING SCAMS


    These scammers use emails and text messages to trick you into giving them access
    to your crypto assets. In the emails or text messages, they will try to get your
    personal information, crypto tokens’ private keys, crypto wallet passwords, and
    other information that scammers can use to their advantage and detriment.


    People generally send these by using official-looking emails or text messages.
    But unfortunately, they will also try to pressure you into immediately acting
    on the information by telling you that it is a limited-time offer or that it is
    limited to a small number of people on a first-come, first-served basis.


    ### Spotting Phishing Scams


    Before responding to a potential communication from a phishing scam, do the following:


    *   Research the company that is offering the deal, gifts, etc.

    *   Research the history of the offer and any offers similar to it.

    *   Know what kinds of information the communication is for and whether it could
    be used to steal your crypto assets or identity.

    *   Determine whether they are asking for personal information you would not give
    a nameless, faceless stranger.


    Remember that nothing in life is free—not even Facebook!!


    ## CELEBRITY/INFLUENCER IMPERSONATORS


    Be wary of any emails that you receive from supposed celebrities or influencers.
    Unless you are in contact with these people and their social circles, it is doubtful
    that they will send you a personal email to convince you to participate in a crypto
    giveaway, contest, or hot crypto tip. You should have realized by now that the
    email message you received most likely came from someone impersonating a celebrity
    or influencer. These scammers expect you to be so impressed and excited by receiving
    an email from a famous or notable person that you would overlook the questionable
    aspects of the email, trust them, and give them what they want from you. For example,
    if you receive an email message from someone you admire but that you have never
    met, what are the chances that it was the person you admire who sent it to you?


    Any unsolicited email or text message that gives you investment advice is sketchy.
    Treat it like advice from a random stranger with unknown intentions. When responding
    to such communications, do not give out personal information that can be used
    against you to steal your identity or assets (e.g., mother’s maiden name, social
    security number).


    ### Spotting Celebrity/Influencer Impersonator Communications


    Before you respond to an unsolicited communication that invites you to participate
    in something you have never heard of and know nothing about, ask yourself the
    following questions:


    *   What is the goal of the communication?

    *   What does the sender of the communication want from you?

    *   What does the person who sent you the communication want you to do?

    *   What is your relationship with the person who sent the communication?

    *   How does the person know you?

    *   How trustworthy is the person who sent you the communication?

    *   How would you respond to the communication if it was sent to you by a random
    stranger you had never met, talked to, or heard of?


    ## SIM HACK


    Many crypto investors use their smartphones to perform crypto trades and transactions.
    They also check their crypto wallet balances, purchase crypto tokens, and perform
    other crypto-related tasks using smartphones.

