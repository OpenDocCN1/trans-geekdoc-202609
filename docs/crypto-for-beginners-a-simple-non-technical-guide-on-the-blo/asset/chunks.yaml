- raw: 'Note that this is one of the keys to profitable investing. *Successful investing
    depends on setting the right sell target, not selling at the right time.*^(18)
    So, keep an eye on your sell targets when cryptocurrency prices rise. When the
    market prices rise to your sell target, SELL a certain percentage of your holdings
    from 10 to 20%. Please note that some cryptocurrency exchanges offer automatic
    sell options to sell at a specified price. However, *don’t sell your entire position*,
    because the coin prices may increase again. For example, let’s say you invested
    $1,000 in a token, and when the market goes up, your investment is now $2,000
    instead of selling your entire position, which is $2,000. You sell 20% of your
    position, which is $400, and you still have $1,600 invested. When your coin price
    doubles again and goes up to $3,200, sell another 20% for a $640 profit. So, your
    earnings are $400 and $640, which is greater than your initial $1,000 investment—and
    you still have $2,560 invested. As the price of your coin continues to uptick,
    continue to sell 10% to 20% of your holding incrementally. Once the market starts
    to downtick, you can decide whether or not to put the gains back in with dollar-cost
    averaging or use the profits to pay off or buy whatever you had set for your financial
    goals. Remember, this is a long game; it can take months or even years to reach
    your sell target. Be patient, knowing you planted the seeds of wealth and are
    reaping the rewards.


    You must also remember that you base your sell targets on a coin’s value. If you
    have a low-value token, it is ridiculous to expect its market price to rise to
    Bitcoin’s level. Of course, that could happen, but you should set realistic sell
    targets for your tokens based on their potential market success and demand.


    *Join a Community*


    Don’t go it alone! Millions of crypto investors worldwide are just starting, learning
    the market, and trying to build multi-generational wealth. You can learn from
    them, be supported, and be encouraged, but you must make an effort to be a part
    of the crypto community. You may find some tremendous investing groups, investing
    gurus, or discussion forums online and in your area. Open yourself to meeting
    crypto enthusiasts and expanding your crypto network.


    Let’s revisit your HODL game plan:


    *   The best way to get into your HODL game plan is to dollar-cost average into
    your crypto investment. Don’t go in all at once.


    *   Set your sell targets as early as possible before significant market upticks.
    Always keep track of the original purchase price of your cryptos.


    *   Remember, cash is a position. Always keep a cash reserve for periods to buy
    into a dip.


    ## REINVEST YOUR PROFITS


    Reinvesting is a great challenge for an investor because it means that the investor
    has successfully profited from the market. However, it also means you must decide
    when you’ve made enough profit and when you’ll want to wait for more profit.


    Before withdrawing profits from your investment, ask yourself the following questions:


    *   Why did I buy this token?


    *   What was my investment goal with this crypto token?


    *   Am I comfortable holding onto this token, or would it be better for me to
    sell a part of my investment?


    *   At what point am I comfortable taking profits (50%, 100%, 300%, 500%, etc.)?


    *   Is there a better investment opportunity for my earnings?


    After you have decided to remove a portion of your profits from your investment,
    you should immediately reinvest it. However, before reinvesting it, you should
    have thoroughly researched your options and made the best decision given your
    goals, finances, and time constraints.


    Some investments that you may want to consider when reinvesting your profits are:


    *   Crypto mining


    *   Investing in new crypto tokens


    *   Rental property


    *   Paying off your current debts (e.g., credit card, mortgage, school loans)


    *   HODLing


    If you prefer not to sell your crypto tokens and want to profit from your crypto
    tokens while still holding them, you can do the following:


    *   Loan your crypto tokens to other crypto investors (i.e., P2P loans)


    *   Engage in short-term crypto trades for quick profits, where you buy the tokens
    for a low price on one exchange and immediately sell them for a higher price on
    another exchange (i.e., arbitrage)


    ## DIVERSIFY YOUR PORTFOLIO


    When you reinvest your profits, your goal should be to maximize your gains, minimize
    your losses, and reduce your overall risk. To hedge against downturns in the market,
    try to invest in assets that are affected by different market conditions. Also,
    you would benefit by diversifying your investments in asset classes other than
    the stock and crypto markets.


    ## WHAT NOT TO DO WHEN INVESTING IN CRYPTOS


    Most crypto investors fail because they do not maintain a calm, neutral disposition
    when managing their crypto investments. Despite their intentions to stick to their
    investment strategy, they tend to become victims of FUD (fear, uncertainty, doubt)
    and FOMO (fear of missing out). Let’s examine FUD and FOMO to know if you are
    falling prey to them.


    *FUD*


    Most crypto investors are emotional traders. Their emotions tend to dictate how
    they respond to changes in the market. Interestingly, FUD can affect individuals,
    investing groups, and communities—and can even be a feeling that characterizes
    the market.


    *   **Fear** – Fear stems from being preoccupied with the idea that you will financially
    suffer or not be able to maximize your financial position like other crypto traders
    if you do not do what they are doing in the market. It is also a feeling caused
    by a lack of confidence in your investing strategy, intuition, or process.


    *   **Uncertainty** – Uncertainty is a feeling that is hard to contain and compartmentalize
    in crypto investing because crypto markets are volatile, unpredictable, not connected
    to real-world demands, and highly speculative. No one can be certain about anything
    in the crypto world. Moreover, crypto token values can increase by 1,000% in less
    than a month and fall by more than 5,000% weeks later. Not knowing whether a token
    price will rally again, when it will rally again, and how long it will stay strong
    drives the crippling uncertainty that thwarts some of the best investment plans
    and strategies implemented by the most conscientious and committed investors.


    *   **Doubt** – Doubt is the insidious feeling that afflicts some despite their
    best efforts to invest in a rational, calculated way. Investors may obsess over
    whether they have done enough to safeguard their investments, minimize losses,
    and maximize gains. Furthermore, this feeling is hard to root out or contain when
    the volatility and unpredictability of the crypto market renders your well-thought-out
    investment plans and strategies pointless. Unfortunately, potentially great investors
    succumb to second-guessing themselves because they want to avoid the market losses
    suffered in the past and make that last-minute investment decision that saves
    them from being financially decimated like some of their crypto investing peers.


    *Defeating FUD*


    You can conquer FUD by doing the following:


    *   Set clear and achievable investment goals and milestones.


    *   Maintain a diversified portfolio.


    *   Recognize when FUD is overtaking you and develop coping mechanisms for it.
    Your goal is to reduce it significantly—if not eliminate it—and contain it.


    *   Set up guidelines for when you will take specific actions in the market and
    try not to deviate from your plans except in rare instances.


    *   Keep a journal of when you’ve traded assets, why you traded them, and the
    outcome of your trades.


    *   Stay up-to-date on the market and the crypto assets you have in your investment
    portfolio. Your knowledge of crypto markets and your market trading experience
    will help you keep FUD away and prevent you from falling victim to it.


    *FOMO*'
