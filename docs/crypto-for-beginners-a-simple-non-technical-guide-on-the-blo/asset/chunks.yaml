    # 现在就开始积累你的加密货币财富！


    你拥有开发和提高加密货币交易技能所需的一切。从今天开始吧！当你对模拟交易感到自在且自信时，就开始投资加密货币。


    注意，不要做一个一劳永逸的模拟交易者！


    在某个时刻，你必须投入加密货币交易并投入你自己的资金。


    如果你在开始积极交易方面遇到困难，请设定一个交易日期，并在交易中投入少量资金。最终，你必须“破釜成舟”，让自己暴露在加密市场中，无论好坏。


    记住：凭借经验和（一些）运气，会出现巨大的机会和财富。![](img/image0171.jpeg)[](Images/image0168.jpeg)


    # 第 8 章从加密货币中获利以及创造跨代财富的钥匙


    ## 核心信息


    想要成为百万富翁并创造跨代财富的加密货币投资者必须是自律、冷静且注重记录的投资者，以设定目标、里程碑和市场出场策略。总的来说，加密货币投资者积累财富的最佳计划是投资具有长期前景的资产。


    ## 什么是跨代财富？


    当你实现了跨代财富时，意味着你在储蓄和投资中积累了一笔巨额财富，这笔财富具有韧性、自我维持能力，更重要的是它是安全的。因此，你的子孙后将从你一生创造的财富中受益。


    如今，普通人可以通过加密投资的倍数效应创造跨代财富。机会仍然存在；在 2021 年，有更多的加密货币增加了价值。然而，创造跨代财富不是一种暴富计划。你必须长期坚持；实现它需要坚持下去，不要让情绪误导你。


    历史上第一次，加密货币使成为富翁的机会民主化。此外，在财富保护方面，加密货币可以成为保持家族财富完整并将其传给后代的基石。由于市值超过 4000 亿美元，估计由于比特币的并行上涨，产生了
    18,000 名新的百万富翁。此外，比特币的崛起可能仅处于婴儿阶段，并且是在全球范围内发生的，这意味着积累巨额财富是一个稀有机会；从历史上看，财富转移主要发生在区域规模上。


    由于加密货币具有不可预测且防黑客的 SHA 加密密钥——一种将数据字符串转换为精确 256 位数据的哈希算法——加密货币是保护跨代财富的不可思议的工具，因为它们几乎不可能被没收。你可以记住生成加密货币钱包的秘密种子助词，这个种子助词可以传给后代，也许甚至不需要第三方信托。此外，特定加密货币发行的代币数量是有限的，这是对抗通货膨的重要对冲。你能想象将比特币留给孙辈，并让其价值随着时间的积累，在他们成年时价值
    100 万美元或 500 万美元吗？通过将你积累的财富存储在加密货币中，你更有机会保护和增加你的家族财富，并抵御未来多年的通货膨胀。


    通过确保你的财富树拥有深根，让你的财富树持续生长。深根源于对具有良好投资回报的增长领域进行合理的投资。加密货币、区块链技术和加密相关行业不会消失。它们正在演变，以满足不同市场未满足的需求，并更有效地管理商业交易。


    现在，你可能怀疑加密货币作为长期投资的可行性，因为它的市场突然起伏，而没有明显的原因作为市场转变的。好吧，这种情况在股市中也会发生。然而，股市的变化有一些潜在的解释，因为股市与现实世界的有形资产和服务相钩。尽管有关于上市公司的信息以及
    24/7 全候播放可能影响它的每个国际事件的新闻广播，但对于大多数投资者来说，战胜股市很难。


    明明的投资者知道，当市场动荡且他们不确定如何处理他们的加密货币投资时，他们应该什么都不做。你在选择加密货币投资时的尽职调查、对市场活动的研究、你（理想情况下）与其抽离，以及你预定的投资出场计划将告诉你该做什么。但在大多数时候，你应该什么都不做。只需静候并观察市场的自我重置。


    具有长期心态的投资者不在乎市场的每日波动。相反，他们关注大局、他们随时间的投资表现，以及向投资组合中增加有价值投资的机会。例如，沃伦·巴菲是一个非常成功的投资者，他进行长期投资（几十年）。当资产价值突然下跌或出现熊市时，他并不会卖掉资产。相反，当市场处于谷底时，他会寻找随时间产生良好可持续回报的绝佳投资。简而言之，你的意图和行动之间必须保持一致。出于恐惧做出选择与长期投资策略是不一致的。


    到此为止，你已经决定采取长线策略并创造跨代财富（否则，你为什么要读这本书呢？）。然而，你保持抽离自信、实践尽职调查并观察市场的决心促使你继续前进，并掌握加密富翁的技术和心态。


