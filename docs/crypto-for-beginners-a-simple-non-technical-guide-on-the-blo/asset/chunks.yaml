    \ from your government identification:\n\n3.  First Name\n\n4.  Last Name\n\n\
    5.  Date of Birth\n\n6.  Last 4 Digits of your SSN\n\n7.  Address\n\n8.  Answer\
    \ the following questions:\n\n9.  What will you primarily use Coinbase for?\n\n\
    10.  What’s your primary source of funds?\n\n11.  What’s your employment status?\n\
    \n12.  What’s the total value – including cash and crypto – that you expect to\
    \ transfer to your Coinbase account in the next 12 months?\n\n13.  What industry\
    \ do you work in?\n\nSection 4\n\n1.  Click “Add a payment method” to link a payment\
    \ method to your account. For example, you can use your bank account, debit card,\
    \ wire transfers, PayPal, Apple Pay, Google Pay, and instant cash outs to bank\
    \ accounts in the US.\n\n2.  Click “Continue” when Coinbase prompts you to use\
    \ Plaid to connect your account.\n\n3.  Select your institution.\n\n4.  Enter\
    \ your credentials.\n\n5.  Verify your identity via text, phone, or email.\n\n\
    6.  Select the bank account you wish to link to Coinbase.\n\n7.  Select “Continue.”\n\
    \nSection 5\n\n1.  Sign in to your Coinbase account.\n\n2.  Go to “Profile & Settings”\
    \ on your mobile phone or “Settings” on your desktop computer.\n\n3.  If you are\
    \ on a mobile phone, go to “Require PIN / Face ID” and toggle the switch on. Enter\
    \ a PIN you will remember. Choose the settings you would like for your PIN / Face\
    \ ID.\n\n4.  If you are on a mobile phone, install one of the following apps:\
    \ Google Authenticator, Duo Mobile, or Microsoft Authenticator.\n\n5.  Go to your\
    \ Security Settings again. Click “Change security settings” and continue in browser.\n\
    \n6.  Navigate to “2-step verification.”\n\n7.  Click “Select” under the option\
    \ to install an Authenticator app on your phone.\n\n8.  Enter the 2-step verification\
    \ code sent to your mobile phone and click “Confirm.”\n\n9.  Click the QR code\
    \ to copy the app’s seed to your phone’s clipboard.\n\n10.  Open your Authenticator\
    \ app.\n\n11.  Select the option to enter a key. For account name, type “Coinbase.”\
    \ Then click “paste” in the box for the key. This will generate a time-sensitive\
    \ authentication code. Navigate back to Coinbase and enter the code into the 2-step\
    \ verification code from the authenticator app.\n\n12.  Click “Enable.” You have\
    \ now enabled two-step verification. This provides your Coinbase account with\
    \ additional protection and security from unauthorized access.\n\n**Buying Your\
    \ First Cryptocurrency**\n\n*Using a Computer*\n\n1.  Sign in to your Coinbase\
    \ account.\n\n2.  Click on the “Buy & Sell” button in the upper-right corner of\
    \ your screen.\n\n3.  Click the “Buy” button to select the crypto token you want\
    \ to purchase.\n\n4.  Enter the amount of the selected crypto token you want to\
