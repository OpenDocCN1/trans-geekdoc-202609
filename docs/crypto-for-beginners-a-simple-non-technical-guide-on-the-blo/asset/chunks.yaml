    \ your payment method.\n\n6.  Click on “Preview Buy” to verify your purchase.\
    \ If there is a problem with the purchase, click the “Back” button to edit your\
    \ transaction.\n\n7.  If your transaction details are correct, click the “Buy”\
    \ button to finish your purchase.\n\n8.  To make repeated purchases, like the\
    \ one you have just completed, click the “One Time Purchase” button, and choose\
    \ how often you want to repeat the purchase.\n\n9.  When you finish, sign out\
    \ of your account.\n\n*Using the Coinbase Mobile App*\n\n1.  Sign in to your Coinbase\
    \ account.\n\n2.  Touch the “Buy” button on the “Home” tab.\n\n3.  Choose the\
    \ crypto token you want to buy.\n\n4.  Enter the amount you want to buy in local\
    \ currency or in the currency of the crypto token you wish to purchase.\n\n5.\
    \  Tap the “Preview Buy” button to check your transaction details.\n\n6.  Touch\
    \ the “Buy Now” button if all the details are correct.\n\n7.  If you want to make\
    \ repeated transactions like the one you just completed, tap the “One Time Purchase”\
    \ button, and choose how frequently you want to make purchases.\n\n8.  When you\
    \ finish, sign out of your account.\n\n**Note:** The minimum purchase amount is\
    \ 2.00, whether it’s US$2.00 or EUR€2.00.\n\n![](Images/image00155.jpeg)![](Images/image00150.jpeg)CHAPTER\
    \ 5 \n\n# CASE STUDY – WHOLESOME BOUNTY GARDENERS AND THE BLOCKCHAIN REVOLUTION\n\
    \nNow let’s put what we learned about the blockchain in perspective.\n\nTo better\
    \ understand the blockchain, let’s run through an example of a group of community\
    \ gardeners that utilize a blockchain to assist in exchanging their garden’s yield\
    \ for their newly created cryptocurrency.\n\nLiam was part of a local community\
    \ garden group called the Wholesome Bounty Gardeners, which had over 40 members\
    \ that grew and traded produce with each other. Liam was an avid learner of blockchain\
    \ technology and wanted to leverage blockchain technology to facilitate transactions\
    \ amongst the community gardeners. So, he created a blockchain for the community\
    \ and called it the “WBG Blockchain,” and the coin transacted on the WBG blockchain\
    \ was known as “garden coin.”\n\n**How can the blockchain help the Wholesome Bounty\
    \ Gardeners?**\n\nLiam knew that the WBG community needed to store transaction\
    \ data in a way that nobody could change the transaction data once the transaction\
    \ occurred. He knew blockchain technology was the solution because there would\
    \ be no way to hack and change the number of garden coins on the blockchain. Each\
    \ transaction needed to reference an identifier in the previous transaction, creating\
    \ a chain of transactions. This chain of transactions needed to be immutable once\
    \ created, otherwise known as an *immutable ledger. *Liam did not want this immutable\
    \ ledger running only on his computer, so he wrote the blockchain to run on multiple\
    \ computers in the WBG group. Running the blockchain this way would, in turn,\
    \ provide multiple copies of the immutable ledger and *decentralize* control of\
    \ the blockchain amongst the members of the WBG. So, each computer with a copy\
    \ of this transaction ledger would be considered a *node* on the blockchain. Liam\
    \ wanted members of the WBG to transact with each other; also, he did not want\
    \ to be involved in the transaction or have any authority over the transaction,\
    \ otherwise knowns as *peer-to-peer transactions*.\n\n**How is it that Liam doesn’t\
    \ have authority over the transactions if all the WBG member accounts are on the\
    \ blockchain?**\n\nLiam knew the basic design of the blockchain was *trustless*.\
    \ But, first, he needed to show the community how the WBG blockchain had no third-party\
    \ oversight. He indicated that the WBG blockchain privately generated keys when\
    \ a member requested a private key to access the blockchain. The keys would come\
    \ in pairs, a *receive* key and a *private key*. The receiver or* public* key\
    \ would be a key that members would give out to their peers that wanted to send\
    \ them garden coins. The private key was a key that each user would use to access\
    \ the blockchain to view and send coins linked to their private key. \n\nExample\
    \ of what a private key looks like:\n\n*8efe77fc4e66ad2ea7eaec900ed5c38733b569576f4aca3042428b85811e0bc4*\n\
    \n**What if someone guessed the other members’ private keys or the WBG blockchain\
    \ created duplicate private keys? **\n\nLiam knew questions about the security\
    \ of the WBG would come up, because a good deal of the WBG members’ time and energy\
    \ would be recorded digitally on the blockchain, and the community wanted some\
    \ assurance of the integrity of the WBG blockchain. So first, Liam explained to\
    \ the community that the blockchain’s privately generated key had 2 to the 256\
    \ power (2^(256)) numbers in it—or a number with 77 digits of different possible\
    \ combinations. So, guessing someone else’s private key or ending up with duplicate\
    \ private keys was virtually impossible. Liam went further to make a comparison\
    \ below.³\n\n*    *There are an estimated 7.5 × 10^(18) grains of sand on Earth.*\n\
    \n*   *There are estimations of anywhere from 30 × 10^(21) to 70 × 10^(21) and\
    \ even 10 × 10^(23) stars in the “observable” universe.*\n\n*   *There is an estimation\
    \ of anywhere from 1 × 10^(78) to 1 × 10^(83) atoms in the known, observable universe.*"
