- raw: 'Single-chain wallets are wallets that you use for one public blockchain. This
    kind of wallet is most beneficial to people with an elevated level of commitment
    or a professional need to maintain a close connection with a specific public blockchain.
    For example, the people who would use a single-chain wallets are traders, miners,
    and dApp developers who prefer to use a particular public blockchain. If someone
    has a single-chain crypto wallet, the crypto wallet only has one public address
    or one public key because it is used with one public blockchain.


    *Multi-Chain Wallet*


    Multi-chain wallets allow their owners to store digital assets from multiple public
    blockchains in their crypto wallets. For example, a multi-chain wallet can store
    Bitcoin, Ether, EOS, and DOT. Crypto holders would have to hold numerous single-chain
    wallets on their electronic devices (e.g., mobile phone, desktop, laptop, tablet)
    to use single-chain wallets for different blockchains. However, with a multi-chain
    wallet, only one wallet needs to be installed on an electronic device for the
    crypto holder to access multiple public blockchains.


    ## CRYPTO WALLET ADDRESSES


    Your multi-chain crypto wallet will have a unique address for each different type
    of cryptocurrency stored in it. In short, your multi-chain crypto wallet will
    have separate addresses for your Ether, Bitcoin, and DOT tokens.


    When you want to receive crypto tokens from different blockchains, you need only
    copy the 25- to 30-character string address and paste it into the transaction
    box. These addresses enable you to receive cryptocurrency from other accounts.


    ## TYPES OF CRYPTO WALLETS


    There are two main categories of crypto wallets: hot and cold. A hot wallet (e.g.,
    web wallet, desktop wallet) is a software wallet connected to the internet. On
    the other hand, a cold wallet (e.g., hardware, paper) does not connect to the
    internet.


    *Hot Wallets*


    If your wallet is online, it is called a hot wallet. Because hot wallets are constantly
    accessible online, they are less secure than cold wallets. In addition, they are
    less secure because access to a hot wallet is continuously available.


    Their attractiveness comes from their ease of use, convenience, and suitability
    for daily trading. Hot wallets are easy to set up, their funds are easily accessed,
    and they are readily available for traders and crypto investors.


    *Cold Wallets*


    Cold wallets are crypto wallets that do not connect to the internet. These wallets
    are hack-proof because hackers cannot access them. These wallets are perfect for
    HODLers (i.e., people who only hold crypto) and those who do not trade daily.
    However, you must connect the wallet to the internet to use the crypto stored
    in a cold wallet. Therefore, crypto investors must ensure that they use a secure
    connection when connecting their cold wallets to the internet. If crypto traders
    do not secure their links, hackers may hack their links amid a transaction and
    steal crypto assets.


    *Hardware Wallets*


    A hardware wallet is a device you can connect to your desktop or laptop and store
    your public and private keys on. It looks like a USB. It has no battery and can
    access all your desktop apps.


    These wallets are more secure than hot wallets but less user-friendly than paper
    wallets. You can find a variety of them on the market at different prices. Often,
    beginning crypto investors find them challenging to use. Some examples of hardware
    wallets are Ledger Nano S and Trezor.


    *Paper Wallets*


    Paper wallets are the least popular crypto wallets because they require strict
    security precautions. Also, generally, paper wallets can only be used once. Plus,
    you cannot send partial funds via a paper wallet.


    They are hack-proof because they do not connect to the internet. To use these
    wallets, you must download a printed QR code. Although some paper wallets allow
    users to download a code and generate new addresses offline, others do not. Before
    investing in a paper wallet, you should research its cost, recommended security
    precautions, and how many transactions you can perform with your paper wallet.


    *Desktop Wallets*


    Desktop wallets are wallets you install on your desktop or laptop. You must install
    the anti-virus software that comes with these wallets. The anti-virus software
    is essential because it will prevent your crypto transactions from being hacked
    when accessing your wallet or connecting it to a blockchain. These wallets are
    user-friendly, don’t use third parties, provide anonymity, and give you privacy.
    Some desktop wallets are Exodus, Bitcoin Core, and Electrum.


    *Mobile Wallets*


    Mobile wallets are like desktop wallets, but the wallet’s design is optimal for
    mobile phone performance. Unfortunately, despite being well-designed for daily
    transactions, they are vulnerable to infection by malware. These wallets must
    also be encrypted so that anyone hacking your mobile phone cannot easily access
    your crypto wallets or transactions. If you are interested in mobile wallets,
    check out Coinomi and Mycelium.


    *Web Wallets*


    Web wallets are accessed using Internet browsers and are vulnerable to many online
    attacks (e.g., phishing, malware, browser extension risks). They may be hosted
    or non-hosted online. Hosted ones are more likely to be hacked than non-hosted
    ones. It is better to use non-hosted wallets because you are always directly controlling
    your funds with them. They are suitable for small investments and NFTs. Some examples
    of web wallets are MetaMask and Coinbase.


    ## CREATING AN ACCOUNT ON A CENTRALIZED CRYPTOCURRENCY EXCHANGE


    Are you ready to open a CEX account? If you haven’t opened one yet, this tutorial
    can help you do it. This tutorial teaches you how to open a CEX account on Coinbase.
    The process is similar when you open accounts on other CEXs.


    Before creating your CEX account, review the following checklist. When you can
    answer “yes” to all the questions on the list, you are ready to open your Coinbase
    account.


    **Checklist:**


    *   Are you 18 years of age or older?


    *   Do you have government-issued identification (e.g., a driver’s license or
    passport)?


    *   Do you have a computer or mobile phone that is connected to the Internet?


    *   Do you have a phone number connected to your mobile phone? (You need one to
    receive Coinbase’s SMS messages.)


    *   Are you using the most up-to-date version of your Internet browser?


    You are now ready to open your Coinbase account.


    **Setting Up Your Coinbase Account**


    *Section I*


    1.  Go to https://www.coinbase.com or download the app to your mobile phone.


    2.  Click on the “Create free account” button (mobile) or “Sign Up” button (desktop).
    On desktop, choose the account type “Individual.”


    3.  Enter the following information on the page:


    4.  Full Legal Name (the one listed on your government identification)


    5.  Email Address


    6.  Password (keep a copy of it somewhere safe and secure)


    7.  Review the User Agreement and Privacy Policy.


    8.  Check the box stating that you agree with both of them.


    9.  Click the “Create free account” button.


    Section 2


    1.  Verify your email address when you receive an email request from Coinbase
    asking you to confirm your email address.


    2.  Click the link in the email. It will take you back to the Coinbase website.


    3.  Sign in to your account using your email address and password. (Use the same
    email address to which Coinbase sent the email confirmation request earlier.)


    4.  Add your phone number to your account when the website prompts you to.


    5.  Select the country to which your mobile phone number is registered (desktop).


    6.  Type in your mobile phone number.


    7.  Click the “Send code” button (desktop) or the “Continue” button (mobile).


    8.  Type in the 7-digit code sent by Coinbase (to your computer or mobile phone).


    9.  Double-click the “Submit” button (desktop) or the “Continue” button (mobile).


    10.  If you did not receive the 7-digit code, double-click the “Resend code” button.


