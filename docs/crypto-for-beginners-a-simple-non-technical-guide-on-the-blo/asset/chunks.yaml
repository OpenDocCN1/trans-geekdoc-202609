    如果您拥有的加密货币交易较少或数量很少，可以手动填写 `Form 8949`。然而，假设您在一年中通过多个交易所进行了多次加密货币交易，并使用了大量的钱包。在这种情况下，要将所有交易整合在一起以确定您的盈亏可能是一项非常耗时的任务。因此，你可以利用在线加密货币税收服务，它可以帮助你整合所有的加密货币交易并自动生成
    `Form 8949`。


    ## 手动申报加密货币税款


    *   填写 `Form 8949`。要做到这一点，你必须输入在纳税年度内处置的所有应纳税加密货币。

    *   在 `Form Schedule D` 上报告来自 `Form 8949` 的所有净加密货币资本收益和亏损（包括短期和长期收益和亏损）。

    *   在 `Form Schedule 1` 上报告您来自空投、区块链硬分叉、流动性池、奖金、推荐奖励等的加密货币收入。

    *   自雇或经营加密货币业务且有加密货币收入的纳税人必须填写 `Form Schedule C`。

    *   完成您的纳税表 `Form 1040`，并将您完成的其他表格附在您的税务申报中。

    *   将填写后的表格提交给 `IRS`（美国国税务局）。


    ## 使用加密货币在线报税软件


    您可以参考本书的附录部分获取关于加密货币税收申报软件的建议。但为了准备使用在线报税软件，您需要将所有的交易数据组织在一个地方。请参阅下方关于创建文件夹文件系统以整合所有加密货币交易所和钱包交易详情的建议。


    ## 管理原始加密货币交易数据


    1. 下载您加密货币交易所和钱包的所有交易数据。

    2. 在该文件夹创建一个名为 `Tax Year`（纳税年度）的文件夹。在 `Tax Year` 文件夹中，为当年使用过的每个加密交易所创建一个文件夹。`DOWNLOADED-RAW`
    文件夹将包含您直接从交易所或钱包下载的所有交易数据。其理念是让下载的数据完全不经修改。`MODIFIED-IMPORT` 文件夹将包含税收软件为了正确导入所需的任何格式更改。


    示例：


    ```

    2022/Coinbase/DOWNLOADED-RAW

    2022/Coinbase/MODIFIED-IMPORT

    2022/EXODUS-WALLET/DOWNLOADED-RAW

    2022/EXODUS-WALLET/MODIFIED-IMPORT

    ```


    在每个 `MODIFIED-IMPORT` 文件夹中，使用文件名格式 `{exchange/wallet}-{tax year}-{today’s date
    in mm-dd-yy}-IMPORT.xls` 包含年度交易数据。


    **示例：** `Coinbase-2022-04-01-2023-IMPORT.xls`


    不要更改 `DOWNLOADED-RAW` 文件夹中从交易所或钱包下载的文件名。以下是加密货币交易所或钱包存储在交易日志中的示例（例如列标题）：


    *   日期（格式）（例如 `01 Jan 2022 12:00:00 GMT`）

    *   交易类型（买/卖/交易/挖矿奖励）

    *   出售的币数量

    *   出售的币价格

    *   出售的币名称

    *   购买的币数量

    *   购买的币种名称

    *   以美元计算的购买币价格（成本基准）

    *   交易费用

    *   加密货币交易所

    *   加密货币交易所所在的司法管辖区（例如美国、加拿大、瑞士）


    将所有的交易数据归档到这些文件夹中，当税季到来时，你将拥有一个所有税务数据的仓库，可以将其导入到报税软件中。加密货币税软件会自动生成您的 `Form 8949`，然后你可以将其发送给会计师或使用可以完成该表的软件。你必须将所有表格提交给
    `IRS`。可以考虑 `TurboTax` 和 `TaxAct`。


    ## 创建您的加密货币主组合


    跟踪加密货币持仓量、收益和亏损的一种极佳方法是创建一个主组合，以便在完成纳税表所需的记录。然后，你可以参考以下内容来解决加密货币问题。


    创建主组合的过程如下：


    *   使用加密货币服务创建主组合以查看代币总额。其中一些网站提供免费服务，如 `CoinGecko`。

    *   通过代币跟踪网站准确记录您的交易，这将帮助您保持信息更新。


    ## 结论


    我们刚刚经历了一场精彩的加密货币发现之旅！自从从第一章开始，这是一段非常棒的旅程。首先，我们有了一个秘密蓝图，帮助您处于正确的状态，以进行加密货币投资冒险。此外，我们决定让加密货币投资主要服务于我们的目标，并且我们不会怀疑自己或让情绪控制我们的决策。我们学习开始建立基础知识。


    为了帮助建立加密货币的基础知识，我们回溯了过去，看看社会和国家传统是如何使用物品作为财富的。随着我们进入现代，解决方案正在变得变得数字化。了解货币如何随时间推移保持财富价值以及这些货币经历的所有挑战，是帮助您评估并找到可以投资的区块链和加密货币的第一步。

