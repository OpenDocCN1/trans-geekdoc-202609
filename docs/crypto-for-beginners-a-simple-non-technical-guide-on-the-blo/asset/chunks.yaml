  trans: '


    请注意，这是盈利投资的关键之一。*成功的投资取决于设定正确的卖出目标，而不是在正确的时间出售。*¹⁸ 因此，当加密货币价格上涨时，请密切你的卖出目标。当市场价格达到你的卖出目标时，`SELL`
    持仓比例的 10% 到 20%。请注意，某些加密货币交易所提供自动卖出选项，按指定价格卖出。然而，`不要卖掉全部仓位`，因为币价可能会再次上涨。例如，假设你投资了一个代币
    $1,000，当市场上涨时，你的投资现在变成了 $2,000，而不是卖掉全部 $2,000 的仓位。你卖出仓位的 20%，即 $400，你仍然持有价值 $1,600
    的投资。当你的币价再次翻倍并达到 $3,200 时，再次卖出 20%，赚取 $640 的利润。因此，你的收益是 $400 和 $640，超过了你最初的 $1,000
    投资——而你仍持有价值 $2,560 的投资。随着币价持续上涨，继续增量地卖出 10% 到 20% 的持仓。一旦市场开始下跌，你可以决定是否通过`dollar-cost
    averaging` 将收益投回，或者使用利润偿还或购买你为财务目标设定的任何东西。记住，这是一个长战；可能需要几个月甚至几年才能达到卖出目标。保持耐心，要知道你已经种下了财富的种子并正在收获回报。


    你必须记住，你的卖出目标是基于币价值的。如果你有一个低价值代币，期望其市场价格上涨到比特币的水平是愚蠢的。当然，这可能会发生，但你应该根据代币的潜在市场成功和需求为它们设定现实的卖出目标。


    ### 加入社区


    不要单打独斗！全球数百万加密投资者正刚刚开始，学习市场，并尝试建立跨世代的财富。你可以从他们那里学习、获得支持并鼓励，但你必须努力成为加密社区的一部分。你可能会在线或当地发现一些优秀的投资小组、投资大师或讨论论坛。敞开自己，去结识加密爱好者并扩大你的加密网络。


    让我们回顾你的 HODL 计划：


    *   进入 HODL 计划的最佳方式是对你的加密货币投资进行`dollar-cost average`。不要一次性全部投入。

    *   在市场大幅上涨之前，尽早设定你的卖出目标。始终跟踪你加密货币的原始购买价格。

    *   记住，现金也是一种寸。始终保留现金储备，以便在价格下跌时买入。


    ## 再投资你的利润


    再投资对投资者来说是一个巨大的挑战，因为这意味着投资者已成功从市场中获利。然而，这也意味着你必须决定何时获得了足够的利润，以及何时等待更多利润。


    在从投资中提取利润之前，问自己以下问题：


    *   我为什么要买这个代币？

    *   我对这个加密代币的投资目标是什么？

    *   我持有这个代币感到舒适吗，还是卖掉部分投资对我更好？

    *   在什么种点我对获利感到舒适（50%、100%、300%、500% 等）？

    *   我的收益是否有更好的投资机会？


    当你决定从投资中提取出一部分利润后，应该立即对其进行再投资。然而，在再投资之前，你应该对你的选择进行彻底研究，并根据你的目标、财务状况和时间限制做出最佳决策。


    再投资利润时，你可能考虑的一些投资包括：


    *   加密挖掘

    *   投资新的加密代币

    *   租赁物业

    *   偿还你当前的债务（例如：信用卡、房贷、学贷款）

    *   HODLing（长期持有）


    如果你不想出售你的加密代币，并希望在持有它们的同时从中获利，你可以采取以下操作：


    *   将你的加密代币借给其他加密投资者（即`P2P loans`）

    *   参与短期加密交易以获取快速利润，即在一个交易所低价买入代币，并立即在另一个交易所高价卖出（即`arbitrage`）


    ## 投资组合多元化


    当你再投资利润时，你的目标应该是收益最大化、损失最小化并降低整体风险。为了对市场低迷，尝试投资受不同市场状况影响的资产。此外，通过在股票和加密市场之外的资产类别中分散你的投资也将受益。


    ## 投资加密货币时不要的事


    大多数加密投资者失败是因为他们在管理加密货币投资时没有保持冷静、中立的心态。尽管他们打算坚持投资策略，但他们往往会成为 FUD（恐惧、不确定、怀疑）和 FOMO（错失恐惧）的受害者。让我们检查
    FUD 和 FOMO，看看你是否正落入圈套。


    ### FUD


    大多数加密投资者是情绪化交易者。他们的情绪往往决定了他们对市场变化的反应。有趣的是，FUD 可以影响个人、投资小组和社区——甚至可以成为一种市场特征的感觉。


    *   **恐惧 (Fear)** – 恐惧源于过度担心你会遭受财务损失或无法实现财务状况最大化。这也是由于对自己的投资策略、直觉或过程缺乏信心引起的感觉。

    *   **不确定 (Uncertainty)** – 不确定性是加密投资中一种难以抑制和隔离的感觉，因为加密市场具有波动性、不可预测性、与现实需求脱节且具有高度投机性。加密世界中没有人能确定任何事情。此外，加密代币的价值可以在不到一个月内增加
    1000%，然后在几周后下跌超过 5000%。不知道代币价格是否会再次反弹、何时反弹以及它将保持强势多久，这种瘫痪的不确定性阻碍了一些最优秀的投资计划和策略。

    *   **怀疑 (Doubt)** – 怀疑是一种隐性的感觉，尽管有些人竭力以理性、经过计算的方式进行投资，仍受其困扰。投资者可能会执结于自己是否做得足够以保护投资、最小化损失和最大化收益。此外，当加密市场的波动性和不可预测性使你深思熟虑的投资计划和策略变得毫无意义时，这种感觉很难根除或抑制。不幸的是，极具可能的投资者会因为自我怀疑而屈协，因为他们想避免过去遭受的市场损失，并做出那个最后一时刻的投资决策，以避免像某些加密投资同行一样遭受财务毁灭。


    #### 击败 FUD


    你可以通过以下方法击败 FUD：


    *   设定清晰可行的投资目标和里程碑。

    *   保持多元化的投资组合。

    *   识别 FUD 何时占据你，并为此制定应对机制。你的目标是显著减少——如果不是消除——并控制它。

    *   设定在市场中采取特定行动的指南，除非少数情况下否则不要偏离计划。

    *   记录你何时交易资产、为什么交易以及交易的结果。

    *   关注市场以及你投资组合中的加密资产的动态。你对加密市场的知识和市场交易经验将帮助你远离 FUD，并防止你成为其受害者。


    ### FOMO


