- raw: 'For example, under the Proof of Work, or PoW, consensus algorithm used for
    mining cryptocurrency (e.g., Bitcoin, Ethereum), miners competed to solve complex
    mathematical equations to win the right to mine a block. The miners use energy-guzzling
    computers with high computational abilities to guess the answers to complex mathematical
    equations. As miners submit their incorrect guesses to the network, other miners
    use those wrong guesses to improve their guesses to have a better chance of guessing
    the correct answer. The first miner to guess the correct answer would have already
    seen similar solutions or answers close to his. In this way, miners check each
    other’s work.


    After a miner guesses the correct answer, the miner puts the transactions in a
    block and cements them into the blockchain. Note, while a miner is constructing
    a block, other miners compete to mine the next block. When miners complete a block,
    and the block is ready to be added to the blockchain, the miner does not simply
    add it to the next block. Instead, the miner who has won the right to add a block
    to the just-completed block will have to participate in the minting process of
    the finished block before miners can add his block to it. Minting is a form of
    checks and balances. No one miner can mint an entire block by himself. Cooperation
    between the miners and other people checking the information on the block and
    the transaction confirmations before the blocks are sealed and added to the next
    block.


    If there are any block problems, miners will report the problems to another network
    operator so that operators can investigate them. Why? Because if miners find a
    problem with the minted blocks or how the miners process the block, the blockchain
    rewards the miners with native tokens for being vigilant and protecting the blockchain.


    ## TRANSACTION SPEED


    Transaction speed refers to the rate at which a blockchain can process and confirm
    the transactions executed on it. The term transactions per second (TPS) refers
    to the transaction speed of a blockchain. Blockchains with a high TPS rate can
    simultaneously service many people and are less likely to become congested during
    high traffic. They are also more likely to have low transaction fees. As their
    TPS gets higher and higher, they become more akin to traditional financial systems
    like those operated by Visa and Mastercard.


    Let’s look at some numbers.


    ![](Images/image00146.jpeg)


    ## THE BLOCKCHAIN CHALLENGE: DECENTRALIZATION AND HIGH TPS RATE


    For blockchains to become a part of everyday life and integrated into the existing
    financial system, they must significantly increase their TPS rate. Higher TPS
    rates are associated with efficiency, reliability, and scalability. To the point,
    blockchains must be scalable if they are going to be able to handle large numbers
    of transactions. Moreover, they must maintain their efficiency rates even when
    there’s a large volume of traffic on the blockchain. The challenge for blockchain
    is to remain decentralized and still be secure, scalable, and efficient.


    Let’s compare centralized operations to the blockchain. Like Visa and Mastercard,
    centralized operations have servers, security personnel, and other support staff
    at one or more primary locations. This concentration of manpower and computing
    power enables the companies to securely, safely, and efficiently process more
    than a thousand transactions per second.


    Unfortunately, this does not work for decentralized operations because there is
    a trade-off at some point. If a function is decentralized but lacks security and
    is not scalable, then at some point, it becomes an inefficient, unsafe database
    that will fail and/or be vulnerable.


    ## NO DOUBLE-SPENDING


    Double-spending occurs when a network user simultaneously tries to send the same
    crypto payment to two different addresses. For example, if you have only 5 BTC
    in your crypto wallet and try to send the 5 BTC to two other crypto wallets, you
    are trying to double-spend. Your two transactions will go into the mempool, where
    all submitted transactions reside until node operators select them. When miners
    choose your transactions, miners will process only one. The second one pulled
    will be rejected as invalid because you have no BTC in your crypto wallet (you
    used up all of your BTC in the first approved transaction).


    If your transactions are selected simultaneously, the transaction that receives
    the most confirmations executes the consensus algorithm under the blockchain.
    The other transaction will be rejected, declared invalid, and discarded.


    ## GOVERNANCE


    Blockchains have a governance system to introduce or modify the blockchain’s functionality.
    Governance refers to the way decisions are made about the blockchain’s operations.
    Usually, decisions are made by those who can vote on proposals submitted to the
    system operations managers. Voters can vote for anyone who holds native tokens,
    those who own specific kinds of tokens (e.g., governance tokens), those with a
    particular amount/value of coins, and even investors in the blockchain. Still,
    the voters can restrict proposed changes to the blockchain. For example, for changes
    to the Ripple blockchain, at least 80% of its node operators must approve the
    change. If less than 80% of its node operators agree on the transition to the
    blockchain, the operators reject the change.


    ## BLOCKCHAIN FORKS: HARD & SOFT FORKS


    We have discussed how blockchains work, how they maintain their trustworthiness,
    and how they process transactions. This section looks at what happens when the
    blockchain community members cannot agree on improving a blockchain.


    When members of a blockchain community disagree on improving a blockchain, the
    situation may become very contentious. If the disagreement becomes polarizing,
    opposing factions can become deeply embedded in their position and resistant to
    compromise. However, members must reach a compromise if the in-fighting starts
    to tear the community apart. In these cases, we see the creation of hard forks
    and soft forks.


    *In-Fighting Gone Awry*


    If Group A of the blockchain community wants the blockchain to have more giant
    blocks so that the blocks can hold more transactions, but Group B wants the block
    size to stay the same, there will be a problem. If the groups cannot come to a
    compromise with each other, one of them may decide to launch another blockchain.


    Launching another blockchain is not a win for the blockchain community because
    the more significant the blockchain community, the higher its market value, the
    more secure its network, and the more relevant it is in the crypto world. Therefore,
    when blockchains fork, generally, one of the two spectacularly fails or is overshadowed
    by the more successful blockchain. In addition, the original size of the blockchain
    community diminishes, and there’s a decrease in the original blockchain’s security.
    Forking success depends on how many community members stay with the original blockchain
    or migrate to the fork. Ultimately, the success of the division and the original
    blockchain rely on the network users and their respective communities.


    *Hard Forks*


    When there is a hard fork, transactions cannot process on the original blockchain
    on the fork and vice versa. The incompatibility is because the creators of the
    division substantively change the blockchain fork’s code, so the separation is
    no longer compatible with the original blockchain. They then give the blockchain
    a new name and create a new native token (e.g., Bitcoin XT, Bitcoin Classic, Bitcoin
    Cash, Bitcoin Unlimited, Bitcoin Gold).


    *Soft Forks*


    When blockchain community members want options, they create a soft fork, but adding
    the options does not require them to abandon the original blockchain. In this
    case, the network users can use or ignore the additional feature. Soft forks do
    not get new names or have their own native tokens.'
