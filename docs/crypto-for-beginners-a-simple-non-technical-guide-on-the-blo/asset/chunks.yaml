    使用长度为 12 个字符或更长的密码。随着长度的增加，它们变得更加健壮和安全。强密码应混合大写字母、小写字母、特殊字符和数字。模式应该是随机的，输入时的键盘路径不应该是易记的。它们也不应包含你的个人信息、位置或任何黑客可以根据你的背景或对你的熟悉程度所推测的内容。此外，不要在相同或不同账户上重复使用旧密码。


    ## 生成强密码


    如果你不确定如何生成强密码，这里有一些你可以采用的方法⁴：


    *   使用如 `NordPass` 等密码生成器应用程序创建你的密码。

    *   使用短语并对其进行缩写。

    *   从字典中选择随机单词，并使用不同的特殊字符和数字将它们组合起来。

    *   使用缩写的名言。

    *   在密码中使用表情符号。表情符号是特殊字符、标点符号和数字的组合。例如：


    ![](img/image00154.jpeg)


    *   为所有账户使用相似的密码，但更改开头或结尾，使其针对每种类型的账户进行专门化。


    ![](img/image00169.jpeg)![](img/image00156.jpeg)第 7 章


    # 如何寻找加密货币明藏


    ### 核心信息


    投资者主要使用基本面分析和技术分析来决定想要交易或购买哪些加密货币。基本面研究侧重于研究加密项目并估计其增长、寿命和市场价值的。相比之下，技术分析侧重于观察历史价格波动，并利用资产的市场趋势对未来价格波动做出预测。最终，你应该选择一种反映你的风险承受能力和对资产认知的投资/交易策略（例如，购买公司的一部分与交易公司的股份）。


    ## 基本面分析 VS 技术分析


    ### 基本面分析


    基本面分析（`FA`）要求投资者花费大量的时间、精力和努力研究公司，并确定其“真实”（又内在）市场价值和增长潜力。这种分析最计划购买并持有资产超过一年的的人。


    根据“奥马哈神谕”、最著名的 FA 投资者沃伦·巴菲特的说法，基本面分析被认为是想要积累家族财富并实现财务独立的人的最佳投资策略。


    ### 技术分析


    技术分析（`TA`）通常由短期投资者/交易者使用，因为他们的市场成功取决于在最佳价格点进行交易。TA 关注资产在市场中的历史表现，并利用其之前的表现来预测未来的价格波动。其工具使用价格波动的趋势、总结随时间波动的数学方程，以及交易者可以使用计算机分析识别的其他类型的市场信号。


    使用 TA 工具做出交易决策的投资者通常使用使用多个工具来确定市场趋势以及他们应该何时入场和离场。最著名的 TA 投资者是那些在 2021 年成功交易 `DOGE`（狗狗币）、`AMC`（Amnext）和
    `COSS`（加密一站式解决方案）并从低市值短暂飙升至平层大气层发财的人。


    在本章中，我们将回顾 FA 和 TA 的基础知识。虽然两种分析技术都无法保证作为加密货币交易者或投资者在市场上的成功，但你应该选择适合你的一种种。


    ## 加密货币基本面分析 (FA)


    `FA` 查看加密项目的运营、管理、分配和潜力。此外，它还衡量了可能影响加密货币市场估值的方面。


    ## 定性与定量分析


    投资者审查加密货币的关键特征。考虑的因素包括：


    *   管理

    *   治理

    *   组织结构

    *   专利

    *   专有技术

    *   品牌

    *   市场利基

    *   市场规模

    *   竞争对手

    *   市场周期

    *   财务报表（例如：资产负债表、利润表、现金流量表）


    ### 运营：管理、治理


    作为投资者，你希望决策者有技能和经验做出对价值产生积极影响的决策。


    ### 技术优势：专利、专有技术、共识算法


    加密公司可以在不同的区块链上发行加密代币（例如 `USDT`、`USDC`）或主要发行（例如 `BTC`、`XRP`、`DOT`）。代币的用途越高，其市场价值和需求越大。用途有限的加密代币必须产生高需求，因为否则没有人会购买它们。为了让限量代币产生高需求，它必须占据一个未开发的市场利基（例如
    `XRP`）。


    融入加密代币生态系统运营、发行、被动投资机会或程序中的技术也会影响其声誉。加密货币投资者通常倾向于获取不太可能被黑客、因运营规划或维护失误而无法使用、或过时的公司发行的加密代币。总之，所有这些问题可能会显著减少对加密货币的需求，如果更严重，还会消除其需求。


    ### 代币经济学


    Tokenomics 指代币的供应、销毁和使用。此外，投资者/交易者应该了解代币是否有自己的生态系统、它是否可以在多个区块链上使用、是否在加密货币交易所交易，以及公司如何向公众分配代币。


    ### 代币供应


    供应有限的代币可能会随时间增值，特别是公司每年销毁相当比例的代币。此外，如果加密货币的代币供应无限，你想知道代币是如何发发的：


    *   公司每年铸造多少代币？

    *   公司每年销毁多少代币？


    ### 代币获取性


    在 `CEXs` 上购买的代币比只能在 `DEXs` 上购买的代币更有信誉，因为 `DEXs` 对加密代币的上市要求比 `CEXs` 低。由于标准宽松，`DEXs`
    有比 `CEXs` 更多低价值和欺诈性的代币。


    '
