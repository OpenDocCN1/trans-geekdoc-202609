- raw: "Needless to say, these risks are similar to someone stealing your credit card\
    \ number and using it to make fraudulent charges. But with cryptocurrency in your\
    \ possession, there is no customer service fraud to dispute these charges or withdrawals.\
    \ Later in the book, we will learn about how to safely secure your cryptocurrencies\
    \ so that this would most likely never happen. But you should understand and be\
    \ aware of these when you invest in cryptocurrency.\n\nThe advice given to all\
    \ crypto investors is never to invest more than you can afford to lose. Or, put\
    \ another way, never invest more than you can comfortably walk away from with\
    \ no regrets.\n\n## WHY ARE THERE SO MANY CRYPTOCURRENCIES?\n\nEach cryptocurrency\
    \ has a unique value that serves a specific purpose and caters to certain types\
    \ of businesses or interests. So, people create them to fill those niches (e.g.,\
    \ privacy, fast transaction processing, gaming tokens). Other cryptocurrencies\
    \ are joke or meme coins (e.g., Dogecoin). Still, other cryptocurrencies are poorly\
    \ designed and launched as investment scams.\n\nYou should know that crypto scams\
    \ increase at least tenfold each year. The extraordinary increase in crypto scams\
    \ is due to the large amounts of money in the crypto market and its abundance\
    \ of inexperienced investors. Unfortunately, the crypto world is an irresistible\
    \ target for scammers and fraudsters. Many people are eager to invest in crypto\
    \ assets, yet they cannot discern legitimate investments from outright scams.\n\
    \n## IS NOW THE RIGHT TIME TO GET INTO CRYPTOCURRENCY?\n\nYes, this is a perfect\
    \ time to get into crypto. If the prices of crypto are running fairly high as\
    \ you are thinking of investing in cryptocurrency, remember that the mass adoption\
    \ period has not yet occurred and if you make the right cryptocurrency picks based\
    \ on the fundamental analysis we will discuss in later chapters, you’ll be ready\
    \ for the massive returns when cryptocurrency mass adoption takes place. Remember,\
    \ cryptocurrency is gambling, and with gambling, there are inherent risks, but\
    \ if you start to understand how revolutionary blockchain technology is and its\
    \ impact on society, you can rest assured you are investing in a sound technology.\
    \ If the prices of the cryptocurrency market are currently down, this is an even\
    \ a better reason to buy cryptocurrency.\n\n## IS CRYPTO A BUBBLE?\n\nThe crypto\
    \ market has experienced several bubbles. At the time of this writing, the crypto\
    \ market is correcting itself. When the market corrects itself, the prices of\
    \ crypto tokens drop markedly. The sudden decline in crypto tokens’ valuations\
    \ scares people. The naysayers use it as proof that the crypto market is a scam.\
    \ However, it is well known that most modern markets go into bubbles when they\
    \ are hot (e.g., mortgage, real estate, dotcom, savings, and loans).\n\nSuppose\
    \ you ask me if the cryptocurrency market will disappear when the current bubble\
    \ bursts. The answer is no. The market is doing a price correction. After the\
    \ price correction completes, the market will still exist, and people will still\
    \ invest in it and earn high yields.\n\nThe cryptocurrency market is like the\
    \ Internet in 1990. It’s hot, sexy, exciting, and flush with cash. Unfortunately,\
    \ it’s also an overheated market fueling overheated imaginations and lots and\
    \ lots of greed. Like the dotcom crash cleared away all the bad and poorly performing\
    \ web companies, crypto bubble bursts wash away the poorly performing crypto tokens\
    \ and leave behind the high-quality, high-performing crypto tokens.\n\n## MASS\
    \ ADOPTION OF CRYPTOCURRENCY HAS NOT YET OCCURRED\n\nAlthough you can hear and\
    \ read about cryptocurrency everywhere, it has not yet been integrated into traditional\
    \ economies worldwide. A small percentage of people and well-capitalized businesses\
    \ have invested in cryptocurrency. Growth opportunities and innovation attracted\
    \ these businesses to it because it was new and had potential. Others saw the\
    \ potential for great returns and that it had a future. Lately, many institutional\
    \ investors and governments are now investing in it because they see it as a competitor.\
    \ Still, overall investment in cryptocurrency is relatively tiny compared with\
    \ other investments.\n\nNote, rates of integration into local economies vary from\
    \ region to region and, within regions, from country to country. Therefore, you\
    \ will find, across the world, that populations differ in terms of their acceptance\
    \ of cryptocurrency as a viable form of payment, a worthwhile investment, and\
    \ as something that will continue to be a part of their economic system in the\
    \ foreseeable future.\n\n![](Images/image00151.jpeg)![](Images/image00145.jpeg)CHAPTER\
    \ 3 \n\n# THE BLOCKCHAIN REVOLUTION IS MAKING IT ALL POSSIBLE\n\n**Take-Home Message**\n\
    \n*Before investing in cryptocurrency, you should understand the essential parts\
    \ of a blockchain. As your knowledge of the blockchain grows, it will help you\
    \ compare and evaluate distinct types of blockchains.*\n\n## WHAT IS A BLOCKCHAIN?\n\
    \nA blockchain is like a digital ledger that publicly displays all the anonymous\
    \ transactions processed and logged in a permanent digital record. It is similar\
    \ to the ledger used for your checkbook. The ledger is the record section where\
    \ you record your debits and credits.\n\nBlockchain transactions are only between\
    \ the sender and receiver of the payment and are known as peer-to-peer (P2P) transactions.\
    \ There are no third parties involved in a P2P transaction. P2P transactions are\
    \ trustless because no third parties supervise the transaction; it has no trustees.\n\
    \nThe blockchain handles the entire transaction without the assistance of any\
    \ intermediaries. The trustless transaction gives participants independence from\
    \ third-party oversight, governmental regulation, and censorship by parties not\
    \ involved in the transaction.\n\n## WHY IS IT CALLED A BLOCKCHAIN?\n\nLet’s look\
    \ at this from the perspective of Bitcoin’s and Ethereum’s original blockchains.\
    \ When the programmers launched the blockchains, miners would create blocks of\
    \ transactional data by solving complex mathematical equations. Miners are simply\
    \ people who run a computer program to allow transactions to occur on the blockchain.\
    \ The first miner to solve the equation won the right to process the next set\
    \ of transactions.\n\nMiners store the transactions in blocks. A block is like\
    \ a USB memory stick with limited memory. Miners can only keep as many transactions\
    \ as will fit within the block’s memory. So, miners must select from the memory\
    \ pool (mempool) a pool of transactions submitted for execution that will be processed\
    \ and stored in the block.\n\nThe miner processes the transactions for the miner’s\
    \ block, and when finished, the miner adds their block to the most recently completed\
    \ block. All the blocks have time and date stamps. This chain of blocks filled\
    \ with transactional data is called the blockchain.\n\n## BLOCKCHAIN CHARACTERISTICS\n\
    \nIn this section, you will review the essential characteristics of a blockchain.\
    \ These characteristics make blockchains an incredible technological innovation\
    \ that revolutionizes the world of finance and, ultimately, our everyday lives.\n\
    \n## DECENTRALIZED NODES\n\nBlockchains operate 24 hours a day, seven days a week\
    \ and lack a central processing location. Furthermore, blockchain nodes are spread\
    \ over many computers worldwide. Blockchain networks exist globally, meaning the\
    \ government or other authoritative bodies cannot simply shut them down. Moreover,\
    \ the nodes process P2P transactions, and no one oversees them; they are trustless\
    \ transactions. In addition, if there are problems in one part of the network,\
    \ other computers can continue to process network transactions. The computers\
    \ on a blockchain network are called nodes. There are two types of nodes: full\
    \ nodes and light nodes."
