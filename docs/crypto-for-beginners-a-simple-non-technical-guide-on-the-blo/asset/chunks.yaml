    花些时间研究并为你寻找最适合的加密货币投资。找到适合你的投资意味着，如果你对风险的承受能力较低且投入加密货币市场的资金有限，你就不想投资衍生品、差价合约（CFDs）或高风险加密货币代币（例如首次代币发行
    [ICOs]）。然而，如果你有很多钱可以花，并且能够忍受高风险投资而不会感到沮丧，那么高风险、高投机性的加密货币投资可能是一个不错的选择。同样，如果你是进入市场并希望投资于风险较低且具有市场历史的保守资产，请将资金投入传统代币（例如：`Bitcoin`、`Ether`）。


    # 投资目标


    投资目标首位，其次弄清楚投资什么以及何时卖出就会变得容易。每次进行投资时，都要写下该投资的目标。例如，如果你的目标是投资 1,000 美元并偿还 4,500
    美元的债务，以此为重点。然而，如果你的目标是创造跨代财富，你必须找到合适的项目，战略性地投入你的资金，并寻找有前景的长期投资。此外，跟踪每种资产的进展，以便识别出哪些是最盈利的，以及你未来可能想要退出或避开的资产。


    # 交易与持有 (HODLING)


    大多数人倾向于三种加密货币投资策略之一。这三种策略是日交易、`HODLing` 以及混合。


    ## 交易


    交易通常指日交易或短期加密货币投资。交易者试图在特定时间进入和退出仓以快速获利。在建立特定立场之前，交易者会确定交易时机、买卖的市场价格，以及在寻求短期收益时对高水平市场波动的承受能力。


    尽管交易对某些人来说可能非常获利，但大多数人都会亏钱，或者收益被损失抵消。此外，交易的成功取决于在正确的时间、正确的地点做出正确的决定。它要求交易者在执行交易策略时保持冷静、独立行动，并置于市场混乱之外。简而言之，成功的加密货币交易者通常不成群行动或不随大流。


    ## 持有 (HODLing)


    `HODLing`，或称“拼了死也要持有”，是指加密货币投资者长期投资加密货币代币。长期可能是 1 年、10 年或更久。无论投资期多久，他们都承诺持有加密货币代币，并等待代币成熟或达到预定的卖出时间。`HODLers`
    以观察市场、做出明智的投资决策以及不受大多数日交易者的市场驱动决策的影响为荣。


    加密货币 `HODLing` 是建立和保持跨代财富的三大支柱之一，其他支柱还包括房地产、贵金属、股票、债券和人寿保险。


    相反，`HODLers` 聚集在一起，相互支持，并在度过市场波动时等待他们的代币增值或回到其高市场估值。最传奇的 `HODLers` 是加密货币世界的沃伦·巴菲特。他们从
    `ICO` 之后购买后就一直持有他们的 `Bitcoin` 和 `Ether` 代币。多年持有代币让其中一些人成为了亿万翁、更多百万富翁，并且大量人获得了丰厚的利润。尽管如此，为了达到那个水平，他们多年持有代币让其中一些人成为了亿万翁、更多百万富翁，并且大量人获得了丰厚的利润。


    # 通过持有创造跨代财富


    如果你想通过 `HODL` 创造跨代财富，你必须首先找到值得投资的加密货币代币，这里有一些你应该完成的一些标准事项。做以下事情将增加你找到值得 HODL 的代币的机会。


    ### 阅读白皮书


    加密项目的白皮书应该详细说明区块链开发者为何创建该项目、其目的、随着时间的推移如何发展、哪些人感兴趣，以及开发团队计划如何维护。虽然区块链的推广者使用白皮书进行营销，但它们也应该是详尽的文章。如果白皮书缺乏关于代币的详细信息，说明它写得不好，可能是项目无法持久的信号。最后，如果它与另一个代币的白皮书太相似，应该引起警惕。新的区块链开发者不应该复制白皮书或模仿他人。白皮书缺乏真实性是一个巨大的危险。


    ### 研究创始人和开发团队


    为了推动代币的发展、发布和维护，你需要具有愿景、加密货币和区块链技术背景以及某些行业人脉的创始人和开发团队。他们还应该拥有可以追溯的在线形象。例如，他们应该在
    `LinkedIn` 上拥有简介，成为在线加密论坛的一部分，并参与过至少一个加密项目。创始人和开发团队不需要拥有完美的技术背景；作为一个整体，他们应该互补，并提供开发、发布和维护加密货币代币所需的技能、人才、知识和专业知识。


    ### 评估项目的里程碑


    区块链开发者创建加密项目是为了长期投资、实用性和价值，并且在启动区块链之前应该列出里程碑。开发者应该已经实现了一些初步里程碑；此外，应该有证据表明团队正在积极迈下一个里程碑，并为获得更多里程碑奠定基础。简而言之，开发者应该留出资金用于代币的维护和开发、一个产生更多收入以投资代币的系统，以及积极努力将资金重新投入代币及其为用户提供的服务。缺乏这种对代币的财务投入，它很可能不是一个优秀的长期投资。


    ### 调查代币社区


    能够持久的加密代币需要一个支持它们、传播其信息、为其创造需求并对其持有感兴趣的社区。你可以在 `Twitter`、`Reddit`、`Discord` 和
    `Facebook` 上找到加密社区。如果你想投资某种代币，请关注关于该代币的言和讨论。然而，你不应该假设听到或读到的关于感兴趣代币的一切都是真实的。论坛讨论中可能混杂一些金子般信息，将为你提供关于去哪里研究该代币、项目的预期寿命以及是否有人认为该代币是骗局的线索。

    '
