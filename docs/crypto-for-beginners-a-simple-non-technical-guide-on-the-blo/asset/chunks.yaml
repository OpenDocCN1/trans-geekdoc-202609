- raw: 'Because a great deal of market buying and selling occurs based on emotion,
    the candlesticks, which illustrate the aggressiveness of buying and selling of
    an asset, show the price moves of an investment and the emotional state of the
    people trading the asset.


    You can see a candlestick’s strength in its structure; they have a body and zero
    to a maximum of two shadows. The shadows are lines extending from a candlestick’s
    top and bottom. 


    Let’s review the different candlestick strengths.


    ![](Images/image00160.jpeg)


    *Image “Strength of Candlesticks” from Financial Freedom Trading.⁸*


    1.  The strongest candlestick has a long body with no upper or lower shadow. This
    type of candle signals that the current price move will continue. The price move
    could still change direction, but it is doubtful. (Very Strong Signal)


    2.  Still a strong candlestick, this one has a long body and short upper/lower
    shadow in the opposite direction of the price move. The price will likely continue
    to move in the same direction but has a slight chance of changing. (Strong Signal)


    3.  Candlestick with a mid-sized body with mid-sized upper and lower shadows.
    This is a moderate signal. The current price move is likely to continue. However,
    there is a significant risk that the direction of the price will change. (Moderately
    Strong Signal)


    4.  With a smaller-than-mid-sized body but not a short one and two mid-length
    upper and lower shadows, this moderate signal is the least promising in the average
    strength range. There is a significant chance that the direction of the price
    will change, but it is more likely that it will continue to move in the same direction.
    (Weak Moderate Signal)


    5.  This candlestick has a small body and one long upper/lower shadow extending
    in the direction of the price move. The candlestick’s opening and closing price
    and close signal are weak. There is an excellent chance that the price move will
    change direction. 


    6.  The weakest candlestick signal. It has a thin body with a long upper/lower
    shadow that extends in the direction of the price move. This candlestick signals
    that the investor should prepare for a change in price direction. (Weakest Signal)


    ## CHART PATTERNS


    Candlesticks create chart patterns traders can use to gauge, read, and predict
    the market. As you improve your ability to read and interpret chart patterns,
    you will place strategic trades and reduce your trading risks. Most importantly,
    you’ll have a better chance of making more profitable trades. The trade patterns
    that traders look for are:


    *   Bullish Candlestick Pattern


    This trading signal means that the asset’s price is rising. If the trader can
    enter the market at a good position, at low cost, and sell at major price peaks,
    you will profit from the trade when you maximize the price peaks or just after
    it peaks.


    ![](Images/image00161.jpeg)


    *Image “Bullish Candlesticks” from Financial Freedom Trading*.⁹


    ## BEARISH CANDLESTICK PATTERN


    This pattern signals that the asset’s price is falling and that it is not the
    time to buy it. If possible, sell the investment before the price decreases to
    where you lose money, make no profit, or make very little profit. Conversely,
    when the asset’s price hits its lowest low, that is the perfect time to buy the
    asset and then sell it when the price peaks again.


    ![](Images/image00162.jpeg)


    *Image “Bearish Candlesticks” from Financial Freedom Trading.^(10)*


    ## BULLISH REVERSAL PATTERN


    A bullish reversal pattern signals that the asset’s falling price will change
    direction and rise. It’s a reversal pattern because the bearish trend changes
    into a bullish trend.


    ## BEARISH REVERSAL PATTERN


    A bearish reversal pattern signals the asset’s rising price will change direction
    and fall. It’s a reversal pattern because the bullish trend changes into a bearish
    trend.


    The Head and Shoulders chart pattern shows you bullish and bearish reversal patterns.
    Also, there is an image of a Head and Shoulder chart pattern found in Bitcoin
    market data.


    ![](Images/image00163.jpeg)


    *Image “How to Trade the Head & Shoulders Pattern” from Financial Freedom Trading.^(11)*


    ![](Images/image00165.jpeg)


    *Image from Crypto News, June 10, 2019.^(12)*


    ## CONTINUATION TREND PATTERN


    This signal means that the market trend will continue for an unknown period of
    time (i.e., more than one bar). It allows traders to enter/exit their positions
    and set up lucrative trades.


    In the Head and Shoulders chart pattern above, the price breaks through the support
    line and continues downward (bearish trend).


    ## SUPPORT AND RESISTANCE LEVELS


    Market charts with candlesticks have support and resistance lines. A support line
    is a line you can draw along the bottom of the candlesticks. It represents the
    general direction of the low prices over some time. The resistance line is the
    line you can draw along the tops of the candles. 


    Support symbolizes the strength of an asset pushing up against market pressure
    for its price to drop. The stronger the support, the less likely the price will
    fall below it. 


    The resistance symbolizes the strength of the asset to keep its price from rising.
    The stronger the opposition, the less likely the asset price will rise above it.


    The support and resistance lines form common shapes on the market charts. Initially,
    it may be difficult for you to “see” shapes in the charts, but with time and practice,
    you will be able to identify different chart shapes and what they tell you about
    the market trend of the asset. 


    You can observe significant and minor support and resistance in the image below. 


    ![](Images/image00166.jpeg)


    *Image “Major & Minor Support and Resistance” from Financial Freedom Trading.^(13)*


    ## BREAKOUT PATTERN


    When an asset’s price falls below the support line or rises above the resistance
    line, the price breaks out of the trend. If you can predict a price breakout,
    you can make some very profitable trades. The chart below shows some common breakout
    patterns.


    ![](Images/image00167.jpeg)


    *Image “Breakout Patterns” from Financial Freedom Trading.^(14)*


    ## OTHER TA TOOLS


    There are other TA analysis tool indicators that you can use to read and interpret
    the crypto market. Although we cannot review them here, you can research this
    list of the most popular ones. You should use the ones you feel most comfortable
    with, trust, and feel confident using to guide your crypto trading decisions.


    The most commonly used TA indicators are:


    *   On-Balance Volume (OBV)


    *   Accumulation/Distribution Line (A/D Line)


    *   Average Directional Index (ADX)


    *   Aroon Indicator


    *   Moving Average Convergence Divergence (MACD)


    *   Relative Strength Index (RSI)


    *   Stochastic Indicator


    ## PAPER TRADING


    Are you ready to start trading crypto? 


    Would you feel more comfortable if you had a demo account from which you could
    practice trading crypto tokens using fake money?


    Well, you can practice your trading skills using paper trading. Paper trading
    is a demo account with fake money you use to make trades. After making the trades,
    you can observe the results of your market decisions and develop strategies to
    optimize your market performance.


    Many companies have free demo accounts, so you should not pay for one. If possible,
    get a demo account with a company that you are interested in working with in the
    future. Remember, many firms allow trading more than cryptocurrency on their platforms. 


    Some companies that you may want to consider if you decide to open a paper trading
    are: 


    *   Webull


    *   eToro


    *   AvaTrade


    *   Interactive Brokers 


    *   TradeStation


    *   Thinkorswim


    *   Capital.com


    *   Tradier


    *   FOREX.com


    ## FINDING YOUR NEEDLE IN THE HAYSTACK


    You are now ready to begin developing your crypto token trading skills. There
    are thousands of crypto tokens on the market, so you have many options. If you
    prefer to work with crypto tokens with a track record and lots of market data,
    consider the ones with the highest market caps.'
