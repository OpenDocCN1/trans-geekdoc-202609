  trans: '


    请注意，如果你发现社区正专注于炒作代币并推高其需求，你应该保持警惕。诈骗者炒作代币通常通过“拉高后出售”（pump-and-dump）计划或其他诈骗手段，其目的是推高代币价值，以便使持有大量代币的小少数投资者能够以高于市场合理价格将其卖出。这些骗局只奖励那些在市场崩盘前套现的人。在代币价值大幅增加后买入，或在市场价格下跌前未卖出的投资者，往往会亏损或获利极微。


    ### 追踪资金流向


    在投资代币之前，先研究谁持有大部分代币。如果创始人和开发团队计划项目增值、进行长期投资并拥有庞大的社区，那么他们需要公众持有大部分（大于 50%）的代币。


    远离那些创始人、开发团队和大投资者持有大部分代币的代币和项目。如果公众仅持有 30%的代币，项目利益相关可能会在价值上升到一定水平时抛售代币。此外，如果创始人和开发团队要求投资者用高价值代币兑换他们新推出的代币，这可能是一个骗局。在足够的投资者用
    `Bitcoin`、`Ether`、`XRP` 等兑换新代币后，项目运营者可以关闭项目并带着高价值代币消失。遗憾的是，在这种情况下，投资者将持有毫无价值的代币，且无法获得任何正义。


    ### 代币的实用性


    具有长期市场未来的代币必须是有用的。代币应该满足加密市场某些未满足的需求。如果某个代币主导了其设计的细分市场，就会产生需求。此外，该代币及其区块链的独特之处将使其能够建立并保持强大的市场地位。


    例如，`Ether` 的创建是为了用于交易、价值存储和作为奖励。此外，随着 `Ethereum` 区块链演托管 `NFTs`、智能合约和 `DeFi` 交易，`Ether`
    的价值和需求持续增长。而且，`Ether` 的开发团队和创始人不断推动 `Ether` 在后开发的区块链和加密代币面前保持竞争力。


    最后，后来区块链开发者开发了与 `Ethereum` 兼容的代币和区块链，以便其用户能够从新的创新区块链中受益，而不会失去访问 `Ethereum` 区块链的收益。因此，很明显，将
    `Ether` 作为长期投资是有意义的。


    ## 如何长期持有（HODL）


    如果你计划通过长期持有（HODLing）成为百万翁或创造跨代财富，你必须以正确的心态对待。在这一节中，我列出了作为加密货币投资者建立财富思维必须做的事情。


    ## 长期考虑


    记住，这是一种长期投资策略，而不是一种暴富计划。这里的真正秘密在于市场时间。你对技术的投资将服务于大众，并每年创造复利价值。因此，你现在的投入在未来可能会带给你
    10 倍、100 倍甚至 1000 倍的回。


    ## 你必须播下财富的种子


    你对加密货币的初始投资就像种下一种子，让它生根，并随着时间的推移收获增长回报。


    ## 值得持有的加密货币


    以下是几种值得持有的加密货币，它们符合在我们基本分析中得分极高的标准，并有望为长期投资产生巨大的倍数效应。请参考书开头的链接获取我们的免费礼物。该报告对这些非凡的加密货币及其革命性区块链的独特品质进行了深度分析。


    *   `Bitcoin Cash (BCH)`

    *   `Cardano (ADA)`

    *   `Theta (THETA)` & `Theta Fuel (TFUEL)`


    本书中的信息仅代表观点，仅供参考。本书中的信息仅代表观点，仅供参考。


    在任何市场，尤其是数字资产市场，理解你投资的风险和动态是至关重要的。如果你不了解这些信息或不确定如何保护你的资产，请寻求专业的投资建议。为了确保你的长期成功和生存，请不要过度暴露风险，并记住注意你的风险。


    ## 通过定额成本法进行长期持有


    由于长期持有（HODLing）是一场持久战，而不是为了一夜暴富，因此你的策略是对你选择的区块链进行定额成本投入。什么是定额成本法？`Forbes` 杂志将其定义为“一种在购买股票、交易交易基金（ETF）或共同基金时管理价格风险的策略。与其一次性以单一价格投资某特定证券，不如通过定额成本法将你想要投资的金额分成若干份，并在定期内分次买入小额。”


    这种策略是以固定的间隔小额买入你值得持有的加密货币，而不是试图择机入市。当市场下跌时，多买一点；当出现大幅下跌时，买得更多。但永远记住，这些是你可以承受损失的钱，或者是你出于任何原因不需要钱。


    ## 准备好应对高低


    加密货币市场波动剧烈。如果你想获得长期持有的回报，你必须在市场波动期间坚持航向，并在目睹代币市值急剧上升或下跌时无所作为。但对投资策略的坚定是基于稳健的研究，正如前面所述。由于加密货币市场与基本世界的波动并不挂钩，很难择机和预测。简而言之，为你购买的每种代币制定一个投资策略，除非市场条件或其他因素值得你改变计划，否则请坚持。记住，你的成功取决于你何时买入和卖出的决定。因此，你的成功最终是你自己的责任。


    ## 现金


    将 20% 的投资资金保留为法币（例如 `USD`、`EUR`、`GBP`），以便在市场下跌或出现其他绝佳机会时购买代币。


    ## 获利卖目标


    设定你的卖出目标并坚持。记住，你的卖出目标基于你试图实现的财务目标（例如还债、交学费）。不要把目标定得太离谱（例如 10 亿美元、买一支 NBA 球队）。


