  trans: '


    想要访问受害者加密货币代或加密钱包的黑客可能会通过破解智能手机来实现。黑客只需要对你的 SIM 卡进行一次破解。在在那一次性攻击中，他们可以向你的手机下载病毒，甚至翻阅你的文件。此外，他们可以在你的智能手机上放置代码，让黑客查看你手机上的活动、从你的手机将信息发送给他们，并允许他们更改你手机上的信息。他们还可以加密你的文件，然后向你索要赎金。


    黑客喜欢攻击 SIM 卡，因为大多数智能手机用户从未意识到他们的手机被黑客破解了。诈骗子之所以能从 SIM 攻击中逃脱法，是因为通常人们不会定期检查手机是否有病毒、恶意软件或奇怪的软件。此外，他们在检查加密钱包余额并发现金额不正确之前，通常并意识不到问题的存在。


    ### 它是如何实现的


    黑客可以通过联系手机运营商并冒充你的身份来访问你的智能手机。他们会向你的手机运营商提供你的出生日期、社会安全号码、母姓等信息，以便他们获取你的账户信息并进行更改。他们获取你信息的另一种方法是贿赂手机运营商的员工来提供线索。不幸的是，他们从大多数手机运营商员工那里花费不到
    200 美元就能获得你的数据。


    ### 识别 SIM 攻击


    为了避免 SIM 卡被破解导致加密资产被盗，请采取以下措施：


    *   永远不要将手机连接到你的加密账户。

    *   仅使用座机或免费的 Google Voice 号访问你的加密账户。

    *   使用发送到手机的代码确认你的加密账户。

    *   在你的加密账户上使用双重身份验证系统。

    *   如果你使用手机，请为你的加密账户设置唯一的 PIN 和安全问题。

    *   在你的加密账户上使用强密码或获取密码管理器。

    *   使用虚拟专用网络（VPN）来隐藏你的互联网连接。


    VPN 会加密你的 IP 地址。当你的 IP 地址被隐藏时，政府机构、公司、广告商和潜在的黑客将难以在网上定位你的电子设备（例如笔记本电脑、智能手机、台式电脑）。由于他们无法快速识别或跟踪你的
    IP 地址，他们就不可能窃取你的个人信息、干扰你的加密交易或在你的电子设备上放置 Cookie 和恶意软件。VPN 在公共网络和私有网络上均可工作。它有一系列价格和计划。有关
    VPN 的更多信息，请查看 ExpressVPN、Mullvad、Nord VPN、SurfShark、hide.me 和 Proton VPN。


    ## 非对称赠送活动


    诈骗子喜欢利用社交媒体活动设置非对称赠送活动。在这些骗局中，诈骗子承诺向先给他们发送加密代币的人赠送免费加密代币。然后，诈骗子告诉潜在受害者，在交出加密代币后将获得更多的加密代币作为回报。不幸的是，现实是，在收到你的加密代币后，你再也不会收到他们的任何消息了。


    ### 避免非对称赠送


    永远不要将你的加密代币发送给某人的加密钱包，并期望他们会还给你并通过更多的加密代币作为奖励。为什么会有人这样做呢？他们从中能得到什么？世界上没有免费的午餐。如果有人给你提供免费的午餐，请寻找猫腻。


    ## 避免通过黑客或诈骗被盗加密货币的通用规则


    *   不要告诉所有人你有加密货币，特别是在社交媒体上。

    *   避免与你不认识的人在聊天中进行私信。通常情况下，攻击者会先联系你。

    *   不要下载或点击你不确定安全的软件或链接。

    *   永远不要给任何人你的秘密助记词（seed phrase）、私钥或加密钱包密码。

    *   为不同用途准备多个电子邮件账户（例如：一个用于访问交易所，一个用于通信等）。攻击者可能会尝试使用你的电子邮件并查看是否有结果，来访问你在不同加密交易所的加密货币账户。


    ## 保护你的托管加密账户、私钥和秘密助记词


    对于中心化交易所（CEX）上的托管钱包和加密钱包，你应该使用三部分账户账户授权系统。不幸的是，最常见的双重身份验证（2FA）系统是不安全的，因为它容易受到攻击。黑客仍然可以破解这三部分系统，但需要更长的时间且更具挑战性。


    让我们检查 2FA 系统，然后看看支持它的第三部分。


    ### 2FA


    在 2FA 系统中，如果不输入至少两项安全数据，你就无法访问加密账户。首先，加密账户持有者将输入用户名和密码，然后被要求输入发送到其电子邮件账户或智能手机的代码。


    ### 破解电子邮件账户


    电子邮件账户长期以来一直容易受到攻击。我们经常读到数据泄露或黑客入侵电子邮件账户的新闻。如果你只使用 2FA，黑客可以进入你的电子邮件，点击“忘记密码”链接（谁没有忘记过一次密码呢？），并在你的账户内部重置密码。重置密码后，黑客将获得你加密账户的完全访问权限。


    ### SIM 卡劫持


    短信 信息有问题，因为 SIM 卡劫持已变得常见且简单。在 SIM 卡劫持中，黑客联系你的手机运营商，声称由于丢失 SIM 卡或智能手机而陷入困境。黑客会要求手机公司将你的号码切换到新的
    SIM 卡或智能手机。在运营商将你的号码更改到黑客的 SIM 或智能手机后，黑客可以快速完成访问加密账户所需的 2FA 验证过程。


    ### 身份验证器应用


    如果你使用 Google Authenticator、Microsoft Authenticator 或 Authy 等身份验证器应用，黑客必须额外努力才能进入你的账户。这些应用并不困难也不费时间，但你必须在每个交易所账户上设置它们。关于身份验证器应用设置最重要的点是，你必须存储你的账户备份密码。如果你丢失了手机或电子邮件的访问权限，可以使用账户备份密码重新生成你的
    Authy 账户。为了防止身份验证器应用备份密码和加密账户秘密助记词出现问题，请采取以下措施：


    *   将屏幕上显示的备份密码抄在纸上。确保它易于阅读，并使用不易褪色的墨水或不会随时间快速降化的纸张（例如，墨水遇水后无法识别）。

    *   将备份密码复制两次，并将每个副本放在不同的安全位置（例如，保险箱内）。

    *   将密码刻在防酸、防火、防震的不锈钢上。

    *   将备份密码存储在受密码保护的 USB 闪盘中。

    *   设置一个你仅用于加密相关活动的电子邮件地址。这样，如果黑客获取了你的主电子邮件账户的访问权限，他们无法获取你的加密账户。

    *   永远不要给任何人你的秘密助记词或备份密码。

    *   永远不要将秘密助记词或备份密码存储在计算机、智能手机、平板电脑等设备上。


