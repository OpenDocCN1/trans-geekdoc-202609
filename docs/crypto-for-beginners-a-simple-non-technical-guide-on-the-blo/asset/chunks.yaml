- raw: 'The US government has begun to require crypto exchanges to keep records on
    who sends money to whom and how much money you sent and redeemed in fiat currency.
    Its rationale is to prevent cryptocurrency investors from engaging in illegal
    transactions and funding terrorism. To do this, they have begun requiring the
    crypto exchanges to report on redeemed cryptocurrency and maintain records about
    the transactions cashed out on the crypto exchange.


    Because you are a beginner crypto investor, we will focus on the crypto taxes
    you will most likely have to pay: capital gains and ordinary income tax. Note
    that cryptocurrency is treated like property by the IRS.


    A capital gains tax even occurs when you sell a security at a profit. If you have
    held the security for less than a year, it’s a short-term capital gain treated
    like income. However, owning the cryptocurrency for more than a year before selling
    it is a long-term capital gain. Therefore, long-term capital gains are taxed at
    a lower rate than income.


    The long-term capital gains tax rate is based on your income tax bracket and can
    be either at 0%, 15%, or 20% at the federal level. In addition, higher-income
    taxpayers may be subject to the 3.8% Net Investment Income Tax on their capital
    gains or other payment.


    ## TAXABLE CRYPTO TRANSACTIONS


    *Trading Cryptocurrency*


    When you buy cryptocurrency using fiat currency, it is not a taxable event. However,
    if you trade one cryptocurrency for another, such as trading one crypto token
    for a different kind of crypto token (e.g., buying Ether with Bitcoin), this is
    considered a taxable event. In addition, if the value of your assets has increased
    due to the crypto trade, the gains may be taxable.


    *Redeeming Cryptocurrency*


    A taxable event is triggered if you redeem your cryptocurrency for fiat currency,
    precious metals or gems, real estate, or other assets. If you profit when your
    crypto is redeemed (sold for more than you paid), you must pay taxes on your capital
    gains. However, you can use the losses to reduce your capital gains tax or income
    tax if you lose money selling your cryptocurrency (sell it for less than you paid
    for it).


    *Taxable Ordinary Income*


    Your gains are taxed as ordinary income if you are paid or rewarded in cryptocurrency
    for services performed or goods provided. For example, if you are paid in cryptocurrency
    by your job, the funds are taxed as ordinary income. Moreover, any income you
    earn from staking and mining cryptocurrency is considered ordinary income. In
    addition, any cryptocurrency awarded to you as a reward for your staking and mining
    activities is taxed as ordinary income.


    *Spending Cryptocurrency on Goods and Services*


    Cryptocurrency spent to pay for goods and services may be taxed as ordinary income
    or capital gains, depending on when you bought and spent the crypto tokens. Such
    payments may include money spent creating smart contracts, payment of blockchain
    transaction fees, payment of crypto-related services, and anything else that can
    be justified as a reasonable crypto-related expense.


    *Non-Taxable Crypto Events*


    Some crypto transactions do not trigger the payment of crypto taxes. When engaging
    in these transactions, you must keep excellent records so that your tax lawyer/accountant
    can adequately account for each crypto event, and you can provide written evidence
    of it if the IRS audits you.


    *   Donations


    Suppose you donate your cryptocurrency and do not receive any services, goods,
    or other things of value in exchange. In that case, you can claim your crypto
    donation as a charitable tax deduction, provided your donation is to a 501(c)(3)
    charity.


    *   Gifts


    You can gift cryptocurrency to family members and others and not pay taxes on
    the gift. However, the amount you can gift to a recipient has a lifetime limit.


    *   Buying and Holding Crypto


    For those who choose to buy and hold (AKA HODL) cryptocurrency, the IRS does not
    require you to pay any taxes on your purchased cryptocurrency until you sell it
    or trade it. Instead, your taxes will be based on how long you held the cryptocurrency,
    the difference between your capital gains and losses that year, tax deductions,
    and the ordinary tax income rate.


    *   Transferring Crypto between Crypto Wallets/Accounts


    Transferring your cryptocurrency between different crypto wallets/accounts is
    not a taxable event. So, moving your crypto tokens from a centralized exchange
    to your crypto wallet does not trigger a tax event, nor does moving your cryptocurrency
    from crypto wallet to crypto wallet trigger a tax event.


    ## POTENTIALLY TAXABLE CRYPTO TRANSACTIONS


    *   Salaries paid in cryptocurrency


    *   Payment for goods and services in cryptocurrency (e.g., transfer fees)


    *   Redeeming crypto tokens for fiat currency


    *   Using crypto tokens to pay for goods and services


    *   Interest earned from P2P crypto loans


    *   Crypto tokens earned from mining, staking, and liquidity pools


    *   Referral rewards (e.g., Binance referral)


    *   Crypto tokens received from Learn to Earn campaigns (e.g., Coinbase Earn,
    CoinMarketCap Earn)


    *   Crypto earned from watch-to-earn platforms (e.g., Odyssey)


    *   Crypto earned from browsing-to-earn platforms (e.g., Permission.io browser
    extension, Brave browser)


    *   Crypto tokens earned from play-to-earn (P2E) games


    *   Crypto earned from shop-to-earn platforms (e.g., Lolli)


    *   Crypto earned from shared public address to earn platforms (e.g., Moon Faucet)


    *   Buying crypto tokens with stablecoins


    *   Transfer fees charged for moving crypto between crypto wallets


    *   Crypto tokens acquired via airdrops and blockchain hard forks


    *   Tokens and fiat currency received from selling, trading, and spending crypto
    tokens acquired via airdrops and blockchain hard forks


    *   Transactions in which you are gifted tokens you redeem, trade, and use to
    pay for goods and services


    ## TAX-FREE CRYPTO TRANSACTIONS


    Crypto holders are not required to pay taxes on the following transactions:


    *   Buying crypto tokens using fiat currency (e.g., USD, GBP, JPY, EUR)


    *   HODLing crypto


    *   Transferring crypto between crypto wallets (however, wallet transfer fees
    may be taxable)


    *   Donating crypto to 501(c)(3)-approved charities


    *   Gifting crypto tokens to others under the following conditions:


    *   May gift up to $15,000 in 2021 and $16,000 in 2022


    *   Must be under the lifetime gift limit per recipient, $11.7 million in 2021
    and $12.16 million in 2022


    *   Creating NFTs


    Note: Additionally, no taxes are assessed for blockchain soft forks, because platform
    users don’t receive new tokens when soft forks are launched.


    ## PROHIBITED CAPITAL GAINS LOSSES


    Lost or stolen crypto cannot be claimed as a crypto capital gains losses.


    ## FULL INVESTMENT WRITE-OFF


    It may be possible to completely write off crypto tokens that have lost all their
    value (e.g., Luna). If your crypto tokens are “dead,” not likely to be revived
    (i.e., have value), and you burn them in a dead wallet, you can write off the
    entire loss without being limited by the annual $3,000 deduction cap. Note that
    if the “dead token” revives itself, the whole investment write-off will not be
    allowed by the IRS.


    ## TAX DEDUCTIONS ON CRYPTO SOLD AT A LOSS


    If you sell your crypto tokens at a loss and have held them for less than a year,
    you can deduct the loss from your short-term gains first and then from your long-term
    profits. Likewise, any long-term crypto capital losses must first be used against
    your long-term crypto capital gain and then against your short-term capital gains.


    ## UNSETTLED CRYPTO TAX ISSUES


    *   Tax treatment of crypto earned from Proof of Stake and DeFi protocols.


    *   The IRS has not made it clear whether you can add fees paid for crypto transfers
    from wallet to wallet to the cost basis of the crypto token.


    ## WASH-SALE RULE & ITS RISKS'
