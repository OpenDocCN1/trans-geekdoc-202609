- raw: 'A hidden wallet scam works because people often copy their crypto wallet addresses
    and seldom check them (to ensure they are correct). So, when purchasing crypto
    tokens, they deposit them into the hidden wallet because they do not realize that
    the copied address is no longer the address of their crypto wallet. They only
    discover a problem when they check their crypto wallet’s balance and recognize
    that the balance is incorrect.


    Note that the victim cannot access the hidden wallet (e.g., withdraw the deposited
    tokens, spend the tokens in transactions) because only the hacker can access the
    contents of the hidden wallet.


    ## PUMP-AND-DUMP SCHEMES


    A group of people decides to make some quick profits from crypto. First, they
    all buy substantial amounts of a specific crypto token at a low market price.
    Then, after they have purchased their crypto tokens, they go to their social media
    accounts (e.g., Twitter, Discord, Reddit) and promote their recently purchased
    low-value crypto tokens as the next significant investment.


    Scammers increase demand for the crypto token through false news that artificially
    increases market price. When the market price continues to rise, even more people
    will begin to pay attention to the crypto token and buy it. Over time, the token’s
    price will continue to grow as it gets hotter and hotter. At some point, the pump-and-dump
    scheme organizers will slowly start selling off their tokens for a nice profit.
    Later, the scheme organizers will dump all of their holdings on the market. After
    they leave their coins, the market price of the tokens will sharply decline. As
    the price drops, the new investors will begin selling their cryptos because they
    fear losing their initial investment. Sadly, as more investors sell their holdings,
    the token price will drop even faster. As a result, the token price will likely
    return to its initial low market value or possibly drop even lower. The investors
    who bought the crypto token as its price rose will probably lose their initial
    investment.


    *Spotting a Pump-and-Dump Scheme*


    Before you start buying crypto tokens based on some tips you get from your social
    media forum or “friend,” carefully research the crypto token. Treat the advice
    like it was information given to you by a random, suspicious-looking stranger
    at night while walking past him. In short, don’t assume that everything you hear
    or read on a social media forum is true or backed by research. They are also great
    places to find dupes (AKA victims) for pump-and-dump schemes.


    Ask yourself the following questions and get satisfying answers to them before
    you commit your resources to this potentially lucrative investment:


    *   Why is the crypto token in demand?


    *   Why is the crypto token’s market price rising?


    *   Who is pushing the crypto token?


    *   Can you verify any of the information you received about the crypto token?


    *   After researching the crypto token, does it seem like a sound investment for
    you?


    ## SHILLING SCAM


    Crypto token holders spread false information about a token they are holding to
    increase the demand for it. They aim to increase the token’s price to a level
    where they can sell their coins for a nice profit. The people duped into buying
    the cryptocurrency create the demand for it and are why its price increases over
    time. At some point, the shills will sell off their holdings (i.e., dump them
    on the market) and cause the token’s market price to drop like a rock. The new
    investors will not realize the profits they anticipated or lose their initial
    investment. Because they were not part of the scam, they will not be beneficiaries
    of the scam’s success.


    *Spotting a Shilling Scam*


    To prevent yourself from becoming a victim of a shilling scam, ask yourself several
    questions and get satisfying answers before you buy into a hot token that other
    people are pushing. The questions are:


    *   Who is providing the information about the cryptocurrency?


    *   Can you verify any of the information you have received about the token?


    *   Why would people want to own this crypto?


    *   Does the token’s market history suggest that this current increase in its
    value is organic?


    Because it can be challenging to answer these questions and get satisfying answers,
    just because you cannot answer them doesn’t mean that the token is being shilled
    (e.g., Dogecoin). In such instances, you may have to take a leap of faith and
    hope it works out for you. But as always, never commit more capital to a questionable
    investment than you can comfortably avoid losing without regret.


    ## PHISHING SCAMS


    These scammers use emails and text messages to trick you into giving them access
    to your crypto assets. In the emails or text messages, they will try to get your
    personal information, crypto tokens’ private keys, crypto wallet passwords, and
    other information that scammers can use to their advantage and detriment.


    People generally send these by using official-looking emails or text messages.
    But unfortunately, they will also try to pressure you into immediately acting
    on the information by telling you that it is a limited-time offer or that it is
    limited to a small number of people on a first-come, first-served basis.


    *Spotting Phishing Scams*


    Before responding to a potential communication from a phishing scam, do the following:


    *   Research the company that is offering the deal, gifts, etc.


    *   Research the history of the offer and any offers similar to it.


    *   Know what kinds of information the communication is for and whether it could
    be used to steal your crypto assets or identity.


    *   Determine whether they are asking for personal information you would not give
    a nameless, faceless stranger.


    Remember that nothing in life is free—not even Facebook!


    ## CELEBRITY/INFLUENCER IMPERSONATORS


    Be wary of any emails that you receive from supposed celebrities or influencers.
    Unless you are in contact with these people and their social circles, it is doubtful
    that they will send you a personal email to convince you to participate in a crypto
    giveaway, contest, or hot crypto tip. You should have realized by now that the
    email message you received most likely came from someone impersonating a celebrity
    or influencer. These scammers expect you to be so impressed and excited by receiving
    an email from a famous or notable person that you would overlook the questionable
    aspects of the email, trust them, and give them what they want from you. For example,
    if you receive an email message from someone you admire but that you have never
    met, what are the chances that it was the person you admire who sent it to you?


    Any unsolicited email or text message that gives you investment advice is sketchy.
    Treat it like advice from a random stranger with unknown intentions. When responding
    to such communications, do not give out personal information that can be used
    against you to steal your identity or assets (e.g., mother’s maiden name, social
    security number).


    *Spotting Celebrity/Influencer Impersonator Communications*


    Before you respond to an unsolicited communication that invites you to participate
    in something you have never heard of and know nothing about, ask yourself the
    following questions:


    *   What is the goal of the communication?


    *   What does the sender of the communication want from you?


    *   What does the person who sent you the communication want you to do?


    *   What is your relationship with the person who sent the communication?


    *   How does the person know you?


    *   How trustworthy is the person who sent you the communication?


    *   How would you respond to the communication if it was sent to you by a random
    stranger you had never met, talked to, or heard of?


    ## SIM HACK


    Many crypto investors use their smartphones to perform crypto trades and transactions.
    They also check their crypto wallet balances, purchase crypto tokens, and perform
    other crypto-related tasks using smartphones.'
