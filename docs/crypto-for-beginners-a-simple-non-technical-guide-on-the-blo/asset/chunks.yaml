- raw: 'Take the time to research and find the best crypto investments for you. Finding
    an investment that works for you means that if you have a low tolerance for risk
    and limited funds to invest in the crypto market, you don’t want to invest in
    derivatives, contracts for differences (CFDs), or high-risk crypto tokens (e.g.,
    initial coin offerings \[ICOs\]). However, if you have money to burn and can tolerate
    high-risk investments without becoming depressed, then high-risk, highly speculative
    crypto investments might be a good option. Likewise, if you are entering the market
    and want to invest in more conservative assets with lower risk and market history,
    put your money into legacy tokens (e.g., Bitcoin, Ether).


    *Investment Goals*


    The goal of your investment comes first, then figuring out what to invest in and
    when to sell becomes easy. Each time you make an investment, write down the goal
    of that investment. For instance, if your goal is to invest $1,000 and pay off
    $4,500 in debt, then make that your focus. However, if your goal is to generate
    multi-generational wealth, you must find suitable projects, strategically invest
    your capital, and look for promising long-term investments. Also, track the progress
    of each asset so that you can identify the ones that are the most profitable and
    those that you may want to exit or avoid in the future.


    ## TRADING VS. HODLING


    Most people favor one of three different crypto investing strategies. The three
    strategies are day trading, HODLing, and a mixture.


    *Trading*


    Trading often refers to day trading or short-term crypto investing. Traders try
    to enter and exit positions at specific times to earn profits quickly. Before
    taking a particular position, the trader determines the timing of trades, the
    market prices of the buy/sell, and the tolerance of high levels of market volatility
    while seeking short-term gain.


    Although trading can be highly lucrative for some, most people lose money or have
    their gains wiped out by their losses. Plus, trading success depends on making
    the right decision at the right place at the right time. It also requires traders
    to remain dispassionate, act independently, and stay above the market fray as
    they execute their trading strategies. In short, successful crypto traders usually
    don’t travel in packs or follow the herd.


    *HODLing*


    HODLing, or Hold On for Dear Life-ing, is when crypto investors invest in crypto
    tokens for the long term. The long term may be 1 year, 10 years, or more. Regardless
    of the investment period, they commit to holding the crypto tokens and wait for
    the tokens to mature or the predetermined time to sell them. HODLers pride themselves
    on watching the market, making sound investment decisions, and not being affected
    by the market-driven decisions of most day traders.


    HODLing cryptocurrency is one of the great pillars of building and retaining generational
    wealth, along with the other pillars, including real estate, precious metals,
    stocks, bonds, and life insurance.


    Instead, the HODLers band together, support one another, and ride out the market
    volatility as they wait for their tokens to increase in value or return to their
    high market valuation. The most legendary HODLers are the Warren Buffetts of the
    crypto world. They have been holding their Bitcoin and Ether tokens since they
    bought them after the ICO. Keeping their tokens for years has made some of them
    billionaires, more millionaires, and a large number a tidy profit. Still, to reach
    that level, they had to hold the tokens and believe their value would continue
    to rise over time. Unfortunately, most people who initially invested in Bitcoin
    and Ethereum did not hold this belief and instead cashed out as soon as they had
    the opportunity to get a decent profit from selling them.


    ## HODL YOUR WAY TO GENERATIONAL WEALTH


    If you want to HODL your way to accumulating generational wealth, you must first
    find a crypto token worth investing in for years. Because thousands of crypto
    tokens are on the market, hundreds of new coins launch yearly, and the majority
    become dead coins less than two years after being launched, this is no easy feat.
    Although there is a fair bit of luck involved in finding the tokens that will
    mature in value over time and turn you into a millionaire, there are some standard
    things that you should do to increase your chances of identifying them.


    Doing the following will increase your chances of finding HODL-worthy crypto tokens.


    *   Read the White Paper


    The white paper of a crypto token project should tell you in detail why blockchain
    developers created the project, its purpose, how it will develop over time, the
    people who will be interested in it, and how the development team plans to maintain
    and expand the project. Although promoters of the blockchain use white papers
    to be a part of the marketing effort, they are also supposed to be detailed writings
    about the usefulness of the token and its blockchain. If the white paper lacks
    detailed information about the token, it is a poorly written document and may
    be a sign that the project is poorly put together and not likely to last the test
    of time. Lastly, if it is too similar to another token’s white paper, that should
    raise some alarms. New blockchain developers should not copy white papers or imitate
    one another. Lack of authenticity in the white paper is a major red flag.


    *   Research the Founders and Development Team


    To drive a token’s development, launch, release, and maintenance, you need founders
    and a development team with a vision, a background in cryptocurrency and blockchain
    technology, and some connections to the industry. They should also have an active
    online presence that you can trace. For example, they should have profiles on
    LinkedIn, be part of online crypto forums, and have been part of at least one
    crypto project. The founders and development team don’t have to have a flawless
    technology background; as a group, they should complement one another and provide
    the skills, talents, knowledge, and expertise necessary to develop, launch, and
    maintain a crypto token.


    *   Assess the Project’s Milestones


    Blockchain developers create crypto projects for long-term investment, usefulness,
    and value and should have milestones laid out before they launch a blockchain.
    Blockchain developers should have achieved some initial landmarks; moreover, there
    should be evidence that the team is actively progressing towards achieving the
    next milestone and setting the stage for attaining additional milestones. In short,
    the developers should set aside capital to fund the maintenance and development
    of the token, a system to generate more revenue to invest in the token, and an
    active effort to reinvest funds into the token and the services it provides its
    users. Absent this kind of financial investment in the token, it will most likely
    not be an excellent long-term investment.


    *   Investigate the Token’s Community


    Crypto tokens that will last need a community that will support them, spread information
    about them, create demand for them, and have an interest in holding them. You
    can find crypto communities on Twitter, Reddit, Discord, and Facebook. If you
    want to invest in a token, pay attention to the chatter and discussion about the
    token. However, you should not assume that everything you hear or read about the
    token of interest is authentic. There may be some golden nuggets of information
    mixed in with the forum discussions that will give you some leads on where to
    research the token, the project’s intended longevity, and whether or not anyone
    thinks the token is a scam.'
