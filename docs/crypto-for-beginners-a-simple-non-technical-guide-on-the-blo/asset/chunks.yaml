- raw: 'In the late 1800s, governments decided to back their currency with gold. Gold-backed
    paper money was much easier to exchange with other governments, and countries
    more widely accepted gold-backed paper money than paper money that countries did
    not back with gold. Why? Because, at that time, if you had gold-backed paper money,
    you could take it to a bank or financial institution and exchange the paper money
    for its gold equivalent. Gold-backed paper money made people feel more secure
    about the value of their goods and services, and the value of the paper money
    and made it much easier to make international trades.


    *Fiat Currency – Paper Money without the Gold Standard*


    Around the 1930s, some countries decided to leave the gold standard. These countries
    wanted to increase the amount of money in circulation but not have to increase
    their gold reserves. In essence, countries were printing unbacked money. By the
    1970s, all nations had abandoned the gold standard. However, governments and banks
    do keep fractional gold reserves. What are fractional reserves? Fractional reserves
    are when only a fraction of the currency’s value in circulation is backed by gold.
    To be blunt, it does not support all the money in circulation.


    This new paper money was unbacked and referred to as fiat currency. The issue
    with fiat currency is that governments can issue new paper money whenever they
    want, but its value is unsecured. So, as governments print more paper money, the
    value of their cash declines. For example, suppose there is a rapid decline in
    the value of the capital. In that case, the society will experience inflation,
    and the people using that money will quickly realize that they have less buying
    power than before inflation.


    *Credit Cards*


    Financial institutions introduced credit cards in the first half of the 20th century.
    Initially, credit cards were for the rich, famous, well-connected, and elite.
    However, they were made available to other segments of society over time. Credit
    cards attract people to pay for goods and services using the credit extended to
    them by a credit card company. The credit card company will pay their bills, understanding
    that the credit card owners will pay the money back to the credit card company.


    Over the years, credit cards have become a very lucrative business for many credit
    companies. In the late 20th century, many credit card companies began to make
    their cards available to lower-income people who could not afford low-interest
    credit cards. Instead, they were offered high-interest credit cards with low balances.
    These low-income households often use credit cards to pay for basic living expenses,
    entertainment, and emergencies. These households use credit cards to cover basic
    living expenses. Unfortunately, these households’ inability to make enough money
    to pay their living expenses has led many into credit card debt. Unfortunately,
    the many people who take out these high-interest and prepaid credit cards to pay
    their living, school, emergency, and holiday expenses have no real plan to pay
    the money back.


    *Digital Money (Digitized Currency, Cryptocurrency)*


    The latest evolution of money is digital money. Cryptocurrency is the first form
    of digital money created as a medium for payment. The original cryptocurrencies,
    Bitcoin (BTC) and Ethereum (ETH) are unbacked by assets but gain value based on
    their utility. However, some cryptocurrencies are backed by fiat currency, commercial
    paper, commodities, precious metals, real estate, etc.


    Cryptocurrency should not be confused with digitized fiat currency. At this time,
    the US, China, and other nations are developing their digitized currency. The
    digitized currency is essentially electronic fiat currency. It has the same value
    and is as trustworthy as paper money. A government, central bank, or some other
    kind of institution controls this digitized fiat currency. However, it is no more
    reliable or secure than holding fiat money. Remember, whatever happens to fiat
    money also happens to digitized fiat money.


    ## WHAT IS BITCOIN?


    Bitcoin was the first cryptocurrency ever created and released to the public.
    It was designed and distributed to the public by the pseudonymous Satoshi Nakamoto
    in 2009. The demand for Bitcoin establishes the value for Bitcoin. Therefore,
    the higher the need for it, the higher its price.


    Ethereum, launched in 2015, was the second cryptocurrency created and released
    to the public. It was co-created by Vitalik Buterin, Gavin Wood, Charles Hoskinson,
    Anthony Di Lorio, and Joseph Lubin. The Ethereum blockchain is far more versatile
    than Bitcoin’s blockchain. It has introduced the world to smart contracts, decentralized
    apps, blockchain games, play-to-earn games, a more dynamic metaverse, and decentralized
    finance.


    Moreover, Ethereum can work with many other blockchains. In addition, Ethereum’s
    native token, ETH, unlike BTC, is more than just a way to store value. You can
    use ETH as a payment, investment, source of passive income (e.g., mining, staking),
    and medium of exchange between different crypto tokens.


    ## ARE BITCOIN AND ETHEREUM REAL MONEY?


    The answer to this question is that it depends. It depends on how you define real
    money. If real money is a medium of payment that you can use to pay for things
    you want or to achieve your financial goals, then yes, it is real money. However,
    if real money is a currency you can touch and feel and is accepted as a form of
    payment by all businesses, banks, financial institutions, and governments, then,
    no, it is not real money. *Alternative* money better describes Bitcoin and Ethereum.


    **Frequently Asked Questions About Cryptocurrency**


    ## WHAT IS CRYPTOCURRENCY?


    Cryptocurrency is a digital currency secured by cryptography, making it difficult,
    if not impossible, to counterfeit. A cryptocurrency is a form of cryptography
    because no information connects the transactions to the transacting parties when
    used in transactions on the blockchain. Therefore, cryptocurrency’s significant
    attraction and benefit are that you can anonymously conduct blockchain transactions
    because crypto’s cryptographic nature prevents people not involved in your transaction
    from knowing what you have done.


    ## WHAT ARE STABLECOINS, AND WHY ARE THEY NEEDED?


    Stablecoins are crypto tokens that have a set value. The value of stablecoins
    is the asset’s value (backed by the US Dollar \[USD\], gold, silver, commodities,
    or real estate). The reserves and assets backing stablecoins act as a guarantee
    that you can redeem them for a specific value.


    Stablecoins were needed to entice more businesses and people to want to use cryptocurrency.
    Cryptocurrency is well known for being volatile and having its values suddenly
    rise or fall. Therefore, companies wanted to ensure that the crypto payment they
    agreed to would have a consistent weight. Stablecoins have constant values and
    are not volatile. Their existence in the crypto market has made it possible for
    more businesses and people to engage in crypto transactions with less fear that
    they will lose money if the crypto market declines. After all, a stablecoin’s
    value never changes, regardless of what happens in the crypto market.


    If businesses accept stablecoins as payment for their goods and services, they
    know they will receive a specific amount of money when redeeming the coins in
    fiat currency. Furthermore, stablecoins make cryptocurrency more appealing to
    the private sector, public sector, and individuals. They are an entry point into
    the crypto market. They are more attractive and less intimidating because they
    do not seem as risky and threatening as traditional cryptocurrencies like Bitcoin,
    Ethereum, Cardano, and XRP.'
