- raw: "One of the community members was quite upset about the blockchain—at every\
    \ level. He and his family of five generations knew the ins and out of making\
    \ a productive garden. However, James didn’t understand a thing about technology\
    \ and didn’t want to run a node. So, Liam and the garden community blockchain\
    \ builders decided the way to help James was to build a marketplace in a member’s\
    \ backyard where veggies could be traded and stored. James then brought his 100\
    \ lbs. of veggies to the market, and in return, received 100 garden coins. \n\n\
    **James was still upset; what could he do with 100 garden coins?**\n\nAt the market,\
    \ James thought Liam cheated him by only giving him 100 digital garden coins—basically\
    \ invisible coins, he thought—while he had traded in his 100 lbs. of vegetables.\
    \ So, after voicing his opinion at the market, Lucas the composter went to James\
    \ and said, “I’ll give you 100 lbs. of compost in exchange for your garden coins.”\
    \ James, an avid gardener, loved growing but didn’t like the composting business\
    \ because he wasn’t fond of dealing with worms and rotting foods. So, James quickly\
    \ agreed and made the transaction with Lucas. Lucas then used his garden coins\
    \ at the market to buy fruits and veggies for his family and grandkids.\n\n**The\
    \ blockchain solves problems for the Wholesome Bounty Gardeners.**\n\nIn closing,\
    \ we can see how the unique qualities of the blockchain can facilitate and assist\
    \ in creating a store of value or wealth and exchange of this value peer-to-peer\
    \ without a third-party trust profiting. We can see how the WBG Gardeners blockchain\
    \ keeps evolving and expanding to fit the community’s needs.\n\n**Disclaimer**\n\
    \n*The story in this chapter is a work of fiction. Names, characters, business,\
    \ events, and incidents are the products of the author’s imagination. Any resemblance\
    \ to actual persons or events is purely coincidental. Any third-party trademarks\
    \ mentioned herein are used solely for descriptive purposes and do not constitute\
    \ or imply any sponsorship or endorsement of this material by such third parties\
    \ unless expressly stated.*\n\n![](Images/image00164.jpeg)![](Images/image00152.jpeg)CHAPTER\
    \ 6 \n\n# BUILDING YOUR CRYPTOCURRENCY DEFENSES\n\n**Take-Home Message**\n\n*Crypto\
    \ scams are increasing every year. You must be vigilant and take security precautions\
    \ to make sure that you secure your crypto assets. There are numerous ways you\
    \ can protect your crypto assets. Do the things that work best for you. Remember\
    \ that once hackers steal your crypto, it’s gone for good.*\n\n## CRYPTOCURRENCY\
    \ SCAMS ARE ON THE RISE\n\nCryptocurrency scams increase more than tenfold every\
    \ year. The more money investors put into the crypto market, the more attractive\
    \ it is to scammers and fraudsters.\n\nPeople lose money every day in the crypto\
    \ market. Unfortunately, new investors are susceptible to losing tons of money\
    \ via scams, shoddy investments, and hacking. Crypto investors know that these\
    \ scams and frauds exist to attract your interest and steal your crypto assets.\
    \ Unfortunately, these scams are getting more attractive and persuasive and can\
    \ look similar to legitimate offers and investments.\n\nThese scams are like the\
    \ ones used with bank accounts and credit cards. The primary difference is that\
    \ crypto scams use computer programming, Internet communication, and hacking skills.\
    \ In addition, the perpetrators are hard to catch because cryptocurrency is borderless\
    \ and can be accessed from anywhere in the world. So, good luck getting law enforcement\
    \ to see them and get your crypto assets back.\n\nThis chapter will give you a\
    \ brief overview of the most common crypto scams. Before we start, let me be blunt:\
    \ There is no way to know whether a crypto token, blockchain, crypto exchange,\
    \ or another type of crypto-related offering is entirely legitimate. The most\
    \ you can do is look for signs that the advertised crypto or blockchain investment\
    \ is what it claims to be.\n\n## FAKE CRYPTO EXCHANGES\n\nThe fake crypto exchanges\
    \ offer services similar to legitimate crypto exchanges. The difference is that\
    \ fraudulent exchanges target specific crypto tokens. The goal of the phony crypto\
    \ exchange operators is to collect the private keys of as many crypto tokens as\
    \ possible before they shut down the exchange and disappear.\n\nYou will realize\
    \ there is a problem with the fraudulent exchange when you cannot move your crypto\
    \ tokens to another address, redeem them, or exchange them for other crypto tokens.\
    \ The operators of the fake crypto exchange will blame the problems on technology\
    \ and then abscond with your crypto assets. Tragically, you and the other platform\
    \ users will never recover your stolen crypto assets. Moreover, the fake crypto\
    \ exchange operators will most likely never be found or forced to answer for their\
    \ crimes.\n\n*Spotting Fake Crypto Exchanges*\n\nWhen you research the crypto\
    \ exchange, ask yourself several questions. If you can’t find satisfying answers\
    \ to these questions, stay away from the crypto exchange.\n\nThe questions are:\n\
    \n*   Can you find detailed information about the people operating the crypto\
    \ exchange?\n\n*   Can you see the crypto exchange operators’ social media accounts\
    \ and profiles?\n\n*   Are the exchange operators’ profiles and accounts active\
    \ and up-to-date?\n\n*   Does the exchange have high liquidity?\n\n*   Is there\
    \ enough capital invested in the crypto exchange to fund its growth, expansion,\
    \ and maintenance?\n\n*   Does the crypto exchange have medium to high trading\
    \ volume?\n\n*   Does the crypto exchange store your crypto tokens’ private keys?\n\
    \n*   Are you required to give the crypto exchange your personal information?\n\
    \n*   Does the crypto exchange have a good reputation with other crypto enthusiasts?\n\
    \n*   Are there any complaints about the crypto exchange’s customer service?\n\
    \n*   Is the crypto exchange being discussed on Twitter, Discord, or Reddit?\n\
    \n*   Have crypto enthusiasts had any problems conducting crypto transactions\
    \ on the crypto exchange?\n\n## HOW TO PROTECT YOURSELF\n\nIf you are not using\
    \ a well-known CEX, transfer your crypto tokens out of your CEX account and into\
    \ your private wallet regularly. Also, limit the information you give the CEX\
    \ when registering your account. Note that some people have had their identities\
    \ stolen using the information they provided to fake crypto exchanges to open\
    \ their accounts. Finally, if an exchange is incredibly cheap and seems too good\
    \ to be true, it is probably a phony crypto exchange.\n\n## FAKE CRYPTO WALLETS\n\
    \nCrypto investors can have their crypto tokens stolen by storing them in a fake\
    \ crypto wallet. These wallets can be downloaded from the Internet or acquired\
    \ from online shops. The problem is that these wallets are not legitimate software\
    \ programs; they are created by scammers who want to steal your crypto assets.\
    \ They usually have names similar to famous cryptocurrencies and crypto exchanges.\
    \ They do this because they want to borrow the credibility of the established\
    \ crypto company. They use a company’s name, reputation, and market performance\
    \ to get potential customers to trust and use their software.\n\n*Spotting a Fake\
    \ Crypto Wallet*\n\nBefore you choose a crypto wallet:\n\n*   Research the company.\n\
    \n*   Check its performance history, customer complaint record, and social media\
    \ forums for information about it.\n\n*   If you spot any red flags or questionable\
    \ stuff, stay away from it.\n\n## HIDDEN WALLETS\n\nHidden wallets are crypto\
    \ wallets in your computer or smartphone that have been put there by a hacker\
    \ to steal your crypto. Deploying hidden wallets is done via the hacker getting\
    \ access to your electronic device, creating a wallet on it, and giving the hidden\
    \ wallet an address similar to your crypto wallet. The hacker will then go into\
    \ your computer and locate places where you have copied your crypto wallet’s address\
    \ and change the address to the hidden wallet’s address."
