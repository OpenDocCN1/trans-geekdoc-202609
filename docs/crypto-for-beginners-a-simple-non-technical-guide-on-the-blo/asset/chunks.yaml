- raw: 'Decentralized crypto exchanges (DEXs) are digital marketplaces where crypto
    holders can buy, sell, and trade crypto tokens. They differ from CEXs in that
    users don’t have to register an account with DEXs, and DEXs do not take custody
    of their crypto tokens during crypto transactions. Some popular DEXs are Uniswap,
    PancakeSwap, and SushiSwap.


    DEXs are terrific for people who want to maximize their financial privacy with
    almost no oversight. Plus, they have other services that attract users to their
    platforms. Such services include automated market makers (to help you trade crypto
    tokens) and crypto wallet extensions that optimize token prices and decrease swap
    and slippage fees.


    DEXs can be especially useful because they often carry newly launched tokens that
    do not have high trading volumes, tokens of low value that have low trading volumes,
    and highly speculative and risky tokens. These tokens are not likely to be listed
    on CEXs because CEXs have requirements that must be met before tokens can be listed
    on the platform. Unfortunately, most newly launched tokens, low-value tokens,
    and highly speculative tokens do not satisfy the listing requirements of CEXs.
    Tokens that do not meet the criteria of CEXs instead often list on DEXs.


    *Token Options*


    DEXs can list any token hosted by its blockchain. Therefore, they have access
    to newly launched tokens before they list on CEXs. But unfortunately, they also
    list a lot of scam tokens. Thus, platform users must be careful when trading tokens
    on a DEX.


    *Anonymity*


    There is no account registration process, know your customer (KYC) protocol, or
    anti-money-laundering (AML) protocol on DEXs. Instead, DEX users engage in private
    P2P transactions using smart contracts. The DEXs do not identify contracting parties
    or store personal information on their platforms. Consequently, for crypto holders
    who want absolute anonymity, DEXs are the best crypto exchanges.


    *Reduced Risk of Hacking*


    Platform users are less likely to have their crypto token stolen during a transaction
    on a DEX. Crypto holders maintain custody of their crypto assets on a DEX until
    they transfer them to another crypto wallet. At no time do DEXs take control or
    possess their platform users’ crypto assets.


    *Reduced Transaction Risks*


    DEX contracts on the blockchain are the way of smart contracts. If the two contracting
    parties fulfill their obligations, the transaction completes. If they do not fulfill
    their responsibilities, the agreement expires. Smart contracts do not allow for
    partial completion of the contract. Therefore, on DEXs, there is a reduced risk
    of contract problems if there is inappropriate conduct by either party to the
    agreement.


    ## EVERYTHING YOU WANTED TO KNOW ABOUT CRYPTO WALLETS


    ## WHAT IS A CRYPTO WALLET?


    Crypto wallets, also known as blockchain wallets, are places where you store your
    crypto tokens and NFTs. They are helpful for the following activities:


    *   Storing cryptocurrency


    *   Selling, buying, and trading cryptocurrency


    *   Selling, buying, and trading NFTs


    *   Trading on crypto exchanges


    ## CRYPTO WALLET PASSWORDS AND SECRET SEED PHRASES


    You are in control of your crypto wallet. It is like a decentralized bank account
    that you can use for digital transactions. But, also necessary, you must remember
    your crypto wallet password and secret seed phrase. The password opens the crypto
    wallet and gives you access to the crypto tokens and NFTs stored. The private
    seed phrase allows you to recover your crypto wallet if you forget your password.


    Your secret seed phrase will have 12 to 24 words in it. The words are common words
    found in an English dictionary. However, the words must be entered into your crypto
    wallet app in a particular order if you want to recover your crypto wallet. An
    example of a secret seed phrase is “witch collapse practice feed shame open despair
    creek road again ice least.” If you forget your password and lose your secret
    seed phrase, you lose access to your crypto wallet and everything in it.


    You must keep your wallet password and secret seed phrase private. You must never
    tell anyone your wallet password or secret seed phrase. Secret seed phrase confidentiality
    is necessary because any person can access your crypto assets with either of these
    pieces of information.


    ## CUSTODIAL VS. NON-CUSTODIAL WALLETS


    A crypto wallet maintained on a CEX (e.g., Robinhood, Kraken, Binance, Coinbase)
    is a custodial wallet. CEXs are operated by a central authority, just like a bank.
    The central authority can take possession of your assets, deny withdrawals or
    receipts of cryptocurrencies to your custodial wallet, or even remove you from
    the platform.


    Non-custodial wallets are independent private crypto wallets. Some examples of
    non-custodial wallets are Trezor, Ledger Nano X, Exodus, Coinbase Wallet, Mycelium,
    and Electrum. These wallets can be specialized to deliver optimal performance
    in different situations. For example, some crypto wallets are excellent for cell
    phones and desktops. Other wallet designs are good for beginning crypto investors,
    DeFi investors, or investors who want to invest in NFTs.


    ## PRIVATE KEYS


    The blockchain uses private keys to grant access to your cryptocurrency balance
    on the blockchain and permit transactions. In addition, private keys determine
    the owner because only the owner can transfer the cryptocurrency to other crypto
    accounts and use it in transactions. In real-world terms, private keys are similar
    to the PIN of a credit or debit card. If you give someone your PIN, that person
    can use your PIN to remove money from your credit or debit account.


    Private keys should be kept secure. For example, you may want to use a USB drive
    with a password to store your private keys. In addition, you should back up any
    information stored on that USB, because if you lose your private keys, you lose
    your crypto . . . forever.


    ## PUBLIC KEYS


    Crypto wallets have public keys, also known as public addresses. The public keys
    are composed of a string of random letters and numbers to identify crypto wallets.
    The public key is like a bank account number that you can freely share with others.
    You use a public key as a destination address in crypto transactions. As a real-world
    analogy, the public key of a crypto wallet is like a bank account number. People
    with your bank account number can send you money without your other personal details.


    ## PUBLIC-PRIVATE KEY ENCRYPTION


    When a network issues a crypto token, the token has a private key. The private
    key generates a public key linked to the private key cryptographically. You can
    give anyone your public key, but you must never give anyone your private key.


    Public keys are generated from private keys using a process called hashing. Hashing
    processes a string of data using an algorithm. The method of creating the public
    key is almost impossible to reverse engineer. So, it is highly improbable that
    anyone can guess or deduce your private key from your public key. As a result,
    these encrypted keys keep your crypto assets safe and secure.


    People can send you crypto tokens that are compatible with your crypto wallet
    using your wallet’s public key (i.e., public address). So, if your crypto wallet
    is Ethereum-compatible, you can receive Ethereum-compatible crypto tokens. However,
    you must have the wallet’s password to access the crypto tokens in your wallet.
    As a real-world analogy, your wallet’s public key is like a bank account number.
    Likewise, the wallet’s password is like the PIN of your credit or debit card.


    ## SINGLE VS. MULTI-CHAIN WALLETS


    There are two types of crypto wallets: single-chain and multi-chain wallets. The
    kind of wallet a person decides to use will depend on the interactions the person
    wants to have with a blockchain or blockchains.


    *Single-Chain Wallet*'
