    边玩边赚（P2E）游戏是区块链上的去中心化应用程序（dApps），主要是基于以坊坊。人们在玩这些游戏时可以获得加密货币，这些代币可以存储在玩家的加密钱包中。加密钱包是存储加密货币的电子位置。要玩
    P2E 游戏，玩家必须拥有加密钱包。


    某些 P2E 游戏允许玩家对锦赛、比赛和排名进行下注；如今，有些人通过游戏获得额外收入，而另一些人则支付费用或使用原生代币供应加入新的游戏。


    ![](img/image00147.jpeg)![](img/image00143.jpeg)


    ## 第二章


    # 对加密货币世界持有正确的观点


    **核心要点**


    * 加密货币是金钱的最新演变。

    * 区块链技术实现了无边界、去信任的点对点交易。

    * 它还开启了传统金融之外的许多交易类型。


    ## 为什么加密货币如此重要？


    加密货币为普通人提供了真正的财务主权和跨越世代的财富创造潜力。那些意识到收益机会的人会在合适的时刻进行投资；随着采用率的增长，它获得了社会动力，直到加密货币变得无处不在——惠及任何寻求财务独立或通过战略投资实现跨代财富积累的人。


    **货币的定义**


    货币作为社会对劳动生产力价值的共同衡量标准，适用于人类和物品；被共识接受的货币作为商品和服务的介质，因此社区使用这种社会认可的货币来评估物品价值


    ## 货币的历史


    货币系统从物物交换向数字货币演进⁴让我们看看社会是如何从交换服务/商品转向通过互联网传输电子数据的：


    ### 物物交换

    在广泛的物物交换系统下，参与者直接交换其他商品/服务，例如：鞋匠用鞋子换木匠的木桌子，但供应限制防止了直接交换，需要多个中间步骤，例如寻找愿意交易牛的人，然后进行一系列交易，最终在收到牛后再次交换目标物品，例如鞋匠可能需要找到接受鞋的人收到牛，最后获得想要的桌子。当首选商品不可用时就会出现问题，需要间接路线，导致效率低下、时间、精力和能量资源的浪费，整个系统效率低下，阻碍了经济增长和繁荣，普遍需求需要改进，因此转向了自然物品、主权国家货币、金属、纸质金本等，每种货币解决了之前方法的特定缺点，现代经济继续完善了更可靠、可扩展、高效的替代方案。

    '
