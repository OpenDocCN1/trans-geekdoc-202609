    Using your paper trading account or whatever way you choose to practice trading
    and testing your trading strategies, focus on one or more of the following crypto
    tokens:


    * Bitcoin Native Token (`BTC`)

    * Bitcoin Cash Native Token (`BCH`)

    * Ethereum Native Token (`Ether`)

    * Polkadot Native Token (`DOT`)

    * Decentraland Native Token (`MANA`)

    * Dogecoin Native Token (`DOGE`)

    * Cardano Native Token (`ADA`)

    * Tether Native Token (`USDT`)


    # BUILD YOUR CRYPTO WEALTH NOW!


    You have everything you need to develop and improve your crypto trading skills.
    Get started today! When comfortable and confident with paper trading, begin investing
    in crypto tokens.


    Note, don’t be a forever paper trader!


    At some point, you will have to commit to crypto trading and invest your own money.


    If you struggle to begin actively trading, set a date for trading and invest a
    small amount of money in your trade. Eventually, you must “rip the Band-Aid off”
    and expose yourself to crypto market, for better or worse.


    Remember: With experience and (some) luck comes great opportunity and wealth.![](Images/image0171.jpeg)[](Images/image0168.jpeg)


    # CHAPTER 8 STRATEGICALLY PROFIT FROM CRYPTOS AND THE KEYS TO CREATING YOUR MULTI-GENERATIONAL
    WEALTH


    ## Home Message


    Crypto investors who want to become millionaires and create multi-generational
    wealth must be disciplined, dispassionate, and record-keeping investors to set
    goals, milestones, and market entry/exit strategies. Overall, the best plan for
    accumulating wealth as a crypto investor is to invest in assets that are promising
    long-term.


    ## WHAT IS MULTI-GENERATIONAL WEALTH?


    When you have achieved multi-generational wealth, it means that you have built
    up a sizable fortune in savings and investments that is also resilient, self-perpetuating,
    and more importantly, secure. As a result, your children, grandchildren will benefit
    from the wealth you have created in your lifetime.


    Nowadays, the average person can create multi-generational wealth using the multiplier
    effect of crypto investing. Opportunities are still available; in 2021, more than
    cryptocurrencies increased their values. However, creating multi-generational
    wealth is not a get-rich-quick scheme. You must be in it for the long run; achieving
    it requires staying the course and not letting your emotions trip you up.


    For the first time in history, cryptocurrency has democratized the opportunity
    to become a millionaire. Moreover, regarding wealth preservation, cryptocurrencies
    can be foundational to keeping families’ fortunes intact and passing them on to
    future generations. With a market cap greater than $400 billion, there are estimated
    18,000 new millionaires due to Bitcoin’s parallel rise. Furthermore, the rise
    of bitcoin may only be in its infancy and is happening at a global scale, which
    means there is a rare opportunity to accumulate a massive amount of wealth; historically,
    wealth transfers happened mainly at regional scales.


    Due to cryptocurrencies’ unguessable and hack-proof SHA encryption key—hash algorithm
    that transforms a string of data into precisely 256 bits of data—cryptocurrencies
    are an incredible tool for securing generational wealth because they are virtually
    impossible to confiscate. You can memorize the secret seed phrase to generate
    your crypto wallet, and the seed phrase can be handed down to future generations,
    perhaps even without a third-party trust. Furthermore, the finite number of coins
    minted in specific cryptocurrencies is a significant hedge against inflation.
    Can you imagine leaving Bitcoin for your grandkids and having that value accumulate
    over time to be worth $1 million or $5 million when they become adults? By storing
    your accumulated wealth in cryptocurrencies, you have a better chance of safeguarding
    and growing your family fortune and guarding against the rise of inflation for
    years to come.


    Keep your wealth tree growing by making sure it has deep roots. Deep roots come
    from making sound investments in growth sectors with good return on investment.
    Cryptocurrency, blockchain technology, and crypto-related industries are not going
    away. They are evolving to fill unmet needs in different markets and to more efficiently
    manage commercial transactions.


    Now, you are probably wondering how viable cryptocurrency is as a long-term investment
    because its market rises and falls suddenly with no apparent reason as the cause
    of the market shifts. Well, this happens in the stock market too. However, there
    are some potential explanations for the stock market’s shifts because the stock
    market is tied to real-world tangible assets and services. It has been hard for
    most investors to beat the stock market despite the information available about
    companies listed on stock exchanges and 24/7 news broadcasts about every international
    event that may affect it.


    Wise investors know that when the market is in turmoil and they are uncertain
    about what to do with their crypto investments, they should do nothing. Your due
    diligence in selecting your crypto investments, your studies of market activity,
    your (ideally) detachment from it, and your predetermined investment exit plans
    will tell you what to do. But most of the time, you should do nothing. Just bide
    your time and watch the market reset itself.


    Investors with long-term mindsets don’t care about the daily vagaries of the market.
    Instead, they look at the big picture, their investment performance over time,
    and opportunities to add valuable investments to their portfolio. For example,
    Warren Buffett is a very successful investor who invests for the long term (decades).
    He does not sell off his assets when they suddenly drop in value or when there
    is a bear market. Instead, when the market is in the basement, he goes shopping
    for great investments that produce sound sustainable returns over time. In short,
    there has to be congruence between your intentions and actions. Making choices
    out of fear is incongruent with a long-term investment strategy.


    At this point, you have decided to adopt a long game and create multi-generational
    wealth (otherwise, why are you reading this book?). However, your resolve to be
    detached and confident, practice due diligence, and watch the markets has spurred
    you to press on and master the techniques and mindset of crypto millionaires.


    # ADOPT A LONG-TERM INVESTMENT GAME PLAN


    ## Your Decision-Making Process


    Before you can put your long-term investment strategy to work, you have to have
    good information. However, suppose you base your decisions on erroneous or poorly
    reported news. In that case, your potential actions are faulty, and the outcome—whichever
    plan you choose—will likely not produce the desired results.


    Remember: Choosing between the lesser of two evils is still choosing something
    evil. Good information sources will inform you of your best options to achieve
    your goals. Choosing between good/promising options will likely help you stay
    the course and create multi-generational wealth within your lifetime.


    There are millions of ways to make a million dollars. But unfortunately, people
    rarely do it because they do not take action.


    ### Decide Your Risk Tolerance and Preferred Investment Type

