    \ New blockchain developers should not copy white papers or imitate another. Lack\
    \ of authenticity in the white paper is a major red flag.\n\n### Research the\
    \ Founders and Development Team\n\nTo drive a token’s development, launch, and\
    \ maintenance, you need founders and a development team with a vision, a background\
    \ in cryptocurrency and blockchain technology, and some connections to the industry.\
    \ They should also have an online presence that you can trace. For example, they\
    \ should have profiles on `LinkedIn`, be part of online crypto forums, and have\
    \ been part of at least one crypto project. The founders and development team\
    \ don’t have to have a flawless technology background; as a group, they should\
    \ complement one another and provide the skills, talents, knowledge, and expertise\
    \ necessary to develop, launch, and maintain a crypto token.\n\n### Assess the\
    \ Project’s Milestones\n\nBlockchain developers create crypto projects for long-term\
    \ investment, usefulness, and value and should have milestones laid out before\
    \ they launch a blockchain. Developers should have achieved some initial landmarks;\
    \ moreover, there should be evidence that the team is actively progressing towards\
    \ achieving the next milestone and setting the stage for attaining additional\
    \ milestones. In short, the developers should set aside capital to fund the maintenance\
    \ and development of the token, a system to generate more revenue to invest in\
    \ the token, and an active effort to reinvest funds into the token and the services\
    \ it provides its users. Absent this kind of financial investment in the token,\
    \ it will most likely not be an excellent long-term investment.\n\n### Investigate\
    \ the Token’s Community\n\nCrypto tokens that will last need a community that\
    \ will support them, spread information about them, create demand for them, and\
    \ have an interest in holding them. You can find crypto communities on `Twitter`,\
    \ `Reddit`, `Discord`, and `Facebook`. If you want to invest in a token, attention\
    \ to the chatter and discussion about the token. However, you should not assume\
    \ that everything you hear or read about the token of interest is authentic. There\
    \ may be some golden nuggets of information mixed in with the forum discussions\
    \ that will give you some leads on where to research the token, the project’s\
    \ intended longevity, and whether or not anyone thinks the token is a scam.\n"
