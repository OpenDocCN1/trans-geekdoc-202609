- raw: "Play-to-Earn (P2E) games are dApps on a blockchain, primarily the Ethereum\
    \ blockchain. People can earn crypto tokens while playing these games, and the\
    \ tokens can store the tokens earned during the P2E games in the players’ crypto\
    \ wallets. Crypto wallets are electronic locations where you can store crypto\
    \ tokens. To play a P2E game, the player must have a crypto wallet.\n\nSome P2E\
    \ games permit players to bet on game tournaments, matches, and player rankings.\
    \ Today, some people play P2E games to earn side income. Some P2E games require\
    \ players to pay a fee to join the fun. Others, especially newer ones, allow players\
    \ to join the game, but they must pay for game supplies with the game’s native\
    \ crypto tokens if they want to participate.\n\n![](Images/image00147.jpeg)![](Images/image00143.jpeg)CHAPTER\
    \ 2 \n\n# HAVING THE RIGHT OPTICS ON THE CRYPTOCURRENCY WORLD\n\n**Take-Home Message**\n\
    \n*Cryptocurrency is the latest evolution of money. Blockchain technology has\
    \ made it possible to use cryptocurrency in borderless, trustless, peer-to-peer\
    \ transactions. In addition, it opens up a wide variety of alternative transactions\
    \ that you can perform outside of the traditional financial system.*\n\n## WHAT\
    \ MAKES CRYPTOCURRENCY SO IMPORTANT?\n\nCryptocurrency gives the average person\
    \ true financial sovereignty and wealth. As this technology evolves, it will create\
    \ tremendous benefits for people for generations. The people who benefit from\
    \ it will be the ones who realize its income-generating opportunities and invest\
    \ in it at the right time. Furthermore, as more people invest in cryptocurrency,\
    \ it will gain momentum and be propelled forward in society. As society gradually\
    \ embraces cryptocurrency and realizes its true potential and power, it will become\
    \ ubiquitous. Individuals who want financial independence and to create multi-generational\
    \ wealth will be better served financially by investing in cryptocurrency.\n\n\
    **Currency’s Definition**\n\nIn essence, money is a common way to price the work,\
    \ productivity, and value of people and their things. Plus, currency is what our\
    \ society agrees to accept as a medium of payment for goods and services. So,\
    \ the money is given value, and the community then assesses the value of its goods\
    \ and services using the socially accepted currency.\n\n## HISTORY OF MONEY\n\n\
    Monetary systems have evolved from bartering to digital currency. Let’s look at\
    \ how currency has graduated from exchanging your services and trading goods to\
    \ sending electronic data from an electronic device across the Internet.⁴\n\n\
    *Bartering*\n\nUnder the barter system, which many people worldwide still use,\
    \ people can get goods and services by exchanging other goods and services. For\
    \ example, if a shoemaker wants a new wooden table for his home, he can offer\
    \ to supply the village carpenter with enough shoes to pay for the wooden table.\n\
    \nThe problem with this system is that people are limited to the goods and services\
    \ they can provide to others. Or they must go through a series of different transactions\
    \ before they can get something the other person wants and exchange it for what\
    \ they want from that person. For example, maybe the shoemaker does not wish for\
    \ shoes or need them, in our case. But, on the other hand, perhaps the shoemaker\
    \ would like a cow in trade. So, the shoemaker must find someone who will exchange\
    \ a cow for his shoes, or he may enter into a series of transactions that ultimately\
    \ result in him getting a cow. Then, after receiving the cow, he exchanges it\
    \ for the wooden table he wants for his home.\n\n*Natural Objects*\n\nSome societies\
    \ have been able to move away from the bartering system. These early societies\
    \ instead used natural objects as a form of currency. They used things like cowrie\
    \ shells and whales’ teeth. These natural objects were given a specific value\
    \ and could be used to purchase goods and services. They functioned as currency\
    \ because they were a form of payment accepted by everyone in exchange for other\
    \ things.\n\n*Sovereign Nation’s Currency*\n\nOver time, sovereign nations chose\
    \ not to use natural objects and moved away from the bartering system. They did\
    \ this by issuing their own currencies. The currency often had a king, queen,\
    \ or prince’s face printed on it, and the nation’s government valued and accepted\
    \ it as currency within its borders. This money was backed by the country’s reputation,\
    \ assets, credit, and reserves.\n\nThe problem with this currency was that it\
    \ was only as good as the nation’s credit and reputation. Therefore, there were\
    \ concerns about trading it or purchasing goods and services outside the country.\
    \ In addition, this problem worsened if the government was at war, in a dire financial\
    \ situation, or facing political instability.\n\n*Metals*\n\nWhen societies realized\
    \ the potential and value of metals, they started to use them as forms of payment.\
    \ Metals were not only valuable as methods of payment, but you could use them\
    \ to create weapons of war, cooking supplies, and shoes for horses.\n\nSociety\
    \ derived the value of the money itself from the metals’ actual use in the community.\
    \ The utility of money matters, because when goods and services are valued using\
    \ metal (e.g., iron, silver, copper), the metal’s value is correlated to its value\
    \ in society, particularly its importance to the government and military. For\
    \ example, when war debts had to be paid by the country or the government was\
    \ preparing for war, the government required the kingdom’s people to contribute\
    \ their metals (e.g., gold, silver, copper) to the government’s war effort or\
    \ debt repayment.\n\n*Metal Coins*\n\nInstead of just exchanging bits or chunks\
    \ of metal, governments decided to create metal coins. Governments made specific\
    \ metals with particular values in that society into coins. People were then able\
    \ to exchange coins for goods and services. We know this was quite convenient\
    \ for some societies because coin minters made holes in the center of the coins\
    \ so that people could easily carry them on strings from place to place.\n\nThe\
    \ coins were easier to transport, hide, secure, and value than various pieces\
    \ of metal that people managed to acquire. They were also easier to exchange across\
    \ different kingdoms. People in other domains could evaluate and assess the value\
    \ of a metal and decide what it was worth, in terms of goods and services in their\
    \ kingdom. In short, which domain created the metal coin was not necessary, only\
    \ the kinds of metal used in the coins. Moreover, these metal coins could also\
    \ be melted down and used to make pots, horseshoes, swords, armor, and other items\
    \ the kingdom might need.\n\nCoins became a vast improvement over the bartering\
    \ system, natural objects, and metal (in general), but they had a significant\
    \ drawback: people knew how to counterfeit coins. People made counterfeit metal\
    \ coins and exchanged them for goods and services. The people doing this used\
    \ inferior metal or other tricks to make their coins look and feel authentic.\
    \ Consequently, merchants and the public had to be incredibly careful when receiving\
    \ and exchanging metal coins.\n\n*Paper Money Backed by Gold*\n\nLater, governments\
    \ began issuing paper money. Paper money was lighter, easier to carry, easier\
    \ to hide, easier to secure, and broadcasted the sovereignty of a government.\
    \ Therefore, people governed by the government would accept paper money in exchange\
    \ for goods and services. Initially, the government did not back paper money with\
    \ gold. Instead, the government approved paper money by its word that issued the\
    \ money. In short, the government said the money had a particular value, and the\
    \ government told the citizens to accept the paper money in exchange for goods\
    \ and services. The problem with this system was that it did not work well when\
    \ buying goods and services in other countries. It was also problematic if the\
    \ country that issued the money had political and socioeconomic problems or if\
    \ the future of the country’s government was in question."
