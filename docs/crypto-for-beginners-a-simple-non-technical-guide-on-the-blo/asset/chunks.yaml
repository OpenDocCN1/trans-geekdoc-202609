- raw: '5.  Blockchain Hacks – If the blockchain has been hacked repeatedly, you may
    want to pass on it. Blockchains with adequate support, good coding, and traffic
    generally are not easily hacked. Note that cryptocurrency blockchains are not
    the same as crypto exchanges, so you cannot apply the same reasoning to crypto
    exchanges. Although you should be wary of a crypto exchange that has been hacked,
    especially if it has been hacked multiple times.


    6.  Blockchain Downtime – If the blockchain has had to suspend its activities
    because it was overwhelmed by transactions or crashed due to platform users’ heavy
    usage of its services, you may want to pass on it. Blockchains may process transactions
    much slower when traffic is on them, but they should not crash. If the blockchain
    has been down more than once, you should carefully research the development team
    and what it has done to stop this from happening in the future. 


    7.  Blockchain Patches – No matter how great the coding of a blockchain is, something
    will be missed and cause problems. You are not looking for a blockchain with perfect
    code but one with good coding, vigilant coders and security personnel, and evidence
    that the operators and developers are finding and fixing problems in the blockchain’s
    code before they cause problems for the platform’s users. 


    ## FUNDAMENTAL ANALYSIS’ 4 BASIC ASSUMPTIONS


    FA has four basic assumptions that must be valid or reasonably true for FA to
    reflect a company’s “true” value:


    1.  The current stock price does not reflect the actual value of the company.


    2.  The FA value better reflects the company’s “true” stock value.


    3.  Over time, the stock price will reflect the calculated FA value. It is unknown
    how long it will take for the company’s stock price to reflect the FA valuation.
    It could take days, months, or even years.


    4.  Investors who focus on specific industries and their companies can calculate
    the intrinsic value of companies in the industry and find opportunities to buy
    the stock at discounted prices.


    ## TECHNICAL ANALYSIS (TA)


    TA of cryptocurrency is based on the Dow Theory, which has six fundamental principles.
    The six principles are:


    1.  The market price of an asset represents the asset’s “true” value (including
    traders’ expectations and market sentiment).


    2.  You would base price movements on the following market trends:


    3.  Primary/main trends that last from several months to more than a year.


    4.  You can locate secondary trends in primary/main trends; these last several
    weeks and are market corrections of the primary/main trends.


    5.  Minor/short trends that last 1–2 weeks. 


    6.  Primary trends have three consecutive phases, which are:


    7.  Accumulation – Buyers buy the asset, or sellers sell it. Their market activity
    doesn’t affect the price of the investment.


    8.  Public Participation – More traders notice and follow the new market trend,
    and their trading activity causes the asset’s price to change rapidly.


    9.  Distribution – During periods of rampant speculation, experienced traders
    distribute their holdings.


    10.  Different TA indices must confirm on another’s market signals. The correlation
    between crypto pairs’ movements is something you can observe in the crypto market. 


    11.  There must be an increase in trading volume as the price moves. If the trading
    volume increases with the price movements, the price follows the market trend.
    However, if the trading volume decreases as the price movements increase, the
    price moves against the market trend.


    12.  A trend continues until there are obvious signals in the market that it will
    reverse itself. Prices generally follow trends; they don’t change them. Reversals
    in primary trends can be challenging to identify and often resemble secondary
    movements.


    ## TECHNICAL ANALYSIS (TA) TOOLS


    There are five main categories of TA tools. The categories are:


    1.  Trade Statistics (e.g., Trading Volume)


    2.  Candlestick Analysis


    3.  Chart Patterns


    4.  Resistance and Support Levels


    5.  Technical Indicators


    Traders often use a combination of TA tools to read the market. They do this because
    if the tools give the trader the same signal, they confirm each other. If two
    or more tools ensure each other, the trader can be confident that the market predictions
    about price movements are correct or more likely to be accurate. Furthermore,
    the tools can indicate the strength of the market trend, and the stronger the
    market trend, the greater the chances that the trader has correctly read or interpreted
    it.


    TA tools help traders to reduce their market risk and trading errors. However,
    they do not eliminate all trading risks. For example, traders can never be sure
    that they have made the correct predictions about the market trend, because they
    often resemble each other to some extent. Also, traders can never know how long
    a trend will last and how quickly it will change. 


    *Crypto Is Not Perfectly Suited for TA *


    Moreover, you cannot entirely predict cryptocurrency market movements based on
    prior market performance. In addition, you cannot simply correlate crypto assets’
    price movements to actual world events, economies, or investments; thus, its volatility
    is even more unpredictable. 


    ## GENERAL TA TOOL COMPONENTS


    This section will review critical factors used by most TA tools to determine market
    trends. The elements reviewed are analysis time frame, trading volume, candlesticks,
    support and resistance levels, and chart patterns (e.g., bullish, bearish, reversal,
    breakout).


    *Analysis Time Frame*


    There is no ideal period for observing the price movements of a crypto token,
    which means that the observation period primarily depends on your trading strategy.


    Traders will focus on different lengths of time because they are engaged in short-term
    or long-term trading. So, let’s look at how the time for market observation changes
    based on the type of trader.


    *   Scalpers enter and exit traders quickly (within 1–5 minutes).


    *   Intraday traders enter and exit trades within a day. They usually review 5-minute,
    15-minute, and 60-minute market charts.


    *   Position traders prefer long-term trading, which runs from 1 day to several
    weeks. 


    Trade within concise time frames is often better for volatile, highly speculative
    markets.


    *Trading Volume*


    Trading volume refers to the number of crypto tokens transacted within a specific
    period and is used to indicate the strength of a market trend. More robust trends
    have higher trading volumes, and weak trends have low trading volumes.


    ## CANDLESTICKS


    Candlestick charts are very popular with experienced and inexperienced investors.
    The candlesticks show the price movements of an asset during a set period. 


    Candles have a body, are red or green, and have a maximum of two shadows.


    *   Green candlesticks 


    The bottom is the opening price, and the top is the closing price. The closing
    price is higher than the opening price, so it is considered bullish.


    *   Red candlesticks


    The bottom is the closing price, and the top is the opening price. Because the
    opening price is higher than the closing price, it is considered bearish.


    ![](Images/image00157.jpeg)


    *Image originally from Probe-meteo.com, CC BY-SA 3.0*6.⁵


    ![](Images/image00158.jpeg)


    *Image “How to Read Candlesticks” from Financial Freedom Trading.⁶*


    ![](Images/image00159.jpeg)


    *Image by Mohamed Mahmoud Hassan on PublicDomainPictures.⁷*


    ## CANDLESTICK STRENGTH


    The asset’s price changes result from aggressive buying and selling in the market
    and the volume of orders. If there are many sell orders at the current price,
    the price will decrease. However, if there are many buy orders at the current
    price, the price will rise. 


    In short, when sell orders exceed buy orders, the asset’s price drops. But conversely,
    the worth rises when buyer orders exceed the seller orders. '
