- raw: '*   *There is an estimation of anywhere from 1 × 10^(78) to 1 × 10^(83) atoms
    in the known, observable universe.*


    So, there are more private key combinations than grains of sand, stars, and atoms
    in the universe combined. That’s a whole lot of private key combinations, making
    it practically impossible to duplicate or guess.


    **So, guessing someone else’s private was practically impossible, but what if
    someone lost their private key?**


    Liam realized that because the private key was impossible to recover if members
    lost it, he let the WBG community know of several ways to safeguard their private
    keys. First, he let the community know that in addition to the private key, there
    would be a 12-word secret *seed phrase *to generate the private key, and it would
    be much easier to remember the words in the seed phrase than the private key.
    Members could commit the seed phrase to memory to ensure they would not lose access
    to their garden coins on the WBG blockchain. Secondly, Liam recommended members
    also take the seed phrase and write it down or copy it to a USB drive and hide
    it in a safe location.


    **Now that WBG Members had their private keys, what were they to do with them?**


    Liam knew there had to be a portal that WBG members could connect to view and
    send their garden coin holdings. However, Liam did not want access to the gang’s
    private keys in any way, so he set up a *non-custodial wallet* option for members
    to access their garden coins. Liam had several non-custodial wallet options for
    the community: *a web wallet*, *desktop*, *or mobile wallet*. The team would input
    their private keys into the wallet, and the wallet would then connect to the WBG
    blockchain, allowing members to view their garden coin holdings or send garden
    coins to other members. The wallet would also have the *receiving address *the
    members would give other members to receive garden coins.


    **How does Liam’s blockchain integrate with the Wholesome Bounty Gardeners community’s
    fruits and vegetable yield?**


    So, let’s say the community garden trades fruits and vegetables amongst one another.
    One of the participants didn’t produce enough crops one year and wanted to exchange
    something other than vegetables with the rest of the group. So, if Oliver wanted
    three bags of potatoes from Sally, Oliver could now send to Sally’s public receiver
    key three garden coins on Liam’s newly written WBG blockchain.


    **But where did Oliver get his three garden coins?**


    Oliver decided to help build out the blockchain by running the blockchain program
    and investing in a desktop computer to run the blockchain node 24/7, not to mention
    the electricity required to keep the blockchain running continuously throughout
    the day. Each time someone in the community garden would make a transaction, Oliver’s
    computer would work on solving a mathematical problem to link transactions on
    the blockchain. And as compensation for running a *node* in the WBG blockchain,
    Oliver would be awarded a newly minted garden coin; this process is better known
    as *Proof of Work.*


    **What if Oliver’s or Liam’s blockchain node went down? Or both went down?**


    One of the WBG members, Joel, asked, “What if Oliver’s node goes down? Does that
    mean all our transactions are gone?” Liam knew that one of the critical features
    of blockchains is *persistence*, or no data loss. He knew that if the transaction
    ledger was lost, then the ownership of all the hard work and effort would also
    be forfeited. So, Liam told Joel and the WBG group that the blockchain algorithm
    also copied the transaction ledger onto Liam’s blockchain node. So, there were
    two live copies of the transaction ledger. Then Joel asked, “What if both computers
    are down?” Liam said that no one could transact if both computers went down, but
    the transaction ledger would still be on the hard drive on both the computers,
    and once the computers came back up, the transaction ledger would be accurate.
    Then Joel’s wife, Olivia, said, “Now wait a second. That’s all good and fine that
    the blockchain replicated the transaction ledger on two computers. But what if
    Oliver’s node is down, and Liam’s is still running? Doesn’t that mean the blockchain
    has missing transaction data when Oliver’s computer comes back online?” The WBG
    group was quite shocked at Olivia’s poignant question.


    Liam knew quite well the importance of having the integrity of the data be consistent
    and update-to-date on the blockchain. So, Liam began to talk about the WBG blockchain’s
    *consensus algorithm. *First, Liam explained to the group that the blockchain
    would compare the copies of the transaction ledger on all the nodes and use the
    transaction ledger with the greatest number of transactions in the chain. The
    blockchain algorithm would then replicate the longest transaction ledger to all
    the other nodes on the blockchain. Olivia then thought more about the consensus
    algorithm and realized that this would indeed keep the integrity of the transaction
    data.


    **Olivia, not completely satisfied, then interjected again about the integrity
    of the blockchain**.


    Olivia, with another inspirational thought, interjected again! She asked, “What
    if you and Oliver got together and secretly modified the transaction ledger?”
    With that thought alone, most of the WBG Blockchain gang gasped and began nodding
    their heads in agreement. Liam explained that the success and the trust in the
    blockchain happen by giving the community a way to view the ledger publicly, otherwise
    known as the *public ledger. *Liam also mentioned to the gang that not only would
    the transactions be able to be viewed publicly but the integrity of the transaction
    data would be even more robust if more members of the community had a blockchain
    node running in their houses. By having more nodes running, the WBG blockchain
    would have more copies of the transaction ledger on members’ computers, and the
    less likely anyone would be to be able to modify the transaction registry on all
    the nodes all at once. Again, Olivia saw the merits of the public ledger and running
    more blockchain nodes. Her final response to Liam was, “Touché.”


    **It’s fine for Oliver to mint new garden coins, but what about the other WBG
    members?**


    Well, little did folks in the community garden know that Liam had been putting
    in 100 hours per week writing the blockchain for the community and didn’t even
    have time to grow his vegetables. However, Liam needed help to write and maintain
    the blockchain and educate others on how the blockchain would benefit the community.
    So, Liam proposed something new and exciting: members who could help promote and
    support the blockchain would get newly minted garden coins. Blockchain builders
    of the community garden team could then trade their garden coins for fruits and
    veggies that the community grew. 


    **So, aren’t the blockchain builders of the community garden team now the third-party
    trust that blockchains are supposed to do away with?**


    No, because Liam decided to add several features unique to blockchains to allow
    for *fair governance*. First, *all* members have the ability to newly mint coins
    by supporting the blockchain, like how Oliver runs a node in his house to have
    a computer for the blockchain to run on. Secondly, Liam’s blockchain has a governance
    system in which the more garden coins one has, the more votes that person has
    in the community on blockchain features and future enhancements. 


    **In comes James, the mega grower in the community garden . . .**'
