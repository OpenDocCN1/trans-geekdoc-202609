- raw: "An example of a soft fork is the Segregated Witness (SegWit) protocol added\
    \ to the Bitcoin blockchain. SegWit allowed users to add more transactions to\
    \ a block by decreasing the data carried inside the block for each transaction.\
    \ However, the change in block size allocation divided the Bitcoin community on\
    \ whether to make it a permanent feature of the blockchain. The compromise was\
    \ to make it an option that Bitcoin users could implement when setting up their\
    \ transactions.\n\n*Example: Hard Fork vs. Soft Fork*\n\nUsing real-world examples,\
    \ let’s look at examples of a hard fork versus a soft fork.\n\n*Hard Fork*\n\n\
    The original blockchain is like a road that runs alongside a river. Part of the\
    \ blockchain community wants the blockchain to cross the river, but they are in\
    \ the minority. The majority of the blockchain community wants blockchain transactions\
    \ processed on the road. The people who wish for the blockchain to cross the river\
    \ decide to launch the blockchain. Their network uses riverboats to process the\
    \ transactions, whereas the original blockchain uses trucks on the road to process\
    \ its transactions. Because these two forms of transportation are incompatible,\
    \ the fork must have a completely different code from the original blockchain.\
    \ Because the fork’s programming is so other than the programming of the original\
    \ blockchain, the two are incompatible. As a result, the original blockchain cannot\
    \ execute the transactions intended for the fork, and the fork cannot process\
    \ the transactions designed for the original blockchain. Therefore, the division\
    \ must have a new name and its own native token.\n\n*Soft Fork*\n\nThere are lots\
    \ of streets going through every neighborhood in a city. These streets represent\
    \ how the blockchain executes transactions. Group A in the blockchain community\
    \ wants to build an overpass that bypasses the roads to process transactions faster.\
    \ In addition, when there is heavy traffic on the streets, the overpass will help\
    \ ease the congestion and prevent the transaction fees from becoming high. However,\
    \ other people in the blockchain community disagree with the overpass idea and\
    \ do not want it to become part of the blockchain. So, group A reaches a compromise\
    \ with the other members of the community. It will design an overpass that community\
    \ members can use for their transactions if they choose to use it. However, members\
    \ will process their transactions if they do not want to use them.\n\nIn this\
    \ case, the soft fork is compatible with the original blockchain. Blockchain users\
    \ who want to use the overpass can use the network as usual but opt to take the\
    \ overpass to avoid the congested city streets. Users who prefer the crowded city\
    \ streets or don’t want to use the overpass can simply elect not to have their\
    \ transactions processed that way. In the case of a soft fork, there are no substantive\
    \ changes to the blockchain code. Therefore, it does not get a new name or develop\
    \ its own native token because it remains a part of the original blockchain.\n\
    \n## COMMUNICATING BETWEEN DIFFERENT BLOCKCHAINS\n\n*Ethereum*\n\nEthereum is\
    \ the most versatile network in the crypto world. It hosts smart contracts, decentralized\
    \ applications (dApps), other blockchains’ tokens, non-fungible tokens (NFTs),\
    \ and decentralized financial (DeFi) transactions.\n\nTo accentuate the attractiveness\
    \ and usefulness of later launched blockchains (i.e., blockchains launched after\
    \ Ethereum achieved prominence), many made themselves Ethereum-compatible. That\
    \ means that the Ethereum-compatible blockchains’ users could run their dApps\
    \ and use their native tokens on the Ethereum blockchain, as well as access other\
    \ services on it. Users like this option, because often, newer blockchains have\
    \ faster TPS rates and lower transaction fees than the Ethereum blockchain, and\
    \ with this option, they can still access all the services provided by the Ethereum\
    \ blockchain.\n\nFor example, if someone created a dApp and wanted to move it\
    \ to the Ethereum blockchain, it could be done with no problem and vice versa.\
    \ Moreover, if someone started a blockchain game and wanted it to be available\
    \ to people on the Ethereum blockchain and other Ethereum-compatible blockchains,\
    \ it would be possible without changing the game’s code.\n\nThe best part about\
    \ Ethereum-compatible blockchains is that they can work with Ethereum when executing\
    \ smart contracts and DeFi transactions. At this time, you can have a smart contract\
    \ that exists on two different blockchains. As long as you use Ethereum and an\
    \ Ethereum-compatible blockchain, the smart contract will work uniformly well\
    \ on either blockchain. This is also increasingly true for DeFi transactions,\
    \ which means that people will be able to take advantage of more DeFi apps—not\
    \ just those hosted by their blockchain.\n\n*Polkadot*\n\nPolkadot is a blockchain\
    \ that allows incompatible blockchains to communicate with one another. Using\
    \ Polkadot, incompatible blockchains—like Bitcoin and Ethereum—can send value\
    \ and data between one another. Polkadot’s native token is DOT. Besides being\
    \ used as a governance token and for staking, it can be used as a payment medium\
    \ to transfer value from one blockchain to another.\n\nAnother benefit of using\
    \ Polkadot is that it has a high TPS rate, is scalable, and uses parallel blockchains\
    \ (parachains) to reduce the congestion on its network and maintain its high TPS\
    \ rate. It retains its high TPS rate by having the parachains process most transactions.\n\
    \nPolkadot’s main relay chain is its main blockchain that connects to the parachains.\
    \ They process transactions, receive the confirmations, and then send the information\
    \ to the main relay chain. The main relay chain checks the data from the parachains;\
    \ if everything checks out, it adds the parachain’s block to its blockchain.\n\
    \nNote that the parachains work within the Polkadot blockchain; they are not independent\
    \ of it. Also, they are application-specific blockchains. Still, they are full\
    \ blockchains with their consensus algorithms and security features as application-specific\
    \ blockchains.\n\n![](Images/image00153.jpeg)![](Images/image00148.jpeg)CHAPTER\
    \ 4 \n\n# THE ROADMAP TO CRYPTOCURRENCY OWNERSHIP\n\n**Take-Home Message**\n\n\
    *The two types of crypto exchanges are centralized crypto exchanges (CEXs) and\
    \ decentralized crypto exchanges (DEXs), and you should know about both. There\
    \ are also several types of crypto wallets, and there may be one that is the best\
    \ fit for you. After you set up a crypto account and purchase your first cryptocurrency,\
    \ you can begin making decisions about which exchanges and wallets best fit your\
    \ investment strategy.*\n\n## WHAT IS A CRYPTOCURRENCY EXCHANGE?\n\nA centralized\
    \ crypto exchange is a digital marketplace where crypto tokens can be purchased,\
    \ sold, and traded. Some popular centralized crypto exchanges (CEXs) are Coinbase,\
    \ Kraken, Gemini, and Binance. These exchanges let their users purchase using\
    \ fiat currency (cash) and cash out their cryptocurrencies to their bank accounts.\
    \ However, not all CEXs allow their users to buy crypto tokens with fiat currency.\
    \ On some CEXs, users can only buy, sell, and trade crypto tokens using other\
    \ crypto tokens as a medium of exchange.\n\nWhen buying, selling, and trading\
    \ crypto tokens, platform users should look at the crypto pairing on the CEX.\
    \ First, they should note if a crypto pairing exists. If the CEX does not list\
    \ the crypto tokens the crypto holder wants to work with, the crypto holder should\
    \ look for a different CEX for the transaction. Crypto tokens can only be bought,\
    \ sold, and traded if listed on a CEX. The listing on the CEX means that the CEX\
    \ has approved the crypto tokens for its platform and will allow users to use\
    \ them in different transactions. In addition, when crypto tokens are listed,\
    \ they are often paired with other crypto tokens, so platform users know the exchange\
    \ rates between additional crypto tokens."
