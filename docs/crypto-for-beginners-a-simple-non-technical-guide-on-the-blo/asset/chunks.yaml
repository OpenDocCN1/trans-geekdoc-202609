    crypto tokens. So, for example, if you wanted to buy Litecoin using Bitcoin, you
    would go to a CEX that has Litecoin and Bitcoin as a crypto pairing. Then, after
    looking at the crypto pairing and the exchange rate, you would decide if you wanted
    to exchange your Bitcoin for Litecoin on that CEX.


    ## SELECTING THE BEST CENTRALIZED CRYPTO EXCHANGE FOR YOU


    All centralized CEXs do not offer the same services to their users. Therefore,
    crypto holders should investigate each CEX they are considering using for their
    crypto transactions.


    Let’s look at some factors crypto holders should consider when evaluating CEXs
    for their crypto transactions.


    ## ACCESSIBILITY


    You will want to be able to access your CEX easily. For example, China has banned
    all crypto exchanges from operating within its borders. In other places, like
    the US, crypto exchanges may be prohibited in certain parts of the country (e.g.,
    New York state).


    ## SECURITY


    Because the Federal Deposit Insurance Corporation (FDIC) does not federally insure
    your crypto tokens like a US bank account, you’ll want to use a CEX that is very
    secure.


    When checking out potential CEXs, you want to look at how recently and how often
    each CEX has been hacked or lost funds due to fraudulent conduct. Also, you should
    check social media forums (e.g., Reddit, Discord, Twitter) for complaints by platform
    users about CEXs’ security and the scams operating on their platforms.


    ## INSURANCE


    Another consideration is whether the CEX insures the crypto assets of its users.
    For example, some CEXs, like Coinbase, offer crypto holders insurance against
    hacking. For instance, if hackers hack Coinbase and steal crypto assets, Coinbase
    has an insurance policy that covers up to US$255 million for its combined user
    base on the platform. In this case, even if Coinbase’s platform is hacked, if
    the value of the tokens stolen does not exceed US$255 million, crypto holders
    on the platform will not lose any of their assets.


    ## STORAGE


    Now, let’s look at crypto storage practices—specifically, what percentage of the
    crypto assets are kept offline in cold storage. The more significant the portion
    of crypto assets held in cold storage, the harder it is for hackers to steal them.
    For example, Coinbase only keeps 2% of its crypto assets online. The assets that
    it does save online are the ones actively traded. The remainder, 98%, are kept
    in cold storage and backed by Coinbase’s insurance policy.


    ## TWO-FACTOR AUTHENTICATION


    You can increase the security of your crypto account by activating a two-factor
    authentication code on your account. In addition to using your username and password
    to access your crypto account on a CEX, you must also enter a code sent to your
    mobile phone or email address. This code is additional proof/confirmation that
    you are authorized to access the account. This extra security feature may help
    prevent your crypto from being stolen by someone who has accessed your username
    and password.


    ## LARGER VS. SMALLER CRYPTOCURRENCY EXCHANGES


    There are differences between small CEXs and larger CEXs. The larger a CEX, the
    less likely it is to be hacked. Larger CEXs have larger trading volumes, higher
    levels of security, and, most likely, more personnel working to keep the platform
    secure than smaller CEXs. On the other hand, smaller CEXs with lower trading volume,
    and consequently less money, often do not have the same level of security as large
    CEXs, and their protocols are not updated as frequently.


    In addition, some larger CEXs, like Coinbase, are now listed on stock exchanges
    (e.g., NASDAQ) and have been approved by governmental agencies. These CEOs are
    more credible and trustworthy because they:


    *   have been able to meet the regulatory standards of US governmental agencies;


    *   have been independently audited;


    *   maintain documentation on their operations;


    *   have established security protocols; and


    *   report on their operations regularly to the US government.


    On the other hand, smaller CEXs often lack documentation, approval, and licenses
    from governmental agencies. As a result, smaller CEXs secure themselves with robust
    and comprehensive security protocols and build production management teams that
    closely watch their operations.


    ## EXCHANGE FEES


    Before selecting a CEX, review all the fees associated with using the CEX. Some
    CEXs have fixed transaction fees, but often the costs are a percentage of the
    crypto transaction itself. Other CEXs may charge fees based on the market price
    volatility. Of course, the fees may differ based on whether you are the buyer
    or the seller. In addition, they can vary depending on which crypto tokens you
    trade on the platform.


    Note, the higher the fees on a CEX, the more likely it is that the CEX is secure
    and easy to conduct transactions on. Conversely, the lower the prices are on CEX,
    the less likely you will receive support from it. In addition, you are more likely
    to have some difficulty conducting transactions on it as a beginning crypto investor.


    If you have never used a CEX before, you may be unfamiliar with the fees CEXs
    may charge their users. For example, payment services company Cass may charge
    fees for making deposits or withdrawals, redeeming crypto tokens, and trading
    crypto tokens. They may also set prices based on depositing fiat currency into
    your account. For example, credit card companies charge the highest fees if you
    use a credit/debit card to purchase cryptocurrencies. Banks charge wire transfer
    fees between bank accounts too. On the other hand, some CEXs, like Binance, do
    not charge fees for deposits and withdrawals.


    ![](Images/image00149.jpeg)


    *Image from “11 Best Crypto Exchanges and Apps of August 2022.”²*


    ## LIQUIDITY


    Check the liquidity and trading volume of the CEX. The higher the trading volume,
    the higher its liquidity. Liquidity is essential to you because when you want
    to sell, buy, or trade crypto tokens, an exchange with a high trading volume will
    let you do this easily. In comparison, an exchange with low trading volume may
    not be able to facilitate your crypto trading at preferred prices. Consequently,
    the delay in purchasing or selling your tokens on CEXs with low trading volumes
    may cause you to buy and sell at prices that decrease your potential profits.


    ## LISTED TOKENS


    CEXs are where you can buy, sell, and trade crypto tokens. They also list crypto
    pairings. You can trade cryptocurrencies with different crypto pairings listed
    on a CEX. Not every CEX lists every crypto on the market. The point is to find
    a CEX with the cryptocurrencies you want to purchase or trade while finding both
    the lowest purchase and transaction fees. When selecting a CEX, make sure it lists
    the tokens you are interested in trading, selling, and buying. Some popular crypto
    pairings are:


    *   ETH and Bitcoin Cash (BCH)


    *   BTC and Litecoin (LTC)


    *   BTC and USD Tether (USDT)


    *   BCH and USDT


    ## EDUCATIONAL TOOLS


    CEXs may offer educational tools that help its users learn about the crypto marketplace
    and stay up-to-date. These tools can include videos, quizzes, articles, and courses.
    Sometimes, you can earn crypto tokens by completing educational activities on
    the platform (e.g., quizzes).


    ## TAX INFORMATION


    Some CEXs provide their platform users with tax statements (e.g., 1099-B). These
    statements can be used by users to file their taxes correctly. However, most traditional
    CEXs (e.g., Coinbase, Kraken, Binance) only log transactions and do not provide
    tax statements. They do not offer tax statements because they cannot track your
    crypto transactions after you leave their platforms. In addition, they do not
    track your crypto assets after you transfer them to your private (i.e., off-CEX)
    crypto wallet.


    ## DECENTRALIZED CRYPTO EXCHANGES'
