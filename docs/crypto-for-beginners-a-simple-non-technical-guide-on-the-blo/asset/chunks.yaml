- raw: 'Full nodes have a complete copy of the blockchain and can add new blocks to
    the blockchain. The full node acts independently and is located anywhere in the
    world. Since they can all process transactions for the blockchain, governments
    can never shut down the blockchain. It operates independently of governments,
    regulatory agencies, police authorities, and any other form of interference found
    in a traditional financial system. Moreover, no one outside the blockchain can
    stop or censor the transaction before or during its execution.


    Light nodes are partial nodes that do not have access to the entire blockchain.
    Instead, light nodes restrict access to regions of the blockchains. Blockchains
    use light nodes to increase the transaction processing speed of the blockchain.
    After a light node has processed a block, it sends the block to a full node. The
    full node then checks the work done by the light node before adding the block
    to the blockchain.


    Besides having full and light nodes, blockchains employ numerous security personnel
    who work to keep the blockchain safe, secure, and reliable. Their primary purpose
    is to look for sketchy transactions, malicious conduct, and questionable behavior
    on the network. If they suspect any of these things, they alert other network
    personnel. When alerted, the network personnel investigate the suspicious behavior
    and transactions.


    If the watchdogs are correct, the blockchain rewards them with native tokens.
    In addition, the blockchain punishes users engaging in illegal, malicious, and
    corrupting conduct. The punishment can range from having their staked tokens seized
    to being banned from the network.


    Moreover, if the person punished was supported by others (e.g., using borrowed
    crypto tokens to qualify as a node), those supporting him are punished. Anyone
    caught facilitating, supporting, coordinating, or otherwise enabling inappropriate
    conduct on a blockchain will be penalized by the blockchain.


    ## IMMUTABILITY


    The blocks added to the blockchain also have time and date stamps included in
    the newly minted block before it has added the block to the blockchain. Furthermore,
    all full nodes have copies of the entire blockchain, and the full nodes must agree
    when the blockchain adds a new block. Because all the nodes on a blockchain must
    have identical records, the blockchain is considered immutable.


    If there are differences between the records kept by the full nodes, then there
    is an immediate investigation into the matter. The transactions in question are
    suspended or delayed until the problem with the blockchain is understood and resolved.
    If the block contains questionable transactions, the blockchain does not execute
    the transactions. If there are no other problems, transactions will have to be
    resubmitted for approval and reprocessed by the blockchain.


    This unchanging, unalterable public ledger gives the blockchain its reputation
    as a trustworthy network. The immutability of its record is something absent in
    traditional financial systems.


    Technically, someone or a group can substitute one block for another block in
    a blockchain. However, replacing blocks on the blockchain would involve many people
    who need to plan, coordinate, and replace many blocks simultaneously, decreasing
    the likelihood of this happening. In addition, the timing of the block substitution
    would have to be perfect. Thus, it is almost impossible to change blockchain records
    once the blockchain cements the block.


    ## TRANSPARENCY


    Anyone with a computer and access to the internet can see the blockchain’s public
    transactions. Even non-transacting parties can view the transaction on the blockchain,
    but more importantly, the blockchain does not disclose the identities of the transaction
    parties. However, the anonymity of the transacting parties does not obscure that
    the public can see their transactions.


    ## CRYPTOGRAPHY


    Cryptography on the blockchain enables its transacting parties to remain hidden
    from the public. Crypto wallets have addresses not connected to their owners’
    personal information. Furthermore, the private keys needed to access cryptocurrency
    do not link to their owner’s personal information. Therefore, you have a payment
    system that is encoded from beginning to end.


    Suppose you use a centralized crypto exchange (CEX) for your transactions. In
    that case, the CEX will have collected some personal information from you before
    it lets you register an account on its platform. In this case, the CEX can, to
    some extent, identify everyone using its platform (assuming that the registered
    users are giving correct information about themselves). However, the platform
    does not collect personal information from its users on a decentralized crypto
    exchange (DEX). A DEX is a decentralized cryptocurrencies exchange in which trades
    are made between users without a third-party trust or intermediary. A DEX is equivalent
    to using a public pay phone. The payphone has no log or audit information about
    the person using it, and if you put a quarter into the phone, it has no way to
    trace back the owner of the funds. It’s merely a public service that does not
    contain any personal information about the use of its service.


    Therefore, these platforms cannot divulge anything about the people using them
    to execute transactions.


    ## BLOCKCHAIN SECURITY: 51% ATTACKS


    The main concern of most blockchains is preventing a 51% attack. A 51% attack
    may occur if a person or group works together to corrupt, undermine, or destroy
    a blockchain by disrupting its operations. For a 51% attack to succeed, the people
    attacking the blockchain must control 51% or more of the network’s full nodes.


    It is increasingly improbable that an active blockchain with many users will fall
    to a 51% attack. It is doubtful because a 51% attack is costly to launch, coordinate,
    and execute. Furthermore, acquiring the full nodes will require the hacker to
    purchase expensive computing equipment, stake native tokens for some time, and
    behave accordingly to gain access to the full node. Once the hacker has access
    to the full node, they must simultaneously attack the network and spread their
    malicious conduct. Furthermore, the attack must come from different blockchain
    regions, not just one section or area. Plus, the watchdogs, who look for suspicious
    or malicious conduct, would have to be a part of this plan. If the watchdogs are
    not part of the plan, at least one of them will likely realize something is wrong
    and alert the network operators. Such heightened alertness within the group of
    network operators would terminate any chance of a 51% attack being successful.


    Then there are the full node operators who are not part of the 51% attack. They
    may realize something is amiss and alert the watchdogs and other operators to
    understand what’s happening on the network. And this, too, would terminate a 51%
    attack.


    The final reason why a 51% attack is unlikely is that it would come at a high
    personal cost to anyone invested in the network or who has purchased the network’s
    native tokens. Besides paying for the equipment to operate full nodes, staking
    crypto tokens to manage the nodes and bribing people to look the other way during
    the attack would mean the attackers would be losing all the money they invested
    in that network.


    For blockchains like Ethereum and Bitcoin, the cost of a 51% attack would be astronomical.
    Furthermore, if the watchdogs or node operators capture the hackers, the penalty
    would most likely be losing any stake in cryptocurrencies and being banned from
    the network.


    In addition, the crypto community will ban the hacker and make him unable to participate
    in other blockchain projects.


    ## CONSENSUS ALGORITHMS


    A consensus algorithm is a protocol a blockchain uses to check information on
    its transactions and ensure that all the data is correct.'
