- raw: 'Note that if you have noticed that the community focuses on hyping the token
    and driving demand for it, you should be wary of it. Scammers hyping tokens is
    commonly done in pump-and-dump schemes and other scams that seek to drive up a
    token’s value so that a small group of investors who hold a large number of tokens
    can sell them for a price higher than justified by the market. These scams only
    reward those who cash out before the bottom drops out of the market. People who
    buy the token after it significantly increases in value or who don’t sell before
    its market price drops tend to lose money or make very little profit from investing.


    *   Follow the Money


    Before investing in a token, research who holds the majority of the tokens. If
    the founders and development team plan for the project to increase in value, be
    a long-term investment, and have a large community, then they need the public
    to own the bulk (greater than 50%) of the tokens.


    Stay away from tokens and projects where the founders, development team, and big
    investors own most of the tokens. If the public owns only 30% of the tokens, then
    the project stakeholders will likely dump the tokens when their value rises to
    a certain level. In addition, if the founders and development team require investors
    to exchange high-value tokens for their newly launched token, it may be a scam.
    After enough investors have exchanged their Bitcoin, Ether, XRP, etc., for the
    new token, the project operators can shut the project down and disappear with
    the high-value tokens. Unfortunately, in such cases, the investors are left holding
    worthless tokens and have no way to get any justice.


    *   The Usefulness of the Token


    Tokens with a long-term market future must be helpful. The tokens should serve
    some unmet needs in the crypto market. If the token dominates the niche it was
    designed to fill, there will be a need and demand for it. Furthermore, what is
    unique about the token and its blockchain will enable it to develop a strong market
    position and maintain it.


    For example, Ether was created to be used in transactions, held for value, and
    as a reward. Moreover, as the Ethereum blockchain has evolved to host NFTs, smart
    contracts, and DeFi transactions, the value and demand for Ether have continued
    to rise. Plus, Ether’s development team and founders continue to push for Ether
    to be competitive against later developed blockchains and crypto tokens.


    Finally, later, blockchain developers developed tokens and blockchains that were
    Ethereum-compatible so that their users could benefit from the new innovative
    blockchain and not lose the benefits of having access to the Ethereum blockchain.
    Thus, it is clear that holding Ether as a long-term investment makes sense.


    ## HOW TO HODL


    If you plan on HODLing your way to being a millionaire or creating multi-generational
    wealth, you must approach it with the proper mindset. In this section, I list
    things you must do to have a wealth-building mindset as a crypto investor.


    ## THINK LONG-TERM


    Remember, this is a long-term investment strategy and not a get-rich-quick scheme.
    The real secret here is time in the market. Your investment in technology will
    service masses of people and create compounded value yearly. So, what you give
    now might pay you back 10-fold, 100-fold, or even 1,000-fold in the future.


    ## YOU MUST PLANT THE SEEDS OF WEALTH


    Your initial investment in cryptocurrency is like planting a seed, letting it
    take root, and reaping the rewards of its growth over time.


    ## HODL-WORTHY CRYPTOCURRENCIES


    Below are several cryptocurrencies that are HODL-worthy, meet the criteria that
    score very high on our fundamental analysis, and are poised for the massive multiplier
    effect for long-term investing. Please follow the link at the beginning of the
    book for our free gift. The report provides an in-depth analysis of these phenomenal
    cryptocurrencies and the unique qualities of their revolutionary blockchains.


    *   Bitcoin Cash (BCH)


    *   Cardano (ADA)


    *   Theta (THETA) & Theta Fuel (TFUEL)


    *The information in this book references an opinion and is for informational purposes
    only. Market understanding, appropriate asset allocation, experience, and knowledge
    are prerequisites for proper investing.*


    *In any market, especially the digital asset market, it is essential to understand
    the risks and dynamics of your investments. It is also important to understand
    these risks on a level at which you can protect your assets. If you are unaware
    of this information or unsure of how to protect your investment, please seek professional
    investment advice.*


    *To ensure your long-term success and survival in the financial markets, please
    do not overexpose yourself, and remember to be aware of your risk tolerance.*


    ## DOLLAR-COST AVERAGE YOUR WAY INTO HODLING


    Since HODLing is playing the long game and not about getting rich overnight, your
    strategy is to dollar-cost into the blockchain you have chosen to invest.


    What is dollar-cost averaging? *Forbes* magazine defines it as “a strategy to
    manage price risk when buying stocks, exchange-traded funds (ETFs), or mutual
    funds. Instead of investing in a particular security at one time, with a single
    purchase price, with dollar-cost averaging you divide up the amount of money you’d
    like to invest and buy small quantities over time at regular intervals. This decreases
    the risk that might pay too much before market prices drop.”^(17)


    The strategy is to buy into your HODL-worthy crypto at intervals in small quantities
    and not to time your way into the market. When the market has dipped, buy in a
    little more; when there are significant dips, buy even more. But always remember
    that this is money you can afford to lose or money you don’t need for any reason
    immediately.


    ## BE PREPARED TO RIDE OUT THE HIGHS AND LOWS


    The crypto market is highly volatile. If you want to reap the rewards of HODLing,
    you must stay on the course during the market volatility and do nothing while
    you watch your token’s market value steeply rise or fall. But being steadfast
    in the investment strategy is based on sound research, as discussed earlier. Because
    the crypto market is not connected to the fundamental world market’s volatility,
    it is difficult to time and predict. In short, have an investment strategy for
    each token you purchase and stick to it unless market conditions or other factors
    merit changing your plans for it. Remember, you base your success on your decisions
    about when to buy in and sell. Therefore, your success is ultimately your responsibility.


    ## CASH ON HAND


    Keep 20% of your investment capital in fiat currency (e.g., USD, EUR, GBP) for
    buying tokens during dips in the market or when other great opportunities come
    along.


    ## SELL TARGETS FOR PROFIT-TAKING


    Set your sell targets and stick to them. Remember, you base your sell targets
    on the financial goals you are trying to achieve (e.g., paying off debts, tuition).
    Don’t make the targets too outrageous (e.g., a billion dollars, buying an NBA
    team).'
