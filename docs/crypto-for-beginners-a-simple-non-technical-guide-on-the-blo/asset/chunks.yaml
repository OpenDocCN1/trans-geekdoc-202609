    # Chapter 9: Your Guide on Cryptocurrency Taxes


    ## Take-Home Message

    *The IRS expects crypto investors to pay taxes on their crypto investments. Although
    the tax reporting requirements, taxation, and tax triggers are still being developed,
    you are, by law, to report on your crypto assets, holdings, and liquidation.*


    Information presented in this chapter is not tax advice but tax education. This
    beginner’s guide to crypto investing can only give you the basics to begin your
    crypto investing journey. In this chapter, you will review the basics of crypto
    taxation and what you must do to be tax compliant in the US. As with anything
    essential, you should seek tax guidance from a tax lawyer, tax accountant, or
    tax preparer who has experience working with cryptocurrency.


    ## The Internal Revenue Service and Crypto Taxation

    The Internal Revenue Service (IRS) (AKA Uncle Sam) wants its share of your crypto
    profits. Fortunately, you can deduct your crypto losses from your capital gains
    and income taxes. The highest capital gains tax you will pay is 20%, and the maximum
    income tax you will pay is 37%. Although some tax guidelines regarding crypto
    are clear, others are vague. For example, it is unclear whether the IRS will tax
    certain transactions (e.g., `DeFi protocols`) shortly.


    ## With Cryptocurrency Comes Tax Liability

    [content]

    Cryptocurrency provides you with a tremendous opportunity to accumulate immense
    amounts of wealth. But unfortunately, it can also have you end up in tax audits
    and pay enormous fees for not paying your taxes.


    As with all investments, the IRS wants its cut of your wealth and to know about
    your assets. To properly report this information, you must keep records of everything
    you do with your crypto accounts (e.g., buying, selling, trading, staking, mining).
    Furthermore, you may even opt to do your taxes using crypto tax software.


    Your cryptocurrency, crypto wallets, crypto transactions, and crypto investments
    are not part of an organized system that produces tax statements or forms or has
    a built-in accounting system.


    Part of building your wealth and avoiding problems with the IRS is keeping records
    of your crypto transactions, holdings, and investments. To do this, you must set
    up an organized system in which you can input information about your crypto investments.


    If you are organized, have a sound system in place, record all your transaction
    data, and have a clear view of your portfolio, you will do OK during tax time
    and not lose money due to incorrectly reporting your taxes.


    ## Crypto Tax Basics

    You are required to pay taxes on your crypto gains and be permitted to deduct
    your losses from your income and investment gains. Currently, the IRS has no way
    to track your crypto tax liability fully. However, it is still possible for the
    IRS to know how much money you earn from crypto investments.

