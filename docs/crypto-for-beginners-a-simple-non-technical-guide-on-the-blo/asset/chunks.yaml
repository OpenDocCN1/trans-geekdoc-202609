  trans: '


    对于传统的股票投资，如果你想在亏损卖股时进行税收扣除，你不能在 30 天内卖出该股票并以更低的价格买回。同样，如果你在 30 天内买回了你亏损卖出的同一股票，你将被不允许从税款中扣除该损失。


    在加密资产方面，美国国税务局（IRS）尚未禁止在 30 天内亏损出售加密货币并在价格较低时买回相同的加密货币代币。然而，如果你这样做，IRS 可能会对你进行审计。如果
    IRS 审计了你并认定你的加密货币交易缺乏“经济实质”，那么你将无法使用这些扣除项来抵消你的税务义务。


    最终，你必须决定是否愿意为了在卖出亏损代币后不到 30 天内买回该代币而承担 IRS 审计的风险——或者你是否准备好放弃在不到 30 天内买回亏损卖出的加密货币可能获得的潜在利润。


    ## 短期与长期资本利得税率表


    ### 短期资本利得定义

    短期资本利得是指获得资产后不足一年即出售所获得的利润，并按普通收入征税。例如，日内交易者持有加密货币代币不足一年的所获利润将按常规收入征税。


    如果你对加密货币代币的处置符合短期资本利得/损失的定义，那么它将视视为普通收入。因此，你应该将这些收益/利润加入你的普通收入，并从你的普通收入中扣除损失。


    2021 年和 2022 年的联邦普通税率表列如下。


    ### 长期资本利得定义

    长期资本利得是指持有一年或以上后出售的资产（例如：兑换为法币、交易或用于支付商品和服务）。根据你纳税年度的普通收入税率档和资本利得情况，它们将按 0%、15%
    和 20% 的税率征税。


    长期资本利得税率表列如下。


    只有当纳税人的普通收入和资本利得少于 0% 税率档列出的最高金额时，才适用 0% 的税率。


    ### 通用加密货币税务信息

    * 所有属于应税事件的加密交易都必须向 IRS 报告。

    * 当你在钱包之间转移加密货币、持有（HODL）加密货币、向 501(c)(3) 慈善机构捐赠加密货币、赠加密货币（适用某些条件）或使用法币购买加密货币时，你不需要为这些交易纳税。

    * 所有在美国获得许可的主要加密交易所必须对其平台用户完成了解您的客户（KYC）协议。

    * 当你使用法币购买加密货币代币时，加密交易所会收集并存储你的银行信息。

    * 当你将加密货币代币转入交易所的托管加密钱包时，加密交易所会将托管加密货币钱包与其所有者进行匹配。

    * 许多加密交易所正在向 IRS 及其平台用户发送 1099 表格。

    * IRS 将加密货币代币视为财产。当你出售、交易或使用加密货币支付商品和服务时，你必须对这些交易纳税，并且必须支付资本利得税和所得税。

    * IRS 在针对几家加密交易所的诉讼中胜诉（例如 Kraken、Poloniex、Coinbase）。法官在这些案件中裁定，加密交易所必须与 IRS 共享其平台用户的数据。


    ## 通用加密货币税务报告基础


    在确定你纳税年度的税务责任时，你必须小心执行以下操作：

    * 仔细检查你每笔加密交易详情。

    * 了解每个加密货币代币的成本基础（原始购买价格）。

    * 了解每个加密货币代币的公平市场价值（FMV）。

    * 计算在处置每个加密货币代币时是赚了钱还是遭受了损失。

    * 识别每笔交易应分配为长期或短期资本利得/损失。

    * 填写正确的税务表格并将其提交给 IRS（附带所需的证明文件）。

    * 将你的加密货币记录保留至少 6 年，因为 IRS 可以在你报税后对你进行长达 6 年的审计。


    ### 确定加密货币代币的成本基础

    代币的成本基础是你获得代币当日的成本。如果你通过加密投资获得了奖励的加密货币（例如：空投），那么你必须使用该代币在授予时的 `FMV`。对于被赠送或捐赠给你（或你的组织）的代币，你应该使用原始加密货币代币持有者记录的成本基础，或赠送/捐赠给你当天该加密货币代币的
    `FMV`。


    请注意，你对加密交易只能使用一种会计方法。加密货币持有者最常用的会计系统类型是先进先出（`FIFO`）、后进先出（`LIFO`）、高进先出（`HIFO`）和指定日期法。


    请咨询税务会计师、律师或税务专业人士（例如：税务申报、记账员）。他们可以解释各种方法的优缺点。


    为了方便记录加密交易，请确定交易应按资本利得还是普通收入征税，并提交相应的税务表格。


    ## 缴纳加密货币税

    加密货币税在你缴纳年度税时缴纳。但假设你受到其他税务安排（例如：海外纳税人），在这种情况下，你应该咨询会计师或律师了解如何缴纳加密货币税。税务专业人士可以帮助你避免欠交税务义务而产生的罚款和利息。


    ## 你需要的税务表格


    ### 8949 表

    * 适用人群：在财年内有资本利得或亏损的纳税人。

    * 所需信息：必须输入所有加密处置数据。你需要将数据分为短期和长期持有期。


    ### D 表（1040 表）

    * 适用人群：在财年内有资本利得或亏损的纳税人。

    * 所需信息：该表汇总了 `8949 表`，并包含了当年的短期和长期资本利得/损失。


    ### 1 表（1040 表）

    * 适用人群：在财年内从加密货币获得某种形式收入的纳税人。

    * 所需信息：在表格第 8 行输入你的加密交易总收入。


    ### FBAR（海外银行和金融账户报告）

    * 适用人群：在财年内任何时间，非美国交易所的法币或特定外国金融资产总价值超过 10,000 美元的纳税人必须提交 `FBAR`。

    * 所需信息：必须输入外国账户详情以及你在财年内内的最高法币价值。


    ### FATCA（海外账户税务合规法）

    * 适用人群：在财年最后一天法币或特定外国金融资产价值超过 50,000 美元，或在财年内任何时间在非美国交易所超过 75,000 美元的纳税人。

    * 所需信息：必须输入外国账户详情，以及你在财年内的最高法币价值和期末余额。


