    FOMO，或“错失恐惧症”，驱动了大量的加密货币投资。大多数投资者梦想通过购买加密货币代（例如 `Bitcoin`、`Ether`、`Dogecoin`、`Shiba`）将几千美元变成数百万。这是一种强大的驱动力，随着普通人成为加密货币投资者，它导致了一些受害者，并可能引发巨大的混乱。


    ## FOMO 为诈骗者和欺诈者创造了完美猎物

    加密货币诈骗者和欺诈者从 FOMO 中获取巨额利润，他们推销庞氏骗、金字塔骗、地毯攻击（rug pulls）、拉高出货（pump and dump）、推广计划和其他欺诈方案。遗憾的是，人们不想被排除在活动之外。这种欲望会让他们抛弃顾虑，利用有限的知识做出错误的决定。


    ## FOMO：经济不确定性的虚假良药

    FOMO 本质上是一种群体心理，它剥夺了投资者做出明智决策的正确心态。FOMO 迫使普通投资者在不理解区块链技术的情况下进行加密货币投资。在这些动荡和全球低迷的时期，人们正在寻找替代收入来源来支持自己、资助退休，并为后代留下什么。


    ## FOMO 迫使普通投资者进行不负责的投资

    当普通人读到加密货币投资者还清了房贷、贷款和信用卡债时，他们也想获得赚那种钱的机会。遗憾的是，大多数进入加密货币市场的普通投资者并不了解风险，没有仔细研究他们的投资，也没有明确的投资策略和目标。简而言之，他们是寻找易于猎物的老练诈骗者和欺诈者的完美受害者。此外，许多人甚至负债投资加密货币（例如从银行取款）。遗憾的是，信贷投资是一种禁忌策略，因为加密货币投资者可能随时失去所有投资资金。现在，遗憾的是，我们看到投资者冒着损失退休资金和支付生活费用能力（例如房贷、公用事业）的风险，换取可能获利的机会。


    ## FOMO 降低了投资者的抑制力

    FOMO 降低了投资者做出风险决策的抑制力。作为 FOMO 的反应，他们更有可能做出冲动决定，承担超出承受能力的风险，并参与缺乏理性推理的行为。因此，虽然加密货币爱好者对越来越多的人购买加密货币感到兴奋，但人们非常担心新投资者正在冒过度的储蓄风险。新手和缺乏经验投资者无法在极端遗憾的情况下放弃他们的加密货币损失，并在不负责任地参与加密货币市场。


    ## 击败 FOMO

    要击败 FOMO，你必须接受你无法抓住每一个加密货币浪。你必须承认加密货币投资是赌博，市场和其他所有投资者一样存在风险，而且最好的投资计划和策略并不有效。尽管如此，你不能仅仅盲目跟随他人，因为他们看起来表现良好并精通市场。接受你必须考虑投资目标和里程碑，做出经过充分推理和仔细研究的决定以击败
    FOMO。对于加密货币投资者要成为百万翁并创造跨代财富来说，YOLO（人生只有一次）和 *carpe diem*（及时行）也不是你应该拥抱的投资口号。


    ## 决定行动

    信息的质量和来源声誉取决于你的感知。当建议是免费的时，人们往往会忽视它而不采取行动。然而，当他们必须牺牲时间、金钱和能量来获取时，它就会变得更有价值，人们更有可能采取行动并赋予其巨大的价值。因此，当你投入某事中时，你更有可能付诸行动。


    此时，你已经投入了时间、金钱和思想来学习加密投资以及如何创造跨代财富。然而，为了完成实现目标的之旅，你必须做一件事：


    **现在就行动！！！**


    # 第 9 章：你的加密货币税务指南


    ## 核心信息

    *美国国税局（IRS）期望加密货币投资者对其加密货币投资交税。虽然税务报告要求、征税和税务触发因素仍在完善中，但根据法律，你需要报告你的加密货币资产、持仓和清算情况。*


    本章提供的信息税务建议，而是税务教育。本加密货币投资入门指南只能为你提供开始加密货币投资之旅的基础知识。在本章中，你将回顾加密货币税收的基础知识，以及在美国为了税务合规你必须做的事情。与其他任何重要事项一样，你应该寻求具有处理加密货币经验的税务律师、税务会计师或报税人员的税务指导。


    ## 美国国税局与加密货币税务

    美国国税局（IRS）（又称老山姆）想要从你的加密利润中分一杯。幸运的是，你可以从资本利得和所得税中扣除加密货币损失。你将支付的最高资本利得税为 20%，支付的最高所得税为
    37%。虽然某些关于加密货币的税务指南是清晰的，但其他是模糊的。例如，目前尚不清楚 IRS 短期内会对某些交易（例如 `DeFi protocols`）征税。


    ## 加密货币带来了税务义务

    [content]

    加密货币为你提供了积累巨大财富的极大机会。但遗憾的是，它也可能让你陷入税务审计，并因为未缴税而支付巨额费用。


    与所有投资一样，IRS 想要从你的财富中分一杯羹并了解你的资产。为了正确报告这些信息，你必须记录你在加密货币账户上进行的一切（例如：购买、卖出、交易、质押、挖矿）。此外，你甚至可以选择使用加密货币税务软件来报税。


    你的加密货币、加密钱包、加密交易和加密货币投资并不属于一个能产生税务报表或表格或具有内置会计系统的组织系统。


    建立财富并避免与 IRS 产生问题的部分在于记录你的加密货币交易、持仓和投资。为了做到这一点，你必须建立一个有组织的系统，可以在其中输入有关加密货币投资的信息。


    如果你组织良好，有一套完善的系统，记录所有的交易数据，并对投资组合有清晰的了解，你在报税期间会表现良好，且不会因为错误报告税务而亏钱。


    ## 加密货币税务基础

    你有义务对你的加密货币收益纳税，并允许从收入和投资利得中扣除损失。目前，IRS 无法完全追踪你的加密税务义务。然而，IRS 仍然可能知道你从加密货币投资中赚了多少钱。


