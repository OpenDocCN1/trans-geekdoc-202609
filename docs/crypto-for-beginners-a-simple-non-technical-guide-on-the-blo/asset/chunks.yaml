- raw: 'For traditional stock investments, if you want to take a deduction for selling
    your stocks at a loss, you cannot sell the stock and repurchase it at a lower
    price within 30 days. Likewise, if you buy back the same stock you sell at a loss
    within 30 days, you will not be allowed to deduct the loss from your taxes.


    In the case of crypto assets, the IRS has not banned selling crypto at a loss
    and rebuying the same crypto tokens when the price is low within a 30-day period.
    However, if you do this, the IRS can audit you. If the IRS audits you and the
    IRS decides that your crypto transactions lack “economic substance,” then you
    will not be allowed to use the deductions to offset your tax obligations.


    Ultimately, you must decide if you are willing to risk an IRS audit because of
    repurchasing the crypto tokens you sold at a loss less than 30 days after you
    sold them—or whether you are ready to forego the potential profit you could earn
    by rebuying the crypto you sold at a loss in less than 30 days.


    ## SHORT-TERM VS. LONG-TERM CAPITAL GAINS TAX SCHEDULE


    *Short-Term Capital Gains Definition*


    Short-term capital gains are profits from assets sold less than a year after you
    acquired them and taxed as ordinary income. For example, profits earned by day
    traders who hold their crypto tokens for less than a year are taxed as regular
    income.


    If disposal of your crypto tokens qualifies as a short-term capital gain/loss,
    then it will be treated like ordinary income. Therefore, you should add the gains/profits
    to your ordinary income and deduct the losses from your ordinary income.


    The federal ordinary tax schedules for 2021 and 2022 are listed below.


    *Long-Term Capital Gains Definition*


    Long-term capital gains are assets that are sold (e.g., redeemed for fiat currency,
    traded, or used to pay for goods and services) after being held for a year or
    more. They are taxed at 0%, 15%, and 20%, depending on your ordinary income tax
    bracket and capital gains for the tax year.


    The long-term capital gains tax schedules are listed below.


    The 0% tax rate only applies if the taxpayer’s ordinary income and capital gains
    are less than the maximum amount listed in the 0% tax bracket.


    **General Crypto Tax Information**


    *   All crypto transactions that are taxable events you must report to the IRS.


    *   When you transfer crypto between wallets, HODL crypto, donate crypto to a
    501(c)(3) charity, give crypto as a gift (some conditions apply), or buy crypto
    with fiat currency, you are not required to pay taxes on those transactions.


    *   All major crypto exchanges licensed in the US must complete Know Your Customer
    (KYC) protocols on their platform users.


    *   Crypto exchanges collect and store your banking information when you buy crypto
    tokens using fiat currency.


    *   Crypto exchanges match custodial crypto wallets to their owners when you transfer
    crypto tokens into your custodial wallets at the exchange.


    *   Many crypto exchanges are sending 1099s to the IRS and their platform users.


    *   Crypto tokens are considered property by the IRS. When you sell, trade, or
    use crypto to pay for goods and services, you must pay taxes on the transactions,
    and you must pay capital gains and income taxes.


    *   The IRS has won lawsuits against several crypto exchanges (e.g., Kraken, Poloniex,
    Coinbase). The judges in those cases ruled that the crypto exchanges had to share
    their platform users’ data with the IRS.


    ## GENERAL CRYPTO TAX REPORTING BASICS


    When determining your tax liability for the tax year, you must be careful to do
    the following:


    *   Carefully review the details regarding each of your crypto transactions.


    *   Know the cost basis (original purchase price) of each crypto token.


    *   Know the fair market value (FMV) of each crypto token.


    *   Calculate whether you earned a profit or suffered a loss when you disposed
    of each crypto token.


    *   Identify whether each transaction should be allocated as a long-term or short-term
    capital gain/loss.


    *   Fill out the correct tax forms and file them with the IRS (with the required
    supporting documentation).


    *   Keep your crypto records for at least 6 years, because the IRS can audit you
    for up to 6 years after filing your taxes.


    *Determining the Cost Basis of a Crypto Token*


    The cost basis of a token is its cost to you on the day you acquire the token.
    If you have cryptocurrencies awarded to you (e.g., airdropped) from your crypto
    investments, then you must use the FMV of the token at the time it was awarded.
    For tokens that were gifted or donated to you (or your organization), you would
    use the cost basis recorded by the original crypto token holder or the FMV of
    the crypto token the day it was gifted/donated to you.


    Please note that you can only use one accounting method for crypto transactions.
    The types of accounting systems most often used by crypto holders are First In
    First Out (FIFO), Last In First Out (LIFO), Highest In First Out (HIFO), and specified
    date of acquisition.


    Please consult with a crypto tax accountant, lawyer, or crypto tax professional
    (e.g., tax preparer, bookkeeper). They can explain the advantages and disadvantages
    of each type of accounting method.


    To make it easier to record your taxable crypto transactions, determine whether
    the transactions should be taxed as capital gains or ordinary income, and file
    the appropriate tax forms.


    ## PAYING CRYPTO TAXES


    Your crypto taxes are due when you pay your annual income tax. However, suppose
    you are subject to another tax arrangement (e.g., overseas taxpayers). In that
    case, you should consult a tax accountant or lawyer to determine how you should
    pay your crypto taxes. A crypto tax professional can help you avoid potential
    penalties and interest due to you being delinquent on your tax obligations.


    ## TAX FORMS YOU NEED TO KNOW


    *Form 8949*


    *   **Who Files:** Taxpayers who have capital gains or losses during the financial
    year.


    *   **Information Needed:** Must enter all crypto disposal data. You must separate
    the data into short-term and long-term holding periods.


    *Schedule D (Form 1040)*


    *   **Who Files:** Taxpayers who have capital gains or losses during the tax year.


    *   **Information Needed:** The form summarizes Form 8949 and contains the total
    short-term and long-term capital gains/losses for the tax year.


    *Schedule 1 (Form 1040)*


    *   **Who Files:** Taxpayers who have received some form of income from cryptocurrencies
    during the tax year.


    *   **Information Needed:** Must enter your total additional income from crypto
    transactions on Line 8 of the form.


    *FBAR (Report of Foreign Bank and Financial Accounts)*


    *   **Who Files:** Taxpayers with fiat currency or specified foreign financial
    assets worth more than $10,000 in combined value in non-US exchanges at any time
    during the tax year must file FBAR.


    *   **Information Needed:** Must enter details about your foreign exchange accounts
    and the maximum fiat value you had on them during the tax year.


    *FATCA (Foreign Account Tax Compliance Act)*


    *   **Who Files:** Taxpayers with fiat currency or specified foreign financial
    assets worth more than $50,000 on the last day of the tax year or more than $75,000
    at any time during the tax year in a non-US exchange. Note that this form is only
    needed if you hold fiat currency during the tax year. You don’t need to file this
    form if all your crypto transactions are done using crypto tokens and stablecoins.


    *   **Information Needed:** Must enter details about your foreign exchange accounts
    with information about the maximum value of fiat currency and ending balance during
    the tax year.


    ## FILING YOUR CRYPTO TAXES'
