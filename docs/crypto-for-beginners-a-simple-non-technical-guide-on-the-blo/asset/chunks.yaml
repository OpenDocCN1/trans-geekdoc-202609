    和花园社区的区块链构建者们决定，帮助詹姆斯的方法是在成员的后院建立一个市场，可以在那里交易和储存蔬菜。随后，詹姆斯带着 100 磅蔬菜来到市场，作为回报，他获得了
    100 个花园币。


    **詹姆斯仍然不开心；他拿着 100 个花园币能做什么呢？**


