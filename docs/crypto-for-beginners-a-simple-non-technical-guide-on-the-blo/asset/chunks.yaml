    garden. However, James didn’t understand a thing about technology and didn’t want
    to run a `node`. So, Liam and the garden community blockchain builders decided
    the way to help James was to build a marketplace in a member’s backyard where
    veggies could be traded and stored. James then brought his 100 lbs. of veggies
    to the market, and in return, received 100 garden coins.


    **James was still upset; what could he do with 100 garden coins?**


    At the market, James thought Liam cheated him by only giving him 100 digital garden
    coins—basically invisible coins, he thought—while he had traded in his 100 lbs.
    of vegetables. So, after voicing his opinion at the market, Lucas the composter
    went to James and said, “I’ll give you 100 lbs. of compost in exchange for your
    garden coins.” James, an avid gardener, loved growing but didn’t like the composting
    business because he wasn’t fond of dealing with worms and rotting foods. So, James
    quickly agreed and made the transaction with Lucas. Lucas then used his garden
    coins at the market to buy fruits and veggies for his family and grandkids.


    **The blockchain solves problems for the Wholesome Bounty Gardeners.**


    In closing, we can see how the unique qualities of the blockchain can facilitate
    and assist in creating a store of value or wealth and exchange of this value peer-to-peer
    without a third-party trust profiting. We can see how the WBG Gardeners blockchain
    keeps evolving and expanding to fit the community’s needs.


