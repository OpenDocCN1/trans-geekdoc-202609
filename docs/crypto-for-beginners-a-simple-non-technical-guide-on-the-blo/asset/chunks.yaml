    ## FREEDOM FROM BIG BROTHER


    Satoshi Nakamoto 于 2009 年创建比特币是为了让财富积累更民主化。**实现这种民主化的最好方式是**：当大监视者（Big Brother）在旁观察时，**排除政府银行为个人提供服务**，这给个体追求自身利益或破坏现状的人造成困难；而通过加密货币完全去除这一约束。


    中间商机构不调控 **crypto** 的交易、**investments**、**redemption tokens**、跨国移动等活动。这种灵活性为超越传统金融带来了无拘一物的机会——其他人必须面对高额费用、繁琐监管、错失良機以及欺诈分子慢速运作等问题。


