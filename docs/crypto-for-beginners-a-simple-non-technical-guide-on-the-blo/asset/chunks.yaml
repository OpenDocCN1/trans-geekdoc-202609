- raw: 'If the token has had an initial coin offering (ICO) or is planning one, then
    carefully consider the percentage of tokens owned by the founders, development
    team, and outside investors. If the public does not own the majority of the tokens,
    then that is a red flag that the token’s creators don’t have faith in it and that
    they don’t believe that the token will have value over time (i.e., for several
    years). 


    When the public does not hold the majority of the tokens or only a few people
    own them, the token’s value can be easily manipulated and quickly dumped for a
    profit after the token has increased in value. Token issuers who think their token
    has value and a profitable future have a minority of the tokens distributed to
    the founders and development team. They spread the bulk of the tokens to the public
    through different offerings, so current stakeholders cannot buy them up (for the
    most part) before the general public can purchase the tokens in circulation.


    *   Brand


    Brand refers to the reputation of the token or its blockchain. If a brand is well
    known and has a good reputation, then its value will likely be higher than is
    justified by its market characteristics and project potential.


    Brand sentimentality can cause people to buy and hold a token with limited use,
    poor development, and lacking uniqueness (e.g., DOGE, SHIB). Therefore, if you
    are considering investing in these coins, you should know how much the token’s
    market value depends on people’s sentimental feelings. 


    *   Brand Strength: DOGE and Bitcoin


    DOGE’s market value depends on its community’s emotional attachment to the token.
    Although the token may never rise again to the price levels it hit in the first
    quarter of 2021, its holders are content to hold it and continue investing in
    their financial resources. Another example is Bitcoin, which crypto enthusiasts
    are eager to invest in even if they know little about it. 


    For both tokens, their brands are so strong that they continue to attract investors
    despite investors not having carefully studied them or their long-term potential.
    Like Coca-Cola, Pepsi, Amazon, Nike, Intel, and Apple, these brands drive customer
    loyalty, and people invest in them simply because of the strength of the brand.


    *   Community Support and Engagement


    When evaluating the value of a token and its future growth potential, its community
    support and engagement are key factors in determining its actual value and potential.
    An active, engaged, and growing online community is critical to the mass adoption
    of a crypto token. Without mass adoption or a growing adoption of a crypto token,
    the token is not likely to increase in value, liquidity, or accessibility.


    A token community’s chatter drives interest and demand for the coins. When interest
    and need in cryptocurrency are high, other potential investors/traders will take
    interest and invest in the token. In addition, crypto and blockchain project developers
    are more likely to create a project or app that incorporates cryptocurrency into
    their projects and apps.


    *   Market Characteristics: Niche, Size, Regulation


    When estimating a token’s potential growth in value, you must consider the size
    of the market, the market valuation, the uniqueness of the market, and how regulation
    affects its operation. For example, if you can easily substitute other tokens
    for the particular coin of your interest, the coin’s niche is too general and
    heavily regulated, so there probably won’t be high demand for it. On the other
    hand, if the request or need for the token is low, you should not expect its market
    value to climb very high. 


    *   Financial Statements


    Investors/traders using FA will also review the crypto token issuing company’s
    balance sheet, income statement, and cash flow statement. 


    *   Balance Sheet


    The balance sheet records a company’s assets, liabilities, and equity. The company
    controls corporate assets, which include cash, inventory, machinery, and buildings.
    The company’s liabilities include short- and long-term loans, corporate bonds,
    and other types of corporate debt. Equity consists of the corporate shares owned
    by the company.


    *   Income Statement


    A corporate income statement includes a report on the company’s earnings and expenses
    over a set period and the business’s profit. The company can use it to assess
    the efficiency of the company in generating revenue and profits from its operations
    and money invested in its operations. 


    *   Statement of Cash Flow


    This statement is a record of the company’s cash inflow and outflow over some
    period of time. This statement includes information on the following:


    1.  Cash from Investing (CFI) – Cash is used to acquire assets and the proceeds
    from selling other assets (e.g., equipment, buildings, businesses).


    2.  Cash from Financing (CFF) – Cash proceeds from the issuance and borrowing
    of funds. 


    3.  Operating Cash Flow (OCF) – Cash proceeds from the day-to-day business operations.


    ## WHITE PAPER REVIEW


    Most, if not all, of the information listed in the FA section should be in the
    crypto token’s white paper. If the white paper does not have this information
    and the development team hasn’t issued press releases with the information, you
    should be wary of investing in the token. 


    You must decide whether the crypto project looks legitimate or is just one of
    the thousands of crypto scams separating investors from their money. A poorly
    written white paper does not indicate that a crypto project will fail. On the
    other hand, a perfectly written white paper does not guarantee that a crypto project
    will succeed. 


    *White Papers and Fake Initial Coin Offerings *


    Be aware that initial coin offerings (ICOs) and other public token offerings are
    trendy ways of scamming beginning and inexperienced crypto investors out of money.
    The white papers produced by the scammers and fraudsters look very appealing,
    generally have terrific graphics, and often are copied from other projects. The
    key to figuring out which crypto and blockchain projects are fake and authentic
    is to look at the project’s technical parts, funding, token distribution, online
    community, completed milestones, and long-term plans.


    Fake ICOs tend to:


    *   Be thinly funded


    *   Lack an active and engaged online community


    *   Have huge gaps in information about their technical inner workings


    *   Distribute the majority of the tokens to people involved in the project


    *   Not have completed any substantive milestones


    *   Have a short-term outlook


    These are their primary weaknesses because they don’t plan on the token increasing
    in value, being practical, or staying “alive” very long. So instead, they want
    to sell their token to the public and disappear with their investors’ funds.


    ## ON-CHAIN ANALYSIS


    When evaluating a blockchain, you should include several factors in your analysis
    of its revenue-generating potential and performance:


    1.  Number of Transactions – The transactions processed on the blockchain during
    specific periods indicate how active the blockchain is and the demand for its
    services. The total number of transactions will include transferring funds between
    crypto wallets, so you cannot accept this number at face value. 


    2.  Transactional Value – The value of funds transferred in a transaction or group.


    3.  Number of Active Addresses – Ways to count the number of active addresses
    vary. The easiest way to do this is to count the number of sending and receiving
    addresses within a set period. 


    4.  Transaction Fees – Look at the transaction fees the blockchain’s platform
    users pay. The higher the costs are bid up at auctions by large platform users,
    the more successful the platform is. '
