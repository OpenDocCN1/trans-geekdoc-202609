- raw: "Using your paper trading account or whatever way you choose to practice trading\
    \ and testing your trading strategies, focus on one or more of the following crypto\
    \ tokens:\n\n*   Bitcoin Native Token (BTC)\n\n*   Bitcoin Cash Native Token (BCH)\n\
    \n*   Ethereum Native Token (Ether)\n\n*   Polkadot Native Token (DOT)\n\n*  \
    \ Decentraland Native Token (MANA) \n\n*   Dogecoin Native Token (DOGE) \n\n*\
    \   Cardano Native Token (ADA)\n\n*   Tether Native Token (USDT)\n\n## BUILD YOUR\
    \ CRYPTO WEALTH NOW!\n\nYou have everything you need to develop and improve your\
    \ crypto trading skills. Get started today! When comfortable and confident with\
    \ paper trading, begin investing in crypto tokens. \n\nNote, don’t be a forever\
    \ paper trader! \n\nAt some point, you will have to commit to crypto trading and\
    \ invest your own money. \n\nIf you struggle to begin actively trading, set a\
    \ date for trading and invest a small amount of money in your trade. Eventually,\
    \ you must “rip the Band-Aid off” and expose yourself to the crypto market, for\
    \ better or worse.\n\n*Remember: With experience and (some) luck comes great opportunity\
    \ and wealth.*\n\n![](Images/image00171.jpeg)![](Images/image00168.jpeg)CHAPTER\
    \ 8 \n\n# STRATEGICALLY PROFIT FROM CRYPTOS AND THE KEYS TO CREATING YOUR MULTI-GENERATIONAL\
    \ WEALTH\n\n**Take-Home Message**\n\n*Crypto investors who want to become millionaires\
    \ and create multi-generational wealth must be disciplined, dispassionate, and\
    \ record-keeping investors to set goals, milestones, and market entry/exit strategies.\
    \ Overall, the best plan for accumulating wealth as a crypto investor is to invest\
    \ in crypto assets that are promising long-term.*\n\n## WHAT IS MULTI-GENERATIONAL\
    \ WEALTH?\n\nWhen you have achieved multi-generational wealth, it means that you\
    \ have built up a sizable fortune in savings and investments that is also resilient,\
    \ self-perpetuating, and, more importantly, secure. As a result, your children,\
    \ grandchildren, and great-grandchildren will benefit from the wealth you have\
    \ created in your lifetime. It’s the legacy you want to leave behind, knowing\
    \ that your grandchildren will benefit from your investments and hard work many\
    \ years later.\n\nNowadays, the average person can create multi-generational wealth\
    \ using the multiplier effect of crypto investing. The opportunities are still\
    \ abundantly available; in 2021, more than 68 cryptocurrencies increased their\
    \ values by more than 1,000%.^(15) This rare opportunity has not been available\
    \ to the average person for generations. However, creating multi-generational\
    \ wealth is not a get-rich-quick scheme. You must be in it for the long run; achieving\
    \ it requires staying the course and not letting your emotions trip you up.\n\n\
    For the first time in history, cryptocurrency has democratized the opportunity\
    \ to become a millionaire. Moreover, regarding wealth preservation, cryptocurrencies\
    \ can be foundational to keeping families’ fortunes intact and passing them on\
    \ to future generations. With a market cap of greater than $400 billion, there\
    \ are an estimated 18,000 new millionaires due to Bitcoin’s unparallel rise.^(16)\
    \ Furthermore, the rise of bitcoin may only be in its infancy and is happening\
    \ at a global scale, which means there is a rare opportunity to accumulate a massive\
    \ amount of wealth; historically, wealth transfers have happened mainly at regional\
    \ scales.\n\nDue to cryptocurrencies’ unguessable and hack-proof 256-SHA encryption\
    \ key—a secure hash algorithm (SHA) that transforms a string of data into precisely\
    \ 256 bits of data—cryptocurrencies are an incredible tool for securing generational\
    \ wealth because they are virtually impossible to confiscate. You can memorize\
    \ the secret seed phrase to generate your crypto wallet, and the seed phrase can\
    \ be handed down to future generations, perhaps even without a third-party trust.\
    \ Furthermore, the finite number of coins minted in specific cryptocurrencies\
    \ is a significant hedge against inflation. Can you imagine leaving 1 Bitcoin\
    \ for your grandkids and having that value accumulate over time to be worth $1\
    \ million or $5 million when they become adults? By storing your accumulated wealth\
    \ in cryptocurrencies, you have a better chance of safeguarding and growing your\
    \ family fortune and guarding against the rise of inflation for years to come.\n\
    \nKeep your wealth tree growing by making sure that it has deep roots. Deep roots\
    \ come from making sound investments in growth sectors with good return on investment.\
    \ Cryptocurrency, blockchain technology, and crypto-related industries are not\
    \ going away. They are evolving to fill unmet needs in different markets and to\
    \ more efficiently manage commercial transactions.\n\nNow, you are probably wondering\
    \ how viable cryptocurrency is as a long-term investment because its market rises\
    \ and falls suddenly with no apparent reason as to the cause of the market shifts.\
    \ Well, this happens in the stock market too. However, there are some potential\
    \ explanations for the stock market’s shifts because the stock market is tied\
    \ to real-world, tangible assets and services. It has been hard for most investors\
    \ to beat the stock market, despite the information available about companies\
    \ listed on stock exchanges and the 24/7 news broadcasts about every international\
    \ event that may affect it.\n\nWise investors know that when the market is in\
    \ turmoil and they are uncertain about what to do with their crypto investments,\
    \ they should do nothing. Your due diligence in selecting your crypto investments,\
    \ your studies of market activity, your (ideally) detachment from it, and your\
    \ predetermined investment exit plans will tell you what to do. But most of the\
