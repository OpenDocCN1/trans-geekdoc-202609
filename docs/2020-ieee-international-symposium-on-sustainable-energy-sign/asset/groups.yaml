    In this section, a proposed scheme has been implemented to improve the accuracy
    of classifying trustworthiness and spectrum sensing of SUs in CR. It also helps
    to detect malicious users and filter out host users of the total users.


    From this confusion matrix, it is assumed that each row and column represent as
    the actual output respectively. True Positive (TP) means the convergence between
    correctly predicted and actual positive instances. In the other hand, True Negative
    (TN), is the intersection between correctly predicted and actual negative instances.
    Similarly, False Positive (FP) and False Negative (FN) describes incorrect predicted
    output for negative and positive respectively.


