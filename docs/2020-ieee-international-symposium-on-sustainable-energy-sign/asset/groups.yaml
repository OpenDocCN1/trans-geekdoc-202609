    srinivas_sethi@gmail.com


    Berhampur 大学

    印度 贝哈甘普

    dcpanda@gmail.com


    第四作者 Ramesh K. Saho

    计算机科学系


    英迪拉·甘地科技学院

    印度 Dhenikanal, Saranga

    ramesh0986@gmail.com


    次用户（SUs）的可信度可以通过它们在认知无线电网络（CRN）中对邻居节点感知信誉的过去和现在的信任度来衡量。基于这些值，可以明确次用户能够高效利用空闲频谱。我们提出了一种模型，借助机器学习（ML）方法分析认知无线电网络（CRN）中次用户（SUs）的可信度。事实证明，对于认知无线电网络（CRN）中基于次用户感知信誉预测的数据可以获得更高的准确性。这也有助于识别节点中正确数量的恶意、可疑次用户和诚用户。我们使用的软件是用于数据挖掘任务的机器学习算法集。


    信道可以通过频谱识别、感知和划分得到改进，而不会对主用户（PU）产生干扰。感知分为两种：协作和非协作，在这些环境中起着至关重要的作用。协作频谱感知是指每个次用户都意识到
    CRN 内的白空间。作为融合中心（Fusion Centre）的中央节点接收来自所有次用户的报告，并根据需求对 CRN 的部分报告开始操作。在非协作感知中，每个次用户在
    CRN 内独立运行，对频谱进行感知和分析。


    本次任务中分析了不同类型的机器学习方法，如朴素贝叶斯、决策树、支持向量机和神经网络。我们观察到，决策树和神经网络在实现高准确性方面优于朴素贝叶斯。


    与非协作相比，协作频谱感知方法对于获得准确的感知信誉、减少虚报和缓解衰落问题具有优势。在协作频谱感知过程中，感知是在规律的时间间隔内进行的。每个节点必须与网络中的其他节点协作以获得准确性，而每个节点的可信度在网络中起着巨大作用。始终指示融合中心（FC）不接受来自频谱不可信节点提供的任何信息。事实上，网络中包含了一种故障管理方案，在次用户（SUs）进入网络之前为其提供有效信息或授权。它不断观察次用户的过去和现在的行为以估计信任值。这种信任管理方案对于网络中次用户信任值的计算非常有用，它为具有高信任值的节点提供了更好的机会来满足其需求，并帮助避免来自恶意用户的攻击。


    可信度、机器学习方法（MLA）、感知、信誉、恶意、可疑用户、诚实用户：WEKA、朴素贝叶斯、决策树、树。


    ## I. 引言


    大量的应用程序依赖于通信技术。无线应用和服务对提供的频谱资源有巨大需求。对更多频率频谱的需求是因为主用户（PUs）在其他模式下使用的频谱利用率不足，为了寻找新方法，Jospita
    Mitali 首次引入了认知无线电网络（CRN）的概念来解决频谱问题。


    CRN 通过智能感知和资源分配技术帮助减少无线通信的频率资源短缺。CRN 可以利用未利用频谱，并根据环境条件的变化自动配置传输和接收参数。为了实现这一点，


    本文提出了一种协作频谱感知方案，其中实施了机器学习（ML）方法。它对次级用户 SUs 的预测信任值提供了很高的准确性。这些 ML 技术通常用于预测提取出的数据，然后将其插入分类器以归分为某一类。现在数据集被分为两组：i，训练阶段和验证数据集。在训练阶段，数据从每个次用户处本地收集。随着数据量的增加，MLA
    在数据支持下次用户（SU）可信度方法上的性能和准确性也会随之提高。可信度的分析有助于实现各种目标。


    ## II. 相关工作


    次用户（SUs）的可信度可以通过它们在认知无线电网络（CRN）中对邻居节点感知信誉的过去和现在的信任度来衡量。基于这些值，可以明确次用户能够高效利用空闲频谱。我们提出了一种模型，借助机器学习（ML）方法分析认知无线电网络（CRN）中次用户（SUs）的可信度。事实证明，对于认知无线电网络（CRN）中基于次用户感知信誉预测的数据可以获得更高的准确性。这也有助于识别节点中正确数量的恶意、可疑次用户和诚用户。我们使用的软件是用于数据挖掘任务的机器学习算法集。


    信道可以通过频谱识别、感知和划分得到改进，而不会对主用户（PU）产生干扰。感知分为两种：协作和非协作，在这些环境中起着至关重要的作用。协作频谱感知是指每个次用户都意识到
