    # 认知无线电网络环境下基于机器学习方法的次级用户可信度分析。


    第一作者 Umakanta Samanthingar

    电子与与科学系，


    第二作者 Srinivas Sethi

    计算机科学与系


    第三作者 Dhruba C. Chanda

    电子科学系


    BJB 自治学院

    印度 布内斯威尔

