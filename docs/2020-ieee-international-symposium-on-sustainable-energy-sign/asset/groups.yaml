    # II. RELATED WORKS


    The trust management process is initiated by Cognitive Base (CBS) when the newly
    secondary user enters the registry of SU. The SU-based sensing network is designed
    to receive and forward sensing reports to the Fusion Centre or Base Station [2].
    Now the Fusion Centre receives the report from all SU and determines the final
    result based on the report of each Secondary User (SU). It is noted, that Base
    continuously checks the accuracy of every SU for their sensing values. According
    to the decision made by the Base [3], the trust management of the system contains
    five formats as (i) Trust evaluation (ii) Trust evaluation (iii) Reward implementation.
    The different models of trust management are explained in [5]. The reward system
    is one of them. According to the trust assessment, the SUs are considered for
    giving rewards or punishments. Reward can be rendered in terms of offering incentives
    or in making a profit. Similarly, punishment can be in terms of degrading the
    sensing value of malicious and suspicious SUs, which causes more to be removed
    from CRN and loses chances to access to the network resources. As shown in [6],
    the Multi-Factor Trust mechanism can manage the Spectrum Sensing Data Falsification
    attack, which helps to evaluate the trustworthiness of every SU. This sensing
    mechanism provides good performance in de-centralized Cognitive Network. In [7],
    author has proposed a new trust scheme, which worked on Spectrum Sensing Data
    Falsification attack in multi-cooperative spectrum sensing network. In [8], author
    states that in CRN there may be the possibility for dishonest SUs to undermine
    the spectrum operations priority. Such of malicious behavior may affect the overall
    performance of the entire network. In this, a Trust & Reputation Management scheme
    is highly essential which overcomes the above problems. In [9], author has proposed
    a new Least Mean Square (LMS) algorithm for cooperative spectrum sensing in CRN,
    where the multiple weight factors are updated timely. Finally, the spectrum report
    of


    allUs are combined at Fusion Center and is made on the basis of their trust values.


    In order to sense the spectrum accurately and reducing the computational time
    at fusion center, author has introduced in [10], Machine Learning neural network
    approach to achieve quick sensing in CRN. In [11], author has explained the need
    of Machine Learning for the development of CRN. According to the methodology,
    all nodes in CRNs are classified as either supervised or non-supervised learning.
    In [12], author discussed the usefulness of Machine Learning (ML) approaches in
    case of network operation management, with the target of performance optimization,
    and security in CRN. In [13], author has proposed a Multi-factor based trust evaluation
    scheme which makes the CRN performance more precise and powerful. Now, Spectrum
    Recognition (SR) has been included in this scheme to keep record and monitor the
    malicious and suspicious users in CRN. But author has not focused on the area
    where high accuracy can be achieved. This objective motivated to implement Machine
    Learning (ML) approaches in this paper for improving the accuracy of the result
    of spectrum recognition and trustworthiness at Fusion Center in CRN.


    # III. SYSTEM MODEL


    In this section, a proposed scheme is described in details, to measure the degree
    of accuracy in the process of calculating the trustworthiness and sensing reputation
    of Secondary Users (SU). Since the trust value of SUs allows for sensing free
    frequencies of Malicious Users, the management of accuracy on predicted value
    of SU is highly essential.


    # A. Trust Computation


    To calculate trust, many important and methods have been proposed in the literatures.
    The CRN can be secured from the unknown and unknowingly attacks based upon the
    trust value of the SU, which are considered as Honest, and Malicious Users.


    | Category | Trust Value | Users |

    |---|---|---|

    | A | 0.9-1 | Honest |

    | B | 0.51-0.89 | Suspicious |

    | C | 0-0.5 | Malicious |


    The trustworthiness of Secondary Users (SUs) can be calculated by taking weight
    factors into account, which are the coefficients used in the mathematical model
    to give more "weightage" or preferences than the other nodes in CRN. Finally,
    the Recognition (SR) of each SU is calculated [4] as given below.


    ```

    SR[$u_n] = w1*TF[$u_n] + w2*AF[$u_n] + w3*IF[$u_n]

