    The Trustworthiness of Secondary Users (SUs) can be measured through their past
    and present trust with sensing reputations by the neighboring nodes in Cognitive
    Radio Network (CRN). Based on these values, it is cleared that SUs can be utilized
    the free spectrum efficiently. We have proposed a model to analyze the trustworthiness
    of Secondary Users (SUs) in Cognitive Radio Network (CRN) with the help of Machine
    Learning (ML) approaches. It is demonstrated to achieve more accuracy on the data
    predicted from sensing reputation of SUs in Cognitive Radio Network (CRN). It
    has also helped to sense the correct number of malicious, suspicious SUs and honest
    users among the nodes. The software that we have used, is a collection of machine
    learning algorithms for data mining task.


    channels may be improved as a result of spectrum identifying, sensing and dividing
    it, without creating interference to the PU. Sensing is two types – cooperative
    and non have vital role in these environments. Cooperative spectrum sensing every
    SU is aware of the white space within a CRN. A central node which is Fusion Centre
    receives all the reports from SUs and starts operation based on the part reports
    on the CRN as per requirement. In non-cooperative sensing, each SU operates independently
    within the CRN for sensing and analyzing the spectrum.


    Different types of machine learning approaches have been analyzed in this mission
    such as Naive Bayes, Decision Tree, Support Vector Machine and Artificial Neural
    Network. We observed that Decision Tree and Neural Network are performing better
    than Bayes Bayes in achieving high accuracy.


    As compared to non-cooperative, cooperative spectrum sensing methodology is advantageous
    for accurate sensing reputation, reducing false alarms and mitigating fading problems.
    In co-cooperative spectrum sensing process sensing occurs at regular interval
    of time. Each node has to co-operate with other nodes in the network to get accurate
    and trustworthiness of each has a great role in the network. It is always instructed
    to Fusion Centre (FC) not to accept any information provided by an un-trusted
    node of the spectrum. In fact, a fault management scheme is included in the network
    which provides the valid information or authorization before entering the. Secondary
    Users (SUs) before entering the network. It constantly observes the past and present
    behavior of secondary users to estimate the trust value. This trust management
    scheme is very useful for the computation of trust value of Secondary Users in
    the network, which provides better opportunities for a node with higher trust
    value to satisfy its need and help avoid malicious attacks from the malicious
    users.


    Trustworthiness, Machine Learning Approaches (MLA), Sensing, Reputation Malicious,
    Suspicious Users, Honest Users: WEKA, Naive Bayes, Decision Tree, Trees.


