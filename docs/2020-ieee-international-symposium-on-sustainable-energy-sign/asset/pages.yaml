    services. The need for more frequency spectrum is one of under-utilization of
    spectrum used by the Primary Users (PUs) in other mode, for the search of a new
    method, Jospita Mitali has first-introduced the idea of Cognitive Radio Network
    (CRN) to overcome the problem of spectrum.


    The CRN helps to diminish the shortage of frequency resources for wireless communication
    using intelligent sensing and resource allocation technique. CRN can utilize available
    un-utilized spectrum and self-configuring the transmission and reception parameters
    as per the change of environmental conditions. To fulfill this,


