    pairs of literals that share a term in the same position. There may already be
    many possibilities here, but in the next step, this number is usually increased
    since all possible subsets of the set of literal pairs are studied.


    Literals also encompass both relationships between objects and properties. In
    Michalski''s method, the most interesting aspect is that generalization is sought
    in the structural space, without taking into account the attributes in the first
    phase. This means that the number of possibilities with respect to the previous
    methods is reduced.


    # 4.5 - Version Space


    Mitchell [MITC82] proposed a unified framework for learning concepts called version
    space. This method assumes that the process of learning a concept takes place
    in a nest space H between two sets of hypotheses called G and S. The set G contains
    the most general elements of H. In S, on the contrary, the more specific elements
    accumulate. An elementary'
  - '[PAGE 84]


    assumption of this method is that given a set of positive and negative instances,
    it is possible to construct a space of consistent formula versions among which
    the concept is to be learned. Here the set of consistent formulas can be nested
    formulas as the set of complete formulas, that is, they recognize all the positive
    and coherent instances, which do not recognize the negative ones. The construction
    of this space is carried out through the generalization and specialization of
    concept C due to the presence of positive and negative instances. In addition,
    any description consistent with the concept that can be learned should be made
    in terms consistent with H. The result of this process is that there is a tree
    of specializations and one of the generalizations, where each node is associated
    with a concept model. An interpretation of these nodes is as follows:


    +   1. A node of the generalization tree is connected to a model that covers all
    positive examples.

    2. A node in the tree of specializations is connected to a model that does not
    cover a counterexample.

    The version space allows you to keep all the extra useful information from a training
    set without having to save any of the examples. In addition, this method'
  - '[PAGE 85]


    allows us to find the exact state of generalization in which a descriptor must
    be used to optimize the efficiency of the operators that use it in solving a problem.
    A generalization, g, is contained in the nest space between G and S, if and only
    if:

    g is more specific than or equal to a member of G, and

    g is more general or equal to any member of S'
