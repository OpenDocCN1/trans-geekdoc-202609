    任何概念获取算法（concept acquisition）的关键点在于，必须根据所给示例之间的相似性来计算概念的描述。


    Winston 假设他需要比较的语义网络将非常相似，因此校对算法不需要面对多种可能性。这种想法源于准示例（近似项）的使用，这些示例与要学习概念的正例仅在微小细节上不同。如果
    Winston 承认反例，那么无论比较语义网络的算法是什么，其代价都将昂贵得多。


    在 Hayes-Roth 算法的第一步中，根据表示概念示例的案例框架（case frames，其中包含了对象之间的关系及其属性）计算出所有可能的对应形式，因此可以以多种组合的形式生成。


    在 Vere 的算法中，执行了类似的操作，因为在第一步构建了一个包含所有相同位置共享术语的字文字对（literals）的集合。这里可能存在很多可能性，但在下一步中，这个数量通常会增加，因为需要研究字文字对集合的所有可能子集。


    字文字还涵盖了对象之间的关系和属性。在 Michalski 的方法中，最感兴趣的一点是在结构空间中寻求泛化，而在第一阶段不考虑属性。这意味着相对于之前的方法，可能性的数量减少了。


    ## 4.5 - 版本空间


    Mitchell [MITC82] 提出了用于学习概念的统一框架，称为版本空间（version space）。该方法假设学习概念的过程发生在 G 和 S 两个假设集之间的嵌套空间
    H 中。集合 G 包含 H 中最通用的元素。相反，在 S 中积累了更具体的元素。该方法的一个基本假设是：给定一组正例和负例，可以构建一个一致公式版本的空间，在该空间中进行待学习的概念的构建。这里，一致公式集可以作为嵌套公式和完整公式的集合，即它们识别所有正例和相干实例，但不识别负例实例。该空间的构建是通过根据正例和负例的存在，对概念
    C 进行泛化（generalization）和特化（specialization）完成的。此外，任何与可学习概念一致的描述应以与 H 一致的术语表示。这一过程的结果产生了一棵特化树和一棵泛化树，每个节点都关联一个概念模型。这些节点的解释如下：


    - 1. 泛化树的节点连接到一个覆盖所有正例的模型。

    - 2. 特化树中的节点连接到一个不覆盖反例的模型。


    版本空间允许你保留训练集中的所有额外有用信息，而无需保存任何示例。此外，这种方法允许我们找到泛化的精确状态，在该状态下，必须使用描述符来优化在解决问题中使用它的算符的效率。泛化
    g 包含在 G 和 S 之间的嵌套空间中，当且仅当：

    - g 比 G 的某个成员更具体或相等，且

    - g 比 S 的任何成员更通用或相等


    # 第5章 - 决策树归纳


    ## 5.1 - 决策树


    决策树是归纳分类任务中涉及决策过程的一种可能表示。属性被用于创建样本集的划分；树的节点对应属性的名称或标识符，而节点的分支代表与该节点相关的属性的可能值。叶节点已经分类为示例集。


    树的构建策略在于始终选择对分类可能最有用的属性，将其理解为能够从这一刻起有望生成最佳树的那个属性。评估决策树有两个标准：


    - 成本（Cost）：从根节点到叶节点的平均代价是多少。它取决于两个因素：路径长度（即查询的属性数量）和每次查询的成本。

    - 良良性（Goodness）：预测树区分独立新示例集的能力（通常以每类的成功率百分比衡量）。


    通常也会考虑的另一个方面是树的可读性，尽管该标准仅在上述两个标准出现“平局”时适用。


    决策树可以正式定义为：


    - 1. 一个标记有类名的叶节点（或响应节点）。

    - 2. 一个标记有属性名的内部节点（或决策节点），对于该属性的每个值，都有一个分支连接到另一个标记有该值的决策树。


    因此，分支代表了关于父节点属性值的疑问或决策。通过这种方式，决策树可以被看作一棵树和/或，其中深度标记与，宽度标记与。该算法最初由 Quinlan [QUIN79]
    开发，属于 TDID3 族。输入算法的输入序列中的每个元素或实例都以属性值对列表的形式呈现，构成一个复合描述。每个实例还附带其所属的类。目标是根据前一节概述的标准，用最紧凑的方式解释所有实例的决策树。算法通过在每个时刻根据某种启发式度量选择最佳属性来构建树，这可以看作是一种不回溯所有可能树的爬山搜索。设
    X 为初始实例集，A 为描述这些实例的属性集，C 为可能的类集合，并用运算符 # 表示集合的基数。在全文中，位于任何节点处的，我们将 X 称为实例集 {X
    的子集使得使得其值与从根节点到该节点对应涉及属性的路径值一致。我们将该路径称为判别路径。让我们来看一个例子：


