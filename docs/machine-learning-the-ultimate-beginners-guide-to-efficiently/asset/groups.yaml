    ## 6.9 - Automatic Learning Techniques


    In Artificial Intelligence, unsupervised learning has been attempted to see from
    a less numerical point of view, adopting the ideas arising from cognitive psychology
    and building computational models of how humans categorize and construct concepts
    from groups of objects.


    The origin of these methods also starts from the desire to try to solve the problems
    that appear from the use of taxonomic to numerical algorithms, so some of the
    algorithms that have been developed developed the ideas of these methods, but
    by introducing improvements regarding the information used for the grouping of
    objects, the criteria that allow deciding the formation and coherence of a class
    and the characterization and explanation of the results. It has also been tried
    to incorporate in the algorithms part of the search and analysis work that the
    taxonomic methods left to the user.


    The starting point of all these methods is also a set of data characterized by
    attribute-value pairs to which relevant information about the domain of classification
    as restrictions, properties of attributes (cause-effect relationships), correlation
    and criteria to evaluate the quality of the resulting groupings can be added.
    It has also been borne in mind that the domains on which to work must not be composed
    solely of numerical data. The result can be a set or hierarchy of classes characterized
    by the most relevant attributes among those used to describe them and the values
    they take. The type of description varies depending on the methods. There are
    those that result in a combination of necessary attributes and are enough for
    membership in each class by adopting the classic view of characterization. Others
    adopt the probabilistic vision, resulting in a set of characteristics of their
    clients that with a certain probability must be possessed to belong to a class.
    In some methods, the possibility of being able to predict with the maximum accuracy
    the attributes of the objects of a class is known knowing the class to which they
    belong, in others, it is sought that the characterization allows classifying future
    instances in order to use this characterization as a knowledge base.


    The methods of unsupervised learning have been divided into two groups taking
    into account whether the acquisition is carried out incrementally or not. Both
    methodologies have their advantages and disadvantages. The non-incremental variant
    has been called conceptual clustering, the incremental formation of concepts.
    Next, each of the two will be described in detail, together with the main systems
    to which they have given rise.


