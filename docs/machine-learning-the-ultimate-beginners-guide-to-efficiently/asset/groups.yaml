    ## 8.1 - 概念形成


    概念形成的目标与对观测集合进行分组和表征以获得分类的目标相同。这些技术还强调了层次结构的构建，这种结构允许概念之间能够建立联系。


    与之前的方法的根本区别在于将学习视为一种增量任务的方法。它旨在模拟智能体的行为，即智能体通过累积收到的观测经验来获取知识。


    这就是为什么所有概念形成方法都采用了一种策略，使得每个新观测都被放置在构建的概念层次结构中，这种构建方式补充了直到该时刻为止已有的知识。层次结构所需的修改是通过一组优化关于学习内容的某些标准的函数来引导的。


    因此，概念形成算法在概念层次结构的空间中进行搜索，其方法是上升法（hill-climbing）。


    与经典的提升法搜索方法的根本区别在于，与这些方法不同，通过启发式评估函数要达到的目标并不是保持不变的。知识的获取改变了全局环境，因此改变了必须学习的内容。另一个区别是，这些方法将你的内存限制在一个正在进行中的解决方案上，它们不会尝试不同的替代方案来获得解决方案。增量性付出的代价是所有这些方法对观测输入顺序的敏感性
    [FISH92] 以及对它们描述可能呈现的噪声的敏感。为了减少这些影响，人们建议提供能够算符，当新观测允许我们检测到已学习内容的错误时，能够修改概念层次结构。这使得能够进行双向搜索，产生回溯的效果，但不需要承担回溯所需的空间代价。无论如何，这些算符的影响仍然是的。概念形成方法的演变留下了一系列试图捕捉所有这些思想的方法。


    ## 第 9 章 – EPAM


    EPAM 可以被认为是最早的概念形成模型之一。它旨在作为人类学习的模型。


    EPAM 的知识表示使用了属性-值对，其中每个节点都可以有一个列表，这允许对对象进行描述。与决策树不同，它不假设所有属性值都是已知的，因此在非终端节点中存在可能出现的值。学习算法从根节点开始对层次结构进行检查，直到到达终端节点。过程如下：


    - 如果所在的节点是非终端节点，则检查观测的属性值。

    - 如果存在指向该值的分支，则从该节点递归应用过程。

    - 如果没有这样的分支，则跟随标记为“其他”的分支，并从该节点递归应用。

    - 如果所在的节点是终端节点，如果观测与节点中的概念一致，则执行熟悉过程。该过程包括向节点添加观测所具有但不具备的属性。

    - 如果观测的任何属性与节点不匹配，则执行判别过程。这种差异可能由于两个原因：1. 观测可能通过某个标记为“其他”的分支进行分类。如果是这样，检测该分支并添加一个考虑观测值的新分支，从而增加树的宽度。2.
    如果发生在终端节点而非通往该节点的路径上，则创建一个新的决策节点，考虑该属性的两个不同值。为节点的值创建一个分支，为观测创建另一个分支，并为每一个创建一个终端节点。这种方法增加了树的深度。


    这种方法的重要性在于它对之后开发的方法的影响。它首次引入了概念层次的使用，并将分类和学习任务整合到增量算法中。


    ## 第10 章 - UNIMEM 和 CYRUS


    UNIMEM [LEBO87] 和 CYRUS [KOLO83] 是概念形成系统的下一代。它们采用了 EPAM 关于构建层次和增量引入实例的思想。主要的区别在于，在这两种情况下，层次结构的每一层都通过一组属性与后续进行区分，而在
    EPAM 中，每一层仅通过一个属性进行区分。


