    ## 8.1 - Concept Formation


    Concept formation seeks the same objective as the grouping of a set of observations
    and characterization to get a classification. These techniques also place special
    emphasis on the construction of a hierarchy that allows the concepts to be related.


    The fundamental difference between the previous methods lies in the approach to
    learning as an incremental task. It is intended to simulate the behavior of an
    agent who is acquiring his knowledge from accumulating the experience of the observations
    that come to him.


    This is the reason why all the methods of formation of concepts pose their strategy
    so that each new observation is placed in the hierarchy of concepts that are constructed
    in a way that complements the knowledge that exists until that time moment. The
    modifications that are necessary for the hierarchical structure are guided through
    functions that optimize certain criteria about what is being learned.


    The algorithms of the formation of concepts, therefore, perform a search in a
    space of hierarchies of concepts with a method of ascent (hill-climbing).


    The fundamental difference with the classical methods of search by promotion is
    that, unlike in these, the objective to be reached by the heuristic function of
    evaluation is not kept constant. The acquisition of new knowledge is changing
    the global environment and therefore what must be learned. Another difference
    is that these methods limit your memory to a single solution in progress, they
    do not try different alternatives from which to arrive at the solution. The price
    to be paid for incrementality is the sensitivity of all these methods to the order
    of input of the observations [FISH92] and to the noise that their descriptions
    may present. To reduce these effects, it has been proposed to provide operators
    capable of modifying the hierarchy of concepts at the moment when the new observations
    allow us to detect errors in what has been learned. This allows to be able to
    make a bidirectional search producing the effect of backtracking but without the
    cost in space that this requires. In any case, the effect of these operators is
    still limited. The evolution of the methods of formation of concepts has left
    a set of methods that try to capture all these ideas.


