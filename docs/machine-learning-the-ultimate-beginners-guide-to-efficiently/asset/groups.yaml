    示例条目。

    除非你几乎已经知道了某些内容，否则你无法学习到任何东西。除非在教你之前你几乎知道了某事，否则你无法学习它。


    在温斯顿的方法中，第一个泛化可以表述为：在具有尺寸和纹理的物体上有一个中尺寸且没有阴影的多边形。另一个具有尺寸和纹理的物体。第二个泛化等同于：有一个没有阴影的大物体。


    通过温斯顿方法发现的第一个泛化的有趣之处是，它提到有一个中尺寸的多边形。“多边形”一词出现是因为温斯顿使用的泛化规则之一是“爬树规则”。在这种特定情况下，泛化的层级指的是形状属性可以拥有的值，并且仅有一层。


    因此，如果在新示例和当前概念模型中存在两个执行相同函数的节点（它们代表概念中的同一个对象，可以说它们在某一属性上具有不同的值），这些特定值在泛化中仍会被替换为泛化树中的最低值，即这两个值的共同先驱。在这种情况下，属性中的任何两个不同值总是被它们唯一的共同先驱所替换，即“多边形”。


    ## Hayes-Roth 方法


    Hayes-Roth 和 McDermott ([HAY77], [HAY78]) 关于归纳学习的工作尝试从一组正实例中找到最具体的合取泛化（在其最大命名法抽象或干扰匹配中）。他们用于表示这些实例和泛化的结构被称为参数化结构表示
    (PSRs)。本节中使用的目标概念实例将描述如下：


    E1: {{box: a} {circle: b} {rhombus: c} {smooth: a} {shaded: b} {smooth: c} {large:
    a} {medium: b} {medium: c} {about: b, below: a} {about: c, below: b}}


    E2: {{rectangle: d} {circle: e} {circle: f} {square: g} {large: d} {small: e}
    {small: f} {medium: g} {smooth: d} {shaded: e} {shaded: f} {smooth: g} {over:
    g, under: d} {out: d, inside: e} {out: d, inside: f}}


    E3: {{ellipse: h} {rectangle: i} {triangle: j} {plain: h} {shading: i} {plain:
    j} {large: h} {medium: i} {medium: j} {about: i, below: h} {about: j, below: i}}


    该表示的每个组件都是案例帧（case frame），由案例标签（small, circle）和参数（a, b）组成。假设所有案例帧都是连接在一起的。泛化过程如下：第一组合取泛化
    G1 用条目中的第一个示例初始化。给定一个新示例和上一步获得的泛化集 $G_i$，通过在 $G_i$ 的每个元素与当前训练示例之间进行部分匹配（干扰匹配）来获得
    $G_{i+1}$。这种比较试图找到参数和案例帧之间最长的一一关联。这通过两个步骤完成：


