    # # Introduction


    Congratulations on purchasing Machine Learning and thank you for doing so.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy it!


    # ## Animal And Automatic Learning


    It is not usual to start a book about the type of learning that a machine can
    do, which will be called here automatic learning, studying the learning processes
    that are observable in nature, although there are some precedents (for example,
    [GALL91] and [PEAR87]). The reason is that if you want to find a cognitive framework
    to explain the phenomenon of learning, it seems reasonable to refer to those behaviors
    observable in animals (and that are'
  - '[PAGE 9]


    identifiable as learning) that can help us explain more fully a process as complex
    as the one at hand. It is not enough just to try to explain what is learned in
    terms of general processes such as citations, prototype abstraction, hypothesis
    testing, induction, analogical reasoning, assimilation, generalization or differentiation.
    There are reasons to state that there is a certain bias in the cognitive structures
    used in each of the aforementioned tasks and that that this bias depends directly
    on specific characteristics of the domain where something has been learned.


    # Animal Learning


    When organisms adjust or adapt to the set of stimuli that come from the environment,
    that is, they receive information and store it in order to reuse it in situations
    or patterns of similar stimuli, it can be said that they learn. In particular,
    we refer to animals since, from the point of view of learning, and unlike plants,
    they are mobile and active. In fact, it can be said that animals are machines
    that have a predatory'
  - '[PAGE 10]


    behavior and have to move to locate their food and get it or, at least, are equipped
    with specialized organs for it, as as is the case with many marine beings that
    do not they move but are able to filter the water they absorb for food. This emphasis
    on the movement of animals is essential to explain the existence of different
    types of learning. It is possible to imagine two very different situations:


    The animal moves randomly; In this case, the same movement must bring you closer
    to the environment in which you can provide everything you need for your livelihood
    (water, oxygen, food, etc.) and ensure its development and the survival of a significant
    proportion of the beings in your life. If a random movement is not enough, there
    must be a directed movement for what must be special organs for detecting objects
    in the environment and guiding the animal towards them, directly or indirectly.
    The greater precision of these movements depends on the evolution caused by the
    pressure generated by competition with other species by resources limited in a
    given ecological habitat.'
