    examples presented.


    Winston assumes that the semantic networks that he has to compare will be very
    similar and, therefore, the collation algorithm will not have to face multiple
    possibilities. This idea comes from the use of quasi-examples (near-misses), which
    differ in only small details from the positive examples of the concept to be learned.
    If Winston admitted counterexamples, whatever the algorithm for comparing semantic
    networks would be much more expensive.


    In the first step of the Hayes-Roth algorithm, all possible forms of correspondence
    are calculated from the case frames that denote the examples of the concept (which
    include both relationships between objects and their properties), and can, therefore,
    be generated m multiple combinations.


    In the algorithm of Vere, something similar is done since in the first step a
    set is constructed with all the'
