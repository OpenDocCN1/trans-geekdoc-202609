    in detail. Within the field of concept acquisition, several of the classic algorithms
    are explained to obtain the characteristic description of a concept from positive
    (and sometimes also negative) instances of it. These algorithms are those of Mitchell
    (version space), Winston, Hayes-Roth, Vere, and Michalski. Next, the decision
    trees, hierarchical structures that allow classifying objects based on the values
    of their attributes and their corresponding class in the most efficient manner,
    using information theory techniques are discussed. Finally, the basic techniques
    of conceptual clustering are described, or classification of objects described
    through pairs (attribute, value).


