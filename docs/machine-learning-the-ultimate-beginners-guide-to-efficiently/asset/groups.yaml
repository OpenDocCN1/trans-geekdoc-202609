    ## Automatic Learning


    Learning refers, as has been seen, to a wide spectrum of situations in which the
    learner increases his or her knowledge or ability to complete a task. Learning
    applies inferences to certain information to construct an appropriate representation
    of some relevant aspects of reality or of some process.


    A common metaphor in the area of machine learning within Artificial Intelligence
    Intelligence is to consider problem-solving as a type of learning that consists
    of being able to recognize the problem situation Attica and react using the strategy
    learned. Currently, the greatest distinction that can be drawn between an animal
    and a problem-solving mechanism is that certain animals are able to improve their
    performance, in a wide range of tasks, as a result of having solved a certain
    problem.


