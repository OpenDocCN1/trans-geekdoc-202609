  mdcn: "\n上下文。\nWITT [HANS86] [HANS90] 中观测值的表示是以属性-值对的形式进行的，其变体是观测值对一个属性可能有多个值，且仅限于分类属性。\n\
    \n而 $Oc$ 表示类 $c$ 与其他现有类之间的平均凝聚力。这种衡量标准可以解释为：类内部对象之间的平均距离与该类到其余类之间平均距离之间的对比。这种距离考虑了对象属性之间的相关性，与典型的欧洲衡量方法不同，后者假设属性之间是相互独立的。\n\
    \n一旦获得一组类，就会进入强化阶段，此时我们所解释的类别的质量衡量标准将发挥作用。执行此算法需要两个额外的用户参数，我们将其称为 $P2$ 和 $P3$，分别用于控制对象添加到现有类（第一个参数）以及创建新类（第二个参数）和合并现有类。\n\
    \n强化算法如下：\n\n- 1. 计算每对未分类对象与现有类之间组合的 $C$ 凝聚力函数值值。\n- 2. 选择具有该函数（$C$）最佳值的实例-类别对。\n\
    - 3. 如果 $C$ 值大于 $P2$，则将对象添加到类别 $a$ 中，并返回步骤 1。\n- 4. 如果没有这样的对，则调用类生成算法，对剩余对象进行排序以创建新类。\n\
