    \n分类算法基于贝叶斯定理进行概率组合。给定一组观测值 $O$ 和一个假设 $H$，假设解释数据的概率 $p(O_j|H)$（给定数据的假设后验概率）正比于假设确定时观测到数据的概率\
    \ $p(O_j|H)$（数据的似然性）乘以假设概率 $p(H)$（其先验概率）。数据的先验概率 $p(O)$ 是一个可以忽略的常数，因为对于我们需要进行的计算，我们对不同概率之间的相对值感兴趣。其通常公式为：\n\
    \n$p(H_j|O) = \\frac{p(H_j) p(O|H_j)}{p(O)}$\n\n为了分类的目的，观测值中存在的描述符被视为假设 $H$。因此，找到使概率\
