    因此，C = FC+; C-; g, X = {f1; 2; 3; 4; 5; 8} 其在两个现有类中的参与为 PC (X) = {f1; 2; 3; 4;
    5; 8}。因此，I (PC (X)) = 3log2 3; 5 = 5log2 5 = 5。


