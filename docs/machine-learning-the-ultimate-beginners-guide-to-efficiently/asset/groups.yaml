    # Chapter 1 - Historical Review


    A brief history of the development of research on machine learning in AI is as
    follows:


    1.

    - Initial enthusiasm (1955-1965)

    - Learning without backup knowledge

    - Neural Modeling

    - Evolutionary learning


    Among the most significant milestones of this period are the perceptrons, the
    notions of self-organization, self-stabilization, and pattern matching as basic
    tools in the learning processes. The systems developed at this time are characterized
    by the almost absolute lack of supporting knowledge or initial knowledge. The
    ANALOGY system should be considered as a transition.


    2.

    - Dark stage (1965-1976)

    - Acquisition of symbolic concepts

    - Acquisition of language


    In the second epoch, the problems were essentially transferred to the obtaining
    of representation schemes in order to ensure the correct acquisition of new knowledge
    (ie knowing what the knowledge issues are after a learning process ). Associated
    with this trend structures, called hierarchies, were designed to organize the
    concepts (see section 2.5). This type of learning consists of the inference and
    assimilation of new material composed of concepts, general laws, procedures, etc.
    These systems rest on the existence of a human teacher who supervises learning.


    3.

    - Renaissance (1976-1986)

    - Exploring different strategies

    - Knowledge-intensive Learning

    - Successful applications


    At this time, it is explored how to combine symbolic learning techniques to improve
    the "quality" of what has been learned. It is explored with the use of large amounts
    of supporting knowledge. The first real applications appear.


    4.

    - Development (1986-Present)

    - Connectionist Learning

    - Multi-strategy systems

    - Experimental comparisons


    A possible list of the most active research areas currently in this field is as
    follows:

    - Neural models and cognitive models [ARBI91]

    - Theoretical computational models [VALI84]

    - Evolutionary learning algorithms [KOZA92]


    ## 1.1 Machine Learning Paradigms


    Depending on the type of selection and adaptation (transformation) that a system
    performs on the available information, it is possible to identify several paradigms
    of machine learning. This classification has evolved rapidly in the last decade.


    ## 1.2 Deductive Learning


    This type of learning is done through a sequence of deductive inferences using
    known facts or rules. From the known facts new facts or new relationships are
    logically derived. In this type of system, the monotonicity of the theory of nests
    by the knowledge base is important.


    ## 1.3 Analytical learning


    The methods used in this type of learning attempt to formulate generalizations
    after analyzing some instances in terms of system knowledge. In contrast to empirical
    learning techniques (which are usually methods based on similarities), analytical
    learning requires that a broad domain knowledge be provided to the system. This
    knowledge is used to guide the deductive chains that are used to solve new problems.
    Therefore, these methods focus on improving the science of the system, and not
    on obtaining new descriptions of concepts, as inductive learning does.


    ## 1.4 Logical Learning


    This type of learning tries to emulate some of the most amazing human capacities:
    to be able to understand a situation by its resemblance to previous known situations,
    to be able to create and understand sense or to solve a problem by noticing its
    possible similarity with others seen previously adapting (transforming) conveniently
    the solution that was found for these problems. This type of system requires a
    great deal of knowledge. Some authors consider that analog learning is a specialization
    of learning by explanation that will be discussed later.


    ## 1.5 Inductive Learning


    It is the most studied paradigm in machine learning. Normally, these systems lack
    a theory of the domain, that is, they do not know a priori the objects they deal
    with or their quantity. It deals with problems such as inducing the description
    of a concept from a series of examples and counterexamples thereof or determining
    a hierarchical description or classification of a group of objects.


    ## 1.6 Learning Through Discovery


    The type of discovery is a restricted form of learning in which an agent acquires
    knowledge without the help of a teacher. This process occurs when there is no
    available "source" that possesses the knowledge that the agent seeks. A particular
    type of Discovery is carried out when an agent tries to group objects that he
    assumes from the same set.


    ## 1.7 Ethical Gene Algorithms


    Genetic algorithms are inspired by mutations and other changes that occur in organisms
    during biological reproduction from one generation to the next and in Darwin''s
    natural selection process. The main problem that he tries to solve is the discovery
    of rules and the greatest difficulty he encounters is the allocation of credit
    to them. This last point consists of positively or negatively assessing the rules
    according to how useful they are to the system. This assessment is the one to
    determine which rule to apply to solve given problem.


    ## 1.8 Connectionism


    Another way of conceiving an automatic learning system is the so-called connectionist
    approach. In this approach, the system is a network of interconnected nodes, which
    has an associated rule of propagation of values, and whose arcs are labeled with
    weights. Before a set of examples, the system reacts by modifying the weights
    of the arches. It is said that the system learns if it adapts the weights of the
    connections in such a way that they will give the correct output to all (or the
    greater than) of the inputs offered.


    Another possible classification of the learning methods explored in AI, considering
    the type of strategy and the aid that a learning system receives, is:


    - Supervised: The fundamental assumption of this type of method is that the examples
    provided as input are necessary to meet the learning goals. It is like learning
    with a teacher. In this type of method, examples are given and it is specified
    what concept they are.

    - Unsupervised: They are designed to develop new knowledge by discovering regularities
    in data (data-driven). These methods are not directed by goals (goal-driven).

    - Through Reinforcements: This learning method is halfway between the previous
    two. The system proposes problems to solve. The learning is done only with a reinforcement
    signal provided by a teacher or by the environment as an indicator of whether
    the problem has been solved correctly.


    ## 1.9 Measures Of Action


    In the following chapters, different systems will be discussed as examples of
    the different learning paradigms, designed at various stages of AI and, consequently,
    with different architectural conceptions. Then, it is worth asking how you can
    evaluate the performance of a system to compare it with others. In this sense,
    there are few works carried out although there are some attempts to systematize
    sets of tests (benchmarks) that allow developing comparisons. The characteristics
    indicated below are not the only ones that can be measured but give an idea of
    the trend that follows in the community:


    ### Generality


    One of the measures of action of a system that learns is the generality or scope
    of the method. This idea of how easy it is to adapt the method to different applications
    in different domains. The ideal of generality is a system that can be adjusted
    according to the requirements of the task or the environment. At the other end
    are those systems that only apply to a single domain. The middle term is that
    learning systems work acceptably well in some domains.


    The science of a method can be measured as the time cost required to construct
    the representation structures that allow describing the objective (target concept)
    from some initial representation structures.


    ### Robustness


    It is the measure of the system''s ability to work with sets of training examples
    that may contain noise and partially wrong information. A robust system must also
    be able to build hypotheses that can be modified before the arrival of new evidence.


    ### Ecacia


    It is a measure of the overall capacity of the system and function of the previous
    measures. The idea is to generate a certain order between the systems that allows
    asserting that the system X is more efficient than another Y.


    This feature implies a certain non-monotonous in inference operations.


    Other measures may be related to the ease of implementation, but require a set
    of metrics associated with the correctness and complexity of the system and the
    abstract types of data that are used and that to some extent, must be related
    to the characteristics of the representation structures.

