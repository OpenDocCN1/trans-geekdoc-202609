    ## 3.3 - Types Of Inductive Learning


    Two major types of inductive learning can be distinguished:


    Acquisition of concepts It is also known as learning from examples. It is characterized
    because there is a teacher who provides the program with the description of some
    objects, already classified in one or more classes (concepts). The hypothesis
    that is induced can be seen as a rule of recognition of the concept. This means
    that if an object satisfies the conditions of the rule then it represents the
    given concept.


    Some problems addressed in this type of learning are:


    - Learn the characteristic description of a class of objects, which specifies
    the properties common to all known objects in the class.

    - Learn the discriminant description of a class of objects, which distinguishes
    it from a limited number of different classes.

    - Infer extrapolation rules from sequences, capable of predicting the next element
    of a given sequence.


    Learning from observation is also known as descriptive generalization. Its objective
    is to determine a general description that characterizes a set of observations.
    Some examples of this type of learning are:


    - Formulate a theory to characterize a set of elements (eg [LENA84]).

    - Discover regularities in data (eg [LANG84]).

    - Determine an omic taxon description (classification) of a collection of objects.
    This process is also known as conceptual clustering.


