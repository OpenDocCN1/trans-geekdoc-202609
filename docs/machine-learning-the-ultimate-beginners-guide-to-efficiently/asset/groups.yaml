    \ $P3$，意味着它们是两个交叉的类别并且是合并的候选。如果没有发生这种情况，则意味着没有类别重叠，因此形成更多类别没有意义。\n\n参数 $P2$ 和\
    \ $P3$ 决定了算法执行结束时获得的类的形状。如果 $P2$ 和 $P3$ 之间的比例很大，形成的类别倾向于呈现具有充分且必要条件的特征。随着该比例的减小，这种限制会放宽，获得显示不同程度聚类的类别。\n\
