    \ 如果至少添加了一个类别，继续执行步骤 1。\n- 5. 如果无法添加新类别，则计算所有现有类别对的 $W_{ij}$ 值，并选择具有最佳值的对子。\n\
    - 6. 如果此值大于 $P3$，则合并这两个类别并继续步骤 1，但算法将停止。\n\n在向类别添加对象的过程中，如果没有哪一个对超过了参数 $P2$，这被解释为：到目前创建的类是不够的，需要新类来补充现有的类。\n\
