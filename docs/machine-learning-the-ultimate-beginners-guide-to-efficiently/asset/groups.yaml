  - '[PAGE 11]


    A significant part of the behavior of many animals seems to be strongly rooted
    and influenced by experience so that it can be described as innate, instinctive
    or simply not learned. That is, many animals are in some way programmed in an
    innate way and, when they perceive alterations in their environment and change
    their behavior patterns {as a result of this perception}, they can be said to
    learn. From this point of view, learning can be established as the organization
    (or reorganization) of one''s behavior (in the face of a situation or pattern
    of stimuli) as a result of individual experience. The previous one indicates a
    minimum of characteristics that a phenomenon must present in order to be classified
    as an example of learning and avoid, as much as possible, the confusion that can
    cause to try to sway away from the way in which that the learning process has
    been carried out. This definition remains immutable even if you need to explain
    this process in situations where the behavior is continually modified by the acquisition
    of new knowledge. Some authors have suggested the need to explain animal learning
    in behavioral terms and then in cognitive terms, if possible.'
  - '[PAGE 12]


    Frequently in the literature, learning is considered an adaptive process, that
    is, it is manifested by gentle, incremental changes. The adaptability of learning
    is considered here as the measure of adjustment of behavior. In addition, it is
    assumed that what has been learned remains in memory for relatively long periods,
    so as to ensure the observability of the learned behavior (as something relatively
    stable).


    What an animal can learn does not depend solely on its ability to do so, since
    there are many other restrictions and limitations that shape this ability (eg
    limitations in its sensory systems). Thus, given these limitations, an animal
    is more predisposed to react to one type of stimulus than others, can learn more
    from these than those. Moreover, all the stimuli to which an individual responds
    in a certain context may not be effective in producing learning behavior in other
    contexts.


    The ways of defining learning and interpreting observed behaviors depend fundamentally
    on the way of considering the nature of the learner. As a consequence, learning
    should be considered as one of'
  - '[PAGE 13]


    the most appreciable characteristics in a system.


    # Types Of Animal Learning


    It is almost impossible to divide the various types of learning into mutually
    exclusive categories, which can exactly be nested and cover the entire spectrum
    of animal learning. This is not intended to be exhaustive and only seeks to give
    an overview of the state of the art.

    Room: It is a type of learning that consists of a response that declines before
    a set of repeated stimuli (or contuses) not associated with any type of reward
    or reinforcement. Habituation can be characterized as associated with a specific
    stimulus and its relative permanence distinguishes it from temporal manifestations
    such as fatigue or sensory adaptation (eg adaptation to low-light or very loud
    spaces). Habitually implies a tendency to erase all kinds of response to a stimulus
    that has no importance for survival. In spite of being the simplest type of learning,
    it is very effective, especially in the simplest organisms, since it serves as
    a filter to sets of stimuli'
  - '[PAGE 14]


    that are not relevant, avoiding the necessary specialization of some organ. However,
    habituation as a learning mechanism is present in all types of organisms, regardless
    of their complexity. However, the mechanisms that underlie the habituation process
    become more elaborate when organisms become more complex.


    Associative learning: Frequently in the environments in which the animals move,
    an event allows them to precede, with certainty, the occurrence (or not occurrence)
    of another. The appearance of certain features in the landscape may indicate the
    change of season, the change in behavior of some species individuals may announce
    the season of heat or the ingestion of some plant (or animal) may cause some disease
    (or produce consequences ben e cas). An animal that knows these relationships
    can profit by anticipating those events and behaving appropriately. But, how is
    that knowledge acquired?


    Although the concept of association {the connection between a stimulus and a response
    that has not existed before in the conduct of an organism has a'
  - '[PAGE 15]


    long history that can be easily traced, and despite the fact that in the 1880s
    this concept was already applied in experimental studies on human learning, modern
    psychological studies of associative animal learning did not begin until the end
    of the 19th century. At that time a group of Russian psychologists began to give
    the first explanations about how acquired behaviors, and probably also in inherited
    ones, can be modified and adapted by associating them with a new stimulus during
    the process. of training (learning).


    Conditioning: I. Pavlov''s studies on digestion, using dogs, made him the most
    indent Russian researcher at the end of the last century and his experiments led
    to the formulation of the theory of conditioned reflexion, or classical conditioning.


    Automatic Learning: Essentially, the notion of classical conditioning denotes
    the process by which an animal acquires the ability to respond to a given stimulus
    with the same action reflects how to respond to another conditioning stimulus
    (reinforcement or reward) when both stimuli are presented concurrently (or superimposed
    in a sequence) a certain number of'
  - '[PAGE 16]


    times.


    Learning through trial and error: This type of learning was identified by observing
    the behavior of certain animals that get rewards (i.e. food) after successfully
    performing certain tasks such as cats trying to escape from a box after pressing
    a lever, rats thrown in the middle of a bathtub that must identify a brand to
    swim to dry places, etc. In these situations, the animals always remain active
    and their attention is first here and then there, trying all the imaginable possibilities
    until more or less it accidentally solves the task successfully and obtains the
    reward. This happens despite the absence of a relationship between the actions
    taken and the passing of the test. To define, this is learning through trial and
    error then requires the existence of reinforcement (or reward) to encourage the
    selection of the appropriate response from a variety of behaviors in a given situation,
    until a relationship between the stimulus or situation is established and a correct
    answer to get a reward.


    In this case, the reinforcement is preceded by the stimulus and the required response,
    which does not'
  - '[PAGE 17]


    necessarily occur in the classical conditioning. This type of learning has been
    given many other names, such as operant conditioning, instrumental conditioning,
    etc.


    Latent learning: Latent learning is a type of associative learning that takes
    place in the absence of reward. A classic experiment is the one conducted with
    rats that are released in a maze for several days without any kind of reward.
    When their learning is compared to another group that has not been in the maze
    and begins to be rewarded immediately, the results of the first group are surprising:
    they learn faster and with fewer errors than the second group. It follows that
    the first group learned something during their stay in the labyrinth that remains
    dormant until it is needed.


    Imitation: Imitation has often been considered as evidence of the existence of
    highly relevant behaviors, although various phenomena are included under the imitation
    label. One of the most common types of imitation is the so-called social facilitation
    that describes a pattern of behavior already existing in the'
  - '[PAGE 18]


    repertoire of an individual since it performs when the same behavior is performed
    by other members of its kind. For example, in humans, yawning.


    But the true imitation, which involves copying a new behavior, action or expression
    that is impossible to learn if it is not copied from another individual, occurs
    especially in humans and in some chimpanzees and monkeys. In particular, one can
    imagine as an example of this type of learning what happens when an individual
    is trained to perform a pole vault. In other animals, such as felines and other
    hunters, learning how to kill a dam accurately is done by imitating parents and
    reinforced by games.


    Although, as it has been established, imitation doesn’t only mean a conscious
    copy of behavior, action or expression performed by another individual, it is
    also associated with an attempt to obtain a profit from the experience of another.


    Imprint: The imprint is an illustrative example of the way in which a specific
    range of stimuli is able to elicit a response and can be limited and resigned
