    \n这些任务在概念的结构部分上执行，因此只能通过修改连接节点的标签来完成。这些修改的结果是正在学习的概念的模型演化。通过这个模型，Winston 引入了两种作用于标签的启发式：要求链接（require-link，要求描述中必须存在某种关系）和禁止链接（forbid-link，禁止在描述中存在特定关系）。其应用非常简单：\n\
    \n- **Require-link (要求链接)**：当正在学习（演化中）的概念模型在某处有一个标签 `k`，而准示例没有时，使用该启发式。那么在代表概念的语义网络中，该标签就变成了必选的。\n\
    \n- **Forbidden-link (禁止链接)**：当准示例在某处具有 `i` 标签，而模型没有时，应用该启发式。那么在当前概念模型中必须放置一个“非此”（must-not）标签。构成该学习系统的元素可以总结为：\n\
    \n- 一种表示语言，几乎总是是框架系统（frame system）。\n- 一个用于校对结构的定向机制。\n- 一个泛化过程。\n- 一个特化过程。\n\
    - 一个节点为框架的语义网络。\n\n由于准示例通过使一个对象被视为某个概念示例的条件变得更加严格，因此它们限制了概念的外延范围。特化算法包含以下步骤：\n\
    \n1. 将当前概念模型与提供的准示例进行比较。建立双方现有的对应关系，并定位不相等之处。\n\n2. 确定两者是否存在差异：\n\n    2.1 如果只有一个差异，确定是当前概念模型还是准示例拥有对方不具备的标签。\n\
    \n    2.1.1 如果当前概念模型具有一个准示例中不存在的标签，则使用要求链接启发式。此操作的含义是：必须要求该标签的存在，以识别该概念的任何其他正例。例如，如果采用了该实例的描述\n\
    \n    2.1.2 如果准示例具有一个当前概念模型中不存在的标签，则使用禁止链接启发式。此操作的含义是：明确禁止该标签出现在该类的成员中。\n\n  \
    \  2.2 如果没有单一差异，则忽略该反例，因为它不是准示例。此操作的含义是：如果存在多个重要差异，则很难决定采取什么行动或按什么顺序采取。\n\n步骤\
    \ 2.2 引入了一个新问题：示例的呈现顺序。所学内容的质量直接取决于这种学习；如果序列不恰，概念就无法被学会。因此，在这种学习中，教师的参与是决定性的。\n\
    \n泛化过程允许扩展所学概念所涵盖的对象（实例）范围。Winston 提出了两种策略来使这一操作可执行。这些策略是爬树（climb-tree，提升泛化树）和扩大集（enlarge-set，增加属性可能值的集合）。在下面所示泛化算法中，你可以看到它们在什么情况下适用以及产生的效果：\n\
    \n- 1. 比较当前概念模型和一个正例。\n- 2. 对于每个差异，确定其类型。\n\n    2.1 如果差异在于标签 `{属于当前概念模型}` 指向一个不同的类。如果该类属于某个泛化树（某个层级结构），则当前概念模型将向泛化演化。有两种情况：\n\
    \n        2.1.1 如果类属于同一个泛化树的一部分，则使用爬树策略。当两个表示在结构上等效时，这种策略是有意义的，因为在这种情况下差异必须在某些属性的值中寻找。如果从初始弧描述开始，引入正例，则算法会将过梁（lintel）的形状泛化为形状属性泛化树中直角和三角形的前驱节点，即多边形。\n\
    \n        2.1.2 如果新标签不在泛化树中，则删除该标签。这种策略在爬树策略失效时应用。这种消除（标签）的含义是：根据当前信息（当前的备用知识）无法构建抽象，那么，可能它并不重要。\n\
    \n        2.1.3 应用扩大集。该策略的工作原理如下：假设在初始弧描述中，过梁是蓝色的。如果发现另一个正例实例，其过梁是白色的，且颜色属性没有泛化树，那么\
    \ Winston 的算法将修改当前的弧模型，使过梁可以是蓝色的或白色的。这样，概念就被泛化了，因为接受实例作为弧的可能情况范围正在扩大。\n\n    2.2\
    \ 如果差异在于当前概念模型或示例中缺失标签，则移除该标签。例如，如果在弧模型中没有找到颜色属性，那么即使该属性在之后看到的概念正例中出现，该属性也不会被考虑在内。\n\
    \n    2.3 如果差异出现在与属性（或插槽）关联的值上，则必须限制范围（闭合区间）。例如，如果弧模型的某处颜色属性是嵌套的但没有值，而在正例中它具有某个值，则将该值包含在模型中。\n\
    \n    2.4 在任何其他情况下，忽略该差异。\n"
