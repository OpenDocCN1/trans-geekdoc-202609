    \ 和 $P3$。\n\n# 第 8 章 - AUTOCLASS\n\n该系统开始的理论基础 ([DUDA73]) 基于贝叶斯理论，利用了概率理论领域大量的广泛工作。使用这种技术比以前的方法具有优势：\n\
    \n- 类的数量是自动决定的。类的产生来自于对属性分布先验知识的使用。先验概率倾向于更简单的类，而获得的后验概率需要不复杂的类。这两者之间的平衡提供了最适合数据的类数量。\n\
