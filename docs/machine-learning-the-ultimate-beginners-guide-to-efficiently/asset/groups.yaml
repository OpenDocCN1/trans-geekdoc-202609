    function that measures the quality of the groupings obtained. The biggest problem
    is deciding which parameters are used to measure it.


    It is clear that the descriptions that are obtained have to be simple to be able
    to give them a clear interpretation, but this may contradict the need for the
    data to be adequately covered by the descriptions since they may need some complexity
    to do so with precision.


    We find the same problem as in numerical taxonomy when trying to minimize the
    similarity between the objects of a class and maximize the dissimilarity between
    the different classes. The optimality of the classes obtained, therefore, must
    be a balance between the simplicity of the characterizations that are extracted
    and the adequacy of these to the


    To measure the adequacy of the observations to the descriptions, the dispersion
    measure between the complexes mentioned above is used. The simplicity of the descriptions
    is calculated as the total number of selectors in all descriptions. To find the
    distance between the groups, add the number of complexes that exist in the different
    descriptions that do not intersect with each other, thus favoring the groups with
    the largest number of different properties. Discrimination capacity is calculated
    as the number of attributes that take different values in all classes. The reduction
    of the number of minimum dimensions is measured as the number of attributes necessary
    to distinguish between different classes.


    The algorithm is based on the optimization of a function that combines all these
    criteria. Each one has a weight that indicates its importance when evaluating
    a classification. These weights are indicated in what is called the evaluation
    lexicographical function with tolerances.


    ## 6.12 - Lexicographical Evaluation Functional (LEF)


    This is defined as a list of criteria-tolerance pairs, in which each pair indicates
    the degree of compliance that the classifications must observe with respect to
    each criterion. Given a set of competing classifications, the classification that
    meets all the criteria at the same time will be chosen.


    The algorithm used to build a classification from a data set consists of two parts.
    A first step that builds the base classes that are optimally partitioned, according
    to the evaluation function (LEF) from the set of observations and a second step
    that builds a hierarchy from these base classes.


    The basic algorithm for partitioning the initial observations is as follows:

    We start from:

    - A set of observations (O).

    - The number of classes you want to get (k).

    - The evaluation criterion (LEF).


    Algorithm:


    1. An initial set of k initial seeds of set O is determined that can be chosen
    at random or according to some predetermined criteria.

    2. A star is generated for each of the seeds. That is a set of complexes that
    include each seed without including the rest.

    3. The stars are modified to be disjoint with each other, making the complexes
    that form the more specific so that there are no intersections between them.

    4. At this moment there is a possible partition of the objects represented by
    k disjoint stars. If it is the first step of the algorithm, this partition is
    saved, if it is not, the evaluation function (LEF) is applied to see if the improvement
    over any of the best previous partitions. In the event that several partitions
    satisfy the evaluation function, all are retained. The algorithm terminates at
    this point if after a predetermined number of steps no part appears that is better
    than what is optimal at this time.

    5. If the optimum has not been reached, new seeds are selected, one for each class.
    Two criteria are used, or the object is chosen within a class closer to its geometric
    center, or the furthest. The first strategy is chosen whenever this increases
    the quality of the partition when this ceases to happen, the most distant objects
    are chosen. From here the algorithm is repeated from step 2.


    The result of the algorithm is k-complexes that cover all observations disjunctly
    and that maximize the criteria of the LEF function. The generation of the hierarchy
    is done by recursively applying the class generation algorithm to each of the
    classes initially obtained until a certain criterion determines that the number
    of levels is sufficient. The hierarchy is therefore created from the most general
    classes to the most specific (top-down).


    The successor of CLUSTER / 2 is CLUSTER / S [MICH86]. In this, the expressive
    power of the representation of the observations is extended from an attribute-value
    representation to one based on the calculation of first-order predicates (CP1),
    which is called Calculation of Predicates with Annotations (Annotated predicate
    calculus (APC)). This allows you to make descriptions of structured objects (composed
    of parts).


    The APC includes the calculation of predicates annotations in each predicate,
    variable, and function indicating, among other information, its type and the attributes
    that are related to it. This extends to the expressive capacity of the s-complexes
    that were used in CLUSTER / 2, also giving the ability to make deductions between
    attributes.


    This improvement emphasizes the background knowledge that is necessary to include
    to achieve a better classification. In addition to the evaluation function (LEF)
    already used, new knowledge is included that consists of a network of classification
    objectives, inference rules and heuristics to deduce new more general descriptors
    from those used in the description of the objects, of definitions of the value
    domains of the attributes and their types. This network is called the Goal Dependency
    Network (GDN).


    When making a classification, an objective is included as input data that together
    with the information of the annotations and the GDN is used to guide the classification
    algorithm and that allows deducing from the existing attributes new attributes
    that they allow to improve the classification and help to decide which are the
    most useful attributes.


    The part of the algorithm that involves the greatest cost is the generation of
    disjointed stars from the seeds, it has an exponential cost. You can consult [MICH84b]
    to know the heuristics applied to reduce this cost.


    ## Chapter 7 - WITT


    The proposal of the previous methodology falls within the classical vision of
    categorization from the point of view of cognitive psychology, but it has already
    been seen that assuming the categories must be represented by necessary conditions
    and its clients are something too restrictive and that human categorization is
    really far from being that way. This method is based on four results of cognitive
    psychology to support their hypotheses: The categories tend to have members that
    are not described by sufficient and necessary characteristics. It is what is denoted
    as a polymer. The categories have a distribution among their members. Categories
    can be represented by intercorrelations and relationships between the attributes
    that describe them. Discovering and using these relationships can be important
    to understand the structure of each category and understand its nature. The categories
    arise from their contrast with the others. Each category makes sense so that the
    difference between those who live with it in the same

