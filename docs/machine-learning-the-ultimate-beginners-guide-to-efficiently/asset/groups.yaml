    solve a problem and modify these decisions when the conditions so require. Therefore,
    one of the central objectives of this area is to build systems (agents) that are
    able to adapt dynamically and without prior training to new situations and learn
    as a result of solving the problem (or problems) that these situations present.


    Machine Learning, also called art learning is an area of interest that is highly
    developed in AI. In other areas such as biology, psychology, and laof, the nature
    of the ability to learn related to biological systems and to a man, in particular,
    has also been investigated.


    Understanding learning for example, the human learning process in a way that allows
    reproducing aspects of such behavior using a computer is a very ambitious goal.
    Although some researchers have also explored this possibility of using other animals
    as a model, the results are still poor.


    As we have already seen, learning is a very general term that denotes the form,
    or forms, in which an animal (or a machine) increases its knowledge and improves
    its performance abilities in an environment. In this way, the learning process
    can be seen as a generator of changes in the learning system which, on the other
    hand, occur slowly, adaptively and can be revoked or extended.


    In this context, it is said that a system that learns in an automated way (or
    apprentice) is an artifact (or a set of algorithms) that, to solve problems, make
    decisions based on the experience accumulated in the cases previously solved to
    improve his performance. These systems must be able to work with a very wide range
    of input data types, which may include incomplete, uncertain data, noise, inconsistencies,
    etc. Our first characterization of the machine learning process is:


    Learning = Selection + Adaptation


    Seen this way, machine learning is a process that takes place in two phases. One
    in which the system chooses (selects) the most relevant characteristics of an
    object (or event), compares them with known if they exist through some collation
    process (Pattern Matching) and, when the differences are significant, they adapt
    your model of that object (or event) according to the result of the collation.
    The importance of learning, as has been said, is that its results usually translate
    into improvements in the quality of the system''s performance. An artificial learning
    system can employ very different techniques to take advantage of a computer''s
    capacity, regardless of its relationship to human cognitive processes. These techniques
    include very mathematical methods, search methods on large databases, etc., which
    require the creation (or modification) of structures representation of knowledge
    appropriate to expedite the identification of the relevant facts.


    One of the most important motivations in the design and construction of automatic
    learning systems lies in the fact that in many domains the experience is scarce,
