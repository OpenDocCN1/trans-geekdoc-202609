  md: '# Chapter 1 - Historical Review


    A brief history of the development of research on machine learning in AI is as
    follows:

    1.


    +   - Initial enthusiasm (1955-1965)

    - Learning without backup knowledge

    - Neural Modeling

    - Evolutionary learning


    Among the most significant milestones of this period are the perceptrons, the
    notions of self-organization, self-stabilization, and pattern matching as basic
    tools in the learning processes. The systems developed at this time are characterized
    by the almost absolute lack of supporting knowledge or initial knowledge. The
    ANALOGY system should be considered as a transition.

    2.


    +   - Dark stage (1965-1976)

    - Acquisition of symbolic concepts

    - Acquisition of language


    In the second epoch, the problems were essentially transferred to the obtaining
    of representation schemes in order to ensure the correct acquisition of new'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'knowledge (ie knowing what the knowledge issues are after a learning process
    ). Associated with this trend structures, called hierarchies, were designed to
    organize the concepts (see section 2.5). This type of learning consists of the
    inference and assimilation of new material composed of concepts, general laws,
    procedures, etc. These systems rest on the existence of a human \ teacher who
    supervises learning.


    # 3.


    +   - Renaissance (1976-1986)

    - Exploring different strategies

    - Knowledge-intensive Learning

    - Successful applications


    At this time, it is explored how to combine symbolic learning techniques to improve
    the "quality" of what has been learned. It is explored with the use of large amounts
    of supporting knowledge. The first real applications appear.


    # 4.


    +   - Development (1986-Present)

    - Connectionist Learning

    - Multi-strategy systems

    - Experimental comparisons'
