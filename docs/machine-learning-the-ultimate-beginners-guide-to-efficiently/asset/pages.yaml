    innate way and, when they perceive alterations in their environment and change
    their behavior patterns {as a result of this perception}, they can be said to
    learn. From this point of view, learning can be established as the organization
    (or reorganization) of one's behavior (in the face of a situation or pattern of
    stimuli) as a result of individual experience. The previous one indicates a minimum
    of characteristics that a phenomenon must present in order to be classified as
    an example of learning and avoid, as much as possible, the confusion that can
