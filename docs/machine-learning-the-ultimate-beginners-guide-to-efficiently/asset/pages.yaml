    Mitchell [MITC82] proposed a unified framework for learning concepts called version
    space. This method assumes that the process of learning a concept takes place
    in a nest space H between two sets of hypotheses called G and S. The set G contains
    the most general elements of H. In S, on the contrary, the more specific elements
    accumulate. An elementary'
