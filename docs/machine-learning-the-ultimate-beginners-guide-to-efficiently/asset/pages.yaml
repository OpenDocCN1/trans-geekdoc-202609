- pgno: 160
  md: '# Chapter 10 - UNIMEM and CYRUS


    UNIMEM [LEBO87] and CYRUS [KOLO83] are the next generations of concept formation
    systems. They adopt the ideas of EPAM regarding the construction of a hierarchy
    and the incremental introduction of the instances. The main difference is that
    in both cases each level of the hierarchy is distinguished from the following
    through a set of attributes unlike EPAM, in which each level was distinguished
    only by one attribute.


    These systems were designed to create indexes for the efficient retrieval of information
    and fall within the area of generalization-based memory. The representation of
    the knowledge they use is the usual attribute-pairs value, but unlike the previous
    method, both classical and linear values are allowed. The hierarchy that is constructed
    has a description associated with each node, instead of only in the terminal nodes
    as in EPAM. This description consists of a list of attribute-value pairs where
    each pair has an'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'associated number that represents the trust (confidence) in the attribute.
    In addition to this value, the number of times that appears in the nodes of the
    hierarchy is included for each attribute, using this value as a measure of the
    predictability of the attribute.


    The UNIMEM algorithm classifies the instances starting from the hierarchy root
    comparing with each of the non-terminal nodes until they are integrated. The method
    is as follows:


    Given a node the attributes of this are compared with those of the instance. To
    calculate the similarity between the instance and the nodes a distance function
    is used, and a parameter determined by the user is used to limit the number of
    attributes in which they should be similar. With this method, it is possible that
    the instance was classified into several different branches.


    Whether the descendants coincide or not, the values of trust and predictability
    are modified taking into account the instance.


    +   - If there are descendants that match the instance, follow the path of the
    nodes that most resemble each other and match the values of the'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'instance.


    +   - If no descendant reaches the limit of similarity, the instances stored under
    that node are examined.

    - If any of these shares its current values with the new instance, depending on
    another user parameter, a new node is created generalizing the similar instances
    and these instances are stored under the new node. When this happens, the algorithm
    increases the predictability of the attributes that appear in this new node.


    If there is no sufficiently similar instance, the new instance is stored under
    the current node. With this algorithm, an instance can be classified into several
    categories, so there is an overlapping between the different classes. This can
    be an advantage for some domains, as it allows maintaining at the same time several
    categories that can be useful at a certain time and that with the incorporation
    of new instances can disappear leaving only the best ones, thus helping in the
    search within the space of possible hierarchies. Added to the algorithm, there
    are certain parameters specified by the user that help direct the search by modifying
    the attributes in the nodes. The confidence value of the attributes is increased
    or decreased'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'depending on whether or not the instances coincide with each of them. If this
    exceeds a certain parameter, the corresponding attribute is jado, and new instances
    will not modify it, giving its value as safe. If this is smaller than another
    parameter, it is made to disappear from the node description. If the predictability
    of an attribute of a node becomes very high, the attribute of the descendants
    of that node is eliminated, thereby reducing the frequency with which a concept
    is used to guide the classification. Finally, if the number of attributes in the
    description of a node is smaller than another parameter, it is eliminated, since
    it will be a node that is too general and not very useful for classifying instances.


    The main advantages of these methods with respect to their predecessor (EPAM)
    are several. The first is to incorporate a description to each of the nodes in
    the hierarchy instead of just the terminal nodes. Another one is to introduce
    more than one attribute as a decision element between each of its levels. They
    are also introduced in measures of how each of the attributes is useful for classifying
    the instances, dynamically modifying the weight of each one of them. Despite these
    advances, there are still many'
  merge: -1
  img_proc: true
- pgno: 164
  md: problems, such as the large number of parameters that the user must use to guide
    the application of the different operators that are used to modify the hierarchy
    and guide learning.
  merge: -1
  img_proc: true
