  md: '# 4.3 - Michalski-Dietterich Method


    This section will discuss the method of determining the more specific conjunctive
    generalizations described by Michalski and Dietterich in [DIET81]. They describe
    the examples of entry in language V L21, which is an extension of the logic of
    first-order predicates. Each example is a conjunction of selectors, which usually
    contain a predicate descriptor (with variables such as arguments) and a list of
    the values that the predicate can have. Another form of the selector is predicated
    n-Aryans in square brackets, which are interpreted in the usual way.


    In this method, unary descriptors (or attribute descriptors) and non-unary descriptors
    (or structural descriptors) are treated differently. The idea is first to look
    for plausible generalizations in the structural space, and then to search the
    attributes space to fill in the details of these generalizations. Basically, they
    do so to reduce the search space of generalizations, taking into account at the
    beginning only the structural aspect of the examples.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'The part of obtaining generalizations in the method being examined works as
    follows [DIET81]. The algorithm searches for the beam search type ([RUBI77]) in
    the structural space. This search is a way of first looking for the best (search)
    in which a set of the best candidate descriptions that have been obtained so far
    is maintained.


    First, all the unary descriptors of the examples are eliminated, thus remaining
    only with the structural part of them. An example is chosen randomly and the initial
    set of generalizations is taken as B0. At each step, the least promising generalizations
    are first removed from Bi. The criteria to evaluate the generalizations can be
    given by the user, and the program also has some built-in criteria, such as maximizing
    the number of examples covered by a generalization or maximizing the number of
    selectors in a generalization, for example.


    Then it is checked if any of the generalizations of Bi covers all the examples.
    If so, they are passed from Bi to set C, where candidate conjunctive generalizations
    are stored.'
  merge: -1
  img_proc: true
