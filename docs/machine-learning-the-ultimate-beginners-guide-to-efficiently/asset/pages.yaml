- pgno: 166
  md: '# Chapter 11 - Conclusion


    Thank you for making it through to the end of Machine Learnin, let’s hope it was
    informative and able to provide you with all of the tools you need to achieve
    your goals whatever they may be.


    To conclude, machine learning has as its basic paradigm learning based on explanations
    or EBL. This type of learning aims to capture the type of human learning through
    a single example of input and with a great deal of experience (theory) of a domain
    we are able to generalize. The EBL has as inputs a complete domain theory, an
    example, and an objective concept. The result is the improvement of the theory
    of the initial domain that normally consists of the incorporation of a new operational
    concept of the objective concept, a more efficient plan. The advantage of deductive
    methods over inductive methods is that the proposed generalizations are always
    correct. The main drawback is the large amount of domain knowledge that is needed.
    In addition, this theory must be complete, otherwise the'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'behavior of the system in the new problems is not guaranteed.


    The new trends are the construction of architectures that integrate deductive
    and inductive learning. With this integration, it is intended to complete theory
    with the use of cases already resolved.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!


    Denny Novikov'
  merge: -1
  img_proc: true
