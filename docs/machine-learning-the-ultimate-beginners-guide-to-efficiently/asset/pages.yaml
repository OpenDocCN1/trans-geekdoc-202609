- pgno: 171
  md: '# MACHINE LEARNING


    Are you thinking that as much as we want to look for logical frameworks for intelligence,
    there is no certainty or scientific proof that intelligence is as structured as
    we believe it to be?


    As in the evolutionary process, where chaos and order wisely coexist, I see a
    research gap related to our brain and mind, typically related to focusing on models
    based solely on order.


    But if we are researching Artificial Intelligence, why are we so attached to the
    order and models that are supposed to be those of our brain?


    Or, what binds us so much to what we see only, without opening spaces to what
    we don''t see if only to consider small pieces of chaos?


    For this openness and vision, when it comes to intelligence, I propose a new concept:
    that of unstructured intelligence, which I will try to explain in this book.


    We are actually talking about machine learning - unsupervised to generate labels
    for machine learning.


    And creativity, in my view, is one of the essential links to evolve in understanding
    and formalizing new machine learning models.


    DENNY NOVIKOV


    ![](img/9c448b3ffa658996909504456f0161c0_171_0.png)'
