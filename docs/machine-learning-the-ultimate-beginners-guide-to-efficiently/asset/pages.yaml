    it is possible to construct a space of consistent formula versions among which
    the concept is to be learned. Here the set of consistent formulas can be nested
    formulas as the set of complete formulas, that is, they recognize all the positive
    and coherent instances, which do not recognize the negative ones. The construction
    of this space is carried out through the generalization and specialization of
    concept C due to the presence of positive and negative instances. In addition,
