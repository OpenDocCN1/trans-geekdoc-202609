    # Automatic Learning


    Learning refers, as has been seen, to a wide spectrum of situations in which the
    learner increases his or her knowledge or ability to complete a task. Learning
    applies inferences to certain information to construct an appropriate representation
    of some relevant aspects of reality or of some process.


    A common metaphor in the area of machine learning {within Artificial Intelligence}
    is to consider problem-solving as a type of learning that consists of being able
    to recognize the problem situation Attica and react using the strategy learned.
    Currently, the greatest distinction that can be drawn between an animal and a
    problem-solving mechanism is that certain animals are able to improve their performance,
    in a wide range of tasks, as a result of having solved a certain problem.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'It is assumed, in this approach, that an automatic agent must have the ability
    to perform the same task in several ways, if possible, and depending on the circumstances.
    You must be able to make decisions about what is the most appropriate course to
    solve a problem and modify these decisions when the conditions so require. Therefore,
    one of the central objectives of this area is to build systems (agents) that are
    able to adapt {dynamically and without prior training} to new situations and learn
    as a result of solving the problem (or problems) that these situations present.


    Machine Learning, also called art learning is an area of interest that is highly
    developed in AI. In other areas such as biology, psychology, and laof, the nature
    of the ability to learn related to biological systems and to a man, in particular,
    has also been investigated.


    Understanding learning {for example, the human learning process} in a way that
    allows reproducing aspects of such behavior using a computer is a very ambitious
    goal. Although some researchers have also explored this possibility of using other
    animals as a'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'model, the results are still poor.


    As we have already seen, learning is a very general term that denotes the form,
    or forms, in which an animal (or a machine) increases its knowledge and improves
    its performance abilities in an environment. In this way, the learning process
    can be seen as a generator of changes in the learning system {which, on the other
    hand, occur slowly, adaptively} and can be revoked or extended.


    In this context, it is said that a system that learns in an automated way (or
    apprentice) is an artifact (or a set of algorithms) that, to solve problems, make
    decisions based on the experience accumulated {in the cases previously solved}
    to improve his performance. These systems must be able to work with a very wide
    range of input data types, which may include incomplete, uncertain data, noise,
    inconsistencies, etc. Our first characterization of the machine learning process
    is:


    Learning = Selection + Adaptation'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Seen this way, machine learning is a process that takes place in two phases.
    One in which the system chooses (selects) the most relevant characteristics of
    an object (or an event), compares them with other known {if they exist} through
    some collation process (Pattern Matching) and, when the differences are significant,
    they adapt your model of that object (or event) according to the result of the
    collation. The importance of learning, as has been said, is that its results usually
    translate into improvements in the quality of the system''s performance. An artificial
    learning system can employ very different techniques to take advantage of a computer''s
    computing capacity, regardless of its relationship to human cognitive processes.
    These techniques include very mathematical methods, search methods on large databases,
    etc., which require the creation (or modification) of structures representation
    of knowledge appropriate to expedite the identification of the relevant facts.


    One of the most important motivations in the design and construction of automatic
    learning systems lies in the fact that in many domains the experience is'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'scarce, and the coding of the knowledge that describes it is limited, fragmentary
