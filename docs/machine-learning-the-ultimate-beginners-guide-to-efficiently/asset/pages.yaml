- pgno: 156
  md: '# Chapter 9 – EPAM


    EPAM can be considered as one of the first concept formation models. It aims to
    serve as a model of human learning in the tasks of verbal memorization, using
    it to explain a series of phenomena in learning observed by psychologists.


    The representation of knowledge in EPAM is made from attribute-value pairs where
    each component can, in turn, have a list of descriptors so that the description
    of objects composed of parts is allowed. The learning algorithm is capable of
    constructing from the observations a decision tree in the style of ID3 [QUIN86]
    where each non-terminal node of the hierarchy corresponds to a test on an attribute,
    and from which branches correspond to Different attribute values. Unlike decision
    trees, it is not assumed that all the values of an attribute are known, so in
    all non-terminal nodes, there is a special branch labeled as others for the new
    values that may appear. In the terminal nodes


    The learning algorithm works by checking the different'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'tests found in the nodes of the hierarchy starting at the root until reaching
    a terminal node. The process is the following:


    +   - If the node on which it is located is non-terminal, the value of the observation
    on the attribute that marks the node is checked.


    +   - If there is a branch in the node with the value of the object, the process
    is applied recursively from the node to which that branch points.


    +   - If there is no such branch, it is followed by the one labeled as others
    and the process is recursively applied from that node.


    +   - If the node on which it is located in the terminal. If the observation coincides
    with the concept stored in the node, a familiarization process is carried out.
    This process consists of adding to the node one of the attributes that the observation
    possesses and does not possess.


    +   - If any of the attributes of the observation does not match the node, a discrimination
    process is carried out. The difference may be due to two causes: 1. The observation
    may have been classified by going through some branch labeled as others. If so,
    the branch is detected and a new one is added that'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'contemplates the value of the observation, thus increasing the width of the
    tree.


    2. If the difference is in the terminal node and not in the attributes of the
    path that led to it, a new decision node is created that contemplates the two
    different values for the attribute in question. A branch is constructed for the
    value of the node and another for the observation and a terminal node is created
    for each one. In this way, the depth of the tree is increased.


    The importance of this method lies in the influence it had on the methods that
    were developed below. He was the first to introduce the use of a hierarchy of
    concepts and to integrate the classification and learning tasks into an incremental
    algorithm. In addition, it introduces the familiarization and discrimination operators
    for the construction process of the hierarchy of concepts.'
  merge: -1
  img_proc: true
