    #  1.1 - Machine Learning Paradigms


    Depending on the type of selection and adaptation (transformation) that a system
    performs on the available information, it is possible to identify several paradigms
    of machine learning. This classification has evolved rapidly in the last decade.


    #  1.2 - Deductive Learning


    This type of learning is done through a sequence of deductive inferences using
    known facts or rules. From the known facts new facts or new relationships are
    logically derived. In this type of system, the monotonicity of the theory of nests
    by the knowledge'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'base is important.


    # 1.3 - Analytical learning


    The methods used in this type of learning attempt to formulate generalizations
    after analyzing some instances in terms of system knowledge. In contrast to empirical
    learning techniques {which are usually methods based on similarities}, analytical
    learning requires that a broad domain knowledge be provided to the system. This
    knowledge is used to guide the deductive chains that are used to solve new problems.
    Therefore, these methods focus on improving the science of the system, and not
    on obtaining new descriptions of concepts, as inductive learning does.


    # 1.4 - Logical Learning


    This type of learning tries to emulate some of the most amazing human capacities:
    to be able to understand a situation by its resemblance to previous'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'known situations, to be able to create and understand menses or to solve a
    problem by noticing its possible similarity with others seen previously adapting
    (transforming) conveniently the solution that was found for these problems. This
    type of system requires a great deal of knowledge. Some authors consider that
    analog learning is a specialization of learning by explanation that will be discussed
    later.


    # 1.5 - Inductive Learning


    It is the most studied paradigm in machine learning. Normally, these systems lack
    a theory of the domain, that is, they do not know a priori the objects they deal
    with or their quantity. It deals with problems such as inducing the description
    of a concept from a series of examples and counterexamples thereof or determining
    a hierarchical description or classification of a group of objects.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.6 - Learning Through Discovery


    The type of discovery is a restricted form of learning in which an agent acquires
    knowledge without the help of a teacher. This process occurs when there is no
    available "source" that possesses the knowledge that the agent seeks. A particular
    type of Discovery is carried out when an agent tries to group objects that he
    assumes from the same set.


    # 1.7 - Ethical Gene Algorithms


    Genetic algorithms are inspired by mutations and other changes that occur in organisms
    during biological reproduction from one generation to the next and in Darwin''s
    natural selection process. The main problem that he tries to solve is the discovery
    of rules and the greatest difficulty he encounters is the allocation of credit
    to them. This last point consists of positively or negatively assessing the rules
    according to how useful they are to the system. This assessment is the one to
    determine which rule to apply to solve'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'given problem.


    # 1.8 - Connectionism


    Another way of conceiving an automatic learning system is the so-called connectionist
    approach. In this approach, the system is a network of interconnected nodes, which
