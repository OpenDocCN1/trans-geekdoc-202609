- pgno: 12
  md: 'Frequently in the literature, learning is considered an adaptive process, that
    is, it is manifested by gentle, incremental changes. The adaptability of learning
    is considered here as the measure of adjustment of behavior. In addition, it is
    assumed that what has been learned remains in memory for relatively long periods,
    so as to ensure the observability of the learned behavior (as something relatively
    stable).


    What an animal can learn does not depend solely on its ability to do so, since
    there are many other restrictions and limitations that shape this ability (eg
    limitations in its sensory systems). Thus, given these limitations, an animal
    is more predisposed to react to one type of stimulus than others, can learn more
    from these than those. Moreover, all the stimuli to which an individual responds
    in a certain context may not be effective in producing learning behavior in other
    contexts.


    The ways of defining learning and interpreting observed behaviors depend fundamentally
    on the way of considering the nature of the learner. As a consequence, learning
    should be considered as one of'
  merge: -1
