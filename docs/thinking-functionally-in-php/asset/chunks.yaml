    概念计算和编程有许多不同的范式，但最古老且应用广泛的是`procedural programming`（过程式编程）和`functional programming`（函数式编程）。两者都在
    20 世纪 30 年代相继被开发，并且已被证明是等价的；也就是说，没有哪个过程式方法能解决的问题是函数式方法无法解决的，反之亦然。某一种范式可能更容易编写、更容易阅读、更容易思考、性能更高，或者需要的代码行更少。哪种范式具有“优势”视取决于具体情况而异，但如果可以在其中一种中解决问题，那么在另一种中也同样可行。


    有人可能会认为，既然两者能力对等，程序员只需要学习一种就能解决任何可解决的问题。这是一种短浅的观点。按照这个逻辑，人们只需要学习一种`Turing-complete`（图灵完备）语言就足够，因为根据定义，所有`Turing-complete`
    语言的能力都是等等的。


    虽然用“用正确的工具做正确的事”这种陈词调很老套，但它之所以成为陈词调是因为它是真实的。但要为任务选择正确的工具，至少需要精通多种工具。在编程领域，这意味着至少要精通多种编程语言以及多种编程范式，仅仅是为了知道在何时*不应该*使用某一种。


    然而，大多数编程资源都是面向过程式思维的。这并不意外。这是最易于向新开发者解释的方法，而且归根结底，世界上几乎所有的计算机硬件都是过程式的；任何其他东西仅仅是汇编语言之上的语法糖。尽管如此，遗憾的是，过程式也是在扩展到大规模系统、并发以及
    21 世纪计算那堆糟糕且复杂的乱象局面时，扩展性最差的范式。


    函数式编程和过程式编程的共同点（至少在它们的现代形式中）是将程序划分为独立的逻辑块，这些逻辑块可以进行混合组合和重用。然而，尽管语法通常相似或相同，但函数式编程更进了一步，它将这些逻辑块视为“一等公民”，可以动态地创建、修改、传递，甚至存储和重用。我们将在第一部分看到具体的示例。


    ## 面对象代码


    如今主导的编程范式既不是函数式的也不是过程式的，而是`object-oriented programming`（OOP，面向对象编程）——至少，这是传统常识。这种传统常识的一个问题是，OOP
    是一个非常松散的范式，包含了几个实际被使用的子范式。其中，最常见的是我所称的“经典 OOP”，即基于类（classes）的 OOP。`C++`、`Java`、`C#`
    和 `PHP` 都属于这个家族，而且随着 `ECMAScript` 6 JavaScript 引入了显式类，它也变得如此。


    然而，OOP 还有其他变体，其中某些甚至不包含核心的“继承”概念。在实践中，野外的大多数 OOP 代码都是我所称的“过程式 OOP”，即封装在 OOP 风格中的过程式思维。这并不一定是一件坏事；它是当今的主流模型，所以它一定在某些方面是正确的。然而，它不是完全以消息为中心的
    OOP（如 `Smalltalk`）。这也意味着确实存在所谓的“函数式 OOP”或“对象-函数式”代码。


    与 Reddit 的共识相反，OOP 和函数式编程并不是迫使你选择某一种“唯一真代码范式”的敌对。相反，我们可以并且应该利用两者的教训，为问题产生最佳解决方案。


    ## 函数式风格？函数式语言？


    理解函数式编程的一个困难点在于，就像面向对象编程一样，函数式编程并没有一个清晰的定义。在某种层面上，它仅仅是“像数学那样使用函数进行编程”，这是一个优美但无趣的定义。然而，这样做会迅速陷入范畴、单群（monoids）、自算子（endofunctors）、泛型类型系统、病态递归以及其他听起来很怪的词汇和短语的深渊，这些会让最开放的观众也望而却步。在很多情况下，它看起来像是一个无意的[莫特-贝利谬误](https://rationalwiki.org/wiki/Motte_and_bailey），一种[非正式逻辑谬误](https://en.wikipedia.org/wiki/List_of_fallacies#Informal_fallacies），即某人同时论证两个相关的论点，一个有争议而一个没有，并根据此刻哪一个更有利而在两者之间切换。事实上，并没有函数式编程的通用定义，函数式语言亦何之。如果“函数式语言”意味着“一种可以进行函数式编程的语言”，那么几乎所有现代语言都是函数式的；这不是一个有帮助的定义。更好的定义是将`functional-style
    programming`（函数式风格编程）与`functional language`（函数式语言）区分开。


    - `Functional-style programming` 是处理问题的特定方法。它包含了几个简单的核心概念，以及一系列从这些概念自然产生的大量概念。其中大多数并非非黑即白，这使得在任何现代语言中编写“类函数”代码成为可能，即使语法可能显得有些笨拙。

    - `functional language` 是一种语法和语义旨在让函数式风格编程更简单、更自然的语言，通常（并非总是）是以牺牲其他特性为代价的。这些函数式概念通常是语言内置假设，如果你没有意识到这些，可能会碰跟头。

    - `strictly functional language`（严格函数式语言）是一种语法和语义仅旨在以函数式风格编写的语言。这些语言一直深入深渊，使得以其他方式思考问题变得不可能。它们还因难以理解而闻名，正因为它们只支持函数式模型。


    特别是 PHP，是一种为过程式优化的语言；它支持经典 OOP，这也是目前最广泛使用的风格，但单线程、无共享的架构本质上是过程式的。然而，从 PHP 5.3
    开始，它就对函数式风格编程有了语法支持。PHP 7.4 引入的短构造函数进一步简化了它，使得函数式风格代码现在完全可行。尽管如此，我会提倡在 PHP 中编写
    100% 的纯函数代码吗？并不真的。函数式代码的许多优势在单线程、无共享的环境中并不适用，其他虽然有效但会与语言的其他限制冲突，变得难以使用。


    ## 类型系统


    类型系统在函数式编程中非常棘手。一方面，类型系统与函数式编程完全正交且无关。某些函数式语言拥有极其健壮的类型系统（例如 `Haskell`），而另一些似乎完全没有（`LISP`）。然而，它们经常在函数式编程的语境下被讨论。为什么？


    答案在于之前的观察：函数式语言倾向于要么没有类型系统，要么有一个非常健壮。很少见到平庸的函数式类型系统。虽然函数式编程本身在任何方面都不要求显式类型系统，但在实践中，函数式代码鼓励并需要非常健壮的类型系统。


