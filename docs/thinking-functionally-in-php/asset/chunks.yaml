  trans: "\n3. 在函数字面量中：`[...$firstArgs, ...$secondArgs]` 意味着“$firstArgs` 中的所有值，紧接着是\
    \ `$secondArgs` 中的所有值，从而得到一个长的扁平化数组。”它是 `array_merge()` 简单得多的替代方案，是 PHP 7.4 引入的新特性。\n\
    \n因此，`partial()` 接收一个函数和任意数量的参数，作为一个名为 `$firstArgs` 的数组。它返回一个闭包了该数组和可调用函数，并接收任意数量的参数\
    \ `$secondArgs`，该函数会将所有参数拼接在一起并调用保存的原始函数。\n\n现在，使用这个新工具我们可以这样做：\n\n```\n1 $partial_volume\
    \ = partial('volume', 5, 4);\n2 print $partial_volume(8);   // 输出 160\n```\n\n\
    在这里实现的 `partial()` 仅允许预填充参数列表开头的值。在 PHP 7.4 的短匿名函数（short lambdas）中，我不认为这甚至是有必要的，因为下面的语法用更少的工作实现了相同的功能，并且支持替换我们想要的任何参数，甚至还能让我们提供类型信息：\n\
    \n```\n1 $volumeForLength = fn(float $y): float => volume(5, $y, 8);\n```\n\n\
    敏锐的读者可能记得，当我们引入闭包时，注意到它们实际上与对象构造函数相同，但语法更简洁。柯里化（Currying）将这个想法推向了逻辑终：对象的方法调用在概念上可以用单个函数表示，该函数接收所有的构造函数参数，然后是它自己的参数。构造函数只是创建了一个高度冗长的方法柯里化，该方法被其他方法共享。\n\
    \n我们的最后一个例子可以用这段等效（尽管极其冗长）的代码重写：\n\n```\n 1 class YVolumizer\n 2 {\n 3     private\
    \ float $x;\n 4     private float $z;\n 5 \n 6     public function __construct(float\
    \ $x, float $z)\n 7     {\n 8         $this->x = $x;\n 9         $this->z = $z;\n\
    10     }\n11 \n12     public function __invoke(float $y): float\n13     {\n14\
    \         return $this->x * $y * $this->z;\n15     }\n16 }\n17 \n18 $volumizerForLength\
    \ = new YVolumizer(5, 8);\n19 print $volumizerForLength(4);\n```\n\n显然，我更愿意花时间去输入哪一个。\n\
    \n柯里化很酷，但除了避免一些打字之外，它在实践中有用吗？事实证明是有用的，因为得益于短匿名函数，在实践中几乎任何函数都可以轻而地重写为单参数函数。而单参数函数允许我们做一些非常酷的事情，正如我们在后面的章节中看到的。\n\
    \n本章的核心要点是这行简单但极其强大的代码：\n\n```\n1 $volumeForLength = fn(float $y): float => volume(5,\
    \ $y, 8);\n```\n\n能够轻松定义新函数将任意纯函数转换为单参数函数，这开启了 PHP 以前未出现过的许多可能性，并在许多方面构成了后续内容的基础。\n\
    \n# 映射 (Mapping)\n\n除了“使用函数处理事务”的基础知识外，函数式编程倾向于使用一些额外的原语，用于构建算法结构而非典型的模式。它们中的大多数与列表的处理有关。\n\
    \n例如，在典型的过程化代码中，编写如下代码片段是很常见的：\n\n```\n1 $list = [ /* 一组数据 */]\n2\n3 $result =\
    \ [];\n4 foreach ($list as $value) {\n5     if ($value % 2 == 0) {\n6        \
    \ $result[] = $value * 2;\n7     }\n8     else {\n9         $result[] = $value;\n\
    10     }\n11 }\n```\n\n在这个非常常见的惯用法中，我们遍历一个列表来构建另一个。然而，从函数式的角度来看，它存在几个问题：\n\n1.\
    \ 应用于每个值上的操作与迭代行为耦合在一起，意味着你无法对其进行独立测试。\n2. 这反过来使其更难以阅读和理解。我们确实在遍历列表，但一眼并看出我们正在对每个项目应用相同的逻辑。同样无法立即看出应用于每个元素的计算是独立于其他元素的（它们是独立的，但你必须实际阅读代码才能发现）。\n\
    3. 它涉及可变变量。\n\n思考这项任务更具函数式的方法是将迭代和操作分开考虑。与其将问题概念化为“我想逐个遍历整数列表并对每个整数做些什么”，不如将其概念化为“我有一个接收整数并返回另一个整数的操作，我想将该操作应用到此列表中的每个值”。这自然分为两个部分。首先是我们想要应用到值上的（纯）函数。在我们平凡的例子中，该函数看起来如下：\n\
    \n```\n1 $operation = function(int $val): int {\n2     if ($value % 2) {\n3  \
    \       // 奇数。\n4         return $value;\n5     }\n6     else {\n7         //\
    \ 偶数。\n8         return $value * 2;\n9     }\n10 };\n11\n12 // 或者，更简洁地：\n13 $operation\
    \ = fn(int $val): int => $value % 2 ? $value : $2;\n```\n\n第二部分是将该函数应用于列表的每一个值。这种操作被称为\
    \ `map`（映射）。\n"
- fmt: "\n3. Because `int` involves a function boundary, we can enforce type checks\
    \ in the applied operation. This is largely a PHP-specific benefit, but a benefit\
    \ nonetheless.\n\n4. The null case is handled more gracefully. We don’t need to\
    \ pre-create an empty `$result`, because if `$list` is empty, we get an empty\
    \ `$result` naturally. Less edge case handling is always a benefit.\n\n5. It’s\
    \ no help in PHP, but in a multi-threaded or multi-process language the independence\
    \ of each transformation means they can be split across multiple threads, process,\
    \ processors, or computers transparently, without changing the program logic at\
    \ all, just changing the internal implementation of `map()`. Or it could be done\
    \ manually by writing a new `map()`-like routine that uses a queue service of\
    \ some kind, since the actual operation itself is now separately defined.\n\n\
    Finally, it allows code to be more declarative; the code describes what you want\
    \ (a mapping of a function to a list) rather than how to do it (iterating and\
    \ populating an array). The “how to do it” is still defined somewhere, but it’s\
    \ separated out from the main flow of control of the application.\n\n# Filter\n\
    \nConsider for a moment this procedural code:\n\n```\n1 foreach ($users as $user)\
    \ {\n2     if ($user->lastPaidDate() < date('-1 month')) {\n3         send_email($user->email(),\
    \ \"Overdue bill\", \"Pay up, slacker!\");\n4     }\n5 }\n```\n\nThere are at\
    \ least five different concerns, all being folded together.\n\n1. Iteration\n\
    2. Determining if a user is overdue\n3. Filtering out users who are not overdue\n\
    4. Defining an email to send\n5. Sending the email\n\nIt would be much nicer to\
    \ separate all of those out instead, which makes the code both more readable and\
    \ more testable.\n\nWe already have the tools to do most of those steps; we’re\
    \ just missing the third step, filtering out users we shouldn’t be yelling at\
    \ for being overdue. As with `map()`, PHP has a native array-only way to do that\
    \ (`array_filter()`), but we’ll make our own `iterable` version for practice.\n\
    \n```\n1 function filter(iterable $it, callable $ifTrue = null): iterable\n2 {\n\
    3     $ifTrue ??= fn($val): bool => (bool)$val;\n4     foreach ($it as $key =>\
    \ $value) {\n5         if ($ifTrue($value)) {\n6             yield $key => $value;\n\
    7         }\n8     }\n9 }\n```\n\nAs with `map()`, our `filter()` function is\
    \ lazy and works on any iterable, preserving keys. We’re also defining a default\
    \ filter function just like `array_filter()` that skips values that are false-y.\
    \ The `??=` operator is new in PHP 7.4 and is the “null assignment operator.”\
    \ That is, it assigns the right side value to the variable on the left, if and\
    \ only if the variable on the left is null. If it’s not null, then it does nothing.\n\
    \nNow, let’s rewrite our earlier procedural mess to separate out all of the concerns:\n\
    \n```\n 1 $isUnpaid = fn(User $user): bool\n 2     => $user->lastPaidDate() <\
    \ date('-1 month');\n 3 \n 4 $mail = fn($email): void\n 5     => send_email($email,\
    \ \"Overdue bill\", \"Pay up, slacker!\");\n 6 \n 7 $mailUser = fn($user) => $mail($user->email());\n\
    \ 8 \n 9 $unpaid = filter($users, $isUnpaid);\n10 $action = map($unpaid, $mailUser);\n\
    11 \n12 iterator_to_array($action);\n```\n\nHere, we’ve defined three utility\
    \ functions:\n\n* `$isUnpaid` determines if a user owes money\n* `$mail` sends\
    \ a message to an address telling them to pay up\n* `$mailUser` extracts the email\
    \ address from a user and calls `$mail` on it, further separating the concept\
    \ of a user from “sending email.”\n\nThose can be read, tested, or reused all\
    \ on their own (And could just easily be named functions or methods of an object\
    \ we were so inclined; any `callable` will do.). Next, we take our list and filter\
    \ out the ones we don’t care about, then apply the “send email” function to the\
    \ remaining list with `map()`.\n\nOne caveat, though, is that `map()` is a generator,\
    \ which means it…’t actually done anything. We need to actually iterate explicitly\
    \ in order to do anything. There are a couple of ways of doing that, but the most\
    \ straightforward is to call `iterator_to_array()` and discard the result. That\
    \ iterates over every value in `$unpaid` and applies `$action` to it. `$unpaid`\
    \ is also a generator, so it iterates through `$users` and returns just those\
    \ that pass `$isUnpaid`.\n\nSo far, this may not seem like a great benefit, just\
    \ a different way to get the same result. It gets more beneficial when we want\
    \ to compose more logic, or change selected parts. Consider if we also want to\
    \ avoid emails to admins and users flagged as partners, meaning they get stuff\
    \ for free. In that case, we need only compose some primitives:\n\n```\n1 $isAdmin\
    \ = fn(User $user): bool\n2     => $user->role == 'admin';\n3 \n4 $isPartner =\
    \ function (User $user): bool {\n5     // Some complex logic because\n6     //\
    \ the concepts of partners was hacked\n7     // into your model after the fact\n\
    8     // because someone promised it\n9     // to a particular partner and then\n\
    10     // told you about it after the fact...\n11     // (Entirely fictional,\
    \ of course...)\n12 };\n13 \n14 $unpaid = filter($users, fn($user)\n15     =>\
    \ !$isAdmin($user) && !$isPartner($user));\n```\n\nAnd nothing else changes.\n\
    \nWe’ll see some even nicer ways to structure this code in a later section when\
    \ we start to cover logic.\n\n# Reducing\n\nPerhaps the most important functional\
    \ operation, though, is “reducing.” Reducing is an operation that, from a procedural\
    \ background, seems of little use. PHP has an array reducing function, aptly named\
    \ `array_reduce()`, but it’s not often used. When writing in a functional style,\
    \ though, reduction comes up quite often, usually as an implementation detail\
    \ of other operations.\n\nThe basics of reducing are to take a list of values\
    \ and “reduce” them to a single value by repeatedly applying a function to them.\
    \ Unlike `map()`, `reduce()` is not intrinsically parallel because the value from\
    \ one iteration is fed into the next.\n\nAs before, we can write our own `reduce()`\
    \ implementation that works on any iterable:\n\n```\n1 function reduce(iterable\
    \ $it, callable $fn, $collect = 0)\n2 {\n3     foreach ($it as $key => $val) {\n\
    4         $collect = $fn($collect, $val, $key);\n5     }\n6     return $collect;\n\
    7 }\n```\n\nOnce again, we’re handling `iterable` keys, because PHP. The operation\
    \ function `$fn` gets applied to the first element, along with an initial value,\
    \ `$collect`. Then the result is fed back into the operation function as the new\
    \ initial value, and so on until it runs out of values.\n\nThat’s a bit abstract\
    \ but makes more sense with an example. The canonical trivial example for reduce\
    \ is summing an array:\n\n```\n1 function sum(iterable $list): int\n2 {\n3   \
    \  return reduce($list, fn($collect, $val) => $collect + $val, 0);\n4 }\n```\n\
    \nNote that we’re ignoring the key here as it’s irrelevant. PHP lets us do that.\
    \ If we now call `sum([1, 3, 5, 7, 9])`, then the reducing function is called\
    \ like so:\n\n1. (0, 1) ⇒ returns 1\n2. (1, 3) ⇒ returns 4\n3. (4, 5) ⇒ returns\
    \ 9\n4. (9, 7) ⇒ returns 16\n5. (16, 9) ⇒ returns 25\n\nAnd so we get the correct\
    \ result of 25.\n\nIn normal PHP, you’d never do this, not when there’s a nice\
    \ `array_sum()` method already implemented in C for you to use. However, it does\
    \ illustrate several key aspects of functional-style programming:\n\n* The logic\
    \ is built by composing trivially simple functions together.\n* Every function\
    \ is a pure function.\n* Functions are being freely used as values, just as freely\
    \ as the integers are.\n\nMore importantly, it demonstrates a pattern that can\
    \ be used repeatedly in more complex cases where PHP doesn’t have an existing\
    \ utility, or when the reducing function is complex enough that it warrants being\
    \ separated out and tested in isolation.\n\nJust for fun, let’s take `sum()` and\
    \ see what else we can do with it, given all of the above:\n"
