  trans: "\n对象稍微奇怪一点；对象本身在内存中的值和它的句柄（handle）之间存在分离。当你将一个对象传递给函数时，你是在按值传递句柄。因此，你看到的变量名绑定到句柄上，而句柄随后指向内存中的对象。在将对象传递给函数时，复制句柄意味着它仍然指向同一个底层值。这使得对象的行为几乎就像是引用传递一样，尽管事实并非如此。\n\
    \n然而，这里有一个重要的注意事项：PHP 在你传递值时并不会真正复制这些值。PHP 引擎使用了“写时复制（copy on write）”；其实现细节有些复杂，但对我们的目的并不重要。不过，结果是，尽管在逻辑上你可以认为以下代码拥有两个\
    \ 20 元素的数组，但内存中只有一个数组：\n\n```\n1 $one = range(1, 20);\n2 $two = $one;\n```\n\n\
    如果你之后以某种方式更改了 `$two`，只有此时 PHP 才会创建一个数组的新副本并修改该副本，而让 `$one` 保持不变。这意味着我们在语义上可以将它们视为独立的变量，但内存占用通常只等于单个变量。这在我们实现不可变变量时让生活变得简单得多。\n\
    \n## 使其不可变\n\n避免“远程副作用”（spooky action at a distance）这种不纯的形式对于函数式系统至关重要，即使你不试图编写函数式代码，这也是好主意。某些严格的函数式语言（如\
    \ Haskell）只支持不可变变量；设置后更改值是不可能的。在其他语言中（如 `Rust`），变量默认是不可变的；你必须在定义变量时设置一个标记使其变为可变，这会触发各种额外的编译器行为以确保你不会出错。PHP\
    \ 既没有其中这些安全带，所以我们必须自己来实现。\n\n对于原始值（整数、字符串、布尔值等），这相当容易。它们本身就是按值传递的，这阻止了远程副作用。永远不要使用引用传递。\n\
    \n对于数组，它们也是按值传递的（带有写时复制），因此同样适用。不要使用引用传递。\n\n对于对象，则需要多做一些工作。关键在于不要将对象视为一个可变值的集合，而是将其视为一个本身的值。你不会去重新定义“5”的含义（我希望），而是在它基础上加上“1”来得到一个新的值。这也是你应该对待对象的方式。\n\
    \n回到我们之前的示例，简单的修复方法是这样重写 `nextSunday()` 函数：\n\n```\n1 function nextSunday(\\DateTimeImmutable\
    \ $date): DateTime\n2 {\n3     $oneDay = \\DateInterval::createFromDateString('1\
    \ day');\n4     while ($date->format('l') !== 'Sunday') {\n5         $date = $date->add($oneDay);\n\
    6     }\n7 \n8     return $date;\n9 }\n```\n\n`\\DateTimeImmutable` 类自 PHP 5.5\
    \ 起可用，与 `\\DateTime` 相同的接口，但它不是修改自身，而是返回一个根据更改而不同的新对象。在这种情况下，它返回了一系列对象。\n"
- fmt: "\nHowever, it’s not all that useful if we want to operate on the distance\
    \ value. For instance, sometimes we want meters, sometimes kilometers, sometimes\
    \ miles. But 5 kilometers is not the same value as 5000 meters; if we try to use\
    \ an object expecting it to be one and get the other, we’ll have an off-by-1000\
    \ error. That means we need to convert from one unit to another. But telling the\
    \ object to switch from “kilometer mode” to “meter mode” by modifying it directly\
    \ introduces that spooky action problem.\n\nInstead, just like with `DateTimeImmutable`\
    \ we allow the object to create a new object.\n\n```php\n 1 class Distance\n 2\
    \ {\n 3     // ...\n 4 \n 5     private array $factors = [\n 6         'kilometers'\
    \ => [\n 7             'meters' => 1000,\n 8             'kilometers' => 1,\n\
    \ 9         ],\n10         'meters' => [\n11             'meters' => 1,\n12  \
    \           'kilometers' => .001,\n13         ],\n14     ];\n15 \n16     public\
    \ function as(string $units): self\n17     {\n18         return ($this->units\
    \ == $units)\n19             ? $this\n20             : new static(\n21       \
    \          $this->length * $this->factors[$this->units][$units],\n22         \
    \        $units\n23             );\n24     }\n25 }\n```\n\nThe conversion factor\
    \ between different units is well-known and fixed, so we can just bake that into\
    \ the class. (Adding more possible units is left as an exercise to the reader;\
    \ more robust approaches are also possible to avoid precision loss when using\
    \ floats, but that’s off-topic for now.) The `as()` method returns a new `Distance`\
    \ object, with the requested units and the length expressed in that new unit.\
    \ As an optimization, if the object is already in the right unit, then we can\
    \ just return it as is because semantically 500 meters is 500 meters. The immutability\
    \ of `Distance` is preserved, as we now get a new object in the format we want.\n\
    \nNow, say we want to combine two `Distance` values in order to know how far it\
    \ is to traverse both of them. If they were bare, boring floats, then we could\
    \ just use `+`, but since they’re not, we have to do it ourselves. Fortunately,\
    \ it’s reasonably straightforward:\n\n```php\n 1 class Distance\n 2 {\n 3    \
    \ // ...\n 4   \n 5     public function add(Distance $add): self\n 6     {\n 7\
    \         return new static(\n 8             $add->as($this->units)->length()\
    \ + $this->length,\n 9             $this->units\n10         );\n11     }\n12 }\n\
    ```\n\nOnce again, rather than modifying the value in place, we create another\
    \ new `Distance` object. This one has the units of the object being invoked, and\
    \ its length is the simple sum of its length and the length of the other object\
    \ after converting them to the same units.\n\nSimilarly, we could have an `equals()`\
    \ method that compares both the length and units of two `Distance` objects and\
    \ returns true only if both match. Such a method is left as an exercise for the\
    \ reader.\n\n## Evolvable Objects\n\nProbably the most famous value object in\
    \ the PHP ecosystem is the PSR-7 HTTP Message Interfaces published by the PHP\
    \ Framework Interoperability Group (PHP-FIG). In concept, it is just like the\
    \ `Distance` class above, but for HTTP `RequestInterface` and `ReponseInterface`\
    \ messages. (Observe that these are message objects that do not correspond to\
    \ any real-world object.) It contains a number of values internally, but you cannot\
    \ change them; you can only spawn a new request or response object from an existing\
    \ one, with some change. In PSR-7’s case, rather than come up with custom names\
    \ for each “spawn new” method, they were all prefixed with `with`. Here’s a sample\
    \ of it, with PHP 7 types added for clarity.\n\n```php\n 1 interface MessageInterface\n\
    \ 2 {\n 3     public function getProtocolVersion(): string;\n 4 \n 5     public\
    \ function withProtocolVersion(string $version): self;\n 6 \n 7     public function\
    \ getHeaders(): array;\n 8 \n 9     public function hasHeader($name): bool;\n\
    10 \n11     public function getHeader(string $name): array;\n12 \n13     public\
    \ function getHeaderLine($name): string;\n14 \n15     public function withHeader(string\
    \ $name, string $value): self;\n16 \n17     public function withAddedHeader(string\
    \ $name, string $value): self;\n18 \n19     public function withoutHeader(string\
    \ $name): self;\n20 \n21    // ...\n22 }\n```\n\nThere’s more, but it follows\
    \ the same pattern:\n\n- A `getX` method to return the current value of a part\
    \ of the HTTP message;\n- A `withX` method to create a new message object that\
    \ is identical except for new data added;\n- A `withoutX` method to create a new\
    \ message object that is identical except for some data removed.\n\nIn practice\
    \ it is usually built up with chained method calls like so:\n\n```php\n1 $response\
    \ = (new Response())\n2     ->withProtocolVersion('2.0')\n3     ->withHeader('content-type',\
    \ 'application/json')\n4     ->withAddedHeader('cache-control', 'no-cache')\n\
    5 ;\n```\n\nThe `Response` objects are created and discarded, while the copy-on-write\
    \ behavior makes it impressively fast and you don't have to worry about performance\
    \ impact unless it’s inside a tight loop.\n\n## Dependencies\n\nA common question\
    \ when dealing with evolvable objects is, “But about dependencies?” Developers\
    \ used to an OOP world have to worry about ensuring objects don’t duplicate, because\
    \ that could do weird things to their dependencies, and those dependencies may\
    \ have transitive dependencies on something that should not get, like a database\
    \ connection. And serializing an object is always fraught with challenges as you\
    \ can’t serialize a database connection, or you may end up serializing 15 layers\
    \ of dependencies you don’t.\n\nA functional approach to data modeling provides\
    \ an easy answer to that problem: It’s not a problem.\n\nService objects have\
    \ those problems. That’s why service objects should never have state, making it\
    \ pointless to even try serializing them. Cloning them is rarely necessary. Service\
    \ objects form the pipeline through which data in your system flows.\n\nValue\
    \ objects, by contrast, are “just data data They don’t have dependencies. They\
    \ may have sub-objects, but those are also value objects. That means they don’t\
    \ necessarily need to be dependency injected the way a service object is.\n\n\
    Consider a `Person` object, which has an `Address` object as one of its properties.\
    \ A serialized `Person` includes a serialized `Address`, in its entirety. Which\
    \ means when deserializing a `Person`, the object can reconstruct its own `Address`\
    \ object. It doesn’t have to be injected. Even if it’s highly complex and needs\
    \ a temporary builder object, that’s okay, and the builder can be created, used,\
    \ and disposed of entirely within `Person`.\n\nValue objects are the chunks of\
    \ data that flow through your pipeline.\n"
  raw: "However, it’s not all that useful if we want to operate on the distance value.\
    \ For instance, sometimes we want meters, sometimes kilometers, sometimes miles.\
    \ But 5 kilometers is not the same value as 5000 meters; if we try to use an object\
    \ expecting it to be one and get the other, we’ll have an off-by-1000 error. That\
    \ means we need to convert from one unit to another. But telling the object to\
    \ switch from “kilometer mode” to “meter mode” by modifying it directly introduces\
    \ that spooky action problem.\n\nInstead, just like with `DateTimeImmutable` we\
    \ allow the object to create a new object.\n\n```\n 1 class Distance\n 2 {\n 3\
    \     // ...\n 4 \n 5     private array $factors = [\n 6         'kilometers'\
    \ => [\n 7             'meters' => 1000,\n 8             'kilometers' => 1,\n\
    \ 9         ],\n10         'meters' => [\n11             'meters' => 1,\n12  \
    \           'kilometers' => .001,\n13         ],\n14     ];\n15 \n16     public\
    \ function as(string $units): self\n17     {\n18         return ($this->units\
    \ == $units)\n19             ? $this\n20             : new static(\n21       \
    \          $this->length * $this->factors[$this->units][$units],\n22         \
    \        $units\n23             );\n24     }\n25 }\n```\n\nThe conversion factor\
    \ between different units is well-known and fixed, so we can just bake that into\
    \ the class. (Adding more possible units is left as an exercise to the reader;\
    \ more robust approaches are also possible to avoid precision loss when using\
    \ floats, but that’s off-topic for now.) The `as` method returns a new `Distance`\
    \ object, with the requested units and the length expressed in that new unit.\
    \ As an optimization, if the object is already in the right unit, then we can\
    \ just return it as is because semantically 500 meters is 500 meters. The immutability\
    \ of `Distance` is preserved, as we now get a new object in the format we want.\n\
    \nNow, say we want to combine two `Distance` values in order to know how far it\
    \ is to traverse both of them. If they were bare, boring floats, then we could\
    \ just use `+`, but since they’re not, we have to do it ourselves. Fortunately,\
    \ it’s reasonably straightforward:\n\n```\n 1 class Distance\n 2 {\n 3     //\
    \ ...\n 4   \n 5     public function add(Distance $add): self\n 6     {\n 7  \
    \       return new static(\n 8             $add->as($this->units)->length() +\
    \ $this->length,\n 9             $this->units\n10         );\n11     }\n12 }\n\
    ```\n\nOnce again, rather than modifying the value in place, we create another\
    \ new `Distance` object. This one has the units of the object being invoked, and\
    \ its length is the simple sum of its length and the length of the other object\
    \ after converting them to the same units.\n\nSimilarly, we could have an `equals()`\
    \ method that compares both the length and units of two `Distance` objects and\
    \ returns true only if both match. Such a method is left as an exercise for the\
    \ reader.\n\n## Evolvable Objects\n\nProbably the most famous value object in\
    \ the PHP ecosystem is the PSR-7 HTTP Message Interfaces published by the PHP\
    \ Framework Interoperability Group (PHP-FIG). In concept, it is just like the\
    \ `Distance` class above, but for HTTP `RequestInterface` and `ReponseInterface`\
    \ messages. (Observe that these are message objects that do not correspond to\
    \ any real-world object.) It contains a number of values internally, but you cannot\
    \ change them; you can only spawn a new request or response object from an existing\
    \ one, with some change. In PSR-7’s case, rather than come up with custom names\
    \ for each “spawn new” method, they were all prefixed with `with`. Here’s a sample\
    \ of it, with PHP 7 types added for clarity.\n\n```\n 1 interface MessageInterface\n\
    \ 2 {\n 3     public function getProtocolVersion(): string;\n 4 \n 5     public\
    \ function withProtocolVersion(string $version): self;\n 6 \n 7     public function\
    \ getHeaders(): array;\n 8 \n 9     public function hasHeader($name): bool;\n\
    10 \n11     public function getHeader(string $name): array;\n12 \n13     public\
    \ function getHeaderLine($name): string;\n14 \n15     public function withHeader(string\
    \ $name, string $value): self;\n16 \n17     public function withAddedHeader(string\
    \ $name, string $value): self;\n18 \n19     public function withoutHeader(string\
    \ $name): self;\n20 \n21    // ...\n22 }\n```\n\nThere’s more, but it follows\
    \ the same pattern:\n\n*   A `getX` method to return the current value of a part\
    \ of the HTTP message;\n\n*   A `withX` method to create a new message object\
    \ that is identical except for new data added;\n\n*   A `withoutX` method to create\
    \ a new message object that is identical except for some data removed.\n\nIn practice\
    \ it is usually built up with chained method calls like so:\n\n```\n1 $response\
    \ = (new Response())\n2     ->withProtocolVersion('2.0')\n3     ->withHeader('content-type',\
    \ 'application/json')\n4     ->withAddedHeader('cache-control', 'no-cache')\n\
    5 ;\n```\n\nThat code actually creates four different `Response` objects, the\
    \ first three of which are discarded and garbage collected along the way. While\
    \ that may seem wasteful, in practice benchmarks have shown PHP’s copy-on-write\
    \ behavior makes it impressively fast and efficient, to the point that, most of\
    \ the time, you can write such code and not worry about the performance impact\
    \ unless it’s inside a tight loop.\n\nWhile there is no universal convention for\
    \ describing this pattern, the PHP community has informally settled on calling\
    \ them “evolvable” interfaces, because the object “evolves” from one object to\
    \ another with each generation (method call). In practice, if you can use more\
    \ purpose-built method names than `withX` that is better, but if the domain space\
    \ doesn’t lend itself to that, then the `withX` convention is widely recognized\
    \ within PHP, so is worth following.\n\n## Dependencies\n\nA common question when\
    \ dealing with evolvable objects is, “But what about dependencies?” Developers\
    \ used to an OOP world have to worry about ensuring objects don’t duplicate unexpectedly,\
    \ because that could do weird things to their dependencies, and those dependencies\
    \ may have transitive dependencies on something that should not get duplicated,\
    \ like a database connection. And serializing an object is always fraught with\
    \ challenges as you can’t serialize a database connection, or you may end up inadvertently\
    \ serializing 15 layers of dependencies you don’t need, but will need to reconnect\
    \ to after serialization.\n\nA functional approach to data modeling provides an\
    \ easy answer to that problem: It’s not a problem.\n\nService objects have those\
    \ problems. That’s why service objects should never have state, making it pointless\
    \ to even try serializing them. Cloning them is rarely necessary. Service objects\
    \ form the pipeline through which data in your system flows.\n\nValue objects,\
    \ by contrast, are “just” data. They don’t have dependencies. They may have sub-objects,\
    \ but those are also value objects. That means they don’t necessarily need to\
    \ be dependency injected the way a service object is.\n\nConsider a `Person` object,\
    \ which has an `Address` object as one of its properties. A serialized `Person`\
    \ includes a serialized `Address`, in its entirety. Which means when deserializing\
    \ a `Person`, the object can reconstruct its own `Address` object. It doesn’t\
    \ have to be injected. Even if it’s highly complex and needs a temporary builder\
    \ object, that’s okay, and the builder can be created, used, and disposed of entirely\
    \ within `Person`.\n\nValue objects are the chunks of data that flow through your\
    \ pipeline.\n\nThat “pipeline” analogy is not an accident. While OOP encourages\
    \ you to visualize your system as a series of objects with lines between them,\
    \ like neurons whose firing may trigger something else to fire, functional programming\
    \ is better visualized with plumbing. Each function is a pipe that takes input\
    \ and passes it on to some other pipe. The pipe may change size to adapt to the\
    \ next pipe, the pipes may branch, the pipes may recombine, they may connect to\
    \ a (data) sink, but they never leak. Functional data modeling is all about avoiding\
    \ leaky pipes."
