    \ In strictly functional languages, writing a not-pure function is hard and requires\
    \ extra syntax to remind you that you’re doing something dirty. PHP is not a strictly\
    \ functional language, so it’s on us as developers to self-check and ensure our\
    \ functions are pure whenever possible.\n\nIn practice, ensuring you have pure\
    \ functions is straightforward:\n\n1.  Avoid global values. Always. Period.\n\n\
    2.  Avoid static values in functions. Pretend they do not exist."
