  trans: "\n\n### 3. 避免通过引用传递或返回值\n在实践中，PHP 中这种用例极少，因为 PHP 自动支持写时复制（copy-on-write），使得传递大型只读参数的内存效率非常高。在传递对象时情况会变得复杂一些，但我们稍后会看到处理这种情况的方法。\n\
    \n### 4. 如果你需要执行 IO 操作（从数据库读取、打印到屏幕、发送 HTTP 请求等），请编写一个函数（过程）只做这些事而不做其他，并返回它的值。该函数是非纯的，它的调用者也是如此，但其调用者调用的其他函数不必如此。\n\
    \n例如，这个函数从数据库读取一个值，然后对其进行一些处理：\n\n```\n 1 function get_user(Connection $db, int\
    \ $id): array\n 2 {\n 3     $result = $db->query(\"SELECT * FROM users WHERE uid=:uid\"\
    , [':uid' => $id]);\n 4     $row = $result->fetchRow();\n 5 \n 6     if ($row\
    \ == 'false') {\n 7         return [];\n 8     }\n 9     if ($row['expired'] ==\
    \ 1) {\n 10       return [];\n 11     }\n 12 \n 13     return $row;\n 14 }\n```\n\
    \n而更健壮的方法是将非获取的功能分离到独立的例程中：\n\n```\n 1 function fetch_user(Connection $db, int\
    \ $id): array\n 2 {\n 3     $result = $db->query(\"SELECT * FROM users WHERE uid=:uid\"\
    , [':uid' => $id]);\n 4     return $result->fetchRow();\n 5 }\n 6 \n 7 function\
    \ validate_result($row): bool {\n 8     if ($row == false) {\n 9         return\
    \ false;\n 10     }\n 11     if ($row['expired'] == 1) {\n 12       return false;\n\
    \ 13     }\n 14     return true;\n 15 }\n 16 \n 17 function get_user(int $id)\n\
    \ 18 {\n 19     // ...\n 20     $user = fetch_user($db, $id);\n 21     if (validate_result($user))\
    \ {\n 22       return $user;\n 23     }\n 24     else {\n 25         // 某种类型的错误处理。\n\
    \ 26     }\n 27 }\n```\n\n`validate_result()` 现在是一个纯函数，因此更具预测性且更容易测试。\n\n由于大多数函数式编程都是基于纯函数的，在本书的剩余部分，每当我们谈到“函数”时，除非另有说明，否则我们指的是纯函数。\n\
    \n## 二元函数\n\n函数的一个特殊子集是*二元函数*。二元函数是指接受两个相同类型的参数并返回该类型项的函数。也就是说，以下是一个二元函数：\n\n\
    ```\n1 function multiply(int $a, int $b): int\n2 {\n3     return $a * $b;\n4 }\n\
    ```\n\n但这个不是，因为返回返回的类型相同：\n\n```\n1 function greater_than(int $a, int $b): bool\n\
    2 {\n3     return $a > $b;\n4 }\n```\n\n到为止，这还没有什么特别有趣的。然而，二元函数还有另一个子集是有有趣的；具体来说，二元函数可以具有*结合律*并拥有一个*单位元*。\n\
    \n如果当链式组合多次调用时，分组顺序并不重要，那么该二元函数就是结合的。让我们再次看看乘法，这次使用更传统的语法。\n\n```\n1 $a * $b *\
    \ $c * $d\n```\n\n将 `$a` 乘以 `$b`，然后乘以 `$c`，最后乘以 `$d` 产生的结果与 `$a` 乘以 `$b`、$c` 乘以\
    \ `$d`，然后将这些结果相乘的结果相同。或者更可视化地：\n\n```\n1 $a * $b * $c * $d == ($a * $b) * ($c\
    \ * $d)\n```\n\n单位元也被称为中元，本质上是“无操作”（no op）值。对于整数乘法，无操作值是 1。也就是说：\n\n```\n1 $a\
    \ * 1 == $a\n```\n\n对于 `$a` 的每一个可能的整数值。\n\n事实证明，这种属性的组合在通常非常有用。用至于它有一个漂亮的名字：*单代*（monoid）。\n\
    \n“单代”指的是满足以下条件的函数：\n\n* 是纯的\n* 是二元函数（接受两个参数并返回一个值，所有类型都相同）\n* 具有结合律\n* 具有单位值\n\
    \n更正式地说，我们可以说乘法是整数上的一个单代。更精确地说，存在一个单代 `<ℤ, multiply, 1>`：一组值的集合（整数），一个二元运算（`multiply`）和一个单位值（1）。乘法在其他类型的值上可能可能是单代，也可能不是，而且对于某些类型的值（例如，芜蓝、员工或购物车），它甚至没有意义。\n\
    \n虽然乘法相当基础，但单代的概念适用于各种类型和操作。例如，考虑列表拼接：\n\n```\n1 function concat(array $a, array\
    \ $b): array {}\n```\n\n它是单代吗？让我们检查一下规则：\n\n* 它是纯的吗？检查。\n* 它是二元的吗？检查。\n* 有单位元吗？有的，空列表。\n\
    * 它具有结合律吗？\n\n### 一等函数\n\n函数式编程的第二个核心属性实际上是两个相关概念：*一等函数*和*高阶函数*。在实践中，一等函数是指可以赋值给变量并像其他值一样传递的函数。高阶函数是指接受函数作为参数或返回函数的函数。\n\
    \n### 匿名函数\n\nPHP 几十年来一直有一等函数，因为你可以将函数指定为“callable”字符串。然而，从 5.3 版本开始，PHP 支持可以传递的匿名函数。它们在底层被实现为对象，但结果“足够好”，可以认为\
    \ PHP 支持匿名函数。\n\n基础匿名函数看起来像这样：\n\n```\n1 $factor = 6;\n2 $multiply = function(int\
    \ $a) use ($factor): int {\n3     return $a * $factor;\n4 };\n5 print $multiply(9);\
    \ // 输出 54\n```\n\n变量 `$multiply` 是函数，就像变量 `$factor` 是整数一样。具体来说，它是接受单个整数参数并返回整数的函数。它还有那个奇怪的\
    \ `use` 子句。`use` 子句告诉函数即使在变量离开作用范围后也可以访问 `$factor` 变量。函数对其有一个额外的句柄，只要 `$multiply`\
    \ 存在，该变量就存在，即使 `$multiply` 之后被传递给其他函数。在计算机科学术语中，`$multiply` “闭包了” `$factor`，也就是说，它是一个*闭包*。严格来说，闭包是函数将其部分上下文整合到自身的过程，但在通常习惯中，“闭包”和“匿名函数”经常互换使用（无论正确与否）。\n\
    \n匿名函数的更正式名称是 *lambda*。这个名字源于“Lambda 演算”，它之所以这样命名是因为发明者 Alonzo Church 厌倦了写“function”这个词，因此开始用希腊字母\
    \ lambda 代替。\n\n默认情况下，PHP 中的所有闭包都是按值传递的——创建 `$multiply` 后更改 `$factor` 不改变 `$multiply`。\n\
    \n```\n1 $factor = 6;\n2 $multiply = function(int $a) use ($factor): int {\n3\
    \     return $a * $factor;\n4 };\n5 $factor = 5\n6 print $multiply(9); // 仍然输出\
    \ 54\n```\n\n"
- fmt: "\nHowever, PHP also allows you to create a closure by reference, using an\
    \ `&`:\n\n```\n1 $factor = 6;\n2 $multiplyByRef = function(int $a) use (&$factor):\
    \ int {\n3     return $a * $factor;\n4 };\n5 $factor = 5\n6 print $multiplyByRef(9);\
    \ // Prints 45\n```\n\nLook carefully at the behavior of those two versions. Are\
    \ they pure functions?\n\nIn the first case, yes. The behavior of `$multiply`\
    \ depends exclusively on the value passed to it. However, in the second case where\
    \ the closure is by reference, `$multiplyByRef`’s behavior is dependent on some\
    \ external value, `$factor`, and thus subsequent calls to it may not produce the\
    \ same value. So `$multiplyByRef` is not a pure function, and we lose all of our\
    \ predictability about it.\n\nWe’ll find this is a nearly universal rule: A function\
    \ that closes over a value by reference, or takes a parameter by reference, is\
    \ not a pure function. It is merely a procedure, and thus its behavior is unpredictable.\n\
    \n## Closure Objects\n\nIf you have a hard time wrapping your head around a function-as-a-value,\
    \ PHP has an alternate syntax that may be more familiar. Any object may implement\
    \ a magic `__invoke()` method, which will get called if the object is invoked\
    \ as if it were a function.\n\n```\n 1 class Multiply\n 2 {\n 3     private int\
    \ $factor;\n 4 \n 5     public function __construct(int $factor)\n 6     {\n 7\
    \         $this->factor = $factor;\n 8     }\n 9 \n10     public function __invoke(int\
    \ $a): int\n11     {\n12         return $a * $this->factor;\n13     }\n14 }\n\
    15 \n16 $factor = 6;\n17 $multiplyObject = new Multiply($factor);\n18 print $multiplyObject(9);\
    \ //prints 54\n```\n\nThe `Multiply` class does the exact same thing as the anonymous\
    \ function above, just with more syntax. You can think of a closure as a single-method\
    \ object where the variables closed over are passed to the constructor.\n\nIn\
    \ fact, in PHP, you can do more than just think of it that way. In the engine,\
    \ that is exactly what happens. The `$multiply` anonymous function gets converted\
    \ into an object of class `\\Closure`, the closed-over variables are assigned\
    \ to private object properties, and it then passes around like any other object.\
    \ You can even test that yourself; the following code will dutifully print “yes.”\n\
    \n```\n1 $factor = 6;\n2 $multiply = function(int $a) use ($factor): int {\n3\
    \     return $a * $factor;\n4 };\n5 \n6 print $multiply instanceof \\Closure ?\
    \ 'yes' : 'no';\n```\n\nThe `Closure` class has a few other features, too. The\
    \ interesting ones relate to how `$this` is handled. By default, if an anonymous\
    \ function is created inside an object, it will implicitly close over `$this`,\
    \ that is, the object inside which it is created. For example:\n\n```\n 1 class\
    \ Table\n 2 {\n 3     private int $numForks = 3;\n 4     private int $numSpoons\
    \ = 4;\n 5 \n 6     public function cutleryCounter(): callable\n 7     {\n 8 \
    \        return function() {\n 9             return $this->numForks + $this->numSpoons;\n\
    10         };\n11     }\n12 }\n13 \n14 $t = new Table();\n15 $counter = $t->cutleryCounter();\n\
    16 print $counter(); // prints 7\n```\n\nThat is sometimes desirable, sometimes\
    \ not. Once created, though, the value of `$this` can be swapped out:\n\n```\n\
    1 $t2 = new Table();\n2 $counter = $t->cutleryCounter();\n3 $newCounter = \\Closure::bind($counter,\
    \ $t2);\n4 // $newCounter's $this is now $t2, not $t.\n```\n\nIn practice, this\
    \ trick is rarely useful. However, let’s check: Does it make `$counter` impure?\n\
    \nIt does! Whether rebound to a new object or not, the object to which it is bound\
    \ could itself change; imagine if `Table` had methods that let you change the\
    \ number of spoons, for instance. Then `$counter` cannot be relied upon to be\
    \ idempotent (always return the same value).\n\nThose side effects can be sneaky\
    \ in a language that doesn’t help you avoid them.\n\nThere is one caveat to that\
    \ observation, though; if `Table` can be shown to be a value object, then `$counter`\
    \ again becomes a pure function. We’ll see more on value objects in a later chapter.\n\
    \n## Short Lambdas\n\nPHP 7.4 introduced yet another syntax for anonymous functions,\
    \ called variously “short lambdas” (because they’re shorter to write) or “arrow\
    \ functions” (because they include the `=>` symbol, which looks like an arrow).\
    \ Our previous multiplication example could now be written like this:\n\n```\n\
    1 $factor = 6;\n2 $multi = fn(int $a): int => $a * $factor;\n3 print $multi(9);\
    \ // Still prints 54\n```\n\nThis code is exactly the same as the code we saw\
    \ before, but shorter. Short lambdas have a function body that can be only a single\
    \ expression, and the result of that expression is returned. They also support\
    \ “auto-capture,” meaning you don’t need to specify the variables to close over\
    \ explicitly. Short lambdas do not offer any more over traditional functions.\
    \ In fact, they are strictly less capable than the version. What they offer is\
    \ succinctness. The short lambda syntax makes it very easy to write in functional\
    \ way without running into a wall of fugly syntax. If you’re not used to short\
    \ lambdas yet, some of the code in this book may take a little time to wrap your\
    \ head around. I try to offer both short and long version in many cases to help\
    \ familiarity.\n\n## Object Binding\n\nBy default, when you create a lambda within\
    \ an object, the lambda gets auto-bound to the current object. `$this` is accessible\
    \ and refers to the object the lambda is in. Occasionally that is useful; however,\
    \ as closures over references, it has the potential to make the function impure,\
    \ unless the object is immutable. If the object goes out of scope, moreover, it\
    \ may not get garbage collected if the closure is still alive.\n\n```\n1 class\
    \ Table\n 2 {\n 3     private int $numForks = 3;\n 4     private int $numSpoons\
    \ = 4;\n 5 \n 6     public function cutleryCounter(): callable\n 7     {\n 8 \
    \        return function() {\n 9             return $this->numForks + $this->numSpoons;\n\
    10         };\n11     }\n12 }\n```\n\nTo avoid automatic binding, you can declare\
    \ the function `static`, which skips over the object. If you need some value off\
    \ of the object from within the lambda, it’s straightforward to assign to a temporary\
    \ variable instead:\n\n```\n1 class Calendar\n 2 {\n 3     protected \\DateTimeImmutable\
    \ $startDate;\n 4 \n 5     public function getNextHoliday(int $days): callable\n\
    \ 6     {\n 7         $start = $this->startDate;\n 8         return static function()\
    \ use ($days, $start) {\n 9             return $start->add(\"$days days);\n10\
    \         }\n11     }\n12 }\n```\n\n# Memoization\n\nNow that we have a concept\
    \ of first-class functions, and we have pure functions, what can we do with them?\
    \ Quite a bit, in fact. One of the easiest next steps is to use them to help with\
    \ performance.\n\nMost PHP developers have at some point in their careers written\
    \ code that looks something like this:\n\n```\n 1 function expensiveThing($key)\n\
    \ 2 {\n 3     static $cache = [];\n 4 \n 5     if (!isset($cache[$key])) {\n 6\
    \         // Do something really expensive to populate $cache[$key];\n 7     }\n\
    \ 8 \n 9     return $cache[$key];\n10 }\n```\n"
