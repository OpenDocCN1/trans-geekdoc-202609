    \ = $msg;\n12     }\n13 \n14     public static function create(\n15         string\
    \ $remain,\n16         array $tokens,\n17         string $msg\n18     ): self\
    \ {\n19         return new static($remain, $tokens, $msg);\n20     }\n21 \n22\
    \     public function lex($string): Lexer\n23     {\n24         return $this;\n\
    25     }\n26 \n27     public function message(): string\n28     {\n29        \
    \ return $this->message;\n30     }\n31 }\n```\n\nTo be even cleaner, we could\
    \ have subclasses of LexerError to indicate different failure conditions. Let’s\
    \ skip that for now in the interest of brevity.\n\nThat nearly completes our start\
    \ state, but if we look ahead the logic for any keyword should be virtually identical.\
