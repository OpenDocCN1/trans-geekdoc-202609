    \    return $user;\n23     }\n24     else {\n25         // Some kind of error\
    \ handling.\n26     }\n27 }\n```\n\n`validate_result()` is now a pure function,\
    \ and thus far more predictable and easier to test.\n\nBecause most of functional\
    \ programming is based on pure functions, for the rest of this book, whenever\
    \ we talk about “functions” assume we mean pure functions unless explicitly stated\
    \ otherwise.\n\n## Binary Functions\n\nA particular subset of functions are *binary\
    \ functions*. Binary functions are functions which take two parameters of the\
    \ same type and return an item of that type. That is, the following is a binary\
    \ function:\n\n```\n1 function multiply(int $a, int $b): int\n2 {\n3     return\
    \ $a * $b;\n4 }\n```\n\nBut this is not, because it does not return the same type:\n\
    \n```\n1 function greater_than(int $a, int $b): bool\n2 {\n3     return $a > $b;\n\
    4 }\n```\n\nSo far, that’s not all that interesting. However, there’s another\
    \ subset of binary functions that are; specifically, binary functions can be *associative*\
    \ and have an *identity element*.\n\nA binary function is associative if the order\
    \ of grouping doesn’t matter when chaining multiple calls together. Let’s look\
