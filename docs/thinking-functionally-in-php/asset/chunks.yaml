    恒等态射（identity morphism）是一个从对象到自身的箭头：`f: A → A`，通常称为 `id`。恒等态射必须满足交换律。也就是说，`id
    ∘ f == f ∘ id == f`。从对象到自身可能有无限多个其他箭头，但只有一个是恒等态射。域和陪域相同的态射称为自态射（`endomorphisms`，“endo”是希腊语中表示“内部”的前缀。（因此，“自态射”意味着“在相同形式内部的东西”。）这与我们之前看到的“无操作（no-op）”模式相同，例如加法的
    `0` 和乘法的 `1`，不同的是这次 `id` 是“无操作函数”，即在两个函数复合函数中的无操作值。


    当从范畴论的视角来看编程时，态射是任何单参数的、保持结构的纯函数，而对象通常代表类型。


    组合（composition）的概念是范畴论和函数式编程的核心。在某种意义上，它仅仅是应用于逻辑的古老“分治”思想；如果你将将问题分解为微小的、易于理解的、几乎是琐道的片段（函数），并有一种清晰且安全的方法将这些琐道片段组合在一起，你就可以通过遵循规则的方式将这些片段简单连接在一起来解决整体问题，而且你（几乎）保证最后能得到可行的答案。


    把它想象成乐高积木；通过为积木及其上的凸起建立非常清晰的标准尺寸，你可以从相同的基础积木安全地构建出无限的雕塑。函数就是这些积木。


    在编程中，恒等态射在几乎所有情况下都简单到极致：


    ```

    1 function id($x) {

    2     return $x;

    3 }

    ```


    它满足交换律这应该是显而易见的。


    ## 对象


    对象（Objects）是……东西。它们与面向对象编程中的对象并不一定有任何联系，后者是“定义好的数据属性类的实例化”。一个对象可以是：


    *   一个整数，在一个由所有整数组成的范畴中

    *   一个字符串，在一个长度小于 10 个字符的字符串组成的范畴中

    *   一个集合，在一个每个对象都是值的范畴中（数学意义上的“集合”）

    *   一种数据类型，在一个由编程语言表示的类型范畴中

    *   一条法律，在一个每个对象都是代码的范畴中


    因此，一个范畴可能由少量的对象组成，大量的但有限数量的对象组成，或者概念上无限数量的对象（如“所有整数”）。范畴也可以拥有恒等态射以外的箭头。


    只有恒等态射的范畴被称为离散范畴（discrete category），通常被描述为“无趣的”。


    ## 定义


    在继续之前，让我们建立更多定义和符号以便于后续章节：


    *   整数是指任何正、负整数以及零。所有整数的集合表示 ℤ。它是概念上的无限序列。

    *   自然数是指正整数加零。所有自然数的集合表示 ℕ。（程序员有时称这些为“无符号整数”）

    *   正整数表示 ℕ+。

    *   实数是指任何数字，包括小数。所有实数的集合表示 ℝ。程序员倾向于将这些称为“浮点数”，即 `float`。

    *   全函数（total function）对于其输入（域）的所有排列都有效的函数。函数在一个域中可能是全函数，但在另一个域中不是。

    *   偏函数（partial function）仅对其域中的某些输入有效的函数。（不要将“偏函数”与我们之前讨论的“部分应用”混淆。）


    所有函数非全即偏。


    态射必须是全函数。也就是说，它们对输入（源对象）的所有排列有效。例如，“绝对值”（`abs`）态射对于所有实数 ℝ 是全函数。然而，平方对于 ℝ 是偏函数，因为对负数无效。然而，平方对于非零自然数
    ℕ+ 是全函数。


    ## 结构


    我们上面说态射需要“保持结构”。虽然我们被允许观察对象内部是否具有内部结构，但态射必须尊重这一点。例如，考虑一个范畴，其中一个对象是集合 ℝ（实数），另一个对象是集合
    ℤ（整数）。两个集合都是有序的；即在 ℝ 中 4.5 >= 2.3。如果我们有一个从 ℝ 到 ℤ 的态射 `floor`，那么这种顺序必须被保留。如果我们对
    4.3 应用 `floor`，得到 4；如果我们对 2.3 应用 `floor`，得到 2。4 >= 2。所以，顺序被保留了。更正式地说，`floor: ℝ
    → ℤ`。函数 `ceil: ℝ → ℤ` 也映射到 ℕ，仍然保持顺序/结构，但映射到了不同的值。


    ![数字之间的保持结构态射](img/numbers.png)


    数字之间的保持结构态射


    数字之间的保持结构态射是一个平凡例子，但当我们观察范畴之间的态射时，它变得更加重要。


    ## 元


    在这里请听我说，因为我们将从几个角度来看世界。我们说范畴是对象和箭头的集合；我们非正式地讨论了集合，对象的集合。例如，上一个例子中的“大于”就是一个箭头。这意味着集合符合范畴的定义吗？


    事实上，集合是对我们来说最有趣的范畴。整数集合 ℤ 是整数范畴。ℕ 是自然数集合，因此是自然数范畴。编程中的类型本身就是集合的特例；布尔值是一个两个值的集合：`true`
    和 `false`。`int` 是集合 ℤ 的类型。依此类推。


    但由于我们可以拥有集合的范畴，而集合又是范畴，这意味着我们可以拥有范畴的范畴。事实上，存在一个范畴是除自身之外的所有范畴的范畴。


    `functor`（函子）是“function”和“factor”的结合。“factor”在这里源自拉丁语，意为“执行者、制造者或表演者”。因此，“functor”字面翻译为“做某事的函数”，但使用的是拉丁语，而数学的其他部分主要使用希腊语。（我假设数学家只是犹豫不决。）


    函子是范畴之间的态射；或者换说，它是以保持结构的方式将一个范畴 (`A`) 转换为另一个范畴 (`B`) 方法。在这种情况下，“保持结构”意味着范畴 A 中的所有对象都转换（或“映射”、或“转换”）为范畴
    B 中的唯一对象（但多个对象可以映射到 B 中的同一个对象），并且 A 中的所有箭头也转换成 B 中的箭头（再次，A 中的多个箭头可以映射到 B 中的同一个箭头）。


    ![两个范畴之间的函子](img/functor.png)


    两个范畴之间的函子


