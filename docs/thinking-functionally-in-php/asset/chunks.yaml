    \ that are reassigned to `$date`, and then the final reassigned `$date` gets returned.\
    \ The value passed in never changes; the variable that points at it changes to\
    \ point at something else. Because of PHP’s copy-on-write behavior, this is surprisingly\
    \ efficient, so there’s almost no measurable performance difference. Now we can\
    \ refactor the calling code whenever we want, safe in the knowledge that `nextSunday()`\
    \ won’t be doing anything spooky.\n\n## Objects, Functionally\n\nWhen designing\
    \ your own classes, your model should be `\\DateTimeImmutable`, not `\\DateTime`.\
    \ Or rather, that’s the case for value objects. If you’re coming from an OOP background\
    \ (as most modern developers are), then we need to first differentiate between\
    \ different kinds of objects because the functional mindset is very different.\n\
    \nIn classical OOP, as it usually gets taught, objects in code model real-world\
    \ things, and have methods on them that make them do something. That something\
    \ could be retrieving a value, updating a value, pushing data to a database, printing\
    \ to the screen, or anything else, and it may even have knock-on effects to other\
    \ objects. In fact, that’s precisely the point of that sort of design. This is\
    \ often called the “Fat Object” approach, as domain objects tend to be large and\
    \ persistent.\n\nThe idea behind that approach is that state is ugly and hard,\
    \ so you encapsulate it within an object with explicit actions (methods) that\
    \ can change it and nothing else. But you still have state, and state is still\
    \ ugly and hard.\n\nA functional approach, by contrast, strives to eliminate state\
    \ entirely; or, rather, state exists only as the call parameters to functions.\
    \ That means a hard, explicit split between data values and code that operates\
    \ on values. In OOP speak, that means splitting classes into two flavors: *value\
    \ objects* and *service objects*.\n\n### Service Objects\n\nService objects are\
    \ stateless, and are, in practice, just a more complex syntax for functions with\
    \ closures. Consider this class:\n\n```\n 1 class ThemeRenderer\n 2 {\n 3    \
    \ private $config;\n 4   \n 5     public function __construct(SysConfiguration\
    \ $config)\n 6     {\n 7         $this->config = $config;\n 8     }\n 9   \n10\
    \     public function renderUser(User $user): string\n11     {\n12         //\
    \ ...\n13     }\n14 \n15     public function renderProduct(Product $product):\
    \ string\n16     {\n17         // ...\n18     }\n19 }\n```\n\nThat is, in the\
    \ end, really no different from:\n\n```\n 1 function renderUser(SysConfiguration\
    \ $config, User $u): string {...}\n 2 function renderProduct(SysConfiguration\
    \ $config, Product $p): string {...}\n 3 \n 4 $config = getConfigFromWherever();\n\
    \ 5 \n 6 $userRenderer = fn(User $u): string\n 7     => renderUser($config, $u);\n\
    \ 8 \n 9 $productRenderer = fn(Product $p): string\n10     => renderProduct($config,\
    \ $p);\n```\n\nThose two code snippets give us the same thing, in the end: Two\
    \ operations we can pass around and invoke, with logic that require both a `SysConfiguration`\
    \ value and `User` or `Product` value. Neither version contains any “state,” only\
    \ immutable values that are closed over once at creation.\n\n### Value Objects\n\
    \nIn contrast, a value object represents a thing; “thing” in this case might correspond\
    \ to a real-world object, but that’s mostly coincidental. Value objects are a\
    \ noun, a value, a unique concept within your domain model. And they do nothing\
    \ other than… be that thing. But just as “5” and “7” are different things, and\
    \ Christmas 2019 and the following Sunday of 2019 are different things, if you\
    \ change a part of a value, it becomes a new value and should be treated as such.\n\
    \nLet’s consider an object that represents distance:\n\n```\n 1 class Distance\n\
    \ 2 {\n 3     private float $length;\n 4     private string $units = 'meters';\n\
    \ 5 \n 6     public function __construct(float $length, string $units = 'meters')\n\
    \ 7     { \n 8         $this->length = $length;\n 9         $this->units = $units;\n\
    10     }\n11 \n12     public function length(): float\n13     {\n14         return\
    \ $this->length;\n15     }\n16 \n17     public function format(): string\n18 \
    \    {\n19         return \"$this->length $this->units\";\n20     }\n21 }\n```\n\
    \nJust as a timestamp with no timezone is incomplete and mostly useless information,\
    \ a distance with no unit is incomplete. Both rely on implicit knowledge of the\
    \ system that future developers may not have, so in both cases, we build a domain-specific\
    \ object which encodes that information. In particular, note that `Distance` has\
    \ no mutator methods; once the constructor is done, `$length` and `$units` cannot\
    \ be modified. This gives us the immutability we want; we can pass a `Distance`\
    \ object to another function and safely keep using it ourselves, confident we\
    \ have not created any avenues for spooky action at a distance."
