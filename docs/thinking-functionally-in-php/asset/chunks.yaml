  trans: "\n3.  由于 `int` 涉及到一个函数边界，我们可以在应用的操作中强制执行类型检查。这在很大程度上是 PHP 特有的优势，但终究是一个优势。\n\
    \n4.  空情况的处理得更加优雅。我们不需要预先创建一个空的 `$result`，因为如果 `$list` 是空的，我们自然而然会得到空的 `$result`。更少的边缘情况处理总是一件好事。\n\
    \n5.  这在 PHP 中没有帮助，但在多线程或多进程语言中，每个转换的独立性意味着它们可以透明地分发到多个线程、进程、处理器或计算机上，而完全不需要更改程序逻辑，只需更改\
    \ `map()` 的内部实现即可。也可以通过编写一个新的类似于 `map()` 的例程（使用某种队列服务）来手动完成，因为实际操作本身现在已经单独定义了。\n\
    \n最后，它允许代码更具声明性；代码描述的是你想要什么（一个函数到列表的映射），而不是如何去做（迭代并填充数组）。“如何去做”仍然定义在某处，但它已经从应用程序的主控制流中分离出来。\n\
    \n# 过滤 (Filter)\n\n考虑一下这段过程化的代码：\n\n```\n1 foreach ($users as $user) {\n2    \
    \ if ($user->lastPaidDate() < date('-1 month')) {\n3         send_email($user->email(),\
    \ \"Overdue bill\", \"Pay up, slacker!\");\n4     }\n5 }\n```\n\n这里至少有五个不同的关注点，全部折叠在了一起。\n\
    \n1. 迭代\n2. 判断用户是否欠期\n3. 过滤掉未欠期的用户\n4. 定义要发送的邮件\n5. 发送邮件\n\n如果能将这些全部分离出来会好得多，这会让代码更具可读性和可测试性。\n\
    \n我们已经有了完成这些大多数步骤的工具；我们只是缺少第三步：过滤掉那些不应该因为欠期而对其大叫的用户。与 `map()` Go，PHP 有一种原生的针对数组的方法来实现它（`array_filter()`），但为了练习，我们将编写自己的\
    \ `iterable` 版本。\n\n```\n1 function filter(iterable $it, callable $ifTrue = null):\
    \ iterable\n2 {\n3     $ifTrue ??= fn($val): bool => (bool)$val;\n4     foreach\
    \ ($it as $key => $value) {\n5         if ($ifTrue($value)) {\n6             yield\
    \ $key => $value;\n7         }\n8     }\n9 }\n```\n\n与 `map()` 类似，我们的 `filter()`\
    \ 函数是惰性的，并且作用于任何可迭代对象，同时保留键。我们还定义了一个默认过滤函数，就像 `array_filter()` 一样，跳过为假（false-y）的值。`??=`\
    \ 运算符是 PHP 7.4 新引入的，被称为“空赋值运算符”。也就是说，当且仅当左侧变量为空时，它会将右侧的值赋值给左侧变量。如果不为空，则它什么都不做。\n\
    \n现在，让我们重写之前的过程化乱码，以分离所有的关注点：\n\n```\n 1 $isUnpaid = fn(User $user): bool\n 2\
    \     => $user->lastPaidDate() < date('-1 month');\n 3 \n 4 $mail = fn($email):\
    \ void\n 5     => send_email($email, \"Overdue bill\", \"Pay up, slacker!\");\n\
    \ 6 \n 7 $mailUser = fn($user) => $mail($user->email());\n 8 \n 9 $unpaid = filter($users,\
    \ $isUnpaid);\n10 $action = map($unpaid, $mailUser);\n11 \n 12 iterator_to_array($action);\n\
    ```\n\n在这里，我们定义了三个工具函数：\n\n* `$isUnpaid` 判断用户是否欠钱\n* `$mail` 向某个地址发送消息\n* `$mailUser`\
    \ 接收用户并调用 `$mail($user->email())`\n\n`$unpaid = filter($users, $isUnpaid);`\n\
    `$action = map($unpaid, $mailUser);`\n\n`iterator_to_array($action);`\n"
- fmt: "\n```\n1 $sum = fn(iterable $list) \n2     => reduce($list, memoize(fn($collect,\
    \ $val) => $collect + $val), 0);\n```\n\nNow, `$sum` is still a function; it takes\
    \ a list and reduces that list the same way as before. This time, though, since\
    \ it’s a single line function returning a value, we rewrite it using short lambda\
    \ syntax. We can also memoize the reducing function, as it’s a pure function.\
    \ In this specific example it doesn’t buy us anything, but if we’re computing\
    \ a lot of sums over time (or using a more expensive operation than just addition)\
    \ then dropping a `memoize()` in there can be a very cheap speedup. We could also\
    \ memoize all of `$sum` just as easily if we wanted; which place is optimal to\
    \ memoize, if either, depends heavily on your use case.\n\nOne of the interesting\
    \ facts about `reduce()` is that it can be used as the basis of many, if not most\
    \ other functional operations. For instance, there is no rule that the single\
    \ value returned from `reduce()` cannot itself be a list. A list is still a value!\n\
    \nThat means we could rewrite `map()` in terms of reduction:\n\n```\n1 function\
    \ map_r(iterable $it, callable $fn): iterable\n2 {\n3     return reduce(\n4  \
    \       $it,\n5         fn($result, $val, $key) => $result + [$key => $fn($val)],\n\
    6         []);\n7 }\n```\n\nConsider what this function does. The reduction starts\
    \ with an empty list `[]`, and then concatenates that empty list with the result\
    \ of calling `$fn` on the first value in `$it`, preserving the key. That returns\
    \ a new array with one key/value pair in it. That array is then concatenated with\
