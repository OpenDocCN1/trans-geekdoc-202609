    \ If you try to unwrap a `null`, you want to, well, not get a `null`. Different\
    \ languages have different ways of handling that. Since PHP has none of them,\
    \ the most straightforward is to just add a manual method check:\n\n```\n 1 class\
    \ Optional\n 2 {\n 3     private $value = null;\n 4 \n 5     // ...\n 6 \n 7 \
