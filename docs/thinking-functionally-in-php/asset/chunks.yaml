  raw: '*   A monad is an associative binary function that takes two endofunctors
    and produces an enhanced value.


    *   A monad is an associative binary function that takes two functions that return
    an “enhanced” and produces an enhanced value.


    *   A monad is a function that takes two functions that return an “enhanced” and
    produces an enhanced value.


    *   A monad is a function that lets you compose two functions that return “enhanced”
    values.


    All of those fancy words to get back to “a monad is a fancy kind of composition.”
    Because really, once we get back down to programming that’s all it means.


    ## Monads in Programming


    So why are monads so infamously scary and complicated? There’s a couple of reasons.


    One, because they’ve developed a mystique about them that is really unearned,
    due mostly to the funky sounding name. It’s also because Haskell supposedly uses
    them everywhere, yet there’s nothing in Haskell syntax that a programmer from
    a more common imperative language would recognize. That is, they’re famously confusing
    because they’re famous for being confusing.


    Two, because composition is so core to effective functional programming, and “enhanced”
    can mean pretty much anything, monads are extremely flexible. Or, rather, monads
    should be viewed as a design pattern (enhancing variables and then composing functions
    that work on them), and like any good design pattern they can crop up in an infinite
    number of places. While there are a few very common examples of monads, monad
    patterns can appear in ways that do not look at all like those common examples.


    Three, because most tutorials on them are terrible and confuse the matter with
    unnecessary analogies before jumping straight to category theory without any slow-build
    up. It is my hope that this book has provided sufficient slow build up that by
    now all of these fancy words make sense.


    Four, because the implementation of the monad pattern in most non-functional languages
    ends up looking nothing like its description above, and is implemented using classes.
    That’s not a bad way of doing it (we’re going to do exactly that in the following
    chapters), but it makes lining up the typical sample code with the theory difficult
    because it doesn’t actually map precisely. To make matters worse, every different
    library or tutorial uses a different set of nouns, some of which are borrowed
    from category theory, some from Haskell, and some from “it reads better for the
    actual code in this specific circumstance, so let’s go with that.” If you read
    three monad tutorials, you are going to get four sets of terminology.


    This is why we can’t have nice things.


    Over the next several chapters, we’re going to see different examples of “the
    monad pattern” in action. There are many common elements, but also elements that
    are highly specific to that particular use case.


    ## Anatomy of a PHP Monad


    In practice, to implement what in programming would be called a monad pattern,
    there are a few moving parts:


    First, you need a way to lift or enhance a value. Canonically, in category theory,
    this is called `unit`. In Haskell, it’s a special function called `return`. We
    can’t use `return` as a function name in PHP, of course. In practice, this is
    almost always the constructor of a class, because the natural way to enhance or
    decorate a value in PHP (and most similar languages) is to stick it in an object.
    It’s common (though not absolutely necessary) to provide a static method call
    as well to make the code read cleaner.


    Second, you need a way to enhance a function. That’s the `fmap` we saw before,
    which takes a function `f(int $x: int)` and turns it into `f(EnhancedInt $x):
    EnhancedInt`.


    These first two points are… not a monad. They constitute a *functor*, not a monad.


    Third, you need a way to take a function that expects an unenhanced value and
    returns an enhanced value, and then pass it an enhanced value. That is, if you
    have a PHP function `$G = f(int $x): EnhancedInt` you want a function `h(EnhancedInt
    $x, $G): EnhancedInt`. In Haskell, this operation is generically called `bind`.
    In other languages, it gets called `flatMap`. Because `EnhancedInt $x` can come
    from another function, including a previous call to `bind`, this is effectively
    combining two `$G` functions together: It’s a monoid, where the first function
    has already been invoked. That means, if you want to get pedantic, `bind` is the
    actual monad.


    Fourth, what happens if we try to combine `fmap` and `bind`? We end up with a
    function that takes `EnhancedInt` and returns `EnhancedEnhancedInt`, which is
    too meta to be useful. Instead, we need a function that takes an `fmap`ed function
    and `bind`s it, then sorts out the extra wrapping. The common name for this function
    is `join`, but you may also run across `chain`. It’s the same thing.


    Fifth, another common operation that is not technically part of the core definition
    is to `fmap` and apply a function in a single action. That commonly goes by the
    name `map`. If you think back to `map` on arrays, you can see that’s what it’s
    doing: It’s taking a function that operates on a single value, converting it to
    act on a list of values, passing it a list of values, and getting back a list
    of values.


    If you want to be really really pedantic, it’s possible to implement `bind` in
    terms of `join` and `fmap`. So in practice, depending on your specific use case,
    you may not need all five bits. The only required parts for the monad pattern
    are:


    1.  An enhance/wrap/decorate/lift operation for a value; in practice this is almost
    always an object constructor.


    2.  Some way to apply functions to that lifted value that continue to produce
    lifted values. This is some combination of `fmap`, `bind`, `join`, or `map`, which
    may go by different names in different use cases. (And, depending on the tutorial
    you read, some may be omitted entirely just to keep you on your toes.)


    3.  It follows the “monad laws.”


    The monad laws essentially boil down to “it’s still a monoid”:


    1.  `unit` is a left identity for `bind`. That is, `bind`ing a function to a wrapped
    value produces a wrapped value that is the same as applying the function to the
    unwrapped value. Put another way, the lift/wrap/enhance is a no-op with respect
    to the value being lifted/wrapped/enhanced.


    2.  `unit` is a right identity for `bind`. That is, `bind`ing a no-op function
    is a no-op.


    3.  `bind` is associative.


    By this point, you should be seeing a pattern in all of these laws: There’s a
    no-op, and it’s associative. Those two rules, expressed in various ways, are what
    makes composition safe and reliable. If composition is not safe and reliable,
    then weird bugs will spontaneously appear at random.


    # Algebraic Data Types


    ## Products


    Much of category theory is an abstraction from set theory. We already said types
    in programming languages are, or can be viewed as, discrete sets. That means there
    are “set like things” we should be able to do with them.


    For example, one thing you can do with sets is take a “Cartesian product.” That
    is, pair every permutation in the first set with every permutation in the second
    set. If you have two finite sets `A` and `B`, their Cartesian product is the set
    `AxB`, whose values are pairs of some value from `A` and some value from `B`,
    written `(a, b)`. The number of possible values in `AxB` is the number of possible
    values in type `A` multiplied by the number of possible values in type `B`. So
    if `A` is Booleans (two values), and `B` is even numbers under 15 (seven values)
    then the number of values in `AxB` is 2 * 7 = 14.


    You can think of a product in Boolean terms as “an `A` AND a `B`”.


    The programming language name for this is a *pair*, as in, a pair of values. Pairs,
    however, can be easily combined, because one of the types involved can itself
    be a pair. So given basic types (or sets, or objects, all the same thing depending
    on your perspective) `A`, `B`, and `C`, we can create `(a, (b, c))`, as well as
    `((a, b), c)`.'
