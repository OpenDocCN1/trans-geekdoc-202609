    \ function” get used more or less interchangeably (rightly or wrongly).\n\nThe\
    \ more formal name for an anonymous function is a *lambda*. The name comes from\
    \ “Lambda calculus”, which got its name because Alonzo Church, the inventor of\
    \ it, got tired of writing the word “function” and so started using the greek\
    \ letter lambda instead.\n\nBy default, all closures in PHP are by value—changing\
    \ `$factor` after `$multiply` is created doesn’t change `$multiply`.\n\n```\n\
    1 $factor = 6;\n2 $multiply = function(int $a) use ($factor): int {\n3     return\
    \ $a * $factor;\n4 };\n5 $factor = 5\n6 print $multiply(9); // Still prints 54\n\
    ```"
