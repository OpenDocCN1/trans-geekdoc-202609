- fmt: "\nBecause they’re both categories, we can define a functor that can convert\
    \ both objects (values) and morphisms (functions) from one to the other. That\
    \ is, we want to “lift” values and operations from the less-structured world of\
    \ `PHPType` to the more-structured world of `[PHPType]`.\n\nThis ends up being\
    \ an extremely powerful concept, especially later when we can get more creative\
    \ in what we define as a category. Usually, in PHP, we have to do a bit of manual\
    \ work for such a lifting functor. In PHP, though, this one is actually built-in.\n\
    \nThere are two parts to the functor we want. The first part converts values from\
    \ the world of `PHPType` to `[PHPType]`. The second part converts arrows, aka\
    \ morphisms, aka functions.\n\nLifting values, in this case, is trivial because\
    \ PHP has it built in: `array()` (or just `[]` in PHP 5.4 and later).\n\nLifting\
    \ functions is a bit more interesting. Remember that, strictly speaking, we can\
    \ only lift morphisms, aka unary functions. However, because of currying, we know\
    \ a multi-parameter function can be converted into a unary function (that is,\
    \ it’s isomorphic), so we can work with a multi-parameter function or a unary\
    \ function, whichever is easier.\n\nIn concept, our goal is to turn any function\
    \ like `foo(int $a): int` into `foo(int[] $a): int[]`. (Yes, that line is not\
    \ valid PHP as PHP lacks typed arrays, but hopefully you get the idea.) One way\
    \ to do so for a unary function is like this:\n\n```\n 1 function func_to_array_func(callable\
    \ $fn): callable\n 2 {\n 3     return function(array $arr) use ($fn): array {\n\
    \ 4         $res = [];\n 5         foreach ($arr as $val) {\n 6             $res[]\
    \ = $fn($val);\n 7         }\n 8         return $res;\n 9     };\n10 }\n```\n\n\
    That is, we have a new function that takes an array and returns an array, after\
    \ applying the original function to each element. That should look very familiar\
    \ by now: It is the definition of `map()` we saw earlier! That means we can easily\
    \ rewrite the lifting functor for arrays to simply:\n\n```\n1 function func_to_array_func(callable\
    \ $fn): callable\n2 {\n3     return fn(array $arr): array \n4         => iterator_to_array(map($arr,\
    \ $fn));\n5 }\n```\n\nWe’re not quite done. We still need to prove we’ve done\
    \ it right. That means proving two constraints still hold, called the “functor\
    \ laws.”\n\nThey should look familiar as they’re inherited from morphisms:\n\n\
    - The identity (no-op) function from `PHPType` maps to the identity function in\
    \ `[PHPType]`.\n- The lifted function (what `func_to_array_func()` returns) is\
    \ still associative.\n\nLet’s try it on the identity function:\n\n```\n1 $arr\
    \ = [1, 2, 3];\n2 $lifted = func_to_array_func('id');\n3 $result = $lifted($arr);\n\
    4 print_r($result);\n```\n\n```\n1 Array\n2 (\n3     [0] => 1\n4     [1] => 2\n\
    5     [2] => 3\n6 )\n```\n\nYep, that works. Is it associative? A full proof will\
    \ be difficult and time-consuming, but we can at least demonstrate the principle\
    \ with an example.\n\nTake these two functions:\n\n```\n1 $length = fn(string\
    \ $x): int => strlen($x);\n2 $times2 = fn(int $x): int => $x * 2;\n```\n\nFunctor\
    \ associativity means that mapping `$length` and `$times2` separately and then\
    \ composing them should give the same result as composing them and then mapping.\n\
    \n```\n1 $list = [\"Hello\", \"PHP\"];\n2\n3 $composed1 = fn(string $s): int =>\
    \ $times2($length($s));\n4\n5 $lifted1 = func_to_array_func($composed1);\n6 print_r($lifted1($list));\n\
    ```\n\nAnd here’s lifting them first:\n\n```\n1 $list = [\"Hello\", \"PHP\"];\n\
    2\n3 $list_length = func_to_array_func($length);\n4 $list_times2 = func_to_array_func($times2);\n\
    5\n6 $composed2 = fn(array $l): array => $list_times2($list_length($l));\n7\n\
    8 print_r($composed2($list));\n```\n\nBoth snippets print the exact output:\n\n\
    ```\n1 Array\n2 (\n3     [0] => 10\n4     [1] => 12\n5     [2] => 14\n6 )\n```\n\
    \nThus, `func_to_array_func()` is associative.\n\nAn important note on naming:\
    \ `func_to_array_func()` may be self-descriptive, but it’s extremely generic.\
    \ This sort of “lifting” function is so common that it would be better to give\
    \ it a common name we can recognize. The great thing about standards is there\
    \ are so many to choose from, of course, and the terminology varies between languages.\
    \ In Haskell, the name for this lifting function is `fmap`, as in “map this into\
    \ another category.” That’s the name we’ll use throughout the rest of the book\
    \ as we discuss more types of functor.\n\nOf course, we can’t use the same exact\
    \ name for every functor; PHP doesn’t support multiple definitions. Instead, we\
    \ have to namespace it somehow. There are conceptually any number of ways of doing\
    \ so, but for consistency we will use a static method. On what class, you ask?\
    \ On one that is a functor for the value. Stay tuned.\n\n## Function Objects\n\
    \nFinally, another terminology note. The word “functor” has meant “mapping between\
    \ categories” in category theory for some time. However, the term also got adopted\
    \ by some people on the software engineering side to mean something different:\
    \ function objects. At least C++ uses this terminology, and I’ve seen it referenced\
    \ in PHP once or twice. A “function object” is just a closure object, like we\
    \ saw all the way when talking about first class functions:\n\n```\n1 class Add1\n\
    2 {\n3     public function __invoke(int $a): int\n4     {\n5         return $a\
    \ + 1;\n6     }\n7 }\n```\n\nThis double meaning of the word “functor” is an unfortunate\
    \ effect of computer scientists and software engineers rarely talking to each\
    \ other, and leads to quite a bit of confusion when Duck Go.\n\nThe category theory\
    \ usage is, as far as I can tell, far older. I, therefore, conclude that the software\
    \ engineers who started using it to mean function object are responsible for the\
    \ confusion, and I reject their definition. In this book, “functor” always has\
    \ the category theory meaning of “mapping between categories,” and I recommend\
    \ using that nomenclature yourself. Just be aware the other definition may come\
    \ up at times. Now at least you can confidently tell people that they’re wrong.\n\
    \n# Fun With Functors\n\n## Combining Functors\n\nLet’s review a number of things\
    \ we’ve learned and their implications.\n\n1. A category can be of basically anything,\
    \ as long as certain rules are met. That includes language types, but also many\
    \ other things.\n2. A functor is a translation or mapping of both objects and\
    \ arrows to another category. In programming, we can view that as “lifting,” or\
    \ “enhancing,” or “decorating,” or “wrapping,” or various other verbs meaning\
    \ the same thing in this context.\n3. A functor to its own category is called\
    \ an endofunctor.\n4. It follows, therefore, that you can have a category of endofunctors.\n\
    \nAlso, consider:\n\n1. A monoid is a function that takes two parameters of the\
    \ same type, and produces a value of that type, and does so associatively.\n2.\
    \ A function’s “type” is the type of its return value, because that’s how you\
    \ can plug it into the input of another function.\n3. A functor is represented\
    \ as a function when we’re talking about programming.\n4. You can have a monoid\
    \ for functors of the same type: It takes two functors that produce a given type\
    \ and returns a value of that same type.\n5. “Functors of the same type” means\
    \ we’re talking about endofunctors.\n\nSo if we have two functors from `C` → `Enhanced\
    \ C`, called `F` and `G`, then we can write a monoid that combines them to produce\
    \ an `Enhanced C`: `monoid(F, G)` → `Enhanced C`.\n\nThis monoid is highly useful.\
    \ So useful in fact, that it gets its own special name: monad.\n\nYou may have\
    \ heard the joking phrase “A monad is just a monoid in the category of endofunctors.\
    \ What’s the problem?” Now we see what that phrase actually means, in category\
    \ theory. Translating all of those fancy-sounding words back down to terminology\
    \ we’re more used to:\n\n- A monad is just a monoid in the category of endofunctors.\n\
    - A monad is an associative binary function in the category of endofunctors.\n"
