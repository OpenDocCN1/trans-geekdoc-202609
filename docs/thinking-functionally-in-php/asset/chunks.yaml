  trans: "\n现在，我们拥有了一个经过充分测试的惰性纯函数单子状态机，这在软件“字谜游戏”中至少值三倍。\n\n# 第四部分\n\n## 函数式语言的特性\n\
    \n到目前为止，我们已经在 PHP 的语境下讨论了函数式编程。当然，PHP 并不是函数式编程的理想语言，因为它的语法并不总是让函数式技术变得简单或美观。然而，许多其他语言确实具有让函数式编程更自然的特性。当开发者推崇函数式编程的优点时，他们真正赞叹的通常是函数式语言中常见的语言特性。\n\
    \n俗话说，“编程语言会教你不想要它们不具备的功能。”这些功能中的某些初看之下可能很奇怪，特别是如果你从未工作过 PHP 以外的语言。然而，它们都已经在许多其他语言中实现并成功使用，这使得它们值得被理解，仅仅是为了更好地理解函数式编程能够实现什么。\n\
    \n这些功能并非所有在 PHP 中都是可能的，或者是有意义的。但为了更好地理解函数式编程作为一个概念和实践，我仍然展示了它们。\n\n### 自动柯化 (Auto-Currying)\n\
    \n正如之前讨论的，任何纯函数都可以被柯化为一个一个参数较少的函数。在大多数语言中，这可以通过手动完成。但在 Haskell 或 F# 中，这是所有函数的默认行为。\n\
    \n例如，在 Haskell 中，如下函数：\n\n```\n1 add :: Integer -> Integer -> Integer\n2 add x\
    \ y =  x + y\n```\n\n这定义了一个名为 `add` 的函数，其类型为 `Integer -> Integer -> Integer`。这可以同样正确地读为“一个接受两个整数并返回一个整数的函数”，也可以读为“一个接受一个整数并返回一个接受整数并返回整数的函数”。也就是说，它可以被括为以下任一种形式：\n\
    \n```\n1 add :: (Integer -> Integer) -> Integer\n2 \n3 add :: Integer -> (Integer\
    \ -> Integer)\n```\n\n这有两个关键的影响。第一，作为开发者，你只需通过传入少于所需数量的参数即可对任何函数进行柯化。第二，开发者和引擎都可以使用当时最方便的解释。一旦你学会了如何识别它，这将导致某些非常优雅的函数式语法。如果你不知道去寻找它，对于不熟悉\
    \ Haskell 的人来说，它会导致 Haskell 著名的“不可理解性”。\n\n在 PHP 中，这种功能能够实现的可能性是极低的。\n\n### 递归优化\
    \ (Recursion Optimization)\n\n许多递归算法都有等价迭代实现，它们与递归同构，但不会受到深层堆栈追踪的影响。某些语言具有检测递归调用并在编译步骤期间将其重构为迭代版本的能力，作为一种性能优化。\n\
    \n要通用地做到这一点是困难的，尾递归除除外。尾递归是指递归调用是函数中的最后一个语句。例如：\n\n```\n1 function addUp(int $x,\
    \ int $sum = 0): int\n2 {\n3     if ($x == 0) return $sum;\n4     return addUp($x\
    \ - 1, $sum + $x);\n5 }\n```\n\n然而，典型的阶乘实现并不是尾递归，因为最后一个语句是乘法，而不是对 `factorial()`\
    \ 的调用：\n\n```\n1 function factorial(int $x): int\n2 {\n3     if ($x == 1) return\
    \ $x;\n4     return $x * factorial($x - 1);\n5 }\n```\n\n许多语言支持尾递归优化。PHP 不支持。主要问题是是否可以在合理的时间内完成递归优化，而不至于减慢操作码的生成。\n\
    \n### 同构优化 (Isomorphic Optimization)\n\n函数式风格的代码包含更多函数调用是相当常见的；例如，每个 `map()` 调用都意味着对列表中的每个项目调用一次函数，而每个\
    \ `bind()` 调用意味着链条中的每一步都要调用两次函数。取决于语言，这可能涉及非同常的性能损失，在 PHP 中也是如此。\n\n如果编译器能够可靠地知道这样做是安全的，它可以将代码从更具可读性的函数式形式重组为性能更优的过程形式。例如，一系列\
    \ `Maybe` 单子等同于一个 `is_null` 死亡金字塔（pyramid of doom）。这就是为什么我们知道以单子的方式编写代码是安全的，因为它最终变得更容易阅读、调试和维护。然而，这有性能成本。如果编译器可以安全地将一系列\
    \ `Optional` 转换回 `is_null` 死亡金字塔，就可以完全消除单子封装的开销。\n\n这种优化可以导致 Rust 世界中所谓的“零成本抽象”，即抽象提高了可读性，但在代码实际运行之前就被优化销掉了。\n\
    \n遗憾的是，PHP 可能永远无法在这方面做很多。除了优化本身的性能成本外，只有当编译器能够非常、非常确定你的代码在做什么时，重新排排你的代码才是安全的。这通常需要保证的纯函数和强类型系统，而\
    \ PHP 这两者都不具备。保证的纯函数不太可能成为 PHP 的引擎级特性，而且在不包含此类优化的情况下，添加它们也不会有太大益处。\n\n### 函数组合\
    \ (Function Composition)\n\n可以进行的一种优化是围绕函数组合的。我们之前看到过，在用户空间中编写一个 `compose()` 函数是足够简单的：\n\
    \n```\n 1 function compose(callable ...$fns): callable\n 2 {\n 3     return function($x)\
    \ use ($fns) {\n 4         $ret = $x;\n 5         foreach ($fns as $fn) {\n 6\
    \             $x = $fn($x);\n 7         }\n 8         return $ret;\n 9     };\n\
    10 }\n```\n\n甚至是单行递归函数。但这为每次函数调用增加了开销，特别是当多个函数需要先进行柯化时。然而，为了使用我们那一章的示例，这个：\n\n\
    ```\n1 getPromotions(mostExpensiveItem(getShoppingList(getCurrentUser()), 'wishlist'),\
    \ [\n2     'exclude' => 'sale'\n3 ]), $holiday);\n```\n\n相当于下面这个，后者更容易阅读和维护：\n\
    \n```\n1 $holiday = \"Lincoln's Birthday\";\n2 $findPromFor = compose(\n3    \
    \ fn($x) => getShoppingList($x, 'wishlist'),\n4     fn($x) => mostExpensiveItem($x,\
    \ ['exclude' => 'sale']),\n5     fn($x) => getPromotions($x, $holiday),\n6 );\n\
    ```\n\n语言内置的拼接函数可以消除用户空间的开销，并可以为引擎提供更多优化选项。\n\n例如，F#（以及许多其他语言，包括 Facebook 的 PHP\
    \ 分支 Hack）有一个管道运算符 `|>`，它将 `compose()` 函数到了语法级别。在 F# 中，上面的示例可以这样写（同时利用自动柯化）：\n\
    \n```\n1 promos = getCurrentUser\n2     |> getShoppingList\n3     |> mostExpensiveItem\
    \ on sale\n4     |> getPromotions \"Lincoln's Birthday\"\n```\n\n虽然自动柯化很快不会成为\
    \ PHP 的特性，但从概念上来说，添加管道运算符并没有障碍。现在短 Lambda 表达式让任何函数的柯化变得如此简单，没有理由不添加它。\n\n一个注意事项是大多数管道运算符的实现是立即调用的。也就是说，上面的代码将执行\
    \ `getCurrentUser`、`getShoppingList`、`mostExpensiveItem` 和 `getPromotions`，返回\
    \ `getPromotions` 的返回值。这与我们的 `compose()` 方法不同，后者返回一个供以后使用的调用对象。幸运的是短 Lambda 表达式会让这种包装变得简单：\n\
    \n```\n1 $finder = fn($x) => $x |> 'getShoppingList' |> 'mostExpensiveItem' |>\
    \ 'getPromotions'\n2 ';\n```\n"
- fmt: "\nAs suggested by the last example, another weakness of PHP in terms of functional\
    \ programming is simply referring to functions. Because functions in PHP are not\
    \ truly first-class values, they cannot be referenced as easily as variables.\
    \ They need to be quoted, and if a function is in a namespace, the string that\
    \ represents their name must include the full namespace. That can lead to ugly\
    \ messes like:\n\n```\n1 array_map('\\foo\\bar\\baz\\compute_stuff', $list);\n\
    2 \n3 // or sometimes\n4 \n5 array_map(__NAMESPACE__ . '\\compute_stuff', $list);\n\
    ```\n\nBare unquoted strings in PHP have traditionally been evaluated to strings\
    \ with a notice; in PHP `7.2` that became a warning, but they’ve not been removed\
    \ entirely yet. That precludes referring to functions directly without quotes.\
    \ Within quotes, of course, functions are completely hidden from refactoring tools.\n\
    \nOne possibility that has been discussed is allowing for a function name to have\
    \ a class-constant-like suffix to refer to its name. That is, something like the\
    \ following:\n\n```\n1 use foo\\bar\\baz\\compute_stuff;\n2 \n3 array_map(compute_stuff::name,\
    \ $list);\n```\n\nThat would not be ideal, compared to what most functional languages\
    \ offer, but it would be a major improvement over the status quo. Regardless of\
    \ the approach, though, some better way to refer to functions as first-class values\
    \ without actually invoking them would greatly improve PHP’s potential as a functional\
    \ language.\n\n# Generics\n\nPHP has made great strides in recent years in terms\
    \ of its type system. While still entirely opt-in, the language has been steadily\
    \ adding to its ability to make explicit the type of values being passed around.\
    \ Yet much of the code samples in this book have omitted types almost entirely.\
    \ Why is that?\n\nThe bottom line is that for all its improvements, PHP’s type\
    \ system is still relatively weak compared to many other languages. In particular,\
    \ it lacks `generics`, also known as “parametric types.” With generics, one can\
    \ define a type in terms of another type, such as “an `Optional` that contains\
    \ a `string`” or “an `Optional` that contains a `User` object.” The “that contains”\
    \ part is deferred to call time. In a hypothetical world where PHP had generics\
    \ using the same syntax style as C++ and Java, the `Optional` class might look\
    \ something like the following (abbreviated):\n\n```\n 1 class Optional<T>\n 2\
    \ {\n 3     private T $value;\n 4 \n 5     public static function of(T $value\
    \ = null)\n 6     {\n 7         $this->value = $value;\n 8     }\n 9 \n10    \
    \ public function value(): T\n 11     {\n 12         return $this->valid() \n\
    \ 13             ? $this->value \n 14             : throw new \\RuntimeException(\"\
    The cat is dead, Schrodinger\");\n 15     }\n 16 }\n17 \n18 function getShoppingList(User\
    \ $u, string $list = 'main'): Optional<ShoppingList>\n19 {\n20     isset($u->lists[$list])\n\
    21         ? Some<ShoppingList>::of($u->lists[$list])\n22         : None::none();\n\
    23 }\n```\n\nIn essence, by writing `Optional` in a “that contains” syntax, we\
    \ can express the type-safe value. The `Optional` class is a wrapper around a\
    \ value that may or may not be present. The `of` method creates a new instance,\
    \ and the `value()` method returns the value. If the value is not present, it\
    \ throws a `RuntimeException`.\n\nThe `getShoppingList` function returns an `Optional<ShoppingList>`.\
    \ If the list exists for the user, it returns a `Some<ShoppingList>`, otherwise\
    \ it returns `None::none()`.\n"
  raw: "As suggested by the last example, another weakness of PHP in terms of functional\
    \ programming is simply referring to functions. Because functions in PHP are not\
    \ truly first-class values, they cannot be referenced as easily as variables.\
    \ They need to be quoted, and if a function is in a namespace, the string that\
    \ represents their name must include the full namespace. That can lead to ugly\
    \ messes like:\n\n```\n1 array_map('\\foo\\bar\\baz\\compute_stuff', $list);\n\
    2 \n3 // or sometimes\n4 \n5 array_map(__NAMESPACE__ . '\\compute_stuff', $list);\n\
    ```\n\nBare unquoted strings in PHP have traditionally been evaluated to strings\
    \ with a notice; in PHP 7.2 that became a warning, but they’ve not been removed\
    \ entirely yet. That precludes referring to functions directly without quotes.\
    \ Within quotes, of course, functions are completely hidden from refactoring tools.\n\
    \nOne possibility that has been discussed is allowing for a function name to have\
    \ a class-constant-like suffix to refer to its name. That is, something like the\
    \ following:\n\n```\n1 use foo\\bar\\baz\\compute_stuff;\n2 \n3 array_map(compute_stuff::name,\
    \ $list);\n```\n\nThat would not be ideal, compared to what most functional languages\
    \ offer, but it would be a major improvement over the status quo. Regardless of\
    \ the approach, though, some better way to refer to functions as first-class values\
    \ without actually invoking them would greatly improve PHP’s potential as a functional\
    \ language.\n\n## Generics\n\nPHP has made great strides in recent years in terms\
    \ of its type system. While still entirely opt-in, the language has been steadily\
    \ adding to its ability to make explicit the type of values being passed around.\
    \ Yet much of the code samples in this book have omitted types almost entirely.\
    \ Why is that?\n\nThe bottom line is that for all its improvements, PHP’s type\
    \ system is still relatively weak compared to many other languages. In particular,\
    \ it lacks *generics*, also known as “parametric types.” With generics, one can\
    \ define a type in terms of another type, such as “an `Optional` that contains\
    \ a `string`” or “an `Optional` that contains a `User` object.” The “that contains”\
    \ part is deferred to call time. In a hypothetical world where PHP had generics\
    \ using the same syntax style as C++ and Java, the `Optional` class might look\
    \ something like the following (abbreviated):\n\n```\n 1 class Optional<T>\n 2\
    \ {\n 3     private T $value;\n 4 \n 5     public static function of(T $value\
    \ = null)\n 6     {\n 7         $this->value = $value;\n 8     }\n 9 \n10    \
    \ public function value(): T\n11     {\n12         return $this->valid() \n13\
    \             ? $this->value \n14             : throw new \\RuntimeException(\"\
    The cat is dead, Schrodinger\");\n15     }\n16 }\n17 \n18 function getShoppingList(User\
    \ $u, string $list = 'main'): Optional<ShoppingList>\n19 {\n20     isset($u->lists[$list])\n\
    21         ? Some<ShoppingList>::of($u->lists[$list])\n22         : None::none();\n\
    23 }\n```\n\nIn essence, by writing `Optional` in a “generic” way, it can have\
    \ the extra type `T` defined by the caller when it’s instantiated. That is, `Optional<ShoppingList>`\
    \ is “an `Optional` wrapped around a `ShoppingList`.” The same `Optional` class\
    \ can be used for any wrapped type. In one sense, it creates a subclass of `Optional`\
    \ that fills in `ShoppingList` for `T` on the fly as needed.\n\nGenerics would\
    \ make type-safe monad-based error handling vastly easier.\n\nAnother natural\
    \ use for generics is collections. As of PHP 7.4, neither arrays nor other `iterable`\
    \ types can be locked down to contain only a specific type. Doing so requires\
    \ a custom class for each variable type to be wrapped, or else manual `instanceof`\
    \ checks. Generics would allow for easily declaring “list of type X” variables.\n\
    \nMany people have been pushing for generics in PHP for some time, and it would\
    \ be the next logical major improvement to the type system. Unfortunately, it\
    \ also has a lot of edge cases and performance issues to consider, which is largely\
    \ what has prevented it to date. Hopefully, in the future it will be possible.\n\
    \n## Callable Types\n\nAnother major gap in PHP’s type system found in more functional\
    \ languages is the ability to type a callable. Currently, when typing a parameter\
    \ or return value it can be typed only as `callable`, meaning any of PHP’s myriad\
    \ of ways to define a thing you can put `()` after. There’s no way to specify\
    \ an interface for it. It is possible to define an `__invoke()` method in an interface.\n\
    \n```\n1 interface UserFinder\n2 {\n3     public function __invoke(int $id): User\n\
    4 }\n```\n\nBut that cannot be enforced without specifying `UserFinder` as the\
    \ parameter or return type, which then precludes using an anonymous function or\
    \ global function.\n\nThere are two ways that callable types could be implemented.\
    \ One is pre-defining a type and referencing it:\n\n```\n1 callable UserFinder(int\
    \ $id): User;\n2 \n3 function foo(UserFinder $fn) { ... }\n```\n\nWhile the other\
    \ would specify the callable syntax inline:\n\n```\n1 function foo(callable(int):\
    \ User $fn) { ... }\n```\n\nThere’s decent arguments for either approach, and\
    \ they wouldn’t necessarily be incompatible, either. Either one would be a big\
    \ boost to PHP’s functional programming support.\n\n## Comprehensions\n\n*Comprehensions*\
    \ are a way to represent a list in terms of another list by describing its relationship,\
    \ rather than building a new list explicitly. For instance, “list A is twice list\
    \ B” or “list A is list B but without the negative numbers.” If that sounds a\
    \ lot like map and filter, that’s because those two operations allow nearly any\
    \ list comprehension.\n\nThe syntax for comprehensions varies widely from language\
    \ to language. For example, the following Python code creates a list named `squares`\
    \ where each element is the value from the list `range(10)`, multiplied by itself:\n\
    \n```\n1 squares = [x**2 for x in range(10)]\n```\n\nWhich would be equivalent\
    \ to this PHP:\n\n```\n1 $squares = [];\n2 foreach (range(1, 10) as $x) {\n3 \
    \    $squares[] = $x * $x;\n4 }\n```\n\nMore involved examples are also possible.\
    \ for instance:\n\n```\n1 employees = [emp.name for m in managers if m.dept=\"\
    sales\" for emp in m.reports]\n```\n\nThat Python comprehension builds a list\
    \ of the names of all employees who report to a manager in the sales department,\
    \ equivalent to this PHP code:\n\n```\n1 $employees = [];\n2 foreach ($managers\
    \ as $m) {\n3     if ($m->department = \"shipping\") {\n4         foreach ($m->reports\
    \ as $employee) {\n5             $employees[] = $employee->name;\n6         }\n\
    7     }\n8 }\n```\n\nComprehensions can be either greedy (meaning they create\
    \ the new list immediately) or lazy (meaning they create the new list on-demand\
    \ as it is iterated). The latter makes it possible to work with infinite lists\
    \ in a very natural fashion.\n\nHaskell of course has strong comprehension support,\
    \ and everything in Haskell is lazy:\n\n```\n1 squares = [x * x | x <- [0...10],\
    \ x * x > 5]\n```\n\nWhich can be read as “x times itself, where x is drawn from\
    \ the list 0 through 10, on condition that x \\* x is greater than 5.”\n\nC# supports\
    \ comprehensions via a custom syntax that is designed to look very much like SQL,\
    \ called LINQ (Language INtegrated Query):\n\n```\n1 var ns = from x in Enumerable.Range(0,\
    \ 100)\n2         where x * x > 3\n3         select x * 2;\n```\n\nWhich is an\
    \ alternate syntax for the equally valid:\n\n```\n1 var ns = Enumerable.Range(0,\
    \ 100)\n2         .Where(x => x * x > 3)\n3         .Select(x => x * 2);\n```\n\
    \nThe latter is essentially what “collection objects” look like in PHP today,\
    \ with short lambdas. `Where` is `filter` and `Select` is `map`.\n\nThere’s no\
    \ conceptual reason why PHP couldn’t support lazy comprehensions, using either\
    \ the Python/Haskell style syntax or something LINQ-like. No one’s implemented\
    \ it yet. They would, however, greatly improve PHP’s ability to be written in\
    \ a declarative fashion.\n\n## Integrated Optionals"
