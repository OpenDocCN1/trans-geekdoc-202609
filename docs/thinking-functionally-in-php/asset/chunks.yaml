    In particular, this means embracing “skinny objects”: Value objects that have\
    \ little business logic of their own other than enforcing data integrity. An object\
    \ that contains data should never, ever have a dependency on a service object,\
    \ or auxiliary logic object. Its constructor should be concerned only with its\
    \ own data and nothing else.\n\nYes, that does go against traditional OOP dogma,\
    \ in which objects form a complex network of interacting agents. That’s because\
    \ it’s a functional approach, not an OOP approach. And, given PHP’s shared-nothing,\
    \ stateless runtime model, that way of designing objects tends to work better\
    \ in practice anyway as the setup for it is much, much simpler.\n\nAdditionally,\
    \ for value objects that you can guarantee are internal to your library or module,\
    \ don’t sweat property access as much. If the object is purely for internal use,\
    \ and it seems wasteful to build getters and setters that do nothing but wrap\
    \ private properties, skip them and use a public property instead. From a functional\
    \ point of view, that’s fine. (That applies only for strictly internal implementation\
    \ detail objects, however. For objects that form your API, the usual encapsulation\
    \ practices still apply.)\n\n## Embrace Functions as Values\n\nDon’t think of\
    \ functions (or any other callable, really) as stand-alone, immutable, set-in-stone\
    \ things. Rather, a function is a value. You can create one as easily as any other\
    \ value, pass it around as a value, and use it as a value. You can have function-values\
    \ that produce function-values if the situation calls for it.\n\nCertainly, it\
    \ is possible to create a horrible mess that way if you’re not careful. Inlining\
    \ multiple nested callbacks, for instance, is a proven terrible idea. However,\
    \ adapting a function that expects one interface (say, multiple parameters) to\
    \ one that wants a different interface (a single parameter, or even no parameters)\
    \ using a closure should be a natural part of your workflow. As with any other\
    \ technique, it can be used wisely to produce very readable code or badly to produce\
    \ spaghetti code.\n\n## Make Single-Method Callable Services\n\nAs previously\
    \ observed, a service object with only a single public method is isomorphic to\
    \ (effectively the same thing as) a free-standing function that is closed over\
    \ some of its parameters. If you have a service with only a single method, don’t\
    \ bother naming it. Just use the `__invoke()` method. The object now becomes usable\
    \ exactly like a function: Stick `()` after it to call the `__invoke()` method.\
    \ Referencing that method as a callable becomes easier as well, since there’s\
    \ no screwy array syntax needed; just the variable name of the object is sufficient.\n\
    \nThat may look weird at first, but after a while, it should start to feel even\
    \ more natural, to the point you may start restructuring your services to be single-method\
    \ more often. This is especially true for things like controller actions, command\
    \ objects, and other objects designed to have a single “do the thing” method;\
    \ just use `__invoke()` for that.\n\n## Think in Terms of Pipelines and Data Flow\n\
    \nObject-oriented thinking traditionally encourages you to think of objects as\
    \ a connected graph of persistent things, like neurons in a network. Functional\
    \ programming encourages you to think of your application as a series of stateless\
    \ pipelines through which data flows, changing shape as it goes and possibly branching\
    \ or merging between different pipelines.\n"
  raw: "In particular, this means embracing “skinny objects”: Value objects that have\
    \ little business logic of their own other than enforcing data integrity. An object\
    \ that contains data should never, ever have a dependency on a service object,\
    \ or auxiliary logic object. Its constructor should be concerned only with its\
    \ own data and nothing else.\n\nYes, that does go against traditional OOP dogma,\
    \ in which objects form a complex network of interacting agents. That’s because\
    \ it’s a functional approach, not an OOP approach. And, given PHP’s shared-nothing,\
    \ stateless runtime model, that way of designing objects tends to work better\
    \ in practice anyway as the setup for it is much, much simpler.\n\nAdditionally,\
    \ for value objects that you can guarantee are internal to your library or module,\
    \ don’t sweat property access as much. If the object is purely for internal use,\
    \ and it seems wasteful to build getters and setters that do nothing but wrap\
    \ private properties, skip them and use a public property instead. From a functional\
    \ point of view, that’s fine. (That applies only for strictly internal implementation\
    \ detail objects, however. For objects that form your API, the usual encapsulation\
    \ practices still apply.)\n\n## Embrace Functions as Values\n\nDon’t think of\
    \ functions (or any other callable, really) as stand-alone, immutable, set-in-stone\
    \ things. Rather, a function is a value. You can create one as easily as any other\
    \ value, pass it around as a value, and use it as a value. You can have function-values\
    \ that produce function-values if the situation calls for it.\n\nCertainly, it\
    \ is possible to create a horrible mess that way if you’re not careful. Inlining\
    \ multiple nested callbacks, for instance, is a proven terrible idea. However,\
    \ adapting a function that expects one interface (say, multiple parameters) to\
    \ one that wants a different interface (a single parameter, or even no parameters)\
    \ using a closure should be a natural part of your workflow. As with any other\
    \ technique, it can be used wisely to produce very readable code or badly to produce\
    \ spaghetti code.\n\n## Make Single-Method Callable Services\n\nAs previously\
    \ observed, a service object with only a single public method is isomorphic to\
    \ (effectively the same thing as) a free-standing function that is closed over\
    \ some of its parameters. If you have a service with only a single method, don’t\
    \ bother naming it. Just use the `__invoke()` method. The object now becomes usable\
    \ exactly like a function: Stick `()` after it to call the `__invoke()` method.\
    \ Referencing that method as a callable becomes easier as well, since there’s\
    \ no screwy array syntax needed; just the variable name of the object is sufficient.\n\
    \nThat may look weird at first, but after a while, it should start to feel even\
    \ more natural, to the point you may start restructuring your services to be single-method\
    \ more often. This is especially true for things like controller actions, command\
    \ objects, and other objects designed to have a single “do the thing” method;\
    \ just use `__invoke()` for that.\n\n## Think in Terms of Pipelines and Data Flow\n\
    \nObject-oriented thinking traditionally encourages you to think of objects as\
    \ a connected graph of persistent things, like neurons in a network. Functional\
    \ programming encourages you to think of your application as a series of stateless\
    \ pipelines through which data flows, changing shape as it goes and possibly branching\
    \ or merging between different pipelines.\n\nThat pipeline metaphor is a far better\
    \ fit for the typical PHP HTTP application than the persistent connected network\
    \ because that’s what a PHP application is. It takes in an HTTP request message\
    \ (in whatever form), runs that through a series of operations, and produces a\
    \ response message (in whatever form) at the other end, after which everything\
    \ shuts down. That is, conceptually, a function, and can be composed of smaller\
    \ functions.\n\nWhether those functions are syntactically free-standing functions\
    \ or methods of an immutable service is an implementation detail. Stateless service\
    \ objects are likely more familiar to most PHP developers, but in some cases,\
    \ a pure-function approach may be easier to read and maintain. Using good judgment\
    \ here case-by-case is the best approach.\n\nHowever, that also means explicitly\
    \ composing pipelines rather than having deep method call chains. Many library\
    \ routines have code that says essentially “do this, then do this, then do this,\
    \ then do this.” That’s a perfectly reasonable approach conceptually, but the\
    \ various “this” actions are often methods on disparate objects stitched together\
    \ through dependency injection. That can obfuscate the actual business logic by\
    \ spreading it out across a lot of different classes.\n\nInstead, consider building\
    \ each of those steps as its own callable (be it a method of a service, a function,\
    \ or a service that uses `__invoke()`) and then gluing them together using `compose()`.\
    \ That style encourages creating discrete, reusable, testable components, and\
    \ makes the logic flow between them much more obvious.\n\nCompare:\n\n```\n 1\
    \ function A($value)\n 2 {\n 3     // ...\n 4     return B($modified_value);\n\
    \ 5 }\n 6 \n 7 function B($value)\n 8 {\n 9     // ...\n10     return C($modified_value);\n\
    11 }\n12 \n13 function C($value)\n14 {\n15     // ...\n16     return D($modified_value);\n\
    17 }\n18 \n19 function D($value)\n20 {\n21     // ...\n22     return $computed_value;\n\
    23 }\n24 \n25 $val = A($value);\n```\n\nwith:\n\n```\n 1 function A($value)\n\
    \ 2 {\n 3     // ...\n 4     return $modified_value;\n 5 }\n 6 \n 7 function B($value)\n\
    \ 8 {\n 9     // ...\n10     return $modified_value;\n11 }\n12 \n13 function C($value)\n\
    14 {\n15     // ...\n16     return $modified_value;\n17 }\n18 \n19 function D($value)\n\
    20 {\n21     // ...\n22     return $modified_value;\n23 }\n24 \n25 $f = compose('A',\
    \ 'B', 'C', 'D');\n26 \n27 $val = $f($value);\n```\n\nThe second is more decoupled,\
    \ more testable, more reusable, doesn’t hide a long dependency chain, and makes\
    \ it easier to follow the logic flow from a single place. Those are all things\
    \ you want.\n\n## Use Maybe and Either for Error Handling\n\nErrors are a fact\
    \ of life in every codebase, be it developer error, user error, or the combination\
    \ of the two. Before reaching for exceptions, which are themselves quite expensive,\
    \ see if you can instead use the Maybe or Either patterns for handling error cases.\
    \ In particular, monads are a good alternative for cases where the error isn’t\
    \ world-ending catastrophic (like the database crashing mid-request) but for predictable\
    \ and recoverable bad data, like a validation error or an entity-not-found.\n\n\
    This requires shifting your mindset a bit. Rather than thinking of a missing user\
    \ as an error-condition, you’re using types to redefine the problem space. `getUser(int\
    \ $id): User` is not a total function. It is a partial function over `int` because\
    \ some integers map to a `User` and some do not. However, by re-reconceptualizing\
    \ the problem to a map from `int` to `Maybe User`, it becomes a total function;\
    \ the extra integers that have no corresponding `User` object now map to `None`,\
    \ which is a legit value in the set `Maybe User`.\n\nA missing user is no longer\
    \ an error at all, but a valid return value that we can check for. But because\
    \ of the `Maybe` wrapper, we don’t run the risk of forgetting to check for `null`\
    \ and breaking code further down the line. It’s closer to a sentinel value but\
    \ much more robust.\n\nSimilarly, a validation pipeline that uses an `Either`\
    \ pattern acknowledges that a value not passing validation is not an error condition;\
    \ it’s a frequently expected everyday occurrence.\n\nIf you’ve ever heard someone\
    \ lament that you should never use exceptions for flow control without offering\
    \ an alternative, here’s the alternative: Use monads for flow control instead.\
    \ Leave the exceptions for the truly exceptional, unexpected explosions.\n\n##\
    \ Don’t Overdo It"
