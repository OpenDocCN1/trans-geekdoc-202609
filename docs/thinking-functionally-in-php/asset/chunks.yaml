    \ case, `$promotions` is now an `Optional`, which may or may not contain a list\
    \ of promotions. While this code isn’t quite as clean looking as the version that\
    \ used `compose()`, it doesn’t have the `null` bugginess of that version, and\
    \ it’s way cleaner than the deeply nested mess above.\n\nLook carefully at the\
    \ methods we’ve written. Every one is a pure function. Assuming no `null`s happen,\
    \ a new `Optional` object is returned each time. They really are just piped together\
    \ in a pure, functional way.\n\nWe could make one optimization and statically\
    \ cache an instance of `Optional` with a null value to return from the `none()`\
    \ static method. That would, strictly speaking, make it not a truly pure function.\
    \ However, the net effect externally is still the same, and it means over the\
    \ course of a program you need only a single “null instance,” which you could\
    \ compare with `===`. Whether that’s worth it or not I leave up to personal preference.\n\
    \n### Getting Back Out\n\nWe could continue working with `Optional`s as long as\
    \ we want. For instance, we could pass (`bind`) `$promotions` to a theming function\
    \ that returns rendered HTML-or-`null`. Some purists argue that once lifted to\
    \ an enhanced variable, you should never come back down. I find that to be practical\
    \ only some of the time. Generally speaking, once lifted you should stay there\
    \ “as long as possible but no longer.” That means there needs to be some way to\
    \ “unlift”/”unwrap”/”unwhatever” the value. There’s zero standardization for what\
    \ to name that operation. In Rust it’s `unwrap()`. `value()` is also a completely\
    \ viable option. I’ve also seen `extract()` and `unpack()`."
