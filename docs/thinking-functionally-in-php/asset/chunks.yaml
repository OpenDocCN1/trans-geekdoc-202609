    \ Reading](#chap00.xhtml)\n\n# Preface\n\nFunctional programming has been an interest\
    \ of mine for years. That’s not to say I’ve been an expert in it, or that I’ve\
    \ done much work in strictly functional languages, just that I’ve been interested\
    \ in the topic.\n\nSadly, I’ve long found the available documentation and tutorials\
    \ on the web to be lack-luster. Most of them either cover the very basics and\
    \ then stop, or assume you’re already an expert in Haskell and so explain advanced\
    \ topics in the most convoluted and Haskell-centric way possible. Neither of these\
    \ did I find useful.\n\nI have also found that the Curse of Monads seems to be\
    \ true, as nearly every explanation I found about that mythical concept was obtuse,\
    \ assumed you had three years of advanced mathematical training, or so dumbed-down\
    \ as to be actively harmful to understanding.\n\n> “Once you understand monads,\
    \ you immediately become incapable of explaining them to anyone else.”\n\n> \n\
    \n> –Gilad Bracha\n\nCombined with PHP’s overall clunky syntax for doing functional-esque\
    \ code, I generally didn’t go further than “pure functions are your friend,” either\
    \ in my own code or what I explained to others.\n\nThat is, until PHP 7.4.\n\n\
    PHP 7.4’s introduction of short lambdas is, as we’ll see in this book, a game-changer.\
    \ While it doesn’t make anything new *possible*, it makes a lot of things suddenly\
    \ *practical*. That makes all the difference, so I decided it was time to buckle\
    \ down and really dig into functional programming. And what better way to learn\
    \ than to force yourself to teach it to others?\n\nI don’t mean that sarcastically;\
    \ in fact, that’s been my history with functional programming from the beginning.\
    \ I submitted a talk to a conference back in 2012 on functional programming before\
    \ I really knew what I was doing, because that gave me a reason to learn it well\
    \ enough to be able to explain it. I went on to give it 10 times. This book has\
    \ had the same effect.\n\nI knew when I started out that I was going to have to\
    \ actually learn, finally, what all this category theory fuss was about. I did\
    \ not expect it to be as hard as it was; apparently the Curse of Monads applies\
    \ to most of category theory. A large part of the issue seems to be that no one\
    \ can agree on how to call anything; it took reading a dozen tutorials in a half\
    \ dozen languages to realize just how much the terminology varied, and just how\
    \ much of a problem that causes for people trying to learn functional programming,\
    \ category theory, or anything else.\n\nI never would have thought that software\
    \ engineering could be held up as an example of having consistent terminology,\
    \ but I suppose all things are relative.\n\nThe central crux of this book is Part\
    \ Two, in which I tackle the hard, academic, theoretical bits. It seems to be\
    \ a trope that any time someone thinks they have understood monads they write\
    \ an online tutorial about it, and I suppose I am no different. It is my hope\
    \ that by writing that section, and rewriting it multiple times, while learning\
    \ the material itself I was able to straddle the threshold between this world\
    \ and the next (the one in which one does not understand monads, and the one in\
    \ which one cannot explain them) long enough to capture a reasonable explanation\
    \ of them. Should you find that I was successful, I would love to hear about it.\n\
    \nI am indebted to a number of people for their help in making this book happen.\n\
    \n*   Nash van Gool, who provided early validation that my early efforts were\
    \ not entirely incomprehensible.\n\n*   Nash and my colleague Chad Carlson, who\
    \ served as beta testers for the first draft of the manuscript.\n\n*   Shayna\
    \ Steinberg, for reviewing the category theory section and validating it is comprehensible\
    \ even for non-programmers/mathematicians.\n\n*   Bartosz Milewski, whose book\
    \ and website “[Category Theory for Programmers](https://bartoszmilewski.com/2014/10/28/category-theory-for-programmers-the-preface/)”\
    \ is the best tome on the subject to date. He also was kind enough to answer my\
    \ random validation questions on online forums, even though he had no idea why\
    \ I was asking.\n\n*   My editor, [Kara Ferguson](http://www.karaferguson.net/),\
    \ without whom it’s quite possible there would be not a single comma in the right\
    \ place in this entire book.\n\n*   [Rebekah Simensen](https://ninjagrl.com/),\
    \ who provided the delightful cover art you have probably already enjoyed. (Assuming\
    \ you looked at the cover before opening this book, anyway, which seems likely.)\n\
    \nAnd of course to you, dear reader, as a book that is not read may as well not\
    \ exist. It is my sincere hope that you find this volume educational, entertaining,\
    \ and eye-opening. Or at least that it serves you as more than a monitor stand.\n\
    \nMay your life be as pure as your code. I wish you well.\n\n–Larry Garfield,\
    \ @Crell\n\n begin mainmatter  \n\n# Introduction\n\nIn recent years, functional\
    \ programming has become increasingly popular as a concept. Even in “non-functional”\
    \ programming languages, the concepts and practices of functional programming\
    \ have become more mainstream.\n\nWhy is that? Are they actually useful, or is\
    \ functional programming in a language other than Haskell just trying to fit a\
    \ square peg into a round hole? What even is functional programming, and does\
    \ it make sense in PHP?\n\nThis book aims to answer those questions. (Spoiler\
    \ alert: The answer is yes.) While writing PHP as if it were Haskell, ML, or LISP\
    \ is not going to produce a good result, the underlying principles behind functional\
    \ programming offer many advantages, even in PHP. Other parts, however, do not,\
    \ and that’s okay.\n\nThe aim of this book is not to convince you to write all\
    \ PHP code in a strictly and rigidly functional fashion. Rather, the aim is to\
    \ encourage you to approach problems from a functional mindset and apply the underlying\
    \ principles of functional programming… most of the time. Many of them, in fact,\
    \ you have no doubt encountered before in other contexts talking about “good code”\
    \ under different names, such as the SOLID principles. That’s a good sign the\
    \ concepts involved are a good idea.\n\n## Functional vs. Procedural"
