    \ no-op value is 1. That is:\n\n```\n1 $a * 1 == $a\n```\n\nFor every possible\
    \ integer value of `$a`.\n\nIt turns out this combination of properties is rather\
    \ useful in general. So useful that it has a fancy name: a *monoid*.\n\nA “monoid”\
    \ refers to a function that:\n\n*   Is pure\n\n*   Is a binary function (takes\
    \ two parameters and returns one value, all of the same type)\n\n*   Is associative\n\
    \n*   Has an identity value\n\nMore formally, we can say that multiplication is\
    \ a monoid over integers. Stated more precisely, there is a monoid **<ℤ, multiply,\
