- fmt: "\n*   A monad is an associative binary function that takes two endofunctors\
    \ and produces an enhanced value.\n*   A monad is an associative binary function\
    \ that takes two functions that return an “enhanced” and produces an enhanced\
    \ value.\n*   A monad is a function that takes two functions that return an “enhanced”\
    \ and produces an enhanced value.\n*   A monad is a function that lets you compose\
    \ two functions that return “enhanced” values.\n\nAll of those fancy words to\
    \ get back to “a monad is a fancy kind of composition.” Because really, once we\
    \ get back down to programming that’s all it means.\n\n## Monads in Programming\n\
    \nSo why are monads so infamously scary and complicated? There’s a couple of reasons.\n\
    \n**One**, because they’ve developed a mystique about them that is really unearned,\
    \ due mostly to the funky sounding name. It’s also because Haskell supposedly\
    \ uses them everywhere, yet there’s nothing in Haskell syntax that a programmer\
    \ from a more common imperative language would recognize. That is, they’re famously\
    \ confusing because they’re famous for being confusing.\n\n**Two**, because composition\
    \ is so core to effective functional programming, and “enhanced” can mean pretty\
    \ much anything, monads are extremely flexible. Or, rather, monads should be viewed\
    \ as a design pattern (enhancing variables and then composing functions that work\
    \ on them), and like any good design pattern they can crop up in an infinite number\
    \ of places. While there are a few very common examples of monads, monad patterns\
    \ can appear in ways that do not look at all like those common examples.\n\n**Three**,\
    \ because most tutorials on them are terrible and confuse the matter with unnecessary\
    \ analogies before jumping straight to category theory without any slow-build\
    \ up. It is my hope that this book has provided sufficient slow build up that\
    \ by now all of these fancy words make sense.\n\n**Four**, because the implementation\
    \ of the monad pattern in most non-functional languages ends up looking nothing\
    \ like its description above, and is implemented using classes. That’s not a bad\
    \ way of doing it (we’re going to do exactly that in the following chapters),\
