    \    return fn($x) => reduce($fns, fn($collect, $fn) => $fn($collect), $x);\n\
    15 }\n```\n\n再次，我展示了冗长和更简洁的版本。它们是等价。在任何一种情况下，`compose()` 仍然返回一个新函数，但这次该函数只有一个语句：在函数列表（记住，它们和其他变量一样“仅仅”是变量）上调用\
    \ `reduce()`，并带有一个归约函数，该归约函数仅仅是“使用当前值调用函数”（即 `$fn($collect)`）。\n\n这是 `reduce()`\
    \ 用于加法之外其他用途的完美范例，并证明了能够将函数视为值的强大之处。`compose()` 现在是一个单行函数，我们可以用它通过将每个任意函数包装成一元函数来将任意函数链连接在一起。如果一个函数已经是一元的，则可以原样传递，尽管\
