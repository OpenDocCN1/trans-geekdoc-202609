    最后，请承认你正在编写 PHP。PHP 允许你编写函数风格的代码，你很可能会从中受益匪浅。然而，PHP 从根本上说并不是一种函数式语言。有时，函数式方法确实比你习惯的面向对象风格更难以阅读或维护。或者，更常见的情况是，将函数式原则与面向对象的语法进行智能集成才是最佳平衡点。


    PHP 是一种多范式语言。请使用能让你获得最可读、可维护、可测试且高性能结果的范式。这通常是函数式方法，但并不总是如此。


    在可能混淆引用的风险下，请务始终为任务选择正确的双头羊丝锤。


    # 更多资源


    书籍和文章会有“延伸阅读”部分是很常见的，但当然，在 2020 年代，有大量优秀的资源不在书籍中，而是在视频、幻灯片和其他非传统媒体中。如果你想了解更多泛指函数式编程，它们仍然非常有价值。


    以下是我在准备这本书时发现非常有用的资源集合，我推荐给那些被这些页面激发了兴趣的读者。（或者给那些被彻底搞晕并想要获得更好内容的人；我很抱歉。）


    ## 书籍


    “[程序员的范畴论](https://bartoszmilewski.com/2014/10/28/category-theory-for-programmers-the-preface/)”，Bartosz
    Milewski 著 (2018)。


    这是我希望在 20 年前甚至 10 年前就存在的书。它假设读者是程序员而不是已经知道范畴论的博士学数学家，从最基础开始讲解范畴论。它ن独特之处在于，同时使用了
    `Haskell` 和 `C++` 的示例，后者对于 PHP 程序员，或者说对于大多数其他并非建立在纯范畴论基础上的语言来说要有帮助得多。如果说它有什么缺点，那就是
    `C++` 版本的示例不够，索引也比我预想的薄得多。尽管如此，这是一本强烈推荐的读物。


    《计算机科学家的基础范畴论》，Benjamine C. Pierce 著 (1991)。


    一本老旧的作品，但非常短。这是一本密度极高的书，直接进入核心理论并包含了大量的希腊字母。现实地说，它只有 72 页；书的其余部分是冗长的延伸阅读章节和索引。它主要作为参考资料。


    “[从设计模式到范畴论](https://blog.ploeh.dk/2017/10/04/from-design-patterns-to-category-theory/)”，Mark
    Seemann 著。


    这本身并不是一本书，而是一系列有效地构成了一本在线书籍的文章。它从一个不同的角度处理该话题，我发现它相当有用。它的示例语言是 `C#`，对于 PHP 开发者来说应该容易理解。只需记住
    `C#` 大量使用了泛型。


    ## 视频


    [轨道导向编程](https://fsharpforfunandprofit.com/rop/)


    Scott Walachin 关于轨道导向编程的演讲及配套幻灯片。在这场演讲中，我真正开始理解单子（monads）的意义，尽管演讲强调这与单子无关。它是关于如何以有用的方式构建错误处理管道，而这恰好看起来像
    `Either` 单子。他还包含了一些关于火车的笑话。


    [函数式核心，命令式外壳](https://www.destroyallsoftware.com/screencasts/catalog/functional-core-imperative-shell)


    Gary Bernhardt 关于“函数式核心，命令式外壳”方法的视频。虽然视频使用的是 `Ruby`，但这些概念适用于任何语言。


    ## 论文


    [用于函数式编程的单子](http://homepages.inf.ed.ac.uk/wadler/papers/marktoberdorf/baastad.pdf)


    既然你已经学习了函数式编程、范畴论以及臭名昭著的单子的介绍，Philip Wadler 的原始论文可能就会变得意义。我第一次读时完全没有感觉，哪怕一点也没有，但如果我把这本书写得很好，你现在可能就能读懂了。


    [为什么单子如此重要？](https://cdsmith.wordpress.com/2012/04/18/why-do-monads-matter/)


    这是一个对单子更学术、更抽象的解读，解释了我们在这里涵盖的关于依赖、不确定性和副作用的许多相同概念。现在有了从书中提供的具体经验，它甚至可能变得有意义。

