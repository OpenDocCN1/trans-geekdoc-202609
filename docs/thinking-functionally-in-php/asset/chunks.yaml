    ```\n\n为了让代码更简洁，我这次省略了类型定义，而且正如前面指出的，如果出现问题，命名函数在运行时仍然无法通过类型检查。但现在我们可以非常清晰地看到我们的函数“链”，而且开销极小。添加一个新步骤非常简单：只需在列表中间添加一个新的一元短\
    \ Lambda 函数（lambda）包装器，或者替换掉其中一个，等等。只要函数与函数之间的类型仍然兼容，我们就没问题。现在，我们可以使用 `$findPromotionsFor(getCurrentUser())`\
    \ 函数来找到我们应该展示的促销活动。\n\n此外，由于 `$findPromotionsFor()` “仅仅”是一个函数，它还可以与其他函数进行进一步的组合/连接/管道处理（例如一个最终返回用户对象的链）。从头到尾都是管道化的函数！\n\
    \n如果这个概念让你觉得有些熟悉，那是因为它和 Unix 命令行背后的原理完全相同。小型、单一用途的函数通过 `|` 字符“管道”在一起，每个函数的输入和输出都是文本流。这里的原理是完全相同的，但因为我们有了更健壮的编程语言可以使用，我们可以使用比文本字符串更丰富的数据结构。请尽管这样做。\n\
    \n不过，让我们再次看看那个 `compose()` 函数。它看起来也应该诡异地熟悉。它正在遍历一个列表，并将上一次迭代的结果传递给下迭代。这看起来看起来非常像我们之前描述的\
    \ `reduce()` 函数吗？事实上，它们是完全一样的。\n\n在实践中，在 `compose()` 中重新实现循环逻辑性能更高，但为了完整性，让我们将其重写为归约（reduction）：\n\
    \n```\n 1 function compose(callable ...$fns): callable\n 2 {\n 3     return function\
    \ ($x) use ($fns) {\n 4         return reduce($fns, function($collect, $fn) {\n\
    \ 5             return $fn($collect);\n 6         }, $x);\n 7     };\n 8 }\n 9\
