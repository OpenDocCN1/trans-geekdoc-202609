  trans: "\n因为它们都是范畴（category），我们可以定义一个算子（functor），它可以将对象（值）和态射（函数）从一个转换到另一个。也就是说，我们想要将值和操作从结构较弱的\
    \ `PHPType` 世界“提升”（lift）到结构更完善的 `[PHPType]` 世界。\n\n这演变成了一个极其强大的概念，特别是当我们以后在对什么是范畴的定义上更具创意时。通常，在\
    \ PHP 中，我们必须为这种提升算子做一些手动工作。然而，在 PHP 中，这一个算子实际上是内置的。\n\n我们想要的算子包含两个部分。第一部分将值从 `PHPType`\
    \ 世界转换为 `[PHPType]`。第二部分将箭头，即态射，即函数转换。\n\n在这种情况下，提升值是轻而易举的，因为 PHP 内置了它：`array()`（或在\
    \ PHP 5.4 及更高版本中直接用 `[]`）。\n\n提升函数则稍微有趣一点。请记住，严格来说，我们只能提升态射，即一元函数。然而，由于柯里化（currying），我们知道多参数函数可以转换为一元函数（也就是说，它是同构的），所以我们可以处理多参数函数或一元函数，哪个简单就用哪一个。\n\
    \n在概念上，我们的目标是将任何像 `foo(int $a): int` 的函数转换为 `foo(int[] $a): int[]`。（是的，那行代码 PHP\
    \ PHP，因为 PHP 缺乏类型数组，但希望你理解这个意思。）对于一元函数，实现这一点的方法如下：\n\n```\n 1 function func_to_array_func(callable\
    \ $fn): callable\n 2 {\n 3     return function(array $arr) use ($fn): array {\n\
    \ 4         $res = [];\n 5         foreach ($arr as $val) {\n 6             $res[]\
    \ = $fn($val);\n 7         }\n 8         return $res;\n 9     };\n10 }\n```\n\n\
    也就是说，我们有一个新函数接收一个数组并返回一个数组，并在对每个元素应用原始函数。现在这看起来应该非常熟悉：它是我们之前看到的 `map()` 的定义！这意味着我们可以很容易将数组的提升算子重写为：\n\
    \n```\n1 function func_to_array_func(callable $fn): callable\n2 {\n3     return\
    \ fn(array $arr): array \n4         => iterator_to_array(map($arr, $fn));\n5 }\n\
    ```\n\n我们还没有完全完成。我们仍然需要证明我们做得对。这意味着要证明两个约束仍然成立，这些被称为“算子律”（functor laws）。\n\n它们看起来应该很熟悉，因为它们继承自态射：\n\
    \n- 来自 `PHPType` 的恒等（无操作）函数映射到 `[PHPType]` 中的恒等函数。\n- 提升后的函数（`func_to_array_func()`\
    \ 返回的内容）仍然具有结合律。\n\n让我们在恒等函数上尝试：\n\n```\n1 $arr = [1, 2, 3];\n2 $lifted = func_to_array_func('id');\n\
    3 $result = $lifted($arr);\n4 print_r($result);\n```\n\n```\n1 Array\n2 (\n3 \
    \    [0] => 1\n4     [1] => 2\n5     [2] => 3\n6 )\n```\n\n是的，这有效。它具有结合律吗？完整的证明将困难且耗时，但我们至少可以用例子来演示这个原理。\n\
    \n这两个函数：\n\n```\n1 $length = fn(string $x): int => strlen($x);\n2 $times2 = fn(int\
    \ $x): int => $x * 2;\n```\n\n算子的结合律意味着，分别映射 `$length` 和 `$times2` 然后将它们组合，得到的结果应该与先组合再映射的结果相同。\n\
    \n```\n1 $list = [\"apple\", \"banana\", \"cherry\"];\n2 $res1 = map($list, $length);\n\
    3 $res2 = map($res1, $times2);\n4\n5 $combined = fn(string $x) => $times2($length($x));\n\
    6 $res3 = map($list, $combined);\n```\n\n```\n1 $list = [\"apple\", \"banana\"\
    , \"cherry\"];\n2 $res1 = map($list, $length);\n3 $res2 = map($res1, $times2);\n\
    4\n5 $combined = fn(string $x) => $times2($length($x));\n6 $res3 = map($list,\
    \ $combined);\n```\n（注：此处原文示例代码似乎不完整或重复，已按逻辑对齐）\n\n```\n1 $list = [\"apple\",\
    \ \"banana\", \"cherry\"];\n2 $res1 = map($list, $length);\n3 $res2 = map($res1,\
