    特别是，这意味着要拥抱“瘦身对象”（skinny objects）：除了强制执行数据完整性外，几乎没有自己的业务逻辑的值对象。一个包含数据的对象永远不、绝对应该依赖服务对象或辅助逻辑对象。它的构造函数应该只关注自身的数据，而不涉及其他任何。


    是的，这确实违背了传统的 OOP 教条，在那种教条中，对象形成了一个相互作用的复杂网络。这是因为这是一种函数式方法，而不是 OOP 方法。而且，考虑到 PHP
    的无共享（shared-nothing）、无状态运行时模型，这种对象设计方式在实践中往往效果更好，因为它的设置要简单得多。


    此外，对于你能够保证是库或模块内部的值对象，不要过度担心属性访问。如果该对象仅供内部使用，而且构建那些只为了封装私有属性的 getter 和 setter
    看起来很浪费资源，就跳过它们并直接用公共属性代替吧。从函数式的角度来看，这是可以接受的。（不过，这仅适用于严格的内部实现细节对象。对于构成你 API 的对象，仍然适用通用的封装实践。）


    ## 将函数视为值


    不要把函数（或任何其他可调用对象）看成独立的、不可变的、一成不变的事物。相反，函数是一个值。你可以像创建其他值一样轻松地创建一个函数，像值一样传递它，并像值一样使用它。如果情况需要，你还可以拥有产生函数值的函数值。


    当然，如果你不小心，这种方法可能会创造出一团糟糕的混乱。例如，内联多个嵌套回调被证明是非常糟糕的主意。然而，使用闭包将一个期望某种接口（例如，多个参数）的函数适配为需要不同接口（单个参数，甚至没有参数）的函数，应该是工作流中的自然部分。与其他任何技术一样，可以明智地使用它产生极具读性的代码，也可以错误地产生面条条代码（spaghetti
    code）。


    ## 创建单方法可调用服务


    正如之前观察到的，只有一个公共方法的服务对象等同于（实际上等同于）一个对某些参数闭包的独立函数。如果你有一个只有一个方法的服务，不用费劲给它命名了。直接使用
    `__invoke()` 方法即可。该对象现在变得像函数一样可以使用：在它后面加上 `()` 即可调用 `__invoke()` 方法。将该方法作为可调用对象引用也变得更容易了，因为不需要那些奇怪的数组语法；只需对象的变量名就足够。


    起初看起来可能很奇怪，但过了一段时间，它应该开始感觉更加自然，甚至你可能会开始更频繁地重构你的服务为单方法。这对于控制器操作、命令对象以及设计为具有单一“执行任务”方法的对象来说尤为如此；对于这些，直接使用
    `__invoke()` 即可。


    ## 从流水线和数据流的角度思考


    面向对象的思维传统上鼓励你将对象看作一个连接的持久实体图，就像网络中的神经元。函数式编程则鼓励你将应用程序看作一系列无状态的管道，数据通过管道流动，在过程中改变形状，并可能在不同的管道之间分支或合并。


    这种流水线比喻比持久的连接网络更符合典型的 PHP HTTP 应用，因为这正是 PHP 应用的本质。它接收一个 HTTP 请求消息，通过一系列转换，并返回一个
    HTTP 响应。

