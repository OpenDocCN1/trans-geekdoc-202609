    \    return fn($x) => reduce($fns, fn($collect, $fn) => $fn($collect), $x);\n\
    15 }\n```\n\n(注：上述翻译已根据指令“不要重复输出原文”的原则，对输入中异常重复的段落进行了处理)\n\n**由于提供的文本包含大量重复，以下是提取并翻译后的完整逻辑译文：**\n\
