    \ and then composing them should give the same result as composing them and then\
    \ mapping the new function. Here’s composing them first:\n\n```\n1 $list = [\"\
    Hello\", \"PHP\"];\n2 \n3 $composed1 = fn(string $s): int => $times2($length($s));\n\
    4 \n5 $lifted1 = func_to_array_func($composed1);\n6 print_r($lifted1($list));\n\
    ```\n\nAnd here’s lifting them first:\n\n```\n1 $list = [\"Hello\", \"PHP\"];\n\
    2 \n3 $list_length = func_to_array_func($length);\n4 $list_times2 = func_to_array_func($times2);\n\
    5 \n6 $composed2 = fn(array $l): array => $list_times2($list_length($l));\n7 \n\
    8 print_r($composed2($list));\n```\n\nBoth snippets print the exact same output:\n\
    \n```\n1 Array\n2 (\n3     [0] => 10\n4     [1] => 6\n5 )\n```\n\nThus, `func_to_array_func()`\
    \ is associative.\n\nAn important note on naming: `func_to_array_func()` may be\
    \ self-descriptive, but it’s extremely not generic. This sort of “lifting” function\
    \ is so common that it would be better to give it a common name we can recognize.\
    \ The great thing about standards is there are so many to choose from, of course,\
    \ and the terminology varies between languages. In Haskell, the name for this\
    \ lifting function is `fmap`, as in “map this function into another category.”\
    \ That’s the name we’ll use throughout the rest of the book as we discuss more\
    \ types of functor.\n\nOf course, we can’t use the same exact name for every functor;\
    \ PHP doesn’t support multiple function definitions. Instead, we have to namespace\
    \ it somehow. There are conceptually any number of ways of doing so, but for consistency\
    \ we will use a static class method. On what class, you ask? On the one that is\
    \ a functor for the value. Stay tuned.\n\n## Function Objects\n\nFinally, another\
    \ terminology note. The word “functor” has meant “mapping between categories”\
    \ in category theory for some time. However, the term also got adopted by some\
    \ people on the software engineering side to mean something *completely different*:\
    \ function objects. At least C++ uses this terminology, and I’ve seen it referenced\
    \ in PHP once or twice. A “function object” is just a closure object, like we\
    \ saw all the way back when talking about first class functions:\n\n```\n1 class\
    \ Add1\n2 {\n3     public function __invoke(int $a): int\n4     {\n5         return\
    \ $a + 1;\n6     }\n7 }\n```\n\nThis double meaning of the word “functor” is an\
    \ unfortunate side effect of computer scientists and software engineers rarely\
    \ talking to each other, and leads to quite a bit of confusion when Duck Duck\
    \ Go-ing.\n\nThe category theory usage is, as far as I can tell, far older. I,\
    \ therefore, conclude that the software engineers who started using it to mean\
    \ function object are responsible for the confusion, and so I reject their definition.\
    \ In this book, “functor” always has the category theory meaning of “mapping between\
    \ categories,” and I recommend using that nomenclature exclusively yourself. Just\
    \ be aware the other definition may come up at times. Now at least you can confidently\
    \ tell people that they’re wrong.\n\n# Fun With Functors\n\n## Combining Functors\n\
    \nLet’s review a number of things we’ve learned and their implications.\n\n1.\
    \  A category can be of basically anything, as long as certain rules are met.\
    \ That includes language types, but also many other things.\n\n2.  A functor is\
    \ a translation or mapping of both objects and arrows to another category. In\
    \ programming, we can view that as “lifting,” or “enhancing,” or “decorating,”\
    \ or “wrapping,” or various other verbs all meaning the same thing in this context.\n\
    \n3.  A functor to its own category is called an endofunctor.\n\n4.  It follows,\
    \ therefore, that you can have a category of endofunctors.\n\nAlso, consider:\n\
    \n1.  A monoid is a function that takes two parameters of the same type, and produces\
    \ a value of that type, and does so associatively.\n\n2.  A function’s “type”\
    \ is the type of its return value, because that’s how you can plug it into the\
    \ input of another function.\n\n3.  A functor is represented as a function when\
    \ we’re talking about programming.\n\n4.  You can have a monoid for functors of\
    \ the same type: It takes two functors that produce a given type and returns a\
    \ value of that same type.\n\n5.  “Functors of the same type” means we’re talking\
    \ about endofunctors.\n\nSo if we have two functors from `C` → `Enhanced C`, called\
    \ `F` and `G`, then we can write a monoid that combines them to produce an `Enhanced\
    \ C`: `monoid(F, G)` → `Enhanced C`.\n\nThis monoid is highly useful. So useful\
    \ in fact, that it gets is own special name: *monad*.\n\nYou may have heard the\
    \ joking phrase “A monad is just a monoid in the category of endofunctors. What’s\
    \ the problem?” Now we see what that phrase actually means, in category theory.\
    \ Translating all of those fancy-sounding words back down to terminology we’re\
    \ more used to:\n\n*   A monad is just a monoid in the category of endofunctors.\n\
    \n*   A monad is an associative binary function in the category of endofunctors."
