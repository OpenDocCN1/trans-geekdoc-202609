    \ untyped.\n\nShort lambdas do not offer any more functionality over traditional\
    \ anonymous functions. In fact, they are strictly less capable than the traditional\
    \ version. What they offer is succinctness. The short lambda syntax makes it very\
    \ easy to casually write a pure function as if it were any other literal value.\
    \ What they really enable is the ability to “think in functions” without running\
    \ into a wall of fugly syntax. That makes working in a functional way in PHP vastly\
    \ easier than it ever was before, simply from a friction standpoint.\n\nIf you’re\
