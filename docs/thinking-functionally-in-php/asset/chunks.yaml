    In practice, is it worth going strictly immutable in `PHP`? I would frankly argue
    no. Immutability at the boundary is mandatory to avoid spooky action at a distance,
    so always build and use immutable value objects and maintain strict separation
    between value objects and service objects/functions. Within a function, though,
    try to avoid mutating variables, but if the result would be too convoluted or
    slow, don’t sweat it. Focus instead on readability of the code. What makes the
    function easiest to reason about, read, and understand? Do that. If that means
    mutating an array or reusing a variable for a builder object, so be it. As long
    as the immutable boundaries are maintained, the function is still pure as viewed
    from the outside.


    If your function is long or complex enough that it is hard to keep track of a
    variable that may change over the course of a function, it means your function
    is too long and complex and should get broken up anyway.


    # Part Two


    # Category Theory


    Before we go further, we need to veer off of code for a little bit into the realm
    of category theory.


    Stop, please don’t skip this chapter! I promise to be gentle.


    Category theory is the realm of mathematics concerned with, well, categories.
    Categories are an abstraction much the way that type systems in programming are
    an abstraction, only cranked up to 11. Twice. In essence, it takes many of the
    concepts from programming and abstracts them away from programming entirely, to
    the point that they can apply to all sorts of concepts, as long as you can squeeze
    them into certain mathematical rules. At that high level of abstraction, it’s
    possible to prove general statements that, when reapplied back down to a lower
    level, allow you to reason about a problem in more robust ways.


    Provided certain conditions are met, the point of category theory is to abstract
    well beyond mere programming and derive rules at a more generic level. Then, as
    long as those conditions are met back in a specific example, those rules are still
    true, which means you can make assumptions based on them being true.


    Much of that process is valuable for proving things about programming that may
    seem intuitively true to an experienced programmer, but category theory provides
    a way to establish them firmly and reliably.


    To make life more difficult, category theory also uses a completely different
    set of terminology from programming, except for where it uses the same words but
    for a slightly different concept. For good measure, it also does the same to set
    theory. For example, “object” in category theory has very little to do with what
    programmers would think of as an “object.” Many concepts also go by multiple names,
    further complicating matters. What programmers would call a “function” gets called
    variously “arrow” or “morphism” depending on your mood.


    As if that weren’t enough, the programming language `Haskell` is frequently taken
    to be the definitive terminology on functional programming and category theory,
    even though it’s technically just one especially tailored implementation of it.
    (That’s not an exaggeration. Haskell was originally developed as a shared syntax
    for mathematicians to write logic and type proofs in, which for convenience was
    made executable. Later on, some very silly people discovered that it was possible
    to write actual programs in it and proceeded to do so.)


    Functional programming technically evolved separately from category theory, but
    in practice, a great deal of the benefit of functional programming comes from
    being able to assume those rules are in place by ensuring you meet those conditions.
    For instance, “as long as it’s a pure function you can always cache the result”
    is a case where ensuring a certain condition holds (that the function is pure)
    means you can rely on certain assumptions (it’s always cacheable). By extension,
    certain types of functions can always be thought of as lookup tables rather than
    operations. Whether that lookup table ends up being more or less efficient than
    an operation is “just” an optimization problem. For that reason, understanding
    the more advanced parts of functional programming requires at least a little category
    theory.


    Another aspect of category theory is that much of it is a matter of viewing the
    problem from the right angle. If you can take a problem and turn it sideways so
    it looks like another problem you’ve already solved, then you have solved the
    new problem, too. Much of what we’ll be doing here is taking a problem and turning
    it sideways so that it looks familiar to something we already know. (Category
    theory has rigorous mechanisms for such sideways looks, but for brevity, I’ll
    be doing that informally.)


    This is not a book on category theory. This is an informal, intuitive-based summary
    of those parts of category theory that are relevant to us as programmers working
    in a fundamentally non-functional language (`PHP`).


    ## What Is a Category?


    A “category” is a collection of:


    * Zero or more `Objects`

    * Some number of `Arrows` from one object to another object, which could be the
    same object


    If you drew them on paper, you would have a series of dots (objects) and lines
    (arrows) connecting them. Arrows often go by the alternate name `morphism`: “morph”
    being Greek for “form” and “ism” meaning “study of.” Or, to use more colloquial
    English, “morph” as in “change” and “ism” meaning “thingie”. (I find the colloquial
    version a much more descriptive way of understanding morphisms as applied to programming.)


    For a collection of dots and lines to qualify as a category, there are a few rules
    that it must follow:


    * There is an “identity morphism” for each object; that is, an arrow that points
    back to itself

    * `Morphisms` are composable; that is, they can be chained together

    * The composition of `morphisms` are associative; that is, when stringing multiple
    morphisms together, the grouping doesn’t matter

    * `Morphisms` are structure-preserving—more on that in a bit


    ![A simple two object category](resources/basic-category.png)


    A simple two object category


    Morphisms are usually written with arrows, like so: `f: A → B` means “f is the
    morphism from object A to B”. There can be infinitely many morphisms from A to
    B, depending on the category. The source object of a morphism is known as its
    `domain`. Its destination object is known as its `codomain`. That pattern of “thingie”
    and its other end “cothingie” is consistent throughout category theory.


    Composition of morphisms is usually denoted with `∘`. If there is a morphism from
    X to Y called `f` (`f: X → Y`), and a morphism from Y to Z called `g` (`g: Y →
    Z`) then we can concatenate the two together to produce a morphism called `g ∘
    f`, that maps from X to Z. (Yes, it’s read right to left. Sorry. I didn’t invent
    it.)


    ![Composing a morphism from X to Z](resources/basic-composition.png)


    Composing a morphism from X to Z


    ...


    A few sections back, we talked about composing functions, where we pass the return
    value of one function into another function to “concatenate” them together. That’s
    the exact same concatenation we’re talking about here. The `∘` symbol is the mathematical
    way of writing the `compose()` function we wrote earlier. So if we’re talking
    about PHP functions `f(X $x): Y` and `g(Y $y): Z`, it means that:


    ```

    g(f($x)) == compose(''f'', ''g'')($x) == a function that takes X and returns Z

    ```

    '
