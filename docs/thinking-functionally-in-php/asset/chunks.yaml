    \ should be filtered out and returns `$result` concatenated with the current value\
    \ if it should be included.\n\n# Concatenation\n\nIt is extremely common in procedural\
    \ code to want to write a line that looks like the following:\n\n```\n1 getPromotions(mostExpensiveItem(getShoppingList(getCurrentUser(),\
