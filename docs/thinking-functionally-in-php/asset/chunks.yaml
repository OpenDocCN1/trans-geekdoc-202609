    array of concepts that naturally flow from those. Most of those are not all-or-nothing,
    making it possible to write “functional-ish” code in almost any modern language
    even if the syntax may end up a bit clunky.


    *   A *functional language* is a language whose syntax and semantics are geared
    toward making functional-style programming easier and more natural, often (though
    not always) at the expense of other paradigms. Often those functional concepts
    are baked-in assumptions in the language, and if you are not aware of those assumptions,
    you’re likely to get bitten.


    *   A *strictly functional language* is one whose syntax and semantics are geared
    toward writing in a functional style only, period. These languages go all the
    way down the rabbit hole and make thinking about a problem any other way frequently
    impossible. They also have a reputation for being impenetrable, precisely because
    they only support functional models.


    PHP, in particular, is a language optimized for procedural OOP; it supports classic
    OOP, and that is the code style most widely used, but the single-threaded, shared-nothing
    architecture is intrinsically procedural. Since PHP 5.3, however, it has had syntactic
    support for functional-style programming. PHP 7.4’s introduction of short-lambdas
    further simplifies it far enough that functional-style code is now entirely viable.


    That said, would I advocate writing 100% purely functional code in PHP? Not really.
    Many of functional code’s advantages do not actually apply in a single-threaded,
    shared-nothing environment, and others will work but collide with other limitations
    of the language to make them less friendly to work with.


    ## Type Systems


    Type systems are a tricky topic in functional programming. On the one hand, type
    systems are entirely orthogonal and unrelated to functional programming. Some
    functional languages have extremely robust type systems (e.g., Haskell), while
    others have seemingly none at all (LISP). Yet, they’re often talked about in the
    context of functional programming. Why?


    The answer lies in the previous observation that functional languages tend to
    have either no type system or a very robust one. Rarely have I seen a mediocre
    functional type system. While functional programming itself does not in any way
    require having an explicit type system, in practice functional code encourages
    and requires a very robust type system. A weak type system often cannot handle
    the complexity that a functional code base necessitates.'
