- fmt: "\nPHP is unusual in this case in that it has a relatively weak type system\
    \ (compared to what languages like Rust or Haskell or even modern Java offer),\
    \ but it’s all opt-in. As we’ll see, the result is that taking a fully functional\
    \ approach will, in some cases, lose us some explicit typing ability. I don’t\
    \ see that as a fatal problem, but rather as an indication of what sort of type\
    \ system improvements PHP should prioritize in the future.\n\nWe’ll cover some\
    \ typing concepts along the way, as necessary, but this is not primarily a book\
    \ about typing.\n\n## What to Expect\n\nThis book is divided into four parts:\n\
    \n*   In Part One, we will examine the fundamental principles of functional programming\
    \ as a concept, using PHP as the example language. The results will not always\
    \ be syntactically pretty, but that’s not the goal; understanding the value of\
    \ the principles is, and we’ll use concrete PHP examples to go a little way down\
    \ the rabbit hole.\n*   In Part Two, we’ll step back and look at the theory that\
    \ underpins much functional programming, specifically category theory. This is\
    \ not a book on category theory, but a cursory understanding of the basics will\
    \ greatly help to explain how functional programming and other formalisms really\
    \ do make for more robust code.\n*   In Part Three, we’ll bring the theory and\
    \ practice together to demonstrate some more advanced techniques that make the\
    \ theory concrete and make for more robust code at the same time.\n*   In part\
    \ Four, we’ll step back and consider the broader picture of what else functional\
    \ programming could be, and where it should sit in your toolbox.\n\n# Part One\n\
    \n## Pure Functions\n\nThe first and most crucial aspect of functional programming\
    \ is the idea of a “pure function.” What makes a function pure? The fact that\
    \ it’s an actual function and not something else.\n\nIf that seems circular, let’s\
    \ back up a moment. One of the key challenges in discussing functional programming\
    \ is software engineering and computer science are, in fact, two separate fields\
    \ that have evolved in parallel with each other. They interact frequently, but\
    \ not consistently. As a result, a great many concepts have a different name in\
    \ software engineering than they do in computer science, and many others have\
    \ the same word in both disciplines that mean different things. In order to establish\
    \ a common vocabulary, therefore, let’s start at the very beginning.\n\nIn nearly\
    \ all programming languages, there is an idea of a block of code that is reusable\
    \ over and over again in multiple places, often with slight variation. The term\
    \ for such a block is a `procedure`, or `sub-routine`. A procedure is any syntactically\
    \ reusable block of code that can be referenced and, optionally, passed some parameters\
    \ or arguments.\n\nIn mathematics, a `function` is a black box that is given inputs\
    \ and reliably returns an output. How it does so is irrelevant; it could do some\
    \ computation, or it could simply have a giant internal lookup table. However,\
    \ the key term there is “reliably”; the same inputs will always produce the same\
    \ outputs, guaranteed, and nothing else will change about the state of the universe\
    \ except that a value is returned. Two inputs may result in the same output, but\
    \ the same input can never, ever produce different output.\n\nA function in mathematics\
    \ is not a thing that happens but a `relationship` that defines the map from some\
    \ input to some output.\n\nIn almost every mainstream modern language, the concept\
    \ of a procedure and a function are folded together into a single concept termed\
    \ “function.” In PHP-speak, both of the following are “functions”:\n\n```\n 1\
    \ function output(string $message): void\n 2 {\n 3     static $n = 1;\n 4    \
    \ global $preamble;\n 5     echo \"The {$n}th message is: {$preamble} {$message}\"\
    . PHP_EOL;\n 6     $n++;\n 7 }\n 8 \n 9 function add(int $a, int $b): int\n10\
    \ {\n11     return $a + $b;\n12 }\n```\n\nBoth are procedures; however, only the\
    \ second is a “function” as mathematicians would define it. The `output()` function\
    \ takes a stealth input (a global variable), it produces a stealth output (it\
    \ prints a message), and it has a different effect if called a second time with\
    \ the same input (because it retains internal state via a static variable). All\
    \ of those attributes violate what we expect of a “function” in the mathematical\
    \ sense.\n\nOf course, modern languages confuse things by using the term “function”\
    \ willy nilly. Therefore, what mathematics calls a “function” programming instead\
    \ calls a “pure function.”\n\n### Define “Pure”\n\nWhat makes a function pure?\
    \ A procedure is a pure function if it follows two restrictions:\n\n1.  It is\
    \ `idempotent`. That is, the same explicit inputs are guaranteed to always produce\
    \ the same outputs.\n2.  It has no side-effects. That is, there is no effect on\
    \ any value or data stream other than the return value being returned.\n\nThese\
    \ rules are very simple and usually easy to achieve, but very powerful. By restricting\
    \ ourselves in this way, we buy a number of assumptions.\n\n1.  A pure function\
    \ is incredibly easy to unit test. There is essentially no set up and no mocking\
    \ necessary; just call it with known parameters and see if the result is what\
    \ you expect.\n2.  It has `referential transparency`. That is the fancy way of\
    \ saying a function is equivalent to its return value. As long as `add()` is pure,\
    \ then replacing all instances of `add(5, 5)` with `10` is guaranteed to not change\
    \ the result of the program.\n3.  Because we know that the same inputs produce\
    \ the same output and because it’s referentially transparent, it is trivially\
    \ easy to cache. Caching is, in essence, replacing subsequent function calls with\
    \ a previously computed value.\n4.  Conversely, while calling a pure function\
    \ multiple times with the same input may be wasteful, it cannot be a source of\
    \ bugs. That’s assuming you meant to call it with the same value, not the function.\n\
    \nAs we’ll see in the next chapter, those assumptions allow us to do a great deal\
    \ more once we are dealing higher-order functions. Stay tuned!\n\n## Composing\
    \ Functions\n\nAnother important attribute is that composing pure functions always\
    \ produces a pure function, but calling an impure function from a pure function\
    \ makes the pure function impure. That is:\n\n```\n 1 function add(int $a, int\
    \ $b): int\n 2 {\n 3     return $a + $b;\n 4 }\n 5 \n 6 function subtract(int\
    \ $a, int $b): int\n 7 {\n 8     return $a - $b;\n 9 }\n10 \n11 function compute(int\
    \ $a, int $b, int $c): int\n12 {\n13     return subtract(add($a, $b), $c);\n14\
    \ }\n15 \n16 function output(string $message): void\n17 {\n18     echo \"The message\
    \ is: {$message}\". PHP_EOL;\n19 }\n20 \n21 function run()\n22 {\n23     $val\
    \ = compute(30, 10, 8);\n24     output(\"The result is: $val\");\n25 }\n```\n\n\
    `add()` and `subtract()` are pure functions, because they obey the two rules of\
    \ pure functions. This means `compute()` is also a pure function, because it obeys\
    \ the same rules and only calls other pure functions. However, `output()` is not\
    \ a pure function because it has a side effect of producing output. `run()` calls\
    \ both a pure and an impure function, and is thus impure. We cannot make any such\
    \ assumptions about it.\n\nFunctional programming is built on pure functions.\
    \ In strictly functional languages, writing a not-pure function is hard and requires\
    \ extra syntax to remind you that you’re doing something dirty. PHP is not a strictly\
    \ functional language, so it’s on us as developers to self-check and ensure our\
    \ functions are pure whenever possible.\n\nIn practice, ensuring you have pure\
    \ functions is straightforward:\n\n1.  Avoid global values. Always. Period.\n\
    2.  Avoid static values in functions. Pretend they do not exist.\n"
