    \n## Guide\n\n1. [Begin Reading](#chap00.xhtml)\n\n# Preface\n\nFunctional programming\
    \ has been an interest of mine for years. That’s not to say I’ve been an expert\
    \ in it, or that I’ve done much work in strictly functional languages, just that\
    \ I’ve been interested in the topic.\n\nSadly, I’ve long found the available documentation\
    \ and tutorials on the web to be lack-luster. Most of them either cover the very\
    \ basics and then stop, or assume you’re already an expert in Haskell and so explain\
    \ advanced topics in the most convoluted and Haskell-centric way possible. Neither\
    \ of these did I find useful.\n\nI have also found that the Curse of Monads seems\
    \ to be true, as nearly every explanation I found about that mythical concept\
    \ was obtuse, assumed you had three years of advanced mathematical training, or\
    \ so dumbed-down as to be actively harmful to understanding.\n\n> “Once you understand\
    \ monads, you immediately become incapable of explaining them to anyone else.”\n\
    \n> –Gilad Bracha\n\nCombined with PHP’s overall clunky syntax for doing functional-esque\
    \ code, I generally didn’t go further than “pure functions are your friend,” either\
    \ in my own code or what I explained to others.\n\nThat is, until PHP 7.4.\n\n\
    PHP 7.4 changed everything for me. The introduction of arrow functions made writing\
    \ functional-style code in PHP much more concise and intuitive. It was the spark\
    \ I needed to finally dive into the world of functional programming, and this\
    \ book is the result of that journey.\n\nThe goal of this book is to show you\
    \ how functional programming principles can make your PHP code better, more maintainable,\
    \ and more robust. We will explore the core concepts, from pure functions and\
    \ immutability to more advanced topics like monads and functors, but you don't\
    \ need to be a mathematician or a wizard to benefit from this book. You just need\
    \ to be willing to learn something new.\n\n# Introduction\n\nIn recent years,\
    \ functional programming has become increasingly popular as a concept. Even in\
    \ “non-functional” programming languages, the concepts and practices of functional\
    \ programming have become more mainstream.\n\nWhy is that? Are they actually useful,\
    \ or is functional programming in a language other than Haskell just trying to\
    \ fit a square peg into a round hole? What even is functional programming, and\
    \ does it make sense in PHP?\n\nThis book aims to answer those questions. (Spoiler\
    \ alert: The answer is yes.) While writing PHP as if it were Haskell, ML, or LISP\
    \ is not going to produce a good result, the underlying principles behind functional\
    \ programming offer many advantages, even in PHP.\n\n## Functional vs. Procedural\n"
