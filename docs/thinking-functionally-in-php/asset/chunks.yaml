    \ means `ValidationError` can just be an interface, with any number of implementing\
    \ error classes. `Success` is just a boring wrapper around a value.\n\n```php\n\
    interface Result {}\n\nclass Success implements Result\n{\n    protected $value;\n\
    \n    public function __construct($value)\n    {\n        $this->value = $value;\n\
    \    }\n\n    public function value()\n    {\n        return $this->value;\n \
    \   }\n\n    public static function of($value): self\n    {\n        return new\
    \ static($value);\n    }\n}\n\ninterface ValidationError extends Result {}\n\n\
    class StringTooShort implements ValidationError {}\nclass UsernameExists implements\
    \ ValidationError {}\nclass InvalidCharacters implements ValidationError {}\n\
    class DoesNotStartWithLetter implements ValidationError {}\n```\n\nNext, we still\
    \ need to `bind` our validator functions so they can handle a `Result` object.\
