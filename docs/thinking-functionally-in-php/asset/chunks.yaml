  trans: "\n正如上一个示例所示，PHP 在函数式编程方面的另一个弱点仅仅是无法引用函数。因为 PHP 中的函数并不是真正的一等值（first-class\
    \ values），它们无法像变量那样容易地引用。它们需要用引号括起来，如果函数位于命名空间中，表示其名称的字符串必须包含完整的命名空间。这可能会导致糟糕的混乱：\n\
    \n```\n1 array_map('\\foo\\bar\\baz\\compute_stuff', $list);\n2 \n3 // 或者有时\n\
    4 \n5 array_map(__NAMESPACE__ . '\\compute_stuff', $list);\n```\n\n在 PHP 中，未加引号的裸字符串在传统上会被评估为字符串并产生一个通知（notice）；在\
    \ PHP `7.2` 中，这变成了一个警告（warning），但它们尚未被完全移除。这使得我们无法在不加引号的情况下直接引用函数。当然，在引号内部的函数对于重构工具来说是完全隐藏的。\n\
    \n目前讨论过的一种可能性是允许函数名具有类似于类常量的后缀以引用其名称。即，如下所示的内容：\n\n```\n1 use foo\\bar\\baz\\\
    compute_stuff;\n2 \n3 array_map(compute_stuff::name, $list);\n```\n\n与大多数函数式语言提供的功能相比，这并不理想，但与现状相比是一个巨大的改进。尽管，无论采用何种方法，某种在不实际调用函数的情况下将其作为一等值引用的更好方法，将极大地提高\
    \ PHP 作为函数式语言的潜力。\n\n# 泛型 (Generics)\n\n近年来，PHP 在类型系统方面取得了巨大进步。虽然仍然完全是可选的（opt-in），但该语言一直在不断增强显式表示传递值类型的能力。然而，本书中的许多代码示例几乎完全忽略了类型。这是为什么呢？\n\
    \n根本原因是，尽管 PHP 有许多改进，但与许多其他语言相比，其类型系统仍然相对薄弱。特别是它缺乏泛型（generics），也称为“参数化类型”（parametric\
    \ types）。有了泛型，人们可以根据另一种类型来定义类型，例如“一个包含 `string` 的 `Optional`”或“一个包含 `User` 对象的\
    \ `Optional`”。“包含”部分被推迟到调用时。在一个 PHP 使用与 C++ 和 Java 相同语法风格的泛型的假设世界中，`Optional`\
    \ 类可能看起来像下面（省略版）：\n\n```\n 1 class Optional<T>\n 2 {\n 3     private T $value;\n\
    \ 4 \n5     public static function of(T $value = null)\n 6     {\n 7         $this->value\
    \ = $value;\n 8     }\n 9 \n10     public function value(): T\n 11     {\n 12\
    \         return $this->valid() \n 13             ? $this->value \n 14       \
    \      : throw new \\RuntimeException(\"The cat is dead, Schrodinger\");\n 15\
    \     }\n 16 }\n17 \n18 function getShoppingList(User $u, string $list = 'main'):\
    \ Optional<ShoppingList>\n19 {\n20     isset($u->lists[$list])\n21         ? Some<ShoppingList>::of($u->lists[$list])\n\
    22         : None::none();\n23 }\n```\n\n本质上，通过“包含”语法编写 `Optional`，我们可以表达类型安全的值。`Optional`\
    \ 类是对可能存在也可能不存在值的封装。`of` 方法创建一个新实例，而 `value()` 方法返回该值。如果值不存在，它会抛出一个 `RuntimeException`。\n\
    \n`getShoppingList` 函数返回一个 `Optional<ShoppingList>`。如果用户存在该列表，它返回一个 `Some<ShoppingList>`，否则返回\
    \ `None::none()`。\n"
- fmt: "\nThe `Optional` or `Maybe` monad is far and away the most common, in part\
    \ because it’s so simple, and in part because dangling nulls is one of the great\
    \ evils of programming languages; the “Billion Dollar Mistake” as the inventor\
    \ of the null pointer, Tony Hoare, once called it. Many newer languages, therefore,\
    \ have built-in ways to make a variable optional, meaning it gets wrapped into\
    \ a `Maybe` monad automatically by the language.\n\nWe saw earlier that `Rust`\
    \ uses an enumerated `Result` type that can be `Some` (which wraps a value) or\
    \ `None` (which is nothing), which forces you to consider the null case without\
    \ having an actual null. Other languages go a step further and encapsulate the\
    \ optional concept into the syntax itself.\n\nFor example, in `Swift`, a variable\
    \ must have a value unless it’s declared optional:\n\n```\n1 var name:String?\n\
    ```\n\nThe `?` means that the variable may be null, which means it cannot be accessed\
    \ without “unwrapping” it, using a `!`.\n\n```\n1 if name != null {\n2     print(\"\
    Hello, \\(name!)\")\n3 } else {\n4     print(\"Wait, who are you again?\")\n5\
    \ }\n```\n\nThe `?` is effectively a syntactic Maybe Monad “unit” operation, and\
    \ `!` is a syntactic `getValue()` or `unwrap()`. The end result is the same: Forcing\
    \ a developer to handle the case when a value may be missing rather than letting\
    \ them forget, as we are so prone to do.\n\nSuch a change would likely be impractical\
    \ in `PHP` today; nullable variables have no built-in guards, and adding them\
    \ would be a huge breaking change. A `Rust`-style approach with an explicit wrapper\
    \ would be more feasible.\n\n## Optional Chaining\n\nAnother feature that integrated\
    \ optionals allows for is optional chaining. That is, dereferencing a variable\
    \ that may be null without actually dereferencing it if it is null. Which… is\
    \ exactly the same behavior as the Maybe monad’s `bind` operation.\n\nConsider\
    \ this `Swift` example:\n\n```\n1 class Employee {\n2     var name: String\n3\
    \     var title: String\n4     var manager: Employee?\n5 }\n```\n\nIn this class,\
    \ `name` and `title` are both required, but `manager` is optional. You can access\
    \ the manager’s name like so:\n\n```\n1 let e = Employee();\n2 // ...\n3 var boss\
    \ = e.manager?.name;\n```\n\nIf `e.manager` is defined, that object’s `name` property\
    \ is returned. If it’s null, then the entire rest of the chain is skipped, and\
    \ `boss` is set to null (and thus has type `String?`, so it must be unwrapped\
    \ to be used). Any number of values in a chain may be optionaled.\n\nThere’s no\
    \ conceptual reason why `PHP` couldn’t support such a syntax, and it’s been proposed\
    \ in the past:\n\n```\n1 $boss = $e->getManager()?->name;\n```\n\nThat would,\
    \ in practice, be syntactic sugar for the same `is_null` pyramid of doom that\
    \ the Maybe monad encapsulates.\n\nThat said, I am not convinced this is a good\
    \ approach. While it has its uses, a null return frequently means an error, not\
    \ a single “normal” case like “user not found.” In that case, some way to bake\
    \ in a syntactic version of `Either` rather than `Maybe` would be more flexible\
    \ and allow for multiple error types to be returned. What that would look like\
    \ in practice I’m not sure, but it would essentially be a functional, return-based\
    \ version of exceptions (albeit only one level deep).\n\n## A Native Bind Operator\n\
    \nHighly functional languages like `Haskell` or `F#` often have a native operator\
    \ for monad binding. Since monads are really just “fancy concatenation,” from\
    \ a programmer’s point of view, they have a concatenation-like operator. For instance,\
    \ in `Haskell` one can write:\n\n```\n1 promos = getCurrentUser\n2     >>= getShoppingList\n\
    3     >>= mostExpensiveItem onSale\n4     >>= getPromotions \"Lincoln's Birthday\"\
    \n```\n\nwhere `>>=` is the `Haskell` operator for “bind,” assuming a type-appropriate\
    \ bind function has already been defined. The caveat is that the language needs\
    \ some way to tell which bind operation to use, which is, in turn, derived from\
    \ the type of each function. That is easy to do in `Haskell` with its extremely\
    \ robust type system and a separate compile-time step. In `PHP`, with its relatively\
    \ weak type system and the need for fast opcode-generation times, that becomes\
    \ substantially harder. It would likely require function pattern-matching logic\
    \ to be built into the engine, something `PHP` has long avoided for various reasons\
    \ (mostly relating to it being a bad idea in combination with a weak type system).\
    \ It would probably not be impossible to implement, but it’s likely very hard.\n\
    \n## Enumerated Types\n\nWhile it is possible to create an enumerated structure\
    \ in use space in `PHP`, it still would have no type system support. Enumerated\
    \ types, which are the manifestation of coproduct types but in code, would allow\
    \ for the creation of a closed list of legal values for a type. That, in turn,\
    \ makes some monadic patterns (such as `Either`) easier to represent, especially\
    \ if combined with generics.\n\nFor example, in `Haskell` an enumerated type is\
    \ as simple as:\n\n```\n1 datatype cardsuit = Clubs | Diamonds | Hearts | Spades\n\
    ```\n\nAnd now, a variable of type `cardsuit` may only be one of those four values.\
    \ When combined with generics, the Maybe monad can be expressed in `Haskell` as\
    \ simply:\n\n```\n1 data Maybe a = Nothing | Just a\n```\n\nThat’s way less work\
    \ than the classes we had to build in `PHP`!\n\nIn `C` or `C++`, enumerated types\
    \ have no intrinsic value. For instance, this `C` code:\n\n```\n1 enum cardsuit\
    \ {\n2     Clubs,\n3     Diamonds,\n4     Hearts,\n5     Spades\n6 };\n```\n\n\
    And printing out “Hearts” would yield the integer 2. In other languages, such\
    \ as `Haskell` and `Java`, is simply shorthand for:\n\n```\n1 enum cardsuit {\n\
    \     Clubs    = 0,\n     Diamonds = 1,\n     Hearts   = 2,\n     Spades   = 3\n\
    6 };\n```\n\nA fancier version of enumerations, called tagged unions, allows a\
    \ type to be one of a specific set of other types, which themselves could be compound\
    \ types. For instance, in `Rust`:\n\n```\n1 enum Message {\n2     Quit,\n3   \
    \  Move { x: i32, y: i32 }, // anonymous struct\n4     Write(String),\n5     ChangeColor(i32,\
    \ i32, i32),\n6 }\n```\n\nThe type `Message` is now defined as “an instance of\
    \ `Quit`, OR an instance of `Move` which has two properties, OR an instance of\
    \ `Write` which has one property, OR an instance of `ChangeColor` which has three\
    \ properties.” It is similar to a marker interface, in a sense, except that the\
    \ list of legal values can be closed rather than infinite.\n\nThe main question\
    \ for enumerations in `PHP` is which model to adopt; there is no technical reason\
    \ they couldn’t be done at this point.\n\n# When to Go Functional\n\nThroughout\
    \ this book, we have sought to demonstrate how a functional approach to code works:\
    \ What the principles of functional programming are, what their implications can\
    \ be, and the approaches they enable. That led, in turn, to an exploration of\
    \ the mathematics behind functional programming, and some practical examples of\
    \ taking a functional, monad-based approach to problem solving.\n\nThat’s great\
    \ for understanding what all the fuss is about in natively functional languages.\
    \ But `PHP` lacks some of the finishing touches that make such approaches really\
    \ and truly powerful. It also lacks the lazy evaluation of a language like `Haskell`,\
    \ which means that, in practice, no useful `PHP` program can be purely functional\
    \ because then it couldn’t do input or output, which would make it kind of silly.\n\
    \nOf course, the same is true of virtually every language that claims to be functional.\
    \ If it can’t have impurity (reading from input, writing to output), then it’s\
    \ not a useful language. Different functional languages or strictly functional\
    \ languages address that challenge in different ways. Being a not-functional language\
    \ (no pun intended), `PHP`’s approach to that problem, at a language level, is\
    \ to simply not care.\n"
  raw: 'The Optional or Maybe monad is far and away the most common, in part because
    it’s so simple, and in part because dangling nulls is one of the great evils of
    programming languages; the “Billion Dollar Mistake” as the inventor of the null
    pointer, Tony Hoare, once called it. Many newer languages, therefore, have built-in
    ways to make a variable optional, meaning it gets wrapped into a Maybe monad automatically
    by the language.


    We saw earlier that Rust uses an enumerated `Result` type that can be `Some` (which
    wraps a value) or `None` (which is nothing), which forces you to consider the
    null case without having an actual null. Other languages go a step further and
    encapsulate the optional concept into the syntax itself.


    For example, in Swift, a variable must have a value unless it’s declared optional:


    ```

    1 var name:String?

    ```


    The `?` means that the variable may be null, which means it cannot be accessed
    without “unwrapping” it, using a `!`.


    ```

    1 if name != null {

    2     print("Hello, \(name!)")

    3 } else {

    4     print("Wait, who are you again?")

    5 }

    ```


    The `?` is effectively a syntactic Maybe Monad “unit” operation, and `!` is a
    syntactic `getValue()` or `unwrap()`. The end result is the same: Forcing a developer
    to handle the case when a value may be missing rather than letting them forget,
    as we are so prone to do.


    Such a change would likely be impractical in PHP today; nullable variables have
    no built-in guards, and adding them would be a huge breaking change. A Rust-style
    approach with an explicit wrapper would be more feasible.


    ## Optional Chaining


    Another feature that integrated optionals allows for is optional chaining. That
    is, dereferencing a variable that may be null without actually dereferencing it
    if it is null. Which… is exactly the same behavior as the Maybe monad’s `bind`
    operation.


    Consider this Swift example:


    ```

    1 class Employee {

    2     var name: String

    3     var title: String

    4     var manager: Employee?

    5 }

    ```


    In this class, `name` and `title` are both required, but `manager` is optional.
    You can access the manager’s name like so:


    ```

    1 let e = Employee();

    2 // ...

    3 var boss = e.manager?.name;

    ```


    If `e.manager` is defined, that object’s `name` property is returned. If it’s
    null, then the entire rest of the chain is skipped, and `boss` is set to null
    (and thus has type `String?`, so it must be unwrapped to be used). Any number
    of values in a chain may be optionaled.


    There’s no conceptual reason why PHP couldn’t support such a syntax, and it’s
    been proposed in the past:


    ```

    1 $boss = $e->getManager()?->name;

    ```


    That would, in practice, be syntactic sugar for the same `is_null` pyramid of
    doom that the Maybe monad encapsulates.


    That said, I am not convinced this is a good approach. While it has its uses,
    a null return frequently means an error, not a single “normal” case like “user
    not found.” In that case, some way to bake in a syntactic version of `Either`
    rather than `Maybe` would be more flexible and allow for multiple error types
    to be returned. What that would look like in practice I’m not sure, but it would
    essentially be a functional, return-based version of exceptions (albeit only one
    level deep).


    ## A Native Bind Operator


    Highly functional languages like Haskell or F# often have a native operator for
    monad binding. Since monads are really just “fancy concatenation,” from a programmer’s
    point of view, they have a concatenation-like operator. For instance, in Haskell
    one can write:


    ```

    1 promos = getCurrentUser

    2     >>= getShoppingList

    3     >>= mostExpensiveItem onSale

    4     >>= getPromotions "Lincoln''s Birthday"

    ```


    where `>>=` is the Haskell operator for “bind,” assuming a type-appropriate bind
    function has already been defined. The caveat is that the language needs some
    way to tell which bind operation to use, which is, in turn, derived from the type
    of each function. That is easy to do in Haskell with its extremely robust type
    system and a separate compile-time step. In PHP, with its relatively weak type
    system and the need for fast opcode-generation times, that becomes substantially
    harder. It would likely require function pattern-matching logic to be built into
    the engine, something PHP has long avoided for various reasons (mostly relating
    to it being a bad idea in combination with a weak type system). It would probably
    not be impossible to implement, but it’s likely very hard.


    ## Enumerated Types


    While it is possible to create an enumerated structure in use space in PHP, it
    still would have no type system support. *Enumerated types*, which are the manifestation
    of coproduct types but in code, would allow for the creation of a closed list
    of legal values for a type. That, in turn, makes some monadic patterns (such as
    Either) easier to represent, especially if combined with generics.


    For example, in Haskell an enumerated type is as simple as:


    ```

    1 datatype cardsuit = Clubs | Diamonds | Hearts | Spades

    ```


    And now, a variable of type `cardsuit` may only be one of those four values. When
    combined with generics, the Maybe monad can be expressed in Haskell as simply:


    ```

    1 data Maybe a = Nothing | Just a

    ```


    That’s way less work than the classes we had to build in PHP!


    In C or C++, enumerated types are a shorthand over primitive types like integers.
    For instance, this C code:


    ```

    1 enum cardsuit {

    2     Clubs,

    3     Diamonds,

    4     Hearts,

    5     Spades

    6 };

    ```


    is simply shorthand for:


    ```

    1 enum cardsuit {

    2     Clubs    = 0,

    3     Diamonds = 1,

    4     Hearts   = 2,

    5     Spades   = 3

    6 };

    ```


    And printing out “Hearts” would yield the integer value 2. In other languages,
    such as Haskell and Java, enumerated types have no intrinsic primitive value.
    There are pros and cons to both approaches.


    A fancier version of enumerations, called *tagged unions*, allows a type to be
    one of a specific set of other types, which themselves could be compound types.
    For instance, in Rust:


    ```

    1 enum Message {

    2     Quit,

    3     Move { x: i32, y: i32 }, // anonymous struct

    4     Write(String),

    5     ChangeColor(i32, i32, i32),

    6 }

    ```


    The type `Message` is now defined as “an instance of `Quit`, OR an instance of
    `Move` which has two properties, OR an instance of `Write` which has one property,
    OR an instance of `ChangeColor` which has three properties.” It is similar to
    a marker interface, in a sense, except that the list of legal values can be made
    closed rather than infinite.


    The main question for enumerations in PHP is which model to adopt; there is no
    technical reason they couldn’t be done at this point.


    # When to Go Functional


    Throughout this book, we have sought to demonstrate how a functional approach
    to code works: What the principles of functional programming are, what their implications
    can be, and the approaches they enable. That led, in turn, to an exploration of
    the mathematics behind functional programming, and some practical examples of
    taking a functional, monad-based approach to problem solving.


    That’s great for understanding what all the fuss is about in natively functional
    languages. But PHP lacks some of the finishing touches that make such approaches
    really and truly powerful. It also lacks the lazy evaluation of a language like
    Haskell, which means that, in practice, no useful PHP program can be purely functional
    because then it couldn’t do input or output, which would make it kind of silly.
    A purely functional PHP program is, in fact, impossible.


    Of course, the same is true of virtually every language that claims to be functional.
    If it can’t have impurity (reading from input, writing to output), then it’s not
    a useful language. Different functional languages or strictly functional languages
    address that challenge in different ways. Being a not-functional language (no
    pun intended), PHP’s approach to that problem, at a language level, is to simply
    not care.'
