  trans: "\n\n如果你的对象设计导致你必须担心长依赖链被序列化、或者没有被正确初始化，或者克隆可能会克隆数据库连接，这意味着你的对象设计从一开始就是糟糕的。将这种忧虑作为驱动力，以更函数式的方式重构你的系统，使用清晰分离的服务对象和不可变值对象，直到这种忧虑消失为止。\n\
    \n顺便提一下，这种服务对象/值对象的区分与“活动记录（Active Record）”模式的设计直接背道而驰。在该模式中，从数据库中提取的对象拥有对其数据源服务的引用，以便它可以把自己放回数据库。活动记录模式本质上是非函数式的。\n\
    \n## 实体对象 (Entity Objects)\n\n值对象的一个特例是实体对象。实体对象是在某些其他系统中具有唯一标识符的值对象；该系统可能是一个持久化数据库、远程服务，或其他任何“由于值变了，所以它必须是不同的东西”这一说法不再成立的地方。如果你想更改\
    \ `Product` 的价格，你的 `Product` 对象将拥有某个 ID，以便你将带有更新价格的对象保存回数据库。这不可能是不可变的，对吧？\n\n\
    解决这个问题有几种方法。我会简要介绍每一种。\n\n### 忽略它 (Ignore It)\n\n忽略它并打破实体的规则。这就是“活动记录”模式所做的，因为记录对象（实体）直接连接回其服务，以便它们可以发生变异并重新保存。虽然这看起来很有吸引力，但不要这样做。这意味着你的活动\
    \ `Product` 对象所接触的任何内容都不再具有函数式的可靠性了：\n\n* 传递给函数的不再是“同一个值”了，因为谁知道数据库处于什么状态，或者对象是否已经被修改过。\n\
    *   你容易受到“远程幽灵操作（spooky action at a distance）”的影响，即使你的其他函数是纯函数。\n*   你无法在不考虑副作用的情况下操作对象，因为它的设计初衷就是为了产生副作用。\n\
    *   如果你复制了该对象，你所做的任何更改的行为将是未定义的。\n\n这是一个糟糕的策略。即使在用 OOP 建模的代码中，活动记录也存在大量问题。如果你试图利用函数式思维，活动记录和类似的方法应该被视为反模式。\n\
    \n### 变异指令 (Mutation Instructions)\n\n第二个选择是将读取和写入拆分为不同的流水线，并让读取部分成为一个干净的值对象。如果这听起来很像\
    \ CQRS（命令查询职责分离），那是因为它确实如此。在正常情况下，在 PHP 使用的大多数系统中，读取操作远多于写入操作，因此拥有一个缺少变异器或演进方法的只读实体版本，意味着大多数代码处理的不可变对象。\n\
    \n对于需要更新实体的路径，请用专用的变更集（changeset）命令。它看起来可能像读取实体，但它应该是一个独立的、理想情况下是不兼容的接口。这样，期望读取实体的代码就不会意外接收到可变对象，而代码中显式属于变异路径的少数部分知道这一点，你作为开发者也知道对这些部分要格外小心。\n\
    \n例如，如果有一个代表在线商店中产品的 `Product` 对象，它是只读的。有一个同对的 `ProductUpdate` 对象，具有相同的 getter（get），但也有\
    \ setter（set）。更新产品看起来可能像这样：\n\n```php\n 1 class ProductUpdate\n 2 {\n 3     private\
    \ Product $product;\n 4 \n 5     private array $changes = [];\n 6 \n 7     public\
    \ function product(): Product\n 8     {\n 9         return $this->product;\n10\
    \     }\n11 \n12     public function setDescription(string $desc): self\n 13 \
    \    {\n 14         $this->changes['description'] = $desc;\n 15         return\
    \ $this;\n 16     }\n 17 \n 18     public function getChanges(): array\n 19  \
    \   {\n 20         return $this->changes;\n 21     }\n 22 }\n 23 \n 24 $prodUpdate\
    \ = $repository->getProductForUpdate($id);\n 25 $prodUpdate->setDescription('A\
    \ book about functional programming.');\n 26 $repository```\n\n结果不是纯函数式的，但它是 95%\
    \ 函数式的，这在 PHP 中已经是一项相当令人惊讶的成就。\n\n### 事件溯源 (Event Sourcing)\n\n将该方法更进一步，你可以完全采用事件溯源。关于事件溯源的书有很多，所以我不会介绍过多细节，但核心思想是：保存的不是实体对象，而是可能影响数据状态的“事件”。任何“读取模型”仅仅是该事件流的去规范化，可以任何时间重新构建。使用之前的产品描述示例：\n\
    \n```php\n 1 class ProductDescriptionUpdate\n 2 {\n 3     private string $description;\n\
    \ 4 \n 5     public function __construct(string $description)\n 6     {\n 7  \
    \       $this->description = $description;\n 8     }\n 9 \n10     public function\
    \ getNewDescription(): string\n11     {\n12         return $this->description;\n\
    13     }\n14 }\n 15 \n16 $stream->addEvent(\n17     new ProductDescriptionUpdate('A\
    \ book about functional programming.')\n18 );\n```\n\n`ProductDescriptionUpdate`\
    \ 可以是一个不可变的值对象，并带有演进方法，因为它不是实际的 `Product`。在其他地方，加载例程会将各种更改重新组合在一起，以产生特定时间点的 `Product`\
    \ 只读版本，这可以与从另一个时间点构建的 `Product` 独立存在。\n\n事件溯源是一个复杂的话题，所以我不会深入探讨如何实现它，但可以说它与“大部分函数式”的思维非常契合。\n\
    \n### 函数式状态管理 (Functional State Management)\n\n函数式编程有处理状态的特定惯用法，我们将在后面的章节中介绍。在第二部分之前我们需要涵盖一些其他概念。目前，我只能说它们涉及到那个可怕词，它其实并不可怕；我们只是把它说得让孩子们晚上睡不着。\n\
    \n## 函数内不可变性 (Intra-Function Immutability)\n\n到目前为止，我们主要关注函数或对象边界的不可变性，但函数内部的变量也有不可变性。在严格的函数式语言中，这和函数调用之间的原因是一样的。严格不可变变量还鼓励你编写更小的函数，利用递归来处理更大的数据结构，如列表或树。例如，我们上面的\
    \ `nextSunday()` 例程仍然包含一个可变变量：`$date` 仍然在改变，即使这在函数外部没有影响。该函数的严格函数式版本更像这样：\n\n\
    ```php\n1 function nextSunday(\\DateTimeImmutable $date): DateTimeImmutable\n\
    2 {\n3     $oneDay = \\DateInterval::createFromDateString('1 day')\n4     return\
    \ $date->format('l') == 'Sunday'\n5         ? $date\n6         : nextSunday($date->add($oneDay));\n\
    7 }\n```\n\n如果日期已经是星期日，直接返回它。否则，递归调用带有明天的 `nextSunday()` 并返回其结果。在这种情况下，它会构建一个\
    \ `nextSunday()` 调用堆栈，最后一次调用返回一个日期对象，作为最后一步一直返回整个堆栈。这就是“尾递归（tail recursion）”的例子，正如上一章所讨论，更健壮的语言能够检测这种递归并透明地将其转换为非递归版本，从而运行得更快。遗憾的是，PHP\
    \ 并不是这样的语言。\n\n"
