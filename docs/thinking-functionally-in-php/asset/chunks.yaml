  trans: "\n这是一个相当简单的技术，但非常有效。或者准确地说，大部分时候是有效的。它确实能提高性能，但也让测试变得变得困难得多，因为后续命中该函数的测试将获得缓存版本，而不是原始版本。这包括对\
    \ `expensiveThing()` 本身的测试。\n\n如果 `expensiveThing()` 的主体是一个纯函数，那么它可能不会产生任何副作用……但被包装在那里的最常见行为是某种\
    \ `IO` 调用（到数据库、文件系统或网络服务），所以这种方法就不行通了。此外，这意味着 `expensiveThing()` 本身并不是一个纯函数，因为它维护了内部状态。\n\
    \n我们真正想要做的是是将逻辑本身与缓存分离。改进的第一步尝试可能像这样：\n\n```php\n 1 function expensiveThing($key)\n\
    \ 2 {\n 3     static $cache = [];\n 4 \n 5     if (!isset($cache[$key])) {\n 6\
    \         $cache[$key] = expensiveThingBody($key);\n 7     }\n 8 \n 9     return\
    \ $cache[$key];\n10 }\n11 \n12 function expensiveThingBody($key)\n13 {\n14   \
    \  $value = // some expensive thing;\n15     return $value;\n16 }\n```\n\n现在我们能够在相对孤立的情况下测试\
    \ `expensiveThingBody()`，而无需担心缓存，但我们有两个函数需要跟踪，而且所有调用 `expensiveThing()` 的函数仍然在进行缓存。这可能是一个问题，也可能不是。\n\
    \n然而，如果我们能用通用的方法解决这个问题呢？我们知道根据定义，任何纯函数都是幂等的（idempotent），这意味着任何纯函数都应该以这种方式是可以缓存的。这并不总是有用，但它总是可能的。\n\
    \n只要我们接受一个函数是一个值而不是一个静态字符串，一个通用的解决方案就非常直接。\n\n```php\n 1 function memoize(callable\
    \ $fn): callable\n 2 {\n 3     return function(...$args) use ($fn) {\n 4     \
    \    static $cache = [];\n 5         $key = serialize($args);\n 6         if (!isset($cache[$key]))\
    \ {\n 7             $cache[$key] = $fn(...$args);\n 8         }\n 9         return\
    \ $cache[$key];\n10     };\n11 }\n```\n\n这种缓存的高级计算机科学术语是 `memoization`（记忆化），就像“给自己写一张备忘录记录上次返回值是什么”。那个“备忘录”就是\
    \ `$cache` 变量。`memoize()` 接收一个函数作为参数并返回一个匿名函数。因此，`memoize()` 是一个高阶函数。\n\n它返回的具有我们之前看到的相同的缓存逻辑，但适用于任意参数。它对传入的原始函数\
    \ `$fn` 有闭包（closure），因此在调用它时，它可以将其参数传递给它。\n\n让我们看看实际效果：\n\n```php\n1 function\
    \ multiply(int $a, int $b): int {\n2     return $a * $b;\n3 }\n4 \n5 $multiplier\
    \ = memoize('multiply');\n6 \n7 print $multiplier(3, 5); // 输出 15\n8 print $multiplier(4,\
    \ 6); // 输出 24\n9 print $multiplier(3, 5); // 输出 15\n```\n\n这些调用中的每一个输出都与直接调用\
    \ `multiply()` 相同。然而，对 `$multiplier(3, 5)` 的第二次调用实际上并不会触发 `multiply()`。结果已经缓存在了名为\
    \ `$multiplier` 的匿名函数中。这种方法适用于任何参数可序列化的纯函数。\n\n如果我们正在处理一个不纯的函数呢？从数学上来说，我们无法说缓存是安全的；对于不纯函数，我们超出了可靠预测行为的能力。然而，我们仍然通过这种方式获得了优势；重置缓存只需将\
    \ `$multiplier` 重新赋值为 `memoize()` 的新调用，或者我们甚至可以通过多次调用 `memoize()` 来拥有多个具有各自缓存的版本。\n\
    \n即使我们处理的是一个与数据库通信的函数，以灵活且通用的方式将缓存逻辑从函数本身分离出来，我们在测试性和调试性方面也受益。\n\n# 柯里化 (Currying)\n\
    \n将函数作为一等值处理的能力允许我们利用纯函数的另一个属性：柯里化。\n\n尽管名字这么起，但柯里化与印度菜无关（尽管它可能很好吃）。它是以逻辑学家哈斯柯尔·柯里（Haskell\
    \ Curry）命名的，该技术和编程语言都以此人命名。柯里化是将多参数函数转换为单参数函数的过程，也被形象地称为“一元函数”（unary function）。事实上，几乎任何函数都可以转换为单参数函数！（在数学中，有少数无法柯里化的函数例子，但在日常\
    \ PHP 中遇到它们的概率非常小。）\n\n为了演示，让我们考虑这个例子：\n\n```php\n1 function volume(float $x,\
    \ float $y, float $z): float {\n2     return $x * $y * $z;\n3 }\n```\n\n如果我们想通过柯里化来处理它，可以这样写：\n\
    \n```php\n1 function curriedVolume(float $x) {\n2     return function(float $y)\
    \ use ($x) {\n3         return function(float $z) use ($x, $y) {\n4          \
    \   return $x * $y * $z;\n5         };\n6     };\n7 }\n8\n```\n\n现在我们可以这样调用：`curriedVolume(2)(3)(4)`。\n\
    \n使用 Lambda 表达式可以写得更简洁：\n\n```php\n1 $curriedVolume = fn(float $x) => fn(float\
    \ $y) => fn(float $z) => $x * $y * $z;\n```\n\n柯里化还允许我们部分固定某些参数：\n\n```php\n1\
    \ $volumeOfTwo = $curriedVolume(2);\n2 $volumeOfTwoAndThree = $volumeOfTwo(3);\n\
    3 print $volumeOfTwoAndThree(4); // 输出 24\n```\n"
- fmt: "\n3. Within a function literal: `[...$firstArgs, ...$secondArgs]` means “all\
    \ of the values from `$firstArgs`, followed by all the values in `$secondArgs`,\
    \ giving us one long flattened array.” It is a far simpler alternative to `array_merge()`\
    \ and is new in PHP 7.4.\n\n`partial()`, therefore, takes a function and an arbitrary\
    \ number of parameters, as an array named `$firstArgs`. It returns a function\
    \ that closes over that array and the callable and takes an arbitrary number of\
    \ parameters `$secondArgs`, which in turn concatenates all of the parameters together\
    \ and calls the original, saved function.\n\nNow, using that new tool we can do\
    \ this:\n\n```\n1 $partial_volume = partial('volume', 5, 4);\n2 print $partial_volume(8);\
    \   // Prints 160\n```\n\n`partial()` as implemented here only allows pre-filling\
    \ the values at the beginning of the parameter list. With short lambdas in PHP\
    \ 7.4, I am not convinced it is even necessary as the following syntax does the\
    \ same thing with less work, and it supports replacing any parameters we want,\
    \ and lets us provide type information to boot:\n\n```\n1 $volumeForLength = fn(float\
    \ $y): float => volume(5, $y, 8);\n```\n\nThe astute reader may recall that when\
    \ we introduced closures, we noted they were effectively the same thing as an\
    \ object constructor but with less syntax. Currying takes that idea to its logical\
    \ conclusion: A method call of an object can, in concept, be represented by a\
    \ single function that takes all of the constructor arguments followed by its\
    \ own arguments. The constructor simply creates a highly verbose curry of the\
    \ method that is shared by the other methods.\n\nOur last example could be rewritten\
    \ with this equivalent, if horribly verbose, code:\n\n```\n 1 class YVolumizer\n\
    \ 2 {\n 3     private float $x;\n 4     private float $z;\n 5 \n 6     public\
    \ function __construct(float $x, float $z)\n 7     {\n 8         $this->x = $x;\n\
    \ 9         $this->z = $z;\n10     }\n11 \n12     public function __invoke(float\
    \ $y): float\n13     {\n14         return $this->x * $y * $this->z;\n15     }\n\
    16 }\n17 \n18 $volumizerForLength = new YVolumizer(5, 8);\n19 print $volumizerForLength(4);\n\
    ```\n\nIt should be obvious which one I’d rather spend time typing.\n\nCurrying\
    \ is cool and all, but is it useful in practice aside from avoiding some typing?\
    \ It turns out it is, because in practice nearly any function can be rewritten\
    \ as a single-parameter function, almost trivially thanks to short lambdas. And\
    \ single-parameter functions allow us to do some very cool things, as we’ll see\
    \ in later sections.\n\nThe key takeaway from the chapter is this simple but incredibly\
    \ powerful line:\n\n```\n1 $volumeForLength = fn(float $y): float => volume(5,\
    \ $y, 8);\n```\n\nThe ease with which new functions can be defined that turn an\
    \ arbitrary pure function into a single-parameter function opens up a host of\
    \ possibilities that haven’t existed in PHP before now, and in many ways form\
    \ the basis for the rest of this.\n\n# Mapping\n\nBeyond the basics of “doing\
    \ things with functions,” functional programming tends to have a number of additional\
    \ primitives that get used to structure an algorithm rather than typical patterns.\
    \ Most of them have to do with the handling of lists.\n\nFor example, in typical\
    \ procedural code, it’s common to write a snippet like this:\n\n```\n1 $list =\
    \ [ /* Some set of data */]\n2\n3 $result = [];\n4 foreach ($list as $value) {\n\
    5     if ($value % 2 == 0) {\n6         $result[] = $value * 2;\n7     }\n8  \
    \   else {\n9         $result[] = $value;\n10     }\n11 }\n```\n\nIn this very\
    \ common idiom, we’re iterating over one list to build another. From a functional\
    \ perspective, though, there are a couple of problems with it:\n\n1. The operation\
    \ that is applied to each value is coupled with the act of iteration, meaning\
    \ you cannot test it independently.\n2. That, in turn makes it harder to read\
    \ and understand. We’re iterating over the list, sure, but it’s not obvious-a-glance\
    \ that we’re applying the same logic to each item. It’s also not immediately obvious\
    \ the computation applied to each element is independent of the others (It is,\
    \ but you have to actually read the code to find out).\n3. It involves mutable\
    \ variables.\n\nThe more functional way to think about this task is to consider\
    \ the iteration and operation separately. Instead of conceptualizing the problem\
    \ as “I want to go through a list of integers one by one and do something with\
    \ each,” conceptualize it as “I have an operation that takes an integer and returns\
    \ another integer, and I want to apply that operation to every value in this list.”\
    \ That naturally breaks down into two parts. First is the (pure) function we want\
    \ to apply to a value. In our trivial example, that function looks like this:\n\
    \n```\n1 $operation = function(int $val): int {\n2     if ($value % 2) {\n3  \
    \       // Odd numbers.\n4         return $value;\n5     }\n6     else {\n7  \
    \       // Even numbers.\n8         return $value * 2;\n9     }\n10 };\n11\n12\
    \ // Or, more succinctly:\n13 $operation = fn(int $val): int => $value % 2 ? $value\
    \ : $value * 2;\n```\n\nThat function can now be examined, tested, and understood\
    \ independently of the concept of lists.\n\nThe second part is applying that function\
    \ to not one integer, but a list of integers. Such an action is called `map`.\
    \ (Actually, the word “map” gets reused differently in a number of functional\
    \ languages, but this usage is reasonably universal, so let’s just roll with it.)\
    \ You’ve most likely run across PHP’s `array_map()` function at some point in\
    \ your life, which is exactly what we’re talking about. For practice, though,\
    \ let’s go ahead and implement our own version:\n\n```\n1 function map(iterable\
    \ $it, callable $fn): iterable\n2 {\n3     foreach ($it as $key => $val) {\n4\
    \         yield $key => $fn($val, $key);\n5     }\n6 }\n```\n\nA few things to\
    \ note in this version:\n\n1. It works on any `iterable`, not just an array. That\
    \ is the number complaint about PHP’s `array_map()` function, which shouldn’t\
    \ be surprising since it predates PHP having iterables.\n2. It uses `yield` to\
    \ produce a generator. That is, it operates lazily regardless of the size of the\
    \ list.\n3. Because PHP `iterable`s can always be keyed, it also passes the `key`\
    \ into the function being applied and preserves the keys when yielding values\
    \ back. Strictly speaking, this is not a proper list map, but since PHP doesn’t\
    \ have a true list structure (PHP arrays are hash maps or dictionaries), we’ll\
    \ work with the language rather than against it.\n4. You may notice the parameter\
    \ order is backward from `array_map()`, which takes the callable first. That’s\
    \ because `array_map()` can act on multiple arrays at once, which is occasionally\
    \ useful but requires putting the list of arrays at the end of the argument list.\
    \ In practice, with a single list, it is easier to read if the more complex argument\
    \ goes at the end, so I’ve put the list first and callable second.\n\nIn practice,\
    \ this implementation is just abstracting out the `foreach()` loop from our code.\
    \ (There are other implementations as we’ll see in a moment.) That still gets\
    \ us a new, more functional-style way to write our previous code:\n\n```\n1 $operation\
    \ = fn(int $val): int => $value % 2 ? $value : $value * 2;\n2 $result = map($list,\
    \ $operation);\n3\n4 // Or simply:\n5 $result = map($list, fn(int $val): int =>\
    \ $value % 2 ? $value : $value * 2);\n```\n\nThat is “more functional,” but I\
    \ would argue also objectively better in a few ways:\n\n1. If the operation is\
    \ less trivial than this, we can test it on its own in isolation from the question\
    \ of iteration.\n2. We can tell at-a-glance that each transformation is independent\
    \ of the others because it’s a `map`. That’s intrinsic in the definition of a\
    \ map.\n"
