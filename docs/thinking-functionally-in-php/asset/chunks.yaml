  trans: "\n然而，PHP 也允许你通过 `&` 创建一个通过引用的闭包：\n\n```\n1 $factor = 6;\n2 $multiplyByRef\
    \ = function(int $a) use (&$factor): int {\n3     return $a * $factor;\n4 };\n\
    5 $factor = 5\n6 print $multiplyByRef(9); // 输出 45\n```\n\n仔细观察这两个版本的行为。它们是纯函数吗？\n\
    \n在第一种情况下，是的。`$multiply` 的行为完全取决于传递给它的值。然而在第二种情况下，由于闭包是通过引用的，`$multiplyByRef`\
    \ 的行为依赖于某个外部值 `$factor`，因此对它的后续调用可能不会产生相同的值。所以 `$multiplyByRef` 不是一个纯函数，我们失去了对它所有的可预测性。\n\
    \n我们会发现这几乎是一条普遍法则：一个通过引用闭包某个值，或通过引用接收参数的函数，都不是纯函数。它仅仅是一个过程，因此其行为是不可预测的。\n\n##\
    \ 闭包对象\n\n如果你觉得很难理解“函数即值”的概念，PHP 提供了一种可能更熟悉的替代语法。任何对象都可以实现一个魔法方法 `__invoke()`，当该对象像函数一样被调用时，该方法就会被执行。\n\
    \n```\n 1 class Multiply\n 2 {\n 3     private int $factor;\n 4 \n 5     public\
    \ function __construct(int $factor)\n 6     {\n 7         $this->factor = $factor;\n\
    \ 8     }\n 9 \n10     public function __invoke(int $a): int\n11     {\n12   \
    \      return $a * $this->factor;\n13     }\n14 }\n15 \n16 $factor = 6;\n17 $multiplyObject\
    \ = new Multiply($factor);\n18 print $multiplyObject(9); // 输出 54\n```\n\n`Multiply`\
    \ 类与上面的匿名函数完全相同，只是语法更多。你可以将闭包看作一个单方法对象，其中闭包的变量被传递给构造函数。\n\n事实上，在 PHP 中，你不仅仅可以这样认为它。在引擎内部，这正是发生的情况。`$multiply`\
    \ 匿名函数会被转换为 `\\Closure` 类的对象，闭包的变量被赋值给对象的私有属性，然后像其他对象一样被传递。你甚至可以自己测试；以下代码会忠实地打印“yes”。\n\
    \n```\n1 $factor = 6;\n2 $multiply = function(int $a) use ($factor): int {\n3\
    \     return $a * $factor;\n4 };\n5 \n6 print $multiply instanceof \\Closure ?\
    \ 'yes' : 'no';\n```\n\n`Closure` 类还有其他一些特性。有趣的特性与 `$this` 的处理方式有关。默认情况下，如果在对象内部创建了匿名函数，它将隐式地闭包\
    \ `$this`，即创建它的那个对象。例如：\n\n```\n 1 class Table\n 2 {\n 3     private int $numForks\
    \ = 3;\n 4     private int $numSpoons = 4;\n 5 \n 6     public function cutleryCounter():\
    \ callable\n 7     {\n 8         return function() {\n 9             return $this->numForks\
    \ + $this->numSpoons;\n10         };\n11     }\n12 }\n13 \n14 $t = new Table();\n\
    15 $counter = $t->cutleryCounter();\n16 print $counter(); // 输出 7\n```\n\n这有时是理想的，有时不是。然而，一旦创建，`$this`\
    \ 的值就可以被交换：\n\n```\n1 $t2 = new Table();\n2 $counter = $t->cutleryCounter();\n\
    3 $newCounter = \\Closure::bind($counter, $t2);\n4 // $newCounter 的 $this 现在是\
    \ $t2，而不是 $t。\n```\n\n在实践中，这个技巧很少用处。然而，让我们检查一下：这会让 `$counter` 变得不纯吗？\n\n是的！无论是否重新绑定到新对象，它绑定的对象本身可能会改变；想象一下\
    \ `Table` 有方法允许你更改勺子的数量，例如。那么 `$counter` 就无法保证是幂等的（始终返回相同的值）。\n\n在一个不帮助你规避副作用的语言中，这些副作用可能是隐蔽的。\n\
    \n不过，这个观察有一个例外；如果可以证明 `Table` 是一个值对象（value object），那么 `$counter` 再次变成一个纯函数。我们将在后面的章节中介绍更多关于值对象的内容。\n\
    \n## 短 Lambda\n\nPHP 7.4 引入了另一种匿名函数的语法，被各种称为“短 Lambda”（因为它们写起来更短）或“箭头函数”（因为它们包含了\
    \ `=>` 符号，看起来像一个箭头）。我们之前的乘法示例现在可以写成这样：\n\n```\n1 $factor = 6;\n2 $multi = fn(int\
    \ $a): int => $a * $factor;\n3 print $multi(9); // 仍然输出 54\n```\n\n这段代码与我们之前看到的代码完全相同，但更短。短\
    \ Lambda 的函数体只能包含单个表达式，并且该表达式的结果会被返回。它们还支持“自动捕获”，这意味着你不需要显式指定要闭包的变量。短 Lambda 提供的功能并没有比传统函数多。\n\
    \n# 记忆化 (Memoization)\n\n现在我们已经有了一等函数的概念，并且有了纯函数，我们能用它们做什么呢？事实上，可以做很多。最简单的下一步是利用它们来帮助性能。\n\
    \n大多数 PHP 开发者在职业生涯某个阶段都写过类似这样的代码：\n\n```\n 1 function expensiveThing($key)\n 2\
    \ {\n 3     static $cache = [];\n 4 \n 5     if (!isset($cache[$key])) {\n 6 \
    \        // 执行某些昂贵的操作来填充 $cache[$key];\n 7     }\n 8 \n 9     return $cache[$key];\n\
    10 }\n```\n"
- fmt: "\nIt’s a fairly simple technique, but effective. Or, rather, mostly effective.\
    \ It does aid performance, but it also makes testing substantially harder because\
    \ later tests that hit that function get the cached version, not the original\
    \ version. This includes tests of `expensiveThing()` itself. \n\nIf the body of\
    \ `expensiveThing()` is a pure function then that probably won’t hurt anything…\
    \ but the most common behavior that gets wrapped there is some sort of `IO` call\
    \ (to a database, file system, or web service), so that’s out the window. Moreover,\
    \ it means `expensiveThing()` is itself not a pure function because it maintains\
    \ internal state.\n\nWhat we really want to do instead is separate the logic itself\
    \ from the cache. A first pass at improvement may look like this:\n\n```\n 1 function\
    \ expensiveThing($key)\n 2 {\n 3     static $cache = [];\n 4 \n 5     if (!isset($cache[$key]))\
    \ {\n 6         $cache[$key] = expensiveThingBody($key);\n 7     }\n 8 \n 9  \
    \   return $cache[$key];\n10 }\n11 \n12 function expensiveThingBody($key)\n13\
    \ {\n14     $value = // some expensive thing;\n15     return $value;\n16 }\n```\n\
    \nNow we’re able to test `expensiveThingBody()` in relative isolation without\
    \ worrying about caching, but we also have two functions to keep track of, and\
    \ all functions calling `expensiveThing()` still have the caching going on. That\
    \ may or may not be a problem.\n\nWhat if we could solve this problem generically,\
    \ however? We know any pure function is idempotent, by definition, which means\
    \ any pure function should be cacheable in this way. It may not always be useful,\
    \ but it’s always possible.\n\nAs long as we’re okay with a function being a value,\
    \ not a static string, a generic solution is fairly straightforward.\n\n```\n\
    \ 1 function memoize(callable $fn): callable\n 2 {\n 3     return function(...$args)\
    \ use ($fn) {\n 4         static $cache = [];\n 5         $key = serialize($args);\n\
    \ 6         if (!isset($cache[$key])) {\n 7             $cache[$key] = $fn(...$args);\n\
    \ 8         }\n 9         return $cache[$key];\n10     };\n11 }\n```\n\nThe fancy\
    \ computer-science name for this sort of caching is `memoization`, as in “write\
    \ yourself a memo about what the return value was last time.” That “memo pad”\
    \ is the `$cache` variable. `memoize()` takes a function as a parameter, and returns\
    \ an anonymous function. Therefore, `memoize()` is a higher-order function.\n\n\
    The function it returns has the same cache logic we saw before, but for arbitrary\
    \ arguments. It has a closure over the original function that was passed in, `$fn`,\
    \ so it has it available to pass its arguments on to it when it’s called.\n\n\
    Let’s see it in action:\n\n```\n1 function multiply(int $a, int $b): int {\n2\
    \     return $a * $b;\n3 }\n4 \n5 $multiplier = memoize('multiply');\n6 \n7 print\
    \ $multiplier(3, 5); // Prints 15\n8 print $multiplier(4, 6); // Prints 24\n9\
    \ print $multiplier(3, 5); // Prints 15\n```\n\nThe output of each of those calls\
    \ is the same as if we called `multiply()` directly. However, the second call\
    \ to `$multiplier(3, 5)` won’t actually invoke `multiply()`. The result is already\
    \ cached in the anonymous function that is `$multiplier`. This approach works\
    \ for any pure function whose parameters are serializable.\n\nWhat if we’re working\
    \ with an impure function? Mathematically we cannot say it’s safe to cache; with\
    \ an impure function, we’re outside of our ability to predict behavior reliably.\
    \ However, we’ve still gained an advantage this way; resetting the cache is simply\
    \ a matter of reassigning `$multiplier` to a new call to `memoize()`, or we could\
    \ even have multiple cached versions with their own cache by calling `memoize()`\
    \ multiple times.\n\nEven if we’re dealing with a function that talks to the database,\
    \ separating the caching logic out from the function itself in a flexible and\
    \ generic way gives us a benefit in testability and debugability.\n\n# Currying\n\
    \nThe ability to work with functions as first-class values allows us to take advantage\
    \ of another property of pure functions: Currying.\n\nDespite the name, currying\
    \ has nothing to do with Indian food (tasty as that may be). It is named after\
    \ the logician Haskell Curry, after whom both the technique and the programming\
    \ language are named. Currying is a process of converting a multi-parameter function\
    \ into a single-parameter function, also fancily known as a “unary function.”\
    \ In fact, almost any function can be converted into a single parameter function!\
    \ (There are a few examples in mathematics of functions that cannot be curried,\
    \ but the odds of running into them in routine PHP are quite small.)\n\nTo demonstrate,\
    \ let’s consider this example:\n\n```\n1 function volume(float $x, float $y, float\
    \ $z): float\n2 {\n3     return $x * $y * $z;\n4 }\n```\n\nThis mundane function\
    \ computes the volume of a three-dimensional box. (We’ll assume the units match\
    \ up for now.) It’s a pure function. What if we know the `x` value or want to\
    \ compute a bunch of volumes, all with the same `x` value? We can create a new\
    \ function that has `$x` preloaded, in a sense, like so:\n\n```\n1 $x = 5;\n2\
    \ $volumeWithX = function($y, $z) use ($x) {\n3     return volume($x, $y, $z);\n\
    4 };\n5\n6 $volumeWithX(2, 4); // Returns 40\n```\n\nAlternatively, using lambdas\
    \ for more concise syntax:\n\n```\n1 $x = 5;\n2 $volumeWithX = fn($y, $z) => volume($x,\
    \ $y, $z);\n```\n\nWhat if we want to curry the function one parameter at a time?\n\
    \n```\n1 $x = 5;\n2 $curriedVolume = function($y) use ($x) {\n3     return function($z)\
    \ use ($x, $y) {\n4         return volume($x, $y, $z);\n5     };\n6 };\n7\n8 $curriedVolume(2)(4);\
    \ // Returns 40\n```\n\nOr, more succinctly with lambdas:\n\n```\n1 $x = 5;\n\
    2 $curriedVolume = fn($y) => fn($z) => volume($x, $y, $z);\n3\n4 $curriedVolume(2)(4);\
    \ // Returns 40\n```\n\nBoth of those versions are identical; In both cases, `curried_volume()`\
    \ takes one parameter (`$x`), then returns another function that takes one parameter\
    \ (`$y`), which then returns a function that takes one parameter (`$z`), which\
    \ then finally does the computation on all three inputs and returns a value.\n\
    \n```\nvolume(5, 4, 8) === curried_volume(5)(4)(8);\n```\n\nWhile in this case,\
    \ we’ve shown currying one step at a time, there’s nothing which precludes closing\
    \ multiple parameters at once. In fact, it’s possible to write a generic “partial\
    \ application” function like so:\n\n```\n1 function partial(callable $fn, ...$firstArgs):\
    \ callable\n 2 {\n3     return function(...$secondArgs) use ($firstArgs) {\n4\
    \         return $fn(...[...$firstArgs,$secondArgs]);\n5     };\n6 }\n```\n\n\
    Or, more succinctly:\n\n```\n1 function partial(callable $fn, ...$firstArgs):\
    \ callable\n2 {\n3     return fn(...$secondArgs) => $fn(...[...$firstArgs,$secondArgs]);\n\
    4 }\n```\n\nSide note: If you’re confused by all of those ellipses, there are\
    \ three different uses of them in the above function:\n\n1.  In a function definition:\
    \ `...$firstArgs` means “and all remaining parameters, as an array”. It replaces\
    \ `func_get_args()`.\n\n2.  In a function call: `$fn(...[])` means “take this\
    \ array and spread it out as if I called the function with each parameter individually”;\
    \ it replaces `call_user_func_array()`.\n"
