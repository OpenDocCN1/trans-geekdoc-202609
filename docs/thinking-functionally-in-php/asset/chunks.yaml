  trans: "\n然而，如果我们想对距离值进行操作，这样做就没那么有用。例如，我们有时需要米，有时需要公里，有时需要英里。但 5 公里的值并不同于 5000\
    \ 米；如果我们尝试向一个期望其中一种单位的对象传递另一个单位，就会产生 1000 倍的误差。这意味着我们需要从一个单位转换为另一个单位。但通过直接修改对象来让它从“公里模式”切换到“米模式”会引入那种“幽灵般的远程作用”问题。\n\
    \n相反，就像 `DateTimeImmutable` 一样，我们允许对象创建一个新对象。\n\n```php\n 1 class Distance\n 2\
    \ {\n 3     // ...\n 4 \n 5     private array $factors = [\n 6         'kilometers'\
    \ => [\n 7             'meters' => 1000,\n 8             'kilometers' => 1,\n\
    \ 9         ],\n10         'meters' => [\n11             'meters' => 1,\n12  \
    \           'kilometers' => .001,\n13         ],\n14     ];\n15 \n16     public\
    \ function as(string $units): self\n17     {\n18         return ($this->units\
    \ == $units)\n19             ? $this\n20             : new static(\n21       \
    \          $this->length * $this->factors[$this->units][$units],\n22         \
    \        $units\n23             );\n24     }\n25 }\n```\n\n不同单位之间的转换因子是已知的且固定的，因此我们可以直接将其编码到类中。（添加更多可能的单位留给读者的练习；也可以采用更健壮的方法来避免使用浮点数时的精度损失，但目前这不是我们要讨论的话题。）`as()`\
    \ 方法返回一个新的 `Distance` 对象，包含请求的单位，并以该新单位表示长度。作为一种优化，如果对象已经是正确的单位，我们只需原样返回它，因为在语义上\
    \ 500 米就等于 500 米。`Distance` 的不可变性得到了保留，因为我们现在得到了所需格式的新对象。\n\n现在，假设我们要合并两个 `Distance`\
    \ 值，以便知道遍历这两个距离总共有多远。如果它们是原始的、无聊的浮点数，我们可以直接使用 `+`，但由于它们不是，我们必须自己处理。幸运的是，这相当直接：\n\
    \n```php\n 1 class Distance\n 2 {\n 3     // ...\n 4   \n 5     public function\
    \ add(Distance $add): self\n 6     {\n 7         return new static(\n 8      \
    \       $add->as($this->units)->length() + $this->length,\n 9             $this->units\n\
    10         );\n11     }\n12 }\n```\n\n再次，我们不是原地修改值，而是创建另一个新的 `Distance` 对象。这个对象拥有被调用对象的单位，其长度是它与另一个对象在转换为相同单位后长度的简单和。\n\
    \n同样，我们可以有一个 `equals()` 方法，来比较两个 `Distance` 对象的长度和单位，只有当两者都匹配时才返回 true。这种方法留给读者作为练习题。\n\
    \n## 可演进对象\n\nPHP 生态系统中最著名的值对象可能是由 PHP 框架互操作性小组（PHP-FIG）发布的 PSR-7 HTTP 消息接口。在概念上，它与上面的\
    \ `Distance` 类相似，但针对的是 HTTP `RequestInterface` 和 `ReponseInterface` 消息。（注意，这些消息对象并不对应任何现实世界的对象。）它内部包含许多值，但你无法更改它们；你只能从现有的对象生成一个带有某些更改的新请求或响应对象。在\
    \ PSR-7 中，它们没有为每个“生成新对象”方法想自定义名称，而是都带有 `with` 前缀。这里是一个示例，为了清晰起见添加了 PHP 7 类型。\n\
    \n```php\n 1 interface MessageInterface\n 2 {\n 3     public function getProtocolVersion():\
    \ string;\n 4 \n 5     public function withProtocolVersion(string $version): self;\n\
    \ 6 \n 7     public function getHeaders(): array;\n 8 \n 9     public function\
    \ hasHeader($name): bool;\n10 \n11     public function getHeader(string $name):\
    \ array;\n12 \n13     public function getHeaderLine($name): string;\n14 \n15 \
    \    public function withHeader(string $name, string $value): self;\n16 \n17 \
    \    public function withAddedHeader(string $name, string $value): self;\n18 \n\
    19     public function withoutHeader(string $name): self;\n20 \n21    // ...\n\
    22 }\n```\n\n还有更多，但它们遵循相同的模式：\n\n- `getX` 方法用于返回 HTTP 消息某部分的当前值；\n- `withX` 方法创建一个新的消息对象，该对象除了新增了数据外与原对象相同；\n\
    - `withoutX` 方法创建一个新的消息对象，除了删除了某些数据外与原对象相同。\n\n在实践中，它通常像这样通过链式方法调用来构建的：\n\n```php\n\
    1 $response = (new Response())\n2     ->withProtocolVersion('2.0')\n3     ->withHeader('content-type',\
    \ 'application/json')\n4     ->withAddedHeader('cache-control', 'no-cache')\n\
    5 ;\n```\n\n`Response` 对象被创建并丢弃，而写时复制的行为使其速度惊快，除非在密集循环中，否则不需要担心性能影响。\n\n## 依赖项\n\
    \n处理可演进对象时，一个常见问题是：“那么依赖项呢？”习惯于 OOP 世界的开发者必须担心确保对象不会重复，因为这会对它们的依赖项产生奇怪的影响，而这些依赖项可能传递依赖于不应该包含的东西，比如数据库连接。序列化一个对象总是充满挑战，因为你无法序列化数据库连接，或者你可能会序列化\
    \ 15 层你并不需要的依赖。\n\n数据建模的函数方法为该问题提供了一个简单的答案：这不是问题。\n\n服务对象存在这些问题。这就是为什么服务对象永远不应该状态状态，尝试序列化它们毫无意义。克隆它们也很少需要。服务对象构成了系统中数据的管道。\n\
    \n相比之下，值对象“仅仅是数据”。它们没有依赖项。它们可能有子对象，但那些子对象也是值对象。这意味着它们不需要像服务对象那样进行依赖注入。\n\n考虑一个\
    \ `Person` 对象，它将 `Address` 对象作为其属性之一。序列化的 `Person` 包含了完整的序列化 `Address`。这意味着在反序列化\
    \ `Person` 时，对象可以重构自己的 `Address` 对象。它不需要被注入。即使它非常复杂并且一个临时的构建器对象，这也是可以的，而且构建器可以在\
    \ `Person` 内部完全创建、使用并丢弃。\n\n值对象是流过你管道的数据块。\n\n"
- fmt: "\nIf your object design is such that you need to worry about long dependencies\
    \ chains getting serialized, or not re-initialized properly, or that cloning may\
    \ clone a database connection, it means that your object design is bad to begin\
    \ with. Use that concern as a driver to refactor your system in a more functional\
    \ way, with clearly separated service objects and immutable value objects, until\
    \ that concern disappears.\n\nAs an aside, that sort of service/value object differentiation\
    \ is directly contrary to the design of the “Active Record” pattern, where an\
    \ object pulled from a database has a reference to its data source service so\
    \ that it can put itself back. Active Record is inherently non-functional.\n\n\
    ## Entity Objects\n\nOne caveat to value objects is the special case of entity\
    \ objects. Entity objects are value objects with a unique identifier in some other\
    \ system; that could be a persistent database, or a remote service, or something\
    \ else where “the values are different now so it must be a different thing” no\
    \ longer holds. If you want to change the price on a `Product`, your `Product`\
    \ object is going to have some ID so you can save it back to the database with\
    \ the updated price. That can’t be immutable, can it?\n\nThere are a few ways\
    \ of addressing that problem. I’ll touch on each just briefly.\n\n### Ignore It\n\
    \nIgnore it and break the rules for entities. That’s what the “Active Record”\
    \ pattern does, as record objects (entities) have a direct connection back to\
    \ their service so they can mutate and get resaved. While it seems tempting, don’t\
    \ do that. It means everything your active `Product` object touches is no longer\
    \ functionally reliable:\n\n* It’s no longer “the same value” being passed to\
    \ a function, because who knows what state the database is in or if the object\
    \ has been modified.\n* You’re susceptible to spooky action at a distance, even\
    \ if your other functions are properly pure.\n* You cannot manipulate the object\
    \ without concern for side effects, because it’s built to have side effects.\n\
    * If you duplicate the object, the behavior of any changes you make is undefined.\n\
    \nThis is a bad strategy. Even in OOP-modeled code, Active Record has a large\
    \ number of problems. If you’re trying to leverage functional thinking, Active\
    \ Record and similar approaches should be viewed as anti-patterns.\n\n### Mutation\
    \ Instructions\n\nThe second option is to split your reading and writing into\
    \ separate pipelines and make the reading part a clean value object. If that sounds\
    \ a lot like CQRS (Command Query Request Separation), that’s because it is. Under\
    \ normal circumstances, read operations are far more common than write operations\
    \ in most systems PHP gets used for, so having a read-only version of an entity\
    \ that lacks mutator or evolving methods means most code is dealing with immutable\
    \ objects.\n\nFor the pathways where an entity needs to be updated, use instead\
    \ a dedicated changeset command. It could look a lot like the read entity or not,\
    \ but it should be a separate, ideally incompatible interface. That way, code\
    \ that expects to be reading an entity cannot get accidentally passed a mutable\
    \ object, and the few parts of the code that are explicitly part of the mutation\
    \ path know it, and you as a developer know to be extra careful with those parts.\n\
    \nFor example, if there is a `Product` object that represents a product in an\
    \ online store, that is read-only. There is a twin `ProductUpdate` object with\
    \ the same getters, but also setters. Updating a product then would look something\
    \ like this:\n\n```php\n 1 class ProductUpdate\n 2 {\n 3     private Product $product;\n\
    \ 4 \n 5     private array $changes = [];\n 6 \n 7     public function product():\
    \ Product\n 8     {\n 9         return $this->product;\n10     }\n 11 \n12   \
    \  public function setDescription(string $desc): self\n 13     {\n 14        \
    \ $this->changes['description'] = $desc;\n 15         return $this;\n 16     }\n\
    \ 17 \n 18     public function getChanges(): array\n 19     {\n 20         return\
    \ $this->changes;\n 21     }\n 22 }\n 23 \n 24 $prodUpdate = $repository->getProductForUpdate($id);\n\
    \ 25 $prodUpdate->setDescription('A book about functional programming.');\n 26\
    \ $repository->persist($prodUpdate);\n```\n\nThe result isn’t purely functional,\
    \ but it’s 95% functional, which in PHP is already a pretty impressive feat.\n\
    \n### Event Sourcing\n\nTaking that approach a step further, you could go full-on\
    \ Event Sourcing. Other books have been written on Event Sourcing, so I won’t\
    \ go into too much detail, but the general idea is that what is saved is not entity\
    \ objects, but “events” that may impact the state of the data. Any “read model”\
    \ is simply a denormalization of that event stream, which can be rebuilt at any\
    \ time. To use the previous product description example:\n\n```php\n 1 class ProductDescriptionUpdate\n\
    \ 2 {\n 3     private string $description;\n 4 \n 5     public function __construct(string\
    \ $description)\n 6     {\n 7         $this->description = $description;\n 8 \
    \    }\n 9 \n10     public function getNewDescription(): string\n11     {\n12\
    \         return $this->description;\n13     }\n14 }\n 15 \n16 $stream->addEvent(\n\
    17     new ProductDescriptionUpdate('A book about functional programming.')\n\
    18 );\n```\n\n`ProductDescriptionUpdate` can be an immutable value object, with\
    \ evolver methods, because it’s not the actual `Product`. The load routine, elsewhere,\
    \ pieces the various changes back together to produce the read-only version of\
    \ a `Product` at a given point in time, which could exist separately from a `Product`\
    \ built from a different point in time.\n\nEvent Sourcing is a complex topic,\
    \ so I won’t go further into how to implement that, but suffice to say it fits\
    \ nicely with a “mostly functional” mindset.\n\n### Functional State Management\n\
    \nFunctional programming has its own idioms for handling state, which we’ll cover\
    \ in later chapters. There are some other concepts we have to cover first in Part\
    \ Two. For now, I’ll only say they involve the Scary Word^(tm), which isn’t really\
    \ that scary; we just make it scary to keep children up at night.\n\n## Intra-Function\
    \ Immutability\n\nSo far, we’ve been focusing mainly on immutability at the function\
    \ or object boundary, but there’s also immutability of individual variables within\
    \ a function. In a strictly functional language that is also a no-no, for all\
    \ the same reasons as between function calls. Strictly immutable variables also\
    \ encourage you to write smaller functions that leverage recursion to process\
    \ larger data structures like lists or trees. For instance, our `nextSunday()`\
    \ routine above still has a mutable variable in it: `$date` still changes, even\
    \ if that has no impact outside of the function. A strictly functional version\
    \ of that function would look more like this:\n\n```php\n1 function nextSunday(\\\
    DateTimeImmutable $date): DateTimeImmutable\n2 {\n3     $oneDay = \\DateInterval::createFromDateString('1\
    \ day')\n4     return $date->format('l') == 'Sunday'\n5         ? $date\n6   \
    \      : nextSunday($date->add($oneDay));\n7 }\n```\n\nIf the date is already\
    \ a Sunday, just return it. Otherwise, call `nextSunday()` recursively with tomorrow\
    \ and return its results. In this case, it builds up a call stack of `nextSunday()`\
    \ calls, the final of which returns a date object that gets returned all the way\
    \ down the stack as the last step. This is an example of “tail recursion,” and\
    \ as discussed in the last chapter more robust languages have the ability to detect\
    \ this kind of recursion and transparently convert it to the non-recursive version,\
    \ which runs faster. Unfortunately, PHP is not such a language.\n"
