  trans: "\n\n```php\nabstract class StateTest extends TestCase\n{\n    /**\n    \
    \ * @dataProvider lexerProvider\n     */\n    public function test_state(\n  \
    \      string $input,\n        string $nextState,\n        string $remain,\n \
    \       array $expectedTokens\n    ): void\n    {\n        $class = $this->startState();\n\
    \n        /** @var Lexer $state */\n        $state = $class::of('');\n\n     \
    \   $result = $state->lex($input);\n\n        $this->assertInstanceOf($nextState,\
    \ $result);\n\n        $this->assertEquals($remain, $result->remaining());\n\n\
    \        $foundTokens = $result->tokens();\n        foreach ($expectedTokens as\
    \ $i => $expected) {\n            $this->assertInstanceOf(\n                get_class($expected),\n\
    \                $foundTokens[$i]\n            );\n            $this->assertEquals(\n\
    \                $expected->value,\n                $foundTokens[$i]->value\n\
    \            );\n        }\n    }\n\n    abstract function startState(): string;\n\
    \n    abstract function lexerProvider(): iterable;\n}\n```\n\n我们正在使用数据提供（data\
    \ provider）来减少样板代码。对于每一组输入字符串和预期的结果部分，我们对字符串进行词法分析， own 返回的值是预期的下一个状态。然后，我们确保标记（如果有的话）是我们预期的那些。\n\
    \n让我们以 `LexerStartLine` 的测试类为例：\n\n```php\nclass LexerStartLineTest extends StateTest\n\
    {\n    function startState(): string\n    {\n        return LexerStartLine::class;\n\
    \    }\n\n    function lexerProvider(): iterable\n    {\n        yield ['if foo',\
    \ LexerIf::class, ' foo', [new IfToken()]];\n        yield [' if foo', LexerIf::class,\
    \ ' foo', [new IfToken()]];\n        yield ['beep beep', LexerError::class, 'beep\
    \ beep', []];\n        yield ['Action bonk', LexerAction::class, ' bonk', [new\
    \ Action()]];\n    }\n}\n```\n\n简单极了！`startState()` 表示我们正在测试 `LexerStartLine`。`lexerProvider`\
    \ 返回一系列测试字符串和预期的分解结果。现在，任何想要传递给它的数据都可以非常轻而易举地进行测试。\n\n类似的方法也适用于整个 Lexer 管道本身的集成测试，调用\
    \ `Lexer::run()`。\n\n```php\nclass LexerTest extends TestCase\n{\n    /**\n  \
    \   * @dataProvider lexerProvider\n     */\n    public function test_lexing(\n\
    \        string $string,\n        string $endState,\n        array $expectedTokens\n\
    \    ): void\n    {\n        $l = Lexer::run($string);\n\n        $this->assertInstanceOf($endState,\
    \ $l);\n\n        $foundTokens = $l->tokens();\n        foreach ($expectedTokens\
    \ as $i => $expected) {\n            $this->assertInstanceOf(\n              \
    \  get_class($expected),\n                $foundTokens[$i]\n            );\n \
    \           $this->assertEquals(\n                $expected->value,\n        \
    \        $foundTokens[$i]->value\n            );\n        }\n    }\n\n    public\
    \ function lexerProvider(): iterable\n    {\n        // 在此处根据需要添加尽可能多的测试集。\n\n\
    \        yield ['On foo.bar', LexerDone::class, [\n            new On(),\n   \
    \         new Subject('foo'),\n            new Dot(),\n            new Trigger('bar'),\n\
    \        ]];\n    }\n}\n```\n\n## 分析\n\n这一章很长，但很大程度上是在反复重复同一种模式。让我们回顾词法分析器的核心：\n\
    \n*   我们正在使用乘积类型（product type）`Lexer`，它将一个字符串增强为字符串、标记列表和可调用对象。\n*   我们正在使用 `Writer`\
    \ 单 ad 设计来构建标记列表。\n*   我们正在使用 `Either` 单 ad 设计来处理不同的词法分析状态。\n*   我们构建了一个纯函数状态机。\n\
    *   我们在使用常用的面向对象技术的同时，结合了良好的函数编程技术。\n*   我们实现的方式简单且直观，便于进行干净的单元测试。\n*   我们用少于\
    \ 70 行核心代码完成了它。\n\n这非常令人印象深刻。不过，通过两个小小的补充来帮助该解决方案扩展，我们可以做得更加惊人。\n\n## 惰性加载（Being\
    \ Lazy）\n\n在当前的形式下，我们的词法分析器构建了一个长的标记对象列表，直到产生所有标记后才完成。在我们的简单情况下，这是没问题的；标记不会超过\
    \ 20-30 个。然而，对于较长的流，将所有内容都保留在内存中可能是不可接受的。\n\n首先，当前的 `bind()` 版本与 `run()` 相同。这里有一个惰性版本：\n\
    \n```php\nabstract class Lexer\n{\n    // ...\n    public function lazyBind(callable\
    \ $parseFn): Lexer\n    {\n        if (!$this->remaining) {\n            return\
    \ new LexDone($this->remaining);\n        }\n        // ...\n    }\n}\n```\n\n\
    接下来，我们需要从生成器（generator）中 `yield` 标记。这与 `run()` 几乎相同：\n\n```php\nabstract class\
    \ Lexer\n{\n    // ...\n    public static function lazy(string $string): \\Generator\n\
    \    {\n        $l = Lexer::of($string);\n        while (!$l instanceof Done)\
    \ {\n            $l = $l->lazyBind([$l, 'lex']);\n            yield from $l->tokens();\n\
    \        }\n        return $l;\n    }\n}\n```\n\n完成了。`lazy()` 产生一个生成器，`yield`\
    \ 每个词法状态的标记，然后返回最后一个状态；该状态是 `Done` 的实例（即 `LexerDone` 或 `LexerError`），可以进行检查。因为单个状态都是简单的算子（functor），不知道迭代、单\
    \ ad 或其他任何内容，它们的工作方式与以前一样。我们甚至可以复用相同的数据提供来测试 `lazy()`：\n\n```php\nclass LexerTest\
    \ extends TestCase\n{\n    /**\n     * @dataProvider lexerProvider\n     */\n\
    \    public function test_lazy_lexing(\n        string $string,\n        string\
    \ $endState,\n        array $expectedTokens\n    ): void\n    {\n        $tokens\
    \ = Lexer::lazy($string);\n\n        $tokenProducer = function() use ($tokens)\
    \ {\n            foreach ($tokens as $token) {\n                yield $token;\n\
    \            }\n        };\n        $foundTokens = iterator_to_array($tokenProducer());\n\
    \n        foreach ($expectedTokens as $i => $expected) {\n            $this->assertInstanceOf(\n\
    \                get_class($expected),\n                $foundTokens[$i]\n   \
    \         );\n            $this->assertEquals(\n                $expected->value,\n\
    \                $foundTokens[$i]->value\n            );\n        }\n\n      \
    \  $end = $tokens->getReturn();\n\n        $this->assertInstanceOf($endState,\
    \ $end);\n    }\n}\n```\n\n"
- fmt: "\nAnd now, we have a fully tested lazy purely functional monadic state machine,\
    \ which is worth at least triple points in software Scrabble.\n\n# Part Four\n\
    \n## Features of Functional Languages\n\nSo far, we’ve discussed functional programming\
    \ in the context of PHP. PHP is, of course, not the ideal language for functional\
    \ programming, as its syntax doesn’t always make functional techniques easy or\
    \ pretty. Many other languages, however, do have features that make functional\
    \ programming more natural. When developers tout the virtues of functional programming,\
    \ often what they are really raving about are language features that are commonly\
    \ found in functional languages.\n\nAs the saying goes, “programming languages\
    \ teach you to not want features they don’t have.” Some of these features may\
    \ seem odd at first, especially if you’ve never worked in a language other than\
    \ PHP. However, all of them have been implemented in, and successfully used in,\
    \ many other languages, making them worth understanding, if only to better understand\
    \ what functional programming can enable.\n\nNot all of these features would be\
    \ possible in PHP, nor make sense. I still present them in the interests of better\
    \ understanding functional programming as a concept and practice.\n\n### Auto-Currying\n\
    \nAs discussed previously, any pure function can be curried to a function of fewer\
    \ parameters. In most languages that can be done manually. In Haskell or F#, however,\
    \ it is the default behavior of all functions.\n\nIn Haskell, for instance, the\
    \ following function:\n\n```\n1 add :: Integer -> Integer -> Integer\n2 add x\
    \ y =  x + y\n```\n\ndefines a function named `add` that is of type `Integer ->\
    \ Integer -> Integer`. That can be read equally correctly as “a function that\
    \ takes two integers and returns an integer” or “a function that takes one integer\
    \ and returns a function that takes one integer and returns an integer.” That\
    \ is, it can be parenthesized as either of the following:\n\n```\n1 add :: (Integer\
    \ -> Integer) -> Integer\n2 \n3 add :: Integer -> (Integer -> Integer)\n```\n\n\
    That has two key implications. One, as a developer you can curry any function\
    \ by simply calling it with fewer than the required number of parameters. Two,\
    \ both the developer and the engine are able to use whichever interpretation is\
    \ most convenient at the time. That can lead to some very elegant functional syntax,\
    \ once you know how to recognize it. If you don’t know to look for it, it can\
    \ lead to Haskell’s famous incomprehensibility to people who aren’t comfortable\
    \ with Haskell.\n\nIt’s extraordinarily unlikely that such functionality would\
    \ even be possible in PHP.\n\n### Recursion Optimization\n\nMany recursive algorithms\
    \ have an iterative equivalent that is isomorphic to it but doesn’t suffer from\
    \ a deep stack trace. Some languages have the ability to detect recursive calls\
    \ and refactor them during the compilation step into an iterative version, as\
    \ a performance optimization.\n\nDoing that generically is hard, except in the\
    \ case of tail recursion. Tail recursion is when the recursive call is the very\
    \ last statement in the function. For instance:\n\n```\n1 function addUp(int $x,\
    \ int $sum = 0): int\n2 {\n3     if ($x == 0) return $sum;\n4     return addUp($x\
    \ - 1, $sum + $x);\n5 }\n```\n\nThe typical factorial implementation, however,\
    \ is not tail recursion since the last statement is multiplication, not the call\
    \ to `factorial()`:\n\n```\n1 function factorial(int $x): int\n2 {\n3     if ($x\
    \ == 1) return $x;\n4     return $x * factorial($x - 1);\n5 }\n```\n\nA number\
    \ of languages support tail recursion optimization. PHP does not. The main question\
    \ is whether recursion optimization can be done in a reasonable amount of time\
    \ to not slow down the generation of opcodes.\n\n### Isomorphic Optimization\n\
    \nIt’s quite common for functional-style code to have more function calls in it;\
    \ every `map()` call implies a function call for each item in the list, for instance,\
    \ and a `bind()` call implies two function calls for each step in a chain. Depending\
    \ on the language that may involve a non-trivial performance hit, including in\
    \ PHP.\n\nIf a compiler can know reliably it’s safe to do so, it can reorganize\
    \ code from a more readable, functional form into a more performant procedural\
    \ form. For instance, a series of Maybe monads is isomorphic to an `is_null` pyramid\
    \ of doom. That’s why we know it’s safe to write code in the monadic way that\
    \ ends up being much easier to read, debug, and maintain. However, that has a\
    \ performance cost. If the compiler could safely convert a series of `Optional`s\
    \ back into an `is_null` pyramid of doom, that could entirely eliminate the cost\
    \ of the monad wrapper.\n\nThis sort of optimization can lead to what’s called\
    \ in the Rust world “zero-cost abstractions,” where the abstraction improves readability\
    \ but gets optimized out of existence before the code actually runs.\n\nIt’s unlikely\
    \ PHP will ever be able to do much here, unfortunately. Aside from the performance\
    \ cost of the optimization itself, it’s only safe for the compiler to go around\
    \ rearranging your code if it can be very, very sure of what your code is doing.\
    \ That generally requires guaranteed pure functions and a strong type system,\
    \ neither of which PHP has. Guaranteed pure functions are unlikely to ever be\
    \ an engine-level feature of PHP, and there wouldn’t be much benefit to adding\
    \ them without also including such optimizations.\n\n### Function Composition\n\
    \nOne optimization that could be made is around function composition. We saw before\
    \ that it’s simple enough to write a `compose()` function in user-space:\n\n```\n\
    \ 1 function compose(callable ...$fns): callable\n 2 {\n 3     return function($x)\
    \ use ($fns) {\n 4         $ret = $x;\n 5         foreach ($fns as $fn) {\n 6\
    \             $x = $fn($x);\n 7         }\n 8         return $ret;\n 9     };\n\
    10 }\n```\n\nOr even a single line recursive function with reduce. However, that\
    \ adds overhead to every function call, especially if several of them have to\
    \ be curried first. However, to use our example from that chapter, this:\n\n```\n\
    1 getPromotions(mostExpensiveItem(getShoppingList(getCurrentUser(), 'wishlist'),\
    \ [\n2     'exclude' => 'sale'\n3 ]), $holiday);\n```\n\nis isomorphic to this,\
    \ which is cleaner to read and maintain:\n\n```\n1 $holiday = \"Lincoln's Birthday\"\
    ;\n2 $findPromFor = compose(\n3     fn($x) => getShoppingList($x, 'wishlist'),\n\
    4     fn($x) => mostExpensiveItem($x, ['exclude' => 'sale']),\n5     fn($x) =>\
    \ getPromotions($x, $holiday),\n6 );\n```\n\nA language-native way to concatenate\
    \ functions would eliminate the user-space overhead, as well as offer more optimization\
    \ options for the engine, as well as offer a nicer syntax.\n\nFor instance, F#\
    \ (among many other languages, including Facebook’s PHP fork, Hack) has a pipeline\
    \ operator `|>` that brings the `compose()` function down to the syntax level.\
    \ In F#, the above example could be written (also taking advantage of auto-currying)\
    \ as:\n\n```\n1 promos = getCurrentUser\n2     |> getShoppingList\n3     |> mostExpensiveItem\
    \ on sale\n4     |> getPromotions \"Lincoln's Birthday\"\n```\n\nWhile auto-currying\
    \ isn’t going to be a feature of PHP anytime soon, there’s no conceptual reason\
    \ that a pipeline operator couldn’t be. Now that short lambdas make currying any\
    \ function to single-parameter so easy, there’s little reason not to add it.\n\
    \nOne caveat is that most pipeline operator implementations call immediately.\
    \ That is, the above code would execute `getCurrentUser`, `getShoppingList`, `mostExpensiveItem`,\
    \ and `getPromotions`, returning the return value from `getPromotions`. That’s\
    \ different from our `compose()` method, which returns a callable to be used later.\
    \ Fortunately short lambdas would make that easy enough to wrap just once:\n\n\
    ```\n1 $finder = fn($x) => $x |> 'getShoppingList' |> 'mostExpensiveItem' |> 'getPromotions\\\
    \n2 ';\n```\n"
