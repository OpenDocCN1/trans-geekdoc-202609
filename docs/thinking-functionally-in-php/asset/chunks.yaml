    \n## Short Lambdas\n\nPHP 7.4 introduced yet another syntax for anonymous functions,\
    \ called variously “short lambdas” (because they’re shorter to write) or “arrow\
    \ functions” (because they include the `=>` symbol, which looks like an arrow).\
    \ Our previous multiplication example could now be written like this:\n\n```\n\
    1 $factor = 6;\n2 $multi = fn(int $a): int => $a * $factor;\n3 print $multi(9);\
    \ // Still prints 54\n```\n\nThis code is exactly the same as the code we saw\
