- fmt: "\nPHP is, unfortunately, one of the simple languages in which recursion does\
    \ pose a serious threat to memory usage as it does no optimization at all. That\
    \ means while recursion can be used, it should be used judiciously as it can easily\
    \ cause memory issues when working with even slightly large lists. As our goal\
    \ isn’t to describe how one should always write PHP code but to explain the concepts\
    \ of functional programming using a familiar language, we are ignoring that problem\
    \ for the remainder of this section. In production code, you wouldn’t want to\
    \ use it as readily as we are here; you have been warned!\n\nThe main advantage\
    \ that recursion has is that it can result in very elegant algorithmic code. A\
    \ recursive algorithm naturally follows the definition of a particular problem,\
    \ just written in code. It also very naturally avoids mutating variables, which\
    \ is a functional programming no-no.\n\nFor example, let’s reconsider `map()`.\
    \ Instead of using a `foreach()` loop, we could write it as a recursive function\
    \ instead.\n\n```\n 1 function recursive_map(array $list, callable $fn): iterable\n\
    \ 2 {\n 3     if (count($list)) {\n 4         return [$fn(head($list))], ...recursive_map(tail($list),\
    \ $fn)];\n 5     }\n 6 \n 7     return [];\n 8 }\n 9 \n10 // Or as a one-liner:\n\
    11 function recursive_map(array $list, callable $fn): iterable\n12 {\n13     return\
    \ count($list)\n14         ? [$fn(head($list)], ...recursive_map(tail($list),\
    \ $fn)]\n15         : [];\n16 }\n```\n\nIn this case, `recursive_map()` is defined\
    \ as a list consisting of applying `$fn` to the first element in the list, concatenated\
    \ with calling `recursive_map()` on the rest of the list. If the list is empty,\
    \ it simply returns an empty list. The result is a long line of `array_merge()`\
    \ calls to concatenate together a long series of single-element lists.\n\nFunctional\
    \ languages with better list support tend to have a nicer syntax for list concatenation,\
    \ too.\n\nOr, to take a more traditional example, consider the (in)famous Fibonacci\
    \ sequence: Each element in a list is defined as the sum of the two previous values,\
    \ or 1 if it’s the first two values. Recursively, the code looks exactly like\
    \ its definition:\n\n```\n 1 function fibonacci(int $nth): int\n 2 {\n 3     if\
    \ ($nth == 0) {\n 4         return 1;\n 5     }\n 6     if ($nth == 1) {\n 7 \
    \        return 1;\n 8     }\n 9     return fibonacci($nth - 1) + fibonacci($nth\
    \ -2);\n10 }\n```\n\nNever write this code in PHP. It is horribly inefficient,\
    \ both in terms of function calls and redundant calls to the same number. It can\
    \ be much more efficiently written, in PHP, as an iterative loop:\n\n```\n 1 function\
    \ fibonacci_iterative(int $n): int\n 2 {\n 3     $previous = 1;\n 4     $current\
    \ = 1;\n 5     $next = 1;\n 6     for ($i = 3; $i <= $n; ++i) {\n 7         $next\
    \ = $current + $previous;\n 8         $previous = $current;\n 9         $current\
    \ = $next;\n10     }\n11     return $next;\n12 }\n```\n\nIn PHP, that is substantially\
    \ faster and more memory efficient. However, it doesn’t really explain what the\
    \ algorithm is. It’s very concerned with implementation detail, which often hides\
    \ the algorithm itself. The recursive, functional version is much more self-explanatory.\n\
    \nThat’s one of the areas that a functional language has significant benefit.\
    \ A properly functional language (as opposed to one that just supports functional\
    \ style code) can take steps in the language semantics to make recursive-looking\
    \ algorithms more efficient. For instance, Haskell supports automatic memoization,\
    \ meaning that the many redundant calls to `fibonacci()` with the same input are\
    \ optimized away automatically. It can do that because all functions are guaranteed\
    \ pure, and thus memoizeable. It also doesn’t use a call stack the same way PHP\
    \ does. The result is that the first, easier to read version is faster than the\
    \ iterative version, in addition to being more self-documenting.\n\n# Immutable\
    \ Value Objects\n\nSo far, we’ve been talking mostly about simple variables: ints,\
    \ strings, and the occasional array. It’s a sorry language (and codebase) that\
    \ can’t handle anything more robust, though. Complex data structures are what\
    \ make modern software possible, but like most other features, they may have language-specific\
    \ caveats. In a functional mindset, we need our values to behave in a certain\
    \ way. Specifically, we want them to be unchanging.\n\nThe third core pillar of\
    \ functional programming, after pure functions and first-class functions, is immutable\
    \ variables. Superficially that term may sound contradictory: How can something\
    \ be both variable (subject to change) and immutable (non-mutating, non-changing)?\n\
    \nIt’s fine for a variable to represent “something to be determined at runtime,”\
    \ but to only ever represent one thing. In fact, it’s critically important at\
    \ times.\n\nWe already established that for functional programming to work, we\
    \ need to be working with pure functions; pure functions have no implicit or side-band\
    \ dependencies on any values outside of their parameters, nor any implicit effect\
    \ on any value or state beyond their return value. That includes changing its\
    \ parameters.\n\n## What PHP Does\n\nConsider the following snippet:\n\n```\n\
    \ 1 function nextSunday(\\DateTime $date): DateTime\n 2 {\n 3     $oneDay = \\\
    DateInterval::createFromString('1 day');\n 4     while ($date->format('l') !==\
    \ 'Sunday') {\n 5         $date->add($oneDay);\n 6     }\n 7     return $date;\n\
    \ 8 }\n 9 \n10 $today = new \\DateTime('2019-12-25');\n11 \n12 $sunday = nextSunday($today);\n\
    13 \n14 printf('Today is %s and the following Sunday is %s',\n15     $today->format('Y-m-d'),\
    \ $sunday->format('Y-m-d')\n16 );\n```\n\nWe would expect it to print Christmas\
    \ 2019 and the Sunday after (29), but that’s not what happens. Instead, we get\n\
    \n```\nToday is 2019-12-29 and the following Sunday is 29\n```\n\nTo make it even\
    \ weirder, if we refactor away the `$sunday` variable, we get different output:\n\
    \n```\n1 $today = new \\DateTime('2019-12-25');\n2 \n3 printf('Today is %s and\
    \ the following Sunday is %s',\n4     $today->format('Y-m-d'), nextSunday($today)->format('Y-m-d')\n\
    5 );\n6 \n7 // Today is 2019-12-29 and the following Sunday is 29\n```\n\nOur\
    \ code should not change results because of the order in which we dependent functions!\
    \ Here lies subtle and evil bugs, of the sort that neither a type system nor testing\
    \ can fix for you. Testing may catch it after the fact, if your test coverage\
    \ is really robust, but it would be much nicer if the code made such bugs impossible\
    \ in the first place.\n\nThe problem is that `$date` inside `nextSunday()` is\
    \ the same value as `$today`. They’re different variables, but they both refer\
    \ to the same value in memory. That means when you change the value of one variable,\
    \ you are changing it for both, creating a sort of “spooky action at a distance”\
    \ (to quote Albert Einstein). “Spooky” is never a term you want applied to your\
    \ code.\n\nThat problem doesn’t happen with integers, strings, or even arrays.\
    \ The difference is in the way PHP variable passing works, and there’s some subtlety\
    \ to it, largely inherited from other languages on which PHP is based.\n\nVariables\
    \ in PHP pass by value; that is, when you pass a variable to a function, the value\
    \ gets duplicated, so inside the function, you’re dealing with an entirely different\
    \ variable. However, you can also force it to pass by reference by placing an\
    \ `&` in the function signature for that parameter: `function roundUpTo10(int\
    \ &$num) {}`. In that case, PHP doesn’t duplicate the value but duplicates the\
    \ reference to it, so there are now two variables pointing to the same value in\
    \ memory. If you change one variable, you change the value behind it, thus impacting\
    \ both variables. As we’ve seen, that’s bad.\n"
