- fmt: "\nIn short, any function that returns `false` for an error condition (unless\
    \ it’s return type really is `boolean`) is wrong, is a design flaw, and there\
    \ are no exceptions to that rule. That includes every PHP standard library function\
    \ that makes that mistake. Never do that.\n\n## The Example\n\nLet’s consider\
    \ the same example as the previous chapter on composition. Here it is again in\
    \ its procedural form:\n\n```\n1 $user = getCurrentUser();\n2 $shoppingList =\
    \ getShoppingList($user, 'wishlist');\n3 $mostExpensiveItem = mostExpensiveItem($shoppingList,\
    \ [\n4     'exclude' => 'onSale'\n5 ]);\n6 $promotions = getPromotions($mostExpensiveItem,\
    \ $holiday);\n```\n\n* `getCurrentUser()` could fail if there is no one logged\
    \ in.\n* `getShoppingList()` could fail if the user doesn’t exist, or if that\
    \ user has no shopping list.\n* `mostExpensiveItem()` could fail if the user’s\
    \ shopping list is empty.\n* `getPromotions()` could fail if there are no promotions\
    \ for that item for the given holiday.\n\nIf any of those functions return null,\
    \ the next function cannot work. The naive, procedural way of addressing it would\
    \ be to wrap a bunch of `is_null()` calls around everything:\n\n```\n 1 $user\
    \ = getCurrentUser();\n 2 if (!is_null($user)) {\n 3     $shoppingList = getShoppingList($user,\
    \ 'wishlist');\n 4     if (!is_null($shoppingList)) {\n 5         $mostExpensiveItem\
    \ = mostExpensiveItem($shoppingList, [\n 6             'exclude' => 'onSale'\n\
    \ 7         ]);\n 8         if (!is_null($mostExpensiveItem)) {\n 9          \
    \   $promotions = getPromotions($mostExpensiveItem, $holiday);\n10         }\n\
    11     }\n12 }\n13 if (!is_null($promotions)) {\n14    // Display promotions or\
    \ something.\n15 }\n```\n\nWe can do better.\n\n## The Category Theory Solution\n\
    \nFrom a category theory perspective, what we need to do is lift all of those\
    \ functions to accept `null` and return `null` in addition to what they’re already\
    \ doing. That is, they need to be enhanced so that their domain (input) and codomain\
    \ (output) include null, thus making them total functions over the space of “the\
    \ thing you’re expecting, plus null.”\n\nThat results in:\n\n* `getCurrentUser()`\
    \ has a codomain of “User objects or `null`.”\n* `getShoppingList()` has a domain\
    \ of “User objects or `null`” and codomain of “ShoppingList objects or `null`.”\n\
    * `mostExpensiveItem()` has a domain of “ShoppingList objects or `null`” and a\
    \ codomain of “Product objects or `null`.”\n* `getPromotions()` has a domain of\
    \ “Product objects or `null`” and a codomain of “PromotionList objects or `null`.”\n\
    \nNow they’re all total functions and can be concatenated, in the category of\
    \ `PHPType But With Null`.\n\n## The Programming Solution\n\nProgrammatically,\
    \ what we want to do is factor out all of those `is_null` checks that handle the\
    \ flow control.\n\nThis problem space is the classic first example of monads,\
    \ and as a believer in tradition, I’m starting here as well. Different languages\
    \ use different name and often different techniques to arrive at a `null`-handling\
    \ monad. In Haskell it’s `Maybe`. In C++’s standard library it’s `optional`. In\
    \ Rust it’s `Option`. They’re all the same thing.\n\n### Unit\n\nThe first step\
    \ is to define a way to lift a value to “the same thing with `null`.” That’s pretty\
    \ straightforward in PHP:\n\n```\n1 class Optional\n2     private $value = null;\n\
    3 \n4     private function __construct($value = null)\n5     {\n6         $this->value\
    \ = $value;\n7     }\n8 \n9     // Alias of \"pack\", \"lift\", \"return\", all\
    \ the same thing.\n10     public static function of($value): self\n11     {\n\
    12         return new static($value);\n13     }\n14 \n15     public static function\
    \ none(): self\n16     {\n17         return new static();\n18     }\n```\n\nIn\
    \ this case, I’ve included both a constructor and a static method. I find the\
    \ static method easier to use, so for consistency I’ve made the constructor private.\
    \ I’ve also included a dedicated static method for the `null` case. Your mileage\
    \ may vary.\n\n### Bind\n\nSecond, we need to modify each of the functions we’re\
    \ using to return an `Optional` that may or not contain a value. For simplicity,\
    \ I am showing only one; the rest are left as an exercise.\n\n```\n1 function\
    \ getShoppingList($user, string $listName = 'main'): Optional\n2 {\n3     return\
    \ isset($user) ? Optional::of($user->$listName) : Optional::none();\n4 }\n```\n\
    \nAs an aside, couldn’t `getShoppingList()` be a method on the `User` object directly?\
    \ If you want to, sure. In that case the “function” you’re working with is `fn($user)\
    \ => $listName`. The syntax looks a little different, but the logic is the same.\n\
    \nThird, we need a way to call one of those modified functions with an `Optional`.\
    \ That’s exactly what the `bind` operation is:\n\n```\n1 class Optional\n2   \
    \  private $value = null;\n3 \n4     // ...\n5 \n6     public function bind(callable\
    \ $fn): self\n7     {\n8         if (!is_null($this->value)) {\n9            \
    \ return $fn($this->value);\n10         }\n11         return $this;\n12     }\n\
    13 }\n```\n\n`bind` here is the same `is_null()` dance we saw before but factored\
    \ out to a method. It does what `bind` claims to do, however: it takes a wrapped\
    \ value (`$this`) and a function that returns a wrapped value (`$fn`) and sticks\
    \ them together (`$fn($this->value)`).\n\nWe can now rewrite our code to look\
    \ like this:\n\n```\n1 $holiday = \"Lincoln's Birthday\";\n2 \n3 $promotions =\
    \ Optional::of(getCurrentUser())\n     ->bind(fn($x) => getShoppingList($x, 'wishlist'))\n\
    \     ->bind(fn($x) => mostExpensiveItem($x, ['exclude' => 'onSale']))\n     ->bind(fn($x)\
    \ => getPromotions($x, $holiday));\n```\n\nOr wrap it into a function to make\
    \ it reusable:\n\n```\n1 $promotionFinder = fn($userFinder, $holiday) => Optional::of($userFinder)\n\
    \     ->bind(fn($x) => getShoppingList($x, 'wishlist'))\n     ->bind(fn($x) =>\
    \ mostExpensiveItem($x, ['exclude' => 'onSale']))\n     ->bind(fn($x) => getPromotions($x,\
    \ $holiday));\n5 \n6 $promotions = $promotionFinder(getCurrentUser, \"Lincoln's\
    \ Birthday\");\n```\n\nIn either case, `$promotions` is now an `Optional`, which\
    \ may or may not contain a list of promotions. While this code isn’t quite as\
    \ clean looking as the version that used `compose()`, it doesn’t have the `null`\
    \ bugginess of that version, and it’s way cleaner than the deeply nested mess\
    \ above.\n\nLook carefully at the methods we’ve written. Every one is a pure function.\
    \ Assuming no `null` happen, a new `Optional` object is returned each time. They\
    \ really are just piped together in a pure, functional way.\n\nWe could make one\
    \ optimization and statically cache an instance of `Optional` with a null value\
    \ to return from the `none()` static method. That would, strictly speaking, make\
    \ it not a truly pure function. However, the net effect externally is still the\
    \ same, and it means over the course of a program you need only a single “null\
    \ instance,” which you could compare with `===`. Whether that’s worth it or not\
    \ I leave up to personal preference.\n\n### Getting Back Out\n\nWe could continue\
    \ working with `Optional`s as long as we want. For instance, we could pass (`bind`)\
    \ `$promotions` to a theming function that returns rendered HTML-or-null. Some\
    \ purists argue that once lifted to an enhanced variable, you should never come\
    \ back down. I find that to be practical only some of the time. Generally speaking,\
    \ once lifted you should stay there “as long as possible but no longer.” That\
    \ means there needs to be some way to “unlift”/”unwrap”/”unwhatever” the value.\
    \ There’s zero standardization for what to name that operation. In Rust it’s `unwrap()`.\
    \ `value()` is also a completely viable option. I’ve also seen `extract()` and\
    \ `unpack()`.\n"
