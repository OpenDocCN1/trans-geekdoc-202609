  trans: "\n让我们来看一个验证输入输入的案例。假设一个用户正在注册账户，我们想要验证该用户名是否合规。为了使其合法，它必须满足：\n\n* 用户未被占用\n\
    * 以字母开头\n* 长度至少为三个字符\n* 不包含非字母数字字符\n\n暂时不考虑这组标准好坏；它至少为我们提供了可以操作的对象。\n\n我们希望在最后返回一个值或一个错误消息。\n\
    \n## 范畴论解决方案\n\n其中可能的值之一是错误是偶然的。从范畴论的角度来看，我们正在看的是取两个类型并进行 `OR` 操作，即取上积（coproduct）。我们的\
    \ `Either` 类型是两种可能性之一，为了具有额外的通用性，通常标记为 `Left` 和 `Right`。而 `Left` 和 `Right` 又由其他某些值参数化。\n\
    \n也就是说，我们将类型 `Int` 提升为 `Int Or This Other Thing`，其中在我们的示例中，“这个其他东西”是一个错误。或者更抽象地说，如果说\
    \ `Optional` 是提升为“类型或 `null`”，那么 `Either` 就是提升为“这种类型或那种类型”。\n\n## 编程解决方案\n\n在最极简的意义上，`Either`\
    \ 看起来非常像上一章中的 `Optional` 结构。事实上，具有独立 `Some` 和 `None` 类的 `Optional` 版本就是一个 `Either`。它“要么”是一个想要的值或\
    \ `null`，而对 `null` 路径的处理是“一直什么都不做”。\n\n`Either` 模式的不同用例在 `Left` 和 `Right` 路径中有不同的逻辑。在类似于异常的错误处理的简单情况下，`Left`\
    \ 路径本质上与之前的 `None` 路径相同，但其他情况可能看起来完全不同。（记住，monad 是*设计模式*，而不是来自象牙塔的精确命名。）为了强调这只是\
    \ `Either` 模式的一种特定实现（而且因为我作为一个左撇子，对认为 `Left` 是所谓的“不愉快的路径”的想法感到被冒犯），我们将使用一组更具针对性的名称。\n\
    \n我们将通过多种方式实现 `Either`，以证明没有一种唯一的真理方法。首先让我们模仿 `Optional` 的方法，因为它更通用。\n\n我们首先需要建立数据包装器。具体来说，我们有两个路径：成功（Success）和失败（Failure）。两者都是我们输入验证器的合法结果（Results）。让我们直接使用这些术语：\n\
    \n```\n 1 abstract class Result\n 2 {\n 3     protected $value;\n 4 \n 5     public\
    \ function __construct($value)\n 6     {\n 7         $this->value = $value;\n\
    \ 8     }\n 9 \n10     public function value()\n 11     {\n 12         return\
    \ $this->value;\n 13     }\n 14 \n 15     public static function of($value): self\n\
    \ 16     {\n 17         return new static($value);\n 18     }\n 19 \n 20     abstract\
    \ public function bind(callable $fn);\n 21 }\n 22 \n 23 class Success extends\
    \ Result\n 24 {\n 25     public function bind(callable $fn)\n 26     {\n 27  \
    \       return $fn($this->value);\n 28     }\n 29 }\n 30 \n 31 class Failure extends\
    \ Result\n 32 {\n 33     public function bind(callable $fn)\n 34     {\n 35  \
    \       return $this;\n 36     }\n 37 }\n```\n\n`Success` 包装了我们的快乐路径，并将值从一个验证步骤传递到下一个。`Failure`\
    \ 包装了不愉快的路径，并携带了验证步骤返回的错误。`Success` 包装了我们的快乐路径（happy path），并将值从一个验证步骤传递到下一个。`Failure`\
