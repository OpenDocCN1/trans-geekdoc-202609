    \ PHP 并不具备其中任何一种机制，最直接的方法就是直接添加一个手动的方法检查：\n\n```\n 1 class Optional\n 2 {\n 3\
    \     private $value = null;\n 4 \n 5     // ...\n 6 \n 7     public function\
    \ valid(): bool\n 8\n     {\n 9         return !is_null($this->value);\n10   \
    \  }\n11 \n12     public function value()\n13     {\n14         return $this->valid()\
    \ \n15             ? $this->value \n16             : throw new \\RuntimeException(\"\
    The cat is dead, Schrodinger\");\n17     }\n18 }\n```\n\n这里的任何返回 `Optional` 的函数都会迫你考虑返回值可能无效。如果你调用\
    \ `getCurrentUser()` 并假设它有值而开始使用它，它在理想路径（happy path）下运行良好……但在非理想路径（unhappy path）下会失败得很惨。通过让它返回\
    \ `Optional`，“等一下，这是一个真实值吗？”这个问题会直接甩到脸上，让你不太可能忘记检查非理想路径。（你仍然可以偷懒，但现在你没有借口了。）\n\
    \n其他库和语言在这里有其他额外的工具。例如，Java 的 `Optional` 类包含了一些很棒的默认处理工具方法。翻译成 PHP，它们将是：\n\n```\n\
    \ 1 class Optional\n 2 {\n 3     private $value = null;\n 4 \n 5     // ...\n\
    \ 6 \n 7     public function orElse($default)\n 8\n     {\n 9         return !is_null($this->value)\
    \ ? $this->value : $default;\n10     }\n11 \n12     public function orElseGet(callable\
    \ $default): bool\n13\n     {\n14         return !is_null($this->value) ? $this->value\
    \ : $default();\n15     }\n16 }\n```\n\n在这种方法中，当你提取被包装的值时，你被强制提供一个默认值，以防万一。如果推导默认值的开销可能，你可以提供一个只在需要时才被调用的函数。\n\
    \n如果你愿意，这里还可以做更多，并且符合“可能 Mon 元（Maybe Monad）”的定义。\n\n# 另一种实现\n\n为了好玩，让我们看看是否也能去掉\
    \ `Optional` 类中的那些条件判断。在 Haskell 和 Rust 中，Maybe Monad 是通过类型类实现的。在 Haskell 中，`Maybe`\
    \ 被定义为 `Just` 或 `Nothing` 之一。在 Rust 中，`Option` 被定义为 `Some` 或 `None` 之一。PHP 没有类型类，但我们可以使用子类来模拟它们。（也就是说，这就是我们之前讨论的“和类型”的示例。）这里是实现我们的\
    \ `Optional` 单元的另一种方法：\n\n```\n 1 interface Optional\n 2 {\n 3     public function\
    \ bind(callable $fn): self;\n 4 \n 5     public function valid(): bool;\n 6 \n\
    \ 7     public function value();\n 8 \n 9     public function orElse($default);\n\
    10 }\n11 \n12 class None implements Optional\n13 {\n 14     public static function\
    \ none(): self\n15     {\n 16         return new static();\n17     }\n18 \n19\
    \     public function bind(callable $fn): self\n20\n     {\n 21         return\
    \ $this;\n22     }\n23 \n24     public function valid(): bool\n25\n     {\n 26\
    \         return false;\n27     }\n28 \n29     public function value()\n30\n \
    \    {\n31         throw new \\RuntimeException('Sorry, Schrodinger');\n32   \
    \  }\n33 \n34     public function orElse($default)\n35\n     {\n 36         return\
    \ $default;\n37     }\n38 }\n39 \n40 class Some implements Optional\n41 {\n 42\
    \     protected $value;\n43 \n44     private function __construct($value)\n45\n\
    \     {\n 46         $this->value = $value;\n47     }\n 48 \n49     // Alias \"\
    of\", \"pack\", \"lift\", \"unit\", \"return\", all the same thing.\n50     public\
    \ static function of($value): self\n51\n     {\n 52         return new static($value);\n\
    53     }\n 54 \n55     public function bind(callable $fn): self\n56\n     {\n\
    \ 57         return $fn($this->value);\n58     }\n59 \n60     public function\
    \ valid(): bool\n61\n     {\n 62         return true;\n63     }\n 64 \n65    \
