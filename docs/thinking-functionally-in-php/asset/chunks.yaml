- fmt: '

    `(a, b)` and `(b, a)` are not equal. A function (or morphism) that expects one
    will break if it gets the other. However, it’s trivially simple to convert between
    the two losslessly with a `swap` function. Since there’s a function from one to
    the other and back again, that means they are “equal up to isomorphism,” or isomorphic.


    Similarly, `(a, (b, c))` and `((a, b), c)` are not equal in the sense that we
    can just ignore the parentheses. That is, they are not associative. However, it’s
    trivially simple to convert between the two losslessly. That makes them “associative
    up to isomorphism.” More importantly for us, they’re also both isomorphic to `(a,
    b, c)`.


    An ordered fixed list of different types is called in programming lingo a `tuple`.
    A `2-tuple` is a pair. You can also have a `3-tuple`, `30-tuple`, or more generically
    an `n-tuple`.


    Usefully, there is also a type that can be incorporated into a Cartesian product
    that is isomorphic to not doing so; that is, it’s a no-op. That type is the `unit`
    type, which is the set with only one value (think `null`). A product of a set
    `A` with a single-element set has the same number of elements as `A`; no actual
    information has been added. If product types are equivalent to multiplication,
    then `unit` here is 1.


    That is, we have a category (sets), we have a binary way of operating on it, and
    we have a no-op value. Hey, look, a monoid! `<Set, product, unit>` constitutes
    a monoidal category.


    ## Product Types in PHP


    Many languages have native support for tuples. PHP does not. The closest it has
    are arrays, but arrays are untyped, so we cannot enforce that `[1, "hello"]` is
    valid and `["hello", 1]` just makes no sense. That’s fine, though, because frankly
    tuples are a painful data structure to work with much of the time because there’s
    no built-in way to refer to each element other than by position, which is just
    as bug-risky as untyped arrays.


    What’s more useful in practice are named tuples; that is, tuples where each element
    has a name by which it can be accessed so that the order becomes irrelevant. Technically
    the order is still there, but because it’s isomorphic to reorder them it doesn’t
    impact us in practice. Different languages have different terminology for named
    tuples, but in PHP and most similar languages you’re already intimately familiar
    with them: classes.


    The OOP perspective on classes is that they create a new type unto themselves,
    whose internal details are entirely opaque. The category theory or functional
    perspective on classes is that they are `product types`, a combination of two
    other types (categorical objects) to form a new type (categorical object). Neither
    of these perspectives is right or wrong; the language syntax supports either mindset.


    As we discussed back in the chapter on value objects, it’s important to differentiate
    between service objects and data objects. Service objects are closed-over functions
    with funny syntax. Value objects are dumb nouns in their own right. Now, we can
    also think of them as product types built from other types (which could themselves
    be product types). Or nouns built by composing other nouns. (German speakers should
    be right at it.)


    ## Coproducts


    Most languages have native support for sum types. PHP does not. The closest it
    has are arrays, but arrays are untyped, so we cannot enforce that `[1, "hello"]`
    is valid and `["hello", 1]` just makes no sense. That’s fine, though, because
    frankly sum types are a painful data structure to work with much of the time because
    there’s no built-in way to refer to each element other than by position, which
    is just as bug-risky as untyped arrays.


    What’s more useful in practice are named tuples; that is, tuples where each element
    has a name by which it can be accessed so that the order becomes irrelevant. Technically
    the order is still there, but because it’s isomorphic to reorder them it doesn’t
    impact us in practice. Different languages have different terminology for named
    tuples, but in PHP and most similar languages you’re already intimately familiar
    with them: classes.


    As an aside, sometimes PHP functions return `false` instead of `null` to indicate
    error conditions. That is even worse, as it’s not just unhandleable, but also
    not type safe. Plus, because `false` silently casts to legal `int` and `string`
    values, it can be even harder to detect. That makes it really easy for a shrug
    emoji to hide in your code and produce all sorts of completely incorrect results.


    The OOP perspective on classes is that they create a new type unto themselves,
    whose internal details are entirely opaque. The category theory or functional
    perspective on classes is that they are `product types`, a combination of two
    other types (categorical objects) to form a new type (categorical object). Neither
    of these perspectives is right or wrong; the language syntax supports either mindset.


    Most languages have native support for sum types. PHP does not. The closest it
    has are arrays, but arrays are untyped, so we cannot enforce that `[1, "hello"]`
    is valid and `["hello", 1]` just makes no sense. That’s fine, though, because
    frankly sum types are a painful data structure to work with much of the time because
    there’s no built-in way to refer to each element other than by position, which
    is just as bug-risky as untyped arrays.


    ## Part Three


    # Handling Null


    ## The Problem


    Recall from the chapter on concatenating or composing functions that we really
    want to be able to pipe functions together. That’s a very low-impact way of building
    up a large solution out of little solutions in a controlled and pure way. There’s
    one important caveat to it, though. That assumes all of the functions involved
    are total functions. If any function involved has no defined output for a given
    input, all bets are off because it has nothing meaningful to return. It’s no longer
    a morphism. Commonly, the answer here is to have that function return `null`,
    which is the programming equivalent of a shrug emoji.


    That creates a problem because the next function then needs to be able to know
    how to handle a shrug emoji (`null`). Most likely, all it can do is respond with
    its own shrug emoji, and then it’s shrug emoji all the way down.


    Error handling via shrugging is generally a bad idea.

