    \ of `Token` objects along the way. The line of returns from each `Lexer`/state\
    \ to the next (which might be multiple possible states depending on the string)\
    \ form a graph, which describes the entire state machine of our particular DSL.\n\
    \nWe also need an end condition, lest we end up with an infinite loop. That’s\
    \ what the `instanceof Done` check is for; `Done` is simply an empty marker interface\
    \ on a given lexer state to indicate that the process is complete. There are two\
    \ lexer states in particular that implement it: An actual `LexerDone` state when\
    \ there’s nothing left to do, and an `Error` state in case the input is invalid.\
    \ We’ll look at the error case in a bit, but for now, here’s the `Done` state:\n\
    \n```\n1 class LexerDone extends Lexer implements Done\n2 {\n3     public function\
    \ lex($string): Lexer\n4     {\n5         return $this;\n6     }\n7 }\n```\n\n\
    This should be reminiscent of the `Error` case from the `Either` monad, as it\
    \ serves a similar purpose.\n\nTo ensure we don’t end up in an infinite loop,\
    \ let’s modify `bind()` so that if there is no remaining string we end up directly\
    \ in the `Done` state:\n\n```\n 1 abstract class Lexer\n 2 {\n 3     // ...\n\
    \ 4 \n 5     public function bind(callable $parseFn): Lexer\n 6     {\n 7    \
    \     if (!$this->remaining) {\n 8             return new LexerDone($this->remaining,\
    \ $this->tokens);\n 9         }\n10 \n11         /** @var static $res */\n12 \
    \        $res = $parseFn($this->remaining);\n13         $res->tokens = [...$this->tokens,\
    \ ...$res->tokens];\n14         return $res;\n15    }\n16 }\n```\n\nBefore we\
    \ move on, let’s define some additional utilities that individual state functions\
    \ use. They could be anywhere, but for convenience, let’s put them as methods\
    \ on `Lexer`.\n\n```\n 1 abstract class Lexer\n 2 {\n 3     // ...\n 4 \n 5  \
    \   protected function skipSpaces(string $string): string\n 6     {\n 7      \
    \   // Don't skip newlines as those have lexical significance.\n 8         return\
    \ ltrim($string);\n 9     }\n10 \n11     protected function readAlphaNumeric(string\
