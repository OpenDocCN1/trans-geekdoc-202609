  trans: "\n我们想要的是由分析函数组成的流水线，这些函数可以在处理过程中修改字符串，同时记录关于字符串的侧带数据（side-band data）。我们在另一端想要的就是这些侧带数据。\n\
    \n## 范畴论解决方案\n\n将这视为一类新数据似乎有些牵强，但在某种意义上，它确实是。我们是将分析函数从“字符串”提升到了“字符串和日志”。这与“类型或\
    \ `null`”的提升并没有多大牵强。\n\n这种情况的区别在于，我们并没有根据增强后的类型来改变控制流。相反，增强后的类型是字符串和日志的乘积类型（product\
    \ type）。当日志被添加时，它现在成了一个新值。（记住关于值对象的整整章节。）\n\n当 `Either` 单单将类型提升到“类型 或 类型”时，这种单单模式将类型提升到“类型\
    \ **且** 类型”。因为它允许函数向日志写入内容，它的常用名称是 `Writer` 单单。\n\n## 编程解决方案\n\n为了灵活性起见，让我们假设要收集的统计列表是无界的；它只是字符串的键/值对，我们可以将其建模为关联数组。\n\
    \n这让我们很想让分析函数直接返回一个三元素数组：`[string, label, stat]`。虽然这在技术上可行，但它在很多方面都会失败。\n\n* \
    \  “元组数组”（位置很重要的混合类型复合变量）是出了名的“不自文档化”。\n*   我们可以切换到关联数组给它添加标签，但关联数组的文档化程度仍然严格少于适当的数据类型（类）。\n\
    *   我们不想将字符串提升为数组！那是错误的类别。我们想要将字符串提升为“字符串和日志”。\n\n记住，函数的返回值是我们提升/增强类型中的一个一个值。因此，它必须是一个对象，我们可以在其上调用更多的分析函数。让我们先从乘积类型本身开始：\n\
    \n```\n1 class Stats\n2 {\n3     protected string $string;\n4 \n5     protected\
    \ array $log;\n6 }\n```\n\n注意：我通常会强烈反对如此随所欲地使用数组，因为 PHP 数组是数据建模的糟糕数据结构，并且没有保证的不可变性。然而，这一章是关于\
    \ `Writer` 单单，而不是数组的陷阱，所以为了节省空间，我们将直接使用 `$log` 作为数组。\n\n现在我们需要为它提供一个 `unit` 操作，它只是一个构造函数以及可选的\
    \ `of` 方法：\n\n```\n 1 class Stats\n 2 {\n 3    // ...\n 4 \n5     protected function\
    \ __construct(string $string, array $log)\n 6     {\n 7         $this->string\
    \ = $string;\n 8         $this->log = $log;\n 9     }\n10 \n11     public static\
    \ function of(string $string, array $log = []): self\n12     {\n 13         return\
    \ new static($string, $log);\n14     }\n15 }\n```\n\n为了易用性，我强制外部用户使用 `of` 方法是可选，但将构造函数设为公共并完全消除\
    \ `of` 也是同样有效的。\n\n现在我们可以创建一个新的“带侧带日志的字符串”对象，下一步是允许我们将其他函数 `bind` 到它上面（即在该值上调用这些函数）。不过，`bind`\
    \ 这个名字确实很通用且不自文档化。让我们把它重命名为 `analyze()` 吧。\n\n```\n 1 class Stats\n 2 {\n 3  \
    \   // ...\n 4 \n5     public function analyze(callable $fn): self\n 6     {\n\
    \ 7         $result = $fn($this->string);\n 8         return new static($result->string,\
    \ $this->log + $result->log);\n 9     }\n10 }\n```\n\n这里是所有有趣点所在。当我们 `bind`（用某个函数分析）一个函数时，该函数会获得要分析的字符串。它会返回一个新的\
    \ `Stats` 对象，然后我们将其与当前对象合并。在这种情况下，“合并”意味着使用新对象的字符串，并将它们的日志拼接在一起。\n\n比起之前的示例，我们在这里看到了看到了单元（monoid）行为的运作。有两个\
    \ `Stats` 对象：`$this` 和“`$fn` 返回的那一个”。这两个类型为 `Stats` 的对象被相加产生第三个 `Stats` 对象并返回。在这种情况下，“相加”被定义为“第二个对象的字符串，以及两者的日志”，但在概念上，我们可以以任何想要的方式这两个对象揉在一起。\n\
    \n分析函数非常直观。这里是可能的分析器示例：\n\n```\n 1 function readingLevel(string $s): Stats\n 2\
    \ {\n 3     return Stats::of($s, [\n 4         'Reading Level' => 'high school'\n\
    \ 5     ]);\n 6 }\n 7\n 8 function normalizeNewlines(string $s): Stats\n 9 {\n\
    10     $cleaned = preg_replace(\"/[\\r\\n]+/\", \"\\n\", $s);\n11     return Stats::of($cleaned);\n\
    12 }\n 13 \n14 function countStats(string $s): Stats\n15 {\n16     $words = str_word_count($s);\n\
    17     return Stats::of($s, [\n18         'Word Count' => $words,\n19     ]);\n\
    20 }\n21\n22 function wordDistribution(string $s, int $minimum = 0): Stats\n23\
    \ {\n24     $words = array_count_values(strtolower($s));\n25     $words = array_filter($words,\
    \ fn($value) => $value >= $minimum);\n26     arsort($words);\n27     return Stats::of($s,\
    \ [\n28         'distributions' => $words,\n29     ]);\n30 }\n```\n\n计算文本块的 `readingLevel`\
    \ 实际上很困难，所以我不写了（你可以将其交给某些服务）。但它返回一个有效的 `Stats` 对象，带有未修改的字符串和一个新的日志。我们可以通过 `normalizeNewlines`\
    \ 将多个换行符折叠为单个换行符。我们不希望这样做存储的字符串，但它的日志部分是空的，这没问题。现在清理了换行符，我们可以对字符串进行基本的 `countStats`。这种情况下返回的日志项不是字符串而是数组，这没问题。我们甚至可以进行更深入的分析并获取\
    \ `wordDistribution`。在这种情况下，分析函数还接受一个最小值来过滤结果中的单词。它返回的日志项是数组，没有违反我们目前建立的任何规则。（如果是真实的实现，这也是为每个条目定义一个\
    \ `StatItem` 类的原因）。注意，这个函数内部修改了 `$words` 变量；如果我们非常严苛，这违反了不可变变量规则，但整个函数仍然是纯的，所以算了吧。\n\
    \n对初始字符串运行统计分析器，就像我们预期的那样简单：\n\n```\n1 $result = Stats::of($string)\n2     ->analyze('normalizeNewlines')\n\
    3     ->analyze('readingLevel')\n4     ->analyze('countStats')\n5     ->analyze(fn($s)\
    \ => wordDistribution($s, 3))\n6 ;\n```\n\n前三个函数已经是单参数的，所以可以直接传递。`wordDistribution()`\
    \ 是多参数的，所以我们先用 3 对它进行柯里化。最后，我们得到了 `$result` `Stats` 对象。现在我们需要获取它包含的日志。这轻而易举：\n\
    \n```\n1 class Stats\n2 {\n3     // ...\n4 \n5     public function log(): array\n\
    6     {\n7         return $this->log;\n8     }\n9 }\n```\n\n现在我们拥有了请求的所有统计信息的完整列表，没有全局状态，没有可变值（重要的话），由纯函数构建，并且足够灵活，我们可以向其添加无限数量的分析器，所有通过\
    \ PHP 的写时复制行为保持了合理的内存效率。\n\n而且我们可以说我们在使用单单。\n\n"
- fmt: "\nOne limitation of monad-based flow control is that it is not always easy\
    \ to combine. Stacking two monads on top of each other is difficult to do generically,\
    \ and depending on the language may be syntactically difficult or even impossible.\
    \ However, the underlying concepts of the monads involved, their particular “lift,”\
    \ can be readily combined with one-off solutions that combine both sets of logic.\
    \ For example, stacking our previous `Either` and `Writer` monads while still\
    \ retaining both of their behavior is difficult. However, writing a single monad\
    \ that “lifts” values to “Either with a Log” is reasonably straightforward.\n\n\
    To demonstrate how that can be done, let’s take a look at one of the harder problems\
    \ in software engineering: parsing. Turning a string into a meaningful logical\
    \ structure is a hard problem; humans take several years to learn how to do it\
    \ despite constant practice, and even then frequently get it wrong. That computers\
    \ can be made to do it at all, even for simplified cases, is nothing short of\
    \ amazing.\n\nThe first step in parsing a string is called “lexing,” as in, determining\
    \ its lexical structure. The input of lexing is a string to analyze. The output\
    \ is a series of tokens, which represent the structure of the string; it validates\
    \ that the string is syntactically valid. A second step turns those tokens into\
    \ an abstract syntax tree that defines meaning; it validates the string is semantically\
    \ valid.\n\nLexing is easier, so let’s focus on that. There are numerous algorithms\
    \ for lexing a string that vary widely in terms of their flexibility, performance,\
    \ and complexity. The specific algorithm we are implementing is loosely based\
    \ on the one used by Go’s `template` package. It is actually an informal state\
    \ machine. The phrase “functional state machine” may seem odd; aren’t state machines\
    \ concerned with tracking state, and functional programming with avoiding state?\
    \ Yes… mostly. In strict functional programming, state is encapsulated in function\
    \ calls rather than a free-floating mutable value. That’s what we saw before in\
    \ the `Writer` monad, and it’s what we are going to implement here.\n\n## The\
    \ Example\n\nSo that we have something to parse, let’s define a Domain Specific\
    \ Language (DSL) for a hypothetical application that allows non-developers (or\
    \ at least non-PHP developers) to create triggers that fire on certain events.\
    \ It won’t be as flexible as writing PHP code, but because it’s more restricted,\
    \ the potential for misuse (deliberate or accidental) is much less. Consider this\
    \ example trigger definition:\n\n```\n1 On object.triggerName\n2 If condition\
    \ OR condition\n3 If condition\n4 Execute someAction\n```\n\nThe first line defines\
    \ the trigger that causes this handler to fire; the “object” and “triggerName”\
    \ could map to entities in our domain model, such as “Product” and “Update,” or\
    \ to some more abstract trigger. It’s followed by zero or more other condition\
    \ lines, each of which starts with `If` and then has some condition. The structure\
    \ of the condition could get complicated, but from our point of view, that’s “just”\
    \ an implementation detail as we’ll see. We’ll also allow conditions to be ORed\
    \ together, and each condition line represents an AND. Finally, there’s one or\
    \ more `Execute` lines that cause some named action to trigger.\n\nWhat does that\
    \ all mean semantically for our application? The lexer doesn’t care; we can simply\
    \ define “someAction” to be a string. Whether that string refers to a function\
    \ name, a string, an injection, or `someAction` is irrelevant.\n\n## General Approach\n\
    \n#### Tokens\n\nWhat does that all mean semantically for our application? The\
    \ lexer doesn’t care; we can simply define “someAction” to be a string. Whether\
    \ that string refers to a function name, a string, an injection, or `someAction`\
    \ is irrelevant.\n\nWe need to define `Token`:\n\n```\n1 class Token\n2 {\n3 \
    \    public string $value;\n4 \n5     public function __construct(string $value\
    \ = '')\n6     {\n7         $this->value = $value;\n8     }\n9 }\n```\n\n####\
    \ States\n\nOur lexer is going to be a state machine. Each state represents an\
    \ expectation of the string. For instance, at the very beginning, we expect the\
    \ string to begin with “On”. If it doesn’t, it’s an error. After that, we expect\
    \ the string to contain a newline.\n\nRather than define the entire graph in advance,\
    \ we can represent each state as a function. Its input is the string, and its\
    \ output is a `Result` containing one or more tokens.\n\n```\n\n class Result\n\
    2 {\n\n string string $remainingremaining\n\n\n array $\n [];\n5\n6     protected\
    \ $nextFunction;\n7 }\n```\n\nEach state function then is a function from a string\
    \ to a `Result`, which contains a string. That likely looks familiar by now; it’s\
    \ a `bind` functor, from `string` to an “enhanced string.”\n\nHowever, having\
    \ a reference to a function in a class seems kind of silly. We are going to have\
    \ a potentially large number of them, one for each state. Besides, classes already\
    \ have a way to reference functions; they’re called methods. So let’s restructure\
    \ our enhanced value like so:\n\n```\n1 abstract class Lexer\n2 {\n3     protected\
    \ string $remaining;\n4 \n5     protected array $tokens = [];\n6 \n7     protected\
    \ function __construct(string $remain, array $tokens)\n8     {\n9         $this->remaining\
    \ = $remain;\n10        $this->tokens = $tokens;\n11     }\n12 \n13     public\
    \ static function of(string $remaining): self\n14     {\n15         return new\
    \ static($remaining, []);\n16     }\n17 \n18     abstract public function lex(string\
    \ $string): Lexer;\n19 }\n```\n\n## Binding\n"
  raw: "One limitation of monad-based flow control is that it is not always easy to\
    \ combine. Stacking two monads on top of each other is difficult to do generically,\
    \ and depending on the language may be syntactically difficult or even impossible.\
    \ However, the underlying concepts of the monads involved, their particular “lift,”\
    \ can be readily combined with one-off solutions that combine both sets of logic.\
    \ For example, stacking our previous Either and Writer monads while still retaining\
    \ both of their behavior is difficult. However, writing a single monad that “lifts”\
    \ values to “Either with a Log” is reasonably straightforward.\n\nTo demonstrate\
    \ how that can be done, let’s take a look at one of the harder problems in software\
    \ engineering: parsing. Turning a string into a meaningful logical structure is\
    \ a hard problem; humans take several years to learn how to do it despite constant\
    \ practice, and even then frequently get it wrong. That computers can be made\
    \ to do it at all, even for simplified cases, is nothing short of amazing.\n\n\
    The first step in parsing a string is called “lexing,” as in, determining its\
    \ lexical structure. The input of lexing is a string to analyze. The output is\
    \ a series of tokens, which represent the structure of the string; it validates\
    \ that the string is syntactically valid. A second step turns those tokens into\
    \ an abstract syntax tree that defines meaning; it validates the string is semantically\
    \ valid.\n\nLexing is easier, so let’s focus on that. There are numerous algorithms\
    \ for lexing a string that vary widely in terms of their flexibility, performance,\
    \ and complexity. The specific algorithm we are implementing is loosely based\
    \ on the one used by Go’s template package. It is actually an informal state machine.\
    \ The phrase “functional state machine” may seem odd; aren’t state machines concerned\
    \ with tracking state, and functional programming with avoiding state? Yes… mostly.\
    \ In strict functional programming, state is encapsulated in function calls rather\
    \ than a free-floating mutable value. That’s what we saw before in the Writer\
    \ monad, and it’s what we are going to implement here.\n\n## The Example\n\nSo\
    \ that we have something to parse, let’s define a Domain Specific Language (DSL)\
    \ for a hypothetical application that allows non-developers (or at least non-PHP\
    \ developers) to create triggers that fire on certain events. It won’t be as flexible\
    \ as writing PHP code, but because it’s more restricted, the potential for misuse\
    \ (deliberate or accidental) is much less. Consider this example trigger definition:\n\
    \n```\n1 On object.triggerName\n2 If condition OR condition\n3 If condition\n\
    4 Execute someAction\n```\n\nThe first line defines the trigger that causes this\
    \ handler to fire; the “object” and “triggerName” could map to entities in our\
    \ domain model, such as “Product” and “Update,” or to some more abstract trigger.\
    \ It’s followed by zero or more other condition lines, each of which starts with\
    \ `If` and then has some condition. The structure of the condition could get complicated,\
    \ but from our point of view, that’s “just” an implementation detail as we’ll\
    \ see. We’ll also allow conditions to be ORed together, and each condition line\
    \ represents an AND. Finally, there’s one or more `Execute` lines that cause some\
    \ named action to trigger.\n\nWhat does that all mean semantically for our application?\
    \ The lexer doesn’t care; we can simply define “someAction” to be a string. Whether\
    \ that string refers to a function name, a class name, an entry in a dependency\
    \ injection container, or some piece of user configuration is irrelevant at this\
    \ level. There are still syntactic decisions we have to make, however. For instance,\
    \ let’s decide that:\n\n*   The literal keywords (`On`, `If`, `Or`, and `Execute`)\
    \ are all case insensitive.\n\n*   `object`, `triggerName`, and `someAction` are\
    \ case sensitive strings.\n\n*   Line breaks are significant, so that each directive\
    \ must be on its own line.\n\n*   Other than that, however, whitespace is not\
    \ significant.\n\n*   Both `\\n` and `\\r\\n` delimited lines are supported.\n\
    \nWe also need to make decisions about the structure of condition, but for the\
    \ sake of brevity, we’re skipping lexing that part in this chapter.\n\nLet’s also\
    \ specify that comments are supported; specifically, a `#` begins a comment, and\
    \ the comment ends at a newline. As a nice side effect, that means comments are\
    \ only supported at the end of a syntactically valid line, or on their own line.\
    \ This makes parsing a bit easier.\n\n## The General Approach\n\n### Tokens\n\n\
    Now that we have our DSL, how can we turn it into a list of tokens? For that matter,\
    \ what is a token?\n\nIdeally, tokens would be alternatives in a coproduct type,\
    \ aka an enumerated list. There are two caveats, however:\n\n1.  PHP doesn’t have\
    \ enumerated lists.\n\n2.  Some tokens have additional metadata they carry, such\
    \ as the value of one of the “string” types like `triggerName` or `someAction`.\n\
    \nWe can approximate enumerated lists with classes, and classes can have properties,\
    \ so that’s how we represent tokens: A class with a single property.\n\n```\n\
    1 class Token\n2 {\n3     public string $value;\n4 \n5     public function __construct(string\
    \ $value = '')\n6     {\n7         $this->value = $value;\n8     }\n9 }\n```\n\
    \nAny arguments against public properties here are entirely valid; a protected\
    \ value with an accessor method would also be acceptable, but as this is largely\
    \ an internal value, it’s less critical. Feel free to take a more restricted approach\
    \ if you prefer.\n\nDistinct tokens are subclasses of `Token`, but do not need\
    \ or have any additional methods or properties.\n\n### States\n\nOur lexer is\
    \ going to be a state machine. Each state represents an expectation of what the\
    \ string following that state is. For instance, at the very beginning of the string,\
    \ we expect the string to begin with “On” (case insensitive). If it doesn’t, that’s\
    \ an error. After that, we expect the input string to contain an alphanumeric\
    \ string that ends in a period. And so on.\n\nRather than define the entire graph\
    \ in advance, we can represent each state as a function. Its input is the remaining\
    \ string to parse, and its output is a product type containing one or more tokens\
    \ that have been processed off of the string, the remaining string, and the next\
    \ processing state; i.e., the next state function that handles the remaining string.\n\
    \nAt first glance, the code looks like this:\n\n```\n1 class Result\n2 {\n3  \
    \   protected string $remaining;\n4 \n5     protected array $tokens = [];\n6 \n\
    7     protected $nextFunction;\n8 }\n```\n\nEach state function then is a function\
    \ from a string to a `Result`, which contains a string. That likely looks familiar\
    \ by now; it’s a `bind` functor, from `string` to an “enhanced string,” where\
    \ the enhancement includes a token array and a reference to a function.\n\nHowever,\
    \ having a reference to a function in a class seems kind of silly. We are going\
    \ to have a potentially large number of them, one for each state. Besides, classes\
    \ already have a way to reference functions; they’re called methods. So let’s\
    \ restructure our enhanced value like so:\n\n```\n 1 abstract class Lexer\n 2\
    \ {\n 3     protected string $remaining;\n 4 \n 5     protected array $tokens\
    \ = [];\n 6 \n 7     protected function __construct(string $remain, array $tokens)\n\
    \ 8     {\n 9         $this->remaining = $remain;\n10         $this->tokens =\
    \ $tokens;\n11     }\n12 \n13     public static function of(string $remaining):\
    \ self\n14     {\n15         return new static($remaining, []);\n16     }\n17\
    \ \n18     abstract public lex(string $string): Lexer;\n19 }\n```\n\nNow it’s\
    \ a fully-fledged monad object, and a product of (`string`, `array`, and `callable`).\
    \ Because the callable `lex()` varies, we’ve made it abstract. Every state is\
    \ a subclass of `Lexer` that implements `lex()` for a given state. Each of those\
    \ subclasses also constitutes an Either. A Lexer is “Either” of the various defined\
    \ states.\n\n## Binding"
