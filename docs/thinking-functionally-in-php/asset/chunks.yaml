  trans: '


    *   Monad 是一种结合二元函数，它接收两个内自函子（endofunctors）并产生一个增强后的值。

    *   Monad 是一种结合二元函数，它接收两个返回“增强”值的函数并产生一个增强值。

    *   Monad 是一个函数，它接收两个返回“增强”值的函数并产生一个增强值。

    *   Monad 是一个允许你组合两个返回“增强”值函数的函数。


    所有这些华丽的词汇都是为了回到那句话：“monad 是一种高级的组合。”因为实际上，一旦回到编程层面，这就是它的全部含义。


    ## 编程中的 Monads


    那么，为什么 Monad 如此臭名昭彰且复杂呢？有几个原因。


    **其一**是因为它们产生了一种其实并不存在的神秘感，这很大程度上归因于它们听起来很奇怪的名字。这也是因为 Haskell 据疑到处都在使用它们，但在 Haskell
    的语法中，没有任何让来自更常见的命令式语言的程序员能够识别出的东西。也就是说，它们之所以闻名的困惑，是因为它们本身以困惑而闻名。


    **其次**，是因为组合是高效函数式编程的核心，而“增强”可以意味着几乎任何东西，所以 monads 极其灵活。或者说，monads 应该被视为一种设计模式（增强变量然后组合作用于这些变量的函数），像任何良好的设计模式一样，它们可能出现在无限的地方。虽然
    monad 有几个非常常见的例子，但 monad 模式出现方式可能完全不像那些常见的例子。


    **第三**，是因为大多数关于它们的教程都写得糟糕透了，它们在直接跳到范畴论之前，会在没有任何循序渐进的情况下，用不必要的类比来混淆问题。我希望这本书已经提供了足够的循序渐进，使得现在所有这些华丽的词汇都变得意义意义。


    **其四**，因为在大多数非函数式语言中，monad 模式的实现看起来与上面的描述完全不同，并且是使用类来实现的。这并不是一种糟糕的方法（我们将在接下来的章节中恰好这样做），但它让典型的示例代码与理论对齐变得困难，因为它们并没有精确地映射。更糟糕的是，每个不同的库或教程都使用一套不同的名词，有些借自范畴论，有些借自
    Haskell，有些则是因为“这样读起来更符合这种特定情况下的实际代码，所以用这个吧”。如果你读三个 monad 教程，你会得到四套术语。


    这就是为什么我们无法拥有的美好的东西。


    在接下来的几个章节中，我们将看到“monad 模式”运行的不同示例。它们有许多共同元素，也有高度特定于该特定用例的元素。


    ## PHP Monad 的剖析


    在实践中，为了实现编程中被称为 monad 模式的东西，有几个活动部分：


    首先，你需要一种方法来提升（lift）或增强一个值。在范畴论的标准中，这被称为 `unit`。在 Haskell 中，它是一个特殊的函数称为 `return`。当然，我们不能在
    PHP 中使用 `return` 作为函数名。在实践中，这几乎总是类的构造函数，因为在 PHP（以及大多数类似的语言）中增强或装饰值的自然方法是将将其放入一个对象中。提供构造函数是常见的（尽管不是绝对必要的）。


    其次，你需要一种方法在增强值上映射（map）一个函数。在范畴论中，这被称为 `fmap`。在 Haskell 中，它是 `fmap`。在 PHP 中，我们可能会将其称为
    `map`。


    第三，你需要一种方法展平（flatten）一个嵌套的 monad。在范畴论中，这被称为 `join`。在 Haskell 中，它是 `join`。在 PHP
    中，我们可能会将其称为 `flatten`。


    第四，你需要一种方法将两个 monads 链在一起。在范畴论中，这被称为 `bind`。在 Haskell 中，它是 `>>=`。在 PHP 中，我们可能会将其称为
    `flatMap`。


    最后，你需要一种方法将一个值提升到 monad 中。在范畴论中，这被称为 `unit`。在 Haskell 中，它是 `return`。在 PHP 中，这通常是构造函数。


