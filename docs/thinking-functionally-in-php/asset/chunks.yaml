  trans: "\n现在我们可以来看 `LexerOn`，它处于刚刚消耗完 “on” 关键字的状态。接下来预期的是发生触发的对象。我们称之为“主体（subject）”。它只是一个字母字母数字的字符串，在我们的\
    \ DSL（领域特定语言）中有好几个。这意味着我们可以继续为另一个抽象状态，用于当下一个预期的值是标识符字符串时：\n\n```php\n 1 abstract\
    \ class LexerIdentifier extends Lexer\n 2 {\n 3     protected string $token;\n\
    \ 4     protected string $nextState;\n 5 \n 6     public function lex($string):\
    \ Lexer\n 7     {\n 8         $string = $this->skipSpaces($string);\n 9 \n10 \
    \        $identifier = $this->readAlphaNumeric($string);\n11 \n12         if ($identifier)\
    \ {\n13             $remain = substr($string, strlen($identifier));\n14      \
    \       $nextState = $this->nextState;\n15             $token = $this->token;\n\
    16             return new $nextState($remain, [new $token($identifier)]);\n17\
    \         }\n18 \n19         return LexerError::create(\n20             $string,\n\
    21             [],\n22             'Expected a valid identifier.'\n23        \
    \ );\n24     }\n25 }\n```\n\n该逻辑应该是不言自明的。它跳过任何空白字符，然后获取一个字母数字字符串并转换为一个 token。然后它返回下一个状态，并加上该\
    \ token。如果没有标识符，它返回一个错误状态。\n\n具体的 “on” 状态就非常简单了：\n\n```php\n1 class LexerOn extends\
    \ LexerIdentifier\n2 {\n3     protected string $token = Subject::class;\n4   \
    \  protected string $nextState = LexerSubject::class;\n5 }\n```\n\n也就是说，消耗一个标识符字符串并转换为\
    \ `Subject` 类的 token，然后转换到 `LexerSubject`。\n\n`LexerSubject` 是刚刚消耗完主体标识符的状态，而下一个值应该是一个点。点是一个字面量（literal），它与关键字非常接近，因此我们将其作为关键字来消耗：\n\
    \n```php\n1 class LexerSubject extends LexerKeyword\n2 {\n3     protected string\
    \ $keyword = '.';\n4     protected string $token = Dot::class;\n5     protected\
    \ string $nextState = LexerTriggerDot::class;\n6 }\n```\n\n点之后是另一个标识符，这次是用于“触发（trigger）”的：\n\
    \n```php\n1 class LexerTriggerDot extends LexerIdentifier\n2 {\n3     protected\
    \ string $token = Trigger::class;\n4     protected string $nextState = LexerEndLine::class;\n\
    5 }\n```\n\n现在我们到了另一个有趣的状态，即行尾状态。对于下一个状态，这里有可能性：\n\n- 它可能是真正的行结束，在这种情况下，我们的下一个状态是下一行的“行首”。\n\
    - 它可能是一个注释，由 `#` 表示。\n- 它可能是待解析字符串的末尾，在这种情况下，我们就完成了。\n\n这些情况中的每一个单独来看都是简单的：\n\n\
    ```php\n 1 class LexerEndLine extends Lexer\n 2 {\n 3     public function lex($string):\
    \ Lexer\n 4     {\n 5         $string = $this->skipSpaces($string);\n 6 \n 7 \
    \        if ($this->startsWith($string, '#')) {\n 8             return new LexerCommentMarker(\n\
    \ 9                 substr($string, 1),\n10                 [new CommentMarker()]\n\
    11             );\n12         }\n13 \n14         if (empty($string)) {\n15   \
