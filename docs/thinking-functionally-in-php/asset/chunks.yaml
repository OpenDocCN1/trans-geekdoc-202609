  trans: "\nPHP 在这种情况下很特殊，因为它的类型系统相对较弱（与 Rust、Haskell 甚至现代 Java 等语言相比），但这些都是可选的。正如我们将看到的，结果是，采用完全函数式的方法在某些情况下会让我们失去一些显式类型能力。我不认为这是一个致命问题，而是将其看作\
    \ PHP 未来应该优先考虑哪些类型的类型系统改进的指示。\n\n在学习过程中，我们会根据需要涵盖一些类型概念，但这本书本质上并不是关于类型系统的书。\n\n\
    ## 预期\n\n本书分为四个部分：\n\n*   在第一部分中，我们将以 PHP 为示例语言，将函数式编程作为一个概念来研究其基本原则。结果在语法上并不总是那么漂亮，但那并不是我们的目标；理解这些原则的价值才是目标，我们将使用具体的\
    \ PHP 示例来深入探索这个“兔子洞”。\n*   在第二部分中，我们将后退一步观察支撑许多函数式编程的理论，特别是范畴论。这并不是一本关于范畴论的书，但对基础的简略理解将极大有助于解释函数式编程和其他形式如何真正能够构建出更健壮的代码。\n\
    *   在第三部分中，我们将理论与实践相结合，演示一些更高级的技术，这些技术使理论具体化并同时产生更健壮的代码。\n*   在第四部分中，我们将后退一步，考虑函数式编程可能的其他蓝图，以及它应该位于你工具箱的什么位置。\n\
    \n# 第一部分\n\n## 纯函数\n\n函数式编程第一个最关键的方面是“纯函数”的概念。是什么让一个函数变成纯的？它是一个真正的函数而不是其他东西。\n\
    \n如果这听起来像循环论证，让我们回退一下。讨论函数式编程面临的主要挑战之一是，软件工程和计算机科学实际上是两个并行演化的独立领域。它们频繁交互，但并不一致。因此，许多概念在软件工程中的名称与它们在计算机科学中不同，而许多其他概念在两个学科中使用的单词相同，但含义不同。因此，为了建立通用的词汇，让我们从最开始开始。\n\
    \n在几乎所有的编程语言中，都有这样一个概念：一段代码块，可以在多个地方反复重用，通常带有细微的变。这种代码块的术语是 `procedure`（过程）或 `sub-routine`（子程序）。过程是任何在语法上可重用的代码块，可以被引用，并可选地传递某些参数或参数。\n\
    \n在数学中，`function`（函数）是一个黑盒，接收输入并可靠地返回输出。它如何做到的并不重要；它可能进行某些计算，也可能有一个巨大的内部查找表。然而，那里的关键术语是“可靠”；相同的输入总是产生相同的输出，这是保证的，除了返回一个值外，宇宙的状态不会发生任何其他变化。两个输入可能导致相同的输出，但相同的输入绝永远、永远不会产生不同的输出。\n\
    \n数学中的函数不是一个发生事件，而是一个定义从某些输入到某些输出映射的 `relationship`（关系）。\n\n在几乎所有现代主流语言中，过程和函数的概念被合并为一个单一概念，被称为“函数”。在\
    \ PHP 术语中，以下两者都是“函数”：\n\n```\n 1 function output(string $message): void\n 2 {\n\
    \ 3     static $n = 1;\n 4     global $preamble;\n 5     echo \"The {$n}th message\
    \ is: {$preamble} {$message}\". PHP_EOL;\n 6     $n++;\n 7 }\n 8 \n 9 function\
    \ add(int $a, int $b): int\n10 {\n11     return $a + $b;\n12 }\n```\n\n两者都是过程；然而，只有第二个是数学家所定义的“函数”。`output()`\
    \ 函数接收了一个隐式输入（一个全局变量），它产生了一个隐式输出（它打印了一条消息），而且如果使用相同的输入调用第二次，它会产生不同的效果（因为通过静态变量保留了内部状态）。所有这些属性都违背了我们对数学意义上“函数”的预期。\n\
    \n当然，现代语言通过随意使用“函数”这一术语来混淆了这些概念。因此，数学中所谓的“函数”，在编程中被称之为“纯函数”。\n\n### 定义“纯”\n\n\
    是什么让一个函数变成纯的？如果一个过程遵循以下两个限制，它就是纯函数：\n\n1.  它是 `idempotent`（幂等的）。也就是说，保证相同的显式输入总是能产生相同的输出。\n\
    2.  它没有副作用。也就是说，除了返回的值被返回外，对任何值或数据流都不会产生影响。\n\n这些规则非常简单且通常很容易实现，但非常强大。通过这样限制自己，我们获得了一许多假设。\n\
    \n1.  纯函数极易进行单元测试。基本上不需要设置，也不需要 mock（打桩）；只需用已知参数调用它，看结果是否是你的预期即可。\n2.  它具有 `referential\
    \ transparency`（引用透明性）。这种高级的说法是，一个函数等同于它的返回值。只要 `add()` 是纯的，那么将所有 `add(5, 5)`\
    \ 实例替换为 `10` 保证不会改变程序的结果。\n3.  因为我们知道相同的输入产生相同的输出，而且因为它具有引用透明性，所以缓存变得轻而易举。缓存本质上是用之前计算过的值替换随后的函数调用。\n\
    4.  反之，由于我们知道相同的输入产生相同的输出并且具有引用透明性，多次调用纯函数可能是浪费的，它不会成为 Bug 的源头。（前提是你是指要调用它的值，而不是函数）。\n\
    \n## 函数组合\n\n另一个重要的属性是，组合纯函数总是产生纯函数，但在纯从中调用不纯函数会使纯函数变得不纯。也就是说：\n\n```\n 1 function\
    \ add(int $a, int $b): int\n 2 {\n 3     return $a + $b;\n 4 }\n 5 \n 6 function\
    \ subtract(int $a, int $b): int\n 7 {\n 8     return $a - $b;\n 9 }\n10 \n 11\
    \ function compute(int $a, int $b, int $c): int\n12 {\n13     return subtract(add($a,\
    \ $b), $c);\n14 }\n15 \n 16 function output(string $message): void\n17 {\n18 \
    \    echo \"The message is: {$message}\". PHP_EOL;\n19 }\n20 \n 21 function run()\n\
    22 {\n23     $val = compute(30, 10, 8);\n24     output(\"The result is: $val\"\
    );\n25 }\n```\n\n`add()` 和 `subtract()` 是纯函数，因为它们遵循了纯函数的两个规则。这意味着 `compute()`\
    \ 也是一个纯函数，因为它遵循相同的规则并且只调用其他纯函数。然而，`output()` 不是纯函数，因为它产生了输出的副作用。`run()` 同时调用了纯函数和不纯函数，因此是不纯的。我们无法对它做出任何这样的假设。\n\
    \n正如我们在下一章中看到的，一旦我们处理高阶函数，这些假设允许我们做更多事情。请期待！\n"
- fmt: "\n### 3. Avoid passing or returning values by reference\nIn practice, there\
    \ are extremely few use cases for that anyway in PHP, as PHP automatically supports\
    \ copy-on-write making passing large, read-only parameters very memory efficient.\
    \ This becomes a bit trickier when passing around objects, but there are ways\
    \ to handle that which we will see later.\n\n### 4. If you need to do IO (read\
    \ from a database, print to a screen, make an HTTP request, etc.), have a function\
    \ (procedure) that does just that and nothing else, and returns its value. That\
    \ function is impure, as is its caller, but other functions called by its caller\
    \ need not be.\n\nFor example, this function reads a value from a database and\
    \ then does some processing on it:\n\n```\n 1 function get_user(Connection $db,\
    \ int $id): array\n 2 {\n 3     $result = $db->query(\"SELECT * FROM users WHERE\
    \ uid=:uid\", [':uid' => $id]);\n 4     $row = $result->fetchRow();\n 5 \n 6 \
    \    if ($row == 'false') {\n 7         return [];\n 8     }\n 9     if ($row['expired']\
    \ == 1) {\n 10       return [];\n 11     }\n 12 \n 13     return $row;\n 14 }\n\
    ```\n\nWhereas a more robust approach would split the non-fetch functionality\
    \ off to its own routine:\n\n```\n 1 function fetch_user(Connection $db, int $id):\
    \ array\n 2 {\n 3     $result = $db->query(\"SELECT * FROM users WHERE uid=:uid\"\
    , [':uid' => $id]);\n 4     return $result->fetchRow();\n 5 }\n 6 \n 7 function\
    \ validate_result($row): bool {\n 8     if ($row == false) {\n 9         return\
    \ false;\n 10     }\n 11     if ($row['expired'] == 1) {\n 12       return false;\n\
    \ 13     }\n 14     return true;\n 15 }\n 16 \n 17 function get_user(int $id)\n\
    \ 18 {\n 19     // ...\n 20     $user = fetch_user($db, $id);\n 21     if (validate_result($user))\
    \ {\n 22       return $user;\n 23     }\n 24     else {\n 25         // Some kind\
    \ of error handling.\n 26     }\n 27 }\n```\n\n`validate_result()` is now a pure\
    \ function, and thus far more predictable and easier to test. \n\nBecause most\
    \ of functional programming is based on pure functions, for the rest of this book,\
    \ whenever we talk about “functions” assume we mean pure functions unless explicitly\
    \ stated otherwise.\n\n## Binary Functions\n\nA particular subset of functions\
    \ are *binary functions*. Binary functions are functions which take two parameters\
    \ of the same type and return an item of that type. That is, the following is\
    \ a binary function:\n\n```\n1 function multiply(int $a, int $b): int\n2 {\n3\
    \     return $a * $b;\n4 }\n```\n\nBut this is not, because it does not return\
    \ the same type:\n\n```\n1 function greater_than(int $a, int $b): bool\n2 {\n\
    3     return $a > $b;\n4 }\n```\n\nSo far, that’s not all that interesting. However,\
    \ there’s another subset of binary functions that are; specifically, binary functions\
    \ can be *associative* and have an *identity element*.\n\nA binary function is\
    \ associative if the order of grouping doesn’t matter when chaining multiple calls\
    \ together. Let’s look at multiplication again, this time with more traditional\
    \ syntax.\n\n```\n1 $a * $b * $c * $d\n```\n\nMultiplying `$a` by `$b`, then by\
    \ `$c`, then by `$d` produces the same result as multiplying `$a` by `$b`, `$c`\
    \ by `$d`, and then those results together. Or, more visually:\n\n```\n1 $a *\
    \ $b * $c * $d == ($a * $b) * ($c * $d)\n```\n\nAn identity element is also known\
    \ as a neutral element and is essentially the “no op” value. For multiplication\
    \ over integers, the no-op value is 1. That is:\n\n```\n1 $a * 1 == $a\n```\n\n\
    For every possible integer value of `$a`.\n\nIt turns out this combination of\
    \ properties is rather useful in general. So useful that it has a fancy name:\
    \ a *monoid*.\n\nA “monoid” refers to a function that:\n\n* Is pure\n* Is a binary\
    \ function (takes two parameters and returns one value, all of the same type)\n\
    * Is associative\n* Has an identity value\n\nMore formally, we can say that multiplication\
    \ is a monoid over integers. Stated more precisely, there is a monoid `<ℤ, multiply,\
    \ 1>`: a set of values (integers), a binary operation (`multiply`), and an identity\
    \ value (1). Multiplication may or or not be a monoid over other types of values,\
    \ and for some types of values (e.g., turnips, employees, or shopping carts),\
    \ it doesn’t even make sense.\n\nWhile multiplication is fairly basic, the concept\
    \ of a monoid applies to all sorts of types and operations. Consider list concatenation,\
    \ for instance:\n\n```\n1 function concat(array $a, array $b): array {}\n```\n\
    \nIs that a monoid? Let’s check the rules:\n\n* Is it pure? Check.\n* Is it binary?\
    \ Check.\n* Is there an identity value? Yes, an empty list.\n* Is it associative?\n\
    \n### First Class Functions\n\nThe second core attribute of functional programming\
    \ is actually two related concepts: *first-class functions* and *higher-order\
    \ functions*. In practice, a first-class function is a function that can be assigned\
    \ to a variable and passed around like any other. A higher-order function is a\
    \ function that either takes a function as a parameter or returns a function.\n\
    \n### Anonymous Functions\n\nPHP has had first-class functions for decades, as\
    \ you can specify a function as a “callable” string. Since 5.3, however, PHP has\
    \ supported anonymous functions that can be passed around. They are implemented\
    \ as objects under the hood, but the net result is “close enough for government\
    \ work” to say PHP supports anonymous functions.\n\nThe basic anonymous function\
    \ looks like this:\n\n```\n1 $factor = 6;\n2 $multiply = function(int $a) use\
    \ ($factor): int {\n3     return $a * $factor;\n4 };\n5 print $multiply(9); //\
    \ Prints 54\n```\n\nThe variable `$multiply` is a function, just as the variable\
    \ `$factor` is an integer. Specifically, it is a function that takes a single\
    \ integer parameter and returns an integer. It also has that odd `use` clause\
    \ in it. The `use` clause tells the function it can access `$factor` variable,\
    \ even after it has gone out of scope. The function has an extra handle on it\
    \ that keeps that variable existing as long as `$multiply` exists, even if `$multiply`\
    \ gets passed to some other function later. In computer science parlance, `$multiply`\
    \ “closes over” `$factor`, that is, it is a *closure*. Strictly speaking, a closure\
    \ is the process of a function incorporating part of its context into itself,\
    \ but in common practice, “closure” and “anonymous function” get used more less\
    \ interchangeably (rightly or wrongly).\n\nThe more formal name for an anonymous\
    \ function is a *lambda*. The name comes from “Lambda calculus”, which got its\
    \ name because Alonzo Church, the inventor of it, got tired of writing the word\
    \ “function” and so started using the greek letter lambda instead.\n\nBy default,\
    \ all closures in PHP are by value—changing `$factor` after `$multiply` is created\
    \ doesn’t change `$multiply`.\n\n```\n1 $factor = 6;\n2 $multiply = function(int\
    \ $a) use ($factor): int {\n3     return $a * $factor;\n4 };\n5 $factor = 5\n\
    6 print $multiply(9); // Still prints 54\n```\n"
