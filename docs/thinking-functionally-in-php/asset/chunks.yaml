    \ 11]))\n```\n\nYep, it is. Both give the same result, `[1, 3, 5, 7, 9, 11]`.\
    \ For now we’ll go with that intuition and conclude it is associative (spoiler\
    \ alert: It really is.), so we can conclude concatenation is a monoid over lists;\
    \ or, more formally, **<lists, concat, \\[\\]>** is a monoid.\n\nThis concept\
    \ will become more important later when we discuss value objects.\n\n# First Class\
    \ Functions\n\nThe second core attribute of functional programming is actually\
    \ two closely related concepts: *first-class functions* and *higher-order functions*.\
    \ In practice, the one tends to imply the other in almost any modern language,\
