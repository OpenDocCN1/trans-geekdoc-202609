- fmt: "\nLet’s look at the case of validating input. Say a user is signing up for\
    \ an account, and we want to validate that the username is allowed. For it to\
    \ be legal, it has to be:\n\n* Not already in use\n* Start with a letter\n* Be\
    \ at least three characters long\n* Not contain non-alphanumeric characters\n\n\
    Ignore for a moment whether or not this is a good set of criteria; it gives us\
    \ something to work with.\n\nWe want to have either a value or error message back\
    \ at the end.\n\n## The Category Theory Solution\n\nThat one of the possible values\
    \ is an error is incidental. From a category theory perspective, what we’re looking\
    \ at is taking two types and `OR`-ing them together, that is, taking the coproduct.\
    \ Our `Either` type is one of two possibilities, usually denoted `Left` and `Right`\
    \ to be extra generic. `Left` and `Right`, in turn, are parameterized by some\
    \ other value.\n\nThat is, we’re lifting the type `Int` to `Int Or This Other\
    \ Thing`, where “this other thing” in our example is an error. Or more abstractly,\
    \ if `Optional` is lifting to “type or `null`”, `Either` is lifting to “this type\
    \ or that type.”\n\n## The Programming Solution\n\nIn the most minimalist sense,\
    \ `Either` looks a lot like the `Optional` structure from the last chapter. In\
    \ fact, the version of `Optional` that had a separate `Some` and `None` subclass\
    \ is an `Either`. It’s “either” a desired value or `null`, where the handling\
    \ for the `null` pathway is “just keep doing nothing forever.”\n\nDifferent use\
    \ cases of the `Either` pattern have different logic in the `Left` and `Right`\
    \ pathways. In the simple case of exception-esque error handling, the `Left` pathway\
    \ is essentially the same as the `None` pathway from before, but other cases might\
    \ look entirely different. (Remember, monads are *design patterns*, not precise\
    \ naming from an ivory tower.) To emphasize that this is just a specific implementation\
    \ of the `Either` pattern (and because as a lefty I am offended by the idea that\
    \ Left is the “unhappy path”), we’ll use a more purpose-built set of names.\n\n\
    We’ll implement `Either` in multiple ways, just to show that there’s no one true\
    \ way. First let’s mimic the `Optional` approach, as it is the more generic.\n\
    \nWe first need to establish our data wrappers. Specifically, we have two paths:\
    \ Success and Failure. Both are legitimate Results from our input validators.\
    \ Let’s use exactly those terms:\n\n```\n 1 abstract class Result\n 2 {\n 3  \
    \   protected $value;\n 4 \n 5     public function __construct($value)\n 6   \
    \  {\n 7         $this->value = $value;\n 8     }\n 9 \n10     public function\
    \ value()\n 11     {\n 12         return $this->value;\n 13     }\n 14 \n 15 \
    \    public static function of($value): self\n 16     {\n 17         return new\
    \ static($value);\n 18     }\n 19 \n 20     abstract public function bind(callable\
    \ $fn);\n 21 }\n 22 \n 23 class Success extends Result\n 24 {\n 25     public\
    \ function bind(callable $fn)\n 26     {\n 27         return $fn($this->value);\n\
    \ 28     }\n 29 }\n 30 \n 31 class Failure extends Result\n 32 {\n 33     public\
    \ function bind(callable $fn)\n 34     {\n 35         return $this;\n 36     }\n\
    \ 37 }\n```\n\n`Success` wraps our happy path and carries a value from one validation\
    \ step to the next. `Failure` wraps the unhappy path and carries the error that\
    \ was returned by a validation step. Each has their own version of `bind`, which\
    \ handles control flow. The value being carried for the Success path is the input\
    \ string being validated. The value being carried for the Failure path is some\
    \ kind of error message; rather than making that another string, let’s make a\
    \ custom type for that:\n\n```\n 1 class ValidationError\n 2 {\n 3     private\
    \ $message;\n 4 \n 5     public function __construct(string $message)\n 6    \
    \ {\n 7         $this->message = $message;\n 8     }\n 9 \n10     public function\
    \ getMessage(): string\n 11     {\n 12         return $this->message;\n 13   \
    \  }\n 14 }\n```\n\nNow we can write our validation routines:\n\n```\n 1 function\
    \ lengthCheck(string $s): Result\n 2 {\n 3     return strlen($s) >= 3\n 4    \
    \     ? Success::of($s)\n 5         : Failure::of(new ValidationError('String\
    \ too short'));\n 6 }\n 7 \n 8 function existsCheck(string $s): Result\n 9 {\n\
    10     return in_array($s, ['aaa', 'bbb', 'ccc'])\n 11         ? Failure::of(new\
    \ ValidationError('Username in use'))\n 12         : Success::of($s);\n 13 }\n\
    \ 14 \n 15 function characterCheck(string $regex, string $s): Result\n 16 {\n\
    \ 17     return preg_match($regex, $s)\n 18         ? Success::of($s)\n 19   \
    \      : Failure::of(new ValidationError('Invalid characters found'));\n 20 }\n\
    \ 22 \n 23 function startsWithLetter(string $s): Result\n 24 {\n 25     return\
    \ ctype_alpha($s[0])\n 26         ? Success::of($s)\n 27         : Failure::of(new\
    \ ValidationError('Must start with a letter'));\n 28 }\n```\n\nNote that most\
    \ of them are just free-standing functions that take a string and return a `Result`,\
    \ which is “either” a `Success` or `Failure`. There’s one that’s slightly different;\
    \ `characterCheck` takes a regex and a string to test. I did that mostly to show\
    \ it’s simple to still use that function in our pipeline.\n\nWe can now build\
    \ an `Either` pipeline to validate a username:\n\n```\n1 $result = Success::of('abc123')\n\
    2     ->bind('lengthCheck')\n3     ->bind('existsCheck')\n4     ->bind(fn(string\
    \ $s): Result => characterCheck('/^[a-zA-Z0-9]*$/', $s))\n5     ->bind('startsWithLetter');\n\
    ```\n\nNote here that we’re inlining the `characterCheck` call with a regex to\
    \ filter on that limits the values to alphanumeric characters. It could just as\
    \ easily be done as a single “isAlpha” function.\n\nEither way (pun intended),\
    \ we now have a `$result` that is a `Success` or `Failure`. There are a few ways\
    \ we can handle it. One is to type check it with `instanceof` and either continue\
    \ or display the error message.\n\nAlternatively, we could add an `either()` method\
    \ to `Result` that takes two callables, one that only runs on Success and one\
    \ that runs on Failure. Each class’s implementation would simply run one and ignore\
    \ the other.\n\nAs another option, we could offer separate `success()` and `failure()`\
    \ method that takes a callable, runs on the appropriate class, and is a no-op\
    \ on the other.\n\n### Railway Programming\n\nThis style of flow control via `Either`\
    \ is sometimes called “railway programming,” a term coined by Scott Wlaschin to\
    \ discuss how to handle errors in F#. The metaphor is that you have two train\
    \ “rail lines,” and can “switch” from the happy track to the unhappy track but\
    \ not back again.\n\nIt takes a bit less typing in F# due to its stronger type\
    \ system, but the concept is largely the same as shown here. I highly recommend\
    \ watching the video and slides he has on his website on railway programming:\
    \ [https://fsharpfunandprofit.com/rop/](https://fsharpfunandprofit.com/rop/).\n\
    \n### More Pathways\n\nThere’s a lot more we can do with this path. For instance,\
    \ suppose we want to insist that all usernames are lowercase to avoid confusion\
    \ between users “Larry” and “larry.” We could add another validator, or we could\
    \ just lowercase them ourselves and be done with it. The latter case doesn’t have\
    \ an error condition, however. Does that matter?\n\nNot really. PHP already has\
    \ a function that forces a string to lowercase: `strtolower`. We just need to\
    \ convert it to work in our `Result` world. Fortunately, we’ve already discussed\
    \ how to “lift” a function from `string` to `string` into a function from wrapped\
    \ string to wrapped string: `fmap`. But since we want to go ahead and call it\
    \ immediately, we want the `map` variant. `map` in this case is fairly simple\
    \ since we don’t need to worry about changing tracks:\n```\n"
  raw: "Let’s look at the case of validating input. Say a user is signing up for an\
    \ account, and we want to validate that the username is allowed. For it to be\
    \ legal, it has to be:\n\n*   Not already in use\n\n*   Start with a letter\n\n\
    *   Be at least three characters long\n\n*   Not contain non-alphanumeric characters\n\
    \nIgnore for a moment whether or not this is a good set of criteria; it gives\
    \ us something to work with.\n\nWe want to have either a value or error message\
    \ back at the end.\n\n## The Category Theory Solution\n\nThat one of the possible\
    \ values is an error is incidental. From a category theory perspective, what we’re\
    \ looking at is taking two types and `OR`-ing them together, that is, taking the\
    \ coproduct. Our `Either` type is one of two possibilities, usually denoted `Left`\
    \ and `Right` to be extra generic. `Left` and `Right`, in turn, are parameterized\
    \ by some other value.\n\nThat is, we’re lifting the type `Int` to `Int Or This\
    \ Other Thing`, where “this other thing” in our example is an error. Or more abstractly,\
    \ if `Optional` is lifting to “type or `null`”, `Either` is lifting to “this type\
    \ or that type.”\n\n## The Programming Solution\n\nIn the most minimalist sense,\
    \ `Either` looks a lot like the `Optional` structure from the last chapter. In\
    \ fact, the version of `Optional` that had a separate `Some` and `None` subclass\
    \ is an `Either`. It’s “either” a desired value or `null`, where the handling\
    \ for the `null` pathway is “just keep doing nothing forever.”\n\nDifferent use\
    \ cases of the `Either` pattern have different logic in the `Left` and `Right`\
    \ pathways. In the simple case of exception-esque error handling, the `Left` pathway\
    \ is essentially the same as the `None` pathway from before, but other cases might\
    \ look entirely different. (Remember, monads are *design patterns*, not precise\
    \ naming from an ivory tower.) To emphasize that this is just a specific implementation\
    \ of the `Either` pattern (and because as a lefty I am offended by the idea that\
    \ Left is the “unhappy path”), we’ll use a more purpose-built set of names.\n\n\
    We’ll implement `Either` in multiple ways, just to show that there’s no one true\
    \ way. First let’s mimic the `Optional` approach, as it is the more generic.\n\
    \nWe first need to establish our data wrappers. Specifically, we have two paths:\
    \ Success and Failure. Both are legitimate Results from our input validators.\
    \ Let’s use exactly those terms:\n\n```\n 1 abstract class Result\n 2 {\n 3  \
    \   protected $value;\n 4 \n 5     public function __construct($value)\n 6   \
    \  {\n 7         $this->value = $value;\n 8     }\n 9 \n10     public function\
    \ value()\n11     {\n12         return $this->value;\n13     }\n14 \n15     public\
    \ static function of($value): self\n16     {\n17         return new static($value);\n\
    18     }\n19 \n20     abstract public function bind(callable $fn);\n21 }\n22 \n\
    23 class Success extends Result\n24 {\n25     public function bind(callable $fn)\n\
    26     {\n27         return $fn($this->value);\n28     }\n29 }\n30 \n31 class\
    \ Failure extends Result\n32 {\n33     public function bind(callable $fn)\n34\
    \     {\n35         return $this;\n36     }\n37 }\n```\n\n`Success` wraps our\
    \ happy path and carries a value from one validation step to the next. `Failure`\
    \ wraps the unhappy path and carries the error that was returned by a validation\
    \ step. Each has their own version of `bind`, which handles control flow. The\
    \ value being carried for the Success path is the input string being validated.\
    \ The value being carried for the Failure path is some kind of error message;\
    \ rather than making that another string, let’s make a custom type for that:\n\
    \n```\n 1 class ValidationError\n 2 {\n 3     private $message;\n 4 \n 5     public\
    \ function __construct(string $message)\n 6     {\n 7         $this->message =\
    \ $message;\n 8     }\n 9 \n10     public function getMessage(): string\n11  \
    \   {\n12         return $this->message;\n13     }\n14 }\n```\n\nNow we can write\
    \ our validation routines:\n\n```\n 1 function lengthCheck(string $s): Result\n\
    \ 2 {\n 3     return strlen($s) >= 3\n 4         ? Success::of($s)\n 5       \
    \  : Failure::of(new ValidationError('String too short'));\n 6 }\n 7 \n 8 function\
    \ existsCheck(string $s): Result\n 9 {\n10     return in_array($s, ['aaa', 'bbb',\
    \ 'ccc'])\n11         ? Failure::of(new ValidationError('Username in use'))\n\
    12         : Success::of($s);\n13 }\n14 \n15 function characterCheck(string $regex,\
    \ string $s): Result\n16 {\n17     return preg_match($regex, $s)\n18         ?\
    \ Success::of($s)\n19         : Failure::of(new ValidationError('Invalid characters\
    \ found'));\n20 }\n21 \n22 function startsWithLetter(string $s): Result\n23 {\n\
    24     return ctype_alpha($s[0])\n25         ? Success::of($s)\n26         : Failure::of(new\
    \ ValidationError('Must start with a letter'));\n27 }\n```\n\nNote that most of\
    \ them are just free-standing functions that take a string and return a `Result`,\
    \ which is “either” a `Success` or `Failure`. There’s one that’s slightly different;\
    \ `characterCheck` takes a regex and a string to test. I did that mostly to show\
    \ it’s simple to still use that function in our pipeline.\n\nWe can now build\
    \ an `Either` pipeline to validate a username:\n\n```\n1 $result = Success::of('abc123')\n\
    2     ->bind('lengthCheck')\n3     ->bind('existsCheck')\n4     ->bind(fn(string\
    \ $s): Result => characterCheck('/^[a-zA-Z0-9]*$/', $s))\n5     ->bind('startsWithLetter');\n\
    ```\n\nNote here that we’re inlining the `characterCheck` call with a regex to\
    \ filter on that limits the values to alphanumeric characters. It could just as\
    \ easily be done as a single “isAlphaNumeric” function if we wanted. However,\
    \ then the function name would have to change if we decide to allow underscores\
    \ in usernames, or if we decide to be polite to users from Ireland (whose names\
    \ often have apostrophes), or to users from non-English speaking countries. There\
    \ are many ways to skin this cat that aren’t related to functional programming\
    \ per se, so take your pick.\n\nEither way (pun intended), we now have a `$result`\
    \ that is a `Success` or `Failure`. There are a few ways we can handle it. One\
    \ is to type check it with `instanceof` and either continue or display the enclosed\
    \ error message.\n\nAlternatively, we could add an `either()` method to `Result`\
    \ that takes two callables, one that only runs on Success and one that runs only\
    \ on Failure. Each class’s implementation would simply run one callable and ignore\
    \ the other.\n\nAs another option, we could offer a separate `success()` and `failure()`\
    \ method that takes a callable, runs on the appropriate class, and is a no-op\
    \ on the other one.\n\n### Railway Programming\n\nThis style of flow control via\
    \ `Either` is sometimes called “railway oriented programming,” a term coined by\
    \ Scott Wlaschin to discuss how to handle errors in F#. The metaphor is that you\
    \ have two train “rail lines,” and can “switch” from the happy track to the unhappy\
    \ track but not back again.\n\nIt takes a bit less typing in F# due to its stronger\
    \ type system, but the concept is largely the same as shown here. I highly recommend\
    \ watching the video and slides he has on his website on railway oriented programming:\
    \ [https://fsharpforfunandprofit.com/rop/](https://fsharpforfunandprofit.com/rop/).\n\
    \n### More Pathways\n\nThere’s a lot more we can do with this path. For instance,\
    \ suppose we want to insist that all usernames are lowercase to avoid confusion\
    \ between users “Larry” and “larry.” We could add another validator, or we could\
    \ just lowercase them ourselves and be done with it. The latter case doesn’t have\
    \ an error condition, however. Does that matter?\n\nNot really. PHP already has\
    \ a function that forces a string to lowercase: `strtolower`. We just need to\
    \ convert it to work in our `Result` world. Fortunately, we’ve already discussed\
    \ how to “lift” a function from `string` to `string` into a function from wrapped\
    \ string to wrapped string: `fmap`. But since we want to go ahead and call it\
    \ immediately, we want the `map` variant. `map` in this case is fairly simple\
    \ since we don’t need to worry about changing tracks:"
