  raw: "If we look at ℤ from one angle, it’s a set. If we look at it from another\
    \ angle, it’s a category. It is both. We can use whichever perspective is most\
    \ convenient for us at any given time. The same is true for ℝ. That means we can\
    \ view `floor` as a functor from ℝ to ℤ. It applies for all values in ℝ (it’s\
    \ a total function), and the ordering relationship is preserved.\n\nAs we can\
    \ have morphisms from an object to itself, we can have functors that point back\
    \ to their original category. For example, `squared` is a mapping from ℝ to ℝ.\
    \ The domain and codomain are the same, although it will only map to positive\
    \ values; that’s entirely fine, as long as it works for all inputs.\n\nFunctors\
    \ that map from a category to itself are called *endofunctors*, which is a weird\
    \ amalgam of Greek and Latin for “within the same category function doer thingie.”\
    \ (It really does sound more impressive in Greek.)\n\n## Isomorphism\n\nAnother\
    \ important concept in category theory is equality. Equality is tricky at best\
    \ in programming; 1 == 1, but does one product object “equal” another product\
    \ object? What matters: their ID in the database, all of their internal properties,\
    \ or their memory location? As usual, the unhelpful answer is “it depends.”\n\n\
    Category theory has the same problem. However, there is a specific flavor of equality\
    \ that is especially useful. If you have an object `A` with an arrow to `B`, and\
    \ another arrow from `B` back to `A`, then those morphisms are inverses of each\
    \ other. It’s always possible to transition from one to another and back again.\
    \ Those two objects are then said to be “equal up to isomorphism,” or simply *isomorphic*:\
    \ in Greek, “equal form thingies.”\n\n![An isomorphism from A to B and back again](resources/isomorphism.png)\n\
    \nAn isomorphism from A to B and back again\n\nObjects can be isomorphic, but\
    \ so can entire structures of objects if they are fully parallel; they are not\
    \ equal in the arithmetic sense, but if two objects or structures are isomorphic,\
    \ it means in practice that one can be represented in terms of the other. Or,\
    \ in programming speak, if two structures are isomorphic, then it’s completely\
    \ safe to *refactor* code from one to another. The performance implications may\
    \ be entirely different between two different structures, at an implementation\
    \ level; that is actually a really good justification for converting code from\
    \ one approach to another if you can guarantee the two approaches are isomorphic.\n\
    \n## Monoids\n\nA few chapters back, we discussed a special case of functions\
    \ called “monoids.” To refresh, a “monoid” refers to a function that:\n\n*   Is\
    \ pure\n\n*   Is a binary function (takes two parameters and returns one value,\
    \ all of the same type)\n\n*   Is associative\n\n*   Has an identity value\n\n\
    That should look very familiar at this point. The idea of associativity and an\
    \ identity is pervasive in category theory, as it is what allows us to compose\
    \ almost anything as long as the types are compatible; that is, the codomain of\
    \ one morphism is the domain of the next. A monoid isn’t quite a morphism yet,\
    \ though, because morphisms are unary functions.\n\nHowever! Recall also that\
    \ any multi-parameter function can be converted to a single parameter function;\
    \ a process called “currying.” Consider a category with only a single object.\
    \ Every monoid is a binary function that has been curried on that object. For\
    \ example, in the category whose only object is the set of integers, ℤ, there\
    \ is a monoid “add 1” from ℤ to ℤ, another monoid “add 5” from ℤ to ℤ, another\
    \ monoid “add 397,” and so forth. There are an infinite number of morphisms from\
    \ ℤ to ℤ because there are an infinite number of values of ℤ. There is even an\
    \ identity morphism over addition, “add 0.”\n\nA monoidal category, also sometimes\
    \ called a monoid, is:\n\n*   a single object category\n\n*   where all the morphisms\
    \ therefore necessarily point back to the same object (they are “endomorphisms”)\n\
    \n*   and one of them is the identity morphism\n\n![A monoid category “A”](resources/monoid.png)\n\
    \nA monoid category “A”\n\nThat is, in fact, where the name “monoid” comes from.\
    \ “Mono” meaning “one” or “single,” it roughly translates as “single thingie”;\
    \ a single category object. All of its morphisms are, in essence, curried functions\
    \ on itself.\n\nOr, programmatically:\n\n```\n 1 function add(int $x, int $y):\
    \ int\n 2 {\n 3     return $x + $y;\n 4 }\n 5 ==\n 6 function add(int $x): int\n\
    \ 7 {\n 8     return fn(int $y): int => $x + $y;\n 9 }\n10 \n11 $add5 = add(5);\n\
    ```\n\nOne could even say that those two add definitions are isomorphic.\n\n#\
    \ Categories in Code\n\nAll of that arithmetic is well and good, but how does\
    \ that help us with code? For a more applicable example, let’s define a category\
    \ consisting of all of the data types supported by a functional (or functional-enough-for-our-purposes)\
    \ language. In PHP, that would include:\n\n*   `int`\n\n*   `float`\n\n*   `bool`\n\
    \n*   `string`\n\n*   `array`\n\n*   `object`\n\n*   `resource`\n\n*   `callable`\n\
    \n`resource` is boring and weird, so we are going to ignore it. We could view\
    \ the remaining types in a few different ways:\n\n1.  As sets, each of which has\
    \ either a finite (`bool`) or infinite (`string`) number of values.\n\n2.  A bunch\
    \ of discrete categories, one for each type.\n\n3.  A category of sets, where\
    \ each object is the set of a given type.\n\nThe third way is the most interesting\
    \ perspective, so let’s use that. Let’s call this category **PHPType**.\n\nWhat\
    \ morphisms exist in our category **PHPType**? Technically an infinite number\
    \ could, but here are some interesting examples:\n\n*   We already saw `floor()`\
    \ and `ceil()`, which are morphisms from `float` to `int`.\n\n*   There’s an implicit\
    \ morphism “truthiness” from `int` to `bool`; 0 maps to `false`, anything else\
    \ maps to `true`.\n\n*   `float` and `string` have their own “truthiness” morphism\
    \ to `bool`.\n\n*   There is an implicit “cast” morphism from `int` to float that\
    \ can be invoked automatically except with extremely large values. (That’s why\
    \ PHP’s strict mode can safely accept an `int` to a `float` parameter.)\n\n* \
    \  `strlen()` is a morphism from `string` to `int`.\n\n*   `count()` is a morphism\
    \ from `array` to `int`.\n\n*   The function “string concatenate,” which in PHP\
    \ has a dedicated operator `.`, is an endomorphism from `string` to `string`.\n\
    \n*   The random utility function `soundex()` converts a string into a soundex\
    \ key, which is itself a string. That makes it an endomorphism from `string` to\
    \ `string`.\n\n*   The language construct `array()` (or simply `[]` in most code\
    \ today) is a morphism from `int` to `array`; `[5]` takes the `int` value 5 and\
    \ maps it to a single-element array. There is a parallel morphism for every other\
    \ type to `array`, using the same syntax.\n\n*   The magic method `__toString()`\
    \ lets you define a morphism from a certain object to a string.\n\nAn awful lot\
    \ of functions you’re used to working with are morphisms or endomorphisms… but\
    \ not all of them. They’re only a morphism if they are composable unary total\
    \ pure functions: single parameter, work for any input of the source type, are\
    \ idempotent, and can be safely composed.\n\n![The PHPType category, visually](resources/php-type.png)\n\
    \nThe PHPType category, visually\n\nIn a strictly functional language, all functions\
    \ are morphisms. In PHP, it’s on us to make sure we only write morphism functions\
    \ most of the time.\n\n## Converting Structure\n\nThe types of a given language\
    \ form a category, in our case **PHPType**. However, there are other kinds of\
    \ categories in programming we can conceptualize. For instance, let’s consider\
    \ a category called **\\[PHPType\\]**, whose objects are lists (arrays) of **PHPType**\
    \ objects.\n\nNote: For all of this to work, we’re talking about typed true-arrays:\
    \ indexed, non-associative arrays where all values are of the same type. If that’s\
    \ not the case, then all bets are off. That is, incidentally, why you always want\
    \ that to be the case."
