  trans: "\n\n基于 monad 的流程控制有一个局限性，就是它并不总是容易组合。将两个 monad 堆叠在一起在泛型上是很困难的，取决于语言，在语法上可能很困难甚至不可能。然而，所涉及\
    \ monad 的底层概念，即它们特定的“提升”（lift），可以很容易地与结合两组逻辑的一次性解决方案相结合。例如，将之前的 `Either` 和 `Writer`\
    \ monad 堆叠并保留两者的行为是困难的。但是，编写一个将值“提升”到“带日志的 Either”的单 monad 是相当直接的。\n\n为了演示如何做到这一点，让我们来看软件工程中较困难的问题之一：解析（parsing）。将字符串转换为有意义的逻辑结构是一个困难的问题；人类即使不断练习，也需要数年时间学习如何这样做，而且即使如此经常出错。计算机竟然能做到这一点，即使是针对简化情况，也是令人惊叹的。\n\
    \n解析字符串的第一步被称为“词法分析”（lexing），即确定其词法结构。词法分析的输入是要分析的字符串。输出是一系列标记（tokens），它们代表字符串的结构；它验证了字符串在语法上是有效的。第二步是将这些标记转换为定义意义的抽象语法树；它验证了字符串在语义上是有效的。\n\
    \n词法分析较简单，所以让我们关注这一点。有很多用于字符串词法分析的算法，它们在灵活性、性能和复杂性方面差异很大。我们正在实现的特定算法大致基于 Go 的\
    \ `template` 包中使用的那种算法。它实际上是一个非正式的状态机。“函数式状态机”这个短语听起来可能奇怪；状态机不是负责跟踪状态的，而函数式编程不是避免状态的吗？是的……大部分情况下如此。在严格的函数式编程中，状态被封装在函数调用中，而不是一个自由浮浮的可变值。这就是我们之前在\
    \ `Writer` monad 中看到的，也是我们在这里要实现的。\n\n## 示例\n\n为了让我们有东西可以解析，让我们为一个假设的应用程序定义一个领域特定语言（DSL），该语言允许非开发者（或至少是非\
    \ PHP 开发者）创建在特定事件上触发的触发器。它不会像编写 PHP 代码那样灵活，但因为它的限制更多，误用（故意或无意）的可能性要少得多。考虑这个触发器定义示例：\n\
    \n```\n1 On object.triggerName\n2 If condition OR condition\n3 If condition\n\
    4 Execute someAction\n```\n\n第一行定义了导致此处理程序触发的触发器；“object”和“triggerName”可以映射到我们领域模型中的实体，例如“Product”和“Update”，或者某些更抽象的触发器。其后面是零或多个其他条件行，每行都以\
    \ `If` 开头，然后是一个条件。条件的结构可能会变得复杂，但从我们的角度来看，这“仅仅”是一个实现细节，正如我们将看到的。。我们还允许条件通过 OR 组合在一起，并且每个条件行代表一个\
    \ AND。最后，有一个或多个 `Execute` 行，会导致某个命名的动作被触发。\n\n这些对于我们的应用程序在语义上意味着什么？词法分析器并不关心；我们可以简单地定义“someAction”为一个字符串。该字符串是指函数名、字符串、注入还是\
    \ `someAction` 并不无关。\n\n## 通用方法\n\n#### 标记 (Tokens)\n\n这些对于我们的应用程序在语义上意味着什么？词法分析器并不关心；我们可以简单地定义“someAction”为一个字符串。该字符串是指函数名、字符串、注入还是\
    \ `someAction` 并不无关。\n\n我们需要定义 `Token`：\n\n```\n1 class Token\n2 {\n3     public\
    \ string $value;\n4 \n5     public function __construct(string $value = '')\n\
    6     {\n7         $this->value = $value;\n8     }\n9 }\n```\n\n#### 状态 (States)\n\
    \n我们的词法分析器将是一个状态机。每个状态代表对字符串的一种预期。例如，在最开始时，我们预期字符串以“On”开头。如果不是，就是一个错误。之后，我们预期字符串包含一个换行符。\n\
    \n与其预定义整个图，我们可以将每个状态表示为一个函数。它的输入是字符串，输出是一个包含一个或多个标记的 `Result`。\n\n```\n\n class\
    \ Result\n2 {\n\n string string $remainingremaining\n\n\n array $\n [];\n5\n6\
    \     protected $nextFunction;\n7 }\n```\n\n每个状态函数然后是一个从字符串到 `Result` 的函数，其中包含一个字符串。这现在看起来可能很熟悉；它是一个\
    \ `bind` 函子，从 `string` 到一个“增强字符串”。\n\n然而，在类中持有一个函数的引用似乎有点愚蠢。我们将拥有大量的此类函数，每个状态一个。此外，类已经有一种引用函数的方法；它们被称为方法。所以，让我们这样重构我们的增强值：\n\
    \n```\n1 abstract class Lexer\n2 {\n3     protected string $remaining;\n4 \n5\
    \     protected array $tokens = [];\n6 \n7     protected function __construct(string\
    \ $remain, array $tokens)\n8     {\n9         $this->remaining = $remain;\n10\
    \        $this->tokens = $tokens;\n11     }\n12 \n13     public static function\
    \ of(string $remaining): self\n14     {\n15         return new static($remaining,\
    \ []);\n16     }\n17 \n18     abstract public function lex(string $string): Lexer;\n\
    19 }\n```\n\n## 绑定 (Binding)\n\n"
- fmt: "\nThe `bind` method is going to look a little bit different in this case.\
    \ It is still passed a callable that takes a `string` and returns a `Lexer` (enhanced\
    \ string), but unlike the error handling `Either` `bind` we saw before it does\
    \ the same thing in each case.\n\n```\n 1 abstract class Lexer\n 2 {\n 3     //\
    \ ...\n 4 \n 5     public function bind(callable $parseFn): Lexer\n 6     {\n\
    \ 7         /** @var static $res */\n 8         $res = $parseFn($this->remaining);\n\
    \ 9         $res->tokens = [...$this->tokens, ...$res->tokens];\n10         return\
    \ $res;\n11     }\n12 }\n```\n\nThat is, it calls the state function it’s given\
    \ with the remaining string, then merges the result with itself the same way as\
    \ the Writer monad we saw before. What’s different is where the `$parseFn` comes\
    \ from. Specifically, `$parseFn` is always `$this->lex`. While we could internalize\
    \ that logic into `bind()`, that would break its monadic behavior. Instead, let’s\
    \ just give ourselves a utility that does this for us.\n\n```\n 1 abstract class\
    \ Lexer\n 2 {\n 3     // ...\n 4     public static function run(string $string):\
    \ self\n 5     {\n 6         $l = LexerStart::of($string);\n 7         while (!\
    \ $l instanceof Done) {\n 8             $l = $l->bind([$l, 'lex']);\n 9      \
    \   }\n10 \n11         return $l;\n12     }\n13 }\n```\n\nIt could just as easily\
    \ be its own function, but a static method keeps it close to the Lexer class.\n\
    \nThe `run()` method calls `bind()` on each state with its own state function,\
    \ allowing it to process through the states, turning the string into an array\
    \ of `Token` objects along the way. The line of returns from each `Lexer`/state\
    \ to the next (which might be multiple possible states depending on the string)\
    \ form a graph, which describes the entire state machine of our particular DSL.\n\
    \nWe also need an end condition, lest we end up with an infinite loop. That’s\
    \ what the `instanceof Done` check is for; `Done` is simply an empty marker interface\
    \ on a given lexer state to indicate that the process is complete. There are two\
    \ lexer states in particular that implement it: An actual `LexerDone` state when\
    \ there’s nothing left to do, and an `Error` state in case the input is invalid.\
    \ We’ll look at the error case in a bit, but for now, here’s the `Done` state:\n\
    \n```\n1 class LexerDone extends Lexer implements Done\n2 {\n3     public function\
    \ lex($string): Lexer\n4     {\n5         return $this;\n6     }\n7 }\n```\n\n\
    This should be reminiscent of the `Error` case from the `Either` monad, as it\
    \ serves a similar purpose.\n\nTo ensure we don’t end up in an infinite loop,\
    \ let’s modify `bind()` so that if there is no remaining string we end up directly\
    \ in the `Done` state:\n\n```\n 1 abstract class Lexer\n 2 {\n 3     // ...\n\
    \ 4 \n 5     public function bind(callable $parseFn): Lexer\n 6     {\n 7    \
    \     if (!$this->remaining) {\n 8             return new LexerDone($this->remaining,\
    \ $this->tokens);\n 9         }\n10 \n11         /** @var static $res */\n12 \
    \        $res = $parseFn($this->remaining);\n13         $res->tokens = [...$this->tokens,\
    \ ...$res->tokens];\n14         return $res;\n15    }\n16 }\n```\n\nBefore we\
    \ move on, let’s define some additional utilities that individual state functions\
    \ use. They could be anywhere, but for convenience, let’s put them as methods\
    \ on `Lexer`.\n\n```\n 1 abstract class Lexer\n 2 {\n 3     // ...\n 4 \n 5  \
    \   protected function skipSpaces(string $string): string\n 6     {\n 7      \
    \   // Don't skip newlines as those have lexical significance.\n 8         return\
    \ ltrim($string);\n 9     }\n10 \n11     protected function readAlphaNumeric(string\
    \ $string): string\n12     {\n13         $matches = [];\n14         $result =\
    \ preg_match('/^\\w+/', $string, $matches);\n15         if (empty($matches)) {\n\
    16             return '';\n17         }\n18         return $matches[0];\n19  \
    \   }\n20 \n21     protected function startsWith(string $string, string $needle):\
    \ bool\n22     {\n23         return stripos($string, $needle) === 0;\n24     }\n\
    25 \n26     public function tokens(): array\n27     {\n28         return $this->tokens;\n\
    29     }\n30 \n31     public function remaining(): string\n32     {\n33      \
    \   return $this->remaining;\n34     }\n35 }\n```\n\n`skipSpaces()` and `startsWith()`\
    \ should be self-explanatory. `readAlphaNumeric()` is only slightly more interesting\
    \ because it uses a regex internally. It reads and returns an alphanumeric string\
    \ off of the passed string and returns it, but doesn’t modify the string being\
    \ investigated. `tokens()` and `remaining()` are just accessors.\n\n## The Lexers\n\
    \nSo far, everything we’ve written has been start state, but if we look ahead\
    \ the logic for any keyword should be virtually identical. Rather than duplicate\
    \ it for each keyword, we can abstract that to an intermediary class. This isn’t\
    \ technically a functional or monadic technique but an OOP one, and it works fine\
    \ in this case:\n\n```\n 1 abstract class LexerKeyword extends Lexer\n 2 {\n 3\
    \     protected string $keyword;\n 4     protected string $token;\n 5     protected\
    \ string $nextState;\n 6 \n 7     public function lex($string): Lexer\n 8    \
    \ {\n 9         if ($this->startsWith($string, $this->keyword)) {\n10        \
    \     $nextState = $this->nextState;\n11             return new $nextState(\n\
    12                 substr($string, strlen($this->keyword)), \n13             \
    \    [new $this->token]\n14             );\n15         }\n16 \n17         return\
    \ LexerError::create(\n18             $string,\n19             [],\n20       \
    \      sprintf('Expected \"%s\"', strtoupper($this->keyword))\n21         );\n\
    22     }\n23 }\n```\n\nNow any state that expects a keyword to be next is as simple\
    \ as:\n\n```\n1 class LexerStart extends LexerKeyword\n2 {\n3     protected string\
    \ $keyword = 'on';\n4 \n5     protected string $token = On::class;\n6 \n7    \
    \ protected string $nextState = LexerOn::class;\n8 }\n```\n\nEasy enough.\n"
