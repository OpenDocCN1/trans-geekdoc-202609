    \ a function, you’re passing the handle by value. So the variable name you see\
    \ is bound to the handle, and the handle then points to the object in memory.\
    \ Duplicating the handle when you pass an object to a function still means it’s\
    \ pointing to the same underlying value. That makes objects behave almost like\
    \ they’re passing by reference, even though they aren’t.\n\nThere’s one important\
    \ caveat to that, however: PHP doesn’t actually duplicate values when you pass\
