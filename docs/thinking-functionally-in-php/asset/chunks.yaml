    \   }\n20 \n21     protected function startsWith(string $string, string $needle):\
    \ bool\n22     {\n23         return stripos($string, $needle) === 0;\n24     }\n\
    25 \n26     public function tokens(): array\n27     {\n28         return $this->tokens;\n\
    29     }\n30 \n31     public function remaining(): string\n32     {\n33      \
    \   return $this->remaining;\n34     }\n35 }\n```\n\n`skipSpaces()` and `startsWith()`\
    \ should be self-explanatory. `readAlphaNumeric()` is only slightly more interesting\
    \ because it uses a regex internally. It reads and returns an alphanumeric string\
    \ off of the passed string and returns it, but doesn’t modify the string being\
    \ investigated.\n\n`tokens()` and `remaining()` are just boring accessors for\
    \ decomposing the product type.\n\n## The Lexers\n\nSo far, everything we’ve written\
    \ has been generic to any DSL format. While it seems involved, the entire class\
    \ is less than 70 lines long. That forms the core of our lexing engine.\n\nThe\
    \ rest of the code is a collection of token classes and lexer states. The token\
    \ classes are empty, so we won’t bother showing them to save space. Let’s start\
    \ with the one mentioned above, `LexerStart`, which is the start state of the\
    \ graph:\n\n```\n 1 abstract class LexerStart extends Lexer\n 2 {\n 3     public\
    \ function lex($string): Lexer\n 4     {\n 5         if ($this->startsWith('on'))\
    \ {\n 6             return new LexerOn(substr($string, strlen('on')), [new On()]);\n\
    \ 7         }\n 8 \n 9         return LexerError::create(\n10             $string,\
    \ [], sprintf('Expected \"%s\"', 'ON')\n11         );\n12    }\n13 }\n```\n\n\
    In the start state, we know that the next (first) part of the string is supposed\
    \ to be the keyword “on.” If it is, we can return a new Lexer for the state where\
    \ “on” has just been parsed, which we call `LexerOn`. Its internal values are\
    \ the string minus the “on” keyword and the `On` token. If not, then we know the\
    \ string is invalid, so it can return an error state. The error state is a `Done`\
    \ state, and is otherwise uninteresting aside from having an additional message\
    \ string:\n\n```\n 1 class LexerError extends Lexer implements Done\n 2 {\n 3\
    \     protected string $message;\n 4 \n 5     protected function __construct(\n\
    \ 6         string $remain,\n 7         array $tokens,\n 8         string $msg\n\
