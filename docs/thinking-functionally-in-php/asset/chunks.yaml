  trans: "\n\n```\n1 $sum = fn(iterable $list) \n2     => reduce($list, memoize(fn($collect,\
    \ $val) => $collect + $val), 0);\n```\n\n现在，`$sum`仍然是一个函数；它接收一个列表并像以前一样对该列表进行还原。不过，由于这是一个返回值的单行函数，我们使用短\
    \ Lambda 语法（short lambda syntax）对其重写了它。我们也可以对还原函数进行缓存（memoize），因为它是一个纯函数。在这个特定的示例中它并没有带来任何好处，但如果我们随着时间的推移计算大量的和（或者使用比加法更昂贵的操作），那么在那里加入一个\
    \ `memoize()` 可以是一个非常廉价的加速。如果我们需要，也可以很容易地对整个 `$sum` 进行缓存；在哪里进行缓存最优（如果需要的话），在很大程度上取决于你的用例。\n\
    \n`reduce()` 的有趣事实之一是，它可以作为许多（不是大多数）其他函数式操作的基础。例如，并没有规则规定 `reduce()` 返回的单个值本身不能是一个列表。列表仍然是一个值！\n\
    \n这意味着我们可以通过还原来重写 `map()`：\n\n```\n1 function map_r(iterable $it, callable $fn):\
    \ iterable\n2 {\n3     return reduce(\n4         $it,\n5         fn($result, $val,\
    \ $key) => $result + [$key => $fn($val)],\n6         []);\n7 }\n```\n\n考虑此函数的作用。还原从一个空列表\
    \ `[]` 开始，然后将该空列表与对 `$it` 中的第一个值调用 `$fn` 的结果连接起来，并保留键。这返回了一个包含一个键/值对的新数组。然后，该数组再与列表中第二个值调用\
    \ `$fn` 得到的键/值对连接，以此此类推，直到返回整个新列表。\n\n在实践中，`foreach()` 版本在 PHP 中性能更好，因为在 PHP 引擎中迭代的开销比函数调用要低，尽管没有以前那样廉价了。（这在其他编程语言中可能是真的，也可能假的。）不过，演示你可以在不实际迭代的情况下对列表进行迭代仍然是很好的。\n\
    \n那么 `filter()` 呢？它可以被实现为一个还原器吗？它确实可以。\n\n```\n 1 function filter_r(iterable $it,\
    \ callable $ifTrue = null): iterable\n2 {\n3     $ifTrue ??= fn($val): bool =>\
    \ (bool)$val;\n4 \n5     $reducer = function($result, $val, $key) use ($ifTrue)\
    \ {\n6         if ($ifTrue($val)) {\n7             return $result + [$key => $value];\n\
    8         }\n9         else {\n10             return $result;\n11         }\n\
    12     }\n13 \n14     return reduce($it, $reducer, []);\n15 }\n16 \n17 // 或者\n\
    18 \n19 function filter_r(iterable $it, callable $ifTrue = null): iterable\n20\
    \ {\n21     $ifTrue ??= fn($val): bool => (bool)$val;\n22 \n23     $reducer =\
    \ fn($result, $val $key) => $ifTrue($val)\n24         ? $result + [$key => $value]\n\
    25         : $result;\n26 \n27     return reduce($it, $reducer, []);\n28 }\n```\n\
    \n我在这里同时使用了长格式和短 Lambda 语法展示了还原器。自然地，你只会使用其中一个；哪一个更易读在某种程度上是主观的，但我倾向于使用短 Lambda\
    \ 版本，因为它感觉更具声明性。还原逻辑与 `map_r()` 的非常相似。对于每次调用，如果项目应该被过滤掉，它返回未被修改的当前 `$result`；如果应该被包含，则返回与当前值连接的\
    \ `$result`。\n\n# 拼接 (Concatenation)\n\n在过程化代码中，想要写出类似下面的代码是非常常见的：\n\n```\n1 getPromotions(mostExpensiveItem(getShoppingList(getCurrentUser(),\
    \ 'wishlist'), [\n2     'exclude' => 'onSale'\n3 ]), $holiday);\n```\n\n也就是说，获取当前用户，获取用户的“愿望清单”购物列表，找到最贵的物品但跳过已经在促销的物品，然后针对当前的任何假日找到该最贵物品的任何可用促销活动。然后你可以向用户展示这些促销活动。\n\
    \n正如你可能同意的，这样的代码极其丑陋且难以阅读。它有点是反向的，不清楚哪些参数属于哪个函数，而且给它添加一个额外的步骤将是一场猜右括号位置的练习。\n\n\
    通常的建议是引入大量的中间变量：\n\n```\n1 $user = getCurrentUser();\n2 $shoppingList = getShoppingList($user,\
    \ 'wishlist');\n3 $mostExpensiveItem = mostExpensiveItem($shoppingList, [\n4 \
    \    'exclude' => 'onSale'\n5 ]);\n6 $promotions = getPromotions($mostExpensiveItem,\
    \ $holiday);\n```\n\n这好多了，但仍然不完美，而且我们必须为所有中间变量命名。面向对象代码的支持者经常使用方法链，有时称为“流式接口”（fluent\
    \ interface），以便让你这样书写代码：\n\n```\n1 $promotions = getCurrentUser()\n2    ->getShoppingList('wishlist')\n\
    3    ->mostExpensiveItem(['exclude' => 'onSale'])\n4    ->getPromotions($holiday);\n\
    ```\n\n这样更容易读，但只有当这些方法存在于每个方法返回的对象上时才有效。对于商店中的一个 `Item` 对象，拥有一个 `getPromotions()`\
    \ 方法（这可能需要访问数据库）真的合理吗？如果你想提供的不是针对最贵的物品，而是针对赞助优惠券的制造商呢？这是否意味着为了能链式调用就把该方法添加到 `ShoppingList`\
    \ 类中？这违反了关于对象内聚性的多数建议。\n\n退一步说，我们真正想要的是一种链接一系列步骤的方法。一个步骤的输出是下一个步骤的输入，加上其他特定于步骤的内容。那些“其他特定于步骤的内容是是困难的原因之一，因为我们无法保证任意函数的参数顺序。\n\
    \n或者我们可以保证？\n\n回顾柯里化（currying）章节，可以将任何函数转换为单参数函数，而且在 PHP 7.4 中，得益于短 Lambda，我们可以轻松地做到这一点。我们可以这样重写链中的函数：\n\
    \n```\n1 $holiday = \"Lincoln's Birthday\";\n2 $wishList = fn(User $user): ShoppingList\n\
    3     => getShoppingList($user, 'wishlist');\n4 $item = fn(ShoppingList $list):\
    \ Item\n5     => mostExpensiveItem($list, ['exclude' => 'onSale']);\n6 $promo\
    \ = fn(Item $item): Promotions\n7     => getPromotions($item, $holiday);\n```\n\
    \n类型一如往常是可选的；我在这里包含它们是为了完整性，并证明新函数仍然与类型兼容。遗憾的是，我们无法在设计阶段捕捉类型不兼容，但在运行时实际的底层函数上仍然得到错误（假设这些函数已经指定了类型，而它们绝对应该是这样做的）。结果是我们可以这样做：\n\
    \n"
- fmt: "\n```\n1 $holiday = \"Lincoln's Birthday\";\n2 $findPromotionsFor = compose(\n\
    3     fn($x) => getShoppingList($x, 'wishlist'),\n4     fn($x) => mostExpensiveItem($x,\
    \ ['exclude' => 'onSale']),\n5     fn($x) => getPromotions($x, $holiday),\n6 );\n\
    ```\n\nI’ve omitted the types this time to make it shorter, and because, as noted,\
    \ the named functions still fail type checks at runtime if there’s an issue. But\
    \ we can now see our “chain” of functions very clearly, with minimal overhead.\
    \ Adding a new step is easy; just add a new unary short-lambda wrapper in the\
    \ middle of the list, or swap one out, etc. As long as the types are still compatible\
    \ from one function to the next, we’re good. And now we can use the `$findPromotionsFor(getCurrentUser())`\
    \ function to find the promotions we should show.\n\nMoreover, since `$findPromotionsFor()`\
    \ is “just” a function, it could be further composed/concatenated/piped with still\
    \ other functions (such as a chain that results in finding a user object). It’s\
    \ piped functions all the way down!\n\nIf this concept feels familiar somehow,\
    \ that’s because it’s the exact same principle behind the Unix command line. Small,\
    \ single-purpose functions are “piped” together with the `|` character, where\
    \ the input and output of each function is a stream of text. The principle here\
    \ is exactly the same, but because we have a more robust programming language\
    \ available, we can use richer data structures than just text strings. Please\
    \ do so.\n\nLet’s look back at that `compose()` function again, though. It should\
    \ also look eerily familiar. It’s iterating over a list and feeding the result\
    \ of one iteration into the next iteration. Doesn’t that look an awful lot like\
    \ the `reduce()` function we described before? In fact, it is exactly the same.\n\
    \nIn practice it is more performant to reimplement the looping logic in `compose()`,\
    \ but for completeness’s sake let’s rewrite it as a reduction:\n\n```\n 1 function\
    \ compose(callable ...$fns): callable\n 2 {\n 3     return function ($x) use ($fns)\
    \ {\n 4         return reduce($fns, function($collect, $fn) {\n 5            \
    \ return $fn($collect);\n 6         }, $x);\n 7     };\n 8 }\n 9 \n10 // Or\n\
    11 \n12 function compose(callable ...$fns): callable\n13 {\n14     return fn($x)\
    \ => reduce($fns, fn($collect, $fn) => $fn($collect), $x);\n15 }\n```\n\nAgain,\
    \ I’ve shown both the verbose and simpler versions. They are identical. In either\
    \ case, `compose()` is still returning a new function, but this time that function\
    \ has only a single statement: calling `reduce()` across the list of functions\
    \ (which are, recall, “just” variables like any other) with a reducing function\
    \ that is just “call the function with the current value” (aka `$fn($collect)`).\
    \ \n\nThis is a perfect example of where `reduce()` can be useful for things other\
    \ than addition, and serves to demonstrate the power of being able to treat functions\
    \ as values. `compose()` is now a single-line function we can use to chain together\
    \ arbitrary functions, by wrapping each arbitrary function into a unary function.\
    \ If a function is already unary, it can be passed as-is although PHP has a sadly\
    \ weak syntax for doing so.\n\nAnd because the result is a function, it can be\
