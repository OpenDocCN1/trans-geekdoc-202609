  trans: "\n\n`Optional` 或 `Maybe` 单器是最常见的类型，部分原因因为它非常简单，另一部分是因为悬空空指针（dangling nulls）是编程语言中的大敌之一；空指针的发明者\
    \ Tony Hoare 曾称之为“十亿美元错误”。因此，许多现代语言都内置了方法来让变量变为可选，这意味着语言会自动将变量封装在一个 `Maybe` 单器中。\n\
    \n我们之前看到过 `Rust` 使用了枚举的 `Result` 类型，它可以是 `Some`（封装一个值）或 `None`（什么都没有），这迫使你在没有实际空指针的情况下也考虑空值情况。其他语言则更进了一步，将可选概念封装到语法本身中。\n\
    \n例如，在 `Swift` 中，除非声明为可选的，否则变量必须有值：\n\n```\n1 var name:String?\n```\n\n`?` 表示该变量可能为空，这意味着在不使用\
    \ `!` 进行“解包”的情况下是无法访问它的。\n\n```\n1 if name != null {\n2     print(\"Hello, \\\
    (name!)\")\n3 } else {\n4     print(\"Wait, who are you again?\")\n5 }\n```\n\n\
    `?` 实际上是语法上的 Maybe 单器“单元（unit）”操作，而 `!` 则是语法上的 `getValue()` 或 `unwrap()`。最终结果是相同的：强制开发者处理值可能缺失的情况，而不是让他们忘记去处理，因为我们太容易忘记这一点了。\n\
    \n这种改变在如今的 `PHP` 中可能是不切行的；可空变量没有内置保护机制，添加它们将是一个重大的破坏性变更。使用显式封装的 `Rust` 风格方法会更具可行性。\n\
    \n## 可选链（Optional Chaining）\n\n另一个集成了可选的特性允许了可选链。也就是说，对一个可能为空的变量进行解引用，但如果它为空，则不实际进行解引用。这……与\
    \ Maybe 单器的 `bind` 操作的行为恰完全相同。\n\n考虑下面这个 `Swift` 示例：\n\n```\n1 class Employee\
    \ {\n2     var name: String\n3     var title: String\n4     var manager: Employee?\n\
    5 }\n```\n\n在这个类中，`name` 和 `title` 都是必须的，但 `manager` 是可选的。你可以这样访问经理的名字：\n\n```\n\
    1 let e = Employee();\n2 // ...\n3 var boss = e.manager?.name;\n```\n\n如果 `e.manager`\
    \ 已定义，则返回该对象的 `name` 属性。如果为空，则整个链的剩余部分将被跳过，`boss` 被置为 null（因此它的类型是 `String?`，所以必须解包才能使用）。链中的任意数量的值都可以可选的。\n\
    \n从概念上来说，没有理由 `PHP` 不支持这种语法，而且它过去也被提过：\n\n```\n1 $boss = $e->getManager()?->name;\n\
    ```\n\n这在实践中实际上等同于 Maybe 单器所封装的同样的 `is_null` “地狱金字塔”的语法糖。\n\n尽管如此，我不确信这是一种好方法。虽然它有其用处，但返回空通常意味着错误，而不是像“用户未找到”那样的单一“正常”情况。在这种情况下，某种程度上内置\
    \ `Either` 的语法版本而不是 `Maybe` 会更灵活，并允许返回多种错误类型。我不确定这在实践中看起来会是什么样，但它本质上是一个基于返回的函数式异常版本（尽管只有一层深）。\n\
    \n## 原生绑定操作符（Native Bind Operator）\n\n像 `Haskell` 或 `F#` 这样高度函数化的语言通常有一个用于单器绑定的原生运算符。由于单器实际上只是“花哨的连接”，从程序员的角度来看，它们有一个类似连接的操作符。例如，在\
    \ `Haskell` 中可以写成：\n\n```\n1 promos = getCurrentUser\n2     >>= getShoppingList\n\
    3     >>= mostExpensiveItem onSale\n4     >>= getPromotions \"Lincoln's Birthday\"\
    \n```\n\n其中 `>>=` 是 `Haskell` 的“绑定（bind）”运算符，假设已经定义了类型相应的绑定函数。遗憾在于，语言需要某种方法来告知使用哪种绑定操作，而这反过来源于每个函数的类型。在\
    \ `Haskell` 中，由于其极其健壮的类型系统和独立的编译步骤，这很容易。在 `PHP` 中，由于其类型系统相对较弱以及对快速生成操作码时间的需求，这变得困难得多。它可能需要在引擎中构建函数模式匹配逻辑，而\
    \ `PHP` 出于各种原因一直以来避免这一点（主要是因为与弱类型系统结合是一个坏主意）。实现它可能并非不可能，但可能非常。\n\n## 枚举类型（Enumerated\
    \ Types）\n\n虽然在 `PHP` 用户空间创建枚举结构是可能的，但它仍然没有类型系统的支持。枚举类型是余和类型（coproduct types）在代码中的体现，允许为一种类型创建合法值的封闭列表。这反过来使得某些单器模式（如\
    \ `Either`）更容易表示，特别是当与泛型结合时。\n\n例如，在 `Haskell` 中，枚举类型非常简单：\n\n```\n1 datatype\
    \ cardsuit = Clubs | Diamonds | Hearts | Spades\n```\n\n现在，类型为 `cardsuit` 的变量只能是这四个值之一。与泛型结合，Maybe\
    \ 单器在 `Haskell` 中可以简单地表示为：\n\n```\n1 data Maybe a = Nothing | Just a\n```\n\n\
    在 `PHP` 中实现这一点要困难得多。在 `C` 或 `C++` 中，枚举类型没有值。例如这段 `C` 代码：\n\n```\n1 enum cardsuit\
    \ {\n2 Clubs,\n3 Diamonds,\n4 Hearts,\n5 Spades\n6\n```\n\n输出“Hearts”将产生整数 2。在其他语言，如\
    \ `Haskell` 和 `Java` 中，简写为：\n\n```\n1 enum cardsuit {\n     Clubs    = 0,\n  \
    \   Diamonds = 1,\n     Hearts   = 2,\n     Spades   = 3\n6\n```\n\n更高级的枚举版本被称为标记联合（tagged\
    \ unions），允许类型是一组特定类型之一，这些类型本身可以是复合类型。例如，在 `Rust` 中：\n\n```\n1 enum Message {\n\
    2     Quit,\n3     Move { x: i32, y: i32 }, // 匿名结构体\n4     Write(String),\n5\
    \     ChangeColor(i32, i32, i32),\n6 }\n```\n\n现在 `Message` 类型定义为“`Quit`、具有两个属性的\
    \ `Move` 实例、具有一个属性的 `Write`、或者具有三个属性的 `ChangeColor` 实例。”在某种意义上，它类似于标记接口，只不过合法值的列表是封闭的，而不是无限的。\n\
    \n对于 `PHP` 中的枚举，主要问题是采用哪种模型；目前技术上没有理由不能这样做。\n\n# 何时转向函数式\n\n在整书中，我们试图演示函数式代码的工作原理：函数式编程的原理是什么，它们可能的影响，以及它们实现的方法。这反过来导致了对函数编程背后数学的探索，以及采用函数式、基于单器的方法解决实际示例。\n\
    \n这对于理解原生函数化语言中为什么要这么做非常有帮助。但 `PHP` 缺乏一些让此类方法真正强大的完善工作。它还缺乏像 `Haskell` 那样的语言惰性求值，这意味着在实践中，没有任何实用的\
    \ `PHP` 程序可以是纯函数的，因为它们无法进行输入或输出，这会很蠢。\n\n当然，这对于几乎所有声称函数化的语言都是如此。如果它不能具有不性（读取输入、写入输出），它就不是一种实用的语言。不同的函数化语言或严格函数化语言以不同的方式应对这一挑战。作为非函数化语言（无双关），`PHP`\
    \ 对该问题的方法仅仅是不关心。\n\n"
- fmt: '

    A PHP program can be as functional as you want to make it. The principles of functional-style
    programming can all be used in PHP, to varying degrees, quite successfully. Some
    are applicable in almost any situation, others only in certain contexts. It’s
    up to the individual developer to decide when they apply, and how. There is no
    One True Way^(tm) to write functional-style PHP code.


    As guidelines, I would offer the following recommendations. They are, as stated,
    recommendations, and there will be contexts and situations in which every single
    one of them does not apply. Still, the following mindset, I would argue, will
    serve developers well in the long term.


    These recommendations are listed in roughly their order of decreasing universality
    (that is, how often you should try to apply them).


    ## Avoid Global State


    While most modern PHP code does a pretty good job on this front, not all does,
    and there is ample legacy code that was written in the dark times when developers
    thought global variables were a good way to manage state throughout a request.
    It was never a good way, but every generation of developers must re-learn certain
    hard lessons. Global state is the death of purity, and without pure functions,
    there is no functional programming.


    In short, pretend that PHP’s `global` keyword and the `$GLOBALS` super-global
    variable do not exist. Erase them from your mind. Moreover, never access PHP’s
    input superglobals except from a single location to convert them into a better,
    non-global data structure. Your code will thank you.


    All that seems easy; however, there is a more pernicious form of global state
    that is still in widespread use: stateful service entries. While the trend has
    turned against that in recent years, there are still applications with service
    containers whose services retain meaningful state. That is still a global variable,
    even if it does not use a `global` keyword. If the order in which other functions
    or services call a service ends up mattering to those other services, then your
    service is impure.


    That is especially true for pseudo-services; some frameworks, for instance, still
    store an object representing the HTTP request in a dependency injection container,
    or accessible through the container in some way. And that request object is often
    mutable. Be careful; that is now a global variable, and thus anything it touches
    is no longer reliably a pure function.


    There is a slight exception for memoization. Memoizing the output of a service
    is technically maintaining state, but it is maintaining state in an idempotent
    way. That makes it mostly safe, as long as you’re not memoizing output that relies
    on stateful data (such as a database lookup). But be judicious with it; don’t
    just memoize everything by default. Wait to see if profiling says it would be
    useful. If it is, make the memoization its own routine rather than baking it into
    the code being memoized. For example, if you have a service you want to memoize,
    write a separate object that implements the same interface and wraps your service
    that does nothing but cache the output. That makes the code much easier to conceptualize,
    understand, read, and test. Interweaving caching logic into business logic is
    a surefire way to make both harder to comprehend.


    ## Make Pure Functions


    If you take nothing else away from this book, make it this: Make your code pure
    whenever possible, and if it seems impossible, try to make it pure anyway before
    giving up. Pure functions are the foundation of functional programming, and all
    by themselves offer massive benefits for readability, testability, even performance.
    Pure functions are trivially memoizable (if necessary), simple to reuse in another
    context and adapt to other contexts.


    Note that by “function,” I don’t mean just stand-alone functions. Methods are,
    as we discussed, simply a function that is closed over the object’s state. They
    can and should be treated the same way. That is, methods should maintain no state
    of their own, and the state of the object they are on should never change. Most
    methods can be easily made idempotent with just a little bit of thought and refactoring,
    and the more you do so, the easier it becomes.


    ## Isolate IO


    The most pernicious form of state and impurity is input and output from your program.
    You cannot avoid it, only contain it. So, try to contain it.


    Any piece of code that interacts with the outside world is inherently impure,
    and that means any code that calls it is inherently impure. The more you can confine
    your IO to a specific part of the codebase, the less it can pollute the rest of
    your application.


    The best guidance I’ve found for how to do that is “functional core, imperative
    shell,” a term and technique coined by Gary Bernhart in a presentation by the
    same name (See the reference in “Further Reading”). Although his talk is in Ruby,
    the concept applies generally. The basic concept is that the impure, IO-containing,
    ugly part of the application should be on the “outside,” where it touches the
    rest of the world. It forms the basic flow of input and output but does virtually
    nothing else. Everything else is handed off to other routines that obey functional
    principles strictly. That makes those parts easily testable and easy to develop
    against and keeps the hard to test, stateful, ugly bits separate.


    If that sounds familiar, the famous “hexagonal architecture” (which is a bad marketing
    name since the concept has nothing to do with hexagons or even the number six
    at all) boils down to almost the same concept: Put your clean and important bits
    on the inside and your ugly world-touching bits on the outside, and don’t let
    them taint each other.


    In PHP, this would largely manifest itself as keeping the request and response
    objects as far away from the business logical as possible. It also means whatever
    database lookups are needed for a given request should be done early, while the
    request handling is still being set up, so that the main logic routines are fed
    not just their service dependencies but their data dependencies, too.


    ## List Application


    When working with lists of data, it’s natural for most PHP developers to first
    reach for a `foreach()` loop. That’s been the PHP go-to tool for iterating over
    a list for 20 years, and it certainly gets the job done.


    However, when approaching a problem that involves multiple similar values, try
    to avoid that habit. Instead, think in terms of function application through map,
    filter, and reduce. Whether you use the built-in `array_map()`, `array_filter()`,
    and `array_reduce()` functions or write your own is irrelevant; use whatever gets
    the job done. However, leveraging those operations lets you separate out your
    actions from your iteration. It lets you think and code more declaratively, which
    can make the code easier to reason about as well as test.


    That doesn’t necessarily mean inlining all of your application functions. On the
    contrary, a good heuristic is that if they’re too long to put into a short-lambda,
    they should be their own function or method in the first place. That’s fine, and
    they can still be used just as easily but now in a testable fashion. Over time,
    you’ll find that thinking declaratively helps to conceptualize the problem space
    differently, at a higher level, where you can think without being distracted by
    implementation details.


    ## Embrace Value Objects


    The other core pillar of functional programming is immutable values. While building
    proper value objects in PHP sometimes takes a bit of work, it pays off enormously
    in the amount of “spooky action at a distance” you can avoid. As with other aspects
    of functional programming, it can take some time to get used to, but once you
    get used to it your life will be a lot easier (and more testable).

    '
