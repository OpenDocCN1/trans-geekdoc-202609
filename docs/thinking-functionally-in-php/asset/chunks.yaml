    \ up for now.) It’s a pure function. What if we know the `x` value or want to\
    \ compute a bunch of volumes, all with the same `x` value? We can create a new\
    \ function that has `$x` preloaded, in a sense, like so:\n\n```\n1 $x = 5;\n2\
    \ $volumeWithX = function(float $y, float $z) use ($x): float\n3 {\n4     return\
    \ volume($x, $y, $z);\n5 }\n```\n\nOr more succinctly:\n\n```\n1 $x = 5;\n2 $volumeWithX\
    \ = fn(float $y, float $z): float => volume($x, $y, $z);\n```\n\nNow we can call\
    \ `$volumeWithX(4, 8)`, which will give us the exact same result, guaranteed,\
    \ as calling `volume(5, 4, 8)`, because that’s exactly what happens. The value\
    \ of `5` is saved into a new function, as a closure, to give us a 2 parameter\
    \ function.\n\nThe same technique can be applied a second time to produce a single\
    \ parameter function:\n\n```\n1 $volumeWithXY = fn(float $z): float => $volumeWithX(4,\
    \ $z);\n```\n\nWe can do the same thing over and over again for as many parameters\
    \ as the function has, eventually producing a function that takes a single parameter.\n\
    \nAlternatively, a single function could self-curry if we wanted to get really\
    \ fancy:\n\n```\n1 function curried_volume(float $x)\n2 {\n3     return function\
    \ ($y) use ($x) {\n4         return function ($z) use ($x, $y) {\n5          \
    \   return $x * $y * $z;\n6         };\n7     };\n8 }\n```\n\nThat’s kind of a\
    \ mouthful, though, especially with all of that `use`-ing. Fortunately, short\
    \ lambdas give us a much more condensed syntax that does the exact same thing:\n\
    \n```\n1 function curried_volume(float $x)\n2 {\n3     return fn($y) => fn($z)\
    \ => $x * $y * $z;\n4 }\n```\n\nBoth of those versions are identical; In both\
    \ cases, `curried_volume()` takes one parameter (`$x`), then returns another function\
    \ that takes one parameter (`$y`), which then returns a function that takes one\
    \ parameter (`$z`), which then finally does the computation on all three collected\
    \ inputs and returns a value. It returns the same value as the original `volume()`\
    \ function.\n\n```\n1 volume(5, 4, 8) === curried_volume(5)(4)(8);\n```\n\nWhile\
    \ in this case, we’ve shown currying one step at a time, there’s nothing which\
    \ precludes closing over multiple parameters at once. In fact, it’s possible to\
    \ write a generic “partial application” function like so:\n\n```\n1 function partial(callable\
    \ $fn, ...$firstArgs): callable\n2 {\n3     return function(...$secondArgs) use\
    \ ($firstArgs) {\n4         return $fn(...[...$firstArgs, ..$secondArgs]);\n5\
    \     };\n6 }\n```\n\nOr, more succinctly:\n\n```\n1 function partial(callable\
    \ $fn, ...$firstArgs): callable\n2 {\n3     return fn(...$secondArgs) => $fn(...[...$firstArgs,\
    \ ..$secondArgs]);\n4 }\n```\n\nSide note: If you’re confused by all of those\
    \ ellipses, there are three different uses of them in the above function:\n\n\
    1.  In a function definition: `...$firstArgs` means “and all remaining parameters,\
    \ as an array”. It replaces `func_get_args()`.\n\n2.  In a function call: `$fn(...[])`\
    \ means “take this array and spread it out as if I called the function with each\
    \ parameter individually”; it replaces `call_user_func_array()`."
