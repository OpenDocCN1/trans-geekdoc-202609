    \ strlen($matches[0])), []);\n29     }\n30 }\n```\n"
- fmt: "\n```php\nabstract class StateTest extends TestCase\n{\n    /**\n     * @dataProvider\
    \ lexerProvider\n     */\n    public function test_state(\n        string $input,\n\
    \        string $nextState,\n        string $remain,\n        array $expectedTokens\n\
    \    ): void\n    {\n        $class = $this->startState();\n\n        /** @var\
    \ Lexer $state */\n        $state = $class::of('');\n\n        $result = $state->lex($input);\n\
    \n        $this->assertInstanceOf($nextState, $result);\n\n        $this->assertEquals($remain,\
    \ $result->remaining());\n\n        $foundTokens = $result->tokens();\n      \
    \  foreach ($expectedTokens as $i => $expected) {\n            $this->assertInstanceOf(\n\
    \                get_class($expected),\n                $foundTokens[$i]\n   \
    \         );\n            $this->assertEquals(\n                $expected->value,\n\
    \                $foundTokens[$i]->value\n            );\n        }\n    }\n\n\
    \    abstract function startState(): string;\n\n    abstract function lexerProvider():\
    \ iterable;\n}\n```\n\nWe’re using a data provider to minimize boilerplate. For\
    \ each set of input string, and expected bits of the result, we lex the string,\
    \ then make sure the value we got back is the expected next state. Then we ensure\
    \ that the tokens, if any, are the ones we expected.\n\nLet’s look at the test\
    \ class for `LexerStartLine` as an example:\n\n```php\nclass LexerStartLineTest\
    \ extends StateTest\n{\n    function startState(): string\n    {\n        return\
    \ LexerStartLine::class;\n    }\n\n    function lexerProvider(): iterable\n  \
    \  {\n        yield ['if foo', LexerIf::class, ' foo', [new IfToken()]];\n   \
    \     yield [' if foo', LexerIf::class, ' foo', [new IfToken()]];\n        yield\
    \ ['beep beep', LexerError::class, 'beep beep', []];\n        yield ['Action bonk',\
    \ LexerAction::class, ' bonk', [new Action()]];\n    }\n}\n```\n\nSimplicity itself!\
    \ `startState()` says we’re testing `LexerStartLine`. `lexerProvider` returns\
    \ a series of test strings and the expected decomposed result. Any data we want\
    \ to throw at it can now be trivially tested with ease.\n\nA similar approach\
    \ would work for integration tests on the whole Lexer pipeline itself, calling\
    \ `Lexer::run()`.\n\n```php\nclass LexerTest extends TestCase\n{\n    /**\n  \
    \   * @dataProvider lexerProvider\n     */\n    public function test_lexing(\n\
    \        string $string,\n        string $endState,\n        array $expectedTokens\n\
    \    ): void\n    {\n        $l = Lexer::run($string);\n\n        $this->assertInstanceOf($endState,\
    \ $l);\n\n        $foundTokens = $l->tokens();\n        foreach ($expectedTokens\
    \ as $i => $expected) {\n            $this->assertInstanceOf(\n              \
    \  get_class($expected),\n                $foundTokens[$i]\n            );\n \
    \           $this->assertEquals(\n                $expected->value,\n        \
    \        $foundTokens[$i]->value\n            );\n        }\n    }\n\n    public\
    \ function lexerProvider(): iterable\n    {\n        // Add as many test sets\
    \ as desired here.\n\n        yield ['On foo.bar', LexerDone::class, [\n     \
    \       new On(),\n            new Subject('foo'),\n            new Dot(),\n \
    \           new Trigger('bar'),\n        ]];\n    }\n}\n```\n\n## Analysis\n\n\
    This has been a long chapter, but it’s largely been the same pattern repeating\
    \ over and over again. Let’s review the core of our lexer:\n\n* We’re using a\
    \ product type, `Lexer`, which enhances a string into a string, token list, and\
    \ callable.\n* We’re using a `Writer` monad design to build up the token list.\n\
    * We’re using an `Either` monad design to handle different lexer states.\n* We’ve\
    \ built a purely functional state machine.\n* We’re leveraging common object-oriented\
    \ techniques alongside good functional programming techniques.\n* We’ve done it\
    \ in a way that is simple and straightforward to cleanly unit test.\n* We’ve done\
    \ it in less than 70 lines of core code.\n\nThat’s pretty impressive. We can be\
    \ even more impressive, though, with two small additions to help this solution\
    \ scale.\n\n## Being Lazy\n\nIn its current form, our lexer builds up a long list\
    \ of token objects and is not complete until it’s produced all of them. In our\
    \ simple case, that’s fine; there won’t be more than 20-30 tokens. However, it\
    \ is plausible to have longer streams, having all in memory might be prohibitive.\n\
    \nFirst, the current version of `bind()` is identical to `run()`. Here’s a lazy\
    \ version:\n\n```php\nabstract class Lexer\n{\n    // ...\n    public function\
    \ lazyBind(callable $parseFn): Lexer\n    {\n        if (!$this->remaining) {\n\
    \            return new LexDone($this->remaining);\n        }\n        // ...\n\
    \    }\n}\n```\n\nNext, we need to `yield` the tokens from a generator. That’s\
    \ nearly the same as `run()`:\n\n```php\nabstract class Lexer\n{\n    // ...\n\
    \    public static function lazy(string $string): \\Generator\n    {\n       \
    \ $l = Lexer::of($string);\n        while (!$l instanceof Done) {\n          \
    \  $l = $l->lazyBind([$l, 'lex']);\n            yield from $l->tokens();\n   \
    \     }\n        return $l;\n    }\n}\n```\n\nAnd we’re done. `lazy()` produces\
    \ a generator that `yield`s each lexer state’s tokens, then returns the last state;\
    \ that is an instance of `Done`, either `LexerDone` or `LexerError`, that can\
    \ be examined. Because the individual states are all simple functors, with no\
    \ knowledge of the iteration, the monad, or anything else, they still work as\
    \ before. We can even reuse the same data provider for testing `lazy()`:\n\n```php\n\
    class LexerTest extends TestCase\n{\n    /**\n     * @dataProvider lexerProvider\n\
    \     */\n    public function test_lazy_lexing(\n        string $string,\n   \
    \     string $endState,\n        array $expectedTokens\n    ): void\n    {\n \
    \       $tokens = Lexer::lazy($string);\n\n        $tokenProducer = function()\
    \ use ($tokens) {\n            foreach ($tokens as $token) {\n               \
    \ yield $token;\n            }\n        };\n        $foundTokens = iterator_to_array($tokenProducer());\n\
    \n        foreach ($expectedTokens as $i => $expected) {\n            $this->assertInstanceOf(\n\
    \                get_class($expected),\n                $foundTokens[$i]\n   \
    \         );\n            $this->assertEquals(\n                $expected->value,\n\
    \                $foundTokens[$i]->value\n            );\n        }\n\n      \
    \  $end = $tokens->getReturn();\n\n        $this->assertInstanceOf($endState,\
    \ $end);\n    }\n}\n```\n"
  raw: "```\n 1 abstract class StateTest extends TestCase\n 2 {\n 3     /**\n 4  \
    \    * @dataProvider lexerProvider\n 5      */\n 6     public function test_state(\n\
    \ 7         string $input,\n 8         string $nextState,\n 9         string $remain,\n\
    10         array $expectedTokens\n11     ): void\n12     {\n13         $class\
    \ = $this->startState();\n14 \n15         /** @var Lexer $state */\n16       \
    \  $state = $class::of('');\n17 \n18         $result = $state->lex($input);\n\
    19 \n20         $this->assertInstanceOf($nextState, $result);\n21 \n22       \
    \  $this->assertEquals($remain, $result->remaining());\n23 \n24         $foundTokens\
    \ = $result->tokens();\n25         foreach ($expectedTokens as $i => $expected)\
    \ {\n26             $this->assertInstanceOf(\n27                 get_class($expected),\n\
    28                 $foundTokens[$i]\n29             );\n30             $this->assertEquals(\n\
    31                 $expected->value,\n32                 $foundTokens[$i]->value\n\
    33             );\n34         }\n35     }\n36 \n37     abstract function startState():\
    \ string;\n38 \n39     abstract function lexerProvider(): iterable;\n40 }\n```\n\
    \nWe’re using a data provider to minimize boilerplate. For each set of input string,\
    \ and expected bits of the result, we lex the string, then make sure the value\
    \ we got back is the expected next state. Then we ensure that the tokens, if any,\
    \ are the ones we expected.\n\nLet’s look at the test class for `LexerStartLine`\
    \ as an example:\n\n```\n 1 class LexerStartLineTest extends StateTest\n 2 {\n\
    \ 3     function startState(): string\n 4     {\n 5         return LexerStartLine::class;\n\
    \ 6     }\n 7 \n 8     function lexerProvider(): iterable\n 9     {\n10      \
    \   yield ['if foo', LexerIf::class, ' foo', [new IfToken()]];\n11         yield\
    \ [' if foo', LexerIf::class, ' foo', [new IfToken()]];\n12         yield ['beep\
    \ beep', LexerError::class, 'beep beep', []];\n13         yield ['Action bonk',\
    \ LexerAction::class, ' bonk', [new Action()]];\n14     }\n15 }\n```\n\nSimplicity\
    \ itself! `startState()` says we’re testing `LexerStartLine`. `lexerProvider`\
    \ returns a series of test strings and the expected decomposed result. Any data\
    \ we want to throw at it can now be trivially tested with ease.\n\nA similar approach\
    \ would work for integration tests on the whole Lexer pipeline itself, calling\
    \ `Lexer::run()`.\n\n```\n 1 class LexerTest extends TestCase\n 2 {\n 3     /**\n\
    \ 4      * @dataProvider lexerProvider\n 5      */\n 6     public function test_lexing(\n\
    \ 7         string $string,\n 8         string $endState,\n 9         array $expectedTokens\n\
    10     ): void\n11     {\n12         $l = Lexer::run($string);\n13 \n14      \
    \   $this->assertInstanceOf($endState, $l);\n15 \n16         $foundTokens = $l->tokens();\n\
    17         foreach ($expectedTokens as $i => $expected) {\n18             $this->assertInstanceOf(\n\
    19                 get_class($expected),\n20                 $foundTokens[$i]\n\
    21             );\n22             $this->assertEquals(\n23                 $expected->value,\n\
    24                 $foundTokens[$i]->value\n25             );\n26         }\n\
    27     }\n28 \n29     public function lexerProvider(): iterable\n30     {\n31\
    \         // Add as many test sets as desired here.\n32 \n33         yield ['On\
    \ foo.bar', LexerDone::class, [\n34             new On(),\n35             new\
    \ Subject('foo'),\n36             new Dot(),\n37             new Trigger('bar'),\n\
    38         ]];\n39    }\n40 }\n```\n\n## Analysis\n\nThis has been a long chapter,\
    \ but it’s largely been the same pattern repeating over and over again. Let’s\
    \ review the core of our lexer:\n\n*   We’re using a product type, `Lexer`, which\
    \ enhances a string into a string, token list, and callable.\n\n*   We’re using\
    \ a Writer monad design to build up the token list.\n\n*   We’re using an Either\
    \ monad design to handle different lexer states.\n\n*   We’ve built a purely functional\
    \ state machine.\n\n*   We’re leveraging common object-oriented techniques alongside\
    \ good functional programming techniques.\n\n*   We’ve done it in a way that is\
    \ simple and straightforward to cleanly unit test.\n\n*   We’ve done it in less\
    \ than 70 lines of core code.\n\nThat’s pretty impressive. We can be even more\
    \ impressive, though, with two small additions to help this solution scale.\n\n\
    ## Being Lazy\n\nIn its current form, our lexer builds up a long list of token\
    \ objects and is not complete until it’s produced all of them. In our simple case,\
    \ that’s fine; there won’t be more than 20-30 tokens at a time. However, it’s\
    \ entirely plausible to have a DSL that supports much longer token streams, long\
    \ enough that having them all in memory at once might be prohibitive. For instance,\
    \ we may want to process them in a stream rather than build an AST in memory.\
    \ Or we could be using the same technique as here to process an incoming stream\
    \ of data into more robust objects than simple tokens. In either case, we want\
    \ to process each step one at a time rather than all at once.\n\nThe normal answer,\
    \ in that case, is to use a generator to lazily produce values that can be iterated\
    \ over. As written, though, each step produces an increasing list of token values.\
    \ Can that be converted into a lazy stream instead?\n\nIt turns out it can, and\
    \ it can be done without modifying any of the individual state functors. In fact,\
    \ it can be done without modifying any existing code, just providing slightly\
    \ alternate versions of `bind()` and `run()`.\n\nFirst, the current version of\
    \ `bind()` is what smushes the token lists together as a way to combine the two\
    \ functors. So… let’s not do that. Here’s a lazy version that is identical aside\
    \ from that one line:\n\n```\n 1 abstract class Lexer\n 2 {\n 3     // ...\n 4\
    \ \n 5     public function lazyBind(callable $parseFn): Lexer\n 6     {\n 7  \
    \       if (!$this->remaining) {\n 8             return new LexerDone($this->remaining,\
    \ $this->tokens);\n 9         }\n10 \n11         /** @var static $res */\n12 \
    \        $res = $parseFn($this->remaining);\n13         return $res;\n14     }\n\
    15 }\n```\n\nThis is entirely legal; it’s just a different monoid operation between\
    \ `$this` and `$parseFn`.\n\nNext, we need to `yield` the tokens from each step\
    \ from a generator. That’s nearly the same as `run()`:\n\n```\n 1 abstract class\
    \ Lexer\n 2 {\n 3     // ...\n 4 \n 5     public static function lazy(string $string):\
    \ \\Generator\n 6     {\n 7         $l = LexerStart::of($string);\n 8        \
    \ while (! $l instanceof Done) {\n 9             $l = $l->lazyBind([$l, 'lex']);\n\
    10             yield from $l->tokens();\n11         }\n12 \n13         return\
    \ $l;\n14     }\n15 }\n```\n\nAnd we’re done. `lazy()` produces a generator that\
    \ `yield`s each lexer state object’s tokens, then returns the last state object;\
    \ that is an instance of `Done`, either `LexerDone` or `LexerError`, that can\
    \ be examined. Because the individual states are all just simple functors, with\
    \ no knowledge of the iteration, the monad, or anything else, they still work\
    \ exactly as before. We can even reuse the same data provider for testing `lazy()`:\n\
    \n```\n 1 class LexerTest extends TestCase\n 2 {\n 3     /**\n 4      * @dataProvider\
    \ lexerProvider\n 5      */\n 6     public function test_lazy_lexing(\n 7    \
    \     string $string,\n 8         string $endState,\n 9         array $expectedTokens\n\
    10     ): void\n11     {\n12         $tokens = Lexer::lazy($string);\n13 \n14\
    \         $tokenProducer = function() use ($tokens) {\n15             foreach\
    \ ($tokens as $token) {\n16                 yield $token;\n17             }\n\
    18         };\n19         $foundTokens = iterator_to_array($tokenProducer());\n\
    20 \n21         foreach ($expectedTokens as $i => $expected) {\n22           \
    \  $this->assertInstanceOf(\n23                 get_class($expected),\n24    \
    \             $foundTokens[$i]\n25             );\n26             $this->assertEquals(\n\
    27                 $expected->value,\n28                 $foundTokens[$i]->value\n\
    29             );\n30         }\n31 \n32         $end = $tokens->getReturn();\n\
    33 \n34         $this->assertInstanceOf($endState, $end);\n35     }\n36 }\n```"
