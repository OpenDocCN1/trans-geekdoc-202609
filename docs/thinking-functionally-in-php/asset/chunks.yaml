  trans: "\n在这种情况下，`bind` 方法的写法会略有不同。它仍然接收一个接受 `string` 并返回 `Lexer`（增强后的字符串）的可调用对象，但与我们之前看到的错误处理\
    \ `Either` `bind` 不同，它在每种情况下执行的操作都是相同的。\n\n```\n 1 abstract class Lexer\n 2 {\n\
    \ 3     // ...\n 4 \n 5     public function bind(callable $parseFn): Lexer\n 6\
    \     {\n 7         /** @var static $res */\n 8         $res = $parseFn($this->remaining);\n\
    \ 9         $res->tokens = [...$this->tokens, ...$res->tokens];\n10         return\
    \ $res;\n11     }\n12 }\n```\n\n也就是说，它用剩余字符串调用传入的状态函数，然后将结果与自身合并，方式与我们之前看到的 `Writer`\
    \ monad 相同。不同之处在于 `$parseFn` 的来源。具体来说`$parseFn` 始终是 `$this->lex`。虽然我们可以将该逻辑内置到\
    \ `bind()` 中，但这将破坏它的单态行为。相反，让我们自己编写一个执行此操作的工具方法。\n\n```\n 1 abstract class Lexer\n\
    \ 2 {\n 3     // ...\n 4     public static function run(string $string): self\n\
    \ 5     {\n 6         $l = LexerStart::of($string);\n 7         while (! $l instanceof\
    \ Done) {\n 8             $l = $l->bind([$l, 'lex']);\n 9         }\n10 \n11 \
    \        return $l;\n12     }\n13 }\n```\n\n它也可以作为一个独立的函数，但静态方法可以保持它与 `Lexer`\
    \ 类靠近。\n\n`run()` 方法在每个状态上用其自己的状态函数调用 `bind()`，允许它在各个状态之间处理，在此过程中字符串转换为 `Token`\
    \ 对象的数组。从每个 `Lexer`/状态到下一个状态的返回行（取决于字符串，可能存在多个可能的状态）形成了一个图，它描述了我们特定 DSL 的整个状态机。\n\
    \n我们还需要一个结束条件，否则可能会陷入无限循环。这正是 `instanceof Done` 检查的作用所在；`Done` 仅仅是给定 lexer 状态上的一个空标记接口，用于指示过程已完成。特别有两个\
    \ lexer 状态实现了它：当没有无可做的事时的实际 `LexerDone` 状态，以及在输入无效时的 `Error` 状态。我们稍后会查看错误情况，目前这里是\
    \ `Done` 状态：\n\n```\n1 class LexerDone extends Lexer implements Done\n2 {\n3 \
    \    public function lex($string): Lexer\n4     {\n5         return $this;\n6\
    \     }\n7 }\n```\n\n这应该让人联起 `Either` monad 中的 `Error` 情况，因为它们起着类似的作用。\n\n为了确保我们不会陷入无限循环，让我们修改\
    \ `bind()`，使得如果没有剩余字符串，我们直接进入 `Done` 状态：\n\n```\n 1 abstract class Lexer\n 2 {\n\
    \ 3     // ...\n 4 \n 5     public function bind(callable $parseFn): Lexer\n 6\
    \     {\n 7         if (!$this->remaining) {\n 8             return new LexerDone($this->remaining,\
    \ $this->tokens);\n 9         }\n10 \n11         /** @var static $res */\n12 \
    \        $res = $parseFn($this->remaining);\n13         $res->tokens = [...$this->tokens,\
    \ ...$res->tokens];\n14         return $res;\n15    }\n16 }\n```\n\n在继续之前，让我们定义一些状态函数使用的额外工具。它们可以放在任何地方，但为了方便起见，我们将它们放在\
    \ `Lexer` 中：\n\n```\n1 abstract class Lexer\n2 {\n3     // ...\n4 \n5     protected\
    \ function skipSpaces(string $string): string\n6     {\n7         // 不要跳过换行符，因为它们具有词法意义。\n\
    8         return ltrim($string);\n9     }\n10 \n11     protected function readAlphaNumeric(string\
    \ $string): string\n12     {\n13         $matches = [];\n14         preg_match('/^\\\
    w+/', $string, $matches);\n15         if (empty($matches)) {\n16             return\
    \ '';\n17         }\n18         return $matches[0];\n19     }\n20 \n21     protected\
    \ function startsWith(string $string, string $needle): bool\n22     {\n23    \
    \     return stripos($string, $needle) === 0;\n24     }\n25 \n26     public function\
    \ tokens(): array\n27     {\n28         return $this->tokens;\n29     }\n30 \n\
    31     public function remaining(): string\n32     {\n33         return $this->remaining;\n\
    34     }\n35 }\n```\n\n`skipSpaces()` 和 `startsWith()` 应该是显而易见的。`readAlphaNumeric()`\
    \ 稍微有趣一点因为它使用了正则表达式。它从传入的字符串读取并返回一个字母字符串，但不会修改被调查的字符串。`tokens()` 和 `remaining()`\
    \ 只是访问器。\n\n为止，我们编写的所有都是起始状态，但如果我们向前看，任何关键字的逻辑几乎相同。与其为每个关键字重复代码，我们可以将其抽象到一个中间类。这在技术上不是函数式或单态技术，而是面向对象的技术，并且在这种情况下运行良好：\n\
    \n```\n 1 abstract class LexerKeyword extends Lexer\n 2 {\n 3     protected string\
    \ $keyword;\n 4     protected string $token;\n 5     protected string $nextState;\n\
    \ 6 \n 7     public function lex($string): Lexer\n 8     {\n 9         if ($this->startsWith($string,\
    \ $this->keyword)) {\n10             $nextState = $this->nextState;\n11      \
    \       return new $nextState(\n12                 substr($string, strlen($this->keyword)),\
    \ \n13                 [new $this->token]\n14             );\n15         }\n16\
    \ \n17         return LexerError::create(\n18             $string,\n19       \
    \      [],\n20             sprintf('Expected \"%s\"', strtoupper($this->keyword))\n\
    21         );\n22     }\n23 }\n```\n\n现在，任何期望下一个是关键字的状态只需如下：\n\n```\n1 class LexerStart\
    \ extends LexerKeyword\n2 {\n3     protected string $keyword = 'on';\n4 \n5  \
    \   protected string $token = On::class;\n6 \n7     protected string $nextState\
    \ = LexerOn::class;\n8 }\n```\n\n非常简单。"
- fmt: "\nNow we can look at `LexerOn`, which is the state of having just consumed\
    \ an “on” keyword. What’s expected next is the object on which a trigger is happening.\
    \ We call that a “subject.” It’s just an alphanumeric string, of which there are\
    \ several in our DSL. That means we can go ahead and make another abstracted state\
    \ for when the next expected value is an identifier string:\n\n```php\n 1 abstract\
    \ class LexerIdentifier extends Lexer\n 2 {\n 3     protected string $token;\n\
    \ 4     protected string $nextState;\n 5 \n 6     public function lex($string):\
    \ Lexer\n 7     {\n 8         $string = $this->skipSpaces($string);\n 9 \n10 \
    \        $identifier = $this->readAlphaNumeric($string);\n11 \n12         if ($identifier)\
    \ {\n13             $remain = substr($string, strlen($identifier));\n14      \
    \       $nextState = $this->nextState;\n15             $token = $this->token;\n\
    16             return new $nextState($remain, [new $token($identifier)]);\n17\
    \         }\n18 \n19         return LexerError::create(\n20             $string,\n\
    21             [],\n22             'Expected a valid identifier.'\n23        \
    \ );\n24     }\n25 }\n```\n\nThe logic should be fairly self-explanatory. It skips\
    \ any whitespace, then grabs an alphanumeric string to turn into a token. Then\
    \ it returns the next state, with that token added. If there’s no identifier,\
    \ it returns an error state.\n\nThe specific “on” state then is trivial:\n\n```php\n\
    1 class LexerOn extends LexerIdentifier\n2 {\n3     protected string $token =\
    \ Subject::class;\n4     protected string $nextState = LexerSubject::class;\n\
    5 }\n```\n\nThat is, consume an identifier string to a token of the `Subject`\
    \ class, then transition to `LexerSubject`.\n\n`LexerSubject` is the state of\
    \ having just consumed a subject identifier, and the next value is supposed to\
    \ be a dot. A dot is a literal, which is close enough to a keyword, so we consume\
