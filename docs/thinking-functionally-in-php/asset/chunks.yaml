    \    ->map('strtolower')\n    ->bind('lengthCheck')\n    ->bind('existsCheck')\n\
    \    ->bind(fn(string $s): Result => characterCheck('/^[a-zA-Z0-9]*$/', $s))\n\
    \    ->bind('startsWithLetter');\n```\n\nNow even in the success case, `$result`\
    \ contains the now-modified string, and we can continue to use that.\n\n## Collapse\
    \ the Types\n\nThe code above shows the generic approach to an `Either`, where\
    \ every value gets wrapped. However, it has two problems:\n\n1. The `Failure`\
    \ wrapper is kind of pointless since it only ever contains a `ValidationError`.\n\
    2. `ValidationError` is kind of pointless, since it only ever wraps an opaque\
    \ string.\n\nWe can solve both problems in this particular case by shifting the\
    \ class structure while retaining the monad-like behavior.\n\n```php\nclass Result\
    \ { ... }\n\nclass Success extends Result { ... }\n\nclass ValidationError extends\
    \ Result { ... }\n\nclass StringTooShort extends ValidationError {}\nclass UsernameExists\
    \ extends ValidationError {}\nclass InvalidCharacters extends ValidationError\
    \ {}\nclass DoesNotStartWithLetter extends ValidationError {}\n```\n\nNow, the\
    \ validators need only return one of `Success` or a subclass of `ValidationError`.\
    \ For example:\n\n```php\nfunction lengthCheck(string $s): Result\n{\n    return\
    \ strlen($s) >= 3\n        ? Success::of($s)\n        : new StringTooShort();\n\
    }\n```\n\nThat makes the code simpler and easier to read, and provides more robust\
    \ error handling potential through the type system. We can now programmatically\
    \ differentiate between a username that’s too short and one that doesn’t start\
    \ with a letter, for example, which makes displaying useful error messages to\
    \ the user easier. It also gives us a complete list of the possible error conditions:\
    \ it’s all the subclasses of `ValidationError`.\n\nWhether the error classes themselves\
    \ contain further error display logic or that’s handed off to some other routine\
    \ is, from this chapter’s point of view, a matter of personal preference.\n\n\
    ## Alternate Approach\n\nThis is a relatively simple case. For this simple case,\
