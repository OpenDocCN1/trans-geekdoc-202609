    \ (Wait, I are the quotes).\n\nI will provide the formatted version of the text\
    \ you provided in the prompt's first block under \"以下是需要排版的文本\":\n\n[content]\n\
    In particular, this means embracing “skinny objects”: Value objects that have\
    \ little business logic of their own other than enforcing data integrity. An that\
    \ that contains data should never, ever have a dependency on a service object,\
    \ or auxiliary logic object. Its constructor should be concerned only with its\
    \ own data and nothing else.\n\nYes, that does go against traditional OOP dogma,\
    \ in which objects form a complex network of interacting agents. That’s because\
    \ it’s a functional approach, not an OOP approach. And, given PHP’s shared-nothing,\
    \ stateless runtime model, that way of designing objects tends to work better\
    \ in practice aquello as the setup for it is much, much simpler.\n\nAdditionally,\
    \ for value objects that you can guarantee are internal to your library or module,\
    \ don’t sweat property access as much. If the object is purely for internal use,\
    \ and it seems wasteful to build getters and setters that do nothing but wrap\
    \ private properties, skip them and use a public property instead. From a functional\
    \ point of view, that’s fine. (That applies only for strictly internal implementation\
    \ detail objects, however. For objects that form your API, the usual encapsulation\
    \ practices still apply.)\n\n## Embrace Functions as Values\n\nDon’t think of\
    \ functions (or any other callable, really) as stand-alone, immutable, set-in-stone\
    \ things. Rather, a function is a value. You can create one as easily as any other\
    \ value, pass it around as a value, and use it as a value. You can have function-values\
    \ that produce function-values if the situation calls for it.\n\nCertainly, it\
    \ is possible to create a horrible mess that way if you’re not careful. Inlining\
    \ multiple nested callbacks, for instance, is a proven terrible idea. However,\
    \ adapting a function that expects one interface (say, multiple parameters) to\
    \ one that wants a different interface (a single parameter, or even no parameters)\
    \ using a closure should be a natural part of your workflow. As with any other\
    \ technique, it can be used wisely to produce very readable code or badly to produce\
    \ spaghetti code.\n\n## Make Single-Method Callable Services\n\nAs previously\
    \ observed, a service object with only a single public method is isomorphic to\
    \ (effectively the same thing as) a free-standing function that is closed over\
    \ some of its parameters. If you have a service with only a single method, don’t\
    \ bother naming it. Just use the `__invoke()` method. The object now becomes usable\
    \ exactly like a function: Stick `()` after it to call the `__invoke()` method.\
    \ Referencing that method as a callable becomes easier as well, since there’s\
    \ no screwy array syntax needed; just the variable name of the object is sufficient.\n\
    \nThat may look weird at first, but after a while, it should start to feel even\
    \ more natural, to the point you may start restructuring your services to be single-method\
    \ more often. This is especially true for things like controller actions, command\
    \ objects, and other objects designed to have a single “do the thing” method;\
    \ just use `__invoke()` for that.\n\n## Think in Terms of Pipelines and Data Flow\n\
    \nObject-oriented thinking traditionally encourages you to think of objects as\
    \ a connected graph of persistent things, like neurons in a network. Functional\
