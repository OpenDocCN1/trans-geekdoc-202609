    在实践中，在 `PHP` 中严格追求不可变性真的值得吗？坦率地说，我不认为。在边界处保持不可变是强制的，以避免“远距离副作用”（spooky action
    at a distance），因此要始终构建并使用不可变值对象，并保持值对象与服务对象/函数之间的严格分离。但在函数内部，尽量避免修改变量，但如果这会导致结果变得太复杂或太慢，大不必纠结。专注于关注代码的可读性。什么让函数最容易推理、阅读和理解？就怎么做。如果这意味着要修改数组或为了构建器对象（builder
    object）重用变量，那就这样做。只要维持了不可变的边界，从外部看，该函数仍然是纯的。


    如果你的函数足够长或复杂，导致难以追踪在函数执行过程中可能会变化的变量，这意味着你的函数太长、太复杂了，无论如何应该拆分。


    # 第二部分


    # 范畴论


    在我们继续下去之前，我们需要暂时离开代码，进入范畴论的领域。


    停，请不要跳过这一章！我保证我会很温柔的。


    范畴论是数学中关于……嗯，范畴（categories）的领域。范畴是一种抽象，就像编程中的类型系统是一种抽象一样，只不过是程度提升到了 11 层。还是两次。本质上，它提取了编程中的许多概念，并将它们完全从编程中抽象出来，以至于只要你能将它们挤进某些数学规则，它们就可以适用于各种概念。在那种高度的抽象层，可以证明一些通用性命题，当这些命题重新应用到较低层次时，能够让你以更健壮的方式处理问题。


    在满足某些条件的情况下，范畴论的意义在于超越纯编程进行抽象，并在更通用的层面推导出规则。那么，只要在特定的示例满足了这些条件，这些规则依然有效，这意味着你可以基于它们的真实性来做出假设。


    这一过程的大部分对于证明编程中的问题非常有价值，这些问题对于经验丰富的程序员来说直觉上是正确的，但范畴论提供了一种稳固且可靠的建立它们的方法。


    为了让生活更困难，范畴论还使用了一套与编程完全不同的术语，除了某些地方使用了相同的词但指代略有不同的概念之外。为了保险起见，它对集合论也采取了同样的做法。例如，范畴论中的“对象”（object）与程序员认为的“对象”几乎没有关系。许多概念也有多个名称，这进一步增加了复杂性。程序员所说的“函数”（function）实际上，根据你的心情被戏称为“箭头”（arrow）或“态射”（morphism）。


    仿佛这还不够，编程语言 `Haskell` 经常被视为函数式编程和范畴论的定义术语标准，尽管在技术上它仅仅是其中一种特别定制的实现。（这并不是夸张。Haskell
    最初被开发为数学家的一种共享语法，用于编写逻辑和类型证明，为了方便起见，它被制成了可执行程序。后来，一些非常傻的人发现可以在其中编写实际程序并付诸行动。）


    函数式编程在技术上是与范畴论独立演化的，但在实践中，函数式编程的许多益处源于通过确保满足某些条件，从而假设那些规则已经存在。例如，“只要是纯函数，你就可以一直缓存结果”，这种情况确保了某个特定条件的成立（函数是纯的），意味着你可以依赖某些假设（它是总是可缓存的）。以此类推，某些类型的函数始终可以被视为查找表（lookup
    tables）而非操作。这个查找表最终比操作效率高还是低，这“仅仅”是一个优化问题。因此，理解函数式编程的高级部分至少需要一点范畴论。


    范畴论的另一个方面是，它大部分取决于从正确的角度观察问题。如果你能把一个问题侧过来放，让它看起来像另一个你已经解决过的问题，那么你也解决了这个新问题。我们在这里做的的大部分工作就是将一个问题侧过来放，让它看起来像我们已经熟悉的东西。（范畴论对于这种“侧向观察”有严密的机制，但为了简洁起见，我将非正式地这样做。）


    这并不是一本关于范畴论的书。这是一个关于我们这些在根本上非函数语言（`PHP`）中工作的程序员相关的范畴论部分的非正式、基于直觉的总结。


    ## 什么是范畴？


    一个“范畴”是以下集合：


    * 零或多个 `Objects`（对象）

    * 若干从一个对象到另一个对象的 `Arrows`（箭头），这两个对象可以是同一个对象


    如果你在纸上画出它们，你将得到一系列点（对象）和连接它们的线（箭头）。箭头通常有另一个名字 `morphism`（态射）：“morph”在希腊语中是“形式”的意思，“ism”
    意味着“……的研究”。或者，用更口语化的英语来说，“morph” 就像“改变”，而“ism” 意味着“……玩意儿”。我觉得这种口语化的版本在理解应用于编程的态射时是一种描述性更好的方式。）


    要让一个由点和线组成的集合合合范畴的标准，它必须遵循几条规则：


    * 每个对象都有一个“恒等态射”（identity morphism）；即一个指向自身的箭头

    * `Morphisms`（态射）是可复合的；也就是说，它们可以链联在一起

    * `Morphisms`（态射）的复合满足结合律；也就是说，将多个态射串联时，分组方式并不重要

    * `Morphisms`（态射）是保持结构的——稍后详细介绍


    ![一个简单的双对象范畴](img/basic-category.png)


    一个简单的双对象范畴


    态射通常用箭头表示，例如：`f: A → B` 意味着“f 是从对象 A 到 B 的态射”。取决于范畴，从 A 到 B 可以有无数个态射。态射的源对象被称为
    `domain`（域）。它的目标对象被称为 `codomain`（陪域）。这种“玩意儿”与其另一端“另一玩意儿”的模式在范畴论中是一致的。


    态射复合通常用 `∘` 表示。如果存在从 X 到 Y 的态射 `f` (`f: X → Y`)，以及从 Y 到 Z 的态射 `g` (`g: Y → Z`），那么我们可以将它们连接起来产生一个名为
    `g ∘ f` 的态射，它从 X 映射到 Z。（是的，是从右向左读。抱歉。这不是我发明的。）


    ![从 X 到 Z 的态射复合](img/basic-composition.png)


    从 X 到 Z 的态射复合


    ...


    之前的节讨论过函数复合，即将一个函数的返回值传递给另一个函数并将它们“串联”在一起。这正是我们在这里讨论的完全相同的复合。`∘` 符号是我们之前编写的 `compose()`
    函数的数学表达式。所以如果我们在讨论 PHP 函数 `f(X $x): Y` 和 `g(Y $y): Z`，这意味着：


    ```php

    g(f($x)) == compose(''f'', ''g'')($x) == 一个接收 X 并返回 Z 的函数

    ```


