    \nfunction railway_bind(callable $fn): callable\n{\n    return fn($param): Result\n\
    \        => $param instanceof ValidationError\n            ? $param\n        \
    \    : $fn($param->value);\n}\n```\n\n`railway_bind` (named in honor of Scott\
    \ Wlaschin’s example) takes a callable we assume returns a `Result`, and turns\
