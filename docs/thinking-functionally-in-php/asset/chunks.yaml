- fmt: '

    The identity morphism is an arrow from an object to itself: `f: A → A`, generally
    called `id`. The identity morphism must be commutative. That is, `id ∘ f == f
    ∘ id == f`. There may be infinitely many other arrows from an object to itself,
    but only one is the identity morphism. Morphisms where the domain and codomain
    are the same, are called `endomorphisms`, “endo” being the Greek prefix for “within.”
    (“Endomorphism” thus means “within the same form thingie.”) It’s the same “no-op”
    pattern we’ve seen before, like `0` for addition and `1` for multiplication, except
    this time `id` is the “no op function,” i.e., no-op value in the function of composing
    two functions.


    When viewing programming through the lens of category theory, a morphism is any
    single-parameter structure-preserving pure function, and objects usually represent
    types.


    The idea of composition is core to both category theory and functional programming.
    In a sense, it is simply the age-old idea of “divide and conquer” applied to logic;
    if you break down your problem into small, easily digestible, almost trivial pieces
    (functions) with a clear and safe way to put those trivial pieces together, you
    can solve your overall problem by simply plugging those trivial pieces together
    in ways that follow the rules, and you are (almost) guaranteed to have a working
    answer at the end.


    Think of it like LEGO blocks; by establishing a very clear standard size for blocks
    and the bumps on them, you can safely construct an infinite number of sculptures
    from the same basic blocks. Functions are those blocks.


    The identity morphism in programming is, conveniently, trivially simple in almost
    all cases:


    ```

    1 function id($x) {

    2     return $x;

    3 }

    ```


    It should be self-evident that it is commutative.


    ## Objects


    Objects are… thingies. They do not necessarily have any bearing on objects from
    object-oriented programming, which are “instantiations of a defined class of data
    properties and methods.” An object could be:


    *   An integer, in a category that consists of all integers

    *   A string, in a category that consists of ASCII strings less than 10 characters
    long

    *   A set, in a category where each object is a set of something (“set” in the
    mathematical sense, meaning a unique list of values, which could themselves be
    sets)

    *   A data type, in a category where each object is a data type representable
    by a programming language

    *   A law, in a category where each object is a paragraph of the legal code


    A category, therefore, may consist of a small, finite number of objects, a huge
    but finite number of objects, or a conceptually infinite number of objects (as
    in the case of “all integers”). A category may also have zero arrows other than
    the identity morphisms, or there may be multiple arrows from one object to another
    object.


    A category that has only identity morphisms is called a “discrete category” and
    is generally described as “boring.”


    ## Some Definitions


    Before we continue, let’s establish a few more definitions and notations to make
    the following sections easier.


    *   Integers are any whole number, positive or negative, including zero. The set
    of all integers is denoted ℤ. It is an infinite list in concept, although in PHP
    it is limited to `PHP_INT_MIN` to `PHP_INT_MAX`.

    *   Natural numbers refer to positive integers plus zero. The set of all natural
    numbers is denoted ℕ. (Programmers sometimes refer to these as “unsigned ints.”)
    It is an infinite list.

    *   Positive integers without zero is denoted ℕ+.

    *   Real numbers refer to any number, including fractional or decimal numbers.
    The set of all real numbers is denoted ℝ. Programmers tend to call these “floating
    point” numbers, aka `float`.

    *   A `total function` is one that is valid for all permutations of its input
    (domain). A function may be total in one domain but not in another, similar domain.

    *   A `partial function` is a function that is only valid for some input values
    in its domain. (Do not confuse “partial function” with “partial function application,”
    which we talked about earlier.)


    All functions are exclusively either total or partial.


    Morphisms must be total functions. That is, they must be valid for all permutations
    of their input, the source object. For example, the morphism “absolute value”
    (`abs`) is a total function for all real numbers ℝ, because it can handle any
    ℝ as an input. Square root, however, is only a partial function over ℝ because
    it fails for negative numbers. Square root is, however, a total function over
    non-zero natural numbers, ℕ+.


    ## Structure


    We said above that morphisms need to be “structure preserving.” While we’re not
    allowed to peer inside an object to see if it has internal structure, it may have
    internal structure. Morphisms must respect that. For example, consider a category
    which has an object that is the set ℝ (real numbers) and another object that is
    the set ℤ (integers). Both sets are ordered; that is, 4.5 >= 2.3 in ℝ. If we have
    a morphism `floor` from ℝ to ℤ, then that ordering must be preserved. If we apply
    `floor` to 4.3, we get 4. If we apply `floor` to 2.3, we get 2. 4 >= 2. So yes,
    the order is preserved. More formally, `floor: ℝ → ℤ`. The function `ceil: ℝ →
    ℤ` also maps from ℝ to ℕ, is still order/structure preserving, but maps to different
    values.


    ![Structure preserving morphisms among numbers](resources/numbers.png)


    Structure preserving morphisms among numbers


    Structure preserving morphisms among numbers is a trivial example, but it becomes
    more important when we look at morphisms between categories.


    ## Let’s Get Meta


    Bear with me here for a moment, because we’re going to look at the world from
    a few angles. We’ve said that categories are a collection of objects and arrows;
    we’ve informally discussed sets, which are a collection of objects. “is larger
    than” from the previous example, for instance, is an arrow. Does that mean a set
    meets the definition of a category?


    In fact, sets are the most interesting (for us) kind of category. ℤ, the set of
    integers, is a category of integers. ℕ is the set of natural numbers, and thus
    the category of natural numbers. Types in programming are themselves a special
    case of sets; Booleans are a set with two values: `true` and `false`. `int` is
    the type that is the set ℤ. And so forth.


    But since we can have a category of sets, and sets are themselves categories,
    that means we can have a category of categories. In fact, there is a category
    that is the category of all categories, except itself.


    `functor`, which is a combination of “function” and “factor.” “Factor,” in this
    case, derives from Latin and means “doer, maker, or performer.” So “functor” literally
    translates as “function that does a thing,” but in Latin, whereas the rest of
    mathematics primarily uses Greek. (I presume mathematicians are just indecisive.)


    A functor is a morphism between categories; or, put another way, it’s a way of
    transforming one category (`A`) into another (`B`) in a structure-preserving way.
    In this case, “structure preserving” means all the objects in category `A` translate
    (or “map”, or “convert”) to one and only one object in category `B` (but multiple
    of them could map to the same object in category `B`), and all the arrows in `A`
    also translate to arrows in `B` (but again, multiple arrows in `A` can map to
    the same arrow in `B`).


    ![A functor between two categories](resources/functor.png)


    A functor between two categories

