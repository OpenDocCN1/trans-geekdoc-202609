    \ is this a real value?” gets thrown in your face, and you’re less likely to forget\
    \ to check the unhappy path. (You could still be lazy, but now you have no excuse.)\n\
    \nOther libraries and languages have other additional utilities here. For instance,\
    \ Java’s `Optional` class has some nice default-handling utility methods instead.\
    \ Translated to PHP, they’d be:\n\n```\n 1 class Optional\n 2 {\n 3     private\
    \ $value = null;\n 4 \n 5     // ...\n 6 \n 7     public function orElse($default)\n\
    \ 8     {\n 9         return !is_null($this->value) ? $this->value : $default;\n\
    10     }\n11 \n12     public function orElseGet(callable $default): bool\n13 \
    \    {\n14         return !is_null($this->value) ? $this->value : $default();\n\
    15     }\n16 }\n```\n\nIn this approach, you’re forced to provide a default value\
    \ when extracting the wrapped value, just in case. If deriving the default is\
    \ potentially expensive, you can provide a function that only gets called if needed.\n\
    \nThere’s a lot more you can do here if you want and still qualify as a “Maybe\
    \ Monad.”\n\n## An Alternate Implementation\n\nJust for fun, let’s see if we can\
    \ get rid of those conditionals in the `Optional` class, too. In both Haskell\
    \ and Rust, the Maybe Monad is implemented with type classes. In Haskell, `Maybe`\
    \ is defined as one of `Just` or `Nothing`. In Rust, `Option` is defined as one\
    \ of `Some` or `None`. PHP doesn’t have type classes, but we can approximate them\
    \ using subclasses. (That is, this is an example of the “sum types” we discussed\
    \ earlier.) Here’s an alternate way to implement our `Optional` monad:\n\n```\n\
    \ 1 interface Optional\n 2 {\n 3     public function bind(callable $fn): self;\n\
    \ 4 \n 5     public function valid(): bool;\n 6 \n 7     public function value();\n\
    \ 8 \n 9     public function orElse($default);\n10 }\n11 \n12 class None implements\
    \ Optional\n13 {\n14     public static function none(): self\n15     {\n16   \
    \      return new static();\n17     }\n18 \n19     public function bind(callable\
    \ $fn): self\n20     {\n21         return $this;\n22     }\n23 \n24     public\
    \ function valid(): bool\n25     {\n26         return false;\n27     }\n28 \n\
    29     public function value()\n30     {\n31         throw new \\RuntimeException('Sorry,\
    \ Schrodinger');\n32     }\n33 \n34     public function orElse($default)\n35 \
    \    {\n36         return $default;\n37     }\n38 }\n39 \n40 class Some implements\
    \ Optional\n41 {\n42     protected $value;\n43 \n44     private function __construct($value)\n\
    45     {\n46         $this->value = $value;\n47     }\n48 \n49     // Alias \"\
    of\", \"pack\", \"lift\", \"unit\", \"return\", all the same thing.\n50     public\
    \ static function of($value): self\n51     {\n52         return new static($value);\n\
    53     }\n54 \n55     public function bind(callable $fn): self\n56     {\n57 \
    \        return $fn($this->value);\n58     }\n59 \n60     public function valid():\
    \ bool\n61     {\n62         return true;\n63     }\n64 \n65     public function\
    \ value()\n66     {\n67         return $this->value;\n68     }\n69 \n70     public\
    \ function orElse($default)\n71     {\n72         return $this->value;\n73   \
    \  }\n74 }\n75 \n76 function getShoppingList(User $user, string $listName = 'main'):\
    \ Optional\n77 {\n78     isset($user->lists[$listName]) \n79         ? Some::of($user->lists[$listName])\n\
    80         : None::none();\n81 }\n```\n\nI prefer the second version, but you’re\
    \ free to disagree. It’s only verbose because of PHP’s limited syntax and the\
    \ extra newlines required by PSR-12 (the PHP-FIG code formatting standards).\n\
    \n## A Note on Types\n\nYou may note that this chapter omits types on most method\
    \ calls. Given how useful types are for functional programming that may seem odd.\n\
    \nThat’s because PHP’s type system is still relatively weak compared to many other\
    \ languages. In particular, it lacks “generics.” With generics, one can define\
    \ a type in terms of another type, such as “an `Optional` that contains a `string`”\
    \ or “an `Optional` that contains a `User` object.”\n\nWe discuss generics in\
    \ more detail in Part Four.\n\nIn general, to do functional programming well requires\
    \ either a type system robust enough it can do generics or weak enough that types\
    \ can be omitted entirely. The stronger alternative with generics is, I would\
    \ argue, superior, for all the same reasons that typed code generally is superior.\
    \ It allows the language syntax and compiler to do most of the debugging work\
    \ for you, and ensure you are never trying to connect a square peg to a round\
    \ hole. It would be even nicer with type inference, which allows you to omit types\
    \ when the language is able to derive the type from context.\n\nThat is not PHP,\
    \ however, which means we have to fall back to the untyped, implicit version and\
    \ lose some type safety. That is a legitimate argument against functional programming\
    \ in PHP, although there are enough other benefits that it is frequently worth\
    \ the trade-off.\n\nIf you ever see someone lamenting the lack of generics in\
    \ the language, or wishing it had them, this is why.\n\n# Either/Or and Error\
    \ Handling\n\n## The Problem\n\nThe “Maybe Monad” is a nice and simple example,\
    \ but only if you don’t care why a given value is missing. If you want to indicate\
    \ what the error was, then you need something more robust than just `null`. We\
    \ want the same general outline as `Optional`, though, with an error triggering\
    \ a “fall through” that skips the rest of the composed functions.\n\nIf you squint,\
    \ that may look a lot like an exception. It is certainly similar, but with some\
    \ important differences:\n\n1.  We want to use errors for control flow, whereas\
    \ exceptions are supposed to be for “really exceptional” cases like “the database\
    \ is missing,” not “there are no sales happening for that product.”\n\n2.  In\
    \ PHP, exceptions are very expensive to create. Largely that’s due to the need\
    \ to build the backtrace, which is there even if you don’t use it or even throw\
    \ it, but either way, it means using exceptions for common cases is extremely\
    \ inefficient. (That’s not necessarily true in other languages, such as Python,\
    \ but this is a PHP book.)\n\n3.  It’s easy to throw an exception and assume it\
    \ will be “someone else’s problem,” when it really should be the caller’s problem.\
    \ The temptation to write just the happy path and throw exceptions where things\
    \ fail and then forget to handle the unhappy path is quite high. As with `Optional`,\
    \ we want the code to force us to care about the unhappy path, preferably before\
    \ a user finds themselves on it and falls off the cliff at the end.\n\n4.  Exceptions\
    \ violate purity; a function that throws an exception affects the state of the\
    \ world in a way other than its return value, potentially by unrolling the program’s\
    \ entire call stack and crashing. A function that can arbitrarily cause your program\
    \ to crash, depending on what try-catch blocks are placed outside of it, is decidedly\
    \ impure.\n\nWhat we really want is to allow a function to return *either* a value\
    \ or an error. In fact, that’s the standard name for it: *Either*.\n\n## The Example"
