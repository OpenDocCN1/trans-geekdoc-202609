- fmt: '

    Finally, acknowledge that you’re writing PHP. PHP allows you to write functional-style
    code, and you will likely benefit from doing so more often. However, PHP is not
    a fundamentally functional language. Sometimes a functional approach really is
    less readable or maintainable than the object-oriented style you’re used to. Or,
    more typically, a smart integration of functional principles with object-oriented
    syntax will end up being the sweet spot.


    PHP is a multi-paradigm language. Use the paradigm that leads you to the most
    readable, maintainable, testable, and performant result you can. Often that will
    be a functional approach, but not always.


    At the risk of mixing references, always use the right double-claw hammer for
    the job.


    # Further Resources


    It’s common for books and articles to have a “Further Reading” section, but of
    course, in the 2020s there’s a vast amount of excellent resources that are not
    in books but in videos, slide shows, and other non-traditional media. They’re
    still valuable if you want to know more about functional programming in general.


    The following is a collection of resources I have found helpful in preparing this
    book and that I recommend for others whose appetite has been whet by these pages.
    (Or for those who were thoroughly confused by it and want better; my apologies.)


    ## Books


    “[Category Theory for Programmers](https://bartoszmilewski.com/2014/10/28/category-theory-for-programmers-the-preface/),”
    by Bartosz Milewski (2018).


    This is the book I wish existed 20 years ago, or even 10 years ago. It goes through
    category theory from the very basics on up, on the assumption the reader is a
    programmer rather than a Ph.D. mathematician that already knows category theory.
    It also, uniquely, uses examples from both `Haskell` and `C++`, the latter of
    which is far more helpful to programmers in PHP or, really, most other languages
    that aren’t built on a purely category theory foundation to begin with. If it
    has a failing it’s that not enough examples have a `C++` version, and the index
    is far thinner than I’d like. Still, a strongly endorsed read.


    “Basic Category Theory for Computer Scientists,” by Benjamine C. Pierce (1991).


    An oldie, but very short. It’s a highly dense book that goes straight to hard
    core theory and includes a large number of Greek letters. It’s only 72 pages long,
    realistically; the rest of the book is a lengthy further reading section and index.
    It’s useful primarily as a reference.


    “[From design patterns to category theory](https://blog.ploeh.dk/2017/10/04/from-design-patterns-to-category-theory/),”
    by Mark Seemann.


    This isn’t a book per se, but a long series of articles that effectively form
    an online book. It approaches the topic from a different angle, and one I found
    reasonably useful. Its example language is `C#`, which should be somewhat comprehensible
    for PHP developers. Just remember that `C#` makes heavy use of generics.


    ## Videos


    [Railway-Oriented Programming](https://fsharpforfunandprofit.com/rop/)


    Scott Walachin’s presentation and accompanying slides on Railway-Oriented Programming.
    This is the talk where I really started to “get” the point of monads, even though
    the talk insists that it’s not about monads. It’s about structuring error handling
    pipelines in a useful way, which just happens to look like an `Either` monad.
    He includes some train jokes, too.


    [Functional Core, Imperative Shell](https://www.destroyallsoftware.com/screencasts/catalog/functional-core-imperative-shell)


    Gary Bernhardt’s video on the “functional core, imperative shell” methodology.
    Although the video is in `Ruby`, the concepts apply in any language.


    ## Papers


    [Monads for Functional Programming](http://homepages.inf.ed.ac.uk/wadler/papers/marktoberdorf/baastad.pdf)


    Now that you’ve been through an introduction to functional programming, category
    theory, and the infamous monad, the original paper by Philip Wadler might make
    sense. It didn’t to me on first read, not even in the slightest, but if I did
    my job right with this book, you may now be able to follow it.


    [Why do Monads Matter?](https://cdsmith.wordpress.com/2012/04/18/why-do-monads-matter/)


    This is a much more academic and abstract take on monads, explaining many of the
    same concepts around dependency, uncertainty, and side effects that we have covered
    here. Now armed with some concrete experience from this book, it may even make
    sense.

    '
