    \ `Success` 或 `ValidationError` 的子类之一。例如：\n\n```php\nfunction lengthCheck(string\
    \ $s): Result\n{\n    return strlen($s) >= 3\n        ? Success::of($s)\n    \
    \    : new StringTooShort();\n}\n```\n\n这使得代码更简单、易读，并且通过类型系统提供了更健壮的错误处理潜力。我们现在可以编程地区分太短的用户名和不以字母开头的用户名，这使得向用户显示有用的错误信息变得更容易。它还为我们提供了所有可能的错误条件的完整列表：即所有\
    \ `ValidationError` 的子类。\n\n错误类本身是包含进一步的错误显示逻辑，还是将其交给其他例程，从本章的角度来看，这取决于个人喜好。\n\
    \n## 替代方案（Alternate Approach）\n\n这是一个相对简单的案例。对于这种简单的情况，这似乎包含了太多繁琐的仪式感（ceremony）。我们可以做得更好吗？\n\
    \n事实上，可以。让我们从刚才看到的相同验证器（现在返回特定类型的错误对象）开始，并从包装类中剥离 `map` 和 `bind`。这意味着 `ValidationError`\
    \ 可以仅仅是一个接口，带有任意数量的实现错误类。`Success` 只是一个对值的无聊包装器。\n\n```php\ninterface Result {}\n\
    \nclass Success implements Result\n{\n    protected $value;\n\n    public function\
    \ __construct($value)\n    {\n        $this->value = $value;\n    }\n\n    public\
    \ function value()\n    {\n        return $this->value;\n    }\n\n    public static\
    \ function of($value): self\n    {\n        return new static($value);\n    }\n\
    }\n\ninterface ValidationError extends Result {}\n\nclass StringTooShort implements\
    \ ValidationError {}\nclass UsernameExists implements ValidationError {}\nclass\
    \ InvalidCharacters implements ValidationError {}\nclass DoesNotStartWithLetter\
    \ implements ValidationError {}\n```\n\n接下来，我们仍然需要 `bind` 我们的验证器函数，以便它们能够处理 `Result`\
    \ 对象。在这种情况下，它只有两种可能的操作，所以我们可以直接将它们放入一个带有 `if` 语句的单一函数中：\n\n```php\nfunction railway_bind(callable\
    \ $fn): callable\n{\n    return function ($param) use ($fn) {\n        if ($param\
    \ instanceof ValidationError) {\n            return $param;\n        }\n     \
    \   return $fn($param->value);\n    };\n}\n\n// 或者更短的版本：\n\nfunction railway_bind(callable\
    \ $fn): callable\n{\n    return fn($param): Result\n        => $param instanceof\
    \ ValidationError\n            ? $param\n            : $fn($param->value);\n}\n\
    ```\n\n`railway_bind`（为了纪念 Scott Wlaschin 的示例命名）接受一个假设返回 `Result` 的可调用对象，并将其转换为一个接受\
    \ `Result` 并返回 `Result` 的对象；具体来说，`Error` 轨道会直接穿透，而快乐路径（happy path）则调用原始的可调用对象并返回其\
    \ `Result`。用于转换 `strtolower` 的 `fmap` 也同样直观（注意这里我们使用的是 `fmap` 而不是 `map`，因为它没有被立即调用）。\n\
    \n```php\nfunction railway_fmap(callable $fn): callable\n{\n    return fn($result):\
    \ Result => Success::of($fn($param->result));\n}\n```\n\n现在我们有了一系列接收 `Result`\
    \ 的函数，可以使用旧的方法将它们串联起来：\n\n```php\n$validator = compose(\n    railway_fmap('strtolower'),\n\
    \    railway_bind('existsCheck'),\n    railway_bind(fn(string $s): Result\n  \
    \      => characterCheck('/^[a-zA-Z0-9]*$/', $s)),\n    railway_bind('startsWithLetter')\n\
    );\n\n$result = $validator(Success::of('ABC123'));\n```\n\n现在我们又得到了一个包装了用户名的 `Success`，或者是某种\
    \ `ValidationError`。\n\n## Either 如何？\n\n一个重要的观察是，正如我们之前提到的，`Either` 是一个积和类型（coproduct\
    \ type）。也就是说，它是两种类型的 `OR`（或）。`OR` 很好地具有结合律。这意味着 `Either A | B` 和 `Either B | C`\
    \ 可以组合成 `Either A | B | C`。\n\n# 跟踪数据（Tracking Data）\n\n## 问题\n\n到目前为止，我们讨论了两种处理错误的方法，但单子模式还能提供更多功能。例如，虽然函数式系统中的函数无法保留状态，但它们可以将值传递给包含状态的其他函数。本质上，调用栈是状态存储的地方。\n\
    \n## 示例\n\n假设我们要进行某种文本分析。例如，我们想获取一段长文本并确定其词数、行数、阅读水平、包含的类语言等。在这一过程中，我们可能想要进行一些归一化处理，因此如果我们避免可变变量，就不能独立地对字符串调用操作。\n\
    \n"
- fmt: "\nWhat we want is a composed pipeline of analysis functions that can modify\
    \ the string as they go, but also record side-band data about the string. What\
    \ we want at the other end is that side-band data.\n\n## The Category Theory Solution\n\
    \nIt may seem like a stretch to think of this as a new category of data, but in\
    \ some sense it is. We’re lifting our analysis functions from “string” to “string\
    \ and a log.” That’s no more of a stretch than “type or `null`.”\n\nWhat’s different\
    \ in this case is that we’re not changing the flow of control based on the enhanced\
    \ type. Rather, the enhanced type is a product type of a string and a log. When\
    \ the log gets added to, it is now a new value. (Remember the whole chapter on\
    \ value objects.)\n\nWhere the `Either` monad lifts types to “type OR type”, this\
    \ monad pattern lifts types to “type AND type.” Because it allows functions to\
    \ write to a log, it’s common name is the `Writer` monad.\n\n## The Programming\
    \ Solution\n\nIn the interest of flexibility, let’s assume the list of stats to\
    \ collect is unbounded; it’s just a key/value pair of strings, which we can model\
    \ as an associative array.\n\nThat makes it tempting to have our analysis functions\
    \ just return a three element array: `[string, label, stat]`. While that is technically\
    \ possible, it fails in a number of ways.\n\n*   “Tuple arrays” (mixed-type compound\
    \ variables where the position is important) are notoriously not self-documenting.\n\
    *   We could switch to an associative array to give it labels, but associative\
    \ arrays are still strictly less documenting than a proper data type (class).\n\
    *   We don’t want to lift our string to an array! That’s the wrong category. We\
    \ want to lift our string to a string-and-log.\n\nRemember, the return value of\
    \ the function is a value in our lifted/enhanced type. So it has to be an object,\
    \ on which we can then invoke more analysis functions. Let’s start with our product\
    \ type itself, then:\n\n```\n1 class Stats\n2 {\n3     protected string $string;\n\
    4 \n5     protected array $log;\n6 }\n```\n\nNote: I would normally argue very\
    \ strongly against using arrays so willy nilly, as PHP arrays make a terrible\
    \ data structure for data modeling and have no guaranteed immutability. However,\
    \ this chapter is about the `Writer` monad, not the pitfalls of arrays, so to\
    \ save space we’ll just roll with `$log` as an array.\n\nNow we need a `unit`\
    \ operation for it, which is just a constructor and optionally an `of` method:\n\
    \n```\n 1 class Stats\n 2 {\n 3    // ...\n 4 \n 5     protected function __construct(string\
    \ $string, array $log)\n 6     {\n 7         $this->string = $string;\n 8    \
    \     $this->log = $log;\n 9     }\n10 \n11     public static function of(string\
    \ $string, array $log = []): self\n12     {\n 13         return new static($string,\
    \ $log);\n14     }\n15 }\n```\n\nFor ergonomics, I’m forcing external users to\
    \ use the `of` method, which makes `$log` optional, but it’s equally valid to\
    \ make the constructor public and eliminate `of` entirely.\n\nNow that we can\
    \ create a new “string with side-band log” object, the next step is to allow us\
    \ to `bind` other functions to it (i.e., invoke those functions on this value).\
    \ The name `bind` is really kind of generic and not self-documenting, though.\
    \ Let’s call it `analyze()` instead.\n\n```\n 1 class Stats\n 2 {\n 3     // ...\n\
    \ 4 \n 5     public function analyze(callable $fn): self\n 6     {\n 7       \
    \  $result = $fn($this->string);\n 8         return new static($result->string,\
    \ $this->log + $result->log);\n 9     }\n10 }\n```\n\nHere’s where all the interesting\
    \ bits are. When we `bind` (analyze with) a function, that function gets passed\
    \ the string to analyze. It passes back a new `Stats` object, which we then merge\
    \ with the current object. “Merge,” in this case, means to use the new object’s\
    \ string, and concatenate their logs together.\n\nMoreso than in the previous\
    \ examples, we can see the monoid behavior at work here. There’s two `Stats` objects,\
    \ `$this` and “the one that `$fn` returns.” Those two objects of type `Stats`\
    \ are then added together to produce a third `Stats` object, which is returned.\
    \ “Added” in this case is defined as “the second one’s string, and both of their\
    \ logs,” but in concept, we could smush those two objects together in any way\
    \ we want.\n\nThe analysis functions are fairly straightforward. Here’s a sample\
    \ of possible analyzers:\n\n```\n 1 function readingLevel(string $s): Stats\n\
    \ 2 {\n 3     return Stats::of($s, [\n 4         'Reading Level' => 'high school'\n\
    \ 5     ]);\n 6 }\n 7\n 8 function normalizeNewlines(string $s): Stats\n 9 {\n\
    10     $cleaned = preg_replace(\"/[\\r\\n]+/\", \"\\n\", $s);\n11     return Stats::of($cleaned);\n\
    12 }\n 13 \n14 function countStats(string $s): Stats\n15 {\n16     $words = str_word_count($s);\n\
    17     $lines = substr_count($s, \"\\n\");\n18     return Stats::of($s, [\n19\
    \         'Word Count' => $words,\n20         'Line count' => $lines,\n21    \
    \ ]);\n22 }\n 23 \n 24 function wordDistribution(string $s, int $minimum = 0):\
    \ Stats\n25 {\n26     $words = array_count_values(str_word_count(strtolower($s),\
    \ 1));\n27     $words = array_filter($words, fn($value) => $value >= $minimum);\n\
    28     arsort($words);\n29     return Stats::of($s, [\n30         'Word distributions'\
    \ => $words\n31     ]);\n32 }\n```\n\nComputing the `readingLevel` of a block\
    \ of text is actually rather hard, so I’m not going to as it’s off topic. You\
    \ can implement that yourself (or turn it over to some web service call). But\
    \ it returns a valid `Stats` object, with an unmodified string and a new log entry.\n\
    \nWe can `normalizeNewlines` by folding all multi-newline sequences to a single\
    \ newline. We wouldn’t want to use that for the string that gets stored, but its\
    \ log component is empty, which is fine. Now that newlines are cleaned up, we\
    \ can do some basic `countStats` on the string. In this case, we return the string\
    \ unmodified and a two-element log entry; that is also fine.\n\nWe can even do\
    \ some deeper analysis and get `wordDistribution`. In this case, the analyzer\
    \ function also takes a minimum count to filter outinteresting words from the\
    \ result. The log entry it returns is not a string but an array. That doesn’t\
    \ violate any rule we’ve established so far, so that is fine. (However, it’s another\
    \ reason I would define a `StatItem` class for each entry if this were a real\
    \ implementation.) Note that this function does modify the `$words` variable internally;\
    \ if we wanted to be extremely pedantic that violates the no-mutable-variables\
    \ rule, but the overall function is still pure so, meh.\n\nRunning an initial\
    \ string through an stat analyzer is then just as simple as we’ve come to expect:\n\
    \n```\n1 $result = Stats::of($string)\n2     ->analyze('normalizeNewlines')\n\
    3     ->analyze('readingLevel')\n4     ->analyze('countStats')\n5     ->analyze(fn($s)\
    \ => wordDistribution($s, 3))\n6 ;\n```\n\nThe first three functions are already\
    \ unary, so we can pass them in directly. `wordDistribution()` is multi-parameter,\
    \ so we first curry it with a minimum value of 3. In the end, we get a `$result`\
    \ `Stats` object. We now need to get at the log it contains. That’s trivial:\n\
    \n```\n1 class Stats\n2 {\n3     // ...\n4 \n5     public function log(): array\n\
    6     {\n7         return $this->log;\n8     }\n9 }\n```\n\nAnd now we have a\
    \ complete list of all of the statistical information we requested, with no global\
    \ state, no mutable values (that matter), built out of pure functions, and flexible\
    \ enough that we can add an infinite number of analyzers to it, all kept reasonably\
    \ memory efficient by PHP’s copy-on-write behavior.\n\nAnd we get to say we’re\
    \ using monads.\n\n# Combining Monadic Behavior\n"
