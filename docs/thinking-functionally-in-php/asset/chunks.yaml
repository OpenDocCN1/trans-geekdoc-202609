- fmt: '

    If we look at `ℤ` from one angle, it’s a set. If we look at it from another angle,
    it’s a category. It is both. We can use whichever perspective is most convenient
    for us at any given time. The same is true for `ℝ`. That means we can view `floor`
    as a functor from `ℝ` to `ℤ`. It applies for all values in `ℝ` (it’s a total function),
    and the ordering relationship is preserved.


    As we can have morphisms from an object to itself, we can have functors that point
    back to their original category. For example, `squared` is a mapping from `ℝ`
    to `ℝ`. The domain and codomain are the same, although it will only map to positive
    values; that’s entirely fine, as long as it works for all inputs.


    Functors that map from a category to itself are called `endofunctors`, which is
    a weird amalgam of Greek and Latin for “within the same category function doer
    thingie.” (It really does sound more impressive in Greek.)


    ## Isomorphism


    Another important concept in category theory is equality. Equality is tricky at
    best in programming; `1 == 1`, but does one product object “equal” another product
    object? What matters: their ID in the database, all of their internal properties,
    or their memory location? As usual, the unhelpful answer is “it depends.”


    Category theory has the same problem. However, there is a specific flavor of equality
    that is especially useful. If you have an object `A` with an arrow to `B`, and
    another arrow from `B` back to `A`, then those morphisms are inverses of each
    other. It’s always possible to transition from one to another and back again.
    Those two objects are then said to be “equal up to isomorphism,” or simply `isomorphic`:
    in Greek, “equal form thingies.”


    ![An isomorphism from A to B and back again](resources/isomorphism.png)


    An isomorphism from A to B and back again


    Objects can be isomorphic, but so can entire structures of objects if they are
    fully parallel; they are not equal in the arithmetic sense, but if two objects
    or structures are isomorphic, it means in practice that one can be represented
    in terms of the other. Or, in programming speak, if two structures are isomorphic,
    then it’s completely safe to `refactor` code from one to another. The performance
    implications may be entirely different between two different structures, at an
    implementation level; that is actually a really good justification for converting
    code from one approach to another if you can guarantee the two approaches are
    isomorphic.


    ## Monoids


    A few chapters back, we discussed a special case of functions called “monoids.”
    To refresh, a “monoid” refers to a function that:


    *   Is pure

    *   Is a binary function (takes two parameters and returns one value, all of the
    same type)

    *   Is associative

    *   Has an identity value


    That should look very familiar at this point. The idea of associativity and an
    identity is pervasive in category theory, as it is what allows us to compose almost
    anything as long as the types are compatible; that is, the codomain of one morphism
    is the domain of the next. A monoid isn’t quite a morphism yet, though, because
    morphisms are unary functions.


    However! Recall also that any multi-parameter function can be converted to a single
    parameter function; a process called “currying.” Consider a category with only
    a single object. Every monoid is a binary function that has been curried.


