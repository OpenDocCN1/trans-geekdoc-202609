  trans: '

    如果我们从一个角度看 `ℤ`，它是一个集合；如果从另一个角度看，它是一个范畴。它二者皆是。我们可以根据任何时刻的需求使用最方便的视角。`ℝ` 也是如此。这意味着我们可以将
    `floor` 视为从 `ℝ` 到 `ℤ` 的函子。它适用于 `ℝ` 中的所有值（它是一个全函数），并且保留了序关系。


    由于我们可以拥有从对象到其自身的态射（morphisms），我们也可以拥有指向原始范畴的函子。例如，`squared` 是一个从 `ℝ` 到 `ℝ` 的映射。定义域和陪域是相同的，尽管它只会映射到正值；这完全没问题，只要它对所有输入都有效即可。


    从范畴映射到其自身的函子被称为 `endofunctors`（自自函子），这是一个希腊语和拉丁语的奇组合词，意为“在同一范畴内执行功能的小玩意儿”（用希腊语听起来确实更高级一些）。


    ## 同构


    范畴论中的另一个重要概念是等价性。在编程中，等价性充其量是棘手的；`1 == 1` 成立，但一个积对象是否“等于”另一个积对象呢？重要的是：是它们在数据库中的
    ID、所有的内部属性，还是内存地址？像往常一样，没帮助的答案是“这取决于情况”。


    范畴论面临同样的问题。然而，有一种特定类型的等价性特别有用。如果你有一个从 `A` 指向 `B` 的箭头，以及另一个从 `B` 回到 `A` 的箭头，那么这些态射就是彼此的逆元。始终可以在两者之间转换并返回。那么这两个对象就被称为“同构意义上的相等”，或简单地称为
    `isomorphic`：在希腊语中，意为“形状相等的小东西”。


    ![从 A 到 B 再回到 A 的同构](img/isomorphism.png)


    从 A 到 B 再回到 A 的同构


    对象可以是同构的，完全平行的对象结构也可以；它们在算术意义上是不相等的，但如果两个对象或结构是同构的，意味着在实践可以用其中一个表示另一个。或者用编程术语来说，如果两个结构是同构的，那么从一个到另一个
    `refactor`（重构）代码是完全安全的。在实现层面，两个不同结构的性能影响可能完全不同；但如果你能保证两种方法是同构的，这实际上是将代码从一种方法转换为另一种方法非常充分的理由。


    ## 单元


    几个章节之前，我们讨论了函数的一种特殊情况，称为“单元”（monoids）。复习一下，“单元”指的是满足以下条件的函数：


    *   是纯函数

    *   是二函数（接受两个参数并返回一个值，所有类型相同）

    *   满足结合律

    *   具有单位元


    到这里，这看起来应该非常熟悉。结合律和单位元的概念在范畴论中无处不在，因为它允许我们在类型兼容的情况下组合几乎任何东西；即一个态射的陪域是下一个态射的定义域。不过，单元还不完全是态射，因为态射是一元函数。


    然而！回想起任何多参数函数都可以转换为单参数函数；这个过程被称为“柯里化”（currying）。考虑一个只有一个对象的范畴。每个单元都是经过柯里化的二元函数。


    （注：从“Consider a category...”开始的输入文本似乎变得变得混乱/重复。我已在保留所提供的技术概念的同时清理了逻辑流。）


    *注意：从“Consider a category...”开始的源码包含大量的重复和无意义的词字符串。我已经处理了上面的连贯部分。如果混乱部分是指特定的代码，请提供更清晰的源码。*

