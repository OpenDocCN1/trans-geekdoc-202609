    \ one will break if it gets the other. However, it’s trivially simple to convert\
    \ between the two losslessly with a swap function. Since there’s a function from\
    \ one to the other and back again, that means they are “equal up to isomorphism,”\
    \ or isomorphic.\n\nSimilarly, `(a, (b, c))` and `((a, b), c)` are not equal in\
    \ the sense that we can just ignore the parentheses. That is, they are not associative.\
    \ However, it’s trivially simple to convert between the two losslessly. That makes\
    \ them “associative up to isomorphism.” More importantly for us, they’re also\
    \ both isomorphic to `(a, b, c)`.\n\nAn ordered fixed list of different types\
    \ is called in programming lingo a *tuple*. A 2-tuple is a pair. You can also\
    \ have a 3-tuple, 30-tuple, or more generically an n-tuple.\n\nUsefully, there\
    \ is also a type that can be incorporated into a Cartesian product that is isomorphic\
    \ to not doing so; that is, it’s a no-op. That type is the `unit` type, which\
    \ is the set with only one value (think `null`). A product of a set `A` with a\
    \ single-element set has the same number of elements as `A`; no actual information\
    \ has been added. If product types are equivalent to multiplication, then `unit`\
    \ here is 1.\n\nThat is, we have a category (sets), we have a binary way of operating\
    \ on it, and we have a no-op value. Hey, look, a monoid! **<Set, product, unit>**\
    \ constitutes a monoidal category.\n\n## Product Types in PHP\n\nMany languages\
    \ have native support for tuples. PHP does not. The closest it has are arrays,\
    \ but arrays are untyped, so we cannot enforce that `[1, \"hello\"]` is valid\
    \ and `[\"hello\", 1]` just makes no sense. That’s fine, though, because frankly\
    \ tuples are a painful data structure to work with much of the time because there’s\
    \ no built-in way to refer to each element other than by position, which is just\
    \ as bug-risky as untyped arrays.\n\nWhat’s more useful in practice are named\
    \ tuples; that is, tuples where each element has a name by which it can be accessed\
    \ so that the order becomes irrelevant. Technically the order is still there,\
    \ but because it’s isomorphic to reorder them it doesn’t impact us in practice.\
    \ Different languages have different terminology for named tuples, but in PHP\
    \ and most similar languages you’re already intimately familiar with them: classes.\n\
    \nThe OOP perspective on classes is that they create a new type unto themselves,\
    \ whose internal details are entirely opaque. The category theory or functional\
    \ perspective on classes is that they are *product types*, a combination of two\
    \ other types (categorical objects) to form a new type (categorical object). Neither\
    \ of these perspectives is right or wrong; the language syntax supports either\
    \ mindset.\n\nAs we discussed back in the chapter on value objects, it’s important\
    \ to differentiate between service objects and data objects. Service objects are\
    \ closed-over functions with funny syntax. Value objects are dumb nouns in their\
    \ own right. Now, we can also think of them as product types built from other\
    \ types (which could themselves be product types). Or nouns built by composing\
    \ other nouns. (German speakers should be right at home here.)\n\nEven classes\
    \ have a category theory basis, if you look at them the right way.\n\n## Coproducts\n\
    \nMost things in category theory have an inverse. Morphisms have a domain and\
    \ codomain for their opposite ends, for instance. Product types also have an inverse,\
    \ conveniently called a *coproduct*.\n\nWithout going into too much mathematical\
    \ detail, if a product is “an `A` AND a `B`” then a coproduct is “an `A` OR a\
    \ `B`”. Or said the other way around, if a product is “build an `AxB` out of an\
    \ `A` and a `B`” then a coproduct is “break up an `AxB` and take either an `A`\
    \ or a `B`”. Or more formally `Coproduct AxB = A | B`.\n\nWhere the number of\
    \ possible values of a product type mirrors multiplication, the number of possible\
    \ values of a coproduct type mirrors addition. `Coproduct(AxB)`’s possible values\
    \ are the number of possible `A` values plus the number of possible `B` values.\
    \ In our previous example, that would be 2 + 7 = 9. Hence they are also known\
    \ more commonly as “sum types.”\n\nCoproducts, like products, are associative\
    \ up to isomorphism. That is, `A | (B | C)` and `(A | B) | C` are both isomorphic\
    \ to `A | B | C`. Just as a product type may contain any number of composed types,\
    \ a sum type may break down to any number of sub-types.\n\nAre sum types a monoid?\
    \ They’re associative up to isomorphism, so that’s half the answer. Is there an\
    \ identity value? There is. Generically it is called `void`, and in sets means\
    \ the empty set, `{}` (not to be confused with `null`, which is a set with only\
    \ a single object). `A | B | void` is exactly the same as `A | B`. Think of it\
    \ as 0 for addition. So yes, **<Set, sum, {}>** is a monoid.\n\n## Coproducts\
    \ in PHP\n\nMost non-strictly-functional languages don’t have native sum type\
    \ support. Some languages have *enumerations*, or “enums”, which are a sort of\
    \ junior version. The sum type `color` can be a `Red` OR a `Green` OR a `Blue`,\
    \ but never multiple of those at the same time. That’s not quite the same, though,\
    \ as enums don’t support “this could be any integer OR any float” (but not, say,\
    \ a string).\n\nPHP doesn’t have native enum support, either. The closest approximation\
    \ it has for sum types or enums is interfaces. The functional/categorical way\
    \ of viewing an interface is that of a sum type of unbounded possible values.\
    \ Or in code:\n\n```\n1 interface LoginSystem {}\n2 \n3 class Local implements\
    \ LoginSystem {}\n4 \n5 class OAuth implements LoginSystem {}\n6 \n7 class LDAP\
    \ implements LoginSystem {}\n8 \n9 function login(LoginSystem $sys, User $user)\
    \ { }\n```\n\nHere, the `login()` method requires the sum type `LoginSystem`,\
    \ whose possible values are `Local`, `OAuth`, and `LDAP`.\n\nThis is not a perfect\
    \ match, however, since nothing prevents users from implementing their own class\
    \ that matches that interface. There’s no in-language way to bound the legal values\
    \ the way an enum of sum type would. However, it still gives us a “good enough\
    \ most of the time” way to model sum type behavior.\n\nIn practice, “sum type\
    \ behavior” ends up meaning… essentially polymorphism. Not necessarily the kind\
    \ of polymorphism you’re used to talking about with methods, however (although\
    \ that, too). We can use sum types to create different logical pathways or different\
    \ contexts in which to allow other code to run. We’ll see some examples of that\
    \ in the next few chapters.\n\n# Part Three\n\n# Handling Null\n\n## The Problem\n\
    \nRecall from the chapter on concatenating or composing functions that we really\
    \ want to be able to pipe functions together. That’s a very low-impact way of\
    \ building up a large solution out of little solutions in a controlled and pure\
    \ way. There’s one important caveat to it, though. That assumes all of the functions\
    \ involved are total functions. If any function involved has no defined output\
    \ for a given input, all bets are off because it has nothing meaningful to return.\
    \ It’s no longer a morphism. Commonly, the answer here is to have that function\
    \ return `null`, which is the programming equivalent of a shrug emoji.\n\nThat\
    \ creates a problem because the next function then needs to be able to know how\
    \ to handle a shrug emoji (`null`). Most likely, all it can do is respond with\
    \ its own shrug emoji, and then it’s shrug emoji all the way down.\n\nError handling\
    \ via shrugging is generally a bad idea.\n\nAs an aside, sometimes PHP functions\
    \ return `false` instead of `null` to indicate error conditions. That is even\
    \ worse, as it’s not just unhandleable, but also not type safe. Plus, because\
    \ `false` silently casts to legal `int` and `string` values, it can be even harder\
    \ to detect. That makes it really easy for a shrug emoji to hide in your code\
    \ and produce all sorts of completely incorrect results."
