    `(a, b)` 和 `(b, a)` 是等等的。一个期望其中一个函数的（或态射）如果得到了另一个，就会崩溃。然而，通过一个 `swap` 函数在两者之间进行无损转换是非常轻而易见的。由于存在从一个到另一个再返回的函数，这意味着它们“在同构意义上相等”，或者说是同构的。


    同样，`(a, (b, c))` 和 `((a, b), c)` 在我们可以忽略括号的意义上，它们是不相等的。也就是说，它们不满足结合律。然而，在两者之间进行无损转换是非常轻而易见的。这使得它们“在同构意义上具有结合律”。对我们来说更重要的是，它们也都与
    `(a, b, c)` 同构。


    在编程术语中，一个由不同类型的有序固定列表被称为 `tuple`（元组）。`2-tuple` 是一个对。你也可以有 `3-tuple`、`30-tuple`
    或者更通俗地说 `n-tuple`。


    有用的是，还有一种类型可以并入笛卡尔积中，且与不包含该类型的操作同构；也就是说，它是一个无操作（no-op）。该类型是 `unit` 类型，它是仅有一个值的集合（想象成
    `null`）。集合 `A` 与单元素集合的积元素个数与 `A` 相同；没有添加任何实际信息。如果积类型等同于乘法，那么这里的 `unit` 就是 1。


    也就是说，我们有一个范畴（集合），我们有一种对它的二元操作，我们有一个无操作值。嘿，看，一个单元！`<Set, product, unit>` 构成了一个单范畴。


    ## PHP 中的积类型


    许多语言对元组有原生支持。PHP 没有。它最接近的是数组，但数组是无类型的，所以我们无法强制 `[1, "hello"]` 是合法的，而 `["hello",
    1]` 仅仅是毫无意义。不过这没关系，因为坦率地说，元组在很多时候是一种处理起来痛苦的数据结构，因为除了位置之外，没有内置方法可以引用每个元素，这与无类型数组一样容易产生
    风险。


    在实践中更有用的是命名元组；也就是说，元组中的每个元素都有一个可以通过它访问的名称，从而使顺序变得无关。从技术上讲顺序仍然存在，但因为重新排列它们是同构的，所以这在实践中不会影响我们。不同的语言对命名元组有不同的术语，但在
    PHP 和大多数类似的语言中，你已经非常熟悉它们了：类。


    从 OOP 的角度来看，类创建了自身的类型，其内部细节完全不透明。从范畴论或函数式的角度来看，类是 `product types`，是两个其他类型（范畴对象）组合成一个新类型（范畴对象）。这两种观点无对无错；语言语法支持任何一种思维。


    正如我们在值对象章节中讨论的那样，区分服务对象和数据对象是非常重要的。服务对象是具有特殊语法的闭包函数。值对象本身就是朴实的名词。现在，我们也可以把它们看作是由其他类型（这些类型本身也可以是积类型）构建的积类型。或者是由组合其他名词构建的名词。（德语使用者者应该很熟悉这一点。）


    ## 余积类型


    大多数语言对和类型（sum types）有原生支持。PHP 没有。它最接近的是数组，但数组是无类型的，所以我们无法强制 `[1, "hello"]` 是合法的，而
    `["hello", 1]` 仅仅是毫无意义。不过这没关系，因为坦率地说，和类型在很多时候是一种处理起来痛苦的数据结构，因为除了位置之外，没有内置方法可以引用每个元素，这与无类型数组一样容易风险。


    在实践中更有用的是命名元组；也就是说，元组中的每个元素都有一个可以通过它访问的名称，从而使顺序变得无关。从技术上讲顺序仍然存在，但因为重新排列它们是同构的，所以这在实践中不会影响我们。不同的语言对命名元组有不同的术语，但在
    PHP 和大多数类似的语言中，你已经非常熟悉它们了：类。


    顺带一下，PHP 函数有时返回 `false` 而不是 `null` 来表示错误。这更糟糕，因为它不仅不可处理，而且不安全。此外，由于 `false` 会静默转换为合法的
    `int` 和 `string` 值，它可能更难检测。这使得不起表情很容易隐藏在你的代码中并产生各种完全错误的结果。


    从 OOP 的角度来看，类创建了自身的类型，其内部细节完全不透明。从范畴论或函数式的角度来看，类是 `product types`，是两个其他类型（范畴对象）组合成一个新类型（范畴对象）。这两种观点无对无错；语言语法支持任何一种思维。


    大多数语言对和类型有原生支持。PHP 没有。它最接近的是数组，但数组是无类型的，所以我们无法强制 `[1, "hello"]` 是合法的，而 `["hello",
    1]` 仅仅是毫无意义。不过这没关系，因为坦率地说，和类型在很多时候是一种处理起来痛苦的数据结构，因为除了位置之外，没有内置方法可以引用每个元素，这与无类型数组一样容易风险。


    ## 第三部分


    # 处理 Null


    ## 问题


    回想在连接或组合函数的章节中，我们希望能够将函数连接起来。这是一种受控且纯粹的、从小解决方案构建出大解决方案的低影响方法。不过，这有一个重要的限制。那假设所有涉及的函数都是全函数。如果涉及的任何函数对于给定的输入没有定义，那么一切都失效了，因为它没有有意义的内容可以返回。它不再是一个态射。通常，这里的答案是让该函数返回
    `null`，这是编程中相当于耸肩表情。


    这产生了一个问题，因为下一个函数随后需要知道如何处理耸肩表情（`null`）。最可能，它能做的只是回应自己的耸肩表情，然后从头到尾耸肩。


    通过耸肩来处理错误通常是一个坏主意。


