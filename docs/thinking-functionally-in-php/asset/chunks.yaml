  trans: "\n遗憾的是，PHP 是这类简单语言之一，递归会对内存使用造成严严重的威胁，因为它完全没有进行任何优化。这意味着虽然可以使用递归，但应该谨慎使用，因为在处理即使稍大的列表时，它也很容易导致内存问题。由于我们的目标不是描述人们应该如何编写\
    \ PHP 代码，而是使用一种熟悉的语言来解释函数式编程的概念，因此在本节的剩余部分，我们将忽略这个问题。在生产代码中，你不会像我们在这里这样随意使用它；你已经收到过警告了！\n\
    \n递归的主要优势是它可以产生非常优雅的算法代码。递归算法自然地遵循特定问题的定义，只是用代码写出来的。它还非常自然地避免了变量的变异，而这在函数式编程中是大忌。\n\
    \n例如，让我们重新考虑 `map()`。与其使用 `foreach()` 循环，我们可以将其写成一个递归函数。\n\n```\n 1 function recursive_map(array\
    \ $list, callable $fn): iterable\n 2 {\n 3     if (count($list)) {\n 4       \
    \  return [$fn(head($list))], ...recursive_map(tail($list), $fn)];\n 5     }\n\
    \ 6 \n 7     return [];\n 8 }\n 9\n10 // 或者写成一行：\n11 function recursive_map(array\
    \ $list, callable $fn): iterable\n12 {\n13     return count($list)\n14       \
    \  ? [$fn(head($list)], ...recursive_map(tail($list), $fn)]\n15         : [];\n\
    16 }\n```\n\n在这种情况下，`recursive_map()` 被为一个列表，包含将 `$fn` 应用于列表第一个元素，并连接上对列表剩余部分调用\
    \ `recursive_map()`。如果列表为空，它直接返回一个空列表。结果是一长长的 `array_merge()` 调用，将一系列单元素列表连接在一起。\n\
    \n具有更好列表支持的函数式语言通常也有更优雅列表连接语法。\n\n或者，举一个更传统的例子，考虑（众闻名的）斐波那契数列：列表中的每个元素都定义为前两个值的和，或者如果是前两个值则为\
    \ 1。递归地，代码看起来和它的定义完全一样：\n\n```\n 1 function fibonacci(int $nth): int\n 2 {\n 3\
    \     if ($nth == 0) {\n 4         return 1;\n 5     }\n 6     if ($nth == 1)\
    \ {\n 7         return 1;\n 8     }\n 9     return fibonacci($nth - 1) + fibonacci($nth\
    \ -2);\n10 }\n```\n\n永远不要在 PHP 中写这种代码。它是极其低效的，无论是在函数调用还是对同一个数字的冗余调用方面。在 PHP 中，可以使用迭代循环写得更高效得多：\n\
    \n```\n 1 function fibonacci_iterative(int $n): int\n 2 {\n 3     $previous =\
    \ 1;\n 4     $current = 1;\n 5     $next = 1;\n 6     for ($i = 3; $i <= $n; ++i)\
    \ {\n 7         $next = $current + $previous;\n 8         $previous = $current;\n\
    \ 9         $current = $next;\n10     }\n 11     return $next;\n12 }\n```\n\n\
    在 PHP 中，这种方式要快得多且更节省内存。然而，它并没有真正解释该算法是什么。它非常关注实现细节，而这些细节往往隐藏了算法本身。递归的函数式版本要自解释得明得多。\n\
    \n这是函数式语言具有显著优势的领域之一。良好的函数式语言（与仅支持函数式风格代码的语言相比）可以在语言语义上采取步骤，使得看起来递归的算法更高效。例如，Haskell\
    \ 支持自动记忆化（memoization），这意味着对相同输入 `fibonacci()` 的许多冗余调用会被自动优化掉。它可以做到这一点是因为所有函数都保证是纯的，因此是可以记忆化的。它使用调用栈的方式也不像\
    \ PHP 那样。结果是，第一个版本（更易读的那个）比迭代版本更快，而且更具自说明性。\n\n# 不可变值对象\n\n到目前为止，我们谈论的大多是简单变量：整数、字符串以及偶尔出现的数组。遗憾的是，这种语言（以及代码库）无法处理任何更健壮的东西。复杂的数据结构是现代软件成为可能的关键，但和大多数其他功能一样，它们可能有特定语言的局限性。在函数式思维中，我们需要我们的值以某种方式运行。具体来说，我们希望它们是不可变的。\n\
    \n函数式编程的第三大支柱（在纯函数和一等函数之后）是不可变变量。从表面上看，这个术语可能是矛盾的：事物既可以是变量（可变的）又是不可变的（不变化的、不改变）？\n\
    \n变量代表“运行时确定的东西”是可以的，但永远只代表一件事。事实上，这在有时至关重要。\n\n我们已经确定，为了让函数式编程工作，我们需要使用纯函数；纯函数对于参数之外的任何值没有隐式或侧带依赖，对返回值之外的任何值或状态也没有隐式影响。这包括改变其参数。\n\
    \n## PHP 的做法\n\n考虑以下代码段：\n\n```\n 1 function nextSunday(\\DateTime $date): DateTime\n\
    \ 2 {\n 3     $oneDay = \\DateInterval::create('1 day');\n 4     while ($date->format('l')\
    \ !== 'Sunday') {\n 5         $date->add($oneDay);\n 6     }\n 7     return $date;\n\
    \ 8 }\n 9\n10 $today = new \\DateTime('2019-12-25');\n11\n12 $sunday = nextSunday($today);\n\
    13\n14 printf('Today is %s and the following Sunday is %s',\n15     $today->format('Y-m-d'),\
    \ $sunday->format('Y-m-d')\n16 );\n```\n\n我们期望输出 Today is 2019-12-25 and the following\
    \ Sunday is 2019-12-29，但事实并非如此。我们得到的是\n\nToday is 2019-12-29 and the following\
    \ Sunday is 2019-12-29\n\n甚至为了让它变得更奇怪，如果我们重构掉变量 `$sunday`，我们会得到不同的输出：\n\n```\n\
    1 $today = new \\DateTime('2019-12-25');\n2\n3 printf('Today is %s and the following\
    \ Sunday is %s',\n4     $today->format('Y-m-d'), nextSunday($today)->format('Y-m-d')\n\
    5 );\n6\n7 // Today is 2019-12-29 and the following Sunday is 29\n```\n\n我们的代码结果不应该因为依赖函数的顺序而改变！这里隐藏着微妙而邪恶的\
    \ bug，这种 bug 类型系统或测试都无法修复。如果测试覆盖率足够高，测试可能会事后发现它，但如果代码从一开始就不允许这种 bug 发生会好得多。\n\n\
    问题在于 `nextSunday()` 内部的 `$date` 与 `$today` 。它们是不同的变量，但它们都指向内存中的同一个值。这意味着当你改变一个变量的值时，你改变了两个变量的值，产生了一种“超距距离的幽灵作用”（引用爱因斯坦的话）。\n"
