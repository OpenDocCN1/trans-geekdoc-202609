  trans: "\n\n12. 枚举类型\n\n2. 何时采用函数式编程\n\n  1. 避免全局状态\n  2. 编写纯函数\n  3. 隔离 IO\n  4.\
    \ 列式应用\n  5. 拥抱值对象\n  6. 拥抱作为值的函数\n  7. 创建单方法可调用服务\n  8. 以流水线和数据流的角度思考\n  9. 使用\
    \ Maybe 和 Either 处理错误\n  10. 不要过度使用\n\n3. 更多资源\n\n  1. 书籍\n  2. 视频\n  3. 论文\n\n\
    ## 指南\n\n1. 开始阅读\n\n# 前言\n\n多年来，函数式编程一直是我感兴趣的话题。并不是说我是方面的专家，或者我在严格的函数式语言中做过很多工作，只是我对这个话题很感兴趣。\n\
    \n遗憾的是，我长期发现网上现有的文档和教程都很平庸无奇。大多数内容要么只涵盖最基础的内容就停止了，要么假设你已经是 Haskell 专家，因此用最晦涩、最以\
    \ Haskell 为中心的方式来解释高级主题。这两者对我来说都没有用处。\n\n我还发现“Monad 诅咒（Curse of Monads）”似乎是真的，因为我找到的关于那个神话般概念的解释几乎都晦涩难懂，要么假设你有三年的高级数学训练，要么就简化到对理解产生实际上的危害。\n\
    \n> “一旦你理解了 Monad，你就立刻无法向任何其他人解释它们了。”\n\n> –Gilad Bracha\n\n结合 PHP 在编写类函数式代码时整体笨拙的语法，我在自己的代码中或向他人解释时，通常不会止步于“纯函数是你的朋友”。\n\
    \n直到 PHP 7.4 的出现。\n\nPHP 7.4 改变了我的一切。箭头函数（arrow functions）的引入让在 PHP 中编写函数式风格的代码变得更加简洁直观。这是我进入函数式编程世界所需的火花，而这本书正是这段旅程的结晶。\n\
    \n本书的目标是向你展示函数式编程原则如何让你的 PHP 代码变得更好、更易维护且更健壮。我们将探索核心概念，从纯函数、不可变性到更高级的主题，如 Monad\
    \ 和函子（functors），但你不需要成为数学家或魔法师就能从书中受益。你只需要愿意学习新东西。\n\n# 引言\n\n近年来，函数式编程作为一个概念已变得越来越流行。即使在“非函数式”编程语言中，函数式编程的理念和实践也变得更加主流。\n\
    \n这是为什么？它们真的有用吗？还是说在 Haskell 以外的语言中进行函数式编程只是在方圆凿圆孔？函数式编程到底是什么？它在 PHP 中有意义吗？\n\n\
    本书旨在回答这些问题。（剧透一下：答案是肯定的。）虽然把 PHP 写得像 Haskell、ML 或 LISP 那样不会产生良好结果，但函数式编程背后的底层原则在\
    \ PHP 中也有许多优势。\n\n## 函数式 vs. 过程式\n\n"
- fmt: '

    There are many different paradigms for conceptualizing computation and programming,
    but the two oldest and most widely applicable are `procedural programming` and
    `functional programming`. Both were developed in the 1930s very close together,
    and have been shown to be equivalent; that is, there is no programming problem
    that can be solved in a procedural approach that cannot also be solved in a functional
    approach, and vice versa. One paradigm may be easier to write, or easier to read,
    or easier to think about, or more performant, or require fewer lines of code.
    Which one has the “edge” varies widely from one situation to another, but if it’s
    possible to solve in one, then it’s possible to solve in the other.


    One could argue that since both are equally capable, a programmer needs to learn
    only one to solve any solvable problem. That would be a short-sighted view. By
    that logic, one would need to learn only a single `Turing-complete` language and
    be done with it, since all `Turing-complete` languages are, by definition, equally
    capable.


    While it’s trite to fall back on cliches like “use the right tool for the job,”
    it’s a cliche because it’s true. But being able to determine the right tool for
    the job requires being at least competent in multiple tools. In the case of programming,
    that means being at least competent in multiple programming languages as well
    as multiple programming paradigms, if only to know when to *not* use a particular
    one.


    Most programming resources, however, are geared toward a procedural mindset. That’s
    not surprising. It is the approach easiest to explain to a new developer, and
    at the end of the day, nearly all computer hardware in existence is procedural;
    anything else is simply syntactic sugar on top of assembly. That is unfortunate,
    though, as procedural is also the paradigm that scales least-well to large-scale
    systems, concurrency, and the ugly complex mess that is 21st-century computing.


    What functional programming and procedural programming share, at least in their
    modern forms, is the division of programs into separate logical chunks that can
    be mixed and matched and reused. Even if the syntax is often similar or identical,
    however, functional programming goes a step further and makes those logical chunks
    first-class citizens that can be dynamically created, modified, passed around,
    even stored and reused. We’ll see concrete examples of that in Part One.


    ## Object-Oriented Code


    The dominant programming paradigm today is neither functional nor procedural,
    but `object-oriented programming` (OOP)—at least, that’s the conventional wisdom.
    One issue with said conventional wisdom is OOP is a very loosey-goosey paradigm,
    with several sub-paradigms that actually get used. Far and away, the most common
    is what I term “Classic OOP,” as in, OOP that’s based in classes. `C++`, `Java`,
    `C#`, and `PHP` are all in this family, and with the introduction of explicit
    classes in `ECMAScript` 6 JavaScript` sort of is.


    There are other variants of OOP, however, some of which do not even include the
    quintessential “inheritance” concept. In practice, most OOP code in the wild is
    what I would term “procedural OOP,” that is, procedural thinking wrapped up in
    OOP style. That is not necessarily a bad thing; it is the dominant model today,
    so it must be doing something right. However, it is not fully message-centric
    OOP (a la `Smalltalk`). It also means there really is such a thing as “functional
    OOP,” or “object-functional” code.


    Contrary to the Reddit consensus, OOP and functional programming are not adversaries
    that force you to choose One True Code Paradigm. Rather, we can and should leverage
    the lessons of both to produce the best solution to the problem.


    ## Functional Style? Functional Language?


    One difficulty in understanding functional programming is that, much like object-oriented
    programming, there is no one clear definition of functional programming. On one
    level, it’s simply “programming with functions the way math does,” which is a
    nice and uninteresting definition. However, doing so quickly leads down a rabbit
    hole of category theory, monoids, endofunctors, generic type systems, pathological
    recursion, and other weird sounding words and phrases that are prone to turn off
    even the most receptive audience. In many cases it ends up looking like an unintentional
    [Mott-and-Bailey fallacy](https://rationalwiki.org/wiki/Motte_and_bailey), an
    [informal logical fallacy](https://en.wikipedia.org/wiki/List_of_fallacies#Informal_fallacies)
    where one argues two related points at the same time, one controversial and one
    not, and switches between the two depending on which is more advantageous in the
    moment. There is, really, no universal definition of functional programming, nor
    of a functional language. If “functional language” means “a language in which
    one can do functional programming,” then nearly all modern languages are functional;
    this is not a helpful definition. A better definition is to distinguish `functional-style
    programming` from `functional language`.


    - `Functional-style programming` is a particular way of approaching a problem.
    It includes a couple of fairly simple core concepts, plus a huge array of concepts
    that naturally flow from those. Most of those are not all-or-nothing, making it
    possible to write “functional-ish” code in any modern language even if the syntax
    may end up bit clunky.

    - `functional language` is a language whose syntax and semantics are geared toward
    making functional-style programming easier and more natural, often (though not
    always) at the expense of others. Often those functional concepts are baked-in
    assumptions in the language, and if you are not aware of those, you’re likely
    to get bitten.

    - `strictly functional language` is one whose syntax and semantics are geared
    toward writing in functional style only, period. These languages go all the way
    down the rabbit hole and make thinking about a problem any other way impossible.
    They also have a reputation for being impenetrable, precisely because they only
    support functional models.


    PHP, in particular, is a language optimized for procedural OOP; it supports classic
    OOP, and that is the code style most widely used, but the single-threaded, shared-nothing
    architecture is intrinsically procedural. Since PHP 5.3, however, it has had syntactic
    support for functional-style programming. PHP 7.4’s introduction of short-lambdas
    further simplifies it far enough that functional-style code is now entirely viable.
    That said, would I advocate writing 100% purely functional code in PHP? Not really.
    Many of functional code’s advantages do not actually apply in a single-threaded,
    shared-nothing environment, and others will work but collide with other limitations
    of the language to make them less friendly to work with.


    ## Type Systems


    Type systems are tricky in functional programming. On the one hand, type systems
    are entirely orthogonal and unrelated to functional programming. Some functional
    languages have extremely robust type systems (e.g., `Haskell`), while others have
    seemingly none at all (`LISP`). Yet, they’re often talked about in the context
    of functional programming. Why?


    The answer lies in the previous observation that functional languages tend to
    have either no type system or a very robust one. Rarely have I seen a mediocre
    functional type system. While functional programming itself does not in any way
    require having explicit type system, in practice functional code encourages and
    requires a very robust type system.

    '
