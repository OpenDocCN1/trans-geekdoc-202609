    Nature is internally consistent, from the bottom-up.


    Economic theory lacks the system-level perspective when studying economic activities.
    It focusses on individual agents, and at the margin, pays little attention to
    the system as a whole (as we shall see later). This gap leads to divergence of
    the microbehavior from the macroperformance. It frequently leads to the “fallacy
    of composition,” whereby the payoffs of the individual are at odds with the overall
    outcome.


    Furthermore, economic theory adopts “expected utility” approach, whereby what
    matters is ex ante, that is, expected values, not ex post outcomes. Conservation
    Laws, in contrast, apply before and after the transformation. Total energy at
    the start must equal total energy at the end. A PMM is always impossible, not
    “on average.” We will see later these aspects impact the approach of neoclassical
    theory toward analyzing economic phenomena.


    # 4. Logical foundations of conservation laws


    Mach (1911, Chap. IV) argues that the “principle of excluded perpetual motion”
    logically precedes conservation laws. “It is not possible to create work out of
    nothing,” he elaborates (p. 69). There is, therefore, something logically incorrect
    about PMMs.


    The remarkable nature of conservation laws that Dudley (2004) points at might
    be traced back to pure logic. Mathematically, to get something from nothing is
    equivalent to having 0 = 1. This can be easily seen if we formulate the conservation
    law as a constant sum. For a given system, total input energy must equal total
    output energy: E_input = E_output. More accurately, at any point of time t > 0
    must equal total energy at t = 0 (see Klainerman, 2008, p. 479). A PMM would violate
    this law by somehow having the right-hand side increases without a corresponding
    increase on the left-hand side. Mathematically, this violates what mathematician
    Benjamin (2015, p. 27) calls the “Golden Rule of Algebra: Do unto one side of
    the equation as you do the other.” Violating this rule, therefore, leads to 0
    = 1.'
