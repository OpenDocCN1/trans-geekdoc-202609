    # Ponzi schemes and bubbles


    One major consequence of the absence of conservation laws in economics is the
    possibility of Ponzi schemes and bubbles in a purely neoclassical, rational expectations
    economy.


    To be clear, consider the following scheme. Player A takes money from B, promising
    him to invest and generate acceptable returns. A then takes money from C, giving
    him a similar promise and pays B promised returns; A then repeats the process
    and pays C from D, ad infinitum. Player A, therefore, is able to get something
    for nothing. Or, A could borrow from B, borrow from C to pay B, and from D to
    pay C, ad infinitum. This is a Ponzi debt game. In a bubble, agents trade a security
    in order to make returns from reselling it to other agents. The security might
    have no intrinsic value; yet, each member in the chain is making money from the
    next. It is a continuous music chairs game. As long as music plays, and there
    is a continuous inflow of funds or liquidity, the game will be played.


    Does economic theory allow this kind of behavior? Could Ponzi schemes be played
    by “rational” agents in a neoclassical economy? The answer, surprisingly, is yes!
    Despite the central role of scarcity in economics, Ponzi games and “something
    for nothing” is strangely acceptable in economic theory. Samuelson (1957, pp.
    215–216) revealed this problem early on:


