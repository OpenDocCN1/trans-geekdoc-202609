  md: '# Chapter 2


    # The Perfect Language*


    Gregory J. Chaitin

    Federal University of Rio de Janeiro, Brazil


    What follows is based on a talk originally given by the author at the Hebrew University
    in Jerusalem and then, in expanded form, at the Perimeter Institute in Canada.

    I''m going to talk about mathematics, and I''d like to give you a broad overview,
    most definitely a nonstandard view of some intellectual history.

    There is a wonderful book by Umberto Eco called The Search for the Perfect Language,
    and I recommend it highly.¹¹

    In The Search for the Perfect Language, you can see that Umberto Eco likes the
    Middle Ages — I think he probably wishes we were still there. The book talks about
    a dream Eco believes played a fundamental role in European intellectual history,
    which is the search for the perfect language.


    > *Reprinted from Inference: International Review of Science, Vol. 1, No. 3 (July
    2015).

    ¹Umberto Eco, The Search for the Perfect Language, trans. James Fentress (London,
    UK: HarperCollins, 1997).'
