  md: 'The Limits of Mathematical Modeling in the Social Sciences


    Velupillai’s project is to create in place of the mathematical formalism of the
    last century, an “algorithmic” revolution in economic theory. His idea is to construct
    a path that exposes the noncomputational content of classical mathematics, which
    is founded upon set theory and the tertium nonatum. He would, on his terms, free
    economics of its noncomputational content and create a naturally algorithmic applied
    science that would be forced to address the undecidable nature of many decision
    problems that economics confronts (Velupillai, 2005, 2007, 2010).


    Velupillai (2010) demonstrates in his research that many of the formalizations
    of modern economic theory are lacking in empirical content (also see Doria, n.d.,
    this volume). This has important implications for set theoretic approaches to
    economic theory, which are founded upon classical logic. For example, he makes
    the case that the following have no closed-form algorithmic solutions, although
    they may be computationally determined in certain instances:


    +   (1) Nash equilibria of finite games are constructively indeterminate.

    (2) Computable general equilibrium (CGE) has no grounding in empirical content.

    (3) Fundamental elements of welfare economics are noncomputable.

    (4) Recursive competitive equilibria underpinning the stochastic dynamic general
    equilibrium is uncomputable.

    (5) There is no effective means of generating preference orderings.


    ⁴Specifically, the Second Welfare Theorem says “any Pareto optimum can, for suitably
    chosen prices, be supported as a competitive equilibrium” (Velupillai, 2005, p.
    238).'
