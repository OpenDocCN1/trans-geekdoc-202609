    We can divide the integrability question into three items:


    +   - Given any Hamiltonian $h$, do we have an algorithm to decide whether the
    associated flow $X_h$ can be integrated by quadratures?

    - Given an arbitrary Hamiltonian $h$ such that $X_h$ can be integrated by quadratures,
