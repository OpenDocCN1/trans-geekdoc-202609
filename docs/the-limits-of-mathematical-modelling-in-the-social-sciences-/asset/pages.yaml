  md: '# Is Economics a Science? A Gödelian Perspective


    # Metamathematics and metacognition


    There might be biological reasons behind the insufficient attention we pay to
    meta-mathematics. Our brains find it difficult to perform “metacognition” — cognition
    about cognition or thinking about thinking (Cox, 2005). To the extent that the
    brain is an algorithm system (Gödel held this view; see Wang, 1996, Chap. 6),
    we know from Gödel’s theorem that the brain must face undecidability. Metacognition
    involves a blind spot for the brain simply cannot figure out systematically whether
    it has the necessary information or knowledge concerning the decision at hand.
    This is particularly true when addressing “unknown unknowns” (Brotherton, 2015).
    The brain tends to fill in blind spots using available information, and so, it
    is difficult for us to identify these spots.


    So one reason why neoclassical theory has blind spots is that economists, as humans,
    do. One important lesson we can learn from science, therefore, is that we economists
    must address our own limitations.


    # 8. Learning from science


