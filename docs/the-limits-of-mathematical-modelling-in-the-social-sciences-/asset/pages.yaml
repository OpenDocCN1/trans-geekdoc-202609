    A mainstay of economic analysis for much of the 20th century, it assumes that
    individuals have the computational skills to be able to optimize in whatever environment
    he or she finds requires adherence on the part of the decision maker to certain
    canons of logic, including, critically, the ability to select a maximal set of
    alternatives. But, most of us, at under many circumstances, behave in this fashion?
    How do we actually decide? The traditional approach assumes, at least for the
    sake of mathematical tractability, that individuals exhibit a comprehensive, or
    unbounded, rationality in which utility maximization lays at the heart of the
    mainstream economists'' toolkit of assumptions.


