    of a proof Z_{ZFC}(\xi) of \xi in the language of ZFC to be the minimum length
    that a deduction of \xi from the ZFC axioms can have, as measured by the total
    number of letters in the expressions that belong to the proof.


    Proposition 12.11. If ZFC is arithmetically sound, then:


    +   1) There is an h \in B so that neither ZFC \⊄ ¬P(h) nor ZFC \⊄ P(h), but N
