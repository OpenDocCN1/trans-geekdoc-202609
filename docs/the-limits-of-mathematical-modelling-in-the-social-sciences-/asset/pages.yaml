  md: '# Is Economics a Science? A Gödelian Perspective 233


    A mirror image of the transversality condition is the no Ponzi game (NPG) condition.
    NPG requires that the present discounted value of the debt of an agent shall be
    asymptotically zero (Blanch and Fischer, 1989, pp. 49–50). The agent running the
    Ponzi scheme in an overlapping generations economy would satisfy the NPG condition
    with respect to each individual lender; however, the NPG does not hold for the
    aggregate for the same reasons that the TVC doesn''t. The present value of the
    debt, in general, for the borrower is strictly positive (O''Connell Zeldes, 1992).
    Thus, an agent running a Ponzi scheme is perfectly rational at the individual
    level, yet is able to get something for nothing at the aggregate level.


    Needless to, in reality, the TVC conditions are frequently violated. Yet models
    continue to assume that the conditions still hold (Himino, 2010). Market players
    use models that assume ideal conditions to hold, and this allows each player to
