    # Walras’ law


    The second economic constraint is Walras’ law. The basic idea behind this law
    is simple: in a market economy, for each purchase, there is a sale and vice versa.
    Thus, for each demand there is supply, and vice versa. It follows that whenever
    there is an excess demand in one market, there is an excess supply in another,
    such that the value of total aggregate excess demand shall be zero. Walras’ law
    captures the interdependence between markets implied by the budgetary constraint
    that all individual agents must take into account when they formulate purchase
    and sales plans. As Dixon (2008) points out, the'
