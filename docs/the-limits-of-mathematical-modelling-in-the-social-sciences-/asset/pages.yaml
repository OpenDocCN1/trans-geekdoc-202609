  md: "# The Limits of Mathematical Modeling in the Social Sciences\n\nThe axiomatic\
    \ background is made explicit for clarity. The incompleteness phenomenon means\
    \ that within a (consistent) pre-scribed axiomatic framework, certain facts cannot\
    \ be proved. Assuredly, if we add stronger axioms to our system, a few of those\
    \ unprovable facts may be proved. Yet the stronger axioms may also be debatable\
    \ on philosophical grounds, so the proof of a desired fact from the enriched system\
    \ eventually turns out to be technically correct but philosophically (and perhaps\
    \ empirically) doubtful. For details see da Costa and Doria (1994a) and Tsuji\
    \ et al. (1998).\n\n# Oscillating populations or a chaotic demography\n\nThe Lotka-Volterra\
    \ equations (LV) describe two interacting populations, namely a “preyed” $x$ and\
    \ a “predator” $y$. If left by themselves, the $x$ blow up exponentially, while\
    \ the $y$ decays exponentially. When $x$ and $y$ interact, they start to move\
    \ in nonlinear cycles. The LV model describes in a reasonable number of ecological\
    \ cycles (see Goel et al., 1971; Nicolis and Prigogine, 1977).\n\nNow consider\
    \ the following situation: let $\\langle x,y \\rangle$ and $\\langle x',y' \\\
    rangle$ be two coupled LV systems. We show in Section 20 that they can be described\
    \ by a Hamiltonian system $\\Xi$, and that there is a perturbed system\n\n```\n\
    $\\Xi' = \\Xi + \\epsilon Y$\n```\n\nwhere all populations are (in general) coupled\
    \ and $\\Xi'$ has a Smale horseshoe. So $\\Xi'$ is chaotic in its behavior.\n\n\
    We slightly modify $\\Xi'$ and get\n\n```\n$\\Xi^* = \\Xi + \\epsilon \\beta Y$\n\
    ```\n\nwhere $\beta$ is given in Corollary 14.16. Then the assertions “$\\Xi^*$\
    \ describes two sets of oscillating, nonchaotic, uncoupled populations” and “$\\\
    Xi^*$ describes four coupled, chaotic populations” are both undecidable in our\
    \ formal theory $T$."
