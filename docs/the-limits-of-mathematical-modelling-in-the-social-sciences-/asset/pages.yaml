  md: '# The Limits of Mathematical Modeling in the Social Sciences


    algorithm for SAT,$^{16}$ We require the so-called BGS set of poly machines and
    $f_c$, which is the (now recursive) counterexample function to $[P = NP]$ (see
    Baker *et al.* (1975) and da Costa and Doria (2016) for details).


    Recall that a BGS machine is a Turing machine $M_n(x)$ coupled to a clock that
    stops when the machine makes for $|x|^p + p$ steps, where $x$ is the binary input
    to the machine and $|x|$ is its length in bits; $p$ is an integer $\geq 1$. Of
    course, the coupled system is a Turing machine. All machines in the BGS set are
    poly machines, and any poly machine, there will be a corresponding machine in
    BGS with the same output as the original poly machine.


    Again, $f_c$ is the recursive counterexample function to $P = NP$. To get it:


    +   - Enumerate all BGS machines in the natural order (one can do it, as the BGS
    is recursive).

    - For BGS machine $P_n$, $f_c(n)$ equals the first instance of SAT, which is input
    to $P_n$ and fails to output a satisfying line for that instance of SAT.


    O''Donnell’s algorithm is very simple: we list in the natural ordering of all
    BGS machines. Given a particular instance $x \in$ SAT, we input it to $P_1, P_2,
    \dots$ up to the moment when the output is a satisfying line of truth values.
    When we compute the time bound to procedure, we see that it is near polynomial,
    that is, the whole operation is bounded by a very slow-growing exponential.


    Some requirements:


    +   - We use the enumeration of finite binary sequences


    0, 1, 00, 01, 10, 11, 000, 001, 010, 011, \u2026\u2026\u2026\u2026.


    If $FB$ denotes the set of all finite binary sequences, form the standard coding
    $FB \mapsto \omega$ which is monotonic on the length of the binary sequences.


    > $^{16}$ Actually deal with a slightly larger class of Boolean expressions.'
