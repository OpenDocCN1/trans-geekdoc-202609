    There is a lot to learn from science, for the simple reason that it is as rich
    and elegant as nature. But most important is the relationship between science
    and mathematics. For science, mathematics is a tool, albeit an important and indispensable
    one. The scientist’s primary objective is to understand and control natural phenomena.
    Smith (2008, p. xv), again, notes that formal economic modeling has little to
    do with how subjects in the lab or participants in real markets actually perform
    in real time. This observation has nothing to do with theoretical sophistication;'
