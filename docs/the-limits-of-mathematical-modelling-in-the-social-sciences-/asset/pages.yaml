    to the more typical negative feedback effects with which we are familiar. Common
    negative feedback systems involve the muting of signals over time, that is, the
    consequences of some action or event become less that action or rec rec into the
    past. In contrast, at least of the feedback processes taking place within CASs
    exhibit positive feedback, where consequences become more significant over time.
    This is important because scholars in the social and other sciences have tended
