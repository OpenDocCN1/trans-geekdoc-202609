  md: 'If a mathematical theory produces the statement $0 = 1$, then it can prove
    any statement. In other words, the theory provides no valid reasoning. For a formal
    system to be consistent, it must not allow this result. In this manner, the system
    avoids contradiction. The “law of non-contradiction” (LNC) is a fundamental principle
    of logic. According to Aristotle, it is a principle of scientific inquiry, reasoning,
    and communication, that we cannot know anything without it (Gottlieb, 2015).³


    The role of LNC as the basic, indemonstrable principle is also affirmed by Gottfried
    Wilhelm Leibniz. For Leibniz, LNC is equivalent to the law of identity (LI), which
    states that everything is identical to itself: “Nothing could be taken as first
    principles but experiences and the axiom of identity, or (what is the same thing)
    contradiction, is primitive, since otherwise there would be no difference between
    truth and falsehood” (cited in Horn, 2014). The law of identity implies that,
    if $x = x$, then it is impossible to have $x = x+1$, and thus we cannot have $1
    = 0$. The LI and LNC, therefore, are equivalent, as Leibniz points out.


    We see these principles reflected in natural laws. The law of identity translates
    into the Newton’s first law of motion, the law of inertia: an object remains in
    its state of, rest or motion, unless acted upon by an external force (see Meyerson,
    1930). The law of noncontradiction, that is, the impossibility of $0=1$, translates
    into Newton’s third law: for each action, there is an reaction equal in magnitude
    and opposite in direction. If the reaction were of a different magnitude, we would
    end up with $0 = 1$.


    From this perspective, we can see how the conservation law is fundamental in science.
    We can also see how the conservation law emerges as a general principle even if
    it were ignored at the local level. As discussed above, the same conclusion could
    be reached based purely on applied mathematical reasoning, as Dewney (2004)


    ³It should be pointed out that paraconsistent logic does not violate the LNC.
    Paraconsistent logic accommodates inconsistent information in a sensible manner
    that treats inconsistent information as informative. However, it does not entail
    the view that there are true contradictions (Priest *et al.*, 2013).'
