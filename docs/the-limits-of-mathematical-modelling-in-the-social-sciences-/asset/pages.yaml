  md: '# Complex Systems, Decision-Making and Computability 167


    thousands) of years until their disappearance prior to the arrival of Europeans.
    Using ABMs, researchers have developed extremely useful and insightful explanations
    of how the complex interplay of culture and environment explain the disappearance
    of the Anasazi. These explanations may not have been generated using more traditional
    social science methodologies.


    Other research has focused on the emergence of actors in the international system,
    as well as other political processes and interactions (Cederman, 1987). ABMs have
    yielded new insights into dynamics that have led many economists to rethink the
    methodological underpinnings of economics (Velupilli, 2010). Some have even suggested
    that the utility of ABM may rival or even surpass that of dynamic stochastic general
    equilibrium (DSGE) models, which have been a cornerstone effort to bridge the
    micro-macro gap in economics. Some scholars, as Velupilli (2010), have called
    for a fundamental revolution in economics that would move it away from the traditional
    deductive and mathematically formalized framework toward a computable and algorithmic
    foundation. ABMs could play a key role in any such computable foundation, give
    the generative and emergent properties of these simulations (see Epstein, 2006).


    To be fair, ABMs are not without their critics. A fundamental criticism of ABMs
    and simulation in general is that simulation model formulations and outcomes are
    not typically given in mathematical terms, thus making it difficult to bring the
    tools of mathematical analysis to bear. As Epstein (2006) notes in an important
    contribution, the distinction between agent- and equation-based models is illusory
    (see also Hinkelmann et al., 2011). Epstein observes that every ABM is a computer
    program, and as such, is Turing computable. Therefore, “for every Turing machine
    there is a unique corresponding equivalent Partial Recursive Function” (Epstein,
    2006, p. 51; Rogers, 1967). These functions are usually complex and so difficult
    to interpret that their analysis is seldom productive; nevertheless, they exist.
    Consequently, ABMs (and as Epstein argues, generative models in general) are indeed
    deductive, but deductive models are not necessarily generative in character.'
