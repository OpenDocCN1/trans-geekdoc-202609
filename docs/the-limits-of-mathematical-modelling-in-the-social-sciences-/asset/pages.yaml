    each step in the proposed scheme, to find out that is actually impossible, even
    without invoking the conservation law. That is, if we analyze each step employing
    the simplest physical and mathematical concepts, as Dewdney points out, we always
    arrive at the same conclusion: The machine is impossible. Dewdney elaborates (p.
