  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Moreover, as Epstein also notes, for certain classes of problems such as PSPACE
    complete problems, it can be shown that simulation is the best that can be achieved
    (Epstein, 2006, p. 51).^3


    Other important points are addressed by Epstein. In the mathematical social sciences
    in general, and particularly in economics, there has traditionally been a strong
    focus upon demonstrating equilibrium. Epstein points out that there is a distinction
    between equilibria that may exist and those that are attainable. Epstein and Hammond
    (2002) demonstrate this with a simple agent-based game. Given that some equilibria
    may not be obtainable, Epstein questions the wisdom of doubting equilibria as
    a way of understanding economic realities.


    # 5 Classical logic and its (possible) discontents


    The social sciences, and more generally the human and behavioral sciences, have
    been profoundly shaped by the assumptions of standard, or classical logic. Classical
    logic is the foundation of our methodological and epistemological assumptions
    and the intellectual frameworks within which we operate. We do not suggest in
    this chapter that classical logic needs to be abandoned. We do contend, however,
    that of the phenomena we encounter, not just in the physical world but within
    the social sciences, do not always lend themselves to classical logic. We consider
    the possibility that non-standard logics may actually be necessary in certain
    instances for us to understand certain kinds of complex phenomena. These non-standard
    logics may, in turn, provide an important epistemological foundation for helping
    us understand the world.


    Generative social science, or small world simulation, makes no assumptions regarding
    a singular, correct worldview. There is no reality outside of the agents and the
    world that has been created, and within which agents and the world coevolve. ABM
