    # 10. Beyond physics


    We can extend the preceding techniques to several scientific domains. For example,
    the bulk of economics, as presented, in Samuelson''s *Foundations of Economic
    Analysis* (Samuelelson, 1967), or some specific results, such as the Nash equilibrium
    theorem (da Costa and Doria, 2005), easily fit within our construction — we can
    find in a straightforward way a Gipps predicate for results in mathematical economics
    (da Costa and Doria, 1991b). The same goes with mathematical biology (Lotka, 1956).


    We have proceeded from start with a specific goal in mind: we wished to follow
    Hilbert''s program in his 6th Problem, that is, we proposed an axiomatization
    of physics that allows us to explore many interesting mathematical consequences
    of those theories.


    We now wish to obtain specific examples of Gödel sentences — undecidable sentences
    — within the axiomatic versions of these theories, and in a more general cadre,
    we wish to see the effects and consequences of metamhematical results and techniques
    when applied to those theories, or to their axiomatic versions.


