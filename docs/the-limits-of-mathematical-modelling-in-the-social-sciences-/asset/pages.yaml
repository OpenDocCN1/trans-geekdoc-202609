- pgno: 156
  md: '# Shocked Disbelief


    Monopoly experts have an incentive to engage in magical thinking. Obfuscation
    and mystification tend to elevate their prestige and reduce the probability of
    being challenged. As Berger and Luckmann (1966) have pointed out, a body of experts
    may defend its monopoly with “intimidation, rational and irrational propaganda....
    mystification,” and “manipulation of prestige symbols” (p. 87). The alchemists,
    for example, wrote treatises that sometimes contained real information. Often,
    however, their were fully obscure. Some of them claimed to have performed marvelous
    feats while keeping the supposed technique a secret.(Chapter 4 of Mackay (1852)
    is a history of alchemy.)


    Sadly, we cannot claim to have left expert mystification behind Berger and Luckmann
    note that physicians manipulate prestige symbols, mystify, and propagate on the
    power and mastery of modern medicine (p. 88). The “general population is intimidated
    by images of the physical doom that follows” from rejecting a doctor’s advice.
    “To underline its authority the medical profession shrouds itself in... symbols
    of power and mastery, from outlandish costume to incomprehensible language.” Medical
    insiders are kept in, that is kept from “quackery,” not only by the powerful external
    controls available to the profession, but by a whole body of professional knowledge
    that offers them ‘scientific proof’ of the folly and even wickedness of deviance”
    (p. 88).


    Forensic science provides another example of experts engaged in mystification
    and magical thinking. These disciplines rely on subjective judgments that are
    not generally scrutinized by others. One forensic examiner makes a subjective
    judgment and that’s that. This allows little different from those of the ancient
    Greek oracle mongers. Even the most conscientious and scrupulous forensic examiners
    will be unable to judge whether they have followed any rules of science that they
    may even urgently wish to uphold. The logic here seems parallel to Wittgenstein’s
    argument that a private language is impossible (Wittgenstein, 1958, pp. 89e–95e).
    We might say that a person has a “private language,” but precisely because it
    is private no one can check to be the rules of this supposed language have been
    followed, not even the private user herself. Similarly, the'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    subjective judgments of forensic scientists typically go unchallenged by others,
    including other forensic scientists. Instead, a “private” process of evaluation
    yields an incorrigible subjective judgment. It is impossible to check whether
    an examiner followed scientific norms or, more generally, arrived at a reasonable
    (let alone correct!) judgment. The forensic examiner herself is unable to judge
    whether she followed the rules or made a sensible decision.


    As I have noted in Kopp (2010, p. 225), the reliance on subjective techniques
    implies that the personal judgment of a forensic scientist is the principal criterion
    for judging what the evidence means and whether a known and unknown sample have
    a common origin. Many forensic disciplines rely on subjective judgment, including
    “impression evidence” such as shoprints and tire tracks, toolmarks and firearms
    identification (the latter commonly called “ballistics”), traditional handwriting
    microscopy, the handwriting comparisons of questioned examiners, bloodstain pattern
    analysis, and fingerprint examinations (NAS, 2009). Thompson (2009) shows that
    subjective judgment is often used in DNA profiling as well.


    Nichols (2007) attempts a spirited defense of subjective judgment in firearms
    and toolmark identification, which is commonly known as ballistics. He insists
