  md: '# Applications of Nonstandard Logic to the Social Sciences


    The intellectual framework provided by the theory of complex adaptive systems
    (CAS) captures at least part of the logic that our arguments seek to convey. CAS
    are webs or networks of agents that interact with each other — where changes in
    the behavior or properties of one agent can produce effects that ripple throughout
    the system. Agents are bound in loops of mutual influence; agents are interconnected
    whereby all action is the result of actions by others. Arthur, Holland, and others
    asset that markets possess these important features of radical social interdependency,
    in that each agent’s expectations of all other agents’ behavior include anticipation
    of others’ expectations, resulting in a massively interdependent system.


    Different agents have different experiences and evaluate those experiences differently,
    which includes the way those experiences affect observers’ observations of the
    same phenomenon. Indeed, agents could experience the identical phenomenon, but,
    unless their prior experiences were identical, they evaluate that phenomenon differently.


    As observers, we do not merely observe some fixed reality. Rather, what we may
    observe at least, in part, be a function of the expectations of what we observe
    (i.e., “A’s” observation of “B” alters “B’s behavior — a kind of uncertainty principle
    for the social sciences). This, in turn, changes what “A” observes. In the social
    world, we are often not observing fixed, exogenous set of “facts.” Rather everything
    is endogenous. What we observe is a function of the expectations of others, which,
    in turn, affects our own expectations.


    It must certainly be true that the way in which a researcher evaluates a particular
    discovery in the physical world, whether at the cosmological or on the quantum-mechanical
    level, bases his or her evaluation on the prior beliefs and organized frameworks
    in which they operate. The same is certainly the case in the social sciences;
    but more importantly, any observer, or agent, existing in the world acts on the
    basis of a set of beliefs or expectations that have developed about the world
    around them through the development of heuristic learning (Gigerenzer and Brighton,
    2009; Gigerenzer, 2008).'
