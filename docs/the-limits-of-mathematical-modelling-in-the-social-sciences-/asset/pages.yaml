  md: '# Paradox of zero-sum games


    From an economic point of view, the statement $0 = 1$ can be written as $1 = -1$,
    which represents the outcome of a zero-sum game, that is, a transaction in which
    one party gains while the other loses.$^4$ Obviously, trade, in principle, is
    supposed to achieve mutual gain where both parties win. A zero-sum game does not
    create value; it only transfers wealth from one party to another. A zero-sum game
    might be mutually acceptable only on *ex ante*, where the final outcome is uncertain;
    however *ex post*, that is, the actual outcome, will never be mutually acceptable.


    Recall that conservation laws must be satisfied both before and after the process
    takes place, that is, *ex ante* and *ex post*.


    Logically, a zero-sum game involves a contradiction. A logical contradiction arises
    when a statement $p$ in a formal system is both true and false. One famous example
    is the “Liar’s Paradox,” whereby we have the following statement:


    $p$ This statement is false.


    Is statement $p$ above true or false? If it is true, it is false; if it is false,
    it is true. This means that it is true and false at the same time, is, $1 = 0$.
    This is a contradiction.


    A zero-sum game is a transaction that also involves a paradox: Each party seeks
    to win, when in fact, one can win only if the other loses. We might model such
    a game using a variant of the cyclical Liar (see Clark, 2002, p. 268):


    $p(1)$ This statement is true if and only if $p(2)$ is false.

    $p(2)$ This statement is false if and only if $p(1)$ is true.


    Statement $p(1)$ reflects the payoff of player 1. Player 1 wins only if player
    2 loses. Player 2 loses only if player 1 wins. Suppose $p(1)$ is true, then $p(2)$
    says that it is false. If $p(2)$ is false, then it is true, since that is what
    it says — a contradiction. Conversely, suppose


    > $^4$In an exchange, the *ex ante* payoffs of the two parties are supposed to
    be equal. In a zero-sum game, this implies, *ex post*, that $1 = -1$.'
