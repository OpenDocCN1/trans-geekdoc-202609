  md: '# Economics and natural science


    > I have never myself accepted this view. I believe that it reflects a misunderstanding
    so much of the character and possibilities of social science as that of the character
    and possibilities of natural science. In both, there is no “certain” substantive
    knowledge; only tentative hypotheses that can never be “proved”, but can only
    fail to be rejected …In both social and natural sciences, the body of positive
    knowledge grows by the failure of a tentative hypothesis to predict phenomena
    the hypothesis professes to explain …In both, experiment is sometimes possible,
    not without (witness meteorology). In both, no experiment is ever completely controlled,
    and experience often offers evidence that is the equivalent of controlled experiment.
    In both, there is no way to have a self-contained closed system or to avoid interaction
    between the observer and the observed. The Gödel theorem in mathematics, the Heisenberg
    uncertainty principle in physics, the self-fulfilling or self-defeating prophecy
    in the social sciences all exemplify these limitations.


    This seems a view that is shared by other economists (e.g., McCloskey, 1994; Smith,
    2008). There is no reason a priori to treat social sciences fundamentally differently
    from natural sciences. At the end, social activities take place within nature,
    and by agents who abide by the laws of nature. While social phenomena might have
    its own regularities, they cannot violate the laws of nature. Hence, social and
    natural sciences have much in common. Accordingly, we discuss below the defining
    characteristics of science and see how economic theory can learn from them.


    # Conservation laws


    Arguably, the most important principle that had a major impact on the development
    of science was conservation laws. Scientists since'
