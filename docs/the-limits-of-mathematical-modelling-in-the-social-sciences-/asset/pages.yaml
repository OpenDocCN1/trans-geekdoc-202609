    law assumes that “no individual transactor in a market economy is so misguided
    as to suppose that he or she can acquire something for nothing.” If this is the
    case, then total demand must equal total supply, so that there can be no excess
    demand or excess supply in the aggregate, regardless of whether individual markets
    clear or not. Walras’ law is a major principle in general equilibrium models (see
    Blanchard, 2000; Jehle and Renyi, 2011).


    Since the law requires that no one can get something for nothing, it is obvious
    that Ponzi schemes are inconsistent with the law. It is not difficult to see why:
    In a Ponzi debt game, for example, the budget constraint fails to bind (Romer,
