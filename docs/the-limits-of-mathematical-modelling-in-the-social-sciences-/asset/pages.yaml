  md: '# The Limits of Mathematical Modeling in the Social Sciences


    economics needs to take a closer look at science to see what is missing in its
    domain.


    # 3. Characteristics of modern science


    If there is a single property characterizing modern science, it is the recognition
    of its internal limits: limits of what we can know and of what we can do. The
    work of Kurt Gödel, the focus of this volume, is a landmark in this journey, of
    which more will be presented later.


    According to Karl Popper (1959, pp. 48, 247), a scientific law is a set of "prohibitions."
    It prohibits or restricts of otherwise possible outcomes. From this perspective,
    scientific discovery brings in more restrictions or limits. These limits, are
    not harmful as such. The law of gravity prevents us from flying. However, it incentivizes
    us to invent the tools and means to fly without violating the law.


    In the 20th century, however, scientific progress went even further. Werner Heisenberg’s
    Uncertainty Principle, Kurt Gödel’s Incompleteness Theorem, Alan Turing’s Halting
    Theorem, among other discoveries, launched a new era whereby science and reason
    could discover their own limits. While the law of gravity puts limits on our abilities
    to act, these new discoveries put limits on our abilities to know. As Barrow (1998,
    p. 252) points out:


    > Our knowledge about the Universe has an edge. Ultimately, we may even find that
    the fractal edge of our knowledge of the Universe defines its character more precisely
    than its contents; what cannot be known is more revealing than what can.


    This is a distinguishing feature of modern 20th-century science. Economics seems
    somewhat isolated from all these developments. There are no limits in economic
    theory on how much the economist, or the agents in an economy, can know. Nor how
    much they can compute or calculate. All these limits are only "practical," that
    is, can be bypassed by proper advances in technology. From this perspective, economics
    fails to share the distinguishing features that characterize modern science.'
