    the financial crash, then?” He answers:


    > An equation is a tool, and any tool, it has to be wielded by someone who knows
    how to use it, and for the right purpose. The Black-Scholes equation may have
    contributed to the crash, only because it was abused. . . The blame for the failure
    of tools should rest with those who are responsible for its use.


    Economics as a discipline was developed to explain the wealth of nations. The
    main concern of leading economists before the World War II was production and
    distribution of real goods and services. Subsequent mathematical models were developed,
    by Arrow and Debreu, among others, with this objective in mind. Gradually, however,
    these models were applied to zero-sum financial bets. The two domains assume inconsistent
