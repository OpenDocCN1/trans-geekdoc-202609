- pgno: 8
  md: '# Introduction


    So, undecidability and incompleteness creep up everywhere in economics and in
    the social sciences, and seem to hinder the predictive character of mathematics
    in those theories.


    Of course, one can make predictions with the help of mathematical tools. A very
    general theorem in that respect can be proved as a spinoff out of the Tubular
    Neighborhood Theorem (which asserts, roughly, that a neighborhood without singularities
    of a smooth vectorfield ‘looks’ like an n-dimensional tube). So, chaotic deterministic
    systems may have nicely behaved neighborhoods.


    Also, undecidability doesn''t mean total ignorance about a mathematical object:
    it only forbids the existence of a general algorithm a general recipe — specific
    problems; ad hoc solutions may be possible, of course. Science is made of general
    laws, of general computational procedures, and our question is: are such general
    laws possible in the (mathematical) social sciences? If so, how useful are these
    general procedures? Do they tell us something interesting about the social world,
    as much as a system''s Lagrangian tells us a lot about the system''s physical
    behavior?


    The chapters collected in the present volume attempt to evaluate the impact of
    Gödel incompleteness and algorithmic undecidability in the mathematics of economics
    and of the social sciences.


    The opening chapter is a long text by F. A. Doria, which gives an overview of
    the consequences of the already mentioned extension of Rice’s theorem in the language
    of analysis to phenomena described with the help of that same language.


    The next chapter is a wonderful piece by G. J. Chaitain. Chaitain, like a masterful
    magician, cradles the development of mathematics in a metaphysical bed, while
    explaining to us how undecidability uncomputability — causes mathematics to Gödel-incomplete.


    Now keep in mind that mathematics in the social sciences has one task: to compute
    the future, to predict future events out of the present. Can we do it? The remaining
    chapters in the book tackle this issue.


    First we have a chapter by G. Becchio. Becchio presents to us a few ideas of Karl
    Menger, which relate his own theoretical vision with the (then recent) development
    of logic, by Peano, and then Russell'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    and the Polish school, which ventures into nonclassical logics. Becchio is almost
    exhaustive in her treatment of the subject, which is quite unexpected, as much
    of orthodox economics today supports itself in a quite strict classical logical
    language.


    Then R. Koppl enters the field. Koppl examines crashes and turmoil in the economic
    landscape of today and discusses their predictability in the light of the Gödel
    phenomenon. The interesting aspect of Koppl''s chapter is the fact that he boldly
    relates our concrete economic scenario with rarefied visits of metamathematics
    that bear on the language of theoretical economics. And I invite the reader to
    enjoy the beautiful conclusion of his chapter, an elegant pastiche of a tale by
    Jorge Luis Borges.


    D. J. Dean and E. Elliott have contributed two chapters to this volume. Both are
    detailed surveys of the usages of mathematics in the social sciences. The first
    one looks at our main question from the viewpoint of complex systems, a “traditional”
    way of dealing with it. The second one considers our main problem, that is, the
    predictability of events in the social sciences given the Gödel phenomenon. (I
    won’t say more there is an easter egg in his texts, and I don''t want to advance
    it.)


    Finally, S. Al-Suwailem closes our book with the question: Is Economics a Science?
    In addressing this question, he explores an interesting link between logical consistency
    and financial instability via conservation laws. He argues that ignoring the meta-mathematics
    of economic models might lead to misuse and, perhaps, invalidation of these models.
    For the models to be reliable, and economics to become a proper science, economic
    theory must circumvent the logical paradoxes arising from Neoclassical assumptions.
    Gödel’s Theorem — surprisingly?— then would would pave the way for real science.
    I must also thank Dr. S. Al-Suwailen for his prompt and efficient help with the
    editorial chores of this book.


    Francisco Antonio Doria

    October 2016'
