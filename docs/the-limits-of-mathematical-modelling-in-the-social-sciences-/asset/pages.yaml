  md: '# Chapter 6


    # Is Classical Logic Enough?

    Applications of Nonstandard Logic to the Social Sciences


    Denis J. Dean


    School of Economic, Political and Policy Sciences

    Program in Geospatial Sciences

    The University of Texas at Dallas, TX, USA


    Euel Elliott


    School of Economic, Political and Policy Sciences

    Program in Public Policy and Political Economy

    The University of Texas at Dallas, TX, USA


    # 1. Introduction


    The social sciences, and more generally the human and behavioral sciences, have
    been profoundly shaped by the assumptions of standard, or classical logic. Classical
    logic is the foundation of our methodological and epistemological assumptions
    and the intellectual frameworks within which we operate. Most of us have spent
    our lives working in an environment in which the assumptions of classical logic
    are taken as a given. We do not suggest in this chapter that classical logic needs
    to be abandoned. We do contend, however, that many of the phenomena we encounter,
    not just in the physical world but within the social sciences, do not always lend
    themselves to analysis via classical logic.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    This chapter illuminates the ways in which nonstandard logics may be applicable
    to understanding important elements of the world around us. To date, there have
    been, with a few exceptions (including Borrill and Tesfatsion, 2011; Chaitin et
    al., 2012; da Costa and French, 2003; Koppl et al., 2014; Velupillai, 2005, 2007,
    2010), suggestions that the behavioral and social sciences could benefit from
    incorporating new perspectives drawing from nonclassical logic and mathematics.
    We make the case that allowing for the incorporation of nonstandard perspectives
    can provide new insights into social science phenomena. We begin with a discussion
    of the relevance of epistemics, and epistemological issues developed in cosmology,
    and then build upon that discussion in later sections.


    # What do cosmological epistemics have to do with the social sciences?


    In this section, we address the theoretical aspects of the use of nonclassical
    logic by exploring the implications of the observer problem from a cosmological
    perspective. This discussion will touch the role of constructivist mathematics
    and the ways in which important methodological and theoretical innovations in
    the social sciences are consistent with important elements of cosmological epistemology.


    We begin by confronting some of the important issues raised by Smolin (2001) and
    others in their efforts to better understand the problem of observation and multiple
    observers in a universe where no single observer within the universe can have
    all information available to him or her. It is the problem of the “God’s eye view”
    (GEV) perspective vs. a “local observer view” (LOV), perspective in which any
    observer can only know about phenomena in his or her immediate space (Smolin,
    2001; Borrill and Tesfatsion, 2011). While this discussion might appear to provide
    a primarily metaphorical description of what we confront in the social sciences,
    we want to suggest that there is a rich vein of theory available to be tapped,
    and that has potentially important implications for the behavioral and social
    sciences.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Applications of Nonstandard Logic to the Social Sciences


    As described by Smolin (2001), there are two fundamental issues in attempting
    to understand the universe: first, nothing can travel faster than light, and second,
    the universe appears to have created a finite amount of time in the past, that
    is, nearly 14 billion years ago. These two facts together mean that it is impossible
    to observe the entire universe. 14 billion light years away from earth, but only
    as they appeared 14 billion years in the past. But for reasons that are unnecessary
    to explain in detail here, the universe itself is far larger than 14 billion light
    years in any direction.


    A fundamental problem emerges: no observer existing inside the universe we can
    only hope to have knowledge, albeit imperfect, of that part of the universe that
    we can observe. For example, we might, in principle, be able to determine exactly
    how many galaxies exist in the observable universe, but we would have no knowledge
    of knowing how many galaxies exist in the unobserved part of universe. Even extrapolating
    from the known to the unknown portions of the universe is impossible, because
    we have absolutely no knowledge of (including the size of) the unobservable portion
    of the universe, and conventional extrapolation techniques based on classic logic
    require such knowledge. The utility of nonstandard logic, extending our knowledge
    into situations as this, will require us to reevaluate some of the logical premises
    that we take for granted.


    Recognition of the above facts leads to a quantum theory of cosmology. A quantum
    theory of cosmology provides a description of


    > The theory of cosmological inflation states that in the extremely early stages
    of the expansion of the universe from its initial singularity, the universe expanded
    at a rate of many multiples of the speed of light. For those objects that were
    part of that initial expansion, the light from object has yet to reach the earth.
    The latest estimates are that the universe is at a minimum 80 billion light years
    in diameter. It is also worth noting that the expansion of the universe under
    inflation does not violate the limits imposed by the speed of light. The latter
    refers to the limits of light speed within the universe, whereas with regard to
    cosmological inflation we are referring to the expansion of the actual topology
    of the universe itself.'
