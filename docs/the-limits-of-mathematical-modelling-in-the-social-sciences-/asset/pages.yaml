    Another important related area that has potentially important implications for
    our understanding of computational complexity and heuristics is the study of probably
    approximately correct learnability. PAC learning, based upon the groundbreaking
    work of Valiant (1984, 2013), integrates machine learning, evolutionary theory
    in biology, and computational complexity. PAC learnability says that evolution
    can be explained in terms of algorithms that benefit from and interact with their
    environment. For example, the human genome evolves in ways that allow us to interact
    successfully with our environment, although the process is accelerated through
    algorithms that other computational solutions that improve the organism’s ability
    to survive. These algorithms then accelerate evolution and do so in ways that
    can be solved in polynomial time. Those mutations that are computationally tractable
    are more likely to survive, whereas those that are uncomputable or are NP-hard
    are more likely to be rejected. If learning is an evolutionary sense was NP, then
    the process of change and adaptation by an organism would take vastly longer than
    what we observe, suggesting that learning in an evolutionary sense can be done
    in P or polynomial time (Valiant, 2013, pp. 38–43). Importantly for Valiant, the
    process of mental search for a solution is characterized by NP, where mental search
    is defined as “search objects one generates internally in one’s head or computer”
    (Valiant, 2013, p. 39).


    Two other related concepts developed by Valiant (2013, pp. 111–112) that are introduced
    evolvability and deducibility.'
