  md: '# Axiomatics, the Social Sciences, and the Gödel Phenomenon: A Toolkit


    Further, the mathematician has the duty to test exactly in each instance whether
    the new axioms are compatible with the previous ones. The physicist, as his theories
    develop, often finds himself forced by the results of his experiments to make
    new hypotheses, while he depends, with respect to the compatibility of the new
    hypotheses with the old axioms, solely upon these experiments or upon a certain
    physical intuition, a practice that in the rigorously building up of a theory
    is not admissible. The desired proof of the compatibility of all assumptions seems
    to me of importance, because the effort to obtain such a proof forces us most
    effectively to an exact formulation of the axioms.


    There are two main questions in Hilbert’s Sixth Problem:


    +   - To give an axiom system for the whole of physics;

    - To show that the axiom systems we formulate are consistent.


    We already know that, if PA is included in our axiomatics, then by Gödel’s second
    incompleteness theorem we cannot prove the consistency of our axiomatized theories
    for physics.


    But how about incompleteness? There is a folklore conjecture that tries to connect
    quantum physics and incompleteness; one wonders whether there is a relation between
    Gödel incompleteness and Heisenberg’s uncertainty principle. If one had a strict
    equivalence of that conjecture would be the nonexistence of metamathematical phenomena
    such as undecidability and incompleteness at the classical level, in physics.


    Yet we show here such a conjecture is false. Classical physics — which is usually
    taken to be the realm of determinism — is marred by the Gödel phenomenon as its
    quantum counterpart (da Costa and Doria, 1991a,b).


