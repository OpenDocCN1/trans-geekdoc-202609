    are roughly on the order of $2^N$ programs that halt, so if you sum over all possible
    sizes, get infinity, which is no good.


    In order to get sure the halting probability to be between zero and one


    $0 < \Omega = \sum_{p \text{ halts}} 2^{-(\text{size in bits of p})} < 1$


