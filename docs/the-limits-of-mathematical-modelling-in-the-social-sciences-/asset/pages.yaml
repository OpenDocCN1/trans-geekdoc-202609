    # The Hirsch problem: the decision problem for chaos


    That problem was discussed above. Is there an algorithm to check for chaos given
    the expressions of a dynamical system? No. There is no such general algorithm,
    and will be systems that look chaotic on a computer screen (that is to say, they
    are chaotic in a standard model $M$, see section 15) but that proving or disproving
    their chaotic behavior is impossible in $T$ (see Costa and Doria, 1991a; Hirsch,
    1985).


    That result applies to *any* nontrivial characterization for chaos in dynamical
    systems.


    # Wolfram’s conjecture and Penrose’s thesis


    One may speculate that undecidability is common in all but the most trivial physical
    theories. Even simply-formulated problems in theoretical physics may be found
    to be provably insoluble.'
