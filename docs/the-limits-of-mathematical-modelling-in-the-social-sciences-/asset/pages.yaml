    \ moreover, we can algorithmically obtain an expression for that $X$.\n\n# 17.\
    \ Undecidability and incompleteness in the social sciences\n\nOur main examples\
    \ in this section have to do with economics (competitive markets) and the theory\
    \ of social structures as modeled by population dynamics equations. We are especially\
    \ interested in the difficulties of forecasting in economics and in the applied\
    \ social sciences.\n\nWhenever we describe social phenomena by dynamical systems,\
    \ uncertainties in forecasting are usually supposed to be due to the nonlinearities\
    \ in the systems considered, that is to say, they are related to the sensitivity\
    \ those systems exhibit when small changes are made in the initial conditions.\
    \ Linear systems do not have that kind of behavior and are so supposed to be strictly\
    \ deterministic.\n\nOur results contradict that belief. We show that equilibrium\
    \ prices in competitive markets are in general noncomputable, and so fall outside\
    \ the scope of the techniques available in the usual formal modeling tools; competitive\
    \ market equilibrium is, however, equivalent to determining a minmax solution\
    \ for a nonoperative game, which is a linear problem. So, there are also obstacles\
    \ to forecasting when one deals with linear systems. The remaining two examples\
    \ in this section have to do with the ecology of populations (“do we have cycles\
    \ or chaotic behavior?”) and a model for class structures in a population (“will\
    \ the middle class survive?”)."
