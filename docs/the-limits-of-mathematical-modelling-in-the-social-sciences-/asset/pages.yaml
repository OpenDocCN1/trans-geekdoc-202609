  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Now we have a better notion of perfection. Universal programming languages are
    not all equally good. We concentrate on a subset, comprising the ones that enable
    us to write the most concise programs. These are the most expressive languages,
    the ones with the smallest programs. This definition of complexity is a dry, technical
    way of expressing an idea in modern terms. But let me put this into medieval terminology,
    which is much more colorful. What we''re asking, how many yes/no decisions did
    God have to make to create something? — is obviously a rather basic question to
    ask, if you consider that God is calculating the universe. I''m giving you a medieval
    perspective on these modern developments.


    Theology is the fundamental physics, it''s the theoretical physics of the Middle
    Ages.


    The notion of the universal Turing machine that is used in AIT is Turing''s very
    basic idea of a flexible machine. It''s flexible hardware, which we can call software.
    Now, AIT picks out a particular class of universal Turing machines U.


    What are the universal computers U? A universal computer U has the property that,
    for any other computer C and its program p, the universal computer U will calculate
    the same result if you give the original program p for C you want to concatenate
    a prefix $\pi_C$, which depends only on the computer C that you want to simulate.
    $\pi_C$ tells U which computer to simulate. In symbols,


    > $U(\\pi_C p) = C(p)$


    In other words, $\pi_Cp$ is the concatenation of two pieces of information. It''s
    a binary string, You take the original program p, which is also a binary string,
    and in front of it you put a prefix that tells you computer to simulate. This
    means that these programs cp U are only a fixed number of bits larger than the
    program for any individual machine C. These U are the universal Turing machines
    that you use in AIT. These are the most expressive languages. These are the languages
    in which programs are as concise as possible. This is how you define program-size
    complexity. God will naturally use the most perfect, most powerful programming
    languages, when he creates the world, to build everything.'
