- pgno: 111
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    forget about all this theology and philosophy and try to sweep the contradictions
    under the rug. There is an expurgated version of all this called Zermelo-Fraenkel
    set theory, with the axiom of choice, usually designated ZFC.


    This is a formal axiomatic theory that you develop using first-order logic, and
    it is an expurgated version of Cantor’s theory believed not to contain any paradoxes.


    Bertrand Russell was inspired by all of this to attempt a general critique of
    mathematical reasoning, and to find a lot of contradictions, a lot of mathematical
    arguments that lead to contradictions. I already told you about his most famous
    one, the Russell paradox.


    Russell was an atheist who was searching for the absolute, believed in absolute
    truth. He loved mathematics and wanted mathematics to be perfect. Russell went
    around telling people about these contradictions in order to get them fixed.


    Besides the paradox there’s no biggest cardinal, and that the set of subsets of
    everything is bigger than everything, there’s also a problem with the ordinal
    numbers that’s called the Burali-Forti paradox, namely that the set of all the
    ordinals is an ordinal that’s bigger than all the ordinals. This works because
    each ordinal can be defined as the set of all the ordinals that are smaller than
    it is. (Then an ordinal is less than another ordinal if and only if it is contained
    in it.)


    Russell was going around telling people that reason leads to contradictions. So
    David Hilbert, about a century ago, proposed a program to put mathematics on a
    firm foundation. And basically what Hilbert proposed is the idea of a completely
    formal axiomatic theory, which is a modern version of Leibniz’s characteristica
    universal calculus ratiinator.


    In such a formal axiomatic theory, you would have a finite number of axioms, axioms
    that are not written in an ambiguous natural language. Instead, you use a precise
    artificial language with a simple, regular artificial grammar. You use mathematical
    logic, not informal reasoning, and you specify the rules of the game precisely.
    It should be mechanical to decide whether a proof is correct.'
