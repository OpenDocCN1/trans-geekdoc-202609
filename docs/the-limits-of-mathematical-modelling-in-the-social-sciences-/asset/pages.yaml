  md: '# Is Economics a Science? A Gödelian Perspective


    functions of science. The works of economists like Smith, Ricardo, Mill, Marshall,
    Wicksell, Veblen, Keynes, Hayek, Schumpeter, among others, can be viewed as scientific
    explanations behind economic phenomena. However, post-World War II economics,
    the one dominated by the works of Arrow and Debreu, takes a different direction.
    This latter approach to economics, which became the mainstream, raises deep questions
    about the scientific nature of economics.


    In addressing the question: “Is Economics a Science?” this chapter takes a practical
    approach: What can we, economists, learn from modern science and mathematics?
    This might sound strange given the heavy use of mathematics in economic theory.
    As we shall see, mainstream economics learned little from Gödel and other major
    contributors to modern mathematical logic. Our objective is not to add one more
    technique to the already existing arsenal in economists’ repertoire. Rather, it
    is to examine the consistency of economic theory, and to integrate the criteria
    of natural science, with the results of Kurt Gödel on the consistency of formal
    systems. This approach brings interesting insights into this matter, and, hopefully,
    points to the way forward in the reformulation of economics into becoming a proper
    science that contributes positively to the welfare and prosperity of the human
    civilization.


    The chapter is organized as follows. Section 2 presents the main functions of
    science and examines to what extent economics has served these functions. Section
    3 presents the criteria of natural sciences, namely conservation laws and invariance
    principles. Since economics should be no different from natural sciences in principle,
    as Milton Friedman argues, economics is evaluated based on these criteria. Section
    4 discusses the logical foundations of conservation laws. It is argued that conservation
    in physical systems is equivalent to consistency in formal systems. In both, there
    cannot be something for nothing. Section 5 applies this criterion to economics.
    In particular, it is shown that economic theory fails to prevent many forms of
