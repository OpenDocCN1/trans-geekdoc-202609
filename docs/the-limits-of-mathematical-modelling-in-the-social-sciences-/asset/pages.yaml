    # The search for a new logic for social sciences starting from the St. Petersburg
    Paradox¹


    During the 1920s, the philosophical climate in Vienna was influenced by a strong
    rejection of both idealism and neo-Kantianism that culminated in the advent of
    the new empiricism developed by the Vienna Circle (founded in 1922 by Moritz Schlick).
    Members of the Vienna circle reached a certain consensus on: (a) the merits of
    logical analysis of language (basically they were followers of Wittgenstein''s
    Tractatus); (b) the urgency to develop a rigorous epistemology for a scientific
    vision of the world; and (c) the unity of scientific explanation and knowledge
    in general (Stadler, 2001)² New inquiries into epistemology and logic were explained
    in a different way also in the Mathematical Colloquium, which was founded by Menger
    in 1928 (Menger, [1995] 1998).³ There was a general agreement among members of
    the Mathematical Colloquium about the urgency to apply logical-deductive method
