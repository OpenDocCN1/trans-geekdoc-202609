    to $C^3$''s question.” This result is “a restriction on the efficacy of any error
    correction scheme in the presence of a distinguishable omniscient computer” (p.
    01628-10).


    Wolpert’s (2001, p. 01628-2) impossibility results “are all derived through what
    is essentially a physical version of a Cretian paradox... involving two instances
    of the putative self-referential computers. In other words, Wolpert gets his results
    by putting all computers in the model and thus avoiding the errors created by
    trying to adopt the godlike perspective of a detached observer, the man of system.
    When you put all computers into the model, self-reference creates computability
    limits.


    Like the boy in “The Emperor’s New Clothes,” we should naively ask whether the
    agents in our economic models have the knowledge imputed to them whether they
    can do the mathematical calculations imputed to them. Given the conditions favoring
    expert failure in economics, however, it would be itself a form of magical thinking
    to believe that such failure can be avoided or corrected by convincing logical
    argument. The computability lessons of Tsuji et al. (1994), da Costa and Doria
    (2014), Wolpert (2001), and others may be doomed because economic experts have
    an incentive to persist in magical thinking. An interesting episode in the intersection
    between computability theory and economics may bolster our pessimistic assessment.


    Canning (1992) produced a result similar to that of Tsuji et al. (1994), though
    not as strong. He showed that a Nash game may be algorithmically solvable if there
    is no “Nash equilibrium in which the equilibrium strategy is a best reply to all
    replies to itself” (p. 877). He calls this condition “strict Nash.” This is fundamental,
    but he argued curiously that his result implied only a “slight” adjustment to
    then-current practice in social science and applied game theory.


    Canning notes, “Strictness is required because we can construct an ‘imp’ algorithm,
    $\{r\}$, which always acts rationally, but which,”'
