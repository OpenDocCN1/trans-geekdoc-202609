- pgno: 268
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Consistency in mathematics, conservation in science, and scarcity in economics,
    all share the same basic concept: we cannot get something for nothing. While mathematics
    and modern science fully live up to their principles, neoclassical theory fails
    remarkably.


    Economics as a discipline was developed to explain causes of the wealth of nations.
    The main concern of leading economists before World War II was understanding production
    and distribution of real goods and services. A shift, however, took place during
    the second half of the 20th century, whereby economics models were developed to
    provide precise quantitative predictions of market variables. The shift from explanation
    to prediction (or from truth to precision) was accompanied by a shift in another
    direction: From economic activities to zero-sum financial bets. The twin crises
    of the 21st century prove that these shifts were not successful. Without scientific
    laws governing economic activities, mathematical models can do more harm than
    good.


    It is fair to note that economics as a discipline is witnessing substantial changes
    over the years. Behavioral economics, complexity economics, experimental economics,
    among others, are steadily growing. Still, there is a lot to learn even for these
    new fields from the gap between neoclassical theory and modern science. The first
    three points in the table above are still lacking for many alternative schools
    of economics. To build future economics on solid grounds, we better address these
    deficiencies early on to safeguard human civilization against future crises.


