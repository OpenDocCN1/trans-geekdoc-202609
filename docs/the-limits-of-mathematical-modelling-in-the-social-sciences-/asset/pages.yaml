    # 1. Introduction


    The study of what is commonly referred to as complex adaptive systems (CASs) is
    relevant for understanding a sweeping array of phenomena in the behavioral, life,
    and social sciences. The presence of complex systems pose unique challenges for
    those seeking to study CASs and better understand their dynamics at different
    levels of aggregation. CASs also pose important challenges for those who seek
    to better understand how agents acting within these systems behave.


    We begin this chapter with a discussion of CASs and their essential features.
    We explore different methodologies for modeling CASs. In particular, we focus
    on the relevance of agent-based'
  merge: -1
  img_proc: true
- pgno: 172
  md: '160 The Limits of Mathematical Modeling in the Social Sciences


    models (ABMs) to understanding such systems. We then discuss the relationship
    between ABMs and important issues of computational complexity relating to decision
    making and learning, including the suggestion that the reality of CASs requires
    rethinking traditional assumptions about the role of standard or classical logic.
    We conclude with some final thoughts invoking the relationship between CAS and
    the social sciences.


    # 2. Overview of complex adaptive systems


    A brief synopsis of the characteristics of CASs is in order. CASs are typically
    characterized by multiple entities (sometimes termed actors or agents) interacting
    in dynamic ways, with their behavior adapting and evolving over time in response
    to their environment and the behavior of other actors or agents. Moreover, CASs
    are characterized by complex, macrolevel phenomena emerging from interactions
    occurring at the level of the individual agents. This implies that CASs can exhibit
    self-organizing and emergent behavior. This behavior is self-organizing in the
    sense that the behavior of the system is not predetermined or otherwise guided
    through some top-down, hierarchical control mechanism; and it is emergent in the
    sense that the behaviors arise from the functioning of the system itself and do
    not rely on any external agents or forces to evolve.


    There are numerous examples of CASs, including the biosphere (Hinkelman et al.,
    2011), many kinds of group-based behaviors (Axelrod, 1981, 1997a, b), cultures
    (Cecconi et al., 2010), various aspects of global economics (Dawid and Neugart,
    2011), international politics (Cederman, 1997), and segregation dynamics (Schelling,
    1971), among others (see Bonabeau, 2002).


    The interactions taking place within a CAS may be simple or complex (or more frequently
    both), but are abundant and typically characterized by complex, nonlinear feedback
    processes. CASs typically operate in nonequilibrium conditions, and are constantly
    evolving into new states rather than simply maintaining the status quo. Many CASs
    also exhibit self-similar or fractal properties. In other words, CAS phenomena
    are frequently scale-invariant, i.e., patterns observed at the microscale are
    replicated at the macroscale.'
  merge: -1
  img_proc: true
