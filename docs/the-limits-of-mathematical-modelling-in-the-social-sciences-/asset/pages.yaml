    This settles (2). Now we let \theta so that the corresponding Diophantine equation
    p = 0 is never solvable in the standard model for arithmetic, while that we form,
    for such an indicator function,


    ```

    h = \thetaf_0 + (1 - \theta)g_0.

    ```


