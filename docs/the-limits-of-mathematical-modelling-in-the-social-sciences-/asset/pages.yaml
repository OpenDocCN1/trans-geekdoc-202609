- pgno: 21
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    The main point in our exposition is: physics, both classical and quantum, is seen
    here as an outcome, or as an extension of classical mechanics. The Lagrangian
    and Hamiltonian formalisms, for systems of particles and then for fields, are
    seen as a basic, underlying construct that specializes to the several theories
    considered. A course in theoretical physics usually starts from an exposition
    of the Lagrangian and Hamiltonian (the-called analytico-canonical) formalisms,
    how they lead to a general formal treatment of field theories, and then one applies
    those formalisms to electromagnetic theory, to Schrödinger’s quantum mechanics
    — which is obtained out of geometrical optics and the eikonal equation, which
    in turn arise from Hamilton–Jacobi theory and gravitation and gauge fields, which
    grow out of the techniques used in the formalism of electromagnetic theory. Here
    we use a variant of this approach.


    We stress that this chapter is intended as an overview of the results obtained
    by N. da Costa and the author in the search of undecidability and incompleteness
    — the so-called Gödel phenomenon — in physics and then mathematized domains. We
    present here the main “abstract” details (the construction of the many θ functions,
    which code the halting function in computer science and beyond) and then their
    use in the construction of several examples of, let us say, Gödelian behavior
    in physics and beyond.


    # A note on sources for this chapter


    Our sources are the texts listed in the bibliography, and we will liberally use
    several papers of ours, and quote from them. To quote a few of them, we take results
    from a widely circulated preprint (Doria, 2014) as well as three published texts
    (Chaitin et al., 2011; da Costa and Doria, 1994b, 2007).


    > ³This is the actual way most courses in theoretical physics are taught.'
