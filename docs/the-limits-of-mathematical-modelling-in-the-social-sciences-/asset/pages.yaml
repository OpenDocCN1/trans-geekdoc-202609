    # Summing it up


    We will briefly mention a few results of our own (with da Costa) on the axiomatics
    of physics.


    Proposition 9.1. Classical mechanics, Schrödinger’s quantum mechanics, electromagnetism,
    general relativity and gauge field theory can be axiomatized within Zermelo-Fraenkel
    set theory.


    Therefore, all known results in theoretical physics become ZF theorems, as long
    as they can be given rigorous formulations let us say, by the usual mathematical
    standards and without the help of “very large” objects (that last condition is
    given within quotation marks to mean that we exclude large extensions of ZF).


    Proposition 9.2. There are “physically meaningful” undecidable sentences in any
    consistent ZF axiomatization of physics.


    By “physically meaningful”, we mean sentences that describe actual situations
    in physics, e.g., for a particular Lagrangian L, the formalized version of the
    sentence “L describes a harmonic oscillator” is formally undecidable within ZF,
    or as in our first example, “X is'
