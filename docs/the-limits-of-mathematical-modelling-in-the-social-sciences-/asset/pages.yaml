    we limit the number of alternatives from which to choose and develop satisficing
    rather than maximizing strategies. Relately, we develop cues or heuristic devices
    (cognitive roadmaps) to guide our decision-making.


    Velupillai and Kao (2014) argue that Simon''s overall approach to cognitive behavioral
    economics is “underpinned by a model of computation, highlighting the complexity
    of chemical decision processes on the basis of computational complexity theory”
    (Velupillai and Kao, 2104, p. 40). They show how theorems developed by Simon provide
    a foundation for understanding the cognitive constraints individuals face with
    regard to bounded rationality (the complexity of the problems faced is greater
    than the individual''s ability to solve problems). The use of satisficing rather
    than optimizing strategies, the use of procedural as opposed to substantial rationality,
    the reliance upon heuristics, or “cognitive roadmaps” for decision-making are
    critical features of alternative approaches to the traditional utility maximization
    model.


    Importantly for our purposes, we can hypothesize that the time constraints imposed
    on individuals reflect the constraints imposed by NP problems, the very definition
    of NP (that certain problems cannot be computed using an efficient algorithm in
    some tractable amount of time). But also, as Velupillai and Kao suggest, complexity
    issues arise not just from the standpoint of time complexity but space complexity
    as well. That is, “the amount of information minds can process at a given moment
    is severely limited” (Velupillai and Kao, 2014, p. 48).


