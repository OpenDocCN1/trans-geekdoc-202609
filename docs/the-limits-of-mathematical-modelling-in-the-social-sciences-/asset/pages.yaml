    the law if he was to avoid the severest penalty of the law. The top-down imposition
    of the Original Law ensured consistency would be a higher legal principle than
    reasonableness. But consistency is a harsh mistress. Like ice-nine in Vonnegut’s
    Cat’s Cradle, it can transform the propositional ecosystem into a frozen wasteland.
    For classical logic has no mechanism of self-correction. It is not adaptive. In
    the land of Schwindler’s Fragment, the law became an iron cage, and jurists become
    jailors. It might seem tempting to imagine what might have happened if the jurors
    of this country had been familiar with the adaptive, paraconsistent logics of
    Costa and others (da Costa et al., 2007). But consistency seems to have been the
    point of the Original Law. Indeed, we cannot exclude that the law was meant as
    vengeance against a defeated enemy.


    The legal history recounted in Schwindler’s Fragment should serve as a kind of
    warning to economists. In both economics and the country of the Fragment, the
    remorseless application of classical logic to an impossible premise produces dire
    consequences. We may count ourselves lucky in economics that there is an exit
    from bedrock. We can, if we choose, study the Gödel-Turing phenomenon to understand
    it, conquer it, and usefully master. Unfortunately, when germs sponsor research,
    economists have incentive to mortify, ignore, and deny it. For economists willing
    to think and work independently, however, for those wishing to live without the
    patronage of germs, the Gödel-Turing phenomenon can and will be understood, conquered,
    and usefully mastered. Newton da Costa’s work is a good place to start.


