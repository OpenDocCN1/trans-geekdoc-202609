    from a variational principle where the Lagrangian density is $\sqrt{-g}R$, where
    $R$ is the pseudo-Riemannian curvature scalar with respect to $g$, the four-dimensional
    metric tensor with scalar +2.


    +   We find in Einstein’s original presentation an explicit striving for a different
    kind of unification, that of a *conceptual* unification of all domains of physics.
    A unified formalism at that moment meant that one derived different fields from
    a single, unified, fundamental field. That basic field then “naturally” splits
    up into the several component fields, very much like, or in the search of an analogy
