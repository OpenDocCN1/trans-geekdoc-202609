    +   $p(1)$ Statements $p(1)$ and $p(2)$ cannot be true.

    $p(2)$ Statements $p(1)$ and $p(2)$ cannot be both true.


    Each statement can be viewed as representing the payoffs of the two parties. The
    payoff cannot be positive for both. Hence the contradiction. The contradiction
    is reflected in the repeated attempts of players to recover their losses from
    the previous rounds.


    As game theorist Roy Gardner (1995, p. 37) elaborates:


    No value can be created in a zero-sum game; the players are forever at each other''s
    threats. In such a society, economic change is nearly impossible, and when it
    is possible, it comes only at a very high cost.


    Paradoxes such as the Liar have no stable truth value: from one perspective, they
    are true, from the other, they are false. They are, therefore, "logically unstable"
    assertions (Kremer, 2014; Bolander, 2014). When such paradoxes are translated
    into a programming code, they create an infinite loop, which, if implemented on
    a physical machine, will exhaust its resources and result in a crash (Stuart,
    2013, p. 263).


    Accordingly, if market activities involve such contradictions, the market will
    likely involve instability, since players are "forever at each other''s throat,"
    as Gardner points out. Instability can also be inferred from the violation of
    conservation laws, as we shall see in the next section.


