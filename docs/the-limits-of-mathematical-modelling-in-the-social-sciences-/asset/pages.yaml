- pgno: 176
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    CAS are independent actors working within an ecosystem of other actors and environmental
    objects; nodes within an ANN are linked computing structures that work collectively
    to produce a predicted output. Given this, while it may be possible for ANNs to
    recreate the results of certain CASs, it is certainly not possible for them to
    recreate the function of a CAS.


    A second computational architecture that can be used for exploring CASs are genetic
    algorithms (GAs). GAs are evolutionary processes that act upon algorithms intended
    to recreate outputs from observed inputs. These algorithms are iteratively modified
    using techniques that are similar to and inspired by those found in natural evolutionary
    processes, including cloning, mutation, and crossover. GA-based analyses have
    many of the same advantages as ANN-based analyses (e.g., no a priori assumptions
    about distributive qualities of input data, no assumptions about the form of the
    relationships between variables, no independence assumption, etc.), and they have
    the added benefit that the final algorithm produced through the evolutionary process
    can yield insights into the function of the system being modeled (Michalowicz,
    2013). However, it is equally clear that the functioning of GAs are inherently
    very different from the agent-based functioning of CASs.


    Cellular automata (CA) represent another approach for those seeking to model CASs
    (Wolfram, 2008). A cellular automaton consists of a grid of cells each of which
    can be defined as being in one of several states. CASs can be characterized by
    two or more dimensions, although the higher the dimensionality the more complex
    the potential behaviors. For each cell, a set of cells called its neighborhood
    is defined. These neighborhoods can vary in size, defined as the distance between
    the cells in question. The value of any cell affects the cells in its neighborhood
    (Preston and Duff, 2013). It is possible to think of a CA model as a rather rigid
    form of an ABM: cells represent agents, but are immobile and can only interact
    with other agents within their neighborhood. While these limitations are not detrimental
    to some applications, they can obviously be problematic'
  merge: -1
