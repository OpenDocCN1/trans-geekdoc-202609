- pgno: 123
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    The position of these extremists is that, in the future, mathematics will have
    to be written out in a formal language, and you will have to get it checked before
    submitting to a human referee, who will then only have to decide if the proof
    is worth publishing, not whether the proof is correct. And they want a repository
    of all mathematical knowledge, which would be a database of checked formal proofs
    of theorems.


    I''m not disparaging this extremely interesting work, but I am saying that there''s
    a wonderful intellectual tension between it and the incompleteness results that
    I''ve discussed in this talk. There''s a wonderful intellectual tension between
    incompleteness and the fact that people still believe in formal proof and absolute
    truth. People will want to go ahead and carry out Hilbert''s program and actually
    formalize everything, just as if Gödel and Turing had never happened!


    I think this is an extremely interesting and, at least for me, quite unexpected
    development.


    These were the negative conclusions from this saga. Now I want to wrap this talk
    up by summarizing the positive conclusions.


    There are perfect languages for computing, not for reasoning. They''re computer
    programming languages. And we have universal Turing machines and universal programming
    languages, and although languages for reasoning cannot be complete, these universal
    programming languages are complete. Furthermore, AIT has picked out the most expressive
    programming languages, the ones that are particularly good to use for a theory
    of program-size complexity.


    So there is a substantial practical spinoff. Furthermore, since I''ve worked most
    of my professional career on AIT, I view AIT as a substantial contribution to
    the search for the perfect language, because it gives us a measure of expressive
    power, and of conceptual complexity and the complexity of ideas. Remember, I said
    that from the perspective of the Middle Ages, that''s how many yes/no decisions
    God had to make to create something, which obviously he will do in an optimal
    manner.


    > ³Note that program-size complexity = size of smallest name for something.'
