    # 9. Conclusion


    The table below summarizes the main differences between neoclassical economics
    and modern science, based on which we can draw valuable lessons to learn.


    | Science | Neoclassical economics |

    | --- | --- |

    | 1 Perpetual motion is impossible | Perpetual motion is admissible |

    | 2 Conservation laws are cornerstones | No conservation laws |

    | 3 Recognizes its own limits | Does not recognize its own limits |

    | 4 The world is inherently incomplete | The world is inherently incomplete |

    | 5 Axiomatic approach is marginal | Axiomatic approach is central |

    | 6 Primary objective is study of nature | Primary objective is abstract rigor
    |

    | 7 Adopts both reductive and collective methodologies | Methodological individualism
    is the primary approach |


    If there is a single lesson to learn from modern science, it is the impossibility
    of perpetual motion. Nonetheless, the idea of perpetual motion is deeply ingrained
    in neoclassical theory. Ponzi schemes and bubbles are perfectly possible in a
    neoclassical economy. Perpetual growth is not only possible, it is an objective
    of economic policy. These two forces of perpetual motion contributed to the two
    crises in the history of human civilization: The Global Financial Crisis, and
    the impending Global Climate Crisis. Perpetual motion involves logical paradoxes.
    These paradoxes are contradictions that render the formal system inconsistent.
    If the system represents the market, the market thus becomes unstable and unsustainable.'
