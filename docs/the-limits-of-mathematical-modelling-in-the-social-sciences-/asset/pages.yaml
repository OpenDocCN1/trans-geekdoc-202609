    to be tractable and, therefore, useful. For economic models, such assumptions
    are obviously not always realistic, as Friedman (1953) famously hypothesizes.
    Businesses, Friedman argues, need not be “profit maximizers” in reality, but they
    behave as if they are. What matters at the end is not the specific assumptions
    the model adopts, but the predictions of the model. Friedman (p. 149) argues that,


    > ...theory to be judged by its predictive power for the class of phenomena which
    is it intended to explain ...the only relevant test of the validity of a hypothesis
    is comparison of its predictions with experience.


    So precision prediction comes at the expense of realistic explanation of the phenomenon,
    or, following Mayer (1993), there is a trade-off between truth and precision.
    This seems to be a reasonable price to pay — we would be happy to give up on a
    deep understanding of economic reality to gain precise predictions of its future
    behavior. But was economics able to make this trade-off?


    It is clear that economic models failed miserably at predicting the major events
    since World War II. First was the impact of the oil shock in 1973, after which
