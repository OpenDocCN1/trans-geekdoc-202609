  md: '# Complex Systems, Decision-Making and Computability 163


    The computational methodology that we focus on in this chapter is agent-based
    modeling (ABM). What makes ABM such an attractive approach for representing CASs
    is that at its core, ABM processes many of the fundamental characteristics that
    define CASs. Both CASs and ABM focus on multiple agents interacting with their
    environment and one another, both allow for arbitrarily complex feedback loops
    that impact future agent behaviors, and both allow the behavior of the system
    to evolve from the conglomeration of the actions of the individual agents. These
    similarities make ABM a natural choice for modeling CASs.


    Before we turn the focus of this chapter exclusively on ABM approaches toward
    modeling CASs, it will be useful to look at some of the alternatives, and their
    computational implications. One alternative approach involves the use of artificial
    neural networks (ANNs). ANNs can be described as a set of simple statistical devices
    (nodes) linked together in a network that is designed to mimic the structure of
    neurons in the human brain. This architecture, ANNs are capable of learning and
    adapting: when trained with matched sets of input patterns (feed into the first
    layer of nodes in the network) and output patterns (produced by the last layer
    of nodes), the network will learn the proper analytic techniques to apply at each
    node throughout the network to produce a predicted output pattern that as closely
    as possible recreates the observed output pattern, given the input pattern that
    produced the observed output (Karayannis and Venetsopoulos, 2013).


    ANNs are often considered superior to conventional statistical predictive techniques
    because they make no assumptions about the distributional qualities of the data,
    the form of the relationships (e.g., linear or not) between the variables, or
    the degree of correlation between input variables. These same qualities make them
    attractive to those modeling CASs. However, while the advantages of ANNs are real,
    ANNs themselves do not in any meaningful way replicate the function of CASs. While
    sometimes argued that the interactions between the nodes of an ANN are synonymous
    with the interactions of agents within a CAS, such similarities are spurious.
    Agents in a'
