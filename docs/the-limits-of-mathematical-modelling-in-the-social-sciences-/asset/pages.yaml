    The cognitive scientist David Hoffman suggests, controversially, the traditional
    assumption that our perceptions represent a reasonably accurate, although not
    necessarily perfect, representation of the real world has be set aside. The traditional
    assumption holds if human perceptions were not reasonably accurate, evolution
    would have prevented the human race from achieving its current status because
    of its inability to adapt to the environment. Evolution, so it is argued, must
    produce organisms whose perception of the environment matches with reality. Hoffman
    rejects this argument, stressing that it assumes a strong correspondence between
    truth, or objective reality, and fitness, when, in fact, objective reality has
    little to do with whether or not the organism is fit from an evolutionary perspective.
    For Hoffman, what describes the world are conscious agents, all with a first-person
    point of view, who interact with each other. There is no single, objective third-person
    perspective. This “conscious realism” is based upon a perspective that says that
    the idea that we as individuals are capable of measuring or perceiving the same
    object at the same time in the same place and get the same results is wrong, and
    runs counter the perspectives developed in quantum physics over the last several
    decades (Hoffman, 2008; 2014; Hoffman and Singh, 2012). If Hoffman and his colleagues
