  md: '# Is Economics a Science? A Gödelian Perspective


    # Is risk quantifiable?


    Is it possible to quantify the risks facing a growing economy? Can we systematically
    compute the distribution of resources, output, and returns, so that we can calculate
    the likelihood and magnitude of economic expansions and downturns?


    Based on the work of da Costa and Doria (2005), among others, we argue that, in
    principle, this is not possible (see Al-Suwailem et al., 2016). Even if we have
    the most comprehensive mathematical model of the economy with the most comprehensive
    and accurate data and the most powerful computing power, Gödel’s incompleteness
    theorem shows that there are fundamental limits to our ability to predict the
    future and therefore to quantify the risks ahead. There is no systematic way to
    quantify and quantify risk.


    Another way to see this result is that, for a growing economy, if we were able
    to quantify systematically the risks facing the economy, then in a complete world
    akin to that Arrow (1964), we can design a perfect insurance system to hedge these
    risks. This will allow the economy to achieve perpetual growth and generate riskless
    returns. But, the latter is impossible. It follows that risk cannot be quantifiable.
    We will not be to build an insurance system that fully neutralizes risk. Risk
    is inevitable.


    # Risk-return relationship


    A well-documented economic phenomenon is the positive correlation between risk
    and returns. “The tradeoff between risk and expected return is the most fundamental
    notion in modern finance” (Poitras, 2010, p. 44). The phenomenon might be explained
    based on the laws of thermodynamics. We have seen that the first law, the conservation
    law, implies that growth cannot continue forever, and there is always a risk emanating
    from the impossibility of perpetual motion.


