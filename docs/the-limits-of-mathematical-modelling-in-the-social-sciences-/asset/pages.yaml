    give here a slightly modified argument that actually Proposition 13.8. First notice


    ```

    $$\phi^{(m+1)} = \{x : \phi_x^{\phi^{(m)}}\}$

    ```


    is recursively enumerable but not recursive in $\phi^{(m)}$. Therefore, $\phi^{(m+1)}$
    isn’t recursively enumerable in $\phi^{(m)}$, but contains a proper $\phi^{(m)}$-recursively
    enumerable set. Let us take a look at those theorems.


    We need a lemma: form the theory $T^{(m+1)}$ whose axioms are for $T$ plus a demonstrably
    infinite set of statements of the form “$n_0 \in \phi^{(n)}$, $n_1 \in \phi^{(n)}$,
    $\dots$” that describe $\phi^{(m)}$. Of course, this theory doesn’t have a recursively
    enumerable set of theorems. Then,


    # **Lemma 14.4.** If $T^{(n+1)}$ is arithmetically sound, then $\phi_x^{\phi^{(m)}}
    \downarrow$ if and only


