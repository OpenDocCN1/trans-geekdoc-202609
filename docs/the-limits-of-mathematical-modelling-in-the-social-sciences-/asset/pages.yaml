  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Galileo Galilei realized that a physical system cannot generate more energy than
    what it starts with, without an external source of energy (Coopersmith, 2010,
    Chap. 2). Newton''s third law reflects this principle: For each action, there
    is a reaction equal in magnitude and opposite in direction. An action cannot,
    as such, generate a reaction of a different magnitude.


    During the mid-19th century, the law of conservation of energy was established
    (Lightman, 2000). Other conservation laws were discovered concerning momentum
    and electric charge, among others. No scientific theory is to be acceptable if
    it violates these laws. Conservation of energy is the first law of thermodynamics,
    which states that, in an isolated system, total energy is constant.


    The second law of thermodynamics, another major law of nature, states that, while
    total energy in an isolated system is constant, available for useful work cannot
    increase over time. In other words, useless energy, or entropy, tends to rise
    over time. The third law of thermodynamics states that entropy can never become
    zero. Alternatively, no system can have a temperature of absolute zero (−270°C).


    As theoretical physicist Kaku (2008) points out, the first law says “You can’t
    get something for nothing.” The second law says, “You can’t break even.” The third
    law says, “You cannot get out of the game.” Despite the obvious importance of
    these laws to economic activities, mainstream economics pays little attention,
    if any, to them. We will discuss this connection in detail in the next section.


    # Perpetual motion machines


    The conservation law is a statement that holds as a general principle across all
    scientific theories and applications. Perpetual motion machines (PMM) are machines
    that are claimed to systematically generate more energy over time than they start
    with, without an external source of energy. PMMs have an interesting history (see
    Ord-Hume, 2005). Proposals for PMMs suffer from no shortage of imagination and
    creativity. They only lack proper accounting: Some,'
