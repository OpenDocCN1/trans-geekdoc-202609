    Hoffman’s assumptions draw heavily upon quantum theory, and seems consistent at
    a general level with Fuchs’ findings. Fuchs’ (2010, 2014) research into quantum
    Bayesian approaches to reality provide new insights that complement Hoffman’s
    “conscious realism”. The traditional assumption of quantum theory is that a wave
    function describes the complete state of some aspects of the world, and the shape
    of the wave function essentially represents the probabilities of the outcomes
    of measurements that some observer chooses to make. At this point, the quantum
    view of reality is still much grounded in the traditional notion of a third person
    observer who observes some single view of reality. Fuchs and his colleagues interpret
    the wave function’s probabilities as Bayesian or subjective degrees of belief
    about the system. According to Quantum Bayesianism (QBism), the wave function’s
    collapse is the observer updating his her beliefs after taking a measurement (or
    making an observation). Whereas the Copenhagen interpretation of quantum behavior
    requires there be an observer representing God’s Eye View (GEV) of the world,
    Fuchs treats the wave function as one observer’s subjective knowledge about the
    world (Fuchs 2014; 2010). Again, the notion of a local observer viewpoint (LOV),
    is reinforced.


