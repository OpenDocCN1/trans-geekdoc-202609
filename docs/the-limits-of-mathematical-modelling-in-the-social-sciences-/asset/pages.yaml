  md: '# Hilbert’s Sixth Problem


    The Mathematical Treatment of the Axioms of Physics.


    The investigations on the foundations of geometry suggest the problem: to treat
    in the same manner, by means of axioms, those physical sciences in which mathematics
    plays an important part; in the first rank are the theory of probability and mechanics.


    As to the axioms of the theory of probabilities, it seems to me to be desirable
    that their logical investigation be accompanied by a rigorous and satisfactory
    development of the method of mean values in mathematical physics, and in particular
    in the kinetic theory of gases.


    Important investigations by physicists on the foundations of mechanics are at
    hand: I refer to the writings of Mach..., Hertz..., Boltzmann..., and Volkman...
    It is therefore very desirable that the discussion of the foundations of mechanics
    be taken up by mathematicians also. Thus Boltzmann’s work on the principles of
    mechanics suggests the problem of developing mathematically the limiting processes,
    those merely indicated, which lead from the atomic view to the laws of continua.
    Conversely, one might try to derive the laws of motion of rigid bodies by a limiting
    process from a system of axioms depending upon the idea of continuously varying
    conditions on a material filling space continuously, these conditions being defined
    by parameters. For the question as to the equivalence of different systems of
    axioms is always of great theoretical interest.


    If geometry is to serve as a model for the treatment of physical axioms, we shall
    try first by a small number of axioms to include as large a class of possible
    phenomena, and then by adjoining new axioms to arrive gradually to the more special
    theories. At the same time, Lie’s principle of subdivision can perhaps be derived
    from the profound theory of infinite transformation groups. The mathematician
    will also have to take account not only of those theories coming close to reality,
    but also, as in geometry, of all logically possible theories. We must be always
    alert to obtain a complete survey of all conclusions derivable from the system
    of axioms assumed.'
