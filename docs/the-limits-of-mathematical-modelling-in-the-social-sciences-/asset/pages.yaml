    We follow the usual mathematical notation here. We use Suppes predicates as our
    main tool. As said, a Suppes predicate is essentially a set-theoretical conjunction
    with parts:


    +   - First, conjunct describes the mathematical objects we use in our theory
    (spacetime, vectors, tensors, and so on).

    - Then, the second conjunct gives the dynamics for the theory. It may be given
