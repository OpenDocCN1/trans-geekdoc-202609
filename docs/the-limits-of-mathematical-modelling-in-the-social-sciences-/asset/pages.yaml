- pgno: 113
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    It would be hard to find the interesting theorems and to separate the wheat from
    the chaff. But, in principle, this would give you all mathematical truths. You
    wouldn''t actually do it, but it would show that mathematics gives absolute certainty.


    So was the idea of putting mathematics on a firm foundation and removing all doubts.
    This was Hilbert''s idea, about a century ago. Meta-mathematics studies a formal
    axiomatic theory from the outside. Notice that this is a door to absolute truth,
    following the notion of the perfect language.


    What happened? There is some good news and some bad news. Some of the good news
    I already mentioned. The thing that comes closest to what Hilbert asked for Zermelo-Fraenkel
    set theory, and it is a beautiful axiomatic theory. I want to mention some of
    the milestones in the development of this theory. One of them is the Neumann integers,
    so let me tell you about. Remember that Baruch Spinoza had a philosophical system
    in which the world is built out of one substance, and that substance is God. That''s
    all there is. Zermelo-Fraenkel set theory is similar. Everything is sets, and
    every set is built out the empty set. That''s all there is: the empty set, and
    sets built starting with the empty set.


    Zero is the empty set {}, that''s the first von Neumann integer, and in general
    $n+1$ is defined to be the set of all integers less or equal to $n$:


    ```

    $n+1 = \{0, 1, 2, \dots, n\}$

    ```


    If you write this out in full, removing all the abbreviations, all you have are
    curly braces, you set formation starting with no content, and the full notation
    for $n$ grows exponentially in $n$ because everything up to that point is repeated
    in the next number. In spite of this exponential growth, this is a beautiful conceptual
    scheme.


    Then you can define rational numbers as pairs of these integers, you can define
    real numbers as limit sequences of rational numbers, and you get all of mathematics,
    starting just with the empty set. So it''s a lovely piece of ontology. Here''s
    all of mathematical creation just built out of the empty set.'
