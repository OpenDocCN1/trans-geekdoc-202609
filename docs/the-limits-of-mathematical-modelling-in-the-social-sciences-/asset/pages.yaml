    where the program ends. You don''t put a blank at the end to indicate that.


    So programs from N bits in size to N + log₂ bits, because you''ve got to indicate
    in each program how big it is. On the other hand, you can take subroutines and
    concatenate them to make a bigger program, program-size complexity becomes sub-additive.
    You run the universal machine U to calculate the first object x, and then you
    run it again to calculate the second object y, and then you''ve got x and y, and
    so


    > H(x, y) ≤ H(x) + H(y)


    These self-delimiting binary languages are the ones that the study of program-size
    complexity has led us to discriminate as the ideal languages, the most perfect
    languages. We got to them in two stages, 1960s AIT and 1970s AIT. These are languages
    for computation, for expressing algorithms, not for mathematical reasoning. They
    are universal programming languages that are maximally expressive, maximally concise.
    We already know how to do that in the 1960s, but in the 1970s we realized that
