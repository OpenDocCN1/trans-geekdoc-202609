  md: '# Introduction


    apud I. Asimov, Second Foundation


    Hari Seldon is a fictional character created by Isaac Asimov for his Foundation
    series of romances. A highly unlikely character, we may add: a politician with
    mathematical skills, who developed the discipline of psycho-history, or the mathematical
    description of social processes and of the evolution of history.


    Asimov later tells us a bit more about the workings of psychohistory: it''s basically
    a nonlinear dynamical system, and in later books from the Foundation series, he
    incorporates into Seldon''s creation some stuff from chaos theory.


    Chaos theory? Back to the real world, then. In 1963 E. Lorenz published his famous
    paper on deterministic chaos, “Deterministic Non-Periodic Flow.” The title itself
    is an understatement, or perhaps a discrete disguise: for Lorenz discusses a system
    of three autonomous differential equations with just two-degree nonlinearities—
    which exhibits a very complex, apparently chaotic, behavior, which hinders the
    prediction of the time-evolution of our system.


    Social systems have long been modeled by autonomous differential equations with
    low-degree nonlinearities, as in competition models conceived out of the Lotka–Volterra
    equations. Those'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    particular equations are nonlinear but predictable, that is, with Lotka-Volterra
    systems at hand, we know that nonlinearities aren''t sufficient for a dynamical
    system to exhibit chaotic behavior. (But they are a necessary condition.) So,
    arose the question of an algorithmic procedure to anticipate whether a nonlinear
    system would exhibit chaotic behavior.


    The nonexistence of such an algorithm was proved, under general conditions, by
    da Costa and Doria in 1991. So, only nonlinear systems may turn out to be unpredictable;
    we cannot even say for (arbitrary systems and conditions) whether they will be
    unpredictable or not! Moreover there will be systems that are chaotic in one model
    for mathematics, and perfectly predictable in another model.


    Here the Gödel phenomenon enters the picture. If we could make calculations with
    infinite precision, we could predict with all sharpness the future behavior of
    chaotic systems. But there would be situations where not one of these calculations
    are possible.


    So, we have a higher-order difficulty here — one that anticipated by our fictional
    sage, Hari Sed own. Chaotic systems are deterministic: therefore, given infinitely
    precise calculations, all future behavior can be predicted. However, when the
    Gödel phenomenon enters the game, no calculations might exist because we have
    no algorithms to perform them; no algorithms exist (and the standard concept for
    mathematical proof subsumes an algorithmic construction).


    A. Lewis and V. Veluppilli, among others, were pioneers in the discussion of undecidability
    and incompleteness in mathematical economics. We now know that, for example equilibrium
    prices in efficient markets are noncomputable, in the general case (this follows
    from a 1995 result by Lewis). In 1998, Tsuji, da Costa, and Doria entered the
    fray, with their result on the incompleteness of game theory — which is valid
    for a wide range of axiomatizations of Nash games and analogous theories.


    The reason for such a vast presence of Gödel-like phenomena in mathematical economics
    is simple: they follow from a Rice-like theorem, which can be proved for the language
    of classical analysis, which is the language used by mathematical economists when
    exhibiting'
  merge: -1
