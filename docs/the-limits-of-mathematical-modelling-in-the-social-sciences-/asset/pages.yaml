  md: '# Axiomatics, the Social Sciences, and the Gödel Phenomenon: A Toolkit 21


    It is one of the theses of this book that there is no theoretical way of drawing
    a sharp distinction between a piece of pure mathematics and a piece of theoretical
    science. The set-theoretical definition of the theory of mechanics, the theory
    of thermodynamics, and a theory of learning, to give three rather disparate examples,
    are on all fours with the definitions of the purely mathematical theories of groupsgroups,
    rings, fields, etc.


    (See Suppes, 1988)


    # Construction of Suppes predicates


    References are da Costa and Chuaqui (1988) and Suppes (1967, 1988). In the present
    version, a Suppes predicate is a conjunction of two pieces. The first one gives
    the mathematical setting for the objects we are going to deal with, constructed
    through set-theoretic operations out of known objects in the set-theoretic universe,
    while the second component adds the dynamical equations that rule the process
    (they act as a kind of postulate for our domain). For examples see da Costa and
    Doria (1992a, b) and da Costa et al. (1990).


    # 8. Axiomatic for physics: the main ideas


    The usual formal⁷ treatment for physics goes as follows: one writes down a Lagrangian
    or a Lagrangian density for the phenomena we are interested in, and then use the
    variational principle as a kind of algorithmic procedure to derive the Euler-Lagrange
    equations, which gives us the dynamics of the system. The variational principle
    also allows us to obtain a conservation-law, symmetry dependent interpretation
    of interaction as in the case of the introduction of gauge fields out of symmetry
    conditions imposed on some field (see Corson, 1953; Utiyama, 1956).


    > ⁷We will proceed in an informal way, and leave to the archetypical interested
    reader the toil and trouble of translating everything that we have done into a
    fully formal, rigorous treatment of our presentation.'
