  md: 'for much of the 20th century, it assumes that individuals have the computational
    skills to be able to optimize in whatever environment he or she finds oneself.
    Such optimizing requires adherence on the part of the decision maker to certain
    canons of logic. But, most of us, at least under many circumstances, behave in
    this fashion? How do we actually decide? The traditional approach assumes that
    individuals exhibit a comprehensive, or unbounded, rationality.


    Over the last few decades, the standard model of economists has been challenged.
    Beginning with the work of Simon (1955, 1957), who pioneered this research and
    continuing through the work of Kahneman and Tversky (1979, 1996), and Gigerenzer
    (2008), and Gigerenzer and Brighton (2009), an alternative model has been proposed.
    The fundamental assumption is that individuals are boundedly rational. A term
    coined by Simon, the concept of bounded rationality has been vastly misunderstood.
    It does not simply minimize under constraints, nor does it refer to irrationality.
    It says that individuals act with agency, but the complexity of the environment
    creates challenges that our cognitive architecture cannot handle. Thus, we develop
    alternative strategies for decision-making. For example, we limit the number of
    alternatives from which to choose; we develop cues or heuristic devices (cognitive
    roadmaps) and heuristics to guide our decision-making.


    The concept of heuristics is very important; heuristics are simple efficient rules
    governing how individuals act under certain circumstances. Gigerenzer, a leading
    theorist in the study of decisionmaking, refers to "fast and frugal heuristics".
    Gigerenzer has also published studies that demonstrate that heuristic-based decision-making
    does not necessarily yield inferior results compared to more orthodox models of
    decision-making. Indeed, heuristics can offer superior outcomes. While the details
    cannot concern us here, we suggest that heuristics require at some level a relaxation
    of standard logic. The more complex the decision-making environment, the greater
    the likelihood that traditional logic is relaxed in favor of a dynamic and variegated
    series of cognitive maps that guide our passage through complex and uncertain
    environments.'
