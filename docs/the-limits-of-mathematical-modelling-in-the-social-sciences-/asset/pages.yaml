- pgno: 162
  md: '# Shocked Disbelief


    Citing Wolpert (1996), Kopp and Rosser (2002, pp. 354-358) show that his results
    about the limits of prediction apply to social science as well. Wolpert (2001,
    pp. 016128-3 and 016128-14) notes that his results are robust to the interpretation
    of the universe in his analysis; they require only that the computers considered
    exist within the system in question.


    The model of the universe that Wolpert uses to get his unpredictability is so
    broad that it “does not rely on temporal ordering of events.” Thus, unpredictability
    also shows that “no computer can infallibly predict the past” either (Wolpert,
    2001, p. 016128-1, emphasis in original). This limit, in turn, implies that memory
    is fallible. Now can there be “an infallible general purpose observation device”
    or “an infallible general purpose control device” (p. 016128-2).


    Wolpert’s analysis would seem to have an intriguing theological implication. If
    God intervenes in the world actively, then God is not omniscient. If God is omniscient
    and unerrring, it is only because he does not interact with the world he created.
    This theological insight raises a political question. If we imagine a personal
    god to be fallible, how much faith can we place in human regulators, lawgivers,
    and overlords?


    Wolpert’s concept of “god computer” helps to reveal limits to error correction.
    He defines a god computer as “any physical computer in a set of computers such
    that all other computers in that set are predictable to the god computer.” Any
    set of (“pairwise-distinguishable”) computers can have at most one god computer.
    A god computer is omniscient if it can predict not merely any other individual
    in the set, but all of simultaneously (Wolpert, 2001, p. 016128-10). Notice that
    an omniscient god computer is “omniscient” only with respect to the outputs of
    other computers in the set. One might expect that a cooperative combination of
    fallible computers might be able to achieve perfection through error correction.
    This does not seem to be the case, however. Consider the case of three (“pairwise-distinguishable”)
    computers, $C^1$, $C^2$, and $C^3$, where $C^2$ corrects the prediction $C^3$
    makes about $C^1$. “Then'
