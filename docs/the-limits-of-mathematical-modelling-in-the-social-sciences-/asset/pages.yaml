  md: '# Complex Systems, Decision-Making and Computability 165


    in other situations. Thus, it is perhaps best to view CA models as a special case
    of the more general ABM approach.


    ABMs consist of agents interacting in simulated time and space. In the object-oriented
    computer programming motif, agents are simply instances of an object of the type
    "agent." An ABM can consist of multiple types of agents, and there can be one
    or more instance of each type of agent. Each agent has certain properties that
    can change over time, or as a result of some action taken by the agent, or as
    a result of interactions with other agents and their environment. As just implied,
    agents also have certain abilities that they can move through space, manipulate
    their environment, or interact with other agents. Returning to our earlier example,
    an ABM designed to simulate traffic would have a "car" agent, and there would
    likely be thousand instances of this type of agent. Each car agent would have
    certain properties (such as how much fuel is in its tank), and these properties
    would change over time (e.g., as the car consumes fuel) and through actions taken
    by the agent (e.g., the rate of fuel consumption would increase while the car
    was accelerating). Each car agent would also have certain abilities, such as the
    abilities to accelerate, decelerate, turn left or right, and so forth. Epstein
    and Axtell (1996) provide an excellent introduction to ABM and the construction
    of simple artificial societies. A more expansive discussion is seen in Epstein
    (1999). One point to keep in mind is that researchers do not necessarily use these
    methodologies themselves, but will seek to exploit multiple approaches in conducting
    research. One might seek to develop hybrid CA and GA models of a particular phenomenon
    of interest, for example. A major challenge for the future is to delineate which
    methodologies or combinations of methodologies are most appropriate under particular
    circumstances and conditions.


    Each agent in an ABM exhibits a certain behavior (i.e., determines which one of
    its abilities to employ at any given time) based on its current properties and
    the ways it is currently interacting with other agents and its surrounding environment.
    Since the agent''s properties can change throughout an ABM simulation, the agent''s'
