    The behavior of CAS more generally captures the concept of the LOV of world where
    agents can only have partial knowledge of their surroundings. Different agents,
    situated at different locations, reach different conclusions regarding the truth
    or falsity of certain statements. These behaviors suggest the need for some rethinking
    of the standard, traditional assumptions governing logic and the role of classical
    logic in the social sciences.


    While consistent with the principles of bounded rationality, the actions of agents
    in a CAS also relate in a deep way to the concept of heuristic decision-making
    as an alternative to the classical utility maximization model, and more speculatively
    suggests connections between bounded rationality, heuristics, and PAC learnability.
    A careful analysis of CASs provides important insights into the foundations of
    computing and computability, and provides a means of not only bridging the social
    sciences but establishing a much closer link between the social and natural sciences
    on important questions of computation. This is seen clearly in the work of Hoffman,
    Fuchs, Valiant, and others. The theory of CASs offer great hope for developing
    a synthesis of our understanding of computation, computational complexity, its
