    Given the tight connection between religion and politics that Nilsson notes, to
    question divination was a political act that threatened state power. The death
    of Socrates is to be seen in the light of political struggles in which the philosopher
    challenged the authority of religious experts who then used political means to
    defend their prerogatives. The politically powerful used seers and divination
