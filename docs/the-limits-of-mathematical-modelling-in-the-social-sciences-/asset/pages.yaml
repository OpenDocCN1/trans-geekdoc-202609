  md: "# Part I. Playing games with the theta function\n\nWe have here a long, detailed,\
    \ conceptual discussion on undecidability and incompleteness. Then we get to hard\
    \ facts. Section 11 presents the concepts and ideas involved in our incompleteness\
    \ proofs. Presentation sketches previous contributions to those questions and\
    \ relates to our work. Section 16 describes in nontechnical detail our contribution\
    \ to several open questions in mathematical physics and related areas. Section\
    \ 17 applies our results to economics and to ecological models. In Section 15,\
    \ we review the formal background for our results, that is, the theory of Suppes\
    \ predicate and state without our main undecidability and incompleteness theorems,\
    \ while section 20 gives details about the ecological models we use in Section\
    \ 17.\n\nWell, and the $\theta$ function? Wait, please.\n\nThe present chapter\
    \ may be looked upon as lending support to Suppes' contention that there is no\
    \ essential difference between “a piece of pure mathematics and a piece of theoretical\
    \ science.” We show that Gödel-like phenomena occur everywhere and in rather intuitive\
    \ contexts within the language of classical analysis. They therefore necessarily\
    \ occur within any theory where the underlying language is that of classical analysis.\
    \ As Suppes (1988) remarks:\n\nIt is difficult to predict the future of axiomatic\
    \ methods in the empirical sciences. There are signs, at least, the large gap\
    \ that presently separates the methods used in physics from those used in mathematics\
    \ is beginning to close. In any case, axiomatic methods are now widely used in\
    \ foundational investigation of particular sciences, as well as in the pursuit\
    \ of certain general questions of methodology, especially those concerning probability\
    \ and induction. The use of such methods permits us to bring to the philosophy\
    \ of science the standards of rigor and clarity that are very much an accepted\
    \ part of the closely related discipline of logic.\n\n> I would also like to point\
    \ out that a related, albeit more refined approach to the axiomatization of the\
    \ empirical sciences can be found in the book of Balzer et al. (1987)."
