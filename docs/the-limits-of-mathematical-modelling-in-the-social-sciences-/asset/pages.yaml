    # Economic constraints


    There are two conditions that typically constrain the behavior of rational agents
    in economic models: (1) transversality condition (TVC), together with its mirror
    condition: no Ponzi game (NPG), and (2) Walras’s law.


    In simple terms, the TVC prevents overaccumulation of wealth or savings (Kamihigashi,
    2008). TVC requires the present discounted value of the agent’s consumption matches
    the present discounted value of his savings. In other words, asymptotically, the
    agent shall consume all his savings in the course of his (infinite) lifetime.'
