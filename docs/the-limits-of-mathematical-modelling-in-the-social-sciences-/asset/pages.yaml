  md: '# Logics and Formal Ethics in Karl Menger


    Menger was convinced that ethics as a normative science was impossible because
    experience reveals only what “is”, not what “ought to be”. His book on ethics
    should — he declared — be considered an application of “exact thinking in the
    field of ethics” free from any influence “by subjective feelings” (Menger, 1974,
    p. 1). He would “clear of the search for ultimate meanings or essences as ‘the
    concept of morality’ or ‘the principle of virtue’” (Leonard, 1998, p. 20). Menger’s
    aim was to identify “specific rules of conduct” in a strict logical sense. He
    maintained that it is necessary to free ethics from metaphysical inquiries into
    “the concept of morality” or “virtue” or “the essence of good”, and he sought
    to “confine [these] cognitive studies to facts”. Menger’s investigations were
    concerned with “the application of mathematical modes of thinking and deal only
    with the formal side of questions”. His ethics was a formalist model: not a scale
    of values but rather a set of rules, a sort of Hilbertian programme extended to
    the moral field.23


    An epistemology of morality could be developed by finding it on a logical basis
    expressed by mathematical tools able to construct


    > 23The main reference in formalist ethics is, of course, to Kant and his “practical
    reason” founded on three categorical imperatives (based on the conformity of any
    action with universality, autonomy, and to notion of humans as ends as in themselves)
    in opposition to hypothetical ones (religion, laws, hedonistic pleasure, and personal
    ideals), which do not confer morality on an action. Menger stated that his morality
    was very far from Kantianism. He considered ethics in order to understand individuals,
    and subsequently social organizations, and he argued that the Kantian imperative
    was neither a necessary nor a sufficient condition for constituting cohesive (
    peaceful) groups. Hence, ethical imperatives are always hypothetical, never categorical.
    The unresolved question in Kantianism was “what concrete precepts prevent the
    categorical imperative in specific situations” (Menger, 1974, p. 9). In order
    to answer this question (how to apply the categorical imperative to a decision),
    it is necessary to consider a decision that implies a cognitive activity. This
    is the point where, according to Menger, ethics and logic are strictly connected.
    The ethical problem in Menger’s thought was understanding how social cohesion
    comes about in concrete situations where “there are several mutually decisions
    to consider” (Menger, 1974, p. 10) and the categorical imperative needs supplementary
    stipulations and additional norms in order to generate the well-being of a group.'
