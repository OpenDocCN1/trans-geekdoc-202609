- pgno: 114
  md: '# The Perfect Language


    This is a formal theory that most mathematicians believe enables you to carry
    out all the arguments that normally appear in mathematics — maybe if you don''t
    include category theory, which is very difficult to formalize, and even more paradoxical
    than set theory, from what I hear.


    So that''s some of the positive work on Hilbert''s program. Now some of the negative
    work on Hilbert''s program is, of course, Gödel in 1931 and Alan Turing in 1936.
    What they show is that you can''t have a perfect language for mathematics, you
    cannot have a formal axiomatic theory for all of mathematics because of incompleteness,
    because no system will include all of mathematical truth. It will always leave
    out truths;


    This is Gödel''s incompleteness theorem of 1931, and Gödel''s original proof is
    very strange. It''s basically the paradox of “this statement is false,” which
    is a paradox, of course, because it can neither true nor false. If it''s false
    that it''s false, then it''s true, and if it''s true that it''s false, then it''s
    false. That''s a paradox. But what Gödel does say “this statement is unprovable.”
    If the statement of itself is unprovable, there are two possibilities: it''s provable,
    or it isn''t. If it''s provable, then we''re proving something''s false; because
    it says it''s unprovable. We hope that that''s not the case; by hypothesis, we''ll
    eliminate that possibility. If we prove things that are false, we have a formal
    axiomatic theory that we''re not interested in, because it proves false things.
    The only possibility left is that it''s unprovable, because it''s true, because
    it asserts unprovable, therefore there''s a hole. We haven''t captured all of
    mathematical truth in our theory.


    This proof of incompleteness shocked a lot of people.


    A proof of incompleteness, a deeper proof, comes from Turing in 1936. He derived
    incompleteness from a more fundamental phenomenon, which is uncomputability, the
    discovery that mathematics is full of stuff that can''t be calculated, things
    you can define, but which you cannot calculate, because there''s no algorithm.
    And, in particular, the uncomputable thing that he discovered was the halting
    problem, a very simple question: does a computer program''s self-contained halt,
    or does it go forever? There is no algorithm'
