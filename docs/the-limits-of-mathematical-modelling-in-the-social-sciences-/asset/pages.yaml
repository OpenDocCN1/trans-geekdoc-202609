    $T^{(m+1)} \models \exists x_1, \dots, x_n \in \omega p(\rho(z), \langle z, d_{y,\\phi^{(m)}}
    \rangle, x_1, \dots, x_n) = 0$.

    ```


    **Proof.** Similar to the proof in the nonrelativistic case; see Machtey and Young
    (1979, p. 126 ff).


    Therefore, we have that $\phi_x^{\phi^{(m)}} \downarrow$ and if only


    ```

    $T^{(m+1)} \models \exists x_1, \dots, x_n \in \omega p(\rho(z), \langle z, d_{y,\\phi^{(m)}}
    \rangle, x_1, \dots, x_n) = 0$.

