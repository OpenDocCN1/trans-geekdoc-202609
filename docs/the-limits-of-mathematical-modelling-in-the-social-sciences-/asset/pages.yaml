  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Now consider Zermelo-Fraenkel axiomatic set theory, ZF. If $M_{ZF}$ is the corresponding
    proof machine for ZF, and if CH is the Continuum Hypothesis, we know that $M_{ZF}(CH)$
    never halts. Accordingly, there is a Diophantine polynomial $p_{ZF}(CH,x_1,\dots)$
    that has no roots over Z, since CH is independent of the axioms of ZF, there can
    be no proof (within ZF) of the statement $\neg p_{ZF}(CH,x_1,\dots)=0$ has no
    roots over Z. (If there were one such proof, we would be able to decide CH in
    ZF.) With the help of our techniques, we can obtain a two-step function $\theta_{ZF}(m)$
    such that, if $m_{CH}$ is a Gödel number for CH, then $\theta_{ZF}(m_{CH})=0$
    and $\theta_{ZF}(m_{CH})=1$. Therefore, every undecidable statement constructed
    with the help of forcing within ZF (or even within weaker theories, provided that
    they include elementary arithmetic) give rise to undecidable statements to the
    present tools.


    Moreover, the converse isn''t true, there are some (actually, infinitely many)
    undecidable statements that can be constructed according to the present techniques,
    but that no forcing statement will be mapped on if we follow the preceding procedure.
    Finite objects are (set-theoretic) forcing-absolute, but we have seen that we
    can construct undecidable statements about finite objects in ZF say, again through
    the $\theta$ function. If $m_{Fin}$ is the Gödel-coding for one of those statements,
    then $\neg \theta_{ZF}(m_{Fin})=0$ cannot be proved in ZF. So, there is a (metamathematical)
    algorithmic procedure that goes from every undecidable statement in ZF onto undecidable
    statements about the $\theta_{ZF}$ function; and yet forcing statements are only
    a portion of that, since there is much more in it (see da Costa and Doria, 1992).


    # 19. Evaluation of the results


    There are two opposing views concerning Gödel-like undecidable statements in mathematics.


