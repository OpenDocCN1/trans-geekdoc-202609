    (Spiegler, 2015, p. 8).


    These dangers sometimes arise in science as well, and the scientific community
    can remain and guard against them. In 1909, Constantin Carathéodory, a skilled
    German mathematician, published a seminal work on an axiomatic approach to thermodynamics,
    which allowed a rigorous mathematical formulation of the consequences of the second
    law of thermodynamics (Pogliani and Berberan-Santos, 2000). Despite the elegance
    of Carathéodory’s work, it did not gain a large audience among physicists and
    physical chemists. The axiomatic method, with some exceptions, never arrived on
    the main pages of widely used physics, physical chemistry, or even just thermodynamics
    textbooks. Even for the exceptions, the axiomatic method is presented as a pure
    curiosity than as a general foundation for thermodynamics (ibid).


    The main reason behind this lack of wide acceptance can be summarized by the position
    of Max Planck, one of the leading physicists of the 19th and early 20th century.
    Planck criticized the formal method pointing out that the standard approach (Thomson-Clausius
    treatment) was much nearer to experimental evidence, that is, natural processes,
    which at the very end are the only ground on which all natural laws are established
