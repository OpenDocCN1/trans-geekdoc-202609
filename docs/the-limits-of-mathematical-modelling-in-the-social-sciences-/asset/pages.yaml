  md: 'An apparently different approach appears in the Kaluza-Klein unified theories.
    Originally unpromising and clumsy-looking, the blueprint for these theories goes
    back to Kaluza (1921) and then to Klein (1926); see Tonnelat (1965).


    In its original form, the Kaluza-Klein theory is basically the same as Einstein''s
    gravitation theory over a five-dimensional manifold, with several artificial-looking
    constraints placed on the fifth dimension; that extra dimension is associated
    with the electromagnetic field.


    The unpleasantness of having to deal with extraneous conditions that do not arise
    out of the theory itself was elegantly avoided when A. Trautmann in the late 1960s
    and then later Cho (1975), showed that the usual family of Kaluza-Klein-like theories
    arises out of a simile of Einstein''s theory over a principal fiber bundle on
    space time with a semi-simple Lie group G as the leader.


    Einstein''s Lagrangian density over with its natural metric tensor splits up as
    Einstein''s gravitational Lagrangian density with the so-called cosmological term
    plus an interacting gauge field Lagrangian density; depending on the group G one
    gets electromagnetic theory, isospin theory, and so on. The cosmological constant
    arises in the Cho-Trautmann model out of the Lie group''s structure constants,
    and thus gives a possible geometrical meaning to its interpretation as dark energy.


