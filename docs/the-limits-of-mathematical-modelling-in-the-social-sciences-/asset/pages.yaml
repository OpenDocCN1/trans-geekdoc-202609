    # Novelty and invariance


    Formal systems must start from given axioms. From these axioms, using a set of
    rules, theorems are derived. For the theorems to be valid, the derivation shall
    not imply or lead to a contradiction. A contradiction means we can prove anything,
    so no need for the axioms that we start with in the first place.


    Physical systems start with initial conditions and rules (physical laws). From
    these, we can construct many interesting and useful products. But these products
    must comply with conservation laws since humans cannot create something out of
    nothing. Hence, consistency in formal systems and conservation in physical systems
    more or less a similar role.


    According to Gödel, consistency implies incompleteness. This means there will
    be (infinitely many) statements formulated in the system that cannot be proved
    within the system. In other words, we will never be able to systematically predict
    the statements that can be generated from the system. Consistency implies novelty.


    Similarly, in physical systems, we will never be able to systematically predict
    the outcomes of a change in the system, a phenomenon usually referred to as “emergence.”
    Emergent properties, Nobel laureate Robert Laughlin argues, are generally impossible
    to deduce from first principles. Collective organizational phenomena cannot generally
    be anticipated through pure deduction, and thus must be discovered experimentally
    (Laughlin, 2005, pp. 87–109, 212). Although certain quantities are constant due
    to the conservation law, other quantities or qualities might vary unexpectedly.
    Perfect knowledge of one cannot guarantee the knowledge of the other. In fact,
    the constancy of conserved properties might be the reason behind the nonconstancy
    and unpredictability of emergent properties. If so,'
