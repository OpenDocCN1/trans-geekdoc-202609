    \ the program that being begins. There are many ways to do this. A very simple\
    \ way to make the prefix $\\pi_C$ self-delimiting is to have it a sequence of\
    \ 0's followed by a 1:\n\n$\\pi_C = 0^k1$\n\nThe number $k$ of 0's tells us which\
    \ machine $C$ to simulate. That's a very wonderful way to indicate this.\n\nThe\
    \ prefix $\\pi_C$ is actually an interpreter for the programming language $C$.\
    \ AIT's universal languages $U$ have the property that you give $U$ an interpreter\
