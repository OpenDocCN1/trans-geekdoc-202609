  md: '# Shocked Disbelief 147


    These results seem to suggest that the Gödel-Turing phenomenon challenges the
    power of the powerful. Consider da Costa and Doria''s proof that a general theory
    of regulation is not decidable, da Costa and Doria show that certain states of
    the economy are formally undecidable under any regulatory scheme. For any regulatory
    scheme and any two decidable states of the economy, we can identify a third state
    of the economy that is undecidable. This result cuts the supports out from under
    the policy expert''s pretence of knowledge. (See Hayek (1989) for a discussion
    of the "pretence of knowledge" in modern economics.) If we are not generally in
    a position to predict the results of regulation, it becomes harder to justify
    any regulatory or deregulatory — proposal. The economic expert who would design,
    for example, financial market regulations must be able to say what will happen
    with the regulation and what will happen without it. But, if da Costa and Doria
    show, it is not generally possible make such predictions, economic experts'' advice
    would seem to have little value to policymakers. And the policymakers would seem
    to have less value as well! If this is the sort of subversive result that comes
    from the Gödel-Turing phenomenon, perhaps we should not be surprised that it has
    not entered fully into the discussion in mainstream economics.


    da Costa and Doria use an extension of Rice''s theorem to produce their subversive
    result. Rice''s theorem is a fitting tool for them to ensure use because would-be
    regulators and economic experts are essentially trying to program the economy
    as if it were a computer. "Roughly," they explain, Rice''s theorem "asserts that
    you cannot test for properties of programs in the general case" (p. 238). Rice''s
