    # 2. Economics and the functions of science


    *In physics, three laws explain 99% of all phenomena. In economics, 99 laws explain
    3% of all phenomena.* — Andrew Lo (Mangelsdorf, 2010)


    In general, science aims to perform the following two functions regarding the
    phenomenon under investigation (Blaug, 1992, Chap. 1; Elster, 2015, Chap. 1):


    +   1) Explanation

    2) Prediction.


    Explanation is the framework provided to understand the phenomenon at hand. More
    accurately, it highlights (possible) causal relations that culminate into the
    observed phenomenon. For example, to explain the Great Depression, a theory provides
    a framework that shows how different factors contributed to the event. Explaining
    the Depression, or the Global Financial Crisis, or any economic phenomenon, is
    more or less like storytelling, as D. McCloskey (1998) argues. This requires detecting
    influential links between different parts in a manner that brings together the
    full story or the big picture in line with the observed reality. The objective,
    is to “introduce order into [the] chaos of jarring and discordant appearances”
    (in Heilbronner and Milberg, 1995, p. 16).'
