  md: '# # Chapter 4


    # # Shocked Disbelief


    **Roger Koppl**


    Whitman School of Management, Syracuse University

    Syracuse, NY, USA


    Chaitin, da Costa and Doria (2012, p. 16) say, “The Gödel-Turing phenomenon is
    an all-pervasive fact that has to be understood in order to be conquered and usefully
    mastered.” But the Gödel-Turing phenomenon is subversive of power and authority.
    It has, therefore, been effectively excluded from mainstream economics, which
    serves existing powers, at least in macroeconomics. Mainstream economists are
    experts, and monopoly experts have the seers of Ancient Greece. But if we take
    the self-referential logic of Gödel-Turing seriously, the expert is put back on
    a plane of equality with the nonexpert. The implications of Gödel-Turing in social
    science, in other words, are democratic and anthierarchical. The deeply democratic
    message of this paper, however, is hostile to the interests of experts and thus
    unlikely to find a place in mainstream economics in the foreseeable future. If
    we do not conquer the Gödel-Turing phenomenon, “magical thinking,” I mean an argument
    with one or more steps that require something impossible. Unfortunately, experts
    often have an incentive to engage in magical thinking. Experts, including economic
    experts, are therefore unlikely to engage or even recognize the Gödel-Turing phenomenon.
    I begin with an example.'
