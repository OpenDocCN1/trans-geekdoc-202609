    # Conservation laws and stability


    Theoretical physicist Michio Kaku (2008, p. 267) recalls how, one day while in
    graduate school, he left speechless when he finally learned the true origin of
    the conservation of energy. In 1918, mathematician Emmy Noether discovered that
    whenever a system possesses a symmetry, this implies the existence of a conservation
    law, and vice versa (Lederman and Hill, 2004). Symmetry over time means that the
    laws of physics are the same now as they were in the past, and they will be the
    same in the future; they are timeinvariant. Time-symmetry implies conservation
    of energy. Space symmetry means that the laws are the same on Earth and on the
    moon as on Jupiter. Space symmetry implies conservation of momentum. The relationship
    between symmetry and conservation is the “single most profound result in all of
    physics,” says Nobel laureate Frank Wilczek (2015, p. 280).


