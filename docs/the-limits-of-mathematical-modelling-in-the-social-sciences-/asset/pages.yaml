  md: '# The Limits of Mathematical Modeling in the Social Sciences


    A more recent example might lend additional support to the above point. String
    theory is considered the most advanced theory that attempts to unify quantum mechanics
    and general relativity. The attempt to find a unified theory is obviously a scientific
    endeavor. However, the theory seems to have drifted toward mathematical modeling
    without any roots in reality. String theory seems to offer no possibility of being
    tested, and is its greatest weakness. According to Smolin (2006), the situation
    threatens to impede the very progress of science. Physicist Richard Muller argues
    that string theory is not a true theory. A true theory, like the theory of electromagnetism
    or quantum physics or general relativity, must lead to testable predictions. Using
    a criterion developed by philosopher of science, Karl Popper, to qualify as a
    theory, it must be able to show a test that could, in principle, falsify it (Muller,
    2016a).


    Proponents of string theory argue that there is no to specify how their theories
    might be tested or falsified; that Popper is a philosopher, not a scientist; that
    falsifiability is an old, 20th-century criterion. (Muller 2016b) responds


    > ...all of the great theories of physics, those that we now accept, were put
    forth Popper''s standards of being falsifiable, and that when we abandon this
    standard, we are engaging not in physics but in fantasy. True, it is physics/math-based
    fantasy, but it is fantasy nevertheless.


    So physicists are aware of the dangers of “fancy mathematics” that has no grounds
    in reality. von Neumann (1947) recognized, long time ago, the consequences of
    disconnecting mathematics from reality. He writes (p. 9):


    As a mathematical discipline travels far from its empirical source, or still more,
