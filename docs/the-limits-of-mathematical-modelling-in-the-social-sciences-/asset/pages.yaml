    |---|---|---||

    | Invariance | Consistency | Conservation | Scarcity |

    | Novelty | Incompleteness | Emergence | Surplus value |


    # The puzzle of value


    Early economists were puzzled by a simple question: Scarcity requires commodities
    are traded in competitive markets at their fair value; no one can get something
    for nothing. If this is the case, how could there be profits or “surplus value?”
    In an “exchange of equivalents,” the two parties of the trade, from an accounting
    point of view, are exactly at the same position before and after the exchange.
    So could they both be better off and make gains from trade? Even more, how could
    the economy grow at all out of “exchange of equivalents”? In words, if the exchange
    of equivalents conserves value, how could value expand? (See Mirowski, 1989, Chap.
    4; Keen, 2011, Chaps. 10 and 17; Varoufakis et al., 2011, Chap. 3.)


    The above framework might contribute to resolving this puzzle. Although the two
    sides of a fair exchange are equivalent, trade, in principle, is not a zero-sum
    game. In normal circumstances, fair trade is a win-win, mutual-gain transaction.
    Each party will be better off because of the rearrangement of resources. This
    rearrangement improves the productivity of each party, allowing the total output
    to grow. Trade improves the efficiency of resource utilization without production.
    Reallocation of goods and services can release untapped resources and thus create
    surplus value. Emergence, notes Laughlin (2005), is an organizational phenomenon.
    Many, if not most, of the natural laws arise from collective self-organization.
