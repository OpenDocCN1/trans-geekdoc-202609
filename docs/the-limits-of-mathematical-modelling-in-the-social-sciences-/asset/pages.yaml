    is quite simple, and has an obvious mathematical meaning: it talks about computer
    programs and their domains. So, Gödel incompleteness does matter, after all.


    # A first example


    We can present here a first example of incompleteness that directly stems from
    the methematical properties of $F$. The BGS set $S = \langle M_m, |F^{(n)} + F(n))
    \rangle, n = 0, 1, 2, \dots$ has the following two properties, many others of
    interest (the discussion in the *Belly* sections for details):


    +   - It is a set of Turing machines $M_m$ bound by a clock that stops after $|x^{(n)}
    + F(n)|$ computation steps, where $x$ is the input to the machine and $|x|$ the
    binary length of $x$.

    - It is a set of poly Turing machines in the standard model.

    - The sentence “S is a set of Turing poly machines” is true of the standard model
    for the arithmetic portion of theory $S$.

    - “S is a set of Turing poly machines” is undecidable in theory $S$.


    # 3. The Gödel phenomenon in physics and in other mathematized sciences


    Now, are there Gödel undecidable sentences in physics? In mathematical economics?
    Yes.


    In order to look for undecidable sentences in physics, one must axiomatize the
    theories where our formal sentences are cradled. This is the gist of a remarkable
    question formulated at the very end of the 19th century, Hilbert’s Sixth Problem.
    That seems to be a formidable obstacle; let’s take a look at Hilbert’s formulation
    of it.


    > $^4There are examples of theories like $S$ where one cannot find a “natural”
    interpretation like the one in our example.'
