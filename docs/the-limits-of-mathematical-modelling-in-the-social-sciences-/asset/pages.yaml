    # 4. Conclusion


    Menger’s interest in the relationship between logics and social sci-ences (ethics
    and economics) was one of his major focus areas during the interwar period. He
    never stopped thinking of the possibility to find a way to apply a nonstandard
    logic to describe ethics in a formal way, based on the assumption that moral attitudes
    are based and reinforced by decisions. His work made him a forerunner of decision
