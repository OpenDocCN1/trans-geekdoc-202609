  md: '# The Limits of Mathematical Modeling in the Social Sciences


    $U$ to be self-delimiting, not just the prefix $\pi_C$. You want the whole thing
    to be self-delimiting to get the right theory of program-size complexity.


    Let me compare the 1960s version of AIT and the 1970s version of AIT. Let me compare
    these two different theories of program-size complexity.


    In the 1960s version, an N-bit string in general need an N-bit program, if it''s
    irreducible, and most strings are algorithmically irreducible. Most N-bit strings
    need an N-bit program. These are the irreducible strings, the ones that have no
    pattern, no structure. Most N-bit strings need an N-bit program, because there
    aren''t enough smaller programs. But in the 1970s version of AIT, you go from
    N bits to $N+\log_2 N$ bits, because you want to make the programs self-delimiting.
    An N-bit string will usually need $N+\log_2 N$ bit program.


    Actually, in 1970s AIT it''s $N$ plus $H(N)$, which is the size of the smallest
    self-delimiting program to calculate $N$, which is exactly what logarithmic time
    term is. In other words, in the 1970s version of AIT, the size of the smallest
    program for calculating an N-bit string is usually N bits plus the size in bits
    of the smallest-delimiting program to calculate $N$, which is roughly


    > $\log N + \log \log N + \log \log \log N + \dots\cdot$


    bits long.

    That''s the Russian dolls aspect of this.


    The 1970s version of AIT, which takes the idea of being-delimiting from the prefix
    and applies it to the whole program, gives us even better perfect languages. AIT
    evolved in two stages. First we concentrate on those $U$ with


    $U(\pi_C p) = C(p)$


    with $\pi_C$ self-delimiting, and then we insist that the whole thing $\pi_{Cp}$
    has also got to be self-delimiting. And when you do that, you get important new
    results, such as the sub-additivity of program-size'
