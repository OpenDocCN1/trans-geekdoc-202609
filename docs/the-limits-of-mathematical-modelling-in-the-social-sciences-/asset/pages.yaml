  md: '# Applications of Nonstandard Logic to the Social Sciences 197


    If this statement is indeed true, then the traditional efforts by empirical science
    to rely upon the principle of the evidential correspondence (which leads to the
    assumption that the existence of a particular feature or pattern in a dataset
    is true), means that the world has a particular, specific structure. So, the existence
    of one structure precludes the existence of other valid structures. Some structures
    represent the truth about the world; other statements about the world are false.
    As McAllister goes on to note, the principle of evidential correspondence is central
    to the epistemology, methodology, and ontology of the social sciences. Once this
    principle is rejected, it may be necessary to reexamine our traditional assumptions
    about the nature of truth and truth determination (McAllister, 2007, 2010).


    McAllister assumes that a particular phenomenon generates an empirical data set.
    Within that data set, particular patterns emerge, all of which can be valid given
    the existence of statistical error. While there might be a pattern that exists,
    it cannot be discerned simply by reliance on the empirical dataset and the patterns
    we observe. Moreover, as a particular phenomenon becomes more complex, the number
    of particular patterns that exist invariably become greater, and the likelihood
    increases that multiple patterns of data are observed as being equally valid.
    Also, improvements in technology and our ability to observe the phenomenon in
    question mean that more information is available; these, in turn, can be subjected
    to various methodological tests. The very existence of increased computational
    power means the ability to analyze data in ways not heretofore possible. Again,
    this has the consequence of expanding the number of empirical patterns in the
    data that can plausibly be considered valid.


    It has been argued that the prevalence of highly polarized ideological debate
    in the social sciences is a result of the fact that there are often multiple valid
    explanations of the world around us (McAllister, 2011). Individuals interpreting
    some phenomenon relying upon different patterns derived from empirical datasets
    are sure to come to different conclusions, and those differences are translated
    into ideological conflict, or at least interpreted as ideological conflict.'
