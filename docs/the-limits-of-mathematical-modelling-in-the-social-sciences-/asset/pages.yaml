  img_proc: true
- pgno: 115
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    to answer this in every individual case, therefore there is no formal axiomatic
    theory that enables you to always prove in individual cases what the answer is.


    So Turing''s insight in 1936 was that incompleteness, which Gödel found in 1931,
    for any formal axiomatic theory, comes from a deeper phenomenon, which is uncomputability.
    Incompleteness is an immediate corollary of uncomputability, a concept which does
    not appear in Gödel''s 1931 paper.


    Turing''s paper has both good and bad aspects. There''s a negative aspect of his
    1936 paper, which I''ve just told you about, but there''s also a positive aspect.
    You get another proof, a deeper proof of incompleteness, but you get a kind of
    completeness.


    You find a perfect language.


    There is no perfect language for mathematical reasoning. Gödel showed that in
    1931, and Turing showed it again in 1936. But what Turing also showed in 1936
    is that there are perfect languages, not for mathematical reasoning, but for computation,
    for specifying algorithms. What Turing discovered in 1936 is that there is a kind
    of completeness called universality and there are universal Turing machines and
    universal programming languages.


    What universal means, a universal programming language or a universal Turing machine
    is, a language in which every possible algorithm can be written. On the one hand,
    Turing showed us in a deeper way that any language for mathematical reasoning
    is to be incomplete, but on the other hand, he showed us that languages for computation
    can be universal, which is just a synonym for completeness. There are perfect
    languages for computation, for writing algorithms, even though there aren''t any
    perfect languages for mathematical reasoning.


    This is the positive side, this completeness side, of Turing''s 1936 paper.


    Now, what I''ve spent most of my professional life on, is a subject I call algorithmic
    information theory, which derives incompleteness from uncomputability by taking
    advantage of a deeper phenomenon, by considering an extreme form of uncomputability,
    which is called algorithmic randomness or algorithmic irreducibility.'
