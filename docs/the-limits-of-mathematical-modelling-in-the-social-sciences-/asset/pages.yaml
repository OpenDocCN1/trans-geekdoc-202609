    Another example of misuse of models relates to The Efficient Market Hypothesis.
    The hypothesis, at best, is applicable at the microlevel, that is, at the individual-investor
    level. But it fails for the market as a whole. This is known as “Samuelson’s dictum.”
    According to Paul Samuelson (Shiller, 2001/2015, pp. 256, 271; emphasis in original):


    ...the market is micro efficient but macro inefficient. That is, individual stock
    price variations are dominated by new information about subsequent dividends,
    and aggregate stock market variations are dominated by bubbles.


    Modern markets show considerable *micro* efficiency ... In no contradiction to
    the previous sentence, I had hypothesized considerable *macro* inefficiency, in
    the sense of long waves in the time series of aggregate indexes of security prices
    below and above various definitions of fundamental values.


    Samuelson’s dictum was empirically confirmed by Shiller and others (Jung and Shiller,
    2005; Bernstein, 2007a, pp. 72–75). Bernstein (2007b) concludes: “Modern finance
    theory is micro at its heart. We can’t apply it to the market as a whole.” This
    obviously is true for economic theory in general:


    +   - The well-known theorem of Sonnenschein, Mantel, and shows that aggregate
    demand fails to carry over neoclassical properties of individual demand functions
    (Mas-Cole *et al.*, 1995).


    +   - The Arrow Impossibility Theorem shows that transitivity of individual preferences
    fails to apply to aggregate choice (Maskin and Sen, 2014).


    +   - We have already seen that the transversality condition at the individual
    level may fail to apply at the aggregate level.


    +   - And we have also seen that while price can be treated as exogenous for individual
    agents, collectively it is endogenous.


    The divergence between individual rationality and collective behavior leads to
