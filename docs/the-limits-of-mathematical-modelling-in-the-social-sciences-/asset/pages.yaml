  md: '# The Limits of Mathematical Modeling in the Social Sciences


    together with their values:


    ```

    $f_0(0), f_0(1), f_0(2), f_0(3),\dots$

    $f_1(0), f_1(1), f_1(2), f_1(3),\dots$

    $f_2(0), f_2(1), f_2(2), f_2(3),\dots$

    $f_3(0), f_3(1), f_3(2), f_3(3),\dots$

    :$

    ```


    +   - Now define a function F:


    ```

    $F(0) = f_0(0) + 1$

    $F(1) = f_1(1) + 1$

    $F(2) = f_2(2) + 1$

    :$

    ```


    +   - $F$ is different from $f_0$ at value 0, from $f_1$ at 1, from $f_2$ at 2,
    and so on.


    We can now conclude our reasoning. The $f_0, f_1, f_2, \dots$ functions are said
    to be *provably total* in our theory $S$, as they are proved to be total functions
    and appear as such in the listing of the theory''s theorems. However $F$ cannot
    be provably total in $S$, since it differs at least from each function we have
    listed. Yet $F$ is obviously computable and total in the standard model for arithmetic,
    and given programs for the computation of $f_0, f_1, f_2, \dots$ we can compute
    $F$ too.


    So the sentence “F is total” cannot be proved in our theory.


    Also, if we suppose that the theory is *sound*, that is, if it doesn''t prove
    false facts, then the sentence “F isn''t total” cannot be proved too, as $F$ is
    clearly total in the so-called standard model for arithmetic. Therefore, it is
    an undecidable sentence within our theory $S$.


    Ladies and gentlemen, “F is total” and “F isn''t total” are examples of the *Gödel
    incompleteness phenomenon* in $S$: they are sentences that can neither be proved
    nor disproved within $S$. And because of'
