  img_proc: true
- pgno: 164
  md: '# Shocked Disbelief


    given this constraint, tries to make the algorithm’s choice wrong. An ‘imp’ is
    a rational algorithm which acts as a ‘demon’ whenever it can do so at no cost
    to itself” (p. 884). In his conclusion, Canning (1992, p. 888) says, “The usual
    domain used in game theory, games with Nash equilibrium and opponents who are
    rational, needs to be qualified slightly to be admissible. The equilibrium strategy
    must be a best reply to all replies to itself but we require only rationality
    relative to the domain being faced.” The requirement of “strictness” excludes
    many games including two considerable attention by von Neumann and Morgenstern
    (1953), namely, “Matching- Pennies” and “Stone, Paper, Scissors.” It seems doubtful
    whether Canning’s restriction should be considered “slight.” If we recognize that
    Canning’s result is more monumental than slight, then we challenge the power,
    prestige, and incomes of economic experts.


    One cannot help wonder if Canning’s result was acceptable in a leading economics
    journal only because its deeply subversive result that many canonical Nash games
    are uncomputable was cloaked in the blasé language of rationality. In his conclusion,
    Canning says reassuringly, “Our main result is that, providing we limit the domain
    of applicability of game theory in a natural way, computability does not undermine
    rationality” (p. 887). Having just killed Nash equilibrium, Canning stands over
    the corpse saying, “Move along, there there is nothing to see here.”


    If economists were ever to allow the Gödel–Turing phenomenon to fully inform their
    policy advice, the demand for such advice would fall precipitously. Unfortunately,
    as I argued earlier, the doctrine of consumer sovereignty no less forcefully in
    the market for ideas than in the market for men’s shoes. The demand for magical
    thinking continues to be met with an abundant supply, with the result that the
    Gödel–Turing phenomenon has been marginalized within academic economics.


    The Gödel–Turing phenomenon is a strictly modern development. There were some
    prior hints, such as Poincaré’s analysis of the three-body problem. The problem
    was essentially unrecognized before the publication of Gödel’s famous paper in
    1931.'
