    (Mirowski, 1989, p. 218). In both, we cannot get something from nothing, which
    is the same logic for mathematical consistency. Emergence in economics is reflected
    in growth and surplus value, as we will discuss shortly.


    There is something problematic here. How is it that invariance implies novelty,
    predictability implies unpredictability, decidability implies undecidability,
    and scarcity implies abundance? Philosopher Emily Meyerson points out this tension
    and suggests a reconciliation. We might have a set of given elements, but the
    arrangements of these elements can create different manifolds, “just as the aid
    of the same letters one can compose a tragedy or a comedy” (Meyerson, 1930, pp.
    92-93). Examples from science include magnetism and other phase-transition phenomena,
    which arise due to reorganization without changing the underlying molecules (Ball,
    2004). More on the role of organization in emergence follows shortly.


    This duality might tell us something about the universe we live in: it is continuously
    balancing change and persistence. If there were only change, it will be completely
    unpredictable, and life would not flourish in such a chaotic environment. On the
    other hand, if it were completely stagnant, life would not have been possible
    as well. We, therefore, live in a complex world “at the edge of chaos,” a characteristic
    feature of complex systems (Kauffman, 1995, p. 26). As Barrow (1998, p. 191) elaborates,
    the universe has constraints without which there would be no patterns in nature.
    Further,


    If there were no patterns of behavior in the Universe then chaotic anarchy that
