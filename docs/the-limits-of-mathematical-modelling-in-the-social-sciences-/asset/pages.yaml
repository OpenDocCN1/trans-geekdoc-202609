- pgno: 107
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    What is the search for the perfect language? Nowadays, a physicist would call
    this search for a Theory of Everything (TOE), but in the terms in which it was
    formulated originally, it was the idea of finding, we shall say, the language
    of creation, the language before the Tower of Babel, the language God used in
    creating the universe, the language whose structure directly expresses the structure
    of the world, the language in which concepts are expressed in their direct, original
    format.


    You can see that this idea is a little bit like the attempt to find a foundational
    TOE in physics.


    The crucial point is that knowing this language would be like having a key to
    universal knowledge. If you''re a theologian, it would bring you closer, very
    close, to God''s thoughts, which is dangerous. If you''re a magician, it would
    give you magical powers. If you''re a linguist, it would tell you the original,
    pure, uncorrupted language from which all languages descend.


    This very fascinating book is about the quest to find language. If you find it,
    you''re opening a door to absolute knowledge, to God, to the ultimate nature of
    reality.


    And there are a lot of interesting chapters in this intellectual history, one
    of them the Catalan, Raymond Lull, who lived in or over 1200.


    He was a very interesting man who had the idea of mechanically combining all concepts
    to get new knowledge. So you would have a wheel with different concepts on it,
    and another wheel with other concepts on it, and you would rotate them to get
    all possible combinations. This would be a systematic way to discover new concepts
    and new truths. If you remember Jonathan Swift''s Gulliver''s Travels, Swift makes
    fun of an idea like this.


    In The Search for the Perfect Language, there is an entire chapter about Gottfried
    Wilhelm Leibniz. Leibniz is wonderful because he is universal. He knew all about
    Kabbalah, Christian Kabbalah and Jewish Kabbalah, and all kinds of hermetic and
    esoteric doctrines, and he knew all about alchemy. He actually ghost-authored
    a book on alchemy. Leibniz knew about all these things, and he knew about'
