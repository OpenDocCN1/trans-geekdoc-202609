- pgno: 184
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    Walrasian equilibrium is a critical tool in modern microeconomic theory. Velupilli
    notes that Walrasian equilibrium with its Brouwer fixed point theorem is effectively
    uncomputable. The requirements for achieving equilibrium, where one assumes that
    hypothetical auctioneer must compute the equilibrium prices, assumes that agents
    both truthfully reveal their preferences and no trading take place before the
    market-clearing price vector is announced, and that all agents trade at the same
    prices. As Kaufmann (1993, 2000) has noted, such a framework assumes that one
    can finitely prestate all possible goods and services, which in any practical
    sense is impossible. Moreover, a real economy is not static but constantly evolving,
    as new goods and services are created from various combinations of preexisting
    goods, and others die. So, the secular increase in goods and services, and the
    emergence of fundamentally new innovations, is not explained by Walrasian processes.
    None of this is to deny the contribution of Arrow and Debreu for their work in
    proving the existence of equilibrium under specific conditions, but it cannot
    explain certain real-world phenomena.


    Axtell demonstrates using ABMs that practical implementation of Walrasian general
    equilibrium models are intractable, that is, NP-hard. This means, in effect, that
