    # Appendix H. An application: Maymin’s theorem


    # A brief scenario


    We start here from a recent intriguing result by Maymin (see Doria and Cosenza,
    2016; Maymin, 2011), which relates efficient markets to the $P$ vs $NP$ question.$^{15}$
    Roughly, a Maymin market is a market coded by a Boolean expression. We are going
    to make some move in the market. Our move now is determined by a series of $k$
    previous moves.


    # Definition H.1.


    +   - A $k$-run policy $\sigma_k$, $k$ a positive integer, is a series of plays
    ($b$ for buy and $s$ for sell) of length $k$. There are clearly $2^k$ possible
    $k$-run policies.

    - A map $v$ from all $k$-run policies into $\{0,1\}$ is a valuation; we have a
    “gain” and if only if $v(\sigma_k) = 1$; a “loss” otherwise.

    - A policy is *successful* if it provides some gain (adequately defined); in that
    case we put $v(\sigma_k) = 1$. Otherwise $v(\sigma_k) = 0$.


    There is a natural map between these objects and $k$-variable Boolean expressions
    (see below), if we take $v(\sigma_k) = 1$ means that $\sigma_k$ is satisfiable,
    and 0 otherwise. We say that a *market configuration* ($k$-steps market configuration,
    or simply $k$-market configuration) is coded by a Boolean expression in disjunctive
    normal form (dnf). That map between $k$-market configurations and $k$-variable
    Boolean expressions in dnf can be made one-to-one. The financial game for our
    simplified market is: we wish to discover the fastest way to algorithmically obtain
    a successful $k$-market configuration (i.e., a given $k$-variable Boolean expression).
    Finally the $k$-market configurations are Maymin-efficient (see below) if $v$
    can be implemented by a poly algorithm.


    $^{15}$Based on “A beautiful theorem,” already cited.'
