    # “Meaningful” undecidable sentences


    Let us now quote a specific query, the decision problem for chaotic dynamical
    systems (Hirsch, 1985):


    +   An example of chaos — in several senses — is provided by the celebrated Lorenz
    System. [...] This is an extreme simplification of a system arising in hydrodynamics.
    By computer simulation Lorenz found that trajectories seem to wander back and
    forth between two particular stationary states, in a random, unpredictable way.
    Trajectories which start out very close together eventually diverge, with no relationship
    between long run behaviors.


    But this type of chaotic behavior has not been proved. As far as I am aware, practically
    nothing has been proved about this particular system. Guckenheimer and Williams
    proved that do do exist many systems which exhibit this kind of dynamics, in a
    rigorous sense; but it has not been proved that Lorenz’s system is one of them.
    It is by the lack of an answer is a sharp challenge to dynamicists, and considering
    the attention paid to this system, it is something of a scandal.


    The Lorenz system is an example of (unverified) chaotic dynamics; most trajectories
    do not tend to stationary or periodic orbits, and this feature is persistent under
    small perturbations. Such systems abound in models of hydrodynamics, mechanics
    and many biological systems. On the other hand experience (and some theorems)
    show that many interesting systems can be expected to be nonchaotic: most chemical
    reactions go to completion; most ecological systems do not oscillate unpredictably;
    the solar system behaves fairly regularly. In purely mathematical systems we expect
    heat equations to have convergent solutions, and similarly for a single hyperbolic
    conservation law, a single reaction–diffusion equation, or a gradient vectorfield.'
