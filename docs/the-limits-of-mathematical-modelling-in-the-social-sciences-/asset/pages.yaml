- pgno: 18
  md: '# Axiomatics, the Social Sciences, and the Gödel Phenomenon: A Toolkit


    +   (1) If the axiomatic theory we consider is consistent, then there is in it
    a sentence which can neither be proved nor disproved (always within the axiomatic
    framework we have chosen). However, that sentence can be easily seen to be true
    in the standard model for arithmetic.


    +   (2) If the same theory is consistent, then we cannot (within it) prove a sentence
    that asserts the theory’s consistency.


    Gödel’s undecidable sentence is weird and doesn’t seem to have an everyday mathematical
    meaning. It is constructed as follows:


    +   - He first shows that the sentence “$\xi$ cannot be proved” can be formalized
    within his axiomatic framework.


    +   - Then he diagonalizes it. The sentence he obtains is interpreted as “I cannot
    be proved.” The sentence is true—as said doesn’t have an obvious everyday mathematical
    meaning.


    The second incompleteness theorem can be seen as a kind of corollary to the first
    one. Briefly, for a theory based on classical first-order logic, it is consistent
    if and only if it doesn’t prove all its sentences. It proves a contradiction if
    and only if an incomplete theory doesn’t prove at least two of its sentences,
    say $\xi$ and $

    eg\xi$. (For a more detailed discussion see Chaitin et al. (2011)).


    # Summary of the chapter


    We give in the present chapter an intuitive presentation of the ideas involved,
    list some of the questions that were shown to be undecidable with the authors’
    techniques and apply them in detail to systems in economics and ecology. Those
    applications show that Gödel incompleteness may be one of the hindrances (besides
    nonlinearity) in the prediction of the future behavior of those systems in our
    current formal representations for social phenomena.


    So, our knowledge about society may also have computational, predictive limits
    imposed by the Gödel phenomenon.'
  merge: -1
  img_proc: true
