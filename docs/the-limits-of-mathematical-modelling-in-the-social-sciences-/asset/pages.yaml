    concepts developed by it as homeomorphism might prove very useful in this connection,
    although may appear doubtful whether even this technique, is adequate to the complexity
    of the structures with which we have to deal. A first attempt made in this direction
    by an eminent mathematician (Karl Menger, 1934) has so far yet to yield anything
