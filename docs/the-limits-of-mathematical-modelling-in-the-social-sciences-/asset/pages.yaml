    In an overlapping generations economy, in contrast, there are two or more generations,
    each living a finite number of periods with an infinite stream of generations.
    Young generations survive in their early life, old ones die in their late periods.
    Each agent satisfies his own TVC, the economy as a whole, at any period of time,
    will have aggregate excess savings due to the heterogeneity of agents'' life cycles
    (Romer, 2011, pp. 588-589). In this economy, a rational Ponzi scheme becomes possible,
    since an agent can borrow from the young generation and pay the old, and keep
    doing so forever. The Ponzi game is “rational” in the sense that it is constrained
    by aggregate excess savings, and thus will not explode over time. Thus, an agent
    running a Ponzi scheme is able to get something for nothing as long as other agents
    or lenders satisfy their respective TVCs. As O''Connell and Zeldes (1988, p. 437)
    point out: “Each individual continues to satisfy his transversality condition,
    but the economy of lenders as a whole does not satisfy any aggregate transversality
    condition. The absence of an aggregate TVC allows for excess aggregate savings,
