    theory is essentially a metamathematical construct, which is an abstraction of
    other mathematical concepts. One example of a category is a category of sets.
    Category theory allows us to develop an understuu013standing of the equivalence
    between one category of sets and another and is already finding applications in
    fields ranging from biology to music and philosophy. Clearly, there is an important
    topological and topos-theoretic component to category theory. Importantly, category
    theory is not subject to the rigid rules of axiomatic set theory and the foundations
    of classical logic (Rehmeyer, 2013; Spivak, 2013; Leinster, 2014). Graph theory,
    the formal study of graphs, is mathematical structures that model relationships
    between objects. It shares certain commonalities with category theory, and is
    used to model different kinds of relationships and processes in the physical,
    biological, and social systems. It may be especially useful in areas such as linguistics
    and the study of different kinds of social networks (Barabási, 2002). Indeed,
    graph theory is critically important as a mathematical tool in the treatment of
