    for consumption nowadays, that is, acceptable to modern ears, to contemporary
    scientists. This is a universal language, which he called the characteristica
    universal, which was supposed to come with a crucial calculus ratiocinator.


    The idea is to reduce reasoning to calculation, to computation, because the most
    certain thing is that 2 + 5 = 7, and what is this if not a calculation? If two
    people have an intellectual dispute, Leibniz remarked, instead of dueling they
    could just sit down and say, “Gentlemen, let us compute!” and get the correct
    answer, and find out who was right.


