    the mathematical world even of classical analysis. They cite favorably Wolfram’s
    conjecture” that “undecidability exists everywhere, even in trivial physics theories.”
    They show that even finite games can be undecidable. This almost bizarre result
    merit attention. In one sense, any finite game is trivially decidable. If we have
