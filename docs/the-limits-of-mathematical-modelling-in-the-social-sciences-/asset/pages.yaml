- pgno: 155
  md: '# The Limits of Mathematical Modeling in the Social Sciences


    In this passage, Socrates seems to call for the rule of experts. In any given
    area such as education or medicine, we should obey those who “have made the matter
    a study” and become “the wisest authorities” in that area. Socrates'' expertise
    is in education, he tells us. Trust me to educate your youth, Athens, for I am
    the wisest educator among you. One is reminded of a quote attributed to the economic
    expert Paul Samuelson. “I don’t care who writes a nation’s laws—or crafts—if I
    can write its economics textbooks” (Weinstein, 2009).


    Central bankers, Greek peers, and professors of economics are all experts. An
    expert is anyone paid for his or her opinion. The problem with experts is that
    they may “fail,” which is to say that they may get wrong. “We have expert failure
    if an expert produces an analysis that deviates from some normative expectation
    associated with the decision to rely on that expert” (Koppl, 2015, p. 353). It
    is hardly damning to say that some class of persons are more likely to fail and
    when lesser.


    According to information choice theory (Koppl, 2012, 2015), expert failure is
    more likely when experts decide for nonexperts rather than merely advising them.
    And expert failure is more likely when experts have monopoly power than when they
    compete with other experts (Koppl, 2015, p. 354). State-sponsored eugenics experts
    may be monopoly experts with the power to decide for others whether they be sterilized.
    In such cases, the risk of expert failure is high. Such cases are not, unfortunately,
    “ancient history” upon which we may look back with a shudder and a sense of superiority.
    In the United States, formally recognized and legally sanctioned sterilizations
    were performed well into the 1970s (Stern, 2005; Shffler et al., 2015). More recently,
    the Center for Investigative Reporting has found, “Doctors under contract with
    the California Department of Corrections and Rehabilitation sterilized nearly
    150 female inmates from 2006 to 2010 without required state approvals” (Johnson,
    2013). The popular magazine Consumer Reports, on the other hand, merely advises
    its readers. And it competes with other providers of consumer reviews, advice,
    and information. In this market, the risk of expert failure is lower.'
