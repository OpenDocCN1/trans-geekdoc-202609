    # For electromagnetism


    The first conceptually unified view of electromagnetic theory is given in Maxwell''s
    treatise, dated 1873 (for a facsimile of the 1891 edition see Maxwell (1954)).


    +   - Maxwell''s treatment was given a more compact notation by J. Willard Gibbs
    with the help of vector notation.

    - A sort of renewed presentation of Maxwell''s main conceptual lines appears by
    Sir James Jeans (1925).

    - Then there is Stratton''s (1941) textbook with its well-known list of difficult
    problems.

    - And then Jackson''s (1962) book, still the main textbook in the 1970s and 1980s.


    When one looks at the way electromagnetic theory is presented in these books one
    sees that:


    +   - The mathematical framework is calculus — the so-called advanced calculus,
    plus some knowledge of ordinary and partial differential equations — and linear
    algebra.

    - Presentation of the theory''s kernel becomes more and compact; its climax is
    the use of covariant notation for the Maxwell equations.

    - However, covariant notation only appears as a development out of the set of
    Maxwell equations in the traditional Gibbs “gradient-divergence-rotational” vector
    notation.

    - Finally, the Maxwell equations are shown to be derived from a variational principle,
    out of a Lagrangian density.


    So, the main trend observed in the presentation of electromagnetic theory is the
    field equations for electromagnetic theory are in each case presented as a small
    set of coordinate-independent equations with a very synthetic notation system.
