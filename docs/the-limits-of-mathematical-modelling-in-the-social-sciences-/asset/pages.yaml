- pgno: 112
  md: 'The Perfect Language


    Hilbert was a conservative. He believed that mathematics gives absolute truth,
    which is an idea from the Middle Ages. You can see evidence of the Middle Ages
    whenever you mention absolute truth. Nevertheless, modern mathematicians remained
    enamored with absolute truth. As Kurt Gödel said, we pure mathematicians are the
    last holdouts of the Middle Ages. We still believe in the Platonic world of ideas,
    at least mathematics, when everyone else, including philosophers, now laughs at
    this notion. But pure mathematicians live in the Platonic world of ideas, even
    though everyone stopped believing in it a long time ago.


    So mathematics gives absolute truth, said Hilbert. Every mathematician wherever
    deep inside believes this. Then there ought to exist a finite set of axioms, and
    a precise set of rules for deduction, in inference, such that all mathematical
    truth is a consequence of these axioms. You, if mathematical truth is black or
    white, and purely objective, then if you fill in all the steps in a proof and
    carefully use an artificial language to avoid ambiguity, you should be able to
    have a finite set of axioms we can all agree on, which, in principle, enables
    you to deduce all mathematical truth. This is just the notion that mathematics
    provides absolute certainty.


    An important consequence of this idea goes back to the Middle Ages. This perfect
    language for mathematics, which is what Hilbert was looking for, in fact, give
    a key to absolute knowledge, because, in principle, you could mechanically deduce
    all the theorems from the axioms, simply by running the tree of all possible proofs.
    You start with the axioms, then you apply the rules of inference once, and then
    get all the theorems that have one-step proofs; you apply them two times, and
    then get all the theorems that have two-step proofs; and like that, totally mechanically,
    you would get all of mathematical truth, by systematically traversing the tree
    of all possible proofs.


    This would not put all mathematicians out of work. In practice, this process would
    take an outrageous amount of time to get interesting results, and all the interesting
    theorems would be overwhelmed by uninteresting theorems, such as the fact that
    1 + 1 = 2.'
