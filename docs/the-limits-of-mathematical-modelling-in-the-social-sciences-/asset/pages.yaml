    One important feature of conservation laws is that they are deeply ingrained in
    the universe. There are many local or detailed laws governing various forms of
    matter and energy. But, “across the variety of these detailed laws there sweep
    general principles which all the laws seem to follow,” such as the principles
    of conservation, notes Feynman (1965, p. 53).


