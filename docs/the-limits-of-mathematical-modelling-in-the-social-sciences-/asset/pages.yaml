    for a more complete understanding of the phenomenon.


    Other examples of inconsistencies abound. The classic example is the liar''s paradox,
    as exemplified by "this sentence is not true," or "everything I say is a lie.\
    Either the two statements are true, or not true. If true, then what they say is,
    in fact, the case. If not true, then that is what it says. The statements are,
    or can be, both true and not true.


    McAllister (2007, 2010–2012) provides a radical approach to our understanding
    of inconsistent observations expressed in the form of empirical data sets. He
    shows how different data patterns do not have to be interpreted in a way that
    suggests only a single pattern represents a true or correct interpretation about
    the structure of the world.


    Are there certain phenomena that exist in the world for which it is not possible
    to determine, given the information available at a particular time, there may
    be competing theories about the truth or falsity of a particular claim? For example,
    we have believed that through the application of certain epistemological principles,
    the truth or falsity of certain claims can be discovered. But what if that is
    not the case?


    Logical positivists hold that if any claim is true or false, there are observations
    that can be made which prove the truth or falsity of the claim. Quine showed that
    no claim is tested against particular observations, but that the evidence for
    any particular hypothesis is mediated by other assumptions that depend upon our
    background theory. Thus we might agree about a particular observation, but disagree
    as how to interpret that finding. McAllister goes beyond Quine and notes the assertion
    that any empirical data sets exhibit all possible patterns, each pattern exhibiting
    a certain error term. Moreover, all patterns exhibited in the dataset constitute
    evidence of a particular pattern about the world. Thus, the world contains all
    possible structures.'
