    # 7. Synopsis


    We so far presented two sets of characteristics of science: (1) explanation and
    prediction; and (2) conservation laws. These two sets are interconnected. As already
    discussed, failure to satisfy conservation of energy implies the failure of the
    system to be time-invariant, and thus the system becomes inherently unstable.
    Without the framework provided by the principles of invariance and conservation,
    crashes and crises seem unexplainable, let alone predictable. Conservation laws,
    therefore, provide us with a framework that helps us explain and predict, qualitatively
    at least, major economic events.


    As has been argued, there seems to be a deep connection between conservation laws
    in science and consistency in formal systems. To get something out of nothing
    is equivalent to having 1 = 0, a contradiction that renders the system inconsistent.
    Consistency in mathematics and conservation in physics, therefore, seem to have
    a common thread. As Richard Feynman (1965, p. 28) writes: “Nature uses only the
    longest threads to weave her patterns, so each small piece of her fabric reveals
    the organization of the entire tapestry.”


