  md: '# The Limits of Mathematical Modeling in the Social Sciences


    +   - Mathematics is inexhaustible.

    - Mathematics is mechanically (or algorithmically) inexhaustible (or incomplete).

    - Any consistent formal theory of mathematics must contain undecidable propositions.

    - No theorem-proving computer (or program) can prove all and only the true propositions
    of mathematics.

    - No formal system of mathematics can be both consistent and complete.$^5$


    Gödel''s Incompleteness Theorem represents a revolution in logic and philosophy
    of mathematics and has substantial impacts on the philosophy of science and social
    sciences. Yet, the theorem receives less attention than it deserves in these areas.


    The theorem shows that to avoid contradiction, a formal system must be incomplete,
    that is, the system cannot prove all true statements in the system. Truth extends
    beyond deductive proof. Consistency of a formal system can be proved within the
    system itself. Since a system that involves the contradiction $1=0$ can prove
    anything, such a system must be complete. This means that to avoid contradiction,
    the system cannot prove any statement, and thus, it must be incomplete (see Berto,
    2009, pp. 105, 179). (Smullyian, 1987, Chap. 13). To be consistent, therefore,
    it cannot prove its own consistency, and thus it must be incomplete.


    Consistency in formal systems, it can be argued, that plays a similar role as
    conservation laws in physical systems — both forbid "something for nothing." If
    this is indeed the case, then we might ask, as economic theory, represented by
