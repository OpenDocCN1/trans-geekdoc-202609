  md: '# About the Authors


    Giandomenica Becchio is Assistant Professor in Economics (University of Torino).
    Her research field is history of economics and methodology. She has authored several
    publications on the Austrian school (Carl Menger, Karl Menger, and F. Hayek),
    Karl Polanyi, liberalism and economics, and the feminist economics. Recently,
    she has published a book on the relationship between neoliberalism and neoclassical
    economics (Routledge).


    Gregory J. Chaitin is best known for his development of the algorithmic information
    theory and his discovery and proof of an incompleteness theorem (the Gödel–Chaitin
    theorem, 1971). Other results are the construction of the Omega number, which
    codes the halting problem in computer science, and the discovery of a family of
    exponential Diophantine equations coded by a numerical parameter $n$ some of whose
    properties are randomly distributed among the values of $n$. His recent work has
    to do with metabiology.


    Chaitin is presently an Invited Professor at the Alberto Luiz Coimbra Institute,
    a graduate school of engineering in Rio.


    Denis J. Dean is Professor of Geography and Geospatial Information Science and
    Dean of the School of Economic, Political and Policy Sciences and the University
    of Texas at Dallas. His research is focused on the development of new spatial
    optimization approaches and techniques, frequently applying concepts and ideas
    from machine learning to spatial optimization problems.'
