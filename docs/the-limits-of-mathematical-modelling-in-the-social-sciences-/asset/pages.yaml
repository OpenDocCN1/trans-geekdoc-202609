    2) There is a denumerable set of functions h_m(x) \in B, m \in w, such that there
    is no general decision procedure to ascertain, for an arbitrary m, whether P(h_m)
    or ¬P(h) is provable in ZFC.

    3) Given the set K = {m : ZFC \⊨ \phi(m)}, and given an arbitrary total recursive
    function g : \omega \to \omega, there is an infinite number of values for m so
    that C_{ZFC}(P(m)) > g(P(m)).


