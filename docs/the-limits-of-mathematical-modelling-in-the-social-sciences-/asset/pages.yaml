    # ## Introduction


    Gödel published his remarkable incompleteness theorems in 1931 (see Gödel, 1931).
    Gödel''s reasoning was immediately recognized as correct, even if surprising,
    and several researchers asked for its scope: since Gödel''s argument exhibited
    an undecidable sentence that didn''t quite reflect everyday mathematical fact
    or facts (see below), there was some hope that undecidable sentences might be
    circumscribed to a very pathological realm within arithmetic theory or its extensions.


    Alas, this proved not to be true.


    > *Partially supported by CNPq, Philosophy Section; the author is a member of
    the Brazilian Academy of Philosophy. This text was supported in part by CNPq,
    Philosophy Section, grant no. 433819902073398. It is part of the research efforts
    of the Advanced Studies Group, Production Engineering Program, at COPPE-UFRJ and
    of the Logic Group, HCTE-UFRJ. We thank Profs. A. V. Assumpção, R. Bartholo, C.
    A. Cosenza, S. (in memoriam), S. Jurkiewicz, R. Kubrusly, M. Gomes, and F. Zamberlan
    for support.'
