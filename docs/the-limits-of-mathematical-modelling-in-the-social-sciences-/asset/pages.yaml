  md: '# Is Economics a Science? A Gödelian Perspective


    Probably most economic studies prior to World War II were were concerned mainly
    with explaining economic phenomena. J. M. Keynes''s General Theory, for example,
    was an explanation of the Great Depression, which Classical Economics failed to
    explain, let alone predict. From this perspective, economics was an explanatory
    science, aiming at understanding the nature and causes of the wealth of nations.


    After World War II, however, formal mathematics became the language of economic
    theory (Weintraub, 2002). Mathematics, obviously, of immense value in clarifying
    ideas and communicating arguments. It is particularly necessary for providing
    precise predictions of the future, which is the second function of science.


    Both prediction and explanation seek to rationalize a kind of “expectation.” Explanation
    rationalizes retrospective, ex post, expectations. Given the relevant factors,
    we would expect a particular outcome to be the result; hence “understand” the
    phenomenon. On the other hand, rationalizes prospective, ex ante, expectations.
    Given a specific set of relations and initial conditions, we would expect a particular
    outcome to obtain. Both perspectives, therefore, seek a rational and consistent
    view of the world. From this point of view, both explanation and prediction constitute
    a scientific endeavor to learn and discover the truth. Explanation, by nature,
    provides a kind of prediction, qualitative or “pattern prediction,” as Friedrich
    Hayek describes it (Caldwell, 2004, p. 310). Precise or quantitative prediction,
    on the other hand, doesn’t naturally follow from explanation. There is a sort
    of tradeoff between the two, as we argue below.


    # Price of prediction


    The ability to quantitatively predict the future using mathematical models is
    unquestionably a valuable objective of science. But it comes at a price. The price
    is the abstraction and the simplifying assumptions that must be adopted for the
    mathematical model'
  merge: -1
  img_proc: true
