  md: '# The Limits of Mathematical Modeling in the Social Sciences


    and to the theory of social systems. Actually, most of physics can be axiomatized
    in a straightforward way, as there is a standard and unified formalism that stands
    behind every physical theory since the 18th century.


    I mean the so-called analytico-canonical formalism. Its starting point is:


    A theory in physics is a representation of the analytico-canonical formalism.
    Its dynamical laws are derived from the variational principles:


    ```

    $$\delta \int_{a}^{b} Ldt = 0$$

    ```


    ```

    $$\delta \int_{Domain} \mathcal{L}d\sigma = 0$$

    ```


    where $L$ is a lagrangian and $\mathcal{L}$ is a lagrangian density.


    This is Hamilton’s Principle; the integral acted upon by the variational operator
    $\delta$ is the Action Integral. Hamilton’s Principle has a simple interpretation;
    it is a kind of least effort principle. Physical systems move through the easiest
    path or paths. And effort is measured by $L$ or $\mathcal{L}$, which, let us say,
    a kind of “free energy” available for a system to use in its motion.


