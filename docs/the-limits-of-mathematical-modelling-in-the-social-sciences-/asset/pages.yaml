  md: '# The Perfect Language


    for the perfect language has some negative conclusions and some positive conclusions.


    Hilbert wanted to find a perfect language giving all of mathematical-truth, all
    mathematical knowledge; he wanted a formal axiomatic theory for all of mathematics.
    This was supposed to be a TOE for the world of pure mathematics. And this cannot
    succeed, because we know that every formal axiomatic theory is incomplete, as
    shown by Gödel, by Turing, and by me. Instead of finding a perfect language, a
    perfect formal axiomatic theory, we found incompleteness, uncomputability, and
    even algorithmic irreducibility and randomness.


    That''s the negative side of this story, which is fascinating from an epistemological
    point of view, because we found limits to what we can know; we found limits of
    formal reasoning.


    Interestingly enough, the mathematical community couldn''t care. They still want
    absolute truth! They still believe in absolute truth, and if you want a proof
    of this, just go to the December 2008 issue of the Notices of the American Mathematical
    Society. That''s a special issue of the Notices devoted to formal proof.


    The technology has been developed to the point where they can run real mathematics,
    real proofs through proof-checkers, and get them checked. A mathematician writes
    the proof out in a formal language, and fills in the missing steps and makes corrections
    until the proof-checker can understand the whole thing and verify that it is correct.
    These proof-checkers are getting smarter and smarter, so that more and more of
    the details can be left out. As the technology improves, both of formalizing a
    proof becomes easier and easier. The formal-proof extremists are saying that in
    the future all mathematics will have to be written formally and verified by proof-checkers.


    > ²For a discussion of recent developments in this area, see Vladimir Voevodsky,
    “Univalent Foundations” at http://www.math.ias.edu/vladimir/files/2014_IAS.pdf.'
