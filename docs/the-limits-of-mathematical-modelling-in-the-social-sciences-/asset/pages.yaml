    problem).¹¹ In Menger''s words, “We designate the Messenger Problem (since this
    problem is encountered by every postal messenger, as well as many travelers) the
    task of finding, for a finite number of points whose pairwise distances are known,
    the shortest path connecting the points. This problem is naturally always solvable
    by making a finite number of trials. Rules are not known which would reduce the
    number of trials below the number of permutations of the given points. The rule,
    that one should first go from the starting point to the point nearest, etc., do
    not get in general in the shortest path” (translated by Bock, 1963). Menger was
    very aware of the fact that the problem is difficult to solve because the fact
    that shorter paths are as complex as the original components of the problem. Hence
    any possible solution is not optimal.


    In the same year (1932), Menger delivered a lecture in Vienna on “the new logic”
    (Menger, 1979): it was a historical reconstruction of the crisis of logics in
