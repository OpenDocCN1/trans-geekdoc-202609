    and these laws keep the universe intact and in harmony; otherwise, we would have
    not observed the surprising congruence between mathematics and nature. Without
    restrictions, economic theory would fail to produce a consistent whole.


    Gödel shows that consistency of a formal system (rich in arithmetic) cannot be
    proved from within the system. It can be proved only via a higher system with
    additional axioms. Tarski shows the same on defining the truthfulness of a system.
    For a system to be sound and consistent, therefore, external restrictions are
    required. If the market is represented as a formal model, then meta-mathematics
    requires an analogous meta-market framework to ensure the consistency and soundness
    of the market. While economic theory utilizes heavy mathematics to model the economy,
    the theory is not sufficiently cautious about the meta-mathematics involved. This
    leads to applying models in a self-defeating manner. Consequently, economic models
    fail to be invariant. Lack of invariance is a major deficiency of economic theory
    in contrast to modern science.'
