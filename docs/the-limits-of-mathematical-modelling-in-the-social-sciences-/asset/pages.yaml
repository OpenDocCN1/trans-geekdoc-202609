  md: 'In is consistent with a rational, self-interested agent maximizing his consumption.
    In this economy, a Ponzi debt scheme will not be possible. For a Ponzi scheme
    to be possible, the borrower will roll over his debt forever, and this requires
    a lender (or more) to accept to have assets unconsumed forever. With TVC, however,
