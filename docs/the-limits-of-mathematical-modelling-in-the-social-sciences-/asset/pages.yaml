  md: '# Chapter 3


    # Logics and Formal Ethics

    in Karl Mengerian


    Giandomenica Becchio


    University of Torino, Italy


    Karl Menger''s aim as a scholar was to find a new kind of logic to be applied
    to social sciences (Menger, 1979). As a mathematician, he focused his attention
    on finding whether the building of social order can be described from a formalistic
    point of view. This chapter deals with his contributes to find which kind of logic
    — able to include uncertainty — is used by individual and by social groups when
    aggregations are formed in order to get a formal way to describe ethics.


    Carl Menger, the mathematician of the Austrian economist Carl, a supporter of
    formal ethics as well as a strong opponent of standard logic; and in his writings,
    he tried to explain how the use of n-value logic could have been proficiently
    to explain a system of formal ethics. Menger studied mathematics and logic in
    the 1920s in Vienna under Hahn, and thereafter in Amsterdam under Brouwer, one
    of the leading exponents of intuitionism. Even though between 1921 and 1927 Menger
    worked prevalently on topology and geometry (above all set theory and curve theory,
    Golland and Sigmund, 2000), he was also interested in economic theory. In 1921,
    he wrote a paper on the role of uncertainty in economic agents, starting from
    the St. Petersburg''s paradox.'
