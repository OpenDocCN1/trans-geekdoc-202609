- pgno: 17
  md: '# A road map for this chapter


    We present here a kind of primer on Gödel incompleteness, both in pure mathematics
    and in some domains of applied mathematics. It will be seen that undecidability
    and incompleteness exist everywhere in “reasonable” theories, so to say, and that
    they may affect innocentlooking, quite ordinary mathematical questions.


    Moreover, it is possible that some big open questions might turn out to be undecidable
    — turn out to be Gödelian specimens, we may say again — in strong axiomatic frameworks.
    Among those are Goldbach’s conjecture and the P vs. NP question (which may turn
    out to be independent even from a very rich axiom system such as ZFC (see Ben-David
    and Halevy, s/d) and da Costa and Doria, 2016).


    Since we require an axiomatic background to have incompleteness, we will discuss
    techniques for the axiomatization of scientific theories that require mathematics
    as its main language. The axiomatization techniques we describe are based on a
    suggestion by P. Suppes, and provide a quite straightforward procedure to atomize
    theories in physics and also in mathematical economics, mathematical ecology,
    and so on. Out of that, we will construct examples of relevant undecidable sentences
    in those theories.


    Actually this chapter is a survey of a few results that have been explored by
    N. da Costa and the author for 30 years.


    # Gödel’s 1931 paper on the incompleteness of arithmet and related systems


    Gödel’s great 1931 paper, “On formally undecidable sentences of Principia Mathematica
    and related systems, I” (see Gödel, 1931) has two main results. Suppose that the
    axiomatic theory we consider contains “enough arithmetic¹;


    > Lots of handwaving here! But anyway, we require arithmetic in classical logic,
    plus the trichotomy axiom.'
