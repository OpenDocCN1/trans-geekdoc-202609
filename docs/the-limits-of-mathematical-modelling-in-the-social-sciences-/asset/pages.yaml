    # Markets in equilibrium may have noncomputable prices


    Those results have an immediate consequence for a question of both historical
    and practical importance: the controversy over economic planning between L. von
    Mises and O. Lange (see, on that controversy, Seligman (1971, I, p. 155)).


    The central problem of economic planning is an allocation problem. Very frequently,
    allocation is to be done on the basis of maximizing (or minimizing) simple functions
    over finite sets. We proved trouble to be expected even when the problem of planning
    is reduced to the problem of determining equilibria in finite noncooperative Nash
    games, which is formally equivalent to the determination of equilibrium prices
    in a competitive market.


    So, the main argument by Lange in favor of a planned economy (by the way, an argument
    also shared by von Mises) clearly breaks down. Lange thought that the (possibly
    many) equations a huge and immensely powerful computer would always be able to
    figure out the equilibrium prices, therefore allowing (at theoretically) the existence
    of an efficient global policy maker. However, our results (as well as the weaker
    previous results by Lewis (1991a); Lewis and Inagaki (1991b)) disprove Lange’s
    conjecture.


    Therefore, those that argue that “the market knows better” may find a strong theoretical
    support in our conclusions (or in Lewis’s already quoted results), since the equilibrium
    point is reached (at least according to theory) while we cannot, in general, compute
    it beforehand.'
