  \n5. J. Chung, C. Gulcehre, K. Cho, and Y. Bengio. Empirical evaluation of gated\
  \ recurrent networks on sequence modeling. In *NIPS 2014 Workshop on Deep Learning*\
  \ (2014).\n\n6. D. Bacciu, F. Errica, A. Micheli, and M. Podda, A gentle introduction\
  \ to deep learning for graphs, *Neural Network*, **129**, 203–221 (2020).\n\n7.\
  \ D. Bacciu, P. Lisboa, J. D. Martín, R. Stoean, and A. Vellido. Bioinformatics\
  \ and medicine in the era of deep learning. In *26th European Symposium on Artificial\
  \ Neural Networks, ESANN 2018, Bruges, Belgium, April 25-27, 2018* (2018).\n\n8.\
  \ E. Ferrari, A. Retico, and D. Bacciu, Measuring the effects of confounders in\
  \ medical supervised classification: The confounding index (CI), *Artif. Intell.\
  \ Med.*, **103**, 101804 (2020).\n\n9. B. Biggio and F. Roli, Wild patterns: Ten\
  \ years after the rise of adversarial machine learning, *Pattern Recognit.*, **84**,\
  \ 317–331 (2018).\n\n10. L. Floridi, Establishing the rules for building trustworthy\
  \ AI, *Nat. Mach. Intell.*, **1**, 261–262 (2019).\n\n\n\n\n\nJose Bernal, Kaisar\
  \ Kushibar, Albert Clèrigues, Arnau Oliver, and Xavier Lladó.\n\n吉罗纳纳大学计算机视觉与机器人研究所，Girona\
