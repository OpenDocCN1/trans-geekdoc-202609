  \n\n\n近期，直接或间接描述个人健康状况的海量个人数据的出现，为开发深度学习模型提供了前所未有的机会，这些模型能够利用这些数据为医疗保健提供广泛的益处。然而，在这一关键领域，深度学习系统的开发和应用引发了许多伦理和法律考量。本章探讨了医疗领域深度学习伦理和法律指南的实际影响。首先，本文概述了全球范围内不同的\
  \ AI 伦理方法。然后，重点关注欧盟的伦理和法律框架，分析了与医疗领域深度学习应用相关的法律法规。最后，将隐私、公平性和可解释性等核心伦理价值映射到机器学习生命的不同阶段，并概述了将这些价值植入深度学习系统的若干先进方法。\n\
  \n## 1. 引言\n\n从海量健康数据中学习的机会为医疗领域带来了多项新收益。深度学习（DL）和机器学习（ML）的有效性已经在多个医疗应用中证明了其价值，涵盖从医学影像到癌症、阿尔茨海默病和心血管风险因素的预测算法。^(1–3)\
  \ 某些应用还可以帮助管理分诊、优化医院管理，并通过减轻医生医疗文档记录的负担来缓解其职业倦怠，让他们有更多时间与患者交流以提供更好的护理。然而，利用和整合敏感数据的\
  \ DL 算法的普及引发了若干担忧。例如，电子健康应用和可穿戴设备直接收集“准健康”数据^(4)（例如心率和睡眠追踪、呼吸规律性、步数计数）的使用日益增加，这引发了`隐私`问题。事实上，当此类数据与体重、身高或遗传性疾病等其他信息结合时，DL\
  \ 算法可能允许对个人的生活方式、健康状况、患病风险等进行推断。此外，由于数据收集过程的不完善或数据中反映的人类偏见，健康数据可能包含各种`偏见`。当这些偏见被输入不透明且复杂的\
  \ DL 模型时，很难被追踪或发现，这引发了`透明度`和`可解释性`问题。此外，如果 DL 系统存在缺陷，还会出现若干`责任`问题，包括`医疗事故`以及由于过失性依赖\
  \ DL 系统导致的医疗服务提供者责任。考虑 DL 系统开发和使用的伦理及法律影响是许多国家和国际组织建议的主题。示例包括：经合组织（OECD）《关于负责任管理可信人工智能五个主要价值原则的建议》^(5)，该建议由\
  \ OECD 36 个成员国以及阿根廷、巴西、哥伦比亚、哥斯达黎加、秘鲁和罗马尼亚签署，并于 2019 年被 G20 贸易部长和数字经济部长采纳；以及人工智能高级专家小组（AI\
  \ HLEG）于 2019 年发布的《开发可信人工智能伦理指南》^(6)，以及美国政府近期发布的《人工智能监管指南》^(7)。所有这些文件和建议都明确提到 AI\
  \ 系统而非 DL 系统。然而，我们强调 DL 和 ML 方法是实现 AI 的机制。由于对 AI 的定义尚未达成全球共识，为了避免任何混淆，我们强调在本章中，我们使用的\
  \ AI 定义采用了欧盟委员会在其《欧洲的人工智能：》^(a) 通告中的定义：\n\n*人工智能（AI）是指通过分析环境并采取行动（具有某种程度的自主性）来实现特定目标并出智能行为的系统。基于\
  \ AI 的系统可以是纯软件的，在虚拟世界中运行（例如语音助手、图像分析软件、搜索引擎、语音和人脸识别系统），AI 也可以嵌入硬件设备中（例如先进机器人、自动驾驶汽车、无人机或物联网应用）。*\n\
  \n在此视角下，所有提到 AI 系统的法律也涉及 DL 模型。在本章中，我们探讨了医疗领域 DL 应用伦理和法律指南的实际影响。由于全球范围内负责任的伦理 AI\
  \ 方法并不统一，我们分析了三个影响力国家对 AI 的不同意识形态、解释和指南。特别是，我们讨论了欧洲、中国和美国考虑到基于 AI 的健康应用的特殊社会/伦理问题。随后，以欧盟指南为参考点，我们将伦理担忧映射到\
  \ AI 技术问题，并概述了关于将伦理价值植入 DL 系统的科学文献。我们的分析重点是算法透明度、隐私、偏见和公平性问题。\n\n伦理指南的实施以及对法律要求的遵守，可以帮助\
  \ ML 研究人员和开发者设计能够轻松转换为临床实践的 AI 系统。为了支持 ML 开发人员，我们讨论了从设计到部署和维护 DL 解决方案的 ML 开发周期任何阶段可能需要解决的伦理法律问题。\n\
  \n## 1.1. 论 AI 伦理的重要性\n\n\n\n\n由于研究并非在社会真空中进行，因此不存在所谓的`价值中立`技术。研究人员感兴趣的研究是他们价值观和信仰体系的体现。技术进步是由社会、公司以及研究人员自身的文化、伦理、政治和经济利益驱动的。为什么某些技术被认为值得投入时间和金钱，而另一些则不然？特定的技术让哪些事情变得更容易了？在任何技术的开发阶段和应用阶段都存在伦理选择。某些看起来看似无害且纯粹的技术选择可能并非如此。\n\
  \n想象一名研究人员正在设计一个 `DL model`，以预测患者在肝移植后的生存时间。研究的目标是改进潜在受体的排名系统，以优化移植存活率。对于该任务，`DL\
  \ algorithm` 必须优化的 `loss function` 选择通常被认为是一个纯粹的技术选择。然而，`loss function` 可能会隐含地优先考虑较年轻的患者，这是一个伦理选择，无论对错。\n\
  \n现在，想象用于训练 `DL algorithm` 的数据集是来自某美国私人非营利组织在 1988 年至 1996 年间收集的。所代表的患者大多数是白人，此外，数据显示，黑人的移植物存活率显著低于白人。该算法极有可能在优化阶段利用这种相关性，即使患者的种族已从数据集中显式删除。因此，隐性地，模型会选择白人而非黑人进行移植，即使观察到的相关性可能与种族和移植物存活率之间真实的因果关系无关，这是另一个伦理选择。\n\
  \n究竟是什么在优化开发者选择的 `loss function`？如果我们考虑到数据集可能已经过时，因为从最后数据收集日期（1996 年）至今发生了分布漂移，情况就会变得更加复杂。这个简单的例子说明了研究人员如何隐含地将他们的信念和数据偏差嵌入到他们开发的技术中。尽管如此，近期的辩论强调，许多技术专家对他们工作的社会影响和政策影响感到疏远。然而，上述列出的许多伦理选择已编码在硬法中，因此是可执行的。技术的开发和使用与政治以及关于如何促进个人或整个社会美好生活的伦理问题紧密相连。\n\
  \n研究这类伦理问题的领域是 `AI ethics`。AI 伦理调查 AI 系统在开发、部署和使用过程中提出的所有伦理问题。例如，它研究价值观是如何被刻入技术产物的，如果\
  \ AI 系统失败，应该由谁负责，以及研究目标和发现背后的动机。这些问题的答案为全球各地的监管机构提供了参考。\n\n## 2. 全球 AI 伦理与法律准则\n\
  \n负责任使用 AI 的伦理和法律指南在全球范围内各异。在过去的几年里，大量的私人和公共利益相关者发布了关于可靠实现 AI 技术的要求的报告。在所有关于此主题的最新文献中，出现了五项伦理原则：透明性、公正、无害、责任和隐私。然而，每个国家都以不同的方式解释这些原则并将其转化为其法律体系。区分不同方法的主要维度是`监管与创新`之间的权衡。例如，美国倾向于支持创新，而欧盟则具有强烈的监管方法。这种以及许多其他伦理和监管问题的出现，是因为开发这些技术时所处的不同的社会经济和政治环境。在本节中，我们将分析发布\
  \ AI 政策的三个最具影响力的世界大国的不同价值观体系。在进行详细讨论之前，我们简要概述了驱动 AI 技术创新不同方法的意识形态：：\n\n*   **美国：**\
  \ 美国的 AI 伦理方法受到自由意志主义价值观的影响，这些价值观意味着政府对技术的监管应降至最低。它促进“硅谷模式”，即在监管的灰色地带进行创新，`先快速行动，后破坏，事后道歉`。**人的观念：**\
  \ 经济人 (`Homo Economicus`)，个人主义。\n*   **中国：** 中国的 AI 伦理方法受到儒家价值观和中国社会主义思想的影响。它关注社会和谐，这意味着政府具有某种程度的道德控制和监控元素。**人的观念：**\
  \ 集体主义、行为主义、功利主义。*“整个社会应当动员参与健康事务，从而为人民健康和国家整体发展做出贡献”。*\n*   **欧盟：** 欧盟的 AI 伦理方法基于对基本权利、民主和法治的尊重。特别是确定了四项与\
  \ AI 政策最相关的伦理原则：`尊重人类自主`、`防止伤害`、`公平与可解释性`。**人的观念：** 康德式的作为自主者的的人观（自由、自主和尊严）。*“人类尊严是一个基本概念，它提供了解释……欧洲文化和司法管辖区时所需的框架”。*\n\
  \n这些价值观和伦理原则指导了 AI 政策的实施，并解释了对同一问题的不同观点。需要注意的是，尽管伦理原则是法律的基础，但它们没有法律约束力，因此不可强制执行。然而，每个法律体系都有许多工具将伦理原则内化为硬法。我们现在将关注全球这三个地区，讨论它们的医疗保健政策、对\
  \ AI 的方法、各自的社会经济特点以及随后的伦理问题。此外，我们为每个地区提供了有关医疗保健 AI 应用最重要的法律概述。\n\n### 2.1. 美国\n\n\
  许多位于美国的大科技公司（如 `Google` 和 `IBM`）为医疗保健开发 `DL solutions`，它们起草了自身的伦理政策，以解决对安全使用医疗保健数据的许多担忧。尽管它们的声明目标是开发能够提高护理质量、降低医疗成本并对整个社会有益的医疗应用，但某些潜在的利益冲突尚未得到具有约束力标准的承认和执行。2020\
  \ 年，特朗普政府发布了《人工智能应用监管指南》草案。该备忘录反对任何“不必要阻碍 AI 创新和增长的监管或非监管行动”，这与美国优先考虑创新而非监管的方法是一致的。\n\
  \n\n\n\n机构必须避免采取预防性方法，即对 AI 系统设定高到无法实现的标准，以至于社会无法享受其益处。在 AI 涉及风险时，机构应考虑到与 AI 旨在补充或替代的系统相比，使用\
  \ AI 的潜在收益和成本。\n\n请注意，该方法明确反对“预防性方法”，并依赖于传统的成本-效益分析。该文件列出了联邦机构在决定如何以及是否监管 AI 应用时应考虑的\
  \ 10 项原则。这 10 项原则分别是`AI 公众信任`、`公众参与`、`科学诚信与信息质量`、`风险评估与管理`、`收益与成本`、`灵活性`、`公平与非歧视`、`披露与透明`、`安全`以及`机构间协调`。这种以创新为导的方法在`风险评估与管理`原则中变得非常明显：\n\
  \n没有必要减轻每一个可见的风险；事实上，监管政策的一个基本原则是所有活动都涉及权衡。\n\n这些指南遵循美国国家标准与技术研究院（`NIST`）于 2019\
  \ 年 2 月发布的 AI 监管与标准计划，该计划明确应对了 AI 技术发展的伦理、社会和法律关注，并指出：\n\n虽然该计划开发的利益相关者广泛认同社会和伦理考量必须纳入\
  \ AI 标准，但目前尚不清楚如何做到，以及是否已有足够的科学和技术基础来制定这些标准条款。\n\n对于归类为医疗器器的 `DL` 应用，其监管由美国食品药品监督管理局（`FDA`）负责。2020\
  \ 年 1 月，`FDA` 发布了一份题为《基于人工智能/机器学习（`AI/ML`）的医疗器械软件修改建议监管框架》的讨论论文。虽然目前的监管框架正在更新中，并将在未来几个月内定义，但伦理担忧已是广为人知的。事实上，在美国，最大的伦理担忧源于公司与个人之间潜在的健康信息不对称，以及数据集中存在的系统性偏见。信息不对称导致了权力不对称，有利于\
  \ `Google` 这样的大公司，它们通过用户对医疗状况的查询收集了大量用户的敏感健康数据。这些知识与其他用户在互联网上的互动相结合，可能会推断出非常个人且敏感的信息，模糊了健康数据与非健康数据之间的界限。这些信息的收集在法律上是利用了\
  \ `HIPAA`（《健康保险可携带性与责任法》）隐私和安全规则对非传统医疗数据的覆盖限制。问题在于，许多用户并未意识到他们的搜索历史会被处理以推断其健康状况，并失去了对这些信息使用的控制权。潜在地，健康数据可能会根本上改变个人获得医疗保险甚至就业的机会。由于目前美国没有为公民提供全民医疗，这些担忧变得更加严重。此外，健康数据包含许多偏见（见\
  \ `Section 6.1`），并且也反映了社会中存在的那些系统性偏见。如果不妥善处理，在偏偏数据上训练的算法将在决策过程中学习并延续这些偏见。\n\n##\
  \ 2.2. 中国\n\n2016 年底，中国发布了其医疗健康战略蓝图——《健康中国 2030》，意图将公共卫生放在优先位置，并将重心从疾病治疗转向疾病预防。特别是蓝图指出，医疗卫生行业的努力应集中在疾病的早期发现、诊断和治疗上。蓝图宣布优先考虑公共健康的目标与中国政府之前的努力一致，中国在\
  \ 2009 年至 2017 年间将医疗预算增加了四倍。这些举措是为了应对由于空气质量差导致与污染相关的疾病增加、对国家老龄化人口健康管理的担忧，以及城乡地区医疗服务获取的不平等。正如在\
  \ 2017 年的《新一代人工智能发展计划（AIDP）》中声明的那样，中国计划将 `AI` 作为工具来处理这些健康问题。这份由中国国务院发布的文件概述了中国成为\
  \ AI 领域世界领导者的战略，在其明确的战略目标中，包含了构建`智能健康与养老系统`以及为 AI 的使用设计可编入硬法的伦理框架。。`AIDP` 指南应由私营部门实施。事实上，在发布同同年，中国科学技术部与总部位于中国的跨国公司\
  \ `腾讯` 合作，促进医学领域的 AI 研究，特别是开发用于医疗诊断的计算机视觉应用。`腾讯` 近几年开发的基于 `AI` 的应用列在近期为《全球创新指数》2019\
  \ 医疗创新特别主题撰写的一份报告中。该文件报告了中国意图利用 AI 技术进行分诊、临床决策支持系统、药物发现、提高医院管理和运营效率。此外，中国计划通过医疗信息平台\
  \ `腾讯医典` 管理健康知识传播，并通过可穿戴设备监测用户的健康状况。除了将健康信息集中在一个平台上的潜在危险外，主要的伦理担忧在于，以公共利益为名进行健康监测与监视公民健康行为之间的细微区别。与国务院推动的“社会信用体系”计划类似，AI\
  \ 技术可能会增强中国政府对被认为“不健康”公民行为的远程控制能力。例如，可以使用 `DL` 应用于惯性传感器数据（如可穿戴设备的加速度计和陀螺仪）监控缺乏运动。这种危险涉及到所有所谓的“社会疾病”（例如二型糖尿病和肥胖症）。另一个证明中国政府对公民健康行为行使监控能力的案例是近期利用\
  \ AI 技术抗击新冠病毒疫情的传播。政府与中国科技巨头公司合作，开发了一种黑箱 AI 系统，能够根据每个公民的感染风险对其进行分类。这种分类被用于生成 `Q.R.`\
  \ 码，帮助警察执行隔离。此外，人脸识别技术结合非接触式体温检测，帮助警察识别违法的潜在病毒载体。这种在个人权利与社会责任之间的权衡，影响了用户仅在知情同意后分享其健康数据的权利。事实上，如果健康数据被视为公共利益，那么它们可能会从不知情的用户那里被收集，用于训练复杂的\
  \ `DL` 算法，从而造福整个社会。\n\n\n\n\n\n## 2.3. 欧盟\n\n欧盟在监管 AI 伦理原则以及影响该主题的国际讨论方面可能是全球领导者。欧盟倾向于将其\
  \ AI 伦理原则编码为硬法（hard law），这引发了人们对这种监管可能成为创新障碍的担忧。然而，欧盟委员会认为将 AI 伦理原则编码视为一种竞争优势，这将增强消费者对欧盟产品的信任，并激励公司创造符合这些规则的创新产品。事实上，欧盟委员会的监管方法被认为能够促进可信技术的发展，并在整个范围内统一其采用方式。影响\
  \ AI 应用的硬性监管的最新例子是`《通用数据保护条例》(GDPR)`。`GDPR` 于 2018 年 5 月生效，它监管了欧盟内的个人数据处理，保护了欧盟公民的隐私，并规定每位欧盟公民都有权`不受不受完全基于自动化处理（包括画像分析）的决策的影响，除非该决策对其产生法律影响或对其产生类似的重远影响`。\n\
  \n在起草 AI 监管新法律的类似努力下，欧盟委员会于 2018 年 6 月任命了 AI 高级专家小组（`AI HLEG`）来提出其 AI 战略。2019 年上半年，该小组定义了可信\
  \ AI 的七项要求，并包含了一份供公司实务使用的评估列表试点版本。该文件受到了全欧洲公司的良好欢迎，它们通过评论和建议对此做贡献。在指南中，确定了实施可信 AI\
  \ 的三个组成部分：`合法(lawful)`、`伦理(ethical)`和`稳健(robust)`。欧盟伦理和可信 AI 的方法基于基本权利且以人为本：\n\n\
  *这种以人为中心的 AI 方法努力确保人类价值观处于 AI 系统开发、部署、使用和监控的核心地位，其方法是确保对基本权利的尊重，包括《欧盟条约》和《欧盟基本权利宪章》中列出的权利，所有这些权利都通过引用植根于尊重人类尊严的共同基础而统一在一起，在这一基础中，人类享有独特且不可剥夺的道德地位。*\n\
  \n这种方法通过建立保护欧洲公民权利和自由的适当保障措施，促进了研究和创新。例如，文档明确提到政府利用 AI 驱动的大规模监控潜在风险是一个关键关切，这与中国以`社会和谐`之名的监控方法形成对比。它还明确提到了`权力或信息的不对称，例如雇主与工人之间，或企业与消费者之间`是另一个关键关切。文档中确定的相关的四个伦理原则是：`尊重人类自主原则`、`防止损害原则`、`公平原则`和`可解释性原则`。这些原则在最近的白皮书《人工智能——卓越与信任的欧洲方法》中得到了进一步的落地化。在这份文件中，欧盟委员会概述了其行动计划，旨在欧洲法律和伦理价值观的框架内促进\
  \ AI 的使用。该计划包括将 AI 研究预算增加 70%。白皮书专门针对了医疗保健部门，将其确定为需要进一步完善立法的的高风险领域。\n\n我们认为 `AI\
  \ HLEG` 概述的伦理框架是最完整的。因此，在`第 3 节`中，我们讨论了该小组确定的作为可信 AI 基础的七项原则，并强调它们对医疗保健领域 `DL` 应用的影响。\n\
  \n## 3. 欧盟对可信 AI 的七项要求\n\n欧盟可信 AI 方法的七项要求的基础是《欧盟基本权利宪章》规定的基本权利。我们现在将进入每项要求的细节，并强调每项要求与医疗领域相关的潜在\
  \ `DL` 场景。\n\n### 3.1. 人类主体性与监督\n\n这项要求反映了`尊重人类自主原则`，保护了欧盟公民的基本权利并为所有其他要求奠定了基础。它基于三个子要求：\n\
  \n- **基本权利：** AI 应用应尊重基本权利。这要求在应用程序的设计阶段，开发者要进行`基本权利影响评估`，包括对个人数据的保护以及对这些数据`为了特定目的进行公平处理`的权利。\n\
  - **人类主体性：** AI 应用应促进人类自主性。这项要求与个人自由这一基本权利直接相关，这意味着`人类应该保持自由为自己做出生活决定`。这意味着医疗领域的\
  \ `DL` 应用应被设计为决策支持系统的一部分，允许最终用户做出知情的自主决策。这一原则也反映在 `GDPR` 第 22 条关于“自动化个人决策（包括画像分析”的规定中，内容如下：\n\
  \n*数据主体有权不受完全基于自动化处理（包括画像分析）的决策的影响，除非该决策对其产生法律影响或对其产生类似的严重影响。*\n- **人类监督：** AI 应用应允许人类用户对过程拥有控制。这意味着应该建立适当的人类保障，以防止\
  \ AI 系统产生意外的负面影响。这项要求与指南中倡的以人为中心的设计，以及根据 `GDPR` 第 22 条规定的获得人类干预的权利保持一致。\n\n### 3.2.\
  \ 技术稳健性与安全性\n\n这项可能与 AI 应用开发者最相关。它要求他们通过关注技术稳健性和安全性的四个关键方面，将`防止损害`原则落实化：\n\n- **攻击韧性与安全性：**\
  \ AI 系统开发者应防止系统黑客攻击和对抗攻击。识别了三个攻击目标：数据（数据投毒）、模型（模型泄露）和底层基础设施（硬件和软件）。\n- **回退计划与通用安全：**\
  \ AI 系统开发者应建立适当的回退计划，以应对对抗攻击和意外情况。这意味着需要对潜在风险（技术的无意或恶意使用）进行评估，并制定管理该状况的计划。例如，AI\
  \ 可以在继续之前请求人工干预。回退计划应经过测试，并在出现不利结果时建立有效的补救济措施。\n- **准确性：** AI 系统应具有很高的准确性，并在其结果/预测不准确时进行报告。在指南的语境下，“准确性”一词不是指评估\
  \ `ML` 模型的标准指标，而是指系统做出准确决策的能力。这意味着系统准确性的正确定义取决于应用程序正在执行的任务。\n\n\n\n\n\n- **可靠性与可重复性：**\
  \ AI 系统应该既具有可靠性又具有可重复性。在指南的背景下，如果 AI 系统在特定条件下能够正常工作，则被认为是`可靠`的；如果在相同条件下能够一致地提供相同的输出，则被认为是`可重复`的。应该对\
  \ AI 系统的可靠性和可重复性进行持续监控和测试，如果存在 AI 系统不符合标准的情况，应当报告此类情况。\n\n### 3.3. 隐私与数据治理\n\n此项符合《欧盟基本权利宪章》中关于“尊重私人和家庭生活”以及“保护个人数据”的第\
  \ 7 条和第 8 条，这些条款反映了适用于隐私领域的预防原则。数据保护还受到 `GDPR` 以及其他指令在整个欧盟范围内的监管。指南进一步对敏感数据规定了特殊关注（某些数据包括宗教、性倾向和政治取向、年龄和性别），这些数据可能从用户的数字足迹中推断出来并用于歧视他们。为了符合这一要求，应考虑两个关键方面：\n\
  \n- **隐私与数据保护：** 由于健康数据被认为是最敏感的数据之一，因此在 AI 的整个生命周期中确保隐私和数据保护至关重要，最终要数据保护影响评估。我们将在\
  \ `Section 5.3`中详细介绍如何处理健康数据，并在 `Section 6.4`中讨论隐私攻击。\n\n- **数据治理——数据的访问、质量与完整性：**\
  \ 数据治理是管理组织所用用数据的过程。这包括建立针对 `data access`（谁可以访问数据）、`data quality`（数据无偏见、数据无错误）以及\
  \ `data integrity`（受损数据、数据黑客攻击）评估的协议。数据治理有若干项相关标准，例如 `ISO` 和 `IEEE` 标准。\n\n### 3.4.\
  \ 透明度\n\n此项要求反映了欧盟信赖 AI 指南中的`可解释性原则`。透明度应应用于 AI 生命周期的每一个阶段，事实上它规定了对整个系统拥有完整视图。为了符合这一要求，应考虑以下方面：\n\
  \n- **可追溯性：** 实现 AI 应用所需的所有步骤都应妥善记录。在医疗领域的 `DL` 应用背景下，这包括记录数据收集过程及其标记方式、所选的 `DL`\
  \ 架构以及使用的优化算法，以及为了训练、验证和测试模型而对数据的划分。一旦模型的错误结果对患者健康产生负面影响，就有必要理解该决策背后的原因。在这种情况下，跟踪模型的决策历史以追溯到错误的共同源头可能是很有帮助的。\n\
  \n- **可解释性：** 识别出两个层级的解释性：第一层是指理解 AI 决策过程的技术能力；第二层是指解释人类决策者如何与 AI 决策支持系统交互以及他/她如何受其影响。这两者的结合有助于所采用业务模式的全局透明度。指南规定，对人类生活影响巨大的\
  \ AI 应用要特别关注，例如在医疗背景下。\n\n- **沟通：** 当用户与 AI 系统交互时，应始终保持明确性，且用户应始终拥有退出选项。最重要的是，必须恰当地沟通\
  \ AI 的局限性和实际能力，以避免对 AI 的过度自信和过度依赖，这会影响患者和医疗专业人员。例如，考虑 `Babylon Health`^(n)，这是一种个性化医疗服务，提供了一个\
  \ AI 驱动的机器人，通过引导性问题对患者进行分诊，并将他们重定向到真实的医生或药剂师。它还可以提供医疗建议，例如`how to deal with common\
  \ cold`。然而，用户知道初始交互是与 AI 系统，且他/她始终有可能与真实的医生继续对话。\n\n### 3.5. 多样性、非歧视与公平\n\n此项要求符合欧盟指南中列出的`公平原则`，并符合《欧盟关于非歧视的基本权利宪章》的第\
  \ 21 条，该条款规定如下：\n\n*禁止基于任何理由（如性别、种族、肤色、民族或社会出身、遗传特征、语言、宗教或信仰、政治或其他意见、国家少数民族成员、财产、出生、残疾、年龄或性取向）的歧视。*\n\
  \n预防歧视涉及三个主要方面：\n\n- **避免不公平的偏见：** 理想情况下，医疗领域的 AI 应用可以促进获得更好的医疗服务的途径，从而增加社会公平性。然而，由于这些应用高度依赖于其训练的数据质量，它们可能会提供不公平且有偏见的结果。在\
  \ `Section 6`中，我们从技术角度详细讨论 `DL` 中的偏见与公平性问题。\n\n- **可访问性与通用设计：** AI 应用的设计应遵循`Universal\
  \ Design`原则，通过考虑不同能力、技能、年龄和体型的人，涵盖尽可能广泛的群体。\n\n- **利益相关者参与：** 所有受 AI 应用影响的相关利益相关者都应参与到其设计和维护中。\n\
  \n### 3.6. 社会与环境福祉\n\n此要求通过将公平和预防原则扩展到更广泛的社会，解决了与 AI 应用相关的环境成本和社会风险。据估计，训练 `NLP`\
  \ 深度学习模型的碳足迹等同于一次跨美国飞行.^(23)。这对环境以及人类健康具有重要影响。为了符合这一要求，必须考虑三个重要方面：\n\n- **可持续与环保的\
  \ AI：** 在 AI 系统的设计阶段，应进行环境影响评估（资源消耗、能量消耗、碳足迹）。根据最近的一研究，AI 可以帮助实现许多`可持续发展目标`^(24)，例如，通过疾病早期检测、治疗个性化以及增加基本医疗服务的质量和可访问性，它可以实现第三个目标：确保所有年龄段的健康并促进福祉。\n\
  \n- **社会影响：** 如果 AI 系统直接与人类交互，则需要进行社会影响评估。终端用户需要知道他/她正在与 AI 系统交互以及交互的局限性。在医疗领域，良好的医患关系对于减轻疾病焦虑至关重要，特别是对于致命性疾病.^(25)。这需要与人类医生进行交互。AI\
  \ 嵌入临床环境的方式可能决定了护理质量的提升与毁灭性的患者体验之间的差异。例如，如果 AI 应用直接与患者交互并给出诊断，而没有解释和适当的沟通，可能会损害患者的心理健康。\n\
  \n\n\n\n\n- **社会与民主：** AI 可能会增加经济和民主不平等。例如，尽管医疗保健领域的 AI 应用可以使农村地区更容易获得基础医疗服务，但这可能也会加剧能够负担起人类护理的患者与负担不起的患者之间的差异。\n\
  \n### 3.7 责制\n\n责制要求在 AI 系统的整个生命周期内，必须建立适当的机制来确定 AI 系统结果的责任归属。特别是，它概述了三个子要求：\n\n\
  - **可审计性：** 应当能够对算法、数据和设计过程进行评估。这与之前的透明度要求相关，并且是确保具有救济能力的必要步骤。\n- **负面影响的最小化与报告：**\
  \ 应确保能够安全地报告 AI 决策的负面结果，并最终促进与 AI 构成的风险成比例的算法影响评估。\n- **权衡：** 在 AI 系统的设计阶段，有必要承认上述列出的要求之间所有可能的权衡。这一子要求在没有明确说明的情况下，触发了\
  \ AI HLEG（人工智能高级专家）指南中唯一的预防性考量因素，因为这些指南明确禁止开发、部署和使用在伦理上不可接受的权衡形式的 AI 系统。例如，一种伦理上不可接受的权衡损害了“基本权利和自由的本质”，或不是“民主社会中必要且成比例的措施”（参见\
  \ GDPR 第 23 条）。\n- **救济：** 应确保在出现不利或不公平结果时，具有充分的救济可能性。例如，根据对多样性、非歧视和公平性的要求，如果 AI\
  \ 应用未能解决训练数据集中存在的歧视偏见，应允许个人对机器决策寻求有效的救济。\n\n## 4. AI 应用生命周期阶段\n\nAI 系统从原型到现实临床应用的每个阶段都需要关注不同的伦理和法律问题。在`欧盟对可信赖（trustworthy\
  \ AI）的要求`中，AI HLEG 确定了三个在指南实施中应发挥作用的利益相关者：`开发者`（研究人员和软件工程师）、`部署者`（任何产品中使用 AI 的组织）和`终端用户`。这些利益相关者中的每一个对应\
  \ AI 产品生命周期的一个或多个阶段。深度学习（DL）应用的主要四个阶段如下：\n\n1. **设计：** 在此阶段，确定应用目标，获取数据，并选择 DL 模型的架构。\n\
  2. **开发：** 在此阶段，对 DL 模型进行开发、验证和测试。在学术环境中，这可能是撰写研究论文前的最后一个阶段。\n3. **部署与维护：** 在此阶段，DL\
  \ 模型被嵌入到应用中，并成为投放市场的产品。根据需要需要对产品进行监控和更新。\n4. **使用：** 在此阶段，最终产品到达终端用户。\n\n### 4.1\
  \ 设计阶段\n\n在`设计阶段`中，让所有相关的利益相关者参与至关重要。对于目标是进入市场的医疗保健 DL 应用，一个理想的团队应该包括 ML 工程师、领域专家（如临床和医学研究人员）、医院管理人员、法律领域专家（提供监管建议）以及应用的未来终端用户。跨学科团队对于识别相关的临床场景和防止可能的数据分析陷阱也至关重要。例如，开发一个学习将临终关治疗与高死亡风险相关起来的模型在现实临床场景中是没用的，因为护理团队已经拥有这些信息。在这一阶段，考虑应用的伦理影响也很重要。通过欧盟委员会设立的`可信赖\
  \ AI 评估列表`可能很有用，以确保预先满足所有伦理要求。特别是，ML 工程师应关注`预防伤害`原则，并针对他们所设计的技术的可能产生的无意不利结果和恶意使用建立妥当的保护措施。由于健康数据被认为是敏感数据，应特别关注潜在的隐私风险。我们在第\
  \ 6.4 节中讨论这个问题。此外，通常情况下，欧盟委员会规定 AI 应用应采用`设计原则`（隐私设计、安全设计、伦理设计）方法。也就是说，在这个阶段，ML 工程师既要考虑系统的功能需求，也要考虑伦理和法律要求。数据收集也发生在设计阶段。如前所述，数据可能包含各种偏见（见第\
  \ 6.1 节）。为了防止歧视或无意的不利结果，欧盟委员会设数据收集的要求：\n\n- 确保 DL 应用在广泛且具有代表性的数据集上训练。\n- 确保隐私和个人数据保护，对数据进行隐私评估。\n\
  - 记录选择数据的原因和。\n\n### 4.2 开发阶段\n\n开发阶段的目标是对模型进行开发、验证和测试。在此阶段，开发者需要实现之前设计步骤定义的策略，以开发一个`伦理\
  \ ML 模型`。首先，在整个开发过程中必须保证`透明度`。这对于确保`可追溯性`和正确的责任归属至关重要。为此，创建适当的技术文档并共享 DL 应用的数据和源代码（根据版权）是重要的。这种良好的做法对于保证结果的`可靠性`和`可重复性`也是理想的。\n\
  \n**确保可重复性：** 为了确保结果的可重复性，最好将模型性能与基准先进模型进行对比。在这方面，ML 社区最近努力针对许多医疗应用开发开放数据的基准模型。如果开发阶段是撰写学术论文前的最后一个阶段，这一方面也非常重要：如果可能，应与科学界共享实验中使用的数据和源代码。我们意识到在大多数情况下这是不可能的，特别是对于对包含敏感信息的真实医疗数据进行实验的医疗应用。然而，一种解决此问题的最新良好做法正在开发医疗应用的学术工作中出现：模型性能在私有数据集和开放数据集上均有报告，并发布运行所需的预处理程序和源代码本身。复制结果所需的文档还应包括随机种子以及训练阶段使用的硬件。\n\
  \n\n\n\n\n### 模型的合理评估\n\n在模型的评估阶段，开发者应该仔细选择合适的评估指标。该指标应该考虑数据集是否不平衡，以及它是否反映了临床相关的衡量标准。例如，考虑一个用于将患者胸部\
  \ X 光图像分类为是否患有肺癌的深度学习（DL）应用。如果临床场景是筛查或确诊，合适指标的选择也会随之改变。在筛查场景中（即对大量无症状的人进行潜在疾病检测的环境），具有较高的灵敏度可能更优，以防遗漏任何风险人员。然而，在确诊场景中（即对个体进行确定性诊断的环境），具有高特异性可能更优。^(31)\
  \ 无论如何，作为 `ML` 中最常用的指标之一，`AUC` 分在这两种临床场景下均无法提供相关信息。\n\n此外，在将数据划分为训练集、验证集和测试集时，防止`标签泄漏`至关重要。许多医疗应用任务需要基于患者级别的划分，而不是随机的观察层级划分。例如，如果必须训练\
  \ DL 模型来识别胸部 X 光图像中的疾病，开发者应该考虑到一个患者可能为数据集贡献了多张图像，因此需要进行患者级别的划分。^(27) 最后，在报告模型性能时，重要的是说明模型训练和验证的背景（例如：单中心数据集、成人与儿童人群等），换句话之，即开发该模型时使用的临床队列。\n\
  \n### 确保可追溯性和责任制\n\n正如欧盟委员会所建议的，为了追溯潜在故障的来源并保证责任的判定，开发者应该采取以下措施：\n\n* 记录训练方法以及测试和验证技术。\n\
  * 确保关于应用局限性和能力的清晰信息，例如关于系统对对抗攻击的稳健性信息以及其结果的可重复性信息。\n* 报告应用目标以及预期预期运行的条件。\n* 报告开发应用过程中使用的所有相关指标。\n\
  \n### 确保透明度\n\n如第 3.4 节所强调，透明性要求与`解释性`要求密切相关，当 `ML` 模型对人类是不透明且不可理解时，解释性是基础性的。因此，在开发\
  \ DL 模型过程中，必须通过实施技术来考虑这一方面，这些技术有助于提供解释模型行为或模型决策原因的工具。^(32, ^(33) 解释性问题在第 6.3 节中有深入讨论。\n\
  \n### 确保隐私和公平性\n\n在此阶段，也有必要处理`设计阶段`中识别出的`隐私`和`公平性`问题。为此，开发者应该实施保护技术以缓解隐私和不公平风险。如第\
  \ 6.4 节和第 6.2 节所示，某些技术通过数据转换来消除训练数据中的风险，而另一些通过改变 DL 模型的学习过程来缓解风险。然而，由于这些技术可能会导致模型精度下降，在应用任何缓解策略之前，开发者应首先评估隐私泄露或不公平行为的可能风险，以便将干预集中在必要的地方。^(34,\
  \ ^(35) 风险评估与缓解策略的结合，为定义和开发符合现有法律和伦理框架的 DL 系统提供了要素。\n\n### 4.3 部署与维护阶段\n\n部署阶段的目标是将\
  \ DL 模型推向市场。在这一阶段，考虑我们在第 5 节中讨论的所有相关法律是至关重要的。请注意，即使欧盟委员会尚未分析所有可能的 AI 应用所需的法律部分（合法性），但遵守整个监管框架是一项具有重大后果的强制性义务。虽然在不依赖法律规则的情况下伦理要求很难执行，但法律规则定义上就包含了执行机制。因此，例如在\
  \ `ML` 过程中违反 `GDPR` 规则将导致民事和刑事责任及制裁，而嵌入 `ML` 产品中的偏见可能会导致其在上市时存在缺陷和或违法。\n\n此外，可能需要新的模型评估形式来证明最终工具的临床实用性。例如，最近的一项工作认为，仅通过训练-验证-测试集划分进行测试的\
  \ DL 模型缺乏临床有效性的证明。^(31) 这一观点主要由于两个原因：首先，是因为数据集可能包含各种偏见，防止模型在临床实践中良好泛化（我们将在第 6.1\
  \ 节中详细介绍），其次是因为此类应用应该证明对患者的健康结果有用。特别是，作者建议通过随机试验对涉及 DL 应用的整个患者治疗策略进行评估。\n\n此外，一旦部署，应对对\
  \ DL 应用进行监控以进行系统维护。2016 年，世界卫生组织（WHO）发布了首份《数字健康干预监测与评估》指南。^(36) 虽然这些指南的重点是国家层数字健康干预，但它们提出的考虑也适用于较小的应用（直到应用成熟的倒数第二阶段）。特别是，WHO\
  \ 指南指出，随着数字健康应用随时间推移成熟，监控活动也需要演进。事实上，在 DL 应用背景下，监控活动必须通过持续评估系统性能随时间下降的情况，验证此类应用是否按预期运行。同时，监控活动还应考虑系统对伦理要求的遵循情况。换句话说，`部署者`应该建立审计流程，能够同时评估系统的技术性能以及系统对伦理和法律要求的遵循情况。事实上，描述某些人群的数据集特征可能会随时间推移发生显著的数据分布漂移。这意味着模型输入和输出之间的关系由于外部因素发生了变化，例如，患者特征与肾移植生存概率之间的关系可能会因为医学创新而改变。这种漂移可能会影响医学和伦理方面。因此，它们可能导致\
  \ DL 模型性能的下降（例如精度下降^(37))以及伦理风险缓解的下降，例如隐私保护下降或公平性下降。这种监控是关重要的，因为根据评估结果，`部署者`可能需要重新训练模型。\n\
  \n### 4.4 使用阶段\n\n\n\n\n\n对于直接与终端用户交互的深度学习（DL）应用，用户应该意识到这并非与人类的互动。用户还应该被告知并意识到在使用该应用所可能产生的伦理和法律风险。例如，用户应该有机会了解，用于预测的数据是否被存储和/或通过持续学习技术用于更新学习模型。\n\
  \n## 5. 相关的欧盟立法\n\n欧盟委员会在其人工智能的白皮书中概述了其在监管方面的政策目标。文中经常提到医疗保健领域的 AI 应用，特别是欧盟委员会强调了其监管重点将放在高风险\
  \ AI 应用上，明确将医疗保健领域的 AI 应用列为高风险示例之一。\n\n### 5.1. 欧盟医疗器械\n\n根据欧盟法律，用于医疗器械的软件需要满足某些要求以符合`欧盟医疗器械法规》(MDR)。在本节中，我们指的是\
  \ MDR 的法律规则。MDR 的首项创新是，制造商拟用于医疗目的的所有软件在其框架下都被视为医疗器械。这意味着用于医疗健康的深度学习应用也被视为医疗器械，并受相同的监管限制。特别是符合医疗器械定义的软件，涵盖所有为以下目的开发的应用程序：\n\
  \n- 疾病的诊断、预防、监测、预测、预后、治疗或缓解；\n- 损伤或残疾的诊断、监测、治疗、缓解或补偿；\n- 对解剖结构或生理或病理过程或状态的调查、替换或修改；\n\
  - 通过对人体标本（包括器官、血液和组织捐赠）进行*体外*检查提供信息。\n\n然而，法规规定，通用目的的软件（即使在医疗保健环境中使用）或用于生活方式和健康的目的软件不属于医疗器械。一个明确的例子是：追踪生命体征（如血压、心率、氧饱和度）并提供生活方式和睡眠习惯建议的可穿戴设备；与之相对的是执行相同任务和功能且开发方式相同但用于上述医疗用途的设备。后者受\
  \ MDR 法律和安全规则限制，而前者不是（即使它们是由相同的数据集和方法创建的）。\n\nMDR 附件一“通用安全和性能要求”要求此类软件：\n\n```\n\
  其设计应确保其与其预期用途相符的重复性、可靠性和性能。发生单故障状况时，应采取适当措施，尽可能消除或减少随后的风险或性能损害。\n```\n\n此外，该法规要求提供一份包含测试设计详细信息、完整测试或研究方案、数据分析方法的文档，以及数据摘要和测试结论。特别是，法规提到了需要关于稳定性、性能和安全性的信息。这些要求保证了医疗器械监测系统中的问责制。此外，根据这些信息和特征，MDR\
  \ 将医疗器械分为不同的类别（类别越高，风险越大）：\n\n- `Class I`: 低风险\n- `Class IIa`: 中低风险\n- `Class IIb`:\
  \ 中高风险\n- `Class III`: 高风险\n\n通常情况下，软件被归类为 `Class I`。然而，旨在提供用于具有治疗目的决策信息的软件，以及用于监测生理过程的软件被归类为\
  \ `Class IIa`。最后，如果此类决策的影响可能导致人体健康严重恶化或死亡，则被归类为 `Class IIb`。如果所监测生理参数的性质可能导致患者面临立即危险，则被归类为\
  \ `Class III`。\n\n由此可见，考虑到所开发的医疗器械的预期用途及其稳定性、性能和安全性至关重要。这些确实是获得和维持市场准入以及调查缺陷设备责任所需的风险-收益分析的基础。\n\
  \n### 5.2. 医疗器械故障\n\n医疗器械故障的法律定义必须通过 MDR 和《产品责任指令》（第 6 条，理事会指令 85/374）给出的两个定义进行协调。MDR\
  \ 将“缺陷”（第 2 条第 59 项）定义为调查设备在身份、质量、耐用性、可靠性、安全或性能方面的任何不足，包括故障、使用错误或制造商提供的信息不足；而根据《产品责任指令》，如果产品在考虑到所有情况的情况下未能提供人们有权期待的安全，则该产品存在缺陷，包括：\n\
  \n- (a) 产品的呈现；\n- (b) 合理预期产品可能被使用的用途；\n- (c) 产品投入流通的时间。\n\n在发生故障的情况下，现行的欧盟缺陷产品责任立法（85/374/EEC\
  \ 指令）规定，如果缺陷产品对消费者或其财产造成任何物理损害，生产者必须提供赔偿，无论其是否存在过失或错误。因此，医疗器械的生产者是消费者受到损害时应当负责的主体。\n\
  \n然而，在涉及深度学习的医疗器械情况下，如果设备制造商和开发者不是同一个人，可能很难确定缺陷的来源并追究其责任。请注意，原则上，包含更多组件的复杂设备的制造商通常被认为是缺陷产品的唯一责任实体。对于机器学习组件构成实物货物大部分内容的产品，目前关于这种责任分配的讨论正在进行。最后，请注意，医疗器械要求的安全水平很高。因此，稳定性、性能和安全信息对于开发者而言尤为相关，因为对性能不足的引用扩大了缺陷设备的概念。\n\
  \n\n\n\n尽管欧盟的医疗设备法律仍完全适用于深度学习（DL）驱动的设备，但欧盟委员会希望更新其中某些法律，使其易于执行，并避免不同欧盟国家之间对软件和基于软件的设备采取不同的对待方式。这一意图在欧盟人工智能白皮书中已明确说明。即使健康相关的深度学习应用不属于医疗设备的定义范围，其他相关法律仍然适用。例如，考虑在“不具代表性的健康数据”上训练的深度学习应用案例，即包含仅描述特定种族群特征、且在特定族群之外无法良好泛化的数据。如果此类应用的范畴仍处于受保护领域内，则《欧盟种族平等指令》可能适用于此类应用。白皮书中也直接提到了训练数据集应该具有足够的代表性。另一个健康相关的例子是，如果一个深度学习模型对患有糖尿病等慢性病或患有神经性厌食症等精神疾病的消费者提供了错误的饮食建议，则《不公平商业惯例指令》和《消费者权利指令》可能适用。同样，《产品责任指令》也适用，尽管对于非医疗设备的健康相关产品而言，“缺陷”的概念范围可能较小。再次注意，监管程度较少的基于机器学习的产品可能在潜在的不伦理用途上处于更高的“滑坡”边缘。\n\
  \n### 5.3. GDPR 下的健康数据处理\n\nGDPR 对机器学习（ML）活动产生了重大的——负面的——实际影响。首先，在欧盟，数据保护基本权利与隐私权并行。值得注意的是，在《欧盟基本权利章程》中，个人数据保护（第\
  \ 8 条）与隐私权（第 7 条）并不重合。GDPR 中的隐私和数据保护概念与“个人数据”和“处理”（第 4 条第 1、第 2 款）的概念直接相关，并相较于之前的欧盟规则进行了扩展。\n\
  \n`Personal data` 指任何与已识别或可识别的自然人（“数据主体”）有关的信息；可识别的自然人是指能够直接或间接被识别的人，特别是通过参考如名称、识别码、位置数据、在线标识符或特定于自然人的物理、生理、遗传、精神、经济、文化或社会身份的一个或多个因素来识别的人。\n\
  \n这一定义增加了客观的“标识符”（位置数据、名称），这些标识与主观/个人的“因素”混合，并将“遗传身份”与物理、生理、精神、经济、文化或社会因素相关，从而增加了受研究影响的视为个人数据的数据范围，特别是在机器学习这种数据密集型研究的情况下。\n\
  \n`Processing` 指对个人数据或个人数据集执行的任何操作或一系列操作，无论是否通过自动化手段，例如收集、记录、组织、结构化、存储、改编、检索、使用、通过传输披露、提供、限制、删除或破坏。因此，机器学习中几乎所有形式的处理都在保护权利范围内。从现在起，我们将确定个人数据处理法律依据（第\
  \ 6 条和第 9 条）以及法律允许处理的情景。\n\n数据未匿名的情况下，GDPR 要求任何处理都具有法律依据。我们将确定机器学习中处理个人数据的不同可能法律依据（第\
  \ 6 条和第 9 条）。\n\n#### 同意\n\n数据主体的同意虽然有时会产生问题，但一直是研究领域非常重要的法律依据。它是数据主体任何自愿、特定、知情且明确的意愿表示（GDPR\
  \ 第 4.11 条），通过该表示，数据主体接受对个人数据的处理。必须为了一个或多个特定目的（第 6 条 (1)(a)）而给出。GDPR 的这一通用要求对于数据密集型活动和机器学习内部的数据重用是有挑战的。然而，同意并不总是合适的法律依据；它可能是一个问题，因为\
  \ (a) 同意随时可以撤回（第 7 条第 3 款），并且在没有其他合法法律依据的情况下，(b) 撤回同意后的任何进一步处理都是非法的，(c) 要求立即删除个人数据（`欧洲数据保护委员会`）。\n\
  \n因此，有必要验证活动本身与同意的范围和目标相符，并符合同意的要求（第 7 条）。序言 33 有助于在科学研究背景下增加同意的灵活性。其实际结果似乎是宽泛共识公式在可能重用的情况下具有合法性，前提是\
  \ (a) 它们涵盖了特定的研究领域且 (b) 尊重了相关的伦理标准。对于敏感数据，第 9 条将同意作为一种法律依据，同时也包含了其他替代法律依据。注意，撤回同意后的数据删除会影响已开发的模型、实施的训练以及所做的技术选择。因此，需要对机器学习生命周期的整个开发和部署阶段进行相应的审查，并考虑到对隐私、偏差和公平性的评估也应受到影响。\n\
  \n\n\n\n\n**特殊类别的个人数据：** 鉴于这些困难，健康领域机器学习（ML）数据处理的其他法律依据可能更为合适。例如，第 9(2)(h) 和 (i)\
  \ 条允许在健康研究中使用不经当事人同意的特殊类别的个人数据，但前提是法律提供了例外，且尊重了数据保护权的本质。\n\n**公共利益和合法利益：** 《通用数据保护条例》（GDPR）第\
  \ 9 条规定，欧盟或成员国法律可以提供替代的法律依据，例如公共利益（第 6(1)(e) 条）和持有者的合法利益（第 6(1)(f) 条）。然而，要依赖公共利益，必须在成员国或欧盟找到法定依据，机器学习开发人员需要查明这些依据。\n\
  \n### 5.3.1. 进一步处理\n\n机器学习的一个核心问题是合法的进一步处理，因此涉及到个人数据的重用。在这方面，我们需要区分两种场景：\n\n**研究背景：**\
  \ 第 5.1(b) 条明确规定，为了科学或历史研究或统计目的而对个人数据进行进一步处理，如果符合放宽了某些限制的第 89(1) 条，则与初始目的兼容。进一步阐述，因此允许对研究存在“非不兼容”的假设。为了从中受益，必须遵守第\
  \ 89 条和序言 156 中规定的保护措施，包括证明无法使用匿名数据。\n\n**非研究背景：** 如果机器学习（ML）处理中的进一步处理不是为了研究目的，则不存在与原始处理的兼容性假设。开发者必须积极地评估（以一种为了满足问责制目的而可证明的方式）执行第\
  \ 6.4 条的规定。\n\n## 6. 深度学习中偏见、公平性、可解释性和隐私的技术关注\n\n### 6.1. 数据中的偏差\n\n医疗健康数据可能包含某些偏差，这些偏差可能会影响模型预测准确之外之外性能。这些偏差通常是由于队列多样性缺乏导致的，而这种缺乏可能源于技术和非技术原因。导致队列多样性缺乏的技术原因如下：\n\
  \n- **临床研究排除标准：** 当用于训练深度学习（DL）模型的数据是为了特定的目标人群研究而收集时，就会发生这种情况，例如某些研究仅关注成年人。\n- **数据收集设计不当：**\
  \ 这通常适用于任何情况，即用于训练、验证和测试模型的人口未能反映模型将部署的临床环境的目标人群。这种不匹配可能会产生广泛的偏差。虽然所有这些偏差的完整列表不在本章的范围内，但主要的偏差包括：`时间偏差`^(37)（模型开发时间与部署时间之间存在概念漂移）、`地理偏差`（模型仅使用单中心数据开发）、`由于混杂变量或遗漏变量导致的偏差`（例如，缺少某个变量如治疗的侵略性，可能会误导模型错误地将高风险患者归类为低风险患者），^(42)\
  \ 以及 `谱偏差`（用于开发模型的数据集的人口未能真实代表目标人群疾病状态的光谱——严重程度、阶段等）。(([31)\n- **为其他目的收集的数据的次级使用：**\
  \ 这种做法的一个示例是在深度学习（DL）应用中使用 `ICD`（国际疾病分类）代码进行预测性诊断。这些代码最初旨在计费目的，可能无法准确描述患者的真实健康状况。(([43)\n\
  - **缺乏高质量的人工标注：** 这可能由于两个原因：第一个是所用数据集总体质量较低，第二个是医疗健康数据的特殊性。问题源于不同医生可能对同一患者给出不同的诊断。此外，有时由于缺乏高质量标注可能反映出缺乏知识：例如在败血症预测中，没有共认的定义。(([44)\n\
  \n非技术原因源于临床研究对某些人群的历史性排除^(40)) ^(45) 以及人类偏见和歧视在数据集中的。这两个方面与非歧视的基本权利以及相关的欧盟指南有关。多样性、非歧视和公平性的要求规定，训练数据应包含所有易感群体。文献中的几个示例展示了偏见如何影响结果。例如，Sayyed-Kalantari\
  \ 等人^(45) 研究了用于胸部 X 光片分配诊断的先进卷积神经网络（CNN）的偏差。他们在三个不同的大型数据集上训练了 `CNN`，显示对女性、少数裔和低社会地位人群的漏诊率持续较高。\n\
  \n尽管公平性研究通常关注法律保护群体，但如果忽视医疗健康中其他形式的偏差仍是有的。例如，事实许多医疗提供者对肥胖者持有强烈偏见。这种态度影响了提供的护理质量和治疗的健康结果。(([47)即使体重偏差尚未受到监管，如果由机器学习应用秘密实施，仍可能非常有害。最后，重要的是，移除敏感特征并不防止歧视，因为可能存在与其他敏感特征相关的特征。我们在\
  \ 6.2 中说明了减轻已知偏差的一些技术。\n\n### 6.2. 公平性\n\n公平性概念与歧视^(9) 和偏见^(48) 概念紧密相关，因为正如 6.1\
  \ 中所示，不公平的深度学习（DL）结果可能源于训练数据中的人类偏见和现有的人口不平等。解决算法公平问题的建议已经在计算机科学、经济学、哲学和组织心理学等不同领域提出。(([49)然而，这些答案是碎片化的，对问题提供了部分解决方案。要么其技术本质倾向于忽略决策的社会背景，要么它们不关注公平决策的规范性方面。\n\
  \n\n\n\n\n无论如何，为了反对歧视并实现公平，首先必须定义`fairness`（公平性）的概念。在文献中，对公平有不同的定义；这是因为公平问题可以从不同的视角来看，而且定义很大程度上取决于不同文化之间的现有差异。^(50,\
  \ ^(51) 因此，要找到一个适用于所有不同公平概念的单一定义是困难的。公平定义的高层分类如下：\n\n• `Individual fairness`（个体公平），涉及要求对相似个体进行相似对待的定义；\n\
  - `Group fairness`（群体公平），涉及要求对受保护群体和非保护群体进行相似对待的定义。\n\n机器学习（ML）公平性研究主要有两个方向：第一条研究用于审计\
  \ ML 模型以发现歧视的方法，通常通过调查决策如何在在敏感变量上存在差异社会群体之间变化的。^(49, ^(52) 第二条研究如何将公平性嵌入到 ML 模型的设计中（`fairness-by-design`）。下文中，我们将重点讨论最后这一研究方向。\n\
  \n### 设计公平方法（Fairness-by-design approach）\n\n将公平性嵌入 ML 的可以分类为：通过关注训练数据变换来实现公平的方法，以及通过作用\
  \ ML 算法来实现公平的方法。\n\n- `Debiasing training data`（训练数据去偏）：第一类涉及修改训练数据分布的方法，通过根据实例的组身份分配不同权重，或从每个组中进行仔细采样，来改变决策边界附近选取实例的类别标签。^(53)\
  \ 主要目标是平衡训练数据中的受保护群体和未受保护群体。\n- `Reformulation of the classification problem`（分类问题的重构）：第二类方法通过将公平（或非歧视）要求`by\
  \ design`纳入模型来重构分类任务。公平目标被考虑整个模型的目标函数中。这种正则化还需要特征级的注释，以指定输入中的每个特征是否与受保护属性相关。^(54)\
  \ 另一种方法利用对抗训练从深度神经网络的中间表示中消除关于受保护属性的信息。^(55) 通常，这些方法基于预测器和对抗分类器的同时学习。后者的作用是最小化预测器正确分类受保护属性的能力。\n\
  \n另一条尚未充分研究的研究方向涉及隐私与公平之间的关系。即使数据得到了保护，基于 ML 的决策系统所获得的预测和分类也可能导致人们被分类，并可能推导出其他隐私信息。此外，这种分类可能导致不公平的歧视和对待，由于大多数\
  \ ML 模型具有不透明性，往往很难理解其原因。因此，人们可能倾向于自己提供数据以确保更公平的决策。在科学文献中，只有极少数工作解决了开发既提供隐私保护又能提供公平保障的数据挖掘和\
  \ ML 模型挑战。^(56, ^(57)\n\n我们强调，尽管有大量研究人员研究了 ML 中的公平问题，但关于什么是最先进的方法仍然没有结论性的结果。正如 Ntoutsi\
  \ 等人所讨论的，(48) 对现有方法进行系统性评估对于理解它们的潜力和局限性是强制性的。然而，我们强调，由于导致方法设计和开发的公平定义的异构性，进行比较性评估是困难的。^(51)\n\
  \n### 6.3 可解释与可说明人工智能（Interpretable and explainable AI）\n\n理解 AI 决策支持系统背后推理的需求（即`explicability`）被列为欧盟可信\
  \ AI 指南四个伦理必要准则之一。这一原则与`透明度要求`密切相连。大多数先进的 AI 模型是不透明的，通常被称为`黑箱`。一个 AI 系统可能被认为是黑箱的原因有两个：\n\
  \n1. AI 系统基于复杂的 ML 模型，其结果无法通过查看其内部参数来理解和解释。在这种情况下，透明性的缺乏反映了对模型内部表示缺乏知识或理解。\n2. AI\
  \ 系统基于专有软件。模型的源代码、规范以及用于训练它的数据是不可用的。在这种情况下，透明性的缺乏可能与 ML 模型本身的特性无关。\n\n我们现在关注第一种情况。深度学习（DL）模型属于第一类黑箱，因为其分层结构日益增加的复杂性对于人类来说并不是直观可解释的。一些\
  \ ML 研究人员将医疗保健领域 DL 应用的黑箱推理与许多医生的黑箱推理进行比较，声称无法解释导致医生做出诊断的所有因素。然而，能够向患者解释临床决策并对其诊断的负面结果负责，是每位医生的关键伦理责任。达到\
  \ GDPR 要求和欧盟指南建议的透明度水平有两种方法。第一种方法是避免使用黑箱，转而使用内在可解释的模型；第二种方法是应用可解释 AI 领域的技术。\n\n\n\
  \n\n\n## 医疗保健的可解释模型\n\n说一个模型具有可解释性，意味着它能够以人类可以理解的术语进行解释或呈现。在这种语境下，如果用户能够理解并解释输入是如何在数学上映射到输出的，我们就说该模型是可解释的。在文献中，少数模型被认为具有内在的可解释性：线性模型、决策树和规则。深度学习（DL）模型通常优于这些内在可解释的模型，因为它们能够捕捉变量之间高度非线性的关系，而不需要特征工程，从而以更少的努力获得更高的准确率。然而，在医疗保健领域存在一些高性能的可解释模型示例。例如，Caruana\
  \ *等人* 使用带有成对交互的广义加性模型（`GAM`）来预测肺炎风险和医院 30 天内再次入院率，生成了高性能的可解释模型。由于 `GAM` 允许将单个及成对特征与结果之间的交互可视化，作者能够识别出用于训练算法的真实数据集中存在危险的遗漏变量偏差。具体而言，该模型将哮喘患者分类为肺炎并发症死亡风险较低，是因为数据集中没有包含这些患者所接受治疗类型的信息。这进一步凸显了在医疗应用中使用黑盒模型的危险性，因为它们不允许对模型所学习的偏差进行此类探索。此外，Rudin\
  \ 在她的工作中声称准确率与可解释性之间的权衡是一个神话。这一观点基于这样一个事实：数据科学是一个迭代过程，涉及到问题定义、数据分析和建模之间的多次往返。在这一知识发现过程中，更容易找到良好的数据表示，使得简单的模型能够达到与黑盒模型相当的性能。\n\
  \n## 可解释人工智能\n\n可解释人工智能（XAI）是机器学习（ML）的一个子领域，研究如何以人类可理解的术语解释黑盒模型解决任务时所使用的逻辑的技术。如果无法为当前任务开发出高性能的透明模型，或者无法理解第二类黑盒（专有软件）背后的推理，这些技术就尤为有用。在过去的几年里，与该领域的学术文献激增，对所有适用于\
  \ DL 技术进行全面综述超出了本节的范围。然而，我们在此列出了一些用于医疗保健领域 DL 应用的相关 XAI 技术示例。解释医学 DL 应用最常用的技术之一是使用注意力权重作为模型行为的解释。然而，最近的研究强调了这种解释可能缺乏一致性，且不应被用作解释。另一种解释黑盒决策的方法是通过使用内在可解释的代理模型（如线性模型或决策树），该模型能够模拟其局部或全局行为。在\
  \ XAI 的海量文献中，一个新兴趋势可能对医疗保健应用特别相关：在解释过程中使用医学本体论。通常情况下，在决定应用于 DL 模型的 XAI 技术时，考虑考虑的几个维度是重要的。首先，考虑我们系统的功能性需求是重要的。例如，模型在使用什么类型的数据（表格、图像、序列）？它在解决什么类型的问题（分类、回归）？我们正在使用什么样的模型架构？根据这些问题的答案，我们可以过滤掉由于技术原因无法应用于我们模型的\
  \ XAI 方法。其次，从用户为中心的视角决定我们想要提供什么类型的解释也是重要的。我们应用程序的终端用户是谁？我们在回答这些问题时，应该考虑到信赖人工智能对“人类能动性和监督”的首要要求。最终终端用户所需的解释类型随其专业知识而异。例如，考虑一种旨在为医生就特定患者提供最佳药物建议的\
  \ DL 应用。在这种情况下，终端用户是医生，因此，提供的解释不应要求具备大量的机器学习知识即可理解。然而，最近一项关于部署中使用 XAI 技术的研究发现，此类方法的大多数用户是将其作为调试工具的机器学习工程师。因此，需要进一步的研究来弥补当前解释技术与真实临床场景之间的差距。\n\
  \n## 6.4. 隐私\n\n医疗保健数据是最敏感的数据类型之一；因此，它们通常是被隔离的，其深度分析的潜力也有限。此外，美国的 HIPAA 和欧洲的 GDPR\
  \ 限制了健康数据的访问。在遵守数据保护法规的同时从此类数据中学习面临着某些挑战。在这样一个敏感背景下，应用由 Ann Cavoukian 在 20 世纪 90\
  \ 年代提出的并由 Monreale *等人* 继完善的“隐私设计”原则是强制性的。其核心思想是将隐私需求写入知识发现的设计中，以平衡隐私保护和数据效用。这一目标在任何任务中都很重要，但在医疗领域至关重要，因为数据和模型质量往往会因为保护技术而降低，应尽可能保留，以避免对患者产生负面影响。在\
  \ DL 中，隐私风险可能出现在两个不同阶段：在深度学习系统的开发阶段，因为模型的训练阶段需要访问数据，这些数据必须经过匿名化以防止患者被重新识别；以及在部署阶段，当模型被用于预测或分类新的未知实例时。在本章中，我们的讨论重点是预测模型的隐私攻击以及相应的缓解技术。\n\
  \n\n\n\n在`deployment stage`（部署阶段），如果攻击者能够推导出 ML 模型训练数据中代表的`specific individuals`（特定个人）的敏感信息，就会发生`privacy\
  \ breach`（隐私泄露）。某些 ML 算法生成的模型显式存储了表示学习阶段数据的特征向量。如果不考虑针对`reconstruction attacks`（重构攻击）的保护策略，应该避免此类模型（例如\
  \ `SVM`）。这类攻击旨在通过访问模型并利用特征向量的`a 验`知识来重构原始隐私数据。然而，即使在学习的模型中没有存储显式的特征向量（例如神经网络），也可能出现此类隐私问题。在这种情况下，我们有两种不同的攻击设置：攻击者可以访问\
  \ ML 模型及其参数，或者攻击者只能查询模型而无法访问它。\n\n这两种攻击模型可以在这些设置下发挥作用：`model inversion attacks`（模型反转攻击）和`membership\
  \ attacks`（成员攻击）。在前者，攻击者的目标是通过已知一组特征并观察查询模型的输出，来推断学习阶段使用的某些敏感特征。然而，这种攻击并不意味着对训练数据中代表的特定个人的隐私泄露，但它允许攻击者推断关于特定群体的敏感信息。例如，Fredrikson\
  \ *et al.*^(74) 在分析药理遗传学的案例中显示，作为模型反转攻击，无需访问预测模型而仅通过查询，就能学习有关个人的敏感基因组信息。特别是，该模型能够检测患者基因型与药物剂量之间的相关性。在这种背景下，显而易见，这种相关性不仅适用于特定个人，而且是`所有`患者的科学事实。此外，这种相关性对于未包含在学习\
  \ ML 训练数据中的患者也是有效的。McSherry^(75) 观察到，如果模型基于特定群体的统计数据，很难避免这种集体的`breach`（泄露）。这是因为，给定一个记录和一个模型，无论该记录是否被用于训练模型，模型反转攻击提供的结果都是相同的。研究人员已经提出了了先进的模型反转攻击，以分别在集中式学习设置^(76)和协作学习设置^(77)中从深度神经网络中恢复图像。\n\
  \n推断某个个人记录是否存在于 ML 模型训练数据中的攻击是`membership inference attack`（成员推断攻击）。^(78) 这种攻击会直接导致隐私泄露，因为例如，知道某患者出现在与特定疾病相关的\
  \ ML 模型训练数据中，可能会揭示所分析的个体患有该疾病。这种攻击的典型假设是，攻击者的已知信息是个人的记录，且攻击者只能查询 ML 模型并接收模型的输出。成员推断攻击利用\
  \ ML 来攻击 ML 模型。具体而言，它是基于学习一个 ML 模型，该模型能够区分目标模型在训练输入上的行为与其在不包含在训练数据输入上的行为。\n\n其核心思想是创建多个`shadow\
  \ models`（影子模型），即模仿目标模型行为的 ML 模型。通过使用这些模型，可以构建一个分类器来区分输入是否属于训练集。成员推断攻击利用 ML 来攻击\
  \ ML 模型。具体而言，它是基于学习一个 ML 模型，该模型能够区分目标模型在训练输入上的行为与其在不包含在训练数据的输入上的行为。\n\n大多数针对深度学习（DL）的隐私保护技术都集中在`differential\
  \ privacy`（差分隐私），以保护目标模型在训练输入上的行为不受其在不包含在训练数据的输入上的行为的影响。核心思想是创建多个`shadow models`（影子模型），即模仿目标模型行为的\
  \ ML 模型。通过使用这些模型，可以构建一个分类器来区分输入是否属于训练集。\n\n`Differential privacy`（差分隐私）在防止成员推断攻击和限制隐私泄露方面特别有效。`Differential\
  \ privacy`^(79) 要求数据中是否存在某记录不会显著影响结果。它确保了从数据中学习到的任何内容都不是由于该记录的参与。参数 `ϵ` 是隐私预算，控制模型准确性与隐私损失之间的平衡。较小的\
  \ `ϵ`意味着噪声越大、隐私越强。差分隐私的一个基本概念是函数 `f` 的全局敏感性，它有助于确定模型的效用。实现差分隐私的技术基于输入的随机化。某些方法首先在原始数据上学习一个模型，然后使用指数机制或拉普拉斯机制生成一个带噪声的模型。例如，Arachchige\
  \ *et al.*^(80) 提出应用本地差分隐私算法来重新设计卷积神经网络（CNN）的训练过程。具体而言，CNN 架构分为三层：（1）卷积模块，（2）随机化模块和（3）全连接模块。Abadi\
  \ *et al.*^(81) 则开发了一种实现差分隐私的 DP 深度学习系统，通过修改梯度下降算法，在每次迭代中添加高斯噪声。Shokry *et al.*^(82)\
  \ 提出将差分隐私保护与分布式多方学习机制相结合，用于在不共享输入数据集的情况下进行神经网络。他们并行了基于梯度下降优化算法的学习过程。每个参与方与其他方共享本地模型参数子集以减少通信成本，并通过向截断权重中插入噪声值来实现差分隐私。缺点是，总隐私预算取决于参数的数量，而在深度学习模型中参数数量可能达到数万个。Zhao\
  \ *et al.*^(83) 解决了类似的问题，但他们不是直接向梯度注入噪声，而是应用泛函机制来扰动神经网络的目标函数，并通过最小化扰动后的目标函数来获取清洗后的参数。\n\
  \n\n\n\n得益于日益有效的深度学习模型，AI 系统具有了改进医疗健康领域的能力。在本章中，我们讨论了在医疗健康领域开发和部署此类应用时所涉及的伦理和法律影响，这从伦理角度来看至关重要。我们概述了全球范围内\
  \ AI 伦理的不同处理方法，并将一些伦理价值映射到 `ML` 开发生命周期的不同阶段。此外，我们分析了关于在深度学习（DL）系统中植入隐私、公平性和可解释性等伦理价值的不同方法的文献。\n\
  \n我们从法律、伦理和技术方面的分析凸显了一些重要的挑战和问题。首先，全球范围内 AI 伦理的方法具有深度的异质性。在全球化时代，这可能成为此类技术监管协调一致的障碍，反过来导致全球市场的碎片化。此外，这可能会损害人们对基于\
  \ AI 的系统的信任，并减缓其在现实临床场景中的采用。通常，这些不同的 AI 伦理方法取决于文化差异，这也会影响某些价值的定义，例如 `fairness`（公平性），它是全球范围内最难被定义的伦理价值之一。\n\
  \n其次，我们对技术解决方案的分析表明，大多数方案仅旨在解决某一个特定的伦理问题。目前还没有一种解决方案能够整体方法将隐私、公平性和可解释性等多个价值整合在一起。我们认为，研究不同价值之间的相互作用可能对开发以人为本的\
  \ AI 系统是有益的。\n\n最后，我们的技术分析强调了，人类因素既在数据中经常发现的偏见中表现过于突出，又与决策过程过于遥远。未来的研究应该聚焦于在 AI\
  \ 和人类因素之间找到正确的平衡，以增强它们的互补优势，并让 AI 技术充分发挥其受益潜力。\n\n## 参考文献\n\n1. E. Gibson, W. Li,\
