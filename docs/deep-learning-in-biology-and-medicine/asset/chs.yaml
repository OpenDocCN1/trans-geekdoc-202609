  \n\n\n\n地球上的生命受复杂的相互作用系统的调控。通过网络范式对这些相互作用进行建模，研究人员能够发现并理解驱动生物过程导致人类疾病的根本分子机制。测序技术的进步产生了日益大量的生物数据。上述前提为深度学习方法的蓬勃发展提供了基础，这些方法能够应对该领域的复杂性和数据丰丰富性。基于这些原因，本章全面概述了关注生物、医学和药理学关键研究问题的深度学习网络方法的最新进展。首先，介绍了所需的生物学和网络科学背景。其次，提供了对生物网络和资源的全面概述。最后，我们讨论了该领域的最新方法，并将其分为三大类：相互作用组、网络药理学和前沿生物问题。\n\
  \n## 1. 引言\n\n过去几十年的特点是高通量技术的进步，例如酵母两杂杂交筛选和下一代测序。这些技术的进步促进了大型组学数据集（即分子数据）的创建，这有助于人们揭示和理解生物所有子部分之间复杂的相互连接。\n\
  \n在此背景下，研究人员需要新的“整体”工具来应对生物数据的维度和复杂性。正如我们所看到的，对这种需求的响应是网络形式化提供的建模。生物网络（如蛋白质-蛋白质相互作用网络）是“组学”数据的新表示形式，结合了网络科学和生物学方法来分析生物过程的相互连接。对生物网络结构的功能的研究被称为网络生物学或系统生物学。对生物网络中致病行为和药物过程的研究被称为网络医学。系统生物学和网络医学是实现以下点的关键：(i)\
  \ 理解生物机制和 (ii) 解决诊断和治疗方面的挑战。研究文献已通过大量的图挖掘和经典机器学习方法研究了生物网络。然而，深入研究跨越有机组织层次的分子相互连接的复杂性具有挑战性。为了克服这些局限性，研究人员正在网络生物学和网络医学中采用新的强大策略。在生物学中引入深度学习技术允许我们探索潜在机制，并理清标准方法无法处理复杂分子相互连接。最近，图挖掘中具有前景的深度学习方法（如图卷积网络\
  \ GCN）已成功应用于生物网络以解决问题，例如药物重用和新疾病基因的鉴定。\n\n本章讨论了应用于网络生物学和网络医学的深度学习网络方法。本章结构如下：[第\
  \ 2 节] 提供了关于网络理论的基础知识（[第 2.1 节]）、网络上的学习问题（[第 2.2 节]）和系统生物学的基础概念（[第 2.3 节]）。[第 3\
  \ 节] 以形式化的描述了最重要的生物网络（[第 3.1 节]）和可用资源（[第 3.2 节]）。在[第 4]-[6 节]中，介绍了最新的基于深度学习的方法——根据所解决的问题和使用的数据进行组织。最后，[第\
  \ 7 节]讨论了未来方向和总结。\n\n## 2. 背景知识\n\n在本节中，对与网络生物学关键方面进行了全面总结。具体来说，在[第 2.1 节]中简要介绍了基本的网络概念。[第\
  \ 2.2 节]描述了网络科学中的学习/预测问题。最后，在[第 2.3 节]中总结了最重要的生物概念。\n\n## 2.1. 网络背景和形式化\n\n在本节中，我们总结了网络生物学中最有用的网络概念和属性：\n\
  \n**网络：** 简单网络或图是一种数学形式化，允许以抽象和简洁的方式描述系统的组件及其相互作用。从形式上，图 `G = (V, E)` 定义为包含两个集合\
  \ `V` 和 `E` 的元组。`V` 是称为图节点或顶点的对象集合。边集 ![](img/in199_1.jpg) 包含了系统对象之间的关系。边——也称为链接或连接——可以是`有向`的或`无向`的。\n\
  \n`有向`边对于描述非对称关系是必要的。节点 `i` 和 `j` 之间存在关系并不意味着节点 `j` 和 `i` 之间存在相同的关系。相反，`无向`情况意味着系统中的关系是对称的。没有必要区分节点\
  \ `i` 和 `j` 之间的关系与从节点 `j` 到 `i` 的关系。收集每个关系`重要`之间的差异对于定义权重函数 ![](img/in200_1.jpg)\
  \ 非常有用，该函数根据系统的语义返回边的值。当定义权重函数时，我们称该图为`加权`图。每个简单图（二元图）都由一个大小为 `|V|× |V|` 的方矩阵 `A`（称为邻接矩阵）描述，其中元素\
  \ `A[ij]` 在存在从顶点 `i` 到 `j` 的边时包含 1，否则为 0。当定义权重函数 `w(e)` 时，邻接矩阵的元素 `A[ij]` 等于权重函数\
  \ `w(i, j)` 的值，否则为 0。简单二元图和加权有向图的图形表示如图 [1] 所示。\n\n![](img/fig7_1.jpg)\n\n图 1. 若干类型简单网络的示例。\n\
  \n`复杂系统`或异构网络——其中不同信息与系统组件相关，并且存在多种关系——可以用许多方式进行建模。它们可以被建模为在边和顶点上具有分类和数值属性的修饰图。为了在图中编码这些信息，定义了多个（每个属性一个）映射函数。稍后，我们将此类类型的图称为带有`属性`的图。\n\
  \n`二分`图包含两种不同类型的顶点，同一集合内的任意两个顶点之间是不相邻的。二分图 `G = (V, U, E)` 定义为包含三个集合 `V`、`U` 和 `E`\
  \ 的三元组。`V` 和 `U` 是两个不交的顶点集合 ![](img/in200_2.jpg)。边集 ![](img/in200_3.jpg) 包含了不同类型顶点之间的关系。二分图是\
  \ `k`-部分图的特例，其中 `k` = 2。\n\n**其他重要的网络概念和属性：**\n\n**度：** 节点的度是节点边的数量（在有向情况下为入边和/或出边）。\n\
  \n\n\n\n### 路径/直径（Path/diameter）：路径（或游走）是节点序列，其中每个节点都与序列中的下一个节点相邻。直径是任意两个节点之间最长路径。\n\
  \n### 枢纽（Hub）：枢纽是指度度高于网络平均度度的节点（通常，在有向图中，这是一个仅考虑出度时进行分析的属性）。\n\n### 连通图（Connected\
  \ graph）：如果图中任意两个节点之间都存在路径，则该图是强连通的。\n\n### 诱导子图（Induced sub-graph）：诱导子图 `H` 是包含\
  \ `V` 的节点子集以及它们之间所有边的图。令 `G` 为初始图；`H = (V[H] ⊆ V, E[H] = {(u, v) | u, v ∈ V[H] and\
  \ (u, v) ∈ E})`。\n\n### 基序（Motif）：基序是一种反复出现且在统计上具有显著意义的部分子图。请注意，基序与图元（graphlets）不同，因为后者可以是部分子图，而基序是诱导子图。\n\
  \n### 社区（Community）：“社区”的定义可能根据应用领域而变化。从网络角度来看，社区通常是一个局部密密的子图，其中社区内部节点之间的边缘密度高于内部节点与外部节点之间的边缘密度。\n\
  \n### 随机网络（Random network）：随机网络是由随机分布概率生成的网络（例如，Erdős–Rényi 模型^(4)）。节点 `v ∈ V` 按照特定的概率\
  \ `p` 连接到网络中的另一个节点。\n\n### 无标度网络（Scale-free network）：无标度网络是指度分布遵循幂律分布的网络^(5)。\n\n\
  ### 小世界网络（Small-world network）：小世界网络是一种网络，其中任意两个节点都通过一条与 `log(|V|)` 成比例的短路径与网络中的其他节点相连^(6)。\n\
  \n## 2.2. 网络上的学习问题 \n\n网络是数学工具，用于研究和预测相关领域中的属性，这些领域但不限于社会行为、经济事件、生物过程、交通流和互联网连接。尽管存在差异，这些领域中的每个应用都可以归结为相同的通用网络预测任务：\n\
  \n### 节点分类（Node classification）：通常使用一个类别来对一组具有相似特征的节点进行分类。这些类别通常由唯一的文本描述，即标签（labels）或标记（tags）。使用已经分类的节点可以训练一个捕捉某些知识的分类器。训练好的分类器可以为未知节点分配类别。例如，我们想学习哪些蛋白质与特定疾病有关。分类任务可以是二分类或多分类（一个给定的数据实例可能分别被分配给一个或多个类）。\n\
  \n### 链路预测（Link prediction）：网络的一个基本问题是，图中的链路信息可能质量存疑或根本不存在。因此，推断节点之间边的存在性被称为链路预测^(7)。链路预测是一个极具挑战性的问题，在不同领域以各种形式已经过研究。链路的预测可以完全基于结构信息（图关联性），也可以基于属性信息。\n\
  \n### 社区检测（Community detection）：社区检测是指识别网络中紧密交互的顶点（即节点）的分组（子图）的过程。\n\n### 表征学习（Representation\
  \ learning）：表征学习是关于推导出输入数据（在我们的设置中为图^(8)）的简洁表示。这种简洁的表示使能够获得更好的性能（分类/预测任务）或降低计算复杂度。存在许多表征学习方法：在深度学习中，表征通常通过输入数据的多个非线性变换（隐藏层）的组合来实现。\n\
  \n## 2.3. 系统生物学的基础概念 \n\n下文中，我们介绍理解本章收集论文所需的辅助生物学概念。请注意，在网络生物学中，以下生物/分子概念通常组织在数据库中，这些数据库在一个地方收集这些信息。有关这些数据库的完整概述，请参见第\
  \ 3.2 节。生物学概念是紧密关联的。我们决定首先介绍最重要的或通用的概念，然后介绍其他所有概念。因此，我们邀请顺序阅读所有章节，以更好地理解所有基础概念。\n\
  \n### 细胞（Cells）：细胞是生物体结构的构建单元。细胞是一个包含 DNA、细胞质、细胞结构（如核糖体）和多种分子（如蛋白质）的结构，所有这些都被一个膜包围。细胞的特化（在功能方面）由基因表达决定。共同工作完成相同功能的细胞集合被称为组织。\n\
  \n### 生物学通路（Biological pathway）：生物通路是细胞内分子（如蛋白质或复合物）之间的一种有序动作序列，导致产物的产生或细胞状态的变化。例如，一条通路可能导致分子的合成、调节基因或刺激细胞移动。最常见的通路类型是代谢通路、基因调节通路和信号转导通路。代谢通路是细胞内发生的一系列化学反应。基因调节通路负责开启和关闭基因。信号转导通路是对细胞外信号激活细胞受体的一系列细胞内分子事件。酶（通常是蛋白质）参与了几乎所有的代谢通路，以加速化学反应。\n\
  \n### 蛋白质（Proteins）：蛋白质是由氨基酸组成的大分子。它们负责细胞内的生物过程。氨基酸序列和所处环境共同决定了蛋白质的三维结构和其特定功能。构建蛋白质氨基酸序列的指令存储在基因中。按照惯例，蛋白质按家族和域进行分类。蛋白质家族是一组具有共同进化起源的蛋白质，反映了相关的功能和/或结构相似性。域是描述蛋白质三维结构结构单元的紧凑方式（负责特定的功能或相互作用）。与蛋白质相关的另一个方面是它们的本体论组织。本体术语（GO-terms）是蛋白质/基因本体概念，组织成三个基本维度：分子活动、细胞结构和生物过程。\n\
  \n### 蛋白质间相互作用（PPI）：PPI 是发生在细胞内两种蛋白质结构区域之间的物理相互作用。PPI 负责生物过程，并可以是永久的，例如蛋白质复合物^(b)，也可以是瞬时的，例如信号传递。PPI\
  \ 对于理解分子生物过程是如何进行的至关重要。\n\n\n\n\n\n### **脱氧核糖核酸 (DNA):** DNA “是一种复杂且具有遗传性的分子，包含了构建和维持生物体所需的所有信息”。所有生物体的每个细胞中都含有一份完整的\
  \ DNA 拷贝。DNA 由称为核苷酸的连接链块组成。每个核苷酸都以四种化学碱基之一为特征：腺嘌呤 (A)、鸟嘌呤 (G)、胞嘧啶 (C) 和胸嘧啶 (T)。这种由约三十亿碱基对组成的有序序列编码了制造蛋白质等必需分子所需的信息。DNA\
  \ 是一个由约三十亿字符组成的字符串，其字母表为 {A, C, G, T}。\n\n### **基因：** 基因是 DNA 的一段（连续子序列），编码功能单元的信息。人类基因组计划估计人类拥有\
  \ 20,000 到 25,000 个基因。DNA 的突变会导致基因产生多种变体，即`等位基因`。存储在基因中的信息——以及 DNA 的部分——有助于调节蛋白质合成背后的机制。\n\
  \n### **基因型与表型：** `基因型` 是生物体基因的集合。`表型`一术是指生物体可观察的特征。表型由基因型、基因表达和环境因素决定。\n\n### **基因/蛋白质命名法：**\
  \ 多个委员会负责基因和蛋白质的命名。尽管付出了标准化努力，但大量的命名法导致了歧义。HUGO 人类基因命名委员会 (`HGNC`) 负责为人类基因分配名称和符号（名称的简短形式）。此外，生物信息学中最流行的命名法是\
  \ `Entrez ID` 和 `Ensembl ID`。`UniProtKB` 完善了命名法概述，还提供了蛋白质异构体的名称。在生物信息学中，`Entrez`\
  \ 和 `UniportKB` 是程序访问最常用的命名法。文献通常采用 HGNC 名称或缩写。\n\n### **基因表达：** 这是合成蛋白质或功能性 RNA\
  \ 的细胞过程。基因表达由两个主要步骤组成：转录和翻译。转录是通过信使 RNA (mRNA) 将存储在基因中的转移到细胞质的过程，从而促进翻译过程。在翻译过程中，与转运\
  \ RNA (tRNA) 协作读取 mRNA 序列使我们能够组装蛋白质。\n\n### **基因调节：** 这是控制细胞内基因表达谱的过程。基因调节会增加、减少或抑制基因的表达。由于只有一部分基因被表达（“开启”），基因表达谱定义了细胞在特定时间的类型和活动。基因表达控制机制可以发生在基因表达的任何步骤，但最常见于转录过程中。*转录因子和微\
  \ RNA 是基因表达的关键调节因子。* `转录因子` (TF) 调节基因转录（增加或减少基因产物的数量）。`微 RNA` (miRNAs) 通过结合目标 mRNA\
  \ 防止其表达，在转录后水平上调节基因表达。`可选择性剪接` 是一种调节机制，它能够编码多种蛋白质（称为蛋白质异构体）而不是一种。最后，仍在研究中的长非编码 RNA\
  \ (lncRNAs) 参与了多种分子功能，在某些癌症机制中起着关键作用。\n\n### **疾病：** 一般般定义认为，疾病是任何对生物体正常结构或功能状态的有害偏差。异常状态会导致整个生物体或任何部分出现紊乱。通常，疾病与某些体征和症状有关，在本质上与物理损伤不同。疾病过程是复杂功能障碍机制的结果。例如，疾病可能会改变正常通路，导致病理表型。\n\
  \n### **病毒：** 病毒是一种亚微级的感染性因子，只能在生物体的活细胞内繁殖。因此，病毒利用活细胞的化学机制来继续生存和自我复制。`宿主特异性`病毒引起许多常见的人感染，并导致几种疾病，例如由鼻病毒病毒引起的普通感冒，以及由\
  \ HIV 引起的艾滋病。病毒可能具有其遗传物质（DNA 或 RNA）。\n\n### **基因-疾病关联（或称为疾病基因）：** 当一个基因或其基因产物参与疾病过程中时，就会发生这种情况。改变表达的突变基因可能会改变产生的蛋白质（和/或其数量），从而为功能障碍过程奠定基础。例如，`TP53`\
  \ 变会导致多种肿瘤性疾病，如乳腺癌、膀胱癌和肺癌。\n\n### **疾病模块：** 某些疾病是由多个缺陷基因产物（疾病基因或疾病蛋白）引起的。Barabási\
  \ *等人* 将关注点从疾病基因转移到它们复杂的相互作用集：“疾病很少是单个基因产物异常的结果，而是反映了复杂细胞内网络的扰动”。`疾病模块`被定义为连接到同一种疾病的基因局部邻域，它们相互作用并改变了正常结构和生物功能。\n\
  \n### **药物：** 在药物基因组学中，药物是一种通过与生物体的特定分子（例如酶或受体蛋白）相互作用产生治疗效果的化学化合物。结合受体（蛋白质家族）的药物会改变其分子结构和功能。这种变化会诱导细胞内的信号通路或抑制受体本身的功能。药物诱导的生物过程特定改变与疾病引起的改变形成对比，从而产生治疗性的“修复”效果。\n\
  \n# 3. 生物网络与可用资源\n\n## 3.1 生物网络\n\n在本节中，我们介绍了最常见的生物网络（第 3.1 节）和生物数据库详尽集合（第 3.2 节）。\n\
  \n### 3.1.1 *生物网络*\n\n分子网络的节点通常代表基因、基因产物或生物功能，而边定义了这些实体之间的分子连接。接下来，我们将描述最常见的生物网络类型，并提供完整的解释和表格描述。\n\
  \n#### 3.1.1.1 *蛋白质-蛋白质相互作用网络*\n\n\n\n\n蛋白质-蛋白质相互作用网络（PIN），通常称为互作用组，是一种基于蛋白质相互作用（PPIs）的无向二部图，其中蛋白质是节点，无向边表示物理相互作用。与通常惯例相反，PIN\
  \ 存在一个需要注意的歧义：边的缺失可能意味着两个蛋白质之间不存在相互作用，或者相关的实验室实验尚未进行。此外，PIN 节点可以带有代表生物学知识的分类属性，例如\
  \ GO 术语、疾病关系和其他蛋白质特征（如结构域）。从拓扑角度来看，PIN 具有与无标度网络^(10) 相似的特征.^(l) 正 Jeong 等人^(11)\
  \ 报道，PIN 中的枢纽节点可能是对许多基本生命过程至关重要的蛋白质。PIN 的另一个典型属性是其模块化组织结构.^(10)。\n\nPIN 由模块组成，模块是倾向于共同工作以完成某种生物功能的蛋白质子图。这些模块通过促进生物过程和构成蛋白复合物，在生物体的生命中起着关键作用。\n\
  \nPIN 主要用于识别对疾病等生物过程发育至关重要的关键蛋白质或模块.^(9)。在人类 PIN 中发现此类模块有助于我们理解多样的表型在分子水平上是如何相互关联的。PIN\
  \ 和模块是允许临床医生研究共病和药物重定位的关键概念。\n\n我们想指出，尽管过去十年中人们付出了系统性的努力增加其覆盖范围和准确性，但人类 PIN 仍然极不完整且充满噪声.^(12)。由于上述原因，它仍然是一个活跃且开放的研究领域。\n\
  \n![](img/in208_1.jpg)\n\n### 3.1.2. 药物-靶网络\n\n药物靶网络（DTN）是一种二部无向网络，其中一组节点由药物组成，另一组包含它们的靶分子。当药物倾向于与蛋白质（例如\
  \ GPCR）、肽或核酸结合目标时，^(13) 之间存在一条边/相互作用。此外，药物可能同时靶向多个分子，从而给患者带来副作用.^(14)\n\n由于 DTN\
  \ 的主要用途之一是药物重定位，许多网络还报告了分类属性。这些属性构成了额外的知识，如疾病、蛋白质结构域以及药物通路或类别。DTN 网络还可以通过蛋白质-蛋白质和药物-药物相互作用进行扩展。药物重定位方法利用丰富的\
  \ DTN（具有 PIN 的功能和模块化结构）来实现更好的性能.^(2,) ^(14,) ^(15)\n\n另一种与 DTN 相关的网络是药物-药物相互作用（DDI）网络。在\
  \ DDI 网络中，节点是药物，边表示一种药物与另一种药物结合时对目标产生的影响（通常是负面的）。由于由于原因，DDI 通常用于识别药物的副作用并驱动联合用治疗。与疾病类似，观察到某些药物对其靶点的\
  \ PIN 邻域有影响。例如，可以通过工程手段使药物与疾病蛋白质 PIN 邻域中的蛋白质相互作用，产生有益效果.^(15)\n\n最后，Cheng 等人假设的药物靶模块概念捕捉了被相同药物靶向的蛋白质形成局部邻域的趋势，这发生在疾病模块的情况下。在联合用药中观察到的有趣属性如下：两种药物只有在药物-靶模块与疾病模块重叠但互不包含的情况下，才具有治疗效果。\n\
  \n![](img/in209_1.jpg)\n\n### 3.1.3. 基因表达网络\n\n基因共表达网络（GEN）是一种无向的通常是加权的相关网络，其中节点是基因，边表示两个基因之间表达上的显著相关性。基因节点可以带有分类属性以添加生物学知识，如疾病和\
  \ GO 术语。GEN 通常分两个步骤构建：第一步，使用基因表达数据（微阵、RNA-Seq）计算每对基因之间的相关性测量（皮尔逊或斯皮尔曼系数、互信息、欧几里距离）。第二步，对之前计算的相关性值应用显著性阈值（阈值截断或费舍尔\
  \ Z 变换），以识别共表达基因。\n\n研究 GEN 允许人们识别功能上相关的基因或在生物通路中起关键作用的共表达模块.^(16)。\n\n我们还想强调，与\
  \ PPI 网络不同，基因共表达网络取决于采集样本的条件（通常是时间背景）。\n\n![](img/in210_1.jpg)\n\n### 3.1.4. 基因调控网络\n\
  \n基因调控网络（GRN）是一个加权的有向的基因调控依赖二部网络。相互作用发生在“调控分子”（转录因子、RNA、miRNA 等）和“受控分子”（通常是基因）之间。节点可以通过分类属性进行表征。GRN\
  \ 捕捉了基因调控系统的流程。研究基因调控过程允许研究人员理解分子机制，从而识别在特定条件（如疾病）下出现的关键模式和参与者.^(17)。\n\n![](img/in210_2.jpg)\n\
  \n### 3.1.5. 脑网络\n\n连接组称为脑网络，用于组织和表示不同脑区之间的功能或物理连接信息.^(18)。正如在许多生物网络以及脑网络中经常观察到的，可以识别出无标度拓扑.^(19)。其他研究还发现连接组与小世界模型^(20)\
  \ 具有相似性，并识别了一些循环结构基序.^(21)。此外，脑网络表现出与 PIN 网络中常见的模块化结构^(22。为了理解连接组是如何构建的，我们必须考虑用于检测脑区并理解它们如何相互作用的不同技术。两种常用的技术如下：(i)\
  \ 结构磁共振成像（sMRI），检测剖结构并提供物理连接图；(ii) 功能磁共振成像（fMRI），允许追踪与血流相关的氧变化，帮助建立大脑活动图。\n\n网络分析在退行性脑疾病研究领域取得了巨大进展。例如，与阿尔茨海默症研究相关的^(23)\
  \ 工作报告了证据，证明功能脑网络的结构特性与小世界模型的相似性较低。这一发现有助于更好地理解阿尔茨海默症会导致远程脑区之间的连接中断。\n\n![](img/in211_1.jpg)\n\
  \n#### 3.2. 公开资源\n\n\n\n\n数据收集（数据库）构成了深度学习方法的基础。网络生物学数据库通过将信息集中在一个地方，如第 2.3 节)），它们每年回顾所有最新更新和可用的生物数据库。\n\
  \n在表 1 中，我们给出了可用数据库的详尽列表。表格报告了每个数据库的名称、包含数据的描述，以及三个二进制列，用于识别原始数据库并将其内容分类为特征（节点或边的属性）和/或关联（边）。表中提供了指向原始资源的直接链接；但为了可读性，该链接仅在本书的电子格式可用。表格按数据库组^(o)组织：基因/蛋白质、疾病、药物、基因表达、基因调节和通路相关数据。根据作者的专业知识以及这些数据库的认可程度，最重要的数据库已被下划线标记^(p)\n\
  \n表 1. 网络生物学中的可用数据库列表。\n\n![](img/tab7_1.jpg)\n\n![](img/tab7_1a.jpg)\n\n![](img/tab7_1b.jpg)\n\
  \n![](img/tab7_1c.jpg)\n\n![](img/tab7_1d.jpg)\n\n### 4. 深度学习用于相互作用组 (I)\n\n####\
  \ 4.1. PPI 预测 (PPIP)\n\n蛋白质在生物过程中起着关键作用。拥有一个生物体完整的 PPI 集合对于许多分子网络研究（例如疾病基因鉴定或药物-靶点关联鉴定）至关重要。尽管构建\
  \ PPI 检测系统需要耗时耗力，但仍有必要完成几个生物体的 PPI 地图。蛋白质-蛋白质相互作用识别任务有助于检测生物体蛋白质之间此前不存在的物理相互作用。蛋白质-蛋白质相互作用网络（见第\
  \ 3.1.1 节）、蛋白质、基因、基因表达和细胞是第 2.3 节中提出的有用概念。\n\n三种主要的实验方法用于检测人类蛋白质蛋白质相互作用：系统实验；文献筛选；计算预测。系统实验，如酵母双杂（Y2H）和亲和纯化质谱分析（AP-MS），是最可靠的方法，提供了多种类型的\
  \ PPI：Y2H 检测二元相互作用，而 AP-MS 检测一对多（复合物）相互作用^(12)。\n\n尽管这些方法准确，但它们容易产生假阳性和假阴性。如 Ref.\
  \ 88 所示，基于科学文献综述构建的 PPI 集合更丰富，但质量较低，因为采用的方法容易出错并可能受到调查偏差的影响。另一方面，计算方法与实验室实验相比是廉价的——但由于其合成性质，产生的预测必须通过生物实验进行验证。近年来提出了几种方法。最旧且也是最常用的比较方法是\
  \ `node2vec`：一种基于 skip-gram 的方法——由 Grover 和 Leskovec 在 2016 年提出^(89)——它仅利用结构信息学习节点网络表示（嵌入）。Kishan\
  \ *et al.*^(90) (GNE) 和 Luo *et al.*^(91) 基于经典的 DNN 方法。最近的方法^(92–94) 基于 GNN。由 Xiao\
  \ 和 Deng 提出的 `HO-VGAE`^(92) 也基于图变分自动编码器（GAE）。在这里，作者目的是通过改进 GAE 中的 GCN 聚合方案来探索人类\
  \ PIN 中每个节点的高阶邻。此外，他们整合了 L3 原则，这是最近发现的人类 PIN 属性^(95)。在人类 PIN 的比较评估中，`HO-VGAE` 的\
  \ AUPRC 比 `node2vec` 高 3.4%。\n\n与 `HO-VGAE` 类似，`SkipGNN`^(93) 改进了聚合方案以收集直接和二阶邻的信息。已经证明二阶\
  \ PPI 的相似性对 PPI 具有高度预测性（即 L3 原则）^(95)。在人类 PIN 的比较评估中，`SkipGNN` 的 AUPRC 比 `node2vec`^(89)\
  \ 高 14.8%，AUROC 高 15.1%。与 `HO-VGAE` 和 `SkipGNN` 类似，`HOGCN`^(94) 改进了聚合方案以收集来自直接 k\
  \ 阶邻的信息。在人类 PIN 的比较评估中，`HOGCN` 的 AUPRC 比 `node2vec`^(89) 高 15.7%，AUROC 高 15.6%，比\
  \ `SkipGNN` 高 0.9% AUPRC 和 0.5% AUROC。\n\n所有所有方法仅使用 PPI 作为输入数据，由 Kishan *et al.*^(90)\
  \ 提出的方法除外，该方法还使用基因表达通过整合 PIN 的拓扑结构和基因表达来构建基因表示。在酵母 PIN 的比较评估中，GNE 的 AUROC 比 `node2vec`\
  \ 高 6%，AUPRC 高 12%。不幸的是，这些研究缺乏一种允许直接比较的共同基准。每个研究即使在采用的评估指标方面保持一致，其使用的 PPI 数据集通常与其他工作不同。最常用的评估指标是\
  \ AUROC 和 AUPRC，Grover 和 Leskovec 仅使用 F-1 指标是一个例外。关于该领域研究的额外概述，请参见 Lü 和 Zhou 的工作^(7)\
  \ 以及 Kovaćs *et al.*^(95)。\n\n#### 4.2. 必需蛋白预测 (EPP)\n\n\n\n\n\n必需基因或蛋白质是执行生物体生长和生存的关键生物过程的分子组分。此外，必需基因在常见物种的进化过程中往往具有高度的保守性。出于这个原因，必需蛋白被用于基因疾病关联发现、抗生素开发以及合成生物学，以评估生物体生存所需的最小必需基因集（即必需基因组）。^(96–98)\
  \ 寻找必需基因的传统生物发现途径依赖于耗时的实验，例如基因敲除、RNA 干扰、反义 RNA (asRNA) 和转座子突变.^(96, ^(98) 从生物网络的角度来看，必需基因往往是\
  \ `PIN` 网络的枢纽节点。^(11) 由于 `PIN` 往往是一个无标度网络，必需基因的缺失会导致其连通性的破坏，从而导致生物体产生不稳定性.^(99)\
  \ 然而，一方面必需蛋白与网络拓扑结构强相关，另一方面 `PINs` 的噪声和不完整性限制了经典基于网络的预测方法的性能.^(96,) ^(97) 近年来，提出了几种基于深度神经网络的计算方法。其中大多数基于\
  \ `node2vec` 并结合其他技术，如 `LSTM`、`CNN` 和 `GNN`。Zeng *et al*。^(100) 提了一了一种基于 `node2vec`\
  \ 和 `LSTM` 的端到端模型，通过共同整合 `PIN`、`gene expression` 和 `subcellular localisation` 信息来识别必需蛋白。生成的必需蛋白分类在酵母数据上通过\
  \ F-measure、`AUC` 和 `AP` 指标进行了测试。Zeng *et al*.*.,^(101) 探索了类似的方法，他们使用 `CNN` 代替 `LSTM`；Zhang\
  \ *et al*。.,^(102) 则将 `node2vec` 蛋白向量和序列数据拼接，输入到全连接多层神经网络 (`DNN`)。我们注意到，Zhang *et\
  \ al.* 通过利用蛋白质序列和拓扑特征，并通过使用代价敏感训练函数解决不平衡学习问题，提升了 `EPP` 的整体性能。Schapke *et al*。.,^(97)\
  \ 提出的 EPGAT 在方法和使用的数据上都是最不同的。EPGAT 构建了一个属性 `PIN` 网络以应用一种基于图注意力神经网络的方法，其中他们使用了加权二元交叉熵\
  \ (`CE`) 函数。`PIN` 网络的节点使用基于 `gene expression` 特谱、`orthology information` 和 `subcellular\
  \ localisation` 的特征向量进行装饰。尽管上述方法使用了多种指标（如准确率、召回率、精确率、`AUROC` 和 `AUPRC`）进行了详尽评估，但它们并没有与深度学习技术进行直接对比。对比的主要基准方法是度中心性和支持向量机，由于使用了不同的\
  \ `PIN` 数据，无法突出一个共同的基准。关于该研究子领域的额外概述，请参阅 Li *et al*。^(96) 和 Zhang *et al*。^(98)\n\
  \n### 4.3. *蛋白质功能预测 (PFP)*\n\n如所述，蛋白质承担着生物体的关键功能。然而，几乎所有蛋白质的功能大部分都是未知的。根据 Shehu\
  \ *et al*.,^(103) 少于 1% 的蛋白质在通用蛋白质 (`UniProt`) 数据库中有可靠且详细的注释。此外，“对于存储在美国生物技术信息中心\
  \ (`NCBI`) 数据库的 40% 蛋白质序列，目前缺少基础信息”。由于上述原因，以及由于发现的蛋白质数量与其功能表征之间的缺口日益扩大（特别是由于实验限制导致），完成蛋白质功能的收集已成为一个需要解决的基础性研究问题。研究人员克服这一问题的首要努力是按照结构化和标准化的方式组织蛋白质功能。基因本体论\
  \ (`GO`）^(q) 是三种蛋白质功能的集合，按生物学方面区分的层次层次本体论：细胞组分、生物学过程和分子功能。其次，通过计算方法对蛋白质功能进行可靠预测已变得至关重要。在这个方向上，W.\
  \ Hamilton *et al.* 提出的 `GraphSAGE`^(104) 提供了一个利用节点特征信息来学习节点嵌入的归纳框架。在这项工作中，作者仅使用\
  \ `PIN` 网络来证明其工作的有效性。2018 年，M. Kulmanov *et al.* 提出了 `DeepGO`^(105)，这种复杂的端到端深度学习方法，它利用蛋白质序列特征、拓扑跨物种\
  \ `PIN` 特征以及 `GO` 类之间的依赖关系来预测蛋白质功能。该方法基于两个深度神经网络的拼接，分别结合蛋白质序列和网络表示。Gligorij *et\
  \ al*.,^(106) 提出了一种基于多模态深度自动编码器 (`MDA`) 的网络融合方法，从多个异构网络中提取基因的高级特征。该方法使用重启随机游 (`RWR`)\
  \ 构建高维节点嵌入，一旦使用 `MDA` 进行降维，便输入 `SVM` 分类器。最后，Fan *et al.* 提出了 Graph2GO^(107)，一种利用蛋白质序列相似性网络和带有属性（氨基酸序列、亚细胞定位和蛋白质结构域）的\
  \ `PIN` 来预测蛋白质功能（GO 项）。该模型使用两个变分图自动编码器 (`vGAEs`) 来学习每个蛋白质的潜在表示，并随后使用 `DNN` 预测蛋白质功能。与\
  \ deepNF 相比，Graph2GO 分别提升了该领域的所有工作都结合了带有属性的 `PPIs`，并通常倾向于使用精确率、召回率和 F 测量作为比较指标。为了完成该研究子领域的概述，建议读者参考\
  \ Shehu *et al*.,^(103) 和 Bonetta 与 Valentino 的作品.^(108) 蛋白质-蛋白质相互作用网络（见 3.1.1 节*\n\
  \n疾病基因识别由涉及遗传性疾病起源（即疾病基因）的基因或基因产物。评估基因在疾病中作用的传统方法涉及耗时且昂贵的分析^(r)，例如连锁分析和全基因组关联研究\
  \ (GWAS)。^(49)\n\n\n\n\n全基因组关联研究（GWAS）已在公共数据库中产生了大量的疾病-基因关联集合，例如 `OMIM`^(43) 和 `DisGeNET`^(42)。疾病基因的识别为理解疾病机制、设计新疗法、改进疾病预防方法以及进行准确的风险因子评估提供了有见解。因此，该研究领域的计算方法变得日益突出并被广泛提出。\n\
  \n该研究领域的计算方法主要基于具有富特征的 `PPI` 和 `GDA` 数据的 `GNN` 和 `Skip-Gram`。Agrawal *et al.*^(109)\
  \ 使用 `node2vec` 和逻辑回归来研究人类 `PIN` 的潜在网络结构如何与疾病模块的可预测性相关。在 `HerGePred`^(110) (`HDGN`)\
  \ 中，通过结合四种关系类型构建了一个异构网络：`疾病–基因`、`疾病–症状`、`基因–GO-terms` 以及 `基因–基因` (`PPI`)。然后将其应用于\
  \ `node2vec` 中以学习节点嵌入。最后，利用余弦相似度和基于 `RWR` 的方法产生两种不同的疾病-基因排序。与 `DeepWalk` 和 `node2vec`\
  \ 类似，`SmuDGE`^(111) 在异构网络（由 `PPI`、`疾病–表型`和`基因–表型`关联组成）上执行随机游走，然后应用 `Skip-Gram` 模型来学习疾病和基因表示。`SmuDGE`\
  \ 使用了两种独立方法：(i) 基于嵌入向量与查询疾病向量之间余弦相似度的无监督方法；(ii) 基于深度神经网络的方法，其使用基因和疾病嵌入进行预测。另一项基于\
  \ `node2vec` 的研究是 Ata *et al.*.,^(112) 提出的工作，他们用从 `UniProt` 收集的约 500 个基因特征富化了生成的嵌入。富特征表示被用于训练多个二分类模型：`SVM`、广义线性模型（`GLM`）、随机森林（`RF`）和\
  \ `kNN`。根据作者的说法，`N2VKO` 在六种疾病上的性能比普通的 `node2vec` 高出约 2.6% AUROC。在 `HNEEM`^(113)\
  \ 中，作者基于`基因–疾病`关联、`基因–化学`关联和`疾病–化学`关联构建了一个异构网络。然后应用多个模型来学习不同的节点嵌入：`node2vec`、`DeepWalk`、`高阶邻近保持嵌入`\
  \ (`HOPE`)、`半监督深度模型结构深度网络嵌入` (`SDNE`)^(114)、`图分解` (`GF`)^(115) 和 `拉普拉斯特征映射` (`LE`)^(116)。最后，他们使用基于随机森林的方法预测疾病-基因关联。Zhu\
  \ *et al.*^(117) 的方法使用级联深度方法（带有图卷积的 `DeepWalk`）来预测疾病-基因关联。`SkipGGE`^(118) 在异构网络（由\
  \ `PPI`、`疾病–表型`和`基因–表型`关联组成）上执行随机游走，然后应用 `Skip-Gram` 模型来学习疾病和基因表示。`SmuDGE` 使用了两种独立方法：(i)\
  \ 基于嵌入向量与查询疾病向量之间余弦相似度的无监督方法；(ii) 基于深度神经网络的方法，其使用基因和疾病嵌入进行预测。`HNEEM`^(119) 使用基于`基因–疾病`关联、`基因–化学`关联和`疾病–化学`关联的异构网络。然后应用多个模型来学习不同的节点嵌入：`node2vec`、`DeepWalk`、`高阶邻近保持嵌入`\
  \ (`HOPE`)、`半监督深度模型结构深度网络嵌入` (`SDNE`)^(120)、`图分解` (`GF`)^(121) 和 `拉普拉斯特征映射` (`LE`)^(122)。最后，他们使用基于随机森林的方法预测疾病-基因关联。\n\
  \n### **5. 用于网络药理学 (NP) 的深度学习**\n\n#### **5.1. *药物–靶点交互预测 (DTIP)***\n\n药物-靶点关联预测是指寻找与药物结合分子（通常是蛋白质）的任务。存在多种湿实验可以评估药物-靶点关联，但这些实验极其昂贵且耗时。\n\
  \n\n\n第一种方法^127 是一种基于相似性的药物-目标方法，它首先构建一个包含`drug–target`、`drug–disease`和`disease–target`关联的异质网络。然后，将`DeepWalk`方法应用于网络以构建节点表示。作者提出了两种规则的推理方法来预测新的药物-目标关联：基于药物的相似性推理\
  \ (DBSI) 和基于目标的相似性推理 (TBSI)。前者 `DBSI` 的逻辑是：如果药物 `d[i]` 与药物 `d[j]` 相似，且药物 `d[j]`\
  \ 与目标 `t[l]` 之间存在关联，则预测新的药物-目标关联 (`d[i], t[l]`)。另一方面，`TBSI` 的逻辑是：如果药物 `d[i]` 与目标\
  \ `t[l]` 之间存在关联且目标 `t[l]` 与目标 `t[h]` 相似，则预测新的药物-目标关联 (`d[i], t[h]`)。所提出的方法主要利用生物学网络的拓扑结构来提高预测性能。\n\
  \nNeoDTI^128 是一个从异质数据预测药物-目标相互作用的端到端模型。该方法首先构建一个由其他八个网络组成的网络：`drug–drug structure-based\
  \ similarity`、`drug–side effect`、`drug–target`、`drug–drug`、`drug–disease`、`protein–protein\
  \ sequence-based similarity`、`protein–disease` 和 `PIN`。提出的深度学习神经网络框架输入异质网络以重构原始八个网络的邻接矩阵。最后，NeoDTI\
  \ 于重构的网络矩阵预测药物-目标相互作用。\n\n最后，4.1 节 中描述的 `SkipGNN` 和 `HO-VGAE`^94 改进了 GNN 的聚合方案以预测药物-药物相互作用。在\
  \ DTIP 问题上的对比评估中，`SkipGNN` 在 AUPRC 上比 `node2vec`^89 高出 15.*7%，在 AUROC 上高出 20.*2%。`HOGCN`\
  \ 在 AUPRC 上比 `SkipGNN` 高出 0.*9%，在 AUROC 上高出 1.*2%。\n\n所提方法的主要优势整合了多个来源的信息以从数据中提取非线性模式。`AUROC`\
  \ 和 `AUPRC` 是该研究领域最常用的指标。关于该子研究领域的额外概述，请参考 Ezzat *et al.*,^126 Bagherian *et al.*^129\
  \ 以及 Abbasi *et al.*^130 的工作。\n\n## 5.2 药物-疾病关联预测 (DDAP)\n\n药物-疾病关联（也称为`药物重用`）是药物对特定疾病治疗效果的合成表示。需要注意的是，疾病是一个复杂的过程，它通过改变生物学过程对生物产生影响，因此必须与药物-目标相互作用区分开来。注意，药物研发过程（从零开始开发新药）与药物重用过程是不同的。药物研发是一个耗时且昂贵的过程，而现有药物的重用过程可以大幅减少药物的成本和时间，特别是通过计算方法来实现。\n\
  \nDDAP 的第一个解决方案由 Zeng *et al.* 通过 `DeepDR` 提出^131。`DeepDR` 是一种基于网络的药物重用深度学习方法，它使用了多个生物学网络：`drug–\
  \ disease`、`drug–side effect`、`drug–target` 和七个 `drug–drug` 网络。首先，`DeepDR` 通过在九个药物相关网络上使用\
  \ `DeepNF` 模型（见 4.3 节）来生成捕捉高度非线性模式的低维表示（药物嵌入）。然后，将学习到的药物嵌入和药物-疾病关联用于`集合变分自动编码器`^132\
  \ 以预测新的药物-疾病关联。同样，Gysi *et al.*^2 的方法通过在四个关联网络（`protein–protein`、`drug–target`、`disease–protein`\
  \ 和 `drug–disease 关联`）上应用 `Decagon` 模型（见 5.3 节）来学习疾病和基因表示，以预测药物与 COVID-19 的关联。最后，Karimi\
  \ *et al.* 提出基于强化学习的方法 `HVGAE`^133。该方法使用带有注意力池化的`分层变分图自动编码器`，在 PPI、基因-疾病和疾病-疾病网络上学习疾病和药物嵌入。学习到的表示被用于强化学习模型，以识别疗效最大的药物组合。这项工作解决了为一组药物寻找临床适应的挑战性问题，而不是像上述工作那样重用单个药物。\n\
  \n领域中最常用的指标是 `AUROC` 和 `AUPRC`。遗憾的是，无法识别出一个通用的基准。该领域的额外概述可以在 Xue *et al.*^134 和\
  \ Jarada *et al.*^135 的工作中找到。\n\n## 5.3 药物-药物相互作用 (DDIP)\n\n两种或多种药物的联合相互作用可能导致意外且关键的健康并发症。这些并发症被称为不良药物反应（`ADRs`），对患者是有危险的，且对医疗系统来说是昂贵的。大量的住院病例和医疗错误是由\
  \ `DDI` 引起的^137。\n\n尽管对提高我们药物-药物相互作用理解的需求很高，但目前已知的副作用小于总数的 1%^138，且通过湿实验对其进行预测既昂贵又难以实施^139。\n\
  \n由于上述原因，药物-药物相互作用检测是确保患者治疗成功的相关任务。已经开发了多种经典的计算机器学习方法^139^140，可以突出显示的基于深度学习的三种方法是\
  \ `Decagon`^136、`SkipGNN`^93 和 `HO-VGAE`^94。\n\n`Decagon` 的作者提出了一种`端到端多模态图自动编码器`方法来预测药物-药物关联及其副作用。模型的输入是一个多模态（异质）图，由`蛋白质-蛋白质相互作用`、`药物-蛋白靶相互作用`和`联合用药副作用`组成。药物是节点，每个副作用是不同的边。该方法基于一种用于多关系链路预测的新型卷积神经网络。`Decagon`解决了联合用药问题以寻找药物组合的副作用，这与\
  \ Karimi *et al.*^133 工作中寻找联合临床治疗的任务不同（在 5.2 节中进行了详细介绍）。\n\n## 6. 用于其他生物学问题的深度学习\
  \ (BIO)\n\n### 6.1 miRNA-疾病关联预测 (MDAP)\n\n\n\nmiRNA–疾病关联预测（MDAP）是识别微 RNA（miRNA）与疾病之间相互作用的任务。miRNA\
  \ 在基因调控中起关键作用，对生物学过程和疾病机制具有重要影响。多项研究表明，miRNA–疾病关联对于个性化诊断和药物开发很有用。^(141)评估 miRNA–疾病关联的生物学方法包括逆转录-聚合酶链反应、北方杂交和微阵列分析。^(142)然而，正如生物领域经常出现的情况，这些实验既昂贵又耗时。因此，应用主要基于\
  \ `CNN` 和 `GNN` 的计算方法将有利于新关联的识别。\n\nXuan *et al.* 提出了两项工作，即 `CNNMDA`^(143) 和 `CNNDMP`^(144)，两者基于\
  \ `CNN`。为了克服该领域经典计算方法的局限性，作者嵌入了数量大量的 miRNA–疾病关联。两种方法主要区别在于 `CNN` 所需的输入数据处理步骤。为了提取网络表示，`CNNMDA`\
  \ 使用了非负矩阵分解（`NMF`），而 `CNNDMP` 使用了 `RWR`。`MDA-CNN`^(145) 通过将自动编码器应用于三层复杂网络（包括疾病相似性网络、miRNA\
  \ 相似性网络和蛋白质-蛋白质相互作用网络）来提取基于网络的特征。`MDA-CNN` 使用 `CNN` 预测 miRNA–疾病关联，用学习到的低维表示作为输入。`HGCNMDA`^(141)\
  \ 的作者提出了一种基于人类 PPIs、miRNA–疾病、miRNA–基因、疾病–基因关联的异质网络的方法。该方法首先通过对人类 `PINs` 应用 `node2vec`\
  \ 来生成基因嵌入。然后，它对每个网络使用 `graph convolutional layer` 并结合学习到的节点嵌入。最后，`HGCN-MDA` 对得到的\
  \ `GCN` 表示取平均，在链路预测设置下预测 miRNA–疾病关联。`NIMCGCN`^(146) 的第一步基于构建 miRNA–疾病相似性网络。使用 `GCN`\
  \ 方法学习 miRNA 和疾病的潜表示。最后，这些表示被神经归纳矩阵完成（`NIMC`）模型用于生成关联矩阵，从而允许预测 miRNA–疾病关联。Li *et\
  \ al.*^(147) 介绍了另一种基于 `GCN` 的方法 (`FCGCNMDA`)。它首先构建一个完全网络，其中节点代表 miRNA–疾病对。然后，使用双层\
  \ `GCN` 利用 miRNA–疾病网络以及特征矩阵（即作为节点权重的 miRNA–疾病关联评分）来预测新的 miRNA–疾病关联。最后，`GAMEDA`^(142)\
  \ 是基于图自动编码器的模型，它首先使用二分图收集 miRNAs 之间的关联。投影（在同一向量空间内）的 miRNA 和疾病节点随后通过图自动编码器（`GAE`）处理以学习稠密表示。最后，`GAEMDA`\
  \ 使用 miRNA 和疾病嵌入通过 `bilinear decoder` 来重构并预测新的 miRNA–疾病关联。\n\n这些工作使用的参考指标是 `AUROC`\
  \ 和 `AUPRC`。通常，这些工作不会与同一研究领域的其他方法进行自我比较。MDAP 作为一个新的研究领域，面临着缺乏通用基准和全面文献综述的困扰。\n\n\
  ### 6.2. 疾病分析 (DA)\n\n复杂疾病（如癌症或肿瘤）机制的发现依赖于底层的相互连接的分子异质过程。在这种分析背景下，仅基于有机体 `PIN` 分析的\
  \ `GDAP` 方法通常无法识别特定状况的疾病驱动因子。为了识别特定疾病亚型或患者的驱动因子，多项工作成功地将基因表达谱与网络生物学相结合。这种整合有助于医生做出更好的诊断并为患者选择个性化治疗。在本节中，我们讨论了使用基因表达数据和网络分析特定疾病状况的近期工作。\n\
  \nRhee *et al.*^(148) 通过提出一种基于关系网络（`relation network (RN)`）和图卷积神经网络（`graph convolution\
  \ neural network (graph CNN)`）的方法解决了患者分类问题。该方法通过 `graph CNN` 捕捉关联基因的局部模式，然后通过 `RN`\
  \ 学习这些模式之间的关系。所提出的框架应用于人类 `PIN` 和 3 期乳腺癌患者的基因表达谱，根据 `PAM50` 方案分类乳腺癌亚型。Schulte *et\
  \ al.*^(149) 的工作解决了将多种组学数据类型合并到单一学习模型的问题。他们的模型通过 `GCN` 应用基因表达数据进行癌症基因预测。使用的属性 `PIN`\
  \ 由节点组成，其特征向量是从特定癌症状况下的基因表达谱中提取的。`DeepDriver`^(150) 将 `Deep CNN` 应用于基因–基因相似性网络和来自基因表达数据的基因特征向量。作者的方法重点关注癌症特异性基因。`iSOM-GSN`^(151)\
  \ 使用自组织映射（`SOMs`）算法从基因表达数据生成基因–基因相似性网络。然后，它通过整合每个基因与基因表达、DNA 甲基化和拷贝数变异（`CNA`）的特征值来丰富邻接矩阵。最后，他们将获得的富集数据输入\
  \ `CNN` 以预测疾病状态。\n\n由于该领域的近期引入且该领域的文献有限，很难清晰地识别出一套通用的评估标准和通用基准。\n\n### 6.3. 大脑分析\
  \ (BA)\n\n脑网络（即连接组，见第 3.1.5 节）分析是一个新兴的研究领域。它通常用于理解精神分裂症、抑郁症、阿尔茨海默病和多发性硬化等疾病的机制。^(152)\
  \ 连接组的特征是脑区之间复杂的相互依赖性。脑网络结构与其功能角色之间的关系部分已知。因此，应用计算方法对于提高目前的理解变得很有必要。\n\n在该领域可以识别出两种基于深度神经网络的方法。第一种由\
  \ Rosenthal *et al.*^(152) 提出，使用 `node2vec` 学习脑区域的低维网络表示以研究它们的潜在关系。后者由 Lee *et al.*,^(153)\
  \ 提出，解决了分析脑网络自然组织的问题。该方法将带有非负权重约束的图自动编码器（`GAE`）应用于结构性脑网络以学习节点（脑区）的低维表示。`GAE` 中的非负权重约束是该方法提出的最具创新贡献，为模型增加了可解释性。\n\
  \n我们想指出，该研究领域是通过定制的定性检查进行泛化的，而不是通过清晰的基准和精确的评估指标。\n\n### 7. 结论与未来工作\n\n\n\n\n本章总结了深度学习应用在网络生物学中使用的概念、数据集和技术。关于所提工作及其使用的基础方法、数据和评估指标，其完整概述汇总在表\
  \ 2 中。所回顾的工作表明，现在已经能够以更详细的方式深入研究生物学网络的复杂性。尽管深度学习技术取得了令人瞩目的成果，但未来的工作仍需应对数据和方法方面的问题。\n\
  \n一方面，尽管高通量技术的最新进展产生了巨大且不断增长的生物学数据，但这些数据仍受到以下质量和可靠性问题的影响：\n\n### 不完整性\n生物学网络具有高度不完全的特征。如表\
  \ 2 所示，使用最广泛的网络及其属性是人类 `PIN`，其已知的覆盖率仅为 20%。^(12) 这种数据不完整性严重限制了深度学习方法的性能。\n\n###\
  \ 偏差\n生物学知识正受到研究偏差的影响。多个 `PPI` 集合严重偏向研究最充分的基因，导致网络结构不能代表完整人类 `PIN` 的拓扑结构。^(9) 生物网络中的偏差是一个关键问题，因为它影响了基于网络的方法提取模式的质量，进而影响性能。最近，Luck\
  \ *等人*^(31) 了一种通过系统性、无偏的全蛋白组研究的人类 `PIN`。\n\n### 噪声\n基于文献的数据和高通量技术都容易产生假阳性和假阴性。^(92,)\
  \ ^(154) 因此，生物相互作用数据集必须通过证据/可靠性评分进行补充。^(28,) ^(42)\n\n### 缺乏负知识\n在生物医学文献中（由于实际和经济考虑），避免讨论不相互作用的生物实体是一种常见做法。这些“负性”结果的缺失使得对于相互作用的缺失或缺乏相关知识产生了不确定性。^(121,)\
  \ ^(154) 如果机器学习方法能够同时从正样本和负样本中学习，就能获得更好的性能。为了解决这个问题，会随机采样或通过生物学启发式方法生成负知识。然而，这些生成策略可能会迫使人们将未知的正性相互作用视为负性，导致由于过度估计性能而降低模型质量。\n\
  \n另一方面，网络生物学中计算方法的未来发展必须面对以下开放性挑战：\n\n### 异构数据\n网络生物学中的异构数据可以是节点和边特征，也可以是整个额外的网络。在文献中，考虑到生物医学实体复杂且互联的性质，以及上述生物数据集中缺乏知识，对于如何恰当地处理异构数据尚未达成共识。正如我们所看到的，几种方法仅在处理这一方面的技术上可能有所不同。建模和整合异构信息即使是一项艰巨的任务，也将是获得更好结果的关键策略。\n\
  \n### 不平衡学习\n网络生物学中的问题本质上通常是极不平衡的（例如 `PPIP`）。如果处理不当，这种不平衡将通过产生过估的评估来影响性能。\n\n###\
  \ 生物学启发\n网络生物学中的几种图深度学习方法灵感源于为社交网络开发的技术。然而，生物网络依赖于不同的拓扑模式。最近的研究^(93) 正通过整合 `L3`\
  \ 原则^(95) 而非社交同质性^(89) 来应对这一挑战。\n\n总之，网络生物学中的图深度学习方法代表了释放隐藏生物、医学和药学知识的强大工具。\n\n\
