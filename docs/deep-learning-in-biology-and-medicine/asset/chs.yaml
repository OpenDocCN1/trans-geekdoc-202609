  \n# 第 6 章\n## 化学信息学的深度学习\n\nAlessio Micheli 和 Marco Podda\n*比萨大学计算机科学系,*\nLargo\
  \ Bruno Pontecorvo 3, 56127 Pisa, Italy*\n\n深度学习 (DL) 是解决复杂的化学信息学问题最有前景的模型技术之一，其解决方案持续产生深远的人道主义和社会影响。本章涵盖了深度学习在化学信息学领域的两个相关应用。第一类\
  \ QSAR/QSPR 分析，涉及对分子结构的化学性质或生物活性的预测。在回顾深度学习在该领域取得的主要成果的同时，我们还概述了能够处理结构化数据（如序列、树和图）的神经网络模型，这些模型允许为了预测目的对丰富的化学数据进行表示。第二类是从头药物设计，涉及生成具有所需化学性质的新型分子结构，以加速药物发现流程。在这里，我们介绍了用于分子生成的深度生成模型家族，通过这些模型可以从数据中学习分子分布，并通过采样生成新的化学结构。\n\
  \n## 1. 引言\n\n\n\n\n\n`Cheminformatics`（化学信息学）是指一个交叉学科，它将化学研究与生物筛选进展以及计算机驱动技术相结合，以促进新型化学化合物的开发。化学信息学广泛应用于环境科学和生物医学等领域。化学信息学的研究涵盖了从传统化学的技术和问题到用于数据分析的新颖工具，包括库设计和虚拟筛选、机器学习（ML）和数据挖掘、分子图形以及模拟技术。在本章中，我们重点关注其在医学中的应用，即化学信息学被用于加速`drug\
  \ discovery`（药物发现），即设计和发现具有理想化学性质（例如生物学响应）的候选药物化合物的过程。药物发现是更复杂的`drug development`（药物开发）过程的一部分，其目标是将新药推向市场。加速新化合物发现的可能性具有巨大的科学、人道主义和经济效益。事实上，开发能够安全有效治疗疾病或障碍的药物是一个成本高昂的过程。据\
  \ 2010 年的估计，开发一种新处方药平均需要 13 年，成本约为`1*.*8`十亿美元。(1)）。此外，由于不断需要应对新出现或演变的疾病，这要求医疗界提供快速有效的响应，从而增加了加速药物发现周期的紧迫性。此外，该领域的研究动力还源于提高具有真实治疗价值的化合物比例，并减少药物不良的副作用。\n\
  \n药物发现是一个顺序过程，从确定需要治疗的生物学靶点到选择一组对目标活性的`lead`（先导）化合物。这一过程需要进行多次生物学`in vivo`（体内）或`in\
  \ vitro`（体外）实验。然而，这些实验有几个缺点，使得在许多情况下并不适用。例如，`in vivo`实验在某些背景下被认为是有争议的（例如对动物的研究和测试）。此外，通常情况下，`in\
  \ vivo`和`in vitro`实验都是昂贵、耗时且无法大规模实现的。`ML`和`DL`等计算（或`in silico`，计算机模拟）方法，^(2)近期提供了同时解决所有这些问题的机会，因此日益受到该领域研究人员的关注。(3–5)。作为`ML`和`DL`产生显著影响的药物发现相关任务的例子，我们引用了`Virtual\
  \ Screening`（虚拟筛选），^(6)即通过计算方法识别针对目标的活性化合物，以及`Absorption, Distribution, Metabolism,\
  \ Excretion, Toxicity`（ADMET）分析，^(7)，这是过滤掉具有不良副作用分子的所的。\n\n为了介绍`DL`在化学信息学中的应用，特别是关于药物发现格局的应用，我们集中在两个直接影响选择有前景化合物进行进一步开发的速度和可靠性的领域。具体而言，我们关注`Quantitative\
  \ Structure Activity/Property Relationship`（QSAR/QSPR，定量结构-活性/性质关系）分析，在该分析中寻求从化学结构到化学性质的功能性映射；以及`de\
  \ novo drug design`（从头药物设计），其中功能映射是反向的，即目标是找到从理想化学性质到合适化学结构的反向关系。我们选择这这两个特定主题来讨论药物发现中的`DL`有三个原因：\n\
  \n*   它们共同涵盖了该领域应用`DL`方法最广泛的区域。\n*   虽然两者相关，但这两个问题在根本上是不同的：`QSAR/QSPR`分析处理的是`预测`任务，而`de\
  \ novo`药物设计是一个`生成`问题。这为读者提供了一个广泛视角，了解不同的学习范式（分别为监督和无监督）如何通过`DL`方法无缝解决。\n*   选择`QSAR/QSPR`分析的一个特定动机是，虽然`QSAR/QSPR`分析受到了`ML`进展显著的影响，但`ML`研究同时也得益于`QSAR/QSPR`。例如用于结构的`ML`，其研究驱动力之一就是与`QSAR/QSPR`分析相关的严峻挑战，例如处理化学图。图神经网络^(8)是这种共生关系的卓越产。这些模型最近在`DL`领域被重新发现，现在被积极应用于药物发现研究和整个化学信息学。因此，专门针对`QSAR/QSPR`分析，我们选择这个主题是因为它在领先`ML`（特别是`DL`）研究中的重要性。\n\
  \n在下一节中，我们将对这两个选定的主题进行简要概述，而将其详细阐述留到后续章节。\n\n### 1.1. QSAR/QSPR 分析\n\n正如我们之前讨论过的，化学信息学可以用于药物发现，帮助做出明智决策，确定哪些化合物值得进行深层次的分析（即昂贵的实验）。显然，在`in\
  \ vivo`或`in vitro`实验之前提供高质量的预测模型来测试假设至关重要。例如，它们可以帮助从一组候选化合物中筛选出高亲和力配体，增加后续高通筛选实验的成功率；或者它们可以预测药物的不良健康影响（如基因毒性或致癌性），而无需进行昂贵的\
  \ ADMET 实验。\n\n`QSAR/QSPR`分析是此类预测器基础的相关建模方法。`QSAR/QSPR`的底层假设是化学结构与化学性质之间是相关的，且这种关系是可以量化的。`QSAR/QSPR`分析在具有已知性质或活性的分子集合，但其相互作用（例如针对\
  \ QSAR，活性分子与其生物靶点之间的相互作用）未知的情况下特别有用。与这些相互作用相关的性质通常难以精确量化，因为它们取决于广泛的潜在生物靶点和机制。为此，`QSAR/QSPR`分析方法允许从已知样本集中学习结构-活性或结构-性质的模型。然后，学习到的模型可以用于推断未测量的其他相似化合物的行为。由于结构在`QSAR/QSPR`方法中起着主要作用，对化学结构的处理（如分子图）具有根本性的重要性，见第\
  \ 3 节](#chapter6.xhtml#sec3)。统计学和`ML`的各种分析工具用于`QSPR/QSAR`分析，包括预测建模（分类和回归）、可视化和探索性数据分析（例如主成分分析和聚类分析）。由于其性质/活性估计器的通用性，`QSAR/QSPR`模型被应用于药物发现的许多阶段。\n\
  \n### 1.2. 从头药物设计\n\n\n\n\n\n虽然 QSAR/QSPR 方法解决了估计候选药物的化学性质和/或潜在活性的问题，但它们无法回答这些候选药物是如何生产的。在药物发现的早期，一旦确定了特定的生物学靶点，就会针对潜在活性化合物的`library`（库）进行`screen`（筛选），即通过`in\
  \ vitro`（体外）或`in silico`（计算机，例如使用 QSAR 方法）检查每个化合物对靶点的活性。\n\n这种做法无疑受到库的大小、组装中的隐含偏差以及非严格化学因素（如执行实验的实验室的技术和财务资源）等方面的限制。相比之下，针对`chemical\
  \ space`（化学空间，即所有具有潜在活性的可能化合物的子集）进行筛选在计算上是不可行的，因为其规模估计在 `10^[60]` 数量级。尽管如此，候选药物的筛选对于选使药物开发过程后续阶段（例如临床试验）的成功至关重要：为了避免毒性等意外副作用，候选药物从一开始就应该被赋予一组特定的化学性质。因此，研究人员不断探索在筛选库之外寻找潜在活性候选药物的策略。`de\
  \ novo`（从头）药物设计`^[10]` 指的是大量方法，这些方法通过研究如何生成符合一系列化学期望的候选药物来解决这个问题。\n\n`de novo` 药物设计的最终目标是通过规格化从化学空间中“生成”（或更准确地说，选择）一种类药的化合物。这种规格化包含了候选药物必须满足的化学性质，例如，它必须对靶点具有活性，并且极不可能产生不良药物反应等副作用。从这个意义上说，QSAR/QSPR\
  \ 分析有助于识别使分子具有“药性”最重要的属性，而其他机器学习（ML）或计算智能工具（如生成模型或遗传算法）可以用于从化学空间生成有趣的化合物。\n\n###\
  \ 1.3 本章概述\n\n在`Section 2` 中，我们回顾了一些贯穿始终实用的分子概念。此外，我们还描述了表示分子所含信息的多种方法，例如分子图、分子指纹、SMILES\
  \ 字符串和其他结构化数据。在`Section 3` 中，我们将深入探讨用于 QSAR/QSPR 的深度学习（DL）：特别是，我们提供了该领域如何从使用“平坦”分子表示演变为允许直接处理分子结构的方法的历史视角。在`Section\
  \ 4` 中，我们将讨论用于`de novo` 分子设计的深度学习模型，概述它们的架构组件以及如何有效率使用它们。最后，在`Section 5` 中，我们将讨论这些方法在近期和不远的未来将向何方发展。\n\
  \n### 2. 分子及其表示\n\n在本节中，我们将介绍对我们的讨论具有功能性的分子概念。特别是，我们描述了分子所含信息的各种表示形式。事实证明，虽然图可以最生动、简洁地编码分子结构，但其他表示对于本章介绍的任务也是有用的，例如分子描述符、分子指纹、SMILES\
  \ 和其他结构表示形式。\n\n### 2.1 定义\n\n化学信息学（Cheminformatics）中的一个核心概念是`compound`（化合物），它是由原子核周围电子之间的静电引力结合在一起的原子组。根据引力的来源，我们将键分为`ionic`（离子）和`covalent`（共价）。当两个中性电荷原子中的一个失去电子而另一个获得电子时，就会形成离子键。产生的电荷不平衡产生了引力。相反，当两个原子之间共享一个或多个对电子时，就会形成共价键。仅由共价键形成的化合物称为`molecules`（分子）。在我们处理该主题时，我们关注分子而非化合物；由于口语习惯，我们有时会稍微滥用它们的定义，并同时使用这两个术语来指分子。\n\
  \n#### 2.2 分子的化学式和结构式\n\n为了传递有关分子组成的信息，通常会给出其化学式。化学式简洁地报告组成分子的原子数量。例如，阿司匹林的化学式为\
  \ `C[9]H[8]O[4]`，表示它包含九个碳 (C) 原子、八个氢 (H) 原子和四个氧 (O) 原子。然而，分子自然包含化学式无法传达的若干信息。分子更全面的表示是其`structural\
  \ formula`（结构式），它通过`molecular graph`（分子图，也称为刘易结构）表示原子的排列，其中原子是节点，键是它们之间的连接。通常，分子图中的节点标记为相应的原子符号或原子序数，而连接标记为它们的键类型。分子图还可以表示分子的`stereochemistry`（立体化学），即其\
  \ 3D 结构以及其他若干有用信息。\n\n#### 2.3 分子描述符\n\n分子与许多可以通过实验评估的数量相关，称为`molecular descriptors`（分子描述符）。描述符大致可分为三类：\n\
  \n* `Experimental measurements`，^[11]` 直接或通过模拟量化原子（或原子团，如取代基）的物理和化学性质，对分子结构提供部分描述；示例包括极化率、摩尔折射率和疏水性。\n\
  * `Theoretical descriptors`，^[12–15]` 源于分子的符号表示。这些描述符编码了分子图的形态属性（例如，计算给定大小的路径数量或环的数量）；示例包括拓扑和连通性指数、环数等许多。\n\
  * `Group contributions`（基团贡献），例如`fragments`（片段），^[16]` 即由单个原子或简单原子团组成的分子子结构。片段通常与烷基链的部分或表征不同有机化合物类的的能团相同。\n\
  \n对于本章，我们将关于描述符的概念限制在上述概念上。然而，感兴趣的读者可以参考 Todeschini 等人的著作`^[17]` 以对该主题进行广泛处理。\n\n\
  #### 2.4 分子指纹\n\n`Molecular fingerprints`^[18,19] 是一种分子表示法，有助于分子之间的结构比较并允许在大型数据库中进行快速检索。本质上，指纹是一个二进制向量，其位位表示特定结构特征的存在（1）或缺失（0）。取决于如何计算这些结构特征，我们将它们分为`structural`（结构）和\
  \ `hash`（哈希）指纹。结构指纹的点位编码了分子是否与预定义的子结构集匹配，即这些子结构是否是分子图的真子图。两个示例是分子访问系统（MACCS）键和 PubChem\
  \ 数据库中使用的 CACTVS 子结构键。\n\n\n\n\n哈希指纹（Hash fingerprints）采用了不同的方法。为了计算哈希指纹位，会枚举以特定原子为根的具有\
  \ `N` 个原子的所有线性子结构（`N` 通常选择在 3 到 7 之间）。每个线性子结构根据其结构属性转换为字符串，然后通过哈希函数转换为整数 `i`。随后，将指纹位向量中对应的第\
  \ `i` 个位置设置为 1。这类指纹的典型例子包括日光指纹（Daylight Fingerprints）和扩展环状指纹（ECFP）。^(20)\n\n## 2.5.\
  \ 其他结构化表示法\n\n在化学信息学中，已经开发了许多其他分子表示形式，特别是为了表示某些特定类型的分子。例如，糖类使用霍沃斯投影（Haworth projection）表示更好，而费舍尔投影（Fischer\
  \ projection）则适用于表示单糖。用于多种化学信息学任务的一种通用表示形式是简化分子输入线性条目系统（SMILES）编码。^(21) 本质上，这种表示将分子图线性化为一组\
  \ ASCII 字符字符串。SMILES 字符串通过以下通用算法的变体从化学图中形成：\n\n• 首先，移除所有氢原子，并通过移除环路（例如断开环结构）将分子图转换为生成树。断开的键用整数标记，以便重建。\n\
  \n• 然后，按照深度优先顺序访问生成树；每当访问一个新原子时，就会将相应的原子符号添加到 SMILES 字符串中。树分支用括号标记。\n\n尽管 SMILES\
  \ 字符串本质上是字符序列，但它们通常被认为是分子图的结构化表示，因为它们是基于遍历构建的。由于其构建方法，SMILES 字符串并不是唯一的，即通过改变生成树的根节点或断开环的顺序，不同的\
  \ SMILES 字符串可以对应同一个分子。事实上，具有 `n` 个原子的分子可以用至少 `n` 种不同的 SMILES 字符串表示。事实上，大多数化学软件包都包含了规范化算法，以确保一个分子与一个唯一的\
  \ SMILES 字符串关联^(22)（少数退化情况除外）。尽管存在这些问题，SMILES 编码在整个化学信息学领域被广泛采用。例如，规范 SMILES 常用于在大型数据库中索引分子。\n\
  \n关于其他结构化表示，带标记的有向位置无环图（DPAGs）被用于先驱性研究，这些研究试图直接从分子结构预测 QSAR/QSPR 目标（见第 3.3 节）。DPAG\
  \ 与 SMILES 字符串也有：事实上，在构建 SMILES 字符串期间遍历的树是 DPAG 类型数据结构的一个子例（DPAGs 包含无环有向图类，在每个节点的子节点上定义了全序）。因此，DPAG\
  \ 可以被视为类似于 SMILES 方法的规则集表示分子的另一种方式。在图 1 中，我们展示了表示分子的几种方法。\n\n## 3. 用于 QSAR/QSPR\
  \ 的深度学习\n\n本节介绍了 QSAR 和 QSPR 分析，这可能是机器学习应用最广泛的领域。我们的讨论遵循历史视角，从最初不直接依赖分子结构而处理这些任务的方法，到化学信息学中直接处理结构的早期方法，逐步引导出处理通用类图的方法论。对于时间线上的每一步，我们都描述了传统的建模方法及其现代深度学习对应物。\n\
  \n```\n![images](img/fig6_1.jpg)\n```\n\n图 1. 咖啡因分子的不同表示形式：(a) 它的化学式；(b) 带有 SMILES\
  \ 编码下标的二维化学表示；(c) 其可能的分子描述符的子集；(d) 对应的分子图，其中双键用连接原子对的无向边表示，注意**为了表示更简洁，氢原子被省略了**。\n\
  \n### 3.1. 问题\n\nQSPR/QSAR 的基本假设是化合物的化学结构与其物理性质或受体活性之间存在直接关系，如图 2 所示所示。此外，假设这种关系可以被量化。换句话说，QSAR\
  \ 和 QSPR 方法的目标是找到满足以下关系的![](img/f.jpg)\n\n```\n![](img/eq6_1.jpg)\n```\n\n```\n\
  ![images](img/fig6_2.jpg)\n```\n\n图 2. QSAR/QSPR 分析的示意图。\n\n在这里，Property 代表感兴趣的任意化学性质：例如针对生物目标的活性或溶解度、极化率等连续量。Structure\
  \ 指描述分子结构的任何表示。为了找到合适的![](img/f.jpg)，需要顺序解决两个子问题：^(23, ^(24)\n\n• *特征表示*，即找到将分子映射到一组有效解决任务特征的编码函数；\n\
  \n• *映射*，即在给定分子适当编码的情况下，找到可以预测感兴趣的化学或生物目标的（线性或非线性）映射函数\n\n### 3.2. 基于描述符的方法\n\n\
  传统 QSPR/QSAR 分析的主要问题是找到一种有效的数值表示，保留化学图中的化学和拓扑信息，并与目标性质或生物活性相关联。这种数值表示用于传统的数学模型（例如多元线性回归），量化化合物特定结构特征与目标值之间的关系。\n\
  \n从历史上看，结构-活性和结构-性质关系的系统方法主要由 Hansch 等人在 20 世纪 60 年代引入，^(25, ^(26) 开发了能够将生物活性与量化生物活性化合物物理性质的数值描述符相关的方程。遵循这种开创性方法的传统方法基于领域知识引导的特征提取，以获得一组合适的描述符（根据第\
  \ 2.3 节中介绍的分类），即使用问题领域的扁平或基于特征的表示（参见 Bianucci 等人的回顾^(27)）。然后，这些向量通过线性代数或统计技术（如多元线性回归、主成分分析\
  \ PCA、部分最小二乘法 PLS，^(28)）与目标性质或生物活性相关，或者更强大的机器学习/计算智能技术，例如遗传算法、^(29, ^(30)前馈神经网络^(31–33)（NNs）和支持向量机。^(34,\
  \ ^(35)\n\n\n\n\n尽管神经网络（NNs）自 20 世纪 90 年代以来应用于基于描述符的表示，但首次报道的深度学习（DL）在 QSAR/QSPR\
  \ 场景中的成功应用可追溯到 2012 年，当时一个没有化学信息学领域知识的机器学习研究小组利用多任务深度神经网络（mt-DNN）赢得了默克化学化合物活性挑战。后来在\
  \ 2015 年描述了与该获胜方案类似的架构.^(36) 从那时起，mt-DNN 范式被广泛用于处理 QSAR/QSPR 任务.^(37) 研究表明，大量的 mt-DNN\
  \ 架构在 QSAR 上的表现通常优于单任务架构^(38)，也优于随机森林等其他机器学习算法。(([39) 在其他用于 QSAR/QSPR 任务的架构中，深层置信网络^(40,)\
  \ ^(41)、深度自动编码器^(42) (AEs) 以及卷积神经网络^(43) 已成功应用。\n\n### 3.2.1 局限性\n\n传统的基于描述符的 QSAR/QSPR\
  \ 方法将上述特征表示问题分解为两个子任务：(1) 寻找“正确”的信息来捕捉与预测任务相关的分子结构特征；(2) 将此类信息以数值形式编码，以便供学习算法处理。尽管这在许多情况下很有用，但在以下情况下此类方法的适用性受到限制：\n\
  \n• 无可用的化学描述符。例如，无机金属配合物没有已知描述符。\n\n• 解决任务所需的描述符数量和类型不是`a priori`的。这可能会产生两种相反的副作用：使用过少的描述符可能导致预测性能差；相反，使用过多的描述符可能会导致不必要的噪声，增加学习难度。\n\
  \n虽然这些局限性影响了基于描述符的方法在特定任务上的适用性，但限制其跨任务使用的更通用的缺点是，描述符不是目标不变的。换句话说，不同的任务需要其特定的描述符集，这意味着每当目标发生变化时，必须通过试错选择一组全新的、完整且相关的描述符集，这通常需要某种形式的专家知识。注意，即使诉诸特征选择方法也无法完全解决该问题，因为初始描述符集可能不包含当前\
  \ QSAR/QSPR 分析所需的相关信息。除了这些要求采用更灵活建模策略的缺点外，传统方法还利用了对分子的某种不充分的表示。事实上，分子的结构丰富性通过其分子图可以更清晰、更自然地传递。这些动机最终导致了一类模型的发展，用于学习从分子图到感兴趣目标的直接映射。\n\
  \n### 3.3. 基于递归神经网络的方法\n\n图数据机器学习领域的开创性方法可追溯到 1997 年^(44)（更多信息参见文中参考文献），当时首次提出了一种处理结构化数据的架构，称为泛化递归神经元。次年引入了一种学习树结构化数据的通用框架^(45)（从连接主义和概率两个角度来看），并首次了化学信息学应用。^(46)\
  \ 前述的两项贡献描述了现在所知的递归神经网络（RecNN）模型。本质上，RecNN 在感兴趣的结构上“展开”一个神经网络。根据该公式，RecNN 在树（或 DPAG）数据结构的每个节点上操作：\n\
  \n```\nimages/eq6_2.jpg\n```\n\n```\nimages/eq6_3.jpg\n```\n\n其中 `f` 是一个神经网络，`g`\
  \ 是到输出空间的映射（线性或非线性，另一个神经网络），`n` 是树节点，`x[n]` 是其属性（例如，分子的原子类型），而 `h` 用于表示编码向量，其目的是跟踪已访问的结构。在实践中，在方程\
  \ (6.2) 中节点编码使用 `f` 更新，根据其局部信息 `x[n]` 和子树编码 `S(n)` 通过 `g` 映射到输出空间，产生输出值 `y[n]`，如方程\
  \ (6.3) 所示。值得注意的是，`f` 和 `g` 函数可以在第 3.1 节 中解释：`f` 函数对应于给定分子结构化表示的编码，`g` 对应映射函数。为了计算整个结构的编码，可以将每个节点的输出聚合在一起（例如求和），或者更常见地取根节点的编码。该过程见图\
  \ 3。\n\n在化学信息学特别是 QSAR/QSPR 建模中，RecNN 的出现带来了视角的转变。与传统方法不同，RecNN 的输入是分子的变长结构表示。此外，RecNN\
  \ 不需要单独解决特征表示和映射问题：相反，化学结构的数值编码以及下游回归或分类函数可以联合学习（即方程 (6.2) 和 (6.3) 中的 `f` 和 `g`\
  \ 函数作为同一个 RecNN 模型共同训练）。换句话说，RecNN 可以优化从结构化输入空间到活性/属性输出空间的直接映射。最后，它们是自适应的，即从示例学习。这意味着\
  \ RecNN 为化学结构分配数值代码，并根据预测任务进行优化。因此，分子之间的相似性或通过内部层计算的“拓扑索引”会被模型调整以适应当前问题。\n\n```\n\
  images/fig6_3.jpg\n```\n\n图 3 使用 RecNN 处理 DPAG。注意方程 (6.2) 中的属性值 `x` 经过颜色编码。实线箭头表示\
  \ DPAG 依赖，虚线箭头表示编码计算。(a) 显示了计算的中间步骤，突出了因果律。为了计算节点 2 的编码，可以使用节点 (4,) (5) 和 6 的编码，因为它们已经计算过了。模型尚未访问其余节点的编码，因此带有阴影。(b)\
  \ 显示了结构遍历结束时的情况，此时根节点 (1) 的编码已计算。此时，可以使用根节点计算整个 DPAG 特定的输出 `y[D]`，即对于 QSPR 或 QSAR\
  \ 分感兴趣的属性或活性。\n\n有趣的是，RecNN 还有卓越的理论结果支持，这些结果支持了编码的通用性，并表征了它们能够学习的函数类型。具体而言，证明 RecNN\
  \ 能够任意地近似从标记树到实值的任何函数的通用近似定理^(47) 以及从标记 DPAG 到实值的函数的定理^(48) 已经得到证明。\n\n\n\n\nRecNNs\
  \ 的有效性已多种截然不同的 QSPR/QSAR 问题中得到了评估，例如：预测一组苯二唑类药物对苯二卓/GABA 受体非特异性活性（亲和力）的 QSAR 分析^(23,)\
  \ ^(27)，预测 A1 腺苷受体配体对受体的亲和力^(49)，烷烃的 QSPR 分析^(27)，小分子的热学性质^(24)，离子液体，聚合物性质^(51,)\
  \ ^(52) 以及共聚物^(53)，最后是毒性预测^(54)。在所有这些场景中，RecNNs 在准确性方面与*特有的*传统方法相比展现出了竞争性的，为利用通用图形式的分子结构的更先进方法铺平了道路。最近，RecNNs\
  \ 已应用于预测分子的水溶性^(55) 以及毒性预测和血脑屏障渗透^(56)。\n\n### 3.3.1. 局限性\n\nRecNNs 的主要局限性是底层的因果假设，这意味着必须获得子节点的编码才能获取某个节点的编码（见图\
  \ 3(a)）。这意味着编码计算必须按顺序进行，并限制了 RecNNs 在受限图类的适用性，在这些图中，这种顺序是可以叠加的，例如树或 DPAGs（除非在考虑动力系统时允许相互依赖，如下节讨论所示）。\n\
  \n### 3.4. 基于深度图网络的方法\n\n不同的作者已经开展了处理通用类图高效解决方案的研究。一种递归方法是定义一个基于收缩映射的动力系统，该系统可以通过松弛技术求解^(57)，允许人们通过递归模型处理循环图，并通过应用收缩约束来确保收敛。另一种方法称为\
  \ `NN4G`^(58)，它基于对于相当通用图结构的构造性上下文处理。与以前用于结构的神经网络相比，这种开创性的方法放宽了因果递归假设，开创了目前图的深度/卷积神经网络路线。事实上，`NN4G`\
  \ 中使用的方法可以从卷积神经网络的角度来解释。特别是，如果将局部感受野限制在每个节点的局部拓扑，而不是用于图像处理任务的局部 2D 卷积矩阵，就可以看到这一点。源自\
  \ `NN4G` 的方法最近被统一在*深度图网络*^(8) (DGNs) 的名下。DGN 处理图 `G` 在第 ![](img/in172_2.jpg) 层的的方式（可能存在细微差异）的简单表述如下：\n\
  \n```\n(images/eq6_4.jpg)\n```\n\n```\n(images/eq6_5.jpg)\n```\n\n其中 `g` 是任何线性或非线性映射，`f`\
  \ 是一个神经网络，`v` 和 `u` 用于表示节点集 `V(G)` 中的节点，`h` 表示上下文向量（也是编码向量），`C(v)` 是图中连接到 `v` 的节点集合。根据惯例\
  \ ![](img/in172_1.jpg) 是节点特定特征的向量（例如原子类型）。在实践中，在公式 (6.4) 中，首先将所有邻居节点 `C(v)` 的编码聚合在一起（在这种情况下使用求和）；然后使用\
  \ `f` 根据其当前编码和邻居的聚合编码来更新节点编码。更新后的编码向量成为后续 DGN 层的输入，并对 `L` 层中的每一层重复该过程（实现跨越图的上下文传播^(58)）。最后，如公式\
  \ (6.5) 所示，通过聚合（例如求和）为每个节点获得的编码，计算出整个图的层特定表示 ![](img/in173_3.jpg)。在图 4 中，这一过程视觉化展示了两层。\n\
  \n![images](img/fig6_4.jpg)\n\n图 4. DGN 在示例图上的主要机制，其中节点编码用颜色区分。关注节点 4，我们看到它接收了来自前一层的编码上下文（由虚线表示）、来自自身以及其邻居节点\
  \ 2、3 和 5 的上下文。相同的机制应用于图中的所有节点（未显示）。注意 ![](img/in173_1.jpg) 的编码（颜色）在更新后发生了变化。最后，层\
  \ `ℓ` 处节点的上下文被聚合以形成一个层特定的图表示 ![](img/in173_2.jpg)。\n\nDGN 的发展路线在 2015 年被深度学习社区重新发现。从那时起，它在许多任务中都得到了成功应用。DGN\
  \ 的一个有趣的应用是学习所谓的“神经指纹”，这在预测溶解度和药效方面取得了成功^(60)。更多应用包括分配系数预测^(61)、毒性和不良反应预测^(62) 以及\
  \ ADME 分析。最后，DGNs 还与神经图灵结合^(65)，在任务上优于非深度学习^(66)。Sun 等人^(67) 对 DGN 在药物发现中的应用进行了广泛综述。\n\
  \n### 用于设计的深度学习\n\n本节介绍从设计，即为药物发现和开发产生合适的分子（先导化合物）。在第 3 节中，我们讨论了从分子结构预测化学性质的方法。我们关注符合输入规格的的设计。在化学信息学中，这对应\
  \ QSAR/QSPR 方法试图解决的对称问题，被称为*反 QSAR/QSPR* 问题。我们本讨论的目标不是回顾已发表的方法（这类综述请参见参考文献 68 和\
  \ 69）；相反，我们旨在为读者提供批判性地阅读当前文献所需的知识。\n\n### 4.1. 问题\n\n我们将反 QSAR/QSPR 问题定义为寻找满足以下条件的函数\
  \ ![](img/in174_1.jpg)：\n\n```\n(images/eq6_6.jpg)\n```\n\n其中我们相同的名称以及公式 (6.1) 中的反函数来强调与正向\
  \ QSAR/QSPR 问题的关系。这一概念的视觉化方案可以在图 5 中看到。从头设计的输出空间是整个化学空间：其巨大的规模意味着通过枚举所有可能的分子来解决反\
  \ QSAR/QSPR 问题在计算上是不可行的。因此，需要更复杂的和“智能”的搜索策略。\n\n![images](img/fig6_5.jpg)\n\n图 5.\
  \ 从头设计的示意图。反函数 ![](img/in175_1.jpg) 强调了与 QSAR/QSPR 分析的关系。\n\n\n\n\n从概率的角度来看，该问题可以归因于学习化学空间上的条件分布。这涉及到解决两个非平凡的子问题：\n\
  \n• `Generation`（生成），即在化学空间上学习一个有意义且易于采样的分布。解决该问题的深度学习方法是使用深度生成模型（DGMs）([2)，即通过深层神经网络对采样过程进行参数化的模型。\n\
  \n• `Optimization`（优化），即使生成过程向期望的分子偏斜。这需要应用相关技术，使得采样器更有可能选择有用的分子而不是无用的分子。\n\nDGMs\
  \ 在生成图像、声音和文本方面已取得了令人印象深刻的结果。然而，在分子情况下，由于样本空间的内在性质，增加了一层的复杂性。首先，化学空间是一个离散对象，其数学处理非常困难。这意味着在大多数情况下，基于梯度的优化是不可行的。其次，化学空间是稀疏的：化学空间中的微小移动（例如，从分子中移除一个原子）可能会导致采样出一个完全无用的分子。第三，对一组目标分子进行条件约束意味着化学空间的大部分点概率为零，只有极小一部分实际上包含感兴趣的分子。这些原因使得生成和优化成为两个极具挑战性的任务。\n\
  \n### 4.2. 架构\n\n在逆 QSAR/QSPR 中，使用了四种 DGM 架构：循环神经网络([70) (RNNs)、变分自动编码器([71) (VAEs)、生成对抗网络([72)\
  \ (GANs) 以及对抗自动编码器([73) (AAEs)。对于每一种，我们给出了其内部机制的直观视图。\n\n### 4.2.1. 循环神经网络\n\nRNN\
  \ 是一种专门为处理变长序列设计的学习模型。RNN 是在序列元素上展开的神经网络（实际上，它们应用于线性结构的 `RecNN` 的特例）。为了保留序列的全局信息，RNN\
  \ 使用在处理完每个元素后更新的编码向量。然而，原生 RNN 受到梯度消失和梯度爆炸问题的影响([74)，这限制了它们对元素数量较短序列的适用性。因此，通常使用专门为解决这些缺陷设计的特定\
  \ RNN 变体，例如长短期记忆（LSTM）和门控循环单元（GRU）网络。在这里，为了简洁，我们将使用 `RNN` 来指代这两种变体中的任何一种。尽管 RNN\
  \ 是可以解决序列上许多不同任务的通用框架，但我们关注的是多对多的任务，即网络为每个序列元素返回一个输出。在这种背景下，可以使用“教师强制”([75) 训练 RNN\
  \ 以最大化训练数据的概率，这对应于以下目标函数：\n\n```\nimages/eq6_7.jpg\n```\n\n其中 `n` 是序列的长度，`f` 是展开的神经网络，`x[t]`\
  \ 是时间步 `t` 的通用序列元素，`h[t−1]` 是时间步 `t — 1` 的编码向量（根据惯例，`h[0]` 通常为零向量），`g` 是输出神经网络。\n\
  \n### 4.2.2. 变分自动编码器\n\nVAE 是一种编码器-解码器架构，其中一组隐变量对隐空间进行建模。模型通过编码器（将数据点转换为隐向量）联合学习隐空间的后验分布，并通过解码器（执行从隐空间到数据空间的逆映射）作为数据的生成模型来学习生成分布。具体而言，VAE\
  \ 优化数据对数似然的以下下界：\n\n```\nimages/eq6_8.jpg\n```\n\n其中 `x` 是数据点（分子），`z` 是其隐表示。例如，在\
  \ SMILES 的情况下，`z` 可以是 RNN 的编码向量。在公式 (6.8) 中，左侧项是解码器 `p(x | z)` 在编码器学习的后验 `q(z |\
  \ x)` 下的期望。右侧项是后验与某种易于采样先验 `p(z)` 之间的 KL 散度（误差）。如果先验是同性高斯分布，该项具有闭式形式。\n\n### 4.2.3.\
  \ 生成对抗网络\n\nGAN 是隐式生成模型，即它们在不显式优化对数似然项的情况下学习从分布中进行采样。换句话说，它们只学习从分布中采样的方法。GAN 由两个（通常是深度）网络组成：一个从先验采样的点映射到数据点的生成器，以及用于区分真实样本和生成样本的判别器。判别器试图最大化区分能力，而生成器试图通过生成真实的样本来“欺骗”判别器。GAN\
  \ 优化以下极大目标函数直到找到纳什均衡：\n\n```\nimages/eq6_9.jpg\n```\n\n其中 `G` 是生成器，`D` 是判别器，`pdata`\
  \ 是真实数据分布，`p(z)` 是先验分布。\n\n### 4.2.4. 对抗自动编码器\n\nAAE 是标准 AE 和 GAN 之间的混合模型。基本上，它们是通过对抗学习实现的\
  \ AE。具体来说，AAE 优化以下目标函数：\n\n```\nimages/eq6_10.jpg\n```\n\n其中第一项是重构误差（如 VAE 所示），第二项是一个使用编码器作为生成器的\
  \ GAN，其判别器被训练以区分编码器产生的隐码和从先验 `p(z)` 中抽样的样本。\n\n## 4.3. 生成\n\n在这里，我们关注生成子问题。正如第 4.1\
  \ 节所示，这个问题涉及到学习一个定义适当的生成过程，即用于生成分子的参数化函数。在 VAE 和 AAE 等基于似然的生成模型情况下，该函数由解码器实现；而在\
  \ GAN 情况下，它由生成器实现。生成过程的输出取决于模型负责输出的表示。特别是，我们研究了两种可能的方法：生成分子的 SMILES 字符串或生成分子图。后者可以进一步细分为学习与分子图相关的矩阵集，或通过图变换序列生成分子图。\n\
  \n### 4.3.1. 基于 SMILES 的生成\n\n\n\n\n\nSMILES 字符串本质上是 ASCII 字符序列。因此，表示为 SMILES 字符串的分子数据集可用于学习相应的\
  \ `language model`，即对 SMILES 字符序列的概率分布。为了供 `RNN` 使用，SMILES 字符串需要被编码为数值形式：为此，它们首先被分解为\
  \ `tokens`：在 SMILES 的情况下，每个 token 都是单个 ASCII 字符。然后，从数据集中构建一个包含唯一 token 的词表![](img/v.jpg)。词表中的第\
  \ `i` 个 token 被编码为大小为 ![](img/in178_1.jpg) 的 one-hot 向量，其中位置 `i` 被置为 1，其余所有位置均为\
  \ 0。因此，来自训练数据集的 SMILES 字符串变成了 one-hot 向量序列，其似然在训练过程中通过 `RNN` 最大化。\n\n**生成过程：** 在学习语言模型后，可以对\
  \ `RNN` 进行采样，以逐字符的方式生成 SMILES 字符串，即在时间步 `t` 采样的字符将成为时间步 `t + 1` 的输入。这种生成过程被称为 `auto-regressive`（自回归），因为步骤\
  \ `t` 的输出依赖于之前所有步骤（`< t`）的所有输出。\n\n### 4.3.2 基于矩阵的分子图生成\n\n基于矩阵的方法以矩阵形式生成分子信息.^(76,)\
  \ ^(77) 为了实现这一点，数据集中的分子图需要被编码为矩阵。为了说明起，我们考虑训练分子由三种不同的矩阵表示的情况：\n\n• 一个方矩阵![](img/in179_1.jpg)，当第\
  \ `i` 个和第 `j` 个原子之间存在化学键时，位置 `(i, j)` 为 1；\n\n• 一个矩阵![](img/in179_2.jpg)，其第 `i`\
  \ 行是一个 one-hot 向量，用于指定第 `i` 个原子的类型；\n• 一个矩阵![](img/in179_3.jpg)，其第 `k` 行是一个 one-hot\
  \ 向量，用于指定第 `k` 对原子的键类型（根据约定，如果第 `k` 对原子未连接，则为零向量）。\n\n上述，`N` 是数据集中最大图的原子数量，`A` 是原子类型数量，`B`\
  \ 是键类型数量（为了简单起见，我们假设这是关于原子和键的唯一信息）。在分子被编码成这种形式后，可以训练模型以最小化训练矩阵与网络输出之间合适的目标函数。用于该任务的标准目标函数是最大似然估计或各种形式的矩阵相似性。\n\
  \n**生成过程：** 要生成分子图，首先需要逐条目采样邻接矩阵。一旦图结构确定，就可以根据不同的设置对剩下的两个矩阵进行采样。例如，可以先采样键类型，然后根据键信息条件采样原子类型。\n\
  \n### 4.3.3. 分子图的增量式生成\n\n最近，提出了一种新型生成过程.^(78) 简而言之，图生成被表述为一系列动作，这些动作逐步将一个初始空图转换为目标图。这假设分子首先被编码为图，然后编码为动作序列。目标函数是一个复合损失，用于最大化数据集中动作序列的似然。\n\
  \n**生成过程：** 由于转换图的每种决策都是通过一个具有概率输出的 `NN` 实现的，采样图等同于从所有架构组件中采样硬性决策。需要考虑的一个关键步骤是，每个决策都取决于图到目前为止的状态。二分类决策（例如，再添加一个节点）可以从\
  \ sigmoidal 输出中采样，而多分类决策（例如，为边分配何种键类型）可以从相应的类别分布中采样。最后，注意这种生成过程是自回归的，因为在某一步中采取的动作依赖于之前步骤所采取的动作。生成过程的一个步骤的示例所示图\
  \ 6。\n\n![images](img/fig6_6.jpg)\n\n图 6. 增量式图生成的一个步骤。(a) 根据当前图状态决定是否添加原子；(b) 使用当前状态初始化新原子并采样其类型；(c)\
  \ 决定新原子将如何以及与哪些原子连接；(d) 为每个新键采样键类型。在 (e) 中展示了增量步骤后获得的图。\n\n### 4.3.4. 讨论\n\n将分子生成为\
  \ SMILES 字符串是 `DGMs` 在分子生成任务上的首次成功应用。通过 SMILES，生成速度快且使用了语言模型，而这些模型已被 `DL` 社区进行了非常充分的研究和优化。然而，SMILES\
  \ 生成器在`化学有效性`^(79)方面经常出现问题，即它们难以处理长期依赖（例如括号的开启闭合），并倾向于产生无效分子。事实上，关于这些方法的许多研究基于寻找有用的启发式方法，以保持生成分子的高有效性。一些尝试包括让模型学习\
  \ SMILES 的语法规则而不是语言^(80) 或借用来自编译器领域的技术，如属性语法和语法导向翻译.^(81) 最近，开始开发基于 SMILES 子字符串而非字符的方法.^(82,)\
  \ ^(83)\n\n基于图的方法是有优势的，因为它们基于最自然的分子表示形式。研究还证明，它们比基于 SMILES 的方法更容易产生有效分子.^(84,) ^(85)\
  \ 然而，它们也有缺点：其一是训练和采样速度明显慢于基于 SMILES 的方法。它们还倾向于关注化学空间的限制子集，导致分子缺乏多样性.^(68) 特别基于矩阵的方法无法泛化到任意大小的分子图（因为邻接矩阵和节点特征矩阵的最大尺寸是预定义的）。(76)\
  \ 增量式方法缓解了其矩阵方法的许多问题，尽管与基于 SMILES 的方法相比，它们仍然容易产生较高的重复率。\n\n**排列不变性**\n\n对于所有这三种方法，生成过程都不是排列不变的。SMILES\
  \ 字符串基于特定 `DPAG` 诱发的固定顺序。在基于矩阵的表示中，打乱分子图邻接矩阵的列或改变图转换的顺序通常不会生成相同的图。由于这些原因，该领域的关键挑战之一是如何设计排列不变的生成策略。最近，已经提出了解决该问题的首次尝试.^(86)\n\
  \n##### 4.3.5. 类别分布的采样\n\n\n\n\n\n正如我们所见，生成分子需要对多个概率分布进行采样。对于伯努利随机变量（例如 sigmoid\
  \ 单元的输出），采样对应于舍入最近的整数。对于分类分布，一种直接的方法是`贪婪采样`^(79)，在每一步都选择概率最大的标记。然而，这在某些情况下可能并非理想的，例如\
  \ RNN 已知会输出非常尖锐的概率分布，导致样本之间的多样性较低。`模拟退火`可以更频繁地从分布的尾部进行采样。文献中也提出了贪婪采样的其他替代方案.^(83,)\
  \ ^(87,) ^(88)\n\n### 4.3.6. 评估指标\n\n有几种指标可以对分子生成器进行评估。原则上，理想的生成器应该具备以下特性：它应该输出化学上有效的分子，即从化学角度来看合理的分子；它应该输出新颖的分子，即训练数据集中不存在的分子；它应该输出唯一的分子，即它应该避免反复重复相同的分子模式。最后一个所需的特性与多样性概念直接相关，该概念传达了一种相当刻意的观点。理想情况下，生成的分子应该：(i)\
  \ 在结构上与训练分子有足够的“差异”，以跨越尽可能大的化学子空间，同时 (ii) 在结构上足够“接近”，以具有相似且有趣的化学性质。更准确地说，上述特性可以通过以下指标进行衡量：\n\
  \n- `Validity`（有效性）：这涉及在生成的分子总数中化学上有效分子的比例。通常，该指标可以通过使用第三方 `SMILES` 检查器对与分子相关的 SMILES\
  \ 字符串进行有效性验证来评估。\n\n- `Novelty`（新颖性）：包括在训练集分子总数中生成的“未见”分子的百分比。\n\n- `Uniqueness`（唯一性）：包括在生成的分子总量中唯一（不重复）分子的数量。\n\
  \n- `Diversity`（多样性）：由于多样性是一个复杂概念，无法通过单一指标衡量，而是通过一组指标衡量。`Internal`（内部）多样性可以通过对生成分子集中所有可能的对应用距离函数并平均结果来衡量。相反，`external`（外部）多样性衡量生成集中每个分子相对于其训练集中最近邻居的多样性。通常用于此类评估的距离函数是\
  \ `Tanimoto distance`，这是一种定义在分子相关的分子指纹上的位运算距离函数。另一个近期指标是 `Frechét ChemNet Distance`^(89)，它通过首先将训练集和生成集输入预训练的深度神经网络（`ChemNet`^(90))进行属性预测，然后比较在倒数第二层计算的相应激活向量的统计信息。\n\
  \n其他实用的评估指标还基于训练集和生成集之间化学性质分布的比较，例如量化它们的 Kullback–Leibler 距离或 Wasserstein 距离。\n\n\
  ### 4.4. 优化\n\n现在我们将关注转向第 4.1 节中描述的优化问题。具体而言，我们描述了如何偏置生成过程，以采样具有所需属性的分子。然后，我们回顾了一些实现此目标的标准技术，并强调它们的优点和局限性。最后，我们通过展示用于评估结果的有用指标结束讨论。\n\
  \n#### 4.4.1. 条件生成\n\n条件生成是指在生成过程的输入中添加所需属性的向量。对于离散属性（例如分子的阈值化活性），这些向量是经过独热编码的。条件生成可以应用于任何深度生成架构。对于\
  \ RNN，初始上下文向量可以是（或可以连接到）条件向量的。对于 VAEs^(91)–93) 和 AAEs，^(94)，相同的机制可以应用于初始化解码器的潜向量。在\
  \ GANs，^(95)，相同的原理可以应用于从先验中采样的向量。事实证明，条件化仅在所需化学属性是离散且经过独热编码的情况下是有效的。^(91) 这种技术的一个不良缺点是，数据分布与条件向量的分布是不独立的。这种方法的另一个问题是，模型可能会导致新颖性低，因为它倾向于对条件向量而非潜向量给予更多“重视”，因为这样做解决了一个更容易的任务。^(68)\n\
  \n#### 4.4.2. 潜空间优化\n\n潜空间优化方法直接在潜空间中优化分子的所需化学属性。因此，它们需要编码器-解码器架构。基本上，模型与一个预测器联合训练，该预测器接收潜空间中的点并预测它们的化学属性.^(84)这强制潜空间不仅根据结构相似性组织，还根据化学属性组织。通过为不同的化学属性训练多个预测器可以实现多优化；然而，多优化会导致训练不稳定，因为每个预测器都试图最小化其目标函数。如果学习良好，潜空间可以执行此类任务，如分子之间的线性插值^(79)或使用梯度上升进行潜空间优化.^(84)这种技术的缺点之一是，目前没有已知的方法可以直接在潜空间上强制化学有效性；因此，除非在采样时采取适当措施，否则这些模型倾向于产生无效分子。对于基于\
  \ SMILES 的生成，这一问题通过使用语法感知分子表示强制有效性^(81)或使用受约束的贝叶斯优化得到了部分解决^(96)。在基于图的迭代方法中，掩码通常用于防止意外的图变换.^(85,)\
  \ ^(86)。\n\n\n\n\n强化学习^(97) 方法基于将 DGM 解码器训练为一个`agent`（代理），它对分子执行`actions`（动作）。每个动作都会使代理进入一个新的`state`（状态）。状态通过`value\
  \ function`（价值函数）进行评估，而动作则获得`reward`（奖励）或惩罚。目标是找到一种能够产生最大奖励的最优`policy`（策略，动作序列）：随着过程的迭代，采样器会学习最大化期望奖励的策略。动作取决于所使用的生成过程的类型：对于\
  \ SMILES 字符串，一个动作可能意味着向正在生成的字符串中添加一个标记.^(98)。另一种，在基于图的迭代生成中，它可能对应于执行某种变换.^(99)。奖励函数通常与正在优化的化学性质有关，或者倾向于选择化学上有效的分子而非无效分子.^(98,)\
  \ ^(100)。通过将多个指标组合到加权奖励函数中，可以实现多目标优化。强化学习通常应用于没有潜空间^(101)的 SMILES 语言模型和 GAN.^(77,)\
  \ ^(102)这些方法的问题在于，尽管它们倾向于生成具有优化性质的分子，但与训练分子相比，往往缺乏结构贯性。\n\n#### 4.4.4 迁移学习\n迁移学习基于这样一个观点：模型可以在具有大型数据集的相当通的任务上进行`pre-trained`（预训练），以学习与任务无关的特征。一旦学习完成后，就可以在感兴趣的任务上进行`fine-tuned`（微调/专门化）.^(103)。因此，微调任务不需要大量数据，因为大多数特征已经在预训练期间学习过了。特别是，自动编码任务已用于预训练.^(83)。这种技术适用于`de\
  \ novo`（从头开始）生成场景，在这种场景中有许多分子可供训练，但只有少数分子具有所需的特征。迁移学习几乎是有益的，而且它通常与其他优化方法结合使用。然而，预训练需要广泛的数据集（并不总是可用）以及大量的计算资源。\n\
  \n#### 4.4.5 评估指标\n为了评估优化任务的性能，一个直观的计算指标是`success`（成功率），即生成的分子集中显示出输入给定特征的分子比例。关于生物活性，确切知道生成的分子是否活跃需要实验室实验或临床试验。在这些情况下，真实值活性（ground\
  \ truth activity）通过预训练的 QSAR/QSPR 预测器来估计。对于连续性质的优化，一种常用的性能指标是`improvement`（改进率），它衡量生成集中与训练集相比，性质的平均增加或减少。请注意，应该在清除生成集中的重复项后评估成功率和改进率，以避免结果偏差。\n\
  \n### 5. 结论\n本章讨论了化学信息学的两个关键应用：QSAR/QSPR 分析和`de novo` 设计。文章从历史角度介绍了 QSAR/QSPR 分析，考察了机器学习在结构化数据方面的进展发展。尽管这两个主题密切相关，但在解决使药物发现更高效更有效所面临的挑战方面，它们是截然不同的。\n\
  \nQSAR/QSPR 分析是一个成熟领域，自 20 世纪 60 年代以来一直作为从已知样本评估分子化学性质的工具。该领域的主要挑战在于开发更强大的模型，以及如何提高现有模型的预测性能。另一个相关挑战是可解释性：我们期望未来的建模方法将是以解释为驱动的，以提高由\
  \ QSAR/QSPR 分析驱动的决策质量。过去 20 年 QSAR/QSPR 分析的历史无疑与机器学习不可分，因为处理分子图的固有问题是导致先进机器学习模型进展的重要推动力。同样，图深度学习社区与\
  \ QSAR/QSPR 分析社区之间日益增加的可能会推动密集的创新过程，从而实现互利。\n\n`De novo` 设计是一个相对较新的研究领域，特别是在使用深度学习方面。鉴于\
  \ DGM 在图像生成等各种任务中取得的成功，将其应用于逆向 QSAR/QSPR 问题的研究出现了前所未有的增长。尽管如此，仍有很大的改进空间。在许多需要进一步研究的方面，短期内研究应关注的重点是开发新型分子图的生成过程，以及改进优化技术以实现更针对目标分子性质的生成。在中长期，创新也可能来自新型\
  \ DGM 的开发。最近，该研究领域下一个突破方法的很有前景候选者是基于归一化流（normalizing flows）的生成模型.^(104)我们预计在逆向 QSAR/QSPR\
  \ 问题中的应用将在未来几年内快速增加。\n\n\n\n\n\n`DL` 的力量不仅在上述两个领域，在更广泛的化学信息学（Cheminformatics）中开辟了新的应用可能性。其中，我们提到了生物材料设计和自组装分子。在化学信息学与医学的交叉点上，`DL`\
  \ 应用正日益强劲的一个研究领域是针对个性化医疗目的对基因组、临床和化学信息进行整合分析。从更广泛的角度来看，虽然 `ML` 方法非常强大，但它们也需要对在样本外场景中的预测准确性进行仔细评估。从这个意义上说，严谨且基于原则的验证方法现在是这些应用中的必需，考虑到这些应用在影响人类健康的任务中起着至关重要的作用。特别是，我们提倡加强\
  \ `ML` 高水平教育，尤其是对于那些希望将其应用于自身专业领域的研究人员，这在 `QSAR/QSPR` 领域非常常见。这一讨论与 `EC/OECD` 成员国关于用于监管目的的\
  \ `QSAR` 模型验证所达成的原则密切相关。在 `ML` 方面，特别是在图 `DL` 的特定领域，已经采取了向正确方向迈进的步骤，^(105)但为了达到更高的标准，还需要广泛的集体努力。\n\
  \n未来需要解决的另一个紧迫问题涉及化学数据集的标准化和公共可用性。在线、开放访问大型且文档齐全的数据集一直是化学信息学中的一个传统问题。化学信息学的大部分研究传统是在制药公司或行业支持下进行的。因此，它们通常不像相关领域（如生物信息学）中的对应研究那样可见或易于获取（参见\
  \ `GeneBank`、`PDB`、`Swissprot` 等公共数据源）。从这个意义上说，公共机构已经开始朝这一目标努力，例如美国国家健康协会 (`NIH`)、国家癌症研究所\
  \ (`NCI`) 和用于毒性的美国环保保护局 (`EPA`)，以及欧盟的 `ECHA REACH`。\n\n结论是`QSAR/QSPR` 分析和`de novo`药物设计的终极问题尚未完全解答。如何将化学结构与生物属性联系起来并反之，仍然是困难且具有挑战性的任务。在未来几年里，我们预计\
  \ `DL` 作为寻找答案工具的作用将日益增加。\n\n## 参考文献\n\n1. A. Hopkins, Drug discovery: Predicting\
