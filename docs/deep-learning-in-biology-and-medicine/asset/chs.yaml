- "# 生物学与医学中的深度学习\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n生物与医学中的深度学习为该领域的最新进展提供了全面的概述。本书涵盖了从医学信息学到生物信息学应用的广泛主题。它专为医疗保健和生物科学中人工智能应用感兴趣的研究人员、从业者和学生设计。书中包含了参考文献和索引，使其成为进一步学习的宝贵资源。它还讨论了该面临面临挑战和未来方向，以及深度学习改变我们诊断和治疗疾病方式的潜力\n\
  \n## 关于编者\n\n![](img/pagevii.jpg)\n**Davide Bacciu** 是比萨大学计算机系的副教授，担任泛在人工智能实验室（Pervasive\
  \ Artificial Intelligence Laboratory）主任。他曾是利物浦摩尔斯大学神经计算小组和奥勒布鲁鲁大学认知系统实验室的访问研究员。他在\
  \ IMT 高级学院获得计算机科学与工程博士学位，并荣获 2009 年 Caiani 最佳博士论文奖。他合著了关于神经网络、生成式学习、图和嵌入式系统的 120\
  \ 多部著作。他是多个欧洲和国家研究项目的协调员。目前，他是意大利人工智能协会的秘书兼董事成员，以及 IEEE 神经网络协会的高会员。\n\n![](img/pageviii_1.jpg)\n\
  **Paulo J. G. Lisboa** 是利物浦摩尔斯大学计算机与数学学院的教授兼副院长。他曾任“地平线 2020 社会挑战 1：健康、人口变化”（全球最大的协调研究计划）的主席，以及工程与技术学会会医疗保健技术专业网络的主席。他还是可解释机器学习的长期倡导者，拥有超过\
  \ 250 篇同行评审论文。1992 年，他编选了第一本关于神经网络应用的书籍。他在利物浦大学学习数学物理，并在 1983 年获得粒子物理学博士学位。他于 1996\
  \ 年被任命利物浦摩尔斯大学工业数学讲座教授，担任研究生院和应用数学系主任。\n\n![](img/pageviii_2.jpg)\n**Alfredo Vellido**\
