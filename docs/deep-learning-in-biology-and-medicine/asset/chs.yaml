  \n# 第 5 章\n# 针对基因表达数据的代谢驱动潜空间学习\n\nMarco Barsacchi^∗,†,‡,§, Helena Andrés-Terré^‡,¶,\
  \ 以及 Pietro Lió^‡,∥\n\n*∗ 意大利罗伦萨大学信息工程系，50000 罗伦萨，意大利\n*† 比萨大学信息工程系，56122 比萨，意大利\n\
  *‡ 剑桥大学计算机，剑桥，英国\n*§ barsacchimarco@gmail.com\n*¶ ha376@cam.ac.uk\n*∥ pl219@cam.ac.uk\n\
  \n基因表达微阵提供了特定生物样本转录活动的表征。其高维特性阻碍了模式识别和提取过程。目前已经提出了几种方法来获取数据隐藏结构的信息。在这些方法中，深度生成模型为近似数据所在的流形提供了一种有力的方法。在这里，我们开发了\
  \ `GEESE`，这是一个基于深度学习的框架，为基因表达数据的流形学习提供了新的见解，利用代谢模型来约束所学习的表示。我们评估了所提出的框架，展示了其捕捉生物相关特征并在更简单的潜空间中编码这些特征的能力。我们证明了使用代谢模型驱动自动编码器学习过程如何有助于对未见数据实现更好的泛化。`GEESE`\
  \ 为生物数据的无监督学习问题提供了一个新视角。\n\n## 1. 引言\n\n代谢包含了复杂的化学反应网络，允许有机体将养分转化为能量以及生长、复制、防御和其他细胞所需的基础成分。代谢反应由酶介导，而酶又通过基因表达产生。然而，尽管存在这种紧密的联系，但从基因表达水平预测代谢表型的问题远未解决。1\n\
  \n基因表达微阵提供了生物样本中所有转录活动的快照，而这又是基因与环境因素之间复杂交互的结果。基因表达谱分析旨在捕捉细胞对疾病、遗传扰动和药物治疗反应的基因表达模式。然而，尽管转录组时代开启已二十多年，收集数据仍然比理解数据要容易得多。2\
  \ 由于样本通常由大量具有未知相关结构的变量表征，因此分析和理解这些数据极具挑战性。降维技术已广泛用于揭示隐藏在基因表达数据中的模式。3 由于学习任务的难度取决于信息的表示方式，因此，为数据找到一种良好的表示是至关重要的。\n\
  \n*流形假设*（manifold hypothesis）指出高维数据倾向于分布在低维流形附近，它是流形学习的基础。4 深度生成模型，如变分自动编码器（`VAEs`），5\
  \ 和生成对抗网络（`GANs`），6 换言之，它们近似了原始流形。\n\n在本文中，我们提出了一种学习基因表达数据结构的方法；为了改进现有技术，我们利用现有的代谢知识，通过基因组规模代谢模型（`GSMM`）8\
  \ 为了实现这一点，我们采用了深度生成模型（`β-VAE`）10。在这里介绍总体思想；详细描述将在后续章节中给出。\n\n假设我们有一组基因表达数据![](img/d.jpg)，我们旨在从中提取（低维）潜空间表示。将基因表达数据集作为输入提供给\
  \ `FBA` 模型，该模型产生一组反应通量 `F` 。然后我们训练 `FBA` 近似器，以基因表达数据为输入，并最小化通量 `F` 与预测通量 ![](img/f_dash.jpg)\
  \ 之间的 `MSE`。然后以基因表达数据为输入训练 `VAE`，旨在最小化通过重构基因表达通过近似的 `FBA` 得到的通量 ![](img/f_dash.jpg)\
  \ 与通量 `F ` 之间的损失，同时保持 `FBA` 近似器的权重不变。\n\n![images](img/fig5_1.jpg)\n\n图 1. 所提框架的全局方案。基因表达数据同时输入到\
  \ `VAE` 和 `FBA` 模型中。`VAE` 的训练最小化通过重构基因表达通过近似 `FBA` 得到的通量与真实 `FBA` 输出的通量之间的损失。\n\n\
  #### 2.1. *基因组规模代谢模型***\n\n\n\n\n\n代谢模型基于经过良好构建的基因组规模代谢网络。代谢模型包含了代谢反应以及编码介导这些反应的酶的基因^[12]\
  \ 代谢网络在拓扑上表示为 `S`，这是一个 `M × N` 的化学计量矩阵，其中 `M` 行代表所有 `N` 个反应中对应代谢产物的化学计量系数。在质量平衡约束下，系统根据一组微分方程运行：![](img/in134_1.jpg)其中\
  \ `c_i` 是第 `i` 个代谢产物的浓度，`v[j]` 是通过第 `j` 反应的通量^[13] 当第 `i` 个代谢产物分别作为反应物、产物或不参与第 `j`\
  \ 个反应时，`S[ij]` 的值分别为负、正或零。在准稳态假设![](img/in134_2.jpg)下，产生的化合物量等于消耗的总消耗量，因此：\n\n![](img/eq5_1.jpg)\n\
  \n准稳态假设基于以下假设：即代谢反应的时间常数（毫秒到几十秒）通常远小于其他细胞过程（如转录调控（几分钟）或细胞生长（几分钟或几小时））^[14]\n\n由于未知变量多于方程（`N\
  \ ≥ M`），系统是未定的，存在无限多个满足方程 ([5.1]) 的通量向量；这组向量表示了 `S` 的 `零空间`。为了限制系统允许的代谢表型集合，可以将热力学和容量约束引入系统，作为反应通量的下界和上界：![](img/in135_1.jpg)质量平衡约束连同通量不等式定义了一个凸边界多面体，所有可行解都位于其中。通过对假设的目标函数进行最大化处理，可以选择与生理上最相关的代谢表型，从而得出经典的\
  \ FBA 优化公式：^[15]\n\n![](img/eq5_2.jpg)\n\n最广泛使用的目标函数是生物量函数；它是一个虚拟反应，作为生物量前体（例如 DNA、RNA、蛋白质、脂质）的汇，这些前体共同定义了细胞的生物量组成^[16]\
  \ 生物量目标依赖于一个假设：在资源量有限的情况下，细胞努力使其增长最大化。\n\n然而，将生物量作为目标施加了强的限制，因为生物体通常同时在优化多个相互竞争的目标^[17]\
  \ 此外，已经证明生物量最大化通量状态通常是简并的，即存在多个通量分布可以产生相同的最大生物量值^[18]\n\n这种局限性可以通过多目标优化方案来解决；在此背景下，优化过程的结果是一组非支配点，称为帕累托前沿（Pareto\
  \ front）。如 [Ref. 19] 所示，多目标优化问题可以使用结合进化算法的双层线性规划来解决。在本工作中，我们选择了之前提出的以下双层公式^[20]\n\
  \n![](img/eq5_3.jpg)\n\n其中 `f` 和 `g` 分别是与第一个和第二个目标相关的权重数组，`h(y)` 是后续引入的基因表达向量 `y`\
  \ 的乘法函数。为了利用多源信息，我们使用了多组学模型，将基因表达数据整合到模型中。模型中的每个代谢反应都通过基因-蛋白质-反应（GPR）关联与一组基因相关^[21]\
  \ 每个 GPR 都被描述为由 AND/OR 运算符连接的基因字符串；如果一组基因是由通过 AND 连接的两个基因组成，那么这两个基因对于执行反应都是必要的，因此它们构成了一个酶复合物。相反，如果两个基因通过\
  \ OR 运算符连接，它们独立地催化相同的反应，构成一个同工酶。为了处理连续的表达值而非二元（零或一）激活，我们借用了模糊逻辑中的标准运算符^[22] 通过 AND\
  \ 运算符连接的两个基因的表达是组成该基因集的单个基因表达的最小值；而通过 OR 运算符连接的两个基因的基因集表达是单个基因表达的最大值。\n\n随后，基因集的表达可以通过以下分段乘法函数应用于相应的反应通量边界：\n\
  \n![](img/eq5_4.jpg)\n\n其中 `y[i]` 是负责第 `i` 个反应的基因集的表达量^[23] 该函数近似了 mRNA 丰度与蛋白质合成速率之间的关系^[24]\
  \ 关于使用 mRNA 水平作为蛋白质丰度指标的合理性讨论，请参考其他文献^[20]\n\n## 2.2. FBA 近似\n\n为了能够训练一个 VAE 来重构产生与输入\
  \ GE 相同通量的 GE 向量，我们决定使用重构 GE (假设为 ![](img/f_dash.jpg)) 的通量与原始 GE `F` 的通量之间的均方误差；然而，这需要\
  \ [图 1] 中的 FBA 层对于 GE 是可微的。据我们所知，之前还没有提出过关于非可微函数的线性规划的可微公式。因此，我们使用多层感知器（MLP）近似了\
  \ FBA（如图 1 中的 APPROX. FBA）。\n\n![](img/eq5_2.jpg)\n\n图 2。FBA 近似器的训练过程示意图。我们提供 GE\
  \ 向量以及培养基中相关代谢物的浓度（氧气和葡萄糖）作为 FBA 近似器的输入；该近似器被训练近似通过 FBA 获取的通量。\n\n## 2.3. 数据集\n\n\
  ### 2.3.1. 真实数据集\n\n\n\n\n\n作为一个真实数据集，我们使用了一个包含 466 份*大肠杆菌* Affymetrix Antisense2\
  \ 微列表达谱的汇集。^(25)数据集包含了在不同实验条件下收集的基因表达微矩阵，例如不同的氧气和葡萄糖浓度、pH 变化、热激和抗生素。在运行 `FBA` 时，我们根据特定的培养基条件考虑氧气和葡萄糖的摄入率。\n\
  \n### 2.3.2. *生成 GE 数据*\n\n为了构建数据集，我们使用多目标优化算法，生成了一组基因表达向量，定义了不同实验条件（有氧/无氧、培养基中不同浓度的葡萄糖）的帕累托前（Pareto\
  \ fronts）。针对 12 种实验条件，我们使用 `METRADE` 多目标方案生成了帕累托前，^(20)迭代 450 次，种群数量为 300 个个体。`METRADE`\
  \ 将双层 `FBA` 公式与 `NSGA-II` 算法相结合。^(26)我们遵循了此前提出的方法，^(23)将生物量最大化和细胞内总通量最小化选择为冲突目标。\n\
  \n我们选择了多种实验条件，针对不同葡萄糖浓度的无氧和有氧条件（5.5, 5.6, 610, 11, 20, 22 和 44 mmol h⁻¹ gDWDW⁻¹），以提供足够的帕累托前。实验条件涵盖了前述描述的\
  \ 466 份*大肠杆菌* Affymetrix Antisense2 微列表达谱数据集中存在的葡萄糖和氧气浓度范围。数据集子集的目标空间所示图 S4。生成的数据集由\
  \ 6,440 个维基因表达向量组成。\n\n### 2.4. *VAEs*\n\n变分自编码器（VAEs）5 是一类通过变分推理方法训练的深度生成模型，由此得名。给定一个数据集![](img/in138_1.jpg)，训练一个概率编码器和解码器。生成过程考虑了一组隐变量![](img/in139_1.jpg)和一组观测变量![](img/in139_2.jpg)，从而定义了联合概率分布![](img/in139_3.jpg)。\n\
  \n我们希望最大化生成过程![](img/in139_4.jpg)下训练集中每个 `x` 的边际概率；然而，由于积分是不可计算的，VAEs 通常通过最大化证据下界（ELBO）来训练：\n\
  \n![](img/eq5_5.jpg)\n\n其中![](img/in139_5.jpg) 是一个通过![](img/o.jpg)参数化的近似（后验）分布。这里，![](img/in139_6.jpg)是于\
  \ ![](img/in139_7.jpg)和 *p* 之间的 Kullback-Leibler 散度。\n\n优化通过同时对 ![](img/o.jpg)和\
  \ `θ` 执行梯度下降来实现；为了做到这一点，使用了*重参数化**技巧*（reparametrisation trick），即每个随机变量![](img/in139_8.jpg)都被重写为噪声变量![](img/in139_9.jpg)的可微变换。在\
  \ VAE 模型中，我们通常假设![](img/in139_10.jpg)和![](img/in139_14.jpg)，此外，*p* 和 *q* 都由*神经网络*参数化。\n\
  \n在这项工作中，我们使用了 VAE 框架的一种特定演变，它修改了原始目标函数，引入了一个可调的超参数 *β*，^(10)因此得名：\n\n![](img/eq5_5.jpg)\n\
  \n`β` 决定了施加在![](img/in139_4))上的压力。通过设置 `β > 1`，我们强烈约束了瓶颈层，从而使隐变量![](img/in139_10.jpg)的分布![](img/in39.jpg)趋向于向同性高斯先验\
  \ *p*。整个 VAE 模型由一个编码器 `q` 和一个解码器 `p` 组成。解码器![](img/in140_1.jpg)是一个三层 MLP，所示图 S2。模型的输入是采样状态\
  \ `z`。编码器![](img/in140_2.jpg)是一个三层 MLP，所示图 S3。我们在 NVIDIA K80 上训练了 300 个 epoch，批大小为\
  \ 128。\n\n### 3. 实验结果\n\n在本节中，我们在生成的数据集上拟合我们的框架，评估其学习紧凑且解耦表示的能力。我们首先表征 FBA 近似器（见\
  \ 3.1 节），随后评估 GE（见 3.2 节）。\n\n#### 3.1. *FBA 近似*\n\n我们首先训练了 FBA 近似器。然后我们在训练集和测试集上对其进行了评估；结果所示图\
  \ 3。训练集和测试集的 MSE 分别为 0.671 和 0.048。\n\n在图 3 中，我们绘制了 FBA 生成通量（橙色圆圈）和近似 FBA（绿色 + 号）的目标；对应点用黑线连接。根据实验结果，该近似器学习了一种我们称为*帕累托保持*（Pareto-preservation）的属性，即它通常将样本数据映射到最近的（真实的）帕累托沿。\n\
  \n#### 3.2. *评估 VAE*\n\n我们训练了所示图 1 的变分自编码器。然后，我们在留出的测试集上评估了学习到的 FBA。\n\n\n\n\n\n\
  我们首先检查了自动编码器重构的输出基因表达；有趣的是，重构的基因表达数据显示出更大的紧凑性：如图 S6 所示，对于大多数基因而言，重构的基因表达（右面板）的标准差低于原始基因表达（左面板）。这种行为表明\
  \ `VAE` 正在对数据进行去噪，丢弃所有对于重构特定代谢表型而言并非严格有基因表达变异。\n\n随后，我们从原始实验条件的角度评估了学习到的潜空间（参见第\
  \ 2.3.2 节）。在图 4 的左图中，我们展示了样本 `n` = `2000` 个基因表达向量的编码潜维散点图。如预期的，编码将不同的实验条件映射到潜空间中不同的曲线。曲线之间的接近程度反映了实验条件之间的相似性/差异性。例如，实验条件（厌氧，–20）和（厌氧，–22）被编码在部分重叠的曲线上，正如它们在图\
  \ S4 中的帕累托前沿一样。更有趣，每条曲线都有方向性，即跨越特定曲线就能跨越相应的帕累托前沿（参见下文和图 4 的左面板）。\n\n然后，我们将 `GEESE`\
  \ 生成的潜空间与基准 `VAE`（不含 `FBA` 模块）引导的潜空间进行了比较；即使实验条件在潜空间中很好地分离，帕累托前沿结构也没有保留（图 S5）。事实上，即使帕累托前沿结构是数据集的固有属性，只有通过添加\
  \ `GEESE` 施加的代谢约束才能被捕获。\n\n![images](img/fig5_4.jpg)\n\n图 4. 左面板：报告了样本 `n` = `2000`\
  \ GE 数据的（二维）潜空间。`VAE` 将不同的实验条件编码在潜空间不同的区域（更准确地说是路径）。另见补充材料中的图 S4。右面板：对于给定的帕累托前沿（厌氧，最大葡萄糖摄入![](img/in143_1.jpg)在图\
  \ 4 中为紫色），我们绘制了真实 `FBA` 的两个目标（右上面板）以及通过将基因表达数据通过自动编码器得到的重构 `FBA` 的两个目标（右下面板）。颜色从黄色到深紫色的变化编码了沿帕累托前沿的移动（右中面板）。\n\
  \n此外，我们分析了所提框架在重构给定帕累托前沿方面的能力。我们从一个特定的帕累托前沿选取了基因表达数据（在厌氧条件下获得最大葡萄糖摄入![](img/in144_1.jpg)），并使用了使用潜空间维度为\
  \ `2` 训练的我们的 `VAE`。在图 4 的右面板中，我们报告了真实 `FBA` 产生的目标空间（右上面板）、基因表达数据编码到潜空间的结果（左面板中的深紫色曲线），以及通过将基因表达数据通过自动编码器得到的重构\
  \ `FBA` 的两个目标（左下面板）。\n\n然后，我们通过局部探索给定帕累托前沿的相邻潜空间，分析了所提框架的能力。在特定帕累托前沿附近（在厌氧条件下获得最大葡萄糖摄入![](img/in144_2.jpg)）生成了新数据点，并使用我们的\
  \ `GEESE` 重构了它们的基因表达（参见图 5 的左面板）。利用每个基因的分布来识别潜空间该区域的一组特别稳定和不稳定的基因。我们进行了敏感性分析以获得每个基因两个不同目标下的鲁棒性值。在帕累托前沿周围局部潜空间中分类为稳定的基因显示出高鲁棒性值，这意味着它们在这些特定实验条件下的优化作用是可替换的（参见图\
  \ 5 的右面板）。相反，不稳定基因显示出混合的鲁棒性值，可以理解为对这些实验条件下的优化具有更关键的影响。在这两组中，`GEESE` 成功识别出具有几乎二值优化值的基因（要么完全破坏结果，要么使结果最大）。因此，`GEESE`\
  \ 成功识别出一组具有特定实验条件特征的特定基因，帕累托前沿之间的重叠最小，且对优化有明显影响。\n\n### 3.3 GEESE 有助于重构潜空间吗？\n\n\
  为了检查模型在真实案例场景中的泛化情况，我们设计了以下实验：我们选择了一个包含 466 个*大肠杆菌* Affymetrix Antisense2 微阵表达谱的数据集。25\
  \ 如下所示，该数据集收集了来自不同实验条件的基因表达微阵，例如变化的氧气和葡萄糖浓度、pH 值变化、热激和抗生素。然后，我们仅使用培养基中糖和氧的知识，利用多目标进化算法的帕累托生成了一个数据集。在该数据集上训练了不含\
  \ `FBA` 模块的基准变分自动编码器以及我们的架构 (`GEESE`)。`GEESE`（图 4）和基准 `VAE`（图 S5）在嵌入空间中均表现出良好的特性。\n\
  \n![images](img/fig5_5.jpg)\n\n图 5. 在特定帕累托前沿附近（左面板）生成了新数据点，随后使用我们的 `VAE` 重构了它们的基因表达。识别了稳定不稳定基因，并对每个基因的两个不同目标进行了敏感性分析（右面板）。两组中，`VAE`\
  \ 都能识别出具有几乎二值优化值的基因。\n\n\n\n\n\n在这项工作中，我们利用深度生成模型解决了基因表达数据学习中有意义的潜空间学习问题。为了迫使潜空间传递代谢信息，我们设计了一个特定的框架，该框架由一个生成式深度神经网络和一个基于代谢网络的通量平衡分析（FBA）的近似模型组成。我们首先将\
  \ `FBA` 近似器训练为一个五层层 `MLP`；随后我们使用了 `β`-变分自动编码器（`β`-`VAE`），并训练模型来重建基因表达向量，使得该向量在通过\
  \ `FBA` 时产生的通量分布与输入分布一致。\n\n![images](img/fig5_6.jpg)\n\n图 6. 展示了来自真实数据集的（未见）示例的潜空间，对比了基准模型\
  \ (`VAE`) (a) 和我们提出的架构 (`GEESE`) (b)。\n\n学习到的二维流形为样本之间的关系提供了有意义的见解；首先，自动编码器能够识别与不同实验条件（例如需氧/厌氧以及培养基中不同的糖浓度）相关的基因表达向量。其次，自动编码器在保持相同代谢表型的同时对输入数据进行去噪。第三，编码器将基因表达向量的帕累托沿映射到二维空间中的一条定向路径（见图\
  \ 4）。这些定向路径描述了细菌如何通过使用不同的 GE 策略来适应变化的环境条件；策略之间的重叠（特别是环境条件相似时）支持了推断结果的生物学合理性。事实上，与图\
  \ S5 的对比清楚地表明，这些信息无法通过标准 `AE` 提取提取。第四，`GEESE` 成功识别出一组具有每种实验条件特征的特定基因，且各帕累托沿之间的重叠极少，并对优化具有显著影响。最后，通过在未见的基因表达微芯片真实数据集上对学习模型进行评估，我们证明所提模型相比基准\
  \ `VAE` 具有更好的泛化能力，如图图 6 所示。\n\n我们认为，通过约束重建的基因表达以近似原始的 `FBA` 输出，我们驱动自动编码器整合关于基因间相关性的先验知识，有助于理解噪声高维测量数据。该设计的框架被称为\
  \ `GEESE`（Gene Expression latEnt Space Encoder），代表了理解基因型-表型关系的一步。随着基因组规模代谢模型（GSMMs）适用于越来越多的生物，所提模型的适用性正在不断扩大。最后，我们认为我们的模型为理解不同的相关条件提供了更好的视角，并为流形学习问题提供了一个新视角。\n\
