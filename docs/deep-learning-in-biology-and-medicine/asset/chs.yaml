  benjamin.glicksberg@icahn.mssm.edu (`**rft7`)\nmiotto.r@gmail.com (`††rft8`)\n\n\
  电子健康记录（`EHRs`）包含了丰富的生物医学数据，对于改善个人医疗保健以及为人群健康提供关键数据具有巨大前景。在每次临床访问期间，医疗人员都会捕捉个人健康状况的快照，这些记录在大量的结构化和非结构化数据库中积累。随着这些库的大小和范围的扩大，为新模式和以前所未有的规模研究生物和医学问题提供了大量机会。实现这一目的的一个强有力工具是深度学习（`DL`），它是机器学习的一个子领域，旨在通过神经网络层以算法方式表示数据内部的结构。在这里，我们回顾了\
  \ `DL` 在 `EHRs` 中的应用，特别关注 `DL` 的出现如何改变了我们为了研究而挖掘 `EHRs` 的。\n\n## 1 引言\n\n在过去的三十年里，`EHRs`\
  \ 和信息技术彻底改变了医疗保健和生物医学研究。它最初作为一个用于记录患者历史数字版的系统，逐渐演变为一个复杂的框架，容纳了海量的数字数据，并允许对人类健康和生物医学进行新的调查。这些数字记录提供了患者健康状况的快照，可以通过更易共享关键健康信息来增强医疗决策。随着时间的推移，这些记录积累成时间线，可以改进健康轨迹的预测模型。在个人层面，这些轨迹正在成为个性化医疗的基础。在多个人中，这些记录为理解人群健康管理和为医疗政策做出更佳决策提供了重要资源。\n\
  \n`EHRs` 代表了数据和函数的集合，反映了这些系统为了适应而发展的四个主要利益相关者之间往往相互竞争的需求。首先，提供者希望有记账方案来记录各种事件、就诊、保险、诊断、治疗、程序、付款，并监控医疗管理。其次，信息技术工程师需要最新的软件和硬件，以及必要的设施，以支持提供者和医疗管理人员对\
  \ `EHRs` 增加的功能和需求。第三，科学家需要为研究组织的应用和数据。第四，也是通常被认为是事后考虑的，患者希望能够随时间随随地访问他们的医疗数据。在许多医院中，所有这些不同的用例导致了由异构数据元素组成的大数据库，包括患者人口统计信息、诊断、实验室检查结果、药物处方、临床笔记和医学影像。\n\
  \n从 `EHRs` 中挖掘有意义信息的常用方法是定义一个临床假设，并让领域专家以 `ad hoc`（专门）的方式指定要使用的临床特征。然而，特征空间的监督性定义扩展性较差，并且错过了发现新模式的机会，而这正是大规模\
  \ `EHRs` 的主要承诺之一。由此产生的模型在不同数据集或机构之间的泛化能力通常也有限。相反，机器学习（`ML`），特别是表示学习，可以从原始数据中自动发现预测所需的表示。深度学习（`DL`）是一种具有多层抽象的表示学习，通过组合简单但非线性的模块获得，每个模块将一个层次的表示（从原始输入开始）转换为更高、更抽象层次的表示。`DL`\
  \ 近年来经历了戏剧性的复兴，这在很大程度上是由计算能力的增加和海量可用数据集驱动的。该领域见证了机器在理解和处理数据（包括图像、语言和语音）方面的惊人进展。由于产生的数据量巨大（150\
  \ 艾字节字节，每年增长 48%），医疗保健和医学也开始从 `DL` 中获益。\n\n## 2 EHRs 的数据组织与结构\n\n本节总结了 `EHRs` 从起源、演变到目前大多数临床环境的现状。我们强调了\
  \ `EHR` 中常见的数据类型以及它们的组织方式。现代 `EHRs` 的发展在健康领域带来了许多益处。随着这些系统复杂性的增加，为了将它们整合并在各个领域协同工作以满足不同的研究和临床需求，出现了许多挑战和解决方案。\n\
  \n### 2.1 简史\n\n\n\n\n\n电子健康记录（EHRs）包含了患者在诊所或医院就诊产生的数据。在每次就诊期间，医护人员会获取个人健康状况的快照并将其添加到之前的信息中。最初，数字化转换取代了纸质版的病史，以便于行政处理并改进临床工作流。特别是，EHR\
  \ 的概念起源于 20 世纪 60 年代，旨在使用电子方法和数据处理系统来记录患者信息（即“以问题为导向”的医疗记录）。根斯特夫研究所（Regenstrief\
  \ Institute）于 1972 年开发了第一套运行的电子病历（EMR）系统.^(8) 然而，由于成本高昂，这些系统对医生并没有吸引力，也没有被政府医院和大型医疗机构采用。\n\
  \n花费了 30 多年的两种合流的力量，现代医疗实践才与如今的 EHR 整合在一起.^(9) 第一种是医学学会关于医疗记录隐私和机密性的系列建议，这些建议后来变成了法规。1996\
  \ 年出台的《健康保险可携带性与责任法案》（`HIPAA`）是为了应对美国在医疗覆盖、隐私和安全方面日益增长的问题。第二是互联网的兴起，加上计算和信息技术成本的下降。随着数字技术在\
  \ 2000 年代无处不在，EHR 在医疗机构中变得越来越普遍，与医生和专业人员密切合作，为患者提供最佳质量的护理。如今的 EHR 系统继承了这种发展演变，主要关注于促进患者护理的行政任务和医院工作流——计费、警报、患者和诊断记录维护以及保险数据。在过去的五年里，研究人员和医生科学家开始向\
  \ EHR 中填充额外数据，例如影像、分子、临床实验室检查（以前保存在辅助系统中），用以促进新的科学问题和临床机会，从而改善患者护理。\n\n## 2.2 益处\n\
  \n从纸质到 EHR 的转换给患者、医疗提供者和医疗行业带来了多重益处。对患者最大的益处是 EHR 提供了一种以安全格式存储医疗记录的方法，且现在可以在线访问。此功能使每个人以及任何指定的第三方能够随时随地查看其个人健康健康史。医疗提供者也受益于在需要时获取患者的医疗信息的能力。这一选择有助于改进医疗决策，并确保护理团队的所有成员都能访问相同的信息。\n\
  \n## 2.3 数据类型与组织\n\n在美国以及其他几个国家，EHR 中的信息主要用于计费和行政目的。尽管如此，EHR 提供了有关患者全面的健康信息，因此包含了基于参与患者护理的各种提供者输入的许多类型信息（表\
  \ 1）。\n\n用于表示数字患者的各种数据类型和临床描述为数据分析和解释带来了挑战。这些数据具有广泛的维度，并受到不同程度的噪声、异质性、稀疏性、不完整性、随机错误和系统性偏差的影响.^(1,)\
  \ ^(10) 例如，某些测量是常见的，会导致 EHR 中输入多次测量值（例如，代谢面板）。某些测量是常见的，会导致 EHR 中输入多次测量值（例如，`eGFR`）。某些测量是常见的，会导致\
  \ EHR 中输入多次测量值（例如，`type diabetes`）。某些测量是常见的，会导致 EHR 中输入多次测量值（例如，`my myeloma`）。某些测量是常见的，会导致\
  \ EHR 中输入多次测量值（例如，`ICD-9`）。某些测量是常见的，会导致 EHR 中输入多次测量值（例如，`ICD-10`）。某些测量是常见的，会导致 EHR\
  \ 中输入多次测量值（例如，`LOINC`）。\n\n表 1. 电子记录中常见数据类型。\n\n| **数据类别** | **描述或示例** |\n| ---\
  \ | --- |\n| 患者人口统计学 | 采集个人（例如，性别、出生日期、种族）和地理（例如，地址）信息。 |\n| 临床笔记 | 反映了医生和护士编写的临床术语和散文的结合，用于总结临床事件。\
  \ |\n| 生命体征 | 血压、温度、血氧水平、脉搏、身高和体重。 |\n| 病史 | 包括患者自身的病史——临床事件、过敏史、接种日期——以及患者的家族病史，如癌症、糖尿病。\
  \ |\n| 诊断 | 每次就诊期间与患者相关的官方疾病分类。通常，这些诊断使用 `ICD-9` 或 `ICD-10` 代码进行编码（[`www.cdc.gov/nchs/icd`](https://www.cdc.gov/nchs/icd)）。\
  \ |\n| 药物 | 记录每次就诊期间处方给患者的所有药物。 |\n| 临床影像 | MRI、X 光和超声扫描，这些扫描通常按照 `DICOM` 标准进行序列化、存储和管理。\
  \ |\n| 实验室和测试结果 | 包括常见检查（如代谢面板）以及与某些疾病相关的更特异的检查。测试结果可以以数值和测量单位的形式报告，也可以相对于参考范围值的分类标签进行报告（例如：高、正常、低）。近期，医疗机构开始使用逻辑观察结果代码（逻辑观察标识符名称和代码，`LOINC`）来记录实验室检查，以有利于标准化并减少数据分散（[https://loinc.org](https://loinc.org））。\
  \ |\n\n\n\n\n\n医学领域使用的数据类型范围广泛，这为如何更好地存储、组织和格式化数据以供多方高效使用带来了挑战。电子健康记录（EHR）最常用的框架是关系型数据库（例如\
  \ `Oracle`、`MySQL`），它们会在每个患者的临床事件发生时进行更新。目前，正致力于将所有数据类型聚合到便于查询和大规模分析的格式中。这些新格式旨在处理医生或患者可能提出的自然查询，并能够在数百万患者的规模上对所有临床记录进行计算。点点式仪表板也是在不具备高级计算机科学知识或格式结构的情况下执行数据查询的方法。\n\
  \n## 2.4. 数据标准化与互操作性\n\n大型医疗系统必须解决如何更好地整合多个数据源、标准化各种数据类型，并促进机构之间的互操作性的问题。特别是数据标准化，对于希望在多个机构之间开展\
  \ EHR 研究的研究人员来说，是一项关键活动。标准的作用体现在：(i) 促进 EHR 的互操作性，(ii) 构建存储 EHR 数据的研究数据库，以及 (iii)\
  \ 实现研究的可复现性。这三个领域对于 EHR 的高效有效运行都至关重要。\n\n主要用于研究的衍生数据库也需要自己的标准，以便从 EHR 中提取健康数据。多个财团、委员会和其他研究协作组织正在开发和维护上述三层的标准，作为通用数据模型。例如，一个促进\
  \ EHR 互操作性相关标准的团体是健康级 7（`HL-7`），他们开发了一种名为 `Fast Healthcare Interoperability Resources`（`FHIR`）的规范。他们的重点是确保医疗信息能够在\
  \ EHR 和机构之间进行恰当传输。另一个大型研究项目“生物学与床边的整合”（`Integrating Biology and the Bedside`, `i2b2`）是最早设计开源框架以与\
  \ EHR 数据接口进行转化研究的项目之一，其中包括一个交互式仪表板，用于协助队列识别等任务。\n\n该平台被广泛使用（截至 2020 年 1 月，已在全球范围内\
  \ 250 多个地点使用），并有无数扩展。观察性健康数据科学与信息学（`OHDSI`）财团近期开发了 `OMOP 通用数据模型`，使研究人员能够在单一机构开发代码，并并在所有符合相同研究-EHR\
  \ 结构的机构之间共享。这种方法对于在单一机构进行开发并寻求在完全独立的患者集上进行复制分析的研究人员来说非常方便。\n\n标准化还涉及算法开发，这种开发通过社区参与和反馈不断进化和改进。事实上，临床算法通常是通过跨多个机构的医学和信息学专家的迭代过程得出的。例如，不同疾病的表型算法就是通过这种方式收集的，并通过\
  \ `表型知识库`（`PheKB`）提供。这一迭代过程的第一步是设计。其他参与机构随后检查所提的算法并进行完善。最终的算法通过这一包含一系列测试的协作过程形成。最终确定的算法随后被视为未来研究人员的“标准”。\n\
  \n## 3. 深度学习简述\n\n机器学习（`ML`）是一种通用范式，它能够从数据中学习关系，而无需预定义这些关系。从历史角度看，典型的机器学习工作流涉及四个步骤：数据协调化、表示学习、模型拟合与评估。几十年来，表示学习严重依赖领域专家和特征工程。原始输入变量被转换到一个空间，在该空间中，分类器更容易检测所需的模式。深度学习是一类表示学习方法，它可以自动从原始数据中生成用于模式检测和分类的分布式表示。为了获得此类表示，深度学习架构允许将不同的简单线性函数层（通常基于神经网络）组合起来，这些层逐步将原始数据转换为更高、更抽象的层次。学习过程的目标是从训练示例中推导出分布式表示。这些表示结合许多计算元素来表示一个实体，并有利于对学习阶段未见过的新数据进行泛化。这一过程基于随机梯度下降，前提是所有模块都是由相对平滑的函数组成的。具体来说，内部权重通过计算目标函数对输出的梯度并根据导数的链式法则反向计算来更新。这种方法被称为反向传播，它计算相对于每个模块权重的梯度。\n\
  \n有不同类型的神经网络构建了深度学习架构。特别在多层网络中，我们可以区分前馈神经网络和循环神经网络（`RNNs`）。前馈网络学习将固定大小的输入映射到固定大小的输出。在此类中，卷积神经网络（`CNNs`）是计算机视觉系统的标准基础，从图像中学习内部层次表示以检测和分类对象。图像以像素值数组的形式表示，通过层栈进行处理，这些层首先学习检测边缘，然后逐渐将边缘组合为模式，将模式组合为对象，再将对象组合为场景。不同的是，`RNNs`\
  \ 学习处理具有内在时间结构的序列输入（例如语音或语言），同时在它们的隐藏单元中保留关于序列过去元素的相关信息。长短期记忆网络（`LSTMs`）是种常用的 `RNNs`\
  \ 类型，因为它们具有长时间记忆信息的自然能力，限制了作为第一代 `RNN` 实现中特征的长期依赖问题。\n\n\n\n\n与机器学习（ML）类似，深度学习（DL）架构可以用于不同的任务并对其进行训练。在许多应用中，DL\
  \ 架构是以监督的方式进行训练的。在这种情况下，训练数据集包含输入数据点（例如实验室结果）和输出标签（例如“无病”、“受影响”），且模型通常旨在提供分类评分。在缺乏已知输出标签的情况下，训练在无监督框架内进行，其目标是重构或对原始输入进行建模，并发现数据中的模式。无监督学习通常使用自动编码器^[36]和自监督学习（即系统提取并利用自然获取的相关上下文和嵌入元数据作为监督信号）^[37]。此外，近期备受关注的强化学习（RL）试图通过试错来寻找能够使奖励最大化的最佳动作组合^[38]。RL\
  \ 与监督学习的区别在于，它不需要带标记的输入/输出对，也不需要显式地纠正次优动作。相反，其重点在于探索（未知领域）与利用（利用现有知识）之间寻找平衡。最初为无监督学习提出的生成对抗网络（GANs）^[39]近期已被用于强化学习^[40]。在\
  \ GANs 中，两个模型同时接受训练：生成模型捕获数据分布以产生示例，而判别器则估计样本来自训练数据而非生成模型的概率。生成器示例通过训练，目标是最大化判别器犯错误的概率。\n\
  \n## 4. 基于电子健康记录（EHR）的深度学习\n\n本节重点介绍了将 DL 应用于 EHR 以改进几个相关临床领域医疗服务的成功研究。在 EHR 中使用\
  \ DL 的主要优势在于其处理不同类型数据的天然能力，这使得能够建立有效高效的异构学习框架，能够利用个性化医疗和下一代医疗保健。当患者到达医院时，其临床状态被解构并存储在\
  \ EHR 中（参见[图 1]）；ML（特别是 DL）可以通过对 EHR 中所有不同的异构部分进行建模，帮助重构并将该临床状态用于预测分析。因此，通过利用多层表示，DL\
  \ 方法可以实施不同的融合策略，将异构数据模态整合到 EHR 内部的同一个学习过程中，例如医学影像和临床数据^[41]。\n\n这一不断发展领域的文献被总结在不同的优秀综述论文和书籍中^[30,\
  \ 42–50]。在这里，我们涵盖了几个相关的应用，特别是与疾病预测、疾病表型分析、患者分层和临床记录理解相关的应用。对于其中每一项，我们都提供了文献中至少一项研究的全面描述，简要概述了其他相关工作，并强调了与\
  \ DL 之前研究的主要区别。\n\n![images](img/fig3_1.jpg)\n\n图 1. 访诊医疗机构的患者的临床状态被解构并存储在 EHR 的不同表中。ML\
  \ 可以帮助重构这种状态，并将其用于预测建模和医学分析。\n\n将 DL 模型整合到临床实践中是个性化医疗的核心。这种转化鸿沟在组织病理学等领域正在缩小，在这些领域，数字图像允许人们在广泛的诊断应用中使用机器学习方法^[51]。此外，RL\
  \ 已被证明特别适用于需要对试验和错误进行序贯评估的任务^[52]，例如慢性疾病^[53]或重症护理中的动态治疗方案^[54]。尽管计算模型已经可以为临床医生提供有用的见解，但它们的实时应用仍受到不同因素的限制，例如回顾性队列的使用和小样本量^[52]，以及需要人工标注数据来提供可靠预测的需求^[51]。关于此主题的进一步讨论将超出本文范围，我们感兴趣感兴趣读者参考其他综述著作^[51,\
  \ 52]。\n\n### 4.1. 疾病预测\n\nEHR 中存储的大规模数据可以通过预测个人患得特定疾病的概率来利用个性化医疗。这些数据驱动的模型创建了一个医疗平台，从历史数据中学习优化治疗路径并自动估计新疾病的风险^[55–57]。医生可以监测其患者，根据当前的临床状态检查未来是否可能发生任何疾病，并根据证据从可能的选项中建议干预，从而改变病程^[1]。同样，该领域的早期方法依赖于共病和诊断来得出预测^[58,\
  \ 59]。例如，Jensen 等人研究了跨越 15 年和 600 万患者的时间疾病轨迹，以描述疾病诊断随时间演变的过程^[58]。这些疾病轨迹是通过分析患者观察的一系列连续\
  \ ICD-9 和 ICD-10 代码定义的。\n\n近期基于 ML 的研究趋势还将其他临床变量纳入分析中，例如药物和实验室值。然而，一种常见的方法是让领域专家以临时方式指定临床变量^[60–63]。虽然在某些情况下是恰当的，但以监督方式定义特征空间的可扩展性和泛化性较差，且无法发现新颖模式和特征。DL\
  \ 可以通过减少对人工特征工程的需求来减轻这些局限性。特别是，基于神经网络和深度学习的方法可以处理聚合的 EHR，包括结构化数据（如诊断、药物、实验室检查结果、手术）和非结构化数据（如自由文本临床记录），以获取用于特定疾病预测的语义表示。\n\
  \n\n\n\n\n在深度学习（DL）应用于电子健康记录（EHR）的早期应用中，Miotto 等人提出了一种名为“Deep Patient”（深度患者）的无监督深度特征学习框架，旨在从\
  \ EHR 数据中提取通用的患者表示，以促进临床预测建模。具体而言，他们使用深层堆叠去噪自动编码器以无监督的方式对 EHR 进行建模，目标是捕捉数据中的结构和模式，这些结构和模式组合在一起就成了深度患者表示。`Deep\
  \ Patient` 框架是领域无关的（即由于在大型多领域数据集上学习，因此与任何特定任务无关），不需要任何额外的人力投入，并且可以轻松应用于不同的预测应用（包括监督和无监督应用）。图\
  \ 2] 包含了用于提取深度患者表示的高层概念架构。所有 EHR 首先从临床数据仓库中提取出来，经过预处理以归一化临床相关的表型，并分组为“原始”患者向量。每个患者都可以仅通过单个向量描述，也可以通过一组总结预定义时间窗口的向量序列来描述。每个患者的所有向量被输入到深度无监督神经网络中，以发现高层通用描述符。数据仓库中的每位患者随后使用这些特征进行表示，而这种深度表示可以高效、有效地应用于不同的临床任务。\n\
  \n为了证明这一理念的有效性，`Deep Patient` 被用于处理来自纽约市西奈山医院约 700,000 名患者的聚合 EHR。患者记录包括人口统计学细节（例如年龄、性别和族）、结构化格式提供的常见临床描述符（如诊断（ICD-9\
  \ 代码）、药物、手术和实验室检查），以及预处理过的临床笔记（使用主题建模进行总结）。作者通过评估患者在不同时间窗口内发生各种疾病的概率，广泛评估了这种表示法对健康状态的预测能力。评估包含了\
  \ 76,214 名测试患者，涉及来自不同临床领域和时间窗口的 78 种疾病。结果显著优于基于原始 EHR 数据的表示以及其他特征学习策略所获得的结果（见[图\
  \ 3]）。有趣的是，与其他算法相比，严重糖尿病、精神分裂症和各种癌症的预测性能获得了最大的改进。这可能与这些疾病的慢性性质有关，这种性质导致了更大且更一致的数据量。\n\
  \n![images](img/fig3_2.jpg)\n图 2. 通过对大型 EHR 数据仓库进行无监督深度学习来提取 `Deep Patient` 表示的概念性框架。\n\
  \n![images](img/fig3_3.jpg)\n图 3. 从 ICD-9 代码 294.20“痴呆”开始，使用医学概念嵌入得出的痴呆症疾病定义。\n\n\
  这些发现表明，深度学习能够从 EHR 中提取出通用的、且利于不同临床领域和不同应用（如疾病预测）中自动化方法处理的特征。这项工作代表了向下一代临床系统迈出的一步，这些系统可以\
  \ (i) 扩展到包含数百万甚至数十亿患者记录；(ii) 使用单一的分布式患者表示来有效支持临床医的日常活动——而不是使用多个针对不同任务提取的不同患者表示的系统。\n\
  \n大量与疾病预测相关的研究建立这一理念之上，并解决了 `Deep Patient` 的某些局限性（例如时间未显式建模，预测难以解释）。`Doctor AI`\
  \ 使用 `RNNs` 根据病史预测后续就诊的诊断和药物；`DeepCare` 是一种基于 `LSTMs` 的端到端深度动态网络，用于推断当前的疾病状态并预测未来的医疗结果；它在精神健康和\
  \ 2 型糖尿病的疾病进展建模、干预建议和未来风险预测领域表现出良好的性能；`RETAIN`（反向时间注意力）是一种基于注意力和 `LSTMs` 的可解释预测模型，已在心力衰竭预测上通过评估；`Lipton\
  \ 等` 使用 `LSTMs` 识别临床测量多元时间序列中的模式并分类不同的诊断；`Rajkomar 等` 使用深度学习预测院内死亡率、30 天非计划再次入院率、住院时长以及患者的出院诊断。\n\
  \n需要说明的一个重要考虑是，疾病预测需要包含关于疾病可能发生的时间指示。这种特征有助于医生确定风险的严重程度，并使他们采取相应的干预策略。时间指示和风险分层可以根据临床需求进行定制，例如对于普通的医患接触以天/月为单位，对于危急或\
  \ ICU 情况以小时/分钟为单位。例如，`Miotto 等` 评估了不同时间窗口（即 30-180 天）的疾病预测；`Pharm 等` 通过预测疾病发生的时间评估了他们的深度架构；而\
  \ `Lipton 等` 展示了 ICU 内有效的时间疾病预测。\n\n应用于临床图像（如 X 光和 MRI 扫描）的深度学习在疾病预测和诊断方面也取得了若干成功。`Gulshan\
  \ 等` 使用基于 `CNNs` 的深度学习识别眼底照片中的视网膜病变和黄网膜水肿。手动解读的眼底摄影是视网膜病变广泛接受的筛查工具，其性能通常超过面对检查。视网膜病变的自动分级可以增加筛查计划的效率、重复性和范围，减少障碍，并通过早期发现和治疗改善患者结果。该\
  \ DL 方法在约 10,000 张测试图像上，相对于认证眼科医的注释获得了高灵敏度和特异性。这项研究在分类包含 130,000 张图像的大数据集中不同类型皮肤癌的活检临床图像时，准确率与\
  \ 21 位执业皮肤科医生相当。\n\n`Zech 等` 构建了深度神经网络来自动检测胸部 X 光中的肺炎。他们的研究涉及来自三个不同医院的合并图像。除了检测肺炎的能力，主要发现之一是模型可以学习与医疗流程相关的其他因素，这导致了站点之间的性能差异。例如，自动化方法能够可靠地识别图像来自哪个医院系统，引发了对泛化性的担忧。\n\
  \n\n\n\n将疾病预测模型实际纳入临床实践，需要付出努力交付能够让医疗保健人员以有意义的方式解读的结果。在 `DL` 模型中，困难的全局可解释性和特征选择进一步增加了结果可靠性的复杂性，特别是对于那些关注特定疾病队列或未考虑内在偏见的研究[78]。具有可解释的模型和高效且可泛化的预测解决方案，是支持临床决策并确保质量和改善患者预后的基础步骤。随着开发能够为特定个体预测提供依据（即局部可解释）的模型，精准医学已经迈出了极具前景的一步[79]。此外，近期在医疗保健领域的应用已证明成功，例如在识别预测手术期间低氧血症的最佳特征[80]。尽管如此，仍然需要在模型的可解释性和泛化能力方面进行改进，以使\
  \ `ML` 模型能够有效支持临床决策。\n\n## 4.2. 疾病表型分析\n\n基于 `EHR` 的研究需要对感兴趣的表型（即疾病定义）进行准确的病例定义，以构建稳健的队列，这就像前瞻性研究实施严格筛选标准一样。然而，在\
  \ `EHR` 系统中准确识别具有特定表型的患者可能是非常有挑战性的。`ICD` 代码的设计用于表示疾病和症状，但通常不能作为确定性诊断[81]。取决于疾病的不同，不同的数据模态最能高精度识别患有某种疾病的患者，但对另一种疾病的分类贡献很小。额外的挑战源于输入错误、编码偏见、医学报告偏见、数据可用性、稀疏以及数据结构的局限性。目前构建队列的金标准是电子表型算法，这些算法是基于规则、手动构建的，并在最终通过专家图表审查验证后存入\
  \ `PheKB`[27]。尽管这些算法在生物医学发现方面取得了成功，但它们耗时、耗力且具有领域特定性，限制了广泛的适用性和扩展性。因此，现有算法非常有限。\n\
  \n自动表型方法在以数据驱动的方式进行分类方面取得了成功，这种方法比基于规则的方法更具扩展性[82]。例如，Halpern *等* 提出了一种半监督的“锚点学习”方法，并将其应用于急诊科患者[83]。锚点是\
  \ `EHRs` 中对特定表型具有高预测值的观察结果，由领域专家手动定义。使用`Logistic regression` 来预测患者 `EHR` 中是否存在该锚点。最终的表型估计器整合了患者记录中的所有信息以及锚点分类器。与使用金标准标签的监督训练方法相比，该方法在识别急性事件（如肺炎、感染、心脏事件或败血症休克）以及患者是否具有免疫抑制病史、抗凝治疗治疗史或癌症病史方面表现更好。\n\
  \nHo *等* 开发了 `Limestone`，这是一种通过非负张量分解的高通量方法，用于从 Geisinger Health System 的 `EHRs`\
  \ 生成由诊断和药物组成的表型[84]。这种方法是无监督的，不需要专家监督来驱动表型学习；然而，该研究在评估衍生表型的临床意义时确实依赖于医学专家的注释。在专门针对心衰竭时，与传统的降维方法（如主成分分析和非负矩阵分解）相比，他们的方法更具可解释性，并增强了预测能力。\n\
  \n将深度学习应用于基于 `EHR` 的表型定义的努力虽然有限，但前景广阔。Glicksberg *等* 使用浅层神经网络在大型 `EHR` 系统中创建表型空间的无监督嵌入[85]。具体而言，他们使用了\
  \ `word2vec`[86] 的 `skip-gram` 算法来学习超过百万名患者结构化 `EHRs` 中医学概念的嵌入。他们首先将患者数据划分为连续的 15\
  \ 天时间间隔，删除重复项并随机打乱概念。每个包含唯一医学概念序列的时间间隔被认为一个“句子”，并使用随机梯度下降法训练 `word2vec` 算法。在训练后的模型中，每个医学概念都表示为一个嵌入向量，所有医学概念都映射在相同的度量空间中。原始序列中相邻的概念在学习到的度量空间中应该聚集。[图\
  \ 3] 显示了从 `ICD-9` 代码 `294.20` “痴呆”开始创建的表型空间。值得注意的是，邻域中的大多数概念在临床上与该疾病相关，并创建了可以更好识别患者队列的“疾病定义”。\n\
  \n为了创建此类疾病队列，作者使用这些嵌入的加权平均总结了患者的病史。对于每个感兴趣的疾病，他们选择一个疾病相关的临床概念作为查询种子，将其扩展到嵌入空间中最接近的概念，并根据患者与此扩展查询之间的距离对患者进行排序。根据相似度最高的患者嵌入，自动为该疾病概念生成假设队列，并与源自\
  \ `PheKB` 的金标准队列进行比较。实验结果显示，对于五种疾病（即 ADHD、痴呆、带状疱疹、镰状细胞病和 2 型糖尿病），其结果与手动推导的金标准表型具有良好的重叠性[87]。\n\
  \n这项研究展示了将深度学习应用于 `EHRs` 以得出患者和医学概念的基于向量表示的潜力。希望这可以用于有效识别不同临床领域有意义的见解。具体而言，在疾病表型应用中，深度学习可以提供可扩展的解决方案，基于相似性关系得出疾病空间的直观定义。文本建模自监督学习的进展，如\
  \ `GloVE`[88]、`FastText`[89]、`Poincarè`[90]、`BERT`（双向编码器表示器）[91] 或 `XLNet`[92]，可能用于扩展\
  \ Glicksberg *等* 的工作，实现对疾病空间更稳健、更全面的理解。\n\n### 4.3. 患者分层\n\n\n\n\n\n个体之间的异质性可能导致相同疾病出现不同的疾病进展模式，并可能需要不同类型的干预措施。即使是简单的疾病也可能表现出不同程度的复杂性，这为识别、治疗和预后带来了挑战。例如，尽管囊性纤维化和亨廷顿舞蹈症都属于孟德尔遗传病，但它们都表现出广泛的症状和程度不一的表型表现。(93,\
  \ 94) 这一特征在`复杂疾病`中尤为明显，其病因在很大程度上仍不清楚，可能是由于多种遗传、环境和生活方式因素共同。复杂疾病患者的特征在多个分析水平上（例如，合并症、行为方面、分子机制紊乱）可能不同，在整个病程中对治疗的反应也存在差异，使得这些疾病难以评估。例如，神经发育疾病（如自闭症谱系障碍\
  \ ASC）的异质性已在不同水平上被检测到。70% 的 ASC 患者存在共存疾病。(95) 遗传学研究报告了数百与 ASC 相关的风险基因，遗传范围在 50%\
  \ 到 80% 之间。(96, 97) 此外，对发育轨迹的调查(98) 根据症状严重程度以及相对于常常的认知和语言障碍区分了行为增长模式。\n\n异质性的表型表现可能反映了存在多个个体亚组，这些个体的状况与多种遗传和环境病因有关，尽管在诊断特征上趋于一致，但表现出一系列临床特征。在个性化医疗的背景下，识别患者群体中的潜在模式有助于开发更优的个性化治疗方案。(99)\
  \ 此外，解析临床异质性可以识别出高影响生物标志物，这些标志物的作用在病例对照研究中可能会被掩盖。(100)\n\n对无监督深度学习技术日益增长的兴趣(3)为研究疾病复杂性提供了一种方法。从计算的角度来看，患者分层是一项数据驱动的无监督学习任务，根据临床特征对患者进行分组。(101)\
  \ 从电子健康记录（EHR）中识别疾病队列内部的亚组的任务通常被称为“基于 EHR 的患者分层”。该领域的工作在患者层面聚合临床数据，将每个患者表示为多维向量，并通过聚类（例如在自闭症中(61)）或拓扑分析（例如针对\
  \ T2D(62)）在特定疾病人群中推导出亚型。深度学习已用于建模 EHR 以得出更稳健的患者表示，以改进疾病分型。(101, 102) Baytas 等人使用\
  \ `LSTM` 网络来利用帕金森病（PD）患者纵向数据进行分层。(101) 同样，Zhang 等人使用 `LSTMs` 识别了 PD 的三个亚组。\n\n患者分层研究主要关注使用\
  \ `ad hoc` 方法针对特定疾病 (61, 62, 101, 102, 104, 105) 因为 EHR 往往是不完整的，使用异质患者队列可以充分捕捉临床特征。(46)\
  \ 该方向的第一种方法由 Landi 等人提出，结合了 `CNNs` 和自动编码器 (`ConvAE`)，从西奈山医疗系统的 160 万患者中学习表示。(103)\
  \ 这些潜在表示结合了 ICD 编码、药物、实验室检查、临床记录和生命体征，旨在识别亚组。首次评估显示 `ConvAE` 在患者聚类方面优于包括 `Deep Patient`\
  \ 在内的若干基准方法。其次，作者表明 `ConvAE` 即可实现有效的患者分层。为此，他们使用了从 EHR 中学习的编码来确定临床相关性。特别是他们评估了六种疾病：T2D、PD、阿尔茨海默病、多发性骨髓瘤、前列腺癌和乳腺癌。结果显示疾病进展、症状严重程度和合并症的影响最大。例如，T2D\
  \ 患者根据合并症（即心血管问题）和症状严重程度（即新诊断症状较轻）被分为三组（见图 4），而 PD 患者表现出不同的病程和症状（即运动和非运动）。这种架构是大规模解锁患者分层的首次尝试，我们在异质队列中学习多用途基于\
  \ EHR 的表示，无需任何特征工程或显式事件标记。\n\n![images](img/fig3_4.jpg)\n\n图 4 通过基于 EHR 的患者分层识别出的\
  \ 2 型糖尿病疾病亚组。(103) 患者被聚类为三组，特征如下：常见的 T2D 症状，例如代谢综合征（亚组 I）；微血管问题（亚组 II）；以及心血管问题（亚组\
  \ III）。\n\n#### 4.4. 临床记录理解\n\n医疗机器学习领域的大量研究关注结构化 EHR，以理解患者的临床轨迹并为获得新的临床见解创造机会。然而，大量的相关临床信息仍然锁定在自由自由文本叙述中。自然语言处理（NLP）作为计算机科学的一个分支，使机器能够处理人类语言用于机器翻译(106)、文本生成(107)和图像描述(108)等应用，已用于解析临床记录以提取可以指导临床决策的相关见解。(47)\n\
  \n\n\n\n\n在深度学习（DL）兴起之前，临床自然语言处理（NLP）主要关注从自由文本中自动提取临床概念，例如疾病、实验室检查、药物和事件（即概念提取）。这些概念通常通过将\
  \ n-grams（即相邻词的序列）与本体（ontologies，如统一医学语言系统（UMLS）进行匹配来识别。从文本中提取的临床概念随后被用于整合结构化的电子健康记录（EHRs），或使用浅层监督方法（如随机森林和支持向量机）来广泛地识别/定义患者的临床状态。这些方法被用于例如：识别符合临床试验条件的患者（(109)）、根据出院摘要自动分配诊断代码（(110)），以及识别医疗状况，如类湿性关节炎（(111)）、肥胖（(112)）和肺部疾病（(113)）。\n\
  \n深度学习应用于临床 NLP 已取得令人鼓舞的结果，并在医学界正获得越来越多的认可（(114)）。特别是，深度学习使得能够减少对预处理的需求，消除概念提取步骤，并转而使用文本中的所有词。大多数工作依赖于基于\
  \ word2vec 的词嵌入和 RNN（通常实现为 LSTM 或 GRU 网络）等技术（(50)）。常见应用处理自由文本中的信息，以探索疾病代码（即 ICD-9/10\
  \ 代码）的自动分配（(115)–117)）、疾病发病预测（(118)）和三天再入院预测（(119)）。\n\nMiotto 等人使用词嵌入和多内核 CNN 来识别临床记录中是否存在急性腰痛（LBP）发作，从而为自动化框架提供信息，该框架可以帮助基层医疗保健提供者在临床实践中制定针对\
  \ LBP 的目标策略（(120)）。急性和慢性腰痛是具有不同治疗方法的疾病。然而，它们在电子健康记录中使用相同的 ICD-10 代码（M54.5）进行编码，仅能通过回顾性病历审查进行区分。这阻止了为计费和治疗建议（如返回工作的选择）建立高效的数据驱动型指南。该研究首次探索了使用基于机器学习和信息检索的自动化方法来分析自由文本临床记录，并识别急性\
  \ LBP 发作。特别是，他们使用了一个包含 17,409 份来自不同基层医疗机构的临床记录数据集，其中 891 份手动标记为急性 LBP，2,973 份通过记录的\
  \ ICD-10 代码与 LBP 相关。他们比较了用于自动识别的不同监督和无监督策略，例如关键词搜索、主题建模、基于 n-grams 词袋的逻辑回归和手动去。\n\
  \n## 5. 讨论\n\n在本章中，我们希望阐明 EHR 和机器学习（ML）方法论的演变。某些问题限制了这些发现可能产生的影响，特别是将发现转化为临床应用。第一个主要问题是模型的可泛化性。事实上，从一个医院的人群构建的模型并不一定能推广到其他医院。换句话说，在训练测试集上具有高\
  \ AUC-ROC（受者特征曲线下的面积）或高特异性/灵敏度的模型，在外部队列上的性能可能会大幅下降。这种差异部分源于偏见和系统流程（(122)）。例如，在某个特定医院中，特定的成像设备可能被用于确定怀疑的病变，这可能会被机器学习算法学习到。虽然可以想象将机器细节作为特征在某些情况下是有价值的，但它可能会导致学习特定医院系统的特征，这本质上构成了过拟合，且无法转化到其他医院。然而，创建具有泛化性模型的另一个重要问题是模型对代表性不足的患者不公平。医疗机器学习模型中的这种不公平问题已经出现。这可能意味着在生物医学中代表性较少的种族和族群个体可能会获得次优的建议，从而导致真实的后果。当某些因素无法从\
  \ EHR 数据中获得时，就会出现这些不公平的模型。诸如社会经济地位、医疗机会和健康食物选择等方面绝对影响健康结果，但并未提供给模型进行控制。因此，这些模型可能会不当地地分配风险估计，从而进一步惩罚那些最需要帮助的人。确保医疗相关机器学习的公平性是一个未解决的问题，并将是一场持续斗争。\n\
  \n这些方面代表了在医疗保健中正确使用机器学习的挑战。研究人员开发了一系列技术实现和建议，可以缓解其中一些问题（(123)）。为了确保训练数据中不同人群有足够的代表性，可以根据具体情况采取某些性能权衡来促进公平。平衡等因素（如等化概率和预测能力）以确保公平将需要针对每个临床问题进行定制推理。此外，可解释模型的实现有助于解释决策过程，从而识别在代表性不足的数据上训练的算法的潜在陷阱（(12)）。\n\
  \n\n\n\n\n结合公平性建模的考虑，增加对服务不足群体的代表性也将提高机器学习在临床实践中的实用性。正如我们所见，由于数据格式以及法律和隐私考量，传统上连接不同机构的数据是非常困难的。像\
  \ `OMOP` 这样的通用数据模型无疑减轻了连接数据的负担，并使复制工作成为可能。在这里，可以共享代码而非数据，这极大地减轻了开展此类研究的负担。然而，从多个数据源进行联合学习仍然是一个问题。`federated\
  \ learning`（联邦学习）等技术的进展允许在不需要共享数据的情况下部署和精炼模型。[124]。当然，对于联邦学习如何在医疗相关机器学习中落地仍存在许多担忧，并且对攻击仍存在担忧，但它代表了一个有效的发展方向。\n\
  \n受益于生物医学中机器学习的最后一个关键领域，是收集更精细、更连续的数据，以填补护理中的空白。[125]。当医生治疗患者时，他们处理的是不完美的信息表示，而且有很多重要数据是未知的，例如患者在就诊期间的饮食、睡眠和运动计划。这些信息无疑可以增强医生治疗患者的能力，认为它们也会提高机器学习的性能绝非异想天。被动数据采集模式，如传感器、可穿戴设备、移动应用程序以及智能镜子，可以填补这一空白。\n\
  \n随着日益增长的患者相关数据的可用性，随之还将出现一系列新的基础设施、法律、伦理和 IT 相关问题。对这些问题（特别是关于公平性）的持续关注让我们鼓励该领域能够解决这些问题，但这需要严格的标准和持续的关注。\n\
