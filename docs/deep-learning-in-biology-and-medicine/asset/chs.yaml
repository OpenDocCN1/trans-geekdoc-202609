  - arnau.oliver@udg.edu\n- llado@eia.udg.edu\n\n近年来，深度学习因在许多计算机视觉任务中表现出的卓越性能引起了研究人员的关注；医学图像分析也不例外。在本章中，我们讨论了医学影像中被考虑的通用深度学习策略；广泛的预处理、处理和后处理方案；其目标和应用；并讨论了未来为了缓解其在临床实践应用而需要解决的关键挑战。\n\
  \n## 1. 引言\n\n机器学习技术已成为我们日常生活的一部分：从推荐产品和服务的智能系统，到安装在智能手机中能够理解并相应回答问题的复杂自然语言处理器。在医学领域，这些智能系统允许在敏感、复杂且耗时的任务（主要是诊断）中支持并简化医疗决策，这些任务在不久前还是无法解决的，例如自动乳腺癌筛查、皮肤病变分类、心脏结构分割与诊断、视网膜标记和病变的分割与识别、组织病理学图像分析以及脑分割。\n\
  \n机器学习的一个分支——深度学习，因其在无数计算机视觉应用中的惊人性能而成为热门话题。尽管深度学习在医学图像分析中的早期应用可以追溯到 20 世纪 90 年代，但由于缺乏充分且标记正确的数据、计算能力的限制以及可解释性的降低，阻碍了研究人员继续开发此类深度学习技术。随着图形处理器（GPU）的普及、成像技术的改进以及收集和处理海量数据的努力，这一研究领域得到了大幅的复兴和扩展，如图\
  \ 1 所示。\n\n医学影像中的深度学习在近年来得到了广泛综述。在本章中，我们旨在概述医学领域中广泛使用的策略（第 2 节），描述了脑图像分析的具体应用（第\
  \ 3 节），并讨论了当前的挑战和未来方向（第 4 节）。我们打算涵盖在 2012 年至 2020 年间发表的该领域的工作。\n\n![images](img/fig2_1.jpg)\n\
  \n图 1. 根据 Google Scholar，2012 年至 2020 年间使用深度学习进行医学影像的出版物数量。关键词：深度学习和医学影像。（查询日期：2020\
  \ 年 12 月 20 日）。\n\n# 2. 医学图像分析深度学习策略的分类\n\n在本节中，我们从通用层面描述了用于医学图像分析的深度学习策略。如图 2 所示，我们根据输入和输出维度、输入源、网络连接、上下文信息源以及训练方案对其进行分类。\n\
  \n## 2.1. 输入维度\n\n深度学习策略可以根据其输入维度分为 2D、2.5D 和 3D，如图 3 所示。二维卷积神经网络处理从单个正交面（例如，轴状面、矢状面或冠状面）提取的\
  \ 2D 信息。这类网络在文献中被广泛，因为它们的基准最初是为自然图像处理引入的，它们可以很容易地适应不同的成像技术，而且其计算需求低于其 2.5D 和 3D\
  \ 版本。Ulas *et al.* 使用具有多个通道（每个时间点一个通道）的 2D 架构处理 4D 动态对比增强磁共振图像（2D+时间），以计算血脑屏障功能障碍的定量。\n\
  \n三平面（也称为 2.5D）架构从三个正交视点（例如，轴状面、矢状面和冠状面）接收 2D 输入。这种特性使得它们非常有吸引力，因为它们使用 2D 卷积核，其需求低于\
  \ 3D 网络，并且结合了额外的上下文信息，与 2D 网络相比，可能会提高性能。\n\n3D 网络可用于直接利用 3D 体数据数据。尽管它们的需求比其他变体得多，且受限于\
  \ 3D 采集，但与 2D 和 2.5D 架构相比，它们整合了额外的上下文信息，可能导致性能增强。\n\n![images](img/fig2_2.jpg)\n\
  \n图 2. 医学图像分析深度学习策略的分类。\n\n值得注意的是，3D 网络往往优于它们的 2D 类似物，但性能差异可能并不显著。此外，在成像变化的特定场景下，2D\
  \ 网络可能更有用。\n\n## 2.2. 输出维度\n\n医学图像分析深度学习的开创性工作为给定输入产生单个标签（分类网络）。作者通过卷积层提取特征，将它们拼接并平直化为一个一维特征向量，并通过全连接层对其进行挖掘，以推断输入内容并预测相应的标签。然而，对于需要处理每个体素（voxel）的任务（例如分割或图像生成），这种处理策略将非常不便且计算开销（时间（内存）极高，因为网络需要处理的输入数量与所分析扫描中的体素数量一样。\n\
  \n![images](img/fig2_3.jpg)\n\n图 3. 脑磁共振成像中输入维度的示例。2D 和 2.5D 模型分别使用二维卷积核从单个平面或多个平面获取信息。3D\
  \ 模型直接使用 3D 卷积核分析体数据。\n\n\n\n\n作者们已经研究了更快的密集预测方法以解决这个问题。一种广泛使用的近似方法称为全卷积神经网络，其特征是使用\
  \ `1 × 1` 卷积（3D 处理中为 `1 × 1 × 1`）来代替全连接模块。这些模块充当嵌入式多层感知器，可能会增强整个模型的判别能力和表示能力。此外，作者还考虑使用上采样层或上卷积层来增大输出的基数。\n\
  \n卷积神经网络中流行的架构模式是 U 形，因为它结合了上述两种策略。U-Net 包含一个收缩路径（执行连续的卷积和下采样操作）和一个扩张路径（执行相继的上采样和卷积），如图\
  \ 4 所示。通过这种方式，可以输出与输入具有相同尺寸的块，同时缩短响应时间。此外，U-Net 结合了跳跃连接或残差连接，将来自高分辨率层的特征图与反卷积后的图合并，以保留定位细节并改进反向传播。到目前，特征图的结合是通过拼接或相加来实现的。注意，后者策略有助于减少网络可训练参数的数量。\n\
  \n![images](img/fig2_4.jpg)\n\n图 4. U-Net 示例。U-Net 包含一个编码路径和一个解码路径。编码路径执行连续的卷积和下采样，直到达到特定水平（潜空间）。解码路径执行相继的上采样和卷积，以输出与输入尺寸大小的图像。此外，U-Net\
  \ 结合了跳跃/残差连接，将来自高分辨率层的特征图与反卷积后的图合并。\n\n提取的特征也可以用于同时处理多个相互相关的任务，从而产生多个输出。Le *et al.*\
  \ 和 van der Voort 使用单个编码-解码网络对感兴趣区域进行分割和分类。在两种情况下，分类都使用了来自潜空间的特征。一方面，多任务预测可能会增加模型的有效性，因为在训练期间多个损失会在网络中进行传播。另一方面，这类模型只有在有足够的多个任务数据可用时才能进行训练。\n\
  \n### 2.3. 输入源和模态\n\n网络可以整合来自各种模态和来源的信息——如果可用的话。这种多模态信息融合有助于网络更好地区分类别。融合可以发生在最开始阶段或预测之前，分别称为早期融合和晚融合。网络整合多种模态的成功案例包括：磁共振成像与正电子发射层扫描的结合；用于构建模态不变空间的\
  \ `T1-w`、`T2-w` 和分数各向异性；以及它们在修复缺失白质高信号方面的适用性。\n\n### 2.4. 网络连接\n\n自动特征提取是网络根据输入输出学习的关键过程。它们从输入中捕捉的信息越有价值，响应就越好。然而，不同的网络可以并行或串联排列进行捕获。\n\
  \n并行数据处理由多个处理同一区域变体的网络组成，特征随后会被合并，如图 5 所示。信息融合可以在每个网络产生其个体响应之前，也可以在之后——即响应级。显然，这类方法的主要缺点是计算成本增加。一些相关架构包括多尺度或多分辨率网络，它们处理来自不同解剖平面的数据（例如\
  \ `2.5D`），以及分别处理来自多种模态数据的多模态网络。Moeskops *et al.* 和 Kamnitsas *et al.* 提供了定性和定量示例，证明了在分割任务中，这些网络相比其独立的数据处理可以有显著改进。\n\
  \n![images](img/fig2_5.jpg)\n\n图 5. 并行 (a) 和串联 (b) 数据处理。在前者中，多个网络处理同一区域的变体。在后者中，一个网络的输出被输入另一个网络以处理、纠正、平滑或优化最终响应。\n\
  \n串联（文献中也称为级联）数据处理通常被用作精化策略。然而，一些工作使用了这种近似方法来执行一个接一个的任务（例如在去除颅骨后进行分割）。该方法是将一个网络的输出馈给另一个网络进行处理、纠正、平滑或优化最终响应。这些网络已成功用于计算机断层中的肝脏分割及后续肝脏病变分割、优化计算机断层中的多器官分割结果以及多发性硬化病变分割。在大多数情况下，级联模型的表现优于它们的单模型对应物。\n\
  \n\n\n\n文献中找到大多数策略并没有一次性处理整个输入数据。相反，作者通常从输入中提取补块（patches），使用网络对它们进行独立处理，并在处理完成后将其合并以获得整个图像的输出。补块内容为网络提供了上下文信息，网络可以使用这些信息来恰当地执行任务。一方面，补块越大，网络接收到的隐式上下文信息就越多，在某些情况下，网络性能也越好^(35,)\
  \ ^(42,) ^(44)另一方面，补块尺寸越大，可训练参数越多，处理速度越慢，正确训练网络所需的数据也越多。无论如何进行近似，基于补块的策略都放弃了有助于增强整体性能的相关上下文信息。(81)为了克服上述局限性，卷积神经网络最近配备了显式信息。\n\
  \n显式上下文信息的卓越应用包括：Ghafoorian 等人^(64,) ^(85) 以及 Wachinger 等人^(79) 作品中使用笛卡尔坐标或谱坐标^(82–84)，以及\
  \ Kushibar 等人^(86) 和 Jia 等人^(87) 作品中使用基于图谱的分割先验。注意，引入显式信息有助于更好地区分结构和半球，如图 6 所示，但它也可能会增加计算复杂度（例如由于配准）。\n\
  \n## 2.6 训练方案\n\n深度学习方法可以针对感兴趣的特定从零开始训练。这种训练方案在文献中广泛存在。然而，它的实现要求研究人员有足够的样本进行训练，或者对现有样本进行适当的增强，这在医学领域并不理想，因为训练样本量通常较小且具有异质性。可以使用替代的训练方案来应对上述问题，例如对抗训练或迁移学习。\n\
  \n对抗训练^(88) 利用相互竞争的网络，如图 7(a) 所示。在生成对抗训练中，一个网络学习训练数据的底层层结构并从其分布中生成样本（生成器），另一个网络则判断输入数据是否为合成数据（判别器）。生成器的任务是创建质量高到足以欺骗判别器的合成数据，而判别器的任务是找到数据中能够帮助其区分伪图像和真实图像的特征。注意，在数据特别稀缺的医学图像分析中，生成器特别受到关注。(21)这些网络的两个丰实应用是：从脑解剖结构和肿瘤分割图生成真实的磁共振扫描，同时保护患者信息^(89)；以及使用循环生成对抗网络构建具有领域偏移韧性的分割网络。(90)在领域不变训练中，通过惩罚模型提取不同的特征，^(91–93)，可以训练在两个或多个相关且异质的数据集上表现良好的模型，如图\
  \ 7(b) 所示。关键优势是模型学习提取对训练案例中异质性不变的特征。\n\n![images](img/fig2_6.jpg)\n\n图 6. 谱坐标作为显式上下文信息。颅内内的该坐标系允许区分左右半球、前部和部以及上方和下方。\n\
  \n在迁移学习中，存储在预训练网络中的知识被用于一个不同但相关的任务。(93–95)通常情况下，网络的一部分用作通用特征提取器（卷积层），而其他部分（全卷积层）针对新问题进行微调，(96–102)，如图\
  \ 8 所示。这种策略加速了训练，使得可以使用较小的数据集应用深度架构，并可能减少训练所需的训练样本数量。\n\n![images](img/fig2_7.jpg)\n\
  \n图 7. 对抗训练利用相互竞争的网络，例如生成器和判别器。(88)在生成对抗训练中，生成器的任务是创建质量高到足以欺骗判别器的合成数据，而判别器的任务是找到数据中能够帮助其区分伪图像和真实图像的特征。在领域不变训练中，特征提取器因对不同的输入提取不同的特征而受到惩罚。\n\
  \n## 3. 脑图像分析中的应用\n\n除了病理相关的图像分析外，脑图像分析是医学深度学习的主要发展领域。(20)在本节中，我们关注这些工作。我们搜索了 2012\
  \ 年 2020 年间发表脑图像分析的期刊论文。我们的搜索关键词如下：“脑”、“医学图像分析”、“深度学习”、“卷积神经网络”。我们使用了 Elsevier 和\
  \ IEEE Xplore 来执行此类任务。处理流水线包括预处理、处理和后处理。(25)在接下来的章节中，我们将讨论我们在使用深度学习进行脑图像分析这些方面的发现。\n\
  \n![images](img/fig2_8.jpg)\n\n图 8. 在迁移学习中，以前为处理某些任务训练的网络的一部分被迁移到另一个任务中。\n\n###\
  \ 3.1 预处理\n\n文献中常用的预处理策略总结在图 9 中。脑部采集可能包含对感兴趣的任务具有特殊意义的区域，例如头皮、颅骨、小脑、眼睛等。这些区域的存在不仅可能损害整个分析(103,)\
  \ (104)，还可能导致移除不准确(105–107)我们发现，在我们的文章中约 48% 执行了颅骨和小脑的去除，使其成为最常见的预处理步骤。注意，这个数字可能比这里报告的要，因为来自热门挑战的公共数据集可能已经过过处理。常用的非脑区域去除方法包括：作为\
  \ FSL 工具箱一部分的脑提取工具 (BET)`^(108,) (109)`、健壮脑提取 (ROBEX),(110)、用于儿童脑提取的脑提取与标记算法 (LABEL)`^(111)`\
  \ 以及基于非局部分割技术的脑提取 (BEaST)`.(112)。\n\n![images](img/fig2_9.jpg)\n\n\n\n\n\n图 9. 用于脑图像分析的预处理策略。数字表示其在修订后的期刊论文中的出现次数。剥离：颅骨和小脑剥离。强度标准化：`z`-score、`min–max\
  \ 归一化、直方图匹配。信号过滤：低通、带通和高通滤波。ROI 选择：ROI 的手动裁剪。\n\n数据一致性处理（Data harmonisation）是指对可能来自不同扫描仪（不同厂商）的采集数据进行标准化，这也是文献中处理流水线的重要部分。特别是，我们观察到在综述的期刊论文中，强度标准化、配准和重采样分别应用于\
  \ 43%、41% 和 22% 的论文。强度标准化是使用 `z`-score（零均值、单位方差）、强度重缩放（例如从 0 到 1）、直方图匹配，^(113,)\
  \ ^(114) 以及强度裁剪完成的。然而，更近期的强度标准化技术，例如基于分割的标准化，^(115)、白条^(116) 或通过线性回归消除人工体素效应（RAVEL）^(117)\
  \ 尚未被考虑。配准和重采样主要用于重新对齐动态或功能采集的扫描，或将所有模态和扫描带到标准空间（例如来自队列的参考扫描）。\n\n由于扫描过程的性质或持续时间，磁共振成像采集容易产生伪影，例如偏置场不均匀、噪声以及由内在和外因素引起的截断伪影。此外，功能或动态采集还会受到时间失真的的影响，例如\
  \ k 空间采样期间的运动导致。在 32% 的修订作品中纠正了空间强度不均匀性，通常使用非参数非均匀强度归一化（N3）^(118) 和 N4ITK.^(119)。注意，需要谨慎应用这些偏置场校正方法，以避免对分析产生任何副作用，正如\
  \ Valdés-Hernández *et al.*^(120) 作品中所的那样。空间信号过滤（包括低通、带通和高通滤波）在 11% 的回顾文章中被考虑，而适用于功能或动态采集的运动校正用于\
  \ 7% 的论文。\n\n### 3.2. 处理任务\n\n对于每篇论文，我们分析了目标、处理任务（例如分类和分割）、所考虑的数据集数量及其可用性、作者是否进行了跨数据集评估，以及作者是否考虑了迁移学习或从零开始训练网络。我们将所有这些细节浓缩在\
  \ 表 1 中。\n\n医学界已经公开了数据集和挑战^(a)，允许研究人员在相同的评估框架和指令下比较他们的工作。这些可用数据集大部分集中在分割和分类任务上。这一事实可能解释了为什么基于深度学习的脑图像分析应用的大部分（约\
  \ 73%）集中在这两个任务上。其余 27% 分布如下：7% 用于回归，7% 用于检测，3% 用于生成，其余用于图像增强、预测、配准、检索和超分辨率。\n\n\
  表 1. 2012 年 1 月至 2020 年 1 月期间发表的脑磁共图像分析期刊文章。在数据集列中，括号中的数字表示数据集的数量。Private 指临床或私人数据集合。AD：阿尔茨海默病。MS：多发性硬化。ADHD：注意缺陷多动障碍。\n\
  \n![images](img/tab2_1.jpg)\n![images](img/tab2_1a.jpg)\n![images](img/tab2_1b.jpg)\n\
  ![images](img/tab2_1c.jpg)\n![images](img/tab2_1d.jpg)\n\n这些公开挑战的缺点是，算法通常经过调整以在这些特定数据集上表现最好（倾向于明显的过拟合），但它们在可能具有不同采集方案、成像质量、目标人群等其他关键因素的未见数据集上可能并不那么好.^(121)\
  \ 跨数据集评估成为解决这一问题的合适且必要的工具，并定量地证明了建议方法的泛化能力以及最终对现实场景的适用性。从我们的文献综述中，我们注意到不到五分之一的作品执行了此类评估。即使在数据集可用的情况下（例如组织、下皮结构、肿瘤和白质高信号的分割），研究人员也倾向于忽略它们（约\
  \ 90%）。\n\n目前减少领域偏移问题影响并提高深度学习在临床实践中适用性的方法是迁移学习和领域不变训练，^(122,) ^(123)，如第 2.6 节 迁移学习通过最初在恒等映射上训练网络，然后在感兴趣的任务上训练，以减少完全训练网络所需的病例数^(40)\
  \ ^(96)；(2) 领域不变训练通过惩罚网络为不同领域提取不同特征，来强制网络学习领域不变特征^(92)；^(91)；(3) 迁移学习通过微调将旧模型适应到少数具有可能不同状况的病例中^(96–99)；(4)\
  \ 对比不可知训练使模型对强度变化具有鲁健性，并在不需要重新训练或微调的情况下在未见模态上表现良好。^(124)。尽管如此，我们观察到这些技术在文献中并不常见。事实上，不到\
  \ 10% 的作品使用了这些策略。\n\n### 3.3. 后处理\n\n后处理由精炼深度学习模型提供的结果。在我们的综述中，大约 36% 的作品考虑了后处理，并将其用于将概率图转换为硬分割图（例如，通过阈值化），^(39)\
  \ ^(40) ^(58) ^(73) ^(125–127) 过滤伪影和较小或较大的区域，^(44) ^(45) ^(67) ^(73) ^(86) ^(98)\
  \ ^(128) 平滑分割图（例如，填充空洞），^(30) ^(42) ^(52) ^(79) ^(129–131) 或得出最终裁决（例如，通过多数投票法）。^(77)\
  \ ^(132–136)。\n\n\n\n\n\n尽管近期深度学习方法在医学图像分析方面取得了成功，但在将其投入常规临床实践之前，仍有许多待解决的问题。我们确定了未来需要应对的关键挑战：回顾性数据一致性、数据可用性、泛化性、信息融合局限性以及可解释性。\n\
  \n## 4.1. 成像挑战\n\n医学影像采集设备在不同程度上都会受到内在和外源成像伪影的影响。例如，由于采集过程的性质，磁共振成像容易产生瑞利噪声^(215)；偏置场不均匀性取决于接收线圈相对于成像物体的位置；k\
  \ 空间欠采样可能会产生环形伪影^(216)；运动可能会引入低高频率的失真^(217,) ^(218)。这些失真会降低图像质量并产生变异，可能导致算法无法像在处理“清洁数据”时那样有效。\n\
  \n回顾性图像增强有助于减少训练与测试之间的差异。传统方法利用关于噪声或伪影的`a priori`信息来增强图像。我们认为深度学习在这方面可以产生重大影响，因为网络可以从输入数据中直接学习有助于减少这些成像伪影的统计数据。近期提出的深度学习技术包括磁共振成像运动伪影校正，^(219,)\
  \ ^(220),磁共振成像去噪^(221,) ^(222)以及低剂量计算机断层扫描去噪^(223,) ^(224)。尽管如此，这些技术作为预处理步骤的适用性仍需针对特定任务进行定量评估。\n\
  \n数据一致性有助于减少训练域和测试域之间的差异。需要对此主题的研究以进一步改进一致性及后续处理^(225)。此外，使用领域适应技术（例如通过迁移学习或图像合成）可以帮助缓解切换域时的性能下降^(96,)\
  \ ^(123)。在某些情况下，即使是单个案例也能让训练过的模型在另一个域上的表现与完全训练的模型相似^(98,) ^(99)。这些方法在文献中尚未广泛应用，跨数据集评估也是如此。我们认为应该在这些方面开展更多工作，以检查基于深度学习的解决方案的实用性而非复杂性。\n\
  \n## 4.2. 深度学习挑战\n\n深度学习技术具有其本质的几个缺点和问题：泛化性、信息融合局限性和可解释性。深度学习系统包含一个隐含假设：在小规模训练图像上最小化损失函数的同时进行缓慢参数调优，使其能够良好地泛化到其他可能从未见过的样本。尽管这一假设在许多领域可能成立，但在医学图像分析中并不成立，因为那里通常缺乏大型、异质且标注良好的的数据集。尽管近年来已发布了一些有价值的公共数据集，但不仅为了以更具泛化的方式训练网络，为了可重复性，还需要更多的真值（ground\
  \ truth）。图像合成或数据增强的进一步开发有助于克服这些局限性^(124,) ^(218)。此外，还需要更多的框架。\n\n信息融合意味着将图像数据与个人、临床和基因数据相结合。深度学习技术非常适用于自然信号（如图像），目前的研究重点是如何将这些数据整合到深度学习中，以提高疾病的预测能力或改进治疗效果^(226)。深度学习的另一个问题是可解释性^(227,)\
  \ ^(229)。系统由大量的参数组成。理解深度学习模型为何或如何输出结果并非易事。此外，深度学习的输出通常不提供任何不确定性度量。这往往导致产生错误或错误的输出，且置信度与正确输出相同。估计深度学习方法的确定性^(233)可以提高其可靠性和准确性^(179)\n\
