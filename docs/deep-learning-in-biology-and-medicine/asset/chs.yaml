  \ 768, `A` = 12. \n- `BERT-Large, Uncased`: `L` = 24, `H` = 1024, `A` = 16.\n- `BERT-Base,\
  \ Cased`: `L` = 12, `H` = 768, `A` = 12.\n- `BERT-Large, Cased`: `L` = 24, `H` =\
  \ 1024, `A` = 16.\n- `BERT-Base, Multilingual`: `L` = 12, `H` = 768, `A` = 12.\n\
  \n基于 `BERT` 及其预训练模型，出现了许多被称为 Bertology 的项目和模型。一些流行的模型包括：\n\n- `ALBERT` (用于自监督语言学习的轻量级\
  \ BERT)：与 `BERT` 相似，但有一些变化，最显著的是用句子排序预测取代句子预测。\n- `RoBERTa` (鲁棒优化的 BERT 预训练)：一个更大的模型，使用了\
  \ 160GB 的文本进行训练（比 `BERT` 多 144GB），并使用了动态掩码；不再使用句子预测。带来了 2%-20% 的提升。\n- `ERNIE` (集成知识的增强表示)：通过知识掩码策略（实体级和短语级掩码）学习语言表示。知识信息由知识图谱提供。\n\
  - `DistilBERT`：通过模型蒸馏比 `BERT` 小（一半）。提高了推理速度，但性能损失 3%。\n- `BART`：具有编码器和解码器的序列到序列模型。预训练遵循\
  \ `BERT` 策略，但对输入 token 进行了变换：掩码或删除随机 token、将 `k` 个 token 的范围掩码为单个掩码标记、扰乱句子。解码器从左到右进行（类似于\
  \ `GPT`）。\n- `XLM`：跨语言模型。应用两种方法学习语言模型：一种是依赖单语言数据的无监督方法，另一种是利用并行数据的监督方法。在跨语言分类和机器翻译上获得了\
  \ SOTA 结果。\n- `XLNet`：`Transformer-XLM` 模型的扩展，通过考虑输入序列的所有排列来预训练以学习双向上下文。在多个 NLP\
  \ 任务上优于 `BERT`。\n- `Sentence Transformer`：提供基于 Transformer 网络的句子嵌入库。模型经过微调，使得含义相似的句子在向量空间中接近。\n\
  \n\n\n\n已经定义了许多其他模型，例如 CamemBERT、BARThez、FlauBERT 等。请参见 [`huggingface.co/models`](https://huggingface.co/models)\
  \ 中的“支持的模型”列表，生物医学变体留至第 6.3 节。\n\n如前所述，BERT 是目前最流行的编码器模型（CWR），但 GPT-3 在许多 NLP 任务中取得了最好的结果，因此对这两个模型进行比较可能有用：\n\
  \n* GPT-3 的规模是 BERT-Large 的 470 倍。训练成本呈指数增长。仅加载模型就会占用 300GB 的显存。\n* BERT 是完全开源的，而\
  \ GPT-3 仅符合此类别。\n* BERT 仅使用 transformer 的编码器，而 GPT-3 同时 使用了编码器和解码器。\n* BERT 的微调过程更为复杂且昂贵。\n\
  * 与 GPT-3 相，BERT 拥有多种语言的模型：包括单语言模型和多语言模型。\n* 许多 BERT 模型可以在 Transformers 库中获取。\n\
  * 对 GPT-3 的常见批评是它是在低质量的互联网数据上训练的。\n* GPT-3 可以通过提供纯英文指令进行调优，而 BERT 则需要特定任务的数据。\n\
  * GPT-3 在语言建模任务（如机器翻译 MT 或语音识别 AS）上表现更好，而在推理任务（问答 QA、逻辑推理 LI、改写）上较差。\n\n### 6.3.\
  \ 生物医学领域 NLP 的深度学习模型\n\n在通用领域训练的模型在应用于特定领域文本时表现并不佳。这在生物医学等高度专业化的领域尤为如此，这些领域的词汇分布与通用领域大不同。这就是为什么开发了许多特定领域的模型，其中大多数是通过微调通用领域的预训练模型来实现的。Transformers\
  \ 库是此类模型的极佳来源。在 BERT 中最受欢迎的生物医学变体有 SciBERT、BioBERT、ClinicalBERT、Bio ClinicalBERT、BlueBERT\
  \ 和 PubMedBERT。接下来我们将简要描述这些模型，让读者从文献 51 中寻求更多细节。\n\n* SciBERT 是一个在 BERT 数据集上进行预训练，并在\
  \ Semantic Scholar 语料库中 114 万篇生物医学（82%）和计算机科学（18%）论文的全文上进行微调的模型。\n* BioBERT 使用 BERT\
  \ 训练数据集，并辅以 PubMed 摘要（45 亿词）和 PMC 全文文章（135 亿词）进行预训练。BioBERT 在生物医学命名实体识别与分类（NERC）、关系抽取和问答（QA）任务上表现良好，获得了\
  \ 0.51–9.61% 的提升。\n* ClinicalBERT 是用于临床笔记的 BERT 变体。它使用 MIMIC-III 数据库中的 200 万份临床笔记进行了微调。MIMIC-III\
  \ 是一个公开的电子健康记录（EHR）数据库，包含与 40,000 名重症患者相关的匿名健康数据。该数据库包含临床笔记、实验室检查结果、诊断、手术和药物。在 BERT\
  \ 和 BioBERT 模型的基础上，利用 MIMIC-III 中的所有数据或仅出院摘要构建了两个变体。ClinicalBERT 模型在临床 NLP 方面优于其他模型。\n\
  * Bio ClinicalBERT 与 ClinicalBERT 类似，但使用的是 BioBERT 而不是 BERT 作为预训练模型。根据使用的 MIMIC-III\
  \ 数据，可以构建两个模型：Bio+clinical BERT 和 Bio+Discharge Summary BERT。在[文献 [54]](#4.xhtml#ref4_54)中，这些模型在\
  \ i2/b2 基准测试包含的任务上进行了评估。BioBERT 在去标识化任务中获胜，Bio ClinicalBERT 在时序关系抽取中获胜，Bio+Discharge\
  \ Summary BERT 在临床关系抽取中获胜。\n* PubMedBERT 从零开始在生物医学文本上进行预训练。预训练语料库包含 1400 万 PubMed\
  \ 摘要（30 亿词，21GB）。通过添加 PMC 的全文文章学习了一个增强版本，预训练语料库大幅增加到 168 亿词（107GB）。PubMedBERT 在所有生物医学\
  \ NLP 应用中均优于之前的语言模型。\n\n生物医学语言理解与推理基准（BLURB）是一个评估基准，类似于 GLUE，但针对基于 PubMed 的生物医学\
  \ NLP 应用进行了调整。BLURB 包含六个不同任务的 13 个数据集。所有这些变体已在[文献 [55]](#4.xhtml#ref4_55)中经过评估。没有哪个变体能在所有任务中都提供最佳性能。以\
  \ BLURB 分数为衡量标准并 BERT 结果为基准，百分比提升如下：RoBERTa: 0.45%，ClinicalBERT: 1.58%，SciBERT (Uncased):\
  \ 3.7%，BioBERT: 5.66%，以及 PubMedBERT: 6.72%。\n\n### 6.4. 深度学习模型在生物医学领域的应用示例\n\n我们在本节中介绍了深度学习技术在\
  \ NLP 任务中的几个应用示例。\n\n**开放信息抽取：**[文献 [56]](#4.xhtml#ref4_56) 在新闻领域和生物医学领域之间进行了领域适应实验。对于新闻领域，使用了来自\
  \ WikiNews 的 1,959 句子。对于生物医学领域，使用了 DDI 语料库，该库由 792 个 DrugBank 定义和 233 个 Medline\
  \ 摘要组成（用于 DDI Extraction 2013 任务）。[文献 [57]](#4.xhtml#ref4_57) 解决了药物识别和药物相互作用抽取的问题；该挑战中得分最高的系统（FBK\
  \ IRST）在 NERC 任务中获得了 0.651 的 F1 值。我们将此得分作为基准。在文献 56 中比较了三种迁移方法：(i) 转化，即从新闻领域学习知识迁移到生物医学领域；(ii)\
  \ 归纳，即将少量生物医学数据输入神经网络；(iii) 传统，即在生物医学数据上进行训练和测试。比较了四种嵌入：Glove、BERT、XLNet 和 XLM-RoBERTa。对于传统迁移方法，所有嵌入均优于基准，F1\
  \ 从 Glove 的 0.71 提升到 XLM-RoBERTa 的 0.79。同样在归纳设置中，嵌入优于基准，F1 从 Glove 的 0.74 提升到 XLM-RoBERTa\
  \ 的 0.78。仅在转化设置下，基准以微弱优势领先 XLM-RoBERTa (0.64)。\n\n**机器理解：**[文献 [58]](#4.xhtml#ref4_58)\
  \ 发布了 BioMRC，一个生物医学机器阅读数据集。该数据集提供三个版本：大型（812,707 个实例）、轻量级（100,000 个实例）和微型（60 个实例，由人工回答）。作者还介绍了一种基于\
  \ BERT 的新 MRC 模型。\n\n**摘要：**[文献 [59]](#4.xhtml#ref4_59) 发布了 PreSum，它包含一个适用于抽取和生成模型的\
  \ BERT 通用框架。基于该模型，[文献 [60]](#4.xhtml#ref4_60) 发布了 MatchSum。作者将自动摘要任务形式化为语义文本匹配问题，源文档和从原文提取的候选摘要将在语义空间中进行匹配。\n\
  \n**推文中的药物提及检测：**[文献 [61]](#4.xhtml#ref4_61) 应用迁移学习对提及药物的推文进行自动分类。问题被设定为二分类，并使用了\
  \ BERT、BioBERT、ClinicalBERT、SciBERT、BioMed-RoBERTa、ELECTRA 和 ERNIE。BioMed-RoBERTa\
  \ 获得了最高的 F1 分数。\n\n\n\n\n\n### 构建医疗单元的嵌入\n\n研究人员为构建医疗实体的静态表示做出了许多努力。[参考文献 [62]](#chapter4.xhtml#ref4_62)\
  \ 提出了 `med2vec`^(eee) 系统，该系统通过大量的电子健康记录（EHR，包含 1,381,549 名患者，每人平均 6.3 次就诊）学习医疗实体（NE）的嵌入，利用了每个患者随时间变化的就诊序列结构，其中每次就诊包含\
  \ EHR 数据集中多个医疗概念，如诊断、手术和药物（通常带有代码）。[参考文献 [63]](#chapter4.xhtml#ref4_63) 提出了 `cui2vec`^(fff)\
  \ 系统，识别医疗文档中的 CUI（UMLS 元数据集中的概念唯一标识符）代码。该系统的工作原理是首先将文档中出现的所有医疗术语映射到相应的 CUI。然后，构建\
  \ CUI–CUI 共现矩阵。该矩阵可以直接通过 `GloVe` 进行分解以创建嵌入。输入数据包括来自健康保险计划的理赔数据库、来自 PMC 的全文期刊文章以及临床笔记中的概念共现数据集。\n\
  \n### EHR 的 ICD 编码\n\n对 EHR 中医疗实体的出现进行编码是一项困难的任务，如 第 4.1 节 所示。在疾病情况下，由于术语的高度多义性、缩写和简写的频繁使用、临床笔记作者背景的差异、特殊术语的使用等，问题变得更具挑战性。习惯性的编码方式是\
  \ `ICD`（国际疾病分类）。最常用的版本是第 10 版，即 `ICD-10`，尽管某些资源使用 `ICD-9` 编码，且 `ICD-11` 的使用日益广泛。一个问题是版本之间的映射并不容易。`ICD-10`\
  \ 代码分为两套代码集：用于疾病的 `ICD-10-CM`^(ggg) 和用于手术的 `ICD-10-PCS`^(hhh)。\n\n使用 `ICD-10` 代码对\
  \ EHR 进行标注已引起许多研究人员的关注；深度学习（DL）方法在该任务中的比较可参见 [文献 [64]](#chapter4.xhtml#ref4_64)。[参考文献\
  \ [65]](#chapter4.xhtml#ref4_65) 介绍了 FHDO 生物医学计算机科学小组 (BCSG) 参与 CLEF eHealth 2020\
  \ 任务 1 子任务 1 多语言信息提取，该任务关注西班牙语临床文本的 `ICD-10` 编码。该问题具有挑战性，且该方法展示出了一些有趣的新颖之处：由于训练材料稀缺，使用了来自\
  \ `MIMIC-III` 的额外数据，但这些材料使用 `ICD-9` 编码且临床笔记为英语，因此需要进行 ICD 版本之间进行翻译和映射。尝试了 `BioBERT`、`ClinicalBERT`\
  \ 和 `XLNet`。`BioBERT` 和 `XLNet` 的集成取得了最佳结果。\n\n### 从 EHR 预测临床事件\n\n从 EHR 中预测临床事件（有时受时间限制，如自杀、死亡、病情恶化或恢复等）从经济和健康角度来看都是一项重要任务。[参考文献\
  \ [66]](#chapter4.xhtml#ref4_66) 从 EHR 中预测临床事件（有时受时间限制，如自杀、死亡、病情恶化或恢复等）从经济和健康角度来看都是一项重要任务。该问题具有挑战性，且该方法展示出了一些有趣的新颖之处：由于训练材料稀缺，使用了来自\
  \ `MIMIC-III` 的额外数据，但这些材料使用 `ICD-9` 编码且临床笔记为英语，因此需要进行 ICD 版本之间进行翻译和映射。尝试了 `BioBERT`、`ClinicalBERT`\
  \ 和 `XLNet`。`BioBERT` 和 `XLNet` 的集成取得了最佳结果。\n\n\n\n\n最近，关于上下文词表示（Contextual Word\
  \ Representation）或静态嵌入究竟捕捉了什么一直存在争议：仅仅是上下文？句法？还是语义？词嵌入是否捕捉了常识知识？[参考文献 [69]](#chapter4.xhtml#ref4_69)\
  \ 指出，`DL` 模型在需要常识推理的任务上表现不佳。他们提出了常识自动生成解释（`CAGE`）框架来解决这个问题。[参考文献 [70]](#chapter4.xhtml#ref4_70)\
  \ 认为，仅在词形式上训练的系统没有办法先验学习语义。我们可以将他们的论点扩展到常识，即在大多数情况下，常识并没有显式地出现在文本中；模型能够捕捉到训练文本中未出现的内容吗？如果不将常识知识引入模型，我认为在语义表示和管理任务中准确率的上限将无法突破。这种常识知识可以在哪里找到？在维基百科中吗？在链接开放数据云（Linked\
  \ Open Data Cloud）中？在儿童教科书中？如何将这些知识整合到模型中？我认为这是近期需要解决的关键点。\n\n## 参考文献\n\n1. R. Mitkov,\
