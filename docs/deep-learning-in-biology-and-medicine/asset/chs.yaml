  \n自然语言处理（NLP）是一门源自商业领域的古老学科……（此处省略重复文本内容）\n\n\n\n\n\n- **语义层：** 对于每个解析的句子，语义解析器应该获取其含义的表示。全语义解析仅在非常窄的领域是可行的；在其他情况下，可以执行更简单的过程，例如词性标记或语义角色标注。\n\
  - **语用层：** 语用学意味着语言的意图使用。此处的任务任务是话语分析。\n\n## 1.2 NLP 应用\n\nNLP 应用可以分为两个大领域（不互斥）：\n\
  \n- **人机交互，**包括不同的对话模式、问答（QA）、语言推理（LI）等。\n- **大规模文本信息处理，**包括信息检索、提取、过滤、路由等。以及自动摘要（AS）、机器翻译（MT）、机器阅读理解（MC）、意见挖掘、情感分析（SA）、术语提取、文本分类或概念链接等。\n\
  \n## 1.3 NLP 方法\n\nNLP 可以遵循许多不同的方法。在第一层级，它们可以被分为两类：理性主义方法和经验主义方法：\n\n- 诺姆·乔姆斯基（Noam\
  \ Chomsky）提出的理性主义方法认为，NLP 任务中使用的很大一部分知识是可以预先固定的，并且必须规定、编码并显式地纳入任何 NLP 处理过程中。通常被称为符号系统或基于知识的系统遵循这种方法。\n\
  - 泽利格·哈里斯（Zellig Harris）提出的经验主义方法则认为，语言知识可以从经验中推断，并通过关联或泛化等少数简单机制通过文本语料库收集。这对应于费特（Firth）的分布假设：“我们可以通过一个词所的环境来了解这个词”。\n\
  \n第 1.1 节中介绍的所有任务都可能面对这两种方法中的一种（或两种）的不同处理器。虽然形态和句法通常由符号方法处理，而经验方法通常应用于语义学。我们关注后者（并在第\
  \ 2 节中介绍），因为本章致力于深度学习（DL）。不过，为了完整起见，我们提出了一些通用参考文献。[Refs. \\[1\\]](#chapter4.xhtml#ref4_1)\
  \ 和 [\\[2\\]](#chapter4.xhtml#ref4_2) 中的研究涵盖了这两种方法，而 [Refs. \\[3\\]](#chapter4.xhtml#ref4_3)\
  \ 和 [\\[4\\]](#chapter4.xhtml#ref4_4) 聚焦于 DL，[Ref. \\[5\\]](#chapter4.xhtml#ref4_5)\
  \ 聚焦于统计方法（包括传统的机器学习系统），而 Ref. 6 则涉及使用 Python 的实现细节。\n\n## 2 NLP 中的经验方法\n\n在句法层面使用随机上下文无关文法外，经验方法关注语义。在分布语义的范式中，基础是向量空间模型（VSM），其中语言单位表示为高维向量空间中的向量。在符号模型中，这些向量空间具有巨大的维度，尽管将向量空间压缩为更小的亚符号表示（数百数量）的趋势正在增长。在使用\
  \ `NN` 时，这些稠密表示被称为嵌入（embeddings），如第 5.1 节所示。在图 1 中，展示了 VSM 模型中词的一些可能表示。在左侧，我们在维度为\
  \ `n` 的向量空间中找到稀疏表示，其中 `n` 是词表的大小。在 `one-hot` 表示中，向量的只有一个分量取值为 1，因为这里没有上下文。接几列对应于上下文中词的不同权重方案。右侧显示了一个稠密表示（嵌入）；其维度\
  \ `m` 比 `n` 小几个数量级。\n\n![images](img/fig4_1.jpg)\n\n图 1. 词的向量表示示例。\n\n一旦词或其他语言单位被稀疏或稠密向量表示，我们就可以在这些向量上使用线性代数提供的所有工具，例如加法、距离、投影、降维和换底。\n\
  \n词不仅可以在 VSM 中表示，我们还可以将词单元表示为字符，并将句子等复杂单元。文档和语言单位集合可以表示为矩阵。例如，给定一组 `D` 个文档 `d[1]`、`d[2]`、…\
  \ , `d[D]`，其中出现了 `N` 个不同的词：`w[1]`、`w[2]`、… , `w[N]`，我们可以构建维度为 `N × D` 的词/文档矩阵，其中行是词，列是文档，因此第\
  \ `p` 行和第 `d` 列的元素将包含 `p` 在 `d` 中出现的次数。词/文档矩阵用于检测哪些文档与用户的查询（表示为一组关键词）相关。查询词表示在矩阵的行中，每个文档表示在其对应的列中。包含更多查询词的文档被作为结果。这些矩阵还可以用于计算两个文档之间的相似性。\n\
  \n### 2.1 资源\n\n开发 NLP 深度学习技术的关键在于存在用于学习深度模型的海量数据集。例如考虑 QA 的情况。过去，最丰富的数据集“CuratedTREC”(7)\
  \ 只包含 2,180 个（问题，答案）对；显然，学习即使是浅层 `NN` 也不够的。“Quora Q Pairs”(c) 包含 404,302 对，允许学习准确的\
  \ `NN` 模型。\n\n同样，对于 LI 任务，我们可以将旧的 5,800 个 Microsoft Research Paraphrase Corpus 对(d)\
  \ 与 570,000 个 SNLI 对(e) 进行比较。这些任务和其他任务的其他数据集在 Ref. 8 中描述。除了这些 NLP 资源（以及许多其他），我们必须提到通用资源，例如\
  \ Wikipedia、DBPedia、WordNet、MultiWN、BabelNet、ConceptNet 等，它们经常被 NLP 处理器使用。\n\n##\
  \ 3 NLP 中的统计方法\n\n基本上，VSM 将语言单位表示为高维向量空间中的向量。在这种设定下必须面对三个基本问题：(1) 表示词的向量的组合以获得更复杂单位的向量表示；(2)\
  \ 向量之间的距离计算；以及 (3) 降维。我们将在下介绍它们。\n\n\n\n\n令 `x` 为一个复合单元，它由一个标记序列 `x[1]`、`x[2]`、…\
  \ , `x[n]` 组成。令 ![](img/xi.jpg) 为表示标记 `x[i]` 的向量。表示 `x` 的向量可以通过对 ![](img/in99_1.jpg)\
  \ 的各个分量应用组合函数 ![](img/o.jpg) 来计算。\n\n对于 ![](img/o.jpg) 使用了不同的公式。最流行的是对序列分量的简单求和，即\
  \ ![](img/in99_2.jpg)。该函数没有考虑分量的顺序，并假设所有分量同等重要。这些假设显然是错误的。\n\n例如，考虑名词性短语 `x` = “black\
  \ cat”（黑猫），因此 ![](img/in99_3.jpg) 向量 ![](img/in99_4.jpg) 应该更接近 ![](img/in99_5.jpg)\
  \ 而不是 ![](img/in99_6.jpg)，这种效果是无法通过简单的求和来获得的。\n\n另一种可能性是分量的线性组合，例如 ![](img/in99_7.jpg)，其中权重\
  \ `α^i` 根据分量的词性（POS）手动设置，或者通过最小化复合单元与其头词（head）之间的距离来学习。例如，在由形容词和名词组成的名词短语中，我们可以为形容词赋予权重\
  \ 0.1，为名词赋予权重 0.9，或者学习 `α^i` 以最小化表示名词性短语 `<ADJ, NOUN>` 的向量与表示头词（<NOUN>）的向量之间的距离。\n\
  \n为了定义距离（或相似度^([f)）度量，我们的空间 `χ` 应该是一个度量空间。因此必须定义一个距离 `d`。这样的 `d` 是一个满足以下属性的函数 ![](img/in99_8.jpg)，其中\
  \ ![](img/in99_9.jpg) 和 ![](img/in99_10.jpg)：\n\n(1) ![](img/in99_11.jpg)\n(2) ![](img/in99_12.jpg)\
  \ 且且仅当 ![](img/in99_13.jpg)\n(3) ![](img/in99_14.jpg)\n(4) ![](img/in99_15.jpg)^(g)\n\
  \n两种常用的距离是 `L[1]` 范数（曼哈顿距离）![](img/x_arrow.jpg)；这等于将 ![](img/x_arrow.jpg) 投影到半径为\
  \ 1 的超球面，然后计算余弦距离（两个向量之间角的余弦）或测地距离。其他流行的度量还有 Dice 和 Jaccard。关于所有这些度量及许多其他度量的细节，请参阅\
  \ [Ref. \\[9\\]](#chapter4.xhtml#ref4_9)，Ref. 10 提供了 Python 实现库。^(h)\n\n![images](img/fig4_2.jpg)\n\
  \n图 2. 将向量空间映射到语义空间。\n\n所有这些度量的一个重要问题是，向量的所有分量都同等重要。对维度加权是解决这一问题的有效方法。马哈拉诺比提出了以下度量\
  \ ![](img/in100_1.jpg)，其中 `M` = Σ^(*−1) 是协方差矩阵。如果 `M` 是单位矩阵，则该方法是鲁棒的。如果 `M` 是对角矩阵，则该方法等于欧几里得距离。如果\
  \ `M` 是正定矩阵，则该方法是有效的。如果 `M` 是正交矩阵，则该方法是旋转不变的。如果 `M` 是对称矩阵，则该方法取决于 `M` 的特征。有时，我们使用基于路径的语义空间（见图\
  \ ![](img/fig2.jpg)）。基于路径的度量是基于两个元素之间的最短路径。基于路径的方法被应用于 WordNet。\n\n### 生物医学领域的 NLP\n\
  \n### 4.1 生物医学语言的特征\n\n根据 [Refs. \\[12\\]](#chapter4.xhtml#ref4_12) 和 \\[13\\]](#chapter4.xhtml#ref4_13)，生物医学领域具有某些特征，使得过程变得更加复杂（如下文标记为“–”），尽管也有一些积极的方面（标记为“+”）：\n\
  \n– 存在多种体：电子健康记录（EHR）、出院报告、放射报告、医学文章、药品说明、医学论坛等。\n– 术术，包括极其模糊的缩写。\n+ 领域特定的词汇、术语和本体资源，包括大型语料库。\n\
  + 相关工具。\n– 非专业用户与目标文档之间的差距可能比其他领域更大。例如，“克鲁茨菲尔特-雅各病”（称为亚急性海变病或 vCJD）在通俗层面被称为“疯牛病”。\n\
  \n### 4.2 生物医学领域的可用资源\n\n表 1 展示了医学领域的一些数据集（前三行）和本体。大多数本体可以通过 BioPortal 获取。^(l) 尽管大多数资源主要是针对英语的，但某些资源如\
  \ Snomed-CT、ICD-10 和 Orphanet 为其他语言提供了资源。\n\n#### 4.3 处理生物医学领域任务的方法\n\n生物医学领域的 NLP\
  \ 任务和应用与其他领域或无领域设置基本相同，包括一些特定任务：诊断支持、结果和风险预测、患者分型等。多种类型的 EHR 已用于这些任务，例如实验室测量、临床叙述和医学影像。\n\
  \n\n\n尽管存在一些局限性，在这里仍然可以使用相同的通用方法和工具。然而，有两点必须执行特定的流程。第一是预处理步骤，在第 4.4 节中详细介绍。后者在第\
  \ 5.1 节中详细介绍，是在遵循 `DL` 方法时使用生物医学模型（如嵌入）。如第 4.1 节所讨论的，生物医学语言具有使过程变得复杂的特征。需要特定处理器的任务是分词器（tokenizers）和\
  \ NERC（语义标记器）。例如，考虑问题 `z` = “如果我感染了 COVID-19 和肺炎，我可以回家吗？”。应用传统的 spacy 处理器来获取 `z`\
  \ 中出现的实体，我们得到如下：\n\n表 1. 医疗领域的一些相关资源。\n\n![images](img/tab4_1.jpg)\n\n```\nimport\
  \ spacy; import en core web lg\n\nnlp = en core web lg.load()\ndoc = nlp(z); doc.ents\
  \ → ()\n```\n\n我们得到了 0 个实体。如果我们改用针对科学领域限制的 scispacy，^(n)则识别出四个实体（只有两个是正确的）：\n\n\
  ```\nimport scispacy; import en core sci md\n\nnlp = spacy.load(\"en core sci md”)\n\
  doc = nlp(z); doc.ents → (home, I, COVID-19, pneumonia)\n```\n\n如果我们使用 NCBO 访问器\
  \ Bioportal，使用‘SNOMEDCT’和‘ICD10PCS’作为源本体，我们得到三个实体（只有 2 个是正确的）：\n\n```\nontologies\
  \ = [`SNOMEDCT`, `ICD10PCS`]; NCBO = BioPortal()\n`N CBO.semantic tagging text`(`z`)\
  \ → ‘home’, ‘pneumonia’, ‘covid-19’\n```\n\n从这些示例可以明显看出，领域特定的处理器提高了这些基础任务的结果。\n\n\
  ### ## 4.4. 生物医学领域 NN 模型的语言预处理\n\n尽管某些 NN 模型使用原始文本作为输入，但有时仍需要语言预处理。幸运的是，目前有许多公开的工具包提供了大多数所需的处理器，至少对于英语如此（尽管多语言支持正在增长）。在这些遵循符号的方法中，最流行的有：自然语言工具包\
  \ (NLTK)，^(o,71)Stanford CoreNLP，^(p,17)OpenNLP，^(q)LingPipe，^(r)以及 Freeling。^(s,72)。\n\
  \n在这些遵循经验的方法中，我们可以找到：AllenNLP，^(t,18)SpaCy，^(u,19)Pythia，^(v)PyTorch-NLP，^(w)或 Jack\
  \ the Reader。^(x) `Transformers` 提供了对其模型的便捷访问，但基于其构建了更舒适、更快的框架，例如 FARM^(y)（表示模型适应框架）。\n\
  \n这些资源大部分是领域通用的，尽管其中一些已经开发了（生物）医学特定的工具。\n\nLingMed^(z) 是 LingPipe 的生物医学版本，基本设计用于访问生物医学资源，如\
  \ MEDLINE、Entrez-Gene 和 Gene Ontology。Scispacy^(aa)是一个用于生物医学数据的完整 `spaCy` 流水线。MedaCy^(bb)是一个构建在\
  \ `spaCy` 之上的文本处理和学习框架，用于医疗 NLP 模型。Pythia Predict^(cc)专注于医疗设备交互的预测。FreeLing-Med^(dd)允许人们分析用西班牙语编写的临床文档。\n\
  \n除了这些衍生自现有通用系统的外，还存在专门为（生物）医学领域构建的处理器。其中一些是 MedLEE、BioMedLEE、cTAKES，^(ee)HITEX，^(ff)以及\
  \ Metamap。^(gg)BioPortal 提供了一个 rest API^(hh)，具有访问其本体的功能，例如 NCBO 注释器，允许对文本进行一个或多个本体中的术语标注。\n\
  \n### ## 5. 用于 NLP 的神经模型：通用问题\n\n在 AI 的历史上，神经网络断断续地出现又消失。伴随着夸大期望的狂热时期之后是欺骗、缺乏资金以及对这一研究路线的放弃。1956\
  \ 年，Rosenblatt 提出了感知机（Perceptron），这是第一个神经模型。这一提议引起了巨大的期待。感知机成功解决了一些理论或玩具问题。1995\
  \ 年，LeCun 应用反向传播算法进行学习。然而，在 2005 年，深度学习（Deep Learning）被提出。\n\nNN 应用于 NLP 的起点可能是\
  \ SENNA，^(jj)这是一个由 Colbert 和 Weston 创建的多任务系统。^(20)SENNA 对文本进行词性标记、块、实体、语义角色、语义相似词和语言模型标注。整个网络在这些任务上进行联合训练。语言模型从未标记的文本中学习，而其他任务则是有监督学习。\n\
  \n大多数大多数 NN 架构已应用于 NLP。特别重要的是卷积神经网络 (CNN)、循环神经网络 (RNN)、递归神经网络 (RecNN)、自动编码器、基于注意力的\
  \ NN 以及编码器-解码器 NN 等。关于这些模型用于 NLP 的优秀综述已提供^(3,)(21)（参见第 2 章）。\n\nCNN 可能是从图像、视频和文本数据中提取特征的最佳方法。卷积层的基本思想是使用非线性卷积操作（滤波器）对层进行采样以获取特征图。NLP\
  \ 使用一维卷积 (Conv-1)，其中滤波器被实现为向量。虽然滤波器的值是学习的，但有时良好的初始化可以改进学习过程。[参考文献 [22]](#chapter4.xhtml#ref4_22)\
  \ 构建了学习滤波器的存储（深度 CNN 权重滤波器库），可以在不需要学习的情况下使用。\n\nCNN 已成功应用于许多 NLP 任务，例如之前提到的 SENNA\
  \ 系统。第一个提议归于 Yoon Kim，^(23)他将 CNN 应用于句子分类。其他有趣的参考文献请参阅[文献 [21]](#chapter4.xhtml#ref4_21)]。\n\
  \n\n\n\n## RNN 与序列建模\n\nRNN（循环神经网络）在神经网络模型中引入了时间概念，因此适用于处理序列信息。这些模型在序列的每个实例上执行相同的任务，使得输出依赖于之前的计算。RNN\
  \ 在空间和时间上都是深层的，因为信息可以沿垂直方向（通过不同的层）或水平方向（通过不同的时间步）流动。这种模型自然适用于许多显示出语言序列结构的 NLP 任务，正如\
  \ Alex Graves 在 [Ref. [24]](#chapter4.xhtml#ref4_24) 中所示，单元可以是字符、单词或句子。简单的 RNN 可以进行堆叠以提高其表示能力。\n\
  \n与可以并行计算的 CNN 不同，RNN 必须按顺序计算。但与 CNN 的局部特征不同，RNN 捕获了大量之前单元的信息。与 CNN 的情况一样，这种模型已成功应用于许多词级和句级的\
  \ NLP 任务。[参考文献 [21]](#chapter4.xhtml#ref4_21) 和 [[24]](#chapter4.xhtml#ref4_24)\
  \ 为其中一些应用提供了有趣的参考。\n\nRNN 的隐藏状态积累了来自其他时间步的信息，因此可以用于文本之间的语义匹配。这些简单 RNN 网络的一个问题（梯度消失问题）是，之前信息的作用随着距离的增加而逐渐消失。为了应对这一重要问题，引入了\
  \ RNN 的变体，例如长短期记忆（LSTM）或门控循环单元（GRU）。\n\n## 递归结构与树模型\n\nRNN 和 CNN 是建模序列的自然方式。然而，语言表现出自然的递归结构，可以通过解析树来表示。RecNN\
  \ 使用这些树结构作为输入。事实上，RecNN 可以看作 RNN 从序列到二叉树的泛化。RecNN 的一个重要问题是文本的预处理步骤（包括解析和二值化）是强制性的。解析成本很高且并非无错误。Richard\
  \ Socher^(25–27) 提出了多种 RecNN 模型并将其应用于多个 NLP 任务。\n\n# 自动编码器与编码器-解码器框架\n\n自动编码器是一类神经网络，本身是编码器-解码器模型的一个子类，它们学习将输入转换为压缩表示，该表示用于生成输入的重构，从而最小化重构损失（即输入与其重构之间的差异）。\n\
  \n编码器-解码器框架是自动编码器在输入和输出空间不同时的泛化，例如序列到序列模型，应用于机器翻译（MT，输入和输出是不同语言的文本）、语音识别（AS，输出是输入的简化版本）或人类对话等任务。例如，在\
  \ [Ref. [28]](#chapter4.xhtml#ref4_28) 中，在 MT 任务中使用 `LSTM` 将输入序列编码为固定大小的向量，该向量被用作解码器\
  \ `LSTM` 的初始状态。\n\n编码器-解码器框架存在的一个问题是，编码器有时被迫编码可能与当前任务无关的信息。在 AS 和 MT 等任务中，输入和输出文本之间存在特定的对齐。这就是注意力机制的基础。该机制允许解码器回溯输入序列。在解码过程中，除了最后一个隐藏状态和生成的标记外，解码器还依赖于最后一个隐藏状态。\n\
  \n## 注意力机制\n\n基于机制的模型已应用于许多任务。一些示例包括：[Ref. [29]](#chapter4.xhtml#ref4_29)，它引入了双向注意力流（`BIDAF`）网络，一种用于上下文的多阶段注意力；[Ref.\
  \ [8]](#chapter4.xhtml#ref8)；以及 [Ref. [30]](#chapter4.xhtml#ref4_30)，它在注意力之上使用了查询和上下文。\n\
  \n从这些基于注意力模型演化而来，[Ref. [31]](#chapter4.xhtml#ref31) 最近提出了 transformers，这是深度学习的基础。我们将在第\
  \ 6 节](#chapter4.xhtml#sec6)中描述 transformers。\n\n### 5.1. 嵌入 (Embeddings)\n\n如第\
  \ 2 节](#chapter4.xhtml#sec2)所示，单词和其他语言单元可以表示为向量。稠密表示通过降维获得。“嵌入”通常指这些稠密表示。嵌入简单来说是将语言单元（单词、短语、句子、实体、关系、带或不带参数的谓词、三元组、图像、图节点等）映射到低维空间的一个元素中。在\
  \ NLP 范围内，初始嵌入模型首先应用于单词。词汇嵌入可以作为有用的表示，但为复杂单元学习嵌入可能是具有挑战性的。虽然为每个单词学习了独立的嵌入，但对每个句子都这样做是不可行的。\n\
  \n嵌入可以直接用于某些涉及嵌入空间操作（距离、相似性、投影等）的任务，尽管在大多数情况下嵌入是作为输入层使用的。该系统将单词标记 `w` 映射为实数向量 `n`，其中\
  \ `n` 是输入空间的维度，`d` 是嵌入空间的维度。Tomas Mikolov 提出了两种模型架构 `CBOW` 和 `Skip-Gram`，用于从大型数据集中计算嵌入。`CBOW`\
  \ 计算给定上下文的目标单词的条件概率，而 `skip-gram` 则相反。这两种模型共同成了 `Word2Vec` 系统，在最近上下文化词表示（`CWR`）出现之前，它是最常用的词嵌入模型。使用\
  \ `Word2Vec` 模型或从特定语料库学习新模型的流行软件是 `Gensim`。`Word2Vec` 的替代方案是也被广泛使用的 `Glove`。在生物医学领域，Sampo\
  \ Pyysalo^(34) 公了从 Medline 数据集学习的嵌入。\n\n所有这些嵌入都是为英语构建的。其他语言（通常资源较少）中构建嵌入的一项显著贡献是使用\
  \ `FastText`（一个学习词表示和句子分类的库）的多语言无监督和监督嵌入（`MUSE`)(35）。`MUSE` 产生了 100 多种语言的嵌入，`LASER`\
  \ 产生了 93 种语言的嵌入。北欧语言处理实验室维护了一个多种语言的嵌入库以及用于学习和使用的算法。所有这些嵌入模型都属于静态嵌入类。\n\n\n\n\n\n\
  传统的静态词嵌入的一个严重局限性是词汇的多义性（polisemy）。在这些模型中，一个词有一个唯一的向量表示，无论其含义如何，即其在分布式语义设置下的上下文。[参考文献\
  \ [37]](#chapter4.xhtml#ref4_37) 创建了 `Sense2Vec`，将该问题设定为词义消歧（WSD）。此外，这一局限性最近受到了\
  \ `CWR` 的应对。用 `CWR` 替换静态嵌入已在许多 NLP 任务中取得了显著改进。`CWR` 将将在第 6.2 节](#chapter4.xhtml#sec6_2)\
  \ 中描述。\n\n嵌入词只是神经网络（NN）获取语言单元密集向量表示的应用的第一步。对于子词单元（字符、词根、字符 n-gram），这些技术与上述解释的基本相同。对于复杂单元，技术模仿了第\
  \ 3 节 中描述的方法。构建这些嵌入的流行软件是上述的 `FastText`。\n\n## 6. 用于 NLP 的深度学习模型\n\nNLP 深度模型的发展一直比应用于图像识别的模型晚一步。虽然\
  \ `AlexNet`^(38) 在 2012 年的 ImageNet 大规模视觉识别挑战中成功（这归功于传统 `CNN` 模型的深度）被认为是图像识别深度学习的开端，但\
  \ 2018 年深度 `CWR` 的出现是 NLP 模型迁移学习的转折点。从 `CWR` 和 OpenAI 的 `Transformers` 模型^(31) 开始，包括\
  \ Allen AI2 的 `ELMo`、Google 的 `BERT`、`fast.ai` 的 `ULMFT`、OpenAI 的 `GPT`、`GPT-2`\
  \ 和 `GPT-3`、`CMU`、Google 的 `XLNet` 以及微软的 `MT-DNN` 在内的许多系统相继出现，并竞争 NLP 任务中。关于这一主题的良好介绍可以在参考文献\
  \ [39]](#chapter4.xhtml#ref4_39) 中找到。\n\n`CWR` 已用于无监督方法，应用双层 `biLSTM` (`ELMo`)、三层\
  \ `AWD-LSTM`^(40) (`ULMFIT`) 以及最近的 `Transformers` (`BERT`, `GPT`, `GPT-2` 和 `GPT-3`)。这些系统是深度神经网络语言模型，通过微调来创建适用于各种下游\
  \ NLP 任务的模型。`ELMo` 和 `ULMFIT` 使用由词序列组成的句子作为输入，而 `BERT` 和 `GPT` 版本处理子词单元。虽然 `ELMo`\
  \ 和 `ULMFIT` 是较浅的 `NN`（两层三层），但 `BERT` 和 `GPT` 最简单的配置也有 12 层。`ELMo` 使用双层 `biLSTM`\
  \ 进行训练。相比之下，`GPT-2` 和 `BERT` 是基于 transformer 的语言模型：前者是单向的，后者是双向的（使用 `Masked LM`）。\n\
  \n12 层 `BERT` 和 12  层 `GPT-2` 的每个 transformer 层通过关注输入句子不同部分来为每个标记（token）创建上下文相关的表示。[参考文献\
  \ [41]](#chapter4.xhtml#ref4_41) 分析了这些模型产生的 `CWRs` 的上下文程度，即：每个词是否具有无限多个特定上下文的表示？或者词本质上被分配了有限数量的义项之一？结论是，上下文化模型并不是简单地为每个词的每个义项分配一个向量（例如\
  \ `Sense2Vec`），而是分配给每个上下文。上下文化模型的上层产生更多特定上下文的表示，就像 `LSTMs` 的上层产生更多特定任务表示一样。\n\n\
  [参考文献 [42]](#chapter4.xhtml#ref4_42) 中的一项研究分析了影响模型性能的因素。这些因素包括模型参数的数量、数据集的大小以及用于训练的计算能力。结论是，性能很大程度上取决于规模，而对模型形状的影响较小。性能与三个尺度因素中的每一个都呈幂律关系。简而言之，大模型可能比大数据更重要。\n\
  \n## 6.1. Transformers\n\n我们在本节介绍了 `Transformers` 模型以及 `Transformers` 库^(tt)，该库在\
  \ `PyTorch` 和 `TensorFlow` 中实现了该模型。`Transformers` 库提供了数千个预训练模型来执行 NLP 任务。`Transformers`\
  \ 是第一个完全依赖自注意力机制来计算其输入输出表示的转换模型，而不使用序列对齐的 `RNNs` 或卷积。该模型遵循这一整体架构，编码器和解码器均使用堆叠的自注意力和逐点全连接层。\n\
  \n编码器由栈的 `N` = 6 个相同层组成。每层有两个子层。第一个是多头自注意力机制，第二个是简单的、逐位置的全连接 `FFN`。模型中的所有子层（同以及嵌入层）都产生维度为\
  \ 512 的输出。解码器也由栈的 `N` = 6 个相同层组成。除了每个编码器层中的两个子层外，它还插入了第三个子层，用于对编码器栈的输出执行多头注意力。`Transformers`\
  \ 在“编码器-解码器注意力”层、编码器层和解码器层中使用多头注意力。\n\n一旦 `Transformer` 预训练完成，我们就可以开始将其用于下游任务。处理不同类型任务的输入变换在[参考文献\
  \ [43]](#chapter4.xhtml#ref4_43) 中概述。基本上，所做的是构建包含任务所需的虚拟句子并将其作为 transformer 的输入。transformer\
  \ 的输出通常发送到最终网络以完成任务。在分类情况下，该网络被简化为简单的层，例如 softmax 分类器。对于分类任务，变换是直接的：\n\n```\nimages/in112_1.jpg\n\
  ```\n\n对于 QA 或 LI（语言推理），由于涉及两个句子，变换稍微复杂：\n\n```\nimages/in112_2.jpg\n```\n\n在构建语言模型的情况下，不需要整个\
  \ Transformer；任务可以通过 Transformer 的解码器完成。\n\n## 6.2. 模型\n\n我们在本节介绍了最广泛使用的 `CWR` 模型。\n\
  \n通用语言模型微调 (`ULMFIT`)^(44) 引入了一种语言模型以及一种针对各种任务进行有效微调的方法，取得了 SOTA 结果。ULMFiT 包含了许多适用于其他方法的微调技术。训练过程分为三个步骤：LM\
  \ 预训练、LM 微调和特定任务微调。LM 预训练使用了来自维基百科的 1.3 亿单词。由于特定任务/领域的文本相对于维基百科语料库分布不同，因此 LM 微调是强制性的。这通过两个步骤完成：一个取决于领域，另一个取决于任务。LM\
  \ 微调涉及使用差异化微调和斜坡三角形学习率（一种先线性增加学习率然后线性衰减的学习率调度）。特定任务微调使用逐渐解冻机制来防止过拟合。\n\n来自语言模型的嵌入\
  \ (`ELMo`)^(73) 通过双层 `biLSTM` 内部状态的任务特定组合（线性函数）来创建词嵌入。训练数据集是 10 亿级 WordBenchmark.^(uu)\n\
  \n\n\n\n生成式预训练 Transformer (`GPT`)(43) 采用序列到序列的编码器-解码器架构，并使用上述的 `Transformers` 框架实现。`GPT`\
  \ 仅使用了 `Transformer NN` 中的 12 层解码器，具有 117M 参数。请注意，虽然 `BERT` 仅使用 `Transformers` 的编码器部分，而\
  \ `GPT` 使用了解码器部分。每层包含 12 个独立的自注意力头，总共 144 种不同的注意力模式，每种模式都可能对应于模型捕捉到的语言属性。与其他 CWR\
  \ 模型一样，`GPT` 遵循半监督设置，采用两阶段训练程序。首先，在无监督模式下，从海量数据集学习一个初始的通用语言模型（LM）。目标是学习一种通用的表示，这种表示可以通过少量微适应迁移到广泛的特定任务。然后，使用相应的监督目标（一组小规模的人工标注数据）对通用\
  \ LM 在目标领域/任务上进行微调。预训练使用 Toronto 书语料库作为输入数据集，(vv) 包含 11,308 本书，总计约 1B 个单词。\n\n生成式预训练\
  \ Transformer-2 (`GPT-2`)(45) 是其前代的更大版本，在模型规模、数据集大小和多样性以及训练长度上进行了轻量扩展，使用了 1.5B 参数。`GPT-2`\
  \ 在包含 800 万个网页、名为“WebText”的数据集上进行了训练。[Ref. [45]](#chapter4.xhtml#ref4_45) 中的工作侧重于微调，即通过针对所需任务的数千个监督标签进行训练，来更新预训练通用模型的权重。微调提升了在许多基准测试中的性能，但代价是为每个任务标注巨大的数据集。`GPT-2`\
  \ 仅部分开源。训练数据集是私有的且未公的，但预训练模型可以免费获取。\n\n生成式预训练 Transformer-3 (`GPT-3`)(46) 相比 `GPT-2`\
  \ 进行了大幅扩展（参数从 1.5B 增加到 175B），并保持了相似的架构。为特定任务训练 `GPT-3` 模型涉及两个步骤：预训练和微调。然而，在所谓的“任务无关（task-agnostic）”设置中，可以只使用第一步。这种设置非常有用，因为由于大型数据集的监督，针对给定任务进行微调的成本很高。在任务无关设置中，设计了三种学习场景：少样本\
  \ (FS)、单样本 (1S) 和零样本 (0S)。在 `FS` 中，模型在推理时会获得几个（10 到 100 个）`K` 个任务演示（上下文和完成部分的示例）。模型具有极轻微的监督。对于\
  \ `1S`，`K` = 1；对于 `0S`，`K` = 0，且仅提供任务的自然语言描述，而不提供任何示例。\n\n广义而言，在 NLP 任务上，`GPT-3`\
  \ 在 `0S` 和 `1S` 设置下取得了鼓舞的结果，在 `FS` 设置下有时能与 SOTA（最先进水平）竞争。例如，`GPT-3` 在 `0S` 设置下的\
  \ CoQA 上达到 81.5 F1，在 `1S` 设置下达到 84.0 F1，在 `FS` 设置下达到 85.0 F1，并达到 SOTA 的 90.7%。同样，`GPT-3`\
  \ 在 `0S` 设置下的 TriviaQA 上达到 64.3% 的准确率，在 `1S` 设置下达到 68.0%，在 `FS` 设置下达到 71.2%，达到 SOTA\
