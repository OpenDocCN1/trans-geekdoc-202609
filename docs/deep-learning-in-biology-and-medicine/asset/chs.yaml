  # 利物浦约翰·穆尔斯大学计算机科学与数学学院，Byrom St., Liverpool L3 3AF, UK\n瓦伦西亚大学电子工程系 (ETSE-UV),\
  \ \nAvgda. Universitat s/n, 46100 Burjassot, Valencia, Spain\navellido@cs.upc.edu\n\
  p.j.lisboa@ljmu.ac.uk\njose.d.martin@uv.es\n\n从电子健康记录的广泛实施和使用到组科学的基础研究，从健康可穿戴设备的普及到医疗点流程的数字化，医学和医疗保健领域正将数据推向其实践的前沿。数据的丰富反过来要求能够将此类原始信息转化为领域内可用新颖知识的方法。这些数据分析方法可以来自统计学，也可以来自机器学习及其目前最流行的形式：深度学习。尽管后者被证明是有效的，但其实际应用受到了一种在医学领域尤为敏感的限制制约：其缺乏解释性，导致可解释性有限。在本章中，我们旨在描绘该问题的许多方面，并回顾旨在克服这一问题的研究，特别关注三个问题，即：医学领域数据驱动方法的可靠性、深度学习作为机器学习中最具吸引力的方法之一的相关性，以及深度学习被应用于临床问题时对解释性和可说明性的需求。\n\
  \n## 1. 三个问题：从数据到深度学习\n\n数据的可用性是医疗交付的核心，对于医学和制药研究至关重要。数据的无处不在已经扩展了医疗保健的概念，使其从对疾病的回顾性治疗转变为通过疾病进展预测模型进行主动干预，这种模型具有减少可避免的住院的潜力，例如，通过慢性疾病的远程医疗计划，以及用于生活方式干预和自我管理的应用程序，最终可以降低疾病的发病率和严重程度。毫无疑问，丰富的数据集为医疗交付和监测提供了最具体的证据基础。\n\
  \n可以说更好地利用数据是可持续医疗保健的基石，原因有二：它是治疗优化的关键（从精准医学到随访的个性化），是最大化临床资源效用的基本要素；此外对于高效的院外护理也至关重要，随着移动式传感器（包括可穿戴设备和生物反馈）作用日益增强，其应用涵盖了从肥胖到心理健康以及老年独立生活的全方位护理。\n\
  \n数据在医学和医疗保健中日益增长的角色引发了三个本章关注的问题：我们是否应该关注数据驱动的医疗交付？深度学习（`DL`）在这种背景下是否有特殊价值？如果是的话，将重点放在解释和解读有多重要？\n\
  \n### (1) 我们在多大程度上应该关注将数据置于医学和医疗研究核心的观点？\n\n数据的应用在不同临床领域、院内和院外护理、从生活方式管理到公共卫生监测之间差异巨大。这引发了广泛的问题，其中某些与特定的数据用途相关，例如关于伦理和公众接受。在本节中，我们关注与机器学习技术使用相关的方法问题。\n\
  \n让我们通过一个具体的示例来回答第一个问题：重症监护领域。目前的重症监护患者通过一系列先进技术进行密集监测。重症监护室（`ICU`）的高危患者在技术上依赖于维持生命的设备，如输液泵、机械呼吸机或导管。床边采集的数据受患者状态可能快速变化的影响，并可能丰富电子健康记录（`EHR`），包括监测设备数据（液体摄入和患者排出、实验室抽血分析、医学影像、人口统计学数据等）。这些测量值大部分以电子方式存储，生成了我们可以称之为患者在\
  \ ICU 入留期间的“数字签名”。\n\n重症监护的案例非常具体，涉及临床环境中的医疗点，且具有非常明确的数据管理场景。然而，医学和医疗保健中的数据占据了更广泛的光谱，从普通人群到这一临床医疗点。在光谱的人口极端，我们发现了流行病学，该领域因\
  \ COVID-19 大流行引起了公众关注，其中地理定位的可溯数据变得极其重要。利用机器学习（`ML`）利用地理定位数据通过 Google 实现其 `Google\
  \ Flu` （随后受到医学界的严重质疑）曾引发早期头条新闻。请注意，此类数据的使用与日益流行的健康可穿戴设备的使用有关，这推动了移动健康（`m-Health`）领域的产生，这是一个便于分析的数据宝库。\n\
  \n在普通人群和我们在重症监护领域示例的医疗点之间，我们可以将公共卫生管理部门以及专业组织视为一种中介“数据经纪人”。医疗机构和医学协会从国际到地方，必须在健康数据政策的实施和标准的制定方面发挥作用。一个相关的例子是\
  \ `EHR` 的设计、标准化和日益广泛的使用。通过 `EHR`，医疗从业人员被允许网络化访问患者数据，这些数据通常是多模态的，包含了病史、住院、治疗处方、就诊等的图像、信号和文本。除了个人使用外，`EHR`\
  \ 非常适合创建大型异质性数据库，这使其成为自然语言处理 `ML` 分析的天然目标，例如。\n\n在医学中使用 `ML` 的一个共同线索是对观察性数据的依赖，这与临床干预设计的金标准（即随机对照试验）不同。其结果有三个方面：\n\
  \n• 首先是数据质量。常规获取的数据通常侧重于审计信息以证明治疗选择，而不是提供所有患者一致的完整记录——实现这一点通常需要参与前瞻性研究。结果是，缺失数据在某些变量中普遍存在，且缺失本身可能包含信息，有时与预后不良相关。病情不严重的患者有完整的记录，显示所有变量都在或接近接受范围内，但病情危重患者的记录主要包含疾病严重程度的关键指标，这些指标足以决定治疗选择。这需要仔细处理非完全随机缺失的。。`DL`\
  \ 模型可以使用大型数据向量，变量选择较少，且对稀疏建模的关注也较少。结果是缺失值可能会更加普遍。\n\n\n\n\n\n## 观测数据的后果\n\n- 观测数据的第二个自然结果是缺乏平衡性。正如前面的示例所示，临床医生通常需要针对发生率较低的事件寻求帮助，例如败血症或\
  \ ICU 中的病情突然恶化。如果判别阈值固定在 `0.5`，不平衡的数据可能会给 `DL` 分类器带来困难。这与概率模型形成对比，医学统计中的例子是 `logistic\
  \ regression`，这类模型通常具有良好的校准性，并且由于它们预测的是类别成员的概率，因此可以在整个人群中该类别的流行率设置阈值。因此，如果根据给定的概率预测败血症，干预的切点可以设置为败血症的总体流行率，从而避免了重新平衡数据的需求。\n\
  \n- 第三，存在可能由混杂因素引起的偏差，即影响数据分布并影响所测输入与结果变量之间相关性的变量。这就是为什么使用队列和横断面数据的数据驱动模型反映的是相关性而非因果关系，而因果关系需要来自主动干预并随时间随访的数据。尽管如此，医学界对基于随机对照试验的循证实践的内在局限性存在担忧，因为此类研究中招募的患者需要符合一系列带有许多排除标准的标准。真实患者往往带有合并症和其他在典型随机试验中被排除的状况。因此，迫切需要基于实践的证据，换句话说，对观测数据进行建模，这引发了上述讨论的问题。\n\
  \n这三条线——缺失值处理、数据不平衡和内在偏差——都适用于医学和医疗保健数据驱动应用中典型数据集。这对于 `DL` 模型的实现具有特殊影响，特别是在可解释性方面。我们在第\
  \ 2 章和第 3 章中考虑了这两点。\n\n### (2) 在这种以数据为中心的医学背景下，既然 DL 只是过度饱和的 ML 领域中的一种方法，为什么我们应该特别关注\
  \ DL？\n\n让我们思考一下医学执业者如何根据现有证据做出决策（例如诊断、预后或治疗方案）。关于病例的特定信息会根据个人的经验进行处理，这些经验来自于大学期间的培训和实践，以及住院医期间或职业生涯中的训练。这种知识受限于人类知识的局限性，并辅之针对特定问题的领域积累经验而产生的医学方案和指南，这些指南旨在协助和指导医学决策。但让我们再次考虑之前段落中提到的重症监护场景或对\
  \ `EHRs` 的分析。从数千名患者那里随时间收集的大型数据库远远超出了任何个人专家的数据处理能力范围。相反，这是 `ML` 以及类似的（半）自动化方法的领域，这些方法可以用于提取可用的医学知识并辅助医学决策。^(5)\n\
  \n在之前的段落中，`EHRs` 被提到为 `ML` 最明显的医学数据目标之一。目前对该研究领域的高度关注，恰恰是因为这些数据符合成功 `DL` 应用的大多数要求：大型数据集、异构非结构化数据以及复杂的多模态数据组合。^(6)\
  \ 来自快速发展的 `DL` 家族的方法因其在解决传统难题医学问题上的成功而占据了头条新闻，^(7)但并非没有引发争议。^(8)\n\n### 应用与挑战\n\n\
  事实是，尽管 `ML` 几十年来一直在医学领域展示了潜力，但 `DL` 因其在医学图像分析（10）和 `omics` 科学中的适用性已走向中心舞台。11)) 遗憾的是，这种报道的成功被最终促成本章的因素所掩盖。\n\
  \n总之，`DL` 在结构化数据建模方面具有强大潜力，例如包含多参数数据的放射学图像、生理时间序列（如 `ECGs`）以及自然语言处理 (`NLP`）。特别是对\
  \ `MRI` 的应用正在以快速进展。^([12)\n\n除了深度神经网络（`CNN`）和 `LSTM`，^(13)，将预测模型与强化学习 (`RL`) 耦合以优化治疗也具有巨大的潜力，这已经在护理和生活质量方面展示了改进。^(14)\
  \ 然而，也有证据表明在表格数据上过度使用 `DL`，即使用结合了连续和离散指标的平坦数据，通常用于通过诊断和预后结果进行患者分层。回顾^(15) 表明，在证明无偏的比较评估中，`DL`\
  \ 对表格数据的效果并不优于 `logistic regression`。因此，`DL` 在涉及固有结构数据格式的专家应用中具有卓越性能的真实潜力。\n\n###\
  \ (3) 在将 DL 应用医学和医疗问题时，考虑可解释性和说明性问题有多重要？\n\n许多数据科学家好奇，为什么如果一般的 `ML` 尤其是 `DL` 在过去十年中已被证明在性能上表现卓越（至少在纸面上作为医学发现工具和决策支持系统），但这些技术在护理点的实际操作中应用却寥寥无几。除了该领域对可能具有颠覆性的技术的天然抵触外，这至少可以部分源于存在一些不显而易见的采纳障碍，^(16)，包括引入半自动化分析过程导致医护人员技能退化的风险、`ML`\
  \ 方法数据格式要求引入的分析偏差、对许多医学观察和过程中固有的不确定性的处理不当，最后，也是本章的主题，即无法以人类可理解的方式解释的分析数据模型，因此无法向利益方进行适当的解释。\n\
  \n对可解释模型的推动是基于对 AI 在高风险决策中应用进行负责任治理的需求。^(17) 重要组成部分包括：首先是决策支持中的公平性和偏差，特别是模型可能会反映数据中固有的偏差，例如，在[文献\
  \ [18]](#chapter8.xhtml#ref8_18)中展示了一个清晰的数据伪迹，该模型显示的哮喘作为肺炎风险因素的结论与临床理解相反。其次，是欧洲《通用数据保护条例》((`GDPR`)\
  \ 中所谓的“解释权”的法律要求，使得基于自动化决策支持行动的主体有权要求有关做出该决策的逻辑逻辑的信息。^(19)\n\n\n\n\n除了伦理和法律层面外，在技术上也有迫切要求，即根据正确的理由得出正确的预测（(20)）。特别是，考虑到观测数据可能存在伪影效应且有时存在偏差，建立一种能够发现并修复数据中问题的机制至关重要。实现这一点的简单方法是使用可解释模型，通过该模型明确每个输入对得出单个预测产生了什么影响。\n\
  \n最后一个问题将在第 22 节中进行详细阐述。随后将对为深度学习（DL）方法赋予可解释性的不同方法进行分类，并结合近期文献中的示例进行说明。\n\n## 2.\
  \ 医学背景下的可解释性与说明性\n\n最近对放射学领域人工智能的综述表明，为了获得专家的信任，需要具有可解释的模型（(12)）。这是医学领域终端用户接受的必要条件。\n\
  \n正如引言提到的，机器学习（ML）正在取得巨大进展的另一个医学领域是流行病学（(21)）。让我们以当前的 COVID-19 疫情为例，数据科学家正努力补充严格的医学研究进展。例如，仅考虑预后这一特定领域，最近的一项系统综述（(22)）识别出了\
  \ 50 个预测死亡风险或病情恶化的已预后模型。但从以数据为中心的观点来看，这场疫情涉及其他挑战，例如疫苗管理。即使安全有效的 COVID-19 疫苗经过测试并被快速批准使用，也可能无法立即提供足够接种整个人群的数量。因此，疫苗几乎肯定只能以有限供应提供，必须对不同的人群进行疫苗接种优先级的排序。\n\
  \n公共卫生部门可以采用数据驱动模型作为初始供应有限的疫苗分配过程的指导。最近提出了一种名为 `COVER` 的此类模型（(23)），它是使用一个大型患者数据库构建的。这也许是深度学习方法的完美场景。然而，作者们采用了\
  \ `LASSO-regularized logistic regression`。尽管如此，这种选择并不令人意外，至少有两个原因：(i) 因为医学数据分析领域对逻辑回归方法非常熟悉；(ii)\
  \ 因为逻辑回归模型在用于预测的协变量方面具有直观的可解释性。\n\n这个例子只是一个更广泛困境的说明：如果这个数据丰富的环境有利于 ML/DM 的发展，为什么尽管在经历了数十年的研发后这些方法已经成熟，但仍然只在表面上渗透了医学实践？\n\
  \n本文认为，其背后的主要原因与数据科学的成熟度和技术准备就的关系较小，而与采用和实施方面的挑战有关。除非解决这些挑战，否则机器学习特别是深度学习将无法在少数小众应用之外应用于常规医学实践。这些挑战之一，且可能也是主要的挑战，是许多机器学习技术内在缺乏可解释性，因此缺乏说明性（(24)）。机器学习的“黑箱综合”挑战在医学领域已经讨论了数十年（(25)），直到最近才进入主流讨论（(26)）。深度学习方法被视为黑箱的加剧版，而矛盾的是，正是它们所引发的兴趣导致了相关讨论的加强。\n\
  \n许多医学从业者应该熟悉这个问题：基于 ML/DL 的系统可能会产生结果，尽管其质量很高，但由于无法进行易于理解的描述而无法完全使用。在许多决策情境下，这可能成为采用上不可逾越的障碍，因为医学专家无法信任执行与诊断、预后或例如疫苗递送相关的决策，因为这些决策无法向患者或卫生部门解释。\n\
  \n这一障碍可以被视为与实际医疗服务交付或医学伦理的冲突，从更务实的角度来看，也是与法律的冲突。在欧洲，这与最近实施的《通用数据保护条例》（GDPR）直接相关，该条例规定人工智能系统做出的所有决策都具有“解释权”（(19)）。该指令第\
  \ `13` 条规定，指定的“数据控制者”有法律义务向请求的公民提供“有关涉及的逻辑的有意义信息，以及该指令第 `22` 条所述的针对数据主体的此类处理的意义和预期后果”。该指令的影响在医学界引起了回响。依赖数据的领域（如健康相关学术界和生物库）的参与者已参与了关于研究中数据重用的法律辩论，正如\
  \ 27 所示，这些参与者建立了一套维护他们在数据共享和生物库相关数据治理问题立场的“论据库”。正如 28 所示，至少部分担忧与数据去标识化和匿名化有关，以及广泛的数据所有权问题。尽管如此，上述“解释权”仍被打上了一个巨大的问号：如果医学决策必须根据法律要求进行解释，谁还敢使用黑箱方法作为此类决策的基础？\n\
  \n许多研究致力于为 ML/DL 方法赋予它们从初缺乏的可解释性特征，以便即使是复杂的预测模型最终用人类可以理解的术语进行解释。这类研究大多数提出了以某种方式复制人类解释程序的方法，我们在下一节中将进行详细说明。这为讨论引入了另一个元素，正如\
  \ 29 中提出的，需要将现有的人类医学知识整合到 ML/DL 模型中，创建人机交互框架，将医学专家（而不是模型）置于可解释性过程的核心（(30)）。正如 31\
  \ 所论，对模型可解释性要求的理解取决于接收解释的人是谁。如果医学专家是医学决策的渠道，那么这个人应该是评估解释并传达解释的人。再次，正如 31 所示，“解释的目的是为了解决一个伦理问题；即，通过允许人们确认对该决策建立有意义的人类控制，从而确认决策的理由符合领域规范和最佳实践”。\n\
  \n\n\n\n基于机器学习的系统在医疗和健康领域之所以需要具有解释性，其原因之一在于：当问题表述中存在某种形式的不完备（或知识缺口）时，就需要解释性^(26)，例如数据建模目标与医疗目标之间的不匹配。需要注意的是，后者通常由临床指南调解，临床指南是从业人员在处理特定问题时的开放式指导；因此，指南是引导特定过程的可解释规则的提炼：无非是基于先验知识的程序化决策流水线。基于机器学习的医疗数据分析的一个上升趋势是“分析流水线”，以及与之相关的自动机器学习（AutoML），^(5)，它甚至涉及了自动化流水线优化的可能性。这实际上与悠久的医疗决策支持系统（MDSS）概念并不相似，MDSS\
  \ 已经在至少几个特定领域取得了进展^(32,) ^(33)，其采纳障碍长期以来一直是研究的主题。^(34) 这里值得强调的是，基于机器学习的数据分析与医疗指南在“流水线”概念上具有许多共同点，这可能是为深度学习（DL）穿上解释性“外衣”以进入医疗护理点现实的关键。\n\
  \n归根底，解释性不仅在医学和健康领域至关重要，还需要针对特定的应用进行精细定制，更重要的是，算法的透明度是可以被用户衡量的。对[Ref. \\[35\\]](#chapter8.xhtml#ref8_35)中方法和指标的综述提出了特定的、可衡量的标准，以评估机器学习方法的解释和阐释对于最终用户而言何恰当有效。\n\
  \n### 3. 医疗领域深度学习的可解释性：方法\n\n机器解释，即通过包括深度学习模型在内的机器学习模型对单次预测进行解释，是当前一个非常活跃的研究领域。一些最常用的方法涉及对特定输入进行影响归因，以产生显著性图，例如，局部可解释模型无关解释（LIME^(36)）。该方法的主要局限性在于解释是局部的而非全局的。然而，这一局限性并没有减少该方法的显著实用性。\n\
  \n目前已有关于解释和解读方法的全面回顾。两者之间的区别在于，解释（explanation）通常是从预测反向运行，量化每个输入变量或变量组合对预测的影响，类似于敏感性图，^(37)；而解读（interpretation）则是关于理解模型输出的原因，以某种方式根据每个输入对预测的重要性对每个输入进行加权。^(38)\n\
  \n最近对可解释人工智能（XAI）方法的分类法及其可解释性的原因进行了综述，^(39)，其中在深度学习应用于医疗领域时如何表述这些方法尤为有趣。^(40,) ^(41)\
  \ 解释性不仅在医学中已接受的深度学习方法应用中起着至关重要的作用，它们还需要是可靠的。解释性和可靠性这这两个概念确实紧密相关，因为必须理解模型如何工作，才能对其可信度提供合理的证明。^(42)\
  \ 在这一框架下，医疗人员的数学和技术培训对于接受和理解相对复杂的数学模型（如基于深度学习的模型）似乎是本质的。\n\n在开发和解释深度学习模型时，可靠性是一个特别关键方面，特别是对于敏感任务，例如影响人类健康的任务，其中避免不安全的决策和行动至关重要。^(43)\
  \ 在实施机器学习系统之前，有必要验证其行为并确保在真实环境中按照预期运行。对这种可靠性的验证可以利用 XAI，专注于以系统且可解释的方式将复杂模型暴露给人类。\n\
  \nXAI 可视化技术，如集成梯度归因方法和 SmoothGrad 降噪算法，可以用于洞察非常深的模型（如著名的卷积神经网络）所学习的特征，^(44)，从而揭示深度学习的黑箱并允许其具有可解释性。在这个意义上，在眼科和肿瘤学领域已经进行卓越的临床研究。^(45,)\
  \ ^(46)\n\n可解释性在不久的可能是自动化或半自动化 MDSS 的法律要求，特别是当深度学习对人类生命可能产生影响时，例如在医学诊断和治疗中。这是深度学习应用于医疗领域的实际基石之一，不仅涉及机器学习专家和医疗从业人员，还需要律师和监管专家，以便他们所有人都能给出准确、临床医生可理解且符合法律的解决方案。然而，来自这些不同领域的专家可能会有非常不同的观点和偏见，可能很难达成共识。这种现象部分归因于大多数\
  \ XAI 方法基于过于技术性的解决方案，只有能够操作相应数学函数的深度学习专家才能触及。另一种可以帮助使 XAI 更易于处理的补充方法由符号人工智能代表，其中符号充当了人类与深度学习之间的翻译器；^(47)\
  \ 特别是知识图谱（KG）及其底层的语义技术。\n\n### 4. 结论\n\n赋予机器学习模型解释性和可解释性，是推动其整合到医疗实践中的必要条件。可以说，对于那些无论性能如何都被视为极端黑箱数据建模案例的深度学习方法，这种需求更为迫切。然而，请注意反对人工智能解释性充分性的论点，或指出解释性论述中偶尔占据主导地位的矛盾和定义不足已被提出，^(31,)\
  \ ^(48)，例如，关于“人工智能 用于许多低风险目的，这些目的没有要求其具有解释性的事实”。虽然这一反对意见在某种程度上是合理的，但它只适用于低风险决策，而这在医疗决策中往往并非如此。对于在至关重要的生死关头做决策者来说，如果没有解释性，人工智能的优势将无法触及。^(49)\n\
  \n\n\n\n也有观点认为，“要求可解释性的原则将阻止我们从这些情况下获得 AI 带来的益处…… 只有当我们已经知道对于当前待决决策哪些考虑因素是可以接受的时，可解释\
  \ AI 所给出的解释才是有成效的。如果我们已经有了这些考虑因素，那么就没有需要使用现代 AI 算法了，因为标准的自动化即可。换句话说，AI 的可解释性原则使得\
  \ AI 的使用变得多余”。我们认为这一反对是错误的。`ML` 作为 `AI` 的实例化，其目的是使风险的量化比目前可能实现的更加准确。一个可解释模型可以同样准确，但与包含所有可用变量的\
  \ `DL` 模型相比，它可能会是稀疏的。事实上，这取决于噪声中的信号。通过选择信噪比最好的变量，模型不仅规模更小，而且受偶然效应的影响也更少。因此，稀疏模型可以且通常会表现优于添加了“垃圾”变量的模型。因此，可解释性不必阻碍性能，甚至可以增强性能。\n\
  \n我们希望在结论中强调，理解应用于医学问题的 `DL` 模型的可解释性和说明性非常重要，这仅仅是一个部分技术问题，因此我们认为应该更多关注从医学专家视角阐述特定问题的需求，阐这些需求如何使\
  \ `DL` 建模与基于指南的医学决策推理兼容，并符合当前的数据保护法规。\n\n我们认为，在经历了 `DL` 的黄金十年（模型变得越来越准确并能够解决迄为止被认为不可逾越的问题），下一个十年将特别致力于从\
  \ `DL` 方法中提取可理解的信息，特别是在医学等领域，在这些领域，说明性、可解释性和可靠性对于实现真正的落地和日常实践应用至关重要。\n\n## 参考文献\n\
