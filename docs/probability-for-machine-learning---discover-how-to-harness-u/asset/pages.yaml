  img_proc: true
- pgno: 27
  md: 'This does not apply just to the model, the artifact, but the whole procedure
    used to prepare it, including the choice and preparation of data, choice of training
    hyperparameters, and the interpretation of model predictions. Model error could
    mean imperfect predictions, such as predicting a quantity in a regression problem
    that is quite different to what was expected, or predicting a class label that
    does not match what would be expected. This type of error in prediction is expected
    given the uncertainty we have about the data that we have just discussed, both
    in terms of noise in the observations and incomplete coverage of the domain.


    Another type of error is an error of omission. We leave out details or abstract
    them in order to generalize to new cases. This is achieved by selecting models
    that are simpler but more robust to the specifics of the data, as opposed to complex
    models that may be highly specialized to the training data. As such, we might
    and often do choose a model known to make errors on the training dataset with
    the expectation that the model will generalize better to new cases and have better
    overall performance.


    > > In many cases, it is more practical to use a simple but uncertain rule rather
    than a complex but certain one, even if the true rule is deterministic and our
    modeling system has the fidelity to accommodate a complex rule.

    > >

    > > — Page 55, *Deep Learning*, 2016.


    Nevertheless, predictions are required. Given we know that the models will make
    errors, we handle this uncertainty by seeking a model that is good enough. This
    often is interpreted as selecting a model that is skillful as compared to a naive
    method or other established learning models, e.g. good relative performance.


    # 2.6 How to Manage Uncertainty


    Uncertainty in applied machine learning is managed using probability. Probability
    is the field of mathematics designed to handle, manipulate, and harness uncertainty.


    > > A key concept in the field of pattern recognition is that of uncertainty.
    It arises both through noise on measurements, as well as through the finite size
    of data sets. Probability theory provides a consistent framework for the quantification
    and manipulation of uncertainty and forms one of the central foundations for pattern
    recognition.

    > >

    > > — Page 12, *Pattern Recognition and Machine Learning*, 2006.


    In fact, probability theory is central to the broader field of artificial intelligence.


    > > Agents can handle uncertainty by using the methods of probability and decision
    theory, but first they must learn their probabilistic theories of the world from
    experience.

    > >

    > > — Page 802, *Artificial Intelligence: A Modern Approach*, 3rd edition, 2009.


    The methods and tools from probability provide the foundation and way of thinking
