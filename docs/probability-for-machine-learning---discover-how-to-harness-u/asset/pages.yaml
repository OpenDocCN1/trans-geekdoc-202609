    by models that have a larger area have better skill across the thresholds, although
    the specific shape of the curves between models will vary, potentially offering
    opportunity to optimize models by a pre-chosen threshold. Typically, the threshold
    is chosen by the operator after the model has been prepared.


    The AUC can be calculated in Python using the `roc_auc_score()` function in scikit-learn.
    This function takes a list of true output values and predicted probabilities as
    arguments and returns the ROC AUC. An AUC score is a measure of the likelihood
    that the model that produced the predictions will rank a randomly chosen positive
    example above a randomly chosen negative example. Specifically, that the probability
    will be higher for a real event (*class = 1*) than a real non-event (*class =
    0*). This is an instructive definition that offers two important intuitions:


    +   - **Naive Prediction.** A naive prediction under ROC AUC is any constant probability.
    If the same probability is predicted for every example, there is no discrimination
    between positive and negative cases, therefore the model has no skill (AUC=0.5).'
