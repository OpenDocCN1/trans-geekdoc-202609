  md: 'kernel density estimation. First, the class is constructed with the desired
    bandwidth (window size) and kernel (basis function) arguments. It is a good idea
    to test different configurations on your data. In this case, we will try a bandwidth
    of 2 and a Gaussian kernel. The class is then fit on a data sample via the fit()
