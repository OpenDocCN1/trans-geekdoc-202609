- pgno: 95
  md: 'For example, the normal distribution has two parameters: the mean and the standard
    deviation. Given these two parameters, we now know the probability distribution
    function. These parameters can be estimated from data by calculating the sample
    mean and sample standard deviation. We refer to this process as parametric density
    estimation. The reason is that we are using predefined functions to summarize
    the relationship between observations and their probability that can be controlled
    or configured with parameters, hence *parametric*. Once we have estimated the
    density, we can check if it is a good fit. This can be done in many ways, such
    as:


    +   - Plotting the density function and comparing the shape to the histogram.

    +   - Sampling the density function and comparing the generated sample to the
    real sample.

    +   - Using a statistical test to confirm the data fits the distribution.


    We can demonstrate this with an example. We can generate a random sample of 1,000
    observations from a normal distribution with a mean of 50 and a standard deviation
    of 5.


    ```

    ...

    # generate a sample

    sample = normal(loc=50, scale=5, size=1000)

    ```


    Listing 10.3: Example of randomly sampling a normal probability distribution.


    We can then pretend that we don’t know the probability distribution and maybe
    look at a histogram and guess that it is normal. Assuming that it is normal, we
    can then calculate the parameters of the distribution, specifically the mean and
    standard deviation. We would not expect the mean and standard deviation to be
    50 and 5 exactly given the small sample size and noise in the sampling process.


    ```

    ...

    # calculate parameters

    sample_mean = mean(sample)

    sample_std = std(sample)

    print(''Mean=%.3f, Standard Deviation=%.3f'' % (sample_mean, sample_std))

    ```


    Listing 10.4: Example of calculating the moments of a data sample.


    Then fit the distribution with these parameters, so-called parametric density
    estimation of our data sample. In this case, we can use the `norm()` SciPy function.


    ```

    ...

    # define the distribution

    dist = norm(sample_mean, sample_std)

    ```


    Listing 10.5: Example of defining a normal probability distribution.


    We can then sample the probabilities from this distribution for a range of values
    in our domain, in this case between 30 and 70.


    ```

    ...

    # sample probabilities for a range of outcomes

    values = [value for value in range(30, 70)]

    probabilities = [dist.pdf(value) for value in values]

    ```


    Listing 10.6: Example of calculating the expected probability of specific values.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Finally, we can plot a histogram of the data sample and overlay a line plot
    of the probabilities calculated for the range of values from the PDF. Importantly,
    we can convert the counts or frequencies in each bin of the histogram to a normalized
    probability to ensure the y-axis of the histogram matches the y-axis of the line
    plot. This can be achieved by setting the density argument to True in the call
    to hist().


    ```

    ...

    # plot the histogram and pdf

    pyplot.hist(sample, bins=10, density=True)

    pyplot.plot(values, probabilities)

    ```


    Listing 10.7: Example of plotting observed values versus expected probabilities.


    Tying these snippets together, the complete example of parametric density estimation
    is listed below.


    ```

    # example of parametric probability density estimation

    from matplotlib import pyplot

    from numpy.random import normal

    from numpy import mean

    from numpy import std

    from scipy.stats import norm

    # generate a sample

    sample = normal(loc=50, scale=5, size=1000)

    # calculate parameters

    sample_mean = mean(sample)

    sample_std = std(sample)

    print(''Mean=%.3f, Standard Deviation=%.3f'' % (sample_mean, sample_std))

    # define the distribution

    dist = norm(sample_mean, sample_std)

    # sample probabilities for a range of outcomes

    values = [value for value in range(30, 70)]

    probabilities = [dist.pdf(value) for value in values]

    # plot the histogram and pdf

    pyplot.hist(sample, bins=10, density=True)

    pyplot.plot(values, probabilities)

    pyplot.show()

    ```


    Listing 10.8: Example of parametric probability density estimation.


    Running the example first generates the data sample, then estimates the parameters
    of the normal probability distribution. Note that your results will differ given
    the random nature of the data sample. Try running the example a few times. In
    this case, we can see that the mean and standard deviation have some noise and
    are slightly different from the expected values of 50 and 5 respectively. The
    noise is minor and the distribution is expected to still be a good fit.


    ```

    Mean=49.852, Standard Deviation=5.023

    ```


    Listing 10.9: Example output from parametric probability density estimation.


    Next, the PDF is fit using the estimated parameters and the histogram of the data
    with 10 bins is compared to probabilities for a range of values sampled from the
    PDF. We can see that the PDF is a good match for our data.'
