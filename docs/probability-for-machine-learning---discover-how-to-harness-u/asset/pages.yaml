  md: "This is a good start, but what if we use some basic information about the composition\
    \ of the training dataset in the strategy. We will explore that next.\n\n# 25.4\
    \ Predict a Randomly Selected Class\n\nAnother naive classifier approach is to\
    \ make use of the training dataset in some way. Perhaps the simplest approach\
    \ would be to use the observations in the training dataset as predictions. Specifically,\
    \ we can randomly select observations in the training set and return them for\
    \ each requested prediction. This makes sense, and we may expect this primitive\
    \ use of the training dataset would result in a slightly better naive accuracy\
    \ than randomly guessing.\n\nWe can find out by calculating the expected performance\
    \ of the approach using our probabilistic framework. If we select examples from\
    \ the training dataset with a uniform probability distribution, we will draw examples\
    \ from each class with the same probability of their occurrence in the training\
    \ dataset. That is, we will draw examples of class-0 with a probability of 25%\
    \ and class-1 with a probability of 75%. This too will be the probability of the\
    \ independent predictions by the model.\n\nWith this knowledge, we can plug-in\
    \ these values into the probabilistic model.\n\nP(yhat=y) = P(yhat=0) × P(y=0)\
    \ + P(yhat=1) × P(y=1)\n= 0.25 × 0.25 + 0.75 × 0.7\n= 0.0625 + 0.562\n= 0.625\n\
    (25.4)\n\nThe result suggests that using a uniformly randomly selected class from\
    \ the training dataset as a prediction results in a better naive classifier than\
    \ simply predicting a uniformly random class on this dataset, showing 62.5% instead\
    \ of 50%, or a 12.2% lift. Not bad! Let’s confirm our calculations again with\
    \ a small simulation. The random_class() function below implements this naive\
    \ classifier strategy by selecting and returning a random class label from the\
    \ training dataset.\n\n```\n# predict a randomly selected class\ndef random_class(y):\n\
    \    return y[randint(len(y))]\n```\n\nListing 25.7: Example of a function for\
    \ predicting a randomly selected label.\n\nWe can then use the same framework\
    \ from the previous section to evaluate the model 1,000 times and report the average\
    \ classification accuracy across those trials. We would expect that this empirical\
    \ estimate would match our expected value, or be very close to it. The complete\
    \ example is listed below.\n\n```\n# example of selecting a random class naive\
    \ classifier\nfrom numpy import mean\nfrom numpy.random import randint\nfrom sklearn.metrics\
    \ import accuracy_score\n\n# predict a randomly selected class\ndef random_class(y):\n\
    \    return y[randint(len(y))]\n```"
