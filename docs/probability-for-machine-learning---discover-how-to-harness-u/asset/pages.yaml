- pgno: 225
  md: "# 23.2 What Is Cross-Entropy?\n\nCross-entropy is a measure of the difference\
    \ between two probability distributions for a given random variable or set of\
    \ events. Specifically, it builds upon the idea of entropy from information theory\
    \ and calculates the average number of bits required to represent or transmit\
    \ an event from one distribution compared to the other distribution.\n\n> > ...\
    \ the cross-entropy is the average number of bits needed to encode data coming\
    \ from a source with distribution p when we use model q ...\n> > \n> > — Page\
    \ 57, *Machine Learning: A Probabilistic Perspective*, 2012.\n\nThe intuition\
    \ for this definition comes if we consider a target or underlying probability\
    \ distribution P and an approximation of the target distribution Q, then the cross-entropy\
    \ of Q from P is the number of additional bits to represent an event using Q instead\
    \ of P. The cross-entropy between two probability distributions, such as Q from\
    \ P, can be stated formally as:\n\nH(P, Q)  (23.1)\n\nWhere H() is the cross-entropy\
    \ function, P may be the target distribution and Q is the approximation of the\
    \ target distribution. Cross-entropy can be calculated using the probabilities\
    \ of the events from P and Q, as follows:\n\nH(P, Q) = - Σ_{x∈X} P(x) × log(Q(x))\
    \  (23.2)\n\nWhere P(x) is the probability of the event x in P, Q(x) is the probability\
    \ of event x in Q and log() is the base-2 logarithm, meaning that the results\
    \ are in bits. If the base-e or natural logarithm is used instead, the result\
    \ will have the units called nats. This calculation is for discrete probability\
    \ distributions, although a similar calculation can be used for continuous probability\
    \ distributions using the integral across the events instead of the sum. The result\
    \ will be a positive number measured in bits and will be equal to the entropy\
    \ of the distribution if the two probability distributions are identical. Note\
    \ that this notation looks a lot like the joint probability, or more specifically,\
    \ the joint entropy between P and Q. This is misleading as we are scoring the\
    \ difference between probability distributions with cross-entropy. Whereas, joint\
    \ entropy is a different concept that uses the same notation and instead calculates\
    \ the uncertainty across two (or more) random variables.\n\n# 23.3 Difference\
    \ Between Cross-Entropy and KL Divergence\n\nCross-entropy is not KL Divergence.\
    \ Cross-entropy is related to divergence measures, such as the Kullback-Leibler,\
    \ or KL, Divergence that quantifies how much one distribution differs from another.\
    \ Specifically, the KL divergence measures a very similar quantity to cross-entropy.\
    \ It measures the average number of extra bits required to represent a message\
    \ with Q instead of P, not the total number of bits."
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In other words, the KL divergence is the average number of extra bits needed
    to encode the data, due to the fact that we used distribution $Q$ to encode the
    data instead of the true distribution $P$.


    > — Page 58, *Machine Learning: A Probabilistic Perspective*, 2012.


    As such, the KL divergence is often referred to as the *relative entropy*.


    +   - **Cross-Entropy**: Average number of total bits to represent an event from
    $Q$ instead of $P$.

    +   - **Relative Entropy (KL Divergence)**: Average number of extra bits to represent
    an event from $Q$ instead of $P$.


    KL divergence can be calculated as the negative sum of probability of each event
    in $P$ multiplied by the log of the probability of the event in $Q$ over the probability
    of the event in $P$. Typically, log base-2 so that the result is measured in bits.


    $$KL(P\|Q) = -\sum_{\{x\in X\}} P(x) \times \log\left(\frac{Q(x)}{P(x)}\right)$$  (23.3)


    The value within the sum is the divergence for a given event. As such, we can
    calculate the cross-entropy by adding the entropy of the distribution plus the
    additional entropy calculated by the KL divergence. This is intuitive, given the
    definition of both calculations; for example:


    $$H(P,Q) = H(P) + KL(P\|Q)$$  (23.4)


    Where $H(P,Q)$ is the cross-entropy of $Q$ from $P$, $H(P)$ is the entropy of
    $P$ and $KL(P\|Q)$ is the divergence of $Q$ from $P$. Entropy can be calculated
    for a probability distribution as the negative sum of the probability for each
    event multiplied by the log of the probability for the event, where log is base-2
    to ensure the result is in bits.


    $$H(P) = -\sum_{\{x\in X\}} p(x) \times \log(p(x))$$  (23.5)


    Like KL divergence, cross-entropy is not symmetrical, meaning that:


    $$H(P,Q) \ne H(Q,P)$$  (23.6)


    As we will see later, both cross-entropy and KL divergence calculate the same
    quantity when they are used as loss functions for optimizing a classification
    predictive model. It is under this context that you might sometimes see that cross-entropy
    and KL divergence are the same.


    # 23.4  How to Calculate Cross-Entropy


    In this section we will make the calculation of cross-entropy concrete with a
    small example.'
