- pgno: 197
  md: '# Chapter 20


    # Bayesian Belief Networks


    Probabilistic models can define relationships between variables and be used to
    calculate probabilities. For example, fully conditional models may require an
    enormous amount of data to cover all possible cases, and probabilities may be
    intractable to calculate in practice. Simplifying assumptions such as the conditional
    independence of all random variables can be effective, such as in the case of
    Naive Bayes, although it is a drastically simplifying step. An alternative is
    to develop a model that preserves known conditional dependence between random
    variables and conditional independence in all other cases. Bayesian networks are
    a probabilistic graphical model that explicitly capture known conditional dependence
    with directed edges in a graph model. All missing connections define the conditional
    independencies in the model. As such Bayesian Networks provide a useful tool to
    visualize the probabilistic model for a domain, review all of the relationships
    between the random variables, and reason about causal probabilities for scenarios
    given available evidence. In this tutorial, you will discover a gentle introduction
    to Bayesian Networks. After reading this tutorial, you will know:


    +   - Bayesian networks are a type of probabilistic graphical model comprised
    of nodes and directed edges.

    +   - Bayesian network models capture both conditionally dependent and conditionally
    independent relationships between random variables.

    +   - Models can be prepared by experts or learned from data, then used for inference
    to estimate the probabilities for causal or subsequent events.


    Let’s get started.


    # 20.1 Tutorial Overview


    This tutorial is divided into five parts; they are:


    +   1. Challenge of Probabilistic Modeling

    +   2. Bayesian Belief Network as a Probabilistic Model

    +   3. How to Develop and Use a Bayesian Network

    +   4. Example of a Bayesian Network

    +   5. Bayesian Networks in Python'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# 20.2  Challenge of Probabilistic Modeling


    Probabilistic models can be challenging to design and use. Most often, the problem
    is the lack of information about the domain required to fully specify the conditional
    dependence between random variables. If available, calculating the full conditional
    probability for an event can be impractical. A common approach to addressing this
    challenge is to add some simplifying assumptions, such as assuming that all random
    variables in the model are conditionally independent. This is a drastic assumption,
    although it proves useful in practice, providing the basis for the Naive Bayes
    classification algorithm.


    An alternative approach is to develop a probabilistic model of a problem with
    some conditional independence assumptions. This provides an intermediate approach
    between a fully conditional model and a fully conditionally independent model.
    Bayesian belief networks are one example of a probabilistic model where some variables
    are conditionally independent.


    > > Bayesian belief networks provide an intermediate approach that is less constraining
    than the global assumption of conditional independence made by the naive Bayes
    classifier, but more tractable than avoiding conditional independence assumptions
    altogether.

    > >

    > > — Page 184, *Machine Learning*, 1997.


    # 20.3  Bayesian Belief Network as a Probabilistic Model


    A Bayesian belief network is a type of probabilistic graphical model.


    # 20.3.1  Probabilistic Graphical Models


    A probabilistic graphical model (PGM), or simply *graphical model* for short,
    is a way of representing a probabilistic model with a graph structure. The nodes
    in the graph represent random variables and the edges that connect the nodes represent
    the relationships between the random variables.


    > > A graph comprises nodes (also called vertices) connected by links (also known
    as edges or arcs). In a probabilistic graphical model, each node represents a
    random variable (or group of random variables), and the links express probabilistic
    relationships between these variables.

    > >

    > > — Page 360, *Pattern Recognition and Machine Learning*, 2006.


    +   - **Nodes:** Random variables in a graphical model.

    +   - **Edges:** Relationships between random variables in a graphical model.


    There are many different types of graphical models, although the two most commonly
    described are the Hidden Markov Model and the Bayesian Network. The Hidden Markov
    Model (HMM) is a graphical model where the edges of the graph are undirected,
    meaning the graph contains cycles. Bayesian Networks are more restrictive, where
    the edges of the graph are directed, meaning they can only be navigated in one
    direction. This means that cycles are not possible, and the structure can be more
    generally referred to as a directed acyclic graph (DAG).'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Directed graphs are useful for expressing causal relationships between random
    variables, whereas undirected graphs are better suited to expressing soft constraints
    between random variables.


    > — Page 360, *Pattern Recognition and Machine Learning*, 2006.


    # 20.3.2 Bayesian Belief Networks


    A Bayesian Belief Network, or simply *Bayesian Network*, provides a simple way
    of applying Bayes Theorem to complex problems. The networks are not exactly Bayesian
    by definition, although given that both the probability distributions for the
    random variables (nodes) and the relationships between the random variables (edges)
    are specified subjectively, the model can be thought to capture the *belief* about
    a complex domain. Bayesian probability is the study of subjective probabilities
    or belief in an outcome, compared to the frequentist approach where probabilities
    are based purely on the past occurrence of the event. A Bayesian Network captures
    the joint probabilities of the events represented by the model.


    A Bayesian belief network describes the joint probability distribution for a set
    of variables.


    > — Page 185, *Machine Learning*, 1997.


    Central to the Bayesian network is the notion of conditional independence. Independence
    refers to a random variable that is unaffected by all other variables. A dependent
    variable is a random variable whose probability is conditional on one or more
    other random variables. Conditional independence describes the relationship among
    multiple random variables, where a given variable may be conditionally independent
    of one or more other random variables. This does not mean that the variable is
    independent per se; instead, it is a clear definition that the variable is independent
    of specific other known random variables.


    A probabilistic graphical model, such as a Bayesian Network, provides a way of
    defining a probabilistic model for a complex problem by stating all of the conditional
    independence assumptions for the known variables, whilst allowing the presence
    of unknown (latent) variables. As such, both the presence and the absence of edges
    in the graphical model are important in the interpretation of the model.


    A graphical model (GM) is a way to represent a joint distribution by making [Conditional
    Independence] CI assumptions. In particular, the nodes in the graph represent
    random variables, and the (lack of) edges represent CI assumptions. (A better
    name for these models would in fact be “independence diagrams” ...


    > — Page 308, *Machine Learning: A Probabilistic Perspective*, 2012.


    Bayesian networks provide useful benefits as a probabilistic model. For example:


    +   - **Visualization**. The model provides a direct way to visualize the structure
    of the model and motivate the design of new models.

    +   - **Relationships**. Provides insights into the presence and absence of the
    relationships between random variables.

    +   - **Computations**. Provides a way to structure complex probability calculations.'
