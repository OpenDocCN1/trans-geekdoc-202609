- pgno: 149
  md: '# 16.2 What is Bayes Theorem?


    Conditional probability is the probability of one event given the occurrence of
    another event, often described in terms of events A and B from two dependent random
    variables e.g. X and Y.


    +   - **Conditional Probability**: Probability of one event given the occurrence
    of one or more other events, e.g. $P(A|B)$.


    The conditional probability can be calculated using the joint probability; for
    example:


    $$P(A|B) = \frac{P(A \cap B)}{P(B)}\tag{16.1}$$


    Additionally, conditional probability is not symmetrical; for example:


    $$P(A|B) \neq P(B|A)\tag{16.2}$$


    Nevertheless, one conditional probability can be calculated using the other conditional
    probability. This is called Bayes Theorem, named for Reverend Thomas Bayes, and
    can be stated as follows:


    $$P(A|B) = \frac{P(B|A) \times P(A)}{P(B)}\tag{16.3}$$


    Bayes Theorem provides a principled way for calculating a conditional probability
    and an alternative to using the joint probability. This alternate approach of
    calculating the conditional probability is useful either when the joint probability
    is challenging to calculate, or when the reverse conditional probability is available
    or easy to calculate.


    +   - **Bayes Theorem**: Principled way of calculating a conditional probability
    without the joint probability.


    It is often the case that we do not have access to the denominator directly, e.g.
    $P(B)$. We can calculate it an alternative way, for example:


    $$P(B) = P(B|A) \times P(A) + P(B|\text{not } A) \times P(\text{not } A)\tag{16.4}$$


    This gives a formulation of Bayes Theorem that uses the alternate calculation
    of $P(B)$, described below:


    $$P(A|B) = \frac{P(B|A) \times P(A)}{P(B|A) \times P(A) + P(B|\text{not } A) \times
    P(\text{not } A)}\tag{16.5}$$


    Note the denominator is simply the expansion we gave above. As such, if we have
    $P(A)$, then we can calculate $P(\text{not } A)$ as its complement, for example:


    $$P(\text{not } A) = 1 - P(A)\tag{16.6}$$


    Additionally, if we have $P(\text{not } B|\text{not } A)$, then we can calculate
    $P(B|\text{not } A)$ as its complement, for example:


    $$P(B|\text{not } A) = 1 - P(\text{not } B|\text{not } A)\tag{16.7}$$


    Now that we are familiar with the calculation of Bayes Theorem, let’s take a closer
    look at the meaning of the terms in the equation.'
