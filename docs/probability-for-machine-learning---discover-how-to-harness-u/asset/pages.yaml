- pgno: 181
  md: "The complete example of reviewing the test function that we wish to optimize\
    \ is listed below.\n\n```\n# example of the test problem\nfrom math import sin\n\
    from math import pi\nfrom numpy import arange\nfrom numpy import argmax\nfrom\
    \ numpy.random import normal\nfrom matplotlib import pyplot\n\n# objective function\n\
    def objective(x, noise=0.1):\n    noise = normal(loc=0, scale=noise)\n    return\
    \ (x**2 * sin(5 * pi * x)**6.0) + noise\n\n# grid-based sample of the domain [0,1]\n\
    X = arange(0, 1, 0.01)\n# sample the domain without noise\ny = [objective(x, 0)\
    \ for x in X]\n# sample the domain with noise\nynoise = [objective(x) for x in\
    \ X]\n# find best result\nix = argmax(y)\nprint('Optima: x=%.3f, y=%.3f' % (X[ix],\
    \ y[ix]))\n# plot the points with noise\npyplot.scatter(X, ynoise)\n# plot the\
    \ points without noise\npyplot.plot(X, y)\n# show the plot\npyplot.show()\n```\n\
    \nListing 19.7: Example plotting samples of the objective function.\n\nRunning\
    \ the example first reports the global optima as an input with the value 0.9 that\
    \ gives the score 0.81.\n\n```\nOptima: x=0.900, y=0.810\n```\n\nListing 19.8:\
    \ Example output from the optima from sampling the objective function.\n\nA plot\
    \ is then created showing the noisy evaluation of the samples (dots) and the non-noisy\
    \ and true shape of the objective function (line). Your specific dots will differ\
    \ given the stochastic nature of the noisy objective function."
