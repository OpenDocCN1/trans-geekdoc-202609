  md: '# Appendix A


    # Getting Help


    This is just the beginning of your journey with probability. As you start to work
    on projects and expand your existing knowledge of the techniques, you may need
    help. This appendix points out some of the best sources of help.


    # A.1 Probability on Wikipedia


    Wikipedia is a great place to start. All of the important topics are covered,
    the descriptions are concise, and the equations are consistent and readable. What
    is missing is the more human level descriptions such as analogies and intuitions.
    Nevertheless, when you have questions about probability, I recommend stopping
    by Wikipedia first. Some good high-level pages to start on include:


    +   - Probability, Wikipedia.

    +     https://en.wikipedia.org/wiki/Probability

    +   - Probability theory, Wikipedia.

    +     https://en.wikipedia.org/wiki/Probability_theory

    +   - List of probability topics, Wikipedia.

    +     https://en.wikipedia.org/wiki/List_of_probability_topics

    +   - Catalog of articles in probability theory, Wikipedia.

    +     https://en.wikipedia.org/wiki/Catalog_of_articles_in_probability_theory

    +   - Notation in probability and statistics, Wikipedia.

    +     https://en.wikipedia.org/wiki/Notation_in_probability_and_statistics


    # A.2 Probability Textbooks


    I strongly recommend getting a good textbook on the topic of probability and using
    it as a reference. The benefit of a good textbook is that the explanations of
    the various operations you require will be consistent (or should be). The downside
    of textbooks is that they can be very expensive. A good textbook is often easy
    to spot because it will be the basis for a range of undergraduate or postgraduate
    courses at top universities.


    Some introductory textbooks on probability I recommend include:'
  merge: -1
  img_proc: true
