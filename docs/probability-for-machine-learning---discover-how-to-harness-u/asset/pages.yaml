  md: "# 19.4. How to Perform Bayesian Optimization\n\nWe can fit a GP regression\
    \ model using the GaussianProcessRegressor scikit-learn implementation from a\
    \ sample of inputs ($X$) and noisy evaluations from the objective function ($y$).\
    \ First, the model must be defined. An important aspect in defining the GP model\
    \ is the kernel. This controls the shape of the function at specific points based\
    \ on distance measures between actual data observations. Many different kernel\
    \ functions can be used, and some may offer better performance for specific datasets.\
    \ By default, a Radial Basis Function, or RBF, is used that can work well.\n\n\
    ```\n```python\n...\n# define the model\nmodel = GaussianProcessRegressor()\n\
    ```\n```\n\nListing 19.9: Example defining the Gaussian Process model.\n\nOnce\
    \ defined, the model can be fit on the training dataset directly by calling the\
    \ `fit()` function. The defined model can be fit again at any time with updated\
    \ data concatenated to the existing data by another call to `fit()`.\n\n```\n\
    ```python\n...\n# fit the model\nmodel.fit(X, y)\n```\n```\n\nListing 19.10: Example\
    \ fitting the Gaussian Process model.\n\nThe model will estimate the cost for\
    \ one or more samples provided to it. The model is used by calling the `predict()`\
    \ function. The result for a given sample will be a mean of the distribution at\
    \ that point. We can also get the standard deviation of the distribution at that\
    \ point in the function by specifying the argument `return_std=True`; for example:\n\
    \n```\n```python\n...\nyhat = model.predict(X, return_std=True)\n```\n```\n\n\
    Listing 19.11: Example making predictions with the Gaussian Process model.\n\n\
    This function can result in warnings if the distribution is thin at a given point\
    \ we are interested in sampling. Therefore, we can silence all of the warnings\
    \ when making a prediction. The `surrogate()` function below takes the fit model\
    \ and one or more samples and returns the mean and standard deviation estimated\
    \ costs whilst not printing any warnings.\n\n```\n```python\n# surrogate or approximation\
    \ for the objective function\ndef surrogate(model, X):\n    # catch any warning\
    \ generated when making a prediction\n    with catch_warnings():\n        # ignore\
    \ generated warnings\n        simplefilter(\"ignore\")\n        return model.predict(X,\
    \ return_std=True)\n```\n```\n\nListing 19.12: Example of the surrogate function\
    \ for approximating the objective function.\n\nWe can call this function any time\
    \ to estimate the cost of one or more samples, such as when we want to optimize\
