    \ of a negative log-likelihood is a cross-entropy between the empirical distribution\
    \ defined by the training set and the probability distribution defined by model.\
    \ For example, mean squared error is the cross-entropy between the empirical distribution\
    \ and a Gaussian model.\n> \n> — Page 132, *Deep Learning*, 2016.\n\nThis is a\
    \ little mind blowing, and comes from the field of differential entropy for continuous\
    \ random variables. It means that if you calculate the mean squared error between\
    \ two Gaussian random variables that cover the same events (have the same mean\
    \ and standard deviation), then you are calculating the cross-entropy between\
    \ the variables. It also means that if you are using mean squared error loss to\
    \ optimize your neural network model for a regression problem, you are in effect\
    \ using a cross entropy loss."
