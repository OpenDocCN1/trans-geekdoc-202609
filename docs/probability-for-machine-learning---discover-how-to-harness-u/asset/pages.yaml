- pgno: 150
  md: '# 16.3 Naming the Terms in the Theorem


    The terms in the Bayes Theorem equation are given names depending on the context
    where the equation is used. It can be helpful to think about the calculation from
    these different perspectives and help to map your problem onto the equation. Firstly,
    in general the result $P(A|B)$ is referred to as the posterior probability and
    $P(A)$ is referred to as the prior probability.


    +   - $P(A|B)$: Posterior probability.

    +   - $P(A)$: Prior probability.


    Sometimes $P(B|A)$ is referred to as the likelihood and $P(B)$ is referred to
    as the evidence.


    +   - $P(B|A)$: Likelihood.

    +   - $P(B)$: Evidence.


    This allows Bayes Theorem to be restated as:


    Posterior = $\frac{\text{Likelihood} \times \text{Prior}}{\text{Evidence}}$  (16.8)


    We can make this clear with a *Smoke* and *Fire* example. What is the probability
    that there is fire given that there is smoke, where $P(\text{Fire})$ is the Prior,
    $P(\text{Smoke}|\text{Fire})$ is the Likelihood, and $P(\text{Smoke})$ is the
    evidence:


    $P(\text{Fire}|\text{Smoke}) = \frac{P(\text{Smoke}|\text{Fire}) \times P(\text{Fire})}{P(\text{Smoke})}$  (16.9)


    We can also think about the calculation in the terms of a binary classifier. For
    example, $P(B|A)$ may be referred to as the True Positive Rate (TPR) or the **sensitivity**,
    $P(B|\text{not } A)$ may be referred to as the False Positive Rate (FPR), the
    complement $P(\text{not } B|\text{not } A)$ may be referred to as the True Negative
    Rate (TNR) or **specificity**, and the value we are calculating $P(A|B)$ may be
    referred to as the Positive Predictive Value (PPV) or the **precision**.


    +   - $P(\text{not } B|\text{not } A)$: True Negative Rate or TNR (specificity).

    +   - $P(B|\text{not } A)$: False Positive Rate or FPR.

    +   - $P(\text{not } B|A)$: False Negative Rate or FNR.

    +   - $P(B|A)$: True Positive Rate or TPR (sensitivity or recall).

    +   - $P(A|B)$: Positive Predictive Value or PPV (precision).


    For example, we may re-state the calculation using these terms as follows:


    $PPV = \frac{TPR \times P(A)}{TPR \times P(A) + FPR \times P(\text{not } A)}$  (16.10)


    Now that we are familiar with what Bayes Theorem and the meaning of the terms,
    let’s look at some scenarios where we can calculate it. Note that all of the following
    examples are contrived, they are not based on real-world probabilities.'
