    # 18.6 5 Tips When Using Naive Bayes


    This section lists some practical tips when working with Naive Bayes models.


    # 18.6.1 Use a KDE for Complex Distributions


    If the probability distribution for a variable is complex or unknown, it can be
    a good idea to use a kernel density estimator or KDE to approximate the distribution
    directly from the data samples. A good example would be the Gaussian KDE.


    # 18.6.2 Decreased Performance With Increasing Variable Dependence


    By definition, Naive Bayes assumes the input variables are independent of each
    other. This works well most of the time, even when some or most of the variables
    are in fact dependent. Nevertheless, the performance of the algorithm degrades
    the more dependent the input variables happen to be.


    # 18.6.3 Avoid Numerical Underflow with Log


    The calculation of the independent conditional probability for one example for
    one class label involves multiplying many probabilities together, one for the
    class and one for each input variable. As such, the multiplication of many small
    numbers together can become numerically unstable, especially as the number of
    input variables increases. To overcome this problem, it is common to change the
    calculation from the product of probabilities to the sum of log probabilities.
    For example:


    P(y_i|x_1,x_2,...,x_n) = log(P(x_1|y_i)) + log(P(x_2|y_i)) + ... + log(P(x_n|y_i))
    + log(P(y_i)) (18.7)'
