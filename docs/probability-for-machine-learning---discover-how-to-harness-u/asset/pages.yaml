    # 21.4 Calculate the Information for a Random Variable


    We can also quantify how much information there is in a random variable. For example,
    if we wanted to calculate the information for a random variable X with probability
    distribution p, this might be written as a function H(); for example:


    H(X) (21.3)


    In effect, calculating the information for a random variable is the same as calculating
    the information for the probability distribution of the events for the random
    variable. Calculating the information for a random variable is called information
    entropy, Shannon entropy, or simply entropy. It is related to the idea of entropy
    from physics by analogy, in that both are concerned with uncertainty. The intuition
    for entropy is that it is the average number of bits required to represent or
    transmit an event drawn from the probability distribution for the random variable.


    > ... the Shannon entropy of a distribution is the expected amount of information
    in an event drawn from that distribution. It gives a lower bound on the number
    of bits [...] needed on average to encode symbols drawn from a distribution P.


    — Page 74, Deep Learning, 2016.'
