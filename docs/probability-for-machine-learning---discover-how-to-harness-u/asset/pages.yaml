    # 27.2 Predicting Probabilities


    In a classification problem, we may decide to predict the class values directly.
    Alternately, it can be more flexible to predict the probabilities for each class
    instead. The reason for this is to provide the capability to choose and even calibrate
    the threshold for how to interpret the predicted probabilities. For example, a
    default might be to use a threshold of 0.5, meaning that a probability in [0.0,
    0.49] is a negative outcome (0) and a probability in [0.5, 1.0] is a positive
    outcome (1). This threshold can be adjusted to tune the behavior of the model
    for a specific problem. An example would be to reduce more of one or another type
    of error. When making a prediction for a binary or two-class classification problem,
    there are two types of errors that we could make.


    +   - **False Positive**. Predict an event when there was no event.

    +   - **False Negative**. Predict no event when in fact there was an event.


    By predicting probabilities and calibrating a threshold, a balance of these two
    concerns can be chosen by the operator of the model. For example, in a smog prediction
    system, we may be far more concerned with having low false negatives than low
    false positives. A false negative would mean not warning about a smog day when
    in fact it is a high smog day, leading to health issues in the public that are
    unable to take precautions. A false positive means the public would take precautionary
    measures when they didn’t need to. A common way to compare models that predict
    probabilities for two-class problems is to use a ROC curve.


    # 27.3 What Are ROC Curves?


    A useful tool when predicting the probability of a binary outcome is the Receiver
    Operating Characteristic curve, or ROC curve. It is a plot of the false positive
    rate (x-axis) versus the true positive rate (y-axis) for a number of different
    candidate threshold values between 0.0 and 1.0. Put another way, it plots the
    false alarm rate versus the hit rate. The true positive rate is calculated as
    the number of true positives divided by the sum of the number of true positives
    and the number of false negatives. It describes how good the model is at predicting
    the positive class when the actual outcome is positive.


    True Positive Rate = True Positives / (True Positives + False Negatives) (27.1)


    The true positive rate is also referred to as sensitivity.


    Sensitivity = True Positives / (True Positives + False Negatives) (27.2)


    The false positive rate is calculated as the number of false positives divided
    by the sum of the number of false positives and the number of true negatives.
    It is also called the false'
