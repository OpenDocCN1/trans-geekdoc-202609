  md: '# 10.5  Nonparametric Density Estimation


    In some cases, a data sample may not resemble a common probability distribution
    or cannot be easily made to fit the distribution. This is often the case when
    the data has two peaks (bimodal distribution) or many peaks (multimodal distribution).
    In this case, parametric density estimation is not feasible and alternative methods
    can be used that do not use a common distribution. Instead, an algorithm is used
    to approximate the probability distribution of the data without a pre-defined
    distribution, referred to as a nonparametric method.


    The distributions will still have parameters but are not directly controllable
    in the same way as simple probability distributions. For example, a nonparametric
    method might estimate the density using all observations in a random sample, in
    effect making all observations in the sample *parameters*. Perhaps the most common
    nonparametric approach for estimating the probability density function of a continuous
    random variable is called kernel smoothing, or kernel density estimation, KDE
    for short.


    +   - **Kernel Density Estimation:** Nonparametric method for using a dataset
    to estimating probabilities for new points.


    In this case, a kernel is a mathematical function that returns a probability for
    a given value of a random variable. The kernel effectively smooths or interpolates
    the probabilities across the range of outcomes for a random variable such that
    the sum of probabilities equals one, a requirement of well-behaved probabilities.
    The kernel function weights the contribution of observations from a data sample
    based on their relationship or distance to a given query sample for which the
    probability is requested. A parameter, called the smoothing parameter or the bandwidth,
    controls the scope, or window, of observations, from the data sample that contributes
    to estimating the probability for a given sample. As such, kernel density estimation
    is sometimes referred to as a Parzen-Rosenblatt window, or simply a Parzen window,
    after the developers of the method.


    +   - **Smoothing Parameter** (*bandwidth*): Parameter that controls the number
    of samples or window of samples used to estimate the probability for a new point.


    A large window may result in a coarse density with little details, whereas a small
    window may have too much detail and not be smooth or general enough to correctly
    cover new or unseen examples. The contribution of samples within the window can
    be shaped using different functions, sometimes referred to as basis functions,
    e.g. uniform normal, etc., with different effects on the smoothness of the resulting
    density function.


    +   - **Basis Function** (*kernel*): The function chosen used to control the contribution
    of samples in the dataset toward estimating the probability of a new point.


    As such, it may be useful to experiment with different window sizes and different
    contribution functions and evaluate the results against histograms of the data.
    We can demonstrate this with an example. First, we can construct a bimodal distribution
    by combining samples from two different normal distributions. Specifically, 300
    examples with a mean of 20 and a standard deviation of 5 (the smaller peak), and
    700 examples with a mean of 40 and a standard deviation of 5 (the larger peak).
    The means were chosen close together to ensure the distributions overlap in the
    combined sample. The complete example of creating this sample with a bimodal probability
    distribution and plotting the histogram is listed below.'
  merge: -1
