- pgno: 70
  md: '# 8.3  Bernoulli Distribution


    The Bernoulli distribution is a discrete probability distribution that covers
    a case where an event will have a binary outcome as either a 0 or 1.


    $$x \in \{0,1\}$$


    A *Bernoulli trial* is an experiment or case where the outcome follows a Bernoulli
    distribution. The distribution and the trial are named after the Swiss mathematician
    Jacob Bernoulli. Some common examples of Bernoulli trials include:


    +   - The single flip of a coin that may have a heads (0) or a tails (1) outcome.

    +   - A single birth of either a boy (0) or a girl (1).


    A common example of a Bernoulli trial in machine learning might be a binary classification
    of a single example as the first class (0) or the second class (1). The distribution
    can be summarized by a single variable $p$ that defines the probability of an
    outcome 1. Given this parameter, the probability for each event can be calculated
    as follows:


    $$P(x = 1) = p$$

    $$P(x = 0) = 1 - p$$


    In the case of flipping a fair coin, the value of $p$ would be 0.5, giving a 50%
    probability of each outcome.


    # 8.4  Binomial Distribution


    The repetition of multiple independent Bernoulli trials is called a Bernoulli
    process. The outcomes of a Bernoulli process will follow a Binomial distribution.
    As such, the Bernoulli distribution would be a Binomial distribution with a single
    trial. Some common examples of Bernoulli processes include:


    +   - A sequence of independent coin flips.

    +   - A sequence of independent births.


    The performance of a machine learning algorithm on a binary classification problem
    can be analyzed as a Bernoulli process, where the prediction by the model on an
    example from a test set is a Bernoulli trial (correct or incorrect). The Binomial
    distribution summarizes the number of successes in a given number of Bernoulli
    trials $k$, with a given probability of success for each trial $p$. We can demonstrate
    this with a Bernoulli process where the probability of success is 30% or $P(x
    = 1) = 0.3$ and the total number of trials is 100 ($k = 100$).


    We can simulate the Bernoulli process with randomly generated cases and count
    the number of successes over the given number of trials. This can be achieved
    via the `binomial()` NumPy function. This function takes the total number of trials
    and probability of success as arguments and returns the number of successful outcomes
    across the trials for one simulation.'
  merge: -1
  img_proc: true
