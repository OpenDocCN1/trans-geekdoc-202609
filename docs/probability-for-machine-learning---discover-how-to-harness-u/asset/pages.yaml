- pgno: 206
  md: '# ## 21.2 What Is Information Theory?


    Information theory is a field of study concerned with quantifying information
    for communication. It is a subfield of mathematics and is concerned with topics
    like data compression and the limits of signal processing. The field was proposed
    and developed by Claude Shannon while working at the US telephone company Bell
    Labs.


    > > Information theory is concerned with representing data in a compact fashion
    (a task known as data compression or source coding), as well as with transmitting
    and storing it in a way that is robust to errors (a task known as error correction
    or channel coding).

    > >

    > > — Page 56, *Machine Learning: A Probabilistic Perspective*, 2012.


    A foundational concept from information theory is the quantification of the amount
    of information in things like events, random variables, and distributions. Quantifying
    the amount of information requires the use of probabilities, hence the relationship
    of information theory to probability. Measurements of information are widely used
    in artificial intelligence and machine learning, such as in the construction of
    decision trees and the optimization of classifier models. As such, there is an
    important relationship between information theory and machine learning and a practitioner
    must be familiar with some of the basic concepts from the field.


    > > Why unify information theory and machine learning? Because they are two sides
    of the same coin. [...] Information theory and machine learning still belong together.
    Brains are the ultimate compression and communication systems. And the state-of-the-art
    algorithms for both data compression and error-correcting codes use the same tools
    as machine learning.

    > >

    > > — Page v, *Information Theory, Inference, and Learning Algorithms*, 2003.


    # ## 21.3 Calculate the Information for an Event


    Quantifying information is the foundation of the field of information theory.
    The intuition behind quantifying information is the idea of measuring how much
    surprise there is in an event, that is, how unlikely it is. Those events that
    are rare (low probability) are more surprising and therefore have more information
    those events that are common (high probability).


    +   - **Low Probability Event:** High Information (surprising).

    +   - **High Probability Event:** Low Information (unsurprising).


    > > The basic intuition behind information theory is that learning that an unlikely
    event has occurred is more informative than learning that a likely event has occurred.

    > >

    > > — Page 73, *Deep Learning*, 2016.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Rare events are more uncertain or more surprising and require more information
    to represent them than common events. We can calculate the amount of information
    there is in an event using the probability of the event. This is called *Shannon
    information*, *self-information*, or simply the *information*, and can be calculated
    for a discrete event $I(x)$ as follows:


    $$I(x) = -\log(p(x)) \tag{21.1}$$


    Where $I(x)$ is the information content (self-information) of $x$, $log()$ is
    the base-2 logarithm and $p(x)$ is the probability of the event $x$. The choice
    of the base-2 logarithm means that the units of the information measure is in
    bits (binary digits). This can be directly interpreted in the information processing
    sense as the number of bits required to represent and the event on a noisy communication
    channel. The calculation of information is often written as $h()$ to contrast
    it with entropy $H()$ (discussed later); for example:


    $$h(x) = -\log(p(x)) \tag{21.2}$$


    The negative sign ensures that the result is always positive or zero. Information
    will be zero when the probability of an event is 1.0 or a certainty, e.g. there
    is no surprise. Let’s make this concrete with some examples. Consider a flip of
    a single fair coin. The probability of heads (and tails) is 0.5. We can calculate
    the information for flipping a head in Python using the `log2()` function.


    ```

    ```python

    # calculate the information for a coin flip

    from math import log2

    # probability of the event

    p = 0.5

    # calculate information for event

    h = -log2(p)

    # print the result

    print(''p(x)=%.3f, information: %.3f bits'' % (p, h))

    ```

    ```


    Listing 21.1: Example calculating the information of a fair coin flip.


    Running the example prints the probability of the event as 50% and the information
    content for the event as 1 bit.


    ```

    ```text

    p(x)=0.500, information: 1.000 bits

    ```

    ```


    Listing 21.2: Example output from calculating the information of fair a coin flip.


    If the same coin was flipped $n$ times, then the information for this sequence
    of flips would be $n$ bits. If the coin was not fair and the probability of a
    head was instead 10% (0.1), then the event would be more rare and would require
    more than 3 bits of information.


    ```

    ```text

    p(x)=0.100, information: 3.322 bits

    ```

    ```


    Listing 21.3: Example output from calculating the information of a biased coin
    flip.


    We can also explore the information in a single roll of a fair six-sided dice,
    e.g. the information in rolling a 6. We know the probability of rolling any number
    is $\frac{1}{6}$, which is a smaller number than $\frac{1}{2}$ for a coin flip,
    therefore we would expect more surprise or a larger amount of information.


    ```

    ```python

    # calculate the information for a dice roll

    from math import log2

    # probability of the event

    ```

    ```'
