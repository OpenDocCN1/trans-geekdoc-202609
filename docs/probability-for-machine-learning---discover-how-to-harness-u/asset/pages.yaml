- pgno: 177
  md: '# 19.2 Challenge of Function Optimization


    Global function optimization, or function optimization for short, involves finding
    the minimum or maximum of an objective function. Samples are drawn from the domain
    and evaluated by the objective function to give a score or cost. Let’s define
    some common terms:


    +   - **Samples**. One example from the domain, represented as a vector.

    +   - **Search Space**: Extent of the domain from which samples can be drawn.

    +   - **Objective Function**. Function that takes a sample and returns a cost.

    +   - **Cost**. Numeric score for a sample calculated via the objective function.


    Samples are comprised of one or more variables generally easy to devise or create.
    One sample is often defined as a vector of variables with a predefined range in
    an n-dimensional space. This space must be sampled and explored in order to find
    the specific combination of variable values that result in the best cost. The
    cost often has units that are specific to a given domain. Optimization is often
    described in terms of minimizing cost, as a maximization problem can easily be
    transformed into a minimization problem by inverting the calculated cost. Together,
    the minimum and maximum of a function are referred to as the extremes of the function
    (or the plural extrema).


    The objective function is often easy to specify but can be computationally challenging
    to calculate or result in a noisy calculation of cost over time. The form of the
    objective function is unknown and is often highly nonlinear, and highly multi-dimensional
    defined by the number of input variables. The function is also probably non-convex.
    This means that local extrema may or may not be the global extrema (e.g. could
    be misleading and result in premature convergence), hence the name of the task
    as global rather than local optimization. Although little is known about the objective
    function, (it is known whether the minimum or the maximum cost from the function
    is sought), and as such, it is often referred to as a black box function and the
    search process as black box optimization. Further, the objective function is sometimes
    called an oracle given the ability to only give answers.


    Function optimization is a fundamental part of machine learning. Most machine
    learning algorithms involve the optimization of parameters (weights, coefficients,
    etc.) in response to training data. Optimization also refers to the process of
    finding the best set of hyperparameters that configure the training of a machine
    learning algorithm. Taking one step higher again, the selection of training data,
    data preparation, and machine learning algorithms themselves is also a problem
    of function optimization. Summary of optimization in machine learning:


    +   - **Algorithm Training**. Optimization of model parameters.

    +   - **Algorithm Tuning**. Optimization of model hyperparameters.

    +   - **Predictive Modeling**. Optimization of data, data preparation, and algorithm
    selection.


    Many methods exist for function optimization, such as randomly sampling the variable
    search space, called random search, or systematically evaluating samples in a
    grid across the search space, called grid search. More principled methods are
    able to learn from sampling the space so that future samples are directed toward
    the parts of the search space that are most likely to contain the extrema. A directed
    approach to global optimization that uses probability is called Bayesian Optimization.'
