- pgno: 138
  md: "The joint probability distribution can be restated as the multiplication of\
    \ the conditional probability for observing each example given the distribution\
    \ parameters. Multiplying many small probabilities together can be unstable; as\
    \ such, it is common to restate this problem as the sum of the natural log conditional\
    \ probability.\n\n$$\\sum_{i=1}^{n} \\log P(x_i; \\theta)$$ (15.3)\n\nGiven the\
    \ frequent use of log in the likelihood function, it is commonly referred to as\
    \ a log-likelihood function. The log-likelihood function for common predictive\
    \ modeling problems include the mean squared error for regression (e.g. linear\
    \ regression) and log loss (binary cross-entropy) for binary classification (e.g.\
    \ logistic regression). We will take a closer look at each of the three statistics,\
    \ AIC, BIC, and MDL, in the following sections.\n\n# 15.4 Akaike Information Criterion\n\
    \nThe Akaike Information Criterion, or AIC for short, is a method for scoring\
    \ and selecting a model. It is named for the developer of the method, Hirotugu\
    \ Akaike, and may be shown to have a basis in information theory and frequentist-based\
    \ inference.\n\n> This is derived from a frequentist framework, and cannot be\
    \ interpreted as an approximation to the marginal likelihood.\n> \n> — Page 162,\
    \ *Machine Learning: A Probabilistic Perspective*, 2012.\n\nThe AIC statistic\
    \ is defined generally for logistic regression as follows¹:\n\n$$AIC = -\\frac{2}{N}\
    \ \\times LL + 2 \\times \\frac{k}{N}$$ (15.4)\n\nWhere *N* is the number of examples\
    \ in the training dataset, *LL* is the log-likelihood of the model on the training\
    \ dataset, and *k* is the number of parameters in the model. The score, as defined\
    \ above, is minimized, e.g. the model with the lowest AIC is selected.\n\n> To\
    \ use AIC for model selection, we simply choose the model giving smallest AIC\
    \ over the set of models considered.\n> \n> — Page 231, *The Elements of Statistical\
    \ Learning*, 2016.\n\nCompared to the BIC method (below), the AIC statistic penalizes\
    \ complex models less, meaning that it may put more emphasis on model performance\
    \ on the training dataset, and, in turn, select more complex models.\n\n> We see\
    \ that the penalty for AIC is less than for BIC. This causes AIC to pick more\
    \ complex models.\n> \n> — Page 162, *Machine Learning: A Probabilistic Perspective*,\
    \ 2012."
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 15.5  Bayesian Information Criterion


    The Bayesian Information Criterion, or BIC for short, is a method for scoring
    and selecting a model. It is named for the field of study from which it was derived:
    Bayesian probability and inference. Like AIC, it is appropriate for models fit
    under the maximum likelihood estimation framework. The BIC statistic is calculated
    for logistic regression as follows²:


    $$BIC = -2 \times LL + \log(N) \times k \tag{15.5}$$


    Where $\log()$ has the base-e called the natural logarithm, $LL$ is the log-likelihood
    of the model, $N$ is the number of examples in the training dataset, and $k$ is
    the number of parameters in the model. The score as defined above is minimized,
    e.g. the model with the lowest BIC is selected. The quantity calculated is different
    from AIC, although can be shown to be proportional to the AIC. Unlike the AIC,
    the BIC penalizes the model more for its complexity, meaning that more complex
    models will have a worse (larger) score and will, in turn, be less likely to be
    selected.


    > > Note that, compared to AIC [...], this penalizes model complexity more heavily.

    > >

    > > — Page 217, *Pattern Recognition and Machine Learning*, 2006.


    Importantly, the derivation of BIC under the Bayesian probability framework means
    that if a selection of candidate models includes a true model for the dataset,
    then the probability that BIC will select the true model increases with the size
    of the training dataset. This cannot be said for the AIC score.


    > > ... given a family of models, including the true model, the probability that
    BIC will select the correct model approaches one as the sample size $N \to \infty$.

    > >

    > > — Page 235, *The Elements of Statistical Learning*, 2016.


    A downside of BIC is that for smaller, less representative training datasets,
    it is more likely to choose models that are too simple.


    # 15.6  Minimum Description Length


    The Minimum Description Length, or MDL for short, is a method for scoring and
    selecting a model. It is named for the field of study from which it was derived,
    namely information theory. Information theory is concerned with the representation
    and transmission of information on a noisy channel, and as such, measures quantities
    like entropy, which is the average number of bits required to represent an event
    from a random variable or probability distribution.


    From an information theory perspective, we may want to transmit both the predictions
    (or more precisely, their probability distributions) and the model used to generate
    them. Both the predicted target variable and the model can be described in terms
    of the number of bits required to transmit them on a noisy channel. The Minimum
    Description Length is the minimum number of bits, or the minimum of the sum of
    the number of bits required to represent the data and the model.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The Minimum Description Length (MDL) principle recommends choosing the hypothesis
    that minimizes the sum of these two description lengths.


    > — Page 173, *Machine Learning*, 1997.


    The MDL statistic is calculated as follows³:


    $$MDL = L(h) + L(D|h)$$ (15.6)


    Where $h$ is the model, $D$ is the predictions made by the model, $L(h)$ is the
    number of bits required to represent the model, and $L(D|h)$ is the number of
    bits required to represent the predictions from the model on the training dataset.
    The score as defined above is minimized, e.g. the model with the lowest MDL is
    selected. The number of bits required to encode $(D|h)$ and the number of bits
    required to encode $(h)$ can be calculated as the negative log-likelihood; for
    example⁴:


    $$MDL = -log(P(theta)) - log(P(y|X, theta))$$ (15.7)


    Or the negative log-likelihood of the model parameters ($\theta$) and the negative
    log-likelihood of the target values ($y$) given the input values ($X$) and the
    model parameters ($\theta$). This desire to minimize the encoding of the model
    and its predictions is related to the notion of Occam’s Razor that seeks the simplest
    (least complex) explanation: in this context, the least complex model that predicts
    the target variable.


    > The MDL principle takes the stance that the best theory for a body of data is
    one that minimizes the size of the theory plus the amount of information necessary
    to specify the exceptions relative to the theory ...


    > — Page 198, *Data Mining: Practical Machine Learning Tools and Techniques*,
    4th edition, 2016.


    The MDL calculation is very similar to BIC and can be shown to be equivalent in
    some situations.


    Hence the BIC criterion, derived as approximation to log-posterior probability,
    can also be viewed as a device for (approximate) model choice by minimum description
    length.


    > — Page 236, *The Elements of Statistical Learning*, 2016.


