  md: 'Our intuition leaps to the same conclusion. At least mine did. And this would
    be incorrect. For example, 1/2 for a boy as the second child being a boy. Another
    leap might be 1/4 for the case of boy-boy out of all possible cases of having
    two children. To find out why, again, let’s enumerate all possible combinations:


    | Younger Child | Older Child | Conditional Probability |

    |---|---|---|

    | Girl | Boy | 1/3 |

    | Boy | Boy | 1/3 (*) |

    | Boy | Girl | 1/3 |

    | Girl | Girl | 0 (impossible) |


    Listing 6.5: Example of combinations for boys and girls in case 2.


    Again, the intuition is that the additional information makes some cases impossible.
    There would be four outcomes, but the information given reduces the domain to
    three possible outcomes (one child is a boy). One of the three cases is boy-boy,
    therefore the probability 1/3 or about 33.33%. We have more information in Case
    1, which allows us to narrow down the domain of possible outcomes and give a result
    that matches our intuition. Case 2 looks very similar, but in fact, it includes
    less information. We have no idea as to whether the older or younger child is
    a boy, therefore the domain of possible outcomes is larger, resulting in a non-intuitive
    answer.


    These are both problems in conditional probability and we can solve them using
    the conditional probability formula, rather than enumerating examples.


    P(A|B) = P(A ∩ B) / P(B)   (6.4)


    The trick is in how the problem is stated. The outcomes that we are interested
    in are a sequence, not a single birth event. We are interested in a boy-boy outcome
    given some information. We can calculate the conditional probabilities using the
    table of unconditional probabilities listed above. In case 1, we know that the
    oldest child, or second part of the outcome, is a boy, therefore we can state
    the problem as follows:


    P(boy-boy | {boy-boy ∪ girl-boy})   (6.5)


    We can calculate the conditional probability as follows:


    = P(boy-boy ∩ {boy-boy ∪ girl-boy}) / P(boy-boy ∪ girl-boy)

    = P(boy-boy) / P(boy-boy ∪ girl-boy)

    = (1/4) / (1/4 + 1/4)   (6.6)

    = (1/4) / (2/4)

    = 0.25 / 0.5

    = 0.5


    Note the simplification of the numerator from P(boy-boy ∩ { boy-boy ∪ girl-boy
    }) to P(boy-boy). This is possible because the first event boy-boy is a subset
    of the second event'
