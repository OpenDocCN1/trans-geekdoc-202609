- pgno: 109
  md: "> The maximum likelihood estimator can readily be generalized to the case where\
    \ our goal is to estimate a conditional probability $P(y|x;\\theta)$ in order\
    \ to predict $y$ given $x$. This is actually the most common situation because\
    \ it forms the basis for most supervised learning.\n> \n> — Page 133, *Deep Learning*,\
    \ 2016.\n\nThis means that the same Maximum Likelihood Estimation framework that\
    \ is generally used for density estimation can be used to find a supervised learning\
    \ model and parameters. This provides the basis for foundational linear modeling\
    \ techniques, such as:\n\n+   - Linear Regression, for predicting a numerical\
    \ value.\n+   - Logistic Regression, for binary classification.\n\nIn the case\
    \ of linear regression, the model is constrained to a line and involves finding\
    \ a set of coefficients for the line that best fits the observed data. Fortunately,\
    \ this problem can be solved analytically (e.g. directly using linear algebra).\
    \ In the case of logistic regression, the model defines a line and involves finding\
    \ a set of coefficients for the line that best separates the classes. This cannot\
    \ be solved analytically and is often solved by searching the space of possible\
    \ coefficient values using an efficient optimization algorithm such as the BFGS\
    \ algorithm or variants.\n\nBoth methods can also be solved less efficiently using\
    \ a more general optimization algorithm such as stochastic gradient descent. In\
    \ fact, most machine learning models can be framed under the maximum likelihood\
    \ estimation framework, providing a useful and consistent way to approach predictive\
    \ modeling as an optimization problem. An important benefit of the maximum likelihood\
    \ estimator in machine learning is that as the size of the dataset increases,\
    \ the quality of the estimator continues to improve.\n\n# 11.5 Further Reading\n\
    \nThis section provides more resources on the topic if you are looking to go deeper.\n\
    \n# 11.5.1 Books\n\n+   - Chapter 5 Machine Learning Basics, *Deep Learning*,\
