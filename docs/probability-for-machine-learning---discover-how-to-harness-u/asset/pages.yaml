    We can then evaluate how well the density estimate matches our data by calculating
    the probabilities for a range of observations and comparing the shape to the histogram,
    just like we did for the parametric case in the prior section. The score_samples()
    function on the KernelDensity will calculate the log probability for an array
    of samples. We can create a range of samples from 1 to 60, about the range of
    our domain, calculate the log probabilities, then invert the log operation by
    calculating the exponent or exp() to return the values to the range 0-1 for normal
    probabilities.


    ```

    ...

    # sample probabilities for a range of outcomes

    values = asarray([value for value in range(1, 60)])

    values = values.reshape((len(values), 1))

    probabilities = model.score_samples(values)

    probabilities = exp(probabilities)

