- pgno: 135
  md: '# Chapter 15


    # Probabilistic Model Selection with AIC, BIC, and MDL


    Model selection is the problem of choosing one from among a set of candidate models.
    It is common to choose a model that performs the best on a hold-out test dataset
    or to estimate model performance using a resampling technique, such as k-fold
    cross-validation. An alternative approach to model selection involves using probabilistic
    statistical measures that attempt to quantify both the model performance on the
    training dataset and the complexity of the model. Examples include the Akaike
    and Bayesian Information Criterion and the Minimum Description Length. The benefit
    of these information criterion statistics is that they do not require a hold-out
    test set, although a limitation is that they do not take the uncertainty of the
    models into account and may end-up selecting models that are too simple. In this
    tutorial, you will discover probabilistic statistics for machine learning model
    selection. After reading this tutorial, you will know:


    +   - Model selection is the challenge of choosing one among a set of candidate
    models.

    +   - Akaike and Bayesian Information Criterion are two ways of scoring a model
    based on its log-likelihood and complexity.

    +   - Minimum Description Length provides another scoring method from information
    theory that can be shown to be equivalent to BIC.


    Let’s get started.


    # 15.1 Tutorial Overview


    This tutorial is divided into five parts; they are:


    +   1. The Challenge of Model Selection

    +   2. Probabilistic Model Selection

    +   3. Akaike Information Criterion

    +   4. Bayesian Information Criterion

    +   5. Minimum Description Length'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 15.2 The Challenge of Model Selection


    Model selection is the process of fitting multiple models on a given dataset and
    choosing one over all others.


    > > Model selection: estimating the performance of different models in order to
    choose the best one.

    > >

    > > — Page 222, *The Elements of Statistical Learning*, 2016.


    This may apply in unsupervised learning, e.g. choosing a clustering model, or
    supervised learning, e.g. choosing a predictive model for a regression or classification
    task. It may also be a sub-task of modeling, such as feature selection for a given
    model. There are many common approaches that may be used for model selection.
    For example, in the case of supervised learning, the three most common approaches
    are:


    +   - Train, Validation, and Test datasets.

    +   - Resampling Methods.

    +   - Probabilistic Statistics.


    The simplest reliable method of model selection involves fitting candidate models
    on a training set, tuning them on the validation dataset, and selecting a model
    that performs the best on the test dataset according to a chosen metric, such
    as accuracy or error. A problem with this approach is that it requires a lot of
    data. Resampling techniques attempt to achieve the same as the train/val/test
    approach to model selection, although using a small dataset. An example is *k*-fold
    cross-validation where a training set is split into many train/test pairs and
    a model is fit and evaluated on each. This is repeated for each model and a model
    is selected with the best average score across the *k*-folds. A problem with this
    and the prior approach is that only model performance is assessed, regardless
    of model complexity.


    A third approach to model selection attempts to combine the complexity of the
    model with the performance of the model into a score, then select the model that
    minimizes or maximizes the score. We can refer to this approach as statistical
    or probabilistic model selection as the scoring method uses a probabilistic framework.


    # 15.3 Probabilistic Model Selection


    Probabilistic model selection (or *information criteria*) provides an analytical
    technique for scoring and choosing among candidate models. Models are scored both
    on their performance on the training dataset and based on the complexity of the
    model.


    +   - **Model Performance.** How well a candidate model has performed on the training
    dataset.

    +   - **Model Complexity.** How complicated the trained candidate model is after
    training.


    Model performance may be evaluated using a probabilistic framework, such as log-likelihood
    under the framework of maximum likelihood estimation. Model complexity may be
    evaluated as the number of degrees of freedom or parameters in the model.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '> > Historically various ‘information criteria’ have been proposed that attempt
    to correct for the bias of maximum likelihood by the addition of a penalty term
    to compensate for the over-fitting of more complex models.

    > >

    > > — Page 33, *Pattern Recognition and Machine Learning*, 2006.


    A benefit of probabilistic model selection methods is that a test dataset is not
    required, meaning that all of the data can be used to fit the model, and the final
    model that will be used for prediction in the domain can be scored directly. A
    limitation of probabilistic model selection methods is that the same general statistic
    cannot be calculated across a range of different types of models. Instead, the
    metric must be carefully derived for each model.


    > > It should be noted that the AIC statistic is designed for preplanned comparisons
    between models (as opposed to comparisons of many models during automated searches).

    > >

    > > — Page 493, *Applied Predictive Modeling*, 2013.


    A further limitation of these selection methods is that they do not take the uncertainty
    of the model into account.


    > > Such criteria do not take account of the uncertainty in the model parameters,
    however, and in practice they tend to favour overly simple models.

    > >

    > > — Page 33, *Pattern Recognition and Machine Learning*, 2006.


    There are three statistical approaches to estimating how well a given model fits
    a dataset and how complex the model is. And each can be shown to be equivalent
    or proportional to each other, although each was derived from a different framing
    or field of study.


    They are:


    +   - Akaike Information Criterion (AIC). Derived from frequentist probability.

    +   - Bayesian Information Criterion (BIC). Derived from Bayesian probability.

    +   - Minimum Description Length (MDL). Derived from information theory.


    Each statistic can be calculated using the log-likelihood for a model and the
    data. Log-likelihood comes from Maximum Likelihood Estimation (introduced in Chapter
    11), a technique for finding or optimizing the parameters of a model in response
    to a training dataset. In Maximum Likelihood Estimation, we wish to maximize the
    conditional probability of observing the data ($X$) given a specific probability
    distribution and its parameters ($\theta$), stated formally as:


    $$P(X;\theta) \tag{15.1}$$


    Where $X$ is, in fact, the joint probability distribution of all observations
    from the problem domain from 1 to $n$.


    $$P(x_1,x_2,x_3,\ldots,x_n;\theta) \tag{15.2}$$'
