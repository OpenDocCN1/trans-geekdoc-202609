- pgno: 215
  md: "# 22.2 Statistical Distance\n\nThere are many situations where we may want\
    \ to compare two probability distributions. Specifically, we may have a single\
    \ random variable and two different probability distributions for the variable,\
    \ such as a true distribution and an approximation of that distribution. In situations\
    \ like this, it can be useful to quantify the difference between the distributions.\
    \ Generally, this is referred to as the problem of calculating the statistical\
    \ distance between two statistical objects, e.g. probability distributions. One\
    \ approach is to calculate a distance measure between the two distributions. This\
    \ can be challenging as it can be difficult to interpret the measure.\n\nInstead,\
    \ it is more common to calculate a divergence between two probability distributions.\
    \ A divergence is like a measure but is not symmetrical. This means that a divergence\
    \ is a scoring of how one distribution differs from another, where calculating\
    \ the divergence for distributions P and Q would give a different score from Q\
    \ and P. Divergence scores are an important foundation for many different calculations\
    \ in information theory and more generally in machine learning. For example, they\
    \ provide shortcuts for calculating scores such as mutual information (information\
    \ gain) and cross-entropy used as a loss function for classification models.\n\
    \nDivergence scores are also used directly as tools for understanding complex\
    \ modeling problems, such as approximating a target probability distribution when\
    \ optimizing generative adversarial network (GAN) models. Two commonly used divergence\
    \ scores from information theory are Kullback-Leibler Divergence and Jensen-Shannon\
    \ Divergence. We will take a closer look at both of these scores in the following\
    \ section.\n\n# 22.3 Kullback-Leibler Divergence\n\nThe Kullback-Leibler Divergence\
    \ score, or KL divergence score, quantifies how much one probability distribution\
    \ differs from another probability distribution. The KL divergence between two\
    \ distributions Q and P is often stated using the following notation:\n\n$$KL(P||Q)$$\n\
    (22.1)\n\nWhere the || operator indicates divergence or Ps divergence from Q.\
    \ KL divergence can be calculated as the negative sum of probability of each event\
    \ in P multiplied by the log of the probability of the event in Q over the probability\
    \ of the event in P.\n\n$$KL(P||Q) = - \\sum_{\\{x \\in X\\}} P(x) \\times \\\
    log\\left(\\frac{Q(x)}{P(x)}\\right)$$ \n(22.2)\n\nThe value within the sum is\
    \ the divergence for a given event. This is the same as the positive sum of probability\
    \ of each event in P multiplied by the log of the probability of the event in\
    \ P over the probability of the event in Q (e.g. the terms in the fraction are\
    \ flipped). This is the more common implementation used in practice.\n\n$$KL(P||Q)\
    \ = \\sum_{\\{x \\in X\\}} P(x) \\times \\log\\left(\\frac{P(x)}{Q(x)}\\right)$$\
    \ \n(22.3)\n\nThe intuition for the KL divergence score is that when the probability\
    \ for an event from P is large, but the probability for the same event in Q is\
    \ small, there is a large divergence. When the"
