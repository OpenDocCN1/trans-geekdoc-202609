- pgno: 13
  md: '# Welcome


    Welcome to *Probability for Machine Learning*. The field of probability is hundreds
    of years old and probabilistic methods are central to working through predictive
    modeling problems with machine learning. The simplest concepts when working with
    data come from the field of probability, such as the most likely value and the
    idea of a probability distribution over observations. Building on these simple
    ideas, probabilistic frameworks like maximum likelihood estimation underly a range
    of machine learning algorithms, from logistic regression to neural networks. I
    designed this book to teach you step-by-step the basics of probability with concrete
    and executable examples in Python.


    # Who Is This Book For?


    Before we get started, let’s make sure you are in the right place. This book is
    for developers that may know some applied machine learning. Maybe you know how
    to work through a predictive modeling problem end-to-end, or at least most of
    the main steps, with popular tools. The lessons in this book do assume a few things
    about you, such as:


    +   - You know your way around basic Python for programming.

    +   - You may know some basic NumPy for array manipulation.

    +   - You want to learn probability to deepen your understanding and application
    of machine learning.


    This guide was written in the top-down and results-first machine learning style
    that you’re used to from Machine Learning Mastery.


    # About Your Outcomes


    This book will teach you the basics of probability that you need to know as a
    machine learning practitioner. After reading and working through this book, you
    will know:


    +   - About the field of probability, how it relates to machine learning, and
    how to harness probabilistic thinking on a machine learning project.

    +   - How to calculate different types of probability, such as joint, marginal,
    and conditional probability.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   - How to consider data in terms of random variables and how to recognize
    and sample from common discrete and continuous probability distribution functions.

    +   - How to frame learning as maximum likelihood estimation and how this important
    probabilistic framework is used for regression, classification, and clustering
    machine learning algorithms.

    +   - How to use probabilistic methods to evaluate machine learning models directly
    without evaluating their performance on a test dataset.

    +   - How to calculate and consider probability from the Bayesian perspective
    and to calculate conditional probability with Bayes theorem for common scenarios.

    +   - How to use Bayes theorem for classification with Naive Bayes, optimization
    with Bayesian Optimization, and graphical models with Bayesian Networks.

    +   - How to quantify uncertainty using measures of information and entropy from
    the field of information theory and calculate quantities such as cross-entropy
    and mutual information.

    +   - How to develop and evaluate naive classifiers using a probabilistic framework.

    +   - How to evaluate classification models that predict probabilities and calibrate
    probability predictions.


    This new basic understanding of probability will impact your practice of machine
    learning in the following ways:


    +   - Confidently calculate and wield both frequentist probability (counts) and
    Bayesian probability (beliefs) generally and within the context of machine learning
    datasets.

    +   - Confidently select and use loss functions and performance measures when
    training machine learning algorithms, backed by a knowledge of the underlying
    probabilistic framework (e.g. maximum likelihood estimation) and the relationships
    between metrics (e.g. cross-entropy and negative log-likelihood).

    +   - Confidently evaluate classification predictive models, including establishing
    a robust baseline in performance, probabilistic performance measures, and calibrated
    predicted probabilities.


    This book is not a substitute for an undergraduate course in probability or a
    textbook for such a course, although it could complement such materials. For a
    good list of top courses, textbooks, and other resources on probability, see the
    *Further Reading* section at the end of each tutorial.


    # How to Read This Book


    This book was written to be read linearly, from start to finish. That being said,
    if you know the basics and need help with a specific technique or type of problem,
    then you can flip straight to that section and get started. This book was designed
    for you to read on your workstation,'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'on the screen, not on a tablet or eReader. My hope is that you have the book
    open right next to your editor and run the examples as you read about them. This
    book is not intended to be read passively or be placed in a folder as a reference
    text. It is a playbook, a workbook, and a guidebook intended for you to learn
    by doing and then applying your new understanding with working Python examples.
    To get the most out of the book, I would recommend playing with the examples in
    each tutorial. Extend them, break them, then fix them. Try some of the extensions
    presented at the end of each lesson and let me know how you do.


    # About the Book Structure


    This book was designed around major probabilistic techniques that are directly
    relevant to applied machine learning. There are a lot of things you could learn
    about probability, from theory to abstract concepts to APIs. My goal is to take
    you straight to developing an intuition for the elements you must understand with
    laser-focused tutorials. I designed the tutorials to focus on how to get things
    done with probability. They give you the tools to both rapidly understand and
    apply each technique or operation. Each tutorial is designed to take you about
    one hour to read through and complete, excluding the extensions and further reading.
    You can choose to work through the lessons one per day, one per week, or at your
    own pace. I think momentum is critically important, and this book is intended
    to be read and used, not to sit idle. I recommend picking a schedule and sticking
    to it. The tutorials are divided into seven parts; they are:


    +   - **Part 1: Foundations.** Discover a gentle introduction to the field of
    probability, the relationship to machine learning, and the importance that probability
    has when working through predictive modeling problems.

    +   - **Part 2: Basics.** Discover the different types of probability, such as
    marginal, joint, and conditional, and worked examples that develop an intuition
    for how to calculate each.

    +   - **Part 3: Distributions.** Discover that probability distributions summarize
    the likelihood of events and common distribution functions for discrete and continuous
    random variables.

    +   - **Part 4: Maximum Likelihood.** Discover the maximum likelihood estimation
    probabilistic framework that underlies how the parameters of many machine learning
    algorithms are fit on training data.

    +   - **Part 5: Bayesian Probability.** Discover Bayes theorem and some of the
    most important uses in applied machine learning, such as the naive Bayes algorithm
    and Bayesian optimization.

    +   - **Part 6: Information Theory.** Discover the relationship between probability
    and information theory and some of the most important concepts to applied machine
    learning, such as cross-entropy and information gain.

    +   - **Part 7: Classification.** Discover the relationship between classification
    and probability, including models that predict probabilities for class labels,
    evaluation metrics, and probability calibration.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Each part targets a specific learning outcome, and so does each tutorial within
    each part. This acts as a filter to ensure you are only focused on the things
    you need to know to get to a specific result and do not get bogged down in the
    math or near-infinite number of digressions. The tutorials were not designed to
    teach you everything there is to know about each of the theories or techniques
    of probability. They were designed to give you an understanding of how they work,
    how to use them, and how to interpret the results the fastest way I know how:
    to learn by doing.


    # About Python Code Examples


    The code examples were carefully designed to demonstrate the purpose of a given
    lesson. Code examples are complete and standalone. The code for each lesson will
    run as-is with no code from prior lessons or third-parties needed beyond the installation
    of the required packages. A complete working example is presented with each tutorial
    for you to inspect and copy-and-paste. All source code is also provided with the
    book, and I would recommend running the provided files whenever possible to avoid
    any copy-paste issues. The provided code was developed in a text editor and is
    intended to be run on the command line. No special IDE or notebooks are required.
    If you are using a more advanced development environment and are having trouble,
    try running the example from the command line instead. All code examples were
    tested on a POSIX-compatible machine with Python 3.


    # About Further Reading


    Each lesson includes a list of further reading resources. This may include:


    +   - Research papers.

    +   - Books and book chapters.

    +   - Web Pages and Articles.

    +   - API documentation.


    Wherever possible, I tried to list and link to the relevant API documentation
    for key objects and functions used in each lesson so you can learn more about
    them. I have tried to link to books on Amazon. I don’t know everything, and if
    you discover a good resource related to a given lesson, please let me know so
    I can update the book.


    # About Getting Help


    You might need help along the way. Don’t worry; you are not alone.


    +   - **Help with a Technique?** If you need help with the technical aspects of
    a specific operation or technique, see the *Further Reading* section at the end
    of each tutorial.'
  merge: -1
