    Now that we have a test problem, let’s review how to train a surrogate function.


    # 19.4.2 Surrogate Function


    The surrogate function is a technique used to best approximate the mapping of
    input examples to an output score. Probabilistically, it summarizes the conditional
    probability of an objective function (f), given the available data (D) or P(f|D).
    A number of techniques can be used for this, although the most popular is to treat
    the problem as a regression predictive modeling problem with the data representing
    the input and the score representing the output to the model. This is often best
    modeled using a random forest or a Gaussian Process. A Gaussian Process, or GP,
    is a model that constructs a joint probability distribution over the variables,
    assuming a multivariate Gaussian distribution. As such, it is capable of efficient
    and effective summarization of a large number of functions and smooth transition
    as more observations are made available to the model.


    This smooth structure and smooth transition to new functions based on data are
    desirable properties as we sample the domain, and the multivariate Gaussian basis
    to the model means that an estimate from the model will be a mean of a distribution
    with a standard deviation; that will be helpful later in the acquisition function.
    As such, using a GP regression model is often preferred.'
