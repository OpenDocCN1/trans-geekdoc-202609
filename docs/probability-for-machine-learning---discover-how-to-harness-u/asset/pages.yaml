- pgno: 157
  md: '# Chapter 17


    # Bayes Theorem and Machine Learning


    Machine learning can be understood using Bayes Theorem as selecting a model that
    best describes the observed data. This perspective provides the basis for the
    Maximum a Posteriori or MAP probabilistic framework that can be shown to underlie
    many machine learning models such as linear regression and logistic regression.
    This framing of machine learning also gives rise to the notion of how to make
    optimal predictions for a new example using a Bayes Optimal Classifier, that in
    turn exposes Bayes Error, the minimum error expected when making predictions on
    a dataset. In this tutorial, you will discover a Bayesian perspective of machine
    learning modeling and prediction.


    +   - How selecting a machine learning model can be framed as solving Bayes Theorem.

    +   - How the Maximum a Posteriori probabilistic framework can be used to optimize
    a model for a dataset.

    +   - How the Bayes Optimal Classifier defines the best possible prediction that
    can be made for a set of models on a dataset.


    Let’s get started.


    # 17.1 Tutorial Overview


    This tutorial is divided into five parts; they are:


    +   1. Bayes Theorem of Modeling Hypotheses

    +   2. Density Estimation

    +   3. Maximum a Posteriori

    +   4. MAP and Machine Learning

    +   5. Bayes Optimal Classifier'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# 17.2 Bayes Theorem of Modeling Hypotheses\n\nBayes Theorem is a useful tool\
    \ in applied machine learning. It provides a way of thinking about the relationship\
    \ between data and a model. A machine learning algorithm or model is a specific\
    \ way of thinking about the structured relationships in the data. In this way,\
    \ a model can be thought of as a hypothesis about the relationships in the data,\
    \ such as the relationship between input (X) and output (y). The practice of applied\
    \ machine learning is the testing and analysis of different hypotheses (models)\
    \ on a given dataset. Bayes Theorem provides a probabilistic model to describe\
    \ the proportional relationship between data (D) and a hypothesis (H); for example:\n\
    \n$$P(h|D) = \\frac{P(D|h) \\times P(h)}{P(D)}$$ (17.1)\n\nBreaking this down,\
    \ it says that the probability of a given hypothesis holding or being true given\
    \ some observed data can be calculated as the probability of observing the data\
    \ given the hypothesis multiplied by the probability of the hypothesis being true\
    \ regardless of the data, divided by the probability of observing the data regardless\
    \ of the hypothesis.\n\n> Bayes theorem provides a way to calculate the probability\
    \ of a hypothesis based on its prior probability, the probabilities of observing\
    \ various data given the hypothesis, and the observed data itself.\n> \n> — Page\
    \ 156, Machine Learning, 1997.\n\nUnder this framework, each piece of the calculation\
    \ has a specific name; for example:\n\n+   - P(h|D): Posterior probability of\
    \ the hypothesis (the thing we want to calculate).\n+   - P(h): Prior probability\
    \ of the hypothesis.\n\nThis gives a useful framework for thinking about and modeling\
    \ a machine learning problem. If we have some prior domain knowledge about the\
    \ hypothesis, this is captured in the prior probability. If we don’t, then all\
    \ hypotheses may have the same prior probability. If the probability of observing\
    \ the data P(D) increases, then the probability of the hypothesis holding given\
    \ the data P(h|D) decreases. Conversely, if the probability of the hypothesis\
    \ P(h) and the probability of observing the data given the hypothesis increases,\
    \ the probability of the hypothesis holding given the data P(h|D) increases.\n\
    \nThe notion of testing different models on a dataset in applied machine learning\
    \ can be thought of as estimating the probability of each hypothesis (h1, h2,\
    \ h3, … , ∈ H) being true given the observed data. Under this framework, the probability\
    \ of the data (D) is constant as it is used in the assessment of each hypothesis.\
    \ Therefore, it can be removed from the calculation to give the simplified unnormalized\
    \ estimate as follows:\n\n$$\\max_{h \\in H} P(h|D) = P(D|h) \\times P(h)$$ (17.2)\n\
    \nIf we do not have any prior information about the hypothesis being tested, they\
    \ can be assigned a uniform probability, and this term too will be a constant\
    \ and can be removed from the calculation to give the following:\n\n$$\\max_{h\
    \ \\in H} P(h|D) = P(D|h)$$ (17.3)"
