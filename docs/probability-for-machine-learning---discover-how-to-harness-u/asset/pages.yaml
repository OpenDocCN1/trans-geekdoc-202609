- pgno: 233
  md: "# 23.5.1 Calculate Entropy for Class Labels\n\nRecall that when two distributions\
    \ are identical, the cross-entropy between them is equal to the entropy for the\
    \ probability distribution. Class labels are encoded using the values 0 and 1\
    \ when preparing data for classification tasks. For example, if a classification\
    \ problem has three classes, and an example has a label for the first class, then\
    \ the probability distribution will be [1, 0, 0]. If an example has a label for\
    \ the second class, it will have a probability distribution for the two events\
    \ as [0, 1, 0]. This is called a one hot encoding.\n\nThis probability distribution\
    \ has no information as the outcome is certain. We know the class. Therefore the\
    \ entropy for this variable is zero. This is an important concept and we can demonstrate\
    \ it with a worked example. Pretend with have a classification problem with 3\
    \ classes, and we have one example that belongs to each class. We can represent\
    \ each example as a discrete probability distribution with a 1.0 probability for\
    \ the class to which the example belongs and a 0.0 probability for all other classes.\
    \ We can calculate the entropy of the probability distribution for each variable\
    \ across the events. The complete example is listed below.\n\n```\n# entropy of\
    \ examples from a classification task with 3 classes\nfrom math import log2\n\
    from numpy import asarray\n\n# calculate entropy\ndef entropy(p):\n    return\
    \ -sum([p[i] * log2(p[i]) for i in range(len(p))])\n\n# class 1\np = asarray([1,0,0])\
    \ + 1e-15\nprint(entropy(p))\n# class 2\np = asarray([0,1,0]) + 1e-15\nprint(entropy(p))\n\
    # class 3\np = asarray([0,0,1]) + 1e-15\nprint(entropy(p))\n```\n\nListing 23.14:\
    \ Example of calculating the entropy of class labels.\n\nRunning the example calculates\
    \ the entropy for each random variable. We can see that in each case, the entropy\
    \ is 0.0 (actually a number very close to zero). Note that we had to add a very\
    \ small value to the 0.0 values to avoid the log() from blowing up, as we cannot\
    \ calculate the log of 0.0.\n\n```\n9.805612959471341e-14\n9.805612959471341e-14\n\
    9.805612959471341e-14\n```\n\nListing 23.15: Example output from calculating the\
    \ entropy of class labels.\n\nAs such, the entropy of a known class label is always\
    \ 0.0. This means that the cross entropy of two distributions (real and predicted)\
    \ that have the same probability distribution for a class label, will also always\
    \ be 0.0. Recall that when evaluating a model using cross-entropy on a training\
    \ dataset that we average the cross-entropy across all examples in the dataset.\
    \ Therefore, a cross-entropy of 0.0 when training a model indicates that the predicted\
    \ class probabilities are identical to the probabilities in the training dataset,\
    \ e.g. zero loss."
  merge: -1
  img_proc: true
- pgno: 234
  md: "We could just as easily minimize the KL divergence as a loss function instead\
    \ of the cross-entropy. Recall that the KL divergence is the extra bits required\
    \ to transmit one variable compared to another. It is the cross-entropy without\
    \ the entropy of the class label, which we know would be zero anyway. As such,\
    \ minimizing the KL divergence and the cross entropy for a classification task\
    \ are identical. In practice, a cross-entropy loss of 0.0 often indicates that\
    \ the model has overfit the training dataset, but that is another story.\n\n#\
    \ 23.5.2 Cross-Entropy Between Class Labels and Probabilities\n\nThe use of cross-entropy\
    \ for classification often gives different specific names based on the number\
    \ of classes, mirroring the name of the classification task; for example:\n\n\
    +   - **Binary Cross-Entropy:** Cross-entropy as a loss function for a binary\
    \ classification task.\n+   - **Categorical Cross-Entropy:** Cross-entropy as\
    \ a loss function for a multiclass classification task.\n\nWe can make the use\
    \ of cross-entropy as a loss function concrete with a worked example. Consider\
    \ a binary classification task with the following 10 actual class labels (*P*)\
