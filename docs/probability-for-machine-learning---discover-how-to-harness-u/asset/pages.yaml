  md: 'Or


    $$\text{odds} = exp(\beta_0 + \beta_1 \times x_1 + \beta_2 \times x_2 + \cdots
    + \beta_m \times x_m)\tag{13.11}$$


    The odds of success can be converted back into a probability of success as follows:


    $$p = \frac{odds}{odds + 1}\tag{13.12}$$


    And this is close to the form of our logistic regression model, except we want
    to convert log-odds to odds as part of the calculation. We can do this and simplify
    the calculation as follows:


    $$p = \frac{1}{1 + exp(-\log\text{-odds})}\tag{13.13}$$


    This shows how we go from log-odds to odds, to a probability of class 1 with the
    logistic regression model, and that this final functional form matches the logistic
    function, ensuring that the probability is between 0 and 1. We can make these
    calculations of converting between probability, odds and log-odds concrete with
    some small examples in Python. First, let’s define the probability of success
    at 80%, or 0.8, and convert it to odds then back to a probability again. The complete
    example is listed below.


    ```

    # example of converting between probability and odds

    # define our probability of success

    prob = 0.8

    print(''Probability %.1f'' % prob)

    # convert probability to odds

    odds = prob / (1 - prob)

    print(''Odds %.1f'' % odds)

    # convert back to probability

    prob = odds / (odds + 1)

    print(''Probability %.1f'' % prob)

    ```


    Listing 13.1: Example of converting between probability and odds.


    Running the example shows that 0.8 is converted to the odds of success 4, and
    back to the correct probability again.


    ```

