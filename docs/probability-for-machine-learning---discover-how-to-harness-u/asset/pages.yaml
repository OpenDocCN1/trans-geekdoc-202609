  md: "# 4.4.2　Exclusivity\n\nIf the occurrence of one event excludes the occurrence\
    \ of other events, then the events are said to be mutually exclusive. The probability\
    \ of the events are said to be disjoint, meaning that they cannot interact, are\
    \ strictly independent. If the probability of event *A* is mutually exclusive\
    \ with event *B*, then the joint probability of event *A* and event *B* is zero.\n\
    \n$P(A \\cap B) = 0.0$　　　　　　　　　　　　　　　　　　　(4.18)\n\nInstead, the probability of\
    \ an outcome can be described as event *A* or event *B*, stated formally as follows:\n\
    \n$P(A \\text{ or } B) = P(A) + P(B)$　　　　　　　　　　　　　　　(4.19)\n\nThe *or* is also\
    \ called a union and is denoted as a capital *U* letter (∪); for example:\n\n\
    $P(A \\text{ or } B) = P(A \\cup B)$　　　　　　　　　　　　　　　(4.20)\n\nIf the events are\
    \ not mutually exclusive, we may be interested in the outcome of either event.\
    \ The probability of non-mutually exclusive events is calculated as the probability\
    \ of event *A* and the probability of event *B* minus the probability of both\
    \ events occurring simultaneously. This can be stated formally as follows:\n\n\
