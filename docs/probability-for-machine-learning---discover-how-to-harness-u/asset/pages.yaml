  md: "This can be stated formally as follows:\n\n$$I(X;Y) = KL(p(X,Y)\\|p(X) \\times\
    \ p(Y)) \\tag{24.7}$$\n\nMutual information is always larger than or equal to\
    \ zero, where the larger the value, the greater the relationship between the two\
    \ variables. If the calculated result is zero, then the variables are independent.\
    \ Mutual information is often used as a general form of a correlation coefficient,\
    \ e.g. a measure of the dependence between random variables. It is also used as\
    \ an aspect in some machine learning algorithms. A common example is the Independent\
    \ Component Analysis, or ICA for short, that provides a projection of statistically\
    \ independent components of a dataset.\n\n# ## 24.6 How Are Information Gain and\
    \ Mutual Information Related?\n\nMutual Information and Information Gain are the\
    \ same thing, although the context or usage of the measure often gives rise to\
    \ the different names. For example:\n\n+   - Effect of Transforms to a Dataset\
    \ (*decision trees*): Information Gain.\n+   - Dependence Between Variables (*feature\
    \ selection*): Mutual Information.\n\nNotice the similarity in the way that the\
    \ mutual information is calculated and the way that information gain is calculated;\
    \ they are equivalent:\n\n$$I(X;Y) = H(X) - H(X|Y) \\tag{24.8}$$\n\nand\n\n$$IG(S,a)\
    \ = H(S) - H(S|a) \\tag{24.9}$$\n\nAs such, mutual information is sometimes used\
    \ as a synonym for information gain. Technically, they calculate the same quantity\
    \ if applied to the same data. We can understand the relationship between the\
    \ two as the more the difference in the joint and marginal probability distributions\
    \ (mutual information), the larger the gain in information (information gain).\n\
    \n# ## 24.7 Further Reading\n\nThis section provides more resources on the topic\
    \ if you are looking to go deeper.\n\n# ### 24.7.1 Books\n\n+   - *Information\
