    # 25.2 Naive Classifier


    Classification predictive modeling problems involve predicting a class label given
    an input to the model. Classification models are fit on a training dataset and
    evaluated on a test dataset, and performance is often reported as a fraction of
    the number of correct predictions compared to the total number of predictions
    made, called accuracy. Given a classification model, how do you know if the model
    has skill or not? This is a common question on every classification predictive
    modeling project. The answer is to compare the results of a given classifier model
    to a baseline or naive classifier model.


    A naive classifier model is one that does not use any sophistication in order
    to make a prediction, typically making a random or constant prediction. Such models
    are naive because they don’t use any knowledge about the domain or any learning
    in order to make a prediction. The performance of a baseline classifier on a classification
    task provides a lower bound on the expected performance of all other models on
    the problem. For example, if a classification model performs better than a naive
    classifier, then it has some skill. If a classifier model performs worse than
    the naive classifier, it does not have any skill. What classifier should be used
    as the naive classifier? This is a common area of confusion for beginners, and
    different naive classifiers are adopted. Some common choices include:


    +   - Predict a random class.

    +   - Predict a randomly selected class from the training dataset.

    +   - Predict the majority class from the training dataset.


    The problem is, not all naive classifiers are created equal, and some perform
    better than others. As such, we should use the best-performing naive classifier
    on all of our classification predictive modeling projects. We can use simple probability
    to evaluate the performance of different naive classifier models and confirm the
    one strategy that should always be used as the native classifier. Before we start
    evaluating different strategies, let’s define a contrived two-class classification
    problem. To make it interesting, we will assume that the number of observations
    is not equal for each class (e.g. the problem is imbalanced) with 25 examples
    for class-0 and 75 examples for class-1. We can make this concrete with a small
    example in Python, listed below.


    ```

    # summarize a test dataset

    # define dataset

    class0 = [0 for _ in range(25)]

    class1 = [1 for _ in range(75)]

    y = class0 + class1

    # summarize distribution

    print(''Class 0: %.3f'' % (len(class0) / len(y) * 100))

    print(''Class 1: %.3f'' % (len(class1) / len(y) * 100))

    ```


    Listing 25.1: Example of defining and summarizing a test dataset.'
