- pgno: 310
  md: '# C.3.5 Logarithms and *e*


    When we raise 10 to an integer exponent we often call this an order of magnitude.


    $10^2 = 10 \times 10$ (C.11)


    Another way to reverse this operation is by calculating the logarithm of the result
    100 assuming a base of 10, in notation this is written as $\log10()$.


    $\log10(100) = 2$ (C.12)


    Here, we know the result and the base and wish to find the exponent. This allows
    us to move up and down orders of magnitude very easily. Taking the logarithm assuming
    the base of 2 is also commonly used, given the use of binary arithmetic used in
    computers. For example:


    $2^6 = 64$ (C.13)


    $\log2(64) = 6$ (C.14)


    Another popular logarithm is to assume the natural base called *e*. The *e* is
    reserved and is a special number or a constant called Euler’s number (pronounced
    *oy-ler*) that refers to a value with practically infinite precision.


    $e = 2.71828\cdots$ (C.15)


    Raising *e* to a power is called a natural exponential function:


    $e^2 = 7.38905\cdots$ (C.16)


    It can be inverted using the natural logarithm which is denoted as $\ln()$:


    $\ln(7.38905\cdots) = 2$ (C.17)


    Without going into detail, the natural exponent and natural logarithm prove useful
    throughout mathematics to abstractly describe the continuous growth of some systems,
    e.g. systems that grow exponentially such as compound interest.


    # C.4 Greek Alphabet


    Greek letters are used throughout mathematical notation for variables, constants,
    functions and more. For example in statistics we talk about the mean using the
    lowercase Greek letter mu ($\mu$), and the standard deviation as the lowercase
    Greek letter sigma ($\sigma$). In linear regression we talk about the coefficients
    as the lowercase letter beta ($\beta$). And so on. It is useful to know all of
    the uppercase and lowercase Greek letters and how to pronounce them. When I was
    a grad student, I printed the Greek alphabet and stuck it on my computer monitor
    so that I could memorize it. A useful trick! Below is the full Greek alphabet.'
