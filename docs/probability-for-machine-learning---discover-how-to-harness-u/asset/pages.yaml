  md: 'alarm rate as it summarizes how often a positive class is predicted when the
    actual outcome is negative.


    False Positive Rate = \frac{\text{False Positives}}{\text{False Positives} + \text{True
    Negatives}} \quad (27.3)


    The false positive rate is also referred to as the inverted specificity where
    specificity is the total number of true negatives divided by the sum of the number
    of true negatives and false positives.


    Specificity = \frac{\text{True Negatives}}{\text{True Negatives} + \text{False
    Positives}} \quad (27.4)


    Where:


    False Positive Rate = 1 − Specificity \quad (27.5)


    The ROC curve is a useful tool for a few reasons:


    +   - The curves of different models can be compared directly in general or for
    different thresholds.

    +   - The area under the curve (AUC) can be used as a summary of the model skill.


    The shape of the curve contains a lot of information, including what we might
    care about most for a problem, the expected false positive rate, and the false
    negative rate. To make this clear:


    +   - Smaller values on the x-axis of the plot indicate lower false positives
    and higher true negatives.

    +   - Larger values on the y-axis of the plot indicate higher true positives and
    lower false negatives.


    If you are confused, remember, when we predict a binary outcome, it is either
    a correct prediction (true positive) or not (false positive). There is a tension
    between these options, the same with true negative and false negative. A skillful
    model will assign a higher probability to a randomly chosen real positive occurrence
    than a negative occurrence on average. This is what we mean when we say that the
    model has skill. Generally, skillful models are represented by curves that bow
    up to the top left of the plot.


    A model with no skill is represented at the point (0.5, 0.5). A model with no
    skill at each threshold is represented by a diagonal line from the bottom left
    of the plot to the top right and has an AUC of 0.5. A model with perfect skill
    is represented at a point (0,1). A model with perfect skill is represented by
    a line that travels from the bottom left of the plot to the top left and then
    across the top to the top right. An operator may plot the ROC curve for the final
    model and choose a threshold that gives a desirable balance between the false
    positives and false negatives.'
