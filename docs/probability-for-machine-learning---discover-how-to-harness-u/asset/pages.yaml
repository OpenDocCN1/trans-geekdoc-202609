- pgno: 216
  md: 'probability from P is small and the probability from Q is large, there is also
    a large divergence, but not as large as the first case. It can be used to measure
    the divergence between discrete or continuous probability distributions, where
    in the latter case the integral of the events is calculated instead of the sum
    of the probabilities of the discrete events.


    One way to measure the dissimilarity of two probability distributions, p and q,
    is known as the Kullback-Leibler divergence (KL divergence) or relative entropy.


    > — Page 57, *Machine Learning: A Probabilistic Perspective*, 2012.


    The log can be base-2 to give units in *bits*, or the natural logarithm base-e
    with units in *nats*. When the score is 0, it suggests that both distributions
    are identical, otherwise the score is positive. Importantly, the KL divergence
    score is not symmetrical, for example:


    KL(P||Q) ≠ KL(Q||P) (22.4)


    It is named for the two authors of the method Solomon Kullback and Richard Leibler,
    and is sometimes referred to as *relative entropy*.


    This is known as the relative entropy or Kullback-Leibler divergence, or KL divergence,
    between the distributions p(x) and q(x).


    > — Page 55, *Pattern Recognition and Machine Learning*, 2006.


    If we are attempting to approximate an unknown probability distribution, then
    the target probability distribution from data is P and Q is our approximation
    of the distribution. In this case, the KL divergence summarizes the number of
    additional bits (i.e. calculated with the base-2 logarithm) required to represent
    an event from the random variable. The better our approximation, the less additional
    information is required.


    ... the KL divergence is the average number of extra bits needed to encode the
    data, due to the fact that we used distribution q to encode the data instead of
    the true distribution p.


    > — Page 58, *Machine Learning: A Probabilistic Perspective*, 2012.


    We can make the KL divergence concrete with a worked example. Consider a random
    variable with three events as different colors. We may have two different probability
    distributions for this variable; for example:


    ```

    ...

    # define distributions

    events = [''red'', ''green'', ''blue'']

    p = [0.10, 0.40, 0.50]

    q = [0.80, 0.15, 0.05]

    ```


    Listing 22.1: Example of defining probability distributions.


    We can plot a bar chart of these probabilities to compare them directly as probability
    histograms. The complete example is listed below.'
