  md: '# Chapter 7


    # Probability Distributions


    Probability can be used for more than calculating the likelihood of one event;
    it can summarize the likelihood of all possible outcomes. A thing of interest
    in probability is called a random variable, and the relationship between each
    possible outcome for a random variable and their probabilities is called a probability
    distribution. Probability distributions are an important foundational concept
    in probability and the names and shapes of common probability distributions will
    be familiar. The structure and type of the probability distribution varies based
    on the properties of the random variable, such as continuous or discrete, and
    this, in turn, impacts how the distribution might be summarized or how to calculate
    the most likely outcome and its probability. In this tutorial, you will discover
    a gentle introduction to probability distributions. After reading this tutorial,
    you will know:


    +   - Random variables in probability have a defined domain and can be continuous
    or discrete.

    +   - Probability distributions summarize the relationship between possible values
    and their probability for a random variable.

    +   - Probability density or mass functions map values to probabilities and cumulative
    distribution functions map outcomes less than or equal to a value to a probability.


    Let’s get started.


    # 7.1 Tutorial Overview


    This tutorial is divided into four parts; they are:


    +   1. Random Variables

    +   2. Probability Distribution

    +   3. Discrete Probability Distributions

    +   4. Continuous Probability Distributions'
