  md: "# 22.3. Kullback-Leibler Divergence\n\nNext, we can develop a function to calculate\
    \ the KL divergence between the two distributions. We will use log base-2 to ensure\
    \ the result has units in bits.\n\n```\n```python\n# calculate the kl divergence\n\
    def kl_divergence(p, q):\n    return sum(p[i] * log2(p[i]/q[i]) for i in range(len(p)))\n\
    ```\n```\n\nListing 22.3: Example of defining a function for calculating the KL\
    \ divergence.\n\nWe can then use this function to calculate the KL divergence\
    \ of *P* from *Q*, as well as the reverse, *Q* from *P*.\n\n```\n```python\n#\
    \ calculate (P || Q)\nkl_pq = kl_divergence(p, q)\nprint('KL(P || Q): %.3f bits'\
    \ % kl_pq)\n# calculate (Q || P)\nkl_qp = kl_divergence(q, p)\nprint('KL(Q ||\
    \ P): %.3f bits' % kl_qp)\n```\n```\n\nListing 22.4: Example of calculating the\
    \ KL divergence.\n\nTying this all together, the complete example is listed below.\n\
    \n```\n```python\n# example of calculating the kl divergence between two probability\
    \ mass functions\nfrom math import log2\n\n# calculate the kl divergence\ndef\
    \ kl_divergence(p, q):\n    return sum(p[i] * log2(p[i]/q[i]) for i in range(len(p)))\n\
    \n# define distributions\np = [0.10, 0.40, 0.50]\nq = [0.80, 0.15, 0.05]\n# calculate\
    \ (P || Q)\nkl_pq = kl_divergence(p, q)\nprint('KL(P || Q): %.3f bits' % kl_pq)\n\
    # calculate (Q || P)\nkl_qp = kl_divergence(q, p)\nprint('KL(Q || P): %.3f bits'\
    \ % kl_qp)\n```\n```\n\nListing 22.5: Example of calculating the KL divergence\
    \ between two probability distributions.\n\nRunning the example first calculates\
    \ the divergence of *P* from *Q* as just under 2 bits, then *Q* from *P* as just\
    \ over 2 bits. This is intuitive if we consider *P* has large probabilities when\
    \ *Q* is small, giving *P* less divergence than *Q* from *P* as *Q* has more small\
    \ probabilities when *P* has large probabilities. There is more divergence in\
    \ this second case.\n\n```\n```text\nKL(P || Q): 1.927 bits\nKL(Q || P): 2.022\
    \ bits\n```\n```\n\nListing 22.6: Example output from calculating the KL divergence\
    \ between two probability distributions in bits.\n\nIf we change `log2()` to the\
    \ natural logarithm `log()` function, the result is in nats, as follows:\n\n```\n\
    ```text\n# KL(P || Q): 1.336 nats\n# KL(Q || P): 1.401 nats\n```\n```\n\nListing\
    \ 22.7: Example output from calculating the KL divergence between two probability\
    \ distributions in nats."
