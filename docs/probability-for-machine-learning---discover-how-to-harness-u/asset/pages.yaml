    # 26.3  Brier Score


    The Brier score, named for Glenn Brier, calculates the mean squared error between
    predicted probabilities and the expected values. The score summarizes the magnitude
    of the error in the probability predictions. The error score is always between
    0.0 and 1.0, where a model with perfect skill has a score of 0.0. Predictions
    that are further away from the expected probability are penalized, but less severely
    as in the case of log loss. The skill of a model can be summarized as the average
    Brier score across all probabilities predicted for a test dataset.


    The Brier score can be calculated in Python using the `brier_score_loss()` function
    in scikit-learn. It takes the true class values (0, 1) and the predicted probabilities
    for all examples in a test dataset as arguments and returns the average Brier
    score. We can evaluate the impact of prediction errors by comparing the Brier
    score for single probability predictions in increasing error from 0.0 to 1.0.
    The complete example is listed below.


    ```

    ```python

    # plot impact of brier for single forecasts

    from sklearn.metrics import brier_score_loss

    from matplotlib import pyplot

    ```

    ```'
