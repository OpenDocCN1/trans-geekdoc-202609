- pgno: 105
  md: '# Chapter 11


    # Maximum Likelihood Estimation


    Density estimation is the problem of estimating the probability distribution for
    a sample of observations from a problem domain. There are many techniques for
    solving density estimation, although a common framework used throughout the field
    of machine learning is maximum likelihood estimation. Maximum likelihood estimation
    involves defining a likelihood function for calculating the conditional probability
    of observing the data sample given a probability distribution and distribution
    parameters. This approach can be used to search a space of possible distributions
    and parameters. This flexible probabilistic framework also provides the foundation
    for many machine learning algorithms, including important methods such as linear
    regression and logistic regression for predicting numeric values and class labels
    respectively, but also more generally for deep learning artificial neural networks.
    In this tutorial, you will discover a gentle introduction to maximum likelihood
    estimation. After reading this tutorial, you will know:


    +   - Maximum Likelihood Estimation is a probabilistic framework for solving the
    problem of density estimation.

    +   - It involves maximizing a likelihood function in order to find the probability
    distribution and parameters that best explain the observed data.

    +   - It provides a framework for predictive modeling in machine learning where
    finding model parameters can be framed as an optimization problem.


    Let’s get started.


    # 11.1 Tutorial Overview


    This tutorial is divided into three parts; they are:


    +   1. Problem of Probability Density Estimation

    +   2. Maximum Likelihood Estimation

    +   3. Relationship to Machine Learning'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 11.2 Problem of Probability Density Estimation


    A common modeling problem involves how to estimate a joint probability distribution
    for a dataset. For example, given a sample of observation (X) from a domain (x₁,
    x₂, x₃, ⋯ , xₙ), where each observation is drawn independently from the domain
    with the same probability distribution (so-called independent and identically
    distributed, i.i.d., or close to it). Density estimation involves selecting a
    probability distribution function and the parameters of that distribution that
    best explain the joint probability distribution of the observed data (X).


    +   - How do you choose the probability distribution function?

    +   - How do you choose the parameters for the probability distribution function?


    This problem is made more challenging if the sample (X) drawn from the population
    is small and has noise, meaning that any evaluation of an estimated probability
    density function and its parameters will have some error. There are many techniques
    for solving this problem, although two common approaches are:


    +   - Maximum a Posteriori (MAP), a Bayesian method.

    +   - Maximum Likelihood Estimation (MLE), frequentist method.


    The main difference is that MLE assumes that all solutions are equally likely
    beforehand, whereas MAP allows prior information about the form of the solution
    to be harnessed. In this tutorial, we will take a closer look at the MLE method
    and its relationship to applied machine learning.


    # 11.3 Maximum Likelihood Estimation


    One solution to probability density estimation is referred to as Maximum Likelihood
    Estimation, or MLE for short. Maximum Likelihood Estimation involves treating
    the problem as an optimization or search problem, where we seek a set of parameters
    that results in the best fit for the joint probability of the data sample (X).
    First, it involves defining a parameter called theta (θ) that defines both the
    choice of the probability density function and the parameters of that distribution.
    It may be a vector of numerical values whose values change smoothly and map to
    different probability distributions and their parameters. In Maximum Likelihood
    Estimation, we wish to maximize the probability of observing the data from the
    joint probability distribution given a specific probability distribution and its
    parameters, stated formally as:


    P(X|θ)  (11.1)


    This conditional probability is often stated using the semicolon (;) notation
    instead of the bar notation (|) because θ is not a random variable, but instead
    an unknown parameter. For example:


    P(X;θ)  (11.2)'
