  md: 'Finally, we can discard the remaining first term that is also independent of
    the model to give:


    min \sum_{i=1}^{n} (y_i - h(x_i, \beta))^2

    (12.20)


    We can see that this is identical to the least squares solution. In fact, under
    reasonable assumptions, an algorithm that minimizes the squared error between
    the target variable and the model output also performs maximum likelihood estimation.


    > ... under certain assumptions any learning algorithm that minimizes the squared
    error between the output hypothesis pre- dictions and the training data will output
    a maximum likelihood hypothesis.


    — Page 164, *Machine Learning*, 1997.


