  md: 'The examples in the training dataset are drawn from a broader population and
    as such, this sample is known to be incomplete. Additionally, there is expected
    to be measurement error or statistical noise in the observations. The parameters
    of the model (β) must be estimated from the sample of observations drawn from
    the domain. There are many ways to estimate the parameters. There are two frameworks
    that are the most common; they are:


    +   - Least Squares Optimization (iteratively reweighted least squares).

    +   - Maximum Likelihood Estimation.


    Both are optimization procedures that involve searching for different model parameters.
    Maximum Likelihood Estimation is a frequentist probabilistic framework that seeks
    a set of parameters for the model that maximizes a likelihood function. We will
    take a closer look at this second approach in the subsequent sections.


    # 13.3 Logistic Regression and Log-Odds


    Before we dive into how the parameters of the model are estimated from data, we
    need to understand what logistic regression is calculating exactly. This might
    be the most confusing part of logistic regression, so we will go over it slowly.
    The linear part of the model (the weighted sum of the inputs) calculates the log-odds
    of a successful event, specifically, the log-odds that a sample belongs to class
    1.


    log-odds = β₀ + β₁ × x₁ + β₂ × x₂ + ⋯ + βₘ × xₘ  (13.6)


    In effect, the model estimates the log-odds for class 1 for the input variables
    at each level (all observed values). What are odds and log-odds? Odds may be familiar
    from the field of gambling. Odds are often stated as wins to losses (wins : losses),
    e.g. a one to ten chance or ratio of winning is stated as 1:10. Given the probability
    of success (p) predicted by the logistic regression model, we can convert it to
    odds of success as the probability of success divided by the probability of not
    success:


    odds of success = p / (1 − p)  (13.7)


    The logarithm of the odds is calculated, specifically log base-e or the natural
    logarithm. This quantity is referred to as the log-odds and may be referred to
    as the logit (logistic unit), a unit of measure.


    log-odds = log(p / (1 − p))  (13.8)


    Recall that this is what the linear part of logistic regression is calculating:


    log-odds = β₀ + β₁ × x₁ + β₂ × x₂ + ⋯ + βₘ × xₘ  (13.9)


    The log-odds of success can be converted back into an odds of success by calculating
    the exponential of the log-odds.


    odds = exp(log − odds)  (13.10)'
