  md: '# Chapter 6


    # Advanced Examples of Calculating Probability


    Probability calculations are frustratingly unintuitive. Our brains are too eager
    to take shortcuts and get the wrong answer, instead of thinking through a problem
    and calculating the probability correctly. To make this issue obvious and aid
    in developing intuition, it can be useful to work through classical problems from
    applied probability. These problems, such as the birthday problem, boy or girl
    problem, and the Monty Hall problem trick us with the incorrect intuitive answer
    and require a careful application of the rules of marginal, conditional, and joint
    probability in order to arrive at the correct solution. In this tutorial, you
    will discover how to develop an intuition for probability by working through classical
    thought-provoking problems. After reading this tutorial, you will know:


    +   - How to solve the birthday problem by multiplying probabilities together.

    +   - How to solve the boy or girl problem using conditional probability.

    +   - How to solve the Monty Hall problem using joint probability.


    Let’s get started.


