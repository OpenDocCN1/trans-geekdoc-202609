  md: '# Chapter 4


    # Joint, Marginal, and Conditional Probability


    Probability quantifies the uncertainty of the outcomes of a random variable. It
    is relatively easy to understand and compute the probability for a single variable.
    Nevertheless, in machine learning, we often have many random variables that interact
    in complex and unknown ways. There are specific techniques that can be used to
    quantify the probability of multiple random variables, such as the joint, marginal,
    and conditional probability. These techniques provide the basis for a probabilistic
    understanding of fitting a predictive model to data. In this tutorial, you will
    discover a gentle introduction to joint, marginal, and conditional probability
    for multiple random variables. After reading this tutorial, you will know:


    +   - Joint probability is the probability of two or more events occurring simultaneously.

    +   - Marginal probability is the probability of an event irrespective of the
    outcome of other variables.

    +   - Conditional probability is the probability of one event occurring in the
    presence of one or more other events.


    Let’s get started.


    # 4.1 Tutorial Overview


    This tutorial is divided into three parts; they are:


    +   1. Probability for One Random Variable

    +   2. Probability for Multiple Random Variables

    +   3. Probability for Independence and Exclusivity'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 4.2 Probability for One Random Variable


    Probability quantifies the likelihood of an event. Specifically, it quantifies
    how likely a specific outcome is for a random variable, such as the flip of a
    coin, the roll of a dice, or drawing a playing card from a deck.


    Probability gives a measure of how likely it is for something to happen.


    > — Page 57, Probability: For the Enthusiastic Beginner, 2016.


    For a random variable x, P(x) is a function that assigns a probability to all
    possible values of x.


    Probability Density of x = P(x) (4.1)


    The probability of a specific event A for a random variable x is denoted as P(x
    = A), or simply as P(A).


    Probability of Event A = P(A) (4.2)


    Probability is calculated as the number of desired outcomes divided by the total
    possible outcomes, in the case where all outcomes are equally likely.


    Probability = number of desired outcomes / total number of possible outcomes (4.3)


    This is intuitive if we think about a discrete random variable such as the roll
    of a die. For example, the probability of a die rolling a 5 is calculated as one
    outcome of rolling a 5 (1) divided by the total number of discrete outcomes (6)
    or 1/6 or about 0.1666 or about 16.666%. The sum of the probabilities of all outcomes
    must equal one. If not, we do not have valid probabilities.


    Sum of the Probabilities for All Outcomes = 1.0. (4.4)


    The probability of an impossible outcome is zero. For example, it is impossible
    to roll a 7 with a standard six-sided die.


    Probability of Impossible Outcome = 0.0 (4.5)


    The probability of a certain outcome is one. For example, it is certain that a
    value between 1 and 6 will occur when rolling a six-sided die.


    Probability of Certain Outcome = 1.0 (4.6)


    The probability of an event not occurring, called the complement. This can be
    calculated by one minus the probability of the event, or 1 − P(A). For example,
    the probability of not rolling a 5 would be 1 − P(5) or 1 − 0.166 or about 0.833
    or about 83.333%.


    P(not A) = 1 − P(A) (4.7)


    Now that we are familiar with the probability of one random variable, let’s consider
    probability for multiple random variables.'
