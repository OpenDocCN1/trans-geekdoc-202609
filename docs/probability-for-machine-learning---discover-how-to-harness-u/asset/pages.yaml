- pgno: 123
  md: 'Given the frequent use of log in the likelihood function, it is referred to
    as a log-likelihood function. It is common in optimization problems to prefer
    to minimize the cost function rather than to maximize it. Therefore, the negative
    of the log-likelihood function is used, referred to generally as a Negative Log-Likelihood
    (NLL) function.


    $$\min - \sum_{i=1}^{n} \log P(x_i; \theta)$$ (13.18)


    The Maximum Likelihood Estimation framework can be used as a basis for estimating
    the parameters of many different machine learning models for regression and classification
    predictive modeling. This includes the logistic regression model.


    # 13.5 Logistic Regression as Maximum Likelihood


    We can frame the problem of fitting a machine learning model as the problem of
    probability density estimation. Specifically, the choice of model and model parameters
    is referred to as a modeling hypothesis $h$, and the problem involves finding
    $h$ that best explains the data $X$. We can, therefore, find the modeling hypothesis
    that maximizes the likelihood function.


    $$\max \sum_{i=1}^{n} \log P(x_i; h)$$ (13.19)


    Supervised learning can be framed as a conditional probability problem of predicting
    the probability of the output given the input:


    $$P(y|X)$$ (13.20)


    As such, we can define conditional maximum likelihood estimation for supervised
    machine learning as follows:


    $$\max \sum_{i=1}^{n} \log P(y_i|x_i; h)$$ (13.21)


    Now we can replace $h$ with our logistic regression model. In order to use maximum
    likelihood, we need to assume a probability distribution. In the case of logistic
    regression, a Binomial probability distribution is assumed for the data sample,
    where each example is one outcome of a Bernoulli trial. The Bernoulli distribution
    has a single parameter: the probability of a successful outcome ($p$).


    $$P(y = 1) = p$$ $$P(y = 0) = 1 - p$$ (13.22)


    The probability distribution that is most often used when there are two classes
    is the binomial distribution. This distribution has a single parameter, $p$, that
    is the probability of an event or a specific class.


    > — Page 283, *Applied Predictive Modeling*, 2013.'
