    Door 1 | Door 2 | Door 3 | Unconditional Probability

    Goat | Goat | Car | 1/3

    Goat | Car | Goat | 1/3

    Car | Goat | Goat | 1/3


    Listing 6.6: Example of unconditional probability Monty Hall problem.


    At this stage, there is a ⅓ probability of a car, matching our intuition so far.
    Then, the host opens another door with a goat, in this case, door 2. The opened
    door was not selected randomly; instead, it was selected with information about
    where the car is not. Our intuition suggests we remove the second case from the
    table and update the probability to ½ for each remaining case. **This is incorrect
    and is the cause of the error**. We can summarize our intuitive conditional probabilities
    for this scenario as follows:


    Door 1 | Door 2 | Door 3 | Uncon. | Cond.

    Goat | Goat | Car | 1/3 | 1/2

    Goat | Car | Goat | 1/3 | 0

    Car | Goat | Goat | 1/3 | 1/2


    Listing 6.7: Example of conditional probability Monty Hall problem.


    This would be correct if the contestant did not make a choice before the host
    opened a door, e.g. if the host opening a door was independent. The trick comes
    because the contestant made a choice before the host opened a door and this is
    useful information. It means the host could not open the chosen door (door1) or
    open a door with a car behind it. The host’s choice was dependent upon the first
    choice of the contestant and then constrained. Instead, we must calculate the
    probability of switching or not switching, regardless of which door the host opens.
    Let’s look at a table of outcomes given the choice of door 1 and staying or switching.


    Door 1 | Door 2 | Door 3 | Stay | Switch

    Goat | Goat | Car | Goat | Car

    Goat | Car | Goat | Goat | Car

    Car | Goat | Goat | Car | Goat


    Listing 6.8: Example of combinations of switching and staying for Monty Hall problem.


    We can see that ⅔ cases of switching result in winning a car (first two rows),
