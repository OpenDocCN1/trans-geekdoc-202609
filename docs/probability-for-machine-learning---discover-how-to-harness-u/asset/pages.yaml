- pgno: 285
  md: '# Chapter 28


    # How to Calibrate Predicted Probabilities


    Instead of predicting class values directly for a classification problem, it can
    be convenient to predict the probability of an observation belonging to each possible
    class. Predicting probabilities allows some flexibility including deciding how
    to interpret the probabilities, presenting predictions with uncertainty, and providing
    more nuanced ways to evaluate the skill of the model.


    Predicted probabilities that match the expected distribution of probabilities
    for each class are referred to as calibrated. The problem is, not all machine
    learning models are capable of predicting calibrated probabilities. There are
    methods to both diagnose how calibrated predicted probabilities are and to better
    calibrate the predicted probabilities with the observed distribution of each class.
    Often, this can lead to better quality predictions, depending on how the skill
    of the model is evaluated. In this tutorial, you will discover the importance
    of calibrating predicted probabilities and how to diagnose and improve the calibration
    of models used for probabilistic classification. After completing this tutorial,
    you will know:


    +   - Nonlinear machine learning algorithms often predict uncalibrated class probabilities.

    +   - Reliability diagrams can be used to diagnose the calibration of a model,
    and methods can be used to better calibrate predictions for a problem.

    +   - How to develop reliability diagrams and calibrate classification models
    in Python with scikit-learn.


    Let’s get started.


    # 28.1 Tutorial Overview


    This tutorial is divided into four parts; they are:


    +   1. Predicting Probabilities

    +   2. Calibration of Predictions

    +   3. How to Calibrate Probabilities in Python

    +   4. Worked Example of Calibrating SVM Probabilities'
  merge: -1
  img_proc: true
- pgno: 286
  md: "# 28.2 Predicting Probabilities\n\nA classification predictive modeling problem\
    \ requires predicting or forecasting a label for a given observation. An alternative\
    \ to predicting the label directly, a model may predict the probability of an\
    \ observation belonging to each possible class label. This provides some flexibility\
    \ both in the way predictions are interpreted and presented (choice of threshold\
    \ and prediction uncertainty) and in the way the model is evaluated. Although\
    \ a model may be able to predict probabilities, the distribution and behavior\
    \ of the probabilities may not match the expected distribution of observed probabilities\
    \ in the training data.\n\nThis is especially common with complex nonlinear machine\
    \ learning algorithms that do not directly make probabilistic predictions and\
    \ instead use approximations. The distribution of the probabilities can be adjusted\
    \ to better match the expected distribution observed in the data. This adjustment\
    \ is referred to as calibration, as in the calibration of the model or the calibration\
    \ of the distribution of class probabilities.\n\n> ... we desire that the estimated\
    \ class probabilities are reflective of the true underlying probability of the\
    \ sample. That is, the predicted class probability (or probability-like value)\
    \ needs to be well-calibrated. To be well-calibrated, the probabilities must effectively\
    \ reflect the true likelihood of the event of interest.\n> \n> — Page 249, *Applied\
    \ Predictive Modeling*, 2013.\n\n# 28.3 Calibration of Predictions\n\nThere are\
    \ two concerns in calibrating probabilities; they are diagnosing the calibration\
    \ of predicted probabilities and the calibration process itself.\n\n# 28.3.1 Reliability\
    \ Diagrams (Calibration Curves)\n\nA reliability diagram is a line plot of the\
    \ relative frequency of what was observed (y-axis) versus the predicted probability\
    \ frequency (x-axis).\n\n> Reliability diagrams are common aids for illustrating\
    \ the properties of probabilistic forecast systems. They consist of a plot of\
    \ the observed relative frequency against the predicted probability, providing\
    \ a quick visual intercomparison when tuning probabilistic forecast systems, as\
    \ well as documenting the performance of the final product\n> \n> — *Increasing\
    \ the Reliability of Reliability Diagrams*, 2007.\n\nSpecifically, the predicted\
    \ probabilities are divided up into a fixed number of buckets along the x-axis.\
    \ The number of events (*class = 1*) are then counted for each bin (e.g. the relative\
    \ observed frequency). Finally, the counts are normalized. The results are then\
    \ plotted as a line plot. These plots are commonly referred to as *reliability\
    \ diagrams* in forecast literature, although may also be called *calibration plots*\
    \ or curves as they summarize how well the forecast probabilities are calibrated.\
    \ The better calibrated or more reliable a forecast, the closer the points will\
    \ appear along the main diagonal from the bottom left to the top right of the\
    \ plot. The position of the points or the curve relative to the diagonal can help\
    \ to interpret the probabilities; for example:"
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   - **Below the diagonal:** The model has over-forecast; the probabilities
    are too large.

    +   - **Above the diagonal:** The model has under-forecast; the probabilities
    are too small.


    Probabilities, by definition, are continuous, so we expect some separation from
    the line, often shown as an *S*-shaped curve showing pessimistic tendencies over-forecasting
    low probabilities and under-forecasting high probabilities.


    Reliability diagrams provide a diagnostic to check whether the forecast value
    Xi is reliable. Roughly speaking, a probability forecast is reliable if the event
    actually happens with an observed relative frequency consistent with the forecast
    value.


    > — *Increasing the Reliability of Reliability Diagrams*, 2007.


    The reliability diagram can help to understand the relative calibration of the
    forecasts from different predictive models.


    # 28.3.2 Probability Calibration


    The predictions made by a predictive model can be calibrated. Calibrated predictions
    may (or may not) result in an improved calibration on a reliability diagram. Some
    algorithms are fit in such a way that their predicted probabilities are already
    calibrated. Without going into details why, logistic regression is one such example.
    Other algorithms do not directly produce predictions of probabilities, and instead
    a prediction of probabilities must be approximated. Some examples include neural
    networks, support vector machines, and decision trees. The predicted probabilities
    from these methods will likely be uncalibrated and may benefit from being modified
    via calibration.


    Calibration of prediction probabilities is a rescaling operation that is applied
    after the predictions have been made by a predictive model. There are two popular
    approaches to calibrating probabilities; they are the Platt Scaling and Isotonic
    Regression. Platt Scaling is simpler and is suitable for reliability diagrams
    with the *S*-shape. Isotonic Regression is more complex, requires a lot more data
    (otherwise it may overfit), but can support reliability diagrams with different
    shapes (is nonparametric).


    Platt Scaling is most effective when the distortion in the predicted probabilities
    is sigmoid-shaped. Isotonic Regression is a more powerful calibration method that
    can correct any monotonic distortion. Unfortunately, this extra power comes at
    a price. A learning curve analysis shows that Isotonic Regression is more prone
    to overfitting, and thus performs worse than Platt Scaling, when data is scarce.


    > — *Predicting Good Probabilities With Supervised Learning*, 2005.


    **Note, and this is really important:** better calibrated probabilities may or
    may not lead to better class-based or probability-based predictions. It really
    depends on the specific metric used to evaluate predictions. In fact, some empirical
    results suggest that the algorithms that can benefit the more from calibrating
    predicted probabilities include SVMs, bagged decision trees, and random forests.


    … after calibration the best methods are boosted trees, random forests and SVMs.


    > — *Predicting Good Probabilities With Supervised Learning*, 2005.'
  merge: -1
  img_proc: true
