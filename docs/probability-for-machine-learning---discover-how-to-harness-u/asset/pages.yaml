    pyplot.plot([0, 1], [no_skill, no_skill], linestyle=''--'', label=''No Skill'')

    pyplot.plot(lr_recall, lr_precision, marker=''.'', label=''Logistic'')

    # axis labels

    pyplot.xlabel(''Recall'')

    pyplot.ylabel(''Precision'')

    # show the legend

    pyplot.legend()

    # show the plot

    pyplot.show()

    ```


    Listing 27.8: Example of calculating and plotting a precision-recall curve for
    predicted probabilities.


    Running the example first prints the F1, area under curve (AUC) for the logistic
    regression model.


