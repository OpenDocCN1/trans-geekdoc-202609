  md: '# 20.4 How to Develop and Use a Bayesian Network


    Designing a Bayesian Network requires defining at least three things: Random Variables.
    What are the random variables in the problem? Conditional Relationships. What
    are the conditional relationships between the variables? Probability Distributions.
    What are the probability distributions for each variable? It may be possible for
    an expert in the problem domain to specify some or all of these aspects in the
    design of the model. In many cases, the architecture or topology of the graphical
    model can be specified by an expert, but the probability distributions must be
    estimated from data from the domain.


    Both the probability distributions and the graph structure itself can be estimated
    from data, although it can be a challenging process. As such, it is common to
    use learning algorithms for this purpose; for example, assuming a Gaussian distribution
    for continuous random variables and using gradient ascent for estimating the distribution
    parameters. Once a Bayesian Network has been prepared for a domain, it can be
    used for reasoning, e.g. making decisions. Reasoning is achieved via inference
    with the model for a given situation. For example, the outcome for some events
    is known and plugged into the random variables. The model can be used to estimate
    the probability of causes for the events or possible further outcomes.


    Reasoning (inference) is then performed by introducing evidence that sets variables
    in known states, and subsequently computing probabilities of interest, conditioned
    on this evidence.


    > — Page 13, *Bayesian Reasoning and Machine Learning*, 2012.


    Practical examples of using Bayesian Networks in practice include medicine (symptoms
    and diseases), bioinformatics (traits and genes), and speech recognition (utterances
    and time).


    # 20.5 Example of a Bayesian Network


    We can make Bayesian Networks concrete with a small example. Consider a problem
    with three random variables: A, B, and C. A is dependent upon B, and C is dependent
    upon B. We can state the conditional dependencies as follows:


    +   - A is conditionally dependent upon B, e.g. P(A|B)

    +   - C is conditionally dependent upon B, e.g. P(C|B)


    We know that C and A have no effect on each other. We can also state the conditional
    independencies as follows:


    +   - A is conditionally independent from C: P(A|B,C)

    +   - C is conditionally independent from A: P(C|B,A)


    Notice that the conditional dependence is stated in the presence of the conditional
    independence. That is, A is conditionally independent of C, or A is conditionally
    dependent upon B in the presence of C. We might also state the conditional independence
    of A given C as the'
  merge: -1
