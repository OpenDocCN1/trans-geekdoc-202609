  md: "# 19.3  What Is Bayesian Optimization\n\nBayesian Optimization is an approach\
    \ that uses Bayes Theorem to direct the search in order to find the minimum or\
    \ maximum of an objective function. It is an approach that is most useful for\
    \ objective functions that are complex, noisy, and/or expensive to evaluate.\n\
    \n> > Bayesian optimization is a powerful strategy for finding the extrema of\
    \ objective functions that are expensive to evaluate. [...] It is particularly\
    \ useful when these evaluations are costly, when one does not have access to derivatives,\
    \ or when the problem at hand is non-convex.\n> \n> — *A Tutorial on Bayesian\
    \ Optimization of Expensive Cost Functions, with Application to Active User Modeling\
    \ and Hierarchical Reinforcement Learning, 2010.*\n\nRecall that Bayes Theorem\
    \ is an approach for calculating the conditional probability of an event:\n\n\
    $$P(A|B) = \\frac{P(B|A) \\times P(A)}{P(B)}\\tag{19.1}$$\n\nWe can simplify this\
    \ calculation by removing the normalizing value of $P(B)$ and describe the conditional\
    \ probability as a proportional quantity. This is useful as we are not interested\
    \ in calculating a specific conditional probability, but instead in optimizing\
    \ a quantity.\n\n$$P(A|B) = P(B|A) \\times P(A)\\tag{19.2}$$\n\nThe conditional\
    \ probability that we are calculating is referred to generally as the posterior\
    \ probability; the reverse conditional probability is sometimes referred to as\
    \ the likelihood, and the marginal probability is referred to as the prior probability;\
    \ for example:\n\n$$\\text{posterior} = \\text{likelihood} \\times \\text{prior}\\\
    tag{19.3}$$\n\nThis provides a framework that can be used to quantify the beliefs\
    \ about an unknown objective function given samples from the domain and their\
    \ evaluation via the objective function. We can devise specific samples $(x_1,\
    \ x_2, \\cdots , x_n)$ and evaluate them using the objective function $f(x_i)$\
    \ that returns the cost or outcome for the sample $x_i$. Samples and their outcome\
    \ are collected sequentially and define our data $D$, e.g. $D = \\{x_i, f(x_i),\
    \ ..., x_n, f(x_n)\\}$ and is used to define the prior. The likelihood function\
    \ is defined as the probability of observing the data given the function $P(D|f)$.\
    \ This likelihood function will change as more observations are collected.\n\n\
    $$P(f|D) = P(D|f) \\times P(f)\\tag{19.4}$$\n\nThe posterior represents everything\
    \ we know about the objective function. It is an approximation of the objective\
    \ function and can be used to estimate the cost of different candidate samples\
    \ that we may want to evaluate. In this way, the posterior probability is a surrogate\
    \ objective function.\n\nThe posterior captures the updated beliefs about the\
    \ unknown objective function. One may also interpret this step of Bayesian optimization\
    \ as estimating the objective function with a surrogate function (also called\
    \ a response surface)."
  merge: -1
  img_proc: true
- pgno: 179
  md: '> — A Tutorial on Bayesian Optimization of Expensive Cost Functions, with Application
    to Active User Modeling and Hierarchical Reinforcement Learning, 2010.


    **Surrogate Function**: Bayesian approximation of the objective function that
    can be sampled efficiently.


    The surrogate function gives us an estimate of the objective function, which can
    be used to direct future sampling. Sampling involves careful use of the posterior
    in a function known as the *acquisition* function, e.g. for acquiring more samples.
    We want to use our belief about the objective function to sample the area of the
    search space that is most likely to pay off, therefore the acquisition will optimize
    the conditional probability of locations in the search to generate the next sample.


    **Acquisition Function**: Technique by which the posterior is used to select the
    next sample from the search space.


    Once additional samples and their evaluation via the objective function $f()$
    have been collected, they are added to data $D$ and the posterior is then updated.
    This process is repeated until the extrema of the objective function is located,
    a good enough result is located, or resources are exhausted. The Bayesian Optimization
    algorithm can be summarized as follows:


    +   1. Select a Sample by Optimizing the Acquisition Function.

    +   2. Evaluate the Sample With the Objective Function.

    +   3. Update the Data and, in turn, the Surrogate Function.

    +   4. Go To 1.


    # 19.4 How to Perform Bayesian Optimization


    In this section, we will explore how Bayesian Optimization works by developing
    an implementation from scratch for a simple one-dimensional test function. First,
    we will define the test problem, then how to model the mapping of inputs to outputs
    with a surrogate function. Next, we will see how the surrogate function can be
    searched efficiently with an acquisition function before tying all of these elements
    together into the Bayesian Optimization procedure.


    # 19.4.1 Test Problem


    The first step is to define a test problem. We will use a multimodal problem with
    five peaks, calculated as:


    $y = x^2 \times \sin(5 \times \pi \times x)^6$ (19.5)


    Where $x$ is a real value in the range $[0,1]$ and $\pi$ is the value of pi. We
    will augment this function by adding Gaussian noise with a mean of zero and a
    standard deviation of 0.1. This will mean that the real evaluation will have a
    positive or negative random value added to it, making the function challenging
    to optimize. The `objective()` function below implements this.'
