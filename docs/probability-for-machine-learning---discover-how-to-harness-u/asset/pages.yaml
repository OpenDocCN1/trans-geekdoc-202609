- pgno: 73
  md: '# 8.5 Multinoulli Distribution


    The Multinoulli distribution, also called the categorical distribution, covers
    the case where an event will have one of K possible outcomes.


    $$x \in \{1,2,3,\cdots , K\}\tag{8.3}$$


    It is a generalization of the Bernoulli distribution from a binary variable to
    a categorical variable, where the number of cases K for the Bernoulli distribution
    is set to 2, K = 2. A common example that follows a Multinoulli distribution is:


    +   - A single roll of a die that will have an outcome in {1,2,3,4,5,6}, e.g.
    K = 6.


    A common example of a Multinoulli distribution in machine learning might be a
    multiclass classification of a single example into one of K classes, e.g. one
    of three different species of the iris flower. The distribution can be summarized
    with p variables from p₁ to p_K, each defining the probability of a given categorical
    outcome from 1 to K, and where all probabilities sum to 1.0.


    $$P(x = 1) = p_1$$ $$P(x = 2) = p_1$$ $$P(x = 3) = p_3$$ $$\cdots$$ $$P(x = K)
    = p_K\tag{8.4}$$


    In the case of a single roll of a die, the probabilities for each value would
    be 1/6, or about 0.166 or about 16.6%.


    # 8.6 Multinomial Distribution


    The repetition of multiple independent Multinoulli trials will follow a multinomial
    distribution. The multinomial distribution is a generalization of the binomial
    distribution for a discrete variable with K outcomes. An example of a multinomial
    process includes a sequence of independent dice rolls. A common example of the
    multinomial distribution is the occurrence counts of words in a text document,
    from the field of natural language processing. A multinomial distribution is summarized
    by a discrete random variable with K outcomes, a probability for each outcome
    from p₁ to p_K, and n successive trials.


    We can demonstrate this with a small example with 3 categories (K = 3) with equal
    probability (p=33.33%) and 100 trials. Firstly, we can use the multinomial() NumPy
    function to simulate 100 independent trials and summarize the number of times
    that the event resulted in each of the given categories. The function takes both
    the number of trials and the probabilities for each category as a list. The complete
    example is listed below.


    ```

    # example of simulating a multinomial process

    from numpy.random import multinomial

    # define the parameters of the distribution

    p = [1.0/3.0, 1.0/3.0, 1.0/3.0]

    k = 100

    ```'
  merge: -1
  img_proc: true
