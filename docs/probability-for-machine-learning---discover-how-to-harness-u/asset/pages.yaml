- pgno: 78
  md: '# 9.2  Continuous Probability Distributions


    A random variable is a quantity produced by a random process. A continuous random
    variable is a random variable that has a real numerical value. Each numerical
    outcome of a continuous random variable can be assigned a probability. The relationship
    between the events for a continuous random variable and their probabilities is
    called the continuous probability distribution and is summarized by a probability
    density function, or PDF for short.


    Unlike a discrete random variable, the probability for a given continuous random
    variable cannot be specified directly; instead, it is calculated as an integral
    (area under the curve) for a tiny interval around the specific outcome. The probability
    of an event equal to or less than a given value is defined by the cumulative distribution
    function, or CDF for short. The inverse of the CDF is called the percentage-point
    function and will give the discrete outcome that is less than or equal to a probability.


    +   - **PDF: Probability Density Function**, returns the probability of a given
    continuous outcome.

    +   - **CDF: Cumulative Distribution Function**, returns the probability of a
    value less than or equal to a given outcome.

    +   - **PPF: Percent-Point Function**, returns a discrete value that is less than
    or equal to the given probability.


    There are many common continuous probability distributions. The most common is
    the normal probability distribution. Practically all continuous probability distributions
    of interest belong to the so-called exponential family of distributions, which
    are just a collection of parameterized probability distributions (e.g. distributions
    that change based on the values of parameters).


    Continuous probability distributions play an important role in machine learning
    from the distribution of input variables to the models, the distribution of errors
    made by models, and in the models themselves when estimating the mapping between
    inputs and outputs. In the following sections, will take a closer look at some
    of the more common continuous probability distributions.


    # 9.3  Normal Distribution


    The normal distribution is also called the Gaussian distribution (named for Carl
    Friedrich Gauss) or the bell curve distribution. The distribution covers the probability
    of real-valued events from many different problem domains, making it a common
    and well-known distribution, hence the name *normal*. A continuous random variable
    that has a normal distribution is said to be *normal* or *normally distributed*.
    Some examples of domains that have normally distributed events include:


    +   - The heights of people.

    +   - The weights of babies.

    +   - The scores on a test.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'The distribution can be defined using two parameters:


    +   - **Mean** (mu or μ): The expected value.

    +   - **Variance** (sigma² or σ²): The spread from the mean.


    Often, the standard deviation is used instead of the variance, which is calculated
    as the square root of the variance, e.g. normalized.


    +   - **Standard Deviation** (sigma or σ): The average spread from the mean.


    A normal distribution with a mean of zero and a standard deviation of 1 is called
    a standard normal distribution, and often data is reduced or *standardized* to
    this for analysis for ease of interpretation and comparison. We can define a distribution
    with a mean of 50 and a standard deviation of 5 and sample random numbers from
    this distribution. We can achieve this using the `normal()` NumPy function. The
    example below samples and prints 10 numbers from this distribution.


    ```

    # sample a normal distribution

    from numpy.random import normal

    # define the distribution

    mu = 50

    sigma = 5

    n = 10

    # generate the sample

    sample = normal(mu, sigma, n)

    print(sample)

    ```


    Listing 9.1: Example of sampling from a normal distribution.


    Running the example prints 10 numbers randomly sampled from the defined normal
    distribution.


    ```

    [48.71009029 49.36970461 45.58247748 51.96846616 46.05793544 40.3903483

    48.39189421 50.08693721 46.85896352 44.83757824]

    ```


    Listing 9.2: Example output from sampling from a normal distribution.


    A sample of data can be checked to see if it is normal by plotting it and checking
    for the familiar normal shape, or by using statistical tests. If the samples of
    observations of a random variable are normally distributed, then they can be summarized
    by just the mean and variance, calculated directly on the samples. We can calculate
    the probability of each observation using the probability density function. A
    plot of these values would give us the tell-tale bell shape. We can define a normal
    distribution using the `norm()` SciPy function and then calculate properties such
    as the moments, PDF, CDF, and more. The example below calculates the probability
    for integer values between 30 and 70 in our distribution and plots the result,
    then does the same for the cumulative probability.


    ```

    # pdf and cdf for a normal distribution

    from scipy.stats import norm

    from matplotlib import pyplot

    # define distribution parameters

    mu = 50

    sigma = 5

    ```'
  merge: -1
