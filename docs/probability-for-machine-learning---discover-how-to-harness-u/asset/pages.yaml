    \ strategy.\n\nPerhaps we can do better than a uniform distribution when predicting\
    \ a class label. We will explore this in the next section.\n\n# 25.5 Predict the\
    \ Majority Class\n\nIn the previous section, we explored a strategy that selected\
    \ a class label based on a uniform probability distribution over the observed\
    \ label in the training dataset. This allowed the predicted probability distribution\
    \ to match the observed probability distribution for each class and an improvement\
    \ over a uniform distribution of class labels. A downside to this imbalanced dataset,\
    \ in particular, is one class is expected above the other to a greater degree\
    \ and randomly predicting classes, even in a biased way, leads to too many incorrect\
    \ predictions.\n\nInstead, we can predict the majority class and be assured of\
    \ achieving an accuracy that is at least as high as the composition of the majority\
    \ class in the training dataset. That is, if 75% of the examples in the training\
    \ set are class-1, and we predicted class-1 for all examples, then we know that\
    \ we would at least achieve an accuracy of 75%, an improvement over randomly selecting\
    \ a class as we did in the previous section. We can confirm this by calculating\
    \ the expected performance of the approach using our probability model. The probability\
    \ of this naive classification strategy predicting class-0 would be 0.0 (impossible),\
    \ and the probability of predicting class-1 is 1.0 (certain). Therefore:\n\n$$\\\
    begin{aligned}\nP(\\hat{y}=y) &= P(\\hat{y}=0) \\times P(y=0) + P(\\hat{y}=1)\
    \ \\times P(y=1) \\\\\n&= 0.0 \\times 0.25 + 1.0 \\times 0.75 \\\\\n&= 0.0 + 0.75\
    \ \\\\\n&= 0.75\n\\end{aligned} \\tag{25.5}$$"
