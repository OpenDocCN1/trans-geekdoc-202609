- pgno: 201
  md: 'conditional dependence of $A$ given $B$, as $A$ is unaffected by $C$ and can
    be calculated from $A$ given $B$ alone.


    $$P(A|C,B)=P(A|B)$$


    We can see that $B$ is unaffected by $A$ and $C$ and has no dependencies or parents;
    we can simply state the conditional independence of $B$ from $A$ and $C$ as $P(B,
    P(A|B), P(C|B))$ or $P(B)$. We can also write the joint probability of $A$ and
    $C$ given $B$ or conditioned on $B$ as the product of two conditional probabilities,
    for example:


    $$P(A,C|B)=P(A|B)\times P(C|B)$$


    The model summarizes the joint probability of $P(A,B,C)$, calculated as:


    $$P(A,B,C)=P(A|B)\times P(C|B)\times P(B)$$


    We can draw the graph as follows:


    ![](img/6ef657cfead7281442f755181c4f6e50_201_0.png)


    Figure 20.1: Example of a Simple Bayesian Network.


    Notice that the random variables are each assigned a node, and the conditional
    probabilities are stated as directed connections between the nodes. Also notice
    that it is not possible to navigate the graph in a cycle, e.g. no loops are possible
    when navigating from node to node via the edges. Also notice that the graph is
    useful even at this point where we don’t know the probability distributions for
    the variables. You might want to extend this example by using contrived probabilities
    for discrete events for each random variable and practice some simple inference
    for different scenarios.


    # ## 20.6 Bayesian Networks in Python


    Bayesian Networks can be developed and used for inference in Python. A popular
    library for this is called PyMC and provides a range of tools for Bayesian modeling,
    including graphical models like Bayesian Networks. The most recent version of
    the library is called PyMC3, named for Python version 3, and was developed on
    top of the Theano mathematical computation library that offers fast automatic
    differentiation.'
