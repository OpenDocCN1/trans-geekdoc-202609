  md: '# Chapter 2


    # Uncertainty in Machine Learning


    Applied machine learning requires managing uncertainty. There are many sources
    of uncertainty in a machine learning project, including variance in the specific
    data values, the sample of data collected from the domain, and in the imperfect
    nature of any models developed from such data. Managing the uncertainty that is
    inherent in machine learning for predictive modeling can be achieved via the tools
    and techniques from probability, a field specifically designed to handle uncertainty.
    In this tutorial, you will discover the challenge of uncertainty in machine learning.
    After reading this tutorial, you will know:


    +   - Uncertainty is the biggest source of difficulty for beginners in machine
    learning, especially developers.

    +   - Noise in data, incomplete coverage of the domain, and imperfect models provide
    the three main sources of uncertainty in machine learning.

    +   - Probability provides the foundation and tools for quantifying, handling,
    and harnessing uncertainty in applied machine learning.


    Let’s get started.


    # 2.1 Tutorial Overview


    This tutorial is divided into five parts; they are:


    +   1. Uncertainty in Machine Learning

    +   2. Noise in Observations

    +   3. Incomplete Coverage of the Domain

    +   4. Imperfect Model of the Problem

    +   5. How to Manage Uncertainty'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# 2.2 Uncertainty in Machine Learning\n\nApplied machine learning requires\
    \ getting comfortable with uncertainty. Uncertainty means working with imperfect\
    \ or incomplete information. Uncertainty is fundamental to the field of machine\
    \ learning, yet it is one of the aspects that causes the most difficulty for beginners,\
    \ especially those coming from a developer background. For software engineers\
    \ and developers, computers are deterministic. You write a program, and the computer\
    \ does what you say. Algorithms are analyzed based on space or time complexity\
    \ and can be chosen to optimize whichever is most important to the project, like\
    \ execution speed or memory constraints.\n\nPredictive modeling with machine learning\
    \ involves fitting a model to map examples of inputs to an output, such as a number\
    \ in the case of a regression problem or a class label in the case of a classification\
    \ problem. Naturally, the beginner asks reasonable questions, such as:\n\n+  \
    \ - What are the best features that I should use?\n+   - What is the best algorithm\
    \ for my dataset?\n\nThe answers to these questions are unknown and might even\
    \ be unknowable, at least exactly.\n\n> Many branches of computer science deal\
    \ mostly with entities that are entirely deterministic and certain. [...] Given\
    \ that many computer scientists and software engineers work in a relatively clean\
    \ and certain environment, it can be surprising that machine learning makes heavy\
    \ use of probability theory.\n> \n> — Page 54, Deep Learning, 2016.\n\nThis is\
    \ the major cause of difficulty for beginners. The reason that the answers are\
    \ unknown is because of uncertainty, and the solution is to systematically evaluate\
    \ different solutions until a good or good-enough set of features and/or algorithm\
    \ is discovered for a specific prediction problem. There are three main sources\
    \ of uncertainty in machine learning, and in the following sections, we will take\
    \ a look at the three possible sources in turn.\n\n# 2.3 Noise in Observations\n\
    \nObservations from the domain are not crisp; instead, they contain noise. An\
    \ observation from the domain is often referred to as an instance or a example\
    \ and is one row of data. It is what was measured or what was collected. It is\
    \ the data that describes the object or subject. It is the input to a model and\
    \ the expected output. An example might be one set of measurements of one iris\
    \ flower and the species of flower that was measured in the case of training data.\n\
    \n```\nSepal length: 5.1 cm\nSepal width: 3.5 cm\nPetal length: 1.4 cm\nPetal\
    \ width: 0.2 cm\nSpecies: Iris setosa\n```\n\nListing 2.1: Example of measurements\
    \ and expected class label.\n\nIn the case of new data for which a prediction\
    \ is to be made, it is just the measurements without the species of flower."
