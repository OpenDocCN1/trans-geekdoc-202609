- pgno: 273
  md: '# Chapter 27


    # When to Use ROC Curves and Precision-Recall Curves


    It can be more flexible to predict probabilities of an observation belonging to
    each class in a classification problem rather than predicting classes directly.
    This flexibility comes from the way that probabilities may be interpreted using
    different thresholds that allow the operator of the model to trade-off concerns
    in the errors made by the model, such as the number of false positives compared
    to the number of false negatives. This is required when using models where the
    cost of one error outweighs the cost of other types of errors. Two diagnostic
    tools that help in the interpretation of probabilistic forecast for binary (two-class)
    classification predictive modeling problems are ROC Curves and Precision-Recall
    curves. In this tutorial, you will discover ROC Curves, Precision-Recall Curves,
    and when to use each to interpret the prediction of probabilities for binary classification
    problems. After completing this tutorial, you will know:


    +   - ROC Curves summarize the trade-off between the true positive rate and false
    positive rate for a predictive model using different probability thresholds.

    +   - Precision-Recall curves summarize the trade-off between the true positive
    rate and the positive predictive value for a predictive model using different
    probability thresholds.

    +   - ROC curves are appropriate when the observations are balanced between each
    class, whereas precision-recall curves are appropriate for imbalanced datasets.


    Let’s get started.


    # 27.1 Tutorial Overview


    This tutorial is divided into 6 parts; they are:


    +   1. Predicting Probabilities

    +   2. What Are ROC Curves?

    +   3. ROC Curves and AUC in Python

    +   4. What Are Precision-Recall Curves?'
