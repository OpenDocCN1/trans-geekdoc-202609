- pgno: 162
  md: '> — Page 236, *Deep Learning*, 2016.


    Like MLE, solving the optimization problem depends on the choice of model. For
    simpler models, like linear regression, there are analytical solutions. For more
    complex models like logistic regression, numerical optimization is required that
    makes use of first- and second-order derivatives. For the more prickly problems,
    stochastic optimization algorithms may be required.


    Now that we are familiar with how searching across candidate models can be framed
    using Bayes Theorem, let’s look at one more important application of Bayes Theorem
    in machine learning, called the Bayes Classifier.


    # ## 17.6 Bayes Optimal Classifier


    The Bayes optimal classifier is a probabilistic model that makes the most probable
    prediction for a new example, given the training dataset. This model is also referred
    to as the Bayes optimal learner, the Bayes classifier, Bayes optimal decision
    boundary or the Bayes optimal discriminant function.


    +   - **Bayes Classifier:** Probabilistic model that makes the most probable prediction
    for new examples.


    Specifically, the Bayes optimal classifier answers the question: *What is the
    most probable classification of the new instance given the training data?* This
    is different from the MAP framework that seeks the most probable hypothesis (model).
    Instead, we are interested in making a specific prediction.


    In general, the most probable classification of the new instance is obtained by
    combining the predictions of all hypotheses, weighted by their posterior probabilities.


    > — Page 175, *Machine Learning*, 1997.


    The equation below demonstrates how to calculate the conditional probability for
    a new instance ($v_j$) given the training data ($D$), given a space of hypotheses
    ($H$).


    $$P(v_j\mid D)=\sum_{h\in H}P(v_j\mid h_i)\times P(h_i\mid D) \tag{17.12}$$


    Where $v_j$ is a new instance to be classified, $H$ are the set of hypotheses
    for classifying the instance, $h_i$ is a given hypothesis, $P(v_j\mid h_i)$ is
    the posterior probability for $v_j$ given hypothesis $h_i$, and $P(h_i\mid D)$
    is the posterior probability of the hypothesis $h_i$ given the data $D$. Selecting
    the outcome with the maximum probability is an example of a Bayes optimal classification.


    $$\max\sum_{h\in H}P(v_j\mid h_i)\times P(h_i\mid D) \tag{17.13}$$


    Any model that classifies examples using this equation is a Bayes optimal classifier
    and no other model can outperform this technique on average.'
