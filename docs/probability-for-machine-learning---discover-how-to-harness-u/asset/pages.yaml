- pgno: 232
  md: 'We can see that the idea of cross-entropy may be useful for optimizing a classification
    model. Each example has a known class label with a probability of 1.0, and a probability
    of 0.0 for all other labels. A model can estimate the probability of an example
    belonging to each class label. Cross-entropy can then be used to calculate the
    difference between the two probability distributions. As such, we can map the
    classification of one example onto the idea of a random variable with a probability
    distribution as follows:


    +   - **Random Variable**: The example for which we require a predicted class
    label.

    +   - **Events**: Each class label that could be predicted.


    In classification tasks, we know the target probability distribution P for an
    input as the class label 0 or 1 interpreted as probabilities as *impossible* and
    *certain* respectively. These probabilities have no surprise at all, therefore
    they have no information content or zero entropy. Our model seeks to approximate
    the target probability distribution Q. In the language of classification, these
    are the actual and the predicted probabilities, or y and yhat.


    +   - **Expected Probability** (*y*): The known probability of each class label
    for an example in the dataset (*P*).

    +   - **Predicted Probability** (*yhat*): The probability of each class label
    an example predicted by the model (*Q*).


    We can, therefore, estimate the cross-entropy for a single prediction using the
    cross-entropy calculation described above; for example.


    $$H(P, Q) = - \sum_{\{x \in X\}} P(x) \times \log(Q(x)) \tag{23.7}$$


    Where each x ∈ X is a class label that could be assigned to the example, and P(x)
    will be 1 for the known label and 0 for all other labels. The cross-entropy for
    a single example in a binary classification task can be stated by unrolling the
    sum operation as follows:


    $$H(P, Q) = - (P(class0) \times \log(Q(class0)) + P(class1) \times \log(Q(class1)))
    \tag{23.8}$$


    You may see this form of calculating cross-entropy cited in textbooks. If there
    are just two class labels, the probability is modeled as the Bernoulli distribution
    for the positive class label. This means that the probability for class 1 is predicted
    by the model directly, and the probability for class 0 is given as one minus the
    predicted probability, for example:


    +   - **Predicted** P(class0) = 1 − yhat

    +   - **Predicted** P(class1) = yhat


    When calculating cross-entropy for classification tasks, the base-e or natural
    logarithm is used. This means that the units are in nats, not bits. We are often
    interested in minimizing the cross-entropy for the model across the entire training
    dataset. This is calculated by calculating the average cross-entropy across all
    training examples.'
