    \ ROC vs. Precision-Recall Curves?\n\nGenerally, the use of ROC curves and precision-recall\
    \ curves are as follows:\n\n+   - ROC curves should be used when there are roughly\
    \ equal numbers of observations for each class.\n+   - Precision-Recall curves\
    \ should be used when there is a moderate to large class imbalance.\n\nThe reason\
    \ for this recommendation is that ROC curves present an optimistic picture of\
    \ the model on datasets with a class imbalance.\n\n> However, ROC curves can present\
    \ an overly optimistic view of an algorithm’s performance if there is a large\
    \ skew in the class distribution. […] Precision-Recall (PR) curves, often used\
    \ in Information Retrieval, have been cited as an alternative to ROC curves for\
    \ tasks with a large skew in the class distribution.\n> \n> — *The Relationship\
    \ Between Precision-Recall and ROC Curves*, 2006.\n\nSome go further and suggest\
    \ that using a ROC curve with an imbalanced dataset might be deceptive and lead\
    \ to incorrect interpretations of the model skill."
