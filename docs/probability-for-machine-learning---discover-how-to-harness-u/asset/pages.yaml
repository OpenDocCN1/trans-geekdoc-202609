    # 5.4 Probabilities of Weather in Two Cities


    We can develop an intuition for joint and marginal probabilities using a table
    of joint probabilities of events for two dependent random variables. Consider
    the situation where there are two cities, city1 and city2. The cities are close
    enough that they are generally affected by the same weather, yet they are far
    enough apart that they do not get identical weather. We can consider discrete
    weather classifications for these cities on a given day, such as sunny, cloudy,
    and rainy. When it is sunny in city1, it is usually sunny in city2, but not always.
    As such, there is a dependency between the weather in the two cities. Now, let’s
    explore the different types of probability.


    # 5.4.1 Data Collection


    First, we can record the observed weather in each city over twenty days. For example,
    on day 1, what was the weather in each, day 2, and so on.


    ```

    Day | City1 | City2

    1   | Sunny | Sunny

