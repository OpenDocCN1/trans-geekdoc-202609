  md: "Calculating the natural logarithm of probabilities has the effect of creating\
    \ larger (negative) numbers and adding the numbers together will mean that larger\
    \ probabilities will be closer to zero. The resulting values can still be compared\
    \ and maximized to give the most likely class label. This is often called the\
    \ log-trick when multiplying probabilities.\n\n# 18.6.4  Update Probability Distributions\n\
    \nAs new data becomes available, it can be relatively straightforward to use this\
    \ new data with the old data to update the estimates of the parameters for each\
