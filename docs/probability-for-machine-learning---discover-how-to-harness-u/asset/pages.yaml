    \ to maximize the likelihood:\n\nmax Σ_{i=1}^{n} log(yhat_i) × y_i + log(1 − yhat_i)\
    \ × (1 − y_i)   (13.27)\n\nIt is common practice to minimize a cost function for\
    \ optimization problems; therefore, we can invert the function so that we minimize\
    \ the negative log-likelihood:\n\nmin Σ_{i=1}^{n} −(log(yhat_i) × y_i + log(1\
    \ − yhat_i) × (1 − y_i))   (13.28)\n\nCalculating the negative of the log-likelihood\
    \ function for the Bernoulli distribution is equivalent to calculating the cross-entropy\
    \ function for the Bernoulli distribution, where p() represents the probability\
    \ of class 0 or class 1, and q() represents the estimation of the probability\
    \ distribution, in this case by our logistic regression model (this is described\
    \ further in Chapter 23).\n\ncross-entropy = −(log(q(class0)) × p(class0) + log(q(class1))\
