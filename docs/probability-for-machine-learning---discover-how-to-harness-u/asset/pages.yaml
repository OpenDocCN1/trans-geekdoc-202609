    Listing 25.2: Example output from defining and summarizing a test dataset.\n\n\
    Finally, we can define a probabilistic model for evaluating naive classification\
    \ strategies. In this case, we are interested in calculating the classification\
    \ accuracy of a given binary classification model.\n\n$$P(\\hat{y}=y) \\tag{25.1}$$\n\
    \nThis can be calculated as the probability of the model predicting each class\
    \ value multiplied by the probability of observing each class occurrence.\n\n\
    $$P(\\hat{y}=y) = P(\\hat{y}=0) \\times P(y=0) + P(\\hat{y}=1) \\times P(y=1)\
    \ \\tag{25.2}$$\n\nThis calculates the expected performance of a model on a dataset.\
    \ It provides a very simple probabilistic model that we can use to calculate the\
    \ expected performance of a naive classifier model in general. Next, we will use\
    \ this contrived prediction problem to explore different strategies for a naive\
    \ classifier.\n\n# 25.3 Predict a Random Guess\n\nPerhaps the simplest strategy\
    \ is to randomly guess one of the available classes for each prediction that is\
    \ required. We will call this the random-guess strategy. Using our probabilistic\
    \ model, we can calculate how well this model is expected to perform on average\
    \ on our contrived dataset. A random guess for each class is a uniform probability\
    \ distribution over each possible class label, or in the case of a two-class problem,\
    \ a probability of 0.5 for each class. Also, we know the expected probability\
    \ of the values for class-0 and class-1 for our dataset because we contrived the\
    \ problem; they are 0.25 and 0.75 respectively. Therefore, we calculate the average\
    \ performance of this strategy as follows:\n\n$$\\begin{aligned} P(\\hat{y}=y)\
    \ &= P(\\hat{y}=0) \\times P(y=0) + P(\\hat{y}=1) \\times P(y=1) \\\\ &= 0.5 \\\
    times 0.25 + 0.5 \\times 0.75 \\\\ &= 0.125 + 0.375 \\\\ &= 0.5 \\end{aligned}\
    \ \\tag{25.3}$$\n\nThis calculation suggests that the performance of predicting\
    \ a uniformly random class label on our contrived problem is 0.5 or 50% classification\
    \ accuracy. This might be surprising, which is good as it highlights the benefit\
    \ of systematically calculating the expected performance of a naive strategy.\
    \ We can confirm that this estimation is correct with a small experiment. The\
    \ strategy can be implemented as a function that randomly selects a 0 or 1 for\
    \ each prediction required.\n\n```\n```python\n# guess random class\ndef random_guess():\n\
    \    if random() < 0.5:\n```\n```"
