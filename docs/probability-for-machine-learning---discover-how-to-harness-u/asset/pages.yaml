    # 6.3 Boy or Girl Problem


    Another classic example of applied probability is the case of calculating the
    probability of whether a child is a boy or girl. The probability of whether a
    given child is a boy or a girl with no additional information is 50%. This may
    or may not be true in reality, but let''s assume it for the case of this useful
    illustration of probability. As soon as more information is included, the probability
    calculation changes, and this trips up even people versed in math and probability.
    A popular example is called the two-child problem that involves being given information
    about a family with two children and estimating the sex of one child. If the problem
    is not stated precisely, it can lead to misunderstanding, and in turn, two different
    ways of calculating the probability. This is the challenge of using natural language
    instead of notation, and in this case is referred to as the boy or girl paradox.
    Let''s look at two precisely stated examples.


    +   - **Case 1:** A woman has two children and the oldest is a boy. What is the
    probability of this woman having two sons?


    Consider a table of the unconditional probabilities.


    | Younger Child | Older Child | Unconditional Probability |

    |---|---|---|

    | Girl | Boy | 1/4 |

    | Boy | Boy | 1/4 |

    | Girl | Girl | 1/4 |

    | Boy | Girl | 1/4 |


    Listing 6.3: Example of combinations for boys and girls with no additional information.


    Our intuition suggests that the probability that the other child is a boy is 0.5
    or 50%. Alternately, our intuition might suggest the probability of a family with
    two boys is 1/4 (e.g. a probability of 0.25) for the four possible combinations
    of boys and girls for a two-child family. We can explore this by enumerating all
    possible combinations that include the information given:


    | Younger Child | Older Child | Conditional Probability |

    |---|---|---|

    | Girl | Boy | 1/2 |

    | Boy | Boy | 1/2 (*) |

    | Girl | Girl | 0 (impossible) |

    | Boy | Girl | 0 (impossible) |


    Listing 6.4: Example of combinations for boys and girls in case 1.


    The intuition is that the additional information makes some cases impossible.
    There would be four outcomes, but the information given reduces the domain to
    2 possible outcomes (older child is a boy). Indeed, only one of the two outcomes
    can be boy-boy, therefore the probability is 1/2 or (0.5) 50%. Let''s look at
    a second very similar case.


    +   - **Case 2:** A woman has two children and one of them is a boy. What is the
    probability of this woman having two sons?'
