- pgno: 44
  md: '# ## 5.2  Joint, Marginal, and Conditional Probabilities


    Calculating probability is relatively straightforward when working with a single
    random variable. It gets more interesting when considering two or more random
    variables, as we often do in many real world circumstances. There are three main
    types of probabilities that we may be interested in calculating when working with
    two (or more) random variables. Briefly, they are:


    +   - **Joint Probability.** The probability of simultaneous events.

    +   - **Marginal Probability.** The probability of an event irrespective of the
    other variables.

    +   - **Conditional Probability.** The probability of events given the presence
    of other events.


    The meaning and calculation of these different types of probabilities vary depending
    on whether the two random variables are independent (simpler) or dependent (more
    complicated). We will explore how to calculate and interpret these three types
    of probability with worked examples. In the next section, we will look at the
    independent rolls of two dice, and in the following section, we will look at the
    occurrence of weather events of two geographically close cities.


    # ## 5.3  Probabilities of Rolling Two Dice


    A good starting point for exploring joint and marginal probabilities is to consider
    independent random variables as the calculations are very simple. The roll of
    a fair die gives a one in six \(\left(\frac{1}{6}\right)\) or 0.166 (16.666%)
    probability of a particular number between 1 and 6 coming up.


    $$

    \begin{aligned}

    P(\text{dice1}=1) &= \frac{1}{6}\\

    P(\text{dice1}=2) &= \frac{1}{6}\\

    P(\text{dice1}=3) &= \frac{1}{6}\\

    P(\text{dice1}=4) &= \frac{1}{6}\\

    P(\text{dice1}=5) &= \frac{1}{6}\\

    P(\text{dice1}=6) &= \frac{1}{6}

    \end{aligned}

    \tag{5.1}

    $$


    If we roll a second die, we get the same probability of each value on that die.
    Each event for a die has an equal probability and the rolls of dice1 and dice2
    do not affect each other.


    $$

    \begin{aligned}

    P(\text{dice1} \in \{1,2,3,4,5,6\}) &= 1.0\\

    P(\text{dice2} \in \{1,2,3,4,5,6\}) &= 1.0

    \end{aligned}

    \tag{5.2}

    $$


    First, using exclusivity, we can calculate the probability of rolling an even
    number for dice1 as the sum of the probabilities of rolling a 2, 4, or 6, for
    example:


    $$

    \begin{aligned}

    P(\text{dice1} \in \{2,4,6\}) &= P(\text{dice1}=2) + P(\text{dice1}=4) + P(\text{dice1}=6)\\

    &= \frac{1}{6} + \frac{1}{6} + \frac{1}{6}

    \end{aligned}

    \tag{5.3}

    $$'
