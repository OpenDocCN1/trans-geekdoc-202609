- pgno: 242
  md: '# 24.2 What Is Information Gain?


    Information Gain, or IG for short, measures the reduction in entropy or surprise
    by splitting a dataset according to a given value of a random variable. A larger
    information gain suggests a lower entropy group or groups of samples, and hence
    less surprise. You might recall that information quantifies how surprising an
    event is in bits. Lower probability events have more information, higher probability
    events have less information. Entropy quantifies how much information there is
    in a random variable, or more specifically its probability distribution. A skewed
    distribution has a low entropy, whereas a distribution where events have equal
    probability has a larger entropy.


    In information theory, we like to describe the *surprise* of an event. Low probability
    events are more surprising therefore have a larger amount of information. Whereas
    probability distributions where the events are equally likely are more surprising
    and have larger entropy.


    +   - **Skewed Probability Distribution** (*unsurprising*): Low entropy.

    +   - **Balanced Probability Distribution** (*surprising*): High entropy.


    Now, let’s consider the entropy of a dataset. We can think about the entropy of
    a dataset in terms of the probability distribution of observations in the dataset
    belonging to one class or another, e.g. two classes in the case of a binary classification
    dataset.


    > > One interpretation of entropy from information theory is that it specifies
    the minimum number of bits of information needed to encode the classification
    of an arbitrary member of $S$ (i.e., a member of $S$ drawn at random with uniform
    probability).

    > >

    > > — Page 58, *Machine Learning*, 1997.


    For example, in a binary classification problem (two classes), we can calculate
    the entropy of the data sample as follows:


    $$Entropy = -(p(0) \times \log(P(0)) + p(1) \times \log(P(1))) \tag{24.1}$$


    A dataset with a 50/50 split of samples for the two classes would have a maximum
    entropy (maximum surprise) of 1 bit, whereas an imbalanced dataset with a split
    of 10/90 would have a smaller entropy as there would be less surprise for a randomly
    drawn example from the dataset. We can demonstrate this with an example of calculating
    the entropy for this imbalanced dataset in Python. The complete example is listed
    below.


    ```

    ```python

    # calculate the entropy for a dataset

    from math import log2

    # proportion of examples in each class

    class0 = 10/100

    class1 = 90/100

    # calculate entropy

    entropy = -(class0 * log2(class0) + class1 * log2(class1))

    # print the result

    print(''entropy: %.3f bits'' % entropy)

    ```

    ```


    Listing 24.1: Example of calculating entropy.'
