    # 19.5 Hyperparameter Tuning With Bayesian Optimization


    It can be a useful exercise to implement Bayesian Optimization to learn how it
    works. In practice, when using Bayesian Optimization on a project, it is a good
    idea to use a standard implementation provided in an open-source library. This
    is to both avoid bugs and to leverage a wider range of configuration options and
    speed improvements. Two popular libraries for Bayesian Optimization include Scikit-Optimize
    and HyperOpt. In machine learning, these libraries are often used to tune the
    hyperparameters of algorithms. Hyperparameter tuning is a good fit for Bayesian
    Optimization because the evaluation function is computationally expensive (e.g.
    training models for each set of hyperparameters) and noisy (e.g. noise in training
    data and stochastic learning algorithms).


    In this section, we will take a brief look at how to use the Scikit-Optimize library
    to optimize the hyperparameters of a k-nearest neighbor classifier for a simple
    test classification problem. This will provide a useful template that you can
    use on your own projects. The Scikit-Optimize project is designed to provide access
    to Bayesian Optimization for applications that use SciPy and NumPy, or applications
