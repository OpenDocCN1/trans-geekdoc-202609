    is not the same as the probability of it being sunny in city2 given that it is
    sunny in city1.


    $$P(\text{city1=sunny}|\text{city2=sunny}) \neq P(\text{city2=sunny}|\text{city1=sunny})
    \tag{5.19}$$


    In this case, the probability of it being sunny in city2 given that it is sunny
    in city1 is calculated as follows:


    $$P(\text{city2=sunny}|\text{city1=sunny}) = \frac{P(\text{city2=sunny} \cap \text{city1=sunny})}{P(\text{city1=sunny})}$$

    $$= \frac{\frac{6}{20}}{\frac{7}{20}}$$

    $$= \frac{0.3}{0.35}$$

    $$= 0.857 \tag{5.20}$$


    In this case, it is higher, at about 85.714%. We can also use the conditional
    probability to calculate the joint probability.


    $$P(A \cap B) = P(A|B) \times P(B) \tag{5.21}$$


    For example, if all we know is the conditional probability of sunny in city2 given
    that it is sunny in city1 and the marginal probability of city2, we can calculate
    the joint probability as:


    $$P(\text{city1=sunny} \cap \text{city2=sunny}) = P(\text{city2=sunny}|\text{city1=sunny})
    \times P(\text{city1=sunny})$$

    $$= 0.857 \times 0.35$$

    $$= 0.3 \tag{5.22}$$


    This gives 0.3 or 30% as we expected.


    # 5.5 Further Reading


    This section provides more resources on the topic if you are looking to go deeper.'
