    \ encode the class label for an arbitrary example from the dataset.\n\n```\nentropy:\
    \ 0.469 bits\n```\n\nListing 24.2: Example output from calculating entropy.\n\n\
    In this way, entropy can be used as a calculation of the purity of a dataset,\
    \ e.g. how balanced the distribution of classes happens to be. An entropy of 0\
    \ bits indicates a dataset containing one class; an entropy of 1 or more bits\
    \ suggests maximum entropy for a balanced dataset (depending on the number of\
    \ classes), with values in between indicating levels between these extremes. Information\
    \ gain provides a way to use entropy to calculate how a change to the dataset\
    \ impacts the purity of the dataset, e.g. the distribution of classes. A smaller\
    \ entropy suggests more purity or less surprise.\n\n> > ... information gain,\
    \ is simply the expected reduction in entropy caused by partitioning the examples\
    \ according to this attribute.\n> \n> — Page 57, *Machine Learning*, 1997.\n\n\
    For example, we may wish to evaluate the impact on purity by splitting a dataset\
    \ S by a random variable with a range of values. This can be calculated as follows:\n\
    \n$IG(S, a) = H(S) - H(S|a)$\n(24.2)\n\nWhere $IG(S, a)$ is the information for\
    \ the dataset $S$ for the variable $a$ for a random variable, $H(S)$ is the entropy\
    \ for the dataset before any change (described above) and $H(S|a)$ is the conditional\
    \ entropy for the dataset given the variable $a$. This calculation describes the\
    \ gain in the dataset $S$ for the variable $a$. It is the number of bits saved\
    \ when transforming the dataset. The conditional entropy can be calculated by\
    \ splitting the dataset into groups for each observed value of $a$ and calculating\
    \ the sum of the ratio of examples in each group out of the entire dataset multiplied\
    \ by the entropy of each group.\n\n$H(S|a) = \\sum_{\\{v\\in a\\}} \\frac{Sa(v)}{S}\
    \ \\times H(Sa(v))$\n(24.3)\n\nWhere $\\frac{Sa(v)}{S}$ is the ratio of the number\
    \ of examples in the dataset with variable $a$ has the value $v$, and $H(Sa(v))$\
    \ is the entropy of group of samples where variable $a$ has the value $v$. This\
    \ might sound a little confusing. We can make the calculation of information gain\
    \ concrete with a worked example.\n\n# 24.3 Worked Example of Calculating Information\
    \ Gain\n\nIn this section, we will make the calculation of information gain concrete\
    \ with a worked example. We can define a function to calculate the entropy of\
    \ a group of samples based on the ratio of samples that belong to class 0 and\
    \ class 1."
