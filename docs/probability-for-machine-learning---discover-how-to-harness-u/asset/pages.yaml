- pgno: 237
  md: '# 23.6.1  Log Loss is the Negative Log Likelihood


    Logistic loss refers to the loss function commonly used to optimize a logistic
    regression model. It may also be referred to as logarithmic loss (which is confusing)
    or simply log loss. Many models are optimized under a probabilistic framework
    called maximum likelihood estimation, or MLE, that involves finding a set of parameters
    that best explain the observed data.


    This involves selecting a likelihood function that defines how likely a set of
    observations (data) are given model parameters. When a log likelihood function
    is used (which is common), it is often referred to as optimizing the log likelihood
    for the model. Because it is more common to minimize a function than to maximize
    it in practice, the log likelihood function is inverted by adding a negative sign
    to the front. This transforms it into a Negative Log Likelihood function or NLL
    for short. In deriving the log likelihood function under a framework of maximum
    likelihood estimation for a Bernoulli probability distribution functions (two
    classes), the calculation comes out to be:


    $$\mathrm{NLL}(P,Q) = -\big(P(\mathit{class0}) \times \log(Q(\mathit{class0}))
    + P(\mathit{class1}) \times \log(Q(\mathit{class1}))\big) \tag{23.9}$$


    This quantity can be averaged over all training examples by calculating the average
    of the log of the likelihood function. Negative log-likelihood for binary classification
    problems is often shortened to simply *log loss* as the loss function derived
    for logistic regression.


    $$\text{log loss} = \text{negative log-likelihood, under a Bernoulli probability
    distribution} \tag{23.10}$$


    We can see that the negative log-likelihood is the same calculation as is used
    for the cross-entropy for Bernoulli probability distribution functions (two events
    or classes). In fact, the negative log-likelihood for Multinoulli distributions
    (multiclass classification) also matches the calculation for cross-entropy.


    # 23.6.2  Log Loss and Cross Entropy Calculate the Same Thing


    For binary classification problems, *log loss*, *cross-entropy* and *negative
    log-likelihood* are used interchangeably. More generally, the terms *cross-entropy*
    and *negative log-likelihood* are used interchangeably in the context of loss
    functions for classification models.


    > The negative log-likelihood for logistic regression is given by [...] This is
    also called the cross-entropy error function.


    > — Page 246, *Machine Learning: A Probabilistic Perspective*, 2012.


    Therefore, calculating log loss will give the same quantity as calculating the
    cross-entropy for Bernoulli probability distribution. We can confirm this by calculating
    the log loss using the `log_loss()` function from the scikit-learn API. Calculating
    the average log loss on the same set of actual and predicted probabilities from
    the previous section should give the same result as calculating the average cross-entropy.
    The complete example is listed below.'
