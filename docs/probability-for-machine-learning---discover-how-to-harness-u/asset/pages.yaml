  md: '![](img/6ef657cfead7281442f755181c4f6e50_94_0.png)


    Figure 10.2: Histogram Plot With 3 Bins of a Random Data Sample.


    Reviewing a histogram of a data sample with a range of different numbers of bins
    will help to identify whether the density looks like a common probability distribution
    or not. In most cases, you will see a unimodal distribution, such as the familiar
    bell shape of the normal, the flat shape of the uniform, or the descending or
    ascending shape of an exponential or Pareto distribution. You might also see complex
    distributions, such as two peaks that don’t disappear with different numbers of
    bins, referred to as a bimodal distribution, or multiple peaks, referred to as
    a multimodal distribution. You might also see a large spike in density for a given
    value or small range of values indicating outliers, often occurring on the tail
    of a distribution far away from the rest of the density.


    # 10.4 Parametric Density Estimation


    The shape of a histogram of most random samples will match a well-known probability
    distribution. The common distributions are common because they occur again and
    again in different and sometimes unexpected domains. Get familiar with the common
    probability distributions as it will help you to identify a given distribution
    from a histogram. Once identified, you can attempt to estimate the density of
    the random variable with a chosen probability distribution. This can be achieved
    by estimating the parameters of the distribution from a random sample of data.'
