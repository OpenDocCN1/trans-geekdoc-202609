- pgno: 97
  md: '![](img/6ef657cfead7281442f755181c4f6e50_97_0.png)


    Figure 10.3: Data Sample Histogram With Probability Density Function Overlay for
    the Normal Distribution.


    It is possible that the data does match a common probability distribution, but
    requires a transformation before parametric density estimation. For example, you
    may have outlier values that are far from the mean or center of mass of the distribution.
    This may have the effect of giving incorrect estimates of the distribution parameters
    and, in turn, causing a poor fit to the data. These outliers should be removed
    prior to estimating the distribution parameters. Another example is the data may
    have a skew or be shifted left or right. In this case, you might need to transform
    the data prior to estimating the parameters, such as taking the log or square
    root, or more generally, using a power transform like the Box-Cox transform. These
    types of modifications to the data may not be obvious and effective parametric
    density estimation may require an iterative process of:


    +   - Loop Until Fit of Distribution to Data is Good Enough:

    +     1. Estimating distribution parameters

    +     2. Reviewing the resulting PDF against the data

    +     3. Transforming the data to better fit the distribution'
