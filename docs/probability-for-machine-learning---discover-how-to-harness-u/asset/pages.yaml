  img_proc: true
- pgno: 63
  md: '# 7.2 Random Variables


    A random variable is a quantity that is produced by a random process. In probability,
    a random variable can take on one of many possible values, e.g. events from the
    state space. A specific value or set of values for a random variable can be assigned
    a probability.


    In probability modeling, example data or instances are often thought of as being
    events, observations, or realizations of underlying random variables.


    > — Page 336, Data Mining: Practical Machine Learning Tools and Techniques, 4th
    edition. 2016.


    A random variable is often denoted as a capital letter, e.g. X, and values of
    the random variable are denoted as a lowercase letter and an index, e.g. x₁, x₂,
    x₃.


    Upper-case letters like X denote a random variable, while lower-case letters like
    x denote the value that the random variable takes.


    > — Page viii, Probability: For the Enthusiastic Beginner, 2016.


    The values that a random variable can take is called its domain, and the domain
    of a random variable may be discrete or continuous.


    Variables in probability theory are called random variables and their names begin
    with an uppercase letter. [...] Every random variable has a domain — the set of
    possible values it can take on.


    > — Page 486, Artificial Intelligence: A Modern Approach, 3rd edition, 2009.


    A discrete random variable has a finite set of states: for example, colors of
    a car. A random variable that has values true or false is discrete and is referred
    to as a Boolean random variable: for example, a coin toss. A continuous random
    variable has a range of numerical values: for example, the height of humans.


    +   - **Discrete Random Variable**. Values are drawn from a finite set of states.

    +   - **Boolean Random Variable**. Values are drawn from the set of {true, false}.

    +   - **Continuous Random Variable**. Values are drawn from a range of real-valued
    numerical values.


    A value of a random variable can be specified via an equals operator: for example,
    X = True. The probability of a random variable is denoted as a function using
    the upper case P or Pr; for example, P(X) is the probability of all values for
    the random variable X. The probability of a value of a random variable can be
    denoted P(X = True), in this case indicating the probability of the X random variable
    having the value True.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# ## 7.3 Probability Distribution


    A probability distribution is a summary of probabilities for the possible values
    of a random variable. As a distribution, the mapping of the values of a random
    variable to a probability has a shape when all values of the random variable are
    lined up. The distribution also has general properties that can be measured. Two
    important properties of a probability distribution are the expected value and
    the variance. Mathematically, these are referred to as the first and second moments
    of the distribution. Other moments include the skewness (3rd moment) and the kurtosis
    (4th moment).


    You may be familiar with the mean and variance from statistics, where the concepts
    are generalized to random variable distributions other than probability distributions.
    The expected value is the average or mean value of a random variable $X$. This
    is the most likely value or the outcome with the highest probability. It is typically
    denoted as a function of the uppercase letter $E$ with square brackets: for example,
    $E[X]$ for the expected value of $X$ or $E[f(x)]$ where the function $f()$ is
    used to sample a value from the domain of $X$.


    > The expectation value (or the mean) of a random variable $X$ is denoted by $E(X)$.


    > — Page 134, *Probability: For the Enthusiastic Beginner*, 2016.


    The variance is the spread of the values of a random variable from the mean. This
    is typically denoted as a function $Var$; for example, $Var(X)$ is the variance
    of the random variable $X$ or $Var(f(x))$ for the variance of values drawn from
    the domain of $X$ using the function $f()$. The square root of the variance normalizes
    the value and is referred to as the standard deviation. The variance between two
    variables is called the covariance and summarizes the linear relationship for
    how two random variables change together.


    +   - **Expected Value.** The average value of a random variable.

    +   - **Variance.** The average spread of values around the expected value.


    Each random variable has its own probability distribution, although the probability
    distribution of many different random variables may have the same shape. Most
    common probability distributions can be defined using a few parameters and provide
    procedures for calculating the expected value and the variance. The structure
    of the probability distribution will differ depending on whether the random variable
    is discrete or continuous.


    # ## 7.4 Discrete Probability Distributions


    A discrete probability distribution summarizes the probabilities for a discrete
    random variable. The probability mass function, or PMF, defines the probability
    distribution for a discrete random variable. It is a function that assigns a probability
    for specific discrete values. A discrete probability distribution has a cumulative
    distribution function, or CDF. This is a function that assigns a probability that
    a discrete random variable will have a value of less than or equal to a specific
    discrete value.


    +   - **Probability Mass Function.** Probability for a value for a discrete random
    variable.'
  merge: -1
  img_proc: true
