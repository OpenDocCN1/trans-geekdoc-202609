  md: '# Chapter 25


    # How to Develop and Evaluate Naive Classifier Strategies


    A Naive Classifier is a simple classification model that assumes little to nothing
    about the problem and the performance of which provides a baseline by which all
    other models evaluated on a dataset can be compared. There are different strategies
    that can be used for a naive classifier, and some are better than others, depending
    on the dataset and the choice of performance measures. The most common performance
    measure is classification accuracy and common naive classification strategies,
    including randomly guessing class labels, randomly choosing labels from a training
    dataset, and using a majority class label. It is useful to develop a small probability
    framework to calculate the expected performance of a given naive classification
    strategy and to perform experiments to confirm the theoretical expectations. These
    exercises provide an intuition both for the behavior of naive classification algorithms
    in general, and the importance of establishing a performance baseline for a classification
    task. In this tutorial, you will discover how to develop and evaluate naive classification
    strategies for machine learning. After completing this tutorial, you will know:


    +   - The performance of naive classification models provides a baseline by which
    all other models can be deemed skillful or not.

    +   - The majority class classifier achieves better accuracy than other naive
    classifier models such as random guessing and predicting a randomly selected observed
    class label.

    +   - Naive classifier strategies can be used on predictive modeling projects
    via the `DummyClassifier` class in the scikit-learn library.


    Let’s get started.


    # 25.1 Tutorial Overview


    This tutorial is divided into five parts; they are:


    +   1. Naive Classifier

    +   2. Predict a Random Guess'
