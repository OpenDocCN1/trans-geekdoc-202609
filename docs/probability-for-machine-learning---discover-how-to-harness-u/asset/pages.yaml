    Listing 28.3: Example of the API for calibrating probabilities with cross-validation.


    The `CalibratedClassifierCV` class supports two types of probability calibration;
    specifically, the parametric ‘sigmoid’ method (Platt’s method) and the nonparametric
    ‘isotonic’ method which can be specified via the `method` argument.


    # 28.5 Worked Example of Calibrating SVM Probabilities


    We can make the discussion of calibration concrete with some worked examples.
    In these examples, we will fit a support vector machine (SVM) to a noisy binary
    classification problem and use the model to predict probabilities, then review
    the calibration using a reliability diagram and calibrate the classifier and review
    the result. SVM is a good candidate model to calibrate because it does not natively
    predict probabilities, meaning the probabilities are often uncalibrated.


    **A note on SVM:** probabilities can be predicted by calling the `decision_function()`
    function on the fit model instead of the usual `predict_proba()` function. The
    probabilities are not normalized, but can be normalized when calling the `calibration_curve()`
    function by setting the `normalize` argument to `True`. The example below fits
    an SVM model on the test problem, predicted probabilities, and plots the calibration
    of the probabilities as a reliability diagram,


    ```

    # SVM reliability diagram

    from sklearn.datasets import make_classification

    from sklearn.svm import SVC

    from sklearn.model_selection import train_test_split

    from sklearn.calibration import calibration_curve

    from matplotlib import pyplot

    # generate 2 class dataset

    X, y = make_classification(n_samples=1000, n_classes=2, weights=[1,1], random_state=1)

    # split into train/test sets

    trainX, testX, trainy, testy = train_test_split(X, y, test_size=0.5, random_state=2)

    # fit a model

    model = SVC(gamma=''scale'')

    model.fit(trainX, trainy)

    # predict probabilities

    probs = model.decision_function(testX)

    # reliability diagram

    fop, mpv = calibration_curve(testy, probs, n_bins=10, normalize=True)

    ```'
