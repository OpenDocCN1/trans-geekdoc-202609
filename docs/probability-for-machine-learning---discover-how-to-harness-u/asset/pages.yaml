- pgno: 11
  md: '# Practitioners Study Probability Wrong


    It’s worse than this. Regardless of the medium used to learn probability, be it
    books, videos, or course material, machine learning practitioners study probability
    the wrong way. Because the material is intended for undergraduate students that
    need to pass a test, the material is focused on the math, theory, proofs, and
    derivations. This is great for testing students but terrible for practitioners
    that need results. Practitioners need methods that clearly state when they are
    appropriate and instruction on how to interpret the results. They need intuitions
    behind the complex equations. They need code examples that they can use immediately
    on their project.


    # A Better Way


    I set out to write a playbook for machine learning practitioners that gives them
    only those parts of probability that they need to be more effective at working
    through a predictive modeling project. I set out to present probability methods
    in the way that practitioners learn: that is with simple language and working
    code examples. Probability is important to machine learning, and I believe that
    if it is taught at the right level for practitioners, it can be a fascinating,
    fun, directly applicable, and immeasurably useful area of study. I hope that you
    agree.


    Jason Brownlee


    2020'
  merge: -1
  img_proc: true
