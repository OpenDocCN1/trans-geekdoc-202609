    \ the JS distance score, not a divergence score. We can use this function to confirm\
    \ our manual calculation of the JS distance. The complete example is listed below.\n\
    \n```\n# calculate the jensen-shannon distance metric\nfrom scipy.spatial.distance\
    \ import jensenshannon\nfrom numpy import asarray\n# define distributions\np =\
    \ asarray([0.10, 0.40, 0.50])\nq = asarray([0.80, 0.15, 0.05])\n# calculate JS(P\
    \ || Q)\njs_pq = jensenshannon(p, q, base=2)\nprint('JS(P || Q) Distance: %.3f'\
    \ % js_pq)\n# calculate JS(Q || P)\njs_qp = jensenshannon(q, p, base=2)\nprint('JS(Q\
    \ || P) Distance: %.3f' % js_qp)\n```\n\nListing 22.15: Example of calculating\
    \ the JS divergence between two probability distributions with SciPy.\n\nRunning\
    \ the example, we can confirm the distance score matches our manual calculation\
    \ of 0.648, and that the distance calculation is symmetrical as expected."
