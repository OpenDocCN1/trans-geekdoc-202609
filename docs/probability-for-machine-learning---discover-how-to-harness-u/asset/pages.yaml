  md: '```

    Sepal length:  5.1 cm

    Sepal width:   3.5 cm

    Petal length:  1.4 cm

    Petal width:   0.2 cm

    Species:       ?

    ```


    Listing 2.2: Example of measurements and missing class label.


    Noise refers to variability in the observation. Variability could be natural,
    such as a larger or smaller flower than normal. It could also be an error, such
    as a slip when measuring or a typo when writing it down. This variability impacts
    not just the inputs or measurements but also the outputs; for example, an observation
    could have an incorrect class label. This means that although we have observations
    for the domain, we must expect some variability or randomness.


    The real world, and in turn, real data, is messy or imperfect. As practitioners,
    we must remain skeptical of the data and develop systems to expect and even harness
    this uncertainty. This is why so much time is spent on reviewing statistics of
    data and creating visualizations to help identify those aberrant or unusual cases:
    so-called data cleaning.


    # 2.4 Incomplete Coverage of the Domain


    Observations from a domain used to train a model are a sample and incomplete by
    definition. In statistics, a random sample refers to a collection of observations
    chosen from the domain without systematic bias (e.g. uniformly random). Nevertheless,
    there will always be some limitation that will introduce bias. For example, we
    might choose to measure the size of randomly selected flowers in one garden. The
    flowers are randomly selected, but the scope is limited to one garden. Scope can
    be increased to gardens in one city, across a country, across a continent, and
    so on.


    An appropriate level of variance and bias in the sample is required such that
    the sample is representative of the task or project for which the data or model
    will be used. We aim to collect or obtain a suitably representative random sample
    of observations to train and evaluate a machine learning model. Often, we have
    little control over the sampling process. Instead, we access a database or CSV
    file and the data we have is the data we must work with. In all cases, we will
    never have all of the observations. If we did, a predictive model would not be
    required. This means that there will always be some unobserved cases. There will
    be part of the problem domain for which we do not have coverage. No matter how
    well we encourage our models to generalize, we can only hope that we can cover
    the cases in the training dataset and the salient cases that are not.


    This is why we split a dataset into train and test sets or use resampling methods
    like *k*-fold cross-validation. We do this to handle the uncertainty in the representativeness
    of our dataset and estimate the performance of a modeling procedure on data not
    used in that procedure.


    # 2.5 Imperfect Model of the Problem


    A machine learning model will always have some error. This is often summarized
    as *all models are wrong*, or more completely in an aphorism by George Box:


    > > All models are wrong but some are useful'
