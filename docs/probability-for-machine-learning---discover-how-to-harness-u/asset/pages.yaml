  md: '# 27.5 What Are Precision-Recall Curves?


    There are many ways to evaluate the skill of a prediction model. An approach in
    the related field of information retrieval (finding documents based on queries)
    measures precision and recall. These measures are also useful in applied machine
    learning for evaluating binary classification models. Precision is a ratio of
    the number of true positives divided by the sum of the true positives and false
    positives. It describes how good a model is at predicting the positive class.
    Precision is referred to as the positive predictive value.


    Positive Predictive Power = True Positives / (True Positives + False Positives)  (27.6)


    Or:


    Precision = True Positives / (True Positives + False Positives)  (27.7)


    Recall is calculated as the ratio of the number of true positives divided by the
    sum of the true positives and the false negatives. Recall is the same as sensitivity,
    and the true-positive rate.


    Recall = True Positives / (True Positives + False Negatives)  (27.8)


    Or:


    Sensitivity = True Positives / (True Positives + False Negatives)  (27.9)


    Where:


    Recall ≡ Sensitivity  (27.10)


    Reviewing both precision and recall is useful in cases where there is an imbalance
    in the observations between the two classes. Specifically, there are many examples
    of no event (class 0) and only a few examples of an event (class 1). The reason
    for this is that typically the large number of class 0 examples means we are less
    interested in the skill of the model at predicting class 0 correctly, e.g. high
    true negatives. Key to the calculation of precision and recall is that the calculations
    do not make use of the true negatives. It is only concerned with the correct prediction
    of the minority class, class 1.


    A precision-recall curve is a plot of the precision (y-axis) and the recall (x-axis)
    for different thresholds, much like the ROC curve. A no-skill classifier is one
    that cannot discriminate between the classes and would predict a random class
    or a constant class in all cases. The no-skill line changes based on the distribution
    of the positive to negative classes. It is a horizontal line with the value of
    the ratio of positive cases in the dataset. For a balanced dataset, this is 0.5.
    A model with perfect skill is depicted as a point at (1,1). A skillful model is
    represented by a curve that bows towards (1,1) above the flat line of no skill.
    There are also composite scores that attempt to summarize the precision and recall;
    two examples include:


    +   - **F-Measure or F1 score**: that calculates the harmonic mean of the precision
    and recall (harmonic mean because the precision and recall are ratios).'
