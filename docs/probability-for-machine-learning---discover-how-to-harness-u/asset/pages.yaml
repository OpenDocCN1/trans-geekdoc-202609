  md: '# 18.2 Conditional Probability Model of Classification


    In machine learning, we are often interested in a predictive modeling problem
    where we want to predict a class label for a given observation. For example, classifying
    the species of plant based on measurements of the flower. Problems of this type
    are referred to as classification predictive modeling problems, as opposed to
    regression problems that involve predicting a numerical value. The observation
    or input to the model is referred to as X and the class label or output of the
    model is referred to as y. Together, X and y represent observations collected
    from the domain, i.e. a table or matrix (columns and rows or features and samples)
    of training data used to fit a model. The model must learn how to map specific
    examples to class labels or y = f(X) that minimized the error of misclassification.


    One approach to solving this problem is to develop a probabilistic model. From
    a probabilistic perspective, we are interested in estimating the conditional probability
    of the class label, given the observation. For example, a classification problem
    may have k class labels y1, y2, ⋯ , yk and n input variables, X1, X2, ⋯ , Xn.
    We can calculate the conditional probability for a class label with a given instance
    or set of input values for each column x1, x2, ⋯ , xn as follows:


    P(y_i|x1, x2, ⋯ , x_n) (18.1)


    The conditional probability can then be calculated for each class label in the
    problem and the label with the highest probability can be returned as the most
    likely classification. The conditional probability can be calculated using the
    joint probability, although it would be intractable. Bayes Theorem provides a
    principled way for calculating the conditional probability. The simple form of
    the calculation for Bayes Theorem is as follows:


    P(A|B) = P(B|A) × P(A) / P(B) (18.2)


    Where the probability that we are interested in calculating P(A|B) is called the
    posterior probability and the marginal probability of the event P(A) is called
    the prior. We can frame classification as a conditional classification problem
    with Bayes Theorem as follows:


    P(y_i|x1, x2, ⋯ , x_n) = P(x1, x2, ⋯ , x_n|y_i) × P(y_i) / P(x1, x2, ⋯ , x_n)
    (18.3)


    The prior P(y_i) is easy to estimate from a dataset, but the conditional probability
    of the observation based on the class P(x1, x2, ⋯ , x_n|y_i) is not feasible unless
    the number of examples is extraordinarily large, e.g. large enough to effectively
    estimate the probability distribution for all different possible combinations
    of values. As such, the direct application of Bayes Theorem also becomes intractable,
    especially as the number of variables or features (n) increases.


    # 18.3 Simplified or Naive Bayes


    The solution to using Bayes Theorem for a conditional probability classification
    model is to simplify the calculation. The Bayes Theorem assumes that each input
    variable is dependent upon all other variables. This is a cause of complexity
    in the calculation. We can remove this assumption and consider each input variable
    as being independent from each other. This'
