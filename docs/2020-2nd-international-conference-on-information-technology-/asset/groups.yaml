    **Abstract**—With the vigorous development of the Internet of Things (IoT), the
    cybersecurity issues of the IoT are emerging. Putting IoT security into priorities
    has become a common practice in many countries around the world. In this paper
    we discuss the relevant regulations, strategies, standards, guidelines, and other
    policy documents released by domestic and foreign governments. In recent years,
    the paper focuses on comparison and analysis of the IoT security policies in US,
    EU, and China. The development of China''s IoT security policies. Based on this,
    we give some suggestions for the development of IoT security in China and accelerate
    the development of China''s IoT security.


    **Keywords** - Internet of things; security; policy; consumer


    # I. INTRODUCTION


    The Internet of Things (IoT) has entered a new stage of development by making
    things intelligent and connected. As the IoT becomes critical infrastructure,
    it is expected that the utilization and expansion of cyberspace for IoT will be
    incorporated into the strategic planning of every development in many countries,
    which has been used to balance and enhance the competitive advantage of the IoT
    industry security. With the rapid development of IPv6, the popularity of network
    attacks attacking IoT devices is increasing, and cybersecurity issues have become
    an essential factor for the practical application and sustainable development.
    Moreover, IoT has attracted great interest to the top-level design of IoT security
    and the construction of the policy environment. By analyzing the characteristics
    of the IoT security policies in countries, such as the US, EU, UK, Australia,
    it can provide relevant insights and experiences in China to understand the development
    of foreign IoT security.


    # II. ANALYSIS OF FOREIGN COUNTRIES'' IoT SECURITY POLICY


    ## A. US: Adverse to top-level strategic planning and policy guidelines


    As one of the leaders and pioneers of the IoT technology, development of national-level
    IoT security research and the strategic plan has become an essential reference
    to guide development of the IoT in the US. At the end of 2016, the security incident
    reports highlighted the security issue of the IoT to the height of homeland security,
    the US Department of Homeland Security used a set of Principles for Securing the
    Internet of Things (IoT), Version 1 federal government''s mandate to ensure the
    security of the IoT, the white papers cover cross-departmental cooperation, the
    promotion of national security awareness, the promotion of IoT development and
    manufacturing. These standards were established and sought for practices to protect
    the IoT''s security and would equip stakeholders to manage and risk-based security
    challenges, including manufacturing, connected devices or services. Then, as the
    US government has accelerated the development of IoT policy documents to strengthen
    the development of IoT security management, improve the management mechanisms,
    development and control capabilities. Since 2017, the IoT security-related policies
    and regulations are shown in Table I.


    # TABLE I. THE IoT SECURITY RELATED POLICIES AND REGULATIONS


    | Time | File Name | IoT security-related |

    |---|---|---|

    | June 13, 2017 | Promoting Stakeholder Agreement and Othered Capabilities of
    IoT Security | Seek insight from private industry, academia, and society, and
