    ## 四、 中国物联网安全政策的发展


    ### A. 发展现状


    2009年，物联网成为中国五大战略性新兴产业之一，物联网的网络安全问题引起了关注。无论已发布的发展规划、指南、安全法规，还是正在制定的技术规范，物联网的安全问题都被纳入考虑范围。


    ## 三、 外物联网安全政策的特点


    ### A. 设备安全与消费者隐私保护是重点


    随着5G 商业化的加速和 IPv6 的普及，物联网正向数十亿智能产品的互联互通指数级增长 [5]。物联网的安全问题也日益突出。制造、集成和使用物联网设备的安全变得越来越至重要。在物联网政策的制定上，美国、欧盟等国家侧重于加强物联网消费者安全的趋势。内容重点集中在更改默认密码、推进安全与漏洞管理、确保数据和设备参数的完整性、简化操作程序以及保障通信和法律验证。它们可以为保护组织的物联网设备、消费者和实体提供指导。


    2014年，中华人民共和国工业和信息化部（MIIT）发布了指南，旨在建立和保障物联网安全体系，加强物联网安全标准的制定和实施 [7]。“十二五”规划明确指出了物联网的发展与安全问题。当时，有必要解决安全与信用的问题。考虑到物联网的发展趋势，工信部于2014年发布的《中国互联网白皮书》应对了相关风险，提出了安全防护策略框架，并指出了未来的发展和方向。同年，进一步强调了物联网的安全要求。


    ### B. 基于选择的群体协作制定政策标准


    在整个国外物联网政策形势中，物联网网络安全战略的工作聚焦于共赢合作的概念。例如，美国更多地依赖私营部门开发物联网政策，包括公司、行业、学术机构、专业协会、消费者群体等。英国的物联网政策强调了通过公私合作伙伴关系进行合作和建立信任的重要性，并表示将与国际组织、合作伙伴、私营和民用部门合作，提高网络安全能力。数字、文化和媒体部在45个机构和实体的支持下制定英国物联网安全政策。涉及所有力量的工作机制为……的推进和实施提供了保障。


    同年，进一步强调了物联网的安全要求。在5G和物联网等关键领域，通过结合新一代信息技术。并且他们可能会根据领域的发展和对数据安全保护的需求，制定相关的数据安全标准（见
    Li 等人，2016）。


    ### B. 发展不平衡


    从中国物联网网络安全的发展过程和政策文件来看，结合技术规范，中国的物联网安全政策的发展仍处于非常早期阶段。在物联网安全相关的法律法规、核心基准和规范的制定方面仍存在空白，在中国物联网的安全监管和实施方面也存在不足。正如物联网发展长程中所提到的，一系列利益相关者尚未充分参与物联网生态系统的构建。跨领域和跨行业的互操作问题尚未得到良好解决。


    ### C. 漏洞策略已成为热点。


    在物联网网络安全实践中，指南、基准和其他政策文件日益强调漏洞披露政策和报告管理。漏洞管理策略需要提供一个清晰透明的漏洞披露政策，简化安全研究人员和其他利益相关者的报告系统，并持续更新漏洞披露策略。此外，利益相关者或国家当局将承诺


    然而，随着工业设备和消费者物联网设备接入量的大幅增加，这也为中国物联网安全政策和安全监管的发展带来了巨大的空间。


    ## 五、 关于促进中国物联网安全发展的建议


    根据分析，美国、欧盟、英国、澳大利亚从物联网网络安全政策的角度开展战略，结合当前物联网网络安全政策的发展，以下建议对中国物联网网络安全的发展具有前瞻性。


    ### A. 增强物联网安全监管效能，加速消费者物联网的安全布局。


    我们积极从欧盟等国家在物联网安全监管方面的典型特征借鉴经验，并考虑到中国的多元化需求。'
