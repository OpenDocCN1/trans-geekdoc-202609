    # 2020年第二届信息技术与计算机应用国际会议 (ITCA)


    # 国内外物联网安全政策研究


    刚占辉 (Zhan-Hui Gang)

    监测与应急研究所

    中国工业控制系统网络应急响应小组

    中国，北京

    ganghanhui@cics-cert.org


    雅长月 (Chang-Yue Ya)*

    行业管理促进中心

    中国电子标准化研究院

    中国，北京

    ''yuchangyue@aliyun.com


    黄海波 (Hai-Bao Huang)

    经济与管理学院

    北京邮电大学

    中国，北京

    pochuang@163.com


    王利军 (Li-Jun Wang)

    监测与应急研究所

    中国工业控制系统网络应急响应小组

    中国，北京

    wlj0228@163.com


    **摘要**——随着物联网（IoT）的蓬勃发展，物联网的网络安全问题层出不穷。将物联网安全置于优先位置已成为全球许多国家的共同惯例。本文讨论了国内外政府发布的的相关法规、策略、标准、指南及其他政策文件。近年来，本文重点对美国、欧盟和中国的物联网安全政策进行了比较和分析。在此基础上，我们对中国物联网安全的发展提出了一些建议，以促进和加速中国物联网安全水平的提升。


    **关键词**- 物联网；安全；政策；消费者


    # I. 引言


    物联网（IoT）通过使万物智能化和互联已进入发展新阶段。随着物联网成为关键基础设施，预计各国对物联网网络空间的利用和扩展将纳入每个国家各项发展的战略规划中，用以平衡和增强物联网行业安全的竞争优势。随着IPv6的快速发展，攻击物联网设备的网络攻击日益频繁，网络安全问题已成为实际应用和可持续发展的要素要素。此外，物联网引起了对物联网安全顶层设计和政策环境建设的极大关注。通过分析美国、欧盟、英国、澳大利亚等国家物联网安全政策的特点可以为中国提供相关的见解和经验，以了解国外物联网安全的发展。


    # II. 外国物联网安全政策分析


    ## A. 美国：注重顶层战略规划和政策指南


    作为物联网技术的领导者和先驱之一，国家级物联网安全研究和战略规划已成为指导美国物联网发展的重要参考。2016年底，安全事件报告将物联网安全问题推到了国土安全的高度，美国国土安全部使用了《物联网安全原则》（Principles
    for Securing the Internet of Things）第1版联邦政府指令以确保物联网安全，白皮书涵盖了跨部门合作、提升国家安全意识、促进物联网发展与制造。这些标准的建立和寻求实践旨在保护物联网安全，并使利益相关者能够应对基于风险的安全挑战，包括制造的、连接的设备或服务。随后，美国政府加速了物联网政策文件的发展，以加强物联网安全管理、改进管理机制、发展和控制能力。自2017以来，物联网安全相关的政策法规如表I所示。


    # 表 I. 物联网安全相关政策法规


    | 时间 | 文件名称 | 物联网安全相关 |

    |---|---|---|

    | 2017年6月13日 | 促进利益相关者协议及物联网安全其他能力 | 从私营行业、学术界和社会和其他专家处寻求见解，加强物联网设备的安全防护。 |

    | 9月28日，SB-327 | 关于必要安全和隐私的强制性标准 | 物联网安全会议围绕物联网供应链的完整性和法律法规的发展，提高了物联网供应链的生态系统的稳健性，以及隐私连接标准。
    |

    | 2019年6月 | 物联网安全指南 | 围绕物联网供应链的完整性和法律法规的发展，提高了物联网供应链的生态系统的稳健性。 |

    | 2019年12月10日 | 物联网研究与发展战略 | 考虑由数字基础设施提出的问题，确保物联网的隐私和可信性。 |

    | 2020年2月5日 | 物联网安全政策原则 | 所有利益相关者应考虑在全球背景下的物联网安全，为物联网生态系统的演进提供准则。 |

    | 2020年5月29日 | 物联网设备能力准则 | 从互操作性出发，涵盖制造的、连接的设备或服务。 |


    ## C. 英国：不利于顶层设计和政策指南


    作为物联网技术的领导者和先驱之一，国家级物联网安全研究和战略规划已成为指导美国物联网发展的重要参考。2016年底，安全事件报告将物联网安全问题推到了国土安全的高度，美国国土安全部使用了《物联网安全原则》第1版联邦政府指令以确保物联网安全，白皮书涵盖了跨部门合作、提升国家安全意识、促进物联网发展与制造。这些标准的建立和寻求实践旨在保护物联网安全，并使利益相关者能够应对基于风险的安全挑战，包括制造的、连接的设备或服务。随后，美国政府加速了物联网政策文件的发展，以加强物联网安全管理、改进管理机制、发展和控制能力。自2017以来，物联网安全相关的政策法规如表I所示。


    ## C. 英国：关注消费者物联网安全


    英国是首个应用物联网安全法规的国家。英国开发的全球物联网安全指南为其他国家的发展提供了准则。由于英国开发的物联网安全指南为全球物联网安全提供了基准。自2018年以来，英国政府发布了针对物联网设备设计和软件的安全准则。例如，针对消费者的“物联网保护规范”，从产品角度，13项强制规定是基于结果提出的以改进物联网供应链。……英国政府在设备全生命周期内融入了“安全设计”的理念。


    ## B. 欧盟：加强物联网监管


    尽管在物联网发展上与美国存在差距，但欧盟是全球首个系统性方法处理安全的机构。自2015年建立物联网创新联盟以来，欧盟开始关注物联网安全。2016年，欧盟委员会从网络和云计算出发，发布了一项战略，通过形成法律法规确保物联网的隐私和安全。2017年，欧盟委员会发布了一项针对欧盟的战略，在设备和组件的全生命周期内融入“安全设计”的概念。2018年，欧洲网络安全局（ENISA）强调了将安全能力嵌入物联网制造过程的重要性。2019年11月9日，ENISA发布了指南，从设备需求、产品设计、运行和处置定义了物联网安全，以便利益相关者做出更好的安全决策。


    ## D. 澳大利亚：通过政策引导物联网行业发展


    自2017以来，澳大利亚物联网的发展进入了探索期。为了应对物联网行业增长的安全问题，澳大利亚政府提出了“网络袋”计划，旨在通过安全分系统指出产品的安全问题以消除物联网漏洞。根据英国、欧盟等国家的物联网安全保护相关标准，澳大利亚政府制定了一系列自愿物联网安全政策指南，为物联网提供最佳实践。其功能是解决由于物联网技术发展给消费者企业市场带来的数字差距。2020年9月，澳大利亚网络中心根据英国安全政策指南的13项建议，对行业终端用户提出了维持安全实践的要求。2020年11月，澳大利亚内政部发布了《针对物联网的安全规范》


