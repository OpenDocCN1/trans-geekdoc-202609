  md: '# V. SUGGESTIONS ON PROMOTING THE SECURITY

    DEVELOPMENT OF IoT IN CHINA


    According to analysis, the US, EU, UK, Australia carry out strategies from the
    perspective of IoT cybersecurity policy, combined with the current development
    of IoT''s cybersecurity policy. The following suggestions are forward for the
    development of IoT cybersecurity in China.


    IoT security account, adhere to the static policy and dynamic technology, and
    formulate the IoT security baseline and standard of China''s. Strengthen the supervision
    of IoT device manufacturers and suppliers, focusing on device configuration, data
    protection, vulnerability repair and other. It is necessary to improve IoT consumers''
    security awareness, consumer industry confidence and achieve the status of "IoT
    secure and eager to go", and further enhance the ability and level of IoT device
    security and privacy protection in China.


    +   A. Give full play to the advantage of the government and formulate a national
    IoT security guidance document.


    The government could give the benefit of overall planning and top-level coordination,
    from the practical experience of the IoT security policy, regulations, and standards
    in developed countries, and formulate a national IoT security strategy aligned
    with China''s plan. We will strengthen the coordination of various departments
    in policy and standard formation, infrastructure construction and cybersecurity
    assurance. If the relevant level of IoT standards, specifications can be widely
    recognized by the government and industry is needed, and then promote the implementation
    of policy documents. We will create a suitable environment for the safety, health,
    and orderly development of IoT.


    Based on the ''Network Securityability Management Regulations (Draft for Comment),''
    we could develop the IoT security management measures. According to the development
    of the industry, the security level of IoT devices varies from the perspective,
    information sharing and other aspects of the IoT vulnerability disclosure process
    and methods. With the help of relevant national vulnerability database, reporting
    mechanism, encourage social forces to join vulnerability management of IoT, and
    improve efficiency.


    +   B. Enhance the strength of the IoT industry to ensure a secure ecosystem of
    the IoT.


    The IoT industry could rely on the IoT Alliance, to generally connect the upstream
    and downstream stakeholders of the IoT industry chain. They should reach a consensus
    on integrity security covers the entire lifecycle of product development, production,
    and deployment. We will jointly follow the best practices and requirements of
    IoT cybersecurity, strengthen the risk management of the supply chain, and improve
    the consumer security ecology in terms of IoT security requirements, standards
    and specifications, testing and certification, and application demonstrations,
    to promote the transparency of the industry.


