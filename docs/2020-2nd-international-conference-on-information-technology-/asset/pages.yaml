    # IV. CHINA’S IoT SECURITY POLICY DEVELOPMENT


    # A. Development status


    In 2009, the IoT became one of China’s five critical strategic emerging industries,
    and the cybersecurity issues of the IoT have attracted attention. Regard of the
    development plans, guidelines, safety regulations that have been issued, or the
    technical specification that is being formulated, the security issues of the IoT
    are considered.


    # III. CHARACTERISTICS OF FOREIGN IoT SECURITY POLICY


    # A. Device security and consumer privacy protection the focus


    With the acceleration of 5G commercial and the proliferation of IPv6, the IoT
    is exponentially growing towards interconnection of billions of smart products
    [5]. The security issues of the IoT are also increasingly prominent. The security
    of manufacturing, integrating, and using IoT device becoming more and more critical.
    In the formulation of IoT policies, the US, EU, and other countries have focused
    on the trend of strengthening the security of the IoT consumer. The content focuses
    on changing the default passwords, advancing security and vulnerability management,
    ensuring integrity of data and device parameters, simplifying operation procedures,
    and securing communication and legal verification. They can provide guidance for
    protecting the organization’s IoT devices, consumers and entities.


    In 2014, the Ministry of Industry and Technology of the People’s Republic of China
    (MIIT) issued guidelines to establish and guarantee the security system of the
    IoT and strengthen the formulation and implementation of security standards for
    the IoT [7]. The “Fifth Five-Year Plan” clearly pointed out the development and
    security of the IoT. At that time, it is necessary to address the principle of
    safety and confidence. It was considering the development trend of IoT, the “White
    Paper on Internet Security” published in 2014 by the MIIT addressed the risks,
    proposed a security protection strategy framework, and pointed out the future
    development and directions. In the same year, the security requirements for IoT
    were further emphasized.


    # B. Group collaboration to formulate policy standards based on the choice


    Throughout the foreign IoT policy situation, the work of the IoT cybersecurity
    strategy focuses on the concept of win-win cooperation. For instance, the US relies
    more on the private sector for IoT policy development, which includes companies,
    industries, academic institutions, professional associations, consumer groups
    and others. UK of IoT policy underlines the importance of cooperation and trust-building
    through public-private partnerships, and they stated that they would work with
    international organizations and partners, the private and civil sectors to improve
    cybersecurity capacity. The Department for Digital, Culture & Media is supported
    by 45 agencies and bodies to develop the UK IoT security policy. The working mechanism
    involving all forces provides a guarantee for the promotion and implementation
