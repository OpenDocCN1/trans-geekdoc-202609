    # C. UK: Focus on the security protection of consumer IoT


    The UK is the first country to apply consumer IoT regulations. The world first
    IoT security guidelines developed by UK, which provides a baseline for the development
    of other countries'' IoT-related documents, and for the development of a common
    consumer IoT global security standard. Since 2018, the UK government has issued
    security policy documents around the design of IoT devices and software security
    baselines. For example, the "Code of Protection for Consumer IoT" starting from
    the protection of smart products, 13 mandatory provisions are based on results
    put forward to improve IoT security and privacy. The practice of establishing
    a benchmark for Internet-connected products and IoT certification programs, has
    been incorporated into the "Data Protection Regulation." The UK government''s
    factors are clear. The UK government has also formulated more stringent security
    regulations from the perspectives of consumers, such as using device passwords,
    easy contact with manufacturers, and explicit consent. In 2020, the UK government
    released "Guidelines for consumer smart device security" which pointed out that
    processes and security risks in consumer smart products matter. The plan, which
    aims at improving the standards of consumer IoT and can establish a cybersecurity
    baseline for market protection.


    After three years of policy, the "IoT Cybersecurity Improvement Act of 2020" was
    signed by Trump on December 4th, 2020. The bill proposed to improve the federal
    regulatory framework for internet-connected devices purchased or used by the federal
    government. The bill sought to address the supply chain risk of the federal government,
    which from IoT devices. The pass of the bill marks IoT an essential step in improving
    the security of the IoT.


    # B. EU: Strengthening the supervision of the IoT supply chain


    Although there is a gap in the development of IoT compared with the US, the EU
    is the first institution in the world to systematically approach the protection
    and security plan of IoT. The bill "Consumer Internet of Things" is expected to
    lay a benchmark for proposals and standard IoT certification schemes. Since the
    establishment of the IoT Innovation Alliance in 2015, the EU has given paid attention
    to the security of the IoT supply chain. In 2016, the European Commission, starting
    from the network and cloud computing, released a communication strategy to ensure
    the privacy and security of IoT by forming laws and regulations, and compelling
    companies to comply with security standards and other protections. In 2017, the
    European Commission released a strategy for the European Union, incorporating
    the concept of "security by design" within the lifecycle of the IoT devices and
    components, providing a baseline for the security of the IoT supply chain. In
    2018, the European Agency for Network and Information Security (ENISA) stated
    the importance of embedding security protection capabilities into the manufacturing
    process of IoT. On November 9th, 2019, ENISA released "Guidelines," which defined
    the IoT supply chain security from the whole lifecycle of device demand, product
    design, operation and disposal, and to make better security decisions for stakeholders
    when building, deploying or evaluating IoT technology. Besides, the EU has launched
    an antitrust inquiry into the security of IoT, and the 4th


