    In the same year, the security requirements for IoT were further emphasized. In
    critical areas such as 5G and IoT, by combining new-generation information and
    technology. And they may formulate relevant data security standards in variety
    with the development of the field and for the data security protection requirements
    (See Li et al., 2016).


    # B. Underdevelopment


    From the perspective of the development process and policy documents of the IoT
    cybersecurity in China, with the technical specifications, China’s IoT security
    policy development is still in the very early stage. There are still gaps in the
    formulation of laws and regulations, core baseline, and specifications related
    to the IoT security, and the deficiencies in the safety supervision and implementation
    of the IoT in China. As noted in the long journey of the IoT, a range of stakeholders
    are not fully participating in the construction of IoT ecosystem. Cross-domain
    and cross-industry interoperability issues are not well solved.


    # C. The vulnerability strategy has become a hot spot.


    In the IoT cybersecurity practices, guidelines, baselines, and other policy documents
    establish a vulnerability disclosure policy and report management are more and
    more emphasized. Vulnerability management strategy needs to provide a clear and
    transparent establish a vulnerability disclosure policy, simplifying the reporting
    systems of security researchers and other stakeholders clearly and update the
    vulnerability disclosure strategy continuously. Besides, stakeholders or national
