- - '###'
  - DNS 服务器过程是按分级方式构建的，根据此，只有本地 DNS 服务器知道如何为其本地社区提供本地地址翻译。公共互联网的 DNS 服务器知道所有本地 DNS
    服务器的位置以及它们专门负责的哪些地址翻译。本地 DNS 服务器将包含所有本地信息，而较高级的公共 DNS 服务器则拥有 DNS 服务器的可用性、能力和位置知识；然而，它们本身并不执行专门的地址翻译，也不维护执行此类操作的知识。这相当于所有的翻译都在
    DNS 层次结构的分布式低层执行。作为预防措施，请注意，由于所有翻译都在本地 DNS 级执行，如果这些层被损坏或受感染，通信将被阻塞或损坏。
