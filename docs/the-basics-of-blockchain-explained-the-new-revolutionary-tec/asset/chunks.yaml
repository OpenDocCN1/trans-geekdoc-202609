- raw: 'The miner who finds the number that creates a lower hash than the target,
    when added to the transactions, is the one that adds the block to the chain, thus
    receiving the fees and the reward.


    When the number has been found, it is added to the transaction data by all other
    computers on the network and validated as correct. Because it is a random number,
    it is not easy to find but, once found, verifying it is simple.


    Once validated, the block is added to the chain, and all the network computers
    update their own systems with the newest blockchain version that includes the
    new block.


    The valid block is added to the blockchain, and then all the computers on the
    network update their system with the latest version of the blockchain, including
    the new block.


    ## CAN NETWORK DIFFICULTY BE INCREASED?


    Finding the right number to generate a valid hash is nothing more than a game
    of chance, like rolling a dice. One of the biggest factors is processing speed.
    The faster a computer guesses the right number, the faster the correct answer
    is found.


    We know that the Bitcoin blockchain adds a block every 10 minutes. The more computers
    there are on the network, the more processing power the network has. That means
    more guesses are being made at the correct number for the block. To keep the block
    addition time at 10 minutes, a change is made to the difficulty after every 2016
    blocks, thus changing the minimum and maximum numbers needed for a block to be
    validated.


    Using our dice example, if the network difficulty is 3, a block can only be validated
    if a number lower than 3 is rolled. If only one person is rolling the dice, there
    is a 2 in 6 chance of rolling a 1 or 2 and validating the block to add it to the
    blockchain. This could take around 10 minutes, for example, which means the target
    of adding a block every 10 minutes is met. However, if a second person is added
    and they are also rolling the dice, it may only take 5 minutes to roll a number
    lower than 3. Thus, the time taken to add the block is also only 5 minutes, half
    the time set by the network.


    When the number of people on the network increases, an adjustment needs to be
    made to maintain the network target of adding a block every 10 minutes. As such,
    the number would be reduced from 3 to 2, ensuring the block can only be added
    if a number below 2 is rolled.


    With our original example of just one person on the network trying to roll below
    a 3, there was a 2 in 6 chance of rolling a valid number. If we double the number
    of people on the network and reduce the network target, that reduces to a 1 in
    6 chance. This adjusts the time to add a block back to the target of 10 minutes.


    The Bitcoin blockchain works in much the same way. The more computers get added
    to the network, the more adjustment is made to the target. That means fewer valid
    hashes are accepted, with more numbers in the range to be guessed to get a valid
    hash.


    ## PROOF-OF-WORK ISSUES


    The method by which the right number is calculated to validate a hash is called
    “proof-of-work.” It is termed as such because it indicates the resources and computing
    power contributed in adding a validated block.


    The reward the “winning” miner receives is to compensate for their resources,
    computing power, and electricity and is in the form of a payment for every block
    successfully added. This is called the block reward, and the successful miner
    also receives the transaction fees attached to each block they add – this is why
    they go for transactions that have higher fees.


    Proof-of-work takes an awful lot of electricity and computing power. We know that
    the Bitcoin network is more than 10,000 times as powerful as the top 500 supercomputers
    in the world combined. However, much of that power is wasted in generating random
    numbers.


    The primary issue with proof-of-work is the waste of resources used in doing something
    that seems pointless and isn’t really needed to run the blockchain network.


    Just stop and think about that for a minute. One network of computers is far more
    powerful than the combined power of the most powerful supercomputers. But instead
    of trying to provide solutions to major world problems, all it is doing is generating
    some random numbers. Doesn’t that seem a tad ridiculous? This is why many people
    criticize the proof-of-work method that the Bitcoin blockchain uses.


    Other methods can be used in place of proof-of-work. They include proof-of-activity,
    proof-of-capacity, and proof-of-burn. You should understand that other blockchains
    use different methods, although we won’t be covering them in detail here.


    Ethereum uses its network for decentralized apps, which is a far better use for
    computing power. The platform is also moving towards using the proof-of-stake
    method rather than proof-of-work.


    ## BLOCKCHAIN NETWORK SECURITY


    Decentralized blockchains all have many security features, but one of the biggest
    is the access that all network members have and that every transaction is updated
    on every network member’s computer. This goes towards ensuring that there isn’t
    a centralized database and that no single person or organization can manipulate
    the blockchain to commit fraud.


    Blocks can be added to the blockchain by anyone, but each block must be accepted
    as valid by the majority of users on the network. Once a block has been validated
    and added to the blockchain, every copy of the blockchain on the network is updated
    with the new version, and then a new block is added.


    As you learned earlier, when someone tries to change a transaction, a new hash
    must be generated, which means it won’t match the other network copies and won’t
    be validated.


    ## 51% ATTACK AND BLOCKCHAIN FORKS


    We mentioned the 51% attack earlier in this book. Theoretically, a 51% attack
    cannot happen because it would require a user to have control of more than 50%
    of the network. If someone did have that control, they could decide which blocks
    and transactions were rejected or added, and every copy of the blockchain on the
    network is updated with falsified blockchain.


    Forks are where a large number of the network’s users don’t agree with network
    changes, such as a change in the network functionality or with a block or transaction
    that was added. This kind of disagreement will result in a fork in the blockchain.
    Some users will split away from the main network and use their computing power
    and resources on another separate blockchain from the original one.


    There have been several major forks in blockchains, including Ethereum. The original
    Ethereum blockchain split after a disagreement, resulting in some users allocating
    their resources to a different blockchain, thus creating two blockchains – Ether
    and Ether Classic.


    That brings us to the end of this book, and you should now have a thorough understanding
    of how the blockchain works.


    To finish, I have provided a glossary containing common terms.


    **A**


    *   **ABI (Application Binary Interface) –** this is an interface in between a
    pair of binary program modules. One is usually a library while a user runs the
    other.


    *   **Altcoin –** a cryptocurrency that isn’t Bitcoin


    *   **API –** the application programming interface belonging to a remote server
    responsible for sending requests and getting the responses


    **B**


    *   **Bitcoin –** the first cryptocurrency and still the most popular, it was
    released in 2009 and based on a blockchain’s decentralized ledger


    *   **Blockchain (Public) –** a structure that stores data or digital transactions
    on a peer-to-peer, immutable, decentralized ledger that it is virtually impossible
    to manipulate, even though anyone can access it


    *   **Blockchain (Private) –** similar to a public blockchain but on a private
    network of computers that only those with permission can access


    *   **Business Logic Layer –** section of code determining rules that must be
    followed in business'
