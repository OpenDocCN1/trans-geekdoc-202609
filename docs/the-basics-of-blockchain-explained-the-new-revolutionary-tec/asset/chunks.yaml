- raw: "*   It is likely that, in many industries, intermediaries will be replaced\
    \ by the blockchain\n\n*   Blockchain technology is nearer than we think, and\
    \ many industries are likely to implement it in the near future\n\n*   Blockchain\
    \ solutions are very likely to disrupt many different industries\n\n*   The examples\
    \ we used in this chapter are just the tip of the iceberg in terms of what we\
    \ can achieve using the blockchain, and much of this will be achieved using smart\
    \ contracts\n\nThe next chapter will look at how smart contracts work, the Ethereum\
    \ platforms, and some other examples of what blockchain technology can do for\
    \ us.\n\n8 ![](images/svgimg0003.svg)\n\n> *“You’re going to start seeing open-source,\
    \ self-executing contracts gradually improve over time. What the Internet did\
    \ to publishing, blockchain will do to about 160 different industries. It’s crazy.”*\n\
    \n> \n\n> **PATRICK M. BYRNE**\n\nThe chief scientist of Ethereum, Vitalik Buterin,\
    \ once said, *“Giving users easy access to many different kinds of digital assets\
    \ on the blockchain, especially tokens linked to real-world assets, is crucial\
    \ for moving blockchain adoption to the next level.”*\n\nEthereum is the next\
    \ level in blockchain technology’s future and is built on the same foundational\
    \ technology that the Bitcoin blockchain was built on. However, it goes a step\
    \ on from this by taking the blockchain’s possibilities up another level.\n\n\
    Ethereum lets developers create blockchain-based programs that use the network’s\
    \ computing power – potentially thousands of computers all throwing their computing\
    \ power into the ring. Virtually every application we use today could be run on\
    \ a blockchain, and the Ethereum network lets developers create applications without\
    \ needing to create their own blockchains and/or cryptocurrency.\n\nThe Ethereum\
    \ cryptocurrency is called “Ether” or “Eth” and is used as a form of payment for\
    \ running decentralized applications on the Ethereum network. It has the accolade\
    \ of being the second-largest cryptocurrency globally with a market cap of more\
    \ than $300 billion, second only to Bitcoin with a market cap of more than $700\
    \ billion.\n\n## THE DIFFERENCE BETWEEN ETHEREUM AND BITCOIN\n\nAlthough Bitcoin\
    \ and Ethereum are both cryptocurrencies, they do have some differences. The biggest\
    \ is that the Bitcoin blockchain is primarily a distributed ledger used for financial\
    \ transactions. By contrast, Ethereum is a distributed computing platform designed\
    \ to run decentralized apps.\n\nWe can use Bitcoin to buy goods and services wherever\
    \ they are accepted as a payment form, but We cannot use Ether to do the same.\
    \ Ether is purely for use as a payment form by developers who need computing power\
    \ to tune their decentralized applications.\n\nBoth have their own digital currency,\
    \ but they have different purposes. Ether was never designed as an alternative\
    \ payment; it was only ever meant to encourage developers to create decentralized\
    \ applications and run them on the Ethereum network.\n\nIn simple terms, Bitcoin\
    \ is a financial transaction currency, and Ethereum is multi-faceted. It doesn’t\
    \ just have a cryptocurrency; it also uses the blockchain to run a computing platform.\n\
    \n## THE BENEFITS OF ETHEREUM\n\nLike the Bitcoin blockchain, the Ethereum blockchain\
    \ is run by a network of computers, thousands of them spread across the world.\
    \ That allows applications to run on the network, using the computing power from\
    \ all these computers.\n\nThe biggest issue with the Bitcoin network is that it\
    \ has far more power than all the supercomputers in the world, but all that power\
    \ goes to waste because it is only used to generate random numbers and add blocks.\n\
    \nEthereum makes far better use of the computers on their massive network by allowing\
    \ developers to run their apps on the blockchain. There is no need for developers\
    \ to create their own blockchains; they simply use Ether to pay for some of the\
    \ computing power already available on the network.\n\nBut it doesn’t stop there.\
    \ Ethereum also has a programming language called Solidity and the Ethereum Virtual\
    \ Machine (EVM). Solidity is used to create smart contracts or decentralized applications,\
    \ which the EVM then compiles and runs on the blockchain.\n\n## DECENTRALIZED\
    \ APPLICATIONS – D’APPS\n\nDecentralized applications, often termed d’Apps, are\
    \ open-source applications that no one entity or person controls. They run on\
    \ a network of computers or distributed blockchain. These applications don’t have\
    \ a central server. Instead, peer-to-peer connections are used to connect users\
    \ to one another.\n\nWith the applications we use today, a single entity is in\
    \ control, and a centralized server is used to run them. These servers are prone\
    \ to being hacked, breaking down, or going offline, causing no end of problems\
    \ for the application user.\n\nDecentralized apps don’t rely on any of this, instead\
    \ using the computer network, and all users on the network decide the changes.\
    \ Because there isn’t a centralized server, it can’t break down or be hacked.\
    \ If one computer on the network goes down, the application is not affected because\
    \ there are so many others on the network that are running the application simultaneously.\
    \ If a computer on the network is hacked, it can’t be used to make unauthorized\
    \ changes because the vast majority of the network users have to agree to any\
    \ changes.\n\n## SMART CONTRACTS\n\nA smart contract is written in the Solidity\
    \ computer programming language and works on a distributed ledger or blockchain.\
    \ The contract is automatically verified, executed, and enforced based on the\
    \ contract terms specified in the code. Smart contracts can be fully or partially\
    \ executing and are self-enforcing.\n\nThey can be used for exchanges of anything\
    \ of value and, for many industries, when they adopt blockchain technology, they\
    \ will be using the smart contract system.\n\nWhen they run on the blockchain,\
    \ smart contracts automatically operate. Provided the contract terms in the code\
    \ are met, the value or payments are exchanged as specified. In the same way,\
    \ if the conditions are not met, the payment or exchange can be withheld, depending\
    \ on how the contract was written.\n\nBecause smart contracts run exactly as they\
    \ are programmed, the risks surrounding fraud, unauthorized changes, server failure,\
    \ or non-compliance with the contract terms are removed. And because the contracts\
    \ automatically execute, there is no need for a third party, such as a lawyer\
    \ or a court of law.\n\nAn entry made on a blockchain is timestamped, and it cannot\
    \ be changed. That’s part of what makes this the ideal contracts platform, as\
    \ all changes are timestamped, and previous versions stay on the blockchain.\n\
    \nWe can store contracts and create new versions while retaining previous copies.\
    \ Each copy has its own timestamp, thus providing us with an accurate overview\
    \ of how the process took place and ensuring honesty between transaction parties\
    \ because there is no way to change the ledger. Blockchain technology eliminates\
    \ the need to have the contracts managed by a third party.\n\n**Smart Contract\
    \ Uses**\n\nWith the Bitcoin network, there is a huge risk. When you purchase\
    \ something using the Bitcoin cryptocurrency, you have no guarantee that the goods\
    \ will arrive once the payment has gone through. The sender could decide not to\
    \ send what you ordered or claim the payment didn’t arrive. The latter is highly\
    \ unlikely unless the person paid into the wrong Bitcoin account, but it highlights\
    \ one of the major issues.\n\nBecause a third party is not required for transactions\
    \ on the Bitcoin blockchain, there is no way to dispute a transaction, ask for\
    \ your money back, or use an intermediary to get your money back for you. When\
    \ you sign up for a Bitcoin wallet, know that they too are anonymous, so you cannot\
    \ know who the payment goes to. If you do send it to the wrong Bitcoin address,\
    \ it’s tough luck, the money is gone, and there is nothing you can do about it."
