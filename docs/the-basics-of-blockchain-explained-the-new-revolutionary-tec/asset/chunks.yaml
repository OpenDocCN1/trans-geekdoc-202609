    但这就是当你用纸币支付物品时每天都在做的事情。你钱包里的那张 `$50` 票只不过是一张写着“我欠你 50 美元”并由政府签字的纸。你接受这些纸张的本质，并信任你可以在任何商店使用它们。那些商店也信任可以将这些纸币存入它们的银行账户，或者用它们在另一家商店购买商品。事实就是如此。


    这一切汇聚起来就是极大的信任。


    那么，区块链是如何介入其中的呢？简单来说，对于那些公民不信任其政府、银行、金融机构、货币兑换等的国家，区块链提供了巨大的潜力。


    美国的金融系统是世界上监管最严格的系统之一，但这并没有阻止大型银行和金融机构在 2008 年金融危机期间倒闭，那是几十年来冲击全球最严重的危机之一。这些都是已经存在了数百年的公司。这些公司一夜之间破产了，带走了人们辛苦赚来的每一分钱。


    希腊是欧洲的一个发达国家，采用欧元作为货币。2015 年，银行冻结了所有银行账户存款，人们每天只能从 ATM 机提取等值于 `$70` 的欧元。


    这些人曾相信这些银行，相信它们是值得信任的。他们还能对钱做什么呢？藏在床垫下？一旦有人发现你的钱在那儿，你就会成为盗窃的目标。如果你的房子化为灰烬，你的钱也会随之化为乌有。


    如果政府可以在美国、希腊和其他发达国家冻结银行取款，而银行可以一夜之间消失，那么在监管较少的欠发达国家，人们怎么能信任他们的政府和银行呢？


    短答案是，他们不能。


    # 信任与区块链


    在全球范围内，有数十亿人生活在政府仅仅是独裁政的国家。这些政府拥有银行，人们甚至无法在商店里使用当地货币。这些国家犯罪率很高，而且明显缺乏法律系统来帮助保护人们。这种情况正发生在许多国家。即使你可以信任银行不会破产或偷走你的钱，在某些国家，政府也会监控每一笔存款，并可以使用你的交易记录来逮捕你、将你关入监狱甚至处死你。


    回到我们的图书馆例子，假设你借了一本书，但政府不认可该主题——例如乔治·奥威尔的 `1984`。在这种情况下，监控一切的政府可能会将你的阅读习惯视为红旗。这可能导致他们调查你的生活、逮捕你，或者在某些国家更糟。


    显而易见，在不信任政府或银行的国家，交易是困难且充满风险的。如果你把钱存在银行，你就面临着钱被银行或政府吞没的风险。如果你买房或进行其他其他大额购买，你可能被迫使用现金、宝石、黄金或其他材料来储蓄，这又带来了它自身的风险——例如，你可能会因火灾或盗窃而失去积蓄。即使最坏的情况没有发生，你成功存下了所需的钱，你仍面临着其他方式的风险。例如，你买房的卖家可能拿走了你的积蓄，但不将房屋所有权转给你。因为交易是用现金进行的，所以没有电子证明，也没有任何关于交易发生的其他证据。


    区块链基于信任，这是它的核心概念，而区块链本身就是一个信任系统，允许人们之间在不需要中心化第三方参与的情况下进行交易。你可以在区块链上进行任何价值的交易。虽然最常见的是加密货币，但近年来，这种技术已扩展到数字文件、财产、金钱、股票，几乎任何你想卖给他人或从他人处购买的东西。


