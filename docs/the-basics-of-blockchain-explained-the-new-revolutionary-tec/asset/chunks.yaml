- raw: "*   **Hype –** blockchain technology is subject to a significant amount of\
    \ hype, especially in terms of what it can do. We need to remember that a blockchain\
    \ is nothing more than a way of storing and managing assets; it isn’t a magic\
    \ wand that will solve all the world’s problems and is largely unproven, especially\
    \ outside of cryptocurrency use.\n\nAs you can see, the blockchain isn’t all roses\
    \ and sparkly lights. Despite its many benefits, it has significant disadvantages,\
    \ especially in terms of large organizational use. The next chapter will look\
    \ at how the blockchain works with the financial industry.\n\n6 ![](images/svgimg0003.svg)\n\
    \n> *“It’s money 2.0, a huge, huge, huge deal.”*\n\n> \n\n> **CHAMATH PALIHAPITIYA**\n\
    \nIn 2009, the first worldwide use of blockchain technology was brought to our\
    \ attention as it was used for Bitcoin, a digital cryptocurrency slated to change\
    \ finance forever. And that blockchain certainly didn’t escape the finance industry’s\
    \ attention. At first glance, many companies within the industry dismissed Bitcoin,\
    \ not seeing any real potential there until they took the time to look further\
    \ into the cryptocurrency and the technology it ran on. Once they realized the\
    \ potential blockchain technology offered, the money started flowing. Millions\
    \ of dollars were spent on research and development, not to mention acquisitions\
    \ to help these companies develop blockchains of their own.\n\nThere are plenty\
    \ of advantages to using blockchain technology in the financial industry. For\
    \ a start, the technology can process information much faster than many traditional\
    \ systems, simply because it removes the third parties needed in traditional transaction\
    \ systems. This results in lower costs and increased speed and can be applied\
    \ to many things – stock trading, transferring currencies, making payments, settlements,\
    \ and many more activities handled by financial companies worldwide.\n\nCompared\
    \ to how long an average transaction takes, value transfers are quite slow. It\
    \ can often take several days, if not weeks, to get money from one country to\
    \ another, and the exchange rate is not always certain at the time the transfer\
    \ actually happens. With a blockchain ledger, not only is it cheaper to transfer\
    \ that value, but the process is also much faster because there are no third parties\
    \ involved anywhere – the transaction can be validated very quickly.\n\n## BANKING\n\
    \nAs far as banks go, blockchain technology offers faster transactions coupled\
    \ with transparency in place of the traditional layers of authentication currently\
    \ needed.\n\nBanks use internal ledgers to settle all transfers, but this may\
    \ take different lengths of time depending on the individual bank. Often, the\
    \ funds are removed from one bank’s ledger but take days to appear on the receiving\
    \ bank’s ledger.\n\nIn many developing countries, settlements tend to be manual\
    \ and take even longer to complete; they are also more prone to human error. If\
    \ this kind of manual process were replaced with blockchain technology would allow\
    \ transfers between banks to be settled almost straight away on a distributed\
    \ ledger. Everyone involved with the network would be able to see those transactions,\
    \ thus reducing the very real threat of fraud in many countries.\n\n## SHARE TRADING\n\
    \nShare trading operates in a similar way. We can use a blockchain to reduce how\
    \ long the settlement process takes and ensure trades are far more accurate. The\
    \ NASDAQ has already developed a blockchain to use for share trading. Right now,\
    \ it is in use for pre-IPO trades, allowing ownership of private company shares\
    \ to be transferred between investors before they go live on the stock exchange.\
    \ The NASDAQ blockchain is already up and running and is a forerunner in showing\
    \ that the world isn’t far off using this technology across many different industries.\n\
    \nOnce the first share ownership transaction had been completed on the NASDAQ\
    \ blockchain, the CEO, Bob Greifeld, said it was a “seminal moment” in adopting\
    \ the technology and a huge step forward for the finance industry as a whole.\n\
    \nThe big question is this. Regardless of the significant benefits blockchain\
    \ technology promises, is the financial industry ready for it? Are they prepared\
    \ to place their trust in this technology to process potentially billions of dollars?\n\
    \nIn short, yes, they are.\n\nThe financial industry is at the forefront of accepting\
    \ that this technology has huge potential and can revolutionize how they work.\n\
    \n## RIPPLE AND R3\n\nAs mentioned earlier, many companies already use blockchain\
    \ technology, like NASDAQ. Virtually all global financial institutions are developing\
    \ their own technology via internal company development or shared between companies.\
    \ More than $830 million has already been invested by Capital One, Citibank, NASDAQ,\
    \ and Visa in chain.com. This blockchain-based company designs and builds distributed\
    \ ledgers to enable easier transactions between financial companies.\n\nAnother\
    \ payment network set up to facilitate transfers of commodities, currencies, and\
    \ just about anything else of value on a distributed ledger system. Financial\
    \ institutions and major banks worldwide are already using the Ripple network\
    \ for settlements, allowing the banks to send international payments in real-time\
    \ and at a much lower cost than traditional methods.\n\nRight now, at least 15\
    \ of the top 50 banks in the world are collaborating with Ripple to build a blockchain\
    \ platform. UniCredit’s CEO, Paolo Cederle, said,\n\n> “*blockchain and related\
    \ technologies are a paradigm shift from the status quo and are increasingly a\
    \ major focus of innovation for us. Through our Ripple partnership, our global\
    \ payments are being optimized as one of the first big banks to implement distributed\
    \ financial technology in a commercial setting.”*\n\n> \n\n> UNICREDIT’S CEO,\
    \ PAOLO CEDERLE\n\nR3 is another tech firm currently working with JP Morgan, Wells\
    \ Fargo, Citibank, and 22 other major banks, collectively known as the R3 Consortium.\
    \ Some high-profile developers are working on this distributed database technology,\
    \ including those who worked on Bitcoin, in the tech industry, and cryptography.\
    \ Their ledger is not the same as a blockchain but has some similarities, and\
    \ 11 banks are already connected to it.\n\n## THE BANK OF ENGLAND\n\nThe Bank\
    \ of England is another big name currently developing its own blockchain technology.\
    \ They have announced a commitment to overhauling their current database system’s\
    \ foundations and bringing in the blockchain to replace some if not all of it.\
    \ The bank has a dedicated team working on the blockchain, and they have declared\
    \ it as one of the key innovations in the bank’s history.\n\nThe Bank of England\
    \ hopes they can use this technology as a line of defense against cyberattacks,\
    \ which are on the rise, help get nonbank payment transactions settled much faster,\
    \ and ensure the bank is compatible with a constantly changing technology.\n\n\
    Initially, they plan to use their blockchain internally, but it will allow more\
    \ businesses to use it in the near future. This will allow the blockchain technology\
    \ to be tested on gross settlement systems, with billions of banking transactions\
    \ handled in real-time every day.\n\nAnother country currently working on its\
    \ own blockchain technology is Estonia. The government is working on pioneering\
    \ technology by developing blockchain-based solutions for health records and identification,\
    \ with plans to build other systems for voting and tax collection on top of these.\n\
    \n## OTHER FINANCIAL INDUSTRY BENEFITS\n\nThe finance industry will benefit from\
    \ blockchain-based technology in many ways because they know that currency can\
    \ be transformed securely and reliably. There are two main benefits to the blockchain:\n\
    \n1.  **Distribution –** because the ledger exists on every computer on the blockchain\
    \ network, every new transaction and block is seen by everyone. There is no single\
    \ point of control, and every person receives exactly the same information"
