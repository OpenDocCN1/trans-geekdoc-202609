    ## 2. 不可变性

    不可变性——区块链提供了准确的交易历史，所有交易均按时间顺序排列。一旦交易或区块添加到区块链，就无法被更改，也不能添加未经验证的信息。要实现这一点，需要同时对网络超过一半的计算机进行高度协调的黑客攻击，这几乎是不可能发生的。


    这些特性为金融业带来了巨大的益处，我们已经看到该行业如何致力于区块链技术并利用其来简化自身的业务。现在我们可以看看该行业利用区块链力量的一些而易见的方式：


    ### 资金转账

    在不同国家之间汇款不仅对客户，也对金融机构面临着一系列独特的挑战和问题。每年有数十亿美元的资金流向全球，这一过程往往耗费时间、昂贵，且极易出现人为错误。


    区块链可以改变现状，世界上许多大银行现在已采用区块链技术进行国际支付，为他们节省了资金和时间。消费者也可以使用移动设备通过区块链进行电子转账，省了去银行或汇款机构的麻烦，也无需为向他人汇款而支付费用。


    ### 更廉的直接支付

    大部分资金通过银行、信用卡公司和其他金融机构流动，但过程中的每一步都为交易增加了一个复杂的层级，并伴随着高昂的费用。基于区块链的转账为商户带来了以下益处：


    *   **更低的费用** – 如果客户使用信用卡支付，商户必须支付手续费，这会减少他们的利润。通过区块链支付，费用被消除或至少减少了。

    *   **资金不足风险降低** – 一些消费者使用坏支票购买商品，导致商户亏损并支付费用。他们可能还必须通过法律途径追回资金。有了区块链，商户可以放心，因为交易将在极短时间内完成。


    对于个人而言，益处是：


    *   **诈骗几率更小** – 在线诈骗是一个巨大的担忧，但通过区块链，支付比传统银行服务快得多，费用也低。此外，如果发生了欺诈行为，支付可以快速撤回。

    *   **节省金钱和时间** – 电汇、现金和银行本票是安全的支付方式，但电汇太耗时，现金无法追踪，而银行本票容易被伪造。区块链消除了所有这些问题，让个人对自己的支付更有信心。


    ### 交易详情可以追踪

    区块链将不仅彻底资金转账。它也是追踪每笔交易并确保信息安全准确的绝方法。这包括：


    *   **所有权详情** – 分布式账本几乎无法更改，确保了所有权变得更容易追踪。留置权者和涉及所有权转让的人员可以检查账本以确保信息正确，从而产生更多信任。

    *   **智能合约** – 大多数交易都是耗时、复杂且昂贵的，但区块链带来了自动化的机会。通过智能合约，买家的付款可以被追踪，交付情况也是如此，在交易过程中出现的任何问题都可以轻松解决。结果是减少了人为错误，而且它们可以
    24/7 全天候工作。


    ### 金融包容

    由于区块链技术的成本较低，初创公司现在可以与大银行竞争，这促进了金融包容。许多人也希望有银行的替代方案来摆脱准入限制低、最低余额要求和过高银行费等限制性问题。区块链提供了这种替代方案，利用移动设备和数字身份系统消除了与过渡性银行系统相关的麻烦。


    ### 减少欺诈

    存储在区块链上的所有信息都以块的形式存储在账本中。这些块包含一个指向前一个块的唯一哈希值。区块链网络上的所有人都会收到每笔交易的副本。这意味着该技术不太可能成为
    DOS（拒绝服务）攻击、恶意黑客以及你能想象的任何其他类型欺诈的目标。通过消除这些威胁，减少了与业务相关的开支，确保每个人都节省了时间和金钱。


    ### 加密货币

    加密货币是依赖区块链的最新资产。虽然它们已经在使用中，但区块链公司降低了准入门槛，并确保加密货币交易所的顺畅无缝，为传统银行提供了极佳的替代方案。


    尽管银行面临许多监管和限制，但随着意识到它们提供的巨大潜力，越来越多的银行正转向区块链和加密货币。它们是金融行业的大巨头。随着他们进行测试以寻找新的用例，我们将开始看到更大、更好的区块链解决方案，为所有人提供无缝、透明且可靠的交易。


    ### 核心要点

    本章的核心要点是：


    *   目前，在国家和公司之间传输价值的过程很缓慢，但区块链提供了一种更快速、更安全的方式来实时进行这些交易，且错误率较低。

    *   区块链技术可以用透明度取代当前交易过程中所需的许多身份验证层。

    *   全球的政府、银行和中央银行也在使用区块链技术，更多的人正在研究和开发他们自己的解决方案。

    *   股票交易涉及私人公司所有权在人之间的转移。区块链消除了第三方，使过程变得快得多。`NASDAQ` 已经使用区块链技术进行 IPO 前股票交易。

    *   金融机构今天执行的许多结算和管理功能已经过时且笨拙。区块链有潜力用分布式账本系统取代这些功能。

    *   金融业通过区块链将获得的其他益处是：


    **资金转账** - 目前的系统缓慢、笨拙且容易出错。区块链可以简化它，许多银行已经采用了区块链解决方案进行他们的国际转账。消费者也可以使用区块链解决方案通过移动设备转账。


    **更廉的直接支付** - 区块链消除了商户面临的信用卡手续费和坏支票风险，同时为个人提供了更快的支付和更小的诈骗几率。


    **追踪交易详情** - 交易可以很容易地追踪和检查，以确保其安全准确。这包括使用分布式账本系统追踪所有权详情，以及可以 24/7 工作并从头到尾监控交易的智能合约。


    **金融包容** - 由于区块链相关的成本较低，初创公司现在可以与大银行竞争。而且区块链技术还可以为传统银行系统提供一种无限制的替代方案。


    **减少欺诈** - 区块链上的每个块都通过唯一哈希值链接到上一个块，网络上的每个人都会获得每笔交易的副本，这确保了网络攻击和欺诈的几率较低。


    **加密货币** - 区块链公司降低了准入门槛，确保加密货币交易所顺畅，并为今天的银行系统提供了替代方案。


