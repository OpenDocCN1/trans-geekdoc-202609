- raw: '2.  **Immutability –** blockchains provide accurate transactional histories,
    with all transactions in chronological order. No transaction or block can be changed
    once added to the blockchain, nor can unverified information be added. The ability
    to do this would require a highly coordinated hacking attack on more than half
    the network’s computers simultaneously, which is unlikely ever to happen.


    These features offer tons of benefits for the financial industry, and we’ve already
    seen how the industry is working on blockchain technology and using it to streamline
    its own business. Now we can look at some of the obvious ways the industry can
    harness the blockchain’s power:


    ## MONEY TRANSFERS


    Transferring money between different countries comes with a unique set of challenges
    and problems, not just for the customers but also for the financial institutions.
    Every year, billions of dollars are sent across the world, in a process that tends
    to be time-consuming, expensive, and incredibly prone to human error.


    The blockchain can change things, and many of the largest banks in the world have
    now adopted blockchain technology for international payments, saving them money
    and time. Consumers can also use the blockchain to transfer money electronically
    using mobile devices, saving them the hassle of visiting the bank or a money transfer
    business and paying for the privilege of sending their money to someone else.


    ## CHEAPER DIRECT PAYMENTS


    The majority of money moves through banks, credit card companies, and other financial
    institutions, but every step in the process adds another complex layer to the
    transaction, and that comes with expensive fees. With blockchain-based transfers
    come the following benefits for merchants:


    *   **Lower Fees –** If customers use credit cards to pay for something, the merchant
    has to pay a processing fee, reducing their profit. With blockchain payments,
    fees are eliminated or at least reduced.


    *   **Less Chance of Insufficient Funds –** some consumers pay for goods with
    a bad cheque, leading to the merchants losing money and paying fees. They may
    also have to go down a legal route to get their money back. With the blockchain,
    merchants have the peace of mind that transactions will go through in a very short
    time.


    For the individual, the benefits are:


    *   **Smaller Chance of Scams –** online scams are a huge concern, but payments
    are much quicker and less expensive than traditional banking services with the
    blockchain. Also, if fraud is committed, the payment can quickly be reversed.


    *   **Less Money and Time –** wire transfers, cash, and cashier’s checks are safe
    payment methods, but wire transfers take too much time, cash cannot be traced,
    and cashier’s cheques are easily forged. The blockchain removes all these issues,
    giving individuals more confidence in their payments.


    ## TRANSACTION DETAILS CAN BE TRACKED


    The blockchain won’t just revolutionize money transfers. It is also an excellent
    way to track every transaction and ensure that the information is secure and accurate.
    This includes:


    *   **Details of Titles –** distributed ledgers are virtually impossible to change,
    ensuring ownership is much easier to track. Liens and those involved in ownership
    transfers can check the ledger to ensure the information is right, resulting in
    more trust.


    *   **Smart Contracts –** most transactions are time-consuming, complex, and expensive,
    but with the blockchain comes an automation opportunity. With smart contracts,
    buyer payments can be tracked, as can deliveries, and any issues that arise throughout
    the transaction can easily be addressed. The result is less human error, and they
    work 24/7.


    ## FINANCIAL INCLUSION


    Because of the lower costs of blockchain technology, startups can now compete
    with large banks, which promotes financial inclusion. Lots of people also want
    alternatives to banks to get away from restrictive issues like low access, requirements
    on minimum balances, and excessive banking fees. The blockchain provides that
    alternative, using mobile devices and digital identification systems that eliminate
    the hassles tied to transitional banking systems


    ## A REDUCTION IN FRAUD


    All information stored on a blockchain is stored on a ledger in blocks. Those
    blocks contain a unique hash referring to the block before them. All people on
    a blockchain network are sent a copy of every transaction. All this means that
    the technology is less likely to become a target of DOS (Denial-of-Service) attacks,
    malicious hackers, and any other type of fraud you can think of. By eliminating
    these threats, the expenses associated with business are reduced, ensuring everyone
    saves time and money.


    ## CRYPTOCURRENCY


    Cryptocurrencies are the latest assets relying on the blockchain. While they are
    already being used, the blockchain companies have reduced the entry barriers and
    ensure that cryptocurrency exchanges are smooth and seamless, providing a great
    alternative to traditional banking.


    Although banks face many regulations and restrictions, more and more are turning
    to the blockchain and cryptocurrencies as they realize the huge potential they
    offer. They are the big players in the financial industry. As they carry out testing
    to find new use cases, we’ll start seeing bigger and better blockchain solutions,
    providing seamless, transparent, and reliable transactions for all.


    ## KEY TAKEAWAYS


    The key takeaways from this chapter are:


    *   Right now, the process of transferring value between countries and companies
    is slow, but the blockchain offers a faster, more secure way to do these transactions
    in real-time and less chance of error.


    *   Blockchain technology can replace the many authentication layers needed in
    current transaction processes with transparency


    *   Governments, banks, and central banks worldwide are also using blockchain
    technology, and many more are researching and developing their own solutions


    *   Share trading involves private company ownership transferring between people.
    The blockchain removes the third parties and makes the process much quicker. NASDAQ
    already uses blockchain technology for pre-IPO share trading.


    *   Many of the settlement and administrative functions financial institutions
    perform today are outdated and clunky. The blockchain has the potential to replace
    these functions with a distributed ledger system.


    *   Other benefits the financial industry will experience with the blockchain
    are:


    **Money Transfers -** the current system is slow, clunky and prone to errors.
    The blockchain can streamline it, and many banks have already adopted a blockchain
    solution for their international transfers. Consumers can also use a blockchain
    solution to transfer money using mobile devices.


    **Cheaper Direct Payments –** the blockchain removes the headaches of credit card
    processing fees and the risk of bad cheques for merchants while giving individuals
    more confidence with quicker payments and less chance of fraud or scams.


    **Tracking Transaction Details –** transactions can easily be tracked and checked
    to ensure their accuracy and security. This includes using a distributed ledger
    system to track title ownership details and smart contracts that work 24/7 and
    monitor a transaction from start to finish.


    **Financial Inclusion –** startups can now compete with large banks because of
    the cheaper costs associated with the blockchain. And blockchain technology can
    also provide a hassle and restriction-free alternative to traditional banking
    systems.


    **Reduction in Fraud –** the fact that every block on the blockchain is linked
    to the previous one with a unique hash and that everyone on the network gets a
    copy of every transaction ensures there is less chance of cyber-attacks and fraud,
    thus reducing business expenses.


    **Cryptocurrency –** entry barriers have been lowered by blockchain companies,
    ensuring that cryptocurrency exchanges are smooth and provide an alternative to
    today’s banking systems.'
