- raw: 'In traditional record-keeping systems, anyone with access could potentially
    change things on the database and keep those changes hidden from others. We are
    constantly hearing of massive fraud cases that were not detected until too late
    because of the lack of transparency in the ledgers. This lack of transparency
    meant people could change entries or data in secrecy, and the only time it would
    be detected was when, indeed, if the fraud were detected.


    With blockchain technology, every person can see every entry and transaction –
    complete transparency. Most of the computers on the blockchain network must approve
    every transaction or change, thus ensuring that nothing can be manipulated or
    hidden from view.


    Every change is made in almost real-time, occurring as each transaction or change
    is approved and then added onto the blockchain. This ensures that a common scenario
    of one person in a company being able to skim money or hide major company losses
    by changing ledger entries is highly unlikely to occur where everything is stored
    on a blockchain.


    Transparency doesn’t just apply to financial transactions; it works with just
    about anything of value stored on the blockchain. Later, we’ll be looking at how
    the financial and other industries use the blockchain to provide their customers
    with transparency.


    ## REMOVING THE THIRD-PARTIES


    As we mentioned at the start of this book, most of today’s transactions require
    a third party or intermediary, such as a credit card company, bank, government,
    etc., to provide security and trust.


    One advantage that blockchain technology provides over traditional systems is
    the removal of this third party. This way, transactions can take place directly
    between the interested parties without involving anyone else.


    This offers huge benefits to billions of people living in countries where third
    parties, such as banks, governments, other financial parties, etc., cannot be
    trusted due to corruption, poor regulation, high levels of crime, limited options
    in pursuing legal issues, manual transaction recording, and so on. The blockchain
    is particularly helpful in these scenarios, especially where it is just as difficult
    to do direct transactions between two or more people face-to-face or via online
    means.


    It all comes back to the transparency mentioned earlier and provides trust while
    cutting the risks inherent in traditional transactions and removing that intermediary.


    ## DECENTRALIZATION


    This advantage is one of the key reasons we can remove the third parties from
    the equation while increasing trust and transparency. Each blockchain is considered
    as a single ledger and is maintained as such. This is in complete contrast to
    the current system of multiple ledgers managed privately by more than one institution.
    When the blockchain is used, neither companies nor individuals need to relinquish
    any control to a third party, ensuring that collaboration and transactions are
    much faster and can easily be managed.


    Let’s use an example of banks that transfer their assets between one another.
    In the systems we currently use, every bank would have their own ledgers and their
    own transaction records and would be responsible for maintaining them. If they
    used the blockchain, all they would need to do is ensure their individual transactions
    were reconciled to the shared ledger, and each bank would be able to access it
    and agree on the transaction record.


    The decentralized nature of the blockchain really pays dividends for companies
    in competition with one another, but that work as part of a consortium or group.
    Many companies are not happy to hand over information or work together on databases
    owned by one of their competitors, understandably so. Where competitors collaborate
    but only one has ownership of the data, there’s the need for involved legal contracts
    and NDAs (non-disclosure agreements) to ensure the access and privacy of the data
    is protected. However, where the blockchain is concerned, competitors can collaborate
    on shared databases that they all have access to and control over.


    As we are all aware, centralized databases can easily be hacked and are prone
    to corruption and data loss. With the blockchain, that risk is eliminated because
    there is no central point of failure, no central point that can be manipulated,
    and data cannot be lost. Every computer on each blockchain network retains a copy
    of the blockchain, ensuring the risk of data loss is minimal. Data manipulation
    would require more than 50% of the network’s computers to be hacked at exactly
    the same time, and that is pretty much impossible to do.


    While traditional transaction methods require all parties to place trust in a
    third party for the transaction to be completed, that is not an issue with the
    blockchain. The third party is removed, but security and trust between all parties
    are retained. That’s because the trust goes to the blockchain and not the third
    party.


    While the decentralized nature of the blockchain, its transparency, and no need
    for a third party are all important features, the most important non-tangible
    benefit is the significant increase in trust between parties.


    ## SECURITY


    When data is entered onto a blockchain, it becomes immutable. This means there
    is no way to alter or change it in any way. Each block in a blockchain is linked
    and can be traced right back to the beginning, to the ‘genesis block.’


    This creates an audit trail that can easily be followed and includes every transaction
    that has ever been recorded on the blockchain.


    There have been many thousands of cases of fraud documented throughout history.
    When fraud is committed, the trail that leads to it is usually altered in some
    way, thus muddying the waters and making it hard to investigate. In some cases,
    the data trail may have been changed so much that the fraudulent transactions
    cannot be traced.


    There is no way to change any transactions already entered on the blockchain,
    which means the audit trail is clear and can easily be followed. And, as mentioned
    earlier, changing any previous transactions would require someone to have control
    of more than 50% of the network simultaneously, which is nigh on impossible. If
    this did happen, the rest of the network computers would see it straight away
    and be able to put a stop to it.


    That said, blockchain security is not without its flaws, but most existing blockchain-based
    systems have been shown to solve most of the issues we face with traditional systems.
    It is likely that fraud will never be completely eliminated, but the blockchain
    does let us have an audit trail that can easily be followed, thus allowing the
    network to see almost instantly if any attempt at fraud is made.


    ## PLENTY OF POTENTIAL USE CASES


    The blockchain isn’t just about recording financial transactions. It can be used
    to record pretty much anything of value. We have used an example of books, but
    you could use the blockchain to record ownership rights, digital identities, digital
    files, copyright licenses, or anything else that you can record in a database
    today.


    Let’s take copyright licenses as an example. These are considered assets of value,
    but they are nothing more than numbers or data added to a database. Their value
    comes from protecting the ownership of something and the income derived from that
    ownership.


    Copyright licenses are traditionally stored in centralized databases and controlled
    and managed by certain associations and organizations. However, as assets of value,
    and because they are not physical assets, they can easily be stored on the blockchain,
    eliminating the need for third-party organizations to have control over them.
    You can also store other assets of value on the blockchain, such as digital assets
    and cryptocurrencies. These can exist purely as blockchain assets, which ensures
    they can be managed much easier than the current ownership records.


    ## ACCESSIBLE TECHNOLOGY'
