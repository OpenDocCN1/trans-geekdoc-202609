    \ buying a house from may take your savings and not transfer the house ownership\
    \ to you. Because the transaction took place in cash, there is no electronic proof\
    \ or any other evidence of it taking place.\n\nThe blockchain is based on trust,\
    \ it is the core concept, and the blockchain is, in itself, a trust system, allowing\
    \ transactions to be made between people without needing a centralized third party\
    \ involved. You can carry out any transactions of value on a blockchain. While\
    \ the most common is cryptocurrency, in recent years, that has been extended to\
    \ digital files, property, money, shares, pretty much anything you want to sell\
    \ to or buy from someone else.\n\n# Bitcoin and the Blockchain – What’s the Difference?\n\
    \nThe blockchain first came to our attention when it was mentioned in conjunction\
    \ with Bitcoin. When Bitcoin was created, the first blockchain was created, but\
    \ we’ll be covering that in more detail in chapter 3.\n\nThe blockchain is one\
    \ of Bitcoin’s underlying technologies, and I say ONE because many people think\
    \ it is the only one. However, when Bitcoin was created, it was done with multiple\
    \ cryptocurrency technologies, not just the blockchain.\n\nSystems based on the\
    \ blockchain are currently in use in many applications in multiple industries,\
    \ including social networks, cloud storage, digital identity, decentralized applications,\
    \ voting, and many more that we’ll discuss later. It would appear that the blockchain\
    \ has an endless stream of possibilities, whereas Bitcoin has one use and one\
    \ use only – as a digital payment system.\n\n# Key Takeaways\n\nThe key takeaways\
    \ from this chapter are:\n\n* The blockchain is similar to a database and is used\
    \ to store transactions and records of value. You can record just about anything\
    \ on the blockchain.\n* Most of the transactions we carry out today require a\
    \ third party to ensure security and trust and ensure the transaction takes place.\
    \ Those third parties include governments, banks, credit card companies, and so\
    \ on.\n* The blockchain eliminates the need for that third party and lets people\
    \ carry out their transactions with one another.\n* Billions of people reside\
    \ in countries where the governments, banks, legal systems, and other third parties\
    \ cannot be trusted to keep accurate records or carry out transactions. In these\
    \ cases, the blockchain is particularly useful to provide the assurance and trust\
    \ people need when they transact with one another.\n* While Bitcoin is based on\
    \ the blockchain, the blockchain is not based on Bitcoin\n* Bitcoin is a digital\
    \ payment system, while systems based on blockchains can be used for just about\
    \ any transfer of value.\n\nIn chapter 2, we’ll delve into how the blockchain\
    \ works.\n\n`2![](images/svgimg0003.svg)`\n\n> “The blockchain does one thing:\
    \ It replaces third-party trust with mathematical proof that something happened.”\n\
    > **ADAM DRAPER**\n\nSo, now you know that the blockchain is more than just a\
    \ simple database, you must want to know how it all works, right? In a non-technical\
    \ way, this chapter will explain how a blockchain works – a more technical explanation\
    \ can be later in the book when we delve deeper into things. We’ll talk about\
    \ how the blockchain got its name (quite simple, really), changing things once\
    \ they’ve been added (clue – you can’t), double-spending, and how value is exchanged\
    \ on the blockchain. We’ll also delve into distributed consensus, mining, and\
    \ proof of work. \n\nIn the previous chapter, we learned what the blockchain is,\
    \ and we looked briefly at how it is used to replace third parties in a transaction.\
    \ Now we’ll look at some examples that explain how it all works.\n\nWe’ll use\
    \ our library example again. We know that a library is a third party that keeps\
    \ centralized databases of every person who borrows a book from them. They also\
    \ hold a database showing every book they have and how many copies of each. Let’s\
    \ say you want to borrow a specific book, but there’s only one copy of it, and\
    \ someone else has it. You can ask the library to let you know when the book is\
    \ back in the library, but you can’t ask them to tell you who has the book – they\
    \ cannot reveal personal information about their members. The person who has borrowed\
    \ the book might be your next-door neighbor, but you can’t knock on their door\
    \ and ask them to give the book to you. The library has its own central database,\
    \ and they will not share any of its information with you.\n"
