    \ direct or indirect, that are incurred due to the use of the information in this\
    \ document, including, but not limited to, errors, omissions, or inaccuracies.\n\
    \n> ***I love this stuff - bitcoin, Ethereum, blockchain technology - and what\
    \ the future holds**.*\n\n> \n\n> ABIGAIL JOHNSON\n\nWe’ve all heard of the blockchain,\
    \ mostly in connection with Bitcoin. But do you know what it is? How it works?\
    \ Why do we even need it? Not many people do, but you obviously want to know,\
    \ given that you’ve picked up this book.\n\nBlockchain technology is classed as\
    \ one of the world’s greatest innovations. Many proponents claim that it can cause\
    \ massive disruption to just about every industry and will impact all our lives\
    \ in one way or another within the next decade or so.\n\nIs this true? Is it the\
    \ greatest innovation the world has ever seen? Or is it just another hype that\
    \ will go the same way as many others? Are we seeing another bubble that will\
    \ burst as spectacularly as the dot com bubble burst in the 80s?\n\nPerhaps the\
    \ more important question is, will this technology lead financial firms and governments\
    \ to change how they store and process our data, or will they continue as they\
    \ are? Many people are unhappy with the rising number of data leaks and hacks\
    \ we’ve seen in recent times, and the blockchain could be just what we’ve been\
    \ looking for to keep our data secure.\n\nThis book will answer these questions\
    \ and more. From what a blockchain is to its advantages and disadvantages, we’ll\
    \ look at everything. We’ll even take a technical look at how a blockchain works,\
    \ its use cases, now and potential, and how this technology will impact all of\
    \ us in the years ahead.\n\nWhat it won’t do is convert you into believing that\
    \ the blockchain is the be-all and end-all of everything, that it is the answer\
    \ to your prayers, to all the problems the world faces. You will have to make\
    \ your own mind up about that once you have finished reading it. I will provide\
    \ you with everything you need to understand the technology, both good and bad,\
    \ and talk about some of the hype.\n\nThis is for those of you who know little\
    \ about the blockchain but want to understand it. While it is technical in places,\
    \ I have tried to keep it simple to ensure every reader can understand it. I hope\
    \ you enjoy it and learn all you need to know about blockchain technology.\n\n\
    1 ![](images/svgimg0003.svg)\n\n> *Blockchain is the biggest opportunity set we\
    \ can think of over the next decade or so.*\n\n> \n\n> **BOB GREIFELD, NASDAQ\
    \ CHIEF EXECUTIVE**\n\nThat simple quote should have grabbed your attention; it\
    \ should make you sit up and wonder exactly what this opportunity is, why it’s\
    \ so great and why there’s so much hype around it.\n\nThis chapter will describe\
    \ what a blockchain is, comparing it to the current transactions we do daily,\
    \ whether financial or otherwise. We’ll also discuss trust issues and the primary\
    \ differences between the blockchain and Bitcoin, although we’ll delve into this\
    \ more deeply later in the book.\n\nSo, what is a blockchain?\n\nPerhaps the simplest\
    \ definition is that the blockchain is a database, a method by which we store\
    \ transactions and records of value.\n\nThat isn’t very interesting, is it! It\
    \ doesn’t make you widen your eyes and shout, “wow!” In fact, it probably makes\
    \ you think, “huh? All that fuss and hype for a simple database?”\n\nThat would\
    \ be a bit unfair, though. Saying the blockchain is just a database is like saying\
    \ that email is the new postal service. Yes, the blockchain is undeniably a database,\
    \ but that doesn’t tell you anything about the sheer genius behind it, and it\
    \ stores your transactions and records of values.\n\nRight now, whenever a transaction\
    \ or record of value is stored in a database, we rely heavily on governments,\
    \ banks, or other companies to ensure this information is recorded accurately.\
    \ We trust that the banks won’t steal the money we deposit with them because the\
    \ government regulates them. We trust that, should our bank fail, the government\
    \ will make sure our money is safe.\n\nWhen we pay for something using a credit\
    \ or debit card or transfer money from our bank account to another person’s, we\
    \ trust that the banks and credit card companies will take the right amount from\
    \ our bank account and put it in the seller’s account. The seller trust that they\
    \ will receive the money from the bank or credit card company. They trust that\
    \ the bank or company will handle any disputes or fraudulent activity relating\
    \ to that payment.\n\nIf we go to a store and pay cash for something, the seller\
    \ trust that this piece of paper we give them can be used to purchase goods in\
    \ another store. After all, the government backs that piece of paper, and we trust\
    \ that they will honor that backing. The sellers’ trust that they can turn that\
    \ piece of paper into a digital balance at their own bank. They trust that they\
    \ can use that digital balance to purchase other goods or services online or by\
    \ card.\n\nWe trust these third parties to look after our data and money. We trust\
    \ the banks and other financial institutions to ensure our information is kept\
    \ secure and safe. We trust that they maintain databases containing transactions\
    \ and balances and that they are accurate. The banks trust that the governments\
    \ maintain their own records and databases of every note they issue.\n\nThis trust\
    \ goes way beyond the financial and into almost every area of our lives. Let’s\
    \ say you have joined a library. That library maintains multiple databases containing\
    \ the following information:\n\n*   Every book they have\n\n*   Every library\
    \ member\n\n*   Every book that has been borrowed and who has it\n\n*   The date\
    \ borrowed books are due to be returned\n\n*   Overdue books\n\nThey also have\
    \ databases containing your personal information, including your home address.\
    \ Should you borrow a book and not return it, they can send fines and even institute\
    \ legal proceedings against you for theft.\n\nAll this information is centralized,\
    \ and each library maintains its own individual systems and records, and we trust\
    \ them to keep our details private.\n\nThere is another common theme – we don’t\
    \ trust one another.\n\nImagine the scenarios laid out above taking place without\
    \ a trusted third party in the mix.\n\nLet’s say you have your own business, a\
    \ store of some kind. A customer comes in and purchases goods totaling $50. They\
    \ hand you a signed piece of paper that says, “I owe you $50,” telling you that\
    \ you can use it in another store to purchase goods.\n\nWould you trust that person?\n\
    \nOf course you wouldn’t."
