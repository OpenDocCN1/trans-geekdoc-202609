- raw: 'In California, the Holbertson School has plans to authenticate academic certificates
    using blockchain technology. One of the most common practices in schools is falsifying
    certificates and academic transcripts, with students claiming to have qualifications
    they didn’t study for. Using the blockchain would eliminate this by creating transparency
    around records and certificates. This way, every qualification could be verified,
    thus reducing fraud and saving the schools time and money in manual checks.


    Another area developing blockchain technology is the music industry. Several companies
    are already developing apps on the blockchain to change the way music is shared,
    distributed, and purchased and how artists will receive their royalties. Some
    startups working on blockchains solutions for artists are Uio Music, Peertracks,
    and Mycelia. These platforms will allow artists to sell straight to their fans
    without needing a third party or record label involved in the process.


    Recently, Spotify acquired MediaGhain, a company that developed a system for artists
    to create digital music for songs on the InterPlanetary File System and the Bitcoin
    blockchain. Spotify wants to use MediaGhain’s blockchain platform to ensure payments
    to artists are fairer and more transparent.


    ## CLOUD STORAGE


    Microsoft OneDrive, DropBox, and Google Drive are among companies that have transformed
    data and file storage, making great use of the cloud for security. However, cloud
    storage requires a user to put an awful lot of trust in third parties. We tend
    to place all of our data in one solution with just a simple password for access,
    and centralized storage systems are prone to cyberattacks. Passwords are also
    easy for hackers or scanners to obtain.


    Some startups are now building solutions that combine the cloud with the blockchain.
    Storj, and other companies, have developed cloud storage that is no longer centralized
    and is less likely to be attacked. Data is encrypted and stored on the network,
    utilizing unused storage space on every connected computer, and the only person
    who can access it is the data’s owner.


    Two other companies working on similar systems are Filecoin and Siacoin.


    ## CAR RENTALS AND LEASING


    Another industry that blockchain technology has the potential to transform is
    the automotive industry. DocuSign and Visa have already collaborated to develop
    a blockchain system to take care of car leasing. This will eliminate much of the
    paperwork and third parties currently needed. Under the new system, a customer
    chooses which car to lease. Their digital identity is stored on the blockchain
    and contains their license and finance details. They agree to an insurance policy
    for the duration of the lease, and the lease agreement is placed on the blockchain.


    Airports are also looking at automating short-term car rentals, alleviating the
    paperwork required to rent a vehicle. The same technology being developed for
    leasing will also apply to car rentals.


    The digital medical certificates used by the Estonian Road Authority for license
    renewals could also be used for automatic rental or leasing in the future.


    ## RIDE-SHARING


    Uber and other similar ride-sharing apps have already caused huge disruption to
    the taxi industry and have changed the face of transportation for millions of
    people. Up to then, taxi companies monopolized transport, with all of a city’s
    taxi licenses being controlled by a single organization. However, while the likes
    of Uber do provide alternatives, they are stilled controlled by a single company.


    Ride-sharing should be a process shared only by the driver and the passenger,
    but current companies still require an intermediary between the two parties. With
    blockchain technology, those third parties could be removed and decentralized
    systems created. One startup currently working on this system is called La’zooz.


    The ride-sharing industry would be easy to disrupt with the blockchain, but many
    companies have concerns about driver safety. However, if digital identities were
    linked to car leasing/rental and road authority platforms, ride-sharing would
    be able to integrate seamlessly.


    ## PROPERTY


    Real-estate, property, and land sales currently involve a tremendous amount of
    paperwork and several third parties just to facilitate a transaction. These types
    of transactions tend to involve hard-to-obtain, often incorrect, or misplaced
    records and can be very slow.


    With blockchain-based solutions, records would be correct and safely stored, and
    transactions would be much faster and more transparent, not to mention cheaper.


    Blockchain platforms for real estate could be used to record title deeds, transfer
    property deeds, track building plans, and zoning changes, and track all property
    changes recorded by governments or companies. One startup currently working on
    a solution for financial institutions, banks, mortgage brokers, and citizens to
    track property-related records and documents is Uniquity.


    Rental properties can also benefit from the blockchain. One company that caused
    industry-wide disruption was Airbnb. They provided a centralized system that allowed
    people to add their properties and rent them directly to people worldwide.


    Airbnb got rid of third parties like the travel agents and hotel chains and allowed
    people to carry out direct transactions. However, while it is moving in the right
    direction, it still only replaces the third parties with a centralized platform.


    The blockchain could be used to develop solutions that allow apartment and hotel
    owners to rent their properties out via direct interaction, thus removing the
    middleman for bookings and financial transactions.


    ## TRAVEL INDUSTRY


    According to Webjet’s MD, John Guscic, about one in 25 worldwide hotel booking
    transactions are provided by people who don’t get paid for their service. This
    is because of the number of third parties involved in the booking industry, where
    bookings get lost or are not correctly paid for.


    The booking system would be more secure with fewer errors with a blockchain-based
    solution. Currently, Microsoft and Webjet are working together to develop a system,
    but there are no details on when it will be released.


    ## LOYALTY AND REWARD PROGRAMS


    Most industries offer some kind of loyalty or reward program, be it your local
    coffee shop or a major business like an airline. However, these tend to cost a
    lot to run and are a risk factor for fraud. Plus, customers tend to be less than
    satisfied with their rewards or find it hard to check their balance and redeem
    their rewards.


    A paper was published by Deloitte, a huge financial services company, titled “Making
    blockchain Real for Customer Loyalty Reward Programs.” The paper looked at how
    loyalty programs built on the blockchain could benefit the companies and the customers.
    According to Deloitte, the existing programs in place suffer from a lack of customers,
    are too slow to process, are prone to fraud, and cost too much to run. Using blockchain
    technology, customer reward accounts would be transparent, faster to process,
    cheaper to run, and more secure.


    When a customer completes a transaction to earn loyalty points, it will show on
    the blockchain in real-time rather than days later, as is the custom with current
    systems. Customers could see their balance immediately. Companies would find it
    easy to integrate reward programs, offer customers valuable opportunities, and
    share their programs with complementary ones.


    Loyall is a startup company working with several companies to build a blockchain
    loyalty program. This will provide transparency, lower costs, will be faster and
    more secure, allowing companies to provide better programs for both customers
    and their own business.


    ## GAMBLING AND PREDICTIONS'
