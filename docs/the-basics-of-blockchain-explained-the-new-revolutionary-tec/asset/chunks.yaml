- raw: 'It’s down to blockchain-based systems to prove that switching to them can
    provide long-term savings and benefits before organizations agree to change their
    systems. Unless they can do that, governments and banks are unlikely to use the
    blockchain in the near future.


    The Estonian government is currently running tests on blockchain systems, but
    they only have a population of just over 1.3 million. China, the US, and other
    countries have individual cities with more people than this. While the blockchain
    may work on smaller scales, integrating them on a larger scale for international
    banks or governments of much larger countries won’t be easy.


    Two examples of distributed or blockchain-based ledgers currently being integrated
    with global financial companies are Ripple and the R3 Consortium. On the other
    hand, some financial institutions are waiting, holding back on blockchain integration
    because so far, the blockchain has only been tested on a small scale, not enough
    for them to see the real benefits in changing their current systems.


    If lots of the larger, trusted financial institutions moved their operations to
    untested technology and issues come to light, it could prove risky to their customers
    and the financial markets.


    The FSOC (Financial Stability Oversight Counsel) has also raised concerns that
    some systems could be more open to fraud, something we can’t fully understand
    on the small-scale testing done so far.


    Another issue raised is regulation, especially where many financial organizations
    work on a shared blockchain system or distributed ledger. In theory, a single
    system based on the blockchain can cover multiple regulatory jurisdictions and
    boundaries, thus blurring the lines between the regulators and where a transaction
    should be handled.


    Major financial companies are likely to be wary about using systems with little
    to no government or central regulation. In terms of business and finances, the
    risks are too high should there be no clear regulation about the handling of blockchain-based
    assets. Uptake in blockchain technology by governments and large financial companies
    is likely to be slow for three primary reasons – integration cost, regulatory
    concerns, and the fact that tests have thus far been on a small scale only.


    ## HYPE


    It would be easy to say that much of what we read about blockchain technology
    could be considered hype. We constantly read of claims that the technology will
    disrupt governments and every other major industry in the world. We read that
    it will end world poverty, get rid of the banks and credit card companies, and
    change the world in so many other ways.


    Getting caught up in hype is easy, especially when it surrounds technology with
    the serious potential to change the world as we know it. The internet was the
    same, a technology slated to revolutionize the world, and, to a certain extent,
    it has done just that. However, many of the predictions about the internet were
    never realized, and the same is set to be true of blockchain technology.


    More often than not, timeframes surrounding how new technology will have an impact
    are significantly underestimated. We know that digital cash existed long before
    Bitcoin, and technologies based on cryptography have been around for decades.
    Their predictions about marker adoption were seriously underestimated.


    Even if there are some accurate predictions regarding the use of blockchain technology,
    it will be years before their mainstream societal impact becomes known. Startup
    companies responsible for pioneering technology may not make it far enough to
    see their dreams come to fruition.


    Because many people who use blockchain technology and Bitcoin prefer to use traditional
    methods, such as traditional passwords and third parties, the need for the blockchain
    is effectively eliminated. After all, the blockchain is designed to remove passwords
    and third parties, and if people still want to use them, there is little point
    to the blockchain.


    At the end of the day, many people see the blockchain as nothing more than a way
    of storing data and managing it. It can’t change the world, and it certainly cannot
    change world problems, so there is no point in getting caught up in all the hype
    surrounding it.


    ## KEY TAKEAWAYS


    The key takeaways from this chapter are:


    *   **No Privacy –** not all decentralized blockchains are private, and anyone
    on a network can see every transaction and account balance.


    *   **Security Issues –** blockchain assets are considered similar to cash – if
    your cash is stolen from your wallet, it’s gone, and if your assets are stolen
    from the blockchain, they too are gone. Many people are choosing to write their
    private keys down on paper, so they don’t forget what they are, which goes against
    the secure nature of the blockchain. If your private key is stolen, there’s nothing
    you can do about it, and some of the security methods used on the blockchain are
    likely to make wide-scale adoption more difficult.


    *   **Lack of Centralized Control –** on decentralized systems, transactions and
    changes must be agreed upon by more than 50% of the network. Nobody has control
    over any changes, which makes them a risk to organizations as they will lose control
    over changes to their systems.


    *   **51% Attack –** many of the computers on major blockchain networks are based
    in countries where there is historic evidence of widespread crime, no regulation,
    no trust in governments, and lax legal systems. In some of these countries, computer
    costs and electricity are cheap, enabling massive mining farms to be set up. Should
    these choose to collaborate, the networks could be hit with a 51% attack, where
    blockchain control is lost, allowing double-spending, reversed transactions, blocked
    transactions, and so on.


    *   **Unproven Technology –** blockchain technology is relatively new and hasn’t
    yet been proven. So far, its main use has been linked to cryptocurrencies, and
    testing has been too small-scale for most organizations to determine if it will
    work on a larger scale.


    *   **Cost –** blockchain networks require vast amounts of energy, which is costly
    in terms of electricity. The estimated cost of the blockchain is that, in just
    30 minutes, it uses the same amount of power that a standard family in the USA
    uses in 12 months. This calculation is based on a yearly consumption of approximately
    10-12,0000 kWh per year, roughly the same amount needed to mine four Bitcoin blocks.


    *   **Scalability –** because testing has only been small-scale, there is no proof
    that they can effectively work on a larger scale, especially compared to existing
    systems. For example, the Visa network can handle more than 20,0000 transactions
    per second, while Bitcoin can only handle seven.


    *   **Trust and Reputation –** blockchain technology is commonly associated with
    Bitcoin, which, in turn, is connected to criminal activities and terrorism. We
    need to have more trust in a system we are using, especially if that system takes
    the place of a trusted system, and many people will not trust networks with a
    criminal association.


    *   **Lack of Understanding –** not many people truly understand how the blockchain
    works and cannot understand the benefits associated with the technology. There
    are also valid concerns about transactions and balances being so open to others,
    leaving most people preferring to trust in existing systems.


    *   **Integration and Regulation –** in terms of integrating existing systems
    with the blockchain, there are considerable costs in financial and time terms
    and regulatory issues to face. Most banks and governments resist change because
    of scaling issues and the cost of moving to a blockchain-based system.'
