  trans: '


    在加利福尼亚州的霍伯森学校（Holbertson School）计划使用区块链技术对学术证书进行认证。学校中最常见的做法之一是伪造证书和成绩单，学生声称拥有他们并未学习过的资质。使用区块链可以通过创建记录和证书的透明化来消除这种现象。这样，每项资质都将能够验证，从而减少欺诈，并节省学校手动检查的时间和金钱。


    另一个正在发展区块链技术的领域是音乐行业。几家公司已经在区块链上开发应用程序，以改变音乐的共享、分配和购买方式，以及艺术家获得版税的方式。致力于为艺术家提供区块链解决方案初创公司有
    `Uio Music`、`Peertracks` 和 `Mycelia`。这些平台将允许艺术家直接向粉丝出售，而无需第三方或唱片公司参与该过程。


    最近，`Spotify`收购了 `MediaGhain`，该公司开发了一个系统，让艺术家可以在星际文件系统（`InterPlanetary File System`）和`Bitcoin`区块链上为歌曲创建数字音乐。`Spotify`
    希望使用 `MediaGhain` 的区块链平台来确保向艺术家的支付更加公平、更透明。


    ## 云存储


    `Microsoft OneDrive`、`DropBox` 和 `Google Drive` 是转型数据和文件存储的公司，它们充分利用云技术来实现安全。然而，云存储要求用户对第三方极度信任。我们倾向于将所有数据放在一个解决方案中，仅通过简单的密码进行访问，而中心化的存储系统容易受到网络攻击。密码也容易被黑客或扫描器获取。


    初创公司现在正在构建云与区块链的解决方案。`Storj` 以及其他公司已经开发了不再中心化的云存储，受到攻击的可能性较低。数据被加密并存储在网络上，利用每台连接计算机的空闲存储空间，唯一可以访问它的是数据所有者。


    另外两家致力于类似系统的公司是 `Filecoin` 和 `Siacoin`。


    ## 汽车租赁与租赁


    区块链技术具有变革另一个行业是汽车行业。`DocuSign` 和 `Visa` 已经合作开发了一个区块链系统来处理汽车租赁。这将消除目前需要的许多文书工作和第三方。在新系统下，客户选择租赁哪种汽车。他们的数字身份存储在区块链上，包含他们的执照和财务详情。他们同意在租赁期间购买保险单，并将租赁协议放置在区块链上。


    机场也正在考虑将短期汽车租赁自动化，以减轻租赁车辆所需的文书工作。为租赁开发的相同技术也适用于租车。


    爱沙尼亚道路管理局（Estonian Road Authority）用于执照续签的数字医疗证书在未来也可以用于自动租赁或租用。


    ## 网约出行


    `Uber` 和其他类似的共享出行应用已经对出租行业造成了巨大的冲击，并改变了数百万人的交通面貌。在此之前，出租公司垄断了运输，城市所有的出租执照都由单一机构控制。然而，尽管像
    `Uber` 这样的提供了替代方案，但它们仍然由单一公司控制。


    共享出行应该是一个只有司机和乘客之间共享的过程，但目前的公司仍然要求双方之间存在一个中间者。通过区块链技术，可以移除这些第三方并创建去中心化的系统。目前正在致力于该系统的初创公司名为
    `La’zooz`。


    共享出行行业很容易被区块链颠覆，但许多公司对司机的安全表示担忧。然而，如果将数字身份与汽车租赁/租以及道路管理局平台关联，共享出行就能无缝整合。


    ## 物产


    房地产、物业和土地销售目前涉及大量的文书工作和多个第三方，仅为了促进交易。这类交易往往涉及难以获得、通常是错误的或错错的记录，而且速度非常慢。


    通过基于区块链的解决方案，记录将是正确且安全存储的，交易将更快、更透明，更不用说便宜了。


    房地产的区块链平台可用于记录所有权、转让产权据、跟踪建筑计划和分区变更，并跟踪政府或公司记录的所有物业变更。目前正在致力于为金融机构、银行、抵押贷款经纪人和公民提供跟踪物业相关记录和文档的解决方案的初创公司是
    `Uniquity`。


    租赁房产也可以受益于区块链。一家引起全行业动荡的公司是 `Airbnb`。他们提供了一个中心化系统，允许人们添加自己的房产并直接向全球人员出租。


    `Airbnb` 摆除了旅行社和酒店连锁店等第三方，并允许人们进行直接交易。然而，尽管它正在朝着正确的方向发展，但它仍然是将第三方替换为中心化平台。


    区块链可用于开发解决方案，允许公寓和酒店业主通过直接互动出租其房产，从而消除预订和财务交易的中间人。


    ## 旅游业


    根据 `Webjet` 的总经理 `John Guscic` 的说法，全球每 25 笔酒店预订交易中就有一个是由不收取服务费用提供的。这是因为预订行业涉及的第三方过多，导致订单丢失或未正确支付。


    基于区块链的解决方案将使预订系统更安全、错误更少。目前，`Microsoft` 和 `Webjet` 合作开发一个系统，但还没有关于何时发布的细节。


    ## 忠诚奖励计划


    大多数行业都提供某种忠诚或奖励计划，无论是当地的咖啡店还是航空公司这样的大企业。然而，这些计划的运行成本很高，是欺诈的风险因素。此外，客户对他们的奖励并不满意，或者发现很难检查余额和兑换奖励。


    大型金融服务公司 `Deloitte` 发表了一篇题为《让客户忠诚奖励计划实现区块链化》的文章。论文研究了建立在区块链上的忠诚计划如何让公司和客户受益。根据
    `Deloitte` 的说法，现有的计划面临客户不足、处理太慢、容易欺诈和运行成本过高的问题。使用区块链技术，客户奖励账户将更加透明、处理更快、运行成本更低且更安全。


    当客户完成交易获得忠诚积分时，它将实时显示在区块链上，而不是像现有系统那样在几天后显示。客户可以立即看到余额。公司将轻松整合奖励计划，为客户提供宝贵机会，并与其他互补计划共享其计划。


    `Loyall` 是一家与几家公司合作构建区块链忠诚计划的初创公司。这将提供透明度、降低成本，速度更快且更安全，允许公司为客户和他们自己的业务提供更好的计划。


    ## 赌博与预测


