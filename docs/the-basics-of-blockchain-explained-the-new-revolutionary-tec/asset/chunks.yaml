- raw: 'One industry set to be changed by blockchain startups is the gambling industry.
    And it won’t just affect sports gambling; the blockchain is set to disrupt overall
    predictions, including forecasting and financial market predictions.


    Augur is a fast-growing cryptocurrency, developing a decentralized blockchain-based
    prediction system that allows people to predict event outcomes and profit from
    them. The company is basing the system on research showing the accuracy of prediction
    markets over and above predictions made by opinion polls, analysts, surveys, or
    experts.


    Opinion polls are just that – a poll where people state what they want to happen,
    not what they think will happen. This is why polls regarding election results
    are often wildly inaccurate, with the actual results much different than the poll
    predictions.


    ## CROWDFUNDING


    When the crowdfunding industry emerged, it was with one purpose – to remove the
    intermediaries from capital formation by passing individual investors or backers
    the ability to fund entrepreneurs and creators direction. This naturally aligns
    with what the blockchain provides. An example of this is a movie called BRAID,
    the first movie ever to be completely funded on the Ethereum platform. This occurred
    through a token crowdsale via Ethereum’s $1.7m Weifund campaign.


    ICOs or Initial Coin Offerings are where companies place tokens backed by a cryptocurrency
    up for sale in the same way public companies sell their stock. They are another
    example of crowdfunding powered by the blockchain. CoinList and other similar
    companies are currently taking digital assets mainstream by ensuring ICOs are
    legally structured and are compliant.


    Some other ICO ecosystem startups include Republic, a crypto initiative that aims
    to help people invest as little as $10 in ICOs and Waves, a platform aimed at
    helping people store digital assets, manage them and issue them.


    Pledgecamp is an Indiegogo and Kickstarter competitor, aiming to use smart contracts
    to build transparency and provide backer insurance through decentralization. As
    projects on the platform reach their funding target, the money goes to a secure
    escrow wallet and is gradually unlocked. Backers have a clear view of how their
    donations are spent and have input on the project’s direction.


    ## WILLS AND INHERITANCES


    Wills are a specific type of contract which are ideal for being based on a blockchain
    smart contract. As well as being able to challenge the verification of death,
    litigation surrounding wills also involves challenges to whether the will is genuine
    or not and whether the legal interpretation is what the deceased wanted.


    While these challenges could not be entirely removed by a blockchain solution,
    identifying facts would be easier, as would the provision of transaction data
    that can be verified and dismiss unmeritable claims.


    Zweispace is a Japanese startup company using its own Smarter Contract platform
    to develop a system where a will is self-executed. The blockchain would automatically
    distribute an inheritance trust’s assets to the correct beneficiaries once verifiable
    confirmation of the trustee’s death is received. This removes the need for will
    executors and reduces the risk of lengthy, expensive court cases to contest a
    will.


    ## KEY TAKEAWAYS


    The key takeaways from this chapter are:


    *   The financial industry is not the only one currently developing and implementing
    blockchain-based solutions. Many others are, and the blockchain has potential
    uses in the following:


    **Digital Identities –** the blockchain has the potential to put a stop to online
    identity theft and fake IDs by setting up systems based on digital signatures.


    **Digital Voting –** while few digital voting systems have been successful so
    far, the technology has the potential to ensure voters can monitor their votes
    in privacy. They can keep their online identities safe and ensure their votes
    cannot be tampered with. It could also mean a much higher “turnout” at elections.


    **Healthcare and Medical Records –** having these on the blockchain would make
    it easier for healthcare professionals to make better diagnoses, and patients
    could see all their records too. Estonia already uses digital medical certificates
    to determine if a driver is medically fit to drive, and they have developed a
    patient portal for every citizen.


    **Academic Certificates –** the Holbertson School in California plans to use the
    blockchain to eliminate the falsification of certificates and qualifications.
    The music industry is already working on blockchain solutions to change how artists
    share their music and how they get paid.


    **Cloud Storage –** current cloud storage solutions are unsafe and prone to attack,
    requiring only a simple password for access via a third party. Storj, SiaCoin,
    and Filecoin are just three of the companies developing combined cloud and blockchain
    technology for better data storage.


    **Car Rentals and Leasing –** DocuSign and Visa have teamed up to develop a leasing
    system on the blockchain to help automate the rental and leasing process. The
    digital medical certificates used by the Estonia Road authority could also be
    linked to the blockchain to allow automatic rental or leasing.


    **Ride-Sharing –** companies like Uber have already disrupted the taxi industry
    but still require a third party for interactions between the driver and passenger.
    The blockchain could eliminate the third party, and once other blockchains for
    car leasing/rentals and Road Agencies were in use, ride-sharing could integrate
    seamlessly. La’zooz is one company currently working on this kind of technology.


    **Property –** current real estate, property, and land sales systems are slow
    and cumbersome, with often hard-to-get records. The blockchain could remove the
    third parties and allow all records to be stored online, facilitating direct sales
    and transfers of property. The same applies to rental properties. While Airbnb
    has taken us a step in the right direction, the blockchain could remove the need
    for a central platform, allowing people to transact directly.


    **Travel Industry –** the current system is unwieldy, with too many third parties
    and too many transactions lost or not paid for properly. Microsoft and WebJet
    are working on a blockchain-based travel industry solution, but there is no release
    timeline.


    **Loyalty/Reward Programs –** programs currently in place are too slow and open
    to fraud. More often than not, customers find it hard to check and redeem their
    rewards and are unhappy with the rewards they get. A blockchain system would enable
    customers to see their balances immediately and not have to wait for the system
    to be updated. A startup company called Loyall is currently working on a blockchain-based
    loyalty system that offers more transparency and is faster, cheaper, and more
    secure.


    **Gambling and Predictions -** the gambling and predictions industry is also set
    to be shaken up. Augur is a cryptocurrency currently developing a blockchain predictions
    system for people to bet on event outcomes and make a profit.


    **Crowdfunding –** crowdfunding already aligns with what the blockchain promises,
    and ICOs are another example of how the blockchain powers crowdfunding. Companies
    already involved in building blockchain-based crowdfunding projects are CoinList,
    Republic, Waves, and Pledgecamp.


    **Wills and Inheritances –** wills are special contracts that are subject to the
    risk of being challenged regarding their legitimacy and whether the deceased’s
    intentions have been correctly interpreted. A Japanese startup called Zweispace
    is currently building a blockchain smart contract solution for self-executing
    wills and automatic distribution of assets, reducing the risk of court battles
    and eliminating the executors as intermediaries.


    *   The blockchain can be used to store and transfer anything of value. Many companies
    are already developing solutions; some are already up and running.'
