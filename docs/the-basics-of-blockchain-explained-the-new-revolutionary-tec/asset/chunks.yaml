- raw: 'This continues through the entire blockchain – each block references the hash
    from the previous block. This reference is placed in the block’s header and creates
    the link between the blocks, thus creating the chain. So, using our previous examples,
    a blockchain that looks like this can be created:


    Block 0 – Genesis Block:


    Hash of the previous block: —0


    no previous block


    Hash of block 0:


    0000641727781545e50c0235823c9ae0785d4l9499cc5a5dcdff2332 a5Sfof7f


    Block 1:


    Hash of previous block – block 0:


    000064172778I545e50c023S823c9ae0785d419499cc


    Sa5dcdff2332a53f0f7f


    Hash of block 1:


    0000ed29ee4097b79eI94adb3fi5bI8c500a900ffb3aI670dec4673eac2abdd07


    Block 2:


    Hash of previous block - Block 1:


    0000ed29ee4097b79el94adb355bl8c500a900ffb3al670dec4673eac2abdd07


    Hash of block 2:


    0000d5cadaZ8a59cb05llcc87ld550fe0c4ba704a93ad35db37B936c6ab40caf


    Block 3:


    Hash of previous block - Block 2:


    0000d5cada28a39cb05lIcc87ld550fe0c4ba704a93ad33db378936c6ab40caf


    Hash of block 3:


    0000lbbd649l304360dl42bd5U26l02l4937c263b0bc6cMb3ac04574b62d4c


    That shows you a basic example of how a blockchain is created. Each transaction
    group is turned into a hash. That hash is combined with the hash from the previous
    block and a nonce. A nonce is a number representing the answer to the puzzle the
    miners need to solve. Once the puzzle is solved, each block is verified and added
    to the blockchain. The previous block’s hash is always added to the header of
    the current block.


    A transaction can be followed all the way through the chain to help us understand
    what has occurred.


    ## ALTERING A BLOCKCHAIN


    As that example of hash generation showed us, if we make any change to the input
    text, even a minor one, it will result in a completely different hash being generated.
    This feature ensures the security of the blockchain, making fraud virtually impossible
    to commit by changing blockchain transactions.


    So, the first block has these transactions:


    John has sent 50 Bitcoins to Sally


    Sally has sent 10 Bitcoins to Sam


    Let’s say Sam wants to change the blockchain to show that Sally actually sent
    him 20 Bitcoins, not 10. All it would require is changing a single number in the
    transaction. In a traditional financial database, this could easily be done –
    a number could be deliberately or accidentally entered wrong, and it wouldn’t
    be noticed, at least not for a while.


    However, that one change in the blockchain would result in a brand new hash being
    generated for the transaction block.


    The block’s original has is:


    0000ed29ee4097b79el94adb355bl8c500a900Rb3al670dec4673eac2abdd07


    By changing one number, the new hash would be generated, which is:


    0000Me9eda5e3f8782c505 l068935abcd7l0ffd5fecb7fe7eaa6a57f8aa1208


    However, it doesn’t end there. Because block 2’s header contains a link to the
    first block, that too would need to be changed to include the newly generated
    hash. In turn, because block 2’s header has changed, block 3’s would need to change
    to reference block 2’s new hash. This continues all the way through the blockchain
    until every hash has been changed.


    ## BLOCKCHAIN CONFIRMATIONS


    Every 10 minutes, a new block gets added to Bitcoin’s blockchain, but other blockchains
    are much faster at adding blocks than this.


    We already know that changing a transaction results in every block needing to
    be mined again with new hashes, but this has to be done faster than blocks are
    added to the rest of the network. While this could possibly be done for some of
    the recent blocks, it is accepted that block transactions cannot be changed once
    six blocks have been added on top of the block containing the transaction to be
    altered.


    When a block is added on top of a block, it confirms the validity of the previous
    block, basically a kind of guarantee that the previous block’s transactions will
    not change. If six blocks were added, that is six confirmations of validity and
    guarantee, providing businesses with sufficient confidence that previous transactions
    won’t be changed in any way.


    ## THE DIFFICULTY TARGET IN THE BLOCKCHAIN NETWORK


    The hashes we saw in our example each have a number of zeros in front of them.
    We can only add a block to the Bitcoin blockchain when the hash is lower than
    the network’s target hash. The examples below are somewhat technical, but you
    can think of it as a random roll of the dice. Each dice contains the numbers 1
    to 6; if 6 is selected as the target and you roll lower than that, the block can
    be added to the blockchain.


    If the target hash is lower, it becomes exponentially more difficult to roll a
    lower number randomly because there are fewer options. Let’s say the target is
    2. The only way to get the block added to the chain is to roll a 1, and doing
    so randomly will take a long time. The more people there are rolling a dice, the
    lower the target is, is ensure blocks are consistently added to the blockchain.


    In the blockchain we created earlier block 3’s hash contained four zeros at the
    front of it, like this:


    0000lbbd6491304360dI42bd5f32610214937c263b0bc6c44b3ac04574b62d4c


    If the network sets a target of five zeros and a 5, for example, 000005, the hash
    will only be considered valid if it is lower than this. If it isn’t, it wouldn’t
    be accepted and wouldn’t be validated on the blockchain.


    **An Example Target Hash:**


    000005d6b56a86dd37a43d070fe7eb7e59cfb026f7flf5fl4286flIa3ab15Ic9


    **Examples of Acceptable Hashes:**


    Five zeros and a 4:


    000004el3ccc4e31d500b52bc226dc4abb4627c383beaefbf4da90a61b7994O


    Seven zeros and any number:


    000000022b64fdfS0dd4f28a50b542345b9750ee24a3467423acdb66dea27e4ff55


    Eight zeros and any number:


    000000004a4a2e623f74ñdf50e97e62c9e8fi4d07b0eef79a07ddad848c780133


    **Examples of Unacceptable Hashes:**


    These would be rejected:


    Three zeros and any number:


    0005f765f3c32e5e9l1ca18eI36746daa0beflT8a6d7aa48fa487debd959a69d507f


    Four zeros and any number:


    00001c8d7349aea0dd4acf2d16cb5H75035a9ea80b080f751c832dfb97223043ab3f


    Five zeros and a 6:


    000006a3842a3742929149840eb13f8343bb9c332a1c95e9c20f9e20692fe45e24f


    This is somewhat more advanced than our example of rolling a dice, but it does
    work on the same logic, only with a bigger set of numbers.


    Included in the block, the nonce will give us a lower hash than the network’s
    target, thus ensuring it is accepted and added to the blockchain. Any number that
    provides a valid hash lower than the target (the nonce) is the answer to the puzzle
    the miners need to solve.


    The miners choose the transactions that should be in the next block, with the
    inputs and outputs that match them. The previous block’s hash is included, too,
    along with the following:


    *   The previous block’s hash


    *   The network’s current difficulty target


    *   The Merkle tree root


    *   The blockchain address where the reward is to be sent


    *   A timestamp


    When a transaction is to be added to a block, the miner can choose any outstanding
    transactions that need to be added. Typically, they choose those with the largest
    fees as those are passed on to the miner, with any reward they are due if they
    solve the puzzle and add the transaction block to the blockchain.


    As you’ve seen in the above examples, the generated hash appears to be random
    and doesn’t indicate the data that has been entered. Even the miners have no idea
    what the hash is going to be until it has been generated.


    A block can only be added to the blockchain if they generate a lower hash than
    the network target. Achieving this requires adding a number with the transactions
    and the previous block’s hash before generating a new hash.


    The block is only added to the blockchain if they generate a lower hash than the
    network target. If the hash is higher, the nonce is changed, and they have another
    go. Generating hashes is purely random as there is no way to work out what the
    hash is.'
  fmt: '

    This continues through the entire blockchain – each block references the hash
    from the previous block. This reference is placed in the block’s header and creates
    the link between the blocks, thus creating the chain. So, using our previous examples,
    a blockchain that looks like this can be created:


    ### Block 0 – Genesis Block

    Hash of the previous block: `0`

    no previous block

    Hash of block 0:

    `0000641727781545e50c0235823c9ae0785d4l9499cc5a5dcdff2332a5Sfof7f`


    ### Block 1

    Hash of previous block – block 0:

    `000064172778I545e50c023S823c9ae0785d419499ccSa5dcdff2332a53f0f7f`

    Hash of block 1:

    `0000ed29ee4097b79eI94adb3fi5bI8c500a900ffb3aI670dec4673eac2abdd07`


    ### Block 2

    Hash of previous block - Block 1:

    `0000ed29ee4097b79el94adb355bl8c500a900ffb3al670dec4673eac2abdd07`

    Hash of block 2:

    `0000d5cadaZ8a59cb05llcc87ld550fe0c4ba704a93ad35db37B936c6ab40caf`


    ### Block 3

    Hash of previous block - Block 2:

    `0000d5cada28a39cb05lIcc87ld550fe0c4ba704a93ad33db378936c6ab40caf`

    Hash of block 3:

    `0000lbbd649l304360dl42bd5U26l02l4937c263b0bc6cMb3ac04574b62d4c`


    That shows you a basic example of how a blockchain is created. Each transaction
    group is turned into a hash. That hash is combined with the hash from the previous
    block and a `nonce`. A `nonce` is a number representing the answer to the puzzle
    the miners need to solve. Once the puzzle is solved, each block is verified and
    added to the blockchain. The previous block’s hash is always added to the header
    of the current block.


    A transaction can be followed all the way through the chain to help us understand
    what has occurred.


    ## ALTERING A BLOCKCHAIN

    As that example of hash generation showed us, if we make any change to the input
    text, even a minor one, it will result in a completely different hash being generated.
    This feature ensures the security of the blockchain, making fraud virtually impossible
    to commit by changing blockchain transactions.


    So, the first block has these transactions:

    * John has sent 50 Bitcoins to Sally

    * Sally has sent 10 Bitcoins to Sam


    Let’s say Sam wants to change the blockchain to show Sally actually sent him 20
    Bitcoins, not 10. All it would require changing a single number in the transaction.
    In a traditional database, this could easily be done – wouldn’t noticed for a
    while. However, that change in the blockchain would result in a brand new hash
    being generated. The block’s original has:

    `0000ed29ee4097b79e94adb35bl8c50a900f367acdd07`


    By changing one number, the new hash would be:

    `000099eda5e3f8782c505l68935abcd7f5f828`. However, it doesn’t end there. Because
    block 2’s header contains a link to the first block, too would need to be changed.
    In turn, block 2’s header changed, block 3’s would need to reference block 2’s
    hash. This continues all the way through every hash has changed.


    ## BLOCKCHAIN CONFIRMATIONS

    Every 10 minutes, a new block gets added to Bitcoin’s blockchain, but other blockchains
    are much faster. We already know that changing a transaction results in every
    block needing to be mined again. When a block is added on top of another, it confirms
    the validity of the previous block. If six blocks were added, that is six confirmations,
    providing with sufficient confidence that previous transactions won’t change.


    ## THE DIFFICULTY TARGET IN THE BLOCKCHAIN

    The hashes we saw in our example have a number of zeros in front. We can only
    add a block to the blockchain when the hash is lower than the network’s target.
    The examples below are somewhat technical, but you can think of it as a random
    roll of the dice. Each dice contains numbers 1 to 6; if 6 is selected as the target
    and you roll lower than that, the block can be added.


    If the target hash is lower, it becomes exponentially difficult to roll a lower
    number because there are fewer options. Let’s say the target is 2. The only way
    to get the block added is to roll a 1, and doing so randomly will take a long
    time. The more people are rolling the dice, the lower the target is, ensuring
    blocks are consistently added to the blockchain.


    In the blockchain we created, block 3’s hash contained four zeros at the front,
    like this:

    `0000lbbd6491304360d42bd5f3261021493c263b0bc6c44b3ac0457b6c`


    If the network sets a target of five zeros and a 5, for example `000005`, the
    hash will only be considered valid if it is lower than this. If it isn’t, it wouldn’t
    be accepted and wouldn’t be validated on the blockchain.


    ### An Example Target Hash

    `000005d6b56a86dd37a43d070fe7eb7e59cfb026f7f5f4286f3ab159`


    ### Examples of Acceptable Hashes

    Five zeros and a 4:

    `000004e3ccc4e31d500b52bc26dc4abb4627c38beaefbf4da90a61b7994`


    Seven zeros and any number:

    `000000022b64fdf5dd4f28a50b542345b9750ee24a3467423acdb66dea27eff55`


    Eight zeros and any number:

    `000000004a4a2e623f74df50e97e62c9e8f4d07b0eef79a07ddad84c780133`


    ### Examples of Unacceptable Hashes

    These would be rejected:

    Three zeros and any number:

    `0005f765f3c32e5e9l1ca18e3674daa0beflt8a6d7aa48fa487debd95a69d507f`


    Four zeros and any number:

    `00001c8d7349aea0dd4acf2d16cb5h75035a9ea80b080f751c832dfb9722304ab3f`


    Five zeros and a 6:

    `000006a3842a3742929149840eb13f8343bb9c33a1c95ec20f`

