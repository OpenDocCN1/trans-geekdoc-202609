  trans: '


    就市值而言，`Ripple` 是全球第三大加密货币，也是最知名的区块链项目之一。它它是闭源且中心化的，被设计为一种分布式账本，用于在选定的金融机构之间结算交易。


    开源社区并不希望区块链技术的未来由金融机构控制的中心化、闭源系统组成，而 `Ripple` 因此遭了大量的批评。


    按市值排名第二的加密货币是 `Ethereum`，这也是最大的区块链网络之一。`Ethereum` 是去中心化且开源的，为开发者提供了一个可以在上面构建和运行去中心化应用（Apps）的平台。为了实现这一点，他们使用以太平台代币，被称为
    `Ether` 或 `Eth`。


    目前，去中心化开源和中心化闭源区块链之间还没有明确的获胜者，但两者都在进行重大的研发工作，并伴随着大量的资金。根据需求、社区以及公司或行业的不同，每者都有优劣。


    区块链技术可能会继续向两个方向发展，个人开发者可能会选择去中心化路径，而政府和大型公司则会选择中心化路径。


    ## 分布式账本


    `R3 Consortium` 由几家大型金融机构组成，是区块链技术的另一个方向。`R3` 最初在开发自己的区块链，但从后已放弃了这一计划，转而采用分布式账本。虽然他们的分布式账本提供了许多区块链的优点，但它并不是区块链，不应与区块链混淆。


    虽然分布式账本与区块链技术交织在一起，且许多人认为区块链是分布式账本的基础，但你应该理解，分布式账本并不需要区块链即可运行。


    大多数初创公司和大部分开发工作都是基于区块链，但我们不能忽视这样一个事实：不使用区块链的分布式账本开始成为一种严肃的趋势，并且看起来将在未来持续下去。


    ## 加密货币并不多


    无论如何，每当一个行业发展时，都有许多公司争夺市场空间。然而，随着市场的发展，行业也随之发展，这不可避免地减少了这些公司，直到只剩下主要品牌或公司立足。


    汽车在 20 世纪初被认为是新技术，`USA` 拥有数千家制造商。现在，只剩下几家，都是主要的制造公司。这种减少在大多数行业中都是普遍的，加密货币在未来可能也是如此。目前，我们有大量的加密货币可以选择，每天都有几个新的诞生。然而，只有主要的货币可能在未来生存，并被主流接受为一种支付形式。


    我们已经能看到这种趋势正在发生，新的基于区块链的项目在现有平台上启动，并使用该平台的代币。这在 `Ethereum` 中很常见，许多公司开始启动自己的基于
    `Ethereum` 的项目，并使用 `Ether` 而创建自己的区块链和加密货币。


    ## 更多区块链代币供选择


    虽然我们看到未来加密货币会减少，但基于区块链的代币可能会大幅增加。因为可以使用代币进行基于区块链的购买，它们被认为与加密货币相似。然而，它们的不同之处在于它们运行在现有的区块链上，代表在另一个区块链货币上发行的价值。


    为此最著名的平台是 `Ethereum`，它使用 `Ether` 作为其原生加密货币。代币可以轻松地发行在 `Ethereum` 平台上，无论它们属于谁并代表价值。这些代币通过使用
    `Ether` 和 `Ethereum` 平台来交换价值。


    机构和开发者使用这些代币开发在区块链上运行的应用，而无需花费创建区块链和加密货币的费用。


    ## 区块链 2.0 - D’Apps 与智能合约


    与区块链首次问世相比，情况已经发生了巨大的变化，其新功能被称为区块链 2.0。得益于 `Ethereum` 平台，开发者可以创建智能合约和去中心化应用，我们在书中之前讨论过这一点。d’Apps
    和智能合约的使用正在快速增长，并且看起来只会变得更强大。


    ## 认可与监管


    区块链技术仍然引起了大量的关注和批评，这很大程度上是因为 `Bitcoin`。在早期，政府批评它具有隐私性，这意味着犯罪分子可以很容易利用它进行武器交易、逃税和洗钱。其他人出于相反的原因批评它：去中心化数据库太开放、太透明，任何人的交易和余额可见。


    很大程度上是因为 `Bitcoin` 是区块链最知名的应用之一——它是主流且全球可用。区块链仍处于开发的早期阶段，主要与 `Bitcoin` 等加密货币相关，而且每月都有数百种加密货币产生。


    此前，`Bitcoin` 被政府认为仅仅是用于犯罪活动和洗钱的方式。然而，随着对技术的理解，这种观点已经改变，现在许多金融机构在其市场中使用它。政府开始鼓励金融科技（FinTech）公司在其国家接受加密货币作为支付形式，确保每个国家根据其法律对其进行监管。


    最近，`Bitcoin` 在日本被合法为支付形式。`Australia` 也取消了对所有加密货币的税收，并鼓励任何涉及区块链的公司在该开展业务。


    全球政府将继续吸引初创公司进入金融领域，帮助金融机构创造就业，促进业务，并利用基于区块链的技术帮助经济增长。


    ## 区块链如何影响日常生活


    无论是使用现有的区块链来构建去中心化开源系统，还是私有联盟创建新的区块链，并不重要。可以确定，我们将继续看到区块链在生活领域的数量增加。


    区块链将取代政府和公司目前使用的过时数据库系统。主要的全球银行已经在开发基于区块链的系统来处理账目记录、交易、货币兑换等。


    区块链技术将继续增长，直到它像公司和政府目前使用的数据库一样，成为生活的共同部分。我们还将开始看到区块链替代方案取代日常生活的选择。


    一个例子显示了区块链系统与云存储现有系统并存。`Siacoin` 和 `Storj` 已经在开发基于区块链的云存储去中心化系统。虽然它们在短期内不太取代 `DropBox`、`Google
    Drive` 或 `Microsoft OneDrive`，但它们确实在决定在云端存储文件时为我们提供了替代方案。


    '
