    In terms of market cap, `Ripple` is the third biggest cryptocurrency in the world
    and is one of the best-known blockchain projects. It is also closed-source and
    centralized and was set up as a distributed ledger to settle transactions between
    selected financial institutions.


    The open-source community doesn’t want blockchain technology’s future to consist
    of centralized, closed-source systems controlled by the financial institutions,
    and `Ripple` came in for a whole heap of criticism.


    The second-biggest cryptocurrency by market cap is `Ethereum`, and it is also
    one of the largest blockchain networks. `Ethereum` is decentralized and open-source,
    providing developers with a platform on which to build and run decentralized apps.
    To do this, they use Ethereum platform tokens, known as `Ether` or `Eth`.


    Right now, there isn’t a clear winner between decentralized open-source and centralized
    closed-source blockchains, but significant research and development work is ongoing
    for both, along with a lot of funding. Each has benefits, depending on the requirements,
    communities, and companies or industries.


    It is likely that blockchain technology will continue developing in both directions,
    with individual developers choosing the decentralized path while governments and
    large companies choosing the centralized path.


    ## Distributed Ledgers


    The `R3 Consortium` comprises several large financial institutions and is yet
    another direction on blockchain technology. Originally, `R3` was developing their
    own blockchain but has since-given up on this, moving onto a distributed ledger
    instead. While their distributed ledger offers many of the blockchain’s benefits,
    it isn’t a blockchain and shouldn’t be confused with one.


    While distributed ledgers are intertwined with blockchain technology, and many
    assume that blockchains underlie distributed ledgers, you should understand that
    a distributed ledger does not need a blockchain for it to work.


    Most startups and much of the development work is based on the blockchain, but
    we cannot ignore the fact that distributed ledgers that don’t use the blockchain
    are starting to become a serious trend that looks set to continue into the future.


    ## Not So Many Cryptocurrencies


    No matter what it is, whenever an industry develops, it has plenty of companies,
    all vying for a space in the market. However, as the market develops, the industry
    develops with it, which inevitably reduces those companies until the only ones
    standing are the major brands or corporations.


    Cars were considered new technology at the beginning of the 1900s, and the `USA`
    had thousands of manufacturers. Now, there are just a few left, all major manufacturing
    companies. This reduction is common across most industries, and the same is likely
    to be true of cryptocurrencies in the future. Right now, we have a huge choice
    of cryptocurrencies to choose from, and every day sees a few more being created.
    However, only the major ones are likely to survive in the future, being accepted
    by the mainstream as a payment form.


    We can see this trend already occurring, as new blockchain-based projects are
    launched on existing platforms, using that platform’s tokens. This is common with
    `Ethereum`, with many companies starting their own `Ethereum`-based projects and
    using `Ether` rather than creating blockchains and cryptocurrencies of their own.


    ## More Blockchain Tokens to Choose From


    While we see fewer cryptocurrencies in the future, there will likely be a significant
    increase in blockchain-based tokens. Because we can use tokens for blockchain-based
    purchases, they are considered similar to cryptocurrencies. However, they differ
    because they run on existing blockchains, representing a value issued on another
    blockchain’s currency.


    The best-known platform for this is `Ethereum`, which uses `Ether` as its native
    cryptocurrency. Tokens can easily be issued on the `Ethereum` platform, no matter
    who they belong to, and represent value. These tokens are used to exchange value
    by using `Ether` and the `Ethereum` platform.


    Organizations and developers use these tokens to develop applications to work
    on the blockchain without the expense of creating blockchains and cryptocurrencies
    of their own.


    ## Blockchain 2.0 - D’Apps and Smart Contracts


    Compared to when the blockchain first came out, things have changed considerably,
    and its new functionalities are termed blockchain 2.0. Thanks to the `Ethereum`
    platform, developers can create smart contracts and decentralized apps, and we
    discussed this earlier in the book. The use of `d’Apps` and smart contracts is
    growing rapidly and only looks set to get stronger.


    ## Acceptance and Regulation


    Blockchain technology is still attracting a significant level of concern and criticism,
    and much of this is because of `Bitcoin`. In its early days, the government criticized
    it for having private transactions, which meant criminals could easily use it
    for drugs and weapon sales, tax evasion, and money laundering. Others criticized
    it for the opposite reason: decentralized databases were too open and transparent
    and didn’t offer enough privacy, with everyone’s transactions and balances available
    for anyone to see.


    Much of this is because `Bitcoin` is one of the best-known applications of blockchain
    technology – it’s mainstream and available anywhere in the world. The blockchain
    is still in the early phases of full development and is still mostly associated
    with cryptocurrencies like `Bitcoin`, and, every month, hundreds more cryptocurrencies
    are created.


    Previously, `Bitcoin` was dismissed by governments, seen only as a way for criminal
    activities and money laundering. However, as the technology becomes more understood,
    that view has changed, and now many financial institutions use it in their markets.
    Governments are beginning to encourage `FinTech` (Financial Technology) companies
    to accept cryptocurrencies in their countries as a payment form, ensuring that
    each country regulates it as per their laws.


    Recently, `Bitcoin` was legalized in Japan as a legal payment form. `Australia`
    has also abolished taxes on all cryptocurrencies and encourage any company involved
    with the blockchain to do some of their business in the country.


    Startups will continue to be attracted to the `FinTech` space by worldwide governments,
    creating jobs with the help of financial institutions, promoting business, and
    using blockchain-based technology to help the economy grow.


    ## How the Blockchain will Affect Everyday Life


    It doesn’t matter whether existing blockchains are used to build decentralized
    open-source or private consortiums create new ones. It’s a given that we will
    continue to see the number of blockchains increase in all areas of our lives.


    Blockchains will replace the current system of outdated databases used by governments
    and companies. Major global banks are already developing blockchain-based systems
    to handle ledger entries, transactions, currency exchanges, and many more.


    Blockchain technology will continue to grow until it is a common part of our lives,
    as common as the databases companies and governments currently use. We will also
    start to see blockchain alternatives appearing to replace everyday life options.


    One example that shows blockchain systems working beside existing systems in cloud
    storage. `Siacoin` and `Storj` are already working on decentralized systems for
    blockchain-based cloud storage. While it is highly unlikely they will take over
    from the likes of `DropBox`, `Google Drive`, or `Microsoft OneDrive` in the near
    future, they do give us an alternative when deciding where our files should be
    stored in the cloud.

