- raw: "Blockchain technology is one of the most easily accessible technologies, especially\
    \ now we have the Ethereum platform, smart contracts, and other recent innovations.\
    \ These innovations ensure that anyone can develop applications based on blockchain\
    \ technology.\n\nThe blockchain can potentially change just about any industry,\
    \ and the projects currently being developed indicate the significant impact this\
    \ technology could have on the real world. Today, many companies are already developing\
    \ their own blockchain-based systems, and in a later chapter, we will discuss\
    \ some of their uses and some projects already in the pipeline.\n\n## REDUCED\
    \ COSTS\n\nFor now, it’s enough to know that the technology could reap significant\
    \ savings for many companies simply by removing the third parties needed in transactions,\
    \ recording assets, and transferring them. Whenever a third party is involved\
    \ in a transaction, it adds significantly to the costs. In the systems we use\
    \ today, transferring and recording assets requires multiple databases and ledgers\
    \ to be maintained by each organization involved in the transaction. With the\
    \ distributed ledger, all parties can transfer and record assets on one ledger,\
    \ thus reducing the time and cost involved.\n\nIt isn’t cheap to maintain databases\
    \ and ledgers, and, more often than not, it is a manual process involving many\
    \ people to keep a check on each ledger’s integrity. With the distributed ledger,\
    \ all these ledgers are replaced with one, ensuring transaction settlement and\
    \ auditing is done in real-time by all parties involved.\n\n## FASTER TRANSACTIONS\n\
    \nNot only does the blockchain reduce transaction costs, but it also increases\
    \ the speed. Because there is no third party involved and all transactions are\
    \ done on one shared ledger, transactions can be completed almost immediately.\n\
    \nLet’s say you want to transfer some money from one bank account to another.\
    \ While the money gets taken from your account straight away, it may take several\
    \ days to appear in the other account. The same applies to purchases made using\
    \ a credit card. While the store owner provides you with the goods or services\
    \ immediately, they may not receive their payment for several days until the credit\
    \ card company has completed the transaction.\n\nblockchain systems are currently\
    \ being developed to speed up these types of transactions, but these are only\
    \ two of many such examples. Systems are being developed to speed up any transaction\
    \ type or any transfer of value. Later, we’ll talk about the companies who are\
    \ developing systems to do this, not just in the financial industry but also in\
    \ many others.\n\n## KEY TAKEAWAYS\n\nThe key takeaways from this chapter are:\n\
    \n*   **Transparency –** the blockchain provides transparency that most traditional\
    \ database, record-keeping, and ledger systems don’t have.\n\n*   **No Third Parties\
    \ –** third parties are removed from the equation, removing the need to trust\
    \ someone else in a transaction or transfer. Instead, that trust goes to the blockchain.\n\
    \n*   **Decentralized Nature –** blockchain systems run on a network of computers\
    \ that is decentralized, ensuring a significant reduction in downtime, hacking,\
    \ and data loss.\n\n*   **Trust –** blockchain-based systems ensure trust between\
    \ parties in a transfer or transaction is increased via transparency, decentralization,\
    \ and removing the third parties. Trust is the largest nontangible benefit of\
    \ the blockchain.\n\n*   **Security –** transactions and data become immutable\
    \ once recorded on the blockchain. This prevents data manipulation and fraud because\
    \ all transactions can be clearly audited to the first block on the chain, the\
    \ “genesis” block.\n\n*   **Plenty of Potential Use Cases –** the blockchain is\
    \ not purely for financial transactions. Pretty much anything of value can be\
    \ stored on the blockchain, and lots of companies are already developing their\
    \ own systems.\n\n*   **The Technology Is Easily Accessible –** besides having\
    \ many use cases, the technology ensures people can easily create applications\
    \ to work on the blockchain without needing to sink a ton of time and money into\
    \ infrastructure. This is because of recent innovations, such as the Ethereum\
    \ network and smart contracts.\n\n*   **Lower Costs –** because there are no third\
    \ parties, the cost of transactions on the blockchain is significantly lower than\
    \ on traditional systems. One traditional transaction may require multiple databases\
    \ and ledgers, but it would require a single shared ledger on the blockchain.\
    \ This reduces validation, confirmation, and auditing costs.\n\n*   **Faster Transaction\
    \ Speeds –** again, because there are no third parties and no requirement for\
    \ multiple ledgers, transactions can be carried out much quicker than traditional\
    \ systems.\n\nWhile most of what you read about blockchain technology revolves\
    \ around the advantages and the significant hype, there are some disadvantages\
    \ too. The next chapter will discuss those disadvantages and situations where\
    \ using the blockchain could be dangerous.\n\n5 ![](images/svgimg0003.svg)\n\n\
    > *“The first rule of any technology used in a business is that automation applied\
    \ to an efficient operation will magnify the efficiency. The second is that automation\
    \ applied to an inefficient operation will magnify the inefficiency.”*\n\n> \n\
    \n> **BILL GATES**\n\nIs blockchain technology really that good? Can it save the\
    \ world from itself?\n\nIn many circles, the blockchain is the only technology\
    \ that can solve every problem in every industry and the whole world. That might\
    \ sound like a dramatic statement, but some do believe this, and, every day, new\
    \ cryptocurrencies and blockchain startups are launching, with promises to disrupt\
    \ the financial sector and much more, right up to eliminating poverty across the\
    \ world.\n\nMany of these claims are similar to those we heard about the internet\
    \ when it was first developed. Yes, the internet has changed the world in many\
    \ ways, but many of the claims made were exaggerated, with unrealistic timeframes,\
    \ and many of the startups people thought would see success soon filed for bankruptcy.\n\
    \nThis chapter will delve into the disadvantages of blockchain technology and\
    \ some of the issues surrounding it.\n\n## NO PRIVACY\n\nOne of the biggest issues\
    \ surrounding a decentralized blockchain is the lack of privacy, making complete\
    \ acceptance of the technology hard. This lack of privacy surrounding the data\
    \ is bad enough, but perhaps worse is that this can be accessed instantly by any\
    \ person on the blockchain network.\n\nTake the Bitcoin blockchain, for example.\
    \ Once payment has been received, it isn’t too difficult to work out the identity\
    \ of the account it came from. Let’s say you go to a shop and make a payment using\
    \ the blockchain. The store owner can see that transaction, and the information\
    \ would detail which wallet the payment came from. The store owner could check\
    \ that account and see what money is in the account and what transactions have\
    \ been made in and out of the wallet.\n\nOne thing that many people find quite\
    \ worrying is the fact that whenever a transaction is made to a public network,\
    \ the decentralized blockchain publishes it. This is even more worrying where\
    \ in-store purchases are made, and the person’s identity and their account can\
    \ be linked.\n\nIn terms of privacy, or the lack thereof, some find it concerning\
    \ that many of the computers running the largest blockchain networks are based\
    \ in China and Russia. Both countries are well-known for their computer crime\
    \ and hacking, and there is a very real fear that personal and private information\
    \ may be used against those who live in these countries or travel there.\n\nSome\
    \ decentralized blockchains do provide extra privacy for transactions and may\
    \ even restrict who can access the information. However, many of the largest cryptocurrency\
    \ blockchains, such as Bitcoin and Ethereum, don’t do this and don’t plan to change\
    \ how they work. In other words, they do not intend to add any more privacy around\
    \ accounts or transactions.\n\n## SECURITY ISSUES"
