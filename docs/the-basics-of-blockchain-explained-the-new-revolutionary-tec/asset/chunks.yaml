- raw: "There has been a considerable amount of hype surrounding blockchain-based\
    \ systems and their potential to disrupt companies and entire industries. Still,\
    \ we are unlikely to see this come to fruition in the short term. However, the\
    \ trend can clearly be seen in the rising number of alternative systems based\
    \ on the blockchain, and that trend is likely to strengthen in the years to come.\n\
    \nThe predictions that the blockchain will replace banks, Uber, Google, and other\
    \ intermediaries may not come true, at least not in the short term. However, whether\
    \ these third parties are replaced or not, we will all come across blockchain\
    \ technology in many ways, be it through systems we already use being replaced\
    \ or being given the option of choosing a blockchain alternative.\n\n## KEY TAKEAWAYS\n\
    \nThe key takeaways from this chapter are:\n\n*   Right now, it’s hard to say\
    \ whether decentralized open-source or decentralized closed-source development\
    \ will win, but there is plenty of development in both areas, and both are likely\
    \ to be developed for different use cases.\n\n*   Distributed ledgers not built\
    \ on blockchains will still have many of the blockchain benefits. They are a growing\
    \ trend that could give blockchain-based systems some serious competition in the\
    \ future.\n\n*   We will see fewer cryptocurrencies in the future, with only the\
    \ major ones surviving. However, we will see an increase in the number of different\
    \ tokens available. Another growing trend is for companies to use tokens on Ethereum\
    \ rather than creating their own cryptocurrencies and blockchains. This trend\
    \ will likely continue as Ethereum allows developers to create their own smart\
    \ contracts and decentralized apps (d’Apps).\n\n*   Blockchain technology now\
    \ has more functionality than it ever did, with things like smart contracts and\
    \ d’Apps that weren’t included in the original code. Blockchain’s future technology\
    \ is referred to as blockchain 2.0, and it includes the new enhancements; thus,\
    \ it cannot be confused with the capabilities of the original blockchain.\n\n\
    *   When the blockchain first came out, companies and governments refused to accept\
    \ it, but now that is changing. The blockchain is more accepted these days, and\
    \ some governments encourage industries and companies to accept cryptocurrencies\
    \ as payment forms. At the same time, much research and funding are being plied\
    \ into developing blockchain technology and infrastructure.\n\n*   Blockchain\
    \ technology may not be the predicted revolution in the short term, but it will\
    \ become a part of our lives through payment forms, distributed ledgers, or alternative\
    \ choices to existing systems.\n\nThe next chapter will look deeper into the blockchain,\
    \ with a more technical look at how they work, building on what you have already\
    \ learned.\n\n10 ![](images/svgimg0003.svg)\n\n> *“The blockchain is a distributed\
    \ network that solves all the problems that we have of finance, but more broadly,\
    \ it’s like a philosophy. It’s a way of life.”*\n\n> \n\n> **MIKE CERNOVICH**\n\
    \nI could have added this to the first chapter, but not everyone is interested\
    \ in the technical workings of the blockchain, preferring to content themselves\
    \ with a basic overview. Here, I will delve into advanced aspects of the blockchain,\
    \ such as cryptography and hashes.\n\nI’ve also added a glossary at the end of\
    \ this book so you can refer to it when you want to understand some of the more\
    \ common terms you may hear regarding blockchains, Ethereum, smart contracts,\
    \ Bitcoin, etc.\n\n## HOW THE BLOCKCHAIN WORKS\n\nWe will look at the Bitcoin\
    \ blockchain because it was the first one, and every other blockchain is based\
    \ on it. As such, they all work in much the same way.\n\nThe algorithm used on\
    \ the Bitcoin blockchain is SHA-256. This generates a 25-bit hash, unique and\
    \ fixed in size. But, what is a hash? It’s much like a secret code, using encryption\
    \ to hide the data, preventing it from being decrypted without the correct authorization.\n\
    \nThe generated hash is always fixed in length, and each one is the same length.\
    \ It doesn’t matter whether a single word or an entire library is entered as data;\
    \ the hash will always be the same length. If a single letter is changed, the\
    \ hash changes entirely.\n\nAt first glance, a hash would appear to be completely\
    \ random, unconnected to the data. Unless you have a private key or know the original\
    \ message, there is no way to work the message out from the hash.\n\nSome examples\
    \ of generated hashes are:\n\n**The word “blockchain” hashed, with an upper case\
    \ B:**\n\nb3f4e9b8455ea3ea20e60aae2cad9ld84l2a53bc4M834e3l52f776eb4b44d4c\n\n\
    **The word “blockchain” hashed, with a lower case b:**\n\n154a5318fb886l5ba77954\
    \ ld8753e0b7047Kba4b5cd7676dl24008201803e73\n\n**The word “block chain” hashed,\
    \ with the word s” block” and “chain” separated by a space:**\n\n7ef354758e 1810b\
    \ ldeclf43efbc2d0ff I05b6398756 lfdb4f352d9433d231457\n\n**The Shakespeare play\
    \ “Romeo and Juliet,” in its entirety, with more than 20,0000 words:**\n\ne807d23c\
    \ lfIBe4ba4aa4542d35082e28f9f380407ca603Ia34bcleff424fd3 7a\n\nAs you can see\
    \ in these examples, it isn’t possible to determine the input data by looking\
    \ at the generated hash. You can also see that making a minor change, such as\
    \ adding a space or changing an upper case letter to lower case, results in a\
    \ significantly different generated hash.\n\n## HOW TRANSACTIONS ARE HASHED INTO\
    \ BLOCKS\n\nThe examples above showed you how we could not detect patterns in\
    \ the hash to tell us what the input data was. However, those examples are not\
    \ transactions, so that’s what we’ll use next. Once we have generated the hashes,\
    \ they will be linked to a block:\n\nThe blockchain’s first block is the genesis\
    \ block, or block 0.\n\n**Block 0**\n\nIn the first transaction block will be\
    \ the text:\n\nJohn has received 100 Bitcoins.\n\nSally has received 50 Bitcoins.\n\
    \nSam has received 10 Bitcoins.\n\nThe resulting hash is:\n\nHash 0 - 00006417?778\
    \ I545e50c0235823c9ae0785d4l9499cc5a5dcdff2332a53f0f7f\n\n**Block 1**\n\nIn the\
    \ second transaction block are these transactions:\n\nJohn has sent 50 Bitcoins\
    \ to Sally\n\nSally has sent 10 Bitcoins to Sam\n\nThe transactions are all signed\
    \ using the private key of the Bitcoin address owner sending the payment. The\
    \ private key cannot be seen, but the network can verify that the right private\
    \ key was used to send the payment.\n\nThis transaction block will also contain\
    \ the hash from the last block:\n\n000064172778 I545e50c0235823c9ae0785d4l 9499ccSa5dcdff2352a53ft7f\n\
    \nA “nonce” is also included, a Number Used Once. This nonce contains the answer\
    \ to the puzzle that must be solved by the miners to validate and add the block\
    \ to the blockchain and earn their rewards.\n\nHash 1 — 0000ed29ee4097b79el94adb355bl8c500a900Rb3al670dec4673eac2abdd07\n\
    \n**Block 2**\n\nIn the third transaction block are the transactions below, all\
    \ signed by the private key. The block will also contain the previous block’s\
    \ hash and the nonce:\n\nSally has sent 20 Bitcoins to Sam\n\nJohn has sent 20\
    \ Bitcoins to Sally\n\nHash 2 -\n\n0000d5cada28a39cb05l 1cc87 ld550fe0c4ba704a93ad33db378936c6ab40caf\n\
    \n**Block 3:**\n\nThe fourth transaction block has the transactions shown below,\
    \ plus the nonce and the previous block’s hash:\n\nSam has sent 10 Bitcoins to\
    \ John\n\nSally has sent 20 Bitcoins to John\n\nAnd the resulting hash is as follows\
    \ and will also include the previous hash and the nonce:\n\nHash 3 — 0000lbbd649l304360dl42bd5U26l02l4937c263b0bc6cMb3ac04574b62d4c\n\
    \nAnd so, it goes on throughout the entire blockchain.\n\n## HOW TO CREATE A BLOCKCHAIN\n\
    \nWith the above examples, we are now in possession of four bits of data, all\
    \ converted into hashes. That means those hashes can be added to blocks and a\
    \ blockchain created to link them all.\n\nThe first block contains this hash:\n\
    \n0000641727781545e50c0235823c9ae0785d4l9499cc5a5dcdff2332a5Sfof7f\n\nThis is\
