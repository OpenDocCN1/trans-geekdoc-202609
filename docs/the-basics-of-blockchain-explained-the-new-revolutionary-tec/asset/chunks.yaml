- raw: '## UNPROVEN TECHNOLOGY


    Blockchains and systems based on them are an as yet unproven technology, mostly
    used for cryptocurrencies. Right now, there are few real-world applications, and
    those in existence haven’t been used enough to prove how effective the technology
    really is.


    It is a new technology, and, yes, it does have plenty of potential, but most of
    that potential is theoretical right now. There’s an old saying


    > *“Build a better mousetrap, and the world will beat a path to your door.”*


    This is a common error in business reasoning – yes, the technology may triumph
    over some existing systems, but it doesn’t mean everyone will choose to use it.


    Another blockchain benefit, the removal of third parties, can also have a negative
    effect because many people aren’t prepared to take the risk of connecting to this
    otherwise unproven technology and sending money. They also find it difficult to
    set up private keys, and keeping them safe is a whole other matter. Because of
    that, some people prefer to use wallets or software where their private keys are
    given to third parties, thus eliminating that blockchain benefit.


    ## COST


    Most blockchain networks use a proof-of-work algorithm, which proves that resources
    and computing power were contributed to the network before a transaction block
    could be added to the blockchain. This proof is provided as the solution to a
    puzzle linked to the block; the network has to solve this puzzle to confirm the
    block is correct and doing so takes an awful lot of electricity and computing
    power.


    According to calculations made by Professor J Quiggin from the University of Queensland,
    the Bitcoin network uses the same amount of electricity in 30 minutes as an average
    household in the USA does in one year. That household probably uses an average
    of 10,000 to 12,000 kWh of power per year, and that same amount is required to
    generate just four Bitcoins.


    Because the electricity cost for running the computers using the proof-of-work
    algorithm on the blockchain network is so high, the only real advantages come
    for countries with cheaper electricity or where organizations can strike good
    deals with their energy providers.


    These puzzles will become more difficult as time goes on, which relates to an
    increase in electricity consumption. In turn, that equates to higher costs, and
    it will become so resource-intensive that it will be difficult to run a blockchain
    using the proof-of-work algorithm on large scales.


    ## NO SCALABILITY


    The previous point about costs leads to scalability issues. For companies like
    MasterCard and Visa, both of whom process large numbers of transactions daily,
    the current energy consumption will make it too expensive to use the blockchain.
    This has a serious effect on blockchain scalability.


    One Bitcoin block is added to the blockchain every ten minutes. Each block contains
    in the region of 2,000 transactions, which means the network processes approximately
    three transactions per second.


    Because there are limits on the size of each block, the Bitcoin network only has
    the capacity to handle around seven transactions per second at the most. In tests
    conducted between Visa and IBM, it was determined that the Visa network could
    handle in excess of 20,000 transactions per second. That in itself ensures that
    the blockchain is not really suitable in its current format for massive companies
    like Visa.


    Another issue revolves around a lack of funds. If you don’t have enough money
    on your credit card to pay for something, the transaction will be rejected immediately.
    On the Bitcoin blockchain, that won’t happen because there is nothing in place
    to make it happen.


    Bear in mind that transaction blocks take around ten minutes to be added. Some
    companies may not accept a transaction until a few more blocks have been added,
    thus ensuring that the transaction cannot be reversed.


    So let’s compare these methods. If you purchased goods in a store and paid with
    a credit card, cash, or debit card, the store owner gets their money quickly.
    If you paid using Bitcoin, the store owner might need to wait until more blocks
    have been added to confirm the transaction before they get paid. You can see why
    some people might not be too keen on taking a risk on blockchain technology, at
    least right now.


    Some blockchain networks are quicker than the Bitcoin blockchain, but none are
    as popular, and none are as acceptable as a payment form as Bitcoin is. Even those
    cryptocurrencies and blockchains with faster transaction times cannot scale to
    meet the demands of MasterCard, Visa, and other major financial networks.


    These scalability issues mean that mainstream, large-scale blockchain implementation
    is seen as nothing more than a time-stamped ledger of information.


    ## UNDERSTANDING, REPUTATION, AND TRUST


    At the moment, there is still a lot to learn about blockchain technology, as too
    few people truly understand how it all works. Add to that the bad rep the technology
    picked up with its Bitcoin connection and Silk Road, and it’s easy to see why
    people don’t really trust it yet.


    We know that Bitcoin is the most popular and best-known use of the blockchain,
    but too many people associate it with criminal activities. While it is slowly
    becoming accepted as a legitimate method of making payments, computer crime and
    terrorist activities linked to the cryptocurrency are constantly being dragged
    back into the news, forever keeping that link alive.


    One example is when a computer virus locked the National Health Service (NHS)
    computers in the UK. Nobody could access those computers unless a ransom demand
    in Bitcoin were met. This pushed Bitcoin firmly into the UK news headlines and
    not in a good way; it resulted in the cryptocurrency being irrevocably linked
    with hackers, anonymous computer crime, and terrorist activities. Hospitals were
    locked out of patient records, potentially causing a threat to those needing urgent
    medical care.


    Blockchain technology comes with a claim of creating trust between transactional
    parties without the need for a third party. However, we still need to be able
    to trust the blockchain network, which is difficult when we know that a system
    of anonymous computers runs it. How do you get people to place their trust in
    a system knowingly used by criminals? How do we trust a system when we know that
    many of the computers on the network are located in foreign countries where there
    is a lack of regulation? Or where governments control the citizens to the extent
    where there is no trust?


    Criminal incidents linked to Bitcoin are just one reason organizations currently
    developing their own blockchain systems try to maintain a significant distance
    from the Bitcoin connection. More and more, we are hearing the term “distributed
    ledger” these days, further expanding the gap between Bitcoin and new technologies
    and systems based on the blockchain.


    Many people simply don’t understand the benefits of blockchain technology. We
    know that some use third parties to store their private keys and standard passwords
    to log into websites, thus skirting around the technology’s main benefits. Most
    people don’t want others to see their transactions or balances or any other aspects
    of an open system and prefer to stick to existing ones.


    If the technology is to be accepted in the mainstream, people need to understand
    and trust it, and their perception of it being connected to crime must change.
    This is likely to take a long time and puts a metaphorical spanner in the works
    of blockchain technology going mainstream anytime soon.


    ## REGULATION AND INTEGRATION


    Assets based on the blockchain are currently facing long processes in regards
    to integrating them with existing systems and regulating them. Banks, financial
    institutions, governments, even legal organizations are somewhat resistant to
    making changes, mostly because of the enormous cost and sheer scale of replacing
    their current systems.'
