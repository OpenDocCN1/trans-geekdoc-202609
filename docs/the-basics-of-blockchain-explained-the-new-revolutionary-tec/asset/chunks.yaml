- raw: '*   **Business Network Card –** it provides a user, node, or entity with the
    information needed to connect to a blockchain business network


    **C**


    *   **Casper –** a consensus algorithm that combines the proof-of-stake and proof-of-work
    concepts. Ethereum will use Casper to transition from proof-of-work to proof-of-stake


    *   **CDN (Content Delivery Network)** – a CDN allows assets required to load
    internet content to transition much quicker. This included js, HTML, and CSS


    *   **Centralized –** something that a central group or location maintains


    *   **Chaincode –** a program to initialize the state of a ledger and maintain
    it. It does this through submitted applications and is the Hyperledger Fabric
    equivalent of a Smart Contract


    *   **Coin –** represents a digital asset built on blockchain technology


    *   **Composer CLI –** a command-line in Hyperledger Fabric that allows administrative
    tasks to be carried out


    *   **Composer Rest Server –** generates rest servers from deployed blockchains,
    along with their associated APIs


    *   **Consensus –** when a transaction is agreed on as valid by the majority to
    the network


    *   **CRUD – the** acronym for Create, Retrieve, Update, Delete


    *   **Cryptographic Hash Function -** a function returning a fixed-length string,
    unique for each input, This is used to create an input string’s digital thumbprint
    or digital ID


    **D**


    *   **D’Apps –** the common name for decentralized applications


    *   **DAO –** Decentralized Autonomous Organization only run as programs via encoded
    rules. These programs are known as Smart Contracts


    *   **DDOS Attack –** Distributed Denial Of Service attack, a cyber-attack where
    a malicious person tries to make a network or individual computer resource unusable,
    usually temporarily but sometimes indefinitely. This is done by disrupting an
    internet-connected host’s services


    *   **Decentralized –** shared network where the nodes or network members are
    widespread. These nodes collectively process and validate transactions without
    needing a central party to oversee things.


    *   **Digital Asset –** media or text formatted into a binary format or source


    *   **Digital Signature –** a mathematical scheme by which a digital asset’s authenticity
    is presented


    *   **Distributed Ledger –** a database that each network member holds and independently
    updates. It is a unique distribution as no central authority communicates records
    to the network members


    **E**


    *   **Enum –** short version of enumeration. An enum is a fixed list containing
    possible values, for example, a list of the US states


    *   **EOA –** Externally Owned Account


    *   **ERC –** Ethereum Request for Comments standards


    *   **Ethereum –** a blockchain using Solidity, a built-in language that allows
    developers to create ad run decentralized apps based on their needs. Ledger transactions
    are validated using Smart Contracts


    **F**


    *   **Fork -** when a blockchain splits due to dissent among network members and
    a new blockchain is set up


    **G**


    *   **Gas –** measures the amount of work needed to perform an action on the Ethereum
    blockchain


    *   **Genesis Block –** the first block in a blockchain


    *   **Github –** a version control hosting service that uses git


    *   **Golang –** the programming language created in 2009 by Google and based
    on C language


    *   **Gossip Protocol –** a computer-to-computer communication protocol based
    on how information is disseminated by social networks or how an epidemic spreads


    *   **Governance –** a blockchain company’s administration that decide the company’s
    direction


    **H**


    *   **Hard Fork –** another split that changes public blockchain data and requires
    all network nodes to upgrade to the new version and agree on it


    *   **Hash Function –** a function for mapping arbitrarily-sized data


    *   **Hyperledger –** an umbrella project that the Linux Foundation started, it
    contains a series of open-source blockchains


    *   **Hyperledger Composer –** the blockchain Application Development Framework
    which simplifies application development for blockchains on Hyperledger Fabric


    *   **Hyperledger Fabric –** hosted by Linux, Fabric is a Hyperledger project
    for hosting chaincode, which are Smart Contracts


    **I**


    *   **IDE –** an Integrated Development Environment, the IDE is an application
    used by software developers and consists of a build automation tool, a source
    code editor, and a debugger


    *   **Immutable –** something that cannot be changed, like data stored in a blockchain
    cannot be changed by anyone


    *   **ICO –** Initial Coin Offering is how new cryptocurrency ventures raise capital.
    Modeled on an IPO (Initial Public Offering), ICO funders receive tokens.


    *   **Instantiate/d –** where solid evidence or an instance of is provided to
    support a concept, claim, theory, etc.


    *   **Invariant –** a quantity, function, or property that doesn’t change when
    a particular transformation is applied


    *   **IPFS –** InterPlanetary File System


    **M**


    *   **Merkle Tree –** a tree where all leaf nodes contain a label with the data
    block’s hash, and non-leaf nodes contain a label with a cryptographic hash of
    its child node labels


    *   **Mining –** how blockchain transactions are validated. Mining requires considerable
    electricity and computing power as miners solver puzzles to validate transactions
    and earn rewards


    *   **Mining Pool –** a pool of miners who collaborate to share power on the network
    and split any earned rewards


    *   **Mist –** a browser used to install D’Apps and use them


    *   **MSP –** Membership Service Provider – one or more MSPs can govern a Hyperledger
    Fabric blockchain network


    **N**


    *   **Node –** a copy of the blockchain ledger held and operated by a blockchain
    network user


    *   **Nonce –** a number that is only used once in cryptographic communications
    and usually has a timestamp in it


    *   **Nothing at Stake problem –** this happens after a hard fork when validator
    nodes approve the transactions on both old software and new


    *   **NPM –** Node Package Manager, the default runtime environment is node.js.
    The NPM manages an application’s dependencies


    **O**


    *   **Oauth Protocol –** the Open Authorization standard is used by third-party
    services to store user information and distribute it while maintaining password
    security


    *   **Ommer –** aka Uncle – an ommer block is one that has been mined completely
    but has not been added to the blockchain yet.


    *   **On-Chain Governance –** a system where cryptocurrency blockchain changes
    are managed and implemented


    *   **Oracles –** an agent to find real-world occurrences and verifies them, submitting
    the information to a blockchain so that Smart Contracts can use it


    *   **Orderer Network –** computer network where nodes can share resources


    **P**


    *   **P2P –** Peer-to-peer – a computer network where all computers are servers
    for others. This allows shared access to peripherals and files without a central
    server being required


    *   **PKI –** Public Key Infrastructure – a group of procedures, policies, and
    roles required to create digital certificates, manage and distribute them and
    store and revoke them. They also manage public-key encryption


    *   **Pragma/Pragma-Line** – this defines the compiler version used by a Smart
    Contract


    *   **Private Blockchain** – a blockchain only accessible by those with permissions.
    Unlike public blockchains, private ones do not use Proof-of-Work, Proof-of-Stake,
    or any other consensus algorithm. Instead, a BFT (Byzantine Fault Tolerant) system
    is used, which is not trustless, meaning BFT is not a very secure system


    *   **Proof-of-Activity** – where active stakeholders maintaining full nodes receive
    rewards


    *   **Proof**\-**of-Burn –** miners burn coins by sending them to an inactive
    address. These then get recorded on the blockchain, and the user receives a reward'
