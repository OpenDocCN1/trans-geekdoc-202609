  trans: '


    区块链初创公司将改变的行业之一是博彩行业。这不仅会影响体育博彩；区块链还将颠覆整个预测领域，包括预测和金融市场预测。


    `Augur`是一种快速增长的加密货币，正在开发一种基于区块链的去中心化预测系统，允许人们预测事件结果并从中获利。该公司基于相关研究开发该系统，该研究表明预测市场的准确性高于民意调查、分析师预测、问卷或专家的预测。


    民意调查仅仅是调查——人们表达他们*希望*发生什么，而不是他们*认为*会发生什么。这就是为什么关于选举结果的民调往往非常不准确，实际结果与民调预测差异巨大。


    ## 众筹


    当众筹行业出现时，其目的只有一个——通过赋予个人投资者或资助者资助企业家和创造者的能力，消除资本形成过程中的中间环节。这与区块链提供的功能天然契合。一个例子是名为
    `BRAID` 的电影，它是第一个完全在 `Ethereum` 平台上完成筹资的电影。这是通过 `Ethereum` 的 `$1.7m Weifund` 活动通过代币发售实现的。


    `ICOs` 或“首次代币发行”（Initial Coin Offerings）公司像上市公司出售股票一样，将其加密货币支持的代币进行出售。这是区块链推动众筹的另一个例子。`CoinList`
    和其他类似公司目前通过确保 `ICOs` 的法律结构合法且合规，使数字资产走向主流。


    其他一些 ICO 生态初创公司包括 `Republic`，这是一个旨在帮助人们以低至 `$10` 投资 `ICOs` 的加密计划；以及 `Waves`，一个旨在帮助人们存储、管理和发行数字资产的平台。


    `Pledgecamp` 是 `Indiegogo` 和 `Kickstarter` 的竞争对手，旨在使用 `smart contracts` 构建透明度，并通过去中心化提供资助者保险。当平台上的项目达到资金目标时，资金将进入一个安全的托管钱包并逐渐解锁。资助者可以清楚地看到他们的捐款是如何用途的，并对项目方向拥有意见。


    ## 遗嘱与继承


    遗嘱是一种特定的合同，非常适合基于区块链 `smart contract`。除了能够对死亡验证提出质疑外，围绕遗嘱的诉讼还涉及对遗嘱真伪的挑战，以及法律解释是否符合死者意愿。


    虽然区块链解决方案无法完全消除这些挑战，但识别事实将变得更容易，同时也可以提供可验证的交易数据并驳回毫无根据的诉求。


    `Zweispace` 是一家日本初创公司，它使用自己的 `Smarter Contract` 平台开发了一个遗嘱自动执行的系统。一旦收到受托人死亡的可验证确认，区块链将自动将继承信的资产分配给正确的受益人。这消除了对遗嘱执行人的需求，并降低了因争议遗嘱而导致长期昂贵诉讼的风险。


    ## 核心摘要


    本章的核心要点是：


    *   金融行业并非目前正在开发和实施区块链解决方案的唯一行业。许多其他行业如此，区块链在以下方面具有潜力：


    **数字身份 –** 区块链通过建立基于数字签名的系统，消除在线身份盗窃和伪身份证。


    **数字投票 –** 尽管目前很少有数字投票系统取得成功，但该技术有望确保选民能够在隐私状态下监控自己的投票。他们可以保持在线身份安全，并确保自己的投票不被篡改。这可能意味着选举“投票率”会大大提高。


    **医疗与健康记录 –** 将这些记录放在区块链上将使医疗专业人员更容易做出诊断，患者也可以看到他们所有的记录。爱沙尼亚已经使用数字医疗证明来确定司机身体状况是否适合驾驶，并为每位公民开发了患者门户网站。


    **学术证书 –** 加利州的 `Holbertson School` 计划使用区块链消除证书和资历的造假。音乐行业已经在研究区块链解决方案，以改变艺术家分享音乐和获取报酬的方式。


    **云存储 –** 目前的云存储解决方案不安全且容易受到攻击，通过第三方访问仅需一个简单的密码。`Storj`、`SiaCoin` 和 `Filecoin`
    只是三家开发云与区块链结合技术以实现更好数据存储的公司。


    **租车与租赁 –** `DocuSign` 和 `Visa` 合作在区块链上开发了一套租赁系统，帮助自动化租赁和租赁流程。`Estonia Road` 部门使用的数字医疗证明也可以链接到区块链，以实现自动租用或租赁。


    **网约车 –** 像 `Uber` 这样的公司已经颠覆了出租车行业，但司机和乘客之间的互动仍需要第三方。区块链可以消除第三方，一旦用于汽车租赁/租和 `Road
    Agencies` 的其他区块链投入使用，网约车就可以无缝整合。`La’zooz` 是目前从事此类技术的公司之一。


    **房产 –** 目前的房地产、物业和土地销售系统缓慢且繁琐，记录往往难以获取。区块链可以移除第三方并允许所有记录存储在网上，方便物业的直接销售和转让。这同样适用于租赁物业。虽然
    `Airbnb` 在正确的方向上迈进了一步，但区块链可以消除对中央平台的需求，允许人们直接交易。


    **旅游业 –** 目前的系统非常笨重，有太多的第三方，许多交易丢失或未正确支付。`Microsoft` 和 `WebJet` 正在研究基于区块链的旅游业解决方案，但还没有发布时间表。


    **忠诚度/奖励计划 –** 现行的计划太慢且容易受到欺诈。通常情况下，客户发现很难检查和兑换奖励，并且对获得的奖励感到不满。区块链系统将使客户立即看到余额，而无需等待系统更新。


