- raw: 'This paper, and subsequent ones published by David Chaum, proposed that digital
    currency could be obtained and spent in a way that banks or other institutions
    couldn’t trace it. Chaum, Mont Naor, and Amos Fiat also proposed systems of offline
    transactions that could potentially solve the double-spending problem by detecting
    if the currency had been previously spent.


    Chaum founded DigiCash in 199o, thus using the ideas he proposed to create a digital
    currency. In 1994, the very first DigiCash payment was sent electronically, and
    the DigiCash press release started with:


    *“World’s first electronic cash payment over computer networks. (Release Date:
    May 27, 1994}*


    *Electronic cash has the privacy of paper cash while achieving the high security
    required for electronic network environments exclusively through innovations in
    public key cryptography.”*


    That press release came out 14 years before Bitcoin was created, but it could
    easily be a Bitcoin press release if you were to use the word “Bitcoin” instead
    of “electronic cash” in that release.


    So, DigiCash was responsible for the first untraceable electronic cash system,
    ensuring payments could be made with the governments, banks, or any other institution
    knowing about it. Cryptography was the underlying technology, a system of public
    and private keys and blind signatures that is still used by today’s cryptocurrencies.


    In 1994, most people weren’t even aware of what the Internet was, so, perhaps,
    DigiCash was a bit ahead of its time. In 1998, the company declared bankruptcy,
    and eCash Technologies, another digital currency company, purchased the assets.


    ## EMAIL SPAM AND THE PROOF-OF-WORK ALGORITHM


    When the Internet was still in its infancy, a problem raised its ugly head and
    proved very difficult to resolve – email spam. In 1997, a system was proposed
    to limit spam with a denial-of-service (DoS) using hashcash, which was a proof-of-work
    algorithm.


    This algorithm required the system from which the email was sent to solve a puzzle.
    The answer would then need to be inserted into the email header. This meant the
    email sender would need to use resources and computing power to send that email,
    which made sending spam emails in bulk difficult. The puzzle wasn’t easy for the
    sender to solve, but the receiver could easily verify the right answer, thus filtering
    out any email that didn’t have the proof-of-work attached.


    ## THE FIRST DIGITAL CURRENCIES


    In 1998, “bit gold” was proposed by Nick Szabo. This was a decentralized digital
    currency, and Szabo proposed that each person on a network would provide computing
    resources to solve cryptographic puzzles. Before a new puzzle could be solved,
    most of the network would need to agree on a valid answer for the current one.
    Once the puzzle was solved, and the network accepted it, it would then become
    a part of the next one. Every puzzle had a time stamp on it. Because each puzzle
    was linked to the next one by its solution, it became a chain.


    Szabo stated that, unless control was passed to a centralized authority or bank,
    digital currencies were still subject to the problem of double-spending – they
    could easily be copied and pasted. The work he did on Bit Gold was his attempt
    at combining a decentralized digital currency with the solution to double-spending.


    Bit Gold was never meant to be a real currency, purely existing in theory. However,
    it is accredited as the first digital currency to lay the framework for blockchain
    technology and Bitcoin to be built on in later years.


    Another paper was published in 1998 by Wei Dai, titled “B-Money – An Anonymous
    Distributed Electronic Cash System.” This paper proposed foundations for all cryptocurrencies
    and is referred to in the Bitcoin white paper issued by Satoshi Nakamoto. Wei
    Dai states that electronic cash systems must have the following to function correctly:


    *   Computational work and proof-of-work


    *   Rewards for the completed computational work


    *   A ledger that all members verify and update


    *   Fund transfers completed on the group ledgers and cryptographic hashes used
    to verify them


    *   Digital signatures to sign every transaction. These must use public key cryptography,
    and the network must verify them


    Finally, in 2000, a paper was published by Stefan Konst, providing solutions for
    the proper implementation of chains secured by cryptography.


    ## THE BITCOIN SCENE IS SET


    All of this, everything that happened between 1980 and 2000, together with the
    many published academic papers, led us to the blockchain and Bitcoin.


    In 2008, that infamous white paper was published on the Internet. Satoshi Nakamoto,
    a name thought to be a pseudonym, published the paper called “Bitcoin: A Peer-To-Peer
    Electronic Cash System,” in which he discussed a digital currency called Bitcoin
    and chains made of transaction blocks linked together. It is worth noting that,
    when he discussed this, he never referred to it as a “blockchain.”


    In 2009, the idea of Bitcoin became a reality. Satoshi Nakamoto took his academic
    idea and turned it into the Bitcoin network, creating the very first blockchain.
    In Bitcoin’s original source code, the word “blockchain” was actually referred
    to as two words – “block chain.”


    This blockchain was one of Bitcoin’s core features, designed to solve the double-spending
    problem, and was a distributed public ledger for every Bitcoin transaction.


    Nakamoto is also given credit for mining the “genesis” block, the first-ever block
    on the Bitcoin blockchain. He left the following message in this block:


    *“The Times 03/Jan/2009 Chancellor on brink of second bailout for banks.”*


    Nakamoto may have left this message as proof that the block was created on or
    after January 3^(rd) and to comment on the failures of the currency market and
    banking structure. The headline came from a UK newspaper so Nakamoto may have
    resided in the UK when he did this.


    As mentioned earlier, the word “blockchain” was originally two words when used
    in conjunction with Bitcoin, and this remained the case even when Bitcoin gained
    more awareness. It took years for the words to be joined into what we know and
    use today.


    The first blockchain used with Bitcoin was not perfect, and it suffered problems,
    like any business venture or major technology does. In August 2010, the first
    big issues were discovered with the Bitcoin protocols when it was discovered that
    some transactions had been altered between being submitted and being recorded
    on the blockchain. Thus, the official transactions had been tampered with. It
    was determined that people could bypass the restrictions built into Bitcoin and
    change original transactions to read more than they should. The extra was then
    skimmed off.


    This system vulnerability was exploited, and one single transaction managed to
    create more than 184 billion Bitcoins, sending them to just two network addresses.
    The transaction was spotted quickly and was removed from the blockchain. This
    resulted in the Bitcoin network being overhauled and updated. To this day, the
    same thing has not happened again.


    ## THE SILK ROAD


    In 2011, a drugs marketplace was launched. It was called Silk Road and it was
    a drugs version of eBay, where people could sell and buy drugs online. The main
    payment form used was Bitcoin and while this resulted in more Bitcoin being used,
    it also served to associate the cryptocurrency with illegal activities.


    Bitcoin continues to grow in both public awareness and popularity and, in 2013,
    it reached a high of $1,000. Despite coming under heavy criticism from governments
    and law enforcement, it seemed that Bitcoin could not be stopped.'
