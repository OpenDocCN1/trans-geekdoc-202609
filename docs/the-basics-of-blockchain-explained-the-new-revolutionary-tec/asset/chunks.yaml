    However, the FBI closed Silk Road down in 2013, seizing all their assets and arresting
    their creator, who, it seemed, would face life imprisonment. At the same time,
    Mt. Gox, the biggest of the Bitcoin exchanges handling around 70% of Bitcoin transactions,
    was fined by US governmental agencies, facing regulation issues. By the end of
    the year, the exchange had stopped withdrawals into USD, and, early in 2014, they
    declared bankruptcy.


    The Bitcoin source code provided ample opportunity to create other cryptocurrencies,
    and many began to appear. However, they used different blockchains. The Bitcoin
    blockchain was split into a fork, and Litecoin was created as a separate digital
    currency with its own blockchain. However, it offered some benefits over Bitcoin,
    not least in the time taken to add blocks onto the blockchain. Where Bitcoin takes
    around 20 minutes for a block to be added, Litecoin reduced that to just two and
    a half minutes.


    Once Silk Road and Mt. Gox closed down, the Bitcoin price plummeted to $200. New
    cryptocurrencies were being created, and many people declared publicly that Bitcoin
    was done.


    However, this couldn’t have been further from the truth. When Silk Road was closed,
    Bitcoin’s association with illegal activities and drugs began to fade away, and
    interest began to grow in Bitcoin’s underlying technology.


    Sadly, as much as people couldn’t forget the incredibly public failure of Mt.
    Gox, large businesses, financial companies, and banks struggled to accept Bitcoin
    as a serious currency and, although faded, there was still that association with
    drugs and hitmen paid for by Bitcoin. Even if we excluded the criminal associations,
    people considered Bitcoin to be fake, a scam, or nothing but a bubble that would
    soon burst. While Bitcoin was still associated with crime, the word “blockchain”
    became fashionable and respectable. That one word separated Bitcoin and its technology,
    allowing the blockchain technology to stand on its own. Financial institutions
    and other businesses had no interest in Bitcoin but blockchain technology was
    a completely different matter.


    ## ON THE UP


    In 2014, Bitcoin’s price was quite low, as was interest in the currency. However,
    blockchain interest was fast gaining momentum. Rather than being used for cryptocurrency,
    blockchain technology began revolutionizing databases and distributed ledgers,
    with many businesses turning to it to replace outdated ledger systems to record
    their data entries.


    In 2015, the Ethereum blockchain went live, taking the blockchain technology’s
    potential up a notch or two. The network is designed for decentralized applications,
    or D’Apps as they are commonly known, to run on the Ethereum blockchain in conjunction
    with smart contracts. Both D’Apps and smart contracts are considered the future
    of blockchain technology, which is often called blockchain 2.0.


    These days, most major global finance companies and banks are developing new systems
    based on the blockchain to replace their existing networks and database systems.
    blockchain technology is now open to virtually all industries, primarily because
    it is easy to access and offers functionality in smart contracts and decentralized
    apps. Home programmers can also build blockchain-based software without having
    to create blockchains of their own.


    One statement that alludes to the direction blockchain technology is heading in
    came from Hazard Bynessdrirr in 2017, when he said that the blockchain had the
    potential to create new social and economic system foundations. This is somewhat
    reminiscent of when the Internet was new, with its infinite potential that is
    only just being realized today. Today, venture capitalists, big businesses, startups,
    programmers, and governments are all working on their own blockchain-based database
    systems and decentralized applications.


    ## KEY TAKEAWAYS


    The key takeaways from this chapter are:


    * The blockchain’s underlying technology is cryptography, which can be dated back
    many thousands of years when codes were used to obscure messages, stopping enemies
    from reading them.


    * During the 198s and 1990s, a number of academic papers were published, offering
    theories on combining cryptography with secure data chains and digital currency
    creation.


    * **1982 –** “Blind Signatures for Untraceable Payments” was written and published
    by David Chaum, who is credited with inventing blind signatures and digital cash.


    * **1990 –** Chaum founded Digi-Cash, using cryptography, signatures, and public
    and private keys to create the first untraceable digital currency. In 1998, the
    company declared bankruptcy and sold its assets to eCash Technologies.


    * **1997 –** a proof-of-work algorithm was created by Adam Back. Called `hashcash`,
    it was designed to cut down on spam email. The system worked by requiring the
    email sender to solve a puzzle and embed the answer in the email header. This
    ensured resources and computing power were required, making spam emails more expensive
    to send.


    * **1998 –** `Bit Gold`, a decentralized digital currency, was proposed by Nick
    Szabo, incorporating proof-of-work. A computer network would need to validate
    the proof-of-work and link it to the next puzzle using a timestamp. However, `Bit
    Gold` was only ever a theoretical currency, never a real one.


    * **1998 –** In the same year, a paper called “B-Money: An Anonymous Distributed
    Electronic Cash System” was published by Wei Dai. It discussed the foundations
    that cryptocurrency should be based on and was referred to in Nakamoto’s white
    paper on Bitcoin.


    * These papers and other work done between 1980 and 2000 provided the groundwork
    for the blockchain and Bitcoin. From here, more papers were released.


    * **2008 –** Satoshi Nakamoto released his Bitcoin whitepaper, called “Bitcoin:
    A Peer-to-Peer Electronic Cash System.” It outlined Bitcoin as a currency and
    transaction blocks linked into chains. The word “blockchain” was never used; instead,
    it was always referred to as “block chain” – two words instead of one.


    * **2009 –** Bitcoin became a reality when Nakamoto took his idea and created
    the network. The first block was called the `genesis block`. He left a message
    on it, possibly referring to when the block was created and to the state of the
    currency markets and banking structure at the time.


    * The first blockchain was one of the main features of Bitcoin, designed to solve
    double-spending and worked as a distributed ledger for all Bitcoin transactions.


    * To this day, no one knows who Satoshi Nakamoto is. Some have long suspected
    that Wei Dai or Nick Szabo were responsible, but both have continually denied
    it.


    * The Ethereum blockchain was launched in 2015, allowing D’Apps and smart contracts
    to run on the technology. This blockchain is commonly known as blockchain 2.0.

