    *   While banks are subject to regulation and restrictions, they are turning more
    to the blockchain as they see its potential. We will see more solutions in time,
    providing much better banking alternatives for all.


    The financial industry is not the only one adopting blockchain technology. The
    next chapter will look at other industries and how they are using blockchain solutions
    to revolutionize their companies.


    7 ![](images/svgimg0003.svg)


    > *“Blockchain provides supply chain capabilities that were not possible in the
    recent past.”*


    > **DAVE WATERS**


    So, will the blockchain only benefit us in terms of the financial industry? No.
    In fact, although it may be one of the most prominent industries, plenty of others
    are making use of blockchain technology. While the blockchain makes transactions
    much quicker and safer, it has many other potential uses, and this chapter will
    now look at some of those uses. It is important to point out that blockchain technology
    is nothing more than a distributed data system which nothing physical. Therefore,
    we can assume that whatever we wish to use blockchain for must be subjectively
    valued, unless a government that values the people’s decision to own property
    is at the top of the list. For example, we could imagine a society where real
    estate is on the blockchain, but a physical asset will always be subject to violence
    and central authority because the government has a monopoly on violence. Something
    with more subjective value however is not subjugated to violence, art being a
    great example. A government that puts liberty above all things will see more use
    cases for blockchain technology.


    ## Digital Identities and Identity Management


    Using the blockchain for identity management purposes is an important innovation
    that can potentially open the way for other industries to benefit from security.
    When you know you can trust a person is who they say they are, identity and trust
    can be connected to multiple applications.


    Blockchain technology can solve multiple existing problems related to digital
    identities. Most of us are fully aware of how easily a fake identity can be set
    up or how someone else’s online identity can be stolen. The traditional password
    system is far from secure, and centralized databases are incredibly prone to cyber-attacks.
    Once those databases have been hacked, the hacker can gain easy access to the
    personal details of every customer on the system.


    When the blockchain is used to build identification systems, cryptography is used
    to provide digital signatures. These signatures are unique to the person, completely
    secure, irrefutable, and virtually impossible to access or duplicate without the
    right authorization.


    Digital identities on blockchain-based solutions are a very real possibility,
    and the Estonian government is already developing its own solution, along with
    ShoCard and other companies. The future could see this technology used for passports,
    digital identities, residency permits, driver’s licenses, birth, marriage, and
    death certificates, and all the many other forms of identification we need today.


    ## Digital Voting


    Once the technology has been developed and built to allow digital signatures and
    identities, it can be used to authenticate identity for any online actions and
    transactions. One such use is digital voting. However, digital voting systems
    have failed due to concerns surrounding privacy and security. Several countries
    have experimented with the technology, including Denmark, Norway, and Estonia.
    However, Estonia is the only country to run large-scale tests successfully. At
    the same time, in 2014, Denmark collaborated with a Danish political party, Liberal
    Alliance, to use blockchain technology for a digital voting system.


    The theory behind it is that voters can ensure their votes are sent successfully,
    safe in the knowledge that their identity is hidden, their privacy is maintained,
    and their votes cannot be tampered with. A digital voting system would also ensure
    that voting is accessible to more people, potentially ensuring a higher participation
    percentage in elections.


    ## Healthcare and Medical Records


    Blockchains work on distributed ledgers where every copy of the ledger is updated
    whenever a change is made on one. This way, all network members have an up-to-date
    ledger at all times.


    This offers huge potential in the healthcare industry. Most of us have visited
    more than one hospital or doctor. Whenever we visit a new one, we have to complete
    tons of paperwork regarding our medical histories, any allergies, and all manner
    of other medical-based questions you’ve had to answer in multiple other locations.


    If all this data could be stored on a shared database, every doctor, surgeon,
    hospital, Medicare facility, health professional, and nurse would be able to access
    our details whenever we attended a new place. This would save a lot of time and
    would make sure they could make better decisions for a patient’s healthcare.


    In cases where someone is rushed into surgery, this system could potentially be
    a life-saver. With all the patient’s records to hand, doctors and surgeons would
    know straight away about any underlying health issues, allergies, blood type,
    medication they are currently on, emergency contacts, etc.


    A patient’s previous medical history could also help doctors determine what might
    be causing a current illness. You may visit the doctor for something that wouldn’t
    sound alarm bells, and you visit again or go to another doctor or hospital with
    a different complaint that appears unrelated. If all this were on a shared ledger,
    it could tell the doctor that an undiagnosed problem may be causing the complaints.
    While each doctor only has one part of the puzzle under traditional systems, they
    can see it all with the blockchain, allowing for a much more accurate diagnosis.


    Health insurance companies could benefit from time and money savings by accessing
    this ledger. If you apply for insurance, you need to answer many questions and
    perhaps undergo invasive medical tests. With access to your records on the blockchain,
    an insurer can see your complete medical history and make a decision based on
    whether to accept your application and what your premiums might be.


    Several companies are already working on blockchain solutions for storing healthcare
    records, including Phillips Healthcare, Tieroim, and Gem, and once again, Estonia
    is at the forefront. The eHealth authority in Estonia is working with Guard Time,
    a blockchain company, to enter medical data on a secure database.


    The Estonian Road Administration Authority is already using digital medical certificates
    to make sure an applicant is medically fit to drive before their license is granted
    or renewed. This used to be a manual process but is gradually becoming automated.
    In the future, we could expect to see medical records stored on the blockchain
    updated with information about a person’s medical fitness to drive, too, and governments
    departments would see this information. The information stored in the medical
    records would be used for automatic renewals.


    Using the blockchain to store medical records doesn’t just benefit medical professionals;
    it can also benefit the individual. They will get a transparent view of their
    records, knowing that no one can change the information without them and the entire
    network knowing about it.


    Estonia has developed a patient portal, allowing its citizens to access their
    medical history, referrals records, prescriptions, and health insurance information.
    They can also declare whether they are organ donors and make their own decisions
    about treatment during surgery.


    This could all be placed onto a blockchain in the future and, at the speed Estonia
    is working at, it won’t be too long before it happens.


