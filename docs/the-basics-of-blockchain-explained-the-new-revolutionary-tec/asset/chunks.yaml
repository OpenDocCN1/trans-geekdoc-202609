    > *我热爱这些东西——比特币、以太坊、区块链技术——以及未来的无限。*


    > ABIGAIL JOHNSON


    ## 区块链简介


    我们都听说过区块链，大多与比特币有关。但你知道它是什么吗？它是如何运作的？我们为什么需要它？并没有多少人清楚，但考虑到你已经拿起这本书，你显然想知道。


    区块链技术被归为世界上最伟大的创新之一。许多支持者声称，它可以对几乎每个行业产生巨大的颠覆性影响，并在未来十年左右内以某种方式或程度影响我们每个人的生活。


    这是真的吗？它是世界上见过的最伟大的创新吗？还是只是另一个会像许多其他事物一样走向失败的炒作？我们是否正在看到另一个会像 80 年代互联网泡沫那样惨烈破裂的泡沫？


    也许更重要的问题是，这项技术是否会导致金融公司和政府改变他们存储和处理我们数据的方式，还是他们将维持现状？许多人对近期看到的数据泄露和黑客攻击日益增加感到不满，而区块链可能正是我们一直在寻找的保障数据安全的解决方案。


    本书将回答这些问题以及更多内容。从区块链是什么到它的优缺点，我们将探讨一切。我们甚至会从技术角度查看区块链是如何运作的、它的现状和潜在应用场景，以及这项技术在未来几年内将如何影响我们所有人。


    它并不会让你深信区块链是万能的终极，它是你所有祈求的答案，是世界所面临的所有问题的解决方案。在读完本书后，你将对此做出自己的判断。我将为你提供理解这项技术所需的所有信息，包括优点和坏处，并讨论一些炒作。


    这本书是为那些对区块链了解很少但想理解它的人准备的。虽然它在某些地方具有技术性，但我已尽量保持简单，以确保每位读者都能读懂。


    > *我热爱这些东西——比特币、以太坊、区块链技术——以及未来的无限。*


    > ABIGAIL JOHNSON


    我们都听说过区块链，大多与比特币有关。但你知道它是什么吗？它是如何运作的？我们为什么需要它？并没有多少人清楚，但考虑到你已经拿起这本书，你显然想知道。


    区块链技术被归为世界上最伟大的创新之一。许多支持者声称，它可以对几乎每个行业产生巨大的颠覆性影响，并在未来十年左右内以某种方式或程度影响我们每个人的生活。


