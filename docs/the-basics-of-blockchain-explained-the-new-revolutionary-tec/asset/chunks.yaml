  fmt: '

    If you are familiar with cryptocurrencies like `Bitcoin`, you have likely heard
    the word “mining” being used. When a transaction is created, it goes to all people
    on the network. Each computer is given a puzzle to solve for this to happen, which
    is connected to the next block. Whoever solves it first adds the transaction to
    the block and adds the block to the chain. For this, they are given a reward,
    usually in the form of the token or cryptocurrency used in the network. This is
    called mining because it is similar to mining small bits of something valuable
    from a large block.


    # PROOF-OF-WORK


    The reward a miner receives isn’t just for solving a puzzle and adding a block
    to the network. It is also a kind of compensation for contributing electricity,
    computer power, and resources to keep the network running efficiently. It’s similar
    to a combination lock. For a new block to be added to the chain and the miner
    to receive their reward, they have to solve the puzzle that gives them the combination
    lock. This can only be solved by guessing the numbers, and every person on the
    network will make random guesses. The fastest person to solve it gets the reward
    and the honor of adding the block onto the blockchain. Once the combination has
    been solved, all other people on the network can use those numbers to make sure
    they open the lock.


    Solving the puzzle is proof that electricity, computer power, resources, and time
    were contributed, and the miner is rewarded for keeping the blockchain running.


    This chapter looked at how blockchains work in the case of a shared library. However,
    the books in this library can easily be replaced by anything of value. For example,
    if we used property title ownership instead, the example would show how the blockchain
    can be used to transfer property ownership and manage the ownership titles. When
    a property is transferred from one owner to another, every person on the network
    is notified of the transfer. Most of the network will approve the transaction,
    and it then gets added to the blockchain as a public record.


    If the property owner attempted to sell the title to two people, the whole network
    would see it as a duplicate transfer, and one would be rejected.


    As we already mentioned, these blockchains are most useful in countries where
    the citizens do not trust their government, banks, or the legal system, and record
    systems are unreliable and have to be done manually. The blockchain can replace
    a cumbersome, untrustworthy centralized system with a network maintained by everyone.
    This can have huge benefits, not just for property titles but for anything of
    value.


    We took a general look at how a blockchain works in this chapter, with a few examples
    to help you understand. Later, we’ll drill down into the blockchain and look at
    how it works more technically.


    # KEY TAKEAWAYS


    The key takeaways from this chapter are:


    *   To process a transaction and validate it, it must be added to a group of similar
    transactions and added to a block

    *   The new block is added at the end of the chain. Each block references the
    previous block, thus linking them in a chain, which is how the name came about

    *   The blocks are chained right back to the block that started the chain, which
    is called the “genesis block”

    *   The network validates every transaction block on a decentralized blockchain,
    and they are all given information about every transaction. No central party or
    database controls it.

    *   A transaction block is tough to reverse once it has been added to the chain.
    Each block added is called a confirmation block, confirming that no reversals
    will happen. The more blocks there are, the harder it is to reverse a transaction
    until, at some point, it is no longer feasible. The `Bitcoin` network allows 6
    confirmation blocks to confirm a transaction will not be reversed

    *   Distributed consensus requires that a majority of network computers agree
    on a transaction to validate it before it can be added to the blockchain

    *   Double-spending is when someone tries to do the same transaction more than
    once. The transactions are sent several times but only will typically be accepted
    and added to the blockchain – the rest are rejected

    *   A double-spending attack can happen when one user has control of over half
    the computers on the network, allowing the user to control the transactions that
    are accepted and added to the blockchain

    *   Mining is a process whereby transactions are validated, and new blocks are
    added to the chain. Each miner is given a small reward when they add a new block
    to the blockchain

    *   Proof-of-work requires a puzzle to be solved before a block is added to the
    chain. These puzzles are not easy to solve but can easily be proved, much like
    a combination lock. This proof is evidence that the resources, electricity, and
    computing power contributed to the network.


    In the next chapter, we will look into a brief history of `Bitcoin` and the blockchain.


    3![](images/svgimg0003.svg)


    > *“Blockchain technology could change our world more than people imagine. Bitcoin,
    however, could be a bubble.”*


    > **JACK MA**


    We first saw the blockchain formally mentioned in `Bitcoin`’s original code but,
    while the blockchain and `Bitcoin` are now separated, their history is irrevocably
    intertwined, and that’s what we’ll be discussing n this chapter.


    The technology that underlies every blockchain is cryptography which, in itself,
    has a very long and varied history dating back many thousands of years. Cryptography
    has long been used to protect messages and secrets, and perhaps one of the most
    famous examples is the `Caesar Cipher`. Julius Caesar used this `cipher` when
    he wanted to send communications with sensitive information in them.


    The `Caesar Cipher` is really quite simple – each letter in a message is replaced
    with another alphabetical letter a certain number of letters away from the original.
    For example, all the letters could be moved five letters forward. So, `A` would
    become `F`, `B` would become `G`, `C` would become `H`, and so on until all the
    message’s letters were replaced with new ones. Apart from the message writer,
    the only other person who would know the code would be the recipient, who would
    then be able to decipher the message.


    At that time, literacy wasn’t high, and there were hundreds of languages being
    spoken globally. That meant even if an enemy intercepted the message, the chances
    of them being able to read the message were very low, and many simply assumed
    they were written in foreign languages. Today, it would be easy to decipher a
    message like this, but in those days, it was an effective encryption method that
    made it difficult to intercept and understand messages.


    Modern cryptography has come on leaps and bounds, but the foundations remain the
    same. Data or messages are changed by replacing the numbers and letters with others,
    ensuring the only person who can read it is one who knows the code and can decrypt
    it.


    So, how does this fit with the blockchain’s underlying cryptographic technology?


    ## THE FIRST DIGITAL CURRENCY


    In the 1980s and 1990s, several papers were published that proposed cryptography
    could be used to secure data while, at the same time, that data would be securely
    linked in chains. These proposals were made along with proposals for digital currencies.


    David Chaum wrote and published a paper, “Blind Signatures For Untraceable Payments,”
    in 1982. This paper led to him being accredited with inventing blind signatures
    and digital cash. A blind signature obscures a message’s content before it gets
    signed. While the contents stay hidden, the digital signature can be compared
    to the original, one of the earliest cryptographic signatures for cryptocurrencies.

