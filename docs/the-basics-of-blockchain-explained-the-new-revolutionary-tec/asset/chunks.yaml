- raw: "Smart contracts solve many of the problems associated with doing transactions\
    \ on a blockchain. You can use them for anything of value, and many companies\
    \ are already developing decentralized applications to use these smart contracts.\
    \ The situation above, where you risk not receiving the goods you paid for, cannot\
    \ happen with a smart contract. When the contract is set up, the payee sends the\
    \ correct payment, which is then placed into a kind of escrow account and held\
    \ until the goods are sent and received. That way, the payee knows they are getting\
    \ what they paid for, and the sender knows their money is safe.\n\nSome companies\
    \ currently developing applications are:\n\n*   **Ascribe –** an art industry\
    \ startup, Ascribe allows artists to claim ownership of their work. They can also\
    \ release limited-edition prints of their work. Artwork is issued by the platform\
    \ in digital format and is numbered. The blockchain traces all original artwork\
    \ and transactions within that specific artwork. Also, it offers a marketplace\
    \ for artists to advertise their work and allows people to buy and see their art\
    \ via the website.\n\n*   **UProov –** a media and legal company, UProov provides\
    \ real-time timestamps on all videos and images taken using electronic devices.\
    \ These timestamps are 100% verifiable and cannot be altered, which means they\
    \ could be relied on in court cases as evidence.\n\n*   **BitProof –** another\
    \ company that creates timestamps using the blockchain, BitProof offers an app\
    \ that can be downloaded onto a smartphone. The app enables you to add verifiable\
    \ timestamps to all documentation put through it. Every document can be traced\
    \ back to when it was created on the blockchain, and none of it can be altered.\
    \ This could mean that notaries will no longer be needed in the future.\n\n* \
    \  **Warranteer –** a company with links to LG and GoPro, Warranteer uses smart\
    \ products to put product warranties onto a blockchain. These are then easy to\
    \ access, easily transferred when the product is sold on and preserved forever.\
    \ Every change, edit, transfer, and update is recorded, and all interested parties\
    \ can see them at any time.\n\n*   **Peertracks, Ujo Music, and Mycelia –** all\
    \ of these are individual companies that use the blockchain within the music industry.\
    \ They all use smart contracts differently but with one common goal: to ensure\
    \ that third parties like record labels are removed and that artists can sell\
    \ to their fans directly and receive remuneration.\n\nOther areas include microfinance\
    \ and micro-insurance. Microfinance is designed for people with no access to conventional\
    \ banking facilities and is typically used in poorer countries. The amounts involved\
    \ are too small for banks to get involved in but are big amounts for the person\
    \ borrowing the money. It can give them the finance needed to start a business\
    \ to support their families and bring an income in.\n\nMicrofinance has already\
    \ pulled a lot of people out of poverty, and it’s mainly due to Mohamed Yunus.\
    \ Yunus won a Nobel Peace Prize for his work. Before he modernized it, most banks\
    \ wouldn’t entertain financing smaller loans, mostly because the amount of paperwork\
    \ involved ate up any profit they would make from the loan – in many cases, it\
    \ cost more.\n\nMicro-insurance has not seen such a dramatic change as microfinance.\
    \ A startup called Straturnn is working with Lemonway to change micro-insurance\
    \ by creating a blockchain system named LenderBot. This system uses smart contracts\
    \ to create microinsurance contracts and manage them, potentially making it easier\
    \ for people to get insurance in the future.\n\n## KEY TAKEAWAYS\n\nThe key takeaways\
    \ of this chapter are:\n\n*   The Ethereum platform is based on a blockchain,\
    \ giving developers a programming language called Solidity to develop applications\
    \ to run on the blockchain. They can also create and run smart contracts.\n\n\
    *   Bitcoin currency and network are mainly used to facilitate financial transactions,\
    \ but Ethereum, which uses Ether as its cryptocurrency, is to facilitate exchanges\
    \ of computing power.\n\n*   Decentralized applications (d’Apps) don’t have a\
    \ centralized server and are not run by a single entity. Instead, they run on\
    \ the Ethereum computer network.\n\n*   Smart contracts are written in the Solidity\
    \ language and run on the distributed ledger or blockchain.\n\n*   Smart contracts\
    \ can verify contracts automatically, executing and enforcing them based on the\
    \ computer code. There is no need for a third party to get involved in enforcing\
    \ contracts.\n\n*   Smart contracts can be used to exchange anything of value.\
    \ They cut the risks that come with blockchain transactions as the network automatically\
    \ handles every part of the transaction.\n\n*   Lots of companies are already\
    \ working on decentralized applications and smart contracts.\n\n*   Ethereum takes\
    \ the blockchain to the next level.\n\nWhen we talk about the blockchain’s future,\
    \ we typically call the next step in blockchain’s evolution “blockchain 2.0.”\
    \ The use of smart contracts and decentralized applications has already taken\
    \ the blockchain way further than the Bitcoin blockchain, and that’s what its\
    \ future will revolve around. The potential impact on the world is far greater\
    \ with blockchain 2.0 than the original technology ever had, and the next chapter\
    \ will now discuss what that future will look like.\n\n9 ![](images/svgimg0003.svg)\n\
    \n> *“Blockchain technology isn’t just a more efficient way to settle securities.\
    \ It will fundamentally change market structures, and maybe even the architecture\
    \ of the Internet itself.”*\n\n> \n\n> **ABIGAIL JOHNSON**\n\nSo far, we have\
    \ looked at blockchain technology and its huge potential to disrupt global industries\
    \ and reach every person on the planet within the next couple of decades. But\
    \ does this revolutionary technology really have a solid future? Or is it just\
    \ another bubble that will burst with a big bang and disappear?\n\nThere are tons\
    \ of predictions about blockchain’s future, and most of them are purely assumptions.\
    \ However, these are not the same kind of predictions that say, “we’ll all be\
    \ using flying cars in the future.” These already have a solid foundation, and\
    \ many companies are now developing or using their own blockchain-based systems.\n\
    \nBlockchain has gained huge momentum in both governmental and corporate projects\
    \ in recent times. That momentum predicts that blockchain technology has a firm\
    \ and realistic future, embedded in all our lives in some way.\n\nLet’s consider\
    \ the current systems based on the blockchain and the industries creating them.\
    \ We can expand the newly emerging trends far into the future to understand the\
    \ blockchain’s direction.\n\n## OPEN-SOURCE AND DECENTRALIZED VS. CLOSED-SOURCE\
    \ AND CENTRALIZED\n\nThe biggest thing dividing blockchain development right now\
    \ is the question of whether a blockchain should be decentralized, as the blockchain\
    \ was intended for and the source code made available to anyone. Some say it should,\
    \ and others say it should be centralized, with private source code that only\
    \ a few specific people or organizations can see. That goes against the whole\
    \ reasoning behind the blockchain.\n\nWhile most blockchain technology proponents\
    \ believe it should be decentralized and open-source, many governments and companies\
    \ think the opposite. Despite seeing the real potential in the decentralized,\
    \ open-source blockchain, they only want the benefits if they can build centralized,\
    \ closed-source blockchain systems.\n\nThis takes us right back to the early days\
    \ of PCs when many programmers wanted source code to be free and open-source to\
    \ all. When Bill Gates went against this, he came under fire from all directions\
    \ by making software into products that had to be licensed and sold. Open-source\
    \ software is still used, but many software companies now refuse to share their\
    \ code with everyone.\n\n## RIPPLE AND ETHEREUM"
