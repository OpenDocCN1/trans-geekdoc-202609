    Any asset stored on the blockchain is akin to cold, hard cash. If you keep cash
    in your wallet and the wallet is stolen, or the money taken from it, it’s gone
    for good. Advanced cryptography is used in most blockchain-based systems, along
    with encryption that is far more secure than what we use on the internet today.
    However, sometimes less is more, and that is true in this case – too much security
    can lead to more problems.


    Scour the internet, and you will find tons of examples, especially with cryptocurrencies,
    where a private key has been lost or forgotten, and the person cannot get their
    money. Your private key is just that – `private`. Share it with someone else,
    and you risk them taking all your money. Lose or forget it, and there is no way
    to retrieve it – you are locked out and cannot get your money. In either case,
    there is nothing to be done. There is no password reset system and no way of getting
    back currency or money that someone else has stolen from you.


    This often happens more when a person purchases a cryptocurrency at a low price
    and then forgets all about it. Later, they find it has shot up in price and that
    what they might only have paid a few dollars more is now worth many times more
    than that. However, they can’t remember their password when trying to get to their
    currency to sell it. If you purchased `Bitcoin` for $100 in 2009 and left it alone,
    it would now be worth in the region of $4 million. But, because you cannot remember
    your password, those Bitcoins and that money is gone forever. One case that really
    stands out occurred in the UK in 2013 when James Howell mistakenly threw out a
    laptop containing the private key to access 7500 `Bitcoins`. Today, they would
    have been worth around $66 million, but, despite extensive searches, he has been
    unable to retrieve the laptop.


    The blockchain’s transparency means that a public key allows people to see their
    balance and see how much it is worth, but it doesn’t give you access to it. This
    is much the same as your bank telling you your bank balance but not letting you
    have the money. When you lose your internet banking password or forget your account
    numbers, you can go into a physical bank and provide identification to get access
    again. This doesn’t happen with cryptocurrencies based on the blockchain. A lack
    of security, scams, and hacking have resulted in the theft or loss of billions
    of dollars’ worth of cryptocurrencies over the years, and nothing can be done
    about it.


    If someone stole your credit card and `PIN` and withdrew money from your account,
    the bank could intervene and cancel your card. That way, no more money could be
    fraudulently withdrawn. It’s also likely that the bank has fraud protection in
    place; not only can they trace where your card is being used and find the perpetrator,
    but they can reverse any withdrawals made, so you don’t lose any money.


    Now let’s say your transactions are done over a blockchain-based system. These
    cannot be changed or reversed, and if fraud does occur, you don’t have that third
    party to intervene. If you accidentally sent funds or cryptocurrency to the wrong
    blockchain wallet, that’s too bad. Your funds are gone, the original recipient
    is out of funds, and it’s someone else’s gain. If someone gets hold of your private
    key, they can take all your money – you can’t reverse it, and you can’t claim
    compensation like you could with a bank.


    ## Lack of Centralized Control


    As a continuation of the control issue, if someone had control of more than 50%
    of all the computers on a network, they would have complete control of every blockchain
    transaction. When a malicious user gains that control, it is called a `51% attack`.
    By leveraging this over, say, a cryptocurrency network, in theory, they could
    block any new transactions from being confirmed, reverse existing transactions,
    and make way for double-spending, one of the issues the blockchain is designed
    to prevent.


    51% attacks are largely theoretical because gaining that much control over a network
    would be next to impossible. That said, in Russia, China, and other parts of the
    world, you can find massive mining farms controlling huge amounts of a blockchain
    network’s computing power. If these farms were to get together, they have a massive
    potential to take over entire networks and manipulate them how they want to.

