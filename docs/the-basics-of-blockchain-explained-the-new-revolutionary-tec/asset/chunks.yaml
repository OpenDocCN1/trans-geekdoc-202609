- raw: "But that’s what you do every day when you pay for something using paper cash.\
    \ That $50 bill in your wallet is nothing more than a piece of paper that says,\
    \ “I owe you $50,” signed by the government. You accept these pieces of paper\
    \ for what they are, and you trust that you can use them in any store. Those stores\
    \ trust that they can deposit this paper in their bank accounts or use it to purchase\
    \ goods in another store. And so it goes on.\n\nAll of that amounts to an awful\
    \ lot of trust.\n\nSo, how does the blockchain fit in? Quite simply, the blockchain\
    \ offers huge potential for those countries whose citizens don’t trust their government,\
    \ banks, financial institutions, currency exchanges, and so on.\n\nThe financial\
    \ system in the USA is one of the most regulated in the world, but that didn’t\
    \ stop major banks and financial institutions from crashing during the 2008 financial\
    \ crisis, one of the worst to hit the world in decades. These were companies that\
    \ had been in existence for hundreds of years. Companies that went bust overnight,\
    \ taking every penny of people’s hard-earned money with them.\n\nGreece is a developed\
    \ country in Europe, which took on the Euro as its currency. In 2015, the banks\
    \ froze all bank account deposits, and people were only allowed to withdraw the\
    \ Euro equivalent of $70 per day from an ATM.\n\nThese people believed in these\
    \ banks, believed they were trustworthy. What else were they meant to do with\
    \ their money? Hide it under their mattress? As soon as someone finds out that’s\
    \ where your money is, you become a target for theft. If your house goes up in\
    \ smoke, so does your money.\n\nIf the government can freeze withdrawals from\
    \ the banks and banks can disappear overnight in countries like the USA, Greece,\
    \ and other developed countries, how can anyone in a less developed country with\
    \ little regulation trust their governments and banks?\n\nThe short answer is,\
    \ they can’t.\n\n## TRUST AND THE BLOCKCHAIN\n\nAround the world, billions of\
    \ people live in countries whose governments are nothing more than dictatorships.\
    \ These governments own the banks, and people cannot even use their local currency\
    \ in the stores. There are high levels of crime and a distinct lack of legal systems\
    \ to help protect people. This is happening right now in many countries. Even\
    \ if you could trust that the banks wouldn’t go bust or steal your money, in some\
    \ countries, the government monitors every deposit and can use your transactions\
    \ to arrest you, put you in prison or even execute you.\n\nGoing back to our library\
    \ example, let’s say you borrow a book, but the government doesn’t approve of\
    \ the subject matter – something like 1984 by George Orwell, for example. In this\
    \ case, the government, which is monitoring everything, might see your reading\
    \ habits as a red flag. That could lead to them investigating your life, arresting\
    \ you, or worse, in some countries.\n\nClearly, transactions are difficult and\
    \ full of risk in countries with no trust in the governments or banks. If you\
    \ place your money in a bank, you risk losing it to the bank or the government.\
    \ If you buy a house or make some other large purchase, you might be forced to\
    \ save for this in cash, gems, gold, or other materials, which brings its own\
    \ risks – you could lose your savings in fire or theft, for example. Even if the\
    \ worst doesn’t happen, and you manage to save the money you need, you risk it\
    \ in other ways. For example, the person you are buying a house from may take\
    \ your savings and not transfer the house ownership to you. Because the transaction\
    \ took place in cash, there is no electronic proof or any other evidence of it\
    \ taking place.\n\nThe blockchain is based on trust, it is the core concept, and\
    \ the blockchain is, in itself, a trust system, allowing transactions to be made\
    \ between people without needing a centralized third party involved. You can carry\
    \ out any transactions of value on a blockchain. While the most common is cryptocurrency,\
    \ in recent years, that has been extended to digital files, property, money, shares,\
    \ pretty much anything you want to sell to or buy from someone else.\n\n## BITCOIN\
    \ AND THE BLOCKCHAIN – WHAT’S THE DIFFERENCE?\n\nThe blockchain first came to\
    \ our attention when it was mentioned in conjunction with Bitcoin. When Bitcoin\
    \ was created, the first blockchain was created, but we’ll be covering that in\
    \ more detail in chapter 3.\n\nThe blockchain is one of Bitcoin’s underlying technologies,\
    \ and I say ONE because many people think it is the only one. However, when Bitcoin\
    \ was created, it was done with multiple cryptocurrency technologies, not just\
    \ the blockchain.\n\nSystems based on the blockchain are currently in use in many\
    \ applications in multiple industries, including social networks, cloud storage,\
    \ digital identity, decentralized applications, voting, and many more that we’ll\
    \ discuss later. It would appear that the blockchain has an endless stream of\
    \ possibilities, whereas Bitcoin has one use and one use only – as a digital payment\
    \ system.\n\n## KEY TAKEAWAYS\n\nThe key takeaways from this chapter are:\n\n\
    *   The blockchain is similar to a database and is used to store transactions\
    \ and records of value. You can record just about anything on the blockchain.\n\
    \n*   Most of the transactions we carry out today require a third party to ensure\
    \ security and trust and ensure the transaction takes place. Those third parties\
    \ include governments, banks, credit card companies, and so on.\n\n*   The blockchain\
    \ eliminates the need for that third party and lets people carry out their transactions\
    \ with one another.\n\n*   Billions of people reside in countries where the governments,\
    \ banks, legal systems, and other third parties cannot be trusted to keep accurate\
    \ records or carry out transactions. In these cases, the blockchain is particularly\
    \ useful to provide the assurance and trust people need when they transact with\
    \ one another.\n\n*   While Bitcoin is based on the blockchain, the blockchain\
    \ is not based on Bitcoin\n\n*   Bitcoin is a digital payment system, while systems\
    \ based on blockchains can be used for just about any transfer of value.\n\nIn\
    \ chapter 2, we’ll delve into how the blockchain works.\n\n2 ![](images/svgimg0003.svg)\n\
    \n> *“The blockchain does one thing: It replaces third-party trust with mathematical\
    \ proof that something happened.”*\n\n> \n\n> **ADAM DRAPER**\n\nSo, now you know\
    \ that the blockchain is more than just a simple database, you must want to know\
    \ how it all works, right? In a non-technical way, this chapter will explain how\
    \ a blockchain works – a more technical explanation can be later in the book when\
    \ we delve deeper into things. We’ll talk about how the blockchain got its name\
    \ (quite simple, really), changing things once they’ve been added (clue – you\
    \ can’t), double-spending, and how value is exchanged on the blockchain. We’ll\
    \ also delve into distributed consensus, mining, and proof of work.\n\nIn the\
    \ previous chapter, we learned what the blockchain is, and we looked briefly at\
    \ how it is used to replace third parties in a transaction. Now we’ll look at\
    \ some examples that explain how it all works.\n\nWe’ll use our library example\
    \ again. We know that a library is a third party that keeps centralized databases\
    \ of every person who borrows a book from them. They also hold a database showing\
    \ every book they have and how many copies of each. Let’s say you want to borrow\
    \ a specific book, but there’s only one copy of it, and someone else has it. You\
    \ can ask the library to let you know when the book is back in the library, but\
    \ you can’t ask them to tell you who has the book – they cannot reveal personal\
    \ information about their members. The person who has borrowed the book might\
    \ be your next-door neighbor, but you can’t knock on their door and ask them to\
    \ give the book to you. The library has its own central database, and they will\
    \ not share any of its information with you."
