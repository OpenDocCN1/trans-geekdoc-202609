- raw: "Any asset stored on the blockchain is akin to cold, hard cash. If you keep\
    \ cash in your wallet and the wallet is stolen, or the money taken from it, it’s\
    \ gone for good. Advanced cryptography is used in most blockchain-based systems,\
    \ along with encryption that is far more secure than what we use on the internet\
    \ today. However, sometimes less is more, and that is true in this case – too\
    \ much security can lead to more problems.\n\nScour the internet, and you will\
    \ find tons of examples, especially with cryptocurrencies, where a private key\
    \ has been lost or forgotten, and the person cannot get their money. Your private\
    \ key is just that – private. Share it with someone else, and you risk them taking\
    \ all your money. Lose or forget it, and there is no way to retrieve it – you\
    \ are locked out and cannot get your money. In either case, there is nothing to\
    \ be done. There is no password reset system and no way of getting back currency\
    \ or money that someone else has stolen from you.\n\nThis often happens more when\
    \ a person purchases a cryptocurrency at a low price and then forgets all about\
    \ it. Later, they find it has shot up in price and that what they might only have\
    \ paid a few dollars more is now worth many times more than that. However, they\
    \ can’t remember their password when trying to get to their currency to sell it.\
    \ If you purchased Bitcoin for $100 in 2009 and left it alone, it would now be\
    \ worth in the region of $4 million. But, because you cannot remember your password,\
    \ those Bitcoins and that money is gone forever. One case that really stands out\
    \ occurred in the UK in 2013 when James Howell mistakenly threw out a laptop containing\
    \ the private key to access 7500 Bitcoins. Today, they would have been worth around\
    \ $66 million, but, despite extensive searches, he has been unable to retrieve\
    \ the laptop.\n\nThe blockchain’s transparency means that a public key allows\
    \ people to see their balance and see how much it is worth, but it doesn’t give\
    \ you access to it. This is much the same as your bank telling you your bank balance\
    \ but not letting you have the money. When you lose your internet banking password\
    \ or forget your account numbers, you can go into a physical bank and provide\
    \ identification to get access again. This doesn’t happen with cryptocurrencies\
    \ based on the blockchain. A lack of security, scams, and hacking have resulted\
    \ in the theft or loss of billions of dollars’ worth of cryptocurrencies over\
    \ the years, and nothing can be done about it.\n\nIf someone stole your credit\
    \ card and PIN and withdrew money from your account, the bank could intervene\
    \ and cancel your card. That way, no more money could be fraudulently withdrawn.\
    \ It’s also likely that the bank has fraud protection in place; not only can they\
    \ trace where your card is being used and find the perpetrator, but they can reverse\
    \ any withdrawals made, so you don’t lose any money.\n\nNow let’s say your transactions\
    \ are done over a blockchain-based system. These cannot be changed or reversed,\
    \ and if fraud does occur, you don’t have that third party to intervene. If you\
    \ accidentally sent funds or cryptocurrency to the wrong blockchain wallet, that’s\
    \ too bad. Your funds are gone, the original recipient is out of funds, and it’s\
    \ someone else’s gain. If someone gets hold of your private key, they can take\
    \ all your money – you can’t reverse it, and you can’t claim compensation like\
    \ you could with a bank or credit card company.\n\nGo on any blockchain forum\
    \ or the FAQ section of any blockchain-based system, and one of the most common\
    \ questions asked is, “If I lose or forget my password, how do I reset it?” Simply\
    \ put, you cannot. Perhaps the worst advice of all is to write your private key\
    \ down when you set it up. With all the encryption and security the blockchain\
    \ is meant to have, people are reduced to doing the one thing everyone tells them\
    \ not to – write their password down or store it on their computer. That results\
    \ in less security than a traditional method.\n\nAs you can see, what should make\
    \ blockchain-based systems more secure in mainstream implementation is likely\
    \ to make adoption less likely. One of the most popular types of blockchain wallets\
    \ is the web-based type, where cryptocurrencies are stored with third parties.\
    \ However, this means they lose the benefits of the blockchain’s security, preferring\
    \ to set up a traditional password system instead, knowing it can be reset if\
    \ they lose it. However, that means they are also back to relying on an intermediary,\
    \ the one thing the blockchain was designed to remove.\n\n## LACK OF CENTRALIZED\
    \ CONTROL\n\nRobert Sams, the founder, and chief executive of Clearmatics in London,\
    \ once said,\n\n> *“In financial markets, there is always a mechanism to correct\
    \ an attack. In a blockchain, there isn’t – you have to accept it.”*\n\n> \n\n\
    > ROBERT SAMS\n\nEarlier, we learned that systems based on the blockchain remove\
    \ third parties from the equation, ensuring control and responsibility go back\
    \ to the parties in the transactions. The control goes to the majority share of\
    \ the computers and the people who operate them on the blockchain network, resulting\
    \ in control issues.\n\nBecause the blockchain is decentralized, the majority\
    \ of the network must agree on transactions, and they decide the direction the\
    \ blockchain goes in. In traditional software and networks, where the organization\
    \ wants something changed, they get approval from certain departments before doing\
    \ it. In a decentralized blockchain, a set majority of the network must agree\
    \ to the changes, usually more than 50% but sometimes 70-80%.\n\nAn example of\
    \ this was seen with the divisions caused in the Bitcoin network regarding the\
    \ implementation of SegWit (Segregated Witness) or Bitcoin Unlimited. Large numbers\
    \ of the network members support different Bitcoin network changes and, so far,\
    \ the majority needed by Bitcoin Unlimited or SegWit has been unattainable.\n\n\
    This has led to other blockchains overtaking Bitcoin in technological changes,\
    \ and the network disagreement has led to stagnation on the Bitcoin network. Transaction\
    \ times are much slower, as are confirmation times, and the network suffers from\
    \ scalability problems.\n\nSoftware and other technologies change constantly,\
    \ but this can cause problems with decentralized blockchain networks. A lack of\
    \ a majority vote can stop changes from happening, but even if a majority were\
    \ reached and the changes went ahead, the network would still have plenty of people\
    \ on it who were not happy with them.\n\nThis has led to many organizations seeing\
    \ the blockchain as a risk they are unwilling to take. Companies can end up building\
    \ entire businesses and software solutions around a network only to find they\
    \ cannot control changes that could dramatically impact how they work.\n\n## THE\
    \ 51% ATTACK\n\nAs a continuation of the control issue, if someone had control\
    \ of more than 50% of all the computers on a network, they would have complete\
    \ control of every blockchain transaction. When a malicious user gains that control,\
    \ it is called a 51% attack. By leveraging this over, say, a cryptocurrency network,\
    \ in theory, they could block any new transactions from being confirmed, reverse\
    \ existing transactions, and make way for double-spending, one of the issues the\
    \ blockchain is designed to prevent.\n\n51% attacks are largely theoretical because\
    \ gaining that much control over a network would be next to impossible. That said,\
    \ in Russia, China, and other parts of the world, you can find massive mining\
    \ farms controlling huge amounts of a blockchain network’s computing power. If\
    \ these farms were to get together, they have a massive potential to take over\
    \ entire networks and manipulate them how they want to.\n\nEven without a 51%\
    \ control, they still have the potential to control and manipulate networks. They\
    \ can do this by ensuring computing power is allocated in such a way that the\
    \ network’s future development comes under undue influence. We have already seen\
    \ this with the division in the Bitcoin network mentioned earlier."
