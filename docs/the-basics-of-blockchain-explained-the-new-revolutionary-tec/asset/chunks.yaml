- raw: '*   **Proof**\-**of-Capacity –** this is where a hard drive is plotted, i.e.,
    solutions are stored on the hard drive before mining starts. The block winner
    is the one with the fastest solution


    *   **Proof**\-**of-Elapsed Time –** a consensus algorithm where nodes need to
    wait for a specific time period, randomly chosen. The reward is given to the first
    node to complete that time-period


    *   **Proof-of-Stake –** a consensus algorithm that picks a new block’s owner
    based on the stake or wealth. As no block is reward is offered, the transaction
    fee is paid instead


    *   **Proof-of-Work –** a consensus algorithm where a miner is required to solve
    a mathematical puzzle for a transaction to be validated. The successful miner
    earns a cryptocurrency reward based on the platform they are on and their computational
    power


    *   **Pub/Sub –** Publish/Subscribe


    *   **Public Key Cryptography –** a type of encryption where two keys, mathematically
    related, are used – the public and private key. The private key cannot be worked
    out based on the public key.


    **R**


    *   **REST API –** Represented State Transfer API, which defined HTTP-based restraints


    *   **RPC –** Remote Procedure Calls, a protocol a program uses to request services
    on another network-based program


    **S**


    *   **SDK –** Software Development Kit – provides developers with the tools they
    need to build software on specific platforms; every platform has its own SDK


    *   **Sharding –** when a blockchain is divided into multiple small networks,
    each known as a shard, that can process transactions in parallel


    *   **Smart Contract –** a self-executing contract where the agreement terms are
    written in the code


    *   **Solidity –** a contract-oriented programming language specifically for writing
    Smart Contracts and implementing them on blockchain platforms


    **T**


    *   **Token –** a digital asset representation built on an already existing blockchain


    *   **Turing Complete Language –** a language that can perform the same kind of
    calculations that a computer can do


    **U**


    *   **Ubuntu –** a free Linux distribution and open-source operating system


    *   **UTXO –** Unspent Transaction Outputs, they are used in determining the validity
    of a transaction


    **V**


    *   **Viper –** a computer programming language created to introduce Smart Products
    formally


    **W**


    *   **Wallet –** where you store your digital assets, wallets can be online or
    offline


    **Z**


    *   **Zeppelin –** or Open Zeppelin is a community of Smart Contract developers


    **51% Attack –** where the network is attacked by a majority of miners, allowing
    for fraudulent transactions and double-spending. This is mostly theoretical as
    it is unlikely ever to happen.


    First, I would like to thank you for taking the time to read my guide. I hope
    that you found it helpful and that you now have a deeper understanding of the
    blockchain.


    Chapter 1 discussed what the blockchain is, covering trust issues and the difference
    between Bitcoin and the blockchain. In chapter 2, we talked about how blockchain
    actually works, including a brief look at changing transactions and blocks, double-spending,
    distributed consensus, mining, and proof-of-work.


    Chapter 3 discovered the history between the blockchain and Bitcoin, covering
    how the proof-of-work algorithm was developed, how Bitcoin gained a reputation
    for being associated with criminal activities, and how it has started to shake
    that reputation.


    Chapter 4 delved into some of the blockchain’s many advantages, including transparency,
    removing intermediaries, decentralized aspects, security, and potential use cases.
    Chapter 5 moved on to the disadvantages, such as lack of privacy, issues surrounding
    security, not being centralized, 51% attacks, and the fact that it is still an
    unproven technology, among other things. Of course, many of these are only seen
    as disadvantages by large organizations, financial institutions, and governments.


    Chapter 6 looked at how the blockchain works with the financial industry. This
    includes areas such as banking, transfers of money, direct payments, financial
    inclusion, and more, while chapter 7 looked at how the blockchain works with other
    industries. Many other industries are set to be disrupted by the blockchain, and
    by disrupted, it means they will change how they work, in some parts of their
    business at least.


    Chapter 8 delved into Ethereum, decentralized applications, and smart contracts.
    We look at how Ethereum and Bitcoin differ, what benefits Ethereum offers, and
    how decentralized apps and smart contracts work.


    Chapter 9 talked about the future of the blockchain, and chapter 10 provided a
    deeper, more technical look at how a blockchain works. We finished by providing
    a glossary of terms to help you understand some of the chatter you might hear
    about the blockchain.


    There is no doubt that the blockchain will change the world in years to come.
    Right now, it is only just beginning to be used, and many companies are investing
    significant time and money into their own blockchain-based systems. Changes are
    likely to be slow, but eventually, we’ll all be using a blockchain system in one
    form or another in our daily lives.


    Thank you once again for reading my guide. I hope it has helped you understand
    blockchain technology better.


