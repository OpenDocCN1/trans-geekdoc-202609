  trans: "\n\n*   在许多行业中，中间机构可能会被区块链取代。\n*   区块链技术比我们想象的要更近得多，许多行业可能在不久的将来实施它。\n*\
    \   区块链解决方案极有可能颠覆许多行业。\n*   本章使用的示例仅是我们利用区块链所成就的冰山一角，其中很大一部分将通过智能合约来实现。\n\n下一章将介绍智能合约如何工作、`Ethereum`\
    \ 平台以及区块链技术能为我们做的其他一些示例。\n\n8![](img/svgimg0003.svg)\n\n> “你将开始看到开源、自动执行的合同随着时间的推移逐渐改进。互联网对出版业做了什么，区块链将对约\
    \ 160 个不同的行业做同样。这太疯狂了。”\n> \n> — **PATRICK M. BYRNE**\n\n`Ethereum` 的首席科学家 `Vitalik\
    \ Buterin`（维塔·布林）曾说过：“让用户能够轻松访问区块链上的许多不同数字资产，特别是与现实资产关联的代币，对于将区块链采用推向下一个水平至关重要。”\n\
    \n`Ethereum` 是区块链技术未来的下一个阶段，它构建在与 `Bitcoin` 区块链相同的基础技术之上。然而，它通过将区块链的可能性提升另一个层次，更向前了一步。\n\
    \n`Ethereum` 允许开发者创建基于区块链的程序，这些程序使用网络的计算能力——可能有成千上万台计算机将其计算力投入其中。我们今天使用的几乎每个应用程序都可以在区块链上运行，而\
    \ `Ethereum` 网络让开发者无需创建自己的区块链和/或货币即可创建应用程序。\n\n`Ethereum` 加密货币被称为“Ether”（以太）或“Eth”，被用作\
    \ `Ethereum` 网络上运行去中心化应用的支付形式。它拥有全球第二大加密货币的赞誉，市值超过 3000 亿美元，仅次于市值超过 7000 亿美元的\
    \ `Bitcoin`。\n\n## 以太坊与比特币的区别\n\n尽管 `Bitcoin` 和 `Ethereum` 都是加密货币，但它们确实存在一些差异。最大的区别是\
    \ `Bitcoin` 区块链主要是一个用于金融交易的分布式账本。相比之下，`Ethereum` 是一个旨在运行去中心化应用的分布式计算平台。\n\n我们可以在任何接受\
    \ `Bitcoin` 作为支付形式的地方使用它购买商品和服务，但我们无法使用 `Ether` 做到同样的事情。`Ether` 纯供需要计算能力来调整其去中心化应用的开发者用作支付形式使用。\n\
    \n两者都有自己的数字货币，但目的不同。`Ether` 从未被设计为替代支付手段；它的目的仅仅是鼓励开发者创建去中心化应用并并在 `Ethereum` 网络上运行它们。\n\
    \n简单来说，`Bitcoin` 是一种金融交易货币，而 `Ethereum` 是多方面的。它不仅拥有一种加密货币，还利用区块链运行计算平台。\n\n##\
    \ 以太坊的优势\n\n与 `Bitcoin` 区块链一样，`Ethereum` 区块链由遍布全球的数万台计算机网络运行。这使得应用程序可以在网络上运行，并使用所有这些计算机的计算能力。\n\
    \n`Bitcoin` 网络最大的问题是它的力量远超世界上所有超级计算机的总和，但所有这些力量都被浪费了，因为它们只用于生成随机数和添加区块。\n\n`Ethereum`\
    \ 通过允许开发者在区块链上运行其应用，更好地利用了其庞大网络上的计算机。开发者无需创建自己的区块链；他们只需使用 `Ether` 为网络上已有的部分计算能力付费。\n\
    \n但不止于此。`Ethereum` 还有一种名为 `Solidity` 的编程语言和 `Ethereum Virtual Machine`（`EVM$，以太虚拟机）。`Solidity`\
    \ 用于创建智能合约或去中心化应用，然后由 `EVM` 将其编译并运行。\n\n## 去中心化应用\n\n去中心化应用（通常称为 `d’Apps`）是开源、自动执行的合同，随着时间的推移逐渐改进。互联网对出版业做了什么，区块链将对约\
    \ 160 个不同的行业做同样。这太疯狂了。\n\n去中心化应用运行在网络上，不需要任何中心化服务器。我们今天使用的几乎每个应用程序都可以在区块链上运行，而\
    \ `Ethereum` 网络让开发者无需创建自己的区块链和/或货币即可创建应用程序。\n\n去中心化应用运行在网络上，不需要任何中心化服务器。如果网络上的计算机出现故障，应用程序将受到影响。由于去中心化应用运行的，由于没有中心化服务器，网络上的绝大多数用户无法决定任何更改。\n\
    \n## 智能合约\n\n智能合约使用 `Solidity` 语言编写并运行在分布式账本上。它们根据代码中的合约条款自动验证、执行并强制。智能合约可以用于任何价值的交换，当许多行业采用区块链技术时，他们将使用智能合约系统。\n\
    \n只要代码中的合约条款满足，价值或支付就会交换。同样，如果条件不满足，支付或交换可能会被拦截，取决于合约是如何编写的。\n\n由于智能合约完全按照编程方式运行，围绕欺诈、未经的更改、服务器故障或不遵守合约条款的风险被消除了。而且由于合约会自动执行，不需要律师或法院等第三方。\n\
    \n在区块链上生成的条目带有时间戳，且无法更改。这就是为什么它成为理想合约平台的原因之一，因为所有更改都有时间戳，之前的版本保留在区块链上。\n\n我们可以存储合约并在创建新版本的同时保留之前的副本。每个副本都有自己的时间戳，从而为我们提供了处理过程的准确概述，并确保了交易双方的诚实，因为没有办法更改账本。区块链技术消除了对第三方管理合约的需求。\n\
    \n### 智能合约用途\n\n在 `Bitcoin` 网络中，存在巨大的风险。当你使用 `Bitcoin` 加密货币购买商品时，一旦支付通过，你无法保证商品会到达。发送者可能决定不发送你订单的内容，或者声称支付未收到。除非这些人付给了错误的\
    \ `Bitcoin` 账户，否则后者极不可能发生，但这凸显了主要问题之一。\n\n由于 `Bitcoin` 区块链上的交易不需要第三方，因此没有办法对交易提出争议、要求退款或使用中介来为你追回款项。当你注册\
    \ `Bitcoin` 钱包时，请记住它们也是匿名的，所以你无法知道支付付给了谁。如果你真的将其发送到了错误的 `Bitcoin` 地址，那么你就倒霉了，钱丢了，你无能为力。\n\
    \n"
