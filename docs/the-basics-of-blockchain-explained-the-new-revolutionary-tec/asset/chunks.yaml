- raw: 'Now let’s take things one step further and say that we have a shared library.
    Everyone contributes books, and other people can borrow them. You probably have
    books that others would like to read, and no doubt others have books you want
    to read. Anyone can join this library, and when they borrow a book, they can pass
    it on to someone else without taking it back to the library first.


    The big question is this – how do you record all the necessary information? You
    need to know:


    *   What books were available


    *   Who borrowed which book


    *   Who originally owned the book


    These records are not just for your own books but all the books in this shared
    library. You need to know everything – who owns the book, who borrowed it, who
    did they lend it to, and so on. Sure, you could have one member of the shared
    library keeping all the records, but that’s no different from how it’s done now
    – it would just be a centralized database with an intermediary maintaining it.


    Now, you are probably asking yourself, what’s the point of this? Surely I should
    just get a Kindle and get these books on it.


    This is one scenario where blockchain technology comes into its own, with benefits
    far outweighing the traditional database system. The blockchain is a decentralized
    database that holds the records of every book in the shared library. With a database
    like this, all library members can access the records. They can see what books
    are available, who owns them, who has them at the moment, and if that person has
    lent them to someone else.


    Whenever a book is “borrowed,” every record relating to that book is updated so
    every member can see it. There isn’t a centralized database and no third party
    maintaining and controlling the records because every library member helps maintain
    the entire database.


    ## WHERE DID THE NAME “BLOCKCHAIN” COME FROM?


    Continuing with our library example, a transaction is created when someone borrows
    a book. Multiple transactions occur simultaneously, so they are grouped, creating
    a block. This block is then placed atop the last block with reference to the previous
    block that links them. For example:


    With all the blocks linked together, a chain is created, and this is where the
    name “blockchain” comes from. Each block is linked to the previous one by referencing
    it. The previous one refers to the block before that, and so on, right back to
    the first block in the chain.


    Anyone can see the last block in the chain, seeing who borrowed what books. They
    could then go to the previous block to see its transactions and right back to
    the start. This blockchain does not have any regulating body or centralized database.
    If someone claims to be the original book owner, ownership can be traced right
    back to the first block, commonly called the “genesis block.”


    ## CHANGING BLOCKS AND TRANSACTIONS


    Once a block has been permanently added to the blockchain, it cannot be changed
    by anyone who added a transaction, nor can it be tampered with by anyone else.
    Because every block refers back to the previous one, anyone intending to change
    a transaction and commit fraud would need to change every block that comes before
    the one they want to change.


    We use the term “confirmation” to refer to the number of blocks on top of any
    transaction. Some people wait until six confirmations have been added before they
    will accept a payment – this is their way of ensuring that the transaction cannot
    be changed.


    ## DOUBLE-SPENDING


    The blockchain also solves the problem of double-spending. Let’s say that someone
    wants to steal books from the shared library. Whenever someone borrows a book,
    it creates a pending transaction. This transaction goes to all the people on the
    network so it can be validated and added to the chain – everyone does this validation.
    Whoever adds the transaction to the group of other pending transactions and then
    adds a validated transaction block to the chain is given a reward. When the new
    block is added, all the databases are updated with the new transaction record.


    Every person on the network can see everything- who has borrowed a book and who
    from. Because everyone knows who currently has every book, everyone can see when
    a book is not returned. In that way, double-spending or borrowing a book already
    with another person is avoided. In terms of other blockchains, it means that a
    transaction cannot be done twice using the same currency.


    We need to consider another factor. The borrower uses a token to pay the lender
    whenever they borrow a book. This token is known as a “bookcoin.”


    Let’s assume that you want to make a profit. When you lend a book to someone,
    you are paid one bookcoin. When you borrow a book, you pay the lender one bookcoin.
    To make a profit, you need to lend more books out than you borrow. Sneaky Pete
    is a new member of the shared library. He joined the library despite suspicions
    from other members that he was going to do something, well, sneaky.


    Sneaky Pete contributes a book to the library. Someone borrows it, and he is paid
    one bookcoin. Because he is somewhat sneaky, he develops a plan to borrow a lot
    more books than his bookcoin account allows for. He borrows a book from member
    A and then immediately borrows another book from member B. These result in two
    transactions being created. The first goes to the entire network for validation
    and approval, and Sneaky Pete pays member A one bookcoin. Because the new transaction
    is validated, it is added to a new block which is then added to the blockchain
    as:


    *   Sneaky Pete borrows “a book” from member A


    *   Sneaky Pete pays member A one bookcoin.


    Once this transaction has gone through, a new one is sent to the network for validation:


    *   Sneaky Pete borrows “another book” from member B


    *   Sneaky Pete pays member B one bookcoin.


    The network looks at Sneaky Pete’s balance – he only had one bookcoin, and he
    spent that on the first book he borrowed. Sneaky Pete is trying to copy his coin
    and trick the entire network. However, because the blockchain is open, everyone
    can see every transaction that ever took place and can trace them right back to
    the start. They can see that Sneaky Pete received one bookcoin for lending his
    book and that his balance was just one bookcoin. He doesn’t have the two that
    he was trying to spend, and all network members can see this. Most of the network
    agrees that the second transaction is not valid and will not allow him to have
    the second book. The payment is invalidated, the transaction refused, and not
    placed on the blockchain.


    ## DISTRIBUTED CONSENSUS


    Whenever a transaction is sent to the network to validate, most people on the
    network must agree for the transaction to be considered valid. This is called
    distributed consensus. It doesn’t require 100% agreement because there may be
    people on the network who are trying to cheat the system by validating fake transactions
    and double-spending.


    Most blockchains have a consensus threshold of more than 50%. Therefore, if at
    least 50% of those on the network agree on a transaction, it is validated.


    This is the essence of a decentralized blockchain and is how they work to validate
    transactions. Rather than one centralized party agreeing on everything, the entire
    network shares the responsibility. Everyone connected to the network gets to have
    a say in whether a transaction should be validated and added to a block, which
    then goes on the blockchain.


    ## MINING'
