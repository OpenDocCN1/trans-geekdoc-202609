    > *I love this stuff - bitcoin, Ethereum, blockchain technology - and what the
    future holds.*


    > ABIGAIL JOHNSON


    ## Introduction to Blockchain


    We’ve all heard of the blockchain, mostly in connection with Bitcoin. But do you
    know what it is? How it works? Why do we even need it? Not many people do, but
    you obviously want to know, given that you’ve picked up this book.


    Blockchain technology is classed as one of the world’s greatest innovations. Many
    proponents claim that it can cause massive disruption to just about every industry
    and will impact all our lives in one way or another within the next decade or
    so.


    Is this true? Is it the greatest innovation the world has ever seen? Or is it
    just another hype that will go the same way as many others? Are we seeing another
    bubble that will burst as spectacularly as the dot com bubble burst in the 80s?


    Perhaps the more important question is, will this technology lead financial firms
    and governments to change how they store and process our data, or will they continue
    as they are? Many people are unhappy with the rising number of data leaks and
    hacks we’ve seen in recent times, and the blockchain could be just what we’ve
    been looking for to keep our data secure.


    This book will answer these questions and more. From what a blockchain is to its
    advantages and disadvantages, we’ll look at everything. We’ll even take a technical
    look at how a blockchain works, its use cases, now and potential, and how this
    technology will impact all of us in the years ahead.


    What it won’t do is convert you into believing that the blockchain is the be-all
    and end-all of everything, that it is the answer to your prayers, to all the problems
    the world faces. You will have to make your own mind up about that once you have
    finished reading it. I will provide you with everything you need to understand
    the technology, both good and bad, and talk about some of the hype.


    This is for those of you who know little about the blockchain but want to understand
    it. While it is technical in places, I have tried to keep it simple to ensure
    every reader can understand it.


    > *I love this stuff - bitcoin, Ethereum, blockchain technology - and what the
    future holds.*


    > ABIGAIL JOHNSON


    We’ve all heard of the blockchain, mostly in connection with Bitcoin. But do you
    know what it is? How it works? Why do we even need it? Not many people do, but
    you obviously want to know, given that you’ve picked up this book.


    Blockchain technology is classed as one of the world’s greatest innovations. Many
    proponents claim that it can cause massive disruption to just about every industry
    and will impact all our lives in one way or another within the next decade or
    so.

