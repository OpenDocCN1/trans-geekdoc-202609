    \ was added. This kind of disagreement will result in a fork in the blockchain.\
    \ Some users will split away from the main network and use their computing power\
    \ and resources on another separate blockchain from the original one.\n\nThere\
    \ have been several major forks in blockchains, including Ethereum. The original\
    \ Ethereum blockchain split after a disagreement, resulting in some users allocating\
    \ their resources to a different blockchain, thus creating two blockchains – Ether\
    \ and Ether Classic.\n\nThat brings us to the end of this book, and you should\
    \ now have a thorough understanding of how the blockchain works.\n\nTo finish,\
    \ I have provided a glossary containing common terms.\n\n A\n- `ABI (Application\
    \ Binary Interface)` – this is an interface in between a pair of binary program\
    \ modules. One is usually a library while a user runs the other.\n- `Altcoin`\
    \ – a cryptocurrency that isn’t Bitcoin\n- `API` – the application programming\
    \ interface belonging to a remote server responsible for sending requests and\
    \ getting the responses\n\n B\n- `Bitcoin` – the first cryptocurrency and still\
    \ the most popular, it was released in 2009 and based on a blockchain’s decentralized\
    \ ledger\n- `Blockchain (Public)` – a structure that stores data or digital transactions\
    \ on a peer-to-peer, immutable, decentralized ledger that it is virtually impossible\
    \ to manipulate, even though anyone can access it\n- `Blockchain (Private)` –\
    \ similar to a public blockchain but on a private network of computers that only\
    \ those with permission can access\n- `Business Logic Layer` – section of code\
    \ determining rules that must be followed in business\n"
  trans: '

    找到一个在加入交易后能产生比目标更低哈值的数字的矿工，将该区块添加到链中，从而获得手续费和奖励。


    当数字被找到后，网络上的所有其他计算机都会将其添加到交易数据中并验证其正确。由于这是一个随机数，它并不容易找到，但一旦找到，验证它非常简单。


    验证后，区块被添加到链中，网络上的所有计算机都会更新其自己的系统，使用包含新区块的最新区块链版本。


    有效区块添加到区块链，然后网络上的所有计算机都将其系统更新为区块链的最新版本，包含新区块。


    ## CAN 网络难度可以增加吗？


    找到生成有效哈希的正确数字无异于一场概率游戏，就像掷骰子一样。最大的因素之一是处理速度。计算机猜测正确数字的速度越快，找到正确答案就越快。


    我们知道比特币区块链每 10 分钟添加一个区块。网络上的计算机越多，网络的处理能力就越强。这意味着对于区块正确数字的尝试次数越多。为了保持每 10 分钟添加一个区块的时间，每隔
    2016 个区块就会对难度进行调整，从而改变区块区块验证所需的最小和最大数字。


    用我们的骰子例子，如果网络难度为 `3`，只有在掷出小于 `3` 的数字时区块才能通过验证。如果只有一个人在掷骰子，有 2/6 的概率掷出 `1` 或 `2`
    并验证区块将其添加到区块链。这可能大约需要 10 分钟，这意味着满足了每 10 分钟添加一个区块的目标。然而，如果增加了第二个人且他们也在掷骰子，那么掷出小于
    `3` 的数字可能只需要 5 分钟。因此，添加区块所需的时间也仅为 5 分钟，只有网络设定时间的一半。


    当网络上的人数增加时，需要进行调整以维持每 10 分钟添加一个区块的网络目标。因此，该数字将从 `3` 减少到 `2`，确保只有在掷出低于 `2` 的数字时才能添加区块。


    在我们原始示例中，网络上只有一个人尝试掷出小于 `3` 的数字，获得有效数字的概率是 2/6。如果我们将网络人数增加一倍并降低网络目标，概率就会减少到 1/6。这使得添加区块的时间重新回
    10 分钟的目标。


    比特币区块链的工作原理非常相似。网络中加入的计算机越多，对目标的调整就越多。这意味着接受的有效哈希越少，范围内需要猜测的数字越多，以获得有效哈希。


    ## 工作量证明问题


    通过计算正确数字来验证哈希的方法被称为“工作量证明”（proof-of-work）。之所以这样命名，因为它指示了在添加验证区块时所贡献的资源和计算能力。


    “胜者”矿工获得的奖励是为了补偿他们的资源、计算能力和电力，形式是对成功添加的每个区块的支付。这被称为区块奖励，成功的矿工还会获得他们添加的每个区块中附带的交易手续费——这就是为什么他们倾向于寻找手续费更高的交易。


    工作量证明消耗大量的电力和计算能力。我们知道，比特币网络的强度是世界上前 500 台超级计算机总和的 1 万倍以上。然而，这些力量的大大部分被浪费在了生成随机数上。


    工作量证明的主要问题是资源浪费在了某些看似无意义且运行区块链网络并非真正需要的事情上。


    停下来思考一分钟。一个计算机网络的力量远超过最强大的超级计算机的合和。但它并没有试图为世界重大问题提供解决方案，所做的只是生成一些随机数。这难道不是有点荒唐吗？这就是为什么许多人批评比特币区块链使用的工作量证明方法。


    可以使用其他方法来代替工作量证明。它们包括活动证明（proof-of-activity）、容量证明（proof-of-capacity）和燃烧证明（proof-of-burn）。你应该理解为其他区块链使用不同的方法，尽管我们在这里不会详细介绍它们。


    以太坊将其网络用于去中心化应用，这是对计算能力的更好的利用。该平台也正在转向使用权益证明（proof-of-stake）而非工作量证明。


    ## 区块链网络安全


    去中心化区块链都有许多安全特性，但最大的之一是所有网络成员的访问权限，并且每笔交易都会每个网络成员的计算机上更新。这确保了没有中心化的数据库，没有任何个人或组织可以操纵区块链进行欺诈。


    任何人都可以将区块添加到区块链，但每个区块必须被网络大多数用户接受为有效。一旦区块通过验证并添加到区块链，网络上的每个区块链副本都会更新为新版本，然后添加新区块。


    正如你之前学到的，当有人尝试更改交易时，必须生成新的哈希，这意味着它将与其他网络副本不匹配且不会通过验证。


    ## 51% 攻击与区块链分叉


    我们在书前面的部分提到过 51% 攻击。理论上，51% 攻击不会发生，因为这需要用户拥有网络 50% 以上。如果有人真的拥有了这种控制权，他们就可以决定哪些区块和交易，网络上的每个区块链副本都会更新为伪造的区块链。


    分叉（Forks）是指大量网络用户不同意网络更改，例如网络功能的变化或所添加的区块或交易。这种分歧会导致区块链的分叉。某些用户将离开主网络，并将他们的计算力和资源用在另一个与原始独立的区块链上。


    区块链发生过多次重大分叉，包括以太坊。原始以太坊区块链在分歧后分叉，导致某些用户将其资源分配到不同的区块链，从而创建了两个区块链——Ether 和 Ether
    Classic。


    这带我们来到了本书最后，你现在应该对区块链的工作原理有了彻底的理解。


    最后，我提供了一个包含常用术语的词表。


    A

    - `ABI (Application Binary Interface)` – 这是两个二进制程序模块之间的接口。通常其中一个是库，而用户运行另一个。

    - `Altcoin` – 非比特币的加密货币。

    - `API` – 属于远程服务器的应用程序接口，负责发送请求并获取响应。


    B

    - `Bitcoin` – 第一种且仍是最流行的加密货币，它于 2009 年发布，基于区块链的去中心化账本。

    - `Blockchain (Public)` – 一种存储在点对点、不可篡、去中心化账本上的数据或数字交易，几乎无法操纵，尽管任何人都可以访问。

    - `Blockchain (Private)` – 类似于公共区块链但在私有计算机网络上，只有获得许可的人才能访问。

    - `Business Logic Layer` – 确定业务必须遵循的规则的代码部分。

    '
