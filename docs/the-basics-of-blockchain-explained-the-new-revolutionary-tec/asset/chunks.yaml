  fmt: '

    There has been a considerable amount of hype surrounding blockchain-based systems
    and their potential to disrupt companies and entire industries. Still, we are
    unlikely to see this come to fruition in the short term. However, the trend can
    clearly be seen in the rising number of alternative systems based on the blockchain,
    and that trend is likely to strengthen in the years to come.


    The predictions that the blockchain will replace banks, Uber, Google, and other
    intermediaries may not come true, at least not in the short term. However, whether
    these third parties are replaced or not, we will all come across blockchain technology
    in many ways, be it through systems we already use being replaced or being given
    the option of choosing a blockchain alternative.


    ## KEY Takeaways


    The key takeaways from this chapter are:


    *   Right now, it’s hard to say whether decentralized open-source or decentralized
    closed-source development will win, but there is plenty of development in both
    areas, and both are likely to be developed for different use cases.

    *   Distributed ledgers not built on blockchains will still have many of the blockchain
    benefits. They are a growing trend that could give blockchain-based systems some
    serious competition in the future.

    *   We will see fewer cryptocurrencies in the future, with only the major ones
    surviving. However, we will see an increase in the number of different tokens
    available. Another growing trend is for companies to use tokens on Ethereum rather
    than creating their own cryptocurrencies and blockchains. This trend will likely
    continue as Ethereum allows developers to create their own smart contracts and
    decentralized apps (d’Apps).

    *   Blockchain technology now has more functionality than it ever did, with things
    like smart contracts and d’Apps that weren’t included in the original code. Blockchain’s
    future technology is referred to as blockchain 2.0, and it includes the new enhancements;
    thus, it cannot be confused with the capabilities of the original blockchain.

    *   When the blockchain first came out, companies and governments refused to accept
    it, but now that is changing. The blockchain is more accepted these days, and
    some governments encourage industries and companies to accept cryptocurrencies
    as payment forms. At the same time, much research and funding are being plied
    into developing blockchain technology and infrastructure.

    *   Blockchain technology may not be the predicted revolution in the short term,
    but it will become a part of our lives through payment forms, distributed ledgers,
    or alternative choices to existing systems.


    The next chapter will look deeper into the blockchain, with a more technical look
    at how they work, building on what you have already learned.


    10![](images/svgimg0003.svg)


    > *“The blockchain is a distributed network that solves all the problems that
    we have of finance, but more broadly, it’s like a philosophy. It’s a way of life.”*


    > **MIKE CERNOVICH**


    I could have added this to the first chapter, but not everyone is interested in
    the technical workings of the blockchain, preferring to content themselves with
    a basic overview. Here, I will delve into advanced aspects of the blockchain,
    such as cryptography and hashes.


    I’ve also added a glossary at the end of this book so you can refer to it when
    you want to understand some of the more common terms you may hear regarding blockchains,
    Ethereum, smart contracts, Bitcoin, etc.


    ## HOW THE BLOCKCHAIN WORKS


    We will look at the Bitcoin blockchain because it was the first one, and every
    other blockchain is based on it. As such, they all work in much the same way.


    The algorithm used on the Bitcoin blockchain is `SHA256`. This generates a `256-bit`
    hash, unique and fixed in size. But, what is a hash? It’s like a secret code,
    using encryption to hide the data, preventing it from being decrypted without
    the correct authorization. The generated hash is always fixed in length, and each
    one is the same. It doesn’t matter whether a single word or entire library is
    entered; if a single letter is changed, the hash changes. At first glance, a hash
    would appear to be completely random, unconnected to the data. Unless you have
    a private key or know the original message, there is no way to work the message
    out from the hash.


    Some examples of generated hashes are:


    The word `blockchain` hashed, with an upper case: `b3f4e9b8455ea3ea2060ae2cad8453bc43277eb4b44c`


    The word `blockchain` hashed, with a lower case: `154a5318fb886ba779548753e0b047ba4cd76762400820180e73`


    The word `block chain` hashed, with the word `block` and `chain` separated by
    a space: `7ef354758e1810bd43efbc2dff056398756db4f352d`


    The word `Romeo and Juliet` in its entirety, with more than 20,000 words: `e807d23c4b4aa4542d3508e289f38047ca60334b`


    As you can see in these examples, it isn’t possible to determine the input data
    by looking at the generated hash. You can also see that making a minor change,
    such as adding a space or changing an upper case to lower case, results in a significantly
    different hash.


    ## HOW TRANSACTIONS ARE HASHED INTO BLOCKS


    The examples above showed how we could not detect patterns in the hash to tell
    us what the input data was. However, those examples are not transactions, so that
    is what we will use next. Once we have generated the hashes, they will be linked
    to a block. The blockchain’s first block is the genesis block, or `block 0`.


    ### Block 0

    In the first transaction block will be the text:

    John received 100 Bitcoins.

    Sally received 50 Bitcoins.

    Sam received 10 Bitcoins.


    The resulting hash is:

    `Hash 0 - 000064177781545e50c0235823c9ae0785d499499cc5a5dcdff2332f7f`


    ### Block 1

    In the second transaction block are these transactions:

    John sent 50 Bitcoins to Sally

    Sally sent 10 Bitcoins to Sam


    The transactions are all signed using the private key of the Bitcoin address owner
    sending the payment. The private key cannot be seen, but the network can verify
    that the right private key was used to send the payment. This transaction block
    will also contain the hash from the last block:

    `0000641727781545e50c0235823c9ae0785d499499cc5a5dcdff2352a53ftf`


    A `nonce` is also included, a Number Used Once. This nonce contains the answer
    to the puzzle that must be solved by the miners to validate and add the block
    to the blockchain and earn their rewards.

    `Hash 1 - 0000ed29ee4097b79e94adb355b8c50a900rb31dec4673eac2abd07`


    ### Block 2

    In the third transaction block are the transactions below, all signed by the private
    key. The block will also contain the previous block’s hash and the nonce:

    Sally sent 20 Bitcoins to Sam

    John sent 20 Bitcoins to Sally


    `Hash 2 - 0000d5cada28a39cb051cc87d550fe0c4ba704a93ad33db3789366ab40caf`


    ### Block 3

    The fourth transaction block has the transactions shown below, plus the nonce
    and the previous block’s hash:

    Sam sent 10 Bitcoins to John

    Sally sent 20 Bitcoins to John


    And the resulting hash is as follows and will also include the previous hash and
    the nonce:

    `Hash 3 - 0000lbbd649l304360d42bd5u26l02l4937c263b0bc6cmb3ac05574b2d4c`


    And so, it goes on throughout the entire blockchain.


    ## HOW TO CREATE A BLOCKCHAIN


    With the above examples, we are now in possession of four bits of data, all converted
    into hashes. That means those hashes can be added to blocks and a blockchain created
    to link them all.


    The first block contains this hash:

    `0000641727781545e50c0235823c9ae0785d499499cc5a5dcdff2352a53ftf`


    This is the genesis block or `block 0` and, as it is the first block on the chain,
    it doesn’t need to reference a previous one.

    '
  trans: '

    围绕区块链系统及其颠覆公司和整个行业的潜力，已经引发了大量的炒作。尽管如此，我们在短期内不太可能看到这些变为现实。然而，这种趋势可以从基于区块链的替代系统数量增加中明显看出，而且这种趋势在未来几年可能会进一步加强。


    区块链将取代银行、Uber、Google 以及其他中介的预测可能不会实现，至少在短期内不会如此。然而，无论这些第三方是否会被取代，我们都将以多种方式遇到区块链技术，无论是通过我们正在使用的系统被替换，还是被赋予选择区块链替代方案的选项。


    ## 核心要点


    本章的核心要点如下：


    *   目前，很难说去中心化开源还是去中心化闭源开发将胜出，但这两个领域都有大量的开发，而且两者都可能针对不同的用例进行开发。

    *   并非构建在区块链上的分布式账本仍具有许多区块链的优势。它们是一个日益增长的趋势，未来可能会为基于区块链的系统带来巨大的竞争。

    *   未来我们看到的加密货币将会减少，只有少数主要的能够幸存。然而，我们将看到不同代币数量的增加。另一个增长的趋势是公司在以太坊上使用代币，而不是创建自己的加密货币和区块链。这种趋势可能会持续，因为以太坊允许开发者创建自己的智能合约和去中心化应用（d’Apps）。

    *   区块链技术现在的功能比任何时候都更丰富，包含了原始代码中没有的智能合约和 d’Apps 等。区块链的未来技术被称为区块链 2.0，它包含了新的增强；因此，不能与原始区块链的功能混淆。

    *   区块链刚出现时，公司和政府拒绝接受，但现在情况正在发生。区块链现在越来越被，一些政府鼓励行业和公司接受加密货币作为支付形式。同时，大量的研究和资金正投入区块链技术的开发。

    *   区块链技术短期内可能不是预测中的革命，但它将通过支付形式、分布式账本或现有系统的替代选择成为我们生活的一部分。


    下一章将深入探讨区块链，基于你已经学到的知识对其工作原理进行更深入的技术观察。


    10![](img/svgimg0003.svg)


    > *“区块链是一个分布式网络，解决了我们在金融方面的所有问题，但更广泛地说，它更像是一种哲学。一种生活方式。”*


    > **MIKE CERNOVICH**


    我本可以把这些加入第一章，但并不是每个人都区块链的技术原理感兴趣，他们更倾向于满足基础的概述。在这里，我将深入区块链的高级方面，例如密码学和哈希。


    我还在书的末尾添加了一个词汇表，当你想要理解可能听到的关于区块链、以太坊、智能合约、比特币等某些常用术语时，可以查阅。


    ## 区块链是如何工作的


    我们将查看比特币区块链，因为它是第一个，而所有其他区块链都是基于它的。因此，它们的工作方式非常相似。


    比特币区块链上使用的算法是 `SHA256`。它生成一个 `256-bit` 的哈希值，它是唯一的且长度固定。但是，哈希是什么？它像一个秘密代码，使用加密来隐藏数据，防止其在没有正确授权的情况下被解密。生成的哈希值长度总是固定的，且每一个都是相同的。无论输入的是一个单词还是整个库；只要改变一个字母，哈希值就会改变。从表面上看，哈希值似乎是完全随机的，与数据没有联系。除非你有私钥或知道原始消息，否则无法通过哈希值推断出消息。


    生成的哈希值示例：：


    单词 `blockchain` 的哈希值（全大写）：`b3f4e9b8455ea3ea2060ae2cad8453bc43277eb4b44c`


    单词 `blockchain` 的哈希值（全小写）：`154a5318fb886ba779548753e0b047ba4cd76762400820180e73`


    单词 `block chain` 的哈希值（`block` 和 `chain` 之间有空格）：`7ef354758e1810bd43efbc2dff056398756db4f352d`


    `Romeo and Juliet` 的全文，包含超过 20,000 个单词：`e807d23c4b4aa4542d3508e289f38047ca60334b`


    正如你在这些示例所示，无法通过查看生成的哈希值来确定输入数据。你也可以看到，进行微小的变化（例如添加空格或将大写改为小写）会导致截然不同的哈希值。


    ## 交易是如何哈希成区块的


    上面的示例显示了我们如何无法通过哈希值中的模式来判断输入数据是什么。然而，那些示例不是交易，所以这就是我们接下来使用的。一旦我们生成了哈希值，它们将被链接到区块中。区块链的第一个区块是创世区块，或
    `block 0`。


    ### 区块 0

    第一个交易区块中将包含文本：

    John received 100 Bitcoins.

    Sally received 50 Bitcoins.

    Sam received 10 Bitcoins.


    生成的哈希值是：

    `Hash 0 - 000064177781545e50c0235823c9ae0785d499499cc5a5dcdff2332f7f`


    ### 区块 1

    第二个交易区块中包含这些交易：

    John sent 50 Bitcoins to Sally

    Sally sent 10 Bitcoins to Sam


    所有交易都是使用发送付款的比特币地址所有者的私钥签名的。私钥是不可见的，但网络可以验证使用了正确的私钥来发送付款。此交易区块还将包含上一个区块的哈希：

    `0000641727781545e50c0235823c9ae0785d499499cc5a5dcdff2352a53ftf`


    包含一个 `nonce`，这是矿工必须解决以验证并将区块添加到区块链中从而获得奖励的答案。

    `Hash 1 - 0000ed29ee4097b79e94adb355b8c50a900rb31dec467`


    ### 区块 2

    第三个交易区块中包含以下交易，均由私钥签名。该区块还将包含上一个区块的哈希和 nonce：

    Sally sent 20 Bitcoins to Sam

    John sent 20 Bitcoins to Sally


    `Hash 2 - 0000d5cada28a39cb051cc87d550fe0c4ba704a93ad33`


    ### 区块 3

    第四个交易区块包含下面的交易，加上 nonce 和上一个区块的哈希：

    Sam sent 10 Bitcoins to John

    Sally sent 20 Bitcoins to John


    生成的哈希值如下，并将包含上一个哈希和 nonce：

    `Hash 3 - 0000lbbd649l304360d42bd5u26l02l4937c263b0bc6cmb3ac055`


    它一直持续到整个区块链。


    ## 如何创建区块链


    通过上面的示例，我们现在拥有四位数据，它们已全部转换为哈希。这意味着这些哈希值可以添加到区块中，并创建一个区块链将它们全部链接。


    第一个区块包含此哈希值：

    `0000641727781545e50c0235823c9ae0785d499499cc5a5dcdff2352a53ftf`


    这就是创世区块或 `block 0`，由于它是链上的第一个区块，因此它不需要引用上一个区块。

