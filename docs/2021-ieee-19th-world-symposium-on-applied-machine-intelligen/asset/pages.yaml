    transformation, which is one of the most common and the necessary shift between
    the two languages. Transforming paradigms into object-oriented or functional paradigms
    is a common task. However, the linguistic differences between the source and target
    languages cause some structures of the legacy may not be supported in the target
    language. In some cases, elimination of such structures is required.


    In this paper, we present the application of machine learning in software modernization.
    We present a study of a classification problem that arises during the transformation
    of legacy code. We aim to solve this problem using first static analysis. Finally,
    we compare the results to see how much machine learning can improve over classic
    static analysis. Our AI-based approach is fully automatic and highly precise,
    which, as we see, is a rare but desirable outcome.


    The paper is structured as follows. Section 2 presents the difficulties of maintenance
    and analysis by problems and solutions proposed in relation. Section 3, we explore
    the methods of automation and precision. In Section 4, we present the case study
    of pointer conversion. In Section 5 we present the solution to the problem using
    machine learning analysis. Finally, Section 6 concludes the paper and highlights
