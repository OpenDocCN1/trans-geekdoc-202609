    **Abstract**—As software engineering techniques and practices continually evolve,
    programs created with an older technology stack are often referred to as legacy
    code. Naturally, the needs to make use of new and more effective technologies,
    making the legacy code easier to maintain and operate, become paramount. Many
    approaches have been proposed and proposed to reduce the cost of implementation
    by semi-automatically translating legacy systems into a more modern, architecture.
    However, the results of these efforts are often limited in scope and quality.


    **Index Terms**—code modernization, analysis, machine learning


    # ## I. INTRODUCTION


    The maintenance of outdated software always requires great effort from developers.
    As software grows and time passes, it becomes harder and harder to maintain them.
    Over time, software engineering techniques constantly advance. New practices and
    paradigms may benefit to application development, which could be useful in legacy
    systems [1]. When one naturally needs to re-implement these systems using new
    tools, a more modern approach arises, but this is extremely difficult in practice.
    Firstly, the new implementation must be substantially equivalent to the former
    program.


