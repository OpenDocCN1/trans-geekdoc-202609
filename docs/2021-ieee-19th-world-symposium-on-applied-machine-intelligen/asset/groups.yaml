    # 使用机器学习技术进行软件现代化


    第一作者 Norbert Somogyi

    自动化与应用信息系

    布达佩斯理工大学

    匈牙利，布达佩斯

    somogyi@edu.bme.hu


    第二作者 Gábor Kövesdán

    自动化与应用信息系

    布达佩斯理工大学

    匈牙利，布达佩斯

    kovesdan@vik.bme.hu


    **摘要**——随着软件工程技术和实践的不断演进，使用旧版技术栈创建的程序通常被称为遗留代码（legacy code）。自然地，利用新型且更有效的技术使遗留代码更易维护和运行变得至关重要。目前已有许多方法被提出，并试图通过半自动将遗留系统转换为更现代的架构来降低实现成本。然而，这些努力的结果在范围和质量上往往非常有限。


    **索引词**——代码现代化，分析，机器学习


    ## I. 引言


    维护过时的软件始终需要开发者投入巨大的精力。随着软件的增长和时间的推移，维护这些软件变得越来越困难。随着时间的推移，软件工程技术不断进步。新的实践和范式可能受益于应用开发，这对于遗留系统可能很有用处
    [1]。当人们自然需要使用新工具重新实现这些系统时，一种更现代的方法应运而生，但在实践中这是极其困难的。首先，新的实现必须与原程序实质等效。


    项目编号 FIEK_16-1-2016-0007 在匈牙利国家研究发展基金的支持下实施，该资金来自高等教育与工业运营中心 - 研究基础设施开发（FIEK_16）资助计划。


    现代化的重新实现本身上是一个耗时且昂贵的过程。


    为了使这些困难更易处理，将遗留代码辅助转换为更具优势的环境是理想的。根据所要翻译的具体软件，例如，许多工具侧重于架构转换，这是两种语言之间最常见且必要的转变。将范式转换为面向对象或函数范式是一项任务。然而，源语言和目标语言之间的语言差异导致遗留系统的某些结构可能不受目标语言的支持。在某些情况下，需要消除此类结构。


    在本文中，我们展示了机器学习在软件现代化中的应用。我们介绍了遗留代码转换过程中出现的一个分类问题研究。我们的目标是首先通过静态分析来解决这个问题。最后，我们比较了结果，以查看机器学习可以在经典静态分析的基础上改进多少。我们基于AI的方法是全自动且高精度的，正如我们所看到的，这是一个稀有但理想的结果。


    本文的结构如下：第2节通过与之相关的问题和解决方案介绍了维护和分析的困难。第3节，我们探索了自动化和精确化的方法。第4节，我们展示了指针转换的案例研究。第5节我们介绍了使用机器学习分析的问题的解决方案。最后，第6节总结了全文并强调了某些必须在目标语言中的内容。例如，C语言的指针算术无法转换为Java，后者没有等效的转换。


    遗留软件的维护一直是一个难题。研究人员努力确定维护软件的困难。Harrington和 Walton [2] 断言，对于许多组织而言，维护遗留软件意义重大。一项为期三年的研究发现，在某些情况下，维护这些系统占据了所有成本的大部分。他们还确定最复杂的系统并不是成本最高的，因此否定了LOC（代码行数）作为维护指标的有效性。


    在其他情况下，静态代码分析证明无法提供可靠的、全自动的解决方案。在这些场景中，人们必须在关注力和无错误生成之间进行权衡。如前所述，这通常表现为多选题问题，其中必须选择正确的方法来转换源代码。例如，Systems
    [9] 开发的代码是全自动翻译。然而，在某些情况下，生成的代码感觉并不像程序员从零创建的东西那样自然。例如，在将C程序转换为Java时，转换是一项挑战。


    ## II. 相关工作


    Huijgens、Duversen和Van Jong [3] 深入研究了各种案例研究中的遗留软件维护。作者们描述了一个案例，在该案例中，采用迭代敏捷方法处理遗留系统使利益相关者认为该系统质量堪疑。他们识别了有助于遗留系统成功维护的7个关键因素。这些因素列在表1中。因此，我们可以说敏捷方法通常可以改进这些系统的成功管理。


    Sneed和Snowbo [5] 分析了面向对象系统的复杂性。他们得出结论，即使这样的系统也可以被认为“至少在形式上，它们被正确建模，且系统有工具支持”。作者还声称，实际上逆向工程系统可能还不够，但对于执行维护任务已经足够了。他们声称，架构理解需要使用人工智能。


    他们通过使用生成的源类模拟指针函数来转换它们。然而，全自动地，这是维护主要功能的代码以及生成的代码。另一方面，人们可能会想出其他解决该问题的方法以产生更多结果。例如，使用静态代码分析无法估计系统的状况并对其进行相应转换。显然，静态分析可以引导转换。


    存在其他方法可以帮助软件版本控制系统包含用于软件维护的有用信息。他们引入了这些信息，可以与开发者活动使用。信息的可视化有助于开发者学习和理解系统，并可能提高可维护性和逆向工程过程。


    另一方面，自动转换影响转换的目标。例如，如果转换的目标是创建源代码的面向对象设计，那么通过全自动方式恢复的内容是有限的，工具实现了从PL/I代码的自动转换。然而，结果的设计有其缺陷，感觉并不像程序员想要的。尽管如此，如果人们想保持过程全自动，那么什么是


    软件维护以及机器学习技术的应用，用以分析遗留系统过去的维护历史。作者得出结论，通过分析过去的维护记录，可以使用机器学习预测源文件的更改是否可能包含另一个源文件的更改。例如，它可以用于检测潜在的错误并从总体上改进留留软件的维护。


    最近，有一些成功的工作是自动化的。这可能包括用户交互，例如让用户选择正确的代码或识别编辑生成的代码。


    达到尽可能高仍然是软件现代化的目标。存在某些局限性，研究表明完全自动转换无法完全实现。我们和Verhof [88] 强调了超出语法翻译的自动化源代码现代化的困难。如前所述，目标语言可能看起来具有某些源语言的特征。


    另一种流行的方法是额外信息——代码，或者以正则表达式和图表的形式从某个角度描述系统 [11] [12]。


    结论是，维护遗留代码是软件工程中复杂且重要的一部分。为了降低风险，将遗留系统转换为另一种理想的解决方案。应该努力使这些转换尽可能自动化。然而，全自动转换有其局限性，且往往不可靠。此时人们必须进行更好的权衡。

    '
