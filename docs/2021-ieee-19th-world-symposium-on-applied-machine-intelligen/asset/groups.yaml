    more natural generated code and automated behavior. Thus, solutions that have
    both of these properties are a rarity, provide the most value in the context of
    software modernization.


    ![](img/72e6f19186ee9ea1bac68be65103f3da_2_0.png)


    - highly precise, precision but low automation

    - highly precise and highly automatic

    - highly automatic, but low precision


    → automation


    ## III. CONCERNS OF SOFTWARE MODERNIZATION


    As mentioned before, two properties that software modernization tools (or concrete
    transformation techniques) strive to maximize are automation and precision. We
    have also seen that two often exclude each other and a trade-off must be made
    between them. The more automatic the transformation is, the less post-transformation
    work developers must dealth with. On the other hand, a higher level of automation
    often means a decrease in precision. This may result in two outcomes: the transformation
    may produce many false negatives during multiple-choice decisions. This, which
    depends on the complexity of the problem at hand. Whereas, the transformation
    might succeed, more automatic solutions may end up decreasing the quality of the
    generated code; such was the case with the legacy systems, where inserting pointer
    functionality resulted in us lower quality-oriented code, but the process became
    fully automatic.


    Fig. 1. The relation between precision and automation of modernization. Methods
    that belong to the gray area are rare and therefore defy code modernization efforts.


    Fig. 1 depicts the basic relation between automation and precision, and illustrates
    the place of machine learning techniques in this context.


    In general, we can say that the precision and automation of a technique are inversely
    proportional. The higher the automation, the lower the accuracy. In contrast,
    machine learning techniques may be both highly precise (if used properly) and
    automatic making them extremely useful in code modernization. However, there is
    one significant drawback as well: machine learning takes more effort and more
    allocated resources than static code analysis methods. Machine learning for just
    any possible decision to make the transformation we want to make seems highly
    overkill in general. Thus, we propose to use it only when other, more traditional
    and easier methods fail to produce satisfying results. In these cases, we believe
    that the advantages of machine learning far outweigh the drawbacks.


    When encountered in the source code, one must address whether it be a Java array
    (if it points to the beginning of an array) or a regular Java variable (if it
    does not).


    To solve this static analysis, we propose the following solution: Let us default
    by pointer that is not an array and look for signs in source code that contradicts
    this. We look for the indexing operator. Static analysis of the source code reveals
    that indexing operation was used on a variable; thus the type of the variable
    was changed so that it is transformed into an array.


    However, although the static analysis method used, it still lacks the required
    accuracy to be true in practice. We have measured the success rate of this approach
    on a number of experimental details (in the next section) and have a success rate
    of 58%. In this case we have caught 1 correct out of 2, which is barely better
    than that of random pointers used. A more efficient solution is one that requires
    the fully automatic nature of this approach.


    ## IV. POINTERS TO USING STATIC ANALYSIS


    In this section, we demonstrate the case study using the machine learning in code
    modernization. The process arises during the transformation of C pointers to Java
    variables. As we have seen, the problem is solvable by embedding pointer functionality,
    using different techniques, such as containers. If we use static code analysis,
    we need to decide whether a pointer is an array or not. This is something that
    is not that simple multiple-choice problem at compiler level, the compiler sees
    a pointer type. Moreover, it should be noted that this is a typical choice problem
