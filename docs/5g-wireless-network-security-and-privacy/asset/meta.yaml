  - 身份验证与生成流程
- - '###'
  - 6.4.3 全额认证
- - '###'
  - '4: UDM 找到对应的真实 ID 和长期密钥 K 并生成一批 m 认证向量，每个向量包含一个随机数 RAND 认证向量，一个令牌 AUTH， 以及预期响应
    (RES)。UDM 生成一个密钥 KAUSF。UDM 将 (PID,AV[1,...,m],KAUSF) 发送到 BS/AMF/SMF。在认证向量中，AUTN
    表示认证码 H2(K,RAND)。该代码通过验证 UE 与网络之间消息的有效性，对认证过程的完整性至关重要。'
- - '###'
  - '5: AUSF 从 KAUSF 派生密钥 KAMF，并将 KAMF 同 (PID,AV[1,...,m]) 发送到 BS/AMF/SMF。'
- - '###'
  - '6: BS/AMF/SMF 基于密钥 KAMF，为 UE 与 BS/AMF/SMF 之间的链路机密性和完整性保护两个密钥 Ke 和 Ki，一个用于派生会话密钥
    KSMF 的 RAND'' 以及伪 ID。BS/AMF/SMF 选择一个认证向量 AV 并加密的 RAND, AUTH, RAND'' PID 发送到 UE。'
- - '###'
  - '7: UE 验证 AUTH。如果 AUTH 通过，通过 RAND 计算 UE 与 BS/AMF/SMF 链路机密性和完整性保护的 Ke 和 Ki；UE 将
    RES。'
- - '###'
  - '8: BS/AMF/SMF 验证从 UE 接收到的 RES。如果 RES 验证，BS/AMF/SMF 使用 AP 与 BS/AMF/SMF 之间的共享密钥发送的
    KSMF 和 PID。'
