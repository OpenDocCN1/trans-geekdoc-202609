    # SSDP Scan


    +   - The Simple Service Discovery Protocol (SSDP) is a network protocol that
    works in conjunction with the UPnP to detect plug and play devices

    +   - Vulnerabilities in UPnP may allow attackers to launch Buffer overflow or
