    # Scanning Beyond IDS and Firewall


    Intrusion detection systems (IDS) and firewalls are security mechanisms intended
    to prevent an attacker from accessing a network. However, even IDS and firewalls
    have some security limitations. Attackers try to launch attacks to exploit these
    limitations. This section highlights various IDS/firewall evasion techniques such
    as packet fragmentation, source routing, IP address spoofing, etc.'
