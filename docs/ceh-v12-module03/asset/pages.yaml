- pgno: 25
  md: '# LO#03: Demonstrate Various Scanning Techniques for Host Discovery


    ![](img/198108450322f24970ade227cbf24f47_25_0.png)


    # Host Discovery


    Scanning is the process of gathering information about systems that are “alive”
    and responding on the network. Host discovery is considered as the primary task
    in the network scanning process. To perform a complete scan and identify open
    ports and services, it is necessary to check for live systems. Host discovery
    provides an accurate status of the systems in the network, which enables an attacker
    to avoid scanning every port on every system in a list of IP addresses to identify
    whether the target host is up.


    Host discovery is the first step in network scanning. This section highlights
    how to check for live systems in a network using various ping scan techniques.
    It also discusses how to ping sweep a network to detect live hosts/systems along
    with various ping sweep tools.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Host Discovery Techniques


    Host discovery techniques are used to identify the active/live systems in the
    network


    ![](img/198108450322f24970ade227cbf24f47_26_0.png)


    # Host Discovery Techniques (Cont’d)


    ![](img/198108450322f24970ade227cbf24f47_26_1.png)


    | Scanning Technique | Nmap Command | Request | Response | Advantages |

    |---|---|---|---|---|

    | ARP Ping Scan | nmap -sn -PR <Target IP Address> | ARP request probe | ✓ ARP
    response - Host is active

    ✓ No response - Host is inactive | ✓ More efficient and accurate than other host
