- pgno: 60
  md: '# Idle Scan: Step 2.2 (Closed Port)


    Assume that the port on the target is closed. Subsequently, upon receiving the
    SYN packet from the attacker, the target responds with an RST packet, and the
    zombie remains idle thereafter.


    ![](img/198108450322f24970ade227cbf24f47_60_0.png)


    Figure 3.61: Port is closed


    +   - Step 3


    Now, follow step 1 again to probe the IPID number.


    ![](img/198108450322f24970ade227cbf24f47_60_1.png)


    Figure 3.62: Idle scan: step 3


    Send a SYN+ACK packet to the zombie, and it responds with an RST packet containing
    the IPID. Assuming that the port on the target was open and that the zombie has
    already sent an RST packet to the target, the IPID number is increased by 1. Now,
    the zombie responds with an RST packet to the attacker using its next IPID, i.e.,
    31339 (X + 2). Consequently, the IPID is increased by 2, which implies that the
    port on the target machine was open. Thus, using an idle scan, an attacker can
    identify the open ports and services on the target machine by spoofing their IP
    address with a zombie’s IP address.


    # UDP Scan


    # UDP Raw ICMP Port Unreachable Scanning


    UDP port scanners use the UDP protocol instead of TCP. There is no three-way handshake
    for the UDP scan. The UDP protocol can be more challenging to use than TCP scanning
    because you can send a packet but you cannot determine whether the host is alive,
    dead, or filtered. However, you can use one ICMP that checks for open or closed
    ports. If you send a UDP packet to a port without an application bound to it,
    the IP stack will return an ICMP port unreachable packet. If any port returns
    an ICMP error, it will be closed, leaving the ports that did not answer if they
    are open or filtered through the firewall.'
