- pgno: 126
  md: '# Banner Grabbing Countermeasures


    # Disabling or Changing Banner


    # Hiding File Extensions from Web Pages


    +   - Display **false banners** to mislead or deceive attackers

    +   - **Turn off unnecessary services** on the network host to limit the disclosure
    of information

    +   - Use server masking tools to disable or change banner information

    +   - For Apache 2.x with the `mod_headers` module, use a directive in the `httpd.conf`
    file to change the banner information header and set the server as `New Server
    Name`

    +   - Alternatively, change the `ServerSignature` line to `ServerSignature Off`
    in the `httpd.conf` file


    +   - File extensions reveal information about the **underlying server technology**
    that an attacker can utilize to launch attacks

    +   - Hide file extensions to **mask the web technologies**

    +   - Replace **application mappings** such as .asp with .htm or .foo, etc. to
    disguise the identities of servers

    +   - Apache users can use `mod_negotiation` directives

    +   - IIS users can use tools such as **PageXchanger** to manage the file extensions

    +   - It is preferable to not use file extensions at all


    ![](img/198108450322f24970ade227cbf24f47_126_0.png)


    # Banner Grabbing Countermeasures


    # Disabling or Changing Banner


    An open port indicates that a service/banner is running on it. When attackers
    connect to an open port using banner grabbing techniques, the system presents
    a banner containing sensitive information such as the OS, server type, and version.
    Using the information gathered, the attacker identifies specific vulnerabilities
    to exploit and then launches attacks. The countermeasures against banner grabbing
    attacks are as follows:


    +   - Display false banners to mislead or deceive attackers.

    +   - Turn off unnecessary services on the network host to limit information disclosure.

    +   - Use server masking tools to disable or change banner information.

    +   - Remove unnecessary HTTP headers and response data and camouflage the server
    by providing false signatures. This also provides the option of eliminating file
    extensions such as .asp and .aspx, which clearly indicate that the site is running
    on a Microsoft server.

    +   - For Apache 2.x with the `mod_headers` module, use a directive in the `httpd.conf`
    file to change the banner information header and set the server as `New Server
    Name`.

    +   - Alternatively, change the `ServerSignature` line to `ServerSignatureOff`
    in the `httpd.conf` file.

    +   - Disable the details of the vendor and version in the banners.

    +   - Modify the value of `Server Tokens` from `Full` to `Prod` in Apache’s `httpd.conf`
    file to prevent disclosure of the server version.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   - Modify the value of **RemoveServerHeader** from 0 to 1 in the **UrlScan.ini**
    config file found at **C: WindowsSystem32inetsrvUrlscan**. This method prevents
    disclosure of the server version.

    +   - Trick attackers by modifying the value of **AlternateServerName** to values
    such as **xyz** or **myserver**.

    +   - Disable HTTP methods such as Connect, Put, Delete, and Options from web
    application servers.

    +   - Remove the **X-Powered-By** header only with the **customHeaders** option
    in the **<system.webServer>** section of the **web.config** file.


    # Hiding File Extensions from Web Pages


    File extensions reveal information about the underlying server technology that
    an attacker can use to launch attacks. The countermeasures against such banner
    grabbing attacks are as follows:


    +   - Hide file extensions to mask the web technology.

    +   - Replace application mappings such as .asp with .htm, .foo, etc. to disguise
    the identities of servers.

    +   - Apache users can use **mod_negotiation** directives.

    +   - IIS users can use tools such as PageXchanger to manage the file extensions.


    **Note:** It is preferable to not use file extensions at all.'
