    to a probe, and closed ports are not even required to send an error packet.


    # UDP Packets


    Source: https://nmap.org


    When you send a packet to a closed UDP port, most of the hosts send an ICMP_PORT_UNREACH
    error. Thus, you can determine whether a port is open if UDP packets or ICMP errors
    are not guaranteed to arrive. Thus, UDP scanners of this type must implement retransmission
    of packets that appear lost. UDP scanners interpret lost traffic as open ports.
    In Zenmap, the -sU option is used to perform a UDP scan.


