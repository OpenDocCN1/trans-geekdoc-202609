- pgno: 7
  md: '# TCP Communication Flags


    ![](img/198108450322f24970ade227cbf24f47_7_0.png)


    Standard TCP communications are controlled by flags in the TCP packet header


    # TCP Communication Flags


    The TCP header contains various flags that control the transmission of data across
    a TCP connection. Six TCP control flags manage the connection between hosts and
    give instructions to the system. Four of these flags (SYN, ACK, FIN, and RST)
    govern the establishment, maintenance, and termination of a connection. The other
    two flags (PSH and URG) provide instructions to the system. The size of each flag
    is 1 bit. As there are six flags in the TCP Flags section, the size of this section
    is 6 bits. When a flag value is set to “1,” that flag is automatically turned
    on.


    ![](img/198108450322f24970ade227cbf24f47_7_1.png)


    Figure 3.2: TCP header format'
  merge: -1
  img_proc: true
- pgno: 8
  md: '![](img/198108450322f24970ade227cbf24f47_8_0.png)


    Figure 3.3: TCP communication flags


    # The following are the TCP communication flags:


    +   - **Synchronize or “SYN”**: It notifies the transmission of a new sequence
    number. This flag generally represents the establishment of a connection (three-way
    handshake) between two hosts.

    +   - **Acknowledgement or “ACK”**: It confirms the receipt of the transmission
    and identifies the next expected sequence number. When the system successfully
    receives a packet, it sets the value of its flag to “1,” thus implying that the
    receiver should pay attention to it.

    +   - **Push or “PSH”**: When it is set to “1,” it indicates that the sender has
    raised the push operation to the receiver; this implies that the remote system
    should inform the receiving application about the buffered data coming from the
    sender. The system raises the PSH flag at the start and end of data transfer and
    sets it on the last segment of a file to prevent buffer deadlocks.

    +   - **Urgent or “URG”**: It instructs the system to process the data contained
    in packets as soon as possible. When the system sets the flag to “1,” priority
    is given to processing the urgent data first and all the other data processing
    is stopped.

    +   - **Finish or “FIN”**: It is set to “1” to announce that no more transmissions
    will be sent to the remote system and the connection established by the SYN flag
    is terminated.

    +   - **Reset or “RST”**: When there is an error in the current connection, this
    flag is set to “1” and the connection is aborted in response to the error. Attackers
    use this flag to scan hosts and identify open ports.


    SYN scanning mainly deals with three flags: SYN, ACK, and RST. You can use these
    three flags for gathering illegitimate information from servers during enumeration.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '![](img/198108450322f24970ade227cbf24f47_9_0.png)


    # TCP/IP Communication


    TCP is connection oriented, i.e., it prioritizes connection establishment before
    data transfer between applications. This connection between protocols is possible
    through the three-way handshake.


    # A TCP session initiates using a three-way handshake mechanism:


    +   - To launch a TCP connection, the source (10.0.0.2:21) sends a SYN packet
    to the destination (10.0.0.3:21).

    +   - On receiving the SYN packet, the destination responds by sending a SYN/ACK
    packet back to the source.

    +   - The ACK packet confirms the arrival of the first SYN packet to the source.

    +   - Finally, the source sends an ACK packet for the ACK/SYN packet transmitted
    by the destination.

    +   - This triggers an "OPEN" connection, thereby allowing communication between
    the source and destination, which continues until one of them issues a "FIN" or
    "RST" packet to close the connection.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/198108450322f24970ade227cbf24f47_10_0.png)


    Figure 3.4: TCP session establishment


    The TCP protocol maintains stateful connections for all connection-oriented protocols
    throughout the Internet and works similarly to ordinary telephone communication,
    in which one picks up a telephone receiver, hears a dial tone, and dials a number
    that triggers ringing at the other end until someone picks up the receiver and
    says, “Hello.”


    # The system terminates the established TCP session as follows:


    After completing all the data transfers through the established TCP connection,
    the sender sends the connection termination request to the receiver through a
    FIN or RST packet. Upon receiving the connection termination request, the receiver
    acknowledges the termination request by sending an ACK packet to the sender and
    finally sends its own FIN packet. Then, the system terminates the established
    connection.'
  merge: -1
  img_proc: true
