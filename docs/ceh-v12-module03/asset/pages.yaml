- pgno: 101
  md: '# MAC Address Spoofing


    +   - The MAC address spoofing technique involves spoofing a MAC address with
    the MAC address of a legitimate user on the network.

    +   - Attackers use the --spoof-mac Nmap option to set a specific MAC address
    for the packets to evade firewalls.


    ![](img/198108450322f24970ade227cbf24f47_101_0.png)


    ![](img/198108450322f24970ade227cbf24f47_101_1.png)


    # MAC Address Spoofing


    Network firewalls filter packets based on the source media access control (MAC)
    address. They examine the MAC address in the packet header and determine whether
    the packets originate from a legitimate source. Firewalls allow traffic from specific
    sources using MAC filtering rules and restrict packets that do not satisfy the
    filtering rules. To avoid these restrictions, attackers use MAC spoofing techniques,
    in which they employ fake MAC addresses and masquerade as legitimate users to
    scan the hosts located behind the firewall.


    The MAC address spoofing technique allows attackers to send request packets to
    the target machine/network, pretending to be a legitimate host. Attackers use
    the Nmap tool to evade firewalls via MAC address spoofing.


    # Performing MAC Address Spoofing to Scan Beyond IDS and Firewall Using Nmap:


    Attackers use the --spoof-mac Nmap option to choose or set a specific MAC address
    for packets and send them to the target system/network.


    ```

    nmap -sT -Pn --spoof-mac 0 [Target IP]

    ```


    The above command automatically generates a random MAC address and attaches it
    to the packets in place of the original MAC address while performing host scanning.
    Here, --spoof-mac 0 represents the randomization of the MAC address.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/198108450322f24970ade227cbf24f47_102_0.png)


    Figure 3.89: Screenshot of scanning using the Nmap –spoof-mac 0 option


    +   - `nmap -sT -Pn --spoof-mac [Vendor] [Target IP]`


    The above command allows attackers to opt for a MAC address from the vendor and
    spoof it by attaching it to the packets in place of the original MAC address during
    the scan. This type of scan allows attackers to scan in the hidden mode, as the
    original MAC address is not recorded in the firewall logs. --spoof-mac [vendor]
    represents the randomization of the MAC address based on the specified vendor.


    ![](img/198108450322f24970ade227cbf24f47_102_1.png)


    Figure 3.90: Scanning using the Nmap –spoof-mac [Vendor] option'
  merge: -1
