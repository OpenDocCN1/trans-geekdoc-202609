- pgno: 129
  md: '# IP Spoofing Detection Techniques: TCP Flow Control Method


    +   - Attackers sending spoofed TCP packets will not receive the **target''s SYN-ACK
    packets**

    +   - Therefore, attackers cannot respond to a change in the congestion window
    size

    +   - When received traffic continues after a window size is exhausted, the **packets
    are most likely spoofed**


    ![](img/198108450322f24970ade227cbf24f47_129_0.png)


    # IP Spoofing Detection Techniques


    # Direct TTL Probes


    In this technique, you initially send a packet (ping request) to the legitimate
    host and wait for a reply. Check whether the TTL value in the reply matches with
    that of the packet you are checking. Both will have the same TTL if they are using
    the same protocol. Although the initial TTL values vary according to the protocol
    used, a few initial TTL values are commonly used. For TCP/UDP, the values are
    64 and 128; for ICMP, they are 128 and 255.


    ![](img/198108450322f24970ade227cbf24f47_129_1.png)


    Figure 3.106: IP Spoofing detection technique: Direct TTL Probes


    If the reply is from a different protocol, then you should check the actual hop
    count to detect the spoofed packets. Deduct the TTL value in the reply from the
    initial TTL value to determine the hop count. The packet is a spoofed packet if
    the reply TTL does not match the TTL of the packet. It will be very easy to launch
    an attack if the attacker knows the hop count between the source and the host.
    In this case, the test result is a false negative.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'This technique is successful when the attacker is in a different subnet from
    that of the victim.


    Note: Normal traffic from one host can contrast TTLs depending on traffic patterns.


    # IP Identification Number


    Users can identify spoofed packets by monitoring the IP identification (IPID)
    number in the IP packet headers. The IPID increases incrementally each time a
    system sends a packet. Every IP packet on the network has a unique "IP identification"
    number, which is increased by one for every packet transmission. To identify whether
    a packet is spoofed, send a probe packet to the source IP address of the packet
    and observe the IPID number in the reply. The IPID value in the response packet
    must be close to but slightly greater than the IPID value of the probe packet.
    The source address of the IP packet is spoofed if the IPID of the response packet
    is not close to that of the probe packet.


    This method is effective even when both the attacker and the target are on the
    same subnet.


    ![](img/198108450322f24970ade227cbf24f47_130_0.png)


    Figure 3.107: IP Spoofing detection technique: IP Identification Number


    # TCP Flow Control Method


    The TCP can optimize the flow control on both the sender’s and the receiver’s
    end with its algorithm. The algorithm accomplishes flow control using the sliding
    window principle. The user can control the flow of IP packets by the window size
    field in the TCP header. This field represents the maximum amount of data that
    the recipient can receive and the maximum amount of data that the sender can transmit
    without acknowledgement. Thus, this field helps to control data flow. The sender
    should stop sending data whenever the window size is set to zero.


    In general flow control, the sender should stop sending data once the initial
    window size is exhausted. The attacker, who is unaware of the ACK packet containing
    window size information, might continue to send data to the victim. If the victim
    receives data packets beyond the window size, they are spoofed packets. For effective
    flow control and early detection of spoofing, the initial window size must be
    very small.


    Most spoofing attacks occur during the handshake, as it is challenging to build
    multiple spoofing replies with the correct sequence number. Therefore, apply the
    flow control spoofed packet detection method to the handshake. In a TCP handshake,
    the host sending'
  merge: -1
