    # Service Version Discovery


    Every port is assigned a specific service, and every service has its own version.
    Some versions of the protocols are insecure, and they can allow attackers to compromise
    the machine by exploiting this vulnerability. Service version detection helps
    attackers to obtain information about the running services and their versions
    on a target system. By obtaining accurate service version numbers, an attacker
    can determine which exploits the target system is vulnerable to.


    The version detection technique is nothing but examination of the TCP and UDP
    ports. The probes from the Nmap service-probes database are used for querying
    various services and matching expressions for recognizing and parsing responses.
    In Zenmap, the -sV option is used to detect service versions.'
