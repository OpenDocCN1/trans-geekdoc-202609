    # TCP Connect/Full-Open Scan


    Source: https://insecure.org


    TCP Connect/Full Open Scan is one of the most reliable forms of TCP scanning.
    In TCP Connect scanning, the OS’s TCP connect() system call tries to open a connection
    to every port of interest on the target machine. If the port is listening, the
    connect() call will result in a successful connection with the host on that particular
    port; otherwise, it will return an error message stating that the port is not
    reachable.


    TCP Connect scan completes a three-way handshake with the target machine. In the
    TCP three-way handshake, the client sends a SYN packet, which the recipient acknowledges
    with a SYN+ACK packet. Then, the client acknowledges the SYN+ACK packet with an
    ACK packet to complete the connection. Once the handshake is completed, the scanner
    sends an RST packet to end the connection.


    ![](img/198108450322f24970ade227cbf24f47_47_0.png)


    Figure 3.33: Scan result when a port is open


    ![](img/198108450322f24970ade227cbf24f47_47_1.png)


    Figure 3.34: Scan result when a port is closed'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Making a separate connect() call for every targeted port in a linear manner
    would take a long time over a slow connection. The attacker can accelerate the
    scan using many sockets in parallel. Using non-blocking, I/O allows the attacker
    to set a short time-out period and watch all the sockets simultaneously. In Zenmap,
    the -sT option is used to perform TCP Connect/full open scan.


    ![](img/198108450322f24970ade227cbf24f47_48_0.png)


    Figure 3.35: TCP Connect/Full Open scan using Zenmap


    The drawback of this type of scan is that it is easily detectable and filterable.
    The logs in the target system will disclose the connection. Such scanning does
    not require superuser privileges.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Stealth Scan (Half-Open Scan)


    The stealth scan involves resetting the TCP connection between the client and
    the server abruptly before completion of the three-way handshake signals, hence
    making the connection half-open. A stealth scan sends a single frame to a TCP
    port without any TCP handshaking or additional packet transfers. This type of
    scan sends a single frame with the expectation of a single response. The half-open
    scan partially opens a connection but stops halfway through. The stealth scan
    is also called a “SYN scan,” because it only sends the SYN packet. This prevents
    the service from notifying the incoming connection. TCP SYN or half-open scanning
    is a stealth method of port scanning.


    The stealth scan also implements the three-way handshake methodology. In the last
    stage, it examines the packets entering the interface and terminates the connection
    before triggering a new initialization to identify remote ports. The stealth scan
    process is described below.


    +   - The client sends a single SYN packet to the server on the appropriate port.

    +   - If the port is open, the server subsequently responds with a SYN/ACK packet.

    +   - If the server responds with an RST packet, then the remote port is in the
    "closed" state.

    +   - The client sends the RST packet to close the initiation before a connection
    can be established.


    ![](img/198108450322f24970ade227cbf24f47_49_0.png)


    Figure 3.36: Port is open


    ![](img/198108450322f24970ade227cbf24f47_49_1.png)


    Figure 3.37: Port is closed


    Attackers use stealth scanning techniques to bypass firewall rules and logging
    mechanisms, and they hide themselves as usual under network traffic. In Zenmap,
    the -sS option is used to perform a stealth scan/TCP half-open scan.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/198108450322f24970ade227cbf24f47_50_0.png)


    Figure 3.38: TCP Stealth/Half Open scan using Zenmap


    # Inverse TCP Flag Scan


    Attackers send TCP probe packets with a TCP flag (FIN, URG, PSH) set or with no
    flags. When the port is open, the attacker does not get any response from the
    host, whereas when the port is closed, he or she receives the RST from the target
    host.


    ![](img/198108450322f24970ade227cbf24f47_50_1.png)


    Figure 3.39: Inverse TCP flag scan when port is open'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/198108450322f24970ade227cbf24f47_51_0.png)


    Figure 3.40: Inverse TCP flag scan when port is closed


    Security mechanisms such as firewalls and IDS detect the SYN packets sent to the
    sensitive ports of the targeted hosts. Programs such as Syslog are available to
    log half-open SYN flag scan attempts. At times, the probe packets enabled with
    TCP flags can pass through filters undetected, depending on the security mechanisms
    installed.


    An inverted technique involves probing a target using a half-open SYN flag because
    the closed ports can only send the response back. According to RFC 793, an RST/ACK
    packet is sent for connection reset when the host closes a port. Attackers take
    advantage of this feature to send TCP probe packets to each port of the target
    host with various TCP flags set.


    Common flag configurations used for a probe packet include:


    +   - A FIN probe with the FIN TCP flag set

    +   - An Xmas probe with the FIN, URG, and PUSH TCP flags set

    +   - A NULL probe with no TCP flags set

    +   - A SYN/ACK probe


    All closed ports on the targeted host will send an RST/ACK response. Since OSs
    such as Windows completely ignore the RFC 793 standard, you cannot see the RST/ACK
    response when connected to a closed port on the target host. However, this technique
    is effective when used with UNIX-based OSs.


    # Advantages


    +   - Avoids many IDS and logging systems; highly stealthy


    # Disadvantages


    +   - Requires raw access to network sockets and super-user privileges

    +   - Mostly effective against hosts using a BSD-derived TCP/IP stack (not effective
    against Microsoft Windows hosts, in particular).


    Note: Inverse TCP flag scanning is known as FIN, URG, and PSH scanning based on
    the flag set in the probe packet. If there is no flag set, it is known as NULL
    scanning. If only the FIN flag is set, it is known as FIN scanning, and if all
    of FIN, URG, and PSH are set, it is known as Xmas scanning.


    # Xmas Scan


    Xmas scan is a type of inverse TCP scanning technique with the FIN, URG, and PUSH
    flags set to send a TCP frame to a remote device. If the target has opened the
    port, then you will receive no response from the remote system. If the target
    has closed the port, then you will receive a remote'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'system reply with an RST. You can use this port scanning technique to scan
    large networks and find which host is up and what services it is offering. This
    technique describes all TCP flag sets. When all flags are set, some systems hang;
    hence, the flags are often set in the nonsense pattern URG-PSH-FIN. Attackers
    use the TCP Xmas scan to determine if ports are closed on the target machine via
    the RST packet. This scan only works when systems are compliant with RFC 793-based
    TCP/IP implementation. It will not work against any current version of Microsoft
    Windows.


    ![](img/198108450322f24970ade227cbf24f47_52_0.png)


    Figure 3.41: Xmas scan when the port is open


    ![](img/198108450322f24970ade227cbf24f47_52_1.png)


    Figure 3.42: Xmas scan when the port is closed


    # BSD Networking Code


    This method relies on the BSD networking code. Thus, you can use this only for
    UNIX hosts; it does not support Windows NT. If the user scans any Microsoft system,
    it will show that all the ports on the host are open.


    # Transmitting Packets


    You can initialize all the flags when transmitting the packet to a remote host.
    If the target system accepts the packet and does not send any response, it means
    that the port is open. If the target system sends an RST flag, then it implies
    that the port is closed.


    # Advantages


    +   - It avoids IDS and TCP three-way handshake.


    # Disadvantages


    +   - It works on the UNIX platform only.


    In Zenmap, the -sX option is used to perform Xmas scan whereas the -sF and -sN
    options are used to perform FIN scan and NULL scan, respectively.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/198108450322f24970ade227cbf24f47_53_0.png)


    Figure 3.43: Xmas scan output using Zenmap


    # TCP Maimon Scan


    This scan technique is very similar to NULL, FIN, and Xmas scan, but the probe
    used here is FIN/ACK. In most cases, to determine if the port is open or closed,
    the RST packet should be generated as a response to a probe request. However,
    in many BSD systems, the port is open if the packet gets dropped in response to
    a probe.


    Nmap interprets a port as open|filtered when there is no response from the Maimon
    scan probe even after many retransmissions. The port is closed if the probe gets
    a response as an RST packet. The port is filtered when the ICMP unreachable error
    (type 3, code 1, 2, 3, 9, 10, or 13) is returned from the target host. In Zenmap,
    the -sM option is used to perform the TCP Maimon scan.


    ![](img/198108450322f24970ade227cbf24f47_53_1.png)


    Figure 3.44: TCP Maimon scan result of open port'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/198108450322f24970ade227cbf24f47_54_0.png)


    Figure 3.45: TCP Maimon scan result of closed port


    ![](img/198108450322f24970ade227cbf24f47_54_1.png)


    Figure 3.46: TCP Maimon scan result of filtered port


    ![](img/198108450322f24970ade227cbf24f47_54_2.png)


    Figure 3.47: TCP Maimon scan displaying port state in Zenmap


    # ACK Flag Probe Scan


    Attackers send TCP probe packets with the ACK flag set to a remote device and
    then analyze the header information (TTL and WINDOW field) of the received RST
    packets to find out if the port is open or closed. The ACK flag probe scan exploits
    the vulnerabilities within the BSD-derived TCP/IP'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'stack. Thus, such scanning is effective only on those OSs and platforms on
    which the BSD derives TCP/IP stacks.


    Categories of ACK flag probe scanning include:


    # TTL-Based ACK Flag Probe scanning


    In this scanning technique, you will first need to send ACK probe packets (several
    thousands) to different TCP ports and then analyze the TTL field value of the
    RST packets received. In Zenmap, the syntax nmap -ttl [time] [target] is used
    to perform TTL-based scan.


    ![](img/198108450322f24970ade227cbf24f47_55_0.png)


    Figure 3.48: TTL-based ACK flag probe scanning


    If the TTL value of the RST packet on a particular port is less than the boundary
    value of 64, then that port is open. An example showing a log of the first four
    RST packets received is presented below:


    ```

    1: host 10.2.2.11 port 20: F:RST -> ttl: 80 win: 0

    2: host 10.2.2.11 port 21: F:RST -> ttl: 80 win: 0

    3: host 10.2.2.11 port 22: F:RST -> ttl: 50 win: 0

    4: host 10.2.2.11 port 23: F:RST -> ttl: 80 win: 0

    ```


    Figure 3.49: Screenshot showing the open port based on the TTL value of the RST
    packet


    In this example, port 22 returned a TTL value of 50, which is less than 64; all
    other ports returned a TTL value of 80, which is greater than 64. Therefore, port
    22 is open.


    # Window-Based ACK Flag Probe scanning


    In this scanning technique, you will first need to send ACK probe packets (several
    thousands) to different TCP ports and then analyze the window field value of the
    received RST packets. The user can use this scanning technique when all the ports
    return the same TTL value. In Zenmap, the -sW option is used to perform a window
    scan.


    ![](img/198108450322f24970ade227cbf24f47_55_1.png)


    Figure 3.50: Window-based ACK flag probe scanning


    If the window value of the RST packet on a particular port is non-zero, then that
    port is open. An example showing a log of the first four RST packets received
    is presented below:'
  merge: -1
  img_proc: true
- pgno: 56
  md: '```

    1: host 10.2.2.12 port 20: F:RST -> ttl: 64 win: 0

    2: host 10.2.2.12 port 21: F:RST -> ttl: 64 win: 0

    3: host 10.2.2.12 port 22: F:RST -> ttl: 64 win: 512

    4: host 10.2.2.12 port 23: F:RST -> ttl: 64 win: 0

    ```


    Figure 3.51: Screenshot showing the open port based on the window value of the
    RST packet


    The above figure shows that the TTL value returned for each packet is the same;
    hence, you cannot perform TTL-based ACK flag probe scanning to find the open ports.
    Therefore, when you observe the window value, the third packet has a non-zero
    window value, which means that the port is open. When the returned RST value is
    zero, then the port is closed. If there is no response even after many retransmissions
    and an ICMP unreachable error (type 3, code 1, 2, 3, 9, 10, or 13) is returned,
    then the port is inferred to be a filtered port.


    ![](img/198108450322f24970ade227cbf24f47_56_0.png)


    Figure 3.52: TCP Window scan result of an open port


    ![](img/198108450322f24970ade227cbf24f47_56_1.png)


