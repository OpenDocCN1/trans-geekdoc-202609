- pgno: 18
  md: '# Hping Commands


    The various Hping commands are as follows:


    # ICMP ping


    ```

    Ex. hping3 -1 10.0.0.25

    ```


    A ping sweep or Internet Control Message Protocol (ICMP) scanning is a process
    of sending an ICMP request or ping to all the hosts on the network to determine
    the ones that are up.


    The OS, router, switch, and IP-based devices use this protocol via the ping command
    for echo request and echo response as a connectivity tester between different
    hosts.


    Hping performs an ICMP ping scan by specifying the argument -1 in the command
    line. You may use --ICMP or -1 as the argument in the command line. By issuing
    the above command, hping sends an ICMP echo request to 10.0.0.25 and receives
    an ICMP reply similarly to a ping utility.


    # ACK scan on port 80


    ```

    Ex. hping3 -A 10.0.0.25 -p 80

    ```


    This scanning technique can be used to probe the existence of a firewall and its
    rule sets. Simple packet filtering allows the establishment of a connection (packets
    with the ACK bit set), whereas a sophisticated stateful firewall does not allow
    the establishment of a connection.


    Hping can be configured to perform an ACK scan by specifying the argument -A in
    the command line. Here, you set the ACK flag in the probe packets and perform
    the scan. You perform this scan when a host does not respond to a ping request.
    By issuing this command, Hping checks if a host is alive on a network. If it finds
    a live host and an open port, it returns an RST response.


    # UDP scan on port 80


    ```

    Ex. hping3 -2 10.0.0.25 -p 80

    ```


    Hping uses TCP as its default protocol. Using the argument -2 in the command line
    specifies that Hping operates in the UDP mode. You may use either --udp or -2
    as the argument in the command line.


    By issuing the above command, Hping sends UDP packets to port 80 on the host (10.0.0.25).
    It returns an ICMP port unreachable message if it finds the port closed and does
    not return a message if the port is open.


    # Collecting Initial Sequence Number


    ```

    Ex. hping3 192.168.1.103 -Q -p 139

    ```


    Using the argument -Q in the command line, Hping collects all the TCP sequence
    numbers generated by the target host (192.168.1.103).'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Firewalls and Timestamps


    ```

    hping3 -S 72.14.207.99 -p 80 --tcp-timestamp

    ```


    Many firewalls drop those TCP packets that do not have the TCP Timestamp option
    set. By adding the --tcp-timestamp argument in the command line, you can enable
    the TCP timestamp option in Hping and try to guess the timestamp update frequency
    and uptime of the target host (72.14.207.99).


    # SYN scan on port 50-60


    ```

    hping3 -8 50-60 -S 10.0.0.25 -v

    ```


    Using the argument -8 or --scan in the command line, you are operating Hping in
    the scan mode to scan a range of ports on the target host. Adding the argument
    -S allows you to perform a SYN scan.


    Therefore, the above command performs a SYN scan on ports 50–60 on the target
    host.


    # FIN, PUSH and URG scan on port 80


    ```

    hping3 -F -P -U 10.0.0.25 -p 80

    ```


    By adding the arguments -F, -P, and -U in the command line, you are setting FIN,
    PUSH, and URG packets in the probe packets. By issuing this command, you are performing
    FIN, PUSH, and URG scans on port 80 on the target host (10.0.0.25). If port 80
    is open, you will not receive a response. If the port is closed, Hping will return
    an RST response.


    # Scan entire subnet for live host


    ```

    hping3 -1 10.0.1.x --rand-dest -I eth0

    ```


    By issuing this command, Hping performs an ICMP ping scan on the entire subnet
    10.0.1.x; in other words, it sends an ICMP echo request randomly (--rand-dest)
    to all the hosts from 10.0.1.0 to 10.0.1.255 that are connected to the interface
    eth0. The hosts whose ports are open will respond with an ICMP reply. In this
    case, you have not set a port; hence, Hping sends packets to port 0 on all IP
    addresses by default.


    # Intercept all traffic containing HTTP signature


    ```

    hping3 -9 HTTP -I eth0

    ```


    The argument -9 will set the Hping to the listen mode. Hence, by issuing the command
    -9 HTTP, Hping starts listening on port 0 (of all the devices connected in the
    network to interface eth0), intercepts all the packets containing the HTTP signature,
    and dumps from the signature end to the packet''s end.


    # SYN flooding a victim


    ```

    hping3 -S 192.168.1.1 -a 192.168.1.254 -p 22 --flood

    ```


    The attacker employs TCP SYN flooding techniques using spoofed IP addresses to
    perform a DoS attack.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Metasploit


    Source: https://www.metasploit.com


    Metasploit is an open-source project that provides the infrastructure, content,
    and tools to perform penetration tests and extensive security auditing. It provides
    information about security vulnerabilities and aids in penetration testing and
    IDS signature development. It facilitates the tasks of attackers, exploits writers,
    and payload writers. A major advantage of the framework is the modular approach,
    i.e., allowing the combination of any exploit with any payload.


    It enables you to automate the process of discovery and exploitation and provides
    you with the necessary tools to perform the manual testing phase of a penetration
    test. You can use Metasploit Pro to scan for open ports and services, exploit
    vulnerabilities, pivot further into a network, collect evidence, and create a
    report of the test results.


    ![](img/198108450322f24970ade227cbf24f47_20_0.png)


    Figure 3.10: Screenshot displaying various Metasploit port scan modules


    # NetScanTools Pro


    Source: https://www.netscantools.com


    NetScanTools Pro is an investigation tool that allows you to troubleshoot, monitor,
    discover, and detect devices on your network. Using this tool, you can easily
    gather information about the local LAN as well as Internet users, IP addresses,
    ports, and so on. Attackers can find vulnerabilities and exposed ports in the
    target system. It helps the attackers to list IPv4/IPv6 addresses, hostnames,
    domain names, email addresses, and URLs automatically or manually (using manual
    tools). NetScanTools Pro combines many network tools and utilities categorized
    by their functions, such as active, passive, DNS, and local computer.'
