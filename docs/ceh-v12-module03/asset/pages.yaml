- pgno: 89
  md: '# IDS/Firewall Evasion Techniques


    Though firewalls and IDSs can prevent malicious traffic (packets) from entering
    a network, attackers can manage to send intended packets to the target by evading
    an IDS or firewall through the following techniques:


    +   1. Packet Fragmentation

    +   2. Source Routing

    +   3. Source Port Manipulation

    +   4. IP Address Decoy

    +   5. IP Address Spoofing

    +   6. MAC Address Spoofing

    +   7. Creating Custom Packets

    +   8. Randomizing Host Order and Sending Bad Checksums

    +   9. Proxy Servers

    +   10. Anonymizers


    # IDS/Firewall Evasion Techniques


    Although firewalls and IDS can prevent malicious traffic (packets) from entering
    a network, attackers can send intended packets to the target that evade the IDS/firewall
    by implementing the following techniques:


    +   - Packet Fragmentation

    +   - Source Routing

    +   - Source Port Manipulation

    +   - IP Address Decoy

    +   - IP Address Spoofing

    +   - MAC Address Spoofing

    +   - Creating Custom Packets

    +   - Randomizing Host Order

    +   - Sending Bad Checksums

    +   - Proxy Servers

    +   - Anonymizers'
  merge: -1
