    ✓ Useful for system discovery, where one may need to scan large address spaces
    |

    | UDP Ping Scan | nmap -sn -PU <Target IP Address> | UDP request | ✓ UDP response
    - Host is active

    ✓ Error messages (host/network unreachable or TTL exceeded) - Host is inactive
    | ✓ Detects systems behind firewalls with strict TCP filtering |

    | ICMP ECHO Ping Scan | nmap -sn -PE <Target IP Address> | ICMP ECHO request |
    ✓ ICMP ECHO reply - Host is active

    ✓ No response - Host is inactive | ✓ Useful for locating active devices or determining
    if the ICMP message passes through a firewall

    **Disadvantage:**

    ✓ Does not work on Windows-based networks |'
