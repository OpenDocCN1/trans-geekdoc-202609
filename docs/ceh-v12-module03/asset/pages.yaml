- pgno: 132
  md: '# IP Spoofing Countermeasures


    +   1. **Encrypt all the network traffic** using cryptographic network protocols
    such as IPsec, TLS, SSH, and HTTPS

    +   2. **Use multiple firewalls** to provide a multi-layered depth of protection

    +   3. Do not rely on **IP-based authentication**

    +   4. **Use a random initial sequence number** to prevent IP spoofing attacks
    based on sequence number spoofing

    +   5. **Ingress Filtering**: Use routers and firewalls at your network perimeter
    to filter incoming packets that appear to come from an internal IP address

    +   6. **Egress Filtering**: Filter all outgoing packets with an invalid local
    IP address as the source address


    # IP Spoofing Countermeasures


    As mentioned previously, IP spoofing is a technique adopted by a hacker to break
    into a target network. Therefore, to protect the network from external hackers,
    IP spoofing countermeasures should be applied in network security settings. Some
    IP spoofing countermeasures that can be applied are as follows:


    # Avoid Trust Relationships


    Do not rely on IP-based authentication. Attackers may masquerade as trusted hosts
    and send malicious packets. If these packets are accepted under the assumption
    that they are “clean” because they are from a trusted host, malicious code will
    infect the system. Therefore, it is advisable to test all packets, even when they
    originate from a trusted host. This problem can be avoided by implementing password
    authentication along with trust relationship–based authentication.


    # Use Firewalls and Filtering Mechanisms


    As stated above, all incoming and outgoing packets should be filtered to avoid
    attacks and loss of sensitive information. A firewall can restrict malicious packets
    from entering a private network and prevent severe data loss. Access-control lists
    (ACLs) can be used to block unauthorized access. However, the possibility of an
    insider attack also exists. Inside attackers can send sensitive information about
    the business to competitors, which could lead to financial loss and other issues.
    Another risk of outgoing packets is that an attacker may succeed in installing
    a malicious sniffing program running in a hidden mode on the network. These programs
    gather and send all the network information to the attacker without any notification
    after filtering out the outgoing packets. Therefore, the scanning of outgoing
    packets must be assigned the same importance as that of incoming packets.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Use Random Initial Sequence Numbers


    Most devices choose their initial sequence numbers (ISNs) based on timed counters.
    This makes the ISNs predictable, as it is easy for an attacker to determine the
    concept of generating an ISN. The attacker can determine the ISN of the next TCP
    connection by analyzing the ISN of the current session or connection. If the attacker
    can predict the ISN, then they can establish a malicious connection to the server
    and sniff network traffic. To avoid this risk, use random ISNs.


    # Ingress Filtering


    Ingress filtering prevents spoofed traffic from entering the Internet. It is applied
    to routers because it enhances the functionality of the routers and blocks spoofed
    traffic. Configuring and using ACLs that drop packets with a source address outside
    the defined range is one method of implementing ingress filtering.


    # Egress Filtering


    Egress filtering is a practice that aims to prevent IP spoofing by blocking outgoing
    packets with a source address from the outside.


    # Use Encryption


    To maximize network security, use strong encryption for all traffic placed on
    transmission media without considering its type and location. This is the best
    method to prevent IP spoofing attacks. IPSec can be used to drastically reduce
    the IP spoofing risk, as it provides data authentication, integrity, and confidentiality.
    Encryption sessions should be enabled on the router so that trusted hosts can
    communicate securely with local hosts. Attackers tend to focus on targets that
    are easy to compromise. If an attacker desires to break into an encrypted network,
    they must decrypt the entire slew of encrypted packets, which is a difficult task.
    Therefore, an attacker is likely to move on and attempt to find another target
    that is easy to compromise or simply abort the attempt. Moreover, use the latest
    encryption algorithms that provide strong security.


    # SYN Flooding Countermeasures


    Countermeasures against SYN flooding attacks can also help avoid IP spoofing attacks.


    # Other IP Spoofing Countermeasures


    +   - Enhance the integrity and confidentiality of websites by migrating from
    IPv4 to IPv6 during development.

    +   - Implement digital certificate authentication mechanisms such as domain and
    two-way auth certificate verification.

    +   - Use a secure VPN while accessing any type of public Internet service such
    as free Wi-Fi and hotspots.

    +   - Employ application-specific mitigation devices such as Behemoth scrubbers
    for deep-level packet investigation at a high speed of nearly 100 million packets/s.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - Implement dynamic IPv6 address variation using a random address generator
    to reduce the time of active vulnerability.

    +   - Configure routers to send encoded information about fragmented packets entering
    the network.

    +   - Configure routers to verify the data packets using their signatures by storing
    the arriving data packet digests.

    +   - Configure routers to hide intranet hosts from the external network by implementing
