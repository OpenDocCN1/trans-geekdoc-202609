- pgno: 96
  md: '# IP Address Decoy


    +   - IP address decoy technique refers to generating or manually specifying the
    IP addresses of decoys in order to evade an IDS or firewall

    +   - It appears to the target that the decoys as well as the host(s) are scanning
    the network

    +   - This technique makes it difficult for the IDS or firewall to determine which
    IP address was actually scanning the network and which IP addresses were decoys


    # Decoy Scanning using Nmap


    Nmap has two options for decoy scanning:


    +   - `nmap -D RND:10 [target]`

    +     (Generates a random number of decoys)

    +   - `nmap -D decoy1,decoy2,decoy3,.. etc.`

    +     (Manually specify the IP addresses of the decoys)


    ![](img/198108450322f24970ade227cbf24f47_96_0.png)


    # IP Address Decoy


    The IP address decoy technique refers to generating or manually specifying IP
    addresses of the decoys to evade IDS/firewalls. It appears to the target that
    the decoys as well as the host(s) are scanning the network. This technique makes
    it difficult for the IDS/firewall to determine which IP address is actually scanning
    the network and which IP addresses are decoys.


    The Nmap scanning tool comes with a built-in scan function called a decoy scan,
    which cloaks a scan with decoys. This technique generates multiple IP addresses
    to perform a scan, thus making it difficult for the target security mechanisms
    such as IDS, firewalls, etc., to identify the original source from the registered
    logs. The target IDS might report scanning from 5– 0 IP addresses; however, it
    cannot differentiate between the actual scanning IP address and the innocuous
    decoy IPs.


    You can perform two types of decoy scans using Nmap:


    **nmap -D RND:10 [target]**


    Using this command, Nmap automatically generates a random number of decoys for
    the scan and randomly positions the real IP address between the decoy IPs.


    Ex. Assume that 10.10.10.10 is the target IP address to be scanned. Thus, the
    Nmap decoy scan command will be:


    ```

    # nmap -D RND: 10 10.10.10.10

    ```'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/198108450322f24970ade227cbf24f47_97_0.png)


    Figure 3.86: Decoy using Nmap RND option


    +   - nmap -D decoy1,decoy2,decoy3,...,ME,... [target]


    Using this command, you can manually specify the IP addresses of the decoys to
    scan the victim’s network. Here, you have to separate each decoy IP with a comma
    (,) and you can optionally use the ME command to position your real IP in the
    decoy list. If you place ME in the 4th position of the command, your real IP will
    be positioned at the 4th position accordingly. This is an optional command, and
    if you do not mention ME in your scan command, then Nmap will automatically place
    your real IP in any random position.


    For example, assume that 10.10.1.19 is the real source IP and 10.10.1.11 is the
    target IP address to be scanned. Then, the Nmap decoy command will be:


    Syntax:


    ```

    # nmap -D 192.168.0.1,172.120.2.8,192.168.2.8,10.10.1.19,10.10.1.5 10.10.1.11

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/198108450322f24970ade227cbf24f47_98_0.png)


    # Figure 3.87: Decoy using Nmap with manual decoy list


    These decoys can be generated in both initial ping scans such as ICMP, SYN, ACK,
    etc., and during the actual port scanning phase.


    IP address decoy is a useful technique for hiding your IP address. However, it
    will not be successful if the target employs active mechanisms such as router
    path tracing, response dropping, etc. Moreover, using many decoys can slow down
    the scanning process and affect the accuracy of the scan.'
