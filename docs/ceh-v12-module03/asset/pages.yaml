    ✓ No response - Host is inactive | ✓ Maximizes the chances of bypassing the firewall
    |

    | IP Protocol Ping Scan | nmap -sn -PO <Target IP Address> | IP ping requests
    using different IP protocols (ICMP, IGMP, TCP, and UDP) | ✓ Any response - Host
    is active

    ✓ No response - Host is inactive | ✓ Sends different packets using different IP
    protocols in the hope of receiving a response indicating that a host is online
    |


    ![](img/198108450322f24970ade227cbf24f47_27_0.png)


    # Host Discovery Techniques


    Host discovery techniques can be adopted to discover the active/live hosts in
    the network. As an ethical hacker, you must be aware of the various types of host
    discovery techniques. Some host discovery techniques are listed below:


    +   - ARP Ping Scan

    +   - UDP Ping Scan'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - ICMP Ping Scan

    +     - ICMP ECHO Ping

    +       - ICMP ECHO Ping Sweep

    +     - ICMP Timestamp Ping

    +     - ICMP Address Mask Ping

    +   - TCP Ping Scan

    +     - TCP SYN Ping

    +     - TCP ACK Ping

    +   - IP Protocol Scan


    # ARP Ping Scan


    In the ARP ping scan, the ARP packets are sent for discovering all active devices
    in the IPv4 range even though the presence of such devices is hidden by restrictive
    firewalls. In most networks, many IP addresses are unused at any given time, specifically
    in the private address ranges of the LAN. Hence, when the attackers try to send
    IP packets such as ICMP echo request to the target host, the OS must determine
    the hardware destination address (ARP) corresponding to the target IP for addressing
    the ethernet frame correctly. For this purpose, a series of ARP requests are issued.
    ARP scan is used to show the MAC address of the network interface on the device,
    and it can also show the MAC addresses of all devices sharing the same IPv4 address
    on the LAN. If the host IP with the respective hardware destination address is
    active, then the ARP response will be generated by the host; otherwise, after
    a certain number of ping attempts, the original OS gives up on the host. In other
    words, when attackers send ARP request probes to the target host, if they receive
    any ARP response, then the host is active. In case the destination host is found
    to be unresponsive, the source host adds an incomplete entry to the destination
    IP in its kernel ARP table.


    Attackers use the Nmap tool to perform ARP ping scan for discovering live hosts
    in the network. In Zenmap, the -PR option is used to perform ARP ping scan.


    Note: -sn is the Nmap command to disable the port scan. Since Nmap uses ARP ping
    scan as the default ping scan, to disable it and perform other desired ping scans,
    you can use --disable-arp-ping.


    ![](img/198108450322f24970ade227cbf24f47_28_0.png)


    Figure 3.15: ARP ping scan'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Advantages:


    +   - ARP ping scan is considered to be more efficient and accurate than other
    host discovery techniques

    +   - ARP ping scan automatically handles ARP requests, retransmission, and timeout
    at its own discretion

    +   - ARP ping scan is useful for system discovery, where you may need to scan
    large address spaces

    +   - ARP ping scan can display the response time or latency of a device to an
    ARP packet


    ![](img/198108450322f24970ade227cbf24f47_29_0.png)


    Figure 3.16: ARP scan in Zenmap


    # UDP Ping Scan


    UDP ping scan is similar to TCP ping scan; however, in the UDP ping scan, Nmap
    sends UDP packets to the target host. The default port number used by Nmap for
    the UDP ping scan is 40,125. This highly uncommon port is used as the default
    for sending UDP packets to the target. This default port number can be configured
    using DEFAULT_UDP_PROBE_PORT_SPEC during compile time in Nmap.


    Attackers send UDP packets to the target host, and a UDP response means that the
    target host is active. If the target host is offline or unreachable, various error
    messages such as host/network unreachable or TTL exceeded could be returned. In
    Zenmap, the -PU option is used to perform the UDP ping scan.


    ![](img/198108450322f24970ade227cbf24f47_29_1.png)


    Figure 3.17: UDP ping scan to determine if the host is active'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/198108450322f24970ade227cbf24f47_30_0.png)


    Figure 3.18: UDP ping scan to determine if the host is offline


    # Advantages:


    +   - UDP ping scans have the advantage of detecting systems behind firewalls
    with strict TCP filtering, leaving the UDP traffic forgotten.


    ![](img/198108450322f24970ade227cbf24f47_30_1.png)


    Figure 3.19: UDP ping scan in Zenmap


    # ICMP ECHO Ping Scan


    Attackers use the ICMP ping scan to send ICMP packets to the destination system
    to gather all necessary information about it. This is because ICMP does not include
    port abstraction, and it is different from port scanning. However, it is useful
    to determine what hosts in a network are running by pinging them all.


    ICMP ECHO ping scan involves sending ICMP ECHO requests to a host. If the host
    is alive, it will return an ICMP ECHO reply. This scan is useful for locating
    active devices or determining if ICMP is passing through a firewall.


    ![](img/198108450322f24970ade227cbf24f47_30_2.png)


    Figure 3.20: ICMP echo request and reply'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'UNIX/Linux and BSD-based machines use ICMP echo scanning; the TCP/IP stack
    implementations in these OSs respond to the ICMP echo requests to the broadcast
    addresses. This technique does not work on Windows-based networks, as their TCP/IP
    stack implementation does not reply to ICMP probes directed at the broadcast address.


    Nmap uses the -P option to ICMP scan the target. The user can also increase the
    number of pings in parallel using the -L option. It may also be useful to tweak
    the ping timeout value using the -T option.


    In Zenmap, the -PE option is used to perform the ICMP ECHO ping scan. Active hosts
    are displayed as "Host is up," as shown in the screenshot.


    ![](img/198108450322f24970ade227cbf24f47_31_0.png)


    Figure 3.21: ICMP Echo ping scan output using Zenmap


    # ICMP ECHO Ping Sweep


    A ping sweep (also known as an ICMP sweep) is a basic network scanning technique
    that is adopted to determine the range of IP addresses that map to live hosts
    (computers). Although a single ping will tell the user whether a specified host
    computer exists on the network, a ping sweep consists of ICMP ECHO requests sent
    to multiple hosts. If a specified host is active, it will return an ICMP ECHO
    reply.


    Ping sweeps are among the oldest and slowest methods used to scan a network. This
    utility is distributed across nearly all platforms, and it acts as a roll call
    for systems; a system that is active on the network answers the ping query that
    another system sends out.


    ICMP echo scanning pings all the machines in the target network to discover live
    machines. Attackers send ICMP probes to the broadcast or network address, which
    relays to all the host addresses in the subnet. The live systems will send the
    ICMP echo reply message to the source of the ICMP echo probe.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/198108450322f24970ade227cbf24f47_32_0.png)


    Figure 3.22: ICMP ECHO Ping Sweep


    To understand pings better, one should be able to understand the TCP/IP packet.
    When a system pings, it sends a single packet across the network to a specific
    IP address. This packet contains 64 bytes (56 data bytes and 8 bytes of protocol
    header information). The sender then waits or listens for a return packet from
    the target system. If the connections are good and the target computer is “alive,”
    a good return packet is expected. However, this will not be the case if there
    is a disruption in communication. Pings also detail the time taken for a packet
    to make a complete trip, called the “round-trip time.” They also help in resolving
    hostnames. In this case, if the packet bounces back when sent to the IP address,
    but not when sent to the name, then the system is unable to reconcile the name
    with the specific IP address.


    Attackers calculate subnet masks using subnet mask calculators to identify the
    number of hosts that are present in the subnet. They subsequently use ping sweep
    to create an inventory of live systems in the subnet.


    # ICMP ECHO Ping Sweep Using Nmap


    Source: https://nmap.org


    Nmap helps an attacker to perform a ping sweep that determines live hosts from
    a range of IP addresses. In Zenmap, the -PE option with a list of IP addresses
    is used to perform ICMP ECHO ping sweep.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/198108450322f24970ade227cbf24f47_33_0.png)


    Figure 3.23: Ping Sweep output using Zenmap


    # ICMP Timestamp Ping Scan


    Besides the traditional ICMP ECHO ping, there are some other types of ICMP pinging
    techniques such as ICMP timestamp ping scan and ICMP address mask ping scan, which
    an attacker can adopt in specific conditions.


    ICMP timestamp ping is an optional and additional type of ICMP ping whereby the
    attackers query a timestamp message to acquire the information related to the
    current time from the target host machine. The target machine responds with a
    timestamp reply to each timestamp query that is received. However, the response
    from the destination host is conditional, and it may or may not respond with the
    time value depending on its configuration by the administrator at the target’s
    end. This ICMP timestamp pinging is generally used for time synchronization. Such
    a ping method is effective in identifying whether the destination host machine
    is active, specifically in the condition where the administrator blocks the traditional
    ICMP ECHO ping requests. In Zenmap, the -PP option is used to perform an ICMP
    timestamp ping scan.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/198108450322f24970ade227cbf24f47_34_0.png)


    Figure 3.24: ICMP timestamp ping in Zenmap


    # ICMP Address Mask Ping Scan


    ICMP address mask ping is another alternative to the traditional ICMP ECHO ping,
    where the attackers send an ICMP address mask query to the target host to acquire
    information related to the subnet mask. However, the address mask response from
    the destination host is conditional, and it may or may not respond with the appropriate
    subnet value depending on its configuration by the administrator at the target’s
    end. This type of ping method is also effective in identifying the active hosts
    similarly to the ICMP timestamp ping, specifically when the administrator blocks
    the traditional ICMP Echo ping. In Zenmap, the -PM option is used to perform an
    ICMP address mask ping scan.


    ![](img/198108450322f24970ade227cbf24f47_34_1.png)


    Figure 3.25: ICMP address mask ping in Zenmap'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# TCP SYN Ping Scan


    TCP SYN ping is a host discovery technique for probing different ports to determine
    if the port is online and to check if it encounters any firewall rule sets. In
    this type of host discovery technique, an attacker uses the Nmap tool to initiate
    the three-way handshake by sending the empty TCP SYN flag to the target host.
    After receiving SYN, the target host acknowledges the receipt with an ACK flag.
    After reception of the ACK flag, the attacker confirms that the target host is
    active and terminates the connection by sending an RST flag to the target host
    machine (since his/her objective of host discovery is accomplished). Port 80 is
    used as the default destination port. A range of ports can also be specified in
    this type of pinging format without inserting a space between -PS and the port
    number (e.g., PS22-25,80,113,1050,35000), where the probe will be performed against
    each port parallelly. In Zenmap, the -PS option is used to perform a TCP SYN ping
    scan.


    ![](img/198108450322f24970ade227cbf24f47_35_0.png)


    Figure 3.26: TCP SYN ping scan for host discovery


    # Advantages:


    +   - As the machines can be scanned parallelly, the scan never gets the time-out
    error while waiting for the response.

    +   - TCP SYN ping can be used to determine if the host is active without creating
    any connection. Hence, the logs are not recorded at the system or network level,
    enabling the attacker to leave no traces for detection.


    ![](img/198108450322f24970ade227cbf24f47_35_1.png)


    Figure 3.27: TCP SYN ping scan in Zenmap'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# TCP ACK Ping Scan


    TCP ACK ping is similar to TCP SYN ping, albeit with minor variations. TCP ACK
    ping also uses the default port 80. In the TCP ACK ping technique, the attackers
    send an empty TCP ACK packet to the target host directly. Since there is no prior
    connection between the attacker and the target host, after receiving the ACK packet,
    the target host responds with an RST flag to terminate the request. The reception
    of this RST packet at the attacker’s end indicates that the host is active. In
    Zenmap, the -PA option is used to perform a TCP ACK ping scan.


    ![](img/198108450322f24970ade227cbf24f47_36_0.png)


    Figure 3.28: TCP ACK ping scan for host discovery


    # Advantages:


    +   - Both the SYN and the ACK packet can be used to maximize the chances of bypassing
    the firewall. However, firewalls are mostly configured to block the SYN ping packets,
    as they are the most common pinging technique. In such cases, the ACK probe can
    be effectively used to bypass these firewall rule sets easily.


    ![](img/198108450322f24970ade227cbf24f47_36_1.png)


    Figure 3.29: TCP ACK ping scan in Zenmap


    # IP Protocol Ping Scan


    IP protocol ping is the latest host discovery option that sends IP ping packets
    with the IP header of any specified protocol number. It has the same format as
    the TCP and UDP ping. This technique tries to send different packets using different
    IP protocols, hoping to get a response indicating that a host is online.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Multiple IP packets for ICMP (protocol 1), IGMP (protocol 2), and IP-in-IP
    (protocol 4) are sent by default when no protocols are specified. For configuring
    the default protocols, change DEFAULT_PROTO_PROBE_PORT_SPEC in nmap.h during compile
    time. For specific protocols such as ICMP, IGMP, TCP (protocol 6), and UDP (protocol
    17), the packets are to be sent with proper protocol headers, and for the remaining
    protocols, only the IP header data is to be sent with the packets.


    ![](img/198108450322f24970ade227cbf24f47_37_0.png)


    Figure 3.30: IP protocol ping scan for host discovery


    In a nutshell, attackers send different probe packets of different IP protocols
    to the target host; any response from any probe indicates that a host is online.
    In Zenmap, the -PO option is used to perform an IP protocol ping scan.


    ![](img/198108450322f24970ade227cbf24f47_37_1.png)


    Figure 3.31: IP protocol ping scan in Zenmap'
  merge: -1
  img_proc: true
