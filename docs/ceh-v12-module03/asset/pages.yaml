- pgno: 131
  md: 'the initial SYN packet waits for SYN-ACK before sending the ACK packet. To
    check whether you are getting the SYN request from a genuine client or a spoofed
    one, set SYN-ACK to zero. If the sender sends an ACK with any data, it means that
    the sender is a spoofed one. This is because when SYN-ACK is set to zero, the
    sender must respond to it only with the ACK packet, without additional data.


    ![](img/198108450322f24970ade227cbf24f47_131_0.png)


    Figure 3.108: IP Spoofing detection technique: TCP Flow Control Method


    Attackers sending spoofed TCP packets will not receive the target''s SYN-ACK packets.
    Attackers cannot respond to changes in the congestion window size. When the received
    traffic continues after a window size is exhausted, the packets are most likely
    spoofed.'
