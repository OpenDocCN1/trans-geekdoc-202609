- pgno: 111
  md: '# Proxy Chaining


    +   1. User requests a resource from the destination

    +   2. Proxy client at the user’s system connects to a proxy server and passes
    the request to proxy server

    +   3. The proxy server strips the user’s identification information and passes
    the request to next proxy server

    +   4. This process is repeated by all the proxy servers in the chain

    +   5. At the end, the unencrypted request is passed to the web server


    ![](img/198108450322f24970ade227cbf24f47_111_0.png)


    # Proxy Chaining


    Proxy chaining helps an attacker to increase his/her Internet anonymity. Internet
    anonymity depends on the number of proxies used for fetching the target application;
    the larger the number of proxy servers used, the greater is the attacker’s anonymity.


    The proxy chaining process is described below:


    +   - The user requests a resource from the destination.

    +   - A proxy client in the user’s system connects to a proxy server and passes
    the request to the proxy server.

    +   - The proxy server strips the user’s identification information and passes
    the request to the next proxy server.

    +   - This process is repeated by all the proxy servers in the chain.

    +   - Finally, the unencrypted request is passed to the web server.


    ![](img/198108450322f24970ade227cbf24f47_111_1.png)


    Figure 3.97: Proxy Chaining'
  merge: -1
  img_proc: true
