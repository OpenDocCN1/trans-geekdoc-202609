  md: "# IDLE/IPID Header Scan\n\nThe IDLE/IPID header scan is a TCP port scan method\
    \ that can be used to send a spoofed source address to a computer to determine\
    \ what services are available. It offers the complete blind scanning of a remote\
    \ host. Most network servers listen on TCP ports; for example, web servers listen\
    \ on port 80, and mail servers listen on port 25. A port is considered “open”\
    \ if an application is listening on the port. One way to determine whether a port\
    \ is open is to send a “SYN” (session establishment) packet to the port. The target\
    \ machine returns a “SYN|ACK” (session request acknowledgement) packet if the\
    \ port is open or an “RST” (reset) packet if the port is closed. A machine that\
    \ receives an unsolicited SYN|ACK packet responds with an RST. An unsolicited\
    \ RST is ignored. Every IP packet on the Internet has an “IP identifier” (IPID)\
    \ that uniquely identifies fragments of an original IP datagram. The OS increases\
    \ the IPID for each packet sent. Thus, probing an IPID reveals to an attacker\
    \ the number of packets sent since the last probe. In Zenmap, the -sI option is\
    \ used to perform an IDLE scan.\n\n![](img/198108450322f24970ade227cbf24f47_58_0.png)\n\
    \nFigure 3.58: IDLE/IPID Header scan using Nmap\n\nThe attacker performs this\
    \ scan by impersonating another computer via spoofing. The attacker does not send\
    \ a packet from their IP address; instead, they use another host, often called\
    \ a “zombie,” to scan the remote host and identify open ports. In this attack,\
    \ the attacker expects the sequence numbers of the zombie host, and if the remote\
    \ host checks the IP of the scanning party, the IP of the zombie machine is displayed.\n\
    \n# IDLE Scan\n\n+   - Step 1\n+   \n+     The first step in an idle scan is to\
    \ determine an appropriate zombie. A zombie that incrementally assigns IPID packets\
    \ on a global basis is an appropriate or idle zombie for"
  merge: -1
  img_proc: true
- pgno: 59
  md: 'performing idle scans. The shorter the time interval for request/response between
    the attacker-zombie and zombie-target, the faster is the scan.


    # Choose a “Zombie” and Probe Its Current IP Identification (IPID) Number


    In the first step, the SYN+ACK packet is sent to the zombie machine to probe its
    IPID number. Here, the SYN+ACK packet is sent to probe the IPID number and not
    to establish a TCP connection (three-way handshake).


    ![](img/198108450322f24970ade227cbf24f47_59_0.png)


    Figure 3.59: IDLE scan: step 1


    As the zombie does not expect a SYN+ACK packet, it denies the connection by returning
    an RST packet. The RST packet sent by the zombie machine is analyzed to extract
    the IPID. As shown in figure, we assume that the zombie responds with IPID=31337.
    Furthermore, we assume that the IPID is X.


    +   - Step 2


    The attacker sends a SYN packet to the target machine on port 80, spoofing the
    IP address of the zombie.


    # Idle Scan: Step 2.1 (Open Port)


    If the port is open, the target sends the SYN+ACK packet to the zombie (as the
    IP address was spoofed) to proceed with the three-way handshake. Because the zombie
    did not expect a SYN+ACK packet from the target machine, it responds with an RST
    packet.


    ![](img/198108450322f24970ade227cbf24f47_59_1.png)


    Figure 3.60: Port is open


    Because every IP packet has an IPID, which increases by one for every packet transmission,
    the zombie now uses the next available IPID, i.e., 31338 (X + 1).'
