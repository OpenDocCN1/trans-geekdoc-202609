- pgno: 57
  md: '# Checking the Filtering Systems of Target Networks


    The ACK flag probe scanning technique also helps in checking the filtering systems
    of target networks. The attacker sends an ACK probe packet to check the filtering
    mechanism (firewalls) of packets employed by the target network.


    Sending an ACK probe packet with a random sequence number and getting no response
    from the target means that the port is filtered (stateful firewall is present);
    an RST response from the target means that the port is not filtered (no firewall
    is present).


    ![](img/198108450322f24970ade227cbf24f47_57_0.png)


