    ![](img/198108450322f24970ade227cbf24f47_56_2.png)


    Figure 3.54: TCP Window scan result of a filtered port


    # Advantages:


    +   - This type of scan can evade IDS in most cases.


    # Disadvantages:


    +   - It is extremely slow and can exploit only older OSs with vulnerable BSD-derived
    TCP/IP stacks.'
