- pgno: 104
  md: '# Creating Custom Packets


    ![](img/198108450322f24970ade227cbf24f47_104_0.png)


    # Creating Custom Packets by using Packet Crafting Tools


    Attackers create custom TCP packets using various packet crafting tools like Colasoft
    Packet Builder, NetScanTools Pro, etc. to scan a target beyond a firewall


    ![](img/198108450322f24970ade227cbf24f47_104_1.png)


    ![](img/198108450322f24970ade227cbf24f47_104_2.png)


    # Creating Custom Packets


    The attacker creates and sends custom packets to scan the intended target beyond
    the IDS/firewalls. Various techniques are used to create custom packets. Some
    of them are mentioned below:


    +   - Creating Custom Packets by using Packet Crafting Tools


    Attackers create custom TCP packets to scan the target by bypassing the firewalls.
    Attackers use various packet crafting tools such as Colasoft packet builder (https://www.colasoft.com),
    NetScanTools Pro (https://www.netscantools.com), etc., to scan the target that
    is beyond the firewall. Packet crafting tools craft and send packet streams (custom
    packets) using different protocols at different transfer rates.


    # Colasoft Packet Builder


    Source: https://www.colasoft.com


    Colasoft Packet Builder is a tool that allows an attacker to create custom network
    packets and helps security professionals assess the network. The attacker can
    select a TCP packet from the provided templates and change the parameters in the
    decoder, hexadecimal, or ASCII editor to create a packet. In addition to building
    packets, Colasoft Packet Builder supports saving packets to packet files and sending
    packets to the network.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/198108450322f24970ade227cbf24f47_105_0.png)


    Figure 3.92: Screenshot of Colasoft Packet Builder


    There are three views in the Packet Builder: Packet List, Decode Editor, and Hex
    Editor.


    +   - Packet List displays all the constructed packets. When you select one or
    more packets in Packet List, the first highlighted packet is displayed in both
    Decode Editor and Hex Editor for editing.

    +   - In Hex Editor, the data of the packet are represented as hexadecimal values
    and ASCII characters; nonprintable characters are represented by a dot (".") in
    the ASCII section. You can edit either the hexadecimal values or the ASCII characters.

    +   - Decode Editor allows the attacker to edit packets without remembering the
    value length, byte order, and offsets. You can select a field and change the value
    in the edit box.


    For creating a packet, you can use the add or insert packet command in the Edit
    menu or the Toolbar to create a new packet.


    The attacker can send a constructed packet to wire directly and control how Colasoft
    Packet Builder sends the packets, specifying, for example, the interval between
    packets, loop times, and delay between loops.


    This packet builder audits networks and checks the network protection against
    attacks and intruders. Attackers may use this packet builder to create fragmented
    packets to bypass network firewalls and IDS systems. They can also create packets
    and flood the victim with a very large number of packets, which could result in
    DoS attacks.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Randomizing Host Order and Sending Bad Checksums


    # Randomizing Host Order


    # Sending Bad Checksums


    Attackers scan the number of hosts in the target network in random order to scan
    an intended target that is behind a firewall


    Attackers send packets with bad or bogus TCP/UPD checksums to the intended target
    to avoid certain firewall rulesets


    ![](img/198108450322f24970ade227cbf24f47_106_0.png)


    # Randomizing Host Order and Sending Bad Checksums


    # Randomizing Host Order


    The attacker scans the number of hosts in the target network in a random order
    to scan the intended target that is lying beyond the firewall. The option used
    by Nmap to scan with a random host order is `--randomize-hosts`.


    This technique instructs Nmap to shuffle each group of 16384 hosts before scanning
    with slow timing options, thus making the scan less notable to network monitoring
    systems and firewalls. If larger group sizes are randomized, the `PING_GROUP_SZ`
    should be increased in `nmap.h` and it should be compiled again. Another method
    can be followed by generating the target IP list with the list scan command `-sL
    -n -oN <filename>` and then randomizing it with a Perl script and providing the
    whole list to Nmap using the `-iL` command.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/198108450322f24970ade227cbf24f47_107_0.png)


    Figure 3.93: Screenshot of randomizing hosts in Zenmap


    # Sending Bad Checksums


    The attacker sends packets with bad or bogus TCP/UPD checksums to the intended
    target to avoid certain firewall rule sets. TCP/UPD checksums are used to ensure
    data integrity. Sending packets with incorrect checksums can help attackers to
    acquire information from improperly configured systems by checking for any response.
    If there is a response, then it is from the IDS or firewall, which did not verify
    the obtained checksum. If there is no response or the packets are dropped, then
    it can be inferred that the system is configured. This technique instructs Nmap
    to send packets with invalid TCP, UDP, or SCTP checksums to the target host. The
    option used by Nmap is --badsum.


    ![](img/198108450322f24970ade227cbf24f47_107_1.png)


    Figure 3.94: Screenshot of scanning by sending bad checksums in Zenmap'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Proxy Servers


    A proxy server is an application that can serve as an intermediary for connecting
    with other computers


    # Why Attackers Use Proxy Servers?


    +   1. To hide the actual source of a scan and evade certain IDS/firewall restrictions

    +   2. To mask the actual source of an attack by impersonating the fake source
    address of the proxy

    +   3. To remotely access intranets and other website resources that are normally
    restricted

    +   4. To interrupt all requests sent by a user and transmit them to a third destination
    such that victims can only identify the proxy server address

    +   5. To chain multiple proxy servers to avoid detection


    Note: A search in Google will list thousands of free proxy servers


    # Proxy Servers


    A proxy server is an application that can serve as an intermediary for connecting
    with other computers.


    A proxy server is used:


    +   - As a firewall and to protect the local network from external attacks.

    +   - As an IP address multiplexer that allows several computers to connect to
    the Internet when you have only one IP address (NAT/PAT).

    +   - To anonymize web surfing (to some extent).

    +   - To extract unwanted content, such as ads or “unsuitable” material (using
    specialized proxy servers).

    +   - To provide some protection against hacking attacks.

    +   - To save bandwidth.


    # How does a proxy server work?


    Initially, when you use a proxy to request a particular web page on an actual
    server, the proxy server receives it. The proxy server then sends your request
    to the actual server on your behalf. It mediates between you and the actual server
    to transmit and respond to the request, as shown in the figure below.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/198108450322f24970ade227cbf24f47_109_0.png)


    Figure 3.95: Attacker using a proxy server for connecting to the target


    In this process, the proxy receives the communication between the client and the
    destination application. To take advantage of a proxy server, an attacker must
    configure client programs so that they can send their requests to the proxy server
    instead of the final destination.


    # Why Attackers Use Proxy Servers?


    It is easier for an attacker to attack or hack a particular system than to conceal
    the attack source. Therefore, the primary challenge for an attacker is to hide
    his/her identity so that he/she cannot be traced. Thus, the attacker uses a proxy
    server to avoid attack detection by masking his/her IP address. When the attacker
    uses a proxy to connect to the target system, the server logs will record the
    proxy''s source address rather than the attacker’s source address.


    Proxy sites help the attacker to browse the Internet anonymously and access blocked
    sites (i.e., evade firewall restrictions). Thus, the attacker can surf restricted
    sites anonymously without using the source IP address.


    Attackers use proxy servers:


    +   - To hide the actual source of a scan and evade certain IDS/firewall restrictions.

    +   - To hide the source IP address so that they can hack without any legal corollary.

    +   - To mask the actual source of the attack by employing a fake source address
    of the proxy.

    +   - To remotely access intranets and other website resources that are normally
    off limits.

    +   - To interrupt all the requests sent by a user and transmit them to a third
    destination; hence, victims will only be able to identify the proxy server address.

    +   - To chain multiple proxy servers to avoid detection.'
  merge: -1
  img_proc: true
