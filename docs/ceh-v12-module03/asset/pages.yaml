- pgno: 125
  md: 'a very useful intrusion detection and prevention technology, mainly because
    signatures are frequently available from public authors.


    +   - Keep as few ports open as possible and filter the rest, as an intruder may
    attempt to enter through any open port. Use a custom rule set to lock down the
    network, block unwanted ports at the firewall, and filter the following ports:
    135–159, 256–258, 389, 445, 1080, 1745, and 3268.

    +   - Block unwanted services running on the ports and update the service versions.

    +   - Ensure that the versions of services running on the ports are non-vulnerable.

    +   - Block inbound ICMP message types and all outbound ICMP type-3 unreachable
    messages at border routers arranged in front of the company’s main firewall.

    +   - Attackers attempt to perform source routing and send packets to the targets,
    which may not be reachable via the Internet, using an intermediate host that can
    interact with the target. Hence, it is necessary to ensure that the firewall and
    router can block such source-routing techniques.

    +   - Ensure that the mechanisms used for routing and filtering at the routers
    and firewalls, respectively, cannot be bypassed using a particular source port
    or source routing methods.

    +   - Test the IP address space using TCP and UDP port scans as well as ICMP probes
    to determine the network configuration and accessible ports.

    +   - Ensure that the anti-scanning and anti-spoofing rules are configured.

    +   - If a commercial firewall is in use, then ensure the following:

    +     - It is patched with the latest updates.

    +     - It has correctly defined anti-spoofing rules.

    +     - Its fast-mode services are unusable.

    +   - Ensure that TCP wrappers limit access to the network based on domain names
    or IP addresses.

    +   - Test how the network firewall and IDS manages the fragmented packets using
    fragtest and fragroute.

    +   - Use proxy servers to block fragmented or malformed packets.

    +   - Ensure that the firewalls forward open port scans to empty hosts or honeypots
    to make the port-scanning task difficult and time-consuming.

    +   - Employ an intrusion prevention system (IPS) to identify port scan attempts
    and blacklist IP addresses.'
