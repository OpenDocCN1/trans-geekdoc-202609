- pgno: 87
  md: '# OS Discovery using IPv6 Fingerprinting


    IPv6 Fingerprinting can be used to identify the OS running on the target machine


    IPv6 fingerprinting has the same functionality as that of IPv4


    The difference between IPv6 and IPv4 fingerprinting is that the IPv6 uses several
    additional advanced probes specific to IPv6 along with a separate OS detection
    engine that is specialized for IPv6


    In Zenmap, the -6 option and -O option are used to perform OS discovery using
    the IPv6 fingerprinting method


    ```

    Syntax: # nmap -6 -O <target>

    ```


    # OS Discovery using IPv6 Fingerprinting


    Source: https://nmap.org


    IPv6 Fingerprinting is another technique used to identify the OS running on the
    target machine. It has the same functionality as IPv4, such as sending probes,
    waiting and collecting the responses, and matching them with the database of fingerprints.
    The difference between IPv6 and IPv4 fingerprinting is that IPv6 uses several
    additional advanced IPv6-specific probes along with a separate IPv6-specifc OS
    detection engine. Nmap sends nearly 18 probes in the following order to identify
    the target OS using the IPv6 fingerprinting method.


    +   - Sequence generation (S1–S6)

    +   - ICMPv6 echo (IE1)

    +   - ICMPv6 echo (IE2)

    +   - Node Information Query (NI)

    +   - Neighbor Solicitation (NS)

    +   - UDP (U1)

    +   - TCP explicit congestion notification (TECN)

    +   - TCP (T2–T7)


    In Zenmap, the -6 option along with -O option is used to perform OS discovery
    using the IPv6 fingerprinting method.


    ```

    Syntax: # nmap -6 -O <target>

    ```'
  merge: -1
  img_proc: true
