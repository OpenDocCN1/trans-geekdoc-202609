    # Hping3


    Source: http://www.hping.org


    Hping3 is a command-line-oriented network scanning and packet crafting tool for
    the TCP/IP protocol that sends ICMP echo requests and supports TCP, UDP, ICMP,
    and raw-IP protocols. It performs network security auditing, firewall testing,
    manual path MTU discovery, advanced traceroute, remote OS fingerprinting, remote
    uptime guessing, TCP/IP stacks auditing, and other functions. It can send custom
    TCP/IP packets and display target replies similarly to a ping program with ICMP
    replies. It handles fragmentation as well as arbitrary packet body and size, and
    it can be used to transfer encapsulated files under the supported protocols. It
    also supports idle host scanning. IP spoofing and network/host scanning can be
    used to perform an anonymous probe for services. Hping3 also has a Traceroute
    mode, which enables attackers to send files between covert channels. It also determines
    whether the host is up even when the host blocks ICMP packets. Its firewall-like
    usage allows the discovery of open ports behind firewalls.


    Obtains list of open ports, OS details, MAC details, and services along with their
    versions


    ```

    nmap -p 1-65535 -T4 -A -v 10.10.1.11

    ```'
  merge: -1
