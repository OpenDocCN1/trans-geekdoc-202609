- pgno: 93
  md: '# Source Routing


    +   - As the packet travels through the nodes in the network, each router examines
    the destination IP address and chooses the next hop to direct the packet to the
    destination

    +   - Source routing refers to sending a packet to the intended destination with
    a partially or completely specified route (without firewall-/IDS-configured routers)
    in order to evade an IDS or firewall

    +   - In source routing, the attacker makes some or all of these decisions on
    the router


    ![](img/198108450322f24970ade227cbf24f47_93_0.png)


    This figure shows source routing, where the originator dictates the eventual route
    of the traffic


    # Source Routing


    An IP datagram contains various fields, including the IP options field, which
    stores source routing information and includes a list of IP addresses through
    which the packet travels to its destination. As the packet travels through the
    nodes in the network, each router examines the destination IP address and chooses
    the next hop to direct the packet to the destination.


    When attackers send malformed packets to a target, these packets hop through various
    routers and gateways to reach the destination. In some cases, the routers in the
    path might include configured firewalls and IDS that block such packets. To avoid
    them, attackers enforce a loose or strict source routing mechanism, in which they
    manipulate the IP address path in the IP options field so that the packet takes
    the attacker-defined path (without firewall-/IDS-configured routers) to reach
    the destination, thereby evading firewalls and IDS.


    The figure below shows source routing, where the originator dictates the eventual
    route of the traffic.


    ![](img/198108450322f24970ade227cbf24f47_93_1.png)


    Figure 3.83: Source Routing'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Source Port Manipulation


    +   - Source port manipulation refers to manipulating actual port numbers with
    common port numbers in order to evade an IDS or firewall

    +   - It occurs when a firewall is configured to allow packets from well-known
    ports like HTTP, DNS, FTP, etc.

    +   - Nmap uses the -g or --source-port options to perform source port manipulation


    ![](img/198108450322f24970ade227cbf24f47_94_0.png)


    # Source Port Manipulation


    Source port manipulation is a technique used for bypassing the IDS/firewall, where
    the actual port numbers are manipulated with common port numbers for evading certain
    IDS and firewall rules. The main security misconfigurations occur because of blindly
    trusting the source port number. The administrator mostly configures the firewall
    by allowing the incoming traffic from well-known ports such as HTTP, DNS, FTP,
    etc. The firewall can simply allow the incoming traffic from the packets sent
    by the attackers using such common ports.


    ![](img/198108450322f24970ade227cbf24f47_94_1.png)


    Figure 3.84: Firewall allowing manipulated port 80 to the victim from attacker


    Although the firewalls can be made secure using application-level proxies or protocol-parsing
    firewall elements, this technique helps the attacker to bypass the firewall rules
    easily. The attacker tries to manipulate the original port number with the common
    port numbers, which can easily bypass the IDS/firewall. In Zenmap, the -g or --source-port
    option is used to perform source port manipulation.'
  merge: -1
  img_proc: true
