  md: '+   - Fing


    Source: https://www.fing.io


    Fing is a mobile app for Android and iOS that scans and provides complete network
    information, such as IP address, MAC address, device vendor, and ISP location.
    It allows attackers to discover all devices connected to a Wi-Fi network along
    with their IP and MAC address as well as the name of the vendor/device manufacturer.
    It also allows attackers to perform network pinging and traceroute activities
