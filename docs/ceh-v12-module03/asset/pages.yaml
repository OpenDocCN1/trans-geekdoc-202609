- pgno: 99
  md: '# IP Address Spoofing


    +   - IP spoofing refers to **changing the source IP addresses** so that the attack
    **appears to be coming from someone else**

    +   - When the victim replies to the address, it goes back to the **spoofed address**
    rather than the **attacker''s real address**

    +   - Attackers modify the **address information** in the IP packet header and
    the source address bits field in order to bypass the IDS or firewall


    IP spoofing using Hping3:


    ```

    Hping3 www.certifiedhacker.com -a 7.7.7.7

    ```


    ![](img/198108450322f24970ade227cbf24f47_99_0.png)


    Note: You will not be able to complete the three-way handshake and open a successful
    TCP connection with spoofed IP addresses


    # IP Address Spoofing


    Most firewalls filter packets based on the source IP address. These firewalls
    examine the source IP address and determine whether the packet is coming from
    a legitimate source or an illegitimate source. The IDS filters packets from illegitimate
    sources. Attackers use IP spoofing technique to bypass such IDS/firewalls.


    IP address spoofing is a hijacking technique in which an attacker obtains a computer’s
    IP address, alters the packet headers, and sends request packets to a target machine,
    pretending to be a legitimate host. The packets appear to be sent from a legitimate
    machine but are actually sent from the attacker’s machine, while his/her machine''s
    IP address is concealed. When the victim replies to the address, it goes back
    to the spoofed address and not to the attacker’s real address. Attackers mostly
    use IP address spoofing to perform DoS attacks.


    When the attacker sends a connection request to the target host, the target host
    replies to the spoofed IP address. When spoofing a nonexistent address, the target
    replies to a nonexistent system and then hangs until the session times out, thus
    consuming a significant amount of its own resources.'
  merge: -1
  img_proc: true
