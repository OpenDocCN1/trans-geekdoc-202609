    ![](img/198108450322f24970ade227cbf24f47_69_2.png)


    ## IPv6 Scan

    ## IPv6 扫描


    IPv6 increases the size of the IP address space from 32 bits to 128 bits to support
    higher levels of the addressing hierarchy. Traditional network scanning techniques
    are computationally less feasible because of the larger search space (64 bits
    of host address space, or 2^64 addresses) provided by IPv6 in a subnet. Scanning
    the IPv6 network is more difficult and complex compared to IPv4. Additionally,
    a number of scanning tools do not support ping sweeps on IPv6 networks. Attackers
    need to harvest IPv6 addresses from network traffic, recorded logs, or "Received
    from" and other header lines in archived email or Usenet news messages to identify
    IPv6 addresses for subsequent port scanning. However, scanning an IPv6 network
    provides a large number of hosts in a subnet; if an attacker can compromise one
    subnet host, he/she can probe the "all hosts" link local multicast address if
    the hosts numbers are sequential or use any regular scheme. An attacker needs
    to analyze 2^64 addresses to verify if a particular open service is running on
    a host in that subnet. At a conservative rate of one probe per second, such a
    scan would take about 5 billion years to complete. Attackers can use Nmap to perform
    IPv6 scanning. In Zenmap, the -6 option is used to perform the IPv6 scan.


    IPv6 将 IP 地址空间的大小从 32 位增加到 128 位，以支持更高级别的寻址层次结构。由于 IPv6 在子网中提供的更大搜索空间（64 位主机地址空间，或
    2^64 个地址），传统网络扫描技术在计算上不太可行。与 IPv4 相比，扫描 IPv6 网络更困难、更复杂。此外，许多扫描工具不支持 IPv6 网络上的
    ping 扫描。攻击者需要从网络流量、记录日志或归档电子邮件或 Usenet 新闻消息中的“Received from”和其他标头行中收集 IPv6 地址，以便进行后续端口扫描。然而，扫描
    IPv6 网络会在子网中提供大量主机；如果攻击者能够入侵一个子网主机，他/她可以探测“所有主机”链路本地组播地址，如果主机号是顺序的或使用任何常规方案。攻击者需要分析
    2^64 个地址来验证子网中主机上是否运行特定开放服务。以每秒一次探测的保守速率计算，此类扫描大约需要 50 亿年才能完成。攻击者可以使用 Nmap 执行
    IPv6 扫描。在 Zenmap 中，使用 -6 选项执行 IPv6 扫描。


