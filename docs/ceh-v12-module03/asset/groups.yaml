  - '[PAGE 124]


    # Port Scanning Countermeasures


    +   1. Configure **firewall** and **IDS rules** to detect and block probes

    +   2. Run **port scanning tools** against hosts on the network to determine whether
    the firewall properly **detects port scanning activity**

    +   3. Ensure that the mechanisms used for **routing** and **filtering** at the
    routers and firewalls, respectively, **cannot be bypassed** using a particular
    source port or source routing methods

    +   4. Ensure that the **router**, **IDS**, and **firewall firmware** are updated
    to their latest releases/versions

    +   5. Use a **custom rule set** to lock down the network and block **unwanted
    ports** at the firewall

    +   6. Filter all **ICMP messages** (i.e., inbound ICMP message types and outbound
    ICMP type 3 unreachable messages) at the **firewalls and routers**

    +   7. Perform **TCP and UDP scanning** along with ICMP probes against your organization''s
    IP address space to **check the network configuration and its available ports**

    +   8. Ensure that **anti-scanning** and **anti-spoofing** rules are properly
    configured


    # Port Scanning Countermeasures


    As discussed previously, port scanning provides a large amount of useful information
    to attackers, such as IP addresses, host names, open ports, and services running
    on ports. Open ports specifically offer an easy means for an attacker to break
    into the network. However, there is no cause for concern, provided that the system
    or network is secured against port scanning by adopting the following countermeasures:


    +   - Configure firewall and intrusion detection system (IDS) rules to detect
    and block probes.

    +   - The firewall should be capable of detecting the probes sent by attackers
    using port-scanning tools. It should not allow traffic to pass through after simply
    inspecting the TCP header. The firewall should be able to examine the data contained
    in each packet before allowing traffic to pass through it.

    +   - Run the port scanning tools against hosts on the network to determine whether
    the firewall accurately detects the port scanning activity.

    +   - Some firewalls do a better job than others in terms of detecting stealth
    scans. For example, many firewalls have specific options for detecting SYN scans,
    whereas others ignore FIN scans.

    +   - Ensure that the router, IDS, and firewall firmware are updated with their
    latest releases/versions.

    +   - Configure commercial firewalls to protect the network against fast port
    scans and SYN floods.

    +   - Hackers use tools such as Nmap and perform OS detection to sniff the details
    of a remote OS. Thus, it is important to employ an IDS in such cases. Snort (https://www.snort.org)
    is'
  - '[PAGE 125]


    a very useful intrusion detection and prevention technology, mainly because signatures
    are frequently available from public authors.


    +   - Keep as few ports open as possible and filter the rest, as an intruder may
    attempt to enter through any open port. Use a custom rule set to lock down the
    network, block unwanted ports at the firewall, and filter the following ports:
    135–159, 256–258, 389, 445, 1080, 1745, and 3268.

    +   - Block unwanted services running on the ports and update the service versions.

    +   - Ensure that the versions of services running on the ports are non-vulnerable.

    +   - Block inbound ICMP message types and all outbound ICMP type-3 unreachable
    messages at border routers arranged in front of the company’s main firewall.

    +   - Attackers attempt to perform source routing and send packets to the targets,
    which may not be reachable via the Internet, using an intermediate host that can
    interact with the target. Hence, it is necessary to ensure that the firewall and
    router can block such source-routing techniques.

    +   - Ensure that the mechanisms used for routing and filtering at the routers
    and firewalls, respectively, cannot be bypassed using a particular source port
    or source routing methods.

    +   - Test the IP address space using TCP and UDP port scans as well as ICMP probes
    to determine the network configuration and accessible ports.

    +   - Ensure that the anti-scanning and anti-spoofing rules are configured.

    +   - If a commercial firewall is in use, then ensure the following:

    +     - It is patched with the latest updates.

    +     - It has correctly defined anti-spoofing rules.

    +     - Its fast-mode services are unusable.

    +   - Ensure that TCP wrappers limit access to the network based on domain names
    or IP addresses.

    +   - Test how the network firewall and IDS manages the fragmented packets using
    fragtest and fragroute.

    +   - Use proxy servers to block fragmented or malformed packets.

    +   - Ensure that the firewalls forward open port scans to empty hosts or honeypots
    to make the port-scanning task difficult and time-consuming.

    +   - Employ an intrusion prevention system (IPS) to identify port scan attempts
    and blacklist IP addresses.'
  - '[PAGE 126]


    # Banner Grabbing Countermeasures


    # Disabling or Changing Banner


    # Hiding File Extensions from Web Pages


    +   - Display **false banners** to mislead or deceive attackers

    +   - **Turn off unnecessary services** on the network host to limit the disclosure
    of information

    +   - Use server masking tools to disable or change banner information

    +   - For Apache 2.x with the `mod_headers` module, use a directive in the `httpd.conf`
    file to change the banner information header and set the server as `New Server
    Name`

    +   - Alternatively, change the `ServerSignature` line to `ServerSignature Off`
    in the `httpd.conf` file


    +   - File extensions reveal information about the **underlying server technology**
    that an attacker can utilize to launch attacks

    +   - Hide file extensions to **mask the web technologies**

    +   - Replace **application mappings** such as .asp with .htm or .foo, etc. to
    disguise the identities of servers

    +   - Apache users can use `mod_negotiation` directives

    +   - IIS users can use tools such as **PageXchanger** to manage the file extensions

    +   - It is preferable to not use file extensions at all


    ![](img/198108450322f24970ade227cbf24f47_126_0.png)


    # Banner Grabbing Countermeasures


    # Disabling or Changing Banner


    An open port indicates that a service/banner is running on it. When attackers
    connect to an open port using banner grabbing techniques, the system presents
    a banner containing sensitive information such as the OS, server type, and version.
    Using the information gathered, the attacker identifies specific vulnerabilities
    to exploit and then launches attacks. The countermeasures against banner grabbing
    attacks are as follows:


    +   - Display false banners to mislead or deceive attackers.

    +   - Turn off unnecessary services on the network host to limit information disclosure.

    +   - Use server masking tools to disable or change banner information.

    +   - Remove unnecessary HTTP headers and response data and camouflage the server
    by providing false signatures. This also provides the option of eliminating file
    extensions such as .asp and .aspx, which clearly indicate that the site is running
    on a Microsoft server.

    +   - For Apache 2.x with the `mod_headers` module, use a directive in the `httpd.conf`
    file to change the banner information header and set the server as `New Server
    Name`.

    +   - Alternatively, change the `ServerSignature` line to `ServerSignatureOff`
    in the `httpd.conf` file.

    +   - Disable the details of the vendor and version in the banners.

    +   - Modify the value of `Server Tokens` from `Full` to `Prod` in Apache’s `httpd.conf`
    file to prevent disclosure of the server version.'
