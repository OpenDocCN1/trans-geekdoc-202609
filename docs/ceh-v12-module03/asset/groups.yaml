    ## Ping Sweep 工具


    Ping sweep 工具会 ping 整个网络 IP 地址范围以识别活跃系统。以下 ping sweep 工具可通过同时向网络上的各种主机发送多个 ICMP
    ECHO 请求来确定目标网络上的活跃主机。


    - Angry IP Scanner


    来源: https://www.angryip.org


    Angry IP Scanner 是一款 IP 地址和端口扫描器。它可以扫描任何范围内的 IP 地址以及它们的任意端口。它会 ping 每个 IP 地址以检查其是否存活；然后，可选择解析其主机名、确定
    MAC 地址、扫描端口等。随着插件的使用，收集到的每个主机的信息量会增加。Angry IP Scanner 具有其他功能，例如 NetBIOS 信息（计算机名、工作组名和当前登录的
    Windows 用户）、收藏的 IP 地址范围、Web 服务器检测和可自定义的打开器。该工具允许用户将扫描结果保存为 CSV、TXT、XML 或 IP-Port
    列表文件。为提高扫描速度，它采用多线程方法：为每个被扫描的 IP 地址创建一个单独的扫描线程。


