    **Disadvantage**: Any multi-node network communication incurs some degree of risk
    of compromising confidentiality at each node.


    ## Single-Point Anonymizers


    Single-point anonymizers first transfer your information through a website before
    sending it to the target website and then pass back the information gathered from
    the target website to you via the website to protect your identity.


    **Advantage**: Arms-length communication hides the IP address and related identifying
    information.


    **Disadvantage**: It offers less resistance to sophisticated traffic analysis.


    Anonymizer tools use various techniques such as SSH, VPN, and HTTP proxies, which
    allow access to blocked or censored content on the Internet with advertisements
    omitted.


    ## Whonix


    来源: https://www.whonix.org


    Whonix is a desktop OS designed for advanced security and privacy. It mitigates
    the threat of common attack vectors while maintaining usability. Online anonymity
    is realized via fail-safe, automatic, and desktop-wide use of the Tor network.
    It consists of a heavily reconfigured Debian base that is run inside multiple
    virtual machines, providing a substantial layer of protection from malware and
    IP address leaks.


    ![](img/198108450322f24970ade227cbf24f47_118_0.png)


    图 3.101: Whonix 的屏幕截图


    Some additional anonymizers are listed below:


    - Psiphon (https://psiphon.ca)

    - TunnelBear (https://www.tunnelbear.com)

    - Invisible Internet Project (I2P) (https://geti2p.net)

    - JonDo (https://anonymous-proxy-servers.net)


    Discussed below are various anonymizers for mobile devices:


    ### Orbot


    来源: https://guardianproject.info


    Orbot is a proxy app that allows other apps to use the Internet more securely.
    It uses Tor to encrypt Internet traffic and then hides it by bouncing through
    a series of computers around the world. Tor is a free software that provides an
    open network to help defend your system against any form of network surveillance
    that may compromise personal freedom and privacy as well as confidential business
    activities and relationships through a type of state security monitoring known
    as “traffic analysis.” Orbot creates a truly private Internet connection.


    ![](img/198108450322f24970ade227cbf24f47_119_0.png)


    图 3.102: Orbot 的屏幕截图

    '
