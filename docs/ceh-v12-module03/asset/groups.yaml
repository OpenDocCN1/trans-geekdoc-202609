    In addition, this scanning technique is slow because it limits the ICMP error
    message rate as a form of compensation to machines that apply RFC 1812 section
    4.3.2.8. A remote host will require access to the raw ICMP socket to distinguish
    closed ports from unreachable ports.


    ## UDP RECVFROM () and WRITE () Scanning


    Although non-root users cannot read unreachable port errors directly, Linux informs
    you indirectly when it receives messages.


    ### Example:

    For example, a second write() call to a closed port will usually fail. Various
    scanners, such as Netcat and Pluvial pscan.c, perform recvfrom() on non-blocking
    UDP sockets, and they usually return EAGAIN ("Try Again," errno 11) if the ICMP
    error has not been received or ECONNREFUSED ("Connection refused," errno 111)
    otherwise. This technique is used for determining open ports when non-root users
    use -u (UDP). Root users can also use the -1 (lame UDP scan) option to force this
    process.


    ### Advantage:

    The UDP scan is less intrusive with regard to an open port because there is no
    overhead of a TCP handshake. However, if ICMP is responding to each unavailable
    port, the total number of frames can exceed that from a TCP scan. Microsoft-based
    OSs do not usually implement any ICMP rate limiting; hence, this scan operates
    very efficiently on Windows-based devices.


    ### Disadvantage:

    The UDP scan provides port information only. If additional information of the
    version is needed, the scan must be supplemented with a version detection scan
    (-sV) or the OS fingerprinting option (-o).


    The UDP scan requires privileged access; hence, this scan option is only available
    on systems with the appropriate user permissions.


    Most networks have massive amounts of TCP traffic; as a result, the efficiency
    of the UDP scan is low. The UDP scan will locate open ports and provide the security
    manager with valuable information for identifying successful attacker invasions
    on open UDP ports owing to spyware applications, Trojan horses, and other malicious
    software.


    ## SCTP INIT Scan


    Stream Control Transport Protocol (SCTP) is a reliable message-oriented transport
    layer protocol. It is used as an alternative to the TCP and UDP protocols, as
    its characteristics are similar to those of TCP and UDP. SCTP is specifically
    used to perform multi-homing and multi-streaming activities. Some SCTP applications
    include discovering VoIP, IP telephony, and Signaling System 7/Signaling Transport
    (SS7/SIGTRAN)-related services. SCTP association comprises a four-way handshake
    method, as shown in the screenshot below.


    ![](img/198108450322f24970ade227cbf24f47_63_0.png)


    Figure 3.65: SCTP Association four-way handshake


    In SCTP, the INIT scan is performed quickly by scanning thousands of ports per
    second on a fast network not obstructed by a firewall offering a stronger sense
    of security. The SCTP INIT scan is very similar to the TCP SYN scan; comparatively,
    it is also stealthy and unobtrusive, as it cannot complete SCTP associations,
    hence making the connection half-open.


    Attackers send INIT chunk to the target host. If the port is listening or open,
    it sends an acknowledgement as an INIT+ACK chunk.


    ![](img/198108450322f24970ade227cbf24f47_63_1.png)


    Figure 3.66: SCTP INIT scan result when a port is listening (Open)


    If the target is inactive and it is not listening, then it sends an acknowledgement
    as an ABORT chunk.


    ![](img/198108450322f24970ade227cbf24f47_63_2.png)


    Figure 3.67: SCTP INIT scan result when a port is not listening (Closed)


    After several retransmissions, if there is no response, then the port is indicated
    as a filtered port. The port is also indicated as a filtered port if the target
    server responds with an ICMP unreachable exception (type 3, code 0, 1, 2, 3, 9,
    10, or 13). In Zenmap, the -sY option is used to perform the SCTP INIT scan.


    ### Advantages:

    - INIT scan can clearly differentiate between various ports such as open, closed,
    and filtered states


    ![](img/198108450322f24970ade227cbf24f47_64_0.png)


    Figure 3.68: SCTP INIT scan in Zenmap


