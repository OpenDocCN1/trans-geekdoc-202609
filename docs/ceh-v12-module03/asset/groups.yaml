    whether the machine is vulnerable to UPnP exploits. The UPnP SSDP M-SEARCH information
    discovery tool gleans information from UPnP-enabled systems, as shown in the figure.


    ### List Scan

    In a list scan, the discovery of the active network host is indirect. A list scan
    simply generates and prints a list of IPs/Names without actually pinging or scanning
    the hosts. As a result, the list scan shows all IP addresses as “not scanned”
    (0 hosts up). By default, a reverse DNS resolution is still carried out on each
    host by Nmap to learn their names. In Zenmap, the -sL option is used to perform
    a list scan.


