    扫描工具用于扫描和识别目标网络上的活动主机、开放端口、正在运行的服务、位置信息、NetBIOS 信息以及所有 TCP/IP 和 UDP 开放端口的信息。这些工具获得的信息将帮助道德黑客创建目标组织的概况并扫描网络中连接设备的开放端口。


    - **Nmap**


    来源：https://nmap.org


    Nmap（“Network Mapper”）是用于网络探索和黑客攻击的安全扫描器。它允许您发现计算机网络上的主机、端口和服务，从而创建网络的“地图”。它向目标主机发送特制的包，然后分析响应以实现其目标。它可以扫描数以十万计的机器的庞大网络。Nmap
    包含许多用于端口扫描（TCP 和 UDP）、操作系统检测、版本检测、ping 扫描等的机制。


    网络管理员或攻击者都可以根据自己的特定需求使用此工具。网络管理员可以使用 Nmap 进行网络盘点、管理服务升级计划以及监控主机或服务正常运行时间。攻击者使用
    Nmap 提取网络上活动主机、开放端口、服务（应用程序名称和版本）、数据包过滤器/防火墙类型、MAC 详细信息以及操作系统及其版本等信息。


    ```

    Syntax: # nmap <options> <Target IP address>

    ```


    ![](img/198108450322f24970ade227cbf24f47_15_0.png)


    图 3.6：显示 Nmap 扫描的屏幕截图


    ![](img/198108450322f24970ade227cbf24f47_16_0.png)


    图 3.7：显示 Nmap 扫描结果的屏幕截图


    ## Hping3


    来源：http://www.hping.org


    Hping3 是一款面向命令行的网络扫描和数据包制作工具，用于 TCP/IP 协议，可发送 ICMP 回显请求并支持 TCP、UDP、ICMP 和原始 IP
    协议。它执行网络安全审计、防火墙测试、手动路径 MTU 发现、先进的 traceroute、远程操作系统指纹识别、远程正常运行时间猜测、TCP/IP 堆栈审计等功能。它可以发送自定义
    TCP/IP 数据包并以类似 ping 程序的方式显示目标回复，带有 ICMP 回复。它处理分片以及任意数据包体和大小，并且可以在受支持的协议下用于传输封装文件。它还支持空闲主机扫描。IP
    欺骗和网络/主机扫描可用于对服务进行匿名探测。Hping3 还具有 Traceroute 模式，使攻击者能够在隐蔽通道之间发送文件。它还能在主机阻止 ICMP
    数据包时确定主机是否处于活动状态。其类似防火墙的使用方式允许发现防火墙后面的开放端口。


    获取开放端口列表、操作系统详细信息、MAC 详细信息以及服务及其版本


    ```

    nmap -p 1-65535 -T4 -A -v 10.10.1.11

    ```

