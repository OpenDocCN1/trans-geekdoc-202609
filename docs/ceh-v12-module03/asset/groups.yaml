    - 攻击者可能会使用 UPnP SSDP M-SEARCH 信息发现工具来检查机器是否容易受到 UPnP 利用


    ### List Scan

    ### 列表扫描

    - This type of scan simply generates and prints a list of IPs/Names without actually
    pinging them

    - 这种扫描类型只是生成并打印 IP/名称列表，而不实际 ping 它们

