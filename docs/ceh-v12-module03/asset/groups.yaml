    ## 隐蔽扫描（半开扫描）


    隐蔽扫描会在三次握手信号完成之前突然重置客户端与服务器之间的 TCP 连接，从而使连接处于半开状态。隐蔽扫描向 TCP 端口发送单个帧，而不进行任何 TCP
    握手或额外的数据包传输。这种类型的扫描发送单个帧，并期望得到单个响应。半开扫描部分打开连接但在中途停止。隐蔽扫描也称为“SYN 扫描”，因为它只发送 SYN
    数据包。这可以防止服务通知传入连接。TCP SYN 或半开扫描是一种隐蔽的端口扫描方法。


    隐蔽扫描也实现了三次握手方法。在最后阶段，它检查进入接口的数据包，并在触发新的初始化之前终止连接以识别远程端口。隐蔽扫描过程如下所述。


    - 客户端向服务器的适当端口发送单个 SYN 数据包。

    - 如果端口是开放的，服务器随后会响应 SYN/ACK 数据包。

    - 如果服务器响应 RST 数据包，则远程端口处于“关闭”状态。

    - 客户端发送 RST 数据包以在建立连接之前关闭初始化。


    ![](img/198108450322f24970ade227cbf24f47_49_0.png)


    图 3.36：端口是开放的


    ![](img/198108450322f24970ade227cbf24f47_49_1.png)


    图 3.37：端口是关闭的


    攻击者使用隐蔽扫描技术来绕过防火墙规则和日志记录机制，并在网络流量中像往常一样隐藏自己。在 Zenmap 中，使用 -sS 选项执行隐蔽扫描/TCP 半开扫描。


    ![](img/198108450322f24970ade227cbf24f47_50_0.png)


    图 3.38：使用 Zenmap 进行 TCP 隐蔽/半开扫描


    ## 反向 TCP 标志扫描


    攻击者发送带有 TCP 标志（FIN、URG、PSH）设置或不带任何标志的 TCP 探测数据包。当端口打开时，攻击者不会从主机收到任何响应，而当端口关闭时，他或她会收到来自目标主机的
    RST。


    ![](img/198108450322f24970ade227cbf24f47_50_1.png)


    图 3.39：端口开放时的反向 TCP 标志扫描


    ![](img/198108450322f24970ade227cbf24f47_51_0.png)


    图 3.40：端口关闭时的反向 TCP 标志扫描


    诸如防火墙和 IDS 之类的安全机制会检测发送到目标主机敏感端口的 SYN 数据包。Syslog 等程序可用于记录半开 SYN 标志扫描尝试。有时，根据安装的安全机制，启用
    TCP 标志的探测数据包可以未被检测地通过过滤器。


    一种反向技术涉及使用半开 SYN 标志探测目标，因为关闭的端口只能发送回响应。根据 RFC 793，当主机关闭端口时，会发送 RST/ACK 数据包进行连接重置。攻击者利用此功能向目标主机的每个端口发送带有各种
    TCP 标志设置的 TCP 探测数据包。


    用于探测数据包的常见标志配置包括：


    - 带有 FIN TCP 标志设置的 FIN 探测

    - 带有 FIN、URG 和 PSH TCP 标志设置的 Xmas 探测

    - 不带任何 TCP 标志设置的 NULL 探测

    - SYN/ACK 探测


    目标主机上的所有关闭端口都会发送 RST/ACK 响应。由于 Windows 等操作系统完全忽略 RFC 793 标准，因此在连接到目标主机上的关闭端口时，您看不到
    RST/ACK 响应。但是，当与基于 UNIX 的操作系统一起使用时，此技术是有效的。


    ## 优点


    - 避免许多 IDS 和日志系统；高度隐蔽


    ## 缺点


    - 需要对网络套接字进行原始访问以及超级用户权限

    - 对使用基于 BSD 的 TCP/IP 堆栈的主机大多有效（尤其是对 Microsoft Windows 主机无效）。


    注意：反向 TCP 标志扫描根据探测数据包中设置的标志称为 FIN、URG 和 PSH 扫描。如果没有设置标志，则称为 NULL 扫描。如果仅设置 FIN
    标志，则称为 FIN 扫描，如果设置了 FIN、URG 和 PSH 全部，则称为 Xmas 扫描。


    ## Xmas 扫描


    Xmas 扫描是一种反向 TCP 扫描技术，设置 FIN、URG 和 PSH 标志以向远程设备发送 TCP 帧。如果目标已打开端口，则您将不会从远程系统收到任何响应。如果目标已关闭端口，则您将收到远程系统回复的
    RST。您可以使用此端口扫描技术扫描大型网络并查找哪些主机处于活动状态以及它提供的服务。此技术描述了所有 TCP 标志设置。当所有标志都设置时，一些系统会挂起；因此，标志通常以无意义的模式
    URG-PSH-FIN 设置。攻击者使用 TCP Xmas 扫描通过 RST 数据包确定目标机器上的端口是否关闭。此扫描仅在系统符合基于 RFC 793 的
    TCP/IP 实现时才有效。它不会对任何当前版本的 Microsoft Windows 起作用。


