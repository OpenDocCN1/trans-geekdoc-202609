    ## Port and Service Discovery


    The next step in the network scanning process involves checking the open ports
    and services in live systems. This discovery of open ports and services can be
    performed via various port scanning techniques. Administrators often use port
    scanning techniques to verify the security policies of their networks, whereas
    attackers use them to identify open ports and running services on a host with
    the intent of compromising the network. Moreover, sometimes, users unknowingly
    keep unnecessary open ports on their systems. An attacker takes advantage of such
    open ports to launch attacks.


    This section describes the common ports and corresponding services along with
    various port scanning techniques and tools used by the attacker to perform port
    scanning.


