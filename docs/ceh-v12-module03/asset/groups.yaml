    # Source Routing


    An IP datagram contains various fields, including the IP options field, which
    stores source routing information and includes a list of IP addresses through
    which the packet travels to its destination. As the packet travels through the
    nodes in the network, each router examines the destination IP address and chooses
    the next hop to direct the packet to the destination.


    When attackers send malformed packets to a target, these packets hop through various
    routers and gateways to reach the destination. In some cases, the routers in the
    path might include configured firewalls and IDS that block such packets. To avoid
    them, attackers enforce a loose or strict source routing mechanism, in which they
    manipulate the IP address path in the IP options field so that the packet takes
    the attacker-defined path (without firewall-/IDS-configured routers) to reach
    the destination, thereby evading firewalls and IDS.


    The figure below shows source routing, where the originator dictates the eventual
    route of the traffic.


