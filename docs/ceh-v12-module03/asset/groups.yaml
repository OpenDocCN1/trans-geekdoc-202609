    ## 端口和服务发现


    网络扫描过程中的下一步涉及检查活跃系统中的开放端口和服务。开放端口和服务的发现可通过各种端口扫描技术进行。管理员经常使用端口扫描技术来验证其网络的安全策略，而攻击者则使用它们来识别主机上的开放端口和正在运行的服务，意图入侵网络。此外，有时用户会在系统上不知情地保留不必要的开放端口。攻击者利用此类开放端口发起攻击。


    本节描述了常见的端口和相应服务，以及攻击者用于执行端口扫描的各种端口扫描技术和工具。


