    # Anonymizers


    An anonymizer is an intermediate server placed between an end user and a website
    that accesses the website on their behalf and makes web surfing activities untraceable.
    Anonymizers allow users to bypass Internet censorship. An anonymizer eliminates
    all identifying information (IP address) from the system while surfing the Internet,
    thereby ensuring privacy. It encrypts the data transferred from a computer to
    the Internet service provider (ISP). Most anonymizers can anonymize web (HTTP:),
    File Transfer Protocol (FTP:), and gopher (gopher:) Internet services.


    To visit a page anonymously, you can visit your preferred anonymizer site and
    enter the name of the target website in the anonymization field. Alternatively,
    you can set your browser home page to point to an anonymizer to anonymize subsequent
    web access. In addition, you can choose to anonymously provide passwords and other
    information to sites without revealing any additional information, such as your
    IP address. Attackers may configure an anonymizer as a permanent proxy server
    by making the site name the setting for the HTTP, FTP, Gopher, and other proxy
    options in their application configuration menu, thereby cloaking their malicious
    activities.


    # Why Use an Anonymizer?


    The reasons for using anonymizers include:


    +   - **Ensuring privacy:** Protect your identity by making your web navigation
    activities untraceable. Your privacy is maintained until and unless you disclose
    your personal information on the web, for example, by filling out forms.

    +   - **Accessing government-restricted content:** Most governments prevent their
    citizens from accessing certain websites or content deemed inappropriate or sensitive.
    However, these sites can still be accessed using an anonymizer located outside
    the target country.'
  - '[PAGE 117]


    +   - **Protection against online attacks**: An anonymizer can protect you from
    all instances of online pharming attacks by routing all customer Internet traffic
    via its protected DNS server.

    +   - **Bypassing IDS and firewall rules**: Firewalls are typically bypassed by
    employees or students accessing websites that they are not supposed to access.
    An anonymizer service gets around your organization’s firewall by setting up a
    connection between your computer and the anonymizer service. Thus, firewalls see
    only the connection from your computer to the anonymizer’s web address. The anonymizer
    will subsequently connect to any website (e.g., Twitter) with the help of an Internet
    connection and then direct the content back to you. To your organization, your
    system appears to be simply connected to the anonymizer’s web address but not
    to the actual site that you are browsing.


    In addition to protecting users'' identities, anonymizers can also be used to
    attack a website without being traced.


    # Types of Anonymizers


    Anonymizers are of two basic types: networked anonymizers and single-point anonymizers.


    # Networked Anonymizers


    A networked anonymizer first transfers your information through a network of Internet-connected
    computers before passing it on to the website. Because the information passes
    through several Internet computers, it becomes cumbersome for anyone trying to
    track your information to establish the connection between you and the anonymizer.


    **Example**: If you want to visit any web page, you have to make a request. The
    request will first pass through A, B, and C Internet computers before going to
    the website.


    **Advantage**: Complication of the communications makes traffic analysis complex.


    **Disadvantage**: Any multi-node network communication incurs some degree of risk
    of compromising confidentiality at each node.


    # Single-Point Anonymizers


    Single-point anonymizers first transfer your information through a website before
    sending it to the target website and then pass back the information gathered from
    the target website to you via the website to protect your identity.


    **Advantage**: Arms-length communication hides the IP address and related identifying
    information.


    **Disadvantage**: It offers less resistance to sophisticated traffic analysis.


    Anonymizer tools use various techniques such as SSH, VPN, and HTTP proxies, which
    allow access to blocked or censored content on the Internet with advertisements
    omitted.'
