    # Packet Fragmentation


    Packet fragmentation refers to the splitting of a probe packet into several smaller
    packets (fragments) while sending it to a network. When these packets reach a
    host, the IDS and firewalls behind the host generally queue all of them and process
    them one by one. However, since this method of processing involves greater CPU
    and network resource consumption, the configuration of most IDS cause them to
    skip fragmented packets during port scans.


    Therefore, attackers use packet fragmentation tools such as Nmap and fragroute
    to split the probe packet into smaller packets that circumvent the port-scanning
    techniques employed by IDS. Once these fragments reach the destined host, they
    are reassembled to form a single packet.


    # SYN/FIN Scanning Using IP Fragments


    SYN/FIN scanning using IP fragments is not a new scanning method but a modification
    of previous techniques. This process of scanning was developed to avoid false
    positives generated by other scans because of a packet filtering device on the
    target system. The TCP header splits into several packets to evade the packet
    filter. For any transmission, every TCP header must have the source and destination
    port for the initial packet (8-octet, 64-bit). The initialized flags in the next
    packet allow the remote host to reassemble the packets upon receipt via an Internet
    protocol module that detects the fragmented data packets using field-equivalent
    values of the source, destination, protocol, and identification.'
