    # Port Scanning Techniques


    The port scanning techniques are categorized according to the type of protocol
    used for communication


    ![](img/198108450322f24970ade227cbf24f47_44_0.png)


    # Port Scanning Techniques (Cont’d)


    | Scanning Technique | Nmap Command | Request | Response | Advantages | Disadvantages
    |

    |---|---|---|---|---|---|

    | TCP Connect/Full-Open Scan | nmap -sT -v <Target IP Address> | SYN packets |
    ✓ SYN+ACK packet response - Port is open

    ✓ RST packet response - Port is closed | ✓ Does not require super-user privileges
    | ✓ Easily detectable and filterable

    ✓ The logs in the target system disclose the connection |

    | Stealth Scan (Half-Open Scan) | nmap -sS -v <Target IP Address> | Single SYN
    packet | ✓ SYN+ACK packet response - Port is open

    ✓ RST packet response - Port is closed | ✓ Bypasses firewall rules and logging
    mechanisms |  |

    | Inverse TCP Flag Scan | nmap -(sF, -sN, -sX) -v <Target IP Address> | Probe
    packet (FIN/URG/PSH/N ULL) | ✓ No response - Port is open

    ✓ RST packet response - Port is closed | ✓ Avoids many IDS and logging systems;
    highly stealthy | ✓ Requires raw access to network sockets and super-user privileges

    ✓ Not effective against Microsoft Windows hosts, in particular |

    | Xmas Scan | nmap -sX -v <Target IP Address> | Probe packet (FIN + URG + PSH)
    | ✓ No response - Port is open

    ✓ RST packet response - Port is closed | ✓ Avoids IDS and the TCP three-way handshake
    | ✓ Works only when systems are compliant with the RFC 793-based TCP/IP implementation

    ✓ Works on the Unix platform only

    ✓ Does not work against any current version of Microsoft Windows |'
