    +   - Implement dynamic IPv6 address variation using a random address generator
    to reduce the time of active vulnerability.

    +   - Configure routers to send encoded information about fragmented packets entering
    the network.

    +   - Configure routers to verify the data packets using their signatures by storing
    the arriving data packet digests.

    +   - Configure routers to hide intranet hosts from the external network by implementing
    modifications to the network address translation (NAT).

    +   - Configure internal switches to table the DHCP static addresses to filter
