    Figure 3.39: Inverse TCP flag scan when port is open


    ![](img/198108450322f24970ade227cbf24f47_51_0.png)


    Figure 3.40: Inverse TCP flag scan when port is closed


    Security mechanisms such as firewalls and IDS detect the SYN packets sent to the
    sensitive ports of the targeted hosts. Programs such as Syslog are available to
    log half-open SYN flag scan attempts. At times, the probe packets enabled with
    TCP flags can pass through filters undetected, depending on the security mechanisms
    installed.


    An inverted technique involves probing a target using a half-open SYN flag because
    the closed ports can only send the response back. According to RFC 793, an RST/ACK
    packet is sent for connection reset when the host closes a port. Attackers take
    advantage of this feature to send TCP probe packets to each port of the target
    host with various TCP flags set.


    Common flag configurations used for a probe packet include:


    - A FIN probe with the FIN TCP flag set

    - An Xmas probe with the FIN, URG, and PSH TCP flags set

    - A NULL probe with no TCP flags set

    - A SYN/ACK probe


    All closed ports on the targeted host will send an RST/ACK response. Since OSs
    such as Windows completely ignore the RFC 793 standard, you cannot see the RST/ACK
    response when connected to a closed port on the target host. However, this technique
    is effective when used with UNIX-based OSs.


    ## Advantages


    - Avoids many IDS and logging systems; highly stealthy


    ## Disadvantages


    - Requires raw access to network sockets and super-user privileges

