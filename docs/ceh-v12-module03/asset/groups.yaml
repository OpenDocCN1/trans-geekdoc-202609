    # OS Discovery using Nmap Script Engine


    Source: https://nmap.org


    Nmap Scripting Engine (NSE) in Nmap can be used to automate a wide variety of
    networking tasks by allowing users to write and share scripts. These scripts can
    be executed parallelly with the same efficiency and speed as Nmap. Attackers can
    also use various scripts in the Nmap Script Engine for performing OS discovery
    on the target machine. For example, in Nmap, smb-os-discovery is an inbuilt script
