    # Nmap Scan Time Reduction Techniques


    In Nmap, **performance** and **accuracy** can be achieved by reducing the scan
    timing


    # Scan Time Reduction Techniques


    +   1. Omit Non-critical Tests

    +   2. Optimize Timing Parameters

    +   3. Separate and Optimize UDP Scans

    +   4. Upgrade Nmap

    +   5. Execute Concurrent Nmap Instances

    +   6. Scan from a Favorable Network Location

    +   7. Increase Available Bandwidth and CPU Time


    # Nmap Scan Time Reduction Techniques


    In Nmap, performance and accuracy take high priority, and this only be achieved
    only by reducing the long scan time. The important techniques for reducing the
    scan time are as follows:


    # Omit Non-critical Tests


    While performing the Nmap scan, the time complexity can be reduced by the following
    methods:


    +   - Avoiding an intense scan if only a minimal amount of information is required.

    +   - The number of ports scanned can be limited using specific commands.

    +   - The port scan (`-sn`) can be skipped if and only if one has to check whether
    the hosts are online or not.

    +   - Advanced scan types (`-sC`, `-sV`, `-O`, `--traceroute`, and `-A`) can be
    avoided.

    +   - The DNS resolution should be turned on only when it is necessary.


    # Optimize Timing Parameters


    To control the scan activity, Nmap provides the `-T` option for scanning ranging
    from high-level to low-level timing aggressiveness. This can be extremely useful
    for scanning highly filtered networks.


    # Separate and Optimize UDP Scans


    As many vulnerable services use the UDP protocol, scanning the UDP protocol is
    vital, and it should be scanned separately, as TCP scans have different performance
    requirements and timing characteristics. Moreover, the UDP scan is more affected
    by the ICMP error rate-limiting compared to the TCP scan.'
  - '[PAGE 73]


    +   - **Upgrade Nmap**

    +     It is always advisable to use the upgraded version of Nmap as it contains
    many bug fixes, important algorithmic enhancements, and high-performance features
    such as local network ARP scanning.

    +   - **Execute Concurrent Nmap Instances**

    +     Running Nmap against the whole network usually makes the system slower and
    less efficient. Nmap supports parallelization and it can also be customized according
    to specific needs. It becomes very efficient by getting an idea of the network
    reliability while scanning a larger group. The overall speed of the scan can be
    improved by dividing it into many groups and running them simultaneously.

    +   - **Scan from a Favorable Network Location**

    +     It is always advisable to run Nmap from the host’s local network to the
    target while in the internal network, as it offers defense-in-depth security.
    External scanning is obligatory when performing firewall testing or when the network
    should be monitored from the external attacker’s viewpoint.

    +   - **Increase Available Bandwidth and CPU Time**

    +     By increasing the available bandwidth or CPU power, the Nmap scan time can
    be reduced. This can be done by installing a new data line or stopping any running
    applications. Nmap is controlled by its own congestion control algorithms, so
    that network flooding can be prevented. This improves its accuracy. The Nmap bandwidth
    usage can be tested by running it in the verbose mode `-v`.'
