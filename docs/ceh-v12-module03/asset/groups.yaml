    ## Inverse TCP Flag Scan


    Attackers send TCP probe packets with a TCP flag (FIN, URG, PSH) set or with no
    flags. When the port is open, the attacker does not get any response from the
    host, whereas when the port is closed, he or she receives the RST from the target
