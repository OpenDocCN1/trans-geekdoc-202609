    # How to Identify Target System OS


    Identifying the target OS is one of the important tasks for an attacker to compromise
    the target network/machine. In a network, various standards are implemented to
    allow different OSs to communicate with each other. These standards govern the
    functioning of various protocols such as IP, TCP, UDP, etc. By analyzing certain
    parameters/fields in these protocols, one can reveal the details of the OS. Parameters
    such as Time to Live (TTL) and TCP window size in the IP header of the first packet
    in a TCP session help identify the OS running on the target machine. The TTL field
    determines the maximum time that a packet can remain in a network, and the TCP
    window size determines the length of the packet reported. These values vary among
    OSs, as described in the following table:


    | Operating System | Time To Live | TCP Window Size |

    |---|---|---|

    | Linux | 64 | 5840 |

    | FreeBSD | 64 | 65535 |

    | OpenBSD | 255 | 16384 |

    | Windows | 128 | 65,535 bytes to 1 Gigabyte |

    | Cisco Routers | 255 | 4128 |

    | Solaris | 255 | 8760 |

    | AIX | 255 | 16384 |


    Table 3.2: TTL and TCP Window size values for OS'
