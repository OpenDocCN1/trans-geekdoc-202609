    # TCP Communication Flags


    ![](img/198108450322f24970ade227cbf24f47_7_0.png)


    Standard TCP communications are controlled by flags in the TCP packet header


    # TCP Communication Flags


    The TCP header contains various flags that control the transmission of data across
    a TCP connection. Six TCP control flags manage the connection between hosts and
    give instructions to the system. Four of these flags (SYN, ACK, FIN, and RST)
    govern the establishment, maintenance, and termination of a connection. The other
    two flags (PSH and URG) provide instructions to the system. The size of each flag
    is 1 bit. As there are six flags in the TCP Flags section, the size of this section
    is 6 bits. When a flag value is set to “1,” that flag is automatically turned
    on.


    ![](img/198108450322f24970ade227cbf24f47_7_1.png)


    Figure 3.2: TCP header format'
