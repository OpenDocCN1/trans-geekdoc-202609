    Figure 3.28: TCP ACK ping scan for host discovery


    ### Advantages:

    - Both the SYN and the ACK packet can be used to maximize the chances of bypassing
    the firewall. However, firewalls are mostly configured to block the SYN ping packets,
    as they are the most common pinging technique. In such cases, the ACK probe can
    be effectively used to bypass these firewall rule sets easily.


    ![](img/198108450322f24970ade227cbf24f47_36_1.png)


    Figure 3.29: TCP ACK ping scan in Zenmap


    ## IP Protocol Ping Scan


    IP protocol ping is the latest host discovery option that sends IP ping packets
    with the IP header of any specified protocol number. It has the same format as
    the TCP and UDP ping. This technique tries to send different packets using different
    IP protocols, hoping to get a response indicating that a host is online.

    '
  mdcn: '

    ![](img/198108450322f24970ade227cbf24f47_30_0.png)


    图 3.18：UDP ping 扫描以确定主机是否离线


    ### 优点：

    - UDP ping 扫描的优势在于能够检测到防火墙后具有严格 TCP 过滤的系统，而 UDP 流量则被忽略。


    ![](img/198108450322f24970ade227cbf24f47_30_1.png)


    图 3.19：Zenmap 中的 UDP ping 扫描


    ## ICMP ECHO Ping 扫描


    攻击者使用 ICMP ping 扫描向目标系统发送 ICMP 数据包以收集其所有必要信息。这是因为 ICMP 不包含端口抽象，与端口扫描不同。然而，通过 ping
    所有主机，它有助于确定网络中哪些主机正在运行。


    ICMP ECHO ping 扫描涉及向主机发送 ICMP ECHO 请求。如果主机处于活动状态，它将返回 ICMP ECHO 回复。此扫描有助于定位活动设备或确定
    ICMP 是否通过防火墙。


    ![](img/198108450322f24970ade227cbf24f47_30_2.png)


    图 3.20：ICMP echo 请求和回复


    UNIX/Linux 和基于 BSD 的机器使用 ICMP echo 扫描；这些操作系统中的 TCP/IP 栈实现会响应发往广播地址的 ICMP echo
    请求。此技术在基于 Windows 的网络上不起作用，因为其 TCP/IP 栈实现不会回复发往广播地址的 ICMP 探测。


    Nmap 使用 -P 选项对目标进行 ICMP 扫描。用户还可以使用 -L 选项增加并行 ping 的数量。使用 -T 选项调整 ping 超时值也可能很有用。


    在 Zenmap 中，使用 -PE 选项执行 ICMP ECHO ping 扫描。活动主机显示为“Host is up”，如屏幕截图所示。


    ![](img/198108450322f24970ade227cbf24f47_31_0.png)


    图 3.21：使用 Zenmap 的 ICMP Echo ping 扫描输出


    ## ICMP ECHO Ping Sweep


    ping sweep（也称为 ICMP sweep）是一种基本网络扫描技术，用于确定映射到活动主机（计算机）的 IP 地址范围。虽然单个 ping 会告诉用户指定的主机计算机是否存在于网络上，但
    ping sweep 包括向多个主机发送 ICMP ECHO 请求。如果指定的主机处于活动状态，它将返回 ICMP ECHO 回复。


    ping sweep 是用于扫描网络的最古老和最慢的方法之一。此实用程序分布在几乎所有平台上，并充当系统的点名；网络上处于活动状态的系统会回答另一系统发出的
    ping 查询。


    ICMP echo 扫描 ping 目标网络中的所有机器以发现活动机器。攻击者向广播或网络地址发送 ICMP 探测，该地址会中继到子网中的所有主机地址。活动系统将向
    ICMP echo 探测的来源发送 ICMP echo 回复消息。


    ![](img/198108450322f24970ade227cbf24f47_32_0.png)


    图 3.22：ICMP ECHO Ping Sweep


    为了更好地理解 ping，应该能够理解 TCP/IP 数据包。当系统执行 ping 时，它会向特定 IP 地址发送一个数据包到网络上。此数据包包含 64 字节（56
    字节数据和 8 字节协议头信息）。发送方随后等待或监听来自目标系统的返回数据包。如果连接良好且目标计算机“存活”，则预期会收到良好的返回数据包。然而，如果通信中断，则不会如此。Ping
    还会详细说明数据包完成一次往返所需的时间，称为“往返时间”。它们还有助于解析主机名。在这种情况下，如果数据包发送到 IP 地址时被弹回，但发送到名称时没有，则系统无法将名称与特定
    IP 地址对应。


    攻击者使用子网掩码计算器计算子网掩码以识别子网中存在的数量主机。随后他们使用 ping sweep 创建子网中活动系统的清单。


    ### 使用 Nmap 的 ICMP ECHO Ping Sweep


    来源：https://nmap.org


    Nmap 帮助攻击者执行 ping sweep，从一系列 IP 地址中确定活动主机。在 Zenmap 中，使用 -PE 选项配合 IP 地址列表执行 ICMP
    ECHO ping sweep。


    ![](img/198108450322f24970ade227cbf24f47_33_0.png)


    图 3.23：使用 Zenmap 的 Ping Sweep 输出


    ## ICMP 时间戳 Ping 扫描


    除了传统的 ICMP ECHO ping 之外，还有一些其他类型的 ICMP ping 技术，例如 ICMP 时间戳 ping 扫描和 ICMP 地址掩码
    ping 扫描，攻击者可在特定条件下采用。


    ICMP 时间戳 ping 是一种可选的附加 ICMP ping 类型，其中攻击者查询时间戳消息以获取与目标主机当前时间相关的信息。目标机器会对收到的每个时间戳查询作出时间戳回复。然而，目标主机的响应是条件性的，具体取决于目标端管理员的配置，它可能回复时间值也可能不回复。此
    ICMP 时间戳 ping 通常用于时间同步。这种 ping 方法在确定目标主机是否处于活动状态方面很有效，特别是当管理员阻止传统的 ICMP ECHO ping
    请求时。在 Zenmap 中，使用 -PP 选项执行 ICMP 时间戳 ping 扫描。


    ![](img/198108450322f24970ade227cbf24f47_34_0.png)


    图 3.24：Zenmap 中的 ICMP 时间戳 ping


    ## ICMP 地址掩码 Ping 扫描


    ICMP 地址掩码 ping 是传统 ICMP ECHO ping 的另一种替代方案，其中攻击者向目标主机发送 ICMP 地址掩码查询以获取与子网掩码相关的信息。然而，目标主机的地址掩码响应是条件性的，具体取决于目标端管理员的配置，它可能回复适当的子网值也可能不回复。这种
    ping 方法在识别活动主机方面也同样有效，类似于 ICMP 时间戳 ping，特别是当管理员阻止传统的 ICMP Echo ping 时。在 Zenmap
    中，使用 -PM 选项执行 ICMP 地址掩码 ping 扫描。


    ![](img/198108450322f24970ade227cbf24f47_34_1.png)


    图 3.25：Zenmap 中的 ICMP 地址掩码 ping


    ## TCP SYN Ping 扫描


    TCP SYN ping 是一种主机发现技术，用于探测不同端口以确定端口是否在线并检查是否遇到任何防火墙规则集。在这种主机发现技术中，攻击者使用 Nmap
    工具通过向目标主机发送空的 TCP SYN 标志来发起三次握手。接收到 SYN 后，目标主机使用 ACK 标志确认接收。接收到 ACK 标志后，攻击者确认目标主机处于活动状态，并通过向目标主机发送
    RST 标志来终止连接（因为其主机发现目标已完成）。端口 80 用作默认目标端口。此类 ping 格式中也可以指定一系列端口，且 -PS 与端口号之间不插入空格（例如
    PS22-25,80,113,1050,35000），其中探测将并行针对每个端口执行。在 Zenmap 中，使用 -PS 选项执行 TCP SYN ping
    扫描。


    ![](img/198108450322f24970ade227cbf24f47_35_0.png)


    图 3.26：用于主机发现的 TCP SYN ping 扫描


    ### 优点：

    - 由于机器可以并行扫描，扫描在等待响应时永远不会出现超时错误。

    - TCP SYN ping 可用于在不建立任何连接的情况下确定主机是否处于活动状态。因此，日志不会在系统或网络级别记录，使攻击者能够不留下检测痕迹。


    ![](img/198108450322f24970ade227cbf24f47_35_1.png)


    图 3.27：Zenmap 中的 TCP SYN ping 扫描


    ## TCP ACK Ping 扫描


    TCP ACK ping 与 TCP SYN ping 类似，但略有差异。TCP ACK ping 也使用默认端口 80。在 TCP ACK ping 技术中，攻击者直接向目标主机发送空的
    TCP ACK 数据包。由于攻击者与目标主机之间没有先前的连接，接收到 ACK 数据包后，目标主机将使用 RST 标志响应以终止请求。攻击者端接收到此 RST
    数据包表明主机处于活动状态。在 Zenmap 中，使用 -PA 选项执行 TCP ACK ping 扫描。


    ![](img/198108450322f24970ade227cbf24f47_36_0.png)


    图 3.28：用于主机发现的 TCP ACK ping 扫描


    ### 优点：

    - SYN 和 ACK 数据包都可用于最大化绕过防火墙的机会。然而，防火墙大多配置为阻止 SYN ping 数据包，因为它们是最常见的 ping 技术。在这种情况下，ACK
    探测可以有效地轻松绕过这些防火墙规则集。


    ![](img/198108450322f24970ade227cbf24f47_36_1.png)


    图 3.29：Zenmap 中的 TCP ACK ping 扫描


    ## IP 协议 Ping 扫描


    IP 协议 ping 是最新的主机发现选项，它发送带有任何指定协议号的 IP 头的 IP ping 数据包。其格式与 TCP 和 UDP ping 相同。此技术尝试使用不同的
    IP 协议发送不同的数据包，希望获得表明主机在线的响应。

    '
