    ## 数据包分片


    - 数据包分片是指在向网络发送时将探测数据包 **拆分为多个较小的包**（片段）

    - 它不是一种新的扫描方法，而是之前技术的 **修改**

    - **TCP 头部** 被拆分为多个数据包，以便数据包过滤器无法检测数据包的意图


    ## 使用 IP 片段进行 SYN/FIN 扫描


    ![](img/198108450322f24970ade227cbf24f47_90_0.png)


    ![](img/198108450322f24970ade227cbf24f47_90_1.png)


    ## 数据包分片


    数据包分片是指在向网络发送时将探测数据包拆分为多个较小的包（片段）。当这些数据包到达主机时，主机后面的 IDS 和防火墙通常会将它们全部排队并逐一处理。然而，由于这种处理方法涉及更大的
    CPU 和网络资源消耗，大多数 IDS 的配置会导致它们在端口扫描期间跳过分片数据包。


    因此，攻击者使用 Nmap 和 fragroute 等数据包分片工具将探测数据包拆分为较小的包，以规避 IDS 采用的端口扫描技术。一旦这些片段到达目标主机，它们将被重新组装成单个数据包。


    ## 使用 IP 片段进行 SYN/FIN 扫描


    使用 IP 片段进行 SYN/FIN 扫描不是一种新的扫描方法，而是之前技术的修改。这种扫描过程是为了避免由于目标系统上的数据包过滤设备而产生的其他扫描产生的误报。TCP
    头部被拆分为多个数据包以规避数据包过滤器。对于任何传输，每个 TCP 头部必须具有初始数据包的源端口和目标端口（8 字节，64 位）。下一数据包中初始化的标志允许远程主机通过
    Internet 协议模块在接收时重新组装数据包，该模块使用源、目标、协议和标识的字段等值检测分片数据包。


