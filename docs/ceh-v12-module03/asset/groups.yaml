    # Proxy Servers


    A proxy server is an application that can serve as an intermediary for connecting
    with other computers.


    A proxy server is used:


    +   - As a firewall and to protect the local network from external attacks.

    +   - As an IP address multiplexer that allows several computers to connect to
    the Internet when you have only one IP address (NAT/PAT).

    +   - To anonymize web surfing (to some extent).

    +   - To extract unwanted content, such as ads or “unsuitable” material (using
    specialized proxy servers).

    +   - To provide some protection against hacking attacks.

    +   - To save bandwidth.


    # How does a proxy server work?


    Initially, when you use a proxy to request a particular web page on an actual
    server, the proxy server receives it. The proxy server then sends your request
    to the actual server on your behalf. It mediates between you and the actual server
    to transmit and respond to the request, as shown in the figure below.'
