    ## IDS/防火墙规避技术


    尽管防火墙和 IDS 可以防止恶意流量（数据包）进入网络，但攻击者可以通过实施以下技术发送能够规避 IDS/防火墙的预期数据包到目标：


    - 数据包分片

    - 源路由

    - 源端口操作

    - IP 地址诱饵

    - IP 地址欺骗

    - MAC 地址欺骗

