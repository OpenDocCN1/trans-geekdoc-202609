    count to detect the spoofed packets. Deduct the TTL value in the reply from the
    initial TTL value to determine the hop count. The packet is a spoofed packet if
    the reply TTL does not match the TTL of the packet. It will be very easy to launch
    an attack if the attacker knows the hop count between the source and the host.
    In this case, the test result is a false negative.'
