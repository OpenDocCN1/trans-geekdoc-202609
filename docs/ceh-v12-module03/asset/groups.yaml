    ## MODULE 03


    ## SCANNING NETWORKS


    ![](img/198108450322f24970ade227cbf24f47_0_0.png)


    ## LEARNING OBJECTIVES


    ![](img/198108450322f24970ade227cbf24f47_2_0.png)


    - LO#01: Explain Network Scanning Concepts

    - LO#02: Use Various Network Scanning Tools

    - LO#03: Demonstrate Various Scanning Techniques for Host Discovery

    - LO#04: Demonstrate Various Scanning Techniques for Port and Service Discovery

    - LO#05: Demonstrate Various Scanning Techniques for OS Discovery

    - LO#06: Demonstrate Various Techniques for Scanning Beyond IDS and Firewall

    - LO#07: Explain Network Scanning Countermeasures


    ### Learning Objectives


    After identifying the target and performing the initial reconnaissance, as discussed
    in the Footprinting and Reconnaissance module, attackers begin to search for an
    entry point into the target system. Attackers should determine whether the target
    systems are active or inactive to reduce the time spent on scanning. Notably,
    the scanning itself is not the actual intrusion but an extended form of reconnaissance
    in which the attacker learns more about his/her target, including information
    about OSs, services, and any configuration lapses. The information gleaned from
    such reconnaissance helps the attacker select strategies for attacking the target
    system or network.


    This module starts with an overview of network scanning and provides insights
    into various host discovery techniques that can be used to check for live and
    active systems. Furthermore, it discusses various port and service discovery techniques,
    operating system discovery techniques, and techniques for scanning beyond IDS
    and firewalls. Finally, it ends with an overview of drawing network diagrams.


    At the end of this module, you will be able to:


    - Describe the network scanning concepts

    - Use various scanning tools

    - Perform host discovery to check for live systems

    - Perform port and service discovery using various scanning techniques

    - Perform operating system (OS) discovery

    - Scan beyond intrusion detection systems (IDS) and firewalls

    - Explain various network scanning countermeasures


    ## LO#01: Explain Network Scanning Concepts


    ### Network Scanning Concepts


    As already discussed, footprinting is the first phase of hacking, in which the
    attacker gains primary information about a potential target. He/she then uses
    this information in the scanning phase to gather more details about the target.


    ## Overview of Network Scanning


    ![](img/198108450322f24970ade227cbf24f47_4_0.png)


    - Network scanning refers to a set of procedures used for identifying hosts, ports,
    and services in a network

    - Network scanning is one of the components of intelligence gathering which can
    be used by an attacker to create a profile of the target organization


    ![](img/198108450322f24970ade227cbf24f47_4_1.png)


    ### Objectives of Network Scanning


    - To discover live hosts, IP address, and open ports of live hosts

    - To discover operating systems and system architecture

    - To discover services running on hosts

    - To discover vulnerabilities in live hosts


    ![](img/198108450322f24970ade227cbf24f47_4_2.png)


    ### Overview of Network Scanning


    Scanning is the process of gathering additional detailed information about the
    target using highly complex and aggressive reconnaissance techniques. Network
    scanning refers to a set of procedures used for identifying hosts, ports, and
    services in a network. Network scanning is also used for discovering active machines
    in a network and identifying the OS running on the target machine. It is one of
    the most important phases of intelligence gathering for an attacker, which enables
    him/her to create a profile of the target organization. In the process of scanning,
    the attacker tries to gather information, including the specific IP addresses
    that can be accessed over the network, the target’s OS and system architecture,
    and the ports along with their respective services running on each computer.


    ![](img/198108450322f24970ade227cbf24f47_4_3.png)


    Figure 3.1: Network scanning process


    The purpose of scanning is to discover exploitable communications channels, probe
    as many listeners as possible, and track the ones that are responsive or useful
    to an attacker’s particular needs. In the scanning phase of an attack, the attacker
    tries to find various ways to intrude into a target system. The attacker also
    tries to discover more information about the target system to determine the presence
    of any configuration lapses. The attacker then uses the information obtained to
    develop an attack strategy.


    ## Types of Scanning


    - **Port Scanning** – Lists the open ports and services. Port scanning is the
    process of checking the services running on the target computer by sending a sequence
    of messages in an attempt to break in. Port scanning involves connecting to or
    probing TCP and UDP ports of the target system to determine whether the services
    are running or are in a listening state. The listening state provides information
    about the OS and the application currently in use. Sometimes, active services
    that are listening may allow unauthorized users to misconfigure systems or to
    run software with vulnerabilities.

    - **Network Scanning** – Lists the active hosts and IP addresses. Network scanning
    is a procedure for identifying active hosts on a network, either to attack them
    or assess the security of the network.

    - **Vulnerability Scanning** – Shows the presence of known weaknesses. Vulnerability
    scanning is a method for checking whether a system is exploitable by identifying
    its vulnerabilities. A vulnerability scanner consists of a scanning engine and
    a catalog. The catalog includes a list of common files with known vulnerabilities
    and common exploits for a range of servers. A vulnerability scanner may, for example,
    look for backup files or directory traversal exploits. The scanning engine maintains
    logic for reading the exploit list, transferring the request to the web server,
    and analyzing the requests to ensure the safety of the server. These tools generally
    target vulnerabilities that secure host configurations can fix easily through
    updated security patches and a clean web document.


    A thief who wants to break into a house looks for access points such as doors
    and windows. These are usually the house’s points of vulnerability, as they are
    easily accessible. When it comes to computer systems and networks, ports are the
    doors and windows of a system that an intruder uses to gain access. A general
    rule for computer systems is that the greater the number of open ports on a system,
    the more vulnerable is the system. However, there are cases in which a system
    with fewer open ports than another machine presents a much higher level of vulnerability.


    ## Objectives of Network Scanning


    The more the information at hand about a target organization, the higher are the
    chances of knowing a network’s security loopholes, and, consequently, for gaining
    unauthorized access to it.


    Some objectives for scanning a network are as follows:


    - Discover the network’s live hosts, IP addresses, and open ports of the live
    hosts. Using the open ports, the attacker will determine the best means of entering
    into the system.

    - Discover the OS and system architecture of the target. This is also known as
    fingerprinting. An attacker can formulate an attack strategy based on the OS’s
    vulnerabilities.

    - Discover the services running/listening on the target system. Doing so gives
    the attacker an indication of the vulnerabilities (based on the service) that
    can be exploited for gaining access to the target system.

    - Identify specific applications or versions of a particular service.


    ## TCP Communication Flags


    ![](img/198108450322f24970ade227cbf24f47_7_0.png)


    Standard TCP communications are controlled by flags in the TCP packet header


    ### TCP Communication Flags


    The TCP header contains various flags that control the transmission of data across
    a TCP connection. Six TCP control flags manage the connection between hosts and
    give instructions to the system. Four of these flags (SYN, ACK, FIN, and RST)
    govern the establishment, maintenance, and termination of a connection. The other
    two flags (PSH and URG) provide instructions to the system. The size of each flag
    is 1 bit. As there are six flags in the TCP Flags section, the size of this section
    is 6 bits. When a flag value is set to “1,” that flag is automatically turned
    on.


    ![](img/198108450322f24970ade227cbf24f47_7_1.png)


    Figure 3.2: TCP header format

