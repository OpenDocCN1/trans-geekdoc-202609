    ## SSDP and List Scan

    ## SSDP 和列表扫描


    ### SSDP Scan

    ### SSDP 扫描

    Simple Service Discovery Protocol (SSDP) is a network protocol that generally
    communicates with machines when querying them with routable IPv4 or IPv6 multicast
    addresses. The SSDP service controls communication for the Universal Plug and
    Play (UPnP) feature. It generally works when the machine is not firewalled; however,
    it can sometimes work through a firewall. The SSDP service will respond to a query
    sent over IPv4 or IPv6 broadcast addresses. This response includes information
    about the UPnP feature associated with it. The attacker uses SSDP scanning to
    detect UPnP vulnerabilities that may allow him/her to launch buffer overflow or
    DoS attacks.


    Simple Service Discovery Protocol (SSDP) 是一种网络协议，通常在用可路由的 IPv4 或 IPv6 组播地址查询机器时与机器通信。SSDP
    服务控制通用即插即用（UPnP）功能的通信。它通常在机器未被防火墙保护时工作；然而，有时它也可以通过防火墙工作。SSDP 服务会响应通过 IPv4 或 IPv6
    广播地址发送的查询。此响应包括与其关联的 UPnP 功能的信息。攻击者使用 SSDP 扫描来检测 UPnP 漏洞，这些漏洞可能允许他/她发起缓冲区溢出或 DoS
    攻击。


    ![](img/198108450322f24970ade227cbf24f47_67_0.png)


    Figure 3.72: UPnP SSDP M-SEARCH in Parrot Security

    图 3.72：Parrot Security 中的 UPnP SSDP M-SEARCH


    The attacker may use the UPnP SSDP M-SEARCH information discovery tool to check
    whether the machine is vulnerable to UPnP exploits. The UPnP SSDP M-SEARCH information
    discovery tool gleans information from UPnP-enabled systems, as shown in the figure.


    攻击者可能会使用 UPnP SSDP M-SEARCH 信息发现工具来检查机器是否容易受到 UPnP 利用。UPnP SSDP M-SEARCH 信息发现工具从启用
    UPnP 的系统收集信息，如图所示。


    ### List Scan

    ### 列表扫描

    In a list scan, the discovery of the active network host is indirect. A list scan
    simply generates and prints a list of IPs/Names without actually pinging or scanning
    the hosts. As a result, the list scan shows all IP addresses as “not scanned”
    (0 hosts up). By default, a reverse DNS resolution is still carried out on each
    host by Nmap to learn their names. In Zenmap, the -sL option is used to perform
    a list scan.


    在列表扫描中，活动网络主机的发现是间接的。列表扫描只是生成并打印 IP/名称列表，而不实际 ping 或扫描主机。因此，列表扫描将所有 IP 地址显示为“未扫描”（0
    个主机启动）。默认情况下，Nmap 仍会对每个主机执行反向 DNS 解析以了解其名称。在 Zenmap 中，使用 -sL 选项执行列表扫描。


    ![](img/198108450322f24970ade227cbf24f47_68_0.png)


    Figure 3.73: List scan using Zenmap

    图 3.73：使用 Zenmap 进行列表扫描


    ### Advantages:

    ### 优点：

    - A list scan can perform a good sanity check.

    - 列表扫描可以进行良好的合理性检查。

    - The list scan detects incorrectly defined IP addresses in the command line or
    in an option file. It primarily repairs the detected errors to run any “active”
    scan.

    - 列表扫描检测命令行或选项文件中定义不正确的 IP 地址。它主要修复检测到的错误以运行任何“主动”扫描。


