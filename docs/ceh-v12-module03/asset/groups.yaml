    remote host, and the responses are compared with a database. Responses from different
    OS vary because of differences in TCP/IP stack implementation.


    For instance, the scanning utility Nmap uses a series of nine tests to determine
    an OS fingerprint or banner grabbing. The tests listed below provide some insights
    into an active banner grabbing attack, as described at www.packetwatch.net:


    - **Test 1:** A TCP packet with the SYN and ECN-Echo flags enabled is sent to
    an open TCP port.

    - **Test 2:** A TCP packet with no flags enabled is sent to an open TCP port.
    This type of packet is a NULL packet.

    - **Test 3:** A TCP packet with the URG, PSH, SYN, and FIN flags enabled is sent
    to an open TCP port.

    - **Test 4:** A TCP packet with the ACK flag enabled is sent to an open TCP port.

    - **Test 5:** A TCP packet with the SYN flag enabled is sent to a closed TCP port.

    - **Test 6:** A TCP packet with the ACK flag enabled is sent to a closed TCP port.

    - **Test 7:** A TCP packet with the URG, PSH, and FIN flags enabled is sent to
    a closed TCP port.

    - **Test 8 PU (Port Unreachable):** A UDP packet is sent to a closed UDP port.
    The objective is to extract an “ICMP port unreachable” message from the target
    machine.

    - **Test 9 TSeq (TCP Sequence ability test):** This test tries to determine the
    sequence generation patterns of the TCP initial sequence numbers (also known as
    TCP ISN sampling), the IP identification numbers (also known as IPID sampling),
    and the TCP timestamp numbers. It sends six TCP packets with the SYN flag enabled
    to an open TCP port.


    The objective of these tests is to find patterns in the initial sequence of numbers
    that the TCP implementations chose while responding to a connection request. They
    can be categorized into groups, such as traditional 64K (many old UNIX boxes),
    random increments (newer versions of Solaris, IRIX, FreeBSD, Digital UNIX, Cray,
    and many others), or true random (Linux 2.0.*, OpenVMS, newer AIX, etc.). Windows
    boxes use a "time-dependent" model in which the ISN is incremented by a fixed
    amount for each occurrence.


    ## Passive Banner Grabbing


    Source: https://www.broadcom.com


    Like active banner grabbing, passive banner grabbing also depends on the differential
    implementation of the stack and the various ways in which an OS responds to packets.
    However, instead of relying on scanning the target host, passive fingerprinting
    captures packets from the target host via sniffing to study telltale signs that
    can reveal an OS.


    Passive banner grabbing includes:


    - **Banner grabbing from error messages**: Error messages provide information,
    such as type of server, type of OS, and SSL tools used by the target remote system.

    - **Sniffing the network traffic**: Capturing and analyzing packets from the target
    enables an attacker to determine the OS used by the remote system.

    - **Banner grabbing from page extensions**: Looking for an extension in the URL
    may help in determining the application version. For example, .aspx => IIS server
    and Windows platform.


    The four areas that typically determine the OS are given below:


    - TTL (time to live) of the packets: What does the OS set as the Time To Live
    on the outbound packet?

    - Window Size: What is the Window size set by the OS?

    - Whether the DF (Don’t Fragment) bit is set: Does the OS set the DF bit?

    - TOS (Type of Service): Does the OS set the TOS, and if so, what setting is it?


    Passive fingerprinting is neither fully accurate nor limited to these four signatures.
    However, one can improve its accuracy by looking at several signatures and combining
    the information.


    The following is an analysis of a sniffed packet described by Lance Spitzner in
    his paper on passive fingerprinting:


    ```

    04/20-21:41:48.129662 129.142.224.3:659 -> 172.16.1.107:604

    TCP TTL:45 TOS:0x0 ID:56257

    ***F**A* Seq: 0x9DD90553

    Ack: 0xE3C65D7 Win: 0x7D78

    ```


    According to the four criteria, the following are identified:


    - TTL: 45

    - Window Size: 0x7D78 (or 32120 in decimal)

    - DF: The DF bit is set

    - TOS: 0x0


    Compare this information with a database of signatures.


    **TTL:** The TTL from the analysis is 45. The original packet went through 19
    hops to get to the target, so it sets the original TTL to 64. Based on this TTL,
    it appears that the user sent the packet from a Linux or FreeBSD box (however,
    more system signatures need to be added to the database). This TTL confirms it
    by implementing a traceroute to the remote host. If the trace needs to be performed
    stealthily, the traceroute TTL (default 30 hops) can be set to one or two hops
    fewer than the remote host (-m option). Setting the traceroute in this manner
    reveals the path information (including the upstream provider) without actually
    contacting the remote host.


    **Window Size:** In this step, the window sizes are compared. The window size
    is another effective tool for determining precisely what window size is used and
    how often it is changed. In the previous signature, the window size is set at
    0x7D78, which is the default window size used by Linux. In addition, FreeBSD and
    Solaris tend to maintain the same window size throughout a session. However, Cisco
    routers and Microsoft Windows NT window sizes constantly change. The window size
    is more accurate when measured after the initial three-way handshake (due to TCP
    slow start).


    **DF bit:** Most systems use the DF bit set; hence, this is of limited value.
    However, this makes it easier to identify a few systems that do not use the DF
    flag (such as SCO or OpenBSD).


    **TOS:** TOS is also of limited value, as it seems to be more session-based than
    OS-based. In other words, it is not so much the OS as the protocol used that determines
    the TOS to a large extent.


    Using the information obtained from the packet, specifically the TTL and the window
    size, one can compare the results with the database of signatures and determine
    the OS with some degree of confidence (in this case, Linux kernel 2.2.x).


    Passive fingerprinting, like active fingerprinting, has some limitations. First,
    applications that build their own packets (e.g., Nmap, Hunt, Nemesis, etc.) will
    not use the same signatures as the OS. Second, it is relatively simple for a remote
    host to adjust the TTL, window size, DF, or TOS setting on the packets.


    Passive fingerprinting has several other uses. For example, attackers can use
    stealthy fingerprinting to determine the OS of a potential target such as a web
    server. A user only needs to request a web page from the server and then analyze
    the sniffer traces. This bypasses the need for using an active tool that various
    IDS systems can detect. Passive fingerprinting also helps in identifying remote
    proxy firewalls. It may be possible to ID proxy firewalls from the signatures
    as discussed above, simply because proxy firewalls rebuild connections for clients.
    Similarly, passive fingerprinting can be used to identify rogue systems.


    **Note:** We will discuss passive banner grabbing in later modules.


    ## Why Banner Grabbing?


    An attacker uses banner grabbing to identify the OS used on the target host and
    thus determine the system vulnerabilities and exploits that might work on that
    system to carry out further attacks.


