    ## IDLE/IPID 头部扫描

    IDLE/IPID 头部扫描是一种 TCP 端口扫描方法，可用于向计算机发送伪造的源地址以确定可用的服务。它提供了对远程主机的完全盲扫。大多数网络服务器监听
    TCP 端口；例如，Web 服务器监听 80 端口，邮件服务器监听 25 端口。如果应用程序在端口上监听，则端口被视为“开放”。确定端口是否开放的一种方法是向该端口发送“SYN”（会话建立）数据包。如果端口开放，目标机器会返回“SYN|ACK”（会话请求确认）数据包，如果端口关闭则返回“RST”（重置）数据包。接收到非请求
    SYN|ACK 数据包的机器会以 RST 响应。非请求的 RST 被忽略。互联网上的每个 IP 数据包都有一个“IP 标识符”（IPID），它唯一标识原始
    IP 数据报的片段。操作系统为每个发送的数据包增加 IPID。因此，探测 IPID 会向攻击者揭示自上次探测以来发送的数据包数量。在 Zenmap 中，使用
    -sI 选项执行 IDLE 扫描。


    ![](img/198108450322f24970ade227cbf24f47_58_0.png)


    Figure 3.58: 使用 Nmap 进行 IDLE/IPID 头部扫描


    攻击者通过伪造冒充另一台计算机来执行此扫描。攻击者不会从其 IP 地址发送数据包；相反，他们使用另一台主机，通常称为“僵尸”，来扫描远程主机并识别开放端口。在此攻击中，攻击者期望僵尸主机的序列号，如果远程主机检查扫描方的
    IP，则会显示僵尸机器的 IP。


    ## IDLE 扫描

    - 第 1 步


    空闲扫描的第一步是确定合适的僵尸。按全局方式递增分配 IPID 数据包的僵尸是执行空闲扫描的合适或空闲僵尸。攻击者-僵尸与僵尸-目标之间请求/响应时间间隔越短，扫描速度越快。


    ## 选择“僵尸”并探测其当前 IP 标识（IPID）号

    在第一步中，SYN+ACK 数据包被发送到僵尸机器以探测其 IPID 号。这里，SYN+ACK 数据包是为探测 IPID 号而发送的，而不是为了建立 TCP
    连接（三向握手）。


    ![](img/198108450322f24970ade227cbf24f47_59_0.png)


    Figure 3.59: IDLE 扫描：第 1 步


    由于僵尸不期望 SYN+ACK 数据包，它通过返回 RST 数据包来拒绝连接。僵尸机器发送的 RST 数据包被分析以提取 IPID。如图所示，我们假设僵尸以
    IPID=31337 响应。此外，我们假设 IPID 为 X。


    - 第 2 步


    攻击者向目标机器的 80 端口发送 SYN 数据包，伪造僵尸的 IP 地址。


    ## 空闲扫描：第 2.1 步（开放端口）

    如果端口开放，目标会向僵尸发送 SYN+ACK 数据包（因为 IP 地址被伪造）以继续三向握手。由于僵尸不期望来自目标机器的 SYN+ACK 数据包，它会以
    RST 数据包响应。


    ![](img/198108450322f24970ade227cbf24f47_59_1.png)


    Figure 3.60: 端口开放


    由于每个 IP 数据包都有 IPID，且每次传输都会增加一，僵尸现在使用下一个可用的 IPID，即 31338（X + 1）。


    ## 空闲扫描：第 2.2 步（关闭端口）

    假设目标上的端口已关闭。随后，在收到攻击者的 SYN 数据包后，目标以 RST 数据包响应，此后僵尸保持空闲。


    ![](img/198108450322f24970ade227cbf24f47_60_0.png)


    Figure 3.61: 端口关闭


    - 第 3 步


    现在，重复执行步骤 1 以探测 IPID 号。


    ![](img/198108450322f24970ade227cbf24f47_60_1.png)


    Figure 3.62: 空闲扫描：第 3 步


    向僵尸发送 SYN+ACK 数据包，它会返回包含 IPID 的 RST 数据包。假设目标上的端口是开放的，并且僵尸已经向目标发送了 RST 数据包，则 IPID
    号会增加 1。现在，僵尸使用下一个 IPID，即 31339（X + 2）以 RST 数据包响应攻击者。因此，IPID 增加 2，这意味着目标机器上的端口是开放的。因此，使用空闲扫描，攻击者可以通过将自己的
    IP 地址伪造成僵尸的 IP 地址来识别目标机器上的开放端口和服务。


    ## UDP 扫描


    ## UDP 原始 ICMP 端口不可达扫描

    UDP 端口扫描器使用 UDP 协议而不是 TCP。UDP 扫描没有三向握手。与 TCP 扫描相比，使用 UDP 协议可能更具挑战性，因为你可以发送数据包但无法确定主机是否存活、死亡或被过滤。然而，你可以使用一种
    ICMP 来检查端口是否开放或关闭。如果你向未绑定应用程序的端口发送 UDP 数据包，IP 栈将返回 ICMP 端口不可达数据包。如果任何端口返回 ICMP
    错误，则该端口已关闭，留下未响应的端口，如果它们是开放的或通过防火墙被过滤。


    ![](img/198108450322f24970ade227cbf24f47_61_0.png)


    Figure 3.63: UDP 扫描


    这是因为开放端口不必对探测做出确认响应，而关闭端口甚至不需要发送错误数据包。


    ## UDP 数据包

    Source: https://nmap.org


    当你向关闭的 UDP 端口发送数据包时，大多数主机都会发送 ICMP_PORT_UNREACH 错误。因此，如果 UDP 数据包或 ICMP 错误不能保证到达，你可以确定端口是否开放。因此，此类
    UDP 扫描器必须实现对似乎丢失的数据包的重传。UDP 扫描器将丢失的流量解释为开放端口。在 Zenmap 中，使用 -sU 选项执行 UDP 扫描。


    ![](img/198108450322f24970ade227cbf24f47_61_1.png)


    Figure 3.64: 使用 Zenmap 进行 UDP 扫描

