    # IP Spoofing Detection Techniques


    # Direct TTL Probes


    In this technique, you initially send a packet (ping request) to the legitimate
    host and wait for a reply. Check whether the TTL value in the reply matches with
    that of the packet you are checking. Both will have the same TTL if they are using
    the same protocol. Although the initial TTL values vary according to the protocol
    used, a few initial TTL values are commonly used. For TCP/UDP, the values are
    64 and 128; for ICMP, they are 128 and 255.


