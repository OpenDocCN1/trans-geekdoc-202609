    # TCP Connect/Full-Open Scan


    Source: https://insecure.org


    TCP Connect/Full Open Scan is one of the most reliable forms of TCP scanning.
    In TCP Connect scanning, the OS’s TCP connect() system call tries to open a connection
    to every port of interest on the target machine. If the port is listening, the
