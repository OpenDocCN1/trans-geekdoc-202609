    # Host Discovery Techniques (Cont''d)


    | Scanning Technique | Nmap Command | Request | Response | Advantages |

    |---|---|---|---|---|

    | ICMP ECHO Ping Sweep | nmap -sn -PE <Target IP Address Range> | ICMP ECHO requests
    to multiple hosts | ✓ ICMP ECHO reply - Host is active

    ✓ No response - Host is inactive | ✓ Determines the live hosts from a range of
    IP addresses

    ✓ Useful for creating an inventory of live systems in the subnet

    **Disadvantage:**

    ✓ Oldest and slowest method used to scan a network |

    | ICMP Timestamp Ping Scan | nmap -sn -PP <Target IP Address> | ICMP timestamp
    request | ✓ Timestamp reply to each timestamp request

    ✓ Response from the destination host is conditional, and it may or may not respond
    with the time value depending on its configuration by the administrator at the
    target''s end | ✓ Alternative for the conventional ICMP ECHO ping scan

    ✓ Determines whether the target host is live, specifically when the administrators
    block ICMP ECHO pings |

    | ICMP Address Mask Ping Scan | nmap -sn -PM <Target IP Address> | ICMP address
    mask request | ✓ Address mask response from the destination host is conditional,
    and it may or may not respond with the appropriate subnet value depending on its
    configuration by the administrator at the target''s end | ✓ Alternative for the
    conventional ICMP ECHO ping scan

    ✓ Determines whether the target host is live, specifically when the administrators
    block ICMP ECHO pings |

    | TCP SYN Ping Scan | nmap -sn -PS <Target IP Address> | Empty TCP SYN request
    | ✓ ACK response - Host is active

    ✓ No response - Host is inactive | ✓ Used to determine if the host is active without
    creating any connection

    ✓ Logs are not recorded at the system or network level, enabling the attacker
    to leave no traces for detection |


    # Host Discovery Techniques (Cont''d)


    | Scanning Technique | Nmap Command | Request | Response | Advantages |

    |---|---|---|---|---|

    | TCP ACK Ping Scan | nmap -sn -PA <Target IP Address> | Empty TCP ACK request
    | ✓ RST response - Host is active

    ✓ No response - Host is inactive | ✓ Maximizes the chances of bypassing the firewall
    |

    | IP Protocol Ping Scan | nmap -sn -PO <Target IP Address> | IP ping requests
    using different IP protocols (ICMP, IGMP, TCP, and UDP) | ✓ Any response - Host
    is active

    ✓ No response - Host is inactive | ✓ Sends different packets using different IP
    protocols in the hope of receiving a response indicating that a host is online
    |


    ![](img/198108450322f24970ade227cbf24f47_27_0.png)


    # Host Discovery Techniques


    Host discovery techniques can be adopted to discover the active/live hosts in
    the network. As an ethical hacker, you must be aware of the various types of host
    discovery techniques. Some host discovery techniques are listed below:


    +   - ARP Ping Scan

    +   - UDP Ping Scan'
