    - Vulnerabilities in UPnP may allow attackers to launch Buffer overflow or DoS
    attacks

    - UPnP 中的漏洞可能允许攻击者发起缓冲区溢出或 DoS 攻击

    - Attacker may use the UPnP SSDP M-SEARCH information discovery tool to check
