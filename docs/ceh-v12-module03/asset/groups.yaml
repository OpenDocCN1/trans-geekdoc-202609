    ## 绕过 IDS 和防火墙的扫描


    入侵检测系统 (IDS) 和防火墙是旨在防止攻击者访问网络的安全机制。然而，即使是 IDS 和防火墙也存在一些安全限制。攻击者试图发动攻击来利用这些限制。本节介绍各种
    IDS/防火墙规避技术，例如数据包分片、源路由、IP地址欺骗等。


    ## IDS/防火墙规避技术


    尽管防火墙和 IDS 可以防止恶意流量（数据包）进入网络，但攻击者可以通过以下技术规避 IDS 或防火墙，从而将预期数据包发送到目标：


    - 1. 数据包分片

    - 2. 源路由

    - 3. 源端口操作

