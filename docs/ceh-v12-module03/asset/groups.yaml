    ## 模块摘要


    本模块讨论了攻击者如何通过向多个主机发送各种 ping 扫描请求来从一系列 IP 地址中确定活动主机。它还描述了攻击者如何执行不同的扫描技术以确定目标系统上的开放端口、服务、服务版本等。此外，它解释了攻击者如何执行横幅抓取或操作系统指纹识别以确定远程目标系统上运行的操作系统。它还说明了攻击者可以采用的各种扫描技术，以绕过
    IDS/防火墙规则和日志机制并在网络流量下隐藏自己。最后，它以关于防御网络扫描攻击的网络扫描对策的详细讨论结束。


    在下一模块中，我们将详细讨论攻击者以及道德黑客和渗透测试人员如何在攻击或审计前执行枚举以收集有关目标的信息。

