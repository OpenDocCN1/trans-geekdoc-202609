    # 2020年 ICC T20 板球世界杯冠军预测

    基于机器学习技术进行预测


    Abdul Basit

    计算机系统工程系

    巴哈瓦尔普尔伊斯兰大学

    巴基斯坦，巴哈瓦尔普尔

    ngrbas@gmail.com


    Muhammad Haider Alvi

    计算机系统工程系

    巴哈瓦尔普尔伊斯兰大学

    巴基斯坦，巴哈瓦尔普尔

    mubalvi@iub.edu


    Fawad Hassan Jaskani

    计算机系统工程系

    巴哈瓦尔普尔伊斯兰大学

    巴基斯坦，巴哈瓦尔普尔

    fawadhassanjaskani@gmail.com


    **摘要—** 未来就像魔法一样，无论是检测潜在客户购买产品的意图，还是确定价格，都充满了神秘感。如果我们能够可靠地预测未来，那么我们就掌握了这种魔法。机器学习统一了这种神秘，它在许多商业领域也发挥了作用。本文中讨论了将在澳大利亚举办的第
    7 届 2020 年 T20 板球世界杯。我们使用了机器学习来预测 T20 世界赛的结果。通过使用开发的模型，随机森林（Random Forest）被证明是最佳方法，具有特定的准确率。我们的方法在2020
    年 T20 世界杯数据集上进行了测试。我们的目标是寻找第 7 届 T20 板球世界杯的冠军。为此，从 ESPricinfo 提取了数据集。通过应用机器学习算法如决策树（Decision
    Trees）和随机森林（Random Forest），我们构建了预测模型。


    **关键词—** 机器学习，T20 世界杯，预测，决策树，随机森林


    # I. 引言


    板球是一项热门运动。在过去的几十年里，板球的普及和收视率大幅增加。为了预测未来的结果，进行了全球市场研究。板球委员会（ICC）发布的板球拥有超过十亿粉丝，具有巨大的增长潜力。在所有板球形式中，T20
    国际赛（T20s）的受欢迎最高。所有粉丝都渴望了解即将到来的板球赛事结果。


    第 7 届 ICC 男子 T20 世界杯将在澳大利亚举行。比赛将由 12 支球队进行。在锦赛期间，12 支球队将分为四组。每支球队将参加小组赛/淘汰赛。锦赛结束后，排名前四的球队将进入半决赛。两支球队将晋级进入决赛。最终，决赛的获胜者将成为
    T20 世界杯的冠军。


    # II. 文献综述


    在本节中，我们将讨论之前针对预测进行的类似研究，以了解最流行的技术。


    Neeraj Patel [1] 提出了 ODI 比赛板球结果预测。使用了朴素贝斯（Naive Bayes）、支持向量机（Support vector machine）和随机森林（Random
    Forest）等现代分类技术，并基于这些结果进行了比较研究。ODI 比赛输出涉及多个因素，包括主场、先后掷币、击球场地和投球。所有这些因素和策略随时间而变化。在数据集不平衡的情况下，使用朴素贝斯分类器预测
    ODI 比赛的模型准确率被证明是最好的，独立表现也最好。但在交叉验证和自助抽样平均后，


    > espricinfo.com（一个国际板球网站：球的覆盖和统计数据）


    如朴素贝斯等模型的准确率为 0.6016，随机森林为 0.6002，SVM 为 0.6017。


    迷人的结果。如今，板球是一项热门且不确定的运动，特别是 T20 格式，其中一个球员或一个回合就能改变整个局势。


    Styllanis Kanpur [2] 考虑了 T20 比赛的结果，作者设计优化了球队特征，并在随后包含了更多统计数据等特征。通过分析 T20 比赛结果，该模型的权威性能。T20
    板球的准确率低于其他比赛，因为板球具有高度的不可预测性。T20 板球的这种不可预测性对于后续比赛来说并不新鲜。为此使用了不同的机器学习技术，发现朴素贝斯具有显著结果，准确率为
    64.9%，运行良好。不同统计特征的相关性提供了足够的信息来确认这一点。


    观察并描述了决定 T20 比赛结果的几个方面。为了衡量球队积分，提出了一种多元回归技术。观察了每位球员的历史，并根据历史决定对对手获胜的概率。最后，观察了不同比赛的不同因素。发现并使用了机器学习分类器，但决策树和随机森林比其他方法突出，准确率为
    89.15%。


    球员与团队之间的关系相关性被用于。


    Gagan S [6] 提出了使用机器学习对 T20 比赛进行分析。这预测了击球者的结果和每位投球者的轮数。作者通过加权决策树和随机森林获得了 90.88%。这些结果可以使用递归神经网络（RNN）和隐马尔可夫模型（HMM）进行改进。


    Kalm Pasri [3] 提出了基于个人表现的朴素贝斯、森林分类和决策树的结果。这预测了获胜者和每位投球者的轮数。根据表现从 11 名球员到 18 名球员管理选择是困难的。这预测了击球者的结果和每位投球者的轮数。天气和个人表现也获得了
    90.7% 和 92.5%。但另一方面，SVM 的结果为 51.45% 和 68.78%。


    Muhammad Zafir [4] 预测了国际赛比赛的结果。预测可以通过不同的方式进行，比赛如何开始以及在哪里进行。上述描述的模型可以根据之前的比赛、球员在场地的表现进行设计。作者通过加权预测了预测，并在不同网站上的历史逐球数据集上评估了预测。这包含了预测获胜的动态球队属性，如球员历史、比赛表现和场地历史，比赛后获得了
    85%，比赛结果后获得了 89%。


    Raiza U Mustafa [8] 提出了一种机器学习模型，通过分析社交网络上的意见预测比赛结果。在本文中，作者使用观察社交媒体文本预测了板球赛的冠军。社交媒体是一个平台，人们可以在那里表达自己的感受，每个人都可以对球队进行评论。


    Aninum Isak [7] 了一项使用孟加拉板球球员和球员表现数据的机器学习的关注研究。不同的机器学习技术如逻辑回归（LR）、线性及多项式内核的支持向量机（SVM）用于选拔、淘汰和冠军预测。使用机器学习预测未来比赛中击球者的结果和每位投球者的轮数准确率分别为
    91.5% 和 73.5%。


    Ch Sai Ahich [5] 提出了一种使用机器学习分析冠军的方法，并实施了上述描述的模型来预测。使用了不同的技术根据每支球队领先的轮数和每支球队的分数预测冠军。上述三种方法在比赛开始前预测了比赛结果，并使用监督学习技术进行了评估，并声称支持向量机（SVM）比朴素贝斯和逻辑回归等其他方法更好。


