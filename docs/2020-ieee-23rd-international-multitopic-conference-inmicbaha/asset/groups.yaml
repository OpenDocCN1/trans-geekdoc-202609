    **Abstract—**future sounds like magic, whether it be detected, the intent of a
    potential customer to purchase product or figuring out the price of a stake is
    how involved. If we can reliably predict the future, then we have mastered magic.
    Machine learning has served to unify this magic and mystery. It has also served
    in many fields of business. In this paper, we discuss the 7th edition of T20 World
    Cup 2020 which will be held in Australia. We have used machine learning to predict
    the outcome of the T20 world cup winner. Using the developed models, Random Forest
    proved to be the best machine learning algorithm using a custom accuracy metric.
    Our method was tested on the dataset of Australia, which emerged the winner of
    the t20 world cup 2020. For this purpose, ESPricinfo dataset has been used.


    Our aims is to find the winner of the 7th T20 Cricket Cup. For this purpose, the
    dataset has been extracted from ESPricInfo; various techniques were used to check
    its integrity and cleanliness. After applying machine learning algorithms like
    decision tree and Decision Trees (ID3, C, and Extra), Random Forest Classifier
    were used to build predictive models. By testing these classifiers on the dataset(s),
    we found that Random Forest has shown better result with custom accuracy of 86%
    compared to Classifier. Additionally, it is predicted to predict the winner of
    t20 world cup 2020 as a result of this work. This dataset comprised of four datasets:
    ICC World Cup, records of matches, ICC T20 rankings and appearances of T20 World
    cup. This model can also be applied to predict the winner of other cricket events
    or even sports with a dataset of similar nature.


    **Keywords—** Machine learning, t20 world cup, prediction, decision tree, random
    forest


    # I. INTRODUCTION


    Cricket is a popular sport. The popularity of cricket and its viewership has increased
