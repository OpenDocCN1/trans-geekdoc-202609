    用于测试和训练目的的各种机器学习分类器包括随机森林、SVM、朴素贝叶斯、逻辑回归和决策树。用于此模型的各种分类器预测结果的准确率为 76.9%，通过微调参数，将性能从
    76% 提高到 94%。同样，随机森林的准确率为 71%，这不足以提高该模型的准确率——通过上述方式调整参数，并获得了 80% 的结果。


    C4.5：这是一种决策树算法，通过信息熵来构建。


    $\text{Custom Accuracy} = \frac{\text{Actual Value}}{\text{Predicted Value}}$


    ID3：使用自顶向下的贪心方法构建。


    Extra Trees：通过创建大量未剪枝的树工作。


    # IV. 结果


    评估参数：自定义准确率显示随机森林优于其他。由于自定义是实际值与预测值之间的差异，而均方误差是因变量的解释比例。


    图 2 显示了四种机器学习算法（随机森林、Extra Trees、ID3 和 C4）的对比。


    图 2：ExtraTrees、ID3、C4 和随机森林的对比。


    随机森林算法在所选机器学习方法中被证明是最好的。它在自定义准确率和均方误差上分别达到了 80.86% 和 64.98%。


