  md: b) **Private Blockchains:** Private blockchains, also referred to as permissioned
    blockchains, are restricted networks where participation is limited to specific
    entities. These entities, often pre-approved participants, possess the authority
    to validate transactions and access the blockchain. Unlike public blockchains,
    private blockchains prioritize privacy and confidentiality, making them suitable
    for industries where data access control is critical, such as healthcare, supply
    chain management, and financial institutions. Private blockchains may not rely
    on native cryptocurrencies and can employ consensus mechanisms like Practical
    Byzantine Fault Tolerance (PBFT) or variants of Proof of Stake (PoS) to achieve
    consensus among participants. c) **Consortium Blockchains:** Consortium blockchains
    are a hybrid model that combines aspects of both public and private blockchains.
    In a consortium blockchain, a predefined group of organizations or entities forms
    a consortium to jointly operate and govern the network. Consortium blockchains
    offer shared infrastructure where multiple participants collaborate to maintain
    the blockchain. This type of blockchain enables industries and sectors with multiple
    stakeholders to work together while maintaining a certain level of control and
    privacy. Applications of consortium blockchains include trade finance, interbank
    transactions, and supply chain networks.
