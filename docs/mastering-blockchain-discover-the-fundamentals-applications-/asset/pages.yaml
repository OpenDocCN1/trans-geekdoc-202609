- pgno: 46
  md: 'b) **Decentralized Systems:** In contrast, decentralized systems distribute
    power, control, and decision-making among multiple participants. Each participant,
    also known as a node or peer, has an equal role in maintaining the system''s integrity
    and consensus. Decentralization aims to remove the need for a central authority
    and create a more democratic and resilient system. In a decentralized system,
    no single entity holds ultimate control. Instead, participants collectively validate
    and verify transactions through a consensus mechanism. Examples of decentralized
    systems include peer-to-peer file sharing networks, decentralized cryptocurrencies
    like Bitcoin, and blockchain-based applications. Decentralized systems offer several
    advantages. They eliminate the reliance on a single point of failure, making the
    system more robust and resistant to attacks. They also enhance transparency, as
    participants can independently verify transactions and maintain a transparent
    record of all activities. Additionally, decentralized systems empower individuals
    by giving them more control over their data and transactions.


