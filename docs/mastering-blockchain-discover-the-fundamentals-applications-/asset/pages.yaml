- pgno: 112
  md: '# IMMUTABLE LEDGER AND DATA INTEGRITY


    One of the key attributes of blockchain is its immutability and data integrity.
    Once a block is added to the blockchain, it becomes nearly impossible to alter
    or delete the data within it. This is achieved through the following mechanisms:


    +   a) **Cryptographic Hashing:** Each block in the blockchain is linked to the
    previous block through a cryptographic hash. This hash is computed using the data
    of the previous block, creating a chain of blocks that is resistant to tampering.
    Any change to the data within a block would result in a different hash, breaking
    the chain and alerting the network to the tampering attempt.

    +   b) **Consensus Mechanism:** Blockchain relies on a consensus mechanism, such
    as Proof of Work (PoW) or Proof of Stake (PoS), to validate and agree upon the
    order of transactions and the state of the blockchain. These consensus mechanisms
    ensure that all participants in the network reach a shared agreement and prevent
    malicious actors from modifying the blockchain. PoW requires miners to perform
    computationally intensive tasks to validate transactions and add blocks to the
    blockchain, while PoS allows participants to validate transactions based on the
    stake they hold in the network.

    +   c) **Distributed Network:** Blockchain operates on a distributed network of
    nodes, where multiple participants main-'
