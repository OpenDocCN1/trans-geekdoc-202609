- pgno: 70
  md: 'The digital signature is generated by applying a mathematical function to the
    transaction data and the private key. This process produces a unique string of
    characters that serve as cryptographic proof that the transaction or data has
    been authorized by the owner of the private key.


    b) **Verification with Public Key:** The digital signature, along with the transaction
    or data, is shared with the network. Any participant can use the sender''s public
    key to verify the signature. By decrypting the signature using the public key,
    they can confirm that the signature matches the original data, ensuring that the
    transaction or data has not been tampered with.


    Digital signatures provide several benefits in the blockchain context. They ensure
    the integrity of transactions and data, as any alteration to the transaction or
    data would result in an invalid signature. Additionally, digital signatures enable
    non repudiation, meaning that the sender cannot deny their involvement in the
    transaction or the authenticity of the data once it has been signed.'
  merge: -1
  img_proc: true
