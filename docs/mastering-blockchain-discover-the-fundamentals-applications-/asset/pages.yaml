    \ each participant has a key pair consisting of a public key and a private key.\
    \ The public key is openly shared with others in the network, while the private\
    \ key remains secret.\n+   \n+   b) **Encryption:** When a sender wants to send\
    \ a message to a recipient, they encrypt the message using the recipient's public\
    \ key. Only the corresponding private key can decrypt"
