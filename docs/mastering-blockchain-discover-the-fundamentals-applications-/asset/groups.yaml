    exploits, such as reentrancy attacks, where an attacker repeatedly reenters a
    contract to drain its funds. Other vulnerabilities include race conditions, timestamp
    dependencies, and denial-of-service attacks. Proper auditing, code reviews, and
    following secure coding practices, such as input validation and error handling,
