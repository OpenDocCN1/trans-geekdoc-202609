    # CHAPTER 2


    # UNDERSTANDING DECENTRALIZATION


    # CENTRALIZED VS. DECENTRALIZED SYSTEMS


    To truly appreciate the importance of decentralization in blockchain, it is essential
    to delve deeper into the distinctions between centralized and decentralized systems:


    +   a) **Centralized Systems:** In a centralized system, power and control are
    concentrated in a central authority or entity. This central authority holds the
    ultimate decision making power, manages the system''s operations, and validates
    transactions. Examples of centralized systems include traditional banking systems,
    social media platforms, and government agencies. In such systems, trust is placed
    in the central authority to act in the best interest of the participants. Centralized
    systems have some advantages, such as ease of management, faster decision-making,
    and efficient coordination. However, they also come with inherent vulnerabilities.
    Since the central authority has complete control, it becomes a single point of
    failure and a potential target for cyber attacks or corruption. Additionally,
    participants must place trust in the central authority to act fairly and responsibly,
    which can sometimes lead to concerns about transparency and accountability.'
  - '[PAGE 44]


    <!-- no content -->'
  - '[PAGE 45]


    <!-- no content -->'
  - '[PAGE 46]


    b) **Decentralized Systems:** In contrast, decentralized systems distribute power,
    control, and decision-making among multiple participants. Each participant, also
    known as a node or peer, has an equal role in maintaining the system''s integrity
