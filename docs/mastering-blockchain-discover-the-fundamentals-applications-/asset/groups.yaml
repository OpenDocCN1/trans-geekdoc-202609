    - **交易：** 区块包含已验证并添加到区块链的交易集。这些交易记录各种活动，例如资产转移、合约交互或数据存储。每个交易都有其唯一标识符，并与区块内的前一个交易相关联。

    - **Merkle 树根：** Merkle 树根是代表区块内交易的哈希值。它是通过将交易组织成称为 Merkle 树的二叉树结构来计算的。此 Merkle
    树允许高效验证区块内交易的完整性。对交易的任何更改都会导致不同的 Merkle 树根，表明篡改。


