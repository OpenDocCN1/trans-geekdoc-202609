  \n---\n\n### 2. 包含数据库连接脚本并检查表单是否已提交：\n\n```php\nrequire ('../../mysqli_connect.php');\n\
  \nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n    $errors = array();\n}\n```\n\n\
  任何表单验证问题都将被添加到 `$errors` 数组中，该数组在此处初始化。（因为此脚本可能会有多个错误，所以使用了数组；而在 `add_artist.php`\
  \ 中，一次只能发生单个错误。）\n\n### 3. 验证版画的名称：\n\n```php\nif (!empty($_POST['print_name']))\
  \ {\n    $pn = trim($_POST['print_name']);\n} else {\n    $errors[] = '请输入版画的名称！';\n\
  }\n```\n\n这是 *prints* 表中的必填字段之一，应检查其是否有值。同样，因为此脚本将使用预处理语句，用于查询的值不需要通过 `mysqli_real_escape_string()`\
  \ 运行。\n\n如果想要格外小心，可以在此处应用 `strip_tags()`（尽管如果恶意用户已进入管理区域，你将面临更大的问题）。\n\n如果未输入值，则将错误消息添加到\
  \ `$errors` 数组中。\n\n### 4. 如果选择了上传图像，则为其创建一个临时名称：\n\n```php\nif (is_uploaded_file($_FILES['image']['tmp_name']))\
  \ {\n    $temp = '../../uploads/' . md5($_FILES['image']['name']);\n```\n\n当介绍使用\
  \ PHP 处理文件上传的技术时（见 第 11 章 “Web 应用程序开发”），曾提到 `is_uploaded_file()` 函数。如果文件已上传，它返回\
  \ `TRUE`，否则返回 `FALSE`。如果文件已上传，脚本将尝试将文件移动到 `uploads` 目录（在第 5 步中）。\n\n这里还发生了一件事：图像不会使用其原始名称存储在服务器上（这可能是一个安全隐患）。相反，图像将使用其关联的版画\
  \ ID 进行存储。然而，由于该值尚未知晓（因为版画记录尚未添加到数据库），必须为此文件生成一个临时名称。为此，将 `md5()` 函数（返回 32 字符的哈希值）应用于图像的原始名称。该临时名称连同图像最终目的地的相对路径（相对于此脚本）被赋值给\
  \ `$temp`。\n\n您可以在此方面做一些改进。您还可以验证图像是否为正确的大小和类型。为了保持这个已经很繁忙的脚本更易于管理，我在此省略了该部分，但请参阅\
  \ 第 11 章 了解要应用的确切代码。\n\n### 5. 将文件移动到其更永久的目标位置：\n\n```php\nif (move_uploaded_file($_FILES['image']['tmp_name'],\
  \ $temp)) {\n    echo '<p>文件已上传！</p>';\n    $i = $_FILES['image']['name'];\n```\n\
  \n此时，版画图像已被移动到其永久位置（`uploads` 目录），但被赋予了一个临时名称（稍后将重命名）。打印一条消息指示移动成功。最后，`$i` 变量将被赋值为文件的原始名称（供脚本后面使用）。\n\
  \n\n\n\n![Image](img/circle-f.jpg)如果为打印图像选择了文件并成功上传，结果如下。\n\n**6.** 完成图像处理部分：\n\n\
  ```php\n} else {\n    $errors[] = 'The file could not be moved.';\n    $temp = $_FILES['image']['tmp_name'];\n\
  }\n} else {\n    $errors[] = 'No file was uploaded.';\n    $temp = NULL;\n}\n```\n\
  \n第一个 **`else`** 子句适用于文件无法移动到目标目录的情况。这只有在该目录的路径不正确或未在该目录上设置适当权限时才会发生 ![Image](img/circle-g.jpg)。无论哪种情况，**`$temp`**\
  \ 变量都会被赋予原始上传文件的值，该文件仍驻留在其临时位置。这是必需的，因为未使用的文件稍后将在脚本中被移除。\n\n![Image](img/19_figure_13_g.jpg)\n\
  \n![Image](img/circle-g.jpg)如果 `uploads` 目录不可由 PHP 写入，你将看到类似这样的错误。\n\n第二个 **`else`**\
  \ 子句适用于未上传文件的情况。由于本网站的目的是销售打印品，实际展示待售商品显得尤为重要。如果你愿意，可以向此错误消息添加更多详细信息或建议，说明应上传何种类型和大小的文件。\n\
  \n**7.** 验证尺寸、价格和描述输入：\n\n```php\n$s = (!empty($_POST['size'])) ? trim($_POST['size'])\
  \ : NULL;\n\nif (is_numeric($_POST['price']) && ($_POST['price'] > 0)) {\n    $p\
  \ = (float) $_POST['price'];\n} else {\n    $errors[] = 'Please enter the print\\\
  's price!';\n}\n\n$d = (!empty($_POST['description'])) ? trim($_POST['description'])\
  \ : NULL;\n```\n\n尺寸和描述值是可选的，但价格不是。作为基本的有效性测试，使用 **`is_numeric()`** 函数确保提交的价格是一个数字（应为小数），并且价格大于\
  \ 0（以负价格销售产品可不是好事）。如果值合适，为了保险起见，将其类型转换为浮点数。如果未输入价格或输入了无效价格，将向数组添加一条错误消息。\n\n**8.**\
