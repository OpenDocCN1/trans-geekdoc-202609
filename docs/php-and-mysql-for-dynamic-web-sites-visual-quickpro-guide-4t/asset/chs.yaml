  \ `show_image.php` 是发现它的最佳方法。\n\n---\n\n### 搜索产品目录\n\n该数据库的结构使得搜索功能相当容易实现，如果你想添加的话。目前，只有三个逻辑字段可用于搜索：印刷品的名称、其描述和艺术家的姓氏。可以使用以下语法在这些字段上运行\
