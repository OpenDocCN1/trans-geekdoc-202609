  \ ![Image](img/graycircle-e.jpg) 中打印品的尺寸和描述中使用引号的情况）。\n\n\n\n\n## 14. 开始艺术家下拉菜单\n\
  \n**艺术家：**\n\n```html\n<select name=\"artist\">\n  <option>Select One</option>\n\
  ```\n\n艺术家下拉菜单将使用此 PHP 代码，根据存储在 `artists` 表中的记录动态生成。\n\n## 15. 检索每一位艺术家\n\n```php\n\
  <?php\n$q = \"SELECT artist_id, CONCAT_WS(' ', first_name, middle_name, last_name)\
  \ FROM artists ORDER BY last_name, first_name ASC\";\n$r = mysqli_query($dbc, $q);\n\
  \nif (mysqli_num_rows($r) > 0) {\n    while ($row = mysqli_fetch_array($r, MYSQLI_NUM))\
  \ {\n        echo \"<option value=\\\"$row[0]\\\"\";\n        // 检查粘性：\n       \
  \ if (isset($_POST['existing']) && ($_POST['existing'] == $row[0])) echo ' selected=\"\
  selected\"';\n        echo \">$row[1]</option>\\n\";\n    }\n} else {\n    echo\
  \ '<option>Please add a new artist first.</option>';\n}\n\nmysqli_close($dbc); //\
  \ 关闭数据库连接。\n?>\n</select>\n```\n\n此查询从数据库中检索每位艺术家的姓名和 ID（它未使用预处理语句，因为实际上并不需要）。MySQL\
  \ `CONCAT_WS()` 函数——即 *concatenate with separator*（使用分隔符连接）的缩写——用于将艺术家的全名作为单个值检索。如果您对查询的语法感到困惑，请在\
  \ mysql 客户端或其他界面中运行它以查看结果。\n\n如果数据库中没有现有的艺术家，则该下拉菜单将没有任何选项，因此会显示一条添加艺术家的提示。\n\n\
  由于希望使下拉菜单具有粘性，这段原本基础的代码变得复杂起来。要使任何 `select` 菜单具有粘性，必须向适当的选项添加 `selected=\"selected\"\
  `。因此，`while` 循环中的代码会检查 `$_POST['existing']` 是否已设置，如果已设置，则检查其值是否与正在添加到菜单中的当前艺术家 ID\
  \ 相同。\n\n## 16. 完成 HTML 表单\n\n```html\n<p><b>Price:</b> <input type=\"text\" name=\"\
