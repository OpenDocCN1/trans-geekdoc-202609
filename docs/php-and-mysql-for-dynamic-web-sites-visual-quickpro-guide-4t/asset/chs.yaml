  \ MYSQLI_NUM);\n```\n第一个查询将仅返回与提交的邮箱地址和密码匹配的记录的 `user_id` 字段。要将提交的密码与存储的密码进行比较，请使用\
  \ `SHA1()` 函数再次对其进行加密。如果用户已注册并正确输入了邮箱地址和密码，将恰好选中一行中的一列（因为邮箱值在所有行中必须唯一）。最后，这一条记录作为一个单元素数组赋值给变量\
  \ `$row`。\n\n![Image](img/09_figure_19_b.jpg)\n\n![Image](img/circle-b.jpg) 在 mysql\
