  38          echo '<h1>Total Estimated Cost</h1>\n39          <p>The total cost of\
  \ driving ' . $_POST['distance'] . ' miles, averaging\n40          ' . $_POST['efficiency']\
  \ . ' miles per gallon, and paying an average of $' .\n41          $_POST['gallon_price']\
  \ . ' per gallon, is $' . number_format ($dollars, 2) . '.\n42          If you drive\
  \ at an average of 65 miles per hour, the trip will take\n43          approximately\
  \ ' . number_format($hours, 2) . ' hours.</p>';\n44\n45      } else { // Invalid\
  \ submitted values.\n46          echo '<h1>Error!</h1>\n47          <p class=\"\
  error\">Please enter a valid distance, price per gallon, and fuel\n48          \
