  \nMac OS X 上 Google Chrome 中显示的文件输入框。\n\n表单提交后，可以使用 `$_FILES` 超全局变量访问上传的文件。该变量将是一个值的数组，列于\
  \ **表 11.2** 中。\n\n**表 11.2. `$_FILES` 数组**\n\n![Image](img/11tab02.jpg)\n\nPHP\
