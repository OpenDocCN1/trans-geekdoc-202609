  \n`create_radio('4.00', 'gallon_price');`\n\n——但现在该函数也可用于创建其他单选按钮。\n\n**5.** 保存文件，将其放入\
  \ Web 目录，并在 Web 浏览器中测试 ![Image](img/circle-d.jpg)。\n\n![Image](img/03_figure_15_d.jpg)\n\
  \n![Image](img/circle-d.jpg)添加第二个可选参数并未影响函数的功能。\n\n***\n\n> **提示**\n>\n> 要给函数的参数不传任何值，请使用空字符串（`''`）、`NULL`\
  \ 或 `FALSE`。\n\n***\n\n> **提示**\n>\n> 在 PHP 手册中，方括号（`[ ]`）用于表示函数的可选参数 ![Image](img/circle-e.jpg)。\n\
  >\n> ![Image](img/03_figure_16_e.jpg)\n>\n> ![Image](img/circle-e.jpg)PHP 手册中 `number_format()`\
  \ 函数的说明显示只有第一个参数是必需的。\n\n***\n\n### 从函数返回值\n\n要讨论的用户自定义函数的最后一个属性是返回值。有些函数会返回值，但并非所有函数都会。例如，`print`\
  \ 会返回 1 或 0 以指示其成功与否，而 `echo` 则不会。再如，`number_format()` 函数返回一个字符串，即数字的格式化版本（见上一节中的\
  \ ![Image](img/graycircle-e.jpg)）。\n\n要让函数返回值，请使用 `return` 语句。以下函数可能会返回给定出生月份和日期对应的星座：\n\
  \n```php\nfunction find_sign($month, $day) {\n    // Function code.\n    return\
  \ $sign;\n}\n```\n\n函数可以返回一个字面值（例如字符串或数字），或函数内部确定的变量的值。\n\n调用返回值的函数时，你可以将函数结果赋给一个变量：\n\
  \n`$my_sign = find_sign('October', 23);`\n\n或将其作为参数用于调用另一个函数：\n\n`echo find_sign('October',\
  \ 23);`\n\n\n\n#### 让函数返回值\n\n### 更新 `calculator.php` 脚本\n\n让我们更新 `calculator.php`\
