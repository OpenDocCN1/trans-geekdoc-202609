  \n```\nif (file_exists ($_FILES['upload']['tmp_name']) && is_file($_FILES['upload']['tmp_name'])\
  \ ) {\n  unlink ($_FILES['upload']['tmp_name']);\n}\n```\n\n下一个脚本将允许用户选择其计算机上的文件，然后将其存储在\
  \ *uploads* 目录中。该脚本将检查文件是否为图像类型，具体为 JPEG 或 PNG。在本章的下一节中，另一个脚本将列出并创建指向已上传图像的链接。\n\
  \n```\n<form enctype=\"multipart/form-data\" action=\"upload_image.php\" method=\"\
  post\">\n  <input type=\"hidden\" name=\"MAX_FILE_SIZE\" value=\"524288\" />\n \
  \ <fieldset><legend>Select a JPEG or PNG image of 512KB or smaller to be uploaded:</legend>\n\
  \  <p><b>File:</b> <input type=\"file\" name=\"upload\" /></p>\n  </fieldset>\n\
  \  <div align=\"center\"><input type=\"submit\" name=\"submit\" value=\"Submit\"\
  \ /></div>\n</form>\n</body>\n</html>\n```\n\n\n\n\n如果文件已上传但无法移动到最终目标位置，或发生其他错误，该文件仍将保留在服务器的临时位置。要将其删除，请应用\
  \ `unlink()` 函数。为保险起见，在应用 `unlink()` 之前，条件语句会检查文件是否存在且是否为文件（因为如果指定项是目录，`file_exists()`\
  \ 函数将返回 TRUE）。\n\n**11.** 完成 PHP 部分：\n\n```php\n} // End of the submitted conditional.\n\
  \n?>\n```\n\n**12.** 创建 HTML 表单：\n\n```html\n<form enctype=\"multipart/form-data\"\
  \ action=\"upload_image.php\" method=\"post\">\n  <input type=\"hidden\" name=\"\
  MAX_FILE_SIZE\" value=\"524288\" />\n  <fieldset>\n    <legend>Select a JPEG or\
  \ PNG image of 512KB or smaller to be uploaded: </legend>\n    <p><b>File:</b> <input\
  \ type=\"file\" name=\"upload\" /></p>\n  </fieldset>\n  <div align=\"center\"><input\
  \ type=\"submit\" name=\"submit\" value=\"Submit\" /></div>\n</form>\n```\n\n该表单非常简单，但包含文件上传所需的三个必要部分：表单的\
  \ `enctype` 属性、`MAX_FILE_SIZE` 隐藏输入框和文件输入框。\n\n**13.** 完成 HTML 页面：\n\n```html\n\
  </body>\n</html>\n```\n\n**14.** 将文件保存为 `upload_image.php`，将其放入 Web 目录，并在 Web 浏览器中测试。\n\
  \n![Image](img/11_figure_15_k.jpg)\n成功上传并移动文件后的结果。\n\n![Image](img/11_figure_16_l.jpg)\n\
  尝试上传过大文件时的结果。\n\n如果需要，可以通过检查 `uploads` 目录的内容来确认脚本是否正常工作。\n\n***\n\nTip\n\n省略表单的\
  \ `enctype` 属性是导致文件上传神秘失败的常见原因。\n\n***\n\nTip\n\n也可以使用 `is_uploaded_file()` 函数验证上传文件是否存在。\n\
  \n***\n\nTip\n\nWindows 用户引用目录时必须使用正斜杠或双反斜杠（即 `C:\\\\` 或 `C:/`，而非 `C:\\`）。这是因为反斜杠是\
  \ PHP 中的转义字符。\n\n***\n\nTip\n\n如果新旧文件同名，`move_uploaded_file()` 函数将在不发出警告的情况下覆盖现有文件。\n\
  \n***\n\nTip\n\n`MAX_FILE_SIZE` 是浏览器对文件大小的限制，但并非所有浏览器都遵守此限制。PHP 配置文件有其自身的限制。也可以在接收端的\
  \ PHP 脚本中验证上传文件的大小。\n\n***\n\nTip\n\n在 第 13 章 中，你将学习一种通过更可靠地验证上传文件类型来提高脚本安全性的方法。\n\
  \n***\n\n### PHP 和 JavaScript\n\n尽管 PHP 和 JavaScript 是截然不同的技术，但它们可以结合使用以构建更好的网站。两者最显著的区别在于\
  \ JavaScript 主要是客户端技术（在 Web 浏览器中运行），而 PHP 始终是服务端技术。因此，JavaScript 可以检测浏览器窗口大小、创建弹出窗口、实现图像鼠标悬停效果等，而\
  \ PHP 无法做到这些。反之，PHP 可以在服务器上与 MySQL 交互，但 JavaScript 不能。\n\n虽然 PHP 无法完成 JavaScript\
  \ 能做的某些事情，但 PHP 可以用来生成 JavaScript，就像生成 HTML 一样。明确地说，在 Web 浏览器中，JavaScript 通过 HTML\
  \ 引入并与其交互，但 PHP 可以动态生成 JavaScript 代码，正如你一直用 PHP 动态生成 HTML 那样。\n\n为了演示这一点，将创建一个 PHP\
  \ 脚本，列出由 `upload_image.php` 脚本上传的所有图像。该 PHP 脚本还将把每个图像名称创建为可点击的链接。这些链接将调用一个 JavaScript\
  \ 函数，创建一个弹出窗口，在其中显示被点击的图像。此示例绝非对 JavaScript 的详尽讨论，但足以演示 PHP、HTML 和 JavaScript 等技术如何协同工作。在\
  \ 第 15 章 “jQuery 简介”中，你将学习如何使用 jQuery JavaScript 框架为基于 PHP 的脚本添加各种功能。\n\n![Image](img/11_figure_17_a.jpg)\n\
  此 PHP 页面动态创建所有上传图像的列表。\n\n![Image](img/11_figure_18_b.jpg)\n每个图像的名称均作为调用 JavaScript\
  \ 函数的链接。函数调用的参数由 PHP 创建。\n\n#### 创建 JavaScript 文件\n\n尽管 JavaScript 和 PHP 是两种不同的语言，但它们足够相似，即使没有接受过正规训练也能涉猎\
  \ JavaScript。在为本示例创建 JavaScript 代码之前，我将解释一些基础知识。\n\n首先，JavaScript 代码可以通过两种方式添加到\
  \ HTML 页面：内联或通过外部文件。要添加内联 JavaScript，请将 JavaScript 代码放在 HTML `script` 标签之间：\n\n\
  ```html\n<script type=\"text/javascript\">\n  // Actual JavaScript code.\n</script>\n\
  ```\n\n要使用外部 JavaScript 文件，请向 `script` 标签添加 `src` 属性：\n\n```html\n<script type=\"\
  text/javascript\" src=\"somefile.js\"></script>\n```\n\nHTML 页面可以多次使用 `script` 标签，但每个标签只能包含外部文件或内联\
  \ JavaScript 代码，不能两者兼有。\n\n如上所示，JavaScript 文件使用 `.js` 扩展名。该文件应使用与将包含它的 HTML 脚本相同的编码（在文本编辑器或\
  \ IDE 中设置）。可以在 `script` 标签中指定文件的编码：\n\n```html\n<script type=\"text/javascript\"\
  \ charset=\"utf-8\" src=\"somefile.js\"> </script>\n```\n\n无论将 JavaScript 代码放在 `script`\
  \ 标签内还是外部文件中，都没有像 PHP 标签那样的 JavaScript 开始和结束标签。\n\n其次，JavaScript 中的变量区分大小写，这与 PHP\
  \ 相同，但 JavaScript 变量不以美元符号开头。\n\n最后，JavaScript 和 PHP 的主要区别之一是 JavaScript 是一门面向对象编程（OOP）语言。PHP\
  \ 既可用于过程式方法（本书大部分内容演示的方法），也可用于面向对象方法（见 第 16 章 “OOP 入门”），而 JavaScript 始终是面向对象语言。这意味着你将看到类似\
  \ `something.something()` 或 `something.something.something` 的“点”语法。\n\n基础知识就介绍到这里；在下面的脚本中，我将详细解释每段代码的细节。在接下来的步骤中，你将创建一个单独的\
  \ JavaScript 文件，定义一个 JavaScript 函数。该函数接受三个参数——图像的名称、宽度和高度。函数将使用这些值为该图像专门创建一个弹出窗口。\n\
  \n### 使用 PHP 创建 JavaScript\n\n**1.** 在文本编辑器或 IDE 中创建一个新的 JavaScript 文档，命名为 `function.js`（**脚本\
  \ 11.3**）：\n\n```javascript\n// Script 11.3 - function.js\n```\n\n同样，这里没有开始 JavaScript\
  \ 标签，你可以直接开始编写 JavaScript 代码。JavaScript 中的注释可以使用单行（`//`）或多行（`/* */`）语法。\n\n**2.**\
  \ 开始定义 JavaScript 函数：\n\n```javascript\nfunction create_window (image, width, height)\
  \ {\n```\n\n\n\nJavaScript `create_window()` 函数将接受三个参数：图像的名称、宽度和高度。当用户点击链接时，这些参数中的每一个都将被传递给该函数。图像名称、宽度和高度的确切值将由\
  \ PHP 确定。\n\n在 JavaScript 中创建函数的语法与 PHP 中的用户定义函数非常相似，只是变量前没有初始的美元符号。\n\n### 3. 将接收到的\
  \ `width` 和 `height` 值各增加十个像素：\n\n```javascript\nwidth = width + 10;\nheight = height\
  \ + 10;\n```\n\n将向宽度和高度值添加一些像素，以创建一个比图像本身稍大的窗口。JavaScript 中的数学运算使用的运算符与几乎所有语言中的相同。\n\
  \n### 4. 如果弹出窗口已打开，则调整其大小：\n\n```javascript\nif (window.popup && !window.popup.closed)\
  \ {\n  window.popup.resizeTo(width, height);\n}\n```\n\n**脚本 11.3。** `function.js`\
  \ 脚本定义了一个用于创建弹出窗口的 JavaScript 函数，该窗口将显示单个图像。\n\n---\n\n```javascript\n1  // 脚本 11.3\
  \ - function.js\n2\n3  // 创建弹出窗口函数：\n4  function create_window(image, width,\n \
  \     height) {\n5\n6      // 向宽度和高度添加一些像素：\n7      width = width + 10;\n8     \
  \ height = height + 10;\n9\n10     // 如果窗口已经打开，\n11     // 将其调整为新尺寸：\n12     if\
  \ (window.popup && !window.popup.\n      closed) {\n13         window.popup.resizeTo(width,\
  \ height);\n14     }\n15\n16     // 设置窗口属性：\n17     var specs = \"location=no,\n\
  \      scrollbars=no, menubars=no,\n      toolbars=no, resizable=yes,\n      left=0,\
  \ top=0, width=\" + width + \",\n      height=\" + height;\n18\n19     // 设置 URL：\n\
  20     var url = \"show_image.php?image=\" +\n      image;\n21\n22     // 创建弹出窗口：\n\
  23     popup = window.open(url, \"ImageWindow\",\n      specs);\n24     popup.focus();\n\
  25\n26 } // 函数结束。\n```\n\n---\n\n稍后在函数中，将创建一个窗口并与 `popup` 变量关联。如果用户点击一个图像名称，创建了弹出窗口，然后在未关闭第一个弹出窗口的情况下点击另一个图像的名称，新图像将显示在一个尺寸不合适的窗口中。为防止这种情况，此处的一段代码首先检查弹出窗口是否存在以及是否未关闭。如果这两个条件均为\
  \ TRUE（即窗口已打开），则将根据新图像的尺寸调整窗口大小。这是通过调用 `popup` 对象的 `resizeTo()` 方法来实现的（*方法* 是面向对象编程中对函数的称呼）。\n\
  \n### 5. 确定弹出窗口的属性：\n\n```javascript\nvar specs = \"location=no, scrollbars=no,\
  \ menubars=no, toolbars=no, resizable=yes, left=0, top=0, width=\" + width + \"\
  , height=\" + height;\n```\n\n此行创建一个名为 `specs` 的新 JavaScript 变量。变量名前的 `var` 关键字是在函数内创建变量的首选方式（具体来说，它创建一个*局部于*该函数的变量）。请注意，`image`、`width`\
  \ 和 `height` 变量未使用此关键字，因为它们是作为函数的参数创建的。\n\n此变量将用于确定弹出窗口的属性。该窗口将没有地址栏、滚动条、菜单或工具栏；它应该是可调整大小的；它将位于屏幕的左上角；并且其宽度为\
  \ `width`，高度为 `height` ![Image](img/circle-c.jpg)。\n\n![Image](img/11_figure_19_c.jpg)\n\
  \n![Image](img/circle-c.jpg)由 JavaScript 创建的弹出窗口。\n\n在 JavaScript 中，字符串使用加号进行连接（而\
  \ PHP 使用句点）。\n\n### 6. 定义 URL：\n\n```javascript\nvar url = \"show_image.php?image=\"\
  \ + image;\n```\n\n此代码设置弹出窗口的 URL，即指定窗口应加载的页面。该页面是 `show_image.php`，将在本章后面创建。`show_image.php`\
  \ 脚本期望在 URL 中接收图像的名称，因此 `url` 变量的值是 `show_image.php?image=` 加上连接在末尾的图像名称 ![Image](img/circle-d.jpg)。\n\
  \n![Image](img/11_figure_20_d.jpg)\n\n![Image](img/circle-d.jpg)弹出窗口的地址显示了图像值如何在\
  \ URL 中传递。\n\n### 7. 创建弹出窗口：\n\n```javascript\npopup = window.open(url, \"ImageWindow\"\
  , specs);\npopup.focus();\n```\n\n最后，使用 `window` 对象的 `open()` 方法创建弹出窗口。`window`\
  \ 对象是由浏览器创建的全局 JavaScript 对象，用于引用打开的窗口。`open()` 方法的第一个参数是要加载的页面，第二个是赋予窗口的标题，第三个是属性列表。请注意，此窗口的创建被赋值给了\
  \ `popup` 变量。因为该变量的创建不以关键字 `var` 开头，所以 `popup` 将是一个全局变量。这是必需的，以便该函数的多次调用能够引用同一个变量。\n\
  \n最后，将焦点给予新窗口，意味着它应出现在当前窗口之上。\n\n### 8. 将脚本另存为 `function.js`。\n\n### 9. 将该脚本或其副本放置在\
  \ Web 目录的 `js` 文件夹中。\n\nJavaScript 与 CSS 一样，在整理 Web 目录时应当分离出来。通常，外部 JavaScript 文件放置在名为\
  \ `js`、`javascript` 或 `scripts` 的文件夹中。\n\n### 创建 PHP 脚本\n\n现在，页面所需的 JavaScript 代码已创建完毕，是时候创建\
  \ PHP 脚本本身了（它将输出调用 JavaScript 函数的 HTML）。该脚本的目的是列出所有已由 `upload_image.php` 上传的图像。为此，PHP\
  \ 需要动态检索 `uploads` 目录的内容。这可以通过 `scandir()` 函数完成。它返回一个数组，列出给定目录中的文件（该函数在 PHP 5 中添加）。\n\
  \nPHP 脚本必须将显示的每个图像名称链接为对刚才定义的 JavaScript 函数的调用。该函数期望接收三个参数：图像的名称、宽度和高度。为了让 PHP 找到后两个值，脚本将使用\
  \ `getimagesize()` 函数。它返回给定图像的信息数组（**表 11.3**）。\n\n#### 表 11.3. `getimagesize()`\
  \ 数组\n\n![Image](img/11tab03.jpg)\n\n### 使用 PHP 创建 JavaScript\n\n### 1. 在文本编辑器或\
  \ IDE 中开始一个新的 PHP 文档，命名为 `images.php`（**脚本 11.4**）：\n\n```html\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Images</title>\n```\n\n### 2. 包含 JavaScript 文件：\n\n```html\n<script type=\"\
  text/javascript\" charset=\"utf-8\" src=\"js/function.js\"></script>\n```\n\n你可以在\
  \ HTML 页面的任何位置使用 `script` 标签，但外部文件的引入通常在文档的 head 部分进行。对 `function.js` 的引用假设该文件将在\
  \ `js` 目录中找到，而 `js` 目录位于当前脚本所在的同一目录中（参见 ![Image](img/graycircle-d.jpg)“处理文件上传”下）。\n\
  \n**脚本 11.4。** `images.php` 脚本使用 JavaScript 和 PHP 创建指向存储在服务器上的图像的链接。图像将通过 `show_image.php`（脚本\
  \ 11.5）查看。\n\n---\n\n```html\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n   \
  \   1.0 Transitional//EN\" \"http://www.w3.org/\n2  1.0 Transitional//EN\" \"http://www.w3.org/\n\
  ```\n\n\n\n\n### 代码示例：images.php\n\n```html\nTR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/\nxhtml\" xml:lang=\"en\" lang=\"en\">\n\
  <head>\n  <meta http-equiv=\"Content-Type\"\n        content=\"text/html; charset=utf-8\"\
  \ />\n  <title>Images</title>\n  <script type=\"text/javascript\" charset=\n   \
  \       \"utf-8\" src=\"js/function.js\"></script>\n</head>\n<body>\n<p>Click on\
  \ an image to view it in a\nseparate window.</p>\n<ul>\n<?php # Script 11.4 - images.php\n\
  // This script lists the images in the\n// uploads directory.\n\n$dir = '../uploads';\
  \ // Define the\n// directory to view.\n\n$files = scandir($dir); // Read all the\n\
  // images into an array.\n\n// Display each image caption as a link\n// to the JavaScript\
  \ function:\nforeach ($files as $image) {\n\n  if (substr($image, 0, 1) != '.')\
  \ { //\n    // Ignore anything starting with a period.\n\n    // Get the image's\
  \ size in pixels:\n    $image_size = getimagesize\n      (\"$dir/$image\");\n\n\
  \    // Make the image's name URL-safe:\n    $image_name = urlencode($image);\n\n\
  \    // Print the information:\n    echo \"<li><a href=\\\"javascript:\n      create_window('$image_name',\n\
  \      $image_size[0],$image_size[1])\\\">\n      $image</a></li>\\n\";\n\n  } //\
  \ End of the IF.\n\n} // End of the foreach loop.\n?>\n</ul>\n</body>\n</html>\n\
  ```\n\n---\n\n### 步骤解析\n\n### 3. 完成 HTML 头部并开始 body 部分\n\n```html\n</head>\n\n<body>\n\
  <p>Click on an image to view it in a separate window.</p>\n```\n\n### 4. 开始 HTML\
  \ 无序列表\n\n```html\n<ul>\n```\n\n为了简单起见，该脚本将每个图像作为无序列表中的一个项目显示。\n\n### 5. 启动 PHP\
  \ 代码并通过引用 `uploads` 目录创建图像数组\n\n```php\n<?php # Script 11.4 - images.php\n$dir =\
  \ '../uploads';\n$files = scandir($dir);\n```\n\n该脚本将自动列出并链接存储在 `uploads` 文件夹中的所有图像（推测是由\
  \ **`upload_image.php`** 放置的，参见 Script 11.3）。代码首先将目录定义为一个变量，以便于引用。然后 **`scandir()`**\
  \ 函数（该函数返回在文件夹中找到的文件和目录的数组）将该信息赋值给名为 **`$files`** 的数组。\n\n### 6. 开始遍历 **`$files`**\
  \ 数组\n\n```php\nforeach ($files as $image) {\n  if (substr($image, 0, 1) != '.')\
  \ {\n```\n\n此循环将遍历数组中的每个图像并为其创建一个列表项。在循环内部，有一个条件判断，检查文件名的第一个字符是否为句点。在非 Windows 系统中，隐藏文件以句点开头，当前目录用单个句点表示，两个句点表示父目录。由于所有这些都可能包含在\
  \ **`$files`** 中，因此需要将它们剔除。\n\n### 7. 获取图像信息并对其名称进行编码\n\n```php\n$image_size = getimagesize\
  \ (\"$dir/$image\");\n$image_name = urlencode($image);\n```\n\n**`getimagesize()`**\
  \ 函数返回一个包含图像信息的数组（参见 表 11.3）。该函数返回的值将用于设置发送给 JavaScript **`create_window()`** 函数的宽度和高度。\n\
  \n接下来，**`urlencode()`** 函数使字符串可以安全地在 URL 中传递。因为图像名称可能包含 URL 中不允许的字符（并且在调用 **`show_image.php`**\
  \ 时将在 URL 中传递），所以名称应进行编码。\n\n### 8. 打印列表项\n\n```php\necho \"<li><a href=\\\"javascript:\
  \ create_window('$image_name', $image_size[0],$image_size[1])\\\"> $image</a>\\\
  n\";\n```\n\n最后，循环创建 HTML 列表项，由链接的图像名称组成。链接本身是对 JavaScript **`create_window()`**\
  \ 函数的调用。为了在 HTML 中执行 JavaScript 函数，请在其前面加上 **`javascript:`**。（在 HTML 中调用 JavaScript\
  \ 还有更多内容，但目前只需使用此语法。）\n\n该函数的三个参数分别是：图像名称、图像宽度和图像高度。因为图像名称是字符串，所以必须用引号括起来。\n\n###\
  \ 9. 完成 `if` 条件、`foreach` 循环和 PHP 部分\n\n```php\n} // End of the IF.\n} // End of\
  \ the foreach loop.\n?>\n```\n\n### 10. 完成无序列表和 HTML 页面\n\n```html\n</ul>\n</body>\n\
  </html>\n```\n\n### 11. 保存文件并测试\n\n将文件保存为 **`images.php`**，将其放在您的 Web 目录中（与 **`upload_image.php`**\
  \ 位于同一目录），并在 Web 浏览器中测试。\n\n请注意，单击链接目前还不起作用，因为 **`show_image.php`**（弹出窗口尝试加载的页面）尚未创建。\n\
  \n### 12. 查看源代码以查看动态生成的链接\n\n请注意每个函数调用的参数如何适合特定图像。\n\n---\n\n### 提示\n\n不同的浏览器处理窗口大小调整的方式不同。例如，在我的测试中，Google\
  \ Chrome 始终要求窗口至少具有特定宽度，而 Internet Explorer 9 会在四周填充显示的图像。\n\n---\n\n### 提示\n\n\
  某些版本的 Windows 会在图像文件夹中创建 **`Thumbs.db`** 文件。您可能需要在第 6 步剔除某些返回项的条件判断中检查此值。代码如下：\n\
  \n```php\nif ( (substr($image, 0, 1) != '.') && ($image != 'Thumbs.db') ) {\n```\n\
  \n---\n\n### 提示\n\n不想过分强调，但 Web 开发人员使用 JavaScript 所做的大多数事情（例如，调整或移动浏览器窗口）都无法使用服务端的\
  \ PHP 完成。\n\n---\n\n### 提示\n\nPHP 和 JavaScript 之间*略有*重叠。两者都可以设置和读取 Cookie、创建 HTML\
  \ 以及进行一些浏览器检测。\n\n---\n\n### 理解 HTTP 头部\n\n刚创建的 **`images.php`** 脚本显示图像名称列表，每个名称都链接到一个\
  \ JavaScript 函数调用。该 JavaScript 函数创建一个弹出窗口，加载一个将实际显示图像的 PHP 脚本。这听起来可能是小题大做，但其中自有深意。采用这种方法的一个次要原因是，需要\
  \ JavaScript 才能创建一个适合图像大小的窗口（而不是创建任意大小的弹出窗口，其中包含图像）。更为重要的是，因为图像存储在 **`uploads`**\
  \ 目录中，理想情况下存储在 Web 根目录之外，所以无法在 Web 浏览器中直接使用以下任一方式查看图像：\n\n- `http://www.example.com/uploads/image.png`\n\
  - `<img src=\"image.png\" />`\n\n上述两种方式均无效的原因是，根据定义，位于 Web 根目录之外的文件和文件夹无法通过 Web\
  \ 浏览器访问。这实际上是一件好事，因为它允许您保护内容，仅在适当的时候提供内容。要通过 Web 浏览器使该内容可用，您需要在 PHP 中创建一个*代理脚本*。代理脚本只需履行一个角色，例如提供文件（显示图像实际上就是向浏览器提供文件）。因此，给定代理脚本\
  \ **`proxy.php`**，上述示例可以通过以下任一方式工作：\n\n- `http://www.example.com/proxy.php?image=image.png`\n\
  - `<img src=\"proxy.php?image=image.png\" />`\n\n![图 11-21：代理脚本能够提供对服务器上原本不可用内容的访问](img/11_figure_21_a.jpg)\n\
  \n代理脚本能够提供对服务器上原本不可用内容的访问。\n\n\n\n\n这当然正是 `create_window()` JavaScript 函数中链接的 `show_image.php`\
  \ 所做的事情。但是 `proxy.php` 或 `show_image.php` 是如何工作的呢？答案在于对 HTTP 头部的理解。\n\nHTTP（超文本传输协议）是万维网的核心技术，定义了客户端和服务器通信的方式（用通俗的话说）。当浏览器请求一个网页时，它会收到一系列\
  \ HTTP 头部作为响应。这发生在后台；大多数用户完全意识不到这一点。\n\nPHP 内置的 `header()` 函数可用于利用这一协议。最常见的例子将在下一章演示，那时将使用\
  \ `header()` 函数将 Web 浏览器从当前页面重定向到另一个页面。在这里，你将用它向 Web 浏览器发送文件。\n\n理论上，`header()`\
  \ 函数很容易使用。其语法是：\n\n```\nheader(header string);\n```\n\n可能的头部字符串列表相当长，因为头部用于从重定向\
  \ Web 浏览器、发送文件、创建 Cookie，到控制页面缓存，以及更多更多功能。从简单的开始，要使用 `header()` 重定向 Web 浏览器，请输入：\n\
  \n```\nheader('Location: http://www.example.com/page.php');\n```\n\n该行将把 Web 浏览器从当前页面发送到另一个\
  \ URL。你将在下一章看到这方面的例子。\n\n在下一个将图像文件发送到 Web 浏览器的示例中，使用了三个头部调用。第一个是 `Content-Type`。这是向\
  \ Web 浏览器指示即将发送什么类型的数据。`Content-Type` 值与数据的 MIME 类型匹配。此行让浏览器知道它即将接收一个 PDF 文件：\n\n\
  ```\nheader(\"Content-Type:application/pdf\\n\");\n```\n\n接下来，你可以使用 `Content-Disposition`，它告诉浏览器如何处理数据：\n\
  \n```\nheader(\"Content-Disposition: attachment; filename=\\\"somefile.pdf\\\"\\\
  n\");\n```\n\n`attachment` 值将提示浏览器下载该文件。另一种选择是使用 `inline`，它告诉浏览器显示数据，前提是浏览器支持。`filename`\
  \ 属性顾名思义：它告诉浏览器与数据关联的名称。一些浏览器遵循此指令，另一些则不遵循。\n\n![Image](img/11_figure_22_b.jpg)\n\
  \n由于 `attachment Content-Disposition` 值，Firefox 提示用户下载文件。\n\n用于下载文件的第三个头部是 `Content-Length`。这是一个以字节为单位的值，对应于要发送的数据量。\n\
  \n```\nheader(\"Content-Length: 4096\\n\");\n```\n\n这就是关于使用 `header()` 函数的基础知识。在进入示例之前，请注意，如果脚本使用多个\
  \ `header()` 调用，每个调用都应以换行符（`\\n`）结尾，如前面的代码片段所示。更重要的是，关于 `header()` 函数必须记住的绝对关键一点是，它必须在向\
  \ Web 浏览器发送*任何内容*之前调用。这包括 HTML，甚至是空白字符。如果你的代码有任何 `echo` 或 `print` 语句，PHP 标签外有空行，或包含在调用\
  \ `header()` 之前做这些事情的文件，你将看到如下图所示的错误消息。\n\n![Image](img/11_figure_23_c.jpg)\n\n\
  *headers already sent*（头部已发送）错误意味着在使用 `header()` 函数之前，Web 浏览器已经接收到了某些内容——HTML、纯文本，甚至是一个空格。\n\
  \n#### 使用 header() 函数\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `show_image.php`（**脚本\
  \ 11.5` 函数，所以绝对不能向 Web 浏览器发送任何内容——绝对没有任何内容。没有 HTML，甚至没有开头 PHP 标签之前的空行、制表符或空格。\n\n\
  `$name` 变量将用作标志，指示所有验证例程是否已通过。\n\n**2.** 检查图像名称：\n\n```\nif (isset($_GET['image']))\
  \ {\n```\n\n脚本需要在 URL 中接收一个有效的图像名称。这应该由调用此页面的 JavaScript 函数追加到 URL 中（参见 `function.js`，**脚本\
  \ 11.3**）。\n\n**3.** 验证图像的扩展名：\n\n```\n$ext = strtolower(substr($_GET['image'],\
  \ -4));\n\nif (($ext == '.jpg') OR ($ext == 'jpeg') OR ($ext == '.png')) {\n```\n\
  \n下一个检查是要发送给 Web 浏览器的文件是否具有 `.jpeg`、`.jpg` 或 `.png` 扩展名。这样脚本就不会尝试向用户发送不良内容。例如，如果恶意用户将弹出窗口中的地址从\
  \ `http://www.example.com/show_image.php?image=image.png` 改为 `http://www.example.com/show_image.php?image=../../../path/to/something/important`，此条件将捕获并防止该攻击。\n\
  \n**脚本 11.5。** 此脚本从服务器检索图像并使用 HTTP 头部将其发送到浏览器。\n\n```\n<?php # Script 11.5 - show_image.php\n\
  // This page displays an image.\n\n$name = FALSE; // Flag variable:\n\n// Check\
  \ for an image name in the URL:\nif (isset($_GET['image'])) {\n\n    // Make sure\
  \ it has an image's\n    extension:\n    $ext = strtolower(substr($_GET\n      \
  \  ['image'], -4));\n\n    if (($ext == '.jpg') OR ($ext ==\n        'jpeg') OR\
  \ ($ext == '.png')) {\n\n        // Full image path:\n        $image = \"../uploads/{$_GET['image']}\"\
  ;\n\n        // Check that the image exists and\n        is a file:\n        if\
  \ (file_exists($image) &&\n            (is_file($image))) {\n\n            // Set\
  \ the name as this image:\n            $name = $_GET['image'];\n\n        } // End\
  \ of file_exists() IF.\n\n    } // End of $ext IF.\n\n} // End of isset($_GET['image'])\
  \ IF.\n\n// If there was a problem, use the\ndefault image:\nif (!$name) {\n   \
  \ $image = 'images/unavailable.png';\n    $name = 'unavailable.png';\n}\n\n// Get\
  \ the image information:\n$info = getimagesize($image);\n$fs = filesize($image);\n\
  \n// Send the content information:\nheader(\"Content-Type: {$info['mime']}\\n\"\
  );\nheader(\"Content-Disposition: inline;\n    filename=\\\"$name\\\"\\n\");\nheader(\"\
  Content-Length: $fs\\n\");\n\n// Send the file:\nreadfile($image);\n```\n\n为了验证扩展名，`substr()`\
  \ 函数返回图像名称的最后四个字符（`-4` 实现这一点）。扩展名还通过 `strtolower()` 函数处理，以便 `.PNG` 和 `.png` 被同等对待。然后条件语句检查\
  \ `$ext` 是否等于三个允许值中的任意一个。\n\n**4.** 检查图像是否为服务器上的文件：\n\n```\n$image = \"../uploads/{$_GET['image']}\"\
  ;\n\nif (file_exists($image) && (is_file($image))) {\n```\n\n在尝试将图像发送到 Web 浏览器之前，请确保它存在且为文件（而不是目录）。作为安全措施，图像的完整路径被定义为\
  \ `../uploads` 和接收到的图像名称的组合。\n\n**5.** 将标志变量的值设置为图像名称：\n\n```\n$name = $_GET['image'];\n\
  ```\n\n一旦图像通过了所有这些测试，`$name` 变量将被赋予图像的值。\n\n**6.** 完成步骤 2、3 和 4 中开始的条件语句：\n\n```\n\
  } // End of file_exists() IF.\n} // End of $ext IF.\n} // End of isset($_GET['image'])\
  \ IF.\n```\n\n\n\n这三个条件都没有 `else` 子句。如果这三个条件都不为 TRUE，那么标志变量 `$name` 仍将保持 FALSE 值。\n\
  \n**7.** 如果此页面未接收到有效图像，则使用默认图像：\n\n```\nif (!$name) {\n  $image = 'images/unavailable.png';\n\
  \  $name = 'unavailable.png';\n}\n```\n\n如果图像不存在、不是文件或没有正确的扩展名，则 `$name` 变量的值仍将为\
  \ FALSE。在这种情况下，将改用默认图像 ![Image](img/circle-d.jpg)。该图像本身可从本书对应的网站（**[www.LarryUllman.com](http://www.LarryUllman.com)**，可在其中找到所有可下载的代码）下载，并应放置在\
  \ `images` 文件夹中。`images` 文件夹应与此脚本位于同一目录下，而不是与 `uploads` 文件夹位于同一目录下。\n\n![Image](img/11_figure_24_d.jpg)\n\
  \n![Image](img/circle-d.jpg)每当显示请求的图像出现问题时，都将显示此图像。\n\n**8.** 检索图像的信息：\n\n```\n\
  $info = getimagesize($image);\n$fs = filesize($image);\n```\n\n要将文件发送到 Web 浏览器，脚本需要知道文件的\
  \ MIME 类型和大小。图像文件的类型可以使用 `getimagesize()` 找到。文件的大小（以字节为单位）可以使用 `filesize()` 找到。因为\
  \ `$image` 变量代表 `../uploads/{$_GET['image']}` 或 `images/unavailable.png`，所以这些代码行对正确的图像和不可用的图像都有效。\n\
  \n**9.** 发送文件：\n\n```\nheader (\"Content-Type: {$info['mime']}\\n\");\nheader (\"\
  Content-Disposition: inline; filename=\\\"$name\\\"\\n\");\nheader (\"Content-Length:\
  \ $fs\\n\");\n```\n\n这些 `header()` 调用将文件数据发送到 Web 浏览器。第一行使用图像的 MIME 类型作为 *Content-Type*\
  \ 标头的值。第二行告诉浏览器文件的名称，并指示应在浏览器中显示（`inline`）。最后一个 `header()` 函数指示预期的数据量。\n\n文件数据本身使用\
  \ `readfile()` 函数发送，该函数读取文件并立即将内容发送到 Web 浏览器。\n\n**10.** 将文件保存为 `show_image.php`，将其放在你的\
  \ Web 目录中，与 `images.php` 在同一文件夹中，然后通过在 `images.php` 中点击链接在 Web 浏览器中测试它 ![Image](img/circle-e.jpg)。\n\
  \n![Image](img/11_figure_25_e.jpg)\n\n![Image](img/circle-e.jpg)此图像是通过让 PHP 将文件发送到\
  \ Web 浏览器来显示的。\n\n请注意，此页面不包含 HTML。它仅将图像文件发送到 Web 浏览器。另请注意，我省略了结束 PHP 标记。这是可以接受的，在某些像这样的情况下，这是首选。如果你包含了结束\
  \ PHP 标记，并且在该标记后无意中有多余的空格或空行，浏览器可能会在显示图像时出现问题（因为浏览器将接收到长度为 *X* 的图像数据，与 *Content-Length*\
  \ 标头匹配，外加一点额外的数据）。\n\n***\n\n提示\n\n我再怎么强调也不为过：在使用 `header()` 函数之前，*绝不能*有任何内容发送到\
  \ Web 浏览器。即使是一个包含文件，在结束 PHP 标记后有一个空行，也会导致 `header()` 函数无法使用。\n\n***\n\n***\n\n提示\n\
  \n为避免使用 `header()` 时出现问题，可以先调用 `headers_sent()` 函数。它返回一个布尔值，指示是否已有内容发送到 Web 浏览器：\n\
  \n```\nif (!headers_sent()) {\n  // 使用 header() 函数。\n} else {\n  // 执行其他操作。\n}\n\
  ```\n\n输出缓冲（在第 17 章“示例——用户注册”中演示）也可以防止使用 `header()` 时出现问题。\n\n***\n\n***\n\n提示\n\
  \n调试此类脚本（PHP 向 Web 浏览器发送数据而非文本）可能具有挑战性。如需帮助，请使用 Firefox 浏览器的众多开发者插件之一 ![Image](img/circle-f.jpg)。\n\
  \n![Image](img/11_figure_26_f.jpg)\n\n![Image](img/circle-f.jpg)Firefox 的 Web Developer\
  \ Toolbar 扩展包含查看页面和/或服务器发送了哪些标头的功能。这对于调试很有用。\n\n***\n\n***\n\n提示\n\n你也可以使用 PHP 和\
  \ `header()` 函数向 Web 浏览器指示页面的编码：\n\n```\n<?php header ('Content-Type: text/html;\
  \ charset=UTF-8'); ?>\n```\n\n这可能比使用 `META` 标签更有效，但它要求页面必须是 PHP 脚本。如果使用此方法，它必须是页面的第一行，位于任何\
  \ HTML 之前。\n\n***\n\n***\n\n提示\n\n代理脚本一次只能向浏览器发送单个文件（或图像）。\n\n***\n\n### 日期和时间函数\n\
  \n第 5 章“SQL 简介”演示了 MySQL 支持的几个很棒的日期和时间函数。当然，PHP 也有自己的日期和时间函数。首先是 `date_default_timezone_set()`。此函数用于设置默认时区（也可以在\
  \ PHP 的配置文件中设置）。\n\n```\ndate_default_timezone_set(tz);\n```\n\n*tz* 值是一个字符串，如 *America/New_York*\
  \ 或 *Pacific/Auckland*。此处列举不完（仅非洲就有 50 多个），但请参阅 PHP 手册获取所有值。请注意，自 PHP 5.1 起，必须在脚本或\
  \ PHP 的配置文件中设置默认时区，然后才能调用任何日期和时间函数，否则你会看到错误。\n\n接下来是 `checkdate()` 函数，它接受月、日、年并返回一个布尔值，指示该日期是否真实存在（或曾经存在过）。它甚至会考虑闰年。此函数可用于确保用户提供了有效日期（出生日期或其他）：\n\
  \n```\nif (checkdate(month, day, year)) { // OK!\n```\n\n也许最常用的函数是名副其实的 `date()`。它将日期和/或时间作为格式化字符串返回。它接受两个参数：\n\
  \n```\ndate (format, [timestamp]);\n```\n\ntimestamp 是一个可选参数，表示从 Unix 纪元（1970 年\
  \ 1 月 1 日午夜）到相关日期的秒数。它允许你获取特定日期的信息，如星期几。如果未指定 timestamp，PHP 将直接使用服务器上的当前时间。\n\n\
  有无数可用的格式化参数（**表 11.4**），这些参数可以与字面文本结合使用。例如，\n\n```\necho date('F j, Y'); // January\
  \ 26, 2011\necho date('H:i'); // 23:14\necho date('D'); // Sat\n```\n\n**表 11.4.\
  \ Date() 函数格式化**\n\n![Image](img/11tab04.jpg)\n\n你可以使用 `mktime()` 函数找到特定日期的时间戳：\n\
  \n```\n$stamp = mktime (hour, minute, second, month, day, year);\n```\n\n如果不带参数调用，`mktime()`\
  \ 返回当前时间戳，这与调用 `time()` 函数相同。\n\n最后，`getdate()` 函数可用于返回日期和时间的值数组（**表 11.5**）。例如，\n\
  \n```\n$today = getdate();\necho $today['month']; // October\n```\n\n**表 11.5. getdate()\
  \ 数组**\n\n![Image](img/11tab05.jpg)\n\n此函数也接受一个可选的 timestamp 参数。如果不使用该参数，`getdate()`\
  \ 将返回当前日期和时间的信息。\n\n这些只是 PHP 众多日期和时间函数中的一小部分。更多内容请参阅 PHP 手册。为了练习使用这些函数，让我们以几种方式修改\
  \ `images.php`（脚本 11.4）。首先，脚本将显示每个图像的上传日期和时间。其次，在更改布局的同时，脚本也将显示每个图像的文件大小 ![Image](img/circle-a.jpg)。\n\
  \n![Image](img/11_figure_27_a.jpg)\n\n\n\n![Image](img/circle-a.jpg) 修订后的 `images.php`\
  \ 显示了每张图片的两项更多信息。\n\n#### 使用日期和时间函数\n\n1.  在文本编辑器或 IDE 中打开 `images.php`（脚本 11.4）（如果尚未打开）。\n\
  \n2.  在开始 PHP 标记后的第一行代码中，设置时区（脚本 11.6）：\n\n    ```\n    date_default_timezone_set\
  \ ('America/New_York');\n    ```\n\n    在调用任何日期和时间函数之前，必须先设置时区。要查找您的时区，请参阅 [www.php.net/timezones](http://www.php.net/timezones)。\n\
  \n3.  在 `foreach` 循环中，获取图片尺寸后，计算其文件大小：\n\n    ```\n    $file_size = round ( (filesize\
  \ (\"$dir/$image\")) / 1024) . \"kb\";\n    ```\n\n    `filesize()` 函数首次用于 `show_image.php`\
  \ 脚本中。它以字节为单位返回文件大小。要计算文件的千字节数，将该数字除以 1,024（1 千字节有这么多字节）并四舍五入。\n\n4.  在下一行，确定图片的修改日期和时间：\n\
  \n    ```\n    $image_date = date(\"F d, Y H:i:s\", filemtime(\"$dir/$image\"));\n\
  \    ```\n\n    要查找文件的修改日期和时间，请调用 `filemtime()` 函数，并向该函数提供要检查的文件或目录。此函数返回一个时间戳，随后可将其作为第二个参数传递给\
  \ `date()` 函数，后者将相应地格式化该时间戳。\n\n    如果您对这里发生的事情感到困惑，可以将代码拆分为两步：\n\n    ```\n   \
  \ $filemtime = filemtime (\"$dir/$image\");\n    $image_date = date(\"F d, Y H:i:s\
  \ \", $filemtime);\n    ```\n\n5.  修改 echo 语句，使其同时打印文件大小和修改日期：\n\n    ```\n    echo\
  \ \"<li><a href=\\\"javascript: create_window('$image_name', $image_size[0],$image_size[1])\\\
  \"> $image</a> $file_size ($image_date)</li>\\n\";\n    ```\n\n    这两项都打印在 `A` 标记之外，因此它们不是链接的一部分。\n\
  \n6.  将文件另存为 `images.php`，将其放入您的 Web 目录中，并在 Web 浏览器中测试它。\n\n***\n\n> **提示**\n>\n\
  > `date()` 函数有一些参数用于提供信息，而非格式化。例如，`date('L')` 返回 1 或 0 以指示是否为闰年；`date('t')` 返回当前月份的天数；`date('I')`\
  \ 如果当前为夏令时则返回 1。\n\n***\n\n> **提示**\n>\n> PHP 的日期函数反映的是服务器上的时间（因为 PHP 运行在服务器上）；如果您想确定用户计算机上的日期和时间，则需要使用\
  \ JavaScript。\n\n***\n\n> **提示**\n>\n> 在 第 16 章 中，您将学习如何使用新的 `DateTime` 类在 PHP 中处理日期和时间。\n\
