  \n---\n\n### 查询结果分页\n\n*分页* 是一个你熟悉的概念，即使你不知道这个术语。当你使用像 Google 这样的搜索引擎时，它会将结果显示为一系列页面，而不是一个长长的列表。`view_users.php`\
  \ 脚本将受益于此功能。\n\n查询结果分页广泛使用了在 第 5 章 中介绍的 `LIMIT` SQL 子句。`LIMIT` 限制实际返回的匹配记录的子集。要对查询返回的结果进行分页，每次页面迭代将使用不同的\
  \ `LIMIT` 参数运行相同的查询。第一次查看页面将请求前 *X* 条记录；第二次查看页面，第二组 *X* 条记录；以此类推。要使其工作，必须在 URL 中从页面传递两个值到页面，就像从\
  \ `view_users.php` 页面传递用户 ID 一样。第一个值是要显示的总页数。第二个值是指示页面在此次迭代中应显示哪些记录的指标（即从何处开始获取记录）。\n\
  \n此处将演示另一种更美观的技术：使用交替的背景颜色显示表格的每一行——每一条返回的记录 ![Image](img/circle-a.jpg)。利用三元运算符（参见侧边栏“三元运算符”），可以轻松实现此效果。\n\
  \n![Image](img/10_figure_13_a.jpg)\n\n![Image](img/circle-a.jpg)交替表格行颜色使这份用户列表更易读（每隔一行具有浅灰色背景）。\n\
