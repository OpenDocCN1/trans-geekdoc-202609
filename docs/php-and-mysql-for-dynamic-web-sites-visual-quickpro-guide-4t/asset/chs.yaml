  \ %d, %Y')\n20     AS dr FROM users ORDER BY\n21     registration_date ASC\";\n\
  22 $r = $mysqli->query($q); // Run the query.\n23\n24 // Count the number of returned\
  \ rows:\n25 $num = $r->num_rows;\n26\n27 if ($num > 0) { // If it ran OK, display\
