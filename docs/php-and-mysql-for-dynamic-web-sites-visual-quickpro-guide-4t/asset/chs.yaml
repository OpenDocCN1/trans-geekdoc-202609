  \n> **提示**\n>\n> 使用 `fetch_object()` 方法的真正好处在于，您可以将结果作为*特定类型的对象*获取。例如，假设您在 PHP 中定义了一个\
  \ `Car` 类，并且一个脚本从数据库中获取了关于汽车的所有存储信息。在 PHP 脚本中，每条记录都可以作为 `Car` 类类型的对象获取。通过这样做，您将创建一个\
  \ PHP `Car` 对象，其数据来自数据库记录填充，但仍然可以调用 `Car` 类的方法。\n\n---\n\n#### 预处理语句\n\n第 13 章介绍了执行查询的另一种方式：使用*预处理语句*。与运行查询的标准方法相比，预处理语句可以提供更好的安全性，甚至可能获得更好的性能。当然，您可以使用\
  \ MySQL Improved 扩展以对象的方式执行预处理语句。步骤是相同的：创建一个 `MySQLi` 对象（从而建立与数据库的连接）后，您需要\n\n*\
  \   准备查询\n*   绑定参数\n*   执行查询\n\n在实际代码中如下所示：\n\n```php\n$q = 'INSERT INTO tablename\
  \ (this, that) VALUES (?, ?)';\n$stmt = $mysqli->prepare($q);\n$stmt->bind_param('si',\
  \ $this, $that);\n$this = 'Larry';\n$that = 234;\n$stmt->execute();\n```\n\n`MySQLi::prepare()`\
  \ 方法返回一个 `MySQLi_STMT` 类型的对象。该对象有几个关键属性：\n\n*   `affected_rows` 存储语句影响的行数，通常适用于\
  \ `INSERT`、`UPDATE` 和 `DELETE` 查询。\n*   `num_rows` 反映 `SELECT` 查询结果集中的记录数。\n*  \
  \ `insert_id` 存储上一个 `INSERT` 查询自动生成的 ID 值。\n*   `error` 表示可能发生的任何错误。\n\n执行完预处理语句后，您应该关闭该语句：\n\
  \n```php\n$stmt->close();\n```\n\n让我们通过更新 `post_message.php`（脚本 13.6）来应用这些信息。这是一个独立的脚本，使用\
  \ *forum* 数据库，并且在第 13 章或本章中未与任何其他脚本关联。\n\n#### 执行预处理语句\n\n**1.** 在文本编辑器或 IDE 中打开\
  \ `post_message.php`（脚本 13.6）。\n\n**2.** 将数据库连接的创建更改为（脚本 16.4）：\n\n```php\n$mysqli\
  \ = new MySQLi('localhost', 'username', 'password', 'forum');\n$mysqli->set_charset('utf8');\n\
  ```\n\n该脚本的先前版本未使用单独的连接脚本，此版本也不会。请确保您的值对于连接到服务器上的 *forum* 数据库是正确的。\n\n**3.** 将查询的准备更改为（原脚本第\
  \ 21 行）：\n\n```php\n$stmt = $mysqli->prepare($q);\n```\n\n`MySQLi::prepare()` 方法准备一条语句，将查询作为其唯一参数。它返回一个\
  \ `MySQLi_STMT` 类型的对象，此处赋值给 `$stmt`。\n\n**4.** 将参数绑定更改为：\n\n```php\n$stmt->bind_param('iiiss',\
  \ $forum_id, $parent_id, $user_id, $subject, $body);\n```\n\n此代码更改仅是从 `mysqli_stmt_bind_param($stmt...`\
  \ 改为 `$stmt->bind_param(...`。该方法的第一个参数是后续数据类型的指示符。后续参数是查询占位符所绑定的 PHP 变量。\n\n**5.**\
  \ 将语句的执行更新为：\n\n```php\n$stmt->execute();\n```\n\n**脚本 16.4.** 在本章 13 脚本的此版本中，使用\
