  \n\n\n\n\n### 修改条件判断\n\n将测试成功的条件更改为：\n\n```php\nif ($stmt->affected_rows == 1) {\n\
  ```\n\n要确认 `INSERT` 查询的成功，请检查受影响的行数，此处引用 `MySQLi_STMT` 对象的 `affected_rows` 属性。\n\
  \n---\n\n### 出站参数\n\n正如 第 13 章 所示，`post_message.php` 脚本演示了使用**入站参数**：将查询中的占位符与 PHP\
  \ 变量关联。您也可以使用**出站参数**：将查询返回的值绑定到 PHP 变量。\n\n首先，准备查询：\n\n```php\n$q = 'SELECT this,\
  \ that FROM tablename';\n$stmt = $mysqli->prepare($q);\n```\n\n然后将返回的行绑定到变量：\n\n\
  ```php\n$stmt->bind_result($this, $that);\n```\n\n接下来，调用 `MySQLi_STMT::fetch()`\
  \ 方法，通常作为 `while` 循环的一部分：\n\n```php\nwhile ($stmt->fetch()) {\n}\n```\n\n在 `while`\
  \ 循环内，`$this` 和 `$that` 将存储每条记录返回的列。\n\n出站参数不像入站参数那样提供额外的安全性，也不一定提供更好的性能，但如果您有一个使用预处理语句的查询，同时使用入站和出站参数是合理的。例如，以登录查询为例：\n\
  \n```sql\nSELECT user_id, first_name FROM users WHERE email='?' AND pass=SHA1('?')\n\
  ```\n\n您将使用入站参数来表示提交的电子邮件地址和密码，但对同一查询中检索到的用户 ID 和名字使用出站参数。\n\n---\n\n### 步骤 7：更改错误报告\n\
  \n更改为使用：\n\n```php\necho '<p>' . $stmt->error . '</p>';\n```\n\n此时脚本中的错误很可能是由于对必须唯一的列使用了重复值。如果查询中存在语法错误，那将在准备查询后出现在\
  \ `$mysqli->error` 中。\n\n---\n\n### 步骤 8：更新语句关闭方式\n\n```php\n$stmt->close();\nunset($stmt);\n\
  ```\n\n---\n\n### 步骤 9：更改数据库连接关闭方式\n\n```php\n$mysqli->close();\nunset($mysqli);\n\
  ```\n\n---\n\n### 步骤 10：保存并测试\n\n保存脚本，将其放在您的 Web 目录中，并在 Web 浏览器中测试。\n\n![图 16-6](img/16_figure_06_f.jpg)\n\
