  \n### DateTime 类\n\nPHP 5.2 版本新增了 `DateTime` 类。作为 第 11 章 “Web 应用程序开发” 中介绍的日期和时间相关函数的替代方案，`DateTime`\
  \ 类将您可能需要的所有操作日期和时间的功能打包在一起。它对于转换和比较日期时间特别有用。\n\n首先，创建一个新的 `DateTime` 对象：\n\n```php\n\
  $dt = new DateTime();\n```\n\n如果不向构造函数提供任何参数，生成的 `DateTime` 对象将表示当前日期和时间。要创建特定日期和时间的表示，请将其作为第一个参数提供：\n\
  \n```php\n$dt = new DateTime('2011-04-20');\n$dt = new DateTime('2011-04-20 11:15');\n\
  ```\n\nPHP 手册中详细列出了指定日期和时间的许多可接受格式。您也可以在创建对象后，使用 `setDate()` 和 `setTime()` 方法来设定日期或时间。`setDate()`\
  \ 方法按顺序接收所需的年、月、日。`setTime()` 方法将小时、分钟和可选的秒作为其参数：\n\n```php\n$dt = new DateTime();\n\
  $dt->setDate(2001, 4, 20);\n$dt->setTime(11, 15);\n```\n\n`DateTime` 对象仅允许您设定有效的日期和时间，对于无效的日期时间会抛出**异常**：\n\
  \n```php\n$dt = new DateTime('2011-13-42');\n```\n\n![异常示例](img/16_figure_08_a.jpg)\n\
  *尝试使用无效日期或时间创建 `DateTime` 对象会导致异常。*\n\n异常是之前未介绍过的主题。过程式代码可能会生成错误，而对象则**抛出异常**（确实称为“抛出”）。随着您进一步深入面向对象编程（OOP），您将学习如何使用\
  \ `try...catch` 块来“捕获”并处理抛出的异常。\n\n`DateTime` 构造函数接受一个可选的第二个参数，即要使用的时区。如果未提供，则适用于该\
  \ PHP 安装的默认时区。您也可以事后使用 `setTimezone()` 更改时区。请注意，`setTimezone()` 方法和构造函数都接受 `DateTimeZone`\
  \ 对象作为参数，而不是字符串：\n\n```php\n$tz = new DateTimeZone('America/New_York');\n$dt->setTimezone($tz);\n\
  ```\n\n拥有 `DateTime` 对象后，您可以通过添加和减去时间段来操作其值。一种方法是使用 `modify()` 方法：\n\n```php\n$dt->modify('+1\
  \ day');\n$dt->modify('-1 month');\n$dt->modify('next Thursday');\n```\n\n您可以提供给该方法的值非常灵活，对应于\
  \ `strtotime()` 函数（将字符串转换为时间戳；详见 PHP 手册）中可用的值。\n\n`add()` 方法用于向表示的日期和时间添加一个时间段。它接受一个类型为\
  \ `DateInterval` 的对象作为唯一参数：\n\n```php\n$di = new DateInterval(interval);\n$dt->add($di);\n\
  ```\n\n设置间隔有一种特定的表示法，始终以字母 `P`（“period”，时期）开头。之后，添加一个整数和一个时期标识符：`Y` 代表年；`M` 代表月；`D`\
  \ 代表日；`W` 代表周；`H` 代表小时；`M` 代表分；`S` 代表秒。您可能会好奇字母 `M` 如何同时代表月和分：这是可能的，因为小时、分钟和秒也应以\
  \ `T`（“time”，时间）为前缀。这些字符应按从大到小的顺序组合（即从年到秒）。以下是一些示例：\n\n- `P3W` 代表三周\n- `P2Y3M` 代表两年三个月\n\
  - `P2M3DT4H18M43S` 代表两个月、三天、四小时、18 分钟和 43 秒\n\n`sub()` 方法的功能与 `add()` 完全相同，但从对象中减去时间段：\n\
  \n```php\n$di = new DateInterval('P2W'); // 2 weeks\n$dt->sub($di);\n```\n\n`diff()`\
  \ 方法返回一个 `DateInterval` 对象，反映两个 `DateTime` 对象之间的时间差：\n\n```php\n$diff = $dt->diff($dt2);\n\
  ```\n\n`DateInterval` 类定义了几个属性来表示计算出的间隔：`y` 代表年，`m` 代表月，`d` 代表日，`h` 代表小时，`i` 代表分，`s`\
  \ 代表秒，以及 `days`，也代表天数。\n\n您应该熟悉的最后一个 `DateTime` 类方法是 `format()`，它返回按您想要的格式表示的日期：\n\
  \n```php\necho $dt->format(format);\n```\n\n对于格式化，您可以使用与 第 11 章 中介绍的 `date()` 函数相同的字符。\n\
  \n\n\n\n\n#### DateTime 使用演示\n\n为了演示所有这些信息，接下来的脚本将执行许多网站所需的任务：允许用户输入两个日期以创建一个范围。该脚本将对提交的日期执行高质量验证，并计算它们之间的天数。所呈现的信息可以很容易地应用于酒店注册系统等场景。该脚本将使用刚才介绍的大量信息，甚至会直接比较两个\
  \ `DateTime` 对象，这是 PHP 5.2.2 版本起支持的功能。\n\n![一个用于输入两个日期的简单表单，并指明了格式。](img/16_figure_09_b.jpg)\n\
  \n![如果提交了两个有效日期，且结束日期在开始日期之后，则会再次显示这些日期，并显示计算出的间隔。](img/16_figure_10_c.jpg)\n\n\
  ### 脚本 16.5：模拟常见的日期选择功能\n\n该脚本接受并验证两个日期。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\
  \    <title>DateTime Usage</title>\n    <style type=\"text/css\" media=\"screen\"\
  >\n        body {\n            font-family: Verdana, Arial, Helvetica, sans-serif;\n\
  \            font-size: 12px;\n            margin: 10px;\n        }\n        label\
  \ { font-weight: bold; }\n        .error { color: #F00; }\n    </style>\n</head>\n\
  <body>\n<?php # Script 16.5 - datetime.php\n\n// 默认将开始日期和结束日期设为今天和明天：\n$start =\
  \ new DateTime();\n$end = new DateTime();\n$end->modify('+1 day');\n\n// 显示日期的默认格式：\n\
  $format = 'm/d/Y';\n\n// 此函数验证提供的日期字符串。\n// 如果有效，函数返回一个数组——月、日、年。\nfunction validate_date($date)\
  \ {\n\n    // 将字符串拆分为各个部分：\n    $date_array = explode('/', $date);\n\n    // 如果不是\
  \ 3 个项目，返回 FALSE：\n    if (count($date_array) != 3) return false;\n\n    // 如果不是有效日期，返回\
  \ FALSE：\n    if (!checkdate($date_array[0], $date_array[1], $date_array[2])) return\
  \ false;\n\n    // 返回数组：\n    return $date_array;\n\n} // End of validate_date()\
  \ function.\n\n// 检查表单提交：\nif (isset($_POST['start'], $_POST['end'])) {\n\n    //\
  \ 对两个日期调用验证函数：\n    if ( (list($sm, $sd, $sy) = validate_date($_POST['start']))\
  \ && (list($em, $ed, $ey) = validate_date($_POST['end'])) ) {\n\n        // 如果没问题，调整\
  \ DateTime 对象：\n        $start->setDate($sy, $sm, $sd);\n        $end->setDate($ey,\
  \ $em, $ed);\n\n        // 开始日期必须在前：\n        if ($start < $end) {\n\n         \
  \   // 确定间隔：\n            $interval = $start->diff($end);\n\n            // 打印结果：\n\
  \            echo \"<p>The event has been planned starting on {$start->format($format)}\
  \ and ending on {$end->format($format)}, which is a period of $interval->days day(s).</p>\"\
  ;\n\n        } else { // 结束日期必须更晚！\n            echo '<p class=\"error\">The starting\
  \ date must precede the ending date.</p>';\n        }\n\n    } else { // 日期无效！\n\
  \        echo '<p class=\"error\">One or both of the submitted dates was invalid.</p>';\n\
  \    }\n\n} // End of form submission.\n\n// 显示表单：\n?>\n<h2>Set the Start and End\
  \ Dates for the Thing</h2>\n<form action=\"datetime.php\" method=\"post\">\n\n \
  \   <p><label for=\"start_date\">Start Date:</label> <input type=\"text\" name=\"\
  start_date\" value=\"<?php echo $start->format($format); ?>\" /> (MM/DD/YYYY)</p>\n\
  \    <p><label for=\"end_date\">End Date:</label> <input type=\"text\" name=\"end_date\"\
  \ value=\"<?php echo $end->format($format); ?>\" /> (MM/DD/YYYY)</p>\n\n    <p><input\
  \ type=\"submit\" value=\"Submit\" /></p>\n</form>\n</body>\n</html>\n```\n\n---\n\
  \n### 使用 DateTime 类\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 脚本，命名为 `datetime.php`，从 HTML\
  \ 开始（**脚本 16.5**）：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\" lang=\"en\">\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=utf-8\" />\n    <title>DateTime Usage</title>\n```\n\n**2.**\
  \ 添加少量 CSS：\n\n```css\n<style type=\"text/css\" media=\"screen\">\nbody {\n    font-family:\
  \ Verdana, Arial, Helvetica, sans-serif;\n    font-size: 12px;\n    margin: 10px;\n\
  }\nlabel { font-weight: bold; }\n.error { color: #F00; }\n</style>\n```\n\n只有 `error`\
  \ 类在功能方面是重要的。它将以红色文本格式化错误消息。\n\n**3.** 完成 head 并开始 body 和 PHP 部分：\n\n```html\n</head>\n\
  <body>\n<?php # Script 16.5 - datetime.php\n```\n\n**4.** 创建两个 `DateTime` 对象：\n\n\
  ```php\n$start = new DateTime();\n$end = new DateTime();\n```\n\n无论表单是否已提交，首先都会创建两个\
  \ `DateTime` 对象，它们都将使用当前日期和时间进行实例化。随后，一个或两个对象将被赋予新值。\n\n**5.** 给结束日期加一天：\n\n```php\n\
  $end->modify('+1 day');\n```\n\n默认情况下，当页面首次加载时，表单将预设今天为开始日期，明天为结束日期。要确定结束日期，只需修改对象的当前值，加上一天即可。\n\
  \n使用 `DateInterval` 对象和 `DateTime::add()` 方法，可以用如下方式做同样的事情：\n\n```php\n$day = new\
  \ DateInterval('P1D');\n$end->add($day);\n```\n\n**6.** 确定显示日期的默认格式：\n\n```php\n\
  $format = 'm/d/Y';\n```\n\n脚本将在四个地方显示格式化后的日期版本。将首选格式——`MM/DD/YYYY`——赋值给变量，使得日后若需更改会更容易。\n\
  \n**7.** 开始定义一个函数：\n\n```php\nfunction validate_date($date) {\n    $array = explode('/',\
  \ $date);\n```\n\n两个提交的日期都需要通过几种方式进行验证，每当脚本或应用程序中有重复代码时，定义一个函数来执行该代码可能是合理的。该函数接受一个日期字符串（而非\
  \ `DateTime` 对象）作为其唯一参数。该字符串将是用户提交的值，类似 `08/02/2011`。函数做的第一件事是使用 `explode()` 函数将字符串拆分为三个独立的部分——月、日、年。生成的数组赋值给\
  \ `$array` 变量。\n\n**8.** 如果数组不包含三个元素，返回 `false`：\n\n```php\nif (count($array) !=\
  \ 3) return false;\n```\n\n函数做的第一件事是确认它正好有三个离散的值可供使用，分别代表月、日、年。如果数组不包含三个元素，函数返回值\
  \ `false` 以指示日期无效。第 7 步中的 `explode()` 行和这一行会使任何不符合 `X/Y/Z` 模式的提交值无效（尽管那仍可能是 `cat/dog/zebra`）。\n\
  \n\n\n\n请注意，通常我建议在条件语句中始终使用花括号，但为了让代码尽可能简短，我省略了它们，并将整个结构保持在单行上。同时请记住，一旦函数执行了 `return`\
  \ 语句，函数就会立即退出。\n\n**9.** 如果提供的日期不是有效日期，则返回 `false`：\n\n```\nif (!checkdate($array[0],\
  \ $array[1], $array[2])) return false;\n```\n\n与步骤 8 类似，这段代码调用 PHP 的 `checkdate()`\
  \ 函数来确认提供的日期确实存在。如果日期不存在（例如 `13/43/2011`），函数再次返回 `false`。\n\n**10.** 返回日期数组并结束函数：\n\
  \n```\nreturn $array;\n} // End of validate_date() function.\n```\n\n如果提供的日期格式正确且对应一个存在的日期，该函数将返回日期元素数组。\n\
  \n**11.** 如果表单已提交，验证用户提交的值：\n\n```\nif (isset($_POST['start'], $_POST['end'])) {\n\
  \    if ((list($sm, $sd, $sy) = validate_date($_POST['start'])) && (list($em, $ed,\
  \ $ey) = validate_date($_POST['end']))) {\n```\n\n如果这两个变量已设置（意味着表单已提交），两者都会通过 `validate_date()`\
  \ 函数进行验证。如果该函数对任一日期返回 `FALSE`，此条件判断将为 `FALSE`。如果函数对两个日期均返回数组，并分别赋值给对应的月、日、年变量，则可以确定并显示结果。\n\
  \n**12.** 将日期重置为用户提交的日期：\n\n```\n$start->setDate($sy, $sm, $sd);\n$end->setDate($ey,\
  \ $em, $ed);\n```\n\n因为此时提供的日期均为有效，所以可以更新这两个对象以代表用户输入的日期。为此，调用 `setDate()` 方法并向其传入各个单独的值。\n\
  \n**13.** 如果结束日期在开始日期之后，计算它们之间的间隔：\n\n```\nif ($start < $end) {\n    $interval =\
  \ $start->diff($end);\n```\n\n正如你可以比较两个数字以查看哪个更大或更小一样，你也可以比较两个 `DateTime` 对象。如果结束日期确实较晚，则通过在一个对象上调用\
  \ `diff()` 方法并将另一个对象作为参数传入，来计算两个日期之间的差值。结果被赋值给 `$interval` 变量，它将是一个 `DateInterval`\
  \ 类型的对象。\n\n**14.** 打印结果：\n\n```\necho \"<p>The event has been planned starting\
  \ on {$start->format($format)} and ending on {$end->format($format)}, which is a\
  \ period of $interval->days day(s).</p>\";\n```\n\n最后，显示结果 ![Image](img/graycircle-c.jpg)。正如你所见，可以在引号内调用对象方法，从而打印该函数调用的输出，但必须将整个结构包裹在花括号中。引用属性（如\
  \ `$interval->days`）则不需要花括号。\n\n**15.** 完成步骤 11 和 13 开始的条件判断：\n\n```\n} else { //\
  \ End date must be later!\n    echo '<p class=\"error\">The starting date must precede\
  \ the ending date.</p>';\n}\n} else { // An invalid date!\n    echo '<p class=\"\
  error\">One or both of the submitted dates was invalid.</p>';\n}\n```\n\n第一个 `else`\
  \ 子句适用于两个日期都有效，但结束日期不在开始日期之后的情况 ![Image](img/circle-d.jpg)。第二个 `else` 子句适用于任一提交的日期未通过\
  \ `validate_date()` 测试的情况。在这种情况下，两个日期将保留默认设置 ![Image](img/circle-e.jpg)。\n\n![Image](img/16_figure_11_d.jpg)\n\
  \n![Image](img/circle-d.jpg) 如果提供的开始日期实际上晚于输入的结束日期，将显示此结果。\n\n![Image](img/16_figure_12_e.jpg)\n\
  \n![Image](img/circle-e.jpg) 如果任一提交的日期不对应有效日期，将显示此结果。\n\n**16.** 完成表单提交条件判断，关闭 PHP\
  \ 代码块，并开始 HTML 表单：\n\n```\n} // End of form submission.\n?>\n<h2>Set the Start and\
  \ End Dates for the Thing</h2>\n<form action=\"datetime.php\" method=\"post\">\n\
  ```\n\n**17.** 创建两个日期输入框：\n\n```\n<p><label for=\"start\">Start Date:</label> <input\
  \ type=\"text\" name=\"start\" value=\"<?php echo $start->format($format); ?>\"\
  \ /> (MM/DD/YYYY)</p>\n<p><label for=\"end\">End Date: </label> <input type=\"text\"\
  \ name=\"end\" value=\"<?php echo $end->format($format); ?>\" /> (MM/DD/YYYY)</p>\n\
  ```\n\n对于每个输入框，其值通过调用关联对象的 `format()` 方法进行预设。日期需要采用的格式也在括号中说明了。\n\n**18.** 完成表单和\
  \ HTML 页面：\n\n```\n<p><input type=\"submit\" value=\"Submit\" /></p>\n</form>\n\
  </body>\n</html>\n```\n\n**19.** 将脚本保存为 `datetime.php`，将其放入你的 Web 目录，并在 Web 浏览器中测试。\n\
  \n如果运行此脚本时，你看到关于依赖系统时区设置的异常，请在创建 `DateTime` 对象之前调用 `date_default_timezone_set()`，正如\
  \ 第 11 章 所解释的那样。\n\n***\n\n提示\n\n`DateTime::getTimestamp()` 方法返回所代表日期和时间的 Unix 时间戳。\n\
  \n***\n\n***\n\n提示\n\n在内部，`DateTime` 类将日期和时间表示为 64 位数字，这意味着它可以表示从大约 2920 亿年前到 2920\
  \ 亿年后的日期。\n\n***\n\n***\n\n提示\n\n`DateTime` 类中的若干常量代表常见的日期时间格式，例如 `DateTime::COOKIE`。\n\
  \n***\n\n***\n\n提示\n\n`DateTime` 方法也有对应的过程式版本。\n\n***\n\n### 复习与实践\n\n如果你对复习题或实践提示有任何疑问，请访问本书的支持论坛\
  \ ([www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/))。\n\n#### 复习\n\
