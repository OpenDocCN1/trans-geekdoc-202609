  ```\n\n---\n\n### 三元运算符\n\n本例使用了一个之前未介绍的运算符，称为*三元*运算符。其结构为：\n\n```text\n(condition)\
  \ ? valueT : valueF\n```\n\n括号中的条件将被求值；如果为 `TRUE`，则返回第一个值（`valueT`）。如果条件为 `FALSE`，则返回第二个值（`valueF`）。\n\
  \n因为三元运算符返回一个值，所以整个结构常用于给变量赋值或作为函数的参数。例如，代码行\n\n```php\necho (isset($var)) ? 'SET'\
  \ : 'NOT SET';\n```\n\n将根据变量 `$var` 的状态打印出 *SET* 或 *NOT SET*。\n\n在 `view_users.php`\
  \ 脚本的这个版本中，三元运算符用于在两个选项之间切换变量的值。然后该变量将用于决定表中每条记录的背景色。当然还有其他方法设置此值，但三元运算符是最简洁的。\n\
  \n---\n\n使用在第 8 章“高级 SQL 和 MySQL”中介绍的 `COUNT()` 函数，您可以轻松找出 *users* 表中的记录数（即待分页的记录数）。该查询将返回一行一列：记录数\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/10_figure_14_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ 在 mysql 客户端中运行计数查询的结果。\n\n**5.** 通过数学计算确定所需页数：\n\n```php\nif ($records > $display)\
  \ {\n    $pages = ceil ($records/$display);\n} else {\n    $pages = 1;\n}\n```\n\
  \n\n\n\n\n### 分页显示记录实现步骤\n\n#### 计算总页数\n\n显示所有记录所需的页数取决于要显示的记录总数和每页显示的记录数（赋值给变量\
  \ `$display`）。如果结果集中的记录数多于每页显示的记录数，则需要多个页面。要准确计算需要多少页，取两者相除后的下一个最高整数（`ceil()` 函数返回下一个最高整数）。例如，如果返回了\
  \ 25 条记录且每页显示 10 条，则需要 3 页（第一页显示 10 条，第二页显示 10 条，第三页显示 5 条）。如果 `$records` 不大于 `$display`，则只需要一页。\n\
  \n## 6. 完成页数计算的 `if-else` 语句\n\n```php\n} // End of p IF.\n```\n\n## 7. 确定数据库中的起始记录点\n\
  \n```php\nif (isset($_GET['s']) && is_numeric($_GET['s'])) {\n    $start = $_GET['s'];\n\
  } else {\n    $start = 0;\n}\n```\n\n脚本接收的第二个参数（在后续查看页面时）将是起始记录。这对应于 `LIMIT x, y`\
  \ 子句中的第一个数字。首次调用脚本时，应检索前十条记录（0 到 10），因为 `$display` 的值为 10。第二页将显示第 10 到 19 条记录；第三页显示第\
  \ 20 到 29 条记录，以此类推。\n\n首次访问此页面时，`$_GET['s']` 变量未设置，因此 `$start` 应为 0（`LIMIT` 子句中的第一条记录索引为\
  \ 0）。后续页面将从 URL 接收 `$_GET['s']` 变量，并将其赋值给 `$start`。\n\n## 8. 编写带有 `LIMIT` 子句的 `SELECT`\
  \ 查询\n\n```php\n$q = \"SELECT last_name, first_name, DATE_FORMAT(registration_date,\
  \ '%M %d, %Y') AS dr, user_id FROM users ORDER BY registration_date ASC LIMIT $start,\
  \ $display\";\n$r = @mysqli_query($dbc, $q);\n```\n\n`LIMIT` 子句规定从哪条记录开始检索（`$start`）以及从该点返回多少条记录（`$display`）。首次运行页面时，查询将是\
  \ `SELECT last_name, first_name ... LIMIT 0, 10`。点击下一页将导致查询变为 `SELECT last_name,\
  \ first_name ... LIMIT 10, 10`。\n\n## 9. 创建 HTML 表头\n\n```php\necho '<table align=\"\
  center\" cellspacing=\"0\" cellpadding=\"5\" width=\"75%\">\n<tr>\n    <td align=\"\
  left\"><b>Edit</b></td>\n    <td align=\"left\"><b>Delete</b></td>\n    <td align=\"\
  left\"><b>Last Name</b></td>\n    <td align=\"left\"><b>First Name</b></td>\n  \
  \  <td align=\"left\"><b>Date Registered</b></td>\n</tr>\n';\n```\n\n为简化脚本，此处假设有记录可显示。更规范的做法是，在创建表格之前，脚本应调用\
  \ `mysqli_num_rows()` 函数，并通过条件判断确认有记录返回。\n\n## 10. 初始化背景颜色变量\n\n```php\n$bg = '#eeeeee';\n\
  ```\n\n为使每行拥有自己的背景颜色，使用一个变量存储该颜色。初始时，`$bg` 变量被赋值为 `#eeeeee`（浅灰色）。该颜色将与白色（`#ffffff`）交替显示。\n\
  \n## 11. 开始 `while` 循环检索每条记录，并交换背景颜色\n\n```php\nwhile ($row = mysqli_fetch_array($r,\
  \ MYSQLI_ASSOC)) {\n    $bg = ($bg == '#eeeeee' ? '#ffffff' : '#eeeeee');\n```\n\
  \n表格中每行使用的背景颜色赋值给 `$bg` 变量。因为背景颜色应交替显示，这行代码将在循环的每次迭代中将相反的颜色赋值给 `$bg`。如果 `$bg` 等于\
  \ `#eeeeee`，则将其赋值为 `#ffffff`，反之亦然（关于三元运算符的语法和解释，请参阅侧边栏）。对于获取的第一行，`$bg` 最初等于 `#eeeeee`（见步骤\
  \ 10），因此将被赋值为 `#ffffff`，形成白色背景。\n\n对于第二行，`$bg` 不等于 `#eeeeee`，因此将被赋值为该值，形成灰色背景。\n\
  \n## 12. 在表格行中打印记录\n\n```php\necho '<tr bgcolor=\"' . $bg . '\">\n    <td align=\"\
  left\"><a href=\"edit_user.php?id=' . $row['user_id'] . '\">Edit</a></td>\n    <td\
  \ align=\"left\"><a href=\"delete_user.php?id=' . $row['user_id'] . '\">Delete</a></td>\n\
  \    <td align=\"left\">' . $row['last_name'] . '</td>\n    <td align=\"left\">'\
  \ . $row['first_name'] . '</td>\n    <td align=\"left\">' . $row['dr'] . '</td>\n\
  </tr>\n';\n```\n\n此代码与该脚本前一版本仅有一处不同：初始的 `TR` 标签现在包含 `bgcolor` 属性，其值为 `$bg` 变量（即\
  \ `#eeeeee` 和 `#ffffff` 交替）。\n\n## 13. 完成 `while` 循环和表格，释放查询结果资源，并关闭数据库连接\n\n```php\n\
  } // End of WHILE loop.\necho '</table>';\nmysqli_free_result($r);\nmysqli_close($dbc);\n\
  ```\n\n## 14. 开始显示其他页面链接的部分（如有必要）\n\n```php\nif ($pages > 1) {\n    echo '<br /><p>';\n\
  ```\n\n如果脚本需要多个页面来显示所有记录，则需要在页面底部添加适当的链接。\n\n## 15. 确定当前正在查看的页码\n\n```php\n$current_page\
  \ = ($start / $display) + 1;\n```\n\n要创建链接，脚本必须首先确定当前页码。这可以通过起始数除以显示数再加 1 来计算。例如，在第二次查看此页面时，`$start`\
  \ 将为 10（因为第一次实例中 `$start` 为 0），使 `$current_page` 值为 2：(10/10) + 1 = 2。\n\n## 16.\
  \ 创建指向上一页的链接（如有必要）\n\n```php\nif ($current_page != 1) {\n    echo '<a href=\"view_users.php?s='\
  \ . ($start - $display) . '&p=' . $pages . '\">Previous</a> ';\n}\n```\n\n如果当前页不是第一页，则应有一个指向较早结果集的\
  \ *Previous* 链接。这虽非严格必须，但很实用。\n\n每个链接将由脚本名称、起始点和页数组成。上一页的起始点将是当前起始点减去显示的数量。这些值必须在每个链接中传递，否则分页将失败。\n\
  \n## 17. 创建数字页码链接\n\n```php\nfor ($i = 1; $i <= $pages; $i++) {\n    if ($i != $current_page)\
  \ {\n        echo '<a href=\"view_users.php?s=' . (($display * ($i - 1))) . '&p='\
  \ . $pages . '\">' . $i . '</a> ';\n    } else {\n        echo $i . ' ';\n    }\n\
  }\n```\n\n大部分链接将通过从 1 循环到总页数来创建。除当前页外，每页都将被链接。对于每个链接，起始点值 `s` 将通过将每页显示的记录数乘以 `$i`\
  \ 减 1 来计算。例如，在第 3 页时，`$i - 1` 为 2，意味着 `s` 将为 20。\n\n## 18. 创建 *Next* 链接\n\n```php\n\
  if ($current_page != $pages) {\n    echo '<a href=\"view_users.php?s=' . ($start\
  \ + $display) . '&p=' . $pages . '\">Next</a>';\n}\n```\n\n最后，假设这不是最后一页，将显示一个 *Next*\
  \ 页链接。\n\n## 19. 完成页面\n\n```php\n    echo '</p>';\n} // End of links section.\n\
  include('includes/footer.html');\n?>\n```\n\n## 20. 保存文件\n\n将文件保存为 `view_users.php`，放置在您的\
  \ Web 目录中，并在 Web 浏览器中测试。\n\n---\n\n> **Tip**\n\n\n\n\n本示例对一个简单查询进行了分页，但如果你想对更复杂的查询（如搜索结果）进行分页，难度也不会增加太多。主要的区别在于，查询中使用的任何条件都必须通过链接从一页传递到下一页。如果从一次页面查看到下一次，主查询不是*完全相同*的，分页就会失败。\n\
  \n***\n\n提示\n\n如果你运行此示例，发现分页与本应返回的结果数量不匹配（例如，计数查询显示有 150 条记录，但分页只创建了 3 页，每页 10 条记录），这很可能是因为主查询和\
  \ `COUNT()` 查询差异太大。这两个查询永远不会完全相同，但它们必须执行相同的连接（如果适用），并且拥有相同的 `WHERE` 和/或 `GROUP BY`\
  \ 子句，才能保证准确性。\n\n***\n\n提示\n\n本脚本未包含错误处理，因为我知道这些查询按原样编写即可运行。如果你遇到问题，请记住你的 MySQL/SQL\
  \ 调试步骤：打印查询语句，使用 mysql 客户端或 phpMyAdmin 运行它以确认结果，并根据需要调用 `mysqli_error()` 函数。\n\n\
