  \ 创建 checkout.php 的步骤\n\n**1.** 在文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `checkout.php`（**脚本\
  \ 19.11**）：\n\n```php\n<?php # Script 19.11 - checkout.php\n\n$page_title = 'Order\
  \ Confirmation';\n\ninclude ('includes/header.html');\n```\n\n**2.** 创建两个临时变量：\n\
  \n```php\n$cid = 1;\n$total = 178.93;\n```\n\n为了将订单录入数据库，此页面需要两项额外信息：客户的识别号（即 `customers`\
  \ 表中的 `customer_id`）和订单总额。第一项值推测会在客户登录时确定（存储在会话中）。第二项值也可能存储在会话中（计入税费和运费后），或者由计费流程传递给此页面。但由于本章编写的脚本无法直接获取这两个值（已跳过相关步骤），我们创建这两个变量来模拟数据。\n\
  \n**3.** 包含数据库连接并关闭 MySQL 的自动提交模式：\n\n```php\nrequire ('../mysqli_connect.php');\n\
