  \ Web 目录中，并在 Web 浏览器中测试 ![Image](img/circle-e.jpg)。\n\n***\n\n**提示**\n\n预处理语句有两种。此处演示的是绑定参数，即将\
  \ PHP 变量绑定到查询。另一种是绑定结果，即将查询结果绑定到 PHP 变量。\n\n***\n\n![Image](img/13_figure_25_e.jpg)\n\
  \n![Image](img/circle-e.jpg)在 `messages` 表中选择最近的条目可确认预处理语句（脚本 13.6）已生效。请注意，帖子中的\
  \ HTML 标签被剥离了，但引号仍然保留。\n\n***\n\n**防止暴力攻击**\n\n\n\n\n暴力破解攻击是一种通过大量尝试来登录安全系统的攻击方式，企图最终获得成功。这种攻击并不复杂，因此得名“暴力破解”。例如，如果登录过程需要用户名和密码，可能的用户名/密码组合数量是有限的。这个限制可能达到数十亿或数万亿，但终究是有限的。利用算法和自动化流程，暴力破解攻击会反复尝试组合，直到成功为止。\n\
  \n防止暴力破解攻击成功的最佳方法是要求用户注册强密码：包含字母、数字和标点符号；大小写混合；非字典单词；至少八位长等。此外，不要提示登录失败的具体原因：提示“用户名和密码组合不正确”不会泄露任何信息，但提示“用户名不正确”或“该用户名的密码不正确”则透露了过多信息。\n\
  \n要阻止暴力破解攻击，还可以限制给定 IP 地址的错误登录尝试次数。IP 地址会频繁变更，但在暴力破解攻击中，同一 IP 地址会在几分钟内多次尝试登录。你需要按\
  \ IP 地址记录错误登录次数，在达到 `X` 次无效尝试后，封锁该 IP 地址 24 小时（或其他时长）。或者，如果不想采取如此严厉的措施，可以使用“延迟递增”防御策略：来自同一\
  \ IP 地址的每次错误登录都会增加响应延迟（使用 PHP 的 `sleep()` 函数创建延迟）。人类可能不会注意到或介意这种延迟，但自动化攻击肯定会受到影响。\n\
