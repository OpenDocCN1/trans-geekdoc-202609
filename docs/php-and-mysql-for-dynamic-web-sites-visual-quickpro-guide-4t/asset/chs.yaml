  \ `INSERT` 操作有效。\n- 如果您愿意，创建与 *banking* 数据库交互的脚本。简单的入门项目包括：查看所有客户、查看所有账户（执行 `JOIN`\
  \ 以同时显示客户姓名），以及增加或减少账户余额。\n\n## 10. 常见编程技术\n\n### 本章内容\n\n- 向脚本发送值 300\n- 使用隐藏表单输入\
  \ 304\n- 编辑现有记录 309\n- 查询结果分页 316\n- 制作可排序显示 323\n- 复习与实践 328\n\n现在您已经对 PHP 和 MySQL\
  \ 的交互有了一点了解，是时候更进一步了。本章类似于第 3 章 \"Creating Dynamic Web Sites\"，因为它涵盖了无数独立的主题。但所有这些主题的共同点在于，它们演示了常见的\
  \ PHP-MySQL 编程技术。您不会在这里学到任何新函数；相反，您将看到如何利用您已有的知识来创建标准的 Web 功能。\n\n\n\n\n这些示例本身将通过添加新的、流行的功能来扩展上一章开始的\
  \ Web 应用程序。您将看到几种管理数据库信息的技巧，特别是使用 PHP 编辑和删除记录。同时，将介绍几种向 PHP 页面传递数据的新方法。本章的最后几节将为\
  \ `view_users.php` 页面添加功能。\n\n### 向脚本发送值\n\n在迄今为止的示例中，PHP 脚本接收的所有数据都来自用户在表单中输入的内容。但是，您可以通过两种不同的方式将变量和值传递给\
  \ PHP 脚本，这两种方式都值得了解。\n\n第一种方法是利用 HTML 的 `hidden`（隐藏）输入类型：\n\n```html\n<input type=\"\
  hidden\" name=\"do\" value=\"this\" />\n```\n\n只要这段代码位于 `form` 标签之间的任何位置，变量 `$_POST['do']`\
  \ 在处理脚本中就会拥有值 `this`，前提是表单使用 POST 方法。如果表单使用 GET 方法，那么 `$_GET['do']` 将拥有该值。考虑到这一点，您实际上可以跳过创建表单的步骤，直接将一个\
  \ `name=value` 对追加到 URL 后面：\n\n```text\nwww.example.com/page.php?do=this\n```\n\n\
  同样，在这个特定示例中，`page.php` 接收到一个名为 `$_GET['do']` 的变量，其值为 `this`。\n\n为了演示这个 GET 方法技巧，将编写一个新版本的\
  \ `view_users.php` 脚本（该脚本最初是在上一章创建的）。这个新版本将提供链接到允许您编辑或删除现有用户记录的页面。这些链接将把用户的 ID 传递给处理页面，这两个处理页面也将在本章中编写。\n\
