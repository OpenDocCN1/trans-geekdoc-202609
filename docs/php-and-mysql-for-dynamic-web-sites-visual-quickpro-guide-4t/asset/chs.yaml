  \ *banking* 数据库创建删除和编辑脚本。您必须考虑到现有的外键约束，例如，限制删除仍拥有账户的客户。\n\n## 11. Web 应用程序开发\n\n\
  本章内容\n\n发送电子邮件 330\n\n处理文件上传 336\n\nPHP 和 JavaScript 348\n\n理解 HTTP 头部 355\n\n日期和时间函数\
  \ 362\n\n复习与实践 366\n\n前两章重点介绍了如何将 PHP 和 MySQL 结合使用（毕竟这是本书的主要目的）。但仍有大量以 PHP 为中心的材料需要涵盖。在暂时告别\
  \ PHP 与 MySQL 的结合使用后，本章介绍了一些常用于更复杂 Web 应用程序的技术。\n\n\n\n\n#### 发送电子邮件\n\nPHP 最让我喜欢的特性之一就是发送电子邮件非常简单。在一台配置正确的服务器上，这个过程就像使用\
  \ `mail()` 函数一样简单：\n\n```\nmail(to, subject, body, [headers]);\n```\n\n`to` 值应为一个电子邮件地址或一系列地址，多个地址之间用逗号分隔。以下格式均被允许：\n\
  \n- email@example.com\n- email1@example.com, email2@example.com\n- Actual Name <email@example.com>\n\
  - Actual Name <email@example.com>, This Name <email2@example.com>\n\n`subject` 值将构成邮件的主题行，`body`\
  \ 则是放置邮件正文内容的地方。为了提高可读性，通常会先给变量赋值，然后在 `mail()` 函数调用中使用这些变量：\n\n```\n$to = 'email@example.com';\n\
  $subject = 'This is the subject';\n$body = 'This is the body.\nIt goes over multiple\
  \ lines.';\nmail($to, $subject, $body);\n```\n\n正如给 `$body` 变量赋值时所见，你可以通过在引号内直接换行来创建跨多行的电子邮件消息。你也可以在双引号内使用换行符（`\\\
  n`）来实现这一点：\n\n```\n$body = \"This is the body.\\nIt goes over multiple lines.\"\
  ;\n```\n\n---\n\n#### PHP mail() 依赖项\n\nPHP 的 `mail()` 函数本身并不发送电子邮件。相反，它会指示运行在计算机上的邮件服务器来发送。这意味着运行\
  \ PHP 的计算机必须装有一个工作正常的邮件服务器，该函数才能生效。\n\n如果你运行的是 Unix 变体系统，或者你的网站托管在专业主机上，这应该不是问题。但如果你在自己的台式机或笔记本电脑上运行\
  \ PHP，很可能需要做一些调整。\n\n如果你运行的是 Windows，且你的互联网服务提供商（ISP）提供了 SMTP 服务器（如 `smtp.comcast.net`），可以在\
  \ `php.ini` 文件中设置此信息（请从 peachpit.com 下载附录 A“安装”，了解如何编辑此文件）。遗憾的是，仅当你的 ISP 使用 SMTP\
  \ 服务器不需要认证（用户名和密码组合）时，此方法才有效。否则，你需要在自己的计算机上安装一个 SMTP 服务器。这类软件有很多：只需在互联网上搜索 *free\
  \ windows smtp server* 即可看到一些选项。附录 A 推荐使用的 XAMPP 应用程序包含 Mercury 邮件服务器。\n\n如果你运行的是\
  \ Mac OS X，你需要启用内置的 SMTP 服务器（根据具体的 Mac OS X 版本，可能是 sendmail 或 postfix）。你可以在网上找到相关说明（搜索\
  \ *enable sendmail \"Mac OS X\"*）。如果你按附录 A 的建议使用 MAMP，请在网上搜索通过 MAMP 发送电子邮件的方法。\n\
  \n---\n\n这一切都非常简单，只有几个注意事项。首先，主题行不能包含换行符（`\\n`）。其次，正文的每一行长度不应超过 70 个字符（这更多是一个建议而非强制要求）。你可以使用\
  \ `wordwrap()` 函数来实现这一点。它会在字符串每 *X* 个字符处插入一个换行符。要将文本折行至 70 个字符，请使用：\n\n```\n$body\
  \ = wordwrap($body, 70);\n```\n\n`mail()` 函数接受第四个可选参数用于添加额外的头部信息。你可以在此设置 From、Reply-To、Cc、Bcc\
  \ 等。例如：\n\n```\nmail($to, $subject, $body, 'From: reader@example.com');\n```\n\n\
  若要在邮件中使用多个不同类型的头部，请用 `\\r\\n` 分隔每一个：\n\n```\n$headers = \"From: John@example.com\\\
  r\\n\";\n$headers .= \"Cc: Jane@example.com, Joe@example.com\\r\\n\";\nmail($to,\
  \ $subject, $body, $headers);\n```\n\n虽然第四个参数是可选的，但建议始终包含一个 From 值（尽管也可以在 PHP 的配置文件中设置）。\n\
  \n要使用 `mail()` 函数，让我们创建一个页面，显示一个联系表单，然后处理表单提交，验证数据并通过电子邮件发送出去。这个例子还将提供一个实用的小技巧，你有时会在带有粘性表单的页面上用到。\n\
  \n![Image](img/11_figure_01_a.jpg)\n\n*一个标准的联系表单。*\n\n运行此脚本前请注意两点：首先，要使本例生效，运行 PHP\
  \ 的计算机必须装有工作正常的邮件服务器。如果你使用的是托管网站，这应该不是问题；在自己的电脑上，你可能需要采取一些准备步骤（见侧边栏）。我必须提前说明，这些步骤对初学者来说可能令人望而生畏；对于这个特定脚本，使用托管网站可能是最简单且最令人满意的方式。\n\
  \n其次，虽然这个例子功能完善，但可能被恶意分子利用，通过你的联系表单发送垃圾邮件（不仅发给你，还发给任何人）。防止此类攻击的步骤将在第 13 章“安全方法”中介绍。跟着学习和测试这个例子完全没问题；但将其作为长期的联系表单解决方案则是个坏主意。\n\
