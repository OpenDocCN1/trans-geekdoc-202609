  \n---\n\n#### 使用预处理语句\n\n**1.** 在文本编辑器或 IDE 中新建一个名为 `post_message.php` 的 PHP 脚本（脚本\
  \ 13.6）：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\n<head>\n\n  <meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\n  <title>发布消息</title>\n\
  \n</head>\n\n<body>\n\n<?php # 脚本 13.6 - post_message.php\n```\n\n**2.** 检查表单提交并连接到\
  \ `forum` 数据库：\n\n```\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\n  $dbc = mysqli_connect\
  \ ('localhost', 'username', 'password', 'forum');\n```\n\n请注意，为求简洁，我省略了基本的数据验证和错误报告。虽然真实网站（该脚本的一个更完善版本见第\
  \ 17 章“示例——留言板”）会检查消息主题和正文是否为空，以及各 ID 值是否为正整数，但得益于预处理语句提供的安全性，该脚本仍然相对安全。\n\n本例将使用第\
  \ 6 章创建的 `forum` 数据库。\n\n**3.** 定义并准备查询：\n\n```\n$q = 'INSERT INTO messages (forum_id,\
  \ parent_id, user_id, subject, body, date_entered) VALUES (?, ?, ?, ?, ?, NOW( ))';\n\
  \n$stmt = mysqli_prepare($dbc, $q);\n```\n\n\n\n\n此语法已在前文解释过。查询已定义，使用占位符代表稍后将赋值的值。然后\
  \ `mysqli_prepare()` 函数将其发送给 MySQL，并将结果赋值给 `$stmt`。\n\n该查询本身首次用于 第 6 章。它填充 `messages`\
  \ 表中的六个字段。`date_entered` 列的值将是 `NOW()` 函数的结果，而非绑定值。\n\n**4.** 绑定相应的变量并创建要插入的值列表：\n\
  \n```\nmysqli_stmt_bind_param($stmt, 'iiiss', $forum_id, $parent_id, $user_id, $subject,\
  \ $body);\n\n$forum_id = (int)$_POST['forum_id'];\n\n$parent_id = (int)$_POST['parent_id'];\n\
  \n$user_id = 3;\n\n$subject = strip_tags($_POST['subject']);\n\n$body = strip_tags($_POST['body']);\n\
  ```\n\n第一行表明预处理语句中将使用三个整数和两个字符串。这些值将在后续的变量中找到。\n\n对于这些变量，subject 和 body 的值直接来自表单\
  \ ![Image](img/circle-b.jpg)，并通过 `strip_tags()` 处理以移除任何潜在的危险代码。论坛 ID 和父 ID（指示该消息是否为对现有消息的回复）也来自表单。它们将被转型为整数（为增加安全性，转型后应确认它们为正数，或可使用\
  \ Filter 扩展）。\n\n![Image](img/13_figure_22_b.jpg)\n\n![Image](img/circle-b.jpg)简单的\
  \ HTML 表单。\n\n在实际脚本中，用户 ID 的值将来自会话，在用户登录时存储于其中。\n\n**5.** 执行查询：\n\n```\nmysqli_stmt_execute($stmt);\n\
  ```\n\n最后，执行预处理语句。\n\n**6.** 输出执行结果并结束循环：\n\n```\nif (mysqli_stmt_affected_rows($stmt)\
  \ == 1) {\n\n  echo '<p>您的消息已发布。</p>';\n\n} else {\n\n  echo '<p style=\"font-weight:\
  \ bold; color: #C00\">您的消息无法发布。</p>';\n\n  echo '<p>' . mysqli_stmt_error($stmt)\
  \ . '</p>';\n\n}\n```\n\n可使用 `mysqli_stmt_affected_rows()` 函数确认记录是否成功插入，其工作原理正如您所料（返回受影响的行数）。若成功，则打印一条简单消息\
  \ ![Image](img/circle-c.jpg)。若发生问题，`mysqli_stmt_error()` 函数将返回具体的 MySQL 错误消息。这仅用于您的调试目的，不应用于正式站点。话虽如此，PHP\
  \ 的错误消息往往比 `mysqli_stmt_error()` 返回的更有用 ![Image](img/circle-d.jpg)。\n\n![Image](img/13_figure_23_c.jpg)\n\
  \n![Image](img/circle-c.jpg)如果查询影响了数据库中的一条记录，将显示此结果。\n\n![Image](img/13_figure_24_d.jpg)\n\
