  \ 6. 数据库设计\n\n本章内容\n\n规范化 166\n\n创建索引 179\n\n使用不同的表类型 182\n\n语言与 MySQL 184\n\n时区与\
  \ MySQL 189\n\n外键约束 195\n\n复习与实践 202\n\n\n\n\n### 真实世界的数据库设计\n\n既然你已经对数据库、SQL 和\
  \ MySQL 有了基本的了解，本章将开始深化这些知识。正如标题所述，本章的重点是真实世界的数据库设计。正如 第 4 章 \"MySQL 简介\" 中所做的工作那样，此处的大部分需要纸笔配合，并认真思考你的应用程序将需要做什么。\n\
  \n本章首先全面介绍数据库*规范化*：这是设计过程的一种至关重要的方法。随后，本章将转向 MySQL 特有的设计相关概念：索引、表类型、语言支持、时间处理以及外键约束。\n\
  \n读完本章，你将了解正确数据库设计所涉及的步骤，理解如何充分利用 MySQL，并规划几个多表数据库。在下一章中，你将学习更高级的 SQL 和 MySQL，并将这些新数据库作为示例。\n\
  \n### 规范化\n\n每当你使用像 MySQL 这样的关系型数据库管理系统时，创建和使用数据库的第一步是确定数据库的结构（也称为数据库*模式*）。数据库设计，又称*数据建模*，对于信息的长期成功管理至关重要。通过一个称为*规范化*的过程，你可以仔细消除冗余和其他会破坏数据库完整性的问题。\n\
  \n你将在接下来的几页中学到的技术将有助于确保数据库的可行性、实用性和可靠性。主要讨论的示例——一个用户可以发帖的论坛——将在 第 17 章 \"示例——留言板\"\
  \ 中更明确地使用，但规范化的原则适用于你可能创建的任何数据库。（前两章中创建和使用的 *sitename* 示例*已经*过正确规范化，尽管当时从未讨论过规范化。）\n\
  \n规范化是由一位名为 E.F. Codd 的 IBM 研究人员在 20 世纪 70 年代初开发的（他还发明了关系型数据库）。关系型数据库仅仅是以特定方式组织的数据集合，Codd\
  \ 博士创建了一系列称为*范式*的规则来帮助定义这种组织。本章讨论前三个范式，这对于大多数数据库设计已经足够。\n\n在开始规范化数据库之前，你必须定义正在开发的应用程序的角色。无论这意味着你需要与客户深入讨论主题，还是自己摸索，了解信息将如何被访问决定了建模过程。因此，这个过程需要纸和笔，而不是\
  \ MySQL 软件本身（尽管数据库设计适用于任何关系型数据库，而不仅仅是 MySQL）。\n\n在本例中，我想创建一个留言板，用户可以发布消息，其他用户可以回复。我设想用户需要注册，然后使用电子邮件地址/密码组合登录，以便发布消息。我还预计可能会有针对不同主题的多个论坛。我在\
  \ **表 6.1** 中列出了一行示例数据。数据库本身将称为 *forum*。\n\n**表 6.1. 示例论坛数据**\n\n![Image](img/06tab01.jpg)\n\
  \n> **提示**\n>\n> 确定数据库中应存储哪些信息的最佳方法之一，是思考将向数据库提出什么问题，以及答案中将包含哪些数据。\n\n> **提示**\n\
  >\n> 始终倾向于存储*更多*你可能需要的信息。忽略不必要的数据很容易，但事后无法凭空制造从未存储过的数据。\n\n> **提示**\n>\n> 如果你纠结于细节，规范化可能很难学会。每个范式的定义都非常晦涩；即使用通俗易懂的语言表达，它们仍然可能令人困惑。我最好的建议是，在跟随学习时关注大局。一旦你完成了规范化过程并看到了最终结果，整个过程应该会变得足够清晰。\n\
  \n### 键\n\n正如 第 4 章 简要提到的，*键*是规范化数据库不可或缺的一部分。键分为两种类型：*主键*和*外键*。主键是一个必须遵守特定规则的唯一标识符。它们必须：\n\
  \n- 始终有一个值（不能为 `NULL`）\n- 拥有保持不变的值（永不改变）\n- 在表中为每条记录拥有唯一的值\n\n主键的一个很好的现实例子是美国的社会安全号码：每个人都有一个唯一的社会安全号码，且该号码永不改变。正如社会安全号码是用于识别人的一种人为构造一样，你经常会发现为每个表创建一个任意主键是最佳的设计实践。\n\
  \n第二种键是外键。外键是表 A 的主键在表 B 中的体现。如果你有一个 *cinema* 数据库，包含 *movies* 表和 *directors* 表，*directors*\
  \ 的主键将作为外键关联在 *movies* 表中。随着规范化过程的继续，你会更好地理解其工作原理。\n\n*forum* 数据库目前只是一个简单的表（表 6.1），但在开始规范化过程之前，至少要确定一个主键（外键将在后续步骤中出现）。\n\
  \n#### 分配主键\n\n**1.** 寻找符合主键三个测试标准的字段。\n\n在本例中（表 6.1），没有任何一列真正符合主键的所有标准。用户名和电子邮件地址对于每个论坛用户来说是唯一的，但对于数据库中的每条记录来说并不唯一（因为同一个用户可以发布多条消息）。相同的主题也可能被多次使用。消息正文对于每条消息可能是唯一的，但可能会改变（如果被编辑），这违反了主键的规则之一。\n\
  \n**2.** 如果不存在合乎逻辑的主键，则创建一个（**表 6.2**）。\n\n**表 6.2. 示例论坛数据**\n\n![Image](img/06tab02.jpg)\n\
  \n通常，你需要创建一个主键，因为没有现成的好方案。在本例中，制造了一个 *message ID*（消息 ID）。当你创建的主键没有其他含义或用途时，它被称为*代理*主键。\n\
  \n> **提示**\n>\n> 根据经验，我使用至少包含部分表名（例如 *message*）和单词 *id* 来命名主键。一些数据库开发人员还喜欢在名称中添加缩写\
  \ *pk*。一些开发人员只使用 *id*。\n\n> **提示**\n>\n> MySQL 每个表只允许有一个主键，尽管你可以基于多列创建主键（这意味着这些列的组合必须唯一且永不改变）。\n\
  \n> **提示**\n>\n> 理想情况下，你的主键应该始终是整数，这能带来更好的 MySQL 性能。\n\n### 关系\n\n数据库关系是指一个表中的数据如何与另一个表中的数据相关联。任意两个表之间有三种关系类型：*一对一*、*一对多*或*多对多*。（数据库中的两个表也可能没有关系。）\n\
  \n如果表 A 中的有且仅有一个项目适用于表 B 中的有且仅有一个项目，则该关系为一对一。例如，每个美国公民只有一个社会安全号码，每个社会安全号码也只适用于一个美国公民；没有公民能有两个社会安全号码，也没有社会安全号码能指向两个公民。\n\
  \n\n\n\n\n#### 关系类型\n\n### 一对多关系\n\n如果表 A 中的一项可以应用到表 B 中的多项，则该关系为一对多。*female* 和\
  \ *male* 这两个术语将适用于许多人，但每个人只能是其中之一（理论上）。一对多关系是规范化数据库中表之间最常见的关系。\n\n### 多对多关系\n\n\
  如果表 A 中的多项可以应用到表 B 中的多项，则该关系为多对多。一本书可以由多位作者编写，作者也可以编写多本书。虽然多对多关系在现实世界中很常见，但**你应该避免在设计中使用多对多关系**，因为它们会导致数据冗余和完整性问题。与其使用多对多关系，设计良好的数据库会使用*中介表*，将一个多对多关系分解为两个一对多关系。\n\
  \n![Image](img/circle-a.jpg)\n\n![Image](img/06_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 两个表之间的多对多关系，最好表示为这两个表与一个中介表所拥有的两个一对多关系。\n\n关系与键协同工作，即一个表中的键通常会关联到另一个表中的键，如前所述。\n\
  \n---\n\n> **Tip**\n>\n> 数据库建模使用特定约定来表示数据库结构，本章将通过一系列图像遵循这些约定。三种关系类型的符号如 ![Image](img/circle-b.jpg)\
  \ 所示。\n\n![Image](img/06_figure_02_b.jpg)\n\n![Image](img/circle-b.jpg) 这些符号或其变体常用于在数据库建模方案中表示关系。\n\
  \n---\n\n> **Tip**\n>\n> 数据库设计过程的结果是 *ERD*（实体-关系图）或 *ERM*（实体-关系模型）。这种数据库的图形化表示使用形状代表表和列，并使用\
  \ ![Image](img/graycircle-b.jpg) 中的符号来表示关系。\n\n---\n\n> **Tip**\n>\n> 有许多程序可帮助创建数据库模式，包括\
  \ MySQL Workbench ([`wb.mysql.com`](http://wb.mysql.com))。本章中的许多图像均来自 MySQL Workbench。\n\
  \n---\n\n> **Tip**\n>\n> RDBMS 中的“关系”一词实际上源于表，表在技术上称为*关系*。\n\n---\n\n### 第一范式 (1NF)\n\
  \n如前所述，规范化数据库是根据若干规则（称为*范式*）更改数据库结构的过程。数据库必须严格遵守每条规则，且必须按顺序遵循这些范式。\n\n数据库中的每个表必须具备以下两个特性，才符合第一范式\
  \ (1NF)：\n\n*   每列只能包含一个值（有时称为*原子性*或*不可分性*）。\n*   表中不能包含重复的相关数据组。\n\n包含一个人完整地址（街道、城市、州、邮编、国家）的单个字段的表**不**符合\
  \ 1NF，因为它在一列中包含多个值，违反了上述第一条特性。至于第二条，包含 *actor1*、*actor2*、*actor3* 等列的 *movies* 表不符合\
  \ 1NF，因为这些重复的列都列出了完全相同类型的信息。\n\n要开始规范化过程，请检查现有结构（表 6.2）的 1NF 合规性。任何非原子的列都应拆分为多列。如果表有重复的相似列，则应将它们转换为单独的独立表。\n\
  \n#### 使数据库符合 1NF\n\n**1. 识别包含多条信息的字段。**\n\n查看 表 6.2，有一个字段不符合 1NF：*actual name*。示例记录在该列中同时包含了名和姓。\n\
  \n*message date* 字段包含日、月、年及时间，但细分到该粒度之外实属不必要。而且正如上一章末尾所示，MySQL 使用 **`DATETIME`**\
  \ 类型即可很好地处理日期和时间。\n\n其他问题示例包括：表使用单列存储多个电话号码（手机、家庭、工作），或在单列中存储一个人的多个兴趣（烹饪、舞蹈、滑雪等）。\n\
  \n**2. 将步骤 1 中发现的字段拆分为不同的字段（表 6.3）。**\n\n**表 6.3. 论坛数据库，原子化**\n\n![Image](img/06tab03.jpg)\n\
  \n为修复当前示例中的此问题，请创建单独的 *first name* 和 *last name* 字段，每个字段仅包含一个值。\n\n**3. 将任何重复的列组转换为它们自己的表。**\n\
  \n*forum* 数据库目前没有此问题，为演示何种情况属于违规，请参考 **表 6.4**。重复列（多个演员字段）引入了两个问题。首先，以这种方式存储时，每部电影的演员数量将受到限制。即使添加\
  \ *actor 1* 到 *actor 100* 列，仍存在上限（一百）。其次，未达到最大演员数量的记录将在额外列中包含 **`NULL`** 值。通常应避免数据库模式中出现含\
  \ **`NULL`** 值的列。另一个问题是，actor 和 director 列不是原子的。\n\n**表 6.4. 电影表**\n\n![Image](img/06tab04.jpg)\n\
  \n要修复 *movies* 表中的问题，需创建第二个表（**表 6.5**）。该表为电影中的每位演员使用一行，解决了上段提到的问题。演员姓名也被拆分为原子值。另请注意，新表应添加主键列。每个表都有主键这一概念隐含在第一范式中。\n\
  \n**表 6.5. 电影-演员表**\n\n![Image](img/06tab05.jpg)\n\n**4. 复查步骤 2 和 3 中创建的所有新列和表是否通过\
  \ 1NF 测试。**\n\n---\n\n> **Tip**\n>\n> 理解 1NF 最简单的方法是：该规则对表进行*水平*分析：检查单行中的所有列，以保证具体性并避免相似数据的重复。\n\
  \n---\n\n> **Tip**\n>\n> 各种资源对范式的描述方式略有不同，可能使用更多技术术语。最重要的是规范化过程的精神和最终结果，而非规则的技术性措辞。\n\
  \n---\n\n### 第二范式 (2NF)\n\n要使数据库符合第二范式 (2NF)，数据库必须先符合 1NF（必须按顺序规范化）。然后，表中每个非键列（即非外键）必须依赖于主键。通常可以通过以下方式识别违反此规则的列：它具有在多行中相同的非键值。此类值应存储在其自己的表中，并通过键关联回原表。\n\
  \n回到 *cinema* 示例，*movies* 表（表 6.4）会将导演 Martin Scorsese 列出 20 多次。这违反了 2NF 规则，因为存储导演姓名的列不是键，也不依赖于主键（电影\
  \ ID）。解决方法是创建一个单独的 *directors* 表来存储导演信息并为每位导演分配主键。要将导演关联回电影，导演的主键也将作为外键存在于 *movies*\
  \ 表中。\n\n\n\n\n\n查看表 6.5（电影中的演员），电影名称和演员名称同样违反了 2NF 规则（它们不是键，也不依赖于表的主键）。最终，这种最小化形式的\
  \ *cinema* 数据库需要四张表 ![Image](img/circle-c.jpg)。每位导演的姓名、电影名称和演员姓名将仅存储一次，且表中的任何非键列都依赖于该表的主键。事实上，规范化可以总结为创建越来越多的表，直到消除潜在的冗余为止。\n\
  \n![Image](img/06_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg)为了使 *cinema* 数据库符合\
  \ 2NF（考虑到所表示的信息），需要四张表。导演通过 *director ID* 键在 *movies* 表中表示；电影通过 *movie ID* 键在 *movies-actors*\
  \ 表中表示；演员通过 *actor ID* 键在 *movies-actors* 表中表示。\n\n#### 使数据库符合 2NF\n\n**1.** 找出不依赖于表主键的任何非键列。\n\
  \n查看表 6.3，用户名、名、姓、电子邮件和论坛值均为非键（消息 ID 当前是唯一的键列），且没有任何一列依赖于消息 ID。相反，消息主题、正文和日期也是非键，但这些确实依赖于消息\
  \ ID。\n\n**2.** 相应地创建新表 ![Image](img/circle-d.jpg)。\n\n![Image](img/06_figure_04_d.jpg)\n\
  \n![Image](img/circle-d.jpg)为了使 *forum* 数据库符合 2NF，需要三张表。\n\n对论坛数据库最合乎逻辑的修改是创建三张表：*users*、*forums*\
  \ 和 *messages*。\n\n在数据库的可视化表示中，为每张表创建一个框，表名作为标题，其所有列（也称为*属性*）在下方列出。\n\n**3.** 分配或创建新的主键\
  \ ![Image](img/circle-e.jpg)。\n\n![Image](img/06_figure_05_e.jpg)\n\n![Image](img/circle-e.jpg)每张表都需要自己的主键。\n\
  \n使用本章前面描述的技术，确保每张新表都有一个主键。这里我向 *users* 表添加了 *user ID* 字段，向 *forums* 表添加了 *forum\
  \ ID* 字段。这些都是代理主键。因为 *users* 表中的 *username* 字段和 *forums* 表中的 *name* 字段必须对每条记录唯一且必须始终有值，所以你可以让它们充当各自表的主键。然而，这将意味着这些值永远不能更改（根据主键规则），并且数据库会稍慢一些，因为使用的是基于文本的键而不是数字键。\n\
  \n**4.** 创建必要的外键并指明关系 ![Image](img/circle-f.jpg)。\n\n![Image](img/06_figure_06_f.jpg)\n\
  \n![Image](img/circle-f.jpg)为了关联这三张表，向 *messages* 表添加了两个外键，每个键代表其他两张表中的一张。\n\n实现\
  \ 2NF 合规性的最后一步是引入外键以关联相关联的表。请记住，一张表中的主键通常会成为另一张表中的外键。\n\n在此示例中，*users* 表中的 *user\
  \ ID* 关联到 *messages* 表中的 *user ID* 列。因此，*users* 与 *messages* 存在一对多关系（因为每个用户可以发布多条消息，但每条消息只能由一位用户发布）。\n\
  \n此外，两个 *forum ID* 列相互关联，在 *messages* 和 *forums* 之间创建了一对多关系（每条消息只能属于一个论坛，但每个论坛可以包含多条消息）。\n\
  \n*users* 表和 *forums* 表之间没有直接关系。\n\n***\n\n提示\n\n测试 2NF 的另一种方法是查看表之间的关系。理想情况是创建一对一或一对多的情况。具有多对多关系的表可能需要重构。\n\
  \n***\n\n***\n\n提示\n\n回顾 ![Image](img/graycircle-c.jpg)，*movies-actors* 表是一张*中间表*，它将电影和演员之间的多对多关系转变为两个一对多关系。当一张表的所有列都是键时，通常可以判断它充当了中介。事实上，在该表中，主键可以是\
  \ *movie ID* 和 *actor ID* 的组合。\n\n***\n\n***\n\n提示\n\n一个正确规范化的数据库在同一张表中绝不应有重复行（即两行或多行，其每个非主键列的值都匹配）。\n\
  \n***\n\n***\n\n提示\n\n为了简化你对规范化过程的理解，请记住 1NF 是*水平*检查表，而 2NF 是*垂直*分析（在多行中寻找重复值）。\n\
  \n***\n\n### 第三范式\n\n如果数据库符合 2NF，且每个非键列相互独立，则该数据库符合第三范式 (3NF)。如果你正确遵循了至此的规范化过程，可能不存在\
  \ 3NF 问题。如果更改一列的值需要更改另一列的值，则表明存在 3NF 违规。在目前的 *forum* 示例中，不存在 3NF 问题，但我将解释一个假设场景，说明该规则在何种情况下发挥作用。\n\
  \n以一个关于书籍的数据库为例。应用前两个范式后，你可能会得到一张列出书籍的表、一张列出作者的表，以及一张作为书籍和作者之间中介表的第三张表，因为两者存在多对多关系。如果\
  \ *books* 表列出了出版社的名称和地址，该表将违反 3NF ![Image](img/circle-g.jpg)。出版社的地址与书籍无关，而是与出版社本身相关。换句话说，该版本的\
  \ *books* 表包含一列依赖于非键列（出版社名称）。\n\n![Image](img/06_figure_07_g.jpg)\n\n![Image](img/circle-g.jpg)按当前设计，该数据库无法通过\
  \ 3NF 测试。\n\n正如我所说，*forum* 示例目前没有问题，但我仍将概述 3NF 的步骤，展示如何修复刚才提到的书籍示例。\n\n#### 使数据库符合\
  \ 3NF\n\n**1.** 找出任何表中相互依赖的字段。\n\n如前所述，要寻找的是那些相互之间的依赖程度大于对整条记录依赖程度的列。在 *forum* 数据库中，这不是问题。仅看\
  \ *messages* 表，每个 *subject* 将特定于某个 *message ID*，每个 *body* 将特定于该 *message ID*，以此类推。\n\
  \n以书籍示例为例，有问题的字段是 *books* 表中与出版社相关的那些字段。\n\n**2.** 相应地创建新表。\n\n如果你在步骤 1 中发现了任何有问题的列，比如书籍示例中的\
  \ *address1*、*address2*、*city*、*state* 和 *zip*，你将创建一个单独的 *publishers* 表。（一旦考虑到国际出版社，地址会更复杂。）\n\
  \n**3.** 分配或创建新的主键。\n\n每张表都必须有主键，因此向新表添加 *publisher ID*。\n\n**4.** 创建关联任意关系所需的外键\
  \ ![Image](img/circle-h.jpg)。\n\n![Image](img/06_figure_08_h.jpg)\n\n![Image](img/circle-h.jpg)采用假设的\
  \ *books* 数据库的最小版本，创建一张新表来存储出版社信息。\n\n最后，向 *books* 表添加 *publisher ID*。这能有效地将每本书关联到其出版社。\n\
  \n***\n\n提示\n\n\n\n尽管数据库规范化有既定规则，但两个不同的人规范化同一个示例时，可能会采用略微不同的方式。数据库设计允许个人偏好和理解存在。重要的是数据库没有明显且清晰的\
  \ NF（范式）违规。任何 NF 违规日后都可能引发问题。\n\n---\n\n---\n\n### 打破规范化\n\n尽管确保数据库符合 3NF（第三范式）有助于保证其可靠性和可行性，但你不会对所处理的每个数据库都进行完全规范化。不过，在破坏正规方法之前，请理解这样做可能会产生毁灭性的长期后果。\n\
  \n打破规范化的两个主要原因是**便利性**和**性能**。较少的表比较多的表更易于操作和理解。此外，由于其更复杂的本质，规范化的数据库在更新、检索数据和修改方面很可能会更慢。简而言之，规范化是在数据完整性/可扩展性与简单性/速度之间的权衡。另一方面，有办法提升数据库性能，但很难补救因设计不当导致的数据损坏。\n\
  \n本章包含一个忽略规范化的示例：将消息的发布日期和时间存储在一个字段中。如前所述，因为 MySQL 处理日期非常出色，所以这种方法没有危险。另一个打破规范化的情况是：存储一个人的性别（以及其他信息）的表。如果仅存储为\
  \ M/F 或 Male/Female（而不是关联到 `genders` 表），将会有许多重复值。但在这种情况下这没问题，因为这些标签是稳定的值，不太可能随时间改变（即，不太可能发明出第三种选项，或将“Female”重命名，从而强制对表中一半的记录进行批量更新）。\n\
  \n实践和经验将教会你如何最好地为数据库建模，但请尽量倾向于遵循范式，特别是当你仍在掌握该概念时。\n\n---\n\n#### 审查设计\n\n在完成规范化流程后，最好再次审查设计。你需要确保数据库存储了你可能需要的所有数据。通常，得益于规范化而创建的新表意味着需要记录额外的信息。例如，虽然\
  \ `cinema` 数据库最初的重点是电影，但现在有了单独的 `actors` 和 `directors` 表，关于这些人的额外事实就可以反映在这些表中。\n\
  \n考虑到这一点，虽然可以向 `forum` 数据库添加许多额外的列（特别是关于用户方面），但还应向 `messages` 表添加一个字段。因为一条消息可能是对另一条消息的回复，所以需要某种方法来表示这种关系。一种解决方案是向\
  \ `messages` 表添加 `parent_id` 列 ![Image](img/circle-i.jpg)。如果一条消息是回复，其 `parent_id`\
  \ 值将是原始消息的 `message_id`（因此 `message_id` 充当了该表自身的外键）。如果一条消息的 `parent_id` 为 0，则它是一个新主题，而非回复\
  \ ![Image](img/circle-j.jpg)。\n\n![Image](img/06_figure_09_i.jpg)\n\n![Image](img/circle-i.jpg)为了体现消息层级，向\
  \ `messages` 表添加了 `parent_id` 列。\n\n![Image](img/06_figure_10_j.jpg)\n\n![Image](img/circle-j.jpg)`parent_id`\
  \ 字段如何用于追踪消息主题。\n\n对表进行任何更改后，必须再次遍历各范式，以确保数据库仍然是规范化的。最后，按照第 4 章中的步骤选择列类型和名称 ![Image](img/circle-k.jpg)。注意，每个整数列均为\
  \ `UNSIGNED`，三个主键列也被指定为 `AUTO_INCREMENT`，且每个列均设置为 `NOT NULL`。\n\n![Image](img/06_figure_11_k.jpg)\n\
  \n![Image](img/circle-k.jpg)`forums` 数据库的最终 ERD 图。\n\n一旦模式完全开发完成，就可以使用第 5 章“SQL\
  \ 简介”中所示的命令在 MySQL 中创建它。你将在本章稍后进行此操作，在学习更多内容之后。\n\n---\n\n> **提示**\n>\n> 当你有一个主键-外键关联时（如\
  \ `forums` 中的 `forum_id` 关联到 `messages` 中的 `forum_id`），两个列应具有相同的类型（在本例中为 `TINYINT\
  \ UNSIGNED NOT NULL`）。\n\n---\n\n#### 创建索引\n\n*索引* 是数据库用来提高 `SELECT` 查询性能的一种特殊机制。索引可以放置在一个或多个任意数据类型的列上，实际上是告诉\
  \ MySQL 要特别关注这些值。\n\n虽然表可拥有的最大索引数量会有所不同，但 MySQL 始终保证你可以为每个表创建至少 16 个索引，且每个索引最多可包含\
  \ 15 个列。虽然多列索引的必要性可能不明显，但对于频繁在相同列组合上执行的搜索（例如名和姓、城市和州等）非常有用。\n\n虽然索引是任何表不可或缺的一部分，但并非所有东西都需要索引。虽然索引确实提高了从数据库读取的速度，但会减慢修改数据库中数据的查询速度（因为更改需要记录在索引中）。\n\
  \n最适合使用索引的列包括：\n\n- 经常用在查询的 `WHERE` 部分\n- 经常用在查询的 `ORDER BY` 部分\n- 经常作为 `JOIN` 焦点的列（连接将在下一章讨论）\n\
  \n一般来说，你**不应**为以下列创建索引：\n\n- 允许 `NULL` 值\n- 值的范围非常有限（如仅 Y/N 或 1/0）\n\nMySQL 有四种索引类型：`INDEX`（标准）、`UNIQUE`（要求该列每行具有唯一值）、`FULLTEXT`（用于执行\
  \ `FULLTEXT` 搜索，也将在第 7 章“高级 SQL 和 MySQL”中讨论）和 `PRIMARY KEY`（这是一种特殊的 `UNIQUE` 索引，你已经在使用）。注意，一个列上只能有一个索引，所以要选择最合适的索引类型。\n\
  \n考虑到这一点，让我们继续设计 `forum` 数据库，确定合适的索引。本章稍后将在数据库中创建表时定义这些索引。要在创建表时建立索引，需向 `CREATE\
  \ TABLE` 命令添加此子句：\n\n```\nINDEX_TYPE index_name (columns)\n```\n\n索引名是可选的。如果未提供名称，索引将采用其应用的列（或列）的名称。为多列创建索引时，用逗号分隔，并按重要性从高到低排序：\n\
  \n```\nINDEX full_name (last_name, first_name)\n```\n\n你已经在第 5 章中看过创建索引的语法。此命令创建一个在\
  \ `user_id` 字段上带有 `PRIMARY KEY` 索引的表：\n\n```\nCREATE TABLE users (\n\nuser_id MEDIUMINT\
  \ UNSIGNED NOT NULL AUTO_INCREMENT,\n\nfirst_name VARCHAR(20) NOT NULL,\n\nlast_name\
  \ VARCHAR(40) NOT NULL,\n\nemail VARCHAR(40) NOT NULL,\n\npass CHAR(40) NOT NULL,\n\
  \nregistration_date DATETIME NOT NULL,\n\nPRIMARY KEY (user_id)\n\n);\n```\n\n关于索引最后要了解的是多列索引的含义。如果你按顺序在\
  \ `col1`、`col2` 和 `col3` 上添加索引，这实际上为 `col1`、`col1` 和 `col2` 的组合、或所有三列的组合创建了索引。它**不**为单独引用\
  \ `col2` 或 `col3` 或这两列的组合提供索引。\n\n#### 创建索引\n\n**1.** 在所有主键上添加 `PRIMARY KEY` 索引。\n\
  \n\n\n\n\n每个表都应始终拥有一个主键，因此也应拥有一个 `PRIMARY KEY` 索引。对于 *forums* 数据库，要作为主键建立索引的具体列有：`forums.forum_id`、`messages.message_id`\
  \ 和 `users.user_id`。（语法 `table_name.column_name` 是引用特定表中特定列的一种方式。）\n\n## 2. 为表中值不能重复的列添加\
  \ `UNIQUE` 索引。\n\n*forums* 数据库有三列必须始终保持唯一，否则会出现问题：`forums.name`、`users.username`\
  \ 和 `users.email`。\n\n## 3. 如果合适，添加 `FULLTEXT` 索引。\n\n`FULLTEXT` 索引和 `FULLTEXT`\
  \ 搜索将在下一章讨论，因此我在此不再赘述，但正如你将发现的，本数据库中有一个 `FULLTEXT` 索引可供使用。\n\n## 4. 为经常在 `WHERE`\
  \ 子句中使用的列添加标准索引。\n\n要预先知道哪些列会经常用在 `WHERE` 子句中（因此应该建立索引），需要一些经验。对于 *forums* 数据库，有一个常见的\
  \ `WHERE` 子句非常突出：当用户登录时，他们会提供电子邮件地址和密码。确认用户提供的信息是否正确的查询语句类似于：\n\n```\nSELECT * FROM\
  \ users WHERE pass=SHA1('provided_password') AND email='provided_email_address'\n\
  ```\n\n由此查询可推断，为电子邮件地址和密码的组合建立索引将是有益的。\n\n## 5. 为经常在 `ORDER BY` 子句中使用的列添加标准索引。\n\
  \n同样，在设计数据库的过程中，这类列终将显现出来。在 *forums* 示例中，还剩下一列会用在 `ORDER BY` 子句中且尚未建立索引：`messages.date_entered`。该列将经常用在\
  \ `ORDER BY` 子句中，因为网站默认会按消息录入的顺序显示所有消息。\n\n## 6. 为经常在 `JOIN` 中使用的列添加标准索引。\n\n你可能还不知道什么是\
  \ `JOIN`，该主题将在第 7 章中详细介绍，但最明显的候选列是外键列。请记住，表 B 中的外键关联到表 A 中的主键。从数据库中选择数据时，`JOIN`\
  \ 将基于此关系编写。为了使该 `JOIN` 高效，外键必须建立索引（主键已经建立了索引）。在 *forums* 示例中，*messages* 表中的三个外键字段应建立索引：`forum_id`、`parent_id`\
  \ 和 `user_id`。\n\n**表 6.6** 列出了通过这些步骤确定的所有索引。\n\n**表 6.6. forum 数据库索引**\n\n![Image](img/06tab06.jpg)\n\
  \n---\n\n**提示**\n\n索引可以在表已有数据后创建。但是，如果你尝试向包含重复值的列添加 `UNIQUE` 索引，将会报错且索引不会被创建。\n\n\
  ---\n\n**提示**\n\nMySQL 使用术语 `KEY` 作为 `INDEX` 的同义词：\n\n```\nKEY full_name (last_name,\
  \ first_name)\n```\n\n---\n\n**提示**\n\n你可以将索引长度限制为一定数量的字符，例如前 10 个：\n\n```\nINDEX\
  \ index_name (column_name(10))\n```\n\n在 `ORDER BY` 子句中前 X 个字符已足够有用的情况下，你可能会这样做。\n\
  \n---\n\n### 使用不同的表类型\n\nMySQL 有一项在其他数据库应用中不常见的功能，即能够使用不同类型的表（表的类型也称为其*存储引擎*）。每种表类型支持不同的功能，有其自身的限制（就能存储多少数据而言），甚至在特定情况下性能优劣不同。尽管如此，你与任何表类型交互的方式——就运行查询而言——在所有类型中都是一致的。\n\
  \n历史上，最重要的表类型是 *MyISAM*。直到 MySQL 5.5.5 版本，MyISAM 都是所有操作系统上的默认表类型（在 Windows 上，更改默认类型的版本更早）。MyISAM\
  \ 表适用于大多数应用，能非常快速地处理 `SELECT` 和 `INSERT`。不过，MyISAM 存储引擎无法处理*事务*，这是其主要缺点（事务将在下一章介绍）。由于缺乏该功能及行级*锁定*（必须锁定整个表），一旦发生崩溃，MyISAM\
  \ 表更容易遭受损坏和数据丢失。\n\n自 MySQL 5.5.5 版本起，MySQL 在所有操作系统上的新默认存储引擎是 *InnoDB*。InnoDB 表可用于事务，且能很好地处理\
  \ `UPDATE`。InnoDB 表还支持*外键约束*（本章末尾讨论）和行级锁定。但 InnoDB 存储引擎通常比 MyISAM 慢，且在服务器上需要更多磁盘空间。此外，InnoDB\
  \ 表不支持 `FULLTEXT` 索引（见第 7 章）。\n\n要在定义表时指定存储引擎，请在创建语句末尾添加一个子句：\n\n```\nCREATE TABLE\
  \ tablename (\n\ncolumn1name COLUMNTYPE,\n\ncolumn2name COLUMNTYPE...\n\n) ENGINE\
  \ = type\n```\n\n如果创建表时未指定存储引擎，MySQL 将使用该 MySQL 服务器的默认类型。\n\nMySQL 的这一功能更为重要，因为你可以在同一个数据库中混合使用不同的表类型。这样你就可以为每个表定制最佳功能和性能。继续设计\
  \ *forums* 数据库，下一步是确定每个表要使用的存储引擎。\n\n#### 确定表的类型\n\n**1.** 查找你的 MySQL 服务器可用的表类型\
  \ ![Image](img/circle-a.jpg)：\n\n```\nSHOW ENGINES;\n```\n\n![Image](img/06_figure_12_a.jpg)\n\
  \n![Image](img/circle-a.jpg)要确认你的 MySQL 安装支持哪些表类型，请运行此命令（在 mysql 客户端中，或 phpMyAdmin\
  \ 中）。\n\n执行 `SHOW ENGINES` 命令将不仅显示可用的存储引擎，还会显示默认存储引擎。在为数据库选择表类型时，了解此信息会有所帮助。\n\n\
  **2.** 如果你的任何表需要 `FULLTEXT` 索引，将其设为 MyISAM 表。\n\n同样，`FULLTEXT` 索引和搜索将在下一章讨论，但我现在要说明的是，*forums*\
  \ 示例中的 *messages* 表将需要一个 `FULLTEXT` 索引。因此，该表必须是 MyISAM。\n\n**3.** 如果你的任何表需要事务支持，将其设为\
  \ InnoDB 表。\n\n是的，同样，事务将在下一章讨论，但存储引擎现在就应确定。*forums* 数据库中的 *forums* 表和 *users* 表都不需要事务支持。\n\
  \n**4.** 如果上述情况都不适用于某个表，则使用默认存储引擎。\n\n**表 6.7** 标明了 *forums* 数据库中各表将使用的存储引擎。\n\n\
  **表 6.7. forum 数据库表类型**\n\n![Image](img/06tab07.jpg)\n\n---\n\n**提示**\n\nMySQL 还有其他几种表类型，但\
  \ MyISAM 和 InnoDB 迄今为止是最重要的两种。MEMORY 类型在内存中创建表，使其成为速度极快的表，但完全没有持久性。\n\n---\n\n**提示**\n\
  \n在撰写本文时，MySQL 文档声称 InnoDB 表类型总体上比 MyISAM 更快。表类型涉及一些政治因素，所以我对这一说法持保留态度。\n\n---\n\
  \n### 语言与 MySQL\n\n\n\n\n### 第 1 章\n\n第 1 章“PHP 简介”简要介绍了*编码*的概念。HTML 页面或 PHP 脚本可以指定其编码，这决定了支持哪些字符，进而决定了支持哪些语言。MySQL\
  \ 数据库也是如此：通过设置数据库的编码，你可以影响其中可存储的字符。要查看你的 MySQL 版本支持的编码列表，请运行 `SHOW CHARACTER SET`\
  \ 命令。请注意，MySQL 中使用*字符集*一词来表示*编码*（本节我通常也将遵循此用法，以与 MySQL 保持一致）。\n\n![Image](img/06_figure_13_a.jpg)\n\
  \n该 MySQL 安装支持的字符集列表。\n\nMySQL 中的每个字符集都有一个或多个*校对规则*。校对规则是指用于比较字符集中字符的规则。它类似于按字母顺序排序，但也会考虑数字、空格和其他字符。校对规则与所用的字符集相关联，反映了该语言中存在的字符种类以及通常使用该语言人群的文化习惯。例如，英文的文本排序方式与繁体西班牙文或阿拉伯文不同。其他考量因素包括：字符的大小写形式被视为相同还是不同（即是否为区分大小写的比较）？又或者，带重音字符如何排序？空格是被计算在内还是被忽略？\n\
  \n要查看 MySQL 可用的校对规则，请运行此查询，将 *charset* 替换为上一条查询结果中的相应值：\n\n```\nSHOW COLLATION LIKE\
  \ 'charset%'\n```\n\n![Image](img/06_figure_14_b.jpg)\n\nUTF-8 字符集中可用的校对规则列表。第一个\
  \ `utf8_general_ci` 是默认值。\n\n该查询的结果还将指明该字符集的默认校对规则。校对规则的名称以 *ci* 结尾表示不区分大小写，*cs*\
  \ 表示区分大小写，*bin* 表示二进制。\n\n总体而言，我建议使用 UTF-8 字符集及其默认校对规则。更重要的是，*数据库使用的字符集应与你的 PHP\
  \ 脚本保持一致*。如果你的 PHP 脚本未使用 UTF-8，请在数据库中使用匹配的编码。如果默认校对规则不符合主要使用语言的习惯，则相应地调整校对规则。\n\n\
  在 MySQL 中，整个服务器、每个数据库、每个表，甚至每个字符串列都可以定义字符集和校对规则。创建数据库时设置这些值，请使用：\n\n```\nCREATE\
  \ DATABASE name CHARACTER SET charset COLLATE collation\n```\n\n创建表时设置这些值，请使用：\n\
  \n```\nCREATE TABLE name (\n  column definitions\n) CHARACTER SET charset COLLATE\
  \ collation\n```\n\n要为列建立字符集和校对规则，请在列定义中添加相应的子句（你仅会对文本类型使用此项）：\n\n```\nCREATE TABLE\
  \ name (\n  something TEXT CHARACTER SET charset COLLATE collation\n  ...\n)\n```\n\
  \n在上述每种情况下，这两个子句都是可选的。如果省略，将使用默认的字符集或校对规则。\n\n在定义数据库时建立字符集和校对规则，会影响可存储的数据（例如，如果列的编码不支持某字符，则无法在该列中存储该字符）。第二个问题是与\
  \ MySQL 通信时使用的编码。如果你想在具有中文编码的表中存储中文字符，这些字符需要使用相同的编码进行传输。要在 mysql 客户端中执行此操作，只需使用以下命令设置编码：\n\
  \n```\nCHARSET charset\n```\n\n对于 phpMyAdmin，要使用的编码是在应用程序本身中建立的（即写在配置文件中）。\n\n此时，*forums*（论坛）示例的数据库设计各个方面均已涵盖，因此让我们在\
  \ MySQL 中创建该数据库，包括其索引、存储引擎、字符集和校对规则。\n\n### 分配字符集和校对规则\n\n**1.** 使用你喜欢的任何客户端访问 MySQL。\n\
  \n与前一章一样，本章也将在所有示例中使用 mysql 客户端。你也可以使用 phpMyAdmin 或其他工具作为 MySQL 的界面。\n\n**2.** 创建\
  \ *forum* 数据库：\n\n```\nCREATE DATABASE forum\nCHARACTER SET utf8\nCOLLATE utf8_general_ci;\n\
  USE forum;\n```\n\n![Image](img/06_figure_15_c.jpg)\n\n第一步是创建并选择数据库。\n\n视你的设置而定，你可能不被允许创建自己的数据库。如果不允许，只需使用提供给你的数据库，并将以下表添加到其中。请注意，在\
  \ `CREATE DATABASE` 命令中，字符集和校对规则也已定义。在此处这样做，之后的每个表都将使用这些设置。\n\n**3.** 创建 *forums*\
  \ 表：\n\n```\nCREATE TABLE forums (\n  forum_id TINYINT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \  name VARCHAR(60) NOT NULL,\n  PRIMARY KEY (forum_id),\n  UNIQUE (name)\n) ENGINE\
  \ = INNODB;\n```\n\n![Image](img/06_figure_16_d.jpg)\n\n创建第一个表。\n\n创建表的顺序无关紧要，但我将首先创建\
  \ *forums* 表。请记住，为方便起见，你可以在多行中输入 SQL 查询。\n\n该表仅包含两列（这在规范化数据库中经常发生）。因为我不预期会有很多论坛，所以主键使用了非常小的类型（`TINYINT`）。如果你想添加每个论坛的描述，可以向该表添加\
  \ `VARCHAR(255)` 或 `TINYTEXT` 列。此表使用 InnoDB 存储引擎。\n\n**4.** 创建 *messages* 表：\n\n\
  ```\nCREATE TABLE messages (\n  message_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \  parent_id INT UNSIGNED NOT NULL DEFAULT 0,\n  forum_id TINYINT UNSIGNED NOT NULL,\n\
  \  user_id MEDIUMINT UNSIGNED NOT NULL,\n  subject VARCHAR(100) NOT NULL,\n  body\
  \ LONGTEXT NOT NULL,\n  date_entered DATETIME NOT NULL,\n  PRIMARY KEY (message_id),\n\
  \  INDEX (parent_id),\n  INDEX (forum_id),\n  INDEX (user_id),\n  INDEX (date_entered)\n\
  ) ENGINE = MYISAM;\n```\n\n![Image](img/06_figure_17_e.jpg)\n\n创建第二个表。\n\n该表的主键必须足够大，因为它可能包含大量记录。三个外键列——`forum_id`、`parent_id`\
  \ 和 `user_id`——的大小和类型均与其对应的主键相同。主题限制为 100 字符，每条消息的正文可以包含大量文本。`date_entered` 字段为\
  \ `DATETIME` 类型。\n\n与其他两个表不同，此表为 MyISAM 类型。\n\n**5.** 创建 *users* 表：\n\n```\nCREATE\
  \ TABLE users (\n  user_id MEDIUMINT UNSIGNED NOT\n  NULL AUTO_INCREMENT,\n  username\
  \ VARCHAR(30) NOT NULL,\n  pass CHAR(40) NOT NULL,\n  first_name VARCHAR(20) NOT\
  \ NULL,\n  last_name VARCHAR(40) NOT NULL,\n  email VARCHAR(60) NOT NULL,\n  PRIMARY\
  \ KEY (user_id),\n  UNIQUE (username),\n  UNIQUE (email),\n  INDEX login (pass,\
  \ email)\n) ENGINE = INNODB;\n```\n\n![Image](img/06_figure_18_f.jpg)\n\n数据库的第三个也是最后一个表。\n\
  \n此处的大多数列模仿前两章中创建的 *sitename* 数据库 *users* 表中的列。`pass` 列定义为 `CHAR(40)`，因为将使用 `SHA1()`\
  \ 函数，它总是返回一个 40 字符长的字符串（参见第 5 章）。\n\n此表使用 InnoDB 引擎。\n\n**6.** 如果需要，确认数据库结构：\n\n\
  ```\nSHOW TABLES;\nSHOW COLUMNS FROM forums;\n```\n\n\n\n\n### 时区与 MySQL\n\n第 5\
  \ 章 讨论了如何使用 `NOW()` 和其他与日期、时间相关的函数。该章解释了这些函数反映的是服务器上的时间。因此，使用这些函数存储在数据库中的值也是在存储服务器的时间。这听起来可能不是个问题，但假设你将网站从一台服务器迁移到另一台：你导出所有数据，导入到另一台服务器，一切似乎都很正常……除非这两台服务器位于不同的时区，在这种情况下，所有的日期在技术上都会变得不准确。对于某些网站，这种变化可能无关紧要，但如果你的网站提供付费会员服务呢？这意味着某些人的会员资格可能会提前几小时过期，而另一些人的则会晚几小时过期！归根结底，数据库的目标是可靠地存储信息。\n\
  \n解决这一特定问题的方法是以时区中立的方式存储日期和时间。要做到这一点，需要用到所谓的 UTC（*协调世界时*，是的，其缩写与术语并不完全匹配）。UTC 与格林威治标准时间\
  \ (GMT) 一样，提供了一个通用的原点，世界上所有的时间都可以表示为 UTC 加上或减去若干小时和分钟（**表 6.8**）。\n\n**表 6.8. UTC\
  \ 偏移量**\n\n![Image](img/06tab08.jpg)\n\n幸运的是，你不必知道这些数值，也不必执行任何计算来确定服务器的 UTC。相反，`UTC_DATE()`\
  \ 函数返回 UTC 日期；`UTC_TIME()` 返回当前 UTC 时间；`UTC_TIMESTAMP()` 返回当前日期和时间。\n\n一旦你存储了 UTC\
  \ 时间，就可以检索经过调整以反映服务器或用户位置的时间。要将日期和时间从一个时区转换为另一个时区，请使用 `CONVERT_TZ()` ![Image](img/circle-a.jpg)：\n\
  \n```\nCONVERT_TZ(dt, from, to)\n```\n\n![Image](img/06_figure_20_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 将当前 UTC 日期和时间转换为美国东部夏令时间 (EDT)。\n\n第一个参数是日期和时间值，例如函数的结果或存储在列中的值。第二个和第三个参数是命名的时区。要使用此函数，时区列表必须已存储在\
  \ MySQL 中，你的安装可能满足也可能不满足此条件（请参阅侧栏）。如果你看到 `NULL` 结果 ![Image](img/circle-b.jpg)，请查阅\
  \ MySQL 手册，了解如何在服务器上安装时区。\n\n![Image](img/06_figure_21_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ 如果 `CONVERT_TZ()` 函数引用了无效的时区，或者时区未在 MySQL 中安装（此处即为这种情况），它将返回 `NULL`。\n\n要使用这些信息，让我们开始填充\
  \ *forums* 数据库，使用 UTC 记录消息发布的日期和时间。\n\n***\n\n#### 在 MySQL 中使用时区\n\nMySQL 不一定会默认安装时区支持。为了使用命名时区，*mysql*\
  \ 数据库中的五个表必须被填充数据。虽然 MySQL 可能不会自动为你完成此操作，但它提供了相关工具供你自行操作。\n\n此过程的复杂程度刚好使得本书没有足够的篇幅来讨论它（无法涵盖所有可能的情况、操作系统等）。但你可以通过在\
  \ MySQL 手册中查找“服务器时区支持”来找到说明。\n\n如果你继续在 MySQL 中使用时区，还需要保持 *mysql* 数据库中的此信息处于最新状态。特别是关于何时以及如何实行夏令时的时区规则，变化频繁。同样，MySQL\
  \ 手册中也有更新时区的说明。\n\n***\n\n#### 使用 UTC\n\n**1.** 使用你喜欢的任何客户端访问 *forums* 数据库。\n\n\
  与前一章一样，本章也将在所有示例中使用 mysql 客户端。你也可以使用 phpMyAdmin 或其他工具作为 MySQL 的界面。\n\n**2.** 如有必要，将编码更改为\
  \ UTF-8 ![Image](img/circle-c.jpg)：\n\n```\nCHARSET utf8;\n```\n\n![Image](img/06_figure_22_c.jpg)\n\
  \n![Image](img/circle-c.jpg) 用于与 MySQL 通信的字符集应与数据库中使用的字符集匹配。\n\n由于数据库使用 UTF-8 作为其字符集，与数据库的通信应使用相同的字符集。上一行命令（在本章前一节中已解释）正是执行此操作。请注意，仅当使用\
  \ mysql 客户端时才需要执行此操作。此外，如果你未使用 UTF-8，请相应地更改命令。\n\n**3.** 向 *forums* 表添加一些新记录 ![Image](img/circle-d.jpg)：\n\
  \n```\nINSERT INTO forums (name) VALUES\n('MySQL'), ('PHP'), ('Sports'),\n('HTML'),\
  \ ('CSS'), ('Kindling');\n```\n\n![Image](img/06_figure_23_d.jpg)\n\n![Image](img/circle-d.jpg)\
  \ 向 *forums* 表添加记录。\n\n由于 *messages* 表依赖于从 *forums* 和 *users* 表检索的值，因此必须先填充这两个表。使用此\
  \ `INSERT` 命令，只需为 *name* 列提供值（表的 *forum_id* 列将由 MySQL 自动分配自增整数）。\n\n**4.** 向 *users*\
  \ 表添加一些记录 ![Image](img/circle-e.jpg)：\n\n```\nINSERT INTO users (username, pass,\n\
  first_name, last_name, email) VALUES\n('troutster', SHA1('mypass'),\n'Larry', 'Ullman',\
  \ 'lu@example.com'),\n('funny man', SHA1('monkey'),\n'David', 'Brent', 'db@example.com'),\n\
  ('Gareth', SHA1('asstmgr'), 'Gareth',\n'Keenan', 'gk@example.com');\n```\n\n![Image](img/06_figure_24_e.jpg)\n\
  \n![Image](img/circle-e.jpg) 向 *users* 表添加记录。\n\n如果你对此处的 `INSERT` 语法或 `SHA1()` 函数的用法有任何疑问，请参阅\
  \ 第 5 章。\n\n**5.** 向 *messages* 表添加新记录 ![Image](img/circle-f.jpg)：\n\n```\nSELECT\
  \ * FROM forums;\nSELECT user_id, username FROM users;\nINSERT INTO messages (parent_id,\
  \ forum_id, user_id, subject, body, date_entered) VALUES\n(0, 1, 1, 'Question about\
  \ normalization.', 'I''m confused about normalization. For the second normal form\
  \ (2NF), I read...', UTC_TIMESTAMP()),\n(0, 1, 2, 'Database Design', 'I''m creating\
  \ a new database and am having problems with the structure. How many tables should\
  \ I have?...', UTC_TIMESTAMP()),\n(2, 1, 2, 'Database Design', 'The number of tables\
  \ your database includes...', UTC_TIMESTAMP()),\n(0, 1, 3, 'Database Design', 'Okay,\
  \ thanks!', UTC_TIMESTAMP()),\n(0, 2, 3, 'PHP Errors', 'I''m using the scripts from\
  \ Chapter 3 and I can''t get the first calculator example to work. When I submit\
  \ the form...', UTC_TIMESTAMP());\n```\n\n![Image](img/06_figure_25_f.jpg)\n\n\n\
  \n\n![Image](img/circle-f.jpg)填充 `messages` 表需要了解来自 `users` 和 `forums` 表的外键值。\n\n\
  由于 `messages` 表中的两个字段（`forum_id` 和 `user_id`）关联到其他表中的值，因此在向该表插入新记录之前，你需要知道这些值。例如，当用户\
  \ `troutster` 在 `MySQL` 论坛创建一条新消息时，`INSERT` 语句将包含 `forum_id` 为 1 和 `user_id` 为 1。\n\
  \n`parent_id` 列使情况变得更加复杂，它应存储新消息所回复的那条消息的 `message_id`。添加到数据库的第二条消息将拥有 `message_id`\
  \ 为 2，因此对该消息的回复需要 `parent_id` 为 2。\n\n有了你的 PHP 脚本——一旦你为该数据库创建了界面，这个过程将容易得多，但首先理解\
  \ SQL 层面的理论很重要。\n\n对于 `date_entered` 字段，将使用 `UTC_TIMESTAMP()` 函数返回的值。使用 `UTC_TIMESTAMP()`\
  \ 函数，记录将存储 UTC 日期和时间，而非服务器上的日期和时间。\n\n**6.** 重复步骤 1 到 3 以填充数据库。\n\n本章和下一章的其余示例将使用已填充的数据库。你可能想从本书对应的网站下载\
  \ SQL 命令，尽管你也可以使用自己的示例填充表，然后只需相应地更改本章其余部分的查询即可。\n\n**7.** 使用存储的日期和时间查看 `messages`\
  \ 表中最近的一条记录 ![Image](img/circle-g.jpg)：\n\n```sql\nSELECT message_id, subject, date_entered\
  \ FROM messages\nORDER BY date_entered DESC LIMIT 1;\n```\n\n![Image](img/06_figure_26_g.jpg)\n\
  \n![Image](img/circle-g.jpg)刚刚插入的记录，显示的时间超前四小时（服务器为 UTC-4）。\n\n正如你在图表和表定义中所见，UTC\
  \ 时间的存储方式与非 UTC 时间完全相同。图表中不明显的是，刚插入的记录反映的时间比服务器时间超前四小时（因为我特定的服务器位于比 UTC 晚四小时的时区）。\n\
  \n**8.** 检索同一记录，并将 `date_entered` 转换为你的时区 ![Image](img/circle-h.jpg)：\n\n```sql\n\
  SELECT message_id, subject,\nCONVERT_TZ(date_entered, 'UTC', 'America/New_York')\
  \ AS local\nFROM messages ORDER BY date_entered DESC LIMIT 1;\n```\n\n![Image](img/06_figure_27_h.jpg)\n\
  \n![Image](img/circle-h.jpg)存储的 UTC 日期和时间已转换为我的本地时间。\n\n使用 `CONVERT_TZ()` 函数，你可以将任何日期和时间转换为不同的时区。对于\
  \ `from` 时区，使用 `UTC`。对于 `to` 时区，使用你的时区。\n\n如果得到 `NULL` 结果 ![Image](img/graycircle-b.jpg)，则可能是你的某个时区名称错误，或者\
  \ MySQL 尚未加载时区表（见侧栏）。\n\n***\n\n提示\n\n无论你决定如何处理日期，关键在于**保持一致**。如果你决定使用 UTC，则*始终*使用\
  \ UTC。\n\n***\n\n***\n\n提示\n\nUTC 也称为**祖鲁时间**，用字母 *Z* 表示。\n\n***\n\n***\n\n提示\n\n\
  除了与时区和夏令时无关外，UTC 也更精确。它考虑了不规则的闰秒，以补偿地球运动的不精确性。\n\n***\n\n### 外键约束\n\nInnoDB 表类型的一项特性（其他存储引擎不支持）是应用*外键约束*的能力。当你拥有相关联的表时，表\
  \ B 中的外键关联到表 A 中的主键（为便于理解，可以将表 B 视为子表，表 A 视为父表）。例如，在 `forums` 数据库中，`messages.user_id`\
  \ 关联到 `users.user_id`。如果管理员删除一个用户账户，这些表之间的关系就会被破坏（因为 `messages` 表将拥有 `users` 表中不存在的\
  \ `user_id` 值的记录）。外键约束设定了当这种破坏发生时应采取的规则，包括防止这种破坏。\n\n创建外键约束的语法是：\n\n```sql\nFOREIGN\
  \ KEY (item_name) REFERENCES table (column)\n```\n\n（这放在 `CREATE TABLE` 或 `ALTER\
  \ TABLE` 语句中。）\n\n项名是当前表中的外键列。`table(column)` 子句引用了该外键应约束到的父表列。如果你仅使用上述语法，即仅标识关系而不指定违反约束时应发生什么，MySQL\
  \ 将在你尝试删除存在子记录的父记录时抛出错误 ![Image](img/circle-a.jpg)。如果你尝试使用不存在的父 ID 创建子记录，MySQL 也会抛出错误\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/06_figure_28_a.jpg)\n\n![Image](img/circle-a.jpg)此错误表明\
  \ MySQL 正阻止删除父记录的查询，因为该记录被约束到一个或多个现有的子记录。\n\n![Image](img/06_figure_29_b.jpg)\n\n\
  ![Image](img/circle-b.jpg)外键约束也会影响 `INSERT` 查询。\n\n你可以通过在上述语法后跟随以下一项或两项来规定应发生的替代操作：\n\
  \n```sql\nON DELETE action\nON UPDATE action\n```\n\n有五个操作选项，但其中两个——`RESTRICT` 和\
  \ `NO ACTION`——是同义词，也是默认值（即与完全不指定操作相同）。第三个操作选项——`SET DEFAULT`——不起作用（别问我，去问 MySQL\
  \ 手册！）。剩下的就是 `CASCADE` 和 `SET NULL`。如果操作设为 `SET NULL`，删除父记录将导致子表中对应的外键被设为 `NULL`。如果该表将该列定义为\
  \ `NOT NULL`（几乎总是应该这样定义），删除父记录将触发错误。\n\n`CASCADE` 操作是最有用的选项。它告诉数据库对相关表应用相同的更改。有了这条指令，如果你删除父记录，MySQL\
  \ 也将删除具有该父 ID 作为外键的子记录。\n\n由于只有 InnoDB 表类型支持外键约束，关系中的两个表都必须是 InnoDB 类型。此外，为了让 MySQL\
  \ 能够比较外键-主键值，相关列必须是兼容的类型。这意味着数值列必须是相同的类型和大小；文本列必须使用相同的字符集和排序规则。\n\n以 `forums` 示例为例，无法使用外键约束，因为唯一关联到另一个表的表——`messages`\
  \ 同时关联 `forums` 和 `users`——必须使用 MyISAM 表类型（以支持 `FULLTEXT` 搜索）。相反，让我们看一个用于银行业务的新假设示例\
  \ ![Image](img/circle-c.jpg)。\n\n![Image](img/06_figure_30_c.jpg)\n\n![Image](img/circle-c.jpg)`banking`\
  \ 数据库可用于虚拟银行业务。\n\n\n\n\n#### 创建外键约束\n\n`customers` 表存储与客户相关的所有信息。从逻辑上讲，它也会存储联系信息等。`accounts`\
  \ 表存储每个客户的账户，包括类型（支票账户或储蓄账户）和余额。每个客户可能拥有多个账户，但每个账户仅关联一个客户（为了一点简单性）。在现实世界中，该表可能还会存储账户开户日期，并使用\
  \ `BIGINT` 作为余额（从而以分而非带小数的美元来表示所有交易）。最后，`transactions` 表存储从一个账户到另一个账户的每一笔资金流动。同样，为了使示例更容易理解，示例假设仅此系统内的账户会进行交互。请注意，`transactions`\
  \ 表与 `accounts` 存在两个一对多关系（而非一个多对多关系）。每笔交易的 `to_account_id` 值将关联单个账户，但每个账户都可能多次作为“收款”账户。“付款”账户同理。最后，应用外键约束以保持数据的完整性。\n\
  \n在接下来的一系列步骤中，你将创建并填充此数据库，同时注意约束。在下一章中，将使用同一个数据库来演示事务和加密。\n\n#### 步骤\n\n**1.** 使用你喜欢的任何客户端访问\
  \ MySQL。\n\n与前一章一样，本章也将在所有示例中使用 `mysql` 客户端。你也可以使用 phpMyAdmin 或其他工具作为 MySQL 的界面。\n\
  \n**2.** 创建 `banking` 数据库：\n\n```\nCREATE DATABASE banking\nCHARACTER SET utf8\n\
  COLLATE utf8_general_ci;\nUSE banking;\n```\n\n一如既往，取决于你的设置，你可能不被允许创建自己的数据库。如果不允许，只需使用提供给你的数据库，并将以下表添加到其中。\n\
  \n**3.** 如有必要，将通信编码更改为 UTF-8：\n\n```\nCHARSET utf8;\n```\n\n**4.** 创建 `customers`\
  \ 表：\n\n```\nCREATE TABLE customers (\n    customer_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \    first_name VARCHAR(20) NOT NULL,\n    last_name VARCHAR(40) NOT NULL,\n   \
  \ PRIMARY KEY (customer_id),\n    INDEX full_name (last_name, first_name)\n) ENGINE\
  \ = INNODB;\n```\n\n`customers` 表仅存储客户的 ID（主键）和姓名（分两列）。在全名上也建立了一个索引，以防在 `ORDER BY`\
  \ 和其他查询子句中使用。为了让数据库能够使用外键约束，每个表都将使用 InnoDB 存储引擎。\n\n**5.** 创建 `accounts` 表：\n\n\
  ```\nCREATE TABLE accounts (\n    account_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \    customer_id INT UNSIGNED NOT NULL,\n    type ENUM('Checking', 'Savings') NOT\
  \ NULL,\n    balance DECIMAL(10,2) UNSIGNED NOT NULL DEFAULT 0.0,\n    PRIMARY KEY\
  \ (account_id),\n    INDEX (customer_id),\n    FOREIGN KEY (customer_id) REFERENCES\
  \ customers (customer_id)\n    ON DELETE NO ACTION ON UPDATE NO ACTION\n) ENGINE\
  \ = INNODB;\n```\n\n`accounts` 表存储账户 ID、客户 ID、账户类型和余额。`customer_id` 列上有索引，因为它将用于\
  \ `JOIN` 操作（见第 7 章）。更重要的是，该列被约束关联到 `customers.customer_id`，从而保护了这两张表。尽管 `NO ACTION`\
  \ 是默认约束，但我仍在定义中包含了它，以增加清晰度。\n\n**6.** 创建 `transactions` 表：\n\n```\nCREATE TABLE\
  \ transactions (\n    transaction_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n   \
  \ to_account_id INT UNSIGNED NOT NULL,\n    from_account_id INT UNSIGNED NOT NULL,\n\
  \    amount DECIMAL(5,2) UNSIGNED NOT NULL,\n    date_entered TIMESTAMP NOT NULL,\n\
  \    PRIMARY KEY (transaction_id),\n    INDEX (to_account_id),\n    INDEX (from_account_id),\n\
  \    INDEX (date_entered),\n    FOREIGN KEY (to_account_id) REFERENCES accounts\
  \ (account_id)\n    ON DELETE NO ACTION ON UPDATE NO ACTION,\n    FOREIGN KEY (from_account_id)\
  \ REFERENCES accounts (account_id)\n    ON DELETE NO ACTION ON UPDATE NO ACTION\n\
  ) ENGINE = INNODB;\n```\n\n最后这个表将用于记录账户间的所有资金流动。为此，它存储两个账户 ID——“收款”和“付款”、金额和日期/时间。相应地添加了索引，并且两个账户\
  \ ID 都被约束关联到 `accounts` 表。\n\n**7.** 填充 customers 和 accounts 表：\n\n```\nINSERT INTO\
  \ customers (first_name, last_name)\nVALUES ('Sarah', 'Vowell'), ('David', 'Sedaris'),\
  \ ('Kojo', 'Nnamdi');\nINSERT INTO accounts (customer_id, balance)\nVALUES (1, 5460.23),\
  \ (2, 909325.24), (3, 892.00);\n```\n\n首先，示例数据被录入前两个表（第三个表将在下一章使用）。请注意，因为 `accounts.type`\
  \ 列被定义为 `ENUM NOT NULL`，如果未为该列提供值，`ENUM` 定义中的第一项——Checking——将被使用。\n\n**8.** 尝试向\
  \ `accounts` 表中插入没有对应客户的数据：\n\n```\nINSERT INTO accounts (customer_id, type, balance)\n\
  VALUES (10, 'Savings', 200.00);\n```\n\n`accounts` 表中存在的外键约束将阻止在没有有效客户 ID 的情况下创建账户（这在现实世界中是一个非常有用的检查）。\n\
  \n**9.** 尝试从 `customers` 表中删除在 `accounts` 表中有记录的记录：\n\n```\nDELETE FROM customers\n\
  WHERE customer_id=2;\n```\n\n当该客户仍有账户时，该约束也将阻止删除客户记录。\n\n尽管有约束，如果客户在 `accounts`\
  \ 表中没有任何记录，你仍然可以删除该客户记录。\n\n***\n\n**提示**\n\n要实际删除受约束的记录，必须先删除所有子记录，然后再删除父记录。\n\n\
  ***\n\n**提示**\n\n外键约束要求约束中的所有列都必须被索引。正常的数据库设计建议如此，但如果正确的索引不存在，MySQL 会在定义约束时创建它们。\n\
  \n***\n\n**提示**\n\n与约束类似的是*触发器*。简单来说，触发器是一种告诉数据库“当此表发生 X 时，执行 Y”的方式。例如，当在表 A 中插入一条记录时，可能会在表\
  \ B 中创建或更新另一条记录。详见 MySQL 手册了解更多关于触发器的信息。\n\n***\n\n### 复习与实践\n\n如果你在复习问题或实践提示方面有任何问题，请访问本书的支持论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）。\n\
  \n#### 复习\n\n• 为什么规范化很重要？\n\n• 什么是两种类型的键？\n\n• 什么是三种类型的表关系？\n\n\n\n\n• 如何解决两个表之间多对多关系的问题？\n\
  \n• 索引有哪四种类型？通常哪些类型的列*应该*建立索引？通常哪些类型的列*不应该*建立索引？\n\n• MySQL 最常见的两种表类型是什么？你的 MySQL\
  \ 安装的默认表类型是什么？\n\n• 什么是*字符集*？什么是*校对规则*？字符集对数据库有什么影响？校对规则有什么影响？你使用的是什么字符集和校对规则？\n\
  \n• 什么是 *UTC*？如何在 MySQL 中查找 UTC 时间？如何将 UTC 转换为其他时区的时间？\n\n• 什么是*外键约束*？哪种表类型支持外键约束？\n\
  \n#### 实践\n\n• 你可以考虑下载、安装并学习使用 MySQL Workbench 应用程序。它非常实用。\n\n• 如果你没有完全掌握规范化的过程——这完全可以理解——请在网上搜索更多教程，或在我的支持论坛提问。\n\
  \n• 利用此处提供的信息设计你自己的数据库。\n\n## 7. 高级 SQL 和 MySQL\n\n### 本章内容\n\n- 执行连接查询 204\n- 分组查询结果\
  \ 214\n- 高级查询 218\n- 执行全文搜索 222\n- 优化查询 230\n- 执行事务 234\n- 数据库加密 237\n- 复习与实践 240\n\
  \n本章是最后一章专门讲解 SQL 和 MySQL 的内容（尽管本书其余大部分仍会以某种形式使用这些技术），讨论了处理更复杂数据库（如上一章创建的那些）所需的高级概念。第一个主题是\
  \ `JOIN`，这是一个关键的 SQL 术语，用于查询包含多个表的规范化数据库。随后，本章介绍了一类专门用于分组查询结果的函数，以及从表中选择值的更复杂方法。\n\
  \n在本章中部，你将学习如何执行 `FULLTEXT` 搜索，这可以为任何网站添加类似搜索引擎的功能。接下来是 `EXPLAIN` 命令：它提供了一种测试数据库模式和查询效率的方法。本章最后介绍事务和数据库加密。\n\
  \n### 执行连接查询\n\n由于关系型数据库结构更复杂，有时需要特殊的查询语句来检索你最需要的信息。例如，如果你想知道 *MySQL* 论坛中有哪些消息（使用上一章创建的\
  \ *forum* 数据库），你首先需要找到 *MySQL* 的 `forum_id`：\n\n```\nSELECT forum_id FROM forums\
  \ WHERE name='MySQL'\n```\n\n然后你将使用该数字从 *messages* 表中检索所有具有该 `forum_id` 的记录：\n\n\
  ```\nSELECT * FROM messages WHERE forum_id=1\n```\n\n这一简单任务（在论坛中经常需要）将需要两个单独的查询。通过使用*连接*，你可以一次性完成所有操作。\n\
  \n连接是一种使用两个或多个表的 SQL 查询，并生成一个虚拟的结果表。任何时候当你需要同时从多个表中检索信息时，可能都会用到连接。\n\n连接可以用多种不同的方式编写，但基本语法是：\n\
  \n```\nSELECT what_columns FROM tableA JOIN_TYPE tableB JOIN_CLAUSE\n```\n\n因为连接涉及多个表，`what_columns`\
  \ 可以包含查询中指定的任何表中的列。而且由于连接通常返回大量信息，通常最好明确指定想要返回的确切列，而不是选择所有列。\n\n当从多个表中选择数据时，如果查询中指定的表具有同名列，则必须使用点语法（`table.column`）。在处理关系型数据库时，这种情况很常见，因为一个表的主键可能与另一个表的外键同名。如果引用列时不明确，会报错：\n\
  \n```\nSELECT forum_id FROM messages INNER JOIN  \nforums ON messages.forum_id=forums.forum_id\n\
  ```\n\n连接的两种主要类型是*内连接*和*外连接*（两者都有子类型）。正如你将在外连接中看到的，引用表的顺序很重要。\n\n连接子句用于指示被连接表之间的关系。例如，`forums.forum_id`\
  \ 应等于 `messages.forum_id`（如上所示）。\n\n你也可以在连接中使用 `WHERE` 和 `ORDER BY` 子句，就像在任何 `SELECT`\
  \ 查询中一样。\n\n最后，在深入讲解连接之前，SQL 中*别名*的概念——在第 5 章“SQL 简介”中介绍过——在编写连接时将派上用场。别名通常用作在同一查询中多次引用同一表的简写方式。如果你不记得创建别名的语法或其用法，请回顾第\
  \ 5 章的相关部分。\n\n（与前两章一样，本章将使用命令行 mysql 客户端执行查询，但你也可以使用 phpMyAdmin 或其他工具。本章假设你知道如何连接到\
  \ MySQL 服务器，并在必要时声明要使用的字符集。）\n\n#### 内连接\n\n内连接返回指定表中满足匹配条件的所有记录。例如，要查找发布在 *MySQL*\
  \ 论坛中的每条消息，内连接可以这样写：\n\n```\nSELECT m.message_id, m.subject, f.name  \nFROM messages\
  \ AS m INNER JOIN forums AS f  \nON m.forum_id = f.forum_id  \nWHERE f.name = 'MySQL'\n\
  ```\n\n此连接从 *messages* 表（别名为 *m*）中选择三列，从 *forums* 表（别名为 *f*）中选择一列，基于两个条件。首先，`f.name`\
  \ 列的值必须为 *MySQL*（这将返回 `forum_id` 为 1）。其次，*forums* 表中的 `forum_id` 值必须与 *messages*\
  \ 表中的 `forum_id` 值匹配。由于在两个表之间进行等值比较（`m.forum_id = f.forum_id`），这被称为*等值连接*。\n\n作为替代语法，如果用于等值比较的两个表中的列同名，可以使用\
  \ `USING` 简化查询：\n\n```\nSELECT m.message_id, m.subject, f.name  \nFROM messages\
  \ AS m INNER JOIN forums AS f  \nUSING (forum_id)  \nWHERE f.name = 'MySQL'\n```\n\
  \n#### 使用内连接\n\n**1.** 连接到 MySQL 并选择 *forum* 数据库。\n\n**2.** 检索 *messages* 表中每条记录的论坛名称和消息主题：\n\
  \n```\nSELECT f.name, m.subject FROM forums  \nAS f INNER JOIN messages AS m  \n\
  USING (forum_id) ORDER BY f.name;\n```\n\n此查询将有效地用 *forums* 表中对应的 `name` 值替换 *messages*\
  \ 表中的 `forum_id` 值，针对 *messages* 表中的每条记录。最终结果是显示每条消息主题对应的论坛名称文本版本。\n\n\n\n请注意，您仍然可以在连接中使用\
  \ `ORDER BY` 子句。\n\n### 3. 检索用户 *funny man* 发布的每条消息的主题和录入日期 ![Image](img/circle-d.jpg)：\n\
  \n```sql\nSELECT m.subject,\nDATE_FORMAT(m.date_entered, '%M %D, %Y') AS Date\n\
  FROM users AS u\nINNER JOIN messages AS m\nUSING (user_id)\nWHERE u.username = 'funny\
  \ man';\n```\n\n![Image](img/07_figure_04_d.jpg)\n\n![Image](img/circle-d.jpg) 一个基于\
  \ *users* 和 *messages* 表的稍微复杂一些的内连接版本。\n\n此连接也使用两张表：*users* 和 *messages*。两张表的关联列是\
  \ `user_id`，因此它被放置在 `USING` 子句中。`WHERE` 条件标识了目标用户，而 `DATE_FORMAT()` 函数将帮助格式化 `date_entered`\
  \ 值。\n\n### 4. 查找拥有最近五条发帖的论坛 ![Image](img/circle-e.jpg)：\n\n```sql\nSELECT f.name\
  \ FROM forums AS f\nINNER JOIN messages AS m\nUSING (forum_id)\nORDER BY m.date_entered\
  \ DESC LIMIT 5;\n```\n\n![Image](img/07_figure_05_e.jpg)\n\n![Image](img/circle-e.jpg)\
  \ 此连接应用了 `ORDER BY` 子句和 `LIMIT` 子句，返回拥有最近五条消息的论坛。\n\n由于只需要返回论坛名称，因此这是该查询选择的唯一列。然后跨\
  \ *forums* 和 *messages* 表进行连接，通过 `forum_id` 关联。到此为止，该查询将返回与其所在论坛匹配的每条消息。然后按 `date_entered`\
  \ 列降序排序该结果，并限制为仅前五条记录。\n\n---\n\n**提示**\n\n内连接也可以在不正式使用 `INNER JOIN` 短语的情况下编写。为此，在表名之间放置一个逗号，并将\
  \ `ON` 或 `USING` 子句转换为另一个 `WHERE` 条件：\n\n```sql\nSELECT m.message_id, m.subject,\
  \ f.name FROM messages AS m, forums AS f WHERE m.forum_id = f.forum_id\nAND f.name\
  \ = 'MySQL'\n```\n\n---\n\n**提示**\n\n不包含连接子句（`ON` 或 `USING`）或 `WHERE` 子句的连接（例如 `SELECT\
  \ * FROM urls INNER JOIN url_associations`）称为*全*连接，将返回两张表中的每一条记录。对于较大的表，这种结构可能会产生难以处理的结果。\n\
  \n---\n\n**提示**\n\n内连接中引用列的 `NULL` 值永远不会被返回，因为 `NULL` 不匹配任何其他值，包括 `NULL` 本身。\n\n\
  ---\n\n**提示**\n\nMySQL 支持的连接类型与 SQL 标准略有不同。例如，SQL 将 `CROSS JOIN` 和 `INNER JOIN`\
  \ 作为两种不同的东西支持，但在 MySQL 中它们在语法上是相同的。\n\n---\n\n### 外连接\n\n内连接根据在两张表之间建立匹配来返回记录，而*外*连接将返回由两张表匹配的记录，*以及不匹配的记录*。换句话说，内连接是排他性的，但外连接是包容性的。有三种外连接子类型：*左*、*右*\
  \ 和 *全*，其中左连接最为重要。左连接的一个示例如下：\n\n```sql\nSELECT f.*, m.subject FROM forums AS f\n\
  LEFT JOIN messages AS m\nON f.forum_id = m.forum_id\n```\n\n使用左连接时最重要的考虑因素是哪张表被首先命名。在此示例中，所有\
  \ *forums* 记录将被返回，如果找到匹配，则连同所有 *messages* 信息一起返回。如果没有 *messages* 记录匹配 *forums* 行，则所选\
  \ *messages* 列将返回 `NULL` 值 ![Image](img/circle-f.jpg)。\n\n![Image](img/07_figure_06_f.jpg)\n\
  \n![Image](img/circle-f.jpg) 外连接返回第一张列出的表中的所有记录，第二张表中不匹配的记录将被 `NULL` 值替换。\n\n与内连接一样，如果用于相等比较的两张表中的列具有相同的名称，您可以使用\
  \ `USING` 简化查询：\n\n```sql\nSELECT f.*, m.subject FROM forums AS f\nLEFT JOIN messages\
  \ AS m\nUSING (forum_id)\n```\n\n右外连接执行与左外连接相反的操作：它返回右侧表的所有适用记录，以及左侧表的匹配记录。此查询等同于上面的查询：\n\
  \n```sql\nSELECT f.*, m.subject FROM messages AS m\nRIGHT JOIN forums AS f\nUSING\
  \ (forum_id)\n```\n\n一般来说，左连接优于右连接（而且可以说，根本不需要同时拥有两者）。\n\n全外连接类似于左外连接和右外连接的组合。换句话说，将返回两张表中所有匹配的记录，以及左侧表中在右侧表中没有匹配的所有记录，加上右侧表中在左侧表中没有匹配的所有记录。MySQL\
  \ 不直接支持全外连接，但您可以使用左连接、右连接和 `UNION` 语句来复制该功能。全外连接不常用，但如果您对它或*联合*感兴趣，请参阅 MySQL 手册。\n\
  \n### 使用外连接\n\n#### 1. 连接到 MySQL 并选择 *forum* 数据库（如果尚未选择）。\n\n#### 2. 检索每个用户名及该用户发布的每条消息\
  \ ID ![Image](img/circle-g.jpg)：\n\n```sql\nSELECT u.username, m.message_id\nFROM\
  \ users AS u\nLEFT JOIN messages AS m\nUSING (user_id);\n```\n\n![Image](img/07_figure_07_g.jpg)\n\
  \n![Image](img/circle-g.jpg) 此左连接为每个用户返回每条已发布的消息 ID。如果用户尚未发布消息（如顶部的 *finchy*），消息\
  \ ID 值将为 `NULL`。\n\n如果您运行类似的内连接，尚未发布消息的用户将不会被列出 ![Image](img/circle-h.jpg)。因此，需要外连接以包含所有用户。请注意，完全包含的表（此处为\
  \ *users*）必须是在左连接中首先列出的表。\n\n![Image](img/07_figure_08_h.jpg)\n\n![Image](img/circle-h.jpg)\
  \ 此内连接不会返回任何尚未发布消息的用户（请参阅 ![Image](img/graycircle-g.jpg) 顶部的 *finchy*）。\n\n####\
  \ 3. 按提交日期顺序检索每个论坛名称及该论坛中的每条消息提交日期 ![Image](img/circle-i.jpg)：\n\n```sql\nSELECT\
  \ f.name,\nDATE_FORMAT(m.date_entered, '%M %D, Y') AS Date\nFROM forums AS f\nLEFT\
  \ JOIN messages AS m\nUSING (forum_id)\nORDER BY date_entered DESC;\n```\n\n![Image](img/07_figure_09_i.jpg)\n\
  \n![Image](img/circle-i.jpg) 此左外连接返回每个论坛名称及该论坛中发布的每条消息的日期。\n\n这实际上只是第 2 步中连接的一个变体，这次用\
  \ *forums* 表替换了 *users* 表。\n\n---\n\n### 执行自连接\n\n在 SQL 中可以执行*自连接*：将一张表与其自身连接。例如，对于\
  \ *messages* 表，`parent_id` 列是指示哪些发帖是对其他发帖的回复的一种方式。要检索单个发帖层级，`SELECT` 查询必须将 *messages*\
  \ 表与其自身连接，在此过程中将 `parent_id` 与 `message_id` 等同起来。\n\n这听起来可能令人困惑或不可能，但实际上并非如此。自连接的诀窍是将对同一表的两个引用视为对两张不同表的单个引用。要做到这一点，请为每个表引用分配不同的别名。上述示例将编写如下：\n\
  \n```sql\nSELECT m1.subject, m2.subject AS Reply FROM messages AS m1 LEFT JOIN messages\
  \ AS m2 ON m1.message_id=m2.parent_id WHERE m1.parent_id=0\n```\n\n\n\n该查询首先在第一个\
  \ *messages* 表实例 *m1* 中选择每一条根级消息——即那些 `parent_id` 值为 `0` 的消息。然后将这些记录与第二个 *messages*\
  \ 表实例 *m2* 进行外连接。如果你自己运行此查询，将会看到选出了根消息的主题，以及该消息回复的主题（如果适用）。\n\n自连接不是最流行的连接类型，但有时能比大多数其他解决方案更好地解决问题。\n\
  \n---\n\n### 提示\n\n连接可以使用涉及任意列的条件来创建，而不仅限于主键和外键，尽管那是最常用的比较基础。\n\n---\n\n### 提示\n\
  \n你可以使用 `database.table.column` 语法跨多个数据库执行连接，只要每个数据库都在同一台服务器上（你无法跨网络执行此操作），并且你以拥有访问所有相关数据库权限的用户身份连接。\n\
  \n---\n\n### 提示\n\n左外连接中的单词 `OUTER` 是可选的，且经常被省略。若要正式书写，你可以写成：\n\n```sql\nSELECT\
  \ f.name, DATE_FORMAT(m.date_entered, '%M %D, Y') AS Date FROM forums AS f LEFT\
  \ OUTER JOIN messages AS m USING (forum_id) ORDER BY date_entered DESC;\n```\n\n\
  ---\n\n#### 连接三个或更多表\n\n连接是一个有点复杂但很重要的概念，希望你目前能跟得上。还有两种连接的用法你应该熟悉：*自连接*（在侧边栏中讨论）和三个或更多表的连接。\n\
  \n当连接三个或更多表时，记住两个表之间的连接会创建一个结果虚拟表会有所帮助。当你添加第三个表时，连接就是在这个初始虚拟表和第三个被引用的表之间进行 ![Image](img/circle-j.jpg)。三表连接的语法格式为：\n\
  \n```sql\nSELECT what_columns FROM tableA JOIN_TYPE tableB JOIN_CLAUSE JOIN_TYPE\
  \ tableC JOIN_CLAUSE\n```\n\n![Image](img/07_figure_10_j.jpg)\n\n![Image](img/circle-j.jpg)三表连接的工作原理：首先创建一个结果虚拟表，然后将第三个表连接到该虚拟表。\n\
  \n这两种情况下的连接类型不必相同——一种可以是内连接，另一种可以是外连接——而且连接子句几乎肯定不同。你甚至可以在末尾添加 `WHERE`、`ORDER BY`\
  \ 和 `LIMIT` 子句。简单来说，要对两个以上的表执行连接，只需根据需要继续添加 `JOIN_TYPE tableX JOIN_CLAUSE` 部分即可。\n\
  \n跨越三个或更多表的连接可能会遇到三个常见问题。第一个是简单的语法错误，特别是当你使用括号分隔子句时。第二个是列名歧义错误，这在任何连接类型中都很常见。第三个可能的问题是返回结果为空。如果发生这种情况，请将连接简化为仅两个表以确认结果，然后尝试重新应用额外的连接子句以找出问题所在。\n\
  \n#### 在三个或更多表上使用连接\n\n**1.** 连接到 MySQL 并选择 *forum* 数据库（如果尚未选择）。\n\n**2.** 检索用户\
  \ *troutster* 发布的每条消息的消息 ID、主题和论坛名称 ![Image](img/circle-k.jpg)：\n\n```sql\nSELECT\
  \ m.message_id, m.subject, f.name\nFROM users AS u\nINNER JOIN messages AS m\nUSING\
  \ (user_id)\nINNER JOIN forums AS f\nUSING (forum_id)\nWHERE u.username = 'troutster';\n\
  ```\n\n![Image](img/07_figure_11_k.jpg)\n\n![Image](img/circle-k.jpg)跨所有三个表的内连接。\n\
  \n此连接类似于本章前面的一个，但通过引入第三个表更进了一步。\n\n**3.** 检索每个用户的用户名、消息主题和论坛名称 ![Image](img/circle-l.jpg)：\n\
  \n```sql\nSELECT u.username, m.subject, f.name\nFROM users AS u\nLEFT JOIN messages\
  \ AS m\nUSING (user_id)\nLEFT JOIN forums AS f\nUSING (forum_id);\n```\n\n![Image](img/07_figure_12_l.jpg)\n\
  \n![Image](img/circle-l.jpg)此左连接返回每个用户、每条发布的消息主题和每个论坛名称。如果用户未发布消息（如顶部的 *finchy*），其主题和论坛名称值将为\
  \ `NULL`。\n\n第 2 步中的查询执行两次内连接，而此查询执行两次外连接。此查询背后的过程由 ![Image](img/graycircle-j.jpg)\
  \ 中的图表直观表示。\n\n**4.** 找出拥有最近五条发帖的用户，同时选择消息主题和论坛名称 ![Image](img/circle-m.jpg)：\n\n\
  ```sql\nSELECT u.username, m.subject, f.name\nFROM users AS u\nINNER JOIN messages\
  \ AS m\nUSING (user_id)\nINNER JOIN forums AS f\nUSING (forum_id)\nORDER BY m.date_entered\
  \ DESC\nLIMIT 5;\n```\n\n![Image](img/07_figure_13_m.jpg)\n\n![Image](img/circle-m.jpg)此内连接返回来自所有三个表的值，并应用了\
  \ `ORDER BY` 和 `LIMIT` 子句。\n\n为了检索用户名、消息主题和论坛名称，需要跨所有三个表进行连接。由于查询仅查找已发帖的用户，因此内连接是合适的。两次连接的结果将是每个用户名、他们发布的每条消息、在每个论坛中。然后按消息的\
  \ *date_entered* 列对该结果排序，并仅限制为前五条记录。\n\n### 分组选定结果\n\n第 5 章 讨论并演示了可在 MySQL 中使用的几类不同函数。另一类用于更复杂查询的是\
  \ *分组* 或 *聚合* 函数（**表 7.1**）。\n\n**表 7.1. 分组函数**\n\n![Image](img/07tab01.jpg)\n\n\
  第 5 章 中介绍的大多数函数一次操作单行中的单个值（例如，格式化日期列中的值），而分组函数返回的结果基于一组行中单个列出现的值。例如，要在 *banking*\
  \ 数据库中查找平均账户余额，你可以运行此查询 ![Image](img/circle-a.jpg)：\n\n```sql\nSELECT AVG(balance)\
  \ FROM accounts\n```\n\n![Image](img/07_figure_14_a.jpg)\n\n![Image](img/circle-a.jpg)使用\
  \ `AVG()` 函数查找所有账户余额的平均值。\n\n要查找最小和最大账户余额，请使用 ![Image](img/circle-b.jpg)：\n\n```sql\n\
  SELECT MAX(balance), MIN(balance) FROM accounts\n```\n\n![Image](img/07_figure_15_b.jpg)\n\
  \n![Image](img/circle-b.jpg)`MAX()` 和 `MIN()` 函数返回表中找到的最大和最小账户值。\n\n要仅计算表（或结果集）中的记录数，请将\
  \ `COUNT()` 应用于每一列或保证有值的每一列：\n\n```sql\nSELECT COUNT(*) FROM accounts\n```\n\n`AVG()`、`COUNT()`\
  \ 和 `SUM()` 函数也可以使用 `DISTINCT` 关键字，以便聚合仅应用于不同的值。例如，`SELECT COUNT(customer_id) FROM\
  \ accounts` 将返回账户数量，但 `SELECT COUNT(DISTINCT customer_ID) FROM accounts` 将返回拥有账户的客户数量\
  \ ![Image](img/circle-c.jpg)。\n\n![Image](img/07_figure_16_c.jpg)\n\n![Image](img/circle-c.jpg)`COUNT()`\
  \ 函数，无论是否带 `DISTINCT` 关键字，只是计算记录集中的记录数。\n\n聚合函数单独使用时返回单个值（如 ![Image](img/graycircle-a.jpg)、![Image](img/graycircle-b.jpg)\
  \ 和 ![Image](img/graycircle-c.jpg) 所示）。当聚合函数与 `GROUP BY` 子句一起使用时，将为结果集中的每一行返回一个聚合值\
  \ ![Image](img/circle-d.jpg)：\n\n```sql\nSELECT AVG(balance), customer_id FROM accounts\
  \ GROUP BY customer_id\n```\n\n![Image](img/07_figure_17_d.jpg)\n\n\n\n\n![Image](img/circle-d.jpg)使用带有聚合函数的\
  \ `GROUP BY` 子句对聚合结果进行分组。\n\n您可以将 `WHERE`、`ORDER BY` 和 `LIMIT` 条件的组合应用于 `GROUP BY`，构建查询结构如下：\n\
  \n```sql\nSELECT what_columns FROM table\nWHERE condition GROUP BY column\nORDER\
  \ BY column LIMIT x, y\n```\n\n`GROUP BY` 子句也可用于连接查询中。请记住，连接查询会返回一个包含数据的新虚拟表，因此任何分组都将应用于该虚拟表。\n\
  \n#### 对数据进行分组\n\n**1.** 连接到 MySQL 并选择 *banking* 数据库。\n\n**2.** 统计已注册客户的数量 ![Image](img/circle-e.jpg)：\n\
  \n```sql\nSELECT COUNT(*) FROM customers;\n```\n\n![Image](img/07_figure_18_e.jpg)\n\
  \n![Image](img/circle-e.jpg)此聚合查询统计 *customers* 表中的记录数。\n\n`COUNT()` 或许是最常用的分组函数。借助它，您可以快速统计记录，例如此处\
  \ *customers* 表中的记录数。`COUNT()` 函数可应用于任何确定包含值的列，例如 `*`（即每一列）或 `customer_id`（主键）。\n\
  \n请注意，并非所有使用聚合函数的查询都一定包含 `GROUP BY` 子句。\n\n**3.** 按客户查找所有账户的总余额，同时统计账户数量 ![Image](img/circle-f.jpg)：\n\
  \n```sql\nSELECT SUM(balance) AS Total,\nCOUNT(account_id) AS Number, customer_id\n\
  FROM accounts\nGROUP BY (customer_id);\n```\n\n![Image](img/07_figure_19_f.jpg)\n\
  \n![Image](img/circle-f.jpg)此 `GROUP BY` 查询按 *customer_id* 聚合所有账户，返回每个客户账户的总和以及该客户拥有的账户总数。\n\
  \n此查询是步骤 2 中查询的扩展，但它不只是统计客户数量，而是统计与每个客户关联的账户数量，并汇总账户余额。\n\n**4.** 重复步骤 3 的查询，但选择客户姓名而非其\
  \ ID ![Image](img/circle-g.jpg)：\n\n```sql\nSELECT SUM(balance) AS Total,\nCOUNT(account_id)\
  \ AS Number,\nCONCAT(c.last_name, ', ', c.first_name) AS Name\nFROM accounts AS\
  \ a\nINNER JOIN customers AS c\nUSING (customer_id)\nGROUP BY (a.customer_id)\n\
  ORDER BY Name;\n```\n\n![Image](img/07_figure_20_g.jpg)\n\n![Image](img/circle-g.jpg)此\
  \ `GROUP BY` 查询类似于 ![Image](img/graycircle-f.jpg) 中的查询，但也返回客户姓名，并按姓名对结果进行排序（这需要连接查询）。\n\
  \n要检索客户姓名而非其 ID，需要进行连接查询：`INNER JOIN customers USING (customer_id)`。接下来，添加别名以便于引用，并修改\
  \ `GROUP BY` 子句以指定分组应用于哪个 *customer_id* 字段。得益于连接查询，可以将客户姓名作为名和姓的拼接（加上一个逗号和一个空格）进行选择。最后，可以按客户姓名对结果进行排序（请注意，`ORDER\
  \ BY` 子句中再次引用了该别名）。\n\n请记住，如果您使用外连接而非内连接，则可以检索到没有账户余额的客户。\n\n**5.** 将每个客户的余额连接成单个字符串\
  \ ![Image](img/circle-h.jpg)：\n\n```sql\nSELECT GROUP_CONCAT(balance),\nCONCAT(c.last_name,\
  \ ', ', c.first_name) AS Name\nFROM accounts AS a\nINNER JOIN customers AS c\nUSING\
  \ (customer_id)\nGROUP BY (a.customer_id)\nORDER BY Name;\n```\n\n![Image](img/07_figure_21_h.jpg)\n\
  \n![Image](img/circle-h.jpg)这是 ![Image](img/graycircle-g.jpg) 中查询的一个变体，该查询检索每个客户所有账户余额的连接字符串。\n\
  \n`GROUP_CONCAT()` 函数是一个有用但常被忽视的聚合工具。正如图中所示，默认情况下，此函数连接值，并用逗号分隔每个值。\n\n***\n\n>\
  \ **提示**\n>\n> `NULL` 是一个特殊的值，有趣的是 `GROUP BY` 会将 `NULL` 值归为一组，因为它们具有相同的非值。\n\n***\n\
  \n> **提示**\n>\n> 您必须小心应用 `COUNT()` 函数，因为它仅统计非 `NULL` 值。请务必将其用于每一列（`*`）或永远不包含 `NULL`\
  \ 值的列（如主键）。\n\n***\n\n> **提示**\n>\n> `GROUP BY` 子句及此处列出的函数需要一些时间来掌握，每当您的语法不适用时，MySQL\
  \ 都会报错。请在 mysql 客户端或 phpMyAdmin 中进行试验，以确定您想要从 PHP 脚本运行的任何查询的确切措辞。\n\n***\n\n> **提示**\n\
  >\n> 相关的子句是 `HAVING`，它类似于应用于分组的 `WHERE` 条件。\n\n***\n\n> **提示**\n>\n> 您不能将 `SUM()`\
  \ 和 `AVG()` 应用于日期或时间值。相反，您需要将日期和时间值转换为秒，执行 `SUM()` 或 `AVG()`，然后将该值转换回日期和时间。\n\n\
  ***\n\n### 高级选择\n\n本章前两节介绍了从复杂结构中选择数据的更高级方法。但即使使用聚合函数，所选数据也相对简单直接。不过，有时您需要有条件地选择数据，就像在查询本身中使用\
  \ `if-else` 子句一样。得益于*控制流*和*高级比较*函数，这在 SQL 中是可行的。\n\n首先，`GREATEST()` 返回列表中的最大值 ![Image](img/circle-a.jpg)：\n\
  \n```sql\nSELECT GREATEST(col1, col2) FROM table\nSELECT GREATEST(235, 1209, 59)\n\
  ```\n\n![Image](img/07_figure_22_a.jpg)\n\n![Image](img/circle-a.jpg)`GREATEST()`\
  \ 函数返回给定列表中的最大值。\n\n`LEAST()` 返回列表中的最小值：\n\n```sql\nSELECT LEAST(col1, col2) FROM\
  \ table\nSELECT LEAST(235, 1209, 59)\n```\n\n请注意，与聚合函数不同（聚合函数应用于多行中同一列找到的值列表），比较和控制流函数应用于同一行内的多个列（或值列表）。\n\
  \n另一个有用的比较函数是 `COALESCE()`。它返回列表中的第一个非 `NULL` 值：\n\n```sql\nSELECT COALESCE(col1,\
  \ col2) FROM table\n```\n\n如果列出的项均无值，则该函数返回 `NULL`（您将在后续步骤序列中看到示例）。\n\n`COALESCE()`\
  \ 只是返回第一个非 `NULL` 值，而您可以使用 `IF()` 根据条件返回任意值：\n\n```sql\nSELECT IF (condition, return_if_true,\
  \ return_if_false)\n```\n\n如果条件为真，则返回函数的第二个参数，否则返回第三个参数。例如，假设表在 *gender* 列中存储值 *M*\
  \ 或 *F*，查询可以选择 *Male* 或 *Female* 代替 ![Image](img/circle-b.jpg)：\n\n```sql\nSELECT\
  \ IF(gender='M', 'Male', 'Female') FROM people;\n```\n\n![Image](img/07_figure_23_b.jpg)\n\
  \n![Image](img/circle-b.jpg)`IF()` 函数可根据条件决定返回值。\n\n由于这些函数返回值，它们甚至可用于其他查询类型中：\n\n\
  ```sql\nINSERT INTO people (gender) VALUES (IF(something='Male', 'M', 'F'))\n```\n\
  \n`CASE()` 函数是一个更复杂的工具，可用于不同方式。第一种方法是将 `CASE()` 视为 PHP 的 `switch` 条件语句：\n\n```sql\n\
  SELECT CASE col1 WHEN value1 THEN return_this ELSE return_that END FROM table\n\
  ```\n\n性别示例可重写为：\n\n```sql\nSELECT CASE gender WHEN 'M' THEN 'Male' ELSE 'Female'\
  \ END FROM people\n```\n\n`CASE()` 函数可以有额外的 `WHEN` 子句。`ELSE` 也始终是可选的：\n\n```sql\n\
  SELECT CASE gender WHEN 'M' THEN 'Male' WHEN 'F' THEN 'FEMALE' END FROM people\n\
  ```\n\n\n\n\n如果您不想执行简单的相等性测试，可以将条件写入 **`CASE()`** 中：\n\n```sql\nSELECT message_id,\
  \ CASE WHEN date_entered > NOW() THEN 'Future' ELSE 'PAST' END AS Posted FROM messages\n\
  ```\n\n![Image](img/07_figure_24_c.jpg)\n\n`CASE()` 可像 `IF()` 一样使用，以自定义返回值。\n\n\
  同样，您可以根据需要添加多个 **`WHEN...THEN`** 子句，并在不必要时省略 **`ELSE`**。\n\n为了练习使用这些函数，让我们在 *forum*\
  \ 数据库上运行更多查询（提前提醒，它们会变得有点复杂）。\n\n#### 执行高级选择\n\n**1.** 连接到 MySQL 并选择 *forum* 数据库。\n\
  \n**2.** 对于每个论坛，查找最新帖子的日期和时间，如果论坛没有帖子则返回 *N/A* ![Image](img/circle-d.jpg)：\n\n```sql\n\
  SELECT f.name,\nCOALESCE(MAX(m.date_entered), 'N/A') AS last_post\nFROM forums AS\
  \ f\nLEFT JOIN messages AS m\nUSING (forum_id)\nGROUP BY (m.forum_id)\nORDER BY\
  \ m.date_entered DESC;\n```\n\n![Image](img/07_figure_25_d.jpg)\n\n![Image](img/circle-d.jpg)\
  \ `COALESCE()` 函数用于将 `NULL` 值转换为字符串 *N/A*（请参阅最后一条记录）。\n\n首先，为了同时查找论坛名称和该论坛中最新帖子的日期，需要进行连接。具体来说，需要外连接，因为可能存在没有帖子的论坛。为了查找每个论坛中最新的帖子，将聚合函数\
  \ **`MAX()`** 应用于 *date_entered* 列，并且结果必须按 *forum_id* 分组（以便 **`MAX()`** 应用于每个论坛内的每个帖子子集）。\n\
  \n此时，如果不调用 **`COALESCE()`** 函数，结果将为没有任何消息的论坛返回 **`NULL`**。最后一步是应用 **`COALESCE()`**，以便当\
  \ **`MAX(m.date_entered)`** 的值为 **`NULL`** 时，返回字符串 *N/A*。\n\n**3.** 对于每条消息，如果该消息是对另一条消息的回复，则在主题后追加字符串\
  \ *(REPLY)* ![Image](img/circle-e.jpg)：\n\n```sql\nSELECT message_id,\nCASE parent_id\
  \ WHEN 0 THEN subject\nELSE CONCAT(subject, ' (Reply)') END AS subject\nFROM messages;\n\
  ```\n\n![Image](img/07_figure_26_e.jpg)\n\n![Image](img/circle-e.jpg) 在这里，字符串 *(Reply)*\
  \ 会被追加到作为回复的任何消息的主题后。\n\n*messages* 表中 *parent_id* 不为 0 的记录是对现有消息的回复。对于这些消息，让我们在主题值后追加\
  \ *(REPLY)* 以示区别。为此，**`CASE`** 语句在 *parent_id* 值等于 0 时仅返回未经修改的主题。如果 *parent_id*\
  \ 值不等于 0，则再次借助 **`CASE`** 将字符串 *(REPLY)* 连接到主题后。整个结构被赋予 *subject* 别名，因此它仍以原始的“subject”标题返回。\n\
  \n**4.** 对于每个用户，查找他们发布的消息数量，将零值转换为字符串 *None* ![Image](img/circle-f.jpg)：\n\n```sql\n\
  SELECT u.username,\nIF(COUNT(message_id) > 0, COUNT(message_id), 'None') AS Posts\n\
  FROM users AS u\nLEFT JOIN messages AS m\nUSING (user_id)\nGROUP BY (u.user_id);\n\
  ```\n\n![Image](img/07_figure_27_f.jpg)\n\n![Image](img/circle-f.jpg) 多亏了 `IF()`\
  \ 调用，未发布任何消息的用户的发帖数将显示为 *None*。\n\n这在某种程度上是第 2 步查询的变体。左连接桥接 *users* 和 *messages*，以同时获取用户名和发布的消息计数。为了执行计数，结果按\
  \ *users.user_id* 分组。到此为止，查询将为从未发帖的每个用户返回 0 ![Image](img/circle-g.jpg)。为了将这些零转换为字符串\
  \ *None*，同时保留非零计数，应用了 **`IF()`** 函数。该函数的第一个参数设定条件：如果计数大于零。第二个参数表示条件为真时返回计数。第三个参数表示条件为假时返回字符串\
  \ *None*。\n\n![Image](img/07_figure_28_g.jpg)\n\n![Image](img/circle-g.jpg) 如果不使用\
  \ `IF()`，查询结果将如图所示（与 ![Image](img/graycircle-f.jpg) 对比）。\n\n***\n\n提示\n\n**`IFNULL()`**\
  \ 函数有时可代替 **`COALESCE()`** 使用。其语法为：\n\n```sql\nIFNULL(value, return_if_null)\n```\n\
  \n如果第一个参数（如命名列）的值为 **`NULL`**，则返回第二个参数。如果参数值不为 NULL，则返回该参数的值。\n\n***\n\n#### 执行\
  \ FULLTEXT 搜索\n\n在第 5 章中，介绍了 **`LIKE`** 关键字，作为执行简单字符串匹配的一种方式，例如：\n\n```sql\nSELECT\
  \ * FROM users\nWHERE last_name LIKE 'Smith%'\n```\n\n***\n\n**修改表**\n\n**`ALTER`**\
  \ SQL 术语主要用于修改现有表的结构。通常这意味着添加、删除或更改其中的列，但也包括添加索引。**`ALTER`** 语句甚至可用于重命名整个表。**`ALTER`**\
  \ 的基本语法是：\n\n```sql\nALTER TABLE tablename CLAUSE\n```\n\n有许多可能的子句；**表 7.2** 列出了最常用的子句，其中\
  \ *t* 代表表名，*c* 代表列名，*i* 代表索引名。一如既往，MySQL 手册详尽地涵盖了该主题。\n\n**表 7.2. ALTER TABLE 子句**\n\
  \n![Image](img/07tab02.jpg)\n\n您还可以使用 **`ALTER t CONVERT TO CHARACTER SET x COLLATE\
  \ y`** 更改表的字符集和排序规则。\n\n***\n\n这种条件判断虽然有效，但仍然非常受限。例如，它不允许您使用多个单词进行类似 Google 的搜索。对于这类情况，您需要\
  \ **`FULLTEXT`** 搜索。在接下来的几页中，您将了解关于 **`FULLTEXT`** 搜索的所有必要知识（在此过程中，您还将学到更多 SQL 技巧）。\n\
  \n#### 创建 FULLTEXT 索引\n\n首先，**`FULLTEXT`** 搜索需要 **`FULLTEXT`** 索引。正如第 6 章“数据库设计”中预览的那样，这种索引类型只能在\
  \ MyISAM 表上创建。接下来的示例将使用 *forum* 数据库中的 *messages* 表。因此，第一步是在 *body* 和 *subject* 列上添加\
  \ **`FULLTEXT`** 索引。向现有表添加索引需要使用 **`ALTER`** 命令，如侧边栏所述。\n\n#### 添加 FULLTEXT 索引\n\
  \n**1.** 连接到 MySQL 并选择 *forum* 数据库（如果尚未选择）。\n\n**2.** 确认 *messages* 表的类型 ![Image](img/circle-a.jpg)：\n\
  \n```sql\nSHOW TABLE STATUS\\G\n```\n\n![Image](img/07_figure_29_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 要确认表的类型，请使用 `SHOW TABLE STATUS` 命令。\n\n**`SHOW TABLE STATUS`** 查询返回数据库中每个表的大量信息，包括表的存储引擎。由于查询返回大量信息，命令以\
  \ **`\\G`** 结尾，而不是分号。这会指示 mysql 客户端以垂直列表而不是表格形式返回结果（有时更易于阅读）。如果您使用 phpMyAdmin 或其他界面，可以省略\
  \ **`\\G`**（就像可以省略结束分号一样）。\n\n要仅查找 *messages* 表的信息，可以使用查询 **`SHOW TABLE STATUS LIKE\
  \ 'messages'`**。\n\n**3.** 如果 *messages* 表不是 MyISAM 类型，请更改存储引擎：\n\n```sql\nALTER\
  \ TABLE messages ENGINE = MyISAM;\n```\n\n同样，仅当表当前不是正确类型时才需要此步骤。\n\n**4.** 向 *messages*\
  \ 表添加 **`FULLTEXT`** 索引 ![Image](img/circle-b.jpg)：\n\n\n\nALTER TABLE messages\
  \ ADD FULLTEXT (body, subject);\n\n![Image](img/07_figure_30_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ `FULLTEXT` 索引已添加到 `messages` 表中。\n\n无论索引类型如何，添加索引的语法均为 `ALTER TABLE` `tablename`\
  \ `ADD` `INDEX_TYPE index_name` `(` `columns` `)`。索引名称是可选的。\n\n此处，`body` 和 `subject`\
  \ 列获得了一个 `FULLTEXT` 索引，将在本章后面的 `FULLTEXT` 搜索中使用。\n\n***\n\n提示\n\n由于需要复杂的索引，向带有 `FULLTEXT`\
  \ 索引的表中插入记录可能会慢得多。\n\n***\n\n***\n\n提示\n\n`FULLTEXT` 搜索可成功用于简单的搜索引擎。但 `FULLTEXT`\
  \ 索引一次只能应用于单个表，因此内容存储在多个表中的更复杂的网站，将受益于使用更正式的搜索引擎。\n\n***\n\n### 执行基本 FULLTEXT 搜索\n\
  \n一旦你在一列或多列上建立了 `FULLTEXT` 索引，就可以开始使用 `WHERE` 条件中的 `MATCH`...`AGAINST` 对其进行查询：\n\
  \n```\nSELECT * FROM tablename WHERE MATCH\n(columns) AGAINST (terms)\n```\n\nMySQL\
  \ 将按数学计算出的相关性顺序返回匹配的行，就像搜索引擎一样。执行此操作时，适用以下规则：\n\n* 字符串被分解为各个关键词。\n* 长度小于四个字符的关键词将被忽略。\n\
  * 非常常见的词（称为*停用词*）将被忽略。\n* 如果超过 50% 的记录与关键词匹配，则不返回任何记录。\n\n当用户开始使用 `FULLTEXT` 搜索并不解为何未返回结果时，最后这一事实往往会让他们感到困扰。当你的表数据稀疏时，记录数不足以让\
  \ MySQL 返回*相关*结果。\n\n#### 执行 FULLTEXT 搜索\n\n**1.** 连接到 MySQL 并选择 `forum` 数据库（如果尚未选择）。\n\
  \n**2.** 充分填充 `messages` 表，重点添加较长的正文内容。\n\n同样，SQL `INSERT` 命令可从本书对应的网站下载。\n\n**3.**\
  \ 对单词 *database* 运行一个简单的 `FULLTEXT` 搜索 ![Image](img/circle-c.jpg)：\n\n```\nSELECT\
  \ subject, body FROM messages\nWHERE MATCH (body, subject)\nAGAINST('database');\n\
  ```\n\n![Image](img/07_figure_31_c.jpg)\n\n![Image](img/circle-c.jpg) 一个基本的 `FULLTEXT`\
  \ 搜索。\n\n这是一个非常简单的示例，只要 `messages` 表中至少有一条且少于 50% 的记录在其正文或主题中包含单词 \"database\"，就会返回一些结果。请注意，`MATCH`\
  \ 中引用的列必须与创建 `FULLTEXT` 索引时的列相同。在本例中，你可以使用 `body, subject` 或 `subject, body`，但不能仅使用\
  \ `body` 或仅使用 `subject` ![Image](img/circle-d.jpg)。\n\n![Image](img/07_figure_32_d.jpg)\n\
  \n![Image](img/circle-d.jpg) `FULLTEXT` 查询只能在创建 `FULLTEXT` 索引时所用的相同列或列组合上运行。使用此查询，即使\
  \ `body` 和 `subject` 的组合拥有 `FULLTEXT` 索引，尝试仅在 `subject` 上运行匹配也会失败。\n\n**4.** 运行相同的\
  \ `FULLTEXT` 搜索，同时显示相关性 ![Image](img/circle-e.jpg)：\n\n```\nSELECT subject, body,\
  \ MATCH (body,\nsubject) AGAINST('database') AS R\nFROM messages WHERE MATCH (body,\
  \ subject) AGAINST('database')\\G\n```\n\n![Image](img/07_figure_33_e.jpg)\n\n![Image](img/circle-e.jpg)\
  \ `FULLTEXT` 搜索的相关性也可以被选出。在本例中，你会看到在主题和正文中均包含单词 \"database\" 的两条记录，其相关性高于仅在主题中包含该词的记录。\n\
  \n如果将相同的 `MATCH...AGAINST` 表达式用作选定值，将返回实际相关性。正如本章前一节所示，为了使结果在 mysql 客户端中更易于查看，查询使用\
  \ `\\G` 终止，从而以垂直列表形式返回结果。\n\n**5.** 使用多个关键词运行 `FULLTEXT` 搜索 ![Image](img/circle-f.jpg)：\n\
  \n```\nSELECT subject, body FROM messages\nWHERE MATCH (body, subject)\nAGAINST('html\
  \ xhtml');\n```\n\n![Image](img/07_figure_34_f.jpg)\n\n![Image](img/circle-f.jpg)\
  \ 使用 `FULLTEXT` 搜索，你可以轻松找到包含多个关键词的消息。\n\n使用此查询，如果主题或正文包含任一单词，即可匹配。同时包含两个单词的记录将获得更高的排名。\n\
  \n***\n\n提示\n\n请记住，如果 `FULLTEXT` 搜索未返回记录，这意味着要么未找到匹配项，要么超过一半的记录都匹配。\n\n***\n\n***\n\
  \n提示\n\n为求简单起见，本节所有查询均为简单的 `SELECT` 语句。你当然可以在连接或更复杂的查询中使用 `FULLTEXT` 搜索。\n\n***\n\
  \n***\n\n提示\n\nMySQL 自带数百个预定义的停用词。这些是应用程序源代码的一部分。\n\n***\n\n***\n\n提示\n\n最小关键词长度（默认为四个字符）是一个配置设置，你可以在\
  \ MySQL 中更改它。\n\n***\n\n***\n\n提示\n\n`FULLTEXT` 搜索默认不区分大小写。\n\n***\n\n### 执行布尔 FULLTEXT\
  \ 搜索\n\n基本的 `FULLTEXT` 搜索固然不错，但使用其布尔模式可以实现更复杂的 `FULLTEXT` 搜索。为此，请在 `AGAINST` 子句中添加短语\
  \ `IN BOOLEAN MODE`：\n\n```\nSELECT * FROM tablename WHERE\nMATCH(columns) AGAINST('terms'\
  \ IN BOOLEAN\nMODE)\n```\n\n布尔模式拥有许多运算符（**表 7.3**），用于调整每个关键词的处理方式：\n\n```\nSELECT\
  \ * FROM tablename WHERE\nMATCH(columns) AGAINST('+database\n-mysql' IN BOOLEAN\
  \ MODE)\n```\n\n**表 7.3. 布尔模式运算符**\n\n![Image](img/07tab03.jpg)\n\n在该示例中，如果找到单词\
  \ *database* 且不存在 *mysql*，则匹配成功。或者，波浪号 (`~`) 用作减号的较温和形式，意味着关键词可以出现在匹配中，但此类匹配应被视为相关性较低。\n\
  \n通配符 (`*`) 匹配单词的变体，因此 `cata*` 可匹配 *catalog*、*catalina* 等。两个运算符显式声明关键词更重要 (`>`)\
  \ 或不那么重要 (`<`)。最后，你可以使用双引号搜索精确短语，并使用括号创建子表达式（只需确保使用单引号包裹关键词即可）。\n\n以下查询将查找包含短语 *Web\
  \ develop* 的记录，要求必须包含单词 *html*，而单词 *JavaScript* 会降低匹配的相关性：\n\n```\nSELECT * FROM\
  \ tablename WHERE\nMATCH(columns) AGAINST('>\"Web develop\"\n+html ~JavaScript'\
  \ IN BOOLEAN MODE)\n```\n\n使用布尔模式时，`FULLTEXT` 搜索的工作方式有几处不同：\n\n* 如果关键词前没有运算符，该词为可选，但如果存在，匹配的排名会更高。\n\
  * 即使超过 50% 的记录与搜索匹配，也会返回结果。\n* 结果*不会*自动按相关性排序。\n\n鉴于最后一点，你还需要按相关性对返回的记录进行排序，这将在下一组步骤中演示。一条与布尔搜索相同的重要规则是，最小单词长度（默认四个字符）仍然适用。因此，尝试使用加号\
  \ (`+php`) 要求匹配较短的单词仍然无效。\n\n#### 执行 FULLTEXT 布尔搜索\n\n**1.** 连接到 MySQL 并选择 `forum`\
  \ 数据库（如果尚未选择）。\n\n**2.** 运行一个简单的 `FULLTEXT` 搜索，查找 *HTML*、*XHTML* 或 *(X)HTML* ![Image](img/circle-g.jpg)：\n\
  \n```\nSELECT subject, body FROM\nmessages WHERE MATCH(body, subject)\nAGAINST('*HTML'\
  \ IN BOOLEAN MODE)\\G\n```\n\n\n\n\n![Image](img/07_figure_35_g.jpg)\n\n![Image](img/circle-g.jpg)一个简单的布尔模式\
  \ `FULLTEXT` 搜索。\n\n术语 HTML 可能以多种格式出现在消息中，包括 `HTML`、`XHTML` 或 `(X)HTML`。得益于通配符（`*`），此布尔模式查询将找到所有这些格式。\n\
  \n为了使结果更易于查看，我使用了本章前面提到的 `\\G` 技巧，它告诉 mysql 客户端垂直返回结果，而不是水平返回。\n\n**3.** 查找涉及数据库的匹配项，并强调范式\
  \ ![Image](img/circle-h.jpg)：\n\n```\nSELECT subject, body FROM messages\nWHERE\
  \ MATCH (body, subject)\nAGAINST('>\"normal form\"* +database*'\nIN BOOLEAN MODE)\\\
  G\n```\n\n![Image](img/07_figure_36_h.jpg)\n\n![Image](img/circle-h.jpg)此搜索查找两个不同关键字的变体，将其中一个的排名置于另一个之上。\n\
  \n此查询首先查找所有同时包含 `database`、`databases` 等以及 `normal form`、`normal forms` 等的记录。`database*`\
  \ 项是必需的（由加号指示），但强调的是 normal form 子句（前面带有大于号）。\n\n**4.** 重复步骤 2 中的查询，增加 XHTML 的重要性，并按相关性顺序返回结果\
  \ ![Image](img/circle-i.jpg)：\n\n```\nSELECT subject, body, MATCH(body, subject)\n\
  AGAINST('*HTML >XHTML' IN BOOLEAN MODE) AS R FROM\nmessages WHERE MATCH(body, subject)\n\
  AGAINST('*HTML >XHTML' IN BOOLEAN MODE) ORDER BY R DESC\\G\n```\n\n![Image](img/07_figure_37_i.jpg)\n\
  \n![Image](img/circle-i.jpg)这是早期查询的修改版本，它选择并按相关性对结果进行排序。\n\n这与早期的查询类似，但现在专门赋予了 `XHTML`\
  \ 额外的权重。此外，此查询还选择了计算出的相关性，并按该顺序返回结果。\n\n***\n\n提示\n\nMySQL 5.1.7 增加了另一种 `FULLTEXT`\
  \ 搜索模式：*自然语言*。如果未指定其他模式（如布尔模式），这是默认模式。\n\n***\n\n***\n\n提示\n\n`WITH QUERY EXPANSION`\
  \ 修饰符可以增加返回的结果数量。此类查询执行两次搜索并返回一个结果集。它根据初始搜索中最相关结果里找到的术语进行第二次搜索。虽然 `WITH QUERY EXPANSION`\
  \ 搜索可以找到原本不会返回的结果，但也可能返回与原始搜索词完全无关的结果。\n\n***\n\n### 优化查询\n\n一旦你拥有了一个完整且填充了数据的数据库，并且了解通常会在其上运行哪些查询，采取一些措施来优化你的查询和整个数据库就是个好主意。这样做将确保你从\
  \ MySQL（进而你的网站）获得最佳性能。\n\n首先，侧边栏重申了本书前面已建议的关键设计理念。除了这些技巧外，还有两种优化现有表的简单技术。提高 MySQL\
  \ 性能的一种方法是偶尔运行 `OPTIMIZE` 命令。此查询将清除表中任何不必要的开销，从而提高与其交互的速度：\n\n```\nOPTIMIZE TABLE\
  \ tablename\n```\n\n在通过 `ALTER` 命令更改表后，或在表上运行了大量 `DELETE` 查询后（在记录间留下虚拟空隙），运行此命令特别有益。\n\
  \n其次，你可以偶尔使用 `ANALYZE` 命令：\n\n```\nANALYZE TABLE tablename\n```\n\n执行此命令可更新表上的索引，从而改善它们在查询中的使用。每当表中存储的大量数据发生变化时（例如通过\
  \ `UPDATE` 或 `INSERT` 命令），你都可以执行它。\n\n说到查询，你现在可能已经意识到，完成同一目标通常有许多不同的方法。要找出最高效的方法，了解\
  \ MySQL 将如何确切运行该查询会有所帮助。这可以通过 `EXPLAIN` SQL 关键字来实现。解释查询是一个非常高级的主题，但我将在此介绍基础知识，你随时可以查阅\
  \ MySQL 手册或搜索网络以获取更多信息。\n\n***\n\n**数据库优化**\n\n数据库的性能主要取决于其结构和索引。创建数据库时，请尝试\n\n\
  • 选择最佳的存储引擎\n• 为每列使用尽可能小的数据类型\n• 尽可能将列定义为 `NOT NULL`\n• 使用整数作为主键\n• 审慎定义索引，选择正确的类型并将其应用于正确的列\n\
  • 如果可能，将索引限制为一定数量的字符\n• 避免创建过多的索引\n• 确保用作连接基础的列具有相同的类型，并且在字符串的情况下，使用相同的字符集和排序规则\n\
  \n***\n\n#### 解释查询\n\n**1.** 找到一个可能消耗大量资源的查询。\n\n好的候选者是执行以下任何操作的查询：\n\n• 连接两个或更多表\n\
  • 使用分组和聚合函数\n• 具有 `WHERE` 子句。\n\n例如，本章前面的此查询符合其中两个标准：\n\n```\nSELECT SUM(balance)\
  \ AS Total,\nCOUNT(account_id) AS Number, CONCAT(c.last_name, ', ', c.first_name)\
  \ AS Name\nFROM accounts AS a INNER JOIN customers AS c USING (customer_id)\nGROUP\
  \ BY (a.customer_id) ORDER BY Name;\n```\n\n**2.** 连接到 MySQL 并选择适用的数据库（如果尚未选择）。\n\
  \n**3.** 在数据库上执行查询，在前面加上 `EXPLAIN` ![Image](img/circle-a.jpg)：\n\n```\nEXPLAIN SELECT\
  \ SUM(balance) AS Total,\nCOUNT(account_id) AS Number, CONCAT(c.last_name, ', ',\
  \ c.first_name) AS Name\nFROM accounts AS a INNER JOIN customers AS c USING (customer_id)\n\
  GROUP BY (a.customer_id) ORDER BY Name\\G\n```\n\n![Image](img/07_figure_38_a.jpg)\n\
  \n![Image](img/circle-a.jpg)此 `EXPLAIN` 输出揭示了 MySQL 将如何处理该查询。\n\n如果你使用 mysql 客户端，你会发现使用结尾的\
  \ `\\G` 技巧（代替分号）也有助于使输出更易读。输出本身将包含查询中使用的每个表的一行信息。表按 MySQL 执行查询时必须访问它们的顺序列出。\n\n\
  我将讲解输出的关键部分，但首先，对于大多数 `SELECT` 查询，`select_type` 值应为 `SIMPLE`，如果查询涉及 `UNION` 或子查询，则会有所不同（有关\
  \ `UNION` 或子查询的更多信息，请参阅 MySQL 手册）。\n\n**4.** 查看 `type` 值。\n\n**表 7.4** 列出了从最好到最坏的不同\
  \ type 值。MySQL 手册详细讨论了每个值的含义，但首先要明白 `eq_ref` 是你常见的最佳值，而 `ALL` 是最差的。`eq_ref` 类型意味着索引被正确使用且正在进行等值比较。\n\
  \n**表 7.4. 连接类型**\n\n![Image](img/07tab04.jpg)\n\n请注意，有时你会看到 `ALL`，因为表中记录很少，在这种情况下\
  \ MySQL 扫描表比使用索引更高效。对于 ![Image](img/graycircle-a.jpg) 来说，这大概是这种情况，因为 `accounts`\
  \ 表只有四条记录。\n\n**5.** 查看 `possible_keys` 值。\n\n`possible_keys` 值指示存在哪些索引是 MySQL 可能用来查找该表中对应行的。如果此处为\
  \ `NULL` 值，则没有索引是 MySQL 认为有用的。因此，你可能需要在该表的相关列上创建索引。\n\n**6.** 查看 `key`、`key_len`\
  \ 和 `ref` 值。\n\n\n\n\n`possible_keys` 指示可能可用的索引，而 `key` 则显示 MySQL *实际将使用* 哪个索引来执行该查询。有时你会在这里发现一个未在\
  \ `possible_keys` 中列出的值，这没问题。如果没有使用任何索引，那几乎总是表示存在问题，可以通过添加索引或修改查询来解决。\n\n`key_len`\
  \ 值表示 MySQL 所用索引的长度（即大小）。通常越短越好，但不必过分担心。\n\n`ref` 列指示 MySQL 将哪些列与 `key` 列中指定的索引进行了比较。\n\
  \n### 7. 查看 `rows` 值。\n\n此列提供了一个估算值，即 MySQL 认为需要检查表中多少行。同样，越低越好。事实上，在连接查询中，可以通过将所有\
  \ `rows` 值相乘来粗略估算效率。\n\n在连接查询中，待检查的行数通常应从多到少，如 ![Image](img/circle-b.jpg) 所示。\n\n\
  ![Image](img/07_figure_39_b.jpg)\n\n![Image](img/circle-b.jpg) 另一个查询的解释，这是一个跨三个表的连接。\n\
  \n### 8. 查看 `Extra` 值。\n\n最后，此列报告关于 MySQL 将如何执行查询的任何额外信息，这些信息可能很有用。你不希望在这里看到的两个短语是：`Using\
  \ filesort` 和 `Using temporary`。两者都意味着完成查询需要额外的步骤（例如，`GROUP BY` 子句通常要求 MySQL 创建一个临时表）。\n\
  \n如果 `Extra` 显示类似 `Impossible X` 或 `No matching Y` 的内容，这意味着你的查询包含始终为 false 的子句，可以将其移除。\n\
  \n### 9. 修改你的表或查询并重复执行！\n\n如果输出表明查询执行方式存在问题，你可以考虑执行以下任意操作：\n\n- 更改查询的细节\n- 更改表列的属性\n\
  - 添加或修改表的索引\n\n请记住，解释的有效性部分取决于涉及表中的行数（如步骤 4 所述，对于小表 MySQL 可能会跳过索引）。还要明白，并非所有查询都可修复。简单的\
  \ `SELECT` 查询甚至连接有时可以改进，但考虑到 MySQL 为聚合数据必须执行的所有操作，几乎无法提高 `GROUP BY` 查询的效率。\n\n---\n\
  \n**提示**\n\n`EXPLAIN EXTENDED` 命令提供关于查询的更多详细信息：\n\n```\nEXPLAIN EXTENDED SELECT...\n\
  ```\n\n---\n\n**提示**\n\n通过启用某些 MySQL 日志功能也可以发现有问题的查询，但这需要对 MySQL 服务器拥有管理权限。\n\n\
  ---\n\n**提示**\n\n就性能而言，MySQL 处理更多、更小的表比处理更少、更大的表效果更好。也就是说，规范化的数据库结构应始终是首要目标。\n\n\
  ---\n\n**提示**\n\n在 MySQL 术语中，“大型”数据库拥有数千个表和数百万行。\n\n---\n\n#### 执行事务\n\n*数据库事务*\
  \ 是在单个会话期间运行的一系列查询。\n\n例如，你可能向一个表插入一条记录，向另一个表插入另一条记录，并可能运行一个更新。如果不使用事务，每个单独的查询会立即生效且无法撤销（查询默认会自动提交）。使用事务，你可以设置开始和结束点，然后根据需要执行或撤销这些点之间的所有查询（例如，如果一个查询失败，所有查询都可以撤销）。\n\
  \n商业交互通常需要事务，即使是像从我的银行账户向你的账户转账 100 美元这样基本的操作。看似简单的过程实际上包含几个步骤：\n\n- 确认我的账户有 100\
  \ 美元。\n- 将我的账户减少 100 美元。\n- 验证减少操作。\n- 将你的账户金额增加 100 美元。\n- 验证增加操作是否成功。\n\n如果任何一步失败，所有步骤都应撤销。例如，如果无法将钱存入你的账户，应将其退回我的账户，直到整个事务能够完成。\n\
  \n执行事务的能力取决于所用存储引擎的特性。要在 MySQL 中执行事务，必须使用 InnoDB 表类型（或存储引擎）。\n\n要在 mysql 客户端中开始一个新事务，请输入\n\
  \n```\nSTART TRANSACTION;\n```\n\n事务开始后，你现在可以运行查询。完成后，可以输入 `COMMIT` 使所有查询生效，或输入\
  \ `ROLLBACK` 撤销所有查询的效果。\n\n在你提交或回滚查询后，事务视为完成，MySQL 返回 *autocommit*（自动提交）模式。这意味着你执行的任何查询都会立即生效。要开始另一个事务，只需输入\
  \ `START TRANSACTION`。\n\n重要的是要知道某些类型的查询无法回滚。具体来说，创建、修改、截断（清空）或删除表，或创建或删除数据库的查询无法撤销。此外，使用此类查询会导致提交并结束当前事务。\n\
  \n其次，你应该明白事务特定于每个连接。因此，通过 mysql 客户端连接的一个用户拥有的事务与另一个 mysql 客户端用户的事务不同，两者也都不同于连接的\
  \ PHP 脚本。\n\n最后，*你无法使用 phpMyAdmin 执行事务*。通过 phpMyAdmin 的 SQL 窗口或标签提交的每个查询都是一个独立且完整的事务，无法通过后续提交来撤销。\n\
  \n考虑到这一点，让我们使用 banking 数据库通过事务来执行前面提到的任务。在第 19 章 Chapter 19 “示例—电子商务”中，事务将通过 PHP\
  \ 脚本运行。\n\n#### 执行事务\n\n**1.** 连接到 MySQL 并选择 *banking* 数据库。\n\n**2.** 开始一个事务并显示表的当前值\
  \ ![Image](img/circle-a.jpg)：\n\n```\nSTART TRANSACTION;\n\nSELECT * FROM accounts;\n\
  ```\n\n![Image](img/07_figure_40_a.jpg)\n\n![Image](img/circle-a.jpg) 事务已开始，显示现有的表记录。\n\
  \n**3.** 从 David Sedaris（或任意用户）的支票账户中减去 100 美元。\n\n```\nUPDATE accounts\nSET balance\
  \ = (balance-100)\nWHERE account_id=2;\n```\n\n使用 `UPDATE` 查询、简单的数学运算和 `WHERE` 条件，你可以从余额中减去\
  \ 100。虽然 MySQL 会指示有一行受影响，但该效果在事务提交前并非永久生效。\n\n**4.** 向 Sarah Vowell 的支票账户增加 100\
  \ 美元：\n\n```\nUPDATE accounts\nSET balance = (balance+100)\nWHERE account_id=1;\n\
  ```\n\n这与步骤 3 相反，就像将 100 美元从一个人转账给另一个人。\n\n**5.** 确认结果 ![Image](img/circle-b.jpg)：\n\
  \n```\nSELECT * FROM accounts;\n```\n\n![Image](img/07_figure_41_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ 执行了两个 `UPDATE` 查询并查看结果。\n\n正如图中所示，一个余额比原来多 100，另一个比原来少 100 ![Image](img/graycircle-a.jpg)。\n\
  \n**6.** 回滚事务：\n\n```\nROLLBACK;\n```\n\n为了演示事务如何被撤销，让我们撤销这些查询的效果。`ROLLBACK` 命令将数据库恢复到开始事务前的状态。该命令也会终止事务，使\
  \ MySQL 返回自动提交模式。\n\n**7.** 确认结果 ![Image](img/circle-c.jpg)：\n\n```\nSELECT * FROM\
  \ accounts;\n```\n\n![Image](img/07_figure_42_c.jpg)\n\n![Image](img/circle-c.jpg)\
  \ 由于使用了 `ROLLBACK` 命令，`UPDATE` 查询的潜在效果被忽略。\n\n![Image](img/07_figure_43_d.jpg)\n\
  \n![Image](img/circle-d.jpg) 调用 `COMMIT` 命令使事务的效果永久生效。\n\n\n\n查询应显示表的内容，即其原始状态。\n\
  \n**8.** 重复步骤 2 至 4。\n\n要查看事务提交时会发生什么，将再次运行这两条 `UPDATE` 查询。但请务必先启动事务，否则查询将自动生效！\n\
  \n**9.** 提交事务并确认结果：\n\n```\nCOMMIT;\nSELECT * FROM accounts;\n```\n\n一旦输入 `COMMIT`，整个事务即为永久性的，意味着任何更改现已生效。`COMMIT`\
  \ 也会结束事务，使 MySQL 返回自动提交模式。\n\n***\n\n提示\n\n事务的一大特性是，它们能在发生随机事件（如服务器崩溃）时提供保护。要么事务完全执行，要么所有更改都被忽略。\n\
  \n***\n\n提示\n\n要改变 MySQL 的自动提交特性，请输入\n\n```\nSET AUTOCOMMIT=0;\n```\n\n然后你就不需要输入\
  \ `START TRANSACTION`，且在你输入 `COMMIT`（或使用 `ALTER`、`CREATE` 等查询）之前，没有任何查询会是永久性的。\n\
  \n***\n\n提示\n\n你可以在事务中创建*保存点*：\n\n```\nSAVEPOINT savepoint_name;\n```\n\n然后你可以回滚到该点：\n\
  \n```\nROLLBACK TO SAVEPOINT savepoint_name;\n```\n\n***\n\n### 数据库加密\n\n到目前为止，已在数据库中使用\
  \ `SHA1()` 函数实现了伪加密。在 *sitename* 和 *forum* 数据库中，用户的密码在通过 `SHA1()` 运算后存储。虽然以这种方式使用此函数完全没问题（且相当常见），但该函数并不提供*真正的*加密：`SHA1()`\
  \ 函数返回的是一个值的*表现形式*（称为*哈希值*），而非该值的加密版本。通过存储某些数据的哈希版本，稍后仍可进行比较（如登录时），但无法从数据库中检索原始数据。如果你需要以受保护的方式存储数据，同时仍能在稍后某个时间点以原始形式查看数据，则需要其他\
  \ MySQL 函数。\n\nMySQL 内置了多个加密和解密函数。如果你要求以可解密的加密形式存储数据，则需使用 `AES_ENCRYPT()` 和 `AES_DECRYPT()`。`AES_ENCRYPT()`\
  \ 函数被认为是最安全的加密选项。\n\n这些函数接受两个参数：被加密或解密的数据，以及一个*盐值*参数。盐值参数是一个有助于随机化加密的字符串。让我们先看看加密和解密函数，然后我再回到盐值的问题。\n\
  \n要向表中添加记录并同时加密数据，查询可能如下所示：\n\n```\nINSERT INTO users (username, pass)\nVALUES ('troutster',\
  \ AES_ENCRYPT('mypass', 'nacl19874salt!'))\n```\n\n`AES_ENCRYPT()` 函数返回的加密数据将为二进制格式。要在表中存储该数据，该列必须定义为二进制类型之一（例如\
  \ `VARBINARY` 或 `BLOB`）。\n\n要针对刚插入的记录运行登录查询（将提交的用户名和密码与数据库中的进行匹配），你可以编写：\n\n```\n\
  SELECT * FROM users WHERE\nusername='troutster' AND\nAES_DECRYPT(pass, 'nacl19874salt!')\
  \ = 'mypass'\n```\n\n这等同于：\n\n```\nSELECT * FROM users WHERE\nusername = 'troutster'\
  \ AND\nAES_ENCRYPT('mypass', 'nacl19874salt!') = pass\n```\n\n回到*盐值*的问题，加密和解密必须使用完全相同的盐值，这意味着盐值也必须存储在某处。与你可能想的相反，将盐值存储在数据库中实际上是安全的，甚至可以与加盐数据存储在同一行中。这是因为盐值的目的是使加密过程更难被破解（具体来说，是针对“彩虹”攻击）。此类攻击是远程进行的，采用暴力破解。反之，如果有人能看到你数据库中存储的所有内容，你将有更大的问题需要担心（即你的所有数据都已泄露）。\n\
  \n最后，为了从“给存储数据加盐”中获得最大收益，每条存储的数据都应使用唯一的盐值，且盐值越长越好。\n\n为了将所有这些结合起来，让我们向 *banking.customers*\
  \ 表添加 PIN 码列和盐值列，然后存储每位客户 PIN 码的加密版本。\n\n#### 加密和解密数据\n\n**1.** 访问 MySQL 并选择 *banking*\
  \ 数据库：\n\n**2.** 向 *customers* 表添加两个新列 ![Image](img/circle-a.jpg)：\n\n```\nALTER\
  \ TABLE customers ADD COLUMN pin VARBINARY(16) NOT NULL;\nALTER TABLE customers\
  \ ADD COLUMN nacl CHAR(20) NOT NULL;\n```\n\n![Image](img/07_figure_44_a.jpg)\n\n\
  ![Image](img/circle-a.jpg) 向 *customers* 表添加了两列。\n\n第一列 *pin* 将存储用户 PIN 码的加密版本。由于\
  \ `AES_ENCRYPT()` 返回一个长度为 16 字符的二进制值，因此 *pin* 列被定义为 `VARBINARY(16)`。第二列存储盐值，其为一个长度为\
  \ 20 字符的字符串。\n\n**3.** 更新第一位客户的 PIN 码 ![Image](img/circle-b.jpg)：\n\n```\nUPDATE\
  \ customers\nSET nacl = SUBSTRING(MD5(RAND()), -20)\nWHERE customer_id=1;\nUPDATE\
  \ customers\nSET pin=AES_ENCRYPT(1234, nacl)\nWHERE customer_id=1;\n```\n\n![Image](img/07_figure_45_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 使用加密函数更新记录以保护 PIN 码。\n\n第一条查询更新客户记录，向 *nacl* 列添加一个盐值。该随机值通过将\
  \ `MD5()` 函数应用于 `RAND()` 函数的输出来获得。这将创建一个长度为 32 字符的字符串，例如 *4b8bb06aea7f3d162ad5b4d83687e3ac*。然后使用\
  \ `SUBSTRING()` 从该字符串中取出最后 20 个字符。\n\n第二条查询使用已存储的 *nacl* 值作为盐值，存储客户的 PIN 码——1234。\n\
  \n**4.** 以未加密形式检索 PIN 码 ![Image](img/circle-c.jpg)：\n\n```\nSELECT customer_id,\
  \ AES_DECRYPT(pin,\nnacl) AS pin FROM customers\nWHERE customer_id=1;\n```\n\n![Image](img/07_figure_46_c.jpg)\n\
  \n![Image](img/circle-c.jpg) 记录已被检索，并在过程中解密了 PIN 码。\n\n此查询返回 *customer_id* 为 1 的客户的解密\
  \ PIN 码。任何使用 `AES_ENCRYPT()` 存储的值，只要使用相同的盐值，都可以使用 `AES_DECRYPT()` 进行检索（和匹配）。\n\n\
  **5.** 在不使用解密的情况下查看客户记录 ![Image](img/circle-d.jpg)：\n\n```\nSELECT * FROM customers\n\
  WHERE customer_id=1;\n```\n\n![Image](img/07_figure_47_d.jpg)\n\n![Image](img/circle-d.jpg)\
  \ 加密数据以不可读格式存储（此处为二进制数据字符串）。\n\n正如你在图中所见，PIN 码的加密版本是不可读的。\n\n***\n\n提示\n\n根据经验法则，对于永远不需要查看的信息（如密码，或许还有用户名），请使用\
  \ `SHA1()`。对于需要保护但稍后可能需要查看的信息（如信用卡信息、社会安全号码、地址等），请使用 `AES_ENCRYPT()`。\n\n***\n\n\
  提示\n\n顺便提醒一下，不存储信用卡号和其他高风险数据始终是最安全的选择。\n\n***\n\n提示\n\n`SHA2()` 函数是对 `SHA1()` 的改进，哈希数据时应优先使用它。我之所以在本书中未使用它，是因为\
  \ `SHA2()` 需要 MySQL 5.5.5 或更高版本。\n\n***\n\n提示\n\n相同的加盐技术可应用于 `SHA1()`、`SHA2()` 和其他函数。\n\
  \n***\n\n提示\n\n请注意，发送到 MySQL 服务器或从其接收的数据可能被拦截和查看。通过使用 SSL 连接连接 MySQL 数据库，可以获得更好的安全性。\n\
  \n***\n\n### 复习与实践\n\n\n\n如果您对复习题或练习题有任何疑问，请访问本书的支持论坛（**[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)**）。\n\
  \n#### 复习\n\n*   连接（Join）的两种主要类型是什么？\n*   为什么在连接中经常使用别名？\n*   为什么在连接中使用 `table.column`\
  \ 语法通常被认为是必要的，至少是最佳实践？\n*   连接中表的顺序对外连接有什么影响？\n*   如何创建自连接？\n*   聚合函数有哪些？\n*   `DISTINCT`\
  \ 关键字对聚合函数有什么影响？`GROUP BY` 对聚合函数有什么影响？\n*   执行 `FULLTEXT` 搜索需要什么类型的索引？需要什么类型的存储引擎？\n\
  *   在 mysql 客户端中，用 `\\G` 代替分号结束 `SELECT` 查询会有什么影响？\n*   `IN BOOLEAN MODE FULLTEXT`\
  \ 搜索与标准 `FULLTEXT` 搜索有何不同？\n*   可以使用哪些命令来提高表的性能？\n*   如何检查查询的效率？\n*   为什么 `forum`\
  \ 数据库不支持事务？\n*   如何开始一个事务？如何撤销进行中事务的效果？如何使当前事务的效果永久生效？\n*   存储 `AES_ENCRYPT()` 函数输出需要什么类型的列类型？\n\
  *   加密过程中使用的盐（salt）有哪些重要标准？\n\n#### 练习\n\n*   为 `forum` 和 `banking` 数据库想出更多连接示例。执行内连接、外连接以及跨三张表的连接。\n\
  *   如果您对 `UNION` SQL 命令或子查询感兴趣，请查阅 MySQL 手册页。\n*   在 `banking` 或 `forum` 数据库上执行更多分组练习。\n\
  *   在 `forum` 数据库上练习运行 `FULLTEXT` 搜索。\n*   检查其他查询以查看结果。\n*   阅读 MySQL 手册页及其他在线教程，了解解释查询和优化表。\n\
  *   进一步尝试事务。\n*   研究密码加盐和彩虹攻击相关主题以了解更多。\n\n## 第 8 章 错误处理与调试\n\n### 本章内容\n\n*   错误类型与基础调试\n\
  *   显示 PHP 错误\n*   在 PHP 中调整错误报告\n*   创建自定义错误处理程序\n*   PHP 调试技巧\n*   SQL 和 MySQL\
  \ 调试技巧\n*   复习与练习\n\n如果您正在按顺序学习本书（这将是最好的方式），接下来要学习的主题是如何将 PHP 和 MySQL 结合使用。然而，这一过程无疑会产生错误，而这些错误可能很难调试。因此，在进入新概念之前，接下来的几页将解决程序员的噩梦：**错误**。随着经验的积累，您犯的错误会减少，并学会自己的调试方法，但初学者可以使用大量工具和技术来帮助简化学习过程。\n\
  \n本章有三条主线。一是了解开发动态网站时可能发生的各种错误及其可能的原因。二是以循序渐进的形式教授多种调试技术。最后，您将看到以尽可能优雅的方式处理发生的错误的不同技术。\n\
  \n### 错误类型与基础调试\n\n使用 PHP 和 MySQL 开发 Web 应用程序时，您可能会在四种或更多技术中遇到潜在的 Bug。您可能会遇到 HTML\
  \ 问题、PHP 问题、SQL 错误或 MySQL 错误。修复任何 Bug 的第一步是找到其源头。\n\nHTML 问题通常破坏性最小，也最容易发现。当您的布局完全乱套时，通常就知道出问题了。下一节将讨论捕获和修复这些问题的一些步骤，以及通用的调试提示。\n\
  \nPHP 错误是您最常看到的错误，因为这种语言将成为您应用程序的核心。PHP 错误分为三大类：\n\n*   语法错误\n*   运行时错误\n*   逻辑错误\n\
  \n语法错误最常见，也最容易修复。如果您只是遗漏了一个分号，就会看到它们。此类错误会阻止脚本执行，如果 PHP 配置中开启了 `display_errors`，PHP\
  \ 将显示错误，包括 PHP 认为出错的行号 ![Image](img/circle-a.jpg)。如果 `display_errors` 关闭，您将看到一张空白页。（您将在本章后面了解更多关于\
  \ `display_errors` 的信息。）\n\n![Image](img/08_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 解析错误——您到目前为止可能已经见过很多次了——是最常见的 PHP 错误类型，尤其是对于初学者程序员。\n\n运行时错误包括那些不会阻止 PHP 脚本执行（像解析错误那样）但会阻止脚本完成其预期功能的错误。示例包括使用错误数量或类型的参数调用函数。发生这些错误时，PHP\
  \ 通常会显示一条指示确切问题的消息 ![Image](img/circle-b.jpg)（同样假设 `display_errors` 已开启）。\n\n![Image](img/08_figure_02_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 错误使用函数（使用不当的参数调用）将在脚本执行期间产生错误。\n\n***\n\n#### 正确的心态\n\
  \n在深入探讨之前，先谈谈错误：它们发生在我们最优秀的人身上。即使是本书的作者，在 Web 开发工作中也会遇到足够多的错误（但请放心，本书中的代码应该没有 Bug）。认为您会达到一个永远不出错的技能水平是痴人说梦，但有技术可以将错误最小化，而知道如何快速捕获、处理和修复错误本身就是一项主要技能。所以尽量不要因为犯错而沮丧；相反，要沉浸在您正在成为一名更好的调试员的知识中！\n\
  \n***\n\n最后一类错误——逻辑错误——实际上是最糟糕的，因为 PHP 不一定会向您报告它们。这些是彻头彻尾的 Bug：不明显且不会阻止脚本执行的问题。解决所有这些\
  \ PHP 错误的技巧将在几页后演示。\n\nSQL 错误通常是语法问题，当您尝试在 MySQL 中运行查询时会被报告。例如，我犯这个错误太多次了 ![Image](img/circle-c.jpg)：\n\
  \n```\nDELETE * FROM tablename\n```\n\n![Image](img/08_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg)\
  \ MySQL 将报告 SQL 命令语法中发现的任何错误。\n\n该语法完全错误，这是与 `SELECT` 语法（`SELECT * FROM` `tablename`）混淆了。正确的语法是：\n\
  \n```\nDELETE FROM tablename\n```\n\n同样，当您有 SQL 错误时，MySQL 会发出警报，因此这些错误不难发现和修复。对于现代网站，棘手的是您并不总是拥有静态查询，而是经常由\
  \ PHP 动态生成查询。在这种情况下，如果存在 SQL 语法问题，问题很可能出在您的 PHP 代码中。\n\n\n\n### 调试 MySQL 和动态网站\n\
  \n除了报告 SQL 错误外，MySQL 本身也有错误需要考虑。无法访问数据库是常见错误之一，也是致命的阻碍。当你误用 MySQL 函数或在连接中模糊引用列时，也会看到错误。同样，MySQL\
  \ 会以具体细节报告任何此类错误。请记住，当查询未返回预期记录或未产生预期结果时，那不是 MySQL 或 SQL 错误，而是逻辑错误。在本章末尾，你将看到如何解决\
  \ SQL 和 MySQL 问题。\n\n无法连接到 MySQL 服务器或特定数据库是常见的 MySQL 错误。\n\n但在你能跑之前得先学会走，因此下一节将介绍调试动态网站的基础知识，从你应该进行的基本检查以及如何修复\
  \ HTML 问题开始。\n\n### 基本调试步骤\n\n这第一系列步骤可能看起来显而易见，但就调试而言，遗漏其中任何一步都会导致低效且极其令人沮丧的调试体验。趁此机会，我应该提到最好的通用调试建议是：\n\
  \n> 当你感到沮丧时，离开电脑！\n\n我解决过的几乎所有最棘手的问题，都是通过休息一下、清空大脑、然后以全新的眼光回到代码中来解决的。本书配套论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）的读者也经常发现这点。当你沮丧时试图强行推进，往往会让事情变得更糟。糟糕得多。\n\
  \n### 开始调试任何问题\n\n*   **确保你正在运行正确的页面。**\n\n    你试图修复一个问题，但无论做什么都无济于事，这种情况太常见了。原因是：你实际上编辑的页面并非你以为的那个页面。因此请验证正在执行的文件的名称和位置，是否与你正在编辑的文件相符。在这方面，使用一站式\
  \ IDE（如 Adobe Dreamweaver [www.adobe.com/go/dreamweaver](http://www.adobe.com/go/dreamweaver)）是一个优势。\n\
  \n*   **确保你已保存最新更改。**\n\n    未保存的文档将继续保留编辑前的问题（因为编辑未生效）。我喜欢 TextMate ([www.macromates.com](http://www.macromates.com))\
  \ 文本编辑器的众多原因之一，就是它会在应用程序失去焦点时自动保存每个文档。\n\n*   **确保通过 URL 运行所有 PHP 页面。**\n\n    因为\
  \ PHP 通过 Web 服务器（Apache、IIS 等）工作，运行任何 PHP 代码都要求你通过 URL 访问页面（`http://www.example.com/page.php`\
  \ 或 `http://localhost/page.php`）。如果你双击 PHP 页面在浏览器中打开它（或使用浏览器的“文件 > 打开”选项），你将看到 PHP\
  \ 代码，而不是执行结果。如果你不通过 URL 加载 HTML 页面（这本身可行），但随后将表单提交给 PHP 页面，也会发生这种情况。\n\n    PHP\
  \ 代码只有通过 URL 运行时才会被执行。这意味着提交到 PHP 页面的表单也必须通过 `http://` 加载。\n\n*   **了解你正在运行的 PHP\
  \ 和 MySQL 版本。**\n\n    某些问题特定于特定版本的 PHP 或 MySQL。例如，某些函数是在 PHP 后期版本中添加的，而 MySQL 在\
  \ 4、4.1 和 5 版本中增加了重要新功能。运行 `phpinfo()` 脚本（示例见附录 A“安装”）并打开 mysql 客户端会话以确定此信息。phpMyAdmin\
  \ 通常也会报告相关版本（但不要将 phpMyAdmin 的版本（可能是 3.*something*）与 PHP 或 MySQL 的版本混淆）。\n\n   \
  \ `phpinfo()` 脚本是你调试的最佳工具之一，它会告知你 PHP 版本及其配置方式。\n\n    当你连接到 MySQL 服务器时，它会让你知晓正在使用的版本号。\n\
  \n    我认为所用版本是如此重要、基础的信息，以至于我通常不会协助寻求帮助的人，直到他们提供此信息！\n\n*   **了解你正在运行的 Web 服务器。**\n\
  \n    同样，某些问题和功能因你的 Web 服务应用程序——Apache、IIS 或 Abyss——而异。你应该知道你使用的是哪一个及其版本，这在你安装应用程序时就已知晓。如果你使用虚拟主机，托管公司可以提供此信息。\n\
  \n*   **尝试在不同的 Web 浏览器中执行页面。**\n\n    每个 Web 开发人员都应该拥有并使用至少两个 Web 浏览器。如果你在不同浏览器中测试页面，就能看出问题是出在脚本上，还是特定浏览器上。通常，只有\
  \ HTML 和 CSS 问题会在切换浏览器时出现（或消失）；PHP 错误极少针对特定浏览器，更不用说 MySQL 或 SQL 错误了。\n\n*   **如果可能，尝试使用不同的\
  \ Web 服务器、PHP 版本和/或 MySQL 版本执行页面。**\n\n    PHP 和 MySQL 错误有时源于特定服务器的特定配置和版本。如果某事在一台服务器上有效而在另一台上无效，则说明脚本本身没有错。接下来就是使用\
  \ `phpinfo()` 脚本查看服务器设置有何不同。\n\n***\n\n**提示**\n\n如果休息一下是你感到沮丧时该做的一件事，那么这里是你*不该*做的事：向作者、新闻组、邮件列表或其他任何人发送一封或多封惊慌失措且挑剔的邮件。就向陌生人寻求免费帮助而言，耐心和客套能带来好得多、快得多的结果。\n\
  \n***\n\n**提示**\n\n顺便说一句，我强烈建议*不要*随意猜测解决方案。我见过太多人因在不完全理解尝试更改的作用的情况下盲目尝试，而让事情变得更加复杂。\n\
  \n***\n\n**提示**\n\n还有另一类不同的错误可归类为*用法*错误：即当网站用户的行为不符合你的预期时出现的问题。作为一条金科玉律，编写代码时应确保即使用户什么都不对、或全做错也不会崩溃！换句话说，不要做任何假设。Doug\
  \ Linder 有一句名言适用于此：“优秀的程序员是在过单行道前也会向左右张望的人。”\n\n***\n\n### 调试 HTML\n\n调试 HTML 相对容易。源代码非常易获取，大多数问题显而易见，且修复\
  \ HTML 的尝试通常不会让事情变得更糟（PHP 则可能）。尽管如此，仍有一些基本步骤应遵循以查找和修复 HTML 问题。\n\n### 调试 HTML 错误\n\
  \n*   **检查源代码。**\n\n    如果你遇到 HTML 问题，几乎总是需要检查页面的源代码来找到它。查看源代码的方式取决于所用浏览器，但通常只需使用类似“查看\
  \ > 页面源代码”或“查看 > 源代码”的选项。\n\n*   **使用验证工具。**\n\n    验证工具（如 [`validator.w3.org`](http://validator.w3.org)）非常适合查找标签不匹配、表格损坏和其他问题。\n\
  \n\n\n\n### 使用 Firefox\n\n我并不想引发关于哪个 Web 浏览器最好的讨论，而且由于 Internet Explorer（至今仍然！）是使用最多的浏览器，你最终需要使用它进行测试，但我个人认为\
  \ Firefox（可从 **[www.mozilla.com](http://www.mozilla.com)** 免费获取）是 Web 开发者的最佳 Web\
  \ 浏览器。Firefox 提供了其他浏览器没有的可靠性和调试功能。如果你想在日常浏览中坚持使用 IE 或 Safari，那随你便，但进行 Web 开发时，请使用\
  \ Firefox。\n\n### 使用 Firefox 的插件小工具\n\n![Image](img/08_figure_09_i.jpg)\n\nFirefox\
  \ 的 Web Developer 小工具提供了快速访问许多有用工具的途径。\n\n除了是一个很棒的 Web 浏览器之外，广受欢迎的 Firefox 浏览器拥有大量\
  \ Web 开发者会欣赏的功能。此外，你可以通过安装任何可用的免费小工具来扩展 Firefox 的功能。特别是 Web Developer 小工具，它提供了快速访问很棒工具的途径，例如显示表格边框、显示\
  \ CSS、验证页面等。我也经常使用这些插件：Firebug、DOM Inspector 和 HTML Validator 等。\n\n### 在另一个浏览器中测试页面\n\
  \nPHP 代码通常与浏览器无关，这意味着无论客户端是什么，你都会得到一致的结果。HTML 则不然。有时特定浏览器的怪癖会影响渲染的页面。在另一个浏览器中运行同一个页面是判断这是\
  \ HTML 问题还是浏览器怪癖的最简单方法。\n\n***\n\n> **Tip**\n>\n> 解决任何类型问题的第一步是了解导致问题的原因。在调试时，请记住每种技术——HTML、PHP、SQL\
  \ 和 MySQL——所扮演的角色。如果你的页面看起来不对劲，那是 HTML 问题。如果你的 HTML 是由 PHP 动态生成的，这仍然是 HTML 问题，但你需要处理\
  \ PHP 代码来修正它。\n\n***\n\n### 书籍勘误\n\n如果你遵循本书中的示例操作但某些东西无法正常工作，你应该怎么做？\n\n**1.** 将你的代码或步骤与书中的内容仔细核对。\n\
  \n**2.** 使用书后的索引查看我是否在前面的页面中引用过某个脚本或函数（你可能错过了重要的用法规则或提示）。\n\n**3.** 查阅 PHP 手册中特定函数的说明，确认该函数在你的\
  \ PHP 版本中是否可用，并验证该函数的用法。\n\n**4.** 查看书籍的勘误页面（通过支持网站 **[www.LarryUllman.com](http://www.LarryUllman.com)**），看看代码中是否存在已被报告的错误。不过暂时不要在那里发布你的具体问题！\n\
  \n**5.** 三次检查你的代码，并使用本章概述的所有调试技术。\n\n**6.** 搜索书籍的支持论坛，看看其他人是否遇到过这个问题，以及是否已经确定了解决方案。\n\
  \n**7.** 如果一切都失败了，使用书籍的支持论坛寻求帮助。提问时，请务必包含所有相关信息（PHP 版本、MySQL 版本、你采取的调试步骤及结果等）。\n\
  \n***\n\n### 显示 PHP 错误\n\n当出现问题时，PHP 提供了非常有用且描述性强的错误消息。不幸的是，PHP 在使用默认配置运行时不会显示这些错误。这种策略对于正式服务器是合理的，因为你不希望最终用户看到\
  \ PHP 特定的错误消息，但这也让初学者感到更加困惑。要查看 PHP 的错误，你必须开启 `display_errors` 指令，可以在单个脚本中开启，也可以针对整个\
  \ PHP 配置开启。\n\n要在脚本中开启 `display_errors`，请使用 **`ini_set()`** 函数。该函数接受一个指令名称和该指令应具有的设置作为参数：\n\
  \n```php\nini_set('display_errors', 1);\n```\n\n在脚本中包含此行将为该脚本开启 `display_errors`。唯一的缺点是，如果你的脚本有语法错误导致完全无法运行，你仍然会看到空白页面。要让整个服务器的\
  \ PHP 显示错误，你需要编辑其配置，这在 附录 A 的“配置 PHP”一节中讨论。\n\n#### 开启 display_errors\n\n**1.**\
  \ 在文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 **`display_errors.php`** (**脚本 8.1**)：\n\n```html\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >  \n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\"> \
  \ \n<head>  \n  <meta http-equiv=\"Content-type\" content=\"text/html; charset=iso-8859-1\"\
  \ />  \n  <title>Displaying Errors</title>  \n</head>  \n<body>  \n<h2>Testing Display\
  \ Errors</h2>  \n<?php # Script 8.1 - display_errors.php\n```\n\n**脚本 8.1.** `ini_set()`\
  \ 函数可用于告诉 PHP 脚本显示可能发生的任何错误。\n\n***\n\n```html\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML  \n       1.0 Transitional//EN\"  \n2          \"http://www.w3.org/TR/xhtml1/DTD/\
  \  \n             xhtml1-transitional.dtd\">  \n3  <html xmlns=\"http://www.w3.org/1999/\
  \  \n       xhtml\" xml:lang=\"en\" lang=\"en\">  \n4  <head>  \n5      <meta http-equiv=\"\
  Content-Type\"  \n            content=\"text/html; charset=utf-8\" />  \n6     \
  \ <title>Displaying Errors</title>  \n7  </head>  \n8  <body>  \n9  <h2>Testing\
  \ Display Errors</h2>  \n10  <?php # Script 8.1 - display_errors.php  \n11  \n12\
  \  // Show errors:  \n13  ini_set('display_errors', 1);  \n14  \n15  // Create errors:\
  \  \n16  foreach ($var as $v) {}  \n17  $result = 1/0;  \n18  \n19  ?>  \n20  </body>\
  \  \n21  </html>\n```\n\n***\n\n**2.** 在初始 PHP 标签之后，添加：\n\n```php\nini_set('display_errors',\
  \ 1);\n```\n\n从脚本的这一点开始，发生的任何错误都将被显示。\n\n**3.** 制造一些错误：\n\n```php\nforeach ($var\
  \ as $v) { }  \n$result = 1/0;\n```\n\n要测试 `display_errors` 设置，脚本至少需要有一个错误。第一行甚至不尝试做任何事，但保证会导致错误。这里实际上有两个问题：首先，引用了一个不存在的变量（**`$var`**）；其次，在\
  \ **`foreach`** 循环中将非数组（**`$var`**）当作数组使用。\n\n第二行是经典的除以零错误，这在编程语言或数学中都是不允许的。\n\n\
  **4.** 完成页面：\n\n```php\n?>  \n</body>  \n</html>\n```\n\n**5.** 将文件保存为 **`display_errors.php`**，将其放在你的\
  \ Web 目录中，并在 Web 浏览器中测试。\n\n![Image](img/08_figure_10_a.jpg)\n\n开启 `display_errors`（针对该脚本）后，页面会在错误发生时报告错误。\n\
  \n**6.** 如果你愿意，将第一行 PHP 代码改为：\n\n```php\nini_set('display_errors', 0);\n```\n\n\
  然后保存并重新测试脚本。\n\n![Image](img/08_figure_11_b.jpg)\n\n关闭 `display_errors`（针对该页面）后，相同的错误不再被报告。不幸的是，它们依然存在。\n\
  \n***\n\n> **Tip**\n>\n> `ini_set()` 函数可用于调整的 PHP 设置是有限制的。具体哪些可以更改、哪些不能，请参阅 PHP\
  \ 手册。\n\n***\n\n> **Tip**\n>\n> 顺便提醒一下，在脚本中更改 `display_errors` 设置仅在该脚本运行期间有效（即，它不能有解析错误）。要始终查看发生的任何错误，你需要在\
  \ PHP 的配置文件中启用 `display_errors`（同样，请参阅附录）。\n\n***\n\n### 在 PHP 中调整错误报告\n\n\n\n配置\
  \ PHP 显示发生的错误后，你可能想要调整错误报告的级别。你的整个 PHP 安装环境，或单个脚本，都可以设置为报告或忽略不同类型的错误。表 8.1 列出了大多数级别，但它们通常可分为以下三类：\n\
  \n* **通知**，不会停止脚本的执行，且不一定是个问题。\n* **警告**，指示存在问题，但不会停止脚本的执行。\n* **错误**，会阻止脚本继续运行（包括常见的解析错误，它会彻底阻止脚本运行）。\n\
  \n**表 8.1. 错误报告级别**\n\n![Image](img/08tab01.jpg)\n\n根据经验法则，在开发网站时，你会希望 PHP 报告任何类型的错误；但网站上线后，则不应报告任何具体错误。出于安全和美观考虑，让公共用户看到\
  \ PHP 详细的错误信息通常是不明智的。\n\n***\n\n#### 使用 @ 抑制错误\n\n在 PHP 中，可以使用错误抑制运算符 `@` 来抑制单个错误。例如，如果你不想让\
  \ PHP 报告无法包含文件的情况，可以这样编写代码：\n\n```php\n@include ('config.inc.php');\n```\n\n或者如果你不想看到“除以零”错误：\n\
  \n```php\n$x = 8;\n$y = 0;\n$num = @($x/$y);\n```\n\n`@` 符号仅对表达式有效，如函数调用或数学运算。你不能在条件语句、循环、函数定义等之前使用\
  \ `@`。\n\n根据经验法则，我建议仅在函数执行失败不会影响脚本整体功能时使用 `@`。或者你可以选择不显示 PHP 的错误，而是自行更优雅地处理它们（本章稍后将讨论该主题）。\n\
  \n***\n\n### 脚本 8.2. 该脚本将演示如何在 PHP 中操控错误报告。\n\n***\n\n```html\n1   <!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML\n2       1.0 Transitional//EN\"\n3           \"http://www.w3.org/TR/xhtml1/DTD/\n\
  4               xhtml1-transitional.dtd\">\n5   <html xmlns=\"http://www.w3.org/1999/\n\
  6       xhtml\" xml:lang=\"en\" lang=\"en\">\n7   <head>\n8       <meta http-equiv=\"\
  Content-Type\"\n9           content=\"text/html; charset=utf-8\" />\n10      <title>Reporting\
  \ Errors</title>\n11  </head>\n12  <body>\n13  <h2>Testing Error Reporting</h2>\n\
  14  <?php # Script 8.2 - report_errors.php\n\n15  // Show errors:\n16  ini_set('display_errors',\
  \ 1);\n\n17  // Adjust error reporting:\n18  error_reporting(E_ALL | E_STRICT);\n\
  \n19  // Create errors:\n20  foreach ($var as $v) {}\n21  $result = 1/0;\n\n22 \
  \ ?>\n23  </body>\n24  </html>\n```\n\n通常，错误消息——特别是涉及数据库的错误——会暴露 Web 应用程序某些幕后细节，这些最好不要展示给用户。虽然你希望在开发阶段解决所有这些问题，但实际情况可能并非如此。\n\
  \n你可以按照附录 A 中的说明通用地调整错误报告级别。或者，你可以使用 `error_reporting()` 函数在每个脚本的基础上调整此行为。该函数用于设定\
  \ PHP 在特定页面中应报告何种类型的错误。该函数接受一个数字或常量，使用 表 8.1 中的值（PHP 手册还列出了其他几个与 PHP 核心相关的值）。\n\n\
  ```php\nerror_reporting(0); // Show no errors.\n```\n\n设置为 0 会完全关闭错误报告（错误仍会发生；你只是看不见它们了）。相反，`error_reporting(E_ALL)`\
  \ 会指示 PHP 报告发生的每一个错误。数字可以相加以自定义错误报告级别，或者你可以将位运算符——`|`（或）、`~`（非）、`&`（与）——与常量一起使用。使用以下设置，将显示除通知以外的任何错误：\n\
  \n```php\nerror_reporting(E_ALL & ~E_NOTICE);\n```\n\n#### 调整错误报告\n\n1.  在文本编辑器或\
  \ IDE 中打开 `display_errors.php`（脚本 8.1）（如果尚未打开）。\n\n    要尝试不同的错误报告级别，请使用 `display_errors.php`\
  \ 作为示例。\n\n2.  调整 `display_errors` 设置后，添加（脚本 8.2）：\n\n    ```php\n    error_reporting(E_ALL\
  \ | E_STRICT);\n    ```\n\n    为了开发目的，让 PHP 通知你所有的错误、通知、警告和建议。将错误报告级别设置为 `E_ALL`\
  \ 即可实现这一点。但 `E_ALL` 不包含 `E_STRICT`，因此又添加了一个子句——`|`（或）`E_STRICT`。\n\n    简而言之，现在\
  \ PHP 会让你知道任何存在的、或仅仅可能存在的问题。\n\n    因为 `E_ALL` 和 `E_STRICT` 是常量，所以它们不加引号。\n\n3.\
  \  将文件保存为 `report_errors.php`，放入你的 Web 目录，并在 Web 浏览器中运行它 ![Image](img/circle-a.jpg)。\n\
  \n    ![Image](img/08_figure_12_a.jpg)\n\n    ![Image](img/circle-a.jpg) 在最高级别的错误报告下，PHP\
  \ 对该页面（脚本 8.2）显示了两个警告和一个通知。\n\n    我还修改了页面的标题和标题，但两者与此练习的重点无关。\n\n4.  将错误报告级别更改为其他设置并重新测试\
  \ ![Image](img/circle-b.jpg) 和 ![Image](img/circle-c.jpg)。\n\n    ![Image](img/08_figure_13_b.jpg)\n\
  \n    ![Image](img/circle-b.jpg) 禁用通知报告后的同一页面（脚本 8.2）。\n\n    ![Image](img/08_figure_14_c.jpg)\n\
  \n    ![Image](img/circle-c.jpg) 关闭错误报告（设为 0）后的同一页面（脚本 8.2）。结果与禁用 `display_errors`\
  \ 相同。当然，错误仍然会发生；只是不再被报告而已。\n\n***\n\n> **提示**\n>\n> 表 8.1 中 `E_ALL` 的数值可能因 PHP 版本不同而异。\n\
  \n***\n\n> **提示**\n>\n> 因为你经常需要为网站中的每个页面调整 `display_errors` 和 `error_reporting`，你可能想将这些代码行放在一个单独的\
  \ PHP 文件中，然后由其他 PHP 脚本包含。\n\n***\n\n> **提示**\n>\n> 本书中的所有脚本编写时都将 PHP 的错误报告设置为最高级别（旨在捕获每一个潜在问题）。\n\
  \n***\n\n> **提示**\n>\n> `trigger_error()` 函数是一种在 PHP 脚本中以编程方式生成错误的方法。其第一个参数是错误消息；第二个可选参数是数字错误类型，对应\
  \ 表 8.1 中的值。默认类型为 `E_USER`。\n>\n> ```php\n> if (/* some condition */) {\n>     trigger_error('Something\
  \ Bad Happened!');\n> }\n> ```\n\n***\n\n### 创建自定义错误处理程序\n\n管理网站错误的另一种选择是更改 PHP\
  \ 处理错误的方式。默认情况下，如果启用了 `display_errors` 且捕获到错误（属于错误报告级别范围内），PHP 会以一种略显简陋的形式，在极少量的\
  \ HTML 标签中打印该错误 ![Image](img/circle-a.jpg)。\n\n![Image](img/08_figure_15_a.jpg)\n\
  \n![Image](img/circle-a.jpg) HTML 源代码显示了 PHP 默认格式化错误的方式。\n\n你可以通过创建自己的函数来覆盖错误处理方式，该函数将在错误发生时被调用。例如：\n\
  \n```php\nfunction report_errors (arguments) {\n    // Do whatever here.\n}\n\n\
  set_error_handler ('report_errors');\n```\n\nPHP `set_error_handler()` 函数用于指定发生错误时要调用的用户定义函数。处理函数（本例中为\
  \ `report_errors`）届时将接收多个值，可用于任何可能的方式。\n\n\n\n\n此函数可编写为最多接受五个参数。按顺序，这些参数分别为：错误编号（对应表\
  \ 8.1）、文本错误消息、发现错误的文件名、发生错误的具体行号，以及错误发生时存在的变量。定义一个接受所有这些参数的函数可能如下所示：\n\n```\nfunction\
  \ report_errors ($num, $msg, $file, $line, $vars) {...}\n```\n\n为了利用这一概念，`report_errors.php`\
  \ 文件（脚本 8.2）将最后重写一次。\n\n### 创建您自己的错误处理程序\n\n**1.** 在文本编辑器或 IDE 中打开 `report_errors.php`（脚本\
  \ 8.2）（如果尚未打开）。\n\n**2.** 删除 `ini_set()` 和 `error_reporting()` 行（脚本 8.3）。\n\n当您建立自己的错误处理函数时，错误报告级别不再有任何意义，因此调整它们的那行代码可以删除。调整\
  \ `display_errors` 设置也毫无意义，因为错误处理函数将控制错误是否显示。\n\n**脚本 8.3.** 通过定义您自己的错误处理函数，您可以自定义\
  \ PHP 脚本处理错误的方式。\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n    \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=utf-8\" />\n    <title>Handling Errors</title>\n\
  </head>\n<body>\n\n<h2>Testing Error Handling</h2>\n<?php # Script 8.3 - handle_errors.php\n\
  \n// Flag variable for site status:\ndefine('LIVE', FALSE);\n\n// Create the error\
  \ handler:\nfunction my_error_handler ($e_number, $e_message, $e_file, $e_line,\
  \ $e_vars) {\n\n    // Build the error message:\n    $message = \"An error occurred\
  \ in script '$e_file' on line $e_line: $e_message\\n\";\n\n    // Append $e_vars\
  \ to $message:\n    $message .= print_r ($e_vars, 1);\n\n    if (!LIVE) { // Development\
  \ (print the error).\n        echo '<pre>' . $message . \"\\n\";\n        debug_print_backtrace();\n\
  \        echo '</pre><br />';\n    } else { // Don't show the error.\n        echo\
  \ '<div class=\"error\">A system error occurred. We apologize for the\n        \
  \    inconvenience.</div><br />';\n    }\n\n} // End of my_error_handler() definition.\n\
  \n// Use my error handler:\nset_error_handler ('my_error_handler');\n\n// Create\
  \ errors:\nforeach ($var as $v) {}\n$result = 1/0;\n\n?>\n</body>\n</html>\n```\n\
  \n**3.** 在脚本创建错误之前，添加：\n\n```\ndefine ('LIVE', FALSE);\n```\n\n此常量将作为一个标志，用于指示站点当前是否处于上线状态。这是一个重要的区别，因为您处理错误和在浏览器中揭示信息的方式，在开发站点和站点上线时应有很大不同。\n\
  \n之所以在函数外部设置此常量，有两个原因。首先，我希望将该函数视为一个黑盒，它无需我深入内部修改即可完成我需要的工作。其次，在许多站点中，可能还有其他设置（如数据库连接信息）也是针对上线环境与开发环境特定的。因此，条件语句也可以引用此常量来调整那些设置。\n\
  \n**4.** 开始定义错误处理函数：\n\n```\nfunction my_error_handler ($e_number, $e_message, $e_file,\
  \ $e_line, $e_vars) {\n```\n\n`my_error_handler()` 函数设置为接收自定义错误处理程序可接收的完整五个参数。\n\
  \n**5.** 使用接收到的值创建错误消息。\n\n```\n$message = \"An error occurred in script '$e_file'\
  \ on line $e_line: $e_message\\n\";\n```\n\n错误消息将首先引用发生错误的文件名和行号。随后附加上实际的错误消息。当函数被调用时（即发生错误时），所有这些值都会被传递给函数。\n\
  \n**6.** 将任何现有变量添加到错误消息中：\n\n```\n$message .= print_r ($e_vars, 1);\n```\n\n发生错误时，`$e_vars`\
  \ 变量将接收所有存在的变量及其值。因为这可能包含有用的调试信息，所以将其添加到消息中。\n\n`print_r()` 函数通常用于打印变量的结构和值；它对于数组特别有用。如果使用第二个参数（1\
  \ 或 TRUE）调用该函数，结果将被返回而不是打印。因此，这一行将所有变量信息添加到 `$message` 中。\n\n**7.** 根据站点是否上线打印不同的消息：\n\
  \n```\nif (!LIVE) {\n    echo '<pre>' . $message . \"\\n\";\n    debug_print_backtrace();\n\
  \    echo '</pre><br />';\n} else {\n    echo '<div class=\"error\">A system error\
  \ occurred. We apologize for the inconvenience.</div><br />';\n}\n```\n\n如果站点未上线（即\
  \ `LIVE` 为 `FALSE`），这在站点开发期间通常是这种情况，则应打印详细的错误消息。为了便于查看，错误消息会在 HTML `PRE` 标签内打印。此外，还会调用一个有用的调试函数\
  \ `debug_print_backtrace()`。该函数返回大量关于已调用函数、已包含文件等的信息。\n\n在开发阶段，详细的错误消息会打印在 Web 浏览器中。（在包含更多代码的实际脚本中，这些消息会更有用。）\n\
  \n如果站点已上线，将打印一条简单的道歉消息，让用户知道发生了错误，但不透露具体问题。在这种情况下，您也可以使用 `error_log()` 函数（见侧栏）将详细错误消息通过电子邮件发送或写入日志。\n\
  \n一旦站点上线，将打印更友好（且泄露信息更少）的错误。此处，针对脚本中的三个错误，每个都打印了一条消息。\n\n**8.** 完成函数并告诉 PHP 使用它：\n\
  \n```\n}\nset_error_handler('my_error_handler');\n```\n\n这第二行是关键，它告诉 PHP 使用自定义错误处理程序，而不是\
  \ PHP 的默认处理程序。\n\n**9.** 将文件保存为 `handle_errors.php`，将其放在您的 Web 目录中，并在 Web 浏览器中测试它。\n\
  \n**10.** 将 `LIVE` 的值改为 TRUE，保存，然后重新测试脚本。\n\n### 记录 PHP 错误\n\n在脚本 8.3 中，错误处理方式仅是详细打印出来或不打印。另一种选择是*记录*错误：以某种方式永久记录它们。为此，`error_log()`\
  \ 函数指示 PHP 如何记录错误。其语法为：\n\n```\nerror_log (message, type, destination, extra headers);\n\
  ```\n\n*message* 值应为记录错误的文本（即脚本 8.3 中的 `$message`）。*type* 指示错误如何记录。选项为数字 0、1、3 和\
  \ 4：使用计算机的默认记录方法 (0)、通过电子邮件发送 (1)、写入文本文件 (3) 或发送给 Web 服务器的记录处理程序 (4)。\n\n*destination*\
  \ 参数可以是文件名（用于记录类型 3）或电子邮件地址（用于记录类型 1）。*extra headers* 参数仅在发送电子邮件时使用（记录类型 1）。destination\
  \ 和 extra headers 都是可选的。\n\n\n\n要查看错误处理程序在实际站点上的表现，只需更改这一个值。\n\n***\n\n提示\n\n如果您的\
  \ PHP 页面使用特殊的 HTML 格式——如影响布局和字体处理的 CSS 标签——请将此信息添加到您的错误报告函数中。\n\n***\n\n提示\n\n显然，在实际站点中，您可能需要做的不仅仅是为不便道歉（特别是当错误严重影响页面功能时）。尽管如此，这个示例演示了如何轻松调整错误处理以适应具体情况。\n\
  \n***\n\n提示\n\n如果您不想让错误处理函数报告每一个通知、错误或警告，可以检查错误编号值（传递给函数的第一个参数）。例如，要在站点上线时忽略通知，您需要将主条件语句更改为\n\
  \n```\nif (!LIVE) {\n    echo '<pre>' . $message . \"\\n\";\n    debug_print_backtrace();\n\
  \    echo '</pre><br />';\n} elseif ($e_number != E_NOTICE) {\n    echo '<div class=\"\
  error\">A system error occurred. We apologize for the inconvenience.</div><br />';\n\
  }\n```\n\n### PHP 调试技巧\n\n说到调试，您将从经验中最好地学到特定类型错误的成因。了解常见成因将缩短修复错误所需的时间。为了加快学习过程，**表\
  \ 8.2** 列出了最常见 PHP 错误的可能原因。\n\n**表 8.2. 常见 PHP 错误**\n\n![Image](img/08tab02.jpg)\n\
  \n您将遇到的第一种、也是最常见的错误类型是语法错误，它会阻止脚本执行。此类错误会导致类似 ![Image](img/circle-a.jpg) 所示的消息，每位\
  \ PHP 开发人员都见过太多次了。为避免编程时犯此类错误，请务必：\n\n![Image](img/08_figure_18_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 解析错误因无效的 PHP 语法而阻止脚本运行。此错误是由于打印 `$array['key']` 的值时未将其放在花括号内引起的。\n\n- 每个语句（但不包括循环和条件判断等语言结构）都要以分号结尾。\n\
  - 所有引号、圆括号、花括号和方括号必须成对匹配（每个左符号必须有对应的右符号）。\n- 引号使用要一致（单引号只能用单引号闭合，双引号只能用双引号闭合）。\n\
  - 根据需要，使用反斜杠转义字符串中的所有单引号和双引号。\n\n关于语法错误，还有一点您应该明白：PHP 错误消息指出错误发生在第 12 行，并不意味着错误实际上就在那一行。至少，PHP\
  \ 认为的第 12 行与您的文本编辑器指示的第 12 行之间存在差异的情况并不少见。因此，虽然 PHP 的指引对追踪问题很有用，但请将引用的行号视为起点而非绝对位置。\n\
  \n如果 PHP 报告文档最后一行有错误，这几乎总是因为不匹配的圆括号、花括号或引号直到那时才被捕获。\n\n您将遇到的第二种错误类型源于函数的误用。例如，在缺少适当参数的情况下调用函数时就会发生此错误。PHP\
  \ 在尝试执行代码时会发现此错误。在后续章节中，您使用 `header()` 函数、Cookie 或会话时可能会看到此类错误。\n\n要修复错误，您需要做一些侦探工作，看看犯了什么错以及错在哪里。但首先，请始终仔细阅读并信任\
  \ PHP 提供的错误消息。虽然引用的行号不一定总是正确，但 PHP 错误描述非常详细，通常很有帮助，且几乎总是 100% 正确的。\n\n#### 调试脚本\n\
  \n- 开启 `display_errors`。\n\n使用前面的步骤为脚本启用 `display_errors`，或者如果可能，在开发应用程序时为整个服务器启用它。\n\
  \n- 使用注释。\n\n正如您可以使用注释来记录脚本，也可以用它们来排除有问题的行。如果 PHP 报告第 12 行有错误，那么注释掉该行应该能消除错误。如果不能，则说明错误在别处。只需小心，不要因不当地仅注释掉代码块的一部分而引入更多错误：脚本的语法必须保持完整。\n\
  \n- 使用 `print` 和 `echo` 函数。\n\n在更复杂的脚本中，我经常使用 `echo` 语句在脚本执行过程中给自己留下关于正在发生什么的提示\
  \ ![Image](img/circle-b.jpg)。当脚本有多个步骤时，可能不容易知道问题是发生在第 2 步还是第 5 步。通过使用 `echo` 语句，您可以将问题范围缩小到特定的节点。\n\
  \n![Image](img/08_figure_19_b.jpg)\n\n![Image](img/circle-b.jpg) 通过留下脚本正在执行操作的提示，可以完成更复杂的调试。\n\
  \n- 检查打印变量时使用的引号。\n\n程序员误用单引号，然后纳闷为什么变量无法正确打印，这种情况并不少见。请记住，单引号按字面意思处理文本，必须使用双引号才能打印出变量的值。\n\
  \n- 跟踪变量 ![Image](img/circle-c.jpg)。\n\n![Image](img/08_figure_20_c.jpg)\n\n![Image](img/circle-c.jpg)\
  \ 打印变量的名称和值是跟踪它们在脚本执行过程中变化的最简单方法。\n\n脚本无法工作，很可能是因为您引用了错误的变量、用错名称引用了正确的变量，或者变量的值不是您所预期的。要检查这些可能性，请使用\
  \ `print` 或 `echo` 语句在脚本的关键点打印出变量的值。这只是一个简单的\n\n```\necho \"<p>\\$var = $var</p>\\\
  n\";\n```\n\n或\n\n```\necho \"<p>\\$var is $var</p>\\n\";\n```\n\n第一个美元符号被转义，以便打印变量的名称。第二个变量引用将打印其值。\n\
  \n***\n\n**使用 `die()` 和 `exit()`**\n\n错误管理中常用的两个函数是 `die()` 和 `exit()`（它们技术上属于语言结构而非函数，但这有关系吗？）。当脚本中调用\
  \ `die()` 或 `exit()` 时，整个脚本将终止。如果发生重要事件失败——如建立数据库连接——两者都可用于阻止脚本继续执行。您也可以向 `die()`\
  \ 和 `exit()` 传递一个字符串，该字符串将在浏览器中打印出来。\n\n您常会在 `OR` 条件语句中看到 `die()` 或 `exit()` 的用法。例如：\n\
  \n```\ninclude('config.inc.php') OR die ('Could not open the file. ');\n```\n\n\
  有了这一行，如果 PHP 无法包含配置文件，将执行 `die()` 语句并打印“Could not open the file.”消息。您将在本书和 PHP 手册中看到此用法的变体，因为这是一种无需使用自定义错误处理程序即可处理错误的快速但可能过度的方法。\n\
  \n***\n\n- 打印数组值。\n\n对于更复杂的变量类型（数组和对象），`print_r()` 和 `var_dump()` 函数无需循环即可打印其值。两个函数完成相同的任务，尽管\
  \ `var_dump()` 的报告比 `print_r()` 更详细。\n\n***\n\n提示\n\n许多文本编辑器都包含用于检查圆括号、方括号和引号是否匹配的实用程序。\n\
  \n***\n\n提示\n\n\n\n如果你无法在复杂的脚本中找到解析错误，请首先使用 `/* */` 注释使整个 PHP 代码失效。然后逐个取消注释各个部分（通过移动开始或结束注释字符）并重新运行脚本，直到推断出哪些行导致了错误。不过要注意如何注释掉控制结构，因为花括号必须继续匹配，以避免解析错误。例如：\n\
  \n```\nif (condition) {  \n\n    /* Start comment.  \n\n    Inert code.  \n\n  \
  \  End comment. */  \n\n}\n```\n\n---\n\n**提示**\n\n为了使 `print_r()` 的结果在 Web 浏览器中更具可读性，请将其包裹在\
  \ HTML `<pre>`（预格式化）标签中。这一行是我最喜欢的调试工具之一：\n\n```\necho '<pre>' . print_r($var, 1)\
  \ . '</pre>';\n```\n\n---\n\n### SQL 和 MySQL 调试技术\n\n最常见的 SQL 错误由以下问题引起：\n\n*  \
  \ 引号或括号使用不平衡\n*   列值中的撇号未转义\n*   列名、表名或函数名拼写错误\n*   在连接查询中模糊地引用列\n*   将查询的子句（`WHERE`、`GROUP\
  \ BY`、`ORDER BY`、`LIMIT`）放在了错误的顺序\n\n此外，使用 MySQL 时还可能遇到以下情况：\n\n*   不可预测或不合适的查询结果\n\
  *   无法访问数据库\n\n由于你将从 PHP 中运行动态网站的查询，因此你需要一种在该上下文中调试 SQL 和 MySQL 错误的方法（PHP 不会报告你的\
  \ SQL 问题）。\n\n#### 调试 SQL 问题\n\n要判断你遇到的是 MySQL（或 SQL）问题而不是 PHP 问题，你需要一套查找和修复问题的系统。幸运的是，调试\
  \ MySQL 和 SQL 问题应采取的步骤很容易定义，且应不假思索地遵循。如果你有任何 MySQL 或 SQL 错误需要调试，只需遵循以下步骤序列。\n\n\
  > **为了强调重点，接下来的这一系列步骤可能是本章甚至全书中最有用的调试技术。在任何 PHP-MySQL Web 应用程序中，当你得不到预期结果时，很可能都需要遵循这些步骤。**\n\
  \n#### 调试 SQL 查询\n\n**1.** 在 PHP 脚本中打印出任何适用的查询。\n\n确切知道 PHP 脚本试图执行什么查询，是解决 SQL 和\
  \ MySQL 问题最有用的第一步。\n\n正如你在下一章将看到的，SQL 查询通常会被赋值给一个变量，特别是当你使用 PHP 动态创建它们时。在 PHP 脚本中使用代码\
  \ `echo $query`（或查询变量的任何名称），你可以将正在运行的确切查询发送到浏览器。有时仅这一步就能帮助你看清真正的问题所在。\n\n**2.**\
  \ 在 mysql 客户端或其他工具中运行查询。\n\n为了解 PHP 脚本接收到什么结果，请通过单独的界面运行相同的查询。在这种情况下，问题在于引用了 `password`\
  \ 列，而该表的列实际上只叫 `pass`。\n\n调试 SQL 或 MySQL 问题最万无一失的方法是，通过独立的应用程序（mysql 客户端、phpMyAdmin\
  \ 等）运行 PHP 脚本中使用的查询。这样做将给你与原始 PHP 脚本接收到的相同结果，但没有开销、麻烦或神秘感。\n\n如果独立应用程序返回了预期结果，但你在\
  \ PHP 脚本中仍未获得正确行为，那么你就会知道问题出在脚本本身，而不是你的 SQL 命令或 MySQL 数据库。\n\n**3.** 如果问题仍不明显，请以最基本的形式重写查询，然后不断添加维度，直到发现哪个子句导致了问题。继续使用第三方\
  \ MySQL 界面执行此操作（即，搁置 PHP 脚本，直到你让 SQL 查询正常工作）。\n\n有时调试查询很困难，因为其中发生的事情太多。就像注释掉 PHP\
  \ 脚本的大部分内容一样，将查询简化到其最基本的结构，然后慢慢重建，可能是调试复杂 SQL 命令的最简单方法。\n\n#### 调试访问问题\n\n“访问被拒绝”错误消息是初学者在使用\
  \ PHP 与 MySQL 交互时遇到的最常见问题。以下是常见的解决方案：\n\n*   更改权限后重新加载 MySQL，以使更改生效。使用 mysqladmin\
  \ 工具或在 mysql 客户端中运行 `FLUSH PRIVILEGES`。你必须以具有相应权限的用户身份登录才能执行此操作（详见 附录 A）。\n*   仔细检查所用的密码。错误消息\
  \ `Access denied for user: 'user@localhost' (Using password: YES)` 通常表明密码错误或拼写有误。（这并不总是原因，但却是首先要检查的事项。）\n\
  *   错误消息 `Can't connect to...`（错误编号 2002）表明 MySQL 要么未运行，要么未在客户端尝试的套接字或 TCP/IP 端口上运行。\n\
  \n---\n\n**提示**\n\nMySQL 保存着自己的错误日志，这对于解决 MySQL 问题（如 MySQL 甚至无法启动的原因）非常有用。MySQL\
  \ 的错误日志位于 MySQL 数据目录中，名为 `hostname.err`。\n\n---\n\n---\n\n**提示**\n\nMySQL 手册非常详尽，包含\
  \ SQL 示例、函数参考和错误代码的含义。把手册当成朋友，当令人困惑的错误出现时就去查阅它。\n\n---\n\n### 复习与深入\n\n如果你对复习问题或深入提示有任何疑问，请访问本书的支持论坛\
  \ ([www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/))。\n\n#### 复习\n\
  \n*   为什么 PHP 脚本必须通过 URL 运行？\n*   你使用的是哪个版本的 PHP？哪个版本的 MySQL？哪个版本的什么 Web 服务器应用程序？运行在什么操作系统上？\n\
  *   如果渲染的网页在浏览器中显示不正确，你应该采取哪些调试步骤？\n*   你的服务器上启用 `display_errors` 了吗？为什么在开发服务器上启用\
  \ `display_errors` 很有用？为什么在生产服务器上暴露错误是件坏事？\n*   `error_reporting` 的级别如何影响 PHP 脚本？你的\
  \ PHP 服务器的 `error_reporting` 设置为何种级别？\n*   `@` 运算符有什么作用？\n*   使用自定义错误处理函数有什么好处？错误报告级别在使用自定义错误处理函数时有什么影响？\n\
  *   `print` 或 `echo` 如何用作调试工具？提示：有很多正确答案。\n*   修复 PHP-SQL-MySQL Bug 的方法是什么？\n\n\
  #### 深入\n\n*   如果尚未安装，请为 Firefox 安装 Firebug 和 Web Developer 扩展。如果还没装 Firefox，请先安装\
  \ Firefox！\n*   如果可以，在开发服务器上启用 `display_errors`。\n*   如果可以，将开发服务器上 PHP 的错误报告级别设置为\
  \ `E_ALL | E_STRICT`。\n*   查阅 PHP 手册中关于 `debug_print_backtrace()` 函数的页面以了解更多信息。\n\
  *   考虑使用提供内置调试工具的专业级 IDE。\n\n## 9. 将 PHP 与 MySQL 结合使用\n\n本章内容\n\n*   修改模板 266\n\
  *   连接 MySQL 268\n*   执行简单查询 273\n*   检索查询结果 281\n*   确保 SQL 安全 285\n*   统计返回记录数\
  \ 290\n\n\n\n#### 使用 PHP 更新记录\n\n### 复习与深入\n\n既然你已拥有足够的 PHP、SQL 和 MySQL 经验，是时候将所有技术整合在一起了。PHP\
  \ 与 MySQL 的强强结合只是众多程序员青睐它的原因之一；将两者结合使用是何其容易，令人印象深刻。\n\n本章将使用现有的 `sitename` 数据库——创建于第\
  \ 5 章“SQL 简介”——来构建一个用于与 `users` 表交互的 PHP 界面。此处传授的知识和使用的示例将成为你所有 PHP-MySQL Web 应用程序的基础，因为所涉及的原则适用于任何\
  \ PHP-MySQL 交互。\n\n在进入本章之前，你应该熟悉前八章涵盖的所有内容，包括上一章刚讲的错误调试和处理技术。最后，请记住，你需要一个支持 PHP\
  \ 的 Web 服务器和一个正在运行的 MySQL 服务器，才能执行以下示例。\n\n### 修改模板\n\n由于本章和下一章的所有页面都将属于同一个 Web\
  \ 应用程序，因此使用通用的模板系统是值得的。我们不必从头创建新模板，而是再次使用第 3 章“创建动态网站”中的布局，仅对头部文件的导航链接进行少量修改。\n\n\
  #### 创建头部文件\n\n**1.** 在文本编辑器或 IDE 中打开 `header.html`（脚本 3.2）。\n\n**2.** 将链接列表更改为如下内容（脚本\
  \ 9.1）：\n\n```html\n<li><a href=\"index.php\">Home Page</a></li>\n<li><a href=\"\
  register.php\">Register</a></li>\n<li><a href=\"view_users.php\">View Users</a></li>\n\
  <li><a href=\"password.php\">Change Password</a></li>\n<li><a href=\"#\">link five</a></li>\n\
  ```\n\n本章所有示例都将涉及注册、查看用户和更改密码页面。第 3 章中的日期表单和计算器链接可以删除。\n\n**3.** 将文件保存为 `header.html`。\n\
  \n**4.** 将新的头部文件放入 Web 目录下的 `includes` 文件夹中，与 `footer.html`（脚本 3.3）和 `style.css`（可从本书配套网站\
  \ www.LarryUllman.com 下载）放在一起。\n\n**脚本 9.1.** 网站的头部文件，用于页面模板，已修改为新的导航链接。\n\n```html\n\
