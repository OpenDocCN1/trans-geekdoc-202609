  en\">\n3   <head>\n4       <meta http-equiv=\"Content-Type\"\n            content=\"\
  text/html; charset=utf-8\" />\n5       <title>Simple HTML Form</title>\n6      \
  \ <style type=\"text/css\" title=\"text/\n            css\" media=\"all\">\n7  \
  \     label {\n8           font-weight: bold;\n9           color: #300ACC;\n10 \
  \     }\n11      </style>\n12  </head>\n13  <body>\n14  <!-- Script 2.1 - form.html\
  \ -->\n\n15  <form action=\"handle_form.php\"\n        method=\"post\">\n\n16  \
  \    <fieldset><legend>Enter your\n            information in the form below:\n\
  \            </legend>\n\n17      <p><label>Name: <input type=\"text\"\n       \
  \     name=\"name\" size=\"20\" maxlength=\n            \"40\" /></label></p>\n\n\
  18      <p><label>Email Address: <input\n            type=\"text\" name=\"email\"\
  \ size=\"40\"\n            maxlength=\"60\" /></label></p>\n\n19      <p><label\
  \ for=\"gender\">Gender:\n            </label><input type=\"radio\"\n          \
  \  name=\"gender\" value=\"M\" /> Male\n            <input type=\"radio\" name=\"\
  gender\"\n            value=\"F\" /> Female</p>\n\n20      <p><label>Age:\n    \
  \    <select name=\"age\">\n            <option value=\"0-29\">Under 30\n      \
  \      </option>\n            <option value=\"30-60\">Between 30\n            and\
  \ 60</option>\n            <option value=\"60+\">Over 60\n            </option>\n\
  \        </select></label></p>\n\n21      <p><label>Comments: <textarea\n      \
  \      name=\"comments\" rows=\"3\" cols=\"40\"></\n            textarea></label></p>\n\
  \n22      </fieldset>\n\n23      <p align=\"center\"><input type=\n            \"\
  submit\" name=\"submit\" value=\n            \"Submit My Information\" /></p>\n\n\
  24  </form>\n\n25  </body>\n26  </html>\n```\n\n---\n\n#### 创建 HTML 表单\n\n**1.**\
  \ 在文本编辑器或 IDE 中新建一个 HTML 文档，命名为 `form.html`（**脚本 2.1**）：\n\n```html\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Simple HTML Form</title>\n  <style type=\"text/css\" title=\"text/css\"\
  \ media=\"all\">\n  label {\n    font-weight: bold;\n    color: #300ACC;\n  }\n\
  \  </style>\n</head>\n<body>\n<!-- Script 2.1 - form.html -->\n```\n\n该文档使用与上一章相同的基本\
  \ HTML 页面语法。我添加了一些内联 CSS（层叠样式表），以便稍微美化表单（具体来说，让 `label` 元素变粗并变蓝）。\n\nCSS 是处理 HTML\
  \ 页面中许多格式和布局问题的首选方式。你将在本书中看到一些 CSS 片段；如果你不熟悉该主题，请查阅专门的 CSS 参考资料。\n\n最后，一个 HTML 注释标明了文件的名称和编号。\n\
  \n**2.** 添加初始 `form` 标签：\n\n```html\n<form action=\"handle_form.php\" method=\"\
  post\">\n```\n\n由于 `action` 属性决定表单数据将提交到哪个脚本，你应该给它一个合适的名称（`handle_form` 以对应此页面：`form.html`）和\
  \ `.php` 扩展名（因为将由 PHP 脚本处理该表单的数据）。\n\n**3.** 开始 HTML 表单：\n\n```html\n<fieldset><legend>Enter\
  \ your information in the form below:</legend>\n```\n\n我使用 `fieldset` 和 `legend`\
  \ HTML 标签，因为我喜欢它们让 HTML 表单呈现的效果（它们在表单周围添加一个带有顶部标题的边框）。不过，这与表单功能本身无关。\n\n**4.** 添加两个文本输入框：\n\
  \n```html\n<p><label>Name: <input type=\"text\" name=\"name\" size=\"20\" maxlength=\"\
  40\" /></label></p>\n<p><label>Email Address: <input type=\"text\" name=\"email\"\
  \ size=\"40\" maxlength=\"60\" /></label></p>\n```\n\n这些只是简单的文本输入框，允许用户输入姓名和电子邮件地址\
  \ ![Image](img/circle-a.jpg)。如果你想知道，每个输入标签末尾额外的空格和斜杠是有效 XHTML 所要求的。在标准 HTML 中，这些标签将以\
  \ `maxlength=\"40\">` 结尾。`label` 标签只是将每个文本标签与相关联的元素绑定起来。\n\n![Image](img/02_figure_01_a.jpg)\n\
