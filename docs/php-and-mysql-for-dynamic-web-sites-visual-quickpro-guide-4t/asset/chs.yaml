  \n---\n\n### 提示\n\n#### `mail()` 函数的可选参数\n\n`mail()` 函数接受一个可选的第五个参数，用于传递给邮件发送应用程序的附加参数。\n\
  \n#### `mail()` 函数的返回值\n\n`mail()` 函数返回 `1` 或 `0`，指示函数调用是否成功。这并不等同于邮件成功发送或接收。同样，您无法使用\
  \ PHP 轻松测试这两者。\n\n#### 发送 HTML 邮件或附件\n\n虽然使用 `mail()` 函数发送简单消息很容易，但发送 HTML 邮件或带附件的邮件涉及更多工作。我在我的著作\
  \ *PHP 5 Advanced: Visual QuickPro Guide*（Peachpit Press, 2007）中讨论了如何实现这两者。\n\n\
  ### 防止垃圾邮件\n\n使用让 PHP 发送邮件的联系表单是最大程度减少您收到垃圾邮件的好方法。使用此系统，您的实际邮箱地址在 Web 浏览器中不可见，这意味着垃圾邮件机器人无法收集它。\n\
  \n---\n\n### 处理文件上传\n\n第 2 章“使用 PHP 编程”和第 3 章“创建动态网站”介绍了使用 PHP 处理 HTML 表单的基础知识。大部分情况下，每种类型的表单元素在\
  \ PHP 中的处理方式相同，只有一个例外：文件上传。上传文件的过程有两个维度。首先，必须显示 HTML 表单，并包含允许文件上传的适当代码。提交表单后，服务器首先将上传的文件存储在临时目录中，因此下一步是\
  \ PHP 脚本将上传的文件复制到其最终目的地。\n\n要使此过程生效，必须满足以下几个条件：\n\n- PHP 必须使用正确的设置运行。\n- 必须存在具有正确权限的临时存储目录。\n\
  - 必须存在具有正确权限的最终存储目录。\n\n考虑到这一点，下一节将介绍允许文件上传的服务器设置；然后将创建一个实际执行上传的 PHP 脚本。\n\n####\
  \ 允许文件上传\n\n\n\n\n正如我所说，为了让 PHP 能够处理文件上传，必须建立某些设置。我将首先讨论为什么或何时需要进行这些调整，然后再引导你完成步骤。\n\
  \n第一个问题是 PHP 本身。PHP 的配置文件 `php.ini` 中有几个设置决定了 PHP 如何处理上传，具体规定了可以上传多大的文件以及上传文件应临时存储在何处（表\
  \ 11.1）。一般来说，如果出现以下任何情况，你都需要编辑此文件：\n\n*   `file_uploads` 被禁用。\n*   PHP 没有可用的临时目录。\n\
  *   你将上传非常大的文件（大于 2MB）。\n\n**表 11.1. 文件上传配置**\n\n![Image](img/11tab01.jpg)\n\n如果你无法访问\
  \ `php.ini` 文件——例如你正在使用托管网站——推测主机提供商已经配置 PHP 以允许文件上传。\n\n第二个问题是临时目录的位置和权限。这是 PHP\
  \ 将上传的文件存储到你的 PHP 脚本将其移动到最终目的地之前的地方。如果你在自己的 Windows 计算机上安装了 PHP，可能需要在此采取措施。Mac OS\
  \ X 和 Unix 用户无需担心这一点，因为此类用途已存在一个临时目录（即一个名为 `/tmp` 的特殊目录）。\n\n最后，必须创建目标文件夹并在其上建立适当的权限。这是每个人为每个处理文件上传的应用程序都必须采取的步骤。由于此步骤涉及重要的安全问题，请务必阅读并理解侧边栏“安全文件夹权限”。\n\
  \n考虑到所有这些，让我们逐步进行操作。\n\n***\n\n#### 安全文件夹权限\n\n通常在安全性和便利性之间存在权衡。在这个例子中，将 `uploads`\
  \ 文件夹放在 Web 文档目录中会更方便（这种便利性体现在上传的图片可以多么容易地在 Web 浏览器中查看），但这样做安全性较低。\n\n为了让 PHP 能够将文件放入\
  \ `uploads` 文件夹，它需要对该目录拥有写入权限。在大多数服务器上，PHP 作为与 Web 服务器本身相同的用户运行。在托管服务器上，这意味着托管的所有\
  \ *X* 个站点都作为同一用户运行。创建一个 PHP 可写的文件夹意味着创建一个*所有人*都可写的文件夹。字面上讲，服务器上拥有站点的任何人现在都可以移动、复制或写入文件到你的\
  \ `uploads` 文件夹（假设他们知道它的存在）。这甚至意味着恶意用户可以将麻烦的 PHP 脚本复制到你的 `uploads` 目录。然而，由于本例中的\
  \ `uploads` 目录不在 Web 目录内，因此无法在 Web 浏览器中运行此类 PHP 脚本。这种做法不太方便，但更安全。\n\n如果你必须保持 `uploads`\
  \ 文件夹公开可访问，并且你正在使用 Apache Web 服务器，你可以使用 `.htaccess` 文件限制对 `uploads` 文件夹的访问。基本上，你会声明该文件夹中只有图像文件可公开查看，这意味着即使\
  \ PHP 脚本被放置在那里，也无法执行。或者，因为你将在本章后面学习如何使用*代理脚本*，你可以拒绝对该文件夹的所有外部访问。有关如何使用 `.htaccess`\
  \ 文件的信息，请参阅 附录 A，可从 peachpit.com 免费下载。\n\n有时即使是最保守的程序员也会在安全性上做出让步。重要的是你意识到潜在的担忧，并尽最大努力将危险降到最低。\n\
  \n***\n\n#### 准备服务器\n\n**1.** 运行 `phpinfo()` 函数以确认你的服务器设置 ![Image](img/circle-a.jpg)。\n\
  \n![Image](img/11_figure_05_a.jpg)\n\n![Image](img/circle-a.jpg) `phpinfo()` 脚本返回关于你的\
  \ PHP 设置的所有信息，包括所有文件上传处理相关内容。\n\n`phpinfo()` 函数会打印大量关于你的 PHP 设置的信息。在我看来，它是 PHP 中最重要的函数之一，如果不是最重要的话。搜索\
  \ 表 11.1 中列出的设置并确认它们的值。确保 `file_uploads` 的值为 `On`，并且 `upload_max_filesize`（默认 2MB）和\
  \ `post_max_size`（8MB）的限制不会对你造成限制。如果在 Windows 上运行 PHP，请查看 `upload_tmp_dir` 是否有值。如果没有，那可能是个问题（运行处理文件上传的\
  \ PHP 脚本后你就会确定）。对于非 Windows 用户，如果此值显示 `no value`，那完全没问题。\n\n顺便说一句，使用一体化安装程序（如 Windows\
  \ 的 XAMPP 或 Mac OS X 的 MAMP）的另一个优势是，安装程序也应该能正确配置这些设置。\n\n**2.** 如有必要，在文本编辑器中打开 `php.ini`。\n\
  \n如果你在步骤 1 中看到任何需要更改的内容，或者当你实际使用 PHP 处理文件上传时发生了某些情况，你将需要编辑 `php.ini` 文件。要找到此文件，请参阅\
  \ `phpinfo()` 输出中的 *Configuration File (php.ini) path* 值。这准确地指示了该文件在你计算机上的位置（也可下载\
  \ 附录 A 了解更多）。\n\n如果你不被允许编辑 `php.ini` 文件（例如，你正在使用托管服务器），那么推测任何必要的编辑已经完成以允许文件上传。如果没有，你需要向你的托管公司请求这些更改（他们可能同意，也可能不同意）。\n\
  \n**3.** 在 `php.ini` 文件中搜索要更改的配置并进行编辑 ![Image](img/circle-b.jpg)。\n\n![Image](img/11_figure_06_b.jpg)\n\
  \n![Image](img/circle-b.jpg) `php.ini` 文件的文件上传小节。\n\n例如，在文件上传部分，你将看到这三行：\n\n```\n\
  file_uploads = On\n;upload_tmp_dir =\nupload_max_filesize = 2M\n```\n\n第一行规定是否允许上传。第二行说明上传的文件应临时存储在何处。在大多数操作系统中，包括\
  \ Mac OS X 和 Unix，此设置可以保持注释掉（前面带有分号）而不会有任何问题。\n\n如果你正在运行 Windows 并需要创建临时目录，请将此值设为\
  \ `C:\\tmp`，确保该行*不*以分号开头。\n\n同样，在 Windows 7 上使用 XAMPP，我不需要创建临时目录，所以你可能也能不用创建。\n\n\
  最后，设置了最大上传文件大小（配置设置中的 *M* 是兆字节的简写）。\n\n**4.** 保存 `php.ini` 文件并重启你的 Web 服务器。\n\n\
  如何重启 Web 服务器取决于所使用的操作系统和 Web 服务应用程序。请参阅 附录 A 获取说明。\n\n**5.** 通过重新运行 `phpinfo()`\
  \ 脚本来确认更改。\n\n在进一步操作之前，通过重复步骤 1 确认必要的更改已生效。\n\n**6.** 如果你正在运行 Windows 并需要创建临时目录，请在\
  \ `C:\\` 中添加一个 `tmp` 文件夹，并确保每个人都可以写入该目录 ![Image](img/circle-c.jpg)。\n\n![Image](img/11_figure_07_c.jpg)\n\
  \n![Image](img/circle-c.jpg) Windows 用户需要确保 `C:\\tmp`（或使用的任何目录）可被 PHP 写入。\n\nPHP\
  \ 通过你的 Web 服务器将上传的文件临时存储在 `upload_tmp_dir` 中。为了使其工作，Web 用户（如果你的 Web 服务器作为特定用户运行）必须有权限写入该文件夹。\n\
  \n\n\n\n### 使用 PHP 上传文件\n\n很有可能，你实际上不需要更改权限，但如果需要的话，根据你运行的 Windows 版本，通常可以通过右键点击文件夹并选择“属性”来调整权限。在“属性”窗口中，应该有一个“安全”选项卡用于设置权限。也可能在“共享”下。Windows\
  \ 使用的是一个更宽松的权限系统，所以除非文件夹被刻意限制，否则你可能不需要更改任何内容。\n\nMac OS X 和 Unix 用户可以跳过此步骤，因为临时目录——`/tmp`——已经具有开放权限。\n\
  \n**7.** 在 Web 根目录之外的目录中创建一个名为 `uploads` 的新目录。\n\n所有上传的文件将永久存储在 `uploads` 目录中。如果你将\
  \ PHP 脚本放在 `C:\\xampp\\htdocs\\ch11` 目录中，则创建一个 `C:\\xampp\\uploads` 目录。或者如果文件将放在\
  \ `/Users/~<username>/Sites/ch11` 中，则创建一个 `/Users/~<username>/uploads` 文件夹。图示展示了你应该建立的结构，侧边栏讨论了为什么此步骤是必要的。\n\
  \n![Image](img/11_figure_08_d.jpg)\n\n假设 `htdocs` 是 Web 根目录（`http://www.example.com`\
  \ 或 `http://localhost` 指向那里），那么 `uploads` 目录需要放置在它的外部。\n\n**8.** 设置 `uploads` 目录的权限，以便\
  \ Web 服务器可以向其写入。\n\n同样，Windows 用户可以使用“属性”窗口进行这些更改，尽管这可能不是必需的。Mac OS X 用户可以……\n\n\
  **A.** 在 Finder 中选择该文件夹。\n\n**B.** 按 Command+I。\n\n**C.** 在“所有者与权限”面板下，允许所有人“读取与写入”。\n\
  \n![Image](img/11_figure_09_e.jpg)\n\n在 Mac OS X 中调整 `uploads` 文件夹的属性。\n\n如果你使用的是托管网站，主机提供商很可能会提供一个控制面板，你可以通过它调整文件夹的设置，或者你可能可以在\
  \ FTP 应用程序中完成此操作。\n\n根据你的操作系统，你可能无需先执行此步骤即可上传文件。你可以先尝试运行以下脚本，看看效果如何，然后再决定是否修改权限。如果你看到类似图中的消息，则需要进行一些调整。\n\
  \n![Image](img/11_figure_10_f.jpg)\n\n如果 PHP 因权限问题无法将上传的图像移动到 `uploads` 文件夹，你将看到如下错误消息。修复\
  \ `uploads` 的权限即可解决此问题。\n\n---\n\n### 提示\n\nUnix 用户可以使用 `chmod` 命令来调整文件夹的权限。用 Unix\
  \ 术语表示的适当权限可以是 755 或 777。\n\n---\n\n### 提示\n\n由于上传大文件可能需要较长时间，你可能还需要更改 `php.ini`\
  \ 文件中的 `max_input_time` 值，或者在脚本中使用 `set_time_limit()` 函数暂时绕过它。\n\n---\n\n### 提示\n\
  \n文件和目录权限可能相当复杂，特别是如果你以前从未处理过它们的话。如果你在执行这些步骤或运行下一个脚本时遇到问题，请搜索网络或求助于本书对应的论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）。\n\
  \n---\n\n### 使用 PHP 上传文件\n\n现在服务器已经（希望）设置为正确允许文件上传，你可以创建实际处理文件的 PHP 脚本。此类脚本分为两部分：HTML\
  \ 表单和 PHP 代码。\n\n处理文件上传所需的表单语法包含三个部分：\n\n```\n<form enctype=\"multipart/form-data\"\
  \ action=\"script.php\" method=\"post\">\n\n<input type=\"hidden\" name=\"MAX_FILE_SIZE\"\
  \ value=\"30000\" />\n\nFile <input type=\"file\" name=\"upload\" />\n```\n\n初始\
  \ `form` 标签中的 `enctype` 部分表明该表单应能处理多种类型的数据，包括文件。如果你想接受文件上传，必须包含此 `enctype`！另请注意，表单*必须使用*\
  \ POST 方法。`MAX_FILE_SIZE` 隐藏输入限制了所选文件的大小（以字节为单位），并且必须位于文件输入之前。虽然用户很容易绕过此限制，但仍应使用它。最后，文件输入类型将在表单中创建相应的按钮。\n\
