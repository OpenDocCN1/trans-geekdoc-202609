  \n使用，191–194\n\n## 附录 A：安装\n\n---\n\n感谢下载《PHP 和 MySQL 动态网站开发：Visual QuickPro 指南》（第\
  \ 4 版）的附录 A，作者 Larry Ullman（Peachpit Press，2011 年出版）。\n\n---\n\n\n\n\n\n本书所有示例的运行需要满足三个技术要求：MySQL（数据库应用程序）、PHP（脚本语言）和\
  \ Web 服务器应用程序（PHP 通过它运行）。本附录介绍了在两个不同平台（Windows 7 和 Mac OS X）上安装这些工具的方法。如果您使用的是托管网站，所有这些都已为您提供，但这些产品都是免费且易于安装的，因此在自己的计算机上安装它们仍然很有意义。\n\
  \n在介绍完安装后，附录将讨论几乎每个用户都会关心的相关问题。首先，我将介绍如何在 MySQL 中创建用户。接下来，我将演示如何测试您的 PHP 和 MySQL\
  \ 安装，展示您在第一次使用任何服务器时都会用到的技巧。然后，您将学习如何配置 PHP 以改变其运行方式。最后，本版新增内容，我将介绍如何更改 Apache Web\
  \ 服务器的行为，以满足常见需求。\n\n### Windows 平台安装\n\n虽然您当然可以在 Windows 计算机上单独安装 Web 服务器（如 Apache、Abyss\
  \ 或 IIS）、PHP 和 MySQL，但我强烈建议您使用一站式安装程序。这样做更简单、更可靠。\n\nWindows 平台上有多个一站式安装程序。最常被提及的两个是\
  \ XAMPP（**[www.apachefriends.org](http://www.apachefriends.org)**）和 WAMP（**[www.wampserver.com](http://www.wampserver.com)**）。本附录将使用\
  \ XAMPP，它可在大多数 Windows 版本上运行。\n\n除了 Apache、PHP 和 MySQL，XAMPP 还会安装：\n\n*   PEAR（PHP\
  \ 扩展与应用仓库），一个 PHP 代码库\n*   Perl，一种非常流行的编程语言\n*   phpMyAdmin，基于 Web 的 MySQL 服务器管理界面\n\
  *   邮件服务器（用于发送邮件）\n*   若干实用扩展\n\n编写本文时，XAMPP（版本 1.7.4）安装的版本为：PHP 5.3.5、MySQL 5.5.8、Apache\
  \ 2.2.17 和 phpMyAdmin 3.3.9。\n\n下面我将逐步讲解安装过程。请注意，如果您遇到任何问题，可以使用本书的支持论坛（**[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)**），但您可能更容易在\
  \ XAMPP 官网找到帮助（毕竟是他们的产品）。此外，安装程序运行良好且不难使用，因此我不会详述每一个步骤，而是重点介绍最重要的注意事项。\n\n#### 在\
  \ Windows 上安装 XAMPP\n\n**1.** 从 **[www.apachefriends.org](http://www.apachefriends.org)**\
  \ 下载最新版的 Windows 版 XAMPP。\n\n您需要点击几下才能找到下载部分，但最终您会来到一个可以找到下载 ![Image](img/circle-a.jpg)\
  \ 的区域。然后点击 *EXE*，这是您想要的特定项目。\n\n![Image](img/20_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 从 Apache Friends 网站获取最新的 Windows 安装程序。\n\n**2.** 在您的计算机上，双击下载的文件以开始安装过程。\n\n**3.**\
  \ 如果提示，请将 XAMPP 安装在 `Program Files` 目录以外的位置。\n\n> **关于防火墙**\n>\n> 防火墙会阻止通过*端口*（端口是计算机的访问入口）进行通信。从\
  \ XP Service Pack 2 开始的 Windows 版本包含内置防火墙。您也可以下载并安装第三方防火墙。防火墙提高了计算机的安全性，但也可能干扰您运行\
  \ Apache、MySQL 以及 XAMPP 使用的其他工具，因为它们都要使用端口。\n>\n> 运行 XAMPP 时，如果看到安全提示表明防火墙正在阻止 Apache、MySQL\
  \ 等，请根据使用的 Windows 版本选择“取消阻止”或“允许”。否则，您可以手动配置防火墙（例如在 Windows 7 上，通过“控制面板” > “系统和安全”进行配置）。需要开放的端口如下：80（用于\
  \ Apache）、3306（用于 MySQL）和 25（用于 Mercury 邮件服务器）。如果您在启动或访问其中任何一个时遇到问题，请禁用防火墙看看是否能工作。如果可以，您就知道是防火墙的问题，需要重新配置它。\n\
  >\n> 为了清楚起见，防火墙不仅存在于 Windows 上，但就本附录的说明而言，防火墙的存在更有可能困扰 Windows 用户，而非其他用户。\n\n您不应该将其安装在\
  \ `Program Files` 目录中，因为在某些 Windows 版本上存在权限问题。我建议将 XAMPP 安装在根目录下（例如 **`C:\\`**）。\n\
  \n无论您决定将程序安装在何处，请记下该位置，因为在学习本附录的过程中，您还需要多次用到它。\n\n**4.** 如果需要，创建桌面和“开始”菜单快捷方式 ![Image](img/circle-b.jpg)。\n\
  \n![Image](img/20_figure_02_b.jpg)\n\n![Image](img/circle-b.jpg) 选择您想要的其他安装选项。\n\
  \n**5.** 继续完成剩余提示，阅读它们并按 Enter/Return 键继续。\n\n**6.** 安装过程完成后 ![Image](img/circle-c.jpg)，点击“Yes”启动控制面板。\n\
  \n![Image](img/20_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg) XAMPP 安装完成！\n\n\
  **7.** 根据需要，使用 XAMPP 控制面板启动、停止和配置 XAMPP ![Image](img/circle-d.jpg)。\n\n![Image](img/20_figure_04_d.jpg)\n\
  \n![Image](img/circle-d.jpg) XAMPP 控制面板，用于管理软件。\n\n**8.** 根据需要，使用控制面板启动 Apache、MySQL\
  \ 和 Mercury。\n\n本书每一章都需要 Apache 运行。大约一半的章节需要 MySQL 运行。Mercury 是 XAMPP 安装的邮件服务器。要使用\
  \ PHP 发送电子邮件（参见第 11 章“Web 应用程序开发”），Mercury 必须处于运行状态。\n\n**9.** 立即为 root MySQL 用户设置密码。\n\
  \n具体操作方法将在本附录后面解释。\n\n> **提示**\n>\n> XAMPP 控制面板的各种管理链接将带您进入不同的网页（在您的服务器上）和其他资源 ![Image](img/circle-e.jpg)。\n\
  >\n> ![Image](img/20_figure_05_e.jpg)\n>\n> ![Image](img/circle-e.jpg) 从控制面板链接的\
  \ XAMPP 基于 Web 的启动页面。\n\n> **提示**\n>\n> 请参阅“PHP 配置”部分，了解如何通过编辑 **`php.ini`** 文件来配置\
  \ PHP。\n\n> **提示**\n>\n> 您的 Web 根目录（即存放 PHP 脚本以便测试的位置）是 XAMPP 安装目录下的 **`htdocs`**\
  \ 文件夹。按照这些安装说明，该路径应为 **`C:\\xampp\\htdocs`**。\n\n> **提示**\n>\n> 在 64 位 Windows 7\
  \ 上使用 XAMPP 1.7.4 启动 XAMPP 控制面板时，我始终会看到关于“状态检查失败”的错误消息。我从未找到原因，但该错误并不妨碍 XAMPP 完全正常使用。\n\
  \n### Mac OS X 平台安装\n\n虽然 Mac OS X 自带 Apache，且安装 MySQL 也不难，但我建议初学者采用一种更通用、更万无一失的方法，使用一站式\
  \ MAMP 安装程序（**[www.mamp.info](http://www.mamp.info)**）。它提供免费版和商业版，非常易于使用，且不会影响操作系统内置的\
  \ Apache 服务器。\n\n除了 Apache、PHP 和 MySQL，MAMP 还会安装 phpMyAdmin（基于 Web 的 MySQL 服务器管理界面）以及大量实用的\
  \ PHP 扩展。编写本文时，MAMP（版本 1.9.6.1）安装的版本包括 PHP 5.2.13 和 5.3.2、MySQL 5.1.44、Apache 2.0.63\
  \ 和 phpMyAdmin 3.2.5。\n\n\n\n\n\n#### 在 Mac OS X 上安装 MAMP\n\n我将在接下来的步骤中介绍安装过程。如果您遇到任何问题，可以使用本书的配套论坛\
  \ (www.LarryUllman.com/forums/)，但您可能会发现直接求助 MAMP 官网更有效（毕竟这是他们的产品）。此外，安装程序运行良好且并不难用，因此我不会详述过程中的每一步，而是重点介绍最重要的注意事项。\n\
  \n#### 在 Mac OS X 上安装 MAMP\n\n**1.** 从 www.mamp.info 下载最新版本的 MAMP。\n\n在首页上，点击 *Downloads*，然后点击\
  \ *Download: MAMP & MAMP PRO 1.9.6.1* ![Image](img/circle-a.jpg)。（随着 MAMP 新版本的发布，链接和文件名显然会相应变化。）\n\
  \n![Image](img/20_figure_06_a.jpg)\n\n![Image](img/circle-a.jpg) 从 www.mamp.info\
  \ 的此页面下载 MAMP。\n\n同一个下载文件同时包含这两个产品。事实上，MAMP Pro 只是一个用于控制和自定义同一 MAMP 软件的更友好的界面。\n\
  \n**2.** 在您的电脑上，双击下载的文件以挂载磁盘映像 ![Image](img/circle-b.jpg)。\n\n![Image](img/20_figure_07_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 下载的 MAMP 磁盘映像的内容。\n\n**3.** 将磁盘映像中的 `MAMP` 文件夹复制到您的\
  \ `Applications`（应用程序）文件夹中。\n\n如果您认为可能更倾向于商业版 MAMP PRO，请也复制该文件夹（同样，它是 MAMP 的一个界面，因此需要两个文件夹）。MAMP\
  \ PRO 附带 14 天免费试用期。\n\n无论您选择哪个文件夹，请注意您**必须**将其放置在 `Applications` 文件夹内。它不能放在子文件夹或电脑上的其他目录中。\n\
  \n**4.** 打开 `/Applications/MAMP`（或 `/Applications/MAMP PRO`）文件夹。\n\n**5.** 双击 MAMP（或\
  \ MAMP PRO）应用程序以启动程序 ![Image](img/circle-c.jpg)。\n\n![Image](img/20_figure_08_c.jpg)\n\
  \n![Image](img/circle-c.jpg) 简单的 MAMP 应用程序，用于控制和配置 Apache、PHP 和 MySQL。\n\n启动服务器可能只需片刻，但随后您将看到类似于\
  \ ![Image](img/graycircle-c.jpg)（针对 MAMP）或 ![Image](img/circle-d.jpg)（针对 MAMP PRO）的结果。\n\
  \n![Image](img/20_figure_09_d.jpg)\n\n![Image](img/circle-d.jpg) MAMP PRO 应用程序，用于控制和配置\
  \ Apache、PHP、MySQL 等。\n\n启动 MAMP 时，起始页面也应在您的默认 Web 浏览器中打开 ![Image](img/circle-e.jpg)。通过此页面，您可以查看正在运行的\
  \ PHP 版本及其配置方式，并使用 phpMyAdmin 与 MySQL 数据库进行交互。\n\n![Image](img/20_figure_10_e.jpg)\n\
  \n![Image](img/circle-e.jpg) MAMP Web 起始页面。\n\n使用 MAMP PRO，您可以通过点击 WebStart 按钮 ![Image](img/circle-d.jpg)\
  \ 访问同一页面。\n\n**6.** 要启动、停止和配置 MAMP，请使用 MAMP 或 MAMP PRO 应用程序 ![Image](img/circle-c.jpg)\
  \ 或 ![Image](img/circle-d.jpg)。\n\nMAMP 应用程序本身没有太多内容（这是一件好事），但如果您点击 Preferences（偏好设置），可以调整应用程序的行为\
  \ ![Image](img/circle-f.jpg)、设置要运行的 PHP 版本等。\n\n![Image](img/20_figure_11_f.jpg)\n\
  \n![Image](img/circle-f.jpg) 这些选项决定了启动和停止 MAMP 应用程序时会发生什么。\n\nMAMP PRO 还可以轻松创建不同的*虚拟主机*（即不同的站点；稍后在本附录中单独讨论）、调整\
  \ Apache 的配置和运行方式、使用动态 DNS、更改邮件发送方式等。\n\n**7.** 立即更改 root MySQL 用户的密码。\n\n如何执行此操作将在本附录后面解释。\n\
  \n***\n\n> **Tip**\n>\n> 就我个人而言，我很欣赏 MAMP 本身有多么出色，而且它是免费的。我也不喜欢花钱，但我发现购买 MAMP PRO\
  \ 物有所值，因为它的价格相对较低。\n\n***\n\n> **Tip**\n>\n> 请参阅“PHP 配置”部分，了解如何通过编辑 `php.ini` 文件来配置\
  \ PHP。\n\n***\n\n> **Tip**\n>\n> MAMP 还附带一个 Dashboard（仪表盘）小组件，您可以用它来控制 Apache 和\
  \ MySQL 服务器。\n\n***\n\n> **Tip**\n>\n> 您的 Web 根目录——即为了测试而放置 PHP 脚本的位置——是 MAMP 安装目录中的\
  \ `htdocs` 文件夹。对于未经修改的标准 MAMP 安装，这将是 `Applications/MAMP/htdocs`。\n\n***\n\n> **Tip**\n\
  >\n> 您可能想要将 Apache Document Root（文档根目录） ![Image](img/circle-g.jpg) 更改为主文件夹中的 `Sites`\
  \ 目录。这样做可以确保您的 Web 文档将与其他文件一起被备份（而且您正在定期进行备份，对吧？）。\n\n![Image](img/20_figure_12_g.jpg)\n\
  \n![Image](img/circle-g.jpg) MAMP 允许您更改 Web 文档的放置位置。\n\n***\n\n### 管理 MySQL 用户\n\
  \n一旦您成功安装了 MySQL，就可以开始创建 MySQL 用户。MySQL 用户是一个基本的安全概念，用于限制对存储数据的访问和影响。为了澄清，您的数据库可以有多个不同的用户，就像您的操作系统可能有多个用户一样。但\
  \ MySQL 用户不同于操作系统用户。在您自己的电脑上学习 PHP 和 MySQL 时，不一定需要创建新用户，但实际生产站点需要拥有具有适当权限的专用 MySQL\
  \ 用户。\n\n初始 MySQL 安装附带一个用户（名为 `root`），且未设置密码（使用 MAMP 时除外，MAMP 会设置默认密码为 `root`）。至少，您应该在安装\
  \ MySQL 后为 root 用户创建一个新的、安全的密码。之后，您可以创建其他权限更有限的用户。作为一条规则，您不应该将 root 用户用于正常的日常操作。\n\
  \n在接下来的几页中，我将引导您完成这两个过程。请注意，如果您使用的是托管服务器，他们很可能会为您创建 MySQL 用户。这些说明需要使用命令行 mysql 客户端或\
  \ phpMyAdmin。如果您不知道如何在电脑上访问其中任何一个，请快速阅读第 4 章“MySQL 简介”中的 *Accessing MySQL*（访问 MySQL）部分。\n\
  \n#### 设置 root 用户密码\n\n当您安装 MySQL 时，root 用户没有设置任何值——或没有安全密码。这当然是一个安全风险，应该在您开始使用服务器之前解决（因为\
  \ root 用户拥有无限权限）。\n\n只要 MySQL 服务器正在运行，您就可以使用 phpMyAdmin 或 mysql 客户端设置任何用户的密码。如果\
  \ MySQL 当前未运行，请立即使用附录前面概述的步骤启动它。\n\n其次，您必须以 root 用户身份连接到 MySQL，才能更改 root 用户的密码。\n\
  \n#### 通过 MySQL 客户端为 root 用户分配密码\n\n**1.** 连接到 MySQL 客户端。\n\n如有需要，请参阅第 4 章获取详细说明。\n\
  \n**2.** 输入以下命令，将 `thepassword` 替换为您想要使用的密码 ![Image](img/circle-a.jpg)：\n\n```\n\
  SET PASSWORD FOR 'root'@' localhost' = PASSWORD ('thepassword');\n```\n\n![Image](img/20_figure_13_a.jpg)\n\
  \n![Image](img/circle-a.jpg) 在 MySQL 客户端中使用 SQL 更新 root 用户的密码。\n\n请记住，MySQL 中的密码区分大小写，因此\
  \ `Kazan` 和 `kazan` 不能互换。`PASSWORD` 一词位于实际引用的密码之前，告诉 MySQL 加密该字符串。并且 `PASSWORD`\
  \ 和左括号之间不能有空格。\n\n**3.** 退出 MySQL 客户端：\n\n```\nexit\n```\n\n**4.** 通过再次登录 MySQL\
  \ 客户端来测试新密码。\n\n\n\n\n\n现在已经设置了密码，你需要在连接命令中添加 `-p` 标志。你将看到 `Enter password:` 提示符，输入刚刚创建的密码即可。\n\
  \n#### 通过 phpMyAdmin 为 root 用户分配密码\n\n1.  在 Web 浏览器中打开 phpMyAdmin。\n    详细说明请参阅前面的步骤。\n\
  2.  在主页上，单击“Privileges”（权限）选项卡。\n    你始终可以单击左上角的主页图标返回主页。\n3.  在用户列表中，单击 root 用户所在行的“Edit\
  \ Privileges”（编辑权限）图标 ![Image](img/circle-b.jpg)。\n    ![Image](img/20_figure_14_b.jpg)\n\
  \    ![Image](img/circle-b.jpg)phpMyAdmin 中显示的 MySQL 用户列表。\n4.  使用页面下方的“Change Password”（更改密码）表单\
  \ ![Image](img/circle-c.jpg) 来修改密码。\n    ![Image](img/20_figure_15_c.jpg)\n    ![Image](img/circle-c.jpg)phpMyAdmin\
  \ 中用于更新 MySQL 用户密码的表单。\n5.  如有必要，在 phpMyAdmin 的配置文件中更改 root 用户的密码。\n    更改 root\
  \ 用户密码的结果很可能是 phpMyAdmin 被拒绝访问 MySQL 服务器。这是因为 phpMyAdmin 在本地服务器上通常以 root 用户身份连接到\
  \ MySQL，且 root 用户的密码被硬编码在配置文件中。完成步骤 1-4 后，在 phpMyAdmin 目录中找到 `config.inc.php` 文件——通常位于\
  \ `/Applications/MAMP/bin/phpMyAdmin` (Mac OS X 配合 MAMP) 或 `C:\\xampp\\phpMyAdmin`\
  \ (Windows 配合 XAMPP)。用任意文本编辑器或 IDE 打开该文件，并将下面这行代码修改为使用新密码：\n\n```\n$cfg['Servers'][$i]['password']\
  \ = 'the_new_password';\n```\n\n    然后保存文件，并在 Web 浏览器中重新加载 phpMyAdmin。\n\n#### 创建用户和权限\n\
  \n在 MySQL 成功启动并运行后，且为 root 用户设置好密码后，你可以添加其他用户。为了提高数据库的安全性，你应该始终创建新用户来访问数据库，而不是一直使用\
  \ root 用户。\n\nMySQL 权限系统的设计是为了确保对特定数据库上的特定命令拥有适当的权限。例如，这项技术使得 Web 主机提供商可以让多个用户访问多个数据库而无需担心。MySQL\
  \ 系统中的每个用户可以在特定主机（计算机）上拥有对特定数据库的特定权限。root 用户——指 MySQL 的 root 用户，而非系统的——拥有最高权限，用于创建子用户，尽管子用户也可以被赋予类似\
  \ root 的权限（但这不建议）。\n\n当用户尝试对 MySQL 服务器执行某项操作时，MySQL 首先检查该用户是否有权连接到服务器（基于用户名、用户的主机、用户的密码以及\
  \ `mysql` 数据库 `user` 表中的信息）。其次，MySQL 检查该用户是否有权在特定数据库上运行特定的 SQL 语句——例如，选择数据、插入数据或创建新表。**表\
  \ A.1** 列出了大多数可按用户设置的各种权限。\n\n**表 A.1. MySQL 权限**\n\n![Image](img/atab01.jpg)\n\n\
  在 MySQL 中设置用户和权限有多种方法，但我将从讨论 `GRANT` 命令开始。语法如下：\n\n```\nGRANT privileges ON database.*\
  \ TO 'username'@'hostname' IDENTIFIED BY 'password';\n```\n\n对于该语句的 *privileges*（权限）部分，你可以列出来自表\
  \ A.1 的特定权限，或者使用 `ALL` 来允许所有权限（这不明智）。语句中的 `database.*` 部分指定了用户可以操作的数据库和表。你可以使用 `database.tablename`\
  \ 语法指定特定表，或使用 `*.*` 允许访问所有数据库（同样不明智）。最后，你可以指定用户名、主机名和密码。\n\n用户名的最大长度为 16 个字符。创建用户名时，请务必避免空格（改用下划线），并注意用户名区分大小写。\n\
  \n主机名是允许用户连接的计算机。这可以是域名，如 `www.example.com`，也可以是 IP 地址。通常指定 `localhost` 作为主机名，意味着\
  \ MySQL 用户必须从运行 MySQL 数据库的同一台计算机上连接。要允许任何主机，请使用主机名通配符（`%`）：\n\n```\nGRANT privileges\
  \ ON database.* TO 'username'@'%' IDENTIFIED BY 'password';\n```\n\n但这也不推荐。在创建用户时，最好明确且严格地限定范围。\n\
  \n密码没有长度限制，但同样区分大小写。密码在 MySQL 数据库中是加密存储的，这意味着无法以明文格式恢复它们。省略 `IDENTIFIED BY 'password'`\
  \ 子句将导致该用户无需输入密码即可登录（这同样应避免）。\n\n作为该过程的示例，你将创建两个拥有特定权限的新用户，作用于一个名为 `temp` 的新数据库。请记住，你只能对现有数据库授予用户权限。接下来的步骤也将展示如何创建数据库。\n\
  \n#### 创建新用户\n\n1.  以 root 用户身份登录 MySQL 客户端。\n    使用第 4 章中解释的步骤执行此操作（如果你还不知道怎么做）。你必须以具有创建数据库和其他用户权限的用户身份登录。\n\
  2.  创建 `temp` 数据库：\n\n```\nCREATE DATABASE temp;\n```\n\n    使用上述语法创建数据库非常简单。只要你以拥有适当权限的用户身份连接，此命令即可生效。\n\
  3.  创建一个在 `temp` 数据库上拥有基本权限的用户 ![Image](img/circle-d.jpg)：\n\n```\nGRANT SELECT,\
  \ INSERT, UPDATE, DELETE\nON temp.*\nTO\n'webuser'@'localhost'\nIDENTIFIED BY 'BroWs1ng';\n\
  ```\n\n    ![Image](img/20_figure_16_d.jpg)\n    ![Image](img/circle-d.jpg)创建一个可在一个数据库上执行基本任务的用户。\n\
  \    通用的 `webuser` 用户可以浏览记录（从表中 `SELECT`）、添加（`INSERT`）、修改（`UPDATE`）或 `DELETE` 记录。该用户只能从\
  \ `localhost`（同一台计算机）连接，且只能访问 `temp` 数据库。\n4.  应用更改 ![Image](img/circle-e.jpg)：\n\
  \n```\nFLUSH PRIVILEGES;\n```\n\n    ![Image](img/20_figure_17_e.jpg)\n    ![Image](img/circle-e.jpg)在尝试使用新创建的用户访问\
  \ MySQL 之前，别忘了这一步。\n    刚才所做的更改不会生效，直到你告诉 MySQL 重置可接受的用户和权限列表，这正是该命令的作用。忘记这一步，然后无法使用新创建的用户访问数据库，是一个常见错误。\n\
  \n***\n\n**提示**\n\n任何名称以 `test_` 开头的数据库，均可被任何有权连接到 MySQL 的用户修改。因此，除非确实只是实验用途，请小心不要创建以此方式命名的数据库。\n\
  \n***\n\n***\n\n**提示**\n\n`REVOKE` 命令用于移除用户和权限。\n\n***\n\n***\n\n#### 在 phpMyAdmin\
  \ 中创建用户\n\n要在 phpMyAdmin 中创建用户，首先单击 phpMyAdmin 主页上的“Privileges”（权限）选项卡。在“Privileges”页面上，单击“Add\
  \ A New User”（添加新用户）。填写“Add A New User”表单以定义用户的名称、主机、密码和权限。然后单击“Go”（执行）。这将创建一个拥有全局权限但无数据库特定权限的用户。\n\
  \n在生成的页面上，选择要应用用户权限的数据库，然后单击“Go”。在下一页中，选择该用户在该数据库上应拥有的权限，然后再次单击“Go”。这完成了为该用户在该数据库上创建权限的过程。请注意，此过程允许你轻松地为用户在不同数据库上分配不同的权限。\n\
  \n\n\n\n\n最后，返回主页的“权限”选项卡，然后点击“重新加载权限”链接。\n\n---\n\n### 测试您的安装\n\n既然您已经安装了所有内容并创建了必要的\
  \ MySQL 用户，就应该测试一下安装。可以使用两个快速的 PHP 脚本来实现此目的。如果发生了错误，您很可能已经知道了，但这些步骤将允许您在进行复杂的 PHP\
  \ 编程或 PHP 与 MySQL 编程之前，对您的（或任何其他）服务器执行测试。\n\n要运行的第一个脚本是 `phpinfo.php`。它既测试 PHP 是否已启用，又显示大量关于\
  \ PHP 安装的信息。在我看来，尽管这个脚本非常简单，但它是 PHP 开发人员编写的最重要的脚本之一，因为它提供了如此多宝贵的知识。\n\n第二个脚本将有两个用途。首先，它将查看是否已启用对\
  \ MySQL 的支持。如果没有，您需要查看本章的下一节来更改此设置。该脚本还将测试 MySQL 用户是否有权限连接到特定的 MySQL 数据库。\n\n**脚本\
  \ A.1.** `phpinfo.php` 脚本测试并报告 PHP 安装情况。\n\n---\n\n```php\n<?php\nphpinfo();\n?>\n\
  ```\n\n---\n\n#### 测试 PHP\n\n**1.** 在文本编辑器或 IDE 中创建以下 PHP 文档（**脚本 A.1**）：\n\n```php\n\
  <?php\nphpinfo();\n?>\n```\n\n`phpinfo()` 函数以表格形式返回 PHP 安装的配置信息。它是测试 PHP 是否正常工作的完美工具。\n\
  \n您可以使用几乎任何应用程序来创建 PHP 脚本，只要它能以纯文本格式保存文件即可。\n\n**2.** 将文件保存为 `phpinfo.php`。\n\n\
  您需要确保文件的扩展名仅为 `.php`。在 Windows 上使用记事本时要小心，因为它会偷偷地追加 `.txt`。同样，Mac OS X 上的 TextEdit\
  \ 想要将所有内容保存为 `.rtf`。\n\n**3.** 将文件放置在服务器上的适当目录中。\n\n什么是适当目录取决于您的操作系统和 Web 服务器。如果您使用的是托管网站，请咨询托管公司。对于安装了\
  \ XAMPP 的 Windows 用户，该目录称为 `htdocs`，位于 XAMPP 目录内。对于安装了 MAMP 的 Mac OS X 用户，默认目录称为\
  \ `htdocs`，位于 MAMP 文件夹内。\n\n**4.** 在 Web 浏览器中访问该 PHP 脚本以进行测试 ![Image](img/circle-a.jpg)。\n\
  \n![Image](img/20_figure_18_a.jpg)\n\n![Image](img/circle-a.jpg)此服务器的 PHP 配置信息。\n\
  \n在 Web 浏览器中通过访问 `http://your.url.here/phpinfo.php` 来运行此脚本。在您自己的计算机上，这可能类似于 `http://localhost/phpinfo.php`（安装了\
  \ XAMPP 的 Windows）或 `http://localhost:8888/phpinfo.php`（安装了 MAMP 的 Mac OS X）。\n\n\
  #### 测试 PHP 和 MySQL\n\n**1.** 在文本编辑器或 IDE 中创建一个新的 PHP 文档（**脚本 A.2**）：\n\n```php\n\
  <?php\nmysqli_connect('localhost',\n'webuser', 'BroWsIng', 'temp');\n?>\n```\n\n\
  此脚本将尝试使用刚才在本附录中建立的用户名和密码连接到 MySQL 服务器。\n\n**2.** 将文件保存为 `mysqli_test.php`，将其放置在\
  \ Web 服务器的适当目录中，并在 Web 浏览器中测试它。\n\n如果脚本能够连接，结果将是一张空白页面。如果无法连接，您应该会看到类似 ![Image](img/circle-b.jpg)\
  \ 的错误消息。这最可能表明 MySQL 用户的权限或提供的信息有问题（请参阅本章前面的部分）。\n\n![Image](img/20_figure_19_b.jpg)\n\
  \n![Image](img/circle-b.jpg)脚本无法连接到 MySQL 服务器。\n\n如果您看到类似 ![Image](img/circle-c.jpg)\
  \ 的错误，这意味着 PHP 未启用 MySQL 支持。请参阅本章的下一节以了解解决方案。\n\n![Image](img/20_figure_20_c.jpg)\n\
  \n![Image](img/circle-c.jpg)脚本无法连接到 MySQL 服务器，因为 PHP 未启用 MySQL 支持。\n\n---\n\n> **提示**\n\
  >\n> 出于安全原因，您不应在生产服务器上保留 `phpinfo.php` 脚本，因为它泄露了过多信息。\n\n---\n\n> **提示**\n>\n> 如果您在\
  \ Web 浏览器中运行 PHP 脚本时它试图下载该文件，则说明您的 Web 服务器无法识别该文件扩展名为 PHP。请检查您的 Apache（或其他 Web 服务器）配置以纠正此问题。\n\
  \n---\n\n> **提示**\n>\n> PHP 脚本必须始终从以 `http://` 开头的 URL 运行。它们不能直接从硬盘运行（就像您在浏览器中打开它一样）。\n\
  \n---\n\n> **提示**\n>\n> 如果 PHP 脚本无法连接到 MySQL 服务器，通常是因为权限问题。请仔细检查所使用的用户名、密码和主机，并务必确定刷新了\
  \ MySQL 权限。\n\n---\n\n**脚本 A.2.** `mysqli_test.php` 脚本测试 PHP 中的 MySQL 支持以及是否已正确设置\
  \ MySQL 用户权限。\n\n---\n\n```php\n<?php\nmysqli_connect('localhost', 'webuser',\n\
  'BroWs1ng', 'temp');\n?>\n```\n\n---\n\n### 配置 PHP\n\n在您自己的计算机上安装 PHP 的好处之一是您可以根据自己的喜好对其进行配置。PHP\
  \ 的运行方式由 `php.ini` 配置文件决定，该文件通常在安装 PHP 时创建。\n\n更改 PHP 的行为非常简单，并且很有可能在某个时候需要这样做。您只需考虑调整以下几项即可\n\
  \n- 是否开启 `display_errors`\n- 默认的错误报告级别\n- 对 Improved MySQL Extension 函数的支持\n- 用于发送邮件的\
  \ SMTP 值\n\n这些各项的含义（如果您还不知道的话）在本书的章节和 PHP 手册中都有介绍。但首先，我强烈建议您确保开启 `display_errors`\
  \ 并将错误报告设置为最高级别。\n\n更改 PHP 的配置其实很简单。简短版本是：编辑 `php.ini` 文件，然后重启 Web 服务器。但由于可能出现许多不同的问题，我将更详细地介绍配置。如果您想启用对扩展的支持（如\
  \ MySQL 函数），配置会更复杂（请参阅侧栏）。\n\n---\n\n**启用扩展支持**\n\n许多 PHP 配置选项可以通过编辑 `php.ini` 文件来更改。但启用（或禁用）扩展——换句话说，添加对扩展功能的支持——需要更多工作。要仅为单个\
  \ PHP 页面启用扩展支持，可以使用 `dl()` 函数。要为所有 PHP 脚本启用扩展支持需要一些工作。不幸的是，对于 Unix 和 Mac OS X 用户，您将需要重新编译\
  \ PHP 以支持此新扩展（这个过程不是胆小者能做的）。Windows 用户则相对容易：\n\n首先，编辑 `php.ini` 文件（请参阅本节中的步骤），移除您要启用的扩展前面的分号。例如，要启用\
  \ Improved MySQL Extension 支持，您需要找到如下行\n\n`;extension=php_mysqli.dll`\n\n并移除该分号。\n\
  \n接下来，找到设置 `extension_dir` 的行，并针对您的 PHP 安装进行调整。假设您使用 XAMPP 将 PHP 安装到了 `C:\\xampp`，那么您的\
  \ `php.ini` 文件应显示\n\n`extension_dir = \"C:/xampp/php/ext\"`\n\n这告诉 PHP 在哪里查找扩展。\n\
  \n接下来，确保实际的扩展文件（本例中为 `php_mysqli.dll`）存在于扩展目录中。\n\n\n\n\n保存 **`php.ini`** 文件并重启\
  \ Web 服务器。如果重启过程提示找不到扩展的错误，请再次检查以确保扩展存在于 `extension_dir` 中，并且路径名正确。如果问题仍然存在，请在网上搜索或使用本书对应的论坛寻求帮助。\n\
  \n---\n\n#### 修改 PHP 的配置\n\n**1.** 在 Web 浏览器中，执行一个调用 **`phpinfo()`** 函数的脚本。\n\n\
  **`phpinfo()`** 函数（在附录前一节中讨论过，参见 ![Image](img/graycircle-a.jpg)）会显示大量关于 PHP 安装的信息。\n\
  \n**2.** 在浏览器的输出中，搜索 `Loaded Configuration File` ![Image](img/circle-a.jpg)。\n\n\
  ![Image](img/20_figure_21_a.jpg)\n\n![Image](img/circle-a.jpg) 使用 `phpinfo()` 脚本来确认要编辑的活动\
  \ PHP 配置文件。\n\n此文本旁边的值即为活动配置文件的位置。这将类似于 **`C:\\xampp\\php\\php.ini`** 或 **`/Applications/MAMP/conf/php5.3/php.ini`**。您的服务器上可能有多个\
  \ **`php.ini`** 文件，但这个才是生效的那个。\n\n如果 `Loaded Configuration File` 没有值，说明您的服务器没有活动的\
  \ **`php.ini`** 文件。在这种情况下，您需要从 **[www.php.net](http://www.php.net)** 下载 PHP 源代码，以找到一个示例配置文件。\n\
  \n**3.** 用任意文本编辑器打开 **`php.ini`** 文件。\n\n如果您进入列出的目录却找不到 **`php.ini`** 文件，则需要从 PHP\
  \ 网站下载该文件（它是 PHP 源代码的一部分）。\n\n**4.** 进行您想要的任何更改，请记住以下几点：\n\n- 注释以分号标记。分号之后的任何内容都会被忽略。\n\
  - 文件中包含了关于大多数设置含义的说明。\n- 文件顶部列出了带有示例的一般信息。**请勿更改这些值！** 请在文件后面出现设置的地方进行更改。\n- 为了安全起见，请勿更改任何原始设置。只需将它们注释掉（在行首加上分号），然后在之后添加新的修改后的行。\n\
  - 添加注释（使用分号）以标记您所做的更改及时间。例如：\n\n```\n; display_errors = Off\n; Next line added by\
  \ LEU\n08/28/2011\ndisplay_errors = On\n```\n\n---\n\n**启用邮件功能**\n\nPHP **`mail()`**\
  \ 函数仅在运行 PHP 的计算机可以访问 sendmail 或其他邮件服务器时才能工作。启用 **`mail()`** 函数的一种方法是在 **`php.ini`**\
  \ 文件中设置 **`smtp`** 值（仅限 Windows）。例如，如果您的互联网服务提供商有一个可用的 SMTP 地址，这种方法就有效。遗憾的是，如果您\
  \ ISP 的 SMTP 服务器需要身份验证，则无法使用此值。\n\n对于 Windows，也有许多免费的 SMTP 服务器，如 Mercury。它随 XAMPP\
  \ 一起安装，如果您不使用 XAMPP，也可以自行安装。\n\nMac OS X 自带已安装的邮件服务器——postfix 和/或 sendmail——需要启用。请在\
  \ Google 上搜索关于在 Mac OS X 上手动启用邮件服务器的说明。\n\n或者，您可以搜索一些 PHP 代码库，了解如何使用需要身份验证的 SMTP\
  \ 服务器。\n\n---\n\n**5.** 保存 **`php.ini`** 文件。\n\n**6.** 重启您的 Web 服务器。\n\n您不必重启整台计算机，只需重启\
  \ Web 服务应用程序（Apache、IIS 等）。具体操作取决于所用的应用程序、操作系统和安装方法。Windows 用户可以使用 XAMPP 控制面板。Mac\
  \ OS X 用户可以使用 MAMP 控制面板。Unix 用户通常只需在终端窗口中输入 **`apachectl graceful`** 即可。\n\n**7.**\
  \ 重新运行 **`phpinfo.php`** 脚本，以确保更改生效。\n\n---\n\n> **Tip**\n>\n> 如果您编辑了 **`php.ini`**\
  \ 文件并重启了 Web 服务器，但更改未生效，请确保您编辑的是正确的 **`php.ini`** 文件（您的计算机上可能不止一个）。\n\n---\n\n>\
  \ **Tip**\n>\n> Mac OS X 上的 MAMP PRO 使用 **`php.ini`** 文件的模板，必须在 MAMP PRO 本身中进行编辑。要在使用\
  \ MAMP PRO 时更改 PHP 设置，请选择“文件”>“编辑模板”>“PHP ***X***.***X***.***X*** php.ini”。\n\n\
  ---\n\n### 配置 Apache\n\n本书的新版新增了本节，介绍如何配置 Apache Web 服务器。与 PHP 一样，Apache 是一项开源技术，已成为\
  \ Web 技术中的主导力量。如果您在计算机上安装了 XAMPP 或 MAMP，您现在就拥有一个功能齐全的 Apache 版本。如果您使用的是托管网站，极有可能那里也提供了\
  \ Apache。\n\n一旦安装了支持 PHP 的 Apache，许多 PHP 程序员就再不会考虑 Web 服务器的事了。但随着您继续学习 Web 开发，掌握更多\
  \ Apache 知识是合乎逻辑的下一步。\n\n您需要进一步了解 Apache 的最常见原因包括能够执行以下操作：\n\n- 创建虚拟主机\n- 添加安全套接字层\
  \ (SSL) 支持\n- 保护目录\n- 启用 URL 重写\n\n这些以及其他对 Apache 行为的更改，可以通过两种方式实现：编辑主配置文件或创建特定目录的文件。主配置文件是\
  \ **`httpd.conf`**，位于 **`conf`** 目录中，它决定了整个 Apache Web 服务器如何运行。**`.htaccess`** 文件（读作\
  \ “H-T access”）放置在 Web 目录中，用于仅影响 Apache 在该文件夹及子文件夹中的行为。\n\n一般来说，首选在 **`httpd.conf`**\
  \ 文件中进行更改，因为该文件仅在服务器每次启动时需要被 Web 服务器读取一次。相反，**.htaccess** 文件必须针对每个可能适用 **`.htaccess`**\
  \ 文件的请求，被 Web 服务器读取一次。例如，如果您有 **[www.example.com/somedir/.htaccess](http://www.example.com/somedir/.htaccess)**，对\
  \ **`www.example.com/somedir/`*`whatever`*** 的任何请求都需要读取 **`.htaccess`** 文件，以及读取可能存在于\
  \ **[www.example.com/](http://www.example.com/)** 中的 **`.htaccess`** 文件。另一方面，在共享托管环境中，不允许个人用户自定义整个\
  \ Apache 配置，但可能允许使用 **`.htaccess`** 进行仅影响其自身站点的更改。\n\n在接下来的几页中，我将解释使用这两种文件类型的一些基础知识。在此过程中，您将学习如何执行一些标准的\
  \ Apache 自定义。\n\n---\n\n> **Tip**\n>\n> 为了安全起见，建议在进行后续任何编辑之前，先备份原始的 Apache 配置文件。\n\
  \n---\n\n> **Tip**\n>\n> 在本书中，我无法充分解释如何启用 HTTPS（基于 SSL 的 HTTP），因为关键组件——获取和安装 SSL\
  \ 证书——因人而异，因服务器而异，差异太大。请在网上查找具体细节，或在我的支持论坛（**[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)**）发帖求助。如果您有一个想要启用\
  \ SSL 的托管账户，请咨询您的托管公司。\n\n---\n\n#### 创建虚拟主机\n\n当您在计算机上安装 Apache 时，Apache 被设置为服务于一个网站，例如\
  \ **[www.example.com](http://www.example.com)**。对于所服务的网站，Apache 将主机名（和/或 IP 地址）与服务器上的一个目录关联起来，称为\
  \ *Web 文档根目录*。当用户访问 **[www.example.com](http://www.example.com)** 时，Apache 会从该站点的目录提供文件\
  \ ![Image](img/circle-a.jpg)。\n\n![Image](img/20_figure_22_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ Web 服务器将 URL 或主机名与计算机上的目录或文件关联起来。\n\n\n\n但 Apache 可以通过创建*虚拟主机*轻松配置为在同一台计算机上托管多个不同的站点。建立一个或多个虚拟主机后，Apache\
  \ 就会知道：当用户请求 `www.example.com` 时，应提供来自 X 目录的文档；但请求 `www.example.net` 时，应指向来自 Y 目录的文档。\n\
  \n![Image](img/20_figure_23_b.jpg)\n\n得益于虚拟主机，计算机上的不同目录可以与不同的主机名关联。\n\n请理解，设置虚拟主机实际上并不会使\
  \ `www.example.com` 或 `www.example.net` 成为可通过互联网访问的有效域名。实现这一点需要使用 DNS（域名系统），这是一个复杂得多的主题。不过，正如以下步骤所述，您可以使用虚拟主机在自己的家用电脑上为开发项目创建不同的主机。\n\
  \n#### 创建虚拟主机\n\n**1.** 使用任意文本编辑器或 IDE 打开 `httpd.conf`。\n\n如果您在 Windows 上使用 XAMPP，要打开的文件是\
  \ `C:\\xampp\\apache\\conf\\httpd.conf`（假设 XAMPP 安装在 C 盘根目录）。如果您在 Mac OS X 上使用 MAMP，要打开的文件是\
  \ `/Applications/MAMP/conf/apache/httpd.conf`。请注意，如果您使用的是 MAMP Pro，虚拟主机是在该应用程序的控制面板中创建的。\n\
  \n**2.** 在配置文件的最末尾，添加：\n\n```\nNameVirtualHost 127.0.0.1\n```\n\n按照惯例，虚拟主机定义在配置文件的末尾（或在一个单独的配置文件中，由该文件包含）。这一行表示\
  \ Apache 应在 127.0.0.1 IP 地址上监听*基于名称的*虚拟主机（相对于基于 IP 地址的虚拟主机）。这是一个特殊的 IP 地址，始终等同于*localhost*（即这台计算机本身）。\n\
  \n视您的服务器而定，此行可能已存在于配置文件中，但前面带有一个 `#`，这使其成为注释（即使其失效）。在这种情况下，只需删除 `#` 即可。\n\n**3.**\
  \ 在下一行，添加：\n\n```\n<VirtualHost 127.0.0.1>\n</VirtualHost>\n```\n\n`VirtualHost`\
  \ 标签用于创建一个新的虚拟主机。每个开始标签都需要一个对应的结束标签。在开始标签内，指定了要监听的 IP 地址或主机名，此处为：127.0.0.1。此值必须与\
  \ `NameVirtualHost` 行中使用的值匹配。\n\n虚拟主机定义的其余部分将放在这对开始和结束标签之间。\n\n**4.** 在虚拟主机标签内，添加：\n\
  \n```\nDocumentRoot /path/to/folder\nServerName servername\n```\n\n`DocumentRoot`\
  \ 指令指示虚拟主机的 Web 根目录：换句话说，就是该站点实际文件的所在位置。在 Windows 的 XAMPP 上，此值可能是 `C:/xampp/htdocs/something`。在\
  \ Mac OS X 的 MAMP 上，此值可能是 `/Applications/MAMP/htdocs/something`。\n\n`ServerName`\
  \ 是放置*主机名*的地方：即您将在浏览器中输入以访问此站点的名称。\n\n例如，如果您想为第 17 章“示例——留言板”中的论坛站点创建一个虚拟主机，可以在\
  \ `htdocs` 中创建一个名为 `forums` 的新文件夹，并将所有适用的脚本复制到那里。然后将 `C:/xampp/htdocs/forums` 或\
  \ `/Applications/MAMP/htdocs/forums` 用作 `DocumentRoot` 值。对于 `ServerName` 值，我会使用一些有意义的名称，例如\
  \ `forums.local`：论坛站点的一个本地版本。\n\n**5.** 为 localhost 添加第二个虚拟主机：\n\n```\n<VirtualHost\
  \ 127.0.0.1>\n  DocumentRoot \"C:/xampp/htdocs\"\n  ServerName localhost\n</VirtualHost>\n\
  ```\n\n![Image](img/20_figure_24_c.jpg)\n\n添加到 Apache 配置文件末尾的新指令。\n\n前面的步骤创建了一个新的虚拟主机，但在此过程中，原来的那个网站（*localhost*，您自己计算机的默认值）将变得不可用。解决方法是为该站点再创建一个虚拟主机。\n\
  \n**6.** 保存配置文件。\n\n**7.** 重启 Apache。\n\n对配置文件的任何更改，只有在重启 Web 服务器后才会生效。您可以使用 XAMPP\
  \ 或 MAMP 控制面板重启 Apache。\n\n如果配置文件中有错误，Apache 将无法启动，您需要检查错误日志以查明原因。\n\n请注意，您目前还无法使用浏览器访问虚拟主机，因为您仍需更新计算机的\
  \ hosts 列表。\n\n***\n\n提示\n\n默认的 Apache 配置文件 `httpd.conf` 中包含注释，说明每段代码的作用。您可以浏览它来了解一些关于配置\
  \ Apache 的知识。\n\n***\n\n提示\n\n如果 `DocumentRoot` 值（或 `httpd.conf` 文件中的任何值）包含空格，则必须加上引号。\n\
  \n***\n\n提示\n\n虚拟主机的定义可以包含其他指令，但我正试图以尽可能简单的方式介绍这些基本的 Apache 概念。\n\n***\n\n提示\n\n\
  实际上，最好让 Apache 仅监听特定端口（通常是 80）上的活动。在这种情况下，虚拟主机配置将以如下方式开始：\n\n```\nNameVirtualHost\
  \ 127.0.0.1:80\n<VirtualHost 127.0.0.1:80>\n```\n\n但由于 Mac OS X 上的 MAMP 和 XAMPP\
  \ 视可能的冲突而定，并不总是使用端口 80，所以我使用的是最万无一失的代码。\n\n***\n\n提示\n\n在全规模的 Web 服务器上，最好创建多个配置文件，然后由主配置文件读取并使用。在您自己的个人电脑上，如果没有太多自定义需求，单个配置文件就足够了。\n\
  \n***\n\n##### 更新计算机的 Hosts 文件\n\n前面的步骤序列在 Apache 中创建了一个虚拟主机，允许您通过在 Web 浏览器中访问 `http://forums.local`\
  \ 来浏览本例中的论坛网站。然而，这里有个问题：如果您在浏览器中输入该 URL，浏览器会尝试在互联网上寻找 `forums.local`，但无法找到。\n\n\
  ![Image](img/20_figure_25_d.jpg)\n\nInternet Explorer 在找不到本地虚拟主机时显示的错误。\n\n#####\
  \ 更新计算机的 Hosts 文件\n\n**1.** 使用任意文本编辑器或 IDE 打开计算机的 `hosts` 文件。\n\n这是整个过程中唯一棘手的部分：找到并打开\
  \ `hosts` 文件。在 Mac OS X 和 Unix 上，hosts 文件是 `/etc/hosts`（没有文件扩展名），其中 `/` 指代计算机的根目录。在\
  \ Mac OS X 上，`/etc` 是一个*隐藏*目录，这使得 `hosts` 成为一个隐藏文件。有三种简单的方法可以找到此文件：\n\n- 如果您的编辑应用程序能够打开隐藏文件，请直接用它打开。\n\
  - 在 Finder 中，选择“前往”>“前往文件夹”，在提示框中输入 `/etc` 以在 Finder 中打开 `/etc` 目录。然后将 `hosts` 文件拖动到\
  \ Dock 中的编辑应用程序图标上。\n\n![Image](img/20_figure_26_e.jpg)\n\nFinder 的“前往”>“前往文件夹”选项可用于访问隐藏目录。\n\
  \n- 使用终端查找并打开该文件。\n\n\n\n\n在 Windows 上，除非是非标准安装，相关文件是 `C:\\Windows\\System32\\drivers\\\
  etc\\hosts`。不幸的是，你在尝试编辑此文件时可能会遇到权限问题。我通过以管理员模式打开记事本（在开始菜单中右键单击记事本以获取此选项 ![Image](img/circle-f.jpg)），然后在记事本中打开该文件，成功解决了该问题。\n\
  \n![Image](img/20_figure_27_f.jpg)\n\n![Image](img/circle-f.jpg)你可以以管理员模式打开记事本，以便编辑系统文件。\n\
  \n**2.** 在文件最末尾，添加：\n\n```\n127.0.0.1 forums.local\n```\n\n这将名称 `forums.local` 与\
  \ IP 地址 `127.0.0.1` 关联起来，即同一台计算机。\n\n**3.** 保存文件。\n\n**4.** 在 Web 浏览器中加载 `http://forums.local`\
  \ ![Image](img/circle-g.jpg)。\n\n![Image](img/20_figure_28_g.jpg)\n\n![Image](img/circle-g.jpg)论坛站点，可通过\
  \ URL `http://forums.local` 在本地访问。\n\n---\n\nTip\n\n重复这两个步骤序列——在 Apache 中创建虚拟主机并将主机添加到\
  \ hosts 文件——每当你想要创建一个带有自己关联主机名的新 Web 站点项目时。\n\n---\n\n#### 使用 .htaccess 文件\n\n如前所述，所有\
  \ Apache 配置实际上都可以在 `httpd.conf` 文件中完成。事实上，这样做是首选。但配置文件并不总是可供你编辑，因此了解如何使用 `.htaccess`\
  \ 文件来更改站点功能也很有价值。\n\n`.htaccess` 文件只是一个纯文本文件，名为 `.htaccess`（同样，没有文件扩展名，且开头的句点使其成为隐藏文件）。当放置在\
  \ Web 目录中时，`.htaccess` 文件中定义的指令将应用于该目录及其子目录。\n\n使用 `.htaccess` 文件时常见的障碍是，必须授予权限以允许\
  \ `.htaccess` 更改服务器行为。根据安装和配置，在最严格的安全级别下，Apache 不允许 `.htaccess` 文件更改 Apache 行为。这在\
  \ `httpd.conf` 中通过如下代码实现：\n\n```\n<Directory />\n  AllowOverride None\n</Directory>\n\
  ```\n\n`Directory` 指令用于在 `httpd.conf` 中修改 Apache 在特定目录中的行为。在上述代码中，根目录（`/`）是目标，这意味着\
  \ Apache 根本不允许计算机上任何目录中进行覆盖——更改。因此，在创建 `.htaccess` 文件之前，主配置文件必须设置为允许在适用的 Web 目录（或目录）中进行覆盖。\n\
  \n`AllowOverride` 指令接受一个或多个标志，指示具体可以覆盖什么：\n\n* `AuthConfig`，用于授权和认证\n* `FileInfo`，用于执行重定向和\
  \ URL 重写\n* `Indexes`，用于列出目录内容\n* `Limit`，用于限制对目录的访问\n* `Options`，用于设置目录行为，例如执行\
  \ CGI 脚本或索引文件夹内容的能力\n* `All`\n* `None`\n\n---\n\n**设置默认目录页面**\n\n通常，Web 浏览器在请求时不指定文件，例如\
  \ `www.example.com/` 或 `www.example.com/folder/`。在这种情况下，Apache 必须决定做什么。历史上，如果目录中存在\
  \ `index.htm` 或 `index.html` 文件，Apache 会提供该文件。如果不存在索引文件，且服务器允许目录浏览，Apache 将改为显示目录中的文件列表（这不安全，但你无疑以前在网上见过）。\n\
  \n在这种情况下告诉 Apache 该做什么的适用指令是 `DirectoryIndex`。在其后，列出用作文件夹索引的文件，多个选项按优先顺序排列。例如，以下配置将尝试加载\
  \ `index.htm`，如果不存在则加载 `index.html`，如果仍不存在则加载 `index.php`：\n\n```\nDirectoryIndex\
  \ index.htm index.html index.php\n```\n\n同样，`ErrorDocument` 指令告诉 Apache 发生服务器错误时提供什么文件。其语法是：\n\
  \n```\nErrorDocument error_code /page.html\n```\n\n错误代码值来自服务器状态代码，例如 401（未授权）、403（禁止）和\
  \ 500（内部服务器错误）。对于每个代码，你可以指定应提供的页面。注意，你需要为错误文件提供绝对路径（即以 `/` 开头，这是 Web 根目录）。\n\n---\n\
  \n例如，要允许在 forums 目录（刚创建）中覆盖 `AuthConfig` 和 `FileInfo`，`httpd.conf` 文件应包含：\n\n```\n\
  <Directory /path/to/forums>\n  AllowOverride AuthConfig FileInfo\n</Directory>\n\
  ```\n\n只要这段代码位于任何 `AllowOverride None` 块之后，`forums` 目录中的 `.htaccess` 文件就能在从该目录（及其子目录）提供文件时对\
  \ Apache 的行为进行一些更改。\n\n##### 允许 .htaccess 覆盖\n\n**1.** 在任意文本编辑器或 IDE 中打开 `httpd.conf`。\n\
  \n**2.** 在相关站点的 `VirtualHost` 标签内，添加：\n\n```\n<Directory /path/to/directory>\n</Directory>\n\
  ```\n\n`Directory` 标签是自定义 Apache 在特定目录或其子目录中行为的方式。在开始标签中，提供目标目录的绝对路径，例如 `C:\\xampp\\\
  htdocs\\somedir` 或 `/Applications/MAMP/htdocs/somedir`。\n\n**3.** 在 `Directory`\
  \ 标签内，添加 ![Image](img/circle-h.jpg)：\n\n```\nAllowOverride All\n```\n\n![Image](img/20_figure_29_h.jpg)\n\
  \n![Image](img/circle-h.jpg)更新后的虚拟主机配置，现在允许在 forums Web 目录中进行覆盖。\n\n这是一个激进的解决方案，但行之有效。在公开可用的实时服务器上，你需要更具体地说明可以覆盖的确切设置，但在你的家用电脑上，这不会有问题。\n\
  \n**4.** 保存配置文件。\n\n**5.** 重启 Apache。\n\n---\n\nTip\n\n`Directory` 指令不必放在相关站点的 `VirtualHost`\
  \ 标签内，但放在那里是合理的。\n\n---\n\n---\n\nTip\n\n如果不允许目录覆盖某项设置，`.htaccess` 文件将被忽略。\n\n---\n\
  \n---\n\nTip\n\n在 `.htaccess` 文件中完成的任何操作，也可以通过 `httpd.conf` 中的 `Directory` 标签来实现。\n\
  \n---\n\n#### 受保护的目录\n\n`.htaccess` 文件的一个常见用途是保护目录的内容。有两种可能的场景：\n\n* 拒绝所有访问\n* 将访问限制为授权用户\n\
  \n虽然最初听起来很奇怪，但在 Web 目录中放置的文件和文件夹应该不可用的情况有很多。例如，你可以创建一个包含敏感 PHP 脚本的 `includes` 目录，或一个用于存储上传文件的\
  \ `uploads` 目录。在这两种情况下，目录的内容都不打算供直接访问，而是由其他目录中的 PHP 脚本根据需要引用该内容。要拒绝对某个目录的所有访问，请将\
  \ **脚本 A.3** 中的代码放在该文件夹中的 `.htaccess` 文件中（注释指示每行的作用）。\n\n同样，这段代码只是防止通过 Web 浏览器直接访问该目录的内容。PHP\
  \ 脚本仍可使用 `include()`、`require()`、`readfile()` 和其他函数访问该内容。事实上，第 11 章 中的 `show_image.php`\
  \ 脚本正是如此：它充当*代理脚本*，显示存储在 Web 文档根目录之外的图像（即在 Web 浏览器中原本不可用）。\n\n\n\n\n### 脚本 A.3\n\
  \n此代码位于 `.htaccess` 文件中，将拒绝对目录及其子目录内容的所有访问。\n\n```\n### Disable directory browsing:\n\
  Options All -Indexes\n\n### Prevent folder listing:\nIndexIgnore *\n\n### Prevent\
  \ access to any file:\n<FilesMatch \"^.*$\">\nOrder Allow,Deny\nDeny from all\n\
  </FilesMatch>\n```\n\n有几种方法可以将访问限制为授权用户，其中 `mod_auth` 模块是最基础且最常用的。该模块会在浏览器中创建提示，用户可在其中输入凭据。Apache\
  \ 会将这些凭据与服务器上文件中存储的凭据进行比较，据此允许或拒绝访问。使用 `mod_auth` 并不难，但你必须调用一个辅助 Apache 工具来创建凭据文件。如果你想采用这种方式，只需在网上搜索\
  \ Apache `mod_auth` 即可。\n\n![Image](img/20_figure_30_i.jpg)\n\n此提示（如在 Windows Internet\
  \ Explorer 中显示）由 Apache 生成，用于将访问限制为经过身份验证的用户。\n\n> **提示**\n>\n> 默认情况下，Apache 不会在\
  \ Web 浏览器中显示 `.htaccess` 文件，这是一种明智的安全做法。\n\n> **提示**\n>\n> 创建 `.htaccess` 文件时，请确保你的文本编辑器或\
  \ IDE 没有偷偷添加 `.txt` 扩展名。例如，记事本就会这样做。如果你能在 Web 浏览器中加载 `www.example.com/.htaccess.txt`，就能确认发生了这种情况。在记事本中，你可以通过给文件名加引号并将保存类型设为“所有文件”来防止添加扩展名。\n\
  \n### 启用 URL 重写\n\n本附录要讨论的最后一个主题是如何执行 *URL 重写*。URL 重写作为 *搜索引擎优化* (SEO) 过度关注的一部分而受到关注，但\
  \ URL 重写多年来一直是一个有用的工具。对于动态驱动的网站（如电子商务商店），通常会在 URL 中向页面传递一个值以指示要显示的产品类别，从而产生类似 `www.example.com/category.php?id=23`\
  \ 的 URL。PHP 脚本 `category.php` 随后会使用 `$_GET['id']` 的值来知道从数据库中提取并显示什么产品（本书中有大量类似示例）。\n\
  \n应用 URL 重写后，浏览器中显示的 URL、最终用户可见的 URL 以及搜索引擎结果中引用的 URL，可以转换为更具明显含义的内容，例如 `www.example.com/category/23/`，或者更好的是\
  \ `www.example.com/category/garden+gnomes/`。Apache 通过 URL 重写，获取更友好的用户 URL 并将其解析为\
  \ PHP 脚本可用的内容。这得益于 Apache `mod_rewrite` 模块。要使用它，`.htaccess` 文件必须首先检查该模块并开启重写引擎：\n\
  \n```\n<IfModule mod_rewrite.c>\nRewriteEngine on\n</IfModule>\n```\n\n启用引擎后，在结束\
  \ `IfModule` 标签之前，添加规定重写规则的指令。语法如下：\n\n```\nRewriteRule match rewrite\n```\n\n例如，你可以执行以下操作（尽管这不是\
  \ `mod_rewrite` 的好用法）：\n\n```\nRewriteRule somepage.php otherpage.php\n```\n\n执行\
  \ URL 重写的部分复杂性在于，需要 Perl 兼容正则表达式 (PCRE) 以最灵活地查找匹配项。如果你还不熟悉正则表达式，则需要阅读 第 14 章 “Perl\
  \ 兼容正则表达式” 才能理解后续内容。\n\n例如，要将 `www.example.com/category/23` 视为 `www.example.com/category.php?id=23`，你需要以下规则：\n\
  \n```\nRewriteRule ^category/([0-9]+)/?$ category.php?id=$1\n```\n\n起始脱字符 (`^`)\
  \ 表示表达式必须匹配字符串的开头。随后应为单词 *category*，后跟一个斜杠。然后是任意数量的数字，最后以一个可选斜杠结尾（允许 *category/23*\
  \ 和 *category/23/* 两种形式）。美元符号结束匹配，意味着可选斜杠后不能有任何内容。这就是示例匹配的模式（实际上这是一个非常简单的模式）。\n\n\
  重写部分是实际将被执行的内容，Web 浏览器和最终用户对此不知情。在此行中，即 `category.php?id=$1`。*$1* 是对匹配中第一个括号分组的\
  \ *反向引用*（例如 23）。因此，服务器将 `www.example.com/category/23` 视为 URL 实际为 `www.example.com/category.php?id=23`。\n\
  \n这是 `mod_rewrite` 的基本前提。不幸的是，精通 `mod_rewrite` 需要精通或近乎精通 PCRE，这可能令人望而生畏。如果你想练习这一点，可以获取刚才解释的简单示例，并将其应用于本书中通过\
  \ URL 传递值的任何示例。例如，在 第 10 章 “常见编程技术” 中，用户 ID 会通过 URL 传递给 `delete_user.php` 和 `edit_user.php`。两者都可以转换为更“美观”的\
  \ URL，例如 `www.example.com/delete/45/` 或 `www.example.com/edit/895/`。\n\n一如既往，如果你感兴趣，请在网上搜索更多关于此主题的信息，如果遇到问题，请在支持论坛\
  \ (**[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)**) 提问。\n\n\
  ### 更改 PHP 的配置\n\n如果 PHP 作为 Apache 模块运行，你也可以使用 Apache `.htaccess` 文件更改 PHP 在特定目录中的运行方式。要使用的指令是\
  \ `php_flag` 和 `php_value`：\n\n```\nphp_flag item value\nphp_value item value\n\
  ```\n\n`php_flag` 指令用于任何具有开或关值的设置；`php_value` 用于任何其他设置。例如：\n\n```\nphp_flag display_errors\
  \ on\nphp_value error_reporting 30719\n```\n\n请注意，你不能使用 PHP 常量，例如用于最高级别错误报告的 `E_ALL`，因为此代码位于\
  \ Apache 配置文件中，而非 PHP 脚本中。\n\n（你也可以通过编辑 `httpd.conf` 文件来更改 PHP 的运行方式，但如果你要进行全局服务器更改，反正都需要重启\
  \ Apache，那么不如直接编辑 PHP 配置文件）。\n\n"
