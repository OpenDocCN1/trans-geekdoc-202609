  ```\n\n头部文件的下一步是从数据库中检索给定语言的所有关键词。\n\n## 6. 如果查询未返回记录，则获取默认词汇\n\n```php\nif (mysqli_num_rows($r)\
  \ == 0) {\n    $_SESSION['lid'] = 1;\n    $q = \"SELECT * FROM words WHERE lang_id\
