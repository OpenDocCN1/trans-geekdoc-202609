  > **提示**\n>\n> 函数 `mysqli_fetch_assoc()` 等同于 `mysqli_fetch_array($r, MYSQLI_ASSOC);`。\n\
  \n---\n\n> **提示**\n>\n> 与任何关联数组一样，当你从数据库检索记录时，必须严格按照数据库或查询中的列名或别名来引用所选列。也就是说，键名**区分大小写**。\n\
  \n---\n\n> **提示**\n>\n> 如果你遇到需要在 `while` 循环内部运行第二个查询的情况，请务必为该查询使用不同的变量名。例如，内部查询应使用\
  \ `$r2` 和 `$row2`，而不是 `$r` 和 `$row`。如果不这样做，你会遇到逻辑错误。\n\n---\n\n> **提示**\n>\n> 我有时会看到初学者混淆获取查询结果的过程。请记住，你必须使用\
  \ `mysqli_query()` 执行查询，然后使用 `mysqli_fetch_array()` 来检索单行信息。如果你有多行需要检索，请使用 `while`\
  \ 循环。\n\n---\n\n### 确保 SQL 安全\n\n关于 PHP 的数据库安全性归结为三大问题：\n\n**1.** 保护 MySQL 访问信息\n\
  \n**2.** 不泄露过多关于数据库的信息\n\n**3.** 运行查询时保持谨慎，特别是涉及用户提交数据的查询\n\n你可以通过将 MySQL 连接脚本放在\
  \ Web 目录之外来实现第一个目标，这样它就永远无法通过 Web 浏览器查看（参见 ![Image](img/graycircle-c.jpg) \"连接到\
  \ MySQL\"）。本章前面已对此进行了详细讨论。第二个目标通过不让用户看到 PHP 的错误消息或你的查询来实现（在这些脚本中，这些信息是为你的调试目的而打印的；在实际网站上你绝不希望这样做）。\n\
  \n对于第三个目标，你可以并且应该采取许多步骤，所有步骤都基于**永不信任用户提供的数据**这一前提。首先，验证是否已提交某个值，或者其类型是否正确（数字、字符串等）。其次，使用正则表达式确保提交的数据符合你的预期（该主题将在\
  \ 第 14 章 \"Perl 兼容正则表达式\" 中介绍）。第三，你可以对某些值进行类型转换以确保它们是数字（将在 第 13 章 \"安全方法\" 中讨论）。第四个建议是将用户提交的数据通过\
  \ `mysqli_real_escape_string()` 函数处理。该函数通过转义可能有问题的字符，使数据在查询中使用时变得安全。用法如下：\n\n```php\n\
  $safe = mysqli_real_escape_string($dbc, data);\n```\n\n要了解为什么这很有必要，请参见 ![Image](img/graycircle-e.jpg)\
  \ \"执行简单查询\"。用户姓氏中的撇号使查询在语法上无效：\n\n```sql\nINSERT INTO users (first_name, last_name,\
  \ email, pass, registration_date) VALUES ('Peter', 'O'Toole', 'pete@example.net',\
  \ SHA1('aPass8'), NOW())\n```\n\n在这个特定示例中，有效的用户数据破坏了查询，这是不好的。但如果你的 PHP 允许这种可能性，恶意用户可以故意提交有问题的字符（撇号只是一个例子）来入侵或破坏你的数据库。出于安全考虑，`mysqli_real_escape_string()`\
  \ 应用于表单中的**每一个**文本输入。为了演示这一点，让我们改造 `register.php`（脚本 9.3）。\n\n#### 使用 mysqli_real_escape_string()\n\
