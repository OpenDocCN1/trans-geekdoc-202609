  其唯一参数是要执行的 SQL 命令，我通常会预先将其赋值给一个单独的变量：\n\n```\n$q = 'SELECT * FROM tablename';\n\n\
  $mysqli->query($q);\n```\n\n您可以将方法调用用作条件，以测试查询是否无错误执行：\n\n```\nif ($mysqli->query($q))\
