  \n***\n\n### Tip\n\n除加密字段（如密码）外，表单输入和正则表达式的最大长度应与数据库中列的最大长度相对应。\n\n***\n\n### 激活账户\n\
  \n正如本章前面“激活流程”侧边栏所述，每个用户必须在能够登录之前激活其账户。成功注册后，用户将收到一封包含指向 `activate.php` 链接的电子邮件。该链接还向此页面传递两个值：用户注册的电子邮件地址和唯一的激活码。为完成注册流程——激活账户，用户需要点击该链接，从而访问网站上的\
  \ `activate.php` 脚本。\n\n![Image](img/18_figure_20_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 注册确认邮件。\n\n`activate.php` 脚本首先需要确认这两个值已在 URL 中接收到。然后，如果接收到的两个值与数据库中存储的值匹配，将从记录中移除激活码，表明账户已激活。\n\
  \n#### 创建激活页面\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 脚本，命名为 `activate.php`（**脚本 18.7**）：\n\
  \n```php\n<?php # Script 18.7 - activate.php\n\nrequire ('includes/config.inc.php');\n\
  \n$page_title = 'Activate Your Account';\n\ninclude ('includes/header.html');\n\
  ```\n\n**2.** 验证页面应接收的值：\n\n```php\nif (isset($_GET['x'], $_GET['y'])\n    && filter_var($trimmed['email'],\
  \ FILTER_VALIDATE_EMAIL)\n    && (strlen($_GET['y']) == 32)\n) {\n```\n\n**脚本 18.7.**\
  \ 要激活账户，用户必须访问此页面，并传递其电子邮件地址和激活码（均为注册时发送的邮件链接的一部分）。\n\n***\n\n```php\n1   <?php\
  \ # Script 18.7 - activate.php\n2   // This page activates the user's\n3       account.\n\
  4   require ('includes/config.inc.php');\n5   $page_title = 'Activate Your Account';\n\
  6   include ('includes/header.html');\n7\n8   // If $x and $y don't exist or aren't\
  \ of\n9       the proper format, redirect the user:\n10  if (isset($_GET['x'], $_GET['y'])\n\
  11      && filter_var($_GET['x'],\n12          FILTER_VALIDATE_EMAIL)\n13      &&\
  \ (strlen($_GET['y']) == 32)\n14      ) {\n15\n16      // Update the database...\n\
  17      require (MYSQL);\n18      $q = \"UPDATE users SET active=NULL\n19      \
  \    WHERE (email='\" . mysqli_real_\n20          escape_string($dbc, $_GET['x'])\
  \ . \"'\n21          AND active='\" . mysqli_real_escape_\n22          string($dbc,\
  \ $_GET['y']) . \"') LIMIT\n23          1\";\n24      $r = mysqli_query ($dbc, $q)\
  \ or\n25          trigger_error(\"Query: $q\\n<br />MySQL\n26          Error: \"\
  \ . mysqli_error($dbc));\n27\n28      // Print a customized message:\n29      if\
  \ (mysqli_affected_rows($dbc) == 1) {\n30          echo \"<h3>Your account is now\n\
  31              active. You may now log in.</h3>\";\n32      } else {\n33      \
  \    echo '<p class=\"error\">Your account\n34              could not be activated.\
  \ Please\n35              re-check the link or contact the\n36              system\
  \ administrator.</p>';\n37      }\n38\n39      mysqli_close($dbc);\n40\n41  } else\
  \ { // Redirect.\n42\n43      $url = BASE_URL . 'index.php'; //\n44          Define\
  \ the URL.\n45      ob_end_clean( ); // Delete the buffer.\n46      header(\"Location:\
  \ $url\");\n47      exit( ); // Quit the script.\n48\n49  } // End of main IF-ELSE.\n\
  50\n51  include ('includes/footer.html');\n52  ?>\n```\n\n***\n\n如前所述，当用户点击注册确认邮件中的链接时，两个值将传递给此页面：电子邮件地址和激活码。在尝试使用它们执行激活用户账户的查询之前，两个值都必须存在并经过验证。\n\
  \n第一步是确保两个值均已设置。由于 `isset()` 函数可以同时检查多个变量的存在，因此验证条件的第一部分是 `isset($_GET['x'], $_GET['y'])`。\n\
  \n第二，`$_GET['x']` 必须符合有效电子邮件地址的格式。注册脚本中使用的相同代码可用于此目的（Filter 扩展或正则表达式均可）。\n\n第三，对于\
  \ `y`（激活码），条件中的最后一句检查该字符串的长度是否正好为 32。`md5()` 函数创建激活码，总是返回长度为 32 字符的字符串。\n\n**3.**\
  \ 尝试激活用户账户：\n\n```php\nrequire (MYSQL);\n\n$q = \"UPDATE users SET active=NULL WHERE\
  \ (email='\" . mysqli_real_escape_string($dbc, $_GET['x']) . \"' AND active='\"\
  \ . mysqli_real_escape_string($dbc, $_GET['y']) . \"') LIMIT 1\";\n\n$r = mysqli_query\
  \ ($dbc, $q) or trigger_error(\"Query: $q\\n<br />MySQL Error: \" . mysqli_error($dbc));\n\
  ```\n\n如果步骤 2 中的所有三个条件均为 TRUE，则运行一条 `UPDATE` 查询。该查询通过将 `active` 列设置为 `NULL` 来移除用户记录中的激活码。在查询中使用这些值之前，两者都通过\
  \ `mysqli_real_escape_string()` 进行处理以增强安全性。\n\n**4.** 报告查询执行结果：\n\n```php\nif (mysqli_affected_rows($dbc)\
  \ == 1) {\n    echo \"<h3>Your account is now active. You may now log in.</h3>\"\
  ;\n} else {\n    echo '<p class=\"error\">Your account could not be activated. Please\
  \ re-check the link or contact the system administrator.</p>';\n}\n```\n\n如果查询影响了一行，则用户账户现已激活，并显示相应消息。如果未影响任何行，则通知用户出现问题。这最可能发生在有人尝试伪造\
  \ `x` 和 `y` 值，或从电子邮件到 Web 浏览器的链接跟踪存在问题时。\n\n![Image](img/18_figure_21_b.jpg)\n\n\
  ![Image](img/circle-b.jpg) 如果数据库能使用提供的电子邮件地址和激活码进行更新，则通知用户其账户现已激活。\n\n![Image](img/18_figure_22_c.jpg)\n\
  \n![Image](img/circle-c.jpg) 如果查询未激活账户，则告知用户该问题。\n\n**5.** 完成主条件结构：\n\n```php\n\
  mysqli_close($dbc);\n\n} else { // Redirect.\n\n    $url = BASE_URL . 'index.php';\n\
  \n    ob_end_clean( );\n\n    header(\"Location: $url\");\n\n    exit( );\n\n} //\
  \ End of main IF-ELSE.\n```\n\n\n\n\n`else` 子句在 `$_GET['x']` 和 `$_GET['y']` 的值和长度不正确时生效。在这种情况下，用户只会被重定向到索引页面。这里的\
  \ `ob_end_clean()` 行会删除缓冲区（即截至此时存储在内存中、准备发送给 Web 浏览器的任何内容），因为它将不再被使用。\n\n**6.**\
  \ 完成页面：\n\n```php\ninclude ('includes/footer.html');\n?>\n```\n\n**7.** 将文件保存为 `activate.php`，将其放在您的\
  \ Web 目录中，然后通过点击注册邮件中的链接来测试它。\n\n***\n\n### 提示\n\n如果您想宽容一些，可以让此页面在未接收到正确值时打印一条错误消息，而不是将他们重定向到索引页面（就像他们试图入侵网站一样）。\n\
  \n***\n\n### 提示\n\n我特意在 URL 中使用模糊的 `x` 和 `y` 作为名称，这是出于安全考虑。虽然有人可能会猜出其中一个是电子邮件地址，另一个是代码，但有时最好不明确指出这些细节。\n\
  \n***\n\n### 提示\n\n另一种方法（我在本书第二版中使用过）是将激活码和用户的 ID（来自数据库）放在链接中。这也行得通，但从安全角度来看，最好让用户永远看不到，甚至不知道本不该公开的用户\
  \ ID。\n\n***\n\n**脚本 18.8。** 登录页面会在将用户 ID、名字和访问级别注册到会话后，将用户重定向到主页。\n\n***\n\n###\
