  \ content. -->\n<!-- Script 9.1 - header.html -->\n```\n\n**5.** 在 Web 浏览器中运行 `index.php`\
  \ 以测试新的头部文件。\n\n![Image](img/09_figure_01_a.jpg)\n\n带有新导航链接的动态生成主页。\n\n> **提示**\n\
  >\n> 有关该网站结构的预览，请参阅下一节中的侧边栏“组织文档”。\n\n> **提示**\n>\n> 请记住，你可以为模板文件使用任何文件扩展名，包括 `.inc`\
  \ 或 `.php`。\n\n> **警告：请阅读此内容！**\n>\n> 过去十年间，PHP 和 MySQL 经历了许多变化。其中，对本章最重要的一点，也是对本书其余部分最重要的一点之一，涉及使用哪些\
  \ PHP 函数与 MySQL 通信。多年来，PHP 开发者使用标准 MySQL 函数（称为 `mysql` 扩展）。自 PHP 5 和 MySQL 4.1 起，你可以使用更新的\
  \ Improved MySQL 函数（称为 `mysqli` 扩展）。这些函数提供了更好的性能，并利用了新增功能（以及其他优势）。\n>\n> 既然本书假设你至少使用\
  \ PHP 5 和 MySQL 5，所有示例将仅使用 Improved MySQL 函数。*如果你的服务器不支持此扩展，你将无法按原样运行这些示例！* 本书其余部分的大多数示例对你也将无法运行。\n\
  >\n> 如果你使用的服务器或家用电脑不支持 Improved MySQL 函数，你有三个选择：升级 PHP 和 MySQL，阅读本书第二版（主要教授并使用旧函数），或学习如何使用旧函数并相应修改所有示例。如有疑问或问题，请参阅本书对应的论坛（www.LarryUllman.com/forums/）。\n\
  \n### 连接到 MySQL\n\n与 MySQL 交互的第一步——连接到服务器——需要适当命名的 `mysqli_connect()` 函数：\n\n```php\n\
  $dbc = mysqli_connect(hostname, username, password, db_name);\n```\n\n发送给该函数的前三个参数（主机名、用户名和密码）基于\
  \ MySQL 中建立的用户和权限（详见附录 A“安装”）。通常（但不总是）情况下，主机值为 `localhost`。\n\n第四个参数是要使用的数据库名称。这相当于在\
  \ mysql 客户端中输入 `USE databasename`。\n\n如果连接成功，`$dbc` 变量（即 *database connection* 的简写，但你当然可以使用任何你想要的名称）将成为你后续所有数据库交互的引用点。大多数用于处理\
  \ MySQL 的 PHP 函数都将把此变量作为其第一个参数。\n\n如果发生连接问题，你可以调用 `mysqli_connect_error()`，它返回连接错误消息。它不接受参数，因此调用方式如下：\n\
  \n```php\nmysqli_connect_error();\n```\n\n一旦连接到数据库，你应该设置交互的编码。自 PHP 5.0.5 起，你可以使用\
  \ `mysqli_set_charset()` 函数来实现：\n\n```php\nmysqli_set_charset($dbc, 'utf8');\n```\n\
  \n用作编码的值——即第二个参数——应与你的 PHP 脚本编码和数据库的排序规则相匹配（有关 MySQL 排序规则的更多信息，请参见第 6 章“数据库设计”）。如果未能执行此操作，所有数据将使用默认字符集传输，这可能会导致问题。\n\
  \n要开始将 PHP 与 MySQL 结合使用，让我们创建一个专门的脚本来建立连接。其他需要 MySQL 连接的 PHP 脚本可以包含此文件。\n\n####\
  \ 连接并选择数据库\n\n**1.** 在文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `mysqli_connect.php`（脚本 9.2）：\n\
  \n```php\n<?php # Script 9.2 - mysqli_connect.php\n```\n\n其他 PHP 脚本将包含此文件，因此它不需要包含任何\
  \ HTML。\n\n**2.** 将 MySQL 主机名、用户名、密码和数据库名称设置为常量：\n\n```php\nDEFINE ('DB_USER', 'username');\n\
  DEFINE ('DB_PASSWORD', 'password');\n```\n\n\n\nDEFINE ('DB\\_HOST', 'localhost');\n\
  \nDEFINE ('DB\\_NAME', 'sitename');\n\n出于安全考虑，我倾向于将这些值定义为常量（这样它们就无法被更改），但这并非强制要求。通常，将这些值设置为某种变量或常量是合理的，这样您就可以将配置参数与使用它们的函数分离开来，但同样，这也不是强制的。\n\
  \n编写脚本时，请将这些值更改为适用于您环境的值。如果您已获得 MySQL 用户名/密码组合和数据库（例如托管网站），请在此处使用该信息。或者，如果可能，请按照附录\
  \ A 中的步骤创建一个有权访问 `sitename` 数据库的用户，并将那些值插入此处。无论您做什么，除非您确定本书代码中的值在您的服务器上一定能工作，否则请勿直接使用。\n\
  \n### 3. 连接到 MySQL：\n\n```\n$dbc = @mysqli_connect (DB_HOST, DB_USER, DB_PASSWORD,\
  \ DB_NAME) OR die ('Could not connect to MySQL: ' . mysqli_connect_error() );\n\
  ```\n\n如果 `mysqli_connect()` 函数成功连接到 MySQL，将返回一个对应于打开连接的资源链接。该链接将被赋值给 `$dbc` 变量，以便其他函数可以使用此连接。\n\
  \n函数调用前面带有错误抑制运算符（`@`）。这可以防止 PHP 错误在 Web 浏览器中显示。这是可取的，因为错误将由 `OR die()` 子句处理。\n\n\
  ### 脚本 9.2. `mysqli_connect.php` 脚本将被本章中的每个其他脚本使用。它建立与 MySQL 的连接，选择数据库，并设置编码。\n\n\
  ```\n<?php # Script 9.2 - mysqli_connect.php\n\n// This file contains the database\
  \ access information.\n// This file also establishes a connection to MySQL,\n//\
  \ selects the database, and sets the encoding.\n\n// Set the database access information\
  \ as constants:\nDEFINE ('DB_USER', 'username');\nDEFINE ('DB_PASSWORD', 'password');\n\
  DEFINE ('DB_HOST', 'localhost');\nDEFINE ('DB_NAME', 'sitename');\n\n// Make the\
  \ connection:\n$dbc = @mysqli_connect (DB_HOST, DB_USER, DB_PASSWORD, DB_NAME) OR\
  \ die ('Could not connect to\nMySQL: ' . mysqli_connect_error() );\n\n// Set the\
  \ encoding...\nmysqli_set_charset($dbc, 'utf8');\n```\n\n如果 `mysqli_connect()` 函数无法返回有效的资源链接，则会执行语句的\
  \ `OR die()` 部分（因为 `OR` 的第一部分将为 false，所以第二部分必须为 true）。正如前一章所讨论的，`die()` 函数会终止脚本的执行。该函数也可以接受一个字符串作为参数，该字符串将被打印到\
  \ Web 浏览器。在本例中，该字符串是 *Could not connect to MySQL:* 和具体的 MySQL 错误的组合。\n\n![Image](img/09_figure_02_a.jpg)\n\
  \n如果连接 MySQL 出现问题，将显示一条信息性消息并停止脚本。\n\n### 4. 将文件保存为 `mysqli_connect.php`。\n\n由于此文件包含必须保密的信息——数据库访问数据——它将使用\
  \ `.php` 扩展名。使用 `.php` 扩展名时，即使恶意用户在其 Web 浏览器中运行此脚本，也无法看到页面的实际内容。\n\n您可能还会注意到，我没有包含结束\
  \ PHP 标签：`?>`。在 PHP 中这是允许的（当脚本以 PHP 代码结束时），并且这有一个将在后续章节中解释的好处。\n\n### 5. 理想情况下，将文件放在\
  \ Web 文档目录之外。\n\n![Image](img/09_figure_03_b.jpg)\n\n服务器 Web 文档的可视化表示，其中 `mysqli_connect.php`\
  \ 未存储在主目录（*htdocs*）内。\n\n因为该文件包含敏感的 MySQL 访问信息，所以应安全存储。如果可以，请将其放在 Web 目录正上方或以其他方式位于\
  \ Web 目录之外的目录中。这样该文件将无法通过 Web 浏览器访问。有关更多信息，请参阅“组织您的文档”侧边栏。\n\n### 6. 将脚本的副本暂时放在\
  \ Web 目录中，并在 Web 浏览器中运行它。\n\n![Image](img/09_figure_04_c.jpg)\n\n如果 MySQL 连接脚本正常工作，最终结果将是一个空白页面（脚本不生成任何\
  \ HTML）。\n\n为了测试脚本，您需要将副本放在服务器上，以便可以从 Web 浏览器访问（这意味着它必须位于 Web 目录中）。如果脚本正常工作，结果应该是一个空白页面。如果您看到\
  \ *Access denied...* 或类似消息，这意味着用户名、密码和主机的组合无权访问特定数据库。\n\n---\n\n### 组织您的文档\n\n第\
  \ 3 章 在开发第一个 Web 应用程序时介绍了*站点结构*的概念。现在页面将开始使用数据库连接脚本，该主题变得更加重要。\n\n如果数据库连接信息（用户名、密码、主机和数据库）落入恶意分子之手，可能会被用来窃取您的信息或破坏整个数据库。因此，您绝不能让\
  \ `mysqli_connect.php` 这样的脚本过于安全（此处原文 \"cannot keep ... too secure\" 语义为“不能不够安全/必须极其安全”，译文按语境意译为“绝不能掉以轻心/必须极其安全”）。\n\
  \n保护此类文件的最佳建议是将其存储在 Web 文档目录之外。例如，如果图中的 *htdocs* 文件夹是 Web 目录的根目录（换句话说，URL **[www.example.com](http://www.example.com)**\
  \ 指向那里），那么不在 *htdocs* 目录的任何位置存储 `mysqli_connect.php` 意味着它永远无法通过 Web 浏览器访问。诚然，PHP\
  \ 脚本的源代码无法从 Web 浏览器查看（只能看到脚本发送给浏览器的数据），但小心驶得万年船。如果您不被允许将文档放在 Web 目录之外，将 `mysqli_connect.php`\
  \ 放在 Web 目录中安全性较低，但也不是世界末日。\n\n其次，我建议对连接脚本使用 `.php` 扩展名。配置正确且正常运行的服务器将执行此类文件中的代码，而不是显示它。相反，如果您仅使用\
  \ `.inc` 作为扩展名，如果直接访问该页面，其内容将显示在 Web 浏览器中。\n\n---\n\n### 7. 从 Web 目录中删除临时副本。\n\n\
  ---\n\n> **提示**\n>\n> 如果您使用的 PHP 版本不支持 `mysqli_set_charset()` 函数，您将需要改为执行 `SET NAMES`\
  \ `encoding` 查询：\n>\n> ```\n> mysqli_query($dbc, 'SET NAMES utf8');\n> ```\n\n---\n\
  \n> **提示**\n>\n> 第 5 章 中用于登录 mysql 客户端的相同值，应该也适用于您的 PHP 脚本。\n\n---\n\n> **提示**\n\
  >\n> 如果您收到错误提示 `mysqli_connect()` 是“未定义函数”，这意味着 PHP 编译时未包含对 Improved MySQL Extension（改进的\
  \ MySQL 扩展）的支持。请参阅附录了解安装信息。\n\n---\n\n> **提示**\n>\n> 运行脚本时如果看到 *Could not connect...*\
  \ 错误消息，很可能意味着 MySQL 正在运行。\n>\n> ![Image](img/09_figure_05_d.jpg)\n>\n> 除了使用无效的用户名/密码/主机名/数据库信息外，PHP\
  \ 可能无法连接到 MySQL 的另一个原因是 MySQL 当前未运行。\n\n---\n\n> **提示**\n\n\n\n如果你好奇，![Image](img/circle-e.jpg)展示了如果你不在`mysqli_connect()`前使用`@`且发生错误时会发生什么。\n\
  \n![Image](img/09_figure_06_e.jpg)\n\n![Image](img/circle-e.jpg)如果你不使用错误抑制运算符（`@`），你将同时看到\
  \ PHP 错误和自定义的`OR die()`错误。\n\n---\n\n**Tip**\n\n如果在建立 MySQL 连接时不需要选择数据库，请从`mysqli_connect()`函数中省略该参数：\n\
  \n```php\n$dbc = mysqli_connect(hostname, username, password);\n```\n\n然后，在适当的时候，你可以使用以下方式选择数据库：\n\
  \n```php\nmysqli_select_db($dbc, db_name);\n```\n\n---\n\n#### 执行简单查询\n\n一旦你成功连接并选择了数据库，就可以开始执行查询。查询可以像插入、更新和删除一样基础，也可以像返回大量行的复杂连接一样复杂。无论\
  \ SQL 命令类型如何，执行查询的 PHP 函数都是`mysqli_query()`：\n\n```php\nresult = mysqli_query(dbc,\
  \ query);\n```\n\n该函数将数据库连接作为第一个参数，查询本身作为第二个参数。在完整的 PHP 脚本中，我通常将查询赋值给另一个变量，称为`$query`或仅为`$q`，因此运行查询可能如下所示：\n\
  \n```php\n$r = mysqli_query($dbc, $q);\n```\n\n对于像`INSERT`、`UPDATE`、`DELETE`等简单查询（不返回记录），`$r`变量（result\
  \ 的简写）将是 TRUE 或 FALSE，具体取决于查询是否成功执行。\n\n请记住，“成功执行”意味着它无错误运行；并不意味着查询的执行一定产生了预期结果；你需要测试这一点。\n\
  \n对于返回记录的复杂查询（`SELECT`是其中最重要的），如果查询成功，`$r`将是指向查询结果的资源链接；如果不成功，则为 FALSE。因此，你可以在条件语句中使用这行代码来测试查询是否成功运行：\n\
  \n```php\n$r = mysqli_query($dbc, $q);\n\nif ($r) { // Worked!\n```\n\n如果查询未成功运行，则必须发生了某种\
  \ MySQL 错误。要找出该错误是什么，请调用`mysqli_error()`函数：\n\n```php\necho mysqli_error($dbc);\n\
  ```\n\n该函数的唯一参数是数据库连接。\n\n脚本中最后一个（尽管是可选的）步骤是在完成操作后关闭现有的 MySQL 连接：\n\n```php\nmysqli_close($dbc);\n\
  ```\n\n此函数调用不是必需的，因为 PHP 会在脚本结束时自动关闭连接，但包含它是良好的编程习惯。\n\n为了演示此过程，让我们创建一个注册脚本。它首次访问时显示表单![Image](img/circle-a.jpg)，处理表单提交，并在验证所有数据后，将注册信息插入`sitename`数据库的`users`表中。\n\
  \n![Image](img/09_figure_07_a.jpg)\n\n![Image](img/circle-a.jpg)注册表单。\n\n作为预警，此脚本已知存在一个安全漏洞（取决于所用\
  \ PHP 版本及其设置），将在本章后面修复。\n\n#### 执行简单查询\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 脚本，命名为`register.php`（**Script\
  \ 9.3**）：\n\n```php\n<?php # Script 9.3 - register.php\n\n$page_title = 'Register';\n\
  \ninclude ('includes/header.html');\n```\n\n该脚本的基础——使用包含文件、让同一页面既显示又处理表单、创建粘性表单——来自第\
  \ 3 章。如果你对这些概念感到困惑，请参阅该章。\n\n**2.** 创建提交条件并初始化`$errors`数组：\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n\n    $errors = array();\n```\n\n此脚本将同时显示和处理 HTML 表单。此第一个条件将检查脚本的请求方式，以便知道何时处理表单（同样来自第\
  \ 3 章）。`$errors`变量将用于存储每条错误消息（每个未正确填写的表单输入一条）。\n\n**3.** 验证名：\n\n```php\nif (empty($_POST['first_name']))\
  \ {\n    $errors[] = 'You forgot to enter your first name.';\n} else {\n    $fn\
  \ = trim($_POST['first_name']);\n}\n```\n\n正如第 3 章所述，`empty()`函数提供了一种确保文本字段已填写的最小方法。如果名字段未填写，则向`$errors`数组添加一条错误消息。否则，`$fn`设置为提交的值，并去除多余空格。通过使用这个新变量——显然是`first_name`的简写——稍后编写查询在语法上会更容易。\n\
  \n**4.** 验证姓和电子邮件地址：\n\n```php\nif (empty($_POST['last_name'])) {\n    $errors[]\
  \ = 'You forgot to enter your last name.';\n} else {\n    $ln = trim($_POST['last_name']);\n\
  }\nif (empty($_POST['email'])) {\n    $errors[] = 'You forgot to enter your email\
  \ address.';\n} else {\n    $e = trim($_POST['email']);\n}\n```\n\n这些行本质上与验证名字段的行相同。在两种情况下，假设通过了最小验证，都将创建一个新变量。\n\
  \n**5.** 验证密码：\n\n```php\nif (!empty($_POST['pass1'])) {\n    if ($_POST['pass1']\
  \ != $_POST['pass2']) {\n        $errors[] = 'Your password did not match the confirmed\
  \ password.';\n    } else {\n        $p = trim($_POST['pass1']);\n    }\n} else\
  \ {\n    $errors[] = 'You forgot to enter your password.';\n}\n```\n\n**Script 9.3.**\
  \ 注册脚本通过运行`INSERT`查询向数据库添加记录。\n\n---\n\n```php\n1   <?php # Script 9.3 - register.php\n\
  2   // This script performs an INSERT query to add a record to the users table.\n\
  3\n4   $page_title = 'Register';\n5   include ('includes/header.html');\n6\n7  \
  \ // Check for form submission:\n8   if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\
  9\n10      $errors = array(); // Initialize an error array.\n11\n12      // Check\
  \ for a first name:\n13      if (empty($_POST['first_name'])) {\n14          $errors[]\
  \ = 'You forgot to enter your first name.';\n15      } else {\n16          $fn =\
  \ trim($_POST['first_name']);\n17      }\n18\n19      // Check for a last name:\n\
  20      if (empty($_POST['last_name'])) {\n21          $errors[] = 'You forgot to\
  \ enter your last name.';\n22      } else {\n23          $ln = trim($_POST['last_name']);\n\
  24      }\n25\n26      // Check for an email address:\n27      if (empty($_POST['email']))\
  \ {\n28          $errors[] = 'You forgot to enter your email address.';\n29    \
  \  } else {\n30          $e = trim($_POST['email']);\n31      }\n32\n33      //\
  \ Check for a password and match against the confirmed password:\n34      if (!empty($_POST['pass1']))\
  \ {\n35          if ($_POST['pass1'] != $_POST['pass2']) {\n36              $errors[]\
  \ = 'Your password did not match the confirmed password.';\n37          } else {\n\
  38              $p = trim($_POST['pass1']);\n39          }\n40      } else {\n41\
