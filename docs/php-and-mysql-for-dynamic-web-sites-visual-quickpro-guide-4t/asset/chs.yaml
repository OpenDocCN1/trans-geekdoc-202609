  }\n```\n\n要输入打印品的艺术家，管理员将使用一个下拉菜单 ![Image](img/circle-h.jpg)。结果将是一个作为正整数的 **`$_POST['artist']`**\
  \ 值。请记住，如果你使用的是不支持 Filter 扩展的旧版 PHP，你将需要改用 **`is_numeric()`** 函数、类型转换以及检查值是否大于 0\
  \ 的条件语句。详见 第 13 章。\n\n![Image](img/19_figure_14_h.jpg)\n\n![Image](img/circle-h.jpg)管理员可以使用此下拉菜单选择一位现有艺术家。\n\
  \n**9.** 将记录插入数据库：\n\n```php\nif (empty($errors)) {\n    $q = 'INSERT INTO prints\
