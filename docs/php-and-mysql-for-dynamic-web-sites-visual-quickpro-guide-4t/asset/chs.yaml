  \ ![Image](img/graycircle-f.jpg)。接下来，必须检索打印品 ID，以便重命名关联的图像（它目前位于 **`uploads`** 文件夹中，但使用的是临时名称），使用\
  \ **`rename()`** 函数。该函数将文件的当前名称作为第一个参数，将文件的新名称作为第二个参数。第一个参数的值之前已赋给 **`$temp`**。第二个参数的值是\
  \ **`uploads`** 目录的路径，加上刚确定的打印品 ID 值。请注意，文件的新名称将不包含文件扩展名。在服务器上查看实际文件时这可能看起来很奇怪，但当文件（即图像）由网站的公共端提供服务时，这并不是问题，你很快就会看到。\n\
  \n最后，清空 **`$_POST`** 数组，以便其值显示在粘性表单中。\n\n如果查询未影响一行，则可能发生了某些 MySQL 错误，你需要应用标准调试技术来弄清原因。\n\
  \n**11.** 完成条件语句：\n\n```php\nmysqli_stmt_close($stmt);\n} // End of $errors IF.\n\
