  \n### 创建可排序的显示\n\n为了结束本章，还有一个最终功能可以添加到 `view_users.php` 中。在目前的状态下，用户列表按注册日期顺序显示。如果也能按姓名查看，那将很不错。\n\
  \n从 MySQL 的角度来看，完成此任务很简单：只需更改 `SELECT` 查询的 `ORDER BY` 子句。因此，要向脚本添加排序功能，只需要额外的 PHP\
  \ 代码来更改 `ORDER BY` 子句。一个合乎逻辑的方法是链接列标题，以便点击它们可以更改显示顺序。正如你希望猜到的那样，这涉及使用 GET 方法将一个参数传回此页面，以指示首选的排序顺序。\n\
  \n#### 创建可排序链接\n\n**1.** 在文本编辑器或 IDE 中打开 `view_users.php`（脚本 10.4），如果尚未打开的话。\n\n\
  **2.** 在确定起始点（`$s`）之后，定义一个 `$sort` 变量（脚本 10.5）：\n\n```php\n$sort = (isset($_GET['sort']))\
  \ ? $_GET['sort'] : 'rd';\n```\n\n\n\n\n`$sort` 变量将用于确定查询结果的排序方式。此行使用三元运算符（请参阅本章前一节侧边栏）为\
  \ `$sort` 赋值。如果设置了 `$_GET['sort']`（用户单击任意链接后即会出现这种情况），则应将该值赋给 `$sort`。如果未设置 `$_GET['sort']`，则为\
  \ `$sort` 赋予默认值 `rd`（*registration date*，注册日期的缩写）。\n\n**3.** 确定结果应如何排序：\n\n```php\n\
  switch ($sort) {  \n\n  case 'ln':  \n\n    $order_by = 'last_name ASC';  \n\n \
  \   break;  \n\n  case 'fn':  \n\n    $order_by = 'first_name ASC';  \n\n    break;\
  \  \n\n  case 'rd':  \n\n    $order_by = 'registration_date ASC';  \n\n    break;\
  \  \n\n  default:  \n\n    $order_by = 'registration_date ASC';  \n\n    $sort =\
  \ 'rd';  \n\n    break;  \n\n}\n```\n\n`switch` 将 `$sort` 与多个预期值进行比对。例如，如果它等于 `ln`，则结果应按姓氏升序排列。所赋予的\
  \ `$order_by` 变量将用于 SQL 查询中。\n\n如果 `$sort` 的值为 `fn`，则结果应按名字升序排列。如果值为 `rd`，则结果将按注册日期升序排列。这也是默认情况。此处设置默认情况可以防止恶意用户将\
  \ `$_GET['sort']` 的值更改为可能破坏查询的内容。\n\n**4.** 修改查询以使用新的 `$order_by` 变量：\n\n```php\n\
  $q = \"SELECT last_name, first_name, DATE_FORMAT(registration_date, '%M %d, %Y')\
  \ AS dr, user_id FROM users ORDER BY $order_by LIMIT $start, $display\";\n```\n\n\
  此时，`$order_by` 变量已有一个值，指明返回的结果应如何排序（例如 `registration_date ASC`），因此可以轻松地将其添加到查询中。请记住\
  \ `ORDER BY` 子句位于 `LIMIT` 子句之前。如果生成的查询在您那里无法正常运行，请将其打印出来并检查其语法。\n\n**5.** 修改表头的\
  \ `echo` 语句，使列标题变为链接：\n\n```php\necho '<table align=\"center\" cellspacing=\"0\"\
  \ cellpadding=\"5\" width=\"75%\">  \n\n<tr>  \n\n  <td align=\"left\"><b>Edit</b></td>\
  \  \n\n  <td align=\"left\"><b>Delete</b></td>  \n\n  <td align=\"left\"><b><a href=\"\
  view_users.php?sort=ln\">Last Name</a></b></td>  \n\n  <td align=\"left\"><b><a\
  \ href=\"view_users.php?sort=fn\">First Name</a></b></td>  \n\n  <td align=\"left\"\
  ><b><a href=\"view_users.php?sort=rd\">Date Registered</a></b></td>  \n\n</tr> \
  \ \n\n';\n```\n\n要将列标题变为可点击的链接，只需用 `A` 标签将其包围即可。每个链接的 `href` 属性值对应 `$_GET['sort']`\
  \ 的可接受值（参见步骤 3 中的 `switch`）。\n\n**6.** 修改创建 *Previous*（上一页）链接的 `echo` 语句，以便同时传递排序值：\n\
  \n```php\necho '<a href=\"view_users.php?s=' . ($start - $display) . '&p=' . $pages\
  \ . '&sort=' . $sort . '\"> Previous</a> ';\n```\n\n向 *Previous* 链接添加另一个 *name=value*\
  \ 对，以便将排序顺序也发送到结果的每一页。如果不这样做，分页将会失败，因为 `ORDER BY` 子句会因页面不同而异。\n\n**7.** 对编号页面和 *Next*（下一页）链接重复步骤\
  \ 6：\n\n```php\necho '<a href=\"view_users.php?s=' . (($display * ($i - 1))) . '&p='\
  \ . $pages . '&sort=' . $sort . '\">' . $i . '</a> ';  \n\necho '<a href=\"view_users.php?s='\
  \ . ($start + $display) . '&p=' . $pages . '&sort=' . $sort . '\"> Next</a>';\n\
  ```\n\n**8.** 将文件另存为 `view_users.php`，放入您的 Web 目录中，并在 Web 浏览器中运行它 ![Image](img/circle-a.jpg)和\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/10_figure_17_a.jpg)\n\n![Image](img/circle-a.jpg)单击名字列后，结果按名字升序显示。\n\
  \n![Image](img/10_figure_18_b.jpg)\n\n![Image](img/circle-b.jpg)单击 *Last Name*（姓氏）列，然后单击到第二个分页显示，页面显示按姓氏升序排列的第二组结果。\n\
  \n***\n\n提示\n\n本例还演示了一个非常重要的安全概念。代码没有直接在查询中使用 `$_GET['sort']` 的值，而是在 `switch` 中将其与假定的值进行核对。如果由于某种原因，`$_GET['sort']`\
  \ 的值不是预期的值，则查询将使用默认排序顺序。关键在于：不要对接收到的数据做假设，也不要在 SQL 查询中使用未经验证的数据。\n\n***\n\n### 复习与实践\n\
