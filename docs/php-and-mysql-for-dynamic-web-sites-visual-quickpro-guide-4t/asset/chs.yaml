  \n    // Debugging message:\n    echo '<p>' . mysqli_error($dbc) . '<br /><br />Query:\
  \ ' . $q . '</p>';\n\n} // End of if ($r) IF.\n\nmysqli_close($dbc); // Close the\
  \ database connection.\n\ninclude ('includes/footer.html');\n?>\n```\n\n---\n\n\
