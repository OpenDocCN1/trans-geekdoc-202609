  1\" />\n\n  <input type=\"hidden\" name=\"parent_id\" value=\"0\" />\n\n</form>\n\
  ```\n\n表单包含两个供用户填写的字段和两个存储查询所需值的隐藏输入框。在该脚本的实际版本中，`forum_id` 和 `parent_id` 的值将动态确定。\n\
