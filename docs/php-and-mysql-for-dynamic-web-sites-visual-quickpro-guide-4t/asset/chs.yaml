  \n---\n\n### 修改 register.php\n\n`mysqli_num_rows()` 函数可应用于 `register.php`，以防止某人使用同一电子邮件地址多次注册。尽管该列上的数据库\
  \ `UNIQUE` 索引将防止这种情况发生，但此类尝试会产生 MySQL 错误。要使用 PHP 防止这种情况，请运行一个 `SELECT` 查询以确认该电子邮件地址当前未被注册。该查询只需：\n\
  \n```\nSELECT user_id FROM users WHERE email='$e'\n```\n\n你将运行此查询（使用 `mysqli_query()`\
  \ 函数），然后调用 `mysqli_num_rows()`。如果 `mysqli_num_rows()` 返回 0，则表示该电子邮件地址尚未注册，可以安全地运行\
  \ `INSERT`。\n\n---\n\n#### 使用 PHP 更新记录\n\n本章的最后一项技术展示了如何通过 PHP 脚本更新数据库记录。这需要一个 `UPDATE`\
  \ 查询，其成功执行可通过 PHP 的 `mysqli_affected_rows()` 函数进行验证。\n\n虽然 `mysqli_num_rows()` 函数返回\
  \ `SELECT` 查询生成的行数，但 `mysqli_affected_rows()` 返回 `INSERT`、`UPDATE` 或 `DELETE` 查询影响的行数。其用法如下：\n\
  \n```\n$num = mysqli_affected_rows($dbc);\n```\n\n与 `mysqli_num_rows()` 不同，该函数接受的唯一参数是数据库连接（`$dbc`），而不是前一个查询的结果（`$r`）。\n\
  \n以下示例将是一个允许注册用户更改密码的脚本。它演示了两个重要概念：\n\n• 将提交的用户名和密码与注册值进行核对（这也是登录系统的关键）\n• 使用主键作为引用来更新数据库记录\n\
  \n与注册示例一样，这一个 PHP 脚本既会显示表单 ![Image](img/circle-a.jpg)也会处理它。\n\n![Image](img/09_figure_18_a.jpg)\n\
  \n![Image](img/circle-a.jpg)更改用户密码的表单。\n\n#### 使用 PHP 更新记录\n\n**1.** 在文本编辑器或 IDE\
  \ 中开始一个新的 PHP 脚本，命名为 `password.php`（**脚本 9.7**）：\n\n```\n<?php # 脚本 9.7 - password.php\n\
  \n$page_title = 'Change Your Password';\ninclude ('includes/header.html');\n```\n\
  \n**脚本 9.7.** `password.php` 脚本在数据库上运行 `UPDATE` 查询，并使用 `mysqli_affected_rows()`\
  \ 函数确认更改。\n\n```\n<?php # 脚本 9.7 - password.php\n// 此页面允许用户更改其密码。\n\n$page_title\
