  \n---\n\n> **Tip**\n>\n> **`mysqli_real_escape_string()`** 函数会根据所用语言（即排序规则）对字符串进行转义，这是该函数相对于其他替代方案的优势。\n\
  \n---\n\n> **Tip**\n>\n> 如果出现类似 ![Image](img/circle-c.jpg) 的结果，说明 **`mysqli_real_escape_string()`**\
  \ 函数无法访问数据库（因为没有连接，如 **`$dbc`**）。\n>\n> ![Image](img/09_figure_16_c.jpg)\n>\n> ![Image](img/circle-c.jpg)\
  \ 由于 `mysqli_real_escape_string()` 需要数据库连接，在没有该连接的情况下使用它（例如在包含连接脚本之前）会导致其他错误。\n\n\
  ---\n\n> **Tip**\n>\n> 如果服务器启用了 Magic Quotes，则需要在使用 **`mysqli_real_escape_string()`**\
  \ 函数之前，先移除 Magic Quotes 添加的斜杠。代码（尽管显得繁琐）如下所示：\n>\n> ```php\n> $fn = mysqli_real_escape_string($dbc,\
  \ trim(stripslashes($_POST['first_name'])));\n> ```\n>\n> 如果不使用 **`stripslashes()`**\
  \ 而 Magic Quotes 又处于启用状态，表单值将被双重转义。\n\n---\n\n> **Tip**\n>\n> 如果查看数据库中存储的值（使用 mysql\
  \ 客户端、phpMyAdmin 或类似工具），你不会看到撇号和其他有问题的字符带有前导反斜杠。这是正确的。反斜杠防止有问题的字符破坏查询，但反斜杠本身不会被存储。\n\
  \n---\n\n### 统计返回的记录数\n\n\n\n\n接下来要讨论的逻辑函数是 `mysqli_num_rows()`。该函数返回 `SELECT` 查询检索到的行数。它接受一个参数，即查询结果变量：\n\
  \n```\n$num = mysqli_num_rows($r);\n```\n\n虽然其用途简单，但该函数非常有用。如果你想对查询结果进行分页（下一章中有此示例），则必须使用它。此外，在尝试使用\
  \ `while` 循环获取任何结果之前使用此函数也是个好主意（因为如果没有结果则无需获取，尝试这样做可能会导致错误）。在接下来的步骤序列中，让我们修改 `view_users.php`\
  \ 以列出注册用户的总数。\n\n#### 修改 view_users.php\n\n**1.** 在文本编辑器或 IDE 中打开 `view_users.php`（参考\
  \ 脚本 9.4），如果尚未打开的话。\n\n**2.** 在 `if ($r)` 条件判断之前，添加此行（**脚本 9.6**）：\n\n```\n$num\
  \ = mysqli_num_rows($r);\n```\n\n此行将查询返回的行数赋值给 `$num` 变量。\n\n**3.** 将原来的 `$r` 条件判断更改为：\n\
  \n```\nif ($num > 0) {\n```\n\n以前编写的条件判断是基于查询是否成功运行，而不是基于是否返回了任何记录。现在它将更加准确。\n\n\
  **脚本 9.6.** 现在 `view_users.php` 脚本将显示注册用户的总数，这要归功于 `mysqli_num_rows()` 函数。\n\n```\n\
  <?php # 脚本 9.6 - view_users.php #2\n\n// 此脚本从 users 表中检索所有记录。\n\n$page_title = 'View\
  \ the Current Users';\ninclude ('includes/header.html');\n\n// 页面标题：\necho '<h1>Registered\
  \ Users</h1>';\n\nrequire ('../mysqli_connect.php');\n// 连接到数据库。\n\n// 执行查询：\n$q\
  \ = \"SELECT CONCAT(last_name, ', ',\n    first_name) AS name, DATE_FORMAT\n   \
  \ (registration_date, '%M %d, %Y') AS dr\n    FROM users ORDER BY registration_date\
  \ ASC\";\n$r = @mysqli_query($dbc, $q); // 运行\n    // 查询。\n\n// 统计返回的行数：\n$num =\
  \ mysqli_num_rows($r);\n\nif ($num > 0) { // 如果运行正常，\n    // 显示记录。\n\n    // 打印用户数量：\n\
