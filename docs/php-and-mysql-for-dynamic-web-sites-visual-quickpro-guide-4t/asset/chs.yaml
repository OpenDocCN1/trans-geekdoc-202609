  ### 编写配置脚本\n\n本网站将使用两类配置脚本。其中 **`config.inc.php`** 是整个应用最重要的脚本，它将：\n\n- 包含关于站点的整体注释\n\
  - 定义常量\n- 确立站点设置\n- 规定错误处理方式\n- 定义所需函数\n\n因承担上述所有职责，配置脚本将被应用中每个页面引入。\n\n第二个配置脚本\
  \ **`mysqli_connect.php`** 存储所有数据库相关信息，仅被需要与数据库交互的页面引入。\n\n#### 创建配置文件\n\n配置文件将发挥多重重要作用，既像站点的“使用手册”又像“首选项文件”。首先用于记录站点整体信息：创建者、时间、原因、受众等（书中版本省略了这些，但您应在自己的脚本中补充）。其次定义各页面将使用的各类常量和设置。\n\
  \n第三，配置文件将确立站点的错误管理策略。相关技术——创建自定义错误处理函数——已在 第 8 章 “错误处理与调试” 中介绍。同该章一样，开发阶段将以最详细方式报告每个错误。\n\
  \n![Image](img/18_figure_06_a.jpg)\n\n开发阶段所有错误应尽可能明显且信息丰富。\n\n**Script 18.3.** 该配置脚本规定错误处理方式、定义全站设置与常量，并可（但未）声明所需函数。\n\
  \n```php\n<?php # Script 18.3 - config.inc.php\n/* This script:\n * - define constants\
  \ and settings\n * - dictates how errors are handled\n * - defines useful functions\n\
  \ */\n\n// Document who created this site, when,\n// why, etc.\n\n\n// **********\
  \ SETTINGS ********** //\n\n// Flag variable for site status:\ndefine('LIVE', FALSE);\n\
  \n// Admin contact address:\ndefine('EMAIL', 'InsertRealAddressHere');\n\n// Site\
  \ URL (base for all redirections):\ndefine ('BASE_URL', 'http://www.example.com/');\n\
  \n// Location of the MySQL connection script:\ndefine ('MYSQL', '/path/to/mysqli_connect.php');\n\
  \n// Adjust the time zone for PHP 5.1 and greater:\ndate_default_timezone_set ('US/Eastern');\n\
  \n// ********** SETTINGS ********** //\n```\n\n\n\n\n#### 编写配置文件\n\n**1.** 在文本编辑器或\
  \ IDE 中新建一个 PHP 文档，命名为 **`config.inc.php`** (**脚本 18.3**)：\n\n```php\n<?php # Script\
  \ 18.3 - config.inc.php\n```\n\n**2.** 为错误报告建立两个常量：\n\n```php\ndefine('LIVE', FALSE);\n\
  define('EMAIL', 'InsertRealAddress Here');\n```\n\n**`LIVE`** 常量的用法与 第 8 章 中相同。如果为\
  \ `FALSE`，详细错误消息将发送到 Web 浏览器。网站上线后，应将此常量设置为 `TRUE`，以便永远不向 Web 用户显示详细错误消息。**`EMAIL`**\
  \ 常量是网站上线时发送错误消息的地址。显然，您应使用自己的电子邮件地址作为该值。\n\n**3.** 为全站设置建立两个常量：\n\n```php\ndefine\
  \ ('BASE_URL', 'http://www.example.com/');\ndefine ('MYSQL', '/path/to/mysqli_connect.php');\n\
  ```\n\n定义这两个常量只是为了让在其他脚本中执行某些操作更加容易。第一个 **`BASE_URL`** 指的是根域名 (*http://www.example.com/*)，并带有结尾斜杠。如果在自己的电脑上开发，这可能是\
  \ *http://localhost/* 或 *http://localhost/ch18/*。当脚本重定向浏览器时，代码可以简单地写成：\n\n```php\n\
  header('Location: ' . BASE_URL . 'page.php');\n```\n\n第二个常量 **`MYSQL`** 是 MySQL\
  \ 连接脚本（接下来要编写）的绝对路径。通过将其设置为绝对路径，任何文件都可以通过引用此常量来包含连接脚本：\n\n```php\nrequire (MYSQL);\n\
  ```\n\n将这两个值都更改为与您的环境相对应。例如，在 Windows 上使用 XAMPP 时，**`MYSQL`** 常量的正确值可能是 **`C:\\\\\
  xampp\\mysqli_connect.php`**。\n\n如果将网站从一台服务器或域迁移到另一台，只需更改这两个常量，应用程序仍可正常工作。\n\n**4.**\
  \ 建立其他全站设置：\n\n```php\ndate_default_timezone_set ('US/Eastern');\n```\n\n正如 第 11\
  \ 章 “Web 应用程序开发” 中所述，任何使用 PHP 日期或时间函数的情况（自 PHP 5.1 起）都要求设置时区。请将此值更改为匹配您的时区（请参阅 PHP\
  \ 手册获取时区列表）。\n\n**5.** 开始定义错误处理函数：\n\n```php\nfunction my_error_handler ($e_number,\
  \ $e_message, $e_file, $e_line, $e_vars) {\n  $message = \"An error occurred in\
  \ script '$e_file' on line $e_line: $e_message\\n\";\n```\n\n函数定义将与 第 8 章 中解释的非常相似。该函数预期接收五个参数：错误编号、错误消息、发生错误的脚本、PHP\
  \ 认为发生错误的行号，以及错误发生时存在的变量数组。然后函数开始定义 **`$message`** 变量，从传递给该函数的信息入手。\n\n**6.** 添加当前日期和时间：\n\
  \n```php\n$message .= \"Date/Time: \" . date('n-j-Y H:i:s') . \"\\n\";\n```\n\n\
  为了使错误报告更有用，消息中将包含当前日期和时间。换行符终止字符串，使生成的显示更易读。\n\n**7.** 如果网站未上线，详细显示错误消息：\n\n```php\n\
  if (!LIVE) {\n  echo '<div class=\"error\">' . nl2br($message);\n  echo '<pre>'\
  \ . print_r ($e_vars, 1) . \"\\n\";\n  debug_print_backtrace( );\n  echo '</pre></div>';\n\
  ```\n\n如前所述，如果网站*未*上线，对于任何类型的错误，都会打印完整的错误消息。消息放置在 **`<div class=\"error\">`** 内，将根据网站\
  \ CSS 文件中定义的规则对消息进行格式化。错误消息的第一部分是已定义的字符串，并额外将换行符转换为 HTML 换行标签。然后，在预格式化标签内，显示错误发生时存在的所有变量，以及一个*回溯*（函数调用历史等）。有关更多解释，请参阅\
  \ 第 8 章。\n\n**8.** 如果网站已上线，将详细信息通过电子邮件发送给管理员，并为访客打印一条通用消息：\n\n```php\n} else { //\
  \ Don't show the error:\n  $body = $message . \"\\n\" . print_r ($e_vars, 1);\n\
  \  mail(EMAIL, 'Site Error!', $body, 'From: email@example.com');\n  if ($e_number\
  \ != E_NOTICE) {\n    echo '<div class=\"error\">A system error occurred. We apologize\
  \ for the inconvenience.</div><br />';\n  }\n} // End of !LIVE IF.\n```\n\n除了具体的错误消息外，所有现有变量以及当前日期和时间也将显示出来。错误报告将被格式化以适应网站的模板。在网站的生产或上线阶段，错误将得到更优雅的处理。那时，详细错误消息不会在\
  \ Web 浏览器中打印，而是发送到电子邮件地址。\n\n如果网站上线时发生错误，用户将只看到如下消息（但详细错误消息将通过电子邮件发送给管理员）。\n\n最后，此脚本可以定义网站中可能多次使用的任何函数。本网站没有此类函数，但这也是此类文件的另一个合乎逻辑的用途。\n\
  \n\n\n\n如果站点*已上线*，详细错误信息应通过电子邮件发送，而 Web 用户只能看到一条通用消息。更进一步，如果错误类型为特定的 **`E_NOTICE`**，则不会打印该通用消息。此类错误发生在引用不存在的变量等情况，这可能是个问题，也可能不是。为避免用户可能被大量错误消息淹没，仅当\
  \ **`$e_number`** 不等于 **`E_NOTICE`** 时才打印错误消息，`E_NOTICE` 是 PHP 中定义的常量（参见 PHP 手册）。\n\
  \n**9.** 完成函数定义并告知 PHP 使用您的错误处理程序：\n\n```\n}\nset_error_handler('my_error_handler');\n\
  ```\n\n您必须使用 **`set_error_handler()`** 函数来告知 PHP 使用您自己的函数处理错误。\n\n**10.** 将文件保存为\
  \ **`config.inc.php`**，并将其放置在您的 Web 目录下的 **`includes`** 文件夹中。\n\n请注意，遵循本书中许多其他示例的惯例，由于此脚本将被其他\
  \ PHP 脚本包含，因此省略了结束的 PHP 标签。\n\n### 创建数据库脚本\n\n第二个配置类脚本是 **`mysqli_connect.php`**，即本书多次使用的数据库连接文件。其目的是连接到\
  \ MySQL、选择数据库并建立使用的字符集。如果发生问题，此脚本将利用 **`config.inc.php`** 中建立的错误处理工具。为此，此脚本将在适当的时候调用\
  \ **`trigger_error()`** 函数。**`trigger_error()`** 函数让您通知 PHP 发生了错误。当然，PHP 将使用配置脚本中建立的\
  \ **`my_error_handler()`** 函数来处理该错误。\n\n#### 脚本 18.4\n此脚本连接到 *ch18* 数据库。如果无法连接，则会触发错误处理程序，并将\
  \ MySQL 连接错误传递给它。\n\n```\n<?php # Script 18.4 - mysqli_connect.php\n// This file\
  \ contains the database\n// access information.\n// This file also establishes a\n\
  // connection to MySQL\n// and selects the database.\n\n// Set the database access\
  \ information\n// as constants:\nDEFINE ('DB_USER', 'username');\nDEFINE ('DB_PASSWORD',\
  \ 'password');\nDEFINE ('DB_HOST', 'localhost');\nDEFINE ('DB_NAME', 'ch18');\n\n\
  // Make the connection:\n$dbc = @mysqli_connect (DB_HOST, DB_USER, DB_PASSWORD,\
  \ DB_NAME);\n\n// If no connection could be made,\n// trigger an error:\nif (!$dbc)\
  \ {\n    trigger_error ('Could not connect to MySQL: ' . mysqli_connect_error()\
  \ );\n} else { // Otherwise, set the encoding:\n    mysqli_set_charset($dbc, 'utf8');\n\
  }\n```\n\n### 连接到数据库\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 **`mysqli_connect.php`**（**脚本\
  \ 18.4**）：\n\n```\n<?php # Script 18.4 - mysqli_connect.php\n```\n\n**2.** 设置数据库访问信息：\n\
  \n```\nDEFINE ('DB_USER', 'username');\nDEFINE ('DB_PASSWORD', 'password');\nDEFINE\
  \ ('DB_HOST', 'localhost');\nDEFINE ('DB_NAME', 'ch18');\n```\n\n一如既往，请将这些值更改为适合您的\
  \ MySQL 安装的值。\n\n**3.** 尝试连接到 MySQL 并选择数据库：\n\n```\n$dbc = @mysqli_connect (DB_HOST,\
  \ DB_USER, DB_PASSWORD, DB_NAME);\n```\n\n在之前的脚本中，如果此函数未返回正确结果，则会调用 **`die()`**\
  \ 函数，终止脚本执行。由于本站点将使用自定义错误处理函数，我将重写连接过程。\n\n由于 **`@`** 抑制运算符，此函数调用引发的任何错误都将被抑制，并由下一步中的代码处理。\n\
  \n**4.** 如果未建立数据库连接，处理错误：\n\n```\nif (!$dbc) {\n    trigger_error ('Could not connect\
  \ to MySQL: ' . mysqli_connect_error() );\n```\n\n如果脚本无法连接到数据库，错误消息应发送给 **`my_error_handler()`**\
  \ 函数。这样，错误将根据当前设置的管理技术（上线阶段与开发阶段）进行处理。我们不直接调用 **`my_error_handler()`**，而是使用 **`trigger_error()`**，其第一个参数是错误消息。\n\
  \n![Image](img/circle-c.jpg)\n\n![Image](img/18_figure_08_c.jpg)\n\n![Image](img/circle-c.jpg)\
  \ 网站开发期间发生的数据库连接错误。\n\n**5.** 设置编码：\n\n```\n} else {\n    mysqli_set_charset($dbc,\
  \ 'utf8');\n}\n```\n\n如果能够建立数据库连接，则建立用于与数据库通信的编码。详情请参见第 9 章 “将 PHP 与 MySQL 结合使用”。\n\
  \n**6.** 将文件保存为 **`mysqli_connect.php`**，并将其放置在 Web 文档根目录的上一级目录中。\n\n此脚本作为一个可包含文件，同样省略了结束的\
  \ PHP 标签。与本书中的其他示例一样，理想情况下该文件不应位于 Web 目录中，但无论您将其放在何处，请确保 **`config.inc.php`** 中\
  \ **`MYSQL`** 常量的值相匹配。\n\n**7.** 创建数据库。\n\n![Image](img/circle-d.jpg)\n\n![Image](img/18_figure_09_d.jpg)\n\
  \n![Image](img/circle-d.jpg) 创建本章使用的数据库。\n\n有关数据库的讨论以及创建该表所需的命令，请参见侧边栏“数据库方案”。如果您无法创建自己的数据库，只需将该表添加到您有权访问的任何数据库中即可。此外，请确保编辑\
  \ **`mysqli_connect.php`** 文件，使其使用正确的用户名/密码/主机名组合来连接到该数据库。\n\n> **提示**\n>\n> 一方面，为了方便参考，将两个配置文件的内容放在一个脚本中似乎讲得通。但遗憾的是，这样做会给不需要数据库连接的脚本（例如\
  \ **`index.php`**）带来不必要的开销（即连接并选择数据库）。\n\n> **提示**\n>\n> 通常，应在配置文件或单独的函数文件中定义通用函数。一个例外是任何需要数据库连接的函数。如果您知道某个函数仅用于也连接到\
  \ MySQL 的页面上，那么在 **`mysqli_connect.php`** 脚本中定义该函数是合乎逻辑的。\n\n### 数据库方案\n\n该应用程序使用的数据库称为\
  \ *ch18*。该数据库目前仅包含一张表：*users*。要创建该表，请使用以下 SQL 命令：\n\n```\nCREATE TABLE users (\n\
  user_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\nfirst_name VARCHAR(20) NOT NULL,\n\
  last_name VARCHAR(40) NOT NULL,\nemail VARCHAR(60) NOT NULL,\npass CHAR(40) NOT\
  \ NULL,\nuser_level TINYINT(1) UNSIGNED NOT NULL DEFAULT 0,\nactive CHAR(32),\n\
  registration_date DATETIME NOT NULL,\nPRIMARY KEY (user_id),\nUNIQUE KEY (email),\n\
  INDEX login (email, pass)\n);\n```\n\n到目前为止，该表的大部分结构应该对您很熟悉；它与本书多个示例中使用的 *sitename*\
  \ 数据库中的 *users* 表非常相似。一个新增内容是 *active* 列，它将指示用户是否已激活其账户（通过单击注册邮件中的链接）。该列将存储 32 字符长的激活码，或具有\
  \ **`NULL`** 值。因为 *active* 列可能具有 **`NULL`** 值，所以不能将其定义为 **`NOT NULL`**。如果您将 *active*\
  \ 定义为 **`NOT NULL`**，则没有人能够登录（稍后您将在本章中了解原因）。另一个新增内容是 *user_level* 列，它将区分站点拥有的用户类型。\n\
  \n\n\n在 `email` 字段上建立了唯一索引，而在 `email` 和 `pass` 字段的组合上建立了另一个索引。这两个字段将在登录查询中一起使用，因此将它们作为一个整体建立索引，创建一个名为\
  \ `login` 的索引，是合情合理的。\n\n---\n\n### 创建主页\n\n网站的主页名为 `index.php`，它将作为公共前台其他页面的模板。它将引入配置文件（用于错误管理）以及页眉和页脚文件来创建\
  \ HTML 设计。假设用户已登录，此页面还将以姓名欢迎用户。\n\n![Image](img/18_figure_10_a.jpg)\n\n如果用户已登录，索引页将以姓名向其问好。\n\
