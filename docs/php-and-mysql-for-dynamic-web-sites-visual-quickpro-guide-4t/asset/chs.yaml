  \ function.\n20\n21  $page_title = 'Trip Cost Calculator';\n22  include ('includes/header.html');\n\
  23\n24  // Check for form submission:\n25  if ($_SERVER['REQUEST_METHOD'] == 'POST')\
  \ {\n26\n27      // Minimal form validation:\n28      if (isset($_POST['distance'],\
