  \ '<br /><br />Query: ' . $q . '</p>';\n```\n\n不再调用 `mysqli_error()` 函数，而是使用对象的\
  \ `error` 属性来存储数据库报告的问题。\n\n### 7. 修改关闭数据库连接的两处代码\n\n```php\n$mysqli->close();\n\
  unset($mysqli);\n```\n\n第一行关闭连接，第二行销毁变量。此步骤释放已用内存，虽非强制，但属于专业规范。原脚本在两处关闭了数据库连接，请确保两处均已更新。\n\
  \n### 8. 保存脚本，放入 Web 目录，并在 Web 浏览器中测试。\n\n如果所有代码均已按要求更新，注册脚本应能像以前一样正常工作。\n\n###\
  \ 获取查询结果\n\n上一节演示了如何执行“简单”查询，即不返回结果行的查询。执行 `SELECT` 查询时，代码略有不同，因为必须处理查询结果。首先，建立\
  \ `MySQLi` 对象后，使用 `query()` 方法在数据库上运行查询。若查询预期返回结果集，将方法调用的结果赋值给另一个变量：\n\n```php\n\
  $q = 'SELECT * FROM tablename';\n$result = $mysqli->query($q);\n```\n\n变量 `$result`\
  \ 将是 `MySQLi_Result` 类型的对象：正如某些函数返回字符串或整数，`MySQLi::query()` 将返回 `MySQLi_Result`\
  \ 对象。其 `num_rows` 属性反映查询结果中的记录数：\n\n```php\nif ($result->num_rows > 0) { // Handle\
  \ the results.\n```\n\n若查询仅返回一行，可直接调用 `fetch_array()` 方法获取：\n\n```php\n$row = $result->fetch_array();\n\
  ```\n\n该方法与过程式对应函数 `mysqli_fetch_array()` 类似，接受一个常量作为可选参数，指示返回的行应视为关联数组 (`MYSQLI_ASSOC`)、索引数组\
  \ (`MYSQLI_NUM`) 还是两者兼有 (`MYSQLI_BOTH`)。`MYSQLI_BOTH` 为默认值。\n\n若有多条记录需获取，可使用循环：\n\
  \n```php\nwhile ($row = $result->fetch_array(MYSQLI_NUM)) {\n    // Use $row.\n\
  }\n```\n\n此时循环中的 `$row` 为数组，可使用 `$row[0]` 或 `$row['column']` 访问单个列（假设使用了相应常量）。若偏好\
  \ OOP 语法，可改用 `fetch_object()` 方法，从而创建对象而非数组：\n\n```php\n$q = 'SELECT user_id, first_name\
  \ FROM users';\n$result = $mysqli->query($q);\nwhile ($row = $result->fetch_object())\
  \ {\n    // Use $row->user_id\n    // Use $row->first_name\n}\n```\n\n处理完结果后，应释放其占用的资源：\n\
  \n```php\n$result->free();\n```\n\n让我们利用这些信息更新 `view_users.php`（Script 9.6）。\n\n\
  #### 检索查询结果的步骤\n\n**1.** 在文本编辑器或 IDE 中打开 `view_users.php`（Script 9.6）。\n\n**2.**\
  \ 将 MySQL 连接脚本的引入改为（**Script 16.3**）：\n\n```php\nrequire ('../mysqli_oop_connect.php');\n\
  ```\n\n同样，路径需根据您的设置进行调整。\n\n**3.** 将查询执行代码改为（原第 14 行）：\n\n```php\n$r = $mysqli->query($q);\n\
  ```\n\n无论执行何种类型的查询，均调用同一个 `MySQLi::query()` 方法。但此处将查询执行的结果赋值给一个新变量，该变量将为 `MySQLi_Result`\
  \ 类型的对象。为简洁起见，此处变量名为 `$r`，您也可使用更正式的 `$result`。\n\n**4.** 修改确定返回行数的方式（原脚本第 17 行）：\n\
  \n```php\n$num = $r->num_rows;\n```\n\n结果对象的 `num_rows` 属性反映查询返回的记录数。该值赋给变量 `$num`，与之前一致。\n\
  \n请注意这是一个**属性**，而非**方法**（即 `$r->num_rows`，而非 `$r->num_rows()`）。\n\n**5.** 将 `while`\
  \ 循环改为：\n\n```php\nwhile ($row = $r->fetch_object()) {\n```\n\n此处改为调用 `MySQLi_Result`\
  \ 对象的 `fetch_object()` 方法，而非调用 `mysqli_fetch_array()`。\n\n---\n\n**Script 16.3.**\
  \ 本脚本使用 `MySQLi` 和 `MySQLi_Result` 类从数据库获取记录。\n\n```php\n1  <?php # Script 16.3\
