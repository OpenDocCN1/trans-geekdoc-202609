  \n***\n\n提示\n\n由于每加仑价格和燃油效率值均为数字，因此您可以在添加的条件语句中给比较值加引号，也可以不加。我选择给它们加引号，因为从技术上讲，它们是具有数字值的字符串。\n\
  \n***\n\n***\n\n提示\n\n由于本示例中添加的 PHP 代码位于 HTML 表单元素标签内部，因此错误消息可能不明显。如果出现问题，请检查页面的\
  \ HTML 源代码，查看 PHP 错误是否打印在 `value` 属性和标签本身中。\n\n***\n\n***\n\n提示\n\n您应该始终为 HTML 属性加上双引号，特别是文本输入框的\
  \ `value` 属性。如果不这样做，像 *Elliott Smith* 这样的多词值在 Web 浏览器中将仅显示为 *Elliott*。\n\n***\n\n\
  ***\n\n提示\n\n某些 Web 浏览器也会为您记录输入表单的值；这是一个独立的问题，但可能与使用 PHP 实现此功能的问题有重叠。\n\n***\n\n\
  #### 创建您自己的函数\n\nPHP 拥有大量内置函数，几乎涵盖了您可能需要的所有功能。但更重要的是，PHP 允许您为任何目的定义并使用自己的函数。创建自己的函数的语法是：\n\
  \n```\nfunction function_name() {\n    // Function code.\n}\n```\n\n您的函数名称可以是字母、数字和下划线的任意组合，但必须以字母或下划线开头。您也不能将现有函数名用于您的函数（`print`、`echo`、`isset`\
  \ 等）。一个完全有效的函数定义是：\n\n```\nfunction do_nothing() {\n    // Do nothing.\n}\n```\n\
  \n在 PHP 中，正如第一章所述，函数名不区分大小写（这与变量名不同），因此您可以使用 `do_Nothing()`、`DO_NOTHING()` 或 `Do_Nothing()`\
  \ 等来调用该函数，但不能使用 `donothing()` 或 `DoNothing()`。\n\n函数内的代码几乎可以做任何事情，从生成 HTML 到执行计算，再到调用其他函数。\n\
  \n创建自己的函数最常见的原因有：\n\n* 将重复的代码与一次函数调用关联起来。\n* 将敏感或复杂的过程与其他代码分离开来。\n* 使常用代码片段更易于重用。\n\
  \n本章将介绍几个示例，您将在本书的其余部分看到其他示例。在第一个示例中，将定义一个输出生成理论广告所需 HTML 代码的函数。然后将在主页上调用该函数两次 ![Image](img/circle-a.jpg)。\n\
  \n![Image](img/03_figure_12_a.jpg)\n\n![Image](img/circle-a.jpg)这两个“广告”是通过调用同一个用户定义函数生成的。\n\
  \n#### 创建您自己的函数\n\n**1.** 在文本编辑器或 IDE 中打开 `index.php` (脚本 3.4)。\n\n**2.** 在开始的 PHP\
  \ 标签之后，开始定义一个新函数 (**脚本 3.7**)：\n\n```\nfunction create_ad() {\n```\n\n此处要编写的函数理论上将生成向网页添加广告所需的\
  \ HTML。函数名称清楚地说明了其用途。\n\n虽然不是必需的，但惯例是将函数定义放在脚本的最顶部附近或单独的文件中。\n\n**3.** 生成 HTML：\n\
  \n```\necho '<p class=\"ad\">This is an annoying ad! This is an annoying ad! This\
  \ is an annoying ad! This is an annoying ad!</p>';\n```\n\n**脚本 3.7.** 此版本的主页包含一个用户定义函数，用于输出理论广告。该函数在脚本中被调用了两次，从而创建了两个广告。\n\
  \n```\n1   <?php # Script 3.7 - index.php #2\n2\n3   // This function outputs theoretical\
  \ HTML\n4   // for adding ads to a Web page.\n5   function create_ad() {\n6    \
  \   echo '<p class=\"ad\">This is an annoying ad! This is an annoying ad! This is\
  \ an\n      annoying ad! This is an annoying ad!</p>';\n7   } // End of the function\
  \ definition.\n8\n9   $page_title = 'Welcome to this Site!';\n10  include ('includes/header.html');\n\
  11\n12  // Call the function:\n13  create_ad();\n14  ?>\n15\n16  <h1>Content Header</h1>\n\
  17\n18      <p>This is where the page-specific content goes. This section, and the\n\
  \          corresponding header, will change from one page to the next.</p>\n19\n\
  20      <p>Volutpat at varius sed sollicitudin et, arcu. Vivamus viverra. Nullam\
  \ turpis.\n          Vestibulum sed etiam. Lorem ipsum sit amet dolore. Nulla facilisi.\
  \ Sed tortor.\n          Aenean felis. Quisque eros. Cras lobortis commodo metus.\
  \ Vestibulum vel purus.\n          In eget odio in sapien adipiscing blandit. Quisque\
  \ augue tortor, facilisis sit\n          amet, aliquam, suscipit vitae, cursus sed,\
  \ arcu lorem ipsum dolor sit amet.</p>\n21\n22  <?php\n23\n24  // Call the function\
  \ again:\n25  create_ad();\n26\n27  include ('includes/footer.html');\n28  ?>\n\
  ```\n\n在实际函数中，代码将输出实际的 HTML，而不是一段文本。（实际的 HTML 将由您用于生成和跟踪广告的服务提供。）\n\n**4.** 关闭函数定义：\n\
  \n```\n} // End of the function\ndefinition.\n```\n\n在函数定义的末尾放置注释很有帮助，这样您就知道定义从哪里开始、到哪里结束（至少对于较长的函数定义是有帮助的）。\n\
  \n**5.** 在包含页眉之后、退出 PHP 代码块之前，调用该函数：\n\n```\ncreate_ad();\n```\n\n对 `create_ad()`\
  \ 函数的调用最终会在此处插入函数的输出。\n\n**6.** 在包含页脚之前，再次调用该函数：\n\n```\ncreate_ad();\n```\n\n**7.**\
  \ 保存文件并在 Web 浏览器中测试它 ![Image](img/graycircle-a.jpg)。\n\n***\n\n提示\n\n如果您看到 *call\
  \ to undefined function function_name* 错误，这意味着您正在调用一个尚未定义的函数。如果您拼错了函数名称（无论是在定义时还是调用时），或者未能包含定义该函数的文件，就可能发生这种情况。\n\
  \n***\n\n***\n\n提示\n\n由于用户定义函数会占用一些内存，您应该谨慎决定何时使用它。一般来说，函数最适合用于可能在脚本或网站的多个位置执行的代码块。\n\
  \n***\n\n#### 创建接受参数的函数\n\n就像 PHP 的内置函数一样，您编写的函数也可以接受*参数*。例如，`strlen()` 函数接受一个字符串作为参数，以确定其字符长度。\n\
  \n函数可以接受任意数量的参数，但您列出它们的顺序至关重要。要允许参数，请在函数定义中添加变量：\n\n```\nfunction print_hello($first,\
  \ $last) {\n    // Function code.\n}\n```\n\n\n\n您为参数使用的变量名与脚本的其余部分无关（更多内容请参阅本章末尾的“变量作用域”栏），但请尽量使用有效且有意义的名称。\n\
  \n函数定义后，您可以像调用 PHP 中的任何其他函数一样调用它，向其传递字面值或变量：\n\n```\nprint_hello ('Jimmy', 'Stewart');\n\
  \n$surname = 'Stewart';\n\nprint_hello ('Jimmy', $surname);\n```\n\n与 PHP 中的任何函数一样，未发送正确数量的参数会导致错误\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/03_figure_13_b.jpg)\n\n![Image](img/circle-b.jpg)未能向函数发送适当数量（有时还有类型）的参数会产生错误。\n\
  \n为了演示这一概念，让我们重写计算器表单，以便用户定义的函数创建每加仑价格的单选按钮。这样做将有助于清理混乱的表单代码。\n\n### 定义接受参数的函数\n\
  \n**1.** 在文本编辑器或 IDE 中打开 **`calculator.php`** (脚本 3.6)。\n\n**2.** 在初始 PHP 标记之后，开始定义\
  \ **`create_gallon_radio()`** 函数 (**脚本 3.8**)：\n\n```\nfunction create_gallon_radio\
  \ ($value) {\n```\n\n该函数将创建如下代码：\n\n```\n<input type=\"radio\" name=\"gallon_price\"\
  \ value=\"XXX\" checked=\"checked\" /> XXX\n```\n\n或：\n\n```\n<input type=\"radio\"\
  \ name=\"gallon_price\" value=\"XXX\" /> XXX\n```\n\n为了能够动态设置每个单选按钮的值，每次调用时必须将该值传递给函数。因此，这是该函数接受的唯一参数。\n\
  \n请注意，用作参数的变量不是 **`$_POST['gallon_price']`**。函数的参数变量专属于此函数，并拥有自己的名称。\n\n**脚本 3.8.**\
  \ `calculator.php` 表单现在使用函数来创建单选按钮。与 `create_ad()` 用户定义函数不同，此函数接受一个参数。\n\n* * *\n\
  \n```\n1   <?php # Script 3.8 - calculator.php #3\n2\n3   // This function creates\
