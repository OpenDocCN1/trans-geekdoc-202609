  如果 **`$errors`** 数组仍为空，则表明所有验证测试均已通过，可以添加打印品。再次使用预处理语句，查询类似于 **`INSERT INTO prints\
  \ (artist_id, print_name, price, size, description, image_name) VALUES (34, 'The\
  \ Scream', 25.99, NULL, 'This classic...', 'scream.jpg')`**。\n\n**`mysqli_stmt_bind_param()`**\
  \ 函数指示查询需要六个输入（每个问号对应一个），类型分别为：整数、字符串、双精度（即浮点数）、字符串、字符串和字符串。如有任何疑问，请参阅 第 13 章。\n\
  \n**10.** 确认查询结果：\n\n```php\nif (mysqli_stmt_affected_rows($stmt) == 1) {\n    echo\
