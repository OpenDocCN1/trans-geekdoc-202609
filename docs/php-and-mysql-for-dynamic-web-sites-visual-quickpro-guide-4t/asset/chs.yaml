  \n}\n```\n\n如果列出的每个变量都拥有真值，则主条件为真。如果变量通过了测试，它将拥有一个值；如果未通过，则值为 `NULL`。如果每个变量都有值，则表单已完整填写，因此将打印\
  \ *Thank you* 消息，以及特定性别的问候语。如果有任何变量为 `NULL`，则将打印第二条消息。\n\n![Image](img/02_figure_13_a.jpg)\n\
  \n脚本现在会检查每个表单元素是否已填写（age 除外），并报告那些未填写的元素。\n\n![Image](img/02_figure_14_b.jpg)\n\n\
  即使只漏填了一两个字段，*Thank you* 消息也不会被打印。\n\n### 9. 关闭 PHP 部分并完成 HTML 页面：\n\n```php\n?>\n\
  </body>\n</html>\n```\n\n### 10. 将文件保存为 `handle_form.php`，将其与 `form.html` 放在同一 Web\
  \ 目录中，并在 Web 浏览器中测试。\n\n以不同程度的完整性填写表单，以测试新脚本。\n\n![Image](img/02_figure_15_c.jpg)\n\
  \n如果表单填写正确，脚本的行为将与之前相同。\n\n---\n\n> **Tip**\n>\n> 要测试提交的值是否为数字，请使用 `is_numeric()`\
  \ 函数。\n\n---\n\n> **Tip**\n>\n> 在 Chapter 14 “Perl-Compatible Regular Expressions”\
  \ 中，您将看到如何使用正则表达式验证表单数据。\n\n---\n\n> **Tip**\n>\n> 让用户在填写表单时知道哪些字段是必填项，以及在适用的情况下该字段的格式（如日期或电话号码），这被认为是良好的规范（此处有双关语，form\
  \ 既指“表单”也指“规范/礼仪”）。\n\n---\n\n### 数组简介\n\nChapter 1 介绍了两种 *scalar*（单值）变量类型：字符串和数字。现在是时候了解另一种类型——*array*（数组）了。与字符串和数字不同，*array*\
  \ 可以容纳多个独立的信息片段。因此，数组就像一个值列表，其中每个值可以是字符串、数字，甚至是另一个数组。\n\n数组的结构是一系列 *key-value*（键值）对，其中一对是该数组的一个项目或\
  \ *element*（元素）。列表中的每个项目都有一个与之关联的 *key*（键）或 *index*（索引）（Table 2.3）。\n\n**Table 2.3.\
  \ Array Example 1: `$artists`**\n\n![Image](img/02tab03.jpg)\n\nPHP 支持两种数组：*indexed*（索引数组），使用数字作为键（如\
  \ Table 2.3 所示）；以及 *associative*（关联数组），使用字符串作为键（Table 2.4）。与大多数编程语言一样，索引数组的第一个索引从\
  \ 0 开始，除非您显式指定键。\n\n**Table 2.4. Array Example 2: `$states`**\n\n![Image](img/02tab04.jpg)\n\
  \n数组遵循与其他变量相同的命名规则。这意味着，乍一看，您可能无法分辨 `$var` 是数组，还是字符串或数字。重要的语法差异出现在访问单个数组元素时。\n\n\
  要引用数组中的特定值，从数组变量名开始，后跟方括号中的键：\n\n```php\n$band = $artists[0]; // The Mynabirds\n\
  echo $states['MD']; // Maryland\n```\n\n您可以看到，数组键在 PHP 中像其他值一样使用：数字（如 0）从不加引号，而字符串（`MD`）必须加引号。\n\
  \n---\n\n### 超全局数组\n\nPHP 包含几个称为 *superglobal*（超全局）变量的预定义数组。它们包括：`$_GET`、`$_POST`、`$_REQUEST`、`$_SERVER`、`$_ENV`、`$_SESSION`\
  \ 和 `$_COOKIE`。\n\n`$_GET` 变量存储通过 `GET` 方法发送给 PHP 脚本的所有值（可能但不一定来自 HTML 表单）。`$_POST`\
  \ 存储从使用 `POST` 方法的 HTML 表单发送给 PHP 脚本的所有数据。这两者——连同 `$_COOKIE`——都是 `$_REQUEST` 的子集，您一直在使用它。\n\
  \n`$_SERVER` 在 Chapter 1 中已使用过，它存储关于 PHP 运行所在服务器的信息，`$_ENV` 也是如此。`$_SESSION` 和 `$_COOKIE`\
  \ 将在 Chapter 12 “Cookies and Sessions” 中讨论。\n\n良好的安全性和编程的一个方面是引用变量时要精确。这意味着，虽然您可以使用\
  \ `$_REQUEST` 访问通过 `POST` 方法提交的表单数据，但 `$_POST` 会更准确。\n\n---\n\n由于数组使用不同于其他变量的语法，且可包含多个值，因此打印它们可能比较棘手。以下代码将无法工作：\n\
  \n```php\necho \"My list of states: $states\";\n```\n\n![Image](img/02_figure_16_a.jpg)\n\
  \n尝试仅使用变量名打印数组会导致打印出单词 *Array*。\n\n然而，如果使用索引（数字）键，打印单个元素的值很简单：\n\n```php\necho \"\
  The first artist is $artists[0].\";\n```\n\n但如果数组使用字符串作为键，用于包裹键的引号会搞乱语法。以下代码将导致解析错误：\n\
  \n```php\necho \"IL is $states['IL'].\"; // BAD!\n```\n\n![Image](img/02_figure_17_b.jpg)\n\
  \n尝试在*不*使用花括号的情况下打印关联数组中的元素会导致解析错误。\n\n要修复此问题，当数组使用字符串作为键时，请将数组名和键包裹在花括号中：\n\n```php\n\
  echo \"IL is {$states['IL']}.\";\n```\n\n![Image](img/02_figure_18_c.jpg)\n\n在使用花括号的情况下尝试打印关联数组中的元素可按预期工作。\n\
  \n\n\n\n如果数组对你来说似乎有点眼熟，那是因为你已经使用过两个了：`$_SERVER`（见第 1 章）和`$_REQUEST`（见本章）。为了让你熟悉另一个数组并练习直接打印数组值，将使用更具体的`$_POST`数组创建`handle_form.php`页面的一个最终的、基础的版本（见“超全局数组”侧边栏）。\n\
  \n#### 使用数组\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 脚本，命名为`handle_form.php`，从初始 HTML 开始（**脚本\
  \ 2.5**）：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\n<head>\n\n  <meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\n  <title>Form\
  \ Feedback</title>\n\n</head>\n\n<body>\n\n<?php # Script 2.5 - handle_form.php\
  \ #4\n```\n\n**2.** 执行一些基本的表单验证：\n\n```php\nif (!empty($_POST['name']) && !empty($_POST['comments'])\
  \ && !empty($_POST['email'])) {\n```\n\n在该脚本的前一个版本中，通过引用`$_REQUEST`数组来访问值。但由于这些变量来自一个使用\
  \ POST 方法的表单（见脚本 2.1），`$_POST`将是一个更精确、因此更安全的引用。\n\n此条件检查这三个文本输入是否都不为空。使用`and`运算符（`&&`），仅当三个子条件都为真时，整个条件才为真。\n\
  \n**3.** 打印消息：\n\n```php\necho \"<p>Thank you, <b>{$_POST['name']}</b>, for the\
  \ following comments:<br />\n\n<tt>{$_POST['comments']}</tt></p>\n\n<p>We will reply\
  \ to you at <i>{$_POST['email']}</i>.</p>\\n\";\n```\n\n**脚本 2.5.** 超全局变量，如这里的`$_POST`，只是你在\
  \ PHP 中将使用的数组的一种类型。\n\n---\n\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/\n2    DTD/xhtml1-transitional.dtd\">\n3  <html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n4  <head>\n\
  5      <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\
  6      <title>Form Feedback</title>\n7  </head>\n8  <body>\n8  <?php # Script 2.5\
  \ - handle_form.php #4\n9\n10  // Print the submitted information:\n11  if (!empty($_POST['name'])\
  \ && !empty($_POST['comments']) && !empty($_POST['email'])) {\n12      echo \"<p>Thank\
  \ you, <b>{$_POST['name']}</b>, for the following comments:<br />\n13  <tt>{$_POST['comments']}</tt></p>\n\
  14  <p>We will reply to you at <i>{$_POST['email']}</i>.</p>\\n\";\n15  } else {\
  \ // Missing form value.\n16      echo '<p>Please go back and fill out the form\
  \ again.</p>';\n17  }\n18  ?>\n19  </body>\n20  </html>\n\n---\n\n理解了数组的概念后，你仍然需要掌握打印数组所涉及的语法。当打印一个使用字符串作为键的数组元素时，使用花括号（如这里的`{$_POST['name']}`）以避免解析错误。\n\
  \n**4.** 完成步骤 2 中开始的条件语句：\n\n```php\n} else {\n\n  echo '<p>Please go back and fill\
  \ out the form again.</p>';\n\n}\n```\n\n如果步骤 2 中的三个子条件中的任何一个不为真（也就是说，如果任何变量的值为空），则适用此`else`子句并打印错误消息\
  \ ![Image](img/circle-d.jpg)。\n\n![Image](img/02_figure_19_d.jpg)\n\n![Image](img/circle-d.jpg)如果三个测试的表单输入中有任何一个为空，则会打印此通用错误消息。\n\
  \n**5.** 完成 PHP 和 HTML 代码：\n\n```php\n?>\n\n</body>\n\n</html>\n```\n\n**6.** 将文件保存为`handle_form.php`，将其与`form.html`放在同一\
  \ Web 目录中，并在 Web 浏览器中测试它 ![Image](img/circle-e.jpg)。\n\n![Image](img/02_figure_20_e.jpg)\n\
  \n![Image](img/circle-e.jpg)脚本现在使用`$_POST`数组这一事实对可见结果没有影响。\n\n---\n\n> **Tip**\n\
  >\n> 因为 PHP 对其变量结构要求不严格，数组甚至可以使用数字和字符串的组合作为键。唯一重要的规则是数组的键必须各不相同。\n\n---\n\n> **Tip**\n\
  >\n> 如果你发现直接访问超全局数组的语法令人困惑（例如`$_POST['name']`），你可以继续在脚本顶部使用简写技术，就像你一直做的那样：\n>\n\
  > ```php\n> $name = $_POST['name'];\n> ```\n>\n> 在此脚本中，你将需要更改条件语句和`echo`语句以引用`$name`等。\n\
  \n---\n\n> **Tip**\n>\n> 只有当关联数组在引号内使用时，才需要使用花括号将其括起来。所有这些数组引用都没问题：\n>\n> ```php\n\
  > echo $_POST['name'];\n> echo \"The first item is $item[0].\";\n> $total = number_format($cart['total']);\n\
  > ```\n\n---\n\n#### 创建数组\n\n前面的示例使用了一个 PHP 生成的数组，但经常会有你想要创建自己的数组的时候。定义自己的数组主要有两种方法。首先，你可以一次添加一个元素来构建一个：\n\
  \n```php\n$band[] = 'Jemaine';\n$band[] = 'Bret';\n$band[] = 'Murray';\n```\n\n\
  由于数组索引从 0 开始，`$band[0]`的值为*Jemaine*；`$band[1]`为*Bret*，`$band[2]`为*Murray*。\n\n或者，你可以在添加元素时指定键。但重要的是要理解，如果你指定了一个键且已有一个值使用该键进行索引，则新值将覆盖现有值：\n\
  \n```php\n$band['fan'] = 'Mel';\n$band['fan'] = 'Dave'; // New value\n$fruit[2]\
  \ = 'apple';\n$fruit[2] = 'orange'; // New value\n```\n\n你可以使用`array()`函数一次性构建整个数组，而不必一次添加一个元素：\n\
  \n```php\n$states = array (\n  'IA' => 'Iowa',\n  'MD' => 'Maryland'\n);\n```\n\n\
  （由于 PHP 通常不敏感空白字符，你可以跨多行使用此函数以增加清晰度。）\n\n无论你是否显式设置键，都可以使用`array()`函数：\n\n```php\n\
  $artists = array ('Clem Snide', 'Shins', 'Eels');\n```\n\n或者，如果你设置了第一个数字键值，随后添加的值将从那里开始按增量键控：\n\
  \n```php\n$days = array (1 => 'Sun', 'Mon', 'Tue');\necho $days[3]; // Tue\n```\n\
  \n`array()`函数也用于在引用数组之前对其进行初始化：\n\n```php\n$tv = array();\n$tv[] = 'Flight of the\
  \ Conchords';\n```\n\n在 PHP 中初始化数组（或任何变量）不是必需的，但它使代码更清晰并有助于避免错误。\n\n最后，如果你想创建一个连续数字的数组，可以使用`range()`函数：\n\
  \n```php\n$ten = range (1, 10);\n```\n\n#### 访问整个数组\n\n你已经看到了如何使用键访问单个数组元素（例如`$_POST['email']`）。当你确切知道键是什么，或者只想引用单个元素时，这很有效。要访问每个数组元素，请使用`foreach`循环：\n\
  \n```php\nforeach ($array as $value) {\n    // Do something with $value.\n}\n```\n\
  \n`foreach`循环将遍历`$array`中的每个元素，将每个元素的值赋给`$value`变量。要同时访问键和值，请使用：\n\n```php\nforeach\
  \ ($array as $key => $value) {\n    echo \"The value at $key is $value.\";\n}\n\
  ```\n\n**脚本 2.6.** 此表单使用数组动态创建三个下拉菜单。\n\n---\n\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD\n\
  2    XHTML 1.0 Transitional//EN\"\n3    \"http://www.w3.org/TR/xhtml1/DTD/\n4  \
  \  xhtml1-transitional.dtd\">\n5  <html xmlns=\"http://www.w3.org/1999/\n6    xhtml\"\
  \ xml:lang=\"en\" lang=\"en\">\n7  <head>\n8      <meta http-equiv=\"Content-Type\"\
  \n9          content=\"text/html; charset=utf-8\" />\n10      <title>Calendar</title>\n\
  11  </head>\n12  <body>\n13  <form action=\"calendar.php\"\n14    method=\"post\"\
  >\n15  <?php # Script 2.6 - calendar.php\n```\n\n\n\n\n#### 创建和访问数组\n\n**1.** 在文本编辑器或\
  \ IDE 中新建一个 PHP 文档，命名为 `calendar.php`，从初始 HTML 开始（Script 2.6）：\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Calendar</title>\n</head>\n<body>\n<form action=\"calendar.php\" method=\"\
  post\">\n<?php # Script 2.6 - calendar.php\n```\n\n这里要注意的一点是，即使页面不包含完整的 HTML 表单，仍然需要表单标签来创建下拉菜单。\n\
  \n**2.** 创建月份数组：\n\n```php\n$months = array (1 => 'January', 'February', 'March',\
  \ 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November',\
  \ 'December');\n```\n\n该数组将使用数字作为键，范围从 1 到 12。由于指定了第一个键的值，后续值将按顺序递增索引（换句话说，`1 =>`\
  \ 代码创建的数组索引是从 1 到 12，而不是从 0 到 11）。\n\n**3.** 创建月份日期和年份的数组：\n\n```php\n$days = range\
  \ (1, 31);\n$years = range (2011, 2021);\n```\n\n使用 `range()` 函数，可以轻松创建一个数字数组。\n\
  \n**4.** 生成月份下拉菜单：\n\n```php\necho '<select name=\"month\">';\nforeach ($months\
  \ as $key => $value) {\n  echo \"<option value=\\\"$key\\\">$value</option>\\n\"\
  ;\n}\necho '</select>';\n```\n\n`foreach` 循环可以快速生成月份下拉菜单的所有 HTML 代码。每次循环执行都会创建一行类似\
  \ `<option value=\"1\">January</option>` 的代码。\n\n**5.** 生成日期和年份下拉菜单：\n\n```php\n\
  echo '<select name=\"day\">';\nforeach ($days as $value) {\n  echo \"<option value=\\\
  \"$value\\\">$value</option>\\n\";\n}\necho '</select>';\necho '<select name=\"\
  year\">';\nforeach ($years as $value) {\n  echo \"<option value=\\\"$value\\\">$value</option>\\\
  n\";\n}\necho '</select>';\n```\n\n与月份示例不同，日期和年份下拉菜单将对选项的值和标签使用相同的数据（数字）。因此，无需在每次循环迭代中获取数组的键。\n\
  \n**6.** 关闭 PHP、表单标签和 HTML 页面：\n\n```php\n?>\n</form>\n</body>\n</html>\n```\n\n\
  **7.** 将文件保存为 `calendar.php`，放入 Web 目录，并在 Web 浏览器中测试。\n\n---\n\n> **Tip**\n>\n>\
  \ 要确定数组中的元素数量，请使用 `count()`：\n>\n> ```php\n> $num = count($array);\n> ```\n\n---\n\
  \n> **Tip**\n>\n> `range()` 函数也可以创建一个顺序字母数组：\n>\n> ```php\n> $alphabet = range ('a',\
  \ 'z');\n> ```\n\n---\n\n> **Tip**\n>\n> 数组的键可以是多词字符串，例如 `first name` 或 `phone number`。\n\
  \n---\n\n> **Tip**\n>\n> `is_array()` 函数用于确认变量是否为数组类型。\n\n---\n\n> **Tip**\n>\n\
  > 如果看到 *Invalid argument supplied for foreach()* 错误消息，意味着你正尝试在非数组变量上使用 `foreach`\
  \ 循环。\n\n---\n\n### 多维数组\n\n在介绍数组时，我提到数组的值可以是数字、字符串，甚至是其他数组的任意组合。最后一种情况——由其他数组组成的数组——创建了*多维数组*。\n\
  \n多维数组比你想象的要常见得多，但使用起来非常简单。例如，从一个质数数组开始：\n\n```php\n$primes = array(2, 3, 5, 7,\
  \ ...);\n```\n\n然后创建一个*楔形数*（别担心：我最初也不知道什么是楔形数；我是查阅资料才知道的）：\n\n```php\n$sphenic =\
  \ array(30, 42, 66, 70, ...);\n```\n\n这两个数组可以组合成一个多维数组，如下所示：\n\n```php\n$numbers\
  \ = array ('Primes' => $primes, 'Sphenic' => $sphenic);\n```\n\n现在，`$numbers` 是一个多维数组。要访问质数子数组，请引用\
  \ `$numbers['Primes']`。要访问质数 5，请使用 `$numbers['Primes'][2]`（它是数组中的第三个元素，但数组索引从 0\
  \ 开始）。要输出其中一个值，请将整个结构用花括号括起来：\n\n```php\necho \"The first sphenic number is {$numbers['Sphenic'][0]}.\"\
  ;\n```\n\n当然，你也可以使用 `foreach` 循环访问多维数组，如有必要可将一个循环嵌套在另一个内部。下一个示例将演示这一点。\n\n#### 使用多维数组\n\
  \n**1.** 在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `multi.php`，从初始 HTML 开始（**Script 2.7**）：\n\
  \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Multidimensional Arrays</title>\n</head>\n<body>\n<p>Some North American\
  \ States, Provinces, and Territories:</p>\n<?php # Script 2.7 - multi.php\n```\n\
  \n此 PHP 页面将打印出北美三国（墨西哥、美国和加拿大）中的一些州、省和地区。\n\n**2.** 创建墨西哥州数组：\n\n```php\n$mexico\
  \ = array(\n  'YU' => 'Yucatan',\n  'BC' => 'Baja California',\n  'OA' => 'Oaxaca'\n\
  );\n```\n\n这是一个关联数组，使用州的邮政缩写作为键。州的全名是元素的值。这显然是一个不完整的列表，仅用于演示概念。\n\n**Script 2.7.**\
  \ 多维数组是通过使用其他数组作为其值来创建的。两个 `foreach` 循环，一个嵌套在另一个内部，可以访问每个数组元素。\n\n---\n\n\n\n\n\
  ### 多维数组\n\n### PHP 脚本示例\n\n```php\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0\
  \ Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\
  \    <title>Multidimensional Arrays</title>\n</head>\n<body>\n<p>Some North American\
  \ States, Provinces, and Territories:</p>\n<?php # Script 2.7 - multi.php\n\n//\
  \ Create one array:\n$mexico = array(\n    'YU' => 'Yucatan',\n    'BC' => 'Baja\
  \ California',\n    'OA' => 'Oaxaca'\n);\n\n// Create another array:\n$us = array(\n\
  \    'MD' => 'Maryland',\n    'IL' => 'Illinois',\n    'PA' => 'Pennsylvania',\n\
  \    'IA' => 'Iowa'\n);\n\n// Create a third array:\n$canada = array(\n    'QC'\
  \ => 'Quebec',\n    'AB' => 'Alberta',\n    'NT' => 'Northwest Territories',\n \
  \   'YT' => 'Yukon',\n    'PE' => 'Prince Edward Island'\n);\n\n// Combine the arrays:\n\
  $n_america = array(\n    'Mexico' => $mexico,\n    'United States' => $us,\n   \
  \ 'Canada' => $canada\n);\n\n// Loop through the countries:\nforeach ($n_america\
  \ as $country => $list) {\n\n    // Print a heading:\n    echo \"<h2>$country</h2><ul>\"\
  ;\n\n    // Print each state, province, or territory:\n    foreach ($list as $k\
  \ => $v) {\n        echo \"<li>$k - $v</li>\\n\";\n    }\n\n    // Close the list:\n\
  \    echo '</ul>';\n} // End of main FOREACH.\n\n?>\n</body>\n</html>\n```\n\n####\
  \ 分步解释\n\n### 3. 创建第二个和第三个数组\n\n```php\n$us = array(\n    'MD' => 'Maryland',\n\
  \    'IL' => 'Illinois',\n    'PA' => 'Pennsylvania',\n    'IA' => 'Iowa'\n);\n\n\
  $canada = array(\n    'QC' => 'Quebec',\n    'AB' => 'Alberta',\n    'NT' => 'Northwest\
  \ Territories',\n    'YT' => 'Yukon',\n    'PE' => 'Prince Edward Island'\n);\n\
  ```\n\n### 4. 将所有数组合并为一个\n\n```php\n$n_america = array(\n    'Mexico' => $mexico,\n\
  \    'United States' => $us,\n    'Canada' => $canada\n);\n```\n\n你不必非要创建三个数组然后将它们赋值给第四个数组来创建所需的多维数组，但我认为这样做更易于阅读和理解（在一步中定义多维数组会导致代码难看）。\n\
  \n`$n_america` 数组现在包含三个元素。每个元素的键是一个字符串，即国家名称。每个元素的值是该国所包含的州、省或地区的数组。\n\n### 5. 开始主\
  \ `foreach` 循环\n\n```php\nforeach ($n_america as $country => $list) {\n    echo\
  \ \"<h2>$country</h2><ul>\";\n}\n```\n\n遵循前面概述的语法，此循环将访问 `$n_america` 的每个元素。这意味着循环将运行三次。在循环的每次迭代中，`$country`\
  \ 变量将存储 `$n_america` 数组的键（*Mexico*、*Canada* 或 *United States*）。同样在循环的每次迭代中，`$list`\
  \ 变量将存储元素的值（相当于 `$mexico`、`$us` 和 `$canada`）。\n\n为了输出结果，循环首先在 `H2` 标签中打印国家名称。由于州等信息应显示为\
  \ HTML 列表，因此也会打印初始无序列表标签 (`<ul>`)。\n\n### 6. 创建第二个 `foreach` 循环\n\n```php\nforeach\
  \ ($list as $k => $v) {\n    echo \"<li>$k - $v</li>\\n\";\n}\n```\n\n此循环将遍历每个子数组（先是\
  \ `$mexico`，然后是 `$us`，最后是 `$canada`）。在该循环的每次迭代中，`$k` 将存储缩写，`$v` 存储全称。两者都在 HTML 列表标签内打印出来。同时也使用了换行符，以便更好地格式化\
  \ HTML 源代码。\n\n### 7. 完成外层 `foreach` 循环\n\n```php\necho '</ul>';\n} // End of main\
  \ FOREACH.\n```\n\n内层 `foreach` 循环结束后，外层 `foreach` 循环必须关闭第 5 步开始的无序列表。\n\n### 8.\
  \ 完成 PHP 和 HTML\n\n```php\n?>\n</body>\n</html>\n```\n\n### 9. 保存并测试\n\n将文件保存为 `multi.php`，将其放在你的\
  \ Web 目录中，并在 Web 浏览器中测试。\n\n### 10. 检查 HTML 源代码\n\n如果你愿意，可以查看 HTML 源代码，看看 PHP 生成了什么。\n\
  \n---\n\n### 提示：来自 HTML 表单的多维数组\n\n多维数组也可以来自 HTML 表单。例如，如果表单有一系列名为 `interests[]`\
  \ 的复选框：\n\n```html\n<input type=\"checkbox\" name=\"interests[]\" value=\"Music\"\
  \ /> Music\n<input type=\"checkbox\" name=\"interests[]\" value=\"Movies\" /> Movies\n\
  <input type=\"checkbox\" name=\"interests[]\" value=\"Books\" /> Books\n```\n\n\
  接收页面中的 `$_POST` 变量将是多维的。`$_POST['interests']` 将是一个数组，其中 `$_POST['interests'][0]`\
  \ 存储第一个被选中复选框的值（例如 Movies），`$_POST['interests'][1]` 存储第二个（Books），以此类推。注意只有被选中的复选框会被传递给\
  \ PHP 页面。\n\n---\n\n### 提示：来自选择菜单的多维数组\n\n如果 HTML 表单的选择菜单允许多选，也会得到一个多维数组：\n\n```html\n\
  <select name=\"interests[]\" multiple=\"multiple\">\n    <option value=\"Music\"\
  >Music</option>\n    <option value=\"Movies\">Movies</option>\n    <option value=\"\
  Books\">Books</option>\n    <option value=\"Napping\">Napping</option>\n</select>\n\
  ```\n\n同样，只有被选中的值会被传递给 PHP 页面。\n\n---\n\n### 数组与字符串\n\n因为数组和字符串经常一起使用，PHP 有两个函数用于在它们之间转换：\n\
  \n```php\n$array = explode(separator, $string);\n$string = implode(glue, $array);\n\
  ```\n\n理解和使用这两个函数的关键在于 *separator*（分隔符）和 *glue*（粘合符）的关系。将数组转换为字符串时，你需要确定粘合符——即在生成的字符串中插在数组值之间的字符或代码。反之，将字符串转换为数组时，你需要指定分隔符，即标记什么应成为单独数组元素的标记。\n\
  \n例如，从一个字符串开始：\n\n```php\n$s1 = 'Mon-Tue-Wed-Thu-Fri';\n$days_array = explode('-',\
  \ $s1);\n```\n\n`$days_array` 变量现在是一个五元素数组，*Mon* 索引为 `0`，*Tue* 索引为 `1`，以此类推。\n\n\
  ```php\n$s2 = implode(', ', $days_array);\n```\n\n`$s2` 变量现在是一个逗号分隔的日期列表：*Mon, Tue,\
  \ Wed, Thu, Fri*。\n\n---\n\n### 数组排序\n\n数组相对于其他变量类型的众多优势之一是能够对其进行排序。PHP 包含几个可用于数组排序的函数，语法都很简单：\n\
  \n```php\n$names = array('Moe', 'Larry', 'Curly');\nsort($names);\n```\n\n排序函数执行三种类型的排序：\n\
  \n1. **按值排序，丢弃原键**，使用 `sort()`。重要的是要理解，排序过程后数组的键将被重置，因此*如果键值关系很重要，则不应使用* `sort()`。\n\
  2. **按值排序并保留键**，使用 `asort()`。\n3. **按键排序**，使用 `ksort()`。\n\n如果将它们分别改为 `rsort()`、`arsort()`\
  \ 和 `krsort()`，则每种都可以按逆序排序。\n\n为了演示数组排序的效果，下一个脚本将创建一个电影标题和评分（我有多喜欢它们，按 1 到 10 的等级）的数组，然后以不同方式显示此列表。\n\
  \n#### 对数组进行排序\n\n#### 1. 开始一个新的 PHP 文档\n\n在文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `sorting.php`，从初始\
  \ HTML 开始（**脚本 2.8**）：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0\
  \ Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n```\n\n\n\n\n### 数组排序\n\n### 2. 创建 HTML 表格\n\n为了使有序列表更易于阅读，它将在 HTML 表格中打印。表格从这里开始。\n\
  \n```html\n<table border=\"0\" cellspacing=\"3\" cellpadding=\"3\" align=\"center\"\
  >\n  <tr>\n    <td><h2>Rating</h2></td>\n    <td><h2>Title</h2></td>\n  </tr>\n\
  ```\n\n### 3. 添加 PHP 开始标签并创建新数组\n\n```php\n<?php # Script 2.8 - sorting.php\n\n\
  $movies = array (\n  'Casablanca' => 10,\n  'To Kill a Mockingbird' => 10,\n  'The\
  \ English Patient' => 2,\n  'Stranger Than Fiction' => 9,\n  'Story of the Weeping\
  \ Camel' => 5,\n  'Donnie Darko' => 7\n);\n```\n\n**脚本 2.8。** 定义了一个数组，然后以两种不同的方式对其进行排序：首先按键排序，然后按值排序（逆序）。\n\
  \n---\n\n```php\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD\n    XHTML 1.0 Transitional//EN\"\
  \n    \"http://www.w3.org/TR/xhtml1/DTD/\n    xhtml1-transitional.dtd\">\n2  <html\
  \ xmlns=\"http://www.w3.org/1999/\n    xhtml\" xml:lang=\"en\" lang=\"en\">\n3 \
  \ <head>\n4      <meta http-equiv=\"Content-Type\"\n        content=\"text/html;\
  \ charset=utf-8\" />\n5      <title>Sorting Arrays</title>\n6  </head>\n7  <body>\n\
  8  <table border=\"0\" cellspacing=\"3\"\n    cellpadding=\"3\" align=\"center\"\
  >\n9      <tr>\n10         <td><h2>Rating</h2></td>\n11         <td><h2>Title</h2></td>\n\
  12     </tr>\n13  <?php # Script 2.8 - sorting.php\n\n14  // Create the array:\n\
  15  $movies = array (\n16  'Casablanca' => 10,\n17  'To Kill a Mockingbird' => 10,\n\
  18  'The English Patient' => 2,\n19  'Stranger Than Fiction' => 9,\n20  'Story of\
  \ the Weeping Camel' => 5,\n21  'Donnie Darko' => 7\n22  );\n\n23  // Display the\
  \ movies in their\n    // original order:\n24  echo '<tr><td colspan=\"2\"><b>In\n\
  \    their original order:</b></td></tr>';\n25  foreach ($movies as $title =>\n\
  \    $rating) {\n26      echo \"<tr><td>$rating</td>\n    <td>$title</td></tr>\\\
  n\";\n27  }\n\n28  // Display the movies sorted by title:\n29  ksort($movies);\n\
  30  echo '<tr><td colspan=\"2\"><b>Sorted by\n    title:</b></td></tr>';\n31  foreach\
  \ ($movies as $title =>\n    $rating) {\n32      echo \"<tr><td>$rating</td>\n \
  \   <td>$title</td></tr>\\n\";\n33  }\n\n34  // Display the movies sorted by\n \
  \   // rating:\n35  arsort($movies);\n36  echo '<tr><td colspan=\"2\"><b>Sorted\
  \ by\n    rating:</b></td></tr>';\n37  foreach ($movies as $title =>\n    $rating)\
  \ {\n38      echo \"<tr><td>$rating</td>\n    <td>$title</td></tr>\\n\";\n39  }\n\
  \n40  ?>\n41  </table>\n42  </body>\n43  </html>\n```\n\n---\n\n该数组使用电影标题作为键，各自的评分作为值。这种结构将为整个列表的排序提供多种可能性。请随意更改电影列表和排名（只是别因为我的电影品味而责备我）。\n\
  \n### 4. 按原样打印数组\n\n```php\necho '<tr><td colspan=\"2\"><b>In their original order:</b></td></tr>';\n\
  foreach ($movies as $title => $rating) {\n  echo \"<tr><td>$rating</td>\n  <td>$title</td></tr>\\\
  n\";\n}\n```\n\n此时脚本中的数组顺序与定义时相同。为验证这一点，将其打印出来。首先在两个表格列上打印一个标题。然后，在 `foreach` 循环中，键打印在第一列，值打印在第二列。同时也会打印一个换行符，以提高\
  \ HTML 源代码的可读性。\n\n### 5. 按标题字母顺序对数组排序并再次打印\n\n```php\nksort($movies);\necho '<tr><td\
  \ colspan=\"2\"><b>Sorted by title:</b></td></tr>';\nforeach ($movies as $title\
  \ => $rating) {\n  echo \"<tr><td>$rating</td>\n  <td>$title</td></tr>\\n\";\n}\n\
  ```\n\n`ksort()` 函数将按键对数组进行升序排序，同时保持键值关系。其余代码重复步骤 4。\n\n### 6. 按评分数值降序对数组排序并再次打印\n\
  \n```php\narsort($movies);\necho '<tr><td colspan=\"2\"><b>Sorted by rating:</b></td></tr>';\n\
  foreach ($movies as $title => $rating) {\n  echo \"<tr><td>$rating</td>\n  <td>$title</td></tr>\\\
  n\";\n}\n```\n\n要按值（评分）排序并同时保持键不变，可以使用 `asort()` 函数。但由于最高分的电影应排在最前面，因此必须反转顺序，使用\
  \ `arsort()`。\n\n### 7. 完成 PHP、表格和 HTML\n\n```php\n?>\n</table>\n</body>\n</html>\n\
  ```\n\n### 8. 将文件保存为 `sorting.php`，放入 Web 目录，并在 Web 浏览器中测试\n\n![Image](img/02_figure_24_i.jpg)\n\
  \n此页面演示了数组排序的不同方式。\n\n---\n\n> **提示**\n>\n> 要随机化数组的顺序，请使用 `shuffle()`。\n\n---\n\n\
  > **提示**\n>\n> PHP 的 `natsort()` 函数可用于以更自然的顺序对数组进行排序（主要是更好地处理字符串中的数字）。\n\n---\n\n\
  > **提示**\n>\n> 多维数组在 PHP 中稍加努力即可排序。有关 `usort()` 函数的更多信息，请参阅 PHP 手册，或查看我的著作 *PHP\
  \ 5 Advanced: Visual QuickPro Guide*。\n\n---\n\n### For 和 While 循环\n\n本章要讨论的最后一个语言结构是循环。你已经用过一个了，即\
  \ `foreach`，用于访问数组中的每个元素。你将使用的其他两种循环类型是 `for` 和 `while`。\n\n##### `while` 循环\n\n\
  `while` 循环如下所示：\n\n```php\nwhile (condition) {\n  // Do something.\n}\n```\n\n只要循环的\
  \ *condition*（条件）部分为真，循环就会执行。一旦变为假，循环停止。如果条件从未为真，循环将永不执行。`while` 循环最常用于从数据库检索结果，正如你将在\
  \ 第 9 章 “将 PHP 与 MySQL 结合使用” 中看到的那样。\n\n![Image](img/02_figure_25_a.jpg)\n\n*PHP\
  \ 处理 `while` 循环的流程图表示。*\n\n#### `for` 循环\n\n`for` 循环具有更复杂的语法：\n\n```php\nfor (initial\
  \ expression; condition; closing expression) {\n  // Do something.\n}\n```\n\n首次执行循环时，将运行初始表达式。然后检查条件，如果为真，则执行循环体内容。执行后，运行结束表达式并再次检查条件。此过程持续直到条件为假。例如：\n\
  \n```php\nfor ($i = 1; $i <= 10; $i++) {\n  echo $i;\n}\n```\n\n![Image](img/02_figure_26_b.jpg)\n\
  \n*PHP 处理更复杂的 `for` 循环的流程图表示。*\n\n第一次运行此循环时，`$i` 变量被设置为 1。然后检查条件（*1 是否小于或等于 10？*）。因为这是真的，所以打印出\
  \ 1（`echo $i`）。然后，`$i` 增加到 2（`$i++`），再次检查条件，依此类推。该脚本的结果将打印出数字 1 到 10。\n\n这两种循环的功能足够相似，以至于\
  \ `for` 和 `while` 通常可以互换使用。尽管如此，经验会表明 `for` 循环更适合做 *已知次数* 的事情，而 `while` 用于条件将为真\
  \ *未知次数* 的情况。\n\n在本章的最后一个示例中，将使用 `for` 循环重写之前创建的日历脚本，以替换其中的两个 `foreach` 循环。\n\n\
  #### 使用循环\n\n**1.** 在文本编辑器或 IDE 中打开 `calendar.php`（参考 脚本 2.6）。\n\n**2.** 删除 `$days`\
  \ 和 `$years` 数组的创建（第 18-19 行）。\n\n\n\n\n使用循环，无需创建实际数组所涉及的额外代码和内存开销，即可实现两个下拉菜单的相同效果。因此应删除这两个数组，同时仍保留\
  \ `$months` 数组。\n\n**3.** 将 `$days foreach` 循环重写为 `for` 循环（脚本 2.9）：\n\n```php\n\
  for ($day = 1; $day <= 31; $day++) {\n    echo \"<option value=\\\"$day\\\">$day</option>\\\
  n\";\n}\n```\n\n这个标准的 `for` 循环首先将 `$day` 变量初始化为 1。它将持续循环直到 `$day` 大于 31，每次迭代时 `$day`\
  \ 将加 1。循环体本身（将执行 31 次）是一条 `echo` 语句。\n\n**脚本 2.9。** 循环常与数组结合使用，或替代数组使用。此处，两个 `for`\
  \ 循环取代了前一个脚本中使用的数组和 `foreach` 循环。\n\n```html\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\n\
  \        XHTML 1.0 Transitional//EN\"\n                \"http://www.w3.org/TR/xhtml1/DTD/\n\
  \                xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \        xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n            content=\"text/html; charset=utf-8\" />\n5       <title>Calendar</title>\n\
  6   </head>\n7   <body>\n8   <form action=\"calendar.php\"\n        method=\"post\"\
  >\n9   <?php # Script 2.9 - calendar.php #2\n\n10  // This script makes three pull-down\n\
  \        menus\n11  // for an HTML form: months, days, years.\n\n12  // Make the\
  \ months array:\n13  $months = array (1 => 'January',\n        'February', 'March',\
  \ 'April', 'May',\n        'June', 'July', 'August', 'September',\n        'October',\
  \ 'November', 'December');\n\n14  // Make the months pull-down menu:\n15  echo '<select\
  \ name=\"month\">';\n16  foreach ($months as $key => $value) {\n17      echo \"\
  <option value=\\\"$key\\\">$value\n            </option>\\n\";\n18  }\n19  echo\
  \ '</select>';\n\n20  // Make the days pull-down menu:\n21  echo '<select name=\"\
  day\">';\n22  for ($day = 1; $day <= 31; $day++) {\n23      echo \"<option value=\\\
  \"$day\\\">\n            $day</option>\\n\";\n24  }\n25  echo '</select>';\n\n26\
  \  // Make the years pull-down menu:\n27  echo '<select name=\"year\">';\n28  for\
  \ ($year = 2011; $year <= 2021;\n        $year++) {\n29      echo \"<option value=\\\
  \"$year\\\">\n            $year</option>\\n\";\n30  }\n31  echo '</select>';\n\n\
  32  ?>\n33  </form>\n34  </body>\n35  </html>\n```\n\n**4.** 将 `$years foreach`\
  \ 循环重写为 `for` 循环：\n\n```php\nfor ($year = 2011; $year <= 2021; $year++) {\n    echo\
  \ \"<option value=\\\"$year\\\"> $year</option>\\n\";\n}\n```\n\n此循环的结构从根本上与 `$day\
  \ for` 循环相同，但 `$year` 变量初始设置为 2011 而非 1。只要 `$year` 小于或等于 2021，循环就会执行。在循环内部，将运行 `echo`\
  \ 语句。\n\n**5.** 保存文件，将其放入您的 Web 目录，并在 Web 浏览器中测试它 ![Image](img/circle-c.jpg)。\n\n\
  ![Image](img/02_figure_27_c.jpg)\n\n![Image](img/circle-c.jpg) 此日历表单外观与之前相同，但使用的数组减少了两个（对比\
  \ 脚本 2.9 与 脚本 2.6）。\n\n***\n\n提示\n\nPHP 还有一种语法略有不同的 `do...while` 循环（请查阅手册）。此循环至少会执行一次。\n\
  \n***\n\n提示\n\n使用循环时，请留意您的参数和条件，以避免可怕的无限循环，当循环的条件永远不会为 false 时就会发生这种情况。\n\n***\n\
