  \n## 第 3 章 创建动态网站\n\n本章内容\n\n*   包含多个文件 76\n*   再谈 HTML 表单处理 85\n*   创建粘性表单 91\n\
  *   创建自定义函数 95\n*   复习与实践 110\n\n\n\n\n\n掌握了 PHP 的基础知识后，是时候开始构建真正的动态 Web 站点了。*动态*\
  \ Web 站点（相对于 Web 早期构建所基于的静态站点）更易于维护，对用户响应更灵敏，并能根据不同情况改变其内容。本章介绍三个新概念，它们都常用于创建更复杂的\
  \ Web 应用程序（第 11 章“Web 应用程序开发”将涵盖另外一些相关主题）。\n\n### 包含多个文件\n\n到目前为止，本书中的每个脚本都由单个文件组成，包含所有必需的\
  \ HTML 和 PHP 代码。但随着你开发更复杂的 Web 站点，你会发现这种方法通常不切实际。创建动态 Web 应用程序的更好方式是将脚本和 Web 站点划分为不同的部分，每个部分存储在各自的文件中。你经常会使用多个文件将\
  \ HTML 从 PHP 中分离出来，或者将常用流程分离出来。\n\nPHP 有四个函数用于引入外部文件：`include()`、`include_once()`、`require()`\
  \ 和 `require_once()`。使用它们时，你的 PHP 脚本会包含类似如下的代码行：\n\n```\ninclude_once('filename.php');\n\
  \nrequire('/path/to/filename.html');\n```\n\n使用上述任一函数的最终结果都是：获取被引入文件的所有内容，并将其插入到父脚本（调用该函数的脚本）的该位置处。关于引入文件的一个重要考量是：除非文件包含\
  \ PHP 标签内的代码，否则 PHP 会将引入的代码视为 HTML（即直接发送给浏览器）。\n\n就功能而言，被引入文件使用什么扩展名（无论是 `.php`\
  \ 还是 `.html`）并不重要。不过，给文件一个有意义的名称和扩展名有助于传达其用途（例如，包含 HTML 的引入文件可能使用 `.inc.html`）。另请注意，你可以使用*绝对*路径或*相对*路径来引用被引入文件（详见侧边栏）。\n\
  \n***\n\n**绝对路径 vs. 相对路径**\n\n引用任何外部项目时，无论是 PHP 中的引入文件、HTML 中的 CSS 文档还是图片，你都可以选择使用*绝对*路径或*相对*路径。绝对路径从计算机的根目录开始引用文件：\n\
  \n```\ninclude ('C:/php/includes/file.php');\n\ninclude('/usr/xyz/includes/file.php');\n\
  ```\n\n假设 `file.php` 存在于指定位置，无论引用（父）文件位于何处，引入都将生效（权限问题除外）。第二个例子（如果你不熟悉该语法）是 Unix（和\
  \ Mac OS X）的绝对路径。绝对路径总是以类似 `C:/` 或 `/` 的内容开头。\n\n相对路径以引用（父）文件为起点。要向上移动一级文件夹，请使用两个连续的句点。要进入一个文件夹，请使用其名称后跟一个斜杠。因此，假设当前脚本位于\
  \ `www/ex1` 文件夹中，而你想引入 `www/ex2` 中的内容，代码应为：\n\n```\ninclude('../ex2/file.php');\n\
  ```\n\n只要文件之间保持当前的相对关系，即使站点移至另一台服务器，相对路径仍然准确。\n\n***\n\n`include()` 和 `require()`\
  \ 函数在正常工作时完全相同，但在失败时的行为不同。如果 `include()` 函数失败（因某些原因无法引入文件），会向 Web 浏览器打印一条警告，但脚本会继续运行。如果\
  \ `require()` 失败，则会打印错误并终止脚本。\n\n![Image](img/03_figure_01_a.jpg)\n\n一次失败的 `include()`\
  \ 调用会生成这两条错误消息（假设 PHP 配置为显示错误），但页面其余部分继续执行。\n\n![Image](img/03_figure_02_b.jpg)\n\
  \n`require()` 函数调用失败将打印错误并终止脚本执行。如果 PHP 未配置为显示错误，则脚本会在未先打印问题的情况下终止（即显示空白页面）。\n\n\
  这两个函数都有 `*_once()` 版本，可确保相关文件仅被引入一次，无论脚本（推测是无意中）尝试引入多少次。\n\n```\nrequire_once('filename.php');\n\
  \ninclude_once('filename.php');\n```\n\n因为 `require_once()` 和 `include_once()` 需要\
  \ PHP 模块做额外工作（即 PHP 必须先检查文件是否已被引入），除非可能发生重复引入（这在复杂站点上可能发生），否则最好不要使用这两个函数。\n\n在下一个示例中，引入文件将主要的\
  \ HTML 格式与 PHP 代码分离开来。然后，本章其余示例无需每次重写通用 HTML，即可拥有相同的外观——仿佛它们都是同一 Web 站点的一部分。这种技术创建了一种*模板系统*，是使大型应用程序保持一致且易于管理的简便方法。这些示例的重点在于\
  \ PHP 代码本身；你还应阅读“站点结构”侧边栏，以了解服务器上的组织方案。如果你对示例中使用的 CSS（层叠样式表）或 (X)HTML 有任何疑问，请参阅相关专门资源。\n\
  \n#### 引入多个文件\n\n**1.** 在文本编辑器或 WYSIWYG 编辑器中设计一个 HTML 页面（脚本 3.1 和图 3）。\n\n![Image](img/03_figure_03_c.jpg)\n\
  \nHTML 和 CSS 设计在 Web 浏览器中的显示效果（未使用任何 PHP）。\n\n要开始为 Web 站点创建模板，请像设计标准 HTML 页面一样设计布局，独立于任何\
  \ PHP 代码。对于本章的示例，我使用了 Christopher Robinson 创建的“Plain and Simple”模板的略微修改版（www.edg3.co.uk），并经他慷慨许可使用。\n\
  \n**2.** 标记特定页面内容的位置。\n\n几乎每个 Web 站点的每个页面都有几个通用元素——页眉、导航、广告、页脚等——以及一个或多个特定页面区域。在\
  \ HTML 页面（脚本 3.1）中，用 HTML 注释将布局中将因页面而异的部分括起来，以指示其状态。\n\n***\n\n**站点结构**\n\n当你开始在\
  \ Web 应用程序中使用多个文件时，整体站点结构变得更加重要。在规划站点布局时，有两个主要考量：\n\n• 维护的便利性\n\n• 安全性\n\n使用外部文件存放标准流程（即\
  \ PHP 代码）、CSS、JavaScript 和 HTML 设计，将极大地提高站点维护的便利性，因为常需编辑的代码集中在一个位置。我经常创建一个 `includes`\
  \ 或 `templates` 目录来存放这些文件，将它们与主脚本（即在 Web 浏览器中直接访问的脚本）分开。\n\n\n\n\n我建议对安全性无要求的文档（如\
  \ HTML 模板）使用 `.inc` 或 `.html` 扩展名，而对包含更敏感数据的文件（如数据库访问信息）使用 `.php`。你也可以同时使用 `.inc`\
  \ 和 `.html` 或 `.php`，以便明确表明文件是特定类型的包含文件：例如 `db.inc.php` 或 `header.inc.html`。\n\n\
