  \ ID 值。为了开始该过程，将一个标志变量赋值为 FALSE，假设不存在有效的用户 ID。\n\n**3.** 验证提交的电子邮件地址：\n\n```php\n\
  if (!empty($_POST['email'])) {\n```\n\n\n\n\n### 脚本 18.10：`forgot_password.php`\n\
