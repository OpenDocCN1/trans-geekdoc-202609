  \nexit();\n```\n\n此时，`UPDATE` 查询已运行。它要么成功，要么失败（由于系统错误）。在这两种情况下，都无需再次显示表单，因此包含页脚（以完成页面）并使用\
  \ `exit()` 函数终止脚本。在此之前，为了严谨起见，关闭数据库连接。\n\n**10.** 完成 `if ($num == 1)` 条件判断：\n\n\
  ```\n} else {\n\n  echo '<h1>Error!</h1>\n  <p class=\"error\">The email address\
