  \n#### 4. 检索选定的用户 ID\n\n```php\nif (mysqli_num_rows($r) == 1) {\n    list($uid)\
  \ = mysqli_fetch_array ($r, MYSQLI_NUM);\n} else { // No database match made.\n\
  \    echo '<p class=\"error\">The submitted email address does not match those on\
  \ file!</p>';\n}\n```\n\n如果查询返回一行，将获取该行并赋值给 `$uid`（*用户 ID* 的简写）。更新数据库中的新密码需要此值，它也将用作标志变量。\n\
  \n本书未正式讨论 `list()` 函数，但您可能已遇到过它。它是一个快捷函数，允许您将数组元素赋值给其他变量。由于 `mysqli_fetch_array()`\
  \ 总是返回一个数组，即使它只包含一个元素，使用 `list()` 可以省去编写以下代码：\n\n```php\n$row = mysqli_fetch_array($r,\
  \ MYSQLI_NUM);\n$uid = $row[0];\n```\n\n如果数据库中找不到与提交的电子邮件地址匹配的记录，将显示错误消息。\n\n![图片](img/18_figure_28_a.jpg)\n\
  \n*如果用户输入的电子邮件地址在数据库中未找到，将显示错误消息。*\n\n#### 5. 报告未提交电子邮件地址的情况\n\n```php\n} else {\
