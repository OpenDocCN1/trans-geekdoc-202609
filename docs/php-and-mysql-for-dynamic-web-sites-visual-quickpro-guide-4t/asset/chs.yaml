  \n***\n\n### 提示\n\n如果您使用命令 `TRUNCATE tablename` 删除表中的每一条记录，即使查询成功且每一行都被移除，`mysqli_affected_rows()`\
  \ 也将返回 0。这只是一个怪癖。\n\n***\n\n### 提示\n\n如果 `UPDATE` 查询运行但没有实际更改任何列的值（例如，密码被相同的密码替换），`mysqli_affected_rows()`\
