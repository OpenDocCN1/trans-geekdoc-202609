  60+\">Over 60</option>\n</select></label></p>\n```\n\n`select` 标签启动下拉菜单，然后每个 `option`\
  \ 标签将在选项列表中创建另一行 ![Image](img/circle-c.jpg)。\n\n![Image](img/02_figure_03_c.jpg)\n\
  \n![Image](img/circle-c.jpg) 下拉菜单提供三个选项，其中只能选择一个（在本例中）。\n\n**7.** 添加一个用于评论的文本域：\n\
  \n```html\n<p><label>Comments: <textarea name=\"comments\" rows=\"3\" cols=\"40\"\
  ></textarea></label></p>\n```\n\n文本域不同于文本输入框；它们呈现为一个方框 ![Image](img/circle-d.jpg)，而不是单行。它们允许输入更多信息，适用于接收用户评论。\n\
  \n![Image](img/02_figure_04_d.jpg)\n\n![Image](img/circle-d.jpg) textarea 表单元素类型允许输入大量文本。\n\
  \n**8.** 完成表单：\n\n```html\n</fieldset>\n<p align=\"center\"><input type=\"submit\"\
  \ name=\"submit\" value=\"Submit My Information\" /></p>\n</form>\n```\n\n第一个标签关闭第\
  \ 3 步中打开的 `fieldset`。然后创建一个提交按钮，并使用 `p` 标签将其居中。最后，关闭表单。\n\n**9.** 完成 HTML 页面：\n\n\
  ```html\n</body>\n</html>\n```\n\n**10.** 将文件保存为 `form.html`，将其放入 Web 目录，并在 Web\
  \ 浏览器中查看 ![Image](img/circle-e.jpg)。\n\n![Image](img/02_figure_05_e.jpg)\n\n![Image](img/circle-e.jpg)\
  \ 完整的表单，请求用户提供一些基本信息。\n\n---\n\n> **提示**\n>\n> 由于此页面仅包含 HTML，因此使用 `.html` 扩展名。它也可以使用\
  \ `.php` 扩展名而不会有任何问题（因为 PHP 标签之外的代码被视为 HTML 处理）。\n\n---\n\n> **提示**\n>\n> 你也可以在\
  \ HTML 表单标签中指定接受的编码：\n>\n> ```html\n> <form accept-charset=\"utf-8\">\n> ```\n>\n\
  > 默认情况下，网页将使用与页面本身相同的编码来处理任何提交的数据。\n\n---\n\n#### 处理 HTML 表单\n\n\n\n\n\n#### 使用\
  \ PHP 处理 HTML 表单\n\n既然 HTML 表单已经创建完毕，现在是时候编写一个基础的 PHP 脚本来处理它了。所谓“处理”表单，是指 PHP 页面将对接收到的数据（即用户在表单中输入的数据）执行某些操作。在本章中，脚本仅将数据原样打印回\
  \ Web 浏览器。在后续示例中，表单数据将被存储在 MySQL 数据库中、与先前存储的值进行比较、通过电子邮件发送，等等。\n\nPHP 的魅力所在——也是它如此易学易用的原因——在于它与\
  \ HTML 表单交互的效果极佳。PHP 脚本将接收到的信息存储在特殊变量中。例如，假设你有一个表单，其中包含如下定义的输入框：\n\n```html\n<input\
  \ type=\"text\" name=\"city\" />\n```\n\n用户在该输入框中输入的任何内容都可以通过名为 `$_REQUEST['city']`\
  \ 的 PHP 变量访问。拼写和大小写必须*完全匹配*，这一点至关重要！PHP 在变量名方面区分大小写，因此 `$_REQUEST['city']` 可行，但\
  \ `$_Request['city']` 和 `$_REQUEST['City']` 将没有任何值。\n\n下一个示例将是一个处理已创建的 HTML 表单（脚本\
  \ 2.1）的 PHP 脚本。该脚本会将表单数据赋值给新变量（作为简写形式使用，就像脚本 1.5 `predefined.php` 中那样）。然后脚本会打印接收到的值。\n\
  \n#### 处理 HTML 表单\n\n**1.** 在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `handle_form.php`，从 HTML\
  \ 部分开始编写（脚本 2.2）：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\n<head>\n\n  <meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\n  <title>Form\
  \ Feedback</title>\n\n</head>\n\n<body>\n```\n\n**2.** 添加 PHP 开启标签并创建表单数据变量的简写版本：\n\
  \n```php\n<?php # Script 2.2 - handle_form.php\n\n$name = $_REQUEST['name'];\n\n\
  $email = $_REQUEST['email'];\n\n$comments = $_REQUEST['comments'];\n```\n\n遵循前面概述的规则，输入到名为\
  \ *name* 的第一个表单输入框中的数据，将可通过变量 `$_REQUEST['name']` 访问（表 2.1）。输入到 email 表单输入框（其 `name`\
  \ 值为 *email*）中的数据，将可通过 `$_REQUEST['email']` 访问。comments 数据同理。再次强调，此处变量的拼写和大小写必须与\
  \ HTML 表单中对应的 `name` 值*完全匹配*。\n\n**脚本 2.2.** 该脚本接收并打印出 HTML 表单（脚本 2.1）中输入的信息。\n\n\
  ***\n\n```html\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD\n      XHTML 1.0 Transitional//EN\"\
  \n      \"http://www.w3.org/TR/xhtml1/DTD/\n      xhtml1-transitional.dtd\">\n2\
  \  <html xmlns=\"http://www.w3.org/1999/\n      xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n3  <head>\n4      <meta http-equiv=\"Content-Type\"\n         content=\"\
  text/html; charset=utf-8\" />\n5      <title>Form Feedback</title>\n6  </head>\n\
  7  <body>\n8  <?php # Script 2.2 - handle_form.php\n9\n10  // Create a shorthand\
  \ for the form data:\n11  $name = $_REQUEST['name'];\n12  $email = $_REQUEST['email'];\n\
  13  $comments = $_REQUEST['comments'];\n14  /* Not used:\n15  $_REQUEST['age']\n\
  16  $_REQUEST['gender']\n17  $_REQUEST['submit']\n18  */\n\n19  // Print the submitted\
  \ information:\n20  echo \"<p>Thank you, <b>$name</b>,\n      for the following\
  \ comments:<br />\n21  <tt>$comments</tt></p>\n22  <p>We will reply to you at\n\
  \      <i>$email</i>.</p>\\n\";\n23\n24  ?>\n25  </body>\n26  </html>\n```\n\n***\n\
  \n**表 2.1. 表单元素到 PHP 变量的对应关系**\n\n![Image](img/02tab01.jpg)\n\n此时，你不会用到 age、gender\
  \ 和 submit 这几个表单元素。\n\n**3.** 打印接收到的 name、email 和 comments 值：\n\n```php\necho \"\
  <p>Thank you, <b>$name</b>, for the following comments:<br />\n<tt>$comments</tt></p>\n\
  <p>We will reply to you at <i>$email</i>.</p>\\n\";\n```\n\n提交的值只是通过 `echo` 语句、双引号以及少量的\
  \ HTML 格式化打印出来。\n\n**4.** 完成页面：\n\n```php\n?>\n\n</body>\n\n</html>\n```\n\n**5.**\
  \ 将文件保存为 `handle_form.php`，并将其放置在与 `form.html` 相同的 Web 目录下。\n\n**6.** 在 Web 浏览器中通过\
  \ URL（`http://something`）加载 `form.html` 来测试这两个文档，然后填写 ![Image](img/circle-a.jpg)\
  \ 并提交表单 ![Image](img/circle-b.jpg)。\n\n![Image](img/02_figure_06_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ 要测试 `handle_form.php`，必须通过 URL 加载表单，然后填写并提交。\n\n![Image](img/02_figure_07_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 脚本应显示如下结果。\n\n因为 PHP 脚本必须通过 URL 运行（见第 1 章），所以表单也必须通过\
  \ URL 运行。否则，当你提交表单时，你将看到 PHP 代码 ![Image](img/circle-c.jpg) 而不是正确的结果 ![Image](img/graycircle-b.jpg)。\n\
  \n![Image](img/02_figure_08_c.jpg)\n\n![Image](img/circle-c.jpg) 如果提交表单后看到 PHP 代码，问题很可能是你没有通过\
  \ URL 访问表单。\n\n***\n\n**提示**\n\n`$_REQUEST` 是一种特殊的变量类型，称为*超全局变量*。它存储通过 GET 或 POST\
  \ 方法发送到 PHP 页面的所有数据，以及 Cookie 中可访问的数据。超全局变量将在本章后面讨论。\n\n***\n\n***\n\n**提示**\n\n\
  如果你在使用此脚本时遇到任何问题，请应用第 1 章建议的调试技巧。如果仍无法解决问题，请查看第 8 章“错误处理与调试”中列出的扩展调试技巧。如果依然无法解决，请求助于本书的支持论坛（www.LarryUllman.com/forums/）。\n\
  \n***\n\n***\n\n**提示**\n\n如果 PHP 脚本在本应打印变量值的位置显示空白，则意味着该变量没有值。最可能的两个原因是：你未在表单中输入值；或者你拼写错误或大小写错误地书写了变量名。\n\
  \n***\n\n***\n\n**提示**\n\n如果你看到任何 *Undefined variable: variablename*（未定义变量：变量名）错误，这是因为你引用的变量没有值，且\
  \ PHP 设置了最高级别的错误报告。上一条提示提供了变量为何没有值的建议原因。第 8 章将详细讨论错误报告。\n\n***\n\n***\n\n**提示**\n\
  \n要查看 PHP 如何处理不同的表单输入类型，请打印出 `$_REQUEST['age']` 和 `$_REQUEST['gender']` 的值 ![Image](img/circle-d.jpg)。\n\
  \n![Image](img/02_figure_09_d.jpg)\n\n![Image](img/circle-d.jpg) gender 和 age 的值对应表单\
  \ HTML 中定义的值。\n\n***\n\n***\n\n#### 魔术引号\n\nPHP 早期版本有一个称为*魔术引号*的功能，该功能现已被弃用，并最终将被完全移除。魔术引号——当启用时——会自动转义提交的表单数据中发现的单引号和双引号（实际上有三种魔术引号，但此处最重要的就是这一种）。例如，魔术引号会将字符串\
  \ *I’m going out* 转换为 *I\\'m going out*。\n\n在某些情况下，转义潜在的问题字符可能很有用，甚至是必要的。但如果你的 PHP\
  \ 安装启用了魔术引号，当 PHP 脚本打印表单数据时，你将看到这些反斜杠。你可以使用 `stripslashes()` 函数来撤销魔术引号的效果：\n\n\n\
  \n\n$var = stripslashes($var);\n\n此函数将移除 `$var` 中发现的任何反斜杠。其结果是将转义后的提交字符串还原为其原始的、非转义的值。\n\
  \n要在 `handle_form.php`（脚本 2.2）中使用此函数，你需要编写：\n\n$name = stripslashes($_REQUEST['name']);\n\
  \n如果你没有看到表单数据中添加了反斜杠，那么你就不需要担心 Magic Quotes（魔术引号）。\n\n---\n\n### 条件语句与运算符\n\nPHP\
  \ 用于创建条件语句的三个主要关键字是 `if`、`else` 和 `elseif`（也可以写成两个单词：`else if`）。\n\n每个条件语句都以 `if`\
  \ 子句开始：\n\n```\nif (condition) {\n    // Do something!\n}\n```\n\n`if` 也可以包含 `else`\
  \ 子句：\n\n```\nif (condition) {\n    // Do something!\n} else {\n    // Do something\
  \ else!\n}\n```\n\n`elseif` 子句允许你添加更多条件：\n\n```\nif (condition1) {\n    // Do something!\n\
  } elseif (condition2) {\n    // Do something else!\n} else {\n    // Do something\
  \ different!\n}\n```\n\n如果条件为真，则执行后面花括号（`{ }`）中的代码。如果为假，PHP 将继续向下执行。如果有第二个条件（在 `elseif`\
  \ 之后），则会检查该条件的真假。此过程将持续下去——你可以使用任意数量的 `elseif` 子句——直到 PHP 遇到 `else`（此时将自动执行），或者条件语句在没有\
  \ `else` 的情况下终止。因此，`else` 必须始终放在最后，并作为默认操作处理，除非满足特定标准——即条件。\n\n在 PHP 中，条件为真可能有多种原因。首先，以下情况为真条件：\n\
  \n- `$var`，如果 `$var` 的值不为 0、空字符串、`FALSE` 或 `NULL`\n- `isset($var)`，如果 `$var` 有除\
  \ `NULL` 以外的任何值，包括 0、`FALSE` 或空字符串\n- `TRUE`、`true`、`True` 等。\n\n在第二个示例中，引入了一个新函数\
  \ `isset()`。此函数检查变量是否已“设置”，即其值不为 `NULL`（提醒一下，`NULL` 是 PHP 中的一种特殊类型，表示未设置值）。你还可以结合括号使用比较运算符和逻辑运算符（表\
  \ 2.2）来构建更复杂的表达式。\n\n**表 2.2. 比较运算符和逻辑运算符**\n\n![Image](img/02tab02.jpg)\n\n####\
  \ 使用条件语句\n\n**1.** 在文本编辑器或 IDE 中打开 `handle_form.php`（参考脚本 2.2），如果尚未打开的话。\n\n**2.**\
  \ 在 `echo` 语句之前，添加一个条件语句来创建 `$gender` 变量（脚本 2.3）：\n\n```\nif (isset($_REQUEST['gender']))\
  \ {\n    $gender = $_REQUEST['gender'];\n} else {\n    $gender = NULL;\n}\n```\n\
  \n这是一种简单有效的验证表单输入的方法（特别是单选按钮、复选框或下拉菜单）。如果用户选中了任一性别单选按钮，则 `$_REQUEST['gender']` 将拥有值，这意味着条件\
  \ `isset($_REQUEST['gender'])` 为真。在这种情况下，该变量的简写版本——`$gender`——将被赋予 `$_REQUEST['gender']`\
  \ 的值，重复了对 `$name`、`$email` 和 `$comments` 使用的技巧。如果用户未点击任何单选按钮，则此条件不为真，`$gender` 将被赋予\
  \ `NULL` 值，表示它没有值。请注意 `NULL` 不在引号中。\n\n**脚本 2.3.** 在此重制版 `handle_form.php` 中，使用了两个条件语句来验证性别单选按钮。\n\
  \n---\n\n```\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\n        XHTML 1.0 Transitional//EN\"\
  \n            \"http://www.w3.org/TR/xhtml1/DTD/\n            xhtml1-transitional.dtd\"\
  >\n2   <html xmlns=\"http://www.w3.org/1999/\n    xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n3   <head>\n4       <meta http-equiv=\"Content-Type\"\n            content=\"\
  text/html; charset=utf-8\" />\n5       <title>Form Feedback</title>\n6   </head>\n\
  7   <body>\n8   <?php # Script 2.3 - handle_form.php #2\n\n9   // Create a shorthand\
  \ for the form data:\n10  $name = $_REQUEST['name'];\n11  $email = $_REQUEST['email'];\n\
  12  $comments = $_REQUEST['comments'];\n\n13  // Create the $gender variable:\n\
  14  if (isset($_REQUEST['gender'])) {\n15      $gender = $_REQUEST['gender'];\n\
  16  } else {\n17      $gender = NULL;\n18  }\n\n19  // Print the submitted information:\n\
  20  echo \"<p>Thank you, <b>$name</b>,\n            for the following comments:<br\
  \ />\n        <tt>$comments</tt></p>\n        <p>We will reply to you at\n     \
  \       <i>$email</i>.</p>\\n\";\n\n21  // Print a message based upon the\n    \
  \    gender value:\n22  if ($gender == 'M') {\n23      echo '<p><b>Good day, Sir!</b>\n\
  \            </p>';\n24  } elseif ($gender == 'F') {\n25      echo '<p><b>Good day,\
  \ Madam!\n            </b></p>';\n26  } else { // No gender selected.\n27      echo\
  \ '<p><b>You forgot to enter\n            your gender!</b></p>';\n28  }\n\n29  ?>\n\
  30  </body>\n31  </html>\n```\n\n---\n\n**3.** 在 `echo` 语句之后，添加另一个条件语句，根据 `$gender`\
  \ 的值打印消息：\n\n```\nif ($gender == 'M') {\n    echo '<p><b>Good day, Sir!</b></p>';\n\
  } elseif ($gender == 'F') {\n    echo '<p><b>Good day, Madam!</b></p>';\n} else\
  \ {\n    echo '<p><b>You forgot to enter your gender!</b></p>';\n}\n```\n\n此 `if-elseif-else`\
  \ 条件语句检查 `$gender` 变量的值，并针对每种可能性打印不同的消息。务必牢记双等号（`==`）表示“等于”，而单等号（`=`）表示赋值。这种区别很重要，因为条件\
  \ `$gender == 'M'` 可能为真也可能为假，但 `$gender = 'M'` 永远为真。\n\n此外，此处使用的值——*M* 和 *F*——必须与\
  \ HTML 表单中的值（每个单选按钮的值）完全相同。字符串的相等比较区分大小写，因此 *m* 不等于 *M*。\n\n**4.** 保存文件，将其放入 Web\
