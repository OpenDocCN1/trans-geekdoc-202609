  \n第二个分支适用于页面 URL 中未接收到语言 ID 且会话中尚未建立语言 ID 的情况。在这种情况下，将选择一种默认语言。此值在数据库的 `languages`\
  \ 表中对应英语。你可以将其更改为与你想要使用的默认语言匹配的任何 ID。\n\n## 5. 获取该语言的关键词\n\n```php\n$q = \"SELECT\
