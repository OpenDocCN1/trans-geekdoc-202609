  \ PHP 文档，命名为 `index.php`（**脚本 3.4**）：\n\n```\n<?php # Script 3.4 - index.php\n```\n\
  \n由于该脚本将使用包含文件提供大部分 HTML，因此它可以以 PHP 标签开始和结束。\n\n#### 9. 设置 `$page_title` 变量并包含 HTML\
  \ 头部：\n\n\n\n$page\\_title = 'Welcome to this Site!';\n\ninclude ('includes/header.html');\n\
  \n`$page_title` 变量将存储显示在浏览器窗口顶部的值（因此，这也是用户将页面加入书签时的默认值）。该变量在 `header.html` 中输出（参见\
  \ 脚本 3.2）。通过在包含头部文件之前定义该变量，头部文件将能够访问该变量。请记住，这行 `include()` 代码的效果是将被包含文件的内容插入到此页面的此位置。\n\
  \n`include()` 函数调用使用 *相对* 路径指向 `header.html`（参见侧边栏“绝对路径与相对路径”）。该语法表明：在此文件所在的同一文件夹中有一个名为\
