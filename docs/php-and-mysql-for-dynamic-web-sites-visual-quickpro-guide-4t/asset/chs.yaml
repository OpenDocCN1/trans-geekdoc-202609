  \ = '<p><b>Good day, Madam!</b></p>';\n\n} else {\n\n  $gender = NULL;\n\n  echo\
  \ '<p class=\"error\">Gender should be either \"M\" or \"F\"!</p>';\n\n}\n```\n\n\
  在 gender 的 `if` 子句中嵌套了一个 `if-elseif-else` 条件语句，用于将变量的值与可接受的值进行比对。这是两步性别验证的第二部分。\n\
  \n条件本身与上一个脚本中的相同。如果 gender 最终既不等于 `M` 也不等于 `F`，则表明出现了问题，并会打印一条错误消息。在这种情况下，`$gender`\
  \ 变量也会被设置为 `NULL`，因为它拥有不可接受的值。\n\n如果 `$gender` 确实拥有有效值，则将特定性别的消息赋值给一个新变量，以便稍后在脚本中打印。\n\
  \n### 7. 完成主 gender `if-else` 条件语句：\n\n```php\n} else {\n\n  $gender = NULL;\n\n\
  \  echo '<p class=\"error\">You forgot to select your gender!</p>';\n\n}\n```\n\n\
  如果 `$_REQUEST['gender']` 未设置，则适用此 `else` 子句。完整的嵌套条件语句（参见 Script 2.4 的第 41-57 行）成功检查了每一种可能性：\n\
  \n* `$_REQUEST['gender']` 未设置\n* `$_REQUEST['gender']` 的值为 `M`\n* `$_REQUEST['gender']`\
  \ 的值为 `F`\n* `$_REQUEST['gender']` 拥有其他值\n\n您可能会想知道最后一种情况如何可能发生，因为值是在 HTML 表单中设置的。如果恶意用户创建他们自己的表单并提交给您的\
  \ `handle_form.php` 脚本（这非常容易做到），他们可以赋予 `$_REQUEST['gender']` 任何他们想要的值。\n\n### 8.\
  \ 打印指示验证结果的消息：\n\n```php\nif ($name && $email && $gender && $comments) {\n\n  echo\
  \ \"<p>Thank you, <b>$name</b>, for the following comments:<br />\n  <tt>$comments</tt></p>\n\
  \  <p>We will reply to you at <i>$email</i>.</p>\\n\";\n  echo $greeting;\n\n} else\
