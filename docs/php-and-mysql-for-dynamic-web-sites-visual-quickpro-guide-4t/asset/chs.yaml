  \n> **Tip**\n>\n> **`ob_flush()`** 将当前缓冲区内容发送给浏览器并清空，允许启动新缓冲区，有助于维持适度的缓冲区大小。相反，**`ob_end_flush()`**\
  \ 在发送缓冲区后关闭输出缓冲。\n\n---\n\n> **Tip**\n>\n> **`ob_clean()`** 删除当前缓冲区内容但不停止缓冲进程。\n\
