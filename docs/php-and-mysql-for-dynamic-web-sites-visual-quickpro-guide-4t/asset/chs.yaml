  \ array('min_range' => 1))\n    ) {\n    $_SESSION['lid'] = $_GET['lid'];\n} elseif\
  \ (!isset($_SESSION['lid'])) {\n    $_SESSION['lid'] = 1; // 默认值。\n}\n\n// 获取该语言的词汇：\n\
  $q = \"SELECT * FROM words WHERE lang_id\n    = {$_SESSION['lid']}\";\n$r = mysqli_query($dbc,\
