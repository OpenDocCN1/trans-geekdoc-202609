  \n---\n\n> **提示**\n>\n> 虽然 PHP 没有严格的格式规则，但标准流程和良好的编程习惯要求明确标识一块代码何时属于条件语句的子集。缩进代码块是常规做法。\n\
  \n---\n\n> **提示**\n>\n> 你可以——且经常会——嵌套条件语句（将一个条件语句放在另一个内部）。\n\n---\n\n> **提示**\n\
  >\n> 本脚本中的第一个条件语句（`isset()`）是如何使用默认值的完美示例。假设（即 `else` 部分）是 `$gender` 拥有 `NULL` 值，除非满足一个条件：`$_REQUEST['gender']`\
  \ 已设置。\n\n---\n\n> **提示**\n>\n> 如果你只执行一条语句，则用于指示条件语句开始和结束的花括号不是必需的。不过，我建议你出于清晰度考虑，几乎总是使用它们。\n\
  \n---\n\n> **提示**\n>\n> *and* 和 *or* 都有两个代表运算符，它们之间存在细微的技术差别。没有特别的原因，我倾向于使用 `&&`\
  \ 和 `||` 而不是 `AND` 和 `OR`。\n\n---\n\n\n\n### XOR 运算符\n\nXOR 称为*异或*运算符。条件表达式 `$x\
  \ XOR $y` 在 `$x` 为真或 `$y` 为真时为真，但不能两者同时为真。\n\n---\n\n### Switch\n\nPHP 还有一种条件结构，称为\
  \ `switch`，最适合用来替代冗长的 `if-elseif-else` 条件结构。`switch` 的语法如下：\n\n```\nswitch ($variable)\
  \ {\n    case 'value1':\n        // Do this.\n        break;\n    case 'value2':\n\
  \        // Do this instead.\n        break;\n    default:\n        // Do this then.\n\
  \        break;\n}\n```\n\n`switch` 条件结构将 `$variable` 的值与不同的 case 进行比较。当找到匹配项时，将执行后续代码，直到遇到\
  \ `break`。如果未找到匹配项，则执行 `default`（假设它存在，因为它是可选的）。`switch` 条件结构在用法上受到限制，因为它只能检查变量的值是否等于特定的\
  \ case；无法轻松检查更复杂的条件。\n\n---\n\n### 验证表单数据\n\n与处理 HTML 表单相关的一个关键概念是验证表单数据。就错误管理和安全性而言，你绝对永远不应该信任\
  \ HTML 表单提交的数据。无论错误的数据是蓄意恶意的，还是无意中不合适的，作为 Web 架构师，你都有责任根据预期对其进行测试。\n\n验证表单数据需要使用条件结构以及任意数量的函数、运算符和表达式。一个标准的函数是\
  \ `isset()`，它用于测试变量是否已设置值（包括 0、`FALSE` 或空字符串，但不包括 `NULL`）。你在前面的脚本中已经看到了它的示例。\n\n\
  `isset()` 函数的一个问题是空字符串测试结果为真，这意味着 `isset()` 不是验证 HTML 表单中文本输入框和文本域的有效方法。要检查用户是否在文本元素中输入了内容，可以使用\
  \ `empty()` 函数。它检查变量是否具有*空*值：空字符串、0、`NULL` 或 `FALSE`。\n\n表单验证的首要目标是查看表单元素中是否*输入或选择了*某些内容。第二个目标是确保提交的数据类型正确（数字、字符串等）、格式正确（如电子邮件地址），或为特定的可接受值（如\
  \ `$gender` 等于 *M* 或 *F*）。由于处理表单是 PHP 的主要用途之一，验证表单数据是一个将在后续章节中反复强调的重点。但首先，让我们创建一个新的\
  \ `handle_form.php`，以确保在引用变量之前它们已有值（此版本变化足够大，以至于单纯更新脚本 2.3 已说不通）。\n\n#### 验证你的表单\n\
  \n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 脚本，命名为 `handle_form.php`，从初始 HTML 开始（**脚本 2.4)\
  \ {\n18      $name = $_REQUEST['name'];\n19  } else {\n20      $name = NULL;\n21\
  \      echo '<p class=\"error\">You forgot to enter your name!</p>';\n22  }\n23\n\
  24  // Validate the email:\n25  if (!empty($_REQUEST['email'])) {\n26      $email\
