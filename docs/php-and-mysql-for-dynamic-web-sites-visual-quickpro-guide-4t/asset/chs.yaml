  \ 知识，请看第三本。\n\n也就是说，如果您想学习今天使用 PHP 和 MySQL 开发动态网站所需的一切知识，那么本书就是为您准备的！它参考了两项技术的最新版本，使用了其他书籍中未曾讨论的技巧，并包含独家示例。\n\
