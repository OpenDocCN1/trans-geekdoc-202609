  \ 文件的引入（脚本 9.3 第 48 行）移至主条件判断之后（脚本 9.5）。\n\n因为 `mysqli_real_escape_string()` 函数需要数据库连接，所以\
  \ `mysqli_connect.php` 脚本必须在脚本中更早地被引入。\n\n**脚本 9.5.** `register.php` 脚本现在使用 `mysqli_real_escape_string()`\
  \ 函数使提交的数据在查询中使用时变得安全。\n\n---\n\n```php\n<?php # Script 9.5 - register.php #2\n\n\
