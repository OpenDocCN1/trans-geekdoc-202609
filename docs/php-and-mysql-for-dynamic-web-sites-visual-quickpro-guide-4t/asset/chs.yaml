  \n***\n\n## 1. PHP 简介\n\n本章内容\n\n基本语法 2\n\n向 Web 浏览器发送数据 6\n\n编写注释 10\n\n什么是变量？\
  \ 14\n\n字符串简介 18\n\n字符串拼接 21\n\n数字简介 23\n\n常量简介 26\n\n单引号与双引号 29\n\n基本调试步骤 33\n\n\
  复习与深入 34\n\n虽然本书侧重于 MySQL 和 PHP 的结合使用，但您绝大部分的基础工作将仅使用 PHP 完成。在本章和下一章中，您将学习其基础知识，从语法到变量、运算符和语言结构（条件判断、循环等）。在掌握这些基础知识的同时，您也将开始编写可用的代码，稍后将在本书中将其集成到更大的应用程序中。\n\
  \n本介绍性章节将带您快速浏览 PHP 语言的大部分基础知识。您将学习 PHP 编码语法、如何向 Web 浏览器发送数据，以及如何使用两种变量（字符串和数字）加上常量。有些示例可能看似微不足道，但它们将演示您必须掌握的思想，以便日后编写更高级的脚本。本章最后提供了一些快速调试技巧……您懂的……以防万一！\n\
  \n### 基本语法\n\n正如本书导言所述，PHP 是一种 *HTML-embedded*（HTML 嵌入式）脚本语言，这意味着您可以在同一个文件中混合编写\
  \ PHP 和 HTML 代码。因此，要开始 PHP 编程，请从一个简单的网页入手。**脚本 1.1** 是一个无花哨、无内容的 XHTML Transitional\
  \ 文档示例，将作为本书中大多数网页的基础（本书不正式讨论 [X]HTML；更多信息请参阅专门资源）。请注意，该模板使用 UTF-8 编码，此主题将在侧边栏讨论。\n\
  \n要向页面添加 PHP 代码，请将其放在 PHP 标签内：\n\n```\n<?php  \n\n?>\n```\n\n**脚本 1.1.** 一个基本的 XHTML\
  \ 1.0 Transitional 网页。\n\n***\n\n```\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \  \n      1.0 Transitional//EN\" \"http://www.w3.org/  \n      TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >  \n2   <html xmlns=\"http://www.w3.org/1999/  \n      xhtml\" xml:lang=\"en\"\
  \ lang=\"en\">  \n3   <head>  \n4       <meta http-equiv=\"Content-Type\"  \n  \
  \        content=\"text/html; charset=utf-8\" />  \n5       <title>Page Title</title>\
  \  \n6   </head>  \n7   <body>  \n8       <!-- Script 1.1 - template.html -->  \n\
  9   </body>  \n10  </html>\n```\n\n***\n\n### 理解编码\n\n\n\n编码是一个庞大的主题，但你最需要理解的是：文件中使用的编码决定了可以表示哪些字符（因此，也决定了可以使用哪些语言）。要选择一种编码，你必须首先确认你的文本编辑器或集成开发环境（IDE）——无论你用什么应用程序来创建\
  \ HTML 和 PHP 脚本——能否使用该编码保存文档。有些应用程序允许你在首选项或选项区域设置编码；而另一些则在你保存文件时设置编码。\n\n要向 Web\
  \ 浏览器指明编码，有一个对应的 `meta` 标签：\n\n```\n<meta http-equiv=\"content-type\" content=\"\
  text/html; charset=utf-8\" />\n```\n\n`charset=utf-8` 部分表明正在使用 UTF-8 编码，即 8 位 Unicode\
  \ 转换格式的简称。Unicode 是一种可靠地表示每种字母表中每个符号的方式。撰写本书时，Unicode 的第 6 版——即当前版本——支持超过 99,000\
  \ 个字符！\n\n如果你想创建一个多语言网页，UTF-8 是首选，本书的示例也将使用它。当然，你也可以不这么做。但无论你使用什么编码，都要确保 XHTML 页面指明的编码与你的文本编辑器或\
  \ IDE 中实际设置的编码相匹配。如果不匹配，当你在 Web 浏览器中查看页面时，很可能会看到乱码。\n\n---\n\n### 脚本 1.2\n\n这个第一个\
  \ PHP 脚本不执行任何操作，但演示了 PHP 脚本的编写方式。在深入复杂的 PHP 代码之前，它也将作为一个测试脚本使用。\n\n---\n\n```\n\
  1  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n      1.0 Transitional//EN\" \"http://www.w3.org/\n\
  \      TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2  <html xmlns=\"http://www.w3.org/1999/\n\
  \      xhtml\" xml:lang=\"en\" lang=\"en\">\n3  <head>\n4      <meta http-equiv=\"\
  Content-Type\"\n          content=\"text/html; charset=utf-8\" />\n5      <title>Basic\
  \ PHP Page</title>\n6  </head>\n7  <body>\n8      <!-- Script 1.2 - first.php -->\n\
  9      <p>This is standard HTML.</p>\n10 <?php\n11 ?>\n12  </body>\n13  </html>\n\
  ```\n\n---\n\n### HTML5\n\n撰写本书时，HTML 的下一个主要版本——HTML5——正在积极开发和讨论中，但尚未准备好用于生产环境，这就是为什么我选择不在书中使用它。事实上，当我开始写这本书的第五版时，HTML5\
  \ 可能仍未发布，而浏览器对该语言的广泛采用将需要更长的时间。尽管如此，作为一个令人振奋的未来发展方向，本书将偶尔提及你可以期待随时间推移而引入和支持的特性。\n\
  \n---\n\n任何写在这些标签内的内容都将被 Web 服务器视为 PHP 处理，意味着 PHP 解释器会解析该代码。PHP 标签之外的任何文本都会作为常规\
  \ HTML 立即发送给 Web 浏览器。（因为 PHP 最常用于创建在 Web 浏览器中显示的内容，所以 PHP 标签通常放在页面主体的某个位置。）\n\n\
  除了将 PHP 代码放在 PHP 标签内，你的 PHP 文件还必须具有正确的扩展名。扩展名告诉服务器以特殊方式处理该脚本，即将其作为 PHP 页面处理。大多数\
  \ Web 服务器对标准 HTML 页面使用 `.html`，对 PHP 文件使用 `.php`。\n\n在进入步骤之前，请明白你必须已经拥有一个可用的 PHP\
  \ 安装环境！这可能是在托管网站上，也可能是在你自己的电脑上，遵循附录 A“安装”中的说明操作后即可，该附录可从 peachpit.com 免费下载。\n\n\
  #### 创建基本 PHP 脚本\n\n**1.** 在文本编辑器或 IDE 中创建一个新文档，命名为 `first.php`（**脚本 1.2**）。\n\n\
  通常你使用什么应用程序并不重要，无论是 Adobe Dreamweaver（一个功能强大的 IDE）、TextMate（一款优秀且流行的 Mac 纯文本编辑器），还是\
  \ vi（一款缺乏图形界面的 Unix 纯文本编辑器）。尽管如此，某些文本编辑器和 IDE 会让 HTML 和 PHP 的编写与调试变得更容易（反之，Windows\
  \ 上的记事本做某些事会让编码变得更难：别用记事本！）。如果你还没有钟爱的应用程序，请搜索网络或使用本书对应的论坛（**[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)**）来寻找一个。\n\
  \n**2.** 创建一个基本的 HTML 文档：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0\
  \ Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Basic PHP Page</title>\n</head>\n<body>\n  <!-- Script 1.2 - first.php\
  \ -->\n<p>This is standard HTML.</p>\n</body>\n</html>\n```\n\n虽然本书全程使用这种语法，但你可以更改\
  \ HTML 以匹配你打算使用的任何标准（例如 HTML 4.0 Strict）。同样，如果你对这些 HTML 代码不熟悉，请参阅专门的 (X)HTML 资源。\n\
  \n**3.** 在结束 `body` 标签之前，插入 PHP 标签：\n\n```\n<?php\n?>\n```\n\n这些是正式的 PHP 标签，也称为\
  \ XML 风格标签。虽然 PHP 支持其他类型的标签，但我建议你使用正式类型，本书也将始终如此。\n\n**4.** 将文件保存为 `first.php`。\n\
  \n请记住，如果你不使用适当的 PHP 扩展名保存文件，脚本将无法正常执行。（不使用记事本的原因之一就是它会偷偷给 PHP 文件加上 `.txt` 扩展名，从而导致许多麻烦。）\n\
  \n**5.** 将文件放置在 Web 服务器的适当目录中。\n\n如果你在自己的电脑上运行 PHP（推测是遵循了附录 A 中的安装说明），你只需将文件移动、复制或保存到电脑上的特定文件夹。如果你不知道正确的目录是什么，请查阅附录\
  \ A 或你特定 Web 服务器的文档以确定正确的目录。\n\n如果你在托管服务器上运行 PHP（即在远程计算机上），你需要使用文件传输协议（FTP）应用程序将文件上传到适当的目录。你的托管公司会提供访问权限和其他必要信息。\n\
  \n**6.** 在 Web 浏览器中运行 `first.php`。\n\n![Image](img/01_figure_01_a.jpg)\n\n虽然它看起来像任何其他（简单的）HTML\
  \ 页面，但这实际上是一个 PHP 脚本，也是本书其余示例的基础。\n\n因为 PHP 脚本需要由服务器解析，所以你绝对必须通过 URL 访问它们（即浏览器地址栏必须以\
  \ `http://` 开头）。你不能像在其他应用程序中打开文件那样直接在 Web 浏览器中打开它们（那种情况下地址会以 `file://` 或 `C:\\`\
  \ 或类似路径开头）。\n\n如果你在自己的电脑上运行 PHP，你需要使用类似 `http://localhost/first.php`、`http://127.0.0.1/first.php`\
  \ 或 `http://localhost/~<user>/first.php`（在 Mac OS X 上，将 `<user>` 替换为你的实际用户名）这样的\
  \ URL。如果你使用 Web 主机，你需要使用 `http://your-domain-name/first.php`（例如 **[`www.example.com/first.php`](http://www.example.com/first.php)**）。\n\
  \n**7.** 如果你看不到类似图中所示的结果，开始调试！\n\n学习任何编程语言的一部分就是掌握调试。这是一个有时痛苦但绝对必要的过程。对于这个第一个例子，如果你看不到一个简单但完全有效的网页，请遵循以下步骤：\n\
  \n**1.** 确认你拥有一个可用的 PHP 安装环境（测试说明见附录 A）。\n\n\n\n\n## 2. 确保你是通过 URL 运行脚本\n\nWeb 浏览器中的地址必须以\
  \ `http://` 开头。如果它以 `file://` 开头，那就是个问题。\n\n![Image](img/01_figure_02_b.jpg)\n\n\
  只有通过 `http://` 运行时，PHP 代码才会被执行（就这个特定脚本而言，无论哪种方式都不受影响）。\n\n## 3. 如果你遇到“文件未找到”（或类似）错误\n\
  \n你很可能把文件放错了目录，或者文件名拼写错误（无论是在保存时还是在 Web 浏览器中输入时）。\n\n如果你已经完成了所有这些步骤但仍然有问题，请求助于本书对应的论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）。\n\
  \n***\n\n### 提示\n\n要查找有关 HTML 和 XHTML 的更多信息，请参阅 Elizabeth Castro 的优秀著作 *HTML, XHTML,\
  \ and CSS, Sixth Edition: Visual QuickStart Guide*（Peachpit Press, 2006）或在网络上搜索。\n\
  \n***\n\n### 提示\n\n你可以在单个 HTML 文档中嵌入多个 PHP 代码段（即，你可以在两种语言之间来回切换）。你将在全书中看到这方面的示例。\n\
  \n***\n\n### 提示\n\n在 UTF-8 之前，ISO-8859-1 是较常用的编码之一。它代表大多数西欧语言。它仍然是许多 Web 浏览器和其他应用程序的默认编码。\n\
  \n***\n\n### 提示\n\n你可以通过在外部 CSS 文件的第一行添加 `@charset \"utf-8\"` 来声明其编码。如果你不使用 UTF-8，请相应地更改该行。\n\
  \n***\n\n#### 向 Web 浏览器发送数据\n\n要使用 PHP 创建动态网站，你必须知道如何向 Web 浏览器发送数据。PHP 有许多内置函数可实现此目的，最常用的是\
  \ `echo` 和 `print`。我个人倾向于使用 `echo`：\n\n```\necho 'Hello, world!';\n\necho \"What's\
  \ new?\";\n```\n\n如果你愿意，也可以使用 `print`（这个名称更明显地表明了它的作用）：\n\n```\nprint 'Hello, world!';\n\
  \nprint \"What's new?\";\n```\n\n正如这些示例所示，你可以使用单引号或双引号（但这两种引号有区别，到本章结束时会清楚地说明）。函数名后的第一个引号表示要打印的消息的开始。下一个匹配的引号（即与开始引号同类型的下一个引号）表示要打印的消息的结束。\n\
  \n除了学习如何向 Web 浏览器发送数据，你还应该注意到，在 PHP 中，所有语句——用外行话来说就是一行执行的代码——都必须以分号结尾。此外，PHP 在函数名方面是*不区分大小写*的，所以\
  \ `ECHO`、`echo`、`eCHo` 等都能工作。当然，全小写版本最容易输入。\n\n***\n\n#### 需要转义\n\n正如你可能发现的，向 Web\
  \ 发送数据时的一个麻烦在于打印单引号和双引号。以下任一情况都会导致错误：\n\n```\necho \"She said, \"How are you?\"\"\
  ;\n\necho 'I'm just ducky.';\n```\n\n解决此问题有两种方法。首先，打印双引号时使用单引号，反之亦然：\n\n```\necho\
  \ 'She said, \"How are you?\"';\n\necho \"I'm just ducky.\";\n```\n\n或者，你可以通过在有问题的字符前加上反斜杠来*转义*它：\n\
  \n```\necho \"She said, \\\"How are you?\\\"\";\n\necho 'I\\'m just ducky.';\n```\n\
  \n被转义的引号将像其他字符一样仅被打印出来。理解如何使用反斜杠转义字符是一个重要概念，本章末尾将更深入地介绍。\n\n***\n\n#### 脚本 1.3.\
  \ 使用 `print` 或 `echo`，PHP 可以向 Web 浏览器发送数据。\n\n***\n\n```\n1   <!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML\n        1.0 Transitional//EN\" \"http://www.w3.org/\n   \
  \     TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \        xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n            content=\"text/html; charset=utf-8\" />\n5       <title>Using\
  \ Echo</title>\n6   </head>\n7   <body>\n8       <!-- Script 1.3 - second.php -->\n\
  9       <p>This is standard HTML.</p>\n10  <?php\n11  echo 'This was generated using\
  \ PHP!';\n12  ?>\n13  </body>\n14  </html>\n```\n\n***\n\n#### 向 Web 浏览器发送数据\n\n\
  **1.** 在文本编辑器或 IDE 中打开 `first.php`（参考脚本 1.2）。\n\n**2.** 在 PHP 标签之间（第 10 行和第 11 行），添加一条简单的消息（脚本\
  \ 1.3）：\n\n```\necho 'This was generated using PHP!';\n```\n\n你输入什么消息、使用哪个函数（`echo`\
  \ 或 `print`），甚至使用哪种引号，其实都无关紧要——只是如果你的消息中包含单引号或双引号，请务必小心（请参阅侧边栏“需要转义”）。\n\n**3.**\
  \ 如果愿意，更改页面标题以更好地描述此脚本（第 5 行）：\n\n```\n<title>Using Echo</title>\n```\n\n此更改仅影响浏览器窗口的标题栏。\n\
  \n**4.** 将文件保存为 `second.php`，将其放入你的 Web 目录，并在 Web 浏览器中测试它。\n\n![Image](img/01_figure_03_a.jpg)\n\
  \n结果仍然不算漂亮，但此页面是由 PHP 部分动态生成的。\n\n请记住，所有 PHP 脚本都必须通过 URL（`http://` `某物`）运行！\n\n\
  **5.** 如有必要，调试脚本。\n\n如果你看到解析错误而不是你的消息，请检查是否已同时打开和关闭引号，并转义了任何有问题的字符（请参阅侧边栏）。此外，确保每个语句都以分号结尾。\n\
  \n![Image](img/01_figure_04_b.jpg)\n\n这可能是你作为 PHP 程序员将看到的许多解析错误中的第一个（这个是由省略结束引号引起的）。\n\
  \n如果你看到一个完全空白的页面，这可能有两个原因之一：\n\n*   HTML 有问题。通过查看页面源代码并寻找那里的 HTML 问题来测试这一点。\n\n\
  \    ![Image](img/01_figure_05_c.jpg)\n\n    导致 PHP 空白页面的一个可能原因是简单的 HTML 错误，比如这里的结束\
  \ `title` 标签（它缺少了斜杠）。\n\n*   发生了错误，但你的 PHP 配置中关闭了 `display_errors`，因此什么也没显示。在这种情况下，请参阅附录\
  \ A 中关于如何配置 PHP 以便重新开启 `display_errors` 的部分。\n\n***\n\n### 提示\n\n从技术上讲，`echo` 和\
  \ `print` 是*语言结构*，而非函数。话虽如此，不要因此感到困惑，为了方便我继续称它们为“函数”。此外，正如你稍后在本书中将看到的，我提及函数时会包含括号——例如\
  \ `number_format()`，而不仅仅是 `number_format`——以帮助将它们与变量和 PHP 的其他部分区分开来。这只是我自己的一个小习惯。\n\
  \n***\n\n### 提示\n\n你可以而且经常会使用 `echo` 和 `print` 向 Web 浏览器发送 HTML 代码，如下所示：\n\n```\n\
  echo '<p>Hello, <b>world</b>!</p>';\n```\n\n![Image](img/01_figure_06_d.jpg)\n\n\
  PHP 可以向 Web 浏览器发送 HTML 代码（如此处的格式）以及简单文本。\n\n***\n\n### 提示\n\n`echo` 和 `print` 都可以跨多行使用：\n\
  \n```\necho 'This sentence is\nprinted over two lines.';\n```\n\n***\n\n### 提示\n\
  \n\n\n\n\n### 理解空白字符\n\n使用 PHP 时，你会将数据（如 HTML 标签和文本）发送给 Web 浏览器，浏览器随即会将这些数据渲染为最终用户所看到的\
  \ Web 页面。因此，你用 PHP 所做的工作通常是在创建 Web 页面的 *HTML 源代码*。牢记这一点，有三个值得注意的 *空白字符*（额外的空格、制表符和空行）区域：你的\
  \ PHP 脚本中、你的 HTML 源代码中，以及渲染后的 Web 页面中。\n\nPHP 通常对空白字符不敏感，这意味着你可以随意安排代码的间距，以使脚本更具可读性。HTML\
  \ 通常也不敏感。具体来说，HTML 中唯一影响渲染页面的空白字符是单个空格（多个空格仍会被渲染为一个）。如果你的 HTML 源代码中的文本分布在多行上，并不意味着它在渲染后的页面中会显示为多行（![Image](img/graycircle-e.jpg)\
  \ 和 ![Image](img/graycircle-f.jpg)）。\n\n要改变渲染后 Web 页面中的间距，请使用 HTML 标签 `<br />`（换行，旧版\
  \ HTML 标准中为 `<br>`）和 `<p></p>`（段落）。要改变用 PHP 创建的 HTML *源代码*的间距，你可以：\n\n*   在多行中使用\
  \ `echo` 或 `print`。\n*   在双引号内打印换行符（`\\n`），这等同于按下 Enter 或 Return 键。\n\n---\n\n###\
  \ 编写注释\n\n创建可执行的 PHP 代码只是编程过程的一部分（诚然，这是最重要的部分）。任何编程工作中另一个次要但仍至关重要的方面是为代码编写文档。事实上，当有人问我什么特质能区分初级程序员和经验丰富的程序员时，我坚定的回答是：对注释的良善且彻底的使用。\n\
  \n在 HTML 中，你可以使用特殊标签添加注释：\n\n```html\n<!-- Comment goes here. -->\n```\n\nHTML 注释可在源代码中查看，但不会出现在渲染后的页面中（请参阅上一节中的\
  \ ![Image](img/graycircle-e.jpg) 和 ![Image](img/graycircle-f.jpg)）。\n\nPHP 注释的不同之处在于它们根本不会被发送给\
  \ Web 浏览器，这意味着最终用户甚至无法在查看 HTML 源代码时看到它们。\n\nPHP 支持三种注释语法。第一种使用井号或数字符号（`#`）：\n\n\
  ```php\n# This is a comment.\n```\n\n第二种使用双斜杠：\n\n```php\n// This is also a comment.\n\
  ```\n\n这两种方式都会导致 PHP 忽略从该符号开始直到行尾（当你按下 Return 或 Enter 键时）的所有内容。因此，这两种注释仅用于单行。它们也常用于在包含\
  \ PHP 代码的同一行末尾添加注释：\n\n```php\nprint 'Hello!'; // Say hello.\n```\n\n第三种风格允许注释跨越多行：\n\
  \n```php\n/* This is a longer comment\nthat spans two lines. */\n```\n\n**脚本 1.4。**\
  \ 这些基本注释演示了可在 PHP 中使用的三种注释语法。\n\n---\n\n```php\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML\n        1.0 Transitional//EN\" \"http://www.w3.org/\n        TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n2   <html xmlns=\"http://www.w3.org/1999/\n        xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n3   <head>\n4       <meta http-equiv=\"Content-Type\"\n            content=\"\
  text/html; charset=utf-8\" />\n5       <title>Comments</title>\n6   </head>\n7 \
  \  <body>\n8   <?php\n\n9   # Script 1.4 - comments.php\n10  # Created March 16,\
  \ 2011\n11  # Created by Larry E. Ullman\n12  # This script does nothing much.\n\
  \n13  echo '<p>This is a line of text.<br />\n            This is another line of\
  \ text.</p>';\n\n14  /*\n15  echo 'This line will not be\n            executed.';\n\
  16  */\n\n17  echo \"<p>Now I'm done.</p>\";\n        // End of PHP code.\n\n18\
  \  ?>\n19  </body>\n20  </html>\n```\n\n---\n\n#### 为脚本添加注释\n\n**1.** 在文本编辑器或 IDE\
  \ 中新建一个 PHP 文档，命名为 `comments.php`，从初始 HTML 开始（**脚本 1.4**）：\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\
  \    <title>Comments</title>\n</head>\n<body>\n```\n\n**2.** 添加初始 PHP 标签并编写第一批注释：\n\
  \n```php\n<?php\n# Script 1.4 - comments.php\n# Created March 16, 2011\n# Created\
  \ by Larry E. Ullman\n# This script does nothing much.\n```\n\n每个脚本应包含的首批注释之一是一个介绍性块，列出创建日期、修改日期、创建者、创建者联系方式、脚本用途等。有人建议\
  \ Shell 风格的注释（`#`）在脚本中更醒目，因此最适合此类标注。\n\n**3.** 向 Web 浏览器发送一些 HTML：\n\n```php\necho\
  \ '<p>This is a line of text.<br />This is another line of text.</p>';\n```\n\n\
  此处具体做什么并不重要，只要生成一些供 Web 浏览器显示的内容即可。为了多样化，`echo` 语句将打印一些 HTML 标签，包括一个换行符（`<br />`）以增加生成的\
  \ HTML 页面的间距。\n\n**4.** 使用多行注释将第二条 `echo` 语句注释掉：\n\n```php\n/*\necho 'This line\
  \ will not be executed.';\n*/\n```\n\n通过用 `/*` 和 `*/` 包裹任意 PHP 代码块，你可以使该代码失效，而无需将其从脚本中删除。稍后移除注释标签，即可重新激活该部分\
  \ PHP 代码。\n\n**5.** 在第三条 `echo` 语句后添加最后一条注释：\n\n```php\necho \"<p>Now I'm done.</p>\"\
  ; // End of PHP code.\n```\n\n这最后一条（多余的）注释展示了如何在行尾放置注释，这是一种常见做法。注意此处消息由双引号括起，因为单引号会与撇号冲突（请参阅本章前面的“需要转义”侧边栏）。\n\
  \n**6.** 关闭 PHP 部分并完成 HTML 页面：\n\n```php\n?>\n</body>\n</html>\n```\n\n**7.** 将文件保存为\
  \ `comments.php`，将其放入 Web 目录，并在 Web 浏览器中测试 ![Image](img/circle-a.jpg)。\n\n![Image](img/01_figure_09_a.jpg)\n\
  \n![Image](img/circle-a.jpg) 脚本 1.4 中的 PHP 注释不会出现在 Web 页面或 HTML 源代码中 ![Image](img/graycircle-b.jpg)。\n\
  \n**8.** 如果你想一探究竟，请在 Web 浏览器中查看源代码，以确认 PHP 注释确实不在那里 ![Image](img/circle-b.jpg)。\n\
  \n![Image](img/01_figure_10_b.jpg)\n\n![Image](img/circle-b.jpg) 脚本 1.4 中的 PHP 注释在客户端浏览器中无处可寻。\n\
  \n---\n\n> **提示**\n>\n> 你不应该嵌套多行注释（`/* */`）（将一个放在另一个里面）。这样做会导致问题。\n\n---\n\n> **提示**\n\
  \n\n\n\n任何 PHP 注释都可以用在行尾（例如，在函数调用之后）：\n\n```\necho 'Howdy'; /* Say 'Howdy' */\n\
  ```\n\n虽然这是允许的，但这种用法远不如前者常见。\n\n***\n\n***\n\n提示\n\n你的脚本几乎不可能注释过多。编码时，始终宁可多写注释也不要少写。话虽这么说，为了节省篇幅，本书中的脚本不会像我建议的那样有详尽的文档注释。\n\
  \n***\n\n***\n\n提示\n\n同样重要的是，当你修改脚本时，要保持注释的更新和准确。没有什么比注释说一套而代码实际做另一套更令人困惑的了。\n\n\
  ***\n\n### 什么是变量？\n\n变量是用于临时存储值的容器。这些值可以是数字、文本，或更复杂的数据。PHP 支持八种类型的变量。其中包括四种标量（单值）类型——`Boolean`（`TRUE`\
  \ 或 `FALSE`）、`integer`（整数）、`floating point`（浮点数/小数）和 `strings`（字符串/字符）；两种非标量（多值）类型——`arrays`（数组）和\
  \ `objects`（对象）；加上 `resources`（资源，你会在与数据库交互时见到）和 `NULL`（这是一种没有值的特殊类型）。\n\n无论你创建哪种类型，PHP\
  \ 中所有变量名都遵循特定的语法规则：\n\n*   变量名必须以美元符号（`$`）开头，例如 `$name`。\n*   变量名可以包含字母、数字和下划线的组合，例如\
  \ `$my_report1`。\n*   美元符号后的第一个字符必须是字母或下划线（不能是数字）。\n*   **PHP 中的变量名区分大小写！** 这是一条非常重要的规则。这意味着\
  \ `$name` 和 `$Name` 是完全不同的两个变量。\n\n要开始使用变量，接下来的脚本将输出三个*预定义变量*的值。标准变量是在脚本执行期间赋值的，而预定义变量在脚本开始执行时就已经有值了。这些预定义变量大多反映了服务器整体的属性，例如正在使用的操作系统。\n\
  \n在进入脚本之前，还有两件事你应该知道。首先，变量可以使用等号（`=`）赋值，这也称为*赋值运算符*。其次，要显示变量的值，可以不加引号直接打印变量：\n\n\
  ```\nprint $some_var;\n```\n\n或者变量可以在*双*引号内打印：\n\n```\nprint \"Hello, $name\";\n\
  ```\n\n你不能在单引号内打印变量：\n\n```\nprint 'Hello, $name'; // 不会生效！\n```\n\n**脚本 1.5.**\
  \ 该脚本打印 PHP 众多预定义变量中的三个。\n\n***\n\n```\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML\n       1.0 Transitional//EN\" \"http://www.w3.org/\n       TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n2   <html xmlns=\"http://www.w3.org/1999/\n       xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n3   <head>\n4       <meta http-equiv=\"Content-Type\"\n           content=\"\
  text/html; charset=utf-8\" />\n5       <title>Predefined Variables</title>\n6  \
  \ </head>\n7   <body>\n8   <?php # Script 1.5 - predefined.php\n\n9   // Create\
  \ a shorthand version of the\n       variable names:\n10  $file = $_SERVER['SCRIPT_FILENAME'];\n\
  11  $user = $_SERVER['HTTP_USER_AGENT'];\n12  $server = $_SERVER['SERVER_SOFTWARE'];\n\
  \n13  // Print the name of this script:\n14  echo \"<p>You are running the\n   \
  \    file:<br /><b>$file</b>.</p>\\n\";\n\n15  // Print the user's information:\n\
  16  echo \"<p>You are viewing this page\n       using:<br /><b>$user</b></p>\\n\"\
  ;\n\n17  // Print the server's information:\n18  echo \"<p>This server is running:\n\
  \       <br /><b>$server</b>.</p>\\n\";\n\n19  ?>\n20  </body>\n21  </html>\n```\n\
  \n***\n\n#### 使用变量\n\n**1.** 在文本编辑器或 IDE 中新建一个名为 `predefined.php` 的 PHP 文档，从最初的\
  \ HTML 开始（**脚本 1.5**）：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\" lang=\"en\">\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=utf-8\" />\n  <title>Predefined Variables</title>\n</head>\n\
  <body>\n```\n\n**2.** 添加 PHP 开启标签和第一条注释：\n\n```\n<?php # Script 1.5 - predefined.php\n\
  ```\n\n从这里开始，脚本将不再注释创建者、创建日期等信息，尽管你应该继续为你的脚本编写详尽的文档。不过，脚本会添加注释以指示脚本的编号和文件名，以便于交叉引用（无论是在书中还是当你从本书配套网站\
  \ **www.LarryUllman.com** 下载它们时）。\n\n**3.** 创建本脚本中要用到的第一个变量的简写版本：\n\n```\n$file\
  \ = $_SERVER['SCRIPT_FILENAME'];\n```\n\n本脚本将使用三个变量，每个变量都来自更大的预定义变量 `$_SERVER`。`$_SERVER`\
  \ 指代大量与服务器相关的信息。脚本使用的第一个变量是 `$_SERVER['SCRIPT_FILENAME']`。该变量存储正在运行的脚本的完整路径和名称（例如\
  \ `C:\\Program Files\\Apache\\ htdocs\\predefined.php`）。\n\n存储在 `$_SERVER['SCRIPT_FILENAME']`\
  \ 中的值将被赋给新变量 `$file`。创建名称更短的新变量并将 `$_SERVER` 的值赋给它们，将使在打印时更容易引用这些变量。（这也绕过了另一个你将在适当时候了解到的问题。）\n\
  \n**4.** 创建另外两个变量的简写版本：\n\n```\n$user = $_SERVER['HTTP_USER_AGENT'];\n$server =\
  \ $_SERVER['SERVER_SOFTWARE'];\n```\n\n`$_SERVER['HTTP_USER_AGENT']` 代表访问脚本的用户的\
  \ Web 浏览器和操作系统。该值被赋给 `$user`。\n\n`$_SERVER['SERVER_SOFTWARE']` 代表服务器上运行 PHP 的 Web\
  \ 应用程序（例如 Apache、Abyss、Xitami、IIS）。这是必须安装（见 **附录 A**）的程序，以便在该计算机上运行 PHP 脚本。\n\n\
  **5.** 打印正在运行的脚本名称：\n\n```\necho \"<p>You are running the file:<br /><b>$file</b>.</p>\\\
  n\";\n```\n\n要打印的第一个变量是 `$file`。注意该变量必须在双引号内使用，且该语句还使用了 PHP 换行符（`\\n`），这将在生成的 HTML\
  \ 源代码中添加一个换行。添加了一些基本的 HTML 标签——段落和粗体——以使生成的页面稍微美观一些。\n\n**6.** 打印访问脚本的用户信息：\n\n\
  ```\necho \"<p>You are viewing this page using:<br /><b>$user</b>.</p>\\n\";\n```\n\
  \n这一行打印第二个变量 `$user`。重申第四步的内容，`$user` 对应 `$_SERVER['HTTP_USER_AGENT']`，指的是用于访问网页的操作系统、浏览器类型和浏览器版本。\n\
  \n**7.** 打印服务器信息：\n\n```\necho \"<p>This server is running: <br /><b>$server</b>.</p>\\\
  n\";\n```\n\n**8.** 完成 PHP 代码块和 HTML 页面：\n\n```\n?>\n</body>\n</html>\n```\n\n**9.**\
  \ 将文件保存为 `predefined.php`，将其放在你的 Web 目录中，并在 Web 浏览器中测试它。\n\n![Image](img/01_figure_11_a.jpg)\n\
  \n`predefined.php` 脚本向查看者报告关于脚本、用于查看它的 Web 浏览器以及服务器本身的信息。\n\n***\n\n提示\n\n如果你在运行此脚本或任何其他脚本时遇到问题，请求助于本书对应的\
  \ Web 论坛（**www.LarryUllman.com/forums/**）。\n\n***\n\n***\n\n提示\n\n\n\n如果可能，请使用不同的\
  \ Web 浏览器和/或在另一台服务器上运行此脚本 ![Image](img/circle-b.jpg)。\n\n![Image](img/01_figure_12_b.jpg)\n\
  \n![Image](img/circle-b.jpg)这是本书中第一个真正动态的脚本，因为 Web 页面会根据运行它的服务器和查看它的 Web 浏览器而发生变化（请与\
  \ ![Image](img/graycircle-a.jpg) 进行比较）。\n\n***\n\n提示\n\n变量名不能包含空格。下划线通常用于代替空格。\n\
  \n***\n\n提示\n\n创建变量时最重要的考虑因素是使用一致的命名方案。在本书中，你将看到我对变量名使用全小写字母，并用下划线分隔单词（`$first_name`）。一些程序员更喜欢使用大小写混合：`$FirstName`（称为“驼峰式”风格）。\n\
  \n***\n\n提示\n\nPHP 对待变量非常随意，这意味着你不需要初始化它们（设置初始值）或声明它们（设置特定类型），并且你可以在多种类型之间转换变量而不会出现问题。\n\
  \n***\n\n### 字符串简介\n\n既然你已经了解了变量的一般概念，让我们详细了解一下变量。要深入探讨的第一种变量类型是*字符串*。字符串仅仅是一段带引号的字符：字母、数字、空格、标点符号等。以下都是字符串：\n\
  \n• ‘Tobias’\n\n• “In watermelon sugar”\n\n• ‘100’\n\n• ‘August 2, 2011’\n\n要创建一个字符串变量，请将一个字符串值赋给一个有效的变量名：\n\
  \n```php\n$first_name = 'Tobias';\n\n$today = 'August 2, 2011';\n```\n\n创建字符串时，你可以使用单引号或双引号来封装字符，就像打印文本时一样。同样，你必须为字符串的开头和结尾使用同一种引号。如果该引号出现在字符串内部，则必须对其进行转义：\n\
  \n```php\n$var = \"Define \\\"platitude\\\", please.\";\n```\n\n或者你也可以使用另一种引号：\n\
  \n```php\n$var = 'Define \"platitude\", please.';\n```\n\n要打印字符串的值，请使用 `echo` 或\
  \ `print`：\n\n```php\necho $first_name;\n```\n\n要在上下文中打印字符串的值，必须使用双引号：\n\n```php\n\
  echo \"Hello, $first_name\";\n```\n\n你已经使用过一次字符串了——在上一节使用预定义变量时（那些变量的值恰好是字符串）。在下一个示例中，你将创建并使用自己的字符串。\n\
  \n**脚本 1.6。** 此脚本创建字符串变量，并将它们的值发送到 Web 浏览器。\n\n***\n\n```html\n1   <!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML\n      1.0 Transitional//EN\" \"http://www.w3.org/\n\
  \      TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \      xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n          content=\"text/html; charset=utf-8\" />\n5       <title>Strings</title>\n\
  6   </head>\n7   <body>\n8   <?php # Script 1.6 - strings.php\n\n9   // Create the\
  \ variables:\n10  $first_name = 'Haruki';\n11  $last_name = 'Murakami';\n12  $book\
  \ = 'Kafka on the Shore';\n\n13  // Print the values:\n14  echo \"<p>The book <em>$book</em>\n\
  \          was written by $first_name\n          $last_name.</p>\";\n\n15  ?>\n\
  16  </body>\n17  </html>\n```\n\n***\n\n#### 使用字符串\n\n**1.** 在文本编辑器或 IDE 中开始一个新的\
  \ PHP 文档，命名为 `strings.php`，从初始 HTML 开始，包含开启 PHP 标签（**脚本 1.6**）：\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Strings</title>\n</head>\n<body>\n<?php # Script 1.6 - strings.php\n```\n\
  \n**2.** 在 PHP 标签内，创建三个变量：\n\n```php\n$first_name = 'Haruki';\n\n$last_name = 'Murakami';\n\
  \n$book = 'Kafka on the Shore';\n```\n\n这个基本示例创建了 `$first_name`、`$last_name` 和 `$book`\
  \ 变量，随后将在一条消息中将它们打印出来。\n\n**3.** 添加一条 `echo` 语句：\n\n```php\necho \"<p>The book <em>$book</em>\
  \ was written by $first_name $last_name.</p>\";\n```\n\n该脚本所做的只是根据三个既定变量打印一条作者声明。为了使其更美观，还加入了一点\
  \ HTML 格式化（书名加了强调）。请记住，此处要使用双引号，以便变量值能被适当地打印出来（关于双引号重要性的更多内容见本章末尾）。\n\n**4.** 完成\
  \ PHP 代码块和 HTML 页面：\n\n```php\n?>\n</body>\n</html>\n```\n\n**5.** 将文件保存为 `strings.php`，将其放在你的\
  \ Web 目录中，并在 Web 浏览器中测试它 ![Image](img/circle-a.jpg)。\n\n![Image](img/01_figure_13_a.jpg)\n\
  \n![Image](img/circle-a.jpg)生成的 Web 页面基于打印出的三个变量的值。\n\n**6.** 如果需要，更改三个变量的值，保存文件，并再次运行脚本\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/01_figure_14_b.jpg)\n\n![Image](img/circle-b.jpg)通过更改脚本中的变量，脚本的输出也随之改变。\n\
  \n***\n\n提示\n\n如果你给一个现有变量（例如 `$book`）赋予另一个值，新值将覆盖旧值。例如：\n\n```php\n$book = 'High\
  \ Fidelity';\n\n$book = 'The Corrections';\n\n/* $book 现在的值为\n'The Corrections'。\
  \ */\n```\n\n***\n\n提示\n\nPHP 对字符串的大小没有设定限制。理论上你可能会受到服务器资源的限制，但你不太可能遇到这种问题。\n\n\
  ***\n\n**脚本 1.7。** 连接操作使你能够向字符串追加更多字符。\n\n***\n\n```html\n1   <!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML\n      1.0 Transitional//EN\" \"http://www.w3.org/\n     \
  \ TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \      xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n          content=\"text/html; charset=utf-8\" />\n5       <title>Concatenation</title>\n\
  6   </head>\n7   <body>\n8   <?php # Script 1.7 - concat.php\n\n9   // Create the\
  \ variables:\n10  $first_name = 'Melissa';\n11  $last_name = 'Bank';\n12  $author\
  \ = $first_name . ' ' .\n      $last_name;\n\n13  $book = 'The Girls\\' Guide to\
  \ Hunting\n      and Fishing';\n\n14  //Print the values:\n15  echo \"<p>The book\
  \ <em>$book</em>\n          was written by $author.</p>\";\n\n16  ?>\n17  </body>\n\
  18  </html>\n```\n\n***\n\n### 连接字符串\n\n*连接* 就像是字符串的加法，即将字符添加到字符串的末尾。它使用*连接运算符*执行，即英文句点\
  \ (`.`)：\n\n```php\n$city = 'Seattle';\n\n$state = 'Washington';\n\n$address = $city\
  \ . $state;\n```\n\n`$address` 变量现在的值为 *SeattleWashington*，这几乎达到了预期结果 (*Seattle,\
  \ Washington*)。为了改进这一点，你可以编写：\n\n```php\n$address = $city . ', ' . $state;\n```\n\
  \n这样逗号和空格也会被连接到变量中。\n\n由于 PHP 对待变量非常宽松，因此字符串和数字之间也可以进行连接。以下任一语句都将产生相同的结果 (*Seattle,\
  \ Washington 98101*)：\n\n```php\n$address = $city . ', ' . $state .\n' 98101';\n\
  \n$address = $city . ', ' . $state .\n' ' . 98101;\n```\n\n让我们修改 `strings.php` 以使用这个新运算符。\n\
  \n#### 使用连接\n\n**1.** 在文本编辑器或 IDE 中打开 `strings.php`（参考 **脚本 1.6**）。\n\n**2.** 在建立\
  \ `$first_name` 和 `$last_name` 变量之后（第 11 行和第 12 行），添加此行（**脚本 1.7**）：\n\n```php\n\
  $author = $first_name . ' ' . $last_name;\n```\n\n\n\n作为连接演示，将创建一个新变量——`$author`——作为两个现有字符串及中间一个空格的连接结果。\n\
  \n### 3. 更改 `echo` 语句以使用此新变量：\n\n```php\necho \"<p>The book <em>$book</em> was written\
  \ by $author.</p>\";\n```\n\n由于这两个变量已合二为一，因此应相应地修改 `echo` 语句。\n\n### 4. 如有需要，更改\
  \ HTML 页面标题以及名、姓和书名变量的值。\n\n### 5. 将文件保存为 `concat.php`，放入 Web 目录，并在 Web 浏览器中测试 ![Image](img/circle-a.jpg)。\n\
  \n![Image](img/01_figure_15_a.jpg)\n\n![Image](img/circle-a.jpg) 在此修订后的脚本中，连接的最终结果对用户不可见。\n\
  \n***\n\n### Tip\n\nPHP 拥有大量实用的字符串专用函数，您将在本书中逐一见到。例如，要计算字符串的长度（包含多少字符），请使用 `strlen()`：\n\
  \n```php\n$num = strlen('some string'); // 11\n```\n\n***\n\n### Tip\n\n您可以使用以下函数让\
  \ PHP 转换字符串的大小写：`strtolower()` 将其全部转为小写；`strtoupper()` 将其全部转为大写；`ucfirst()` 将首字符大写；`ucwords()`\
  \ 将每个单词的首字符大写。\n\n***\n\n### Tip\n\n如果只是将一个值连接到另一个值后面，可以使用连接赋值运算符 (`.=`) 。以下两种写法等效：\n\
  \n```php\n$title = $title . $subtitle;\n$title .= $subtitle;\n```\n\n***\n\n###\
  \ Tip\n\n本节开头的示例可改写为以下任意一种形式：\n\n```php\n$address = \"$city, $state\";\n```\n\n\
  或\n\n```php\n$address = $city;\n$address .= ', ';\n$address .= $state;\n```\n\n\
  ***\n\n### 使用 PHP 手册\n\nPHP 手册——可在线访问 **[www.php.net/manual](http://www.php.net/manual)**——列出了该语言的每个函数和特性。手册首先讨论一般概念（安装、语法、变量），最后按主题分类列出函数（MySQL、字符串函数等）。\n\
  \n要在 PHP 手册中快速查找任意函数，请在 Web 浏览器中访问 **[www.php.net/`functionname`](http://www.php.net/)**（例如\
  \ **[www.php.net/print](http://www.php.net/print)**）。手册针对每个函数均指明：\n\n*   该函数可用的\
  \ PHP 版本。\n*   函数接受的参数个数及类型（可选参数用方括号括起）。\n*   函数的返回值类型。\n\n手册还包含函数的说明。\n\n您应养成习惯：每当对某函数感到困惑、不确定如何正确使用，或需要深入了解语言的任何特性时，都去查阅\
  \ PHP 手册。了解您正在运行的 PHP 版本也至关重要，因为函数和 PHP 的其他细节会随时间变化。\n\n***\n\n### 数字简介\n\n在介绍变量时，我提到\
  \ PHP 同时拥有整型和浮点型（小数）两种数字类型。但根据我的经验，这两种类型在大多数情况下均可归类为通用的“数字”，而不会丢失任何有价值的区别。PHP 中合法的数字类型变量可以是：\n\
  \n*   8\n*   3.14\n*   10980843985\n*   -4.2398508\n*   4.4e2\n\n请注意，这些值从不加引号——加引号的数字是具有数值的字符串——也不包含用于表示千位的逗号。此外，除非前面有减号\
  \ (`-`)，否则数字默认为正数。\n\n除了可以对数字使用标准算术运算符（**表 1.1**）外，PHP 还内置了数十个函数。其中两个常用函数是 `round()`\
  \ 和 `number_format()`。前者将小数四舍五入为最接近的整数：\n\n```php\n$n = 3.14;\n$n = round($n); //\
  \ 3\n```\n\n**表 1.1. 算术运算符**\n\n![Image](img/01tab01.jpg)\n\n`round()` 也可四舍五入到指定的小数位数：\n\
  \n```php\n$n = 3.142857;\n$n = round($n, 3); // 3.143\n```\n\n`number_format()`\
  \ 函数将数字转换为更常见的书写形式，即使用逗号分隔千位：\n\n```php\n$n = 20943;\n$n = number_format($n); //\
  \ 20,943\n```\n\n该函数也可设置指定的小数位数：\n\n```php\n$n = 20943;\n$n = number_format($n,\
  \ 2); // 20,943.00\n```\n\n为了练习数字操作，让我们编写一个模拟脚本，执行电子商务购物车中可能用到的计算。\n\n#### 使用数字\n\
  \n### 1. 在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `numbers.php`（**脚本 1.8**）：\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Numbers</title>\n</head>\n<body>\n<?php # Script 1.8 - numbers.php\n```\n\
  \n### 2. 建立所需变量：\n\n```php\n$quantity = 30;\n$price = 119.95;\n$taxrate = .05;\n\
  ```\n\n本脚本将使用三个硬编码变量进行计算。稍后您将看到如何动态确定这些值（即通过用户与 HTML 表单的交互）。\n\n### 3. 执行计算：\n\n\
  ```php\n$total = $quantity * $price;\n$total = $total + ($total * $taxrate);\n```\n\
  \n第一行将订单总额设为购买的部件数量乘以单价。第二行再加上税额（通过税率乘以总额计算得出）。\n\n**脚本 1.8.** `numbers.php` 脚本执行基本数学计算，如电子商务应用中所用。\n\
  \n***\n\n```php\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n       1.0 Transitional//EN\"\
  \ \"http://www.w3.org/\n       TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html\
  \ xmlns=\"http://www.w3.org/1999/\n       xhtml\" xml:lang=\"en\" lang=\"en\">\n\
  3   <head>\n4       <meta http-equiv=\"Content-Type\"\n            content=\"text/html;\
  \ charset=utf-8\" />\n5       <title>Numbers</title>\n6   </head>\n7   <body>\n\
  8   <?php # Script 1.8 - numbers.php\n\n9   // Set the variables:\n10  $quantity\
  \ = 30; // Buying 30 widgets.\n11  $price = 119.95;\n12  $taxrate = .05; // 5% sales\
  \ tax.\n\n13  // Calculate the total:\n14  $total = $quantity * $price;\n15  $total\
  \ = $total + ($total * $taxrate);\n       // Calculate and add the tax.\n\n16  //\
  \ Format the total:\n17  $total = number_format($total, 2);\n\n18  // Print the\
  \ results:\n19  echo '<p>You are purchasing <b>' .\n       $quantity . '</b> widget(s)\
  \ at a cost\n       of <b>$' . $price . '</b> each. With\n       tax, the total\
  \ comes to <b>$' .\n       $total . '</b>.</p>';\n\n20  ?>\n21  </body>\n22  </html>\n\
  ```\n\n***\n\n### 4. 格式化总额：\n\n```php\n$total = number_format($total, 2);\n```\n\
  \n`number_format()` 函数将总额按千位分组并四舍五入到两位小数。应用此函数可正确格式化计算值。\n\n### 5. 输出结果：\n\n```php\n\
  echo '<p>You are purchasing <b>' . $quantity . '</b> widget(s) at a cost of <b>$'\
  \ . $price . '</b> each. With tax, the total comes to <b>$' . $total . '</b>.</p>';\n\
  ```\n\n脚本的最后一步是输出结果。`echo` 语句结合单引号文本和连接的变量，以输出 HTML、美元符号和变量值的完整组合。本章最后一个示例将展示另一种方法。\n\
  \n### 6. 完成 PHP 代码和 HTML 页面：\n\n```php\n?>\n</body>\n</html>\n```\n\n### 7. 将文件保存为\
  \ `numbers.php`，放入 Web 目录，并在 Web 浏览器中测试 ![Image](img/circle-a.jpg)。\n\n![Image](img/01_figure_16_a.jpg)\n\
  \n\n\n\n![Image](img/circle-a.jpg)数字 PHP 页面（脚本 1.8）根据设定的值执行计算。\n\n**8.** 如果需要，更改最初的三个变量并重新运行脚本\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/01_figure_17_b.jpg)\n\n![Image](img/circle-b.jpg)要更改生成的网页，请更改任意或所有三个变量（与\
  \ ![Image](img/graycircle-a.jpg) 对比）。\n\n* * *\n\n**提示**\n\n在大多数平台上，PHP 支持的最大整数约为二十亿。对于大于该值的数字，PHP\
  \ 将自动使用浮点类型。\n\n* * *\n\n**提示**\n\n在处理算术运算时，*优先级* 问题会出现（复杂计算的执行顺序）。虽然 PHP 手册和其他资料倾向于列出优先级的层级，但我发现将子句放在括号中以强制执行顺序会使编程更安全、更易读（请参阅\
  \ 脚本 1.8 的第 17 行）。\n\n* * *\n\n**提示**\n\n计算机以处理小数著称不精。例如，数字 2.0 实际上可能被存储为 1.99999。大多数情况下这不会构成问题，但在数学精度至关重要的情况下，请依赖整数，而非小数。PHP\
  \ 手册中有关于此主题的信息，以及用于提高计算精度的替代函数。\n\n* * *\n\n**提示**\n\n许多数学运算符也有对应的赋值运算符，允许你创建赋值的简写。这一行代码，\n\
  \n```\n$total = $total + ($total * $taxrate);\n```\n\n可以重写为\n\n```\n$total += ($total\
  \ * $taxrate);\n```\n\n* * *\n\n**提示**\n\n如果你设置 `$price` 值时未使用两位小数（例如 119.9 或 34），你会想要在打印前对\
  \ `$price` 应用 `number_format()`。\n\n* * *\n\n### 介绍常量\n\n常量与变量一样，用于临时存储值，但除此之外，常量和变量在许多方面有所不同。首先，要创建常量，你需要使用\
  \ `define()` 函数，而不是赋值运算符（`=`）：\n\n```\ndefine ('NAME', value);\n```\n\n请注意，根据经验法则，常量名称通常使用全大写，尽管这不是强制要求。最重要的是，常量不像变量那样使用初始美元符号（因为常量不是变量）。\n\
  \n常量只能被赋予 *标量* 值，如字符串或数字：\n\n```\ndefine ('USERNAME', 'troutocity');  \ndefine ('PI',\
  \ 3.14);\n```\n\n与变量不同，常量的值一旦定义就不能更改。\n\n要访问常量的值（例如当你想打印它时），不能将常量放在引号内：\n\n```\n\
  echo \"Hello, USERNAME\"; // 不会生效！\n```\n\n使用该代码，PHP 会按字面意思打印 *Hello, USERNAME*\
  \ ![Image](img/circle-a.jpg)，而不是 `USERNAME` 常量的值（因为没有迹象表明 `USERNAME` 不是字面文本）。相反，要么单独打印常量：\n\
  \n```\necho 'Hello, ';  \necho USERNAME;\n```\n\n![Image](img/01_figure_18_a.jpg)\n\
  \n![Image](img/circle-a.jpg)常量不能放在带引号的字符串中。\n\n要么使用连接运算符：\n\n```\necho 'Hello, '\
  \ . USERNAME;\n```\n\nPHP 运行时带有几个预定义常量，这很像本章前面使用的预定义变量。这些常量包括 `PHP_VERSION`（正在运行的\
  \ PHP 版本）和 `PHP_OS`（服务器的操作系统）。下一个脚本将打印这两个值，以及用户定义常量的值。\n\n**脚本 1.9.** 常量是你可以在 PHP\
  \ 中使用的另一种临时存储工具，区别于变量。\n\n* * *\n\n```\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML  \n    1.0 Transitional//EN\" \"http://www.w3.org/  \n    TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >  \n2   <html xmlns=\"http://www.w3.org/1999/  \n    xhtml\" xml:lang=\"en\" lang=\"\
  en\">  \n3   <head>  \n4       <meta http-equiv=\"Content-Type\"  \n           \
  \ content=\"text/html; charset=utf-8\" />  \n5       <title>Constants</title>  \n\
  6   </head>  \n7   <body>  \n8   <?php # Script 1.9 - constants.php  \n9   \n10\
  \  // Set today's date as a constant:  \n11  define ('TODAY', 'March 16, 2011');\
  \  \n12   \n13  // Print a message, using predefined  \n        constants and the\
  \ TODAY constant:  \n14  echo '<p>Today is ' . TODAY . '.<br />  \n        This\
  \ server is running version <b>' .  \n        PHP_VERSION . '</b> of PHP on the\
  \ <b>' .  \n        PHP_OS . '</b> operating system.</p>';  \n15   \n16  ?>  \n\
  17  </body>  \n18  </html>\n```\n\n* * *\n\n#### 使用常量\n\n**1.** 在文本编辑器或 IDE 中开始一个新的\
  \ PHP 文档，命名为 `constants.php`（**脚本 1.9**）。\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >  \n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\"> \
  \ \n<head>  \n  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
  \ />  \n  <title>Constants</title>  \n</head>  \n<body>  \n<?php # Script 1.9 -\
  \ constants.php\n```\n\n**2.** 创建一个新的日期常量：\n\n```\ndefine ('TODAY', 'March 16, 2011');\n\
  ```\n\n这是一个公认微不足道的常量用法，但这个例子将说明要点。在第 9 章“将 PHP 与 MySQL 结合使用”中，你将看到如何使用常量来存储数据库访问信息。\n\
  \n**3.** 打印出日期、PHP 版本和操作系统信息：\n\n```\necho '<p>Today is ' . TODAY . '.<br />This\
  \ server is running version <b>' . PHP_VERSION . '</b> of PHP on the <b>' . PHP_OS\
  \ . '</b> operating system.</p>';\n```\n\n由于常量不能在引号内打印，请在 `echo` 语句中使用连接运算符。\n\n\
  **4.** 完成 PHP 代码和 HTML 页面：\n\n```\n?>  \n</body>  \n</html>\n```\n\n**5.** 将文件保存为\
  \ `constants.php`，将其放在你的 Web 目录中，并在 Web 浏览器中测试它 ![Image](img/circle-b.jpg)。\n\n\
  ![Image](img/01_figure_19_b.jpg)\n\n![Image](img/circle-b.jpg)通过利用 PHP 的常量，你可以了解更多关于你的\
  \ PHP 设置的信息。\n\n* * *\n\n**提示**\n\n如果可能，在另一台启用了 PHP 的服务器上运行此脚本 ![Image](img/circle-c.jpg)。\n\
  \n![Image](img/01_figure_20_c.jpg)\n\n![Image](img/circle-c.jpg)在不同的服务器上运行相同的脚本（请参阅\
  \ 脚本 1.9）会得到不同的结果。\n\n* * *\n\n**提示**\n\n称为 *Darwin* 的操作系统 ![Image](img/graycircle-b.jpg)\
  \ 是 Mac OS X 的技术术语。\n\n* * *\n\n**提示**\n\n在第 12 章“Cookie 和 Session”中，你将了解另一个常量 `SID`（代表\
  \ *session ID*）。\n\n* * *\n\n### 单引号与双引号\n\n在 PHP 中，理解单引号与双引号的区别很重要。对于 `echo` 和\
  \ `print`，或给字符串赋值时，你可以使用任意一种，正如迄今为止使用的示例所示。但这两种引号之间存在关键差异，且何时使用哪种也有讲究。你已经见过这种差异，但这是一个重要到足以值得进一步讨论的概念。\n\
  \n在 PHP 中，*单引号内的值将被视为字面量*，而*双引号内的值将被解析*。换句话说，将变量和特殊字符（**表 1.2**）放在双引号内将导致打印出它们所代表的值，而不是它们的字面值。例如，假设你有\n\
  \n```\n$var = 'test';\n```\n\n**表 1.2. 转义序列**\n\n![Image](img/01tab02.jpg)\n\n代码\
  \ `echo \"var is equal to $var\";` 将打印 *var is equal to test*，但代码 `echo 'var is\
  \ equal to $var';` 将打印 *var is equal to $var*。使用转义的美元符号，代码 `echo \"\\$var is equal\
  \ to $var\";` 将打印 *$var is equal to test*，而代码 `echo '\\$var is equal to $var';`\
  \ 将打印 *\\$var is equal to $var* ![Image](img/circle-a.jpg)。\n\n\n\n\n\n![Image](img/01_figure_21_a.jpg)\n\
  \n![Image](img/circle-a.jpg)单引号和双引号如何影响 PHP 的打印输出。\n\n正如这些示例所示，双引号会将变量名（`$var`）替换为其值（*test*），将特殊字符的代码（`\\\
  $`）替换为其所代表的值（*$*）。单引号始终会原样显示你输入的内容，转义的单引号（`\\'`）和转义的反斜杠（`\\\\`）除外，它们分别打印为单引号和单个反斜杠。\n\
  \n作为引号类型差异的另一个示例，让我们修改 `numbers.php` 脚本进行实验。\n\n#### 使用单引号和双引号\n\n**1.** 在文本编辑器或\
  \ IDE 中打开 `numbers.php`（参考 脚本 1.8）。\n\n**2.** 删除现有的 `echo` 语句（脚本 1.10）。\n\n**3.**\
  \ 打印一个标题，然后使用双引号重写原来的 `echo` 语句：\n\n```\necho \"<h3>Using double quotation marks:</h3>\"\
  ;\n\necho \"<p>You are purchasing <b>$quantity</b> widget(s) at a cost of <b>\\\\\
  $$price</b> each. With tax, the total comes to <b>\\\\$$total</b>.</p>\\\\n\";\n\
  ```\n\n在原始脚本中，结果是使用单引号和连接运算符打印的。使用双引号可以达到相同的效果。使用双引号时，变量可以直接放在字符串内部。\n\n但有一个注意事项：尝试将美元金额打印为\
  \ $12.34（其中 12.34 来自变量）可能会让你想要编写 `$$var`。这行不通（原因比较复杂）。相反，应转义第一个美元符号，得到 `\\$$var`，正如本代码中出现的两次那样。第一个美元符号将被打印，第二个则成为变量名的开头。\n\
  \n**脚本 1.10.** 本章的最后一个脚本，演示了使用单引号和双引号的区别。\n\n* * *\n\n```\n1   <!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML\n      1.0 Transitional//EN\" \"http://www.w3.org/\n     \
  \ TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \      xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n         content=\"text/html; charset=utf-8\" />\n5       <title>Quotation\
  \ Marks</title>\n6   </head>\n7   <body>\n8   <?php # Script 1.10 - quotes.php\n\
  \n9   // Set the variables:\n10  $quantity = 30; // Buying 30 widgets.\n11  $price\
  \ = 119.95;\n12  $taxrate = .05; // 5% sales tax.\n\n13  // Calculate the total.\n\
  14  $total = $quantity * $price;\n15  $total = $total + ($total * $taxrate);\n \
  \     // Calculate and add the tax.\n\n16  // Format the total:\n17  $total = number_format\
  \ ($total, 2);\n\n18  // Print the results using double\n      quotation marks:\n\
  19  echo \"<h3>Using double quotation\n      marks:</h3>\";\n20  echo \"<p>You are\
  \ purchasing\n      <b>$quantity</b> widget(s) at a cost\n      of <b>\\\\$$price</b>\
  \ each. With tax,\n      the total comes to <b>\\\\$$total</b>.\n      </p>\\\\\
  n\";\n\n21  // Print the results using single\n      quotation marks:\n22  echo\
  \ '<h3>Using single quotation\n      marks:</h3>';\n23  echo '<p>You are purchasing\n\
  \      <b>$quantity</b> widget(s) at a cost\n      of <b>\\\\$$price</b> each. With\
  \ tax,\n      the total comes to <b>\\\\$$total</b>.\n      </p>\\\\n';\n\n24  ?>\n\
  25  </body>\n26  </html>\n```\n\n* * *\n\n**4.** 重复 `echo` 语句，这次使用单引号：\n\n```\n\
  echo '<h3>Using single quotation marks:</h3>';\n\necho '<p>You are purchasing <b>$quantity</b>\
  \ widget(s) at a cost of <b>\\\\$$price</b> each. With tax, the total comes to <b>\\\
  \\$$total</b>.</p>\\\\n';\n```\n\n此 `echo` 语句用于突出显示使用单引号或双引号的区别。它不会按预期工作，生成的页面将准确显示实际发生的情况。\n\
  \n**5.** 如果需要，更改页面标题。\n\n**6.** 将文件保存为 `quotes.php`，将其放在 Web 目录中，并在 Web 浏览器中测试 ![Image](img/circle-b.jpg)。\n\
  \n![Image](img/01_figure_22_b.jpg)\n\n![Image](img/circle-b.jpg)这些结果演示了何时以及如何使用一种引号而非另一种。\n\
  \n**7.** 查看网页源代码，了解在每种引号类型中使用换行符（`\\n`）的区别。\n\n你应该会看到，当你将换行符放在双引号内时，它会在 HTML 源代码中创建一个新行。而放在单引号内时，则会打印字面字符\
  \ `\\` 和 `n`。\n\n* * *\n\n> **提示**\n>\n> 因为 PHP 会尝试在双引号内查找变量，所以使用单引号在理论上更快。不过，如果你需要打印变量的值，则必须使用双引号。\n\
  \n* * *\n\n> **提示**\n>\n> 由于有效的 HTML 通常包含大量双引号属性，因此在用 PHP 打印 HTML 时，使用单引号通常最方便：\n\
  >\n> ```\n> echo '<table width=\"80%\" border=\"0\" cellspacing=\"2\" cellpadding=\"\
  3\" align=\"center\">';\n> ```\n>\n> 如果你要使用双引号打印这段 HTML，就必须转义字符串中的所有双引号：\n>\n> ```\n\
  > echo \"<table width=\\\\\"80%\\\\\" border=\\\\\"0\\\\\" cellspacing=\\\\\"2\\\
  \\\" cellpadding=\\\\\"3\\\\\" align=\\\\\"center\\\\\">\";\n> ```\n\n* * *\n\n\
  > **提示**\n>\n> 在较新版本的 PHP 中，你实际上可以直接使用 `$$price` 和 `$$total`，而无需在前面加上反斜杠（得益于某些内部机制）。在旧版本的\
  \ PHP 中则不行。为了确保无论 PHP 版本如何都能获得可靠的结果，当你需要打印一个紧跟变量值的美元符号时，我建议使用 `\\$$var` 语法。\n\n\
  * * *\n\n> **提示**\n>\n> 如果你仍不清楚引号类型的区别，请使用双引号，这样不太可能出现问题。\n\n* * *\n\n### 基本调试步骤\n\
  \n调试绝非一个易于掌握的概念，遗憾的是，它只有通过实践才能真正精通。接下来的 50 页都可以专门讲这个主题，你仍只能掌握日后将要获得和需要的调试技能的一小部分。\n\
  \n之所以以这种略带吓人的方式介绍调试，是因为重要的是不要带着幻觉进入编程领域。有时代码不会按预期工作，你不可避免地会犯粗心的错误，甚至有些日子你会想拔光头发，即使使用像\
  \ PHP 这样相对用户友好的语言也是如此。简而言之，要做好准备，有时会感到困惑和沮丧。我从 1999 年开始编写 PHP 代码，偶尔仍会陷入编程的泥潭。但调试是一项非常重要的技能，你最终会出于必要和经验而掌握它。当你开始\
  \ PHP 编程之旅时，我可以提供以下基本但具体的调试技巧。\n\n请注意，这些只是一些通用的调试技巧，专门为 PHP 初学者量身定制。第 8 章“错误处理与调试”将更详细地介绍其他技巧。\n\
  \n#### 调试 PHP 脚本\n\n• **确保始终通过 URL 运行 PHP 脚本！**\n\n这也许是最常见的初学者错误。PHP 代码必须通过 Web\
  \ 服务器应用程序运行，这意味着必须通过 `http://`*`something`* 来请求。当你看到实际的 PHP 代码而不是该代码执行的结果时，极有可能是你没有通过\
  \ URL 运行 PHP 脚本。\n\n• **了解你正在运行的 PHP 版本。**\n\n\n\n\n### 所用 PHP 版本可能引发一些问题\n\n在使用任何支持\
  \ PHP 的服务器之前，请先运行 `phpinfo.php` 脚本（参见 附录 A）或参考 `PHP_VERSION` 常量，以确认正在使用的 PHP 版本。\n\
  \n- **确保 `display_errors` 处于开启状态。**\n\n这是一个基本的 PHP 配置设置（在 附录 A 中也有讨论）。你可以通过执行 `phpinfo()`\
  \ 函数来确认此设置（只需在生成的页面中用浏览器搜索 `display_errors`）。出于安全原因，PHP 可能被设置为不显示发生的错误。如果是这种情况，当问题发生时，你最终看到的将是空白页面。要调试大多数问题，你需要看到错误信息，因此在学习期间请开启此设置。你可以在\
  \ 附录 A 中找到相关操作说明。\n\n- **检查 HTML 源代码。**\n\n有时问题隐藏在页面的 HTML 源代码中。事实上，有时 PHP 错误信息就藏在其中！\n\
  \n- **信任错误信息。**\n\n另一个非常常见的初学者错误是未完整阅读或不信任 PHP 报告的错误。尽管错误信息往往晦涩难懂，看似毫无意义，但绝不能忽视。至少，PHP\
  \ 通常能正确指出问题所在的行号。如果你需要将该错误信息转达给他人（比如向我寻求帮助时），请务必包含完整的错误信息！\n\n- **暂停一下！**\n\n多年来我遇到的许多编程问题，以及绝大多数最棘手的问题，都是通过暂时离开电脑一段时间而解决的。很容易产生挫败感和困惑，在这种情况下，你采取的任何进一步步骤都可能只会让事情变得更糟。\n\
  \n### 复习与拓展\n\n本书新增了“复习与拓展”板块，位于每章末尾。在这些板块中，你将看到关于刚才所学内容的问题，以及自行拓展知识和经验的提示。如果你在回答问题或自行探索时遇到任何问题，请访问本书的配套论坛\
  \ ([www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/))。\n\n#### 复习\n\
  \n- 哪些标签用于包裹 PHP 代码？\n- PHP 文件应具有什么扩展名？\n- 页面的*编码*指的是什么？编码对页面有什么影响？\n- 可以使用哪些 PHP\
  \ 函数或语言结构向 Web 浏览器发送数据？\n- 在创建或输出字符串时，使用单引号与双引号有何不同？\n- 在字符串中*转义*字符是什么意思？\n- PHP\
  \ 中有哪三种注释语法？哪一种可以跨多行使用？\n- 所有变量名以什么字符开头？紧接着可以是什么字符？变量名中还可以使用哪些其他字符？\n- 变量名是区分大小写还是不区分大小写？\n\
  - 什么是赋值运算符？\n- 如何创建字符串变量？\n- 什么是连接运算符？什么是连接赋值运算符？\n- 常量如何定义和使用？\n\n#### 拓展\n\n-\
  \ 如果你还不确定自己运行的 PHP 版本，请立即检查。\n- 在 PHP 手册中查找提到的某个字符串函数。然后查看其中列出的其他可用字符串函数。\n- 在 PHP\
  \ 手册中查找提到的某个数字函数。然后查看其中列出的其他可用数字函数。\n- 在 PHP 手册中搜索 `$_SERVER` 变量，了解它还包含哪些其他信息。\n\
  - 从头创建一个新脚本，定义并显示一些字符串变量的值。在输出值的 `echo` 或 `print` 语句中使用双引号。为增加复杂性，在输出中包含一些 HTML。然后重写该脚本，使其使用单引号和连接运算符代替双引号。\n\
  - 从头创建一个新脚本，定义、操作并显示一些数值变量的值。\n\n## 2. PHP 编程\n\n### 本章内容\n\n- 创建 HTML 表单\n- 处理\
  \ HTML 表单\n- 条件判断与运算符\n- 验证表单数据\n- 数组简介\n- For 循环和 While 循环\n- 复习与拓展\n\n现在你已掌握 PHP\
  \ 脚本语言的基础知识，是时候以此为基础开始真正的编程了。在本章中，你将开始创建更复杂的脚本，同时继续学习该语言的一些标准结构、函数和语法。\n\n你将从创建一个\
  \ HTML 表单开始，然后学习如何使用 PHP 处理提交的值。随后，本章将介绍条件判断和剩余的运算符（第 1 章“PHP 简介”已介绍赋值、连接和数学运算符）、数组（另一种变量类型）以及最后一种语言结构——循环。\n\
  \n#### 创建 HTML 表单\n\n使用 PHP 处理 HTML 表单或许是任何动态网站中最重要的过程。这涉及两个步骤：首先创建 HTML 表单本身，然后创建相应的\
  \ PHP 脚本来接收和处理表单数据。\n\n详细讲解 HTML 表单超出了本书范围，但我将带你快速浏览一个示例，以便在本章中反复使用。如果你不熟悉 HTML\
  \ 表单的基础知识（包括各种元素类型），请参阅 HTML 相关资源获取更多信息。\n\nHTML 表单使用 `form` 标签和各种输入元素创建。`form`\
  \ 标签如下所示：\n\n```\n<form action=\"script.php\" method=\"post\">\n\n</form>\n```\n\
  \n就 PHP 而言，`form` 标签最重要的属性是 `action`，它决定表单数据将提交到哪个页面。第二个属性 `method` 自有其考量（参见“选择方法”侧边栏），但\
  \ `post` 是你最常用的值。\n\n不同的输入元素——无论是文本框、单选按钮、下拉菜单、复选框等——都放置在开始和结束 `form` 标签之间。正如你在下一节将看到的，表单包含何种输入类型对处理它的\
  \ PHP 脚本影响不大。然而，你应注意给表单输入起的名称，因为它们在 PHP 代码中至关重要。\n\n---\n\n#### 选择方法\n\n表单的 `method`\
  \ 属性决定数据如何发送到处理页面。两个选项 `get` 和 `post` 指的是要使用的 HTTP（超文本传输协议）方法。`GET` 方法将提交的数据作为一系列名称-值对追加到\
  \ URL 后，发送给接收页面。例如：\n\n```\nhttp://www.example.com/script.php?name=Homer&gender=M&age=35\n\
  ```\n\n使用 `GET` 方法的好处是，生成的页面可以在用户的 Web 浏览器中加书签（因为它是一个完整的 URL）。此外，你也可以在浏览器中点击“后退”返回\
  \ `GET` 页面，或重新加载而不会出现问题（这些对 `POST` 均不适用）。但 `GET` 传输的数据量有限制，且安全性较低（因为数据可见）。\n\n\n\
  \n一般来说，`GET` 用于请求信息，例如从数据库获取特定记录或搜索结果（搜索几乎总是使用 `GET`）。当预期会执行某个操作时，则使用 `POST` 方法：例如更新数据库记录或发送电子邮件。基于这些原因，我将在本书中主要使用\
  \ `POST`，特殊情况会另行说明。\n\n---\n\n**脚本 2.1。** 这个简单的 HTML 表单将在本章的多个示例中使用。\n\n---\n\n\
  ```html\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\n        XHTML 1.0 Transitional//EN\"\
