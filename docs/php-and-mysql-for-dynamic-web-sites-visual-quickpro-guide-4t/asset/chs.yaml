  <p><a href=\\\"logout.php\\\">Logout</a></p>\";\n\ninclude ('includes/footer.html');\n\
  ?>\n```\n\n***\n\n#### 访问会话变量\n\n**1.** 在文本编辑器或 IDE 中打开 `loggedin.php`（参考 脚本 12.4）。\n\
