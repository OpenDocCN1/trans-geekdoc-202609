  \n这两个单选按钮 ![Image](img/circle-b.jpg) 具有相同的名称，意味着两者只能二选一。但它们的值不同。\n\n![Image](img/02_figure_02_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 如果多个单选按钮具有相同的 `name` 值，用户只能选择其中一个。\n\n**6.** 添加一个下拉菜单：\n\
