  \n**14.** 检查您的电子邮件，查看成功重置密码后生成的消息。\n\n### 更改密码\n\n`change_password.php` 脚本最初是在第\
  \ 9 章中编写的（当时仅称为 `password.php`），作为 `UPDATE` 查询的一个示例。此处开发的脚本在功能上非常相似，但不同之处在于只有已登录的用户才能访问它。因此，表单只需要接受新密码及其确认（用户现有的密码和电子邮件地址已经通过登录页面确认过了）。\n\
  \n#### 编写 change_password.php\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `change_password.php`（**脚本\
  \ 18.11;\n```\n\n\n\n\n### 修改密码\n\n```php\n$page_title = 'Change Your Password';\n\
  \ninclude ('includes/header.html');\n```\n\n## 2. 如果用户未登录则重定向\n\n```php\nif (!isset($_SESSION['user_id']))\
  \ {\n\n    $url = BASE_URL . 'index.php';\n\n    ob_end_clean();\n\n    header(\"\
  Location: $url\");\n\n    exit();\n\n}\n```\n\n假设此页面仅供已登录用户访问。为强制执行此规则，脚本会检查 `$_SESSION['user_id']`\
  \ 变量是否存在（`UPDATE` 查询需要此变量）。如果该变量未设置，则会重定向用户。\n\n## 3. 检查表单是否已提交并包含 MySQL 连接\n\n\
  ```php\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\n    require (MYSQL);\n}\n\
  ```\n\n理解此脚本执行流程的关键在于记住有三种可能的场景：用户未登录（因此被重定向）、用户已登录并正在查看表单、用户已登录并已提交表单。\n\n只有当用户已登录时，脚本才会执行到此处。否则，用户早就被重定向了。因此脚本只需判断表单是否已提交。\n\
  \n## 4. 验证提交的密码\n\n```php\n$p = FALSE;\n\nif (preg_match ('/^(\\w){4,20}$/', $_POST['password1'])\
  \ ) {\n\n    if ($_POST['password1'] == $_POST['password2']) {\n\n        $p = mysqli_real_escape_string\
  \ ($dbc, $_POST['password1']);\n\n    } else {\n\n        echo '<p class=\"error\"\
  >Your password did not match the confirmed password!</p>';\n\n    }\n\n} else {\n\
  \n    echo '<p class=\"error\">Please enter a valid password!</p>';\n\n}\n```\n\n\
  新密码应使用与注册过程中相同的测试进行验证。如果发现问题，将显示错误消息。\n\n正如注册过程一样，用户的新密码必须通过验证程序；否则，他们将看到错误消息。\n\
  \n## 5. 在数据库中更新密码\n\n```php\nif ($p) {\n\n    $q = \"UPDATE users SET pass=SHA1('$p')\
  \ WHERE user_id={$_SESSION['user_id']} LIMIT 1\";\n\n    $r = mysqli_query ($dbc,\
  \ $q) or trigger_error(\"Query: $q\\n<br />MySQL Error: \" . mysqli_error($dbc));\n\
  }\n```\n\n利用用户的 ID（用户登录时存储在会话中），可以更新数据库中的密码字段。`LIMIT 1` 子句虽非严格必需，但能增加一层保障。\n\n##\
  \ 6. 如果查询成功，完成页面\n\n```php\nif (mysqli_affected_rows($dbc) == 1) {\n\n    echo '<h3>Your\
  \ password has been changed.</h3>';\n\n    mysqli_close($dbc);\n\n    include ('includes/footer.html');\
  \ exit();\n\n}\n```\n\n如果更新成功，会向 Web 浏览器打印一条确认消息。\n\n脚本已成功修改用户的密码。\n\n## 7. 完成条件判断和\
  \ PHP 代码\n\n```php\n} else {\n\n    echo '<p class=\"error\">Your password was not\
  \ changed. Make sure your new password is different than the current password. Contact\
  \ the system administrator if you think an error occurred.</p>';\n\n}\n\n} else\
  \ {\n\n    echo '<p class=\"error\">Please try again.</p>';\n\n}\n\nmysqli_close($dbc);\n\
  \n} // End of the main Submit conditional.\n\n?>\n```\n\n第一个 `else` 子句适用于 `mysqli_affected_rows()`\
  \ 函数未返回 1 的情况。这可能由两个原因导致。一是发生了查询或数据库错误。希望在上线网站上（在你已修复所有 bug 之后）这种情况不太可能发生。第二个原因是用户试图“修改”密码，但再次输入了相同的密码。在这种情况下，`UPDATE`\
  \ 查询不会影响任何行，因为数据库中的密码列不会被更改。此时会打印一条暗示此情况的消息。\n\n---\n\n### 站点管理\n\n对于此应用程序，站点管理的工作方式取决于你希望它实现的功能。管理员可能需要的一个额外页面是\
  \ `view_users.php` 脚本，类似于第 9 章中创建并在第 10 章“常见编程技术”中修改的脚本。它已列在管理员的链接中。你可以使用此类脚本链接到\
  \ `edit_user.php` 页面，允许管理员手动激活账户、将用户指定为管理员或更改某人的密码。管理员也可使用此类页面删除用户。\n\n虽然页脚文件仅在登录用户为管理员时创建指向管理页面的链接，但每个管理页面也应包含此类检查。\n\
  \n---\n\n## 8. 创建 HTML 表单\n\n```html\n<h1>Change Your Password</h1>\n\n<form action=\"\
  change_password.php\" method=\"post\">\n\n    <fieldset>\n\n    <p><b>New Password:</b>\
  \ <input type=\"password\" name=\"password1\" size=\"20\" maxlength=\"20\" /> <small>Use\
  \ only letters, numbers, and the underscore. Must be between 4 and 20 characters\
  \ long.</small></p>\n\n    <p><b>Confirm New Password:</b> <input type=\"password\"\
  \ name=\"password2\" size=\"20\" maxlength=\"20\" /></p>\n\n    </fieldset>\n\n\
  \    <div align=\"center\"><input type=\"submit\" name=\"submit\" value=\"Change\
  \ My Password\"/></div>\n\n</form>\n```\n\n修改密码表单。\n\n此表单接受两个输入：新密码及其确认。同时也给出了正确格式的说明。由于表单非常简单，所以它不是粘性的，但你可以添加该功能。\n\
  \n## 9. 完成 HTML 页面\n\n```php\n<?php include ('includes/footer.html'); ?>\n```\n\n\
  ## 10. 将文件保存为 `change_password.php`，放入 Web 目录，并在 Web 浏览器中测试。\n\n---\n\n> **Tip**\n\
  >\n> 完成此脚本后，用户可以使用前一个脚本重置密码，然后使用临时的随机密码登录。登录后，用户可以使用此页面将密码改回更容易记忆的内容。\n\n---\n\n\
  > **Tip**\n>\n> 由于站点的身份验证不依赖于用户在各页面间的密码（换句话说，登录后后续页面不会检查密码），因此更改密码不会要求用户重新登录。\n\n\
  ---\n\n### 复习与实践\n\n如果你对复习问题或实践提示有任何疑问，请访问本书的支持论坛 ([www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/))。\n\
  \n注：大多数问题和部分提示重述了前几章涵盖的信息，旨在加强一些最重要的知识点。\n\n#### 复习\n\n*   什么是*输出缓冲*？使用它有什么好处？\n\
  *   为什么实时站点上不应显示详细的错误信息？\n*   为什么 *users* 表中的 *active* 列必须允许 `NULL` 值？如果 *active*\
  \ 定义为 `NOT NULL` 会有什么结果？\n*   终止会话的三个步骤是什么？\n*   `session_name()` 函数有什么作用？\n*  \
  \ 真正*加密*数据和创建数据的*哈希*表示之间有什么区别？\n\n#### 实践\n\n*   查阅 PHP 手册中关于输出缓冲（或输出控制）的页面。\n*\
  \   查阅 PHP 手册中关于 `rand()`、`uniqid()` 和 `md5()` 函数的页面。\n*   查阅 PHP 手册中关于 `trigger_error()`\
  \ 函数的页面。\n*   将 `register.php` 中使用的验证技术应用到 `login.php` 中。\n*   使登录表单具有粘性。\n*   向\
  \ *users* 表添加一个 *last_login* `DATETIME` 字段，并在用户登录时更新其值。利用此信息告知用户自上次访问站点以来过了多久。\n\
  \n\n\n\n• 如果您已添加 `last_login` 字段，请使用它在主页上打印一条消息，显示过去一小时或一天内有多少用户登录过。\n\n• 在 `forgot_password.php`\
  \ 中使用 Filter 扩展或正则表达式验证提交的电子邮件地址。\n\n• 查看 PHP 手册中关于 `list()` 函数的页面。\n\n• 按照最后一栏的建议创建\
  \ `view_users.php` 和 `edit_user.php` 脚本。将这些脚本的访问权限限制为管理员（即访问级别为 1 的用户）。\n\n## 19.\
  \ 示例——电子商务\n\n### 本章内容\n\n- 创建数据库 606\n- 管理端 612\n- 创建公共模板 629\n- 产品目录 633\n- 购物车\
  \ 645\n- 记录订单 654\n- 复习与实践 659\n\n在本书的最后一章中，您将开发最后一个 Web 应用程序：一个销售艺术品印刷品的电子商务网站。遗憾的是，编写和解释一个完整的应用程序本身就需要一整本书，而且电子商务的某些方面——比如如何处理资金——因网站而异。考虑到这些限制，本章的重点在于核心电子商务功能：设计数据库、以管理员身份填充目录、向公众展示产品、创建购物车以及在数据库中存储订单。\n\
  \n本示例包含许多已涵盖的概念：将 PHP 与 MySQL 结合使用（当然）、处理文件上传、使用 PHP 向 Web 浏览器发送图像、预处理语句、会话等。本章还介绍了一个新主题：如何从\
  \ PHP 脚本执行 MySQL 事务。在此过程中，您将发现*大量*扩展项目的建议。\n\n#### 创建数据库\n\n本示例中的电子商务网站将使用名为 `ecommerce`\
  \ 的数据库。我将在 MySQL 中创建数据库之前解释每个表的作用。\n\n对于任何类型的电子商务应用程序，都有三种数据需要存储：*产品*信息（销售什么）、*客户*信息（谁在购买）和*订单*信息（购买了什么以及由谁购买）。通过规范化过程（参见第\
  \ 6 章“数据库设计”），我设计了五个表 ![Image](img/circle-a.jpg)。\n\n![Image](img/19_figure_01_a.jpg)\n\
  \n![Image](img/circle-a.jpg) 此实体关系图（ERD）显示了 `ecommerce` 数据库中的五个表如何相互关联。\n\n前两个表存储所有待售产品。如前所述，该网站将销售艺术品印刷品。`artists`\
  \ 表（**表 19.1**）存储其作品正在销售的艺术家的信息。该表仅包含最基本的信息（艺术家的名、中间名和姓），但您可以轻松添加艺术家的生卒日期、其他传记数据等。`prints`\
  \ 表（**表 19.2**）是网站的主要产品表。它存储印刷品名称、价格和其他相关详情。它通过 `artist_id` 与 `artists` 表关联。`prints`\
  \ 表可以说是最重要的，因为它为每个待售产品提供了唯一标识符。这一概念是任何电子商务网站的关键（没有唯一标识符，您如何知道一个人买了什么？）。\n\n**表 19.1.\
  \ artists 表**\n\n![Image](img/19tab01.jpg)\n\n**表 19.2. prints 表**\n\n![Image](img/19tab02.jpg)\n\
  \n`customers` 表（**表 19.3**）的功能正如您所料：它记录每位客户的个人信息。至少包括客户的名、姓、电子邮件地址、密码和送货地址，以及注册日期。推测电子邮件地址和密码的组合将允许用户登录、购物并访问其账户。由于该表将存储的信息显而易见，我暂时仅用三个基本列来定义它。\n\
  \n**表 19.3. customers 表**\n\n![Image](img/19tab03.jpg)\n\n最后两个表存储所有订单信息。有多种方法可以实现这一点，但我选择将一般订单信息——总计、日期和客户\
  \ ID——存储在 `orders` 表（**表 19.4**）中。该表还可以包含单独的列来反映运费、销售税金额、适用的折扣等。`order_contents`\
  \ 表（**表 19.5**）将存储实际售出的商品，包括数量和价格。`order_contents` 表本质上是一个中间表，用于解决 `prints` 和 `orders`\
  \ 之间的多对多关系（每个印刷品可以出现在多个订单中，每个订单可以包含多个印刷品）。\n\n**表 19.4. orders 表**\n\n![Image](img/19tab04.jpg)\n\
  \n**表 19.5. `order_contents` 表**\n\n![Image](img/19tab05.jpg)\n\n为了能够使用*事务*（在最后的脚本中），这两个订单表将使用\
  \ InnoDB 存储引擎。其他表将使用 MyISAM。有关可用存储引擎（即表类型）的更多信息，请参见第 6 章。\n\n#### 创建数据库\n\n**1.**\
  \ 登录 mysql 客户端并创建 `ecommerce` 数据库（如果尚不存在）。\n\n```\nCREATE DATABASE ecommerce;  \n\
  USE ecommerce;\n```\n\n对于这些步骤，您可以使用 mysql 客户端或 phpMyAdmin 等其他工具。视您的情况而定，您可能还需要在此处建立字符集，以定义与数据库应用程序的通信字符集。您也可以在创建数据库时建立默认字符集和编码（同样，请参见第\
  \ 6 章）。\n\n如果您使用的是托管网站，托管公司很可能已经为您提供了数据库。\n\n**2.** 创建 `artists` 表 ![Image](img/circle-b.jpg)：\n\
  \n```\nCREATE TABLE artists (  \n  artist_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\
  \  \n  first_name VARCHAR(20) DEFAULT NULL,  \n  middle_name VARCHAR(20) DEFAULT\
  \ NULL,  \n  last_name VARCHAR(40) NOT NULL,  \n  PRIMARY KEY (artist_id), UNIQUE\
  \ full_name (last_name, first_name, middle_name)  \n) ENGINE=MyISAM;\n```\n\n![Image](img/19_figure_02_b.jpg)\n\
  \n![Image](img/circle-b.jpg) 创建第一个表。\n\n该表仅为每位艺术家存储四项信息。其中，只有 `last_name` 是必需的（定义为\
  \ `NOT NULL`），因为有些艺术家只用一个名字（例如 Christo）。我还添加了索引定义。主键是 `artist_id`，并在姓、名、中间名的组合上建立了一个索引，这可能用于\
  \ `ORDER BY` 子句。该索引更具体地说是一个*唯一*索引，以防止同一艺术家的姓名被重复录入。\n\n**3.** 创建 `prints` 表 ![Image](img/circle-c.jpg)：\n\
  \n```\nCREATE TABLE prints (  \n  print_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\
  \  \n  artist_id INT UNSIGNED NOT NULL,  \n  print_name VARCHAR(60) NOT NULL,  \n\
  \  price DECIMAL(6,2) UNSIGNED NOT NULL,  \n  size VARCHAR(60) DEFAULT NULL,  \n\
  \  description VARCHAR(255) DEFAULT NULL,  \n  image_name VARCHAR(60) NOT NULL,\
  \  \n  PRIMARY KEY (print_id),  \n  INDEX (artist_id), INDEX (print_name),  \n \
  \ INDEX (price)  \n) ENGINE=MyISAM;\n```\n\n![Image](img/19_figure_03_c.jpg)\n\n\
  ![Image](img/circle-c.jpg) 创建第二个表。\n\n\n\n`prints` 表中的所有列都是必需的，除了 `size` 和 `description`\
  \ 字段。`artist_id`、`print_name` 和 `price` 字段上都有索引，每个字段都可能在查询中使用。\n\n每个印刷品将与一张图片关联。图片将存储在服务器上，文件名与\
  \ `print_id` 相同。在 Web 浏览器中显示图片时，将使用其原始名称，因此该名称需要存储在该表中。\n\n您可以向该表添加 `in_stock` 或\
  \ `qty_on_hand` 字段，以指示产品的可用性。\n\n**4.** 创建 `customers` 表 ![Image](img/circle-d.jpg)：\n\
  \n```\nCREATE TABLE customers (\n\ncustomer_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \nemail VARCHAR(60) NOT NULL,\n\npass CHAR(40) NOT NULL,\n\nPRIMARY KEY (customer_id),\n\
  \nUNIQUE (email), INDEX login (email, pass)\n\n) ENGINE=MyISAM;\n```\n\n![Image](img/19_figure_04_d.jpg)\n\
  \n![Image](img/circle-d.jpg) 创建 `customers` 表的基础版本。在真正的电子商务网站中，您需要扩展此表以存储更多信息。\n\
  \n这是用于创建 `customers` 表的代码。您可以加入其他合适的字段（姓名、地址、电话号码、注册日期等）。由于本章不会使用这些值——甚至完全不涉及用户管理——因此将其省略。\n\
  \n**5.** 创建 `orders` 表 ![Image](img/circle-e.jpg)：\n\n```\nCREATE TABLE orders (\n\
  \norder_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\ncustomer_id INT UNSIGNED NOT\
  \ NULL,\n\ntotal DECIMAL(10,2) UNSIGNED NOT NULL,\n\norder_date TIMESTAMP,\n\nPRIMARY\
  \ KEY (order_id),\n\nINDEX (customer_id),\n\nINDEX (order_date)\n\n) ENGINE=InnoDB;\n\
  ```\n\n![Image](img/19_figure_05_e.jpg)\n\n![Image](img/circle-e.jpg) 创建 `orders`\
  \ 表。\n\n`orders` 表的所有字段都是必需的，并创建了三个索引。请注意，此处的外键列（如 `customer_id`）与其对应的主键（`customers`\
  \ 表中的 `customer_id`）类型完全相同。`order_date` 字段将存储订单录入的日期和时间。由于被定义为 `TIMESTAMP`，当插入记录时，它将自动被赋予当前值（因此它不需要正式声明为\
  \ `NOT NULL`）。\n\n最后，因为事务将用于 `orders` 和 `order_contents` 表，所以两者都必须使用 InnoDB 存储引擎。\n\
  \n**6.** 创建 `order_contents` 表 ![Image](img/circle-f.jpg)：\n\n```\nCREATE TABLE\
  \ order_contents (\n\noc_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\norder_id INT\
  \ UNSIGNED NOT NULL,\n\nprint_id INT UNSIGNED NOT NULL,\n\nquantity TINYINT UNSIGNED\
  \ NOT NULL DEFAULT 1,\n\nprice DECIMAL(6,2) UNSIGNED NOT NULL,\n\nship_date DATETIME\
  \ DEFAULT NULL,\n\nPRIMARY KEY (oc_id),\n\nINDEX (order_id),\n\nINDEX (print_id),\n\
  \nINDEX (ship_date)\n\n) ENGINE=InnoDB;\n```\n\n![Image](img/19_figure_06_f.jpg)\n\
  \n![Image](img/circle-f.jpg) 为 `ecommerce` 数据库创建最后一张表。\n\n为了拥有规范化的数据库结构，每个订单被分离为其通用信息——客户、订单日期和总金额——以及其具体信息——实际订购的商品及其数量。该表具有指向\
  \ `orders` 和 `prints` 表的外键。`quantity` 有一个设定的默认值 1。`ship_date` 被定义为 `DATETIME`，以便它可以拥有\
  \ `NULL` 值，表示该商品尚未发货。同样，此表必须使用 InnoDB 存储引擎才能参与事务。\n\n您可能会好奇，为什么此表要存储商品价格，而该信息已存在于\
  \ `prints` 表中。原因很简单：产品价格可能会变动。`prints` 表指示商品的当前价格；`order_contents` 表指示商品的购买价格。\n\
  \n***\n\n提示\n\n根据网站销售的内容，底层数据库将用不同的表来替代 `artists` 和 `prints`。任何电子商务数据库最重要的属性是存在一个“产品”表，该表列出正在销售的单个商品，并为每个商品关联一个产品\
  \ ID。因此，一件大号红色 polo 衫将拥有一个 ID，这与大号蓝色 polo 衫的 ID 不同，后者又与中号蓝色 polo 衫的 ID 不同。如果没有唯一的、单独的产品标识符，将无法跟踪订单和产品数量。\n\
  \n***\n\n***\n\n提示\n\n如果您想为用户存储多个地址——家庭、账单、朋友等——请创建一个单独的地址表。在该表中存储所有这些信息，包括地址类型，并使用客户\
  \ ID 作为主外键将这些记录关联回 `customers` 表。\n\n***\n\n***\n\n### 安全性\n\n就电子商务网站而言，有四大安全考量。第一是数据如何存储在服务器上。您需要保护\
  \ MySQL 数据库本身（通过设置适当的访问权限）以及存储会话信息的目录（有关可更改的设置，请参见第 12 章“Cookie 和会话”）。就这些问题而言，使用非共享主机托管肯定能提高您网站的安全性。\n\
  \n第二个安全考量涉及保护对敏感信息的访问。网站的管理端（具有查看订单和客户记录的能力）必须得到最高级别的保护。这意味着要求进行身份验证才能访问，限制知晓访问信息的人员，使用安全连接，等等。\n\
  \n第三个因素是保护传输过程中的数据。当客户进入结账流程（涉及信用卡和送货信息）时，*必须*使用安全交易。为此需要在服务器上建立带有有效证书的安全套接字层 (SSL)，然后切换到\
  \ `https://` URL。还要注意通过电子邮件发送的信息，因为这些消息通常不通过安全途径传输。\n\n第四个问题涉及支付信息的处理。您**真的、真的、真的、真的（真的！）**不希望以任何方式保留这些信息。理想情况下，让第三方资源处理支付，使您的网站名正言顺地“两袖清风”。我在本章末尾的一个名为“结账流程”的侧边栏中对此进行了一些讨论。\n\
  \n这个广泛的电子商务主题，包含大量具体细节和大量真实代码，在我的著作 *Effortless E-Commerce with PHP and MySQL*（New\
  \ Riders, 2011）中得到了详尽阐述。\n\n***\n\n### 管理端\n\n电子商务应用的管理端主要用于管理三大核心组件：\n\n• 产品（待售商品）\n\
  \n• 客户\n\n• 订单\n\n在本章中，您将创建两个脚本用于向目录添加产品。由于待售产品是艺术品，一个脚本将用于填充 `artists` 表，第二个脚本将用于填充\
  \ `prints` 表（该表具有指向 `artists` 的外键）。\n\n受篇幅限制，且由于没有支付系统，这无论如何都不是一个完整的电子商务示例，因此本章无法详述客户和订单方面的内容。然而，客户管理与用户管理相同，已在上一章中介绍，您将看到许多关于订单管理的建议。\n\
  \n\n\n本章中的前两个脚本——实际上几乎所有脚本——都需要连接到 MySQL 数据库。无需从头编写新脚本，只需将 第 9 章 “将 PHP 与 MySQL\
  \ 结合使用” 中的 `mysqli_connect.php`（脚本 9.2）复制到该站点文件的相应目录中。然后编辑其中的信息，使其连接到名为 `ecommerce`\
  \ 的数据库，并使用拥有适当权限的用户名/密码/主机名组合。\n\n此外，这两个管理脚本将使用*预处理语句*，该技术在 第 13 章 “安全方法” 中已介绍，旨在让您积累更多使用经验。如果您对预处理语句的语法或函数感到困惑，请回顾该章。\n\
