  \n• 创建新 `DateTime` 对象的语法是什么？设置对象日期和/或时间的两种方式是什么？\n\n• 什么是*异常*？\n\n#### 实践\n\n• 当你有兴趣深入了解面向对象编程（OOP）时，不妨阅读一本关于\
  \ OOP 通用主题的书籍或教程，而不局限于某门特定编程语言。\n\n• 查阅 PHP 手册中关于 PHP 面向对象编程的文档 ([www.php.net/oop](http://www.php.net/oop))。\n\
  \n• 如果你不清楚为何需要对查询中使用的字符串数据应用 `real_escape_string()`，请重温 第 9 章。\n\n• 使用 `MySQLi`\
  \ 重写 第 9 章 “将 PHP 与 MySQL 结合使用” 和 第 10 章 “常见编程技巧” 中的其他脚本。\n\n• 阅读 PHP 手册中 `DateTime`\
  \ 类的完整文档 ([www.php.net/datetime](http://www.php.net/datetime))。\n\n• 学习 PHP 手册中的\
  \ `strtotime()` 函数 ([www.php.net/strtotime](http://www.php.net/strtotime))。\n\n\n\
  \n• 如果你想挑战高难度，可以应用上一章介绍的信息，结合 jQuery UI `Datepicker` 工具，为 `datetime.php` 脚本创建两个漂亮的\
  \ JavaScript 日期选择器。\n\n## 17. 示例——留言板\n\n### 本章内容\n\n- 创建数据库 520\n- 创建首页 537\n-\
  \ 创建论坛页面 538\n- 创建主题页面 543\n- 发布消息 548\n- 复习与实践 558\n\n留言板（又称论坛）的功能其实非常简单：帖子要么发起新话题，要么回复现有话题；帖子被添加到数据库，然后在页面上显示。基本就这些。当然，有时实现简单的概念可能相当困难！\n\
  \n为了让这个示例更精彩、更实用，它不仅仅是一个留言板，而是一个*多语言*留言板。每种语言将拥有自己的论坛，关键元素——导航、提示、介绍性文本等——将针对特定语言。\n\
  \n为了专注于这个 Web 应用程序最重要的方面，本章省略了其他一些方面。三个明显的遗漏将是：用户管理、错误处理和管理功能。这对你来说不应该是个问题，因为下一章将详细介绍用户管理和错误处理。至于管理功能，你会在本章末尾找到一些建议。\n\
  \n#### 创建数据库\n\n第一步，自然是创建数据库。一个示例留言板数据库 ![Image](img/circle-a.jpg) 在 第 6 章 “数据库设计”\
  \ 中开发。虽然那个数据库完全没问题，但这里将使用其一个变体 ![Image](img/circle-b.jpg)。我将对比这两者，以更好地解释这些变更。\n\n\
  ![Image](img/17_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg) 在 第 6 章 中开发的 *forum*\
  \ 数据库模型。\n\n![Image](img/17_figure_02_b.jpg)\n\n![Image](img/circle-b.jpg) 本章将使用的论坛数据库修订模型。\n\
  \n首先，`forums` 表被 `languages` 表取代。两者服务于相同目的：允许多个论坛。在这个新数据库中，主题——*PHP 和 MySQL 动态网站开发*——在每个论坛中将保持相同，但每个论坛将使用不同的语言。各论坛中的帖子将有所不同（这不会是同一个论坛的多语言翻译版本）。`languages`\
  \ 表以该语言自己的字母表和英语存储语言名称，以便管理员识别（这当然假设英语是管理员的主要语言）。\n\n新数据库中的 `threads` 表的作用类似于旧数据库中的\
  \ `messages` 表，但有一个主要区别。正如旧 `messages` 表关联 `forums` 一样，`threads` 关联 `languages`\
  \ 和 `users` 表（每条消息只能属于一个论坛且由一个用户发布；每个论坛可以有多条消息，每个用户可以发布多条消息）。然而，这个 `threads` 表将只存储主题，而不存储消息正文。这样更改有几个原因。首先，让主题随每条回复重复多次是不必要的（根据我的经验，回复几乎总是拥有相同的主题）。其次，`lang_id`\
  \ 关联也是如此（只要每条回复关联单个主题，就不需要在每条回复中存储它）。第三，我将改变在数据库中指示主题层级的方式（你将在下一段看到具体做法），更改表结构有助于实现这一点。最后，每当用户查看论坛中的帖子时都会用到\
  \ `threads` 表。从该表中移除消息正文将提高这些查询的性能。\n\n再说 `posts` 表，其唯一目的是存储与主题关联的消息正文。在 第 6 章 的数据库中，`messages`\
  \ 表有一个 `parent_id` 列，用于指示新消息是对哪条消息的回复。它是分层的：消息 3 可能是起始帖；消息 18 可能是对 3 的回复，消息 20 是对\
  \ 18 的回复，以此类推 ![Image](img/circle-c.jpg)。那个版本的数据库更直接地指示了回复关系；这个版本将只存储消息所属的主题：消息\
  \ 18 和 20 都使用 `thread_id` 为 3。这种改动将使显示主题的效率大大提高（就所需的 PHP 和 MySQL 而言），并且可以使用每条消息的发布日期/时间对它们进行排序。\n\
  \n![Image](img/17_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg) 旧数据库模式中如何指示消息间的关系。\n\
  \n这三个表提供了论坛的核心功能。数据库还需要一个 `users` 表。在这个版本的论坛中，只有注册用户才能发布消息，我认为这是一个非常、非常、非常好的策略（它能大幅减少垃圾信息和黑客攻击尝试）。注册用户还可以将其默认语言（来自\
  \ `languages` 表）和时区连同账户信息一起记录，以提供更个性化的体验。将使用用户名和密码的组合来登录。\n\n最后一个表 `words` 是实现网站多语言所必需的。该表将存储常用元素的翻译：导航链接、表单提示、标题等。网站中的每种语言将在该表中拥有一条记录。这将是一个很好用且令人惊讶地简单的功能。可以争辩说，此表中列出的词汇也可以放在\
  \ `languages` 表中，但那将暗示这些词汇也与 `threads` 表相关，而实际上并非如此。\n\n这就是新数据库设计背后的思路。在接下来的步骤创建表的过程中，你将了解更多细节。与本书中的其他示例一样，你也可以从本书对应的网站（**[www.LarryUllman.com](http://www.LarryUllman.com)**）下载本章所需的\
  \ SQL——这些步骤建议的命令，外加更多内容。\n\n#### 创建数据库步骤\n\n**1.** 访问你的 MySQL 服务器并设置用于通信的字符集 ![Image](img/circle-d.jpg)：\n\
  \n```\nCHARSET utf8;\n```\n\n![Image](img/17_figure_04_d.jpg)\n\n![Image](img/circle-d.jpg)\
  \ 为了在查询中使用 Unicode 数据，你需要更改与 MySQL 通信时使用的字符集。\n\n图中我将使用 mysql 客户端，但你可以使用任何你喜欢的界面。不过第一步必须是将字符集更改为\
  \ UTF-8，以便进行后续查询。如果不这样做，查询中的某些字符将在数据库中以乱码形式存储（参见侧边栏“奇怪字符”）。注意，如果你使用 phpMyAdmin，需要在其配置文件中设置字符集。\n\
  \n---\n\n**奇怪字符**\n\n如果在实现本章示例时，你看到奇怪的字符——方框、数字代码或问号，而不是实际的语言字符——可能有几个原因。发生这种情况时，根本问题是*编码不匹配*（或用数据库术语说是*字符集不匹配*）。\n\
  \n\n\n\n计算机显示字符的能力取决于文件的编码以及操作系统支持的字符（即字体）。这意味着每个 PHP 或 HTML 页面都必须使用正确的编码。其次，MySQL\
  \ 数据库必须使用正确的编码（如创建数据库的步骤所示）。第三，这可能是常见的问题原因，PHP 和 MySQL 之间的通信也必须使用正确的编码。我在 **`mysqli_connect.php`**\
  \ 脚本中解决了这个问题（请参阅第一条提示）。最后，如果您使用 mysql 客户端、phpMyAdmin 或其他工具填充数据库，该交互也必须使用正确的编码。\n\
  \n---\n\n### 2. 创建新数据库\n\n```sql\nCREATE DATABASE forum2 CHARACTER SET utf8;\nUSE\
  \ forum2;\n```\n\n创建并选择本示例的数据库。此数据库使用 UTF-8 字符集，以便支持多种语言。\n\n为避免与原始 *forum* 数据库（来自第\
  \ 6 章）中创建的表混淆，将创建一个新数据库。\n\n如果您使用的是托管站点且无法创建自己的数据库，请使用为您提供的数据库并选择它。如果您现有的数据库具有同名的表——*words*、*languages*、*threads*、*users*\
  \ 和 *posts*，请重命名这些表（现有的或新的），并相应地更改本章其余部分的代码。\n\n无论您是从头创建此数据库还是使用新数据库，表都必须使用 UTF-8\
  \ 编码，以便能够支持多种语言（详见第 6 章）。如果您使用的是现有数据库，且不想通过更改所有表的字符集而潜在引发问题，只需将 **`CHARACTER SET\
  \ utf8`** 子句添加到每个表定义中（步骤 3 至 7）。\n\n### 3. 创建 *languages* 表\n\n```sql\nCREATE TABLE\
  \ languages (\n    lang_id TINYINT UNSIGNED NOT NULL AUTO_INCREMENT,\n    lang VARCHAR(60)\
  \ NOT NULL,\n    lang_eng VARCHAR(20) NOT NULL,\n    PRIMARY KEY (lang_id),\n  \
  \  UNIQUE (lang)\n);\n```\n\n创建 *languages* 表。\n\n这是最简单的表。不会有太多语言，因此主键（`lang_id`）可以是\
  \ **`TINYINT`**。`lang` 列定义得稍大一些，因为它将存储其他语言的字符，这可能需要更多空间。此列也必须是唯一的。请注意，我没有将此列命名为\
  \ “language”，因为这是 MySQL 中的保留关键字（实际上，我*仍然*可以这样命名，您将在第 7 步中看到需要做什么）。`lang_eng` 列是语言的英文对应词，以便管理员轻松查看是哪种语言。\n\
  \n### 4. 创建 *threads* 表\n\n```sql\nCREATE TABLE threads (\n    thread_id INT UNSIGNED\
  \ NOT NULL AUTO_INCREMENT,\n    lang_id TINYINT(3) UNSIGNED NOT NULL,\n    user_id\
  \ INT UNSIGNED NOT NULL,\n    subject VARCHAR(150) NOT NULL,\n    PRIMARY KEY (thread_id),\n\
  \    INDEX (lang_id),\n    INDEX (user_id)\n);\n```\n\n创建 *threads* 表。此表存储主题并将其与一种语言（即一个论坛）关联。\n\
  \n`threads` 表包含四列，并通过 `lang_id` 和 `user_id` 外键分别关联 `languages` 和 `users` 表。`subject`\
  \ 此处需要足够长，以存储多种语言的主题（非西方语言的字符占用更多字节）。\n\n将在连接和 **`WHERE`** 子句中使用的列——`lang_id` 和\
  \ `user_id`——建立了索引，`thread_id` 作为主键也会被索引。\n\n### 5. 创建 *posts* 表\n\n```sql\nCREATE\
  \ TABLE posts (\n    post_id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n    thread_id\
  \ INT UNSIGNED NOT NULL,\n    user_id INT UNSIGNED NOT NULL,\n    message TEXT NOT\
  \ NULL,\n    posted_on DATETIME NOT NULL,\n    PRIMARY KEY (post_id),\n    INDEX\
  \ (thread_id),\n    INDEX (user_id)\n);\n```\n\n创建 *posts* 表，它同时关联 threads 和 users。\n\
  \n此表的主要列是 `message`，用于存储每条帖子的正文。两列是外键，关联 `threads` 和 `users` 表。`posted_on` 列的类型为\
  \ **`DATETIME`**，但将使用 UTC（协调世界时，详见第 6 章）。此处无需为其做特殊处理。\n\n### 6. 创建 *users* 表\n\n\
  ```sql\nCREATE TABLE users (\n    user_id MEDIUMINT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \    lang_id TINYINT UNSIGNED NOT NULL,\n    time_zone VARCHAR(30) NOT NULL,\n \
  \   username VARCHAR(30) NOT NULL,\n    pass CHAR(40) NOT NULL,\n    email VARCHAR(60)\
  \ NOT NULL,\n    PRIMARY KEY (user_id),\n    UNIQUE (username),\n    UNIQUE (email),\n\
  \    INDEX login (username, pass)\n);\n```\n\n创建 *users* 表的简化版本。\n\n为简洁起见，我省略了通常会放在此表中的其他列，如注册日期、名和姓。有关创建和使用此类表的更多信息，请参阅下一章。\n\
  \n在我的设想中，用户注册时会选择其首选语言和时区，以获得更个性化的体验。他们也可以拥有一个用户名，该用户名将显示在帖子中（而不是他们的电子邮件地址）。用户名和电子邮件地址都必须唯一，这是您在注册过程中需要处理的事项。\n\
  \n### 7. 创建 *words* 表\n\n```sql\nCREATE TABLE words (\n    word_id TINYINT UNSIGNED\
  \ NOT NULL AUTO_INCREMENT,\n    lang_id TINYINT UNSIGNED NOT NULL,\n    title VARCHAR(80)\
  \ NOT NULL,\n    intro TINYTEXT NOT NULL,\n    home VARCHAR(30) NOT NULL,\n    forum_home\
  \ VARCHAR(40) NOT NULL,\n    `language` VARCHAR(40) NOT NULL,\n    register VARCHAR(30)\
  \ NOT NULL,\n    login VARCHAR(30) NOT NULL,\n    logout VARCHAR(30) NOT NULL,\n\
  \    new_thread VARCHAR(40) NOT NULL,\n    subject VARCHAR(30) NOT NULL,\n    body\
  \ VARCHAR(30) NOT NULL,\n    submit VARCHAR(30) NOT NULL,\n    posted_on VARCHAR(30)\
  \ NOT NULL,\n    posted_by VARCHAR(30) NOT NULL,\n    replies VARCHAR(30) NOT NULL,\n\
  \    latest_reply VARCHAR(40) NOT NULL,\n    post_a_reply VARCHAR(40) NOT NULL,\n\
  \    PRIMARY KEY (word_id),\n    UNIQUE (lang_id)\n);\n```\n\n创建 *words* 表，它存储不同语言中关键词的表示形式。\n\
  \n此表将存储站点上使用的常见元素的不同翻译。某些元素——`home`、`forum_home`、`language`、`register`、`login`、`logout`\
  \ 和 `new_thread`——将作为链接名称。其他元素——`subject`、`body`、`submit`——用于发布消息的页面。另一类元素用于论坛主页：`posted_on`、`posted_by`、`replies`\
  \ 和 `latest_reply`。\n\n其中一些将在站点中多次使用，但这仍然是一个不完整的列表。当您自己实现站点时，会看到其他可以添加词汇定义的地方。\n\
  \n除 `intro` 为用于主页的正文文本外，每列均为 **`VARCHAR`** 类型。大多数列的长度限制为 30，以容纳其他语言中需要更多字节的字符，少数列可能需要更大。\n\
  \n\n\n对于每一列，其名称暗示了要存储在该列中的值。其中一列——`language`——我使用了一个 MySQL 关键字，仅仅是为了演示如何操作。解决方法是用反引号将列名括起来，这样\
  \ MySQL 就不会将该列名与关键字“language”混淆。\n\n**8.** 填充 `languages` 表：\n\n```sql\nINSERT INTO\
  \ languages (lang, lang_eng) VALUES\n('English', 'English'),\n('Português', 'Portuguese'),\n\
  ('Français', 'French'),\n('Norsk', 'Norwegian'),\n('Romanian', 'Romanian'),\n('![Image](img/greek.jpg)',\
  \ 'Greek'),\n('Deutsch', 'German'),\n('Srpski', 'Serbian'),\n('![Image](img/japanese.jpg)',\
  \ 'Japanese'),\n('Nederlands', 'Dutch');\n```\n\n这只是该站点将要支持的语言中的一小部分，得益于一些协助（参见侧边栏“关于翻译的说明”）。对于每一种语言，都存储了该语言的原文名称和英文名称\
  \ ![Image](img/circle-k.jpg)。\n\n![Image](img/17_figure_11_k.jpg)\n\n![Image](img/circle-k.jpg)已填充数据的\
  \ `languages` 表，每种语言均用其自己的字母书写。\n\n**9.** 填充 `users` 表 ![Image](img/circle-l.jpg)：\n\
  \n```sql\nINSERT INTO users (lang_id, time_zone, username, pass, email) VALUES\n\
  (1, 'America/New_York', 'troutster', SHA1('password'), 'email@example.com'),\n(7,\
  \ 'Europe/Berlin', 'Ute', SHA1('pa24word'), 'email1@example.com'),\n(4, 'Europe/Oslo',\
  \ 'Silje', SHA1('2kll13'), 'email2@example.com'),\n(2, 'America/Sao_Paulo', 'João',\
  \ SHA1('fJDLN34'), 'email3@example.com'),\n(1, 'Pacific/Auckland', 'kiwi', SHA1('conchord'),\
  \ 'kiwi@example.org');\n```\n\n![Image](img/17_figure_12_l.jpg)\n\n![Image](img/circle-l.jpg)手动添加了几个用户，因为本站点没有注册流程（但请参见第\
  \ 18 章“示例——用户注册”以了解相关内容）。\n\n由于 PHP 脚本将显示与帖子关联的用户，因此需要几个用户。每个用户都关联一种语言和一个时区（有关 MySQL\
  \ 中时区的更多信息，请参见第 6 章）。每个用户的密码将使用 `SHA1()` 函数进行加密。\n\n**10.** 填充 `words` 表：\n\n```sql\n\
  INSERT INTO words VALUES\n(NULL, 1, 'PHP and MySQL for Dynamic Web Sites: The Forum!',\
  \ '<p>Welcome to our site.... please use the links above... blah, blah, blah.</p>\\\
  r\\n <p>Welcome to our site....please use the links above...blah, blah, blah.</p>',\
  \ 'Home', 'Forum Home', 'Language', 'Register', 'Login', 'Logout', 'New Thread',\
  \ 'Subject', 'Body', 'Submit', 'Posted on', 'Posted by', 'Replies', 'Latest Reply',\
  \ 'Post a Reply');\n```\n\n这些是与英文中每个术语关联的单词。该记录的 `lang_id` 为 1，与 `languages` 表中英文对应的\
  \ `lang_id` 匹配。用于将其他语言的单词插入此表的 SQL 可从本书的配套网站获取。\n\n***\n\n提示\n\n本章不讲解创建 `mysqli_connect.php`\
  \ 页面的步骤，该页面用于连接数据库。相反，只需复制第 9 章“将 PHP 与 MySQL 结合使用”中的那个文件。然后更改脚本中的参数，以使用有效的用户名/密码/主机名组合来连接\
  \ `forum2` 数据库。\n\n***\n\n提示\n\n提醒一下，一张表中的外键应该与另一张表中匹配的主键具有完全相同的类型和大小。\n\n***\n\n\
  ### 关于翻译的说明\n\n世界各地的几位读者慷慨地为我提供了关键词、名称、消息主题和消息正文的翻译。对于他们的帮助，我要致以最诚挚的谢意（排名不分先后）：Angelo（葡萄牙语）；Iris（德语）；Johan（挪威语）；Gabi（罗马尼亚语）；Darko（塞尔维亚语）；Emmanuel\
  \ 和 Jean-François（法语）；Andreas 和 Simeon（希腊语）；Darius（菲律宾语/他加禄语）；Olaf（荷兰语）；以及 Tsutomu（日语）。\n\
  \n如果您懂其中一种语言，可能会发现本文或相应图片中存在语言错误。如果是这样，那几乎可以肯定是我的错，因为我未能准确传达我需要翻译的单词，或将回复错误地录入了数据库。对于任何此类错误，我提前致歉，但希望您能更多地关注数据库、代码和功能。再次感谢那些提供帮助的人！\n\
  \n***\n\n### 编写模板\n\n本示例与其他包含大量页面的站点一样，将利用模板将展示层的大部分内容与逻辑分离开来。遵循第 3 章“创建动态网站”中规定的说明，页眉文件和页脚文件将存储大部分\
  \ HTML 代码。然后每个 PHP 脚本将包含这些文件以生成完整的 HTML 页面 ![Image](img/circle-a.jpg)。但本示例稍微复杂一些。\n\
  \n![Image](img/17_figure_13_a.jpg)\n\n![Image](img/circle-a.jpg)站点的基本布局和外观。\n\n\
  本站点的目标之一是为使用多种不同语言的用户提供服务。实现这一点不仅涉及让他们用母语*发布消息*，还要确保他们能用母语使用*整个网站*。这意味着页面标题、导航链接、标题、提示，甚至菜单都需要以他们的语言显示\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/17_figure_14_b.jpg)\n\n![Image](img/circle-b.jpg)以法语查看的主页（与\
  \ ![Image](img/graycircle-a.jpg) 对比）。\n\n创建数据库的说明展示了如何实现这一点：通过在一张表中存储所有关键词的翻译。因此，页眉文件需要提取所有这些关键词，以便在需要时使用。其次，该页眉文件还将根据用户是否已登录显示不同的链接。还有一个小变化：如果用户位于论坛页面，正在查看某语言下的所有主题，则还将为用户提供发布新主题的选项\
  \ ![Image](img/circle-c.jpg)。\n\n![Image](img/17_figure_15_c.jpg)\n\n![Image](img/circle-c.jpg)与\
  \ ![Image](img/graycircle-a.jpg) 相同的主页，但增加了一个允许用户发起新主题的链接。\n\n模板本身使用 CSS 进行一些格式设置（实际上没多少内容）。您可以从本书的配套网站（**[www.LarryUllman.com](http://www.LarryUllman.com)**）下载所有这些文件。\n\
  \n### 创建模板\n\n**1.** 在文本编辑器或 IDE 中新建一个文档，命名为 `header.html`（**脚本 17.1**）：\n\n```php\n\
  <?php # Script 17.1 - header.html\n\nheader ('Content-Type: text/html; charset=UTF-8');\n\
  ```\n\n由于该脚本需要进行相当数量的数据验证和检索，因此它以一个 PHP 代码块开始。该脚本还通过 `header()` 函数向 Web 浏览器指明其编码——UTF-8。通过\
  \ `header()` 函数调用设置编码的想法在第 11 章“Web 应用程序开发”的一个提示中提到过。\n\n**2.** 启动会话：\n\n```php\n\
  $_SESSION['user_id'] = 1;\n$_SESSION['user_tz'] = 'America/New_York';\n// $_SESSION\
  \ = array();\n```\n\n为了在用户登录后跟踪用户，站点将使用会话。由于本章中站点没有注册和登录功能，两行代码即可虚拟地让用户登录。通常，这两个值都来自数据库，但为了测试目的，它们在此处被设置。要虚拟地让用户登出，请取消第三行的注释。\n\
  \n**3.** 包含数据库连接：\n\n```php\nrequire ('../mysqli_connect.php');\n```\n\n与本书中的许多其他示例一样，这里假设\
  \ `mysqli_connect.php` 脚本存储在当前目录的上一级目录中，位于 Web 根目录之外。如果您的情况并非如此，请相应地更改此代码。\n\n\n\
  \n\n### 脚本 17.1. `header.html` 文件\n\n`header.html` 文件启动模板。它还设置页面的编码，启动会话，并从数据库中检索特定语言的关键词。\n\
  \n---\n\n```php\n<?php # 脚本 17.1 - header.html  \n/* 此脚本...  \n * - 启动 HTML 模板。\
  \  \n * - 使用 header() 指定编码。  \n * - 启动会话。  \n * - 从数据库获取特定语言的词汇  \n * - 列出可用语言。\
  \  \n */\n\n// 指定编码：\nheader ('Content-Type: text/html;  \n    charset=UTF-8');\n\
  \n// 启动会话：\nsession_start();\n\n// 仅供测试目的：\n$_SESSION['user_id'] = 1;\n$_SESSION['user_tz']\
