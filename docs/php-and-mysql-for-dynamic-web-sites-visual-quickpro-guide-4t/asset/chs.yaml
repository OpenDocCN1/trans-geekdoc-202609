  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n如今的\
  \ Web 用户期望看到精彩的页面，这些页面经常更新并提供定制化的体验。对他们而言，Web 站点更像是*社区*，他们会一次又一次地回访。同时，Web 站点管理员希望站点更易于更新和维护，因为他们明白这是跟上访问者期望的唯一合理途径。基于这些原因及其他原因，PHP\
  \ 和 MySQL 已成为创建动态、数据库驱动型 Web 站点的事实标准。\n\n本书汇集了我多年的 Web 开发经验，并结合了我撰写的几本关于本书所讨论技术的前作的精华。本书的重点是以最高效的方式涵盖最重要的知识。它将教你如何开始开发动态\
  \ Web 站点，并提供大量示例代码帮助你入门。你只需提供一颗渴望学习的心。\n\n当然，还得有一台电脑。\n\n### 什么是动态 Web 站点？\n\n动态\
  \ Web 站点是灵活且强大的，更准确地说应将其描述为*应用程序*，而不仅仅是站点。动态 Web 站点\n\n- 响应不同的参数（例如，一天中的时间或访问者 Web\
  \ 浏览器的版本）\n- 拥有“记忆”，允许用户注册和登录、电子商务及类似流程\n- 几乎总是集成 HTML 表单，允许访问者执行搜索、提供反馈等\n- 通常具有供管理员管理站点内容的界面\n\
  - 比静态制作的站点更易于维护、升级和扩展\n\n有许多技术可用于创建动态 Web 站点。最常见的是 ASP.NET（Active Server Pages，微软的构架）、JSP（Java\
  \ Server Pages）、ColdFusion、Ruby on Rails（Ruby 编程语言的 Web 开发框架）和 PHP。动态 Web 站点并不总是依赖数据库，但越来越多的站点开始依赖数据库，特别是当像\
  \ MySQL 这样优秀的数据库应用程序几乎零成本可用时。\n\n#### 什么是 PHP？\n\nPHP 最初代表“Personal Home Page”（个人主页），因为它是由\
  \ Rasmus Lerdorf 于 1994 年创建的，用于追踪访问其在线简历的访问者。随着其实用性和功能的增强（以及它开始被用于更专业的场合），其含义演变为“PHP:\
  \ Hypertext Preprocessor”（PHP：超文本预处理器）。\n\n根据官方 PHP 网站 **[www.php.net](http://www.php.net)**\
  \ 的说法，PHP 是一种“广泛使用的通用脚本语言，特别适合 Web 开发，并可嵌入 HTML 中。”这是一个冗长但描述准确的定义，我将为你解释其含义。\n\n\
  ![Image](img/00_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg) PHP 的主页。\n\n\n\n\n\
  从该声明的末尾开始说，PHP `可以嵌入 HTML` 意味着你可以获取一个标准的 HTML 页面，在需要的地方插入一些 PHP，最终得到一个动态结果。这一特性使得\
  \ PHP 对任何做过哪怕一点点 HTML 工作的人都非常容易上手。\n\n此外，PHP 是一种 `脚本` 语言，相对于 `编译型` 语言：PHP 旨在编写 Web\
  \ 脚本，而非独立应用程序（尽管现在付出一些额外努力，你也可以用 PHP 创建应用程序）。PHP 脚本仅在事件发生后运行——例如，当用户提交表单或访问一个 URL（统一资源定位符，Web\
  \ 地址的技术术语）时。\n\n我应该补充说明，PHP 是一种服务端的、跨平台的技术，这两个描述都很重要。`服务端` 指的是 PHP 所做的一切都发生在服务器上。需要一个\
  \ Web 服务器应用程序，如 Apache 或微软的 IIS（Internet Information Services，互联网信息服务），并且所有 PHP\
  \ 脚本都必须通过 URL（`http://`*某物*）来访问。其跨平台的本质意味着 PHP 可在大多数操作系统上运行，包括 Windows、Unix（及其众多变体）和\
  \ Macintosh。更重要的是，在一台服务器上编写的 PHP 脚本通常无需修改或仅需少量修改即可在另一台服务器上运行。\n\n***\n\n### PHP\
  \ 6 发生了什么？\n\n当我撰写本书的上一版 *PHP 6 and MySQL 5 for Dynamic Web Sites: Visual QuickPro\
  \ Guide* 时，PHP 的下一个主要版本——PHP 6——大约完成了 50%。考虑到 PHP 6 会在书出版后某个时候发布，我在该版的部分内容中依赖了一个\
  \ PHP 6 的测试版。然后……PHP 6 夭折了。\n\nPHP 6 计划的关键特性之一是支持 Unicode，这意味着 PHP 6 能够原生地处理任何语言。这将是对一个已广受欢迎的编程工具的极佳补充。不幸的是，实现\
  \ Unicode 支持从复杂变得非常困难，语言背后的开发者们搁置了 PHP 6 的开发。然而，并非一无所获：PHP 6 计划中的其他一些特性，例如对 `命名空间`（一种面向对象编程概念）的支持，被加入到了\
  \ PHP 5.3 中。\n\n在撰写本书时，尚不清楚 Unicode 支持何时能完成，也不清楚 PHP 6 会如何发展。我的直觉是，PHP 将在版本 5 的主干上进行一段时间的增量开发。\n\
  \n***\n\n在本书撰写时，PHP 处于 5.3.6 版本，本书假设你使用的是至少 5.0 版本。书中涵盖的一些函数和特性将需要更具体或更新的版本，如 PHP\
  \ 5.2 或更高版本。在这些情况下，我会明确说明该功能是在哪个 PHP 版本中添加的，并为使用稍旧版本语言的读者提供替代方案。\n\n如果你仍在使用 PHP\
  \ 4 版本，你真的应该升级。如果这不在你的计划中，请改阅读本书的第二版。\n\n关于 PHP 的更多信息，始终可以在 PHP.net 或 Zend（[www.zend.com](http://www.zend.com)）——PHP\
  \ 核心背后的智囊团——找到。\n\n### 为什么使用 PHP？\n\n简单来说，在开发动态 Web 网站方面，PHP 比其他替代方案更好、更快、更容易学习。使用\
  \ PHP 你将获得卓越的性能、与几乎所有可用数据库的紧密集成、稳定性、可移植性，以及因其可扩展性而带来的近乎无限的功能集。所有这些都无需成本（PHP 是开源的），且拥有非常平缓的学习曲线。PHP\
  \ 是我见过的最完美的结合之一，它既让初学者能轻松上手，又能让高级程序员做他们需要的一切。\n\n最后，事实胜于雄辩：自诞生以来，PHP 的使用量呈指数级增长，是超过\
  \ 76% 所有网站的首选服务端技术 ![Image](img/circle-b.jpg)。就所有编程语言而言，PHP 是第五大最流行的语言 ![Image](img/circle-c.jpg)。\n\
  \n![Image](img/00_figure_02_b.jpg)\n\n![Image](img/circle-b.jpg)Web Technology Surveys\
  \ 网站提供了这张关于服务端技术的图表（[www.w3techs.com/technologies/overview/programming_language/all](http://www.w3techs.com/technologies/overview/programming_language/all)）。\n\
  \n![Image](img/00_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg)Tiobe 指数（[`www.tiobe.com/index.php/content/paperinfo/tpci/index.html`](http://www.tiobe.com/index.php/content/paperinfo/tpci/index.html)）使用多种因素组合对编程语言的流行度进行排名。\n\
  \n当然，你可能会认为，作为一本 PHP 书的作者（实际上是好几本），我的观点有偏见。虽然程度远不如 PHP 深，但我也曾使用 Java Server Pages\
  \ (JSP)、Ruby on Rails (RoR) 和 ASP.NET 开发过网站。各有优劣，但 PHP 是我始终会回归的技术。你可能会听说它的性能或扩展性不如其他技术，但\
  \ Yahoo!、Wikipedia 和 Facebook 都在使用 PHP，你找不到比这些访问量更大、要求更高的网站了。\n\n你可能也会想知道 PHP 有多安全。但\
  \ `安全性不在于语言本身`；而在于如何使用该语言。请放心，本书提供了关于所有相关安全问题的完整且最新的讨论。\n\n### PHP 如何工作\n\n如前所述，PHP\
  \ 是一种服务端语言。这意味着你编写的 PHP 代码位于一台称为 `服务器` 的主机计算机上。服务器将网页发送给请求的访问者（即你，客户端，使用你的 Web 浏览器）。\n\
  \n当访问者访问一个用 PHP 编写的网站时，服务器读取 PHP 代码，然后根据其脚本指令进行处理。在 ![Image](img/circle-d.jpg) 所示的示例中，PHP\
  \ 代码指示服务器将适当的数据——HTML 代码——发送给 Web 浏览器，浏览器将接收到的代码视为标准的 HTML 页面处理。\n\n![Image](img/00_figure_04_d.jpg)\n\
  \n![Image](img/circle-d.jpg)当用户请求网页时，PHP 如何融入客户端/服务器模型。\n\n这与静态 HTML 网站不同，后者在发出请求时，服务器仅将\
  \ HTML 数据发送给 Web 浏览器，不会发生任何服务端解释 ![Image](img/circle-e.jpg)。因为不需要服务端动作，你可以在不使用服务器的情况下在\
  \ Web 浏览器中运行 HTML 页面。\n\n![Image](img/00_figure_05_e.jpg)\n\n![Image](img/circle-e.jpg)请求静态\
  \ HTML 页面时的客户端/服务器流程。\n\n对于最终用户和 Web 浏览器而言，`home.html` 和 `home.php` 看起来可能没有可感知的差别，但该页面内容的创建方式将截然不同。\n\
  \n### 什么是 MySQL？\n\nMySQL（[www.mysql.com](http://www.mysql.com)） ![Image](img/circle-f.jpg)\
  \ 是世界上最流行的开源数据库。事实上，如今 MySQL 是昂贵的巨头如 Oracle 和微软 SQL Server 的有力竞争者（具有讽刺意味的是，MySQL\
  \ 归 Oracle 所有）。像 PHP 一样，MySQL 提供卓越的性能、可移植性和可靠性，拥有适度的学习曲线，且几乎零成本。\n\n![Image](img/00_figure_06_f.jpg)\n\
  \n![Image](img/circle-f.jpg)MySQL 数据库应用程序的主页。\n\nMySQL 是关系型数据库的数据库管理系统（DBMS）（因此，MySQL\
  \ 是一个 RDBMS）。用最简单的术语来说，数据库是数据的集合，无论是文本、数字还是二进制文件，由 DBMS 存储并保持有序。\n\n\n\n\n# 数据库类型与\
  \ MySQL 简介\n\n数据库类型多种多样，从简单的平面文件到关系型和面向对象型。关系型数据库使用多张表以最清晰的方式存储信息。虽然关系型数据库在设计和编程阶段可能需要更多思考，但它们提供了更高的可靠性和数据完整性，足以弥补所需的额外工作量。此外，关系型数据库更易于搜索，并支持并发用户。\n\
  \n通过将数据库集成到 Web 应用程序中，部分由 PHP 生成的数据可以从 MySQL 中检索。这进一步将网站内容从静态（硬编码）基础转移到灵活的基础上，而灵活性是动态网站的关键。\n\
  \n![动态 Web 应用程序工作流程](img/00_figure_07_g.jpg)\n\n![MySQL 图标](img/circle-g.jpg) 大多数本书中的动态\
  \ Web 应用程序将如何工作，同时使用 PHP 和 MySQL。\n\nMySQL 是一款开源应用程序，就像 PHP 一样，这意味着它可以免费使用甚至修改（源代码本身可供下载）。在某些情况下，你需要支付\
  \ MySQL 许可证费用，特别是当你通过销售或集成 MySQL 产品获利时。请查阅 MySQL 的许可政策以获取更多信息。\n\nMySQL 软件由多个组件组成，包括\
  \ MySQL 服务器（`mysqld`，运行并管理数据库）、MySQL 客户端（`mysql`，提供与服务器交互的界面）以及用于维护和其他目的的众多实用程序。PHP\
  \ 一直对 MySQL 有良好的支持，在最新版本的语言中这一点更加明显。\n\nMySQL 已知可处理多达 60,000 张表、超过 50 亿行的数据库。在某些操作系统上，MySQL\
  \ 可处理高达 800 万 TB 的表，通常情况下为 4 GB。NASA 和美国人口普查局等众多机构都在使用 MySQL。\n\n截至本书撰写时，MySQL 版本为\
  \ 5.5.13，5.6 和 6.0 版本正在开发中。你所使用的 MySQL 版本会影响可用功能，因此了解你正在使用的版本非常重要。本书使用 MySQL 5.1.44\
  \ 和 5.5.8 版本，但只要你使用的 MySQL 版本大于 5.0，就应该能完成本书中的所有操作。\n\n---\n\n## 发音指南\n\n虽然这微不足道，但我应提前澄清：MySQL\
  \ 的标准发音是 “My Ess Que Ell”，正如 SQL 应发音为 “Ess Que Ell”。这是许多初次接触这些技术的人常有的疑问。虽然这不是关键问题，但正确发音首字母缩略词总是最好的。\n\
  \n---\n\n## 所需工具\n\n要学习本书中的示例，你需要以下工具：\n\n- Web 服务器应用程序（例如 Apache、Abyss 或 IIS）\n\
  - PHP\n- MySQL\n- Web 浏览器（Microsoft Internet Explorer、Mozilla Firefox、Apple Safari、Google\
  \ Chrome 等）\n- 文本编辑器、支持 PHP 的 WYSIWYG 应用程序（Adobe Dreamweaver 符合要求）或 IDE（集成开发环境）\n\
  - FTP 应用程序（如果使用远程服务器）\n\n使用 PHP 和 MySQL 开发动态网站的一大优势是，无论你的操作系统是什么，所有需求都可以零成本满足！Apache、PHP\
  \ 和 MySQL 均免费；Web 浏览器免费获取；许多优秀的文本编辑器也免费提供。\n\n附录（可从 `http://www.peachpit.com` 下载）讨论了在\
  \ Windows 和 Mac OS X 操作系统上的安装过程。如果你有一台电脑，只需下载几个文件就能创建动态网站（在这种情况下，你的电脑将同时代表客户端和服务器）。相反，你也可以每月只需几美元购买\
  \ Web 托管服务，这将为你提供一个已上线的、支持 PHP 和 MySQL 的环境。\n\n> **Tip**\n> 要从 peachpit.com 下载本书的附录，请在\
  \ `http://peachpit.com` 创建一个免费账户，然后使用 ISBN 号 0321784073 注册本书。注册后，你将获得额外内容的访问权限。\n\
  \n---\n\n## 关于本书\n\n本书教授如何使用 PHP 和 MySQL 开发动态网站，涵盖大多数开发者可能需要的知识。秉承 Visual QuickPro\
  \ 系列的格式，信息通过循序渐进的方法配合相应图像进行讲解。重点放在真实、实用的示例上，避免了 “你可以做但永远不会做” 的场景。作为一名实践的 Web 开发者，我撰写了我使用的信息，避免了与手头任务无关的主题。作为一名实践的作家，我确保包含了我知道读者正在询问的主题和技术。\n\
  \n本书结构线性，旨在按顺序阅读。前三章涵盖 PHP 基础（到第二章时，你将已开发出第一个动态网页）。随后四章讲解 SQL（结构化查询语言，用于与所有数据库交互）和\
  \ MySQL。这些章节教授 SQL 基础、数据库设计及 MySQL 应用的具体细节。接着有一章关于调试和错误管理的内容，这是每个人都需要的。随后是一章介绍如何将\
  \ PHP 和 MySQL 结合使用，这非常容易。\n\n接下来的五章教授更多应用技术以完善你的知识。特别是安全性，在这些页面中反复被提及。两章新内容将拓展你的新知识。最后，我包含了三个示例章节，在其中开发不同\
  \ Web 应用程序的核心，并附带说明。\n\n### 这本书适合你吗？\n\n本书面向初级到中级的广泛读者。本书使用 XHTML，因此扎实的 XHTML 或\
  \ HTML 经验是必须的。虽然本书涵盖许多内容，但不正式教授 HTML 或网页设计。书中穿插了一些 CSS 但也不教授。\n\n其次，本书期望你具备以下条件之一：\n\
  \n- 无需过多指导即可学习的动力和能力，或……\n- 熟悉另一种编程语言（即使扎实的 JavaScript 技能也符合要求），或……\n- 对 PHP 有浅显的了解\n\
  \n毫无疑问：本书从 A 到 Z 涵盖了 PHP 和 MySQL，教授开发真实网站所需的一切，但特别是早期章节讲解 PHP 的节奏较快。因此，我建议要么有一些编程经验，要么在学习新事物时拥有好奇心和独立精神。如果你觉得进度太快，最好从我的另一本书《PHP\
  \ for the World Wide Web: Visual QuickStart Guide》最新版开始，节奏平缓得多。\n\n无需数据库经验，因为 SQL\
  \ 和 MySQL 从更基础的层面开始讲解。\n\n### 本版新增内容\n\n前三版广受欢迎，我收到了很多积极反馈（谢谢！）。在撰写新版时，我不仅想更新内容以适配最新版\
