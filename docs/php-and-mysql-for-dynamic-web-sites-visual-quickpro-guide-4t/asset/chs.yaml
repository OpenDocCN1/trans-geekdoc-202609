  \n### 登录与注销\n\n第 12 章 创建了许多版本的 `login.php` 和 `logout.php` 脚本，使用了 Cookie 和会话的各种变体。这里将再次创建这两个脚本，这次遵循本章\
  \ Web 应用程序的其余部分相同的实践。本示例中的登录查询略有不同，因为它还必须检查 *active* 列是否具有 `NULL` 值，这表明用户已激活其账户。\n\
  \n#### 编写 login.php\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `login.php`（**脚本 18.8**）：\n\
  \n```php\n<?php # Script 18.8 - login.php\nrequire ('includes/config.inc.php');\n\
  $page_title = 'Login';\ninclude ('includes/header.html');\n```\n\n**2.** 检查表单是否已提交并引入数据库连接：\n\
  \n```php\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n    require (MYSQL);\n```\n\
  \n**3.** 验证提交的数据：\n\n```php\nif (!empty($_POST['email'])) {\n    $e = mysqli_real_escape_string\
  \ ($dbc, $_POST['email']);\n} else {\n    $e = FALSE;\n    echo '<p class=\"error\"\
  >You forgot to enter your email address!</p>';\n}\n\nif (!empty($_POST['pass']))\
  \ {\n    $p = mysqli_real_escape_string ($dbc, $_POST['pass']);\n} else {\n    $p\
  \ = FALSE;\n    echo '<p class=\"error\">You forgot to enter your password!</p>';\n\
  }\n```\n\n关于验证有两种思路。一方面，您可以使用正则表达式和 Filter 扩展，复制 `register.php` 中的相同代码来验证这些值。另一方面，检验这些值的真正标准在于登录查询是否返回记录，因此有人可以说可以跳过更严格的\
  \ PHP 验证。本脚本采用后一种思路。\n\n如果用户未在表单中输入任何值，将打印错误消息 ![Image](img/circle-a.jpg)。\n\n![Image](img/18_figure_23_a.jpg)\n\
  \n![Image](img/circle-a.jpg) 登录表单仅检查是否输入了值，而不使用正则表达式。\n\n**4.** 如果两个验证例程都通过，检索用户信息：\n\
  \n```php\nif ($e && $p) {\n    $q = \"SELECT user_id, first_name, user_level FROM\
  \ users WHERE (email='$e' AND pass=SHA1 ('$p')) AND active IS NULL\";\n    $r =\
  \ mysqli_query ($dbc, $q) or trigger_error(\"Query: $q\\n<br />MySQL Error: \" .\
  \ mysqli_error($dbc));\n```\n\n该查询将尝试检索电子邮件地址和密码与提交值匹配的记录的用户 ID、名字和用户级别。MySQL 查询在\
  \ *pass* 列上使用 `SHA1()` 函数，因为密码在注册过程中使用该函数进行加密。查询还检查 *active* 列是否具有 `NULL` 值，这意味着用户已成功访问\
  \ `activate.php` 页面。\n\n如果您知道账户已激活但仍无法使用正确的值登录，很可能是因为您的 *active* 列被错误地定义为 `NOT NULL`。\n\
  \n**5.** 如果在数据库中找到匹配项，则登录用户：\n\n```php\nif (@mysqli_num_rows($r) == 1) {\n    $_SESSION\
  \ = mysqli_fetch_array ($r, MYSQLI_ASSOC);\n    mysqli_free_result($r);\n    mysqli_close($dbc);\n\
