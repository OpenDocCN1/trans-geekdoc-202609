  ![Image](img/03_figure_05_e.jpg)\n\n生成的网页 HTML 源代码应与原始模板中的代码相同（请参阅 脚本 3.1）。\n\n\
  ---\n\n> **提示**\n>\n> 在 `php.ini` 配置文件中，您可以调整 `include_path` 设置，该设置规定了 PHP 允许和不允许从哪里检索被包含的文件。\n\
  \n---\n\n> **提示**\n>\n> 正如您将在 第 9 章 “将 PHP 与 MySQL 结合使用” 中看到的，任何包含敏感信息（如数据库访问权限）的被包含文件，理想情况下应存储在\
  \ Web 目录之外，以免在 Web 浏览器中被查看。\n\n---\n\n> **提示**\n>\n> 由于 `require()` 在失败时对脚本的影响更大，因此建议将其用于关键性包含（如连接数据库的文件）。`include()`\
  \ 函数则用于不太重要的包含。\n\n---\n\n> **提示**\n>\n> 如果一段 PHP 代码仅包含单个可执行语句，通常会将该语句和 PHP 标签放在同一行：\n\
  >\n> ```\n> <?php include ('filename.html'); ?>\n> ```\n\n---\n\n> **提示**\n>\n>\
  \ 由于 CSS 的工作原理，如果您不使用 CSS 文件，或者浏览器不读取 CSS，生成的结果仍然是功能性的，只是在美观程度上不那么令人愉悦。\n\n---\n\
  \n### 重温 HTML 表单处理\n\n第 2 章 “PHP 编程” 的很大一部分内容涉及使用 PHP 处理 HTML 表单（这很合理，因为 PHP Web\
  \ 编程的很大一部分正是如此）。所有那些示例都使用两个单独的文件：一个用于显示表单，另一个用于接收提交的数据。虽然这种方法当然没有错，但将整个流程放在一个脚本中也有其优势。\n\
  \n要让一个页面既显示又处理表单，必须使用条件语句来检查应采取哪种操作（*显示* 或 *处理*）：\n\n```\nif (/* 表单已提交 */) {\n \
  \   // 处理表单。\n} else {\n    // 显示表单。\n}\n```\n\n那么，问题在于如何判断表单是否已提交。稍作解释后，答案很简单。\n\
  \n当您有一个使用 POST 方法并提交回同一页面的表单时，将对该脚本发出两种不同类型的请求。第一个请求（加载表单）将是 GET 请求。这是大多数网页的标准请求。当表单提交时，将对脚本发出第二个请求，这次是\
  \ POST 请求（前提是表单使用 POST 方法）。考虑到这一点，您可以通过检查 `$_SERVER` 数组中的请求方法来测试表单的提交情况：\n\n```\n\
  if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n    // 处理表单。\n} else {\n    // 显示表单。\n\
  }\n```\n\n![Image](img/03_figure_06_a.jpg)\n\n用户与此服务器上的 PHP 脚本之间的交互涉及用户对该脚本发出两次请求。\n\
  \n如果您希望页面处理表单然后再次显示它（例如，向数据库添加一条记录，然后提供添加另一条记录的选项），请去掉 `else` 子句：\n\n```\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    // 处理表单。\n}\n// 显示表单。\n```\n\n使用该代码，如果表单已提交，脚本将处理表单；每次加载页面时都会显示表单。\n\
  \n为了演示这一重要技巧（让同一页面既显示又处理表单），让我们创建一个计算器，根据用户输入的值估算汽车旅行所需的费用和时间。\n\n![Image](img/03_figure_07_b.jpg)\n\
  \n用户填写的 HTML 表单。\n\n#### 处理 HTML 表单\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `calculator.php`（**脚本\
  \ 3.5**）：\n\n```\n<?php # 脚本 3.5 - calculator.php\n$page\\_title = 'Trip Cost Calculator';\n\
  include ('includes/header.html');\n```\n\n\n\n\n本章中此处及所有剩余示例将使用与 `index.php` 相同的模板系统（脚本\
  \ 3.4）。因此每个页面的开头语法将相同，但页面标题会有所不同。\n\n## 2. 编写检查表单提交的条件语句\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n```\n\n正如之前所建议的，检查页面是否通过 POST 方法请求是判断表单提交的一个好方法（前提是表单使用 POST）。\n\
  \n### 脚本 3.5. `calculator.php` 脚本既显示一个简单的表单，又处理表单数据：执行一些计算并报告结果。\n\n```php\n<?php\
  \ # Script 3.5 - calculator.php\n\n$page_title = 'Trip Cost Calculator';\ninclude\
  \ ('includes/header.html');\n\n// Check for form submission:\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n\n    // Minimal form validation:\n    if (isset($_POST['distance'],\
  \ $_POST['gallon_price'], $_POST['efficiency']) &&\n        is_numeric($_POST['distance'])\
  \ && is_numeric($_POST['gallon_price']) &&\n        is_numeric($_POST['efficiency']))\
  \ {\n\n        // Calculate the results:\n        $gallons = $_POST['distance']\
  \ / $_POST['efficiency'];\n        $dollars = $gallons * $_POST['gallon_price'];\n\
  \        $hours = $_POST['distance'] / 65;\n\n        // Print the results:\n  \
  \      echo '<h1>Total Estimated Cost</h1>\n<p>The total cost of driving ' . $_POST['distance']\
  \ . ' miles, averaging ' . $_POST\n['efficiency'] . ' miles per gallon, and paying\
  \ an average of $' . $_POST['gallon_price'] . '\nper gallon, is $' . number_format($dollars,\
  \ 2) . '. If you drive at an average of 65 miles\nper hour, the trip will take approximately\
  \ ' . number_format($hours, 2) . ' hours.</p>';\n\n    } else { // Invalid submitted\
  \ values.\n        echo '<h1>Error!</h1>\n<p class=\"error\">Please enter a valid\
  \ distance, price per gallon, and fuel efficiency.</p>';\n    }\n\n} // End of main\
  \ submission IF.\n\n// Leave the PHP section and create the HTML form:\n?>\n\n<h1>Trip\
  \ Cost Calculator</h1>\n<form action=\"calculator.php\" method=\"post\">\n    <p>Distance\
  \ (in miles): <input type=\"text\" name=\"distance\" /></p>\n    <p>Ave. Price Per\
  \ Gallon: <span class=\"input\">\n        <input type=\"radio\" name=\"gallon_price\"\
  \ value=\"3.00\" /> 3.00\n        <input type=\"radio\" name=\"gallon_price\" value=\"\
  3.50\" /> 3.50\n        <input type=\"radio\" name=\"gallon_price\" value=\"4.00\"\
  \ /> 4.00\n    </span></p>\n    <p>Fuel Efficiency: <select name=\"efficiency\"\
  >\n        <option value=\"10\">Terrible</option>\n        <option value=\"20\"\
  >Decent</option>\n        <option value=\"30\">Very Good</option>\n        <option\
  \ value=\"50\">Outstanding</option>\n    </select></p>\n    <p><input type=\"submit\"\
  \ name=\"submit\" value=\"Calculate!\" /></p>\n</form>\n\n<?php include ('includes/footer.html');\
  \ ?>\n```\n\n## 3. 验证表单\n\n```php\nif (isset($_POST['distance'], $_POST['gallon_price'],\
  \ $_POST['efficiency']) &&\n    is_numeric($_POST['distance']) && is_numeric($_POST['gallon_price'])\
  \ && is_numeric($_POST['efficiency'])) {\n```\n\n此处的验证非常简单：它仅检查三个提交的变量是否已设置且均为数字类型。你当然可以对此进行扩展，例如检查所有值是否为正数（事实上，第\
  \ 13 章“安全方法”有一个该脚本的变体正是这样做的）。\n\n如果验证通过所有测试，将进行计算；否则，将要求用户重试。\n\n## 4. 执行计算\n\n\
  ```php\n$gallons = $_POST['distance'] / $_POST['efficiency'];\n$dollars = $gallons\
  \ * $_POST['gallon_price'];\n$hours = $_POST['distance'] / 65;\n```\n\n第一行计算行程所需的汽油加仑数，通过将距离除以燃油效率得出。第二行计算行程的燃油费用，通过将加仑数乘以每加仑平均价格得出。第三行计算行程所需时间，通过将距离除以\
  \ 65 得出（代表每小时 65 英里）。\n\n## 5. 打印结果\n\n```php\necho '<h1>Total Estimated Cost</h1>\n\
  <p>The total cost of driving ' . $_POST['distance'] . ' miles, averaging ' . $_POST['efficiency']\
  \ . ' miles per gallon, and paying an average of $' . $_POST['gallon_price'] . '\
  \ per gallon, is $' . number_format($dollars, 2) . '. If you drive at an average\
  \ of 65 miles per hour, the trip will take approximately ' . number_format($hours,\
  \ 2) . ' hours.</p>';\n```\n\n所有值均被打印输出，同时使用 `number_format()` 函数格式化费用和小时数。使用连接运算符（句点）可将格式化后的数值追加到打印的消息中。\n\
  \n## 6. 完成条件语句并关闭 PHP 标签\n\n```php\n} else { // Invalid submitted values.\n    echo\
  \ '<h1>Error!</h1>\n    <p class=\"error\">Please enter a valid distance, price\
  \ per gallon, and fuel efficiency.</p>';\n}\n} // End of main submission IF.\n?>\n\
  ```\n\n`else` 子句完成验证条件语句（步骤 3），如果提交的三个值不全为已设置且为数字，则打印错误。最后一个右花括号关闭 `isset($_SERVER['REQUEST_METHOD']\
  \ == 'POST')` 条件语句。最后，关闭 PHP 部分，以便在不使用 `echo` 的情况下创建表单（见步骤 7）。\n\n![Image](img/03_figure_08_c.jpg)\n\
  \n如果提交的任何值未同时满足已设置和为数字的条件，将显示错误消息。\n\n## 7. 开始 HTML 表单\n\n```html\n<h1>Trip Cost\
  \ Calculator</h1>\n<form action=\"calculator.php\" method=\"post\">\n    <p>Distance\
  \ (in miles): <input type=\"text\" name=\"distance\" /></p>\n```\n\n表单本身相当直观，仅包含一个新技巧：`action`\
  \ 属性使用该脚本自身的名称，以便表单提交回此页面，而不是提交到另一个页面。表单中的第一个元素是一个文本输入框，用户可在其中输入行程距离。\n\n## 8. 完成表单\n\
  \n```html\n<p>Ave. Price Per Gallon: <span class=\"input\">\n<input type=\"radio\"\
  \ name=\"gallon_price\" value=\"3.00\" /> 3.00\n<input type=\"radio\" name=\"gallon_price\"\
  \ value=\"3.50\" /> 3.50\n<input type=\"radio\" name=\"gallon_price\" value=\"4.00\"\
  \ /> 4.00\n</span></p>\n<p>Fuel Efficiency: <select name=\"efficiency\">\n    <option\
  \ value=\"10\">Terrible</option>\n    <option value=\"20\">Decent</option>\n   \
  \ <option value=\"30\">Very Good</option>\n    <option value=\"50\">Outstanding</option>\n\
  </select></p>\n<p><input type=\"submit\" name=\"submit\" value=\"Calculate!\" /></p>\n\
  </form>\n```\n\n表单使用单选按钮来选择每加仑平均价格（按钮被包裹在 `span` 标签内，以便使其格式与其他表单元素相似）。对于燃油效率，用户可以从包含四个选项的下拉菜单中选择。一个提交按钮完成了表单。\n\
  \n## 9. 包含页脚文件\n\n```php\n<?php include ('includes/footer.html'); ?>\n```\n\n##\
  \ 10. 将文件保存为 `calculator.php`，将其放置在你的 Web 目录中，并在 Web 浏览器中测试它。\n\n![Image](img/03_figure_09_d.jpg)\n\
  \n该页面执行计算，报告结果，然后重新显示表单。\n\n---\n\n### 提示\n\n你也可以通过不对 `action` 属性赋值，让表单提交回其自身：\n\
  \n```html\n<form action=\"\" method=\"post\">\n```\n\n这样做，表单将始终提交回同一页面，即使你稍后更改了脚本的名称。\n\
  \n\n\n\n\n#### 创建粘性表单\n\n*粘性表单* 就是一个标准的 HTML 表单，它能记住你是如何填写的。这对最终用户来说是一个特别好的功能，特别是当你要求他们在第一次填写错误后重新提交表单时（如上一节所示）。\n\
  \n要预设文本输入框中的内容，请使用其 `value` 属性：\n\n```html\n<input type=\"text\" name=\"city\" value=\"\
  Innsbruck\" />\n```\n\n要让 PHP 预设该值，请输出相应的变量（这假设引用的变量已存在）：\n\n```html\n<input type=\"\
  text\" name=\"city\" value=\"<?php echo $city; ?>\" />\n```\n\n（这也是 PHP HTML 嵌入特性优势的一个很好的例子：你可以将\
  \ PHP 代码放在任何地方，包括 HTML 标签内部。）\n\n要预设单选按钮或复选框的状态（即预先选中它们），请将代码 `checked=\"checked\"\
  ` 添加到它们的 `input` 标签中。使用 PHP，你可以这样写：\n\n```html\n<input type=\"radio\" name=\"gender\"\
  \ value=\"F\" <?php if ($gender == 'F') { echo 'checked=\"checked\"'; } ?>/>\n```\n\
  \n（正如你所见，语法很快就会变得复杂；你可能会发现先创建表单元素，然后作为第二步添加 PHP 代码会更容易。）\n\n要预设文本域的值，请在 `textarea`\
  \ 标签之间输出该值：\n\n```html\n<textarea name=\"comments\" rows=\"10\" cols=\"50\"><?php\
  \ echo $comments; ?></textarea>\n```\n\n请注意，`textarea` 标签不像标准的 `text` 输入框那样拥有 `value`\
  \ 属性。\n\n要预选下拉菜单，请向相应的 option 添加 `selected=\"selected\"`。如果你也使用 PHP 来生成菜单，这会变得非常简单：\n\
  \n```php\necho '<select name=\"year\">';\nfor ($y = 2011; $y <= 2021; $y++) {\n\
  \    echo \"<option value=\\\"$y\\\"\";\n    if ($year == $y) {\n        echo '\
  \ selected=\"selected\"';\n    }\n    echo \">$y</option>\\n\";\n}\necho '</select>';\n\
  ```\n\n掌握了这些新信息后，让我们重写 `calculator.php` 使其具有粘性。与上述示例不同，现有的值将存在于 `$_POST` 变量中。此外，由于最好不引用不存在的变量，条件语句将在输出变量值之前检查该变量是否已设置。\n\
  \n#### 创建粘性表单\n\n**1.** 在文本编辑器或 IDE 中打开 `calculator.php`（参考 脚本 3.5），如果尚未打开的话。\n\n\
  **2.** 修改距离输入框，使其如下所示（**脚本 3.6**）：\n\n```html\n<input type=\"text\" name=\"distance\"\
  \ value=\"<?php if (isset($_POST['distance'])) echo $_POST['distance']; ?>\" />\n\
  ```\n\n第一处更改是向输入框添加 `value` 属性。然后，输出提交的距离变量（`$_POST['distance']`）的值。由于页面首次加载时 `$_POST['distance']`\
  \ 没有值，条件语句确保在尝试输出之前变量已设置。设置输入框值的最终 PHP 代码结果为：\n\n```php\n<?php\nif (isset($_POST['distance']))\
  \ {\n    echo $_POST['distance'];\n}\n?>\n```\n\n这可以精简为脚本中使用的更简洁形式（如果条件块中只有一条语句，可以省略大括号，尽管我极少建议这样做）。\n\
  \n**脚本 3.6。** 计算器的表单现在可以回忆之前输入和选择的值（创建了一个粘性表单）。\n\n```php\n<?php # 脚本 3.6 - calculator.php\
  \ #2\n\n$page_title = '行程成本计算器';\ninclude ('includes/header.html');\n\n// 检查表单提交：\n\
  if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\n    // 最小化表单验证：\n    if (isset($_POST['distance'],\
  \ $_POST['gallon_price'], $_POST['efficiency']) &&\n        is_numeric($_POST['distance'])\
  \ && is_numeric($_POST['gallon_price']) && is_numeric($_POST['efficiency'])) {\n\
  \n        // 计算结果：\n        $gallons = $_POST['distance'] / $_POST['efficiency'];\n\
  \        $dollars = $gallons * $_POST['gallon_price'];\n        $hours = $_POST['distance']\
  \ / 65;\n\n        // 输出结果：\n        echo '<h1>总预估成本</h1>\n<p>驾驶 ' . $_POST['distance']\
  \ . ' 英里，平均每加仑 ' . $_POST['efficiency'] . ' 英里，平均每加仑支付 $' . $_POST['gallon_price']\
  \ '，总成本为 $' . number_format($dollars, 2) '。如果你以平均每小时 65 英里的速度驾驶，该行程将耗时约 ' . number_format($hours,\
  \ 2) ' 小时。</p>';\n\n    } else { // 提交的值无效。\n        echo '<h1>错误！</h1>\n<p class=\"\
  error\">请输入有效的距离、每加仑价格和燃油效率。</p>';\n    }\n\n} // 主提交 IF 结束。\n\n// 离开 PHP 部分并创建\
  \ HTML 表单：\n?>\n\n<h1>行程成本计算器</h1>\n<form action=\"calculator.php\" method=\"post\"\
  >\n    <p>距离（英里）： <input type=\"text\" name=\"distance\" value=\"<?php if (isset($_POST['distance']))\
  \ echo $_POST['distance']; ?>\" /></p>\n    <p>平均每加仑价格： <span class=\"input\">\n\
  \        <input type=\"radio\" name=\"gallon_price\" value=\"3.00\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '3.00')) echo 'checked=\"checked\" '; ?>/> 3.00\n\
  \        <input type=\"radio\" name=\"gallon_price\" value=\"3.50\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '3.50')) echo 'checked=\"checked\" '; ?>/> 3.50\n\
  \        <input type=\"radio\" name=\"gallon_price\" value=\"4.00\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '4.00')) echo 'checked=\"checked\" '; ?>/> 4.00\n\
  \    </span></p>\n    <p>燃油效率： <select name=\"efficiency\">\n        <option value=\"\
  10\"<?php if (isset($_POST['efficiency']) && ($_POST['efficiency'] == '10')) echo\
  \ ' selected=\"selected\"'; ?>>极差</option>\n        <option value=\"20\"<?php if\
  \ (isset($_POST['efficiency']) && ($_POST['efficiency'] == '20')) echo ' selected=\"\
  selected\"'; ?>>尚可</option>\n        <option value=\"30\"<?php if (isset($_POST['efficiency'])\
  \ && ($_POST['efficiency'] == '30')) echo ' selected=\"selected\"'; ?>>很好</option>\n\
  \        <option value=\"50\"<?php if (isset($_POST['efficiency']) && ($_POST['efficiency']\
  \ == '50')) echo ' selected=\"selected\"'; ?>>卓越</option>\n    </select></p>\n \
  \   <p><input type=\"submit\" name=\"submit\" value=\"计算！\" /></p>\n</form>\n\n\
  <?php include ('includes/footer.html'); ?>\n```\n\n**3.** 修改单选按钮为：\n\n```html\n\
  <input type=\"radio\" name=\"gallon_price\" value=\"3.00\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '3.00')) echo 'checked=\"checked\" '; ?>/> 3.00\n\
  <input type=\"radio\" name=\"gallon_price\" value=\"3.50\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '3.50')) echo 'checked=\"checked\" '; ?>/> 3.50\n\
  <input type=\"radio\" name=\"gallon_price\" value=\"4.00\" <?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == '4.00')) echo 'checked=\"checked\" '; ?>/> 4.00\n\
  ```\n\n对于这三个单选按钮中的每一个，必须在 `input` 标签内添加以下代码：\n\n```php\n<?php if (isset($_POST['gallon_price'])\
  \ && ($_POST['gallon_price'] == 'XXX')) echo 'checked=\"checked\" '; ?>\n```\n\n\
  对于每个按钮，比较值（XXX）会相应更改。\n\n**4.** 修改下拉菜单选项为：\n\n```html\n<option value=\"10\"<?php\
  \ if (isset($_POST['efficiency']) && ($_POST['efficiency'] == '10')) echo ' selected=\"\
  selected\"'; ?>>极差</option>\n```\n\n\n\n\n<option value=\"20\"<?php if (isset($_POST['efficiency'])\
  \ && ($_POST['efficiency'] == '20')) echo ' selected=\"selected\"'; ?>>尚可</option>\n\
  \n<option value=\"30\"<?php if (isset($_POST['efficiency']) && ($_POST['efficiency']\
  \ == '30')) echo ' selected=\"selected\"'; ?>>很好</option>\n\n<option value=\"50\"\
  <?php if (isset($_POST['efficiency']) && ($_POST['efficiency'] == '50')) echo '\
  \ selected=\"selected\"'; ?>>杰出</option>\n\n对于每个选项，在开始的 `option` 标签内，添加了以下代码：\n\n\
