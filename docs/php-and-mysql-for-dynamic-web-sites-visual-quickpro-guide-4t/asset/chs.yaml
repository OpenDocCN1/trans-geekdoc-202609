  \ 步骤详解\n\n**3. 创建检查表单提交的条件语句并包含数据库连接脚本：**\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    require (MYSQL);\n}\n```\n\n由于 `mysqli_connect.php` 脚本的完整路径在配置文件中定义为常量，因此该常量可作为\
  \ `require()` 的参数。这种方法的好处是，网站中任何位置存储的文件（甚至子目录中的文件）都可以使用这段相同的代码成功包含连接脚本。\n\n**4.\
  \ 清理输入数据并建立标志变量：**\n\n```php\n$trimmed = array_map('trim', $_POST);\n$fn = $ln =\
  \ $e = $p = FALSE;\n```\n\n第一行代码将 `$_POST` 中的每个元素都通过 `trim()` 函数处理，并将返回结果赋值给新的 `$trimmed`\
  \ 数组。关于此行的解释可见 第 13 章 “安全方法”，当时曾用 `array_map()` 处理待发送邮件的数据。简而言之，`trim()` 函数将应用于\
  \ `$_POST` 中的每个值，免去了逐个应用 `trim()` 的麻烦。\n\n第二行将四个变量初始化为 `FALSE`。这行代码只是以下写法的简写：\n\n\
  ```php\n$fn = FALSE;\n$ln = FALSE;\n$e = FALSE;\n$p = FALSE;\n```\n\n**5. 验证名和姓：**\n\
  \n```php\nif (preg_match ('/^[A-Z \\'.-]{2,20}$/i', $trimmed['first_name'])) {\n\
  \    $fn = mysqli_real_escape_string ($dbc, $trimmed['first_name']);\n} else {\n\
  \    echo '<p class=\"error\">Please enter your first name!</p>';\n}\n\nif (preg_match\
  \ ('/^[A-Z \\'.-]{2,40}$/i', $trimmed['last_name'])) {\n    $ln = mysqli_real_escape_string\
  \ ($dbc, $trimmed['last_name']);\n} else {\n    echo '<p class=\"error\">Please\
  \ enter your last name!</p>';\n}\n```\n\n表单的大部分验证将使用正则表达式（详见 第 14 章 “Perl 兼容正则表达式”）。对于名字值，假设其仅包含字母、句点（如首字母缩写）、撇号、空格和连字符。此外，值的长度应在\
  \ 2 到 20 个字符之间。为确保值仅包含这些字符，使用了脱字符（`^`）和美元符号（`$`）分别匹配字符串的开头和结尾。使用 Perl 兼容正则表达式时，整个模式必须放在定界符（正斜杠）内。\n\
  \n如果满足此条件，`$fn` 变量将被赋值为提交值经 `mysqli_real_escape_string()` 处理后的版本；否则 `$fn` 仍为 `FALSE`\
  \ 并打印错误消息。\n\n![Image](img/circle-a.jpg)\n\n![Image](img/18_figure_12_a.jpg)\n\n\
  ![Image](img/circle-a.jpg) 如果名字值未通过正则表达式测试，将打印错误消息。\n\n验证姓氏使用相同的过程，只是该正则表达式允许更长的长度。得益于\
  \ `i` 修饰符，两个模式均不区分大小写。\n\n**6. 验证电子邮件地址：**\n\n```php\nif (filter_var($trimmed['email'],\
  \ FILTER_VALIDATE_EMAIL)) {\n    $e = mysqli_real_escape_string ($dbc, $trimmed['email']);\n\
  } else {\n    echo '<p class=\"error\">Please enter a valid email address! </p>';\n\
  }\n```\n\n![Image](img/circle-b.jpg)\n\n![Image](img/18_figure_13_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ 提交的电子邮件地址必须格式正确。\n\n可使用 Filter 扩展轻松验证电子邮件地址（详见 第 13 章）。如果您的 PHP 版本不支持 Filter 扩展，则需改用正则表达式（电子邮件地址的模式在\
  \ 第 14 章 中有描述）。\n\n**7. 验证密码：**\n\n```php\nif (preg_match ('/^\\w{4,20}$/', $trimmed['password1'])\
  \ ) {\n    if ($trimmed['password1'] == $trimmed['password2']) {\n        $p = mysqli_real_escape_string\
  \ ($dbc, $trimmed ['password1']);\n    } else {\n        echo '<p class=\"error\"\
  >Your password did not match the confirmed password!</p>';\n    }\n} else {\n  \
  \  echo '<p class=\"error\">Please enter a valid password!</p>';\n}\n```\n\n密码长度必须在\
  \ 4 到 20 个字符之间，且只能包含字母、数字和下划线。在 Perl 兼容正则表达式中，`\\w` 恰好代表这一组合。此外，第一个密码（`password1`）必须与确认密码（`password2`）匹配。\n\
  \n![Image](img/circle-c.jpg)\n\n![Image](img/18_figure_14_c.jpg)\n\n![Image](img/circle-c.jpg)\
  \ 密码将被检查格式、长度是否正确，以及……\n\n![Image](img/18_figure_15_d.jpg)\n\n![Image](img/circle-d.jpg)\
  \ ……密码值是否与确认密码值匹配。\n\n\n\n\n\n## 8. 如果每项测试都通过了，检查邮箱地址是否唯一\n\n```php\nif ($fn &&\
  \ $ln && $e && $p) {\n    $q = \"SELECT user_id FROM users WHERE email='$e'\";\n\
  \    $r = mysqli_query($dbc, $q) or trigger_error(\"Query: $q\\n<br />MySQL Error:\
  \ \" . mysqli_error($dbc));\n}\n```\n\n如果表单通过了每一项测试，此条件将为 `TRUE`。然后脚本必须搜索数据库，查看提交的邮箱地址当前是否正在被使用，因为该列的值在每条记录中必须唯一。与\
  \ MySQL 连接脚本一样，如果查询未能运行，请调用 `trigger_error()` 函数以触发自定义错误报告函数。具体的错误消息将包含正在运行的查询和\
  \ MySQL 错误，以便轻松调试问题。\n\n![Image](img/18_figure_16_e.jpg)\n\n如果发生 MySQL 查询错误，得益于这条信息丰富的错误消息，调试应该会更容易。\n\
  \n## 9. 如果邮箱地址未被使用，注册用户\n\n```php\nif (mysqli_num_rows($r) == 0) {\n    $a = md5(uniqid(rand(),\
  \ true));\n    $q = \"INSERT INTO users (email, pass, first_name, last_name, active,\
  \ registration_date) VALUES ('$e', SHA1('$p'), '$fn', '$ln', '$a', NOW())\";\n \
  \   $r = mysqli_query($dbc, $q) or trigger_error(\"Query: $q\\n<br />MySQL Error:\
  \ \" . mysqli_error($dbc));\n}\n```\n\n查询本身相当简单，但它确实需要创建一个唯一的激活码。生成该码需要用到 `rand()`、`uniqid()`\
  \ 和 `md5()` 函数。其中，`uniqid()` 是最重要的；它创建一个唯一标识符。它接受 `rand()` 函数作为参数以帮助生成更随机的值。最后，返回的结果使用\
  \ `md5()` 进行*哈希*处理，从而创建一个恰好 32 个字符长的字符串（哈希是对一段数据进行数学计算得出的表现形式）。你不需要完全理解这三个函数，只需注意结果将是一个唯一的\
  \ 32 字符字符串。\n\n至于查询本身，对你来说应该足够熟悉了。大多数值来自 PHP 脚本中的变量，在对它们应用了 `trim()` 和 `mysqli_real_escape_string()`\
  \ 之后。MySQL `SHA1()` 函数用于加密密码，`NOW()` 用于将注册日期设置为当前时刻。因为 `user_level` 列的默认值为 0（即非管理员），所以该列不必在此查询中提供值。推测网站的主管理员会在用户注册后编辑用户记录，赋予其管理员权限。\n\
  \n## 10. 如果查询成功，发送邮件\n\n```php\nif (mysqli_affected_rows($dbc) == 1) {\n    $body\
  \ = \"Thank you for registering at <whatever site>. To activate your account, please\
  \ click on this link:\\n\\n\";\n    $body .= BASE_URL . 'activate.php?x=' . urlencode($e)\
  \ . \"&y=$a\";\n    mail($trimmed['email'], 'Registration Confirmation', $body,\
  \ 'From: admin@sitename.com');\n}\n```\n\n对于此注册流程，重要的是确认邮件能发送给用户，因为在激活账户之前，他们将无法登录。此邮件应包含指向激活页面\
  \ `activate.php` 的链接。该页面的链接以 `BASE_URL` 开头，后者定义在 `config.inc.php` 中。链接还在 URL 中传递了两个值。第一个，通用称为\
  \ *x*，将是用户的邮箱地址，经过编码以便安全地包含在 URL 中。第二个，*y*，是激活码。因此，URL 将类似于 [`www.example.com/activate.php?x=email%40example.com&y=901e09ef25bf6e3ef95c93088450b008`](http://www.example.com/activate.php?x=email%40example.com&y=901e09ef25bf6e3ef95c93088450b008)。\n\
  \n---\n\n### 激活流程\n\n本章新增了一个激活流程，用户必须点击邮件中的链接来确认其账户，然后才能登录。使用这样的系统可以防止虚假注册变得可用。如果输入了无效的邮箱地址，该账户永远无法被激活。如果有人注册了他人的地址，希望受害者不会激活这个不需要的账户。\n\
  \n从编程角度来看，此流程要求为每个注册用户创建一个唯一的激活码，并将其存储在 `users` 表中。然后将该代码作为链接的一部分发送在确认邮件中给用户。当用户点击链接时，他或她将被带到网站上的一个页面，该页面通过从其记录中移除该代码来激活账户。最终结果是，没有人能在不接收确认邮件的情况下注册并激活账户（即，没有注册人控制的有效邮箱地址）。\n\
  \n---\n\n## 11. 告知用户预期情况并完成页面\n\n```php\necho '<h3>Thank you for registering! A\
  \ confirmation email has been sent to your address. Please click on the link in\
  \ that email in order to activate your account.</h3>';\ninclude('includes/footer.html');\n\
  exit();\n```\n\n成功注册后会打印一条感谢消息，以及激活说明。然后包含页脚并终止页面。\n\n![Image](img/18_figure_17_f.jpg)\n\
  \n用户成功注册后生成的页面。\n\n## 12. 如果查询失败，打印错误\n\n```php\n} else { // If it did not run OK.\n\
  \    echo '<p class=\"error\">You could not be registered due to a system error.\
  \ We apologize for any inconvenience.</p>';\n}\n```\n\n如果查询因某种原因失败，意味着 `mysqli_affected_rows()`\
  \ 没有返回 1，则向浏览器打印一条错误消息。由于本脚本实施的安全方法，网站的线上版本在此节点永远不应该出现问题。\n\n## 13. 完成条件判断和 PHP\
  \ 代码\n\n```php\n    } else {\n        echo '<p class=\"error\">That email address\
  \ has already been registered. If you have forgotten your password, use the link\
  \ at right to have your password sent to you. </p>';\n    }\n} else {\n    echo\
  \ '<p class=\"error\">Please try again.</p>';\n}\nmysqli_close($dbc);\n}\n?>\n```\n\
  \n如果有人尝试使用已注册的邮箱地址进行注册，将执行第一个 `else`。\n\n![Image](img/18_figure_18_g.jpg)\n\n如果邮箱地址已被注册，会告知用户。\n\
