  \n\n\n\n\n### 创建索引页面\n\n本示例中的索引页面功能不多。它将提供一些介绍性文本，以及供用户注册、登录、选择首选语言/论坛等的链接。从编程角度来看，它将展示如何使用模板文件。\n\
  \n#### 制作主页\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `index.php`（**脚本 17.3**）：\n\
  \n```\n<?php # Script 17.3 - index.php\n```\n\n因为所有 HTML 都在包含的文件中，所以此页面可以从 PHP 开始标签开始。\n\
  \n**2.** 包含 HTML 页头：\n\n```\ninclude ('includes/header.html');\n```\n\n包含的文件使用了\
  \ `header()` 和 `session_start()` 函数，因此你必须确保在此行之前没有任何内容发送到 Web 浏览器。只要 PHP 开始标签前没有空格，这应该不成问题。\n\
  \n**3.** 打印特定语言的内容：\n\n```\necho $words['intro'];\n```\n\n`$words` 数组在页头文件中定义。由于页头文件刚被包含，因此可以在此处引用它。索引为\
  \ `intro` 的值是一段欢迎文本，采用选定或默认语言。\n\n**4.** 完成页面：\n\n```\ninclude ('includes/footer.html');\n\
  ?>\n```\n\n主页就此完成！\n\n**5.** 将文件保存为 `index.php`，将其放入你的 Web 目录，并在 Web 浏览器中测试（参见上一节中的\
  \ ![Image](img/graycircle-a.jpg) 和 ![Image](img/graycircle-b.jpg)）。\n\n再次提醒，确保文件使用\
  \ UTF-8 编码保存。这是我最后一次提醒你！\n\n**脚本 17.3。** 主页包含页头和页脚文件以构成一个完整的 HTML 文档。它还会按选定语言打印一些介绍性文本。\n\
  \n```\n1  <?php # Script 17.3 - index.php\n2  // This is the main page for the site.\n\
  3\n4  // Include the HTML header:\n5  include ('includes/header.html');\n6\n7  //\
  \ The content on this page is introductory text\n8  // pulled from the database,\
  \ based upon the\n9  // selected language:\n10 echo $words['intro'];\n11\n12 //\
  \ Include the HTML footer file:\n13 include ('includes/footer.html');\n14 ?>\n```\n\
  \n---\n\n### 创建论坛页面\n\n网站的下一个页面是论坛页面，它显示论坛中的主题（每种语言对应一个论坛）。该页面将使用通过 URL 传递并/或存储在会话中的语言\
  \ ID，来确定要显示哪些主题。\n\n该页面的基本功能——运行查询、显示结果——很简单 ![Image](img/circle-a.jpg)。该页面使用的查询可能是全书中最复杂的一个。它之所以复杂，有三个原因：\n\
  \n![Image](img/17_figure_18_a.jpg)\n\n![Image](img/circle-a.jpg) 论坛页面，列出给定语言中主题的相关信息。主题链接到可阅读它们的页面。\n\
  \n**1.** 它跨三个表执行 `JOIN` 操作。\n\n**2.** 它使用了三个聚合函数和一个 `GROUP BY` 子句。\n\n**3.** 它将日期转换为用户的时区，但仅当查看页面的人已登录时才转换。\n\
  \n因此，查询确实错综复杂，但我将在以下步骤中详细讲解。\n\n#### 编写论坛页面\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为\
  \ `forum.php`（**脚本 17.4**）：\n\n```\n<?php # Script 17.4 - forum.php\ninclude ('includes/header.html');\n\
  ```\n\n**脚本 17.4。** 此脚本执行一个相当复杂的查询，以显示论坛中每个主题的五条信息——主题、原始发帖人、主题创建日期、回复数量和最新回复日期。\n\
  \n```\n1  <?php # Script 17.4 - forum.php\n2  // This page shows the threads in\
  \ a\n3      forum.\n4  include ('includes/header.html');\n5\n6  // Retrieve all\
  \ the messages in this\n7      forum...\n8\n9  // If the user is logged in and has\n\
  10      chosen a time zone,\n11  // use that to convert the dates and\n12      times:\n\
  13  if (isset($_SESSION['user_tz'])) {\n14      $first = \"CONVERT_TZ(p.posted_on,\n\
  15          'UTC', '{$_SESSION['user_tz']}')\";\n16      $last = \"CONVERT_TZ(p.posted_on,\n\
  17          'UTC', '{$_SESSION['user_tz']}')\";\n18  } else {\n19      $first =\
  \ 'p.posted_on';\n20      $last = 'p.posted_on';\n21  }\n22\n23  // The query for\
  \ retrieving all the threads in this forum, along with the original user,\n24  //\
  \ when the thread was first posted, when it was last replied to, and how many replies\
  \ it's had:\n25  $q = \"SELECT t.thread_id, t.subject, username, COUNT(post_id)\
  \ - 1 AS responses, MAX(DATE_FORMAT\n26      ($last, '%e-%b-%y %l:%i %p')) AS last,\
  \ MIN(DATE_FORMAT($first, '%e-%b-%y %l:%i %p')) AS first\n27      FROM threads AS\
  \ t INNER JOIN posts AS p USING (thread_id) INNER JOIN users AS u ON t.user_id =\n\
  28      u.user_id WHERE t.lang_id = {$_SESSION['lid']} GROUP BY (p.thread_id) ORDER\
  \ BY last DESC\";\n29  $r = mysqli_query($dbc, $q);\n30  if (mysqli_num_rows($r)\
  \ > 0) {\n31\n32      // Create a table:\n33      echo '<table width=\"100%\" border=\"\
  0\" cellspacing=\"2\" cellpadding=\"2\" align=\"center\">\n34          <tr>\n35\
  \          <td align=\"left\" width=\"50%\"><em>' . $words['subject'] . '</em>:</td>\n\
  36          <td align=\"left\" width=\"20%\"><em>' . $words['posted_by'] . '</em>:</td>\n\
  37          <td align=\"center\" width=\"10%\"><em>' . $words['posted_on'] . '</em>:</td>\n\
  38          <td align=\"center\" width=\"10%\"><em>' . $words['replies'] . '</em>:</td>\n\
  39          <td align=\"center\" width=\"10%\"><em>' . $words['latest_reply'] .\
  \ '</em>:</td>\n40          </tr>';\n41\n42      // Fetch each thread:\n43     \
  \ while ($row = mysqli_fetch_array($r, MYSQLI_ASSOC)) {\n44\n45          echo '<tr>\n\
  46              <td align=\"left\"><a href=\"read.php?tid=' . $row['thread_id']\
  \ . '\">' . $row['subject']\n47                  . '</a></td>\n48              <td\
  \ align=\"left\">' . $row['username'] . '</td>\n49              <td align=\"center\"\
  >' . $row['first'] . '</td>\n50              <td align=\"center\">' . $row['responses']\
  \ . '</td>\n51              <td align=\"center\">' . $row['last'] . '</td>\n52 \
  \         </tr>';\n53\n54      }\n55\n56      echo '</table>'; // Complete the table.\n\
  57\n58  } else {\n59      echo '<p>There are currently no messages in this forum.</p>';\n\
  60  }\n61\n62  // Include the HTML footer file:\n63  include ('includes/footer.html');\n\
  64  ?>\n```\n\n---\n\n**2.** 确定要使用的日期和时间：\n\n```\nif (isset($_SESSION['user_tz']))\
  \ {\n  $first = \"CONVERT_TZ (p.posted_on, 'UTC', '{$_SESSION['user_tz']}')\";\n\
  \  $last = \"CONVERT_TZ(p.posted_on, 'UTC', '{$_SESSION['user_tz']}')\";\n} else\
  \ {\n  $first = 'p.posted_on';\n  $last = 'p.posted_on';\n}\n```\n\n如前所述，查询会将日期和时间格式化为用户的时区（推测在注册过程中选择），但仅当查看者已登录时才会转换。推测，此信息将在登录时从数据库检索并存储在会话中。\n\
  \n为了使查询具有动态性，具体应选择哪个日期/时间值将存储在变量中，以便稍后在脚本的查询中使用。如果用户*未*登录，意味着 `$_SESSION['user_tz']`\
  \ 未设置，这两个日期——主题创建时间和最近回复发布时间——将是来自表的原始值。在两种情况下，引用的表列都是 `posts` 表（`p` 将在查询中作为 `posts`\
  \ 的别名）中的 `posted_on` 列。\n\n\n\n\n如果用户**已登录**，将使用`CONVERT_TZ()`函数将存储在`posted_on`中的值从\
  \ UTC 转换为用户选择的时区。详见第 6 章。请注意，使用此函数要求 MySQL 安装包含时区列表（详见第 6 章）。\n\n**3. 定义并执行查询：**\n\
  \n```php\n$q = \"SELECT t.thread_id, t.subject, username, COUNT(post_id) - 1 AS\
  \ responses, MAX(DATE_FORMAT($last, '%e-%b-%y %l:%i %p')) AS last, MIN(DATE_FORMAT($first,\
  \ '%e-%b-%y  %l:%i %p')) AS first FROM threads AS t INNER JOIN posts AS p USING\
  \ (thread_id) INNER JOIN users AS u ON t.user_id = u.user_id WHERE t.lang_id = {$_SESSION['lid']}\
  \ GROUP BY (p.thread_id) ORDER BY last DESC\";\n\n$r = mysqli_query($dbc, $q);\n\
  \nif (mysqli_num_rows($r) > 0) {\n```\n\n该查询需要返回六项内容：每个主题的 ID 和主题（来自`threads`表）、发布主题的用户名（来自`users`）、每个主题的回复数、主题创建日期以及主题最后回复日期（均来自`posts`表）。\n\
