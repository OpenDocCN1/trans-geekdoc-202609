  \n***\n\n### 防止 XSS 攻击\n\nHTML 只是纯文本，如 `<b>`，Web 浏览器赋予其特殊含义（如使文本加粗）。正因如此，你网站的用户很容易在其表单数据中放入\
  \ HTML，就像电子邮件示例中的评论字段一样。那有什么问题呢，你可能会问？\n\n许多动态驱动的 Web 应用程序获取用户提交的信息，将其存储在数据库中，然后在另一页面上重新显示这些信息。只需想到论坛即可作为一个例子。至少，如果用户在其数据中输入\
  \ HTML 代码，此类代码可能会破坏你网站的布局和美观。更进一步说，JavaScript 也只是纯文本，但在 Web 浏览器中具有特殊含义——*可执行*含义。如果输入表单的恶意代码在\
  \ Web 浏览器中重新显示，它可能会创建弹出窗口、窃取 Cookie 或将浏览器重定向到其他站点。此类攻击被称为*跨站脚本攻击*（XSS）。正如电子邮件示例中那样，你需要查找并中和数据中发现的恶意字符串，防止\
  \ XSS 攻击的方法是处理任何潜在的危险 PHP、HTML 或 JavaScript 代码。\n\nPHP 包含一组用于处理字符串中 HTML 和其他代码的函数。其中包括：\n\
  \n*   `htmlspecialchars()`，将 `&`、`'`、`\"`、`<` 和 `>` 转换为 HTML *实体* 格式（`&amp;`、`&quot;`\
  \ 等）\n*   `htmlentities()`，将所有适用字符转换为其 HTML 实体格式\n*   `strip_tags()`，移除所有 HTML 和\
  \ PHP 标签\n\n这三个函数大致按破坏性从小到大的顺序列出。你想使用哪个函数取决于具体的应用场景。为了演示这些函数的工作原理及其差异，让我们创建一个简单的\
  \ PHP 页面，获取一些文本并通过这些函数运行，然后打印结果。\n\n**脚本 13.4.** 对提交的文本应用 `htmlentities()` 和 `strip_tags()`\
  \ 函数可以防止 XSS 攻击。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n    1.0\
  \ Transitional//EN\" \"http://www.w3.org/\n    TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/\n    xhtml\" xml:lang=\"en\" lang=\"en\"\
  >\n<head>\n```\n\n\n\n\n\n#### XSS 攻击防范\n\n### PHP 脚本示例（脚本 13.4）\n\n```html\n4 \
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n5\
  \   <title>XSS Attacks</title>\n6 </head>\n7 <body>\n8 <?php # Script 13.4 - xss.php\n\
  \n10 if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\n12   // Apply the different\
  \ functions, printing the results:\n13   echo \"<h2>Original</h2><p>{$_POST['data']}</p>\"\
  ;\n14   echo '<h2>After htmlentities()</h2><p>' . htmlentities($_POST['data']) .\
  \ '</p>';\n15   echo '<h2>After strip_tags()</h2><p>' . strip_tags($_POST['data'])\
  \ . '</p>';\n\n17 }\n\n18 // Display the form:\n19 ?>\n20 <form action=\"xss.php\"\
  \ method=\"post\">\n21   <p>Do your worst! <textarea name=\"data\" rows=\"3\" cols=\"\
  40\"></textarea></p>\n22   <div align=\"center\"><input type=\"submit\" name=\"\
  submit\" value=\"Submit\" /></div>\n23 </form>\n24 </body>\n25 </html>\n```\n\n\
  ---\n\n### 防范 XSS 攻击\n\n**1.** 在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `xss.php`（**脚本 13.4**）：\n\
  \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>XSS Attacks</title>\n</head>\n<body>\n<?php # Script 13.4 - xss.php\n```\n\
  \n**2.** 检查表单提交并以原始格式打印接收到的数据：\n\n```php\nif ($_SERVER['REQUEST_METHOD'] == 'POST')\
  \ {\n  echo \"<h2>Original</h2> <p>{$_POST['data']}</p>\";\n}\n```\n\n为了对比最初接收到的值与应用函数后的结果，必须首先打印原始值。\n\
  \n**3.** 应用 `htmlentities()` 函数并打印结果：\n\n```php\necho '<h2>After htmlentities()</h2><p>'\
  \ . htmlentities($_POST['data']) . '</p>';\n```\n\n为防止提交的信息破坏页面或攻击 Web 浏览器，需将其通过\
  \ `htmlentities()` 函数处理。该函数会转换任何 HTML 实体；例如，`<` 和 `>` 将分别变为 `&lt;` 和 `&gt;`。\n\n\
  **4.** 应用 `strip_tags()` 函数并打印结果：\n\n```php\necho '<h2>After strip_tags()</h2><p>'\
  \ . strip_tags($_POST['data']) . '</p>';\n```\n\n`strip_tags()` 函数会彻底移除任何 HTML、JavaScript\
  \ 或 PHP 标签。因此，它是用于处理提交数据的最可靠函数。\n\n**5.** 结束 PHP 部分：\n\n```php\n}\n?>\n```\n\n**6.**\
  \ 显示 HTML 表单：\n\n```html\n<form action=\"xss.php\" method=\"post\">\n  <p>Do your\
  \ worst! <textarea name=\"data\" rows=\"3\" cols=\"40\"></textarea></p>\n  <div\
  \ align=\"center\"><input type=\"submit\" name=\"submit\" value=\"Submit\" /></div>\n\
  </form>\n```\n\n该表单仅包含一个供用户填写的字段：一个文本域。\n\n**7.** 完成页面：\n\n```html\n</body>\n</html>\n\
  ```\n\n**8.** 将页面保存为 `xss.php`，放入 Web 目录，并在 Web 浏览器中测试。\n\n**9.** 查看页面的源代码，以查看这些函数的完整效果。\n\
  \n这段页面的 HTML 源代码片段展示了原始提交值、使用 `htmlentities()` 后的值以及使用 `strip_tags()` 后的值。\n\n---\n\
  \n> **提示**\n>\n> `htmlspecialchars()` 和 `htmlentities()` 均接受一个可选参数，用于指示如何处理引号。具体细节请参阅\
  \ PHP 手册。\n\n---\n\n> **提示**\n>\n> `strip_tags()` 函数接受一个可选参数，用于指示哪些标签*不*应被剥离。\n\
  >\n> ```php\n> $var = strip_tags($var, '<p><br />');\n> ```\n\n---\n\n> **提示**\n\
  >\n> `strip_tags()` 函数甚至会移除无效的 HTML 标签，这可能会导致问题。例如，`strip_tags()` 会提取出它认为是 HTML\
  \ 标签的所有代码，即使该标签格式不正确，如 `<b I forgot to close the tag`。\n\n---\n\n> **提示**\n>\n>\
  \ 与安全性无关但非常实用的是 `nl2br()` 函数。它将每个回车符（如文本域中输入的）转换为 HTML `<br />` 标签。\n\n---\n\n####\
  \ 使用 Filter 扩展\n\n本章前面介绍了*类型转换*的概念，这是强制变量为正确类型的好方法。在下一章中，你将学习*正则表达式*，它可以验证数据的类型及其具体内容或格式。PHP\
  \ 5.2 引入了 Filter 扩展（[www.php.net/filter](http://www.php.net/filter)），这是一个重要工具，填补了相对简单的类型转换方法与更复杂的正则表达式概念之间的空白。\n\
  \nFilter 扩展可用于两个目的之一：*验证*数据或*清理*数据。正如你现在所熟知的，验证过程确认数据符合预期。相比之下，清理则通过移除不当字符来改变数据，使其符合预期。\n\
  \nFilter 扩展中最重要的函数是 `filter_var()`：\n\n```php\nfilter_var(variable, filter [,options]);\n\
  ```\n\n该函数的第一个参数是要过滤的变量；第二个是要应用的过滤器；可选的第三个参数用于添加额外的标准。**表 13.3** 列出了验证过滤器，每个过滤器均以常量形式表示。\n\
  \n#### 表 13.3. 验证过滤器\n\n*(图片引用: graphics/13tab03.jpg)*\n\n例如，要确认变量具有十进制值，可使用：\n\n\
  ```php\nif (filter_var($var, FILTER_VALIDATE_FLOAT)) {\n```\n\n有几个过滤器接受可选参数，最常见的是\
  \ `FILTER_VALIDATE_INT` 过滤器，它具有 `min_range` 和 `max_range` 选项，用于控制最小和最大可接受值。例如，下面这段代码确认\
  \ `$age` 变量是一个介于 1 和 120 之间（含边界）的整数：\n\n```php\nif (filter_var($var, FILTER_VALIDATE_INT,\
  \ array('min_range' => 1, 'max_range' => 120))) {\n```\n\n要清理数据，仍将使用 `filter_var()`\
  \ 函数，但使用 **表 13.4** 中列出的清理过滤器之一。\n\n#### 表 13.4. 清理过滤器\n\n*(图片引用: graphics/13tab04.jpg)*\n\
  \n许多过滤器复制了其他 PHP 函数的功能。例如，`FILTER_SANITIZE_MAGIC_QUOTES` 等同于应用 `addslashes()`；`FILTER_SANITIZE_SPECIAL_CHARS`\
  \ 可代替 `htmlspecialchars()` 使用，而 `FILTER_SANITIZE_STRING` 可作为 `strip_tags()` 的替代品。PHP\
  \ 手册列出了若干额外的标志（作为常量），可作为可选的第三个参数使用，以影响每个过滤器的行为。作为应用清理过滤器的一个示例，以下代码等同于在 `xss.php`（脚本\
  \ 13.4）中 `strip_tags()` 的用法：\n\n```php\necho '<h2>After strip_tags()</h2> <p>' .\
  \ filter_var($_POST['data'], FILTER_SANITIZE_STRING) . '</p>';\n```\n\n如果你习惯于使用\
  \ Filter 扩展，你可能会欣赏它能为所有数据清理提供一致性，即使存在诸如 `strip_tags()` 之类的函数。\n\n为了练习这一点，下一个示例将更新\
  \ `calculator.php`（脚本 13.2），使其清理所有传入的数据。请记住，你需要 PHP 5.2 或更高版本才能使用 Filter 扩展。如果你使用的是较早版本的\
  \ PHP，可以使用 PECL 安装 Filter 扩展。\n\n#### 使用 Filter 扩展\n\n**1.** 在文本编辑器或 IDE 中打开 `calculator.php`（脚本\
  \ 13.2）。\n\n**2.** 将 `$quantity` 变量的赋值更改为（脚本 13.5）：\n\n\n\n\n\n### 脚本 13.5：小部件成本计算器\n\
  \n#### PHP 代码示例\n\n```php\n$quantity = (isset($_POST['quantity'])) ? filter_var($_POST['quantity'],\
  \ FILTER_VALIDATE_INT, array('min_range' => 1)) : NULL;\n```\n\n**脚本 13.5。** 此脚本使用\
  \ Filter 扩展来清理传入数据，而不是像该脚本的早期版本那样使用类型转换。\n\n---\n\n```html\n1   <!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML\n       1.0 Transitional//EN\" \"http://www.w3.org/\n    \
  \   TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2   <html xmlns=\"http://www.w3.org/1999/\n\
  \       xhtml\" xml:lang=\"en\" lang=\"en\">\n3   <head>\n4       <meta http-equiv=\"\
  Content-Type\"\n           content=\"text/html; charset=utf-8\" />\n5       <title>Widget\
  \ Cost Calculator</title>\n6   </head>\n7   <body>\n8   <?php # Script 13.5 - calculator.php\
  \ #2\n9   // This version of the script uses the\n       Filter extension instead\
  \ of typecasting.\n10\n11  // Check if the form has been submitted:\n12  if ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n13\n14      // Sanitize the variables:\n15      $quantity = (isset($_POST\n\
  \           ['quantity'])) ? filter_var($_POST\n           ['quantity'], FILTER_VALIDATE_INT,\n\
  \           array('min_range' => 1)) : NULL;\n16      $price = (isset($_POST['price']))\n\
  \           ? filter_var($_POST['price'],\n           FILTER_SANITIZE_NUMBER_FLOAT,\n\
  \           FILTER_FLAG_ALLOW_FRACTION) : NULL;\n17      $tax = (isset($_POST['tax']))\
  \ ?\n           filter_var($_POST['tax'], FILTER_\n           SANITIZE_NUMBER_FLOAT,\
  \ FILTER_FLAG_\n           ALLOW_FRACTION) : NULL;\n18\n19      // All variables\
  \ should be positive!\n20      if ( ($quantity > 0) && ($price > 0)\n          \
  \ && ($tax > 0) ) {\n21\n21          // Calculate the total:\n23          $total\
  \ = $quantity * $price;\n24          $total += $total * ($tax/100);\n25\n26    \
  \      // Print the result:\n27          echo '<p>The total cost of\n          \
  \    purchasing ' . $quantity . '\n              widget(s) at $' . number_format\n\
  \              ($price, 2) . ' each, plus tax,\n              is $' . number_format\
  \ ($total, 2) .\n              '.</p>';\n28\n29      } else { // Invalid submitted\
  \ values.\n30          echo '<p style=\"font-weight: bold;\n              color:\
  \ #C00\">Please enter a valid\n              quantity, price, and tax rate.</p>';\n\
  31      }\n32\n33  } // End of main isset() IF.\n34\n35  // Leave the PHP section\
  \ and create the\n       HTML form.\n36  ?>\n37  <h2>Widget Cost Calculator</h2>\n\
  38  <form action=\"calculator.php\"\n       method=\"post\">\n39      <p>Quantity:\
  \ <input type=\"text\"\n           name=\"quantity\" size=\"5\" maxlength=\"10\"\
  \n           value=\"<?php if (isset($quantity)) echo\n           $quantity; ?>\"\
  \ /></p>\n40      <p>Price: <input type=\"text\"\n           name=\"price\" size=\"\
  5\" maxlength=\"10\"\n           value=\"<?php if (isset($price)) echo\n       \
  \    $price; ?>\" /></p>\n41      <p>Tax (%): <input type=\"text\"\n           name=\"\
  tax\" size=\"5\" maxlength=\"10\"\n           value=\"<?php if (isset($tax)) echo\n\
  \           $tax; ?>\" /></p>\n42      <p><input type=\"submit\" name=\"submit\"\
  \n           value=\"Calculate!\" /></p>\n43  </form>\n44  </body>\n45  </html>\n\
  ```\n\n---\n\n与其前身相比，此版本的脚本在几个方面进行了改进。首先，使用 `isset()` 检查每个 POST 变量是否存在，而不是假设变量已存在。如果变量未设置，则将\
  \ `NULL` 赋值给 `$quantity`。如果变量已设置，则通过 `filter_var()` 对其进行处理，将值清理为大于 1 的整数。然后将清理后的值赋给\
  \ `$quantity`。所有这些代码均使用三元运算符编写（在第 10 章“常见编程技巧”中介绍），以求简洁。如果写成 `if-else` 条件语句，相同的代码如下：\n\
  \n```php\nif (isset($_POST['quantity'])) {\n    $quantity = filter_var($_POST['quantity'],\
  \ FILTER_VALIDATE_INT, array('min_range' => 1));\n} else {\n    $quantity = NULL;\n\
  }\n```\n\n### 步骤 3：更改 `$price` 赋值\n\n将 `$price` 变量的赋值更改为：\n\n```php\n$price = (isset($_POST['price']))\
  \ ? filter_var($_POST['price'], FILTER_SANITIZE_NUMBER_FLOAT, FILTER_FLAG_ALLOW_FRACTION)\
  \ : NULL;\n```\n\n此代码重复了步骤 2 中的代码，不同之处在于清理过滤器要求数据为浮点数。额外的参数 `FILTER_FLAG_ALLOW_FRACTION`\
  \ 表示该值可以使用小数点。\n\n### 步骤 4：更改 `$tax` 赋值\n\n将 `$tax` 变量的赋值更改为：\n\n```php\n$tax =\
  \ (isset($_POST['tax'])) ? filter_var($_POST['tax'], FILTER_SANITIZE_NUMBER_FLOAT,\
  \ FILTER_FLAG_ALLOW_FRACTION) : NULL;\n```\n\n这重复了步骤 3 中的代码。\n\n### 步骤 5：测试\n\n\
