  \n## 12. Cookie 和 Session\n\n本章内容\n\n*   制作登录页面 368\n*   制作登录函数 371\n*   使用 Cookie\
  \ 376\n*   使用 Session 388\n*   提高 Session 安全性 396\n*   复习与实践 400\n\n\n\n\n\n###\
  \ 超文本传输协议 (HTTP) 是一种 `stateless` 技术\n\n超文本传输协议 (HTTP) 是一种 `stateless` 技术，这意味着每个单独的\
  \ HTML 页面都是一个无关的实体。HTTP 没有跟踪用户或在用户浏览网站时保留变量的方法。如果没有服务器跟踪用户的能力，就不可能有购物车或定制的网站个性化功能。使用像\
  \ PHP 这样的服务器端技术，你可以克服 Web 的无状态性。为此目的最好的两个 PHP 工具是 `cookies` 和 `sessions`。\n\nCookie\
  \ 和 Session 的关键区别在于：Cookie 将数据存储在用户的 Web 浏览器中，而 Session 将数据存储在服务器本身上。Session 通常比\
  \ Cookie 更安全，并且可以存储更多的信息。由于这两种技术在 PHP 中都很容易使用且值得掌握，本章将同时介绍 Cookie 和 Session。用于演示这些信息的示例将是一个登录系统，基于现有的\
  \ `sitename` 数据库。\n\n#### 制作登录页面\n\n登录过程仅涉及几个组件：\n\n*   一个用于提交登录信息的表单\n*   一个确认已提交必要信息的验证例程\n\
  *   一个将提交的信息与存储的信息进行比较的数据库查询\n*   用于存储反映登录成功数据的 Cookie 或 Session\n\n后续页面随后可以进行检查，以确认用户已登录（以限制对该页面的访问或添加功能）。当然，还有一个注销过程，它涉及清除代表已登录状态的\
  \ Cookie 或 Session 数据。\n\n为了开始这一切，让我们获取一些这些通用元素并将它们放入单独的文件中。然后，需要此功能的页面可以包含必要的文件。以这种方式分解逻辑将使一些后续脚本更易于阅读和编写，并减少冗余。你将定义两个可包含的文件。第一个脚本将包含登录页面的主要部分，包括页眉、错误报告、表单和页脚。\n\
  \n#### 脚本 12.1：`login_page.inc.php` 脚本\n\n`login_page.inc.php` 脚本创建完整的登录页面，包括表单，并报告任何错误。它将被其他需要显示登录页面的页面包含。\n\
  \n```\n<?php # Script 12.1 - login_page.inc.php\n// This page prints any errors\n\
  // associated with logging in\n// and it creates the entire login page,\n// including\
  \ the form.\n\n// Include the header:\n$page_title = 'Login';\ninclude ('includes/header.html');\n\
  \n// Print any error messages, if they exist:\nif (isset($errors) && !empty($errors))\
  \ {\n    echo '<h1>Error!</h1>\n<p class=\"error\">The following\n    error(s) occurred:<br\
  \ />';\n    foreach ($errors as $msg) {\n        echo \" - $msg<br />\\n\";\n  \
  \  }\n    echo '</p><p>Please try again.</p>';\n}\n\n// Display the form:\n?><h1>Login</h1>\n\
  <form action=\"login.php\" method=\"post\">\n    <p>Email Address: <input type=\"\
  text\"\n        name=\"email\" size=\"20\" maxlength=\"60\" />\n    </p>\n    <p>Password:\
  \ <input type=\"password\"\n        name=\"pass\" size=\"20\" maxlength=\"20\" />\n\
  \    </p>\n    <p><input type=\"submit\" name=\"submit\"\n        value=\"Login\"\
  \ /></p>\n</form>\n\n<?php include ('includes/footer.html'); ?>\n```\n\n#### 制作登录页面\n\
  \n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 页面，命名为 `login_page.inc.php`（脚本 12.1）：\n\n```\n\
  <?php # Script 12.1 - login_page.inc.php\n```\n\n**2.** 包含页眉：\n\n```\n$page_title\
  \ = 'Login';\ninclude ('includes/header.html');\n```\n\n本章将使用第 3 章“创建动态网站”中首创、第\
  \ 9 章“将 PHP 与 MySQL 结合使用”中修改的相同模板系统。\n\n**3.** 如果存在错误消息则打印它们：\n\n```\nif (isset($errors)\
  \ && !empty($errors)) {\n    echo '<h1>Error!</h1>\n    <p class=\"error\">The following\
  \ error(s) occurred:<br />';\n    foreach ($errors as $msg) {\n        echo \" -\
