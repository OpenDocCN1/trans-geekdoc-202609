  \ 3.9），如果尚未打开。\n\n**2.** 在第一个函数定义之后，开始定义第二个函数（**Script 3.10**）：\n\n```php\nfunction\
  \ calculate_trip_cost ($miles, $mpg, $ppg) {\n```\n\n`calculate_trip_cost()` 函数接受三个参数：行驶距离、平均每加仑英里数和平均每加仑价格。\n\
