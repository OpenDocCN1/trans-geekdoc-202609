  \n• `delete_user.php` 和 `edit_user.php` 脚本采取了哪些安全措施来防止恶意或意外删除？\n\n• 为什么可以在查询中直接使用\
  \ `$id` 值，而无需先通过 `mysqli_real_escape_string()` 处理？\n\n• 在什么情况下 `mysqli_affected_rows()`\
  \ 函数会返回假阴性（即报告没有记录受影响，尽管查询无错误运行）？\n\n• 什么是三元运算符？如何使用它？\n\n• 正确分页查询结果需要哪两个值？\n\n\
