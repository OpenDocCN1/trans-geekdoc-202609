  Login\" /></p>\n</form>\n```\n\nHTML 表单只需要两个文本输入框：一个用于电子邮件地址，另一个用于密码。输入框的名称与 `sitename`\
  \ 数据库 `users` 表中的名称相匹配（该登录系统即基于此数据库）。\n\n为了更容易创建 HTML 表单，首先关闭 PHP 部分。该表单不是粘性的，但你可以轻松添加代码来实现该功能。\n\
  \n**5.** 完成页面：\n\n```\n<?php include ('includes/footer.html'); ?>\n```\n\n**6.**\
  \ 将文件保存为 `login_page.inc.php` 并将其放在你的 Web 目录中（在 `includes` 文件夹中，与第 3 章和第 9 章的文件\
  \ `header.html`、`footer.html` 和 `style.css` 放在一起）。\n\n该页面将使用 `.inc.php` 扩展名，以表明它既是一个可包含的文件，又包含\
  \ PHP 代码。\n\n> **提示**\n>\n> 该脚本从 `includes` 目录中包含页眉和页脚文件，而该脚本本身也将位于同一目录中，这看起来可能不合逻辑。这段代码之所以有效，是因为该脚本将被主目录中的页面包含；因此包含引用是相对于父文件的，而不是相对于该文件的。\n\
  \n### 制作登录函数\n\n除了存储在 `login_page.inc.php` 中的登录页面外，还有一小部分功能将是本章中多个脚本的通用部分。在接下来的这个脚本中（也将被登录/注销系统中的其他页面包含），将定义两个函数。\n\
  \n首先，许多页面最终会将用户从一个页面重定向到另一个页面。例如，成功登录后，用户将被带到 `loggedin.php`。如果用户访问 `loggedin.php`\
  \ 但未登录，他们应该被带到 `index.php`。重定向使用第 11 章“Web 应用程序开发”中介绍的 `header()` 函数。重定向的语法是：\n\n\
  ```\nheader ('Location: http://www.example.com/page.php');\n```\n\n由于此函数会将浏览器发送到\
  \ `page.php`，因此应在之后立即使用 `exit()` 终止当前脚本：\n\n```\nheader ('Location: http://www.example.com/page.php');\n\
  exit();\n```\n\n如果不调用 `exit()`，当前脚本将继续运行（只是不在 Web 浏览器中）。\n\n`header()` 调用中的 location\
  \ 值应该是一个绝对 URL（`http://www.example.com/page.php` 而不是仅仅 `page.php`）。你可以将此值硬编码到每个\
  \ `header()` 调用中，或者更好的是，让 PHP 动态确定它。这个脚本中的第一个函数将做到这一点，然后将用户重定向到该绝对 URL。\n\n\n\n\n\
  \n#### 创建登录函数\n\n本章中多个脚本将使用的另一段代码用于验证登录表单。这是一个三步过程：\n\n1. 确认提供了电子邮件地址。\n2. 确认提供了密码。\n\
  3. 确认提供的电子邮件地址和密码与数据库中存储的匹配（注册过程中存储）。\n\n接下来的脚本将定义两个不同的函数。每个函数的工作细节将在后续步骤中解释。\n\n\
  #### 创建登录函数\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `login_functions.inc.php`（**脚本\
  \ 12.2**）：\n\n```php\n<?php # Script 12.2 - login_functions.inc.php\n```\n\n由于此文件将被其他文件包含，因此不需要包含任何\
  \ HTML。\n\n**2.** 开始定义一个新函数：\n\n```php\nfunction redirect_user ($page = 'index.php')\
  \ {\n```\n\n`redirect_user()` 函数将创建一个适合运行这些脚本的站点的绝对 URL，然后将用户重定向到该页面。动态执行此操作的好处（相对于硬编码\
  \ `http://www.example.com/page.php`）在于：你可以在一台服务器（如你自己的电脑）上开发代码，然后将其移至另一台服务器，而无需更改此代码。\n\
  \n该函数接受一个可选参数：最终目标页面名称。默认值为 `index.php`。\n\n**3.** 开始定义 URL：\n\n```php\n$url = 'http://'\
  \ . $_SERVER['HTTP_HOST'] . dirname($_SERVER['PHP_SELF']);\n```\n\n**脚本 12.2.**\
  \ `login_functions.inc.php` 脚本定义了两个函数，将在登录/注销过程中由不同脚本使用。\n\n```php\n1  <?php # Script\
  \ 12.2 - login_functions.inc.php\n2  // This page defines two functions used\n3\
  \  // by the login/logout process.\n4\n5  /* This function determines an absolute\n\
  6   * URL and redirects the user there.\n7   * The function takes one argument:\
  \ the\n8   * page to be redirected to.\n9   * The argument defaults to index.php.\n\
  10   */\n11  function redirect_user ($page = 'index.php') {\n12\n13      // Start\
  \ defining the URL...\n14      // URL is http:// plus the host name\n15      //\
  \ plus the current directory:\n16      $url = 'http://' . $_SERVER['HTTP_HOST']\
  \ . dirname($_SERVER['PHP_SELF']);\n17\n18      // Remove any trailing slashes:\n\
  19      $url = rtrim($url, '/\\\\');\n20\n21      // Add the page:\n22      $url\
  \ .= '/' . $page;\n23\n24      // Redirect the user:\n25      header(\"Location:\
  \ $url\");\n26      exit(); // Quit the script.\n27\n28  } // End of redirect_user()\
  \ function.\n29\n30\n31  /* This function validates the form data\n32   * (the email\
  \ address and password).\n33   * If both are present, the database is\n34   * queried.\n\
  35   * The function requires a database\n36   * connection.\n37   * The function\
  \ returns an array of\n38   * information, including:\n39   * - a TRUE/FALSE variable\
  \ indicating\n40   *   success\n41   * - an array of either errors or the\n42  \
  \ *   database result\n43   */\n44  function check_login($dbc, $email = '', $pass\
  \ = '') {\n45\n46      $errors = array(); // Initialize error array.\n47\n48   \
  \   // Validate the email address:\n49      if (empty($email)) {\n50          $errors[]\
  \ = 'You forgot to enter your email address.';\n51      } else {\n52          $e\
  \ = mysqli_real_escape_string($dbc, trim($email));\n53      }\n54\n55      // Validate\
  \ the password:\n56      if (empty($pass)) {\n57          $errors[] = 'You forgot\
  \ to enter your password.';\n58      } else {\n59          $p = mysqli_real_escape_string($dbc,\
  \ trim($pass));\n60      }\n61\n62      if (empty($errors)) { // If everything's\
  \ OK.\n63\n64          // Retrieve the user_id and first_name for that email/password\
  \ combination:\n65          $q = \"SELECT user_id, first_name FROM users WHERE email='$e'\
  \ AND pass=SHA1('$p')\";\n66          $r = @mysqli_query($dbc, $q); // Run the query.\n\
  67\n68          // Check the result:\n69          if (mysqli_num_rows($r) == 1)\
  \ {\n70\n71              // Fetch the record:\n72              $row = mysqli_fetch_array($r,\
  \ MYSQLI_ASSOC);\n73\n74              // Return true and the record:\n75       \
  \       return array(true, $row);\n76\n77          } else { // Not a match!\n78\
  \              $errors[] = 'The email address and password entered do not match\
  \ those on file.';\n79          }\n80\n81      } // End of empty($errors) IF.\n\
  82\n83      // Return false and the errors:\n84      return array(false, $errors);\n\
  85\n86  } // End of check_login() function.\n```\n\n首先，给 `$url` 赋值为 `http://` 加上主机名（可能是\
  \ `localhost` 或 `www.example.com`）。使用 `dirname()` 函数加上当前目录名，以防重定向发生在子文件夹内。`$_SERVER['PHP_SELF']`\
  \ 指向调用此函数的当前脚本（包含目录名）。该完整值可能是 `/somedir/page.php`。`dirname()` 函数将仅返回该值的目录部分（即 `/somedir/`）。\n\
  \n**4.** 从 URL 中移除任何尾部斜杠：\n\n```php\n$url = rtrim($url, '/\\\\');\n```\n\n因为子文件夹的存在可能会添加额外的斜杠（`/`）或反斜杠（`\\\
  `，用于 Windows），函数需要移除它们。为此，应用 `rtrim()` 函数。默认情况下，此函数从字符串右侧移除空格。如果提供第二个参数作为要移除的字符列表，它将移除那些字符。要移除的字符是\
  \ `/` 和 `\\`。但由于反斜杠是 PHP 中的转义字符，你需要使用 `\\\\` 来表示单个反斜杠。通过这行代码，如果 `$url` 以这些字符中的任何一个结尾，`rtrim()`\
  \ 函数将移除它们。\n\n**5.** 将特定页面追加到 URL：\n\n```php\n$url .= '/' . $page;\n```\n\n接下来，将特定页面名连接到\
  \ `$url`。它前面加上斜杠，因为第 4 步中移除了尾部斜杠，不能有 `www.example.compage.php` 这样的 URL。\n\n这看起来可能相当复杂，但这是一种非常有效的方法，可确保无论在什么服务器上、从什么目录运行脚本，重定向都能正常工作（只要重定向发生在该目录内）。\n\
  \n**6.** 重定向用户并完成函数：\n\n```php\nheader(\"Location: $url\");\nexit(); // Quit the\
  \ script.\n} // End of redirect_user() function.\n```\n\n最后步骤是发送 `Location` 头并终止脚本执行。\n\
  \n**7.** 开始一个新函数：\n\n```php\nfunction check_login($dbc, $email = '', $pass = '')\
  \ {\n```\n\n此函数将验证登录信息。它接受三个参数：数据库连接（必需）、电子邮件地址（可选）和密码（可选）。\n\n虽然此函数可以直接访问 `$_POST['email']`\
  \ 和 `$_POST['pass']`，但最好将这些值传递给函数，使函数更加独立。\n\n**8.** 验证电子邮件地址和密码：\n\n```php\n$errors\
  \ = array();\nif (empty($email)) {\n    $errors[] = 'You forgot to enter your email\
  \ address.';\n} else {\n    $e = mysqli_real_escape_string($dbc, trim($email));\n\
  }\nif (empty($pass)) {\n    $errors[] = 'You forgot to enter your password.';\n\
  } else {\n    $p = mysqli_real_escape_string($dbc, trim($pass));\n}\n```\n\n\n\n\
  \n此验证例程与注册页面中使用的类似。如果出现任何问题，它们将被添加到 `$errors` 数组中，该数组最终将在登录页面上使用（参见“制作登录页面”）。请注意，此\
  \ `$errors` 数组是函数的*局部*变量。即使名称相同，这也不是登录页面中使用的同一个 `$errors` 变量。函数后面的代码将返回此 `$errors`\
  \ 变量的值，而调用此函数的脚本中的代码会将返回值赋给合适的全局 `$errors` 数组，以便在登录页面上使用。\n\n**9.** 如果未发生错误，运行数据库查询：\n\
  \n```\nif (empty($errors)) {\n    $q = \"SELECT user_id, first_name FROM users WHERE\
  \ email='$e' AND pass=SHA1('$p')\";\n    $r = @mysqli_query ($dbc, $q);\n}\n```\n\
  \n该查询从数据库中选择 `user_id` 和 `first_name` 值，条件是提交的电子邮件地址（来自表单）与存储的电子邮件地址匹配，且提交密码的 `SHA1()`\
  \ 版本与存储的密码匹配。\n\n**10.** 检查查询结果：\n\n```\nif (mysqli_num_rows($r) == 1) {\n    $row\
  \ = mysqli_fetch_array ($r, MYSQLI_ASSOC);\n    return array(true, $row);\n}\n```\n\
  \n如果查询返回一行，则登录信息正确。然后将结果获取到 `$row` 中。成功登录的最后一步是将两条信息返回给请求脚本：布尔值 `true`，表示登录成功；以及从\
  \ MySQL 获取的数据。使用 `array()` 函数，该函数可以同时返回布尔值和 `$row` 数组。\n\n**11.** 如果查询未选中任何记录，创建一个错误：\n\
  \n```\n} else { // Not a match!\n    $errors[] = 'The email address and password\
  \ entered do not match those on file.';\n}\n```\n\n如果查询未返回一行，则向数组添加一条错误消息。它最终将显示在登录页面上。\n\
  \n**12.** 完成步骤 9 开始的条件语句并结束函数：\n\n```\n} // End of empty($errors) IF.\nreturn array(false,\
  \ $errors);\n} // End of check_login() function.\n```\n\n最后一步是让函数返回 `false` 值，表示登录失败，并返回\
  \ `$errors` 数组，其中存储了失败的原因。此 `return` 语句可以放在此处——即函数末尾而非条件语句内部——因为只有登录失败时，函数才会执行到此处。如果登录成功，步骤\
  \ 10 中的 `return` 行将停止函数继续执行（函数一旦执行 `return` 即停止）。\n\n**13.** 将文件保存为 `login_functions.inc.php`\
  \ 并将其放置在您的 Web 目录中（在 `includes` 文件夹内，与 `header.html`、`footer.html` 和 `style.css`\
  \ 在一起）。\n\n此页面也将使用 `.inc.php` 扩展名，以表明它既是一个可包含的文件，又包含 PHP 代码。\n\n与本书中创建的其他一些可包含文件一样（尽管\
  \ `login_page.inc.php` 除外），结束 PHP 标签——`?>`——被省略了。这样做可以防止潜在的复杂问题，即如果可包含文件在结束标签后有多余的空白或空行，可能会引发问题。\n\
  \n***\n\n**提示**\n\n本章中的脚本不包含调试代码（如 MySQL 错误或查询）。如果您在这些脚本上遇到问题，请应用第 8 章“错误处理与调试”中概述的调试技术。\n\
  \n***\n\n**提示**\n\n您可以在 `header()` 调用的 URL 中添加 `name=value` 对，以将值传递给目标页面：\n\n```\n\
  $url .= '?name=' . urlencode(value);\n```\n\n### 使用 Cookie\n\nCookie 是服务器在用户机器上存储信息的一种方式。这是网站在一次访问过程中记住或跟踪用户的一种方法。您可以将\
  \ Cookie 想象成名牌：您告诉服务器您的名字，它给您一张贴纸佩戴。然后它可以通过查看那张名牌来知道您是谁。\n\n#### 设置 Cookie\n\n关于\
  \ Cookie 最重要的一点是，它们必须在发送*任何其他信息*之前，从服务器发送到客户端。如果服务器尝试在 Web 浏览器已接收 HTML（甚至多余的空白字符）之后发送\
  \ Cookie，将导致错误消息，且 Cookie 不会被发送。这是迄今为止最常见的 Cookie 相关错误，但很容易修复。如果您看到此类消息：\n\n1. 记下\
  \ *output started at* 后面提到的脚本和行号。\n2. 打开该脚本并转到该行号。\n3. 删除该行输出的空白、行、文本、HTML 或其他任何内容。\n\
  \nCookie 通过 `setcookie()` 函数发送：\n\n```\nsetcookie (name, value);\nsetcookie ('name',\
  \ 'Nicole');\n```\n\n第二行代码将向浏览器发送一个名为 `name`、值为 `Nicole` 的 Cookie。\n\n您可以通过后续使用\
  \ `setcookie()` 函数继续向浏览器发送更多 Cookie：\n\n```\nsetcookie ('ID', 263);\nsetcookie ('email',\
  \ 'email@example.com');\n```\n\n\n\n### PHP 中的 Cookie 处理\n\n#### Cookie 命名约定\n关于\
  \ Cookie 的名称，最好不要使用空格或标点符号，并注意所用字母的大小写。\n\n#### 发送 Cookie\n\n### 1. 创建登录脚本\n在文本编辑器或\
  \ IDE 中新建一个 PHP 文档，命名为 `login.php`（**脚本 12.3 的脚本配合工作。该脚本还需要用到本章开头创建的两个文件。\n\n###\
  \ 2. 表单提交时包含辅助文件\n如果表单已提交，则包含这两个辅助文件：\n\n```\nif ($_SERVER['REQUEST_METHOD'] ==\
  \ 'POST') {\n    require ('includes/login_functions.inc.php');\n    require ('../mysqli_connect.php');\n\
  ```\n\n该脚本将执行两项任务：处理表单提交和显示表单。此条件语句用于检测提交行为。\n\n在条件语句内部，脚本必须同时包含 `login_functions.inc.php`\
  \ 和 `mysqli_connect.php`（后者创建于 第 9 章，且相对于本脚本应仍位于同一位置；如果你的 `mysqli_connect.php` 不在当前目录的父目录中，请修改此处的代码）。\n\
  \n我选择在两种情况下都使用 `require()` 而非 `include()`，因为无法包含这两个脚本中的任何一个都会导致登录过程无法进行。\n\n**脚本\
  \ 12.3.** 登录成功后，`login.php` 脚本会创建两个 Cookie 并重定向用户。\n\n```\n1   <?php # 脚本 12.3 -\
  \ login.php\n2   // 此页面处理登录表单\n3       // 的提交。\n4   // 登录成功后，用户将被\n5       // 重定向。\n\
  6   // 需要包含两个文件。\n7   // 在 setcookie() 行之前不要向\n8       // Web 浏览器发送任何内容！\n9\n10\
  \  // 检查表单是否已提交：\n11  if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n12\n13      //\
  \ 用于处理登录：\n14      require ('includes/login_functions.\n15          inc.php');\n\
  16\n17      // 需要数据库连接：\n18      require ('../mysqli_connect.php');\n19\n20    \
  \  // 验证登录：\n21      list ($check, $data) = check_login($dbc,\n22          $_POST['email'],\
  \ $_POST['pass']);\n23\n24      if ($check) { // 成功！\n25\n26          // 设置 Cookie：\n\
  27          setcookie ('user_id', $data\n28              ['user_id']);\n29     \
  \     setcookie ('first_name',\n30              $data['first_name']);\n31\n32  \
  \        // 重定向：\n33          redirect_user('loggedin.php');\n34\n35      } else\
  \ { // 失败！\n36\n37          // 将 $data 赋值给 $errors 以便\n38              // 在 login_page.inc.php\
  \ 文件中\n39          // 进行错误报告。\n40          $errors = $data;\n41\n42      }\n43\n\
  44      mysqli_close($dbc); // 关闭\n45          // 数据库连接。\n46\n47  } // 主提交条件语句结束。\n\
  48\n49  // 创建页面：\n50  include ('includes/login_page.inc.php');\n51  ?>\n```\n\n\
  ### 3. 验证表单数据\n验证表单数据：\n\n```\nlist ($check, $data) = check_login ($dbc, $_POST['email'],\
  \ $_POST['pass']);\n```\n\n包含这两个文件后，即可调用 `check_login()` 函数。该函数接收数据库连接（来自 `mysqli_connect.php`）、电子邮件地址和密码（均来自表单）。作为额外的预防措施，脚本可在调用函数前先确认这两个变量均已设置且非空。\n\
  \n该函数返回一个包含两个元素的数组：一个布尔值和一个数组（用户数据或错误信息）。要将这些返回值赋给变量，可使用 `list()` 函数。函数返回的第一个值（布尔值）将赋给\
  \ `$check`。第二个值（`$row` 或 `$errors` 数组）将赋给 `$data`。\n\n### 4. 登录成功时让用户登入\n如果用户输入的信息正确，则让其登入：\n\
  \n```\nif ($check) { // 成功！\n    setcookie ('user_id', $data['user_id']);\n    setcookie\
  \ ('first_name', $data['first_name']);\n```\n\n`$check` 变量指示登录尝试是否成功。如果其值为 TRUE，则\
  \ `$data` 包含用户的 ID 和名字。这两个值可用于 Cookie 中。\n\n一般来说，你**永远不应**将数据库表的主键值（如 `$data['user_id']`）存储在\
  \ Cookie 中，因为 Cookie 很容易被篡改。在本例中这不会造成问题，因为 `user_id` 值在网站中并未实际使用（存储它仅用于演示目的）。\n\n\
  ### 5. 重定向用户\n将用户重定向到另一页面：\n\n```\nredirect_user('loggedin.php');\n```\n\n使用本章前面定义的函数，用户登录成功后将被重定向到另一个脚本。具体的重定向目标页面是\
  \ `loggedin.php`。\n\n### 6. 完成条件语句并关闭连接\n完成 `$check` 条件语句（始于步骤 4），然后关闭数据库连接：\n\n\
  ```\n} else {\n    $errors = $data;\n}\n\nmysqli_close($dbc);\n```\n\n如果 `$check`\
  \ 的值为 FALSE，则 `$data` 变量存储的是 `check_login()` 函数内产生的错误信息。如果是这种情况，应将错误赋值给 `$errors`\
  \ 变量，因为显示登录页面的脚本代码——`login_page.inc.php`——期望使用该变量。\n\n### 7. 完成脚本\n结束主提交条件语句并包含登录页面：\n\
  \n```\n}\ninclude ('includes/login_page.inc.php');\n?>\n```\n\n`login.php` 脚本本身主要通过调用\
  \ `check_login()` 函数来执行验证，并处理 Cookie 和重定向。`login_page.inc.php` 文件包含登录页面本身，因此只需将其包含进来即可。\n\
  \n### 8. 保存并测试\n将文件保存为 `login.php`，放置在你的 Web 目录中（与 第 9 章 的文件在同一文件夹），并在 Web 浏览器中加载此页面（参见\
  \ ![Image](img/graycircle-b.jpg) “制作登录页面”）。\n\n如果愿意，你可以错误地提交表单进行测试，但目前还无法正确登录，因为最终的目标页面——`loggedin.php`——尚未编写。\n\
  \n---\n\n> **提示**\n> Cookie 限制为总共约 4 KB 的数据，且每个 Web 浏览器能记住的来自同一站点的 Cookie 数量有限。目前大多数浏览器的限制是\
  \ 50 个 Cookie（但如果你要发送 50 个不同的 Cookie，你可能需要重新考虑你的做法）。\n\n---\n\n> **提示**\n> `setcookie()`\
  \ 函数是 PHP 中极少数可能在不同浏览器中产生不同结果的函数之一，因为每个浏览器处理 Cookie 的方式各不相同。请务必在不同平台的多种浏览器中测试你的网站，以确保一致性。\n\
  \n---\n\n> **提示**\n> 如果前两个包含的文件向 Web 浏览器发送了任何内容，甚至在结束 PHP 标记后有空行或空格，你将会看到 *headers\
  \ already sent*（标头已发送）错误。这就是为什么这两个文件都不包含结束 PHP 标记的原因。\n\n#### 访问 Cookie\n要从 Cookie\
  \ 中检索值，只需引用 `$_COOKIE` 超全局变量，并使用相应的 Cookie 名称作为键（就像操作任何数组一样）。例如，要检索通过以下行建立的 Cookie\
  \ 的值：\n\n```\nsetcookie ('username', 'Trout');\n```\n\n你应该引用 `$_COOKIE['username']`。在下面的示例中，`login.php`\
  \ 脚本设置的 Cookie 将以两种方式被访问。首先，会检查用户是否已登录（否则，他们不应访问此页面）。其次，将使用存储在 Cookie 中的名字来欢迎用户。\n\
  \n#### 访问 Cookie\n\n### 1. 创建登录后页面\n在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `loggedin.php`（**[脚本\
  \ 12.4](#ch12.html#ch12ex04）**）：\n\n```\n<?php # 脚本 12.4 - loggedin.php\n```\n\n\
  用户登录成功后将被重定向到此页面。该脚本将使用 Cookie 中的名字来欢迎用户。\n\n### 2. 检查 Cookie 是否存在\n检查 Cookie 是否存在。\n\
  \n\n\n### 检查用户登录状态\n\n```php\nif (!isset($_COOKIE['user_id'])) {\n```\n\n由于用户只有在登录后才应访问此页面，因此需检查一个本应在\
  \ **`login.php`** 中设置的 Cookie。\n\n### 3. 未登录则重定向用户\n\n```php\nrequire ('includes/login_functions.inc.php');\n\
  redirect_user();\n}\n```\n\n若用户未登录，将自动重定向至主页。这是限制内容访问的简单方法。\n\n### 4. 引入页面页眉\n\n\
  ```php\n$page_title = 'Logged In!';\ninclude ('includes/header.html');\n```\n\n\
  **脚本 12.4** `loggedin.php` 脚本利用存储的 Cookie 向用户显示问候语。\n\n---\n\n```php\n<?php # Script\
  \ 12.4 - loggedin.php\n// The user is redirected here from\n    login.php.\n\n//\
  \ If no cookie is present, redirect the\n    user:\nif (!isset($_COOKIE['user_id']))\
  \ {\n\n    // Need the functions:\n    require ('includes/login_functions.\n   \
  \     inc.php');\n    redirect_user();\n}\n\n// Set the page title and include the\n\
  \    HTML header:\n$page_title = 'Logged In!';\ninclude ('includes/header.html');\n\
  \n// Print a customized message:\necho \"<h1>Logged In!</h1>\n<p>You are now logged\
  \ in, {$_COOKIE\n    ['first_name']}!</p>\n<p><a href=\\\"logout.php\\\">Logout</a></p>\"\
  ;\n\ninclude ('includes/footer.html');\n?>\n```\n\n---\n\n### 5. 欢迎用户，引用 Cookie\
  \ 信息\n\n```php\necho \"<h1>Logged In!</h1>\n<p>You are now logged in, {$_COOKIE['first_name']}!</p>\n\
  <p><a href=\\\"logout.php\\\">Logout </a></p>\";\n```\n\n为按姓名问候用户，请引用 **`$_COOKIE['first_name']`**\
  \ 变量（用花括号括起以避免解析错误）。同时也会打印一个指向注销页面（本章稍后编写）的链接。\n\n### 6. 完成 HTML 页面\n\n```php\n\
  include ('includes/footer.html');\n?>\n```\n\n### 7. 保存并测试\n\n将文件保存为 **`loggedin.php`**，置于\
  \ Web 目录下（与 **`login.php`** 同一文件夹），通过 **`login.php`** 登录，在浏览器中测试。\n\n![Image](img/12_figure_09_d.jpg)\n\
  \n若使用正确的邮箱地址和密码，登录后将看到此页面。\n\n由于这些示例使用与 第 9 章 相同的数据库，你应能使用当时注册的用户名和密码登录。\n\n###\
  \ 8. 查看 Cookie 设置情况\n\n更改浏览器的 Cookie 设置并再次测试，以查看 Cookie 的设置过程。\n\n![Image](img/12_figure_10_e.jpg)\n\
  \n`user_id` Cookie，值为 1。\n\n![Image](img/12_figure_11_f.jpg)\n\n`first_name` Cookie，值为\
  \ *Larry*（你的值可能不同）。\n\n---\n\n> **Tip**\n>\n> 部分浏览器（如 Internet Explorer）不会针对通过 localhost\
  \ 发送的 Cookie 遵循你的 Cookie 提示偏好设置。\n\n---\n\n> **Tip**\n>\n> Cookie 在设置页面（如 **`login.php`**）重新加载或访问另一页面前不可访问（即无法在同一页面中设置并访问\
  \ Cookie）。\n\n---\n\n> **Tip**\n>\n> 若用户拒绝 Cookie 或浏览器设置为不接受 Cookie，本例中即使登录成功也会自动重定向至主页。因此，你可能需要告知用户必须启用\
  \ Cookie。\n\n---\n\n### 设置 Cookie 参数\n\n虽仅向 **`setcookie()`** 函数传递名称和值参数即可满足需求，但你应了解其他可用参数。该函数最多可接受五个额外参数，每个参数都会改变\
  \ Cookie 的定义。\n\n```php\nsetcookie (name, value, expiration, path, host, secure,\
  \ httponly);\n```\n\n`expiration` 参数用于设置 Cookie 的确切存活时长，单位为自 *纪元*（1970 年 1 月 1 日午夜）以来的秒数。若未设置或设为\
  \ 0，Cookie 将持续有效直到用户关闭浏览器。这类 Cookie 称为会话 Cookie（如图所示）。\n\n要设定具体过期时间，可将分钟数或小时数加到当前时刻（通过\
  \ **`time()`** 函数获取）。以下代码将 Cookie 过期时间设为当前时刻起 30 分钟（60 秒 × 30 分钟）后：\n\n```php\n\
  setcookie (name, value, time()+1800);\n```\n\n`path` 和 `host` 参数用于将 Cookie 限制在网站的特定文件夹（`path`）或特定主机（**www.example.com**\
  \ 或 *192.168.0.1*）。例如，可将 Cookie 限制仅在域名的 `admin` 文件夹（及其子文件夹）内有效：\n\n```php\nsetcookie\
  \ (name, value, expire, '/admin/');\n```\n\n将路径设为 **`/`** 可使 Cookie 在整个域名（网站）下可见。将域名设为\
  \ **`.example.com`** 可使 Cookie 在整个域名及所有子域名（**www.example.com**、**admin.example.com**、**pages.example.com**\
  \ 等）下可见。\n\n**脚本 12.5** `login.php` 脚本现使用 `setcookie()` 函数的所有参数。\n\n---\n\n```php\n\
  <?php # Script 12.5 - login.php #2\n// This page processes the login form\n    submission.\n\
  // The script now adds extra parameters\n    to the setcookie() lines.\n\n// Check\
  \ if the form has been submitted:\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n\
  \n    // Need two helper files:\n    require ('includes/login_functions.\n     \
  \   inc.php');\n    require ('../mysqli_connect.php');\n\n    // Check the login:\n\
  \    list ($check, $data) = check_login\n        ($dbc, $_POST['email'], $_POST['pass']);\n\
  \n    if ($check) { // OK!\n\n        // Set the cookies:\n        setcookie ('user_id',\
  \ $data\n            ['user_id'], time()+3600,\n            '/', '', 0, 0);\n  \
  \      setcookie ('first_name', $data\n            ['first_name'], time()+3600,\n\
  \            '/', '', 0, 0);\n\n        // Redirect:\n        redirect_user('loggedin.php');\n\
  \n    } else { // Unsuccessful!\n\n        // Assign $data to $errors for\n    \
  \        login_page.inc.php:\n        $errors = $data;\n\n    }\n\n    mysqli_close($dbc);\
  \ // Close the\n        database connection.\n\n} // End of the main submit conditional.\n\
  \n// Create the page:\ninclude ('includes/login_page.inc.php');\n?>\n```\n\n---\n\
  \n`secure` 值规定 Cookie 仅通过安全的 HTTPS 连接发送。值 1 表示必须使用安全连接，值 0 表示标准连接即可。\n\n```php\n\
  setcookie (name, value, expire, path, host, 1);\n```\n\n若网站使用安全连接，也应将 Cookie 限制为仅通过\
  \ HTTPS 传输。\n\n最后，PHP 5.2 新增了 `httponly` 参数。布尔值用于使 Cookie 仅通过 HTTP（和 HTTPS）访问。强制此限制可提高\
  \ Cookie 安全性（防止某些攻击），但在撰写本文时并非所有浏览器都支持。\n\n```php\nsetcookie (name, value, expire,\
  \ path, host, secure, TRUE);\n```\n\n与所有接受参数的函数一样，必须按顺序传递 **`setcookie()`** 的值。要跳过某参数，请使用\
  \ **`NULL`**、0 或空字符串（勿用 **`FALSE`**）。`expiration` 和 `secure` 均为整数，故不加引号。\n\n\n\n\
  为了演示这些信息，我们给登录 Cookie 添加一个过期设置，使其仅持续一小时。\n\n#### 设置 Cookie 的参数\n\n**1.** 在文本编辑器中打开\
  \ `login.php`（参考 脚本 12.3），如果尚未打开的话。\n\n**2.** 修改两行 `setcookie()` 代码，加入一个 60 分钟后过期的过期日期（脚本\
  \ 12.5）：\n\n```\nsetcookie ('user_id', $data['user_id'], time()+3600, '/', '', 0,\
  \ 0);\n\nsetcookie ('first_name', $data['first_name'], time()+3600, '/', '', 0,\
  \ 0);\n```\n\n将过期日期设为 `time() + 3600`（60 分钟乘以 60 秒）后，Cookie 将在设置后继续存在一小时。在进行此更改时，其他每个参数都被显式指定了。\n\
  \n对于最后一个参数（接受布尔值），你也可以用 0 代表 FALSE（PHP 会为你处理转换）。这样做是个好主意，因为在任何 Cookie 参数中使用 `false`\
  \ 都可能导致问题。\n\n**3.** 保存脚本，将其放入你的 Web 目录，并在 Web 浏览器中通过登录进行测试 ![Image](img/circle-g.jpg)。\n\
  \n![Image](img/12_figure_12_g.jpg)\n\n![Image](img/circle-g.jpg)对 `setcookie()`\
  \ 参数的更改（如过期日期和时间）将反映在发送给 Web 浏览器的 Cookie 中（与 ![Image](img/graycircle-f.jpg) 对比）。\n\
  \n***\n\n提示\n\n某些浏览器在处理未列出所有参数的 Cookie 时会有困难。显式声明每个参数——即使是空字符串——将在所有浏览器中获得更可靠的结果。\n\
  \n***\n\n提示\n\n以下是关于 Cookie 过期的一些通用准则：如果 Cookie 应在用户会话期间一直有效，则不要设置过期时间；如果 Cookie\
  \ 应在用户关闭并重新打开浏览器后继续存在，则将过期时间设为几周或几个月后；如果 Cookie 可能构成安全风险，则将过期时间设为一小时或更短，以便用户离开浏览器后\
  \ Cookie 不会存在过长时间。\n\n***\n\n提示\n\n出于安全目的，你可以将 Cookie 的过期时间设为 5 或 10 分钟，并在用户访问的每个新页面上重新发送该\
  \ Cookie（假设 Cookie 存在）。这样，只要用户保持活跃，Cookie 就会持续存在，但在用户最后一次操作后 5 或 10 分钟会自动失效。\n\n\
  ***\n\n提示\n\n电子商务和其他涉及隐私的 Web 应用程序应对所有事务（包括 Cookie）使用 SSL（安全套接字层）连接。\n\n***\n\n\
  提示\n\n要小心由目录中的脚本创建的 Cookie。如果未指定路径，则该 Cookie 将仅对该同一目录中的其他脚本可用。\n\n***\n\n#### 删除\
  \ Cookie\n\n关于使用 Cookie 最后需要了解的是如何删除一个。虽然 Cookie 会在用户关闭浏览器或达到过期日期/时间时自动过期，但通常你会想手动删除\
  \ Cookie。例如，在具有登录功能的网站中，你会希望在用户注销时删除所有 Cookie。\n\n虽然 `setcookie()` 函数最多可接受七个参数，但实际只需要一个——Cookie\
  \ 名称。如果你发送一个仅包含名称而无值的 Cookie，其效果等同于删除同名的现有 Cookie。例如，要创建 `first_name` Cookie，你可以使用这行代码：\n\
  \n```\nsetcookie('first_name', 'Tyler');\n```\n\n要删除 `first_name` Cookie，你可以编写：\n\
  \n```\nsetcookie('first_name');\n```\n\n作为额外的预防措施，你也可以设置一个过去的过期日期：\n\n```\nsetcookie('first_name',\
  \ '', time()-3600);\n```\n\n为了演示所有这些，我们给网站添加注销功能。注销页面的链接位于 `loggedin.php` 中。\n\n\
  作为一项额外功能，将修改页头文件，以便在用户登录时显示*注销*链接，在用户注销时显示*登录*链接。\n\n#### 删除 Cookie 的步骤\n\n**1.**\
  \ 在文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `logout.php`（脚本 12.6）：\n\n```\n<?php # Script 12.6\
  \ - logout.php\n```\n\n**2.** 检查 `user_id` Cookie 是否存在；如果不存在，重定向用户：\n\n```\nif (!isset($_COOKIE['user_id']))\
  \ {\n\n  require ('includes/login_functions.inc.php');\n  redirect_user();\n```\n\
  \n**脚本 12.6.** `logout.php` 脚本删除先前建立的 Cookie。\n\n***\n\n```\n1  <?php # Script 12.6\
  \ - logout.php\n2  // This page lets the user logout.\n3\n4  // If no cookie is\
  \ present, redirect the\n    user:\n5  if (!isset($_COOKIE['user_id'])) {\n6\n7\
  \      // Need the function:\n8      require ('includes/login_functions.\n     \
  \   inc.php');\n9      redirect_user();\n10\n11  } else { // Delete the cookies:\n\
  12      setcookie ('user_id', '', time()-3600,\n          '/', '', 0, 0);\n13  \
  \    setcookie ('first_name', '',\n          time()-3600, '/', '', 0, 0);\n14  }\n\
  15\n16  // Set the page title and include the\n    HTML header:\n17  $page_title\
  \ = 'Logged Out!';\n18  include ('includes/header.html');\n19\n20  // Print a customized\
  \ message:\n21  echo \"<h1>Logged Out!</h1>\n22  <p>You are now logged out, {$_COOKIE\n\
  \      ['first_name']}!</p>\";\n23\n\n24  include ('includes/footer.html');\n25\
  \  ?>\n```\n\n***\n\n与 `loggedin.php` 一样，如果用户尚未登录，此页面应将用户重定向到主页。尝试注销一个未登录的用户是毫无意义的！\n\
  \n**3.** 如果 Cookie 存在则将其删除：\n\n```\n} else {\n  setcookie ('user_id', '', time()-3600,\
  \ '/', '', 0, 0);\n  setcookie ('first_name', '', time()-3600, '/', '', 0, 0);\n\
  }\n```\n\n如果用户已登录，这两个 Cookie 将有效地删除现有的 Cookie。除值和过期时间外，其他参数的值应与创建 Cookie 时相同。\n\n\
  **4.** 完成 PHP 页面的其余部分：\n\n```\n$page_title = 'Logged Out!';\ninclude ('includes/header.html');\n\
  echo \"<h1>Logged Out!</h1>\n<p>You are now logged out, {$_COOKIE['first_name']}!</p>\"\
  ;\ninclude ('includes/footer.html');\n?>\n```\n\n该页面本身也很像 `loggedin.php` 页面。虽然你可能会觉得奇怪，明明刚在脚本中删除了\
  \ `first_name` Cookie，却仍能引用它，但考虑到这个过程，这完全讲得通：\n\n**A.** 客户端请求此页面。\n\n**B.** 服务器从客户端浏览器读取可用的\
  \ Cookie。\n\n**C.** 页面运行并执行其任务（包括发送用于删除现有 Cookie 的新 Cookie）。\n\n简而言之，当此脚本首次运行时，原始的\
  \ `first_name` Cookie 数据可供使用。此页面发送的那组 Cookie（删除用的 Cookie）对此页面不可用，因此原始值仍可使用。\n\n\
  **5.** 将文件保存为 `logout.php` 并放入你的 Web 目录（与 `login.php` 同一文件夹）。\n\n#### 创建注销链接\n\n\
  **1.** 在文本编辑器或 IDE 中打开 `header.html`（参考 脚本 9.1）。\n\n**2.** 将第五个也是最后一个链接修改为（脚本 12.7）：\n\
  \n```\n<li><?php\nif ( (isset($_COOKIE['user_id'])) && (basename($_SERVER['PHP_SELF'])\
  \ != 'logout.php') ) {\n  echo '<a href=\"logout.php\"> Logout</a>';\n} else {\n\
  \  echo '<a href=\"login.php\"> Login</a>';\n}\n?></li>\n```\n\n导航区不应再有永久的登录链接，而应根据\
  \ Cookie 的存在与否，在用户未登录时显示*登录*链接 ![Image](img/circle-h.jpg)，在用户已登录时显示*注销*链接 ![Image](img/circle-i.jpg)。前面的条件语句恰好能实现这一点。\n\
  \n![Image](img/12_figure_13_h.jpg)\n\n\n\n![Image](img/circle-h.jpg)带有 `Login` 链接的主页。\n\
  \n![Image](img/12_figure_14_i.jpg)\n\n![Image](img/circle-i.jpg)用户登录后，页面现在有一个 `Logout`\
  \ 链接。\n\n**脚本 12.7.** `header.html` 文件现在根据用户的当前状态显示 `Login` 或 `Logout` 链接。\n\n***\n\
  \n```html\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n       1.0 Strict//EN\"\
  \ \"http://www.w3.org/TR/\n       xhtml1/DTD/xhtml1-strict.dtd\">\n2   <html xmlns=\"\
  http://www.w3.org/1999/\n       xhtml\">\n3   <head>\n4       <title><?php echo\
  \ $page_title; ?>\n       </title>\n5       <link rel=\"stylesheet\" href=\"includes/\n\
  \       style.css\" type=\"text/css\"\n       media=\"screen\" />\n6       <meta\
  \ http-equiv=\"content-type\"\n       content=\"text/html; charset=utf-8\" />\n\
  7   </head>\n8   <body>\n9       <div id=\"header\">\n10          <h1>Your Website</h1>\n\
  11          <h2>catchy slogan...</h2>\n12      </div>\n13      <div id=\"navigation\"\
  >\n14          <ul>\n15              <li><a href=\"index.php\">Home\n       Page</a></li>\n\
  16              <li><a href=\"register.\n       php\">Register</a></li>\n17    \
  \          <li><a href=\"view_users.\n       php\">View Users</a></li>\n18     \
  \         <li><a href=\"password.\n       php\">Change Password</a></li>\n19   \
  \           <li><?php // Create a login/\n       logout link:\n20  if ( (isset($_COOKIE['user_id']))\n\
  \       && (basename($_SERVER['PHP_SELF'])\n       != 'logout.php') ) {\n21    \
  \  echo '<a href=\"logout.php\">Logout\n       </a>';\n22  } else {\n23      echo\
  \ '<a href=\"login.php\">Login</a>';\n24  }\n25  ?></li>\n26          </ul>\n27\
  \      </div>\n28      <div id=\"content\"><!-- Start of the\n       page-specific\
  \ content. -->\n29  <!-- Script 12.7 - header.html -->\n```\n\n***\n\n对于该条件，如果 Cookie\
  \ 已设置，则用户已登录并可显示注销链接。如果 Cookie 未设置，则应向用户显示登录链接。但有一个问题：因为 `logout.php` 脚本通常会显示注销链接（因为在首次查看页面时\
  \ Cookie 存在），所以条件判断还必须检查当前页面不是 `logout.php` 脚本。动态确定当前页面的一个简单方法是将 `basename()` 函数应用于\
  \ `$_SERVER['PHP_SELF']`。\n\n**3.** 保存文件，将其放在 Web 目录中（在 `includes` 文件夹内），并在 Web\
  \ 浏览器中测试登录/注销过程 ![Image](img/circle-j.jpg)。\n\n![Image](img/12_figure_15_j.jpg)\n\
  \n![Image](img/circle-j.jpg)注销后的结果。\n\n***\n\n### 提示\n\n要在浏览器中查看 `logout.php` 脚本中\
  \ `setcookie()` 调用的结果，请开启 Cookie 提示功能 ![Image](img/circle-k.jpg)。\n\n![Image](img/12_figure_16_k.jpg)\n\
  \n![Image](img/circle-k.jpg)这是删除 Cookie 在 Firefox 提示框中的显示方式（与 ![Image](img/graycircle-g.jpg)\
  \ 对比）。\n\n***\n\n### 提示\n\n由于 Windows 版 Internet Explorer 处理 Cookie 的方式存在 Bug，为了让注销过程在您自己的电脑上开发时（即通过\
  \ *localhost* 访问）正常工作，您可能需要将 *host* 参数设置为 `false`（不带引号）。\n\n***\n\n### 提示\n\n删除\
  \ Cookie 时，您应始终使用设置 Cookie 时的相同参数（自然是除了值和过期时间之外）。如果您在创建 Cookie 时设置了主机和路径，请在删除 Cookie\
  \ 时再次使用它们。\n\n***\n\n### 提示\n\n为了加深印象，请记住 Cookie 的删除直到页面重新加载或访问另一个页面才会生效。换句话说，在页面删除\
  \ Cookie 之后，该 Cookie 仍将可供该页面使用。\n\n***\n\n### 使用会话\n\n使数据可供网站多个页面使用的另一种方法是使用*会话*。会话的原理是数据存储在服务器上，而不是\
  \ Web 浏览器中，并使用会话标识符来定位特定用户的记录（会话数据）。此会话标识符通常通过 Cookie 存储在用户的 Web 浏览器中，但敏感数据本身——如用户\
  \ ID、姓名等——始终保留在服务器上。\n\n可能会出现这样的问题：既然 Cookie 工作得很好，为什么还要使用会话？首先，会话可能更安全，因为所有记录的信息都存储在服务器上，而不是在服务器和客户端之间不断来回发送。其次，您可以在会话中存储更多数据。第三，一些用户会拒绝\
  \ Cookie 或完全将其关闭。会话虽然设计为配合 Cookie 工作，但也可以在没有 Cookie 的情况下运行。\n\n为了演示会话——并将其与 Cookie\
  \ 进行比较——让我们重写之前的那组脚本。\n\n#### 设置会话变量\n\n关于会话最重要的规则是，每个将要使用会话的页面都必须以调用 `session_start()`\
  \ 函数开始。此函数告诉 PHP 开始一个新会话或访问一个现有会话。必须在向 Web 浏览器发送任何内容之前调用此函数！\n\n首次使用此函数时，`session_start()`\
  \ 将尝试发送一个名为 `PHPSESSID`（默认会话名称）且值类似于 `a61f8670baa8e90a30c878df89a2074b`（32 位十六进制字母，即会话\
  \ ID）的 Cookie。由于尝试发送 Cookie，`session_start()` 必须在向 Web 浏览器发送任何数据之前调用，就像使用 `setcookie()`\
  \ 和 `header()` 函数时一样。\n\n***\n\n### 会话 vs. Cookie\n\n本章通过示例展示了如何使用 Cookie 和会话分别完成相同的任务——登录和注销。显然，两者在\
  \ PHP 中都很容易使用，但真正的问题是何时使用其中一种。\n\n与 Cookie 相比，会话具有以下优势：\n\n*   它们通常更安全（因为数据保留在服务器上）。\n\
  *   它们允许存储更多数据。\n*   它们可以在没有 Cookie 的情况下使用。\n\n而 Cookie 相对于会话具有以下优势：\n\n*   它们更易于编程。\n\
  *   它们占用较少的服务器资源。\n*   它们可以持续更长的时间。\n\n一般来说，要存储和检索仅几条小信息，或存储较长时间的信息，请使用 Cookie。但对于您的大多数\
  \ Web 应用程序，您将使用会话。\n\n***\n\n**脚本 12.8.** 此版本的 `login.php` 脚本使用会话代替 Cookie。\n\n\
  ***\n\n```php\n1   <?php # Script 12.8 - login.php #3\n2   // This page processes\
  \ the login form\n       submission.\n3   // The script now uses sessions.\n4\n\
  5   // Check if the form has been submitted:\n6   if ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n7\n8       // Need two helper files:\n9       require ('includes/login_functions.\n\
  \       inc.php');\n10      require ('../mysqli_connect.php');\n11\n12      // Check\
  \ the login:\n13      list ($check, $data) = check_login($dbc,\n       $_POST['email'],\
  \ $_POST['pass']);\n14\n15      if ($check) { // OK!\n16\n17          // Set the\
  \ session data:\n18          session_start();\n19          $_SESSION['user_id']\
  \ =\n               $data['user_id'];\n20          $_SESSION['first_name'] =\n \
  \              $data['first_name'];\n21\n22          // Redirect:\n23          redirect_user('loggedin.php');\n\
  24\n25      } else { // Unsuccessful!\n26\n27          // Assign $data to $errors\
  \ for\n               login_page.inc.php:\n28          $errors = $data;\n29\n30\
  \      }\n31\n32      mysqli_close($dbc); // Close the\n       database connection.\n\
  33\n34  } // End of the main submit conditional.\n35\n36  // Create the page:\n\
  37  include ('includes/login_page.inc.php');\n38  ?>\n```\n\n\n\n会话启动后，可以使用正常的数组语法，通过\
  \ `$_SESSION` 超全局变量向会话注册值：\n\n```php\n$_SESSION['key'] = value;\n$_SESSION['name']\
  \ = 'Roxanne';\n$_SESSION['id'] = 48;\n```\n\n让我们根据这一点更新 `login.php` 脚本。\n\n###\
  \ 开启会话\n\n**1.** 在文本编辑器或 IDE 中打开 `login.php`（参考 脚本 12.5）。\n\n**2.** 将 `setcookie()`\
  \ 代码行（第 18-19 行）替换为以下代码行（**脚本 12.8**）：\n\n```php\nsession_start();\n$_SESSION['user_id']\
  \ = $data['user_id'];\n$_SESSION['first_name'] = $data['first_name'];\n```\n\n第一步是开启会话。由于在此之前脚本中没有\
  \ `echo` 语句、HTML 文件包含，甚至没有空白字符，因此此时在脚本中使用 `session_start()` 是安全的（尽管函数调用也可以放在脚本顶部）。然后，向\
  \ `$_SESSION` 超全局数组添加两个*键值对*，以将用户的名字和用户 ID 注册到会话中。\n\n**3.** 将页面另存为 `login.php`，放入您的\
  \ Web 目录，并在 Web 浏览器中测试 ![Image](img/circle-a.jpg)。\n\n![Image](img/12_figure_17_a.jpg)\n\
  \n![Image](img/circle-a.jpg) 登录表单对最终用户而言保持不变，但底层功能现在使用会话。\n\n虽然 `loggedin.php`、页眉和脚本需要重写，但您仍然可以测试登录脚本并查看生成的\
  \ Cookie ![Image](img/circle-b.jpg)。`loggedin.php` 页面应该会将您重定向回主页，因为它仍在检查 `$_COOKIE`\
  \ 变量是否存在。\n\n![Image](img/12_figure_18_b.jpg)\n\n![Image](img/circle-b.jpg) 这个 Cookie\
  \ 由 PHP 的 `session_start()` 函数创建，在用户浏览器中存储会话 ID。\n\n***\n\n**提示**\n\n由于会话通常会发送和读取\
  \ Cookie，您应始终尝试尽早在脚本中开启它们。这样做有助于避免在头部信息（HTML 或空白字符）已发送后尝试发送 Cookie 的问题。\n\n***\n\
  \n***\n\n**提示**\n\n如果您愿意，可以在 `php.ini` 文件中将 `session.auto_start` 设置为 1，这样就无需在每个页面上使用\
  \ `session_start()`。这会给服务器带来更大的负担，因此，如果不考虑具体情况，不应使用此设置。\n\n***\n\n***\n\n**提示**\n\
  \n您可以在会话中存储数组（使 `$_SESSION` 成为多维数组），就像存储字符串或数字一样。\n\n***\n\n#### 访问会话变量\n\n一旦会话启动并向其注册了变量，您就可以创建其他脚本来访问这些变量。为此，每个脚本必须首先使用\
  \ `session_start()` 启用会话。\n\n如果该函数能读取存储在 Cookie 中的 `PHPSESSID` 值，它将使当前脚本能够访问先前启动的会话；如果不能，则会创建一个新会话。请理解，如果找不到当前会话\
  \ ID 并生成了新的会话 ID，则存储在旧会话 ID 下的所有数据将不可用。我在此提及这一点是因为如果您在会话方面遇到问题，检查会话 ID 值以查看其是否从一页到下一页发生变化，是第一步调试措施。\n\
  \n假设访问当前会话没有问题，要引用会话变量，请使用 `$_SESSION['var']`，就像引用任何其他数组一样。\n\n**脚本 12.9.** `loggedin.php`\
  \ 脚本已更新，使其引用 `$_SESSION` 而非 `$_COOKIE`（需在两行进行更改）。\n\n***\n\n```php\n<?php # 脚本 12.9\
