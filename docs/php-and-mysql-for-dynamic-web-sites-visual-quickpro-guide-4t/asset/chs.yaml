  \n*未提供电子邮件地址也会导致错误。*\n\n#### 6. 创建一个新的随机密码\n\n```php\nif ($uid) {\n    $p = substr\
  \ ( md5(uniqid(rand( ), true)), 3, 10);\n```\n\n创建新的随机密码将用到四个 PHP 函数。第一个是 `uniqid()`，它会返回一个唯一标识符。它接收参数\
  \ `rand()` 和 `true`，这使得返回的字符串更加随机。然后将此返回值传递给 `md5()` 函数，该函数计算字符串的 MD5 哈希值。此时，返回唯一\
  \ ID 的哈希版本，最终是一个长度为 32 个字符的字符串。这部分代码类似于 `activate.php`（脚本 18.7）中用于创建激活码的代码。\n\n\
  然后使用 `substr()` 函数，从该字符串的第三个字符开始提取十个字符来创建密码。总而言之，这段代码将返回一个非常随机且无意义的十字符字符串（包含字母和数字）作为临时密码。\n\
  \n请注意，仅当 `$uid` 此时具有 TRUE 值时，才需要创建新的随机密码。\n\n#### 7. 在数据库中更新密码\n\n```php\n$q = \"\
