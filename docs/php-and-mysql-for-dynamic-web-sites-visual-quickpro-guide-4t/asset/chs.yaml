  \ 函数用于确认给定名称的变量是否存在。\n\n---\n\n> **提示**\n>\n> `filter_input_array()` 函数允许您在一步中将一组过滤器应用于一组变量。有关详细信息（或许会让您大吃一惊），请参阅\
  \ PHP 手册。\n\n---\n\n### 防止 SQL 注入攻击\n\n恶意用户可能尝试的另一种攻击类型是 *SQL 注入* 攻击。顾名思义，这些攻击试图将恶意代码插入网站的\
  \ SQL 查询中。此类攻击的一个目的是制造语法上无效的查询，从而在生成的错误消息中泄露有关脚本或数据库的信息。更大的企图是注入攻击可能会篡改、销毁或泄露存储的数据。\n\
  \n![如果网站显示详细的错误消息且未正确处理提交值中的问题字符，黑客可以了解很多关于您服务器的信息。](img/13_figure_21_a.jpg)\n*如果网站显示详细的错误消息且未正确处理提交值中的问题字符，黑客可以了解很多关于您服务器的信息。*\n\
  \n幸运的是，SQL 注入攻击相对容易预防。首先验证所有用于查询的数据（并在可能的情况下执行类型转换或应用 Filter 扩展）。其次，使用像 `mysqli_real_escape_string()`\
  \ 这样的函数，使数据在查询中安全使用。该函数在第 9 章“将 PHP 与 MySQL 结合使用”中已介绍。第三，不要在正式站点上显示详细错误。\n\n---\n\
  \n### 预处理语句性能\n\n预处理语句比以旧方式运行查询更安全，但也可能更快。如果 PHP 脚本多次向 MySQL 发送相同的查询，每次仅使用不同的值，则预处理语句可以显著提高速度。在这种情况下，查询本身仅发送给\
  \ MySQL 并解析一次。然后，值单独发送给 MySQL。\n\n作为一个简单的示例，以下代码将在 MySQL 中运行 100 个查询：\n\n```php\n\
  $q = 'INSERT INTO counter (num) VALUES (?)';\n$stmt = mysqli_prepare($dbc, $q);\n\
  mysqli_stmt_bind_param($stmt, 'i', $n);\nfor ($n = 1; $n <= 100; $n++) {\n    mysqli_stmt_execute($stmt);\n\
  }\n```\n\n即使查询运行了 100 次，完整的文本也仅被传输给 MySQL 并由其解析一次。MySQL 5.1.17 及更高版本包含一种缓存机制，也可能提高预处理语句其他用法的性能。\n\
  \n---\n\n\n\n\n使用 `mysqli_real_escape_string()` 的替代方案是使用预处理语句。预处理语句在 MySQL 4.1 版本中引入，PHP\
  \ 自 5 版本起即可使用（得益于改进的 MySQL 扩展）。不使用预处理语句时，整个查询（包括 SQL 语法和具体数值）会作为一个长字符串发送给 MySQL。然后\
  \ MySQL 对其进行解析并执行。使用预处理查询时，SQL 语法会首先发送给 MySQL 进行解析，确保其在语法上是有效的（例如，确认查询未引用不存在的表或列）。然后具体数值会单独发送；MySQL\
  \ 使用这些数值组装查询，然后执行。预处理语句的优势非常重要：更高的安全性和潜在的更好性能。我将在此重点关注安全性方面，但关于性能的讨论请参阅侧边栏。\n\n\
  预处理语句可以由任何 `INSERT`、`UPDATE`、`DELETE` 或 `SELECT` 查询创建。首先定义查询，使用问号标记占位符。以 `edit_user.php`（脚本\
  \ 10.3）中的 `SELECT` 查询为例：\n\n```\n$q = \"SELECT first_name, last_name, email FROM\
  \ users WHERE user_id=$id\";\n```\n\n作为预处理语句，该查询变为\n\n```\n$q = \"SELECT first_name,\
  \ last_name, email FROM users WHERE user_id=?\";\n```\n\n接下来，在 MySQL 中准备语句，将结果赋值给一个\
  \ PHP 变量：\n\n```\n$stmt = mysqli_prepare($dbc, $q);\n```\n\n此时，MySQL 将解析查询，但不会执行它。\n\
  \n接下来，将 PHP 变量绑定到查询的占位符。换句话说，你指定一个变量用于第一个问号，另一个变量用于下一个问号，依此类推。继续以此例为例，你应该编写\n\n\
  ```\nmysqli_stmt_bind_param($stmt, 'i', $id);\n```\n\n命令中的 `i` 部分表示预期值的类型，使用表 13.5\
  \ 中列出的字符。在本例中，查询预期接收一个整数。作为另一个例子，以下是第 12 章“Cookies 和 Sessions”中登录查询的处理方式：\n\n```\n\
  $q = \"SELECT user_id, first_name FROM users WHERE email=? AND pass=SHA1(?)\";\n\
  \n$stmt = mysqli_prepare($dbc, $q);\n\nmysqli_stmt_bind_param($stmt, 'ss', $e, $p);\n\
  ```\n\n**表 13.5. 绑定值类型**\n\n![Image](img/13tab05.jpg)\n\n在这个例子中，还揭示了一件有趣的事：尽管电子邮件地址和密码值都是字符串，但它们在查询中并未放在引号内。这是预处理语句与标准查询的另一个区别。\n\
  \n语句绑定后，你可以为 PHP 变量赋值（如果尚未赋值），然后执行语句。以登录示例为例，代码如下：\n\n```\n$e = 'email@example.com';\n\
  \n$p = 'mypass';\n\nmysqli_stmt_execute($stmt);\n```\n\n执行预处理语句时将使用 `$e` 和 `$p`\
  \ 的值。\n\n要查看此过程的实际操作，让我们编写一个脚本，向 `forum` 数据库（在第 6 章“数据库设计”中创建）的 `messages` 表添加一条帖子。我还将借此机会演示其他几个与预处理语句相关的函数。\n\
