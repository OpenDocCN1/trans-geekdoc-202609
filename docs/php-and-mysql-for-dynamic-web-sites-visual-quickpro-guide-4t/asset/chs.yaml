  \n***\n\n提示\n\n运行脚本后，您始终可以使用 mysql 客户端或 phpMyAdmin 查看 *users* 表中的记录，以确保脚本已成功运行。\n\
  \n***\n\n提示\n\n您不应在 PHP 中以分号结束查询，就像使用 mysql 客户端时那样。在使用 MySQL 时，这是一个常见的、虽然无害但容易犯的错误。而在使用其他数据库应用程序（如\
  \ Oracle）时，这样做会导致查询无法使用。\n\n***\n\n提示\n\n作为提醒，如果查询能在数据库上无错误执行，`mysqli_query()` 函数将返回\
  \ TRUE 值。这并不一定意味着查询的结果是您所期望的。后续脚本将演示如何更准确地衡量查询是否成功。\n\n***\n\n提示\n\n您没有义务像我倾向于做的那样创建一个\
  \ `$q` 变量（您可以直接将查询文本插入 `mysqli_query()` 中）。然而，随着查询构建变得更加复杂，使用变量将成为唯一的选择。\n\n***\n\
  \n提示\n\n实际上，您在 mysql 客户端中运行的几乎任何查询，也都可以使用 `mysqli_query()` 来执行。\n\n***\n\n提示\n\n\
  改进版 MySQL 扩展相比标准扩展的另一个优势是，`mysqli_multi_query()` 函数允许您一次执行多个查询。这样做的语法稍微复杂一些，特别是当查询返回结果时，因此如果您有这方面的需求，请参阅\
  \ PHP 手册。\n\n#### 检索查询结果\n\n本章前面的部分演示了如何在 MySQL 数据库上执行简单查询。我所谓的*简单查询*，可以定义为以 `INSERT`、`UPDATE`、`DELETE`\
  \ 或 `ALTER` 开头的查询。这四者的共同点是它们不返回数据，只返回成功与否的指示。相反，`SELECT` 查询会生成信息（即返回记录行），必须由其他 PHP\
  \ 函数来处理。\n\n处理 `SELECT` 查询结果的主要工具是 `mysqli_fetch_array()`，它使用查询结果变量（我一直称之为 `$r`），并以数组格式一次返回一行数据。您需要在循环中使用此函数，只要还有行可读，循环就会继续访问每一行返回的数据。读取查询返回的每一条记录的基本结构是\n\
  \n```php\nwhile ($row = mysqli_fetch_array($r))\n{\n\n    // Do something with $row.\n\
  \n}\n```\n\n*您几乎总是需要使用* `while` 循环来获取 `SELECT` 查询的结果。\n\n`mysqli_fetch_array()`\
  \ 函数接受一个可选的第二个参数，用于指定返回的数组类型：关联数组、索引数组或两者兼有。关联数组允许您通过名称引用列值，而索引数组则要求您仅使用数字（第一个返回的列从\
  \ 0 开始）。每个参数由 **表 9.1** 中列出的常量定义，默认值为 `MYSQLI_BOTH`。`MYSQLI_NUM` 设置比其他选项略快（且占用内存更少）。相反，`MYSQLI_ASSOC`\
  \ 更加直观（使用 `$row['column']` 而非 `$row[3]`），并且即使查询发生变化，可能仍能继续工作。\n\n**表 9.1. mysqli_fetch_array()\
  \ 常量**\n\n![Image](img/09tab01.jpg)\n\n使用 `mysqli_fetch_array()` 时，您可以采取的一个可选步骤是，在使用完查询结果后释放查询结果资源：\n\
  \n```php\nmysqli_free_result ($r);\n```\n\n这行代码会移除 `$r` 占用的开销（内存）。这是一个可选步骤，因为 PHP\
  \ 会在脚本结束时自动释放资源，但就像使用 `mysqli_close()` 一样，这确实是一种良好的编程习惯。\n\n为了演示如何处理查询返回的结果，让我们创建一个用于查看所有当前注册用户的脚本。\n\
  \n#### 检索查询结果\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `view_users.php`（**脚本 9.4**）：\n\
  \n```php\n<?php # Script 9.4 - view_users.php\n\n$page_title = 'View the Current\
  \ Users';\n\ninclude ('includes/header.html');\n\necho '<h1>Registered Users</h1>';\n\
  ```\n\n**2.** 连接并查询数据库：\n\n```php\nrequire ('../mysqli_connect.php');\n\n$q = \"\
  SELECT CONCAT(last_name, ', ', first_name) AS name, DATE_FORMAT(registration_date,\
  \ '%M %d, %Y') AS dr FROM users ORDER BY registration_date ASC\";\n\n$r = @mysqli_query\
  \ ($dbc, $q);\n```\n\n此处的查询将返回两列 ![Image](img/circle-a.jpg)：用户姓名（格式化为 *Last Name,\
  \ First Name*）和注册日期（格式化为 *Month DD, YYYY*）。由于这两列都使用 MySQL 函数进行格式化，因此给返回的结果起了别名（分别为\
  \ *name* 和 *dr*）。如果您对这些语法感到困惑，请参阅 第 5 章。\n\n![Image](img/09_figure_12_a.jpg)\n\n\
  ![Image](img/circle-a.jpg)在 mysql 客户端中运行的查询结果。\n\n**3.** 创建一个 HTML 表格以显示查询结果：\n\n\
  ```php\nif ($r) {\n    echo '<table align=\"center\" cellspacing=\"3\" cellpadding=\"\
  3\"\n    width=\"75%\">\n    <tr><td align=\"left\"><b>Name</b></td><td align=\"\
  left\"><b>Date Registered</b></td></tr>\n    ';\n```\n\n如果 `$r` 变量的值为 TRUE，则表示查询无错误运行，可以显示结果。为此，首先创建一个表格和一个\
  \ HTML 表头行。\n\n**4.** 获取并打印每一条返回的记录：\n\n```php\nwhile ($row = mysqli_fetch_array($r,\
  \ MYSQLI_ASSOC)) {\n    echo '<tr><td align=\"left\">' . $row['name'] . '</td><td\
  \ align=\"left\">' . $row['dr'] . '</td></tr>\n    ';\n}\n```\n\n\n\n接下来，使用 `mysqli_fetch_array()`\
  \ 循环遍历结果并打印每一行获取的数据。请注意，在 `while` 循环内部，代码使用正确的别名来引用每个返回的值：`$row['name']` 和 `$row['dr']`。脚本无法引用\
  \ `$row['first_name']` 或 `$row['date_registered']`，因为查询并未返回这些字段名 ![Image](img/graycircle-a.jpg)。\n\
  \n**脚本 9.4。** `view_users.php` 脚本在数据库上运行一个静态查询并打印所有返回的行。\n\n---\n\n```php\n<?php\
  \ # Script 9.4 - view_users.php\n\n// This script retrieves all the records from\
  \ the users table.\n\n$page_title = 'View the Current Users';\ninclude ('includes/header.html');\n\
  \n// Page header:\necho '<h1>Registered Users</h1>';\n\nrequire ('../mysqli_connect.php');\
  \ // Connect to the db.\n\n// Make the query:\n$q = \"SELECT CONCAT(last_name, ',\
  \ ', first_name) AS name, DATE_FORMAT(registration_date, '%M %d,\n    %Y') AS dr\
  \ FROM users ORDER BY registration_date ASC\";\n$r = @mysqli_query ($dbc, $q); //\
  \ Run the query.\n\nif ($r) { // If it ran OK, display the records.\n\n    // Table\
  \ header.\n    echo '<table align=\"center\" cellspacing=\"3\" cellpadding=\"3\"\
  \ width=\"75%\">\n    <tr><td align=\"left\"><b>Name</b></td><td align=\"left\"\
  ><b>Date Registered</b></td></tr>\n';\n\n    // Fetch and print all the records:\n\
  \    while ($row = mysqli_fetch_array($r, MYSQLI_ASSOC)) {\n        echo '<tr><td\
