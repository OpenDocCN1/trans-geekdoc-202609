  此文件 `post.php` 主要用于处理来自 `post_form.php` 的表单提交。听起来很简单，但还有更多细节。此页面实际上会以三种不同方式被调用：\n\
  \n1.  处理线程回复的表单\n2.  显示新主题提交的表单\n3.  处理新主题提交的表单\n\n这意味着页面将通过 POST（模式 1 和 3）或 GET（模式\
  \ 2）访问。此外，发送到页面并因此需要验证的数据在模式 1 和 3 之间会有所不同 ![Image](img/circle-f.jpg)。\n\n![Image](img/17_figure_30_f.jpg)\n\
  \n![Image](img/circle-f.jpg) `post.php` 页面的各种用法。\n\n增加复杂性的是，如果要创建新主题，必须运行两个查询：一个将主题添加到\
  \ `threads` 表，另一个将新主题正文添加到 `posts` 表。如果是对现有主题的回复，则只需一个查询，向 `posts` 表插入一条记录。\n\n\
  当然，成功实现这一点只是使用正确条件判断的问题，您马上就会看到。就验证而言，主题和正文作为文本类型，只需检查非空值。主题将去除所有标签（因为它为什么要包含标签？），正文中的标签将转换为实体。这将允许在帖子中*书写*\
  \ HTML、JavaScript 和 PHP 代码，但在显示主题时*不会执行*这些代码（因为在一个 Web 开发论坛中，您需要展示一些代码）。\n\n####\
  \ Script 17.7. `post.php` 页面将处理发布消息时的表单提交。此页面既用于创建新主题，也用于处理对现有主题的回复。\n\n---\n\n\
  ```php\n1   <?php # Script 17.7 - post.php\n2   // This page handles the message\
  \ post.\n3   // It also displays the form if creating\n        a new thread.\n4\
  \   include ('includes/header.html');\n5\n```\n\n\n\n\n### 创建 post.php\n\n## 1.\
  \ 开始新的 PHP 文档\n在文本编辑器或 IDE 中创建一个名为 `post.php` 的新 PHP 文档（**Script 17.7**）：\n\n```php\n\
  <?php # Script 17.7 - post.php\n\ninclude ('includes/header.html');\n```\n\n此页面将使用页眉和页脚文件，这与\
  \ `post_form.php` 不同。\n\n## 2. 检查表单提交并验证线程 ID\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    if (isset($_POST['tid']) && filter_var($_POST['tid'], FILTER_VALIDATE_INT,\
  \ array('min_range' => 1))) {\n        $tid = $_POST['tid'];\n    } else {\n   \
  \     $tid = FALSE;\n    }\n}\n```\n\n线程 ID 将在表单作为对现有线程的回复提交时出现（线程 ID 作为隐藏输入存储 ![Image](img/circle-g.jpg)）。得益于\
  \ Filter 扩展，验证过程相当常规。\n\n![Image](img/17_figure_31_g.jpg)\n\n![Image](img/circle-g.jpg)\
  \ `read.php` 的源代码展示了线程 ID 如何存储在表单中。这向 `post.php` 指示该提交是回复，而非新线程。\n\n## 3. 验证消息主题\n\
  \n```php\nif (!$tid && empty($_POST['subject'])) {\n    $subject = FALSE;\n    echo\
  \ '<p>Please enter a subject for this post.</p>';\n} elseif (!$tid && !empty($_POST['subject']))\
  \ {\n    $subject = htmlspecialchars(strip_tags($_POST['subject']));\n} else { //\
  \ Thread ID, no need for subject.\n    $subject = TRUE;\n}\n```\n\n验证主题的棘手之处在于存在三种场景：\n\
  1. **无有效线程 ID**：这应为新线程，主题不能为空。若 `subject` 元素为空，则发生错误并打印消息。\n2. **无有效线程 ID 但主题非空**：这是新线程且已输入主题，故应进行处理。此时使用\
  \ `strip_tags()` 函数移除所有标签，`htmlspecialchars()` 将剩余引号转为实体格式。调用第二个函数可防止表单再次显示且主题被置于输入框以使其“粘滞”时出现问题。明确说，若提交的主题包含双引号但正文未填写，表单将再次显示并将主题置于\
  \ `value=\"\"` 中，主题中的双引号将导致问题。\n3. **作为对现有线程的回复提交**：此时 `$tid` 有效，无需主题。\n\n## 4.\
  \ 验证正文\n\n```php\nif (!empty($_POST['body'])) {\n    $body = htmlentities($_POST['body']);\n\
  } else {\n    $body = FALSE;\n    echo '<p>Please enter a body for this post.</p>';\n\
  }\n```\n\n此验证简单得多，因为正文始终是必需的。若存在，将通过 `htmlentities()` 处理。\n\n## 5. 检查表单是否正确填写\n\n\
  ```php\nif ($subject && $body) {\n```\n\n## 6. 在适当情况下创建新线程\n\n```php\nif (!$tid)\
  \ { // Create a new thread.\n    $q = \"INSERT INTO threads (lang_id, user_id, subject)\
  \ VALUES ({$_SESSION['lid']}, {$_SESSION['user_id']}, '\" . mysqli_real_escape_string($dbc,\
  \ $subject) . \"')\";\n    $r = mysqli_query($dbc, $q);\n    if (mysqli_affected_rows($dbc)\
  \ == 1) {\n        $tid = mysqli_insert_id($dbc);\n    } else {\n        echo '<p>Your\
  \ post could not be handled due to a system error.</p>';\n    }\n} // No $tid.\n\
  ```\n\n若无线程 ID，则为新线程，必须在 `threads` 表上运行查询。该查询很简单，填充三列。其中两个值来自会话（用户登录后）。另一个是主题，已通过\
  \ `mysqli_real_escape_string()` 处理。因主题已应用 `strip_tags()` 和 `htmlspecialchars()`，你或许可不使用此函数，但无需冒险。\n\
  \n若查询生效（即影响一行），则检索新线程 ID。\n\n## 7. 向 `posts` 表添加记录\n\n```php\nif ($tid) { // Add\
  \ this to the replies table:\n    $q = \"INSERT INTO posts (thread_id, user_id,\
  \ message, posted_on) VALUES ($tid, {$_SESSION['user_id']}, '\" . mysqli_real_escape_string($dbc,\
  \ $body) . \"', UTC_TIMESTAMP())\";\n    $r = mysqli_query($dbc, $q);\n    if (mysqli_affected_rows($dbc)\
  \ == 1) {\n        echo '<p>Your post has been entered.</p>';\n    } else {\n  \
  \      echo '<p>Your post could not be handled due to a system error.</p>';\n  \
  \  }\n} // Valid $tid.\n```\n\n仅当线程 ID 存在时才应运行此查询。这在作为现有线程的回复或新线程刚在数据库创建（步骤 6）时成立。若前一查询失败，则不运行此查询。\n\
  \n该查询填充表中四列：线程 ID、用户 ID（来自会话）、消息正文（通过 `mysqli_real_escape_string()` 保安全）、发布日期。最后一值使用\
  \ `UTC_TIMESTAMP()` 列，使其不绑定任何单一时区（见第 6 章）。\n\n\n\n\n请注意，本页面所有打印的消息我都只是使用了硬编码的英语。为了完善这些示例，每条消息都应存储在\
  \ `words` 表中，并在此处打印，而不是硬编码。\n\n***\n\n### 本示例为何复杂\n\n在本章介绍中，我指出该示例从根本上说是简单的，但有时简单的事情需要一些额外的努力才能完成。那么，依我之见，这个示例复杂在哪里？\n\
  \n首先，支持多语言确实增加了几个问题。如果编码没有在所有地方都得到妥善处理——无论是在文本编辑器或 IDE 中创建页面时、与 MySQL 通信时、在 Web\
  \ 浏览器中，等等——事情就会出错。此外，你必须为网站可能需要的每一段文本，在每种语言中都准备好恰当的翻译。这包括错误消息（用户实际能看到的那些）、邮件正文等。\n\
  \nPHP 文件的组织方式及其功能也使事情变得复杂。特别是，某些变量在一个文件中创建，却在另一个文件中使用。这样做充其量会导致困惑，最坏的情况会引入 Bug。为克服这些问题，我建议添加大量注释，指明变量来自何处或还可能在何处使用。此外，尝试在页面内使用唯一的变量名，这样它们就不太可能与包含文件中的变量冲突。\n\
  \n最后，由于消息可以通过两种不同的方式发布，且预期不同，但示例却仅使用一个页面来显示发布表单，仅用一个页面来处理它，这也增加了复杂性。\n\n***\n\n\
  ### 8. 完成页面：\n\n```php\n} else { // 包含表单：\n    include ('includes/post_form.php');\n\
  }\n\n} else { // 显示表单：\n    include ('includes/post_form.php');\n}\n\ninclude ('includes/footer.html');\n\
  \n?>\n```\n\n第一个 `else` 子句适用于表单已提交但未完成的情况。在这种情况下，表单将再次被包含，并且可以是粘滞的，因为它将能访问该脚本创建的\
  \ `$subject` 和 `$body` 变量。第二个 `else` 子句适用于直接访问此页面（通过单击导航中的链接）的情况，从而产生一个 GET 请求（即，无表单提交）。\n\
  \n### 9. 将文件保存为 `post.php`，将其放在 Web 目录中，并在 Web 浏览器中测试。\n\n![Image](img/17_figure_32_h.jpg)\n\
  *图：尝试发布新主题时未提供主题的结果。*\n\n![Image](img/17_figure_33_i.jpg)\n*图：回复已成功添加到主题中。*\n\n\
  ***\n\n### 管理论坛\n\n论坛的大部分管理工作将涉及用户管理，这将在下一章讨论。根据管理论坛的人员，你可能还需要创建用于管理语言和翻译词汇列表的表单。\n\
  \n管理员也可能拥有编辑和删除帖子或主题的权限。要实现这一点，也要在会话中存储用户级别（下一章将向你展示如何操作）。如果登录用户是管理员，在 `forum.php`\
  \ 上添加编辑和删除主题的链接。每个链接都会将主题 ID 传递给一个新页面（类似于第 10 章“常见编程技术”中的 `edit_user.php` 和 `delete_user.php`）。删除主题时，必须确保同时删除\
  \ `posts` 表中同样具有该主题 ID 的所有记录。外键约束（见第 6 章）在这方面会有所帮助。\n\n最后，管理员可以编辑或删除单个帖子（对主题的回复）。同样，检查用户级别，然后在\
  \ `read.php` 中添加链接（在每条消息后添加一对链接）。这些链接将把帖子 ID 传递给编辑和删除页面（与主题页面上使用的不同页面）。\n\n***\n\
  \n### 复习与实践\n\n如果你在复习问题或实践提示方面有任何困难，请求助于本书的配套论坛 ([www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/))。\n\
  \n注意：大多数这些问题和部分提示重述了前几章涵盖的信息，旨在加强一些最重要的要点。\n\n#### 复习\n\n*   数据库的 `character set`（字符集）或\
  \ PHP/HTML 页面的 `encoding`（编码）有什么影响？\n*   为什么编码和字符集到处都必须相同？如果存在差异会发生什么？\n*   什么是\
  \ `primary key`（主键）？什么是 `foreign key`（外键）？\n*   使用 `UTC` 存储日期和时间有什么好处？\n*   当每个用户的密码长度可变时，为什么\
  \ `users` 表中的 `pass` 列设为 `CHAR` 而不是 `VARCHAR`？\n*   如何在 PHP 中开始会话？如何在会话中存储值？如何检索先前存储的值？\n\
  *   如何在 SQL 命令中创建 `alias`（别名）？使用别名有什么好处？\n\n#### 实践\n\n*   如果需要复习数据库设计，请回顾第 6 章。\n\
  *   回顾第 6 章，提醒自己表中哪些列应该建立索引。\n*   如果你的 MySQL 安装未能正确将日期和时间从 UTC 时区转换为其他时区（即，返回的转换日期值为\
  \ `NULL`），请回顾第 6 章关于时区的部分。\n*   回顾第 7 章“高级 SQL 和 MySQL”，复习连接和聚合函数。\n*   修改页头和其他文件，使每个页面的标题同时使用默认语言的页面标题和基于所查看页面的副标题（例如，当前显示的主题名称）。\n\
  *   向 `forum.php` 脚本添加分页功能——见第 10 章。\n*   如果愿意，向 `words` 表添加必要的列，并向 PHP 脚本添加适当的代码，使每个导航、错误和其他元素都具有语言特异性。使用\
  \ Yahoo! Babel Fish ([`babelfish.yahoo.com`](http://babelfish.yahoo.com)) 等网站进行翻译。\n\
  *   将第 12 章中的 `redirect_user()` 函数应用到此处的 `post_form.php` 中。\n*   为该论坛创建一个搜索页面。如果需要帮助，请参阅可下载代码中提供的\
  \ `search.php` 基础示例。\n\n## 18. 示例——用户注册\n\n### 本章内容\n\n*   创建模板 560\n*   编写配置脚本\
  \ 566\n*   创建主页 574\n*   注册 576\n*   激活账户 586\n*   登录与登出 589\n*   密码管理 594\n*  \
  \ 复习与实践 604\n\n本书的第二个示例——用户注册系统——已经在其他几章中涉及过，因为注册、登录和登出过程是许多概念的绝佳示例。但本章将把所有这些想法置于同一语境中，采用一致的编程方法。\n\
  \n用户将能够注册、登录、登出和更改密码。本章包含其他地方未展示的三个功能：*重置密码*（以防遗忘）；要求用户在登录前*激活其账户*；以及支持*不同的用户级别*，允许你根据登录用户的类型控制可用内容。\n\
  \n\n\n\n\n### 创建模板\n\n本章的应用程序将使用一种新的模板设计。该模板广泛使用了**层叠样式表（CSS）**，无需图片即可创建整洁的外观。它在所有当前浏览器上测试良好，并且在不支持\
  \ CSS2 的浏览器上将显示为无格式文本。该站点的布局源自 BlueRobot ([www.bluerobot.com](http://www.bluerobot.com))\
  \ 免费提供的模板之一。\n\n![Image](img/18_figure_01_a.jpg)\n\n该 Web 应用程序的基本外观。\n\n创建本章示例的工作从两个模板文件开始：`header.html`\
  \ 和 `footer.html`。正如 第 12 章 “Cookies 和 Sessions” 的示例一样，页脚文件将根据用户是否已登录来显示特定链接，这是通过检查会话变量是否存在来确定的。更进一步，如果已登录用户也是管理员（会话值将指示这一点），则将显示额外的链接。\n\
  \n页眉文件将启动会话和 `输出缓冲`，而页脚文件将终止输出缓冲。本书未正式涵盖输出缓冲，但在侧边栏中已作足够介绍。\n\n#### 制作 header.html\n\
  \n**1.** 在文本编辑器或 IDE 中新建一个名为 `header.html` 的文档（脚本 18.1）：\n\n```php\n<?php # Script\
  \ 18.1 - header.html\n```\n\n**脚本 18.1.** 页眉文件启动 HTML、开始会话并开启输出缓冲。\n\n```php\n1\
  \   <?php # Script 18.1 - header.html\n2   // This page begins the HTML header for\n\
  3       the site.\n4\n5   // Start output buffering:\n6   ob_start();\n7\n8   //\
  \ Initialize a session:\n9   session_start();\n10\n11  // Check for a $page_title\
  \ value:\n12  if (!isset($page_title)) {\n13      $page_title = 'User Registration';\n\
  14  }\n15  ?>\n16  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n17      1.0 Transitional//EN\"\
  \n18      \"http://www.w3.org/TR/xhtml1/DTD/\n19      xhtml1-transitional.dtd\"\
  >\n20  <html xmlns=\"http://www.w3.org/1999/\n21      xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n22  <head>\n23      <meta http-equiv=\"content-type\"\n24      content=\"\
  text/html; charset=utf-8\" />\n25      <title><?php echo $page_title; ?></title>\n\
  26      <style type=\"text/css\"\n27      media=\"screen\">@import \"includes/\n\
  28      layout.css\";</style>\n29  </head>\n30  <body>\n31  <div id=\"Header\">User\
  \ Registration</div>\n32      <div id=\"Content\">\n33  <!-- End of Header -->\n\
  ```\n\n**2.** 开启输出缓冲并启动会话：\n\n```php\nob_start();\nsession_start();\n```\n\n本网站将使用输出缓冲，消除在使用\
  \ HTTP 头、重定向用户或发送 Cookie 时可能出现的错误消息。每个页面也都将使用会话。在 `ob_start()` 之后调用 `session_start()`\
  \ 是安全的，因为此时尚未向 Web 浏览器发送任何内容。\n\n由于每个公共页面都将同时使用输出缓冲和会话，将这些代码行放在 `header.html` 文件中，免去了在每个页面中重复放置的麻烦。其次，如果以后想要更改会话设置（例如），只需编辑这一个文件即可。\n\
  \n**3.** 检查 `$page_title` 变量并关闭 PHP 部分：\n\n```php\nif (!isset($page_title)) {\n\
  \    $page_title = 'User Registration';\n}\n?>\n```\n\n正如本书其他使用模板系统的示例一样，页面标题——显示在浏览器窗口顶部——将在每个页面单独设置。此条件检查\
  \ `$page_title` 变量是否有值，如果没有，则将其设置为默认字符串。这是一个很好的（但可选的）检查，值得包含在页眉中。\n\n### 使用输出缓冲\n\
  \n默认情况下，PHP 脚本打印的任何内容或 PHP 标签外的任何 HTML（即使在包含的文件中）都会立即发送给 Web 浏览器。`输出缓冲`（PHP 手册称之为\
  \ `输出控制`）是一项 PHP 功能，可覆盖此行为。HTML 不会立即发送给 Web 浏览器，而是被放入缓冲区——临时内存中。然后，当缓冲区被*刷新*时，内容才会发送给\
  \ Web 浏览器。输出缓冲可以提高性能，但主要好处是消除了那些讨厌的*headers already sent*（头信息已发送）错误消息。某些函数——`header()`、`setcookie()`\
  \ 和 `session_start()`——只有在未向 Web 浏览器发送任何内容时才能调用。有了输出缓冲，直到页面结束前都不会向 Web 浏览器发送任何内容，因此你可以在脚本的任何位置自由调用这些函数。\n\
  \n要开始输出缓冲，请调用 `ob_start()` 函数。一旦调用它，每个 `echo`、`print` 和类似函数调用的输出将被发送到内存缓冲区，而不是 Web\
  \ 浏览器。相反，HTTP 调用（如 `header()` 和 `setcookie()`）不会被缓冲，将照常运行。\n\n在脚本结束时，调用 `ob_end_flush()`\
  \ 函数将累积的缓冲区发送给 Web 浏览器。或者，使用 `ob_end_clean()` 函数删除缓冲数据而不发送它。这两个函数都有关闭输出缓冲的副作用。\n\
  \n**4.** 创建 HTML 头部：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\" lang=\"en\">\n<head>\n    <meta http-equiv=\"content-type\" content=\"\
  text/html; charset=utf-8\" />\n    <title><?php echo $page_title; ?></title>\n \
  \   <style type=\"text/css\" media=\"screen\">@import \"includes/layout.css\";</style>\n\
