  \ 手册。\n\n**4.** 向 `orders` 表添加订单：\n\n```php\n$q = \"INSERT INTO orders (customer_id,\
  \ total) VALUES\n($cid, $total)\";\n$r = mysqli_query($dbc, $q);\nif (mysqli_affected_rows($dbc)\
  \ == 1) {\n```\n\n此查询非常简单，仅将客户 ID 号和订单总额录入 `orders` 表。该表中的 `order_date` 字段将自动设置为当前日期和时间，因为它是\
  \ `TIMESTAMP` 列。\n\n**5.** 获取订单 ID：\n\n```php\n$oid = mysqli_insert_id($dbc);\n\
  ```\n\n`orders` 表中的 `order_id` 值用于在 `order_contents` 表中关联两者。\n\n**6.** 准备将订单内容插入数据库的查询：\n\
  \n```php\n$q = \"INSERT INTO order_contents (order_id, print_id, quantity, price)\
  \ VALUES (?, ?, ?, ?)\";\n$stmt = mysqli_prepare($dbc, $q);\nmysqli_stmt_bind_param($stmt,\
  \ 'iiid', $oid, $pid, $qty, $price);\n```\n\n该查询向 `order_contents` 表插入四个值，每个购买的印刷品对应一条记录。查询使用占位符定义并准备执行。函数\
  \ `mysqli_stmt_bind_param()` 将四个变量绑定到占位符，其类型依次为：整数、整数、整数、双精度（即浮点数）。\n\n**7.** 遍历购物车，将每个印刷品插入数据库：\n\
  \n```php\n$affected = 0;\nforeach ($_SESSION['cart'] as $pid => $item) {\n  $qty\
  \ = $item['quantity'];\n  $price = $item['price'];\n  mysqli_stmt_execute($stmt);\n\
  \  $affected += mysqli_stmt_affected_rows($stmt);\n}\nmysqli_stmt_close($stmt);\n\
  ```\n\n通过循环遍历购物车（同 `view_cart.php`），脚本可逐个访问每个项目。具体流程：查询已**预处理**——发送至 MySQL 并解析，变量已绑定到占位符。循环内，两个新变量从会话获取值。随后调用\
  \ `mysqli_stmt_execute()` 执行预处理语句，使用当前变量值。`$oid` 在迭代中不变，但 `$pid`、`$qty` 和 `$price`\
  \ 会变化。\n\n为确认所有查询成功，需跟踪受影响的行数。变量 `$affected` 在循环外初始化为 0。循环内，每次执行预处理语句后，将受影响行数累加到该变量。\n\
  \n**8.** 报告事务成功与否：\n\n```php\nif ($affected == count($_SESSION['cart'])) {\n  mysqli_commit($dbc);\n\
  \  unset($_SESSION['cart']);\n  echo '<p>Thank you for your order. You will be notified\
  \ when the items ship.</p>';\n```\n\n条件判断插入 `order_contents` 表的记录数是否等于购物车中的商品数。简而言之：每个产品是否都已插入？若是，事务完成并提交。接着清空购物车并感谢用户。逻辑上此处还应发送确认邮件给客户。\n\
  \n**9.** 处理 MySQL 问题：\n\n```php\n  } else {\n    mysqli_rollback($dbc);\n    echo\
  \ '<p>Your order could not be processed due to a system error. You will be contacted\
  \ in order to have the problem fixed. We apologize for the inconvenience.</p>';\n\
  \  }\n} else {\n  mysqli_rollback($dbc);\n  echo '<p>Your order could not be processed\
  \ due to a system error. You will be contacted in order to have the problem fixed.\
  \ We apologize for the inconvenience.</p>';\n}\n```\n\n第一个 `else` 子句在 `order_contents`\
  \ 表插入记录数不正确时触发。第二个 `else` 子句在最初的 `orders` 表查询失败时触发。无论哪种情况，都应撤销整个事务，因此调用 `mysqli_rollback()`。\n\
  \n若此时发生问题，情况相当严重，因为客户已被扣款但订单未入库。这本不该发生，但以防万一，应将所有数据写入文本文件和/或发送邮件给网站管理员，或采取其他措施记录该订单。否则，你将面对非常愤怒的客户。\n\
  \n**10.** 完成页面：\n\n```php\nmysqli_close($dbc);\ninclude ('includes/footer.html');\n\
  ?>\n```\n\n**11.** 将文件保存为 `checkout.php`，放入 Web 目录，并在浏览器中测试。\n\n![Image](img/circle-a.jpg)\n\
