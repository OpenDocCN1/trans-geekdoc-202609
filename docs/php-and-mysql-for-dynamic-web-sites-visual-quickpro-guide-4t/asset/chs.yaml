  content\"><!-- Start of the\n           page-specific content. -->\n29  <!-- Script\
  \ 12.10 - header.html -->\n```\n\n---\n\n**脚本 12.11。** 销毁会话（如在注销页面中所做）需要特殊的语法来删除会话\
  \ Cookie 和服务器上的会话数据，以及清空 `$_SESSION` 数组。\n\n---\n\n```php\n1   <?php # Script 12.11\
  \ - logout.php #2\n2   // This page lets the user logout.\n3   // This version uses\
  \ sessions.\n4\n5   session_start( ); // Access the\n       existing session.\n\
  6\n7   // If no session variable exists,\n       redirect the user:\n8   if (!isset($_SESSION['user_id']))\
  \ {\n9\n10      // Need the functions:\n11      require ('includes/login_functions.\n\
  \           inc.php');\n12      redirect_user( );\n13\n14  } else { // Cancel the\
  \ session:\n15\n16      $_SESSION = array( ); // Clear the\n           variables.\n\
  17      session_destroy( ); // Destroy the\n           session itself.\n18     \
  \ setcookie ('PHPSESSID', '', time( )-3600,\n           '/', '', 0, 0); // Destroy\
  \ the cookie.\n19\n20  }\n21\n22  // Set the page title and include the\n      \
  \ HTML header:\n23  $page_title = 'Logged Out!';\n24  include ('includes/header.html');\n\
  25\n26  // Print a customized message:\n27  echo \"<h1>Logged Out!</h1>\n28  <p>You\
  \ are now logged out!</p>\";\n29\n30  include ('includes/footer.html');\n31  ?>\n\
  ```\n\n---\n\n### 删除会话变量\n\n使用会话时，你应该创建一种删除会话数据的方法。在当前示例中，当用户注销时就需要这样做。\n\nCookie\
  \ 系统只需发送另一个 Cookie 来销毁现有 Cookie，而会话稍微要求更高，因为必须同时考虑客户端的 Cookie 和服务器上的数据。\n\n要删除单个会话变量，可以使用\
  \ `unset()` 函数（它适用于 PHP 中的任何变量）：\n\n```php\nunset($_SESSION['var']);\n```\n\n但要删除所有会话变量，不应使用\
  \ `unset()`，而应重置 `$_SESSION` 数组：\n\n```php\n$_SESSION = array();\n```\n\n最后，要从服务器移除所有会话数据，请调用\
  \ `session_destroy()`：\n\n```php\nsession_destroy();\n```\n\n请注意，在使用上述任何方法之前，页面必须以\
  \ `session_start()` 开头，以便访问现有会话。让我们更新 `logout.php` 脚本以清除会话数据。\n\n### 删除会话\n\n**1.**\
  \ 在文本编辑器或 IDE 中打开 `logout.php`（脚本 12.6）。\n\n**2.** 在开头的 PHP 标记之后立即启动会话（**脚本 12.11;\n\
  ```\n\n任何时候使用会话，都必须调用 `session_start()` 函数，最好在页面的最开始处调用。即使你要删除会话，这也是必须的。\n\n**3.**\
  \ 更改条件语句，使其检查会话变量是否存在：\n\n```php\nif (!isset($_SESSION['user_id'])) {\n```\n\n与\
  \ Cookie 示例中的 `logout.php` 脚本一样，如果用户当前未登录，他们将被重定向。\n\n**4.** 用以下代码替换 `setcookie()`\
  \ 行（删除 Cookie 的那些）：\n\n```php\n$_SESSION = array();\nsession_destroy();\nsetcookie\
  \ ('PHPSESSID', '', time() - 3600, '/', '', 0, 0);\n```\n\n此处第一行将整个 `$_SESSION`\
  \ 变量重置为一个新数组，擦除其现有值。第二行从服务器移除数据，第三行发送一个 Cookie 以删除浏览器中现有的会话 Cookie。\n\n---\n\n###\
  \ 垃圾回收\n\n关于会话的垃圾回收，是指服务器自动删除会话文件（实际数据存储的地方）的过程。创建一个销毁会话的注销系统是理想的，但无法保证所有用户都会像应该的那样正式注销。因此，PHP\
  \ 包含了一个清理进程。\n\n每当调用 `session_start()` 函数时，PHP 的垃圾回收就会启动，检查每个会话的最后修改日期（每当设置或检索变量时，会话就会被修改）。两个设置决定了垃圾回收：`session.gc_maxlifetime`\
  \ 和 `session.gc_probability`。第一个设定在多少秒不活动后会话被视为空闲并因此被删除。第二个设定在 1 到 100 的范围内决定执行垃圾回收的概率。使用默认设置时，每次调用\
  \ `session_start()` 都有 1% 的几率触发垃圾回收。如果 PHP 启动清理，超过 1,440 秒未被使用的会话将被删除。\n\n你可以使用\
  \ `ini_set()` 函数更改这些设置，尽管这样做要小心。过于频繁或概率过高的垃圾回收会拖慢服务器，并无意中结束较慢用户的会话。\n\n---\n\n**5.**\
  \ 移除消息中对 `$_COOKIE` 的引用：\n\n```php\necho \"<h1>Logged Out!</h1>\n<p>You are now\
  \ logged out!</p>\";\n```\n\n与使用 Cookie 版本的 `logout.php` 脚本不同，你不能再通过名字来称呼用户，因为所有那些数据已被删除。\n\
  \n**6.** 将文件保存为 `logout.php`，放入你的 Web 目录，并在浏览器中测试 ![Image](img/circle-e.jpg)。\n\n\
  ![Image](img/12_figure_21_e.jpg)\n\n![Image](img/circle-e.jpg) 注销页面（现在采用会话）。\n\n\
  ---\n\n> **提示**\n>\n> `header.html` 文件只需检查 `$_SESSION['user_id']` 是否已设置，而无需检查页面是否为注销页面，因为当\
  \ `logout.php` 包含 header 文件时，所有会话数据已被销毁。会话数据的销毁会立即生效，这与 Cookie 不同。\n\n---\n\n> **提示**\n\
  >\n> 切勿将 `$_SESSION` 设置为 `NULL`，也切勿使用 `unset($_SESSION)`。在某些服务器上，这两种做法都可能导致问题。\n\
  \n---\n\n> **提示**\n>\n> 如果还不完全清楚发生了什么，会话涉及三种信息：会话标识符（默认存储在 Cookie 中）、会话数据（存储在服务器上的文本文件中）以及\
  \ `$_SESSION` 数组（脚本通过它访问文本文件中的会话数据）。仅删除 Cookie 不会移除数据文件，反之亦然。清空 `$_SESSION` 数组会擦除文本文件中的数据，但文件本身仍会存在，Cookie\
  \ 也是如此。本注销脚本中概述的三个步骤能有效移除会话的所有痕迹。\n\n\n\n\n\n### 提升会话安全性\n\n由于重要信息通常存储在会话中（切勿在 Cookie\
  \ 中存储敏感数据），安全性变得更加关键。对于会话，有两个方面需要注意：会话 ID（它是会话数据的引用点）以及存储在服务器上的会话数据本身。恶意人员更有可能通过会话\
  \ ID 入侵会话，而不是直接攻击服务器上的数据，因此我将在此重点关注这一侧面（在本节末尾的提示中，我提到了两种保护会话数据本身的方法）。\n\n---\n\n\
  #### 更改会话行为\n\n作为 PHP 对会话支持的一部分，有 20 多个不同的配置选项可供设置 PHP 处理会话的方式。有关完整列表，请参阅 PHP 手册，但我将在此重点介绍其中几个最重要的选项。请注意更改会话设置的两条规则：\n\
  \n1.  所有更改必须在调用 `session_start()` 之前进行。\n2.  必须在每个使用会话的页面上进行相同的更改。\n\n大多数设置可以在 PHP\
  \ 脚本中使用 `ini_set()` 函数进行设置（详见 第 8 章）：\n\n```php\nini_set(parameter, new_setting);\n\
  ```\n\n例如，要强制使用会话 Cookie（如前所述，会话虽可在无 Cookie 情况下工作，但安全性较低），请使用：\n\n```php\nini_set('session.use_only_cookies',\
  \ 1);\n```\n\n另一个可做的更改是会话的名称（或许是为了使用一个更友好的名称）。为此，请调用 `session_name()` 函数：\n\n```php\n\
  session_name('YourSession');\n```\n\n创建自定义会话名称有双重好处：它在一定程度上更安全，且最终用户可能更容易接受（因为会话名称就是最终用户将看到的\
  \ Cookie 名称）。`session_name()` 函数在删除会话 Cookie 时也可使用：\n\n```php\nsetcookie(session_name(),\
  \ '', time() - 3600);\n```\n\n如果不提供参数，该函数将返回当前的会话名称。\n\n最后，还有 `session_set_cookie_params()`\
  \ 函数。它用于调整会话 Cookie 的设置：\n\n```php\nsession_set_cookie_params(expire, path, host,\
  \ secure, httponly);\n```\n\n请注意，Cookie 的过期时间仅指 Cookie 在 Web 浏览器中的存活期，而非会话数据在服务器上存储的时长。\n\
  \n---\n\n会话 ID 是访问会话数据的关键。默认情况下，PHP 会将其存储在 Cookie 中，这从安全角度来看是首选。在 PHP 中也可以不使用 Cookie\
  \ 来启用会话，但这会使应用程序容易受到*会话劫持*攻击：如果恶意用户 Alice 能获取用户 Bob 的会话 ID，Alice 就可以轻松欺骗服务器，使其认为\
  \ Bob 的会话 ID 也是 *Alice* 的会话 ID。此时，Alice 将“搭便车”使用 Bob 的会话，并能访问 Bob 的数据。将会话 ID 存储在\
  \ Cookie 中会使其更难被窃取。\n\n**脚本 12.12。** `login.php` 脚本的最终版本还会在会话中存储用户 `HTTP_USER_AGENT`（客户端的浏览器和操作系统）的加密形式。\n\
  \n---\n\n```php\n<?php # Script 12.12 - login.php #4\n\n// This page processes the\
  \ login form\n// submission.\n// The script now stores the HTTP_USER_\n// AGENT\
  \ value for added security.\n\n// Check if the form has been submitted:\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n\n    // Need two helper files:\n    require('includes/login_functions.inc.php');\n\
  \    require('../mysqli_connect.php');\n\n    // Check the login:\n    list($check,\
  \ $data) = check_login($dbc,\n        $_POST['email'], $_POST['pass']);\n\n    if\
  \ ($check) { // OK!\n\n        // Set the session data:\n        session_start();\n\
  \        $_SESSION['user_id'] = $data['user_id'];\n        $_SESSION['first_name']\
  \ = $data['first_name'];\n\n        // Store the HTTP_USER_AGENT:\n        $_SESSION['agent']\
  \ = md5($_SERVER['HTTP_USER_AGENT']);\n\n        // Redirect:\n        redirect_user('loggedin.php');\n\
  \n    } else { // Unsuccessful!\n\n        // Assign $data to $errors for\n    \
  \    // login_page.inc.php:\n        $errors = $data;\n\n    }\n\n    mysqli_close($dbc);\
  \ // Close the\n    // database connection.\n\n} // End of the main submit conditional.\n\
  \n// Create the page:\ninclude('includes/login_page.inc.php');\n?>\n```\n\n---\n\
  \n防止劫持的一种方法是在会话中存储某种用户标识符，然后反复验证该值。`HTTP_USER_AGENT`（所用浏览器和操作系统的组合）是实现此目的的理想候选者。这增加了一层安全性：只有当两人运行完全相同的浏览器和操作系统时，一人才能劫持另一用户的会话。作为演示，让我们最后一次修改这些示例。\n\
  \n#### 更安全地使用会话\n\n1.  在文本编辑器或 IDE 中打开 `login.php`（参考 脚本 12.8）。\n2.  在分配其他会话变量后，同时存储\
  \ `HTTP_USER_AGENT` 值（**脚本 12.12**）：\n\n    ```php\n    $_SESSION['agent'] = md5($_SERVER['HTTP_USER_AGENT']);\n\
  \    ```\n\n    `HTTP_USER_AGENT` 是 `$_SERVER` 数组的一部分（您可能回想起早在 第 1 章 “PHP 简介”中就用过它）。其值类似于\
  \ `Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1...`。\n\n    该值不会原样存储在会话中，而是会通过\
  \ `md5()` 函数处理以增加安全性。该函数根据输入值返回一个 32 字符的十六进制字符串（称为*哈希值*）。理论上，没有两个字符串会产生相同的 `md5()`\
  \ 结果。\n\n3.  保存文件并将其放入 Web 目录。\n4.  在文本编辑器或 IDE 中打开 `loggedin.php`（脚本 12.9）。\n5.\
  \  将 `!isset($_SESSION['user_id'])` 条件更改为（**脚本 12.13**）：\n\n    ```php\n    if (!isset($_SESSION['agent'])\
  \ OR ($_SESSION['agent'] != md5($_SERVER['HTTP_USER_AGENT']))) {\n    ```\n\n  \
  \  此条件检查两件事。首先，它检查 `$_SESSION['agent']` 变量是否未设置（这部分与之前一样，只是使用 *agent* 代替了 *user_id*）。条件的第二部分检查\
  \ `$_SERVER['HTTP_USER_AGENT']` 的 `md5()` 值是否不等于存储在 `$_SESSION['agent']` 中的值。如果任一条件为真，用户将被重定向。\n\
  \n6.  保存此文件，放入 Web 目录，并在 Web 浏览器中通过登录进行测试。\n\n**脚本 12.13.** 此 `loggedin.php` 脚本现在会确认访问此页面的用户拥有与登录时相同的\
  \ `HTTP_USER_AGENT`。\n\n---\n\n```php\n<?php # Script 12.13 - loggedin.php #3\n\n\
  // The user is redirected here from\n// login.php.\n\nsession_start(); // Start\
  \ the session.\n\n// If no session value is present,\n// redirect the user:\n//\
  \ Also validate the HTTP_USER_AGENT!\nif (!isset($_SESSION['agent']) OR\n    ($_SESSION['agent']\
  \ != md5($_SERVER['HTTP_USER_AGENT']))) {\n\n    // Need the functions:\n    require('includes/login_functions.inc.php');\n\
  \    redirect_user();\n\n}\n\n// Set the page title and include the\n// HTML header:\n\
  $page_title = 'Logged In!';\ninclude('includes/header.html');\n\n// Print a customized\
  \ message:\necho \"<h1>Logged In!</h1>\n<p>You are now logged in, {$_SESSION['first_name']}!</p>\n\
  ```\n\n\n\n\n\n```php\n23  <p><a href=\"logout.php\">Logout</a></p>\";\n24\n25 \
  \ include ('includes/footer.html');\n26  ?>\n```\n\n***\n\n### 防止会话固定\n\n另一种特定类型的会话攻击称为*会话固定*。这种方法与*会话劫持*截然相反。恶意用户\
  \ Alice 不是寻找并使用 Bob 的会话 ID，而是创建她自己的会话 ID（也许是通过合法登录），然后让 Bob 使用该会话访问网站。其企图是 Bob 随后会做一些无意中对\
  \ Alice 有利的事情。\n\n你可以通过在用户登录后更改会话 ID 来帮助防范此类攻击。`session_regenerate_id()` 函数正是执行此操作，它提供一个新的会话\
  \ ID 来引用当前的会话数据。你可以在安全至关重要的网站（如电子商务或网上银行）上使用此函数，或者在某些用户（即管理员）的会话被操纵将特别糟糕的情况下使用。\n\
  \n***\n\n### 提示\n\n对于会话的关键用途，如果可能，请要求使用 Cookie 并通过安全连接传输它们。你甚至可以通过将 `session.use_only_cookies`\
  \ 设置为 1 来设置 PHP 仅使用 Cookie。\n\n***\n\n### 提示\n\n默认情况下，服务器将每个站点的每个会话文件都存储在同一个临时目录中，这意味着理论上任何站点都可以读取任何其他站点的会话数据。如果你使用的是与其他域共享的服务器，将\
  \ `session.save_path` 从其默认设置更改为其他值会更安全。例如，最好将你站点的会话数据存储在专门用于你站点的专用目录中。\n\n***\n\n\
  ### 提示\n\n会话数据本身也可以存储在数据库中，而不是文本文件中。这是一种更安全但编程工作量更大的选择。我在我的著作 *PHP 5 Advanced: Visual\
  \ QuickPro Guide* 中教授如何实现这一点。\n\n***\n\n### 提示\n\n用户的 IP 地址（用户连接所用的网络地址）并*不是*一个好的唯一标识符，原因有二。首先，用户的\
  \ IP 地址可以而且通常确实会频繁变更（ISP 会在短时间内动态分配它们）。其次，从同一网络（如家庭网络或办公室）访问站点的许多用户可能都拥有相同的 IP 地址。\n\
  \n***\n\n### 复习与练习\n\n如果你对复习问题或练习提示有任何疑问，请访问本书的支持论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）。\n\
  \n#### 复习\n\n- 用什么代码将用户的浏览器从一个页面重定向到下一个页面？\n- *headers already sent*（标头已发送）错误消息是什么意思？\n\
  - `$_SERVER['HTTP_HOST']` 存储什么值？`$_SERVER['PHP_SELF']` 存储什么值？\n- `dirname()` 函数有什么作用？\n\
  - `rtrim()` 函数有什么作用？它可以接受什么参数？\n- 如何编写一个返回多个值的函数？如何调用这样的函数？\n- `setcookie()` 函数可以接受什么参数？\n\
  - 如何引用之前存储在 Cookie 中的值？\n- 如何删除现有的 Cookie？\n- Cookie 发送后（在同一页面上）是否立即可用？为什么删除 Cookie\
  \ 后（在同一页面上）仍然可以引用它？\n- 当你在 Cookie 方面遇到问题时，可以采取哪些调试步骤？\n- `basename()` 函数有什么作用？\n\
  - 如何开始一个会话？\n- 如何引用之前存储在会话中的值？\n- 会话数据赋值后（在同一页面上）是否立即可用？\n- 如何终止一个会话？\n- 当你在会话方面遇到问题时，可以采取哪些调试步骤？\n\
  \n#### 练习\n\n- 如果你还没有这样做，请学习如何在 Web 浏览器中查看 Cookie 数据。在开发使用 Cookie 的站点时，启用浏览器在接收\
  \ Cookie 时提示你的选项。\n- 使登录表单具有粘性（即保留用户输入）。\n- 在登录页面处理 `$errors` 变量的代码中添加逻辑：如果 `$errors`\
  \ 是数组，则使用 `foreach` 循环；否则直接打印 `$errors` 的值。\n- 修改 `redirect_user()` 函数，使其可用于将用户重定向到另一个目录中的页面。\n\
  - 实现另一个 Cookie 示例，例如将用户偏好存储在 Cookie 中，然后根据存储的值（如果存在）决定页面的外观或功能。\n- 更改 `logout.php`（脚本\
  \ 12.11）中的代码，使其使用 `session_name()` 函数动态设置要删除的会话 Cookie 的名称值。\n- 如果你想获得更多会话练习，请实现另一个会话示例（本书后面也会有更多练习）。\n\
  - 查阅本章介绍的你不熟悉的任何新函数的 PHP 手册页面。\n- 查阅 PHP 手册中关于 Cookie 和会话的页面（两个独立的部分）以了解更多信息。同时阅读一些用户提交的评论以获取额外提示。\n\
  \n## 13. 安全方法\n\n### 本章内容\n\n- 防止垃圾邮件 402\n- 按类型验证数据 409\n- 按类型验证文件 414\n- 防止 XSS\
  \ 攻击 418\n- 使用 Filter 扩展 421\n- 防止 SQL 注入攻击 425\n- 复习与练习 432\n\nWeb 应用程序的安全性是一个极其重要的主题，怎么强调都不为过。虽然全书都提到了与安全相关的问题，但本章将帮助填补特定空白、完善其他要点，并教授几个新知识。\n\
  \n本章讨论的主题包括：防止垃圾邮件；变量类型转换；防止跨站脚本（XSS）和 SQL 注入攻击；新的 Filter 扩展；以及按类型验证上传文件。本章将使用五个独立的示例来最好地演示这些概念。其他一些常见的安全问题和最佳实践将在侧边栏中提及。\n\
  \n### 防止垃圾邮件\n\n垃圾邮件简直是一种瘟疫，堵塞了互联网和电子邮件收件箱。你可以采取一些措施来避免在你的电子邮件账户中接收垃圾邮件，但本书的重点是防止垃圾邮件通过你的\
  \ PHP 脚本发送。\n\n第 11 章“Web 应用程序开发”展示了使用 PHP 的 `mail()` 函数发送电子邮件是多么容易。那里的示例是一个联系表单，它从用户\
  \ ![Image](img/circle-a.jpg) 获取一些信息并将其发送到一个电子邮件地址。尽管这套系统看起来似乎无害，但实际上存在一个巨大的安全漏洞。但首先，先了解一下电子邮件实际上是什么。\n\
  \n![Image](img/13_figure_01_a.jpg)\n\n![Image](img/circle-a.jpg) 一个简单的标准 HTML 联系表单。\n\
  \n无论电子邮件如何发送、如何格式化、以及接收时是什么样子，电子邮件都包含两部分：标头和正文。标头包括*收件人*和*发件人*地址、主题、日期等信息 ![Image](img/circle-b.jpg)。标头中的每一项都独占一行，格式为\
  \ *名称*：*值*。电子邮件的正文正是你所想的那样：电子邮件的正文。\n\n![Image](img/13_figure_02_b.jpg)\n\n![Image](img/circle-b.jpg)\
  \ 联系表单发送的电子邮件的原始源代码版本 ![Image](img/graycircle-a.jpg)。\n\n\n\n\n\n#### PHP `mail()`\
  \ 函数与垃圾邮件防范\n\n在查看 PHP 的 `mail()` 函数——`mail(to, subject, body[, headers])`——时，你可以看到其中一个参数直接进入邮件正文，其余参数则出现在邮件头中。要向*你的地址*发送垃圾邮件（如第\
  \ 11 章示例所示），用户只需在表单的评论部分输入垃圾邮件内容 ![Image](img/graycircle-a.jpg)。这已经够糟糕了，但要同时向*其他人*发送垃圾邮件，用户只需在邮件头中添加\
  \ `Bcc: poorsap@example.org`，并跟上某种行终止符（如换行符或回车符）。按示例原样操作，这仅意味着在联系表单的 *from* 值中输入：`me@example.com\\\
  nBcc:poorsap@example.org`。\n\n你可能认为保护所有进入邮件头的内容就足够安全了，但由于邮件只是一个文档，正文中的恶意输入也会影响邮件头。\n\
  \n可以针对该联系表单采取几种预防技术。首先，使用正则表达式验证邮箱地址，相关内容见第 13 章“Perl 兼容正则表达式”，或稍后讨论的 Filter 扩展。其次，既然你知道作恶者必须输入什么才能发送垃圾邮件（**表\
  \ 13.1**），就在表单值中监视那些字符和字符串。如果某值包含列表中的任何内容，请勿在发送的邮件中使用该值（**表 13.1** 中最后四个值都是创建换行的不同方式）。\n\
  \n**表 13.1. 垃圾邮件线索**\n\n![Image](img/13tab01.jpg)\n\n在下一个示例中（基于第 11 章的邮件脚本修改），我将定义一个函数，清除所提供数据中所有潜在危险字符。同时将用到两个新的\
  \ PHP 函数：`str_replace()` 和 `array_map()`。两者将在后续步骤中详细解释。\n\n---\n\n### 安全方法\n\n理解安全最重要的概念是：它不是二元状态。不要认为网站或脚本要么*安全*要么*不安全*。安全不是你开关的开关；它是一个你可以上下移动的刻度。编程时，要思考如何让网站*更安全*，以及你做了什么让它*降低安全性*。同时请记住，提高安全性通常以便利性（对你这位程序员和最终用户皆是如此）和性能为代价。增强安全性通常意味着更多代码、更多检查和更多服务器资源。开发\
  \ Web 应用时，目标是达到针对特定情况适当的安全级别。然后，为了谨慎起见，最好在安全方面稍微“过度”一点。\n\n---\n\n### 防止垃圾邮件\n\n\
  **1.** 在文本编辑器或 IDE 中打开 `email.php`（**脚本 11.1**）。\n\n为完成垃圾邮件净化，需修改邮件脚本。\n\n**2.**\
  \ 检查表单提交后，开始定义函数（**脚本 13.1**）：\n\n```php\nfunction spam_scrubber($value) {\n```\n\
  \n该函数接受一个参数：字符串。通常我会在脚本顶部或单独文件中定义函数，但为简化操作，将在提交处理代码块内定义。\n\n**3.** 创建一个列表，包含合法联系表单提交中不应出现的极其恶劣内容：\n\
  \n```php\n$very_bad = array('to:', 'cc:', 'bcc:', 'content-type:', 'mime-version:',\
  \ 'multipart-mixed:', 'content-transfer-encoding:');\n```\n\n诚实的联系表单提交中不应出现这些字符串（用户在评论中合法使用\
  \ `to:` 的可能性虽存但极低）。若存在此类字符串，即为垃圾邮件尝试。为便于检测，将它们放入数组以便循环遍历（步骤 4）。步骤 4 中的比较不区分大小写，因此所有危险字符串均以小写形式编写。\n\
  \n**4.** 循环遍历数组。若发现极其恶劣内容，返回空字符串：\n\n```php\nforeach ($very_bad as $v) {\n    if\
  \ (stripos($value, $v) !== false) return '';\n}\n```\n\n**脚本 13.1.** 此版本脚本现可安全发送邮件，无需担心垃圾邮件。任何有问题的字符都会被\
  \ `spam_scrubber()` 函数捕获。\n\n---\n\n```html\n1   <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML\n2       1.0 Transitional//EN\" \"http://www.w3.org/\n3       TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n4   <html xmlns=\"http://www.w3.org/1999/\n5       xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n6   <head>\n7       <meta http-equiv=\"Content-Type\"\n8           content=\"\
  text/html; charset=utf-8\" />\n9       <title>Contact Me</title>\n10  </head>\n\
  11  <body>\n12  <h1>Contact Me</h1>\n13  <?php # Script 13.1 - email.php #2\n14\
  \  // This version now scrubs dangerous\n15      strings from the submitted input.\n\
  16\n17  // Check for form submission:\n18  if ($_SERVER['REQUEST_METHOD'] == 'POST')\
  \ {\n19\n20      /* The function takes one argument: a\n21          string.\n22\
  \       * The function returns a clean\n23          version of the string.\n24 \
  \      * The clean version may be either an\n25          empty string or\n26   \
  \    * just the removal of all newline\n27          characters.\n28       */\n29\
  \      function spam_scrubber($value) {\n30\n31          // List of very bad values:\n\
  32          $very_bad = array('to:',\n33              'cc:', 'bcc:', 'content-type:',\n\
  34              'mime-version:', 'multipart-mixed:',\n35              'content-transfer-encoding:');\n\
  36\n37          // If any of the very bad strings\n38          are in\n39      \
  \    // the submitted value, return an\n40          empty string:\n41          foreach\
  \ ($very_bad as $v) {\n42              if (stripos($value, $v) !==\n43         \
  \         false) return '';\n44          }\n45\n46          // Replace any newline\
  \ characters\n47          with spaces:\n48          $value = str_replace(array(\"\
  \\r\",\n49              \"\\n\", \"%0a\", \"%0d\"), ' ', $value);\n50\n51      \
  \    // Return the value:\n52          return trim($value);\n53\n54      } // End\
  \ of spam_scrubber()\n55          function.\n56\n57      // Clean the form data:\n\
  58      $scrubbed = array_map\n59          ('spam_scrubber', $_POST);\n60\n61  \
  \    // Minimal form validation:\n62      if (!empty($scrubbed['name']) &&\n63 \
  \         !empty($scrubbed['email']) &&\n64          !empty($scrubbed['comments'])\
  \ ) {\n65\n66          // Create the body:\n67          $body = \"Name: {$scrubbed\n\
  68              ['name']}\\n\\nComments:\n69              {$scrubbed['comments']}\"\
  ;\n70\n71          // Make it no longer than 70\n72          characters long:\n\
  73          $body = wordwrap($body, 70);\n74\n75          // Send the email:\n76\
  \          mail('your_email@example.com',\n77              'Contact Form Submission',\
  \ $body,\n78              \"From: {$scrubbed['email']}\");\n79\n80          // Print\
  \ a message:\n81          echo '<p><em>Thank you for\n82              contacting\
  \ me. I will reply some\n83              day.</em></p>';\n84\n85          // Clear\
  \ $_POST (so that the form's\n86              not sticky):\n87          $_POST =\
  \ array();\n88\n89      } else {\n90          echo '<p style=\"font-weight: bold;\n\
  91              color: #C00\">Please fill out the\n92              form completely.</p>';\n\
  93      }\n94\n95  } // End of main isset() IF.\n96\n97  // Create the HTML form:\n\
  98  ?>\n99  <p>Please fill out this form to contact me.</p>\n100 <form action=\"\
  email.php\" method=\"post\">\n101     <p>Name: <input type=\"text\" name=\"name\"\
  \ size=\"30\" maxlength=\"60\" value=\"<?php if\n102         (isset($scrubbed['name']))\
  \ echo $scrubbed['name']; ?>\" /></p>\n103     <p>Email Address: <input type=\"\
  text\" name=\"email\" size=\"30\" maxlength=\"80\"\n\n\n\n\n```php\nvalue=\"<?php\
  \ if (isset($scrubbed['email'])) echo $scrubbed['email']; ?>\" /></p>\n\n72    \
  \  <p>Comments: <textarea name=\"comments\" rows=\"5\" cols=\"30\"><?php if\n  \
  \    (isset($scrubbed['comments'])) echo $scrubbed['comments']; ?></textarea></p>\n\
  \n73      <p><input type=\"submit\" name=\"submit\" value=\"Send!\" /></p>\n\n74\
  \  </form>\n\n75  </body>\n\n76  </html>\n```\n\n---\n\n`foreach`循环将逐个访问`$very_bad`数组中的每一项，并将每一项赋值给`$v`。在循环内部，`stripos()`函数将检查该项是否存在于作为`$value`提供给该函数的字符串中。`stripos()`函数执行不区分大小写的搜索（因此它会匹配`bcc:`、`Bcc:`、`bCC:`等）。如果在\
  \ haystack 中找到 needle（例如，在`$value`中查找`$v`的出现），该函数返回布尔值`TRUE`。因此，条件语句表示如果该函数的结果不等于`FALSE`（即在`$value`中未找到`$v`），则返回空字符串。\n\
  \n因此，对于每一个危险字符串，首次在提交的值中发现它们中的任何一个时，该函数将返回空字符串并终止（函数一旦遇到`return`就会自动停止执行）。\n\n**5.\
  \ 将任何换行符替换为空格：**\n\n```php\n$value = str_replace(array(\"\\\\r\", \"\\\\n\", \"\
  %0a\", \"%0d\"), ' ', $value);\n```\n\n换行符由`\\r`、`\\n`、`%0a`和`%0d`表示，可能会也可能不会造成问题。发送垃圾邮件需要换行符（否则无法创建正确的标头），但如果用户在\
  \ textarea 框中输入时按下 Enter 或 Return 键，也会出现换行符。因此，任何找到的换行符都将被替换为空格。这意味着提交的值可能会丢失部分格式，但为了阻止垃圾邮件，这是合理的代价。\n\
  \n`str_replace()`函数遍历第三个参数中的值，并将第一个参数中的字符出现替换为第二个参数中的字符。正如 PHP 手册所述：\n\n```text\n\
  mixed str_replace (mixed $search, mixed $replace, mixed $subject)\n```\n\n此函数非常灵活，因为它可以接受字符串或数组作为其三个参数（`mixed`意味着它接受混合的参数类型）。因此，脚本中的这行代码将`$value`变量赋值为其原始值，并将任何换行符替换为单个空格。\n\
  \n此函数有一个不区分大小写的版本，但这里不需要，因为例如`\\r`是回车符，但`\\R`不是。\n\n**6. 返回值并完成函数：**\n\n```php\n\
  return trim($value);\n} // End of spam_scrubber() function.\n```\n\n最后，该函数返回去除首尾空格后的值。请记住，只有在未发现任何非常危险的内容时，函数才会执行到这一点。\n\
  \n**7. 在函数定义后，调用`spam_scrubber()`函数：**\n\n```php\n$scrubbed = array_map('spam_scrubber',\
  \ $_POST);\n```\n\n这种方法简洁而优美！`array_map()`函数有两个必需参数。第一个是要调用的函数名。在本例中，是`spam_scrubber`（不带括号，因为你提供的是函数的*名称*，而不是调用该函数）。第二个参数是一个数组。\n\
  \n`array_map()`会将指定的函数应用于数组的每个元素，将每个元素的值发送给该函数调用。在本脚本中，`$_POST`有四个元素——`name`、`email`、`comments`和`submit`，这意味着得益于`array_map()`，`spam_scrubber()`函数将被调用四次。执行这行代码后，`$scrubbed`数组将包含四个元素：`$scrubbed['name']`将包含`$_POST['name']`经`spam_scrubber()`处理后的值；`$scrubbed['email']`将包含`$_POST['email']`经`spam_scrubber()`处理后的值；以此类推。\n\
  \n这一行代码获取整个潜在受污染的数据数组（`$_POST`），使用`spam_scrubber()`进行清理，并将结果赋值给新变量。该技术最重要的一点是：从现在开始，脚本必须使用干净的`$scrubbed`数组，而不是仍可能脏的`$_POST`。\n\
  \n**8. 更改表单验证以使用这个新数组：**\n\n```php\nif (!empty($scrubbed['name']) && !empty($scrubbed['email'])\
  \ && !empty($scrubbed['comments'])) {\n```\n\n这些元素中的每一个都可能有两个原因导致值为空。第一，用户将它们留空。第二，用户在字段中输入了其中一个坏字符串，这会被`spam_scrubber()`函数转换为空字符串。\n\
  \n![Image](img/13_figure_03_c.jpg)\n\n![Image](img/circle-c.jpg)电子邮件地址字段中存在`cc:`将阻止此提交通过电子邮件发送\
  \ ![Image](img/graycircle-d.jpg)。\n\n![Image](img/13_figure_04_d.jpg)\n\n![Image](img/circle-d.jpg)由于电子邮件地址中使用了非常危险的字符，被垃圾邮件防止函数转换为空字符串，因此邮件未发送。\n\
  \n**9. 更改`$body`变量的创建以使用干净的值：**\n\n```php\n$body = \"Name: {$scrubbed['name']}\\\
  n\\nComments: {$scrubbed['comments']}\";\n```\n\n**10. 更改`mail()`函数的调用以使用干净的电子邮件地址：**\n\
  \n```php\nmail('your_email@example.com', 'Contact Form Submission', $body, \"From:\
  \ {$scrubbed['email']}\");\n```\n\n请记得在`mail()`调用中使用您自己的电子邮件地址，否则您永远收不到消息！\n\n**11.\
  \ 更改表单以使用`$scrubbed`版本的值：**\n\n```html\n<p>Name: <input type=\"text\" name=\"name\"\
  \ size=\"30\" maxlength=\"60\" value=\"<?php if (isset($scrubbed['name'])) echo\
  \ $scrubbed['name']; ?>\" /></p>\n\n<p>Email Address: <input type=\"text\" name=\"\
  email\" size=\"30\" maxlength=\"80\" value=\"<?php if (isset ($scrubbed['email']))\
  \ echo $scrubbed['email']; ?>\" /></p>\n\n<p>Comments: <textarea name=\"comments\"\
  \ rows=\"5\" cols=\"30\"><?php if (isset ($scrubbed['comments'])) echo $scrubbed['comments'];\
  \ ?> </textarea></p>\n```\n\n**12. 将脚本保存为`email.php`，将其放在您的 Web 目录中，并在 Web 浏览器中测试它**\
  \ ![Image](img/circle-e.jpg)和 ![Image](img/circle-f.jpg)。\n\n![Image](img/13_figure_05_e.jpg)\n\
  \n![Image](img/circle-e.jpg)虽然 comments 字段包含换行符（由按 Enter 或 Return 键创建），但电子邮件仍将被发送\
  \ ![Image](img/graycircle-f.jpg)。\n\n![Image](img/13_figure_06_f.jpg)\n\n![Image](img/circle-f.jpg)收到的电子邮件，comments\
  \ 中的换行符 ![Image](img/graycircle-e.jpg)已转换为空格。\n\n---\n\n> **Tip**\n>\n> 在此示例中使用`array_map()`函数虽然方便，但也有缺点。首先，它盲目地将`spam_scrubber()`函数应用于整个`$_POST`数组，甚至包括提交按钮。这无害但没必要。其次，`$_POST`中的任何多维数组都将丢失。在本具体示例中这不是问题，但值得注意。\n\
  \n---\n\n> **Tip**\n>\n> 为防止任何表单的自动提交，您可以使用 CAPTCHA 测试。这些提示理论上只能被人类理解。虽然通常使用随机字符图像来实现，但也可以通过类似“二加二等于几？”或“中国在哪个大洲？”这样的问题来实现。检查此问题的正确答案将成为验证例程的一部分。\n\
  \n---\n\n### 按类型验证数据\n\n\n\n\n#### PHP 中的表单验证与类型转换\n\n到目前为止，本书中使用的表单验证大多相当简单，通常只是检查变量是否有任何值。在许多情况下，这确实是你能做的最好的验证。例如，对于什么是有效的街道地址，或者用户可能在评论字段中输入什么内容，并不存在完美的测试标准。尽管如此，你将要处理的大部分数据都可以用更严格的方式进行验证。在下一章中，正则表达式这一复杂概念将演示如何做到这一点。但在这里，我将介绍一些更易上手的方法，通过类型来验证某些数据。\n\
  \n---\n\n### 两种验证方法\n\n安全性很大程度上建立在验证之上：如果数据来自服务器之外——来自 HTML 表单、URL、Cookie——就不能信任它。（更高级别的安全性还会验证来自*脚本*之外的任何数据，包括会话和数据库。）验证主要有两种类型：*白名单*\
  \ 和 *黑名单*。\n\n在计算器示例中，我们知道所有值必须为正数，必须都是数字，且数量必须为整数（另外两个数字可以是整数或浮点数，这无关紧要）。类型转换强制输入为数字，检查则确认它们为正数。此时，假设输入是有效的。这是白名单方法：这些值是好的；其他任何值都是坏的。\n\
  \n防止垃圾信息的示例使用了黑名单方法。该脚本确切知道哪些字符是坏的，并使包含这些字符的输入无效。所有其他输入都被视为好。\n\n许多安全专家倾向于使用白名单方法，但它并不总是适用。每个示例将决定哪种方法效果最好，但重要的是要使用其中一种。不要在没有任何验证的情况下就假设数据是安全的。\n\
  \n---\n\n### 类型验证函数\n\nPHP 支持多种数据类型：字符串、数字（整数和浮点数）、数组等。针对每种类型，都有一个特定的函数来检查变量是否属于该类型（表\
  \ 13.2）。你在前几章中已经看到了 `is_numeric()` 函数的实际应用，而 `is_array()` 非常适合确认变量可用于 `foreach`\
  \ 循环。如果提交的变量属于特定类型，每个函数返回 `TRUE`，否则返回 `FALSE`。\n\n**表 13.2. 类型验证函数**\n\n![Image](img/13tab02.jpg)\n\
  \n在 PHP 中，甚至可以在变量被赋值后改变其类型。这样做称为 *类型转换*，通过在变量名前加上目标类型（用括号括起来）来实现：\n\n```php\n$var\
  \ = 20.2;\necho (int) $var; // 20\n```\n\n根据原始类型和目标类型的不同，PHP 会相应地转换变量的值：\n\n```php\n\
  $var = 20;\necho (float) $var; // 20.0\n```\n\n对于数值，转换很直接，但对于其他变量类型，则适用更复杂的规则：\n\
  \n```php\n$var = 'trout';\necho (int) $var; // 0\n```\n\n在大多数情况下，你不需要将变量从一种类型强制转换为另一种类型，因为\
  \ PHP 通常会在需要时自动进行转换。但在 Web 应用程序中，强制转换变量类型可以是一个很好的安全措施。为了展示如何使用这一概念，让我们创建一个计算器脚本，用于确定商品的总购买价格\
  \ ![Image](img/circle-a.jpg)。\n\n![Image](img/13_figure_07_a.jpg)\n\n![Image](img/circle-a.jpg)\
  \ HTML 表单接受三个输入：数量、价格和税率。\n\n### 使用类型转换\n\n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为\
  \ `calculator.php`（脚本 13.2）：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n \
  \ <title>Widget Cost Calculator </title>\n</head>\n<body>\n<?php # Script 13.2 -\
  \ calculator.php\n```\n\n**脚本 13.2.** 通过对变量进行*类型转换*，该脚本更明确地验证数据是否为正确格式。\n\n---\n\
  \n```php\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\n       1.0 Transitional//EN\"\
  \ \"http://www.w3.org/\n       TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n2  <html\
  \ xmlns=\"http://www.w3.org/1999/\n       xhtml\" xml:lang=\"en\" lang=\"en\">\n\
  3  <head>\n4      <meta http-equiv=\"Content-Type\"\n         content=\"text/html;\
  \ charset=utf-8\" />\n5      <title>Widget Cost Calculator</title>\n6  </head>\n\
  7  <body>\n8  <?php # Script 13.2 - calculator.php\n9  // This script calculates\
  \ an order total\n       based upon three form values.\n10\n11  // Check if the\
  \ form has been submitted:\n12  if ($_SERVER['REQUEST_METHOD'] == 'POST') {\n13\n\
  14      // Cast all the variables to a\n         specific type:\n15      $quantity\
  \ = (int) $_POST['quantity'];\n16      $price = (float) $_POST['price'];\n17   \
  \   $tax = (float) $_POST['tax'];\n18\n19      // All variables should be positive!\n\
  20      if ( ($quantity > 0) && ($price >\n         0) && ($tax > 0) ) {\n21\n22\
  \          // Calculate the total:\n23          $total = $quantity * $price;\n24\
  \          $total += $total * ($tax/100);\n25\n26          // Print the result:\n\
  27          echo '<p>The total cost of purchasing\n              ' . $quantity .\
  \ ' widget(s) at $' .\n              number_format ($price, 2) . ' each,\n     \
  \         plus tax, is $' . number_format\n              ($total, 2) . '.</p>';\n\
  28\n29      } else { // Invalid submitted values.\n30          echo '<p style=\"\
  font-weight: bold;\n              color: #C00\">Please enter a valid\n         \
  \     quantity, price, and tax rate.</p>';\n31      }\n32\n33  } // End of main\
  \ isset() IF.\n34\n35  // Leave the PHP section and create the\n       HTML form.\n\
  36  ?>\n37  <h2>Widget Cost Calculator</h2>\n38  <form action=\"calculator.php\"\
  \n         method=\"post\">\n39      <p>Quantity: <input type=\"text\"\n       \
  \       name=\"quantity\" size=\"5\" maxlength=\"10\"\n              value=\"<?php\
  \ if (isset($quantity)) echo\n              $quantity; ?>\" /></p>\n40      <p>Price:\
  \ <input type=\"text\"\n              name=\"price\" size=\"5\" maxlength=\"10\"\
  \n              value=\"<?php if (isset($price)) echo\n              $price; ?>\"\
  \ /></p>\n41      <p>Tax (%): <input type=\"text\"\n              name=\"tax\" size=\"\
  5\" maxlength=\"10\"\n              value=\"<?php if (isset($tax)) echo\n      \
  \        $tax; ?>\" /></p>\n42      <p><input type=\"submit\" name=\"submit\"\n\
  \              value=\"Calculate!\" /></p>\n43  </form>\n44  </body>\n45  </html>\n\
  ```\n\n---\n\n**2.** 检查表单是否已提交：\n\n```php\nif ($_SERVER['REQUEST_METHOD'] == 'POST')\
  \ {\n```\n\n与许多前面的示例一样，这个脚本既会显示 HTML 表单，也会处理其提交。\n\n**3.** 将所有变量转换为特定类型：\n\n```php\n\
  $quantity = (int) $_POST['quantity'];\n$price = (float) $_POST['price'];\n$tax =\
  \ (float) $_POST['tax'];\n```\n\n表单本身有三个文本框 ![Image](img/graycircle-a.jpg)，实际上可以输入任何内容（HTML\
  \ 4 或 XHTML 1.1 中表单没有 number 类型的输入）。但数量必须是整数，而价格和税率可以作为浮点数（即可以包含小数点）。为了强制这些约束，将每个变量转换为特定类型。\n\
  \n**4.** 检查变量是否具有合适的值：\n\n```php\nif ( ($quantity > 0) && ($price > 0) && ($tax\
  \ > 0) ) {\n```\n\n为了使计算器正常工作，这三个变量必须是特定类型（见步骤 3）。更重要的是，它们必须都是正数。在执行计算之前，此条件检查这一点。注意，根据类型转换的规则，如果提交的值不是数字，它们将被转换为\
  \ `0`，因此无法通过此条件判断。\n\n**5.** 计算并打印结果：\n\n```php\n$total = $quantity * $price;\n\
  $total += $total * ($tax/100);\n```\n\n\n\n\necho '<p>The total cost of purchasing\
  \ ' . $quantity . ' widget(s) at $' . number_format($price, 2) . ' each, plus tax,\
  \ is $' . number_format($total, 2) . '.</p>';\n\n要计算总计，首先将数量乘以价格。要对总计应用税费，将总计值乘以税率再除以\
  \ 100（例如，6.5% 变为 .065）所得的值随后被加上，使用的是加法赋值简写运算符。`number_format()` 函数用于以正确格式打印价格和总计值\
  \ ![Image](img/circle-b.jpg)。\n\n![Image](img/13_figure_08_b.jpg)\n\n![Image](img/circle-b.jpg)表单正确填写时的计算结果。\n\
  \n**6.** 完成条件语句：\n\n```\n} else {\n    echo '<p style=\"font-weight: bold; color:\
  \ #C00\">Please enter a valid quantity, price, and tax rate.</p>';\n} // End of\
  \ main isset() IF.\n```\n\n这里使用了一点 CSS 来创建加粗的红色错误消息，以防出现问题 ![Image](img/circle-c.jpg)。\n\
  \n![Image](img/13_figure_09_c.jpg)\n\n![Image](img/circle-c.jpg)如果三个字段中的任意一个不包含正数，将打印加粗红色文本的错误消息。\n\
  \n**7.** 开始 HTML 表单：\n\n```\n?>\n<h2>Widget Cost Calculator</h2>\n<form action=\"\
  calculator.php\" method=\"post\">\n  <p>Quantity: <input type=\"text\" name=\"quantity\"\
  \ size=\"5\" maxlength=\"10\" value=\"<?php if (isset($quantity)) echo $quantity;\
  \ ?>\" /></p>\n```\n\nHTML 表单非常简单，并提交回此同一页面。输入框将具有粘性，以便用户可以看到之前输入的内容。通过引用 `$quantity`\
  \ 等而不是 `$_POST['quantity']` 等，表单将反映每个输入*经过类型转换后*的值。\n\n**8.** 完成 HTML 表单：\n\n```\n\
  \  <p>Price: <input type=\"text\" name=\"price\" size=\"5\" maxlength=\"10\" value=\"\
  <?php if (isset($price)) echo $price; ?>\" /></p>\n  <p>Tax (%): <input type=\"\
  text\" name=\"tax\" size=\"5\" maxlength=\"10\" value=\"<?php if (isset($tax)) echo\
  \ $tax; ?>\" /></p>\n  <p><input type=\"submit\" name=\"submit\" value=\"Calculate!\"\
  \ /></p>\n</form>\n```\n\n**9.** 完成 HTML 页面：\n\n```\n</body>\n</html>\n```\n\n**10.**\
  \ 将文件保存为 `calculator.php`，将其放在您的 Web 目录中，并在 Web 浏览器中测试它 ![Image](img/circle-d.jpg)和\
  \ ![Image](img/circle-e.jpg)。\n\n![Image](img/13_figure_10_d.jpg)\n\n![Image](img/circle-d.jpg)如果输入了无效值，例如数量输入浮点数或税率输入字符串……\n\
  \n![Image](img/13_figure_11_e.jpg)\n\n![Image](img/circle-e.jpg)……它们将被转换为更合适的格式。负价格也将阻止此计算的进行（尽管转换不会改变该值）。\n\
  \n***\n\n提示\n\n在 SQL 查询中处理数字时，您绝对应该使用类型转换。数字在查询中不加引号，因此如果字符串以某种方式被用在数字的位置上，将会发生\
  \ SQL 语法错误。如果您先将此类变量转换为整数或浮点数，查询可能无法工作（就返回记录而言），但语法上仍然有效。您将在本书最后三章中经常看到这种做法。\n\n\
  ***\n\n提示\n\n正如我暗示的那样，正则表达式是一种更高级的数据验证方法，有时是您的最佳选择。但在可行的情况下，使用基于类型的验证肯定会更快（就处理器速度而言），且不太容易出现程序员错误（我提到过正则表达式很复杂吗？）。\n\
  \n***\n\n提示\n\n再重申一次，值从一种数据类型转换为另一种数据类型的规则有些复杂。如果您想深入了解细节，请参阅 PHP 手册。\n\n***\n\n\
  #### 按类型验证文件\n\n第 11 章包含一个在 PHP 中处理文件上传的示例。由于上传文件允许用户在您的服务器上放置比通过表单发送的文本更强效的内容类型，因此在处理文件上传时，对安全性的重视程度再怎么强调都不为过。在该特定示例中，通过检查其\
  \ MIME 类型来验证上传的文件。具体来说，对于上传的文件，`$_FILES['upload']['type']` 指的是上传浏览器提供的 MIME 类型。这是一个好的开始，但恶意用户很容易欺骗浏览器提供虚假的\
  \ MIME 类型。确认文件类型的更可靠方法是使用 Fileinfo 扩展。\n\nFileinfo 扩展在 PHP 5.3 中加入，它通过在文件中搜索“魔术字节”或“魔术数字”来确定文件的类型（和编码）。例如，构成\
  \ GIF 图像的数据必须以代表 *GIF89a* 或 *GIF87a* 的 ASCII 码开头；构成 PDF 文件的数据以 *%PDF* 开头。\n\n要使用\
  \ Fileinfo，首先创建一个 Fileinfo 资源：\n\n```\n$fileinfo = finfo_open(kind);\n```\n\n*kind*\
  \ 值将是几个常量之一，指示您要创建的资源类型。要确定文件类型，该常量为 `FILEINFO_MIME_TYPE`：\n\n```\n$fileinfo = finfo_open(FILEINFO_MIME_TYPE);\n\
  ```\n\n接下来，调用 `finfo_file()` 函数，提供 Fileinfo 资源和对要检查的文件的引用：\n\n```\nfinfo_file($fileinfo,\
  \ $filename);\n```\n\n该函数根据文件实际的魔术字节返回文件的 MIME 类型（给定已创建的资源）。\n\n最后，完成后，您应该关闭 Fileinfo\
  \ 资源：\n\n```\nfinfo_close($fileinfo);\n```\n\n下一个脚本将使用此信息来确认上传的文件是 RTF（富文本格式）。请注意，只有当您使用\
  \ PHP 5.3 或更高版本时，才能测试此示例 ![Image](img/circle-a.jpg)。如果您使用的是早期版本，则需要通过 PECL（PHP 扩展社区库，[`pecl.php.net`](http://pecl.php.net)）安装\
  \ Fileinfo 扩展。在 Windows 上，如果您使用的是 PHP 5.3 或更高版本，Fileinfo DLL 文件应包含在您的安装中，但您可能需要在\
  \ `php.ini` 配置文件中启用它（从 peachpit.com 下载附录 A“安装”）。\n\n![Image](img/13_figure_12_a.jpg)\n\
  \n![Image](img/circle-a.jpg)如果您的 PHP 安装不支持 Fileinfo 扩展，您将看到如下错误消息。\n\n**脚本 13.3.**\
  \ 使用 Fileinfo 扩展，此脚本能很好地确认上传文件的类型。\n\n***\n\n```\n1  <!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML\n      1.0 Transitional//EN\" \"http://www.w3.org/\n      TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n2  <html xmlns=\"http://www.w3.org/1999/\n      xhtml\" xml:lang=\"en\" lang=\"\
  en\">\n3  <head>\n4      <meta http-equiv=\"Content-Type\"\n        content=\"text/html;\
  \ charset=utf-8\" />\n5      <title>Upload a RTF Document</title>\n6  </head>\n\
  7  <body>\n8  <?php # Script 13.3 - upload_rtf.php\n\n9  // Check if the form has\
  \ been submitted:\n10 if ($_SERVER['REQUEST_METHOD'] == 'POST')\n{\n11\n12    //\
  \ Check for an uploaded file:\n13    if (isset($_FILES['upload']) && file_\n   \
  \     exists($_FILES['upload']['tmp_name'])) {\n14\n15        // Validate the type.\
  \ Should be\nRTF.\n16        // Create the resource:\n17        $fileinfo = finfo_open\n\
  \          (FILEINFO_MIME_TYPE);\n18\n19        // Check the file:\n20        if\
  \ (finfo_file($fileinfo,\n          $_FILES['upload']['tmp_name']) ==\n        \
