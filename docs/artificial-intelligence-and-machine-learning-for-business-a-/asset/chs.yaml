- "# 商业人工智能与机器学习：数据驱动技术实战指南\n\n\n\n“用文字玩出花样”\n\n\n献给 Sam 和 Ruby\n\n- 关于作者\n\n## 致谢\n\
  我要感谢我的家人，特别是我的妻子 Samantha，她在写这本书期间提供的支持。我还要感谢上一版的所有读者，他们向我提供了建议、更正、想法和创意。我已将其中大部分内容融入到了本书中。我特别感谢那位告诉我哪里可以买到橙洗衣机的读者。\n\
  \n## 前言\n单程 56 分钟。往返 112 分钟。这是我的通勤火车从我的家乡普斯顿（Preston）到英国大城市曼彻斯特往返所需的时间。我觉得这段时间是阅读一些书籍的理想时间。因此，我想一本关于人工智能和机器学习的简明书籍，如果可以在这段时间内读完，对于那些时间不充裕的人来说将非常有用。\n\
  \n理解机器学习非常重要，因为它正对我们生活的许多方面产生巨大影响。特别是，它正驱动着语言翻译、自主机器人和医疗诊断等许多领域“人工智能”应用的爆发式增长。\n\
  \n人工智能和机器学习对许多日常业务功能也产生了直接影响。基于机器学习的自动化系统正在取代许多由人工完成的任务。这为采用这些技术的组织带来了相对于竞争对手的竞争优势，因为此类系统可以提供效率的提升和改进的客户服务。\n\
  \n这本书的这个新修订版比旧版长得多。特别是增加了几个新章节，涵盖了比以前更广泛的话题。然而，我力求保留原书“简洁、实战”的风格。这不仅是因为这是读者表示他们喜欢的关键特点。因此，现在读完这本书可能比\
  \ 112 分钟稍长一点（可能需要往曼彻斯特往返两次而不是一次），但我希望你觉得这段时间花得很值。\n\n## 1. 引言\n你有智能手机或信用卡吗？你会在超市买东西或玩电脑游戏吗？你有工作或使用医疗保健服务吗？如果对这些问题的任何一个答案是“是”，那么人工智能和机器学习将以某种方式对你的生活产生影响。这是因为它们是组织利用他们拥有的关于你的数据以决定如何对待你的主要工具。这些工具被用于告知组织你在不同情况下可能会如何表现，从而决定他们应该如何对待你。\n\
  \n这些技术现在正被应用于生活的方方面面，通过“人工智能”机器和计算机接口来改进流程并增强人们的体验。`Amazon Echo`、`Apple Siri` 和\
  \ `Google Translate` 仅仅是展示了这些技术所能提供的优势三个三个软件产品。如今，许多产品和服务也具有自适应性。它们会为个人用户定制响应。电视和音乐流媒体服务学习识别你喜欢的内容，并向你推荐你无疑感兴趣的内容。改变你听的音乐类型，它们的推荐也会随之改变。同样，你可以购买供暖系统，它们会学习预测何时开启供暖的最佳时间，这样你就无需费心，同时优化能源使用以减少账单。这些都是人工智能应用的进一步示例。\n\
  \n这本简明文本提供了人工智能和机器学习的管理级（即非技术性的、无复杂公式的）概述。书中假设没有任何先验知识。换句话说，如果你识字、会写并且基础算术（书中有一些算术，但并不多），那么阅读书中的内容应该没有问题。\n\
  \n此时提出一个很好的问题是：我为什么需要了解这些东西？一个原因是个人的。基于机器学习的智能决策系统被组织广泛用于以决定如何对待你、你的朋友和你的家人。他们利用这些工具来决定你会收到优厚的报价还是恶劣的报价，你应该排在队列的前面还是后面，你是否会面临税务审计或被视为刑事案件的嫌疑人。因此，了解这些东西不是坏主意，这样你就能理解为什么组织可能以一种方式而非另一种方式对待你。\n\
  \n\n\n\n学习人工智能的另一个原因，也是本书关注的重点，是因为它现在已成为一种主流业务工具。就在不久前，人工智能还是极少数主要活跃在学术界、金融服务或大型营销部门的极客型专家的领域。如今，无论你从事何种业务，基于机器学习的人工智能应用贯穿于业务活动的方方面。这涵盖了从员工审查、回答客户查询和目标营销，到生产线上的机器人、仓库管理和客户交付的所有环节。因此，人工智能在许多领域支持或取代了人类的专业知识。一些示例包括：在设定保险保费时取代核保师、帮助人力资源专业人员决定聘用/解雇、在客户进入商店时自动识别他们，以及在医生诊断癌症和心脏病等疾病时提供支持。\n\
  \n人工智能已经强势到来。它不是一目之风，而是将持久存在。那些能够利用它来解决业务问题、提高效率并降低成本的组织将以竞争对手为代价获益。\n\n这并不意味着你需要学习技术专家（数据科学家）需要知道的所有知识。然而，对人工智能和机器学习有一定的实操性知识，并知道如何利用它们来帮助你的组织交付更好的产品和服务，将是有益的。尤其是因为为了有效利用这些工具，必须将其专注于业务目标，以解决组织面临的特定问题。\n\
  \n另一方面，如果你恰好是一个引用方程、玩弄公式的数学天才，并认为自己已经了关于人工智能的所有知识，那么这本书对你可能也有价值。甚至比对那些一无所知的人更有价值。为什么？因为如果你只关心该主题的理论方面，那么在现实世界的雷区中交付实用的解决方案时，你将面临碰墙的真实风险；这是一个充满了社会、伦理和政治问题的世界。加上日益增长的隐私和数据保护立法，无论你的解决方案在数学上有多完美，都可能导致你的方案流车。如果不考虑这些“软性问题”，最好的结果是你开发的解决方案无法部署；最坏的情况是你设计了一个基于人工智能的系统，结果让你上了法庭，因为它对少数群体、女性或其他群体产生了不公平的歧视。你可以跳过前面的几章，但绝对应该阅读后面的章节。\n\
  \n为了充分利用人工智能的价值，数据科学家需要与业务用户接触以理解他们的问题。数据科学家还需要理解组织的文化以及其采用新想法、新技术和工作实践的方法。客户所在地区的法律和监管问题也需要予以充分考虑。一个解决方案在尖端硬件软件方面有多好，如果它与组织的业务目标和运营流程不一致，那么一切都是浪费时间和金钱。\n\
  \n许多解决方案供应商用他们花哨的技术和最新的术语来误导你，这些术语往往只是去年技术换汤不药的重新包装。然而，增加价值的供应商将是那些花时间理解你和你的组织运作的人。他们将确定他们的解决方案可以以及如何被用于改进你们的工作，并用你能听懂的简单语言解释给你，而无需查阅维基百科。\n\
  \n成功的人工智能是双向的。数据科学家需要了解你的组织及其业务，而你需要稍微了解人工智能和机器学习。没有这种共同的理解，你或你的组织很难实现人工智能提供的全部收益。\n\
  \n好了。那么，通过这本书你会学到什么？我们在接下来的章节中涵盖的关键主题是：\n\n*   什么是机器学习和人工智能。\n*   组织使用人工智能的用途。\n\
  *   预测模型是什么样子的。\n*   人工智能、机器学习与“大数据”之间的关系。\n*   应用人工智能所需的人和工具。\n*   如何使用人工智能改进业务流程和底线。\n\
  *   在开发用于对人员做出决策的人工智能解决方案时，需要考虑的法律和伦理问题。\n*   高级形式的机器学习如何应用于推动识别和语言翻译等人工智能应用。\n\
  *   机器学习和人工智能目前的局限性。\n\n附录 B 和 C 分别提供了推荐的进一步阅读材料和常用机器学习/人工智能术语表。\n\n## 2. 什么是机器学习和人工智能\
  \ (AI)？\n\n机器学习是使用数学程序（算法）来分析数据。其目标是在不同数据项之间发现有用的模式（关系或相关性）。一旦识别出这些关系，就可以在新的案例出现时对其行为进行推断。本质上，这类比于人类的学习方式。我们观察周围发生的事情，并根据经验对世界的运作方式得出结论。然后我们将学到的知识用于帮助自己应对所处的新情境。我们经历得越多、学习得越高，我们决策的能力就越强。\n\
  \n机器学习的一个应用是物体识别。目标是开发能够从系统呈现的图像中识别日常对象的系统。用于开发物体识别系统的数据由不同物体的照片，如椅子、伞、洗衣机等。输入机器学习算法的每张照片都贴有标签，以识别它包含哪种类型的物体。对于每种类型的物体，可能有成百或上千张不同的图像，代表该物体从不同角度的替代形式（你会惊讶于伞竟然有这么多变体！）\n\
  \n通过分析不同的图像，机器学习算法识别出某些物体与某些特征（模式）相关。椅子倾向于从平坦的、通常是正方形的底座（座垫）长出突起（腿）。它们还通过有靠背与凳区分开来。洗衣机通常是立方体形状，上面带有旋钮，而且几乎不是粉色或橙色（如果你发现发现哪里可以买到粉色的洗衣机，请务必告诉我！）同样，伞在收合时是长而细的，通常是黑色但并非总是如此，等等。\n\
  \n\n\n机器学习最常见、也可以可以说是最早的应用之一就是预测。它是关于利用机器学习，根据你目前拥有的信息来确定你目前尚不知道的事物。人们所发现的模式与行为与结果之间的关系。这通常与人们过去的行为以及他们随后所做的事情有关。在识别出这些存在的关系后，就可以根据他们当前的状态对他们的未来行为做出预测。如果你给我提供一份人们之前购买历史的样本，我可以利用机器学习来识别他们购买行为中的模式。然后，我可以使用这些模式来预测某人可能购买的商品；即，未来的购买是我想要预测的结果。这让我能够针对这些特定产品，向他们提供定制的优惠活动来吸引他们。\n\
  \n使用机器学习进行预测有时被称为预测建模（predictive modelling）或预测性分析（Predictive Analytics, PA）。事实上，预测性分析是机器学习的一种常见应用，以至于许多人（无论正确与否）经常交替使用这两个术语。\n\
  \n预测个人的未来行为是人们通常与机器学习联系在一起的，但机器学习也可以应用于其他场景和问题。你只需要一些你想要确定（预测）的未知事件或事物即可，这可能发生在过去、现在或未来。医生检查患者、进行测试并询问他们的症状以收集证据（数据）。然后他们使用这些数据对他们认为患者出了什么问题得出结论。他们并不是在对患者的未来健康做出预测，而是试图找出他们今天出了什么问题。医生能以很高的准确做到这一点，因为他们将获得的患者信息与多年训练和实践中学习的知识进行交叉引用。换句话说，他们正在寻找患者的症状与他们对已知疾病之间的相关性。机器学习可以同样这样应用。给定关于不同疾病症状的详细信息，机器学习可以根据患者表现症状来估计某人患某种疾病的概率。\n\
  \n另一种思考机器学习/预测性分析的方法将其视为减少不确定性的方法。在任何给定情况下都可能发生各种结果。机器学习不会绝对确定告诉你哪种结果会发生，但它可以提供每种结果发生的概率或几率的见解。\n\
  \n你可能知道，当有人去超市购物时通常会买面包、葡萄酒和鸡肉，但通过机器学习，你可以确定例如，他们下次购买的产品是面包的概率为 80%，购买葡萄酒的概率为 15%，购买鸡肉的概率为\
  \ 5%。因此，如果你想鼓励他们在你的商店进行下一次购买，通过提供面包优惠比提供葡萄酒或鸡肉优惠更有可能赢得他们的青睐。\n\n预测模型（或此后称为模型）是机器学习过程生成的输出。模型捕捉了通过分析过程揭示的关系（模式）。一旦创建了模型，就可以用来生成新的预测。组织随后使用模型的预测结果来决定做什么或如何对待人们。因此，机器学习是一个过程，而预测模型是该过程的最终产物。\n\
  \n有很多不同类型的预测模型，有几十种甚至上百种机器学习技术和算法可以用来生成模型。然而，无论模型的类型或用于创建该模型的数学方法如何，模型的预测结果几乎总是由一个数字表示——一个分数。分数越高，某人按照模型预测的方式行为的可能性就越大；分数越低，他们以那种方式行为的可能性就越小。\n\
  \n机器学习可以应用于各种情况和许多类型的问题。然而，机器学习最常见的业务应用（也是本书关注的重点）与根据你今天对他们的了解来预测人们将要做什么或他们未来将如何行为有关。\n\
  \n机器学习的一个非常著名的应用是信用评分。当人们想要贷款、信用卡或抵押贷款时，贷款人会向个人询问关于他们和生活方式的问题。然后他们会将此与来自 Experian\
  \ 或 Equifax 等信用参考机构提供的、包含个人之前借贷历史细节的信用报告信息相结合。这些信息随后被输入预测模型以生成信用评分。\n\n如果你在美国，你可能对\
  \ `FICO` 和/或 `Vantage` 分熟悉。高分 `>750` 预测某人极有可能偿还他们借的任何钱；即他们是有信用的。低分 `<500` 表示某人不信誉。世界各地的银行和金融公司使用类似的信用评分方法。\n\
  \n机器学习的另一个常见应用是目标营销。根据某人的年龄、性别、收入、网页浏览、购买历史、位置等信息，营销部门可以预测该人是否对特定产品感兴趣。他们随后使用该预测结果来决定是否向他们提供促销优惠。同样，预测模型也可以用于推断人们愿意为保险等产品支付多少钱。这些信息随后将被用于根据每个人的具体情况制定个性化的定价策略。\n\
  \n机器学习实际运作的另一个示例是预防性医疗保健。传统的医疗保健系统是反应性的。人们在感到不适时寻求医疗帮助。医生然后尽力治疗他们所面对的疾病——这些治疗可能非常昂贵且耗时。如今，先进的医疗保健系统日益将注意力放在预防而非治疗上。这大大降低了成本并改善了患者的结局。机器学习被用于评估人们的病历并预测他们患特定疾病（如心脏病或糖尿病）的概率，通常提前多年。处于队列顶端的人员；即模型预测最可能患该疾病的人将收到联系，以启动预防措施。例如，改变生活方式或服用预防性药物。\n\
  \n机器学习实际运作的最后一个示例是确定向人们推荐什么类型的新闻（或其他文章）。社交媒体提供者使用机器学习分析你过去阅读过的文章以及你与朋友讨论的话题。这随后驱动了他们向你推广的内容。\n\
  \n\n\n这只是机器学习运用的几种方式。今天，机器学习支持着极其广泛的应用。事实上，生活中几乎任何涉及某种形式决策的方面都有它的身影。在约会网站上为人们配对合人群的算法、用于检测信用卡欺诈的技术，以及识别恐怖分子嫌疑人的系统，都利用了通过机器学习得出的预测模型。如果你想查看更全面的应用列表，可以参考埃里克·西格尔（Eric\
  \ Siegel）的书，书中详细介绍了目前使用的 120 多种不同的预测模型应用——而且这还不是全部列表！\n\n这引出了我们的一个问题：到底什么是人工智能或\
  \ `AI`。关于 `AI` 是什么有许多多样化的定义，就像预测分析一样，许多人交替使用 `AI` 和机器学习这两个术语。从 `AI` 研究的整体范围来看，机器学习是一个关键的研究领域，但还有许多其他领域。真正的人工智能远比模式识别和预测得多。一些专家还质疑，仅仅通过通过使用日益强大的计算机硬件来开发日益复杂的算法的这种“暴力破解”方法，是否真的能实现真正的\
  \ `AI`？对于类人智能和自我意识，是否需要某种额外的（目前尚未知的）元素，而这种元素是无法通过纯计算复制的？\n\n因此，从某种意义上说，说机器学习和人工智能是同一件事是不正确的。但在实践中，几乎每个正在使用的\
  \ `AI` 系统都严重依赖于机器学习。因此，为了本书的，我们将遵循一个关于 `AI` 的简单工作性定义：\n\n- 人工智能 (`AI`）是对人类分析和决策能力的复制。一个良好的\
  \ `AI` 应用是在面对日常任务时，其表现可以与普通人不相甚至更好。例如，从照片中识别人的能力、比经验丰富的承保核师更准确地评估某人信用状况的能力、击败顶尖棋手的能力，或比放射科专家更早发现癌症迹象的能力。\n\
  \n在某种程度上，`AI` 应用对外行来说几乎是神奇的。然而，大多数事物一样，一旦你了解了其原理，神秘感就会消失。在实践中，人们听到的所有关于神奇 `AI` 应用的新闻，实际上只是机器学习的高级应用。\n\
  \n要避免的一个关键错误是以人类友好的方式进行。将这些组件与最新一代工业机械相结合，或将它们整合到汽车和其他车辆中，就可以拥有能够与其环境交互并以非常类人的方式与我们交流的机器人。\n\
  \n让我们从考虑一家饮料公司的营销 `AI` 应用开始。该应用从社交网络中收集有关个人的信息，并将其输入 `predictive model`，以确定他们购买特定品牌威士忌的概率。系统随后应用若干规则来决定是否应该对某个人进行营销。可能存在的规则有：\n\
  \n1. 如果 `predictive model` 估计他们购买威士忌的概率大于 90%，则什么都不做。他们可能也会购买威士忌。\n2. 如果 `predictive\
  \ model` 估计他们购买威士忌的概率在 1% 到 90% 之间，则给他们发送 5 美元的折扣券，试图让威士忌更具吸引力；即影响客户的行为以增加他们购买的概率。\n\
  3. 如果 `predictive model` 估计他们购买威士忌的概率小于 1%，则什么都不做。无论你向他们提供什么，他们都不会购买威士忌。因此，花精力说服他们是不值得的。\n\
  \n所以这些规则是基于某种成本效益分析得出的，其中 1% 和 90% 的阈值被认为是触发营销活动的最佳水平。然而，其他业务规则也会发挥作用，例如：\n\n1.\
  \ 绝不向儿童推销威士忌优惠，无论他们的购买意愿如何！\n2. 不要向有酒精依赖史的人员发送优惠信息。\n\n\n\n\n这两条规则所涉及的两个群体都包含许多想购买威士忌的人（即概率大于\
  \ 1%），但从伦理角度来看，针对儿童或有酒精依赖问题的人群是站不住脚的。从纯粹的利润导向角度来看，向儿童营销可能是非法的，而且针对这类个人可能会导致大量的负面舆论。这两条规则很好地说明了为什么需要人类专业知识来支持基于自动机器学习的系统，特别是当系统被用于对个人做出具有风险或有争议的决策时。\n\
  \n### YouTube 广告投放案例\n\n算法不受约束运行的一个非常广为人知的例子是 YouTube 及其广告投放策略案例。2017 年，许多大型机构从\
  \ YouTube 撤出了广告。这是因为发现 YouTube 将其某些广告与恐怖主义者或其他不良来源的内容并放在在一起。正是 YouTube 的机器学习算法决定了将哪些广告投放在何处，才导致了这一问题。因此，YouTube\
  \ 必须对其广告投放流程进行重大审查。结果在几个月后的 2018 年，他们决定恢复人工审核流程。每个视频片段在被纳入 YouTube 的将广告商与热门内容配对的服务之前，必须由真人进行审核和批准。\n\
  \n一个合理的疑问是，为什么 YouTube 花了几乎一年的时间才找到解决方案？人们无法确定原因，但一个非常合理的答案是，他们花费大量时间尝试仅使用全自动（机器学习/人工智能）方法来解决问题，直到他们意识到需要在评估过程中保留人类因素。\n\
  \n### 发出响应与整合\n\nAI 系统被要求的最后一点是发布所需的响应。在威士忌的示例中，这是向被定标的个人发送合适的折扣码或优惠券。这意味着，为了执行所需的操作，AI\
  \ 应用程序需要连接到组织的营销渠道。如果 AI 告诉您适当的响应是向数百万客户发送优惠信息的短信，那么它就需要连接到可以发送短信的系统。如果使用短信、优惠券、网络弹出窗口或其他任何方式来传递优惠，那么仍然需要有人来设计沟通的文案和格式，使其既能吸引客户，又符合相关的营销法规。\n\
  \n### 预测与模式识别\n\n绝大多数 AI 应用严重依赖预测，并由模式识别（即机器学习/预测性分析）驱动。以支持 Apple `Siri` 和亚马逊 `Echo`\
  \ 等工具的语音识别系统为例。在听到声音后，语音识别系统会将该声音预处理为若干标准化的声音片段。然后它将尝试识别它认为被说出的单词。这是基于使用机器学习创建的预测模型生成的一组概率（分数）。如果系统计算出该声音是“Hello”的概率为\
  \ 5%，“Jell-O”的概率为 20%，“Mellow”的概率为 75%，那么它将做出合理的推断，认为说出的单词是“Mellow”。\n\n先进的 AI 系统结合使用多层复杂的预测模型，根据它们接收到的输入，对周围正在发生的情况形成观点。语音识别系统的下一层将考虑短语和单词结构。系统的预测性元素将与决策规则（决策逻辑）相结合，以确定在说出某些单词或短语时应采取什么行动。\n\
  \n### 机器学习的历史\n\n一个常见的误区是，机器学习和人工智能是完全全新的，直到过去几年才进入主流。现实情况是，对机器学习商业应用的研究最早于 20 世纪\
  \ 40 年代，机器学习自 20 世纪 50 年代以来一直金融服务业（信用评分）。不久后，机器学习技术被应用于直接营销、税收收集和保险承保等领域。最近的进展是将此类工具引入家庭、引入智能手机。\n\
  \n一些机器学习/AI 专家可能会反对这种历史观点，认为只有通过最近的技术进步，机器学习才有了自己的地位。然而，如果你对机器学习/AI 的定义包含了使用算法识别模式来驱动决策系统，且这些系统的表现优于人类专家，那么\
  \ 20 世纪 50 年代的信用评分系统符合该定义。\n\n### 近期变化的因素\n\n最近的变化有三个方面。\n\n1. **术语**：在 20 世纪 80\
  \ 年代/90 年代，现在被称为机器学习/人工智能被称为“数据挖掘”或“计算统计”。另一种情况是，今天最常用的机器学习方法的基础理论是在 90 年代之前或在此期间开发的（尽管许多方法在之后得到了改进和扩展）。\n\
  \n2. **硬件与软件**：通过智能手机、平板电脑和互联网将服务在线化，这意味着现在关于人的信息比以前多得多，而且信息量逐年增长。计算机的速度和存储能力也大幅提高。这使得快速且高效地处理海量数据成为可能。同样，机器学习算法及其预测模型的复杂性在短短几年内增加了几个数量级。与硬件进步和算法设计并行，现在有了大量的机器学习软件工具可用。其中许多是免费和或开源的（如\
  \ `R` 和 `Python` 编程语言），并且可以通过个人电脑、笔记本电脑或微软、Google 等科技巨头提供的云服务使用。\n\n3. **交互**：变化的第三点是我们与底层模型和决策规则交互的方式。我们不再需要在键盘上输入非常僵化的指令，也不需要解释详细的数学输出。相反，现代\
  \ AI 系统以更像人类的方式与我们交互。\n\n通常人机交互界面本身就基于机器学习原理，由预测模型驱动。如果我们回到威士忌销售的示例，我可以在聊天机器人的设计中使用机器学习，在社交媒体上与人们讨论饮酒习惯。聊天机器人收集的数据随后补充了我收集的关于人的其他数据。如果威士忌应用程序确定应该给人们提供优惠，那么可以通过聊天机器人以对话的形式回传给客户，而不是通过传统的短信或电子邮件向他们发送优惠券或折扣码。\n\
  \n\n\n\n同样的原理也适用于亚马逊 Echo 等数字个人助手。一组算法被用于将你说的话转换成音频片段（数据预处理）。预处理后的音频片段随后被输入另一组预测模型中，这些模型会尝试预测你想要的结果；例如播放某首特定的歌曲或询问天气。亚马逊允许开发者免费使用这种预处理能力——让任何人都能将先进的语音识别技术整合到自己的程序和应用程序中。\n\
  \n这意味着，进入机器学习和人工智能（AI）世界的门槛已大幅降低。就在几年前，机器学习还主要是大型企业和学术机构的领域。而今天，任何拥有笔记本电脑和空闲时间的人都可以参与进来，并以较快的速度且几乎零成本开始构建预测模型，然后开发一个先进的用户界面将这些模型实现为“AI\
  \ 应用”。\n\n如今，甚至有了诸如 Kaggle 之类的机器学习竞赛网站。机构免费提供其数据，然后由业余和专业团队进行竞争，看谁能利用提供的数据构建出预测能力最强的模型。获胜者向数据供应商分享其方法，并获得回报。赢得\
  \ Kaggle 竞赛的奖励非常丰厚。典型的现金奖金为几千美元，但最高奖金超过了百万美元！然而，对于许多获胜者来说，奖金相对于 Kaggle 获胜者可以获得的高薪只是次要考虑因素。\n\
  \n在讨论机器学习、预测建模和人工智能时，你可能还会遇到“数据科学”（data science）和“数据科学家”（data scientist）这两个术语。数据科学并不是像物理、化学或生物那样的科学。它只是对机器学习技术应用的描述。同样，数据科学家是指能够实际方式应用机器学习的人。它不仅仅涉及该学科的数学方面。优秀的数据科学家对数据和\
  \ IT 系统有理解，并能够理解其解决方案所应用的业务背景。\n\n### 3 预测模型生成的评分代表什么？\n\n正如上一章所述，商业中使用的绝大多数机器学习/AI\
  \ 应用依赖于预测模型。这些模型根据其接收到的信息生成数字（评分），指示了可能发生的情况。\n\n预测模型生成的评分可以是两种类型之一：\n\n1. **概率（可能性）评分（Probability\
  \ scores）**。它们预测特定事件发生的概率。例如，某人会做某事吗？这种类型的预测模型的技术名称是分类模型（classification model）。\n\
  2. **幅度（数量）评分（Magnitude quantity scores）**。它们预测某事的数量或大小。例如，某人在商店里将花多少钱，或者他们在做某事之前还有多久。这种类型的预测模型的技术名称是回归模型（regression\
  \ model）。\n\n分类模型预测事件发生的概率。这些事件通常是二元性的；即生成一个单一评分，代表事件发生的概率。然而，分类模型也可以用于处理具有多个结果（事件）的问题。\n\
  \n分类模型的常见业务应用包括：\n\n*   **医疗诊断（Medical diagnosis）**。评分衡量某人患有某种特定疾病的概率。\n*   **内容检测（Content\
  \ detection）**。模型预测媒体内容是否涉及特定主题/话题。社交媒体公司使用此类模型来识别发布在其网站上的攻击性或非法材料。高分材料会被拦截或放入队列由人工评估员审核。\n\
  *   **客户流失（Customer attrition）**。模型生成客户购买竞争对手产品或停止使用产品或服务的概率。例如，更换公用事业供应商、办理新信用卡或取消杂志订阅。\n\
  *   **欺诈检测（Fraud detection）**。模型生成的评分代表欺诈交易发生的概率。例如，某人试图用偷来的信用卡购买东西。\n*   **约会匹配度（Dating\
  \ compatibility）**。模型评分提供了两个人在约会中合得来来的概率指示。\n*   **产品推荐（Product recommendation）**。评分代表某人购买给定产品或服务的概率。只有当客户购买该产品或服务的概率足够高时，才会对他们进行营销。\n\
  *   **员工留存（Staff retention）**。模型估计了员工离开当前职位担任其他职位的概率。\n*   **机器故障（Machine breakdown）**。评分预测机器是否可能在近期发生故障。这允许采取预防性措施，例如给司机发短信，告诉他们在故障发生前去修理厂修理汽车。\n\
  \n有时分类模型的评分直接代表概率。得到 0.0 分的人肯定不会经历该事件。得到 1.0 分的人肯定会经历。预测模型并不提供完美的预测。人们通常看到的是个人在\
  \ 0.0 到 1.0 之间的概率分布（分布）。当产品推荐模型为某人生成 0.70 的评分时，这意味着他们有 70% 的概率购买，有 30% 的概率不买。\n\n\
  在其他情况下，分类模型的评分被转换为特定的比例。如果我们回到信用评分的世界，信用分通常在 400 到 800 之间。如果某人得到 400 分，意味着他们极不可能偿还任何给予他们的信贷（贷款还款概率\
  \ < 5%）。800 分意味着他们几乎会偿还债务（贷款还款概率 > 99.9%）。业务中使用的大多数分类模型都会生成单一评分。该评分预测一个简单的“是/否”类型事件，例如上述列表中所描述的那样。当机器学习应用于具有多个结果的问题时，则会为每个结果产生一个单独的评分。\n\
  \n相反，回归模型关于数量的；即事件的幅度。回归模型的业务应用示例包括：\n\n\n\n\n\n## 常见应用场景\n\n- **预期寿命**：`score`\
  \ 提供了对个人预期寿命的预测。这类模型通常用于设定人寿保险费和年金。\n- **旅程时间**：根据您的驾驶习惯、当前位置和道路状况信息，您可能在何时到达目的地？\n\
  - **信贷损失**：当某人违约未贷款时，有多少债务可能被注销？\n- **支出**：该模型预测了某人在未来 12 个月内在超市里可能花费多少钱。\n- **购买间隔**：购买产品后多久可以预期会再次购买？营销活动可以安排在客户预计再次购买产品前不久进行。\n\
  - **通话时长**：预测通话时长将持续多长时间？这有助于中心进行资源规划。\n- **占空率**：预测某人在一天中什么时间可能在家里，从而确定拜访他们的最佳时间。\n\
  - **响应时间**：采取行动后多久能观察到响应？在向某人发送信、电子邮件或短信后，他们需要多久回复？\n\n## 模型选择策略\n\n在某些情况下，`regression`（回归）模型是对人们试图预测内容的直接估计。一个生成\
  \ `score` 为 5 的 `spend`（支出）模型意味着预测客户将花费 5 美元。在其他情况下，`score` 被缩放以表示百分比，或分配从 1 到 10、A\
  \ 到 E 的等级。A 等代表最优秀（利润最高）的客户，E 等代表利润最低的。\n\n`regression` 和 `classification`（分类）模型都被广泛使用，但\
  \ `classification` 模型往往最受欢迎，特别是在业务应用中。这是因为从传统上，简单事件对组织来说最容易理解。这使得数据科学家更容易将业务目标转化为合适的数值表示。定义客户是否购买是非常直观的（`classification`）。然而，确定单笔销售的盈利能力要复杂得多（`regression`）。\n\
  \n使用哪种类型的模型（`regression` 还是 `classification`）很大取决于人们想对这些分值做什么。如果我唯一感兴趣的是识别哪些信用卡客户最有可能流向竞争对手，那么我需要一个\
  \ `classification` 模型来预测流失概率。然后应用留存策略（例如提供折扣或免费赠品）来试图留住那些最可能流失的客户。\n\n另一方面，如果首要考虑是识别盈利客户以鼓励他们花费更多，那么我需要的是一个\
  \ `regression` 模型。该模型旨在预测谁将成为大额消费者并针对他们进行目标营销。我不需要操心其他客户群体。\n\n然而，还有第三种选择。假设我真正感兴趣做的是留住盈利客户，而我不在意流失那些花费不多的亏损客户。在这种情况下，最好的方法可能是构建以下两个独立的预测模型：\n\
  \n1. 一个 `attrition` 模型，用于预测那些最有可能流向竞争对手产品的客户（`classification`）。\n2. 一个 `revenue`\
  \ 模型，用于识别哪些客户花费最多（`regression`）。\n\n然后结合使用这两个模型来推动留存策略，如图 1 所示。\n\n/00006.jpg\n\n\
  图 1 使用每个模型的分值，根据收入和流失两个维度对人群进行细分。通过结合使用这两个模型，可以应用定制的留存策略并实现显著成本成本。这是因为资源不会浪费在试图留住那些不会流失的客户，或者流失概率高但花费不多的客户。\n\
  \n对于图 1 中的示例，应用了三种不同的策略：\n\n1. 对“最差”的客户什么也不做。尝试留住这些人并没有成本效益。\n2. 对中间部分的客户采取轻量级（即低成本）留存策略（`strategy\
  \ 1`）。\n3. 在“最佳”客户组上投入最多的精力（`strategy 2`）。\n\n当然，这个问题也有其他的表述方式。可以建立一个单一预测模型，只尝试预测那些产生最高收入且极可能流失的客户，然后对他们进行目标营销。这无疑是一个合理的方法，但会导致对客户特性的粒度缺失；即，单一模型将无法让你像图\
  \ 1 所示的双模型方法那样，探索流失与收入之间的权衡。\n\n请注意，模型仅提供关于客户将如何行动的预测。它们并没有告诉您根据这些预测之后应该做什么。至于对于留存策略\
  \ 1 和 2 应该采取哪些活动，这是组织需要在其机器学习项目整体范围内解决的额外考虑因素。这很重要，因为一个非常常见的失败案例是组织建立了一些非常好的预测模型，然后没有用它们做任何事情。如果一个机器学习项目想要成功，做出正确的决策并付诸行动至关重要。\n\
  \n## 4. 为什么要使用机器学习？它增加了什么价值？\n\n基于预测模型的机器学习应用越来越多地被用于在各个领域取代和或补充专家判断和人工决策。这是因为预测模型倾向于：\n\
  \n- **比人类专家更准确**。预测模型有时也会像人一样产生错误的预测，但压倒性的证据表明，从平均而言，它们出错的频率没有那么高。在许多领域，预测模型的表现持续优于人类专家\
  \ 20-30%；即它们产生的错误减少了 20-30%，或者识别出好 20-30%（更重要/利润更高）的案例。\n- **无偏见**。与人不同，预测模型不会因为性别、种族、残疾等对某人表现出故意偏见。不要误会，预测模型确实会显示偏见，但如果设计得当，它们只有在基于硬性统计证据的情况下才会给予某些个人或群体比大众更高或更低的评分——而不是基于毫无根据的观念或刻板印象。\n\
  - **快速**。作为自动化决策系统的一部分，预测模型可以在几秒钟内预测百万人的行为。在大多数情况下，让人们手动做出同样的判断在成本上是不可行的，且非常耗时。\n\
  - **廉价**。一旦开发完成，预测模型的部署通常比其人类对应物更便宜。尽管人们不能忘记与初始开发相关的成本，以及持续的维护和许可费用。\n\n总结来说，预测模型可以做出比人类专家更好、更廉价、更快的决策。这意味着在许多领域，预测模型正在取代人类。特别是那些需要经过培训员工使用其专家判断来做决策的白领岗位。\n\
  \n\n\n\n\n这种现象于 20 世纪 50 年代和 60 年代出现在美国金融服务领域。当时，大多数抵押贷款、汽车信贷和个人贷款申请都是由人工核保员评估的，他们逐一审查每份贷款申请，然后决定该人是否有信用，并因此应该获得他们所申请的信贷。\n\
  \n在大型组织中，整栋办公大楼都被核保团队占据，他们整天都在做贷款决策。在当地银行分行，`Bank Manager`（银行经理）就是王——他是当地社区受尊敬的成员，对谁可以获得贷款或抵押贷款、谁不能获得拥有绝对决定权。有时，获得贷款完全取决于他（而且通常是男性）当天的心情如何。比起周一一早晨，你可能在周五下午更容易获得贷款，因为那时他正对即将到来周末心情大好！\n\
  \n到 20 世纪 80 年代后期，这些职位中的大多数已变得多余。银行经理的角色已缩减为不多于销售人员——负责维护客户关系，但没有决策能力。绝大多数贷款决策都是由位于总部自动化决策系统核心的信誉评分模型做出的。在当今的信贷授予领域，只有异常或边缘案例倾向于由人类审查——绝大多数贷款决策都是自动完成的，完全没有任何人工干预。\n\
  \n### 机器学习的价值\n\n失业是受影响行业人员所担心的问题，但并非完全是一片黑暗。在许多情况下，`machine learning` 正在为这些岗位增加价值，而非取代它们。在医院和医生诊室里，预测模型补充了医生的自我判断，而非取代他们。在营销领域，基于\
  \ `machine learning` 的改进目标定位被用于减少骚扰电话和垃圾邮件，同时使价值的客户接触最大化；即只电话/短信/邮件联系那些极可能对你销售的产品感兴趣的人。过去，一揽式的接触策略很常见。呼叫中心的工作员会被电话簿，并被要求逐一拨打，无论他们购买提供产品或服务的意愿如何，尽可能多地打电话。`machine\
  \ learning` 带来的另一个机会是预测以前未被考虑或不成本效益的新型行为。例如，在警务中，预测模型正在帮助警察缩小嫌疑人名单并更好地针对犯罪，提高效率，并让他们有更多时间关注最严重的犯罪。预测模型也是约亲和求职网站等“人员匹配”服务的基石。如果没有预测模型，这些事务将大不相同——基于一组非常粗略的标准进行人员匹配，和/或必须使用人工进行匹配，这使得此类服务变得昂贵得多且效率低下。\n\
  \n### 局限性与偏见\n\n尽管有许多支持基于预测模型的自动化决策系统的论点，但不要在政府为改善儿童护理服务的新立法上犯类似的错误。模型可能具有很强的预测性，但它不可避免地偏向男性。为什么？因为我们生活在一个大多数行业仍然表现出性别偏见的社会，在一个女性仍被视为抚育主要来源的社会。在某种意义上，只要模型识别出高级领导，它就是准确的，但会导致女性代表性不足，反映出存在的社会偏见。\n\
  \n一个广为人知的真实世界案例是授予囚犯假释。据报道，美国用于支持假释决定的算法具有很强的种族偏见。如果你是白人，获得假释的可能性比其他种族的囚犯高得多。为什么？因为用于评估假释案件的预测模型是利用历史决策信息开发的，而这些决策本身带有偏见。这都归根结底于\
  \ `machine learning` 过程中使用的数据。如果数据包含有关以前偏见决定的信息，那么任何 `machine learning` 算法都会捕捉到这一点。换句话说，`machine\
  \ learning` 没有社会意识也没有良知。如果数据中存在伦理上不利或非法的模式，`machine learning` 过程无法感知。因此，它不会对这些社会不可接受的模式与它发现的其他模式区别任何区别。\n\
  \n基于 `machine learning` 的 AI 系统可能显示的偏见的更明显的例子是微软开发的机器人 `Tay`。`Tay` 旨在对青的推文生成自动回复，并对出现的新对话进行适应。`Tay`\
  \ 在几小时后最终被撤回，因为它开始发布种族主义和其他不恰当的内容。它之所以这样做是因为用于训练它的推文包含了种族主义和其他不可接受的材料。`Tay` 学会了这些模式并在自己的回复中播放出来。`Tay`\
  \ 使用自然语言回答的能力几乎被认为是人类，但它无法调节自己的回复以适应广泛社会预期的社会和伦理规范是非人性的。\n\n另一个担忧是，如果数据科学家有特定的偏见，他们可能会意识地将这些偏见设计到系统中，颠覆数据正在告诉他们的事情。然而，这也可以对人们有利。如果认为用户不喜欢所做出的决策，那么设计良好的系统将允许决策逻辑被修改/覆盖——正如我们在之前的章节中讨论威士忌销售案例时讨论的那样。\n\
  \n这意味着需要对基于 `machine learning` 的决策系统进行监督，并建立适当的检查和平衡机制，以确保系统以符合法律和伦理的方式运行。我们将在第\
  \ 13 章中详细讨论这些问题。\n\n## 5. 机器学习是如何工作的？\n\n\n\n\n大多数机器学习应用都以预测模型为基础。模型生成的评分驱动了决策以及随之采取的行动。那么，预测模型是如何生成分数的呢？这取决于所采用的预测模型类型，而且有许多选项可供选择。然而，在大多数现实业务应用中，最流行的三种模型类型是评分卡（线性模型）、决策树（分类与回归树或\
  \ `CART`）以及人工神经网络（`ANNs`，通常简称为神经网络（`NNs`）。\n\n评分卡和决策树对于非技术人员来说相对容易理解。模型评分以简单且透明的方式计算，这很容易确定这些模型为何做出那种预测。相比之下，神经网络本质上往往更复杂一些，且具有“黑箱”属性。这意味着很难理解神经网络为什么会得出某个分数，以及为什么根据该分数做出了特定的决策。然而，由于神经网络在许多（但并非所有）情况下比评分卡或决策树更倾向于提供更准确的预测，它们已成为许多机器学习应用中日益受欢迎的选择。\n\
  \n神经网络的高级形式（深度网络/深度学习）目前处于机器学习/人工智能研究的前沿。因此，神经网络是解决复杂人工智能问题（如物体识别、语音识别和语言翻译）的首选模型。\n\
  \n为了说明这三种预测模型，让我们回到医疗保健领域，关注一种特定的疾病：心病^([\\[17\\]](#index_split_028.html#filepos412950))。心病是全球范围内主要的死因之一。在西方国家（英国、美国等），每年每\
  \ 1000 人口中约有 1 人死于心病，很大比例的人患有心脏疾病，这些疾病在未来可能会夺他们的生命。如果你能识别出未来极有可能患心病的人，并采取预防措施来降低这种可能性，将极大减少人类的痛苦并延长寿命。医疗成本的降低也将是巨大的。\n\
  \n想象一下，政府有一个乌托邦式的理想，对人口中的所有人进行心病筛查，旨在采取预防措施减少未来疾病的发病率。他们实现这一点的方法之一是发起健康运动，邀请每个男性、女性和儿童去看医生。他们将接受相关的检查和诊断测试，并获得关于如何降低未来患心病风险的建议。\n\
  \n这在理论上是好的，但在实践中，这种活动的成本将是巨大的，而且在现实时间内没有足够的医生来接待所有人。由于资源匮乏，癌症和糖尿病等其他危及疾病的治疗可能会受到影响。事实上，最终结果可能是由于对心病的过度关注而牺牲了其他疾病，导致人口整体健康状况的下降。\n\
  \n对所有人进行心病筛查的一刀切的方法显然是不现实的。然而，一个更可行的目标可能是：目标是识别出未来 5 年内将患心病的人中的至少一半，但目标人数不超过总人口的\
  \ 5%；即仅占总人口的 5%。\n\n\n\n尽管如此，但对相关的数学技术有一定的了解是有很有帮助的。因为这能让你理解软件生成的诊断信息，并识别出模型创建过程中是否出现了任何问题。此外，软件中通常还需要设置若干参数。经验丰富的数据科学家将知道如何调整这些参数，以生成一个具有很强预测能力的模型，同时满足委托该机构所施加的任何业务限制。\n\
  \n模型构建过程通常是迭代的。在得出最终模型之前，通常会使用不同的算法构建许多测试模型。因此，分析过程需要一个懂行的人来引导，以确保获得最佳的整体模型。\n\n\
  让我们假设数据科学家首先考虑一种评分卡（scorecard）类型的模型。作为参考，生成评分卡类型模型最受欢迎的算法被称为 `Linear Regression`（线性回归）和\
  \ `Logistic Regression`（逻辑回归）。\n\n在使用适当的软件工具将相关算法应用于开发样本^([\\[19\\]](#index_split_028.html#filepos414053))后，软件生成了如图\
  \ 2 所示的预测性模型：\n\n![](img/00010.jpg)\n\n使用图 2 中的评分卡，某人的得分计算方式如下：\n\n* 首先，每个人被分配 `350`\
  \ 的“起始分”。\n* 然后，从起始分中加上或减去所有适的相关分数。\n\n对于一位具有以下特征的 45 岁女性：\n\n* `BMI` 为 `28`。\n\
  * 每周平均饮用 `6` 单位酒精。\n* 大学毕业。\n* 年收入为 `$50,000`。\n* 吸烟者。\n* 非糖尿病患者。\n* 胆胆固醇水平正常。\n\
  * 低血压。\n\n起始分为 `350`。由于年龄原因，增加了 7 分，使分数变为 `357`。然后根据其 `BMI` 增加 8 分，根据性别减去 4 分，根据其饮酒量不增加（也不减少）分数，依此类推。在加/减所有相关分数后，最终得分为\
  \ `404`。\n\n评分卡中的个人得分是机器学习算法发现的模式/关系的表示。例如，分配给老年人的不断增加的分代表了年龄增长与心脏病风险增加之间的关系，这是从用于构建模型的数据（开发样本）中推导出来的。同样，吸烟者分配的分数比非吸烟者多，代表了吸烟与心脏病之间的关系。\n\
  \n图 2 中的评分卡，很容易看出为什么评分卡如此吸引人，以及它们为什么在许多行业被广泛使用。原因之一是，你不需要任何技术就能看出哪些数据项目对某人的得分有贡献。衡量每个数据项目的相对重要性也很。年龄对最终得分的贡献比任何其他因素都多。另一方面，性别对总分的贡献很小。模型中的绝大多数数据项目（如吸烟、饮酒和血压）也符合医学研究的普遍常识；即模型捕捉到的关系是合理的，并符合已关于心脏病风险因素的认知。\n\
  \n模型符合专家已有的知识这一事实有助于人们信任该模型，并乐于在日常工作中将其作为诊断工具。如果模型对吸烟和糖尿病给出负分，而对血压正常和年轻给出正分，那么就违背了每位医生的常识。因此，即使模型的预测是正确的，人们对该模型能够正确预测状况也没有太大信心。\n\
  \n这种对常识的诉求很重要，特别是当模型首次部署在某个领域时。人们通常对机器学习等新方法持怀疑态度，并可能本能地不信任某些从决策过程中消除了人为因素的东西。越能让人们相信基于模型分数的决策是正确的，就越容易克服任何对机器学习的阻力。\n\
  \n评分卡中可能稍微出乎意料的一项是收入的影响。模型表达的是，如果你收入低，你更有可能患心脏病。如果你对此进行思考，它是有道理的。如果有人收入低，他们可能负担不起健身房会员（运动较少），而且不会花更多的收入来购买高质量的食物。然而，重要的是不要混淆相关性和因果关系。模型捕捉了收入与心脏病之间的相关性，但说低收入一定会导致心脏病是不正确的。它可能导致，但也可能是那些其他特征的代理变量。\n\
  \n这种挑选出具有预测性但专家之前可能没有考虑其重要的新数据项目的能力，是机器学习大优势之一。当我们进一步进入“大数据”世界时，这一点尤为真实，那里可能有成千上万个数据项目，其中任何一个都出现在预测模型中——这远超手工能分析的量。\n\
  \n机器学习是一种筛选所有数据项目的自动方法，以找到与被预测行为相关的少数几个项目。尽管如此，重要的是，在许多应用领域的绝大多数情况下，机器学习倾向于挑选出与人类专家在决策时使用的相似数据项目。新的、奇怪或反直觉的预测关系往往是例外而非常态。\n\
  \n另一个让预测模型优于人类决策者的点是，分配给每个数据项目的分是基于开发样本数据的优方案；即模型中分配给每个数据项目的分是最好的，从而产生尽可能准确的预测。\n\
  \n机器学习不是创建评分卡类型模型的唯一方法。另一种方法是应用专家意见。一组专家聚在一起共同决定哪些因素是重要的，以及给这些因素分配多少分。这种方式构建的预测模型通常效果惊人，但往往不如使用算法通过合适的开发样本确定分数构建的模型。\n\
  \n图 2 中评分卡的另一个有趣特征是，它只包含 9 个数据项目——但这足以做出非常好的预测，而且这种情况通常如此。极少数预测模型需要超过几十个数据项目才能生成非常好的预测。即使有成千上万的数据可用，绝大多数数据项目对预测准确性的贡献也很小或完全没有。这是机器学习一个非常有用的特征，因为这意味着虽然创建一个模型可能需要大量的数据分析，但在使用该模型时，所需的资源要少得多。要实现预测模型，你只需要模型中出现的数据项目。不需要其他数据。\n\
  \n\n\n\n图 2 中的评分卡模型预测了个人在未来 5 年内患上心脏病的概率。但模型生成的个人得分是如何转化为概率的呢？建立得分与概率之间关系的一种方法是生成如图\
  \ 3 所示的“得分分布”表。\n\n为了制作图 3，针对另外 500,000 个人收集了一个全新的数据样本，即验证样本（其中 30,000 人在未来 5 年内患了心脏病）。该验证样本与用于构建模型的样本完全独立。(20)。因此，它能够代表性地展示当模型被应用于新人员（这些人员的细节未被用于构建模型）时，表现将会如何。(21)\n\
  \n![](img/00007.jpg) \n\n最左侧的两列包含得分范围，显示了每行报告的分数范围。第一行包含得分在 300 分或以下的所有人的详情，第二行包含得分在\
  \ 301 到 320 之间的人，依此类推。理想情况下，每个单独的得分应该有一个单独的行，但由于模型可以产生数百种不同的得分，为了方便起见，此示例中的得分被分成了每\
  \ 20 分一个范围。(22)\n\n图 3 中的其他列提供了关于每个得分范围内个人的信息。例如，有 56,606 个病例得分在 301 到 320 之间，占验证样本中病例的\
  \ 11.32%。其中，有 68 人随后患了心脏病。\n\n最右侧的一列显示了每个得分范围内患心脏病的人的百分比。这实际上是模型做出的预测。对于 301 – 320\
  \ 得分范围的人，模型的预测结果为 0.12%。换句话说，得分在 301 到 320 之间的任何人患上心脏病的概率大约为 833 分之一 1 (1/0.0012)。\n\
  \n### 评估个人风险\n\n要评估一个人未来患上心脏病的风险，所需要的是：\n\n* 使用图 2 中的评分卡计算其得分。\n* 在图 3 中找到其得分所属的行。\n\
  * 向右查看图 3 的最右侧列以获得预测结果。\n\n如果我们回到那个得 404 分的 45 岁女性的案例，她属于 401-420 得分范围。向右读取，得分在\
  \ 401 到 420 之间的人中随后患上心脏病的比例为 1.76%。也就是说，模型预测她在未来五年内患上心脏病的概率为 1.76%（57 分之一 1）(23)。\n\
  \n如果你手头有相关信息，为什么不尝试计算一下自己的得分，并对自己患上心脏病的风险得出一个预测呢？(24)\n\n### 模型准确性\n\n了解得分的含义是重要的，但下一个问题是：评分卡模型预测心脏病的效果如何？它的准确性如何？评估模型的一种方法是考虑最低分和最高分病例之间心脏病率的差异。得分\
  \ 300 分或以下的人中，只有 0.07% 在未来 5 年内患上心脏病。对于得分 561 分或以上的人，87.88% 患了该疾病。换句话说，得分最高的人患心脏病的概率是最低得分的人的\
  \ 1000 倍以上——这非常不错。\n\n另一种方法是将模型的性能与随机选择策略进行比较；即，如果你随机选择人员进行检查，那么只有 6% 的这些人会患上心脏病，而得分最高组（561\
  \ - 999）的表现比这好出 15 倍 (87.88 / 6)。\n\n附录 A 详细解释了数据科学家评估预测模型预测行为能力时常用的指标。\n\n### 6.\
  \ 使用预测模型做出决策](#index_split_004.html#filepos4264)\n\n到目前为止，我们：\n\n* 有了一个预测模型（上一章节中图\
  \ 2 中的评分卡）。模型生成的得分表明个人患上心脏病的可能性。\n* 了解得分的含义。\n* 知道给定得分下患心脏病的概率（来自图 3 提供的信息）。\n*\
  \ 了解了评分卡在识别心脏病患者方面比随机选择策略好多少。\n* 了解人群在可能得分范围内的分布（来自图 3 中得分分布表提供的信息）。\n\n这些都很好，但这些信息中都没有告诉我们该怎么做。\n\
  \n\n\n\n\n*   这意味着，虽然受邀者中预计有 74% 会患上心脏病，但其余 26% 被邀请体检的人实际上并不需要检查。\n\n该模型并非完美。它有\
  \ 26% 的概率会出错，但其表现远优于随机选择人群进行体检。由于预计未来五年内仅有 6% 的人口会患心脏病，随机邀请策略将导致 94%（100% – 6%）的体检浪费在那些根本不会患上心脏病的人身上。\n\
  \n评分分布表（如图 4 所示）是支持评估和使用预测模型的所有报告和性能指标的基础。在现实世界的应用中，这些表格通常粒度更细（行数更多），并包含额外的列，其中含有累积升/降序数值和百分比等信息，以辅助计算。\n\
  \n某些人，特别是像我这样在 `Excel` 这种工具普及之前就开始接触机器学习的“老手”，更倾向于直接根据图 4 所示的评分分布表工作。然而，如今有许多卓越的可视化工具，可以用更直观、更符合用户的方式来展示评分分布表的结果。最好的工具还是交互式的。它们允许你对不同的模型、约束和截断策略进行实验，以为你的特定问题找到最佳决策规则。\n\
  \n提供评分分布表图形化表示的两种流行方式是提升图（Lift charts）和增益图（Gain charts）。这些在附录 A 中有描述。\n\n## 7. 这是评分卡，那决策树呢？\n\
  \n决策树是另一种流行的预测模型。与评分卡一样，它们也非常容易理解和使用。\n\n为了演示决策树的外观以及如何工作，让我们继续讨论心脏病的问题。如果你还记得，目标是找到一种方法识别出至少一半将患心脏病的人，但邀请的人数不超过总人口的\
  \ 1/20（5%）去医生那里体检。\n\n为了构建决策树模型，再次使用了用于构建评分卡的 500,000 个案例，但这次对开发样本应用了不同类型的算法。所有流行的决策树算法都是反复将开发样本拆分为越来越小小组这一主题的变体。以下是决策树算法的简单描述：\n\
  \n> 步骤 1. 从开发样本中选择一个数据项（例如 `income`）。\n\n> 步骤 2. 找到 `income` 的值，使得数据能够最优地分为两部分。我所说的“最优”是指一个低收入组和一个高收入组，使得心脏病的发病率在一组最大，在另一组最小。\n\
  \n> 步骤 3. 对开发样本中的所有其他数据项重复步骤 1 和 2（即将 `income` 替换为 `age`、`BMI`、`smoker` 等）。\n\n\
  > 步骤 4. 根据步骤 2 和 3 的发现，使用找到的最优划分开发样本拆分为两部分；即拆分开发样本，使得心脏病的发病率在其中一次划分中最大，在另一次中最小。\n\
  \n> 步骤 5. 对开发样本的两个部分中的每一个重复步骤 1-4。持续这样做，直到无法通过进一步拆分发现更显著的差异。\n\n图 5 显示了在应用所有拆分标准后，从心脏病开发样本得出的决策树模型结构。\n\
  \n![](img/00015.jpg)\n\n在图 5 中，算法首先识别出最显著的变量是 `age`。根据人们是否大于或小于 52 岁对开发样本进行分割。对于年龄小于\
  \ 52 岁的人，算法随后确定下一个最显著的拆分是基于 `BMI`。然而，对于年龄 52 岁或以上的人，下一个最重要的变量是他们是否是 `smoker`，以此此类推。\n\
  \n使用决策树为某人评分，是从树顶部的第一个节点（`Entire population`）开始。然后向下向下移动。在每个分支点，选择符合该个人特征的节点。如果某人小于\
  \ 52 岁，则遵循树的左侧。如果他们是 52 岁或以上，则遵循右侧分支。在每个决策点重复此过程，直到没有进一步的决策要做出。人所在的终止节点（称为 `end\
  \ node` 或 `leaf node`）决定了他们的分数。\n\n在图 5 中，有 13 个终止节点（用阴影标记并编号），因此人们可以接收 13 种分数。得\
  \ 1 分的人患心脏病的概率最低，得 13 分的人概率最高。\n\n至于决策树生成的评分如何使用，该过程与使用评分卡评分的方法几乎相同。将验证样本中的 500,000\
  \ 人的细节通过决策树获得评分，然后生成评分分布表，显示分数的分布情况。图 6 显示了决策树的评分分布表。\n\n通过遵循与评分卡相同的流程，得分最高的 5%\
  \ 人口被得 12 分或 13 分的人覆盖。这些人中，有 16,910 人随后患上了心脏病，占总病例数的 55%。因此，邀请人们体检的针对策略是邀请所有得 12\
  \ 分或 13 分的人。\n\n与评分卡一样，该策略也符合既定目标：邀请不超过总人口 5% 的人群体检，但在 5% 中包含至少一半未来将患心脏病的人。\n\n\
  ![](img/00001.jpg)\n\n\n\n\n评分卡和决策树模型在使用的数据上存在差异，这是构建这些模型所用算法的特性。事实上，有数百种不同的机器学习算法可以用于构建许多不同类型的预测模型。每种算法都有自己的逻辑，用于选择哪些数据项是重要的预测因子，以及这些预测因子在模型中应赋予的权重。每方法都有其优缺点，并且在预测某些类型的案例时比其他方法更好。\n\
  \n这在实践中意味着，并不存在一种适用于所有问题类别的“最佳”模型类型。没有任何一种预测模型类型可以被认为普遍优于所有其他模型。这一次，评分卡（从预测准确性来看）被证明优于决策树，但对于不同类型的问题，使用不同的数据并有不同的目标，决策树可能会胜出。\n\
  \n这说明，如果你想确保为你的特定问题获得最佳模型（以预测准确性衡量），你就必须构建不同的模型，并在它们之间进行相互比较，然后决定哪一个最合适。\n\n尽管如此，在实际的现实情况中，大多数类型的模型对许多类型的问题都会产生非常相似的预测性能。在理论上，可能会有理由解释为什么某种类型的模型优于另一种，或者为什么\
  \ `Algorithm A` 优于 `Algorithm B`，但在实践中，它们在许多应用领域是大同小异的。因此，在选择哪种模型类型时有很大的灵活空间。\n\n\
  这是机器学习的另一个伟大特性。这是意味着在决定哪种模型最适用于给定问题时，除了预测准确性外，其他因素也可以发挥作用。特别是在某些问题领域，拥有一个易于解释且符合关于如何做出决策的常识观点模型是非常关重要的。这有时比拥有一个在理论上更合适或准确率略高、但业务用户或行业监管机构难以理解的模型要重要得多。\n\
  \n## 8. 神经网络与深度学习\n\n我们大脑包含了数以亿计的神经元，每个神经元都相互连接，产生数以万亿计的连接。正是神经元及其连接的结合驱动了我们思考和智能行动的能力、理解世界运作的方式，以及对我们如何与世界互动做出（有意识或无意识的）决策。\n\
  \n早在 20 世纪 50 年代，计算机科学家首次提出了“人工神经元”的概念，但直到 20 世纪 80 年代中期，将多个连接在一起的人工神经元（神经网络）才被提出作为解决复杂问题的方法。从那时起，神经网络的普及程度持续增长，先进形式的神经网络目前处于人工智能和机器学习研究的最前沿。\n\
  \n关于神经网络要说的第一点是，虽然它们有时被吹捧为极其复杂的“类脑”结构，但如果愿意花一点时间和精力研究它们，就可以很容易理解它们。可以肯定，典型的神经网络确实比之前章节介绍的评分卡和决策树要复杂，但归根结底，其原理并没有太大不同——只是内容更多了。\n\
  \n为了说明神经网络的操作，我们将再次回到之前使用过的心脏病预测问题。首先，让我们从神经网络的构建块——神经元开始。在机器学习术语中，神经元不是由某个疯狂科学家在某个秘密实验室里培养的生物体，而是对自然神经元行为的一种简单直观的表示，它是使用计算机代码实现的方程创建的。图\
  \ 7 展示了人工神经元的工作原理。\n\n```\n![](images/00008.jpg\n```\n\n图 7 中神经元的操作如下：\n\n1. 观测数据（如\
  \ `Age` 和 `BMI`）为神经元提供输入。\n2. 每个输入都乘以一个权重（权重可以是正的，也可以是负的）。对于非数值数据，如 `gender` 或 `smoker`，使用\
  \ `0/1` 标记表示每种情况。例如，女性为 `1`，男性为 `0`。\n3. 将输入乘以其权重并相加，得到初始得分。\n4. 在计算出初始得分后，对其进行转换。这通常是为了强制让得分落在\
  \ `0-1` 范围内。这种转换并非绝对必要，但被认为是一种“良好的做法”。这样做当神经元与其他神经元组合产生神经网络时，所有神经元产生的值都在相同的范围内；即\
  \ `0` 到 `1` 之间。\n5. 初始得分的转换版本就是神经元产生的输出得分。\n\n所以，在机器学习语境下，神经元并不是任何神秘或复杂的东西，它只是几个简单的公式。第一个公式将每个输入变量乘以权重并求总和。第二个公式（称为激活函数）随后修改（转换）该值，使其处于一个固定范围内，通常在\
  \ `0` 到 `1` 之间。就如此简单！巧妙之处在于确定权重应该是多少，我们很快就会介绍这一点。\n\n单来看，单个神经元与评分卡模型并没有太大区别。唯一的实质性区别是强制得分进入固定范围的转换。事实上，可以证明神经元生成的输出与评分卡模型的输出是等效的。为了产生神经网络模型，将许多神经元连接在一起。图\
  \ 8 提供了这种这种情况发生的一个示例。\n\n```\n![](images/00011.jpg\n```\n\n在图 8 中，输入数据提供给第一层中四个神经元中的每一个。每个神经元都有自己独立的权重集。权重与输入数据结合创建了基础得分（`Score1`、`Score2`\
  \ 等）。这些得分随后被转换以产生四个输出。来自第一层神经元的输出为第二层中的单个神经元（`Neuron 5`）提供了输入。`Neuron 5` 然后将前 4\
  \ 个神经元的每个输出乘以一个权重以创建 `Score5`。然后对其进行转换，以创建网络的最终得分。图 8 中神经网络的关键特征是：\n\n* 给定层中每个神经元的输入是相同的（例如第一层神经元的\
  \ `Age`、`BMI` 等），但每个神经元内部的权重是不同的。因此，每个神经元产生不同的得分。\n* 第一组神经元（第一层）的输出（得分）为第二组神经元（第二层）提供输入。\n\
  * 在此示例中，第一层有四个神经元。在实践中，无法预先确定最优神经元数量。相反，会构建具有不同神经元数量的竞争模型，并选择性能最好的一个。对于大多数业务应用的经验法则是，神经元数量在输入数据项数量的一半到倍之间（在本示例中为\
  \ 4 到 16 之间）。\n\n\n\n\n- 权重非常多。图 8 是一个非常简单的网络。它只有 8 个输入变量和 5 个神经元，但有 36 个权重。一个典型的业务应用，例如有\
  \ 100 个输入变量和 75 个神经元，将有 7,474 个权重。\n\n一旦创建了神经网络，就可以像评分卡（scorecards）和决策树一样对其进行评估和使用；即为验证样本创建评分，然后用其生成类似于图\
  \ 3 和图 6 所示的分数分布表。这些表随后用于根据案例获得的评分得出如何处理案例的决策规则。\n\n网络中权重的集合代表了训练算法识别出的模式。那么，训练算法是如何确定权重应该是多少的？创建了许多不同的算法来寻找神经网络中的权重，但它们都倾向于采用以下原则：\n\
  \n1. 为每个权重分配一个随机值或零。\n2. 计算网络为开发样本中所有案例生成的评分。\n3. 评估最终分数的准确性。例如，通过附录 A 中详细介绍的方法评估模型的提升（lift）和增益（gain）属性。\n\
  4. 调整权重以提高模型的预测准确性。\n5. 重复步骤 1-4，直到观察到模型性能不再进一步显著提高，或者经过了一定的时间。\n\n巧妙之处在于步骤 4，即如何调整权重。最简单的方法就是随机尝试不同的值并看什么效果最好。然而，这种方法非常低效，在现实时间内可能产生良好的解决方案。所有实际的神经网络训练算法都比这更聪明。它们根据算法每次迭代之间性能的差异，采用多种不同的权重调整策略。在过程开始，当容易获得预测性能的大幅提高时，它们会对权重进行大幅调整，然后随着性能的提高，逐渐进行较小的变化，以锁定最优解决方案。\n\
  \n图 8 中的神经网络在第二层有一个单神经元（`Neuron 5`），它生成单个评分。该评分代表某人在未来 5 年内患心脏病的可能性。如果网络被用于预测多个事件的预测问题，那么则将有一个单独的神经元来代表每个事件。对于目标识别等问题，末层神经元可能会生成成百甚至上千个评分。每个评分都代表了该项目是某一特定对象的概率。得分最高的对象将作为系统生成的预测结果。\n\
  \n神经网络之所以如此流行，是因为它们能够检测数据中细微的模式，而其他简单方法（如评分卡和决策树）可能无法检测到。这意味着它们可能产生更准确的预测。这是通过设置两层神经元来实现的，第一层的评分作为第二层的输入。\n\
  \n神经网络的主要缺点是它们生成的评分并不直观。是的，人们可以看到模型中的各种权重是什么，并理解整体的评分计算过程，但如果我问你图 8 中哪个输入变量对最终评分的贡献最大，那么这比心脏疾病的评分卡和决策树模型要少直而易见得多。如果业务或法律要求解释最终模型评分是如何得出的，那么这可能是一个问题。\n\
  \n深度学习代表了神经网络类型模型的最新演变。图 8 中的神经网络有两个层神经元，这种结构在许多传统的神经网络应用中被使用非常成功。然而，没有理由不能更多层。考虑图\
  \ 9 中的网络。它与图 8 中的网络具有相同的初始输入。还有一个单输出神经元（`Neuron 13`）用于交付最终模型评分。然而，图 9 中的网络有 4 层神经元，而图\
  \ 8 只有 2 层。\n\n从理论上讲，没有理由网络不能进一步扩展。考虑图 9 中的网络。它与图 8 中的网络具有相同的初始输入。还有一个单输出神经元（`Neuron\
  \ 13`）用于交付最终模型评分。然而，图 9 中的网络有 4 层神经元，而图 8 只有 2 层。\n\n从理论上讲，没有理由网络不能进一步扩展。根据需要，可以有\
  \ 5、6、7……100 层，每层有不同数量的神经元。人们倾向于发现，随着层数的增加，网络识别复杂或细微模式的能力会提高。层越多，网络越“深”。通常来说，任何超过\
  \ 2 或 3 层的网络都可以被归类为深度学习网络，但没有统一的定义。\n\n![](img/00013.jpg)\n\n\n\n\n## AI 问题的分类\n\
  \n- **“简单”AI 问题**：这些问题有一个单一的目标或想要确定的某个对象，且易于量化。对于分类问题，这意味着结果可以表示为简单的“是”或“否”，例如：某人是否会发生贷款违约？对于回归问题，结果是否可以表示为单个数字？例如：某人上次在商店里花费了多少钱。\n\
  - **“复杂”AI 问题**：这些问题通常有多个且非常细微的目标。“复杂”问题的经典例子包括目标识别、语言翻译和游戏对战（例如国际象棋或围棋）。这还包括需要结合使用多种机器学习方法的问题，例如在自动驾驶汽车和数字个人助手中。\n\
  \n情况并不总是这样界限分明，但作为一条经验之谈，这是一个很不坏的起点。\n\n## 业务应用与背景\n\n你可能会遇到的大多数业务应用（目标营销、信用评分、雇佣/解雇决策、交友网站上的匹配等）都属于“简单\
  \ AI”类别。一个仅跨越两层、包含几百个神经元的网络就绰有余了，其性能可能与设计良好的评分卡类型模型相当，甚至略好。然而，你永远无法完全确信。与机器学习的其他方面一样，给那些为你构建预测模型的人的建议是：尝试许多不同的方法，然后看哪种最符合你的需求。这既涉及原始的预测准确性，也涉及业务需求/限制。如果业务或法律要求模型输出必须让门外汉也能理解，那么你能用简单的语言解释模型为什么会给出那个分数吗？\n\
  \n数据科学家应该始终使用像评分卡这样的简单方法作为初始基准，然后尝试使用更复杂/更先进的方法进行改进。\n\n## 9. 无监督学习与强化学习\n\n我们目前为止讨论的机器学习技术都假设存在开发样本，其中包含了观测数据和结果数据。对于心脏病问题，开发样本中每个患者的数据都标记了标签，以识别他们随后是否患了心脏病。通过描述各种机器学习算法的应用，来寻找观测数据与结果数据之间存在的关系。这些关系随后以评分卡、决策树或神经网络模型的形式捕获。生成的模型就可以根据关于这些人的已知信息，预测他们未来患上心脏病的概率。\n\
  \n应用于已标记数据的机器学习（即开发样本中的每个案例同时具有观测数据和结果数据）被称为**监督学习**。你在业务世界中遇到的绝大多数 AI/机器学习应用，如目标营销、欺诈检测和员工审查，都是监督学习的示例。如果你有可标记数据，那么监督方法通常是正确的选择，并会产生最好的结果。\n\
  \n然而，存在某些类型的问题，其结果数据非常有限或不存在——只有未标记的观测数据。因此，虽然这本书主要关于监督学习，但花些时间考虑在这种情况下可以做什么是值得的。\n\
  \n### 无监督学习\n\n当结果数据不可时，可以应用一组被称为**无监督学习**的技术。无监督学习的一个关键特征是它主要用于知识发现；即检测数据中的有趣特征。这与监督学习形成了对比，后者通常与使用匹配的观测数据预测结果相关。\n\
  \n这在实践中意味着，无监督学习方法非常擅根据事物之间的相似性来识别和分组，但它们并不能提供告诉你某人或某物将如何表现的预测。因此，监督学习和无监督学习的目标与输出是非常不同的。在监督学习中，最终目标是某种预测模型。该模型可以用于预测当新案例出现时的行为。而在无监督学习中，输出是数据结构的表示，这完全是另一回事。\n\
  \n### 聚类\n\n今天最常用的无监督学习类型是**聚类**。聚类的目标是识别数据内部的相似性和/或连接，以便你可以将相似的案例分（聚）在一起。其想法是，由于给定簇中的案例具有许多非常相似的属性，你可以以类似的方式对待该簇中的每个人。\n\
  \n为了说明聚类的实际运作，考虑一下 Rebecca，她是一家位于大学城的影院综合体的经理。她的大多数客户在晚上和周末看电影。这可能是因为他们在其他时间在工作或上学。然而，她确实在周中提供一些早场，尽管这些场次的参与率并不高。Rebecca\
  \ 想更多地了解参加这些周中场次的人群类型。她可以针对当地社区中相似的人投放促销优惠，这些人可能在那个时间看电影，从而提高影院的观众人数。\n\n这是一个无监督问题，因为\
  \ Rebecca 没有关于人们之前对营销活动做出何反应的信息。没有过去发送过促销优惠的人员列表，也没有相应的标记（标签）来指示他们是否接受了优惠。这排除了开发任何使用监督学习方法构建的预测模型。\n\
  \n然而，Rebecca 知道当地社区中谁最近去过影院。这是因为现在大多数人都会通过他们使用的支付方法或智能手机的位置信息留下活动记录。一旦你有了这些信息，就可以从各种来源获得关于这些人的大量其他信息。\n\
  \n她认为特别相关的两个信息是影迷的年龄和他们离影院的距离。图 10 显示了随机抽取早场客户这两项内容的分布图。\n\n![](img/00014.jpg)\n\
  \n从图 10 可以清楚地看到两个分组（簇）。住在较近的年轻人，以及住在较远地方、主要是退休年龄的老年人。\n\n从图 10 可以看出，住在影院短途距离之外的年轻客户很少。此外，簇\
  \ 1 中人员的年龄范围相当窄；几乎完全是青少年后期到二十五岁。图 10 的另一个有趣特征是，几乎没有三十岁和五十岁的人参加任何早场演出。\n\nRebecca\
  \ 不知道为什么会出现这些簇，但她大胆推测道，年轻的影院观众主要是教学日程上有空隙的大学生。他们也可能更依赖公共交通，这使得走很远路去影院变得不方便。同样，老年人的一天可能比普通人更有弹性，有更多时间，有车，并且愿意走得远一些。与倾向于住在离影院近的大学宿舍的学生相比，他们也倾向于住在郊区的大房子里。\n\
  \n\n\n\n虽然图 10 中的信息非常简单，但它可以帮助 Rebecca 为两类客户中的每一组制定身定制的营销策略。这可以体现在以下方面：\n\n*   每个小组的个人目标是哪些电影。\n\
  *   反映前往影院不同交通方式的旅行优惠。\n*   可能吸引每个小组的额外项目折扣（例如，为年轻人提供汽水/啤酒，为中老年人提供咖啡/茶/葡萄酒）。\n\n\
  同样重要的是，Rebecca 知道早鸟型影院观众中很少有“中年人”。因此，她不应该浪费营销预算去试图说服他们来影院。\n\n影院案例通过仅两项信息以一种非常简单的方式说明了聚类（clustering）的概念。当关于人的成百或数千个数据项可用时，也可以应用相同的原理，但一旦数据项超过\
  \ `2 or 3` 个，就很难以图表的形式表示这些聚类。找出数据中有多少聚类以及这些聚类的特征是什么，是聚类过程的一个基础组成部分。\n\n### 聚类的商业应用\n\
  \n有许多基于聚类的商业产品。Experian 的 `Mosaic` 产品将英国所有的 180 万个邮政编码（zip codes）分配到 `66` 个聚类之一。Experian\
  \ 为每个聚类分配了一个标题，例如“市中心精英”、“低收入工人”和“经典祖父母”，以代表通常居住在这些地区的人群。对于住在每个聚类邮政编码的居民，提供了平均年龄、财富、孩子数量、信用卡使用等地理人口信息。组织随后根据每个邮政编码区域的人口统计特征，定制其客户互动策略。这之所以有效，是因为居住在同一社区家庭的人往往具有相似的人口统计特征。如果你是一个住在被分类为“市中心精英”地区的高薪银行家，那么你的邻居也是高薪专业人士的可能性远大于那些依靠福利金或最低工资生存的家庭。\n\
  \n### 聚类算法\n\n许多聚类算法都基于最小化开发样本中案例之间距离的原理。在这种情况下，距离并不一定指物理距离，而是对于给定的数据项两个案例之间的差异。`22`\
  \ 岁和 `24` 岁个人之间的距离小于 `18` 岁和 `75` 岁个人之间的距离。如果我们谈论吸烟习惯，那么两个烟民之间的距离为 `zero`，而一个烟民和一个非烟民之间则没有。同一薪级内两个人之间的距离通常小于不同薪级之间两人之间的距离，以此此类推。\n\
  \n在应用聚类算法之前，开发样本中的每个数据项都会被转换为标准的数值标度。例如，年龄和收入都可以被转换，使得它们的平均值均为零，且大多数案例落在 `-1` 和\
  \ `+1` 的值之间。同样，`0/1` 指示符用于表示如某人是否吸烟。通过这种方式，在应用聚类算法时，每个数据项的差异都具有相同的权重。如果不进行这种标准化过程，那么像以美元计算的收入这样大尺度数据项的影响将掩盖数值小得多的数据项（如受抚养人数）。\n\
  \n有许多不同的聚类算法可用，但受欢迎的之一被称为 `K-means clustering`（K 均聚类）。这就是 Experian 在设计其 `Mosaic\
  \ Product` 时描述的聚类类型。\n\n#### K-means 算法\n\n`K-means clustering` 算法的作用是将样本中的每个案例分配到\
  \ `K` 个不同的聚类之一，其中 `K` 是由用户选择的值。该算法通过将案例分配到聚类，使得每个聚类内所有个体距离之和最小化来实现。\n\n对于聚类，过程结束时并产生模型。只有一个标识符来说明观测值被分配到了\
  \ `K` 个聚类中的哪一个。你可能被分配到 `cluster 4`，而我则被分配到 `cluster 7`。当有新案例需要分配到聚类时，可以采用两种方法之一：\n\
  \n1. 重新运行聚类算法。在包含新案例的情况下重新分配聚类。\n2. 计算每个新案例与每个聚类 `center` 之间的距离。将案例分配给其中心最近的聚类。\n\
  \n第一种方案在聚类分配方面是最优的，因为随着更多案例的出现，聚类会随时间演化。然而，聚类可能需要大量的计算能力。如果在 `(near) real time`\
  \ 分配，方案 2 更为实用。让我们用图 11 中的例子来说明。\n\n![](img/00016.jpg)\n\n在图 11 中，字母 `A`、`B` 和 `C`\
  \ 代表要分配到已识别两个聚类之一的新客户。一旦他们被分配到一个聚类，Rebecca 就可以通过适当的营销活动来针对他们。很容易看出，客户 `A` 和 `C`\
  \ 更接近 `cluster 1`，而客户 `B` 最接近 `cluster 2`。如果将 `A` 和 `C` 分配到 `cluster 1` 而客户 `B`\
  \ 分配到 `cluster 2`，聚类内的距离和将最小。\n\n### 其他应用\n\n应用于营销的客户画像是聚类广为人知的应用，但基于聚类的方法也被成功应用于许多其他问题。一个例子是\
  \ `document clustering`（文档聚类）。在法律和学术研究领域，需要定期检索不断增长的出版文献，以寻找与特定主题或研究类型相关的信息。某些研究领域涵盖数百万论文和文章。数学数据库\
  \ `zbMATH` 包含约 400 万条来自来自 3000 本期刊和 180000 本书的评论或摘要。在医学领域，每年发表超过 80 万篇学术论文。传统的文档搜索方法类似于使用\
  \ `Google` 或 `Bing` —— 你在数据库的搜索引擎中输入关键词，它会找到匹配这些关键词的论文。然而，搜索词并不一定能带回所有相关文档，而且返回的许多文档并不相关，但在不同的语境中包含了关键词。\n\
  \n文档聚类本质上与我们之前谈论的影院案例没有区别。不是地理人口统计，而是词频、句子结构和其他文档特征提供了聚类过程中使用的数据项。\n\n文档聚类也可以实时应用于推文、新闻推送、博客文章和其他快速变化的媒体。图片和视频也可以以类似的方式进行分类。新闻机构使用这些方法自动标记标记关于特定主题的新帖子。这样他们就可以立即将其包含在自己的媒体出版物中。社交媒体公司和政府使用类似的方法（以及预测模型）来支持识别非法或不受欢迎的内容。\n\
  \n\n\n\n# 机器学习导论\n\n当存在大量观测数据且每个观测值都有明确、无歧的结果时，监督学习方法的效果非常好。如果没有可用的结果，无监督学习有时会被证明是有用的；尽管在某种不同的语境下。然而，在某些情况下，最初可能没有观测数据或结果数据，但学习过程能够在执行过程中根据具体情况评估其性能。模型在每次尝试任务时，都会根据每次尝试计算出的某种成功或奖励标准进行调整。这种类型的机器学习被称为强化学习。\n\
  \n## 强化学习示例\n\n强化学习的一个近乎过于简化的例子是训练一个神经网络，使其用最少的步数找到局部地形的最高点。在开始时，人们所知的只有当前的地图位置（经度、纬度和海平面高度）。网络可以生成\
  \ 4 种可能的得分，每种代表向前、向后、向左或向右移动。当前的状态（即当前位置）提供了输入（观测数据）。产生的状态（即执行网络建议的移动后的新位置）就是结果。\n\
  \n在每次移动之后，都会评估新的状态。我们现在的位置是否比之前更好（海平面高度更高）？如果答案是肯定的，则认为算法表现良好——奖励或成功的衡量标准很高。如果不是，则认为算法表现不佳——成功标准较低。然后，算法根据其动作产生的成功程度来调整模型权重。\n\
  \n该算法的更精炼版本还将过去的移动历史（即它去过的地方）作为输入数据的一部分。包含对未来成功的长期视角也是意义的，而不仅仅是看前一步的位置。例如，如果多次访问了同一个位置，则对成功进行惩罚；或者为进入地形中新的、未探索的区域提供奖励（增加成功），即使进入该区域的最初没有找到更高点。\n\
  \n## 与监督学习的比较\n\n数据科学家经常会谈论三种不同类型的机器学习；即监督学习、无监督学习和强化学习。然而，强化学习与监督学习共享许多特征。与监督学习一样，强化学习中使用的算法也会交付一个模型，通常基于某种形式的神经网络。同样，模型根据对给定输入数据产生的结果评估进行调整。随着算法迭代次数增加，模型中的权重不断精炼，模型的性能也随之提高。\n\
  \n“奖励/成功”和“失败/惩罚”术语倾向于应用于强化学习，但这些概念与描述使用监督学习开发的预测模型性能的“准确率”和“错误”非常相似。监督学习中实际值与预测值之间的小误差（即非常准确的预测）在广范围内等同于强化学习中的高程度成功。同样，监督学习中的错误分类或不准确的预测比于强化学习中的低奖励/失败。\n\
  \n## 案例研究：国际象棋程序\n\n### 监督学习方法\n监督学习和强化学习差异的一个绝佳例子是创建国际象棋程序时的模型训练方式。监督方法会将之前下过的游戏中的数千次步法（或步法序列）作为观测数据，并带有标记的结果数据指示该步法是否良好。模型产生的得分用于指示移动哪个棋子以及移动到哪里。然后，算法根据开发样本中包含的移动，寻找导致整体最佳移动组合的模型权重。\n\
  \n### 强化学习方法\n在强化学习中，最初不提供任何数据——完全没有！模型得分仍然像监督方法一样指示进行哪种移动。然而，由于没有数据来训练模型，最初这些移动多或是随机的。每次做出移动后，都会重新评估棋盘状态（新状态）。然后算法根据其移动被认为成功的程度来调整模型中的权重。\n\
  \n在国际象棋中评估一次移动有多成功是复杂的，并且通常会结合可能的未来状态以及当前状态。然而，为了本示例而言，一个简单的成功标准是移动后留在棋盘上的每个玩家剩余棋子价值的差异。如果你的移动导致吃掉了一个高价值棋子，而你自己没有丢失棋子，那就是巨大的成功。走了一一步后你的其中一个棋子被吃掉就是失败，产生较低的成功标准。最终的成功或失败是丢失王子——将死。通过这种方式，通过评估每一步并相应地调整模型权重，程序可以自己学习，而不需要提供任何先验信息。\n\
  \n## 优势与局限性\n\n强化学习相对于监督学习的一个关键优势是，随着算法修改模型中的权重，可以探索的移动集是没有限制的。在监督学习中，你受限于开发样本中可用的标记示例。对于像国际象棋这样的游戏，即使是包含数百万局游戏所有移动和结果的巨大开发样本，也只包含所有可能的移动中极小比例的一部分。当\
  \ Google 的 DeepMind AI 团队使用两种强化学习算法相互对决时，这一点得到了非常有效的证明。生成的模型不仅优于当时最强大的国际象棋程序，而且在过程中，算法发现了人类大师此前未过的全新对弈策略。\n\
  \n强化学习引起了巨大的兴奋，因为其学习过程非常类似于生物的学习方式。如果我正尝试学习杂耍，我最初没有任何信息。我尝试，失败，再次尝试并失败，尝试并设法杂耍了几秒钟，转过神来我就像专业人士一样杂耍了！随着每次尝试，我的大脑都在潜意识地学习更多环境知识，并根据每次成功或失败来精炼动作。\n\
  \n强化学习具有潜力，但它也有自己的缺点，并且比其他任务更适用。一个问题是训练算法受到试错过程速度限制。如果强化算法被用于做出抵押贷款决策，那么从采取行动到评估该行动是否成功之间可能有几个月或几年。因此，训练过程将花费太长时间，而没有实际用途。\n\
  \n\n\n\n\n决定把钱借给谁比国际象棋要简单得多，而且通常有大量的标记开发数据可用。因此，对于像信用风险评估这类问题，使用监督学习方法会更快地获得更好的结果。同样的问题也适用于任何无法快速衡量成功与否。如果我们回到国际象棋的例子，DeepMind\
  \ 的象棋程序需要对弈 6800 万局才能达到现在的水平。它只能通过与另一台计算机对弈来实现这一点，让比赛在几分之一秒内完成。如果它是在现实世界中与人类对手对战，就不可能在合理的时间取得相同的结果。训练过程将太缓慢了。\n\
  \n强化学习的另一个弱点是训练过程中失败的成本。如果你将强化学习算法嵌入到你组织的招聘政策中，那么你最初会招到大量糟糕的员工，这将导致各种问题。类似地，你也不希望将强化学习算法直接连接到客运客飞机的控制系统上。\n\
  \n好了，寻找虚拟山峰的顶和在国际象棋中达到超人类水平固然很好，但强化学习在现实世界中的业务应用是什么？坦率地说，目前数量并不多。就个人而言，我从未参与过使用该技术的解决方案交付，我也不认识任何这样做的人。我也做过很多研究，发现了许多非常有趣的学术论文和充满热情的媒体文章，但现实世界的案例要少得得多。我的结论是，目前使用的基于强化学习的解决方案与监督学习相比，数量是微不足道的。如果我必须给出一个数字，我估计超过\
  \ 95% 的现实世界应用利用监督学习，而剩下的 5% 大部分是基于聚类的无监督方法。然而，随着技术的成熟，这种情况可能会发生变化。直觉上来说，如果你有算法可以构建出比任何活人都更好的国际象棋或围棋的程序，那么它们在其他领域也具有潜力。\n\
  \n强化学习看起来正在产生影响的一个领域，是提高不确定或混沌环境中复杂控制系统的效率。像电网、供暖系统和服务器农等复杂系统，拥有许多用于管理系统不同部分的控制装置。控制装置与系统性能之间的关系并不总是显而易见的。这并不是一个控制影响一件事的简单案例——万物都是互相关联的。调整电厂冷却系统水压以提高涡轮性能，会对下游变压器的效率产生负面影响。就像国际象棋问题中存在几乎无限可能的对局一样，在发电厂中，控制设置的组合也几乎是无限。强化学习通过试错寻找更好的控制设置方法，以优化系统的整体效率。这反映了经验丰富的工程师如何利用多年实践积累的知识和直觉，来判断调整不同控制装置对系统范围可能产生的影响。\n\
  \n强化学习另一个展现前景的领域是机器人技术。这是为了训练机器人去执行以前只能由经过培训的人员完成的复杂手动任务。机器人被赋予诸如翻转汉堡、分类物品或堆叠架子之类的任务，通过试错，它们可能会学会非常有效地完成这些任务。\n\
  \n## 10. 如何构建预测模型\n\n在本章中，我们将从小钥匙孔窥向另一侧……我们将从日常的理智理性的世界跨越边界，进入数据科学家那扭扭曲的多维领域；即那些拥有数学学位和博士学位的技术专家。在我们的旅程中，我们将：\n\
  \n1. 描述数据科学家在应用机器学习开发预测模型时应该遵循的流程，这些模型随后将作为自动化决策系统的一部分使用。\n2. 以普通人能理解的方式解释这一过程。这是为了帮助你掌握数据科学家正在做什么。这反过来将确保你得到的是你所要求的，而不是数据科学家认为你的组织需要的。\n\
  \n正如我们在书开头讨论的那样，倾向于成功的 AI/机器学习项目是那些业务用户和数据科学家手手合作的项目。在我的经验中，当数据科学家被留下来“自己去做”，并在项目结束时作为致命一击来交付结果时，交付的往往是次优解决方案。在最坏的情况下，他们可能无法交付任何有用的东西。\n\
  \n我合作过的绝大多数数据科学家都意识到让客户参与机器学习过程的必要性，并为项目获取业务投入而努力。然而，遗憾的是，我也看到过不止一个数据科学家故意试图用技术术语混淆普通人，或完全避免与他们交流的案例。这样他们就可以专注于处理所有重要的数学内容，而无需对付那些每天必须运行组织的、糟糕的业务人员。在尝试判断一个数据科学家是否在履行职责时，一个可以遵循的简单规则是：\n\
  \n如果他们不能用简单的英语向你解释他们正在做什么以及为什么要这样做，那么他们没有完成任务。\n\n数据科学家还需要让业务部门明确了解他们工作对现实世界的影响。作为一名业务用户，我对预测模型准确率达到\
  \ 95% 并不感兴趣，也不在乎它比要取代的过程多出 10% 的歧视性。我想知道的是：这个模型将给我带来多少钱，将救多少命，我将少雇佣多少员工，或者任何会影响我业务目标的因素。如果一个数据科学家不能根据为客户提供的底部效益来表达解决方案的优点，那就是一个糟糕的数据科学家。\n\
  \n然而，这是双向的。把所有责任推在数据科学家身上是不公平的。让业务用户努力基础了解数据科学家如何进行机器学习过程并不是不合理的要求。随着项目的进行，应该有双向的信息交换和定期会议，以非技术性的、以业务为中心的方式展示并讨论初步发现和结果、问题和困难。这将引导项目的推进。\n\
  \n\n\n\n考虑到这一点，我将避免涉及机器学习中使用的各种算法的数学原理，例如用于训练神经网络或决定决策树分裂分配方式的算法。对于那些对技术细节感兴趣的人，机器学习中最常用的算法都有非常详尽的文档（请参见附录\
  \ B 中的推荐书籍和网络网站）。同样，这些算法的实现可以在商业统计软件包中找到，你可以购买这些软件包，也可以通过开源软件免费获取（例如 `R` 和 `Python`\
  \ 代码库）。你不需要知道如何编写特定的机器学习算法；只需要知道如何在你选择的软件软件包中调用相关的函数或过程即可。\n\n图 12 概述了开发预测模型的机器学习过程的关键步骤。\n\
  \n![](img/00005.jpg)\n\n### 第 1 步：业务问题量化\n\n数据科学家需要做的第一件事是业务问题量化（第 1 步），即将业务试图实现的目标转化为简单的数字或分数。零售店的销售总监可能会这样开启与数据科学家的会话：\n\
  \n> “我们需要一个预测模型来识别我们的优质客户。”\n\n所以第一个要问的问题是：\n\n> “你说的‘优质’是什么意思？”\n\n销售总监回答道：\n\n\
  > “那些对我们的业务做出最大财务贡献的客户。”\n\n好的，这听起来合理，但“财务贡献”是指毛销售额还是净利润？我们讨论的是每次进店的、每次点击的，还是每个单位时间（周/月/年）的贡献？当我们谈论“客户”时，我们指的是个人贡献还是家庭贡献？问题以此类推。数据科学家需要理出业务所需求的精确定义，然后以这种方式将其表达，使其能够由构建的模型所生成的分数表示。\n\
  \n在这个例子中，可能在与营销总监讨论后，双方共识认为模型旨在预测个人每季度的总毛支出。选择季度毛支出是因为它与组织的报告周期相一致，且总收入（支出总和）是销售总监的关键绩效指标。\n\
  \n选择个人支出而非家庭支出，是因为双方达成共识：尽管从理论上讲家庭支出更好，但该组织的客户数据库结构是基于个人级而非家庭层级的。在组织现有的 IT 基础设施下，无法部署基于家庭支出的模型。IT\
  \ 能够升级以提供家庭视图吗？不，绝不，作为该项目的一部分，因为业务部门今年没有为 IT 变更分配任何预算。\n\n基于这些信息，数据科学家应该确定这是一个回归类型的问题，用于预测每个个人客户在三个月预测期内将花费金额。\n\
  \n### 探索性分析\n\n在确定如何量化表达业务目标的同时，数据科学家需要进行探索性分析，以了解组织的数据和 IT 资产、它们如何工作，以及它们如何与更广泛的业务交互。这包括：\n\
  \n*   组织拥有哪些数据库？\n*   每个数据库的目的是什么？哪些流程使用了它们？\n*   数据库包含什么内容？即包含哪些数据项以及这些数据项的格式。例如，是数值还是文本数据。\n\
  *   每个数据库是如何更新和维护的？大多数组织拥有“实时”客户数据库（一旦发生变化就会更新）和更新频率较低的批处理数据库（例如，夜间或月底更新）。\n*  \
  \ 已经建立了哪些决策系统？模型是将在实现在现有系统中，还是需要新的功能？\n*   组织目前使用哪些数据来做出决策？即使这些数据是用于某种过时的手动流程，这些数据对于机器学习目的可能也极具价值，因为组织已经识别出它们是有用的。\n\
  \n在理想的世界里，每个组织都应该拥有详尽的文档（元数据），提供其数据资产的清单。这涉及到其持有的数据类型、数据如何格式化、来源以及如何使用。然而，在实践中，这类信息往往是不完整的、错误的或过时的。许多有用信息存储在业务用户的脑海中，他们日常工作的一部分经常使用这些信息。可能会有一个名为“客户人口统计\
  \ 3”的数据项，其中包含字母 `A`、`B`……`G`。这到底是什么意思？在任何地方都没有记录，但运营部的 Claire 知道它与他们使用的收入等级相匹配。“A”意味着年收入低于\
  \ 20,000 美元，“B”是 20,000-35,000 美元，以此类推。\n\n许多组织还维护着他们已不再理解的数据。然而，他们担心删除它们，以万一那是业务关键流程所依赖的某些信息。在探索性分析阶段，还应该检查潜在的新数据源（包括内部和外部），因为这些可能会增强任何开发模型的预测能力。\n\
  \n总的来说，需要投入大量精力探索可以收集数据的宇宙，并决定哪些可能可以使用，哪些不能使用。\n\n### 第 3 步：开发样本\n\n一旦数据科学家对组织拥有的数据及其结构方式有了良好的了解，他们就可以进入第\
  \ 3 步，考虑创建将用于机器学习过程的开发样本。\n\n构建预测模型的一种非常幼稚的方法是将组织拥有的每条信息都丢进机器学习过程中。在实践中，许多数据是过时的、不稳定的或其他不适当的。因此，应该将它们从开发样本中排除，以防降低机器学习过程的性能。\n\
  \n从机器学习过程中排除数据的一些典型原因包括：\n\n*   **过时数据**：如果数据与当今世界不再相关，就不要考虑它。关于在智能手机出现之前人们如何使用手机手机的数据，对于告诉你智能手机的使用情况将毫无帮助。\n\
  *   **不具目标人群的代表性**：开发样本应仅包含与模型将应用的人群镜像的案例。如果专门为在线客户开发收入模型，那么如果这两个渠道的支出模式不同，你就应该排除店内交易。同样，如果你从声音样本中开发语音识别系统，则所有样本都应该是与语音相关的。如果你有狗叫或交通噪音的示例，那么这些需要被移除。\n\
  *   **数据的稳定性**：机器学习过程中使用数据在模型应用时是否可用？如果某个数据项在实施点不可用，则应将其排除。\n*   **法律和伦理原因**：你想使用敏感的个人数据，如种族、性别和性取向吗？这类数据具有很强的预测性，但使用它们可能是非法的。如果是合法的，当人们知道你对某些群体的方式不同时，使用此类数据可能会产生声誉风险。如果基于模型分数的折扣策略导致你只对直男士提供折扣——那将会引起争议。\n\
  \n\n\n\n\n*   **确定性情况。** 如果你明确知道自己将如何处理某些客户，那么你不需要为他们建立预测模型。将他们包含在开发样本中只会削弱模型在剩余样本^([\\\
  [48\\]](#index_split_028.html#filepos427242))上衡量得出的效能。\n\n*   **不可解释性。** 机器学习的一项基本原则是，在使用你不完全理解的数据构建模型时，应该非常谨慎。这对于那些受行业监管或对组织成功具有战略重要意义的模型来说，尤为如此。如果数据科学家向你展示了一个使用他们无法解释的数据构建的模型，那么这就是你应该关注的风险。\n\
  \n如果一个机构拥有巨大的数据库，那么在机器学习过程中分析这些数据库时，所需的计算机资源可能会成为问题。只选择部分样本（例如 1:10 或 1:100 的案例）纳入开发样本的情况，这种情况并不罕见。\n\
  \n“大数据纯主义者”可能会认为，你应该分析所有可用数据，因为这样做可能会遗漏细微的模式，从而创建出次优的模型。从某种意义上来说，他们是正确的。如果你采用样本而不是使用全样本，所得模型的准确性将不会那么高。然而，这非常符合收益递减规律。对于几乎所有的实际业务问题，增加几万个案例带来的收益都是微乎其微的。如果你以适当的方式^([\\\
  [49\\]](#index_split_028.html#filepos427639))，那么与使用 1000 万案例开发的模型相比，使用 10 万案例开发的模型将获得\
  \ 99% 的收益。换句话说，仅仅因为你拥有海量数据并不意味着你需要投资专业的硬件/软件来应用机器学习——你只需要在方法上足够聪明，并专注于真正重要的数据。\n\
  \n该流程的第四阶段是数据准备。之所以这样做，是因为原始数据可能格式不佳、包含错误，或者无法提供数据的最佳表示；即，不同的表示方式将使机器学习过程更容易发现数据中的重要模式。数据准备期间主要有四项任务：\n\
  \n1.  **创建新数据。** 对于大多数类型的问题，年龄比出生日期更具预测性。因此，如果只有出生日期，则可能需要计算年龄。如果你有信用卡交易数据，最好是创建汇总变量，代表每笔交易的平均支出、上个月的交易次数、距离上次交易的时间等等。\n\
  \n2.  **数据清洗。** 数据可能缺失或不正确。数据准备的一个关键目的是识别此类数据存在于何，并将其删除（排除）或重新格式化；即，用标准值对所有错误/缺失的数据进行重新编码。如果用于计算年龄的出生日期在未来或在过去远得离谱，你可能想为年龄定义一个默认值（例如“-1”）来表示这些情况。\n\
  \n3.  **合并。** 以相似的方式表示相似的数据是一个良好的做法。如果你有一个名为 `Property Type` 的数据项，其值 `D`、`Det` 和\
  \ `DH` 都代表相同的意思（即 `Detached House`），那么这些应该被合并为一个单一值，用于表示所有独立屋案例。\n\n4.  **转换为数值。**\
  \ 机器学习算法喜欢数值型数据。`“Yes”/`“No”/`“Maybe”` 将转换为 `0/1/2`。\n\n\n\n\n\n现代机器学习软件是高度自动化的。只需点击按钮，即可获得多种算法。许多算法还提供了处理数据准备、预处理和变量选择的功能。因此，有人会认为，你不需要统计学或机器学习的博士学位就能开发预测模型，从某种意义上来说，这确实是事实。\n\
  \n然而，浅尝辄止是危险的。如果你没有相关的技术背景，可能无法妥善地准备或预处理数据。同样，对于给定的算法，通常有一系列不同的选项供选择，你需要了解每个选项如何影响交付的解决方案。此外，你可能无法解释软件的输出结果，或者不知道根据这些输出告诉你的信息应该采取什么行动。\n\
  \n机器学习算法仅仅是一组规则和逻辑语句，通过特定的方式应用以创建预测模型。有时也会会出问题。软件可能会（正确地）报告所创建的模型非常准确，但实际上该模型是毫无用的。\n\
  \n### 案例研究：房贷违约预测\n\n考虑一个使用机器学习开发的预测模型，该模型用于预测人们是否会抵押贷款违约。该模型将用于决定向哪些房贷申请人发放资金，以及拒绝哪些申请人的信贷。这个模型的正常运行非常重要，因为如果把钱借给了错误的人，将面临数十亿美元的风险。\n\
  \n软件报告，该模型预测房贷违约的准确率达到了 97%。这是一个好模型吗？一个天真的（也是错误的）回答是肯定的，当然是——这已经接近 100% 了，不可能更完美了。此外，你可能预料一个糟糕的模型准确率大约在\
  \ 50% 左右；即它的性能类似于随机猜测。所以，这个模型比那要好得多，不是吗？\n\n等一下，牛仔哥！让我们退后一步，看看开发样本。它包含了关于房贷申请及其后续还款表现的历史信息。假设\
  \ 98% 的人按时偿还房贷，2% 的人违约。我只需说“我预测所有房贷都会被还清”，就能轻松地超越该预测模型。我只会在那 2% 的违约案例中出错。我预测的准确率是\
  \ 98%。这一定有问题，因为我这个简单的“接受所有人”的规则竟然比使用高级机器学习算法得出的规则还要准确！这只是在评估预测模型的好坏以及其是否构建正确时需要考虑的问题类型之一。\n\
  \n### 模型评估\n\n一旦使用开发样本构建了模型，就需要工作来评估模型的性能（第 7 步）。从技术角度来看，这主要涉及评估模型在不同数据样本上的预测准确性。这些样本应当独立于构建模型时的数据，以便提供一个公平且无偏的视角，观察模型在实际应用于新案例时的表现。特别是，如果开发样本是几个月前创建的，则应该使用更新的数据对模型进行评估，以确保它继续按预期运行。数据科学家可能会报告在开发样本上测量的模型性能，但他们应该基于一个或多个独立的验证样本对模型性能进行所有最终评估。\n\
  \n其他验证活动可能更具定性性质，用以检查是否存在可能适用于某些类型数据使用方式的法律限制，并确保在模型应用时所使用的数据是可用的；例如，如果模型将要集成到组织的某个系统中，那么计算模型评分所需的数据需要在该系统内可用。\n\
  \n### 迭代过程\n\n机器学习是一个迭代过程。在确定最终模型之前，通常会先使用不同算法的变体和/或不同的数据表示来构建许多模型。如果有更多的时间和资源，总可以在预测准确率上找到另一个微小的改进。然而，在现实世界中，时间和资源是有限的。因此，需要决定决定何时停止机器学习过程，审查已开发的模型，并决定接受哪一个作为你的最终模型。\n\
  \n### 业务视角\n\n从业务视角的来看，对最终模型的评估应该用关键性能指标（KPI）和底线收益来表达。这些在过程开始时就应该被考虑进去。考虑一种为信用卡提供商开发的自动建议服务，旨在提高其客户服务中心的效率。开发解决方案的公司决定将其命名为“自主机器人顾问”（Autonomous\
  \ Robotic Advisor），让它听起来像一种酷炫且性感的现代 AI 类产品。\n\n系统的决策部分是使用之前记录的客户服务电话数据构建的。一个预测模型（在本例中为深度神经网络）是从一个开发样本开发的，该样本包含了数十万次与客户的电话对话。这些对话被归类为以下类型的查询（事件）：\n\
  \n1.  查询账户余额。\n2.  想要最近交易列表。\n3.  报告信用卡丢失或被盗。\n4.  请求销户。\n5.  其他。\n\n事件 1 到 4 是最常见的客户查询类型，占客户电话的\
  \ 60% 左右，目前由人工顾问处理。鉴于前四个事件只需要相对简单的标准回答，完全可以实现这些类型查询的客户服务流程自动化。\n\n如果查询涉及其他内容（事件\
  \ 5），则系统会将电话转给人工处理。同样，如果客户在事件 1-4 的自动回复结束时表示他们对回复不满意，那么他们仍然可以要求与真人交谈。\n\n当客户来电时，他们的语音首先被预处理为一组数据项，为机器学习过程提供输入。这些数据项主要是标记位或计数器，代表与特定类型查询相关的特定单词、短语和句子。通过机器学习过程产生的预测模型随后会生成客户问题落在五个类别中每种类别的概率。一旦机器人顾问识别出最可能询问的内容，就可以制定出合适的回复。如果机器人顾问判断客户最可能是在查询余额，则将从公司的账户管理系统中检索相关信息并提供自动回复。“您的未付余额为\
  \ $XXX”。\n\n\n\n\n\n**1. 如果问题由机器人顾问（Robot Advisor）处理，客户没有得到正确答案的概率有多大？它是基于预测模型的。因此，它在某些情况下会出错。**\n\
  \n这些结果之间也存在权衡。你可能可以使用该顾问来减少人员配置、提高服务水平或二者兼之。如果你想确保系统仅在几乎确定能给出正确响应时才回答查询，那么你转交给人工操作员的请求将比你愿意接受高错误率时多得多。如果设置一个阈值，只有当系统给出正确答案的概率（例如，高于\
  \ 99%）时才响应客户，那么你转交给人工核保员的请求将比你将阈值设置为 80% 时多得多。此时的问题变成了客户服务问题。如果你将阈值设置为 80%，那么将会有高达\
  \ 20% 的客户感到不满，因为系统在每 5 次情况中会有 1 次给他们错误的答案，而不是每 100 次中的一次。\n\n为了能够回答此类问题并制定适当决策规则（第\
  \ 9 阶段），数据科学家需要收集有关组织运营性质的信息。这样他们才能量化其工作的业务效益。否则，他们如何证明自己所做事情的价值呢？\n\n如果一切都是为了节省成本或增加利润（这几乎总是如此），那么在这个示例中，数据科学家需要找出不同类型的通话通常持续多久，以及每次通话为公司带来多少成本。这结合自动化通话的比例数据以及开发系统的成本，将能够对机器人顾问项目进行成本效益分析。\n\
  \n到本章为止，我们一直关注应用机器学习的过程。但数据科学家需要多长时间才能为你交付一个预测模型呢？这是一个非常有误导性的问题。许多解决方案供应商都会告诉你，他们可以在几分钟内为你开发好模型。“你只需要将数据上传到我们的云端\
  \ AI 解决方案中，我们将在几秒钟内给你答案！”这在某种程度上是真实的，但你需要考虑应用机器学习的背景。要在几分钟内获得结果，你必须将所有数据整齐地收集在一个地方。你不需要太在意模型的预测是如何得出的、如何交付或以什么格式交付的。如果你有多个复杂的数据库需要整合，有大量杂乱的数据，并且生成的模型符合各种法律法规和业务要求至关重要，那就是另一回事了。在获得合适的解决方案之前，可能需要几周、几个月甚至几年。\n\
  \n## 11. 机器学习的运营化\n\n一些组织已经使用了机器学习几十年。这在金融服务行业以及大型面向消费者组织（如超市连锁和百货商店）的营销部门尤为如此。对于硅谷精英（包括\
  \ Amazon、Google 和 Facebook 等公司），机器学习是他们所一切的核心。这些组织拥有完善的 IT 基础设施、系统和流程，用于应用机器学习并实施结果。他们日复一日地这样做——这只是业务常态。\n\
  \n对于对人工智能和机器学习较新的组织来说，首次构建预测模型并将其作为自动化决策系统的一部分进行运营化可能是一项艰巨的任务。有时，可能需要几个月的时间所需的数据才能就绪，机器学习过程才能开始。然而，收集正确的数据并应用相关的机器学习算法（如上一章所述）通常是机器学习项目中最简单的部分。这是因为归根结底，预测模型只是电子表格、Word\
  \ 文档或其他软件中的一组方程。一旦机器学习过程完成，如果结果要发挥作用，就需要对其进行运营化。\n\n主要的挑战，特别是对于以前没有使用机器学习的组织来说，是接受自动化决策的使用。他们需要：\n\
  \n1. 建立基础设施，使预测模型成为组织运营决策能力的关键部分。\n2. 对基于模型预测做出的决策感到放心。这包括建立治理程序，以确保基于模型的决策按照预期执行、符合法律法规，并且在特定的预先约定的情况下，否则这些决策不会被员工忽略或无。。\n\
  \n也许一个组织可以犯的最大错误是假设成功的机器学习是：“这完全取决于模型”，而他们应该从“这完全取决于业务”的角度来考虑问题。\n\n机器学习可能为组织所做的事情增加价值，但反过来说，也可能不会。一个有用的类比是制造汽车引擎。工程师可以花费大量时间制造一个非常强大且高效的引擎。然而，除非有人考虑过车身设计、发动机安装等（引擎将放置在其中），否则这个引擎将无法提供任何益处。没有汽车的其他部分，引擎就是没用的。机器学习也是如此。除非有一个业务流程来嵌入模型，否则模型将没有太大用。\n\
  \n如果一个组织要成功将机器学习整合到其业务流程中，那么需要考虑以下五个核心领域，顺序如下：\n\n1. **问题**。机器学习将用于什么？需要一个机器学习可以帮助解决的明确问题。\n\
  2. **文化**。能否说服业务部门在没有人类专家参与的情况下接受自动化决策？从管理角度来看，是否有足够的资源（即人员和资金）使预测模型整合到相关的业务流程中？\n\
  3. **实施**。将使用什么系统或流程将模型付诸实践？评分如何计算？基于评分做出的决策如何由相关的业务职能执行？\n4. **开发数据**。是否存在足够的数据来构建预测模型？\n\
  5. **分析能力**。组织是否拥有所需的软件工具和知识来分析数据、应用机器学习并构建高质量、可用的预测模型？\n\n从乍看，这个列表的顺序似乎有些违背直觉。例如，为什么模型实施排在分析之前？难道不是先建立模型，然后考虑实施它吗？\n\
  \n机器学习对很多事情都有用，但并不总是基于机器学习的自动化解决方案才是你需要的。同样，仅仅在技术上可以预测某些事情并不意味着你应该这样做，也不意味着这些预测会被证明是有价值的。因此，从问题规范和解决该问题的计划开始。\n\
  \n如果机器学习将是问题的答案，那么在进行其他工作之前需要确定的两个关键事项是：\n\n\n\n\n\n1.  你想要预测的不确定事件/数值/事物是什么？这需要非常清晰且明确。它必须易于衡量，并在分类问题中表示为简单的指标，或在回归问题中表示为数值。\n\
  \n2.  根据模型预测的结果，将对如何处理人员采取哪些决策和行动？\n\n开发一个预测注定会发生事件的模型是没有任何意义的。同样，如果无论人的得分如何，他们都继续以相同的方式被对待，那么模型有什么用呢？如果现有客户在下次购买时总能获得相同水平的折扣，那么建立一个用于识别重复购买者的预测模型就没有意义了。只有当根据模型生成的评分提供差异化的激励策略时，重复购买者模型才有用。例如，对于模型预测几乎肯定会再次购买的人（高分）不提供折扣，而对分值处于另一端的人（低分）提供大折扣，以鼓励他们再次在店里购物。\n\
  \n确定正确的问题至关重要。机器学习的一个局限性是它非常具有针对性。例如，在税收中，我们感兴趣的是识别错误的纳税申报（分类问题——是否支付了正确的金额），还是最大化总税收（回归问题，征收金额）？许多人在纳税申报中会犯小错。发现这些错误是有帮助的，但不会大幅增加征收的总额。事实上，很多人不小心多交了小额税。如果你的模型识别出这些情况，你可能退还部分已支付的税款，而不是收得更多！\n\
  \n税务机构受到资源限制。如果你想最大化税收，你应该只关注欠缴金额非常大的案例。税务机构根本没有人力跟进每一个小额欠缴。因此，问题需要捕获到这一需求。例如，忽略小于\
  \ 1000 美元的税收差异。同样，一个用于预测心脏病的模型可能不擅长预测痴呆，反之亦然。\n\n构建预测模型时的第二个考虑因素是组织文化，以及受模型影响的业务领域对变化的接受程度。现有的工作习惯和对新工作方式的抵制往往是引入机器学习的障碍。当员工被要求根据模型的告知做出不同行为时，情况尤为如此；即机器学习将改变人们工作的方式，在某些情况下，它会导致职位流失和/或技能贬值。\n\
  \n通常情况下，某个领域的专家并不倾向于相信预测模型预测结果的能力像他们自己那么好。这意味着，如果给他们机会，专家往往会覆盖基于预测模型做出的决策——实际上抵消了模型可能带来的任何收益。\n\
  \n覆盖决策是否会成为问题，通常取决于预测模型是以主动的还是被动的方式实施的：\n\n*   **主动模型（Active Models）**：模型生成的预测结果（评分）会被自动触发操作。执行操作时不需要人工干预。\n\
  *   **被动模型（Passive Models）**：模型评分被用于生成案例并传递给人员，由他们再决定如何处理；即，在某人对分析过程生成的案例采取行动之前，什么都不会发生。\n\
  \n使用主动模型的一个场景是债务催收。预测模型被用于根据哪些债务人最可能偿还欠款来对债务人进行排序。排序后的列表被加载到拨号系统中，系统会按列表顺序自动给这些人拨打电话。\n\
  \n当与债务人取得联系时，电话会转接给人类催收员，由该人员试图说服债务人偿还欠款。催收员本身并不关心案例呈现给他们的顺序。他们只是简单处理收到的每一个案例。因此，一旦模型实施，就不再需要额外的人工输入来决定拨号器维护的通话列表顺序。\n\
  \n另一方面，被动模型的示例是一个设计用于根据应聘者对特定职位的适用程度进行排名的模型。模型可能非常擅挑选最有前景的候选人，但仍需要人类面试官会候选人并对职位录取做出最终决定。如果面试官出于某种原因不喜欢某个候选人，那么他们就不会给该候选人提供工作，无论其实际能力有多强。\n\
  \n被动模型是最容易问题的。这是因为在许多组织中，一线人员有能力改变或更改中央做出的决策。在招聘示例中，面试官越是决定用自己的判断覆盖基于模型的决策，模型的力量就越被削。此外，人类评估者往往表现出偏见（意识或无意识），根据某些未发现的偏见或刻板印象使优秀的候选人处于不利，导致许多优秀候选人的工作申请被拒绝。\n\
  \n我遇到的另一个例子是在税收领域。一个中心职能负责识别潜在的欺诈纳税申报，这些案例随后被传递给当地的税务查员进行详细调查。税务查员有权拒绝他们认为不合适或不太可能产生大量额外税收的案例。\n\
  \n当中心职能实施一个预测模型来识别极有可能欺诈的案例时，税务查员拒绝的案例数量急剧增加。这并不是因为模型生成的案例不是欺诈，而是因为模型太擅长识别欺诈活动，由于数据中有非常微妙的迹象。\n\
  \n当案例到达税务查员的办公桌时，查员无法准确判断其具体哪里可疑。他们不知道如何开始调查，因此他们拒绝了它。同样，模型经常选择那些非常复杂、或者即使明显发生了欺诈也很难收回欠缴税款的案例。这类案例也倾向于被拒绝。\n\
  \n主动模型比被动模型更容易成功实施。这是因为人们没有机会去覆盖基于模型的决策。例如，一旦做出了给客户发送优惠券的决定，发送带有说明信的优惠券的过程就是自动的。没有人会质疑系统，并将优惠券发给他们认为他们想要或不会使用的客户。这就是为什么机器学习在目标营销、信贷发放和保险定价等领域能取得如此成功，但在医疗保健、人力资源、执法和教育等领域利用尚不足的原因之一。\n\
  \n\n\n\n\n# 实现\n\n清单上的第三项（在问题定义和文化之后）是实现。正如之前讨论的，机器学习的核心在于做出更快速、更好且更廉价的决策。预测模型可以在电子表格中手动实现，甚至可以用笔和纸来计算分值，但在大多数情况下，预测模型被嵌入到自动化决策系统中。该系统使用模型对人们的未来行为做出预测，然后根据这些预测做出如何处理这些人员的决策；例如，如果分数足够，则决定授予贷款。\n\
  \n通过将决策过程自动化，可以在几秒钟内针对数百万人实施个性化的策略。这在实践中意味着，机构可以非常频繁地更新他们对人员的预测：每月、每天，甚至是实时——只要获取了关于某个个人的新信息即可。\n\
  \n实际开发的预测模型数量远多于实际投入运行的模型数量。我数不清共合作过的机构数量了，在这些地方，每个人对模型构建过程都非常兴奋，但随后忽略了考虑在模型完成后如何将其投入使用。除非使用预测模型的基础已经非常完善，否则预测模型的实现过程通常比构建模型本身要长得多、更耗时。最流行的机器学习软件包（`R`\
  \ 和 `Python`）不会自动为你将模型部署到运行系统中。在数据科学家被允许开始收集数据和构建模型之前，就需要考虑模型实现、批准预算并开始规划。\n\n##\
  \ 实现方法\n\n通常，机构实现模型的方法有两种方式。\n\n### 1. IT 项目方法\n第一种方法是将实现视为一个 IT 项目。聘请程序员在机构的 IT\
  \ 系统内对模型进行“编码”，以便在需要的时间和地点计算所需的分值和决策规则。这是一种常用方法，但令人惊讶的是，模型经常因为简单的错误而编码错误——例如，在评分表中给某人打\
  \ 100 分而不是 10 分，或者在评分表中加 15 分而不是减 15 分。此外还有优先级问题需要处理。由于其他任务优先级更高，模型实现耗时几个月甚至几年的情况并不罕见。而且，在模型实现后，尝试更改模型或相关的决策规则将是一场噩梦。因为每一个更改都必须返回\
  \ IT 工作队列中进行优先级排序。\n\n### 2. 专业软件方法\n模型实现的第二种方法是通过专业软件，这种软件在用于构建模型的机器学习软件与将要部署模型的运行环境之间提供了一个接口。当模型完成后，数据科学家只需点击软件中的“上传”按钮，软件就会将模型（以及相关的决策规则）部署到运行环境中。\n\
  \n这种方法的主要优势是，从理论上讲，模型可以在构建后几乎立即实现。重要的是，是数据科学家和业务用户控制模型的实现以及相关的阈值（决策）规则。IT 部门几乎或完全不需要投入。这避免了如果模型实现被置于\
  \ IT 工作队列中可能会出现的长时间延迟。\n\n## 数据\n\n在分析过程开始之前的倒数第二个考量因素是数据。数据是分析过程的首要原料。它是至关重要的。没有数据，或者没有类型的数据，就无法构建或部署有效的模型。因此，在考虑运行机器学习算法来构建预测模型之前，需要对将要使用的数据进行充分考虑。特别是：\n\
  \n*   **开发样本数据**：如第 5 章所述，需要一个规模合理的数据样本。该样本需要同时包含历史观测数据和较近的结果数据。\n*   **运行可用性**：出现在结果模型中的任何数据在模型实现时必须是可用的。\n\
  *   **运行稳定性**：如果数据中的关系发生变化，那么基于该数据的模型将失去部分预测能力。因此，将需要一个新模型。\n\n必须记住，用于构建预测模型的开发样本是历史数据，但产生的预测模型将部署在未来。在记录开发样本数据后的几个月或几年里，机构收集和存储数据的方式可能发生了重大变化。如果未来某些数据项将不可用，那么就不应该使用这些数据项来构建模型。因为模型将无法投入生产。模型所需的数据将无法可用。\n\
  \n过去可能从客户处获得净收入，而这正是开发样本数据中的内容。然而，由于客户有时很难记住净收入，营销部门决定切换为捕获总收入对客户更友好。如果使用净收入构建预测模型，那么将无法正确实现该模型，因为在收入捕获方式改变后，净收入将不再可用。\n\
  \n## 分析过程\n\n一旦确定了问题，并解决了文化、实现和数据问题，就可以开始考虑构建模型的分析过程了。这正是数据科学家的专业技能大显身手的地方。\n\n\
  在涉及构建预测模型的技术方面，数据科学家需要考虑一系列问题，如前一章所述。生成尽可能具有预测性的模型显然是关注点之一，但根据组织和监管要求，还需要考虑最终解决方案的复杂性、可解释性和透明度。以银行业为例，用于生成银行必须留存资本估计的预测模型受到金融监管机构的极端审查。模型构建者必须充分描述用于构建模型的分析过程，精确解释模型如何生成预测结果，然后强调模型可能存在的任何实质性缺陷。仅仅输出非常准确但无法解释的预测的“黑箱”解决方案是无法通过审核的。同样，在税收、医疗诊断和刑事调查等领域，领域专家通常倾向于他们能够理解的模型。\n\
  \n然而，如果我们重点转移到用于目标营销、用于约会网站选择匹配或构成语言翻译系统的模型上，那么用户对理解底层模型逻辑的兴趣要小得多。预测准确性是首要考虑因素。如果它有效，就有效，这就是全部了。\n\
  \n在选择开发哪种模型以及应用什么算法之前，数据科学家应该已经咨询业务部门。他们应该提出正确的问题，以确保交付的模型具有预测性、符合监管要求，并考虑了业务部门提出的任何其他问题或限制。\n\
  \n\n\n\n一旦分析过程完成并获得预测模型，就可以将其转移到其实施的领域。假设在项目的合适时机已经对模型实施给予了充分考虑，那么这个过程将会相对顺利。这是因为必要的软件和\
  \ IT 设施应该已经部署，并且运营人员已经接受了简报，介绍了模型上线后情况将发生什么变化。\n\n使用通过机器学习开发的模型来实现自动化决策过程是一项巨大的成就，特别是当这对于相关组织来说是一项新尝试时。然而，这并不是过程的终点。一旦模型上线，就需要对决策过程进行定期审查，以评估模型的预测效果如何，并确保继续应用正确的截断值和决策规则。\n\
  \n之所以需要监控，是因为由于构建模型所用的数据与所预测的结果之间的底层关系发生变化，模型的预测准确性往往随着时间的推移而下降。监控通常涉及生成一系列报告，显示模型预测的实际准确性如何。当模型准确性开始下降时，这表明是时候开发新模型了。\n\
  \n模型年龄的增长导致预测准确性下降是模型需要重新开发的主要原因，但预测模型的重新开发也出于其他原因。有时，法律或法规的变化意味着模型中的某些数据项不再可以使用。同样，新的数据源不断出现，有望构建出预测能力更强、更准确的模型。\n\
  \n进行定期模型监控的另一个原因是评估基于模型的决策如何影响人群中的不同群体。如果一家银行的营销部门想要针对具有特定地理人口统计特征的人群推出新型信用卡，那么对于银行来说，理解信用评分模型如何处理这类人群至关重要。银行最不希望看到的是：为新客户开展了巨大的营销活动，结果发现所有申请新卡的人都被拒绝了。\n\
  \n同样，如果模型涉及到对人们做出重大的生活决策，那么对模型进行监控以确保其显示的任何偏差都是可以接受的是明智的。如果人力资源部门使用模型来筛选职位申请者，并发现其拒绝的少数族裔或女性比例高于平均水平，那么将需要对此进行调查，并在必要时采取补救措施。\n\
  \n## 12. 大数据与机器学习之间的关系\n\n从大约 2010 年以来，“大数据”已成为一个通用术语，用于描述人们通过智能手机、网页浏览历史、社交媒体和购买行为产生的所有数据，以及组织持有的关于他们的任何其他信息。\n\
  \n为什么大数据与其他任何类型的数据不同？从某种意义上说，它们并没有区别；归根结底，一切都只是 0 和 1。然而，“大数据”一词倾向于应用于不同类型数据的大集合，这些数据通常是易变且多变的，人们很难使用传统的计算机硬件和软件对其进行分析。\n\
  \n此外，大数据通常包含某些特定类型的数据，这些数据直到最近才被广泛用于客户分析。特别是，大数据包括：\n\n*   **文本**。可以对人们写和说的内容进行分析，以识别他们正在讨论的话题以及表达的情感。如果某个产品在积极或消面的语境下被讨论，这可能预示某人是否会购买该产品。\n\
  *   **图像**。这涵盖了照片、视频，以及医学影像。机器学习的应用之一是利用扫描和 X 光片中识别出的特征来预测某人患特定疾病的概率。\n*   **（社交）网络数据**。关于人际关系以及他们认识谁的信息。网络数据包括人们拥有的连接数量和类型，以及有关连接个体的数据。如果你所有的朋友都是科幻迷，这很可能预示着你其中之一。\n\
  *   **地理空间**。由智能手机、汽车 GPS 系统和其他移动设备提供的关于人们位置和移动的信息。\n*   **生物识别**。从健身手环、智能手表等收集的关于血压、心率等的数据。\n\
  *   **产品（机器）生成**。从电视机到咖啡机，日常设备正在设计成可以在彼此之间以及通过互联网共享信息。如今，你的暖气设备、热水壶、洗衣机等都可以通过智能手机控制。“物联网”（IoT）概念仍在发展中，但它最终可能会提供大量数据，可以使用机器学习来推断人们的行为。\n\
  \n在 20 世纪 90 年代的“过去旧时光”，智能设备并不存在。那时很少有人有手机，互联网还处于起步阶段。关于人们或其活动的电子数据微乎其微。当时存在的数据通常仅限于少数地理人口统计特征，如地址、年龄、收入、性别等。如果涉及金融服务产品，可能还会由来自直销营销公司或信誉参考机构的数据进行补充（例如贷款和信用卡的欠款状态）。超市并不知道每个客户每周买了什么，保险公司不知道人们是如何开车的，而医疗服务部门则将大多数患者记录保存在纸质文件中。\n\
  \n那时数据科学家的生活相当简单，因为所有这些（非常有限的）电子数据通常以整齐的行和列格式（就像电子表格中看到的）存储。数据也是相对静态的。它们通常只以很低的频率并定期更新——通常在月底或年底。\n\
  \n在当今世界，数据的更新频率高得多，通常是实时的。此外，更多的是“自由格式”的非结构化数据，如语音、电子邮件、推文、博客、图片等。\n\n另一个因素是，这些数据很大程度上是独立于使用它们的组织生成的。这在许多方面都是问题。之一是，如果数据是由组织自身捕获或生成的，那么他们就可以控制数据的格式。他们还可以建立检查和控制措施以确保数据的准确性和完整。然而，如果数据是从外部源生成的，则无法保证数据是正确的。\n\
  \n外部来源的数据通常是“混乱的”。这需要大量工作来清理并将其转换为可用的格式。此外，可能对这些数据的稳定性和持续可用性产生担忧，如果这些数据成为组织核心分析和决策能力的一部分，就会构成业务风险。\n\
  \n这意味着，组织用于处理销售交易、维护客户账户记录和发票的传统计算机架构（硬件和软件），并不适用于存储和分析现在可用的所有新型不同类型的数据。因此，在过去的几年里，开发了一系列全新的、有趣的硬件和软件解决方案来处理这些新类型的数据。\n\
  \n特别是，现代大数据计算机系统非常擅长：\n\n\n\n\n\n## 大数据与处理技术\n\n*   **存储海量数据**：传统数据库以合理成本能够存储的数据量非常有限。新的数据存储方式允许廉价存储容量进行近乎无限的扩展。\n\
  *   **数据清洗与格式化**：多样化且混乱的数据在用于机器学习、管理报告或其他数据相关任务之前，需要被转换为标准格式。\n*   **极快速地处理数据**：大数据不仅仅是指数据量大。它需要被快速地处理和分析，才能发挥最大的作用。\n\
  \n传统计算机系统的问题不在于它们在理论上是否存在能够利用大数据所需的所需的处理操作的障碍，而是在实践中，它们执行这些操作的速度太慢、太繁琐且成本太昂贵。\n\n\
  新的数据存储和处理范式，例如 `Hadoop/MapReduce`，使得原本需要数周或数月才能完成的任务可以在几小时内完成，且成本仅为传统数据处理方法的一部分。`Hadoop`\
  \ 实现这一目标是将海量数据集存储在大型网络（集群）的廉价台式电脑上，例如你办公室或家里可能拥有的那种电脑。\n\n`MapReduce` 是编程语言的一种示例，它在计算机网络（如\
  \ `Hadoop cluster`）之间共享数据处理任务。集群中的每台电脑都被要求独立处理其所持有的数据。每台单独电脑的结果会被汇聚并合并，以提供最终答案。\n\
  \n考虑一家公司使用 `Hadoop` 在由数百台计算机组成的网络上存储其数十亿客户交易的详细信息。为了对交易信息进行总结（例如计算上一财年发生的所有交易的财务价值），`MapReduce`\
  \ 会要求每台单独计算汇总其持有的交易详情。然后，每台电脑将其结果反馈给一台主控制计算机，由该计算机相加各个结果以获得最终数字。\n\n从理论上讲，可以将数万台\
  \ PC 连接在一起，提供与现存最大的超级计算机相媲的巨大计算能力。如果你需要更多的处理能力，你只需要多买几台标准台式 PC 并将它们连接到网络即可。\n\n\
  `Hadoop` 以一套免费（开源）编程工具的形式提供，被许多公司作为其大数据解决方案的一部分使用。许多供应商还利用核心 `Hadoop` 软件开发了自自己的一套接口和支持工具，以提供定制化的产品服务。示例包括\
  \ `Cloudera`、`Hitachi Vantara`、`IBM`、`Microsoft`、`SAP` 和 `Teradata` 等。\n\n## 大数据与机器学习之间的关系\n\
  \n数据（无论“大”还是“小”）其本身没有内在价值。一个机构可能犯的一个大错误是认为，如果他们投资了如 `Hadoop` 这样的大规模存储系统并收集了关于人的每一个碎片数据，就会为他们的业务增加大量价值。然而，所有这些数据必须被转化为有用的东西才能产生益处。机器学习就是实现这一点的关键工具。数据需要经过处理，以识别数据中的显著特征和关系，并产生预测模型，根据过去发生过的事情告诉你关于人类行为的信息。\n\
  \n思考大数据与机器学习之间关系的一种良好方法是：数据是为机器学习过程提供原材料。对业务的实际利益来自于过程结束交付的预测模型、客户聚类或其他分析输出，而不是数据本身。\n\
  \n因此，人工智能、机器学习和大数据经常被并在一起讨论，但它们并不是一种对称的关系。你需要机器学习来充分利用大数据的价值，但你并不需要大数据也能有效使用机器学习。如果你只有关于几百人的几项信息，这就足够开始应用机器学习来完成诸如构建模型和进行预测、对客户进行聚类以及进行其他类型的数据分析等工作。\n\
  \n你拥有的数据越多越好，你的机器学习解决方案就会越好，但拥有 GB 或 TB 级的数据并不是实际机器学习的先决条件。\n\n## 13. 伦理、法律与 GDPR\n\
  \n机器学习和预测模型的使用引发了一些有趣的伦理问题。当它们被用于创建自动化决策系统，且这些系统在没有人类参与决策过程的情况下决定人们如何被对待时，这一点尤为真实。\n\
  \n随着自动化决策系统在我们生活的几乎每一个方面变得越来越普遍，我们实际上是在说不再拥有控制权。那些曾经处于权威地位的人（无论是决定给谁贷款的银行经理，还是决定治疗谁的医生）都已将控制权交给了计算机。\n\
  \n这是一个问题吗？如果能断言结果将总能为个人带来更好的产，那么许多人是可以接受的。然而，重要的是要意识到，许多（可能可能是大多数）组织正在为了自己的利益而使用机器学习。他们正努力实现自己的目标（例如利润最大化），而不是你的目标。产生的结果是否惠及这些决策的主体，并不是他们首要考虑的问题。\n\
  \n这意味着，我们作为一个社会成员，需要对预测模型的开发和部署方式感到放心，并且这符合我们对是非和恰当的认知。需要建立适当的平衡机制，以防止依赖机器学习的决策系统被滥用。\n\
  \n一个问题是，什么是“伦理使用”并不总是清晰明确的。关于数据和分析什么是伦理是不伦理，存在各种观点和意见。因此，需要哪些检查和控制是具有争议的。\n\n\n\n\
  \n\n从纯统计学的角度来看，婚姻状况、性别和年龄等因素可能与人们的工作表现（并由此决定录用还是解雇）相关。然而，从社会学的角度来看，允许预测模型基于此类数据来驱动决策，在伦理上是有疑的，而且在许多司法管辖区是违法的。\n\
  \n解决此类问题的一个非常简单且简单化的方案是确保防止某些数据项出现在某些类型的预测模型中，以确保法律合规。生成预测模型的算法被指导在机器学习过程中排除性别、种族和婚姻状况等数据。这本身没问题，但仅仅因为预测模型没有直接使用某些数据项，并不意味着该模型没有显示出不可接受的偏见。\n\
  \n保险业中的性别歧视就是一个很好的例子。众所周知的事实是，对于许多类型的保险，女性的风险确实低于男性。然而，在所有欧盟（EU）成员国，根据性别设定保费都是违法的。因此，保险公司在用于设定保费的理赔预测模型中未使用性别。但是，还有其他变量经常作为性别的代理。收入就是其中一种数据项。为什么呢？因为收入分配中存在性别偏见。即使在女性从事相同工作且基于性别的工资歧视违法的情况下，女性的平均收入仍低于男性。如果预测模型将收入作为预测变量，就会产生一种间接影响，这意味着女性受到的待遇与男性不同。结果，预测模型可能被设计成在预测能力上是次优的。这是为了确保在其他条件相同的情况下，它对具有相同特征的男性和女性生成相同的预测，从而符合法律。\n\
  \n预测模型应该符合相关的法律和监管要求——例如不显示性别偏见。然而，这并不是故事的结束。一个很容易犯的错误是认为，如果某事是合法的，那么它也一定是合伦的。诚然，伦理和法律之间确实存在一些重叠之处，但它们并非同一一物。良好的法律通常试图定义社会认为不可接受的行为；即不符合伦理的行为；但充其量，法律仅仅是伦理行为的通用概括，并且通常具有追溯性特征。\n\
  \n法律也倾向于解决过去发生的问题。它们通常不会在新的情况出现之前进行考虑。这意味着总会有某些特定法律未涵盖的情况，而且几乎总是存在漏洞，让那些心术不正的人能够规避法律以达到自己的目的。这就是人们在谈论“法律条文”与“法律精神”的区别时的含义。\n\
  \n好吧——所以一个机构的行为可能是合法的，但不符合伦理的，但一家关注底线最大化的企业为什么要担心这一点呢？一个原因是纯粹的自私。有大量证据表明，如果考虑长期利益，那么采用伦理行为准则会带来真正的底线收益。\n\
  \n在机器学习以及预测模型所使用的数据背景下考虑伦理问题的另一个原因是声誉受损的风险。如果公众决定他们不喜欢你的运营方式，认为你对待人们的方式不正，或者对某些群体存在不公平的歧视，那么这些情绪会极大地损害品牌价值。仅仅辩称你的预测模型在统计上是有效的且符合法律规定是不够的。如果被发现某个模型让退伍军人和儿童在医疗治疗的队列中靠后（尽管退伍军人或儿童并不是模型中的显性变量），那么你将对此面临挑战——即使使用该预测模型的决策过程在全人口衡量中产生了最优的患者结果。\n\
  \n考虑这种问题的另一种方式是，伦理考量应该驱动决策系统中的若干约束条件，这些条件在设计系统时需要被适当的考虑。\n\n机构应该采取什么措施将伦理视角融入到机器学习和自动化决策的使用中？遗憾的是，这个问题没有一个明确的答案。一个问题是伦理的主观性。它很大程度上是个个人问题。两个人对于什么构成可接受的行为可能持有相反但同样充分的意见。同样，不同的法律体系在处理个人数据以及机构如何使用这些数据方面有非常不同的方法。\n\
  \n在美国，涉及个人数据及其在自动化决策系统中的应用的起点非常符合功利主义路线。个人数据的存在是为了采集和使用，以实现组织目标的最大化，例如利润最大化或成本最小化。如果使用特定类型的数据存在问题，或者对特定群体存在不可接受的偏见，就会制定立法来解决该特定问题。\n\
  \n这与欧盟（EU）内部国家采用的方法非常不同。欧盟公民对谁可以持有他们的数据以及如何使用数据拥有控制权。如果他们不想让数据用于特定用途，那就是他们的决定，即使这会导致次优的结果。\n\
  \n这两种不同的观点是为什么像 Google 和 Facebook 这样的美国公司在欧盟国家如何收集和使用个人数据方面难以与监管机构达成共识的原因之一。\n\n\
  另一个问题是，伦理考量通常是特定于问题和领域的。在一种情况下是可以接受的，在另一种情况下则是不可接受的。正如我们已经讨论过的，大多数人可能对宗教和性取向等敏感个人信息用于诊断医疗状况是可以接受的。然而，使用这些相同的数据项来决定谁可以或无法获得贷款则是一个可疑得多的命题。\n\
  \n鉴于这些问题的复杂性，自动化决策系统的构建者在项目设计阶段进行伦理风险评估是一种良好的做法。此外，许多机构现在正建立伦理委员会以参与治理过程。伦理委员会在机器学习项目的关键节点介入，并就系统将如何影响人们提出必须提出的困难问题。然后，伦理委员会会给出意见，判断他们认为这种过程是否符合组织的伦理立场，如果不符合，则详细说明实现该目标需要进行哪些修改。这一过程中一个非常简单的起点就是问这样一个问题：“我是否希望这种决策方式被应用于我的家庭成员身上？”\n\
  \n在评估与自动化决策系统相关的伦理风险时，有三个主要方面需要考虑：\n\n1.受益者。谁将从所做的决策中获益？决策者牺牲个人利益获得的收益越多，该决策所代表的伦理风险越大。雇主在决定雇用谁时，其决策纯粹是为了自己的利益。提供工作并不是基于它带给员工的利益。\n\
  \n\n\n\n\n## 1. 数据不可变性\n人天生具有某些特征，这些特征是无法改变的。如果根据年龄和族裔等因素做出决策，那么这比基于人们生活方式选择产生的数据要争议得多，因为后者更具动态性和易变性。例如，人们喜欢的音乐或它们在电视上看的内容。\n\
  \n## 2. 影响（重要性）\n一个决策将产生什么影响？关于癌症治疗的生死决定比决定是否给某人发送一张 10% 折的冷冻披萨优惠券等琐事要重要得多。\n\n\
  将这三个考虑因素结合起来，当使用不可变数据做出高影响的决策，且纯粹是为了决策者的利益时，就会产生最大的伦理风险。这需要格外确保决策系统是公平的、不显示出不可接受的偏见，从而使决策者免受行为不当的指控。我并不是说机构不能使用高影响的不可变数据来实现自己的目的，而是他们需要谨慎，并准备好应对对他们使用数据方式的任何质疑。\n\
  \n如果一个机构发现自己正在使用预测模型来做出潜在的“高风险”伦理决策，那么它应该怎么办？答案是采取以下缓解措施：\n\n1. **尝试识别风险群体。** 这样做的方法是为女性、少数族裔、儿童等群体生成单独的评分分布报告。这样就可以观察结果评分中是否存在偏见；即哪些群体倾向于获得低于平均水平的分，因此与更广泛的人群相比将受到不利对待。\n\
  2. **对于得分低于人群平均水平的群体，应该使用限制条件和覆盖规则来确保他们获得公平的对待。** 同样，可能需要为高风险群体设置不同的阈值。\n3. **在决策系统上线后继续监控状况。**\
  \ 定期审查关键群体的评分概况和决策规则。根据需要对阈值、限制条件和覆盖规则进行微调。\n\n为了说明这种方法，让我们考虑一个招聘场景。考虑一个用于决定聘用谁的预测模型。模型的高分表示该人可能在职位上取得成功，低分则较之。一种担忧可能是，老年男性或有幼童的人受到了不公平的对待（如果该模型在该地区使用，可能会违反欧盟法律）。这并不是说没有证据表明老年男性或有小孩的人在工作中的表现更差，且比其他人更不值得雇用，而是说区别对待这些群体在社会上是不可接受的。一个伦理上有问题的系统是指使用单一的预测模型并应用单一阈值分数来决定聘用谁。\n\
  \n一种更稳健的方法是从为老年男性和有小孩的人生成单独的评分分布开始。然后将这些与所有潜在聘用者的评分分布进行比较。如有必要，应用单独的阈值。这是为了确保这两个群体中获得工作的比例与人群其他部分相同。\n\
  \n另一种类似的方法是为每个群体构建单独的模型。为普通人群建立一个模型，为老年人建立一个，为有幼童的人建立另一个。然后对每个模型应用不同的阈值规则，以确保实现一致且协调的决策策略。\n\
  \n## 伦理框架与监管格局\n到目前为止，本章重点关注开发一个处理个人数据的伦理框架，以及它如何在通用环境中应用；即我们讨论的内容对于世界上任何地方的各种情况都具有普遍适用性。思考这些问题将帮助你以道德适当的方式与个人打交道（这意味着你晚上可以睡得安稳）。然而，正如本章早期提到的，全球各国政府和监管机构正在引入更严格的法律和监管控制，以限制机构收集、存储和使用个人数据的方式。因此，无论一个机构认为自己有多伦理，它也必须遵守其运营所在地区的所有相关法律法规。\n\
  \n关于个人数据的使用及其在自动化决策中使用的法律在许多国家已存在数十年，但在范围和应用上存在很大。\n\n### 美国\n在美国，监管针对性地指向个人数据的特定用途。`1974\
  \ 年平等信贷机会法`（`ECOA`）要求贷款人解释其自动化信用评分系统为何拒绝某些人的贷款申请。`1996 年健康保险可携带性与责任法案`（`HIPAA`）对人们健康记录的使用提供了保护。《儿童在线隐私保护法案》（`COPPA`）涉及有关\
  \ 13 岁以下儿童的数据等。在美国，没有专门针对收集个人数据或此类数据在自动化决策过程中如何使用的总括性立法。\n\n### 欧盟\n对于组成欧盟的 28 个国家（其中包括世界前\
  \ 10 大经济体中的 4 个，总人口超过 5 亿），情况则完全不同。多年来，他们对个人数据的监管及其使用方法采取了更为全面的方法。可以争论的是，世界上任何地方颁布的最重要的数据保护立法已\
  \ 2018 年 5 月 25 日在所有欧盟国家生效。《通用数据保护条例》（`GDPR`）对机构在如何收集、管理和处理人们的个人信息方面负有重大的责任。\n\n\
  `GDPR` 适用于所有在欧盟运营的机构，即使它们的业务基地在其他地方。硅谷的科技巨头只要在任何欧盟成员国开展业务，就没有所谓的退出机制（opt out）。\n\
  \n有人说法律是呆脑的驴，但如果你忽视了 `GDPR`，它会踢你一脚。未能遵守 `GDPR` 的机构将根据其发生的每项违规行为，面临最高达其发生违规行为年度全球营业额（而非利润）\
  \ 4% 的罚款。即使你不住在欧盟，花一点时间深入了解它也是值得的，因为揭示了许多其他国家和管辖区数据保护立法的发展方向。\n\n`GDPR` 采取了基于权利的方法。支撑它的基石是个人对自己数据的所有权。个人有权决定谁可以访问其数据以及如何使用这些数据。关于我的数据是我的，它是我身份和特质的一部分。除非我许可，否则你没有权利持有或使用我的数据。未经我的许可存储我的数据或对我做出决定是非法的。我还有权改变我的主意。我今天可以允许你访问我的数据，但如果我不再让你使用它，你必须停止并删除关于我的信息。\n\
  \n该立法也是基于原则的。这意味着在合规方面需要做什么方面，它并不是完全是规定性的。其目标是鼓励遵守法律精神，而不仅仅是法律条文。\n\n另一个需要考虑的因素是\
  \ `GDPR` 的焦点完全落在个人身上。它没有考虑机构为了合规而承担的成本。在理想情况下，企业辩称“如果不以某种方式处理数据将在经济上不可行或可能导致其破产”的范围非常有限。\n\
  \n\n\n\n\nGDPR（通用数据保护条例）涵盖了与个人数据相关的广泛问题，并适用于所有对活体个人的自动化决策和画像分析。在机器学习/人工智能背景下，特别相关的四个领域是：\n\
  \n1.  在收集或使用某人的个人数据之前，需要获得其**明确同意**。这种同意不能通过推断获得，也不能是“默认同意”。\n2.  除非当事人已同意将其数据用于此类目的的自动化决策，否则不允许使用自动化决策过程对个人做出决策，且该过程会对其产生法律或类似重大的影响。这是在对存储数据表示同意之外的额外要求。其主要的例外是：为了允许法律合同的签署所必需的自动化处理。\n\
  3.  个人有权获得有关如何得出自动化决策以及该决策结果的解释。这符合 GDPR 中更通用的要求，即组织必须向个人提供必要信息，以确保其数据的处理公平透明。\n\
  4.  自动化决策系统不得表现出不公平的歧视；即根据人的种族、性取向等对人们进行区别对待。\n\n### 获取明确同意\n要获得明确同意，需要建立适当的审批机制。如果我们讨论的是对员工做出决策，则需要在其劳动合同中包含适当条款。对于消费者，则需要通过人员勾选相关复选框或类似方式提供许可。\n\
  \n### 重大影响\n对于第 2 点，关键词是“重大”。如果一项决策将对个人产生显著影响，那么该个人就有权要求对该决策进行人工审查。法律明确规定，这种审查必须是完全独立的，并由有权做出与系统决策不同判断的人员进行。这不能仅仅是让行政人员对原始决策进行“盖章通过”。\n\
  \n使这一项在实践中难以应用的原因是，目前对“重大”尚没有公认的定义。也许最重要的是，对某些人可能微不足道的事情，对另一些人可能非常重大，即使只占系统处理人数中的极小部分。不能理所当然某些类型的决策不会对人们产生重大影响——这必须逐案分析。想象一家超市连锁决定采取差异化定价策略：对于那些他们认为无法或不愿在其他地方购物的客户，其杂货费用比那些会到处比价的灵活客户贵\
  \ 5%。对于大多数客户来说，这只不过是轻微的不便，但对于处于贫困线以上的人来说，这可能对他们的生活质量产生非常真实的影响。这在实践中的意味着，除非有充分的相反证据，否则始终从“所有决策都可能是重大决策”这一立场出发是审慎的。\n\
  \n### 解释权\n关于第 3 点——获得关于如何得出决策解释的权利——这需要理解预测模型是如何使用的。例如，为什么某人的保费是某个金额，或者为什么他们的贷款申请被拒绝。至少，组织需要向进行此类查询的个人告知：\n\
  \n*   决策过程中使用了哪些数据项。例如：“在评估您的新手机合同申请时，我们使用了有关您的年龄、收入和婚姻状况的信息，连同有关您的信用历史的信息来做出决策。”\n\
  *   这些数据项的来源。这可能是通过应用程序或在线表单直接从个人处获取，也可以是公开信息（如选民记录），或他们已许可其他机构共享的信息（如社交媒体平台或信信参考机构）。\n\
  *   哪些数据项对决策做出了贡献以及是如何贡献的。在决定是否接受某人的手机合同申请时，可能会说决策是基于信用评分的。评分使用了个人的信用历史信息，逾期还款次数和近程度会对评分产生负面影响。该申请人去年错过了两次抵押贷款还款，导致信用较低。因此，其新合同申请被拒绝。\n\
  \n在某些情况下，可能还需要对所有单个模型参数提供完整的技术解释，尽管在写作时，需要此类要求的具体情况尚不清楚。人们可能认为这只会在少数进入法院的特定案例中被要求，而不是在客户每次查询时都提供的内容。然而，在\
  \ GDPR 下，这一点很明确：“复杂性不能作为未能向数据主体提供信息的借口。”在英国，信息专专员办公室（ICO）对模型的可解释性发表了以下评论：\n\n> “因此，大数据组织在依赖无法用人类可理解的术语进行合理化的机器学习决策之前，需要谨慎。如果一家保险公司无法运作导致其在线申请系统拒绝某些人的复杂细微之处（无论这些理由多么合理），它又如何希望向个人解释这一点呢？”\n\
  \n### 挑战与合规\n这意味着，使用深度学习和其他“黑箱”类型模型来对人们做出决策存在潜在的障碍，除非同时也存在适当的解释机制。开发此类机制是可能的，但这需要额外的时间和成本。\n\
  \n另一个需要考虑的因素是个人可以改变主意。他们曾经可能许可将其数据用于某些目的，但该许可可以在以后撤回。同样，“不被遗忘权”要求组织在人员请求时删除个人数据。因此，需要建立一个处理同意变更和个人数据删除的流程。\n\
  \n最后是歧视问题。所有的决策系统（自动或手动的）都存在歧视——这是它们工作的本质。问题在于是否发生了不公平的歧视。GDPR 明确规定，种族、性取向等特定项目通常不能纳入自动化决策系统。然而，人们还必须像在本章之前讨论的那样，能够识别并纠正间接偏见。\n\
  \n综合考虑这些因素，在实践中意味着，涉及个人数据时，机器学习和高级分析的“旧野西部”时代已经基本结束了。那种让数据科学家为业务职能部门创建一个“快速草率”的预测模型供使用的做法已几乎不复存在——至少在欧盟国家是如此。\n\
  \n\n\n\n*   并不期望完全消除人类专业知识。必须有一个经过适当培训的运营职能，在需要时能够手动处理决策。\n*   建立适当的治理和审计流程，以管理并对其决策系统提供监督。这包括如前文所述的，开发相关方法来识别和缓解随之而产生的风险。\n\
  \n从项目管理的角度来看，对治理和人工干预的要求会对开发和维护自动化决策系统的成本产生重大影响。如果你正在考虑在组织内部使用自动化，那么在项目开始之前进行的成本效益分析中，需要将这些额外开销包含在内。\n\
  \n在运营方面，如果你使用预测模型来执行诸如“决定解雇谁”这类工作，那么你就需要那些能够审查模型所使用的数据、并在必要时覆盖原始决策的人员。在保险和信贷授予等领域，这意味着你需要留住经验丰富的核保师，他们可以挑战组织自动化核保系统所做出的决策。此外，还需要一套流程来处理客户对自动化决策的查询，并根据法律要求向他们提供相关信息。\n\
  \n## 14. 机器学习的前沿\n\n机器学习是一个令人兴奋且不断发展的学科，它正受到三个主要领域新进展的推动：\n\n1.  **模型与算法**。新的机器学习方法不断开发出来。一个研究方向是寻找新类型的模型。另一个一个方向则是改进现有的生成评分卡、决策树、神经网络等的算法，以提高此类类型模型的预测准确性。\n\
  2.  **数据**。预测模型和其他 AI 应用的优劣完全取决于构建它们时使用的数据。更多/更好的数据会带来更好的解决方案。这就是为什么“大数据”和机器学习如此紧密相关的原因之一。\n\
  3.  **系统与软件**。用于开发和实施基于自动机器学习解决方案的系统的改进至关重要，因为解决方案部署得越快，收益就能越早实现。\n\n让我们从讨论机器学习的模型和算法方面开始。评分卡、决策树和神经网络可能是目前应用最广泛的预测模型类型。然而，如果你和硅谷的那些年轻人聊天，他们可能会笑笑然后告诉你，这些类型的模型已经有些“老旧”了——决策树简直是\
  \ 1980 年代的东西了！现在有这么多更好的预测模型类型问世……\n\n从某种意义上说，这是正确的。评分卡、决策树和神经网络确实不是新事物。事实同样是，平均而言，更新类型的预测模型（如深度神经网络、支持向量机和集成学习）产生了更准确的预测，特别是在需要复杂决策的领域。\n\
  \n评分卡和决策树最早于 20 世纪 50 年代和 60 年代投入商业使用。在那个时代，典型的电脑有大办公桌那么大，计算能力不到今天基础智能手机的 1%。因此，这些简单的预测模型可以相对容易地开发和实施。如今计算机能力已不再是一个大问题，但评分卡和决策树等简单模型仍然非常受欢迎，原因如下：\n\
  \n*   它们在本质上是“白盒”。非常容易理解是如何得出评分并此得出对某人的预测的。同样，很容易看出哪些数据项对评分的贡献最大，哪些数据项较不重要。\n* \
  \  它们易于编码。实现它们不需要专业软件。如果资源紧张，你可以将评分卡或决策树作为一个小型 IT 项目来实现，而无需购买额外的硬件/软件，也不需要雇佣非常昂贵的数据科学家。\n\
  *   它们仍然能产生相当不错的预测，即使不是最好的。某些预测模型比简单的评分卡或决策树复杂成千上万。然而，即使是最先进的预测模型，其提供的提升通常也仅比简单的评分卡或决策树多几个百分，有时完全没有提升。\n\
  \n我想明确的是，对于组织来说，巨大的胜利在于首先基于机器学习跨越到使用自动化决策。使用可用最先进方法所带来的增量收益通常是微乎其微的。这在业务问题简单且能够精确简洁地表达时尤为如此，例如评估贷款的违约风险或某人对营销活动响应的可能性。而那些更复杂、更混乱的问题，如人脸识别、语言翻译和自动驾驶，从深度神经网络等先进的机器学习形式中获益最多。\n\
  \n如果你的组织目前没有使用机器学习，那么开发一些可以集成到现有决策基础设施中的简单预测模型，将让你获得大部分收益。那些通常需要特殊硬件和/或软件的高端技术会提供更大的收益，但不是巨大的收益。因此，不要犹豫。80/20\
  \ 原则适用。你将通过 20% 的精力获得 80% 的收益。\n\n同样的情况，如果你无法让一个简单的预测模型运行，那么仅仅使用更复杂的方法或购买昂贵的硬件/软件不太可能解决底层问题；即，机器学习项目的失败几乎总是由于问题定义错误、底层数据或组织问题。问题不太可能是由于所开发的预测模型类型导致的。\n\
  \n好了。这是坚持使用评分卡和决策树等简单模型的论据。然而，如果一个组织是使用机器学习开发的 AI 应用的成熟用户，且其预测模型每年负责价值数十亿美元的决策，那么就会有一种动力去拥有最优秀（最准确）的模型——而且这是之有据的。对于一个每年支持十亿美元决策的模型来说，性能仅\
  \ 0.1% 的提升就等同于 100 万美元的收益。在这种情况下，雇佣一个数据科学家团队不断挑战和改进组织所使用的模型是完全合理的。\n\n目前使用的最先进预测模型形式是集成模型，它们基于复杂的（深度）神经网络。在集成中，不是单一的评分卡、决策树或神经网络模型，而是构建了数百个甚至数千个不同的模型。每个模型都使用不同的数据样本和/或不同的算法来确定模型的参数。因此，每个模型做出预测的方式略有不同。每个模型生成的评分通常相同或相似，但有时它们会产生分歧；即，某些模型会对某些案例给出高分，而其他模型会对相同案例给出低得多的分，反之亦然。\n\
  \n使用集成模型有点像由专家委员会做出决策，而不是由单一专家做出决策。委员会方法优于单一专家方法的原因有两点：\n\n\n\n\n\n## 集成模型与决策\n\n\
  1. 如果其中一个专家拥有其他专家不具备的专业知识，那么这种知识就可以引入决策过程。\n2. 某些专家偶尔可能会做出糟糕的决策。其他专家将利用他们的集体知识来覆盖（通过投票否决）这些情况。\n\
  \n就像委员会一样，构成集成模型的某些模型特别擅长预测某些类型案例的结果。如果任何模型在某些领域表现较弱（产生较差的预测），它们就会被其他模型覆盖。\n\n一旦构建完成，集成模型的工作方式非常直观。每个模型的得分都用于做出决策。然后通过简单的多数投票来做出最终决定。如果我们回到之前讨论的心脏病评分模型，想象一下不是单个评分表，而是构建了一千份不同的评分表。原始的决策规则是，如果某人的得分达到\
  \ 521 分以上则邀请其进行检查。在集成模型中，如果至少有 501 个独立模型生成的分为 `521` 或以上，那么决策就是邀请。\n\n集成模型比单模型好在多少？有时完全没有！然而，根据我的经验，集成模型比单模型好\
  \ 5-10% 并不罕见。如果一家保险公司发现，使用决策树导致在相同的承保金额下，理赔金额较其之前的人工流程减少了 `$40m`，那么转向集成方法可以合理地预期将额外提供\
  \ `$2-4m` 的获收益。\n\n如果你感兴趣的仅仅是原始预测准确率，那么集成模型是你的选择。然而，如果对你来说，能够解释模型如何得出特定的预测结果非常重要，那么在选择集成路线之前，你可能需要仔细考虑，因为解决方案将比单模型方法复杂得多，也更难理解。\n\
  \n## 数据的重要性\n\n现在让我们来思考数据。通过阅读关于机器学习的学术文献，我大胆推测，其中 95% 或更多的内容是关于算法的；即对前沿数学方法的非常的技术讨论，这些方法可以从给定的数据集中榨出更多一点预测准确率。然而在实践中，当提高预测模型的准确性时，数据才是王道。\n\
  \n在构建预测模型的新算法和拥有更多/更好的数据之间进行选择时，数据总是胜出的。换句话说，使用大量高质量数据构建的非常简单的预测模型，其性能几乎总是优于使用少量低质量数据构建的更先进的方法。如果你真的想从你的预测模型中获得更多价值，那么改进用于构建模型的数据质量并寻找新的、更好的数据源，应该是你的任务列表上的首位。\n\
  \n在大数据的早期，当数据存储成本在短时间内急剧下降时，先驱者中存在着“存储并分析一切”的数据哲学。其核心信息是，每个组织都应该收集和分析它所能获得的所有数据。那时，有很多关于需要投资诸如\
  \ `Hadoop` 等大规模存储系统的讨论。这是为了让组织能够存储他们所接触到的所有数据，以便产生可能最好的预测模型，从而获得竞争优势。然而，产生的数据量逐年增加，且没有任何减缓的迹象。事实上，数据量的增长速度远快于数据存储成本的下降速度。\n\
  \n这意味着拥有所有可用数据的益处在某种程度上被存储和分析所有数据的成本所抵消了。正如之前讨论的，所有数据中只有一小部分实际上出现在预测模型中并被用于做出预测；即一旦你知道哪些类型的数据可以预测人们将如何行为，你就可以丢弃大部分数据，因为你不需要它们。继续维护巨大的“低价值”数据数据库并不是一种高效的资源利用方式。如今，数据正向数据存储和聚合移动，特别是在涉及外部数据和通用数据时。如果数据由不同的组织提供的十个应用，那么让每个组织都去收集和管理这些数据是非常浪费时间的。\n\
  \n如果你看看 `Facebook`、`Google`、`Experian` 和 `Equifax` 等公司，这正是他们正在做的。他们进行对数据的收集、格式化和总结，然后将其出售。通过这种方式，他们不需要收集海量数据。\n\
  \n## IT 系统与软件开发\n\n机器学习发展的第三大驱动力是 IT 系统和软件。随着个人数据量的增长以及数据变化频率的增加，许多行业模型开发之间的周期已经缩短。\n\
  \n开发和实施预测模型的传统范式是将这两个部分分开；即先开发你的模型，然后实施它们。在开发阶段，数据科学家花费几天、几周甚至几个月的时间来收集数据并进行构建模型所需的统计分析。当该部分完成后，还有一项工作是在生产环境中对模型进行编码，测试模型是否有效，然后将其投入运行使用。\n\
  \n在许多（可能是大多数）行业中，这种预测模型方法仍然被应用并且通常效果良好，这至少是因为模型在开发后必须通过内部和外部审计，并接受监管审查才能投入使用。无论法律如何规定，建立一个稳健的模型治理结构都是重要的。因为如果你的整个业务都依赖于做出正确的决策，而你犯错了，那么对底线的影响可能是巨大的。\n\
  \n对于银行和保险业用于确定需要留存多少资本的风险模型^([71]](#filepos436737)，从预测建模项目启动到模型在公司内部实施可能需要一年或更长时间。模型的每个方面都必须充分记录，并在监管机构批准模型符合使用之前，需要经过讨论、反馈和进一步分析的循环。银行监管机构在模型经过独立专家的全面审查之前，甚至不会考虑审查。这花费的时间可能与最初的模型构建过程一样甚至更长。\n\
  \n然而在其他领域，例如互联网营销，情况要快得多。数据以及数据中的关系变化频繁，有些甚至是实时的。\n\n\n\n\n\n# 数据库内置机器学习系统\n\n这些“数据库内置”系统将数据流传输到机器学习工具，而无需先提取数据，极大地缩短了收集数据样本、构建预测模型以及随后将这些模型投入运行的时间。\n\
  \n一旦配置了数据库内置系统，模型就可以自动重新开发和部署。在理论上，每当有新数据可用时，就可以构建出一个全新的更新模型——系统会从它处理的每一个新案例中学习。新模型以分钟为单位进行开发和部署。因此，数据科学家无法参与到每一个构建的模型的细节中。相反，数据科学家的角色是成为设计更广泛系统的团队的一部分。特别是，他们负责理解输入系统的数据，以及这些数据如何映射到系统需要创建预测模型的业务问题上。\n\
  \n在系统上线后，软件会为数据科学家提供一个仪表板，报告整个系统的状态。例如，系统内模型的运行性能如何、模型性能随时间的变化情况、输入分析过程的数据发生什么变化等。\n\
  \n只有在出现问题或需要向系统中加入某些新功能时，数据科学家本人才会参与细节工作。如果模型性能出现意外下降，数据科学家将需要调查并找出原因。他们将采取补救措施来纠正问题，并将系统恢复到最佳运行状态。\n\
  \n自学习设备和自主机器人也采用了类似的方法。它们每次执行任务时，都会收集有关该事件的数据。驱动其活动的预测模型会利用这些额外数据进行自动优化。通过这种方式，随着可用数据的增加，底层模型的精度也随之提高。\n\
  \n一些新型机器学习软件的进一步重点是中间工具，这些工具旨在为非技术业务用户与机器学习所需的底层数据和算法之间提供更好的接口。\n\n这些工具中最先进的尝试取代传统上由数据科学家承担的任务。它们可以分析并准备来自不同来源的数据，应用一系列算法，并以易于理解的方式将结果呈现给非技术用户，而无需任何公式或等式。特别是，软件尝试以一种符合业务逻辑的语境化方式呈现结果，而不是提供数据科学家所习惯的那种更正式的统计视角。\n\
  \n这种方法的一个典型例子是 IBM 通过其 `Watson Analytics Software` 所采用的方法。最初版本的 `Watson` 曾在美国著名的知识问答节目《危险边缘》（Jeopardy）中击败了多名人类选手。`Watson`\
  \ 现在已演变为一种商业产品。在后台，该软件使用非常复杂的机器学习算法从各种不同的数据源中提取信息。软件的前端设计目标是经理和其他业务用户，而不是数据科学家。\n\
  \n其最终结果是，当提供合适的数据时，可以在几小时甚至几分钟内向业务用户展示关于客户行为的新洞察和理解，而无需在过程中涉及技术专家。\n\n## 我什么时候可以买到自动驾驶汽车？\n\
  \n别担心。我确定你很快就能去当地经销商那里买一辆，而且有些人会认为你已经可以买到了。然而，如果你指的是全自动驾驶车辆，即你视障的奶奶可以停在车库里并开到她任何想去的地方，那么时间可能比所有媒体关于自动驾驶汽车的报道描述要长得多。\n\
  \n对于某些人来说，21 世纪的自动驾驶汽车就像 20 世纪的登月运动一样。这是一项艰大的技术挑战，需要十年或更长时间的数十亿美元投资。成功将标志着我们通过人工手段复制和超越人类能力的一个重要里程碑。就像登月一样，道路上还有许多需要克服的挑战和其中的许多步骤。能够将火箭发射到太空或将卫星送入轨道是有用的，但这并不代表具备了把人类送到月球上的资格。这是一个更宏大的挑战。\n\
  \n最近我突然意识到，一个困扰我很久的问题是：“所有的自动驾驶汽车都在哪里？”在我最近寻找新车时访问的经销商处，似乎没有人提到过它们。\n\n我记得多年前（如果不是\
  \ 2010 年更早的话）读到过自动驾驶汽车几乎已经在这里了。我脑海中浮现出这样一句话：“想象我们将继续像现在这样开车简直太疯狂了——在 10 到 20 年后，我们仍然得坐在方向盘后面……”如果你阅读了主流媒体以及汽车制造商和科技巨头们发布的新稿，你可能会认为全自动驾驶汽车已经准备就绪，这也是可以理解的。只有政府里的那些守旧派在阻碍这些事情。\n\
  \n在讨论为什么我视障的奶奶可能在 2019/20 年无法买到全自动（`Stage 5 autonomy`）汽车，并且可能在之后的十年或更长时间内也买不到，一个值得问自己的极佳问题是：“所有的无人驾驶列车（同样的船只）都在哪里？”无疑，在轨道上往返比在公路上或在城市交通中行驶要简单得多？实际上，有几条无人驾驶列车系统在运行，但世界上只有极小比例的列车是全自动化的。那些自动化的通常是在小型、控良好的环境中运行的局部交通和/或地下系统，而不是在全国旅行的城际列车。\n\
  \n为什么大多数（如果不是全部）列车没有全自动？这个问题没有单一或简单的答案。这部分是因为技术，部分与经济有关。工会、公众情绪以及政府和立法也发挥了作用。可以说，技术问题是容易的部分。所有其他事情让这些事变得困难。\n\
  \n真正自动汽车的测试是，任何人都可以买一辆，而对他们的身份或去向没有任何限制。能够在高速路上脱手行驶几英里，或者在几个大城市的中心运行自动驾驶出租车，并没有真正通过测试。事实上，当涉及到全自动驾驶汽车时，答案是技术还不够好。它正在进步，但还没有到位。如果我们回到登月的类比，那么自动驾驶技术可能正处于低地球轨道阶段。虽然取得了良好的进展，但还有很长的路要走。\n\
  \n\n\n\n\n请不要误会，我并不是说你以后在某个时刻无法买到全自动驾驶汽车，我也认为当你能买到时那将是非常棒的，但还需要很一段时间。炒作程度超过了现实。我们在实践中看到的是自动驾驶功能稳步增加的汽车，从自动刹车、自动停车和车道辅助开始，更复杂的功能不断涌现。然而，要实现任何人、任何时间、任何地点的全自动无人驾驶运输，还有一大堆细碎的问题仍在解决中，我指的不是经常被提到的“推车或孩子”的困境，而是：在交通堵塞时进行非法\
  \ U 回弯（我们都这么做过！）、驶入迎向车流、避让紧急服务车辆、在单车道道路上超越行驶缓慢的拖拉机，以及知道何时必须开上路缘/人行道。这些只是世界各地人类驾驶员每天必须做的几件事。他们做这些事情并不是无故的。有时候，你必须爬上路缘或在技术上违法的情况下超车，否则你就会被后面几十个愤怒按喇叭的司机困住。同行司机的一个手势就能让你知道现在并入是安全的，即使看起来并不安全。至于那些认为只要我们从道路上移除人类驾驶员，这些问题都会得到解决的人——那简直是独角兽的幻想世界。要让美国人放弃驾驶权的挑战，会让撤销第二修正案看起来像是一场野餐一样简单。\n\
  \n最后，谁能判定自动驾驶汽车就是自动驾驶汽车呢？难道没有某些独立的官方框架和测试流程，车辆必须通过才能声称其汽车是自动驾驶的吗？如果我必须通过驾驶考试，那么无人驾驶汽车也应该如此。许多政府正在研究这些事情，但它们仍处于婴儿阶段。\n\
  \n好了，好了——对自动驾驶汽车的抱怨够了。这对于像这样的一本书有什么关系呢？嗯，这一章原本的重点将是：“避开炒作，识别机遇。”我想写关于机器学习和人工智能改变整个社会的所有有趣方式。这很重要，因为社会运作方式的变化既产生了威胁，也产生了机遇。新的商业途径被打开了，而旧的办事方式变成了重复性苦劳动和缓慢、手动、低效流程的遥远记忆。没有人希望发生在柯达（Kodak）和百老视（Blockbuster）身上的事情发生在自己身上。要么适应，要么死亡。\n\
  \n然而，你必须像关注机遇一样，意识到风险、障碍和阻碍。技术之所以被称为“尖端前沿”是有原因的。每一个新技术的成功案例背后都有几十次失败，但我们总是给予成功更多的关注，并将失败抛在脑后。有一句俗话说：“从他人的错误中学习的人是智者。”然而，当我在亚马逊上搜索“商业失败”书籍时，返回的结果少于搜索“商业成功”时返回数量的\
  \ 5%。\n\n我们对成功和失败投入的关注程度不同，往往转化为对新技术将如何影响我们的不现实预期。自动驾驶汽车是这种效应的典型范例。它们展示了硅谷的过度乐观以及经常发生的对新技术的过度炒作。虚拟现实和可穿戴技术是另外两个例子，现在进度已经更靠后一点。最初被疯狂炒作，并没有统治世界，但它们确实有一些非常实用的现实应用。\n\
  \n事实上，大多数新技术都遵循这条路径。技术从长期来看通常被证明是有用的，但很少能达到技术传教士在技术最初构想时所建议的高度。如果你想对实践中的过度炒作效应有一个概括性的了解，那么我再推荐不过高特技术轮回曲线（Gartner\
  \ Hype Cycle）了。这一原理也被马拉拉法则（Amara's Law）所捕捉：\n\n> “我们倾向于高估技术的短期影响，而低估其长期影响。”\n\n\
  2012 年，高特报告称自动驾驶技术距离成熟还有 5-10 年。五年后的 2017 年，这一数字被上调至 10 年以上。\n\n关于 AI 技术炒作的另一个更通用的例子，是对未来几十年由于\
  \ AI 驱动自动化将失去的工作数量的估计。不要错，AI 是一项破坏性技术。许多人将因此失去工作或不得不适应不同的工作方式，但它不会取代我们所做的一切——至少在未来\
  \ 10-20 年内不会。\n\n2013 年最具影响力的研究将因自动化而面临高失业风险的工作比例定为 47%。该研究估计，到 2030-2035 年左右，美国目前由人类完成的工作几乎一半将由机器完成。对其他先进经济体（如英国和德国）的估计也相似。随着时间的推移，这一估计被下调了。2017\
  \ 年，普华永（PwC）建议上限为 38%。经合组织（OECD）的一项综合研究引数字 2018 年仅为 10%，这还没有考虑到支持这些新技术将创造的所有额外工作。这仍然是一个很大的影响，但比最初讨论的要小得多。如果你将这些工作损失分散在\
  \ 20 年内，那么相当于每年丢失 200 份工作中的一份——这还没有考虑到将产生的新工作。\n\n综合这一切，通常规则仍然适用。从业务角度来看，AI 与任何技术发展并无区别。你需要评估其影响，并对基于\
  \ AI 的技术何时、何地以及如何变得有用做出判断。不要盲目跟从。仅仅因为其他人都说他们这样做，并不意味着这对你来说是正确的。当然，你不能把头埋进沙子里。你应该主动寻求新想法和不同的工作方式，但要对人工智能和机器学习可以增加的价值做出自己的评估。此外，不要依赖那些向你推销解决方案的有益第三方来为你量化收益。\n\
  \n几乎每天，我都会收到数据科学公司的邮件，提议彻底变革我的 IT 系统、自动化我的流程并增强我的数据分析能力。我该如何判断哪些是能为我提供价值的，哪些只是在这些技术的效效上？\n\
  \n正如我们在之前的章节中讨论过的，技术必须适用于真实的业务问题和流程才能增加价值。基于机器学习的解决方案只有在帮助你实现以下至少一点时，才会增加价值：\n\n\
  *   **降低成本**。它促进了更高效地执行某些操作，例如更好的仓库和库存控制，或优化产品定价。\n*   **提高质量**。该解决方案提供更好的产品和服务。例如，更快地履行客户订单或减少客户投诉。\n\
  \n\n\n\n\n-   创造新机会。机器学习作为一种赋能工具，让你能够完成以前无法做到的事情。这可能是为了进入新市场，或提供不同类型的产品和服务。\n\n\
  需要留意的一点是我所说的“数据机会主义者”。我遇到过不止一家分析公司，他们建议我只需：“雇佣我们的几位数据科学家，看看我们能从你们的数据中发现什么。”他们并没有对我或我的组织在做什么、我们面临的问题是什么、或者我们的痛点在哪里进行深入探究。他们仅仅假设，通过付钱让这些人搜集我的数据，并可能产出几个预测模型，他们就能交付一些有用的东西。\n\
  \n我记得最近和一位朋友聊天，他曾雇佣了一些数据科学家为他的组织（一家金融服务公司）做恰好的事情。他们说可以帮助他预测哪些客户即将变现投资。因此，这是一个流失类型的问题——识别出可能离开的客户，然后尝试留住他们。\n\
  \n我的朋友告诉我，在工作了几个周后，他雇佣的数据科学家交付了一个预测模型，该模型本质上是在预测退休；即：接近退休的人倾向于审查自己的投资，为放弃工作做准备。数据科学家对他们的发现似乎非常满意。然而，这些是我朋友以及行业内每个人已经知道的事情。这项练习没有增加任何价值，却花费了数万美元成本。我可以描述许多其他类似的情况，但我想你已经明白我的意思了。\n\
  \n你应该做的另一件事是思考你的行业以及你的竞争对手正在发生什么。与你的人脉网络交流。看看其他人在你的问题空间里做什么。如果没有其他人使用人工智能/机器学习技术来解决该类型的问题，那么你就处于一个高风险领域。也许你可以成为一个先驱，通过首批获益而领先于大家。或者，你可能在进行一场不太可能回报的巨额赌博。如果没有人为了该目的采用该技术，那就是一种风险。\n\
  \n如果你拥有高风险文化，而且冒险是游戏的一部分，那么尽管去尝试吧。但是，如果你像我们大多数人一样，在一个更保守的环境中运营，失败的潜在风险是会被解雇，那么在投入之前请深思熟虑。你需要做好功课，确保承诺的收益能够实现。至少在几个月后尘埃落定时，你需要能够证明你的决策是理性的，并且是基于当时所知的信息。\n\
  \n在与供应商合作时，特别是当提议的价值模糊或不确定时，可以采取的一种策略是建议共享回报的合同模式。预先约定一组明确的目标，供应商从产生的利润（或亏损）中抽成。如果供应商向你推销他们基于机器学习解决方案的所有优点，但不愿意接受共享风险/回报的补偿模式，那么问问自己为什么会这样？即使你并不真的想走这条路，从供应商那里获得的回复也将具有参考价值。\n\
  \n另外请记住，仅仅因为某些事情可以自动化，并不意味着你必须这样做，或者这样做是理想的。硅谷的声誉是开发创新小装置，然后尝试为它们寻找市场，而不是从人们的问题开始尝试寻找解决方案。如果我们回到自动驾驶汽车——我们知道到底有多少人真正想要自动驾驶汽车吗？最近的消费者研究表明，目前这只是少数人的。这可能会随着时间改变，但这是汽车制造商应该注意的。\n\
  \n总的来说，我在这一章中试图传达的是：保持开放的心态，也要保持清醒。人工智能和机器学习为更好、更高效、更廉价地完成任务提供了巨大的机会。然而，就像业务的其他任何方面一样——在不知道机会是什么、不清楚你想做什么以及为什么，并且没有做出支持你决策的适当效益分析之前，不要急于投入。祝运！\n\
  \n## ## 结语\n\n首先，感谢你花时间购买并阅读这本关于商业人工智能和机器学习世界的简明介绍。我希望你现在理解了这些东西是什么、为什么它们很重要以及它们是如何运作的。同样重要的是，我希望你理解，虽然这些本质上是基于数学的话题，但只有在考虑到相关的业务、社会、伦理、政治和法律问题时，它们才能发挥全部潜力。\n\
  \n如果你喜欢这本书，请考虑在 Amazon、Goodreads 或其他评论网站给出好评。作为一家独立出版商，这种支持非常有帮助，并深表感谢。\n\n另一方面，如果你觉得这本书没有填补你预期的生活空白，那么我深表遗憾。请随时给我信告诉我原因，邮箱：\n\
  \n`AI@relativistic.co.uk`\n\n同样，如果你有任何正面反馈，我也非常乐意接收。\n\nSteven Finlay\n\n2018 年\
  \ 6 月 21 日\n\n## ## 附录 A 评估预测模型\n\n一旦构建了预测模型，就需要对其进行评估，以确定其预测行为的程度。有时，单一的截止分就能实现业务目标，这可以通过查看评分分布（如图所示）来确定。同样，对于像目标识别系统这样每个分数代表一个结果的情况，你只需选择得分最高的结果即可。\n\
  \n但在许多情况下，并没有某一个截止分可供选择。相反，存在一个可能的截止分范围。这些截止分中的任何一个都能交付目标，但具有不同的优缺点。同样，常见的做法是建立多个预测模型。然后对这些模型的性能进行比较，以便选出最好的一个。\n\
  \n如果你回想书中一直使用的心脏病案例研究，你会记得我们查看了一个决策树模型和一个评分模型。这两个模型提供的解决方案都符合陈述的业务目标；即：识别至少 50%\
  \ 会患心脏病的人，但邀请人数不超过总人口的 5% 进行检查。然而，评分模型的整体表现更好。这是因为它在得分最高的 5% 人群中识别了 62% 的病例，而决策树只识别了\
  \ 55%\n\n也可以认为这两个模型都超额交付。它们识别了比要求的 50% 更多的病例。这意味着选择截止分时实际上有一定的灵活性；即：有多个截止分可以满足目标。在这种情况下，使用模型的两种可能方式是：\n\
  \n1. 结果最大化。选择导致恰好 5% 人口被邀请检查的截止分；即：利用所有可用资源。这将识别超过 50% 的心脏病病例（这是之前在案例研究中给出的答案；即评分模型的\
  \ `521` 截止分或决策树的 `12` 截止分）。\n\n\n\n\n\n# 1. 最小化资源\n\n选择一个恰好使得 50% 的心脏病病例被邀请检查的截断值。这意味着将少于\
  \ 5% 的人口被邀请检查，因为将选择高于 `521` 的截断分。\n\n选择哪个选项取决于卫生部门最看重什么。如果它希望最大化心脏病的识别率，那么选项 1 是最佳的。如果它希望尽可能少使用资源，那么选项\
  \ 2 更好。当然，卫生部门也可以选择介于这两个极端之间的截断分。\n\n更一般地说，在这些情况下，选择截断值时有两个考虑因素：\n\n*   **纯度（提升率\
  \ Lift）。** 如果选择较高的截断值，那么只有少数病例会被选中，但在选中的病例中，会有很大比例的人表现出你感兴趣的特征。\n*   **量（增益 Gain）。**\
  \ 如果选择较低的截断值，则会选中更多的病例，总体而言更多感兴趣的病例位于所选组内（即截断值以上的人）。然而，被选病例的纯度将会下降；也就是说，截断值以上的人中，表现出你感兴趣特征的比例会降低。\n\
  \n为了帮助决定截断策略以及纯度与量级之间的权衡，有两种用于评估不同截断策略影响的常用工具：提升图（Lift Charts）和增益图（Gains Charts）。它们提供了模型性能的易于使用的视觉化表示。\n\
  \n从提升图开始，它们提供了一种纯度的视图。图 13 提供了图 2 中所示的心脏病评分卡提升图示例。\n\n![](img/00012.jpg)\n\n在图 13\
  \ 中，X 轴显示了邀请检查的人口比例。Y 轴显示了被邀请的人中预计在 5 年内患疾病的比例。虚线是基准率（base rate）。基准率是大人群中预计未来 5\
  \ 年内患心脏病的人的百分比，即 `6%`。换句话说，基准率代表邀请检查的随机选择策略。\n\n实线曲线显示了如果决定谁参加检查的优先级排序基于评分卡模型的分数，将会发生什么。例如，图表显示，如果邀请得分最高的\
  \ 40% 人口参加检查，那么其中约 15% 的人将来会患上心脏病。如果减少量，例如仅邀请 10% 的人参加检查，那么比例（纯度）将上升到 `50%` 左右。\n\
  \n医疗干预的目标比例越小，患病比例就越高。换句话说，如果你只针对人口中得分极高的少数人，那么可以预期被选这些人中有很大比例的人患有心脏病。然而，如果通过包含得分较低的人来扩大邀请群体，那么整体正确识别的比例（纯度）将会下降。\n\
  \n因此，提升图是比较量与纯度之间权衡的一种。\n\n## 提升图是如何产生的？\n\n图 14 显示了分数分布的扩展版本。\n\n在图 13 中，X 轴显示了邀请检查的人口比例。Y\
  \ 轴显示了被邀请的人中预计在 5 年内患疾病的比例。虚线是基准率。基准率是大人群中预计未来 5 年内患心脏病的人的百分比，即 `6%`。换句话说，基准率代表邀请检查的随机选择策略。\n\
  \n实线曲线显示了如果决定谁参加检查的优先级排序基于评分卡模型的分数，将会发生什么。例如，图表显示，如果邀请得分最高的 40% 人口参加检查，那么其中约 15%\
  \ 的人将来会患上心脏病。如果减少量，例如仅邀请 10% 的人参加检查，那么比例（纯度）将上升到 `50%` 左右。\n\n医疗干预的目标比例越小，患病比例就越高。换句话说，如果你只针对人口中得分极高的少数人，那么可以预期被选这些人中有很大比例的人患有心脏病。然而，如果通过包含得分较低的人来扩大邀请群体，那么整体正确识别的比例（纯度）将会下降。\n\
  \n因此，提升图是比较量与纯度之间权衡的一种。\n\n图 14 显示了分数分布的扩展版本。\n\n## 附录 B 更多信息和推荐阅读\n\n以下是机器学习、人工智能及相关技术（大数据、数据挖掘等）的一些主要的网络资源。\n\
  \n\n\n\n\n# 与推荐\n\n## 运营数据库管理系统\n[`www.odbms.org/`](http://www.odbms.org/) 该网站由一系列行业专家支持。它涵盖了与机器学习、云计算和大数据等新技术的实施与应用相关的广泛的话题。\n\
  \n### KDnuggets\n[`www.kdnuggets.com/`](https://www.kdnuggets.com/) 这是一个为数据科学家提供资源的领先网站之一。\n\
  \n### AnalyticBridge\n[`www.analyticbridge.com/`](http://www.analyticbridge.com/)\
  \ AnalyticBridge 托管了一系列向所有人开放的机器学习文章、博客和讨论论坛。它涵盖的话题非常宽泛，从战略层面到非常技术性/操作层面的内容无一不包。\n\
  \n### LinkedIn（领英）\n[`www.linkedin.com/`](http://www.linkedin.com/) LinkedIn 上有多个讨论机器学习及相关主题的论坛。\n\
  \n### Kaggle\n[`www.kaggle.com/`](https://www.kaggle.com/)。 Kaggle 将自己描述为“数据科学与机器学习的家园”。它为数据科学家提供各种资源，但最广为人知的是举办机器学习/AI\
  \ 竞赛。其中许多竞赛为获胜者提供丰厚的美元奖金。Kaggle 竞赛对任何人开放。你只需要下载给定竞赛的数据然后上传你的结果即可。这些结果会在几秒钟内自动完成评估，你的分数将进入竞赛排行榜，以便你可以看到自己的排名。Kaggle\
  \ 竞赛的一个很棒的功能是你可以根据意愿多次参赛，允许你尝试许多不同的解决方案。\n\n### StatSoft\n[`www.statsoft.com/Textbook`](http://www.statsoft.com/Textbook)。\
  \ 这是一个由 Dell 管理的网站，Dell 是 `STATISTICA` 统计软件包的提供者。如果你想了解更多各种统计方法，包括机器学习中使用的方法，那么这是一个非常好的参考网站。\n\
  \n## 通用读书籍\n以下是适合普通读者的书籍列表；即：没有公式或技术术语。\n\n- **Agrawal, A., Gans, J. and Goldfarb,\
  \ A. (2018). Prediction Machines: The Simple Economics of Artificial Intelligence.\
  \ Harvard Business Review Press.** 这三位作者是经济学家而非技术专家。他们从经济学角度讨论 AI。特别是，他们提出了 AI 作为一种更高效的方式，来预测那些在战略和操作上对业务至重要的事情。\n\
  - **Davenport, T. and Kim, J. (2013). Keeping Up with the Quants: Your Guide to\
  \ Understanding and Using Analytics. Harvard Business Review Press.** Davenport\
  \ 在他 2006 年的书籍 `Competing on Analytics` 中是第一批撰写易读分析类书籍的人之一。这本较新的书是专门为非技术管理人员编写的，帮助他们理解并与具有技术思维的机器学习从业者（即数据科学家）合作。\n\
  - **Finlay, S. (2014). Predictive Analytics, Data Mining and Big Data. Myths, Misconceptions\
  \ and Methods. Palgrave Macmillan.** 这是我的书之一，所以我不可免会对它说一些好话。它主要上是一本关于机器学习的书，但也对大数据进行了简要介绍。重点是围绕预测模型开发和实施的实际问题问题。\n\
  - **Information Commissioner’s Office (2017). Big data, artificial intelligence,\
  \ machine learning and data protection. ICO.** 这份文件是由英国政府编写的一份详细讨论报告。它从数据保护的角度考察了大数据、机器学习和人工智能的影响。它对处理这些新技术时需要考虑的问题提供了一个非常全面的视角，特别是关于适用于所有欧盟国家的通用数据保护条例（`GDPR`）的内容。\n\
  - **Kahneman, D. (2012). Thinking, Fast and Slow. Penguin.** 这是一本关于决策的书。它深入探讨了人们之所以以他们的方式做出决策的原因。特别是，它讨论了为什么人们往往难以接受基于机器学习的自动化决策系统。然而，这本书的涵盖范围比这要广泛得多。它讨论了与人类决策过程相关的广泛问题。\n\
  - **O’Neil, C. (2016). Weapons of Math Destruction. How Big Data Increases Inequality\
  \ and Threatens Democracy. Allen Lane.** 这本引人入胜的书展示了预测模型的“暗面”，讨论了通过使用和误用可能带来的偏见和歧视。与本书的第\
  \ 13 章的内容非常互补。\n- **Siegel, E. (2016). Predictive Analytics: the Power to Predict\
  \ Who Will Click, Buy, Lie, or Die. 2^(nd) edition. Wiley.** 这是一本非常具有争议（书（像 marmite））的书。你要么喜欢它，要么讨厌它，但它是那本让机器学习的注意力进入比以往任何时候都更广泛受众的书。我喜欢\
  \ marmite！\n- **Silver, N. (2012). The Signal and the Noise: Why So Many Predictions\
  \ Fail. Penguin.** 这并不是一本真正的机器学习书籍。然而，非常相关的是它关注于理解为什么这么多预测系统会失败。它讨论了为什么需要更多关注预测和预测的弱点和陷阱，以便提高未来预测模型的质量。\n\
  \n## 技术推荐\n如果你想准备工具并更深入地接触 AI 和机器学习的技术方面，那么我推荐以下内容：\n\n- **Baesens, B. (2014). Analytics\
  \ in a Big Data World: The Essential Guide to Data Science and its Applications.\
  \ Wiley.** 这本书描述了开发预测模型的所有关键阶段。对于具有少量数学和/统计知识的人来说很好的读物，但你不需要数学或统计学位就能理解 Baesens\
  \ 提出的概念。\n- **Chollet, F. (2018) Deep Learning with Python. Manning Publications.**\
  \ 这本结构良好的书从介绍人工智能和机器学习开始。随后在提供 `Python` 代码示例之前，涵盖了支撑机器学习的底层理论。\n- **Crawley, M.\
  \ (2012). The R Book. 2^(nd) Edition. Wiley.** 有许多统计软件包可以用于机器学习。然而，`R` 是最流行的之一。`R`\
  \ 是开源的，可以从 `CRAN` 网站免费下载 [`cran.r-project.org/`](http://cran.r-project.org/)。如果你有一定的编程知识，这本书提供了对\
  \ `R` 语言的全面介绍。注意这本书的重点是学习 `R`，而不是机器学习。\n- **Easley, D. and Kleinberg, J. (2010).\
  \ Networks, Crowds, and Markets: Reasoning About a Highly Connected World. Cambridge\
  \ University Press.** 我在正文中没有讨论社交网络分析，但社交网络是许多机器学习模型的数据来源。Facebook、Google 和 LinkedIn\
  \ 等公司将机器学习应用于他们持的数据，以驱动广告和目标营销活动。这本书提供了关于社交网络分析在多种环境中应用的实践和理论材料。\n- **Goodfellow,\
  \ I, Bengio, Y. and Courville A. (2016). Deep Learning (Adaptive Computation and\
  \ machine learning Series). MIT Press.** 长度近 800 页，评论界将其描述为 AI 和机器学习的“圣经”。你可能需要擅长处理数学和统计知识才能从书中获得最大的价值。\n\
  \n\n\n\n\n- Hastie, T., Tibshirani, R. and Friedman, J. (2017). 《统计学习方法：数据挖掘、推断与预测》(Springer\
  \ Series in Statistics) 第 2 版. Springer 出. 这是一本由该领域三位世界顶级学者编写的指南，对机器学习中使用的许多数据挖掘工具提供了详尽的技术性介绍。\n\
  - Hosmer, D. and Lemeshow, S. (2013). 《应用逻辑回归》(Wiley Series in Probability and Statistics)\
  \ 第 3 版 Wiley 出. 逻辑回归仍然是生成预测模型最流行、应用广泛的方法之一。这是我向想要进一步了解这种方法的人的第一本书。\n- Khun, M.\
  \ and Johnson, K. (2013). 《应用预测建模》。Springer 出. 另一本与 Baesens（上文）风格类似的构良著作。它将实践建议与该主题更具数学性的方面结合。\n\
  - Witten, I. H., Frank, E., Hall, M. A. and Pal, C. J. (2016). 《数据挖掘：实用机器学习工具与技术》，第\
  \ 4 版 (The Morgan Kaufmann Series in Data Management Systems)。Morgan Kaufmann 出.\
  \ 这是一本对实用数据挖掘感兴趣的人的详尽参考手册。我发现它结合了理论与实践，包含了许多良好的案例。\n- Zelle, J. (2016). 《Python\
  \ 编程：计算机科学导论》。第 3 版. Franklin, Beedle & Associates. 关于 Python 编程语言的实用介绍。\n\n## 附录\
  \ C 机器学习与人工智能中的常用术语\n\n**激活函数 (Activation function)**。一种用于将神经元的原始输出转换为其最终输出（分数）的等式（数学公式）。激活函数通常用于强制神经元的输出落在固定范围\
  \ own。这个范围通常在 0 到 1 之间，但某些激活函数的输出具有不同的范围。常见的激活函数包括逻辑回归函数、双曲正切函数和恒等函数。请参见 [`en.wikipedia.org/wiki/Activation_function`](https://en.wikipedia.org/wiki/Activation_function)\
  \ 获取更完整的激活函数列表及其推导。\n\n**算法 (Algorithm)**。算法是一组为了解决特定问题按顺序执行的指令或程序。在机器学习中，各种算法被用于发现数据中的模式并创建预测模型。\n\
  \n**人工智能 (AI)**。对生物（主要是人类）分析和决策能力的复制。例如，物体识别和语音识别、预测人的未来行为，以及玩国际象棋、扑克和围棋等游戏的能力。\n\
  \n**大数据 (Big Data)**。海量多样化且变化的数据集合，很难使用标准个人电脑/服务器处理；即通常大小为 TB 或更大。大数据技术利用先进的计算机架构和专业软件来促进这些数据集的快速处理。机器学习是从大数据中提取价值的主要工具之一。\n\
  \n**因果关系 (Causation)**。关于某事为何发生的背后的推理；即某事发生。不要与相关性混淆。\n\n**分类模型 (Classification\
  \ model)**。一种预测给定事件是否会发生的预测模型。例如，两个人在约会中投缘得来的可能性、某人购买某种类型汽车的概率，或者一个人在未来 10 年内患糖尿病的概率。分类模型生成的评分是对事件发生概率的估计。不要与回归模型混淆。\n\
  \n**聚类 (Clustering)**。聚类是指包含具有相似特征的人或事物的群体。例如，年龄和收入相似的人可能处于一个聚类中，职业角色和家庭规模相似的人可能处于另一个。聚类算法是无监督学习的一种形式（见下文）。\n\
  \n**卷积（神经）网络 (Convoluted neural network)**。一种深度神经网络，其中层中并非所有神经元都连接到下一层的所有神经元。通过较少的权重，训练网络所需的（非常大量的）时间大大缩短。一个经典应用是物体识别。想象你有一张由\
  \ 256 * 256 (65,536) 像素组成的图像。传统的神经网络为第一层的每个神经元都需要 65,536 个权重，每个像素一个！通过将图像分割为 64\
  \ 个子区域（每个区域有 32 * 32 像素）并仅连接每个子区域内的神经元，每个神经元的权重数量减少到仅 1,024 个。之所以有效是因为图像中最重要的特征通常聚集在一起（即在相同或相邻的子区域内）。图像两端的像素的重要性小得多。\n\
  \n**相关性 (Correlation)**。如果一个变量的变化与另一个的变化同步发生，则该变量与另一个变量相关。重要的是，这并不一定意味着一件事是由另一件事引起的（因果关系），尽管事实可能是。鹳的迁徙与出生有关（在鹳迁徙的春季出生的孩子更多），但鹳的迁徙并没有导致出生！\n\
  \n截断分数 (Cut-off score)，请参见决策规则。\n\n**数据挖掘 (Data mining)**。数据挖掘是在数据集中发现有用信息的科学，人类无法通过肉眼观察轻易识别这些信息。数据挖掘利用了来自不同学科的广泛算法和自动化程序，包括统计学、计算和人工智能/机器学习。\n\
  \n**数据科学 (Data science)**。指以务实的方式将数学（机器学习）知识与数据及 IT 技能相结合，以提供具有实际价值的基于机器学习解决方案的技能/艺术。\n\
  \n**数据科学家 (Data scientist)**。对从事数据科学的人的称呼。优秀的数据科学家专注于提供在真实环境中运行的解决方案。他们不会纠结于理论。\n\
  \n**决策规则 (Decision rule)**。预测模型生成分数。然后根据这些规则来决定如何处理人们。高于给定分数（截断分数）的人接受一种治疗，低于截断分的人接受另一种。例如，在评估人们的某种疾病时，只有得分高于截断分（即患病风险最高）的人才会获得治疗。\n\
  \n**决策树 (Decision tree)**。一种使用递归算法将人群划分为更小小组的预测模型。也称为分类回归树 `CART`（因为它们可以用于分类和回归）。\n\
  \n**深度学习 (Deep learning)**。基于复杂神经网络（或相关架构）的预测模型，包含跨越许多层的许多神经元。深度学习在物体识别和翻译等复杂问题上取得了成功。\n\
  \n**开发集 (Development sample)**。用于机器学习过程构建预测模型的数据集。开发集需要至少包含数百案例，但通常使用包含数万更大的样本。\n\
  \n**集成 (Ensemble)**。由多个子模型组成的预测模型（最少 3 个，有时是数千）。所有子模型预测相同的结果，但使用不同的方法和/或不同的数据构建。这意味着模型并不总是生成相同的预测。集成整合了所有个体预测以得出一个最终预测。模型集成通常（并非总是）显著优于最好的单个模型。\n\
  \n**前馈神经网络 (Feed forward neural network)**。一种连接全单向的神经网络，从一层神经元连接到下一层。没有反向或层间连接。大多数神经网络都是前馈网络。\n\
  \n\n\n\n\n# 预测时期（Forecast horizon）。许多（并非所有）预测模型都会预测未来未知的事件或数量。预测时期是模型进行预测的时间跨度。营销模型通常预测几小时或几天跨度内的响应。在医学领域，在预测特定医疗状况的生存概率时，会使用长达多年的预测时期。\n\
  \n# 增益图（Gains chart）。一种用于展示模型收益的常用可视化工具。通常与提升图（lift chart）结合使用。更多信息请参阅附录 A。\n\n\
  # 高特技术轮回曲线（Gartner Hype Cycle）。高特轮回曲线将新技术分为五个阶段，捕捉了我们倾向于先高估后低估其价值，最终达到中间位置某个水平的过程。更多细节请参阅高特网站。[https://www.gartner.com/technology/research/methodologies/hype-cycle.jsp]\n\
  \n# GDPR。通用数据保护条例（Regulation (EU) 2016/679）。该条例适用于所有欧盟国家，取代并更新了此前的数据保护立法。GDPR 对欧盟国家个人数据的收集、存储和使用施加了若干项义务和限制。在本书的语境下，一个关键特征是它赋予了人们对于自动化决策系统如何对其做出决策的某些权利（例如基于机器学习得出的预测模型所做出的决策）。\n\
  \n# 通用人工智能（General AI）。在许多不同问题领域中以人类智能方式运行，并能像人类一样适应新情况的人工系统被描述为拥有通用人工智能。目前使用的任何人工智能系统都不能认为拥有通用人工智能。另见窄人工智能（Narrow\
  \ AI）。\n\n# Hadoop。一种数据存储解决方案，利用大量“现成”台式电脑来快速存储和处理海量数据。\n\n# 物联网（Internet of Things）。这描述了智能日常设备，如冰箱、洗衣机甚至灯泡，这些设备可以连接到互联网或其他系统。这能够收集有关它们使用的数据，并允许用户远程控制这些设备，例如在回家的路上通过手机\
  \ App 设置洗衣机启动。\n\n# K 均值聚类（K-Means Clustering）。一种流行的聚类方法。其目标是通过最小化每个簇内观测值之间的差异，将群体中的观测值分为\
  \ K 个相似的组。\n\n# 提升图（Lift chart）。一种用于展示预测模型实际收益的常用图表工具。通常与增益图结合使用。更多信息请参阅附录 A。\n\n\
  # 线性模型（Linear model）。一种流行的、易于理解和使用的预测模型。通过将每个特征的值与其相关的权重相乘，然后汇总所有结果来计算得分。表示线性模型的一种流行形式是评分卡（scorecard），例如第\
  \ 5 章中介绍的那种。\n\n# 线性回归（Linear regression）。创建线性模型和评分卡最流行的方法之一。其发展可溯到 100 多年前。线性回归所需的计算能力比神经网络等高级方法低几个数量级。因此，它可以非常成功地作为初步数据选择/建模工具，在使用（深度）神经网络等方法进行最终模型构建时，用以减小数据集的规模。\n\
  \n# 逻辑回归（Logistic regression）。一种用于创建分类模型的非常简单且流行的方法。逻辑回归广泛用于创建线性模型和评分卡，例如第 5 章中介绍的心病评分卡。\n\
  \n# 机器学习（Machine learning）。机器学习寻找特征（数据中的模式）的过程。机器学习算法源于对人工智能和模式识别的研究。用于训练（深度）神经网络和支持向量机的算法是机器学习方法的两个范例。\n\
  \n# MapReduce。一种编程方法，能够快速处理存储在 Hadoop（以及大数据平台）上的数据。MapReduce 的工作原理是将数据处理任务分成许多较小的子任务，然后可以在组成\
  \ Hadoop 网络的计算机网络上并行实现这些任务。\n\n# 模型（Model）。对现实世界系统或情况的数学表示。模型用于确定现实世界系统在不同条件下的表现如何。另见预测模型（predictive\
  \ model）。\n\n# 监控（Monitoring）。预测模型的性能往往随着时间的推移而恶化。因此，在模型实施后启动监控机制以持续衡量模型的表现是谨慎的。当监控显示性能性能恶化时，会对模型进行重新开发。\n\
  \n# 窄人工智能（Narrow AI）。仅在某一或两件事上非常出色的人工智能应用，但无法应用于其设计范围之外的问题。目前使用的所有人工智能应用都可以被描述为窄人工智能系统。另见通用人工智能（General\
  \ AI）。\n\n# 神经网络（Neural network）。一种使用机器学习得出的流行预测模型类型。神经网络非常适合捕捉数据中复杂的相互作用和非线性关系，其方式类似于人类学习。“深度”神经网络（深度学习/深度置信网络）是非常巨大且复杂的神经网络，通常包含数千或数百万人工神经元，用于语音识别和自动驾驶汽车导航系统等“AI”任务。\n\
  \n# 神经元（Neuron）。神经网络的核心组件，通常被类比为人类大脑中的生物神经元。实际上，神经元是一个线性模型，其得分经过（非线性）转换。因此，神经网络可以被看是一组相互连接的线性模型和非线性转换。\n\
  \n# 几率（Odds）。一种表示事件发生概率的方法。事件的几率等于 `(1/p) – 1`，其中 `p` 是事件发生的概率。同样，概率等于 `(1/Odds+1)`。1:1\
  \ 的几率等于 0.5 的概率，2:1 为 0.33 的概率，3:1 为 0.25 的概率，以此依此类推。\n\n# 过拟合（Over-fitting）。数据科学家生活的祸敌。当算法在搜索开发预测模型所用数据中的相关性时走过头了，就会发生过拟合。结果是，模型在针对开发样本进行度量时看起来很有预测性，但当使用未向模型展示过的数据来预测新结果时，表现非常糟糕。\n\
  \n# 覆盖规则（Override rule）。有时，无论模型生成的预测如何，必须采取某些行动。例如，一个用于针对啤酒优惠目标人群的预测模型可能会预测某些儿童很可能接受该优惠。因此，设置了一条覆盖规则以防止向儿童发送优惠，无论模型生成的得分如何。\n\
  \n# 预测分析（Predictive analytics (PA)).将机器学习技术应用于生成预测模型。有些人认为，在所有实际操作中，机器学习和预测分析或是一回事，因为它们使用相同类型的数据作为输入，应用相同类型的算法并产生类似的输出（得分）。\n\
  \n# 预测模型（Predictive model）。预测模型是大多数机器学习算法产生的关键输出。模型捕捉了该过程发现的关系（相关性）。一旦创建了预测模型，就可以将其应用于新情况，以预测未来或其他未知的事件。\n\
  \n# 预测建模（predictive modelling），见预测分析（predictive analytics）。\n\n\n\n\n\n### 主成分分析\
  \ (PCA)。PCA 是一种常用的降维方法。PCA 使用原始变量集来构建一组新的、更小的变量集，这些变量随后会被机器学习过程中。PCA 的工作前提是许多变量在某种程度上是相互相关的；即包含某些相同的信息。因此，使用较少的变量可以更有效地捕获这些信息。\n\
  \n### 像分析 (Profiling)。根据《通用数据保护条例》(GDPR) 的定义，画像分析是指：“对个人数据进行任何形式的自动化处理，其包括使用个人数据来评估与自然人的某些个人方面，特别是分析或预测有关该自然人的工作表现、经济状况、健康、个人偏好、兴趣、可靠性、行为、位置或移动等方面。”画像分析可能或不构成自动化决策过程的一部分。\n\
  \n### Python。与 R 语言一样，Python 是机器学习领域最流行的、免费提供的软件包之一。\n\n### R。R 语言是开展机器学习最流行的软件平台之一。R\
  \ 软件是免费且开源的，用户社区可以开发新功能并与其他用户共享。对于想要成为数据科学家的人，建议在 R（和/或 Python）方面有坚实的基础。附录 B 中讨论了一些关于\
  \ R 和 Python 的书籍。\n\n### 随机森林。随机森林是一种集成方法，基于结合许多决策树的输出。每棵决策树都是在略有不同的条件下创建的，因此会生成不同的评分。随机森林是最成功且应用广泛的集成方法之一。\n\
  \n### 循环神经网络。一种神经网络，它将开发样本中之前案例的输出作为后续训练的输入。当数据中存在序列模式时，这类网络特别有用；即开发样本中案例的顺序非常重要。一个例子是视频分析。从一张图像到下一张图像的状态变化（即物体的移动）可以提供关于当前图像性质的大量信息。\n\
  \n### 回归模型。一种预测事物大小的常用工具。例如，某人将花费多少钱或活多久。这与预测事件发生概率的分类模型形成对比。\n\n### 强化学习。根据采取行动产生的某种成功或奖励衡量，逐案精炼模型中权重的过程。模型每次产生结果时，都会对该结果的质量进行评估。然后，训练算法根据其表现调整模型权重。强化学习被认为比其他类型的机器学习（如监督学习）更接近人类的学习方式。\n\
  \n### 响应（选择）建模。该术语指的是用于营销模型，用于预测某人购买其目标投放的产品或服务的概率。响应模型是一种分类模型。\n\n### 得分 (Score)。预测模型生成的大多数预测以单个数字（评分）的形式表示。对于分类模型，评分是事件发生概率的表示，例如某人响应营销沟通的可能性，或他们违约贷款的概率。对于回归模型，评分代表预测行为的大小，例如，某人可能花费多少钱，或他们可能活多久。\n\
  \n### 评分卡 (Scorecard)。评分卡是一种展示线性模型的方法，易于非专家理解。评分卡的主要优点是它是可加的；即模型评分通过简单累加适用分数计算得出。没有乘法、除法或其他更复杂的算术运算。\n\
  \n### 评分分布。显示预测模型的评分在目标群体中分布情况的表格或图表。提升图和增益图都是以以表化形式展示评分分布的方法。\n\n### 情感分析。这是一种提取人们对事物态度信息的流行技术。例如，他们在使用特定产品或服务时是否有正面或负面的体验。在机器学习中，情感分析被用于从文本或语音中提取信息，然后用于构建预测模型或得出聚类。\n\
  \n### 监督学习。机器学习的应用，其中开发样本中的每个案例都有一个想要预测的关联结果。这些案例被称为“已标记”的。目标营销中监督学习的一个例子是，每个客户对营销活动的响应是已知的（他们要么响应了，要么没有）。算法生成的模型将进行优化，以预测客户是否会响应营销。在实践中，大多数机器学习方法都是监督学习的示例。\n\
  \n### 支持向量机。一种先进的非线性模型。支持向量机与神经网络有某些相似之处。\n\n### TensorFlow。一种用于 Python 编程语言的机器学习算法开源库。TensorFlow\
  \ 最初由 Google 开发。TensorFlow 的一个关键特性是它利用高端显卡的处理能力，显著提高了复杂机器学习模型（特别是深度神经网络）的开发速度。\n\
  \n### 训练算法。用于描述用于确定预测模型结构的迭代机器学习算法的术语。该术语在神经网络类型模型中用得最广泛。算法重复多次，调整网络中的权重以优化网络性能。训练算法在固定次数的迭代后停止，或当无法获得模型性能的进一步显著改进时停止。\n\
  \n### 无监督学习。机器学习在开发样本不包含结果数据的问题上的应用。案例被称为“未标记”的。无监督算法通常寻求将具有相似特征（属性）的案例归类。无监督学习的一个例子是组织想要为一种昂贵的奢侈品制定广告投放政策，而没有任何关于客户购买历史的信息。聚类分析被用于根据年龄、收入、性别等将相似的客户归为一类。然后，将广告投放策略针对平均收入较高的聚类组中的个人，而不是低收入的聚类组。\n\
  \n### 验证样本 (Validation sample)。一个独立的数据集，用于在构建预测模型后对其进行评估。验证样本应与开发样本完全分离，并且不应在模型构建期间使用。使用一个（或多个）验证样本很重要，因为机器学习有时会将模型过拟合到开发样本。这意味着如果你使用开发样本来评估预测模型，它看起来可能比实际上更有预测性。\n\
  \n## 附录 D. 业务成功的清单\n\n在本附录中，我们将关注您应该回答的问题，以确保您的机器学习项目是成功的，并使它们为业务流程带来的收益最大化。当我说业务流程时，我主要指的是替换或补充员工通常可能执行的决策任务。\n\
  \n\n\n\n\n重点是我在之前的几章中所谓的“简单 AI”类型的问题。这类问题是指人们希望使用机器学习方法来完成某些工作，例如决定面试哪些求职者、对医疗扫描进行初步诊断、决定应如何处理客户等。本节的建议对于“复杂\
  \ AI”系统的开发（如自动驾驶车辆的运行或个人数字助手的开发）可能相关性较小。然而，许多建议对于这类应用仍然有效。\n\n以下是你在考虑在组织内部使用机器学习时应该提问的简明列表。或者正如我喜欢所称的：“芬曼博士的机器学习成功清单”。\n\
  \n除非在项目离开业务需求阶段之前，你能以很高程度的确定性回答所有这些问题，否则该项目极有可能会失败。因此，你面临着在项目上花费大量精力和金钱，但在结束时没有获得任何收益的风险。\n\
  \n### 芬曼博士的机器学习成功清单\n\n1. **你的业务问题是什么？** 机器学习本身没有内在价值。如果它产生任何价值，必须将其应用于特定的问题或目标。如果你无法确定一个要解决的业务问题，请立即停止！\n\
  \n2. **你想要优化什么指标？** 这应该是可以用简单的术语衡量的、且对你重要的东西。节省的时间、增加的利润、降低的成本、客户满意度和挽救生命都是典型的例子。机器学习过程将用于优化这一点。\n\
  \n3. **你将应用什么样的决策规则和行动？** 你必须根据机器学习过程的输出做出决策，并对这些决策采取行动。如果你无法想象出将用预测模型做什么，为什么还要它呢？\n\
  \n4. **用于机器学习的数据从何处来？** 机器学习至少需要数百个、理想情况下数千个示例案例才能运行。对于大多数机器学习问题，感兴趣的指标（上述第 2 点）需要在这些案例中可用可用。\n\
  \n5. **你将如何使机器学习过程运营化？** 预测模型和决策规则将在什么系统或过程中实施？这将需要时间和金钱。谁来做？谁来买单？模型和决策规则不会自动实施。\n\
  \n6. **自动化相关的伦理和法律风险是什么？** 使用第 13 章中的指南，根据客户影响、数据不可变性和受益者评估这些风险。你将采取哪些缓解措施来管理任何风险？你是否考虑了适用于所在地区的数据保护法？\n\
  \n7. **所有所需数据在操作上都可用吗？** 让数据科学家针对其模型中出现的每个数据项提供清单。这是为了确保模型所需的数据存在于实施平台中。如果任何数据项不可用，你将无法使用已经开发的解决方案。\n\
  \n8. **解决方案是以主动方式还是被动方式实施的（如第 11 章所述）？** 如果是被动方式，你需要什么控制措施来确保只有在正确的时候才发生覆盖？如果人们会审查并可能覆盖系统做出的每项决策，那么该系统将不会增加任何价值。\n\
  \n9. **你将如何评估项目的成功？** 机器学习项目在分析阶段结束时提出的理论收益仅是现实实际情况的指示。需要一个监控过程在系统上线后进行评估。这样你就可以根据实际实现的收益与承诺的收益进行衡量。\n\
  \n10. **维护系统的持续成本是什么？** 随着时间的推移，新数据、新法规、不断变化的业务需求等意味着系统将需要修改，并可能最终从头重新开发。预计多久发生一次？成本可能有多少？不要忘记包括监管合规成本和年度审计的费用。\n\
  \n如果你是机器学习的新手，我的建议是每当你去见 AI/机器学习解决方案供应商时，都随带上这份清单。除了为你回答这些问题之外，供应商如何回答这些问题将很好地表明他们对你需求的理解程度。如果他们只能用泛化的收益或关于需要跟上竞争的模糊陈述来回答，请务心。\n\
  \n## 关于作者\n\nSteven Finlay 是一位数据科学家，在大规模数据环境中开发实用的“增值”机器学习解决方案方面拥有 20 多年的经验。他拥有预测建模的博士学位，是英国兰卡斯特大学的荣誉研究员。\n\
  \nSteve 曾受雇于英国十大银行之一，负责管理其信贷风险模型套件，并为英国政府开发过机器学习方法，并在多家咨询集团工作过。他目前担任英国 Computershare\
  \ 贷款服务公司（CLS）的分析主管。\n\nFinlay 博士出版了多本关于机器学习、人工智能和金融服务的实用书籍。他的其他书籍（由 Palgrave Macmillan\
  \ 出版）包括：\n\n* `Predictive Analytics, Data Mining and Big Data. Myths, Misconceptions\
  \ and Methods.`\n* `Credit Scoring, Response Modeling and Insurance Rating. A Practical\
  \ Guide to Forecasting Consumer Behavior.`\n* `The Management of Consumer Credit.\
  \ Theory and Practice.`\n* `Consumer Fundamentals.`\n\n## 注释\n\n* [1]: 预测消费者行为是机器学习非常常见的应用，但还有许多其他应用。例如，相同的技术也用于预测股价、复杂的机器何时可能故障以及哪些组织可能会破产。\n\
