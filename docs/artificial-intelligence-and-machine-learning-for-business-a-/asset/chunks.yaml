- raw: "*   Deterministic cases. If you have customers which you know with certainty\
    \ how you are going to treat them, then you don’t need a predictive model for\
    \ this. Including them in the development sample will only weaken the power of\
    \ the model, as measured on the remainder of the population^([\\[48\\]](#index_split_028.html#filepos427242)).\n\
    \n>   \n\n*   Inexplicability. A fundamental principle of machine learning is\
    \ that you should be very cautious about building models using data which you\
    \ don’t fully understand. This is particularly true for models that are subject\
    \ to industry regulation or are strategically important to an organization’s success.\
    \ If a data scientist presents you with a model using data that they can’t explain,\
    \ then that’s a risk that you should be concerned about.\n\nIf an organization\
    \ has huge databases, then this may be problematic in terms of the computer resources\
    \ required to analyze them as part of the machine learning process. It’s not unusual\
    \ for only a sample; say 1:10 or 1:100 cases to be selected for inclusion in the\
    \ development sample.\n\n“Big Data Purists” may argue that you should analyze\
    \ all available data because failing to do so may result in subtle patterns being\
    \ missed, and hence sub-optimal models being created. In one sense they are right.\
    \ If you take a sample rather than using the full population the resulting model\
    \ will not be as accurate. However, it’s very much a case of diminishing returns.\
    \ For almost all practical business problems, the benefits of taking more than\
    \ a few tens of thousands of cases is marginal. If you sample in an appropriate\
    \ way^([\\[49\\]](#index_split_028.html#filepos427639)), then you’ll get 99% of\
    \ the benefit from a model developed using 100,000 cases compared to one developed\
    \ using 10 million. To put it another way, just because you have huge amounts\
    \ of data does not necessarily mean that you need to invest in specialist hardware/software\
    \ to be able to apply machine learning – you just need to be smart in how you\
    \ do it and focus on the data that really matters.\n\nThe fourth stage of the\
    \ process is data preparation. This is required because the raw data may be badly\
    \ formatted, contain errors or not provide the best possible representation of\
    \ the data; i.e. a different representation will make it easier for the machine\
    \ learning process to find the important patterns in the data. There are four\
    \ main tasks that occur during data preparation:\n\n1.  Creation of new data.\
    \ Age is more predictive than Date of Birth for most types of problem. Therefore,\
    \ age may need to be calculated if only Date of Birth is available. If you have\
    \ data about credit card transactions, it’s best to create summary variables representing\
    \ average spend per transaction, number of transactions last month, time since\
    \ last transaction and so on.\n\n>   \n\n1.  Data cleaning. Data may be missing\
    \ or incorrect. A key purpose of data preparation is to identify where this type\
    \ of data exists, and to either remove it (an exclusion) or reformat it; i.e.\
    \ recode all incorrect/missing data with a standard value. If dates of birth used\
    \ to calculate age are in the future or impossibly far in the past, you may want\
    \ to define a default value of say ‘-1’ for age, to represent these cases.\n\n\
    >   \n\n1.  Consolidation. It’s good practice to represent similar data in a similar\
    \ way. If you have a data item called Property Type, where the values “D”, “Det”\
    \ and “DH” all mean the same thing; i.e. “Detached House”, then these should be\
    \ consolidated into a single value that is used to represent all cases of Detached\
    \ House.\n\n>   \n\n1.  Conversion to numeric. Machine learning algorithms like\
    \ numeric data. “Yes”/”No”/”Maybe” would be converted in to 0/1/2 flags instead.\
    \ For complex text or speech such as a Twitter feed, then one approach is to include\
    \ flags to indicate if certain key words feature or not, or to generate counts\
    \ of the number of times certain words appear.\n\nOnce a suitable data sample\
    \ has been prepared then it’s time for data pre-processing and preliminary variable\
    \ selection (Stage 5 of Figure 12). With data pre-processing, one is putting the\
    \ data into a format that is going to be most amenable to the chosen machine learning\
    \ algorithm.\n\nPre-processing usually involves two processes: standardization\
    \ and transformation. Standardization processes scale data so that everything\
    \ has similar values. If you have two data items such as gross annual income in\
    \ dollars and height in meters then one approach to standardization is to subtract\
    \ the respective average and then divide by the range of values (or some other\
    \ measure^([\\[50\\]](#index_split_028.html#filepos428335))). In this way, both\
    \ will be centered on zero and have broadly similar ranges.\n\nIf we are talking\
    \ about applying machine learning to something like an object recognition system,\
    \ then similar standardization procedures are applied to the images that form\
    \ the development sample. In object recognition, the development data is derived\
    \ from the set of pixels in each image. Data about the color and intensity of\
    \ each pixel provides the inputs to the machine learning process. Images in the\
    \ development sample may have been taken under different lighting conditions.\
    \ Therefore, the intensity of the pixels in each image are adjusted (standardized)\
    \ to the average pixel intensity across all images.\n\nVariable selection (variable\
    \ reduction) is about deciding what data items to throw away and what should be\
    \ retained and presented to the machine learning algorithm. The main reason for\
    \ doing this is that even though today’s computers are incredibly powerful, there\
    \ is often too much data to process it in realistic time. Often, there will be\
    \ thousands or even millions of individual data items that have been created during\
    \ data preparation and data pre-processing. In most cases, only a handful of these\
    \ actually prove to be materially important for generating accurate predictions.\n\
    \nVariable selection is usually a relatively quick and simple process. Various\
    \ statistical tests are performed to determine how well correlated each piece\
    \ of observation data is with the outcome being predicted. Data items are only\
    \ retained if there is proven correlation. Typically, no more than between 1%\
    \ and 10% of data items are retained following this process. There are also methods\
    \ such as Principle Component Analysis (PCA) which seek to transform a large set\
    \ of initial data items into a smaller set of new ones. These new data items are\
    \ the ones that are then used for model construction.\n\nStep 6 of the process\
    \ is model construction. This is often the most exciting part of the machine learning\
    \ process for a data scientist. It’s what data scientists tend to talk about most\
    \ of the time, even though model construction represents only a few percent of\
    \ the overall end-to-end process. During model construction the development data\
    \ is presented to the machine learning software, the relevant algorithm(s) are\
    \ run and a predictive model is produced at the end. This would typically look\
    \ something like the scorecards, decision trees and neural networks that we’ve\
    \ seen before in previous chapters."
