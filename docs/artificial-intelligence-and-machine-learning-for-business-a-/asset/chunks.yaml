    ## Classification of AI Problems


    - **“Simple” AI problems**: These have a singular objective or thing that one
    is trying to determine, which is easy to quantify. For a classification problem,
    this means that the outcome can be expressed as a simple “Yes” or “No” such as
    does someone default on a loan or not? For a regression problem, can the outcome
    be expressed as single number? Such as how much someone spent in store the last
    time they shopped.

    - **“Complex” AI problems**: These usually have multiple and very nuanced objectives.
    Classic examples of “complex” problems are object recognition, language translation
    and game playing (e.g. chess or Go). This also includes problems that require
    multiple machine learning approaches to be used in combination, such as in autonomous
    vehicles and digital personal assistants.


    It’s not always as clear cut as this, but as a rule of thumb it’s not a bad place
    to start.


    ## Business Applications and Context


    Most business applications that you are likely to come across (target marketing,
    credit scoring, who to hire/fire, matching on dating sites, etc.) fall into the
    “Simple AI” category. A network with a couple of hundred neurons spread over just
    two layers is more than enough and will probably yield similar or marginally better
    performance than a well-designed scorecard type model. However, you can never
    be sure. As with other aspects of machine learning, the advice to whoever is building
    predictive models for you is to try out a number of different approaches and then
    see which one satisfies your requirements the best. This is both in terms of raw
    predictive accuracy and business requirements/constraints. If there is a business
    or legal requirement for the model outputs to be explicable to a layperson, can
    you explain in simple terms why the model came up with the score that it did?


    A data scientist should always use a simple approach such as a scorecard as an
    initial benchmark, and then try to improve upon that using more complex/advanced
    methods.


    ## 9. Unsupervised and Reinforcement Learning


    The machine learning techniques we have discussed so far have assumed that there
    is a development sample which contains both observation data and outcome data.
    For the heart disease problem, each patient’s data in the development sample was
    labeled to identify if they subsequently went on to develop heart disease. The
    application of various machine learning algorithms was described to find the relationships
    that exist between the observation and outcome data. These relationships were
    then captured in the form of a model such as a scorecard, a decision tree or a
    neural network. The resulting model could then be used to predict the probability
    of people developing heart disease in the future, based on what is known about
    them today.


    Machine learning applied to labeled data; where each case in the development sample
    has both observation and outcome data, is referred to as supervised learning.
    The vast majority of AI/machine learning applications that you will come across
    in the business world such as target marketing, fraud detection and employee vetting
    are examples of supervised learning. If you have labeled data available, then
    a supervised approach is usually the right one to follow and will yield the best
    results.


    There are however, certain types of problem where outcome data is very limited
    or does not exist – there is only unlabeled observation data. Therefore, while
    this book is mainly about supervised learning, it’s worth spending some time considering
    what can be done in such situations.


    ### Unsupervised Learning


    When outcome data is not available, a set of techniques referred to as unsupervised
    learning can be applied. A key feature of unsupervised learning is that it is
    primarily used for knowledge discovery; that is, detecting interesting features
    in data. This contrasts with supervised learning which is usually associated with
    predicting an outcome using the matching observation data.


    What this means in practice, is that unsupervised learning approaches are great
    at helping to identify and group things based on similarities between them, but
    they do not provide you with predictions that tell you how someone or something
    is going to behave. The objectives and outputs from supervised and unsupervised
    learning, are therefore, very different. With supervised learning, the end game
    is a predictive model of some sort. The model can then be used to predict the
    behaviour of new cases when they present themselves. With unsupervised learning,
    the output is a representation of the structure of the data which is a different
    thing altogether.


    ### Clustering


    The most common type of unsupervised learning in use today is clustering. The
    goal of clustering is to identify similarities and/or connections within data
    such that you can group (cluster) similar cases together. The idea is that because
    cases in a given cluster have a lot of very similar attributes, then you can treat
    everyone in that cluster in a similar way.


    To illustrate clustering in action, consider Rebecca, the manager of a cinema
    complex located in a university town. Most of her customers attend shows at evenings
    and weekends. This is presumably because they are at work or school the rest of
    the time. However, she does provide some early bird shows mid-week, even though
    these shows are not very well attended. What Rebecca would like to do is understand
    more about the types of people who attend these mid-week shows. She can then target
    promotional offers at similar people in the local community, who might be interested
    in watching a film at that time, and hence improve the cinema’s audience figures.


    This is an unsupervised problem because Rebecca has no information about how people
    have responded to marketing activity previously. There isn’t a list of people
    who were sent promotional offers in the past and a corresponding flag (label)
    indicating if they took up the offer or not. This rules out developing any type
    of predictive model built using a supervised learning approach.


    Rebecca does however, know who in the local community has been to the cinema recently.
    This is because these days, most people leave a record of their attendance via
    the payment method they used or location information from their smartphone. Once
    you have that, then a whole host of other information about those people can be
    obtained from a variety of sources.


    Two pieces of information that she thinks are particularly relevant are the age
    of filmgoers and how far from the cinema they live. Figure 10 shows a plot of
    these two items for a random sample of early bird customers.


    ![](images/00014.jpg)


    From Figure 10 two groupings (clusters) are clearly visible. Younger people who
    live close by and older people, predominately of retirement age, who live some
    distance away.


    It’s apparent from Figure 10 that there are few younger customers who live more
    than a short distance from the cinema. Also, the age range of those in cluster
    1 is quite narrow; it’s almost entirely late teens to mid-twenties. Another interesting
    feature of Figure 10 is that there is almost nobody aged thirty and fifty attending
    any of the early bird performances.


    Rebecca does not know why the clusters appear but she hazards a guess that younger
    cinema goers are predominately college students with gaps in their teaching schedules.
    They may also rely more on public transport, making it less convenient to travel
    a long way to get to the cinema. Likewise, the old folks probably have more flexibility
    in their day than the average person, have more time on their hands, have a car
    and are willing to travel further. They also tend to live in larger houses out
    in the suburbs, compared to students who tend to live in university accommodation
    nearer the cinema.

