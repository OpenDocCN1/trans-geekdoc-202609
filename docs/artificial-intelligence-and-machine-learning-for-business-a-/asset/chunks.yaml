    *   Not expect to do away with all human expertise entirely. There must be a suitably
    trained operational function that can process decisions manually when required.

    *   Have suitable governance and audit processes in place to manage and provide
    oversight of their decision-making systems. This includes developing approaches
    to identify and mitigate risks as they arise, as discussed previously.


    From a project management perspective, the requirement for governance and manual
    intervention can have a significant impact on the costs of developing and maintaining
    automated decision-making systems. If you are considering using automation within
    your organization, then this additional overhead needs to be included within the
    cost-benefit case undertaken before the project begins.


    In terms of operational usage, if you use predictive models to do things like
    deciding who you are going to fire, then you need to have people who can review
    the data used by the model and who can override the original decision if necessary.
    In fields such as insurance and credit granting, this means that you’ll need to
    retain expert underwriters who can challenge the decisions made by the organization’s
    automated underwriting systems. There also needs to be a process in place to deal
    with customer queries about automated decision-making and to supply relevant information
    to them as required by the legislation.


    ## 14. The Cutting Edge of Machine Learning


    Machine learning is an exciting and evolving subject that is being driven by new
    developments in three main areas:


    1.  **Models and Algorithms**. New machine learning approaches are being developed
    all the time. One avenue of research is looking at new types of model. Another
    seeks to improve upon existing algorithms that produce scorecards, decision trees,
    neural networks and so on, in order to improve the predictive accuracy of these
    types of model.

    2.  **Data**. Predictive models and other AI applications are only as good as
    the data used to build them. More/better data leads to better solutions. This
    is one reason why “Big Data” and machine learning are so closely related.

    3.  **Systems and software**. Improvements to the systems used to develop and
    implement automated machine learning based solutions are important since the faster
    a solution can be deployed the sooner the benefits will be realized.


    Let’s start by discussing the models and algorithms side of machine learning.
    Scorecards, decision trees and neural networks are probably the most widely used
    types of predictive model in use today. However, if you talk to the young bucks
    in Silicon Valley, they will probably laugh and then tell you that these types
    of model are somewhat “vintage” – decision trees are so 1980s! There are so many
    better types of predictive model out there these days…


    In one sense this is true. Scorecards, decision trees and neural networks are
    certainly not new. It’s also the case that on average, newer types of predictive
    model such as deep neural networks, support vector machines and ensembles, generate
    more accurate predictions, particularly in areas where complex types of decision-making
    are required.


    Scorecards and decision trees were first used commercially in the 1950s and 1960s,
    in an age when a typical computer was the size of a large desk and had less than
    1% of the computational abilities of a basic smartphone today. Therefore, these
    simple types of predictive model could be developed and implemented relatively
    easily. Computer power is much less of an issue these days, but simple models
    such as scorecards and decision trees remain very popular for the following reasons:


    *   They are “White Box” in nature. It’s very easy to understand how a score and
    hence a prediction about someone is arrived at. Likewise, it’s easy to see which
    data items contributed most significantly to the score, and which are less important.

    *   They are easy to code. Specialist software is not required to implement them.
    If resources are tight, then you can implement a scorecard or a decision tree
    as a small IT project without needing to purchase additional hardware/software,
    and without needing to employ very expensive data scientists.

    *   They still produce pretty good predictions, if not the best. Some predictive
    models are thousands of times more complex than a simple scorecard or decision
    tree. However, even the most advanced predictive models often provide no more
    than a few percent uplift over simple scorecards or decision trees, and sometimes
    none at all.


    What I want to make clear is that the big win for organizations is to make the
    leap to using automated decision-making in the first place, based on machine learning.
    The incremental benefits from using the most advanced methods available are often
    more marginal. This is particularly true where the business problems are simple
    and can be expressed precisely and concisely, such as assessing default risk on
    a loan or how likely someone is to respond to a marketing campaign. It’s the more
    complex and convoluted types of problem such as face recognition, language translation
    and autonomous driving which have benefited most from advanced forms of machine
    learning such as deep neural networks.


    If your organization does not currently use machine learning, then developing
    some simple predictive models that can be integrated into your existing decision-making
    infrastructure will give you most of the benefits. The fancy cutting-edge stuff,
    which often requires specialist hardware and/or software, will provide greater
    benefits, but not a massive amount. Therefore, don’t delay. The 80/20 rule applies.
    You’ll get 80% of the benefits for 20% of the effort.


    It’s also the case that if you can’t get a simple predictive model to work, then
    just using a more complex approach or buying some expensive hardware/software
    is unlikely to solve the underlying issues; i.e. the failure of a machine learning
    project is nearly always due to incorrect problem formulation, the underlying
    data or an organizational issue. The problem is unlikely to be due to the type
    of predictive model has been developed.


    OK. That’s the argument for keeping faith with simple models such as scorecards
    and decision trees. However, if an organization is an established user of AI applications,
    developed using machine learning, and its predictive models are responsible for
    billions of dollars’ worth of decisions each year, then there will be a drive
    to have the very best (most accurate) models possible – and with good reason.
    For a model that supports a billion dollars’ worth of decision-making each year,
    then just 0.1% uplift in performance equates to a $1m benefit. In this type of
    scenario, it would be perfectly justifiable to employ a team of data scientists
    full-time to constantly challenge and improve upon the models that the organization
    employs.


    The most advanced forms of predictive models in use today are ensemble models,
    based on complex (deep) neural networks. With an ensemble, instead of having a
    single scorecard, decision tree or neural network model, hundreds or possibly
    thousands of different models are constructed. Each model is developed using a
    different data sample and/or a different algorithm to determine the model’s parameters.
    Each model therefore, makes predictions in a slightly different way. The scores
    generated by each model will often be the same or very similar, but sometimes
    they will disagree with each other; i.e. some models will give certain cases very
    high scores, whereas other models will give the same cases much lower scores and
    vice versa.


    Using an ensemble model is a bit like having decisions made by a committee of
    experts rather than by a single expert. The reasons why the committee approach
    is better than having a single expert is twofold:

