    process. It’s not unusual for only a sample; say 1:10 or 1:100 cases to be selected
    for inclusion in the development sample.


    “Big Data Purists” may argue that you should analyze all available data because
    failing to do so may result in subtle patterns being missed, and hence sub-optimal
    models being created. In one sense they are right. If you take a sample rather
