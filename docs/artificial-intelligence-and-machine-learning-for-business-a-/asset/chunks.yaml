    From a purely statistical perspective, things like marital status, gender and
    age may indeed be correlated with things such as how well people perform in their
    jobs (And hence who to hire or fire). However, from a societal perspective, allowing
    a predictive model to drive decisions based on this type of data is ethically
    questionable and is illegal in many jurisdictions.


    A very simple and simplistic solution to problems like this is to make sure that
    certain data items are prevented from featuring in some types of predictive model
    to ensure legal compliance. The algorithm that generates a predictive model is
    directed to exclude data such as gender, race and marital status from the machine
    learning process. That’s fine, but just because a predictive model doesn’t use
    certain data items directly doesn’t mean that the model does not display unacceptable
    bias.


    A great example of this is gender discrimination in insurance. It’s a well-established
    fact that women present a lower risk than men for many types of insurance. However,
    in all countries that are members of the EU it is illegal to set insurance premiums
    on the basis of gender. Therefore, insurers don’t use gender in the claim prediction
    models that they use to set premiums. However, there are other variables that
    often act as a proxy for gender. Income is one such data item. Why? Because there
    is gender bias in income distributions. Women on average earn less than men even
    when they are doing the same job and where wage discrimination on the grounds
    of gender is illegal. If a predictive model uses income as a predictor variable
    there is an indirect effect which means that women will be treated differently
    to men. As a consequence, a predictive model may have to be designed to be sub-optimal
    in terms of predictive ability. This is to ensure that, all other things being
    equal, it generates the same predictions for men and women with the same characteristics
    and hence, complies with the law.


    Predictive models should conform with relevant legal and regulatory requirements
    – such as not displaying gender bias. However, that’s not the end of the story.
    A very easy mistake to make is to think that if it’s legal then it must also be
    ethical. Sure, there is some overlap between what’s ethical and what’s legal,
    but they are not the same thing. Good laws often seek to define behavior which
    society deems unacceptable; i.e. unethical, but at best, laws are generalizations
    of ethical behavior and are usually retrospective in nature.


    Laws also tend to address problems that occurred in the past. They don’t usually
    consider new situations before they arise. This means that there are always situations
    that are not covered by specific laws and there are almost always loopholes which
    exist to allow the unscrupulous to circumvent the law to get what they want. This
    is what people mean when they talk about the letter of the law as opposed to the
    spirit of the law.


    OK - so an organization can be acting legally but not ethically, but why should
    a business that is concerned with maximizing the bottom line be concerned by that?
    One reason is pure self-interest. There is a lot of evidence that if one is thinking
    about the long term, then adopting an ethical code of behavior delivers a real
    bottom line benefit.


    Another reason for thinking about ethical issues within the context of machine
    learning, and the data that predictive models use, is the risk of reputational
    damage. If the public decide that they don’t like the way you operate, think that
    you treat people in an underhand way, or unfairly discriminate against certain
    groups, then those sentiments can devalue a brand immensely. Simply arguing that
    your predictive model is statistically valid and legally compliant isn’t enough.
    If it comes to light that a model puts war veterans and children at the back of
    the queue for medical treatment (even though being a war veteran or a child are
    not explicit variables in the model) then you are going to be challenged about
    that – even if the decision-making process that uses the predictive model generates
    optimal patient outcomes measured across the population as a whole.


    Another way to think about this is that ethical considerations should drive a
    number of constraints within decision-making systems, which need to be given appropriate
    consideration when the system is designed.


    What should an organization do to incorporate an ethical perspective into their
    use of machine learning and automated decision-making? Unfortunately, there is
    not a clear cut answer to this question. One problem is the subjective nature
    of ethics. It’s very much a personal thing. Two people may hold opposing, but
    equally valid opinions as to what constitutes acceptable behavior. Likewise, different
    legislative regimes approach personal data and how organization can use it in
    very different ways.


    In the USA, the starting point when it comes to personal data and its use within
    automated decision-making systems is very much along utilitarian lines. Personal
    data is there to be harvested and used to maximize organizational goals e.g. maximize
    profit or minimize cost. If there is a problem using a specific type of data or
    there is unacceptable bias against a specific group, then legislation is enacted
    to address that particular concern.


    This is very different to the approach adopted by countries within the European
    Union (EU). EU citizens have control over who can hold their data and how it’s
    used. If they don’t want their data to be used for a given purpose, then that’s
    their decision, even if it leads to sub-optimal outcomes.


    These two different perspectives are one reason why US based companies such as
    Google and Facebook struggle to find common ground with regulators over how personal
    data can be gathered and used in EU countries.


    Another issue is that ethical considerations are often problem and domain specific.
    What’s acceptable in one situation is not acceptable in another. As we’ve already
    discussed, most people are probably OK with sensitive personal information such
    as their religion and sexual orientation, being used to diagnose a medical condition.
    However, using these same data items to decide who can or can’t get a mortgage
    is a far more questionable proposition.


    Given the complexity around these issues, it’s good practice for the builders
    of automated decision-making systems to undertake an ethical risk assessment as
    part of the design phase of the project. Also, many organizations are now standing
    up ethics committees to contribute to the governance process. The ethics committee
    is engaged at key points in a machine learning project and will ask those difficult
    questions that need to be asked about how the system is going to affect people.
    The ethics committee then gives its opinion on whether they believe that such
    a process aligns with their organizations ethical position, and if not, to detail
    what modifications are required to achieve that. A very simple starting point
    in this process is just to ask the following question: “Would I like this type
    of decision-making to be applied to members of my family?”


    In assessing the ethical risk associated with an automated decision-making system,
    there are three main aspects to consider:


    1. Beneficiary. Who is going to gain from the decision being made? The more the
    decision maker benefits at the expense of the individual, the greater the ethical
    risk that that decision represents. An employer deciding who to employ is making
    decisions purely for their own benefit. Jobs are not offered on the basis of the
    benefit they give to the employee.

