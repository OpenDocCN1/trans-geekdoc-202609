    Deciding who to lend money too is a far simpler problem than chess and there is
    usually a lot of labeled development data available. Therefore, you will get better
    results much more quickly with a supervised approach for problems like credit
    risk assessment. The same issue applies to any type of problem where success cannot
    be measured very quickly. If we return to the chess example, the DeepMind chess
    playing program needed to play 68 million games to become as good as it did. It
    could only do this by playing against another computer, allowing games to be played
    in a fraction of a second. It could not have achieved the same results in a reasonable
    amount of time if it had been playing against human competitors in the real world.
    The training process would have been far too slow.


    Another weakness of reinforcement learning is the cost of failure during the training
    process. If you embed a reinforcement learning algorithm into your organization’s
    recruitment policy, then you are going to get a lot of terrible hires initially
    which is going to cause all sorts of problems. In a similar vein, you wouldn''t
    want to connect a reinforcement learning algorithm directly to the controls of
    a passenger airliner.


    OK, so finding the tops of fictional hilltops and being superhuman at chess is
    all very well, but what are the real-world business applications of reinforcement
    learning? To be honest, not a huge number at the moment. Personally, I’ve never
    been involved in delivering a solution that used it and I don’t know anyone who
    has. I’ve also done a fair amount of research and found a lot of very interesting
    academic papers and enthusiastic press articles, but far fewer real world examples.
    My conclusion is that the number of reinforcement learning based solutions in
    use today is tiny compared to the number of supervised leaning ones. If I had
    to put a figure on it, I’d guess that more than 95% of real world application
    utilize supervised learning and most of the remaining 5% are unsupervised approaches
    based on clustering. However, that may change in time as the technology matures.
    Intuitively, if you have algorithms that can build something that plays chess
    or Go better than any living person, then they must have potential in other areas.


    One area where reinforcement learning looks like having an impact, is in improving
    the efficiency of sophisticated control systems in uncertain or chaotic environments.
    Complex systems such as power grids, heating systems and server farms, have lots
    of controls which are adjusted to manage different parts the system. The relationship
    between the controls and the performance of the system is not always obvious.
    It’s not a simple case of one control impacts just one thing – everything is interconnected.
    Tweaking the water pressure in the cooling system of a power plant to improve
    turbine performance has a negative impact on the efficiency of a transformer further
    down the line. Just like the chess problem, where there is an almost infinite
    number of possible games that can be played, in a power plant there are an almost
    infinite number of combinations of control settings. Reinforcement learning finds
    better ways of setting the controls through trial and error, to optimize the overall
    efficiency of the system. This mirrors the way an experienced engineer would use
    their knowledge and intuition, learnt over many years of practice, as to what
    the system wide effects of tweaking different controls are likely to be.


    Another area where reinforcement learning is showing promise is in robotics. This
    is to train robots to carry out complex manual task that could previously only
    be undertaken by a trained person. A robotic device is given the task of doing
    something like flipping burgers, sorting items or stacking shelves, and through
    trial and error they can potentially learn to do this very effectively.


    ## 10. How to Build a Predictive Model


    In this chapter we are going to melt through the keyhole to the other side...
    We’ll cross the boundary from the sane and sensible world of the everyday into
    the twisted multi-dimensional realm of the data scientist; i.e. technical specialists
    with mathematics degrees and PhDs. On our journey we are going to:


    1. Describe the process that a data scientist should follow when applying machine
    learning to develop predictive models, which are then going to be used as part
    of an automated decision-making system.

    2. Explain this process in a way that a normal person can understand. This is
    to help you keep tabs on what the data scientists are doing. This in turn will
    ensure that you get what you have asked for rather than what the data scientist
    thinks your organization needs.


    As we discussed right at the start of the book, the AI/machine learning projects
    that tend to succeed are those where business users and data scientists work hand-in-hand.
    In my experience, when data scientists have been left to “just get on with it”
    and deliver results as a coup de grâce at the end of the project, what tends to
    be delivered are sub-optimal solutions. In the worst case, they may fail to deliver
    anything useful at all.


    The vast majority of the data scientists I’ve worked with are very conscious of
    the need to involve their clients in the machine learning process and have worked
    hard to get business input to their projects. However, it’s sad to say that I
    have also seen more than one instance of deliberate attempts by data scientists
    to confuse normal people with tech speak or have avoided speaking to them all
    together. This is so that they can get on with all the important mathsy stuff
    without having to deal with those awful business people who actually have to run
    the organization on a day-to-day basis. When trying to establish if a data scientist
    is doing their job, a very simple rule to follow is:


    If they can’t explain to you in plain English what they are doing and why, then
    they have failed in their task.


    Data scientists also need to provide the business with a clear understanding of
    the real-world impacts of their work. As a business user, I have no interest in
    the fact that a predictive model is 95% accurate or that it is 10% more discriminatory
    than the process it’s going to replace. What I want to know is: how much money
    is the model going to make me, how many lives is it going to save, how many less
    staff will I need to employ, or whatever it is that’s going to impact my business
    objectives. It’s a poor data scientist who can’t express the merits of their solution
    in terms of the bottom line benefits it provides to their client.


    However, it works both ways. It’s not fair to lay everything on the data scientists.
    It’s not an unreasonable ask that business users make an effort to gain a basic
    understanding of how a data scientist goes about the machine learning process.
    As projects progress, there should be two-way exchanges of information and regular
    meetings where preliminary findings and results, problems and issues are presented
    and discussed in a non-technical business focused way. This then guides how the
    project is taken forward.

