    # Introduction to Machine Learning


    Supervised learning approaches work very well when there is a large amount of
    observation data and each observation has a clear unambiguous outcome. If there
    are no outcomes available, then unsupervised learning can sometimes prove useful;
    albeit in a somewhat different context. There are however, problems where there
    may be no observation or outcome data initially, but the learning process is able
    to assess its performance on a case-by-case basis as it goes. The model is adjusted
    each time, based on some measure of success or reward, which is calculated each
    time a task is attempted. This type of machine learning is called reinforcement
    learning.


    ## Reinforcement Learning Example


    A somewhat over-simplistic example of reinforcement learning is training a neural
    network to find the highest point in the local terrain using the least number
    of steps possible. At the start, all one knows is the current map location (longitude,
    latitude and height above sea level). The network can generate 4 possible scores,
    each representing a move forward, backwards left or right. The current state of
    being; i.e. the current location, provides the input (observation data). The resulting
    state of being, i.e. the new location after the move suggested by the network
    has been executed, is the outcome.


    After each move, the new state of being is assessed. Are we now in a better position
    (higher above sea level) than before? If the answer is yes, then the algorithm
    is deemed to have done well - the measure of reward or success is high. If not,
    then the algorithm is deemed to have performed poorly – the measure of success
    is low. The algorithm then adjusts the model weights based on the degree of success
    that its action has resulted in.


    A more refined version of this algorithm would also consider past movement history;
    i.e. where it has been, as part of the input data. It would also make sense to
    include a longer term view of future success rather than just the one move ahead
    position. For example, penalizing the success if the same location is visited
    more than once or providing a reward (increased success) for entering new, unexplored
    areas of the terrain even if the initial move into that area does not find a higher
    point initially.


    ## Comparison with Supervised Learning


    Data scientists will often talk about their being three distinct types of machine
    learning; i.e. supervised, unsupervised and reinforcement learning. However, reinforcement
    learning shares a lot of features with supervised learning. As with supervised
    learning the algorithms used in reinforcement learning deliver a model, typically
    based on some form of neural network. Likewise, the model is adjusted based on
    an assessment of outcomes that results from a given set of input data. As more
    iterations of the algorithm occur and the weights in the model are refined so
    the model’s performance improves.


    The terms “reward/success” and “failure/penalty” tend to be applied to reinforcement
    learning, but these are very similar concepts to “accuracy” and “error” that are
    used to describe how well a predictive model, developed using supervised learning,
    performs. A small error between actual and predicted values in supervised learning;
    i.e. a very accurate prediction, is broadly equivalent to a high degree success
    in reinforcement learning. In the same way, an incorrect classification or inaccurate
    prediction in supervised learning is analogous to low reward/failure in reinforcement
    learning.


    ## Case Study: Chess Playing Program


    ### Supervised Learning Approach

    A great example of the difference between supervised and reinforcement learning
    is how model training occurs to create a chess playing program. A supervised approach
    would take thousands of game moves (or sequence of moves) from previously played
    games as the observation data, with the labeled outcome data providing an indication
    of if the move was a good one or not. The scores produced by the model are used
    to indicate which piece to move and to where. The algorithm then finds the model
    weights that result in the overall best set of moves, measured against the moves
    contained in the development sample.


    ### Reinforcement Learning Approach

    With reinforcement learning, no data is provided initially – none at all! The
    model scores still indicate which move to make just like the supervised approach.
    However, initially these will be more or less random, given that there is no data
    to train the model against. Each time a move is made the status of the board (the
    new state of being) is re-evaluated. The algorithm then adjusts the weights in
    the model based on how successful its move was deemed to be.


    Evaluating how successful a move is in chess is complex and will often incorporate
    probable future states of being as well as the current one. However, for the purposes
    of this example, a simple success criteria is the difference in the value of each
    players’ pieces remaining on the board after a move has been made. If your move
    results in the taking of a high value piece, but not losing one yourself, then
    that’s a strong success. Making a move and then having one of your pieces taken
    is a failure, yielding a low measure of success. The ultimate success or failure
    is losing one’s king – checkmate. In this way, by assessing each move and adjusting
    the model weights accordingly, the program learns by itself without needing to
    be supplied with any prior information.


    ## Advantages and Limitations


    A key advantage that reinforcement learning has over supervised learning is that
    there is no limit to the set of moves that can be explored as the algorithm modifies
    the weights in the model. With supervised learning, you are limited to the labeled
    examples available in the development sample. For a game like chess, even a huge
    development sample, containing all the moves and outcomes from millions of games,
    will contain only a very tiny proportion of all possible moves. This was demonstrated
    very effectively when Google’s DeepMind AI team used two reinforcement algorithms
    to play against each other. Not only did the resulting model outperform the best
    existing chess program at the time, but during the process the algorithm discovered
    completely new strategies of play, previously unknown to human grandmasters.


    Reinforcement learning has generated a lot of excitement because the learning
    process is very much like the way living beings learn. If I’m trying to learn
    to juggle then I don’t have any information to begin with. I try, I fail, I try
    and fail again, I try and I manage to juggle for couple of seconds, and before
    you know it I’m juggling like a pro! With each attempt my brain is subconsciously
    learning more about its environment and refining its actions based on each success
    or failure; i.e. the length of time I’ve been able to keep the balls in the air
    without dropping them.


    Reinforcement learning has potential, but it does have its weakness and is better
    suited to some tasks than others. One issue is that the training algorithm is
    bounded by the speed of the trial and error process. If a reinforcement algorithm
    is being trained to make mortgage lending decisions, then the time between an
    action being taken and the assessment of how successful that action was could
    be months or years. Consequently, the training process will take far too long
    to be of practical use.

