- raw: "1.   Minimize resources. Choose the cut-off which results in exactly 50% of\
    \ heart disease cases being invited for a check-up. This means that less than\
    \ 5% of the population will be invited for a check-up because a cut-off score\
    \ above 521 would be chosen. \n\nWhich option to choose depends on what’s most\
    \ important to the health authority. If it wants to maximize the identification\
    \ of heart disease then option 1 is best. If it wants use as little resources\
    \ as possible then option 2 is better. The health authority could of course, also\
    \ choose a cut-off score that lies somewhere between these two extremes.\n\nMore\
    \ generally, in these types of situations there are two considerations when choosing\
    \ cut-offs:\n\n> •   Purity (Lift). If a high cut-off is chosen, then only a few\
    \ cases will be selected, but of those selected a high proportion will display\
    \ the characteristic you are interested in. \n\n>   \n\n> •   Volume (Gain). If\
    \ a lower cut-off is chosen, then more cases will be selected and overall more\
    \ cases of interest will be within the selected group (those above the cut-off).\
    \ However, the purity of selected cases will fall; i.e. a lower proportion of\
    \ those above the cut-off will display the characteristic you are interested in.\
    \ \n\nTo help decide on cut-off strategies and the trade-off between purity and\
    \ volume, two popular tools that are used to assess the impact of different cut-off\
    \ strategies are Lift Charts and Gains Charts. These provide an easy to use visual\
    \ representation of how a model performs.\n\nStarting with lift charts, these\
    \ provide a view of purity. Figure 13 provides an example of a lift chart for\
    \ the heart disease scorecard that was presented in Figure 2.\n\n![](images/00012.jpg)\n\
    \nIn Figure 13 the X axis shows the proportion of people invited for a check-up.\
    \ The Y axis shows the proportion of those who are invited who can be expected\
    \ to develop the disease within 5 years. The dotted straight line is the base\
    \ rate. The base rate is the percentage of people expected to develop heart disease\
    \ over the next 5 years within the population at large i.e. 6%. To put it another\
    \ way, the base rate represents a random selection strategy for inviting people\
    \ for check-ups.\n\nThe solid curved line shows what would happen if the prioritization\
    \ process for deciding who to invite for a check-up was based on the scores from\
    \ the scorecard model. For example, the graph shows that if the highest scoring\
    \ 40% of the population are invited for a check-up then about 15% of these would\
    \ develop heart disease in the future. If volumes were reduced and say, only 10%\
    \ were invited for a check-up, then the proportion (purity) would rise to around\
    \ 50%\n\nThe smaller the proportion targeted for medical intervention, the higher\
    \ the proportion with the disease. To put it another way, if you only target the\
    \ small number of people in the population with the very highest scores, then\
    \ one can expect a very high proportion of those selected to have heart disease.\
    \ If the invited group is enlarged however, by including people with lower scores,\
    \ then overall the proportion correctly identified (the purity) will fall.\n\n\
    The lift chart is therefore a way of comparing trade-offs between volume and purity.\n\
    \nHow has the lift chart been produced? Figure 14 shows an extended version of\
    \ the score distribution table for the heart disease scorecard that was first\
    \ introduced in Figure 3.\n\n![](images/00009.jpg)\n\nThe first four of the extra\
    \ columns on the right in Figure 14 show descending cumulative figures; i.e. they\
    \ show the number and proportion of cases scoring at or above a given score. The\
    \ lift (rightmost column) is calculated by dividing the cumulative number of people\
    \ with heart disease by the cumulative total. For example, the lift at a score\
    \ of 501 is calculated as:\n\n  Lift = 21,885 / 38,554 = 56.77%\n\nThis means\
    \ that 56.77% of those scoring above 501 are expected to develop heart disease.\
    \ The lift chart is then created by plotting the cumulative % of population column\
    \ against the lift.\n\nA lift chart provides a purity perspective on the population\
    \ across the range of possible cut-off scores. A gains chart on the other hand\
    \ is used to provide a volume orientated view. Figure 15 shows the gains chart\
    \ for the heart disease scorecard.\n\nThe gains chart has been produced by plotting\
    \ the cumulative percentage of the total population at or above the score, against\
    \ the cumulative proportion of heart disease cases at or above the same score;\
    \ i.e. the second and fourth rightmost columns in Figure 14. For example, in Figure\
    \ 15 it can be seen that if one invites 10% of the population for a check-up,\
    \ then that will result in about 80% of all heart disease cases in the population\
    \ being included on the invite list. Similarly, if one invites 30% of the population,\
    \ then approximately 95% of all cases will be on the invite list.\n\n![](images/00012.jpg)\n\
    \nLift charts and gains charts are very useful tools that can be produced for\
    \ any type of classification model to help business users decide how models should\
    \ be used. Similar graphs can also be produced for regression type models.\n\n\
    Data scientists will also use specific metrics to measure how good the overall\
    \ predictive accuracy of a model is. Perhaps the three most popular measures that\
    \ are used to do this are:\n\n> •   AUC (area under the curve). This is a popular\
    \ measure for evaluating classification models. Values of AUC range from 0.5 to\
    \ 1. A value of 0.5 indicates that a model has no predictive ability; i.e. is\
    \ useless. A value of 1.0 indicates a perfect predictor that gets it right every\
    \ time. The often cited GINI statistic and Somers’D are similar measures^([\\\
    [88\\]](#index_split_028.html#filepos444653)). \n\n> •   Percentage correctly\
    \ classified (PCC). This is simply the proportion of events that are correctly\
    \ classified for a given cut-off score. If an event scores above the cut-off score,\
    \ then the model predicts correctly. If a non-event occurs and it scores below\
    \ the cut-off then the model has also got it right. For the heart disease scorecard\
    \ with a cut-off of 521 the proportion of cases correctly classified was 96.4%\
    \ When people talk about “model accuracy” or the model is “X% accurate” what they\
    \ are usually referring to is the PCC. \n\n>   \n\n> •   (Adjusted) R-squared.\
    \ This is the most popular measure for evaluating regression models. It is based\
    \ on the differences between the actual and predicted values for each observation\
    \ in the development sample. An R-squared value of zero indicates that a model\
    \ has no predictive ability; i.e. is useless. A value of 1 indicates a perfect\
    \ predictor that gets it spot on every time. \n\nMeasures such as Adjusted R-squared,\
    \ AUC and PCC are used to compare the performance of different models and to assess\
    \ how model performance changes over time. When a new predictive model is built,\
    \ the performance of the old and new models are compared to see how much better\
    \ the new model is. Likewise, if two or more different types of model are developed\
    \ for a given problem, then the one with the highest AUC, PCC, R-Squared and so\
    \ on will be deemed to be the best; i.e. the most predictive.\n\nThere are literally\
    \ dozens of other metrics that people have developed to measure how well models\
    \ perform, but AUC and PCC are by far the most popular metrics for assessing the\
    \ performance of classification models, and Adjusted R-Squared is the most popular\
    \ measure for assessing regression models.\n\nIf you want to learn more about\
    \ these and other measures for assessing predictive models, then there are a host\
    \ of online resources available, including a large number of Wikipedia entries.\n\
    \n[Appendix B. Further Information and Recommended Reading](#index_split_004.html#filepos4264)\n\
    \nThe following are some of the primary internet resources for machine learning,\
    \ artificial intelligence and related technologies (Big data, data mining, etc.)"
