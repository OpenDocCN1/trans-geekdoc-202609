- raw: "1.  How often will the customer not get the right answer to their question\
    \ if it’s dealt with by the Robot Advisor? It’s based on a predictive model. Therefore,\
    \ it will get things wrong some of the time.\n\nThere will also be trade-offs\
    \ between these outcomes. You may be able to use the Advisor to reduce staffing\
    \ levels, improve service levels or a bit of both. If you want to ensure that\
    \ the system only answers queries if it is almost certain to give the right response,\
    \ then you will get far more referrals to human operators than if you are willing\
    \ to accept a high error rate. If a threshold is set to only to respond to customers\
    \ if the probability of the system giving the right answer is say, above 99%,\
    \ you will get far more referrals to human underwriters than if you set the threshold\
    \ at 80%. The issue then is one of customer service. If you set the threshold\
    \ at 80%, then up to 20% of customers are going to be dissatisfied because the\
    \ system will give them the wrong answer in 1 out of every 5 cases^([\\[53\\]](#index_split_028.html#filepos429588)),\
    \ as opposed to 1 in 100 cases.\n\nTo be able to answer questions like this and\
    \ formulate appropriate decision rules (Stage 9), the data scientist will need\
    \ to gather information about the operational nature of the organization. This\
    \ is so that they are able to quantify the business benefits of their work. Otherwise,\
    \ how can they justify the value of what they have done?\n\nIf it’s all about\
    \ saving cost or increasing profit (which it almost always is) then in this example,\
    \ the data scientist would need to find out how long different calls types typically\
    \ last and how much each call costs the company. This, combined with figures about\
    \ the proportion of calls that will be automated and the costs of developing the\
    \ system, will enable a cost-benefit analysis of the Robot Advisor project to\
    \ be undertaken.\n\nSo far in this chapter we have focused on the process for\
    \ applying machine learning. But how long is it going to take a data scientist\
    \ to deliver a predictive model to you? That’s very much a loaded question. Lots\
    \ of solution suppliers will tell you that they can develop models for you in\
    \ just a few minutes. “All you need to do is upload your data to our cloud-based\
    \ AI solution and we’ll give you answers in seconds!” That’s sort of true, but\
    \ you need to consider the context within which machine learning is being applied.\
    \ To have results in minutes, you need to have all of your data nicely collected\
    \ in one place. You need to be not too fussed about how the model’s predictions\
    \ are arrived at, how they are delivered or in what format. If you have multiple\
    \ complex databases which need to be brought together, have lots of messy data\
    \ and it’s important that the resulting model conforms with various legislation\
    \ and business requirements, then that’s a different story. It could be many weeks,\
    \ months or even years before a suitable solution is arrived at.\n\n[11\\. Operationalizing\
    \ Machine Learning](#index_split_004.html#filepos4264)\n\nSome organizations have\
    \ been using machine learning for decades. This is particularly true in the financial\
    \ services industry and in the marketing departments of large consumer-facing\
    \ organizations such as supermarkets chains and department stores. For the Silicon\
    \ Valley brigade, which includes companies such as Amazon, Google and Facebook,\
    \ machine learning is at the very heart of everything they do. These organizations\
    \ have well-established IT infrastructures, systems and processes for applying\
    \ machine learning and implementing the results. They do it day in, day out –\
    \ it’s just business as usual.\n\nFor organizations who are new to artificial\
    \ intelligence and machine learning, building a predictive model for the first\
    \ time and then operationalizing it as part of an automated decision-making system\
    \ can be a difficult task. Sometimes, it can take several months before the required\
    \ data is ready and the machine learning process can begin. However, gathering\
    \ the right data and then applying the relevant machine learning algorithms, as\
    \ discussed in the previous chapter, are often the easiest parts of a machine\
    \ learning project. This is because, at the end of the day, a predictive model\
    \ is nothing more than a set of equations captured in a spreadsheet, a word document\
    \ or other software. Once the machine learning process is complete, the results\
    \ need to be operationalized if they are going to be of use.\n\nThe main challenge,\
