- raw: 'One of the most common, and arguably the first, application of machine learning
    is prediction. It’s about using machine learning to determine something that you
    don’t currently know, based on the information that you currently have available.
    The patterns that one finds relate to the relationships between behaviors and
    outcomes. Very often this relates to people’s past behavior and what they subsequently
    went on to do. Having identified the relationships that exist, it is then possible
    to make predictions about someone’s future behavior based on their current state
    of being. If you give me a sample of peoples’ previous purchasing history, I can
    utilize machine learning to identify patterns in their purchase behavior. I can
    then use these patterns to predict what goods someone is likely to buy next; i.e.
    future purchases are the outcome that I want to predict. This allows me to target
    them with tailored promotional offers for those specific products.


    Using machine learning for prediction is sometimes referred to as predictive modelling
    or Predictive Analytics (PA). In fact, predictive analytics is such a common application
    of machine learning that many people (rightly or wrongly) often use the two terms
    interchangeably.


    Predicting the future behavior of individuals is what people usually associate
    with machine learning, but there are other situations and problems to which machine
    learning can be applied. All you need is some unknown event or thing that you
    want to determine (predict), and this could be in the past, present or future.
    Doctors examine their patients, carry out tests and question them about their
    symptoms in order to gather evidence (data). They then use this data to come to
    a view as to what they think is wrong with the patient. They are not making a
    prediction about the patient’s future health but trying to work out what’s wrong
    with them today. Doctors can do this with a high degree of accuracy because they
    cross reference the patient information that they have obtained against what they
    have learnt from years of training and practice. In other words, they are looking
    for how the patient’s symptoms correlate with their knowledge of known illnesses.
    Machine learning can be applied in the same way. Given a host of detailed information
    about the symptoms of different illnesses, machine learning can be used to estimate
    the probability that someone has a certain condition, based on the symptoms that
    they present.


    Another way to think about machine learning/predictive analytics is as a method
    of reducing uncertainty. There are a whole host of possible outcomes that could
    occur in any given situation. Machine learning won’t tell you with absolute certainty
    which outcome will occur, but it can provide some insight into the likelihood,
    or odds, of each outcome.


    You may know that when someone goes grocery shopping they often buy bread, wine
    and chicken, but with machine learning you can determine that there is say, an
    80% chance that the next product they buy is bread, a 15% chance that they buy
    wine and a 5% chance that they buy chicken. Therefore, if you want to encourage
    them to make their next purchase in your store, you are far more likely to win
    their custom with a bread offer rather than a wine or chicken offer.


    A predictive model (or just model going forward) is the output generated by the
    machine learning process. The model captures the relationships (patterns) that
    have been uncovered by the analytics process. Once a model has been created, it
    can be used to generate new predictions. Organizations then use the model’s predictions
    to decide what to do or how to treat people. So, machine learning is a process
    and a predictive model is the end product of that process.


    There are lots of different types of predictive model, and there are dozens, if
    not hundreds, of machine learning techniques and algorithms that can be used to
    generate a model. However, regardless of the type of model or the mathematics
    used to create it, a model’s predictions are almost always represented by a number
    - a score. The higher the score the more likely someone is to behave in the way
    the model predicts, the lower the score the less likely they are to behave in
    that way.


    Machine learning can be applied in all sorts of situations and to many types of
    problem. However, the most common business applications of machine learning, and
    the ones that are the main focus of this book, relate to what people are going
    to do or how they will behave in the future, based on what you know about them
    today^([\[1\]](#index_split_028.html#filepos405848)).


    One very well-known application of machine learning is credit scoring. When someone
    wants a loan, credit card or mortgage the lender asks the individual questions
    about themselves and their lifestyle. They then combine this with information
    from a credit report containing details about the individual’s previous borrowing
    history, provided by a credit reference agency such as Experian or Equifax^([\[2\]](#index_split_028.html#filepos406272)).
    The information is then fed into a predictive model to generate a credit score.


    If you live in the USA you will probably be familiar with FICO and/or Vantage
    scores. A high score (>750) is a prediction that someone is very likely to repay
    any money they borrow; i.e. that they are creditworthy. A low score (<500) indicates
    that someone is very uncreditworthy. Banks and finance companies the world over
    use similar credit scoring methods.


    Another common application of machine learning is target marketing. Given information
    about someone’s age, gender, income, web-browsing, purchase history, location
    and so on, a marketing department can predict if the person is interested in a
    particular product or not. They then use that prediction to decide whether or
    not to target them with promotional offers. Likewise, predictive models can also
    be used to infer how much people are willing to pay for products like insurance.
    This information is then used to tailor a personalized pricing strategy to each
    person’s individual circumstances.


    A further example of machine learning in action is preventative health care. Traditional
    health care systems are reactive. People seek medical assistance when they feel
    ill. Doctors then do their best to treat the illnesses they are presented with
    – treatments that can be very costly and time consuming. These days, advanced
    health care systems are increasingly focusing their attention on prevention rather
    than cure. This vastly reduces costs and improves patient outcomes. Machine learning
    is used to assess people’s medical records and predict the likelihood of them
    developing specific conditions such as heart disease or diabetes, often years
    in advance. Individuals who come at the top of the pile; i.e. those that the model
    predicts are most likely to get the disease, are contacted with a view of initiating
    preventative action. For example, making lifestyle changes or taking preventative
    medication.


    A final example of machine learning in action is determining what type of news
    (and other) articles to recommend to people. Social media providers use machine
    learning to analyze what articles you’ve read in the past and the type of topics
    you discuss with friends. This then drives the content that they promote to you.'
