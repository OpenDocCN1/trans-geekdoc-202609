  trans: '


    从纯统计学的角度来看，婚姻状况、性别和年龄等因素可能与人们的工作表现（并由此决定录用还是解雇）相关。然而，从社会学的角度来看，允许预测模型基于此类数据来驱动决策，在伦理上是有疑的，而且在许多司法管辖区是违法的。


    解决此类问题的一个非常简单且简单化的方案是确保防止某些数据项出现在某些类型的预测模型中，以确保法律合规。生成预测模型的算法被指导在机器学习过程中排除性别、种族和婚姻状况等数据。这本身没问题，但仅仅因为预测模型没有直接使用某些数据项，并不意味着该模型没有显示出不可接受的偏见。


    保险业中的性别歧视就是一个很好的例子。众所周知的事实是，对于许多类型的保险，女性的风险确实低于男性。然而，在所有欧盟（EU）成员国，根据性别设定保费都是违法的。因此，保险公司在用于设定保费的理赔预测模型中未使用性别。但是，还有其他变量经常作为性别的代理。收入就是其中一种数据项。为什么呢？因为收入分配中存在性别偏见。即使在女性从事相同工作且基于性别的工资歧视违法的情况下，女性的平均收入仍低于男性。如果预测模型将收入作为预测变量，就会产生一种间接影响，这意味着女性受到的待遇与男性不同。结果，预测模型可能被设计成在预测能力上是次优的。这是为了确保在其他条件相同的情况下，它对具有相同特征的男性和女性生成相同的预测，从而符合法律。


    预测模型应该符合相关的法律和监管要求——例如不显示性别偏见。然而，这并不是故事的结束。一个很容易犯的错误是认为，如果某事是合法的，那么它也一定是合伦的。诚然，伦理和法律之间确实存在一些重叠之处，但它们并非同一一物。良好的法律通常试图定义社会认为不可接受的行为；即不符合伦理的行为；但充其量，法律仅仅是伦理行为的通用概括，并且通常具有追溯性特征。


    法律也倾向于解决过去发生的问题。它们通常不会在新的情况出现之前进行考虑。这意味着总会有某些特定法律未涵盖的情况，而且几乎总是存在漏洞，让那些心术不正的人能够规避法律以达到自己的目的。这就是人们在谈论“法律条文”与“法律精神”的区别时的含义。


    好吧——所以一个机构的行为可能是合法的，但不符合伦理的，但一家关注底线最大化的企业为什么要担心这一点呢？一个原因是纯粹的自私。有大量证据表明，如果考虑长期利益，那么采用伦理行为准则会带来真正的底线收益。


    在机器学习以及预测模型所使用的数据背景下考虑伦理问题的另一个原因是声誉受损的风险。如果公众决定他们不喜欢你的运营方式，认为你对待人们的方式不正，或者对某些群体存在不公平的歧视，那么这些情绪会极大地损害品牌价值。仅仅辩称你的预测模型在统计上是有效的且符合法律规定是不够的。如果被发现某个模型让退伍军人和儿童在医疗治疗的队列中靠后（尽管退伍军人或儿童并不是模型中的显性变量），那么你将对此面临挑战——即使使用该预测模型的决策过程在全人口衡量中产生了最优的患者结果。


    考虑这种问题的另一种方式是，伦理考量应该驱动决策系统中的若干约束条件，这些条件在设计系统时需要被适当的考虑。


    机构应该采取什么措施将伦理视角融入到机器学习和自动化决策的使用中？遗憾的是，这个问题没有一个明确的答案。一个问题是伦理的主观性。它很大程度上是个个人问题。两个人对于什么构成可接受的行为可能持有相反但同样充分的意见。同样，不同的法律体系在处理个人数据以及机构如何使用这些数据方面有非常不同的方法。


    在美国，涉及个人数据及其在自动化决策系统中的应用的起点非常符合功利主义路线。个人数据的存在是为了采集和使用，以实现组织目标的最大化，例如利润最大化或成本最小化。如果使用特定类型的数据存在问题，或者对特定群体存在不可接受的偏见，就会制定立法来解决该特定问题。


    这与欧盟（EU）内部国家采用的方法非常不同。欧盟公民对谁可以持有他们的数据以及如何使用数据拥有控制权。如果他们不想让数据用于特定用途，那就是他们的决定，即使这会导致次优的结果。


    这两种不同的观点是为什么像 Google 和 Facebook 这样的美国公司在欧盟国家如何收集和使用个人数据方面难以与监管机构达成共识的原因之一。


    另一个问题是，伦理考量通常是特定于问题和领域的。在一种情况下是可以接受的，在另一种情况下则是不可接受的。正如我们已经讨论过的，大多数人可能对宗教和性取向等敏感个人信息用于诊断医疗状况是可以接受的。然而，使用这些相同的数据项来决定谁可以或无法获得贷款则是一个可疑得多的命题。


    鉴于这些问题的复杂性，自动化决策系统的构建者在项目设计阶段进行伦理风险评估是一种良好的做法。此外，许多机构现在正建立伦理委员会以参与治理过程。伦理委员会在机器学习项目的关键节点介入，并就系统将如何影响人们提出必须提出的困难问题。然后，伦理委员会会给出意见，判断他们认为这种过程是否符合组织的伦理立场，如果不符合，则详细说明实现该目标需要进行哪些修改。这一过程中一个非常简单的起点就是问这样一个问题：“我是否希望这种决策方式被应用于我的家庭成员身上？”


    在评估与自动化决策系统相关的伦理风险时，有三个主要方面需要考虑：


    1.受益者。谁将从所做的决策中获益？决策者牺牲个人利益获得的收益越多，该决策所代表的伦理风险越大。雇主在决定雇用谁时，其决策纯粹是为了自己的利益。提供工作并不是基于它带给员工的利益。


    '
