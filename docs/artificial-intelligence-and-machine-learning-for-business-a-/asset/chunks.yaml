  trans: '


    ## AI 问题的分类


    - **“简单”AI 问题**：这些问题有一个单一的目标或想要确定的某个对象，且易于量化。对于分类问题，这意味着结果可以表示为简单的“是”或“否”，例如：某人是否会发生贷款违约？对于回归问题，结果是否可以表示为单个数字？例如：某人上次在商店里花费了多少钱。

    - **“复杂”AI 问题**：这些问题通常有多个且非常细微的目标。“复杂”问题的经典例子包括目标识别、语言翻译和游戏对战（例如国际象棋或围棋）。这还包括需要结合使用多种机器学习方法的问题，例如在自动驾驶汽车和数字个人助手中。


    情况并不总是这样界限分明，但作为一条经验之谈，这是一个很不坏的起点。


    ## 业务应用与背景


    你可能会遇到的大多数业务应用（目标营销、信用评分、雇佣/解雇决策、交友网站上的匹配等）都属于“简单 AI”类别。一个仅跨越两层、包含几百个神经元的网络就绰有余了，其性能可能与设计良好的评分卡类型模型相当，甚至略好。然而，你永远无法完全确信。与机器学习的其他方面一样，给那些为你构建预测模型的人的建议是：尝试许多不同的方法，然后看哪种最符合你的需求。这既涉及原始的预测准确性，也涉及业务需求/限制。如果业务或法律要求模型输出必须让门外汉也能理解，那么你能用简单的语言解释模型为什么会给出那个分数吗？


    数据科学家应该始终使用像评分卡这样的简单方法作为初始基准，然后尝试使用更复杂/更先进的方法进行改进。


    ## 9. 无监督学习与强化学习


    我们目前为止讨论的机器学习技术都假设存在开发样本，其中包含了观测数据和结果数据。对于心脏病问题，开发样本中每个患者的数据都标记了标签，以识别他们随后是否患了心脏病。通过描述各种机器学习算法的应用，来寻找观测数据与结果数据之间存在的关系。这些关系随后以评分卡、决策树或神经网络模型的形式捕获。生成的模型就可以根据关于这些人的已知信息，预测他们未来患上心脏病的概率。


    应用于已标记数据的机器学习（即开发样本中的每个案例同时具有观测数据和结果数据）被称为**监督学习**。你在业务世界中遇到的绝大多数 AI/机器学习应用，如目标营销、欺诈检测和员工审查，都是监督学习的示例。如果你有可标记数据，那么监督方法通常是正确的选择，并会产生最好的结果。


    然而，存在某些类型的问题，其结果数据非常有限或不存在——只有未标记的观测数据。因此，虽然这本书主要关于监督学习，但花些时间考虑在这种情况下可以做什么是值得的。


    ### 无监督学习


    当结果数据不可时，可以应用一组被称为**无监督学习**的技术。无监督学习的一个关键特征是它主要用于知识发现；即检测数据中的有趣特征。这与监督学习形成了对比，后者通常与使用匹配的观测数据预测结果相关。


    这在实践中意味着，无监督学习方法非常擅根据事物之间的相似性来识别和分组，但它们并不能提供告诉你某人或某物将如何表现的预测。因此，监督学习和无监督学习的目标与输出是非常不同的。在监督学习中，最终目标是某种预测模型。该模型可以用于预测当新案例出现时的行为。而在无监督学习中，输出是数据结构的表示，这完全是另一回事。


    ### 聚类


    今天最常用的无监督学习类型是**聚类**。聚类的目标是识别数据内部的相似性和/或连接，以便你可以将相似的案例分（聚）在一起。其想法是，由于给定簇中的案例具有许多非常相似的属性，你可以以类似的方式对待该簇中的每个人。


    为了说明聚类的实际运作，考虑一下 Rebecca，她是一家位于大学城的影院综合体的经理。她的大多数客户在晚上和周末看电影。这可能是因为他们在其他时间在工作或上学。然而，她确实在周中提供一些早场，尽管这些场次的参与率并不高。Rebecca
    想更多地了解参加这些周中场次的人群类型。她可以针对当地社区中相似的人投放促销优惠，这些人可能在那个时间看电影，从而提高影院的观众人数。


    这是一个无监督问题，因为 Rebecca 没有关于人们之前对营销活动做出何反应的信息。没有过去发送过促销优惠的人员列表，也没有相应的标记（标签）来指示他们是否接受了优惠。这排除了开发任何使用监督学习方法构建的预测模型。


    然而，Rebecca 知道当地社区中谁最近去过影院。这是因为现在大多数人都会通过他们使用的支付方法或智能手机的位置信息留下活动记录。一旦你有了这些信息，就可以从各种来源获得关于这些人的大量其他信息。


    她认为特别相关的两个信息是影迷的年龄和他们离影院的距离。图 10 显示了随机抽取早场客户这两项内容的分布图。


    ![](img/00014.jpg)


    从图 10 可以清楚地看到两个分组（簇）。住在较近的年轻人，以及住在较远地方、主要是退休年龄的老年人。


    从图 10 可以看出，住在影院短途距离之外的年轻客户很少。此外，簇 1 中人员的年龄范围相当窄；几乎完全是青少年后期到二十五岁。图 10 的另一个有趣特征是，几乎没有三十岁和五十岁的人参加任何早场演出。


    Rebecca 不知道为什么会出现这些簇，但她大胆推测道，年轻的影院观众主要是教学日程上有空隙的大学生。他们也可能更依赖公共交通，这使得走很远路去影院变得不方便。同样，老年人的一天可能比普通人更有弹性，有更多时间，有车，并且愿意走得远一些。与倾向于住在离影院近的大学宿舍的学生相比，他们也倾向于住在郊区的大房子里。


    '
