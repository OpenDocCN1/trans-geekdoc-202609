- raw: "^([\\[32\\]](#index_split_014.html#filepos134723)) i.e. the output from a\
    \ single neuron (and also a neural network with no second layer) is equivalent\
    \ to logistic regression, which is a popular statistical method used in machine\
    \ learning for finding the points associated with a scorecard.\n\n^([\\[33\\]](#index_split_014.html#filepos137765))\
    \ This assumes a network with 74 neurons in the first layer and one neuron in\
    \ the second (output) layer. In the first layer, each of the 74 neurons has one\
    \ weight for each of the 100 input variables (7,400 weights). The neuron in the\
    \ output layer has 74 weights, one for each of the outputs from the first layer\
    \ of neurons. Hence 7,474 weights in total.\n\n^([\\[34\\]](#index_split_014.html#filepos144633))\
    \ This is because standard neural networks, where all the inputs are provided\
    \ to every neuron in the first layer, do not account for the spatial nature of\
    \ images. For example, the pixels at the top left of an image often have no relation\
    \ to the pixels at the bottom right. Therefore, it makes sense not to provide\
    \ all inputs to every neuron. \n\n^([\\[35\\]](#index_split_014.html#filepos145997))\
    \ Google Research Blog (2016). ‘AlphaGo: Mastering the ancient game of Go with\
    \ machine learning.’\n\n [https://research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html](https://research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html).\
    \ Accessed 06/04/2018.\n\n^([\\[36\\]](#index_split_015.html#filepos153375)) There\
    \ are also forms of supervised clustering. One such example is the popular K-nearest\
    \ neighbour approach. When a prediction is required for a new case, the algorithm\
    \ finds the K cases in the development sample that are most similar to it. The\
    \ model score is calculated as the proportion of the K cases which displayed the\
    \ behavior (outcome). If K=200, then the algorithm would find the 200 cases most\
    \ similar to the case a prediction is required for. If say, 18 out of the 200\
    \ cases display the behavior, then the score is 0.09 (18/200). What value of K\
    \ to use is usually determined by trial and error.\n\n^([\\[37\\]](#index_split_015.html#filepos158825))\
    \ There are analytical tools that can collapse a large number of data items into\
    \ a 2 or 3-dimensional representation, which captures the most important features\
    \ of those data items. Examples of these methods include principle component analysis\
    \ and Self-Organizing Maps (SOMs).\n\n^([\\[38\\]](#index_split_015.html#filepos159246))\
    \ Experian’s Mosaic classifications also exist in US, Germany and many other countries.\
    \ A host of other companies offer similar clustering based customer profiling\
    \ products.\n\n^([\\[39\\]](#index_split_015.html#filepos161193)) Typically, this\
    \ would be achieved by subtracting the mean value of the variable and then dividing\
    \ by the standard deviation.\n\n^([\\[40\\]](#index_split_015.html#filepos161956))\
    \ [http://www.experian.co.uk/blogs/latest-thinking/consumer-segmentation-new-data-means-new-insight/](http://www.experian.co.uk/blogs/latest-thinking/consumer-segmentation-new-data-means-new-insight/)\
    \ accessed 18/03/2018.\n\n^([\\[41\\]](#index_split_015.html#filepos162237)) It’s\
    \ very difficult to decide up front what the right number of clusters should be.\
    \ Therefore, trial and error is usually applied. The clustering algorithm is run\
    \ several times with difference values of K. For each value of K the properties\
    \ of the resulting clusters are examined, and if deemed to be sufficiently interesting\
    \ (the clusters have noticeably different features) then that’s the value of K\
    \ to use. If there too many clusters, then some of the clusters tend to be very\
    \ similar. If there are too few clusters, then the solution may provide insufficient\
    \ granularity.\n\n^([\\[42\\]](#index_split_015.html#filepos163515)) The cluster\
    \ center is calculated as the point where the sum of distances between that point\
    \ and all of the cases in the cluster is a small as it can be.\n\n^([\\[43\\]](#index_split_015.html#filepos165474))\
    \ [https://zbmath.org/about/](https://zbmath.org/about/) \n\n^([\\[44\\]](#index_split_015.html#filepos165631))\
    \ 869,666 papers were added to the medline database in 2016. [https://www.nlm.nih.gov/bsd/stats/cit\\\
    _added.html](https://www.nlm.nih.gov/bsd/stats/cit_added.html) Accessed 04/04/2018.\n\
    \n^([\\[45\\]](#index_split_015.html#filepos172400)) In chess, a standard value\
    \ assigned to a pawn is 1, a bishop 3, a rook (castle) 5 and so on. Therefore,\
    \ a simple view of the game can be determined by summing up the value of each\
    \ players pieces remaining on the board. An actual assessment of who is winning\
    \ during a game is of course far more complex than this. All advanced chess programs\
    \ consider the position of the pieces as being just as important, if not more\
    \ so. However, a simple points based measure of success is very easy to understand\
    \ and calculate.\n\n^([\\[46\\]](#index_split_015.html#filepos173820)) Knapton,\
    \ S. and Watson, L. (2017). ‘Entire human chess knowledge learned and surpassed\
    \ by DeepMind's AlphaZero in four hours.’ The Telegraph. [https://www.telegraph.co.uk/science/2017/12/06/entire-human-chess-knowledge-learned-surpassed-deepminds-alphazero/](https://www.telegraph.co.uk/science/2017/12/06/entire-human-chess-knowledge-learned-surpassed-deepminds-alphazero/)\
    \ Accessed 09/04/2018.\n\n^([\\[47\\]](#index_split_015.html#filepos176413)) Actually,\
    \ you can – if you use a flight simulator rather than a real plane. This type\
    \ of approach is one that a number of organizations are pursuing in their developing\
    \ of autonomous vehicles.\n\n^([\\[48\\]](#index_split_016.html#filepos195690))\
    \ If they are included in the machine learning process then the accuracy of the\
    \ model will be seen to improve in terms of overall accuracy, but that will not\
    \ be representative of the accuracy of the model as measured on the rest of the\
    \ population. \n\n^([\\[49\\]](#index_split_016.html#filepos197291)) A naïve way\
    \ to sample is just to randomly take say, 1 in 10 or 1 in 100 of all cases. A\
    \ much better approach is to apply stratified sampling. One takes a large proportion\
    \ of the cases of most interest, and a far smaller proportion of less important\
    \ cases. If you are trying to predict who repays or defaults on a mortgage, then\
    \ the most relevant cases are those that default and typically there are not many\
    \ of these – they are rare events. Therefore, you would sample all of the default\
    \ cases but only a small proportion of the non-defaults.\n\n^([\\[50\\]](#index_split_016.html#filepos201170))\
    \ Standard deviation would be the obvious choice.\n\n^([\\[51\\]](#index_split_016.html#filepos206715))\
    \ One “school boy” type error that might have caused this is predicting the inverse\
    \ of what was intended; i.e. the model scores represent the probability of people\
    \ repaying their mortgages, not the probability of them defaulting. When the model\
    \ predicts that default probability is very low, say 0.001% then actually it’s\
    \ the opposite – the probability is 99.999%!!!\n\n^([\\[52\\]](#index_split_016.html#filepos212195))\
    \ The conversion of the customers’ speech into a numeric format would itself be\
    \ undertaken using a machine learning derived model. This preliminary model would\
    \ identify what words are spoken and replace the actual words with a numeric reference.\
    \ These numeric references are what would then be used to create various data\
    \ items that feed the decision-making model under discussion.\n\n^([\\[53\\]](#index_split_016.html#filepos214939))\
    \ 1 in 5 is actually the marginal error rate. In practice, the error rate will\
    \ be lower than this because some of the calls will be answered where the probability\
    \ is between 80 and 100%\n\n^([\\[54\\]](#index_split_017.html#filepos232362))\
    \ For example, the individual in question had moved overseas and was therefore\
    \ beyond the reach of the tax authorities. Likewise, the system often identified\
    \ people who had become bankrupt. Even though these people technically owe a lot\
    \ of tax, the tax is uncollectable due to the bankruptcy which has resulted in\
    \ the person’s debts being written off by the courts."
  fmt: "\ni.e. the output from a single neuron (and also a neural network with no\
