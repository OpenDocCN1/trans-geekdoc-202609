    Once the analytical process is complete and a predictive model is available, then
    it can be transferred to the area where it will be implemented. Assuming model
    implementation was given due consideration at the right point in the project,
    then this should be a relatively smooth process. This is because the necessary
    software and IT should already have been deployed, and operational staff briefed
    about how things will change when the model comes on-line.


    Implementing an automated decision-making process using models developed via machine
    learning is a great achievement, particularly if it’s something new for the organization
    in question. However, that’s not the end of the process. Once a model goes live,
    the decision-making process needs to be the subject of regular review to assess
    how well the model is predicting and to ensure that the right cut-offs and decision
    rules continue to be applied.


    Monitoring is required because a model’s predictive accuracy tends to decline
    over time due to changes in the underlying relationships between the data used
    to construct the model and the outcome being predicted. Monitoring usually involves
    producing a set of reports showing how accurate the predictions made by the model
    proved to be. When model accuracy begins to fall, then that indicates that it’s
    time for a new model to be developed.


    Fall in predictive accuracy as models age is the primary reason why models need
    to be redeveloped, but predictive models are also redeveloped for other reasons.
    Sometimes there are legal or regulatory changes that mean that certain data items
    in a model can no longer be used. Likewise, new data sources become available,
    holding out the promise that more accurate models with greater predictive power
    can be constructed.


    Another reason for carrying out regular model monitoring is to assess how the
    model based decisions affect different groups within the population. If the marketing
    department of a bank wants to target people with a certain geo-demographic profile
    with a new type of credit card, then it’s important for the bank to understand
    how its credit scoring models treats those types of people. The last thing the
    bank wants to do is undertake a huge marketing campaign for new customers and
    then see all those that apply for the new card being declined.


    Likewise, if a model is involved in making important life changing decisions about
    people, then it’s prudent to monitor the model to ensure that any biases it displays
    are acceptable. If an HR department is using a model to screen job applicants
    and it is found to be rejecting a higher than average proportion of people from
    ethnic minorities or women, then that will need to be investigated and remedial
    action taken if necessary.


    ## 12. The Relationship Between Big Data and Machine Learning


    Since about 2010, “Big Data” has become the ubiquitous term used to describe all
    the data that is generated by people from their smartphones, web browsing history,
    social media and purchasing behavior, together with any other information that
    organizations hold about them.


    Why is Big Data different to any other type of data? In one sense there isn’t
    a difference; it’s all just zeros and ones at the end of the day. However, the
    term “Big Data” tends to be applied to large collections of different types of
    data which are often volatile and changeable, and where one would struggle to
    analyze it using traditional computer hardware and software.


    It’s also the case that Big Data often incorporates certain types of data that
    were not widely used for customer analysis until relatively recently. In particular,
    Big Data includes:


    *   **Text**. What people write and say can be analyzed to identify what they
    are talking about and the sentiments being expressed. If a product is being discussed
    in a positive or negative context, this is likely to be predictive of whether
    someone goes on to buy that product.

    *   **Images**. This covers photos and video, as well as medical imaging. One
    application of machine learning is to use features identified in scans and x-rays
    to predict the likelihood that someone has a specific disease.

    *   **(Social) network data**. This is information about people’s connections
    and who they know. Network data includes the number and type of connections that
    people have, as well as data about connected individuals. If all your friends
    are sci-fi geeks, that’s probably a good indication that you might be one too.

    *   **Geospatial**. Information about people’s location and movements, provided
    by smartphones, in car GPS systems and other mobile devices.

    *   **Biometrics**. Data about blood pressure, heart rate and so on, collected
    from fit bands, smart watches and so on.

    *   **Product (machine) generated**. Everyday devices from televisions to coffee
    makers are being designed to share information between themselves and over the
    internet. These days your heating, kettle, washing machine and so on, can all
    be controlled via your smartphone. The “Internet of Things” (IoT) concept is still
    developing but may eventually provide lots of data that can be used to infer people’s
    behavior using machine learning.


    In the “good old days” back in the 1990s smart devices didn’t exist. Few people
    even had a cell phone back then and the internet was still in its infancy. Very
    little electronic data about people or their activities existed. What there was,
    was usually limited to a few geo-demographics such as address, age, income, gender
    and so on. This may then have been supplemented by data supplied from a direct
    marketing company or a credit reference agency if financial services products
    were involved (e.g. arrears status on loans and credit cards). Supermarkets had
    no idea what individual customers bought each week, insurance companies didn’t
    know how people drove and health services held most of their patient records in
    paper files.


    Life for a data scientist back then was pretty straightforward because all of
    this (very limited) electronic data was usually held in a nice neat format of
    rows and columns (like one would find in a spreadsheet). The data was also relatively
    static. It was usually only updated very infrequently and at regular intervals–
    typically at month or year end.


    In today’s world, data is being updated much more frequently, often in real time.
    In addition, a lot more of it is “free form” unstructured data such as speech,
    e-mails, tweets, blogs, pictures and so on.


    Another factor is that much of this data is often generated independently of the
    organization that wants to use it. This is problematic for many reasons. One is
    that if data is captured or generated by an organization itself, then they can
    control how that data is formatted. They can also put checks and controls in place
    to ensure that the data is accurate and complete. However, if data is being generated
    by external sources then there are no guarantees that the data is correct.


    Externally sourced data is often “Messy.” It requires a significant amount of
    work to tidy it up and to get it in a useable format. In addition, there may be
    concerns over the stability and ongoing availability of that data, which presents
    a business risk if it becomes part of an organization’s core analytical and decision-making
    capability.


    What this means is that traditional computer architectures (hardware and software)
    that organizations use for things like processing sales transactions, maintaining
    customer account records and invoicing, are not well suited to storing and analyzing
    all of the new and different types of data that are now available. Consequently,
    over the last few years a whole host of new and interesting hardware and software
    solutions have been developed to deal with these new types of data.


    In particular, modern Big Data computer systems are very good at:

