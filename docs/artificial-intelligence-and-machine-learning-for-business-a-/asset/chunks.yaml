  fmt: '

    Although very simple, the information in Figure 10 can help Rebecca formulate
    a marketing strategy tailored to each of the two customer groups. This could be
    in terms of:


    * What films individuals in each group are targeted with.

    * Travel offers reflecting different modes of transport used to get to the cinema.

    * Discounts on extras that are likely to appeal to each group (maybe soda/beer
    for younger people and coffee/tea/wine for the seniors).


    Equally importantly, Rebecca knows that the early bird cinema audiences contain
    very few people of “middle age.” Hence, she should not waste her marketing budget
    trying to persuade them to come to the cinema.


    The cinema scenario illustrates the concept of clustering in a very simple way,
    using just two items of information. The same principles can be applied when there
    are hundreds or thousands of data items available about people, but it’s just
    not very easy to represent the clusters graphically once you have more than `2
    or 3` items of data. Finding out how many clusters there are in the data and what
    the features of those clusters are, is a fundamental part of the clustering process.


    ### Commercial Applications of Clustering


    There are many commercial products based on clustering. Experian’s `Mosaic` product
    assigns all 1.8 million postcodes (zip codes) in the UK to one of `66` clusters.
    Experian gives each cluster a title such as “Uptown elite”, “Low income workers”
    and “Classic grandparents” to represent the types of people who typically live
    in those areas. Geo-demographic information about the average age, wealth, number
    of kids, credit usage and so on is provided for the inhabitants living in the
    postcodes of each cluster. Organizations then tailor their customer engagement
    strategy to match the demographics of the people in each postcode. This works
    because people living in households in the same neighborhood tend to have similar
    demographics. If you are a highly paid banker living in an area classified as
    “Uptown elite” then it’s far more likely that your neighbors are also highly paid
    professionals as opposed to families surviving on benefits or the minimum wage.


    ### Clustering Algorithms


    Many clustering algorithms are based on the principle of minimizing the distance
    between cases in the development sample. Distance in this instance doesn’t necessarily
    refer to physical distance, but how different two cases are for a given data item.
    The distance between two individuals aged `22` and `24` is less than that between
    two people aged `18` and `75`. If we are talking about smoking habits, then two
    smokers have a distance of `zero` whereas a smoker and a non-smoker don’t. The
    distance between two people within the same pay grade is typically less than the
    distance between two people on different pay grades and so on.


    Before a clustering algorithm is applied, each data item in the development sample
    is transformed to a standard numerical scale. For example, ages and incomes could
    both be transformed so that the average value of each was zero, and most cases
    lie between the values of `-1` and `+1`. Likewise, `0/1` indicators are used to
    represent things such as if someone is a smoker or not. In this way, the differences
    for each data item all carry equal weight when the clustering algorithm is applied.
    If this standardization process does not occur, then the influence of data items
    with a large scale such as income in dollars, will dwarf those with much smaller
    values such as number of dependents.


    There are many different clustering algorithms available, but one of the most
    popular is called `K-means clustering`. This is the type of clustering Experian
    describe using in the design of their `Mosaic Product`.


    #### The K-means Algorithm


    The `K-means clustering` algorithm works to assign every case in your sample to
    one of `K` distinct clusters, where `K` is a value selected by the user. The algorithm
    does this by assigning cases to clusters so that the sum of all the individual
    distances within each of the clusters is minimized.


    With clustering there isn’t a model that is produced at the end of the process.
    All there is, is an identifier to say which of the `K` clusters an observation
    has been assigned to. You may be placed in `cluster 4`, but I on the other hand,
    have been assigned to `cluster 7`. When there are new cases which need to be assigned
    to a cluster, one of two approaches can be adopted:


    1. The clustering algorithm is rerun. The clusters are reassigned with the new
    cases included.

    2. The distance between each of the new case and the `center` of each cluster
    is calculated. Cases are assigned to the cluster whose centers they are closest
    too.


    The first option is optimal in terms of cluster assignment because the clusters
    will evolve over time as more cases are presented. However, clustering can require
    a lot of computer power. If the cases need to be assigned in `(near) real time`,
    option 2 is more practical. Let’s illustrate this with an example, as shown in
    Figure 11.


    ![](images/00016.jpg)


    In Figure 11 the letters `A`, `B` and `C` represent new customers who are to be
    assigned to one of the two clusters already identified. Once they have been assigned
    to a cluster, then Rebecca can target them with the appropriate marketing activity.
    It’s easy to see that customers `A` and `C` are closer to `cluster 1`, whereas
    customer `B` is closest to `cluster 2`. The sum of distances within the clusters
    will be minimized if `A` and `C` are assigned to `cluster 1` and customer `B`
    to `cluster 2`.


    ### Other Applications


    Customer profiling applied to marketing is one of the the best known applications
    of clustering, but clustering based approaches are also being applied successfully
    to many other problems. One example is `document clustering`. In fields such as
    law and academic research, there is a requirement to regularly trawl through the
    ever-growing pile of published literature to find information relating to certain
    subjects or types of research. Some fields of study cover millions of papers and
    articles. The mathematics database `zbMATH` contains about 4 million entries with
    reviews or abstracts from 3,000 journals and 180,000 books. In medicine, more
    than 800,000 academic papers are published each year. The traditional of way of
    searching for documents is similar to using `Google` or `Bing` – one types keywords
    into the database’s search engine, which finds papers that match those keywords.
    However, search terms don’t necessarily bring back all of the relevant documents
    and many are returned which are not relevant but contain the keywords in a different
    context.


    Document clustering is in essence no different from the cinema example we talked
    about earlier. Instead of geo-demographics; word counts, sentence structure and
    other document features provide the data items used in the clustering process.


    Document clustering can also be applied to tweets, newsfeeds, blog posts and other
    rapidly changing media in real time. Pictures and video can also be categorized
    in a similar way. News organizations use these approaches to automatically flag
    up new posts about specific topics as they appear. This is so they can include
    them in their own media publications almost immediately. Social media companies
    and governments use similar methods (as well as predictive models) to support
    the identification of illegal or undesirable content.

    '
  trans: '

    虽然图 10 中的信息非常简单，但它可以帮助 Rebecca 为两类客户中的每一组制定身定制的营销策略。这可以体现在以下方面：


    *   每个小组的个人目标是哪些电影。

    *   反映前往影院不同交通方式的旅行优惠。

    *   可能吸引每个小组的额外项目折扣（例如，为年轻人提供汽水/啤酒，为中老年人提供咖啡/茶/葡萄酒）。


    同样重要的是，Rebecca 知道早鸟型影院观众中很少有“中年人”。因此，她不应该浪费营销预算去试图说服他们来影院。


    影院案例通过仅两项信息以一种非常简单的方式说明了聚类（clustering）的概念。当关于人的成百或数千个数据项可用时，也可以应用相同的原理，但一旦数据项超过
    `2 or 3` 个，就很难以图表的形式表示这些聚类。找出数据中有多少聚类以及这些聚类的特征是什么，是聚类过程的一个基础组成部分。


    ### 聚类的商业应用


    有许多基于聚类的商业产品。Experian 的 `Mosaic` 产品将英国所有的 180 万个邮政编码（zip codes）分配到 `66` 个聚类之一。Experian
    为每个聚类分配了一个标题，例如“市中心精英”、“低收入工人”和“经典祖父母”，以代表通常居住在这些地区的人群。对于住在每个聚类邮政编码的居民，提供了平均年龄、财富、孩子数量、信用卡使用等地理人口信息。组织随后根据每个邮政编码区域的人口统计特征，定制其客户互动策略。这之所以有效，是因为居住在同一社区家庭的人往往具有相似的人口统计特征。如果你是一个住在被分类为“市中心精英”地区的高薪银行家，那么你的邻居也是高薪专业人士的可能性远大于那些依靠福利金或最低工资生存的家庭。


    ### 聚类算法


    许多聚类算法都基于最小化开发样本中案例之间距离的原理。在这种情况下，距离并不一定指物理距离，而是对于给定的数据项两个案例之间的差异。`22` 岁和 `24`
    岁个人之间的距离小于 `18` 岁和 `75` 岁个人之间的距离。如果我们谈论吸烟习惯，那么两个烟民之间的距离为 `zero`，而一个烟民和一个非烟民之间则没有。同一薪级内两个人之间的距离通常小于不同薪级之间两人之间的距离，以此此类推。


    在应用聚类算法之前，开发样本中的每个数据项都会被转换为标准的数值标度。例如，年龄和收入都可以被转换，使得它们的平均值均为零，且大多数案例落在 `-1` 和
    `+1` 的值之间。同样，`0/1` 指示符用于表示如某人是否吸烟。通过这种方式，在应用聚类算法时，每个数据项的差异都具有相同的权重。如果不进行这种标准化过程，那么像以美元计算的收入这样大尺度数据项的影响将掩盖数值小得多的数据项（如受抚养人数）。


    有许多不同的聚类算法可用，但受欢迎的之一被称为 `K-means clustering`（K 均聚类）。这就是 Experian 在设计其 `Mosaic
    Product` 时描述的聚类类型。


    #### K-means 算法


    `K-means clustering` 算法的作用是将样本中的每个案例分配到 `K` 个不同的聚类之一，其中 `K` 是由用户选择的值。该算法通过将案例分配到聚类，使得每个聚类内所有个体距离之和最小化来实现。


    对于聚类，过程结束时并产生模型。只有一个标识符来说明观测值被分配到了 `K` 个聚类中的哪一个。你可能被分配到 `cluster 4`，而我则被分配到 `cluster
    7`。当有新案例需要分配到聚类时，可以采用两种方法之一：


    1. 重新运行聚类算法。在包含新案例的情况下重新分配聚类。

    2. 计算每个新案例与每个聚类 `center` 之间的距离。将案例分配给其中心最近的聚类。


    第一种方案在聚类分配方面是最优的，因为随着更多案例的出现，聚类会随时间演化。然而，聚类可能需要大量的计算能力。如果在 `(near) real time`
    分配，方案 2 更为实用。让我们用图 11 中的例子来说明。


    ![](img/00016.jpg)


    在图 11 中，字母 `A`、`B` 和 `C` 代表要分配到已识别两个聚类之一的新客户。一旦他们被分配到一个聚类，Rebecca 就可以通过适当的营销活动来针对他们。很容易看出，客户
    `A` 和 `C` 更接近 `cluster 1`，而客户 `B` 最接近 `cluster 2`。如果将 `A` 和 `C` 分配到 `cluster 1`
    而客户 `B` 分配到 `cluster 2`，聚类内的距离和将最小。


    ### 其他应用


    应用于营销的客户画像是聚类广为人知的应用，但基于聚类的方法也被成功应用于许多其他问题。一个例子是 `document clustering`（文档聚类）。在法律和学术研究领域，需要定期检索不断增长的出版文献，以寻找与特定主题或研究类型相关的信息。某些研究领域涵盖数百万论文和文章。数学数据库
    `zbMATH` 包含约 400 万条来自来自 3000 本期刊和 180000 本书的评论或摘要。在医学领域，每年发表超过 80 万篇学术论文。传统的文档搜索方法类似于使用
    `Google` 或 `Bing` —— 你在数据库的搜索引擎中输入关键词，它会找到匹配这些关键词的论文。然而，搜索词并不一定能带回所有相关文档，而且返回的许多文档并不相关，但在不同的语境中包含了关键词。


    文档聚类本质上与我们之前谈论的影院案例没有区别。不是地理人口统计，而是词频、句子结构和其他文档特征提供了聚类过程中使用的数据项。


    文档聚类也可以实时应用于推文、新闻推送、博客文章和其他快速变化的媒体。图片和视频也可以以类似的方式进行分类。新闻机构使用这些方法自动标记标记关于特定主题的新帖子。这样他们就可以立即将其包含在自己的媒体出版物中。社交媒体公司和政府使用类似的方法（以及预测模型）来支持识别非法或不受欢迎的内容。

    '
