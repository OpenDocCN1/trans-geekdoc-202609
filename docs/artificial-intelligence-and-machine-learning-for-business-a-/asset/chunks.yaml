    it’s very much a case of diminishing returns. For almost all practical business
    problems, the benefits of taking more than a few tens of thousands of cases is
    marginal. If you sample in an appropriate way^([\[49\]](#index_split_028.html#filepos427639)),
    then you’ll get 99% of the benefit from a model developed using 100,000 cases
