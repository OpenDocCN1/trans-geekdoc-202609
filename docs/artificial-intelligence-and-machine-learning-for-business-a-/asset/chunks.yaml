    *   并不期望完全消除人类专业知识。必须有一个经过适当培训的运营职能，在需要时能够手动处理决策。

    *   建立适当的治理和审计流程，以管理并对其决策系统提供监督。这包括如前文所述的，开发相关方法来识别和缓解随之而产生的风险。


    从项目管理的角度来看，对治理和人工干预的要求会对开发和维护自动化决策系统的成本产生重大影响。如果你正在考虑在组织内部使用自动化，那么在项目开始之前进行的成本效益分析中，需要将这些额外开销包含在内。


    在运营方面，如果你使用预测模型来执行诸如“决定解雇谁”这类工作，那么你就需要那些能够审查模型所使用的数据、并在必要时覆盖原始决策的人员。在保险和信贷授予等领域，这意味着你需要留住经验丰富的核保师，他们可以挑战组织自动化核保系统所做出的决策。此外，还需要一套流程来处理客户对自动化决策的查询，并根据法律要求向他们提供相关信息。


    ## 14. 机器学习的前沿


    机器学习是一个令人兴奋且不断发展的学科，它正受到三个主要领域新进展的推动：


    1.  **模型与算法**。新的机器学习方法不断开发出来。一个研究方向是寻找新类型的模型。另一个一个方向则是改进现有的生成评分卡、决策树、神经网络等的算法，以提高此类类型模型的预测准确性。

    2.  **数据**。预测模型和其他 AI 应用的优劣完全取决于构建它们时使用的数据。更多/更好的数据会带来更好的解决方案。这就是为什么“大数据”和机器学习如此紧密相关的原因之一。

    3.  **系统与软件**。用于开发和实施基于自动机器学习解决方案的系统的改进至关重要，因为解决方案部署得越快，收益就能越早实现。


    让我们从讨论机器学习的模型和算法方面开始。评分卡、决策树和神经网络可能是目前应用最广泛的预测模型类型。然而，如果你和硅谷的那些年轻人聊天，他们可能会笑笑然后告诉你，这些类型的模型已经有些“老旧”了——决策树简直是
    1980 年代的东西了！现在有这么多更好的预测模型类型问世……


    从某种意义上说，这是正确的。评分卡、决策树和神经网络确实不是新事物。事实同样是，平均而言，更新类型的预测模型（如深度神经网络、支持向量机和集成学习）产生了更准确的预测，特别是在需要复杂决策的领域。


    评分卡和决策树最早于 20 世纪 50 年代和 60 年代投入商业使用。在那个时代，典型的电脑有大办公桌那么大，计算能力不到今天基础智能手机的 1%。因此，这些简单的预测模型可以相对容易地开发和实施。如今计算机能力已不再是一个大问题，但评分卡和决策树等简单模型仍然非常受欢迎，原因如下：


    *   它们在本质上是“白盒”。非常容易理解是如何得出评分并此得出对某人的预测的。同样，很容易看出哪些数据项对评分的贡献最大，哪些数据项较不重要。

    *   它们易于编码。实现它们不需要专业软件。如果资源紧张，你可以将评分卡或决策树作为一个小型 IT 项目来实现，而无需购买额外的硬件/软件，也不需要雇佣非常昂贵的数据科学家。

    *   它们仍然能产生相当不错的预测，即使不是最好的。某些预测模型比简单的评分卡或决策树复杂成千上万。然而，即使是最先进的预测模型，其提供的提升通常也仅比简单的评分卡或决策树多几个百分，有时完全没有提升。


    我想明确的是，对于组织来说，巨大的胜利在于首先基于机器学习跨越到使用自动化决策。使用可用最先进方法所带来的增量收益通常是微乎其微的。这在业务问题简单且能够精确简洁地表达时尤为如此，例如评估贷款的违约风险或某人对营销活动响应的可能性。而那些更复杂、更混乱的问题，如人脸识别、语言翻译和自动驾驶，从深度神经网络等先进的机器学习形式中获益最多。


    如果你的组织目前没有使用机器学习，那么开发一些可以集成到现有决策基础设施中的简单预测模型，将让你获得大部分收益。那些通常需要特殊硬件和/或软件的高端技术会提供更大的收益，但不是巨大的收益。因此，不要犹豫。80/20
    原则适用。你将通过 20% 的精力获得 80% 的收益。


    同样的情况，如果你无法让一个简单的预测模型运行，那么仅仅使用更复杂的方法或购买昂贵的硬件/软件不太可能解决底层问题；即，机器学习项目的失败几乎总是由于问题定义错误、底层数据或组织问题。问题不太可能是由于所开发的预测模型类型导致的。


    好了。这是坚持使用评分卡和决策树等简单模型的论据。然而，如果一个组织是使用机器学习开发的 AI 应用的成熟用户，且其预测模型每年负责价值数十亿美元的决策，那么就会有一种动力去拥有最优秀（最准确）的模型——而且这是之有据的。对于一个每年支持十亿美元决策的模型来说，性能仅
    0.1% 的提升就等同于 100 万美元的收益。在这种情况下，雇佣一个数据科学家团队不断挑战和改进组织所使用的模型是完全合理的。


    目前使用的最先进预测模型形式是集成模型，它们基于复杂的（深度）神经网络。在集成中，不是单一的评分卡、决策树或神经网络模型，而是构建了数百个甚至数千个不同的模型。每个模型都使用不同的数据样本和/或不同的算法来确定模型的参数。因此，每个模型做出预测的方式略有不同。每个模型生成的评分通常相同或相似，但有时它们会产生分歧；即，某些模型会对某些案例给出高分，而其他模型会对相同案例给出低得多的分，反之亦然。


    使用集成模型有点像由专家委员会做出决策，而不是由单一专家做出决策。委员会方法优于单一专家方法的原因有两点：


