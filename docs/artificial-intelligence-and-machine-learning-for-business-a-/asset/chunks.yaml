    * Drinks an average of `6` units of alcohol a week.

    * A university graduate.

    * An income of `$50,000` a year.

    * Smokes.

    * Is not diabetic.

    * Normal cholesterol levels.

    * Low blood pressure.


    The starting score is `350`. Seven points are added due to her age, which brings
    the score to `357`. Eight points are then added based on her `BMI`, four points
    subtracted for her gender and no points added (or subtracted) based on her alcohol
    consumption and so on. After adding/subtracting all of the relevant points, the
    final score is `404`.


    The individual scores in the scorecard are a representation of the patterns/relationships
    that the machine learning algorithm has found. For example, the increasing scores
    allocated to older people represent the relationship between increasing age and
    increasing risk of heart disease, which has been deduced from the data (the development
    sample) used to build the model. Likewise, smokers are allocated more points than
    non-smokers, representing the relationship between smoking and heart disease.


    Looking at the scorecard in Figure 2, it’s easy to see why scorecards are so attractive
    and why they are so widely used across many industry sectors. One reason is that
    you don’t need any technical ability to see which data items contribute to the
    score someone receives. It’s also easy to gauge the relative importance of each
    data item. Age contributes more points to the final score than anything else.
    Gender on the other hand, only makes a small contribution to the overall score.
    It’s also the case that most data items in the model, such as smoking, alcohol
    consumption and blood pressure fit with what is generally known from medical studies;
    i.e. the relationships captured by the model look sensible and conform with what
    is already known about risk factors for heart disease.


    The fact that the model conforms with what experts already know is useful for
    getting people to trust the model and be comfortable using it as a diagnostic
    tool in their day–to-day work. If the model gave negative points for smoking and
    diabetes, and positive points for normal blood pressure and being young, then
    that is counter to what every doctor knows. Consequently, people would not have
    much confidence that the model was correctly predicting the condition even if
    the model’s predictions were correct.


    This appeal to common sense is important, particularly when models are being deployed
    in an area for the first time. People are often suspicious of new approaches such
    as machine learning and may instinctively distrust something that removes the
    human element from the decision-making process. The more that can be done to reassure
    people that decisions based on the model scores are the right ones, then the easier
    it will be to overcome any resistance to machine learning that is encountered.


    The one item in the scorecard that is perhaps slightly unexpected is the impact
    of someone’s income. What the model is saying is that if you have a low income
    then you are more likely to develop heart disease. If you give this some thought,
    then it does make sense. If someone is on a low income they may not be able to
    afford gym membership (less exercise), and they won’t spend as much of their income
    on good quality food. However, it’s important not to become become confused between
    correlation and causation. The model captures the correlation between income and
    heart disease, but it’s not right to say that having a low income necessarily
    causes heart disease. It might, but it could also be acting as a proxy for those
    other features.


    This ability to pick out new data items which are predictive, but which an expert
    might not have considered important before, is one of the big strengths of machine
    learning. This is particularly true as we move further into the world of “Big
    Data” where there can be tens of thousands of data items available, any one of
    which could feature in a predictive model – far more than could ever be analyzed
    by hand.


    Machine learning is an automated way of sifting all those data items to find the
    handful that correlate with the behavior being predicted. Having said this, it’s
    important to note that in the vast majority of cases, across many application
    areas, machine learning tends to pick out similar data items to what a human expert
    would use when making decisions. New, strange or counterintuitive predictive relationships
    tend to be the exception rather than the rule.


    Another thing that gives predictive models an edge over human decision makers
    is that the scores allocated to each data item are optimal, based on the data
    in the development sample; i.e. the scores assigned to each data item in the model
    are the best they can be, resulting in the most accurate predictions possible.


    Machine learning is not the only way to create scorecard type models. One alternative
    is to apply expert opinion. A group of experts gets together and collectively
    decide which factors are important and what points should be assigned to those
    factors. Predictive models constructed in this way often work surprisingly well
    but tend to be inferior to models constructed using algorithms to determine the
    scores using a suitable development sample.


    Another interesting feature of the scorecard in Figure 2 is that it only contains
    9 data items – yet that’s enough to make pretty good predictions and this is often
    the case. Very few predictive models need more than a few dozen data items to
    be able to generate very good predictions indeed. Even if there are many tens
    of thousands of bits of data available, the vast majority of those data items
    add little or nothing to the accuracy of predictions. This is a very useful feature
    of machine learning because it means that although a huge amount of data analysis
    may have been required in order to create a model, far less resource is required
    when it comes to putting that model to use. To implement a predictive model, you
    only require the data items that feature in the model. No other data is required.

    '
  trans: '

    尽管如此，但对相关的数学技术有一定的了解是有很有帮助的。因为这能让你理解软件生成的诊断信息，并识别出模型创建过程中是否出现了任何问题。此外，软件中通常还需要设置若干参数。经验丰富的数据科学家将知道如何调整这些参数，以生成一个具有很强预测能力的模型，同时满足委托该机构所施加的任何业务限制。


    模型构建过程通常是迭代的。在得出最终模型之前，通常会使用不同的算法构建许多测试模型。因此，分析过程需要一个懂行的人来引导，以确保获得最佳的整体模型。


    让我们假设数据科学家首先考虑一种评分卡（scorecard）类型的模型。作为参考，生成评分卡类型模型最受欢迎的算法被称为 `Linear Regression`（线性回归）和
    `Logistic Regression`（逻辑回归）。


    在使用适当的软件工具将相关算法应用于开发样本^([\[19\]](#index_split_028.html#filepos414053))后，软件生成了如图
    2 所示的预测性模型：


    ![](img/00010.jpg)


    使用图 2 中的评分卡，某人的得分计算方式如下：


    * 首先，每个人被分配 `350` 的“起始分”。

    * 然后，从起始分中加上或减去所有适的相关分数。


    对于一位具有以下特征的 45 岁女性：


    * `BMI` 为 `28`。

    * 每周平均饮用 `6` 单位酒精。

    * 大学毕业。

    * 年收入为 `$50,000`。

    * 吸烟者。

    * 非糖尿病患者。

    * 胆胆固醇水平正常。

    * 低血压。


    起始分为 `350`。由于年龄原因，增加了 7 分，使分数变为 `357`。然后根据其 `BMI` 增加 8 分，根据性别减去 4 分，根据其饮酒量不增加（也不减少）分数，依此类推。在加/减所有相关分数后，最终得分为
    `404`。


    评分卡中的个人得分是机器学习算法发现的模式/关系的表示。例如，分配给老年人的不断增加的分代表了年龄增长与心脏病风险增加之间的关系，这是从用于构建模型的数据（开发样本）中推导出来的。同样，吸烟者分配的分数比非吸烟者多，代表了吸烟与心脏病之间的关系。


    图 2 中的评分卡，很容易看出为什么评分卡如此吸引人，以及它们为什么在许多行业被广泛使用。原因之一是，你不需要任何技术就能看出哪些数据项目对某人的得分有贡献。衡量每个数据项目的相对重要性也很。年龄对最终得分的贡献比任何其他因素都多。另一方面，性别对总分的贡献很小。模型中的绝大多数数据项目（如吸烟、饮酒和血压）也符合医学研究的普遍常识；即模型捕捉到的关系是合理的，并符合已关于心脏病风险因素的认知。


    模型符合专家已有的知识这一事实有助于人们信任该模型，并乐于在日常工作中将其作为诊断工具。如果模型对吸烟和糖尿病给出负分，而对血压正常和年轻给出正分，那么就违背了每位医生的常识。因此，即使模型的预测是正确的，人们对该模型能够正确预测状况也没有太大信心。


    这种对常识的诉求很重要，特别是当模型首次部署在某个领域时。人们通常对机器学习等新方法持怀疑态度，并可能本能地不信任某些从决策过程中消除了人为因素的东西。越能让人们相信基于模型分数的决策是正确的，就越容易克服任何对机器学习的阻力。


    评分卡中可能稍微出乎意料的一项是收入的影响。模型表达的是，如果你收入低，你更有可能患心脏病。如果你对此进行思考，它是有道理的。如果有人收入低，他们可能负担不起健身房会员（运动较少），而且不会花更多的收入来购买高质量的食物。然而，重要的是不要混淆相关性和因果关系。模型捕捉了收入与心脏病之间的相关性，但说低收入一定会导致心脏病是不正确的。它可能导致，但也可能是那些其他特征的代理变量。


    这种挑选出具有预测性但专家之前可能没有考虑其重要的新数据项目的能力，是机器学习大优势之一。当我们进一步进入“大数据”世界时，这一点尤为真实，那里可能有成千上万个数据项目，其中任何一个都出现在预测模型中——这远超手工能分析的量。


    机器学习是一种筛选所有数据项目的自动方法，以找到与被预测行为相关的少数几个项目。尽管如此，重要的是，在许多应用领域的绝大多数情况下，机器学习倾向于挑选出与人类专家在决策时使用的相似数据项目。新的、奇怪或反直觉的预测关系往往是例外而非常态。


    另一个让预测模型优于人类决策者的点是，分配给每个数据项目的分是基于开发样本数据的优方案；即模型中分配给每个数据项目的分是最好的，从而产生尽可能准确的预测。


    机器学习不是创建评分卡类型模型的唯一方法。另一种方法是应用专家意见。一组专家聚在一起共同决定哪些因素是重要的，以及给这些因素分配多少分。这种方式构建的预测模型通常效果惊人，但往往不如使用算法通过合适的开发样本确定分数构建的模型。


    图 2 中评分卡的另一个有趣特征是，它只包含 9 个数据项目——但这足以做出非常好的预测，而且这种情况通常如此。极少数预测模型需要超过几十个数据项目才能生成非常好的预测。即使有成千上万的数据可用，绝大多数数据项目对预测准确性的贡献也很小或完全没有。这是机器学习一个非常有用的特征，因为这意味着虽然创建一个模型可能需要大量的数据分析，但在使用该模型时，所需的资源要少得多。要实现预测模型，你只需要模型中出现的数据项目。不需要其他数据。


    '
