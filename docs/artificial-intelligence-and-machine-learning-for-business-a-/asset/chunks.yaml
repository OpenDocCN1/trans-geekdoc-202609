    ## 集成模型与决策


    1. 如果其中一个专家拥有其他专家不具备的专业知识，那么这种知识就可以引入决策过程。

    2. 某些专家偶尔可能会做出糟糕的决策。其他专家将利用他们的集体知识来覆盖（通过投票否决）这些情况。


    就像委员会一样，构成集成模型的某些模型特别擅长预测某些类型案例的结果。如果任何模型在某些领域表现较弱（产生较差的预测），它们就会被其他模型覆盖。


    一旦构建完成，集成模型的工作方式非常直观。每个模型的得分都用于做出决策。然后通过简单的多数投票来做出最终决定。如果我们回到之前讨论的心脏病评分模型，想象一下不是单个评分表，而是构建了一千份不同的评分表。原始的决策规则是，如果某人的得分达到
    521 分以上则邀请其进行检查。在集成模型中，如果至少有 501 个独立模型生成的分为 `521` 或以上，那么决策就是邀请。


    集成模型比单模型好在多少？有时完全没有！然而，根据我的经验，集成模型比单模型好 5-10% 并不罕见。如果一家保险公司发现，使用决策树导致在相同的承保金额下，理赔金额较其之前的人工流程减少了
    `$40m`，那么转向集成方法可以合理地预期将额外提供 `$2-4m` 的获收益。


    如果你感兴趣的仅仅是原始预测准确率，那么集成模型是你的选择。然而，如果对你来说，能够解释模型如何得出特定的预测结果非常重要，那么在选择集成路线之前，你可能需要仔细考虑，因为解决方案将比单模型方法复杂得多，也更难理解。


    ## 数据的重要性


    现在让我们来思考数据。通过阅读关于机器学习的学术文献，我大胆推测，其中 95% 或更多的内容是关于算法的；即对前沿数学方法的非常的技术讨论，这些方法可以从给定的数据集中榨出更多一点预测准确率。然而在实践中，当提高预测模型的准确性时，数据才是王道。


    在构建预测模型的新算法和拥有更多/更好的数据之间进行选择时，数据总是胜出的。换句话说，使用大量高质量数据构建的非常简单的预测模型，其性能几乎总是优于使用少量低质量数据构建的更先进的方法。如果你真的想从你的预测模型中获得更多价值，那么改进用于构建模型的数据质量并寻找新的、更好的数据源，应该是你的任务列表上的首位。


    在大数据的早期，当数据存储成本在短时间内急剧下降时，先驱者中存在着“存储并分析一切”的数据哲学。其核心信息是，每个组织都应该收集和分析它所能获得的所有数据。那时，有很多关于需要投资诸如
    `Hadoop` 等大规模存储系统的讨论。这是为了让组织能够存储他们所接触到的所有数据，以便产生可能最好的预测模型，从而获得竞争优势。然而，产生的数据量逐年增加，且没有任何减缓的迹象。事实上，数据量的增长速度远快于数据存储成本的下降速度。


    这意味着拥有所有可用数据的益处在某种程度上被存储和分析所有数据的成本所抵消了。正如之前讨论的，所有数据中只有一小部分实际上出现在预测模型中并被用于做出预测；即一旦你知道哪些类型的数据可以预测人们将如何行为，你就可以丢弃大部分数据，因为你不需要它们。继续维护巨大的“低价值”数据数据库并不是一种高效的资源利用方式。如今，数据正向数据存储和聚合移动，特别是在涉及外部数据和通用数据时。如果数据由不同的组织提供的十个应用，那么让每个组织都去收集和管理这些数据是非常浪费时间的。


    如果你看看 `Facebook`、`Google`、`Experian` 和 `Equifax` 等公司，这正是他们正在做的。他们进行对数据的收集、格式化和总结，然后将其出售。通过这种方式，他们不需要收集海量数据。


    ## IT 系统与软件开发


    机器学习发展的第三大驱动力是 IT 系统和软件。随着个人数据量的增长以及数据变化频率的增加，许多行业模型开发之间的周期已经缩短。


    开发和实施预测模型的传统范式是将这两个部分分开；即先开发你的模型，然后实施它们。在开发阶段，数据科学家花费几天、几周甚至几个月的时间来收集数据并进行构建模型所需的统计分析。当该部分完成后，还有一项工作是在生产环境中对模型进行编码，测试模型是否有效，然后将其投入运行使用。


    在许多（可能是大多数）行业中，这种预测模型方法仍然被应用并且通常效果良好，这至少是因为模型在开发后必须通过内部和外部审计，并接受监管审查才能投入使用。无论法律如何规定，建立一个稳健的模型治理结构都是重要的。因为如果你的整个业务都依赖于做出正确的决策，而你犯错了，那么对底线的影响可能是巨大的。


    对于银行和保险业用于确定需要留存多少资本的风险模型^([71]](#filepos436737)，从预测建模项目启动到模型在公司内部实施可能需要一年或更长时间。模型的每个方面都必须充分记录，并在监管机构批准模型符合使用之前，需要经过讨论、反馈和进一步分析的循环。银行监管机构在模型经过独立专家的全面审查之前，甚至不会考虑审查。这花费的时间可能与最初的模型构建过程一样甚至更长。


    然而在其他领域，例如互联网营销，情况要快得多。数据以及数据中的关系变化频繁，有些甚至是实时的。


    '
