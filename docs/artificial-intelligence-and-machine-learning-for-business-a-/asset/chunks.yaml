- raw: "1.  What is the uncertain event/value/thing that you want to predict? This\
    \ needs to be something very clear and explicit. It needs to be easily measurable\
    \ and can be represented as a simple indicator for classification problems or\
    \ as a numeric value for regression problems.\n\n>   \n\n1.  What decisions and\
    \ actions will be taken about how to treat people, based on the predictions made\
    \ by the model?\n\n>   \n\nThere is no point developing a predictive model to\
    \ predict events that are certainly going to occur. Likewise, if people are going\
    \ to continue to be treated in the same way, regardless of the score that they\
    \ receive, then what use is the model? If existing customers are always going\
    \ to be offered the same level of discount off their next purchase, then there\
    \ is no point building a predictive model to identify repeat shoppers. A repeat\
    \ shopper model will only be useful if a differential incentive strategy is offered,\
    \ based on the scores generated by the model. For example, not offering a discount\
    \ to those the model predicts almost certainly will buy again (high scores) and\
    \ offering large discounts to those at the other end of the scale (low scores),\
    \ to encourage them to shop again at the store.\n\nIdentifying the right problem\
    \ is critical. One limitation of machine learning is that it is very specific.\
    \ In tax collection for example, are we interested in identifying incorrect tax\
    \ returns (classification problems – has the correct amount been paid or not)\
    \ or maximizing total tax revenues (regression problem, amount collected)? Lots\
    \ of people make small errors in their tax returns. Spotting these is helpful\
    \ but won’t increase the overall amount of tax collected by much. In fact, a lot\
    \ of people accidentally overpay by small amounts. If your model identifies these\
    \ cases then you may end up paying back some of the tax paid rather than collecting\
    \ more!\n\nTax authorities are resource constrained. If you want to maximize tax\
    \ take then you should focus only on the largest cases, where underpayments are\
    \ very significant. Tax authorities simply don’t have the manpower to follow up\
    \ every little underpayment. Therefore, the problem needs to capture this requirement.\
    \ For example, ignoring tax discrepancies of less than $1,000. In a similar vein,\
    \ a model built to predict heart disease will probably not be very good at predicting\
    \ dementia and vice versa.\n\nThe second consideration when building predictive\
    \ models is organizational culture, and the appetite for change within the business\
    \ areas that will be impacted by the models. Existing working practices and resistance\
    \ to new ways of working are often a barrier to the introduction of machine learning.\
    \ This is particularly true when staff are expected to behave differently on the\
    \ basis of what the model tells them; i.e. machine learning is going to change\
    \ the way people do their jobs, and in some cases, it will result in job losses\
    \ and/or a devaluation of their skills.\n\nAs a rule, experts in a field don’t\
    \ tend to trust predictive models to be as good as they are at predicting outcomes.\
    \ What this means is that an expert will often override decisions made on the\
    \ basis of a predictive model if they are given the opportunity to do so - in\
    \ effect negating any benefits that the model would have delivered.\n\nWhether\
    \ overriding is going to be a problem or not often rests on whether the predictive\
    \ model is implemented in an active or passive way:\n\n*   Active Models. The\
    \ predictions (scores) generated by a model are acted upon automatically. No human\
    \ involvement is required for actions to be carried out.\n\n>   \n\n*   Passive\
    \ Models. The model scores are used to generate cases that are passed on to people,\
    \ who then decide how to deal with them; i.e. nothing happens until someone does\
    \ something with the cases generated by the analytics process.\n\nA situation\
    \ where active models are used is in debt collection. Predictive models are used\
    \ to prioritize debtors on the basis of which ones are most likely to repay what\
    \ they owe. The prioritized lists are loaded into a dialer which then automatically\
    \ calls people in list order.\n\nWhen contact is made with a debtor, the call\
    \ is transferred to a human debt collector who tries to persuade the debtor to\
    \ repay what they owe. The debt collectors themselves aren’t concerned with the\
    \ order in which cases are presented to them. They simply process each case that\
    \ they receive. Consequently, once the model has been implemented no further human\
    \ input is required to decide on the ordering of the call list maintained in the\
    \ dialer.\n\nAn example of a passive model on the other hand, is one that has\
    \ been designed to rank job applicants in order of their suitability for a particular\
    \ role. The model may be very good at picking out the most promising prospects,\
    \ but a human interviewer is still required to meet the candidates and make the\
    \ final decision about a job offer. If the interviewer takes a dislike to a candidate\
    \ for whatever reason, then they won’t offer the candidate the job, regardless\
    \ of how good they would actually be at doing it.\n\nPassive models are the most\
    \ problematic. This is because in many organizations those at the front line have\
    \ the ability to change or alter decisions that were made centrally. In the recruitment\
    \ example, the power of the model is increasingly diminished the more the interviewers\
    \ decide to override model based decision with their own. Also, human assessors\
    \ often display bias (consciously or unconsciously) that disadvantages good candidates\
    \ based on some unfound prejudice or stereotype, resulting in many good candidates\
    \ having their job applications turned down.\n\nAnother example that I came across\
    \ was in tax collection. A central function was responsible for identifying potentially\
    \ fraudulent tax returns, and these cases were then passed on to locally based\
    \ tax inspectors to carryout detailed investigations. The tax inspectors had the\
    \ power to reject cases that they felt weren’t suitable or which were unlikely\
    \ to yield much additional tax.\n\nWhen the central function implemented a predictive\
    \ model to identify cases that were highly likely to be fraudulent, the number\
    \ of cases rejected by the tax inspectors rose dramatically. This wasn’t because\
    \ the cases generated by the model weren’t fraudulent. It was because the model\
    \ was too good at identifying fraudulent activity due to very subtle signs in\
    \ the data.\n\nWhen a case arrived on a tax inspector’s desk, the inspector was\
    \ unable to establish exactly what was fishy about it. They didn’t know how to\
    \ go about beginning an investigation and consequently they rejected it. Likewise,\
    \ the model often selected cases that were very complex or where it would be very\
    \ difficult to collect the unpaid tax even though fraud had clearly occurred.^([\\\
    [54\\]](#index_split_028.html#filepos429922)) These types of cases also had a\
    \ tendency to be rejected.\n\nActive models are much easier to implement successfully\
    \ than passive models. This is because people don’t have the opportunity to override\
    \ model based decisions. For example, once a decision has been made to post a\
    \ customer a discount voucher, the process of dispatching the voucher, with a\
    \ covering note, is automatic. No one is second guessing the system and giving\
    \ vouchers to customer that they believe don’t want them or won’t use them. This\
    \ is one reason why machine learning has been such as success for things like\
    \ target marketing, credit granting and insurance pricing, yet is less well utilized\
    \ in areas such as health care, human resources, policing and education."
