- raw: "Having said this, having some familiarity with the relevant mathematical techniques\
    \ is helpful. This is because it enables you to understand the diagnostics that\
    \ the software produces and to identify if there have been any issues with the\
    \ model creation process. Also, there are often several parameters that need to\
    \ be set within the software. An experienced data scientist will know how to tweak\
    \ these parameters to generate a model that is very predictive, and which also\
    \ meets any business constraints that have been imposed by the organization that\
    \ commissioned it.\n\nOften the model building process is iterative. Many test\
    \ models are constructed using different algorithms before a final model is arrived\
    \ at. Therefore, the analytics process needs someone who knows what they are doing\
    \ to guide it so that the best overall model is arrived at.\n\nLet’s assume that\
    \ the data scientist starts by considering a scorecard type model. For reference,\
    \ the most popular algorithms for generating scorecard type models are called\
    \ Linear Regression and Logistic Regression.\n\nAfter using an appropriate software\
    \ tool, to apply the relevant algorithm to the development sample^([\\[19\\]](#index_split_028.html#filepos414053)),\
    \ the software generates the predictive model shown in Figure 2:\n\n![](images/00010.jpg)\
    \ \n\nUsing the scorecard in Figure 2, a score for someone is calculated as follows:\n\
    \n*   To begin, everyone is assigned the “starting score” of 350.\n\n>   \n\n\
    *   All of the relevant points that apply are then added or subtracted from the\
    \ starting score.\n\nFor a 45 year old female with the following characteristics:\n\
    \n*   A BMI of 28.\n\n*   Drinks an average of 6 units of alcohol a week.\n\n\
    *   A university graduate.\n\n*   An income of $50,000 a year.\n\n*   Smokes.\n\
    \n*   Is not diabetic.\n\n*   Normal cholesterol levels.\n\n*   Low blood pressure.\n\
    \nThe starting score is 350. Seven points are added due to her age, which brings\
    \ the score to 357. Eight points are then added based on her BMI, four points\
    \ subtracted for her gender and no points added (or subtracted) based on her alcohol\
    \ consumption and so on. After adding/subtracting all of the relevant points,\
    \ the final score is 404.\n\nThe individual scores in the scorecard are a representation\
    \ of the patterns/relationships that the machine learning algorithm has found.\
    \ For example, the increasing scores allocated to older people represent the relationship\
    \ between increasing age and increasing risk of heart disease, which has been\
    \ deduced from the data (the development sample) used to build the model. Likewise,\
    \ smokers are allocated more points than non-smokers, representing the relationship\
    \ between smoking and heart disease.\n\nLooking at the scorecard in Figure 2,\
    \ it’s easy to see why scorecards are so attractive and why they are so widely\
    \ used across many industry sectors. One reason is that you don’t need any technical\
    \ ability to see which data items contribute to the score someone receives. It’s\
    \ also easy to gauge the relative importance of each data item. Age contributes\
    \ more points to the final score than anything else. Gender on the other hand,\
    \ only makes a small contribution to the overall score. It’s also the case that\
    \ most data items in the model, such as smoking, alcohol consumption and blood\
    \ pressure fit with what is generally known from medical studies; i.e. the relationships\
    \ captured by the model look sensible and conform with what is already known about\
    \ risk factors for heart disease.\n\nThe fact that the model conforms with what\
    \ experts already know is useful for getting people to trust the model and be\
    \ comfortable using it as a diagnostic tool in their day–to-day work. If the model\
    \ gave negative points for smoking and diabetes, and positive points for normal\
    \ blood pressure and being young, then that is counter to what every doctor knows.\
    \ Consequently, people would not have much confidence that the model was correctly\
    \ predicting the condition even if the model’s predictions were correct.\n\nThis\
    \ appeal to common sense is important, particularly when models are being deployed\
    \ in an area for the first time. People are often suspicious of new approaches\
    \ such as machine learning and may instinctively distrust something that removes\
    \ the human element from the decision-making process. The more that can be done\
    \ to reassure people that decisions based on the model scores are the right ones,\
    \ then the easier it will be to overcome any resistance to machine learning that\
    \ is encountered.\n\nThe one item in the scorecard that is perhaps slightly unexpected\
    \ is the impact of someone’s income. What the model is saying is that if you have\
    \ a low income then you are more likely to develop heart disease. If you give\
    \ this some thought, then it does make sense. If someone is on a low income they\
    \ may not be able to afford gym membership (less exercise), and they won’t spend\
    \ as much of their income on good quality food. However, it’s important not to\
    \ be become confused between correlation and causation. The model captures the\
    \ correlation between income and heart disease, but it’s not right to say that\
    \ having a low income necessarily causes heart disease. It might, but it could\
    \ also just be acting as a proxy for those other features.\n\nThis ability to\
    \ pick out new data items which are predictive, but which an expert might not\
    \ have considered important before, is one of the big strengths of machine learning.\
    \ This is particularly true as we move further into the world of “Big Data” where\
    \ there can be tens of thousands of data items available, any one of which could\
    \ feature in a predictive model – far more than could ever be analyzed by hand.\n\
    \nMachine learning is an automated way of sifting all those data items to find\
    \ the handful that correlate with the behavior being predicted. Having said this,\
    \ it’s important to note that in the vast majority of cases, across many application\
    \ areas, machine learning tends to pick out similar data items to what a human\
    \ expert would use when making decisions. New, strange or counterintuitive predictive\
    \ relationships tend to be the exception rather than the rule.\n\nAnother thing\
    \ that gives predictive models an edge over human decision makers is that the\
    \ scores allocated to each data item are optimal, based on the data in the development\
    \ sample; i.e. the scores assigned to each data item in the model are the best\
    \ they can be, resulting in the most accurate predictions possible.\n\nMachine\
    \ learning is not the only way to create scorecard type models. One alternative\
    \ is to apply expert opinion. A group of experts gets together and collectively\
    \ decide which factors are important and what points should be assigned to those\
    \ factors. Predictive models constructed in this way often work surprisingly well\
    \ but tend to be inferior to models constructed using algorithms to determine\
    \ the scores using a suitable development sample.\n\nAnother interesting feature\
    \ of the scorecard in Figure 2 is that it only contains 9 data items – yet that’s\
    \ enough to make pretty good predictions and this is often the case. Very few\
    \ predictive models need more than a few dozen data items to be able to generate\
    \ very good predictions indeed. Even if there are many tens of thousands of bits\
    \ of data available, the vast majority of those data items add little or nothing\
    \ to the accuracy of predictions. This is a very useful feature of machine learning\
    \ because it means that although a huge amount of data analysis may have been\
    \ required in order to create a model, far less resource is required when it comes\
    \ to putting that model to use. To implement a predictive model, you only require\
    \ the data items that feature in the model. No other data is required."
