    \ This had a prize fund of £1.2m dollars. [https://www.kaggle.com/c/zillow-prize-1](https://www.kaggle.com/c/zillow-prize-1).\
    \ Accessed 03/02/2018.\n\n^([\\[14\\]](#index_split_009.html#filepos60354)) Many,\
    \ but not all credit scores are scaled in this way. More formally, the “standard”\
    \ scaling for credit scoring models is for a score of 500 to equate to a 50% chance\
    \ of being a good payer (odds of 1:1). The odds then double every 20 points. A\
    \ score of 520 means 2:1 odds of being a good repayer (66% chance of repaying\
    \ the loan) , a score of 540 odds of 4:1 (80% chance of repaying the loan) and\
    \ so on.\n\n^([\\[15\\]](#index_split_010.html#filepos79523)) O’Neil, C. (2016).\
    \ ‘Weapons of Math Destruction.’ Alan Lane.\n\n^([\\[16\\]](#index_split_010.html#filepos80832))\
