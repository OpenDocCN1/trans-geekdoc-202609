  trans: '

    考虑到这一点，我将避免涉及机器学习中使用的各种算法的数学原理，例如用于训练神经网络或决定决策树分裂分配方式的算法。对于那些对技术细节感兴趣的人，机器学习中最常用的算法都有非常详尽的文档（请参见附录
    B 中的推荐书籍和网络网站）。同样，这些算法的实现可以在商业统计软件包中找到，你可以购买这些软件包，也可以通过开源软件免费获取（例如 `R` 和 `Python`
    代码库）。你不需要知道如何编写特定的机器学习算法；只需要知道如何在你选择的软件软件包中调用相关的函数或过程即可。


    图 12 概述了开发预测模型的机器学习过程的关键步骤。


    ![](img/00005.jpg)


    ### 第 1 步：业务问题量化


    数据科学家需要做的第一件事是业务问题量化（第 1 步），即将业务试图实现的目标转化为简单的数字或分数。零售店的销售总监可能会这样开启与数据科学家的会话：


    > “我们需要一个预测模型来识别我们的优质客户。”


    所以第一个要问的问题是：


    > “你说的‘优质’是什么意思？”


    销售总监回答道：


    > “那些对我们的业务做出最大财务贡献的客户。”


    好的，这听起来合理，但“财务贡献”是指毛销售额还是净利润？我们讨论的是每次进店的、每次点击的，还是每个单位时间（周/月/年）的贡献？当我们谈论“客户”时，我们指的是个人贡献还是家庭贡献？问题以此类推。数据科学家需要理出业务所需求的精确定义，然后以这种方式将其表达，使其能够由构建的模型所生成的分数表示。


    在这个例子中，可能在与营销总监讨论后，双方共识认为模型旨在预测个人每季度的总毛支出。选择季度毛支出是因为它与组织的报告周期相一致，且总收入（支出总和）是销售总监的关键绩效指标。


    选择个人支出而非家庭支出，是因为双方达成共识：尽管从理论上讲家庭支出更好，但该组织的客户数据库结构是基于个人级而非家庭层级的。在组织现有的 IT 基础设施下，无法部署基于家庭支出的模型。IT
    能够升级以提供家庭视图吗？不，绝不，作为该项目的一部分，因为业务部门今年没有为 IT 变更分配任何预算。


    基于这些信息，数据科学家应该确定这是一个回归类型的问题，用于预测每个个人客户在三个月预测期内将花费金额。


    ### 探索性分析


    在确定如何量化表达业务目标的同时，数据科学家需要进行探索性分析，以了解组织的数据和 IT 资产、它们如何工作，以及它们如何与更广泛的业务交互。这包括：


    *   组织拥有哪些数据库？

    *   每个数据库的目的是什么？哪些流程使用了它们？

    *   数据库包含什么内容？即包含哪些数据项以及这些数据项的格式。例如，是数值还是文本数据。

    *   每个数据库是如何更新和维护的？大多数组织拥有“实时”客户数据库（一旦发生变化就会更新）和更新频率较低的批处理数据库（例如，夜间或月底更新）。

    *   已经建立了哪些决策系统？模型是将在实现在现有系统中，还是需要新的功能？

    *   组织目前使用哪些数据来做出决策？即使这些数据是用于某种过时的手动流程，这些数据对于机器学习目的可能也极具价值，因为组织已经识别出它们是有用的。


    在理想的世界里，每个组织都应该拥有详尽的文档（元数据），提供其数据资产的清单。这涉及到其持有的数据类型、数据如何格式化、来源以及如何使用。然而，在实践中，这类信息往往是不完整的、错误的或过时的。许多有用信息存储在业务用户的脑海中，他们日常工作的一部分经常使用这些信息。可能会有一个名为“客户人口统计
    3”的数据项，其中包含字母 `A`、`B`……`G`。这到底是什么意思？在任何地方都没有记录，但运营部的 Claire 知道它与他们使用的收入等级相匹配。“A”意味着年收入低于
    20,000 美元，“B”是 20,000-35,000 美元，以此类推。


    许多组织还维护着他们已不再理解的数据。然而，他们担心删除它们，以万一那是业务关键流程所依赖的某些信息。在探索性分析阶段，还应该检查潜在的新数据源（包括内部和外部），因为这些可能会增强任何开发模型的预测能力。


    总的来说，需要投入大量精力探索可以收集数据的宇宙，并决定哪些可能可以使用，哪些不能使用。


    ### 第 3 步：开发样本


    一旦数据科学家对组织拥有的数据及其结构方式有了良好的了解，他们就可以进入第 3 步，考虑创建将用于机器学习过程的开发样本。


    构建预测模型的一种非常幼稚的方法是将组织拥有的每条信息都丢进机器学习过程中。在实践中，许多数据是过时的、不稳定的或其他不适当的。因此，应该将它们从开发样本中排除，以防降低机器学习过程的性能。


    从机器学习过程中排除数据的一些典型原因包括：


    *   **过时数据**：如果数据与当今世界不再相关，就不要考虑它。关于在智能手机出现之前人们如何使用手机手机的数据，对于告诉你智能手机的使用情况将毫无帮助。

    *   **不具目标人群的代表性**：开发样本应仅包含与模型将应用的人群镜像的案例。如果专门为在线客户开发收入模型，那么如果这两个渠道的支出模式不同，你就应该排除店内交易。同样，如果你从声音样本中开发语音识别系统，则所有样本都应该是与语音相关的。如果你有狗叫或交通噪音的示例，那么这些需要被移除。

    *   **数据的稳定性**：机器学习过程中使用数据在模型应用时是否可用？如果某个数据项在实施点不可用，则应将其排除。

    *   **法律和伦理原因**：你想使用敏感的个人数据，如种族、性别和性取向吗？这类数据具有很强的预测性，但使用它们可能是非法的。如果是合法的，当人们知道你对某些群体的方式不同时，使用此类数据可能会产生声誉风险。如果基于模型分数的折扣策略导致你只对直男士提供折扣——那将会引起争议。


