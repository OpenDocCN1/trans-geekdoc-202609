    Don’t get me wrong, I’m not saying that you won’t be able to buy a fully self-driving
    car at some point and I think it’s going to be great when you can, but it’s going
    to be a while yet. The hype is greater than the actuality. What we are seeing
    in practice are cars with a steadily increasing number of autonomous features,
    starting with automatic breaking, self-parking and lane assist, with more complex
    features appearing all the time. However, to get to fully autonomous anyone, anytime,
    anywhere driverless transport, there are a whole host of niggly issues that are
    still being worked upon, and I don’t mean the often cited “shopping trolley or
    child” dilemma. Doing an illegal U-turn when the traffic backs up (we’ve all done
    it!), pulling out into oncoming traffic, getting out of the way of the emergency
    services, overtaking a slow-moving tractor on a single lane road and knowing when
    you are going to have to drive up on the pavement/sidewalk. These are just a few
    of the things that regular human drivers have to do on a daily basis all over
    the world. They don’t do these things without reason. Sometimes, you have to mount
    the pavement or overtake when its technically illegal, otherwise you’ll just get
    stuck with dozens of angry drivers pomping their horns behind you. A hand gesture
    from a fellow driver lets you know it’s safe to pull out, even if it doesn’t look
    that way. And to those who say that these things will all be solved when we remove
    human drivers from the road – that’s just purple unicorn fantasy land. The challenge
    of getting Americans to give up their right to drive would make revoking the second
    amendment look like a picnic.


    Finally, who’s to say a self-driving car is a self-driving car? Surely there must
    be some independent official framework and testing process that the vehicles must
    pass before a manufacturer can say that its cars are self-driving? If I have to
    pass a driving test then so should a driverless car. Many governments are working
    on these things but they are still in their infancy.


    OK OK – enough moaning about self-driving cars. Why is this relevant to a book
    like this anyway? Well, the original focus of this chapter was going to be something
    along the lines of: “Avoiding the hype and identifying the opportunities.” I wanted
    to write about all the interesting ways in which machine learning and artificial
    intelligence are changing society at large. This is important because changes
    in how society operates generates both threats and opportunities. New avenues
    of commerce open up, and old ways of doing things become a distant memory of repetitive
    hard work and slow, manual, inefficient processes. No one wants what happened
    to Kodak and Blockbuster to happen to them. Adapt or die.


    However, you have to be aware of the risks, barriers and blockers just as much
    as the opportunities. There is a reason why they call it the bleeding edge of
    technology. For every new tech success story there are dozens of failures, but
    we always give a lot more attention to the successes and push the failures to
    the back of our minds. A common saying is: “It’s a wise man who learns from the
    mistakes of others.” However, when I searched Amazon for books on “Business failure”
    the number of results returned was less than 5% of the number returned when searching
    for “Business success.”


    The different amounts of attention we give to success and failure often translates
    into an unrealistic expectation of how new technologies will impact us. Self-driving
    cars are a prime example of this effect. They demonstrate the excessive optimism
    of Silicon Valley and the over-hyping of new technologies that often occurs. Virtual
    reality and wearable tech are a couple of other examples that are now a bit further
    down the line. Massively hyped initially, did not take over the world, but they
    do have some really useful real-world applications.


    In fact, most new technologies traverse this path. The technology often proves
    useful in the long run, but rarely achieves the highs that the techno-evangelists
    suggested when the technology was first envisaged. If you want to obtain a general
    view of this over-hyping effect in practice, then I can’t recommend the Gartner
    Hype Cycle highly enough. This principle is also captured by Amara''s Law:


    > “We tend to overestimate the effect of a technology in the short run and underestimate
    the effect in the long run.”


    In 2012, Gartner reported autonomous vehicle technology as being 5-10 years from
    maturity. Five years later in 2017, this figure had been revised upward to more
    than 10 years.


    Another, more general, example of the hype around AI technologies are the estimates
    on the number of jobs that will be lost due to AI driven automation over the next
    couple of decades. Make no mistake, AI is a disruptive technology. Many people
    will lose their jobs or have to adapt to different ways of working because of
    it, but it’s not going to replace everything that we do – at least not in the
    next 10-20 years.


    The most influential study of its day in 2013, put the number of jobs at high
    risk of being lost due to automation at 47%. The study estimated that by sometime
    around 2030-2035 almost half of all jobs in the US currently done by people would
    be done by machines. The estimates for other advanced economies such as the UK
    and Germany were similar. Over time, this estimate has been revised down. In 2017,
    PwC suggested an upper limit of 38%. A comprehensive study by the OECD was quoting
    a figure of just 10% by 2018, and that’s not taking into account all the extra
    jobs that will be created to support these new technologies. That’s still a pretty
    big impact, but a lot smaller than what was originally being talked about. If
    you spread those jobs losses over a 20 year period, then that equates to just
    1 in 200 jobs lost each year – not taking into account the new jobs that will
    be created.


    Taking all this in the round, the usual rules apply. From a business perspective,
    AI isn’t really any different from any technological development. You need to
    assess the impacts and take a view as to if, where and how AI based technologies
    are going to useful. Don’t blindly follow the herd. Just because everyone else
    says they are doing it does not necessarily mean it’s right for you. Of course,
    you mustn’t stick your head in the sand. You should be proactive in seeking out
    new ideas and different ways of working, but make your own assessment of the value
    that artificial intelligence and machine learning can add. Also, don’t rely on
    third parties, with an interest in selling you a solution, to quantify the benefits
    for you.


    Almost daily, I get e-mails from data science companies offering to revolutionize
    my IT systems, automate my processes and enhance my data analytics capability.
    How do I work out which ones have something to offer me and which ones are just
    riding on the coat tails of these technologies?


    As we’ve discussed in previous chapters, the technology has to be applicable to
    real business problems and processes if it’s going to add value. A machine learning
    based solution will only add value if it helps you to achieve at least one of
    the following:


    *   Reduced costs. It facilitates doing something more efficiently, such as better
    warehouse and inventory control or optimizing product pricing.

    *   Improved quality. The solution delivers better products and services. For
    example, faster fulfilment of customer orders or reducing customer complaints.

