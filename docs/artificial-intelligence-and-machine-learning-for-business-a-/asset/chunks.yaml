    The emphasis is on what I’ve termed “simple AI” type problems in previous chapters.
    This is where one might be aiming to use a machine learning approach to do things
    such as deciding which job applicants to interview, making preliminary diagnosis
    of medical scans, deciding how customers should be treated and so on. The advice
    in this section may be less relevant to the development of “complex AI” systems
    such as the operation of autonomous vehicles or the development of personal digital
    assistants. However, much of the advice remains valid for these types of application
    as well.


    What follows is a concise list of questions you should ask when considering the
    use of machine learning within your organization. Or as I like to call it: “Dr
    F’s checklist for machine learning success.”


    Unless you can answer all of these questions with a high degree of certainty before
    the project leaves the business requirements phase, then there is a very real
    chance that the project will fail. Consequently, you risk ending up spending a
    lot of time and money on the project with no benefits to show at the end of it.


    ### Dr F’s checklist for machine learning success


    1. **What is your business problem?** Machine learning has no intrinsic value
    in itself. It has to be applied to a specific problem or objective if it’s going
    to be of any value. If you can’t identify a business problem to address then stop
    right now!


    2. **What metric do you wish to optimize?** This should be something that can
    be measured in simple terms and which is important to you. Time saved, increased
    profit, reduced cost, customer satisfaction and lives saved are all typical examples.
    This is what the machine learning process will be used to optimize.


    3. **What type of decision rules and actions will you apply?** You have to make
    decisions based on what the output from the machine learning process is telling
    you and then act upon those decisions. If you can’t think what you will do with
    a predictive model then why have it?


    4. **Where will the data to do machine learning come from?** Machine learning
    requires at least several hundred, and ideally many thousands, of example cases
    to work with. For most machine learning problems, the metric of interest (item
    2 above) needs to be available for these cases.


    5. **How will you operationalize the machine learning process?** What system or
    process will the predictive models and decisions rules be implemented within?
    This will require time and money. Who will do it and who will pay for it? The
    models and decision rules won’t implement themselves.


    6. **What are the ethical and legal risks associated with automation?** Use the
    guidelines in Chapter 13 to assess these based on customer impact, data immutability
    and beneficiaries. What mitigation will you undertaken to manage any risks? Have
    you also considered the data protection laws that apply in your region?


    7. **Is all required data available operationally?** Make the data scientist provide
    a checklist against every data item that features in their models. This is to
    ensure that the data that the models need exists within the implementation platform.
    If any data items are unavailable then you won’t be able to use the solution that’s
    been developed.


    8. **Is the solution being implemented in an active or passive way, as described
    in Chapter 11?** If it’s in a passive way, what controls do you need to ensure
    that overriding only occurs when it’s right to do so? If people review, and potentially
    override, every decision made by the system, then the system will not add any
    value.


    9. **How will you assess the success of the project?** The theoretical benefits
    presented at the end of the analytical phase of a machine learning project are
    only indicative of what actually happens in real life. A monitoring process is
    needed to assess the system when it goes live. This is so that you can measure
    the actual benefits that are realized against those that were promised.


    10. **What are the ongoing costs of maintaining the system?** Over time, new data,
    new regulations, changing business requirements and so on, will mean that the
    system will require modification and may eventually need to be redeveloped from
    scratch. How often is this expected to occur and how much is it likely to cost?
    Don’t forget to include costs for regulatory compliance and annual audits.


    My advice to you if you are new to machine learning, is to take this list with
    you whenever you go and meet suppliers of AI/machine learning solutions. In addition
    to answering these questions for yourself, how the supplier responds to them will
    give you a good indication of their understanding of your requirements. If they
    can only answer in terms of general benefits or vague statements about needing
    to keep up with the competition, then beware.


    ## About the Author


    Steven Finlay is a data scientist with more than 20 years’ experience of developing
    practical "value add" machine learning solutions in large scale data environments.
    He holds a PhD in predictive modelling and is an honorary research fellow at Lancaster
    University in the UK.


    Steve has previously been employed by one of the UK''s top 10 banks to manage
    their suite of credit risk models, has developed machine learning approaches for
    the UK government and worked for a number of consultancy groups. He is currently
    Head of Analytics for Computershare Loan Services (CLS) in the UK.


    Dr Finlay has published a number of practically focused books about machine learning,
    artificial intelligence and financial services. His other books (published by
    Palgrave Macmillan) include:


    * `Predictive Analytics, Data Mining and Big Data. Myths, Misconceptions and Methods.`

    * `Credit Scoring, Response Modeling and Insurance Rating. A Practical Guide to
    Forecasting Consumer Behavior.`

    * `The Management of Consumer Credit. Theory and Practice.`

    * `Consumer Fundamentals.`


    ## Notes


    * [1]: Predicting consumer behavior is a very common application of machine learning,
    but there many others. For example, the same techniques are used to predict stock
    prices, when complex machines are likely to break and which organizations are
    likely to become bankrupt.

    * [2]: The original role of credit reference agencies (also known as credit reporting
    agencies or credit bureaus) was as a central repository for data about debts and
    loan repayments. This is still at the core of what they do, but these days credit
    reference agencies also hold all sorts of personal information. Consequently,
    a credit report can contain a wide variety of personal data in addition to information
    about a person’s credit history. Credit reference agencies were arguably the first
    “Big Data” companies, decades before the term began to be applied to the likes
    of Google, Amazon, Facebook, et al.

    * [3]: Siegel, E. (2016). Predictive Analytics: The Power to Predict Who Will
    Click, Buy, Lie, or Die. 2nd Edition. Wiley

    * [4]: See, for example, the arguments made by Roger Penrose in his books: `The
    Emperor''s New Mind: Concerning Computers, Minds, and the Laws of Physics` and
    `Shadows Of The Mind: A Search for the Missing Science of Consciousness.`

    * [5]: Cellan-Jones, R. (2017). ‘Can Google police YouTube?’ BBC [http://www.bbc.co.uk/news/technology-39338009](http://www.bbc.co.uk/news/technology-39338009),
    accessed 12/05/2018.

    * [6]: Kelion, L. (2018). ‘YouTube toughens advert payment rules’. BBC [http://www.bbc.co.uk/news/technology-42716393](http://www.bbc.co.uk/news/technology-42716393),
    accessed 12/05/2018.

