    \ some of the clusters tend to be very similar. If there are too few clusters,\
    \ then the solution may provide insufficient granularity.\n\nThe cluster center\
    \ is calculated as the point where the sum of distances between that point and\
    \ all of the cases in the cluster is a small as it can be.\n\n[https://zbmath.org/about/](https://zbmath.org/about/)\
    \ \n\n869,666 papers were added to the medline database in 2016. [https://www.nlm.nih.gov/bsd/stats/cit_added.html](https://www.nlm.nih.gov/bsd/stats/cit_added.html)\
    \ Accessed 04/04/2018.\n\nIn chess, a standard value assigned to a pawn is 1,\
    \ a bishop 3, a rook (castle) 5 and so on. Therefore, a simple view of the game\
    \ can be determined by summing up the value of each players pieces remaining on\
    \ the board. An actual assessment of who is winning during a game is of course\
    \ far more complex than this. All advanced chess programs consider the position\
    \ of the pieces as being just as important, if not more so. However, a simple\
    \ points based measure of success is very easy to understand and calculate.\n\n\
    Knapton, S. and Watson, L. (2017). ‘Entire human chess knowledge learned and surpassed\
