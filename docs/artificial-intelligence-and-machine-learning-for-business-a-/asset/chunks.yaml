    ## 常见应用场景


    - **Life expectancy**: `score` provides a prediction as to how long a person is
    expected to live. This type of model is often used to set life insurance premiums
    and annuities.

    - **Journey time**: Given information about your driving habits, current location
    and driving conditions, when are you likely to arrive at destination?

    - **Credit loss**: When someone defaults on a loan, how much of the debt is likely
    to be written off?

    - **Spend**: The model predicts how much someone is likely to spend in their supermarket
    in the next 12 months.

    - **Purchase interval**: How long after buying a product can repeat purchase be
    expected? Marketing activity can then be timed to occur shortly before the customer
    is expected to buy the product again.

    - **Call length**: How long is a call predicted to last? This aids with resource
    planning in centres.

    - **Occupancy**: Predicting what time of day someone is likely to be at home hence
    the best time to visit them.

    - **Response time**: How long after an action is taken is a response observed?
    After sending someone a letter, e-mail or text, how long does it take for them
    to reply?


    ## 模型选择策略


    In some cases, the `regression` model is a direct estimate of what one is trying
    to predict. A `spend` model that generates a `score` of 5 means that the customer
    is predicted to spend $5. In other situations, the `score` is scaled to represent
    percentiles or to allocate a grade from 1 to 10, A to E. Grade A represents the
    very best (most profitable) customers, Grade E the least profitable ones.


    Both `regression` and `classification` models are widely used, but `classification`
    models tend to be the most popular, particularly for business applications. This
    is because simple events have traditionally been the easiest for organizations
    to understand. This makes it simpler for data scientists to translate business
    objectives into an appropriate numerical representation. Defining if a customer
    buys or not is pretty straightforward (`classification`). However, determining
    the profitability of an individual sale is far more complex (`regression`).


    What type of model to use (`regression` or `classification`) depends very much
    on what one wants to do with the scores. If all I am interested in identifying
    which credit card customers are most likely to move to a competitor, then what
    I need is a `classification` model to predict probability of attrition. A retention
    strategy (such as offering a discount or free gift) is then applied to try to
    retain those customers most likely to defect.


    If on the other hand primary concern is to identify profitable customers with
    the aim of encouraging them to spend more, then what I need is a `regression`
    model. The model is designed to predict who are going to be the big spenders and
    target those. I do not need to bother with the rest of the customer base.


    There is however a third option. Let’s say that what I am really interested in
    doing is retaining profitable customers and I do not care about losing unprofitable
    ones who do not spend much. In this situation, then possibly the best approach
    is to build two separate predictive models as follows:


    1. An `attrition` model to predict those customers most likely to defect to a
    rival product (`classification`).

    2. A `revenue` model to identify which customers spend the most (`regression`).


    The two models are then used in combination to drive a retention strategy as shown
    in Figure 1.


    /00006.jpg


    Figure 1 uses the scores from each model to segment the population by both revenue
    and attrition. By using the two models in combination, a tailored set of retention
    strategies can be applied and significant cost savings achieved. This is because
    resources are not spent trying to retain customers that will not attrite or those
    that have a high probability of attrition but who do not spend much.


    For the example in Figure 1, three differential strategies are applied:


    1. Do nothing for the “worst” customers. It is not cost effective to try and retain
    these.

    2. Undertake a light touch (i.e. low cost) retention strategy for those in the
    middle (`strategy 1`).

    3. Expend the most effort on the “best” group of customers (`strategy 2`).


    Of course, there are alternative formulations of this problem. One could build
    a single predictive model that only tries to predict the very highest revenue
    generating customers who are also likely to attrite, and these are then targeted.
    This is certainly a reasonable approach, but it would result in a loss of granularity
    about the nature of customers; i.e. a single model would not allow you to explore
    the trade-off between attrition and revenue which the twin model approach, as
    illustrated in Figure 1, provides.


    Note that the models only provide predictions about what customers will do. They
    do not tell you what should then be done on the basis of those predictions. With
    regards to what activities should be undertaken for retention strategies 1 and
    2, that’s an additional consideration that the organization needs to address within
    the overall scope of its machine learning project. This is important because quite
    a common failing is for organizations to build some very good predictive models
    and then not use them for anything. Making the right decisions and then acting
    upon those decisions is vital if a machine learning project is going to be successful.


    ## 4. Why Use Machine Learning? What Value Does it Add?


    Applications of machine learning, based on predictive models, are increasingly
    used to replace and/or supplement expert judgement and manual decision-making
    in all sorts of areas. This is because predictive models tend to be:


    - **More accurate than human experts**. Predictive models sometimes get predictions
    wrong just like people, but the overwhelming evidence is that on average they
    do not get it wrong quite as often. In many fields, predictive models consistently
    outperform human experts by 20-30%; i.e. they make 20-30% fewer errors or identify
    20-30% better (more important/more profitable) cases.

    - **Unbiased**. Unlike people, predictive models do not display deliberate prejudicial
    bias against someone because of their gender, race, disability, etc. Do not get
    me wrong, predictive models do display bias, but if designed correctly they will
    only give certain individuals or groups higher or lower scores than the population
    at large if this is based on hard statistical evidence – it is not based on some
    unfounded preconception or stereotype.

    - **Fast**. As part of an automated decision-making system, a predictive model
    can be used to predict the behavior of millions of individuals in seconds. In
    most cases, it would be unfeasibly expensive and time consuming to have people
    manually making the same judgements.

    - **Cheap**. Once developed, predictive models are often cheaper to deploy than
    their human counterparts. Although one must not forget the upfront cost associated
    with initial development, plus ongoing maintenance and licensing costs.


    In summary, predictive models can be used to make better, cheaper and faster decisions
    than those made by human experts. What this means is that in many areas predictive
    models are replacing people. In particular, white collar roles that require highly
    trained staff to use their expert judgement to decide what to do.

