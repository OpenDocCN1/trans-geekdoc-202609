    **1. 如果问题由机器人顾问（Robot Advisor）处理，客户没有得到正确答案的概率有多大？它是基于预测模型的。因此，它在某些情况下会出错。**


    这些结果之间也存在权衡。你可能可以使用该顾问来减少人员配置、提高服务水平或二者兼之。如果你想确保系统仅在几乎确定能给出正确响应时才回答查询，那么你转交给人工操作员的请求将比你愿意接受高错误率时多得多。如果设置一个阈值，只有当系统给出正确答案的概率（例如，高于
    99%）时才响应客户，那么你转交给人工核保员的请求将比你将阈值设置为 80% 时多得多。此时的问题变成了客户服务问题。如果你将阈值设置为 80%，那么将会有高达
    20% 的客户感到不满，因为系统在每 5 次情况中会有 1 次给他们错误的答案，而不是每 100 次中的一次。


    为了能够回答此类问题并制定适当决策规则（第 9 阶段），数据科学家需要收集有关组织运营性质的信息。这样他们才能量化其工作的业务效益。否则，他们如何证明自己所做事情的价值呢？


    如果一切都是为了节省成本或增加利润（这几乎总是如此），那么在这个示例中，数据科学家需要找出不同类型的通话通常持续多久，以及每次通话为公司带来多少成本。这结合自动化通话的比例数据以及开发系统的成本，将能够对机器人顾问项目进行成本效益分析。


    到本章为止，我们一直关注应用机器学习的过程。但数据科学家需要多长时间才能为你交付一个预测模型呢？这是一个非常有误导性的问题。许多解决方案供应商都会告诉你，他们可以在几分钟内为你开发好模型。“你只需要将数据上传到我们的云端
    AI 解决方案中，我们将在几秒钟内给你答案！”这在某种程度上是真实的，但你需要考虑应用机器学习的背景。要在几分钟内获得结果，你必须将所有数据整齐地收集在一个地方。你不需要太在意模型的预测是如何得出的、如何交付或以什么格式交付的。如果你有多个复杂的数据库需要整合，有大量杂乱的数据，并且生成的模型符合各种法律法规和业务要求至关重要，那就是另一回事了。在获得合适的解决方案之前，可能需要几周、几个月甚至几年。


    ## 11. 机器学习的运营化


    一些组织已经使用了机器学习几十年。这在金融服务行业以及大型面向消费者组织（如超市连锁和百货商店）的营销部门尤为如此。对于硅谷精英（包括 Amazon、Google
    和 Facebook 等公司），机器学习是他们所一切的核心。这些组织拥有完善的 IT 基础设施、系统和流程，用于应用机器学习并实施结果。他们日复一日地这样做——这只是业务常态。


    对于对人工智能和机器学习较新的组织来说，首次构建预测模型并将其作为自动化决策系统的一部分进行运营化可能是一项艰巨的任务。有时，可能需要几个月的时间所需的数据才能就绪，机器学习过程才能开始。然而，收集正确的数据并应用相关的机器学习算法（如上一章所述）通常是机器学习项目中最简单的部分。这是因为归根结底，预测模型只是电子表格、Word
    文档或其他软件中的一组方程。一旦机器学习过程完成，如果结果要发挥作用，就需要对其进行运营化。


    主要的挑战，特别是对于以前没有使用机器学习的组织来说，是接受自动化决策的使用。他们需要：


    1. 建立基础设施，使预测模型成为组织运营决策能力的关键部分。

    2. 对基于模型预测做出的决策感到放心。这包括建立治理程序，以确保基于模型的决策按照预期执行、符合法律法规，并且在特定的预先约定的情况下，否则这些决策不会被员工忽略或无。。


    也许一个组织可以犯的最大错误是假设成功的机器学习是：“这完全取决于模型”，而他们应该从“这完全取决于业务”的角度来考虑问题。


    机器学习可能为组织所做的事情增加价值，但反过来说，也可能不会。一个有用的类比是制造汽车引擎。工程师可以花费大量时间制造一个非常强大且高效的引擎。然而，除非有人考虑过车身设计、发动机安装等（引擎将放置在其中），否则这个引擎将无法提供任何益处。没有汽车的其他部分，引擎就是没用的。机器学习也是如此。除非有一个业务流程来嵌入模型，否则模型将没有太大用。


    如果一个组织要成功将机器学习整合到其业务流程中，那么需要考虑以下五个核心领域，顺序如下：


    1. **问题**。机器学习将用于什么？需要一个机器学习可以帮助解决的明确问题。

    2. **文化**。能否说服业务部门在没有人类专家参与的情况下接受自动化决策？从管理角度来看，是否有足够的资源（即人员和资金）使预测模型整合到相关的业务流程中？

    3. **实施**。将使用什么系统或流程将模型付诸实践？评分如何计算？基于评分做出的决策如何由相关的业务职能执行？

    4. **开发数据**。是否存在足够的数据来构建预测模型？

    5. **分析能力**。组织是否拥有所需的软件工具和知识来分析数据、应用机器学习并构建高质量、可用的预测模型？


    从乍看，这个列表的顺序似乎有些违背直觉。例如，为什么模型实施排在分析之前？难道不是先建立模型，然后考虑实施它吗？


    机器学习对很多事情都有用，但并不总是基于机器学习的自动化解决方案才是你需要的。同样，仅仅在技术上可以预测某些事情并不意味着你应该这样做，也不意味着这些预测会被证明是有价值的。因此，从问题规范和解决该问题的计划开始。


    如果机器学习将是问题的答案，那么在进行其他工作之前需要确定的两个关键事项是：


    '
