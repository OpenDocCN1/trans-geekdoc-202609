  trans: '


    - Hastie, T., Tibshirani, R. and Friedman, J. (2017). 《统计学习方法：数据挖掘、推断与预测》(Springer
    Series in Statistics) 第 2 版. Springer 出. 这是一本由该领域三位世界顶级学者编写的指南，对机器学习中使用的许多数据挖掘工具提供了详尽的技术性介绍。

    - Hosmer, D. and Lemeshow, S. (2013). 《应用逻辑回归》(Wiley Series in Probability and
    Statistics) 第 3 版 Wiley 出. 逻辑回归仍然是生成预测模型最流行、应用广泛的方法之一。这是我向想要进一步了解这种方法的人的第一本书。

    - Khun, M. and Johnson, K. (2013). 《应用预测建模》。Springer 出. 另一本与 Baesens（上文）风格类似的构良著作。它将实践建议与该主题更具数学性的方面结合。

    - Witten, I. H., Frank, E., Hall, M. A. and Pal, C. J. (2016). 《数据挖掘：实用机器学习工具与技术》，第
    4 版 (The Morgan Kaufmann Series in Data Management Systems)。Morgan Kaufmann 出.
    这是一本对实用数据挖掘感兴趣的人的详尽参考手册。我发现它结合了理论与实践，包含了许多良好的案例。

    - Zelle, J. (2016). 《Python 编程：计算机科学导论》。第 3 版. Franklin, Beedle & Associates.
    关于 Python 编程语言的实用介绍。


    ## 附录 C 机器学习与人工智能中的常用术语


    **激活函数 (Activation function)**。一种用于将神经元的原始输出转换为其最终输出（分数）的等式（数学公式）。激活函数通常用于强制神经元的输出落在固定范围
    own。这个范围通常在 0 到 1 之间，但某些激活函数的输出具有不同的范围。常见的激活函数包括逻辑回归函数、双曲正切函数和恒等函数。请参见 [`en.wikipedia.org/wiki/Activation_function`](https://en.wikipedia.org/wiki/Activation_function)
    获取更完整的激活函数列表及其推导。


    **算法 (Algorithm)**。算法是一组为了解决特定问题按顺序执行的指令或程序。在机器学习中，各种算法被用于发现数据中的模式并创建预测模型。


    **人工智能 (AI)**。对生物（主要是人类）分析和决策能力的复制。例如，物体识别和语音识别、预测人的未来行为，以及玩国际象棋、扑克和围棋等游戏的能力。


    **大数据 (Big Data)**。海量多样化且变化的数据集合，很难使用标准个人电脑/服务器处理；即通常大小为 TB 或更大。大数据技术利用先进的计算机架构和专业软件来促进这些数据集的快速处理。机器学习是从大数据中提取价值的主要工具之一。


    **因果关系 (Causation)**。关于某事为何发生的背后的推理；即某事发生。不要与相关性混淆。


    **分类模型 (Classification model)**。一种预测给定事件是否会发生的预测模型。例如，两个人在约会中投缘得来的可能性、某人购买某种类型汽车的概率，或者一个人在未来
    10 年内患糖尿病的概率。分类模型生成的评分是对事件发生概率的估计。不要与回归模型混淆。


    **聚类 (Clustering)**。聚类是指包含具有相似特征的人或事物的群体。例如，年龄和收入相似的人可能处于一个聚类中，职业角色和家庭规模相似的人可能处于另一个。聚类算法是无监督学习的一种形式（见下文）。


    **卷积（神经）网络 (Convoluted neural network)**。一种深度神经网络，其中层中并非所有神经元都连接到下一层的所有神经元。通过较少的权重，训练网络所需的（非常大量的）时间大大缩短。一个经典应用是物体识别。想象你有一张由
    256 * 256 (65,536) 像素组成的图像。传统的神经网络为第一层的每个神经元都需要 65,536 个权重，每个像素一个！通过将图像分割为 64
    个子区域（每个区域有 32 * 32 像素）并仅连接每个子区域内的神经元，每个神经元的权重数量减少到仅 1,024 个。之所以有效是因为图像中最重要的特征通常聚集在一起（即在相同或相邻的子区域内）。图像两端的像素的重要性小得多。


    **相关性 (Correlation)**。如果一个变量的变化与另一个的变化同步发生，则该变量与另一个变量相关。重要的是，这并不一定意味着一件事是由另一件事引起的（因果关系），尽管事实可能是。鹳的迁徙与出生有关（在鹳迁徙的春季出生的孩子更多），但鹳的迁徙并没有导致出生！


    截断分数 (Cut-off score)，请参见决策规则。


    **数据挖掘 (Data mining)**。数据挖掘是在数据集中发现有用信息的科学，人类无法通过肉眼观察轻易识别这些信息。数据挖掘利用了来自不同学科的广泛算法和自动化程序，包括统计学、计算和人工智能/机器学习。


    **数据科学 (Data science)**。指以务实的方式将数学（机器学习）知识与数据及 IT 技能相结合，以提供具有实际价值的基于机器学习解决方案的技能/艺术。


    **数据科学家 (Data scientist)**。对从事数据科学的人的称呼。优秀的数据科学家专注于提供在真实环境中运行的解决方案。他们不会纠结于理论。


    **决策规则 (Decision rule)**。预测模型生成分数。然后根据这些规则来决定如何处理人们。高于给定分数（截断分数）的人接受一种治疗，低于截断分的人接受另一种。例如，在评估人们的某种疾病时，只有得分高于截断分（即患病风险最高）的人才会获得治疗。


    **决策树 (Decision tree)**。一种使用递归算法将人群划分为更小小组的预测模型。也称为分类回归树 `CART`（因为它们可以用于分类和回归）。


    **深度学习 (Deep learning)**。基于复杂神经网络（或相关架构）的预测模型，包含跨越许多层的许多神经元。深度学习在物体识别和翻译等复杂问题上取得了成功。


    **开发集 (Development sample)**。用于机器学习过程构建预测模型的数据集。开发集需要至少包含数百案例，但通常使用包含数万更大的样本。


    **集成 (Ensemble)**。由多个子模型组成的预测模型（最少 3 个，有时是数千）。所有子模型预测相同的结果，但使用不同的方法和/或不同的数据构建。这意味着模型并不总是生成相同的预测。集成整合了所有个体预测以得出一个最终预测。模型集成通常（并非总是）显著优于最好的单个模型。


    **前馈神经网络 (Feed forward neural network)**。一种连接全单向的神经网络，从一层神经元连接到下一层。没有反向或层间连接。大多数神经网络都是前馈网络。


    '
