  trans: '


    *   **确定性情况。** 如果你明确知道自己将如何处理某些客户，那么你不需要为他们建立预测模型。将他们包含在开发样本中只会削弱模型在剩余样本^([\[48\]](#index_split_028.html#filepos427242))上衡量得出的效能。


    *   **不可解释性。** 机器学习的一项基本原则是，在使用你不完全理解的数据构建模型时，应该非常谨慎。这对于那些受行业监管或对组织成功具有战略重要意义的模型来说，尤为如此。如果数据科学家向你展示了一个使用他们无法解释的数据构建的模型，那么这就是你应该关注的风险。


    如果一个机构拥有巨大的数据库，那么在机器学习过程中分析这些数据库时，所需的计算机资源可能会成为问题。只选择部分样本（例如 1:10 或 1:100 的案例）纳入开发样本的情况，这种情况并不罕见。


    “大数据纯主义者”可能会认为，你应该分析所有可用数据，因为这样做可能会遗漏细微的模式，从而创建出次优的模型。从某种意义上来说，他们是正确的。如果你采用样本而不是使用全样本，所得模型的准确性将不会那么高。然而，这非常符合收益递减规律。对于几乎所有的实际业务问题，增加几万个案例带来的收益都是微乎其微的。如果你以适当的方式^([\[49\]](#index_split_028.html#filepos427639))，那么与使用
    1000 万案例开发的模型相比，使用 10 万案例开发的模型将获得 99% 的收益。换句话说，仅仅因为你拥有海量数据并不意味着你需要投资专业的硬件/软件来应用机器学习——你只需要在方法上足够聪明，并专注于真正重要的数据。


    该流程的第四阶段是数据准备。之所以这样做，是因为原始数据可能格式不佳、包含错误，或者无法提供数据的最佳表示；即，不同的表示方式将使机器学习过程更容易发现数据中的重要模式。数据准备期间主要有四项任务：


    1.  **创建新数据。** 对于大多数类型的问题，年龄比出生日期更具预测性。因此，如果只有出生日期，则可能需要计算年龄。如果你有信用卡交易数据，最好是创建汇总变量，代表每笔交易的平均支出、上个月的交易次数、距离上次交易的时间等等。


    2.  **数据清洗。** 数据可能缺失或不正确。数据准备的一个关键目的是识别此类数据存在于何，并将其删除（排除）或重新格式化；即，用标准值对所有错误/缺失的数据进行重新编码。如果用于计算年龄的出生日期在未来或在过去远得离谱，你可能想为年龄定义一个默认值（例如“-1”）来表示这些情况。


    3.  **合并。** 以相似的方式表示相似的数据是一个良好的做法。如果你有一个名为 `Property Type` 的数据项，其值 `D`、`Det` 和
    `DH` 都代表相同的意思（即 `Detached House`），那么这些应该被合并为一个单一值，用于表示所有独立屋案例。


    4.  **转换为数值。** 机器学习算法喜欢数值型数据。`“Yes”/`“No”/`“Maybe”` 将转换为 `0/1/2`。


    '
