    The GDPR covers a wide range of issues relating to personal data and applies to
    all automated decision-making and profiling applied to living individuals. The
    four areas that are particularly relevant in a machine learning/AI context are:


    1.  Explicit consent needs be obtained from someone before their personal data
    can be gathered or used. The consent can’t be inferred or be “consent by default.”

    2.  It is not permitted to make decisions about people, using an automated decision-making
    process which has a legal or similarly significant impact upon them unless they
    have given their consent that automated decision-making can be used for this purpose.
    This is additional to the consent to hold data. The primary exception to this
    is where automated processing is necessary to allow a legal contract to be enacted.

    3.  An individual has the right to be provided with an explanation as to how an
    automated decision has been arrived at and the consequence of that decision. This
    aligns with the more general requirement in the GDPR for organizations to provide
    individuals with information necessary to ensure that fair and transparent processing
    of their data occurs.

    4.  Automated decision-making systems must not display unfair discrimination;
    i.e. treating people differently on the basis of their race, sexual orientation
    and so on.


    ### Obtaining Explicit Consent

    To obtain explicit consent the right approvals need to be in place. If we are
    talking about making decisions about employees, suitable clauses need to be included
    in their employment contracts. For consumers, approvals need to be provided via
    people ticking relevant tick boxes or similar.


    ### Significant Impact

    For item 2, the key word is significant. If a decision is going to have a noticeable
    impact on an individual, then that person has the right to demand that the decision
    is reviewed manually. The law is clear that this review needs to be fully independent
    and undertaken by someone empowered to make a different decision to the one made
    by the system. It can’t just be a case of clerical staff rubber stamping the original
    decision.


    What makes this item difficult to apply in practice is that there is no accepted
    definition of “significant.” Perhaps most importantly, what may be insignificant
    for some people may be very significant for others, even if it’s only a very small
    proportion of the people processed through the system. It can’t be taken for granted
    that certain types of decision-making don’t significantly impact people – it’s
    got to be on a case-by-case basis. Imagine a supermarket chain that decides it
    will apply a differential pricing strategy. Customers who it believes can’t or
    won’t shop elsewhere are charged 5% more for their groceries than more fickle
    customers who shop around. For most customers this won’t be more than a slight
    inconvenience, but for those on the poverty line it may represent a very real
    impact on their quality of life. What this means practically is that it may be
    prudent to always begin from the position that all decisions are potentially significant
    decisions unless there is sufficient evidence to the contrary.


    ### The Right to an Explanation

    With regard to item 3 - the right for an explanation about how a decision was
    arrived at - this requires an understanding of how a predictive model has been
    used. For instance, why someone’s insurance premiums are a certain amount or why
    they were declined for a loan. As a minimum, an organization would need to tell
    an individual making such an enquiry:


    *   Which data items are used in the decision-making process. For example: “when
    assessing your application for a new phone contract, we use information about
    your age, income and marital status, together with information about your credit
    history to make a decision.”

    *   The source of those data items. This could be direct from the individual via
    an app or online form, information that is publicly available such as voter records
    or information they have given other organizations permission to share, such as
    social media platforms or credit reference agencies.

    *   Details of which data items contributed to the decision and in what way. In
    deciding whether or not to accept someone’s application for a phone contract,
    one might say that decisions are based on a credit score. The score uses information
    about people’s credit history, and the number and recency of missed payments negatively
    impact the score. The applicant missed two mortgage payments last year resulting
    in a low credit score. Therefore, their application for a new contract has been
    declined.


    In some cases, it is possible that a full technical explanation may also be required
    as to all of the individual model parameters, although at the time of writing
    the exact circumstances under which this would be required are unclear. One might
    assume that it will only be required in relatively few specific cases that reach
    the courts, rather than being something that is provided whenever a customer makes
    an enquiry. However, it’s pretty clear under GDPR that: “Complexity is no excuse
    for failing to provide information to the data subject.” In the UK, the Information
    Commissioner’s Office made the following comment with regard to model explicability:


    > “Big data organisations therefore need to exercise caution before relying on
    machine learning decisions that cannot be rationalised in human understandable
    terms. If an insurance company cannot work the intricate nuances that cause their
    online application system to turn some people away (however reasonable those reasons
    may be), how can it hope to explain this to the individuals?”


    ### Challenges and Compliance

    What this means is that there’s a potential barrier to using deep learning and
    other “black box” types of model to make decisions about people, unless a suitable
    explanatory mechanism also exists. It is possible to develop such mechanisms but
    this will require additional time and cost to produce.


    Another factor that needs to be borne in mind is that individuals can change their
    mind. They may have given their permission to use their data for certain purposes
    at one time but that permission can be withdrawn at a later date. Likewise, the
    “right to be forgotten” requires organizations to delete personal data if a person
    requests it. Hence a process to deal with the changes in consent and the deletion
    of personal data need to be in place.


    Finally, there is the issue of discrimination. All decision-making systems (automated
    or manual) discriminate – that’s the nature of what they do. The question is whether
    unfair discrimination occurs. The GDPR is clear that specific items such as race,
    sexual orientation and so on, must not normally be incorporated into automated
    decision-making systems. However, one must also be able to identify and correct
    for indirect bias as we have discussed previously in this Chapter.


    Take all these things together, and what it means in practice is that the good
    old “Wild West” days of machine learning and advanced analytics are pretty much
    over when it comes to personal data. The practice of just letting a data scientist
    knock up a “quick and dirty” predictive model for your business function to use
    is all but gone – in EU countries at least. Instead, organizations which are investing
    in Big Data and automated decision-making processes need to:


    *   Assess the risks and issues associated with machine learning and automated
    decision-making up-front. It’s not an add-on at the end of a project.

