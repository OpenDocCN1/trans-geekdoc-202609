    [83] Frey, C. and Osborne, M. (2013). ‘就业的未来：工作对计算机化的敏感程度有多大’ *Technological Forecasting
    and Social Change* 114.


    [84] 论文没有给出确切日期，但指出：“根据我们的估计，美国总就业人数的 47% 处于高风险类别，这意味着相关职业在未来未指定的若干内（可能是十年或二十年）具有被自动化的潜力。”
    这使我们的时间线大约落在了 2030-2035 年左右。


    [85] 普华永 (2017) ‘到 2030 年代初，英国多达 30%的现有工作可能会受到自动化的影响，但这将被经济其他领域的就业机会增长所抵消’[`www.pwc.co.uk/press-room/Up-to-30%-percent-of-existing-UK-jobs-could-be-impacted-by-automation-by-early-2030s-but-this-should-be-offset-by-job-gains-elsewhere-in-economy.html`](https://www.pwc.co.uk/press-room/Up-to-30%-percent-of-existing-UK-jobs-could-be-impacted-by-automation-by-early-2030s-but-this-should-be-offset-by-job-gains-elsewhere-in-economy.html)
    访问于 2018 年 5 月 6 日。该研究指出，美国 38%的数字是一个基于技术可行性的理论最大值。并没有考虑到法律、经济和社会问题；即技术上可以实现某项自动化并不意味着它会被执行。


    [86] Nedelkoska, L. and G. Quintini (2018), ‘自动化、技能使用与培训’, OECD 社会就业与迁移工作论文, No.
    202, OECD Publishing, Paris, [`dx.doi.org/10.1787/2ef4eea-en`](http://dx.doi.org/10.1787/2ef4eea-en)。
    访问于 2018 年 5 月 6 日。


    [87] Abraham, H., Reimer, B., Seppelt, B., Fitzgerald, C., Mehler, B. and Coughlin,
    J. F. (2017) ‘消费者对自动化的兴趣：年度变化的初步观察’. MIT 工作论文 2017-02


    [88] 在理论上，`AUC` 可能小于 0.5。但在实践中，这通常意味着模型的构建方式存在底层问题，而不是模型真实的性能反映。


    [89] GDPR 第四条。


