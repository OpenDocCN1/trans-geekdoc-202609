    # 数据库内置机器学习系统


    这些“数据库内置”系统将数据流传输到机器学习工具，而无需先提取数据，极大地缩短了收集数据样本、构建预测模型以及随后将这些模型投入运行的时间。


    一旦配置了数据库内置系统，模型就可以自动重新开发和部署。在理论上，每当有新数据可用时，就可以构建出一个全新的更新模型——系统会从它处理的每一个新案例中学习。新模型以分钟为单位进行开发和部署。因此，数据科学家无法参与到每一个构建的模型的细节中。相反，数据科学家的角色是成为设计更广泛系统的团队的一部分。特别是，他们负责理解输入系统的数据，以及这些数据如何映射到系统需要创建预测模型的业务问题上。


    在系统上线后，软件会为数据科学家提供一个仪表板，报告整个系统的状态。例如，系统内模型的运行性能如何、模型性能随时间的变化情况、输入分析过程的数据发生什么变化等。


    只有在出现问题或需要向系统中加入某些新功能时，数据科学家本人才会参与细节工作。如果模型性能出现意外下降，数据科学家将需要调查并找出原因。他们将采取补救措施来纠正问题，并将系统恢复到最佳运行状态。


    自学习设备和自主机器人也采用了类似的方法。它们每次执行任务时，都会收集有关该事件的数据。驱动其活动的预测模型会利用这些额外数据进行自动优化。通过这种方式，随着可用数据的增加，底层模型的精度也随之提高。


    一些新型机器学习软件的进一步重点是中间工具，这些工具旨在为非技术业务用户与机器学习所需的底层数据和算法之间提供更好的接口。


    这些工具中最先进的尝试取代传统上由数据科学家承担的任务。它们可以分析并准备来自不同来源的数据，应用一系列算法，并以易于理解的方式将结果呈现给非技术用户，而无需任何公式或等式。特别是，软件尝试以一种符合业务逻辑的语境化方式呈现结果，而不是提供数据科学家所习惯的那种更正式的统计视角。


    这种方法的一个典型例子是 IBM 通过其 `Watson Analytics Software` 所采用的方法。最初版本的 `Watson` 曾在美国著名的知识问答节目《危险边缘》（Jeopardy）中击败了多名人类选手。`Watson`
    现在已演变为一种商业产品。在后台，该软件使用非常复杂的机器学习算法从各种不同的数据源中提取信息。软件的前端设计目标是经理和其他业务用户，而不是数据科学家。


    其最终结果是，当提供合适的数据时，可以在几小时甚至几分钟内向业务用户展示关于客户行为的新洞察和理解，而无需在过程中涉及技术专家。


    ## 我什么时候可以买到自动驾驶汽车？


    别担心。我确定你很快就能去当地经销商那里买一辆，而且有些人会认为你已经可以买到了。然而，如果你指的是全自动驾驶车辆，即你视障的奶奶可以停在车库里并开到她任何想去的地方，那么时间可能比所有媒体关于自动驾驶汽车的报道描述要长得多。


    对于某些人来说，21 世纪的自动驾驶汽车就像 20 世纪的登月运动一样。这是一项艰大的技术挑战，需要十年或更长时间的数十亿美元投资。成功将标志着我们通过人工手段复制和超越人类能力的一个重要里程碑。就像登月一样，道路上还有许多需要克服的挑战和其中的许多步骤。能够将火箭发射到太空或将卫星送入轨道是有用的，但这并不代表具备了把人类送到月球上的资格。这是一个更宏大的挑战。


    最近我突然意识到，一个困扰我很久的问题是：“所有的自动驾驶汽车都在哪里？”在我最近寻找新车时访问的经销商处，似乎没有人提到过它们。


    我记得多年前（如果不是 2010 年更早的话）读到过自动驾驶汽车几乎已经在这里了。我脑海中浮现出这样一句话：“想象我们将继续像现在这样开车简直太疯狂了——在
    10 到 20 年后，我们仍然得坐在方向盘后面……”如果你阅读了主流媒体以及汽车制造商和科技巨头们发布的新稿，你可能会认为全自动驾驶汽车已经准备就绪，这也是可以理解的。只有政府里的那些守旧派在阻碍这些事情。


    在讨论为什么我视障的奶奶可能在 2019/20 年无法买到全自动（`Stage 5 autonomy`）汽车，并且可能在之后的十年或更长时间内也买不到，一个值得问自己的极佳问题是：“所有的无人驾驶列车（同样的船只）都在哪里？”无疑，在轨道上往返比在公路上或在城市交通中行驶要简单得多？实际上，有几条无人驾驶列车系统在运行，但世界上只有极小比例的列车是全自动化的。那些自动化的通常是在小型、控良好的环境中运行的局部交通和/或地下系统，而不是在全国旅行的城际列车。


    为什么大多数（如果不是全部）列车没有全自动？这个问题没有单一或简单的答案。这部分是因为技术，部分与经济有关。工会、公众情绪以及政府和立法也发挥了作用。可以说，技术问题是容易的部分。所有其他事情让这些事变得困难。


    真正自动汽车的测试是，任何人都可以买一辆，而对他们的身份或去向没有任何限制。能够在高速路上脱手行驶几英里，或者在几个大城市的中心运行自动驾驶出租车，并没有真正通过测试。事实上，当涉及到全自动驾驶汽车时，答案是技术还不够好。它正在进步，但还没有到位。如果我们回到登月的类比，那么自动驾驶技术可能正处于低地球轨道阶段。虽然取得了良好的进展，但还有很长的路要走。


    '
