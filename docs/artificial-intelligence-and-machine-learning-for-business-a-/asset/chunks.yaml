    ### Principle Component Analysis (PCA). PCA is a popular variable reduction method.
    PCA uses the original set of variables to construct a new, smaller set of variables,
    which are then used in the machine learning process. PCA works on the premise
    that many variables are correlated with each other to a degree; i.e. contain some
    of the same information. Therefore, this information can be captured more efficiently
    using fewer variables.


    ### Profiling. Profiling, as defined by the General Data Protection Regulation
    (GDPR), is: “any form of automated processing of personal data consisting of the
    use of personal data to evaluate certain personal aspects relating to a natural
    person, in particular to analyze or predict aspects concerning that natural person’s
    performance at work, economic situation, health, personal preferences, interests,
    reliability, behavior, location or movements.” Profiling may or may not form part
    of an automated decision-making process.


    ### Python. Along with R, Python is one of the most popular, freely available,
    software packages used for machine learning.


    ### R. The R language is one of the most popular software platforms for undertaking
    machine learning. The R software is free and open source, with the user community
    able to develop new functionality and share it with other users. For those wanting
    to become data scientists, then a good grounding in R (and/or Python) is recommended.
    Some books on R and Python are discussed in Appendix B.


    ### Random forest. Random forests are an ensemble method, based on combining together
    the outputs of a large number of decision trees. Each decision tree is created
    under a slightly different set of conditions and hence, generate different scores.
    Random forests are one of the most successful and widely applied ensemble methods.


    ### Recurrent neural network. A type of neural network that uses the outputs from
    previous cases in the development sample as inputs for sub-sequent training. These
    types of network are particularly useful where there are sequential patterns in
    data; i.e. the ordering of cases in the development sample is important. One example
    is analysis of video. The changes in state from one images to the next (i.e. as
    objects move) can provide a lot of information about the nature of the current
    image.


    ### Regression model. A popular tool for predicting the magnitude of something.
    For example, how much someone will spend or how long they will live. This is in
    contrast to a classification model which predicts the likelihood of an event occurring.


    ### Reinforcement learning. The process whereby the weights in a model are refined
    on a case-by-case basis, based on some measure of the success or reward resulting
    from an action being taken. Each time the model produces an outcome, the quality
    of that outcome is assessed. The training algorithm then adjusts the model weights
    depending on how well it performed. Reinforcement learning is viewed as being
    more similar to the way people learn than other types of machine learning; i.e.
    supervised learning.


    ### Response (choice) modeling. This term refers to marketing models used to predict
    the likelihood that someone buys a product or service that they have been targeted
    with. A response model is a type of classification model.


    ### Score. Most predictions generated by predictive models are represented in
    the form of a single number (a score). For a classification model the score is
    a representation of the probability of an event occurring e.g. how likely someone
    is to respond to a marketing communication or the probability of them defaulting
    on a loan. For a regression model the score represents the magnitude of the predicted
    behavior e.g. how much someone might spend, or how long they might live.


    ### Scorecard. A scorecard is a way of presenting linear models which is easy
    for non-experts to understand. The main benefit of a scorecard is that it is additive;
    i.e. a model score is calculated by simply adding up the points that apply. There
    is no multiplication, division or other more complex arithmetic.


    ### Score distribution. A table or graph showing how the scores from a predictive
    model are distributed across the population of interest. Lift and Gain charts
    are both ways of presenting the score distribution in a graphical form.


    ### Sentiment analysis. This is a popular technique for extracting information
    about peoples’ attitude towards things. For example, if they had a positive or
    negative experience when using a particular product or service. In machine learning,
    sentiment analysis is used to extract information from text or speech that is
    then used to build predictive models or derive clusters.


    ### Supervised learning. The application of machine learning where each case in
    the development sample has an associated outcome which one wants to predict. The
    cases are said to be “Labeled.” An example of supervised learning in target marketing
    is where each customer’s response to marketing activity is known (they either
    responded or they didn’t). The model generated by the algorithm is then optimized
    so as to predict if customers will respond to marketing or not. In practice, most
    machine learning approaches are examples of supervised learning.


    ### Support vector machine. An advanced type of non-linear model. Support vector
    machines have some similarities with neural networks.


    ### TensorFlow. An open source library of machine learning algorithms for use
    with the Python programming language. TensorFlow was originally developed by Google.
    A key feature of TensorFlow is that it makes use of the processing capabilities
    of high end graphics cards to significantly increase the speed at which complex
    machine learning models (deep neural networks in particular) can be developed.


    ### Training algorithm. The term used to describe iterative machine learning algorithms
    that are used to determine the structure of predictive models. The term is most
    widely used in relation to neural network type models. The algorithm repeats a
    number of times, adjusting the weights in the network so as to optimize the network’s
    performance. The training algorithm terminates after a fixed number of iterations
    or when no further significant improvements in model performance are obtained.


    ### Unsupervised learning. The application of machine learning to problems where
    the development sample does not contain outcome data. Cases are said to be “Unlabeled.”
    Unsupervised algorithms typically seek to group cases with similar characteristics
    (features) together. An example of unsupervised learning is an organization wanting
    to come up with an ad placement policy for an expensive luxury product, where
    no information exists about customers’ purchasing history. Clustering is applied
    to group similar customers together based on their age, income, gender etc. The
    ad placement strategy is then targeted at individuals within clusters where the
    average income is high, rather than clusters with lower incomes.


    ### Validation sample. An independent data set used to evaluate a predictive model
    after it has been constructed. The validation sample should be completely separate
    from the development sample and should not be used during model construction.
    Using one (or more) validation samples is important because machine learning sometimes
    over-fits a model to the development sample. This means that if you evaluate a
    predictive model using the development sample it can appear to be more predictive
    than it actually is.


    ## Appendix D. A Checklist for Business Success


    In this appendix, we are going to focus on the questions that you should answer
    to ensure that your machine learning projects are successful, and that they maximize
    the benefits that it can bring to business processes. When I say business processes,
    I am principally talking about replacing or supplementing decision-making tasks
    that employees might normally do.

