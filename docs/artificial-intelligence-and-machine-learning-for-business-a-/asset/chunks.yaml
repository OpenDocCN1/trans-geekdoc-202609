    GDPR（通用数据保护条例）涵盖了与个人数据相关的广泛问题，并适用于所有对活体个人的自动化决策和画像分析。在机器学习/人工智能背景下，特别相关的四个领域是：


    1.  在收集或使用某人的个人数据之前，需要获得其**明确同意**。这种同意不能通过推断获得，也不能是“默认同意”。

    2.  除非当事人已同意将其数据用于此类目的的自动化决策，否则不允许使用自动化决策过程对个人做出决策，且该过程会对其产生法律或类似重大的影响。这是在对存储数据表示同意之外的额外要求。其主要的例外是：为了允许法律合同的签署所必需的自动化处理。

    3.  个人有权获得有关如何得出自动化决策以及该决策结果的解释。这符合 GDPR 中更通用的要求，即组织必须向个人提供必要信息，以确保其数据的处理公平透明。

    4.  自动化决策系统不得表现出不公平的歧视；即根据人的种族、性取向等对人们进行区别对待。


    ### 获取明确同意

    要获得明确同意，需要建立适当的审批机制。如果我们讨论的是对员工做出决策，则需要在其劳动合同中包含适当条款。对于消费者，则需要通过人员勾选相关复选框或类似方式提供许可。


    ### 重大影响

    对于第 2 点，关键词是“重大”。如果一项决策将对个人产生显著影响，那么该个人就有权要求对该决策进行人工审查。法律明确规定，这种审查必须是完全独立的，并由有权做出与系统决策不同判断的人员进行。这不能仅仅是让行政人员对原始决策进行“盖章通过”。


    使这一项在实践中难以应用的原因是，目前对“重大”尚没有公认的定义。也许最重要的是，对某些人可能微不足道的事情，对另一些人可能非常重大，即使只占系统处理人数中的极小部分。不能理所当然某些类型的决策不会对人们产生重大影响——这必须逐案分析。想象一家超市连锁决定采取差异化定价策略：对于那些他们认为无法或不愿在其他地方购物的客户，其杂货费用比那些会到处比价的灵活客户贵
    5%。对于大多数客户来说，这只不过是轻微的不便，但对于处于贫困线以上的人来说，这可能对他们的生活质量产生非常真实的影响。这在实践中的意味着，除非有充分的相反证据，否则始终从“所有决策都可能是重大决策”这一立场出发是审慎的。


    ### 解释权

    关于第 3 点——获得关于如何得出决策解释的权利——这需要理解预测模型是如何使用的。例如，为什么某人的保费是某个金额，或者为什么他们的贷款申请被拒绝。至少，组织需要向进行此类查询的个人告知：


    *   决策过程中使用了哪些数据项。例如：“在评估您的新手机合同申请时，我们使用了有关您的年龄、收入和婚姻状况的信息，连同有关您的信用历史的信息来做出决策。”

    *   这些数据项的来源。这可能是通过应用程序或在线表单直接从个人处获取，也可以是公开信息（如选民记录），或他们已许可其他机构共享的信息（如社交媒体平台或信信参考机构）。

    *   哪些数据项对决策做出了贡献以及是如何贡献的。在决定是否接受某人的手机合同申请时，可能会说决策是基于信用评分的。评分使用了个人的信用历史信息，逾期还款次数和近程度会对评分产生负面影响。该申请人去年错过了两次抵押贷款还款，导致信用较低。因此，其新合同申请被拒绝。


    在某些情况下，可能还需要对所有单个模型参数提供完整的技术解释，尽管在写作时，需要此类要求的具体情况尚不清楚。人们可能认为这只会在少数进入法院的特定案例中被要求，而不是在客户每次查询时都提供的内容。然而，在
    GDPR 下，这一点很明确：“复杂性不能作为未能向数据主体提供信息的借口。”在英国，信息专专员办公室（ICO）对模型的可解释性发表了以下评论：


    > “因此，大数据组织在依赖无法用人类可理解的术语进行合理化的机器学习决策之前，需要谨慎。如果一家保险公司无法运作导致其在线申请系统拒绝某些人的复杂细微之处（无论这些理由多么合理），它又如何希望向个人解释这一点呢？”


    ### 挑战与合规

    这意味着，使用深度学习和其他“黑箱”类型模型来对人们做出决策存在潜在的障碍，除非同时也存在适当的解释机制。开发此类机制是可能的，但这需要额外的时间和成本。


    另一个需要考虑的因素是个人可以改变主意。他们曾经可能许可将其数据用于某些目的，但该许可可以在以后撤回。同样，“不被遗忘权”要求组织在人员请求时删除个人数据。因此，需要建立一个处理同意变更和个人数据删除的流程。


    最后是歧视问题。所有的决策系统（自动或手动的）都存在歧视——这是它们工作的本质。问题在于是否发生了不公平的歧视。GDPR 明确规定，种族、性取向等特定项目通常不能纳入自动化决策系统。然而，人们还必须像在本章之前讨论的那样，能够识别并纠正间接偏见。


    综合考虑这些因素，在实践中意味着，涉及个人数据时，机器学习和高级分析的“旧野西部”时代已经基本结束了。那种让数据科学家为业务职能部门创建一个“快速草率”的预测模型供使用的做法已几乎不复存在——至少在欧盟国家是如此。


    '
