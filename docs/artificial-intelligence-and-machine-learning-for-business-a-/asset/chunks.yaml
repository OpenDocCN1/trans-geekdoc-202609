    Having said this, having some familiarity with the relevant mathematical techniques
    is helpful. This is because it enables you to understand the diagnostics that
    the software produces and to identify if there have been any issues with the model
    creation process. Also, there are often several parameters that need to be set
    within the software. An experienced data scientist will know how to tweak these
    parameters to generate a model that is very predictive, and which also meets any
    business constraints that have been imposed by the organization that commissioned
    it.


    Often the model building process is iterative. Many test models are constructed
    using different algorithms before a final model is arrived at. Therefore, the
    analytics process needs someone who knows what they are doing to guide it so that
    the best overall model is arrived at.


    Let’s assume that the data scientist starts by considering a scorecard type model.
    For reference, the most popular algorithms for generating scorecard type models
