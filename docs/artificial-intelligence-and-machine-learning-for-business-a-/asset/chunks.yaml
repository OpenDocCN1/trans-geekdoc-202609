- raw: 'Forecast horizon. Many (but not all) predictive models forecast future unknown
    events or quantities. The forecast horizon is the time frame over which a model
    predicts. Marketing models typically predict response over a forecast horizon
    of hours or days. In medicine, forecast horizons of many years are used when predicting
    survival probabilities for particular medical conditions.


    Gains chart. A commonly used visual tool used to demonstrate the benefits of a
    model. Often used in conjunction with a lift chart. See Appendix A for more information.


    Gartner Hype Cycle. The Gartner hype cycle classifies new technologies into five
    phases which captures the way we tend to over and then under estimate their value,
    before reaching a level somewhere in the middle. Refer to the Gartner website
    for more details.[https://www.gartner.com/technology/research/methodologies/hype-cycle.jsp](https://www.gartner.com/technology/research/methodologies/hype-cycle.jsp)


    GDPR. General Data Protection Regulation. (Regulation (EU) 2016/679). This regulation
    applies across all EU countries, replacing and updating previous data protection
    legislation. The GDPR places several obligations and constraints on how personal
    data can be gathered, stored and used in EU countries. In the context of this
    book, a key feature is that it gives people certain rights over how automated
    decision-making systems are used to make decisions about them (such as those based
    on predictive models derived using machine learning).


    General AI. Artificial systems, which act in a human intelligent way across many
    different problem domains, and which can adapt to new situations like a human
    can, are described as possessing general AI. No AI systems in use today can be
    said to possess general AI. See also Narrow AI.


    Hadoop. A data storage solution that makes use of lots of cheap “off the shelf”
    desktop PCs to store and process massive amounts of data very quickly.


    Internet of Things (The). This describes intelligent everyday devices such as
    fridges, washing machines and even light bulbs which can be connected to the internet
    or other systems. This enables data about their use to be gathered and for users
    to be able to control these devices remotely e.g. set the washing machine going
    when I’m on my way home via a smartphone app.


    K-Means Clustering. A popular clustering approach. It aims to group observations
    in a population into K similar groups, based on minimizing the observed differences
    between observations in each cluster.


    Lift chart. A widely used graphical tool for demonstrating the practical benefits
    of a predictive model. Often used in conjunction with a Gains chart. See Appendix
    A for more information.


    Linear model. A popular type of predictive model that is easy to understand and
    use. A score is calculated by multiplying the value of each characteristic by
    its relevant weight and then summing up all the results. A popular way of representing
    linear models is in the form of a scorecard, such as the one introduced in Chapter
    5.


    Linear regression. One of the most popular methods for creating linear models
    and scorecards. Its development dates back more than 100 years. Linear regression
    requires orders of magnitude less computing power than advanced methods such neural
    networks. Therefore, it can be used very successfully as a preliminary data selection/modelling
    tool, to reduce the size of a data set when methods such as (deep) neural networks
    are being used for the final model.


    Logistic regression. A very simple and popular method used for creating classification
    models. Logistic regression is widely used to create linear models and scorecards,
    such as the heart disease scorecard introduced in Chapter 5.


    Machine learning. Machine learning is the process of finding features (patterns
    in data). Machine learning algorithms derive from research into artificial intelligence
    and pattern recognition. The algorithms used to train (deep) neural networks and
    support vector machines are two examples of machine learning approaches.


    MapReduce. A programming approach which enables data stored on Hadoop (and other
    Big Data platforms) to be processed very quickly. MapReduce works by splitting
    data processing tasks into lots of smaller sub-tasks that can then be implemented
    in parallel across the network of computers that comprise a Hadoop network.


    Model. A mathematical representation of a real-world system or situation. The
    model is used to determine how the real-world system would behave under different
    conditions. See also predictive model.


    Monitoring. The performance of predictive models tends to deteriorate over time.
    It is therefore prudent to instigate a monitoring regime following model implementation
    to measure how models are performing on an ongoing basis. Models are redeveloped
    when the monitoring indicates that a significant deterioration in model performance
    has occurred.


    Narrow AI. Artificial intelligence applications which are very good at just one
    or two things, but which cannot be applied beyond the problems for which they
    have been designed. All AI applications in use today can be described as being
    Narrow AI systems. See also General AI.


    Neural network. A popular type of predictive model derived using machine learning.
    Neural networks are well suited to capturing complex interactions and non-linarites
    in data in a way that is analogous to human learning. “Deep” neural networks (Deep
    learning/Deep belief networks) are very large and complex neural networks, often
    containing thousands or millions of artificial neurons, which are used for “AI”
    tasks such as speech recognition and navigation systems in self-driving cars.


    Neuron. The key component of a neural network, which is often discussed as being
    analogous to biological neurons in the human brain. In reality, a neuron is a
    linear model whose score is then subject to a (non-linear) transformation. A neural
    network can therefore be considered as a set of interconnected linear models and
    non-linear transformations.


    Odds. A way to represent the likelihood of an event occurring. The odds of an
    event are equal to (1/p) – 1 where p is the probability of the event. Likewise,
    the probability is equal to (1/Odds+1). Odds of 1:1 is the same as a probability
    of 0.5, odds of 2:1 a probability of 0.33, 3:1 a probability of 0.25 and so on.


    Over-fitting. The bane of a data scientist’s life. Over-fitting occurs when an
    algorithm goes too far in its search for correlations in the data used to develop
    a predictive model. The net result is that the model looks to be very predictive
    when measured against the development sample but performs very poorly when it’s
    used to predict new outcomes using data that has not been presented to the model
    before.


    Override rule. Sometimes, certain actions must be taken regardless of the prediction
    generated by a model. For example, a predictive model used to target people with
    offers for beer might predict that some children are very likely to take up the
    offer. An override rule is therefore put in place to prevent offers being sent
    to children, regardless of the score generated by the model.


    Predictive analytics (PA). The application of machine learning techniques to generate
    predictive models. Some would argue that for all practical purposes machine learning
    and predictive analytics are more or less the same thing, given that they use
    the same types of data as inputs, apply the same type of algorithms and generate
    similar outputs (scores).


    Predictive model. A predictive model is the key output produced by most machine
    learning algorithms. The model captures the relationships (correlations) that
    the process has discovered. Once a predictive model has been created, it can then
    be applied to new situations to predict future, or otherwise unknown, events.


    Predictive modelling, see predictive analytics.'
