    Modern machine learning software is highly automated. A wide range of algorithms
    are available at the push of a button. Many also provide features that deal with
    data preparation, pre-processing and variable selection. Consequently, some would
    argue that you don’t need a PhD in statistics or machine learning to be able to
    develop predictive models, and in one sense that’s true.


    However, a little knowledge is a dangerous thing. If you don’t have the relevant
    technical background then you may not prepare or pre-process the data appropriately.
    Likewise, there are usually a range of different options that can be chosen for
    a given algorithm and you need to know how each option can impact the solution
    that is delivered. Similarly, you may not be able to interpret the outputs from
    the software or know what actions you should take based on what those outputs
    are telling you.


    Machine learning algorithms are just sets of rules and logic statements that are
    applied in a certain way to create a predictive model. Sometimes things go wrong.
    It’s quite possible for the software to (correctly) report that the model that
    has been created is highly accurate when in fact the model is useless.


    ### Case Study: Mortgage Default Prediction


    Consider a predictive model, developed using machine learning, which predicts
    if people will default on their mortgages. The model is going to be used to decide
    which mortgage applicants to advance funds to and which mortgage applicants should
    be refused credit. It’s pretty important that this model works because billions
    of dollars will be at stake if money is lent to the wrong people.


    The software reports that the model correctly predicts mortgage default with 97%
    accuracy. Is this a good model? A naïve (and incorrect) response is yes, of course
    it is – that’s nearly 100% and you can’t get better than that. Also, you would
    expect a rubbish model would get it right about 50% of the time; i.e. it’s performance
    would be similar to random guessing. So, the model is much better than that, isn’t
    it?


    Hold on there a minute, cowboy! Let’s take a step back and have a look at the
    development sample. This contains historic information about mortgage applications
    and their subsequent repayment performance. Let’s say that 98% of people repay
    their mortgages on time and 2% default. I can easily outperform the predictive
    model by simply saying that I predict all mortgages will be repaid. I’ll only
    be wrong in the 2% of cases that default. The accuracy of my predictions is 98%.
    Something must be wrong because my simple “accept everyone” rule is more accurate
    than the one derived using an advanced machine learning algorithm! This is just
    one example of the sorts of thing that need consideration when assessing how good
    a predictive model is and if it has been constructed correctly.


    ### Model Assessment


    Once a model has been built using the development sample, then work is required
    to assess the model’s performance (Step 7). From a technical perspective, this
    primarily involves assessing the predictive accuracy of the model on different
    data samples. These should be completely independent of the data used to build
    the model so as to provide a fair and unbiased view of how the model will perform
    when applied operationally to new cases. In particular, if the development sample
    was created a few months previously, then the model should be assessed using more
    recent data to ensure that it continues to perform as expected. A data scientist
    may report model performance as measured on the development sample, but they should
    base all of their final assessments of model performance on one or more independent
    validation samples.


    Other validation activity may be more qualitative in nature, to check against
    any legal restrictions that may apply to how certain types of data are used and
    to ensure that the data used in the model will be available when the model is
    applied; i.e. if the model is going to be integrated into one of the organization’s
    systems, then the data required to calculate models scores will need to be available
    within that system.


    ### The Iterative Process


    Machine learning is an iterative process. Often, many models are built using variants
    of different algorithms and/or different representations of the data before a
    final model is agreed upon. Given more time and resource it’s always possible
    to find another small improvement in predictive accuracy. However, in the real
    world time and resources are finite. Therefore, a decision needs to be made as
    to when to stop the machine learning process, review the models that have developed
    and decide which one to accept as your final model.


    ### Business Perspective


    From a business perspective, assessment of the final model should be expressed
    in terms of key performance indicators and bottom line benefits. These should
    have been considered right at the start of the process. Consider an automated
    advice service that has been developed for a credit card provider to improve efficiency
    within their customer contact centers. The company developing the solution has
    decided to call this an “Autonomous Robotic Advisor” to make it sound like a cool
    and sexy modern AI type product.


    The decision-making part of the system has been constructed using data from previously
    recorded customer service calls. A predictive model (a deep neural network in
    this case), has been developed from a development sample that contains several
    hundred thousand previous phone conversations with customers. These have been
    classified into the following types of enquiry (event):


    1. Asking for the balance on their account.

    2. Wanting a list of recent transactions.

    3. Reporting a lost or stolen credit card.

    4. Requesting to close their account.

    5. Something else.


    Events 1 to 4 are the most common types of customer enquiries, accounting for
    around 60% of customer calls, and are currently dealt with by human advisors.
    Given that the first four events require relatively simple standard responses,
    it should be possible to fully automate the customer service process for these
    types of enquiry.


    If the query relates to something else (event 5) then the system will refer the
    call to a human to be dealt with. Likewise, if at the end of the automated response
    to events 1-4 the customer indicates that they are not happy with the response,
    then they can still speak to a real person if they want to.


    When a customer calls in, their speech is first pre-processed into a set of data
    items that provide the inputs to the machine learning process. These data items
    are predominately flags or counters representing specific words, phrases and sentences
    associated with certain types of enquiry. The predictive model produced from the
    machine learning process then generates probabilities as to the likelihood that
    the customer’s question falls into each of the five categories. Once the Robotic
    Advisor has identified what is most probably being asked, a suitable reply can
    be formulated. If the Robotic Advisor determines that the customer is most probably
    asking for their current balance, then the relevant information is retrieved from
    the company’s account management system and an automated response is provided.
    “Your outstanding balance is $XXX”.

    '
  trans: '


    现代机器学习软件是高度自动化的。只需点击按钮，即可获得多种算法。许多算法还提供了处理数据准备、预处理和变量选择的功能。因此，有人会认为，你不需要统计学或机器学习的博士学位就能开发预测模型，从某种意义上来说，这确实是事实。


    然而，浅尝辄止是危险的。如果你没有相关的技术背景，可能无法妥善地准备或预处理数据。同样，对于给定的算法，通常有一系列不同的选项供选择，你需要了解每个选项如何影响交付的解决方案。此外，你可能无法解释软件的输出结果，或者不知道根据这些输出告诉你的信息应该采取什么行动。


    机器学习算法仅仅是一组规则和逻辑语句，通过特定的方式应用以创建预测模型。有时也会会出问题。软件可能会（正确地）报告所创建的模型非常准确，但实际上该模型是毫无用的。


    ### 案例研究：房贷违约预测


    考虑一个使用机器学习开发的预测模型，该模型用于预测人们是否会抵押贷款违约。该模型将用于决定向哪些房贷申请人发放资金，以及拒绝哪些申请人的信贷。这个模型的正常运行非常重要，因为如果把钱借给了错误的人，将面临数十亿美元的风险。


    软件报告，该模型预测房贷违约的准确率达到了 97%。这是一个好模型吗？一个天真的（也是错误的）回答是肯定的，当然是——这已经接近 100% 了，不可能更完美了。此外，你可能预料一个糟糕的模型准确率大约在
    50% 左右；即它的性能类似于随机猜测。所以，这个模型比那要好得多，不是吗？


    等一下，牛仔哥！让我们退后一步，看看开发样本。它包含了关于房贷申请及其后续还款表现的历史信息。假设 98% 的人按时偿还房贷，2% 的人违约。我只需说“我预测所有房贷都会被还清”，就能轻松地超越该预测模型。我只会在那
    2% 的违约案例中出错。我预测的准确率是 98%。这一定有问题，因为我这个简单的“接受所有人”的规则竟然比使用高级机器学习算法得出的规则还要准确！这只是在评估预测模型的好坏以及其是否构建正确时需要考虑的问题类型之一。


    ### 模型评估


    一旦使用开发样本构建了模型，就需要工作来评估模型的性能（第 7 步）。从技术角度来看，这主要涉及评估模型在不同数据样本上的预测准确性。这些样本应当独立于构建模型时的数据，以便提供一个公平且无偏的视角，观察模型在实际应用于新案例时的表现。特别是，如果开发样本是几个月前创建的，则应该使用更新的数据对模型进行评估，以确保它继续按预期运行。数据科学家可能会报告在开发样本上测量的模型性能，但他们应该基于一个或多个独立的验证样本对模型性能进行所有最终评估。


    其他验证活动可能更具定性性质，用以检查是否存在可能适用于某些类型数据使用方式的法律限制，并确保在模型应用时所使用的数据是可用的；例如，如果模型将要集成到组织的某个系统中，那么计算模型评分所需的数据需要在该系统内可用。


    ### 迭代过程


    机器学习是一个迭代过程。在确定最终模型之前，通常会先使用不同算法的变体和/或不同的数据表示来构建许多模型。如果有更多的时间和资源，总可以在预测准确率上找到另一个微小的改进。然而，在现实世界中，时间和资源是有限的。因此，需要决定决定何时停止机器学习过程，审查已开发的模型，并决定接受哪一个作为你的最终模型。


    ### 业务视角


    从业务视角的来看，对最终模型的评估应该用关键性能指标（KPI）和底线收益来表达。这些在过程开始时就应该被考虑进去。考虑一种为信用卡提供商开发的自动建议服务，旨在提高其客户服务中心的效率。开发解决方案的公司决定将其命名为“自主机器人顾问”（Autonomous
    Robotic Advisor），让它听起来像一种酷炫且性感的现代 AI 类产品。


    系统的决策部分是使用之前记录的客户服务电话数据构建的。一个预测模型（在本例中为深度神经网络）是从一个开发样本开发的，该样本包含了数十万次与客户的电话对话。这些对话被归类为以下类型的查询（事件）：


    1.  查询账户余额。

    2.  想要最近交易列表。

    3.  报告信用卡丢失或被盗。

    4.  请求销户。

    5.  其他。


    事件 1 到 4 是最常见的客户查询类型，占客户电话的 60% 左右，目前由人工顾问处理。鉴于前四个事件只需要相对简单的标准回答，完全可以实现这些类型查询的客户服务流程自动化。


    如果查询涉及其他内容（事件 5），则系统会将电话转给人工处理。同样，如果客户在事件 1-4 的自动回复结束时表示他们对回复不满意，那么他们仍然可以要求与真人交谈。


    当客户来电时，他们的语音首先被预处理为一组数据项，为机器学习过程提供输入。这些数据项主要是标记位或计数器，代表与特定类型查询相关的特定单词、短语和句子。通过机器学习过程产生的预测模型随后会生成客户问题落在五个类别中每种类别的概率。一旦机器人顾问识别出最可能询问的内容，就可以制定出合适的回复。如果机器人顾问判断客户最可能是在查询余额，则将从公司的账户管理系统中检索相关信息并提供自动回复。“您的未付余额为
    $XXX”。


    '
