- raw: 'These “in-database” systems stream data to machine learning tools without
    needing to extract the data first, drastically reducing the time required to pull
    data samples together, build predictive models and then to deploy those models
    operationally.


    Once an in-database system has been configured, models can be redeveloped and
    deployed automatically. In theory, a new and updated model can be constructed
    every time a new piece of data becomes available – the system learns from each
    new case it deals with. New models are developed and deployed on a minute by minute
    basis. Consequently, it becomes impossible for a data scientist to be involved
    in the detail of every model that is constructed. Instead, the data scientist’s
    role is to be part of the team that designs the wider system. In particular, they
    have responsibility for understanding the data that feeds the system and how this
    maps to business problems that the system needs to create predictive models for.


    After a system goes live the software provides a dashboard for the data scientist
    that reports on the status of the overall system. For example, how well models
    within the system are performing, how model performance changes over time, how
    the data that feeds the analytics process is changing and so on.


    The data scientists themselves only become involved in the detail when something
    goes awry, or when some new feature needs to be incorporated into the system.
    If there is an unexpected dip in model performance the data scientist will need
    to investigate and find out why. They will then instigate remedial action to correct
    the problem and return the system to optimal operating conditions.


    A similar approach is taken with self-learning devices and autonomous robots.
    Each time they undertake a task, they gather data about that event. The predictive
    models that drive their activities are automatically refined using the additional
    data available. In this way, as more and more data becomes available, so the accuracy
    of the underlying models improve.


    A further focus of some of the newer machine learning software are intermediary
    tools which seek to provide a better interface between non-technical business
    users and the underlying data and algorithms required for machine learning.


    The most advanced of these tools try to replace some of the tasks that would traditionally
    have been undertaken by data scientists. They can analyze and prepare data from
    different sources, apply a range of algorithms and present the results back to
    non-technical users in an easy-to-understand way without any formulas or equations.
    In particular, the software attempts to present results in a contextual way that
    makes business sense, rather than providing a more formal statistical perspective
    that data scientists are used to dealing with.


    A prime example of this approach is the one taken by IBM with its Watson Analytics
    Software. The original version of Watson famously beat several human players in
    the general knowledge quiz show Jeopardy in the USA^([\[72\]](#index_split_028.html#filepos437033)).
    Watson has now evolved in to a commercial product. Behind the scenes, the software
    uses some very complex machine learning algorithms to extract information from
    a range of different data sources. The front end of the software is designed with
    managers and other business users in mind rather than data scientists.


    The net result is that when presented with suitable data, new insights and understanding
    about the behavior of customers can be presented to business users within hours,
    or even minutes, without the need to involve technical specialists in the process.


    [15\. When Can I Buy a Self-Driving Car?](#index_split_004.html#filepos4264)


    Don’t worry. I’m sure it won’t be too long before you’ll be able to pop down to
    your local dealer and buy one, and some would argue that you already can. However,
    if you mean a fully autonomous vehicle, that your visually impaired grandma can
    keep in her garage and be driven wherever she wants, then it might be a bit longer
    than all those media stories about self-driving cars might suggest.


    To some, self-driving cars in the 21^(st) century are what the moon landings were
    to the 20^(th) century. It’s a massive technical challenge, requiring billions
    of dollars of investment over a decade or more. Success will mark a significant
    milestone in our ability to replicate and exceed human abilities via artificial
    means. Just like the moon landings, there are a host of challenges to overcome
    and many steps along the way. Being able to fire a rocket into space or put a
    satellite into orbit is helpful, but it doesn’t qualify you to put a man on the
    moon. That’s a much grander challenge.


    Recently, it dawned on me that a question that had been bugging me for quite some
    time was: “Where are all the self-driving cars?” No one seemed to mention them
    at the dealerships I visited recently when looking for a new car.


    I remember reading years ago, in 2010 if not earlier, that self-driving cars were
    pretty much already here. One quote that comes to mind is: “It’s crazy to imagine
    that we are going to keep driving cars like we do now – that in 10 to 20 years
    we’ll still have to sit behind a wheel…”^([\[73\]](#index_split_028.html#filepos437498)).
    If you read the popular media and the press releases put out by motor manufacturers
    and the tech giants, then you would be forgiven for thinking that fully self-driving
    cars are all ready to go. It’s only the luddites in government who are blocking
    things.


    In discussing the reasons why my visually impaired grandma probably won’t be able
    to buy a fully autonomous (Stage 5 autonomy^([\[74\]](#index_split_028.html#filepos438025)))
    car in 2019/20, and probably not for a decade or more after that, a really great
    question to ask yourself is: “Where are all the driverless trains (and boats for
    that matter)?” Surely going up and down the rails is a massively simpler task
    than driving on the open road or in city traffic? Actually, there are a few driverless
    train systems in operation, but only a very tiny proportion of the worlds trains
    are fully automated.^([\[75\]](#index_split_028.html#filepos438457)) Those that
    are, are local transport and/or underground systems operating in small well controlled
    environments rather than intercity type trains travelling around the country^([\[76\]](#index_split_028.html#filepos438775)).


    Why aren’t most, if not all, trains fully automated? There is not a single or
    simple answer to this. It’s partly the tech, partly to do with economics. Unions
    and public sentiment play their part as do governments and legislation. Arguably
    the tech issues are the easy part. It’s all the other stuff that makes these things
    difficult.


    The real test of the truly autonomous car is when anyone can go and buy one with
    no restrictions on who they are or where they can go. Being able to go hands free
    on the freeway for a few miles or having self-driving taxis operating in the centers
    of a few major cities, does not really pass the test. In truth, when it comes
    to fully self-driving cars, the answer is that the technology simply isn’t good
    enough. It’s getting there, but it’s not there yet. If we return to the moon landing
    analogy, then self-driving tech is probably at about the equivalent of the low
    earth orbit stage of development. Good progress has been made but there’s still
    a long way to go.'
