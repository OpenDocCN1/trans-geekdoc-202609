- raw: "Modern machine learning software is highly automated. A wide range of algorithms\
    \ are available at the push of a button. Many also provide features that deal\
    \ with data preparation, pre-processing and variable selection. Consequently,\
    \ some would argue that you don’t need a PhD in statistics or machine learning\
    \ to be able to develop predictive models, and in one sense that’s true. However,\
    \ a little knowledge is a dangerous thing. If you don’t have the relevant technical\
    \ background then you may not prepare or pre-process the data appropriately. Likewise,\
    \ there are usually a range of different options that can be chosen for a given\
    \ algorithm and you need to know how each option can impact the solution that\
    \ is delivered. Similarly, you may not be able to interpret the outputs from the\
    \ software or know what actions you should take based on what those outputs are\
    \ telling you.\n\nMachine learning algorithms are just sets of rules and logic\
    \ statements that are applied in a certain way to create a predictive model. Sometimes\
    \ things go wrong. It’s quite possible for the software to (correctly) report\
    \ that the model that has been created is highly accurate when in fact the model\
    \ is useless.\n\nConsider a predictive model, developed using machine learning,\
    \ which predicts if people will default on their mortgages. The model is going\
    \ to be used to decide which mortgage applicants to advance funds to and which\
    \ mortgage applicants should be refused credit. It’s pretty important that this\
    \ model works because billions of dollars will be at stake if money is lent to\
    \ the wrong people.\n\nThe software reports that the model correctly predicts\
    \ mortgage default with 97% accuracy. Is this a good model? A naïve (and incorrect)\
    \ response is yes, of course it is – that’s nearly 100% and you can’t get better\
    \ than that. Also, you would expect a rubbish model would get it right about 50%\
    \ of the time; i.e. it’s performance would be similar to random guessing. So,\
    \ the model is much better than that, isn’t it? Hold on there a minute, cowboy!\
    \ Let’s take a step back and have a look at the development sample. This contains\
    \ historic information about mortgage applications and their subsequent repayment\
    \ performance. Let’s say that 98% of people repay their mortgages on time and\
    \ 2% default. I can easily outperform the predictive model by simply saying that\
    \ I predict all mortgages will be repaid. I’ll only be wrong in the 2% of cases\
    \ that default. The accuracy of my predictions is 98% Something must be wrong\
    \ because my simple “accept everyone” rule^([\\[51\\]](#index_split_028.html#filepos428533))\
    \ is more accurate than the one derived using an advanced machine learning algorithm!\
    \ This is just one example of the sorts of thing that need consideration when\
    \ assessing how good a predictive model is and if it has been constructed correctly.\n\
    \nOnce a model has been built using the development sample, then work is required\
    \ to assess the model’s performance (Step 7). From a technical perspective, this\
    \ primarily involves assessing the predictive accuracy of the model on different\
    \ data samples. These should be completely independent of the data used to build\
    \ the model so as to provide a fair and unbiased view of how the model will perform\
    \ when applied operationally to new cases. In particular, if the development sample\
    \ was created a few months previously, then the model should be assessed using\
    \ more recent data to ensure that it continues to perform as expected. A data\
    \ scientist may report model performance as measured on the development sample,\
    \ but they should base all of their final assessments of model performance on\
    \ one or more independent validation samples.\n\nOther validation activity may\
    \ be more qualitative in nature, to check against any legal restrictions that\
    \ may apply to how certain types of data are used and to ensure that the data\
    \ used in the model will be available when the model is applied; i.e. if the model\
    \ is going to be integrated into one of the organization’s systems, then the data\
    \ required to calculate models scores will need to be available within that system.\n\
    \nMachine learning is an iterative process. Often, many models are built using\
    \ variants of different algorithms and/or different representations of the data\
    \ before a final model is agreed upon. Given more time and resource it’s always\
    \ possible to find another small improvement in predictive accuracy. However,\
    \ in the real world time and resources are finite. Therefore, a decision needs\
    \ to be made as to when to stop the machine learning process, review the models\
    \ that have developed and decide which one to accept as your final model.\n\n\
    From a business perspective, assessment of the final model should be expressed\
    \ in terms of key performance indicators and bottom line benefits. These should\
    \ have been considered right at the start of the process. Consider an automated\
    \ advice service that has been developed for a credit card provider to improve\
    \ efficiency within their customer contact centers. The company developing the\
    \ solution has decided to call this an “Autonomous Robotic Advisor” to make it\
    \ sound like a cool and sexy modern AI type product.\n\nThe decision-making part\
    \ of the system has been constructed using data from previously recorded customer\
    \ service calls. A predictive model (a deep neural network in this case), has\
    \ been developed from a development sample that contains several hundred thousand\
    \ previous phone conversations with customers. These have been classified into\
    \ the following types of enquiry (event):\n\n1.  Asking for the balance on their\
    \ account.\n\n>     \n\n1.  Wanting a list of recent transactions.\n\n>     \n\
    \n1.  Reporting a lost or stolen credit card.\n\n>     \n\n1.  Requesting to close\
    \ their account.\n\n>     \n\n1.  Something else.\n\nEvents 1 to 4 are the most\
    \ common types of customer enquiries, accounting for around 60% of customer calls,\
    \ and are currently dealt with by human advisors. Given that the first four events\
    \ require relatively simple standard responses, it should be possible to fully\
    \ automate the customer service process for these types of enquiry.\n\nIf the\
    \ query relates to something else (event 5) then the system will refer the call\
    \ to a human to be dealt with. Likewise, if at the end of the automated response\
    \ to events 1-4 the customer indicates that they are not happy with the response\
    \ received, then they can still speak to a real person if they want to.\n\nWhen\
    \ a customer calls in, their speech is first pre-processed into a set of data\
    \ items that provide the inputs to the machine learning process. These data items\
    \ are predominately flags or counters representing specific words, phrases and\
    \ sentences associated with certain types of customer enquiry.^([\\[52\\]](#index_split_028.html#filepos429056))\
    \ The predictive model produced from the machine learning process then generates\
    \ probabilities as to the likelihood that the customer’s question falls into each\
    \ of the five categories. Once the Robotic Advisor has identified what is most\
    \ probably being asked, a suitable reply can be formulated. If the Robotic Advisor\
    \ determines that the customer is most probably asking for their current balance,\
    \ then the relevant information is retrieved from the company’s account management\
    \ system and an automated response is provided. “Your outstanding balance is $XXX”.\n\
    \nWhen implementing the Robotic Advisor, what the call center manager will want\
    \ to know are things like:\n\n1.  If we maintain the same customer services levels,\
    \ then how many fewer staff will I need and hence, how much money will be saved?\n\
    \n>   \n\n1.  If we employ the same number of staff as we do now, by how much\
    \ will service levels improve? Staff should have more time for customers, given\
    \ that the Robot Advisor will be dealing with a significant proportion of the\
    \ calls received.\n\n>   "
