- raw: "*   Creates new opportunities. Machine learning acts as enabler to allow you\
    \ to do something that you’ve not been able to do before. Maybe this is to enter\
    \ new markets or provide different types of products and services.\n\nOne thing\
    \ to look out for is what I term the “data opportunist.” I’ve come across more\
    \ than one analytics company who have suggested that I just: “Employ a few of\
    \ our data scientists to see what we can discover from your data.” There is no\
    \ in-depth probing of what I or my organization does, what our problems are or\
    \ where our inefficiencies lie. It’s just assumed that by paying these guys to\
    \ trawl my data, and maybe churn out a few predictive models, they will deliver\
    \ something useful.\n\nI remember talking to a friend of mine recently, who had\
    \ hired some data scientists to do exactly this for his organization (a financial\
    \ services company). They said they could help him predict which customers were\
    \ about to cash in their investments. So, this was an attrition type problem –\
    \ identify customers who are likely to leave and then try to entice them to stay.\n\
    \nMy friend told me, that after many weeks of work, the data scientists he had\
    \ hired delivered a predictive model that essentially predicted retirement; i.e.\
    \ people approaching retirement tend to review their investments in preparation\
    \ for giving up work. The data scientists seemed very happy with what they had\
    \ found. However, this was something that my friend and everyone in the industry\
    \ already knew. The exercise added no value but cost tens of thousands of dollars\
    \ to undertake. I could describe a whole host of other similar situations, but\
    \ I think you get the idea.\n\nAnother thing you should do is think about what’s\
    \ going on in your industry and with your competitors. Talk to you network of\
    \ contacts. See what others are doing in your problem space. If no one else is\
    \ using artificial intelligence/machine learning technologies for that type of\
    \ problem then you are in a high risk space. Maybe you can be a trailblazer and\
    \ can get ahead of the pack by being the first to reap the benefits. Alternatively,\
    \ maybe you are taking a massive gamble that’s unlikely to pay off. If no one\
    \ else has adopted the technology for that purpose then that’s a risk.\n\nIf you\
    \ have a high-risk culture, and taking chances is all part of the game, then go\
    \ for it. However, if like most of us, you are operating in a more conservative\
    \ environment and a potential risk of failure is getting the sack, then think\
    \ carefully before diving in. You need to do your homework and make sure that\
    \ the benefits that are promised will be delivered. At the very least, when the\
    \ dust settles many months later, you need to be able to show that your decisions\
    \ were rational and based on what you knew at the time.\n\nOne possible strategy\
    \ to follow when engaging with suppliers, particularly when the value of a proposition\
    \ is vague or uncertain, is to suggest a shared return model of contractual engagement.\
    \ A clearly defined set of objectives are agreed up-front and the supplier takes\
    \ a cut of the profit (or loss) that results. If a suppler is selling you all\
    \ the benefits of their machine learning based solutions, but won’t entertain\
    \ a shared risk/reward model of compensation, then ask yourself why that might\
    \ be? Even if you don’t really want to go down this route, the response you get\
    \ from the supplier will be informative.\n\nAlso bear in mind that just because\
    \ it’s possible to automate something doesn’t mean that you have to or that it’s\
    \ desirable to do so. Silicon Valley has a reputation for developing innovative\
    \ gadgets and then trying to find a market for them, rather than starting with\
    \ people’s problems and then trying to find solutions. If we go back to self-driving\
    \ cars – do we know how many people actually want a self-driving car? The most\
    \ recent consumer studies suggest that at the moment it’s only a minority^([\\\
    [87\\]](#index_split_028.html#filepos444292)). That may change in time, but it’s\
    \ something that the motor manufactures should be mindful of.\n\nOverall, what\
    \ I’m trying to get across in this chapter is keep an open mind, but also a level\
    \ head. AI and machine learning present massive opportunities to do things better,\
    \ more efficiently and more cheaply. However, just like any other aspect of business\
    \ – don’t jump in until you know what the opportunities are, you know want you\
    \ want to do and why, and you’ve done a proper benefits case to support your decision.\
    \ Good Luck!\n\n[16\\. Concluding Remarks](#index_split_004.html#filepos4264)\n\
    \nFirst, I would like to thank you for taking the time to purchase and read this\
    \ concise introduction to the world of artificial intelligence and machine leaning\
    \ for business. I hope that you now have an understanding of what these things\
    \ are, why they are important and how they work. Equally importantly, I hope that\
    \ you understand that while these are essentially mathematically based topics,\
    \ they can only realize their full potential when relevant business, social, ethical,\
    \ political and legal issues are taken into consideration.\n\nIf you liked the\
    \ book, then please consider giving it a positive review on Amazon, Goodreads\
    \ or other review sites. As an independent publisher, this sort of support is\
    \ very helpful and is much appreciated.\n\nIf on the other hand, you felt the\
    \ book didn’t fill the void in your life that you were expecting it too, then\
    \ I’m very sorry to hear that. Please feel free to drop me a line to let me know\
    \ why at:\n\nAI@relativistic.co.uk\n\nLikewise, if you have any positive feedback\
    \ I’ll be more than happy to receive that too.\n\nSteven Finlay\n\n21^(st) June\
    \ 2018\n\n[Appendix A. Evaluating Predictive Models](#index_split_004.html#filepos4264)\n\
    \nOnce a predictive model has been constructed it needs to be assessed to determine\
    \ how well it predicts behavior. Sometimes there is a single cut-off score that\
    \ results in the business objective being met, which can be established by looking\
    \ at the score distribution table (such as those in Figures 3, 4 and 6). Similarly,\
    \ for things like object recognition systems where each score represents one outcome,\
    \ you simply choose the outcome with the highest score.\n\nIn many situations\
    \ however, there is not one single cut-off score to choose. Instead, there is\
    \ a range of possible cut-offs. Any one of these cut-offs will deliver the original\
    \ business objective, but with different benefits and drawbacks. Likewise, common\
    \ practice is to build several different predictive models. The performance of\
    \ the models are then compared against each other so that the best one is chosen.\n\
    \nIf you think back to the heart disease case study, used throughout this book,\
    \ then you will remember that we looked at a decision tree model and a scorecard\
    \ model. Both models provided solutions that met the stated business objective;\
    \ i.e. identify at least 50% of people who will develop heart disease but invite\
    \ no more than 5% of the entire population for a check-up. However, the scorecard\
    \ model performed better overall. This is because it identified 62% of cases within\
    \ the highest scoring 5% whereas the decision tree only identified 55%\n\nYou\
    \ could also argue that both models over delivered. They identified more than\
    \ the required 50% of cases. What this means is that there is actually some flexibility\
    \ in how the cut-off is chosen; i.e. there is more than one cut-off that meets\
    \ the objective. In this situation, two possible ways in which the model could\
    \ be used are:\n\n1.   Maximize outcomes. Choose the cut-off which results in\
    \ exactly 5% of the population being invited for a check-up; i.e. use all available\
    \ resources. This will result in more than 50% of heart disease cases being identified\
    \ (this is the answer presented previously in the case study; i.e. the 521 cut-off\
    \ score for the scorecard or the 12 cut-off score for the decision tree). \n\n\
    >   "
