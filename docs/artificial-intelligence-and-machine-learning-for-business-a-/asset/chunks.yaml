    # 机器学习导论


    当存在大量观测数据且每个观测值都有明确、无歧的结果时，监督学习方法的效果非常好。如果没有可用的结果，无监督学习有时会被证明是有用的；尽管在某种不同的语境下。然而，在某些情况下，最初可能没有观测数据或结果数据，但学习过程能够在执行过程中根据具体情况评估其性能。模型在每次尝试任务时，都会根据每次尝试计算出的某种成功或奖励标准进行调整。这种类型的机器学习被称为强化学习。


    ## 强化学习示例


    强化学习的一个近乎过于简化的例子是训练一个神经网络，使其用最少的步数找到局部地形的最高点。在开始时，人们所知的只有当前的地图位置（经度、纬度和海平面高度）。网络可以生成
    4 种可能的得分，每种代表向前、向后、向左或向右移动。当前的状态（即当前位置）提供了输入（观测数据）。产生的状态（即执行网络建议的移动后的新位置）就是结果。


    在每次移动之后，都会评估新的状态。我们现在的位置是否比之前更好（海平面高度更高）？如果答案是肯定的，则认为算法表现良好——奖励或成功的衡量标准很高。如果不是，则认为算法表现不佳——成功标准较低。然后，算法根据其动作产生的成功程度来调整模型权重。


    该算法的更精炼版本还将过去的移动历史（即它去过的地方）作为输入数据的一部分。包含对未来成功的长期视角也是意义的，而不仅仅是看前一步的位置。例如，如果多次访问了同一个位置，则对成功进行惩罚；或者为进入地形中新的、未探索的区域提供奖励（增加成功），即使进入该区域的最初没有找到更高点。


    ## 与监督学习的比较


    数据科学家经常会谈论三种不同类型的机器学习；即监督学习、无监督学习和强化学习。然而，强化学习与监督学习共享许多特征。与监督学习一样，强化学习中使用的算法也会交付一个模型，通常基于某种形式的神经网络。同样，模型根据对给定输入数据产生的结果评估进行调整。随着算法迭代次数增加，模型中的权重不断精炼，模型的性能也随之提高。


    “奖励/成功”和“失败/惩罚”术语倾向于应用于强化学习，但这些概念与描述使用监督学习开发的预测模型性能的“准确率”和“错误”非常相似。监督学习中实际值与预测值之间的小误差（即非常准确的预测）在广范围内等同于强化学习中的高程度成功。同样，监督学习中的错误分类或不准确的预测比于强化学习中的低奖励/失败。


    ## 案例研究：国际象棋程序


    ### 监督学习方法

    监督学习和强化学习差异的一个绝佳例子是创建国际象棋程序时的模型训练方式。监督方法会将之前下过的游戏中的数千次步法（或步法序列）作为观测数据，并带有标记的结果数据指示该步法是否良好。模型产生的得分用于指示移动哪个棋子以及移动到哪里。然后，算法根据开发样本中包含的移动，寻找导致整体最佳移动组合的模型权重。


    ### 强化学习方法

    在强化学习中，最初不提供任何数据——完全没有！模型得分仍然像监督方法一样指示进行哪种移动。然而，由于没有数据来训练模型，最初这些移动多或是随机的。每次做出移动后，都会重新评估棋盘状态（新状态）。然后算法根据其移动被认为成功的程度来调整模型中的权重。


    在国际象棋中评估一次移动有多成功是复杂的，并且通常会结合可能的未来状态以及当前状态。然而，为了本示例而言，一个简单的成功标准是移动后留在棋盘上的每个玩家剩余棋子价值的差异。如果你的移动导致吃掉了一个高价值棋子，而你自己没有丢失棋子，那就是巨大的成功。走了一一步后你的其中一个棋子被吃掉就是失败，产生较低的成功标准。最终的成功或失败是丢失王子——将死。通过这种方式，通过评估每一步并相应地调整模型权重，程序可以自己学习，而不需要提供任何先验信息。


    ## 优势与局限性


    强化学习相对于监督学习的一个关键优势是，随着算法修改模型中的权重，可以探索的移动集是没有限制的。在监督学习中，你受限于开发样本中可用的标记示例。对于像国际象棋这样的游戏，即使是包含数百万局游戏所有移动和结果的巨大开发样本，也只包含所有可能的移动中极小比例的一部分。当
    Google 的 DeepMind AI 团队使用两种强化学习算法相互对决时，这一点得到了非常有效的证明。生成的模型不仅优于当时最强大的国际象棋程序，而且在过程中，算法发现了人类大师此前未过的全新对弈策略。


    强化学习引起了巨大的兴奋，因为其学习过程非常类似于生物的学习方式。如果我正尝试学习杂耍，我最初没有任何信息。我尝试，失败，再次尝试并失败，尝试并设法杂耍了几秒钟，转过神来我就像专业人士一样杂耍了！随着每次尝试，我的大脑都在潜意识地学习更多环境知识，并根据每次成功或失败来精炼动作。


    强化学习具有潜力，但它也有自己的缺点，并且比其他任务更适用。一个问题是训练算法受到试错过程速度限制。如果强化算法被用于做出抵押贷款决策，那么从采取行动到评估该行动是否成功之间可能有几个月或几年。因此，训练过程将花费太长时间，而没有实际用途。


    '
