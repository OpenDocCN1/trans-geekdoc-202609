    \ [http://www.bbc.co.uk/news/technology-35902104](http://www.bbc.co.uk/news/technology-35902104).\
    \ Accessed 06/04/2018.\n\n^([\\[17\\]](#index_split_011.html#filepos84890)) There\
    \ are lots of different types of heart disease with different causes and symptoms,\
    \ but for the sake of simplicity we’ll consider heart disease as a single condition\
    \ for this example.\n\n^([\\[18\\]](#index_split_011.html#filepos88527)) Body\
    \ Mass Index (BMI) is calculated as a person’s weight in kilograms divided by\
    \ their height in metres squared. For someone who is 180cm tall and weighs 80kg\
    \ their body mass index is: 80/(1.8 \\* 1.8) = 24.69. In the UK, a BMI of 19-25\
    \ is considered normal. A BMI under 19 indicates a person may be underweight.\
    \ 25-30 indicates that someone is likely to be overweight and more than 30 obese.\
    \ Note that BMI is only a guide, and other factors such as build, age and muscle\
    \ mass are also important. Some athletes would be classified as overweight using\
    \ BMI due to having more than the average amount of muscle mass.\n\n^([\\[19\\\
    ]](#index_split_011.html#filepos93013)) There are lots of algorithms that can\
    \ be applied to generate scorecards, but the most popular method is called “Logistic\
    \ regression.” Other popular approaches include genetic algorithms, linear programming\
    \ and discriminant analysis (linear regression).\n\n^([\\[20\\]](#index_split_011.html#filepos102127))\
    \ In practice, a single combined sample would be created initially. This would\
    \ then be split randomly into two parts (development and validation samples) before\
    \ any machine learning was applied. In this example the development and validation\
    \ samples have been split 50/50 with the same number of cases in each sample,\
    \ but this need not be the case. Common practice is to assign perhaps 70% or 80%\
    \ of cases to the development sample and only 30% or 20% to the validation sample.\
    \ In this way, more data is available for developing the model which should lead\
    \ to a better, more predictive model.\n\n^([\\[21\\]](#index_split_011.html#filepos102370))\
    \ Using a new sample of data to evaluate a predictive model is important when\
    \ evaluating how good the model is. This is because when predictive models are\
    \ constructed a major concern is a problem called Over-fitting. Over-fitting means\
    \ that the machine learning process has been over-optimistic. It finds relationships\
    \ in the development sample that don’t exist in the wider population. Consequently,\
    \ when a predictive model is being evaluated it’s always wise to use a validation\
    \ sample to measure the model’s performance. The validation sample should be a\
    \ completely independent sample that was not used to construct the model.\n\n\
    ^([\\[22\\]](#index_split_011.html#filepos103318)) The minimum possible score\
    \ for this model is 281. The maximum possible score is 605.\n\n^([\\[23\\]](#index_split_011.html#filepos105304))\
    \ Calculated as: 1 / 0.0176.\n\n^([\\[24\\]](#index_split_011.html#filepos105661))\
    \ Note that this is an artificial example and not a genuine model developed for\
    \ use by health practitioners. Therefore, you should not take the predictions\
    \ generated by the model to be a true representation of your (or anyone else’s)\
    \ chance of developing heart disease. \n\n^([\\[25\\]](#index_split_012.html#filepos113876))\
    \ In practice, several validation samples would be taken rather than just one.\
    \ At least one of these would be an “out of time” sample, from a different time\
    \ period to the development sample. If the results from the various validation\
    \ samples tell a similar tale, then that is usually sufficient to indicate that\
    \ the model will work as intended; i.e. that its predictive performance and accuracy\
    \ will be similar to that observed from the validation / out of time samples.\n\
    \n^([\\[26\\]](#index_split_013.html#filepos119301)) Best is usually determined\
    \ by an appropriate statistical measure that considers both the incidence (purity)\
    \ and proportion (number) of cases in each partition.\n\n^([\\[27\\]](#index_split_013.html#filepos127689))\
    \ This is generally true, but not universally true. There are occasionally problems\
    \ where one particular type of model or algorithm is significantly better/worse\
    \ than another. Generally, its good practice to build a few different types of\
    \ model to see if this is the case or not.\n\n^([\\[28\\]](#index_split_014.html#filepos129922))\
    \ Rosenblatt, F. (1958). ‘The perceptron: A probabilistic model for information\
    \ storage and organisation in the brain’. Psychological Review 65.\n\n^([\\[29\\\
    ]](#index_split_014.html#filepos130205)) Their full title is Artificial Neural\
    \ Network or ANN, but these days, most people just use the term Neural Network.\n\
    \n^([\\[30\\]](#index_split_014.html#filepos130263)) Rumelhart, D. E., Hinton,\
    \ G. E. and Williams, R. J. (1986). ‘Learning representations by back-propagating\
    \ errors’. Nature 323(6088).\n\n^([\\[31\\]](#index_split_014.html#filepos134139))\
    \ I promised no complex formulas, but I’ll throw just one into the mix. There\
    \ are many activation functions, but a very common one is the “logistic function.”\
    \ This is calculated as 1/(1+e ^(\\- (Initial Score))). The value of e is 2.718.\
    \ e is a bit like PI (3.142) in that it appears in all sorts of places in mathematics\
    \ and statistics."
