    # 与推荐


    ## 运营数据库管理系统

    [`www.odbms.org/`](http://www.odbms.org/) 该网站由一系列行业专家支持。它涵盖了与机器学习、云计算和大数据等新技术的实施与应用相关的广泛的话题。


    ### KDnuggets

    [`www.kdnuggets.com/`](https://www.kdnuggets.com/) 这是一个为数据科学家提供资源的领先网站之一。


    ### AnalyticBridge

    [`www.analyticbridge.com/`](http://www.analyticbridge.com/) AnalyticBridge 托管了一系列向所有人开放的机器学习文章、博客和讨论论坛。它涵盖的话题非常宽泛，从战略层面到非常技术性/操作层面的内容无一不包。


    ### LinkedIn（领英）

    [`www.linkedin.com/`](http://www.linkedin.com/) LinkedIn 上有多个讨论机器学习及相关主题的论坛。


    ### Kaggle

    [`www.kaggle.com/`](https://www.kaggle.com/)。 Kaggle 将自己描述为“数据科学与机器学习的家园”。它为数据科学家提供各种资源，但最广为人知的是举办机器学习/AI
    竞赛。其中许多竞赛为获胜者提供丰厚的美元奖金。Kaggle 竞赛对任何人开放。你只需要下载给定竞赛的数据然后上传你的结果即可。这些结果会在几秒钟内自动完成评估，你的分数将进入竞赛排行榜，以便你可以看到自己的排名。Kaggle
    竞赛的一个很棒的功能是你可以根据意愿多次参赛，允许你尝试许多不同的解决方案。


    ### StatSoft

    [`www.statsoft.com/Textbook`](http://www.statsoft.com/Textbook)。 这是一个由 Dell 管理的网站，Dell
    是 `STATISTICA` 统计软件包的提供者。如果你想了解更多各种统计方法，包括机器学习中使用的方法，那么这是一个非常好的参考网站。


    ## 通用读书籍

    以下是适合普通读者的书籍列表；即：没有公式或技术术语。


    - **Agrawal, A., Gans, J. and Goldfarb, A. (2018). Prediction Machines: The Simple
    Economics of Artificial Intelligence. Harvard Business Review Press.** 这三位作者是经济学家而非技术专家。他们从经济学角度讨论
    AI。特别是，他们提出了 AI 作为一种更高效的方式，来预测那些在战略和操作上对业务至重要的事情。

    - **Davenport, T. and Kim, J. (2013). Keeping Up with the Quants: Your Guide to
    Understanding and Using Analytics. Harvard Business Review Press.** Davenport
    在他 2006 年的书籍 `Competing on Analytics` 中是第一批撰写易读分析类书籍的人之一。这本较新的书是专门为非技术管理人员编写的，帮助他们理解并与具有技术思维的机器学习从业者（即数据科学家）合作。

    - **Finlay, S. (2014). Predictive Analytics, Data Mining and Big Data. Myths,
    Misconceptions and Methods. Palgrave Macmillan.** 这是我的书之一，所以我不可免会对它说一些好话。它主要上是一本关于机器学习的书，但也对大数据进行了简要介绍。重点是围绕预测模型开发和实施的实际问题问题。

    - **Information Commissioner’s Office (2017). Big data, artificial intelligence,
    machine learning and data protection. ICO.** 这份文件是由英国政府编写的一份详细讨论报告。它从数据保护的角度考察了大数据、机器学习和人工智能的影响。它对处理这些新技术时需要考虑的问题提供了一个非常全面的视角，特别是关于适用于所有欧盟国家的通用数据保护条例（`GDPR`）的内容。

    - **Kahneman, D. (2012). Thinking, Fast and Slow. Penguin.** 这是一本关于决策的书。它深入探讨了人们之所以以他们的方式做出决策的原因。特别是，它讨论了为什么人们往往难以接受基于机器学习的自动化决策系统。然而，这本书的涵盖范围比这要广泛得多。它讨论了与人类决策过程相关的广泛问题。

    - **O’Neil, C. (2016). Weapons of Math Destruction. How Big Data Increases Inequality
    and Threatens Democracy. Allen Lane.** 这本引人入胜的书展示了预测模型的“暗面”，讨论了通过使用和误用可能带来的偏见和歧视。与本书的第
    13 章的内容非常互补。

    - **Siegel, E. (2016). Predictive Analytics: the Power to Predict Who Will Click,
    Buy, Lie, or Die. 2^(nd) edition. Wiley.** 这是一本非常具有争议（书（像 marmite））的书。你要么喜欢它，要么讨厌它，但它是那本让机器学习的注意力进入比以往任何时候都更广泛受众的书。我喜欢
    marmite！

    - **Silver, N. (2012). The Signal and the Noise: Why So Many Predictions Fail.
    Penguin.** 这并不是一本真正的机器学习书籍。然而，非常相关的是它关注于理解为什么这么多预测系统会失败。它讨论了为什么需要更多关注预测和预测的弱点和陷阱，以便提高未来预测模型的质量。


    ## 技术推荐

    如果你想准备工具并更深入地接触 AI 和机器学习的技术方面，那么我推荐以下内容：


    - **Baesens, B. (2014). Analytics in a Big Data World: The Essential Guide to
    Data Science and its Applications. Wiley.** 这本书描述了开发预测模型的所有关键阶段。对于具有少量数学和/统计知识的人来说很好的读物，但你不需要数学或统计学位就能理解
    Baesens 提出的概念。

    - **Chollet, F. (2018) Deep Learning with Python. Manning Publications.** 这本结构良好的书从介绍人工智能和机器学习开始。随后在提供
    `Python` 代码示例之前，涵盖了支撑机器学习的底层理论。

    - **Crawley, M. (2012). The R Book. 2^(nd) Edition. Wiley.** 有许多统计软件包可以用于机器学习。然而，`R`
    是最流行的之一。`R` 是开源的，可以从 `CRAN` 网站免费下载 [`cran.r-project.org/`](http://cran.r-project.org/)。如果你有一定的编程知识，这本书提供了对
    `R` 语言的全面介绍。注意这本书的重点是学习 `R`，而不是机器学习。

    - **Easley, D. and Kleinberg, J. (2010). Networks, Crowds, and Markets: Reasoning
    About a Highly Connected World. Cambridge University Press.** 我在正文中没有讨论社交网络分析，但社交网络是许多机器学习模型的数据来源。Facebook、Google
    和 LinkedIn 等公司将机器学习应用于他们持的数据，以驱动广告和目标营销活动。这本书提供了关于社交网络分析在多种环境中应用的实践和理论材料。

    - **Goodfellow, I, Bengio, Y. and Courville A. (2016). Deep Learning (Adaptive
    Computation and machine learning Series). MIT Press.** 长度近 800 页，评论界将其描述为 AI 和机器学习的“圣经”。你可能需要擅长处理数学和统计知识才能从书中获得最大的价值。


    '
