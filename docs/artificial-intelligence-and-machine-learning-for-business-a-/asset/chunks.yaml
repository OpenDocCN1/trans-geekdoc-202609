    [84] The paper does not give a definitive date but states: “According to our estimate,
    47 percent of total US employment is in the high risk category, meaning that associated
    occupations are potentially automatable over some unspecified number of years,
    perhaps a decade or two.” Which gets us to somewhere around 2030-2035.


    [85] PwC (2017) ‘Up to 30% of existing UK jobs could be impacted by automation
    by early 2030s, but this should be offset by job gains elsewhere in economy’ [https://www.pwc.co.uk/press-room/press-releases/Up-to-30-percent-of-existing-UK-jobs-could-be-impacted-by-automation-by-early-2030s-but-this-should-be-offset-by-job-gains-elsewhere-in-economy.html](https://www.pwc.co.uk/press-room/press-releases/Up-to-30-percent-of-existing-UK-jobs-could-be-impacted-by-automation-by-early-2030s-but-this-should-be-offset-by-job-gains-elsewhere-in-economy.html)
    Accessed 06/05/2018. The study made clear that the 38% figure for the US was a
    theoretical maximum based only on technological feasibility. It did not take into
    account legal, economic and social issues; i.e. just because it was technically
    feasible to automate a job did not mean that it would be.


