- raw: "The fact that the scorecard and decision tree models have differences in the\
    \ data that they use is a feature of the algorithms used to construct them. There\
    \ are literally hundreds of different machine learning algorithms that can be\
    \ used to construct many different types of predictive models. Each algorithm\
    \ has its own logic for selecting which data items are important predictors and\
    \ the weights those predictors should be given in the model. Each approach has\
    \ its strengths and weakness and is better at predicting some types of cases than\
    \ others.\n\nWhat this means in practice is that there no such thing as a best\
    \ type of model that should always be used for all types of problem. No one type\
    \ of predictive model can be said to be universally better than all the others.\
    \ The scorecard proved to be better (in terms of predictive accuracy) than the\
    \ decision tree this time, but for a different type of problem, using different\
    \ data and with different objectives, it may be the case that a decision tree\
    \ wins out.\n\nThis means is that if you want to ensure that you get the very\
    \ best model for your particular problem (as measured in terms of predictive accuracy),\
    \ you have to build different models, compare them against each other, and then\
