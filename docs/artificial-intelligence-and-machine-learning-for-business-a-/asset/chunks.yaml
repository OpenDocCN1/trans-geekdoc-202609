- raw: "Most machine learning applications are underpinned by predictive models. The\
    \ scores generated by the model(s) then drive decision-making and the subsequent\
    \ actions that are taken. So, how does a predictive model generate a score? That\
    \ depends on the type of predictive model being employed, and there are quite\
    \ a few options to choose from. However, the three most popular types of model,\
    \ which are used in the vast majority of real world business applications, are\
    \ Scorecards (linear models), Decision Trees (Classification And Regression Trees\
    \ or CART) and Artificial Neural Networks (ANNs), most commonly referred to as\
    \ just Neural Networks (NNs).\n\nScorecards and decision trees are relatively\
    \ easy for non-technical people to understand. The model scores are calculated\
    \ in a simple and transparent way. It’s easy to determine why these models make\
    \ the predictions that they do. Neural networks on the other hand tend to be a\
    \ little more complex and “Black box” in nature. This means that it can be difficult\
    \ to understand why a neural network has arrived at the score that it has, and\
    \ hence why a certain decision has been made on the basis of that score. However,\
    \ neural networks are an increasingly popular choice for many machine learning\
    \ applications due to their propensity to deliver more accurate predictions than\
    \ scorecards or decision trees in many (but not all) situations.\n\nAdvanced forms\
    \ of neural networks (deep networks/deep learning) are currently at the cutting\
    \ edge of machine learning/AI research. Consequently, neural networks are the\
    \ models of choice for complex AI problems such as object identification, speech\
    \ recognition and language translation.\n\nTo illustrate these three types of\
    \ predictive model, let’s return to the world of health care and focus on one\
    \ specific condition: heart disease^([\\[17\\]](#index_split_028.html#filepos412950)).\
    \ Heart disease is one of the leading causes of death worldwide. Each year, around\
    \ 1 in every 1,000 of the population in western countries (UK, USA, etc.) dies\
    \ from heart disease, and a significant proportion of the population live with\
    \ heart conditions that may well kill them sometime down the line. If you can\
    \ identify people who are highly likely to develop heart disease in the future\
    \ and take preventative action to reduce that likelihood, then that will dramatically\
    \ reduce human suffering and increase life expectancy. The reduction in health\
    \ care costs will also be considerable.\n\nImagine that the government has the\
    \ utopian ideal of screening everyone in the population for heart disease, with\
    \ the aim of taking preventative action to reduce future incidence of the disease.\
    \ One way that they could do this, is to initiate a health campaign whereby every\
    \ man women and child is invited to visit their doctor. They would then have relevant\
    \ investigations and diagnostics tests and be given advice on how to minimize\
    \ their risk of developing heart disease in the future.\n\nThat’s fine in theory,\
    \ but in practice the cost of such an exercise would be immense and there would\
    \ not be enough doctors available to see everyone in a realistic time. The treatment\
    \ of other life-threatening conditions, such as cancer and diabetes, would be\
    \ likely to suffer due to a lack of resources. In fact, the net result might actually\
    \ be a reduction in the overall well-being of the population due to an over-emphasis\
    \ on heart disease at the expense of other conditions.\n\nThe blanket approach\
    \ of screening everyone for heart disease is clearly not realistic. However, a\
    \ more achievable goal might be to aim to identify say, at least half of those\
    \ that will develop heart disease in the next 5 years, yet target no more than\
    \ say, 5% of the population as a whole; i.e. only 1 in 20 people are invited for\
    \ the full set of tests, but the majority of those likely to get heart disease\
    \ will be in that 5%. OK – so half of heart disease cases would be missed, but\
    \ the cost savings make the exercise justifiable and does not threaten resources\
    \ allocated to the treatment of other conditions.\n\nTo achieve this objective,\
    \ we are going to need some way of identifying those most at risk. To do this,\
    \ we are going to apply a machine learning approach to build a predictive model\
    \ that estimates the likelihood of someone developing heart disease in the next\
    \ few years (a classification model). The aim is to use the model to identify\
    \ those individuals most at risk. These people will then be contacted to invite\
    \ them for a check-up and lifestyle review.\n\nThe starting point for machine\
    \ learning is data. Data is the fuel that feeds the analytics process. Trying\
    \ to do machine learning without data is like trying to make a cake without any\
    \ ingredients or washing your car without water.\n\nTo build a model of heart\
    \ disease, the first task is to gather some historic patient data. For this particular\
    \ problem, we are going to go back and obtain the medical records from a sample\
    \ of 500,000 people (chosen at random) who didn’t have any sign of heart disease\
    \ five years ago. This data will include, amongst other things, things like: peoples’\
    \ age, gender, their Body Mass Index (BMI)^([\\[18\\]](#index_split_028.html#filepos413289)),\
    \ blood pressure readings, previous medical history, how much they exercise, if\
    \ they smoke and how much alcohol they drink. There may also be other, non-medical\
    \ information available such as people’s income, marital status, number of dependents,\
    \ type of house they live in and so on, gathered from other sources.\n\nThis snapshot\
    \ of personal data from five years ago is then matched against what happened to\
    \ those people over the subsequent 5 year forecast horizon; i.e. a record is kept\
    \ of which people went on to develop a heart condition at some time in the next\
    \ 5 years and which did not. So, at this point we have two parts to the data:\n\
    \n*   Observation data. This is information about people at the start of the five\
    \ year period; i.e. their age, blood pressure, smoking habits and so on.\n\n>\
    \   \n\n*   Outcome data. This is a record of their health over the forecast horizon.\
    \ In particular, this data records if someone developed heart disease or not.\n\
    \nThese two types of data, when combined together, form the development sample,\
    \ which is going to be used to produce the model. Let’s assume that of the 500,000\
    \ cases in the development sample, 30,000 (6%) went on to develop heart disease\
    \ and the other 470,000 (94%) did not. Note that having data about people who\
    \ didn’t get heart disease is just as important as having data about those who\
    \ did. This is because the machine learning process works by identifying differences\
    \ between the two event types. A common mistake with data analysis is just to\
    \ record data about the event of interest, and to forget about the “non-events.”\
    \ Without both event and non-event information it is very difficult to come to\
    \ any meaningful conclusions using machine learning (or any other data analysis\
    \ method).\n\nThe next stage of the process is where the complex mathematics comes\
    \ into play. Various algorithms are applied to generate a predictive model, based\
    \ on what the algorithms can infer from the data in the development sample. In\
    \ particular, the algorithms seek to find relationships that correlate with events\
    \ or non-events, and it is these relationships which are captured by the predictive\
    \ model resulting from the machine learning process.\n\nThese days, there are\
    \ lots of computer packages that will apply the relevant mathematics in order\
    \ to create a model. As a rule, you don’t need to be a trained data scientist\
    \ to be able to generate a predictive model – the software will do it all for\
    \ you."
