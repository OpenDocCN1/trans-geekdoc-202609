    评分卡和决策树模型在使用的数据上存在差异，这是构建这些模型所用算法的特性。事实上，有数百种不同的机器学习算法可以用于构建许多不同类型的预测模型。每种算法都有自己的逻辑，用于选择哪些数据项是重要的预测因子，以及这些预测因子在模型中应赋予的权重。每方法都有其优缺点，并且在预测某些类型的案例时比其他方法更好。


    这在实践中意味着，并不存在一种适用于所有问题类别的“最佳”模型类型。没有任何一种预测模型类型可以被认为普遍优于所有其他模型。这一次，评分卡（从预测准确性来看）被证明优于决策树，但对于不同类型的问题，使用不同的数据并有不同的目标，决策树可能会胜出。


    这说明，如果你想确保为你的特定问题获得最佳模型（以预测准确性衡量），你就必须构建不同的模型，并在它们之间进行相互比较，然后决定哪一个最合适。


    尽管如此，在实际的现实情况中，大多数类型的模型对许多类型的问题都会产生非常相似的预测性能。在理论上，可能会有理由解释为什么某种类型的模型优于另一种，或者为什么
    `Algorithm A` 优于 `Algorithm B`，但在实践中，它们在许多应用领域是大同小异的。因此，在选择哪种模型类型时有很大的灵活空间。


    这是机器学习的另一个伟大特性。这是意味着在决定哪种模型最适用于给定问题时，除了预测准确性外，其他因素也可以发挥作用。特别是在某些问题领域，拥有一个易于解释且符合关于如何做出决策的常识观点模型是非常关重要的。这有时比拥有一个在理论上更合适或准确率略高、但业务用户或行业监管机构难以理解的模型要重要得多。


    ## 8. 神经网络与深度学习


    我们大脑包含了数以亿计的神经元，每个神经元都相互连接，产生数以万亿计的连接。正是神经元及其连接的结合驱动了我们思考和智能行动的能力、理解世界运作的方式，以及对我们如何与世界互动做出（有意识或无意识的）决策。


    早在 20 世纪 50 年代，计算机科学家首次提出了“人工神经元”的概念，但直到 20 世纪 80 年代中期，将多个连接在一起的人工神经元（神经网络）才被提出作为解决复杂问题的方法。从那时起，神经网络的普及程度持续增长，先进形式的神经网络目前处于人工智能和机器学习研究的最前沿。


    关于神经网络要说的第一点是，虽然它们有时被吹捧为极其复杂的“类脑”结构，但如果愿意花一点时间和精力研究它们，就可以很容易理解它们。可以肯定，典型的神经网络确实比之前章节介绍的评分卡和决策树要复杂，但归根结底，其原理并没有太大不同——只是内容更多了。


    为了说明神经网络的操作，我们将再次回到之前使用过的心脏病预测问题。首先，让我们从神经网络的构建块——神经元开始。在机器学习术语中，神经元不是由某个疯狂科学家在某个秘密实验室里培养的生物体，而是对自然神经元行为的一种简单直观的表示，它是使用计算机代码实现的方程创建的。图
    7 展示了人工神经元的工作原理。


    ```

    ![](images/00008.jpg

    ```


    图 7 中神经元的操作如下：


    1. 观测数据（如 `Age` 和 `BMI`）为神经元提供输入。

    2. 每个输入都乘以一个权重（权重可以是正的，也可以是负的）。对于非数值数据，如 `gender` 或 `smoker`，使用 `0/1` 标记表示每种情况。例如，女性为
    `1`，男性为 `0`。

    3. 将输入乘以其权重并相加，得到初始得分。

    4. 在计算出初始得分后，对其进行转换。这通常是为了强制让得分落在 `0-1` 范围内。这种转换并非绝对必要，但被认为是一种“良好的做法”。这样做当神经元与其他神经元组合产生神经网络时，所有神经元产生的值都在相同的范围内；即
    `0` 到 `1` 之间。

    5. 初始得分的转换版本就是神经元产生的输出得分。


    所以，在机器学习语境下，神经元并不是任何神秘或复杂的东西，它只是几个简单的公式。第一个公式将每个输入变量乘以权重并求总和。第二个公式（称为激活函数）随后修改（转换）该值，使其处于一个固定范围内，通常在
    `0` 到 `1` 之间。就如此简单！巧妙之处在于确定权重应该是多少，我们很快就会介绍这一点。


    单来看，单个神经元与评分卡模型并没有太大区别。唯一的实质性区别是强制得分进入固定范围的转换。事实上，可以证明神经元生成的输出与评分卡模型的输出是等效的。为了产生神经网络模型，将许多神经元连接在一起。图
    8 提供了这种这种情况发生的一个示例。


    ```

    ![](images/00011.jpg

    ```


    在图 8 中，输入数据提供给第一层中四个神经元中的每一个。每个神经元都有自己独立的权重集。权重与输入数据结合创建了基础得分（`Score1`、`Score2`
    等）。这些得分随后被转换以产生四个输出。来自第一层神经元的输出为第二层中的单个神经元（`Neuron 5`）提供了输入。`Neuron 5` 然后将前 4
    个神经元的每个输出乘以一个权重以创建 `Score5`。然后对其进行转换，以创建网络的最终得分。图 8 中神经网络的关键特征是：


    * 给定层中每个神经元的输入是相同的（例如第一层神经元的 `Age`、`BMI` 等），但每个神经元内部的权重是不同的。因此，每个神经元产生不同的得分。

    * 第一组神经元（第一层）的输出（得分）为第二组神经元（第二层）提供输入。

    * 在此示例中，第一层有四个神经元。在实践中，无法预先确定最优神经元数量。相反，会构建具有不同神经元数量的竞争模型，并选择性能最好的一个。对于大多数业务应用的经验法则是，神经元数量在输入数据项数量的一半到倍之间（在本示例中为
    4 到 16 之间）。


