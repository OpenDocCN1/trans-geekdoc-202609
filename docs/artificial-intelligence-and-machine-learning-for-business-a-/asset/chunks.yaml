- raw: "That’s just a few ways in which machine learning is being used. Today, machine\
    \ learning supports a huge range of applications. In fact, almost any aspect of\
    \ life that involves decision-making in one form or another. The algorithms that\
    \ match people on dating sites, the technology used to detect credit card fraud\
    \ and systems for identifying terrorist suspects all utilize predictive models\
    \ derived using machine learning. If you want a more comprehensive list of applications\
    \ then see the book by Eric Siegel^([\\[3\\]](#index_split_028.html#filepos407038)),\
    \ which details more than 120 different applications of predictive models in use\
    \ today – and that’s not a comprehensive list!\n\nThat brings us on to the question\
    \ as to what one means by Artificial Intelligence or AI. There are many and varied\
    \ definitions of what AI is, and as with predictive analytics, many people use\
    \ the terms AI and machine learning interchangeably. In terms of the overall scope\
    \ of AI research, machine learning is a key field of study, but there are many\
    \ others. True artificial intelligence is about much much more than just pattern\
    \ recognition and prediction. Some experts also question if true AI can ever be\
    \ achieved by just following a “Brute force” approach of developing ever more\
    \ complex algorithms using ever more powerful computer hardware. Is there some\
    \ additional (as yet unknown) element required for human-like intelligence and\
    \ self-awareness which can’t be replicated via computation alone^([\\[4\\]](#index_split_028.html#filepos407309))?\n\
    \nSo, in one sense it’s incorrect to say that machine learning and artificial\
    \ intelligence are the same thing. However, in practice almost every AI system\
    \ in use today relies heavily on machine learning. Therefore, for the purposes\
    \ of this book a simple working definition of AI that we shall adhere to is:\n\
    \n*   Artificial Intelligence (AI) is the replication of human analytical and/or\
    \ decision-making capabilities.\n\nA good AI application is one that can perform\
    \ as well or better than the average person when faced with everyday tasks. For\
    \ example, the ability to identify people from their Facebook photos, being able\
    \ to assess someone’s creditworthiness more accurately than an experienced underwriter,\
    \ the ability to beat the best Go and chess players or being better able to spot\
    \ the signs of cancer on a medical scan than an expert radiologist.\n\nAt one\
    \ level, AI applications can seem almost magical to the layperson. However, like\
    \ most things, once you get under the bonnet the mystique evaporates. In practice,\
    \ all of the news stories one hears about the amazing applications of “AI” are\
    \ really just very sophisticated applications of machine leaning.\n\nA key mistake\
    \ to avoid is thinking that current AI applications are in any way intelligent\
    \ in a human conscious way. Sure, they are very complex, exceedingly clever and\
    \ can be creepily lifelike at times, but it’s all just math at the end of the\
    \ day. Most experts agree, we are years away from being able to create a machine\
    \ with a human-like sense of self, or which could pass itself off as human day\
    \ in, day out. That’s not to say there aren’t some very good chatbots out there!\n\
    \nAll of the AI applications in use today are what the industry refers to as Narrow\
    \ AI. They are very good at behaving intelligently when applied to one well defined\
    \ area of expertise. However, these systems are miles away from General AI. General\
    \ AI is a system that can learn and act intelligently across a wide range of environments\
    \ and problems in a similar way to a person. An AI application that is used to\
    \ detect tax avoidance for example, is useless at detecting the signs of cancer\
    \ from medical scans. However, a person could learn to do both these tasks if\
    \ they were given suitable training. In a similar vein, a system such as Google\
    \ Translate is great at understanding the spoken word but wouldn’t be much use\
    \ when it comes to assessing if someone on a dating site might be compatible with\
    \ you.\n\nThe core components that drive most AI/machine learning applications\
    \ are:\n\n*   Data input. This can be sensory inputs from cameras (eyes), microphones\
    \ (ears) or other sources. It also includes pre-processed data such as the information\
    \ captured when someone fills in a form online, details of what someone has bought\
    \ using their credit card or an individual’s credit history provided by a credit\
    \ reference agency.\n\n>   \n\n*   Data (pre)processing. The raw data input needs\
    \ to be processed into a standard “computer friendly” format before it is ready\
    \ to be used.\n\n>   \n\n*   Predictive models. These are generated by the machine\
    \ learning process using past experiences; i.e. large amounts of historic data.\
    \ Pre-processed data for new cases is fed into the models in order to generate\
    \ fresh predictions going forward.\n\n>   \n\n*   Decision rules (rule sets).\
    \ A prediction on its own is useless. You have to decide how to use it. Decision\
    \ rules are used in conjunction with data inputs and the scores from predictive\
    \ models to decide what to do. Sometimes these rules are derived automatically\
    \ by the machine learning algorithm, but often they will include additional rules\
    \ defined by human experts/business users.\n\n>   \n\n*   Response/output. Action\
    \ needs to be taken based upon the decision(s) that have been made. If the decision\
    \ is that someone is creditworthy, then a credit card needs to be issued. If the\
    \ decision is that someone should be hired, then they need to be sent an offer\
    \ letter, given a contract to sign and so on.\n\nIt’s the combination of these\
    \ individual components that give us the “AI.”\n\nWhat makes some AI applications\
    \ appear so clever is the sheer complexity of the algorithms that underpin them,\
    \ combined with a slick user interface to gather data and deliver the required\
    \ responses in a human friendly way. Combine these components with the latest\
    \ generation of industrial machinery, or integrate them into cars and other vehicles,\
    \ and one has robots that can interact with their environment and engage with\
    \ us in a very human like way.\n\nLet’s begin by considering a marketing AI application\
    \ for a drinks company. The application takes information gathered about individuals\
    \ from social networks and feeds it into a predictive model to determine how likely\
    \ they are to buy a particular brand of whisky. The system then applies a number\
    \ of rules to decide if an individual should be marketed to. The rules that might\
    \ exist are:\n\n1.  If the predictive model estimates that the chance of them\
    \ buying whisky is more than 90% then do nothing. They will probably buy the whisky\
    \ anyway.\n\n>   \n\n1.  If the predictive model estimates that the chance of\
    \ them buying whisky is between 1% and 90% then send them a $5 discount coupon\
    \ to try and make the whisky a more attractive offering; i.e. influence the customer’s\
    \ behavior to increase the chance of them buying.\n\n>   \n\n1.  If the predictive\
    \ model estimates the chance of them buying whisky to be less than 1% then don’t\
    \ do anything. They probably won’t buy the whisky whatever you offer them. Therefore,\
    \ it’s not worth the effort trying to persuade them.\n\nSo, these rules would\
    \ be derived based on some type of cost-benefit analysis, where the 1% and 90%\
    \ cut-offs are deemed to be the optimal level at which to trigger marketing activity.\
    \ However, other business rules would also come into play, such as:\n\n1.  NEVER\
    \ make an offer to sell whisky to children, no matter what their propensity to\
    \ buy it!\n\n>   \n\n1.  DO NOT send offers to people with a history of alcohol\
    \ dependency."
  fmt: '

    That’s just a few ways in which machine learning is being used. Today, machine
    learning supports a huge range of applications. In fact, almost any aspect of
    life that involves decision-making in one form or another. The algorithms that
    match people on dating sites, the technology used to detect credit card fraud
    and systems for identifying terrorist suspects all utilize predictive models derived
    using machine learning. If you want a more comprehensive list of applications
    then see the book by Eric Siegel, which details more than 120 different applications
    of predictive models in use today – and that’s not a comprehensive list!


    That brings us on to the question as to what one means by Artificial Intelligence
    or `AI`. There are many and varied definitions of what `AI` is, and as with predictive
    analytics, many people use the terms `AI` and machine learning interchangeably.
    In terms of the overall scope of `AI` research, machine learning is a key field
    of study, but there are many others. True artificial intelligence is about much
    much more than just pattern recognition and prediction. Some experts also question
    if true `AI` can ever be achieved by just following a “Brute force” approach of
    developing ever more complex algorithms using ever more powerful computer hardware.
    Is there some additional (as yet unknown) element required for human-like intelligence
    and self-awareness which can’t be replicated via computation alone?


    So, in one sense it’s incorrect to say that machine learning and artificial intelligence
    are the same thing. However, in practice almost every `AI` system in use relies
    heavily on machine learning. Therefore, for the purposes of this book a simple
    working definition of `AI` that we shall adhere to is:


    - Artificial Intelligence (`AI`) is the replication of human analytical and decision-making
    capabilities. A good `AI` application is one that can perform as well or better
    than the average person when faced with everyday tasks. For example, the ability
    to identify people from their photos, being able to assess someone’s creditworthiness
    more accurately than an experienced underwriter, the ability to beat the best
    chess players or being able to spot the signs of cancer than an expert radiologist.


    At one level, `AI` applications can seem almost magical to the layperson. However,
    like most things, once you get under the bonnet the mystique evaporates. In practice,
    all of the news stories one hears about the amazing `AI` applications are really
    just sophisticated applications of machine learning.


    A key mistake to avoid iss in a human friendly way. Combine these components with
    the latest generation of industrial machinery, or integrate them into cars and
    other vehicles, and one has robots that can interact with their environment and
    engage with us in a very human like way.


    Let’s begin by considering a marketing `AI` application for a drinks company.
    The application takes information gathered about individuals from social networks
    and feeds it into a `predictive model` to determine how likely they are to buy
    a particular brand of whisky. The system then applies a number of rules to decide
    if an individual should be marketed to. The rules that might exist are:


    1. If the `predictive model` estimates that the chance of them buying whisky is
    more than 90% then do nothing. They will probably buy the whisky anyway.

    2. If the `predictive model` estimates that the chance of them buying whisky is
    between 1% and 90% then send them a $5 discount coupon to try and make the whisky
    a more attractive offering; i.e. influence the customer’s behavior to increase
    the chance of them buying.

    3. If the `predictive model` estimates the chance of them buying whisky to be
    less than 1% then don’t do anything. They probably won’t buy the whisky whatever
    you offer them. Therefore, it’s not worth the effort trying to persuade them.


    So, these rules would be derived based on some type of cost-benefit analysis,
    where the 1% and 90% cut-offs are deemed to be the optimal level at which to trigger
    marketing activity. However, other business rules would also come into play, such
    as:


    1. NEVER make an offer to sell whisky to children, no matter what their propensity
    to buy it!

    2. DO NOT send offers to people with a history of alcohol dependency.

    '
  trans: '

    这只是机器学习运用的几种方式。今天，机器学习支持着极其广泛的应用。事实上，生活中几乎任何涉及某种形式决策的方面都有它的身影。在约会网站上为人们配对合人群的算法、用于检测信用卡欺诈的技术，以及识别恐怖分子嫌疑人的系统，都利用了通过机器学习得出的预测模型。如果你想查看更全面的应用列表，可以参考埃里克·西格尔（Eric
    Siegel）的书，书中详细介绍了目前使用的 120 多种不同的预测模型应用——而且这还不是全部列表！


    这引出了我们的一个问题：到底什么是人工智能或 `AI`。关于 `AI` 是什么有许多多样化的定义，就像预测分析一样，许多人交替使用 `AI` 和机器学习这两个术语。从
    `AI` 研究的整体范围来看，机器学习是一个关键的研究领域，但还有许多其他领域。真正的人工智能远比模式识别和预测得多。一些专家还质疑，仅仅通过通过使用日益强大的计算机硬件来开发日益复杂的算法的这种“暴力破解”方法，是否真的能实现真正的
    `AI`？对于类人智能和自我意识，是否需要某种额外的（目前尚未知的）元素，而这种元素是无法通过纯计算复制的？


    因此，从某种意义上说，说机器学习和人工智能是同一件事是不正确的。但在实践中，几乎每个正在使用的 `AI` 系统都严重依赖于机器学习。因此，为了本书的，我们将遵循一个关于
    `AI` 的简单工作性定义：


    - 人工智能 (`AI`）是对人类分析和决策能力的复制。一个良好的 `AI` 应用是在面对日常任务时，其表现可以与普通人不相甚至更好。例如，从照片中识别人的能力、比经验丰富的承保核师更准确地评估某人信用状况的能力、击败顶尖棋手的能力，或比放射科专家更早发现癌症迹象的能力。


    在某种程度上，`AI` 应用对外行来说几乎是神奇的。然而，大多数事物一样，一旦你了解了其原理，神秘感就会消失。在实践中，人们听到的所有关于神奇 `AI` 应用的新闻，实际上只是机器学习的高级应用。


    要避免的一个关键错误是以人类友好的方式进行。将这些组件与最新一代工业机械相结合，或将它们整合到汽车和其他车辆中，就可以拥有能够与其环境交互并以非常类人的方式与我们交流的机器人。


    让我们从考虑一家饮料公司的营销 `AI` 应用开始。该应用从社交网络中收集有关个人的信息，并将其输入 `predictive model`，以确定他们购买特定品牌威士忌的概率。系统随后应用若干规则来决定是否应该对某个人进行营销。可能存在的规则有：


    1. 如果 `predictive model` 估计他们购买威士忌的概率大于 90%，则什么都不做。他们可能也会购买威士忌。

    2. 如果 `predictive model` 估计他们购买威士忌的概率在 1% 到 90% 之间，则给他们发送 5 美元的折扣券，试图让威士忌更具吸引力；即影响客户的行为以增加他们购买的概率。

    3. 如果 `predictive model` 估计他们购买威士忌的概率小于 1%，则什么都不做。无论你向他们提供什么，他们都不会购买威士忌。因此，花精力说服他们是不值得的。


    所以这些规则是基于某种成本效益分析得出的，其中 1% 和 90% 的阈值被认为是触发营销活动的最佳水平。然而，其他业务规则也会发挥作用，例如：


    1. 绝不向儿童推销威士忌优惠，无论他们的购买意愿如何！

    2. 不要向有酒精依赖史的人员发送优惠信息。

    '
