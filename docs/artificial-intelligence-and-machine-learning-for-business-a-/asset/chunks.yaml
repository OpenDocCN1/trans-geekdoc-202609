    The fact that the scorecard and decision tree models have differences in the data
    that they use is a feature of the algorithms used to construct them. There are
    literally hundreds of different machine learning algorithms that can be used to
    construct many different types of predictive models. Each algorithm has its own
    logic for selecting which data items are important predictors and the weights
    those predictors should be given in the model. Each approach has its strengths
    and weakness and is better at predicting some types of cases than others.


    What this means in practice is that there no such thing as a best type of model
    that should always be used for all types of problem. No one type of predictive
    model can be said to be universally better than all the others. The scorecard
    proved to be better (in terms of predictive accuracy) than the decision tree this
    time, but for a different type of problem, using different data and with different
    objectives, it may be the case that a decision tree wins out.


    This means is that if you want to ensure that you get the very best model for
    your particular problem (as measured in terms of predictive accuracy), you have
    to build different models, compare them against each other, and then decide which
    one is the most appropriate.


    Having said this, in practical real-world situations, most types of model yield
    very similar levels of predictive performance for many types of problem. There
    may be theoretical arguments as to why one type of model is better than another,
    or why `Algorithm A` is superior to `Algorithm B`, but in practice they are all
    much of a muchness in many application areas. Therefore, there is a good deal
    of latitude that can be applied when selecting which type of model to choose.


    This is another great feature of machine learning. This is because it means that
    other factors, in addition to predictive accuracy, can come into play when deciding
    which model is best for a given problem. In particular, in some problem domains,
    having a model that is easily explicable and which is aligned to a common-sense
    view as to how decisions should be made is vital. This is sometimes far more important
    than having a model that is theoretically more appropriate or marginally more
    accurate, but which is less well understood by business users or industry regulators.


    ## 8. Neural Networks and Deep Learning


    Our brains contain billions upon billions of neurons, each interconnected to yield
    trillions of connections. It''s the combination of neurons and the connections
    between them that drive our ability to think and act intelligently, to understand
    how the world works and to make decisions (both consciously and unconsciously)
    about how we interact with the world.


    Back in the 1950s, computer scientists first came up with the concept of the “Artificial
    Neuron”, but it wasn’t until the mid-1980s that using multiple artificial neurons
    linked together (a neural network) was proposed as a way of solving complex problems.
    Since that time, the popularity of neural networks has continued to grow and advanced
    forms of neural networks are currently at the forefront of research into artificial
    intelligence and machine learning.


    The first thing to say about neural networks is that while they are sometimes
    touted as being immensely complex “brain like” things, they can be readily understood
    if one is willing to spend a little time and effort to study them. It’s certainly
    true that a typical neural network is more complex than the scorecards and decision
    trees that were introduced in previous chapters, but the underlying principles
    are not that much different at the end of the day – there is just more of it.


    To illustrate the operation of neural networks, we shall return once more to the
    heart disease prediction problem that we have used before. To begin, let’s start
    with the building block of a neural network – the neuron. A neuron in machine
    learning terms is not a living thing that’s been grown by a mad scientist in a
    covert lab somewhere, but is a simple and simplistic representation of how natural
    neurons behave, created using equations implemented as computer code. Figure 7
    provides an illustration of how an artificial neuron works.


    ```

    ![](images/00008.jpg

    ```


    The operation of the neuron in Figure 7 is as follows:


    1. The observation data, such as `Age` and `BMI`, provides the inputs to the neuron.

    2. Each input is multiplied by a weight (which can be positive or negative). For
    non-numeric data such as `gender` or `smoker`, `0/1` flags are used to represent
    each condition. For example, `1` if female, `0` if male.

    3. The inputs, multiplied by their weights, are added up to get an initial score.

    4. After the initial score has been calculated it is transformed. Often this is
    to force the score to be in the range `0-1`. This transformation is not absolutely
    essential but is deemed “good practice.” This is so that when the neuron is combined
    with others to produce a neural network, all the neurons produce values in the
    same range; i.e. between `0` and `1`.

    5. The transformed version of the initial score is the output score produced by
    the neuron.


    So, a neuron in the context of machine learning isn’t anything mysterious or complex,
    it’s just a couple of simple formulas. The first multiplies each of the input
    variables by a weight and adds up the total. The second formula (called an activation
    function) then modifies (transforms) this value so that it lies within a fixed
    range, usually between `0` and `1`. It’s as simple as that! The clever bit is
    determining what the weights should be, which we will cover shortly.


    On its own, a single neuron is really not much different from a scorecard model.
    The only material difference is the transformation to force the score to fixed
    range. It fact, it can be proven that the outputs generated by neuron and a scorecard
    model are equivalent. To produce a neural network model a number of neurons are
    connected together. Figure 8 provides an example of how this occurs.


    ```

    ![](images/00011.jpg

    ```


    In Figure 8, the input data is supplied to each of the four neurons in the first
    layer. Each neuron has its own independent set of weights. The weights, when combined
    with the input data, create base scores (`Score1`, `Score2`, etc.). These scores
    are then transformed to create four outputs. The outputs from this first layer
    of neurons provides the inputs to the single neuron in the second layer (`Neuron
    5`). `Neuron 5` then multiplies each of the outputs from the first 4 neurons by
    a weight to create `Score5`. This is then transformed to create the final score
    from the network. The key features of the neural network in Figure 8 are:


    * The inputs to each neuron in a given layer are the same (e.g. `Age`, `BMI` etc.
    for the first layer neurons), but the weights within each neuron are different.
    Therefore, each neuron produces a different score.

    * The outputs (the scores) from the first set of neurons (the first layer) provide
    the inputs to the second set of neurons (the second layer).

    * There are four neurons in the first layer in this example. In practice, the
    optimal number of neurons can’t be determined up front. Instead, a number of competing
    models are built with different numbers of neurons, and the one that performs
    the best is chosen. A rule of thumb that works well for most business applications
    is to have between half and double the number of input data items (so between
    4 and 16 in this example).

