    请不要误会，我并不是说你以后在某个时刻无法买到全自动驾驶汽车，我也认为当你能买到时那将是非常棒的，但还需要很一段时间。炒作程度超过了现实。我们在实践中看到的是自动驾驶功能稳步增加的汽车，从自动刹车、自动停车和车道辅助开始，更复杂的功能不断涌现。然而，要实现任何人、任何时间、任何地点的全自动无人驾驶运输，还有一大堆细碎的问题仍在解决中，我指的不是经常被提到的“推车或孩子”的困境，而是：在交通堵塞时进行非法
    U 回弯（我们都这么做过！）、驶入迎向车流、避让紧急服务车辆、在单车道道路上超越行驶缓慢的拖拉机，以及知道何时必须开上路缘/人行道。这些只是世界各地人类驾驶员每天必须做的几件事。他们做这些事情并不是无故的。有时候，你必须爬上路缘或在技术上违法的情况下超车，否则你就会被后面几十个愤怒按喇叭的司机困住。同行司机的一个手势就能让你知道现在并入是安全的，即使看起来并不安全。至于那些认为只要我们从道路上移除人类驾驶员，这些问题都会得到解决的人——那简直是独角兽的幻想世界。要让美国人放弃驾驶权的挑战，会让撤销第二修正案看起来像是一场野餐一样简单。


    最后，谁能判定自动驾驶汽车就是自动驾驶汽车呢？难道没有某些独立的官方框架和测试流程，车辆必须通过才能声称其汽车是自动驾驶的吗？如果我必须通过驾驶考试，那么无人驾驶汽车也应该如此。许多政府正在研究这些事情，但它们仍处于婴儿阶段。


    好了，好了——对自动驾驶汽车的抱怨够了。这对于像这样的一本书有什么关系呢？嗯，这一章原本的重点将是：“避开炒作，识别机遇。”我想写关于机器学习和人工智能改变整个社会的所有有趣方式。这很重要，因为社会运作方式的变化既产生了威胁，也产生了机遇。新的商业途径被打开了，而旧的办事方式变成了重复性苦劳动和缓慢、手动、低效流程的遥远记忆。没有人希望发生在柯达（Kodak）和百老视（Blockbuster）身上的事情发生在自己身上。要么适应，要么死亡。


    然而，你必须像关注机遇一样，意识到风险、障碍和阻碍。技术之所以被称为“尖端前沿”是有原因的。每一个新技术的成功案例背后都有几十次失败，但我们总是给予成功更多的关注，并将失败抛在脑后。有一句俗话说：“从他人的错误中学习的人是智者。”然而，当我在亚马逊上搜索“商业失败”书籍时，返回的结果少于搜索“商业成功”时返回数量的
    5%。


    我们对成功和失败投入的关注程度不同，往往转化为对新技术将如何影响我们的不现实预期。自动驾驶汽车是这种效应的典型范例。它们展示了硅谷的过度乐观以及经常发生的对新技术的过度炒作。虚拟现实和可穿戴技术是另外两个例子，现在进度已经更靠后一点。最初被疯狂炒作，并没有统治世界，但它们确实有一些非常实用的现实应用。


    事实上，大多数新技术都遵循这条路径。技术从长期来看通常被证明是有用的，但很少能达到技术传教士在技术最初构想时所建议的高度。如果你想对实践中的过度炒作效应有一个概括性的了解，那么我再推荐不过高特技术轮回曲线（Gartner
    Hype Cycle）了。这一原理也被马拉拉法则（Amara''s Law）所捕捉：


    > “我们倾向于高估技术的短期影响，而低估其长期影响。”


    2012 年，高特报告称自动驾驶技术距离成熟还有 5-10 年。五年后的 2017 年，这一数字被上调至 10 年以上。


    关于 AI 技术炒作的另一个更通用的例子，是对未来几十年由于 AI 驱动自动化将失去的工作数量的估计。不要错，AI 是一项破坏性技术。许多人将因此失去工作或不得不适应不同的工作方式，但它不会取代我们所做的一切——至少在未来
    10-20 年内不会。


    2013 年最具影响力的研究将因自动化而面临高失业风险的工作比例定为 47%。该研究估计，到 2030-2035 年左右，美国目前由人类完成的工作几乎一半将由机器完成。对其他先进经济体（如英国和德国）的估计也相似。随着时间的推移，这一估计被下调了。2017
    年，普华永（PwC）建议上限为 38%。经合组织（OECD）的一项综合研究引数字 2018 年仅为 10%，这还没有考虑到支持这些新技术将创造的所有额外工作。这仍然是一个很大的影响，但比最初讨论的要小得多。如果你将这些工作损失分散在
    20 年内，那么相当于每年丢失 200 份工作中的一份——这还没有考虑到将产生的新工作。


    综合这一切，通常规则仍然适用。从业务角度来看，AI 与任何技术发展并无区别。你需要评估其影响，并对基于 AI 的技术何时、何地以及如何变得有用做出判断。不要盲目跟从。仅仅因为其他人都说他们这样做，并不意味着这对你来说是正确的。当然，你不能把头埋进沙子里。你应该主动寻求新想法和不同的工作方式，但要对人工智能和机器学习可以增加的价值做出自己的评估。此外，不要依赖那些向你推销解决方案的有益第三方来为你量化收益。


    几乎每天，我都会收到数据科学公司的邮件，提议彻底变革我的 IT 系统、自动化我的流程并增强我的数据分析能力。我该如何判断哪些是能为我提供价值的，哪些只是在这些技术的效效上？


    正如我们在之前的章节中讨论过的，技术必须适用于真实的业务问题和流程才能增加价值。基于机器学习的解决方案只有在帮助你实现以下至少一点时，才会增加价值：


    *   **降低成本**。它促进了更高效地执行某些操作，例如更好的仓库和库存控制，或优化产品定价。

    *   **提高质量**。该解决方案提供更好的产品和服务。例如，更快地履行客户订单或减少客户投诉。


    '
