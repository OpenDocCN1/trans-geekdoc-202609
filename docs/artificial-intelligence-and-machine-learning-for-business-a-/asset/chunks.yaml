    \ method used in machine learning for finding the points associated with a scorecard.\n\
    \nThis assumes a network with 74 neurons in the first layer and one neuron in\
    \ the second (output) layer. In the first layer, each of the 74 neurons has one\
    \ weight for each of the 100 input variables (7,400 weights). The neuron in the\
    \ output layer has 74 weights, one for each of the outputs from the first layer\
    \ of neurons. Hence 7,474 weights in total.\n\nThis is because standard neural\
    \ networks, where all the inputs are provided to every neuron in the first layer,\
    \ do not account for the spatial nature of images. For example, the pixels at\
    \ the top left of an image often have no relation to the pixels at the bottom\
    \ right. Therefore, it makes sense not to provide all inputs to every neuron.\
    \ \n\nGoogle Research Blog (2016). ‘AlphaGo: Mastering the ancient game of Go\
    \ with machine learning.’\n[https://research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html](https://research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html).\
    \ Accessed 06/04/2018.\n\nThere are also forms of supervised clustering. One such\
    \ example is the popular K-nearest neighbour approach. When a prediction is required\
    \ for a new case, the algorithm finds the `K` cases in the development sample\
    \ that are most similar to it. The model score is calculated as the proportion\
    \ of the `K` cases which displayed the behavior (outcome). If `K=200`, then the\
    \ algorithm would find the 200 cases most similar to the case a prediction is\
    \ required for. If say, 18 out of the 200 cases display the behavior, then the\
    \ score is 0.09 (`18/200`). What value of `K` to use is usually determined by\
    \ trial and error.\n\nThere are analytical tools that can collapse a large number\
    \ of data items into a 2 or 3-dimensional representation, which captures the most\
    \ important features of those data items. Examples of these methods include principle\
    \ component analysis and Self-Organizing Maps (SOMs).\n\nExperian’s Mosaic classifications\
    \ also exist in US, Germany and many other countries. A host of other companies\
    \ offer similar clustering based customer profiling products.\n\nTypically, this\
    \ would be achieved by subtracting the mean value of the variable and then dividing\
