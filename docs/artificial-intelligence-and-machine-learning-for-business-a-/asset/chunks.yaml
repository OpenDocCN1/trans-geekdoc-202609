    这两条规则所涉及的两个群体都包含许多想购买威士忌的人（即概率大于 1%），但从伦理角度来看，针对儿童或有酒精依赖问题的人群是站不住脚的。从纯粹的利润导向角度来看，向儿童营销可能是非法的，而且针对这类个人可能会导致大量的负面舆论。这两条规则很好地说明了为什么需要人类专业知识来支持基于自动机器学习的系统，特别是当系统被用于对个人做出具有风险或有争议的决策时。


    ### YouTube 广告投放案例


    算法不受约束运行的一个非常广为人知的例子是 YouTube 及其广告投放策略案例。2017 年，许多大型机构从 YouTube 撤出了广告。这是因为发现 YouTube
    将其某些广告与恐怖主义者或其他不良来源的内容并放在在一起。正是 YouTube 的机器学习算法决定了将哪些广告投放在何处，才导致了这一问题。因此，YouTube
    必须对其广告投放流程进行重大审查。结果在几个月后的 2018 年，他们决定恢复人工审核流程。每个视频片段在被纳入 YouTube 的将广告商与热门内容配对的服务之前，必须由真人进行审核和批准。


    一个合理的疑问是，为什么 YouTube 花了几乎一年的时间才找到解决方案？人们无法确定原因，但一个非常合理的答案是，他们花费大量时间尝试仅使用全自动（机器学习/人工智能）方法来解决问题，直到他们意识到需要在评估过程中保留人类因素。


    ### 发出响应与整合


    AI 系统被要求的最后一点是发布所需的响应。在威士忌的示例中，这是向被定标的个人发送合适的折扣码或优惠券。这意味着，为了执行所需的操作，AI 应用程序需要连接到组织的营销渠道。如果
    AI 告诉您适当的响应是向数百万客户发送优惠信息的短信，那么它就需要连接到可以发送短信的系统。如果使用短信、优惠券、网络弹出窗口或其他任何方式来传递优惠，那么仍然需要有人来设计沟通的文案和格式，使其既能吸引客户，又符合相关的营销法规。


    ### 预测与模式识别


    绝大多数 AI 应用严重依赖预测，并由模式识别（即机器学习/预测性分析）驱动。以支持 Apple `Siri` 和亚马逊 `Echo` 等工具的语音识别系统为例。在听到声音后，语音识别系统会将该声音预处理为若干标准化的声音片段。然后它将尝试识别它认为被说出的单词。这是基于使用机器学习创建的预测模型生成的一组概率（分数）。如果系统计算出该声音是“Hello”的概率为
    5%，“Jell-O”的概率为 20%，“Mellow”的概率为 75%，那么它将做出合理的推断，认为说出的单词是“Mellow”。


    先进的 AI 系统结合使用多层复杂的预测模型，根据它们接收到的输入，对周围正在发生的情况形成观点。语音识别系统的下一层将考虑短语和单词结构。系统的预测性元素将与决策规则（决策逻辑）相结合，以确定在说出某些单词或短语时应采取什么行动。


    ### 机器学习的历史


    一个常见的误区是，机器学习和人工智能是完全全新的，直到过去几年才进入主流。现实情况是，对机器学习商业应用的研究最早于 20 世纪 40 年代，机器学习自 20
    世纪 50 年代以来一直金融服务业（信用评分）。不久后，机器学习技术被应用于直接营销、税收收集和保险承保等领域。最近的进展是将此类工具引入家庭、引入智能手机。


    一些机器学习/AI 专家可能会反对这种历史观点，认为只有通过最近的技术进步，机器学习才有了自己的地位。然而，如果你对机器学习/AI 的定义包含了使用算法识别模式来驱动决策系统，且这些系统的表现优于人类专家，那么
    20 世纪 50 年代的信用评分系统符合该定义。


    ### 近期变化的因素


    最近的变化有三个方面。


    1. **术语**：在 20 世纪 80 年代/90 年代，现在被称为机器学习/人工智能被称为“数据挖掘”或“计算统计”。另一种情况是，今天最常用的机器学习方法的基础理论是在
    90 年代之前或在此期间开发的（尽管许多方法在之后得到了改进和扩展）。


    2. **硬件与软件**：通过智能手机、平板电脑和互联网将服务在线化，这意味着现在关于人的信息比以前多得多，而且信息量逐年增长。计算机的速度和存储能力也大幅提高。这使得快速且高效地处理海量数据成为可能。同样，机器学习算法及其预测模型的复杂性在短短几年内增加了几个数量级。与硬件进步和算法设计并行，现在有了大量的机器学习软件工具可用。其中许多是免费和或开源的（如
    `R` 和 `Python` 编程语言），并且可以通过个人电脑、笔记本电脑或微软、Google 等科技巨头提供的云服务使用。


    3. **交互**：变化的第三点是我们与底层模型和决策规则交互的方式。我们不再需要在键盘上输入非常僵化的指令，也不需要解释详细的数学输出。相反，现代 AI
    系统以更像人类的方式与我们交互。


    通常人机交互界面本身就基于机器学习原理，由预测模型驱动。如果我们回到威士忌销售的示例，我可以在聊天机器人的设计中使用机器学习，在社交媒体上与人们讨论饮酒习惯。聊天机器人收集的数据随后补充了我收集的关于人的其他数据。如果威士忌应用程序确定应该给人们提供优惠，那么可以通过聊天机器人以对话的形式回传给客户，而不是通过传统的短信或电子邮件向他们发送优惠券或折扣码。


    '
