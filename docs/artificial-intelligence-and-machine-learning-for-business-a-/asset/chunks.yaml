  trans: '

    机器学习最常见、也可以可以说是最早的应用之一就是预测。它是关于利用机器学习，根据你目前拥有的信息来确定你目前尚不知道的事物。人们所发现的模式与行为与结果之间的关系。这通常与人们过去的行为以及他们随后所做的事情有关。在识别出这些存在的关系后，就可以根据他们当前的状态对他们的未来行为做出预测。如果你给我提供一份人们之前购买历史的样本，我可以利用机器学习来识别他们购买行为中的模式。然后，我可以使用这些模式来预测某人可能购买的商品；即，未来的购买是我想要预测的结果。这让我能够针对这些特定产品，向他们提供定制的优惠活动来吸引他们。


    使用机器学习进行预测有时被称为预测建模（predictive modelling）或预测性分析（Predictive Analytics, PA）。事实上，预测性分析是机器学习的一种常见应用，以至于许多人（无论正确与否）经常交替使用这两个术语。


    预测个人的未来行为是人们通常与机器学习联系在一起的，但机器学习也可以应用于其他场景和问题。你只需要一些你想要确定（预测）的未知事件或事物即可，这可能发生在过去、现在或未来。医生检查患者、进行测试并询问他们的症状以收集证据（数据）。然后他们使用这些数据对他们认为患者出了什么问题得出结论。他们并不是在对患者的未来健康做出预测，而是试图找出他们今天出了什么问题。医生能以很高的准确做到这一点，因为他们将获得的患者信息与多年训练和实践中学习的知识进行交叉引用。换句话说，他们正在寻找患者的症状与他们对已知疾病之间的相关性。机器学习可以同样这样应用。给定关于不同疾病症状的详细信息，机器学习可以根据患者表现症状来估计某人患某种疾病的概率。


    另一种思考机器学习/预测性分析的方法将其视为减少不确定性的方法。在任何给定情况下都可能发生各种结果。机器学习不会绝对确定告诉你哪种结果会发生，但它可以提供每种结果发生的概率或几率的见解。


    你可能知道，当有人去超市购物时通常会买面包、葡萄酒和鸡肉，但通过机器学习，你可以确定例如，他们下次购买的产品是面包的概率为 80%，购买葡萄酒的概率为 15%，购买鸡肉的概率为
    5%。因此，如果你想鼓励他们在你的商店进行下一次购买，通过提供面包优惠比提供葡萄酒或鸡肉优惠更有可能赢得他们的青睐。


    预测模型（或此后称为模型）是机器学习过程生成的输出。模型捕捉了通过分析过程揭示的关系（模式）。一旦创建了模型，就可以用来生成新的预测。组织随后使用模型的预测结果来决定做什么或如何对待人们。因此，机器学习是一个过程，而预测模型是该过程的最终产物。


    有很多不同类型的预测模型，有几十种甚至上百种机器学习技术和算法可以用来生成模型。然而，无论模型的类型或用于创建该模型的数学方法如何，模型的预测结果几乎总是由一个数字表示——一个分数。分数越高，某人按照模型预测的方式行为的可能性就越大；分数越低，他们以那种方式行为的可能性就越小。


    机器学习可以应用于各种情况和许多类型的问题。然而，机器学习最常见的业务应用（也是本书关注的重点）与根据你今天对他们的了解来预测人们将要做什么或他们未来将如何行为有关。


    机器学习的一个非常著名的应用是信用评分。当人们想要贷款、信用卡或抵押贷款时，贷款人会向个人询问关于他们和生活方式的问题。然后他们会将此与来自 Experian
    或 Equifax 等信用参考机构提供的、包含个人之前借贷历史细节的信用报告信息相结合。这些信息随后被输入预测模型以生成信用评分。


    如果你在美国，你可能对 `FICO` 和/或 `Vantage` 分熟悉。高分 `>750` 预测某人极有可能偿还他们借的任何钱；即他们是有信用的。低分 `<500`
    表示某人不信誉。世界各地的银行和金融公司使用类似的信用评分方法。


    机器学习的另一个常见应用是目标营销。根据某人的年龄、性别、收入、网页浏览、购买历史、位置等信息，营销部门可以预测该人是否对特定产品感兴趣。他们随后使用该预测结果来决定是否向他们提供促销优惠。同样，预测模型也可以用于推断人们愿意为保险等产品支付多少钱。这些信息随后将被用于根据每个人的具体情况制定个性化的定价策略。


    机器学习实际运作的另一个示例是预防性医疗保健。传统的医疗保健系统是反应性的。人们在感到不适时寻求医疗帮助。医生然后尽力治疗他们所面对的疾病——这些治疗可能非常昂贵且耗时。如今，先进的医疗保健系统日益将注意力放在预防而非治疗上。这大大降低了成本并改善了患者的结局。机器学习被用于评估人们的病历并预测他们患特定疾病（如心脏病或糖尿病）的概率，通常提前多年。处于队列顶端的人员；即模型预测最可能患该疾病的人将收到联系，以启动预防措施。例如，改变生活方式或服用预防性药物。


    机器学习实际运作的最后一个示例是确定向人们推荐什么类型的新闻（或其他文章）。社交媒体提供者使用机器学习分析你过去阅读过的文章以及你与朋友讨论的话题。这随后驱动了他们向你推广的内容。

    '
