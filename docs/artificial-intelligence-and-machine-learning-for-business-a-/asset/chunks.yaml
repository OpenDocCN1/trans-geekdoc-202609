    决定把钱借给谁比国际象棋要简单得多，而且通常有大量的标记开发数据可用。因此，对于像信用风险评估这类问题，使用监督学习方法会更快地获得更好的结果。同样的问题也适用于任何无法快速衡量成功与否。如果我们回到国际象棋的例子，DeepMind
    的象棋程序需要对弈 6800 万局才能达到现在的水平。它只能通过与另一台计算机对弈来实现这一点，让比赛在几分之一秒内完成。如果它是在现实世界中与人类对手对战，就不可能在合理的时间取得相同的结果。训练过程将太缓慢了。


    强化学习的另一个弱点是训练过程中失败的成本。如果你将强化学习算法嵌入到你组织的招聘政策中，那么你最初会招到大量糟糕的员工，这将导致各种问题。类似地，你也不希望将强化学习算法直接连接到客运客飞机的控制系统上。


    好了，寻找虚拟山峰的顶和在国际象棋中达到超人类水平固然很好，但强化学习在现实世界中的业务应用是什么？坦率地说，目前数量并不多。就个人而言，我从未参与过使用该技术的解决方案交付，我也不认识任何这样做的人。我也做过很多研究，发现了许多非常有趣的学术论文和充满热情的媒体文章，但现实世界的案例要少得得多。我的结论是，目前使用的基于强化学习的解决方案与监督学习相比，数量是微不足道的。如果我必须给出一个数字，我估计超过
    95% 的现实世界应用利用监督学习，而剩下的 5% 大部分是基于聚类的无监督方法。然而，随着技术的成熟，这种情况可能会发生变化。直觉上来说，如果你有算法可以构建出比任何活人都更好的国际象棋或围棋的程序，那么它们在其他领域也具有潜力。


    强化学习看起来正在产生影响的一个领域，是提高不确定或混沌环境中复杂控制系统的效率。像电网、供暖系统和服务器农等复杂系统，拥有许多用于管理系统不同部分的控制装置。控制装置与系统性能之间的关系并不总是显而易见的。这并不是一个控制影响一件事的简单案例——万物都是互相关联的。调整电厂冷却系统水压以提高涡轮性能，会对下游变压器的效率产生负面影响。就像国际象棋问题中存在几乎无限可能的对局一样，在发电厂中，控制设置的组合也几乎是无限。强化学习通过试错寻找更好的控制设置方法，以优化系统的整体效率。这反映了经验丰富的工程师如何利用多年实践积累的知识和直觉，来判断调整不同控制装置对系统范围可能产生的影响。


    强化学习另一个展现前景的领域是机器人技术。这是为了训练机器人去执行以前只能由经过培训的人员完成的复杂手动任务。机器人被赋予诸如翻转汉堡、分类物品或堆叠架子之类的任务，通过试错，它们可能会学会非常有效地完成这些任务。


    ## 10. 如何构建预测模型


    在本章中，我们将从小钥匙孔窥向另一侧……我们将从日常的理智理性的世界跨越边界，进入数据科学家那扭扭曲的多维领域；即那些拥有数学学位和博士学位的技术专家。在我们的旅程中，我们将：


    1. 描述数据科学家在应用机器学习开发预测模型时应该遵循的流程，这些模型随后将作为自动化决策系统的一部分使用。

    2. 以普通人能理解的方式解释这一过程。这是为了帮助你掌握数据科学家正在做什么。这反过来将确保你得到的是你所要求的，而不是数据科学家认为你的组织需要的。


    正如我们在书开头讨论的那样，倾向于成功的 AI/机器学习项目是那些业务用户和数据科学家手手合作的项目。在我的经验中，当数据科学家被留下来“自己去做”，并在项目结束时作为致命一击来交付结果时，交付的往往是次优解决方案。在最坏的情况下，他们可能无法交付任何有用的东西。


    我合作过的绝大多数数据科学家都意识到让客户参与机器学习过程的必要性，并为项目获取业务投入而努力。然而，遗憾的是，我也看到过不止一个数据科学家故意试图用技术术语混淆普通人，或完全避免与他们交流的案例。这样他们就可以专注于处理所有重要的数学内容，而无需对付那些每天必须运行组织的、糟糕的业务人员。在尝试判断一个数据科学家是否在履行职责时，一个可以遵循的简单规则是：


    如果他们不能用简单的英语向你解释他们正在做什么以及为什么要这样做，那么他们没有完成任务。


    数据科学家还需要让业务部门明确了解他们工作对现实世界的影响。作为一名业务用户，我对预测模型准确率达到 95% 并不感兴趣，也不在乎它比要取代的过程多出 10%
    的歧视性。我想知道的是：这个模型将给我带来多少钱，将救多少命，我将少雇佣多少员工，或者任何会影响我业务目标的因素。如果一个数据科学家不能根据为客户提供的底部效益来表达解决方案的优点，那就是一个糟糕的数据科学家。


    然而，这是双向的。把所有责任推在数据科学家身上是不公平的。让业务用户努力基础了解数据科学家如何进行机器学习过程并不是不合理的要求。随着项目的进行，应该有双向的信息交换和定期会议，以非技术性的、以业务为中心的方式展示并讨论初步发现和结果、问题和困难。这将引导项目的推进。


    '
