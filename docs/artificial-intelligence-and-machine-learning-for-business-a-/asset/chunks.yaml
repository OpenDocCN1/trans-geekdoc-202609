    ## Ensemble Models and Decision Making


    1. If one of the experts has specialist knowledge, that the others don’t have,
    then this can be brought into the decision-making process.

    2. Some of the experts may, on occasion, make poor decisions. The other experts
    will use their collective knowledge to override (out vote) those cases.


    Just like the committee, some of the models that form an ensemble will be particularly
    good at predicting the outcome of certain types of cases. If any of the models
    are weak in certain areas (generate poor predictions) then these are overridden
    by the others.


    Once constructed, the way an ensemble works is pretty straightforward. The score
    from each model is used to make a decision. A final decision is then made by simple
    majority vote. If we return to the heart disease scorecard model discussed earlier,
    then imagine that instead of a single scorecard, a thousand different scorecards
    are constructed. The original decision rule was to invite someone for a check-up
    if they scored 521 or more. With the ensemble, if at least 501 of the individual
    models generate a score of `521` or more, then the decision is to invite.


    How much better are ensembles than single models? Sometimes none! However, in
    my experience, it’s not unusual for an ensemble to be around 5-10% better than
    a single model. If an insurance company found that using a decision tree resulted
    in a `$40m` reduction in claims over their previous manual process for the same
    amount of underwriting, then moving to an ensemble approach could reasonably be
    expected to provide an additional `$2-4m` benefit.


    If all you are interested in is raw predictive accuracy, then ensembles are the
    way to go. If however, it’s important for you to be able to explain how a model
    arrives at a given prediction, then you may want to think twice before going down
    the ensemble route because the solution will be much more complex and more difficult
    to understand than a single model approach.


    ## The Importance of Data


    Let’s now move on to think about data. From reading the academic literature on
    machine learning, I would hazard a guess that 95% or more of it is about algorithms;
    i.e very technical discussions about the cutting edge mathematical approaches
    that can squeeze a little bit more predictive accuracy from a given data set.
    In practice however, when it comes to improving the accuracy of predictive models,
    data is king.


    Given a choice between a new algorithm for building a predictive model and having
    more/better data available, then data wins every time. To put it another way,
    very simple predictive models built using a large amount of high quality data
    almost always outperform more advanced approaches built using a smaller amount
    of lower quality data. If you really want to get more out of your predictive models,
    then improving the quality of the data used to build them and seeking out new
    and better data sources, should come at the top of your priority list.


    In the early days of Big Data, when the cost of data storage fell very dramatically
    in a short period of time, there was very much a “store and analyze it all” data
    philosophy amongst the pioneers. The message was that every organization should
    be gathering and analyzing all the data it could. Back then, there was a lot of
    talk about needing to invest in mass storage systems such as `Hadoop`. This was
    to allow organizations to store all the data that they could lay their hands on
    in order to be able to produce the best predictive models possible and hence,
    gain a competitive advantage. However, the amount of data being generated has
    continued to increase year on year and shows no signs of slowing down. In fact,
    the volume of data is increasing at a far faster rate than the cost of data storage
    is falling.


    This means that the benefit of having all available data to hand is to some extent
    offset by the costs of storing and analyzing all that data. As discussed previously,
    only a small fraction of all the data out there actually features in predictive
    models and is used to make predictions; i.e once you know what types of data are
    predictive of how people are going to behave then you can discard most of the
    other data because you don’t need it. Continuing to maintain huge databases of
    “low value” data is not a very efficient use of time and resource.


    These days there are moves towards common data storage and aggregation – particularly
    when it comes to externally sourced data and data that is common across organizations.
    If people have ten apps on their phone supplied by ten different organizations,
    then it’s very wasteful for each of those organizations to be gathering location
    and movement data themselves. It makes far more sense for one organization to
    manage the data, and then provide clients with the specific data items that are
    relevant to them.


    If you look at companies such as `Facebook`, `Google`, `Experian`, `Equifax` and
    so forth, then this is exactly what they are doing. They undertake the hard work
    of collecting, formatting, preparing and summarizing data. They then package the
    useful bits and sell it on. In this way, individual organizations only acquire
    data that is genuinely useful to them. Consequently, they don’t need to waste
    time and resources gathering huge amounts of data that they don’t need.


    ## IT Systems and Software Development


    The third driver of developments in machine learning is IT systems and software.
    As the volume of personal data has grown, and the frequency with which data changes
    has increased, so cycle times between model developments has reduced in many industries.


    The traditional paradigm for developing and implementing predictive models is
    to separate these two parts of the process; i.e develop your models first and
    then implement them. During the development phase a data scientist spends days,
    weeks or even months gathering data and carrying out the statistical analysis
    required to build the model. When that part of the process is complete there is
    a further exercise to code up the model within the production environment, test
    that the model works and then for it to be put into live operational use.


    In many (and possibly most) industries this approach to predictive models is still
    applied and generally works pretty well, not least because after a model has been
    developed it has to pass internal and external audit, and then be subject to regulatory
    review before it can be put into use. Regardless of what the law says, having
    a robust model governance structure in place is important. This is because if
    your entire business relies on the correct decisions being made, and you get it
    wrong, then the impact on the bottom line can be very considerable indeed.


    For the risk models used in banking and insurance to determine how much capital
    they need to hold in reserve^([71]](#filepos436737)), it can take a year or more
    between a predictive modelling project commencing and a model being implemented
    within the business. Every aspect of the model has to be fully documented and
    then a cycle of discussion, feedback and further analysis needs to occur before
    the regulator signs off the model as fit for use. Banking regulators won’t even
    deem to review a predictive model until it has undergone a complete review by
    independent experts. This can take as long or longer than the initial model building
    process.


    In other areas however, such as internet marketing, things move much faster. Data,
    and the relationships in that data, are changing frequently, some of it in real
    time. If an wants to retain a competitive edge then it needs a much more rapid
    cycle of model development and implementation. Models are rebuilt on a daily or
    more frequent basis in response to constant changes in the data. This has led
    to the development of IT systems that closely integrate the data an organization
    holds, the analytical tools used to create predictive models and the systems that
    deploy them.

