  fmt: '

    # Implementation


    The third item in the checklist, after problem definition and culture, is implementation.
    As discussed earlier, machine learning is all about making faster, better and
    cheaper decisions. Predictive models can be implemented manually in a spreadsheet
    and scores can even be calculated using a pen and paper, but in most cases predictive
    models are embedded within an automated decision-making system. The system uses
    the model to make predictions about how people will behave, and then takes decisions
    about how to treat people based on those predictions; e.g. the decision to grant
    a loan if the score is high enough.


    By automating the decision-making process, individually tailored strategies for
    dealing with millions of people can be enacted in just a few seconds. What this
    means in practice is that organizations can update their predictions about people
    on a very frequent basis: monthly, daily, or even in real time, whenever a new
    piece of information about an individual is obtained.


    Far more predictive models get developed than are ever implemented operationally.
    I’ve lost count of the number of organizations I’ve worked with where everyone
    gets really excited about the model building process but then neglects to think
    about how they are going to put the model to use once it’s been built. Unless
    the infrastructure for using predictive models is already well established, the
    implementation of a predictive model is often a lengthier and more time consuming
    process than getting the model built in the first place. The most popular software
    packages for machine learning (`R` and `Python`) won’t automatically deploy the
    models into an operational system for you. Model implementation needs to be considered,
    a budget approved and planning begun long before the data scientists are let loose
    to start gathering data and building models.


    ## Implementation Approaches


    Generally, there are two ways that organizations implement models.


    ### 1. IT Project Approach

    The first approach is to treat implementation as an IT project. A programmer is
    employed to “code up” the model within an organization’s IT system so that the
    required scores and decision rules are calculated when and where they are needed.
    This is a common approach, but it’s amazing how often models are incorrectly coded
    due to simple errors – such as giving someone 100 points instead of 10, or plus
    15 points instead of minus 15 points in a scorecard. There are also prioritization
    issues to contend with. It’s not unusual for model implementation to take months
    or even years, due to other tasks taking priority. It’s also the case that following
    model implementation, trying to get changes to a model or the associated decision
    rules is a nightmare. This is because every change has to go back into the IT
    work queue for prioritization.


    ### 2. Specialist Software Approach

    The second approach to model implementation is via specialist software that provides
    an interface between the machine learning software used to build the model and
    the operational environment where the model is going to be deployed. When the
    model is complete the data scientist simply hits the “upload” button in the software,
    which then deploys the model (and associated decision rules) to the operational
    environment.


    The main benefit of this approach is that, in theory, models can be implemented
    almost as soon as they are built. Importantly, it’s the data scientists and business
    users who control the implementation of the model and associated cut-off (decision)
    rules. Little or no input is required from the IT department. This avoids lengthy
    delays that might otherwise arise if model implementation were to be placed in
    the IT work queue.


    ## Data


    The penultimate consideration before the analytics process can begin is data.
    Data is the primary ingredient in the analytics process. It’s essential. Without
    data, and the right type of data, useful models cannot be constructed or deployed.
    Therefore, before any thought is given to running machine learning algorithms
    to build a predictive model, due consideration needs to be given to the data that
    is going to be used. In particular:


    *   **Development sample data**: As discussed in Chapter 5, a reasonably sized
    sample of data is required. This sample needs to include both historic observation
    data and more recent outcome data.

    *   **Operational availability**: Any data that features in the resulting model
    must be available when the model comes to be implemented.

    *   **Operational stability**: If the relationships in the data change, then a
    model based on that data will lose some of its predictive ability. Therefore,
    a new model will be required.


    It’s important to remember that the development sample used to build a predictive
    model is historic, but the predictive model that results is going to be deployed
    in the future. In the months or years since the development sample data was recorded
    there may have been significant changes to the way the organization gathers and
    stores data. If certain data items are not going to be available going forward,
    then those data items should not be used to build the model. This is because it
    will not be possible to put the model into production. The data needed by the
    model simply won’t be available.


    It may be that in the past net income was obtained from customers and this is
    what is contained in the development sample data. However, because net income
    is sometimes difficult for customers to remember, the marketing department decided
    that it would be more customer friendly to switch to capturing gross income instead.
    If a predictive model was built using net income, it would not be possible to
    implement the model correctly because net income would no longer be available
    following the change to the way income is captured.


    ## Analytical Process


    Once the problem has been specified, and cultural, implementation and data issues
    have been addressed, then one can start to think about the analytical process
    of building the model. This is where the specialist skills of a data scientist
    come into their own.


    When it comes to the technical aspects of building a predictive model, a data
    scientist needs to consider a range of issues, as discussed in the previous chapter.
    Generating the most predictive model possible is obviously one concern, but the
    complexity, explicability and transparency of the resulting solution also need
    to be considered in light of organizational and regulatory requirements.


    If we take banking as a case in point, the predictive models used to generate
    estimates of the capital that banks must hold in reserve are subject to extreme
    scrutiny by financial regulators. The model builder must fully describe the analytical
    process that was applied to construct the model, explain exactly how the model
    generates its predictions, and then highlight any material weaknesses that the
    model may have. “Black box” solutions that simply spit out very accurate, but
    inexplicable predictions will not pass muster. Likewise, in areas such as tax
    collection, medical diagnosis and criminal investigation, subject matter experts
    often favor models that they can understand.


    However, if we shift the emphasis to models that are used in target marketing,
    those used to select matches on dating sites, or form part of a language translation
    system, then the user has far less interest in understanding the underlying model
    logic. Predictive accuracy is the overriding consideration. If it works it works,
    and that’s all that matters.


    Before choosing which type of model to develop and what algorithm to apply, a
    data scientist should have consulted with the business. They should have asked
    the right questions to make sure they deliver a model that is predictive, conforms
    to regulatory requirements and takes into account any other issues or constraints
    that the business has highlighted.

    '
  trans: '


    # 实现


    清单上的第三项（在问题定义和文化之后）是实现。正如之前讨论的，机器学习的核心在于做出更快速、更好且更廉价的决策。预测模型可以在电子表格中手动实现，甚至可以用笔和纸来计算分值，但在大多数情况下，预测模型被嵌入到自动化决策系统中。该系统使用模型对人们的未来行为做出预测，然后根据这些预测做出如何处理这些人员的决策；例如，如果分数足够，则决定授予贷款。


    通过将决策过程自动化，可以在几秒钟内针对数百万人实施个性化的策略。这在实践中意味着，机构可以非常频繁地更新他们对人员的预测：每月、每天，甚至是实时——只要获取了关于某个个人的新信息即可。


    实际开发的预测模型数量远多于实际投入运行的模型数量。我数不清共合作过的机构数量了，在这些地方，每个人对模型构建过程都非常兴奋，但随后忽略了考虑在模型完成后如何将其投入使用。除非使用预测模型的基础已经非常完善，否则预测模型的实现过程通常比构建模型本身要长得多、更耗时。最流行的机器学习软件包（`R`
    和 `Python`）不会自动为你将模型部署到运行系统中。在数据科学家被允许开始收集数据和构建模型之前，就需要考虑模型实现、批准预算并开始规划。


    ## 实现方法


    通常，机构实现模型的方法有两种方式。


    ### 1. IT 项目方法

    第一种方法是将实现视为一个 IT 项目。聘请程序员在机构的 IT 系统内对模型进行“编码”，以便在需要的时间和地点计算所需的分值和决策规则。这是一种常用方法，但令人惊讶的是，模型经常因为简单的错误而编码错误——例如，在评分表中给某人打
    100 分而不是 10 分，或者在评分表中加 15 分而不是减 15 分。此外还有优先级问题需要处理。由于其他任务优先级更高，模型实现耗时几个月甚至几年的情况并不罕见。而且，在模型实现后，尝试更改模型或相关的决策规则将是一场噩梦。因为每一个更改都必须返回
    IT 工作队列中进行优先级排序。


    ### 2. 专业软件方法

    模型实现的第二种方法是通过专业软件，这种软件在用于构建模型的机器学习软件与将要部署模型的运行环境之间提供了一个接口。当模型完成后，数据科学家只需点击软件中的“上传”按钮，软件就会将模型（以及相关的决策规则）部署到运行环境中。


    这种方法的主要优势是，从理论上讲，模型可以在构建后几乎立即实现。重要的是，是数据科学家和业务用户控制模型的实现以及相关的阈值（决策）规则。IT 部门几乎或完全不需要投入。这避免了如果模型实现被置于
    IT 工作队列中可能会出现的长时间延迟。


    ## 数据


    在分析过程开始之前的倒数第二个考量因素是数据。数据是分析过程的首要原料。它是至关重要的。没有数据，或者没有类型的数据，就无法构建或部署有效的模型。因此，在考虑运行机器学习算法来构建预测模型之前，需要对将要使用的数据进行充分考虑。特别是：


    *   **开发样本数据**：如第 5 章所述，需要一个规模合理的数据样本。该样本需要同时包含历史观测数据和较近的结果数据。

    *   **运行可用性**：出现在结果模型中的任何数据在模型实现时必须是可用的。

    *   **运行稳定性**：如果数据中的关系发生变化，那么基于该数据的模型将失去部分预测能力。因此，将需要一个新模型。


    必须记住，用于构建预测模型的开发样本是历史数据，但产生的预测模型将部署在未来。在记录开发样本数据后的几个月或几年里，机构收集和存储数据的方式可能发生了重大变化。如果未来某些数据项将不可用，那么就不应该使用这些数据项来构建模型。因为模型将无法投入生产。模型所需的数据将无法可用。


    过去可能从客户处获得净收入，而这正是开发样本数据中的内容。然而，由于客户有时很难记住净收入，营销部门决定切换为捕获总收入对客户更友好。如果使用净收入构建预测模型，那么将无法正确实现该模型，因为在收入捕获方式改变后，净收入将不再可用。


    ## 分析过程


    一旦确定了问题，并解决了文化、实现和数据问题，就可以开始考虑构建模型的分析过程了。这正是数据科学家的专业技能大显身手的地方。


    在涉及构建预测模型的技术方面，数据科学家需要考虑一系列问题，如前一章所述。生成尽可能具有预测性的模型显然是关注点之一，但根据组织和监管要求，还需要考虑最终解决方案的复杂性、可解释性和透明度。以银行业为例，用于生成银行必须留存资本估计的预测模型受到金融监管机构的极端审查。模型构建者必须充分描述用于构建模型的分析过程，精确解释模型如何生成预测结果，然后强调模型可能存在的任何实质性缺陷。仅仅输出非常准确但无法解释的预测的“黑箱”解决方案是无法通过审核的。同样，在税收、医疗诊断和刑事调查等领域，领域专家通常倾向于他们能够理解的模型。


    然而，如果我们重点转移到用于目标营销、用于约会网站选择匹配或构成语言翻译系统的模型上，那么用户对理解底层模型逻辑的兴趣要小得多。预测准确性是首要考虑因素。如果它有效，就有效，这就是全部了。


    在选择开发哪种模型以及应用什么算法之前，数据科学家应该已经咨询业务部门。他们应该提出正确的问题，以确保交付的模型具有预测性、符合监管要求，并考虑了业务部门提出的任何其他问题或限制。


