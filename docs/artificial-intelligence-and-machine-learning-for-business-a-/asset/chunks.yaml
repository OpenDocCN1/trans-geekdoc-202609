    representation of the data; i.e. a different representation will make it easier
    for the machine learning process to find the important patterns in the data. There
    are four main tasks that occur during data preparation:


    1.  **Creation of new data.** Age is more predictive than Date of Birth for most
    types of problem. Therefore, age may need to be calculated if only Date of Birth
    is available. If you have data about credit card transactions, it’s best to create
    summary variables representing average spend per transaction, number of transactions
    last month, time since last transaction and so on.


    2.  **Data cleaning.** Data may be missing or incorrect. A key purpose of data
    preparation is to identify where this type of data exists, and to either remove
    it (an exclusion) or reformat it; i.e. recode all incorrect/missing data with
    a standard value. If dates of birth used to calculate age are in the future or
    impossibly far in the past, you may want to define a default value of say ‘-1’
    for age, to represent these cases.


    3.  **Consolidation.** It’s good practice to represent similar data in a similar
