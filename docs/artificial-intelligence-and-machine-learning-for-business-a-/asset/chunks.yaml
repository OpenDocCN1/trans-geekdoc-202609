  trans: "\n图 2 中的评分卡模型预测了个人在未来 5 年内患上心脏病的概率。但模型生成的个人得分是如何转化为概率的呢？建立得分与概率之间关系的一种方法是生成如图\
    \ 3 所示的“得分分布”表。\n\n为了制作图 3，针对另外 500,000 个人收集了一个全新的数据样本，即验证样本（其中 30,000 人在未来 5\
    \ 年内患了心脏病）。该验证样本与用于构建模型的样本完全独立。(20)。因此，它能够代表性地展示当模型被应用于新人员（这些人员的细节未被用于构建模型）时，表现将会如何。(21)\n\
    \n![](img/00007.jpg) \n\n最左侧的两列包含得分范围，显示了每行报告的分数范围。第一行包含得分在 300 分或以下的所有人的详情，第二行包含得分在\
    \ 301 到 320 之间的人，依此类推。理想情况下，每个单独的得分应该有一个单独的行，但由于模型可以产生数百种不同的得分，为了方便起见，此示例中的得分被分成了每\
    \ 20 分一个范围。(22)\n\n图 3 中的其他列提供了关于每个得分范围内个人的信息。例如，有 56,606 个病例得分在 301 到 320 之间，占验证样本中病例的\
    \ 11.32%。其中，有 68 人随后患了心脏病。\n\n最右侧的一列显示了每个得分范围内患心脏病的人的百分比。这实际上是模型做出的预测。对于 301 –\
    \ 320 得分范围的人，模型的预测结果为 0.12%。换句话说，得分在 301 到 320 之间的任何人患上心脏病的概率大约为 833 分之一 1 (1/0.0012)。\n\
    \n### 评估个人风险\n\n要评估一个人未来患上心脏病的风险，所需要的是：\n\n* 使用图 2 中的评分卡计算其得分。\n* 在图 3 中找到其得分所属的行。\n\
    * 向右查看图 3 的最右侧列以获得预测结果。\n\n如果我们回到那个得 404 分的 45 岁女性的案例，她属于 401-420 得分范围。向右读取，得分在\
    \ 401 到 420 之间的人中随后患上心脏病的比例为 1.76%。也就是说，模型预测她在未来五年内患上心脏病的概率为 1.76%（57 分之一 1）(23)。\n\
    \n如果你手头有相关信息，为什么不尝试计算一下自己的得分，并对自己患上心脏病的风险得出一个预测呢？(24)\n\n### 模型准确性\n\n了解得分的含义是重要的，但下一个问题是：评分卡模型预测心脏病的效果如何？它的准确性如何？评估模型的一种方法是考虑最低分和最高分病例之间心脏病率的差异。得分\
    \ 300 分或以下的人中，只有 0.07% 在未来 5 年内患上心脏病。对于得分 561 分或以上的人，87.88% 患了该疾病。换句话说，得分最高的人患心脏病的概率是最低得分的人的\
    \ 1000 倍以上——这非常不错。\n\n另一种方法是将模型的性能与随机选择策略进行比较；即，如果你随机选择人员进行检查，那么只有 6% 的这些人会患上心脏病，而得分最高组（561\
    \ - 999）的表现比这好出 15 倍 (87.88 / 6)。\n\n附录 A 详细解释了数据科学家评估预测模型预测行为能力时常用的指标。\n\n###\
    \ 6. 使用预测模型做出决策](#index_split_004.html#filepos4264)\n\n到目前为止，我们：\n\n* 有了一个预测模型（上一章节中图\
    \ 2 中的评分卡）。模型生成的得分表明个人患上心脏病的可能性。\n* 了解得分的含义。\n* 知道给定得分下患心脏病的概率（来自图 3 提供的信息）。\n\
    * 了解了评分卡在识别心脏病患者方面比随机选择策略好多少。\n* 了解人群在可能得分范围内的分布（来自图 3 中得分分布表提供的信息）。\n\n这些都很好，但这些信息中都没有告诉我们该怎么做。\n\
    \n"
