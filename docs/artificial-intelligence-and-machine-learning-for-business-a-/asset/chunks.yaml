- raw: 'Operational Database Management Systems. [http://www.odbms.org/](http://www.odbms.org/)
    This site is supported by a range of industry experts. It covers a wide range
    of topics relating to the implementation and application of new technologies associated
    with machine learning, cloud computing and Big Data, amongst other things.


    KDnuggets. [https://www.kdnuggets.com/](https://www.kdnuggets.com/) This is one
    of the leading sites providing resources for data scientists.


    AnalyticBridge. [http://www.analyticbridge.com/](http://www.analyticbridge.com/)
    AnalyticBridge hosts a range of articles, blogs and discussion forums about machine
    learning that is open to all. There is a broad range of topics covered, from the
    strategic to the very technical / operational.


    LinkedIn. [http://www.linkedin.com/](http://www.linkedin.com/) There are several
    forums on LinkedIn that discuss machine learning and related topics.


    Kaggle. [https://www.kaggle.com/](https://www.kaggle.com/). Kaggle describes itself
    as “The home of Data Science and Machine Learning.” It provides various resources
    for data scientists but is perhaps best known for hosting machine learning / AI
    competitions. Many of these have substantial dollar prizes for the winners. Kaggle
    competitions are open to anyone. All you need to do is download the data for a
    given competition and then upload your results. These are automatically assessed
    within a few seconds and your score is entered onto the competition leader board
    so that you can see how you rank. A great feature of Kaggle competitions is that
    you can enter as many times as you like, allowing you to try out lots of different
    solutions.


    StatSoft. [http://www.statsoft.com/Textbook](http://www.statsoft.com/Textbook).
    This is a website managed by Dell, providers of the STATISTICA statistical software
    package. If you want to know more about a wide range of statistical methods, including
    those used in machine learning, then this is a great site to refer to.


    The following is a list of books that are suitable for the general reader; i.e.
    no formulas or tech speak.


    Agrawal, A., Gans, J. and Goldfarb, A. (2018). Prediction Machines: The Simple
    Economics of Artificial Intelligence. Harvard Business Review Press. The three
    authors are economists rather than technical experts. They discuss AI from an
    economics perspective. In particular, they present the case for AI as a more efficient
    way to predict those things that are important to business, both strategically
    and operationally.


    Davenport, T. and Kim, J. (2013). Keeping Up with the Quants: Your Guide to Understanding
    and Using Analytics. Harvard Business Review Press. Davenport was one of the first
    people to write an accessible analytics text in his 2006 book – Competing on Analytics.
    This more recent book is written specifically for non-technical managers to help
    them understand and work with technically minded people who do machine learning;
    i.e. data scientists.


    Finlay, S. (2014). Predictive Analytics, Data Mining and Big Data. Myths, Misconceptions
    and Methods. Palgrave Macmillan. This is one of my books, so I’m bound to say
    nice things about it. Primarily it’s a book about machine learning, but it also
    provides a brief introduction to Big Data. The main focus is on practical issues
    around the development and implementation of predictive models.


    Information Commissioner’s Office (2017). Big data, artificial intelligence, machine
    learning and data protection. ICO. This document is a detailed discussion paper
    produced by the UK government. It examines the implications for Big Data, machine
    learning and artificial intelligence from a data protection perspective. It provides
    a very comprehensive view of the issues that need to be considered when dealing
    with these new technologies, particularly in relation to the General Data Protection
    Regulation (GDPR) that applies in all EU countries.


    Kahneman, D. (2012). Thinking, Fast and Slow. Penguin. This is a book about decision-making.
    It digs into the reasons why people make decisions in the way that they do. In
    particular, it discusses why people often have trouble accepting automated decision-making
    systems based on machine learning. However, the book is much broader than this.
    It discusses a wide range of issues associated with human decision-making processes.


    O’Neil, C. (2016). Weapons of Math Destruction. How Big Data Increases Inequality
    and Threatens Democracy. Allen Lane. This fascinating book presents the “Dark
    side” of predictive models, discussing the bias and discrimination that can be
    brought to bear through their use and misuse. Very much complementary to the material
    in Chapter 13 of this book.


    Siegel, E. (2016). Predictive Analytics: the Power to Predict Who Will Click,
    Buy, Lie, or Die. 2^(nd) edition. Wiley. Very much a marmite book. You’ll either
    love it or hate it, but it’s the book that brought machine learning to the attention
    of a much wider audience than ever before. I like marmite!


    Silver, N. (2012). The Signal and the Noise: Why So Many Predictions Fail. Penguin.
    This is not really a machine learning book. However, what is very relevant is
    the focus on understanding why so many forecasting systems fail. It discusses
    why more attention needs to focus on the weaknesses and pitfalls of forecasting
    and prediction, so as to improve the quality of forecasting models in the future.


    If you want to tool up and get a bit more into the technical aspects of AI and
    machine learning, then I recommend the following:


    Baesens, B. (2014). Analytics in a Big Data World: The Essential Guide to Data
    Science and its Applications. Wiley. This book provides clear descriptions of
    all the key stages involved in developing a predictive model. A great read for
    those with a little bit of mathematical and/or statistical knowledge, but you
    don’t need a higher degree in mathematics or statistics to understand the concepts
    that Baesens puts forward.


    Chollet, F. (2018) Deep Learning with Python. Manning Publications. This well-structured
    book starts with an introduction as to what artificial intelligence and machine
    learning are. It then covers off the theory underpinning machine learning before
    providing coding examples in Python.


    Crawley, M. (2012). The R Book. 2^(nd) Edition. Wiley. There are lots of statistical
    packages that can be used to do machine learning. However, R is one of the most
    popular. R is open source and can be downloaded for free from the CRAN website
    [http://cran.r-project.org/](http://cran.r-project.org/) If you already have some
    programming knowledge then this book provides a comprehensive introduction to
    the R language. Note that the emphasis of the book is on learning R, rather than
    machine learning.


    Easley, D. and Kleinberg, J. (2010). Networks, Crowds, and Markets: Reasoning
    About a Highly Connected World. Cambridge University Press. I’ve not discussed
    social network analysis in the main part of the text, but social networks are
    a very important source of data for many types of machine learning models. Companies
    like Facebook, Google and LinkedIn apply machine learning to the data they hold
    to drive their advertising and target marketing activities. This book provides
    a blend of practical and theoretical material about the application of social
    network analysis in a number of environments.


    Goodfellow, I, Bengio, Y. and Courville A. (2016). Deep Learning (Adaptive Computation
    and machine learning Series). MIT Press. At almost 800 pages in length, reviewers
    have described this as the “Bible” of AI and machine learning. You probably need
    to be comfortable dealing with mathematics and statistics to get the most out
    of this book.'
