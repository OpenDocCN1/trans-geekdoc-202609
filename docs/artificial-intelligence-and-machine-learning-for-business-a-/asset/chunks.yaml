    ### 主成分分析 (PCA)。PCA 是一种常用的降维方法。PCA 使用原始变量集来构建一组新的、更小的变量集，这些变量随后会被机器学习过程中。PCA 的工作前提是许多变量在某种程度上是相互相关的；即包含某些相同的信息。因此，使用较少的变量可以更有效地捕获这些信息。


    ### 像分析 (Profiling)。根据《通用数据保护条例》(GDPR) 的定义，画像分析是指：“对个人数据进行任何形式的自动化处理，其包括使用个人数据来评估与自然人的某些个人方面，特别是分析或预测有关该自然人的工作表现、经济状况、健康、个人偏好、兴趣、可靠性、行为、位置或移动等方面。”画像分析可能或不构成自动化决策过程的一部分。


    ### Python。与 R 语言一样，Python 是机器学习领域最流行的、免费提供的软件包之一。


    ### R。R 语言是开展机器学习最流行的软件平台之一。R 软件是免费且开源的，用户社区可以开发新功能并与其他用户共享。对于想要成为数据科学家的人，建议在
    R（和/或 Python）方面有坚实的基础。附录 B 中讨论了一些关于 R 和 Python 的书籍。


    ### 随机森林。随机森林是一种集成方法，基于结合许多决策树的输出。每棵决策树都是在略有不同的条件下创建的，因此会生成不同的评分。随机森林是最成功且应用广泛的集成方法之一。


    ### 循环神经网络。一种神经网络，它将开发样本中之前案例的输出作为后续训练的输入。当数据中存在序列模式时，这类网络特别有用；即开发样本中案例的顺序非常重要。一个例子是视频分析。从一张图像到下一张图像的状态变化（即物体的移动）可以提供关于当前图像性质的大量信息。


    ### 回归模型。一种预测事物大小的常用工具。例如，某人将花费多少钱或活多久。这与预测事件发生概率的分类模型形成对比。


    ### 强化学习。根据采取行动产生的某种成功或奖励衡量，逐案精炼模型中权重的过程。模型每次产生结果时，都会对该结果的质量进行评估。然后，训练算法根据其表现调整模型权重。强化学习被认为比其他类型的机器学习（如监督学习）更接近人类的学习方式。


    ### 响应（选择）建模。该术语指的是用于营销模型，用于预测某人购买其目标投放的产品或服务的概率。响应模型是一种分类模型。


    ### 得分 (Score)。预测模型生成的大多数预测以单个数字（评分）的形式表示。对于分类模型，评分是事件发生概率的表示，例如某人响应营销沟通的可能性，或他们违约贷款的概率。对于回归模型，评分代表预测行为的大小，例如，某人可能花费多少钱，或他们可能活多久。


    ### 评分卡 (Scorecard)。评分卡是一种展示线性模型的方法，易于非专家理解。评分卡的主要优点是它是可加的；即模型评分通过简单累加适用分数计算得出。没有乘法、除法或其他更复杂的算术运算。


    ### 评分分布。显示预测模型的评分在目标群体中分布情况的表格或图表。提升图和增益图都是以以表化形式展示评分分布的方法。


    ### 情感分析。这是一种提取人们对事物态度信息的流行技术。例如，他们在使用特定产品或服务时是否有正面或负面的体验。在机器学习中，情感分析被用于从文本或语音中提取信息，然后用于构建预测模型或得出聚类。


    ### 监督学习。机器学习的应用，其中开发样本中的每个案例都有一个想要预测的关联结果。这些案例被称为“已标记”的。目标营销中监督学习的一个例子是，每个客户对营销活动的响应是已知的（他们要么响应了，要么没有）。算法生成的模型将进行优化，以预测客户是否会响应营销。在实践中，大多数机器学习方法都是监督学习的示例。


    ### 支持向量机。一种先进的非线性模型。支持向量机与神经网络有某些相似之处。


    ### TensorFlow。一种用于 Python 编程语言的机器学习算法开源库。TensorFlow 最初由 Google 开发。TensorFlow
    的一个关键特性是它利用高端显卡的处理能力，显著提高了复杂机器学习模型（特别是深度神经网络）的开发速度。


    ### 训练算法。用于描述用于确定预测模型结构的迭代机器学习算法的术语。该术语在神经网络类型模型中用得最广泛。算法重复多次，调整网络中的权重以优化网络性能。训练算法在固定次数的迭代后停止，或当无法获得模型性能的进一步显著改进时停止。


    ### 无监督学习。机器学习在开发样本不包含结果数据的问题上的应用。案例被称为“未标记”的。无监督算法通常寻求将具有相似特征（属性）的案例归类。无监督学习的一个例子是组织想要为一种昂贵的奢侈品制定广告投放政策，而没有任何关于客户购买历史的信息。聚类分析被用于根据年龄、收入、性别等将相似的客户归为一类。然后，将广告投放策略针对平均收入较高的聚类组中的个人，而不是低收入的聚类组。


    ### 验证样本 (Validation sample)。一个独立的数据集，用于在构建预测模型后对其进行评估。验证样本应与开发样本完全分离，并且不应在模型构建期间使用。使用一个（或多个）验证样本很重要，因为机器学习有时会将模型过拟合到开发样本。这意味着如果你使用开发样本来评估预测模型，它看起来可能比实际上更有预测性。


    ## 附录 D. 业务成功的清单


    在本附录中，我们将关注您应该回答的问题，以确保您的机器学习项目是成功的，并使它们为业务流程带来的收益最大化。当我说业务流程时，我主要指的是替换或补充员工通常可能执行的决策任务。


    '
