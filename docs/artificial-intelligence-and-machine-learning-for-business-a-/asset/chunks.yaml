- raw: "With this in mind, I’m going to avoid going into the mathematics of various\
    \ algorithms used for machine learning such as those used to train neural networks\
    \ or decide how the splits in decision trees are assigned. For those of you who\
    \ are interested in the technical details, the most common algorithms used for\
    \ machine learning are all pretty well documented (see Appendix B for some recommended\
    \ books and internet sites). Likewise, the implementation of these algorithms\
    \ are available in commercial statistics packages that you can buy or are freely\
    \ available via open source software (e.g. R and Python code libraries). You don’t\
    \ need to know how to code up specific machine learning algorithms; you just need\
    \ to know how to call the relevant function or procedure in your chosen software\
    \ package.\n\nFigure 12 outlines the key steps in the machine learning process\
    \ to develop a predictive model.\n\n![](images/00005.jpg)\n\nThe first thing the\
    \ data scientist needs to do is to quantify the business problem (Step 1); i.e.\
    \ to represent what the business is trying to achieve as a simple number or score.\
    \ The sales director of a retail store may start a conversation with a data scientist\
    \ with a statement such as:\n\n> > “We want a predictive model to identify our\
    \ best customers.” \n\nSo the first question to ask is:\n\n> > “What do you mean\
    \ by best?” \n\nTo which the sales director responds:\n\n> > “Those customers\
    \ who will make the biggest financial contribution to our business.” \n\nOK, that\
    \ seems reasonable, but does “financial contribution” relate to gross sales or\
    \ net profit? Are we talking about contribution per store visit, per click, or\
    \ per unit time (week/month/year)? Are we looking at individual or household contribution\
    \ when we talk about “customers”? and the list goes on. A data scientist needs\
    \ to tease out a precise definition of what the business wants, and then express\
    \ this in a way that can be represented by the scores generated by the model that\
    \ they build.\n\nIn this example, it may be that after some discussion with the\
    \ marketing director it’s agreed that the model will be designed to predict the\
    \ total gross spend of individuals per quarter year. Quarterly gross spend is\
    \ selected because it aligns with the organization’s reporting period and total\
    \ revenue (sum of spending) is the key performance indicator for the sales director.\n\
    \nIndividual rather than household spend is chosen because it’s agreed that although\
    \ household spend would theoretically be better, the organization’s customer databases\
    \ are structured at an individual not household level. It would not be possible\
    \ to deploy a model based on household spend with the organization’s current IT\
    \ infrastructure. Could the IT be upgraded to provide a household view? No, certainly\
    \ not as part of this project because the business has not allocated any budget\
    \ for IT changes this year.\n\nGiven this information, the data scientist should\
    \ determine that this is a regression type problem to predict the amount each\
    \ individual customer will spend over a three month forecast horizon.\n\nIn parallel\
    \ to determining how to express the business objective quantitatively, a data\
    \ scientist needs to undertake exploratory analysis to understand the organization’s\
    \ data and IT assets, how they work, and how they interact with each other and\
    \ the wider business. This includes:\n\n*   What databases does the organization\
    \ have?\n\n>   \n\n*   What is the purpose of each database and what business\
    \ processes make use of them?\n\n>   \n\n*   What do the databases contain? i.e.\
    \ what data items and the format of those data items. For example, if it’s numeric\
    \ or textual data.\n\n>   \n\n*   How is each database updated and maintained?\
    \ Most organizations have a mix of “real time” customer databases that are updated\
    \ as soon as something changes, and batch databases which are updated less frequently;\
    \ e.g. overnight or at month end.\n\n>   \n\n*   What decision-making systems\
    \ are already in place? Will the model be implemented within an existing system\
    \ or will new functionality be required?\n\n>   \n\n*   What data does the organization\
    \ currently use for decision-making purposes? Even if this data feeds an antiquated\
    \ manual process, it’s likely that this data will be extremely valuable for machine\
    \ learning purposes because the organization has already identified it as useful.\n\
    \nIn a perfect world, every organization would have comprehensive documentation\
    \ (metadata) that provides an inventory of its data assets. This is in terms of\
    \ the types of data it holds, how that data is formatted, where it comes from\
    \ and how it’s used. However, in practice this sort of information is often patchy,\
    \ incorrect or out of date. A lot of useful information is held in the heads of\
    \ business users, who use it on a regular basis as part of their day jobs. There\
    \ may be a data item called “Customer demographics 3” which contains letters A, B,…, G.\
    \ What on earth does that mean? It’s not documented anywhere, but Claire in Operations\
    \ knows that it matches the income grades they use. “A” means an annual income\
    \ of under $20,000, “B” $20-35,000 and so on.\n\nMany organizations also maintain\
    \ data that they no longer understand. Yet, they are afraid to purge it on the\
    \ off chance it’s something vital that a business-critical process relies upon.\
    \ Potential new data sources, both internal and external, should also be examined\
    \ during the exploratory analysis phase as these may enhance the predictive ability\
    \ of any models which are developed.\n\nOverall, a great deal of effort is required\
    \ to explore the universe from which data can be gathered and to decide what can\
    \ potentially be used and what cannot.\n\nOnce a data scientist has a good understanding\
    \ of what data an organization has and how it is structured, then they can move\
    \ to Stage 3 and think about creating the development sample that is going to\
    \ be used in the machine learning process.\n\nA very naïve approach to building\
    \ predictive models is simply to throw every piece of information that an organization\
    \ has into the machine learning process. In practice, much data is out-of-date,\
    \ unstable or otherwise inappropriate. It should therefore be excluded from the\
    \ development sample in case it degrades the performance of the machine learning\
    \ process.\n\nSome typical reasons to exclude data from the machine learning process\
    \ are:\n\n*   Out-of-date data. If the data is no longer relevant to today’s world\
    \ then don’t consider it. Data about how people used their cell phones in the\
    \ time before smartphones existed isn’t going to be very useful in telling you\
    \ about smartphone usage today.\n\n>   \n\n*   Not representative of the target\
    \ population. The development sample should only contain cases that mirror the\
    \ population the model is going to be applied to. If a revenue model is being\
    \ developed exclusively for online customers, then you should exclude in-store\
    \ transactions if spending patterns are different for these two channels. Likewise,\
    \ if you are developing a speech recognition system from sound samples, all samples\
    \ should be speech related. If you have examples of barking dogs or traffic noise,\
    \ then these need to be removed.\n\n>   \n\n*   Stability of data. Will the data\
    \ used in the machine learning process be available when the model is applied?\
    \ If a data item is not available at the point of implementation, then it should\
    \ be excluded.\n\n>   \n\n*   Legal and ethical reasons. Do you want to use sensitive\
    \ personal data such as race, gender and sexual orientation? This type of data\
    \ can be very predictive, but it may be illegal to use it. If it is legal, then\
    \ the use of such data may create reputational risk if it becomes known that you\
    \ treat certain groups differently than others. If a discount strategy based on\
    \ model scores results in you only offering discounts to straight men – that’s\
    \ going to be controversial.\n\n>   "
