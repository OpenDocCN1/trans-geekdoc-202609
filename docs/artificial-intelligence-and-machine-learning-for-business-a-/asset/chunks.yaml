  trans: '

    大多数机器学习应用都以预测模型为基础。模型生成的评分驱动了决策以及随之采取的行动。那么，预测模型是如何生成分数的呢？这取决于所采用的预测模型类型，而且有许多选项可供选择。然而，在大多数现实业务应用中，最流行的三种模型类型是评分卡（线性模型）、决策树（分类与回归树或
    `CART`）以及人工神经网络（`ANNs`，通常简称为神经网络（`NNs`）。


    评分卡和决策树对于非技术人员来说相对容易理解。模型评分以简单且透明的方式计算，这很容易确定这些模型为何做出那种预测。相比之下，神经网络本质上往往更复杂一些，且具有“黑箱”属性。这意味着很难理解神经网络为什么会得出某个分数，以及为什么根据该分数做出了特定的决策。然而，由于神经网络在许多（但并非所有）情况下比评分卡或决策树更倾向于提供更准确的预测，它们已成为许多机器学习应用中日益受欢迎的选择。


    神经网络的高级形式（深度网络/深度学习）目前处于机器学习/人工智能研究的前沿。因此，神经网络是解决复杂人工智能问题（如物体识别、语音识别和语言翻译）的首选模型。


    为了说明这三种预测模型，让我们回到医疗保健领域，关注一种特定的疾病：心病^([\[17\]](#index_split_028.html#filepos412950))。心病是全球范围内主要的死因之一。在西方国家（英国、美国等），每年每
    1000 人口中约有 1 人死于心病，很大比例的人患有心脏疾病，这些疾病在未来可能会夺他们的生命。如果你能识别出未来极有可能患心病的人，并采取预防措施来降低这种可能性，将极大减少人类的痛苦并延长寿命。医疗成本的降低也将是巨大的。


    想象一下，政府有一个乌托邦式的理想，对人口中的所有人进行心病筛查，旨在采取预防措施减少未来疾病的发病率。他们实现这一点的方法之一是发起健康运动，邀请每个男性、女性和儿童去看医生。他们将接受相关的检查和诊断测试，并获得关于如何降低未来患心病风险的建议。


    这在理论上是好的，但在实践中，这种活动的成本将是巨大的，而且在现实时间内没有足够的医生来接待所有人。由于资源匮乏，癌症和糖尿病等其他危及疾病的治疗可能会受到影响。事实上，最终结果可能是由于对心病的过度关注而牺牲了其他疾病，导致人口整体健康状况的下降。


    对所有人进行心病筛查的一刀切的方法显然是不现实的。然而，一个更可行的目标可能是：目标是识别出未来 5 年内将患心病的人中的至少一半，但目标人数不超过总人口的
    5%；即仅占总人口的 5%。

    '
