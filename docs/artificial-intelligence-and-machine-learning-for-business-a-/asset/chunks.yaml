    ## 常见应用场景


    - **预期寿命**：`score` 提供了对个人预期寿命的预测。这类模型通常用于设定人寿保险费和年金。

    - **旅程时间**：根据您的驾驶习惯、当前位置和道路状况信息，您可能在何时到达目的地？

    - **信贷损失**：当某人违约未贷款时，有多少债务可能被注销？

    - **支出**：该模型预测了某人在未来 12 个月内在超市里可能花费多少钱。

    - **购买间隔**：购买产品后多久可以预期会再次购买？营销活动可以安排在客户预计再次购买产品前不久进行。

    - **通话时长**：预测通话时长将持续多长时间？这有助于中心进行资源规划。

    - **占空率**：预测某人在一天中什么时间可能在家里，从而确定拜访他们的最佳时间。

    - **响应时间**：采取行动后多久能观察到响应？在向某人发送信、电子邮件或短信后，他们需要多久回复？


    ## 模型选择策略


    在某些情况下，`regression`（回归）模型是对人们试图预测内容的直接估计。一个生成 `score` 为 5 的 `spend`（支出）模型意味着预测客户将花费
    5 美元。在其他情况下，`score` 被缩放以表示百分比，或分配从 1 到 10、A 到 E 的等级。A 等代表最优秀（利润最高）的客户，E 等代表利润最低的。


    `regression` 和 `classification`（分类）模型都被广泛使用，但 `classification` 模型往往最受欢迎，特别是在业务应用中。这是因为从传统上，简单事件对组织来说最容易理解。这使得数据科学家更容易将业务目标转化为合适的数值表示。定义客户是否购买是非常直观的（`classification`）。然而，确定单笔销售的盈利能力要复杂得多（`regression`）。


    使用哪种类型的模型（`regression` 还是 `classification`）很大取决于人们想对这些分值做什么。如果我唯一感兴趣的是识别哪些信用卡客户最有可能流向竞争对手，那么我需要一个
    `classification` 模型来预测流失概率。然后应用留存策略（例如提供折扣或免费赠品）来试图留住那些最可能流失的客户。


    另一方面，如果首要考虑是识别盈利客户以鼓励他们花费更多，那么我需要的是一个 `regression` 模型。该模型旨在预测谁将成为大额消费者并针对他们进行目标营销。我不需要操心其他客户群体。


    然而，还有第三种选择。假设我真正感兴趣做的是留住盈利客户，而我不在意流失那些花费不多的亏损客户。在这种情况下，最好的方法可能是构建以下两个独立的预测模型：


    1. 一个 `attrition` 模型，用于预测那些最有可能流向竞争对手产品的客户（`classification`）。

    2. 一个 `revenue` 模型，用于识别哪些客户花费最多（`regression`）。


    然后结合使用这两个模型来推动留存策略，如图 1 所示。


    /00006.jpg


    图 1 使用每个模型的分值，根据收入和流失两个维度对人群进行细分。通过结合使用这两个模型，可以应用定制的留存策略并实现显著成本成本。这是因为资源不会浪费在试图留住那些不会流失的客户，或者流失概率高但花费不多的客户。


    对于图 1 中的示例，应用了三种不同的策略：


    1. 对“最差”的客户什么也不做。尝试留住这些人并没有成本效益。

    2. 对中间部分的客户采取轻量级（即低成本）留存策略（`strategy 1`）。

    3. 在“最佳”客户组上投入最多的精力（`strategy 2`）。


    当然，这个问题也有其他的表述方式。可以建立一个单一预测模型，只尝试预测那些产生最高收入且极可能流失的客户，然后对他们进行目标营销。这无疑是一个合理的方法，但会导致对客户特性的粒度缺失；即，单一模型将无法让你像图
    1 所示的双模型方法那样，探索流失与收入之间的权衡。


    请注意，模型仅提供关于客户将如何行动的预测。它们并没有告诉您根据这些预测之后应该做什么。至于对于留存策略 1 和 2 应该采取哪些活动，这是组织需要在其机器学习项目整体范围内解决的额外考虑因素。这很重要，因为一个非常常见的失败案例是组织建立了一些非常好的预测模型，然后没有用它们做任何事情。如果一个机器学习项目想要成功，做出正确的决策并付诸行动至关重要。


    ## 4. 为什么要使用机器学习？它增加了什么价值？


    基于预测模型的机器学习应用越来越多地被用于在各个领域取代和或补充专家判断和人工决策。这是因为预测模型倾向于：


    - **比人类专家更准确**。预测模型有时也会像人一样产生错误的预测，但压倒性的证据表明，从平均而言，它们出错的频率没有那么高。在许多领域，预测模型的表现持续优于人类专家
    20-30%；即它们产生的错误减少了 20-30%，或者识别出好 20-30%（更重要/利润更高）的案例。

    - **无偏见**。与人不同，预测模型不会因为性别、种族、残疾等对某人表现出故意偏见。不要误会，预测模型确实会显示偏见，但如果设计得当，它们只有在基于硬性统计证据的情况下才会给予某些个人或群体比大众更高或更低的评分——而不是基于毫无根据的观念或刻板印象。

    - **快速**。作为自动化决策系统的一部分，预测模型可以在几秒钟内预测百万人的行为。在大多数情况下，让人们手动做出同样的判断在成本上是不可行的，且非常耗时。

    - **廉价**。一旦开发完成，预测模型的部署通常比其人类对应物更便宜。尽管人们不能忘记与初始开发相关的成本，以及持续的维护和许可费用。


    总结来说，预测模型可以做出比人类专家更好、更廉价、更快的决策。这意味着在许多领域，预测模型正在取代人类。特别是那些需要经过培训员工使用其专家判断来做决策的白领岗位。


