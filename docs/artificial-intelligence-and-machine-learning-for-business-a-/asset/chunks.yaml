- raw: 'This is a phenomenon that began in the USA back in the 1950s and 1960s in
    financial services. This was a time when most applications for mortgages, automobile
    credit and personal loans were assessed by human underwriters who individually
    reviewed each loan application. They then came to a decision as to whether or
    not that person was creditworthy, and should therefore, get the credit that they
    had applied for.


    In large organizations, entire office buildings were taken up by underwriting
    teams who spent their days making lending decisions. In local bank branches, the
    Bank Manager was king – a respected member of the local community with absolute
    discretion over who could be given a loan or mortgage and who could not. Sometimes
    getting a loan would simply be down to whether he (and invariably it was a he)
    was in a good mood that day. You were probably more likely to get a loan on a
    Friday afternoon, when he was feeling in a good mood about the weekend, than first
    thing on a Monday morning!


    By the late 1980s, most of these roles were redundant. The role of bank manager
    had been reduced to little more than that of a salesperson – fronting the customer
    relationship but having no decision-making capability. The vast majority of lending
    decisions were being made by credit scoring models sitting at the heart of an
    automated decision-making system located at head office. In the world of credit
    granting these days, only unusual or borderline cases tend to be reviewed by a
    human being – the vast majority of lending decisions are made automatically without
    any human intervention at all.


    Job losses are a concern for those in affected industries, but it’s not all doom
    and gloom. In many cases, machine learning is adding value to roles rather than
    supplanting them. In hospitals and doctors’ surgeries, predictive models supplement
    doctors’ own judgements rather than replacing them. In marketing, improved targeting,
    based on machine learning, is used to reduce nuisance calls and junk mail, while
    at the same time maximizing worthwhile customer contacts; i.e. only phone/text/e-mail
    people who are very likely to be interested in what you are selling. In the past,
    blanket contact strategies were common. Staff in call centers would be supplied
    with phone books and told to work their way through them, calling as many people
    as they could regardless of their propensity to buy the product or service on
    offer. HR departments also make use of machine learning to pre-screen job applications
    to remove those least likely to be suited to a given role. This allows HR staff
    to concentrate more of their time on the most promising prospects.


    Another opportunity that machine learning makes possible is forecasting new types
    of behavior that were not considered or were not cost effective before. In policing
    for example, predictive models are helping police officers narrow down suspect
    lists and better target crime, improving efficiency and giving them more time
    to focus on the most serious crimes. Predictive models are also fundamental to
    “people matching” services such as dating and job sites. Without predictive models
    these would be very different affairs – matching people based on a very crude
    set of criteria and/or having to use people to do the matching, making such services
    very much more expensive and less efficient.


    Despite all the arguments in favor of automated decision-making systems based
    on predictive models, don’t make the mistake of thinking that machine learning
    is perfect. Predictive models can and do get things wrong on a frequent basis,
    but on average just not quite as often as people. In a similar vein, if there
    are problems or biases with the data feeding the algorithms used to construct
    a predictive model, then the resulting models will be flawed. Also, if the people
    who design the decision-making system make incorrect assumptions about how a predictive
    model is going to be used, then again, the model won’t work well. Imagine that
    you want to use machine learning to identify senior managers who are responsible
    for managing teams of people in large organizations. The purpose, once they have
    been identified, is to ask them to contribute to a cross-industry response to
    the government’s new legislation for improved childcare provision. The model may
    be very predictive, but it will inevitably be biased toward men. Why? Because
    we live in a society that still displays gender bias in most industries, and a
    society where women are still viewed as the primary source of childcare. In one
    sense the model will be accurate as long as it identifies senior leaders, but
    there will be a resulting under-representation of women reflecting the societal
    biases that exist.


    One real life situation that has been highly publicized is that of granting prisoners
    parole. It has been reported that the algorithms used to support parole decisions
    in the US have a very strong racial bias^([\[15\]](#index_split_028.html#filepos412292)).
    If you are white you are far more likely to get parole than inmates of other ethnicities.
    Why? Because the predictive models used to assess parole cases have been developed
    using information about historical decisions that were themselves biased. It all
    comes back to the data used in the machine learning process. If the data contains
    information relating to previously biased decisions, then that will certainly
    be picked up by any machine learning algorithm. To put it another way, machine
    learning has no social awareness and no conscience. If there are patterns in the
    data that are ethically undesirable or illegal, the machine learning process has
    no way of knowing that. Consequently, it won’t treat these socially unacceptable
    patterns any differently from other patterns that it finds.


    A more overt example of the bias that can be displayed by machine learning based
    AI systems is the chatbot Tay, which was developed by Microsoft. Tay was intended
    to generate automatic responses to tweets by teenagers and to adapt to new conversations
    as they arose. Tay ended up being withdrawn within hours because it started to
    tweet racist and other inappropriate content^([\[16\]](#index_split_028.html#filepos412509)).
    The reason that it did this was because the tweets that were being used to train
    it contained racist and other unacceptable material. Tay learnt these patterns
    and played them back in its own responses. Tay’s ability to respond using natural
    language could be considered almost human, but its inability to moderate its responses
    to cater for social and ethical norms expected by wider society was very sub-human.


    Another concern is that if a data scientist has particular prejudices then it
    is possible for them to consciously design these into the system, subverting what
    the data is telling them. This however, can also work to people’s benefit. If
    it is believed that a user does not like the decisions being made, then a well-designed
    system will allow the decision logic to be modified/overridden – as we discussed
    in relation to the whisky sale example in previous chapters.


    What this means is that there needs to be oversight of machine learning based
    decision-making systems, and an appropriate set of checks and balances in place
    to ensure that the systems work in a way that is both legal and ethical. We’ll
    talk about these issues in more detail in Chapter 13.


    [5\. How Does Machine Learning Work?](#index_split_004.html#filepos4264)'
