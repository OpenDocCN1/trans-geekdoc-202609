    # 商业领域的人智能与机器学习

    ## 数据驱动技术的实战指南

    ### 第三版

    Steven Finlay

    Relativistic

    “用文字玩出花样”

    Relativistic

    e-mail：`AI@relativistic.co.uk`


    Copyright © 2018 Steven Finlay. 版权所有。

    第一版由 Relativistic 在英国首次出版。

    除非英国版权法允许，否则未经出版者许可，不得以任何书面、印刷或电子形式复制本书。

    ISBN-13: `978-1-9997303-6-9`

    本书的编写过程中没有植物或动物受到虐待。

    封面图片：“血中的火。”感谢 Pixabay 提供。


    献给 Sam 和 Ruby


    ## 目录

    - 致谢

    - 前言

    - 1. 引言

    - 2. 什么是机器学习和人工智能 (AI)?

    - 3. 预测模型生成的评分代表什么

    - 4. 为什么要使用机器学习？它增加了什么价值？

    - 6. 使用预测模型做出决策

    - 7. 那是评分卡，但决策树又是什么？

    - 8. 神经网络与深度学习

    - 9. 无监督学习与强化学习

    - 10. 如何构建预测模型

    - 11. 机器学习的业务化

    - 12. 大数据与机器学习之间的关系

    - 13. 伦理、法律与 GDPR

    - 14. 机器学习的前沿

    - 15. 我什么时候能买到自动驾驶汽车？

    - 16. 结语

    - 附录 A 评估预测模型

    - 附录 B 更多信息与推荐阅读

    - 附录 C 机器学习与人工智能中的常用术语

    - 附录 D 商业成功的清单

    - 关于作者

    - 注释


    ## 致谢

    我要感谢我的家人，特别是我的妻子 Samantha，她在写这本书期间提供的支持。我还要感谢上一版的所有读者，他们向我提供了建议、更正、想法和创意。我已将其中大部分内容融入到了本书中。我特别感谢那位告诉我哪里可以买到橙洗衣机的读者。


    ## 前言

    单程 56 分钟。往返 112 分钟。这是我的通勤火车从我的家乡普斯顿（Preston）到英国大城市曼彻斯特往返所需的时间。我觉得这段时间是阅读一些书籍的理想时间。因此，我想一本关于人工智能和机器学习的简明书籍，如果可以在这段时间内读完，对于那些时间不充裕的人来说将非常有用。


    理解机器学习非常重要，因为它正对我们生活的许多方面产生巨大影响。特别是，它正驱动着语言翻译、自主机器人和医疗诊断等许多领域“人工智能”应用的爆发式增长。


    人工智能和机器学习对许多日常业务功能也产生了直接影响。基于机器学习的自动化系统正在取代许多由人工完成的任务。这为采用这些技术的组织带来了相对于竞争对手的竞争优势，因为此类系统可以提供效率的提升和改进的客户服务。


    这本书的这个新修订版比旧版长得多。特别是增加了几个新章节，涵盖了比以前更广泛的话题。然而，我力求保留原书“简洁、实战”的风格。这不仅是因为这是读者表示他们喜欢的关键特点。因此，现在读完这本书可能比
    112 分钟稍长一点（可能需要往曼彻斯特往返两次而不是一次），但我希望你觉得这段时间花得很值。


    ## 1. 引言

    你有智能手机或信用卡吗？你会在超市买东西或玩电脑游戏吗？你有工作或使用医疗保健服务吗？如果对这些问题的任何一个答案是“是”，那么人工智能和机器学习将以某种方式对你的生活产生影响。这是因为它们是组织利用他们拥有的关于你的数据以决定如何对待你的主要工具。这些工具被用于告知组织你在不同情况下可能会如何表现，从而决定他们应该如何对待你。


    这些技术现在正被应用于生活的方方面面，通过“人工智能”机器和计算机接口来改进流程并增强人们的体验。`Amazon Echo`、`Apple Siri` 和
    `Google Translate` 仅仅是展示了这些技术所能提供的优势三个三个软件产品。如今，许多产品和服务也具有自适应性。它们会为个人用户定制响应。电视和音乐流媒体服务学习识别你喜欢的内容，并向你推荐你无疑感兴趣的内容。改变你听的音乐类型，它们的推荐也会随之改变。同样，你可以购买供暖系统，它们会学习预测何时开启供暖的最佳时间，这样你就无需费心，同时优化能源使用以减少账单。这些都是人工智能应用的进一步示例。


    这本简明文本提供了人工智能和机器学习的管理级（即非技术性的、无复杂公式的）概述。书中假设没有任何先验知识。换句话说，如果你识字、会写并且基础算术（书中有一些算术，但并不多），那么阅读书中的内容应该没有问题。


    此时提出一个很好的问题是：我为什么需要了解这些东西？一个原因是个人的。基于机器学习的智能决策系统被组织广泛用于以决定如何对待你、你的朋友和你的家人。他们利用这些工具来决定你会收到优厚的报价还是恶劣的报价，你应该排在队列的前面还是后面，你是否会面临税务审计或被视为刑事案件的嫌疑人。因此，了解这些东西不是坏主意，这样你就能理解为什么组织可能以一种方式而非另一种方式对待你。


    '
