- raw: "The other reason to learn about artificial intelligence, and the one that\
    \ is the main focus of this book, is that it is now a mainstream business tool.\
    \ Not that long ago, artificial intelligence was the domain of a few nerdy specialists\
    \ working mainly in academia, financial services or large marketing departments.\
    \ These days, regardless of what business you are in, applications of artificial\
    \ intelligence, based on machine learning, can be found across the full range\
    \ of business activities. This covers everything from employee vetting, answering\
    \ customer queries and target marketing through to robots on the production line,\
    \ warehouse management and customer deliveries. As a consequence, artificial intelligence\
    \ is supporting or supplanting human expertise in many domains. Some examples\
    \ include: replacing underwriters when setting insurance premiums, helping HR\
    \ professionals decide who to hire/fire, automatically identifying customers as\
    \ they walk into your store and supporting doctors when diagnosing illnesses such\
    \ as cancer and heart disease.\n\nArtificial intelligence has arrived big time.\
    \ It’s no fad and it’s here to stay. Those organizations which can use it to solve\
    \ business problems, improve efficiency and cut costs will benefit at the expense\
    \ of their rivals.\n\nThis doesn’t mean that you need to learn all the things\
    \ that a technical specialist (a data scientist) needs to know. However, having\
    \ a working knowledge of what artificial intelligence and machine learning are,\
    \ and knowing how they can be used to help your organization deliver better products\
    \ and services, will be beneficial. Not least, because in order to make effective\
    \ use of these tools they need to be focused on business objectives to address\
    \ specific problems that organizations face.\n\nIf on the other hand you happen\
    \ to be an equation quoting, formula juggling, bad ass mathematical genius who\
    \ thinks they know all there is to know about artificial intelligence, then this\
    \ book may also have some value for you too. Possibly even more than those who\
    \ know nothing at all. Why? Because if all you care about are the theoretical\
    \ aspects of the subject then you face a real risk of hitting a brick wall when\
    \ it comes to delivering useful solutions in the minefield that is the real world;\
    \ a world populated with social, ethical and political issues. This, together\
    \ with a growing raft of privacy and data protection legislation, could derail\
    \ your solutions no matter how good they are mathematically. Without consideration\
    \ of these “soft issues” the best case is that the solutions you develop don’t\
    \ get to be deployed. The worst-case scenario is that you design an artificial\
    \ intelligence based system that lands you in court because it unfairly discriminates\
    \ against minorities, women or some other group of people. Maybe you can skip\
    \ a few of the earlier chapters, but you should certainly read the later ones.\n\
    \nTo get the most out of artificial intelligence, data scientists need to engage\
    \ with business users to understand their problems. Data scientists also need\
    \ to understand an organization’s culture and its approach to the adoption of\
    \ new ideas, technologies and working practices. Legal and regulatory issues in\
    \ the region(s) in which their clients operate also require due consideration.\
    \ It doesn’t matter how good a solution is in terms of cutting edge hardware and\
    \ software, if it’s not aligned with an organization’s business objectives and\
    \ operational processes, then it’s all just a waste of time and money.\n\nLots\
    \ of solution suppliers can bamboozle you with their fancy tech and the latest\
    \ terminology, which is often just a rebranding of last year’s tech with a new\
    \ twist. However, the suppliers who add value will be those who spend time understanding\
    \ how you and your organization work. They will then determine if and how their\
    \ solutions can be used to improve what you do and explain this to you in simple\
    \ language which you can understand without needing to reach for Wikipedia.\n\n\
    Successful artificial intelligence is a two-way thing. Data scientists need to\
    \ know something about your organization and what it does, and you need to understand\
    \ a little bit about artificial intelligence and machine learning. Without this\
    \ joint understanding it’s unlikely that you or your organization will be able\
    \ to realize the full benefits that artificial intelligence has to offer.\n\n\
    OK. So, what will you learn from reading this book? The key topics that we are\
    \ going to cover in the following chapters are:\n\n*   What machine learning and\
    \ artificial intelligence are.\n\n>   \n\n*   The sort of things organizations\
    \ use artificial intelligence for.\n\n>   \n\n*   What a predictive model looks\
    \ like.\n\n>   \n\n*   The relationship between artificial intelligence, machine\
    \ learning and “Big Data.”\n\n>   \n\n*   The people and tools needed to apply\
    \ artificial intelligence.\n\n>   \n\n*   How to use artificial intelligence to\
    \ improve business processes and the bottom line.\n\n>   \n\n*   The legal and\
    \ ethical issues that need to be considered when developing artificial intelligence\
    \ based solutions that are going to be used to make decisions about people.\n\n\
    >   \n\n*   How advanced forms of machine learning are applied to drive artificial\
    \ intelligence applications such as object recognition and language translation.\n\
    \n>   \n\n*   The current limitations of machine learning and artificial intelligence.\n\
    \nRecommended further reading and a glossary of common machine learning/artificial\
    \ intelligence terms are provided in Appendices B and C respectively.\n\n[2\\\
    . What are Machine Learning and Artificial Intelligence (AI)?](#index_split_004.html#filepos4264)\n\
    \nMachine learning is the use of mathematical procedures (algorithms) to analyze\
    \ data. The aim is to discover useful patterns (relationships or correlations)\
    \ between different items of data. Once the relationships have been identified,\
    \ these can be used to make inferences about the behavior of new cases when they\
    \ present themselves. In essence, this is analogous to the way people learn. We\
    \ observe what goes on around us and draw conclusions from our experiences about\
    \ how the world works. We then apply what we have learnt to help us deal with\
    \ new situations that we find ourselves in. The more we experience and learn,\
    \ the better our ability to make decisions becomes.\n\nOne application of machine\
    \ learning is object recognition. The goal is to develop systems that can identify\
    \ everyday objects from images the system is presented with. The data used to\
    \ develop an object recognition system consists of pictures of different objects\
    \ such as chairs, umbrellas, washing machines and so on. Each picture presented\
    \ to the machine learning algorithm is labeled to identify which type of object\
    \ it contains. For each type of object there may be hundreds or thousands of different\
    \ images, representing alternative forms of that object from different perspectives\
    \ (you’d be surprised at just how many variants of an umbrella there are!)\n\n\
    By analyzing the different images, machine learning algorithms recognize that\
    \ certain objects are associated with certain features (patterns). Chairs tend\
    \ to have protuberances (legs) coming from a flat, often squarish base (the seat).\
    \ They are also differentiated from stools by having a back rest. Washing machines\
    \ tend to be cube shaped with knobs on and are almost never pink or orange (please,\
    \ do let me know if you ever come across somewhere where I can buy a pink washing\
    \ machine!) Similarly, umbrellas are long and thin (when closed), are often, but\
    \ not always, black and so on."
  fmt: "\nThe other reason to learn about artificial intelligence, and the one that\
    \ is the main focus of this book, is that it is now a mainstream business tool.\
    \ Not that long ago, artificial intelligence was the domain of a few nerdy specialists\
    \ working mainly in academia, financial services or large marketing departments.\
    \ These days, regardless of what business you are in, applications of artificial\
    \ intelligence, based on machine learning, can be found across the full range\
    \ of business activities. This covers everything from employee vetting, answering\
    \ customer queries and target marketing through to robots on the production line,\
    \ warehouse management and customer deliveries. As a consequence, artificial intelligence\
    \ is supporting or supplanting human expertise in many domains. Some examples\
    \ include: replacing underwriters when setting insurance premiums, helping HR\
    \ professionals decide who to hire/fire, automatically identifying customers as\
    \ they walk into your store and supporting doctors when diagnosing illnesses such\
    \ as cancer and heart disease.\n\nArtificial intelligence has arrived big time.\
    \ It’s no fad and it’s here to stay. Those organizations which can use it to solve\
    \ business problems, improve efficiency and cut costs will benefit at the expense\
    \ of their rivals.\n\nThis doesn’t mean that you need to learn all the things\
    \ that a technical specialist (a data scientist) needs to know. However, having\
    \ a working knowledge of what artificial intelligence and machine learning are,\
    \ and knowing how they can be used to help your organization deliver better products\
    \ and services, will be beneficial. Not least, because in order to make effective\
    \ use of these tools they need to be focused on business objectives to address\
    \ specific problems that organizations face.\n\nIf on the other hand you happen\
    \ to be an equation quoting, formula juggling, bad ass mathematical genius who\
    \ thinks they know all there is to know about artificial intelligence, then this\
    \ book may also have some value for you too. Possibly even more than those who\
    \ know nothing at all. Why? Because if all you care about are the theoretical\
    \ aspects of the subject then you face a real risk of hitting a brick wall when\
    \ it comes to delivering useful solutions in the minefield that is the real world;\
    \ a world populated with social, ethical and political issues. This, together\
    \ with a growing raft of privacy and data protection legislation, could derail\
    \ your solutions no matter how good they are mathematically. Without consideration\
    \ of these “soft issues” the best case is that the solutions you develop don’t\
    \ get to be deployed. The worst-case scenario is that you design an artificial\
    \ intelligence based system that lands you in court because it unfairly discriminates\
    \ against minorities, women or some other group of people. Maybe you can skip\
    \ a few of the earlier chapters, but you should certainly read the later ones.\n\
    \nTo get the most out of artificial intelligence, data scientists need to engage\
    \ with business users to understand their problems. Data scientists also need\
    \ to understand an organization’s culture and its approach to the adoption of\
    \ new ideas, technologies and working practices. Legal and regulatory issues in\
    \ the region(s) in which their clients operate also require due consideration.\
    \ It doesn’t matter how good a solution is in terms of cutting edge hardware and\
    \ software, if it’s not aligned with an organization’s business objectives and\
    \ operational processes, then it’s all just a waste of time and money.\n\nLots\
    \ of solution suppliers can bamboozle you with their fancy tech and the latest\
    \ terminology, which is often just a rebranding of last year’s tech with a new\
    \ twist. However, the suppliers who add value will be those who spend time understanding\
    \ how you and your organization work. They will then determine if and how their\
    \ solutions can be used to improve what you do and explain this to you in simple\
    \ language which you can understand without needing to reach for Wikipedia.\n\n\
    Successful artificial intelligence is a two-way thing. Data scientists need to\
    \ know something about your organization and what it does, and you need to understand\
    \ a little bit about artificial intelligence and machine learning. Without this\
    \ joint understanding it’s unlikely that you or your organization will be able\
    \ to realize the full benefits that artificial intelligence has to offer.\n\n\
    OK. So, what will you learn from reading this book? The key topics that we are\
    \ going to cover in the following chapters are:\n\n* What machine learning and\
    \ artificial intelligence are. \n* The sort of things organizations use artificial\
    \ intelligence for.\n* What a predictive model looks like.\n* The relationship\
    \ between artificial intelligence, machine learning and “Big Data.”\n* The people\
    \ and tools needed to apply artificial intelligence.\n* How to use artificial\
    \ intelligence to improve business processes and the bottom line.\n* The legal\
    \ and ethical issues that need to be considered when developing artificial intelligence\
    \ based solutions that are going to be used to make decisions about people.\n\
    * How advanced forms of machine learning are applied to drive artificial intelligence\
    \ applications such as object recognition and language translation.\n* The current\
    \ limitations of machine learning and artificial intelligence.\n\nRecommended\
    \ further reading and a glossary of common machine learning/artificial intelligence\
    \ terms are provided in Appendices B and C respectively.\n\n## 2. What are Machine\
    \ Learning and Artificial Intelligence (AI)?\n\nMachine learning is the use of\
    \ mathematical procedures (algorithms) to analyze data. The aim is to discover\
    \ useful patterns (relationships or correlations) between different items of data.\
    \ Once the relationships have been identified, these can be used to make inferences\
    \ about the behavior of new cases when they present themselves. In essence, this\
    \ is analogous to the way people learn. We observe what goes on around us and\
    \ draw conclusions from our experiences about how the world works. We then apply\
    \ what we have learnt to help us deal with new situations that we find ourselves\
    \ in. The more we experience and learn, the better our ability to make decisions\
    \ becomes.\n\nOne application of machine learning is object recognition. The goal\
    \ is to develop systems that can identify everyday objects from images the system\
    \ is presented with. The data used to develop an object recognition system consists\
    \ of pictures of different objects such as chairs, umbrellas, washing machines\
    \ and so on. Each picture presented to the machine learning algorithm is labeled\
    \ to identify which type of object it contains. For each type of object there\
    \ may be hundreds or thousands of different images, representing alternative forms\
    \ of that object from different perspectives (you’d be surprised at just how many\
    \ variants of an umbrella there are!)\n\nBy analyzing the different images, machine\
    \ learning algorithms recognize that certain objects are associated with certain\
    \ features (patterns). Chairs tend to have protuberances (legs) coming from a\
    \ flat, often squarish base (the seat). They are also differentiated from stools\
    \ by having a back rest. Washing machines tend to be cube shaped with knobs on\
    \ and are almost never pink or orange (please, do let me know if you ever come\
    \ across somewhere where I can buy a pink washing machine!) Similarly, umbrellas\
    \ are long and thin (when closed), are often, but not always, black and so on.\n"
  trans: '

    学习人工智能的另一个原因，也是本书关注的重点，是因为它现在已成为一种主流业务工具。就在不久前，人工智能还是极少数主要活跃在学术界、金融服务或大型营销部门的极客型专家的领域。如今，无论你从事何种业务，基于机器学习的人工智能应用贯穿于业务活动的方方面。这涵盖了从员工审查、回答客户查询和目标营销，到生产线上的机器人、仓库管理和客户交付的所有环节。因此，人工智能在许多领域支持或取代了人类的专业知识。一些示例包括：在设定保险保费时取代核保师、帮助人力资源专业人员决定聘用/解雇、在客户进入商店时自动识别他们，以及在医生诊断癌症和心脏病等疾病时提供支持。


    人工智能已经强势到来。它不是一目之风，而是将持久存在。那些能够利用它来解决业务问题、提高效率并降低成本的组织将以竞争对手为代价获益。


    这并不意味着你需要学习技术专家（数据科学家）需要知道的所有知识。然而，对人工智能和机器学习有一定的实操性知识，并知道如何利用它们来帮助你的组织交付更好的产品和服务，将是有益的。尤其是因为为了有效利用这些工具，必须将其专注于业务目标，以解决组织面临的特定问题。


    另一方面，如果你恰好是一个引用方程、玩弄公式的数学天才，并认为自己已经了关于人工智能的所有知识，那么这本书对你可能也有价值。甚至比对那些一无所知的人更有价值。为什么？因为如果你只关心该主题的理论方面，那么在现实世界的雷区中交付实用的解决方案时，你将面临碰墙的真实风险；这是一个充满了社会、伦理和政治问题的世界。加上日益增长的隐私和数据保护立法，无论你的解决方案在数学上有多完美，都可能导致你的方案流车。如果不考虑这些“软性问题”，最好的结果是你开发的解决方案无法部署；最坏的情况是你设计了一个基于人工智能的系统，结果让你上了法庭，因为它对少数群体、女性或其他群体产生了不公平的歧视。你可以跳过前面的几章，但绝对应该阅读后面的章节。


    为了充分利用人工智能的价值，数据科学家需要与业务用户接触以理解他们的问题。数据科学家还需要理解组织的文化以及其采用新想法、新技术和工作实践的方法。客户所在地区的法律和监管问题也需要予以充分考虑。一个解决方案在尖端硬件软件方面有多好，如果它与组织的业务目标和运营流程不一致，那么一切都是浪费时间和金钱。


    许多解决方案供应商用他们花哨的技术和最新的术语来误导你，这些术语往往只是去年技术换汤不药的重新包装。然而，增加价值的供应商将是那些花时间理解你和你的组织运作的人。他们将确定他们的解决方案可以以及如何被用于改进你们的工作，并用你能听懂的简单语言解释给你，而无需查阅维基百科。


    成功的人工智能是双向的。数据科学家需要了解你的组织及其业务，而你需要稍微了解人工智能和机器学习。没有这种共同的理解，你或你的组织很难实现人工智能提供的全部收益。


    好了。那么，通过这本书你会学到什么？我们在接下来的章节中涵盖的关键主题是：


    *   什么是机器学习和人工智能。

    *   组织使用人工智能的用途。

    *   预测模型是什么样子的。

    *   人工智能、机器学习与“大数据”之间的关系。

    *   应用人工智能所需的人和工具。

    *   如何使用人工智能改进业务流程和底线。

    *   在开发用于对人员做出决策的人工智能解决方案时，需要考虑的法律和伦理问题。

    *   高级形式的机器学习如何应用于推动识别和语言翻译等人工智能应用。

    *   机器学习和人工智能目前的局限性。


    附录 B 和 C 分别提供了推荐的进一步阅读材料和常用机器学习/人工智能术语表。


    ## 2. 什么是机器学习和人工智能 (AI)？


    机器学习是使用数学程序（算法）来分析数据。其目标是在不同数据项之间发现有用的模式（关系或相关性）。一旦识别出这些关系，就可以在新的案例出现时对其行为进行推断。本质上，这类比于人类的学习方式。我们观察周围发生的事情，并根据经验对世界的运作方式得出结论。然后我们将学到的知识用于帮助自己应对所处的新情境。我们经历得越多、学习得越高，我们决策的能力就越强。


    机器学习的一个应用是物体识别。目标是开发能够从系统呈现的图像中识别日常对象的系统。用于开发物体识别系统的数据由不同物体的照片，如椅子、伞、洗衣机等。输入机器学习算法的每张照片都贴有标签，以识别它包含哪种类型的物体。对于每种类型的物体，可能有成百或上千张不同的图像，代表该物体从不同角度的替代形式（你会惊讶于伞竟然有这么多变体！）


    通过分析不同的图像，机器学习算法识别出某些物体与某些特征（模式）相关。椅子倾向于从平坦的、通常是正方形的底座（座垫）长出突起（腿）。它们还通过有靠背与凳区分开来。洗衣机通常是立方体形状，上面带有旋钮，而且几乎不是粉色或橙色（如果你发现发现哪里可以买到粉色的洗衣机，请务必告诉我！）同样，伞在收合时是长而细的，通常是黑色但并非总是如此，等等。

    '
