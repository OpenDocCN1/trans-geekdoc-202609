    ## 1. Data Immutability

    There are some characteristics people are born with. These can’t change. If decisions
    are made on the basis of things such as age and ethnic origin, then that’s far
    more controversial than data that results from people’s lifestyle choices, which
    are more dynamic and changeable. For example, the music people like or what they
    watch on TV.


    ## 2. Impact (significance)

    What effect is a decision going to have? A life or death decision about cancer
    treatment is much more important than something trivial such as deciding whether
    or not to send someone a 10% discount voucher for frozen pizza.


    Bringing these three considerations together, it’s when high impact decisions
    are being made using immutable data, purely for the benefit of the decision maker
    that the greatest ethical risks arise. Great care needs to be taken to ensure
    that the decision-making system is fair, displays no unacceptable bias and hence,
    does not expose the decision maker to accusations of misbehavior. I’m not saying
    that an organization can’t use high impact immutable data to further their own
    ends, but that they need to be careful and be ready to respond to any challenges
    about the way they use that data.


    If an organization identifies that it is using predictive models to take what
    are potentially “High risk” ethical decisions, then what should it do? The answer
    is to take mitigating action as follows:


    1. **Try to identify at-risk groups.** The way to do this is to produce separate
    score distribution reports for groups such as women, ethnic minorities, children
    and so on. It can then be seen if there is any bias in the resulting scores; i.e.
    which groups tend to get lower than average scores and will therefore be adversely
    treated compared to the wider population.

    2. **For those groups that score less well than the population average, constraints
    and override rules should be used to ensure that they are treated in a fair way.**
    Likewise, different cut-offs may need to be set for at risk groups.

    3. **Continue to monitor the situation once the decision-making system goes live.**
    Regularly review the score profile and decision rules for key groups. Cut-offs,
    constraints and overrides should then be fine tuned as required.


    To illustrate this approach, let’s think about an employment scenario. Consider
    a predictive model which is used to decide who to hire. A high score from the
    model indicates that the person is likely to be successful in the role, a low
    score less so. A concern might be that older men or people with young children
    are treated unfairly (which would potentially be in breach of EU law if the model
    was being used in that region). This is not to say that isn’t evidence that older
    men or people with children perform worse in their roles and would be worse hires
    than other people, but that it would be socially unacceptable to treat these groups
    differently. An ethically questionable system would be one where there was a single
    predictive model and a single cut-off score was applied to decide who to hire.


    A more robust approach, is to start by producing separate score distributions
    for older men and people with children. These are then compared against the score
    distribution for all potential hires. If necessary, separate cut-offs are then
    applied. This is to ensure that the proportion of people who are offered jobs
    in these two groups is the same as for the rest of the population.


    Another similar approach, is to construct separate models for each group. One
    model is built for the general population, one for older people and another for
    people with young children. Separate cut-off rules are then applied to each model
    to ensure that a consistent and aligned decision-making strategy occurs.


    ## Ethical Framework and Regulatory Landscape

    So far in this chapter we have focused on developing an ethical framework for
    dealing with personal data and how it can be applied in a general setting; i.e.
    what we have discussed is universally applicable to a wide range of situations
    wherever in the world one resides. Thinking about these issues will help you deal
    with individuals in a morally appropriate way (meaning you can sleep easy at night).
    However, as noted earlier in this chapter, governments and regulatory authorities
    around the world are introducing much tighter legal and regulatory controls over
    how organizations gather, store and use personal data. Therefore, regardless of
    how ethical an organization believes it is, it also has to comply with all relevant
    laws and regulations in the regions within which it operates.


    Laws around the use of personal data and its use in automated decision-making
    have existed in many countries for decades but differ widely in scope and application.
    Some countries have very detailed regulation relating to personal data, while
    others have none at all.


    ### United States

    In the US, regulation is narrowly targeted at specific uses of personal data.
    The `Equal Credit Opportunity Act 1974` (`ECOA`) requires lenders to explain why
    their automated credit scoring systems decline people for credit. The `Health
    Insurance Portability and Accountability Act 1996` (`HIPAA`) provides safeguards
    around the use of people’s health records. The `Children''s Online Privacy Protection
    Act` (`COPPA`) relates to data about children under the age of 13 and so on. In
    the US there is no overarching legislation specifically around the gathering of
    personal data or how that data is used in automated decision-making processes.


    ### European Union

    For the 28 countries that comprise the European Union, which includes 4 of world’s
    10 biggest economies with a combined population of more than half a billion, it’s
    a very different story. A much more comprehensive approach to the regulation of
    personal data and how it can be used has been adopted for many years. What can
    be argued is the most significant data protection legislation ever enacted anywhere
    in the world came into force in all EU countries on 25^(th) May 2018. The `General
    Data Protection Regulation` (`GDPR`) places great responsibilities on organizations
    over how they gather, manage and process peoples’ personal information.


    The `GDPR` applies to all organizations operating in the EU, even if their base
    of operations is elsewhere. There is no opt out for the tech giants out of Silicon
    Valley if they do business in any EU state.


    It’s been said that the law is an ass, but the `GDPR` will kick yours if you ignore
    it. Organizations that fail to comply with the `GDPR` are liable for fines of
    up to 4% of global turnover (not profit) for every breach of the regulation that
    occurs. Even if you don’t live in the EU it’s worth spending a bit of time to
    get under the skin of it because it highlights the direction of travel for data
    protection legislation in a number of other countries and jurisdictions.


    The `GDPR` adopts a rights based approach. The foundation stone that underpins
    it is personal ownership of one’s own data. It’s an individual’s right to decide
    who has access to their data and how it’ used. Data about me is mine, it’s part
    of who and what I am. You have no right to hold or use my data unless I give you
    permission to do so. To store my data or make decisions about me without my permission
    is illegal. I also have the right to change my mind. I can give you access to
    my data today, but if I no longer want you to use it, then you must stop doing
    so and delete what you know about me.


    The legislation is also principle based. This means that it’s not entirely prescriptive
    in terms of what you have to do to comply. The aim is to encourage compliance
    with the spirit of the law not just the letter of the law.


    Another factor to bear in mind is that the focus of the `GDPR` is squarely on
    the individual. There is no consideration as to the costs that organizations incur
    to comply. At best, there is only very limited scope for a business to argue that
    it would be uneconomic or might cause them to go bust unless they process data
    in a certain way.

    '
  trans: '


    ## 1. 数据不可变性

    人天生具有某些特征，这些特征是无法改变的。如果根据年龄和族裔等因素做出决策，那么这比基于人们生活方式选择产生的数据要争议得多，因为后者更具动态性和易变性。例如，人们喜欢的音乐或它们在电视上看的内容。


    ## 2. 影响（重要性）

    一个决策将产生什么影响？关于癌症治疗的生死决定比决定是否给某人发送一张 10% 折的冷冻披萨优惠券等琐事要重要得多。


    将这三个考虑因素结合起来，当使用不可变数据做出高影响的决策，且纯粹是为了决策者的利益时，就会产生最大的伦理风险。这需要格外确保决策系统是公平的、不显示出不可接受的偏见，从而使决策者免受行为不当的指控。我并不是说机构不能使用高影响的不可变数据来实现自己的目的，而是他们需要谨慎，并准备好应对对他们使用数据方式的任何质疑。


    如果一个机构发现自己正在使用预测模型来做出潜在的“高风险”伦理决策，那么它应该怎么办？答案是采取以下缓解措施：


    1. **尝试识别风险群体。** 这样做的方法是为女性、少数族裔、儿童等群体生成单独的评分分布报告。这样就可以观察结果评分中是否存在偏见；即哪些群体倾向于获得低于平均水平的分，因此与更广泛的人群相比将受到不利对待。

    2. **对于得分低于人群平均水平的群体，应该使用限制条件和覆盖规则来确保他们获得公平的对待。** 同样，可能需要为高风险群体设置不同的阈值。

    3. **在决策系统上线后继续监控状况。** 定期审查关键群体的评分概况和决策规则。根据需要对阈值、限制条件和覆盖规则进行微调。


    为了说明这种方法，让我们考虑一个招聘场景。考虑一个用于决定聘用谁的预测模型。模型的高分表示该人可能在职位上取得成功，低分则较之。一种担忧可能是，老年男性或有幼童的人受到了不公平的对待（如果该模型在该地区使用，可能会违反欧盟法律）。这并不是说没有证据表明老年男性或有小孩的人在工作中的表现更差，且比其他人更不值得雇用，而是说区别对待这些群体在社会上是不可接受的。一个伦理上有问题的系统是指使用单一的预测模型并应用单一阈值分数来决定聘用谁。


    一种更稳健的方法是从为老年男性和有小孩的人生成单独的评分分布开始。然后将这些与所有潜在聘用者的评分分布进行比较。如有必要，应用单独的阈值。这是为了确保这两个群体中获得工作的比例与人群其他部分相同。


    另一种类似的方法是为每个群体构建单独的模型。为普通人群建立一个模型，为老年人建立一个，为有幼童的人建立另一个。然后对每个模型应用不同的阈值规则，以确保实现一致且协调的决策策略。


    ## 伦理框架与监管格局

    到目前为止，本章重点关注开发一个处理个人数据的伦理框架，以及它如何在通用环境中应用；即我们讨论的内容对于世界上任何地方的各种情况都具有普遍适用性。思考这些问题将帮助你以道德适当的方式与个人打交道（这意味着你晚上可以睡得安稳）。然而，正如本章早期提到的，全球各国政府和监管机构正在引入更严格的法律和监管控制，以限制机构收集、存储和使用个人数据的方式。因此，无论一个机构认为自己有多伦理，它也必须遵守其运营所在地区的所有相关法律法规。


    关于个人数据的使用及其在自动化决策中使用的法律在许多国家已存在数十年，但在范围和应用上存在很大。


    ### 美国

    在美国，监管针对性地指向个人数据的特定用途。`1974 年平等信贷机会法`（`ECOA`）要求贷款人解释其自动化信用评分系统为何拒绝某些人的贷款申请。`1996
    年健康保险可携带性与责任法案`（`HIPAA`）对人们健康记录的使用提供了保护。《儿童在线隐私保护法案》（`COPPA`）涉及有关 13 岁以下儿童的数据等。在美国，没有专门针对收集个人数据或此类数据在自动化决策过程中如何使用的总括性立法。


    ### 欧盟

    对于组成欧盟的 28 个国家（其中包括世界前 10 大经济体中的 4 个，总人口超过 5 亿），情况则完全不同。多年来，他们对个人数据的监管及其使用方法采取了更为全面的方法。可以争论的是，世界上任何地方颁布的最重要的数据保护立法已
    2018 年 5 月 25 日在所有欧盟国家生效。《通用数据保护条例》（`GDPR`）对机构在如何收集、管理和处理人们的个人信息方面负有重大的责任。


    `GDPR` 适用于所有在欧盟运营的机构，即使它们的业务基地在其他地方。硅谷的科技巨头只要在任何欧盟成员国开展业务，就没有所谓的退出机制（opt out）。


    有人说法律是呆脑的驴，但如果你忽视了 `GDPR`，它会踢你一脚。未能遵守 `GDPR` 的机构将根据其发生的每项违规行为，面临最高达其发生违规行为年度全球营业额（而非利润）
    4% 的罚款。即使你不住在欧盟，花一点时间深入了解它也是值得的，因为揭示了许多其他国家和管辖区数据保护立法的发展方向。


    `GDPR` 采取了基于权利的方法。支撑它的基石是个人对自己数据的所有权。个人有权决定谁可以访问其数据以及如何使用这些数据。关于我的数据是我的，它是我身份和特质的一部分。除非我许可，否则你没有权利持有或使用我的数据。未经我的许可存储我的数据或对我做出决定是非法的。我还有权改变我的主意。我今天可以允许你访问我的数据，但如果我不再让你使用它，你必须停止并删除关于我的信息。


    该立法也是基于原则的。这意味着在合规方面需要做什么方面，它并不是完全是规定性的。其目标是鼓励遵守法律精神，而不仅仅是法律条文。


    另一个需要考虑的因素是 `GDPR` 的焦点完全落在个人身上。它没有考虑机构为了合规而承担的成本。在理想情况下，企业辩称“如果不以某种方式处理数据将在经济上不可行或可能导致其破产”的范围非常有限。


    '
