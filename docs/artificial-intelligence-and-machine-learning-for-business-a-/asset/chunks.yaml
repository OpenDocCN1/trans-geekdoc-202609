- raw: 'Both groups referred to by these rules will contain lots of people who would
    like to buy whisky; i.e. >1% chance, but from an ethical perspective targeting
    children or people with alcohol problems is difficult to argue for. From a purely
    profit-orientated perspective, marketing to children is likely to be illegal and
    targeting such individuals could result in a significant amount of negative publicity.
    These two rules are a great example of why human expertise is required to support
    automated machine learning based systems, especially where systems are being used
    to make risky or controversial decisions about people.


    One highly publicized example of the algorithms running wild is the case of YouTube
    and its ad placement policy. In 2017, many large organizations withdrew their
    advertising from YouTube. This was because YouTube were found to be placing some
    of their adverts alongside material from terrorists and other unsavory sources.
    It was YouTube’s machine learning algorithms which decided which ads to place
    where that had caused the problem. Consequently, YouTube had to undertake a major
    review of its ad placement process^([\[5\]](#index_split_028.html#filepos407691)).
    As a result, many months later in 2018, they decided to revert to a manual vetting
    process. Every video clip had to be reviewed and approved by a real person before
    it was included in YouTube’s service which paired advertisers with popular content^([\[6\]](#index_split_028.html#filepos408110)).


    A reasonable question to ask is why it took almost a year for YouTube to figure
    out a solution? One can’t be certain as to the reason, but a very plausible answer
    is that they spent a lot of time trying to solve the problem using a solely automated
    (machine learning/AI) approach, before realizing that they needed to maintain
    a human element in the assessment process.


    The final thing required from an AI system is to issue the required response.
    In the whisky example, this is to send an appropriate discount code or coupon
    to the individuals who have been targeted. What this means is that in order to
    deliver the required action, the AI application needs to be linked to the organization’s
    marketing channels. If the AI is telling you that the appropriate response is
    to text millions of customers with offers, then it needs to be connected to the
    systems that can send texts. If texts, coupons, internet pop-ups, or whatever
    are being used to communicate the offers, then there is still a need for someone
    to design the wording and format of the communications in a way that is both appealing
    to customers and complies with relevant marketing legislation.


    The vast majority of AI applications rely heavily on prediction, driven by pattern
    recognition (i.e. machine learning/predictive analytics). Take speech recognition
    systems that support tools such as Apple’s Siri and Amazon’s Echo. Upon hearing
    a sound, a speech recognition system pre-processes that sound into a number of
    standardized soundbites. It will then try to identify what word it thinks has
    been spoken. This is based on a set of probabilities (scores) generated by a predictive
    model created using machine learning. If the system calculates that there is a
    5% chance that the sound is “Hello” 20% that it’s “Jell-O” and 75% that it’s “Mellow”
    then it will make an educated guess that the word spoken was “Mellow.”


    Advanced AI systems use layers of complex predictive models in combination to
    formulate a view as to what is going on around them, given the inputs that they
    receive. The next layer of the speech recognition system will consider phrases
    and word structure. The predictive elements of the system are then combined with
    decision rules (decision logic) to determine what actions to take when certain
    words or phrases are spoken.


    One common misconception is that machine learning and artificial intelligence
    are completely new, only entering the mainstream in the last few years. The reality
    is that research into business applications of machine learning was first undertaken
    in the early 1940s^([\[7\]](#index_split_028.html#filepos408535)) and machine
    learning has been used in the financial services industry since the 1950’s (credit
    scoring). Machine learning techniques were then applied to areas such as direct
    marketing, tax collection and insurance underwriting not long after that. Recent
    developments have been to put these types of tool into the home, into smartphones
    and other devices.


    Some machine learning/AI experts might dispute this view of history, arguing that
    it’s only with recent technological advances that machine learning has come into
    its own. However, if your definition of machine learning/AI encompasses using
    algorithms to identify patterns of behavior which drive autonomous decision-making
    systems, and these systems significantly outperform human experts, then the credit
    scoring systems of the 1950s satisfy that definition.


    What has changed in recent times are three things. First is the terminology. In
    the 1980s/1990s what is now termed machine learning/AI came under the title of
    “Data Mining” or “computational statistics.” It’s also the case that the theory
    underpinning the most common machine learning approaches in use today were developed
    before or during the 1990s^([\[8\]](#index_split_028.html#filepos409097)) (although
    many have been refined and extended since then).


    The second thing that has changed is the computer hardware and software that underpin
    machine learning. The shift to placing services online via smartphones, tablets
    and the internet means that there is now so much more information available about
    people than ever before, and the amount of information continues to grow year
    on year. The speed and storage capabilities of computers has also increased considerably.
    This makes it possible to process huge amounts of data quickly and cost effectively.
    Likewise, the complexity of machine learning algorithms and the predictive models
    they generate has increased by many orders of magnitude in just a few years.


    In parallel with the advances in hardware and algorithm design, there are now
    a whole host of software tools available for machine learning. Much of it free
    and/or open source (such as the R and Python programming languages) and available
    via one’s PC, laptop or cloud services offered by the IT giants such as Microsoft^([\[9\]](#index_split_028.html#filepos409701))
    and Google^([\[10\]](#index_split_028.html#filepos410126)).


    The third thing which has changed is the way that we interact with the underlying
    models and decision rules. We no longer have to type very rigid instructions on
    keyboards or have to interpret pages of detailed mathematical output. Instead,
    modern AI systems interact with us in much more human-like ways.


    Often the interfaces between humans and computers are themselves based on machine
    learning principles, driven by predictive models. If we return to the whisky sales
    example, I could use machine learning in the design of a chatbot to talk to people
    on social media about their drinking habits. The data gathered by the chatbot
    then supplements other data that I’ve gathered about people. If the whisky application
    determines that people should be given a discount offer, then this could be relayed
    back to customers via the chatbot in a conversational form, rather than the more
    traditional approach of sending them a coupon or discount code via text or e-mail.'
  fmt: "\nBoth groups referred to by these rules will contain lots of people who would\
