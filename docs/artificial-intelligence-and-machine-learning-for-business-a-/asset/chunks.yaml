    ## Big Data and Processing Technologies


    * **Storing massive amounts of data**: Traditional databases are limited in the
    amount of data that they can hold at reasonable cost. New ways of storing data
    has allowed an almost limitless expansion in cheap storage capacity.

    * **Data cleaning and formatting**: Diverse and messy data needs to be transformed
    into a standard format before it can be used for machine learning, management
    reporting or other data related tasks.

    * **Processing data very quickly**: Big Data is not just about there being more
    data. It needs to be processed and analyzed quickly to be of greatest use.


    The issue with traditional computer systems wasn’t that there was any theoretically
    barrier to them undertaking the processing required to utilize Big Data, but in
    practice they were too slow, too cumbersome and too expensive to do so.


    New data storage and processing paradigms, such as `Hadoop/MapReduce`, have enabled
    tasks which would have taken weeks or months to process to be undertaken in just
    a few hours and at a fraction of the cost of more traditional data processing
    approaches. The way that `Hadoop` does this is to store massive data sets across
    large networks (clusters) of cheap desktop computers, such as the ones you might
    have in your office or at home.


    `MapReduce` is one example of a programing language that shares data processing
    tasks across a computer network, such as a `Hadoop cluster`. Each computer in
    the cluster is tasked to independently processes the data it holds. The results
    from each individual computer are then brought back together and combined to deliver
    a final answer.


    Consider a company using `Hadoop` to store details of all of its billions of customer
    transactions across a network of several hundred computers. To summarize information
    about the transactions, such as summing up the financial value of all transactions
    that took place in the previous financial year, `MapReduce` would task each individual
    computer to sum up the details of the transactions it holds. Each computer then
    feeds its results back to a single controlling computer, which adds up the individual
    results to get the final number.


    In theory, tens of thousands of PCs can be connected together to deliver massive
    computational capabilities which are comparable to the largest supercomputers
    in existence. If you need more processing power, then all you need to do is just
    buy a few more standard desktop PCs and hook them into the network.


    `Hadoop` is available as a set of free (open source) programming tools and is
    used by many companies as part of their Big Data solutions. Many solutions suppliers
    have also taken the core `Hadoop` software and developed their own set of interfaces
    and supporting tools to provide tailored product offerings. Examples include `Cloudera`,
    `Hitachi Vantara`, `IBM`, `Microsoft`, `SAP` and `Teradata`, to name but a few.


    ## The Relationship between Big Data and Machine Learning


    Data (whether “Big” or “Small”) has no intrinsic value in itself. A big mistake
    that an organization can make is to think that if they invest in a mass storage
    system such as `Hadoop` and collect every scrap of data they can about people,
    then that’s going to add a lot of value to their business. However, all that data
    has to be worked into something useful if it’s going to be of benefit. Machine
    learning is the key tool that does that. The data needs to be processed to identify
    significant features and relationships in the data, and to produce predictive
    models that tell you something about people’s behavior based on what has happened
    before in the past.


    A good way to think about the relationship between Big Data and machine learning
    is that the data is the raw material that feeds the machine learning process.
    The tangible benefit to a business is derived from the predictive model(s), customer
    clustering or other analytical outputs that are delivered at the end of the process,
    not the data itself.


    Artificial intelligence, machine learning and Big Data, are therefore often talked
    about in the same breath, but it’s not a symmetrical relationship. You need machine
    learning to get the best out of Big Data, but you don’t need Big Data to be able
    use machine learning effectively. If you have a just few items of information
    about a few hundred people, then that’s enough to start to apply machine learning
    to do things such as building models and making predictions, applying clustering
    to customers and undertaking other types of data analysis.


    The more and better data that you have, the better your machine learning solutions
    will be, but having gigabytes or terabytes of data is not a prerequisite for practical
    machine learning.


    ## 13. Ethics, Law and the GDPR


    The use of machine learning and predictive models raises some interesting ethical
    questions. This is especially true when they are used to create automated decision-making
    systems that decide how people will be treated without any human involvement in
    the decision-making process.


    As automated decision-making systems become ever more prevalent across almost
    every aspect of our lives, then what we are saying is that we are no longer in
    control. Those once in positions of authority, whether it’s a bank manager deciding
    who to lend to or a doctor deciding who to treat, have ceded control to the computers.


    Is this a problem? If one could say categorically that the result would always
    be better outcomes for individuals then that would be acceptable to many people.
    However, it’s important to appreciate that in many, and possibly most, organizations
    are using machine learning for their own benefit. They are striving to achieve
    their own objectives (i.e. maximize profit) not yours. Whether or not the resulting
    outcomes benefit the people who are the subject of those decisions is not their
    primary concern.


    The implication is that as a society we need to be comfortable with the way that
    predictive models are being developed and deployed and that this aligns with our
    sense of what is right and proper. Appropriate checks and balances need to be
    put in place to prevent misuse of decision-making systems that rely on machine
    learning.


    One problem is that what constitutes “ethical use” is not always clear cut. There
    are a range of views and opinions as to what is or isn’t ethical when it comes
    to data and analytics. Therefore, what checks and controls are required is somewhat
    debatable.


    One argument is that if a predictive model generates more accurate predictions
    than a human expert and implementing that model results faster and more efficient
    decision-making, then using that model is obviously the right thing to do. However,
    it’s important to realize that the ends do not always justify the means. How one
    gets to a decision and what is acceptable by wider society is also important.


    Let’s start by thinking about the data that is used to make predictions about
    peoples’ behavior. Do you think it is acceptable to use information about someone’s
    gender, age, religion, marital status, sexual orientation or race when deciding
    how someone is dealt with? i.e. should this type of data be allowed to feature
    in a predictive model?


    To be fair, this is something of a trick question. The answer will be influenced
    by the type of decision being made. If we are talking about diagnosis or treatment
    of a medical condition, then most people would probably not be too concerned with
    any of this type of data being used if it leads to better outcomes for individuals.
    The fact that age and gender, for example, were predictive in the heart disease
    model (Figure 2) is not an issue. However, if we are talking about deciding who
    to hire or fire on the basis of things like gender or marital status, or charging
    people more for products and services because of their religion, then things are
    less clear.

    '
  trans: '


    ## 大数据与处理技术


    *   **存储海量数据**：传统数据库以合理成本能够存储的数据量非常有限。新的数据存储方式允许廉价存储容量进行近乎无限的扩展。

    *   **数据清洗与格式化**：多样化且混乱的数据在用于机器学习、管理报告或其他数据相关任务之前，需要被转换为标准格式。

    *   **极快速地处理数据**：大数据不仅仅是指数据量大。它需要被快速地处理和分析，才能发挥最大的作用。


    传统计算机系统的问题不在于它们在理论上是否存在能够利用大数据所需的所需的处理操作的障碍，而是在实践中，它们执行这些操作的速度太慢、太繁琐且成本太昂贵。


    新的数据存储和处理范式，例如 `Hadoop/MapReduce`，使得原本需要数周或数月才能完成的任务可以在几小时内完成，且成本仅为传统数据处理方法的一部分。`Hadoop`
    实现这一目标是将海量数据集存储在大型网络（集群）的廉价台式电脑上，例如你办公室或家里可能拥有的那种电脑。


    `MapReduce` 是编程语言的一种示例，它在计算机网络（如 `Hadoop cluster`）之间共享数据处理任务。集群中的每台电脑都被要求独立处理其所持有的数据。每台单独电脑的结果会被汇聚并合并，以提供最终答案。


    考虑一家公司使用 `Hadoop` 在由数百台计算机组成的网络上存储其数十亿客户交易的详细信息。为了对交易信息进行总结（例如计算上一财年发生的所有交易的财务价值），`MapReduce`
    会要求每台单独计算汇总其持有的交易详情。然后，每台电脑将其结果反馈给一台主控制计算机，由该计算机相加各个结果以获得最终数字。


    从理论上讲，可以将数万台 PC 连接在一起，提供与现存最大的超级计算机相媲的巨大计算能力。如果你需要更多的处理能力，你只需要多买几台标准台式 PC 并将它们连接到网络即可。


    `Hadoop` 以一套免费（开源）编程工具的形式提供，被许多公司作为其大数据解决方案的一部分使用。许多供应商还利用核心 `Hadoop` 软件开发了自自己的一套接口和支持工具，以提供定制化的产品服务。示例包括
    `Cloudera`、`Hitachi Vantara`、`IBM`、`Microsoft`、`SAP` 和 `Teradata` 等。


    ## 大数据与机器学习之间的关系


    数据（无论“大”还是“小”）其本身没有内在价值。一个机构可能犯的一个大错误是认为，如果他们投资了如 `Hadoop` 这样的大规模存储系统并收集了关于人的每一个碎片数据，就会为他们的业务增加大量价值。然而，所有这些数据必须被转化为有用的东西才能产生益处。机器学习就是实现这一点的关键工具。数据需要经过处理，以识别数据中的显著特征和关系，并产生预测模型，根据过去发生过的事情告诉你关于人类行为的信息。


    思考大数据与机器学习之间关系的一种良好方法是：数据是为机器学习过程提供原材料。对业务的实际利益来自于过程结束交付的预测模型、客户聚类或其他分析输出，而不是数据本身。


    因此，人工智能、机器学习和大数据经常被并在一起讨论，但它们并不是一种对称的关系。你需要机器学习来充分利用大数据的价值，但你并不需要大数据也能有效使用机器学习。如果你只有关于几百人的几项信息，这就足够开始应用机器学习来完成诸如构建模型和进行预测、对客户进行聚类以及进行其他类型的数据分析等工作。


    你拥有的数据越多越好，你的机器学习解决方案就会越好，但拥有 GB 或 TB 级的数据并不是实际机器学习的先决条件。


    ## 13. 伦理、法律与 GDPR


    机器学习和预测模型的使用引发了一些有趣的伦理问题。当它们被用于创建自动化决策系统，且这些系统在没有人类参与决策过程的情况下决定人们如何被对待时，这一点尤为真实。


    随着自动化决策系统在我们生活的几乎每一个方面变得越来越普遍，我们实际上是在说不再拥有控制权。那些曾经处于权威地位的人（无论是决定给谁贷款的银行经理，还是决定治疗谁的医生）都已将控制权交给了计算机。


    这是一个问题吗？如果能断言结果将总能为个人带来更好的产，那么许多人是可以接受的。然而，重要的是要意识到，许多（可能可能是大多数）组织正在为了自己的利益而使用机器学习。他们正努力实现自己的目标（例如利润最大化），而不是你的目标。产生的结果是否惠及这些决策的主体，并不是他们首要考虑的问题。


    这意味着，我们作为一个社会成员，需要对预测模型的开发和部署方式感到放心，并且这符合我们对是非和恰当的认知。需要建立适当的平衡机制，以防止依赖机器学习的决策系统被滥用。


    一个问题是，什么是“伦理使用”并不总是清晰明确的。关于数据和分析什么是伦理是不伦理，存在各种观点和意见。因此，需要哪些检查和控制是具有争议的。


    '
