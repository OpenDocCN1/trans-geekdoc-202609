    \ to do something that you’ve not been able to do before. Maybe this is to enter\
    \ new markets or provide different types of products and services.\n\nOne thing\
    \ to look out for is what I term the “data opportunist.” I’ve come across more\
    \ than one analytics company who have suggested that I just: “Employ a few of\
    \ our data scientists to see what we can discover from your data.” There is no\
    \ in-depth probing of what I or my organization does, what our problems are or\
    \ where our እንደሚ lie. It’s just assumed that by paying these guys to trawl my\
    \ data, and maybe churn out a few predictive models, they will deliver something\
    \ useful.\n\nI remember talking to a friend of mine recently, who had hired some\
    \ data scientists to do exactly this for his organization (a financial services\
    \ company). They said they could help him predict which customers were about to\
    \ cash in their investments. So, this was an attrition type problem – identify\
    \ customers who are likely to leave and then try to entice them to stay.\n\nMy\
    \ friend told me, that after many weeks of work, the data scientists he had hired\
    \ delivered a predictive model that essentially predicted retirement; i.e. people\
    \ approaching retirement tend to review their investments in preparation for giving\
    \ up work. The data scientists seemed very happy with what they had found. However,\
    \ this was something that my friend and everyone in the industry already knew.\
    \ The exercise added no value but cost tens of thousands of dollars to undertake.\
    \ I could describe a whole host of other similar situations, but I think you get\
    \ the idea.\n\nAnother thing you should do is think about what’s going on in your\
    \ industry and with your competitors. Talk to you network of contacts. See what\
    \ others are doing in your problem space. If no one else is using artificial intelligence/machine\
    \ learning technologies for that type of problem then you are in a high risk space.\
    \ Maybe you can be a trailblazer and can get ahead of the pack by being the first\
    \ to reap the benefits. Alternatively, maybe you are taking a massive gamble that’s\
    \ unlikely to pay off. If no one else has adopted the technology for that purpose\
    \ then that’s a risk.\n\nIf you have a high-risk culture, and taking chances is\
    \ all part of the game, then go for it. However, if like most of us, you are operating\
    \ in a more conservative environment and a potential risk of failure is getting\
    \ the sack, then think carefully before diving in. You need to do your homework\
    \ and make sure that the benefits that are promised will be delivered. At the\
    \ very least, when the dust settles many months later, you need to be able to\
    \ show that your decisions were rational and based on what you knew at the time.\n\
    \nOne possible strategy to follow when engaging with suppliers, particularly when\
    \ the value of a proposition is vague or uncertain, is to suggest a shared return\
    \ model of contractual engagement. A clearly defined set of objectives are agreed\
    \ up-front and the supplier takes a cut of the profit (or loss) that results.\
    \ If a suppler is selling you all the benefits of their machine learning based\
    \ solutions, but won’t entertain a shared risk/reward model of compensation, then\
    \ ask yourself why that might be? Even if you don’t really want to go down this\
    \ route, the response you get from the supplier will be informative.\n\nAlso bear\
    \ in mind that just because it’s possible to automate something doesn’t mean that\
    \ you have to or that it’s desirable to do so. Silicon Valley has a reputation\
    \ for developing innovative gadgets and then trying to find a market for them,\
    \ rather than starting with people’s problems and then trying to find solutions.\
    \ If we go back to self-driving cars – do we know how many people actually want\
    \ a self-driving car? The most recent consumer studies suggest that at the moment\
    \ it’s only a minority. That may change in time, but it’s something that the motor\
    \ manufactures should be mindful of.\n\nOverall, what I’m trying to get across\
    \ in this chapter is keep an open mind, but also a level head. AI and machine\
    \ learning present massive opportunities to do things better, more efficiently\
    \ and more cheaply. However, just like any other aspect of business – don’t jump\
    \ in until you know what the opportunities are, you know want you want to do and\
    \ why, and you’ve done a proper benefits case to support your decision. Good Luck!\n\
    \n## ## Concluding Remarks\n\nFirst, I would like to thank you for taking the\
    \ time to purchase and read this concise introduction to the world of artificial\
    \ intelligence and machine leaning for business. I hope that you now have an understanding\
    \ of what these things are, why they are important and how they work. Equally\
    \ importantly, I hope that you understand that while these are essentially mathematically\
    \ based topics, they can only realize their full potential when relevant business,\
    \ social, ethical, political and legal issues are taken into consideration.\n\n\
    If you liked the book, then please consider giving it a positive review on Amazon,\
    \ Goodreads or other review sites. As an independent publisher, this sort of support\
    \ is very helpful and is much appreciated.\n\nIf on the other hand, you felt the\
    \ book didn’t fill the void in your life that you were expecting it too, then\
    \ I’m very sorry to hear that. Please feel free to drop me a line to let me know\
    \ why at:\n\n`AI@relativistic.co.uk`\n\nLikewise, if you have any positive feedback\
    \ I’ll be more than happy to receive that too.\n\nSteven Finlay\n\n21st June 2018\n\
    \n## ## Appendix A. Evaluating Predictive Models\n\nOnce a predictive model has\
    \ been constructed it needs to be assessed to determine how well it predicts behavior.\
    \ Sometimes there is a single cut-off score that results in the business objective\
    \ being met, which can be established by looking at the score distribution (such\
    \ as those in figures). Similarly, for things like object recognition systems\
    \ where each score represents one outcome, you simply choose the outcome with\
    \ the highest score.\n\nIn many situations however, there is not one cut-off score\
    \ to choose. Instead, there is a range of possible cut-offs. Any one of these\
    \ cut-offs will deliver the original objective, but with different benefits and\
    \ drawbacks. Likewise, common practice is to build several predictive models.\
    \ The performance of the models are then compared against each other so that the\
    \ best one is chosen.\n\nIf you think back to the heart disease case study, used\
    \ throughout this book, then you will remember that we looked at a decision tree\
    \ model and a scorecard model. Both models provided solutions that met the stated\
    \ business objective; i.e. identify at least 50% of people who will develop heart\
    \ disease but invite no more than 5% of the entire population for a check-up.\
    \ However, the scorecard model performed better overall. This is because it identified\
    \ 62% of cases within the highest scoring 5% whereas the decision tree only identified\
    \ 55%\n\n could also argue that both models over delivered. They identified more\
    \ than the required 50% of cases. What this means is that there is actually some\
    \ flexibility in how the cut-off is chosen; i.e. there is more than one cut-off\
    \ that meets the objective. In this situation, two possible ways in which the\
    \ model could be used are:\n\n1. Maximize outcomes. Choose the cut-off which results\
    \ in exactly 5% of the population being invited for a check-up; i.e. use all available\
    \ resources. This will result in more than 50% of heart disease cases being identified\
    \ (this is the answer presented previously in the case study; i.e. the `521` cut-off\
    \ score for the scorecard or the `12` cut-off score for the decision tree).\n"
  trans: '


    -   创造新机会。机器学习作为一种赋能工具，让你能够完成以前无法做到的事情。这可能是为了进入新市场，或提供不同类型的产品和服务。


    需要留意的一点是我所说的“数据机会主义者”。我遇到过不止一家分析公司，他们建议我只需：“雇佣我们的几位数据科学家，看看我们能从你们的数据中发现什么。”他们并没有对我或我的组织在做什么、我们面临的问题是什么、或者我们的痛点在哪里进行深入探究。他们仅仅假设，通过付钱让这些人搜集我的数据，并可能产出几个预测模型，他们就能交付一些有用的东西。


    我记得最近和一位朋友聊天，他曾雇佣了一些数据科学家为他的组织（一家金融服务公司）做恰好的事情。他们说可以帮助他预测哪些客户即将变现投资。因此，这是一个流失类型的问题——识别出可能离开的客户，然后尝试留住他们。


    我的朋友告诉我，在工作了几个周后，他雇佣的数据科学家交付了一个预测模型，该模型本质上是在预测退休；即：接近退休的人倾向于审查自己的投资，为放弃工作做准备。数据科学家对他们的发现似乎非常满意。然而，这些是我朋友以及行业内每个人已经知道的事情。这项练习没有增加任何价值，却花费了数万美元成本。我可以描述许多其他类似的情况，但我想你已经明白我的意思了。


    你应该做的另一件事是思考你的行业以及你的竞争对手正在发生什么。与你的人脉网络交流。看看其他人在你的问题空间里做什么。如果没有其他人使用人工智能/机器学习技术来解决该类型的问题，那么你就处于一个高风险领域。也许你可以成为一个先驱，通过首批获益而领先于大家。或者，你可能在进行一场不太可能回报的巨额赌博。如果没有人为了该目的采用该技术，那就是一种风险。


    如果你拥有高风险文化，而且冒险是游戏的一部分，那么尽管去尝试吧。但是，如果你像我们大多数人一样，在一个更保守的环境中运营，失败的潜在风险是会被解雇，那么在投入之前请深思熟虑。你需要做好功课，确保承诺的收益能够实现。至少在几个月后尘埃落定时，你需要能够证明你的决策是理性的，并且是基于当时所知的信息。


    在与供应商合作时，特别是当提议的价值模糊或不确定时，可以采取的一种策略是建议共享回报的合同模式。预先约定一组明确的目标，供应商从产生的利润（或亏损）中抽成。如果供应商向你推销他们基于机器学习解决方案的所有优点，但不愿意接受共享风险/回报的补偿模式，那么问问自己为什么会这样？即使你并不真的想走这条路，从供应商那里获得的回复也将具有参考价值。


    另外请记住，仅仅因为某些事情可以自动化，并不意味着你必须这样做，或者这样做是理想的。硅谷的声誉是开发创新小装置，然后尝试为它们寻找市场，而不是从人们的问题开始尝试寻找解决方案。如果我们回到自动驾驶汽车——我们知道到底有多少人真正想要自动驾驶汽车吗？最近的消费者研究表明，目前这只是少数人的。这可能会随着时间改变，但这是汽车制造商应该注意的。


    总的来说，我在这一章中试图传达的是：保持开放的心态，也要保持清醒。人工智能和机器学习为更好、更高效、更廉价地完成任务提供了巨大的机会。然而，就像业务的其他任何方面一样——在不知道机会是什么、不清楚你想做什么以及为什么，并且没有做出支持你决策的适当效益分析之前，不要急于投入。祝运！


    ## ## 结语


    首先，感谢你花时间购买并阅读这本关于商业人工智能和机器学习世界的简明介绍。我希望你现在理解了这些东西是什么、为什么它们很重要以及它们是如何运作的。同样重要的是，我希望你理解，虽然这些本质上是基于数学的话题，但只有在考虑到相关的业务、社会、伦理、政治和法律问题时，它们才能发挥全部潜力。


    如果你喜欢这本书，请考虑在 Amazon、Goodreads 或其他评论网站给出好评。作为一家独立出版商，这种支持非常有帮助，并深表感谢。


    另一方面，如果你觉得这本书没有填补你预期的生活空白，那么我深表遗憾。请随时给我信告诉我原因，邮箱：


    `AI@relativistic.co.uk`


    同样，如果你有任何正面反馈，我也非常乐意接收。


    Steven Finlay


    2018 年 6 月 21 日


    ## ## 附录 A 评估预测模型


    一旦构建了预测模型，就需要对其进行评估，以确定其预测行为的程度。有时，单一的截止分就能实现业务目标，这可以通过查看评分分布（如图所示）来确定。同样，对于像目标识别系统这样每个分数代表一个结果的情况，你只需选择得分最高的结果即可。


    但在许多情况下，并没有某一个截止分可供选择。相反，存在一个可能的截止分范围。这些截止分中的任何一个都能交付目标，但具有不同的优缺点。同样，常见的做法是建立多个预测模型。然后对这些模型的性能进行比较，以便选出最好的一个。


    如果你回想书中一直使用的心脏病案例研究，你会记得我们查看了一个决策树模型和一个评分模型。这两个模型提供的解决方案都符合陈述的业务目标；即：识别至少 50%
    会患心脏病的人，但邀请人数不超过总人口的 5% 进行检查。然而，评分模型的整体表现更好。这是因为它在得分最高的 5% 人群中识别了 62% 的病例，而决策树只识别了
    55%


    也可以认为这两个模型都超额交付。它们识别了比要求的 50% 更多的病例。这意味着选择截止分时实际上有一定的灵活性；即：有多个截止分可以满足目标。在这种情况下，使用模型的两种可能方式是：


    1. 结果最大化。选择导致恰好 5% 人口被邀请检查的截止分；即：利用所有可用资源。这将识别超过 50% 的心脏病病例（这是之前在案例研究中给出的答案；即评分模型的
    `521` 截止分或决策树的 `12` 截止分）。


