    [Acknowledgements](#index_split_004.html#filepos4264)


    I would like to thank my family, and my wife Samantha in particular, for their
    support in writing this book. I would also like to extend my gratitude to all
    those readers of the previous edition who contacted me with suggestions, corrections,
    thoughts and ideas. I have incorporated the majority of these into this edition.
    I am particularly grateful to the reader who told me where I could buy an orange
    washing machine.


    [Foreword](#index_split_004.html#filepos4264)


    56 minutes one way. 112 minutes for the round trip. That’s the time it takes my
    commuter train to travel from my home town of Preston to the great British city
    of Manchester and back. I find this is an ideal time to catch up on a bit of reading.
    Therefore, I thought that a concise book about artificial intelligence and machine
    learning, which could be read in about this time, would be useful to people with
    not much free time on their hands.


    An understanding of machine learning is important because it’s having a huge impact
    across many aspects of our lives. In particular, it’s driving the explosion in
    “Artificial intelligence” applications in many areas such as language translation,
    autonomous robots and medical diagnosis.


    Artificial intelligence and machine learning are also having a direct impact on
    many everyday business functions. Automated systems, based on machine learning,
    are replacing numerous tasks that were once undertaken by people. This is giving
    organizations which embrace these technologies a competitive advantage over their
    rivals because of the efficiency savings and improved customer service that such
    systems can deliver.


    This new and updated edition of the book is considerably longer than the previous
    one. In particular, there are several new chapters covering a broader set of topics
    than before. However, I have striven to retain the “concise no-nonsense” style
    of the original. Not least, because this was a key feature that readers said they
    liked about it. Therefore, the book may now take a little longer than 112 minutes
    to read (maybe two round trips to Manchester rather than one), but I hope you
    find the time well spent.


    [1\. Introduction](#index_split_004.html#filepos4264)


    Do you have a smartphone or a credit card? Do you buy stuff from supermarkets
    or play computer games? Are you employed or use health care? If the answer to
    any of these questions is yes, then artificial intelligence and machine learning
    will be having an impact on your life in one way or another. This is because they
    are the primary tools organizations use to leverage the data they hold about you
    in order to decide how they are going to deal with you. They are used to inform
    organizations about how you are likely to behave under different circumstances,
    and hence the way that they should treat you in order to maximize their (and sometimes
    your) objectives.


    These technologies are now being used in almost every walk of life to improve
    processes and enhance peoples’ everyday experiences via “artificially intelligent”
    machines and computer interfaces. Amazon’s Echo, Apple’s Siri and Google Translate
    are just three well known software products that demonstrate the benefits that
    these technologies can deliver.


    These days, many products and services are also adaptive. They tailor their responses
    to the behavior of individual users. TV and music streaming services learn to
    identify the content you like, and present you with recommendations that you’ll
    no doubt be interested in. Change the type of music you listen to and their recommendations
    will change too. Likewise, you can buy heating systems which learn to anticipate
    when it’s the best time to turn the heating on so that you don’t have to bother,
    while at the same time optimizing energy usage to reduce your bills. These are
    further examples of artificial intelligence in action.


    This concise text provides a managerial (i.e. non-technical and no complex formulas)
    overview of artificial intelligence and machine learning, what they are and how
    they are used. No prior knowledge is assumed. To put it another way, if you can
    read and write and do basic arithmetic (there is a bit of arithmetic, but not
    that much) then you should be OK with the material in this book.


    A good question to ask at this point is: why do I need to know about these things?
    One reason is personal. Intelligent decision-making systems, based on machine
    learning, are widely used by organizations to decide how to treat you, your friends
    and your family. They use these tools to decide if you will receive a great offer
    or a poor one, if you should be placed at the front or the back of the queue,
    if you will be subject to a tax audit or treated as a suspect in a criminal case.
    Therefore, it’s not a bad idea to know something about these things so that you
    can understand why an organization may have treated you in one way and not in
    another.'
