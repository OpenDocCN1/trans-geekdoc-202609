  trans: "\n也就是说，单个神经元的输出（以及没有第二层的神经网络）等同于逻辑回归，逻辑回归是机器学习中常用的一种统计方法，用于寻找与评分卡相关的分值。\n\
    \n这假设网络第一层有 74 个神经元，第二层（输出层）有 1 个神经元。在第一层中，74 个神经元中的每一个对于 100 个输入变量中的每一个变量都有一个权重（7,400\
    \ 个权重）。输出层中的神经元有 74 个权重，对应第一层神经元的每个输出一个一个。因此，总共有 7,474 个权重。\n\n这是因为标准的神经网络（即将所有输入都提供给第一层中的每个神经元）没有考虑到图像的空间特性。例如，图像左上角的像素通常与右下角的像素没有关系。因此，不将所有输入都提供给每个神经元是有意义的。\n\
    \nGoogle Research Blog (2016). ‘AlphaGo: Mastering the ancient game of Go with\
    \ machine learning.’\n[`research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html`](https://research.googleblog.com/2016/01/alphago-mastering-ancient-game-of-go.html).\
    \ Accessed 06/04/2018.\n\n也存在监督聚类的形式。其中一个例子是流行的 K-近邻算法。当需要对新案例进行预测时，算法会在开发样本中找到与该案例最相似的\
    \ `K` 个案例。模型得分的计算方法是这 `K` 个案例中显示出行为（结果）的比例。如果 `K=200`，那么算法将找到与需要预测的案例最相似的 200\
    \ 个案例。假设 200 个案例中有 18 个显示了该行为，那么得分就是 0.09（`18/200`）。使用什么取值的 `K`，通常通过试错来决定。\n\n\
    有一些分析工具可以将大量数据项目压缩为 2 维或 3 维的表示，这种表示捕捉了这些数据项目最重要的特征。这些方法的示例包括主成分分析和自组织映射（SOMs）。\n\
    \nExperian 的 Mosaic 分类也存在于美国、德国和许多其他国家。许多其他公司也提供基于聚类的客户画像产品。\n\n通常情况下，这将通过减去变量的平均值然后除以标准差来实现。\n\
    \n[`www.experian.co.uk/blogs/latest-thinking/consumer-segmentation-new-data-means-new-insight/`](http://www.experian.co.uk/blogs/latest-thinking/consumer-segmentation-new-data-means-new-insight/)\
    \ accessed 18/03/2018.\n\n要预先决定正确的聚类数量是非常困难的。因此，通常采用试错法。使用不同的 `K` 值多次运行聚类算法。对于每个\
    \ `K` 值，都会检查结果聚类的属性，如果被认为足够有趣（聚类具有明显的不同特征），那么该值就是要使用的 `K` 值。如果聚类太多，那么某些聚类往往会非常相似。如果聚类太少，那么解决方案提供的粒度可能不足。\n\
    \n聚类中心的计算方法是：使该点与聚类内所有案例之间的距离之和尽可能小的点。\n\n[`zbmath.org/about/`](https://zbmath.org/about/)\
    \ \n\n2016 年，medline 数据库增加了 869,666 篇论文。[`www.nlm.nih.gov/bsd/stats/cit_added.html`](https://www.nlm.nih.gov/bsd/stats/cit_added.html)\
    \ Accessed 04/04/2018.\n\n在国际象棋中，分配给兵的标准分值为 1，主教为 3，车（城堡）为 5，依此类推。因此，可以通过相加双方在棋盘上剩余棋子的价值来确定对游戏的简单判断。当然，在比赛期间对谁获胜进行实际评估要比这复杂得多。所有高级象棋程序都认为棋子的位置同样重要，甚至更为重要。然而，一种基于分数的成功标准非常容易理解和计算。\n\
    \nKnapton, S. and Watson, L. (2017). ‘Entire human chess knowledge learned and\
    \ surpassed by DeepMind's AlphaZero in four hours.’ The Telegraph. [`www.telegraph.co.uk/science/2017/12/06/entire-human-chess-knowledge-learned-surpassed-deepminds-alphazero/`](https://www.telegraph.co.uk/science/2017/12/06/entire-human-chess-knowledge-learned-surpassed-deepminds-alphazero/)\
    \ Accessed 09/04/2018.\n\n实际上，你可以做到这一点——只要你使用的是模拟器而不是真实的飞机。这种方法是许多机构在开发自动驾驶汽车时正在追求的方法之一。\n\
    \n如果它们被包含在机器学习过程中，将看到模型在整体准确率方面有所提高，但这不能代表在其余人群中衡量的准确率。\n\n一种幼稚的采样方法只是随机抽取，例如每\
    \ 10 个取 1 个或每 100 个取 1 个。好得多的方法是采用分层抽样。对感兴趣的案例抽取大部分，对不重要的案例抽取较小比例。如果你正试图预测谁会偿还或违约贷款，那么最相关的案例是违约案例，而通常这些案例并不多——它们是稀有事件。因此，你会抽取所有的违约案例，只抽取一小部分非违约案例。\n\
    \n标准差是一个显而易见的选择。\n\n一种可能导致这种情况的“学生气”型错误是预测了意图的反面；也就是说，模型得分代表人们偿还贷款的概率，而不是违约的概率。当模型预测违约概率非常低，例如\
    \ 0.001% 时，实际上恰恰相反——概率是 99.99%！\n\n将客户语音转换为数字格式的过程本身将使用一个机器学习得的模型完成。这个初步模型会识别所说的单词，并用数字引用替换实际单词。这些数字引用将被用于创建输入所讨论的决策模型的各种数据项。\n\
    \n1/5 实际上是边际误差率。在实践中，误差率会低于此值，因为某些电话接通时的概率在 80% 到 100% 之间\n\n"
