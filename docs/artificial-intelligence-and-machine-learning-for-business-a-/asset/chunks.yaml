- raw: "*   There are lots of weights. Figure 8 is a very simple network. It has just\
    \ 8 input variables and 5 neurons, but there are 36 weights. A typical business\
    \ application with say, 100 input variables and 75 neurons, would have 7,474 weights^([\\\
    [33\\]](#index_split_028.html#filepos420011)).\n\nOnce a neural network has been\
    \ created it can be assessed and used in the same way as scorecards and decision\
    \ trees; i.e. scores are created for a validation sample, which is then used to\
    \ produce score distribution tables such those in Figures 3 and 6. These are then\
    \ used to derive decision rules about what to do with cases given the score that\
    \ they receive.\n\nThe collection of weights in the network represent the patterns\
    \ that the training algorithm has identified. So how does the training algorithm\
    \ determine what the weights should be? There are many different algorithms that\
    \ have been created to find the weights in a neural network, but they all tend\
    \ to adopt the following principles:\n\n1.  Assign each weight a random or zero\
    \ value.\n\n>   \n\n1.  Calculate the scores generated by the network for all\
    \ of the cases in the development sample.\n\n>   \n\n1.  Assess how accurate the\
    \ final score is. For example, by assessing the lift and gain properties of the\
    \ model, as detailed in Appendix A.\n\n>   \n\n1.  Adjust the weights so as to\
    \ improve the predictive accuracy of the model.\n\n>   \n\n1.  Repeat steps 1-4\
    \ until no further significant improvement in model performance is observed, or\
    \ a certain amount of time has elapsed.\n\nThe clever bit is in Step 4, how one\
    \ adjusts the weights. The simplest approach is just to randomly try different\
    \ values and see what works best. However, this is very inefficient and is unlikely\
    \ to yield a good solution in realistic time. All practical neural network training\
    \ algorithms are cleverer than this. They adopt a variety of different weight\
    \ adjustment strategies based on the differences in performance between each iteration\
    \ of the algorithm. They will make big adjustments to the weights at the start\
    \ of the process when it’s easy to obtain large improvements in predictive performance,\
    \ and then gradually make smaller changes as performance improves so as to home\
    \ in on the optimum solution.\n\nThe neural network in Figure 8 has a single neuron\
    \ in the second layer (Neuron 5) which generates a single score. This score represents\
    \ the likelihood of someone having a heart attack in the next 5 years. If the\
    \ network was being used for a problem where there were multiple events being\
    \ predicted then there would be a separate neuron to represent each event. For\
    \ problems such as object recognition, there could be hundreds or even thousands\
    \ of scores being generated by the neurons in the final layer. Each score would\
    \ represent the probability of the item being one particular object. The object\
    \ associated with the highest score would then be taken as the prediction generated\
    \ by the system.\n\nThe reason why neural networks are so popular is their ability\
    \ to detect subtle patterns in data which other simpler methods, such as scorecards\
    \ and decision trees, may not be able to detect. This means that they can potentially\
    \ produce more accurate predictions. This is achieved by having the two layers\
    \ of neurons, with the scores from the first layer providing the inputs to the\
    \ second layer.\n\nThe main drawback of neural networks is that the scores that\
    \ they generate are not intuitive. Yes, one can see what the various weights in\
    \ the model are and understand the overall score calculation, but if I was to\
    \ ask you which input variable in Figure 8 contributes the most to the final score,\
    \ then this is much less obvious than for the scorecard and decision tree models\
    \ of heart disease. This is potentially a problem if there is a business or legal\
    \ requirement to explain how the final model score was arrived at.\n\nDeep learning\
    \ represents the latest evolution of neural network type models. The neural network\
    \ in Figure 8 has two layers of neurons and this structure is used very successfully\
    \ in many traditional neural network applications. However, there is no reason\
    \ why there can’t be many more layers. Consider the network in Figure 9. It has\
    \ the same initial inputs as the network in Figure 8. There is also a single output\
    \ neuron (Neuron 13) which delivers the final model score. However, the network\
    \ in Figure 9 has 4 layers of neurons compared to just 2 layers in Figure 8.\n\
    \nIn theory, there is no reason why the network could not be extended even further.\
    \ There could be 5, 6, 7, …, 100+ layers if desired, with different numbers of\
    \ neurons in each layer. What one tends to find is that as more layers are added,\
    \ so the ability of the network to identify complex and/or subtle patterns increases.\
    \ The more layers the “deeper” the network. Generally speaking, anything with\
    \ more than 2 or 3 layers can be classified as a “deep” network, but there is\
    \ no single accepted definition.\n\n![](images/00013.jpg)\n\nAs well as expanding\
    \ the number of neurons and layers in a network, other avenues of research associated\
    \ with deep learning consider how the neurons in the network are connected. In\
    \ a standard network, as in Figures 8 and 9, all of the neurons in each layer\
    \ are connected to all of the neurons in the next layer. However, other configurations\
    \ are possible. For example, not connecting all inputs to all of the neurons in\
    \ the first layer (a convoluted neural network). This works particularly well\
    \ for certain types of problem such as image recognition^([\\[34\\]](#index_split_028.html#filepos420513)).\n\
    \nAnother variant on standard neural networks is to create feedback loops such\
