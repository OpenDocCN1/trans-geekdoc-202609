    # 1. 最小化资源


    选择一个恰好使得 50% 的心脏病病例被邀请检查的截断值。这意味着将少于 5% 的人口被邀请检查，因为将选择高于 `521` 的截断分。


    选择哪个选项取决于卫生部门最看重什么。如果它希望最大化心脏病的识别率，那么选项 1 是最佳的。如果它希望尽可能少使用资源，那么选项 2 更好。当然，卫生部门也可以选择介于这两个极端之间的截断分。


    更一般地说，在这些情况下，选择截断值时有两个考虑因素：


    *   **纯度（提升率 Lift）。** 如果选择较高的截断值，那么只有少数病例会被选中，但在选中的病例中，会有很大比例的人表现出你感兴趣的特征。

    *   **量（增益 Gain）。** 如果选择较低的截断值，则会选中更多的病例，总体而言更多感兴趣的病例位于所选组内（即截断值以上的人）。然而，被选病例的纯度将会下降；也就是说，截断值以上的人中，表现出你感兴趣特征的比例会降低。


    为了帮助决定截断策略以及纯度与量级之间的权衡，有两种用于评估不同截断策略影响的常用工具：提升图（Lift Charts）和增益图（Gains Charts）。它们提供了模型性能的易于使用的视觉化表示。


    从提升图开始，它们提供了一种纯度的视图。图 13 提供了图 2 中所示的心脏病评分卡提升图示例。


    ![](img/00012.jpg)


    在图 13 中，X 轴显示了邀请检查的人口比例。Y 轴显示了被邀请的人中预计在 5 年内患疾病的比例。虚线是基准率（base rate）。基准率是大人群中预计未来
    5 年内患心脏病的人的百分比，即 `6%`。换句话说，基准率代表邀请检查的随机选择策略。


    实线曲线显示了如果决定谁参加检查的优先级排序基于评分卡模型的分数，将会发生什么。例如，图表显示，如果邀请得分最高的 40% 人口参加检查，那么其中约 15%
    的人将来会患上心脏病。如果减少量，例如仅邀请 10% 的人参加检查，那么比例（纯度）将上升到 `50%` 左右。


    医疗干预的目标比例越小，患病比例就越高。换句话说，如果你只针对人口中得分极高的少数人，那么可以预期被选这些人中有很大比例的人患有心脏病。然而，如果通过包含得分较低的人来扩大邀请群体，那么整体正确识别的比例（纯度）将会下降。


    因此，提升图是比较量与纯度之间权衡的一种。


    ## 提升图是如何产生的？


    图 14 显示了分数分布的扩展版本。


    在图 13 中，X 轴显示了邀请检查的人口比例。Y 轴显示了被邀请的人中预计在 5 年内患疾病的比例。虚线是基准率。基准率是大人群中预计未来 5 年内患心脏病的人的百分比，即
    `6%`。换句话说，基准率代表邀请检查的随机选择策略。


    实线曲线显示了如果决定谁参加检查的优先级排序基于评分卡模型的分数，将会发生什么。例如，图表显示，如果邀请得分最高的 40% 人口参加检查，那么其中约 15%
    的人将来会患上心脏病。如果减少量，例如仅邀请 10% 的人参加检查，那么比例（纯度）将上升到 `50%` 左右。


    医疗干预的目标比例越小，患病比例就越高。换句话说，如果你只针对人口中得分极高的少数人，那么可以预期被选这些人中有很大比例的人患有心脏病。然而，如果通过包含得分较低的人来扩大邀请群体，那么整体正确识别的比例（纯度）将会下降。


    因此，提升图是比较量与纯度之间权衡的一种。


    图 14 显示了分数分布的扩展版本。


    ## 附录 B 更多信息和推荐阅读


    以下是机器学习、人工智能及相关技术（大数据、数据挖掘等）的一些主要的网络资源。


    '
