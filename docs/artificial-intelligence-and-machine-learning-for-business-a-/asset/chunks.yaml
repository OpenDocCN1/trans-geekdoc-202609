    *   This means that while 74% of those invited are expected to develop heart disease,
    the remaining 26% invited for a check-up don’t really need one.


    The model is not perfect. It gets things wrong 26% of the time, but it’s performance
    is far far better than selecting people at random for check-ups. With only 6%
    of the population expected to develop heart disease in the next five years, a
    random invitation strategy would result in 94% (100% – 6%) of the check-ups being
    wasted on people who were not going to develop heart disease in the first place.


    Score distribution tables, such as those in Figure 4, underpin all of the reporting
    and performance metrics that support the evaluation and use of predictive models.
    In real world applications they tend to be much more granular (have more rows)
    and contain additional columns containing information such as cumulative ascending/descending
    numbers and percentages, to aid with calculations.


    Some people, particularly old hands like me who began doing machine learning before
    tools like `Excel` were common, prefer to work directly from score distribution
    tables like the one in Figure 4. However, these days, there are many superb visualization
    tools that can be used to present the results from the score distribution table
    in more intuitive and user friendly ways. The best tools are also interactive.
    They allow you to experiment with different models, constraints and cut-off strategies
    to find the best decision rules for your particular problem.


    Two of the most popular ways of providing a graphical representation of a score
    distribution table are Lift charts and Gain charts. These are described in Appendix
    A.


    ## 7. That’s Scorecards, but What About Decision Trees?


    Decision trees are another popular type of predictive model. Like scorecards,
    they are also very easy to understand and use.


    To demonstrate what decision trees look like and how they work, let’s continue
    with the problem of heart disease. If you recall, the objective is to find a way
    to identify at least half of those who will develop heart disease, but to invite
    no more than 1 in 20 (5%) of the population for a check-up with their doctor.


    To build a decision tree model, the 500,000 cases that were used to build the
    scorecard are used again, but this time a different type of algorithm is applied
    to the development sample. All popular decision tree algorithms are variations
    on the theme of repeatedly splitting the development sample into smaller and smaller
    groups. The following is a simple description of a decision tree algorithm:


    > Step 1. Pick one data item in the development sample (e.g. `income`).


    > Step 2. Find the value of `income` which results in the best partitioning of
    the data into two parts. By “best” I mean a low income group and high income group
    such that the incidence of heart disease is maximized in one group and minimized
    in the other.


    > Step 3. Repeat steps 1 and 2 for all other data items in the development sample
    (i.e. replace `income` with `age`, `BMI`, `smoker` etc.)


    > Step 4. From what has been found in steps 2 and 3, split the development sample
    into two parts using the best partition found; i.e. split the development sample
    such that the incidence of heart disease is maximized in one split and minimized
    in the other.


    > Step 5. Repeat steps 1-4 for each of the two resulting parts of the development
    sample. Keep doing this until no more significant differences can be found from
    further splitting.


    Figure 5 shows the structure of a decision tree model derived from the heart disease
    development sample, once all the splitting criteria have been applied.


    ![](images/00015.jpg)


    In Figure 5, the algorithm has begun by identifying that the most significant
    variable is `age`. The development sample is segmented based on if someone is
    greater or less than 52 years old. For those aged less than 52, the algorithm
    has then determined that the next most significant split is based on `BMI`. However,
    for those aged 52 or more, the next most important variable is if someone is a
    `smoker`, and so on.


    To calculate a score for someone using the decision tree, one starts at the top
    of the tree at the first node (`Entire population`). One then moves down the tree.
    At each branching point the node is chosen that fits that person’s individual
    characteristics. If someone is less than 52 years old the left hand side of the
    tree is followed. If they are aged 52 years or more then the right hand branch
    is followed. The process is repeated at each decision point until there are no
    further decisions to be made. The final node in the tree (called an `end node`
    or `leaf node`) into which a person falls determines their score.


    In Figure 5, there are 13 end nodes (shaded in grey and numbered) and hence 13
    scores that someone can receive. Those scoring 1 have the lowest chance of developing
    heart disease, those scoring 13 the highest.


    In terms of how the scores generated by the decision tree are used, the process
    is virtually identical to the way one would use the scores from the scorecard.
    The details of the 500,000 people from the validation sample are run through the
    decision tree to obtain scores, and a score distribution table is then produced
    showing how the scores are distributed. Figure 6 shows the score distribution
    table for the decision tree.


    Going through the same process that we followed for the scorecard, the highest
    scoring 5% of the population is covered by those scoring 12 or 13. Of these, 16,910
    subsequently go on to develop heart disease, which is 55% of the total number
    of cases. Therefore, the targeting strategy for inviting people for a check-up
    is to invite all those scoring 12 or 13.


    Like the scorecard, this strategy also meets the stated objective of inviting
    no more than 5% of the total population for a check-up, but having at least half
    of those who will go on to develop heart disease within that 5%


    ![](images/00001.jpg)


    OK. We now have two models. The question that will now be on many peoples’ lips
    is: which is the best model? Is it the scorecard or the decision tree? When people
    ask this question, what they usually want to know is: which model generates the
    most accurate predictions?


    In this example, both models provided sufficient predictive accuracy to meet the
    stated objective. However, the scorecard is better. The reason why it’s better
    is because if you use the scorecard to decide which 5% of the population to invite
    for a check-up (those scoring 521 or more), you would expect to invite 62% of
    those who go on to develop heart disease. The decision tree on the other hand
    only identifies 55% of them (those scoring 12 or 13).


    At this point it’s worth making some observations about the similarities and differences
    between the decision tree model and the scorecard model. Some important things
    to note are:


    > • The decision tree and scorecard use similar, but not identical, data items
    to make their predictions. The scorecard includes `annual income` but the decision
    tree does not. `Graduate` features in the decision tree model but not the scorecard.


    > • The branch conditions in the decision tree don’t always align with the score
    ranges in the scorecard. In the scorecard, age breaks occur at 49 and 57, but
    in the decision tree, the key age split is at 52 years old (with additional age
    splits further down the tree).


    > • The decision tree generates 13 possible scores, whereas there are hundreds
    of scores that can be generated by the scorecard; i.e. the scorecard generates
    a much more granular range of scores than the decision tree.

    '
  trans: '


    *   这意味着，虽然受邀者中预计有 74% 会患上心脏病，但其余 26% 被邀请体检的人实际上并不需要检查。


    该模型并非完美。它有 26% 的概率会出错，但其表现远优于随机选择人群进行体检。由于预计未来五年内仅有 6% 的人口会患心脏病，随机邀请策略将导致 94%（100%
    – 6%）的体检浪费在那些根本不会患上心脏病的人身上。


    评分分布表（如图 4 所示）是支持评估和使用预测模型的所有报告和性能指标的基础。在现实世界的应用中，这些表格通常粒度更细（行数更多），并包含额外的列，其中含有累积升/降序数值和百分比等信息，以辅助计算。


    某些人，特别是像我这样在 `Excel` 这种工具普及之前就开始接触机器学习的“老手”，更倾向于直接根据图 4 所示的评分分布表工作。然而，如今有许多卓越的可视化工具，可以用更直观、更符合用户的方式来展示评分分布表的结果。最好的工具还是交互式的。它们允许你对不同的模型、约束和截断策略进行实验，以为你的特定问题找到最佳决策规则。


    提供评分分布表图形化表示的两种流行方式是提升图（Lift charts）和增益图（Gain charts）。这些在附录 A 中有描述。


    ## 7. 这是评分卡，那决策树呢？


    决策树是另一种流行的预测模型。与评分卡一样，它们也非常容易理解和使用。


    为了演示决策树的外观以及如何工作，让我们继续讨论心脏病的问题。如果你还记得，目标是找到一种方法识别出至少一半将患心脏病的人，但邀请的人数不超过总人口的 1/20（5%）去医生那里体检。


    为了构建决策树模型，再次使用了用于构建评分卡的 500,000 个案例，但这次对开发样本应用了不同类型的算法。所有流行的决策树算法都是反复将开发样本拆分为越来越小小组这一主题的变体。以下是决策树算法的简单描述：


    > 步骤 1. 从开发样本中选择一个数据项（例如 `income`）。


    > 步骤 2. 找到 `income` 的值，使得数据能够最优地分为两部分。我所说的“最优”是指一个低收入组和一个高收入组，使得心脏病的发病率在一组最大，在另一组最小。


    > 步骤 3. 对开发样本中的所有其他数据项重复步骤 1 和 2（即将 `income` 替换为 `age`、`BMI`、`smoker` 等）。


    > 步骤 4. 根据步骤 2 和 3 的发现，使用找到的最优划分开发样本拆分为两部分；即拆分开发样本，使得心脏病的发病率在其中一次划分中最大，在另一次中最小。


    > 步骤 5. 对开发样本的两个部分中的每一个重复步骤 1-4。持续这样做，直到无法通过进一步拆分发现更显著的差异。


    图 5 显示了在应用所有拆分标准后，从心脏病开发样本得出的决策树模型结构。


    ![](img/00015.jpg)


    在图 5 中，算法首先识别出最显著的变量是 `age`。根据人们是否大于或小于 52 岁对开发样本进行分割。对于年龄小于 52 岁的人，算法随后确定下一个最显著的拆分是基于
    `BMI`。然而，对于年龄 52 岁或以上的人，下一个最重要的变量是他们是否是 `smoker`，以此此类推。


    使用决策树为某人评分，是从树顶部的第一个节点（`Entire population`）开始。然后向下向下移动。在每个分支点，选择符合该个人特征的节点。如果某人小于
    52 岁，则遵循树的左侧。如果他们是 52 岁或以上，则遵循右侧分支。在每个决策点重复此过程，直到没有进一步的决策要做出。人所在的终止节点（称为 `end
    node` 或 `leaf node`）决定了他们的分数。


    在图 5 中，有 13 个终止节点（用阴影标记并编号），因此人们可以接收 13 种分数。得 1 分的人患心脏病的概率最低，得 13 分的人概率最高。


    至于决策树生成的评分如何使用，该过程与使用评分卡评分的方法几乎相同。将验证样本中的 500,000 人的细节通过决策树获得评分，然后生成评分分布表，显示分数的分布情况。图
    6 显示了决策树的评分分布表。


    通过遵循与评分卡相同的流程，得分最高的 5% 人口被得 12 分或 13 分的人覆盖。这些人中，有 16,910 人随后患上了心脏病，占总病例数的 55%。因此，邀请人们体检的针对策略是邀请所有得
    12 分或 13 分的人。


    与评分卡一样，该策略也符合既定目标：邀请不超过总人口 5% 的人群体检，但在 5% 中包含至少一半未来将患心脏病的人。


    ![](img/00001.jpg)


    '
