- raw: "1.   Data Immutability. There are some characteristics people are born with.\
    \ These can’t change. If decisions are made on the basis of things such as age\
    \ and ethnic origin, then that’s far more controversial than data that results\
    \ from people’s lifestyle choices, which are more dynamic and changeable. For\
    \ example, the music people like or what they watch on TV. \n\n>   \n\n1.   Impact\
    \ (significance). What effect is a decision going to have? A life or death decision\
    \ about cancer treatment is much more important than something trivial such as\
    \ deciding whether or not to send someone a 10% discount voucher for frozen pizza.\
    \ \n\nBringing these three considerations together, it’s when high impact decisions\
    \ are being made using immutable data, purely for the benefit of the decision\
    \ maker that the greatest ethical risks arise. Great care needs to be taken to\
    \ ensure that the decision-making system is fair, displays no unacceptable bias\
    \ and hence, does not expose the decision maker to accusations of misbehavior.\
    \ I’m not saying that an organization can’t use high impact immutable data to\
    \ further their own ends, but that they need to be careful and be ready to respond\
    \ to any challenges about the way they use that data.\n\nIf an organization identifies\
    \ that it is using predictive models to take what are potentially “High risk”\
    \ ethical decisions, then what should it do? The answer is to take mitigating\
    \ action as follows:\n\n> 1.  Try to identify at-risk groups. The way to do this\
    \ is to produce separate score distribution reports for groups such as women,\
    \ ethnic minorities, children and so on. It can then be seen if there is any bias\
    \ in the resulting scores; i.e. which groups tend to get lower than average scores\
    \ and will therefore be adversely treated compared to the wider population. \n\
    \n>   \n\n> 2.  For those groups that score less well than the population average,\
    \ constraints and override rules should be used to ensure that they are treated\
    \ in a fair way. Likewise, different cut-offs may need to be set for at risk groups.\
    \ \n\n>   \n\n> 3.  Continue to monitor the situation once the decision-making\
    \ system goes live. Regularly review the score profile and decision rules for\
    \ key groups. Cut-offs, constraints and overrides should then be fine-tuned as\
    \ required. \n\nTo illustrate this approach, let’s think about an employment scenario.\
    \ Consider a predictive model which is used to decide who to hire. A high score\
    \ from the model indicates that the person is likely to be successful in the role,\
    \ a low score less so. A concern might be that older men or people with young\
    \ children are treated unfairly (which would potentially be in breach of EU law\
    \ if the model was being used in that region). This is not to say that there isn’t\
    \ evidence that older men or people with children perform worse in their roles\
    \ and would be worse hires than other people, but that it would be socially unacceptable\
    \ to treat these groups differently. An ethically questionable system would be\
    \ one where there was a single predictive model and a single cut-off score was\
    \ applied to decide who to hire.\n\nA more robust approach, is to start by producing\
    \ separate score distributions for older men and people with children. These are\
    \ then compared against the score distribution for all potential hires. If necessary,\
    \ separate cut-offs are then applied. This is to ensure that the proportion of\
    \ people who are offered jobs in these two groups is the same as for the rest\
    \ of the population.\n\nAnother similar approach, is to construct separate models\
    \ for each group. One model is built for the general population, one for older\
    \ people and another for people with young children. Separate cut-off rules are\
    \ then applied to each model to ensure that a consistent and aligned decision-making\
    \ strategy occurs.\n\nSo far in this chapter we have focused on developing an\
    \ ethical framework for dealing with personal data and how it can be applied in\
    \ a general setting; i.e. what we have discussed is universally applicable to\
    \ a wide range of situations wherever in the world one resides. Thinking about\
    \ these issues will help you deal with individuals in a morally appropriate way\
    \ (meaning you can sleep easy at night). However, as noted earlier in this chapter,\
    \ governments and regulatory authorities around the world are introducing much\
    \ tighter legal and regulatory controls over how organizations gather, store and\
    \ use personal data. Therefore, regardless of how ethical an organization believes\
    \ it is, it also has to comply with all relevant laws and regulations in the regions\
    \ within which it operates.\n\nLaws around the use of personal data and its use\
    \ in automated decision-making have existed in many countries for decades but\
    \ differ widely in scope and application. Some countries have very detailed regulation\
    \ relating to personal data, while others have none at all.\n\nIn the US, regulation\
    \ is narrowly targeted at specific uses of personal data. The Equal Credit Opportunity\
    \ Act 1974 (ECOA) requires lenders to explain why their automated credit scoring\
    \ systems decline people for credit. The Health Insurance Portability and Accountability\
    \ Act 1996 (HIPAA) provides safeguards around the use of people’s health records.\
    \ The Children's Online Privacy Protection Act (COPPA) relates to data about children\
    \ under the age of 13 and so on. In the US there is no overarching legislation\
    \ specifically around the gathering of personal data or how that data is used\
    \ in automated decision-making processes.\n\nFor the 28 countries that comprise\
    \ the European Union, which includes 4 of world’s 10 biggest economies with a\
    \ combined population of more than half a billion, it’s a very different story.\
    \ A much more comprehensive approach to the regulation of personal data and how\
    \ it can be used has been adopted for many years. What can be argued is the most\
    \ significant data protection legislation ever enacted anywhere in the world came\
    \ into force in all EU countries on 25^(th) May 2018. The General Data Protection\
    \ Regulation (GDPR) places great responsibilities on organizations over how they\
    \ gather, manage and process peoples’ personal information.\n\nThe GDPR applies\
    \ to all organizations operating in the EU, even if their base of operations is\
    \ elsewhere. There is no opt out for the tech giants operating out of Silicon\
    \ Valley if they do business in any EU member state.\n\nIt’s been said that the\
    \ law is an ass, but the GDPR will kick yours if you ignore it. Organizations\
    \ that fail to comply with the GDPR are liable for fines of up to 4% of global\
    \ turnover (not profit) for every breach of the regulation that occurs. Even if\
    \ you don’t live in the EU it’s worth spending a bit of time to get under the\
    \ skin of it because it highlights the direction of travel for data protection\
    \ legislation in a number of other countries and jurisdictions.\n\nThe GDPR adopts\
    \ a rights based approach. The foundation stone that underpins it is personal\
    \ ownership of one’s own data. It’s an individual’s right to decide who has access\
    \ to their data and how it’s used. Data about me is mine, it’s part of who and\
    \ what I am. You have no right to hold or use my data unless I give you permission\
    \ to do so. To store my data or make decisions about me without my permission\
    \ is illegal. I also have the right to change my mind. I can give you access to\
    \ my data today, but if I no longer want you to use it, then you must stop doing\
    \ so and delete what you know about me.\n\nThe legislation is also principle based.\
    \ This means that it’s not entirely prescriptive in terms of what you have to\
    \ do to comply. The aim is to encourage compliance with the spirit of the law\
    \ not just the letter of the law.\n\nAnother factor to bear in mind is that the\
    \ focus of the GDPR is squarely on the individual. There is no consideration as\
    \ to the costs that organizations incur to comply. At best, there is only very\
    \ limited scope for a business to argue that it would be uneconomic or might cause\
    \ them to go bust unless they process data in a certain way."
