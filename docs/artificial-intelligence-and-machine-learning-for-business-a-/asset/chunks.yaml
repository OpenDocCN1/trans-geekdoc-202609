- raw: "The scorecard model in Figure 2 predicts the likelihood of someone getting\
    \ heart disease in the next 5 years. But how do the individual scores generated\
    \ by the model translate into probabilities? One way to establish the relationship\
    \ between score and probability is to produce a “score distribution” table as\
    \ shown in Figure 3.\n\nTo produce Figure 3, a completely new sample of data,\
    \ a validation sample, was collected for another 500,000 people (30,000 of which\
    \ went on to develop heart disease over the next 5 years). This validation sample\
    \ is completely independent of the sample used to construct the model^([\\[20\\\
    ]](#index_split_028.html#filepos414460)). It therefore gives a representative\
    \ view of how the model will perform when it is applied to new people, whose details\
    \ were not used to construct the model.^([\\[21\\]](#index_split_028.html#filepos415201))\n\
    \n![](images/00007.jpg) \n\nThe two leftmost columns contain the score range,\
    \ showing the range of scores being reported upon in each row. The first row contains\
    \ details of everyone scoring 300 or less, the second row those scoring between\
    \ 301 and 320 and so on. Ideally, there would be a separate row for each individual\
    \ score, but because there are literally hundreds of different scores that can\
    \ be generated by the model, the scores in this example have been grouped in to\
    \ 20 point ranges for convenience^([\\[22\\]](#index_split_028.html#filepos416036)).\n\
    \nThe other columns in Figure 3 provide information about the individuals in each\
    \ score range. For instance, 56,606 cases scored between 301 and 320, representing\
    \ 11.32% of the cases in the validation sample. Of these, 68 went on to develop\
    \ heart disease.\n\nThe rightmost column shows the percentage of people in each\
    \ score range that developed heart disease. This is, in effect, the prediction\
    \ made by the model. For those in the 301 – 320 score range, the model prediction\
    \ is 0.12% To put it another way, anyone whose score is between 301 and 320 has\
    \ about a 1 in 833 chance of developing heart disease (1/0.0012).\n\nTo evaluate\
    \ the risk of a person getting heart disease in the future, all that one needs\
    \ to do is:\n\n*   Calculate their score using the scorecard in Figure 2.\n\n\
    >   \n\n*   Find the row into which their score falls in Figure 3.\n\n>   \n\n\
    *   Look across to the rightmost column of Figure 3 to obtain a prediction.\n\n\
    If we return to the case of the 45 year old women who scored 404, she falls in\
    \ the 401-420 score range. Reading across, the proportion of people who scored\
    \ between 401 and 420 who went on to develop heart disease was 1.76%. i.e. the\
    \ model predicts that she has a 1.76% (1 in 57)^([\\[23\\]](#index_split_028.html#filepos416271))\
    \ chance of developing heart disease in the next five years.\n\nIf you have the\
    \ information at hand, why not have a go at calculating your own score and coming\
    \ up with a prediction for your own risk of developing heart disease?^([\\[24\\\
    ]](#index_split_028.html#filepos416448))\n\nKnowing what the score means is important,\
    \ but the next question is: How well does the scorecard model predict heart disease?\
    \ How accurate is it? One way to evaluate the model is to consider the differences\
    \ in the rate of heart disease between the lowest and highest scoring cases. Only\
    \ 0.07% of those scoring 300 or less go on to develop heart disease in the next\
    \ five years. For those scoring 561 or more, 87.88% develop the condition. To\
    \ put it another way, people with the highest scores are more than 1,000 times\
    \ more likely to get heart disease than the people with the lowest scores – which\
    \ is pretty good.\n\nAnother way to approach this is to compare the model’s performance\
    \ against a random selection strategy; i.e. if you select people at random for\
    \ check-ups, then only 6% of those people would go on to get heart disease, whereas\
    \ the best scoring group (561 - 999) performs about 15 times better than this\
    \ (87.88 / 6).\n\nAppendix A provides a more detailed explanation of the most\
    \ common metrics used by data scientists to evaluate how good predictive models\
    \ are at predicting behavior.\n\n[6\\. Using a Predictive Model to Make Decisions](#index_split_004.html#filepos4264)\n\
    \nBy this point we:\n\n*   Have a predictive model (the scorecard of Figure 2\
    \ in the previous chapter). The model generates scores indicating how likely someone\
    \ is to develop heart disease.\n\n>   \n\n*   Understand what the scores mean.\n\
    \n>   \n\n*   Know the probability of someone getting heart disease given their\
    \ score (from the information provided in Figure 3).\n\n>   \n\n*   Have a feel\
    \ for how much better the scorecard is at identifying heart disease sufferers\
    \ than a random selection policy.\n\n>   \n\n*   Know the distribution of the\
    \ population across the range of possible scores (from the information provided\
    \ in the score distribution table in Figure 3).\n\nThat’s all well and good, but\
    \ none of this information tells us what to do on the basis of the score that\
    \ someone receives. If the model is going to provide value, then decisions need\
    \ to be made and those decisions acted upon. If someone receives a score of say,\
    \ 517 are they invited for a check-up or not?\n\nBefore going further, let’s cast\
    \ our minds back to the start of the previous chapter, where the following objective\
    \ was laid out:\n\n*   Identify at least half of those who will develop heart\
    \ disease in the next 5 years, and then invite them to visit their doctor for\
    \ a more in-depth check-up.\n\nSubject to the following constraint:\n\n*   No\
    \ more than 5% of the population can be invited for a check-up; i.e. there are\
    \ sufficient resources for 1 in every 20 people to be seen by their doctor.\n\n\
    To answer the question, we need to refer back to the score distribution that was\
    \ introduced in Figure 3. To save you having to turn back to it, it has been reproduced\
    \ as Figure 4 below.\n\n![](images/00002.jpg)\n\nThe limiting factor (the constraint)\
    \ in this problem is doctors’ time. At most, 1 in 20 people (5%) can be invited\
    \ for a check-up. Using the information from the “% of population” column in Figure\
    \ 4 to do some simple arithmetic, it can be determined that:\n\n*   1.93% of the\
    \ population scores 561 or more.\n\n>   \n\n*   3.58% of the population scores\
    \ 541 or more.\n\n>   \n\n*   5.00% of the population scores 521 or more.\n\n\
    >   \n\n*   7.71% of the population scores 501 or more.\n\n>   \n\n*   And so\
    \ on…\n\nTherefore, the cut-off strategy (decision rule) to apply is:\n\n*   Invite\
    \ anyone scoring 521 or more for a check-up and lifestyle review with their doctor.\n\
    \nThe final step is to evaluate the impact of the decision rule. How good will\
    \ the scorecard based decision-making process be? Will the model be able to identify\
    \ at least 50% of heart disease sufferers within the group scoring 521 or more?\n\
    \nLooking at the second rightmost column in Figure 4, there are 18,519 (3,463\
    \ + 6,587 + 8,469) cases scoring 521 or more. That’s 62% of the total 30,000 cases\
    \ of heart disease. That’s pretty good isn’t it? By selecting just the 5% of the\
    \ population scoring 521 or more, 62% of all heart disease cases can be identified.\
    \ The objective, (to identify at least 50%) has been met.\n\nThese figures are\
    \ based on the 500,000 people in the validation sample. Given that this is a large\
    \ independent sample, it’s a reasonably safe assumption that the results are representative\
    \ of what would be observed if the model was applied to the country’s entire population\
    \ of many tens of millions^([\\[25\\]](#index_split_028.html#filepos416869)).\n\
    \nAs I’ve already mentioned, predictive models aren’t perfect. Some of those scoring\
    \ 521 or more won’t get heart disease. Using the data in the score distribution\
    \ table again, it’s relatively easy to work out how often the model gets it right\
    \ for this particular decision rule and how often it gets it wrong, as follows:\n\
    \n*   There are 25,000 cases scoring 521 or more.\n\n>   \n\n*   Of these, 18,519\
    \ get heart disease.\n\n>   \n\n*   The overall hit rate is therefore 74% (100\
    \ \\* 18,519/25,000).\n\n>   "
