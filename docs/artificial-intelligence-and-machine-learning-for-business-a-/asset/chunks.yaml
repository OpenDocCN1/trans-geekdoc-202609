  trans: '


    重点是我在之前的几章中所谓的“简单 AI”类型的问题。这类问题是指人们希望使用机器学习方法来完成某些工作，例如决定面试哪些求职者、对医疗扫描进行初步诊断、决定应如何处理客户等。本节的建议对于“复杂
    AI”系统的开发（如自动驾驶车辆的运行或个人数字助手的开发）可能相关性较小。然而，许多建议对于这类应用仍然有效。


    以下是你在考虑在组织内部使用机器学习时应该提问的简明列表。或者正如我喜欢所称的：“芬曼博士的机器学习成功清单”。


    除非在项目离开业务需求阶段之前，你能以很高程度的确定性回答所有这些问题，否则该项目极有可能会失败。因此，你面临着在项目上花费大量精力和金钱，但在结束时没有获得任何收益的风险。


    ### 芬曼博士的机器学习成功清单


    1. **你的业务问题是什么？** 机器学习本身没有内在价值。如果它产生任何价值，必须将其应用于特定的问题或目标。如果你无法确定一个要解决的业务问题，请立即停止！


    2. **你想要优化什么指标？** 这应该是可以用简单的术语衡量的、且对你重要的东西。节省的时间、增加的利润、降低的成本、客户满意度和挽救生命都是典型的例子。机器学习过程将用于优化这一点。


    3. **你将应用什么样的决策规则和行动？** 你必须根据机器学习过程的输出做出决策，并对这些决策采取行动。如果你无法想象出将用预测模型做什么，为什么还要它呢？


    4. **用于机器学习的数据从何处来？** 机器学习至少需要数百个、理想情况下数千个示例案例才能运行。对于大多数机器学习问题，感兴趣的指标（上述第 2 点）需要在这些案例中可用可用。


    5. **你将如何使机器学习过程运营化？** 预测模型和决策规则将在什么系统或过程中实施？这将需要时间和金钱。谁来做？谁来买单？模型和决策规则不会自动实施。


    6. **自动化相关的伦理和法律风险是什么？** 使用第 13 章中的指南，根据客户影响、数据不可变性和受益者评估这些风险。你将采取哪些缓解措施来管理任何风险？你是否考虑了适用于所在地区的数据保护法？


    7. **所有所需数据在操作上都可用吗？** 让数据科学家针对其模型中出现的每个数据项提供清单。这是为了确保模型所需的数据存在于实施平台中。如果任何数据项不可用，你将无法使用已经开发的解决方案。


    8. **解决方案是以主动方式还是被动方式实施的（如第 11 章所述）？** 如果是被动方式，你需要什么控制措施来确保只有在正确的时候才发生覆盖？如果人们会审查并可能覆盖系统做出的每项决策，那么该系统将不会增加任何价值。


    9. **你将如何评估项目的成功？** 机器学习项目在分析阶段结束时提出的理论收益仅是现实实际情况的指示。需要一个监控过程在系统上线后进行评估。这样你就可以根据实际实现的收益与承诺的收益进行衡量。


    10. **维护系统的持续成本是什么？** 随着时间的推移，新数据、新法规、不断变化的业务需求等意味着系统将需要修改，并可能最终从头重新开发。预计多久发生一次？成本可能有多少？不要忘记包括监管合规成本和年度审计的费用。


    如果你是机器学习的新手，我的建议是每当你去见 AI/机器学习解决方案供应商时，都随带上这份清单。除了为你回答这些问题之外，供应商如何回答这些问题将很好地表明他们对你需求的理解程度。如果他们只能用泛化的收益或关于需要跟上竞争的模糊陈述来回答，请务心。


    ## 关于作者


    Steven Finlay 是一位数据科学家，在大规模数据环境中开发实用的“增值”机器学习解决方案方面拥有 20 多年的经验。他拥有预测建模的博士学位，是英国兰卡斯特大学的荣誉研究员。


    Steve 曾受雇于英国十大银行之一，负责管理其信贷风险模型套件，并为英国政府开发过机器学习方法，并在多家咨询集团工作过。他目前担任英国 Computershare
    贷款服务公司（CLS）的分析主管。


    Finlay 博士出版了多本关于机器学习、人工智能和金融服务的实用书籍。他的其他书籍（由 Palgrave Macmillan 出版）包括：


    * `Predictive Analytics, Data Mining and Big Data. Myths, Misconceptions and Methods.`

    * `Credit Scoring, Response Modeling and Insurance Rating. A Practical Guide to
    Forecasting Consumer Behavior.`

    * `The Management of Consumer Credit. Theory and Practice.`

    * `Consumer Fundamentals.`


    ## 注释


    * [1]: 预测消费者行为是机器学习非常常见的应用，但还有许多其他应用。例如，相同的技术也用于预测股价、复杂的机器何时可能故障以及哪些组织可能会破产。

    * [2]: 信誉参考机构（也称为信誉报告机构或信用局）最初的角色是债务和贷款还款数据的中央存储库。这仍然是他们工作的核心，但现在信誉参考机构也持有各种个人信息。因此，信用报告除了个人的信用历史外，还包含各种个人数据。在这一术语应用于谷歌、亚马逊等公司之前的几十年，信誉参考机构可以说是是第一批“大数据”公司。

    * [3]: Siegel, E. (2016). Predictive Analytics: The Power to Predict Who Will
    Click, Buy, Lie, or Die. 2nd Edition. Wiley

    * [4]: 参考 Roger Penrose 在其著作中的观点：`The Emperor''s New Mind: Concerning Computers,
    Minds, and the Laws of Physics` 和 `Shadows Of The Mind: A Search for the Missing
    Science of Consciousness.`

    * [5]: Cellan-Jones, R. (2017). ‘Can Google police YouTube?’ BBC [`www.bbc.co.uk/news/technology/39338009`](https://www.bbc.co.uk/news/technology/39338009),
    访问于 2018 年 5 月 12 日。

    * [6]: Kelion, L. (2018). ‘YouTube toughens advert payment rules’. BBC [`www.bbc.co.uk/news/technology/42716393`](https://www.bbc.co.uk/news/technology/42716393),
    访问于 2018 年 5 月 12 日。


