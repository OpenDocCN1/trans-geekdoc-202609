    \ people invited for a check-up. The Y axis shows the proportion of those who\
    \ are invited who can be expected to develop the disease within 5 years. The dotted\
    \ straight line is the base rate. The base rate is the percentage of people expected\
    \ to develop heart disease over the next 5 years within the population at large\
    \ i.e. `6%`. To put it another way, the base rate represents a random selection\
    \ strategy for inviting people for check-ups.\n\nThe solid curved line shows what\
    \ would happen if the prioritization process for deciding who to invite for a\
    \ check-up was based on the scores from the scorecard model. For example, the\
    \ graph shows that if the highest scoring 40% of the population are invited for\
    \ a check-up then about 15% of these would develop heart disease in the future.\
    \ If volumes were reduced and say, only 10% were invited for a check-up, then\
    \ the proportion (purity) would rise to around `50%`\n\nThe smaller the proportion\
    \ targeted for medical intervention, the higher the proportion with the disease.\
    \ To put it another way, if you only target the small number of people in the\
    \ population with the very highest scores, then one can expect a very high proportion\
    \ of those selected to have heart disease. If the invited group is enlarged however,\
    \ by including people with lower scores, then overall the proportion correctly\
    \ identified (the purity) will fall.\n\nThe lift chart is therefore a way of comparing\
    \ trade-offs between volume and purity.\n\nFigure 14 shows an extended version\
    \ of the score distribution.\n\nIn Figure 13 the X axis shows the proportion of\
    \ people invited for a check-up. The Y axis shows the proportion of those who\
    \ are invited who can be expected to develop the disease within 5 years. The dotted\
    \ straight line is the base rate. The base rate is the percentage of people expected\
    \ to develop heart disease over the next 5 years within the population at large\
    \ i.e. `6%`. To put it another way, the base rate represents a random selection\
    \ strategy for inviting people for check-ups.\n\nThe solid curved line shows what\
    \ would happen if the prioritization process for deciding who to invite for a\
    \ check-up was based on the scores from the scorecard model. For example, the\
    \ graph shows that if the highest scoring 40% of the population are invited for\
    \ a check-up then about 15% of these would develop heart disease in the future.\
    \ If volumes were reduced and say, only 10% were invited for a check-up, then\
    \ the proportion (purity) would rise to around `50%`\n\n## Appendix B. Further\
    \ Information and Recommended Reading\n\nThe following are some of the primary\
    \ internet resources for machine learning, artificial intelligence and related\
    \ technologies (Big data, data mining, etc.)\n"
