  trans: '


    这种现象于 20 世纪 50 年代和 60 年代出现在美国金融服务领域。当时，大多数抵押贷款、汽车信贷和个人贷款申请都是由人工核保员评估的，他们逐一审查每份贷款申请，然后决定该人是否有信用，并因此应该获得他们所申请的信贷。


    在大型组织中，整栋办公大楼都被核保团队占据，他们整天都在做贷款决策。在当地银行分行，`Bank Manager`（银行经理）就是王——他是当地社区受尊敬的成员，对谁可以获得贷款或抵押贷款、谁不能获得拥有绝对决定权。有时，获得贷款完全取决于他（而且通常是男性）当天的心情如何。比起周一一早晨，你可能在周五下午更容易获得贷款，因为那时他正对即将到来周末心情大好！


    到 20 世纪 80 年代后期，这些职位中的大多数已变得多余。银行经理的角色已缩减为不多于销售人员——负责维护客户关系，但没有决策能力。绝大多数贷款决策都是由位于总部自动化决策系统核心的信誉评分模型做出的。在当今的信贷授予领域，只有异常或边缘案例倾向于由人类审查——绝大多数贷款决策都是自动完成的，完全没有任何人工干预。


    ### 机器学习的价值


    失业是受影响行业人员所担心的问题，但并非完全是一片黑暗。在许多情况下，`machine learning` 正在为这些岗位增加价值，而非取代它们。在医院和医生诊室里，预测模型补充了医生的自我判断，而非取代他们。在营销领域，基于
    `machine learning` 的改进目标定位被用于减少骚扰电话和垃圾邮件，同时使价值的客户接触最大化；即只电话/短信/邮件联系那些极可能对你销售的产品感兴趣的人。过去，一揽式的接触策略很常见。呼叫中心的工作员会被电话簿，并被要求逐一拨打，无论他们购买提供产品或服务的意愿如何，尽可能多地打电话。`machine
    learning` 带来的另一个机会是预测以前未被考虑或不成本效益的新型行为。例如，在警务中，预测模型正在帮助警察缩小嫌疑人名单并更好地针对犯罪，提高效率，并让他们有更多时间关注最严重的犯罪。预测模型也是约亲和求职网站等“人员匹配”服务的基石。如果没有预测模型，这些事务将大不相同——基于一组非常粗略的标准进行人员匹配，和/或必须使用人工进行匹配，这使得此类服务变得昂贵得多且效率低下。


    ### 局限性与偏见


    尽管有许多支持基于预测模型的自动化决策系统的论点，但不要在政府为改善儿童护理服务的新立法上犯类似的错误。模型可能具有很强的预测性，但它不可避免地偏向男性。为什么？因为我们生活在一个大多数行业仍然表现出性别偏见的社会，在一个女性仍被视为抚育主要来源的社会。在某种意义上，只要模型识别出高级领导，它就是准确的，但会导致女性代表性不足，反映出存在的社会偏见。


    一个广为人知的真实世界案例是授予囚犯假释。据报道，美国用于支持假释决定的算法具有很强的种族偏见。如果你是白人，获得假释的可能性比其他种族的囚犯高得多。为什么？因为用于评估假释案件的预测模型是利用历史决策信息开发的，而这些决策本身带有偏见。这都归根结底于
    `machine learning` 过程中使用的数据。如果数据包含有关以前偏见决定的信息，那么任何 `machine learning` 算法都会捕捉到这一点。换句话说，`machine
    learning` 没有社会意识也没有良知。如果数据中存在伦理上不利或非法的模式，`machine learning` 过程无法感知。因此，它不会对这些社会不可接受的模式与它发现的其他模式区别任何区别。


    基于 `machine learning` 的 AI 系统可能显示的偏见的更明显的例子是微软开发的机器人 `Tay`。`Tay` 旨在对青的推文生成自动回复，并对出现的新对话进行适应。`Tay`
    在几小时后最终被撤回，因为它开始发布种族主义和其他不恰当的内容。它之所以这样做是因为用于训练它的推文包含了种族主义和其他不可接受的材料。`Tay` 学会了这些模式并在自己的回复中播放出来。`Tay`
    使用自然语言回答的能力几乎被认为是人类，但它无法调节自己的回复以适应广泛社会预期的社会和伦理规范是非人性的。


    另一个担忧是，如果数据科学家有特定的偏见，他们可能会意识地将这些偏见设计到系统中，颠覆数据正在告诉他们的事情。然而，这也可以对人们有利。如果认为用户不喜欢所做出的决策，那么设计良好的系统将允许决策逻辑被修改/覆盖——正如我们在之前的章节中讨论威士忌销售案例时讨论的那样。


    这意味着需要对基于 `machine learning` 的决策系统进行监督，并建立适当的检查和平衡机制，以确保系统以符合法律和伦理的方式运行。我们将在第
    13 章中详细讨论这些问题。


    ## 5. 机器学习是如何工作的？


    '
