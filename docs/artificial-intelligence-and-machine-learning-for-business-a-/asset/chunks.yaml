    Learning: Data Mining, Inference, and Prediction. (Springer Series in Statistics)
    2^(nd) edition. Springer. A detailed and technical guide to many of the data mining
    tools used in machine learning, written by three of the world’s leading academics
    in the field.


    Hosmer, D. and Lemeshow, S. (2013). Applied Logistic Regression (Wiley Series
    in Probability and Statistics). 3^(rd) edition Wiley. Logistic regression remains
    one of the most popular and widely used methods for generating predictive models.
    This is the first book I recommend to people who want to know more about this
    method.


    Khun, M. and Johnson, K. (2013). Applied Predictive Modeling. Springer. Another
    well-constructed book in a similar vein to Baesens (above). It combines practical
    advice with the more mathematical aspects of the subject.


    Witten, I. H., Frank, E., Hall, M. A. and Pal, C. J. (2016). Data Mining: Practical
    Machine Learning Tools and Techniques, 4th edition (The Morgan Kaufmann Series
    in Data Management Systems). Morgan Kaufmann. This is a detailed reference manual
    for those interested in practical data mining. I found it provided a nice blend
    of theory and practice, with many good examples.


    Zelle, J. (2016). Python Programming: An Introduction to Computer Science. 3^(rd)
    edition. Franklin, Beedle & Associates. A useful introduction to the Python programming
    language.


    [Appendix C. Popular Terms in Machine Learning and AI](#index_split_004.html#filepos4264)


    Activation function. An equation (mathematical formula) that is used to transform
    the raw output of a neuron into its final output (score). Activation functions
    are often used to force the output of neurons to lie in a fixed range. This is
    usually between 0 and 1, but some activation functions result in outputs with
    different ranges. Common activation functions are the logistic function, the hyperbolic
    tangent function and the identify function. See [https://en.wikipedia.org/wiki/Activation\_function](https://en.wikipedia.org/wiki/Activation_function)
    for a more complete list of activation functions and their derivation.


    Algorithm. An algorithm is a set of instructions or procedures executed in sequence
    to solve a particular problem. In machine learning various algorithms are applied
    to discover patterns in data and to create predictive models.


    Artificial Intelligence (AI). The replication of biological (mainly human) analytical
    and decision-making capabilities. For example, object and speech recognition,
    predicting peoples’ future behavior and the ability to play games such as chess,
    poker and Go.


    Big Data. A very large collection of varied, changeable data, which is difficult
    to process using a standard PC/Server; i.e. typically terabytes in size or larger.
    Big Data technologies make use of advanced computer architectures and specialist
    software to facilitate the rapid processing of these data sets. Machine learning
    is one of the primary tools used to extract value from Big Data.


    Causation. The reasoning behind why something happened; i.e. the cause of something.
    Not to be confused with correlation.


    Classification model. A predictive model that predicts if a given event will or
    will not occur. For example, the likelihood that two people will hit it off on
    a date, the probability that someone will buy a certain type of car, or the chance
    that a person develops diabetes sometime in the next 10 years. The score generated
    by a classification model is an estimate of the likelihood of the event occurring.
    Not to be confused with regression model.


    Cluster(ing). Clusters are groups that contain people or things with similar traits.
    For example, people with similar ages and incomes might be in one cluster, those
    with similar job roles and family sizes in another. Clustering algorithms are
    one form of unsupervised learning (see below).


    Convoluted (neural) network. A type of deep neural network where not all neurons
    in a layer are connected to all the neurons in the next layer. With fewer weights,
    the (very considerable) time required to train a network is much reduced. A classic
    application is object recognition. Imagine you have an image comprising 256 \*
    256 (65,536) pixels. A traditional neural network would need 65,536 weights for
    each neuron in the first layer, one for each pixel! By segmenting the image into
    say, 64 sub-regions each with 32 \*32 pixels and only connecting neurons within
    each sub-region, the number of weights is reduced to just 1,024 per neuron. This
    works because the most important features in images are usually close together
    (i.e. in the same or neighboring sub-regions). Pixels at opposite sides of the
    image are much less important.


    Correlation. One variable is correlated with another if a change in that variable
    occurs in tandem with a change in the other. It is important to appreciate that
    this does not necessarily mean that one thing is caused by another (causation),
    although it might be. Stork migration is correlated with births (more children
    born in the spring when storks migrate), but stork migration does not cause births!


    Cut-off score, see decision rule.


    Data mining. Data mining is the science of finding useful information in data
    sets that a human being would be unable to identify easily by casting their eye
    over it. Data mining makes use of a wide range of algorithms and automated procedures
    taken from various disciplines which include statistics, computing and artificial
    intelligence/machine learning.


    Data science. The name given to the skill/art of being able combine mathematical
    (machine learning) knowledge with data and IT skills in a pragmatic way, to deliver
    practical value add machine learning based solutions.


    Data scientist. The name given to someone who does data science. Good data scientists
    focus on delivering useful solutions that work in real world environments. They
    don’t get too hung up on theory. If it works it works!


    Decision rule. Predictive models generate scores. Decision rules are then used
    to decide how people are treated on the basis of the score. Those who score above
    a given score (the cut-off score) receive one treatment, those scoring below the
    cut-off another. For example, when assessing people for a medical condition, only
    those scoring above the cut-off; i.e. those with the highest risk of developing
    the condition, are offered treatment.


    Decision tree. A type of predictive model created using an algorithm that recursively
    segments a population into smaller and smaller groups. Also known as a Classification
    and Regression Tree or CART (Because they can be used for both classification
    and regression.)


    Deep learning. Predictive models based on complex neural networks (or related
    architectures), containing many neurons spread across many layers. Deep leaning
    is proving successful at complex problems such as object recognition and language
    translation.


    Development sample. The set of data used by the machine learning process to construct
    a predictive model. Development samples need to contain at least several hundred
    cases, but usually larger samples are used containing thousands or millions of
    cases.


    Ensemble. A predictive model comprised of several subsidiary models (as few as
    3 or sometimes many thousands). All of the subsidiary models predict the same
    outcome but have been constructed using different methods and/or using different
    data. This means that the models don’t always generate the same predictions. The
    ensemble combines all of the individual predictions to arrive at a one final prediction.
    Model ensembles often (but not always) significantly outperform the best individual
    model.


    Feed forward neural network. A neural network in which the connections are all
    one way, from one layer of neurons to the next. There are no backward or inter-layer
    connections. Most neural networks are feed forward networks.'
