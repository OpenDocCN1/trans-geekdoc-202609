    同样的原理也适用于亚马逊 Echo 等数字个人助手。一组算法被用于将你说的话转换成音频片段（数据预处理）。预处理后的音频片段随后被输入另一组预测模型中，这些模型会尝试预测你想要的结果；例如播放某首特定的歌曲或询问天气。亚马逊允许开发者免费使用这种预处理能力——让任何人都能将先进的语音识别技术整合到自己的程序和应用程序中。


    这意味着，进入机器学习和人工智能（AI）世界的门槛已大幅降低。就在几年前，机器学习还主要是大型企业和学术机构的领域。而今天，任何拥有笔记本电脑和空闲时间的人都可以参与进来，并以较快的速度且几乎零成本开始构建预测模型，然后开发一个先进的用户界面将这些模型实现为“AI
    应用”。


    如今，甚至有了诸如 Kaggle 之类的机器学习竞赛网站。机构免费提供其数据，然后由业余和专业团队进行竞争，看谁能利用提供的数据构建出预测能力最强的模型。获胜者向数据供应商分享其方法，并获得回报。赢得
    Kaggle 竞赛的奖励非常丰厚。典型的现金奖金为几千美元，但最高奖金超过了百万美元！然而，对于许多获胜者来说，奖金相对于 Kaggle 获胜者可以获得的高薪只是次要考虑因素。


    在讨论机器学习、预测建模和人工智能时，你可能还会遇到“数据科学”（data science）和“数据科学家”（data scientist）这两个术语。数据科学并不是像物理、化学或生物那样的科学。它只是对机器学习技术应用的描述。同样，数据科学家是指能够实际方式应用机器学习的人。它不仅仅涉及该学科的数学方面。优秀的数据科学家对数据和
    IT 系统有理解，并能够理解其解决方案所应用的业务背景。


    ### 3 预测模型生成的评分代表什么？


    正如上一章所述，商业中使用的绝大多数机器学习/AI 应用依赖于预测模型。这些模型根据其接收到的信息生成数字（评分），指示了可能发生的情况。


    预测模型生成的评分可以是两种类型之一：


    1. **概率（可能性）评分（Probability scores）**。它们预测特定事件发生的概率。例如，某人会做某事吗？这种类型的预测模型的技术名称是分类模型（classification
    model）。

    2. **幅度（数量）评分（Magnitude quantity scores）**。它们预测某事的数量或大小。例如，某人在商店里将花多少钱，或者他们在做某事之前还有多久。这种类型的预测模型的技术名称是回归模型（regression
    model）。


    分类模型预测事件发生的概率。这些事件通常是二元性的；即生成一个单一评分，代表事件发生的概率。然而，分类模型也可以用于处理具有多个结果（事件）的问题。


    分类模型的常见业务应用包括：


    *   **医疗诊断（Medical diagnosis）**。评分衡量某人患有某种特定疾病的概率。

    *   **内容检测（Content detection）**。模型预测媒体内容是否涉及特定主题/话题。社交媒体公司使用此类模型来识别发布在其网站上的攻击性或非法材料。高分材料会被拦截或放入队列由人工评估员审核。

    *   **客户流失（Customer attrition）**。模型生成客户购买竞争对手产品或停止使用产品或服务的概率。例如，更换公用事业供应商、办理新信用卡或取消杂志订阅。

    *   **欺诈检测（Fraud detection）**。模型生成的评分代表欺诈交易发生的概率。例如，某人试图用偷来的信用卡购买东西。

    *   **约会匹配度（Dating compatibility）**。模型评分提供了两个人在约会中合得来来的概率指示。

    *   **产品推荐（Product recommendation）**。评分代表某人购买给定产品或服务的概率。只有当客户购买该产品或服务的概率足够高时，才会对他们进行营销。

    *   **员工留存（Staff retention）**。模型估计了员工离开当前职位担任其他职位的概率。

    *   **机器故障（Machine breakdown）**。评分预测机器是否可能在近期发生故障。这允许采取预防性措施，例如给司机发短信，告诉他们在故障发生前去修理厂修理汽车。


    有时分类模型的评分直接代表概率。得到 0.0 分的人肯定不会经历该事件。得到 1.0 分的人肯定会经历。预测模型并不提供完美的预测。人们通常看到的是个人在
    0.0 到 1.0 之间的概率分布（分布）。当产品推荐模型为某人生成 0.70 的评分时，这意味着他们有 70% 的概率购买，有 30% 的概率不买。


    在其他情况下，分类模型的评分被转换为特定的比例。如果我们回到信用评分的世界，信用分通常在 400 到 800 之间。如果某人得到 400 分，意味着他们极不可能偿还任何给予他们的信贷（贷款还款概率
    < 5%）。800 分意味着他们几乎会偿还债务（贷款还款概率 > 99.9%）。业务中使用的大多数分类模型都会生成单一评分。该评分预测一个简单的“是/否”类型事件，例如上述列表中所描述的那样。当机器学习应用于具有多个结果的问题时，则会为每个结果产生一个单独的评分。


    相反，回归模型关于数量的；即事件的幅度。回归模型的业务应用示例包括：


