    一旦分析过程完成并获得预测模型，就可以将其转移到其实施的领域。假设在项目的合适时机已经对模型实施给予了充分考虑，那么这个过程将会相对顺利。这是因为必要的软件和
    IT 设施应该已经部署，并且运营人员已经接受了简报，介绍了模型上线后情况将发生什么变化。


    使用通过机器学习开发的模型来实现自动化决策过程是一项巨大的成就，特别是当这对于相关组织来说是一项新尝试时。然而，这并不是过程的终点。一旦模型上线，就需要对决策过程进行定期审查，以评估模型的预测效果如何，并确保继续应用正确的截断值和决策规则。


    之所以需要监控，是因为由于构建模型所用的数据与所预测的结果之间的底层关系发生变化，模型的预测准确性往往随着时间的推移而下降。监控通常涉及生成一系列报告，显示模型预测的实际准确性如何。当模型准确性开始下降时，这表明是时候开发新模型了。


    模型年龄的增长导致预测准确性下降是模型需要重新开发的主要原因，但预测模型的重新开发也出于其他原因。有时，法律或法规的变化意味着模型中的某些数据项不再可以使用。同样，新的数据源不断出现，有望构建出预测能力更强、更准确的模型。


    进行定期模型监控的另一个原因是评估基于模型的决策如何影响人群中的不同群体。如果一家银行的营销部门想要针对具有特定地理人口统计特征的人群推出新型信用卡，那么对于银行来说，理解信用评分模型如何处理这类人群至关重要。银行最不希望看到的是：为新客户开展了巨大的营销活动，结果发现所有申请新卡的人都被拒绝了。


    同样，如果模型涉及到对人们做出重大的生活决策，那么对模型进行监控以确保其显示的任何偏差都是可以接受的是明智的。如果人力资源部门使用模型来筛选职位申请者，并发现其拒绝的少数族裔或女性比例高于平均水平，那么将需要对此进行调查，并在必要时采取补救措施。


    ## 12. 大数据与机器学习之间的关系


    从大约 2010 年以来，“大数据”已成为一个通用术语，用于描述人们通过智能手机、网页浏览历史、社交媒体和购买行为产生的所有数据，以及组织持有的关于他们的任何其他信息。


    为什么大数据与其他任何类型的数据不同？从某种意义上说，它们并没有区别；归根结底，一切都只是 0 和 1。然而，“大数据”一词倾向于应用于不同类型数据的大集合，这些数据通常是易变且多变的，人们很难使用传统的计算机硬件和软件对其进行分析。


    此外，大数据通常包含某些特定类型的数据，这些数据直到最近才被广泛用于客户分析。特别是，大数据包括：


    *   **文本**。可以对人们写和说的内容进行分析，以识别他们正在讨论的话题以及表达的情感。如果某个产品在积极或消面的语境下被讨论，这可能预示某人是否会购买该产品。

    *   **图像**。这涵盖了照片、视频，以及医学影像。机器学习的应用之一是利用扫描和 X 光片中识别出的特征来预测某人患特定疾病的概率。

    *   **（社交）网络数据**。关于人际关系以及他们认识谁的信息。网络数据包括人们拥有的连接数量和类型，以及有关连接个体的数据。如果你所有的朋友都是科幻迷，这很可能预示着你其中之一。

    *   **地理空间**。由智能手机、汽车 GPS 系统和其他移动设备提供的关于人们位置和移动的信息。

    *   **生物识别**。从健身手环、智能手表等收集的关于血压、心率等的数据。

    *   **产品（机器）生成**。从电视机到咖啡机，日常设备正在设计成可以在彼此之间以及通过互联网共享信息。如今，你的暖气设备、热水壶、洗衣机等都可以通过智能手机控制。“物联网”（IoT）概念仍在发展中，但它最终可能会提供大量数据，可以使用机器学习来推断人们的行为。


    在 20 世纪 90 年代的“过去旧时光”，智能设备并不存在。那时很少有人有手机，互联网还处于起步阶段。关于人们或其活动的电子数据微乎其微。当时存在的数据通常仅限于少数地理人口统计特征，如地址、年龄、收入、性别等。如果涉及金融服务产品，可能还会由来自直销营销公司或信誉参考机构的数据进行补充（例如贷款和信用卡的欠款状态）。超市并不知道每个客户每周买了什么，保险公司不知道人们是如何开车的，而医疗服务部门则将大多数患者记录保存在纸质文件中。


    那时数据科学家的生活相当简单，因为所有这些（非常有限的）电子数据通常以整齐的行和列格式（就像电子表格中看到的）存储。数据也是相对静态的。它们通常只以很低的频率并定期更新——通常在月底或年底。


    在当今世界，数据的更新频率高得多，通常是实时的。此外，更多的是“自由格式”的非结构化数据，如语音、电子邮件、推文、博客、图片等。


    另一个因素是，这些数据很大程度上是独立于使用它们的组织生成的。这在许多方面都是问题。之一是，如果数据是由组织自身捕获或生成的，那么他们就可以控制数据的格式。他们还可以建立检查和控制措施以确保数据的准确性和完整。然而，如果数据是从外部源生成的，则无法保证数据是正确的。


    外部来源的数据通常是“混乱的”。这需要大量工作来清理并将其转换为可用的格式。此外，可能对这些数据的稳定性和持续可用性产生担忧，如果这些数据成为组织核心分析和决策能力的一部分，就会构成业务风险。


    这意味着，组织用于处理销售交易、维护客户账户记录和发票的传统计算机架构（硬件和软件），并不适用于存储和分析现在可用的所有新型不同类型的数据。因此，在过去的几年里，开发了一系列全新的、有趣的硬件和软件解决方案来处理这些新类型的数据。


    特别是，现代大数据计算机系统非常擅长：


    '
