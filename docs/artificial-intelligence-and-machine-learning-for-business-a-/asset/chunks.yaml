    1.  你想要预测的不确定事件/数值/事物是什么？这需要非常清晰且明确。它必须易于衡量，并在分类问题中表示为简单的指标，或在回归问题中表示为数值。


    2.  根据模型预测的结果，将对如何处理人员采取哪些决策和行动？


    开发一个预测注定会发生事件的模型是没有任何意义的。同样，如果无论人的得分如何，他们都继续以相同的方式被对待，那么模型有什么用呢？如果现有客户在下次购买时总能获得相同水平的折扣，那么建立一个用于识别重复购买者的预测模型就没有意义了。只有当根据模型生成的评分提供差异化的激励策略时，重复购买者模型才有用。例如，对于模型预测几乎肯定会再次购买的人（高分）不提供折扣，而对分值处于另一端的人（低分）提供大折扣，以鼓励他们再次在店里购物。


    确定正确的问题至关重要。机器学习的一个局限性是它非常具有针对性。例如，在税收中，我们感兴趣的是识别错误的纳税申报（分类问题——是否支付了正确的金额），还是最大化总税收（回归问题，征收金额）？许多人在纳税申报中会犯小错。发现这些错误是有帮助的，但不会大幅增加征收的总额。事实上，很多人不小心多交了小额税。如果你的模型识别出这些情况，你可能退还部分已支付的税款，而不是收得更多！


    税务机构受到资源限制。如果你想最大化税收，你应该只关注欠缴金额非常大的案例。税务机构根本没有人力跟进每一个小额欠缴。因此，问题需要捕获到这一需求。例如，忽略小于
    1000 美元的税收差异。同样，一个用于预测心脏病的模型可能不擅长预测痴呆，反之亦然。


    构建预测模型时的第二个考虑因素是组织文化，以及受模型影响的业务领域对变化的接受程度。现有的工作习惯和对新工作方式的抵制往往是引入机器学习的障碍。当员工被要求根据模型的告知做出不同行为时，情况尤为如此；即机器学习将改变人们工作的方式，在某些情况下，它会导致职位流失和/或技能贬值。


    通常情况下，某个领域的专家并不倾向于相信预测模型预测结果的能力像他们自己那么好。这意味着，如果给他们机会，专家往往会覆盖基于预测模型做出的决策——实际上抵消了模型可能带来的任何收益。


    覆盖决策是否会成为问题，通常取决于预测模型是以主动的还是被动的方式实施的：


    *   **主动模型（Active Models）**：模型生成的预测结果（评分）会被自动触发操作。执行操作时不需要人工干预。

    *   **被动模型（Passive Models）**：模型评分被用于生成案例并传递给人员，由他们再决定如何处理；即，在某人对分析过程生成的案例采取行动之前，什么都不会发生。


    使用主动模型的一个场景是债务催收。预测模型被用于根据哪些债务人最可能偿还欠款来对债务人进行排序。排序后的列表被加载到拨号系统中，系统会按列表顺序自动给这些人拨打电话。


    当与债务人取得联系时，电话会转接给人类催收员，由该人员试图说服债务人偿还欠款。催收员本身并不关心案例呈现给他们的顺序。他们只是简单处理收到的每一个案例。因此，一旦模型实施，就不再需要额外的人工输入来决定拨号器维护的通话列表顺序。


    另一方面，被动模型的示例是一个设计用于根据应聘者对特定职位的适用程度进行排名的模型。模型可能非常擅挑选最有前景的候选人，但仍需要人类面试官会候选人并对职位录取做出最终决定。如果面试官出于某种原因不喜欢某个候选人，那么他们就不会给该候选人提供工作，无论其实际能力有多强。


    被动模型是最容易问题的。这是因为在许多组织中，一线人员有能力改变或更改中央做出的决策。在招聘示例中，面试官越是决定用自己的判断覆盖基于模型的决策，模型的力量就越被削。此外，人类评估者往往表现出偏见（意识或无意识），根据某些未发现的偏见或刻板印象使优秀的候选人处于不利，导致许多优秀候选人的工作申请被拒绝。


    我遇到的另一个例子是在税收领域。一个中心职能负责识别潜在的欺诈纳税申报，这些案例随后被传递给当地的税务查员进行详细调查。税务查员有权拒绝他们认为不合适或不太可能产生大量额外税收的案例。


    当中心职能实施一个预测模型来识别极有可能欺诈的案例时，税务查员拒绝的案例数量急剧增加。这并不是因为模型生成的案例不是欺诈，而是因为模型太擅长识别欺诈活动，由于数据中有非常微妙的迹象。


    当案例到达税务查员的办公桌时，查员无法准确判断其具体哪里可疑。他们不知道如何开始调查，因此他们拒绝了它。同样，模型经常选择那些非常复杂、或者即使明显发生了欺诈也很难收回欠缴税款的案例。这类案例也倾向于被拒绝。


    主动模型比被动模型更容易成功实施。这是因为人们没有机会去覆盖基于模型的决策。例如，一旦做出了给客户发送优惠券的决定，发送带有说明信的优惠券的过程就是自动的。没有人会质疑系统，并将优惠券发给他们认为他们想要或不会使用的客户。这就是为什么机器学习在目标营销、信贷发放和保险定价等领域能取得如此成功，但在医疗保健、人力资源、执法和教育等领域利用尚不足的原因之一。


    '
