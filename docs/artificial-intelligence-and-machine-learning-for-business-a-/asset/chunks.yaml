- raw: "The same principle applies to digital personal assistants such as Amazon’s\
    \ Echo. One set of algorithms are used to translate what you say into soundbites\
    \ (data pre-processing). The pre-processed soundbites are then fed into another\
    \ set of predictive models which try to predict what outcome you are asking for;\
    \ such as playing a certain song or asking about the weather. Amazon allows developers\
    \ to use this pre-processing capability for free^([\\[11\\]](#index_split_028.html#filepos410474))\
    \ – allowing anyone to incorporate advanced speech recognition into their programs\
    \ and apps.\n\nWhat all this means is that the cost of entry into the world of\
    \ machine learning and AI has reduced considerably. Only a few years ago machine\
    \ learning was primarily the domain of large businesses and academic institutions.\
    \ Today, anyone with a laptop and some time on their hands can get involved and\
    \ start building predictive models relatively quickly and at almost zero cost,\
    \ and then develop an advanced user interface to implement those models as an\
    \ “AI app.”\n\nThese days, there are even competition websites for machine learning\
    \ such as Kaggle^([\\[12\\]](#index_split_028.html#filepos410983)). Organizations\
    \ provide their data for free, and then amateur and professional teams compete\
    \ to see who can build the model with the greatest predictive power using the\
    \ data that has been provided. The winner shares their approach with the organization\
    \ that supplied that data and receives a prize in return. The rewards for winning\
    \ a Kaggle competition are significant. Typical cash prizes are a few thousand\
    \ dollars, but the largest prizes are in excess of a million!^([\\[13\\]](#index_split_028.html#filepos411276))\
    \ However, for many winners, the prize money is only a secondary consideration\
    \ to the high salaries that Kaggle winners can command.\n\nWhen discussing machine\
    \ learning, predictive modelling and AI you will probably also come across the\
    \ terms data science and data scientist. Data science isn’t a science in the same\
    \ way that physics, chemistry or biology are. It’s simply a description of the\
    \ application of machine learning techniques. Likewise, a data scientist is someone\
    \ who can apply machine learning in a practical way. It’s about more than just\
    \ the mathematical aspects of the subject. A good data scientist also has an understanding\
    \ of data and IT systems and is able to understand the business context in which\
    \ their solutions will be applied.\n\n[3\\. What Do the Scores Generated by a\
    \ Predictive Model Represent?](#index_split_004.html#filepos4264)\n\nAs noted\
    \ in the previous chapter, the vast majority of machine learning/AI applications\
    \ used in business rely on predictive models. These models generate numbers (scores)\
    \ which indicate what is likely to occur, based on the information that the model\
    \ is presented with.\n\nThe scores generated by a predictive model can be one\
    \ of two types:\n\n1.  Probability (likelihood) scores. These predict the likelihood\
    \ of specific events. For example, will someone do something or not? The technical\
    \ name for a predictive model of this type is a classification model.\n\n1.  Magnitude\
    \ (quantity) scores. These predict the amount or size of something. For example,\
    \ how much someone is going to spend in store, or how long before they do something.\
    \ The technical name for a predictive model of this type is a regression model.\n\
    \nClassification models predict the likelihood that events occur. Often these\
    \ events will be binary in nature; i.e. a single score is generated, representing\
    \ the likelihood that the event will occur. However, classification models can\
    \ also be used to address problems with multiple outcomes (events).\n\nCommon\
    \ business applications of classification models include:\n\n*   Medical diagnosis.\
    \ The score is a measure of the likelihood of someone having or getting a particular\
    \ illness.\n\n>   \n\n*   Content detection. The model predicts if media content\
    \ relates to a certain subject/topic. Models of this type are used by social media\
    \ companies to identify offensive or illegal material posted to their sites. High\
    \ scoring material is blocked or placed in a queue for review by a human assessor.\n\
    \n>   \n\n*   Customer attrition. The model generates a probability that a customer\
    \ will buy rival products or stop using a product or service. For example, switching\
    \ their utility provider, acquiring a new credit card or cancelling a magazine\
    \ subscription.\n\n>   \n\n*   Fraud detection. The score generated by the model\
    \ represents the probability that a fraudulent transaction is occurring. For example,\
    \ someone trying to buy something with a stolen credit card.\n\n>   \n\n*   Dating\
    \ compatibility. The model score provides an indication of how likely two people\
    \ are to hit it off on a date.\n\n>   \n\n*   Product recommendation. The score\
    \ represents the likelihood that someone will buy a given product or service.\
    \ Customers are only marketed to if the probability of them buying the product\
    \ or service is sufficiently high.\n\n>   \n\n*   Staff retention. The model estimates\
    \ the probability that an employee will leave their current position to take up\
    \ another post.\n\n>   \n\n*   Machine breakdown. The score predicts if a machine\
    \ is likely to fail in the near future. This allows for pre-emptive action such\
    \ as texting a driver that they need to come to the garage to get their car fixed\
    \ before it breaks down.\n\nSometimes the scores from a classification model represent\
    \ a probability directly. A person who receives a score of 0.0 certainly won’t\
    \ experience the event. Those with a score of 1.0 certainly will. Predictive models\
    \ don’t provide perfect predictions. What one tends to see is a spread (a distribution)\
    \ of probabilities between 0.0 and 1.0 for individuals within the population.\
    \ When a product recommendation model generates a score of 0.70 for someone, this\
    \ means that the model predicts that there is a 70% chance that the individual\
    \ will buy the product and a 30% chance that they won’t.\n\nIn other situations,\
    \ the score from a classification model is transformed to a certain scale. If\
    \ we return to the world of credit scoring, credit scores tend to be scaled to\
    \ range from about 400 to about 800^([\\[14\\]](#index_split_028.html#filepos411733)).\
    \ If someone receives a score of 400 it means that they are very unlikely to repay\
    \ any credit advanced to them (<5% chance that the loan will be repaid). A score\
    \ of 800 means that they will almost certainly repay their debt (>99.9% chance\
    \ that the loan will be repaid).\n\nMost classification models used in business\
    \ generate a single score. The score predicts a simple yes/no type event, such\
    \ as those described in the aforementioned list. Where machine learning is applied\
    \ to problems with multiple outcomes, then a separate score is produced for each\
    \ possible outcome.\n\nTaken to their extreme, some of the most advanced predictive\
    \ models in use today generate thousands of scores. Each score represents the\
    \ probability of one possible outcome. An object recognition system, designed\
    \ to identify everyday objects in pictures, is one such example. The system generates\
    \ a score (probability) for each object it’s been trained to identify. Score 1\
    \ predicts a 4% chance it’s a picture of a washing machine, Score 2 a 6% chance\
    \ it’s an umbrella, Score 3 an 80% chance it’s a chair and so on. The score associated\
    \ with “Chair” is the highest and therefore the system would “Guess” that the\
    \ object is a chair.\n\nFor complex applications such as object and speech recognition,\
    \ business users won’t see the scores generated directly. Instead, an overarching\
    \ set of decision rules will be applied to translate the scores into something\
    \ more meaningful, with the results delivered via a suitable “customer friendly”\
    \ interface.\n\nRegression models on the other hand are all about quantities;\
    \ i.e. the magnitude of an event. Some examples of business applications of regression\
    \ models are:"
