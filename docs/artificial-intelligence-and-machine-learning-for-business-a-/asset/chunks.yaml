    - 权重非常多。图 8 是一个非常简单的网络。它只有 8 个输入变量和 5 个神经元，但有 36 个权重。一个典型的业务应用，例如有 100 个输入变量和
    75 个神经元，将有 7,474 个权重。


    一旦创建了神经网络，就可以像评分卡（scorecards）和决策树一样对其进行评估和使用；即为验证样本创建评分，然后用其生成类似于图 3 和图 6 所示的分数分布表。这些表随后用于根据案例获得的评分得出如何处理案例的决策规则。


    网络中权重的集合代表了训练算法识别出的模式。那么，训练算法是如何确定权重应该是多少的？创建了许多不同的算法来寻找神经网络中的权重，但它们都倾向于采用以下原则：


    1. 为每个权重分配一个随机值或零。

    2. 计算网络为开发样本中所有案例生成的评分。

    3. 评估最终分数的准确性。例如，通过附录 A 中详细介绍的方法评估模型的提升（lift）和增益（gain）属性。

    4. 调整权重以提高模型的预测准确性。

    5. 重复步骤 1-4，直到观察到模型性能不再进一步显著提高，或者经过了一定的时间。


    巧妙之处在于步骤 4，即如何调整权重。最简单的方法就是随机尝试不同的值并看什么效果最好。然而，这种方法非常低效，在现实时间内可能产生良好的解决方案。所有实际的神经网络训练算法都比这更聪明。它们根据算法每次迭代之间性能的差异，采用多种不同的权重调整策略。在过程开始，当容易获得预测性能的大幅提高时，它们会对权重进行大幅调整，然后随着性能的提高，逐渐进行较小的变化，以锁定最优解决方案。


    图 8 中的神经网络在第二层有一个单神经元（`Neuron 5`），它生成单个评分。该评分代表某人在未来 5 年内患心脏病的可能性。如果网络被用于预测多个事件的预测问题，那么则将有一个单独的神经元来代表每个事件。对于目标识别等问题，末层神经元可能会生成成百甚至上千个评分。每个评分都代表了该项目是某一特定对象的概率。得分最高的对象将作为系统生成的预测结果。


    神经网络之所以如此流行，是因为它们能够检测数据中细微的模式，而其他简单方法（如评分卡和决策树）可能无法检测到。这意味着它们可能产生更准确的预测。这是通过设置两层神经元来实现的，第一层的评分作为第二层的输入。


    神经网络的主要缺点是它们生成的评分并不直观。是的，人们可以看到模型中的各种权重是什么，并理解整体的评分计算过程，但如果我问你图 8 中哪个输入变量对最终评分的贡献最大，那么这比心脏疾病的评分卡和决策树模型要少直而易见得多。如果业务或法律要求解释最终模型评分是如何得出的，那么这可能是一个问题。


    深度学习代表了神经网络类型模型的最新演变。图 8 中的神经网络有两个层神经元，这种结构在许多传统的神经网络应用中被使用非常成功。然而，没有理由不能更多层。考虑图
    9 中的网络。它与图 8 中的网络具有相同的初始输入。还有一个单输出神经元（`Neuron 13`）用于交付最终模型评分。然而，图 9 中的网络有 4 层神经元，而图
    8 只有 2 层。


    从理论上讲，没有理由网络不能进一步扩展。考虑图 9 中的网络。它与图 8 中的网络具有相同的初始输入。还有一个单输出神经元（`Neuron 13`）用于交付最终模型评分。然而，图
    9 中的网络有 4 层神经元，而图 8 只有 2 层。


    从理论上讲，没有理由网络不能进一步扩展。根据需要，可以有 5、6、7……100 层，每层有不同数量的神经元。人们倾向于发现，随着层数的增加，网络识别复杂或细微模式的能力会提高。层越多，网络越“深”。通常来说，任何超过
    2 或 3 层的网络都可以被归类为深度学习网络，但没有统一的定义。


    ![](img/00013.jpg)

    '
