- raw: "Deciding who to lend money too is a far simpler problem than chess and there\
    \ is usually a lot of labeled development data available. Therefore, you will\
    \ get better results much more quickly with a supervised approach for problems\
    \ like credit risk assessment. The same issue applies to any type of problem where\
    \ success cannot be measured very quickly. If we return to the chess example,\
    \ the DeepMind chess playing program needed to play 68 million games to become\
    \ as good as it did. It could only do this by playing against another computer,\
    \ allowing games to be played in a fraction of a second. It could not have achieved\
    \ the same results in a reasonable amount of time if it had been playing against\
    \ human competitors in the real world. The training process would have been far\
    \ too slow.\n\nAnother weakness of reinforcement learning is the cost of failure\
    \ during the training process. If you embed a reinforcement learning algorithm\
    \ into your organization’s recruitment policy, then you are going to get a lot\
    \ of terrible hires initially which is going to cause all sorts of problems. In\
    \ a similar vein, you wouldn't want to connect a reinforcement learning algorithm\
    \ directly to the controls of a passenger airliner^([\\[47\\]](#index_split_028.html#filepos426897)).\n\
    \nOK, so finding the tops of fictional hilltops and being superhuman at chess\
    \ is all very well, but what are the real-world business applications of reinforcement\
    \ learning? To be honest, not a huge number at the moment. Personally, I’ve never\
    \ been involved in delivering a solution that used it and I don’t know anyone\
    \ who has. I’ve also done a fair amount of research and found a lot of very interesting\
    \ academic papers and enthusiastic press articles, but far fewer real world examples.\
    \ My conclusion is that the number of reinforcement learning based solutions in\
    \ use today is tiny compared to the number of supervised leaning ones. If I had\
    \ to put a figure on it, I’d guess that more than 95% of real world application\
    \ utilize supervised learning and most of the remaining 5% are unsupervised approaches\
    \ based on clustering. However, that may change in time as the technology matures.\
    \ Intuitively, if you have algorithms that can build something that plays chess\
    \ or Go better than any living person, then they must have potential in other\
    \ areas.\n\nOne area where reinforcement learning looks like having an impact,\
    \ is in improving the efficiency of sophisticated control systems in uncertain\
    \ or chaotic environments. Complex systems such as power grids, heating systems\
    \ and server farms, have lots of controls which are adjusted to manage different\
    \ parts the system. The relationship between the controls and the performance\
    \ of the system is not always obvious. It’s not a simple case of one control impacts\
    \ just one thing – everything is interconnected. Tweaking the water pressure in\
    \ the cooling system of a power plant to improve turbine performance has a negative\
