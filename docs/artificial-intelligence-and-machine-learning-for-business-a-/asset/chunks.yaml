  trans: '


    这种情况的例外是当作为概念验证构建预测模型时。例如，一名数据科学家可能会被聘佣来观察构建预测模型是否可行，并进行一些实验性的模型构建以查看项目是否具有可行。毕竟，你最不想做的事情就是为机器学习构建一套完整的端到端
    IT 和决策基础设施，然后发现你根本无法使用它。


    在这样的情况下，可能可以在净收入和总收入之间推导出某种类型的映射关系。然而，总收入和净收入并不总是具有良好的相关性，并且在某种程度上取决于之前的纳税历史、家庭状况和收入来源。


    从严格意义来说，大数据涵盖的不只是关于人的数据。该术也适用于关于过程或系统的海量数据，例如气候变化数据、卫星成像数据、交通数据、制造工厂产生的数据等。


    当然，事实并非如此。当时的生活同样艰难，但问题有所不同。人们花费了大量时间试图寻找的解决方案，以最大限度地利用有限的存储空间并优化当时极其有限的计算能力。当时可用于机器学习的软件也远比现在的复杂得多。


    机器学习要求数据以数值或类别格式存在。因此，一项关键的数据处理任务是将所有数据转换为这种格式。例如，创建是/否指标来表示文本中表达的积极或消极情绪，或创建计数器来记录某些单词或短语出现的次数。


    例如，参见以下元研究：Orlitzky, M., Schmidt, F. L., Rynes, S. L. (2003). ‘Corporate Social
    and Financial Performance: A Meta-analysis.’ Organization Studies, volume 24,
    number 3, pp 403-441.


    这与英国信息专员办公室（ICO）描述的“试金石”相似。ICO (2017).‘Big data, artificial intelligence, machine
    learning and data protection. V2.2.’ pp.78. ICO.


    信息专员办公室。[`ico.org.uk/for-organisations/guide-to-the-general-data-protection-regulation-gdpr/individual-rights/rights-related-to-automated-decision-making-including-profiling/`](https://ico.org.uk/for-organisations/guide-to-the-general-data-protection-regulation-gdpr/individual-rights/rights-related-to-automated-decision-making-including-profiling/)
    访问 06/05/2018。


    GDPR 第 22 条。


    GDPR 第 22 条赋予了欧盟各国政府定义进一步例外的能力。例如，为了检测逃税或其他类型的欺诈而进行的自动决策。欧洲理事会 (2016)。CONVENTION
    FOR THE PROTECTION OF INDIVIDUALS WITH REGARD TO AUTOMATIC PROCESSING OF PERSONAL
    DATA ETS No. 108. Draft Explanatory Report. Para 75. GDPR 序言 58 和 60。数据保护工作小组
    (2017).‘Guidelines on Automated decision-making and Profiling for the purposes
    of Regulation 2016’. pp 11. 人可能还需要通过计算在假设没有逾期还款的情况下的个人评分来支持这一陈述，并确认在那种情况下申请将获得接受。如果申请人在即使有逾期还款的情况下也会被拒绝，则需要提供该决策的额外理由。数据保护工作小组。
    (2017).‘Guidelines on Automated decision-making and Profiling for the purposes
    of Regulation 2016’. pp 14. 信息专员办公室 (2017).‘Big data, artificial intelligence,
    machine learning and data protection.’ ICO. 按照银行和其他存款机构的要求，使用内部评级法（IRB）方法计算其资本准备金。BBC
    (2011).‘IBM''s Watson supercomputer crowned Jeopardy.’ BBC [`www.bbc.co.uk/news/technology-1249168`](http://www.bbc.co.uk/news/technology-1249168)
    访问 06/04/2018. Marks, P. (2012)‘Driverless cars ready to hit our roads.’ New Scientist.
    [`www.newscientist.com/article/mg21328585-300-driverless-cars-ready-to-hit-our-roads/`](https://www.newscientist.com/article/mg21328585-300-driverless-cars-ready-to-hit-our-roads/)
    访问 28/03/2018. 行业将自动驾驶技术分为 5 级。第 1 级涵盖简单的驾驶辅助设施，如辅助泊车和自适应巡航。第 5 级在理论上是你不需要方向盘或其他控制——汽车可以自己完成一切。这些可以一直自动运行的火车，包括检测轨道障碍并处理其他类型的紧急情况。Brooks,
    R. (2017).‘The Big Problem With-Driving Cars Is People.’ IEEE Spectrum [`spectrum.ieee.org/transportation/self-driving/the-big-problem-with-selfdriving-cars-is-people`](https://spectrum.ieee.org/transportation/self-driving/the-big-problem-with-selfdriving-cars-is-people)
    访问 06/05/2018. 这是美国宪法中赋予公民携带武器的部分（枪，有很多）。任何接近限制这种权利的建议（枪支管制）都是政治热点。Warren, T.
    (2018).‘Despite CES hype, self-driving cars are not for sale.’ The Verge [`www.theverge.com/2018/1/13/16887728/detroit-auto-show-2018-ces-self-driving-cars-toyota-ford-hype`](https://www.theverge.com/2018/1/13/16887728/detroit-auto-show-2018-ces-self-driving-cars-toyota-ford-hype)
    访问 06/05/2018。


    柯达是数码相机的发明者，但最初决定不开发该技术。这是因为他们将其视为对传统胶片相机业务的威胁。他们拥抱新技术的延迟可能是柯达从全球最认可品牌之一迅速衰落到十年内破产的关键特征。同样，百视达在
    21 世纪初是全球领先的视频租赁公司，但未能足够地适应在线流媒体服务的兴起。


    我也尝试了“管理成功”和“管理失败”，以及简单的“失败”和“成功”。每次都得到相似的结果。


