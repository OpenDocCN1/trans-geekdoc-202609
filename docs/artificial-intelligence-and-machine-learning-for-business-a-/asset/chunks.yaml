    预测个人消费者行为的首项应用研究是由 David Durand 完成的。Durand, D. (1941).《消费者分期融资中的风险因素》第 1 版。纽约：美国经济研究局。这是基于著名统计学家
    R.A. Fisher 的工作。Fisher, R. A. (1936).《分类问题中多重测量的使用》。优生学年鉴 7 (2): pp 179–188。


    最小二乘法及相关方法开发于 20 世纪初，逻辑回归则于 20 世纪 60 年代。神经网络和决策树在 80 年代兴起，而集成学习方法（如随机森林、装袋法和梯度下降）则发明于
    90 年代。机器学习最最近的进展，例如“深度强化学习”，代表了这些现有方法的演变而非革命。


    Microsoft Azure. [`azure.microsoft.com/en-gb/services/machine-learning/?&wt.mc_id=AID529440_SEM_`](https://azure.microsoft.com/en-gb/services/machine-learning/?&wt.mc_id=AID529440_SEM_)


    Google Cloud Prediction API. [`cloud.google.com/prediction/`](https://cloud.google.com/prediction/)


    Alexa 语音服务 (AVS) [`developer.amazon.com/public/solutions/alexa/alexa-voice-service/getting-started-with-the-alexa-voice-service`](https://developer.amazon.com/public/solutions/alexa/alexa-voice-service/getting-started-with-the-alexa-voice-service)
    访问于 2018/04/05。


    [`www.kaggle.com/`](https://www.kaggle.com/)


    在写作时，提供的最高奖励是 Zillow 房地产估值模型奖。该奖金池为 120 万美元。[`www.kaggle.com/c/zillow-prize-1`](https://www.kaggle.com/c/zillow-prize-1)。访问于
    2018/02/03。


    许多（但并非所有）信用分都是以这种方式缩放的。更正式地说，信用评分模型的“标准”缩放是：500 分等同于 50% 的良好还款概率（赔比为 1:1）。之后每增加
    20 分，概率翻倍。520 分意味着良好还款的赔比为 2:1（66% 的还款概率），540 分赔比为 4:1（80% 的还款概率），依此类推。


    O’Neil, C. (2016).《数学毁灭性武器》。Alan Lane 出版。


    Lee, D. (2016)《Tay：微软就种族主义聊天机器人丑闻发表道歉》。BBC [`www.bbc.co.uk/news/technology-35902104`](http://www.bbc.co.uk/news/technology-35902104)。
    访问于 2018/04/06。


    心脏病有很多不同的类型，病因和症状各异，但为了简单起见，在本例中我们将心脏病视为单一疾病。


    身体质量指数 (BMI) 的计算方法是：个人的体重（公斤）除以身高（米）的平方。对于一个身高 180cm、体重 80kg 的人，其身体质量指数为：`80/(1.8
    * 1.8) = 24.69`。在英国，BMI 19-25 被认为是正常。BMI 低于 19 表示个人可能体重不足。25-30 表示可能可能超重，超过 30
    为肥胖。注意 BMI 仅供参考，体型、年龄和肌肉量等因素同样重要。某些运动员由于肌肉量大会被 BMI 归类为超重。


    有很多算法可以使用，但流行的是`逻辑回归`。其他流行方法包括遗传算法、线性规划。在实践中，单个样本会被分为两部分：开发集和验证集。通常做法是将 70% 或
    80% 的案例分配给开发集，剩下的 30% 或 20% 用于验证集。这是因为在构建预测模型时，一个主要的担忧是`过拟合`。过拟合意味着机器学习过程在开发集中发现了在总体中并不存在的关系。在实践中，我们会提取多个验证样本而非仅取一个。其中至少一个会是“时间外”样本，即来自开发集不同时期的样本。如果验证样本的结果描述相似，则通常足以表明模型将按预期工作；即其预测性能和准确性与观察到的结果相似。


    该模型的最低得分为 0。最高分值为 1。


    计算如下：结果为：`1 / 0.017`。


    我承诺过不提供复杂的公式，但我还是会加入一个。有很多激活函数，但非常常用的是`逻辑函数`。它的计算公式为 `1/(1+e ^(-Initial Score)))`。`e`
    的值为 2.718。`e` 就像 `PI` (3.142) 一样，出现在数学和统计学的各个地方。


