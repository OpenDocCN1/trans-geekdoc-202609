  - 附录 C 机器学习与人工智能中的常用术语
- - '#'
  - 预测时期（Forecast horizon）。许多（并非所有）预测模型都会预测未来未知的事件或数量。预测时期是模型进行预测的时间跨度。营销模型通常预测几小时或几天跨度内的响应。在医学领域，在预测特定医疗状况的生存概率时，会使用长达多年的预测时期。
- - '#'
  - 增益图（Gains chart）。一种用于展示模型收益的常用可视化工具。通常与提升图（lift chart）结合使用。更多信息请参阅附录 A。
- - '#'
  - 技术跃层曲线（Gartner Hype Cycle）。技术跃层曲线将新技术分为五个阶段，捕捉了我们倾向的先高估后低估其价值，最终达到中间位置某个水平的过程。更多细节请参阅Gartner网站。[https://www.gartner.com/technology/research/methodologies/hype-cycle.jsp]
- - '#'
  - GDPR。通用数据保护条例（Regulation (EU) 2016/679）。该条例适用于所有欧盟国家，取代并更新了此前的数据保护立法。GDPR 对欧盟国家个人数据的收集、存储和使用施加了若干项义务和限制。在本书的语境下，一个关键特征是它赋予了人们对于自动化决策系统如何对其做出决策的某些权利（例如基于机器学习得出的预测模型所做出的决策）。
- - '#'
  - 通用人工智能（General AI）。在许多不同问题领域中以人类智能方式运行，并能像人类一样适应新情况的人工系统被描述为拥有通用人工智能。目前使用的任何人工智能系统都不能认为拥有通用人工智能。另见窄人工智能（Narrow
    AI）。
- - '#'
  - Hadoop。一种数据存储解决方案，利用大量“现成”台式电脑来快速存储和处理海量数据。
- - '#'
  - 物联网（Internet of Things）。这描述了智能日常设备，如冰箱、洗衣机甚至灯泡，这些设备可以连接到互联网或其他系统。这能够收集有关它们使用的数据，并允许用户远程控制这些设备，例如在回家的路上通过手机
    App 设置洗衣机启动。
- - '#'
  - K 均值聚类（K-Means Clustering）。一种流行的聚类方法。其目标是通过最小化每个簇内观测值之间的差异，将群体中的观测值分为 K 个相似的组。
- - '#'
  - 提升图（Lift chart）。一种用于展示预测模型实际收益的常用图表工具。通常与增益图结合使用。更多信息请参阅附录 A。
- - '#'
  - 线性模型（Linear model）。一种流行的、易于理解和使用的预测模型。通过将每个特征的值与其相关的权重相乘，然后汇总所有结果来计算得分。表示线性模型的一种流行形式是评分卡（scorecard），例如第
    5 章中介绍的那种。
- - '#'
  - 线性回归（Linear regression）。创建线性模型和评分卡最流行的方法之一。其发展可溯到 100 多年前。线性回归所需的计算能力比神经网络等高级方法低几个数量级。因此，它可以非常成功地作为初步数据选择/建模工具，在使用（深度）神经网络等方法进行最终模型构建时，用以减小数据集的规模。
- - '#'
  - 逻辑回归（Logistic regression）。一种用于创建分类模型的非常简单且流行的方法。逻辑回归广泛用于创建线性模型和评分卡，例如第 5 章中介绍的心病评分卡。
- - '#'
  - 机器学习（Machine learning）。机器学习寻找特征（数据中的模式）的过程。机器学习算法源于对人工智能和模式识别的研究。用于训练（深度）神经网络和支持向量机的算法是机器学习方法的两个范例。
- - '#'
  - MapReduce。一种编程方法，能够快速处理存储在 Hadoop（以及大数据平台）上的数据。MapReduce 的工作原理是将数据处理任务分成许多较小的子任务，然后可以在组成
    Hadoop 网络的计算机网络上并行实现这些任务。
- - '#'
  - 模型（Model）。对现实世界系统或情况的数学表示。模型用于确定现实世界系统在不同条件下的表现如何。另见预测模型（predictive model）。
- - '#'
  - 监控（Monitoring）。预测模型的性能往往随着时间的推移而恶化。因此，在模型实施后启动监控机制以持续衡量模型的表现是谨慎的。当监控显示性能性能恶化时，会对模型进行重新开发。
- - '#'
  - 窄人工智能（Narrow AI）。仅在某一或两件事上非常出色的人工智能应用，但无法应用于其设计范围之外的问题。目前使用的所有人工智能应用都可以被描述为窄人工智能系统。另见通用人工智能（General
    AI）。
- - '#'
  - 神经网络（Neural network）。一种使用机器学习得出的流行预测模型类型。神经网络非常重要。
