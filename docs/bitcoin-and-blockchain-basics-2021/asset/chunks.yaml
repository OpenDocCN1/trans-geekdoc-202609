    # 6. The risk of licensing and registration


    Doing this type of business requires registration and licensing. But most times,
    bitcoin exchangers are not registered, especially based on the monetary regulations
    in such regions. This will put investors'' funds at risk if hackers attack such
    business.


    # Getting a Cryptocurrency License


    You can get a cryptocurrency license if you want to set up and run a bitcoin exchange.
    You need to register your business with `FinCEN`, since every money service business
    must register with them. This will enable you to get a money transmitter license.


    If you want to apply for a license, you can register on the website of `FinCEN`
    easily. But getting the license is really difficult. Examples of organizations
    that have money service licenses are American Express, Western Union, and PayPal.


    Sometimes, you may wait for a longer time before obtaining a Money Transmitter
    License (`MTL`). Therefore, obtaining a cryptocurrency license is possible through
    `MTL`, although the fee is very high. In most cases, it can take many years.


    Despite obtaining a registration license, the process of regulating bitcoin exchangers
    is not certain yet, even in the United States. Therefore, bitcoin exchangers may
    not comply with regulatory laws.


    Here are a few considerations to make before proceeding:


    *   Decide the scope of operations your exchange can handle. You may decide to
    run the business within a specific territory, region, nation, or internationally.

    *   The second step is to undertake the legal requirements. Under legal considerations,
    decide whether to consult a legal professional to assist you to determine where
    to set up your office, the operational procedures, and structure of your firm.
    Also, consider how to minimize your exposure to risks and other ways to reduce
    your liability. Check the types of financial regulations, requirements, and compliances
    in your area. You can use `Merkle Tree` to obtain an insightful advanced international
    map of how the regulatory fields will be.

    *   Determine the types of banking relationships to establish that will enable
    you to do your business successfully. But banks may be unwilling or reluctant
    in providing financial services to online money exchanges.

    *   Consider the volume of your operations. You need to have enough active, live
    volumes to maintain a successful operation. This will enable you to transfer liquidity
    from large exchanges such as `Bitfinex` to your own bitcoin exchange. You will
    also determine how to boost your media presence, design your brand and maintain
    it, manage your messaging services, and handle ads and retargeting.

    *   Differentiate your brand from others by defining whether it is an advanced
    bitcoin exchange for investors and traders or a retail bitcoin exchange.

    *   Consider the technical requirements your exchange. This may involve a complex
    technical architecture that can handle deposits and withdrawals, including pairing
    of orders. These technical structures include risk management system, accounting
    and audit, matching engine, payment gateways, and wallet management.

    *   Adopt a better security structure for your firm. Some security measures to
    adopt include 2-factor authentication for participants, anti-money laundering
    solutions (`AML`), know your customer (`KYC`), and ensure a secure data center
    for network and hardware security.

    *   The last consideration is a standard internal security structure among your
    workers. This is also known as `CCSS` – Cryptocurrency Security Standard.


    # CHAPTER TEN


    # Making Money in Cryptocurrency


    As bitcoin is making waves all over the world, captains of industries, government
    executives, and individuals are asking, "How can we make money in cryptocurrency?"


    Here are some ways you can make money through bitcoins:


    1.  Using a masternode – this keeps track of the blockchain originally. The nodes
    are always operational like the full nodes of bitcoins. It also involves validating,
    announcing, and adding authentic transactions to the nodes. Master nodes can handle
    various tasks in a blockchain such as elections and other protocol operations.

    2.  Rewarding you with bitcoins for locating vulnerabilities and bugs in the systems
    of corporations and organizations. This happens in many bitcoin exchanges and
    peer-to-peer organizations to improve their operations.

    3.  By trading – In trading bitcoins, you take advantage of the volatile nature
    of bitcoins. But you have to understand the market before venturing in. Different
    types of trading include day trading, swing trading, and arbitrage.

    4.  Through bitcoin faucets – if you can handle and complete surveys and watch
    adverts, you will be rewarded with some bitcoins.

    5.  You can make money through mining – in this process, miners use computers
    to resolve complex mathematical issues. By cracking the arithmetic codes, miners
    are paid some tokens of bitcoins. In the past, people use their PCs at home but
    nowadays, you can use sophisticated equipment that costs thousands of dollars.
    You can join a mining cloud, which is a group of miners working through interconnected
    mining devices. Another option is the bitcoin mining pool.

    6.  Engaging in binary trading – in cryptocurrency, binary trading has double
    options. The two options include a trader buying an option and an expiration time.
    It could be that the trade is out of the money or in the money. You just have
    to bet where the funds are going.

    7.  Receiving your payments through bitcoin – you can get bitcoins through your
    earnings and salaries.

    8.  Doing micro-jobs online including pay-to-click – Undertaking online surveys
    and watching videos or ads for companies can give you the opportunity to earn
    some cryptos in return.

    9.  Earn some cryptos by writing about bitcoin – writers can earn bitcoins by
    writing about cryptocurrencies.

    10. Give out bitcoins as loan to people and get interest on it.

    11. Playing on the bitcoin gambling market.

    12. Get cryptos through buying and holding method – buying and holding is a term
    used for describing the nature of buying bitcoins and keeping them for life.

    13. Through affiliate marketing – you can bring in new customers through affiliate
    marketing. Through this process, you can transact and earn bitcoins.


    ## What is Buy and Hold?


    This is a clear-cut strategy on how to trade bitcoin and make money. To hodl stands
    for buying and holding bitcoin. It is easy and a convenient method of investing
    in bitcoin.


    Acquire a bitcoin wallet and buy bitcoins (`BTC`). After purchasing, have the
    hope that the prices will rise in the future before you sell.


    Hodl was a typographical error for hold. But in bitcoin communities, it was adopted
    as hold on for dear life.


    ## Designing your Investment Plan in Bitcoin


    If you want to design an investment plan in bitcoin, you should consider two key
    investment objectives, which are wealth accumulation and wealth preservation.


    Here are proven strategies to set your bitcoin investment plan:


    1.  Set goals and recognize opportunities in risks – determine the risks, opportunities,
    and values of bitcoin. Ask yourself if bitcoin will survive for a long-term. Comparing
    it with a fiat currency, will it be more valuable than other conventional currencies
    after a while? Be generally convinced of the opportunities available in bitcoin,
    the acceptance and handling of risks, including investment goals. Ten, you are
    set to begin the journey.

    2.  Design a plan of action to preserve wealth – how do you plan to achieve your
    goals? Great consideration should be done to handle the effects of seizure, natural
    disasters, and devaluation. You can preserve your wealth by converting a percentage
    of your reserve into bitcoin. You can acquire bitcoin through peer-to-peer, bitcoin
    exchanges, bitcoin ATMs, and over the counter desks including brokers.

