    ## A Shared Ledger


    A blockchain is a shared ledger with a logical component. It is a distributed
    ledger where the data structure is controlled within the node application. If
    the node application is functional, you can see the respective ledger or blockchain
    contents in that ecosystem.


    With the bitcoin client, you can engage in the bitcoin ecosystem and play according
    to the policies stipulated in the program code of the node application of bitcoin.


    ## A Node Application


    Setting up and operating a computer application unique to the ecosystem you want
    to use is a great feature for every internet-linked PC. Therefore, every computer
    device must run the bitcoin wallet app.


    There is a service overlay network (SON) in the blockchain. For the blockchain
    to be a node in the network, your device should be able to process application-specific
    messages and affect the shared state of the service overlay network.


    ## Virtual Machine


    This serves as the concluding logical aspect applied as part of the node application,
    which every user in the ecosystem operates. With this system, you will know how
    a computer program works on the network.


    The guidelines on a computer program command the device to function in a certain
    way and alter its state. Various features depict changes in state in a computer
    device such as: a monitor displaying data and graphics, as a change in data stored
    in the memory, as sound distributed to speakers, and as data kept on a solid state
    drive.


    A virtual machine serves as a representation of a machine designed by a computer
    program and operated with guidelines represented in a language. It also features
    as an abstraction of a machine stored within a machine.


    ## Consensus Algorithm


    Consensus algorithm is a logical part of the ecosystem, which is implemented as
    a component of the node application. This offers the guidelines for how the ecosystem
    will appear at a view of the ledger.


    In various ecosystems, you can attain consensus based on the peculiar features
    needed in the ecosystem.


    ## The Blockchain Technology


    The blockchain technology can promote trust and transparency in financial transactions
    and record keeping. The principle of blockchain involves recording data in a manner
    that it cannot be altered, hacked, and no one can manipulate the system.


    This comprises a digital ledger of transactions that is duplicated and distributed
    over the whole network of computer systems linked on the blockchain. Every block
    linked on the chain has a number of transactions. Whenever a new transaction happens
    on the blockchain, a record of that deal is included in the ledger of every member.
    This is called distributed ledger technology (DLT). In this case, the decentralized
    database is managed by several individuals participating in the network.


    Therefore, blockchain is a kind of distributed ledger technology using a hash
    to record transactions with a cryptographic signature that could not be changed.


    Here are some features of a distributed ledger:


    1. It is immutable and unchangeable.

    2. DLT is unanimous since all users validate the records.

    3. This ledger is time-stamped and registered on a block.

    4. The users have a pseudonymous or anonymous personality.

    5. A distributed ledger technology is programmable.

    6. The records on DLTs are secured and encrypted.

    7. Maintains utmost transparency by ensuring all users have access to a copy of
    the ledger.


    # Chapter Six


    # How to Use Blockchains


    Blockchains are useful in many ways, as it serves as the basic distributed ledger
    technology (DLT) that anchors electronic currencies. These are shared databases
    with entries that can be confirmed by peer-to-peer systems but must be encrypted.


    There are several use cases in blockchain:


    * Blockchain is useful in capital markets for improving operations, quicker clearing
    and settlement, and proper audit trails.

    * This technology is valuable in international payments and money transfers.

    * Blockchain is used to mitigate against money laundering. This technology supports
    the KYC (Know Your Customer) protocols necessary for maintaining customer records.

    * Trade finance – Before now, handling trade finance is difficult as businesses
    are disrupted by slow processes making liquidity management cumbersome. Trading
    between borders involves large quantities of data but blockchain has streamlined
    the processes. Corporate organizations can deal with each other across borders.

    * This technology is relevant in the media industry as it reduces costs, fraudulent
    activities, safeguards rights of content of intellectual properties such as journals,
    music, etc.

    * Secure for accounting and auditing. It reduces the possibility of mistakes by
    ensuring clear and trustworthy records.

    * Smart contracts are the best blockchain application suitable for insurance.
    Insurers and their customers use these contracts to handle their claims while
    maintaining transparency and security.

    * Useful for home sales to initiate quick transaction among realtors to reduce
    fraudulent activities using encryptions, thereby maximizing transparency.

    * Managing power supply transactions such as metering, billing, and processes
    of clearing. Other areas where blockchain is necessary include renewing energy
    certificates, origin guarantees, asset management, and documenting ownership.

