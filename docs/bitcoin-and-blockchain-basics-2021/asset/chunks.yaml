    # INTRODUCTION


    Do you think that bitcoins and blockchains are mysterious terminologies? No, these
    subjects are easy to understand and use. This book introduces cryptocurrencies
    in the simplest terms that any beginner can grasp and start making investments.


    Bitcoin and blockchain are evolving technologies that are trending in the financial
    sector all over the world. Bitcoin is not the only cryptocurrency on the market.
    Most Fintech experts have made fortunes trading and investing in bitcoins.


    The blockchain industry is run by cryptofinance. But you need to know the various
    types of cryptocurrencies available and how to access and use them profitably.
    With this book, you will understand the cryptos available and how you can trade
    or invest them.


    # CHAPTER ONE


    # Understanding Bitcoins


    ![](Images/image00119.jpeg)


    ## A stack of Bitcoins


    In January 2009, bitcoin, a digital currency was created. The abbreviation associated
    with bitcoin is `BTC`. This phenomenon called bitcoin developed from the trendy
    and mysterious Satoshi Nakamoto, a pseudonymous personality or group of persons
    believed to be the initiators and originators of this currency.


    Despite this guess, the inventor of bitcoin is a hidden personality with no clear-cut
    identity. Experts are of the opinion that the reason for concealing his identity
    is to evade some government regulations, probing, and subsequent incarceration,
    since this evolving currency is already disrupting the financial schemes of so
    many nations, multinationals, and individuals.


    Bitcoin is already competing with several top currencies in the world with a value
    higher than most financial tools in terms of fiscal valuation. The charges for
    transactions are very low compared to other regular online payment platforms.


    This digital currency is handled by a decentralized regulatory body. It is not
    managed or handled by any government or bank, and not valuable to be used as a
    commodity. Bitcoins exist as balances prepared on a public ledger. In this case,
    everyone has unrestricted access to the records.


    The emergence of bitcoin has led to the evolution of other cryptos known as altcoins,
    even though it is not used as a legal tender. But the most popular cryptocurrency
    is bitcoin.


    ## The Origin of Bitcoins


    On August 18th, 2008, `bitcoin.org` was registered as a domain name. However,
    the identity of the person or group of persons that registered it is not available
    to the public. The reason could be for privacy or security purposes. Therefore,
    the domain is regarded as WhoisGuard Protected.


    Also, on October 31st, 2008, a publication was made on the Cryptography Mailing
    list. This was published on `metzdowd.com` by a group of persons or a person called
    Satoshi Nakamoto. It reads, "I''ve been working on a new electronic cash system
    that''s fully peer-to-peer, with no trusted third party".


    Now, this whitepaper was published on `bitcoin.org` with the caption "Bitcoin:
    A Peer-to-Peer Electronic Cash System". Nowadays, it has become the Magna Carta
    for bitcoin operations and management.


    Again, on January 3rd, 2009, Block 0 regarded as the genesis block, the first
    block of bitcoin was mined. This block contains an inscription: "The Times 03/Jan/2009
    Chancellor on brink of second bailout for banks". This text could imply that it
    was mined on or after that date. It is also useful for political commentaries.


    Additionally, the first version of bitcoin software was published on the Cryptography
    Mailing list on January 8th, 2009.


    Moreover, Block 1 of bitcoin was mined on January 9th, 2009. After that, bitcoin
    mining became a trending business.


    ## A Network of Virtual Payments


    Bitcoin is designed as a network of virtual payments. It features as a web-based
    version of credit card swipe device enabling merchants to process orders through
    phone, internet, or mail.


    Payments that could be difficult with credit cards can be effected using the bitcoin
    through virtual payment platforms. The vendor needs to sign up for virtual terminal
    payment service by registering his or her payment information. These data include
    Name, Address, Card Verification Value, Type, and Number of Credit Card. The information
    will be used for online retail transactions.


    These virtual payment plans don''t require specialized software or hardware. The
    transactions are done through the website of the virtual payment provider. Therefore,
    a third-party provider will ensure that the requirements of the `PCIDSS` - Payment
    Card Industry Data Security Standard are met.


    ## What is Satoshi?


    The smallest unit of the bitcoin cryptocurrency is called the satoshi. This was
    coined from the name of the founder of the cryptocurrency, Satoshi Nakamoto. He
    designed the protocol used in bitcoin and blockchain.


    The rate of satoshi to bitcoin is one hundred million satoshis to one bitcoin.
    You can split bitcoins into smaller units to ease and facilitate smaller transactions.


    As I have said, bitcoins exist in the digital world.


    Therefore, one bitcoin (`BTC`) = 1,000 millibitcoins (`mBTC`)


    One bitcoin = 1,000,000 microbitcoins (`µBTC`)


    One bitcoin = One hundred thousand satoshis


    However, it is believed that Satoshi Nakamoto may own up to one million bitcoins.
    This is equivalent to 100,000,000,000,000 satoshis. You can convert bitcoins to
    other currencies and from other currencies.


    ## Changing your Opinion


    Most persons are yet to believe in the reality of this trending digital currency.
    Other persons are considering its legality as they think that investing in bitcoins
    is a fake and fraudulent activity. There were several predictions that bitcoins
    will never surpass its 2017 peak of twenty thousand dollars.


    ![](Images/image00121.jpeg)


    Bitcoin growing consistently


    However, many persons believed that bitcoin will go to zero. But some investors
    want to buy it at a price far above $0. For instance, some persons are willing
    to buy it at over one thousand dollars while others are waiting for it to appreciate
    to over ten thousand dollars before buying. They are speculating that the price
    may increase as they wait patiently before making a buying decision.


    This trend has cushioned the relevance of bitcoin, giving it the feet to stand
    and thrive amidst fears of losing value.


    # CHAPTER TWO


    # How Bitcoins Work


    ![](Images/image00122.jpeg)

