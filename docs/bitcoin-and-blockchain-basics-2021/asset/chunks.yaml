    # The Lightning Network: A Second Layer Protocol


    However, the second layer is the **Lightning Network**, a protocol on bitcoin.
    In this case, bitcoin is applied as a native denomination. This entails that only
    persons with the original bitcoin can use Lightning. That means **Lightning Network**
    is a cluster of bidirectional payment channels.


    This new functionality layer enables a speedy transfer of bitcoin from peer-to-peer
    with a marginal variation from the first layer. With this, you can change channel
    balances but don''t need instant settlement on the initial layer. From the foregoing,
    I can infer that unsettled or unclaimed bitcoin transactions could be regarded
    as Lightning transactions.


    This situation in the blockchain network is risky. The reason is that cryptocurrencies
    stored in the **Lightning Network** protocols or channels of the system can be
    stolen by fraudulent participants. This can happen if node operators are not safeguarding
    the base layer and checking the nodes. Such fraudulent acts can clear all the
    cryptos in such channel.


    The **New Functionality Layer (Lightning Network)** is important since it is a
    fully reserved routing network with zero sum. You can access and use this protocol
    if you have original bitcoin. Also, all the routing charges incurred by liquidity
    users are fully paid to liquidity providers. With this system, the **New Layer**
    can function using one of the real features of bitcoin, which is scarcity.


    Another important feature of the **New Layer** is that Lightning does not carry
    the load of confirming the first layer. This makes exchanging bitcoin easier and
    constant without using up block space.


    The first layer transactions can be expressed as financial agreements. This situation
    makes the protocol is featured as a capital market layer. The **New Layer** is
    designed as a market for liquidity and capital. With this system in place, you
    can distribute bitcoin all over the world without waiting for confirmation or
    approval by anyone.


    Therefore, the **New Layer Functionality** features two core aspects of a financial
    transaction, which are risk premium and time value of the asset.


    ## Using Bitcoin as a Financial Tool


    Under the United States (U. S) GAAP, bitcoin cannot be used as a financial tool.
    The reason is that it does not represent a contract establishing an obligation
    or right to receive or deliver cash. Also, it does not represent cash or even
    any other financial tool.


    ## Factors Influencing the Price of Bitcoin


    Some of the factors influencing the price of bitcoin include:


    1.  The payments or benefits given to bitcoin miners for verifying transactions
    added to the blockchain.

    2.  The number of altcoins competing against one another.

    3.  The internal management of the blockchain technology.

    4.  The guidelines adopted for selling and buying bitcoins.

    5.  The exchanges where these cryptocurrencies.

    6.  Another factor influencing bitcoin is the cost of producing a bitcoin through
    mining.

    7.  The supply and demand of bitcoin in the market.


    ## The Volatile Nature of the Price of Bitcoin


    As a peer-to-peer cash process but the price needs to be stable on the market.
    Also, it needs the regulation and control of governments. The volatility of bitcoin
    exceeds its potential role in portfolios.


    In this case, bitcoin cannot serve as a medium of exchange. Also, it has a limited
    use as an investment tool. The volatility of the prices of bitcoin is extreme
    and much higher than the volatility of some major currencies such as the US dollars,
    the Euro, and the Yen.


    The excess volatility affects the potential role in portfolios. From the foregoing,
    I can infer that bitcoin cannot function as a medium of exchange due to volatile
    prices but can serve as a store of value.


    Bitcoin is also affected by deflation but if you can invest small values and leave
    it for a longer period, you may get huge returns on your crypto investments. But
    if you are using it either as currency or investment, it could be adversely affected
    by the degree of volatility making bitcoin a bad choice to be used as currency.


    To minimize excessive volatility of bitcoins and enhance the benefits of the blockchain
    network, other altcoins were developed, since they are considered to be less volatile.


    ## What are the Risks in Using Bitcoin?


    Here are some risks associated in using bitcoin:


    *   It serves as an investment opportunity but no collateral to back up your investment.

    *   Also, no government regulation to protect your cryptocurrency.

    *   A risk of financial loss, as it is treated as a Ponzi scheme.

    *   Bitcoin technology relies so much on digital technology.

    *   Pool miners can create new blocks and withhold it from the network.

    *   It is not a widely accepted currency.

    *   Fluctuating market prices.

    *   Bitcoin is prone to hacking, cyber-fraud, and other online thefts of cryptos.

    *   Bitcoin is a new technology. The future prospects are not yet known. Invest
    carefully.


    ## How to Avoid the Risks


    Bitcoin has the potentials of becoming a global currency useful for online monetary
    exchanges across borders without the issues of a national currency. Online trading
    is gaining more grounds making the launching of bitcoin in 2009 by Nakamoto, a
    successful venture.


    There are some risks associated with the use of bitcoin, which you should know
    and understand how to avoid them.


    1.  A constantly fluctuating and changing prices in the market. It is better to
    make little investments in bitcoin and wait for them to appreciate than investing
    much with the potential of losing more too.

    2.  Fake bitcoin exchanges can lead to fraudulent deals. The Securities and Exchanges
    Commission including the Consumer Finance Protection Bureau have warned against
    these transactions.

    3.  The investment is susceptible to theft by cybercriminals through hacking.
    Lost bitcoins cannot be recovered. Most persons lose their money during exchanges
    or mining. Hacking occurs on bitcoin exchanges too often, especially on bitcoin
    wallet.

    4.  Bitcoin is an evolving technology. No one can tell what the future holds for
    cryptocurrencies. It may be banned globally or went into oblivion. Therefore,
    tread with caution and prepare your mind either for the worst or best of bitcoins
    on the market.

    5.  Misplacement of the keys of your bitcoin wallet. Ensure that you store your
    private key on paper or other devices for easy retrieval.

    6.  A mining pool can create a block using computational power and withhold or
    hide it from others.

    7.  No regulation such as Central banks or government controlling the activities
    of investors on the bitcoin network.

    8.  Bitcoin is used as an investment opportunity. Investors buy bitcoins and invest
    such for profitability.

    9.  It is not taxable. This makes it to pose a great risk to government currency,
    due to competition in the market.

    10. Bitcoin is a technologically-based financial instrument. Mining of bitcoins
    is done online. Storage of bitcoins is done with virtual wallets. Therefore, digital
    technology makes bitcoin worthwhile.

    11. It has a limited use as most persons and organizations are yet to accept it
    as a form of financial exchange.

    12. It poses an avenue for financial loss. Some persons regard it as a Ponzi scheme.
    It is the initiators at the top that benefit more than others.


    # Chapter Nine: Trading and Investing in Bitcoin


    If you want to learn about how to trade and invest in bitcoins, `BTC` is the symbol
    used in representing the cryptocurrency.


    To earn a high interest on your cryptoassets, you can begin with a savings account.
    This type of accounts can pay you up to twelve percent. However, you can experience
    some risks with this type of account.


    Despite the volatility of the bitcoin market, you invest in bitcoin the way you
    do stocks.


    Here are the processes to follow:


    *   Sign up for a brokerage account at an organization that allows investment
    in bitcoins.

