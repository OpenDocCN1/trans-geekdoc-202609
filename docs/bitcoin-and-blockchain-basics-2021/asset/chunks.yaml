    # Bitcoin vs Blockchain


    But bitcoin is a peer-to-peer electronic system, or a decentralized digital currency.
    Bitcoin users can send funds to one another without the interference of a bank
    or government regarded as third parties. Bitcoin is a type of cryptocurrency using
    the blockchain technology even though all altcoins use the blockchain technology.
    Therefore, bitcoin is traded using the blockchain technology.


    Here are some variations between blockchain and bitcoin in a nutshell:


    1. Blockchain technology is versatile and can be applied in other sectors of the
    economy like healthcare, government, elections, music, etc.

    2. Blockchain is useful for auditing the supply chain, enabling users to trace
    the details of their goods.

    3. Bitcoin promotes anonymity while blockchain is a transparent system.

    4. Blockchain can be used to provide insurance cover for all citizenry nationwide
    and also process insurance claims.

    5. Bitcoin is a cryptocurrency and blockchain is a distributed ledger or database.

    6. Bitcoin operates using the blockchain technology while blockchain can adapt
    to various applications.


    ## What is a Decentralized Network?


    Decentralized network involves different separate machines that are interconnected
    to provide a pool of resources. However, every node is controlled separately with
    unique guidelines for managing workload and maintaining data on the network. These
    networks function in a distributed form as they share processing power including
    workload activities among all the servers connected in the network.


    Also, each node functions like an individual authority having separate decision
    making power about the way it communicates with other networks. But controlling
    all these interconnected servers could be difficult. However, with `IoT` (Internet
    of Things) devices and edge computing, a decentralized network can manage a complex
    structure of computer devices located remotely.


    It is better to scale a network than just adding another computer system. This
    can increase your decentralized computing resources that are available.


    A decentralized network is reliable as each node can operate separately. These
    interconnected systems form a pool of resources making the network secure and
    transparent. With this structure, if one system is hacked, the other interconnected
    devices will not be affected.


    But building and managing decentralized network is a herculean task. You need
    to continue updating and patching your systems to maintain efficiency. Information
    needs to go through different routes before getting to the recipient and this
    may take some time. Also, the devices may not be too efficient depending on latency
    and power consumption.


    ## Bitcoin and Hackers


    Hacking is not possible in the bitcoin network due to encryption of data. But
    altcoins can be stolen from a person''s wallet, especially if your private key
    is misplaced. Also, you can lose bitcoins in an online bitcoin transaction.


    The reasons that make hacking difficult in the blockchain network are:


    1. Bitcoin is integrated into a blockchain technology that is not easy to hack.

    2. Information is stored in a decentralized server making it difficult to hack.
    Users of these servers are always accessing and verifying the data to ensure transparency
    across the system. Therefore, if you want to hack a blockchain network, you need
    to break into a lot of servers or systems to fulfill your mission.

    3. Wallet can be hacked but not the entire bitcoin technology.

    4. There have been cases of phishing, cracking, hacking, and hijacking of the
    system but no successful attempt have ever been made.


    ## The Internet and Blockchain


    The internet was a revolutionary trend when it came into the market. It brought
    a significant growth and development to various sectors of human endeavors. This
    same analogy and significance is currently alluded to the blockchain technology.


    Therefore, the blockchain network is regarded as the internet. The internet is
    influencing blockchain since you cannot access the blocks of cryptos without an
    internet facility. However, the organizations are trying to integrate the Internet
    of Things into the blockchain.


    The internet was formally used to share data and send messages. But the functionality
    was expanded to cover trading and monetary exchanges. However, this needs the
    confirmation of a third party.


    Nowadays, the internet is valuable for international transactions, online trading,
    and other internet-based services. But the issue with this internet system is
    that all the data is stored in a centralized server. This makes the system prone
    to attack by hackers.


    In 2009, the blockchain technology was launched with the introduction of the bitcoin.
    This was the major selling currency of the Cryptotechnology. However, blockchain
    superseded bitcoin as it came with various apps and features making an important
    technology for economic growth and sustenance in the future.


    Some of the major apps that came with blockchain include:


    1. Cryptocurrency wallet.

    2. Smart contracts.

    3. Cryptocurrency

    4. Initial Coin Offering - `ICO`.


    But here is a critical look at some of the features differentiating the internet
    and blockchain:


    * Blockchain features peer-to-peer technology.

    * Records in the blockchain are unalterable.

    * There are no middlemen in the blockchain technology.

    * Blockchain guarantees security of data.

    * Data could easily be traced to the original sources.

    * Transparent transactions.

    * The blockchain features a decentralized ledger system.


    ## Power Consumption in Blockchain


    Most often, discussions about power consumptions in blockchain dominates the forums.
    Bitcoin mining consumes much power as the electrical energy is converted to heat
    energy. Therefore, the energy consumption of the blockchain is worrisome, since
    we consider it based on climate change and the possibility of sustaining mining
    under unfavorable conditions.


    This has become problematic due to the rate of power usage of the bitcoin network.


    ## Difficulties in Mining Bitcoin


    Difficulties in mining bitcoin surfaced and got to a high percentage during the
    invention of `ASIC` mining machines. This incident started in 2012, making miners
    jubilant as they expect high percentages of profits.


    This difficulty is a relative measure of the quantity of resources needed to compete
    for mining new bitcoins. It rose and fell during the 2016 block epochs. This also
    depends on the total hash power consumed by the system that has reduced or increased.


    # Chapter Eight: Understanding and Using the Cryptotechnology


    Another word for the Cryptotechnology is the blockchain technology. As I stated
    earlier that blockchain is decentralized database or ledger over a peer-to-peer
    system. With this network, users can confirm their transactions without the approval
    of a central authority. Examples of apps using this technology include the voting
    app, trades, and fund transfer.


    The Cryptotechnology is based on the blockchain network. The blockchain is designed
    as a futuristic app that can power the entire economy. This transparent system
    is designed as a cost-effective network that can speedily process communications
    and business deals among interconnected systems. Its efficiency is unpredictable
    and it can increase the returns on investment.


    ## What is the New Functionality Layer?


    The new functionality layer of bitcoin is called the Lightning Network. It is
    a second layer protocol functioning with the base layer protocol of bitcoin as
    the security. Over the years, layered money has been in existence. Therefore,
    bitcoin as trending focal point of the world''s reserve of wealth is also designed
    in layers.


    In 2008, the first layer of bitcoin was developed, and it has got to a global
    state of consensus. This cryptocurrency is exchanging at values with different
    currencies all over the world.

