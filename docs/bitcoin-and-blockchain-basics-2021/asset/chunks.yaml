    ## Is Blockchain Transparent?\n\nYes, blockchain is a transparent network. It\
    \ offers a ledger of transactions that can be audited. Anyone can enter the network\
    \ and view or access all transactions. The blockchain is so transparent that the\
    \ records are encrypted and no one can alter any record already made in any way.\
    \ \n\nBlockchain technology stores records in a cryptographic way that the data\
    \ of third parties are inalterable. All payments are transparent making the system\
    \ accountable to every transaction made on the platform. \n\nTherefore, every\
    \ deal on the blockchain network cannot be changed, and it is open for public\
    \ view and scrutiny. This will prevent manipulation of records by anyone or a\
    \ group of persons. \n\n## What are the Basic Units of Blockchain? \n\nThe blockchain\
    \ is divided into four basic units for proper analysis. They include a node application,\
    \ a shared ledger, virtual machine, and consensus algorithm.\n\n## A Shared Ledger\n\
    \nA blockchain is a shared ledger with a logical component. It is a distributed\
    \ ledger where the data structure is controlled within the node application. If\
    \ the node application is functional, you can see the respective ledger or blockchain\
    \ contents in that ecosystem. \n\nWith the bitcoin client, you can engage in the\
    \ bitcoin ecosystem and play according to the policies stipulated in the program\
    \ code of the node application of bitcoin. \n\n##  A Node Application\n\nSetting\
    \ up and operating a computer application unique to the ecosystem you want to\
    \ use is a great feature for every internet-linked PC. Therefore, every computer\
    \ device must run the bitcoin wallet app.\n\nThere is a service overlay network\
    \ (SON) in the blockchain. For the blockchain to be a node in the network, your\
    \ device should be able to process application-specific messages and affect the\
    \ shared state of the service overlay network.   \n\n## Virtual Machine\n\nThis\
    \ serves as the concluding logical aspect applied as part of the node application,\
    \ which every user in the ecosystem operates. With this system, you will know\
    \ how a computer program works on the network. \n\nThe guidelines on a computer\
    \ program, commands the device to function in a certain way and alter its state.\
    \ Various features depict changes in state in a computer device such as: a monitor\
    \ displaying data and graphics, as a change in data stored in the memory, as sound\
    \ distributed to speakers, and as data kept on a solid state drive. \n\nA virtual\
    \ machine serves as a representation of a machine designed by a computer program\
    \ and operated with guidelines represented in a language. It also features as\
    \ an abstraction of a machine stored within a machine. \n\n## Consensus Algorithm\n\
    \nConsensus algorithm is a logical part of the ecosystem, which is implemented\
    \ as a component of the node application. This offers the guidelines for how the\
    \ ecosystem will appear at a view of the ledger. \n\nIn various ecosystems, you\
    \ can attain consensus based on the peculiar features needed in the ecosystem.\
    \ \n\n## The Blockchain Technology \n\nThe blockchain technology can promote trust\
    \ and transparency in financial transactions and record keeping. The principle\
    \ of blockchain involves recording data in a manner that it cannot be altered,\
    \ hacked, and no one can manipulate the system. \n\nThis comprises of a digital\
    \ ledger of transactions that is duplicated and distributed over the whole network\
    \ of computer systems linked on the blockchain. Every block linked on the chain\
    \ has a number of transactions. Whenever a new transaction happens on the blockchain,\
    \ a record of that deal is included in the ledger of every member. This is called\
    \ distributed ledger technology (DLT). In this case, the decentralized database\
    \ is managed by several individuals participating in the network.\n\n  Therefore,\
    \ blockchain is a kind of distributed ledger technology using a hash to record\
    \ transactions with a cryptographic signature that could not be changed. \n\n\
    Here are some features of a distributed ledger:\n\n1.  It is immutable and unchangeable.\n\
    \n2.  DLT is unanimous since all users validate the records.\n\n3.  This ledger\
    \ is time-stamped and registered on a black.\n\n4.  The users have a pseudonymous\
    \ or anonymous personality.\n\n5.  A distributed ledger technology is programmable.\n\
    \n6.  The records on DLTs are secured and encrypted.\n\n7.  Maintains utmost transparency\
    \ by ensuring all users have access to a copy of the ledger.\n\n# CHAPTER SIX\n\
    \n# How to Use Blockchains\n\nBlockchains are useful in many ways, as it serves\
    \ as the basic distributed ledger technology (DLT) that anchors electronic currencies.\
    \ These are shared databases with entries that can be confirmed by peer-to-peer\
    \ systems but must be encrypted. \n\nThere are several use cases in blockchain:\n\
    \n*   Blockchain is useful in capital markets for improving operations, quicker\
    \ clearing and settlement, and proper audit trails.\n\n*   This technology is\
    \ valuable in international payments and money transfers. \n\n*   Blockchain is\
    \ used to mitigate against money laundering. This technology supports the KYC\
    \ – Know Your Customer protocols necessary for maintaining customer records. \n\
    \n*   Trade finance – Before now, handling trade finance is difficult as businesses\
    \ are disrupted by slow processes making liquidity management cumbersome. Trading\
    \ between borders involves large quantities of data but blockchain has streamlined\
    \ the processes. Corporate organizations can deal with each other across borders.  \
    \ \n\n*   This technology is relevant in the media industry as it reduces costs,\
    \ fraudulent activities, safeguards rights of content of intellectual properties\
    \ such as journals, music, etc. \n\n*   Secure for accounting and auditing. It\
    \ reduces the possibility of mistakes by ensuring clear and trustworthy records.  \
    \ \n\n*   Smart contracts are the best blockchain application suitable for insurance.\
    \ Insurers and their customers use these contracts to handle their claims while\
    \ maintaining transparency and security. \n\n*   Useful for home sales to initiate\
    \ quick transaction among realtors to reduce fraudulent activities using encryptions,\
    \ thereby maximizing transparency. \n\n*   Managing power supply transactions\
    \ such as metering, billing, and processes of clearing. Other areas where blockchain\
    \ is necessary include renewing energy certificates, origin guarantees, asset\
    \ management, and documenting ownership."
