    # Peer-to-Peer Payment Structures


    *   Peer-to-peer payment structures are reliable, although they have limitations.
    Some services may charge you some fees or restrict transactions based on your
    location. However, some of these services could be hacked and this can affect
    customers displaying their personal data online.

    *   Blockchain enhances security and transparency during voting by making the
    results accessible. In this case, hacking the terminal will be very difficult.
    Each voter uses his or her identity to access the terminal and make it difficult
    to use fake identity cards.

    *   Suitable for healthcare services such as age, gender, medical history data,
    and vital signs.

    *   Maintaining data storage process such as birth certificates, death certificates,
    transferring of properties, and marriage certificates that were done only in paper
    form.

    *   Blockchain is done for managing identity. In this case, you only need to submit
    your date of birth to prove or ascertain your identity.


    # The Life Cycle of Blockchains


    The life cycle of blockchains depends on the technology of the blockchain. That
    means it must be a distributed digital ledger. This is necessary to maintain the
    transparency and integrity of the smart contracts.


    The life cycle of blockchains involves four different stages such as creation,
    freezing, execution, and finalization.


    # Using Current Blockchains


    Current blockchains are designed to transform your daily activities from business
    transactions to asset management. It also covers the way you vote, usage of machineries,
    and renting of cars. On the same vein, governments, financial institutions, hospitals,
    and various organizations need the bitcoin distributed ledger for proper, transparent,
    and efficient transactions.


    Here are the various ways current blockchains could be used:


    1.  Insurance claims processing.

    2.  Cross-border transactions and payments.

    3.  Trade processing and settlement in asset management.

    4.  Useful for smart appliances.

    5.  Useful for your car or smartphone.

    6.  Needed for hard money lending or unconventional money lending.

    7.  Valuable for Internet of Things (IoT) blockchain.

    8.  Relevant for music blockchains.

    9.  Processing passports.

    10. Identity cards blockchain.

    11. Preparing of wedding certificates, birth certificates, and death certificates.

    12. It can also be used for government blockchains.


    # Different Applications for Future Blockchains


    Blockchain applications are used to enforce smart contracts. These apps eliminate
    intermediaries and promote transparency in the system, thereby making everyone
    involved accountable. This process makes it better than conventional contracts,
    as it saves money and time for everyone involved.


    Here are some applications relevant for future blockchains:


    1.  Propy will be used in real estate industry.

    2.  Mediachain will be used in music industry.

    3.  Circle will be used in Fintech and cryptocurrency.

    4.  Filament will be used in Hardware, software, and IoT.

    5.  Xage Security will be used for Cybersecurity and Internet of Things (IoT).

    6.  Chainalysis will be used in Fintech, Cybersecurity and cryptocurrency.

    7.  Opskins for gaming, cryptocurrency, and Fintech industry.

    8.  Chain will be used for Fintech and Cloud.

    9.  Hypr will be used for Internet of Things and Cloud.


    # Using Bitcoin as a Distributed Ledger


    Bitcoin operates as a distributed ledger. It is a database synchronized and shared
    over different sites, organizations, and regions of the world. This feature makes
    bitcoin easy to use and accessible by various individuals all over the world.


    In this case, transactions are visible to the public. Each participant at a node
    can access transactions and records distributed over the system. The users can
    even own or maintain a similar copy of such transactions. If any user alters any
    record, such records are released to every user of the network immediately.


    In distributed ledgers, no central body oversees the activities of each user on
    the network. Every transaction is accessible to all connected to the network.


    Therefore, the database of bitcoin is a distributed ledger. This is a ledger of
    contracts or transactions maintained in a decentralized format over several territories
    and handled by different persons.


    Using distributed ledgers in bitcoin network helps in minimizing fraud including
    cyber attacks.


    Distributed ledgers make communication and co-operation over the internet easy.
    This process makes audit trail easy to follow for account managers and clerks
    during reviews of financial statements.


    The bitcoin distributed ledger is automated and accessible at any time of the
    day. It speeds up the amount of time required to handle transactions and minimizes
    inefficient operational processes, thereby lessening the cost of operations.


    The bitcoin distributed ledger is valuable in different sectors of the economy
    such as various supply chains, finance, music and entertainment, precious metals,
    and assets, real estate, including artwork.


    # Who Operates the Bitcoin Technology?


    Bitcoin is not regulated or operated by anyone. It is operated based on the agreement
    of everyone involved in the network. However, a person or group of persons under
    the name Satoshi Nakamoto brought the ideas that produced bitcoin in 2008. The
    cryptocurrency was launched in 2009.


    In 2011, the bitcoin currency gained attention as the value of a bitcoin got up
    to equality with the dollar. Nakamoto stopped active participation in the Bitcoin
    network in 2011. He shifted the responsibility of developing the bitcoin software
    to Gavin Andresen, a developer. He has been the chief developer of the bitcoin
    network all these years.


    Therefore, the bitcoin technology is maintained and operated as an open-source
    network by Andresen. Moreover, a non-profit organization that promotes bitcoin
    is called the Bitcoin Foundation. They are responsible for managing the views
    on the bitcoin community and Andresen is a worker of the foundation.


    # Chapter Seven: The Problems Confronting Bitcoins


    Some of the problems confronting the adoption of bitcoin into the mainstream include:


    1.  **The issues of volatility.** Bitcoin is a volatile financial tool. The value
    is yet to stabilize as a currency.

    2.  **The issues of ease of use.** It is true that there are places where you
    can buy or exchange bitcoin (bitcoin exchangers), but accessing and using bitcoin
    is still a mirage to many people. It is not a user-friendly product.

    3.  **The issue of general acceptability.** You may ask, "Is bitcoin generally
    acceptable buy everyone?" Any currency that is not generally acceptable is not
    fit to be a currency.

    4.  **The issue of scalability.** This is a technical issue. The blockchain technology
    restricts much data to be stored on each block. Therefore, each block is expected
    to have 1 megabyte of data. With this, it can process about three transactions
    each second compared to the Visa technology that can process over two thousand
    transactions every second.

    5.  It is reputed for aiding money laundering and other criminal activities, especially
    on the internet.

    6.  Bitcoin has tax issues. The reason is that under the present law, bitcoin
    and other digital currencies are regarded as intangible assets. Therefore, they
    are not subject to tax.


    ## Variations Between Blockchain and Bitcoin


    Blockchain and bitcoin are inter-related concepts, but they do not mean the same
    thing. To give you an elementary definition of blockchain, it is a file for storing
    data in a computer. You can also call it an open-distributed database or ledger.
    This definition implies that the information contained in a blockchain can be
    duplicated among a network of computers. This feature makes a blockchain to be
    decentralized and even transformational. Data is accessed and verified by all
    participants. This makes the blockchain secure and transparent.

