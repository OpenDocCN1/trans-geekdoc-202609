    # How to Set Up a Bitcoin Wallet


    You can set up a bitcoin wallet on your smartphone or PC. By installing this on
    your devices, it will generate your first bitcoin address but you can create more
    if you wish. After setting up your bitcoin wallet and address, you can send your
    address to your friends, customers, and employers to be sending your payments
    into your wallet.


    You can also send payments to your workers, friends and family''s wallets. It
    is a type of online cash, but in simplicity, bitcoin is known as digital currency,
    virtual currency, or cryptocurrency.


    ## How to Get Bitcoins


    You can get bitcoins in various ways such as:


    ### 1. Mining


    Mining – the method of confirming pending transactions by adding them in the blockchain.
    Mining is also regarded as a distributed consensus system for validating transactions
    on the bitcoin network. This process enhances a chronological order within the
    block chain. It enables different computing systems to harmonize on the nature
    of the network. Mining also secures the neutrality of the system. If you want
    to confirm the transaction, payments must be organized in a block that adheres
    to stringent cryptographic principles subject to verification.


    In this way, previous blocks will not be modified since this can make subsequent
    blocks invalid. Therefore, nobody can dictate or control what is added to the
    block chain. They may not also replace sections of the block chain to include
    their expenditures.


    ### 2. Payments


    Payments – most persons prefer to be paid with bitcoins for services or goods.
    In this way, one can stash up the cryptos for future use.


    # Using Bitcoin in Exchanges


    Do you know that bitcoins could be used in exchange? A digital marketplace where
    traders can sell or buy bitcoins with various altcoins is known as bitcoin exchange.
    This online platform is an intermediary linking sellers of cryptocurrencies and
    the buyers as well. In professional terms, it is analyzed as an intermediary between
    the maker of cryptos and the taker.


    This exchange serves like a brokerage where you can deposit cash using wire transfer,
    bank transfer, or bank deposit. Using bitcoin exchange usually has charges attached
    to it.


    You will pay the currency conversion fee if you want to trade between cryptos.
    This is like trading different currencies in conventional banking system. Also,
    buying and selling bitcoin are based on the brokerage system where a taker sets
    a limit order that could be sold if a maker provides bitcoins that match the request.


    Therefore, bitcoin exchange pairs takers with makers. In this case, they set the
    limit order or market order. When this limit is fixed and chosen, you are authorizing
    the exchange to trade at an available option or price prevalent in the marketplace.


    After setting this limit, the trader will direct the platform to trade the cryptos
    at a price lower or above the present the bid.


    ## How to Transact with an Exchange


    *   Register with the exchange.

    *   Authenticate the user''s identity by conducting different verification processes.

    *   After authentication, an account is opened for the user.

    *   The user transfers funds into the account before buying coins.


    You can use money orders, direct bank deposits, transfers, bank drafts, gift cards,
    credit cards, debit cards, and various payment methods to deposit your funds with
    the exchange.


    Also, withdrawing money from the account could be done using PayPal, bank wire,
    checks, cash, credit cards, and other options stipulated by the exchange.


    Another type of exchange to use is decentralized bitcoin exchange.


    This type of exchange is handled without a centralized authority. They permit
    peer-to-peer trading of cryptos with no exchange authority to initiate and manage
    transactions.


    ## Advantages of Using Decentralized Bitcoin Exchanges


    1.  Decentralized exchanges correspond with decentralized structures suitable
    for most cryptos.

    2.  Less personal information is needed from users.

    3.  These exchanges uphold a basic level of user interest by maintaining liquidity
    and trading volume.

    4.  Assets could be transferred to other members directly without the exchange
    interfering.

    5.  Direct transfers of assets to the exchange will minimize the risk of hacking
    and theft.

    6.  Less trading frauds will be recorded and no manipulation of figures or prices.


    # Differences between Bitcoin and Cryptocurrencies


    ![](Images/image00123.jpeg)


    ## Bitcoin


    Bitcoin is regarded as a digital currency using cryptocurrency and managed by
    a decentralized authority. This is not like currencies issued and regulated by
    the government. Also, cryptocurrency is a safe and secure technological feature
    used for carrying out various financial transactions on the bitcoin platform.


    Here are some differences between bitcoin and cryptocurrency.


    ### Bitcoin


    1.  Bitcoin is a type of digital currency also referred to as cryptocurrency.

    2.  It was founded in 2008 by Satoshi Nakamoto.

    3.  Bitcoin is an open-source software designed for transferring money.

    4.  It facilitates cross-border transactions with less government regulation and
    control.

    5.  Offers a secure environment for peer-to-peer transactions.

    6.  It is more popular than other cryptos.

    7.  Bitcoin is flexible with less cost of influencers and transaction time.

    8.  It is often used as currency and limited to trading.


    ### Cryptocurrency


    1.  This is the technology used as a medium for online financial transactions.

    2.  Uses cryptographic technology to provide safe and secure platform for transactions.

    3.  It is a virtual currency with no physical format.

    4.  No central banking system but has a decentralized organization.

    5.  Operates with distributed ledgers for peer-to-peer transactions while maintaining
    transparency for transactions.

    6.  Cryptotechnology is useful for handling almost every form of transaction on
    the internet.

    7.  There are various cryptocurrencies used for trading but their share is lower
    than bitcoin.


    # Differences between Bitcoin and Conventional Currencies


    Bitcoin is a digital currency and in opposition to conventional currencies such
    as paper bills, bank notes, precious metals, rocks, shells and the unforgettable
    trade by barter system of exchange.


    Before we consider the differences between bitcoin and other traditional currencies,
    we should look at the factors that can qualify any object or item to become money.
    These are factors that co-opted bitcoin into the world of currencies.


    1.  It should be recognizable and acceptable for transactions.

    2.  A currency should be divisible into smaller units.

    3.  It should be durable.

    4.  A currency must be portable.

    5.  It is not an edible commodity.

    6.  A currency is designed solely for exchange.

    7.  A currency cannot be faked.

    8.  It is scarce.


    But the differences between both categories of currencies include:


    ## Bitcoin


    *   Bitcoin is decentralized. That means no one regulates or controls bitcoin.

    *   It is a peer-to-peer money system that functions independently.

    *   This currency is based on the combined computing power of the members of the
    network.

    *   All participants are equal to each other.

    *   Reduces transaction times and fees.

    *   The value of bitcoin is not attached to any economic or political event and
    circumstances.

    *   Bitcoin is not superior. There is no organization supporting this cryptocurrency.

    *   Nobody influences your money and transactions.

    *   No form of insurance for bitcoin exchanges such as FDIC insurance and SIPC
    insurance.


    ## Conventional Currencies


    *   Conventional currencies are managed by central banks, commercial banks, governments,
    and other payment processors such as Mastercard or VISA.

    *   These organizations can approve your transaction or not.

    *   They also determine if you are using a legal currency or not.

    *   Banks need transaction times and fees that come with conventional currencies
    to continue in operations.


