  done\")\n    defer db.Close()\n\n}\n```\n\n完成后，我们可以进行测试。\n\n![ch14-4](img/ch14-4.png)\n\
  \n您可以在表中验证此数据。\n\n![ch14-5](img/ch14-5.png)\n\n# 15. Socket 编程\n\n本章介绍如何使用 Go 创建\
  \ socket 应用程序。\n\n## 15.1 Socket 模块\n\n我们可以使用 `net` 包基于 socket 栈创建应用程序。您可以在 `http://golang.org/pkg/net/`\
  \ 上找到更多信息。我建议您阅读有关 socket 概念的书籍或网站。\n\n## 15.2 Hello World\n\n入门时，我们创建一个简单的应用程序来获取本地计算机中的\
  \ IP 地址列表。我们可以使用 `net` 包并调用 `Interfaces()` 来获取本地计算机中网络接口的列表。每个网络接口都提供有关 IP 地址的信息。\n\
  \n在本节中，我们尝试获取本地 IP 地址。首先，我们可以创建一个名为 `netdemo` 的新项目。\n\n```\n$ mkdir netdemo\n$ cd\
  \ netdemo\n```\n\n创建一个文件 `main.go`。然后，编写此代码。\n\n```\npackage main\n\nimport (\n\
  \    \"fmt\"\n    \"net\"\n)\n\nfunc main(){\n    ifaces, err := net.Interfaces()\n\
  \    if err!=nil {\n        panic(err)\n    }\n\n    fmt.Println(\"getting local\
  \ IP Address...\")\n    for _, i := range ifaces {\n        addrs, err := i.Addrs()\n\
  \        if err!=nil {\n            panic(err)\n        }\n        for _, addr :=\
  \ range addrs {\n            switch v := addr.(type) {\n                case *net.IPAddr:\n\
  \                    if v.String()!=\"0.0.0.0\"{\n                        fmt.Println(v.String())\n\
  \                    }\n            }\n        }\n    }\n}\n```\n\n保存此代码。尝试构建并运行它。\n\
  \n以下是 Windows 上运行的示例程序输出：\n\n![ch15-1](img/ch15-1.png)\n\n## 15.3 客户端/服务器 Socket\n\
  \n现在我们使用 Go 创建客户端/服务器 socket。我们将使用 `net` 包构建客户端/服务器应用程序。为说明目的，我们创建服务器和客户端。\n\n###\
  \ 15.3.1 服务器 Socket\n\n如何创建服务器 socket？很简单。以下是构建服务器 socket 的简单算法\n\n* 创建服务器 socket\n\
  * 在特定端口监听传入客户端\n* 如果客户端连接，监听传入数据然后与客户端断开连接\n\n在本节中，我们构建服务器应用。首先，我们可以创建一个名为 `netserver`\
  \ 的新项目。\n\n```\n$ mkdir netserver\n$ cd netserver\n```\n\n创建一个文件 `main.go`。编写此代码。\n\
  \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"net\"\n    \"os\"\n)\n\nconst\
  \ (\n    SVR_HOST = \"localhost\"\n    SVR_PORT = \"9982\"\n    SVR_TYPE = \"tcp\"\
  \n)\n\nfunc main() {\n    fmt.Println(\"server is running\")\n    svr, err := net.Listen(SVR_TYPE,\
  \ SVR_HOST+\":\"+SVR_PORT)\n    if err != nil {\n        fmt.Println(\"Error listening:\"\
  , err.Error())\n        os.Exit(1)\n    }\n    defer svr.Close()\n    fmt.Println(\"\
  Listening on \" + SVR_HOST + \":\" + SVR_PORT)\n    fmt.Println(\"Waiting client...\"\
  )\n\n    for {\n\n        conn, err := svr.Accept()\n        if err != nil {\n \
  \           fmt.Println(\"Error accepting: \", err.Error())\n            os.Exit(1)\n\
  \        }\n        fmt.Println(\"client connected\")\n        go handleClient(conn)\n\
  \    }\n}\n\nfunc handleClient(conn net.Conn) {\n\n    buff := make([]byte, 1024)\n\
  \    msgLen, err := conn.Read(buff)\n    if err != nil {\n        fmt.Println(\"\
  Error reading:\", err.Error())\n    }\n    fmt.Println(\"Received: \",string(buff[:msgLen]))\n\
  \    conn.Close()\n}\n```\n\n它使用端口 `9982`。您可以更改它。\n\n### 15.3.2 客户端 Socket\n\n客户端\
  \ socket 是连接到服务器然后向/从服务器发送/接收数据的客户端应用程序。我们应该知道目标服务器的 IP 地址和端口。我们可以调用 `Dial()` 来连接到服务器。使用\
  \ `Write()` 发送数据。\n\n在本节中，我们构建客户端应用。首先，我们可以创建一个名为 `netclient` 的新项目。\n\n```\n$ mkdir\
  \ netclient\n$ cd netclient\n```\n\n创建一个文件 `main.go`。编写此代码。\n\n```\npackage main\n\
  \nimport (\n    \"fmt\"\n    \"net\"\n)\n\nconst (\n    SVR_HOST = \"localhost\"\
  \n    SVR_PORT = \"9982\"\n    SVR_TYPE = \"tcp\"\n)\n\nfunc main() {\n    fmt.Println(\"\
  client is running\")\n    conn, err := net.Dial(SVR_TYPE, SVR_HOST+\":\"+SVR_PORT)\n\
  \    if err != nil {\n        panic(err)\n    }\n    fmt.Println(\"send data\")\n\
  \    _, err = conn.Write([]byte(\"message from client\"))\n    defer conn.Close()\n\
  }\n```\n\n### 15.3.3 测试\n\n现在我们可以测试我们的客户端/服务器应用程序。首先，我们运行服务器应用程序然后执行客户端应用程序。\n\n\
