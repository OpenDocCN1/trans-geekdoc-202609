  \ != nil {\n        fmt.Println(err)\n        os.Exit(1)\n    }\n\n    var emp Employee\n\
  \    var employees []Employee\n\n    for _, item := range csvData {\n        emp.Name\
  \ = item[0]\n        emp.Email = item[1]\n        emp.Country = item[2]\n      \
  \  employees = append(employees, emp)\n        fmt.Printf(\"name: %s email: %s \
  \ country: %s\\n\", item[0], item[1],item[2])\n    }\n    fmt.Println(\">>>>show\
  \ all employee structs....\")\n    fmt.Println(employees)\n\n    // write data to\
