  \  \n\n# 11. 并发\n\n本章解释如何在 Go 中创建并发\n\n## 11.1 入门\n\n我们可以使用 Go 在后台运行程序或函数。本章我们探索多个场景来构建并发应用程序。\n\
  \n## 11.2 Goroutines\n\n基本上，我们可以使用 `go..<program code>` 定义我们的 Go 后台。\n\n为说明起见，创建一个名为\
  \ goroutines 的新项目。\n\n```\n$ mkdir goroutines\n$ cd goroutines\n```\n\n创建一个文件 `maing.go`，并写入此代码。\n\
  \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\nfunc main(){\n\n\
  \    fmt.Printf(\"goroutines demo\\n\")\n\n    // run func in background\n    go\
  \ calculate()\n\n    index := 0\n    // run in background\n    go func() {\n   \
  \     for index < 6 {\n            fmt.Printf(\"go func() index= %d \\n\", index)\n\
  \            var result float64 = 2.5 * float64(index)\n            fmt.Printf(\"\
  go func() result= %.2f \\n\", result)\n\n            time.Sleep(500 * time.Millisecond)\n\
  \            index++\n        }\n    }()\n    // run in background\n    go fmt.Printf(\"\
  go printed in the background\\n\")\n\n    // press ENTER to exit\n    var input\
  \ string\n    fmt.Scanln(&input)\n    fmt.Println(\"done\")\n\n}\nfunc calculate()\
  \ {\n    i := 12\n    for i < 15 {\n        fmt.Printf(\"calculate()= %d \\n\",\
  \ i)\n        var result float64 = 8.2 * float64(i)\n        fmt.Printf(\"calculate()\
  \ result= %.2f \\n\", result)\n\n        time.Sleep(500 * time.Millisecond)\n  \
  \      i++\n    }\n}\n```\n\n在这段代码中，我们尝试在后台运行函数和代码行。我们使用 `go` 语句表示后台进程。\n\n全部保存。\n\
  \n现在你可以测试构建并运行程序。\n\n```\n$ go build\n$ go run main.go\n```\n\n示例输出可在下图看到。\n\n![ch11-1](img/ch11-1.png)\
  \  \n\n你可以看到程序由于所有代码都在后台运行而随机执行。\n\n## 11.3 同步 Goroutines\n\n我们可以在 Go 中同步后台代码。其中一个解决方案是使用\
  \ `sync` 库。本节我们使用 `sync.Mutex.Lock` 和 `sync.Mutex.Unlock` 进行同步。\n\n为说明起见，创建一个名为\
  \ syncgoroutines 的新项目。\n\n```\n$ mkdir syncgoroutines\n$ cd syncgoroutines\n```\n\
  \n创建一个文件 `main.go`，并写入此代码。\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"\
  sync\"\n    \"math/rand\"\n    \"time\"\n)\n\ntype Task struct {\n    value int\n\
  \    executedBy string\n}\n\nvar total int\nvar task Task\nvar lock sync.Mutex\n\
  \nfunc main(){\n\n    fmt.Printf(\"synchronizing goroutines demo\\n\")\n    total\
  \ = 0\n    task.value = 0\n    task.executedBy = \"\"\n    display()\n\n    // run\
  \ background\n    go calculate()\n    go perform()\n\n    // press ENTER to exit\n\
  \    var input string\n    fmt.Scanln(&input)\n    fmt.Println(\"done\")\n}\n\n\
  func calculate(){\n\n    for total < 10 {\n        lock.Lock()\n        task.value\
  \ = rand.Intn(100)\n        task.executedBy = \"from calculate()\"\n        display()\n\
  \        total++\n        lock.Unlock()\n        time.Sleep(500 * time.Millisecond)\n\
  \    }\n}\nfunc perform(){\n\n    for total < 10 {\n        lock.Lock()\n      \
  \  task.value = rand.Intn(100)\n        task.executedBy = \"from perform()\"\n \
  \       display()\n        total++\n        lock.Unlock()\n        time.Sleep(500\
  \ * time.Millisecond)\n    }\n}\nfunc display(){\n    fmt.Println(\"--------------------------\"\
  )\n    fmt.Println(task.value)\n    fmt.Println(task.executedBy)\n    fmt.Println(\"\
  --------------------------\")\n\n}\n```\n\n全部保存。\n\n现在你可以测试构建并运行程序。\n\n```\n$ go\
  \ build\n$ go run main.go\n```\n\n示例输出可在下图看到。\n\n![ch11-2](img/ch11-2.png)  \n\n\
  ## 11.4 通道\n\n我们可以在 Go 中创建通道，然后使用这些通道在 Goroutines 之间通信。为说明起见，我们创建一个保存数字数据的通道。要向通道插入数据，我们可以使用\
  \ `channel <-`。否则，我们可以使用 `<- channel` 从通道获取数据。\n\n为测试，创建一个名为 simplechannel 的新项目。\
  \  \n\n```\n$ mkdir simplechannel\n$ cd simplechannel\n```\n\n创建一个文件 `main.go`，并写入此代码。\n\
  \n```\npackage main\n\nimport (\n    \"fmt\"\n)\n\n\nfunc main(){\n\n    fmt.Println(\"\
  simple channel\")\n\n    // define a channel\n    c := make(chan int)\n\n    //\
  \ run a function in background\n    go func() {\n        fmt.Println(\"goroutine\
  \ process\")\n\n        c <- 10   // write data to a channel\n    }()\n\n    val\
  \ := <-c // read data from a channel\n    fmt.Printf(\"value: %d\\n\",val)\n}\n\
  ```\n\n全部保存。\n\n现在你可以测试构建并运行程序。\n\n```\n$ go build\n$ go run main.go\n```\n\n示例输出可在下图看到。\n\
  \n![ch11-3](img/ch11-3.png)  \n\n# 12. 编码\n\n本章解释如何在 Go 中处理编码\n\n## 12.1 入门\n\n\
