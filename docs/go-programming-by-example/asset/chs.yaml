  \n![ch13-7](img/ch13-7.png)\n\n# 13. 哈希与密码学\n\n本章解释如何在 Go 中使用哈希和密码学\n\n## 13.1 入门\n\
  \n哈希是通过数学函数从文本字符串生成值或值。密码学是在存在第三方（称为对手）的情况下进行安全通信的实践和研究，[`en.wikipedia.org/wiki/Cryptography`](http://en.wikipedia.org/wiki/Cryptography)。在本章中，我不解释数学哈希和密码学。你可以在教科书上阅读这些材料。\n\
  \n在本章中，我们将探索如何使用 Go 实现哈希。本书中使用的哈希算法如下：\n\n* MD5\n* SHA256\n* 带密钥的哈希（`HMAC`）\n\n\
  下一个主题是使用 Go 实现密码学。我们将探索对称和非对称密码学。\n\n首先，我们可以创建一个名为 `cryptodemo` 的新项目。\n\n```\n$\
  \ mkdir cryptodemo\n$ cd cryptodemo\n```\n\n创建一个文件 `main.go`。首先，我们为演示导入 Go 包。编写此代码。\n\
  \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"crypto/md5\"\n    \"crypto/sha256\"\
  \n    \"crypto/hmac\"\n    \"crypto/aes\"\n    \"crypto/rsa\"\n    \"crypto/cipher\"\
  \n    \"crypto/rand\"\n    \"crypto/x509\"\n    \"encoding/hex\"\n    \"encoding/base64\"\
  \n    \"encoding/pem\"\n    \"io\"\n    \"io/ioutil\"\n)\n```\n\n让我们开始使用 Go 探索哈希和密码学。\n\
  \n## 13.2 哈希\n\n基本上，你可以通过 [`golang.org/pkg/crypto/`](http://golang.org/pkg/crypto/)\
  \ 探索如何使用 Go 实现哈希或哈希函数。在本节中，我们将探索几种哈希算法，例如 MD5、SHA256 和 HMAC。\n\n### 13.2.1 使用 MD5\
  \ 进行哈希\n\n我们可以使用 `md5` 包使用 MD5，[`golang.org/pkg/crypto/md5/`](http://golang.org/pkg/crypto/md5/)。要从文本计算哈希值，我们可以调用\
  \ `Sum()` 函数。\n\n为了说明，我们创建一个函数 `demoHash_md5()`，并编写此代码。\n\n```\nfunc demoHash_md5()\
  \ {\n\n    fmt.Println(\"--------Demo encoding hash using md5--------\")\n\n   \
  \ message := \"Hello world, go!\"\n    fmt.Println(\"plaintext:\")\n    fmt.Println(message)\n\
  \n    h := md5.New()\n    h.Write([]byte(message))\n    hash_message := hex.EncodeToString(h.Sum(nil))\n\
  \    fmt.Println(\"hashing message:\")\n    fmt.Println(hash_message)\n\n}\n```\n\
  \n### 13.2.2 使用 SHA256 进行哈希\n\n第二个演示是使用 SHA256 实现哈希函数。Go 提供了 `sha256` 包，[`golang.org/pkg/crypto/sha256/`](http://golang.org/pkg/crypto/sha256/)，用于使用\
  \ SHA256 实现哈希函数。\n\n为了说明，我们创建一个函数 `demoHash_sha256()`，并编写此代码。\n\n```\nfunc demoHash_sha256()\
  \ {\n\n    fmt.Println(\"--------Demo encoding hash using sha256--------\")\n\n\
  \    message := \"Hello world, go!\"\n    fmt.Println(\"plaintext:\")\n    fmt.Println(message)\n\
  \n    h := sha256.New()\n    h.Write([]byte(message))\n    hash_message := hex.EncodeToString(h.Sum(nil))\n\
  \    fmt.Println(\"hashing message:\")\n    fmt.Println(hash_message)\n}\n```\n\n\
  ### 13.2.3 使用密钥进行哈希，使用 HMAC\n\n带密钥的哈希消息认证码（`HMAC`）是一种用于计算消息认证码（`MAC`）的特定构造，涉及密码学哈希函数与秘密密码学密钥的组合，[`en.wikipedia.org/wiki/Hash-based_message_authentication_code`](http://en.wikipedia.org/wiki/Hash-based_message_authentication_code)。在\
  \ Go 中，我们可以使用 `hmac` 包，[`golang.org/pkg/crypto/hmac/`](http://golang.org/pkg/crypto/hmac/)，来实现\
  \ HMAC 算法。\n\n为了说明，我们创建一个函数 `demoHashKey()`，并编写此代码。\n\n```\nfunc demoHashKey(key,message\
  \ string) {\n\n    fmt.Println(\"--------Demo encoding hash with key: HMAC and sha256--------\"\
  )\n\n    fmt.Println(\"key:\")\n    fmt.Println(key)\n    fmt.Println(\"plaintext:\"\
  )\n    fmt.Println(message)\n\n    hmacKey := []byte(key)\n    h := hmac.New(sha256.New,\
  \ hmacKey)\n    h.Write([]byte(message))\n    hash_message := hex.EncodeToString(h.Sum(nil))\n\
  \    fmt.Println(\"hashing message:\")\n    fmt.Println(hash_message)\n\n}\n```\n\
  \n### 13.2.4 测试\n\n保存第 13.2.1、13.2.2 和 13.2.3 节的演示代码全部代码。为了测试，我们在 main 入口调用这些函数。编写此代码。\n\
  \n```\nfunc main(){\n    demoHash_md5()\n    demoHash_sha256()\n    demoHashKey(\"\
  mykey\",\"Hello world, go!\")\n}\n```\n\n保存全部。\n\n现在你可以测试构建并运行程序。\n\n```\n$ go build\n\
  $ go run main.go\n```\n\n示例输出可在下图看到。\n\n![ch12-1](img/ch12-1.png)\n\n## 13.3 密码学\n\
  \n在本节中，我们关注对称和非对称密码学。在对称密码学中，我们使用相同的密钥进行加密和解密。否则，非对称密码学使用不同的密钥进行加密和解密。\n\n我们在下一节中探索这些。\n\
  \n### 13.3.1 对称密码学\n\n有许多算法可以实现对称密码学。在本节中，我们使用 AES 算法。高级加密标准（`AES`）是由美国国家标准与技术研究院（`NIST`）于\
  \ 2001 年制定的电子数据加密规范，[`en.wikipedia.org/wiki/Advanced_Encryption_Standard`](http://en.wikipedia.org/wiki/Advanced_Encryption_Standard)。\n\
  \n为了说明，我们创建两个函数 `encrypt_symmetric_crpyto()` 和 `decrypt_symmetric_crpyto()`。以下是\
  \ `encrypt_symmetric_crpyto()` 的实现。\n\n\n\n\n\n```go\nfunc encrypt_symmetric_crpyto(key,message\
  \ string) string {\n\n    fmt.Println(\"--------Demo encrypt encrypt_symmetric_crpyto--------\"\
  )\n    if len(key)!=16 && len(key)!=24 && len(key)!=32 {\n        fmt.Println(\"\
  key must 16,24,32 byte length\")\n        return  \"\"\n    }\n    bc, err := aes.NewCipher([]byte(key))\n\
  \    if err != nil {\n        panic(err)\n    }\n    text := []byte(message)\n\n\
  \    ciphertext := make([]byte, aes.BlockSize+len(text))\n    iv := ciphertext[:aes.BlockSize]\n\
  \    if _, err := io.ReadFull(rand.Reader, iv); err != nil {\n        panic(err)\n\
  \    }\n    cfb := cipher.NewCFBEncrypter(bc, iv)\n    cfb.XORKeyStream(ciphertext[aes.BlockSize:],\
  \ text)\n\n    return base64.StdEncoding.EncodeToString(ciphertext)\n}\n```\n\n\
  说明：\n\n*   定义一个密钥。长度应为 16、24 或 32\n*   使用传递的密钥值通过 `NewCipher()` 实例化 AES\n*   计算\
  \ IV 值\n*   通过调用 `NewCFBEncrypter()` 以字节数组格式加密消息\n*   结果将被编码为 base64 字符串\n\n以下是\
  \ `encrypt_symmetric_crpyto()` 的实现。\n\n```go\nfunc decrypt_symmetric_crpyto(key,message\
  \ string) string {\n\n    fmt.Println(\"--------Demo decrypt decrypt_symmetric_crpyto--------\"\
  )\n    if len(key)!=16 && len(key)!=24 && len(key)!=32 {\n        fmt.Println(\"\
  key must 16,24,32 byte length\")\n        return  \"\"\n    }\n    encrypted,_ :=\
  \ base64.StdEncoding.DecodeString(message)\n\n    bc, err := aes.NewCipher([]byte(key))\n\
  \    if err != nil {\n        panic(err)\n    }\n    if len(encrypted) < aes.BlockSize\
  \ {\n        panic(\"ciphertext too short\")\n    }\n    iv := encrypted[:aes.BlockSize]\n\
  \    encrypted = encrypted[aes.BlockSize:]\n    cfb := cipher.NewCFBDecrypter(bc,\
  \ iv)\n    cfb.XORKeyStream(encrypted, encrypted)\n\n    return string(encrypted)\n\
  }\n```\n\n说明：\n\n*   定义一个密钥。长度应为 16、24 或 32\n*   使用传递的密钥值通过 `NewCipher()` 实例化 AES\n\
  *   计算 IV 值\n*   通过调用 `NewCFBDecrypter()` 以字节数组格式加密消息\n*   结果将被编码为字符串\n\n现在我们可以在主入口调用这些函数。编写此代码。\n\
  \n```go\nfunc main(){\n    // symmetric crypto\n    key :=  \"this is key 1234\"\
  \n    message := \"Hello world, go!\"\n    encrypted := encrypt_symmetric_crpyto(key,message)\n\
  \    fmt.Println(\"message:\")\n    fmt.Println(message)\n    fmt.Println(\"key:\"\
  )\n    fmt.Println(key)\n    fmt.Println(\"encrypted:\")\n    fmt.Println(encrypted)\n\
  \n    decrypted := decrypt_symmetric_crpyto(key,encrypted)\n    fmt.Println(\"encrypted\
  \ message:\")\n    fmt.Println(encrypted)\n    fmt.Println(\"key:\")\n    fmt.Println(key)\n\
  \    fmt.Println(\"decrypted:\")\n    fmt.Println(decrypted)\n}\n```\n\n现在你可以构建并运行它。示例输出可在下图看到。\n\
  \n![ch12-2](img/ch12-2.png)\n\n### 13.3.2 非对称加密\n\n实现非对称加密的常用算法是 RSA，它被广泛用于安全数据传输。你可以在维基百科阅读简要描述，[`en.wikipedia.org/wiki/RSA_(cryptosystem)`](http://en.wikipedia.org/wiki/RSA_(cryptosystem))。\n\
  \nGo 有 RSA 实现的库。在本节中，我们尝试使用 Go 实现 RSA。以下是我们的场景：\n\n*   生成 RSA 密钥（公钥和私钥）\n*   将这些密钥保存到两个文件（公钥文件和私钥文件）\n\
  *   加密时，我们使用公钥文件\n*   解密时，我们使用私钥文件\n\n我们将公钥和私钥以 PEM 数据编码存储到文件中。我们可以使用 Go 的 `pem`\
  \ 包，[`golang.org/pkg/encoding/pem/`](http://golang.org/pkg/encoding/pem/)。\n\n要为\
  \ RSA 生成公钥和私钥，我们创建一个函数 `generateRSAkeys()`。生成密钥后，我们将这些密钥保存到文件中。以下是生成密钥的实现。\n\n```go\n\
  func generateRSAkeys(){\n    fmt.Println(\"Generating RSA keys....\")\n\n    //\
  \ change files and their paths\n    privKeyFile := \"D:/PE_PRESS/eBook/go_prog/codes/src/cryptodemo/private.rsa.key\"\
  \n    pubKeyFile := \"D:/PE_PRESS/eBook/go_prog/codes/src/cryptodemo/public.rsa.key\"\
  \n\n    // generate RSA keys\n    privateKey, err := rsa.GenerateKey(rand.Reader,\
  \ 1024)\n    if err != nil {\n        panic(err)\n    }\n\n    // extract private\
  \ and public keys from RSA keys\n    privASN1 := x509.MarshalPKCS1PrivateKey(privateKey)\n\
  \    pubASN1, err := x509.MarshalPKIXPublicKey(&privateKey.PublicKey)\n    if err\
  \ != nil {\n        panic(err)\n    }\n\n    // store private and public keys into\
  \ files\n    privBytes := pem.EncodeToMemory(&pem.Block{\n        Type:  \"RSA PRIVATE\
  \ KEY\",\n        Bytes: privASN1,\n    })\n\n    pubBytes := pem.EncodeToMemory(&pem.Block{\n\
  \        Type:  \"RSA PUBLIC KEY\",\n        Bytes: pubASN1,\n    })\n\n    ioutil.WriteFile(privKeyFile,\
  \ privBytes, 0644)\n    ioutil.WriteFile(pubKeyFile, pubBytes, 0644)\n    fmt.Println(\"\
  Done\")\n\n}\n```\n\n此代码将生成两个文件，`private.rsa.key` 和 `public.rsa.key` 文件。\n\n要加密数据，我们创建一个函数\
  \ `encrypt_asymmetric_crypto()`。首先，我们加载公钥。然后，使用 RSA 加密消息。以下是 `encrypt_asymmetric_crypto()`\
  \ 函数的代码实现。\n\n```go\nfunc encrypt_asymmetric_crypto(message string) string {\n\n\
  \    fmt.Println(\"--------Demo encrypt encrypt_asymmetric_crypto--------\")\n\n\
  \    // public key file\n    pubKeyFile := \"D:/PE_PRESS/eBook/go_prog/codes/src/cryptodemo/public.rsa.key\"\
  \n\n    // read public key from file\n    pubBytes, err := ioutil.ReadFile(pubKeyFile)\n\
  \    if err != nil {\n        panic(err)\n    }\n\n    pubBlock, _ := pem.Decode(pubBytes)\n\
  \    if pubBlock == nil {\n        fmt.Println(\"Failed to load public key file\"\
  )\n        return \"\"\n    }\n\n    // Decode the RSA public key\n    publicKey,\
  \ err := x509.ParsePKIXPublicKey(pubBlock.Bytes)\n    if err != nil {\n        fmt.Printf(\"\
  bad public key: %s\", err)\n        return \"\"\n    }\n\n    // encrypt message\n\
  \    msg := []byte(message)\n    encryptedmsg, err := rsa.EncryptPKCS1v15(rand.Reader,\
  \ publicKey.(*rsa.PublicKey), msg)\n    if err != nil {\n        panic(err)\n  \
  \  }\n\n    return base64.StdEncoding.EncodeToString(encryptedmsg)\n}\n```\n\n要解密数据，我们创建一个函数\
  \ `decrypt_asymmetric_crypto()`。首先，我们加载私钥。然后，使用 RSA 解密消息。以下是 `decrypt_asymmetric_crypto()`\
  \ 函数的代码实现。\n\n```go\nfunc decrypt_asymmetric_crypto(message string) string {\n\n\
  \    fmt.Println(\"--------Demo decrypt decrypt_asymmetric_crypto--------\")\n\n\
  \    // private key file\n    privKeyFile := \"D:/PE_PRESS/eBook/go_prog/codes/src/cryptodemo/private.rsa.key\"\
  \n\n    // read private key from file\n    privBytes, err := ioutil.ReadFile(privKeyFile)\n\
  \    if err != nil {\n        panic(err)\n    }\n\n    privBlock, _ := pem.Decode(privBytes)\n\
  \    if privBlock == nil {\n        fmt.Println(\"Failed to load private key file\"\
  )\n        return \"\"\n    }\n\n    // Decode the RSA private key\n    privateKey,\
  \ err := x509.ParsePKCS1PrivateKey(privBlock.Bytes)\n    if err != nil {\n     \
  \   fmt.Printf(\"bad public key: %s\", err)\n        return \"\"\n    }\n\n    //\
  \ encrypt message\n    encrypted,_ := base64.StdEncoding.DecodeString(message)\n\
  \    decrypteddmsg, err := rsa.DecryptPKCS1v15(rand.Reader, privateKey, encrypted)\n\
  \    if err != nil {\n        panic(err)\n    }\n\n    return string(decrypteddmsg)\n\
  }\n```\n\n保存所有内容。现在你可以在主入口实现我们的函数。编写此代码。\n\n```go\nfunc main(){\n    // asymmetric\
  \ crypto\n    generateRSAkeys()\n    plainText := \"Hello world, go!\"\n    fmt.Println(\"\
  plainText:\")\n    fmt.Println(plainText)\n    rsa_encrypted := encrypt_asymmetric_crypto(plainText)\n\
  \    fmt.Println(\"encrypted:\")\n    fmt.Println(rsa_encrypted)\n    rsa_decrypted\
  \ := decrypt_asymmetric_crypto(rsa_encrypted)\n    fmt.Println(\"decrypted:\")\n\
  \    fmt.Println(rsa_decrypted)\n}\n```\n\n现在你可以构建并运行它。示例输出可在下图看到。\n\n![ch12-3](img/ch12-3.png)\n\
  \n你可以打开 `public.rsa.key` 查看我们的 RSA 公钥值。\n\n![ch12-4](img/ch12-4.png)\n\n你也可以打开 `private.rsa.key`\
  \ 查看我们的 RSA 私钥值。\n\n\n\n\n\n![ch12-5](img/ch12-5.png)\n\n# 14. 数据库编程\n\n本章介绍如何使用\
  \ Go 构建数据库应用程序。\n\n## 14.1 Go 的数据库\n\nGo 可以通过数据库驱动程序与数据库服务器通信。Go 在 `http://golang.org/pkg/database/`\
  \ 上提供了数据库驱动的通用接口。在开始开发数据库应用程序之前，我们必须安装数据库驱动程序和 Go 数据库包。\n\n在本章中，我只关注 MySQL 场景。\n\
  \n## 14.2 Go 的 MySQL 驱动\n\n我们使用 Go-MySQL-Driver 作为数据库驱动。有关此驱动的更多信息，请访问 `https://github.com/go-sql-driver/mysql`。\n\
  \n要安装 Go-MySQL-Driver，您可以在终端中尝试输入以下命令\n\n```\n$ go get github.com/go-sql-driver/mysql\n\
  ```\n\n![ch14-1](img/ch14-1.png)\n\n完成后，我们可以进行测试。\n\n## 14.3 测试连接\n\n在本节中，我们尝试连接\
  \ MySQL 数据库。首先，我们可以创建一个名为 `mysqldemo` 的新项目。\n\n```\n$ mkdir mysqldemo\n$ cd mysqldemo\n\
  ```\n\n创建一个文件 `main.go`。首先，我们为演示导入 Go 包。编写此代码。\n\n```\npackage main\n\nimport (\n\
  \    \"fmt\"\n    \"database/sql\"\n    _ \"github.com/go-sql-driver/mysql\"\n)\n\
  ```\n\n首先，我们可以开始创建简单的 Go 应用程序以连接到 mysql 数据库。编写此代码\n\n```\nfunc main(){\n    testConnection()\n\
  }\n\nfunc testConnection(){\n    // 更改数据库用户和密码\n    db, err := sql.Open(\"mysql\"\
  ,string(\"user:password@tcp(127.0.0.1:3306)/researchdb\"))\n    if err != nil {\n\
  \        panic(err)\n    }\n    err = db.Ping()  // 测试连接\n    if err != nil {\n\
  \        panic(err.Error())\n    }\n    fmt.Println(\"connected\")\n    defer db.Close()\n\
  }\n```\n\n根据您的 mysql 数据库配置和身份验证更改主机、用户和密码。\n\n保存全部。\n\n现在您可以测试构建和运行程序。\n\n```\n\
  $ go build\n$ go run main.go\n```\n\n示例输出如下图所示。\n\n![ch14-2](img/ch14-2.png)\n\n\
  ## 14.4 查询\n\n在本节中，我们尝试向表中插入数据。以下是我们在 MySQL 上的表结构。\n\n![ch14-3](img/ch14-3.png)\n\
