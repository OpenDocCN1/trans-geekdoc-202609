  \   }\n    defer csvFile.Close()\n\n    writer := csv.NewWriter(csvFile)\n    writer.Comma\
  \ = ';'\n    for _, itemEmp := range employees {\n        records := []string{itemEmp.Name,itemEmp.Email,itemEmp.Country}\n\
  \        err := writer.Write(records)\n        if err != nil {\n            fmt.Println(\"\
  Error:\", err)\n            return\n        }\n    }\n    writer.Flush()\n    fmt.Println(\"\
  >>>>Done\")\n\n}\n```\n\n注意：你可以更改 CSV 文件路径。\n\n保存此代码。现在你可以构建并运行此程序。\n\n示例输出可在下图看到。\n\
