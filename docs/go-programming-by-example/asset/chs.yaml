  \ these data to array of struct. After that, we write array of struct to a new CSV\
  \ file, called `employee.csv`.\n\nThe following is implementation of reading/writing\
  \ CSV file.\n\n\n\n\n\n```go\nfunc main(){\n\n    demoCsv()\n\n}\n\nfunc demoCsv(){\n\
  \n    fmt.Println(\"--------Demo encoding csv--------\")\n    type Employee struct\
  \ {\n        Name string\n        Email string\n        Country string\n    }\n\n\
