- - '###'
  - SCVS 级别
- - '####'
  - 第 1 级
- - '####'
  - 第 2 级
- - '####'
  - 第 3 级
- - '###'
  - 清单
- - '##'
  - 清单（Inventory）族的第 1 级关注关键活动，例如在构建时获知直接和间接组件，以及使用包管理器管理第三方二进制组件。第 1 级包括以机器可读格式拥有全面的第三方组件清单，并为公开和商用的应用程序生成
    SBOM。第 2 级在这些控制的基础上，还要求新软件采购提供 SBOM。这种控制示例扩展了网络安全从业人员的范围，并开始涉及其他非技术利益相关者，例如采购人员，他们可以开始在采购时要求提供这些产物。
- - '##'
  - 清单族的第 3 级开始增加更严谨的控制，例如对持续维护所有系统的 SBOM，并了解整个清单中的组件类型。第 3 级不仅要求了解组件类型，还需要了解组件的功能，更重要的是了解所有组件的源点。这在涉及软件供应链时通常被称为
    `provenance`（源/可追溯性）。
