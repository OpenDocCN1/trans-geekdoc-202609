  # 天哪，真是一个功能混乱的家庭！


  ![image](img/chapter_title_below.png)


  ![C:\Users\Lee\AppData\Local\Microsoft\Windows\Temporary Internet Files\Content.IE5\9DEE29EW\400px-Addams_Family_cast_1964.jpg](img/image005.png)


  ***


  尽管大大叫和争吵，但 `RMSE` 之所以是老爸有一个非常充分的理由——我已经给你提示过是什么！让我向你介绍老爸的超级英雄名字：偏差/方差权衡（Bias/Variance
  Trade-Off）


  如果你没听过这个，那你有福了，因为这对预测建模非常非常重要，并且它为你提供了任何模型的总误差。


  `BVTO`（正如有些人可能那样称呼它）表示为均方误差。认识吗？它是去掉了 `R` 的 `RMSE`。或者换句话说，它是 `RMSE²`。


  所以就在这里——`BVTO` 的计算如下：


  ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
  ML Series\1. Errors of Regression Models\Edition 1\Images\Equation - Bias Variance-Off.png](img/image020.png)


  我们已经知道如何计算 `MSE` 和 `RMSE`，但真正重要的是，偏差/方差权衡是用方差和偏差（`MAE`）共同表示的。这意味着任何模型的准确性必须包含其总误差的表达式，即方差和偏差：


  ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
  ML Series\1. Errors of Regression Models\Edition 1\Images\Bias & Variance.png](img/image006.png)


  ## 准确性、偏差与方差之间关系的说明


  这就是为什么 `R²`、方差、`MAE` 中的任何一个指标单单来看都不足以描述模型的准确性——但 `RMSE` 可以！让我们来看另一个例子，这次我们安排在增加
  `MAE` 的同时固定方差：


  ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
  ML Series\1. Errors of Regression Models\Edition 1\Images\Data - Variance-Off.png](img/image27.png)


  ## 偏差/方差权衡的实际应用


  在固定的准确性水平下，当你增加偏差（`model5`）时，方差会减少。这就是为什么这是一种权衡，因为当数据增加时，偏差必须减少，反之亦然。


  你明白这意味着什么吗？由于 `RMSE` 包含了偏差和方差，仅仅得意地引用模型的 `RMSE` 是不够的！你需要引用偏差和方差的水平来展示哪些模型是低偏差和低方差需求的折衡。


  通常情况下（但并非总是），低偏差高方差或高偏差低方差的模型具有相同的整体准确性，但每个都可能产生非常不理想预测。偏差与方差的良好折衡会导致最好的预测模型。


  ### 总准确性


  在我看来，你应该始终引用 `RMSE` 作为模型准确性的整体衡量标准。在比较模型以决定哪个更准确时，比较的是 `RMSE`。


  ### 偏差


  接下来，你需要引用 `MAE` 并解释它告诉我们预测偏离观测值的程度。然后你可以引用 `ME` 来显示你的模型是否存在整体偏差——记住这种偏差可以是正的负的。


  ### 方差


  最后你可以引用方差，解释这是预测偏离其平均值的程度。作为方差的替代方案，你可以使用 `R²`。我不喜欢使用它，因为它的单位与你感兴趣的变量无关，但 `R²` 实际上是一个非常好的选择，因为大多数运行回归分析的人对好坏的
  `R²` 都有很好的感觉。如果你想表现得自豪，可以引用 `BVTO` ——这通常会让你在老板面前看起来很好……





  偏差（Deviation）是观测值与某个值之间差异的衡量，我们可以将偏差分为两种类型：误差（error）源于真实且不可观测的值；而残差（residual）则是观测值与预测值之间的差异。


  `RMSE` 是所有衡量指标之“父”，用俗话说，它是能够统领一切的唯一指标。我确定以前在某个地方听过这句话……


  总之，`RMSE` 是回归模型总误差的衡量标准，包含了偏差（bias）和方差（variance）两个部分。


  `MAE` 和 `ME` 都是偏差的衡量标准，但区别在于 `MAE` 是残差平均大小的衡量，而 `ME` 是平均模型偏差的表达。


  `R²` 值和方差都是模型变异性（多样性或差异）的衡量标准。`R²` 衡量预测值与最佳拟合线的偏差，而方差则是衡量残差均值的偏差。


  ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
  ML Series\1. Errors of Regression Models\Edition 1\Images\RMSE Flow Chart.png](img/image010.png)


  ## RMSE 家族树


  我希望你现在能更好地在衡量回归模型准确性时做出明智选择。更好的是，下一次你读到 Sk8rBoi 或 RazrButt 关于最佳准确性衡量标准的评论时，你会报以苦涩的微笑，因为你不仅知道正确答案是什么，而且还有“偏差/方差权衡”（Bias/Variance
  Trade-Off）作为你的盟友！


