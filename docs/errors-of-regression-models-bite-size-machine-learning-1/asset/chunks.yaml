    # 引言


    ![image](img/chapter_title_below.png)


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Crystal Ball 2.png](img/image001.png)


    ***


    有什么东西正传过……


    一个画面正在形成……


    它是……

    它是……


    啊！！！消失了！


    有时候，学习统计学可能就像在窥视水晶球。你以为已经掌握了它，结果又多读了一篇文章/论文/博客，突然间又变得像泥浆一样模糊，而且你离答案比刚开始时还要远得多。


    MaxBG1001 在他的博客上说这是一回事，但 Sk8rBoi 在 TwitFace 上坚持认为是另一回事——而且他们都有完全合理的解释，说明为什么他们都是正确的。RazrButt
    和 VanillaCupCake 又说了不同的观点，听起来他们也像很懂行似的！


    啊啊啊啊——我太困惑了！


    在任何给定情况下选择使用正确的统计量有时似乎是一项艰巨的任务。当你对数据可以进行许多可能的统计计算时，是否只有某一个答案是完全正确的，而所有其他答案都是错误的？


    通常不是。


    当你意识到大约有十几种不同的方法来计算平均值——而且它们全都是错的——这往往会让你对统计学产生一些感。


    所以，这里有两点可以帮助你找到内平静：


    1. 统计学更像是一把菜刀，而不是激光手术刀

    2. 通常没有单一的正确答案（甚至可能没有正确答案！）


    在大多数情况下，存在一个方法谱，其中某些方法比其他的更合适。


    你的工作不是对你的数据做出最佳选择——这可以留给拥有统计学博士学位和 30 多年经验的专家。不，你的工作是确保你知道如何对你的数据做出良好的选择。


    在这本书中，我们将讨论如何选择合适的统计量来衡量你的基于回归的预测模型的准确性。


    你会发现存在一组相关的统计量，每个成员都有他们自己的忠实粉丝。


    尽管如此，在这种情况下，有一个正确的统计量是可以使用的，而其他测量——虽然在各自方面都有用处——在选择最准确的预测模型方面只能提供部分答案。我将介绍这个家族的每一个成员，并带你了解它们的优缺点，向你展示如何计算和解释它们。最后，我将解释解释为什么某一个特定的成员是“老爸”（The
    Daddy）。


