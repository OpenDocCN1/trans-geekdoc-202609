    # The Misunderstood: Errors, Residuals, Deviations


    ![image](d2d_images/chapter_title_below.png)


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Crystal Ball 2.png](d2d_images/image017.png)


    ***


    Whenever I talk to statisticians, I get confused – after all, I’m just a humble
    scientist that sort of fell into Data Science. What you do notice, though, if
    you listen carefully, is that they are extremely precise about what they’re saying.


    On the other hand, when talking about statistics with non-statisticians there
    always seems to be disagreements, confusion and misunderstandings, usually surrounding
    the terminology used.


    In the world of prediction, there are always disagreements about whether the term
    Error, Residual or Deviation should be used to describe the difference between
    Observation and Prediction, so I wanted to clear this up right from the start.


    Let’s make a few definitions first, and then discuss what they mean.


    ## Observations


    An observation is a past or present value of something of interest you’re measuring
    or counting during a study or experiment: a measured value at a certain point
    in time, such as a person’s height or weight, or a count of the number of animals,
    people or cars.


    ## Predictions


    A prediction is a statement about a future event. Predictive modelling is the
    process of applying a statistical model or Machine Learning algorithm to data
    for the purpose of predicting new or future observations, also known as predictions.


    OK, so that should clear up any confusion about observations and predictions –
    an observation is a measure or count of a variable of interest in a study, while
    a prediction is the outcome of a process to infer new or future observations by
    some mathematical means.


    So on we go to Errors, Residuals and Deviations.


    ## Errors


    The Error is the difference between an observed value and the unobservable true
    value of a quantity of interest, for example a population mean.


    ## Residuals


    A residual is the difference between an observed value and the estimated or predicted
    value of a quantity of interest, for example a sample mean.


    ## Deviations


    Deviation is a measure of the difference between an observed value and some other
    value. A deviation that is a difference between an observed value and the true
    value of a quantity of interest (such as a population mean) is an error and a
    deviation that is the difference between the observed value and an estimate of
    the true value (such as a sample mean) is a residual.


    OK, so that should clear things up a bit – the error is the deviation from the
    ‘true’ value, which may not be knowable, while the residual is the deviation from
    a prediction of the true value.


