    # 家族中的害群之：R² 值


    ![image](img/chapter_title_below.png)


    ––––––––


    ![image](img/scene_break.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\SPFQN5I5\\2etgsa12\[1\].png](d2d_images/image025.png)


    ***


    ![image](img/scene_break.png)


    你发现散点图中的问题了吗？


    大多数人并不会。


    答案是，`R²` 值是一个非常具有误导性的标准。并非总是如此，但有时确实如此，在使用 `R²` 作为衡量模型准确预测能力的指标之前，你必须对自己的分析非常有把握。


    让我通过一个例子来解释。


    针对这些预测，我们可能会问两个不同的问题：


    * 预测偏离观测值有多远？

    * 预测偏离最佳拟线有多远？


    这实际上是两个完全不同的问题。


    这是一个与之前相同的数据的散点图（红色），我也添加了这些数据的副本（蓝色）。在第二组数据中，我将残差的大小缩小了一半（即减小了方差），并添加了 0.3 的正偏差：


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\R-Squared on a Scatter
    Plot.png](img/image009.png)


    ### 带有偏差和方差的竞争模型


    红色数据组良好地围绕在完美对应线（Line of Perfect Correspondence）周围，此时预测值等于观测值。在这种情况下，直线是完美拟合的。


    然而，蓝色数据并不接近完美对应线，尽管我缩小了它们的残差（方差），但它们存在了正偏差。


    换句话说，如果你的模型产生了偏差，`R²` 可能会产生严重的误导，甚至是灾难性的！


    我们感兴趣的是预测值与观测值的偏差，但 `R²` 衡量的是预测值与最佳拟线的偏差。


    这些看起来可能是一样的，但实际上并非如此。在任何情况下，都有更好的衡量模型的方法，这就是我们接下来要做的。


    ***


    ![image](img/scene_break.png)


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 离群值：残差的方差


    ![image](img/chapter_title_below.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\SPFQN5I5\\2etgsa12\[1\].png](d2d_images/image025.png)


    ***


    ![image](img/scene_break.png)


    当涉及到一组数据的变异程度时，通常首先想到方差，所以让我们来看看方差以及它是否能帮助我们衡量回归模型的准确性。


    我们通过以下方式计算残差的方差：


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - Variance
    of Residuals.png](img/image021.png)


    你已经知道如何计算残差和残差的平均值。嗯，至少我你知道如何计算残差的平均值——如果你不会，那你还没有准备好进行预测建模！


    所以在得到这些值后，你计算它们之间的差并平方。这表示了每个残差偏离其平均值的程度。然后通过求和（`Σ` 的含义）并除以 `N`（预测数量）来计算所有结果的平均值。


    我计算了上一章中蓝红色模型的残差及其方差，以查看方差是否有用：


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Data - Variance
    of Residuals.png](img/image016.png)


    ### 残差方差可能会误导


    如果你记得，蓝色模型是红色模型的克隆，但减少了方差并增加了偏差。红色模型的残差远小于蓝色模型的残差，表明红色模型准确得多，但蓝色模型的方差却小得多。


    从上看，残差方差并不是衡量模型准确性的良好指标，因为它它是偏离残差平均值的衡量，而当模型存在偏差时，这种衡量是有缺陷的。


    '
- fmt: '

    That’s not necessarily a reason to throw out the residual variance altogether,
    though – it can clearly be very useful for unbiased models. It also has value
    in the fact that the units are related to those of your variable of interest (hint:
    think ‘square-root’!). We’ll come back to this in a later chapter. For now, let’s
    move on and take a look at something called the Mean Absolute Error.


    ***


    # The Good Twin: Mean Absolute Error


    All predictions are wrong, but it is useful to be able to measure by how much,
    and there are many ways in which we can quantify the size of the error (oops,
    sorry, I meant residual).


    The Mean Absolute Error (which should be called the Mean Absolute Residual, but
    isn’t) is just such a measure, and we can calculate it as:


    ![d2d_images/image000.png)


    Gah!!! That looks horrible! OK, let’s break it down and work outwards from the
    centre. We already know that the difference between prediction and observation
    is the residual, so we can start from there.


    The vertical brackets tell us that we need to calculate the modulus of the residual,
    that is the magnitude or size of the residual, disregarding the sign. For example,
    residuals that have the values +3 and -3 have the same absolute residual of +3.
    From here we calculate the mean of these absolute residuals by summing, then dividing
    by `N`, the number of predictions.


    Let’s have a look at the residuals of the red model to see what I mean:


    ![d2d_images/image018.png)


    ## The Absolute Value of the Residual is Always Positive


    The Mean Absolute Error is a measure of the average size of the residuals in a
    set of predictions, without considering their direction. The illustration below
    may help to understand this concept:


    ![d2d_images/image028.png)


    ### Residuals (left) and Their Absolute Values (right)


    On the left are the residuals. Residuals that are positive sit above the line,
    whereas those that negative sit below the line. For the absolute residuals, all
    the negative values are converted to positive whilst retaining the size, so the
    illustration on the right shows all absolute residuals, which are all positive.


    The Mean Absolute Error doesn’t tell you whether or not a model is biased because
    it conveys no information about the direction of the residuals, but it does tell
    you by how much each prediction varies from observation, and is therefore good
    at expressing the average model error, marked as the orange line. Note that the
    units of `MEabs` are the same as the variable of interest, so if your variable
    ranges from, say, 0 to 100, then the Mean Absolute Error can take possible values
    from 0 to 100, or even higher if you have a really bad model! `MEabs` has an evil
    twin, who is out to confuse you! We will meet him in the next chapter.


    ***


    # The Evil Twin: Mean Error


    So we’ve had a look at the good twin, the Mean Absolute Error, so now’s get acquainted
    with the evil twin – Mean Error. The Mean Error is calculated as:


    ![d2d_images/image002.png)


    The Mean Error is pretty simple to work out – all you do is calculate the mean
    of the residuals, and voila! Instant evilness! Actually, the equation looks rather
    innocuous, not evil at all – it’s almost identical to the good twin. The only
    difference here is that we don’t calculate the absolute residuals, we leave them
    just as they are.


    To see how the Mean Error differs from the Mean Absolute Error, take a look at
    this:


    ![d2d_images/image003.png)


    ## The Mean Error Can Be Negative


    In contrast with the Mean Absolute Error, the residuals can be negative, and as
    a consequence the Mean Error can also be negative! If we’re interested in expressing
    the accuracy of a predictive model as some sort of size – as in ‘it’s this big’
    – then the Mean Error is no good to us at all. This is why it’s the evil twin
    – it looks almost identical to the good twin, but it can be very confusing as
    to which one to believe. Worse still, Mean Error is always a smaller value than
    the Mean Absolute Error because positive and negative residuals cancel out. The
    Mean Error tries to seduce you (pick me, pick me) because we all love small error
    values, don’t we (oh come on, you know you want to)?


    Actually, I’m being a little unfair to Mean Error. He’s not so evil. Yes, he’s
    confusing and seductively insidious, but he does have some redeeming qualities.
    While Mean Error is not suitable for telling us the size of the accuracy, he actually
    does a very good job at measuring the average model bias. This can be very useful.
    For instance, if you discover that a model has an average model bias of 75, to
    get a more accurate model all you need to do is subtract 75 from each prediction.
    It might seem unsophisticated in the world of Machine Learning and intelligent
    algorithms, but it’s effective nonetheless! In the next chapter we’re going to
    meet The Daddy of the group, the Root Squared Error.


    ***


    # The Daddy: Root Mean Square Error


    The prize for The Daddy of all regression-based measures of accuracy, though,
    has to go to the Root Mean Square Error – aka `RMSE`, `RMSD` or `RMSR`, depending
    on where you find it. The `RMSE` is calculated as:


    ![d2d_images/image026.png)


    The `RMSE` is a little more complicated to work out than the other members of
    the family, but not too difficult for us – we’re experienced now! All you have
    to do is work out the square of each residual before taking the mean and finally
    the square root.

    '
  raw: 'That’s not necessarily a reason to throw out the residual variance altogether,
    though – it can clearly be very useful for unbiased models.


    It also has value in the fact that the units are related to those of your variable
    of interest (hint: think ‘square-root’!). We’ll come back to this in a later chapter.


    For now, let’s move on and take a look at something called the Mean Absolute Error.


    \*\*\*


    ![image](d2d_images/scene_break.png)


