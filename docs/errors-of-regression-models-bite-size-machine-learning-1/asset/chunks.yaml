    与 `MAE` 相比，`RMSE` —— 由于残差在取平均值之前经过了平方 —— 对较大的残差和离群值赋予了较高的权重。换句话说，当模型中不希望出现较大的残差，作为模型准确性的衡量标准，应该始终优先选择
    `RMSE` 而非 `MAE`。另一方面，平方距离的使用使得 `RMSE` 的解释变得困难，而 `MAE` 在概念上更简单，因为每个误差对 `MAE` 的贡献与该误差的绝对值成比例，而这对于
    `RMSE` 并非如此。


    例如，如果我们有一对误差——`5` 和 `10`——`MAE` 给出的平均误差是 `7.5`（`5` 和 `10` 的平均值），而 `RMSE` 给出的平均误差是
    `7.9`（`5²` 和 `10²` 平均值的平方根）。直觉上，我们可以很容易理解 `5` 和 `10` 的平均值是 `7.5`，因为它们位于两点的中间，但要向你奶奶解释
    `5` 和 `10` 的平均值是 `7.9` 就困难得多了。


    涉及到基于回归模型的准确性时，争论总是归于你应该使用 `MAE` 还是 `RMSE`，所以让我们来看一个例子，看看它们是如何对比的。


    我安排了三个竞争模型具有相同的总残差，因此具有相同的 `MAE`：


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Data - Same MAE, Different
    RMSE.png](img/image013.png)


    ## RMSE 是方差的函数


    如你所见，在偏差范围内，当方差增加时，`RMSE` 也随之增加。这告诉我们 `RMSE` 是模型方差的函数。同样重要的是，`MAE` 既不是方差的函数也不是
    `RMSE` 的函数。


    让我们另一个例子，这次在增加 `MAE` 的同时保持方差固定：


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Data - RMSE is a Function
    of the Bias.png](img/image023.png)


    ## RMSE 是偏差的函数


    这一次，在方差固定的情况下，随着 `MAE` 的增加，`RMSE` 也增加。这告诉我们 `RMSE` 是 `MAE` 的函数。


    将所有观察结合起来：


    - `RMSE` 是模型方差的函数

    - `RMSE` 是 `MAE` 的函数

    - `MAE` 不是模型方差的函数

    - `MAE` 不是 `RMSE` 的函数


    ## 结论


    由于 `RMSE` 在计算中包含了 `MAE`，显而易见，与 `RMSE` 相比，`MAE` 在根据预测固有准确性来完全代表模型的能力较弱。


    但这故事并没有完全结束——正如我们在下一章中看到的，我们将把家族的所有成员聚在一起进行小小的家庭聚会……


