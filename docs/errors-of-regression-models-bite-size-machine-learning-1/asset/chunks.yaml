    The RMSE is calculated as:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - RMSE.png](d2d_images/image026.png)


    The RMSE is a little more complicated to work out than the other members of the
    family, but not too difficult for us – we’re experienced now! All you have to
    do is work out the square of each residual before taking the mean and finally
    the square root.'
