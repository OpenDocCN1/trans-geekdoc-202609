    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Crystal Ball 2.png](d2d_images/image001.png)


    ***


    There’s something coming through...


    A picture is forming...


    It’s...

    It’s...


    Gah!!! It’s gone!


    Sometimes, learning about statistics can be a bit like peering into a crystal
    ball. You think you’ve got it, only to read one more article/paper/blog, and suddenly
    it’s as clear as mud again, and you’re further away from the answer than when
    you first started.


    MaxBG1001 on his blog says it’s one thing, but Sk8rBoi on TwitFace insists it’s
    something else – and they both have perfectly plausible explanations as to why
    they’re both right. RazrButt and VanillaCupCake are saying something different
    again, and they sound like they know what they’re talking about too!


    Aaaggghhh – I’m so confused!


    Choosing the correct statistic to use in any given situation can seem like a daunting
    task at times. When there are numerous possible statistical calculations you can
    do with your data, is there one answer that is correct, while all others are incorrect?


    Not usually.


    When you realise that there are about a dozen different ways to calculate the
    average value – and they’re all wrong – it tends to give you a bit of perspective
    about statistics.


    So here are two things that will help you find your Zen:


    1. Statistics is more like a cleaver than a laser scalpel

    2. There is not usually a single correct answer (or even any correct answer!)


    In most cases there is a spectrum of approaches, some of which are more appropriate
    than others.


    Your job isn’t to make the best choices with your data – you can leave that to
    the experts that have a PhD in stats and 30+ years of experience. No, your job
    is to make sure you know how to make good choices about your data.


    In this book we’re going to be talking about how to choose the most appropriate
    statistics to measure the accuracy of your regression-based prediction model.


    You’ll discover that there is a family of related statistics, each member of which
    has their own set of dedicated fans.


    Nevertheless, in this case there is one correct statistic to use, while all the
    other measures – while useful in their own way – give only partial answers as
    to how to select the most accurate predictive model. Each of these family members
    will be introduced, and I’ll take you through their advantages and disadvantages,
    and show you how to calculate and interpret all of them. Finally, I will explain
    exactly why one particular family member is The Daddy.


