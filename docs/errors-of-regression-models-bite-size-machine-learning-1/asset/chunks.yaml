    # The Black Sheep of The Family: The R² Value


    ![image](d2d_images/chapter_title_below.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\SPFQN5I5\\2etgsa12\[1\].png](d2d_images/image025.png)


    ***


    ![image](d2d_images/scene_break.png)


    Did you spot the problem with the Scatter Plot?


    Most people won’t.


    The answer is that the `R²` value is a measure that can be very misleading. Not
    always, but sometimes, and you need to be very sure about your analyses before
    using `R²` as a measure of the ability of a model to make accurate predictions.


    Let me explain by way of example.


    There are two different questions we might ask of these predictions:


    * How far do the predictions deviate from observation?

    * How far do the predictions deviate from the line of best fit?


    These are actually two very different questions.


    Here is a Scatter Plot of the same data as before (in red), but I’ve also added
    a replica of these data (in blue). In this second set I’ve reduced the size of
    the residuals by half (i.e. decreased the variance) and added a positive bias
    of 0.3:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\R-Squared on a Scatter
    Plot.png](d2d_images/image009.png)


    ### Competing Models With Added Bias and Variance


    The red data group nicely around the Line of Perfect Correspondence, where prediction
    equals observation. In this case the line of best fit coincides with the line
    of perfect correspondence, and `R²` is a perfectly acceptable measure of model
    accuracy.


    However, the data in blue are not even close to the Line of Perfect Correspondence,
    indicating that these predictions are very far from the observed values – and
    yet the `R²` value of the blue data is very much larger than that of the red data.


    In other words, if your model produces biased predictions, then `R²` can be extremely
    misleading and potentially disastrously wrong!


    So why can `R²` get it so wrong?


    What we are interested in is measuring the deviation of the predictions from observation,
    but what `R²` measures is the deviation of predictions from the line of best fit.


    These may be the same, but they may not. In any case, there are better ways of
    measuring the effectiveness of predictive models, and this is where we’re going
    next.


    ***


    ![image](d2d_images/scene_break.png)


