    # The Good Twin: Mean Absolute Error


    ![image](d2d_images/chapter_title_below.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\9DEE29EW\\10\_02\[1\].JPG](d2d_images/image004.jpg)


    \*\*\*


    All predictions are wrong, but it is useful to be able to measure by how much,
    and there are many ways in which we can quantify the size of the error (oops,
    sorry, I meant residual).


    The Mean Absolute Error (which should be called the Mean Absolute Residual, but
    isn’t) is just such a measure, and we can calculate it as:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - Mean
    Absolute Error.png](d2d_images/image000.png)


    Gah!!! That looks horrible!


    OK, let’s break it down and work outwards from the centre.


    We already know that the difference between prediction and observation is the
    residual, so we can start from there.


    The vertical brackets tell us that we need to calculate the modulus of the residual,
    that is, the magnitude or size of the residual, disregarding the sign. For example,
    residuals that have the values +3 and -3 have the same absolute residual of +3.


    From here we calculate the mean of these absolute residuals by summing, then dividing
    by N, the number of predictions.


    Let’s have a look at the residuals of the red model to see what I mean:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Data - Mean Absolute
    Error.png](d2d_images/image018.png)


    The Absolute Value of the Residual is Always Positive


    The Mean Absolute Error is a measure of the average size of the residuals in a
    set of predictions, without considering their direction.


    The illustration below may help to understand this concept:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Magnitude of Residuals.png](d2d_images/image028.png)


    Residuals (left) and Their Absolute Values (right)


    On the left are the residuals. Residuals that are positive sit above the line,
    whereas those that are negative sit below the line. For the absolute residuals,
    all the negative values are converted to positive whilst retaining the size, so
    the illustration on the right shows all the absolute residuals, which are all
    positive.


    The Mean Absolute Error doesn’t tell you whether or not a model is biased overall
    because it conveys no information about the direction of the residuals, but it
    does tell you by how much each prediction varies from observation, and is therefore
    good at expressing the average model prediction error, marked as the orange line
    on the illustration above.


    Note that the units of MEabs are the same as the variable of interest, so if your
    variable ranges from, say, 0 to 100, then the Mean Absolute Error can take possible
    values from 0 to 100, or even higher if you have a really bad model!


    The MEabs has an evil twin though, who is out to confuse you!


    We will meet him in the next chapter.


    \*\*\*


    ![image](d2d_images/scene_break.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


