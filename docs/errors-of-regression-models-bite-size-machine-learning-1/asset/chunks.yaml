    Distinction Between Residual and Error


    It might seem unimportant to make these distinctions, but if you look around the
    literature, stats books and published papers you will often see various statistics
    quoted, such as RMSE, RMSR and RMSD (we’ll come to these later), which are abbreviations
    of:


    *   Root Mean Squared Error


    *   Root Mean Squared Residual


    *   Root Mean Squared Deviation


    To clarify – these are all the same thing, and since the error is often unknowable
    and the deviation is ambiguous, the correct term should be RMSR.


    Despite this, RMSR is rarely used and most often you will see RMSE being used
    in the literature. I even got this wrong in my PhD thesis (but I got away with
    it!).


    So what terms shall we use here? I’ll try to be consistent, but I may lapse from
    time-to-time. Here, the terms error, deviation and residual may be used interchangeably,
    but don’t let that fool you – residuals are what we’re talking about!


    So what are residuals in terms of a regression model? Well, a regression model
    will make predictions about a quantity of interest, and typically these predictions
    will vary – in other words, they will not likely all coincide with the observed
    values:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Data - Observed
    v Predicted.png](d2d_images/image015.png)


    Prediction Rarely Matches Observation


    We can plot the predictions against the observations on a Scatter plot, and run
    a regression analysis on the data:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Residuals on a Scatter
    Plot.png](d2d_images/image024.png)


    Residuals on a Scatter Plot


    The residuals, marked as arrows on the Scatter Plot, are a measure of by how much
    the predictions deviate from the best-fit line.


    Hopefully now we’re all on the same page about what observation, prediction, error,
    deviation and residual all mean, we can move on to actually do some stuff with
    them.


    Incidentally, there is something wrong with the Scatter Plot above. Have another
    look at it and see if you can spot what it is – I’ll explain more in the next
    chapter.


