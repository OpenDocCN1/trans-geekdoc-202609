    A deviation is a measure of the difference between an observed value and some
    other value, and we can distinguish between two types of deviations; an error,
    which is derived from the true, unobservable value, while a residual is the difference
    between an observation and a prediction.


    The `RMSE` is The Daddy of all the measurements and is, to coin a phrase, the
    one stat to rule them all. I’m sure I’ve heard that somewhere before...


    Anyway, the `RMSE` is a measure of the total error of a regression model, and
    has components of bias and variance.


    `MAE` and `ME` are both measures of bias, but differ in that `MAE` is a measure
    of the average size of the residuals, while `ME` is an expression of the average
    model bias.


    The `R²` value and the variance are both measures of the variability (variety
    or variance) of your model. `R²` measures the deviation of predictions from the
    line of best fit, whereas variance is a measure of the deviation from the residual
    mean.


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\RMSE Flow Chart.png](d2d_images/image010.png)


    ## The RMSE Family Tree


    I hope that you’re now in a much better position to make good choices about measuring
    the accuracy of your regression models. Better still, the next time you read a
    comment by Sk8rBoi or RazrButt about the best measures of accuracy you’ll break
    out in a wry grin in the knowledge that not only do you know what the correct
    answer is, but you’ve got the Bias/Variance Trade-Off as your ally!


