- fmt: '

    When compared to the `MAE`, the `RMSE` – since the residuals are squared before
    they are averaged – gives a relatively high weight to large residuals and outliers.
    In other words, when large residuals are undesirable in a model, the `RMSE` should
    always be preferred to the `MAE` as a measure of model accuracy. On the other
    hand, the use of squared distances renders the interpretation of `RMSE` difficult,
    while the `MAE` is conceptually simpler because each error contributes to `MAE`
    in proportion to the absolute value of the error, which is not true for `RMSE`.


    For example, if we have a pair of errors – `5` and `10` – the `MAE` gives us an
    average error of `7.5` (the mean of `5` and `10`), whereas the `RMSE` gives us
    an average error of `7.9` (the square root of the mean of `5²` and `10²`). Intuitively,
    we can easily understand that the average of `5` and `10` is `7.5`, because it
    is half-way between the two points, but it is much harder to explain to your granny
    that the average of `5` and `10` is `7.9`.


    When it comes to the accuracy of regression-based models, the argument always
    boils down to whether you should use `MAE` or `RMSE`, so let’s have a look at
    an example to see how they compare.


    I’ve arranged for three competing models to all have the same total residual,
    and therefore the same `MAE`:


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Data - Same MAE, Different
    RMSE.png](d2d_images/image013.png)


    ## RMSE is a Function of Variance


    As you can see, for a fixed level of bias, when the variance increases so does
    the `RMSE`. This tells us that `RMSE` is a function of the model variance. Just
    as importantly, `MAE` is neither a function of the variance nor the `RMSE`.


    Let’s have a look at another example, but this time arrange for fixed variance
    as we increase the `MAE`:


    ![C:\Users\Lee\Google Drive\CSI Staff Folder\Websites\CSI Website\CSI eBooks\Bite-Size
    ML Series\1. Errors of Regression Models\Edition 1\Images\Data - RMSE is a Function
    of the Bias.png](d2d_images/image023.png)


    ## RMSE is a Function of Bias


    This time, for a fixed variance the `RMSE` increases as we increase the `MAE`.
    This tells us that `RMSE` is a function of `MAE`.


    Putting all these observations together:


    - `RMSE` is a function of the model variance

    - `RMSE` is a function of `MAE`

    - `MAE` is not a function of the model variance

    - `MAE` is not a function of `RMSE`


    ## The conclusion


    Since the `RMSE` contains `MAE` in its calculation, it is evident that `MAE` is
    less capable of fully representing the model in terms of its inherent accuracy
    of prediction compared with `RMSE`.


    That’s not entirely the end of the story, though – as we shall see in the next
    chapter where we pull together all members of the family for a little household-together...


