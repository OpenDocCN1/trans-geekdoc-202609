    and see if it can help us measure the accuracy of a regression-based predictive
    model.


    We calculate the variance of the residuals like this:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - Variance
    of Residuals.png](d2d_images/image021.png)


    You already know how to calculate the residuals and the mean of the residuals.
    Well, at least I hope you know how to calculate the mean of the residuals – if
    you can’t you’re not really ready to be working with predictive modelling!


    So after you’ve got these, you take the difference between them and square each
    result. This is an expression of how far each residual deviates from their average
    value. Then calculate the mean of all the results by summing (that’s what the
    Σ means) and dividing by N, the number of predictions.


    I’ve calculated the residuals and their variances for each of the blue and red
    models from the previous chapter to see whether the variance is useful:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Data - Variance
    of Residuals.png](d2d_images/image016.png)


    Variance of Residuals Can Be Misleading


    If you recall, the blue model is a clone of the red model, but with reduced variance
    and added bias. The residuals of the red model are very much smaller than those
    of the blue model, indicating that the red model is much more accurate, and yet
    the variance of the blue model is much smaller. Intuitively, we know that the
    red model would be a better predictor than the blue model if it didn’t have the
    added bias, and this is what the residual variance tells us.


