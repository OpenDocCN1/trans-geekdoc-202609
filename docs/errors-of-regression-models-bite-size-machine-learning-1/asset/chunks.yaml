    # Jeez, That’s One Dysfunctional Family!


    ![image](d2d_images/chapter_title_below.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\X2B0KJGO\\Addams\_Family\_main\_cast\_1964\[1\].jpg](d2d_images/image005.png)


    \*\*\*


    Despite all the shouting and the arguments, there is one very good reason why
    RMSE is The Daddy – and I’ve already given you a clue what it is!


    Let me introduce you to The Daddy’s superhero name:


    The Bias/Variance Trade-Off !!!


    If you haven’t heard of this, you’re in for a treat, because this is soooooo important
    to predictive modelling, and gives you the total error for any predictive model.


    The BVTO, as some might call it, is expressed as the Mean Squared Error. Recognise
    it? You should – it’s the RMSE without the R. Or, put another way, it’s RMSE².


    So here it is – the BVTO is calculated as:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - Bias
    Variance Trade-Off.png](d2d_images/image020.png)


    We already know how to calculate the MSE and the RMSE, but the really important
    thing is that the Bias/Variance Trade-Off is expressed in terms of both the variance
    and the bias (MAE).


    This means that the accuracy of any model must contain an expression of its total
    error, i.e. both the variance and the bias:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Bias & Variance.png](d2d_images/image006.png)


    Illustration of the Relationship Between Accuracy, Bias and Variance


    This is why any of R², variance, MAE and ME cannot on their own fully describe
    the accuracy of a model – but the RMSE can!


    Let’s have a look at another couple of models, where this time I’ve arranged for
    the RMSE to remain fixed by choosing data from a Pythagorean Triple:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Data - Bias Variance
    Trade-Off.png](d2d_images/image027.png)


    The Bias/Variance Trade-Off in Action!


    For a fixed level of accuracy, when you increase the bias (model 5) the variance
    decreases. This is why it is a trade-off, because as the variety of the data increases,
    the bias towards individual data points must decrease, and vice versa.


    Do you see what this means?


    Since the RMSE has components of bias and variance, it is not enough to smugly
    quote the RMSE of your model and exclaim ‘job done!’. You need to quote the levels
    of both bias and variance to demonstrate which models (if any) are a good compromise
    between the competing demands of low bias and low variance.


    A model that has low bias and high variance or one with high bias and low variance
    may have the same overall accuracy but each could produce highly undesirable predictions.
    It is usually the case (but not always) that a good compromise between bias and
    variance leads to the best prediction models.


    ## Total Accuracy


    As far as I’m concerned, you should always quote the RMSE as the overall measure
    of the accuracy of your models. When comparing models to decide which is the most
    accurate, it’s the RMSEs that you compare.


    ## Bias


    Next up, you need to quote the MAE with an explanation that this tells you by
    how much each prediction deviates from observation.


    Then you can quote the ME to show whether your model has an overall bias – remember
    that this bias can be positive or negative.


    ## Variance


    Finally you can quote the variance, explaining that this is a measure of how far
    your model’s predictions deviate from their average value.


    As an alternative to the variance, you can use R². I prefer not to use it because
    the units are not related to those of your variable of interest, but R² is actually
    a perfectly good choice because most people who are used to running regression
    analyses will have a good feel for what a good (or bad) R² looks like.


    If you want to feel smug, you can quote the BVTO – that will usually make you
    look good in front of the boss...


