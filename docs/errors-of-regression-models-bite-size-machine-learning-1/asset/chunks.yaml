    但这并不意味着我们要完全抛弃残差——尽管如此——它对于无偏模型显然非常有用。它的价值在于其单位与你感兴趣的变量单位是相关的（提示：想想“平方根”！）。我们将在后面的章节中回到这一点。现在，让我们继续，看看一种被称为“平均绝对误差”（Mean
    Absolute Error）的内容。


    ***


    # 好的双胞胎：平均绝对误差


    所有的预测都是错误的，但能够衡量出错误的程度是很有用的，我们有很多方法可以量化误差的大小（噢，抱歉，我的意思是残差）。


    平均绝对误差（应该被称为平均绝对残差，但并没有这么叫）就是这样一种衡量标准，我们可以这样计算它：


    ![d2d_images/image000.png)


    啊！！！这看起来太糟糕了！好了，让我们把它拆解开，从中心向外分析。我们已经知道预测值与观测值之间的差异就是残差，所以我们可以从这里开始。


    垂直括号告诉我们需要计算残差的绝对值（modulus），即残差的大小或程度，不考虑正负号。例如，值为 +3 和 -3 的残差具有相同的绝对残差 +3。从这里，我们通过求和这些绝对残差，然后除以
    `N`（预测的数量）来计算这些绝对残差的平均值。


    让我们看看红色模型的残差，看看我的意思：


    ![d2d_images/image018.png)


    ## 残差的绝对值总是正数


    平均绝对误差是衡量一组预测中残差平均大小的指标，而不考虑它们的方向。下面的插图可能有助于理解这个概念：


    ![d2d_images/image028.png)


    ### 残差（左侧）及其绝对值（右侧）


    左侧是残差。正残差位于线方，而负残差则位于线下方。对于绝对残差，所有负值都被转换为正值，同时保留了大小，因此右侧的插图显示了所有的绝对残差，它们都是正数。


    平均绝对误差不能告诉你模型是否存在偏差，因为它没有提供任何关于残差方向的信息，但它能告诉每个预测值偏离观测值的程度，因此它非常擅长表达平均模型误差（用橙色线标记）。注意，`MEabs`
    的单位与感兴趣的变量相同，所以如果你的变量范围是从 0 到 100，那么平均绝对误差的取值范围可以是 0 到 100，如果你的模型非常糟糕，甚至可能更高！`MEabs`
    有一个邪恶的双胞胎，他一心想要困惑你！我们将在下一章节遇到他。


    ***


    # 邪恶的双胞胎：平均误差


    我们已经看了好的双胞胎——平均绝对误差，现在来认识一下邪恶的双胞胎——平均误差（Mean Error）。平均误差的计算方式如下：


    ![d2d_images/image002.png)


    平均误差的计算非常简单——你只需要计算残差的平均值，搞定！邪恶瞬间产生！实际上，这个公式看起来相当无害，一点也不邪恶——它和好的双胞胎几乎完全一样。唯一的区别在于我们不计算绝对残差，而是让它们保持原样。


    为了看到平均误差与平均绝对误差的区别，看看这个：


    ![d2d_images/image003.png)


    ## 平均误差可以是负数


    与平均绝对误差相反，残差可以是负数，因此平均误差也可以是负数！如果我们感兴趣的是以某种尺寸来表达预测模型的准确性——比如“它有多大”——那么平均误差对我们来说毫无用处。这就是为什么它是邪恶的双胞胎——它看起来和好的双胞胎几乎一样，但对于相信哪一个可能会非常困惑。更糟糕的是，平均误差总是比平均绝对误差小，因为正负残差相互抵消了。平均误差试图诱惑你（选我，选我），因为我们都喜欢小的误差值，不是吗（噢，你知道你想要的)？实际上，我对平均误差有点不公平。他并不那么邪恶。是的，他很困惑且具有诱惑性，但他也有一些可救之处。虽然平均误差不适合告诉我们准确性的大小，但他在衡量平均模型偏差方面做得非常好。这非常有用。例如，如果你发现一个模型的平均模型偏差为
    75，为了获得更准确的模型，你只需要从每个预测值中减去 75。在机器学习和智能算法的世界里，这似乎并不复杂，但它确实有效！在下一章节，我们将遇到这个群体中的父辈——均方根误差。


    ***


    # 父亲：均方根误差


    然而，所有回归准确性指标的“父亲”奖必须属于均方根误差（Root Mean Square Error），也称为 `RMSE`、`RMSD` 或 `RMSR`，取决于你在哪里找到它。


    ![d2d_images/image026.png)


    `RMSE` 的计算比家族其他成员复杂一点，但对我们来说并不难——我们现在有经验了！你只需要计算每个残差的平方，然后取平均值，最后开平方根即可。

