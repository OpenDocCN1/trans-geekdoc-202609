    ![image](d2d_images/chapter_title_above.png)


    # The Evil Twin: Mean Error


    ![image](d2d_images/chapter_title_below.png)


    ![C:\\Users\\Lee\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\9DEE29EW\\10\_02\[1\].JPG](d2d_images/image014.jpg)


    \*\*\*


    So we’ve had a look at the good twin, the Mean Absolute Error, so now let’s get
    acquainted with the evil twin – Mean Error.


    The Mean Error is calculated as:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Equation - Mean
    Error.png](d2d_images/image002.png)


    The Mean Error is pretty simple to work out – all you do is calculate the mean
    of the residuals, and voila! Instant evilness!


    Actually, the equation looks rather innocuous, not evil at all – it’s almost identical
    to the good twin. The only difference here is that we don’t calculate the absolute
    residuals, we leave them just as they are.


    To see how the Mean Error differs from the Mean Absolute Error, take a look at
    this:


    ![C:\\Users\\Lee\\Google Drive\\CSI Staff Folder\\Websites\\CSI Website\\CSI eBooks\\Bite-Size
    ML Series\\1. Errors of Regression Models\\Edition 1\\Images\\Mean Error.png](d2d_images/image003.png)


    The Mean Error Can Be Negative


    In contrast with the Mean Absolute Error, the residuals can be negative, and as
    a consequence the Mean Error can also be negative!


    If we’re interested in expressing the accuracy of a predictive model as some sort
    of size – as in ‘it’s this big’ – then the Mean Error is no good to us at all.


    This is why it’s the evil twin – it looks almost identical to the good twin, but
    it can be very confusing as to which one to believe. Worse still, Mean Error is
    always a smaller value than the Mean Absolute Error because positive and negative
    residuals cancel out. The Mean Error tries to seduce you (pick me, pick me) because
    we all love small error values, don’t we (oh come on, you know you want to...)?


    Actually, I’m being a little unfair to Mean Error. He’s not so evil. Yes, he’s
    confusing and seductively insidious, but he does have some redeeming qualities.


    While Mean Error is not suitable for telling us the size of the accuracy, he actually
    does a very good job at measuring the average model bias.


    This can be very useful. For instance, if you discover that a model has an average
    model bias of 75, to get a more accurate model all you need to do is subtract
    75 from each prediction. It might seem unsophisticated in the world of Machine
    Learning and intelligent algorithms, but it’s effective nonetheless!


    In the next chapter we’re going to meet The Daddy of the group, the Root Mean
    Squared Error.


