  \n### 4.7 交易成本的影响\n\n到目前，我们通过运行简单的等权重回测测试了提出的机器学习模型的预测能力。在本节中，我们使用 Axioma 组合优化系统来模拟真实的交易策略，并评估交易成本对性能的影响。\n\
  \n### 4.7.1 欧洲股票的优化策略\n\n我们选择了一个相当标准的优化设置来选择符合某些真实约束的均值方有效组合。特别是，我们设定了 5%（年化）的最大风险水平，并使用每个模型的\
  \ alpha 作为输入来最大化预期收益。组合是全抵押的（即如果抵押金额为 100，则我们在每侧建立总额为 100 的部位）。\n\n优化问题还包含了量化交易策略常见的系列约束：\n\
  \n- 净行业敞口通过一级 GICS 行业限制在组合净值的 -5% 到 5% 之间；\n- 国家敞口也限制在 -5% 到 5% 之间；\n- 货币交易限制在 -1%\
  \ 到 1%；\n- 个股权重上限为 2%。我们还设定了 0.50% 的阈值以避免极小头寸。\n\n最后一条约束旨在通过减少策略在市场中的交易足迹来限制市场冲击。我们假设在\
  \ 2011 年 1 月的初始资金为 1 亿欧元。为了考量交易成本的影响，我们设定了单向 10 个基点的成本，这与大型机构投资者所面临的典型交易成本一致，正如\
  \ Frazzini 等人 (2018)^(10) 所述。\n\n\n\n\n\n图 4.26 显示了我们的模拟结果。我们分析的主要结论可以总结如下：在*交易成本发生前*的风险调整后收益率（“总信息比”）方面，我们的机器学习模型表现均优于传统的\
  \ Alpha 模型，随机森林除外。这一结果与我们在之前节中中未优化的回测一致。Alpha 模型与机器学习模型之间信息比的差距是巨大的：前者的 IR 为 1.80（仍然非常可观），而组合机器学习模型（集成）的\
  \ IR 达到了 2.16。\n\n![ ¶ 图 4.26. 欧洲优化策略的回测结果（无换手率限制）(来源：Macquarie Quantitative Strategy,\
  \ Axioma, 2019 年 1 月。假设交易成本为单向 10bp。收益率以欧元计算）](img/fig4-26.jpg)\n\n¶ 图 4.26。 *欧洲优化策略的回测结果（无换手率限制）（来源：Macquarie\
  \ Quantitative Strategy, Axioma, 2019 年 1 月。假设交易成本为单向 10bp。收益率以欧元计算*\n\n然而，新模型通过产生大量的交易实现了如此强劲的性能，正如平均月换手率所示，通常是\
  \ Alpha 模型的倍倍（约 259% 对比 119%）。我们认为这一结果是由于此类策略对技术指标等快速变化的信号具有很强的暴露性。因此，我们对比例交易成本的假设对机器学习模型的影响远大于基准。新模型的净收益比总收益低约\
  \ 3%，而基准模型的差距则接近 1.5%。\n\n值得提到的是，换手率按多空双方总和计算，并以抵押品价值的百分比表示。因此，在重新平衡投资组合时可以产生的最大换手率为\
  \ 400%。\n\n表中所示净信息比表明，尽管交易成本影响巨大，但机器学习模型确实交付了与我们的 Alpha 模型相当的水平。事实上，我们的组合机器学习模型的净\
  \ IR 仍然略高于基准模型（1.58 对比 1.57）。在提出的三个模型中，神经网络既具有最低的换手率，最高的净 IR（1.60）。\n\n从表中很明显，我们的机器学习模型在多头和空头方面往往会产生更多的组合头寸。这似乎产生了多元化收益，使得样本外波动率比\
  \ Alpha 模型的波动率更接近目标（5%）。\n\n为了研究换手率对我们策略性能的影响，我们对优化施加了进一步限制：对投资组合总换手率设置了上限。图 4.27\
  \ 通过侧重于组合机器学习模型（集成）和基准模型（Alpha 模型）总结了结果。虚线代表总风险调整后收益与换手率水平之间的关系。在交易成本之前，意乎意料的是，对交易量的限制越紧，性能越越差。如果我们设置了\
  \ 80% 的最大月换手率（图表最左侧的点），那么两种策略的总 IR 均约为 1.60。对于较宽松的换手率限制（120% 和 160% 限制），机器学习模型提供了更优的性能。在这种情况下，交易成本的影响是什么？\n\
  \n![图 4.27. 交易成本前后的换手率限制影响。ML = 机器学习（来源：Macquarie Quantitative Strategy, Axioma,\
  \ 2019 年 1 月。换手率以月百分比衡量，是双方双向换手率之和）。需此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig4-27.jpg)\n\
  \n图 4.27。 *交易成本前后的换手率限制影响。ML = 机器学习（来源：Macquarie Quantitative Strategy, Axioma,\
  \ 2019 年 1 月。换手率以月百分比衡量，是双方双向换手率之和）。需此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n图 4.27 通过绘制我们策略的累计总收益，进一步说明了换手率限制为 160% 情况下的结果。集成策略在整个期间的性能与基准相当；然而，其随时间变化的收益模式更加规律，这解释了较低的*事后*风险。随机森林和回归树不仅显示出较低的绝对收益，而且风险水平低得多，更接近\
  \ 5% 的目标。策略的整体行为非常相似，考虑到原始信号是相同的，这并不意外。例如，2018 年被证明对所有模型都是挑战性的一年。![图 4.28. 换手率限制为\
  \ 160% 时的成本后总收益（来源：Macquarie Quantitative Strategy, Axioma, 2019 年 1 月。收益以对数尺度绘制）。需此图的彩色版本，请访问\
