  \n表 11.4. *贝叶斯推理：净订单流依赖性*\n\n为了更好地解释结果，我们在给定两个参与率水平（0.1%和 30%）的买入和卖出交易中绘制了净订单流不平衡的后验分布。正如预期的那样，交易方向使分布对于买入订单正偏，对于卖出订单负偏。元订单参与率的信息强化了偏度，并增加了完全同步的可能性\
  \ `|Imb| = 1`。然而，分布的形状在买入订单和卖出订单之间并不对称。不平衡在卖出订单中强得多。这意味着当投资者大量卖出 ![images](img/ieq11-21.jpg)\
  \ 时，由于投资者的同步流入和流出，可以预期会有巨大的压力。因为机构投资者是自然的买家，卖压力对应于“冲向出口”的情况。而在相反的情况下，高参与率的买入订单虽然具有市场信息，但并没有提供足够的证据。\n\
