  \ | 0.034 | 0.001 |\n| **Sensitivity** | 0.307 | 0 | 0.369 | **0.427** | 0.411 |\
  \ 0.245 | 0.431 | 0.15 | 0.217 | 0 |\n| **Specificity** | 0.845 | **1** | 0.805\
  \ | 0.69 | 0.761 | 0.869 | 0.749 | 0.921 | 0.899 | 0.998 |\n| **AUC** | 0.54 | NA\
  \ | 0.541 | 0.526 | 0.539 | 0.535 | 0.54 | 0.531 | 0.538 | **0.689** |\n\n类似的逻辑也适用于敏感性和特异性指标。前者类似于一种看涨指标，即较高的敏感性意味着算法的展望更加乐观。后者是更偏看熊的指标，即较高的特异性意味着负面事件的预测更准确。如表\
  \ 2.2 所示，我们观察到在 `a` = 0.5 水平下，敏感性（相应特异性）最高（相应最低），而随着 `a` 的增加，它们会下降（相应增加）。\n\n此外注意，Kappa\
  \ 统计量倾向于随着风险规避阈值的增加而显示出增长趋势，直到阈值超过 0.9。\n\n观察 ML 预测的平均值，我们发现与其他领域的 ML 应用相比，AUC 指标在大多数情况下相对较低（0.5\
  \ 左右）。然而，在某些情况下该指标显示出较大的值，这些在 `a` = 0.5 时最为明显。然而，当我们增加 `a` 水平时，我们正在干预预测模型，将正事件识别为负面事件。因此，我们观察到\
  \ AUC 值的下降。尽管如此，从风险管理的角度来看，投资者可能更关注下行风险（特异性），而不是股市上涨的机会成本（敏感性）。为了进一步理解这些统计意义，我们转向财务性能评估。\n\
  \n### 2.5.3 财务性能\n\n以下结果说明了战术资产配置策略的财务性能。记得，该实现方案使用一年的训练数据来预测下个月的股票波动。通过滚动窗口应用该方法，我们在\
  \ 2005 年 12 月 2 日至 2019 年 1 月 31 日的样本外期间获得了 158 次重新校准。\n\n表 2.3 展示了所有所分析 ML 算法的样本外财务性能。2.5.2\
  \ 节与 2.5.3 节的区别在于分类的规模或后果被纳入了投资性能中。后者也是算法交易策略背景下应用 ML 算法最重要的因素。\n\n\n\n\n总体而言，所分析的机器学习算法的年化收益率随着风险厌恶阈值的增加而增加，并在\
  \ `0.9` 处达到峰值，在 `0.95` 处略有下降。同样，除 `C5.0` 和 `GLM` 外，在年化夏普比率上也能观察到相同的行为。然而，我们注意到这两项性能指标的提升是以增加换手率为代价的。此外，阈值的增加与最大回撤的减少之间存在强相关性，这表明安全阀发挥了正常作用。我们可以根据该框架在实际应用中的偏好，来确定阈值的最优值。\n\
  \n代表历史收益率低 `5%` 分位数的历史风险价值（VaR）在所使用的机器学习算法的战术资产配置框架中，在不同阈值下似乎是稳定的。它们的数值也处于 `1%`\
  \ 或更低，表明投资财富损失的风险较低。\n\n在分析加权函数的个体性能时，显然，从投资回报率和夏普比率来看，收益似乎都适中，并与中等表现者处于同一水平。加权函数对缓解最大回撤似乎具有显著影响。这表明机器学习算法输出的加权版本具有最高的价值。\n\
  \n从表 2.3 中可以看出，当风险厌恶阈值为 `0.5` 时，换手率最低。这可以通过机器学习算法输出的大量高概率来解释。换句话说，由于输出概率的整体水平较高，只有少数实例会低于阈值概率，因此导致持仓的变化较少。\n\
  \n回想表 2.3 中的百分比最大成本，表示为了获得与最佳基准相同的年化收益，在调整持仓时所承担的最大交易成本。将风险厌恶阈值设定在 `0.5` 级别会导致所有分析的机器学习算法出现负的最大成本。因此，投资者不应使用这种配置。此外注意，除了使用\
  \ `C5.0` 和多层感知器的策略外，我们发现最大成本的正值低于 `0.1%`。这意味着，如果向投资者收取的交易成本高于 `10 个基点`（basis points），相应的机器学习算法策略表现将逊于基准。然而，多层感知器所带的最大成本范围在\
  \ `0.18%` 到 `0.25%` 之间。结果，使用多层感知器策略的投资者在存在交易成本的情况下可能超越基准。\n\n通过将表 2.3 的结果与 Hull\
  \ 和 Qiao (2015)获得的结果进行比较，我们可以迅速注意到在战术资产配置背景下机器学习算法的价值。Hull 和 Qiao (2015) 部署的厨房水槽模型显示在\
  \ 2001 年 8 月 6 日至 2015 年 4 月 5 日期间的年化收益为 `12.11%`，夏普比率为 `0.85`，最大回撤为 `21.12%`。从每个算法的个体性能来看，我们在表\
  \ 2.3 中观察到算法的性能差异显著。\n\n\n\n\n![图 2.4. 风险厌恶阈值值的变化对多层感知机输出准确率和曲线下面积 (AUC)的影响](img/fig2-4.jpg)\n\
  \n图 2.4 *风险厌恶阈值值的变化对多层感知机输出准确率和曲线下面积 (AUC)的影响*\n\n图 2.4 展示了不同阈值值 `a`（从 `a` = 0.5\
  \ 到 `a` = 1）下准确率和曲线下面积的变化情况。从图 2.3 可以观察到，对于多层感知机的输出概率，阈值的增加会导致准确率和曲线下面积的下降。因此，这两条曲线均表现出相似的下降凹形趋势，且准确率的曲线更为平滑。\n\
  \n这种下降趋势背后的原因是达到极值（接近 100%）的输出概率稀少。换句话说，增加风险厌恶阈值会导致分类为负例（或假阴性）的实例增加，从而导致准确率和曲线下面积的下降。注意，从图\
  \ 2.4 我们可以预期，最佳风险厌恶阈值值为 0.5。\n\n从投资者的角度来看，我们感兴趣的是根据统计标准衡量的该策略在 ML 算法预测能力方面的财务影响。图\
  \ 2.5 展示了不同风险厌恶阈值下夏普比率和 kappa 统计量的变化情况。\n\n![图 2.5. 风险厌恶阈值的变化对多层感知机输出夏普比率和 kappa\
  \ 统计量的影响](img/fig2-5.jpg)\n\n图 2.5 *风险厌恶阈值的变化对多层感知机输出夏普比率和 kappa 统计量的影响*\n\n图 2.5\
  \ 展示了不同风险厌恶阈值 `a`（从 `a` = 0.5 到 `a` = 1）下夏普比率和 kappa 统计量的变化情况。在图 2.5 中，我们可以观察到阈值值变化的影响表现出相似的行为，但最大值不同。夏普比率和\
  \ kappa 统计量均呈现增长趋势，直到达到各自的最大值后下降。\n\n通过对比图 2.4 和图 2.5，可以看出，风险调整收益随阈值值的变化行为似乎可以通过\
  \ kappa 统计量得到最佳近似。在战术资产配置策略的背景下，追求最大化准确率或曲线下面积的 ML 算法对于多层感知机产生的风险调整收益而言并不是最优的。从这个角度来看，选择一个使\
  \ kappa 统计量最大化的阈值值，与其他统计标准相比，在风险调整收益方面将产生更获利的策略。注意，从图 2.5 中曲线形状可以看出，我们可以预定的 kappa\
  \ 统计量值（例如 0.05）作为确定风险厌恶阈值的最低要求。对 kappa 统计量设定最低要求，将导致风险调整收益与阈值值的选择成正比的策略。\n\n根据内部构造，战术资产配置框架允许将误分类相关的整体误差和成本降低到假阳性，从而导致策略的负收益。在这种视角下，所有假阴性都通过战术配置中的投资国债进行了对冲，确保了策略的收益。换句话说，对于战术配置而言，使用预定的\
  \ kappa 统计量来减少假阳性的数量至关重要。注意，图 2.5 中夏普比率的行为是图 2.4 中准确率产生差异的主要原因。\n\n基于 ML 的算法相对于简单的持有或配置策略具有计算成本。表\
  \ 2.4 比较了在风险厌恶阈值为 0.9 和 0.95 时多层感知机的性能。这些策略构成了 SPY 和 10 年国债的战术配置，正如第 2.2 节所示。\n\n\
  表 2.4 *分析基准的性能*\n\n| | SPY | IEF | 60/40 | Faber | MPL (a=0.9) | MPL (a=0.95) |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- |\n| 年化收益 | 0.082 | 0.046 | 0.074 | 0.11\
  \ | 0.206 |\n| 年化标准差 | 0.191 | 0.066 | 0.106 | 0.129 | 0.083 |\n| 年化夏普比率 | 0.431\
  \ | 0.704 | 0.7 | 0.852 | 2.822 |\n| 偏度 | 0.169 | 0.116 | 0.359 | 0.53 | 0.99 |\n\
  | 峰度 | 15.755 | 2.648 | 17.425 | 5.127 | 15.541 | 4.273 |\n| 最大回撤 | 0.552 | 0.104\
  \ | 0.314 | 0.173 | 0.274 | 0.126 |\n| 历史 VaR (95%) | 0.018 | 0.007 | 0.01 | 0.013\
  \ | 0.009 | 0.07 |\n\n总体而言，表 2.4 表明战术配置策略在年化收益和夏普比率方面优于其他基准。除了国债外，Faber 框架的回撤最小，意味着相对于\
  \ SPY 和简单的 60/40 策略风险较低。Faber 框架的优越性在图 2.5 中进一步说明，我们观察到该策略在 2007-09 年金融危机期间切换到国债，从而在样本期内获得了累计收益最佳的基准表现。\n\
  \n为了对基准结果进行对比，风险厌恶阈值为 0.9 和 0.95 的 ML 算法结果在年化——以及风险调整收益方面明显优于所有基准。在风险厌恶阈值为 0.95\
  \ 的配置下，即使是 Faber 框架在最大回撤方面也被超越了，这表明了风险厌恶阈值安全功能的有效性。\n\n\n\n\n\n与图 2.4 和 2.5 一致，图\
  \ 2.7 展示了基于风险厌恶阈值为 0.95 和 0.90（黑线）的 MLP 算法输出信号的策略累计收益率。将 ML 策略与同一时期的 Faber 基准进行了对比（红线）。此外，我们添加了两个加权\
  \ ML 输出，一个是等权重（绿色），另一个（蓝色）是相对于平方和误差的权重，如公式[\\[2.9\\]](#c02.xhtml#eqn2-9)所描述的。\n\n\
  在任何情况下，我们都观察到 MLP 策略在累计收益率方面优于基准。同时，我们观察到 Faber 策略优于平均 ML 策略。后者的证据削弱了与依赖基本计算的特设技术相比，ML\
  \ 的效用性。此外，`a = 0.9` 配置具有较高的风险偏好，导致其最大回撤达到 27.3%，而 `a = 0.95` 则为 12.6%。总体而言，配置阈值为\
  \ 0.9 的 MLP 策略对 2007–2009 年金融危机的敏感度高于 `a = 0.95`。虽然该策略自危机开始以来表现良好，但我们观察到它在 2009\
  \ 年末表现不佳。\n\n![图 2.7. 多层感知器、Faber 框架以及风险厌恶阈概率为 0.95 的模型平均策略的样本外收益。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip](img/fig2-7.jpg)\n\
  \n**图 2.7.** *多层感知器、Faber 框架以及风险厌恶阈概率为 0.95 的模型平均策略的样本外收益。此图的彩色版本请参阅 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n注意，在不稳定时期之后，该策略显示出财富的巨大增长，导致在分析期间的年化累计收益达到 28.9%。一个重要的警告是，所取得的性能取决于所选的收益收益值 `τ[t]`、概率分类阈值值\
  \ `a`、训练和评估样本的大小以及所取的伪随机种子。\n\n### 2.5.5. LIME\n\n我们现在使用 LIME (Ribeiro, 2016) 来揭示导致\
  \ MLP 性能的重要特征。如第 2.4.3 节所示，它使用局部线性近似来推导出影响决策的重要特征。结果所示图 2.8，其中我们展示了在 `a = 0.9` 时对\
  \ MLP 决策的平均相对影响。\n\n![图 2.8. 平均输入的平均效应](img/fig2-8.jpg)\n\n**图 2.8.** *平均输入的平均效应*\n\
  \n从图 2.8 可以看出，与 SPY 相关的特征是预测概率最显著的影响因素。SPY 相关特征由 SPY 收益、SPY 收益的移动平均和 SPY 成交量组成。SPY\
  \ 收益和成交量对多层感知器的预测产生了相似的影响。虽然尚不清楚过去价格和高成交是否意味着未来的上涨或下跌，但 ML 表明具有积极影响。换言之，图 2.8 显示\
  \ SPY 收益和成交量的增加与未来价格相关。SPY 收益移动平均值的逻辑则反之。这表明 SPY ETF 的长期价格行为与 SPY ETF 的短期行为之间的交互表现出相反的影响，并由多层感知器产生。所展示的交互意味着，SPY\
  \ ETF 的低（高）收益伴随高（低）收益意味着向下（向上）移动的概率更高。后者表明，在上述条件下使用这种方法仅暗示了平均意义上是如何进行预测的。为了获得更准确的线性近似，用户应该对每个预测值单独进行相同的分析。\n\
  \n### 2.6. 结论\n\n本章为那些希望使用机器学习进行战术资产配置且不想在数据或软件上花费资金的投资者展示了开放数据和软件的使用。我们展示了与纯多头、固定组合和动量策略相比，通过机器学习所获得的性能提升潜力。我们的分析具有启发性，并不意味着详尽。寻找具有适当超参数的最优机器学习算法是一项艰巨的任务，部分由于金融时间序列中包含的噪声。改进数据输入、数据处理、超参数校准以及使用其他机器学习算法都是提高性能的前景途径。\n\
