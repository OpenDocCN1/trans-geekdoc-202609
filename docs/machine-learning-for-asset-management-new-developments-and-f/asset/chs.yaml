  \ 12 个月滚动窗口估计的股票 `k` 的 Garman and Klass (1980) 日内波动率。`Q[k]*(*m*)` 和 `s[k]*(*m*)`\
  \ 分别是订单的大小和方向（买/卖）。`ADV*k*` 是 12 个月滚动窗口的平均日成交量，而 `Q[k]*(*m*))*/*ADV*k*` 是参与率。`Imb*k*`\
