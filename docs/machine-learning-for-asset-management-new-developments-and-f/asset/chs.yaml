  \n\n\n\n这些特征可以分为几个子组，包括基于价格的决策指标（如动量信号）、质量指标（如不同盈利能力的衡量指标）、市值、权益水平情绪、风险衡量指标（如历史贝塔和波动率），以及估值衡量指标（如市净率和市盈率）。这些衡量指标的动机既基于学术文献，也基于基本分析师评估股票风险的行业实践。两种相对新颖的风险衡量是来自\
  \ RavenPack 的情绪情绪指标，即平均股票情绪和月度新闻量。\n\n股票级情绪衡量指标基于 RavenPack 开发的事件情绪得分（`ESS`）。`ESS`\
  \ 取决于检测事件类别以及从新闻故事中提取的其他信息，例如财务数据、分析师评级以及方向性或情感性语言。可以认为，`ESS` 考虑了语境，因此应该能够提供精确的情绪得分。关于\
