  \n# 10 投资组合业绩归因：一种基于机器学习的方法\n\n使用一种受分类和回归树启发的机器学习方法，我们对美国股票市场中的几个因子偏斜投资组合进行了业绩归因。我们发现，该方法能够识别此类组合的系统性收益来源，并解释此类策略的大部分跟踪误差。此处详细介绍的算法比其他常用的归因方法具有显著更高的解释力。\n\
  \n## 10.1. 引言\n\n投资组合的业绩日益被视为系统性因子（系数）与底层投资经理主动判断的结合。投资组合的准确业绩归因涉及将系统性因子与主动管理分离，以便投资者能够区分纯由于系统性因子产生的收益与由于投资者能力的收益——这一任务对相关费用具有重大影响。收益大部分归因系统性因子的投资组合预计会有相应的较低费用。\n\
  \n收益的系统性分离通常通过基于收益的分析、基于持仓的分析或两者的结合来实现。基于收益的分析通常需要更长的时期——例如三到五年的月收益。基于持仓的分析（使用 Brinson\
  \ 和 Fachler (1985) 提出的方法）可以在更短的时期内应用。这种通常被称为“布林森归因”（Brinson attribution）的方法可以应用于任何任意时间段，尽管它最常被应用于每月持有期。虽然该框架的应用通常使用国家和行业作为底层系统性因子，但基础框架可以通过在连续变量的不同水平使用离散分类变量来轻松调整。基于布林森的归因面临两个挑战：第一是创建分类变量的切断点选择；第二是维度灾难。例如，当我们分析单个连续变量的收益贡献时，该过程需要将此变量转换为水平。最常见的是四或五个，但有时少至两个，多达十个——以捕捉与该变量相关的收益变化。类别切断点通常基于落入每个组的观测值数量，通常以市值进行加权。当使用多个变量时，变量之间的相互作用会产生大量的类别。例如，当我们分析市值和市盈收益率对投资组合收益的影响时，每个变量使用五个类别将导致使用\
  \ 25 个（即 5 × 5）分类变量来捕捉这些因子之间的相互作用。当股票池中的股票数量较少时，这尤其具有挑战性，因为每个组的股票数量相应减少，会导致各组收益被特异性效应主导。\n\
  \n\n\n在本章中，我们使用一种基于机器学习的方法来解决这两个问题。首先，我们每个时期变量的选择以及用于定义该变量分组的截断，都是基于它们解释投资组合主动收益（active\
  \ return）的能力。其次，变量之间的交互作用也是根据这一相同标准实证推得出的。通过几个案例研究说明了该方法，并且我们显著降低了未解释主动收益的水平。最小化未解释主动收益的过程也可以作为识别因子偏斜组合中系统性偏斜（systematic\
  \ tilts）的良好标准。\n\n这种方法的优点在于，自动选择最能解释目标组合主动收益的变量，能够对大量策略进行分析。此外，对系统性偏斜水平识别能力的提升，增加了具有经济意义的绩效归因的程度。这种技术可以轻松扩展到不同的策略、时期和因子库。\n\
  \n对本章所用方法的一种批评是，这里使用的机器学习并非“样本外”的，因此其结果优于简单归因（naive attribution）的结果并不令人意外。然而，所提出的分析侧重于*事后*（ex\
  \ post）解释投资组合主动收益的能力。本文的研究目标是量化使用机器学习分析主动收益的潜在收益。鉴于因子偏斜策略数量的增加，此类方法的一种潜在应用是量化来自纯因子偏斜的收益组成，而无需假设特定的风险或定价模型，例如\
  \ Fama–French 4 因子模型 (Carhart 1997)。\n\n接下来的章节介绍了本章使用的符号和算法。随后是对数据的描述，以及对将该过程应用于投资者目前使用的常用的基于因子的投资组合策略所产生的结果的讨论。本章以结果总结以及对该方法在绩效归因中潜在应用的讨论作为结束。\n\
  \n## 10.2 方法论\n\n我们的起点是 Brinson–Fachler 归因模型。这种基于持仓的绩效归因方法将相对于于基准的收益分解为两种效应。“分配效应”（Allocation\
  \ effects）被解释为经理超配高表现股票组和低配低表现股票组的能力。另一类被称为“残差效应”（residual effects），被解释为经理在上述组内识别获胜和亏损股票的能力。\n\
  \n每个类别 `j` 的分配效应在 Brinson–Fachler 归因中由以下方程表示：\n\n![image](img/eq10-1.jpg)\n\n也就是说，对于每一个（行业、国家、因子分位数等）类别\
  \ `j`，分配效应是该类别中的主动权重（即投资组合权重 `w[j]^p` 与基准权重 `w[j]^b` 之间的差）。\n\n\n\n在实践中，任何连续变量都可以作为分类的依据。在对连续变量使用\
  \ Brinson 分析时，通常会根据排序后的因子的四分位数或五分位数形成类别，无论该因子是 `beta`、`EPS` 还是市值等。另一种常见的方法是根据 Fama–French\
  \ 因子模型的预期收益对证券进行排序，并根据这些预期收益形成类别（这在我们的“数据”部分中会有更详细的描述）。使用这种多变量模型来创建单变量排名，是在标准 Brinson\
  \ 框架内探索多变量归因的有效方法，并可以作为我们在本章稍后将开发的新型多变量归因方法的基准。\n\n### 10.2.3. 优化连续变量断点以实现系统归因最大化\n\
  \n如果所考虑变量与收益之间的关系在分类变量上是非单调的，或者在分类水平内不是恒定的（例如，如果影响仅限于解释变量值的前五分之一一），那么使用等分位数（或接近相等的分位数）的标准\
  \ Brinson 分析具有产生持续性选择效应的风险，这等同于缺乏具有经济解释性的业绩归因。\n\n由于没有理由期望在四分位数、五分位数或十分位数等方便组中出现剧烈的业绩差异，因此数据驱动程序可能是根据因子敞口划分股票的优越方式，使得划分既对应于实际业绩，又能在具有经济意义的基础上解释业绩。因此，给定投资组合在这些数据驱动分组中的主动权重将能够更好地解释投资组合的超额或欠额表现，而无需将收益的系统性部分分配给残差。\n\
  \n我们使用数据驱动方法创建类别的目标，是在我们的连续向量 `x` 内部选择最能解释投资组合主动收益的分组。这意味着我们希望选择分组，使得产生的残差接近于零。给定上述预期结构，我们可以将此目标重新表述为约束优化问题：\n\
  \n![image](img/eq10-5.jpg)\n\n`TRE²` 项在 `X` 上显然是非线性的，因此标准的线性模型并不适用。在这个巨大的解空间上进行暴力搜索从计算角度来看是非常昂贵的^(2)。我们问题的几个特征允许我们继续进行，减轻了计算负担。我们的方法灵感来自\
  \ Brieman *et al.* (1984) 首次引入的分类回归树 (`CART`) 方法。首先，在任何一个分支上，我们只允许根据其顺序排名来分割 `x`。其次，基于\
  \ `CART` 的算法是“贪婪的”；在树的每个分支上，我们不需要重新访问之前的节点。最后，我们将终端模式限制为四个，允许将基于机器学习的归因与简单的基于四分位数的评估进行比较。\n\
  \n将终端节点数量限制为四个——即将算法限制为四个分类组——也使得结果易于解释，特别是当分类过程中使用多个变量时。由于机器学习过程具有过度拟合数据的倾向，限制类别数量可以确保我们代表的是常见的系统性敞口，而不是少数具有相似特质性收益的股票。\n\
  \n将学习简化为这些维度，使得归因可以从系统配置效应的来源被于理解，并比较使用不同变量解释投资组合收益的优缺点。这里使用的过程可以总结如下：\n\n1. 1)\
  \ 从低到高对 `x` 变量进行排序；\n2. 2) 为 `x` 的每个不同值分配一个 `k` 断点；\n3. 3) 对于每个 `k`，创建一个具有两列的相应\
  \ `X[k]` 哑矩阵。如果该证券低于或等于断点，则第一列设为 `1`，否则为零。第二列的定义类似；\n4. 4) 对于每个 `X[k]`，定义 `TRE²`；\n\
  5. 5) 选择使 4) 最小的 `k` 断点；\n6. 6) 在每次分割内重复步骤 1–5，直到获得所需的组数 `J`。\n\n该过程的结果创建了一个哑矩阵\
  \ `X`，它在方便的结构中包含了最优分组。这种方法允许我们将连续变量划分为预定义数量的分组，这将产生一个尽可能接近投资组合总主动实际收益的配置效应。通过在步骤\
  \ 1–5 中并发循环多个变量，该过程很容易扩展到额外的 `x` 变量。\n\n对于每个变量，在每个时期，这使得可以将投资组合的主动收益分为两个部分：1) 来自所考虑分类方案的配置以及\
  \ 2) 收益的残差部分。对于给定的分组数量，分类方案的相对优越性将体现在标准差衡量的残差部分变异性较低，这自然会转化为收益配置部分变异性较高。\n\n## 10.3\
  \ 数据描述\n\n在研究中，我们使用了涵盖 2010 年 12 月至 2019 年 4 月的 Russell 1000 指数美国股市数据，这基本上包含了在美国上市最大的\
  \ 1000 只股票。潜在的候选变量包括学术研究中用于解释收益的常用因子——市值、`beta`、市净率 (B/M) 和动量。除了这些变量外，我们还考虑了价值的替代衡量方法——特别是收益率以及增长的复合指标。本研究中使用的所有变量均源自\
  \ `MSCI-Barra USE4` 风险模型，并代表在该特定时间点获得的每个变量的值。因此，不需要（通过常用的滞后结构）为了报告滞后或前瞻偏差而调整变量。使用来自单一公开的数据也使得能够容易复现本章的结果。\n\
  \n除了这些因子外，我们还使用 Fama–French 复合因子来解释证券收益^(3)。该复合因子是通过使用每个因子的实际多变量收益创建的。每个月，我们使用四因子多元回归模型估计实际的因子回报。这些因子回报随后被用于创建池中每只股票的复合四因子收益——这种收益实际上反映了每只股票纯归因于其因子敞口的系统性收益。在数据生成过程纯为这四个因子的世界中，多元化投资组合的收益将由该复合因子完全解释。这种方法的目的是评估机器学习方法在多大程度上可以与常用的多变量线性回归因子模型相比^(4)。\n\
  \n\n\n\n\n本章所考虑的投资组合由三个常用的指数组成，这些指数专门设计用于利用股票市场中三个著名的异常情况——`Russell 1000 value index`、`MSCI\
  \ USA minimum volatility index` 以及等权重的 `Russell 1000 index` 版本。这些指数捕捉了机构组合中最常见的目标异常情况：`value`（价值）、`beta`\
  \ 和 `market capitalization`（市值）。这些指数在构建过程上也存在差异。等权指数使用了一种非常简单的规则，并包含了母指数（`Russell\
  \ 1000`）中的所有股票。`Russell value index` 使用多变量筛选过程来剔除股票，并对剩余股票使用市值加权。`MSCI USA minimum\
  \ volatility index` 则使用基于风险的优化过程，其约束条件与市值加权指数相关。通过使用具有不同底层构建过程的指数，我们还能够评估本章所考虑的归因方案的稳健性。\n\
  \n## 10.4 结果\n\n我们使用相同的方法论分析了这三个指数中的每一个。对于每个指数，我们报告了可以通过四个分类水平解释的主动收益的百分比变异率。基准情况是在每个类别中使用相同数量的股票——本质上是形成等权四分位数投资组合。这与机器学习分类方案进行了对比，该方案分别在单变量和多变量的基础上进行应用。在两种机器学习情况下，分类类别的数量都限制为四个——这使得容易比较不同方案的优，而无需为使用更多类别时相关的额外自由度进行调整。我们分析中使用的相对成功指标是解释主动收益时间序列变异的能力——这通常被称为\
  \ `tracking error`（跟踪误差）或 `active risk`（主动风险）。\n\n不同指数的结果呈现在表 10.1、10.2 和 10.3 中。由于不同指数相对于\
  \ `Russell 1000`（市值加权市场组合）具有不同的跟踪误差，我们报告了由 `allocation effect`（分配效应）解释的主动风险百分比，而不是绝对水平。在每个表中，解释力最强的单变量被突出显示。对于所考虑的三个指数中的每一个，机器学习方法都能轻松识别出主动收益的主要驱动因素，因为它能够解释最高比例的主动风险，这证明了此类方法可以用于捕捉系统性的组合偏好。\n\
  \n等权 `Russell 1000` 投资组合的结果如表 10.1 所示。使用简单的四分位数投资组合（下文称为基准），`size`（市值）解释投资组合主动风险的能力最强。`Fama–French\
  \ composite factor` 对主动风险的解释并不优于简单的基于市值的评估。即使使用机器学习方法，也没有任何变量的威力超过 `size factor`；单一因子解释收益的能力接近\
  \ 97%。对于 `size factor`，机器学习方法产生了 29%、55% 和 82% 的平均分界点（切断点），而不是等权四分位数（即 25%、50% 和\
  \ 75% 的分界点）。除了每次只使用一个变量外，我们还考虑了在创建分类组时使用多个变量的情况。当使用带有 `Fama–French composite factor`\
  \ 的多变量方法时，等权组合几乎所有的主动风险（99%）都可以仅通过四个分类来解释。\n\n**表 10.1 *等权 Russell 1000 的分配效应***\n\
  \n| | Base case | ML case |\n| :--- | :--- | :--- |\n| Beta | 48.0% | 59.2% |\n\
  | B/M | 20.5% | 30.3% |\n| E/P | 16.0% | 35.0% |\n| Growth | 7.2% | 49.8% |\n| Momentum\
  \ | 34.1% | 50.5% |\n| Size | 83.3% | 97.0% |\n| FF 4 factor | 72.7% | |\n| Multivariate\
  \ | | 94.0% |\n\n`Russell value index` 获得了类似的结果，如表 10.2 所示。对于基准情况，`size`（市值）解释主动风险的能力最强。`Fama–French\
  \ composite factor` 对主动风险的解释并不优于简单的基于市值的评估。即使使用机器学习方法，也没有任何变量的威力超过 `size factor`；单一因子解释收益的能力接近\
  \ 97%。对于 `size factor`，机器学习方法产生了 29%、55% 和 82% 的平均分界点，而不是等权四分位数（即 25%、50% 和 75%\
  \ 的分界点）。除了每次只使用一个变量外，我们还考虑了在创建分类组时使用多个变量的情况。当使用带有 `Fama–French composite factor`\
  \ 的多变量方法时，投资组合几乎所有的主动风险（94.5%）都可以仅通过四个分类来解释。\n\n**表 10.2 *Russell value index 的分配效应***\n\
  \n| | Base case | ML case |\n| :--- | :--- | :--- |\n| Beta | 29.9% | 45.8% |\n\
  | B/M | 85.2% | 88.3% |\n| E/P | 41.6% | 56.2% |\n| Growth | 49.9% | 61.3% |\n|\
  \ Momentum | 37.7% | 50.5% |\n| Size | 5.6% | 9.6% |\n| FF 4 factor | 69.3% | |\n\
  | Multivariate | | 94.5% |\n\n`MSCI USA minimum volatility portfolio` 是唯一一个结合风险模型使用优化方法构建的组合，其结果如表\
  \ 10.3 所示。尽管该组合是使用多因子风险模型创建的，但一部分收益可以通过单一因子解释。对于基准情况，`beta` 因子解释了 74%，再次略优于 `Fama–French\
  \ composite factor`。仅用 `beta` 作为因子通过机器学习带来的改进超过了 10%，远大于其他两个指数。`beta` 的 19.4%、36.9%\
  \ 和 64.2% 的平均分界点暗示了最佳切断点，反映了低 beta 股票之间横截变异性更大的事实。该组合的主动风险为 2.79%。\n\n**表 10.3 *MSCI\
