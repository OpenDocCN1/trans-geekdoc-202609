  \ www.iste.co.uk/jurczenko/machine.zip*\n\n### 4.7.2. 优化策略（美国股票）\n\n---\n\n### 4.7.2.\
  \ 美国股票的优化策略\n\n在本节中，我们使用美国数据重复分析交易成本的影响。优化问题与 4.7.1 节中描述的相同，但：\n\n* 我们删除了货币和国家限制；\n\
  * 我们假设初始资金为 1 亿美元；\n* 于美国指数包含的成股更多，个股权重被更严格地限制在 1.5%。\n\n结果如图 4.29 所示。Macquarie\
  \ Alpha 模型本可以提供强有性能，正如扣除交易成本前的 IR 为 1.11 所示。然而，考虑到每月近 140% 的平均换手率，净 IR 仅为 0.87。交易成本对年化收益的影响为\
  \ 1.7%。\n\n![图 4.29. 美国优化策略的回测结果（无换手率限制）(来源：Macquarie Quantitative Strategy, Axioma,\
  \ 2019 年 1 月）](img/fig4-29.jpg)\n\n图 4.29。 *美国优化策略的回测结果（无换手率限制）（来源：Macquarie Quantitative\
  \ Strategy, Axioma, 2019 年 1 月)*\n\n机器学习模型的组合（“集成”）由于对技术指标和动量信号的暴露，往往会产生更高的换手率。虽然在交易成本之前它优于\
  \ Alpha 模型（其总 IR 为 1.26），但其净 IR 仅为 0.57。总收益和净年化收益之间的差距超过了一倍，达到 3.6%。\n\n在不同的机器学习模型中，基于树的技术如预期那样交付了最好的性能。它们也产生了最高的换手率。\n\
  \n\n\n\n\n通过限制交易量，可以产生更具吸引力的风险调整净收益，如图 4.30 所示。与欧洲部分一样，我们对投资组合的总转手实施了限制。\n\n![images/fig4-30.jpg](img/machine.zip)\n\
  \n**图 4.30。** *交易成本前后的转手限制的影响（美国数据）。ML = 机器学习（来源：Macquarie Quantitative Strategy,\
  \ Axioma, 2019 年 1 月）。此图的彩色版请参见 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n虚线描绘了总信息比（IR）与转手限制之间的关系。如预期所示，随着我们将限制从 160% 逐渐收紧到 80%，我们的机器学习模型性能有所恶化。然而，如橙色实线所示，净\
  \ IR 从 0.57（无限制情况）跳升到 0.9（120% 限制）。对于所有三个转手限制值，Alpha 模型和机器学习集成模型在扣除交易成本后产生了相似水平的风险调整性能。在\
  \ 120% 和 160% 的转手率下，组合机器学习模型均略占优。\n\n图 4.31 中的累计总收益图表明，机器学习集成模型和 Alpha 模型随时间推移会表现出相似的收益模式，但后者的波动会表现得更为剧，特别是由于\
  \ 2015 年的动量上涨和随后的崩盘导致的。\n\n本节对优化策略的分析得出了一些令人鼓舞的结果。尽管优化并没有显式针对交易成本，但机器学习模型能够扣除交易成本后，达到与我们的传统因子模型相似水平的性能。我们想强调的是，鉴于其强大的样本外表现，Macquarie\
  \ Alpha 模型是一个衡量任何策略的极具挑战性的基准。这些发现表明，机器学习模型对价格动量和技术因子的强敞口并没有阻止我们提出的模型在现实交易成本水平下产生显著超额收益。作者可以提供进一步证实此结果的稳健性检查。\n\
  \n![images/fig4-31.jpg](img/machine.zip)\n\n**图 4.31。** *转手限制下的成本后累计总收益（美国数据）（来源：Macquarie\
  \ Quantitative Strategy, Axioma, 2019 年 1 月。每月转手率上限为 120%。总收益按对数刻度绘制）。此图的彩色版请参见\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n## 4.8. 结论\n\n在本章中，我们研究了机器学习方法在利用大量公司特征预测股票收益问题上的潜在应用。我们的目标是在流动性市场中测试几项近期学术研究获得的结果，将分析扩展到欧洲股票，并衡量现实交易成本对性能的影响。\n\
  \n主要的实证结果可以总结如下：首先，机器学习技术具有强大的潜力，即使与具有成功样本外记录的专有模型（如我们的 Macquarie Quant Alpha 模型）相比，它们也有足够的预测能力来产生吸引人的风险收益比。特别是，我们得出结论，各种机器学习模型的组合（集成）在美国和欧洲的表现将优于我们的\
  \ Alpha 模型，达到相似的平均收益，但波动性较低。\n\n此外，我们发现（与学术论文中报告的实证结果一致），价格动量因子和技术指标主导了最优信号组合。基于资产负债表的公司基本面信息或其他移动较慢的信号在估计模型中似乎都没有起重要作用。总之，以每月频率更新的价格信息似乎是预测的主要来源。\n\
  \n然而，这并不意味着策略的 Alpha 被交易成本侵蚀了。在现实的优化设置中，我们证明在合理的交易成本水平下，机器学习驱动策略的净风险调整性能仍然具有吸引力。与我们的\
  \ Alpha 模型相比，提出的机器学习策略随时间推移具有相似的收益模式，但它们往往更平滑，且下撤不那么明显。这种较低的风险水平部分是因为在 2015-2016\
  \ 年的动量上涨及随后的崩盘期间，机器学习模型对价格动量的敞口比 Alpha 模型 小。\n\n我们的结果还表明，所选预测器的数量和相对权重随时间显著变化。特别是随着我们扩大窗口，选择在样本期结束时变得扩大。\n\
  \n最后，我们从这次练习中学到的非常重要的教训是，在更宽范围（例如 MSCI 世界指数）上训练机器学习模型，然后预测较小范围股票（例如 MSCI 美国或 MSCI\
  \ 欧洲）。如果模型性能与可用数据量呈正相关，这种方法将有助于模型学习。可以在特征集中轻松添加特定区域的虚拟变量，以考虑公司特征与股票收益之间关系可能的异质性。其次，可以仅使用价格动量因子和技术指标训练模型，以创建短期交易模型。在这种情况下，我们甚至可以使用周频率或日频率的数据。第三，模型权重的更新频率可以比本文更高（在本章中我们保持固定一年）。特别是，可以在每次预测之前训练模型，而不改变超参数。第四，可以更高效地构建模型集成，例如使用\
  \ H2O 提供的堆叠集成函数，或简单地增加神经网络集成中的元素数量。第五，神经网络的结构也可以进行校准，将神经元数量和层数加入超参数网格中。最后，可以使用各种无监督方法在将特征输入到监督模型之前先将其分组为不同的风格。\n\
