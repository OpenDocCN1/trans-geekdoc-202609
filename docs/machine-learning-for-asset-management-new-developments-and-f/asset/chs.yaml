  \n对于回测期间和给定的训练频率，每个跨度（horizon）都会训练多个模型。例如，假设我们运行一个跨越一年的回测，其中选择每三个月重新训练机器学习模型。训练是在训练之日回溯六年的窗口上进行的。在这一年的回测过程中，模型将重新训练四次。重新训练的模型数量等于相关跨度的数量。然后，当我们遍历再平衡日期（例如每周）时，我们使用一组训练结束时间尽可能接近但不超过再平衡日的模型。这组模型具有相同的训练窗口，但根据所使用的收益跨度，具有不同的标签。对于每周再平衡，相关的跨度是\
  \ 8 到 14 天的收益，以考虑到想法的陈旧性（aging）。然而，如果一个想法在下一次再平衡时已经池化了几天，则可以对其在池化期间的成功情况进行评估，并纳入额外信息。\n\
  \n## 5.4. 估计与稳健性\n\n在本节中，我们展示了机器学习模型估计的关键结果，以及模型针对我们所做的关键选择的稳健性分析。\n\n首先，我们讨论了特征的层次结构。我们采用了一种名为“排列重要性”（permutation\
  \ importance）的技术。该技术涉及改变输入数据并观察其对模型评分的影响，即衡量如果在随机打乱该列而保持其他所有列不变的情况下进行预测，模型的错误评分会变差多少。我们在图\
  \ 5.7 中展示了此项分析的结果。`DIRECTION_CODE` 被认为是最重要的特征。这是一个描述一个想法是做多（long）还是做空（short）的分类特征。考虑到\
  \ `DIRECTION_CODE` 的翻转会导致标签的翻转（即想法是否成功），这在某种是直观的。第二和第三重要的特征是“特定风险”和“特定收益率”。特定收益率本质上是股票的\
  \ alpha 能力，从某种意义上说，这正是我们的方法最初想要捕捉的。总来看，这种层次结构显示出与 Gu 等人 (2019) 得出的结论具有高度的一致性，最终有三种变量是重要的：动量、流动性和波动性。如图\
  \ 5.7 所示，这种严格排序对于模型参数的变化并不完全稳健。可以观察到特征之间相对重要性的翻转，但总体上出现在顶部和底部的组通常是一致的。\n\n![图 5.7.\
