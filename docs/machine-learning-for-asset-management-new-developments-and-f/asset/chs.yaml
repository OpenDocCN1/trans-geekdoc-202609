  ## 10.5 结论\n\n机器学习技术的应用在分离系统收益和离群收益方面具有不可估量的潜力。通过研究三个广泛使用的指数，我们证明了这种方法在传统策略中的适用性。由于仅需要组合权重、证券收益和因子库，该技术可以自动化地为大量组合捕捉系统性偏移。该方法解释主动收益的能力显然取决于策略的复杂性。有效解释选择部分（由特定而非因子驱动）的能力尚待确定，并将是未来研究的主题。\n\
