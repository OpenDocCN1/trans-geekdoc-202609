  \ 方法，我们还应用了 `LASSO`（最小绝对收缩和选择算子）。`LASSO` 的优势是可以同时进行变量选择和正则化，这可以提高预测准确性并减少过拟合。调优超参数\
  \ `λ` 控制 `L1` 惩罚的强度，它可以解释为所使用的收缩程度。该参数通过最小化验证集上预测的 `MSE`（均方误差）来选择。`LASSO` 回归之所以能减少过拟合并用于模型选择，是因为`L1`\
  \ 惩罚往往会导致系数为零，即某些特征在评估输出时被完全删除。按照 `LASSO` 的标准做法，我们在执行 `LASSO` 步骤后，排除掉被 `LASSO` 在最优\
  \ `L1` 惩罚水平下识别为无关的变量，重新运行 OLS。\n\n### 7.3.5. 随机森林模型\n\n随机森林模型是一种基于改进树学习算法的集成分类算法。它包含一个特征袋（feature-bagging）步骤，该基于随机选择特征子集。其思想是在不同的特征集上并行训练集成中的各种学习器，以降低它们之间的相关性并提高集成算法的准确性。\n\
  \n### 7.3.6. XGBoost 模型\n\n`XGBoost`（极端梯度提升）是梯度提升算法的一种实现。与随机森林类似，梯度提升是一种基于决策树的集成机器学习算法。遵循这种方法，进行顺序预测，其中后续的预测器从前一个预测预测器的错误中学习。因此，观测值在后续模型中出现的概率是不均等的，在前一个模型中误差最大的值在后续模型中出现最多。这就是该算法不同于随机森林的地方，后者的观测值是基于自助法（bootstrap）选择的，而不是基于之前模型的预测误差。该算法相对于随机森林的权衡在于，虽然两者都由于其集成特性减少了模型方差，但梯度提升还减少了偏差，尽管是以可能过拟合为代价。\n\
