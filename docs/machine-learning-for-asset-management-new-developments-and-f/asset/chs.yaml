  \ 5.5 的早期工作之后，有大量的文献跟进。该方法创建了数百或数千个决策树的集成。该方法的核心概念是“袋聚集法”（bagging）和“自助法”（bootstrapping）。后者指的是对原始数据集进行有放回的重采样，这是一个源于\
  \ Efron (1979) 及更早作品的旧概念。袋聚集法（或称自助聚合法）包含一个聚合步骤，以形成多数投票并得出最终预测。\n\n如果集成中多个模型的预测之间是不相关的，或者至多是弱相关的，那么组合多个模型的预测效果会更好。决策树使用贪心算法来选择分裂变量，该算法会最小化误差。因此，即使使用了袋聚集法，决策树也可能具有许多结构上的相似性，而在预测上具有高相关性。随机森林改变了子树的学习方式，使得所有子树产生的预测相关性更低。在分类回归树（CART）方法中，选择分裂点时，允许学习算法遍历所有变量和所有变量值，以选择最优的分裂点。\n\
  \n随机森林算法改变了这一过程，将学习算法限制在随机选择的特征中进行搜索。每个分裂点可以搜索的特征数量必须作为算法参数指定。每棵树都被允许使用随机选择的 `M`\
  \ 个变量。作为分类问题的经验法则，一个很好的默认值是：\n\n![image](img/eq5-2.jpg)\n\n在我们案例中，我们大约有 25 个变量，该值为\
  \ 5；然而，在任何情况下，它都是一个我们可以进行超参数调优的参数，类似于树的数量。集成许多重采样的决策树有助于减少它们的方差，产生在样本外泛化良好的、更稳定的估计器。随机森林很难过拟合，并且在不需要大量调优的情况下就能泛化良好。它们还具有额外的计算优势：它们是高度并行的，因此在更大数据集上的扩展性好得多。\n\
