  \n## 2.3.10. 重复交叉验证\n\n对于本研究部署的大多数算法，我们需要指定超参数。例如，在弹性网中，我们需要确定 `λ`。为了以数据驱动的方法确定这些参数，我们部署了重复交叉验证。交叉验证方法包括将训练数据划分为\
  \ k 个互斥且大小相等的子集。该过程通过对留出的训练数据进行迭代操作，应用于机器学习。然后通过对留出集取平均得出性能。\n\n在本研究中，我们利用重复交叉验证。这种交叉验证方法重复给定的次数并平均结果。通常，交叉验证重复\
  \ 30 次，以确定所有测试算法的超参数。一个模型的准确性因此通过对 45 个不同种子的留出样本进行平均得出的。\n\n## 2.4. 评估标准\n\n我们从统计和经济两个维度来评估性能。前者由传统的统计工具组成，如准确率、Kappa\
  \ 统计、曲线下面积 (AUC)、特异性和灵敏度。使用这些指标的目的是使模型之间的比较成为可能。注意，这部分没有包含决策成本。换句话说，这些指标没有考虑财务后果。从实践角度来看，这些指标是\
  \ `caret` 包的内置函数，曲线下面积使用 `glmnet` 包。\n\n经济指标包括年化收益、夏普比率、偏度、峰度、最大回撤和置信水平为 95% 的历史价值风险\
  \ (VaR)。这些指标使用 `PerformanceAnalytics` 包计算 (Peterson 和 Carl 2018)。\n\n注意统计和经济性能都是在样本外报告的，范围从\
  \ 2005 年 12 月 2 日到 2019 年 1 月 31 日。\n\n### 2.4.1. 统计性能\n\n为本研究使用的预测模型选择正确的性能指标对于评估机器学习算法适应投资问题至关重要。从这个角度来看，模型的整体准确率可以由正确分类的数量除以总实例数。同样，灵敏度和特异性可以从以下方程得出（Bradley\
  \ 1997）：\n\n\\[2.13\\] ![image](img/eqn2-13.jpg)\n\n其中 `TP` 和 `TN` 分别表示真正性和真阴性，而\
  \ `FP` 和 `FN` 分别表示假正性和假阴性。\n\n直观地说，我们案例中的灵敏度表示在所有 SPY 上涨的时期中，机器学习算法能够识别出下一阶段上涨的比例。灵敏度值小意味着投资者面临巨大的机会成本。\n\
  \n\n\n\n为了调和这两者，通常会绘制不同截断概率下灵灵敏度和特异性的曲线。这形成了受试者工作特征（ROC）曲线，通过梯形积分法可以从中推导出 `AUC`。`AUC`\
  \ 是一个标量值，代表随机选择的正样本被正确分类的概率，该概率大于随机选择的负样本的概率（Ben-David 2008）。`AUC` 值为 1 意味着机器学习算法能够分别识别所有的正事件和负事件。相反，如果算法无法区分正事件和负事件，我们预期\
  \ `AUC` 为 0.5。此外，`AUC` 值为 0 表示机器学习算法将正事件预测为负事件，将负事件预测为正事件。对于我们的分析而言，`AUC` 值越接近 1，算法的统计性能就越好。\n\
  \n在类别存在极度不平衡的情况下，我们应该对基于准确率得出的结果保持谨慎。例如，假设有 95% 的目标变量被分配给某一类。在这个例子中，一个将所有输入分配给该类别的模型将产生一个准确率为\
  \ 95% 的分类器，但这并不能反映模型预期的分类能力。\n\n为了调整随机分配引起的问题，我们使用了 `Cohen’s kappa`（Cohen 1960）。这是一个指标，代表了由于随机分配到某一特定类别而进行修正后的准确率。更正式地说，`Cohen’s\
  \ kappa` 通过以下方程计算：\n\n\\[2.14\\] ![image](img/eqn2-14.jpg)\n\n其中 `ρ`[0] 表示准确率，`ρ[c]`\
  \ 表示由于偶然引起的一致概率，其定义如下：\n\n\\[2.15\\] ![image](img/eqn2-15.jpg)\n\n其中 `ρ[j.]` 和 `ρ[.j]`\
  \ 分别行边缘概率。\n\n### 2.4.2 财务性能\n\n我们考虑了几个指标来衡量基于预测的投资算法的财务性能。根据公式 [\\[2.16\\]](#c02.xhtml#eqn2-16)\
  \ 的每日投资组合收益时间序列，我们计算年化收益率（AR）如下：\n\n[\\[2.16\\]](#c02.xhtml#ieqn2-16) ![image](img/eqn2-16.jpg)\n\
  \n其中 `AR` 表示年化收益率，![images](img/ieq2-14.jpg) 是时间 `t` 来自公式 \\[2.17\\]](#c02.xhtml#eqn2-17)\
  \ 的每日收益，`n` 是观测期，在本研究中等于分析的 3,322 天。\n\n作为风险调整后收益，我们计算年化夏普比率（Bacon, 2008）如下：\n\n\
  [\\[2.17\\]](#c02.xhtml#ieqn2-17) ![image](img/eqn2-17.jpg)\n\n其中\n\n\\[2.18\\]\
  \ ![image](img/eqn2-18.jpg)\n\n最大回撤（MDD）代表了投资者在投资期间可能遭受的最大损失。该值通过策略累计收益的最高值与最低值之间的差值得出。此外，还将分析代表投资组合收益\
  \ 5% 分位数的负值的历史 VaR。此外，换手率和等效交易成本将纳入分析，以从更具实践性的角度识别策略的实用性。这两个指标在交易成本文献中被常用（参见例如，DeMiguel\
  \ *et al*, 2013）。注意，换手率仅代表所持仓的变化，而等效交易成本是一个假设性衡量标准，使得基于机器学习的投资组合收益等于包含交易成本的基准收益。因此，它代表了策略为了保护与表现最好的基准相同的年化收益而允许的最大交易成本。最后，换手率将通过除以年数来实现年化。\n\
  \n### 2.4.3 显著特征\n\n支持向量机、C5.0、随机森林和多层感知器都是高度非线机器学习算法。非线性在灵活性方面是一个优势，但也导致了其决策背后底层原因的不透明性。解决这一问题的方法是利用\
  \ `LIME` 框架，该框架最初由 Ribeiro *et al.* (2016) 开发，用于从“黑箱”中揭示重要特征。\n\n`LIME` 代表局部可解释模型无关解释（Local\
  \ Interpretable Model-agnostic Explanation）。它包含一个通过线性近似局部描述给定机器学习算法的框架。在二分类背景下，近似是通过带有\
  \ lasso 正则化的逻辑回归完成的。局部描述表明每个实例都是被单独分析的，并使用所分析实例的变体来制作局部近似。这是通过向特征添加噪声来研究其对预测的影响实现的。注意，`LIME`\
  \ 框架的优势在于它是模型无关的，提供独立于所部署机器学习算法的易理解的解释^(8)。\n\n该实现的输出说明了每个特征对所分析实例预测的影响或贡献。同样，该框架展示了输入特征的变化如何影响预测的变化。为了我们的研究，我们分析了表现最好的模型，在该模型中我们保留了\
  \ 90% 的数据集用于训练，其余部分用于敏感性测试。每个单独的预测都经过线性局部近似，最终进行平均并在第 2.5 节中给出。\n\n## 2.5 结果与发现\n\
  \n在本节中，我们讨论我们的主要结果和发现。我们从基础摘要开始讨论，随后是机器学习策略的统计和财务性能。最后以对最佳算法特征的调查结束本节。\n\n### 2.5.1\
  \ 数据的描述性统计\n\n作为数据的初步视角，我们在图 2.2 中绘制了特征空间。图 2.2 使用箱线图说明了每个特征的分布。注意，每个特征的值都经过了标准化，使得均值为\
