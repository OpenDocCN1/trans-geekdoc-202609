  \n位置参数 `μ` 由方程 11.13 给出。与线性回归一样，我们将交易成本的大小取决于买卖差、经过波动率缩放的参与率以及根据元订单方向符号并经过波动率缩放的投资者订单不平衡。然而，我们没有假设元订单规模符合平方根函数，而是由我们估计的指数\
  \ `γ` 突出的幂律。\n\n估计准确性是市场状况、执行算法的速度和持续时间以及寻求流动性的激进性的函数。执行缺口的异方差通过让拉拉斯分布的标准差 `b` 取决于股票属性（价差和波动率）、元订单特征（参与率）以及市场状况（绝对不平衡）来考虑：\n\
  \n\n\n\n\n表 11.5 总结了参数后验分布的前两个矩量以及 2.5% 和 97.5% 分位数。首先，我们注意到订单规模项的指数略低于平方根 ![images](img/ieq11-22.jpg)，这与\
  \ Bacry 等人 (2015) 的之前的发现一致，他们使用了欧洲某家经纪商执行的专有数据库。文献中通常记录了指数在 0.4 到 0.5 之间的幂律分布（Gomes\
  \ and Waelbroeck 2015 以及 Brière 等人 2019）。相对于位置项的参数与 OLS 回归估计的参数一致。如预期的那样，截距参数为零，订单规模项和订单流向不平衡项的系数与\
  \ OLS 回归估计的系数相似。仅买卖差差的系数存在显著差异。除了股票波动率系数外，拉普拉斯分布的尺度参数都很小。这证明了异方差的主要贡献者不是订单规模，而是股票波动率，这与\
  \ Capponi 和 Cont (2019) 的发现一致，他们认为在给定股票波动率水平和执行持续的情况下，订单规模对交易成本的影响很小。\n\n![表 11.5.\
  \ 贝斯推断：执行缺口依赖性](img/ieq11-30.jpg)\n\n表 11.5. 贝斯推断：执行缺口依赖性\n\n## 11.6. 预测执行缺口\n\n\
  我们收集不同的变量依赖块以构成图 11.6 中的贝斯网络。参数 `μ`、`b`、`α[imb]`、`β[imb]` 通过 Hastings-Metropolis\
  \ 算法通过贝斯推断进行估计。一旦在 70% 的母订单上校准了网络，我们就使用它根据母订单和股票特征推断净订单流不平衡的潜变量，并估计样本内（训练集）和样本外（测试集，剩余\
  \ 30% 的母订单是算法尚未看到的）的订单执行缺口。表 11.6 展示了线性回归和贝斯网络在样本内样本外的预测结果。对于线性回归，我们比较了不包含订单流不平衡的模型（方程\
  \ [[11.3]](#c11.xhtml#eqn11-3)，第 1 列）和包含订单流不平衡的模型（方程 [[11.5]](#c11.xhtml#eqn11-5)，第\
  \ 2 列）。在最后一个模型中，实现的不平衡是实时观测的，这在实践中无法实现，但可以作为基准案例。我们随后展示了三个贝斯网络的结果：第一个网络（第 3 列）从未见过不平衡的信息，无论是在训练阶段还是预测阶段。从这个意义上说，它与表\
  \ 11.6 第一列中的第一个线性回归（当不平衡不可用时使用 OLS）具有可比性。第二个网络（第 4 列）使用不平衡信息训练。一旦这些信息被网络边的条件概率捕获，就可以在不使用不平衡的情况下利用网络。最后一个网络（第\
  \ 5 列）在训练和测试阶段都拥有关于不平衡的完整信息，与第 2 列显示的 OLS 回归相似。添加不平衡信息提高了预测准确性，无论对于 OLS 还是贝斯网络都是如此。在样本内，它将两个模型的\
  \ R² 从 0.52% 增加到 1.77%，并降低了预测误差（RMSE 从 1.67% 降至 1.66%，MAPE 从 98.74% 降至 98.48%）。对于相同的信息集（无论不平衡是否可观测），贝斯网络的准确性与\
  \ OLS 相同。然而，贝斯网络的绝对平均误差更小（可用时为 -0.43 bps，不可用时为 -1.41 bps）。在样本内，当所有解释变量均可用时，贝斯网络相比简单回归的优势有限。在样本外，当不平衡不可用时（图\
  \ B，第 1 和第 4 列），贝斯网络与线性回归相似（平均误差为 0.08 bps 对比 0.16 bps，但 RMSE 均为 1.39%，R² 均为 0.38%，且\
  \ MAPE 略高，99.3% 对比 99.0%）。但当不平衡可用时（图 B，第 2 和第 5 列），贝斯网络在所有标准上的预测准确性都优于线性回归（R² 1.20%\
  \ 对比 1.10%，平均误差 -0.43 bps 对比 -1.08 bps，RMSE 1.388% 对比 1.389%，且 MAPE 99.41% 对比 99.57%）。\n\
  \n![表 11.6. 贝斯网络与标准 OLS 的性能对比](img/tab11-6.jpg)\n\n\n\n\n\n表 11.7 提供的结果与表 11.6 相似，但针对的是十个订单规模的分位数，以及使用了关于不平衡的部分或全量信息的贝叶斯网络。我们根据训练集的订单规模，将训练集和测试集划分为\
  \ 10 个箱。第一个箱包含小订单，占比低于日成交量的 0.01%，而最后一个箱包含极大订单，占比高于日成交量的 4.34%。我们在信息可用性的三种配置下（订单流不平衡完全可用、部分可用或不可用）评估了贝叶斯网络的准确性。与直觉一致，我们发现，当投资者持有较大订单时，推断出的订单流不平衡分布更为准确。在给定小订单的情况下，订单流不平衡的后验分布是一个对称的\
  \ U 型函数（图 11.9）。在理想情况下，它略微偏斜（正偏或负偏），取决于订单的方向。因此，投资者的交易规模越大，其对订单流不平衡的估计提供的信息就越多，结果就是对执行缺口（implementation\
  \ shortfall）的预测越准确。我们观察到，无论信息可用性的配置如何（部分或全部），无论样本内还是样本外，从第七个箱开始，`R²` 稳步增长。例如，在不平衡部分可用的情况下，样本内交易成本的估计从第七个分位数的\
  \ 0.18% `R²` 增加到第十分位数的 2.13%，而较小订单规模分位数的 `R²` 相对较小（前四个箱从 –0.03% 到 0.09%）。事实上，对于小订单规模，市场影响非常有限，并消失在市场噪声中。尽管贝叶斯网络是使用订单流不平衡的信息训练的，但如果投资者只交易小订单，那么在使用其交易属性时它并没有优势。换句话说，在执行小订单时，很难对订单流以及交易成本做出良好的先验预测。然而，我们看到，随着投资者自身订单规模的增大，关于投资者订单的信息对于汇总净订单流变得更有信息价值。这与近期机构投资者执行交易集中在少数交易台的趋势相吻。因为大型交易台对当天投资者的订单流不平衡有更准确的掌握，它可以更准确地评估预期交易成本，并可能利用这些信息设计更优的执行方案。还要注意，`RMSE`\
  \ 并没有下降，因为订单规模较大的箱中，具有较大执行缺口的订单很少，这增加了该箱的平均交易成本。这从平均与中位实现交易成本之间的差异中可以看出（第十个箱样本内为\
  \ 30.64 bps 对比 24.79 bps，第一个箱为 1.89 bps 对比 1.67 bps）。相反，`MAPE` 没有受到这种偏差的影响，随着订单规模的增加而变小。\n\
  \n![表 11.7. 给定订单规模下贝叶斯网络的性能](img/tab11-7.jpg)\n\n**表 11.7.** *给定订单规模下贝叶斯网络的性能*\n\
  \n### 11.6.1. 结合交易后成本和市场条件对投资者订单流不平衡的推断\n\n投资者的净订单不平衡是一个潜变量，因此资产经理在执行交易前是无法观测的。他们对市场压力的最佳预测是在观察到自己的交易决策后推断出的平衡值。然而，由于群体效应，他们的决策通常与其他投资者的交易一致，但可能与其同行的实际交易情况有所不同。我们的贝叶斯网络模型的兴趣点之一是，在已知其交易成本的情况下，它可以被用于恢复在投资者订单执行期间盛行的汇总订单流不平衡情况。在收到交易成本分析报告后，投资者可以使用校准后的贝叶斯网络更新其对执行期间投资者不平衡的信念。\n\
  \n我们探讨了两个案例作为示例。在第一种情况下：投资者卖出股票 `sk = –1`，参与率较小 `Qk/ADVk = 0.01%`。由于交易规模很小，其订单对市场压力提供的信息有限，因此他们使用贝叶斯网络得出的最佳估计是一个略向负值偏斜的均值为\
  \ –0.10 的 U 型分布（图 11.10 左侧面板的蓝色分布）。意外的是，结果的交易成本巨大 `ISk = 3.02%`，因为不平衡非常大且为负 `Imbk\
  \ = 0.94`。投资者可以更新其对执行期间真实分布的信念。在纳入实现交易成本后，后验分布赋予 –1 处的数值更高的概率（左侧面板的橙色线）。平均后验不平衡分布为\
  \ –0.17（表 11.8）。在第二种情况下：投资者决定大量抛售某只股票，`Qk/ADVk = 31.8%`。这通常发生在市场恐慌期间，其他投资者也在大量出售。因此，其先验分布向左高度偏斜（![images](img/ieq11-30.jpg)[Imb]\
  \ = –0.40，图 11.10 右侧面板的蓝色分布）。虽然投资者预期会有高交易成本，但他运气很好，逆了汇总订单流（Imbk = 0.94），并受益于 2.6%\
  \ 的价格改善。纳入此信息后的后验分布显示在右面板（橙色线），数值为 0.05。\n\n![图 11.10. 净订单流不平衡的贝叶斯推断。需此图彩色版本，请访问\
  \ www.iste.couk/jurzenko/machine.zip](img/fig11-10.jpg)\n\n**图 11.10.** *净订单流不平衡的贝叶斯推断。需此图彩色版本，请访问\
  \ [www.iste.couk/jurzenko/machine.zip]*\n\n![表 11.8. 订单流不平衡的贝叶斯推断](img/ieq11-37.jpg)\n\
  \n**表 11.8.** *净订单流不平衡的贝叶斯推断*\n\n## 11.7. 结论\n\n在本章中，我们使用贝叶斯网络结合 ANcerno 数据（资产经理指令数据库）对美国股票市场的交易成本进行建模。我们的主要动机是利用对交易成本至关重要的变量——*净订单流不平衡*。该变量并非所有市场参与者都能观测到。贝叶斯网络为使用*潜变量*建模交易成本提供了新视角，即在模型使用时并不总是已知的，但在学习过程中可以部分观测的变量。\n\
  \n\n\n\n\n# 引言\n\n贝叶斯网络不仅能够估计期望值，还能估计给定变量的整个概率分布。因此，它们能够估计其估计残差的方差。由于误差项的异方差性，市场影响模型和交易成本估计的\
  \ `R²` 通常非常小。从业者中的一个普遍观点是，微小的机械价格压力影响正在消失在“市场噪声”（即价格创新）中。我们在模型中证实了这一直觉，通过允许交易成本预测的准确性取决于市场状况和投资者的订单特征。我们发现，解释残差方差的主要变量是股票波动率，系数为\
  \ 0.78。\n\n最后但同样重要的是，我们展示了贝叶斯网络在交易成本预测方面的几个优势。首先，即使潜变量（在我们的案例中，为开盘时机构订单的失衡）无法观测，估计也依赖于其与其他观测变量之间预先捕获的关系（例如投资者待执行订单的大小和方向）。这使得模型能够比标准模型（例如\
  \ `OLS`）提供更好的预测。其次，我们证明了随着投资者必须执行的元订单规模增大，估计变得更加准确，因为元订单越大，对订单流失衡的估计就越准确。这为负责执行大量或大型投资者订单的大型交易台提供了信息优势，因为他们对汇总失衡有更好的整体把握。这一发现与当前市场实践的演变一致。小型资产管理公司越来越多地利用大型交易台的服务以从这些信息中受益，导致了近期机构投资者订单集中在少数几个交易台上。最后，这些模型可以使用贝叶斯推理推导出潜变量的期望分布。我们展示了一旦观察到最终交易成本，向贝叶斯网络询问其他投资者在开盘或收盘时大订单的期望分布是可行的。\n\
  \n贝叶斯网络是处理部分信息非常有前景的模型。它们对于“替代数据集”可能特别有价值，例如航空公司活动、网络流量或资金流，这些数据通常提供一小部分交易的详细信息。它们很难用于不接受缺失值的标准模型。贝叶斯网络在结构上对缺失变量与已知变量之间的关系建模。它们可以自然地填补这一空白。\n\
