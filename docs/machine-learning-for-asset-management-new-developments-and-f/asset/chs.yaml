  \n![表 11.1. 交易成本模型](img/ieq11-3.jpg)\n\n**表 11.1.** 交易成本模型\n\n这三次回归的结果如表 11.1 所示。在第一次回归中，买卖价差项和订单大小项![images](img/ieq11-6.jpg)的系数分别为\
