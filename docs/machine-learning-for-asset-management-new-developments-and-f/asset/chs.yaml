  \n### 7.4.3 变量重要性\n\n在本节中，我们讨论了上述模型所使用的不同变量的重要性，以及这些变量如何影响模型性能。为此，我们使用了两种解释技术。第一种是名为\
  \ `gain` 的标准解释方法。第二种是 `SHAP` 值，这种方法在过去两年中广受欢迎，并且是唯一符合博弈论考虑的方法。我们参考了 Chew 等人 (2019)\
  \ 中近期应用 `SHAP` 值解释 `XGBoost` 预测性能的做法。\n\n`gain` 定义为考虑给定特征的所有分裂后损失函数的总减少量。如果某个特征在整个树中都能产生损失减少，则被认为是相关的。图\
  \ 7.6 绘制了 `XGBoost` 的平均增益特征重要性。我们看到历史风险指标（如历史 beta 和标准差）占据主导地位。\n\n![图 7.6. XGBoost\
  \ 的特征重要性](img/fig7-6.jpg)\n\n**图 7.6.**](#c07.xhtml#ifig7-6) *XGBoost 的特征重要性*\n\n\
  图 7.6 显示了使用 `XGBoost` 模型进行预测时增益特征重要性的平均值。我们观察到历史 beta 的 `gain` 数量级大约是任何其他特征 `gain`\
  \ 的五倍。\n\n### 7.4.4 SHAP 值\n\nLundberg 和 Lee (2017) 提出了一种名为 SHapleyAdditive exPlanation\
  \ (`SHAP`) 值的创新解释模型，它在理论上允许我们以可靠且稳健的方式解释机器学习预测。我们将解释其工作原理，并将该技术进一步应用于我们对 beta 的\
  \ `XGBoost` 预测，该扩展可以在树集成上高效运行。我们获得了整个时间范围内每个预测的 `SHAP` 值，并提出了不同的可视化框架，为算法如何预测 beta\
  \ 提供了更好的见解。\n\n为了理解 Shapley 值，假设一个有 `N` 个玩家的博弈，其中 `S` 是 `N` 个玩家的子集。令 `v(S)` 为这 `S`\
  \ 个玩家为游戏带来的价值。当玩家 `i` 加入 `S` 玩家时，玩家 `i` 的边际贡献为 `v(S ∪ {i}) − v(S)`。如果我们对联盟可以形成的所有不同排列的贡献取平均值，就玩家\
  \ `i` 的正确贡献。因此，特征 `i` 的 Shapley 值定义为：\n\n[\\[7.1\\]](#c07.xhtml#ieqn7-1) ![image](img/eqn7-1.jpg)\n\
  \n[公式 [7.1]](#c07.xhtml#eqn7-1) 后的后的直觉是：特征的 Shapley 值是模型中有该特征和没有该特征时预测的差异。使用组合的原因是模型评估特征的顺序会影响其预测，即我们在树的某一点使用该特征分裂树。\n\
  \n得于 Lundberg 和 Lee (2017) 近期的贡献，可以近似 Shapley 值并以行的计算复杂度计算它们。基于这些见解，Lundberg 等人\
  \ (2018) 引入了一种运行时间 `O(TLD²)` 的树方法，其中 `T` 是树的数量，`L` 是任何树的最大叶子数，`D` 是任何树的最大深度。在实践中，这是通过递归跟踪流入每个树叶子的所有可能子集的比例来实现的。\n\
  \n我们使用 `SHAP` Python 库计算 `SHAP` 值。由于 `SHAP` 是局部方法，我们在进行单个预测时计算每个特征的重要性。每个观测值的每个特征获得一个\
  \ `SHAP` 值。由于我们使用扩展窗口，每个预测的 `SHAP` 值数量随时间增加。\n\n为了图表的可解释性，`SHAP` 值一代表 100%。\n\n\
  ### 7.4.5 特征重要性的总体水平\n\n图 7.7 提供了每个特征重要性的视觉表示。我们选择了前 20 个特征并按 SHAP 重要性对其进行排序。该图显示\
  \ beta 在高时（红点）有正面影响，在低时（蓝点）有负面影响，这意味着模型正确捕获了历史 beta 与实现 beta 之间的线性关系。\n\n![图 7.7.\
