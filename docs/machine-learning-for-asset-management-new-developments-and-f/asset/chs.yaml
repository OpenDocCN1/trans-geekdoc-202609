  \ Harvey *et al.* 2016），因此纳入 [1.19]](#c01.xhtml#eqn1-19) 的可能预测变量数量 *J* 很大。与时间序列背景一样，[1.19]](#c01.xhtml#eqn1-19)\
  \ 的传统估计容易过拟合。\n\n\n\n随时间对[方程 [1.20]](#c01.xhtml#eqn1-20) 中的 OLS 系数估计进行平滑处理是常见做法（例如\
  \ Lewellen 2015；Green *et al.* 2017）。然而，这对于缓解过拟合似乎是不够的。为了证明，我们使用了从 1980:01 开始的 84\
  \ 个公司特征数据来预测横截股票收益率^(18)。这些公司特征与 Lewellen (2015)、Green *et al.* (2017) 以及 Freyberger\
