  \n## 3.4. 计量经济框架\n\n决策者感兴趣的是基于 `p` 维预测因子 `x` 预测某些感兴趣的量 `y`，这些因子在*先验*上都是相关的，但其实际预测能力存在不确定性。传统方法是如下形式的一般时间序列回归\n\
  \n```\n[\\[3.1\\]](#c03.xhtml#ieqn3-1) ![image](img/eqn3-1)\n```\n\n其中 `β` 是 `p`\
  \ 维回归系数，`ϵ[t] ~ π(0, σ²)` 其中 `σ²` 是标量方差。向量 `x[t]` 可能包含虚拟变量和外生预测因子，以及目标变量 `y[t]`\
  \ 的滞后项。尽管这种线性预测框架非常简单，但对于金融经济学家和从业者来说可能仍然是基准。\n\n在许多重要的金融应用中，用于决策的向量 `x[t]` 维度很大，以至于无法使用普通最小二法（OLS）或极大似然法。事实上，至少从*先验*来看，这些因子都可能提供信息。在许多情况下，我们很容易陷入\
  \ `p/T` 比例迅速接近 1 的局面，这反过来会导致 OLS 等估计量过拟合。也就是说，面对大量的预测因子和较少的自由度，无偏估计量（如 OLS）往往具有很大的方差。在这种情况下，通过对模型进行收缩和正则正则化引入偏差有助于获得更低的外样本均预测误差（MSPE）。\n\
  \n出于如此，惩罚回归方法如 lasso（Tibshirani 1996）、岭回归（Hoerl and Kennard 1970）和弹性网（Zou and Hastie\
  \ 2005）相继提出。惩罚回归的核心思想是在损失函数的最小化中添加惩罚项，其显式目标是将小系数收缩至零，同时保持大系数不变^(8)\n\n```\n[公式 2\
  \ 内容]\n```\n\n损失函数通常表示为残差平方和，即![images](img/ieq3-13.jpg)其中***y*** = (*y*[1], …,\
  \ *y[T]*)′ 和 ***X*** = (*x*[1], …, *x[T]*)′。根据惩罚项的形式，回归系数可以被正则化并收缩至零、完全设为零，或者两者的结合。在[公式\
  \ [2]](#c03.xhtml#eqn3-2)中概述的惩罚最小化问题可以通过特定的先验概率转化为贝叶斯框架，具体取决于所需的惩罚类型。形式上，考虑给定预测因子的数据以下采样分布\n\
  \n```\n[\\[3.3\\]](#c03.xhtml#ieqn3-3) ![image](img/eqn3-3.jpg)\n```\n\n\n\n\n其中\
  \ `1` 是大小为 `T` 的全 1 向量，`II[*p*]` 是 `p` 维单位矩阵，且 `σ²` ~ `π` (`σ²`) `dσ²`。贝叶斯惩罚回归可以表示为一个分层模型，其中采样分布\
  \ [\\[3.3\\]](#c03.xhtml#eqn3-3) 与回归系数的一组特定先验分布相结合。更具体地说，先验分布的统计表示是从正态分布的尺度混合中构建的，即对高斯分布在一个通用的混合分布上进行“混合”或平均（例如，参见\
  \ Andrews and Mallows 1974），\n\n\\[3.4\\] ![image](img/eqn3-4.jpg)[\\[3.5\\]](#c03.xhtml#ieqn3-5)\
  \ ![image](img/eqn3-5.jpg)[\\[3.6\\]](#c03.xhtml#ieqn3-6) ![image](img/eqn3-6.jpg)\n\
  \n注意，对尺度参数 `σ² > 0` 进行条件限制对于保证后验分布的唯一性至关重要（参见 Park and Casella 2008）。超参数 `τ² > 0`\
  \ 和 ![images](img/ieq3-14.jpg) 决定了施加回归系数的稀疏性类型。特别是，`τ²` 是*全局*收缩参数，控制率参数 `β` 的整体收缩量。另一方面，超参数\
  \ ![images](img/ieq3-14.jpg) 对应于*局部*收缩组件，决定了分别应用于每个回归系数的收缩量。\n\n有趣的是，用正态尺度混合来表述惩罚回归不仅允许进行非常高效的计算，还清晰地展示了采用不同惩罚项的方法之间的理论差异和相似性。\n\
  \n### 3.4.1. 收缩先验\n\n通过采用贝叶斯方法，惩罚参数被视为具有自身先验分布的随机变量。在本节中，我们为不同类型的惩罚提供了[方程 \\[3.5\\\
  ]](#c03.xhtml#eqn3-5)–[\\[3.6\\]](#c03.xhtml#eqn3-6)中列概述的分层先验的具体形式。我们使用*收缩先验*一词来强调这些先验分布旨在将小效应收缩至零。接下来，我们将逐个描述每个先验。范围内，在没有先验专家知识的情况下，我们假设全局收缩参数\
  \ `τ²` 符合分层先验（例如，参见 Makalic and Schmidt 2015），如下：\n\n![image](img/eq3-6.jpg)\n\n\
  其中 `ξ > 0` 是混合参数，`IG (a, b)` 是形状和尺度参数分别为 `a` 和 `b` 的逆-Gamma 分布^(9)。\n\n#### 3.4.1.1.\
  \ 岭 (Ridge)\n\n岭先验对应于仅含全局收缩参数 `τ²` 的正态混合先验，即对于 `j = 1, …, `p`，`λ[j] = 1`，这意味着没有考虑特定回归器的局部收缩（例如，参见\
  \ Hsiang 1975），即：\n\n[\\[3.7\\]](#c03.xhtml#ieqn3-7) ![image](img/eqn3-7.jpg)\n\n\
  在实践中，岭回归通过对其系数的大小施加惩罚来收缩 beta 系数^(10。通过实施大小限制，岭回归缓解了线性回归模型中预测变量可能高度相关的担忧。事实上，当预测变量高度相关时，标准的\
  \ OLS 系数可能无法很好确定，因为给定变量上的大正 beta 可能会被相关对上同样大的负 beta 所抵消。\n\n#### 3.4.1.2. Lasso\n\
  \nLasso 是一种与岭类似的收缩回归方法，但存在重要区别。与岭回归不同，惩罚项的性质可以将某些系数收缩到恰好为零。在这方面，岭是一个具有解析解的稠密模型，而\
  \ lasso 是一个没有解析解的稀疏模型（参见第 3 章 第 69 页，Friedman *et al.* 2001 的综合讨论）。标准的 lasso 惩罚项是对回归系数的\
  \ `L[1]` 惩罚。\n\n在提出 lasso 算法时，Tibshirani (1996) 注意到 lasso 惩罚等同于拉普拉斯先验下的后验模式估计。Park\
  \ and Casella (2008) 基于此直觉，建议一个一致的先验可以定义为具有指数混合密度的正态尺度混合，即：\n\n[\\[3.8\\]](#c03.xhtml#ieqn3-8)\
  \ ![image](img/eqn3-8.jpg)\n\n使用此类先验后，后验模式估计与 `L[1]` 惩罚项下的估计相似^(11)。贝叶斯 lasso 相比于频率派方法的关键优势在于，惩罚是通过全局收缩参数\
  \ `τ²` 和局部（即特定回归器））收缩参数共同完成的。因此，贝叶斯 lasso 将惩罚回归表示为一种全局-局部收缩估计量。这反过来增加了模型的灵活性。\n\n\
  #### 3.4.1.3. 弹性网 (Elastic net)\n\nLasso 的流行源于它能够通过将 beta 收缩到恰好为零来执行明确的选择，而岭回归则不同，更多是正则化作用。然而，标准形式的\
  \ lasso 并不能免于缺陷。第一，它无法处理 `p > T` 的框架；第二，当一组预测变量高度相关时，lasso 往往只选择几个，尽管其他也有预测内容；第三，Polson\
  \ 和 Scott (2010) 显示 lasso 惩罚可能导致过度收缩，即它不具备所谓的“神谕属性”（oracle property），也就是说 lasso\
  \ 选择的模型并不一定是真实的生成过程。在这方面，Fan and Li (2001) 以及 Zou (2006) 显示 lasso 的神谕属性取决于某些条件。这些缺陷推动了\
  \ lasso 变体的发展，例如弹性网。弹性网由 Zou 和 Hastie (2005) 最初提出，缓解了与 `p > T` 和存在相关回归相关的问题。Li *et\
  \ al*. (2010) 显示弹性网的收缩先验可以表示为\n\n\\[3.9\\] ![image](img/eqn3-9.jpg)\n\n该先验可以重写为分层形式：\n\
  \n[\\[3.10\\]](#c03.xhtml#ieqn3-10) ![image](img/eqn3-10.jpg)\n\n其中 ![images](img/ieq3-15.jpg)\
  \ 是对角矩阵，元素为 ![images](img/ieq3-16.jpg)注意在这种情况下，`β` 不独立于 ![images](img/ieq3-15.jpg)，因为它出现在协方差矩阵中。然而，该项以“高斯”组件的形式进入后验的指数，因此\
  \ Gibbs 采样器仍然直观（参见附录 3.8）。\n\nLi *et al*. (2010) 显示相应的后验模式估计等于从经典弹性网惩罚得到的估计。更具体地说，这两个参数\
  \ ![images](img/ieq3-17.jpg) 分别决定了 lasso 和岭惩罚的影响。贝叶斯方法的优势在于参数 ![images](img/ieq3-17.jpg)\
  \ 可以联合估计，而在标准的频率派方法中，需要执行顺序交叉验证。然而，后者会导致系数过度收缩（参见 Zou and Hastie 2005）。\n\n####\
  \ 3.4.1.4. 分组 Lasso (Group-lasso)\n\nYuan 和 Lin (2006) 通过显式考虑预测变量可能高度相关并以某种方式分组的事实，扩展了标准的\
  \ lasso 惩罚回归。这适用于宏观经济变量和/或公司特征（例如，参见 Bianchi and McAlinn 2018 以及 Bianchi *et al.*\
  \ 2019a）。Kyung *et al*. (2010) 显示 group-lasso 对应于如下形式的条件先验\n\n\\[3.11\\] ![image](img/eqn3-11.jpg)\n\
