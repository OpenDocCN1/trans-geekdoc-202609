  \n**表 8.2.** *组合优化中使用的某些正则惩罚*\n\n关于约束，最著名的是无现金/无杠杆和卖空限制。权重边界和资产类别限制也被从业者广泛使用。在重新平衡当前组合\
  \ ![images](img/xbar1.jpg)时，转手和交易成本管理是一个重要课题。在管理多空组合时，我们通常施加杠杆限制或多空相对于基准的跟踪误差限制，![images](img/xbar1.jpg)。相反，是敞口限制。对于基准的策略，我们可能还希望相对于基准\
  \ ![images](img/xbar1.jpg) 有一个跟踪误差限制。相反，在主动管理的情况下，我们可以施加最小跟踪误差或主动份额。最后，赫芬达尔约束被用于某些\
  \ smart beta 组合。\n\n在下文中，我们考虑几个组合优化问题。大多数问题都是目标函数、一个或两个正则惩罚函数以及上述某些约束的组合。从工业角度来看，对每个项目实现近端算子是有意义的。这种方法，解决任何组合优化问题等同于使用\
  \ CCD、ADMM、Dykstra 和相应的近端函数作为乐高积木。\n\n### 8.4.1. *最小方差优化*\n\n#### 8.4.1.1. *管理多样化*\n\
