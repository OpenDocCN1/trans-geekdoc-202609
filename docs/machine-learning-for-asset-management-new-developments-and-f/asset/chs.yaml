  \ www.iste.co.uk/jurczenko/machine.zip](img/fig6-18.jpg)\n\n**图 6.18.** *美国基于事件的情绪因子的性能。（来源：Bloomberg\
  \ Finance LLP, FTSE Russell, Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters,\
  \ SEC, Wolfe Research Luo’s QES）。欲查看此图彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n此外，如图 6.19 所示，我们的基于事件的情绪因子明显优于现成的情绪信号（例如 ESS、MCQ、CSS）。\n\n![图 6.19. 各事件组/类型复合及基础聚合情绪因子的\
  \ rank IC。（来源：Bloomberg Finance LLP, FTSE Russell, Google, IDC, RavenPack, S&P Capital\
  \ IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。欲查看此图彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-19.jpg)\n\
  \n**图 6.19.** *各事件组/类型复合及基础聚合情绪因子的 rank IC。（来源：Bloomberg Finance LLP, FTSE Russell,\
  \ Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s\
  \ QES）。欲查看此图彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.3.6. 欢迎来到 NICE（具有洞察力的分类事件新闻）\n\n最后，我们使用弹性网络机器学习算法将我们的一系列基于事件的情绪因子整合在一起。最终模型被称为\
  \ `NICE^(13)`（具有洞察力的分类事件新闻）模型。\n\n弹性网络本质上是一种正则化技术，结合了 Ridge 回归（使用系数平方和惩罚）和 LASSO\
  \ 回归（使用系数绝对值惩罚）算法。`LASSO` 正则化会将许多回归系数压缩为零，让我们只剩下几个与收益和收入相关的事件。尽管这些事件类型具有很强的性能和极佳的覆盖率，但它们可能与传统的基于会计的因素高度相关。另一方面，Ridge\
  \ 回归将回归系数向零收缩，但不一定为零。\n\n如图 6.20 所示，通过将 Ridge 回归融入 `LASSO`，弹性网络算法在不同事件类别之间保持了更平衡的分配。收入和收益相关的事件类型仍具有最大的权重。其他事件类型的系数在不同地区之间存在差异。股东披露、合伙关系、产品服务和劳工问题在美国非常显著（`Figure\
  \ 6.20a)）。另一方面，对于美国以外的发达市场，投资者关系、资产、奖励和回购事件在很大程度上贡献了 NICE 模型（`Figure 6.20b)）。\n\n\
