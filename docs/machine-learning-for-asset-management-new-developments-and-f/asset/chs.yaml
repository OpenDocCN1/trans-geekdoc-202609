  \ machine` 和 `random forest`）以及 `LASSO` 表现良好。这里，`OLS` 的平均外样本（测试）IC 高于 4%，略高于梯度机和随机森林。表现最好的模型是神经网络（平均\
  \ IC 高于 5%）和岭回归。然而，当 IC 如此密集聚集时，很难得出明确的结论，因为它们是预测准确性的一种噪声衡量。\n\n![ ¶ 图 4.14. 信息系数，MSCI\
