  \n7. 我们还估计了一个包含行业虚拟变量的模型，但由于结果非常相似，我们选择使用最简洁的模型。\n\n8. 森林中的树是相互独立的，因为在每一层的分叉中，我们都是从总共\
  \ `P` 个可能的预测变量的池中随机抽取部分比例的特征。\n\n9. 大市值、等权重的 FF 因子更具相关性，因为我们的股票池成员数量少于用于标准价值、盈利能力和投资因子的股票池成员数量，而且我们的投资组合是等权重的。正如\
  \ Asness 和 Frazzini (2013) 所指出的，大股和小股之间的因子表现可能存在显著差异。\n\n10. 在此假设下，清空多头组合并将所有持仓替换为新头位的成本将是其价值的\
  \ 20bp。\n\n# 5 使用监督学习从交易想法数据增强 Alpha 信号\n\n在本章中，我们介绍了一种利用监督学习技术（特别是“随机森林”和“梯度提升树”）来评估交易点子（trade\
  \ ideas）成功概率的方法。我们使用了与底层股票特征、入场日期相关的特征，以及描述想法贡献者的特征。还使用了想法本身的其他信息。我们的模型平均将多头点子的事后（*ex\
  \ post*）性能提升了超过 1%，并将空头点子的性能提升了超过 2%。\n\n## 5.1. 引言\n\n机构投资者经常将市场专家的建议作为其投资决策过程的输入。此类建议的准确性差异巨大。在本章中，我们介绍了一种基于机器学习的方法，为每个新想法分配一个估计概率，即从\
  \ 0（最不可能准确）到 1（最可能准确）。然后我们利用这些评估结果来构建系统性的投资组合。除了预测者信息外，该框架可以很容易地修改并应用于“理论性”想法池，从而为整个股票池中的每只股票选择“买入”或“卖出”决策。这一预测有两个局限性。第一与该方法中将“预测者”或“作者”作为特征的信息含量有关。第二涉及到处理规模得多的股票池和“理论想法”时的计算需求。\n\
  \nBailey *et al.* (2018) 开发了一种排名方法，对市场预测者进行排名和分级，试图理解各种预测者具备预测能力的程度。他们观察了四个时间跨度，即一个月、三个月、九个月和两年，并分别使用\
  \ 0.25、0.50、0.75 和 1.0 对其进行加权。\n\n他们使用的数据集中所有预测的平均准确率为 48%。他们得出结论认为，预测者的表现是随机的，几乎不涉及技巧，只有少数人的准确率水平在\
  \ 70–79% 之间，而大多数人的水平低于 50%。他们将预测者分为投资者和交易员，结果显示交易员组的平均表现略好一些，但仍仅为 48.09%，即低于随机水平。\n\
  \n关于分析师预测这一更广泛话题有丰富的文献，但在大多数情况下，其重点和使用的工具是不同的。这些文献中很大一部分是关于分析师的收益预测、创建共识预测以及与时间序列方法的比较。Bradshaw\
  \ (2011) 提供了良好的文献综述。尽管本章的目标和方法有所不同，但通过形成“集成”（ensemble）来减少方差的概念正是我们使用随机森林方法的核心。此外，分析还显示了哪些指标和数量可能包含信息内容，并可以作为我们机器学习方法特征的良好候选。\n\
  \n例如，Jacob *et al.* (1999) 和 Clement (1999) 认为经验是能力的代理，因为它是分析师因表现不佳而被解雇的指标。在我们的工作中（正如后文将解释的），我们使用贡献者首次入场的时间差（`tenure`）、过往贡献的想法数量（`engagement`）以及迄为止的命中率（`performance`）作为机器学习的特征。Bew\
  \ *et al.* (2019) 通过整合该分析师所关注的所有股票的记录信息，探讨了如何理解分析师表现的问题。他们采用了独立贝叶斯组合（IBCC）方法。该方法最初由\
  \ Ghahramani 和 Kim (2003) 定义，并成功应用于天文学领域。它非常适合稀疏问题，能够实现计算高效的推理、跨时间的分析师表现的动态跟踪以及实时在线处理。他们方法的局限性之一是，真值结果内部没有排序概念；他们只能获得一组分类标签。\n\
  \n在本章中，我们使用集成机器学习方法，特别是随机森林和梯度提升树，来预测交易想法的成功或失败。这些方法允许我们整合相当广泛的预测变量，这些变量彼此之间具有不同程度的依赖关系，并提供了一种观察其重要性和预测价值的方法。我们评估了所提方法的经济意义和实际影响。我们为每个交易想法分配一个概率，通过从池化的想法中选择来定期再平衡，并在选定的频率下重新训练模型。我们还跨越并探索了许多参数，从模型超参数到训练窗口的选择、重新训练频率等。我们发现与动量相关的特征信息量最大，流动性和波动性也是如此。我们还发现多头点子的改进在\
  \ 1.06% 到 1.85%，而空头点子的改进在 1.57% 到 2.78%。一个更惊人的结果是，我们的方法在股票市场上涨期间，成功识别了平均收益为负的空头点子。\n\
  \n本文结构如下：第 [5.2 节](#c05.xhtml#sec5-2）描述了主数据集及其补充的其他数据集，以产生预测和被预测变量。第 [5.3 节](#c05.xhtml#sec5-3）考察了机器学习方法的关键要素，并强调了某些选择的理由。第\
  \ [5.4 节](#c05.xhtml#sec5-4）展示了机器学习方法的估计结果和特征重要性。在第 [5.5 节](#c05.xhtml#sec5-5）中，我们通过回测一旦有了想法过滤机制后可以设计的许多不同策略，尝试探索该方法的经济意义。最后部分总结了主要发现和结果。\n\
  \n## 5.2. Data\n\n\n\n\n我们使用了一组涵盖 2005 年 1 月至 2019 年 6 月期间的交易策略。该数据集包含约 79 万条记录，涵盖股票交易策略。数据包含多个字段，我们使用了其中数据质量良好且一致的子集。我们从原始数据集中选取了与美国交易股票新策略相对应的子集。我们利用通过\
  \ `Axioma` 获取的股票级信息增强了该数据集。我们考虑的变量分为三大类：“策略”、“股票基本面/技术面”以及“股票风险”相关变量。在第一类中，我们考虑了作者的参与度和任期等；第二类变量涉及价值、盈利能力和其他信息；最后一类则包括特异性风险、总风险等。\n\
  \n为了让我们更深入地理解我们分析的数据，并为我们所做出的某些关键模型开发决策提供动力，我们在本节展示了某些数据属性的描述性统计。我们重点强调的重要特征包括策略成功率随时间的变化、多头和空头策略跨预测周期的模式、作者成功的持续性以及数据库的流失。我们得出结论：*事前*（ex\
  \ ante）对策略进行分类涉及对非常复杂的动态进行建模，这些动态更有可能通过机器学习技术而非线性方法捕捉。\n\n图 5.1 显示了原始策略成功率随时间的变化。命中率似乎没有表现随时间推移而改善或恶化的持续趋势。对日、周、月进行的季节性检查也没有显示出任何明显的模式，表明可以将星期或月份作为分析的预测变量。\n\
