  \n英国图书馆书号出版数据\n\n本书的 CIP 记录可从英国图书馆查阅\n\n# 前言\n\n机器学习的发展为我们的行业带来了巨大的机遇，但也带来了一些挑战：随着机器的不断演进，投资经理应该向技术让多少控制权，以便为投资者带来最佳结果？\n\
  \n在 Unigestion，我们相信协作智能以及人类与机器共同工作的力量。我们通过尖端技术赋予投资团队，使其对金融市场有更深入的理解，从而为客户获得更好的投资收益。\n\
  \n我们坚信，机器学习可以帮助主动型经理自己与被动型经理区分开来。资产管理者利用机器学习来支持其投资决策具有巨大的潜力，特别是当有人类经验支持时。得益于能够处理更复杂的模式并具有更强的预测能力，现代机器学习算法的表现优于传统的线性回归。\n\
  \n机器学习非常擅长通过海量数字寻找统计模式，但这些模式仅仅是海量数据之间的相关性，而非因果真理。与任何数据驱动的方法一样，数据质量对模型输出的实用性有巨大影响。\n\
  \n“垃圾进，垃圾出”的原则在这一新的量化世界中同样适用。因此，我们认为投资经理必须赋予机器学习经济意义。\n\n这本关于*资产管理中的机器学习*的突破性著作代表了资深投资从业人士与研究人员之间令人耳新的协作，展示了机器学习方法的实际应用。从不同的章节可以看出，机器学习可以应用于投资过程的不同部分，从选股到战术配置、Alpha\
  \ 信号增强或交易。\n\n因此，这本综合性著作是一部强大的工具，可以帮助从业人员跟上这一快速变化领域的发展，并将机器学习方法落实到他们的投资价值链中。\n\n\
  资产管理的未来可能涉及人类与人工智能的结合，利用两者的力量。然而，我们需要清晰地定义机器与经理之间控制权的共享。计算机擅长回答目标明确且表述良好的问题，而人类在提问正确的问题和解释结果方面仍然是关键的。\n\
  \nFiona FRICK\nUnigestion 集团首席执行官\n\n# 谢谢\n\n首先，我要感谢 ISTE 的编辑团队。我还要对书中所有作者的贡献和信任表示感谢。最后，我要向\
  \ Unigestion 跨资产解决方案主管 Jérôme Teiletche 表示特别和热烈的感谢，是他向我介绍了资产管理中机器学习技术的细微之处。\n\n\
  # 1 时间序列与截面股票收益预测：新的机器学习方法\n\n本章将 Han *等人* (2019) 中开发的预测截面股票收益的机器学习方法扩展到时间序列背景。这些方法使用弹性网（elastic\
  \ net）来改进 Rapach *等人* (2010) 的简单组合收益预测。在一个侧重于使用大量潜在预测变量预测美国市场超额收益的时间序列应用中，我们发现弹性网精炼显著改进了简单组合预测，从而提供了迄为止最好的市场超额收益预测之一。我们还讨论了\
  \ Han *等人* (2019) 中开发的截面收益预测，强调了如何利用机器学习方法来改进时间序列和截面维度的组合预测。总的来说，由于金融领域的许多重要问题与时间序列或截面收益预测有关，本章讨论的机器学习方法应该为研究人员和从业人员提供价值的工具。\n\
  \n## 1.1 引言\n\n金融领域的研究人员日益依赖机器学习技术来分析大数据。最小绝对收缩和选择算子*（Tibshirani 1996, `LASSO`）——最受欢迎的机器学习技术之一——在金融领域的首次应用似乎是\
  \ Rapach *等人* (2013)，他们分析了高维设定下每月国际股票收益之间的领先滞后关系。最近，Gu *等人* (2019) 使用了一套全面的机器学习工具（包括\
  \ `LASSO`）来分析每月单股收益的时间序列可预测性，而 Chinco *等人* (2019) 使用 `LASSO` 预测一分钟后的单股收益。Freyberger\
  \ *等人* (2019) 应用了 `LASSO` 的非参数版本以适应众多公司特征与截面股票收益之间的非线性关系。Kozak *等人* (2019) 在贝叶斯背景下使用\
  \ `LASSO` 基于大量公司特征对随机折现因子建模。结合 Bates 和 Granger (1969) 以及 Diebold 和 Shin (2019) 的见解，Han\
  \ *等人* (2019) 提出了利用超过 100 多个公司特征的信息预测截面收益的程序。\n\n\n\n在本章中，我们将展示 Han *et al.* (2019)\
  \ 最初为预测横截面股票收益率而设计的方法，如何被修改以用于市场超额收益的时间序列预测。大量的文献基于各种预测变量（predictor variables）研究了市场超额收益的可预测性。在存在大量潜在预测变量的情况下，传统的预测方法容易出现样本内过拟合，这通常会导致样本外性能不佳。Rapach\
  \ *et al.* (2010) 采用预测组合（Bates and Granger 1969），以一种防止过拟合的方式将大量预测变量中的信息整合起来。他们发现，一种简单的组合预测——即基于单个预测变量的单变量预测回归预测的平均值——显著提升了对美国市场超额收益的样本外预测效果。沿着\
  \ Diebold and Shin (2019) 的思路，将 Han *et al.* (2019) 的方法扩展到时间序列背景下，我们描述了如何使用 `elastic\
  \ net`（Zou and Hastie 2005，这是一种广著名的 LASSO 变体）来改进简单的组合预测，从而产生我们所谓的 `combination elastic\
  \ net` 预测。直观地说，正如 Han *et al.* (2019) 所解释的，弹性网的改进允许我们通过选择最相关的预测变量纳入组合预测中，从而更有效地利用预测变量中的信息。在实证应用中，我们证明了组合弹性网方法确实提高了美国市场超额收益预测的准确性，并为均方差投资者提供了实质性的经济价值。总体而言，我们的组合弹性网预测方法似乎是迄为止最好的市场超额收益预测之一。\n\
  \n本章的其余部分结构如下：第 1.2 节描述了市场超额收益预测的构建，包括组合弹性网预测预测。第 1.3 节报告了以预测美国市场超额收益为中心的实证应用结果，该应用使用了文献中的多种预测变量。第\
  \ 1.4 节概述了 Han *et al.* (2019) 提出的横截面收益预测的构建。第 1.5 节总结了本章。\n\n## 1.2. 时间序列收益预测\n\
