  \ 是否是一种有效的策略仍然是一个实证问题。我们在 1.3 节中研究这个问题。\n\n### 1.2.4. *组合 (Combination)*\n\n借鉴 Diebold\
  \ 和 Shin (2019) 的见解，我们还可以使用机器学习技术来改进[方程\\[1.7\\]](#c01.xhtml#eqn1-7)中的组合预测。[方程\\\
  [1.7\\]](#c01.xhtml#eqn1-7)的一个潜在缺点是它可能会将预测“过度收缩”到均值，从而忽略了预测变量的信息（Hastie 201）。为了利用更多信息来改进组合预测，我们考虑以下\
  \ Granger 和 Ramanathan (1984) 回归：\n\n[\\[1.12\\]](#c01.xhtml#ieqn1-12) ![image](img/112)\n\
  \n具体而言，为了构建组合弹性网（C-ENet）预测，我们首先定义一个初始样本期和相应的样本外期；令 `t`1 表示初始样本期的大小。然后我们分三个步骤进行：\n\
  \n*步骤 1* 对于每个预测变量，我们在样本外期计算[方程\\[1.2\\]](#c01.xhtml#eqn1-2)的递归单变量预测：\n\n\\[1.13\\\
  ] ![image](img/eqn1-13.jpg)\n\n对于 `s` = `t`1 + 1* 且 `j` = 1*...。\n\n*步骤 2* 我们在样本外期通过\
  \ `ENet` 估计[方程\\[1.2\\]](#c01.xhtml#eqn1-2)中的 Granger 和 Ramanathan (1984) 回归：\n\n\
  [\\[1.14\\]](#c01.xhtml#ieqn1-14) ![image](img/eqn1-14.jpg)\n\n对于 `s` = `t`1 + 1*。令\
  \ `J[t]` ⊆ {1,…,*J*} 是个体变量的索引集。在估计[方程\\[1.14\\]](#c01.xhtml#eqn1-14)时，我们施加限制 `θ[j]`\
  \ ≥ 0，对于 `j` = 1*...这产生了一个经济上合理的假设，即被 `ENet` 选择的单变量回归预测必须与实际超额收益正相关。\n\n*步骤 3* 我们计算组合\
  \ `ENet` 预测为：\n\n[\\[1.15\\]](#c01.xhtml#ieqn1-15) ![image](img/eqn1-15.jpg)\n\n\
  其中 |*J*[*t]| 是 *J*[*t*]的基数，且 ![image](img/ieq1-7.jpg)由[方程\\[1.2\\]](#c01.xhtml#eqn1-2)给出，对于\
  \ `j` = 1*...*J*。\n\nC-ENet 方法以一种避免过拟合的方式捕捉大量预测变量中相关信息的用处再次是一个实证问题。我们在 1.3 节的实证应用中发现，C-ENet\
  \ 方法确实是预测市场超额收益的有效策略^(6).\n\n## 1.3. 实证应用\n\n### 1.3.1. *数据 (Data)*\n\n\n\n\n\n\
  我们研究了第 1.2 节中讨论的策略在预测标普 500 指数每月超额收益方面的表现。使用来自 Amit Goyal 网站的数据^(7)，我们将超额收益定义为超过无风险利率（基于国库利率）的\
  \ CRSP 加权标普 500 收益。\n\n我们考虑了 12 个合理的预测变量，这些变量代表了学术界和实业者常用的预测指标：\n\n- `对数股息收益率` (`DP`)：标普\
  \ 500 股息 12 个月移动和的对数减去标普 500 价格指数的对数。\n- `对数市盈率` (`EP`)：标普 500 收益的 12 个月移动和的对数减去标普\
  \ 500 价格指数的对数。\n- `波动率` (`VOL`)：我们遵循 Mele (2007) 的方法，将 `t` 月的年化波动率测量为 ![images](img/ieq1-8.jpg)，其中\
  \ ![images](img/ieq1-9.jpg)\n- `国库券收益率` (`BILL`)：三个月国债收益率减去三个月国债收益率的 12 个月移动平均值。\n\
  - `国债收益率` (`BOND`)：十年国债收益率减去十年国债收益率的 12 个月移动平均值。\n- `期限差` (`TERM`)：十年国债与三个月国债收益率之间的差异。\n\
  - `信用利差` (`CREDIT`)：AAA 级公司债券收益率与十年国债收益率之间的差异。\n- `通胀` (`PPIG`)：生产者价格指数（PPI）通胀率。\n\
  - `工业产出增长` (`IPG`)：工业产出的增长率。\n- `MA(1,12) 技术信号` (`MA(1,12)`)：指标变量，如果标普 500 价格指数大于或等于（小于）标普\
  \ 500 价格指数的 12 个月移动平均值，则值为 1（零）。\n- `MA(3,12) 技术信号` (`MA(3,12)`)：指标变量，如果标普 500 价格指数的三个月移动平均值大于或等于（小于）标普\
  \ 500 价格指数的 12 个月移动平均值，则值为 1（零）。\n- `动量技术信号` (`MOM(6)`)：指标变量，如果标普 500 价格指数大于或等于（小于）其六个月前的值，则值为\
  \ 1（零）。\n\n![图 1.1. 预测变量](img/fig1-1.jpg)\n\n**图 1.1.** *预测变量*\n\n构建预测变量使用的数据来自\
  \ Amit Goyal 网站和圣路易斯联邦储蓄银行的联邦储备体系经济数据（FRED)^(8)。我们考虑了 `PPIG` 和 `IPG` 的一个月发布滞后。我们遵循\
  \ Neely *et al.* (2014) 的方法定义了包含技术信号信息的指标变量。图 1.1 展示了从 1927:01 到 2018:12 样本期的 12\
  \ 个预测变量。从视觉上看，这些预测变量代表了多种信息源。\n\n### 1.3.2 预测\n\n我们将样本的前二十年（1927:01 到 1946:12）保留为初始样本内估计期。这为我们提供了足够的观测值，以合理且可靠地估计[方程\
  \ [1.1]](#c01.xhtml#eqn1-1) 和 `[[1.3]]](#c01.xhtml#eqn1-3) 中的预测回归系数。用于计算 C-ENet\
  \ 预测的初始样本外时期涵盖了 1947:01 到 1956:12，因此我们评估 1957:01 到 2018:12 的样本外预测。样本外预测评估期跨越了六十年，这允许我们分析各种经济条件下的收益可预测性。\n\
  \n图 1.2 描述了用于计算[方程 [1.2]](#c01.xhtml#eqn1-2)、`[[1.4]]](#c01.xhtml#eqn1-4) 和 [[[1.11]]](#c01.xhtml#eqn1-11)\
  \ 中预测回归预测的递归斜率系数估计值。每个面板中的黑线勾定了[方程 [1.3]](#c01.xhtml#eqn1-3) 中多元预测回归模型的 OLS 斜率系数估计值。递归估计表明传统的多元预测回归模型斜率系数\
  \ OLS 估计存在问题——估计值往往具有“错误”的符号（例如 `DP`）。\n\n每个面板中的蓝线勾定了多元预测回归模型的 OLS 斜率系数估计值。（注：根据提供的片段，文本将基于类似的逻辑继续）。\n\
  \n\n\n\n\n基于 12 个独立预测变量的[方程 [1.2]](#c01.xhtml#eqn1-2)的单变量预测回归预测如图图 1.4 所示，而基于[方程\
  \ [1.4]](#c01.xhtml#eqn1-4)、[\\[1.7\\]](#c01.xhtml#eqn1-7)、[\\[1.11\\]](#c01.xhtml#eqn1-11)和[\\\
  [1.15\\]](#c01.xhtml#eqn1-15)的基于多个预测变量的预测则展示在图 1.5 中。每个面板中的红线勾勒了现行的均值基准预测。图 1.4\
  \ 中的许多单变量预测在整个经济周期内表现出不同的行为。通常情况下，在衰退前的几个月和衰退初几个月，市场超额收益预测低于现行的均值基准；随后超额收益预测会增加，使其在衰退后期及衰退后的几个月份移动到现行的均值基准之上。基于估值率（`DP`\
  \ 和 `EP`）的预测也显示出某些超出经济周期频率的长期波动。\n\n![Figure 1.5. 基于多个预测变量的市场超额收益预测。此图的彩色版本，请访问\
  \ www.iste.co.uk/jurczenko/machine.zip](img/fig1-5.jpg)\n\n**图 1.5.** *基于多个预测变量的市场超额收益预测。此图的彩色版本，请访问\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n图 1.5 的面板 A 描述了[方程 [1.4]](#c01.xhtml#eqn1-4)中的 OLS 多变量预测回归预测。该预测在整个经济周期内的行为类型通常与图\
  \ 1.4 中的许多单变量预测回归预测相同。然而，OLS 多变量预测回归预测的波动性大得多，在样本外评估期间的许多月份里^(9)达到了相当极端的正、负值。这是过拟合的症状。由于它最大化了估计样本的拟合度，传统的估计容易对数据中的噪声过度反应，特别是在信噪比很低的情况下（例如股票收益率预测）。\n\
  \n图 1.5 面板 B 中的简单组合预测是图 1.4 中 12 个单变量预测的平均值。正如第 1.2.2 节中所的，预测组合具有很强的收缩效应，当我们从图 1.5\
  \ 的面板 A 移动到面板 B 时，预测波动急剧减少，这一点显而易见。\n\n[方程 [1.3]](#c01.xhtml#eqn1-3)中的 OLS 回归提供了收缩的另一种手段。从图\
  \ 1.5 的面板 C 中，我们看到 ENet 相对于 OLS 预测确实引起了某种收缩。然而，图 1.5 面板 D 中预测引发的收缩程度介于面板 B 中的简单组合和面板\
  \ C 中的 ENet 之间。通过不一定平均所有单变量预测，C-ENet 预测能够比[方程 [1.14]](#c01.xhtml#eqn1-14)中的 ENet\
  \ 更强烈地响应波动。通过这种方式，C-ENet 预测旨在缓解简单预测中可能的收缩不足。\n\n### 1.3.3. *统计收益*\n\n接下来，我们根据均方误差（MSFE）评估图\
  \ 1.4 和 1.5 中预测的统计准确性。为此为此，我们计算了 Campbell 和 Thompson (2008) 的样本外 `R²` 统计量：\n\n```\n\
  [1.16]\n```\n\n其中 `t` 是最后一个观测值，`T` 是观测总数，通常代表一个竞争预测，`_` 是平均预测误差。该统计量与熟悉的样本内 `R²`\
  \ 统计量类似，衡量了竞争预测中 MSFE 的比例减少量。当然，由于月度收益本身包含有限的可预测部分，该统计量将是“小的”（(10）。尽管如此，Campbell\
  \ 和 Thompson (2008) ，约 0.5% 的月度统计量表示具有经济意义的市场预测性。\n\n为了衡量竞争预测相对于现行均值预测是否在 MSFE 上提供了具有统计学意义的改进，我们使用了\
  \ Clark 和 West (2007) 对熟悉的 Diebold 和 Mariano (1995) 以及 West (1996) 统计量的调整版本。后者在比较嵌套模型的预测时信息量较少（Clark\
  \ and McCracken 2001; McCracken 2007）。特别是，我们使用 Clark 和 West (2007) 的 MSFE-adj 统计量来检验零假设：现行的均值\
  \ MSFE 小于或等于竞争 MSFE；择假设为竞争 MSFE 小于现行的均值 MSFE。\n\n表 1.1 的面板 A 报告了单变量预测回归预测的统计量。大多数预测变量的统计量为负，因此大多数预测在\
  \ MSFE 方面未能超越现行的均值基准。基于 `VOL`、`BILL`、`BOND`、`TERM` 和 `MA(1,12)` 的单变量预测产生了正统计量，且\
  \ MSFE-adj 统计量表明，这五个预测每一个相对于均值基准在 MSFE 上都提供了具有统计学意义的减少（在 10% 水平或更高）^(11)。在正统计量中，只有\
  \ `BOND` 的超过了 Campbell 和 Thompson (2008) 0.5% 的阈值。此外，我们无法预先知道面板 A 中 12 个预测变量中哪一个表现最好。\n\
  \n\n\n\n\n### 预测准确性\n\n#### 表 1.1. *预测准确性*\n该表报告了 1957:01 至 2018:12 月市场超额收益预测的样本外\
  \ R² (![images](img/ieq1-12.jpg)) 统计量。样本外 R² 统计量是竞争预测相对于现有均值基准预测均方误差 (MSFE) 的减少百分比。面板\
  \ A 中的竞争预测基于通过普通最小二乘法估计的单变量预测回归模型。面板 A 中的预测变量定义见第 1.3.1 节。面板 B 中的竞争预测使用了全部 12 个预测变量。OLS\
  \ (ENet) 多变量预测回归预测基于通过普通最小二乘法（弹性网弹性 net）估计的包含 12 个预测变量的多变量预测回归模型。简单组合预测是面板 A 中各个单变量预测回归预测的平均值。C-ENet\
  \ 预测是根据 Granger 和 Ramanathan (1984) 回归，由弹性网选择的面板 A 中各个单变量预测回归预测的平均值。MSFE-adj 是 Clark\
  \ 和 West (2007) 统计，用于检验零假设基准 MSFE 小于或等于竞争 MSFE，而备择假设基准 MSFE 大于竞争 MSFE；^(\\*), ^(\\\
  *\\*) 和 ^(\\*\\*\\*) 分别表示在 10%、5% 和 1% 的水平上显著。\n\n为了直观单变量预测随时间变化的性能，图 1.6 显示了现有均值基准相对于每个单变量预测的预测误差平方累计差（Goyal\
  \ and Welch 2003, 2008）。图 1.6 中的累计差可以直观地判断任何子样本中竞争预测是否比现有均值基准更准确。我们只需要比较子样本开始和结束时曲线的高度。如果曲线在结尾较高（较低），则说明竞争预测在子样本上的\
  \ MSFE 低于（高于）现有均值基准。持续提供样本外收益的竞争预测将具有主要正斜率的曲线，而陡峭的负斜率段则表示表现极差的时期。\n\n![图 1.6. 基于单个预测变量的市场超额收益预测预测误差平方累计差](img/fig1-6.jpg)\n\
  \n#### 图 1.6. *基于单个预测变量的市场超额收益预测预测误差平方累计差*\n\n除 VOL 外，图 1.6 中的单变量预测未能随时间提供相当一致的准确性提升。尽管在某些时刻单变量预测的表现大幅优于现有均值基准，但也有许多时期其表现远不如朴素基准。总体而言，图\
  \ 1.6](#c01.xhtml#fig1-6) 让人联起 Goyal 和 Welch (2008) 的发现。\n\n表 1.1 的面板 B 报告了结合多个预测变量信息的四个预测的\
  \ ![images](img/ieq1-12.jpg)统计量，而 图 1.7 则了现有均值基准相对于四个预测的预测误差平方累计差。表 1.1 面板 B 中 OLS\
  \ 多变量预测回归预测的 ![images](img/ieq1-12.jpg)统计量为 4.33%，因此在 1957:01 至 2018:12 的评估期间，该预测的准确性明显低于现有均值基准。图\
  \ 1.7 的面板 A 显示预测相对于朴素基准表现出长时间的波动。总体而言，OLS 多变量预测回归预测显然受到了过拟合的影响。\n\n表 1.1 面板 B 中简单组合预测的\
  \ ![images](img/ieq1-12.jpg)统计量为 1.11%（其 MSFE-adj 统计量在 1% 水平上显著），大于面板 A 中所有单变量回归预测的\
  \ R² 统计量。此外，图 1.7 的面板 B 显示，简单组合预测随时间以相当一致的方式优于现有均值基准，因为其曲线主要呈正斜率，且仅有有限的负斜率段。简单组合预测引起的强收缩显然对于整合多个预测变量的信息有用，能够防止过拟合。\n\
  \n尽管 ENet 多变量预测回归预测也会引起收缩，但回想 图 1.5，收缩程度似乎有限。表 1.1 面板 B 中 ENet 预测的 ![images](img/ieq1-12.jpg)统计量为正，但非常接近零\
  \ (0.22%)。此外，图 1.7 的面板 C 表明 ENet 预测未能随时间持续优于现有均值基准。事实上，在许多阶段 ENet 预测的表现严重低于现有均值基准。因此，ENet\
  \ 多变量预测回归预测引起的收缩程度似乎太弱，无法在预测市场超额收益时有效防止过拟合。\n\n![图 1.7. 基于单个预测变量的市场超额收益预测预测误差平方累计差](img/fig1-7.jpg)\n\
  \n\n\n\n简单组合预测施加了强烈的——也许是过强的——收缩效应，而 ENet 多预测回归预测引发的收缩效应则不足。再次回顾图 1.5，C-ENet 预测引发的收缩程度介于简单组合预测和\
  \ ENet 预测之间。![images](img/ieq1-12.jpg)C-ENet 预测的 t 统计量在表 1.1 的 B 中达到了巨大的 2.12%（其\
  \ MSFE 调整后统计量在 1% 的水平上显著）。相对于流行的均值基准，ENet 预测在所有竞争预测中提供的 MSFE 改进最大，且其 `R`² 统计量几乎是简单组合预测的两倍。图\
  \ 1.7 的 C 证实，C-ENet 预测在时间维度上非常一致地优于盛行的均值^(12)。\n\n总而言之，C-ENet 预测似乎接近一种“金发姑娘”式的收缩技术。它引发了比\
  \ ENet 预测更强的收缩，从而更好地防止过拟合。同时，它比简单组合预测施加的收缩效应较弱，使其能够从最相关的单变量预测中纳入更多信息，进一步提高样本外性能。回想图\
  \ 1.3，ENet 根据 Granger 和 Ramanathan (1984) 回归中的 `DP`、`VOL`、`BOND`、`TERM` 和 `MA(1,12)`\
  \ 选择单变量回归预测。这种对纳入组合预测的相关预测变量的谨慎实时选择，证明了机器学习在提高样本外市场超收益预测方面的价值。\n\n### 1.3.4. 经济收益\n\
  \n除了 1.3.3 节中记录的预测准确率收益外，我们接下来展示 C-ENet 预测为资产配置背景下的投资者提供了实质性的经济收益。具体而言，我们考虑一个每个月在风险股票和无风险国债之间进行配置的均值方差投资者。投资者的目标函数给出：\n\
  \n```\n[1.17]](#c01.xhtml#ieqn1-17) ![image](img/eqn1-17.jpg)\n```\n\n其中 `γ` 是相对风险厌恶系数，`w[t+1|t]`\
  \ (1 – `w[t+1|t]`) 是投资者在第 `t+1` 月对股票（无风险票债）的配置，![images](img/ieq1-12a.jpg)![images](img/ieq1-13.jpg)是投资者使用的市场超收益（方差）预测。[方程\
  \ [1.17]](#c01.xhtml#eqn1-17)的已知解形式如下^(13):\n\n```\n[1.18]](#c01.xhtml#ieqn1-18)\
  \ ![image](img/eqn1-18.jpg)\n```\n\n为了衡量收益预测性对投资者的经济价值，我们首先分析了当投资者依赖流行的均值预测（该预测忽略了收益预测性）来确定方程\
  \ [1.18]](#c01.xhtml#eqn1-18) 中的最优股票配置时的投资组合性能。然后我们分析了投资者改用 C-ENet 预测来选择最优配置时的组合性能。在这两种情况下，投资者都使用通过\
  \ 60 个月滚动窗口计算的样本方差来预测方差^(14)。我们假设 `γ` = 5；对于合理的替代值，结果在定性上是相似的。\n\n当投资者依赖流行的均值基准预测时，最优组合在\
  \ 1957:01 到 2018:12 的预测评估期间获得了 4.30% 的年化平均超收益。结合 12.87% 的年化波动，组合的年化夏普比率为 0.33。如果投资者在[方程\
  \ [1.18]](#c01.xhtml#eqn1-18)中使用 C-ENet 预测代替流行的均值，则最优组合将产生 6.29% 的年化平均超收益和 9.76%\
  \ 的波动。这转化为 0.64 的实质年化夏普比率，几乎是基于均值的组合的两倍^(15)。此外，确定性收益 (CER) 的收益表明，投资者愿意支付 375 bps\
  \ 的高额年化管理费从流行的均值切换到 C-ENet 预测。\n\n图 1.8A 面中的红线和黑线分别描述了基于流行的均值和 C-ENet 预测的最优组合的股票配置。C-ENet\
  \ 预测导致许多配置与流行的均值基准明显不同。这些重新配置对投资者似乎非常有价值，因为它们大幅提高了投资组合性能。这在图 1.8 的 B 面中进一步说明，该面板显示了两个组合的对数累计超收益。例如，基于\
  \ C-ENet 的组合通常比流行的均值回撤更小（分别为 29% 和 58%）。\n\n![images](img/ieq1-12.jpg) 图 1.8. 股票配置与累计超收益。此图的彩色版本\n\
  \n基于 C-ENet 的最优组合比任何单变量预测以及 ENet 回归和简单组合预测都产生了更高的夏普比率和年化收益。总而言之，C-ENet 预测在统计准确性和投资者价值方面提供了最佳整体性能。\n\
