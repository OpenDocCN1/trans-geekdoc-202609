  \ beta 非常高，而蓝色点的 beta 接近于 0。存在一种预期的线性关系——历史 beta 高值会导致高 SHAP 值（与平均值相比，beta 预测增加），而历史\
  \ beta 低值则会导致负的 SHAP 值（与平均值相比，beta 预测减少）。更有趣的是，我们在这个图中看到了一些非线性效应。我们观察到，高于 2 的历史\
  \ beta 值并没有随着之前的效应增加重要性，而是保持在相同的重要性水平，并开始在垂直方向上分散。这部分股票更高的离散程度表明，可能还有其他特征贡献了这种重要性——一种潜在的交互作用。在负极端情况下，负历史\
  \ beta 值出现了一个跳跃，其 SHAP 值约为 -1，会影响输出。\n\n图 7.10 显示了 12 个月动量的重要性。我们观察到，与上一个图表不同，这里只有正向影响或没有影响。这种依赖关系是强非线性的。12\
  \ 个月动量特征的重要性随着正收益的增加而增加——也就是说，在过去一年表现良好的公司可能变得风险更大——这可能预示着动量崩溃。具有微小正或负收益的公司对评估该股票的\
