  \ `f (x)` 的情况下扩展了 CD。\n\n#### 8.3.1.2 循环坐标还是随机坐标？\n\n选择第 `k`^(th) 次迭代的坐标有多种方案。一种自然的选择是选择使函数最小的坐标：\n\
