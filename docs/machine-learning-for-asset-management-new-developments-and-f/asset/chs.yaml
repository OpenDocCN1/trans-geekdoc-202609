  \ *等人* (2010) 提出了以下分层多变量模型：\n\n\\[3.12\\] ![image](img/eqn3-12.jpg)\n\n其中 `MN` (`a,\
  \ A`) 表示均值向量为 `a` 协方差矩阵为 `A` 的多元正态分布。这里，`m[g]` 和 `I[m[g]]` 分别表示组 `g` 的维度以及一个 (`m[g]\
  \ × m[g]`) 单位矩阵。显易见，`τ`² 的取值很大意味着给定组内的所有系数将同时被收缩至零。\n\n### 3.4.1.5. 马蹄先验（Horseshoe）与组间马蹄（group\
  \ horseshoe）\n\nPolson and Scott (2010) 指出，局部收缩超参数的良好先验设定应当：(1) 以零为中心，以确保恢复回归参数真实采样分布的效率；(2)\
  \ 具有多项式尾部，以便更激进地将噪声变量收缩至零。然而，无论是岭回归（ridge）还是 lasso 回归或其泛化形式（如弹性网络 elastic-net 和\
  \ group-lasso），都无法缓解大离群信号和未知形式稀疏性的问题。\n\n为了解决这些问题，Carvalho *等人* (2009 和 2010) 提出了一种基于所谓的马蹄先验的稀疏监督学习的全贝叶斯框架。此类先验是正态尺度混合分布的员，因此与现有方法（如\
  \ lasso、岭回归和弹性网络惩罚项）紧密相关。\n\nMakalic and Schmidt (2015) 指出，通过引入潜辅助参数 `ν[j], ξ`，原始的马蹄回归可以重写为如下的分层模型：\n\
  \n[\\[3.13\\]](#c03.xhtml#ieqn3-13) ![image](img/eqn3-13.jpg)\\[3.14\\] ![image](img/eqn3-14.jpg)\\\
  [3.15\\] ![image](img/eqn3-15.jpg)[\\[3.16\\]](#c03.xhtml#ieqn3-16) ![image](img/eqn3-16.jpg)\n\
  \n这种分层模型使得从后验分布中采样变得非常简单（参见附录 section 3.8）^12）。\n\n重要的是，马蹄先验是唯一在零处具有渐近且具有厚尾的收缩先验（参见\
  \ Carvalho *等人* 2010）。这两个属性的结合确保了小系数被高度收缩至零，而大系数则保持较大。这与 lasso 和弹性网络不同，后者的小系数和大系数都会被正则化并向较小的值收缩。\n\
  \n马蹄先验具有适应不同稀疏模式的能力，同时避免了对大系数的过度收缩。然而，与其他方法类似，马蹄先验基于所有回归系数 `β[j]` 条件独立的假设，即预测变量不允许存在组结构。Xu\
  \ *等人* (2016) 放宽了这一假设，并提出了如下的分组马蹄先验：\n\n\\[3.17\\] ![image](img/eqn3-17.jpg)\n\n\
  其中![images](img/ieq3-19.jpg)表示组级 `g` 处的收缩参数，`τ`² 表示全局收缩参数。与 group-lasso 类似，组间马蹄会将组内的所有变量收缩至零，或者保持它们不收缩。\n\
  \n### 3.4.2. 预测评估\n\n遵循预测文献中的标准做法，我们基于点预测和密度预测来评估预测策略的质量。具体而言，我们首先基于点预测评估竞争模型，比较外样本均方根误差\
