  \ (2019) 建议使用机器学习技术精炼方程 [[1.22]](#c01.xhtml#ieqn1-22) 中的简单组合预测。具体而言，他们建议使用 LASSO\
  \ 或 ENet 估计横截面 Granger 和 Ramanathan (1984) 回归，借此选择包含在组合预测中的个体特征，该回归将月份-*t* 的实际收益与方程\
  \ [[1.23]](#c01.xhtml#ieqn1-23) 中的单变量预测相关起来。横截面 C-ENet 预测给出：\n\n```\n\\[1.25\\]\
  \ ![image](img/eqn1-25.jpg)\n```\n\n其中 `J[t]` ⊆ {1,…,*J*} 是 ENet 在月份-*t* Granger\
  \ 和 Ramanathan 回归中选出的横截面单变量预测的索引集。其 C-ENet 预测值为 1.25（平均横截面 *R²* 为 3.65%），显著大于零但不同于\
  \ 1。et al.* (2019) 也使用 Harvey *et al.* 1998 开发了横截面预测。其 C-ENet 估计值为 1.10（平均横截面 *R²*\
  \ 为 2.69%），更接近 1。其 C-ENet 估计值显著大于零且不同于 1。在涉及 100 多个公司特征的广泛实证应用中，Han *et al.* (2019)\
  \ 显示他们的 C-ENet 方法提供了目前最准确的横截面预期收益预测。\n\n## 1.5 结论\n\n扩展 (2019) 开发的横截面预测程序，本章介绍了一些用于时间序列预测的机器学习方法。我们的实证应用关注额外收益，这是金融领域的核心问题。尽管存在样本内预测性，Goyal\
  \ and Welch (2008) 显示，基于文献中许多变量的传统预测无法在时间上一致地提供样本外收益。通过简单的预测组合，Rapach *et al.* (2010)\
  \ 似乎首次提供了样本外市场收益一致预测的证据。本章提出的方法使用弹性网精炼简单组合预测，我们发现体现在我们组合预测中的弹性网精炼确实对样本外市场收益预测产生了实质性的进一步改进。\n\
  \n机器学习技术通常被批评为“黑箱”。然而，通过进行变量选择，弹性网（以及 LASSO）是一种有助于经济解释的机器学习技术。在我们的实证应用中，我们的组合弹性网方法一致识别出股息率、波动率、国债收益率、期限差和一个流行的技术信号作为相关的额外收益预测因子。从大量的预测变量中识别最相关的样本外市场收益预测因子，为构建理论定价模型的研究人员提供了非常有用的指南。正如\
  \ *et al.* (2019) 在横截面背景下分析的那样，组合弹性网方法也可用于识别解释最相关的公司特征。更广泛地说，由于资产定价和公司金融领域的无数问题与时间序列或横截面预测有关，本章讨论的组合弹性网方法为研究人员和从业者提供了宝贵的资源。\n\
