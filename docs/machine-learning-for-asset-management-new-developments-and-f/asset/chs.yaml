  \n\n\n\n\n最近的一些文献发现，机器学习技术在从大量（可能存在相关的）股票特征中生成多因子信号方面具有巨大潜力。这类文献的核心观点是，此类技术适用于该问题，因为它们的设计初衷是为了在预测中表现良好，能够高效地总结大量预测变量中包含的信息，识别复杂的非线性关系并避免过拟合。研究表明，基于神经网络、回归树和广义线性回归的模型优于某些简单的传统基准模型。\n\
  \n在我们的工作中，我们首先模拟了股票收益的非线性数据生成过程，并说明了校准复杂非线性模型的挑战。然后，我们将模型拟合到过去 23 年全球股票的实际数据，并进行了广泛的样本外分析，以评估所提方法的预测能力。\n\
  \n本章节从以下几个方面补充了现有结果：\n1) 我们将分析扩展到全球股票（而非美国市场），\n2) 我们关注可投资的股票范围，\n3) 我们使用一个专有的多因子\
  \ Alpha 模型作为基准，以及\n4) 我们根据广泛使用的性能指标对生成的策略进行了比较。本章还讨论了常见的顾虑，即复杂的非参数模型是“黑箱”，也就是说结果难以解释，因此基于此类模型的决策进行审计非常困难。\n\
  \n## 4.1. 引言\n\n本章的目标是探索机器学习方法在构建多因子 Alpha 模型中的应用，这个问题近期在学术界引起了相当关注。我们并没有对可用方法进行通用的概述，而是专注于一个我们许多客户都有极大兴趣的特定应用。特别是，我们考虑了从大量的股票级信号中进行选择并将得分合并为单一\
  \ Alpha 以构建量化投资策略的问题。\n\n最近的一些学术论文提出了替代方法论来解决这一问题，并对其进行了测试，正如我们在文献综述部分中详细解释的那样，其结果令人鼓舞。我们的贡献可以总结如下：\n\
  \n* 我们将所提方法应用于可投资范围（而非非常广泛的股票集合），并测试了结果的稳健性。重点在于所得策略的盈利能力（例如通过信息系数 (`IC`) 衡量），而不是其预测能力`per\
  \ se`；\n* 我们将分析（目前大部分集中在美股上）扩展到欧洲股票，作为外部验证测试；\n* 我们采用了我们专有的 `Macquarie Quant Alpha`\
  \ 模型作为基准，该模型已样本外更新了 10 多多年。特别是，我们研究了机器学习方法是否显著偏离了传统方法的选股结果，还是最终两者都倾向于选择相似的股票并产生类似的收益模式；\n\
  * 我们将生成的 Alpha 馈入投资组合优化器，并评估了模型在风格、国家、货币敞口和周转率等现实限制下的表现。\n\n机器学习技术近期在金融领域赢得了前所未有的普及。在会议上提交和在公共仓库中传阅的金融机器学习应用论文数量不断增加，促使一些人怀疑这种现象是否应该被视为炒作。我们遇到过对新技术的狂热支持者，他们认为某些方法是某种程度的“灵丹妙丸”，在大多数应用中都能产生更好的结果。传统方法，特别是线性回归，有时在机器学习时代被认为过时。\n\
  \n我们在本章中遵循的方法基于一种观点：机器学习技术与其他可用统计方法一样，是适用于某些情况和实现某些研究目标的工具。构建多因子 Alpha 模型的任务是否符合可以通过机器学习技术成功解决的问题特征？我们认为，答案是肯定的，原因正如这些原因在现有的学术文献中已阐述，主要是\
  \ `Gu et al. (2018)`。\n\n首先，机器学习技术是为了预测而设计的。可以说，能够预测股票收益（或将股票分类为潜在的胜者或失败者）是构建多因子\
  \ Alpha 模型的主要目标。\n\n其次，机器学习工具旨在处理大量的（可能高度相关的）预测变量。这是因子投资者通常面临的情况，因为由于学术界和工业界不断进行研究，股票“异常”现象不断涌现。学术界目前将超过\
  \ 300 种替代信号视为记录详备的“因子”。需要估计的巨量参数可能导致某些传统统计工具产生糟糕的预测。正如我们在报告中所论述的，机器学习方法可以通过利用偏差和方差之间的权衡来大幅减少预测的方差。\n\
  \n此外，股票因子可能与收益呈现出复杂的非线性关系和复杂的相互作用。例如，`Frazzini and Pedersen (2014)` 和 `Blitz and\
  \ van Vliet (2007)` 所认为，低 Beta 或低波动因子排序的股票组合所显示的收益模式是非对称的。同样，人们广泛认为估值信号与收益之间的关系是非线性的，因为极廉的证券可能是价值陷阱。因此，将预期收益与典型估值率联系起来函数在输入达到特定范围时应该变得平坦。\n\
  \n不同信号之间的复杂相互作用在学术研究提供的实证证据中也有大量记载，至少自 `Fama and French (1992)` 对价值和规模的研究以来。另一个例子是\
  \ `Asness et al. (2018)` 中规模与质量之间的相互作用，他们发现小市值股票组合倾向于低质量，这损害了其表现。\n\n我们的一些读者无疑会对比典型的金融数据集是否能够承受如此高水平的复杂性表示怀疑。毕竟，金融与机器学习成功的应用领域（例如电子商务和计算机视觉）之间的主要区别在于，金融数据的噪声大得多。例如，研究人员已经开发出非常可靠的方法来识别包含猫的照片。同样，用户对书籍或电影的偏好可以从其购买历史中以非常高的精度推断出来。大多数投资者都会同意，除了在非常短的时间跨内，否则预测哪些股票将达到相当的准确性是非常困难的，即使拥有关于公司基本面和历史价格行为的大量信息。\n\
  \n\n\n\n信噪比出现这种差异有几个显而易见的原因。几十年来关于金融市场的理论工作分析了市场有效性的影响。随着金融市场的发展，股票收益的可预测性往往逐渐消失。而在电子商务数据中并没有这种机制在起作用。此外，金融数据的特征是存在结构性断层，这会永久性改变预测因子与股票收益之间的关系。最后，金融变量受随时间缓慢演进的宏观因素的驱动。因此，我们通常没有足够的数据来从过去的业务周期波动中训练出复杂的模型。\n\
  \n因此，在此背景下考虑机器学习方法的第四个原因是：拥有一系列旨在缓解过拟合的技术可供选择。两个显著的例子是参数正则化，以及将样本划分为训练、验证和测试子样本的想法。前者限制了模型的灵活性，从而防止优化器通过选择“极端”参数值来对输入数据产生过拟合。后者则迫使优化器使用两个独立的数据集来估计模型参数并校准超参数（例如，优化器从数据中“学习”的速率）。\n\
  \n文献中有时提出的第五个原因是需要在量化空间内避免“拥挤交易”（crowded trades）。量化投资者使用的信号很可能是高度相关的，因此根据该论点，头寸可能会有很大重叠。处理可用数据的新方法，即这些论文所倡导的机器学习方法，可能是生成避免拥挤投资组合的关键。\n\
  \n我们承认，这些观点中的每一个都可以通过更传统的工具来，特别是来自非参数统计的工具^(3)。然而，在本章中，我们旨在保持怀疑的同时，探索机器学习在 alpha\
  \ 建模中的应用。特别是，我们进行了大规模回归分析，旨在预测 1995 年至 2018 年间两个流动性股票池（MSCI 美国和 MSCI 欧洲指数）的每月股票收益。潜在预测因子集包含了大多数广泛使用的量化因子，如价值、价格动量、收益动量、质量和低风险。除了线性回归外，我们还考虑了许多在机器学习文献中流行的模型，包括正则化回归（`LASSO`、`ridge`、`elastic\
  \ net`）、神经网络、提升树模型和随机森林。每个模型生成一个公司级的 alpha 信号，该信号可用于交易策略中的选股。\n\n主要的实证结果可以总结如下：首先，机器学习技术具有强大的潜力，即使与具有成功记录的专有模型（如我们的\
  \ Macquarie Quant Alpha 模型）相比，也有足够的预测能力来产生具有吸引力的风险收益比。在我们的样本外分析中，我们发现，根据预测的单月收益排序的等权多空股票组合，美国股将产生\
  \ 1.18 的信息率（`IR`），欧洲股产生 1.32。回测使用的时期对于因子投资来说是一个充满挑战的时期，学术研究中使用的标准风格因子的表现疲软证明了这一点。尽管如此，在相同的样本外期间，一个没有周转限制的优化策略在考虑交易成本前在美国实现了\
  \ 1.26 的信息率，在欧洲实现了 2.16。\n\n最后，我们发现（与学术论文中报告的实证结果一致），价格动量因子和技术指标在最优信号组合中表现突出。尽管如此，交易成本带来的拖累并没有消除基于所提方法的多空策略的优异表现。\n\
  \n## 4.2 文献综述\n\n金融领域的机器学习并不是一个新领域。例如，神经网络的应用在 20 世纪 90 年代非常流行，以至于 1992 年出现了一本由\
  \ Robert Trippi 和 Efraim Turban 编辑的关于该主题的文章集（Trippi and Turban 1992）。我们在本章中处理的特定应用在\
  \ 20 世纪 90 年代也获得了一些关注，如 Mezrich (1994) 等早期工作所示。\n\n在近期尝试构建股票收益多因子模型的实证论文流中，Gu *et\
  \ al.* (2018) 堪认为是最全面的。作者们使用了多种非线性非参数技术（包括提升回归树、神经网络和随机森林），根据大约 90 个“因子”和 8 个宏观变量来预测每月股票收益。他们的主要结论是，机器学习方法（特别是神经网络）的性能显著优于简单的三因子模型（如\
  \ Fama–French, (1992) 模型）以及使用所有可用因子的线性回归模型。\n\n作者承认，最小二乘法基准是一个非常弱的基准，因为 `OLS` 估计量难以处理\
  \ 1,000 个高度相关的变量。这是本章所考虑的某些模型的主要优势之一：通过在预测中引入微小的偏差，当传统的线性估计器具有高方差时，它们可以提高预测准确性。选择较小的预测因子子集或在每个组内进行分组和平均是实现类似结果的简单方案，即通过将某些系数设为零来减少估计器的方差。\n\
  \nGu *et al.* (2018) 发现，其预测模型的成功主要由横截面信息驱动，而非宏观变量中的信息。特别是，各种因子中，动量、流动性和波动性（而非资产负债表变量）证明是最重要的。值得注意的是，所有变量都是按每月更新的，而公司基本面每年更新一次（见\
  \ Green *et al.* 2013a, 2013b）。更新频率似乎提高了样本外 `R²`。Gu *et al.* (2018) 的主要结果之一是，机器学习方法能够从巨大的^(4)数据中高效学习，该数据集的特征是大量的公司样本、大量的特征以及巨大的时间序列维度。\n\
  \n值得提到他们没有从样本中排除垃圾股，这对于资产定价论文来说是一个非常异常的选择。然而，作者确实报告该模型在样本的大盘股部分具有良好的样本外拟合效果，尽管（意不意外地）其模拟策略的等权版本优于加权版本。\n\
  \nKrauss *et al.* (2017) 也考虑了一系列不同的非线性模型（神经网络、梯度提升树和随机森林）。他们的预测因子集仅包含历史价格，且预测周期为每日。与\
  \ Gu *et al.* (2018) 不同，Krauss *et al.* (2017) 将问题设定为分类问题，即识别股票。他们的主要结论是，基于其每日预测的统计套利策略可以在被动基准上产生巨大的超额收益，尽管策略的盈利能力随着时间的推移而下降。他们对变量重要性的分析表明，模型主要加载于短期特征，即从\
  \ `t - 6` 天到 `t - 1` 天的滞后收益。\n\n\n\n\nCoqueret 和 Guida (2018) 使用了一种基于树的方法，利用 30\
  \ 个特征来预测哪些股票将优于市场。Guida 和 Coqueret (2019) 应用了极端梯度提升树（XGBoost）来构建增强型多元化股票投资组合。他们的目标是利用大量特征预测单只股票的未来\
  \ 12 个月（行业相对）表现。他们报告称，在简单的多因子投资组合上，风险调整后收益有了显著提升。然而，该策略产生的因子敞口仍与传统的多因子组合保持一致。作者得出结论，基于树的模型对于避免量化策略中的拥挤（crowding）很有用。\n\
  \nGuida 和 Coqueret (2018) 使用了多种机器学习方法，包括神经网络、随机森林和极端梯度提升树，来预测 12 个月的股票收益率。\n\n另一篇最近的论文关注了特定的机器学习模型家族。Moritz\
  \ 和 Zimmermann (2016) 提出了使用“基于树的条件组合排序”。在实践中，他们的方法包括在 86 个公司基本特征和一组滞后的每月股票收益率上训练随机森林模型。同样，该模型在月收益率上显示出强大的预测能力，且滞后的价格信息似乎是结果的主要驱动因素。\n\
  \n最近的几篇论文（DeMiguel *et al.* 2018; Freyberger *et al.* 2017; Feng *et al.* 2019;\
  \ Messmer and Audrino, 2017）采用了 LASSO 或其泛化方法作为工具，从大量候选变量中选择股票级预测因子。\n\n另一支文献关注了人工神经网络。Feng\
  \ *et al.* (2018) 提出使用深度神经网络来构建 57 个特征的复合模型。Abe 和 Nakayama (2018) 采用了类似的方法，利用 25\
  \ 个股票特征来预测日本股票的月收益率。Messmer (2017) 是另一个例子，他在美国数据的应用中使用了 68 个公司级变量。\n\n虽然上述提到的所有神经网络论文都将预测问题视为横截面问题，但\
  \ Fischer 和 Krauss (2018) 关注了时间序列属性。特别是，他们应用了长短期记忆网络（LSTM）来预测标普 500 指数成分股的每日股票收益，并报告了令人鼓舞的结果。\n\
  \n我们回顾的大多数论文都有共同的实证结果。主要结论始终是：机器学习技术具有强大的潜力，证据表明它们的表现优于一些简单的传统基准。只要允许足够的灵活性，最复杂的模型（例如深度神经网络）通常会被更简单的模型所超越。价格动量因子在最优信号组合中占据重要地位。有用预测因子的数量和相对权重随时间发生了显著变化。\n\
  \n我们通过提到从所回顾的论文中得出的三个主题来结束本节。第一个主题是回归框架和分类框架之间的选择。收益率预测问题有两种替代方法：\n\n*   回归，根据预测的收益率对股票进行排序，如\
  \ Gu *et al.* (2018) 所示；\n*   分类，根据股票优于其所属范围或所属行业的概率对股票进行排序，如 Guida 和 Coqueret (2019)、Krauss\
  \ *et al.* (2017) 等许多研究所示。\n\n第二个重要主题涉及风格择时（style timing）。模型应该学习如何切换风格吗？正如我们在下文中详细解释的那样，Gu\
  \ *et al.* (2018) 将样本内数据分为两个子样本。较早的样本用作训练集，而较后的样本组成验证集。\n\n最后，我们强调了一个与模型校准相关的主题。某些论文完全忽略了这个问题，或者使用\
  \ `k`-折交叉验证。我们使用后提到的方法来避免对数据过拟合。\n\n## 4.3. 数据\n\n### 4.3.1. 股票因子\n\n我们的实证分析使用了从\
  \ 1995 年 1 月到 2018 年 11 月 MSCI 美国和 MSCI 欧洲所有成分股的数据。模型在每个股票范围内单独训练。所谓的特征矩阵（即用于预测的自变量）由我们因子库中的约\
  \ 200 个股票信号组成。有关因子评分、归一化和更新频率的策略细节，请参阅 Macquarie Research Report (2008, 2011)。从完整集中，我们通过应用过滤器减少了特征数量。\n\
  \n存留的因子代表了学术文献记录的广泛风险溢价或异常情况：\n\n*   价值因子，我们将其进一步分类为价值（例如内部收益率——`IRR`）、防御性价值（例如股息率）和周期性价值（例如市净率）；\n\
  *   质量因子，例如盈利能力指标，如净资产收益率（ROE）；\n*   价格动量因子，例如滞后 6 个和 12 个月的收益率；\n*   收益动量因子；\n\
  *   技术因子，例如 `Williams %R`；\n*   低风险因子，例如（低）价格波动率和（低）市场贝塔值；\n*   流动性因子；\n*   与资本结构相关的因子，例如债股比。\n\
  \n对于依赖分析师预测的因子，只要有共识数据，我们就会包含基于不同预测范围和追踪数据的因子版本。例如，包含的收益率信号使用了 `FY0`、`FY1`、`Last\
  \ Twelve Months` 和 `Next Twelve Months` 预测。\n\n\n\n\n\n### 4.3.2. 数据清洗\n\n每个月，我们保留覆盖范围至少为\
  \ 60% 的信号（特征）。对于剩余特征，遵循 Gu *et al.* (2018) 的方法，缺失数据用其横截面中位数替换（使用 1% 截断分布以减少离群值的影响）。这一处理过程对缺失数据添加了惩罚，即根据该特定信号，该股票将被放置在分布的中心。最后，每个特征都使用基于秩的公式横截面归一化到\
  \ -1 和 1 之间。这种处理有两个优点：首先，它在不需要对分布进行缩尾（winsorizing）或裁剪的情况下消除了离群值的影响；其次，它为神经网络准备了数据，因为神经网络的结果取决于输入的尺度。我们对响应变量执行了相同的变换。因此确保了特征和响应的横截面标准差随时间保持均匀且恒。我们还在小样本数据上使用原始响应变量训练模型，但我们发现使用变换后的收益时，误差函数的平滑度有了巨大；也就是说，使用未转换的响应时，模型难以学习，且验证中的\
  \ MSE（均方误差）会立即爆炸，导致模型用常数来预测所有收益。\n\n### 4.3.3. 用于训练和预测的特征\n\n在清洗程序之后，我们留下了随时间变化的信号数量。例如，对于\
  \ MSCI USA 指数，信号数量从样本开始时的 128 个增加到结束时的 197 个。随着更多共识数据的可用，信号的数量和质量随时间的增加而提高。\n\n\
  然而，为了避免前瞻偏差，我们使用了扩展窗口估计。因此，遵循 Gu *et al.* (2018) 的方法，我们只使用从样本最开始（1995 年 1 月）起可用的特征。值得注意的是，这一约束可以放宽，线性模型也可以调整以处理缺失数据。因此，我们认为对机器学习预测能力的结论是保守的。\n\
  \n## 4.4. 模型规范与校准\n\n### 4.4.1. 模型\n\n本节概述了我们实证分析中使用的模型。我们对机器学习技术的选择源于现有的实证文献，特别是\
  \ Gu *et al.* (2018)。所有模型都通过开源机器学习库 `H2O`（通过从 CRAN 提供的 R 包 `h2o`）进行了校准。我们从对预测问题的通用陈述开始。\n\
  \n我们将估计问题表示为回归设计，使用一个涵盖了我们将估计的所有线性和非线性规范的总模型。该总模型可以写为：\n\n![image](img/eq4-1.jpg)\n\
  \n其中 `Et` 是一个不依赖于 `i` 也不依赖于 `t` 的函数。该函数简单的示例是具有相同截距和斜率的面板模型，可以写为：\n\n![image](img/eq4-2.jpg)\n\
  \n对于 `i` = 1, … , `N` 和 `t` = 1, … , `T`。`P` 是预测器数量（也称为“特征”）。该模型可以使用标准的 OLS 进行估计，即使\
  \ `P` 大于 `N` 和 `T`，只要 `NT > P`。Gu *et al.* (2018) 使用了类似的带有额外行业虚拟的面板模型。我们最小化的目标函数均基于汇总残差，残差是在训练或验证中计算的。\n\
  \n#### 4.4.1.1. 基准模型\n\nMacquarie Alpha 模型：Macquarie Alpha 模型是 Macquarie 的全球选股模型，它在不同市场上取得了成功，并在\
  \ 2008 年推出以来产生了显著的超额收益。我们的 Alpha 模型使用包含近 200 个量化因子的库，并将它们结合以获得单一选股评分，在给定的范围内对所有股票进行相对排名。因子权重动态选择，以便在三个月的期限内最大化风险调整后收益，同时控制换手率并保持因子多样性。\n\
  \n前向逐步选择：这种方法最初由 Efroymson (1960) 提出，可以被视为一种朴素的机器学习方法。它使用一种名为“前向逐步回归”的“子集选择”程序，从一组变量（特征）中选择未来股票收益的下一个最佳预测器，从带截距的回归开始。它使用样本内贝叶信息准则（`BIC`），我们将其调整为忍受度为\
  \ 5 的早停准则。由于算法的前向性，当 `BIC` 在额外增加五个预测器后不再改进时，我们就可以停止搜索。Hastie *et al.* (2009) 证明样本内信息准则是预期预测误差的良好估计，当没有足够的数据将样本划分为训练和验证集时，它们是良好的统计量。\n\
  \n#### 4.4.1.2. 惩罚线性模型（LASSO, ridge and elastic net）\n\n让我们忽略时间维度以简化符号。弹性网（elastic\
  \ net）用 `L[1]` 和 `L[2]` 惩罚扩展了最小二乘损失函数。它包含了 LASSO 和岭回归作为特例。为了找到弹性网解，我们求解：\n\n![image](img/eq4-3.jpg)\n\
  \n其中 `λ` 和 `α` 是需要校准的超参数。`λ` 是正则化强度，`α` 是两个惩罚之间的弹性。如果我们设置 `α` = 1，我们就得到 LASSO 解决方案，而当\
  \ `α` = 0 时，我们得到岭回归估计器。为了保持一致性，我们使用“循环坐标下降”法求解所有模型，尽管岭估计器有闭式解。Friedman *et al.*\
  \ (2010) 证明，对于带有弹性网惩罚的模型，坐标下降是快速且高效的，特别是当沿正则化路径搜索解时，即为固定的 `α` 值寻找最优的 `λ`。\n\n对于所有三个模型，`λ`\
  \ 均通过早停和从 `λ` 开始探索多达 100 个值进行校准，其中 `λ` 定义为足够大到将所有斜率置零的最小 `λ` 值，即模型中仅留一个截距。随着 `λ`\
  \ 的减小，正则化被放松。算法在探索了 100 个 `λ` 值或满足早停参数时停止。\n\n因此，LASSO 和岭回归问题分别通过通过寻找 `α` = 1 和\
  \ `α` = 0 的最优 `λ` 来求解。对于弹性网，我们使用笛卡尔搜索来寻找 `α`，在集合 `{0, 0.01, … , 1}` 中搜索。\n\n####\
  \ 4.4.1.3. 广义线性模型 (GLM)\n\n传统的 GLM 在线性模型中引入非线性，添加了预测器的样条序列展开。我们实现了一个不同的 GLM 版本，我们在模型中加入了特征的交叉积：\n\
  \n![image](img/eq4-4.jpg)\n\n然后我们向目标函数添加 LASSO 惩罚以正则化模型。\n\n#### 4.4.1.4. 回归树\n\n\
  回归树是根据特征值划分响应的简单方法。树生长到指定的最大深度，该深度代表一个需要校准的超参数。在我们的框架中，这等同于根据特征值将股票分类，并最终取留在叶节点中的股票的平均收益，即树的最终分支中的类别。因此，如果两只股票落在同一个类别，它们对该特定树的预测收益将是相等的。然而，结合多棵树可以使横截面预测更加平滑。\n\
  \n具有 *J* 个叶节点且对于给定深度的树可以表示为：\n\n![image](img/eq4-5.jpg)\n\n\n\n\n其中 `θ[j]` 是区域 `R[j]`\
  \ 的预测，`Θ` 是参数集。树的构建如下：对于每个分支（从 1 到最大深度 `L`）和每个特征，我们构建一个直方图。在每个可能的划分点，根据直方图的阈值对股票进行分区，并为每个划分计算损失（也称为“不纯度”）。最优划分（哪个特征以及直方图的哪个阈值）被计算为损失最小的那个。与\
  \ Gu 等人（2018）类似，我们对树的每个分支使用 `L[2]` 不纯度，这意味着 `θ[j]` 的最优选择仅为：\n\n![image](img/eq4-6.jpg)\n\
  \n其中 `|R[j]|` 是分区 `R[j]` 中的股票数量。在下一步中，使用剩余特征在每个分支上运行相同的算法。当没有更多数据可划分时，算法停止。为了进行划分，我们将叶子节点的最小观测数设为\
  \ 10（H2O 默认值为 10）。因此，单棵树会在满足以下情况时停止分裂：没有更多数据可划分、达到最大深度、或没有满足“最小划分改进”参数的划分（H2O 默认值为\
  \ 10^(–5)）。\n\n用于划分的直方图类型对算法有影响。对于所有基于树的模型，我们使用不同类型的直方图（“均匀自适应”、“全局分位数”和“随机”）来生长集成中的每棵树，以便我们可以多样化“直方图风险”，即使用不适用于特征分布的直方图的风险。\n\
  \n#### 4.4.1.5. 梯度提升树 (GBM) 和随机森林 (RF)\n\n如果没有正则，回归树容易过拟合。一个主要问题是它们预测的方差很大。数据的微小变化通常会导致非常不同的划分序列。这种不稳定的主要原因是该过程的层次性质：顶层划分的误差会向下传播到其下方的所有划分。\n\
  \n为了缓解这个问题，我们实现了两种类型的正则化：提升（boosting）和装袋（bagging）。两种方法都由“树的集成”。在 H2O 中，梯度提升树被称为梯度提升机（GBM）。我们在整个章节中使用相同的术语。\n\
  \n回归树的第一种正则化方法称为提升，产生了一种名为梯度提升回归树或梯度提升机的技术。Friedman 等人（2000）将提升从分类问题扩展到梯度提升回归树。我们首先生长一个浅树（例如深度\
  \ `L` = 1）。这棵树是一个弱学习器。然后，我们使用第一棵树的残差生长一棵相同深度 `L` 的第二棵树。收益率预测计算为这两棵树预测之和，其中基于残差的预测通过一个\
  \ 0 到 1 之间的因子进行收缩，以避免树对残差过拟合（即类似于收益树和残差树预测的加权平均）。该算法迭代直到总共达到 `B` 棵树，产生一个预测更稳定的树集成。对于固定的树深度，这可以表示为：\n\
  \n![image](img/eq4-7.jpg)\n\n其中树是以前向分阶段的方式计算的。在每一步中，我们求解：\n\n![image](img/eq4-8.jpg)\n\
  \n我们使用梯度提升机的随机版本，每棵树都是使用特征矩阵 50% 行的样本生长的。Hastie 等人（2009）声称这种版本的梯度提升机在预测上优于随机森林。梯度提升机训练非常快，因此我们使用笛卡尔搜索搜索可能的收缩因子。此外，我们使用早期停止规则来决定树的数量和最大深度。算法首先尝试生长并组合最多\
  \ 500 棵深度为 1 的树，然后尝试生长并组合最多 500 棵深度为 2 的树，依此类推。我们将树深度限制为 `L` = 5，因为梯度提升机基于组合几棵浅树。\n\
  \n回归树的第二种正则称为装袋，产生了一种名为随机森林的技术。树构建算法与梯度提升机中使用的相同，但每棵树都是使用不同类型的直方图生长的。主要区别在于梯度提升机组合了若干棵浅树，而随机森林构建深深的树并平均它们的预测值。这用于减少方差：\n\
  \n![image](img/eq4-9.jpg)\n\n#### 4.4.1.6. 神经网络 (NN)\n\n神经网络允许预测变量之间进行复杂的交互的非线性模型。我们使用前馈全连接神经网络（也称为序列网络），具有三个隐藏层分别由\
  \ 32、16 和 8 个神经元组成，Gu 等人（2018）发现这种结构具有良好的预测能力。具有单层和 `M` 个神经元的神经网络简化版可以写为：\n\n![image](img/eq4-11.jpg)\n\
  \n![image](img/eq4-12.jpg)\n\n神经网络通常需要估计大量的参数，在上述的公式中，有 `M(P + 1)` 个 alpha 和 `M\
  \ + 1` 个 beta，其中 `P` 是预测变量的数量。作为激活函数 `f`，我们使用流行的整流线性单元 (ReLu)，其定义为：\n\n![image](img/eq4-13.jpg)\n\
  \n激活函数用在每个隐藏层中。最后一层仍然是密的，但没有激活函数，即来自上一个隐藏层的输出通过线性组合形成收益预测。\n\n\n\n\n特别是，我们创建了一个由五个神经网络组成的集成模型，每个网络都通过对超参数空间进行随机网格搜索来校准。这五个预测结果通过简单平均值或与验证集\
  \ `MSE` 反比成比例的线性权重进行组合。通常情况下，我们倾向于使用等权重平均值，以分散*事前（*ex ante*）模型风险。关于校准的更多信息，请参见下一节。\n\
  \n### 4.4.2. 模型校准\n\n在本节中，我们简要回顾了训练机器学习模型的现有方法，并介绍了我们在本章中将使用的方法。每个模型除了参数估计外，还需要校准一组决定其架构和“复杂度”的超参数。例如，逐步选择法有一个超参数是预测变量的数量，`LASSO`\
  \ 算法需要校准 `L[1]-penalty`（惩罚项）等。在由超参数定义的模型结构内部，我们估计控制模型的参数，例如神经网络中的权重、线性模型中的斜率以及树模型中的分裂阈值。\n\
  \n为了这一目的，样本期通常被分为三个子样本，分别称为*训练*（training）、*验证*（validation）和*测试*（test）样本。实证文献中采用了两种主要方法。\n\
  \n第一种方法（“验证”）是将样本内观测值沿时间维度划分为两个子样本。较早的样本用作训练集，较晚的样本组成验证集。\n\nGu *et al.* (2018)\
  \ 采用了“验证方法”，使用长时间序列、扩展窗口估计以及股票特定变量与宏观变量之间的交互作用。这意味着在模型中嵌入了风格因子特征，但它假设训练样本包含完整的经济周期，以便模型能够学习不同类型的股票（例如增长型和价值型）在经济周期不同阶段的表现。Gu\
  \ *et al.* (2018) 使用了 1957 年至 2016 年美国市场上市的 30,000 只股票样本，并将样本划分为 18 年训练样本（1957–1974）、12\
  \ 年验证样本（1974–1986）和 30 年的样本外测试。他们每年重新拟合一次模型，即将参数和超参数固定一年，并使用新可用特征创建每月预测。一年后，他们使用扩展窗口训练样本（18,\
  \ 19… 年）重新拟合模型，同时保持样本末的验证期为 12 年。\n\n为了校准超参数，他们利用验证期（始终位于样本末尾）计算出的汇总残差构建了各种目标函数。这确保了我们根据模型在样本最新部分的预测能力对其进行校准。\n\
  \n第二种方法（“k-折交叉验证”）将样本内信息分为 *k* 个子样本（“折”）。在 *k* 个步骤中的每一步，都会选择一折作为验证集，而其余组成训练集。这种技术面临一些显著的挑战。首先，它需要大量训练数据才能在子样本中有效。其次，它通常在计算上是密集的。第三，当时间维度很重要时（如我们的设置所示），由于潜在的结构性突破，该方法可能并不适用。\n\
  \nGuida and Coqueret (2019) 使用了“交叉验证方法”的变体，使用较短的训练/验证窗口估计模型，本质上假设没有足够的数据按时间顺序将样本划分在训练和验证之间。这种方法的优点是使用了更近的特征信息，但计算量更大。Guida\
  \ and Coqueret (2019) 使用三年的滚动窗口通过 `XGBoost` 拟合树模型，其中前两年用于训练，最后一年用于验证。在这种情况下，*k*-折交叉验证通过将股票池（包括训练和验证时间段内）划分为\
  \ *k* 个随机篮子来实现的。例如，Guida and Coqueret (2019) 使用了五折交叉验证，模型使用训练样本在池的 4/5 上进行拟合，并使用验证样本在剩余\
  \ 1/5 的股票上进行交叉验证。这与机器学习文献中使用的传统交叉验证方法不同，后者意味着“在过去测试”。通常，验证是在样本的 20% 上进行的，因此 `k`\
  \ = 5 是一个很好的经验性法则。\n\n我们大体遵循了 Gu *et al.* (2018) 的结构，并使用扩展训练/验证窗口训练模型，窗口长度从 16 年开始（从\
  \ 1995 年 1 月到 2010 年 12 月）。验证样本始终由样本内窗口末的八年组成。校准模型后，我们将所有权重和超参数固定一年，并根据新获取的样本外数据生成每月股票收益预测。因此，我们的测试样本为\
  \ 12 个月。然后训练窗口增加一年并重复该过程。图 4.1 提供了该过程的图形表示。\n\n![¶ 图 4.1. 训练、验证和测试的样本划分（来源: Macquarie\
  \ Quantitative Strategy, 2019）](img/fig4-1.jpg)\n\n¶ 图 4.1. *训练、验证和测试的样本划分（来源: Macquarie\
  \ Quantitative Strategy, 2019）*\n\n## 4.5. 预测美国股票收益\n\n在本节中，我们分析了 1995 年至 2018 年\
  \ MSCI USA 成分股的收益预测。由于特征和响应都经过了归一化，我们不预测原始收益，而是预测它们的排名。因此，我们使用信息系数（ICs）而不是拟合的 *R*²\
  \ 来评估模型性能。然后我们模拟了一种简单策略，根据模型预测对股票进行排序，买入最高五分位数的股票并卖出最低五分位数的股票。策略是等权重的。我们比较了基于每个模型的股票特定预测以及一个“集成”模型的策略，并对梯度提升机、随机森林和神经网络的预测取平均值。对于神经网络模型，我们同时使用了五个神经网络预测的等权重平均值\
  \ (`NN_ew`) 和根据验证集 `MSE` 反比成比例的线性权重的加权平均值 (`NN_msew`)。\n\n### 4.5.1. 信息系数\n\n图 4.2\
  \ 报告了验证和测试的平均 IC。验证期始终是测试前的八年样本。每个测试样本为一年，我们使用截至 12 月底数据训练的模型预测未来一个月的收益。样本外时期从 2011\
  \ 年 1 月开始，到 2018 年 11 月底结束。\n\n![图 4.2. 信息系数, MSCI USA（来源: Macquarie Quantitative\
  \ Strategy, 2019）](img/fig4-2.jpg)\n\n**图 4.2. *信息系数, MSCI USA（来源: Macquarie Quantitative\
  \ Strategy, 2019）*]\n\n\n\n\n\n`OLS` 在验证和测试中的表现均为最差。这并不意外，很可能是由于特征之间的多重共线性导致的。这一点被\
  \ `ridge` 估计器的优异性能所证实，该估计器通常在公司金融应用中用于精确处理相关性回归变量。此外，一个简单的 `LASSO` 估计器也优于 `OLS`，而\
  \ `elastic net` 显示出过拟合迹象，从验证到测试的泛化能力较差。`ridge` 模型出人惊讶的泛化能力表明，包含所有可用变量是有益的，而不是通过惩罚线性模型仅选择其中少数变量。一个包含所有特征及其两两交互作用且带有\
  \ `L[1]-penalty` 的简单 `GLM`，其表现也与 `ridge` 模型相当。`step model`（前向逐步选择法）的表现仅略微优于 `OLS`，尽管它的泛化能力更好。\n\
  \n对于这个股票池，表现最好的模型是 `random forest`，它在验证中显示出较大的平均 IC（接近 4%），在测试中的 IC 几乎相同，显示出极佳的泛化能力。`gradient-boosted\
  \ machine` 的表现优于大多数线性模型，但它比 `ridge` 模型和 `GLM` 更过拟合。等权神经网络和 `MSE-weighed neural network`\
  \ 加权方案显示出非常相似的结果，其中 `MSE-weighed neural network` 表现出略微过拟拟倾向。我们建议始终使用等权方案以分散*事前*（ex\
  \ ante）模型风险。神经网络在 `MSCI USA` 股票池中的表现与 `gradient-boosted machine` 非常相似。它们显示出一些过拟合迹象，但在测试样本中仍达到了尚可的\
  \ 3% 平均 IC。\n\n请注意，尽管 `OLS` 是该股票池中最表现差的模型，但其表现并没有像 Gu *et al.* (2018) 研究中那么糟糕，他们报告了使用\
  \ `OLS` 模型进行预测回归时得到非常负的 *R*²*。这是因为我们只使用了股票特有的特征，而他们添加了与宏观变量的交互作用。在这样的框架下，`OLS` 无法区分相关变量和噪声，并不意外。\n\
  \n为了可视化模型随时间变化的表现，图 4.3 绘制了每个重新估计日期验证和测试样本的平均 IC。我们还绘制了使用 `OLS` 获取的 IC 作为基准。由于我们使用了扩展训练窗口，从这些图中我们也可以直观地看到模型性能对可用数据量的依赖性。从左面板可以看出，数据越多，效果越好：随着训练窗口的扩大，最近八年的\
  \ IC 变得越来越高。这些模型在测试中表现也良好，平均（年度）IC 在 2017 年之前一直为正，即直至 2017 年 12 月。然而，这并不*总是*意味着样本外平均\
  \ IC 为正，因为平均 IC 在 2018 年转为负。\n\n![图 4.3. 验证（八年）和测试（一年）的平均 IC，MSCI USA（来源：Macquarie\
  \ Quantitative Strategy, 2019 年 1 月）。需查看此图彩色版本请参见 www.iste.co.uk/jurczenko/machine.zip](img/fig4-3.jpg)\n\
  \n**图 4.3.** *验证（八年）和测试（一年）的平均 IC，MSCI USA（来源：Macquarie Quantitative Strategy, 2019\
  \ 年 1 月）。需查看此图彩色版本请参见 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 4.5.2. 多空策略\n\n图 4.4 报告了等权多空策略的性能指标。回测期较短，但考虑到需要训练每个模型，数据可用性有限。我们报告了年化收益率、波动率、信息比（IC）和最大回撤。为了分析策略的分布，我们计算了收益为正的月份比例（hit\
  \ rate），以及在多空收益为零假设下的 t 统计量，假设自由度为。\n\n![图 4.4. 回测结果，美国（基于等权篮子)](img/fig4-4.jpg)\n\
  \n**图 4.4.** *回测结果，美国（来源：Macquarie Quantitative Strategy, 2019 年 1 月)*\n\n结果表明，`OLS`\
  \ 和 `stepwise regression`（我们的线性基准）在风险调整收益方面被所有机器学习替代方案超越。基于树的模型表现最好，IC 为 1.13 (`gradient-boosted\
  \ machine`) 和 1.39 (`random forest`)，大约是 `OLS` 模型的两倍。`Alpha` 模型表现良好，其 IC 为 0.82，接近神经网络。作为我们提出的模型预测能力的总结，组合模型（ensemble）的\
  \ IC 为 1.18，处于较高水平。虽然在较短样本期内很难衡量下行风险，但我们注意到机器学习模型在回撤、偏度方面优于 `Alpha` 模型。这一结果的一个可能解释是\
  \ `Alpha` 模型受到动的影响。为了更好地评估机器学习模型在样本期内的选股能力，将其与 Fama–French (1992, 2015) (FF) 因子进行比较。我们根据市值然后根据相关信号对股票进行双排序，构建等权组合。特别是，除了市值以外的所有因子，我们都关注市值中位数以上的公司（即）(9).此外，我们还报告了标准市值因子的结果。\n\
  \n图 4.5 显示了每个因子加上五个信号组合的表现。结果显示，从 2011 年 1 月到 2018 年 11 月，价值（高账面）和市值（小）是表现最差的因子，IC\
  \ 分别为 -0.28 和 -0.49 其他因子（投资、动量和盈利）显示出正 IC，但它们的正收益不足以产生组合策略（combination）的正 IC。后者在我们的回测期间产生了负\
  \ IC (-0.04)。因此，由于这些因子代表了我们特征所涵盖的广泛投资风格，机器学习模型在美国面临着非常艰巨的任务。\n\n![图 4.5. 美国 Fama–French\
  \ 因子表现，2011 年 1 月至 2018 年 11 月（来源：Kenneth French 网站，Macquarie Quantitative Strategy,\
  \ 2019 年 1 月）。对于账面、投资、动量和盈利，我们使用的是因子的大市值版本。组合组合等权](img/fig4-5.jpg)\n\n图 4.6 报告了策略的累计收益。意乎料的是，不同策略之间的收益时间模式非常。这是由于我们对所有模型使用了相同的构建模块。`OLS`\
  \ 显然是表现最差的，累计收益的大部分差距出现在样本外的前两年以及 2015 年到 2016 年之间。\n\n\n\n\n\n![图 4.6. 随时间变化的模拟性能，MSCI\
  \ USA（来源：Macquarie Quantitative Strategy, 2019 年 1 月）。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip](img/fig4-6.jpg)\n\
  \n#### 图 4.6. *随时间变化的模拟性能，MSCI USA（来源：Macquarie Quantitative Strategy, 2019 年 1\
  \ 月）。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip*\n\n我们的 Alpha 模型在总收益率方面与机器学习驱动的替代方案相当；然而，它表现出更高的波动性，特别是在\
  \ 2015 年至 2016 年间风格剧烈切换期间，当时价值风格经历了一段严重的低迷。非线性模型（集成）的组合似乎通过限制 2016 年初的回撤，略优于所有其他替代方案。\n\
  \n#### 4.5.3. 收益率与 Alpha 模型的相关性\n\n图 4.7 报告了 Macquarie Alpha 模型与各主要机器学习替代方案之间的收益率相关性。我们还报告了\
