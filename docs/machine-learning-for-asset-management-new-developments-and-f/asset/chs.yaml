  \ 2005; Maillard et al. 2010; Roncalli 2013）。目标是定义一个凸风险度量 `R(x)` 并根据某些指定的风险预算 `RB\
  \ = (RB[1],…, RB[n])` 分配风险，其中 `RB[i] > 0`。这种方法利用了风险度量的欧拉分解性质：\n\n![image](img/eq8-14.jpg)\n\
  \n通过注意到 ![images](img/ieq8-24.jpg) 是资产 `i` 对投资组合 `x` 的风险贡献，风险预算 (RB) 组合由以下方程组定义：![images](img/ieq8-25.jpg)\
  \ `Roncalli` (2013) 显示这等价于求解以下非线性优化问题^(6):\n\n[\\[8.8\\]](#c08.xhtml#ieqn8-8) ![image](img/eqn8-8.jpg)\n\
  \n其中 `λ > 0` 是一个任意正常数。通常，最常用的风险度量是波动率风险度量 ![images](img/ieq8-29.jpg)(Maillard et\
  \ al. 2010) 和基于标准差的风险度量 ![images](img/ieq8-30.jpg)，其中 `r` 是无风险利率，`ξ` 是正数标量（Roncalli\
  \ 2015）。特别是，后者包含了高斯值在风险 ![images](img/ieq8-31.jpg) 和高斯预期尾部 ![images](img/ieq8-32.jpg)\n\
  \n风险预算法在许多资产管理领域已经取代了 MVO 方法，特别是在因子投资和替代风险溢价的情况下。尽管如此，我们注意到问题 [\\[8.8\\]](#c08.xhtml#eqn8-8)\
  \ 并不是二次规划问题，而是对数障碍问题。因此，风险预算框架开启了投资组合优化的新世界，这并不一定是 QP！这一点更加真实，因为 MVO 投资组合面临着稳健性问题（Bourgeron\
  \ et al. 2018）。投资组合配置的正则化随后已成为行业标准。事实上，在 MVO 目标函数中添加 `ℓ[1]`-范数或 `ℓ[2]`-范数惩罚函数是很常见的。然而，这类惩罚在二次规划设置中是可以处理的。随着机器人投顾的发展，非线性惩罚函数开始出现，特别是对数障碍惩罚函数。这些正则化技术导致了投资组合优化的非二次规划世界。\n\
  \n这个非 QP 金融世界的成功将取决于这些复杂优化问题能多快多容易地解决。Griveau-Billon et al. (2013)、Bourgeron et\
  \ al. (2018) 以及 Richard and Roncalli (2019) 已经提出的数值算法在某些特殊情况下承担着这些工作。下一节将回顾可能与 QP\
  \ 数值算法竞争的候选算法。\n\n## 8.3 机器学习优化算法\n\n机器学习行业经历了与投资组合优化类似的轨迹。在 20 世纪 90 年代之前，统计学习主要关注从数值角度来看容易求解的模型。例如，线性（和岭回归）具有解析解，我们可以使用\
  \ Newton–Raphson 算法求解逻辑回归，而监督和无监督分类模型^(7) 则由执行奇异值分解或广义特征值分解组成。20 世纪 90 年代出现了三个深刻改变机器学习方法的模型：神经网络、支持向量机和\
  \ lasso 回归。\n\n自 Rosenblatt (1958) 的开创性工作以来，神经网络已被广泛研究。然而，首次工业应用追溯到 LeCun 等人 (1989)\
  \ 关于手写邮政编码识别的研究。20 世纪 90 年代初，一股新的热潮随之出现，出现了许多适合学生的教程，其中最流行的是 Bishop (1995)。对于神经网络，在校准方面出现了两个主要问题：待估计的大量参数以及全局最大值的缺失。20\
  \ 世纪 80 年代流行的传统数值优化算法^(8) 无法应用于神经网络。随后提出了新的优化方法。首先，研究人员考虑了比最陡下降更复杂的学习规则（Jacobs 1988），例如\
  \ Polyak (1964) 的动量法或 Nesterov 加速梯度法 (Nesterov 1983)。其次，下降方法通常不是在全观测样本上执行，而是在每次迭代中变化的观测子集上执行。这是批量梯度下降\
  \ (BGD)、随机梯度下降 (SGD) 和小批量梯度下降 (MGD) 的基础思想。自适应学习方法和批量优化技术标志了梯度法的复兴。支持向量机的发展是机器学习技术的另一个重要步骤。与神经网络一样，它们可以被看作感知器的扩展。然而，它们具有良好的理论性质和几何框架。一旦支持向量机首次开发用于线性分类，它们就被扩展到了非线性分类和回归。称为硬边界分类的原始问题可以建模为二次规划问题。然而，求解\
  \ SVM 分类时，对偶问题（也是 QP 问题）通常优于原始问题，因为解具有稀疏性（Cortes and Vapnik 1995）。多年来，原始硬边界分类已扩展到其他问题：使用合页损失的软边界分类、使用平方合页损失的软边界分类、最小二乘\
  \ SVM 回归、ε-SVM 回归、核机器（Vapnik 1998）。所有统计问题共享相同的校准框架。原始问题可以转化为 QP 问题，这意味着相应的对偶问题也是\
  \ QP 问题。再次，我们注意到统计方法的成功和突出与优化算法的效率有关，显然支持向量机从 QP 公式中受益匪浅。然而，从工业角度来看，支持向量机存在某些局限。事实上，如果原始\
  \ QP 问题的维度是特征（或参数）数量 `p`，对偶 问题的维度就是观测数量 `n`。当观测数量超过 100,000 有时达到数百万时，求解对偶问题变得绝对不可能。这意味着需要开发更适用于大规模优化问题的新算法。\n\
  \nLasso 回归是 20 世纪 90 年代让机器学习引起关注的第三种突破方法。与岭回归一样，lasso 回归是一种正则化线性回归，其中 `ℓ[2]`-范数惩罚被\
  \ `ℓ[1]`-范数惩罚取代（Tibshirani 1996）。由于 `ℓ[1]` 正则强制解是稀疏的，它主要被用于变量选择，然后用于模式识别和线性模型的稳健估计。为了寻找\
  \ lasso 解，增广 QP 问题技术被广泛使用，因为它容易实现。将 lasso-岭正则化扩展到其他 `ℓ[p]` 范数是直观的，但这些方法从未流行过。主要原因是现有的数值算法不足以使这些模型可处理。\n\
  \n\n\n\n因此，定量模型的成功可以从两个条件来解释。首先，模型必须具有明显的吸引力。其次，模型必须通过一种高效的数值算法求解，且该算法易于实现或在数学规划软件中可用。如前所述，二次规划和梯度下降法一直是许多统计和金融模型的关键。在下文中，我们考虑四种由于在机器学习中的应用而流行的算法和技术：坐标下降法、交替方向乘子法（ADMM）、近端算子和\
  \ Dykstra 算法。特别是，我们将说明如何利用它们来解决复杂的优化问题。\n\n### 8.3.1 坐标下降法\n\n#### 8.3.1.1 定义\n\n\
