  \ limits`、`transaction costs` 等施加了约束。最重要的是，这三个非 扩展可以结合使用。\n\n随着量化策略（智能贝塔、因子投资、替代风险溢价、系统化策略、机器人顾问等）的发展，资产管理行业在过去五年中发生了巨大的变化。这仅仅是一个开始，我们认为替代数据、机器学习方法和人工智能在未来将大规模地塑造投资流程。本章是对这一趋势的说明，并展示了机器学习优化算法如何让我们摆别传统的投资组合管理\
