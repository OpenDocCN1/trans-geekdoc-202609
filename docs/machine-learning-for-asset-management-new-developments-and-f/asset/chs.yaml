  \ Springer, New York.\n\n# 3 稀疏预测回归：统计性能与经济意义\n\n我们提出并评估了多种罚回归方法，用于参数不确定的数据密集环境下进行预测和经济决策。在实证中，我们探索了跨资产类别（如股票、债券和货币）以及资产类别内部替代策略（例如股票领域的动量和价值）的统计和经济性能。主要结果表明，既能收缩模型空间又能正则化剩余回归参数的惩罚（例如弹性网络惩罚），在统计和经济方面往往优于竞争性的稀疏和稠密方法。\n\
  \n## 3.1. 引言\n\n\n\n\n计量经济学、统计学和机器学习领域的近期进展，结合日益增长的大数据集可用性，激发了金融经济学家对能够处理许多解释变量的预测模型的兴趣。然而，并非所有预测变量都是相关的。因此，决策者往往会通过参考现有的学术文献以及公认的经济理论来预先选择最重要的候选预测变量。尽管如此，决策者仍然面临着数十个甚至上百个可能相关的预测变量，这使得计量经济学家、投资者或政策制定者面临着在数据富集环境中预测资产收益的艰巨任务。\n\
  \n重要的是，标准技术（如普通最小二乘法、极大似然估计或带有无信息先验的贝叶斯推断）的样本外性能往往随着预测变量数量（相对于观测值数量）的增加而恶化，这一事实被称为“维度灾难”。\n\
  \n在线性设置下证明能有效处理维度灾难的一类模型是惩罚回归模型。在一般形式下，惩罚回归是一种线性模型，通过在损失函数中添加约束条件（即惩罚项），对模型中过多的变量进行惩罚。根据惩罚项的形式形式，惩罚回归要么收缩变量空间——通过将某些回归系数置为零——要么正则化\
  \ `beta` ——通过将估计值平滑地移向接近零但并不完全等于零的小值。收缩线性回归最常见的例子是 `Lasso`，它由 Tibshirani (1996)\
  \ 最初提出。正则化回归模型的常见例子是所谓的 `Ridge` 回归，它由 Hoerl 和 Kennard (1970) 最初引入。与采用 `L1` 范数惩罚的\
  \ `lasso` 不同，`ridge` 惩罚基于 `L2` 范数，这防止了系数收缩至零：在 `ridge` 回归中，对结果贡献较小的变量其载荷接近零，尽管没有一个变量被精确置为零。这意味着虽然\
  \ `lasso` 是一个稀疏回归模型，但 `ridge` 仍然属于稠密线性回归模型的子类（讨论见 Giannone *et al.* 2018）。\n\n在本章中，我们将评估一组大型惩罚回归模型在数据富集环境中预测超额收益的能力。预测资产收益在实证金融学中起着核心作用。Kozak\
  \ *et al.* (2019) 和 Gu *et al.* (2018) 的近期工作展示了机器学习方法（如传统正则化技术和树模型）在处理这一挑战方面的潜力。然而，迄为止，关于预测收益新方法的实证证据主要集中在单个美股上。因此，本章调查了使用惩罚回归方法预测不同资产类别（如股票、货币以及国债、公司债和主权债券）收益，以及同一资产类别内不同策略（例如股票和货币中的动量和价值投资组合收益）的潜在益处。\n\
  \n### 分析框架与数据\n\n我们刻意将分析限制在 `linear` 框架内。通过这样做，我们的结果：(1) 与小数据设置下基于线性预测系统的标准方法更具直接可比性（例如参见\
  \ Barberis, 2000; Pastor and Stambaugh, 2009）；(2) 孤立了监督机器学习方法相对于经典（线性和无监督）方法（如主成分回归，后者常用于处理数据富集环境）的优势。\n\
  \n为了预测收益，我们同时利用了资产特定的预测变量和来自 `FRED-MD` 数据库的大量经济变量。`FRED-MD` 数据库包含了多个类别的众多宏观变量，即：产、收入和劳动力市场；消费、订单和库存；货币和信贷；收益率和汇率；住房和通胀。因此，这组变量捕捉了宏观经济中几个可能相关的风险。除了这些聚合宏观变量外，我们还考虑了一组聚合财务变量，例如股利支付率、违约利差和净权益发行，取自\
  \ Welch and Goyal (2007)。另一方面，资产特定的预测变量根据 Campbell 和 Shiller (1988) 的收益对数线性化会计等提供了依据。这项研究的精神是模拟一个既拥有聚合宏观和财务信息，又拥有资产特定预测变量的投资者/决策者，以此构建预期未来超额收益。\n\
  \n### 方法论\n\n我们为每个惩罚回归规范采用了贝叶斯估计框架（例如参见 Park and Casella, 2008; Hans, 2009; Carvalho\
  \ *et al*., 2010; Kyung *et al*., 2010 等）。贝叶斯方法相对于标准方法有几点优势：首先，惩罚项可以自然地表示为收缩先验。通过这样做，惩罚回归模型可以转化为一个包含性的层次模型，允许我们一步到位地估计惩罚参数和回归参数。当需要同时估计全局和局部（即特定于预测变量）惩罚参数时，这一事实特别有用，因为顺序交叉验证程序往往会导致过度的收缩（例如参见\
  \ Zou and Hastie 2005）。其次，贝叶斯框架明确考虑了参数不确定性，并为感兴趣的参数自然地生成置信区间，这在频率派设置中很容易实现的。事实上，Kyung\
  \ *et al.* (2010) 显示，经典的惩罚回归程序可能导致方差估计失效。第三，贝叶斯估计依赖于马尔可夫链蒙特卡洛 (`MCMC`) 采样，与标准优化程序相比，它对噪声信号、观测离群值以及非凸惩罚中常见的多峰问题更具稳健性。\n\
  \n我们探讨了每种方法的计量经济学基础及其在不同资产类别中的经济收益。主要结果显示，通过将某些回归系数置零来 `shrink` 模型空间，并对剩余回归系数进行正则化的惩罚项，其表现往往优于稠密（如\
  \ `ridge regression`）和稀疏（如 `lasso regression`）方法。这种惩罚回归被称为 `elastic net`，由 Zou 和\
  \ Hastie (2005) 引入。特别是，我们通过简单的轮换交易策略证明，投资者愿意支付正费用以获取 `elastic net` 对给定投资组合的预测内容，而不是依赖简单的历史均值估计作为主要的交易信号。最后，我们证明了收缩程度（等同于稀疏程度）往往随时间演变，并在不同资产类别之间存在差异。这意味着在数据生成过程中假设稀疏性是恒定的，在统计和经济上都可能是有代价的（关于此点的深入讨论见\
  \ Bianchi *et al*. 2019b）。\n\n\n\n本章其余部分的结构如下。第 3.2 节讨论了机器学习在金融经济学中的应用。第 3.3 节描述了数据，特别强调了实证研究中调查的各种资产类别和策略。第\
  \ 3.4 节概述了分析中采用的收缩先验。第 3.5 节报告了我们在预测各种资产类别收益方面的结果。\n\n## 3.2 相关文献\n\n本章贡献于日益增长的文献，这些文献探索了机器学习方法进行收益预测。关于时间序列收益预测的文献过于庞大，无法在此处进行综述。因此，在本章中，我们仅尝试在不断增长的机器学习与资产定价近期文献中定位我们的贡献。\n\
  \n在实证金融领域探索机器学习的早期尝试包括 Kuan and White (1994)、Lo (1994)、Hutchinson *et al.* (1994)\
  \ 以及 Yao *et al.* (2000)，他们引入了人工神经网络的使用。更近期的工作将机器学习技术应用于横截面收益预测。这些论文侧重于基于滞后公司特征（在较小程度上基于宏观预测因子）来预测美国每月股票收益^(2)。与这些论文不同，我们预测的是异常股票组合收益，例如价值和动量收益。在这方面，我们的分析补充了利用估值率预测投资组合收益的因子择时文献（例如，Asness\
  \ *et al.*., 2000；Cohen *et al.*., 2003；Baba-Yara *et al.*., 2018；以及 Arnott *et\
  \ al.*., 2019）。我们的工作也与 Nalbantov *et al.* (2006) 相关，他们将带有技术和经济变量的支持向量回归用于把握美国规模溢价和价值溢价。近期的两篇论文分别使用\
  \ group-lasso 预测国债收益（Huang and Shi 2018）和一种被称为“分组集成”的新型神经网络（Bianchi *et al.* 2019a），证明了宏观变量中包含了债券收益率中不包含的信息，这些信息对预测债券有用。这些论文预测的是单个期限的债券收益，而我们预测的是经过久期标准化的跨期限超额收益的平均值，以避免过度加权特定期限。\n\
  \n我们对美国整体股票溢价可预测性的调查主要灵感源于 Welch and Goyal (2007) 以及 Rapach *et al.* (2013)^(3)的工作。Welch\
  \ and Goyal (2007) 显示，大量的经济变量会导致样本外表现很难通过历史均值来超越。然而，Rapach *et al.* (2013) 显示，结合各个模型的预测结果可以提高样本外股票溢价的预测。Rapach\
  \ *et al.* (2013) 使用弹性网络研究了滞后美国收益在预测非美国工业化国家股票收益中的作用。此外，Feng *et al.* (2018) 和 Rossi\
  \ (2018) 最近强调了非线性在预测整体股票收益中的作用。在这些论文中，没有一篇研究过 FRED-MD 宏观变量集在预测收益中的作用。此外，我们对资产收益可预测性的稳健收缩先验（如马蹄形）以及基于分组的方法（如\
  \ group-lasso）的分析在文献中是新的。\n\n最后，我们对货币价值和动量策略可预测性的分析补充了 Baba-Yara *et al.* (2018)\
  \ 的分析，他们显示价值价差可以预测货币市场的价值收益^(4)。\n\n## 3.3 数据：投资组合与预测因子\n\n在本节中，我们提供了实证研究中使用的资产收益和预测因子的细节。整个过程中，我们使用月数据并预测一个月的持有期收益。唯一的例外是国债，我们关注的是一年持有期收益。接下来，我们描述了每种资产类别使用的收益策略：\n\
  \n*   – 整体股票市场：我们使用了来自证券价格研究中心 (CRSP) 1963 年至 2016 年月末值的标普 500 指数收益。股票收益是标普 500\
  \ 指数的连续复利收益率，包括股息。超额收益是来自 Ken French 数据库的美国国库票收益率。\n*   – 股票组合：我们预测价值和动量收益。为了构建价值收益，我们每月根据价值指标的（横截面分布，见下文）形成价值加权的十分位组合投资组合。美国单只股票数据来自\
  \ CRSP 和 Compustat。遵循 Asness *et al.* (2013)，我们只在价值和动量策略中包含那些在 CRSP 中累计占总市值 90%\
  \ 的股票。我们将分析限制在 1963 年 1 月至 2016 年 12 月的样本中。\n*   – 货币：我们预测价值和动量收益。为了构建价值收益，我们通过在排名值的中位数处划分货币（基于价值指标的横截面分布，见下文），形成一个等权的高低收益组合。我们获得了澳大利亚、加拿大、德国（与欧元合并）、日本、新西兰、挪威、瑞典、瑞士、英国和美国的现汇和远期汇率。货币的样本期从\
  \ 1976 年 2 月到 2016 年 12 月。\n*   – 国债：我们从 Gurkaynak *et al.* (2007) 获取 1 到 15 年无息国债收益率。我们利用这些收益率计算对数超额。作为一年持有期收益的标准，我们使用一年无息收益率作为无风险利率。然后，我们通过除以\
  \ `n-1` 对债券的超额收益进行缩放：转换后的超额收益的修正久期均等于 1。这使得我们的缩放收益具有相近的标准差，而未缩放收益的这一统计量波动了 10 倍。\n\
  *   – 公司债：公司债价格来自 Lehman Brothers 固定收益数据库、Mergent FISD/NAIC 数据库、TRACE 和 DataStream，这些共同提供了\
  \ 1973 年至 2016 年上市公司债的广泛数据集。令 `P[i,t]` 为 `t` 时公司债 `i` 每面值的价格（包含应息），`C[i,t]` 为利息支付。债券收益为：![images/ieq3-2.jpg]假设公司债\
