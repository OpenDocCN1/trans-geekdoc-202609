  \n24. 24 参见 Choue 和 Pesquet (2011)。\n\n25. 25 为了构建更高效且经过风险管理的投资组合，投资者最近转向通过因子而非传统的资产类别来分散投资组合。我们研究了能够获取资产和因子溢价的有效资产配置生成方法。\n\
  \n26. 26 虽然相关系数是一个流行的选择，但我们特别对基于尾部依赖性的度量感兴趣。\n\n27. 27 这种创新预期能够下行风险。\n\n28. 28 事实上，相应的层次等权重策略似乎与基于统计聚类的策略平相当。\n\
  \n29. 29 在这种情况下，我们使用最小扭曲变换。\n\n\n\n\n本章的贡献在于彻底探讨了层次聚类技术在多资产多因子投资背景下的应用和优点。特别是，它将这些技术与若干种竞争性的基于风险的配置范式进行了对比，例如\
  \ `1*/N`、`minimum-variance`、`standard risk parity` 和 `diversified risk parity`。一个主要的创新是研究了基于尾部依赖聚类的\
  \ `HRP` 策略，而不是标准的基于相关性的聚类。鉴于某些风格因子的高尾部风险，这种方法可能特别相关。层次风险风险平衡策略通常基于两个步骤：首先，层次聚类算法揭示了所考虑投资宇宙的层次结构，产生一个基于树的表示；其次，投资组合权重通过沿层次结构应用配置策略得出，因此整个组合预计将表现出意义上的多元化。\n\
  \n由于协方差矩阵或相关矩阵的估计存在估计误差，基于相关性的聚类和网络对于构建多元化组合具有重要意义，因为它们可以起到过滤作用，产生更可靠的结果，参见 Tumminello\
  \ *et al.* (2010)。在此领域，Lopez de Prado (2016) 认为相关矩阵过于复杂，无法完全分析，且缺乏层次结构。他建议不要分析整个协方差矩阵，而是考虑具有\
  \ `N` 个节点（每个资产一个节点）和仅 `N—1` 条边的对应最小生成树 (`MST`)，即关注最相关的相关性。推导出 `MST` 需要定义距离度量，这通常被称为不相似度量。`MST`\
  \ 自然地与层次聚类算法（称为 `single linkage`）相关。直接地，`MST` 给出了所研究资产的层次结构，并通过对该层次结构应用分配方案可以导出最优投资组合权重。\n\
  \n考虑到多资产多因子投资宇宙，我们必须记住底层因子策略的收益分布可能是高度偏斜的。一种众知的投资风格是 `FX carry trade`，它规定买入短期利率最高的货币并卖出短期利率最低的货币。虽然\
  \ `FX carry trade` 的收益模式在平稳市场中是良性的，但在压力时期，它往往容易发生突发回撤，此时外汇投资者会避开风险较高的货币。显然，这是为了说明为什么在构建风格因子配置时，尾部风险是一个重要考虑因素的典型范例。因此，本章考虑了专门纳入尾部风险管理概念的投资组合构建技术。虽然上述风险平衡配置范式最终围绕维持等波动率风险预算展开，但我们可能会想是否有其他方法更适合应对因子收益的非正态性。在这方面，Boudt\
  \ *et al.* (2013) 提出使风险贡献等于投资组合的 `CVaR`(1)。这种方法避免了组合尾部风险中的风险集中，可以简单地认为是尾部风险平衡。然而，底层的投资组合优化比传统的风险平衡算法更复杂且不够稳健。从这个意义上说，我们将寻求应用基于尾部依赖测量的稳健层次聚类，以显式考虑尾部风险，同时不牺牲投资组合权重的稳健性。\n\
  \n利用不同的连接方法、配置方案和（不）相似度量开发了多种基于层次聚类的配置策略；例如参见 Raffinot (2017)。这些度量通常基于相关系数。为了承认尾部风险，其他学者提出了关注资产在大额亏损期间关联性的度量。一种可能的选择是下尾依赖；例如参见\
  \ De Luca and Zuccolotto (2011) 以及 Durante *et al.* (2015)。在 Lopez Prado (2016)\
  \ 层次风险平衡的基础上，我们提出并研究了使用下依赖系数的该策略的创新变体。\n\n本章结构如下：\n- 第 9.1 节：阐述了多资产背景下的层次聚类。\n-\
  \ 第 9.2 节：介绍了基于相关系数的层次聚类。\n- 第 9.3 节：提供了传统基于风险策略的概述，并概述了一个衡量和管理多元化的框架。\n- 第 9.4\
  \ 节：考察了所引入的 `HRP` 相传统方案的性能。\n- 第 9.5 节：结论。\n\n## 9.1. 层次风险平衡策略\n\n在多资产多因子投资背景下研究层次风险平衡策略，讨论了相应的市场和因子宇宙。随后，我们通过传达内在的层次结构来说明风险平衡的概念。\n\
  \n### 9.1.1. 多资产多因子宇宙\n\n我们考虑了结合股票、债券、商品传统资产类别以及因子的多资产多因子数据。时间序列涵盖 2003 年 3 月 3\
  \ 日至 2017 年 12 月 29 日。全球股票债券市场由 `S&P 500`、`Nikkei 225`、`FTSE 100`、`EuroSTOXX 50`\
  \ 和 `MSCI Emerging Markets` 的股票指数期货，以及 `US 10Y Treasuries`、`Bund`、`Japanese Government\
  \ Bonds (JGB) 10Y` 和 `UK gilts` 的债券指数期货代表。信用溢价通过彭博巴莱德美国企业投资级 (`IG`) 和高收益级 (`HY`)\
  \ 指数捕捉，两者都经过久期对冲以合成纯信用风险。选择`黄金`、`石油`、`铜`和`农业`指数来覆盖商品市场。\n\n风格因子系统地遵循特定的投资风格。总之，我们在股票、（利率）、商品和外汇资产类别中考虑了五种投资风格：`carry`、`value`、`momentum`、`quality`\
  \ 和 `volatility carry`。\n\n\n\n为了衡量多样化程度，可以根据合适的经济因素建立适当的因子模型。为了将统计聚类与经济因素进行基准比较，我们将包含股票、久期和大宗商品等市场因子。此外，从纯粹风格因子投资的角度来看，我们构建了跨资产类别的聚合风格因子，例如，聚合动量风格因子将基于股票动量、外汇动量、利率动量和大宗商品动量。同样地，我们构建了聚合的利差（carry）、价值、质量和波动率利差因子。聚合市场因子和风格因子均采用一种加权方案，以确保底层资产类别或风格因子的风险贡献相等。\n\
  \n### 9.1.2. 分层多资产多因子结构\n\n许多投资组合优化方法（如马科维茨均值方差法）对输入变量的变化非常敏感，小的估计误差就会导致最优投资组合配置的巨大差异。Lopez\
  \ de Prado (2016) 主张，相关性和协方差矩阵过于复杂，无法进行完全分析，并且忽略了资产之间相互作用的层次结构。全协方差矩阵可以可视化为具有 `N`\
  \ 个节点和 ![images](img/ieq9-1.jpg)边的完全图；参见图 9.1（左侧）。为了降低复杂度，我们希望通过删除不必要的边来关注相关的相关性。在这方面，图论中一种著名的方法是所谓的最小生成树（MST）。MST\
  \ 是原始图中 `N` — 1 条边的子集，它在不形成任何循环的情况下连接了图论中的所有顶点，并具有最小的边总权重。Prim (1957) 引入了一种获取 MST\
  \ 的算法。在应用该算法之前，我们必须定义一种距离度量，该度量通常基于相关系数。我们将这种度量称为差异性度量（dissimilarity measure），因为它旨在衡量资产（和因子）的差异性。第\
  \ 9.1.3 节中提供了精确的定义。将差异性度量应用于相关矩阵可以得到所谓的差异性矩阵，并允许我们推导出 MST；参见图 9.1（右侧）。由于它是基于相关性的，因此通常被称为相关性网络。\n\
  \n我们成功地将具有 ![images](img/ieq9-1.jpg)边的完全图简化为具有 `N` — 1 条边的连通图，它关注相关矩阵包含的核心信息并引入了层次结构。通过观察分支，我们识别出一个大宗商品聚类（右上）、一个股票风格聚类（左上）和一个波动率风格聚类（左下）。\n\
  \n图论与无监督机器学习相关。特别特别是，MST 与层次聚类算法（称为单链法）具有天然的相关性。MST 直接传达了所研究资产和风格因子的层次结构，有关在股票宇宙中的早期应用请参见\
  \ Mantegna (1999)。这产生了一个如图 9.2 中树图所示的树结构。沿着树向上移动，彼此相似的对象合并成分支，即融合的高度越高，对象之间的相似性越低。\n\
  \n![图 9.1. 带有边的完全图](img/ieq9-1.jpg)\n\n![图 9.1. 带有边的完全图](img/ieq9-1.jpg)\n\n![图\
  \ 9.1. 带有边的完全图](img/ieq9-1.jpg)\n\n### 9.1.3. 层次聚类\n\n接下来，我们将通过定义差异性度量和不同的连接方法正式介绍层次聚类。我们还将阐述一种基于树图获取投资组合权重的算法。假设\
  \ `X` 是一个 `T × N` 数据矩阵。`X[j]` 表示资产 `j` 的收益率时间序列。\n\n\n\n\n请注意，差异性矩阵 `D` 定义了一个度量空间，前提是函数\
  \ `d` 额外满足三角不等式。定义差异性度量有很多方法，包括欧式距离和曼哈顿距离，但目前我们将考虑 `d`：`B` $\\rightarrow$ `[0, 1]`，如\
  \ Lopez de Prado (2016) 所定义：\n\n[\\[9.2\\]](#c09.xhtml#ieqn9-2) ![image](img/eqn9-2.jpg)\n\
  \n其中 `ρ[i,j]` = `ρi,j` 是皮尔逊相关系数。我们可以验证 [\\[9.2\\]](#c09.xhtml#eqn9-2) 是一个差异性度量，例如可以参见\
  \ Lopez de Prado (2016)。对于完全相关的资产（`ρ[i,j]` = 1），我们有 `d` = 0。对于完全负相关的资产（`ρ[i,j]`\
  \ = $-$1），我们有 `d` = 1。\n\n`D` 包含了所有单个资产与因子之间差异性的信息。尽管如此，我们必须定义如何使用这些信息来衡量包含多个元素的簇之间的（不）相似性。这是通过所谓的“连接标准”（linkage\
  \ criterion）来实现的。有多种标准，但最常见的是单连接（single linkage）、全连接（complete linkage）、平均连接（average\
  \ linkage）和 Ward 方法，例如 Raffinot (2017)。\n\n在`single linkage`（单连接）的情况下，两个簇之间的距离定义为簇中任意两个元素之间的最小距离：\n\
  \n\\[9.3\\] ![image](img/eqn9-3.jpg)\n\n其中 `C[i]` 和 `C[j]` 表示两个簇，`x` 和 `y` 代表簇内的元素。根据构造，这种连接标准对离群值敏感，并可能导致长而稀疏的簇，这是一个被称为“链效应”（chaining）的已知问题。相比之下，`Complete\
  \ linkage`（全连接）定义为簇中任意两个元素之间的最大距离：\n\n\\[9.4\\] ![image](img/eqn9-4.jpg)\n\n生成的簇往往比较紧凑且大小相似。然而，该策略也对离群值敏感。使用`average\
  \ linkage`（平均连接），我们计算所研究簇中任意两个元素距离的平均值：\n\n\\[9.5\\] ![image](img/eqn9-5.jpg)\n\n\
  其中 `|C[i]|` 是簇 `i` 的基数。`Ward’s method`（Ward 方法）最小化簇内总方差：\n\n\\[9.6\\] ![image](img/eqn9-6.jpg)\n\
  \n其中 `µ[i]` 是簇 `i` 的中心。该方法旨在寻找紧凑簇，被认为对离群值的敏感性较低。\n\n推导出聚类图（dendrogram），我们从每个单元素簇资产（或因子）开始。然后，根据差异性矩阵提供的信息和选定的连接标准，顺序合并两个最相似的簇。四种连接方法生成的聚类图可以在图\
  \ 9.4 中观察：Ward 方法产生了大小相似的紧凑簇，使其成为研究人员的流行选择。相反，单连接深受链效应的影响，而其他方法则对离群值敏感。\n\n聚类图显示了算法每一步中簇的合并情况。沿着聚类图向上移动，相似的对象/簇被合并成分支。在轴上，我们提供了合并发生的值，代表两个对象/簇之间的（不）相似性。然而，只有当两个对象/簇被合并时，我们才能对它们的接近性得出结论。聚类图并不允许对两个“随机”对象/簇的接近性进行推断。\n\
  \n![图 9.4. 连接方法的比较：单连接（左上）、全连接（右上）、平均连接（左下）和 Ward 方法（右下）](img/fig9-4.jpg)\n\n**图\
  \ 9.4.** *连接方法的比较：单连接（左上）、全连接（右上）、平均连接（左下）和 Ward 方法（右下）*\n\n在大规模投资宇宙池中，聚类图可能只被考虑到某个特定水平，而不是考虑整个层次结构。虽然这种削减会导致信息丢失，但寻找权重分配的速度会更快。截断聚类图可以将资产和风格因子划分为不同的簇。确定最佳簇数量有多种方法。我们可以简单通过查看聚类图选择一个合理的数量，或者应用统计标准来确定“最佳”簇数量。示例见图\
  \ 9.5，其中簇的数量被刻意选择为 7。流行的统计方法有间隙统计量（Tibshirani *et al.* 2001）和轮廓系数（silhouette index）（Rousseeuw\
  \ 1987）。\n\n![图 9.5. 基于 Ward 方法的聚类图；截断以获得七个簇。](img/fig9-5.jpg)\n\n**图 9.5.** *基于\
  \ Ward 方法的聚类图；截断以获得七个簇。*\n\n\n\n\n\n# 定义 9.2.– 尾依赖系数。设 `X` 和 `Y` 为两个随机变量，![images](img/ieq9-14.jpg)\
  \ 为它们的分布函数。下尾依赖系数（LTDC）定义为\n\n\\[9.7\\] ![image](img/eqn9-7.jpg)\n\n上尾依赖系数（UTDC）为\n\
  \n\\[9.8\\] ![image](img/eqn9-8.jpg)\n\n如果满足 ![images](img/ieq9-15.jpg) 且同样满足 `λ`[`\
  \ `U`] 的相应条件，我们称 `X` 和 `Y` 在下尾上是渐近依赖的（独立的）。这种概率的量化完全取决于所假设的二元分布，即尾部依赖性的存在是二元分布的一个属性，详见\
  \ De Luca 和 Zuccolotto (2011)。\n\n在应用中，需要数据基于分布假设来估计尾部依赖系数。由于后者对于金融数据而言较为困难，因此广泛使用了\
  \ copula 关（copula functions）。Copula 允许我们通过单变量边缘分布函数来描述联合分布函数。因此，copula 允许我们以简单且灵活的方式有效估计尾部依赖性。假设我们可以估计\
  \ LTDC，按照 De Luca 和 Zuccolotto (2011) 的建议定义不相似性度量。\n\n# 命题 9.1.– 设 `X` 和 `Y` 为两个随机变量，`λ`[`L`]\
  \ 为其相关的下尾依赖系数，则以下函数 `d`: ℝ × ℝ → \\[0, ∞) 是不相似性度量：\n\n[\\[9.9\\]](#c09.xhtml#ieqn9-9)\
  \ ![image](img/eqn9-9.jpg)\n\n## 9.2.2. 估计尾部依赖系数\n\nCopula 在金融应用中非常流行，因为它们允许我们将对联合分布函数的分析分为两个部分。首先，对每个随机变量独立分析边缘分布函数。其次，我们选择一个\
  \ copula 模型将依赖结构描述为边缘分布的函数，或者使用 copula 的经验版本。因此，copula 将边缘分布与联合分布连接起来，并隐式地定义了二元分布函数。\n\
  \n对于估计基于 copula 的尾部系数，主要分为参数化和非参数化方法。De Luca 和 Zuccolotto (2011) 首次引入了基于 LTDC 的聚类方法，使用了基于阿基米德\
  \ copula 的参数化方法。在选择模型并估计出相应参数后，可以轻松计算 LTDC。为了避免对涉及的时间序列的两两间依赖结构指定参数化模型假设，我们将简要讨论两种非参数化方法。\n\
  \nDurante *et al.* (2015) 的程序基于极值理论方法，该方法需要定义 copula、生存 copula（survival copulas）和极值\
  \ copula。此外，我们可以在这些不同概念与上、下尾依赖系数之间建立联系。然而，在未报告的结果中，我们发现该估计器产生的聚类图（dendrograms）相当不稳定。由于沿此类聚类图的组合配置将遭受高周转率，我们转而采用\
  \ Schmid 和 Schmidt (2007) 更稳定的非参数估计器。作者们提出了一种基于 Spearman 系数条件的 LTDC 多维泛化方法，该方法对多维\
  \ copula 的不同部分进行加权。因此，我们将该估计器称为 CSR（条件 Spearman 系数）估计器。为了估计两两 LTDC 的目的，我们正在考虑二维版本。有关\
  \ CSR 估计器的定义请参见第 9.8 节，推导过程参见 Schmid 和 Schmidt (2007)。\n\n图 9.6 显示了基于 [\\[9.9\\\
  ]](#c09.xhtml#eqn9-9) 的聚类图，其中使用 CSR 估计器估计 LTDC。与图 9.5 相比，我们可以观察到不相似性量会导致相当不同的聚类图。注意，我们选择的最优簇数为五个；其他选择也是可能的。从直觉上看，使用\
  \ LTDC 会看到商品市场和商品风格因子的联合聚类。与图 9.5 中基于相关性的聚类图相比，我们发现股票-信用簇扩大了，包含了更多风格因子。有趣的是，除了防御性股票外，股票-信用簇形成了一个类。\n\
  \n![图 9.6](img/#c09.xhtml#fig9-6) 显示了基于 [\\[9.9\\]](#c09.xhtml#eqn9-9) 的聚类图，其中使用\
  \ CSR 估计器估计 LTDC。与图 9.5 相比，我们可以观察到不相似性量会导致相当不同的聚类图。注意，我们选择的最优簇数为五个；其他选择也是可能的。从直觉上看，使用\
  \ LTDC 会看到商品市场和商品风格因子的联合聚类。与图 9.5 中基于相关性的聚类图相比，我们发现股票-信用簇扩大了，包含了更多风格因子。有趣的是，除了防御性股票外，股票-信用簇形成了一个类。\n\
  \n事实上，有多种基于 LTDC 定义不相似性度量的方法。\\[9.9\\] 的范围从 0 到无穷，由于 `λ`[`L`] ∈ \\[0, 1]，当尾部依赖性很高时它也很小，并随着尾部依赖性的降低而单调增加。因此，尾部依赖性高的资产彼此“接近”，而尾部依赖性低的资产则显得更“远”。\n\
  \n## 9.3. 基于风险的配置策略\n\n本节介绍了基于风险的技术。首先，我们关注“传统的”配置策略，用于对比分层平衡策略。其次，我们讨论了 Meucci\
  \ 的风险管理方法，用于构建多元风险平衡策略。后者提供了一个与分层平衡策略对比的有用标准。\n\n### 9.3.1. 经典的基于风险的配置技术\n\n最简单的配置策略是等权重（1*/）。它给每个资产分配相同的重要性（金额）。对于\
  \ `N` 个资产，我们得到权重：\n\n\\[9.10\\] ![image](img/eqn9-10.jpg)\n\n另一种流行的基于风险的配置技术是最小方差组合（MVP）。它是马科维均方差方法的特例，确定了有效边界的最左点。其权重通过求解二次优化问题确定：\n\
  \n\\[9.11\\] ![image](img/eqn9-11.jpg)\n\n其中 `Σ` 是协方差矩阵。我们实施了全投资和仅多的约束。虽然最小方差组合权重容易计算，但它们通常集中在低波动资产。相反，1*/\
  \ 有完全平衡的权重分配，但如果单个资产的风险差异巨大，可能会遭受风险集中。因此，我们可能考虑通过配置使得所有资产对整体组合风险的贡献相等来实现风险分散。遵循这一目标的策略被称为风险平衡策略。一种朴素的风险平衡方法是：首先，根据波动率\
  \ `σ`[`i]` 反比对每个资产加权，然后重新缩放权重（使其和为 1）：\n\n\\[9.12\\] ![image](img/eqn9-12.jpg)\n\
  \n这种反波动率策略被认为是简单的风险平衡策略，因为它忽略了资产相关性。因此，我们接下来讨论了一种风险平衡策略，其分配权重使得所有资产对总组合风险的贡献相等。关键指标是边际风险贡献，它衡量了资产\
  \ `i` 权重微小变化引起组合风险 `σ`[`p]`的变化：\n\n\\[9.13\\] ![image](img/eqn9-13.jpg)\n\n其中 `Σ`\
