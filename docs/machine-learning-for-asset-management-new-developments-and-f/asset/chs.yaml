  \n## 7.5. 构建市场中性多空组合\n\n为了说明如何在实践中利用改进的 beta 预测，我们根据 Frazzini 和 Pedersen (2014)\
  \ 报告的“反贝塔因子”（Betting-Against-Beta factor）构建了市场中性多空组合。我们将 MSCI 美国指数股票池（排除金融和房地产板块）根据其历史\
  \ beta 进行排序。我们做多历史 beta 最低的一组股票（`D1`），并做空历史 beta 最高组的股票（`D10`）。多头和空头部分均采用等权重（`EW`）。我们使用三种不同的方法调整组合的空头部分，以保持多空组合的市场中性性：1)\
  \ `EW D1` 和 `EW D10` 的历史 beta 之比；2) `EW D1` 和 `EW D10` 的 Bloomberg beta 之比；以及 3)\
  \ `EW D1` 和 `EW D10` 的 XGBoost beta 预测值之比。我们评估了三个多空组合的实际 12 个月 beta 是否不同于零。我们每月重复此过程，并使用\
  \ Newey–West t 统计量计算显著性，以考虑自相关性。\n\n图 17.1.7 显示了三个多空组合的实际 beta。正如预期，当使用历史 beta 之比确定空头子组合规模时，我们多空组合获得了显著的正*事后*\
  \ beta，t 统计量为 5.5，在 1%显著性水平上显著。这证实了 Vasicek (1973) 的著名观察：历史 beta 低估了低 beta 股票的未来\
  \ beta，高估了高 beta 股票的未来 beta。我们发现 Bloomberg beta 导致显著的负实际 beta（t 统计量为 -1.8，在 10%水平上显著），而基于\
  \ XGBoost 构建的市场中性组合的实际 beta 在统计上与零无异（`t-stat -0.2`）。\n\n一组稳健性检验证实了上述结果。当根据历史 beta\
  \ 的五位数而非十位数构建多空组合时，我们获得了几乎相同的结果。我们还构建了基于 XGBoost beta 预测排序而非历史 beta 排序的多空组合。基于历史\
  \ beta 和 Bloomberg beta 的市场中性组合构建使得多空组合的实际 beta 在 1% 显著性水平上不同于零。使用基于 XGBoost 的调整会导致多空组合的平均实际\
  \ beta 在统计上与零无异。\n\n![图 7.17. 反贝塔策略多空组合的实际 beta。此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig7-17.jpg)\n\
  \n**图 7.17.** *反贝塔策略多空组合的实际 beta。此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n## 7.6. 结语\n\n在本章中，我们将机器学习应用于大数据和`sentiment`（情感分析）。我们发现机器学习模型在预测 beta 方面优于线性模型。未来的研究有几个方向：首先，我们可以使用更大的特征集（如\
  \ `volume`成交量）；其次，神经网络在其他场景中表现出良好的性能。\n\n## 7.7. 参考文献\n\n- Ackermann, L., Daniel,\
