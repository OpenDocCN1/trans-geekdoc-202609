  \ 3.6 稀疏性的动态讨论\n\n时变模型的应用在金融文献中变得非常流行。相关论文包括 Pesaran and Timmermann (2002),Lewellen\
  \ (2004),Avramov (2004), Jostova and Philip (2005),Welch and Goyal (2007),Adrian\
  \ and Franzoni (2009),Dangl and Halling (2012),Pettenuzzo *et al.* (2014),Bianchi\
  \ and McAlinn (2018) 以及 Bianchi *et al.* (2019) 等。\n\n在实践中，时变模型的应用通常被限于少数预测变量，这由现有理论或先前的实证结果证明。考虑到许多预测变量中的信息是有益的，现有的时变方法无法在高维设置中使用，似乎是一个根本性的缺陷。事实上，从先验来看，相关的预测变量随时间保持不变并不一定成立。例如，Bianchi\
  \ *et al.* (2019b) 显示横截面的稀疏性水平具有高度的时间变性，并与总体金融状况有关。\n\n高维设置中的一个关键问题是考虑动态稀疏性的可能性。在本节中，我们提供了进一步的证据，表明稀疏性并非固定不变，而在时间序列和横截面上都具有很大的异质性。特别是作为一个案例，我们报告了\
  \ lasso 惩罚回归的后验均值估计。lasso 收缩先验的层次结构允许我们将 `τ²` 解释为整体收缩参数，同时保留了局部（即特定预测变量）收缩参数的灵活性。\n\
  \n图 3.1 报告了每个资产类别的结果。左上面板显示了股市和国债投资组合的滚动窗口估计。股市收缩随时间的变化特别值得关注。稀疏性在衰退期间似乎相对较低，也就是说，预测股市相关的信息量在衰退期间往往比扩张期间更大。事实上，样本的最后部分表明，在\
  \ 2008/2009 年大金融危机之后，稀疏性变得更加显著。\n\n\n\n\n在价值股票组合（左中面板）中也可以观察到类似的动态特征：我们可以很容易地发现，在大金融危机前后，稀疏性往往会增加，特别是对于高账面市值率组合尤为如此。模型隐含的高价值股票超额收益条件期望在我们的样本末尾表现得特别稀疏（正如较高的\
  \ ![images](img/ieq3-29.jpg) 所示）。对于公司债券（右上面板）和过去的亏损者组合（右中面板）也是如此。我们发现的唯一一个具有相对稳定且低稀疏性的资产类别是过去的获胜者**组合。\n\
  \n有趣的是，过去的获胜者和过去的亏损者的外汇（FX）策略（右下面板）在模型隐含预期超额收益的稀疏性上似乎具有相似的动态特征，呈现出巨大且持久的波浪。相反，当我们观察货币市场中的价值策略（左下面板）时，高价值组合与低价值组合之间的稀疏性动态随时间而变化，两个组合之间\
  \ `τ`² 之间的“间距”在大金融危机前后有所增加。\n\n这里有必要说明一点。对时变稀疏性的全面研究超出了本章的范围。然而，我们认为，我们的结果提供了一些初步证据，表明稀疏性的动态可能对线性回归设置下的预期收益预测和建模具有相关影响，因此从方法论的角度来看，应该引起重视。\n\
  \n## 3.7. 结论\n\n在本章中，我们在数据丰富的环境下，评估了大量的惩罚性预测回归模型，用于预测不同资产类别的超额收益。在实证方面，我们利用了特定资产的预测因子以及来自\
  \ FRED-MD 数据库的一系列经济变量，这些变量可以说捕捉了宏观经济中几个潜在的相关风险。在方法论上，我们采用了一种贝叶斯估计框架，其中先验分布的功能类似于经典惩罚化中惩罚项的功能。我们探索了每种方法的计量经济学基础，以及它们在不同资产类别中的经济收益。主要结果表明，惩罚项意味着对模型空间进行收缩（通过将某些回归系数设为零）以及对剩余回归系数进行正则化，其表现往往优于密集型（如岭回归）和稀疏型（如\
  \ lasso 回归）方法。最后，我们证明收缩程度（或稀疏程度）往往随时间演变，并且对于每个资产类别各不相同。这意味着，在数据生成过程中假设稀疏性是常数，从统计学和经济学角度可能会付出巨大的代价。\n\
