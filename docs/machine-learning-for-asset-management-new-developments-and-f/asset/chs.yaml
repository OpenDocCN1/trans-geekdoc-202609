  \ [1.4]](#c01.xhtml#eqn1-4)，基于 [1.19]](#c01.xhtml#eqn1-19)的传统截面收益预测给出：\n\n```\n\
  [1.20]](#c01.xhtml#ieqn1-20) ![image](img/eqn1-20.jpg)\n```\n\n其中![images](img/ieq1-13a.jpg)和![images](img/ieq1-13b.jpg)\
