  \n## 6.1 引言\n\n当今的投资世界以信息过载为特征。传统上，投资者关注数值数据，使用基本面分析或定量模型。然而，绝大多数可用信息是非结构化的格式，例如文本、音频和视频。由于大多数分析技术是为数值数据而非非结构化信息设计的，挑战是如何让这些信息可读。自然语言处理（NLP）是一个极好的例子——它将文本数据转化为实性信息。然而，分析文本远超\
  \ NLP。它需要跨越网络爬取、裁剪、分布式计算、NLP 算法和主题建模等一系列技术套件。\n\n## 6.1.1 传统选股因子的表现持续收缩\n\n过去 30\
  \ 年，常见因子的平均收益已大幅压缩。尽管基本面经理可能没有明确使用因子，但他们的投资过程通常涉及购买廉价、质量良好且卖方分析师评高的股票。因此，基本面组合通常与价值和动量因子相关。\n\
  \n如图 6.1a 所示，与大多数投资风格相关的 Alpha 在过去 30 年中大幅下降，特别是价值、动量和分析师情绪——这些是学术界和从业者公认且理解的异常现象。自\
  \ 2017 以来，我们常见因子的超额收益几乎为零。增长因子是唯一的例外，这些传统的弱信号能够在 2017 之后的环境中保留一些性能。\n\n考虑到因子表现的下降趋势，传统的多因子模型也遭遇了困境（图\
  \ 6.1b）。原生策略（如`BM`基准模型）的 Alpha 接近于零，尽管存在周期性的波动。\n\n![图 6.1. 传统因子的表现在美国持续挣扎。（来源：Bloomberg\
  \ Finance LLP, EDGAR, FTSE Russell, Haver, I/B/E/S, S&P Capital IQ, Thomson Reuters,\
  \ Wolfe Research Luo’s QES）。该图彩色版本请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-1a.jpg)\n\
  \n¶ **图 6.1.** 传统因子的表现在美国持续挣扎。（来源：Bloomberg Finance LLP, EDGAR, FTSE Russell, Haver,\
  \ I/B/E/S, S&P Capital IQ, Thomson Reuters, Wolfe Research Luo’s QES）。该图彩色版本请访问\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)\n\
  \n\n\n\n\n在美国股票市场之外，我们在全球范围内观察到了类似的模式。在欧洲，价值、动量和分析师情绪因素在近年来遭受了最大的失败（图 6.2a）。虽然除日本以外的亚洲地区因子表现实质上好得多，但价值和增长信号已大幅恶化（图\
  \ 6.2b）。日本也不例外。如图 6.2c 所示，大多数因子和风格也随着时间的推移而急剧下跌。最后，如图 6.2d 所示，典型的多因子模型表现变得平坦（欧洲和亚洲）或回落（日本）。\n\
  \n![ ¶ 图 6.2. 全球传统因子表现。（来源：Bloomberg Finance LLP, EDGAR, FTSE Russell, Haver, I/B/E/S,\
  \ S&P Capital IQ, Thomson Reuters, Wolfe Research Luo’s QES）。如此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-2.jpg)\n\
  \n¶ 图 6.2. *全球传统因子表现。（来源：Bloomberg Finance LLP, EDGAR, FTSE Russell, Haver, I/B/E/S,\
  \ S&P Capital IQ, Thomson Reuters, Wolfe Research Luo’s QES）。如此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n正如 Luo *等人* (2019) 所讨论的，因子表现下降的背后既有周期性原因（例如宏观经济环境的变化、国际贸易的不确定性、主要央行的极宽松货币政策），也有长期结构性趋势（例如，活跃型投资者在探索市场异常方面变得日益高效）。\n\
  \n随着传统股票选股因子表现持续萎缩，替代数据和机器学习可能会增加不相关的 alpha。在本章中，我们重点关注使用 `NLP`（自然语言处理）技术从文本数据中生成见解。此外，我们还阐了如何利用行为金融学和机器学习技术来改进传统的新闻情绪信号。\n\
  \n### 6.1.2. 文本数据、自然语言处理与机器学习\n\n传统上，投资者关注数值型数据，使用基本面分析或量化模型。然而，绝大多数可用信息是以文本形式存在的。例如，美国上市公司每天提交近\
  \ 5,000 份文件。平均，一份典型的 `10-K` 包含 150,000 个单词——这是 `SEC`（美国证券交易委员会）要求的公司业绩标准年度报告。公司通过投资者演示稿和电话会议向公众传达其业绩和策略。投资者没有足够的时间来筛选这些山般的书面材料。此外，人类的解读是主观的，并且很容易受到行为偏差的影响。\n\
  \nDas 和 Chen (2001) 以及 Antweiler 和 Frank (2002) 是首批通过 `NLP` 研究文本信息的研究人员。作者利用语言学方法研究了发布在\
  \ `Yahoo! Finance` 和 `Raging Bull` 上关于琼斯指数公司消息的影响。其他著名的早期工作包括 Li (2006) 和 Tetlock\
  \ *等人* (2008)。Li (2006) 分析了公司文件中的情绪，发现公司年报中的某些词汇可以预测低年度收益和股票回报。Tetlock *等人* (2008)\
  \ 根据新闻报道而非年度报告来量化情绪。他认为，公司特定新闻报道中负面词汇的比例会导致后续收益较低。对于语调分析，Tetlock *等人* (2008) 的研究基于通用的哈佛词典，随后该词典由\
  \ Loughran 和 McDonald (2011) 进一步完善。他们认为哈佛心理词典可能不适用于金融和会计领域，因为正负词汇在金融背景下可能有完全不同的含义。Loughran\
  \ 和 McDonald (2011) 开发了专门针对金融的情绪词典。他们也是最早在 `SEC 10-K` 表文件中大量应用 `NLP`，并将信号与股票回报、交易量、收益波动、欺诈、重大缺陷和意外收益联系起来的人。Rohal\
  \ *等人* (2017)\n\n### 6.2. 公司管理演示的自然语言分析\n\n在本节中，我们关注来自 S&P Capital IQ 的一个令人兴奋的数据库——交易记录数据库（Transcript\
  \ Database），它提供了全球约 7,000 家上市公司的当前和历史会议记录数据。由于空间限制，本节仅提供高层次概述。更深入的分析可以参考 Rohal *等人*\
  \ (2018)。\n\n交易记录数据库提供了业绩会议、指导/更新会议、股东/分析师会议、分析师/投资者日、并购会议、运营结果会议、固定收益率会议等的文本翻译。在本章中，我们重点关注业绩会议，因为其他类型的会议数量有限。\n\
  \n\n\n\n\n每场业绩电话会议通常分为两个部分：“演示环节”和“问答环节”。演示环节通常包括公司高管的演讲，例如——`CEO` 和 `CFO`。问答环节包含公司管理层与买方/卖方研究分析师、投资者或潜在的媒体之间的对话。电话会议中的每一句话都标记了相应的高管或分析师。它还提供了详细的元数据，如发言人姓名、发言人类型以及对应的所属公司。结合\
  \ `S&P Capital IQ` 提供的另外两个密切相关的数据库—— Professionals（关于公司高管、董事会成员和投资专业人士的背景信息）和 `KDFE`（关键进展和未来事件），我们可以生成更深层次的洞察。\n\
  \n### 6.2.1. `Coverage`\n\nS&P Capital IQ 在不同时间点提供不同质量的转录副本，包括“校对副本”、“编辑副本”、“拼写检查副本”和“审计副本”。我们创建了样本——即校对副本和编辑副本的并集，以平衡时效性和覆盖范围。`Transcript\
  \ Database`始于 2009 年。目前，它涵盖了罗素 3000 指数中约 2,500 只股票（图 6.3a）。在美国境外，覆盖范围有限（约 1,200\
  \ 家公司），但随着时间的推移有所改善（图 6.3b）。\n\n![图 6.3 电话会议转录每月覆盖数据。（来源：Bloomberg Finance LLP,\
  \ FTSE Russell, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research’s QES）。此图彩色版请查看\
  \ www.iste.co.uk/jurczenko/machine.zip](img/fig6-3.jpg)\n\n**图 6.3. *电话会议转录每月覆盖数据。（来源：Bloomberg\
  \ Finance LLP, FTSE Russell, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research’s\
  \ QES）。此图彩色版请查看 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n业绩电话会议转录的频率显然与公司的财务报告（季度、半年度或年度）公告一致（图 6.4a）。在财报季，同一天可能有 400 场会议。注意力是有限、稀缺且宝贵的资源。当个人执行多项任务或处理多个信息源时，表现往往会下降。因此，有限的注意力可能会影响投资者处理信息以及市场对新闻的反应（Hirshleifer\
  \ *et al*. 2009）。如果投资者的注意力在业绩公告当天确实受到分散，市场的立即反应可能是平微的；因此，转录中包含的 Alpha 可能会持续更久。\n\
  \nS&P Capital 将音频/视频会议转换为文字转录。部分流程可以通过计算机算法完成，但检查、编辑和验证等人工干预几乎是总是需要的。\n\n\n\n\n\n\
  图 6.6 显示了各章节/参与者类型的中位可读性得分。得分越高，意味着理解所需的教育程度越高，因此可读性越低。CEO 演讲随着时间的推移变得越来越复杂，而分析师问题的可读性在近年来有所提高。问答环节的平均可读性优于主演讲——口语通常比经过高度编写的演讲更简单。我们还观察到可读性指数存在强烈的季节性，这与年度报告季相一致。公司管理层在发布年度业绩上花费的时间通常比季度/中期更新多。\n\
  \n![ 图 6.6. 按章节和发言者类型划分的中位可读性。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital\
  \ IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip](img/fig6-6.jpg)\n\
  \n¶ **图 6.6.** *按章节和发言者类型划分的中位可读性得分。（来源：Bloomberg Finance LLP, FTSE Russell, S&P\
  \ Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。此图的彩色版本请参阅 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n#### 6.2.2.2 市场对复杂语言如何反应？\n\n现在我们将注意力转向使用 Spearman 秩相关 IC^(6) 研究可读性指数是否能预测未来的股票收益。正如之前的研究所示（Rohal\
  \ *et al.* 2017），大多数来自文本挖掘的因素往往是微但持续的。可读性得分的预测能力大多为负，但非常微弱（图 6.7）。可读性与未来股票收益之间的负相关关系符合预期。投资者很难理解复杂的语言。此外，许多投资者会将不必要的复杂词汇与管理的透明度和不确定性联系起来。\n\
  \n有趣的是，卖方分析师提出的复杂问题会导致略微正的未来股票收益。详细的问题可能表明分析师与公司高管之间存在更有建设性的互动。\n\n![ 图 6.7. 可读性得分对未来股票收益的预测能力。（来源：Bloomberg\
  \ Finance LLP, FTSE Russell, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research\
  \ Luo’s QES）。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip](img/fig6-7a.jpg)\n\
  \n¶ **图 6.7.** *可读性得分对未来股票收益的预测能力。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital\
  \ IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。此图的彩色版本请参阅 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n我们通过结合 CEO 和其他高管的演讲章节进一步构建了一个简单的复合可读性因子。如图 6.8 所示，一个简单的多/空分位数投资组合^(7)交付了 0.7x\
  \ 的夏普率。信号的信息衰减缓慢，这使得它对于长期持有期的投资者特别具有吸引力。文本信息分布稀疏，但信号并不拥挤；因此，收益是持续的。\n\n![ 图 6.8.\
  \ 基于高管语言可读性的分位数组合表现，Russell 3000 宇宙。（来源：Bloomberg Finance LLP, FTSE Russell, S&P\
  \ Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)](img/fig6-8a.jpg)\n\
  \n¶ **图 6.8.** *基于高管语言可读性的分位数组合表现，Russell 3000 宇宙。（来源：Bloomberg Finance LLP, FTSE\
  \ Russell, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)*\n\n\
  ### 6.2.3 量化高管个性\n\n今天基本研究的基石之一是接触公司管理层，并试图深入理解管理层如何看待自己的公司/行业，以及高管团队的“风格”（“特质”或“个性”）。直觉上，我们确实预会在高管特质与公司政策之间发现有趣的关系。该领域的学术研究有限。Malmendier\
  \ 和 Tate (2005) 以及 Malmendier 和 Tate (2008) 研究了管理层的过度自信如何影响公司的投资决策和并购活动。Graham *et\
  \ al.* (2013) 记录了 CEO 行为与过度自信、乐观和风险规避指标相关的证据。\n\n在理解高管特质如何影响公司政策、运营表现和股价方面存在许多挑战。首先，聘请管理层和心理学家进行此类性格测试的成本过高。高管理团队既没有时间也没有兴趣参与此类活动。其次，依赖对\
  \ CEO 性格的人类解读和评估既不可复现也不够客观。在最近的一篇论文中，Gow *et al.* (2015) 使用从电话会议中提取的语言特征和统计学习技术开发了一种衡量\
  \ CEO 性格的指标。Gow *et al.* (2015) 发现管理个性因素与组织策略选择、投资和财务政策有关。\n\n近年来，心理学研究集中在五个人格因子（Goldberg\
  \ 1993）：\n- 外向性（相对于内向性）：果断、热情、积极、有说服力、精力充沛；\n- 情绪稳定性（相对于神经质）：尊重、冷静；\n- 宜人性：宽恕、乐助、顺从；\n\
  - 责任心：有组织、自律、高效、坚持、勤奋；\n- 开放经验：灵活、独立、理智、战略性、想象力。\n\n### 6.2.4 句法解析器和词性 (POS) 标记\n\
  \n我们可以通过根据正式语法规则分析口语结构来衡量管理个性。在 NLP 术语中，这被称为句法分析。句法解析器读取输入句子并描述其语法结构。解析器通常返回一个词与词关系的图，旨在从底层文本中提取推理逻辑。这些解析树对于语法检查或从新闻文章提取含义很有用。更重要的是，解析树用于语义分析，因此在聊天机器人中起着重要作用。\n\
  \n语义分析的一个方面是词性 (POS) 标记。它是将单词或标记标记到相应的词性类别（如名词、动词和形容词）的过程。这些类别被称为词汇类别或词性。\n\n####\
  \ 6.2.4.1 形容词/副词的使用\n\n在语言中，副词修饰动词，而形容词修饰其他名词和代词。在假设中，即使你不同句子中的形容词或副词（例如，“本季业绩非常强劲”），你仍然接受被修饰的内容（例如，“本季业绩强劲”）。因为形容词和副词较不客观，这些词在句子中的比例是衡量性格的一种粗略方法。\n\
  \n我们可以简单统计电话记录中形容词或副词的出现次数，作为评估参与者语言主观性的粗略方法。图 6.9 显示了电话记录数据库中形容词和副词的百分比。演讲或公司高管的回答没有明显的趋势。我们看到研究分析师正在从简单直接的问题转向具有更高形容词和副词比例的主观性语言。\n\
  \n\n\n\n\n![图 6.9. 词性分布。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital IQ,\
  \ Thomson Reuters, SEC, Wolfe Research Luo’s QES）。如需此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-9.jpg)\n\
  \n**图 6.9.** *词性分布。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital IQ, Thomson\
  \ Reuters, SEC, Wolfe Research Luo’s QES）。如需此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n这些粗略的人格特征衡量在预测未来股票收益方面并不特别有用（图 6.10a 和 b）。然而，我们注意到 CEO 更具描述性/主观性的回答与随后的股票表现呈负相关（图\
  \ 6.10b）。\n\n![图 6.10. 形容词/副词占比，排名 IC。（来源：Bloomberg Finance LLP, FTSE Russell, S&P\
  \ Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。如需此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-10.jpg)\n\
  \n**图 6.10.** *形容词/副词占比，排名 IC。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital\
  \ IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。如需此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.2.4.2. 代词的使用\n\n性格的另一个基本特征是口语中使用第一人称单数（I, me, my, mine）或第二人称复数（we, us, our,\
  \ ours）代词。这刻画了执行官作为团队成员这一性格的细微差别。该信号的性能依然平平，但收益符合直觉方向。对自我/第一人称的引用越高则负相关，而对团队/第二人称代词的使用越多与未来公司表现呈正相关（图\
  \ 6.11）。\n\n![图 6.11. 代词的使用，分位数投资组合，夏普比率。（来源：Bloomberg Finance LLP, FTSE Russell,\
  \ S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)](img/fig6-11.jpg)\n\
  \n**图 6.11.** *代词的使用，分位数投资组合，夏普比率。（来源：Bloomberg Finance LLP, FTSE Russell, S&P Capital\
  \ IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)*\n\n### 6.3. 从新闻情绪数据中提取长期信号^(8)\n\
  \n新闻和情绪相关数据引起了学术界的极大关注。在一篇开创性论文中，Tetlock *等人* (2008) 研究了《华尔街日报》的每日数据，发现媒体的高度悲观主义预测了次日股价的下跌压力。Sprenger\
  \ 和 Welpe (2010) 从在线股票论坛提取新闻数据并研究其对资产定价的影响。作者将事件分为几个大类，然后应用情绪分析。他们发现按主题汇总的新闻事件包含关于未来资产收益的信息很少。相反，新闻情绪确实具有预测作用。Boudoukh\
  \ *等人* (2014) 发现，“无新闻”的日子会出现股价反转，而“新闻日”则相反。最近，Huynh *等人* (2015) 建议通过加入源自行业的新闻可以增强标准因子的预测能力。最后，Kearney\
  \ *等人* (2013) 对新闻提供了全面的综述。总之，大多数研究受限于数据覆盖范围和短期历史。\n\n#### 6.3.1. 引入 RavenPack 数据\n\
  \nRavenPack 将非结构化新闻和社交媒体数据转化为系统指标。它可以作为另类 Alpha 的来源，并允许投资者实时将新闻、社交媒体和情绪纳入投资流程，以管理风险。\n\
  \n图 6.12 显示了 RavenPack 数据库的快照，包含以下选定项目：\n\n- `时间戳`：每条新闻都有精确的时间戳^(9)\n- `实体名称`：每条新闻都关联到多个实体。实体可以是公司、地点、个人、国家或货币。实体识别是\
  \ RavenPack 的核心优势之一。\n- `相关性`：RavenPack 还为每个实体提供了相关性评分。分值范围从 0（完全无关）到 100（非常相关）。根据我们的经验，仅基于这些高度相关的文章构建信号至关重要^(10)；\n\
  - `新性（相似天数)`：RavenPack 提供距离相似事件发生以来的天数。范围在 0 到 365 之间。365 意味着最近的事件可能发生在 365 天前。对于许多新闻报道，通常会有多次更新，甚至来自同一新闻提供者（如道透社）。市场通常只对最初的发布做出反应。后续更新的影响往往要小得多；\n\
  - `情绪`：RavenPack 提供了一系列基于其专利 NLP 算法的预计算情绪指标：\n    - 标题情绪被称为 `ESS`（事件情绪评分），分值范围为\
  \ 0 到 100^(11)。它基于 RavenPack 的 NLP 算法和关于实体的海量数据库\n    - `NIP`（新闻影响预测）衡量特定新闻在未来两小时内对波动率的影响\n\
  \    - `MCQ`（股票多分类器）仅适用于文中提到的最相关公司。MCQ 的构建方式与`ESS`相似，但也有明显的差异\n    - `CSS`（复合情绪评分）情绪基于市场过去对类似词汇/短语的反应训练\n\
  - `事件类别`：RavenPack 自动检测关键新闻事件并识别实体扮演的角色。事件类别分为四层：\n    - `主题`是事件分类体系的最高层；\n    -\
  \ 一个主题类别下有多个`组`；\n    - 第三层事件级别是`类型`；\n    - 最细粒度的级别是`子类型`。\n\n我们通过计算各种滚动窗口的聚合情绪、异常成交和市场反应来进一步扩展这些信号。我们将异常成交定义为新闻量相对于其长期趋势的偏差，并将市场对公告的反应定义为事件周期间的超收益。\n\
  \n\n\n在 RavenPack Analytics 中，新闻通过由多个并行软件组件构成的自动化实时数据流进行接收和处理。RavenPack 分类法中的事件是使用数千个专用模板程序和\
  \ POS 词性标记来定义的。RavenPack 系统地将故事归类为一组简单的主题（即 `Topics` 主、`Groups`组、`Types` 和 `Sub-Types`\
  \ 子），这对于投资研究至关重要。接下来，将分析提及实体的上下文，以确定它们在故事中扮演的角色。一个事件可以有多个参与者，但只有一个是主参与者。\n\n![ ¶\
  \ 图 6.12. RavenPack 数据样本快照。（来源：Bloomberg Finance LLP, FTSE Russell, Google, IDC,\
  \ RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)](img/fig6-12.jpg)\n\
  \n**图 6.12.** *RavenPack 数据样本快照。（来源：Bloomberg Finance LLP, FTSE Russell, Google,\
  \ IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES)*\n\
  \n处理后的新闻故事在任何时刻的平均整体延迟为 300 毫秒。延迟定义为故事从 RavenPack 接收到离开 RavenPack 数据中心事件分发服务器所通过系统所需的平均时间。RavenPack\
  \ Analytics 对全球 130 多个国家的 192,000 实体进行情感分析，并涵盖了全球 98% 以上的可投资市场。它通过实体类型提供了详尽的覆盖，涉及\
  \ 100,000 多个地点、43,000 家公司、1,000 产品以及 100 多个国籍、货币和商品。\n\n### 6.3.2. 在选股中使用新闻情感信号的挑战\n\
  \n图 6.13 的历史表现。在这种情况下，情感信号是使用三个月移动平均计算的。与我们之前的经验类似，简单情感因子的表现并不特别强。在月度频率上，情感因子失去了显著的预测能力，尤其是自\
  \ 2012 年以来。\n\n![ ¶ 图 6.13. 事件情感得分 (ESS)，三个月聚合因子表现（美国）（来源：Bloomberg Finance LLP,\
  \ FTSE Russell, Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe\
  \ Research Luo’s QES）。如需此图的彩色版本，请访问 www.iste.co.uk/jurczenko/machine.zip](img/fig6-13a.jpg)\n\
  \n**图 6.13.** *事件情感得分 (ESS)，三个月聚合因子表现（美国）（来源：Bloomberg Finance LLP, FTSE Russell,\
  \ Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s\
  \ QES）。如需此图的彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.3.3. 投资者如何对新闻反应？\n\n投资中使用新闻情感的传统方法主要依赖于投资者对新闻反应不足的假设。当公司出现正面（负面）新闻时，大多数投资者不太可能立即根据新闻采取行动并买入（卖出）股票。相反，投资者希望通过更多进展获得进一步确认。由于信息扩散过程需要时间，它形成了一个价格延续过程。因此，移动较慢的投资者（即非高频交易者）仍然可以关注新闻并从新闻分析中获益。\n\
  \n\n\n\n公司倾向于管理层认为自身股票被低估时宣布回购股票。大多数回购新闻是关于股票回购计划进展的更新，因此具有积极的情绪。回购通常在某些短期表现不佳之后启动。无论消息是利好还是利空，公告前的收益率大多为负。同样，对于利好和利空消息，公告当日收益率和公告后漂移（post-announcement\
  \ drift）平均均为正值（图 6.15a）。投资者通常欢迎利好的回购新闻，但对此类公告的反应不足。因此，此类新闻的公告后漂移持续为正，在事件发生后持续约一年。股息公告中利好进展的公告后漂移与回购相似（图\
  \ 6.15b）。\n\n![ ¶ 图 6.15. 回购与所有权的事件研究（美国）。来源：Bloomberg Finance LLP, FTSE Russell,\
  \ Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s\
  \ QES）。该图的彩色版本，请参见 www.iste.co.uk/jurczenko/machine.zip](img/fig6-15.jpg)\n\n¶ **图\
  \ 6.15.** *回购与所有权的事件研究（美国）。来源：Bloomberg Finance LLP, FTSE Russell, Google, IDC,\
  \ RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。该图的彩色版本，请参见\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.3.4.2 重大标题与市场过度反应\n\n第二类新闻主要涉及影响市场的重大新闻——通常是利空公告。在这些情况下，投资者倾向于在事件当天过度反应，导致在事件后出现某些均值回归模式。\n\
  \n在第一个例子中，我们使用生物制药公司的临床试验（RavenPack 预定义事件之一）^(12)。制药公司的临床试验涉及巨额资本投入和长达多年的开发周期；因此，它们通常是影响市场的事件。临床试验的负面结果平均会导致公告当日出现\
  \ –10% 的大幅修正（图 6.16a）。平均而言，股价在事件发生后的两个月内恢复了部分初始损失。另一方面，正面临床试验结果没那么吸引眼球，公告当日收益较小，但会导致更持久的公告后漂移。\n\
  \n信用分析师由于其保守的本性，倾向于反应多于主动。他们通常在股价表现不佳（优异）一段时间后进行下调（上调）。市场对负面消息和评级下调的反应远比上调剧烈得多。最终，持续经营的信用评级对股东造成的损害大于信用评级上调。股权投资者表现出经典的“先卖后想”的行为模式，即市场对负面消息过度反应，导致在负面信用事件后出现反转模式（图\
  \ 6.16b）。\n\n![ ¶ 图 6.16. 特定行业事件的事件研究（美国）。来源：Bloomberg Finance LLP, FTSE Russell,\
  \ Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s\
  \ QES）。该图的彩色版本，请参见 www.iste.co.uk/jurczenko/machine.zip](img/fig6-16a.jpg)\n\n¶\
  \ **图 6.16.** *特定行业事件的事件研究（美国）。来源：Bloomberg Finance LLP, FTSE Russell, Google, IDC,\
  \ RavenPack, S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。该图的彩色版本，请参见\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.3.5. 机器学习方法提取事件情绪\n\n传统的利用情绪的方法忽略了并非所有新闻都是相同的。同样，事件研究可能并不考虑事件的性质。在本节中，我们尝试使用机器学习技术来纠正新闻、情绪、量和市场影响之间的复杂关系。正如前文所述，机器学习技术用于回归和分类问题。\n\
  \n作为演示，我们为每个事件类型（Type）训练两个机器学习模型。在两个模型中，目标变量是下一季的股票收益率，而模型使用的因子/特征是新闻情绪和事件计数：\n\n\
  - 线性 LASSO（绝对收缩和选择算子）模型：与 `OLS`（普通二乘法）回归不同，`LASSO` 本质上是一种基于收缩的方法。它通过收缩较大的回归系数来减少过拟合；\n\
  - 非线性 XGBoost 模型：`XGBoost` 是 `GBM`（梯度提升机）模型的有效实现。梯度提升是一种用于回归和分类问题的机器学习技术，通过许多底层模型（通常是决策树）的集成（例如平均）来实现。决策树可以有效地捕捉数据中的非线性关系，而对多个决策树取平均（例如集成）通常会提高预测准确性。\n\
  \n对于每个事件类型，进一步创建了等权重的 `LASSO` 和 `XGBoost` 模型，即基于事件的情绪因子。\n\n由于许多新闻事件是零星的，我们在一个月、三个和六个月内聚合聚合信号：\n\
  \n- 美国（道斯尔 3000）；\n- 美国以外发达国家：加拿大、欧洲、英国、发达亚洲（香港和新加坡）、ANZ（澳大利亚和新西兰）；\n- 新兴市场。\n\n\
  RavenPack 仅覆盖英文新闻，因此在某些国家覆盖并不特别强。上述三个区域分组为我们提供了足够的样本来训练机器学习模型。\n\n\n\n\n![ ¶ 图 6.17.\
  \ 法律和收入事件类型的特征重要性（美国。（来源：Bloomberg Finance LLP, FTSE Russell, Google, IDC, RavenPack,\
  \ S&P Capital IQ, Thomson Reuters, SEC, Wolfe Research Luo’s QES）。欲查看此图彩色版本，请访问\
  \ www.iste.co.uk/jurczenko/machine.zip](img/fig6-17a.jpg)\n\n¶ **图 6.17.** *法律和收入事件类型的特征重要性（美国）（来源：Bloomberg\
  \ Finance LLP, FTSE Russell, Google, IDC, RavenPack, S&P Capital IQ, Thomson Reuters,\
  \ SEC, Wolfe Research Luo’s QES）。欲查看此图彩色版本，请访问 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n### 6.3.5.3. 模型性能\n\n图 6.18 显示了美国每种事件类型基于事件的情绪因子的性能（通过 rank IC 衡量）和覆盖率。覆盖率和性能在不同事件类型之间差异巨大。例如，裁员和同店销售额的覆盖率低，但性能强。另一方面，内部人士交易和所有权的覆盖范围更广，但截面预测能力较差。与收益和收入相关的事件均具有很强的覆盖率和性能表现。\n\
