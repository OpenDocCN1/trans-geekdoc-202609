  \ 更新步骤。\n\n#### 8.4.2.2. *风险预算优化*\n\n当风险预算不等且风险度量 `R(x)` 为凸且一致的时，Roncalli (2013)\
  \ 对 ERC 投资组合进行了扩展：\n\n![image](img/eq8-200.jpg)\n\n其中 `RB`[`i]` 是分配给资产 `i` 的风险预算。在这种情况下，我们可以证明风险预算投资组合是以下优化问题的缩放解：\n\
  \n![image](img/eq8-200.jpg)\n\n\n\n\n今天的金融业正面临着全领域的数字化革命：支付服务、在线银行、资产管理等。金融财顾行业尤为如此，过去几年它深受数字化和机器人投顾（robo-advisors）出现的影响。对机器人投顾的需求非常强烈，这解释了该业务的增长^(25)。如何定义机器人投顾？这并不简单，但其核心思想是构建系统性的组合配置，以提供定制化的顾问服务。机器人投顾有两个主要目标。第一个目标是比传统的资产经理更了解投资者。因为这种深入了解，机器人投顾可能会提出更合适的资产配置。第二个目标是以系统化的执行任务并建立自动化的再平衡过程。最终，目标是提供定制化的解决方案。事实上，现实大不相同。我们通常注意到，许多机器人投顾与其说是网页或数字应用程序，不如真正的机器人投顾。原因是组合优化是一项非常困难的任务。在许多机器人投顾中，资产配置实际上是基于人工或不完全系统化的，目的是纠正均方差优化的缺点。在未来五年里，机器人投顾面临最重要的挑战将减少这些主观决策，并提高其系统性资产配置过程的稳健性。然而，这意味着机器人投顾必须放弃组合配置中的二次规划世界。\n\
  \n### 8.4.3.1 目标函数的规范\n\n为了使均方差优化更加稳健，可以遵循两个方向。第一种已被广泛探索，通过添加惩罚函数来对解进行正则化或稀疏化（Brodie\
  \ *et al*. 2009; DeMiguel *et al*. 2009; Carrasco and Noumon 2010; Bruder *et al*.\
  \ 2013; Bourgeron *et al*. 2018）。第二种是改变目标函数，考虑风险预算组合而非均方差优化组合（Maillard *et al*.\
  \ 2010; Roncalli 2013）。尽管第二个方向已经取得了巨大成功，但它提供的解决方案在主动管理方面缺乏足够的活性。尽管如此，这两个方向并不孤立。事实上，Roncalli\
  \ (2013) 显示，风险预算优化可以看是最小方差优化的非线性收缩方法。Richard 和 Roncalli (2015) 随后通过将替代配置模型作为最小方差优化的惩罚函数，提出了一种智能\
  \ Beta 组合的统一方法。特别是，他们使用对数障碍函数来对最小方差组合进行正则化。这一观点也被 de Jong (2018) 重申，他考虑了一个均方差框架。\n\
  \n因此，我们建议将机器人投顾优化问题定义如下：\n\n[\\[8.34\\]](#c08.xhtml#ieqn8-34) ![image](img/eqn8-34.jpg)\n\
  \n其中：\n\n\\[8.35\\] ![image](img/eqn8-35.jpg)\n\n`b` 是基准组合，![images](img/ieq8-206.jpg)是参考组合，`x[t]`\
  \ 是当前组合。\n\n该规范足够广泛，涵盖了行业内使用的多数模型。我们注意到目标函数由三部分组成。第一部分对应于带基准的 MVO 目标函数。如果我们将 `b`\
  \ 设置为 `0[*]`，就得到了马科维茨效用函数。第二部分包含 `ℓ[1]` 和 `ℓ[2]` 范数惩罚函数。正则化可以针对当前配置 `x[t]` 进行，以控制再平衡过程和动态配置的平滑性。正则化也可以针对参考组合进行，这通常是基金的战略资产配置。其理念是控制基金的特征。例如，如果战略资产配置是\
  \ 80/20 的资产组合策略，我们不希望组合呈现防御性或平衡性的风险特征。最后，目标函数的第三部分对应于对数障碍函数，参数 `λ` 控制 MVO 优化与 RB\
  \ 优化之间的权衡。最后部分对于使动态资产配置更加稳健至关重要。目标函数的超参数为 ![images](img/pg309-1.jpg)[1], ![images](img/pg309-1.jpg)[2],\
  \ ![images](img/ieq8-207.jpg)[1], ![images](img/ieq8-207.jpg)[2] 以及 `λ`。它们都是正数，也可以设置为零以禁用惩罚函数。例如，如果我们不想对协方差矩阵\
  \ `Σ[*t*]` 进行收缩，则 ![images](img/pg309-1.jpg)[2] 和 ![images](img/ieq8-207.jpg)[2]\
  \ 等于零。超参数 ![images](img/pg309-1.jpg)[1] 和 ![images](img/ieq8-207.jpg)[1] 也可以等于零，因为\
  \ `ℓ[1]` 正则化通常在指定额外约束 Ω 时引入。参数 `γ` 并不是真正的超参数，因为它通常被校准到目标波动率或预期收益。我们还注意到，由于对 `μ[t]`\
  \ 的规范，该模型包含了 Black–Litterman 模型。\n\n### 8.4.3.2 通用算法的推导\n\n问题 [[8.34]](#c08.xhtml#ieqn8-34)\
