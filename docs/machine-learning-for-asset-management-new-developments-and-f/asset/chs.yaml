  \ IC 来衡量因子在选股/排序中的预测能力。它是计算我们投资宇宙中所有股票的当月信号与下月收益之间的秩相关性。\n\n# 7 使用机器学习和股票情绪预测贝塔\n\
  \n在本章中，我们应用机器学习、基本股票变量和大数据情绪变量来预测贝塔。我们发现，机器学习算法更擅预测股票贝塔。股票情绪等大数据变量具有显著性。\n\n## 7.1\
  \ 引言\n\n近年来，已有若干项机器学习应用于预期收益的预测（1）。然而，关于使用机器学习工具预测风险的研究非常少。这至少从两个理由来看是令人惊讶的。首先，预期收益的噪声非常大且难以预测。图\
  \ 7.1 以苹果公司为例说明了这一点，显示月度收益率的噪声远大于月度贝塔。其次，股票贝塔等风险指标在投资组合管理和资本预算中具有重要应用，了解机器学习工具是否能提供更优的预测将非常有趣。\n\
  \n在这项研究中，我们旨在比较标准线性模型（如 OLS）与机器学习算法（如 Lasso、随机森林和 XGBoost——一种主要为速度和性能设计的梯度提升树算法）的预测能力。我们使用了一系列基本变量（如估值比率）以及技术指标（如动量指标）作为不同算法的特征或预测变量。此外，我们还使用了新变量——RavenPack\
  \ 提供的新闻量和股票情绪。这些变量基于对美国股票数 TB 新闻内容的自然语言处理（NLP）。识别并解释对给定算法预测能力最重要的变量是一项挑战。由于截面股票特征在不同经济环境中可能发挥不同的作用，我们允许其与宏观时间序列变量产生交互作用。我们使用了多种变量重要性指标，包括\
  \ SHAP（SHapley Additive exPlanations）值。Lundberg 和 Lee（2016）提出的 SHAP 是一种解释特征平均边际贡献的方法，基于博弈论最优\
  \ Shapley（1953）值。\n\n\n\n\n\n我们的研究提供了三个主要发现。首先，我们证明了基本变量有助于提高未来股票 beta 的预测。股票 beta\
  \ 的持续性比股票预期收益更高，因此历史 beta 是未来 beta 的相当良好的预测。我们还发现，基本变量提升了基于收缩（shrinkage）的彭博调整 beta\
  \ 的预测能力。基于新闻的变量（如 `news volume`）也有助于在几种算法中产生预测改进。宏观情绪以及与基本面特征的交互项在统计学上没有显著帮助。\n\n\
  其次，我们发现与 `OLS` 和 `LASSO` 回归等简单线性模型相比，基于树的机器学习方法在统计学上显著提高了 beta 预测的准确性。`Random forest`\
  \ 和 `XGBoost` 在经济和统计上均优于更简单的模型。\n\n第三，我们检查了计算出的 `SHAP` 值以评估不同变量的重要性。这让我们能够洞察特征与股票\
  \ beta 之间的关系。我们发现许多基本变量与预测的 beta 值之间存在非线性关系。例如，同时具有正负向动量的股票往往会导致 beta 增加，而中性动量的股票则不影响\
  \ beta 预测。`SHAP` 分析还可以帮助检测变量重要性随时间的变化。例如，我们发现 2008 年之前，高负债率可能导致 beta 预测增加，而在 2009\
  \ 年后的低利率世界，股票的高负债率意味着较低风险。\n\n我们的结果对投资组合管理、投资组合构建、资本成本计算和资本预算具有重要的应用价值。通常，预期收益是基于历史\
  \ beta 的简单 `CAPM` 估值。我们的结果表明，基于机器学习的 beta 预测更为优越，并有助于改进资本成本预测。\n\n本章与三类文献流相关。首先，它遵循了试图通过基本变量改进\
  \ beta 预测的研究。`Cosemans et al.` (2016) 采用混合方法来估计 beta，该方法受经济理论驱动，将滚动窗口估计收缩至公司特定的先验值。我们的研究与上述研究的不同在于，我们使用机器学习算法来选择相关特征，包括基本变量和基于新闻的新型预测因子。\n\
  \n其次，我们补充了关于应用机器学习工具预测预期收益的现有文献。`Gu et al.` (2019) 应用了一系列包括 `XGBoost` 在内的机器学习算法来预测股票收益，而\
  \ `Bianchi et al.` (2019) 则预测预期债券收益。我们通过关注股票系统性 beta 风险的预测，补充了上述工作。\n\n第三，本章与研究期权隐含信息和日内收益改进\
  \ beta 预测能力的文献相关。`Hooper et al.` (2008) 比较了实现的 beta 量与常数 beta 模型。`Cenesizoglu et\
  \ al.` (2017) 研究了如一年等长期的 beta 预测。他们发现，最准确的预测是由实现 beta 的自回归模型生成的。我们的研究与之相关，因为我们也关注长期的\
  \ beta 预测，但不同之处在于我们应用了机器学习算法并使用基本变量来改进 beta 预测。\n\n本章其余部分的结构如下：Section 7.2 描述数据。Section\
  \ 7.3 讨论了我们应用的方法和机器学习算法。Section 7.4 展示并解释了实证结果。Section 7.5 阐明了改进的 beta 预测的应用。Section\
  \ 7.6 结论。\n\n## 7.2. 数据\n\n### 7.2.1 数据构建过程\n\n我们分析的样本期为 1999–2019 年。股票范围是 `MSCI\
