  ] ![image](img/eqn9-27.jpg)\n\n9.4. 多资产多因子的分层风险均等策略\n\n在本节中，我们关注在多资产多因子领域研究分层风险均等策略，相对于替代的风险配置策略。在比较性能时，我们使用了多种性能指标，包括夏普比率和针对可能困扰此类因子策略的下行风险的指标。在评估这些策略时，我们注意到它们的性能只是历史路径上的一个实现。因此，我们通过对历史资产和因子历史进行块自助（block-bootstrapping）来生成许多替代路径。\n\
  \n9.4.1. *策略范围*\n\n\n\n传统的基于风险的配置策略首先被直接应用于单个资产和因子，其次被应用于由施加风险模型产生的八个聚合因子。这八个因子可以被视为“经济”簇，为“统计”分层次聚类提供了基准。对于\
  \ HRP（分层次风险对等），在簇内部或跨之间使用的配置策略是风险对等，分别基于反波动率（IVP）或等额风险贡献（ERC）。对于分层次聚类，我们使用 Ward\
  \ 方法和差异矩阵，这些矩阵基于相关性矩阵或下尾依赖系数（LTDCs）。为了对比，我们考虑了 Lopez De Prado 的 HRP 策略的两个版本，两者都基于递归二分：首先，我们复制了原始策略，使用单链法和反方差分配，如算法\
  \ 9.1 所示。其次，我们考虑了其变体，如算法 9.2 所示，使用 Ward 方法和 IVP，以便与 Lopez de Prado 的原始 HRP 策略具有可比性。Lopez\
  \ de Prado 所考虑策略的概述可以在表 9.1 中找到。\n\n![Table 9.1. 配置策略概述](img/tab9-1.jpg)\n\n**Table\
  \ 9.1.** *配置策略概述*\n\n投资组合再平衡每月进行一次。假设这些策略使用期货和掉期执行，相关的交易成本分别为 10 个基点和 35 个基点。此外，每月持有特定的掉期考虑了\
  \ 8 个基点的成本。\n\n使用为期两年的每日滚动窗口来估计协方差矩阵，并将生成的基于相关性的树图每月更新一次。正如 De Luca 和 Zuccolotto\
  \ (2011) 所建议的，我们使用八年的滚动窗口来获得对 LTDCs 的准确估计。此外，对每个时间序列应用了单变量 Student-t AR(1)-GARCH(1,1)\
  \ 模型以消除自相关和异方差。所得的标准化残差用于获取 LTDC 估计器所需的伪观测值。\n\n### 9.4.2. 基于风险的配置策略的统计竞赛\n\n我们在\
  \ 2012 年 1 月至 2017 年 12 月的六年期间对投资策略进行了回测。这段较短的样本期与确定 LTDCs 所需的八年估计窗口相对应。为了增强对策略机制的直观理解，我们研究了所讨论策略子集的权重分配和风险分配，图\
  \ 9.7 显示了它们的权重分配（左侧）和基于最小扭矩组合的波动率贡献（右侧）。MVP（最小扭矩组合）具有较高的组合集中度，单个资产和因子的分配比例高达 20%。在\
  \ ERC 策略的情况下，设计上所有资产对投资组合方差的贡献均相等；尽管如此，基于最小扭矩因子的风险分解也看起来相当平衡。最后，旨在根据这些最小扭矩因子实现多样化化的\
  \ DRP 自然地显示出完美平衡的风险分配。\n\n转向图 9.8 中的分层次风险对等策略，我们发现 Lopez de Prado (2016) 的原始策略（标记为\
  \ `DeP IV P`）以及另一种基于相关性的 HRP 策略（`H IV P C`）的换手率高于传统的风险对等策略。注意的是，基于下尾依赖的 HRP 策略的换手率模式不明显，表明相应的结构比基于相关性的结构更稳定。所有三种\
  \ HRP 策略在最小扭矩组合方面都表现出某种集中性，使其多样化程度略低于传统的替代方案。\n\n![Figure 9.7. 选定的基于风险配置策略的权重和风险分解。此图的彩色版本请参阅\
  \ [www.iste.co](http://www.iste.co) (images/fig9-7.jpg)](images/fig9-7.jpg)\n\n\
  **Figure 9.7.** *选定的基于风险配置策略的权重和风险分解。此图的彩色版本请参阅 [www.iste.co](http://www.iste.co)*\n\
  \n![Figure 9.8. 分层风险策略的权重和风险分解。此图的彩色版本请参阅 [www.iste.co](http://www.iste.co) (images/fig9-8.jpg)](images/fig9-8.jpg)\n\
  \n**Figure 9.8.** *分层风险策略的权重和风险分解。此图的彩色版本请参阅 [www.iste.co](http://www.iste.co)*\n\
  \nTable 9.2 显示了性能和风险统计。首先，我们注意到跨资产和因子的 `1*/N*` 策略具有最高收益（面板 A）。同时，`1*/N*` 也承受着最高的波动和回撤，导致其风险调整后不佳。有趣的是，最小方差优化使我们将这一数字翻倍到\
  \ 7.2（MVP 为 6.7）。意乎意料，这两个组合的波动率最低（分别为 0.84% 和 0.90%）。当然，最大回撤数据和风险调整收益也得到了改进。\n\n\
  接下来，我们检查了 `1*/N*` 和最小方差：风险对等之间的中间方案。在这方面，单个资产和因子的反波动率（忽略相关性）显示出第二高收益，但以牺牲一些多样性为代价。在时间跨度上有\
  \ 6.06 次交易，相对于 ERC 变体少了约两个交易。尽管如此，这两种策略的风险调整后性能相当，且在切换到经济因子时它们的特征更加一致。实际上，相应的策略\
  \ `ERC_F` 与 DRP 策略的性能非常相似，后者被设计为整个时期最多有八次交易。\n\n在研究了经济因子的基于风险的策略后，我们了解基于统计簇的方法如何。我们首先检查\
  \ Lopez de Prado (2016) 的原始策略。其总收益略高于风险对等变体，但其换手率是其三倍以上（约 18% 对比 5%）。结果是净收益小得多，净夏普比率也是如此（0.94\
  \ 对 `ERC_F` 的 1.26）。有趣的是，另外两种基于相关性的 HRP 分配（`H_IVP_C` 和 `H_ERC_C`）换手率更高（分别为 23.21%\
  \ 和 21.93%），将净夏普比率降至 0.50 和 0.55。\n\n![Table 9.2. 多资产多因子情况的性能和风险统计。所有性能数据均指净收益，总收益除外。样本期从\
  \ 2012 年 1 月到 2017 年 12 月](img/tab9-2.jpg)\n\n\n\n\n最后，我们研究了将基于相关性的不相似矩阵替换为由 LTDC（下尾相关性）驱动的矩阵的影响。我们希望相关策略的尾部风险统计数据有所改善，事实上，我们观察到\
  \ `H_IVP_L` 和 `H_ERC_L` 在样本期间经历了两个最小的最大回撤，分别为 –1.20% 和 –1.29%。相比之下，`MVP_F` 的第三小值为（–1.44%），而\
  \ `IVP_F` 的第四小值为（–1.51%）。这两种基于 LTDC 的 HRP 策略的换手率较低，这使得这两种策略在（经风险调整的）收益方面，较于替代的风险均分策略更具竞争力。\n\
  \n当然，上述所有证据都可能被认为是轶性之谈，因为它们仅仅反映了历史路径上的实现（该路径也相当短）。我们希望对所得性能统计量的分布特性建立直觉。利用 2003–2017\
  \ 年的历史数据，我们根据 Politis 和 Romano (1994) 的平稳块自助（stationary block-bootstrap）方法生成了 2000\
  \ 个“替代”的六年投资期，平均块长度为 15 天^(2)。图 9.9 显示了相关性能和风险统计量的箱线图。注意，我们删除了 `Equal` 和 `Equal_F`\
  \ 以免干扰图表。\n\n总体而言，我们发现块自助结果与历史证据一致。尽管如此，基于相关性的 HRP 策略具有更高的中值净收益，它们的换手率高于历史观察到的水平。相应树图的不稳定性是导致高换手率的关键原因。总的来说，总体收益排名没有变化，我们注意到基于单一资产和因素的策略的收益分布比基于经济因素的策略更宽。这些发现也适用于净\
  \ `Sharpe ratios`（夏普比率）。与历史证据的另一个进一步偏差是，基于 LTDC 的 HRP 策略的中值最大回撤远低于回测中获得的最大回撤，最终使它们与基于经济因素策略的最大回撤结果持平。因此，观察到的回测优势可能被认为比真实的更为明显。在这种背景下，下行风险调整收益（`Calmar\
  \ ratio`）的排名更趋向于跨经济因素或统计聚类运行的策略。\n\n![图 9.9. 基于 2000 次块自助模拟的六年投资期性能和风险统计量的箱线图](img/fig9-9.jpg)\n\
  \n**图 9.9。**](c09.xhtml#ifig9-9) 基于 2000 次块自助模拟的六年投资期性能和风险统计量的箱线图\n\n## 9.5. 结论\n\
  \n基于 Lopez de Prado (2016) 的分层风险均分法，我们提出并研究了该策略的创新变体。基于分层聚类建立配置策略的主要动机是，相关矩阵过于复杂，无法完全分析，且缺乏分层概念。分层聚类允许我们将相关的完整信息图简化为最小生成树，从而关注真正重要的相关性。分层风险均分法是一种直观的投资方法，具有高度的灵活性。我们可以从不同的不相似度量中进行选择，试图捕捉底层收益时间序列之间的不同属性和关系。此外，我们可以通过考虑不同的连接方法来修改生成的树结构。唯一的限制是要求簇内和跨簇配置策略的权重之和均等于\
  \ 1。\n\n作为常用皮尔逊相关系数的替代，我们建立了一个基于下尾依赖的不相似度量，以显式地引入尾部风险管理概念。这种创新有助于应对由于其某些组成部分具有显著尾部风险的多资产、多因素世界。在通过树图获得资产和因素的分层结构后，在簇内部和簇之间应用了简单高效的资本配置。Lopez\
  \ de Prado (2016) 建议使用基于递归二分法的算法，该算法仅考虑树图“底部”资产的顺序，而忽略了簇的嵌套结构。相反，我们定义了一种配置算法，该算法通过根据树图每一层创建的簇以从上到下的方式分配资本，从而充分利用了分层结构。\n\
  \n一个多资产、多因素的案例研究表明，分层风险均分策略具有与传统风险均分策略竞争的潜力。此外，它们可以增加理想的多样化属性。基于下尾依赖系数的分层风险均分策略似乎特别受益于尾部风险管理。值得注意的是，基于经济因素的传统风险均分策略预计可以提供与这些\
  \ HRP 策略相当的下行风险保护。因此，跨经济因素簇进行多样化也是意义的。然而，更高维的投资宇宙可能会使“经济”聚类变得直观，从而难以产生合理的聚类。相比之下，如果忽略计算强度，分层聚类方法可以直接应用于高维投资宇宙。\n\
