  \ 7.3 中识别出的显著变量。\n\n### 7.4.2. 预测模型\n\n在我们主要的实证应用中，我们使用不同模型的预测来预测股票的 beta。我们报告了三个衡量性能的指标，这些指标密切相关。首先，我们展示了样本外准确率，其定义为正确识别未来一年实现的\
