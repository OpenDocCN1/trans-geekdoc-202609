  \ *t* 估计一个 Mincer and Zarnowitz (1969) 回归的横截面版本：\n\n```\n[[1.21]](#c01.xhtml#ieqn1-21)\
  \ ![image](img/eqn1-21.jpg)\n```\n\n其中 ![images](img/ieq1-13c.jpg) 通指表示横截面收益预测。我们在预测评估期内的每个月通过\
  \ OLS 估计 `ψ[t]`。第二步中，我们计算方程 [[1.21]](#c01.xhtml#ieqn1-21) 中每月横截面斜率系数估计的时间序列平均值；我们将平均预测斜率估计表示为\
  \ ![images](img/ieq1-14.jpg)。正如 Lewellen (2015) 所讨论述的，`ψ` = 1 表示预测相对于预期收益的横截面离散是无偏的：平均每增加一个百分点。如果\
  \ `ψ` < 1，则横截面预测的特征是预测对应于实际收益增加一个百分点的过拟合，因为预测增加一个百分点对应于。或者，`ψ` > 1 信号表明预测是保守的，即预测平均增加一个百分点对应于实际收益增加少于一个百分点。\n\
