  \ 中的 OLS 系数估计进行时间平滑，因为简单的组合预测已经产生了强收缩。\n\n# 第 2 章寻找收益预测性：机器学习算法在战术配置中的应用\n\n本章对不同的机器学习（ML）算法以及文献中用于债券-股票战术资产配置的其他传统基准进行了一场“竞赛”。我们的实现包括使用公开数据和开源软件预测未来的股票市场方向。我们的研究结果表明，与常用的基准相比，投资者通过部署公开的机器学习算法可以显著提高其福利。我们的章节贡献了关于估计风险下资产配置的文献，并探讨了机器学习在寻找最优债券-股票投资组合中的应用。\n\
  \n## 2.1 引言\n\n机器学习（ML）算法作为基于规则的投资决策工具的可行性是一个持续争论的话题（Gu *et al.* 2018 和 López de\
  \ Prado 2018）。低信噪比加之不断演变的市场状况构成了机器学习算法将金融数据映射为持续优于自动化金融决策的两大主要障碍（Segal 2019）。争论的持续进行受到新算法出现、市场状况变化以及数据源可用性增加的推动。因此，关于机器学习算法实际用处的确定答案仍然难以捉。\n\
  \n在过去的几年里，机器学习算法在结构化和非结构化数据的非线性映射方面展现了巨大的能力。这些领域包括但不限于图像识别、语音识别、自然语言处理、欺诈检测、自动驾驶汽车和机器人。尽管如此，它们在金融市场的应用仍被认为是一个极其困难的任务。与图像不同，股票市场由人为干预和经济力量决定，具有内生性。虽然机器可以学会区分猫和狗，但金融市场的主要挑战在于“猫变狗”（Segal\
  \ 2019）。这意味着投资者今天能够获取的训练数据在未来相关性较低。后者在机器学习社区中被称为“漂移”（drift）概念。\n\n我们研究了机器学习算法在旨在利用收益预测性的市场择时策略背景下的应用，以超越买入持有策略。准确预测收益的可行性在\
  \ Campbell and Shiller (1988)、Fama and French (1988)、Cochrane (2007) 以及最近的 Hull\
  \ and Qiao (2015) 和 Jiang *et al.* (2018) 中得到了讨论。此外，Faber (2007)、Kritzman *et al.*\
  \ (2012) 以及 Boudt *et al.* (2015) 等为市场择时策略的所谓益处提供了证据。Kritzman *et al.* (2012) 和\
  \ Boudt *et al.* (2015) 显示，使用变化的状态概率的市场择时策略可以降低波动性并缓解组合策略的负收益。使用这些非线性模型获得的结果结果是，某些结果难以复制。\n\
  \n针对上述批评，我们仅使用公开市场数据和开源软件来评估几种机器学习算法在债券和股票之间战术资产配置的用处。在该框架下，投资者根据机器学习提取的信号在股票和债券基金之间动态切换。根据其内部构造，该策略通过在两个资产类别之间主动分配投资者的财富来帮助管理风险。考虑到提出的策略，我们与被动基金和其他常用的*事宜*\
  \ 技术相比，研究了其在绝对收益和风险调整收益方面的潜在收益。\n\n由于我们仅使用公开数据和开源软件，该策略对所有投资者（零售和专业）都是开放的。对于零售投资者而言，这种设置的一个极具吸引力的特征在于，我们可以毫不费力地利用数据形成可操作的见解。然而，这假设零售投资者可以使用机器学习和开源软件的进展。更广泛的目标用户群体将包括私人银行、机器人顾问或机构投资者。尽管如此，我们的尝试是构建一种基于规则的战术资产配置策略，该策略可能帮助零售投资者做出决策，无论他们是自己交易还是将投资委托给更复杂的投资者。在不失一般性的情况下，我们将讨论内容与零售投资者联系起来。\n\
  \n受 Hull and Qiao (2015) 框架的启发，我们实现了一种战术资产配置策略，并从统计和经济观点进行了调查。所提出的策略包括持有 `SPY` ETF\
  \ 或债券 ETF 的头位。`SPY` ETF 跟踪标普 500 指数中上市股票的市值加权指数，而 `IEF` 则跟踪 7-10 年期美国债。与 Hull and\
  \ Qiao (2015) 不同，我们的调查完全使用非许可的公开数据。通过提取数据驱动的机器学习信号并在 2005 年 12 月至 2019 年 1 月之间进行广泛的回测，我们提供的证据表明，与持有被动指数基金相比，零售投资者可以在原始收益和风险调整收益方面增加其福利。\n\
  \n\n\n\n注意，将机器学习算法提取的原始信号聚合为可操作的洞察，高度取决于投资者的风险承受意愿，这体现在建立仓位的概率阈值上。在本章的剩余部分中，我们将该阈值称为风险规避阈值。我们发现，在战术资产配置的背景下，投资者的风险意愿极大影响机器学习算法的财务表现。此外，所提出的策略在样本外收益、较低的最大回撤和较低的风险价值（VaR）方面均优于等权重配置投资组合，这证实了\
  \ Faber (2007)、Kritzman *等人* (2012) 以及 Boudt *等人* (2015) 的发现。从直观角度来看显而易见，我们择时市场或准确预测未来市场方向的能力，导致了投资资金获得更高的回报。在本研究分析的所有机器学习算法中，多层感知器（在第\
  \ 2.5 节 中介绍）在统计和财务表现方面均优于所研究的机器学习算法。\n\n本章的剩余部分安排如下：在第 2.2 节中，我们描述了分析的数据，随后是一个解释战术资产配置框架的章节。接着，将在第\
  \ 2.3 节中给出所研究的机器学习算法的概述，并在第 2.4 节中给出相应的评估标准。最后，将在第 2.5 节中讨论所实现策略的结果，随后是研究的局限性和结论性陈述。\n\
  \n## 2.2. 实证研究\n\n本节描述了数据来源以及投资者面临的投资问题。\n\n### 2.2.1. 数据\n\n与 Hull 和 Qiao (2015)\
  \ 一样，我们使用多个指标来预测标普 500 ETF 未来价格走势的方向。因此，SPY ETF 在所呈现分析^(2) 中占据了核心角色。我们使用以下五个不同的符号来构建主特征空间：\n\
  \n1. i) SPY（标普 500 ETF）；\n2. ii) IEF（7–10 年美国国债 ETF）；\n3. iii) VIX 指数；\n4. iv) GLD（黄金\
  \ ETF）；\n5. v) XLF（金融板块 ETF）。\n\n对于每个资产，我们计算了每日收益率、每日成交量（VIX 除外）以及 25 日收益率移动平均线。这构成了一个从\
  \ 2004 年 12 月 27 日到 2019 年 1 月 31 日的包含 14 个特征的数据集。\n\n战术配置策略是：只要标普 500 ETF 预计将持平或上涨，就保持投资状态。形式上，这意味着我们引入了一个虚拟变量，如果次日收益率超过阈值，则为\
  \ 1，我们将该阈值校准为 -1%。所有输入特征都将用于对标普 500 ETF 收益超过该阈值的情况进行二分类。注意，我们将该阈称为类别分配阈值。\n\n为了理解特征空间背后的直观逻辑，有几点说明。首先，SPY\
  \ 和 IEF ETF 是投资者面临的两个主要备选方案。虽然响应变量仅取决于 SPY 的方向，但投资决策涉及这两个 ETF。此外，在不确定性增加期间，投资者倾向于将资金从股票转移到国债，这种现象被称为*避险情绪*（flight-to-quality）。此外，由于所有债券都受到利率风险的影响，IEF\
  \ 的引入提供了有关市场利率环境的进一步信息。其次，记住 VIX 指数代表了标普 500 指数隐含波动率的预期。它也被称为*恐慌指数*，用于捕捉股票市场投资者的情绪。第三，我们包含了黄金\
  \ ETF，是因为它在金融市场中作为财富保障工具具有历史地位。此外，它还作为市场商品价格的代理。第四，XLF ETF 作为经济繁荣的代理，在此期间，银行和其他金融机构会扩大其资产负债表。\n\
  \n最后，我们对所有输入特征进行标准化处理，以过滤掉测量尺度对其产生的影响^(3)。我们将第 `t` 日的 14 个特征标记为 `x[t]`。在响应变量方面，我们考虑一个对应于\
  \ `t + 1` 日 SPY ETF 变化的虚拟变量。因此，机器学习算法通过将输入特征空间映射到响应变量来执行二分类任务。换句话说，机器学习算法的目的是利用由\
  \ `x[t]` 表示的可用信息估计 `t` 刻的函数，并构建一个关于 `t + 1` 时 SPY ETF 变化的预测（信号），标记为 `ŷ[t*+1]`。根据提取的信号，我们部署了一种在\
  \ SPY 和 IEF 之间进行轮换的战术资产配置策略。下一节将专门讨论该策略。\n\n### 2.2.2. 战术资产配置策略\n\n本章使用的机器学习应用其核心思想是构建一个数据驱动的解决方案，将特征空间映射到交易信号。根据信号的强度，投资者在\
  \ SPY 和 IEF 中采取相应的立场。具体而言，分配给 SPY 和 IEF 的权重取决于给定当前信息的情况下股票市场上涨（分别）的概率。\n\n形式化地，令\
  \ `a` 为在给定信息 `Ω[t]` 的情况下，`t + 1` 时股票收益超过类别分配阈值 `τ[t]` 的概率。在没有交易成本或估计误差的情况下，类别分配阈值\
  \ `τ[t]` 的自然值设置为零。在实践中，我们建议取一个小的负值 -1%，这意味着市场维持或上涨的概率。固定阈值的缺点是，当波动性变化时，超越概率也会发生变化。因此，在校准类别分配阈值时考虑波动性可能是进一步的改进。\n\
  \n注意，`Ω[t]` 表示从 `t - T + 1` 到 `t`交易日的特征空间信息集，其中 `T` 是训练机器学习算法的样本量。简而言，在我们的分析中，我们将通过观察周期\
  \ `T` 来估计输入特征与响应变量之间的映射函数。估计的映射函数将用于预测未来的价格走势。根据提取的信号，当且仅当大于常数 `a` ∈ (0,1) 时，交易策略在第二天将资金分配给\
  \ SPY；否则，将其资金的 100% 分配给 IEF。两点值得注意。首先，参数 `a` 表示投资者将部分资金分配到股票市场所需的置信水平。换句话说，它反映了投资者对给定机器学习算法预测能力的信任。其次，参数\
  \ `a` 也代表了投资者的风险规避程度。`a` 越大，其风险规避程度越高。例如，如果投资者极度规避风险（即 `a → 1`），那么无论机器学习信号如何，他都会资金分配在国债中。在本章的剩余部分中，我们将\
  \ `a` 称为置信水平。\n\n### 2.2.3. 实现\n\n\n\n\n令 `![images](img/ieq2-2.jpg)` 和 `![images](img/ieq2-3.jpg)`\
  \ 分别表示单周期（交易日）的股本收益率和债券收益。同时，令 `![images](img/ieq2-4.jpg)(`a`)` 表示对于预设置信水平为 `a`\
  \ 的投资者，机器学习（ML）策略在下一周期的收益，如下：\n\n### [\\[2.1\\]]\n```\n![image](img/eqn2-1.jpg)\n\
  ```\n\n显然，增加风险规避阈值 `a` 的值会导致策略将更多资金投入国债，并更少频繁地持有 SPY ETF 头寸。这同样表明投资者对机器学习算法的信任程度较低。在实现方面，我们将\
  \ `a` 设置为 0.5、0.85、0.9 或 0.95。\n\n从[公式 [2.1]](#c02.xhtml#eqn2-1) 可以明显看出，机器学习策略的收益取决于算法预测下一周期趋势的能力，该能力由\
  \ `![images](img/ieq2-1a.jpg)` 表示。为了计算 `![images](img/ieq2-1a.jpg)`，我们使用了 250 个交易日的窗口，即\
  \ `T` = 250。因此，时间 `t` 处的信息集（即 `Ω[t]`）由一个 250 × 14 的矩阵组成，机器学习算法从从中提取出映射函数 `![images](img/ieq2-6.jpg)`。结果，这允许投资者将近期数据\
  \ `x[t]` 转换为决策规则，即 `![images](img/ieq2-7.jpg)`。\n\n我们每月使用最近的 250 个交易日重新校准 `![images](img/ieq2-6.jpg)`\
  \ 函数。为了演示这一过程，假设每个月有 `D` 个交易日，且 `t` 代表该月的最后一个交易日。使用 `t - T + 1` 到 `t`（包含在内）之间的所有市场信息，我们估计\
  \ `![images](img/ieq2-6.jpg)` 函数，并在之后的 `D` 天（即 `t + 1` 到 `t + D` 包含在内）内对该策略进行回测。在观察了最近\
  \ `D` 天后，我们更新窗口以包含近期数据，并在 `t + D` 处估计映射函数。使用更新后的函数 `![images](img/ieq2-6a.jpg)`，我们在下个月（即\
  \ `t + D + 1` 到 `t + 2D` 包含在内）内对策略进行回测。我们重复这一过程直到样本结束。回想整个样本期于 2004 年 12 月 27 日至\
  \ 2019 年 1 月 31 日。考虑到初始样本为 250 天，这对应于每个机器学习算法的 158 个映射函数。\n\n注意，估计映射函数需要估计机器学习算法的超参数。为此，我们进行了具有\
  \ 3 次重复和 45 次重复的 10 折交叉验证。\n\n## 2.2. 基准\n\n为了比较，我们考虑了两个基准。第一个是被动的 60/40 基准，分别分配\
  \ 60% 的资金到 SPY 和 40% 到 IEF。众所周知，60/40 基准的表现优于简单策略（见 2007 年）。对于另一个基准，我们考虑了 Faber\
  \ (2007) 描述的 100% 持有 SPY 的简单策略。\n\n## 2.3. 机器学习回顾\n\n本节包含几种算法的简要概述。\n\n### 2.3.1.\
  \ K 近邻\n\n我们从一种名为 K 近邻（KNN）的简单算法开始回顾。KNN 的思想是利用观测值之间的相似性来预测事件。对于我们的目的，给定 `x[t]`，我们需要在训练集中找到最近邻。如果\
  \ `K` = 1，算法返回 `![images](img/ieq2-5.jpg)`，值为 1 或 0。或者，如果 `K` = 10，算法返回 `![images](img/ieq2-5.jpg)`，值为\
  \ 1 或 0。\n\n为了确定 `x[a]` 和 `x[b]` 是否为邻居，我们需要计算它们之间的欧式距离：\n\n```\nd(a, b) = sqrt(sum((a_i\
  \ - b_i)²))\n```\n\n给定这些标签，我们可以确定 SPY 上涨的概率 `![images](img/ieq2-5.jpg)`。例如，如果在 10\
  \ 个邻居中有 7 个与上涨相关，则 `![images](img/ieq2-5.jpg)` 为 0.7。\n\n注意，通过基于距离量的应用分类，分类器会对特征尺度非常敏感，对所有输入进行标准化可以让每个特征做出同样的贡献（Mohamad\
  \ 和 Usman，2013）。关于算法的更详细描述，参考 Kuhn 和 Johnson (2013)。\n\n### 2.3.2. 广义线性模型\n\n预测哑变量的主模型是广义线性模型（GLM），由\
  \ Nelder 和 Wedderburn (1972) 提出。在二分类逻辑回归的背景下，根据公式将 `x[t]` 分类为正事件概率：\n\n```\nP(y=1|x)\
  \ = 1 / (1 + exp(-(b0 + sum(bi * xi))))\n```\n\n给定包含 `T` 个观测值的训练样本，可以使用极大似然估计（MLE）方法估计系数\
  \ `b0` 和 `bi`。\n\n### 2.3.3. 弹性网络回归\n\n解决逻辑回归过拟合问题的一种可能方法是在 MLE 过程中添加惩罚。一种常用方法被称为\
  \ GLM 模型的弹性网络，由 Freedman 等人 (2010) 提出。它的目标是在最大化训练数据似然函数的同时，对系数 `b0` 和 `bi` 的一范数和二范数施加惩罚。\n\
  \n\n\n\n其中 `z` 表示特征数量，`λ` 表示惩罚强度，`α` 是弹性网络超参数，而 `ρ(x[i])` 是 ![images](img/ieq2-8.jpg)的缩写，即在给定`i`时刻可用信息的情况下，SPY\
  \ ETF 在`i+1`时刻上涨的概率，或者更正式地表示为 ![images](img/ieq2-9.jpg\n\n弹性网络回归中选择的 `α` 水平决定了所应用惩罚的相对重要性。因此，在\
  \ `α = 1` 的极端情况下，所应用的回归变为 Lasso 回归；而在 `α = 0` 的情况下，所应用的回归变为岭回归（Ridge Regression）。这两种惩罚类型都旨在在训练阶段向预测中引入偏差，以提高对未见数据的泛化能力。从广义角度来看，这两种正则化的工作方式相似，但在最终输出上有所不同。具体而言，岭回归倾向于将相关的预测变量相互收缩；而\
  \ Lasso 回归则倾向于给子特征赋予更高的相对重要性，并确实作为一种消除过程来确定更具预测性的特征。\n\n### 2.3.4. 线性判别分析\n\n由 Fisher\
  \ (1936) 引入的用于二分类的线性判别分析 (LDA) 从一个基本直觉开始，即寻找变量的线性组合以最好分离两个类别。通过优化线性组合的参数来实现，使得类间方差（或类中心均值）与类内方差的比值最大化。后者假设输入特征遵循具有类别特定向量和公共协方差矩阵的多变量高斯分布。通过应用输入特征的线性组合，该算法实际上执行了类间分离性最高的降维。\n\
  \n关于该算法内部原理的更多细节，请参阅 Fukunaga (2013) 书籍的第 4 章^(5)。\n\n### 2.3.5. 带有径向核的支持向量机\n\n\
  支持向量机 (SVM) 基于类别分离的思想，通过寻找最优分离超平面来最大化类别之间最近点之间的间隔（margin）。因此，它只考虑位于边界上的极少数点，这些点被称为支持向量。注意，通过仅使用支持向量来确定最优边界，该过程产生了一种高效的机器学习算法。正式地说，带有径向基的支持向量机可以通过以下拉格朗对偶问题表示：\n\
  \n\\[2.6\\] ![image](img/eqn2-6.jpg)\n\n受限于 ![images](img/ieq2-10.jpg)以及对于 `i =\
  \ 1,…, m` 的 `D ≥ α[i] ≥ 0`，其中 `K(x, y) = exp(−`σ`‖`x` − `y`‖²)`，`σ` 是调节单个实例对决策边界影响的超参数。\n\
  \n注意，核函数 `K(x, y)` 允许算法形成非线性超平面，而上限 `D`（也称为代价）为线性不可分的情况形成了软间隔（soft margin）。将 `D`\
  \ 的值设置得过高可能会导致训练数据的过拟合，而设置得过低则相反。\n\n\n\n\n多层感知器（MLP）最早由 Rosenblatt (1958) 以其单层配置引入，随后由\
  \ Rumelhart *等人的* (1985) 将其推广到多层配置。该算法由选定的若干层连续节点层组成，这些层通过带有偏置项的特征空间执行线性变换。在所执行的线性变换之上，还应用了一个额外的非线性变换——即激活函数。更正式地说，应用于单个节点上对输入进行线性变换的激活函数可以用以下方程描述：\n\
  \n\\[2.8\\] ![image](img/eqn2-8.jpg)\n\n其中 `Z[m]` 是特征空间 `x[t]` 映射到第一个隐藏层中节点 `m`\
  \ 的值，`σ` 是激活函数，`α[m]` 是将特征空间映射到节点 `m` 的权重向量，而 `b[m]` 是偏置项。我们使用典型的 sigmoid 函数作为激活函数，对于一个给定的标量\
  \ `k`，其公式由 ![images](img/ieq2-11.jpg)给出。需要注意的是，所应用的激活函数可能会遇到梯度消失问题。\n\n如果只有一层，那么它类似于具有单个隐藏层的普通原生神经网络。在这种情况下，存在一种额外的变换，将隐藏节点向量\
  \ `Z ∈ ℝ^(*M*)` 映射到下一阶段 SPY 上涨或下跌的事件。在这种情况下，市场在下一阶段上涨的概率通过输入特征的连续变换给出，即方程 [\\[2.7\\\
  ]](#c02.xhtml#eqn2-7)。\n\n如果有多层，则我们需要考虑额外的映射。然而，相同的推理方法同样适用。为了建立对 SPY 上涨的预测，即 ![images](img/ieq2-5.jpg)，我们需要估计相应的参数，这是通过反向传播法实现的。该方法利用调整相关的权重和偏置来连续地最小化损失函数，以提高神经网络的准确性。\n\
  \n## 2.3.9. 模型平均\n\n作为额外的预测，我们考虑了上述所有回顾算法的加权版本。换句话说，每个模型都会产生自己的 ![images](img/ieq2-5.jpg)。因此，考虑到所有因素，我们提供了一个加权评分，其中加权方案与每个模型样本内均方误差的倒数成比^(7)。这种方法受到\
