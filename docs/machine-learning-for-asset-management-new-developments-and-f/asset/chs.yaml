  \n### 7.4.7. 特征重要性的时间序列分析\n\n上一节分析中的通用问题是，我们绘制了所有预测观测值的分布，因此我们没有考虑时间的变化。通过时间观察分布可能有助于理解（例如）某些违反直觉的结果，即在同一范围的特征值同时显示出正和负的\
  \ SHAP 值。本节重点关注随时间推移驱动 beta 预测的特征值（从 2005 年开始）。我们关注随时间变化的特征值。\n\n图 7.13 显示了 12 个月动量在\
  \ 2005 年到 2012 年之间随时间变化的影响，随着数据的增加，高正收益变得更加重要。在 2013 年之后，离散程度减少，正收益失去了重要性。如果我们转到较小的窗口大小，可以观察到相反的模式。这表明，随着更多数据的输入，算法能够更好地理解这些信号。\n\
