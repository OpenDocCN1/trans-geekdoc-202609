  ] ![image](img/eqn3-18)\n\n显而易见![images](img/ieq3-22)类似于样本内 `R²` 统计量，衡量了稀疏预测模型减少的误差。因此，当![images](img/ieq3-22)>0\
  \ 时，`ŷ[t+1]` 预测优于历史平均预测。\n\n虽然点预测指标具有参考价值，但它们只是部分评估。理想情况下，我们还希望比较预测密度。事实上，基于预测密度的指标可以权衡预测的位置。具体而言，我们基于对数预测密度比\
  \ (LPDR) 比较惩罚模型（及其隐含策略），即\n\n\\[3.19\\] ![image](img/eqn3-19)\n\n其中 `p(y[t+1]|![images](img/ieq3-21))`\
  \ 是在时间 `t` 下由索引为![images](img/ieq3-21)的稀疏模型计算出的预测密度。我们将此类模型与基准预测框架![images](img/ieq3-24)进行比较。作为基准，使用了岭回归，它是我们模型集中唯一的纯“密集”方法（参见\
  \ Giannone *等人* 2018）。使用岭收缩先验作为基准的逻辑有两个：首先，它允许我们评估稀疏性（即将 beta 收缩至零）对外样本预测能力的实际收益，即方差偏差权衡；其次，它允许相对于常用的密集建模框架定义稀疏预测方法的优先级。\n\
  \n3.5. 资产收益预测：实证结果\n\n### 3.5.1. 统计性能\n\n我们以滚动窗口的方式估计每个稀疏预测模型。具体而言，在每个时间 `t`，根据之前的\
  \ `τ` = 120 个月收益和预测变量生成预测。预测是完全外样本的，这意味着时间 `t` 对 `y[t+1]` 的预测是基于滞后预测变量 `x[t−120:t−1]`\
  \ 和收益率 `y[t−119:t]` 获得的参数估计，根据方程[\\[3.1\\]](#c03.xhtml#eqn3-1)中的预测线性关系。因此，预测与未用于估计模型参数的实际收益进行比较。\n\
  \n\n\n\nTable 3.1 显示了不同投资组合的性能结果。对于汇总股票市场组合，各回归模型之间的 `MSPE` 相当，而 `group-horseshoe`\
  \ 先验模型获得了略优的性能。在低值组合和过往获胜者组合的情况下，`group-horseshoe` 的表现也略优于竞争方法。有趣的是，像 `ridge regression`\
  \ 这样的稠密模型与 `lasso` 这样的纯稀疏回归方法相比，表现良好。事实上，从均方误差的角度来看，`lasso` 和 `ridge` 提供的性能几乎是区分的。总的来说，当我们观察\
  \ `MSPE` 本身时，这些方法之间没有明显的优劣顺序。\n\n当我们观察预测 ![images](img/ieq3-22.jpg) 时，情况变得稍微清晰了一些。`elastic\
  \ net` 是唯一一种通过投资组合提供正向预测 ![images](img/ieq3-22.jpg) 的方法。有趣的是，除了少数细微差别（例如参见 Feng\
  \ *et al.* 2018），`elastic net` 是一种直以来在证金融文献中被忽视的方法。`elastic net` 产生一个同时受 `L1-norm`\
  \ 和 `L2-norm` 惩罚的回归模型。其结果是有效地收缩系数（类似于 `ridge regression`）并并将某些系数设置为零（类似于 `lasso`）。因此，它是利用模型选择和参数正则化双重益处的自然候选者。预测\
  \ ![images](img/ieq3-22.jpg) 方面的结果表明，在数据丰富的环境中，在模型选择和正则化之间进行可能不是线性回归的最优策略。\n\nTable\
  \ 3.1 还报告了对数预测密度比 (`LPDR`)，将每个稀疏预测回归模型与 `ridge regression` 进行比较。如上所述，`ridge regression`\
  \ 被用基准，因为是我们考虑的唯一纯稠密建模框架。通过使用 `ridge regression` 作为基准，除了简单地对回归 beta 系进行正则化之外，我们还可以分离出在数据生成过程中施加稀疏性的益处。正的\
  \ `LPDR` 是支持相对于 `ridge regression` 的替代预测策略的证据。\n\n注意，基于预测密度的性能指标衡量并比较了预测密度的离散程度以及位置，并对原始\
  \ `RMSE` 测量进行了详细说明；比较这两种测量（即点预测和密度预测），可以对不同策略的预测能力有更广泛的理解。\n\n![表 3.1 样本外统计性能 ¶\
  \ 此表报告了稀疏预测回归模型在不同投资组合和资产类别中的样本外比较。报告的方法包括 `ridge`、`lasso`、`horseshoe`、`group-lasso`、`elastic\
  \ net` 和 `group-horseshoe`。对于每种方法，我们报告了均方预测误差 (`MSPE`)、预测 ![images](img/ieq3-22.jpg)\
  \ 以及对数预测密度比 (`LPDR`)](images/tab3-1.jpg)\n\n**表 3.1.** *样本外统计性能* ¶ 此表报告了稀疏预测回归模型在不同投资组合和资产类别中的样本外比较。报告的方法包括\
  \ `ridge`、`lasso`、`horseshoe`、`group-lasso`、`elastic net` 和 `group-horseshoe`。对于每种方法，我们报告了均方预测误差\
  \ (`MSPE`)、预测 ![images](img/ieq3-22.jpg) 以及对数预测密度比 (`LPDR`)。\n\n实证证据表明，稀疏性有助于提高线性预测回归的样本外性能。在平均范围内，`lasso`、`group-lasso`\
  \ 和 `elastic net` 往往优于 `ridge regression`。当我们关注替代资产类别时，我们观察 `elastic net` 提供了最一致且最强的跨越表现。有趣的是，至少在我们的应用背景下，`horseshoe\
  \ shrinkage prior` 及其基于组的扩展并没有很好的表现。总的来说，统计证据支持稀疏性对线性预测回归的益处。\n\n在下一节中，我们将进一步探讨不同稀疏预测回归的性能评估，为每个投资组合单独实现一种简单的旋转策略，并从一个需要在给定投资组合和无风险资产之间分配财富的投资者角度来看。\n\
  \n### 3.5.2. 经济意义\n\n稀疏预测回归能够检测到的预期超额收益的时间变动量，自然要求要求成功的市场择时策略。遵循 Gallant *et al.*\
