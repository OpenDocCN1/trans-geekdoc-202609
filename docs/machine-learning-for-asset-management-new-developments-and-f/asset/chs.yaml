  \ 撰写。\n\n\n\n\n### 3. 底层的 Fama–French 因子包括账面市值比、市值、动量和 Beta 值。\n\n### 4. 尽管此处使用的方法仅使用了典型\
  \ Fama–French 模型中的四个因子，但市场上也有几种商用归因软件软件包使用了类似的方法进行基于因子的归因。使用更多因子（例如板块或行业）将会增强这种方法的效力，但为了进行有意义的比较，在基于机器学习的方法中也必须使用相同的变量。\n\
  \n# 11. 当交易可能拥挤时的交易成本建模：一种基于部分观测订单不平衡的贝叶斯网络\n\n本章利用一个美国机构投资者在股票市场交易的大型数据库，探讨了同步执行对交易成本的影响。我们设计了一个贝叶斯网络，对投资者的交易成本、股票特征（买卖价差、换手率和波动率）、元订单属性（交易方向和规模）以及执行期间的市场压力（通过投资者元订单的净订单流不平衡衡量）之间的依赖关系建模。与标准的机器学习算法不同，贝叶斯网络能够解释变量之间显式的相互依赖关系。它们也被证明对缺失值具有稳健性，因为它们能够根据世界状态恢复最可能的值。由于订单流不平衡仅是部分观测的（在某部分交易上或存在延迟），我们展示了如何设计贝叶斯网络来推断其分布，以及如何利用这些信息来估计交易成本。我们的模型提供了比标准\
  \ (OLS) 模型更好的预测。预测误差更小，并随着投资者订单规模的增大而减小，因为大订单对总体订单流不平衡提供了更多信息（`R²` 从订单规模最小到最大的分位数，样本外从\
  \ –0.17% 增加到 2.39%）。最后，我们证明了交易成本预测的准确性高度取决于股票波动性，系数为 0.78。\n\n## 11.1 引言\n\n金融危机之后，交易成本变得至关重要。一方面，投资银行转向更标准化的产品，从高利润、库存驱动的业务转向低利润、流量业务，在后者必须极度地降低交易成本。另一方面，资产管理行业趋于集中（Haldane\
  \ *et al.* 2014）。一种常见的做法是围绕一个结构良好的交易台来组织大订单的执行。2007 年，第一部《欧盟金融工具市场指令》（MiFID）将“最佳执行”概念作为市场参与者的新要求引入。欧洲的良好实践（包括执行审查、交易成本分析和大型订单的合理拆分等）已在这一全球化行业中向海外。\n\
  \n在本章中，我们使用了一个独特的机构投资者交易数据集：ANcerno 数据库，它包含了美国市场大量资产管理者的元订单样本（Angel *et al.* 2015,\
  \ Pagano 2008, Brière *et al.* 2019）。虽然大多数其他数据库仅包含一个资产管理者的元订单，但 ANcerno 记录了约 10%\
  \ 的总机构投资者活动以及日总交易额的 8%。由于这种特殊性，可以估计“元订单不平衡”，即投资者每天在每只股票上交易的聚合净订单流。该变量在交易成本中起着首要作用（Capponi\
  \ and Cont 2019, Bucci *et al.* 2018）。当你与同伴以同一方向交易时，交易成本往往很大；而如果你几乎是当天大多数交易者面前的唯一交易者，你甚至可以获得价格改善（即获得低于决策价格的平均价格）。换句话说，当你是群体的一部分并与市场同向执行时，你在支付费用以消耗流动性；而当你与市场相反方向执行时，你通过为群体提供流动性获得奖励。\n\
  \n这种不平衡变量的特殊性在于，市场参与者无法实时观测它。经纪商和做市商对客户流的不平衡有广泛视角，并可以延迟向其他市场参与者提供此类信息，而资产管理交易台只能观察自己的指令。因此，这种不平衡在贝叶斯建模的意义上是一个`latent\
  \ variable`。它与某些观测的解释变量相关，同时调节交易成本。例如：根据投资者交易的是买入元订单（而非卖出订单），不平衡更有可能是大的正值。这种依赖关系可以使用贝叶斯法则进行推断。\n\
  \n在本章中，我们展示了如何使用机器学习提供的大型工具箱中的一种特定模型：贝叶斯网络，并适用于这种条件约束，在考虑市场信息和交易特征的情况下来预测交易成本。这类模型创建于机器学习的黄金时代（Jordan\
  \ 1998）；它们也被称为图模型，最近被用于模拟分析师的预测（Bew *et al.* 2018）。此类模型具有两个非常感兴趣的特征。第一，它们能够处理缺失数据。第二，它们可以在已知其他变量的情况下推断隐变量的分布。在我们的案例中，在\
  \ ANcerno 数据上拟合的模型可用于在不平衡不可观测时预测交易成本。在实践中，我们的模型可以在经纪商提供的事后*ex post* 数据上拟合。随后，在给定其他解释变量和观测到的交易成本的情况下，贝叶斯网络可以推断出某日不平衡的预期分布。这是贝叶斯法则的一个自然特征：一旦已知一组变量的联合分布，就可以根据观测值获得其他变量的任何子集的期望值。\n\
  \n本章的目标是展示如何利用贝叶斯网络来对交易成本与股票特征（买卖价差、平均换手率和波动率）、元订单属性（交易方向和规模）以及市场压力（净订单流不平衡）之间的关系建模。最后一个变量将被视为隐变量，因为对投资者而言它只是部分观测的（通常存在延迟，或者是实时的但仅限于投资者自身的交易）。在实践中，实现我们方法的一种可能途径是实施学习迁移：首先，在\
  \ ANcerno 或经纪商提供的类似数据库上学习图模型，然后切换到无法观测不平衡的数据库。\n\n\n\n\n我们发现，机构投资者的每日订单流不平衡是交易成本的良好预测指标。有趣的是，由于投资者的交易往往向某一个方向拥挤，且考虑到基金经理对自身元订单（meta-order）的了解，他或她可以推算出当天的市场聚合订单流以便更好地预测其交易成本。换句话说，基金经理在观察自己的交易决策（订单的方向和规模）后，可以更新对当天订单流不平衡分布的信念。我们发现，当执行的元订单规模较大时，其估计更为准确。此外，我们披露的证据表明，卖单在不平衡分布方面比买单具有更多信息，这可能是因为拥挤的卖出环境比拥挤的买入环境反映特定的市场状况。我们注意到，当资产经理决定卖出一只参与率高的股票时，他或她可能会预见到同僚出现“抢向出口处”的行为，并为强负不平衡分配高概率。我们的发现证实了，执行缺口（implementation\
  \ shortfall）预测的主导变量确实是订单流不平衡，而非订单规模。此外，交易成本和市场影响估计的准确性通常非常低（Bacry *et al.* 2015）。从业者长期以来怀疑估计订单交易成本的难度在于几乎不可预测的价格创新方差。得益于我们的贝叶斯框架，我们证明了这确实如此。贝叶斯网络显式地模拟了残差方差与网络其余节点之间的依赖关系。我们发现主导变量确实是价格波动性，系数为\
  \ 0.78，而其他节点对方差的贡献并不显著。这使得投资者能够根据其元订单和股票特征，评估对每项预测的信心程度。最后，我们证明了使用部分观测订单不平衡是有价值的。在捕捉节点与订单流不平衡之间的条件依赖后，贝叶斯网络提供的交易成本预测比完全不使用这些信息时更好（`R²`\
  \ 样本外从 0.38% 增加到 0.50%）。此外，当订单规模较大时，估计变得更加准确（订单规模第十十分之一的 `R²` 为 2.39%，而第一十十分之一仅为\
  \ –0.17%）。这些结果可以解释近期机构投资者执行集中在少数几个交易台的现象。通过执行大量且具有代表性的机构投资者的订单，这些交易台将更好地掌握当天的聚合订单流不平衡。这种至关重要的信息随后可以用于更准确地预测交易成本，或用于在考虑聚合市场压力的情况下设计更优的执行方案。\n\
  \n本章的结构如下：第 11.2 节回顾了关于交易成本建模和贝叶斯网络的现有文献。第 11.3 节介绍了数据。第 11.4 节提供了投资者交易规模和订单不平衡对交易成本影响的实证证据。第\
  \ 11.5 节描述了贝叶斯网络方法及其在交易成本建模中的应用。第 11.6 节和第 11.7 节给本章的结论。\n\n## 11.2. 相关文献\n\n本章处于两个领域的交叉点：一方面是交易成本和市场影响文献，另一方面是贝叶斯建模。\n\
  \n### 11.2.1. 交易成本与市场影响\n\n市场影响在两篇论文后引起了学术界的关注：经济学家通过 Kyle 的理论论文（1985）被引入这一关键概念，而量化金融研究人员则很大程度上受到\
  \ Almgren 和 Chriss（2001）实证结果的影响。Kyle (1985) 显示了市场做市者如何有策略地要求向知情交易者（即资产经理）收取一项费用，以补偿其在嘈环境中环境中评估所面临的逆向选择的难度。这通常是我们在实证中观察到的现象。资产经理必须为流动性需求支付费用，同时他们可以通过提供流动性获得回报。其他市场参与者对聚合报价或需求做出反应。这种聚合量正是我们定义的`某日元订单不平衡`。Kyle\
  \ 的核心结果是，在线性市场做市者定价规则和高斯框架内，投资者聚合所支付的交易成本与聚合元订单的规模成线性关系。`Kyle` 的 `lambda`（衡量价格影响对成交流量的敏感度）是流动性的传统衡量标准。这一理论框架最近变得复杂，将\
  \ Kyle 的博弈论框架扩展到连续时间和非高斯行为，并允许市场做市者的策略考虑风险规避（Cetin and Rogers 2007）。现在人们认为，知情交易者的最优策略是试图在噪声中隐藏元订单，而市场做市者必须缓慢消化订单流，以提取其中包含的信息并要求相应的价格。然而，产生的市场影响并不一定是线性的。随后的实证研究表明，在实践中，市场影响与订单规模的关系更接近平方根而非线性（Collins\
  \ and Fabozzi 1991, Bouchard *et al.* 2011 以及 Robert *et al.* 2012）。\n\nAlmgren\
  \ 和 Chriss (2001) 的论文展示了如何优化分割订单以最小化执行成本，假设了凹性的瞬态市场影响。Bouchard *et al.* (2011) 推导出了一种优化控制方案以减轻大元订单的成本。该文献具有首意义，因为它回答了有关“最佳执行证明”的监管要求，并为资产经理和投资银行提供了改进执行最佳实践和指标的基准框架。随着因子投资的流行，监管机构和市场参与者提出了跟踪指数或系统主动策略的投资策略其执行成本的具体问题。Frazzini\
  \ *et al.* (2012)、Novy-Marx 和 Velikov (2015) 以及 Brière *et al.* (2019) 正试图通过建模大订单规模的交易成本并估计因子驱动投资策略的盈亏平衡，来回答交易策略潜在最大容量的问题。\n\
  \n### 11.2.2. 贝叶斯网络\n\n\n\n机器学习是统计学习的延伸，诞生于 Vapnik 和 Chervonenkis 的开创性论文（1971）。根据具有至少一个隐藏层的非线性\
  \ `Perceptrons`（感知器，一类特定的神经网络）的通用逼近定理（Hornik *et al.* 1989），统计学家和数学家开始研究基于可能非凸的损失函数最小化的逼近方案，通常使用随机梯度下降（Amari\
  \ 1993）来达到全局最小值，同时有较好的机会逃离局部最优。贝叶斯统计学的成功侧重于通过共轭分布的概念将先验分布和后验分布耦合起来（Vila *et al.*\
  \ 2000），这为基于极大似然估计的神经网络与贝叶斯统计学的结合打开了大门。贝叶斯网络运而生（参见 Pearl (1986) 的开创性论文）。贝叶斯网络是建模大型多元概率模型和进行推断的便利工具。贝叶斯网络在直观的图形表示中将可观测解释变量与隐藏潜变量结合起来。\n\
  \n在应用方面，贝叶斯网络首先被用于医疗诊断，因为它们被认为是 `expert systems` 的自然延伸。专家系统随着第一波人工智能工具（确定性决策树）而出现。为这些树添加一些概率属性并将其重塑为图，是观察贝叶斯网络出现的另一种方式。这些模型也成功地用于计算组件的故障排除，从打印机（Skaanning\
  \ *et al.* 2000）到计算机网络（Lauritzen 2003）。它们在计算机相关问题的解决自动化方面发挥了重要作用。最近，它们被应用于金融领域。Bew\
  \ *et al.* (2018) 使用贝叶斯网络结合分析师的建议以改进资产管理决策。\n\n这些模型可以非常自然地捕捉不同变量的联合分布，该分布通过图形模型指定，其中节点表示变量，箭头模拟概率依赖关系。图\
  \ 11.1 是一个非常简单的例子，说明股票的买卖价差及其波动率都会影响交易成本，同时，股票波动率对买卖价差也有影响（Laruelle and Lehalle\
  \ 2018）。该图在概率语言中的翻译如下：`trading costs` `TC` 遵循律 `\U0001D4DB`，其参数 `Θ[`TC`]` 是 `bid`-`ask\
  \ spread` `ψ` 和 `volatility` `σ` 的函数：`TC` `∼` `\U0001D4DB(`Θ[`TC`]` (`ψ`, `σ`))`。`bid`-`ask\
  \ spread` 律的参数被视为一个随机变量，其本身是波动率的函数：`ψ` `∼` `\U0001D4DB(`Θ[`ψ`]`(`σ`))`。\n\n关于贝叶斯网络机制的更多细节见于第\
  \ 11.5 节。在此阶段，只需说明 `latent variables` 可以添加到图中。一个不总是可观测的但作为观测变量之间概率中介（即条件变量）的中间变量，就足以构建贝叶斯模型。在图\
  \ 11.1 的简单例子中，我们可以观测或无法观测买卖价差。当它未被观测时，贝叶斯网络将使用其律 `\U0001D4DB(`Θ[`ψ`]`(`σ`))` 在观测到的波动率条件下推断出其最可能的值。为了做到这一点，模型使用了贝叶斯条件概率链式法则。在我们的分析中，我们总是观测买卖价差，但机构投资者的元订单净订单流不平衡通常是未知的。本提出了一种贝叶斯网络，通过图形模型对交易成本进行建模和预测，其中元订单的不平衡是一个潜变量。\n\
  \n![图 11.1. 用于交易成本建模的简单图形模型](img/fig11-1.jpg)\n\n**图 11.1.** 用于交易成本建模的简单图形模型\n\n\
  总结，我们的章节利用贝叶斯网络将机构投资者的预期交易成本建模为元订单特征（本质上是其规模和方向）、市场环境（股票波动率、买卖价差和订单流不平衡）的函数。通过提出一种考虑潜变量（在本例中为订单流不平衡）的方法，我们对交易成本估计的文献做出了贡献。这个变量只能部分观测（带有延迟或在所有交易的一个集上），但对于构建模型至关重要。我们的模型有许多潜在应用，可预测交易成本、估计策略容量或决定最佳交易执行。\n\
  \n## 11.3. ANcerno 数据库\n\n我们从 ANcerno Ltd. 获取了 2010 年 1 月 1 日至 2011 年 9 月 30 日期间的机构交易数据。ANcerno（原\
  \ Abel Noser Corporation）是美国提供交易成本分析（TCA）的领先咨询公司之一。它为全球 500 多个机构投资者（包括养老基金、保险公司和资产经理）提供股票交易成本分析。学术界很大程度上使用该数据库研究机构投资者的交易行为（例如，参见\
  \ Anand *et al.* 2011, Puckett and Yan 2011 以及 Eisele *et al.* 2017）。ANcerno 客户发送他们的股票交易以监控其执行质量。ANcerno\
  \ 系统地报告其收到的所有股票交易。因此，在 ANcerno 上估计的成本代表了机构投资者实际支付的成本。此外，此前的研究显示 ANcerno 不存在任何存者偏差或回填偏差（参见\
  \ Puckett and Yan 2011），它占 CRSP 总成交额的约 8%（Anand *et al.* 2013）以及机构总活动的 10%（Puckett\
  \ and Yan 2011）。\n\n因此，在我们的研究中，我们使用了来自 ANcerno 的标普 500 指数历史成分的交易级数据。对于每笔执行，ANcerno\
  \ 报告了股票的 CUSIP 和代码代码、分钟精度的执行时间、执行日期、执行价格、方向（即买入或卖出）、交易股、支付的佣金、该交易是否为较大订单的一部分，以及评估执行质量的多个交易级基准。在我们的样本中，我们拥有\
  \ 285 家机构（即 ANcerno 客户）的执行数据。他们可能是个人共同基金、一组基金，或订阅了 Abel Noser 分析服务的基金经理。每个机构拥有一个或多个账户。在我们的样本中，我们成功追踪了近\
  \ 4 万个账户的活动，这些账户负责 3.9 万亿美元的交易，使用了 680 家不同经纪商的服务。与 CRSP 报告的市场份额相比，ANcerno 在整个期间的平均占比\
  \ 4.5%。ANcerno 报告的交易额每年超过万亿美元，因此具有足够的相关性。\n\n\n\n[content]\n根据机器学习的最佳实践，我们将样本分为占\
  \ 70% 元订单（meta-orders）的训练集和占剩余 30% 的测试集。训练集是从样本中的元订单中随机选择的，例如确保买单和卖单的数量相等。这一程序对于我们的研究至关重要，以便估计出无偏偏的净订单流失衡。如果训练集中的买卖单数量不平衡，订单流失衡的先验分布将人为地向正值倾斜（如果买单数量较多）或向负值倾斜。训练集用于计算第\
  \ 11.4 节和第 11.5 节的结果，而测试集则用于第 11.6 节中的样本外预测。\n\n## 11.4. 交易成本建模\n\n我们使用传统的缺执行缺口（implementation\
  \ shortfall）指标（Perold 1988）来衡量交易成本。这是理论价格或基准价格与执行时实际支付的价格之间的差异，以基准价格的百分比表示。在我们的研究中，我们将参考价格定义为执行开始前的最后一个可见价格（到达价格）。缺执行缺口衡量了策略相对于其理论收益可能经历的滑点总额。从本质上说，我们的成本估计衡量了策略理论收益在实践中实际上能实现多少部分。\n\
  \n对于一个大小为 `Q[k]`(`m`) 的父订单 `m`，它被拆分为 `N[trades]` 个大小为 `v[k,m]`(`i`) 的子订单^(2)，这些订单在日期\
  \ `d` 以 `s[k]`(`m`) 的方向执行，其缺执行缺口的计算方式如下：\n\n\\[11.1\\] ![image](img/eqn11-1.jpg)\n\
  \n其中`![images](img/ieq11-1.jpg)` 是参考价格（在我们的情况下，由 ANcerno 提供的到达价格）。在本节中，我们研究了订单规模和订单流失衡对投资者交易缺执行缺口的影响。\n\
  \n### 11.4.1. 订单规模\n\nKyle (1985) 引入了一个概念，市场参与者的交易可能会对市场价格产生影响。市场冲击是订单规模效应的直接结果。大型元订单可能会导致价格向交易者不利的方向移动，导致更高的缺执行缺口。因此，执行成本随订单规模的增加而增加。一系列实证研究在\
  \ Kyle 的理论工作之后，证实了订单规模效应的存在（Torre and Ferrari 1999, Moro *et al*. 2009, Gomes and\
  \ Waelbroeck 2015, Bacry |em et al. 2015, Brière *et al*. 2019）。为了说明这种效应，我们根据参与率\
  \ `Q/ADV` 将 ANcerno 订单重新分组为 100 个箱体（其中 ADV 代表平均日成交量），并在图 11.2 中绘制每个箱体经订单价格波动率缩放的平均缺执行缺口图。通过股票价格波动率进行缩放，使得缺执行缺口的估计在不同时期和整个股票池之间具有可比性。否则，我们无法计算每个箱体的平均值，因为参与率效应对于买卖价差大的股票与买卖价差小的股票是不相同的。ANcerno\
  \ 订单显示出缺执行缺口与相对于日成交量的订单规模之间存在凹函数关系。我们观察到，当订单规模从平均日成交量的 0.01% 增加到 2% 时，成本从价格波动率的\
  \ 0 到 0.2 个点急剧增加。之后斜率开始衰减。例如，参与率为 14% 的订单平均成本为 0.4 个点。幂律函数很好地捕捉了缺执行缺口对订单规模的依赖。\n\
  \n![图 11.2. 订单规模对交易成本的影响](img/fig11-2.jpg)\n\n**图 11.2.** 订单规模的影响*\n\n### 11.4.2.\
  \ 订单流失衡\n\n虽然大多数交易成本模型强调市场冲击对订单规模的依赖性，但直到最近，订单流失衡才被认为是解释交易成本规模的一个重要因素。使用 ANcerno\
  \ 数据库，Capponi 和 Cont (2019) 比较了订单规模与订单流失衡作为代理的解释力。他们得出结论，投资者应该关注执行期间的聚合压力动态，而不是关注单笔交易层面的市场冲击。此外，市场压力是由所有市场参与者共同的。然而，对这种压力贡献最大的交易者应该被特别考虑进去。这些市场参与者具有\
  \ Kyle (1985) 所引入的知情交易者的特征。在交易结束时，曾经由知情者掌握的信息传播到了市场并纳入价格水平。Bucci *et al*. (2018)\
  \ 认为市场冲击是净成交量的函数，因此由所有市场参与者共享。因此，如果以相同方向执行，小规模订单的缺执行缺口几乎与大订单相同。\n\n我们引入净订单流失衡来研究投资者交易对缺执行缺口的影响。对于在日期\
  \ `d` 执行的元订单 `m`，净订单流失衡定义为净成交量占总成交量的比率：\n\n\\[11.2\\] ![image](img/eqn11-2.jpg)\n\
  \n其中 `k` 设计股票，`s[k]`(`m'`, `d`) 是元订单 `m'` 的方向（即买单为 1，卖单为 -1），`Q[k]`(`m'`, d`) 是其规模。\n\
  \n图 11.3 显示了缺执行缺口对投资者流失衡的依赖性。首先，我们注意到这种关系是线性的。失衡的绝对值越大，价格偏离的绝对值越高。但取决于交易方向与净流失衡是相同（从而加剧现有市场压力）还是相反（为市场提供流动性），我们可能会在投资者向相同方向同步交易时（`Imbk\
  \ = 1`）支付高达 0.4 个波动率点的巨大交易成本，或者当交易者几乎处于聚合流面前时（`Imbk = –1`）获得 0.3 个波动率的价格改进。值得注意的是，失衡为零时的缺执行缺口略大于零。在中性市场压力下，投资者根据交易股票和元订单大小支付正交易成本。\n\
  \n![图 11.3. 订单流失衡对交易成本的影响](img/fig11-3.jpg)\n\n**图 11.3.** 订单流失衡的影响*\n\n\n\n\n第\
  \ 11.4.1 节和 11.4.2 节中的结果显示，执行缺口（implementation shortfall）取决于执行订单的大小以及执行期间的市场压力。市场压力通过投资者的净订单流流不失衡来衡量。为了区分这两种效应（如图\
  \ 11.4 所示），我们根据元订单符号单边不失衡 `s[k]*(*m*) Imb*k*` 的 30% 和 70% 分位数将样本分为三个不同的箱体。在每个箱体内部，我们根据元订单参与率\
  \ `Q[k]*(*m*)*/*ADV*k*` 将元订单分为 100 组（bins），并计算每个组的、经股票波动率缩放的平均执行缺口。图 11.4 绘制了该结果，其中蓝线显示了在高市场压力下执行的元订单的订单大小效应（符号不失衡低于\
  \ 30% 分位数）。橙色线显示了在标准市场压力下执行的元订单的效应（符号不失衡处于 30% 和 70% 分位数之间）。相比之下，绿线显示了与市场方向一致执行的订单的结果（符号不失衡大于\
  \ 70% 分位数）。我们观察到，元订单大小的影响在三个箱体中是持续的，即使在对净订单流不失衡进行条件处理后，幂律依然有效。符号不失衡的线性效应在三个箱体之间的交易成本水平差异是可见。这证明了这两个解释因素并没有相互抵消。我们还注意到，大多数与投资者净订单流反向执行的元订单从执行开始到结束这段时间内从价格改善中获益。在极度失衡的市场中，流动性提供者获得了更好的执行价格。然而，对于规模较大的元订单\
  \ `Q[k]*(*m*)*/*ADV*k* = 23%`，交易的市场影响占据主导地位，交易者平均支付正的交易成本。反之亦然：当交易者寻求与大部分机构投资者相同方向的流动性时，交易成本会比通常更贵。\n\
