  \ -0.0194 | 0.0014 | -0.0208*** |\n\n## 5.6. 结论\n\n本章将机器学习应用于交易投资思路的过滤背景中。具体而言，我们使用了随机森林和梯度提升树来预测交易思路的成功或失败。这些方法允许我们整合广泛的预测因子，这些因子之间具有不同程度的依赖性，并提供了一种研究其重要性及预测价值的方法。我们评估了所提方法的经济意义和实际应用影响。我们为每个交易思路分配了概率，通过从池化的交易思路中进行选择来定期再平衡，并在选定的频率重新训练模型。我们还跨并探索了许多参数，从模型超参数到训练窗口的选择、重新训练频率等。我们发现，动量相关的特征具有最大的信息量，流动性和波动性也是如此。我们还发现，对多头思路的改进在\
  \ 1.06% 到 1.85% 之间，而对空头思路的改进在 1.57% 到 2.78% 之间。一个更令人惊讶的结果是，在整体股市处于上升趋势的情况下，我们的方法成功识别出了平均收益为负的空头思路。\n\
