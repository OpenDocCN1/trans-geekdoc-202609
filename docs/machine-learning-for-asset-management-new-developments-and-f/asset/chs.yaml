  \n**图 5.11.** *梯度提升树分类器在为期一年的测试（2017 年 6 月至 2018 年 6 月）和训练期（2009 年 3 月至 2017 年 6\
  \ 月）八天累计收益区间下的受试者工作特征（ROC）曲线。彩色版参见 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n如所述，我们在不同的梯度提升树和随机森林方法变体之间根据性能进行了选择。在每类方法中，可以对大量的参数进行某些超参数调优。图 5.12 显示了梯度提升树方法对树的数量和允许的最大树深度的敏感性。其他调优的参数还包括学习率和每个分裂节点允许选择的最大特征数。我们没有尝试调优其他几个超参数，因为它们的维度会变得非常大，导致我们可能会陷入过拟合。此外，如图所示，超参数调优确实产生了一影响，但它只影响损失函数的第三位小数位，且对\
  \ AUC 指标的影响最多为 0.03。然而，请注意，各种参数之间存在相互作用，在多维可调参数网格中，通常需要进行网格搜索或随机搜索。例如，降低学习率会导致最优迭代次数的增加。\n\
  \n![图 5.12. 梯度提升树的超参数调优示例，显示了对树的数量和最大深度的调优。彩色版参见 www.iste.co.uk/jurczenko/machine.zip](img/fig5-12.jpg)\n\
  \n**图 5.12.** *梯度提升树的超参数调优示例，显示了对树的数量和最大深度的调优。彩色版参见 [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n图 5.13 显示了随机森林最大树深度和每个节点分裂可搜索的最大变量数量的超参数调优示例。注意，通常后者的良好默认值是特征数量的平方根，由于我们的特征总数为\
  \ 25，因此该值为 5；然而，超参数调优似乎选择了提供范围内的最大值，即 12。\n\n![图 5.13. 随机森林的超参数调优示例，显示了对每个分裂中可搜索特征数量和最大树深度的调优。彩色版参见\
  \ www.iste.co.uk/jurczenko/machine.zip](img/fig5-13.jpg)\n\n**图 5.13.** *随机森林的超参数调优示例，显示了对每个分裂中可搜索特征数量和最大树深度的调优。彩色版参见\
  \ [www.iste.co.uk/jurczenko/machine.zip](http://www.iste.co.uk/jurczenko/machine.zip)*\n\
  \n总结，本节研究了机器学习模型处理该问题的能力和稳健性。\n\n## 5. 经济意义\n\n在本节中，我们讨论了预测的经济意义。我们在图 5.14 中展示了累计收益的分布。我们观察到在所有情况下，“多头”分布都向右移动（即收益更高），而“空头”分布则向左移动（即负收益更多）。\n\
  \n![图 14a. 2018 年测试的累计收益分布，过滤与未过滤思路的对比](img/fig5-11.jpg)\n\n**图 14a.** *2018 年测试的累计收益分布，过滤与未过滤思路的对比*\n\
  \n![图 14b. 2017 年测试的累计收益分布，过滤与未过滤思路的对比](img/fig5-12.jpg)\n\n**图 14b.** *2017 年测试的累计收益分布，过滤与未过滤思路的对比*\n\
  \n![图 14c. 2016 年测试的累计收益分布，过滤与未过滤思路的对比](img/fig5-13.jpg)\n\n**图 14c.** *2016 年测试的累计收益分布，过滤与未过滤思路的对比*\n\
  \n我们还在表 5.2 中展示了 2016-2018 年以及半年度和季度频率的平均累计周收益。使用了重训练日期之前的五年作为窗口。结果证实了多头思路向高值移动、空头思路向低值移动的趋势。特别是我们发现多头思路的改进范围在\
  \ 1.06% 到 1.85% 之间，而空头思路的改进范围在 1.57% 到 2.78% 之间。在我们看来，一个更有趣的结果是，我们的方法成功在股票市场上涨期间识别出了具有负收益的空头思路。\n\
