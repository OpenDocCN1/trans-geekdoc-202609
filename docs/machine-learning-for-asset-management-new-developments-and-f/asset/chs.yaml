  \ 800 倍的差距！\n\n## 8.4. 组合优化的应用\n\n上述算法的开发将从根本上改变组合优化的实践。到目前为止，我们看到组合经理生活在二次规划的世界里。有了这些新的优化算法，我们可以考虑更复杂的组合优化方案，包含非二次目标函数、带有惩罚函数的正则化以及非线性约束。\n\
