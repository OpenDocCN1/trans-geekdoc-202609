  \ Quantitative Strategy, 2019 年 1 月）](img/fig4-7.jpg)\n\n#### 图 4.7. *机器学习模型与 Macquarie\
  \ Alpha 模型的相关性（来源：Macquarie Quantitative Strategy, 2019 年 1 月）*\n\n#### 4.5.4. 按篮子划分的主动收益\n\
  \n在图 4.8，我们绘制了五分组篮子相对于*等权重*基准的平均超额收益图。使用标准的市值加权指数会产生误导，因为超额收益会受到投资组合构建差异的影响，而这种差异倾向于有利于等权重篮子。因此，我们使用了相关\
  \ MSCI 指数的等权重版本。置信区间基于 t 分布，可用于评估我们提议策略表现的显著性。\n\n![图 4.8. 主动收益，MSCI USA（来源：Macquarie\
  \ Quantitative Strategy, 2019 年 1 月）。此图的彩色版本请参阅 www.iste.co.uk/jurczenko/machine.zip](img/fig4-8.jpg)\n\
  \n#### 图 4.8. *主动收益，MSCI USA（来源：Macquarie Quantitative Strategy, 2019 年 1 月）。此图的彩色版本请参阅\
  \ www.iste.co.uk/jurczenko/machine.zip*\n\n主动收益的正负号均符合预期：第一分位组（最具吸引力的股票）始终优于基准，而第五分位组在所有情况下均优于基准。某些策略表现出非常不对称的模式：例如，梯度提升机器和\
  \ OLS 都依赖于空头来产生超额收益。置信区间还表明，这两个模型的多头篮子收益均不显著高于基准，因为 90% 的区间包含零。像我们的 Alpha 模型和随机森林这样的模型表现更好，因为它们在多头和空头端都显示出显著的主动收益。\n\
  \n#### 4.5.5. 校准超参数与模型复杂度\n\n模型在样本内是如何训练的？它们找到了什么样的解决方案？模型架构有多复杂？我们是否能够预先判断模型是否拟合效果差？为了回答这些问题，在本节中，我们绘制了一些描述我们模型架构的超参数。我们关注树，是因为超参数与模型复杂度直接相关，且我们不报告惩罚性线性模型的复杂度参数。\n\
  \n我们没有报告神经网络的超参数，因为它们不像基于树的模型那样具有直观的解释性。一个有趣的扩展是校准网络的深度和宽度，并分析架构随时间的变化。\n\n每个超参数都是每年执行一次网格搜索的结果，即在年初，并使用最近的八作为作为验证。在图\
  \ 4.9 中，我们报告了随机森林模型的平均深度、树的数量、不同特征的数量以及参数 `m` (mtries)。不同特征的数量是进入森林中某棵树的不同协变量平均数量，即因为我们在每个分裂层级选择\
  \ `m` 个变量，一棵树可能会对同一个特征进行多次分裂。因此，为了计算此值，我们考虑森林中的每棵树，并计算在该树中使用的不同特征的数量。然后，对所有树取平均值。\n\
  \n![ ¶ 图 4.9. 超参数：随机森林（来源：Macquarie Quantitative Strategy, 2019 年 1 月）](img/fig4-9.jpg)\n\
  \n¶ 图 4.9. *超参数：随机森林（来源：Macquarie Quantitative Strategy, 2019 年 1 月）*\n\n与 Gu 等人\
  \ (2018) 的发现一致，我们发现树的复杂度随时间增加，平均树深度从 2（2011 年 1 月）增加到 7（2018 年 1 月）。此外，进入树的不同特征数量也随时间增加。最优超参数随时间变化，但我们在校准中使用的边界证明足够足够，以容纳这些变化。仅在最后一次重新估计日期（2018\
  \ 年 1 月），随机森林达到了允许的最大树数量，即达到了树数量参数上限（500）。由于这远高于样本中其他时间生成的树的数量（始终低于 100），这可能信号模型正在寻找解决方案，因为容差参数非常低。\n\
  \n图 4.10 绘制了每个重新校准日期不同特征的数量、树的数量以及梯度提升机器的收缩因子。值得注意的是，尽管我们只使用股票特征，但进入树的不同特征数量与 Gu\
  \ 等人 (2018) 的结果非常相似，他们增加了与宏观变量的交互，最终使用了约 1000 个特征，是我们的 10 倍。这意味着股票特定因子与宏观变量之间的交互并不是重要的特征。\n\
  \n![ ¶ 图 4.10. 超参数：梯度提升机器（来源：Macquarie Quantitative Strategy, 2019 年 1 月）](img/fig4-10.jpg)\n\
  \n¶ 图 4.10. *(此处为重复标题)*\n\n#### 4.5.6. 变量重要性\n\n我们随机森林模型的结果在图 4.11 中给出。深蓝色表示更高的变量重要性，图形按广泛的风格家族聚合。正如学术文献所示所示，价格驱动的预测因子往往随时间保持主导地位。特别是技术指标在变量重要性方面排名靠前。模型还倾向于选择价格动量指标，以及较小程度上选择“防御价值”类别的估值比例。\n\
