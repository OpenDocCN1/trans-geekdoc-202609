  \n## 11.5 以不失衡为变量的贝叶斯网络建模\n\n投资者净订单流不失衡是估计执行缺口的关键因素。然而，该变量的观测存在延迟（例如通过经纪人报告或部分交易），因此它无法用于生产目的。为了解决这个问题，我们提出了一种贝叶斯网络来整合我们可能获得的所有信息，并更新我们的先验信念。贝叶斯网络的有趣特性之一是它可以双向进行，这得益于贝叶斯公式。因此，我们可以在变量观测前后进行概率推理。在研究背景下，这意味着：\n\
  \n- 给定元订单特征（方向和大小）和股票属性（买卖价差、平均成交量和价格波动率），我们可以计算不失衡的初步估计并预测交易成本；\n- 一旦获得实际支付的交易成本，我们就可以更准确地恢复当日不失衡的分布。\n\
  \n### 11.5.1 贝叶斯推理\n\n频率派方法与贝叶斯方法的主要区别在于，在后者中，模型参数不再是需要估计的常量，而是需要估计参数的随机变量。统计学家有能力整合对变量概率分布的先验信念，并在一旦获得新数据时一步步更新信念。从上一步到下一步：前一个“后验分布”被用下一步的先验。\n\
  \n例如，如果 `y` 代表未知随机变量，`x` 代表观测数据，而 `P(y)` 代表先验。后验分布 `P(y|x)` 是将先验 `P(y)` 与观测数据的似然性\
  \ `P(x|y)` 相乘并经过 `P(x)` 缩放得到的。\n\n```\n\\[11.6\\] ![image](img/eqn11-6.jpg)\n```\n\
  \n\n\n\n\n图 11.5 展示了如何估计[方程 [11.5]](#c11.xhtml#eqn11-5)中指定的贝叶斯线性回归的系数。首先，我们开始纳入对参数\
  \ `θ` = (`(α, β, γ)^T`) 分布的先验信念（如果有的话）。如果没有任何信念，良好的选择是采用无信息先验分布，如正态分布 `N` (0, 1)。因此，先验的最佳初始化是接近于所考虑变量的经验分布函数的法则。感兴趣的变量\
  \ `ISk` 服从以估计值为中心的正态分布 ![images](img/ieq11-7.jpg)，其方差为误差项 `ϵk` 的 ![images](img/ieq11-8.jpg)。![images](img/ieq11-8.jpg)\
  \ 需要一个非负的先验分布，例如高斯分布的正部分（即 `HalfNormal`）或柯西分布的正部分（即 `HalfCauchy`）。贝叶斯设置对结果给出了直接的解释：后验分布的均值是参数\
  \ `θ` 的最概率值，5% 置信区间受后验分布的 2.5% 和 97.5% 分位的限制。\n\n![图 11.5. 线性回归的贝叶斯推理](img/fig11-5.jpg)\n\
  \n**图 11.5.** *线性回归的贝叶斯推理*\n\nMCMC（马尔可夫链蒙特卡洛方法，最早参考文献之一参见 (Hastings 1970)）提供了从后验分布中采样的简单方法，特别是当后验分布不符合已知表达式或我们知道该表达式包含乘法项时。这对于贝叶斯方法非常方便，因为后验分布正比于先验和似然的乘积。MCMC\
  \ 算法使得参数模型的计算变得可行。MCMC 的背后直觉是在 `x` 的支撑集上定义一个马尔可夫链（`x[0], x[1],.. .`），使得当该链的规模 `n`\
  \ 趋于无穷大时，新抽取的点 `x[n]` 按照法则 `P[x]` 分布。生成具有这种优良属性马尔可夫链的最著名的算法是 Hastings-Metropolis\
  \ 算法（在第 11.13 节中解释），我们在研究中使用它，以及 Gibbs 采样器^(3)。校准模型回归系数的边缘分布显示在表 11.2 的右面板，而 OLS\
  \ 回归的结果在左面板。正如贝叶斯模型在样本量大时预期的那样，我们最终得到了相同的结果。此外，当先验为高斯分布时，参数的后验概率最大值（*a posteriori*）等同于带有二次正则项的岭估计\
  \ ![images](img/ieq11-9.jpg)arg max[θ] P(θ|X, Y ) = arg min[θ] ![images](img/ieq11-10.jpg)该公式与岭回归（参见\
  \ Hoerl and Kennard 1970）类似，使得贝叶斯回归比 OLS 更具离群值鲁棒性。例如，订单规模项 ![images](img/ieq11-11.jpg)分布的情况就解释了系数估计（0.71\
  \ 对 0.69）的微小差异。\n\n![表 11.2. OLS 回归与贝叶斯回归](img/tab11-2.jpg)\n\n**表 11.2.** *OLS\
  \ 回归与贝叶斯回归*\n\n### 11.5.2. 贝叶斯网络建模\n\n大多数 OLS 假设都被违反了。如第 11.12 节所示，交易成本的边缘分布呈现尖峰形状，并具有肥尾（超峰度为\
  \ 23.46）。同方差假设也被违反了。误差项的方差在订单之间几乎不是恒定的。与暴露在市场波动时间更长的大订单（跨越数日）相比，小订单（几分钟内完成）的预测误差更小。最后，很难假设观测值之间是独立的。同一股票的元订单（无论执行日期何时）都共享某些与股票特征相关的共同方差。同样，在同一交易日内执行的不同股票的订单面临相同的市场条件，因此不能被视为相互独立。\n\
  \n此外，贝叶斯网络的优势在于不依赖正态误差分布（Zuo and Kita 2012），大多数其他机器学习算法也是如此。此外，贝叶斯网络的优势在于为考虑变量之间的依赖关系提供人类可读的描述，而其他更复杂的模型（如神经网络）则被认为是“黑箱”模型。\n\
  \n#### 11.5.2.1. 我们贝叶斯网络的结构\n\n我们的目标是估计订单的执行缺口（implementation shortfall）。我们希望考虑贝叶斯网络：\n\
  \n* – 交易股票的属性，例如平均买卖价差、价格波动性和换手率；\n\n* – 元订单的特征，主要是规模和方向；\n\n* – 执行期间的拥挤程度：净订单流。\n\
  \n图 11.6 显示了我们设计的贝叶斯网络。我们区分了关键依赖关系。首先，买卖价差取决于股票波动性。其次，订单流的边缘概率是元订单规模和方向的函数。最后，执行缺口是所有节点的函数。在下一节中，我们将详细说明这些依赖关系的并为每组设置先验。\n\
  \n#### 11.5.2.2. 买卖价差依赖\n\n股票波动性与买卖价差之间的关系有文献记载。理论上，Wyart 等人 (2008) 证明了，通过推导提交市单的交易者和提交限单的交易者的利润，只有当买卖价差与价格波动成正比时才能实现均衡价格（即\
  \ ![images](img/ieq11-12.jpg）。同样，Dayri 和 Rosenbaum (2015) 研究了最佳跳位，并发现市场在买卖价差中愿意支付，除非受到跳位的限制\
  \ ![images](img/ieq11-13.jpg)其原因是设置订单簿最佳限制的做市商，不仅在波动性（即给定库存水平的风险）较低时提供紧密的买卖价差，而且当他们当天有更多机会平仓时也是如此。买卖价差与波动性之间的关系在我们的数据上得到了经验证实，如第\
  \ 11.9 节中的[图 11.11]所示。\n\n与波动性随机模型的文献一致，我们将股票波动性的先验设置为对数正态分布 ![images](img/ieq11-14.jpg)*。因此，买卖价差也应该遵循对数正态分布，给定价格波动性的买卖价差条件概率在方程\
  \ 11.7 中详细说明，其中 `c^(ψσ), ρ^(ψσ), σ[ψ,σ]` 是模型参数。\n\n\n\n\n\n在本节中，我们量化了净订单流不平衡对网络中剩余变量的依赖性。图\
  \ 11.7 显示了取决于元订单（meta-order）方向的不平衡的边际分布。图所示的 U 型曲线证实了机构投资者确实存在相关性执行，并且倾向在同一时期内以相同方向执行相同的股票，这加剧了价格波动的压力。这种交易执行中的相关性可以用多种因素来解释。资产经理竞争相同的客户群，并可以实施类似的策略（Greenwood\
  \ and Thesmar 2011, Koch *et al.* 2016）。因此，根据流动性需求和投资机会，他们面临着类似的流入和流出。此外，资产管理行业受到一系列监管约束，这些约束可能促使资金同时买卖同一类资产。我们还注意到，U\
  \ 型曲线根据元订单的方向被分解为两个偏态分布。因此，给定机构投资者的元订单方向，大额套利者执行的剩余部分构成了正偏（针对卖出）或负偏（针对买入）的不平衡分布。此外，基于元订单参与率水平，图\
  \ 11.8 显示，投资者元订单净订单流不平衡的绝对强度变得增强，这是对机构投资者拥挤效应的确认。\n\n![图 11.7. 给定元订单方向的净订单流不平衡分布。此图的彩色版请参阅\
