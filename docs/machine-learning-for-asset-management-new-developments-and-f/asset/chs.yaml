  \ 1、2 和 3 包含 Beta 最低的国家，而组合 4、5 和 6 包含 Beta 最高的国家。在我们的分析中，重点关注组合 1 和 4，它们包含违约概率最低的国家。样本跨度从\
  \ 1995 年 1 月到 2016 年 12 月。\n\n我们使用来自 FRED-MD 数据库（McCracken and Ng 2016）的 120 个宏观变量的大型集合来预测收益^(6)。这组变量适用于所有资产类别和策略。变量涵盖了广泛的类别（产量和收入；劳动力市场；住房；消费、订单和库存；货币和信贷；利率和汇率；价格）；因此，它们捕捉了投资者可以获得的大量宏观信息。我们用资产特定的预测因子扩展了\
  \ FRED-MD 数据集，将在下文中进行描述。\n\n- **股票股票市场**：我们遵循 Welch 和 Goyal (2007) 的方法，使用股利支付率（对数股利收益率，d/e）、账面市值（b/m）、净权益扩张率（ntis）、违约收益利差（def）和股票方差（svar）作为自变量。数据来自\
  \ Amit Goyal 的网站^(7)。\n\n- **股票组合**：我们遵循 Asness *et al.* (2000)、Cohen *et al.* (2003)\
  \ 以及 Baba-Yara *et al.* (2018) 的方法，使用价值衡量标准来预测价值和动量组合。为了衡量每个公司 `i` 的价值，我们使用权益账面价值与市场价值的比率，即账面市值\
  \ `BM[i,t]`，正如 Fama 和 French (1992) 所示。账面价值每年 6 月观测一次，指的是上一个财年底。市场价值每月更新一次，正如 Asness\
