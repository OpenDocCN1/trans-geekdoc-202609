  \ (2019)。\n\n\n\n\n投资组合优化起源于马科维茨（Markowitz，1952）的开创性论文。原始的均方差框架之所以具有吸引力，是因为从计算角度来看非常高效。然而，它也有一个广为人知的缺陷，因为它会导致投资组合从财务角度来看并不是最优的（Michaud\
  \ 1989）。尽管如此，很少有模型成功地为马科维茨模型提供了真正的替代方案。主要原因在于，大多数学术界的投资组合优化模型虽然具有坚实的理论属性，但在现实生活中是不可行的。我们所说的“不可行”是指，它们虽然可以在资产数量较少的投资池中实现，但需要消耗大量的计算资源和技能，并且无法管理拥有数十或上百个资产的投资池。然而，机器人投顾（robo-advisors）的出现和快速发展意味着我们需要重新思考投资组合优化，超越传统的均方差优化方法。\n\
  \n另一个行业和科学分支也在大规模优化问题上面临类似的问题。机器学习和应用统计长期以来与线性回归逻辑回归模型相关。同样，原因是优化算法无法解决高维工业级问题。然而，20\
  \ 世纪 90 年代末标志着一个重要的转折点，随着几种方法的开发和重新发现，这些方法从后取得了令人瞩目的成果。本章的目标是展示投资组合配置如何从这些大规模优化算法的发展中受益。并不是所有的算法在我们的情况下都有用，但在解决复杂的投资组合优化问题时，有四种是至关重要的。这四种算法是：坐标下降法、交替方向乘子法（ADMM）、近端梯度法和迪克斯特拉对投影算法（Dykstra's\
  \ algorithm）。本章将回顾这些算法，并展示如何将它们应用于投资组合配置。\n\n## 8.1. 引言\n\n马科维茨对经济学的贡献是巨大的。均方差优化框架标志着金融领域投资组合配置的开始。除了\
  \ 1952 年的经典论文外，马科维茨在 1956 年提出了一种求解二次规划问题的算法。当时，很少有人注意到这种优化框架。我们可以引用 Mann（1943），但人们广泛公认马科维茨是“二次规划之父”（Cottle\
  \ and Infanger 2010）。这并不是经济学家第一次参与数学的发展，但这确实是数学家第一次探索一个研究领域，而该领域在研究初期的主要应用完全是一个经济学问题。\n\
  \n均方差优化（MVO）的成功归功于二次效用函数的迷人属性，但也应该根据二次规划（QP）的成功来评估。因为 QP 问题很容易求解，而且数学软件中提供了 QP 问题，求解\
  \ MVO 问题是非常直接的，不需要特定的技能。因此，均方差优化是一种所有投资组合经理使用的通用方法。然而，这种方法受到了学术界和人士的广泛批评。事实上，均方差优化对输入参数非常敏感，并且产生角解（corner\
  \ solutions）。此外，均方差多元化的概念与对冲的概念混淆（Bourgeron et al. 2018）。这些不同的问题使得均方差优化的实践不如理论那样（Michaud\
  \ 1989）。事实上，解决 MVO 配置需要指定正确的权重约束以获得可以接受的解决方案。因此，设计约束是均方差优化最重要的部分。在这种，MVO 似乎是一个尝试错误的过程，而不是一个系统的解决方案。\n\
  \nMVO 框架的成功也归因于：从工业角度来看，很少有可以实现的竞争投资组合配置模型。通常有两个原因：第一，某些模型使用的输入参数难以估计或理解，使得这些模型绝对无法使用；第二，其他模型使用的目标函数比简单的二次效用函数复杂。在这种情况下，计算复杂性使得这些模型比标准的\
  \ MVO 模型具有吸引力。在这些模型中，某些基于均方差目标函数，但引入了正则化惩罚函数以提高投资组合配置的稳健性。同样，如果这些模型不能转化为 QP 问题，它们几乎没有被使用的机会。然而，已经出现了新的优化算法来解决大规模机器学习问题。本章的目的是介绍这些新的数学方法，并证明它们可以轻松地应用于投资组合配置，从而超越\
  \ MVO/QP 模型。\n\n本章基于几篇此前的研究论文（Bourgeron et al. 2018, Griveau-Billion et al. 2013,\
  \ Richard and Roncalli 2015 以及 Richard and Roncalli 2019），并广泛使用了四篇领先参考文献（Beck 2017;\
  \ Boyd et al. 2010; Combettes and Pesquet 2011; Tibshirani 2017）。其结构安排如下：在第 8.2\
  \ 节中，我们介绍了均方差法以及它如何与 QP 框架相关。第三节专门介绍机器学习中使用的大规模优化算法：坐标下降法、交替方向乘子法、近端梯度法和迪克斯特拉算法。第\
  \ 8.4 节展示了如何实现这些算法以解决投资组合优化问题并构建更稳健的资产配置。最后，第 8.5 节提供了一些总结性。\n\n## 8.2. 投资组合优化的二次规划世界\n\
  \n### 8.2.1. 二次规划\n\n#### 8.2.1.1. 原始与对偶形式\n\n二次规划（QP）问题是一个具有二次目标函数和线性约束的优化问题：\n\
  \n```\n8.1 min 1/2 x'Qx + R'x\nsubject to Sx <= T\n```\n\n其中 `x` 是 `n x 1` 向量，`Q`\
  \ 是 `n x n` 矩阵，`R` 是 `n x 1` 向量。注意约束系统 `Sx <= T`允许我们指定线性等式约束 `Ax = B` 或边界约束 `x-\
  \ <= x <= x+`。大多数数值软件包考虑以下格式：\n\n```\n8.2 min 1/2 x'Qx + R'x\nsubject to -Ax <=\
  \ -B, Ax <= B, Cx <= D, -I[n]x <= -x-, I[n]x <= x+\n```\n\n因为问题 `8.2` 等价于具有以下线性不等式的标准问题\
  \ `8.1`：`-Ax <= -B`、`Ax <= B`、`Cx <= D`、`-I[n]x <= -x-` 以及 `I[n]x <= x+`。如果由 `Sx\
  \ <= T` 定义的空间 `Ω` 非空且 `Q` 是对称正定矩阵，则解存在因为函数是凸的。QP 问题有一个有趣的性质，即对偶形式是另一个二次规划问题：\n\n\
  ```\n8.3 max -1/2 y'A y + b'y\nsubject to A'y + c <= d\n```\n\n这种对偶性性质对于某些机器学习方法非常重要。例如，支持向量机和核方法广泛利用对偶性来定义解（Cortes\
  \ and Vapnik 1995）。\n\n#### 8.2.1.2. 数值算法\n\n\n\n\n\n关于求解二次规划问题的方法有大量的文献（Gould and\
  \ Toint 2000）。该研究始于 20 世纪 50 年代，其关键贡献包括：Frank and Wolfe (1956)、Markowitz (1956)、Beale\
  \ (1959) 和 Wolfe (1959)。如今，QP 问题通常使用三种方法求解：活跃集法、梯度投影法和内点法。所有这些算法都在标准的数学建模语言（MATLAB,\
  \ Informatica, Python, Gauss, R 等）中实现。这解释了为什么 QP 问题自 2000 年以来取得了如此成功，因为它们可以容易且快速地解决。\n\
  \n## 8.2.2. 均值-方差优化组合\n\n投资组合配置的概念历史悠久，可以追溯到 Markowitz (1952) 的开创性工作。在论文中，Markowitz\
  \ 精确定义了投资组合选择的含义：“投资者（或应该）将预期收益视为理想的事物，将收益的方差视为不理想的事物”。事实上，Markowitz 证明了有效投资组合是在给定风险水平（对应于组合收益的方差）下预期收益最大化的组合，或者是在给定预期收益水平下风险最小化的组合。尽管这一框架已扩展到许多其他配置问题（指数采样、周转率管理等），但均值-方差模型仍然是金融领域应用最广泛的优化方法。\n\
