  \ and Welch (2008) 的发现对样本外预测性提出了重要挑战，因为它们表明通过传统回归方法利用预测变量信息。\n\n### 1.2.2. 预测组合\n\
  \nGoyal and Welch (2008) 的研究对于刺激人们思考如何更好地利用预测变量信息来预测市场超额收益具有影响。对于方程 `[1.2]` 中的预测回归，Rapach\
  \ *et al.* (2010) 认为由于学习和结构性变化等因素，依赖单个预测变量是有风险的。基于 Bates and Granger (1969) 的开创性工作，Rapach\
  \ *et al.* (2010) 将预测组合作为整合多种预测变量信息的策略。预测组合通过预测多样化来减少“风险”，类似于跨资产多样化以降低投资组合风险（Timmermann\
  \ 2006）。具体而言，Rapach *et al.* (2010) 考虑了一种形式为方程 `[1.2]` 中 `j` = 1, …, `J` 的 `x[j,t]`\
  \ 的单变量预测回归预测简单平均值：\n\n```\n[1.7]\n```\n\n他们证明，与方程 `[1.2]` 和 `[1.4]` 中传统的单变量和多元预测回归预测相比，方程\
  \ `[1.7]` 中的组合预测能够在更一致的时间跨度上提供相对于基准预测的样本外准确性提升。\n\n为什么——与方程 `[1.4]` 中同样包含了对于 `j`\
  \ = 1, …, `J` 的 `x[j,t]`信息的传统多元预测回归预测不同——方程 `[1.7]` 中的组合预测能够提高样本外性能？Rapach *et al.*\
  \ (2010) 指出预测组合实际上是一种强收缩估计。他们证明方程 `[1.7]` 中的组合预测对方程 `[1.4]` 中的传统多元回归预测做了两个调整：首先，它将\
  \ OLS 多元回归系数估计替换为相应的单变量估计，这减少了共线性性的影响并通过因子 `1*/J` 收缩了单变量斜率系数，从而缩小了不精确的参数估计；其次，组合预测将预测对齐到基准均值。\n\
  \n\n\n\n\n收缩（shrinkage）对于改进样本外市场超额收益预测的用处源于股票收益预测所需的一种微妙平衡。一方面，我们希望整合来自各种可能相关的预测变量的信息，特别是因为我们不想忽视相关信息，且无法*先验*知道哪些预测变量是最相关的。另一方面，通过[方程\\\
  [1.4\\]](#c01.xhtml#eqn1-4)中的多预测回归预测来从众多预测变量中整合信息是不明智的。[方程\\[1.4\\]](#c01.xhtml#eqn1-4)\
  \ 基于对[方程\\[1.3\\]](#c01.xhtml#eqn1-3)中多预测回归模型的传统估计，而该模型极易产生过拟合。传统的 `OLS` 估计最大化了模型在估计样本上的解释能力，这通常会导致样本外性能的低劣。随着解释变量数量的增加和数据中信噪比的下降，对过拟合的担忧会随之加剧。在预测股票收益时，我们会面临这两个挑战：存在大量合理的预测变量，而收益中的可预测部分在本质上是有限的。[方程\\\
  [1.7\\]](#c01.xhtml#eqn1-7)中的组合预测显然提供了一种有效的收缩策略，能够以避免过拟合的方式整合来自众多合理预测变量的信息。\n\n\
  ### 1.2.3. *弹性网 (Elastic net)*\n\n机器学习技术也为实现收缩提供了手段。事实上，流行的 `LASSO` 估计器是一种惩罚回归方法，专门显式设计用于通过收缩来防止过拟合。为了根据[方程\\\
  [1.3\\]](#c01.xhtml#eqn1-3)中的多预测回归模型计算预测，我们不再使用 `OLS` 目标函数，而是使用 `LASSO` 目标函数估计系数：\n\
  \n[\\[1.8\\]](#c01.xhtml#ieqn1-8) ![image](img/eqn1-8.jpg)\n\n其中 `λ` ≥ 0 是正则化参数，用于控制收缩的程度^(3)。`LASSO`\
  \ 目标函数的第一部分是熟悉的拟合残差平方和，因此当 `λ` = 0 时，`LASSO` 和 `OLS` 估计器重合。正则化参数 `λ` 将系数向零收缩。与依赖\
  \ `ℓ`2 惩罚项的岭回归（Hoerl and Kennard 1970）不同，`LASSO` 采用 `ℓ`1 惩罚，因此它允许收缩到精确的零（当 `λ` 足够大时）。收缩到零意味着\
  \ `LASSO` 也执行了变量选择，这有利于对拟合模型的解释。\n\n为了实现 `LASSO` 估计，有必要选择 `λ` 的值。最流行的方法是 `K`-折交叉验证。然而，折数\
  \ `K` 的选择和折的构建在很大程度上是任意的。Hurvich 和 Tsai (1989) 修正后的赤池信息准则（Akaike 1973, `AIC`）为选择\
  \ `λ`  `K`-折交叉验证的替代方案。修正后的 `AIC` 使用起来更简单，因为它不需要对折的数量和类型进行任意选择。此外，Flynn *et al.*\
  \ (2013) 显示，修正后的 `AIC` 在选择 `λ` 时具有良好的渐近和有限样本性质。\n\nZou 和 Hastie (2005) 提出了弹性网（ENet）作为对\
