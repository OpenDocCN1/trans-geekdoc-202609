    sometimes intermediary components such as hubs, routers and switches are also
    used.


    # Installation


    The Ethernet cables run from one computer to the other or directly to the server
    or central system. The installation process is time-consuming especially when
    the computers are at a distance from each other or at different rooms. However,
    CAT5 cables are also used today which helps in simplifying the process of cabling
    and also minimizes the cable runs which are unsightly. The configuration of cabling
    depends greatly on the mixture of devices which will be used on the network, the
    internet connection type and also on various factors such as whether internal
    or external modems will be used or not. The configuration of the network relies
    on the standard IP and on other options of network OS.


    # Costing


    The whole setup of wired LAN is cheap. The cables, switches and hubs are inexpensive.
    The software required for connection sharing as ICS comes free. In general, the
    wired LAN is really cheap in nature however, it might turn out to be costly when
    other features such as security devices and broadband routers are used in the
    network.


    # Reliability


    The hubs, Ethernet cables and switches are reliable in nature as the developers
    of such items have been improving the technology with time. The only drawback
    of a wired network is loose cables. It might hamper the network if one of the
    cables is not connected properly. However, this form of network allows fast transfer
    of data across the computer systems with no lags in performance.


    # Performance


    The wired LANs come with superior quality of performance. It can offer a bandwidth
    of 10 Mbps to 100 Mbps. It makes file sharing among the systems a very easy job
    and can transfer them within no time. It also allows high-speed access to the
    internet.


    # Security


    Firewalls are the main consideration for security in wired LANs. The various components
    do not support firewall but it can be installed on the computer.


    # Wireless Network


    This form of network uses Wi-Fi for setting up a connection with the other devices
    on the network. It does not involve any type of wired connection with the systems.


    # Installation


    The wireless networks or Wi-Fi networks can be easily configured and it can be
    done in two different ways:


    - Infrastructure mode which allows the devices to communicate with a prime node
    that can, in turn, communicate with the wired form of nodes on the LAN.

    - Ad-hoc mode allows the devices to connect with each other using peer to peer
    mode.


    Ad-hoc mode allows only the basic form of file sharing between the devices. Both
    the configuration types need network adapters which are also known as WLAN cards.


    # Costing


    Wireless networking is much more expensive when compared to wired LANs. The wireless
    adapters are costlier than the Ethernet adapters, switches, hubs etc.


    # Reliability


    Wireless LANs also suffers from reliability problems just like wired LANs. The
    main problem that comes with wireless LAN is the concern about signal strength.
    It is subject to various interferences such as microwave ovens, garage door openers
    and cordless phones. It requires to be installed carefully for minimizing the
    interference in signal strength.


    # Performance


    Wireless LANs which use 802.11b can provide a maximum bandwidth of 11 Mbps. It
    can support a maximum of 54 Mbps which is half when compared with the bandwidth
    of wired LANs. The performance of Wi-Fi connection depends on the distance between
    the access point and the device. The larger the distance the slower the connection.
    However, it removes the use of long Ethernet cables for setting up a network and
    is thus mobile in nature.


    # Security


    The wireless LANs are less secure in nature when compared with the wired LANs.
    This is mainly because of the fact that the signals of wireless communication
    travel through the air and it can be intercepted very easily. For making the connection
    more secure some measures need to be taken as the internet.


    # Bottom line


    In case you are looking for a networking system which is cost-effective fast and
    you are not concerned about mobility, then LAN is the best option. If you are
    willing to speed up with the technology with the mobility, then wireless is the
    option. Both come with pros and cons and you need to analyze them.


