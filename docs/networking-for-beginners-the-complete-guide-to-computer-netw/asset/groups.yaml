    # Chapter 2: Internet Communication


    The world today has completely changed from which it was a few years back. It
    is changing every day. With the advancement of digital technology, the pace of
    change has also become very fast. There were times when a simple message used
    to take a few months to deliver and now it takes just a few seconds. Internet
    communication has evolved so much that it can now connect people seamlessly from
    every corner of the world.


    # Internet Communication


    Internet communication is a very simple thing. It is the sharing of ideas, information
    or just mere words over the internet or World Wide Web. Internet is composed of
    a huge string of worldwide connected networks which helps in exchanging information
    and data with the help of packet switching by using the TCP/IP.'
  - '[PAGE 11]


    Internet communication comes with a bunch of advantages that can help us in a
    lot of ways.


    # Internet communication and its advantages


    Communication system on the internet comes with more number of advantages than
    disadvantages. For a business person, he/she can be at the comfort of their home,
    drinking tea or coffee and having a conference call with the clients as well at
    the same time. It can help in saving a lot of time, money along with growth in
    business.


    +   * Versatility: Internet communication is versatile in nature. It is available
    24*7. Internet communication will keep on working as long as you are connected
    with the web. Internet communication can also be regarded as a boon for the businesses,
    especially at the time of emergency incidents such as in the sector of social
    media advertising, bad publicity of one second can lead to a disaster. In such
    case, internet communication helps in mending it all.


    +   * Leveling: It is a fact that everyone cannot in front of everybody at once.
    Also, there are many people around us who do not like to talk that much. Such
    people always love to express their feeling by writing. Some people feel more
    comfortable while talking from from behind the keyboards. In that case, internet
    communication helps in building up a communication line for such people.


    +   * Well documented: Face to face communication is not much documented whereas,
    internet communication is well documented. It helps in various situations when
    people need to be accounted for the words they speak. Thus, internet communication
    helps in establishing a very responsible environment.


    +   * Fast communication: Internet communication is fast. It transfers messages
    in blazing fast speed that makes it possible to send out messages at the time
    of emergency.'
  - '[PAGE 12]


    # Tools for internet communication


    Internet communication has provided the human world with a wide range of tools
    for the Purpose Of communication. Let’s have a look at them.


    # Email


    Email is regarded as one of the fundamental tools for internet communication.
