    动态分配 IP 地址的一个主要优势是其在本质上更具活性。与静态 IP 地址相比，它的设置非常简单，管理工作也更得得心。例如，当其中一个设备连接到网络时，一旦该设备断开连接，同一个
    IP 地址就会被释放，并可以供随后连接的另一个设备使用，即使该设备不再是同一台设备。


    动态 IP 地址对连接到网络的设备总数限制很小，而且不需要保持连接的设备可以轻松地断开网络，从而为其他设备释放可用的 IP 地址池。还有另一种替代方案，即
    DHCP 服务器可以为网络中的每台设备预配置特定的 IP 地址，以防所有设备都想同时连接到网络。在这种情况下，数百个网络化设备（无论它们是否正在被用户使用）都拥有自己特定的
    IP 地址，这可能会限制网络中所有新设备的访问权限。


    ## 动态 IP 地址及其缺点


    对于任何形式的家庭网络来说，使用由 DHCP 服务器为路由器分配的动态 IP 地址在技术上是非常常见且完全可以接受的，但问题出现在用户尝试从任何其他外部网络访问同一个家庭网络时。


    ## 静态 IP 地址


    静态 IP 地址是指为网络设备手动配置的地址，而不是由 DHCP 服务器分配的地址。静态 IP 地址的名字意味着该 IP 不改变，在本质上是静态的。它可以被视为不断变化的动态
    IP 地址的对立面。手机、平板电脑、笔记本电脑、路由器和其他使用 IP 地址的网络设备都可以轻松地配置为静态 IP 地址。这可以通过发布 IP 地址的设备（如路由器）完成，也可以通过在设备上手动输入设备
    IP 来。


    ## 为什么需要使用静态 IP 地址？


    你可以将静态 IP 地址比作物理家庭地址或电子邮件地址。这些地址不会改变，在本质上是静态的。它们有助于联系他人或寻找某人。同样，当你从家里托管网站、在网络中拥有文件服务器、向特定设备转发网络端口、使用网络打印机、使用任何形式的远程访问程序或运行服务器时，静态性质的
    IP 地址是非常有利的。由于静态 IP 地址永远不会改变，网络中的所有其他设备将知道如何连接到使用静态性质 IP 地址的设备。


    例如，当为家庭网络内的 PC 设置静态 IP 地址后，一旦该设备获取了特定的 IP 地址，就可以对路由器进行特殊配置，将所有入站请求直接转发到该设备，例如如果设备可以通过
    FTP 共享文件，则转发 FTP 请求。


    如果你托管一个网站但没有使用静态 IP 地址，可能会变得非常麻烦。这主要是因为当计算机获取某些新 IP 地址时，你每次都需要更改路由器设置，以便将请求转发到新的
    IP 地址。如果你忽略了这一点，任何人都可以进入你的网站，因为路由器不知道网络中哪一个设备是专门为网站提供服务的。


    静态性质 IP 地址作用的另一个佳例是 DNS 服务器。DNS 服务器始终使用静态 IP 地址，以确保网络中的设备确切知道如何连接服务器。如果它们经常更改，你还必须定期重新配置路由器上的
    DNS 服务器才能使用互联网。


    当设备域名无法访问时，静态形式 IP 地址也非常有用。例如，连接到工作场所网络内文件服务器的计算机也可以通过服务器的静态 IP 地址而不是主机名来与服务器进行设置。即使
    DNS 服务器发生故障，网络中的计算机仍然可以使用 IP 地址访问并连接文件服务器。对于像 Windows 远程桌面等支持远程访问的应用程序，使用静态性质的
    IP 地址意味着用户始终可以使用相同的地址访问计算机。当你使用频繁更改的 IP 地址时，你需要知道它变成了什么，以便你使用新地址建立远程连接。


    ## 静态 IP 地址的缺点


    与动态 IP 地址相比，静态 IP 地址的一个主要缺点是网络中的所有设备都需要手动配置。所有形式的家庭 Web 服务器程序以及远程访问程序都需要为设备设置特定的
    IP 地址，并与路由器进行正确配置，以便与特定地址通信。这带来的工作量比插入路由器并让其通过 DHCP 服务器提供动态 IP 地址要多。


    如果设备被分配了类似 192.168.1.10 的 IP 地址，而你去了一个提供 10.x.x.x 地址的完全不同的新网络，你将无法使用你的静态 IP 地址连接。该设备需要重新配置，以使用
    DHCP 服务器或与新网络良好工作的静态 IP 地址。


    安全性也可以被视为设备使用静态 IP 地址的另一个缺陷。当使用从不更改的 IP 地址时，将给攻击者大量的时间在设备网络内部。唯一的替代方案是使用会变化的动态性质
    IP 地址，这将迫使攻击者改变与该设备通信的方式。


    ## 静态 IP 地址 vs 动态 IP 地址


    动态 IP 地址与从不改变的 IP 地址是完全相反的类型。动态 IP 地址就像静态 IP 一样是普通的 IP 地址，但动态 IP 与设备永久绑定。动态 IP
    地址并不是终身使用一个 IP，而是仅在特定时间段内使用，然后返回 IP 地址池，以便网络中的其他设备可以使用。


    与静态 IP 地址相比，动态 IP 地址具有优势。如果 ISP（互联网服务供应商）对其所有客户保留静态 IP 地址，那么新客户的 IP 地址供应很快就会有限。动态
    IP 地址提供了一种解决方案，当一个 IP 地址未被任何其他设备使用时，它可以被其他设备复用。因此，与静态 IP 地址相比，它可以为更多的设备提供互联网访问。


    静态 IP 地址停机时间有限。当动态形式的地址获取新 IP 时，连接到现有 IP 地址的用户会被断开连接，否则必须等待寻找任何新地址。当我们访问网站、文件共享服务或在线游戏时，这不是一个推荐的设置，因为所有这些都需要持续的连接。


