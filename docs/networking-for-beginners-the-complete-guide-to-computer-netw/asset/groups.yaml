    该标准由 IEEE 开发，旨在提供比 CST 更快的收敛速度。然而，它也持有了在拓扑结构中寻找根桥接的类似理念。


    - RPVST：也称为快速 VLAN 生成树协议，是思科开发的一种标准，旨在提供比 RSTP 更快的收敛速度，并为每个 VLAN 查找 802.1w 的相应独立实例。然而，与其他
    STP 标准相比，它需要消耗更多的内存和 CPU 资源。


    ## 路由配置


    ## OSPF


    也称为开放最短路径优先协议，是一种链路状态路由协议，通过使用其自身的最短路径优先算法帮助在目标路由器和源路由器之间寻找最佳路径。OSPF 协议由 IETF
    开发为一种 IGP 或内部网关协议，是用于在大型自治自治系统或路由网域内传输数据包的协议。它作用于网络层，运行协议号为 89。


    ## OSPF 术语


    - 路由器 ID (Router ID)：它代表路由器上的 IP 地址，是所有地址中最活跃的。优先考虑回环接口（loopback）的最高地址；如果没有配置任何形式的回环接口，则考虑接口中活动状态最高的
    IP 地址。


    - 路由器优先级 (Router priority)：这是分配给运行 OSPF 的路由器的值。它本质上是 8 位的，有助于在广播网络中选举 BDR 和 DR。


    - DR 或指定路由器 (designated router)：它是为了最小化形成的邻接关系总数而选出的。


    - BDR 或备用指定路由器 (Backup designated router)：BDR 在广播网络中充 DR 的备份。每当 DR 故障时，BDR 将接替
    DR 的角色并开始执行 DR 的功能。


    ## BDR 和 DR 选举


    BDR 和 DR 的选举发生在广播网络或多访问网络中。选举标准如下：


    - 路由器优先级最高的路由器将当选为 DR。

    - 如果在选择路由器优先级时出现任何形式的平局，则考虑最高的路由器 ID。


    ## EIGRP


    EIGRP 或增强内部网关路由协议是一种动态路由协议，用于在两个三层设备之间寻找最佳路由以交付数据包。它在 OSI 参考模型的网络层上运行。它使用协议号 88
    运行功能。EIGRP 使用度量（metric）方法在运行 EIGRP 的两个设备之间寻找完美路径。


    ## EIGRP 特性


    EIGRP 以以下特征运行：


    - 它以先进的运行效率方式工作。

    - 它作为一种无类路由协议运行。

    - 它具有距离矢量和链路状态的双重能力。

    - 它具有一些独特特性，如 RTP（可靠传输协议）、DUAL（扩散更新算法）以及关于邻居的所有形式的更新信息。

    - 它提供了更快的收敛速度，因为它预先计算了所有路由，并且收敛之前不会广播定时器数据包。


    它使用延迟、负载、带宽和可靠性来计算路由表的度量。


    ![](img/f6e39736dfc482245d9c29c4f7c9f146_92_0.png)


    ## 第 16 章：网络故障排除


    完整的网络设置使用了各种组件、硬件、网络配置、设置和操作系统，它们都共同工作以实现网络成功。然而，可能会由于某些故障或错误导致组件停止工作。这种情况可能会导致网络完全关闭，对于大型网络来说也会导致巨大的损失。因此，在这种情况下，需要让所有功能恢复正常。


    ## 适配器资源


    尽量确保网络适配器已正确安装，并且被计算机无障碍地检测到。如果你使用 Windows 操作系统，请打开设备管理器并验证是否存在任何形式的错误。如果网络适配器出现任何差异，或者它被计算机识别为其他设备，你需要检查适配器是否安装正确。


    ## 验证连接


    如果你使用有线网络，请确保网线已连接正确，网络接口旁边的 LED 指示灯正在闪烁。绿色绿绿色 LED 灯光意味着电缆已正确连接并正在接收网络信号。如果指示灯不亮，可能表明网卡损坏、未以正确方式连接或网络信号存在任何形式的错误。如果你处于小型本地网络，请检查所有的集线器和路由器，确保所有电缆都连接正常。


    如果你使用如笔记本电脑之类的无线网络，请确保笔记本上的 Wi-Fi 已开启。如果你仍然面临任何问题，请确保选择了正确的 Wi-Fi 网络。此外，检查 Wi-Fi
    路由器的连接，确保路由器正在接收来自互联网的信号。


    ## 适配器功能


    你需要使用 `ping` 命令验证网卡能够 ping 自身。如果本地主机运行正常，你将收到来自主机的响应。如果收到任何超时（time out）错误，请检查网卡是否已正确安装以及驱动是否已更新。


    - 在开始该过程之前，确保你已经在 PC 和 MAC 系统中设置了 IP。

    - 为你的 PC 共享设置密码，可以在网络中找到该密码。


    - 将运行 Windows 或 Linux 的 PC 和 MAC 系统放在同一个工作组（workgroup）中。


    - 在 MAC 系统中，打开系统偏好设置并选择网络适配器。选择右侧面板中提供的高级选项，选择 wins 选项卡并输入相同的工作组名称。


    - 在 PC 系统中创建一个名为 `shared` 的文件夹。


    - 在 MAC 系统中创建一个名为 `shared` 的文件夹。


    - 下一步是在 MAC 系统中打开系统偏好设置，并在互联网与网络选项下选择“共享”。


    - 在文件共享选项下，勾选“使用 SMB 文件和文件夹”。


    - 现在你将能够连接两个系统，并在运行 Windows 或 Linux 的 PC 与 MAC 系统之间传输文件和文件夹。


    确保在共享时没有内容处于加密格式，因为如果开启了加密，PC 系统将无法登录 MAC 系统并共享文件和文件夹。

