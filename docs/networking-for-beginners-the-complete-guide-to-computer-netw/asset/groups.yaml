    The data packets are collected at the destination and then reassembled for getting
    the complete message. There are various types of network protocols which have
    been developed and designed for some specific functions in specific environments.


    # Internet Protocol


    IP or the internet protocol family is composed of a set of related protocols of
    networking. Besides having internet protocol itself, there are also various higher
    class protocols such as UDP, TCP, FTP and HTTP. All such protocols integrate with
    the internet protocol for the purpose of providing many added capabilities. There
    are some lower-level internet protocols as well as ICMP and ARP which exists within
    the family. The higher-level protocols which belong to the family of IP have much
    closer interaction with the applications such as web browsers. The lower-level
    protocols interact with the adapters of a network along with some other hardware
    of the computer.


    # Wireless Network Protocols


    The wireless networking system has turned out to be commonplace which is mainly
    because of Bluetooth, Wi-Fi and LTE. There are wireless network protocols that
    check the functioning of wireless networks. The network protocols which have been
    designed for the purpose of wireless networking needs to support roaming in mobile
    devices and also deal with various issues like network security and variable rates
    of data.


    # Network Routing Protocols


    The network routing protocols are the specially designed protocols which have
    been designed to use specifically for the network routers. A network routing protocol
    is capable of identifying other routers on the network, manage the destination
    of the messages of a network, manage the message pathways which are called routes
    and also makes dynamic decisions on routing. Some of the most common protocols
    of routing include OSFP, EIGRP and BGP.


    # TCP or Transmission Control Protocol'
