    # # Chapter 10: Circuit and Packet Switching


    ## Circuit Switching


    In the process of circuit switching, the network bandwidth or resources are divided
    into small pieces and a little bit of delay is permanent at the time of establishing
    a connection. The circuit or path which is dedicated between the sender and the
    receiver gives out a proper data rate. All forms of data can be transported via
    the circuit without any form of delay once the dedicated circuit has been established.
    The system of a telephone network is the best example of circuit switching. Time
    division multiplexing and TDM and frequency division multiplexing or FDM are the
    two different methods used for multiplexing various signals into one single carrier.


    +   - **FDM**: It divides the network bandwidth into various frames. It is mainly
    used when various data signals are connected for transmission through a shared
    medium of communication. It is used for dividing the bandwidth into a number of
    non-overlapping sub-bands frequencies. Each of the sub-band'
  - '[PAGE 42]


    frequency carries various forms of signals. It is used in optical fiber along
    with radio spectrum for sharing various signals of independent nature.


    +   - TDM: It divides the network bandwidth into frames. It is used for transmission
    and receiving of independent signals across a common path of signal with the help
    of switches in a synchronized manner at every end of the line of transmission.
    It is used for communication for long-distance links and it can also bear huge
    data traffic load from the end-user.


    # Phases of circuit switching


    In circuit switching, everything is done in various phases.


    +   - Establishment of the circuit: During this phase, a circuit is established
    directly from the end of the receiver across various intermediary centers of switching.
    The sender and the receiver both transmit signals of communication for requesting
    and acknowledging the establishment of the circuits.


    +   - Data transfer: After the circuit has been created, voice and data are transferred
    from the sender to the receiver. The connection stays as long as both the parties
    want to communicate.


    +   - Disconnection of the circuit: Once the transfer of data is finished, the
    connection is abandoned. The disconnection rises from either of both the parties.
    The process of disconnection includes removal of all forms of intermediary links
    between the sender and the receiver.


    # Advantages of circuit switching


    Circuit switching comes with a wide range of advantages.


    +   - It is best suited for transmission of longer duration. It is possible because
    a continuous route of transmission is created which remains in place as long as
    the conversation goes on.


    +   - The dedicated communication path makes sure that there is a steady communication
    rate.'
