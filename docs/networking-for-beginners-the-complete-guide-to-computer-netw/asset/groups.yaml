    into smaller pieces called packets. This is done for ensuring that the file is
    transferred fast and in an efficient manner across the network and also for minimizing
    latency. All the data packets are reassembled after reaching the destination.
    A packet is composed of payloads along with several information of control. For
    this, there is no need for reservation or pre-setup.


