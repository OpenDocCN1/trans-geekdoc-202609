    add each of the routes.


    +   * Default routing: It is a technique in which the network router is configured
    for sending all the data packets to the exact hop device and it is not necessary
    whether it belongs to that specific network or not. A data packet is being transported
    to the device for which it has been configured in the default form of routing.
    Default routing is used when the networks only deal with one single point of exit.
    It is very helpful in situations when the transmission network bulks need to transmit
    the packet of data to a similar hop device. When any particular route has been
    mentioned in the table of routing, the network router will be selecting the route
    which has been specified rather than using the default route. The default path
    or route is selected by the router only when any specific route has not been mentioned
    in the table of routing.


    +   * Dynamic routing: It is also called adaptive routing. In this technique of
    routing, the network router adds up a new route in the table of routing for every
    single data packet in response to all the changes which has been made in the topology
    or condition of the network. The dynamic protocols are being used for the purpose
    of discovering the brand new routes for reaching the destination. In this form
    of routing, OSPF and RIP are the only protocols which are used for the purpose
    of discovering new routes. In any case of the routes go down, the automatic adjustment
    will be done for reaching the destination.


