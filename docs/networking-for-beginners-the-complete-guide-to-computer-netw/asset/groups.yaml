    地址、默认网关和 DNS 地址。DHCP 是一种客户端-服务器协议。在该协议中，服务器管理一个唯一的 IP 地址池，以及关于客户端配置参数的各种信息，并仅从这些地址池中分配地址。启用了
    DHCP 的客户端在每次连接到网络时，都会向 DHCP 服务器发送请求。


    配置了 DHCP 的客户端会向 DHCP 服务器广播请求，并请求其其连接或附加的本地局域网的网络配置信息。客户端通常在启动时立即广播其对信息的查询请求。DHCP
    服务器通过提供先前由网络管理员指定的 IP 配置信息来响应客户端的请求。这还包括在该特定时间段内的一个特定的 IP 地址，这被称为“租约”（lease），且该分配在租约期内是有效的。在刷新任何分配时，DHCP
    客户端将完全根据网络管理员设置的策略请求一个新的 IP 地址。


    DHCP 服务器还管理着其分配给网络节点的所有 IP 地址的妥当记录。在节点在网络内移动的任何情况下，DHCP 服务器都能通过 MAC 地址快速进行识别，这有助于防止多个设备意外使用相同的
    IP 地址而导致配置冲突。


    DHCP 并非全可路由协议形式，也不安全。DHCP 局限于局域网（LAN）内，这意味着每个 LAN 的 DHCP 服务器就足够用于任何备备工作。较大规模的网络可能还包含多个独立地点的广域网（WAN）。根据点之间的连接以及每个地点的客户端总数，可以设置多个
    DHCP 服务器来处理地址分配。


    当网络管理员希望 DHCP 服务器为任何给定网络上的多个子网提供 IP 地址时，他们需要配置位于互连路由器上的 DHCP 中继服务（relay services），这些
    请求需要跨越这些路由器。这些代理有助于在位于不同子网的 DHCP 服务器客户端之间转发消息。DHCP 缺乏内置机制功能，该功能本允许客户端和服务器相互进行身份验证。客户端和服务器都容易受到欺骗和攻击的影响。


    # 静态 DHCP 租约 VS 动态 DHCP 租约


    通过使用动态 DHCP，客户端并不拥有分配的 IP 地址，而是租用该地址一段时间。每当一个带有动态形式 IP 地址的设备上电时，它都需要与 DHCP 服务器通信以租用另一个
    IP 地址。无线类型设备是这些客户端的示例，它们在连接到网络时会被分配动态 IP 地址。分配静态形式 IP 地址（永久 IP 地址）的设备通常用于交换机或
    Web 服务器等各种设备。


    在动态 DHCP 设置下，客户端需要执行某些任务，这将导致其地址终止并使用其他 IP 地址重新连接网络。DHCP 的租约时间取决于用户在特定地点需要互联网连接的时长。具有动态
    IP 地址的设备在 DHCP 租约过期时会释放 IP 地址，如果它们想保持在线更久，则会向 DHCP 服务器请求更新 IP 地址。DHCP 服务器可能会分配一个全新的
    IP 地址，而不仅仅是更新旧 IP 地址。


    # NAT


    为了访问互联网，用户需要一个本质上是公共的 IP 地址。私有 IP 地址可以使用本质上是私有的网络。NAT 的主要目标是允许多个设备通过一个公共地址访问互联网。为了实现这一目标，需要将
    IP 地址转换为公共 IP 地址。NAT 或“网络地址转换”是一个将一个或多个本地形式的 IP 地址方便地转换为一个或多个全局形式的 IP 地址，反之亦然的过程，目的是为所有本地主机提供互联网访问。


    此外， NAT 会翻译端口号，这意味着它有助于在数据包中将主机端口号掩盖为其他端口号，然后将其移动到目的地。NAT 然后在 NAT 表中创建所需的端口号和
    IP 地址条目。它通常运行在防火墙或路由器上。


    # NAT 类型


    有三种配置 NAT 方法。


    - 静态 NAT：在 във配置形式中，一个私有 IP 地址映射到一个公共 IP 地址，这意味着本地地址和全局地址之间是一一的映射。这种配置形式通常用于 Web
    托管。这种配置形式在组织中完全未使用，因为会有各种设备需要同时访问互联网。


    - 动态 NAT：在这种动态 NAT 配置中，一个私有 IP 地址从巨大的公共性质 IP 地址池中转换为一个公共 IP 地址。如果池中的任何 IP 地址不可用，数据包将被丢弃，因为只有特定数量的
    IP 地址可以从私转换为公。


    - 端口地址翻译或 PAT：这种配置也称为 NAT 泛载（NAT overload）。在这种配置形式中，多个私有 IP 地址被转换为单个公共 IP 地址。为了区分流量，使用了端口号。


    # NAT 的优点


    - NAT 有助于节省公共 IP 地址。

    - 它有助于维护适当的隐私性，因为接收和发送流量的设备 IP 地址将以隐藏形式存在。

    - 它在网络演进时有助于地址重编号。


    # NAT 的缺点


    - IP 地址的转换可能会导致路径切换延迟。

    - 某些应用程序在启用 NAT 时将无法运行。

    - 它复杂化了如 IPsec 等各种协议。


    # 交换


    # VLAN 中继协议


    VTP 或中继协议用于维护整个网络妥当的连续性和一致性。VTP 允许用户添加、删除或重命名 VLAN，这些会传播到其他交换机。然而，VTP 在交换机之间通信
    VLAN 信息有某些要求。VTP 的版本需要在所有交换机上相同。此外，VTP 的域名称需要在所有交换机上相同。对于 VTP 通信，需要一台交换机作为服务器。


    # VTP 模式


    有三种 VTP 模式：


    - 服务器（Server）：所有交换机默认设置为此模式。这种模式允许用户添加、删除或创建 VLAN。用户进行的任何更改都需要在此模式下完成。更改都会传播到属于同一域的所有交换机。

    - 客户端（Client）：在这种 VTP 模式下，交换机接收所有更新，并能够将这些更新转发给其他交换机。

    - 透明（Transparent）：这种 VTP 模式通过中继线转发 VTP 告告的摘要。这种模式的交换机可以创建自己的本地数据库，并对所有交换机保持秘密。


    # 生成树协议


    STP 或生成树协议用于通过网络监控过程跟踪所有链路，然后关闭那些冗余较少的链路，以创建一个无环路的网络。


    # STP 及其类型


    - 802.1D：这种类型的 STP 也称为 CST 或通用生成树。这是一种由 IEEE 开发的 STP 标准，它为每个拓扑只选择一个根桥接。网络中的所有流量都沿同一路径流动，但并不总是如此，因为可能会出现此类问题，即到达
    VLAN 的优化路径与通过选举根桥后获得的路径完全不同。它在性质上也非常非常慢，收敛至少需要 32 秒。


    优点：

    它需要的非常少的 CPU 和内存。


    缺点：

    它的优化百分比较低，因为计算出的通往根桥接的完美路径可能被证明不是到达网络的最佳路径。它也不提供任何形式的负载均衡。


    - 802.1w 或 RSTP：RSTP 或快速生成树协议是


