    internet communication is well documented. It helps in various situations when
    people need to be accounted for the words they speak. Thus, internet communication
    helps in establishing a very responsible environment.

    - Fast communication: Internet communication is fast. It transfers messages in
    blazing fast speed that makes it possible to send out messages at the time of
    emergency.


