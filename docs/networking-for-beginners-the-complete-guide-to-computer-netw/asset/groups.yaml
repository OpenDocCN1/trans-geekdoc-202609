    ## Chapter 16: Troubleshooting of Network


    A complete setup of network uses various components, hardware, configurations
    of network, setups and operating systems which work together for making a network
    successful. However, it might happen that some of the components stop functioning
    due to some glitch or error. Such a situation might result in the complete shutdown
    of a network which can also call up huge losses for the large-sized networks.
    So, all that is needed in such a situation functional again.


    ## Adapter resources


    Try to make sure that the adapter of the network has been installed properly and
    has also been detected by the computer without any hassle. If you are using Windows
    OS, open up the device manager and verify that there is no form of error. In case
    there is any discrepancy in the adapter of the network or if it has been detected
    by the computer as other device, you need to check that whether the adapter has
    been installed properly or not.


    ## Verifying the connections


    In case you are using a wired form of network, make sure that the network cable
    has been connected properly and the LED indicator right next to the network jack
    is blinking. A solid green LED or light means that the cable has been attached
    properly and it is receiving signals from the network. In case there is no light
    in the indicator, it might indicate that the card is not good or it has not been
    connected in the proper way or there is any form of error in the network signal.
    If you are on a small-sized local network, check all the hubs and routers and
    make sure that the cables are connected properly in all.


    In case you are using a wireless network like a laptop, make sure that the Wi-Fi
    option in your laptop has been turned on. If you are still facing any issue, make
    sure that you have selected the proper Wi-Fi network. Also, check the connection
    of the Wi-Fi router for ensuring that the router is receiving signal from the
    internet.


    ## Functionality of adapter


    You need to verify that the card of the network is able to ping itself by the
    use of ping command. If the local host is properly functioning you will receive
    replies from the host. In case you receive any error such as time out, check that
    the network card has been properly installed and the drivers are updated as well.


    - Right before you start with the process, make sure that you have set up the
    IP in both PC and MAC systems.

    - Set up a password for your PC sharing which can be found in the network.


    - Put the PC running on Windows or Linux and the MAC system in the same workgroup.


    - In the MAC system, open up system preferences and select the adaptor of the
    network. Select the advanced option which is available on the right pane and select
    wins tab and type in the same name of the workgroup.


    - Create a folder named as shared in the PC system.


    - Create a folder named as shared in the MAC system.


    - The next step is to open system preferences in the MAC system and select the
    sharing under the option of internet & network.


    - Under the file sharing option, check folder and file using SMB.


    - Now you will be able to connect both the systems and transfer files and folder
    between your PC running on Windows or Linux and the MAC system.


    Make sure that nothing is in the encrypted format while sharing as with encryption
    turned on, the system of PC will not be able to log in the MAC system and share
    files and folders.

