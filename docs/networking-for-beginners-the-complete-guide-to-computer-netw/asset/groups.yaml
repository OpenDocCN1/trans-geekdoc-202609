    at the time of packet switching. While the packets are forwarded, each of the
    packets is stored first and then forwarded. This technique is very important as
    the packets might get discarded at any of the hops due to any reason. There can
    be more than one path between the source and the destination. Each of the data
    packets comes with the addresses of both the source and the destination and thus
    the packets can travel independently across the network. In simple words, data
    packets of the same file might not travel along the same path. In case of any
    form of congestion at any of the paths, the packets can choose some different
    path over the existing network.


    For overcoming the all over weaknesses of the circuit-switched network, packet-switched
    network was developed. This is mainly because the circuit-switched networks are
    at all effective for messages of smaller size.


