    \ Web 浏览器、即时通讯工具等。该层的功能包括：\n\n  1. 邮件服务\n  2. 网络虚拟终端\n  3. FTAM 或文件传输访问与管理\n \
    \ 4. 目录服务\n\nOSI 模型作为一种参考模型，完全没有在互联网中实现，因为它被认为是过时的。TCP/IP 模型被用来取代 OSI 参考模型。\n\n\
    # VLAN\n\nVLAN 或虚拟局域网是一组由一个或多个局域网（LAN）上的设备组成的组，这些设备被配置为通信方式就像它们都连接在同一条线缆上一样，尽管它们位于局域网的几个不同段。VLAN\
    \ 本质上是极其灵活的，因为它基于逻辑连接而非物理连接。VLAN 有助于定义二层网络中的广播域。广播域无非是一组将接收来自该组内任何设备设备发送的广播帧的所有设备集合。\n\
    \n广播域通常由路由器限制，因为路由器不会转发广播帧。\n\n二层交换机创建的广播域完全基于交换机的配置。交换机是多端口桥接器，允许创建多个广播域。每个广播域都类似于交换机内部发现的一种不同形式的虚拟桥接器（桥接器）。你可以轻松地在交换机内定义一个或多个虚拟性质的桥。用户在交换机内创建的每个虚拟桥都有助于定义一个新的\
    \ VLAN 或广播域。流量无法直接从两个交换机之间或该交换机传递到其他 VLAN。\n\nVLAN 的作用就像一个子网络。VLAN 简化了网络管理员的工作，他们可以将单个交换式网络进行划分，以匹配系统的安全和功能需求，而无需布设新电缆，也无需对现有网络基础设施进行任何重大更改。VLAN\
    \ 通常由大型企业建立，目的是通过划分设备来更好地管理流量。\n\nVLAN 还通过通过将所有通信最频繁的设备分组，简单地提高网络的整体性能。VLAN 为大型网络提供了适当的安全保障，通过提供更大程度的控制来限制哪些设备可以相互访问。一个或多个网络交换机可以通过创建二层子网实现，来支持多个独立的\
    \ VLAN。\n\n# VLAN 及其类型\n\n存在多种类型的 VLAN。让我们来看看它们。\n\n- 协议 VLAN：这种类型的 VLAN 流量是基于协议处理的。网络上的交换机将根据流量的协议来转发或隔离流量。\n\
    \n- 静态 VLAN：也称为基于端口的 VLAN。它需要网络管理员将网络交换机上的端口分配到虚拟性质的网络中。\n\n- 动态 VLAN：它允许网络管理员根据设备的特征来定义网络成员身份，而不是基于交换机端口的位置。\n\
    \n# VLAN 是如何工作的？\n\n交换机上的端口或接口可以分配给单个或多个 VLAN，这使得系统能够完全根据所属的部门被分为不同的逻辑组。它还建立了关于系统如何规则，即不同组中的系统将如何相互通信。这些独立组的范围可以从实际且简单到法律且复杂不等。每个\
    \ VLAN 为所有连接到配置有相同 VLAN ID 的交换机端口主机提供数据链路访问。VLAN 标签是以太网头中的一个 12 位字段，为每个域交换支持 4,096\
    \ 个 VLAN。VLAN 标记标准化在 IEEE 802.1Q 中，也称为 Dot1。\n\n当从未连接的主机接收到未标记的帧时，接口上配置的 VLAN\
    \ ID 将使用 802.1Q 格式添加到数据链路帧的头部中。802.1Q 帧被转发到正确的目的地。每个交换机都使用标签将每个 VLAN 的流量与其他 VLAN\
    \ 的流量隔离开，仅将其转发到配置了该 VLAN 的地方。\n\n交换机之间的干道（Trunk line）可以使用标签处理多个 VLAN，以保持它们相互隔离。干道是为了携带多个信号而设计的链路，旨在两个不同点之间提供网络访问。当帧到达目的地的交换机端口时，在帧传输到目标设备之前，会移除\
    \ VLAN 标签。\n\n可以使用干道配置在单个端口上配置多个 VLAN，其中通过该端口发送的每个帧都被标记了 VLAN ID。邻接设备的接口（可能在另一个交换机或支持\
    \ 802.1Q 标记的主机上）需要支持干道模式配置，以便传输和接收已标记的帧。任何未标记的以太帧都被分配给默认性质的 VLAN，也可以在交换机的配置中指定。\n\
    \n当启用 VLAN 的交换机从连接的主机接收到未标记是以太帧时，它会添加分配给接口的 VLAN 标签。随后，随目的地的 MAC 地址转发到主机端口。广播、组播和未知单播随后转发到\
    \ VLAN 中的所有端口。当任何之前未识别或未知主机对未知单播帧做出回复时，交换机将获知主机的位置，不再对该主机的后续帧进行泛洪。\n\nSTP 或生成树协议用于在每个二层域的所有交换机之间创建无环路拓扑。根据\
    \ VLAN 规定，可以使用 STP 实例，从而允许不同的二层拓扑，或者在多个 VLAN 拓扑相同的情况下使用 MST 或多实例 STP 来减少 STP 的开销。STP\
    \ 阻塞可能产生转发环路的链路上的转发，从而从选定的根机创建生成树。\n\n# 虚拟局域网的优缺点\n\nVLAN 具有一些基本的优点，如减少广播流量、良好的安全性、限制广播域以及易于网络管理。\n\
    \n当涉及 VLAN 的缺点时，它受到每个交换域仅限 4,096 个 VLAN 的限制，这为大型托管提供商带来了许多问题，因为他们需要为客户分配数百个 VLAN。为了解决这一局限性，其他几种协议（如\
    \ NVGRE、VXLAN 和 Geneve）支持更大的标签并具有隧道功能。\n"
