    制造时的硬件网卡。局域网（LAN）上本质上是底层且感知硬件的协议通过适配器的物理地址来传输数据包。每台计算机中存在的本地适配器会跟踪局域网上的每一次传输，以确定消息是否被发送到其自身的物理地址。


    对于小型局域网，这整套机制运行得非常好。但当计算机连接到像互联网这样巨大的网络时，它每秒需要监听数十亿次传输。这可能导致网络连接失败。为了避免此类情况，网络管理员使用路由器等设备将大网络划分为多个较小的网络，以减少网络流量。这确保了来自任何网络的无效流量不会在某些网络中产生任何问题，从而使消息能够直接从发送者传输到接收者。TCP/IP
    具有强大的子网划分能力，这种能力通过逻辑地址来实现。由网络软件配置的地址被称为逻辑地址。TCP/IP 使用一种被称为 IP 地址的逻辑地址系统。


    - **可路由性**：路由器是网络基础设施中的设备，能够读取逻辑地址信息，并将数据通过网络引导到目的地。TCP/IP 是一种可路由协议。这意味着 TCP/IP
    的数据包可以轻松地从一个网络的段移动到另一个段。


    - **流量和错误控制**：TCP/IP 具有多种功能，确保数据可靠地从源传输到目的地。传输控制协议（TCP）还包含许多错误检查和流量控制功能，以及确认功能。


    # 第 13 章：FTP – 文件传输协议


    FTP 代表文件传输协议（File Transfer Protocol），是一种在线发送文件的技术。它作为应用层协议运行，帮助在本地文件系统和远程文件系统之间移动文件。它运行在
    TCP 之上，类似于 HTTP。为了共享文件，FTP 使用两个并行建立的 TCP 连接：数据连接和命令连接。


    FTP 属于今天仍在使用的的最古老的协议集之一。它是移动文件的一种非常方便的方法。FTP 服务器提供对任何目录及其子目录的全方位访问。用户可以通过 FTP
    客户端连接到所有这些服务器。FTP 客户端是一种软件，允许用户直接从服务器下载所需文件，并向同一台服务器上传文件。如果你是普通的互联网用户，你可能不需要 FTP。但如果你正在构建一个完整的网站，它是一个非常重要的工具。


    FTP 有什么用途？


    FTP 有用于将信息从你正在工作的系统移动到托管网站的服务器。例如，如果你想在服务器上安装 WordPress，你需要 FTP 来复制文件。它也被用作共享文件的工具。你可以在
    FTP 服务器上上传文档或文件，并将文件链接分享给你想分享的人。然而，这种服务在今天并不常见，因为人们倾向于使用云传输服务而不是 FTP 文件共享。有许多人倾向于将文件上传到家庭服务器，并且他们需要为此类服务启用
    FTP。


    FTP 使用两种非常基本的通道类型：携带有关任务的所有相关信息的命令通道，以及在设备之间传输文件的数据通道。


    - **命令通道**：它用于共享所有控制信息，如用户身份识别、密码、更改远程目录的命令、检索和存储文件的命令等。命令通道在端口 21 上启动。


    - **数据通道**：为了实际发送数据文件，FTP 使用数据通道。它在端口 20 上启动。


    FTP 以带外带（out of band）的方式发送控制信息，因为它利用了完全独立的命令通道。某些协议也会在同一个 TCP 连接中随数据一起发送请求。这就是为什么
    FTP 以带外的形式发送控制信息。


    FTP 连接还可以在主动模式和被动模式下运行。主动模式是最常见的，它允许设备和服务器通过两个通道之间建立开放形式的通信。在这种连接形式中，服务器在批准数据请求后承担主动功能以建立连接。然而，主动模式很容易被防火墙中断。因此，在这种情况下，被动模式就会派上场，服务器负责连接但不会主动维护连接，从而允许该网络中的所有设备执行所有任务。


    # FTP 会话


    当服务器和客户端之间启动 FTP 会话时，客户端与服务器端建立受控的 TCP 连接。客户端使用它来发送控制信息。服务器接收到这些控制信息后，它会启动一个指向客户端侧的数据连接。需要注意的是，一个数据连接只能发送一个文件。然而，命令连接在用户的整个会话期间保持活动状态。HTTP
    本质上是无状态的，这意味着它不需要对用户状态进行详细的跟踪。但在 FTP 的情况下，需要在整个会话期间维护用户状态。


    # FTP 中的数据结构


    在 FTP 中允许三种类型的结构化数据：


    - **文件结构**：在这种情况下，没有形式的内部结构。这种结构中的文件被视为数据字节的连续序列。

    - **记录结构**：在这种情况下，数据文件由顺序记录组成。

    - **页面结构**：在这种情况下，数据文件由独立性质的索引页组成。


    # FTP 本身安全吗？


    不，FTP 在设计上是不安全的。FTP 源于一个网络安全仅仅是假设性领域的时代。简单来说，使用 FTP 进行的传输不是加密格式。因此，任何能够嗅探数据包的人都可以截获文件。这就是为什么人们转向
    FTPS 而不是 FTP。FTPS 的工作方式与 FTP 完全相同，但它通过加密所有数据文件提供帮助，使得即使文件被截获也无法读取。


