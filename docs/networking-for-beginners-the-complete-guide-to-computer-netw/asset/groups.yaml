    ## 第11章：网络设备之间的连接


    为了连接到网络，计算机系统需要具备某些组件来实现无缝连接。如果没有像 IP 地址、子网掩码、DHCP 等许多组件，系统将无法连接到网络。每个系统都配有一套独特的组件，有助于建立新连接。


    ### IP 地址


    IP 地址或称为互联网协议地址（Internet Protocol Address），是连接到网络的硬件的标识数字。当你的系统拥有 IP 地址时，它就可以基于
    IP 地址（如互联网）与网络上的所有其他设备通信。大多数 IP 地址看起来像 123.121.52.141。


    ## IP 地址有什么用？


    IP 地址有助于为互联网等网络化结构中的设备提供唯一身份。它在性质上与你的家庭或业务地址相似，这些地址有助于将物资递送到具有可识别地址的特定位置。网络上的所有设备都可以在通过
    IP 地址相互区分开来。当你想要给住在国外的朋友寄礼物或包裹时，你需要知道你朋友的确切位置。在互联网上发送数据也使用了同样的过程。然而，计算机系统并不使用物理形式的邮寄地址，而是使用
    DNS 服务器查找主机名，以找到 IP 地址。


    例如，当你想要通过输入相应网站的 URL（如 www.google.com）来浏览网站时，你的加载页面请求会被直接发送到 DNS 服务器，它们通过查找 google.com
    的主机名来找到相关的 IP 地址。如果没有正确的 IP 地址，你的计算机将不知道你正在做什么。


    ## IP 地址及其版本


    IP 地址有两个不同的版本：IPv4（互联网协议第4版）或 IPv6（互联网协议第6版）。


    - **IPv4：** IPv4 是旧版本。

    - **IPv6：** IPv6 是最新版本。


