    from the source to the destination. If the protocol of routing takes the hop as
    a primary value of the metric, the path which comes with the least hop count is
    going to be considered as the fastest and the best path for moving the data packet
    from the source to the destination.


    +   **Delay:** It is the time which is taken by the network router for processing,
    queuing and transmitting one datagram to the interface. The protocols of routing
    use this form of metric for determining the values of delay for each and every
    link which are in the path from end-to-end. The path which will have the lowest
    value of delay will be taken as the best path for the data packet.


    +   **Bandwidth:** The capacity that a link has is called the bandwidth of that
    link. The link bandwidth is measured as bits per second. The link which has the
    highest rate of transfer such as gigabit will be preferred over any other link
    which comes with a link capacity like 52 kb. The protocol of routing will be determining
    the capacity of bandwidth for each and every link along the path and the link
    which comes with overall higher bandwidth will be taken as the perfect route for
