    如今的一些路由器已经为连接到网络的设备预留了 IP 地址。这一过程通常通过 DHCP 预留（DHCP reservation）来完成，它通过将特定的 IP
    地址与 MAC 地址绑定来实现，这样每当设备向路由器请求 IP 地址时，路由器都会分配用户已为该特定 MAC 地址所选择的地址。当你想要为业务或家庭网络获取静态
    IP 地址时，可以通过联系你的服务提供商（ISP）来实现，但此选项取决于提供互联网服务的公司。与获取动态 IP 地址相比，为家庭和其他本地网络拥有静态 IP
    地址是相当昂贵的。


