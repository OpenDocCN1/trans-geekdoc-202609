  - '[PAGE 8]


    require the basics of networking to some extent.


    # Computer Network Basics


    For understanding the prime functioning and components of networking, you need
    to learn about the basics first. A computer network is made up of various components
    that help in its overall functioning. Let''s have a look at the basics of networking.


    # Networking and its types


    Computer networking can be divided into two different types: wired network and
    wireless network. In the case of a wired network, it is a physical medium for
    the purpose of transporting information between the nodes. For the purpose of
    digital communication in homes and in businesses, Ethernet cables are used for
    its durability and low cost as well. Optical fiber is also being now for data
    transportation to great distances and at a much faster speed. However, whenever
    it comes to costing, Ethernet cables are much cheaper than optical fibers.


    In wireless networking, the radio waves are used for transporting data around
    the air in which the devices are connected with each other without any form of
    cables in between. WLAN or wireless LAN is the most widely used and well-known
    version which is used for wireless networking. There are several alternatives
    in the market today such as satellite, Bluetooth, microwave, cellular any many.


    It has been found that when it comes to networking, wired networking provides
    better speed, security along with reliability when it is compared with wireless
    form of networking. However, wireless networking provides much more mobility,
    scalability and flexibility that wired networking.


    Wired and wireless networking is classified according to the networking physical
    layer. However, networking can also be differentiated in accordance with the design
    and built of the network, approaches of encompassing like SDN or overlay network.
    It can also be classified according to the scale, environment like campus, LAN,
    WAN, storage area network, data center network and many more.'
  - '[PAGE 9]


    # Types of networking systems


    There are two types of networking system: open and closed. In an open system,
    the system is connected with the network and is also ready for communication.
    However, in the case of a closed system, the system is not linked with the network
    and it is not possible to connect with the same.


    # Networking components


    Computer networking comes with the requirement of the infrastructure of physical
    network. It includes various components such as routers, switches, access points
    along with the basic firmware which will help in operating the other components.
    When it comes to the other components, it includes the necessary software for
    the purpose of monitoring, securing and managing the network. All forms of networking
    rely largely on the standards of protocols for performing uniformly discrete jobs
    for communicating with various types of data. Protocol is nothing but a set of
    algorithms or rules which helps in defining the ways in which two different entities
    communicate with each other across a network. There are various types of protocols
    that can be found within a network as IP, ARP, DHCP, TCP, FTP and many more.


    VoIP or voice over IP is used for the transportation of IP telephonic traffic
    to the endpoint which also supports the protocol. TCP/IP is known as the internet
    protocol suite which is responsible for data transportation over a network based
    on IP.


    An IP address is the logical address which acts as the network address for all
    the systems in a network. It helps in creating a unique identification for all
    the devices across the network. The IP addresses are in 32 bits. IANA or Internet
    Assigned Numbers Authority assigns a unique IPV4 for each and every system or
    device in a network.


    MAC address is regarded as the physical address for every host in a network. It
    is linked with the NIC or network interface card. The MAC addresses can be found
    in 48 bits or 6 bytes or 12 nibble. Each MAC address is assigned to the system
    NIC while manufacturing of the system or device.'
