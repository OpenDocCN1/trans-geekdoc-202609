    IP suite. It originates in the implementation of a network in which it has complemented
    the IP. So, the entire suite is also known as TCP/IP. TCP helps by providing a
    reliable system of delivery of octet streams over the network of IP. The main
    characteristics of TCP include checking of errors and ordering. All the major
    forms of internet-based applications like email and the World Wide Web along with
    file transfer relies on TCP.


    # How are networking protocols implemented?


    Most of the modern operating system of today comes with in-built software services
    which help in implementing support for some of the network protocols. Various
    applications such as web browsers with software library which supports high-level
    protocols when needed by the application functioning. For some of the lower level
    protocols of routing and TCP/IP, the support is being implemented directly within
    the hardware for improving the overall performance.


    Each of the data packets which are transmitted and received by the destination
    over the network consists of binary data, zeros and ones which helps in encoding
    the message contents. Most of the protocols of networking add up small header
    at the starting of every data packet for the purpose of storing information about
    the sender of the message with the intended destination. Some of the protocols
    also add footer at the very end of data packets. Each of the network protocols
    comes with the capability of identifying all the messages of its own form and
    then process the header along with footer as parts of the moving data across the
    devices.


    A large group of protocols related to networking which functions together at both
    the higher and lower levels is known as protocol family. Some of the most common
    protocols which are used HTTP with default port 80, FTP with default port 20/21,
    SSH with default port 22, Telnet with default port 23 and DNS with default port
    53.


