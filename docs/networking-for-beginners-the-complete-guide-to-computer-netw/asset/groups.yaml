    建立远程登录还有其他方法，包括使用无线网络、集成服务、调制解调调器、数字网络或数字用户线路。为了建立登录连接，远程计算机或服务器以及本地机器都需要安装远程访问软件。如今可以找到许多服务提供商，它们通过互联网提供远程访问服务。


    ## 远程桌面软件


    远程登录最复杂的形式之一是远程桌面软件。它允许使用一台计算机来交互并查看另一个系统的实际桌面界面。为了设置远程桌面访问，两台计算机（即客户端计算机和服务器计算机）都需要在远程桌面软件上进行配置以建立连接。连接后，软件会在主计算机上直接打开一个窗口，该窗口包含客户端桌面的视图。


    客户端计算机也可以最大化程序窗口以占据整个屏幕，这将取决于软件在两个系统上的运行方式以及两个屏幕的解析。最新版本的 Windows 系统为用户提供了远程桌面软件，但它仅适用于运行企业版、专业版或终极版操作系统的计算机。对于
    Mac，Apple 远程桌面软件专为业务网络设计，用户需要单独购买。Linux 的生态系统为用户提供了关于远程桌面的各种解决方案。


    然而，还有许多本质上不是原生的远程访问程序，用户可以将它们安装在系统中，然后将其放置在桌面内置工具的位置。其中大多数程序在大多数操作系统中都能正常运行。现在的许多远程桌面解决方案依赖于虚拟网络计算（VNC）技术。基于虚拟网络计算的软件软件包适用于各种操作系统。


    ## 文件的远程访问


    基础远程登录软件允许访问系统上的文件，并可以在客户端系统上进行读取和写入。虚拟专用网络（VPN）技术提供了跨广域网的远程登录和文件访问功能。为了让 VPN
    正常工作，两个系统中都必须存在客户端软件。基于 SSH 协议的客户端/服务器软件可以作为 VPN 远程访问文件的替代方案。SSH 为目标系统提供了命令行界面。在局域网（如家庭）内共享文件的任务实际上并不被认为是远程访问环境，即使它实际上是在远程访问其他设备的系统。


    ## 使用远程桌面安全吗？


    所有用于远程连接到计算机的程序大多数情况下都是安全的。但与所有其他软件一样，某些程序会通过某些恶意过程用于窃取信息、在另一个系统上安装恶意程序、删除重要文件等。为了确保你系统的安全性，请尝试禁用你不再使用的远程桌面程序。你也可以禁用程序的某些功能。你可以轻松在
    Windows 及其他操作系统中禁用远程桌面。


