    由于为家庭或业务网络获取静态 IP 地址可能比普通的动态地址贵得多，因此最佳选项是使用动态 DNS 服务或 DDNS 来同时使用这两种形式的 IP 地址。DDNS
    服务将不断变化的动态 IP 地址与同样不变的主机名关联起来。这就像是你拥有了完全自己的静态格式 IP 地址，而无需支付动态 IP 地址之外的任何额外费用。


    No-IP 是一个免费 DDNS 示例。你可以用它将你所需的主机名重定向到与当前 IP 地址关联。简单而言之，如果你有一个动态 IP 地址，你可以使用完全相同的主机访问网络。当你需要远程访问家庭网络但不想为静态
    IP 支付更多费用时，DDNS 服务非常有帮助。你还可以在家里托管你的个人网站，并使用 DDNS 确保你网站的访问者可以随时随地访问网络。


    # DHCP 服务器


    DHCP 服务器无非一种网络服务器，它为客户端设备提供并分配 IP 地址，以及默认网关和网络的各种其他参数。它依赖于一种被称为 DHCP（动态主机配置协议）的标准协议，来响应客户端关于广播的查询。DHCP
    服务器自动向客户端发送网络必要参数，以便与网络建立适当的通信。如果没有 DHCP 服务器，网络管理员需要手动设置每一个加入网络的客户端。这可能变成一个繁琐的过程，特别是当涉及大型网络时。DHCP
    服务器为每个客户端分配一个唯一的、动态性质的 IP 地址。


    # DHCP 服务器的益处


    相比在交换机或路由器上使用 DHCP，更好的选择是拥有一个中心化的 DHCP 服务器。对于需要同时支持 IPv4 的 DHCP 和 IPv6 的 DHCP
