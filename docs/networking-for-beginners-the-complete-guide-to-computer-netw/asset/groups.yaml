    TCP/IP is a protocol set which enables the communication between computers. Protocols
    are nothing but rules which help in governing. When two devices want to communicate,
    both need the same protocol. It is now now regarded as the standard of the industry.
    All forms of operating systems support TCP/IP. The whole internet works on TCP/IP.
    It is also called the language of the internet. In case you need a computer you
    are required to use TCP/IP.


    # History of TCP/IP


    Just before the internet of today, there was ARPANet. It was created by ARPA or
    Advanced Research Projects Agency. It was launched at the time of the Cold War
    in 1969. ARPANet was created as a response to the rising threat of nuclear attack.
    ARPA''s main goal was to create a network which would be fault-tolerant and enable
    the leaders of the U.S. military to stay in touch in case of nuclear war. The
    protocol which was used for ARPANet was known as NCP or Network Control Protocol.
    As ARPANet grew in size, another protocol was also required as NCP was unable
    to meet the growing needs of a large-sized network.


    In the year 1974, a paper was published describing the features of TCP or Transmission
    Control Protocol. NCP was eventually replaced by TCP. After further development
    and testing of the new language, it led to a brand new set of protocols which
    was called TCP/IP or Transmission Control/Internet Protocol. It was finally in
    1982 when TCP/IP replaced NCP as the standard language for ARPANet.


