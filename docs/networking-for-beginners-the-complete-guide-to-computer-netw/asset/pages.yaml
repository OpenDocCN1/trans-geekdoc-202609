    # Chapter 12: Background and History of TCP/IP


    TCP/IP is a protocol set which enables the communication between various computers
    in a network. Protocols are nothing but the standards or rules which help in governing
    communications. When two devices in a network want to communicate with each other,
    both need to use the same protocol. This can also be compared to the communication
    of human beings. A person who speaks French will not be able to communicate with
    a person who speaks Chinese as both of them speak different languages. You have
    the option of selecting from a large pool of network protocols for using in the
    network. But when it comes to TCP/IP, it is regarded as the industry standard.
    All forms of operating systems support TCP/IP. The whole internet works on TCP/IP.
    It is also called the language of the internet. In case you need a computer to
    communicate with the internet, you are required to use TCP/IP.


    # History of TCP/IP'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Just before the internet of today, there was ARPANet. It was created by ARPA
    or Advanced Research Projects Agency. It was launched at the time of the Cold
    War in 1969. ARPANet was created as a response to the rising threat of nuclear
    attack from the Soviet Union. ARPA''s main goal was to create a network which
    would be fault-tolerant and enable the leaders of the U.S. military to stay in
    touch in case of a nuclear war. The protocol which was used for ARPANet was known
    as the NCP or Network Control Protocol. As ARPANet grew in size, another protocol
    was also required as NCP was unable to meet the growing needs of a large-sized
    network.


    In the year 1974, a paper was published describing the features of TCP or Transmission
    Control Protocol. NCP was eventually replaced by TCP. After further development
    and testing of the new language, it led to a brand new set of protocols which
    was called TCP/IP or Transmission Control/Internet Protocol. It was finally in
    the 1982 when TCP/IP replaced NCP as the standard language for ARPANet.


    # Features of TCP/IP


    TCP/IP has been in the industry for more than 35 years. Its proved set of protocols
    that make it possible for the devices to connect with the internet. It comes with
    various features that make communication more easier.


    +   - Support of multi-vendor: TCP/IP is being implemented by several software
    and hardware vendors. It has been now a standard of the industry and is not all
    limited to a particular vendor.


    +   - Interoperability: Today, people can work in a network which is heterogeneous
    in nature only due to TCP/IP. While you are using a computer which runs on Windows
    OS, you can still download your required files from a machine that runs on Linux.
    This is possible only because both the systems support TCP/IP. It helps in eliminating
    the boundaries of cross-platform.


    +   - Logical addressing: Each and every adapter of the network comes with a unique
    physical address which is permanent in nature. This permanent address is known
    as MAC address, also known as the hardware address. This address is being burnt
    into'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'the hardware card at the time of manufacturing. The protocols which are low-lying
    in nature and are hardware conscious on LAN delivers the packets of data with
    the use of the physical address of the adapter. The local adapter present in each
    computer tracks each and every transmission on the LAN for determining whether
    the message has been addressed to its very physical address.


    For a small-sized LAN, this whole thing works very well. But when a computer is
    connected with a very large network just like the internet, it will need to listen
    to billions transmissions every second. This might result in the failure of the
    network connection. For avoiding such cases, the administrators of the networks
    divide the big networks into various smaller networks with the use of devices
    like routers for reducing the network traffic. It makes sure that the unwanted
    traffic from any network will not create any kind of problem in some network into
    subnets for efficient travelling of the message directly from the sender to the
    receiver. TCP/IP comes with great capacity of subnetting which is achieved with
    the help of logical addressing. The address which is configured by the network
    software is called the logical address. TCP/IP uses a system of logical addressing
    which is known as the IP address.


    +   * Routability: A router is a device of the network infrastructure which is
    capable of reading the information of logical addressing and then directs the
    data through the network right to the destination. TCP/IP is a routable kind of
    protocol. This means that the data packets of TCP/IP can be easily moved from
    the segment of one network to another.


    +   * Flow and error control: TCP/IP comes with various features that make sure
    that the data is delivered from the source to the destination reliably. Transmission
    Control Protocol or TCP also checks many of the error checking and flow control
    functions along with functions of acknowledgement.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 13: FTP – File Transfer Protocol


    FTP stands for file transfer protocol is a technique of sending files online.
    It acts as an application layer protocol which helps in moving the files between
    the local file system and remote file system. It functions on top of TCP such
    as HTTP. In order to share a file, two connections of TCP arranged parallel are
    used by the FTP: data connection and command connection.


    FTP belongs to the oldest set of protocols which are still used today. It is a
    very convenient way of moving your files around. The server of FTP provides all-round
    access to any directory along with the sub-directories. The users can connect
    with all these servers with the help of FTP client. FTP client is a software which
    allows the users to download their required files right from the server and also
    upload files to the same server. If you are a normal internet user, you will not
    be requiring FTP. But, in case you are building a full website, it is a very important
    tool.


    What is FTP used for?'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'FTP is useful for moving of information from the system on which you are working
    to the server where the website is being hosted. For example, if you want to install
    WordPress on a server, you need FTP for copying over the files. It is also used
    as a tool for sharing files. You can upload a document or file on the server of
    FTP and share the file link with the person you want. However, this service is
    not much common today as people prefer cloud transfer services rather than FTP
    file sharing. There are various people who prefer to upload their files on the
    home server and they need to enable FTP for such service.


    FTP uses two very basic types of channels: the command channel which carries all
    relevant information about the task and the data channel which transfers the files
    between the devices.


    +   * Command channel: It is used for sharing all information of controls like
    the identification of the user, password, commands for changing remote directory,
    commands for retrieving and storing the files etc. The command channel is started
    on the port number 21.


    +   * Data channel: For the purpose of sending the data file in actual, FTP uses
    a data channel. It is started at the port number 20.


    FTP sends out the information of control out of band because it utilizes a completely
    separate command channel. Some of the protocols also send in request along with
    the data in the same connection of TCP. That is why FTP sends out control information
    in the form of bands.


    The FTP connection can also function in active and passive mode. Active mode is
    the most common of all and it allows an open form of communication between the
    device and the server over both the channels. In this form of connection, the
    server assumes the active function for establishing a connection after approval
    of data requests. However, the active mode can be disrupted easily by the firewalls.
    So, in such cases, passive mode comes into play where the server attends the connection
    but doesn’t maintain the connection actively and thus allowing all the devices
    in that network to perform all the tasks.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# FTP session


    When a session of FTP starts between the server and the client, the client starts
    a controlled TCP connection along with server side. The client uses it for sending
    out information on control. After the server receives this information on control,
    it starts a connection of data directed to the side of the client. It is to be
    noted that it is possible to send only one file over one data connection. However,
    the connection of control stays active throughout the session of the user. HTTP
    is stateless in nature which means it does not require to keep detailed tracking
    of the state of the user. But, in the case of FTP, it is required to maintain
    the user state all throughout the session.


    # Data structure in FTP


    In FTP, three types of structured data are allowed:


    +   - **File structure**: In this, there is no form of internal structure. The
    file in this structure is regarded as the continuous sequence of the data bytes.

    - **Record structure**: In this, the data files are composed of records in sequence.

    - **Page structure**: In this, the data files are composed of indexed pages of
    independent nature.


    # Is FTP secured in nature?


    No, FTP is not at secured by its design. FTP is from that time cyber security
    was only a study of hypothetical field. In simple words, the transfers made using
    FTP are not in encrypted format. So, anyone who is capable of sniffing data packets
    can easily intercept the files. That is the reason why people turn towards FTPS
    rather than FTP. FTPS works exactly in the same way just like FTP but it helps
    by encrypting every data files so that the prying eyes cannot read the files even
    if they intercept the files.'
  merge: -1
  img_proc: true
