  md: '# Tools for internet communication


    Internet communication has provided the human world with a wide range of tools
    for the Purpose Of communication. Let’s have a look at them.


    # Email


    Email is regarded as one of the fundamental tools for internet communication.
    Today, email addresses are required in almost all forms of services today and
    it is also believed that everyone who is active on the internet has at least one
    email address. Email addresses can be taken from various free services as Google
    and Microsoft. Email is most widely used for the purpose of sending out official
    or confidential information. However, in this world of today, it is being used
    for various harmful activities such as spreading malware or scams with the use
    of phishing emails. In the case of phishing, a third party tricks the victim into
    sharing his/her sensitive data such as bank or credit card details, account numbers
    etc. So, it is always better to be a little cautious while fetching any form of
    email from unrecognized sources.


    # Social media


    One of the trending tools of today, it is being used for seamlessly connecting
    millions of people from all over the world without any kind of delay in transmitting
    the messages. It is also being used for spreading awareness or alert in case of
    any emergency situation, share important information with anyone you want and
    many more. But, the case of fraudsters in social media today is increasing day
    by day. Also, social media is used for spreading various information which is
    being used by the fraudsters at times for spreading hoax.


    # World Wide Web


    World Wide Web is the most dominant form for internet communication. It is being
    used for everything, starting from online shopping to checking out the weather.
    It also helps in communicating online such as using digital messaging board or
    email. The users need to have a web browser in order to'
