    # Network Services


    # DHCP


    Also known as Dynamic Host Configuration Protocol, is a protocol for network management
    which is used dynamically for the purpose of assigning IP address for the devices
    or for any node on any network so that is possible to establish communication
    by using the IP. DHCP manages centrally and also automate all of these configurations
    instead of having the administrators of a network to manually assign the IP addresses
    for all the networking devices. It is possible to implement DHCP on small-sized
    local networks and also on large-sized enterprise networks. DHCP helps in assigning
    new IP addresses for every location when the networking devices are moved from
    one place to another. This means the administrators of the networks are not required
    to manually configure the devices with new IP addresses when it is moved to a
    complete new location within the network.


    # How does DHCP work?


    DHCP functions at the application layer of TCP/IP model for dynamic assigning
    of the IP addresses to the DHCP clients and for allocating TCP/IP configuration
    to the clients of DHCP. This is composed of subnet mask, IP'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'addresses, default gateway and DNS address. DHCP serves as a client-server
    protocol. In this, the servers manage a unique pool of IP addresses along with
    various information regarding the configuration parameters of the clients and
    also assign address from those pools of address only. The clients which are DHCP
    enabled send out requests to the server of DHCP whenever they connect with the
    network.


    The clients which are configured with DHCP broadcast requests to the server of
    DHCP and requests information regarding network configuration for that local network
    with they are connected or attached. The clients generally broadcast their query
    for information as soon as they boot up. The server of DHCP responds to the requests
    of the clients by providing information regarding IP configuration which was specified
    previously by the administrator of a network. This also includes one particular
    IP address as well for that time period which called a lease and the allocation
    is valid for this. At the time of refreshing any assignment, a client of DHCP
    requests out a new IP address completely based on the policies which are set by
    the administrators of the network.


    The server of DHCP also manages a proper record of all IP addresses which it allocates
    to the nodes of a network. In any case node is relocated within the network, the
    server of DHCP identifies quickly by using MAC address which helps in preventing
    the accidental configuration of several devices by using the same IP address.


    DHCP is not all a routable form of protocol nor is secure. DHCP is limited within
    a LAN which means one server of DHCP every LAN is enough for usage of any failover.
    The larger form of networks might also have WAN which contains several individual
    locations. Depending on the connections in between the points and the total number
    of clients in every location, several servers of DHCP can be set up for the purpose
    of handling address distribution.


    In the case administrators of a network want a server of DHCP to provide IP addresses
    for multiple subnets on any given network, they are required to configure the
    relay services of DHCP which located on the interconnecting routers across which
    the requests of DHCP needs to cross. These agents help'
