- pgno: 70
  md: 'The OSI model or the Open System Interconnection model is an architecture of
    7 layers in which every layer performs some specific function. All the layers
    work in close collaboration for the purpose of transmitting data from one system
    to the other all around.


    +   * Physical Layer: The layer at the bottom of the OSI model is the physical
    layer. It performs the duty of establishing an actual physical connection between
    the concerned devices in a network. All the information in the physical layer
    is stored in the form of bits. At the time of receiving the data, the physical
    layer receives the signal and then converts the same into 1s and 0s. It is sent
    to the layer of data link which puts back the frame together. Functions of the
    physical layer:


    +   1. Bit synchronization: This layer helps in bit synchronization by providing
    a clock. The clock provided by the physical layer is responsible for controlling
    both the sender and the receiver and provides synchronization at the level of
    bit.


    +   2. Bit rate control: This layer is also responsible for defining the rate
    of transmission which is the total number of bits sent out second.


    +   3. Physical topology: This layer determines the way in which all the nodes
    and devices are going to be arranged in the network which are star, bus and mesh
    topology.


    +   4. Transmission mode: This layer determines how the data is going to flow
    between the connected devices. The possible modes of transmission are: simplex,
    full-duplex and half-duplex.


    +   * Data Link Layer: This layer is the second layer right above the physical
    layer. It is responsible for message delivery from node to node. The primary function
    of the data link layer is to make sure the transfer of data is absolutely free
    from errors travelling from one node to the other, right over the 1st layer i.e.
    the physical layer. After a packet has arrived in a network, it is the duty of
    this layer to transmit the same to the host by using its'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'MAC address. The data link layer is being divided into two layers: Logical
    Link Control and Media Access Control.


    The packet which is received from the network layer is then divided into frames
    which depend on the size of the Network Interface Card or NIC. This layer also
    encapsulates the MAC address of the sender and the receiver in the data header.
    The functions of the data link layer are:


    +   1. **Framing**: The main function of the data link layer is framing. It provides
    the sender with a way for transmitting a set of bits which are meaningful for
    the receiver. This is achieved by the attachment of special patterns of bits right
    at the beginning of the frame and at the end.


    +   2. **Physical addressing**: After this layer is done with the job of framing,
    it adds physical addresses also known as MAC addresses for the sender or of the
    receiver in the frame header of.


    +   3. **Error control**: This layer comes with the mechanism of controlling errors
    in which errors are detected and the lost or damaged frames are retransmitted.


    +   4. **Flow control**: The rate of data needs to be constant on both the sides
    otherwise the data might result in getting corrupted. So, with the help of flow
    control, the data amount is coordinated which can be sent before receiving the
    acknowledgement.


    +   5. **Access control**: When a single channel of communication is being shared
    by various devices, the sub-layer of MAC in the data link layer helps in determining
    which device has the control of the channel at some given time.


    +   **Network Layer**: This layer functions for transmitting data from one host
    to another which is located in some other network. The network layer also looks
    after packet routing which means it helps in selecting the path which is the shortest
    of all for the purpose of transmitting the packet, from the total number of'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'routes which are available. The network layer also places the IP addresses
    of the sender and the receiver in the header. The functions of the network layer
    are:


    +   1. **Routing**: The protocol of the network layer determines that route will
    be the best for the packet from the source to the destination. This function performed
    by the network layer is called routing.


    +   2. **Logical addressing**: For the purpose of identifying the devices on the
    internetwork in a unique way, the network layer helps by defining a scheme of
    addressing. The IP address of the sender and the receiver are placed in the header
    which helps in distinguishing each and every device in a unique and universal
