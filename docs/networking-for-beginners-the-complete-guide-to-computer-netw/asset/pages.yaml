  md: 'wired network but it is done without wires.


    The basic form of wireless network which is peer to peer network requires these
    hardware components.


    +   * **Router**: Wireless router can be regarded as the heart of a wireless network.
    Just like a wired network, it is the central location with which all the computers
    connects to for accessing the network. The wireless routers are also called as
    access points. It helps in managing the connections in a wireless network and
    also helps in establishing a connection with the network.

    * **NIC**: Every computer who wants to connect with the network requires a NIC
