- pgno: 93
  md: 'to check that whether the adapter has been installed properly or not.


    # Verifying the connections


    In case you are using a wired form of network, make sure that the network cable
    has been connected properly and the LED indicator right next to the network jack
    is blinking. A solid green LED or light means that the cable has been attached
    properly and it is receiving signals from the network. In case there is no light
    in the indicator, it might indicate that the card is not good or it has not been
    connected in the proper way or there is any form of error in the network signal.
    If you are on a small-sized local network, check all the hubs and routers and
    make sure that the cables are connected properly in all.


    In case you are using a wireless network like a laptop, make sure that the Wi-Fi
    option in your laptop has been turned on. If you are still facing any issue, make
    sure that you have selected the proper Wi-Fi network. Also, check the connection
    of the Wi-Fi router for ensuring that the router is receiving signal from the
    internet.


    # Functionality of adapter


    You need to verify that the card of the network is able to ping itself by the
    use of ping command. If the local host is properly functioning you will receive
    replies from the host. In case you receive any error such as time out, check that
    the network card has been properly installed and the drivers are updated as well.'
  merge: -1
  img_proc: true
