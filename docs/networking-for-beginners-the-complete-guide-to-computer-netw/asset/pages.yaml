    # # Chapter 14: Remote Login


    Remote login, also known as remote access, is the technique which is being used
    for accessing a system of computers like office network or home computer from
    a location which is remote in nature or is much away from the physical location
    of the system. This technique allows the office employees to keep up with their
    work offsite, like at their home or at any other place, while still accessing
    a network or computer at a distance, for example, office network. Remote login
    or access can be easily set up with the use of LAN or local area network, WAN
    or wide area network or even with the help of VPN or virtual private network so
    that all the systems and resources can be accessed from a remote distance.


    Remote login can be created through a line which runs between the computer of
    the user and an organization’s company’s LAN. It is also possible to establish
    a connection between the LAN of a company and a remote LAN by the use of a dedicated
    line. This form of lines provides great speeds but also has the drawback of being
    very expensive. Another way of establishing remote login connection is by the
    VPN. VPN is a network which uses the internet for connecting with the remote sites
    and also the users together. This form of network uses encryption and also tunneling
    for the purpose of accessing the network of a company. This might turn out to
    be the'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'best choice for those organizations which are small in size.


    There are other means for establishing remote login that includes the using of
    wireless network, integrate services, cable modem, digital network or digital
    subscriber line. For the purpose of establishing a remote login connection, both
    the remote computer or server and the local machine need to have software of remote-access.
    There are various service providers that can be found today which provides remote
    access services via the internet.


    # Remote desktop software


    One of the most sophisticated forms of remote login is remote desktop software.
    It allows the use of one computer to interact and see the actual desktop interface
    of another system. For setting up remote desktop access, both the computers, i.e.
    the computer of the client and the computer of the server need to be configured
    on the remote desktop software for establishing a connection. After being connected,
    the software opens up a window directly on the host computer which contains the
    view of the client''s desktop.


    The client computer can also maximize the window of the program for taking up
    complete screen which will depend on how the software works on both the systems
    and what is the screen resolution of both the screens. The latest versions of
    Windows OS offer users with Remote Desktop Software which is only available for
    those computers which are running on either Enterprise, Professional or Ultimate
    version of the OS. When it comes to Mac, the Apple Remote Desktop Software is
    designed only for the business networks and the users are required to buy the
    same separately. The ecosystem of Linux offers users with various types of solutions
    regarding remote desktop.


    However, there are various types of remote access programs which are non-native
    in nature which the user can install on their system and then use the same place
    in the desktop tools which comes built-in. Most of them function absolutely in
    the proper way in most of the OS. Many of the remote desktop solution today rely
    on the technique of virtual network computing. The packages of software which
    are based on virtual network computing works across various OS.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Remote accessing of files


    The basic remote login software allows access of files on the system that can
    be read and also written on the system of the client. The technology of virtual
    private network offers remote login and functionality of file access across WAN.
    For a VPN to function properly, the client software is required to be present
    on both the systems. The client/server software which is based on SSH protocol
    can be used as an alternative to VPN for remote access of files. SSH offers an
    interface of command line to the system of the target. The task of sharing files
    within a local area network such as within home is not actually remotely considered
    to be an environment of remote access even if it is actually remotely accessing
    the system of other device.


    # Is using remote desktop safe?


    All the programs which are used for connecting remotely to your computer are most
    of the times safe. But, like all other software, there are some which go through
    some malicious process for the purpose of information stealing, installing malicious
    programs on another system, deleting important files and many others. In order
    to make sure the security of your system, try to disable those programs of remote
    desktop which you no longer use. You can also disable some of the functionalities
    of the program. You can easily disable remote desktop in Windows along with other
    OS.'
