    # Functions of the transport layer:


    +   1. **Segmentation**: The transport layer accepts the sent message from the
    session layer and then breaks onto several smaller units. The segments which are
    produced after segmentation comes with a header associated with every segment.
    The segmented message is reassembled by the transport layer at the destination.


    +   2. **Service point addressing**: For the purpose of delivering message to
    the proper process, the header of the transport layer also includes an address
    type which is called the port address or service point address. By determining
    this specific address, the transport layer makes sure that the intended message
    gets delivered to the right process.


    # Services provided by transport layer:


    +   1. **Service oriented to connection**: This whole process is done in three
    phases:


    - Connection establishment

    - Transfer of data

    - Disconnection or termination


    In this form of transmission, the device on the receiver’s side sends out an acknowledgement
    intended for the source right after a data packet or group of packet has been
    received by the destination. This form of transmission is very secure and reliable
    as well.


    +   2. **Connection less service**: This process is one phase in'
