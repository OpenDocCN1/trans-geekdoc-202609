    # Routing and its types


    Routing is of various types and it can be easily classified into three broad categories:


    +   * Static routing: It is also known as the nonadaptive form of routing. With
    this routing technique, the administrator of a network manually adds the preferred
    routes within the table of routing. A router sends the data packets towards the
    destination by following the route which is defined by the administrator. In this
    routing technique, the decisions of routing are not at all based on the topology
    or conditions of a network.


    # Advantages:


    +   1. No overhead: It has no form of overhead on the usage of the CPU of the
    network router. Therefore, a cheaper variant of the router can easily be used
    for obtaining static routing.


    +   2. Bandwidth: It has no usage of bandwidth between the network routers.


    +   3. Security: It provides proper security as the administrator of the system
    is allowed control only over the process of routing to a specific network.


    # Disadvantages:


    +   1. For a large-sized network, it turns out to be a very difficult task for
    manually adding each of the routes to the table of routing.


