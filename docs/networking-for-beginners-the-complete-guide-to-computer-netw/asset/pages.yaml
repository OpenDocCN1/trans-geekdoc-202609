    # Static DHCP leases VS. Dynamic DHCP leases


    By having a dynamic DHCP, the client does not own an IP address which has been
    assigned but instead of that leases the address for a period. Every time when
    a device with a dynamic form of IP address gets powered up, it needs to communicate
    with the server of DHCP for leasing another IP address. The wireless types of
    devices are the examples of those clients which are assigned with dynamic IP addresses
    whenever they connect with the network. The devices which are assigned with a
    static form of IP address permanent IP addresses. They are used for various devices
    such as switches or web servers.


    Under a setup of dynamic DHCP, the clients need to perform certain tasks that
    result in termination of its address and reconnect with the network with the use
    of other IP address. The lease times of DHCP varying depending on period of time
    for a user needs the internet connection at one specific location. The devices
    with a dynamic IP address, release the IP addresses when the lease of their DHCP
    expires and then the devices request for renewal of IP addresses from the server
    of DHCP in case they want to stay online for a longer time. The server of DHCP
    might assign a completely new IP address instead of just renewing the old IP address.


    # NAT


    For accessing the internet, a user needs one IP address which is public in nature.
    Private IP addresses can be used in those networks which are private in nature.
    The primary goal of NAT is to permit several devices to get access to the internet
    by using one public address. For the purpose of achieving this, it is required
    to translate the IP address to a public IP address. NAT or Network Address Translation
    is the process by which one or more than one local form of IP address is readily
    translated into one or more than one'
