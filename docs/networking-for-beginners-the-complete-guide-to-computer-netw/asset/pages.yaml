    # Switching


    # VLAN Trunking Protocol


    VTP or VLAN trunking protocol is used for maintaining proper continuity and consistency
    throughout a network. VTP allows the users to add up, remove or rename VLANs which
    is propagated to other switches within the domain of VTP. However, there are certain
    requirements for the VTP to communicate about VLAN information between the switches.
    The version of VTP needs to be similar on all the switches which the user needs
    or wants to configure. Also, the domain name of VTP needs to be same on all the
    switches. For VTP communication, one of the switches needs to act like the server
    or be the server.


    # Modes of VTP


    There are three different modes of VTP:


    +   - Server: All the switches are set for this mode by default. This mode allows
    the users to add, delete or create VLANs. Any kind of change that the user wants
    to make needs to be done in this mode. Each and every change which is made in
    this mode is propagated to every switch which belongs to the same domain of VTP.'
