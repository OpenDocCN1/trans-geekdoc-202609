    help in identification of the errors in order to ensure that the data has been
    re-synchronized in the proper way. It also ensures that the message ends are not
    prematurely cut for avoiding loss of data.


    +   Dialog controller: This layer allows the two systems to begin the communication
    with one another in full-duplex or half-duplex.


    +   Presentation layer: The presentation layer is also known as the translation
    layer. The data which is received from the application layer is extracted in this
    layer and is also manipulated as per the requirements of the format for transmitting
    the same over the network. The functions of this layer are:


    +   Translation: It helps in the process of translation such as from ASCII to
    EBCDIC.


    +   Encryption and decryption: The encryption of data translates the whole data
    into some other form or code.'
