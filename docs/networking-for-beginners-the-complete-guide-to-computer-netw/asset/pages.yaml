    # Chapter 8: Hardware Involved in Computer Networking


    Computer networking is mostly about hardware. There are various types of hardware
    components used in setting up a network and for its functioning. You can set up
    a network with the minimal hardware requirements but as you keep on adding more
    elements one by one, the performance and reliability of the network also increase.


    # Networking cables and wires


    In spite of so much advancement in wireless networking technologies, many of the
    computer systems in the 21st century still rely on wires and cables as the physical
    medium for transferring information data across the network. There are various
    standards of cables in the world of networking and each of them is designed for
    some particular purpose. The most common types of'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'networking cables and wires that can be found today are Ethernet cables and
    fiber optic cable.


    # Ethernet Cable


    Ethernet cable is the most common form of cable that is used for wired networking.
    It helps in connecting various devices such as computers, switches and routers
    within a network of local nature. However, Ethernet cables are very much limited
    when it comes to durability and length. If the cable is kept too long or is of
    not good quality, the cable won''t be able to carry good signal. That is the reason
    why different types of Ethernet cables are used for different functions.


    # Types of Ethernet cable


    The Ethernet cables which are used today support many of the industry standards
    that also includes category 5 and 6. The technicians who are experts in computer
    networking referring to these Ethernet cable standards CAT5 and CAT6. Ethernet
    cables are developed in two forms:


    +   - Solid Ethernet cables: This form of Ethernet cable offer a bit better performance
    along improved security against all forms of electrical interference. Such cables
    are also being used in the business networks, office wall wiring and under-floor
    wiring.

    - Stranded Ethernet cables: This form of Ethernet cable is less vulnerable in
    nature are also less prone to breaks or cracks. This type of Ethernet cable is
    suitable for the home-based network.


    # Ethernet cables and limitation


    Ethernet cables come with distance limitation. It comes with a distance capacity
    where the cable comes with a maximum upper limit for how long it can run before
    there is any form of loss in network signal. This is also known as attenuation.
    This is mainly because long cables come with an electrical form of resistance
    that prohibits signal flow and affects the overall performance of the network.
    Both the ends of the Ethernet cable needs to be close enough for receiving signals
    fast and also at a distance from any form of external interference for avoiding
    interruptions in the connection.'
