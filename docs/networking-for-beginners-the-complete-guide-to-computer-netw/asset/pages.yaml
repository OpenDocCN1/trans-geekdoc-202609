    # Chapter 2: Internet Communication


    The world today has completely changed from which it was a few years back. It
    is changing every day. With the advancement of digital technology, the pace of
    change has also become very fast. There were times when a simple message used
    to take a few months to deliver and now it takes just a few seconds. Internet
    communication has evolved so much that it can now connect people seamlessly from
    every corner of the world.


    # Internet Communication


    Internet communication is a very simple thing. It is the sharing of ideas, information
    or just mere words over the internet or World Wide Web. Internet is composed of
    a huge string of worldwide connected networks which helps in exchanging information
    and data with the help of packet switching by using the TCP/IP.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Internet communication comes with a bunch of advantages that can help us in
    a lot of ways.


