    # # Chapter 15: Networking In Detail


    Computer networking functions with various components and systematic parts, all
    of which functions together for making the connection to a network successful
    one. Let''s have a look at some of the primary components of networking.


    # ## Protocols


    Network protocols help in defining the various conventions and rules for the purpose
    of communication between various devices in a network. The protocols of networking
    include various mechanisms for all the network devices for identifying and making
    connections with one another along with formatting the rules which help in specifying
    how the data is going to be packaged into received and send messages. Some of
    the network protocols also support compression of data and acknowledgement of
    the message which is designed for the high performing and reliable form of network
    communications. The network protocols incorporate all the constraints and requirement
    of processes for the initiation and accomplishment of communication between the
    routers, computers, servers and other devices which are network-enabled. The network
    protocols need to be confirmed as well as installed by both the sender and the
    receiver for ensuring data or network communication.


    The modern network protocols use generally the techniques of packet'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'switching for sending and also receiving messages in the form of data packets.
    Data packets are nothing but subdivided messages which are broken into pieces.
    The data packets are collected at the destination and then reassembled for getting
    the complete message. There are various types of network protocols which have
    been developed and designed for some specific functions in specific environments.


    # Internet Protocol


    IP or the internet protocol family is composed of a set of related protocols of
    networking. Besides having internet protocol itself, there are also various higher
    class protocols such as UDP, TCP, FTP and HTTP. All such protocols integrate with
    the internet protocol for the purpose of providing many added capabilities. There
    are some lower-level internet protocols as well as ICMP and ARP which exists within
    the family. The higher-level protocols which belong to the family of IP have much
    closer interaction with the applications such as web browsers. The lower-level
    protocols interact with the adapters of a network along with some other hardware
    of the computer.


    # Wireless Network Protocols


    The wireless networking system has turned out to be commonplace which is mainly
    because of Bluetooth, Wi-Fi and LTE. There are wireless network protocols that
    check the functioning of wireless networks. The network protocols which have been
    designed for the purpose of wireless networking needs to support roaming in mobile
    devices and also deal with various issues like network security and variable rates
    of data.


    # Network Routing Protocols


    The network routing protocols are the specially designed protocols which have
    been designed to use specifically for the network routers. A network routing protocol
    is capable of identifying other routers on the network, manage the destination
    of the messages of a network, manage the message pathways which are called routes
    and also makes dynamic decisions on routing. Some of the most common protocols
    of routing include OSFP, EIGRP and BGP.


    # TCP or Transmission Control Protocol'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'The TCP or Transmission Control Protocol is regarded as the core protocol of
    the IP suite. It originates in the implementation of a network in which it has
    complemented the IP. So, the entire suite is also known as TCP/IP. TCP helps by
    providing a reliable system of delivery of octet streams over the network of IP.
    The main characteristics of TCP include checking of errors and ordering. All the
    major forms of internet-based applications like email and the World Wide Web along
    with file transfer relies on TCP.


    # How are networking protocols implemented?


    Most of the modern operating system of today comes with in-built software services
    which help in implementing support for some of the network protocols. Various
    applications such as web browsers with software library which supports high-level
    protocols when needed by the application functioning. For some of the lower level
    protocols of routing and TCP/IP, the support is being implemented directly within
    the hardware for improving the overall performance.


    Each of the data packets which are transmitted and received by the destination
    over the network consists of binary data, zeros and ones which helps in encoding
    the message contents. Most of the protocols of networking add up small header
    at the starting of every data packet for the purpose of storing information about
    the sender of the message with the intended destination. Some of the protocols
    also add footer at the very end of data packets. Each of the network protocols
    comes with the capability of identifying all the messages of its own form and
    then process the header along with footer as parts of the moving data across the
    devices.


    A large group of protocols related to networking which functions together at both
    the higher and lower levels is known as protocol family. Some of the most common
    protocols which are used HTTP with default port 80, FTP with default port 20/21,
    SSH with default port 22, Telnet with default port 23 and DNS with default port
    53.


    # Layers of the OSI Model and Its Functions'
  merge: -1
