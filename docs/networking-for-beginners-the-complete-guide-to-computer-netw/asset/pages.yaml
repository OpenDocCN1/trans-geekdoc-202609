    oriented service is much more reliable than the connection less service.


    +   Session layer: The session layer serves the function of connection establishment,
    session maintenance, authentication and also security of the session. The functions
    of this layer are:


    +   Establish of session, maintenance of session and termination: This layer helps
    in the establishment of the two processes, uses and also terminates the connection.


    +   Synchronization: The session layer helps in adding checkpoints which are regarded
