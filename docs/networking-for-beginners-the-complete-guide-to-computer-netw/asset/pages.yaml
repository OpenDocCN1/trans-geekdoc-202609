- pgno: 34
  md: '# Fiber Optic Cable


    Fiber optic cable is a form of network cable that comes with glass fiber strands
    inside the insulated casing of the cable. It has been designed for long-distance
    transmission of data, telecommunications and for high performance of the network.
    When compared with Ethernet cables, fiber optic provides larger bandwidth and
    it is capable of transmitting data to long distances without any loss in signal.
    It supports most of the world’s cable television, internet and telephonic systems.


    # How does fiber optic cable function?


    Fiber optic cable is composed of strands of glass which are slightly thicker when
    compared with human hair. The center of each of the glass strand is known as the
    core which provides the travelling pathway for light. The core of the glass strands
    is surrounded by a glass layer which is known as cladding which helps in reflecting
    all light inwards and thus helps in preventing signal loss. It also allows the
    light to travel through cable bends easily. Fiber optic cables are of two types:
    single-mode and multi-mode. The single-mode cable uses super thin strands of glass
    along with a laser for the purpose of generating light. The multi-mode cable uses
    LEDs for generating light.


    The single-mode fiber optic cable uses a technique known as Wave Division Multiplexing
    for the purpose of increasing data amount traffic which can be carried by the
    glass strands. This technique allows light to travel at various wavelengths for
    combining and then separating later for transmitting various streams of communication
    via a single pulse of light.


    # Fiber optic cable and its advantages


    Fiber optic cables offer various advantages for long distance transmission. Fiber
    optics can easily support higher capacity of transmission. The bandwidth of fiber
    optic cables is 10 Gbps, 40 Gbps and 100 Gbps as standards. Fiber optics do not
    need any form of signal booster this is because light travels for longer distances
    without any form of loss in its strength.


    The cable of fiber optics is less vulnerable to any form of interference. The
    Ethernet cables require shielding for its protection from electromagnetic'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'interference. However, this shielding is not enough for the ultimate protection.
    However, the physical properties of fiber optics cable can easily avoid all these
    problems.


    # Fiber optics to the home


    In most of the cases, fiber optic cables are used for long distance communication
    between the cities and countries. However, some of the local internet providers
    are also extending their network by installing fiber optics which can be accessed
    directly by the households. One of the prominent fiber to home service which is
    available in the market today is Google fiber. Such fiber optics services can
    easily provide gigabits of internet speeds to the home network as:


    +   **Fiber to the premises or FTTP**: In this, the fiber optic cables are laid
    to the buildings directly.


    +   **Fiber to the building or FTTB**: It is similar to that of FTTP.


    +   **Fiber to the curb of node or FTTC/N**: In this, fiber optic cables are laid
    till the node and then copper wires are used for completing the overall connection
    inside the household building.


    +   **Direct fiber**: In this, the fiber optic cable is taken from the central
    office and is connected to the system of the customer directly. This form of connection
    provides the best bandwidth but is expensive as well.


    +   **Shared fiber**: It is similar to direct fiber but as the fiber optic cable
    reaches the premises of the users, it is distributed into several fiber optic
    cables for the users.


    # Other Required Forms of Hardware


    # Wireless Hardware


    For setting up a wireless network, you need certain components of hardware. When
    it comes to a wireless network, there are two types of network: ad hoc and infrastructure.
    The infrastructure mode of network is the kind of wireless network that can be
    found in offices and homes. It is somewhat similar to the'
