    When it comes to the disadvantages of VLAN, it comes with the limitation of 4,096
    VLANs only for per switching domain creates lots of problems for the large-sized
    providers of hosting, which also comes with the need to allocate hundreds of VLANs
    for the customers. For addressing this limitation, several other protocols such
    as NVGRE, VXLAN and Geneve supports larger sized tags and also with the ability
    of tunneling'
