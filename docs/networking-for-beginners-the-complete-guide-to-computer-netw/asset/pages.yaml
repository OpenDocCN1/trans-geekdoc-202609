    +   3. FTAM or file transfer access and management


    +   4. Directory services


    The OSI model as the reference model and is not at all implemented for the internet
    as it is considered as outdated. TCP/IP model is used in place of the OSI reference
    model.


    # VLAN


    VLAN or virtual LAN is a group composed of devices on one or more than LANs which
    are configured for communicating in a way as if all of them are attached with
    the same wire whereas they are located at several different segments of a LAN.
    VLANs are extremely flexible in nature as it is based on a logical connection
    in place of a physical connection. VLANs help in defining the domains of broadcasting
    in a network of Layer 2 nature. A broadcast domain is nothing but a set of all
    the devices which will be receiving frames of broadcast originating from any of
    devices within that set.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'The broadcast domains are bounded typically by the routers as the routers will
    not be forwarding the frames of the broadcast.


    The switches of Layer 2 create broadcast domains which are completely based on
    the switch configuration. Switches are the multiport bridges which allow in creating
    several broadcast domains. Each of the broadcast domains is similar to a distinct
    form of a virtual bridge which can be found within a switch. You can easily define
    one single or many bridges of virtual nature which are available within a switch.
    Each of the virtual bridge which a user creates within the switch helps in defining
    a new VLAN or broadcasting domain. It is not possible for traffic to directly
    pass to some other VLAN between two switches or that switch.


    VLAN acts just like a sub-network. VLAN eases up the job for the network administrators
    to divide one single switched network for matching the security and functional
    requirements of the systems without the need of running new cables or without
    making any major changes in the present infrastructure of the network. VLANs are
    generally set up by the large-sized businesses for the purpose of re-partitioning
    the devices for the better management of traffic.


    VLANs also help in improving the all-round performance of the network simply by
    grouping all the devices which communicates the most. VLANs provide proper security
    for the large-sized networks by providing a greater degree of control across which
    the devices have access to each other. One or more than network switch can support
    several independent VLANs by creating Layer 2 subnet implementation.


    # VLANs and its types


    There are various types of VLANs present. Let''s have a look at them.


    +   - Protocol VLAN: This type of VLAN comes with traffic handled base on the
    protocol. The switch on the network will either forward or segregate the traffic
    based on the protocol of the traffic.


    +   - Static VLAN: It is also known as port-based VLAN. It requires the administrator
    of a network for assigning the ports on the'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'network switch to a network of virtual nature.


    +   - Dynamic VLAN: It allows the network administrator to define the membership
    of the network which is based on the characteristics of the device which is in
    opposition to the switch port location.


    # How does VLAN work?


    Ports or interfaces on the switches can be assigned to one single or more than
    one VLANs which enables the systems to get divided into various logical groups
    which are based completely on the departments with which they are associated with.
    It also establishes the rules about the systems how the systems in the separate
    groups are going to communicate with one another. These separate groups can range
    from practical and simple to legal and complex. Each of the VLAN provides access
    of data link to all the hosts which are connected to the switch ports configured
    with the similar VLAN ID. The VLAN tag is a field of 12-bit in the header of the
    Ethernet which provides support for 4,096 VLANs per domain switching. The tagging
    of VLAN is standardized in the IEEE 802.1Q and is also called Dot1.


    When a frame is received of untagged nature from a host which is unattached, the
    VLAN ID which is configured on the interface is added up in the header of the
    data link frame by using the format 802.1Q. The frame of 802.1Q is forwarded towards
    the proper destination. Each of the switches uses the tags for keeping each traffic
    of the VLAN separate from the traffic of the other VLANs, forwarding the same
    only to the place where VLAN is configured.


    The trunk line between the switches can handle several VLANs by using the tags
    for keeping them all segregated. A trunk line is a line of communication which
    has been designed for carrying several signals for the purpose of providing network
    access between two different points. When the frame reaches the ultimate switch
    port of the destination, the tag of VLAN is removed just before the frame is transmitted
    to the device of destination.


    It is possible to configure multiple VLANs on one single port with the use of
    trunk configuration in which each of the frames sent through the port is being
    tagged with the VLAN ID. The interface of the neighboring device which'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'might be on some other switch or host which supports 802.1Q tagging will require
    to support the configuration of trunk mode for transmitting and receiving the
    frames which have been tagged. Any of the Ethernet frames which are untagged are
    assigned to a VLAN of default nature which can also be designated in the configuration
    of a switch.


    When a switch is VLAN-enabled receives an Ethernet frame of untagged nature from
    an attached host, it adds the VLAN tag which is assigned to the interface. The
    frame is then sent forward to the host port along with the MAC address of the
    destination. Broadcast multicast and unknown unicast is then forwarded to all
    the ports in the VLAN. When any previously unrecognized or unknown host replies
    to an unknown frame of unicast, the switches get to know about the host location
    and do not flood the host with the subsequent frames which were addressed for
    that host.


    The STP or Spanning Tree Protocol is being used for creating a topology of loop-free
    nature among all the switches in every Layer 2 domain. As per the regulations
    of VLAN, an instance of STP can be used which enables the various topologies of
    Layer 2 or a MIST or multi-instance STP can be used for reducing the overhead
    of STP in case the topology is the same among the multiple VLANs. STP blocks away
    the forwarding on the links which might produce some forwarding loops and thus
    creating a spanning tree from the selected switch of root. The concept of blocking
    means that some of the links will not be all for the purpose of forwarding unless
    and until there is a failure in some other part of the network which causes the
    STP to turn the link a part of any forwarding path of active nature.


    # Advantages and disadvantages of virtual LAN


    VLAN comes with some basic advantages such as reduced traffic of broadcast, proper
