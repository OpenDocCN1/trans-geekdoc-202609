- pgno: 14
  md: '# Chapter 3: Client-Server Approach


    The client-server approach is the architecture of computer networking in which
    various clients or the remote processors requests for a service and receives the
    same from the host or server computer. The computers of the clients come with
    an interface for the purpose of allowing the user of a computer for requesting
    various services from a server and then display the requested result which is
    returned by the server. All the servers in a network wait for the arrival of the
    requests from the clients and then respond to each of the requests. Generally,
    a network server comes with a transparent standardized interface for the clients
    so that all the clients are aware of the system specifications such as software
    and hardware which is responsible for providing the services.


    ![](img/f6e39736dfc482245d9c29c4f7c9f146_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'and the clients have some specific job to perform regularly. For example, in
    data processing of hospitals, the computer which acts as the client system runs
    a program for entering all the patient information and the server system helps
    in managing the patient database in which all form of information is stored permanently.
    All the clients on the network can access the information which is given out by
    the server and the client system can also perform other jobs like sending out
    emails.


    Both the client and the server in the networking approach are regarded as intelligent
    devices. So, the client-server model is completely different and much more advanced
    than the old model of mainframe in which the central server computer used to perform
    all jobs for all the terminals in a network.


    # Components of the client-server model


    The client-server model works with three components: servers, network devices
    and workstations. Workstations in a network are those computers which are subordinate
    to the servers. Workstation sends out various requests to the servers for accessing
    the shared files, programs, databases and files. It is governed by the server
    policies. The server in a network serves all the requests that come from the workstations
    and can perform several other functions like management of the programs, files,
    databases along with the policies of management. Network devices in a network
    help in establishing communication between the servers and the workstations. In
    simple words, the network devices act as the connectors and also routes the data
    in and out from the network.


    # Workstations


    Workstations, also known as client computers, are the ones who send out requests
    to the servers. They are differentiated by the OS which runs their systems. In
    a network of client-server, Windows XP, Windows 7, Windows 10, Linux etc are the
    OS of the workstations. As these OS are cheaper than the OS of servers, the processes
    and functions of such OS are intended for the client computers or workstations
    only. Shared programs, policies of security and management and centralized databases
    are not part of the OS. They come'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'with a localized version of policies programs and databases. The workstations
    come with a lower level of technical specifications when compared with the servers
    in respect to processor speed, memory and space of hard drive as the client systems
    are not required to record any form of data or process any request like the server
    system.


    # Servers


    Servers are differentiated from each other by their individual sets of OS such
    as Windows 2003, Windows 2008 or Windows 2000 server. When it comes to the servers,
    they come with faster speed of processing, higher hard drive space along with
    more memory. It is mainly because the servers stores up various forms of data
    and also services multiple workstation requests simultaneously. A server can perform
    any type of role within a client-server network. It can act as the mail server,
    file server, domain controller and database server at the same time. However always
    divides these roles among all the available servers for optimizing the network
    performance. But, no matter what role a server performs, it acts as the centralized
    repository for databases, programs, network files and policies.


    Servers are very easy to manage and also take backup as the servers in a network
    are not all dependent on the configuration of the individual user and it can be
    implemented seamlessly across the network.


    # Network devices


    Network devices act as the intermediary between the server and the workstation
    and help in establishing a connection between the two. Network devices make sure
    that the requests going from and to the workstations are properly routed with
    the concerned server. There are various types of network devices available today
    and each performs different functions of connectivity. In a basic client-server
    network, the hub helps in connecting a server with the various workstations. It
    also functions as a repeater and passes on information and data from one device
    in the network to another. Network devices such as bridges help in separating
    the various segments of a network.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/f6e39736dfc482245d9c29c4f7c9f146_17_0.png)


    # # Chapter 4: Peer to Peer Connection


    In the world of networking, there are various types of connection that can be
    found and created easily. Each of the connections comes with a particular purpose
    and structure of its own. A P2P or peer to peer network is created when two or
    more computers are connected with each other and share resources and data with
    each other without the presence of any separate server system. In this form of
    connection, all the computers within the network share an equal amount of responsibility
    for the purpose of data processing. Peer to peer network is completely different
    from client-server networking. In a client-server network, the server acts as
    the master system and processes data which is consumed or used by the other client
    systems within the network. However, this is not the case with peer to peer connection.


    A peer to peer network can act like an ad hoc connection in which several computer
    systems are connected with each other via Universal Serial Bus for the purpose
    of transferring files and data. It can also perform as a permanent infrastructure
    which links up several computers within a small office network'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'with the use of copper wires. A P2P connection can also be a larger network
    of much bigger scale which uses special protocols along with applications for
    the purpose of setting up a direct relationship with all the users over the internet.
    In simple words, a peer to peer network can assume various at times and as required.


    # Peer to Peer connection and its characteristics


    Peer to peer connection can be found on all forms of small-sized LAN or local
    area network. It is most commonly found in home networks. Both the wired and wireless
    form of home network can be set up as peer to peer network. All the computers
    which are involved in a peer to peer network run the same protocols of networking
    and software. The network devices of peer are most often located near another
    peer generally in small businesses, homes, schools and smaller organizations.
    There are also other types of peer to peer connection that utilizes the internet
    and are dispersed at long distances geographically all over the world.


    The home networks which use routers of broadband are a hybrid form of peer to
    peer and client-server network. The broadband provides a centralized sharing connection
    of internet but the printer, files and all sharing of resources are directly managed
    between all the involved local computers.


    # Peer to peer along with Ad Hoc network


    The Wi-Fi or wireless networks support ad hoc connection between the devices.
    Ad Hoc networks are a form of pure peer to peer connection which can be compared
    with those networks that use wireless routers as the intermediary device. The
    devices that build up ad hoc networks require no form of infrastructure for the
    purpose of communication.


    # Benefits of Peer to Peer connection


    Peer to peer network is robust in nature. In case one of the attached devices
    fails to peer, the network continues to function with the use of other devices.
    You can easily configure the computers in a peer to peer network workgroups for
    allowing file sharing, printers along with other resources across all the connected
    devices. Peer to peer connection allows both way'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'sharing of data, whether for the purpose of downloading to the computer or
    for uploading from the computer.


    While on the internet, peer to peer networks can easily handle huge volumes of
    traffic of file sharing. It handles huge traffic by distributing all the load
    across all the computers in the network. P2P connections are not dependent on
    any form of central server, this network is better in scalability and is also
    more functional when compared to client-server network at the time of any kind
    of emergency or heavy traffic.


    You can easily expand a peer to peer network. As you keep increasing the total
    number of devices in the network, the power of peer to peer network also keeps
    on increasing. This is because in peer to peer connection, all the devices are
    responsible for data processing and with the increase in the number of devices
    within the network, the processing power and speed of the network also increases.


    # Peer to Peer connection and the security concerns


    In this world of today, none of the network systems is safe from external attacks.
    Just like client-server network, peer to peer connection is also a vulnerable
    network form to security attacks. In peer to peer connection, all the devices
    in the network participate in traffic routing across the network. So, it becomes
    easier for the attackers to launch attacks such as denial of service by the use
    of one such device on the network. The software for peer to peer connection acts
    both as the client and the server. This makes P2P network much more prone to remote
    attacks when compared with a client-server network.


    The corrupted data can still be shared on the peer to peer network simply by modifying
    the files which are on the network for the purpose of introducing malware or malicious
    codes.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/f6e39736dfc482245d9c29c4f7c9f146_20_0.png)


    # # Chapter 5: Basic Components of Computer Networking


    Computer networking functions with various components. All the components work
    together and make data transfer possible from one system to another and help in
    establishing a smooth connection between the sender and the receiver. A computer
    network works with one or more than servers, network interface cards or NIC, workstations,
    passive and active hub, gateways, bridges, modem, routers, hub, software like
    OS for networking and many more.


    Server


    It is regarded as the mother of a network. It is the most powerful system within
    a network. In case of LAN, a powerful computer is generally used as the server.
    In computer networking, two types of servers are: dedicated and non-dedicated.
    A dedicated server performs all the services and functions in a network. It helps
    in running the user applications and also helps in improving the overall cost
    of the system. However, in a dedicated'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'server, the users cannot directly run their applications. A dedicated server
    provides the users with sharing of various hard disks, service regarding email
    along with sharing of several other data and resources. It comes with a very fast
    time of response. For all those networks where it is required to handle heavy
    loads, dedicated servers are employed usually.


    In the case of the non-dedicated server, it also functions as a workstation functioning
    as the controller of network. It comes equipped with a prodigious form of memory.
    The network in which this server is used up only a portion of the memory of the
    server. The rest of the server memory is used up for applications of the users.
    It is useful for light traffic load condition.


    # Networking hardware


    Network hardware is those devices which are used for interconnecting the various
    components of a network like the network cards, connection between the servers
    and the workstations and the cables that connect the peripherals to the network.


    # Resource sharing


    These are the resources of both hardware and software devices. The most commonly
    found hardware devices are drives, printers, hard disks, CD drives etc. The software
    resources include programs, applications, files etc.


    # File Server


    The main goal of computer networking is to share information and data among various
    users. The users also make printers, modems, disk drives and other links of communication
    with other client stations as well. The client systems can raise a request to
    access the shared facility from the server. File server runs on a special software
    and is generally served by a powerful system of computer. It helps in sharing
    files and other resources to all the users within a network. File server also
    provides other facilities such as authentication of user, program and security
    data and many more. It generally operates via NOS. All the file server activities
    are controlled and monitored from the console. The prodigious memory of the file
    server is used for caching of files and directories.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Workstation


    Workstation is regarded as a critical component of a network system. It is also
    known as the client system. It comes with the capability of connecting and communicating
    with all other machines in a network. However, for a workstation to function properly,
    it is required to comply with the software and hardware of the LAN. A workstation
    is capable of communicating with the server for getting data and other resources.
    The hardware which is required by the workstation depends completely on the size
    and application of the network.


    # NIC


    Also known as network interface card, it serves as an add-on card for the computers
    in a network. It is also called network interface adapter or Ethernet adapter.
    NIC performs the function of moving the signals across the cables of the network
    into a parallel stream of data directly inside the systems of the computers. You
    can also use more than one NIC for splitting the load in the network.


    # Hub


    It is a centralized point of distribution which is required for transmission of
    data in the network. The hub is generally used for receiving the data packets
    and then rebroadcast them to all the other computer systems which are connected
    with it. It is a passive device in nature. The destination of the received data
    packet is unknown to the hub. Hubs can be easily classified into three categories:


    +   **Stackable and non-stackable:** The stackable hubs are those hubs which can
    be interconnected for making a single hub. The non-stackable hubs cannot be connected.


    +   **Active and passive:** Active hubs are those which connect to the backbone
    of the network. The hubs which only connect with the active hubs are the passive
    hubs.


    +   **Intelligent and non-intelligent:** Intelligent hubs come with a special
    type of firmware which can also be accessed by the workstations which are remote
    in nature. The non-intelligent'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'hubs come without any form of firmware.


    # Bridge


    It is used for interconnecting two different networks by the use of the same technology
    like Ethernet. It reads the address of the destination of the received packet
    and also makes sure that the destination address is also on the similar network
    segment as the origin. In LAN, local bridges are being used for connecting two
    different segments.


    # Gateway


    Two networks which are different in nature can be connected with the use of a
    gateway. It converts the data format which is sent in between the networks.


    # Modem


    It helps in facilitating two-way communication in between a telephone network
    and a computer network.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/f6e39736dfc482245d9c29c4f7c9f146_24_0.png)


    # Chapter 6: OSI Model


    OSI model or Open System Interconnection model is a model which has been created
    for enabling diverse systems of communication for communicating with the use of
    various standard protocols. In simple words, OSI provides a network standard for
    the different systems of computer for communicating with each other. The OSI model
    is also regarded as the universal language for networking. It is based on a concept
    in which a communication system is split into seven different layers each of the
    layers are stacked upon one another. Each layer of the model performs a specific
    function and also communicates with the layers above and below that layer.


    Importance of the OSI model


    The modern internet structure does not follow the structure of OSI model strictly
    but it is still useful for the purpose of network problems troubleshooting. Whether
    it is just one single person who is unable to connect his PC with the internet
    or a huge website which is down that serves thousands of users, OSI model helps
    in breaking down the main problem in layers and also isolates the trouble source.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Seven layers of the OSI model


    The seven layers of the OSI model are stacked in inverted order which means that
    the 7th layer at the top and the 1st layer at the bottom.


    # Application Layer


    This layer is the one which interacts directly with the user data. Various software
    applications like email clients and web browsers depend on this layer of the OSI
    model for initiation of communication. However, it needs to be cleared that the
    software applications of the clients are not a part of this layer. The application
    layer is liable for manipulation of data and protocols on which the software relies
    on presenting data which is meaningful for the user. This layer includes both
    HTTP and SMTP.


    # Presentation Layer


    The presentation layer is liable for data preparation which can be used by the
    application layer on top of it. In simple words, this layer transforms data into
    presentable form so that it can be consumed by the applications. This layer is
    liable for encryption, translation and also data compression. The 6th layer is
    responsible for the translation of incoming data into a simpler syntax so that
    it can be understood by the application layer on top of it. In case the devices
    are communicating with each other over a connection which is encrypted in nature,
    this layer applies encryption to the sender''s end and also decodes the data on
    the end of the receiver so that the data can be presented to the application layer
    in a readable and unencrypted format. It also helps in data compression before
    delivering data to the 5th layer.


    # Session Layer


    The session layer is responsible for the closing and opening of the system of
    communication between two devices in a network. Session is the time between the
    opening and closing of the communication. This layer makes sure that the communication
    stays in the open state till the time before the data exchange has been done.


    # Transport Layer'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'This layer is liable for communication between two devices as an end to end
    communication. This whole process involves data collection from the session layer
    and then breaking them into segments just before sending them out to the 3rd layer.
    This layer on the recipient device is liable for segment reassembling into complete
    data that can be consumed by the session layer. This layer also takes care of
    flow and error control. Flow control helps in determining a normal speed for transmission
    so a sender who is having a fast connection does not deluge the receiver who is
    having a slow connection.


    # Network Layer


    This layer is liable for allowing transfer of data in between two different forms
    of networks. In case both the devices in the communication are functioning on
    the similar network, this layer becomes unnecessary in such case. This layer breaks
    up the segments from the transport layer just above it into various smaller units
    known as packets on the device of the sender and it reassembles the packets on
    the device of the receiver.


    # Data Link Layer


    This layer is very much similar to that of the network layer. The only difference
    is that this layer allows transfer of data between two devices which are on the
    same network. This layer takes in packets from the network layer and then breaks
    them into frames.


    # Physical Layer


    This layer involves all the physical form of equipments which are used in the
    transfer of data like switches and cables. This layer also converts data into
    bit stream in which the string is of 0s and 1s. The physical layer present in
    both the devices needs to agree on the convention of the signal so that it is
    possible to distinguish 1s from 0s in both the devices.'
  merge: -1
  img_proc: true
