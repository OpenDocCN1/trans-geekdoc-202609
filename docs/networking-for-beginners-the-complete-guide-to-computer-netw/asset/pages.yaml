    # # Chapter 10: Circuit and Packet Switching


    ## Circuit Switching


    In the process of circuit switching, the network bandwidth or resources are divided
    into small pieces and a little bit of delay is permanent at the time of establishing
    a connection. The circuit or path which is dedicated between the sender and the
    receiver gives out a proper data rate. All forms of data can be transported via
    the circuit without any form of delay once the dedicated circuit has been established.
    The system of a telephone network is the best example of circuit switching. Time
    division multiplexing and TDM and frequency division multiplexing or FDM are the
    two different methods used for multiplexing various signals into one single carrier.


    +   - **FDM**: It divides the network bandwidth into various frames. It is mainly
    used when various data signals are connected for transmission through a shared
    medium of communication. It is used for dividing the bandwidth into a number of
    non-overlapping sub-bands frequencies. Each of the sub-band'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'frequency carries various forms of signals. It is used in optical fiber along
    with radio spectrum for sharing various signals of independent nature.


    +   - TDM: It divides the network bandwidth into frames. It is used for transmission
    and receiving of independent signals across a common path of signal with the help
    of switches in a synchronized manner at every end of the line of transmission.
    It is used for communication for long-distance links and it can also bear huge
    data traffic load from the end-user.


    # Phases of circuit switching


    In circuit switching, everything is done in various phases.


    +   - Establishment of the circuit: During this phase, a circuit is established
    directly from the end of the receiver across various intermediary centers of switching.
    The sender and the receiver both transmit signals of communication for requesting
    and acknowledging the establishment of the circuits.


    +   - Data transfer: After the circuit has been created, voice and data are transferred
    from the sender to the receiver. The connection stays as long as both the parties
    want to communicate.


    +   - Disconnection of the circuit: Once the transfer of data is finished, the
    connection is abandoned. The disconnection rises from either of both the parties.
    The process of disconnection includes removal of all forms of intermediary links
    between the sender and the receiver.


    # Advantages of circuit switching


    Circuit switching comes with a wide range of advantages.


    +   - It is best suited for transmission of longer duration. It is possible because
    a continuous route of transmission is created which remains in place as long as
    the conversation goes on.


    +   - The dedicated communication path makes sure that there is a steady communication
    rate.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'There are no forms of intermediary delays after the circuit has been established.
    So, it is a great option for real-time communication for both data and voice transmission.


    # Disadvantages of circuit switching


    +   - In circuit switching, a connection is established between two parties. This
    connection cannot be utilized for transmission of any other form of data, no matter
    what is the load of data.


    +   - The bandwidth is required to be very high even if the data volume is low.


    +   - The total time which is required for establishing a connection is high.


    +   - The system resources are underutilized. After the resources have been allocated
    for one particular connection, the resources cannot be utilized for any other
    connection.


    # Packet Switching


    It is a method which is used for transferring the required data to the network
    in the form of packets. The data which is meant for transmission is broken down
    into smaller pieces called packets. This is done for ensuring that the file is
    transferred fast and in an efficient manner directly across the network and also
    for minimizing latency in transmission. All the small data packets are reassembled
    after reaching the destination. A packet is composed of payloads along with several
    information of control. For this, there is no need for reservation or pre-setup
    of the resources.


    The whole process of packet switching uses the technique of store and forward
    at the time of packet switching. While the packets are forwarded, each of the
    packets is stored first and is then forwarded. This technique is very important
    as the data packets might get discarded at any of the hops due to any form of
    reason. There can be more than one path between the source and the destination.
    Each of the data packets comes with the addresses of both the source and the destination
    and thus the packets can travel independently across the network. In simple words,
    data packets of the'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'same file might might not travel along the same path. In case of any form of
    congestion at any of the paths, the packets can choose some different path over
    the existing network.


    For overcoming the all over weaknesses of the circuit-switched network, packet-switched
    network was developed. This is mainly because the circuit-switched networks are
    at all effective for messages of smaller size.


    # Advantages of packet switching


    Packet switching comes with various advantages over circuit switching.


    +   - It is more efficient when it comes to the bandwidth of a network.

    It is because there is no concept of circuit reservation in packet switching.

    - There is very less latency in transmission.

    - It is of more reliable nature as the destination is capable of tracing the missing
    packet.

    - It is more tolerant of faults as the packets can choose any other path if there
    is any congestion in the path.

    - It is very cost-effective and is also cheaper when implemented.


    # Disadvantages of packet switching


    +   - The packets are not delivered in proper order but in circuit switching the
    packets are delivered in an orderly manner as all the data packets travel through
    the same circuit.

    - As the packets travel unordered, each of the packets needs to be provided with
    a sequence number which is time-consuming.

    - The complexity arises at the nodes as the packets can follow several paths.

    - There is delay in transmission because of rerouting of the packages.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - It is not at all suitable for heavy load and is best for small messages.


    # Packet switching and its modes


    +   - **Connection oriented:** Before the transmission starts, it helps in establishing
    a virtual connection or logical path with the use of signaling protocol. The path
    is established between the sender and the receiver and all of the packets which
    are part of this flow will follow this established path. Virtual circuit ID is
    given out by the routers or switches for unique identification of the virtual
    connection. All of the available data is divided into various smaller units and
    the units are affixed with a sequence number. In this, three phases work together:
    setting up, transferring of data and tear down phase. The information regarding
    address is transferred only during the phase of setup. After the destination route
    has been figured out, entry is added up to the table of switching for each of
    the intermediate nodes. At the time of data switching, the local header or packet
    header might might contain other information like timestamp, length, sequence
    number and many others. It is of great use in switched WAN.


    +   - **Connectionless switching of packet:** In connectionless packet switching,
    each of the data packets contains all the relevant and important information like
    destination address, source address, port number et etc. which is not the case
    with connection-oriented packet switching. In this form of packet switching, all
    the data packets are treated in independent form. All the packets which belong
    to one flow might also take up different paths as the decision of routing is completely
    dynamic in nature. So, the data packets after arrival might not be in proper order.


    # Types of delay in packet switching


    +   - **Transmission delay:** It is the time which is taken for putting a'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'data packet into the link. It completely depends on the packet length along
    with the network bandwidth.


    +   **Propagation delay:** It is the time which is required by the bits for reaching
    the destination from the origin. It depends on propagation speed and distance.


    +   **Queuing delay:** It is the time that one job waits in the queue for getting
    executed. It is dependent on network congestion. It is the difference in time
    when the destination received the packet and when the data packet was executed.


    +   **Processing delay:** It is the time which is taken by the routers for processing
    the packet headers. The packet processing helps in the detection of bit-level
    faults that takes place at the time of packet transmission to the destination.'
  merge: -1
  img_proc: true
