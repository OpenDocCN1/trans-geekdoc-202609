    # # Chapter 11: Connection Between the Network Devices


    For the purpose of connecting to a network, the computer systems need to have
    certain components for a seamless connection. Without such components which include
    IP address, subnet mask, DHCP and many others, it will not be possible for the
    system to connect with a network. Each system comes with its unique set of components
    that helps in establishing a new connection.


    # ## IP Address


    The IP address or Internet Protocol Address is the number of identification for
    the network hardware which is connected with the network. When your system has
    an IP address, it can communicate with all the other devices across a network
    based on IP address such as the internet. Most of the IP addresses look like 123.121.52.141.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# What is the use of an IP address?


    The IP address helps in providing a unique identity to the devices in a networked
    structure like the internet. It is somewhat similar in nature to your home or
    business addresses which helps in the delivery of supplies to a particular location
    that comes with an address which is identifiable. All the devices on a network
    can be differentiated from each other with the help of IP addresses. When you
    want to send a gift or package to one of your friends who live in a foreign country,
    you need to know the exact location of your friend. This same process is being
    used for sending data across the internet. However, in place of using a physical
    form of mailing address, the computer systems use DNS servers for looking up a
    hostname in order to find out the IP address.


    For example, when you want to browse a website by entering the URL of the respective
    website such as www.google.com, your request for loading the page is sent directly
    to the DNS servers which find out the hostname for google.com for finding out
    the related IP address. Without the presence of a proper IP address, your computer
    will have no clue what that you are up to.


    # IP address and its versions


    IP address comes in two different versions: IPv4 or internet protocol version
    4 and IPv6 or internet protocol version 6. IPv4 is the older version of IP address
    whereas IPv6 is the latest and the upgraded version.


    +   * IPv4: IPv4 addresses are constructed in such a way that it is capable of
    providing about 4 billion IP addresses which are all unique in nature. Although
    it comes with a huge number of addresses, it is still not enough for the modern
    world of today with various types of devices being used on the web or internet.

    * IPv6: IPv6 can support 340 trillion, trillion trillion addresses which come
    out like 340 with 12 zeros by its side. It means that each and every person on
    the Earth will be able to connect a billion numbers of devices with the internet.


    One of the reasons why IPv4 is being replaced by IPv6 is that the latter one'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'provides more number of IP addresses when compared to the former. When various
    devices are all connected on the similar network, it is very important for each
    of the devices on the network to have a unique address of its own. IPv6 also comes
    with a wide number of added benefits over IPv4:


    +   - There is no collision of IP addresses which is caused by the private addresses

    - It comes with auto-configuration feature.

    - There is no need for NAT or network address translation.

    - It comes with an efficient feature of routing.

    - The administration of the IP addresses is very easy.

    - It comes with in-built privacy for the IP addresses.


    In IPv4, the IP address is displayed as a 32-bit number which is written in the
    format of decimal such as 210.251.165.40 or also 192.251.1.1. As in IPv6, there
    can be trillions of possible IP addresses, it is written in a hexadecimal format
    as 3gge:1500:6565:4:100:f7ff:fe:31:97cf.

    IP addresses and its types


    There are various types of IP addresses that can be found. While all forms of
    IP addresses are constructed of letters or numbers, not all of them are being
    used for the same function. The types of IP addresses are private IP address,
    public IP address, static IP address and dynamic IP address.


    +   - **Private IP address**: This type of IP address is generally used inside
    one network such as any form of a home-based network which is used by Wi-Fi cameras,
    mobile devices, desktop PCs and wireless printers. This type of IP address allows
    the devices to communicate with the central router along with other devices which
    are based on the similar home network which is private in nature. This type of
    IP address can be configured manually or it can also be assigned automatically
    by the network router.

    - **Public IP address**: This type of IP address is used for the outside area
    of a network and it is assigned by the internet service provider or ISP. It is
    the prime address which is used by'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'the business or home networks for communicating with the other networked devices
    all over the world. It helps by providing a path for the home-based devices to
    reach the ISP and therefore with the world outside as well. It allows the devices
    to access various websites and also to communicate with the rest of the computers
    directly along with servers all over the world.


    Both types of IP addresses are either static or dynamic in nature which means
    they change either or not. The IP address which has been assigned by the DHCP
    server is known as a dynamic IP address. In a case a device is not having DHCP
    server enabled or if it does not support DHCP, the IP address needs to be manually
    assigned and in such case, the IP address is called static IP address.


    # Dynamic IP Address


    A dynamic IP address is the one which is assigned automatically to every node
    in the network like desktop PC, smartphone or tablet. This automatic assigning
    of the IP address is done by the DHCP server. An IP address which has been assigned
    by a DHCP server is known as dynamic as it will be changing in the future depending
    on the future connections with the network.


    # Where find dynamic IP addresses?


    The public IP address which is assigned for the router for most of the business
    and home network users by the internet service providers or ISPs is dynamic in
    nature. Bigger organizations and companies try not to connect with the internet
    with the use of IP addresses which are dynamic in nature and prefer using static
    IP addresses which are assigned specifically for them.


    In any form of a local network like the one in your business place or home, where
    private IP addresses are used, most of the devices are pre-configured for DHCP.
    This means that all devices use a dynamic IP address. In case the devices do not
    have DHCP enabled, each of the devices is required to manually set up the network
    information.


    # Dynamic IP address and its advantages'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'One of the prime advantages that come with assigning IP addresses dynamically
    is that it is more flexible in nature. It is very easy to set up and the administration
    part is also easier when compared to static IP addresses. For instance, when one
    of your devices connects with the network, Once the device disconnects from the
    network, the same IP address becomes free and it can be used for another device
    that can connect afterwards, even if it is not the same device again.


    Dynamic IP addresses come with little limitation to the total number of devices
    which can connect with the network and well as the devices which do not require
    to stay connected can easily disconnect from the network and thus freeing up the
    available pool of IP addresses for the other devices. There is an alternative
    in which the DHCP server can pre-configure specific IP addresses for each of the
    devices in a network in case all of the devices want to get connected with the
    network at the same time. In such case, hundreds of networked devices, whether
    they were being used by the users or not have their own specific IP address which
    can easily limit network access for all the new devices in a network.


    # Dynamic IP address and its disadvantages


    It is a very common thing which is acceptable technically as any form of a home
    network to use a dynamic IP address which has been assigned by the DHCP server
    for the router, problem comes up when the user tries to access the same home network
    from any other outside network.


    # Static IP Address


    A static IP address is the one which has been manually configured for a'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'networked device in place of the one which was assigned by DHCP server. The
    name static IP address means that the IP does not change and is static in nature.
    It can be regarded as the complete opposite of a dynamic IP address which changes.
    Phones, tablets, laptops, routers and other forms of network devices which uses
    IP address can be easily configured for having a static form of IP address. This
    can be done by the device which gives out the IP addresses such as a router or
    also manually by typing the device IP address into the device only.


    # Why does static IP address needs to be used?


    You can think of static IP addresses just like your physical home address or your
    email address. Such addresses do not change and they are static in nature. It
    helps in contacting with people or finding someone. Similarly, IP addresses of
    static nature are very beneficial when you are hosting a website from your home,
    having a file server in the network, forwarding network ports to some particular
    device, using networked printers, using any form of remote access program or running
    a server. As static IP addresses never change, all the other devices in a network
    will know how to connect with a device which uses IP address of static nature.


    For example, when IP address which is static in nature is set up for a PC within
    a home network, once the device gets a particular IP address for itself, the network
    router can be configured in a particular way for forwarding all the inbound requests
    to that device directly, like requests for FTP in case the device can share files
    over FTP.


    If you are hosting a website and not using a static IP address for the same, it
    might turn out to be a hassle. This is mainly because when the computer gets some
    new IP addresses, you need to change the settings of the router every time for
    the purpose of forwarding the requests to the new IP addresses. When you neglect
    to do so, anyone can get inside your website as the router will be having no idea
    about which device within the network is serving solely for the website.


    Another great example of an IP address of static nature at work is the DNS server.
    The DNS servers always use static IP addresses for making sure that the devices
    in the network know exactly how to connect with the servers. If they were regularly
    changed, you would also have to reconfigure the DNS'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'servers regularly on the router for using the internet.


    The static form of IP addresses is also very useful when the domain name of the
    device is not accessible. Those computers which connect with the file server within
    a workplace network could also be set up for instance with the server by using
    the static IP address of the server in place of the name of the host. Even if
    there is malfunctioning of the DNS server, the computers in the network can still
    access and connect with the file server by using the IP address. With applications
    that support remote access like the Windows Remote Desktop, using an IP address
    of static nature means that the user can access the computer always by using the
    same address. When you use an IP address which changes frequently, you need to
    know what it has changed to so that the new address can be used by you for establishing
    the remote connection.


    # Disadvantages of static IP address


    One of the major disadvantages that come with static IP address when compared
    with a dynamic IP address is that all of the devices in a network are required
    to be manually configured. All forms of home-based web servers along programs
    of remote access requires setting up the devices with a particular IP address
    and also configure the same properly with the router in order to communicate with
    a particular address. This comes with more amount of work than plugging in the
    router and then allowing it to give the dynamic IP address via the DHCP servers.


    In case a device has been assigned with an IP address like 192.168.1.10, and you
    are going to a completely new and different network which gives out the address
    as 10.x.x.x, you will not be able to connect with your static IP address. The
    device will require to be configured again for the purpose of using a DHCP server
    or for an IP address of static nature that will work well with the new network.


    Security can also be regarded as another downfall when a static IP address is
    being used for a device. When an IP address is used which is never changed, it
    will give the attackers much time for finding out'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'within the network of the device. The only alternative would be to use an IP
    address of dynamic nature which changes and thus it will also make the attackers
    to change the way in which they communicate with that device.


    # Static IP address vs. Dynamic IP address


    A dynamic IP address is exactly the opposite type of IP address than the IP address
    that never changes. Dynamic form of IP address is like any regular IP address
    just like static IP, but the dynamic IP is not tied with the device permanently.
    Instead of using one IP address for a lifetime, the dynamic IP addresses are used
    only for a particular time frame and then returned to the pool of IP addresses
    so that the same can be used by the other devices in the network.


    Dynamic IP addresses can gain in benefits when compared to static IP address.
    In case an ISP kept on static IP address from all its customers, there will be
    shortly a limited IP address supply for all the new customers. Dynamic IP addresses
    provide the solution in which one IP address can be reused by some other device
    when it is not being used by any other device. Thus, providing access to the internet
    for more number of devices than it would have been possible with static IP address.


    The static form of IP addresses come with limited downtime. While the dynamic
    form of addresses obtains a new IP, the user who is connected with the existing
    IP address is removed out of the connection and else has to wait for finding any
    new address. This will not be a recommended setup while we are going to a website,
    service of file sharing or online game, all of these will be requiring active
    connections constantly.


    In case of any local network such as place of business or in home, where you generally
    use an IP address of private nature, most of the devices in this network are configured
    for DHCP. Thus, all the devices use dynamic form of IP address. The public form
    of IP address which is assigned to the routers of the business or home-based network
    is dynamic in nature. Large-sized companies do not use the dynamic address for
    connecting with the internet. Instead of dynamic addresses, they use static IP
    address which is assigned to them.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# How can you get a static IP address?


    Some of the routers of today already reserves and IP address for the devices which
    are connected with the network. This process is generally done with the help of
    DHCP reservation and it performs by linking a specific IP address with the MAC
    address so that every time device requests the router for IP address, the router
    can assign the one which has already been chosen by the user with that particular
    MAC address. When you want to get a static IP address for your business or home
    network, you can do it by contacting your ISP but this option varies depending
    on the company that provides you with the internet. Having a static IP address
    for home-based and other local network is quite expensive when compared with getting
    a dynamic IP address.


    # Faking static IP address by using dynamic IP address


    As getting a static IP address for your home or business network might turn out
    to be very expensive than a regular dynamic address, the best option is to opt
    for both forms of IP addresses by using dynamic DNS service or DDNS. The service
    of DDNS associates a changing form of a dynamic IP address with the hostname that
    does not change as well. It is exactly like having your very own static form of
    IP address without even paying anything extra than a dynamic IP address.


    No-IP is an example of a free DDNS service. You can use this for redirecting your
    required hostname for associating with the present IP address. In simple words,
    if you are having a dynamic IP address, you can access the network by using the
    exact same hostname. DDNS service is very helpful when you are required to access
    the home-based network remotely but you do not want to pay more for static IP.
    You can also host your personal website from your home and use up DDNS for ensuring
    that the visitors of your website can have access to the network any time they
    want.


    # DHCP Server


    A DHCP server is nothing but a server of the network which provides and assigns
    the IP addresses automatically along with default gateway and various other parameters
    of a network for the devices of the clients. It is dependent on the standard protocol
    which is called DHCP or Dynamic Host'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Configuration Protocol for responding to the queries of the clients regarding
    broadcasting. The DHCP servers send out necessary parameters of the network automatically
    for the clients for establishing proper communication with the network. Without
    the presence of a DHCP server, the administrators of a network need to set up
    manually each and every client who joins with the network. This might turn out
    to be a cumbersome process, especially when large networks are involved. The DHCP
    servers assign each of the clients with one unique IP address of dynamic nature.


    # Benefits of DHCP server


    A better option than using DHCP on the switch or router is to have a centralized
    server of DHCP. This is true in case of network environments which requires support
    from both DHCP for IPv4 and DHCP for IPv6, both at the same time. DHCPv6 comes
    with various benefits.


    +   - When you DHCPv6 server which is also integrated into the system of IPAM
    for IPv6, it will provide you with the visibility of all the client nodes of IPv6.


    +   - The DHCP servers also provide management and logging of interfaces which
    aids in managing the scopes of the IP addresses by the administrators.


    +   - DHCP servers also provide high availability along with redundancy. In case
    one of the DHCP servers fails to perform, the clients in the network will be preserving
    their present IP addresses and will not lead to any form interruption for the
    nodes at the end.


    # Why should you use a router as DHCP server?


    Most of the switches and routers have the capability of providing the following
    server support for DHCP:


    +   - DHCP client and obtaining an IPv4 address interface from an upstream service
    of DHCP.'
  merge: -1
  img_proc: true
