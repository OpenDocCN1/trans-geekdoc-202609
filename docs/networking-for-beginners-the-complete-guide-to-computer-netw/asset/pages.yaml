    # Routing Configuration


    # OSPF


    Also known as Open Shortest Path First protocol, is a form of link-state routing
    protocol which helps in finding the best path between the destination and the
    source router by using its own shortest path first. OSPF protocol has been developed
    by IETF as an IGP or interior gateway protocol which is the protocol for moving
    the packets within a very large system of autonomous nature or domain of routing.
    It acts in the network layer and works on the protocol number 89.


    # Terms of OSPF


    +   - Router ID: It represents IP address on the router which is the most active
    of all. The highest address of loopback is considered at the first place and in
    no form of loopback has been configured, the IP address which is the highest active
    within the interface is considered.


    +   - Router priority: It is a value which is assigned to the router which is
    operating OSPF. It is 8 bit in nature and helps in electing BDR and DR within
    a broadcast network.


    +   - DR or designated router: It is elected for minimizing the total number of
    adjacency which has formed.


    +   - BDR or Backup designated router: BDR acts as the backup of DR within a broadcast
    network. Whenever DR performance goes down, BDR assumes the role of DR and starts
