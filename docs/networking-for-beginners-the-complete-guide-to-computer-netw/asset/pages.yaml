    # Chapter 9: Network Mode Security


    The algorithms of network security have gone through various changes along upgrades
    since the year 1990. It has turned out to be more effective and secure in nature.
    Today, various types of protocols have been developed for the protection of home
    wireless networks. The most common protocols are WPA, WEP and WPA2. All of these
    serve a similar purpose but differs from one another in some aspects. Wireless
    protocols for security not only helps in preventing unwanted people from connecting
    to the network but it also helps in encrypting the data which is sent via the
    airwaves.


    # WEP


    All known as wired equivalent privacy, it was developed for the security of wireless
    networks and was accepted as a standard in the year 1999. WEP was expected to
    offer the same kind of security level just like wired networks but there are various
    issues in security in this protocol. It is very easy to break the security and
    is also very hard to configure the same. Despite all the upgrades which have been
    applied to WEP, it is still a very vulnerable form of security protocol.'
  merge: -1
  img_proc: true
