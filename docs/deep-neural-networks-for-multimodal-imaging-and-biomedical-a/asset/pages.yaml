    x<sub>n</sub> = \(\sum_{i=1}^{n} w_i x_i\) (1)


    The output function z of the weighted sum is known as activation function, z =
    f(s) + b, where b is known as bias parameter (see Eq. (2)) (Hinkelmann, 2016)


    z = b + \(\sum_{i=1}^{n} w_i x_i\) (2)


