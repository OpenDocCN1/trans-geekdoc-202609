    2017). The first process involved in machine learning is to refine the data supplied
    by the IoT. Numerous data arises from several sensors implemented under the IoT
    platform in varying environments. The correlation among the data is identified
    with the machine learning process and its main task is to mine the necessary data
    by having meaningful insights from those occurred variables and transit them for
