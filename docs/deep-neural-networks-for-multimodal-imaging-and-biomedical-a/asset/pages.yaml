    # KEY TERMS AND DEFINITIONS


    **Ambient Assisted Living:** AAL provides an effective IoT platform governed by
    artificial intelligence algorithms, thereby satisfying the reliability metric
    in monitoring patient’s health in their place of living in a safe manner. The
    AAL system includes activity monitoring of patients which is important for patient
    suffering from Alzheimer’s disease, bedsore, diabetes, and osteoarthritis.


    **Intelligent Information System:** An intelligent information system is said
    to be the set of software and hardware that involves the skilled people for the
    process of decision making and co-ordination among the organization.


    **Machine Learning:** A sub-branch of AI is said to be the Machine Learning (ML)
    technology, which involves the system to learn from the occurred data that does
    not need any explicit programming applied in the field of imaging.


    **Rational Decision Making:** Rational decision making is said to be a crucial
    process unlike several other sectors, which offers certain provisions to the community.'
