    # SMART BATTERY FOR BIOMEDICAL WEARABLE APPLICATIONS


    In Biomedical wearable devices power battery management system is the most important
    task, which is necessarily carried out to prevent the battery over-charging and
    over-discharging. The performances of the batteries are mainly decreased due to
    the aging, elevated temperature and cycling process due to the exchange of ions.
    Lithium ion batteries is the most used battery component and the battery that
    promotes high capacity, safety and long life is the lithium iron phosphate (LiFePO4)
    and the charging method mostly adapted is the current charge- constant voltage
    method (CC-CV). Therefore in the monitoring process, temperature, total current
    and voltage are regularly monitored. The cycle count of the batteries is determined
    by the depth of discharge (DoD) and longer the DoD minimizes the lasting period
