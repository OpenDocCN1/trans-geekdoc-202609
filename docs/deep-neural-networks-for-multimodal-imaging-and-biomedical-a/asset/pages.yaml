    # ABSTRACT


    Electronic health records (EHR) have been adopted in many countries as they tend
    to play a major role in the healthcare systems. This is due to the fact that the
    high quality of data could be achieved at a very low cost. EHR is a platform where
    the data are stored digitally and the users could access and exchange data in
    a secured manner. The main objective of this chapter is to summarize recent development
    in wearable sensors integrated with the internet of things (IoT) system and their
    application to monitor patients with chronic disease and older people in their
    homes and community. The records are transmitted digitally through wireless communication
    devices through gateways and stored in the cloud computing environment.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# INTRODUCTION


    Healthcare system faces tremendous challenges but with the developments made in
    the healthcare systems, many residents are living a healthy and safe life with
    the normal health condition in many industrialized countries. Several people around
    the world face severe health condition, among them 285 million visually-impaired
    persons are also living worldwide, says the World Health Organization (WHO). Though
    the healthcare reform with their monitoring facility hasn’t yet reached many people,
    within a few upcoming years 32 million newly insured people who face severe trauma
    also tend to use this facility and they could also gain their maximum benefits.
    According to the information of the World report on disability, more than one
    billion people are found to have a certain disability with 150 million schools
    that are operated to train the disabled children (Renier and De Volder, 2010).


    Body-wearable sensor network has increased due to the development made in the
    wearable embedded system technologies with the remote monitoring of human activities
    and health (Perkins, Da and Royer 2000). This system improves the quality of life
    by promoting the promising solution that smooth the progress of independent living
    and even save people from sudden risk (Intanagonwiwa, Govindan, Estrin, Heidemann
    and Silva 2003). Daily physical activities and exercises are all monitored with
    the simple smart phones fixed with the motion sensors or with the help of pedometers.
    Numerous benefits are gained by the use of wearable devices within the home as
    well as the community. The long term monitoring of patient health with the gathering
    of physiological data could lead to the improvement in diagnosing and treating
    the heart patients (Manjeshwar and Agarwal, 2001). Through this technology, the
    drawbacks of the available technology could be neglected that includes the recording
    of rare occurring instances in the diagnosis. Patients suffering from motion disorder
    also have a huge impact on clinical management in-home monitoring. For instance,
    the severity of rigidity, bradykinesia, akinesia, and dyskinesia could be avoided
    by monitoring the symptoms of Parkinsonian disease and thereby facilitating medication
    titration (Gietzelt, Wolf, Haux, 2011). It is necessary to provide field monitoring
    to the patients suffering from Parkinson disease. But certain technical limitations
    tend to stop the methodologies adopted by the clinical applications. From the
    year of 1990, researchers tend to work hard in implementing a technology adapted
    towards the growth of in-home monitoring of patients through wireless technology
    and e-textile methods (Malhotra, 2005). For these technologies, small sensors
    with the operating systems dedicated to the miniature-sized devices available
    with low-power radios had been developed with the sensor network. So many miniature-sized
    devices are used today and they also create a huge impact with the growing technologies.
    Generally, the people with disabilities are categorized with these groups: 1)
    Mobility impairments - persons, who do not have to ability to interact with the
    physical world, manipulate the object and they cannot move freely. 2) Visual impairments
    – People with low vision ability or they could not view anything (Sánchez and
    Elías, 2007). 3) Hearing impairments – People who face difficulty in detecting
    the sound and they could adapt only sign languages. 4) Cognitive impairments:
    People suffering from dyslexia, dementia, autism etc. Such people face difficulty
    in learning, understanding and gaining knowledge and also lacks with their perception.
    Many changes had been determined in the past decades for helping the disabled
    people of our society. Moreover, these standards and legislations bought had made
    many changes with the discrimination made against the disabled people to participate
    entirely with their education, community and employment (Heinzelman, Chandrakasan
    and Balakrishnan, 2000). Several sensor-based devices have been developed to help
    disabled people, thereby making their lives easier. This could be termed as the
    assistive technology, which guides the disable people in meeting their social
    aspects. This technology does not tend to operate by its own; rather it requires
    the consider-'
  merge: -1
  img_proc: true
