    could also be used as an information processing units that are integrated with
    the GPS tracking system that determines the location of the patients in case of
    emergency situations. The storage could be done in the cloud-based platform (Udendhran,
    2017).


    Sensium is another low power sensor interface that could also be used for monitoring
    the health of the patients. Several parameters such as heart rate, skin moisture,
    temperature, regular energy disbursement etc, could be monitored by using smart
    bands fitted with the appropriate sensors. This usage of wearable devices helps
    in enhancing the diversity of the system. Moreover, this system should also be
    sufficient and suitable for the users. Monitoring physical body is necessary and
    this also envelops the use of wearable devices by storing and processing the data
    collected by those devices. The connection is also made among the mobile and the
    home appliance devices that could disable the TV remote if sufficient user does
    not perform any activity for a period of time (Li et al. 2005). This activity
    performance is monitored by accelerometers and through this progress; the health
    of the human body could be increased. Photoplethysmographic sensor implemented
    in the form of a ring could be capable of providing the data related to the heartbeat
    rate and also the oxygen content in the blood and the data is transmitted to the
    base station wirelessly (Miao, Djouani, Kurien and Noel, 2012). Moreover, this
    sensor is also fitted as the earpiece and positioned around the outer ear that
    consists of light-emitting diodes. In-ear sensors are capable of transmitting
    the heart rate data that could be enhanced in the future for monitoring the oxygen
    content in the blood.


