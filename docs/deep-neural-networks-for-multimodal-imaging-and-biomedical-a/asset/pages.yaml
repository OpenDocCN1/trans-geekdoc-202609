- pgno: 238
  md: 'sensors could be integrated with the Leaf Node or IoT End Point that in turn
    communicates with the back-end server, which is shown in the figure 1. IoT protocols
    such as MQTT, CoAP are used in the communication of IoT End Point with the back-end
    server. The backend server helps in the performance of intensive tasks computation.


    The main focus will be with the edge computing that could send notifications to
    the IoT End Point, which is managed by the MQTT client. On the other hand, the
    cloud environment supports the MQTT server, thereby creating a transport protocol
    that leads to the IoT End point and the data server communication. As mentioned
    earlier, for the real-time data analysis, cloud computing will not the sufficient
    environment due to the high network latencies (Anagnostopoulos et al. 2015).


    This extends the idea to the edge computing architecture, where the edge point
    device guides the computation of the endpoint device through the data collected
    from the cloud servers. The bill gets fixed by the MQTT protocol. Instead of IoT
    protocol, CoAP could also be used in this process. The main role of this infrastructure
    is to combine the machine learning concepts along with the IoT and cloud and thereby
    concentrating on the edge computing techniques in the healthcare domain.


    # DEMYSTIFYING IMAGE PROCESSING IN HEALTHCARE


    Image processing concept plays a major role in the healthcare industries. Strategies
    based on the Adaptive intervention had found its way in detecting breast cancer
    with the mammography screening test and also with the treatment of AIDS (J. Sametinger
    et al. 2015). But there is a scarcity of randomized trials that have employed
    dynamic treatment protocols, due to the historical lack of theory for the design
    and analysis of such a trial. The issues of sample size calculations with the
    randomization have been dealt recently with the better insights. The Bayesian
    framework discussed in deals with the multicenter design considerations and adaptive
    randomization of sequentially randomized trials (S.E Kahou et al. 2016). Sequentially
    randomized trials within the person mental illness and its theoretical innovations
    are dealt in and regarding cancer. With certain trials, these protocols are not
    considered to be sequential in nature but are rather considered to be a separate
    trial. Sequential decision problem are handled with the conventional backwards
    induction method, which is also known as Dynamic Programming (K. Wac et al. 2009).
    All the covariates of longitudinal distribution should be necessarily modeled
    in the dynamic regimes context. Treatment could be recommended incorrectly with
    the misspecification of the distribution due to the limited knowledge of this
    model. Methods do not have any such type of limitations. The time-varying covariates
    are adjusted with the optimal treatment discontinuation time through causal approaching.
    Analyzing sequentially randomized trials has been done in with the likelihood-based
    approach for the optimal regimes prostate cancer regions (K. Xu et al. 2016).
    Here the probabilities are taken from the information collected from the patient.'
  merge: -1
  img_proc: true
