    reduces when the patient wears the accelerometer in the foot instead of waist.
    This is due to the tuning of the device based on the waist motions. This could
    lead to overestimation or under-estimation of patient''s calorie value.


    One of the most commonly used motion sensors is the accelerometer that could be
    used in several applications such as game controlling, activity discovery, fall
    detection, device orientation etc. This system could be integrated with the machine
    learning algorithm that could be comprised of 2 phases: unsupervised activity
    discovery and supervised location estimation. According to (Vahdatpour, 2011),
    the unsupervised technique discovers the activity based on the frequency and consistency
    during the long time interval. Once the activity had been discovered, then supervised
    classification technique could be used for analyzation. In [9], support vector
    machine (SVM) is used to detect the location of the device based on the time interval
    and frequency properties. The most frequent activity discovery had developed an
    interest in the research community. Two steps are generally considered in the
    discovery of most frequent activity. First, frequent patterns are determined by
    analyzing the accelerometer data separately for obtaining each individual dimension.
    Binning approach could also be used to determine the similar patterns in the single-dimensional
    accelerometer data. Second, clustering approach is used for grouping the classified
    patterns to form the activity data. SVM approach is used to detect the loca-'
