    # CONCLUSION


    In recent years, research on convolutional neural networks has been rapidly developed
    and conducted to improve CNN''s performance in vision-related tasks. In this paper,
    we have studied CNN extensively among all the different types of DNN, or provided
    insights into the improvements and changes made to the topologies of various deep
    CNN architectures. (Depth, width, multiple path ...) which are trained on the
    database ImageNet. In the recent literature, it has been observed that the first
    CNN performance improvements were obtained because of the use of small filters,
    and the increase in channel numbers. The increase of the precision, the reduction
    of the size of the convolution filters is more favorable since it makes it possible
    to reach a level of precision a little high with an additional advantage related
    to a low complexity of computation and parameters compared to the same one architecture
    that uses a higher convolution filter size. This is what we can see from the comparison
    between AlexNet (Y. LeCun, 2015)and ZFnet (Matthew D Zeiler, 2013). It is noted
    that despite the use of small size filters and its simplicity, VGGNET requires
    a high cost of calculation and a heavy calculation load (VGG16: 138 M, VGG19:
    140 million parameters). After the release of ResNet (Alex Krizhevsky, 2012) in
