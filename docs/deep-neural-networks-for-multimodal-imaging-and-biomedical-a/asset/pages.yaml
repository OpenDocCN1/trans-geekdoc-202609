    # CONVOLUTIONAL NEURAL NETWORKS


    CNN is a class of DL, applied to analyzing visual imagery. A CNN learns from the
    filters and thus requires little preprocessing. The term “fully-connectedness”
    of the networks makes them prone to overfitting data. CNN have wide applications
    in image and video recognition, image classification and medical image analysis.


    # Two Main Applications of CNN


    The key applications of CNN are Image classification and segmentation.


    # Image Classification


    In classification, a given image is shrunk and made to go through all the convolution
    layers to fully connected layers, which generates one outcome, a predicted label
    for the input image. Here, the given image is downsized only to get a single predicted
    outcome.


    # Image Segmentation


    A digital image is divided into multiple parts is referred as segmentation; the
    aim of segmenting any image is to extract more deep weighted information. A label
    is allocated to each pixel on segmentation so that every pixel of similar characteristics
    holds same characteristics.


