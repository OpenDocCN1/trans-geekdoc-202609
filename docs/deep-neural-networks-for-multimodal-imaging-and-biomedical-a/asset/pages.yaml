    it could also damages the functioning of the battery systems. Therefore, it is
    required to have a proper Battery Management system (BMS) thus maintaining a reliable
    and safe operation for the battery systems [11]. The primary functionality of
    the BMS system is to provide with a amount of energy that has been utilized by
    the load, in order to know the regular status of the system. Since the internal
    resistance and the capacitance of the battery changes with the time, this is determined
    to be a difficult task. The series-connected battery cells could cause certain
    unbalancing issues that could be a problem in extending the lifetime of the system,
    which should also be considered in the BMS system. This could also minimize the
    battery usable capacity as the low charged cell obtains the end of the discharge,
    though certain amount of energy are stored in the other battery cells. Lithium
    ion batteries have a strict voltage limits that still limits the self-recovery
    of the charge imbalance and it also declines with time. If a single cell from
    the battery stack has reached the upper limit then it stops the charging process
    thus making other cells of the battery uncharged. Assuming the cells to have the
    same capacity (only a few percent of mismatch could be limited), cells that is
    of varying discharge rate could cause charge imbalance [12]. This could be dealt
    and obtained by the temperature gradient implemented along with the battery stacks.
    Therefore, charge equalization technique should be adapted by the BMS system to
    manage and restore the balanced state.


