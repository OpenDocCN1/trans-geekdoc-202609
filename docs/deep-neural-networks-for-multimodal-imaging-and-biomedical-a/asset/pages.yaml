  md: '# INTEGRATING EDGE COMPUTING AND MACHINE LEARNING FOR HEALTH CARE APPLICATION


    In hospitals, a cloud infrastructure of Azure IoT Edge gateway (Linux server)
    could be registered with the Azure IoT Hub. Pipeline could be configured in the
    form of JSON file in the IoT Hub. For instance, the communication among the devices
    could be done with the data ingest container and the ML model shows the output
    (E. MacIntosh et al. 2016). The right container will be chosen from the container
    register that is handled by the edge devices, which is deployed by the JSON edge
    configuration file. Apple Company also introduces their version of AI integrated
    smart phone in iPhoneX with the new A11 Bionic chip (E. A. Oladimeji et al. 2011).
    Probably, many smart phones had been implemented with the AI technology, especially
    for the speech recognition, which enables digital assistants.


    Moreover, this technology had been empowered by the cloud environment. In future,
    neural engine with several machine learning algorithms will be implemented in
    the smart phones and this heads the industries to the higher level (Frank Alexander
    Kraamer et al. 2017). Asserts leading to the misuse of cloud should be considered
    at the premature state. However, AI leads the way and has a real impact on everyday’s
    life. Increase in the process tends to adapt the latest technology and this could
    also lead to cost savings with the role of edge technology with the decreased
    latency (G. J. Mandellos et al. 2009).


    In healthcare application, a good IoT framework should intelligently prioritize
    and use the network resources with the trusted and secure channel. This could
    be possible by effectively preprocessing the input data retrieved from the sensor
    nodes. This could be done by connecting the leaf devices with the cloud servers
    at the back-end. These cloud servers has the capability to access heavy computational
    resources from which the incoming data could be prioritized and sends the information
    to the end point device.


    The signatures could be extracted from the incoming data with the data mining
    and machine learning concepts applied at the back-end. Thus with the captured
    data, the medical interpretation could be made. The health condition data of the
    patient will be displayed at the front-end. In this concept, edge computing plays
    a role in avoiding the high latencies of decisions in cloud.


    The computations will be done at IoT or at the “edge” of the network rather than
    making every decision at the cloud environment. Several sensor nodes such as ECG,
    EMG, EEG, Temperature and SPO2


