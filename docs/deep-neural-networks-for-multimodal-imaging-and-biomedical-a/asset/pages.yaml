    Recurrent neural networks (RNNs) are another type of AI network which is used
    for sorting the data received from CT,cine MRI and ultrasound images. RNNs should
    be able to remember the past and process knowledge on image received from background
    history to progress its existing decision. For example, given a series of images,
    RNN practices the first image as input, catches the information to make a forecast,
    and then remember this information which is then appropriated to estimate the
    next'
