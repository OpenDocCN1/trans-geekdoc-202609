    the sensor-based health monitoring devices with the technologies adopted by the
    system and the way these devices are integrated into an IoT environment with the
    cloud-based storage (Hoang and Chen, 2010).


    # BACKGROUND


    Wearable system with the miniature-sized sensor with the microcontroller-based
    electronic device plays a significant role in today’s technology. The problem
    arises with the sensing technology is due to the data transmission and gathering
    by the small-sized sensor and an electronic circuit that causes difficulty for
    adapting to a long-term monitoring environment. Recent advancement had made a
    way, by adding up with amplification circuits, radio transmissions and advanced
    in microcontroller functions.


    The circuit allows the system to gather the physiological data and transmit them
    wirelessly with a low-power radio to the data logger system. Micro Electro Mechanical
    System (MEMS) is the advancement in developing miniature-sized inertial sensors,
    which had been widely adopted in health status monitoring and motor activity systems.
    The reduction in the size of the sensor could be achieved by the batch fabrication
    process and techniques. Microelectronics tends to achieve an integrated System-on-Chip
    facility by adding microprocessor and other radio communication devices under
    a single circuit (Sichitiu, 2004).


    E-textile is another advancement that had been bought with the sensing systems
    and circuits into garments. The electrodes could be weaved into the garments of
    the users at the appropriate positions (electrocardiograph and electromyograph)
    and gather data by printing conductive elastomeric-based components on the fabric
    and sense the resistance to stretch associated by the fabric while the subject
    is making some actions (Akyildiz, Su, Sankorasubramanioam and Cayirci, 2002).
    Advancement in weaving garments with electrodes could improve the technology to
    print the entire circuit board onto a fabric. Sensor networks integrated with
    the wireless communication protocols could be limited body-worn or integrated
    body-worn with ambient sensors. This body-worn sensor system is also known as
    a body sensor network previously, was composed of several wires for transmitting
    data that should be necessarily placed into the pocket of the user (Antiochia,
    Lavagnini, and Magno, 2004). Moreover, this system made a huge disadvantage for
    not making a long-term monitoring system. This had been further advanced with
    the advancement of Bluetooth, IEEE 802.15.4/ZigBee and other tethering systems.
    Standard IEEE 802.15.4/ZigBee based on the Ultra-wide-band (UWB) impulse radio
    is said to be a high data rate sensor network, which consumes less power and also
    low in cost. It also produces high accuracy with the location estimation. Many
    monitoring application requires the gathered data to be sent'
  merge: -1
  img_proc: true
