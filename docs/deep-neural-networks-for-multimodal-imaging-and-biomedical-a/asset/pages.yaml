    from the bio-analytical system that requires reagent for processing. Moreover,
    a bio probe is different as it should be discarded after a single measurement".
    A biosensor is composed of 2 main elements:


    +   1) A bio-receptor for determining the analyte such as antigen, enzyme and
    complementary DNA, which is said to have immobilized sensitive biological element
    (antibody, probe or enzyme) (D’Souza, 2001).


    +   2) A transducer element that is capable of converting a chemical signal into
    an electrical parameter based on the interaction with the bio-receptor. The generated
    signal intensity will be directly or inversely proportional to the analyte concentration.


    Based on the signal transduction, the biosensor may be classified as optical,
    electrochemical (Riv and Pedano, 2006), piezoelectric and thermal sensors. The
    conductometric and potentiometric sensor'
