    easily with the AI technology, which could be treated for them from spreading
    to other cells. Extranodal extension (ECE) of cancers could be detected only during
    the surgery that has poor prognosis.


    ECE could be identified with the potential algorithm at the earlier cases that
    does not lead to the surgery, thereby promoting betterment in the treatment lamination.
    Automatic detection and classification of ECE could improve the radiotherapy targeting
    of nodal basins and also optimizes the treatment for post-operative imaging-detected
    nodal disease (Kohli, Summers and Geis, 2017). AI also helps in detecting cancer
    from several parts that include colorectal, head, neck, cervical and abdomen.
    The cancer outcomes with the minimized morbidity could be promoted by the AI approach,
    though the approach has not yet proven with the real-time outcomes.


    The above mentioned use cases requires high understanding and study, in order
    to test the images with the AI tools though the medical images could be readily
    applied with the Artificial Intelligence. Decision making and diagnosis supplementary
    with AI offers the patients as well as the radiologist in having the clear visual
    insights of the injuries, diseases and conditions, which may be difficult to detect
    with the conventional tools.


    # Hidden Risks and Dangers


    Development of AI products and their use in radiological practice is still in
    developing stage. In usage of machine learning based algorithms in medical imaging,
    the known and unknown risks are more. It is difficult to identify the problems
    in existing methods compared to the earlier methods with lack of basic knowledge
    in machine learning techniques (Clark et al. 2013). To understand the process
    and to conclude the process whether it is correct or wrong, one should have the
    basic knowledge on computer science, statistics and deep learning. This can also
    be compared with the basic medical physics knowledge of radiologists. For example,
    in MRI machines and MRI related studies, radiologist’s training is associated
    with physical principles so that the machine learning principles should also be
    considered in training.


    # Quality and Validation of Data


    In training and testing of data in deep learning, there will be more amount of
    data needed. To order those data in an order, it consumes more computer power
    and it is labor oriented. Restoring and detecting the right data is not easy if
    it is not managed in good manner. Additionally, it also focuses on volume and
    technical quality of data which is carried out from earlier stage. While training
    the datasets, some abnormalities should be avoided which includes motion artifacts,
    image noise, beam hardening, partial voluming. For example, the algorithm will
    underachieve if it does not include the contrast phases in'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'detecting hepatocellular carcinoma in CT or MRI. The validation of supervised
    learning process will be based on gold standard (usually a diagnostic test or
    benchmark that is best available under reasonable condition). The algorithm depends
    on mainly on quality of the gold standard test but there is no complete standard
    for obtaining such gold standard.


    # Data Security and Privacy


    Some privacy, security issues regarding management and interchange of patient-related
    data should not be rejected. Securing patient data is tedious but it should be
    highly confidential since more smart algorithms are there for mining patient information
    in database and used in mishandling for other mischievous purposes or commercial
    earnings. The clients have the right to own their data and also have the power
    to make certain modifications, which is considered to be “privacy by design” law.
    Without an AI provider, hospital cannot share data spontaneously by giving patient
    ownership and control over data (Van Leemput, Maes, Vandermeulen and Suetens,
    1999). The term confidentiality and privacy are related to one and another but
    they cannot be interchangeable. The right of individuals to have their control
    on their health data and information is referred to be ‘data privacy’. The accountability
    of the trusted data in maintaining privacy is considered to be ‘confidentiality’.


    # Ethics and AI


    Still machine learning approach in medical imaging field is in the developing
    stage and it requires the complete knowledge of the radiologists and physicians
    regarding AI tools in the upcoming generation so that it will avoid the ethical
    challenges and also promotes awareness in implementing AI with health care. When
    the decisions made by the doctors are mistaken then there arises a question regarding,
    “Who will be responsible for dealing with the fault analysis?” “What if the doctor
    accepts the diagnosis report of a patient that has been produced as a false analysis?”
    “What if the machine makes life-threatening errors due to its malfunctions and
    causes the death of a patient?” With the help of autonomous AI-based systems,
    transformation could be made in the decision-making field that impacts both the
    doctors and the patients in knowing the disease earlier and also gaining sufficient
    treatment in the earlier stage (especially in the cancer diagnosis). The intelligent
    autonomous based system should be ahead above the conventional radiologist system
    that advances the suitable treatment offered to the patients. Three main categories
    dealing with the machine learning system based on the ethical issues:


    +   - Ethics related to data

    +   - Ethics related to algorithm

    +   - Ethics related to practice


    # CONCLUSION


    The question arises regarding, “Why the radiologist must consider the use cases
    of AI?” Generally, a computer science expert gains the basic knowledge in operating
    a machine and provides proper training for the computers to process images but
    still they do not have significant knowledge in selecting the relevant part for
    which the study is to be carried out. This knowledge will be completely obtained
    by the'
