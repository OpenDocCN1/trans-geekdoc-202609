  md: 'to the hospital server of the nearby locality for analysis. Smart phones and
    personal computer forms an information gateway serves this purpose. Many developed
    countries have already achieved universal broadband connectivity. The monitored
    data could be communicated from the personal computer or smart phones through
    the internet (Asada et al. 2003). The patient could also be monitored outside
    the home environment with the mobile communication standards (4G and 5G) that
    promotes pervasive and continuous healthcare monitoring facility. Monitoring through
    smart phones has a huge impact due to the growth of market value and it seems
    to grow annually with 220 million units shipped by the year 2010 (Rao, Sundararaman,
    Parthasarathi and Dhatri, 2010). Due to their “ready to use” platform, smart phones
