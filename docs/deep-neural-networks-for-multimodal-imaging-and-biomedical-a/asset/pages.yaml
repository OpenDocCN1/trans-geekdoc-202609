    around the site could be quite challenging task. Detecting the abnormal trauma
    condition with the X-ray examination is not sufficient and it requires comparison
    with certain other progressive examinations and the delay. These examinations
    could also cause delay in the treatment of diseases.


    Radiologist could also gain advantage in reducing the patient''s risk, false negative
    rate and also the medical legal risk with the involvement of AI tools. Patients
    under high risk situation could be segregated for high serum Cobalt levels and
    they are moved to MRI imaging for other supplementary analysis.


    Neurological disorder disease identification and diagnosis: Amyotrophic lateral
    sclerosis (ALS) is said to be a serious nervous system disease that tends to weaken
    the muscle and also impact the physical condition. ALS is considered to be a death-dealing
    neurological situation for a patient and there is no cure for the disease to be
    treated (Rueckert et al. 1996). When such situation is identified at the earlier
    cases, then treatment could be provided for the disease to get controlled promoting
    long term tolerance.


    It is necessary to define the situation among PLS and ALS. Primary lateral sclerosis
    (PLS) falls under the category of motor neuron disease, which makes the nerves
    among the brain to break down slowly. PLS also causes a heavy fragility among
    the voluntary muscles that helps in functioning of legs, hands and tongue. Through
    the proper analysis condition the depth of the disease could be identified. It
    is the work of the radiologist to identify whether the obtained lesions are pertinent
    or it simply imitates any other disease structure that leads to the false positive
    value, which is assumed to be the most happening cases in the field of radiology.
    In this chapter, the use cases of AI in several medical imaging modalities had
    been explained. Current articles promote the insight of AI integrated with the
    radiology and more than 50% of the articles deals with the data collected from
    the Computed Tomography (CT) and Magnetic Resonance Imaging (MRI). The application
    mainly concentrated on the cardiac, thoracic, trauma, muscle injuries and fractures
    and finally with the detection of breast cancer. Advances in technology arise
    day by day. An advancement from AI is said to be Machine Learning and other evolution
    deals with the Deep learning is the other evolving technology that is known to
    be a subset of machine learning in AI, which is composed of several networks capable
    of learning from the obtained data that may be unlabeled or unstructured (unsupervised).


    Detecting new biomarkers is the main focus in current research area by enhancing
    the accuracy as well as the seed of the diagnosis. Recently valuation in motor
    cortex that includes Quantitative Susceptibility mapping (QSM) and manual segmentation
    consumes more time and also seems to be very challenging. Propitious biomarker
    in the imaging field could be developed by the automation of the above methodology
    with the machine learning techniques. The image relevant to ALS or PLS could be
    obtained by the machine learning algorithm very accurately with the clear indication
    of susceptible risk area provided in the form of a clear image. Efforts of the
    radiologist will also be reduced by automatic report generation thereby reducing
    the workflow.'
