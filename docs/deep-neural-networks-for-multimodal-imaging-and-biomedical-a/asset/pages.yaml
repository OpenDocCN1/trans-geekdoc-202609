  md: '# Eggshell


    Fresh eggshell consists of a typically three-layered structure; the foamy cuticle
    layer on the outer surface resembles a ceramic; the middle layer is spongy; the
    inner layer consists of lamellar layers. It represents almost 11% of the egg total
    weight. Calcium carbonate (calcite) is the main component in eggshells and is
    the major inorganic substance found in an egg and it makes up about 94% of chemical
    composition of eggshell.


    Aggregates passing through 4.75 mm sieve and predominately retained on 75 µm sieve
    are classified as fine aggregate. Finely grinded eggshell is used as fine aggregate
    is used as a partial replacement for fine sand. The main ingredient in eggshells
    is calcium carbonate (the same brittle white stuff that chalk, limestone, cave
    stalactites, sea shells, coral, and pearls are made of). The shell itself is about
    95% CaCO3 (which is also the main ingredient in sea shells). The remaining 5%
    includes Magnesium, Aluminium, Phosphorous, Sodium, Potassium, Zinc, Iron, Copper,
    Ironic acid and Silica acid. Eggshell has a cellulosic structure and contains
    amino acids; thus, it is expected to be a good bio-sorbent and it was reported
    that large amounts of eggshells are produced in some countries, as waste products
    and disposed in landfills annually.


    The following are some of the advantages of egg shell


    +   1. Considerable reduction in alkali-silica and sulphate expansions.

    +   2. Meets the most stringent environmental regulations nationwide.

    +   3. Ideal for painting in occupied spaces.

    +   4. Excellent durability and washable finish.

    +   5. Resist mould and mildew on the paint film.

    +   6. Saves money; less material required.

    +   7. Meets strict performance and aesthetic requirements.


    The eggshells are collected and cleaned properly. The cleaned eggshells are finely
    grounded and sieved. The crushed eggshell passing through 1.18mm and retains on
    600µ is used as a partial replacement for sand.


    The chemical composition of the crushed eggshell is shown in Table 2.


    Table 2. Chemical Composition of Eggshell


    | COMPONENTS | % |

    |---|---|

    | Calcium carbonate | 95 |

    | Magnesium | 0.8 |

    | Calcium Phosphate | 0.8 |

    | Organic Materials | 3.4 |'
