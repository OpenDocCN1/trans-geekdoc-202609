    # CONCLUSION


    The addition of eggshell as a partial replacement of sand results in decrease
    in compressive strength of cement mortar. But the advantage of using eggshell
    was that, the increase in percentage of eggshell results in the decrease in self
    weight of cement mortar. Also, the chemical composition of eggshell have a property
    to resist the radioactivity to the certain extent, hence it can be used for radiotherapy
    rooms, nuclear reactors and in the buildings where the radioactive materials are
    used. In future, the ce-'
