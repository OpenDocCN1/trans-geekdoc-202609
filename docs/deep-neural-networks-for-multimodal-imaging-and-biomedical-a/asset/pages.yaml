    # COMPARISON OF WEIGHT OF ORDINARY CEMENT MORTAR WITH THE CEMENT MORTAR CONTAINING
    EGGSHELL


    Comparison of weight of ordinary cement mortar with the cement mortar containing
    eggshell shown in the Figure 2, we can conclude that the increase in percentage
    of eggshell results in decrease in self weight of cement mortar. Hence the eggshell
    can be used as partial replacement of sand in the place where the light weight
    cement mortar with permissible compressive strength is required.


    # Figure 2. Comparison of weight of ordinary cement mortar with the cement mortar
    containing eggshell


