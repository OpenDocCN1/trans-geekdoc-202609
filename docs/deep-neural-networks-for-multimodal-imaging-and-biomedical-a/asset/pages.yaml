  md: '# SKULL SEGMENTATION IN FETAL ULTRASOUND IMAGES


    Ultra Sound images of the fetal structure have been largely used to assess the
    growth and well-being of the foetus, and estimating fetal weight. The examination
    of the fetal skull is a vital part of clinical examination, including head circumference
    (HC), Bi Parietal Diameter (BPD), and Occipito Frontal Diameter (OFD). But, this
    measurement is subject to more probability of measurement errors, since this is
    a manual 2D measurement done from extracted features from specified anatomical
    planes (i.e., the trans thalamic or trans ventricular planes). This human dependence
    of the procedure greatly affect the accuracy of sonography based fetal screening,
    limiting reproducibility, and may affect the early detection of formation of defective
    foetal structures. Moreover, the early detection of defective formation of cranial
    structures, such as dolichocephaly, or brachycephaly, requires a thorough understanding
    of the skull structure and its curved bones, and boundaries, which may be difficult
    to analyze and make measurement in a single 2D plane. Inspite of this limitations,
    manual 2D sonography based examination remains the current gold standard in feotal
    Ultra Sound analysis.


    Figure 11. a): Two stage Convolutional Network, b) U-Net architecture


    ![](img/a636f78302652a9c2ec5900d81fba475_40_0.png)


    Currently, estimation of feotal head circumference and abdominal circumference
    (AC are done manually from ultrasound images by well trained radiologists. These
    parameters are useful benchmarks to gauge gestational age, but the process can
    be time consuming and laborious. To get around those problems, researchers have
    developed a machine learning method that takes into account skilled radiologists
    decisions in order to automate the estimation process. In comparison, earlier
    efforts to automate fetal structural estimation methods are based on image intensity
    values. This often led to accurate segmentation of well distinguished anatomical
    structures but can fail when measuring low-contrast features. The researchers
    used a three-stage approach. In the first step, they obtained an initial estimate
    of the Abdominal Circumference. Convolutional neural network (CNN) was used to
    determine the stomach bubble, amniotic fluid and umbilical vein in the ultrasound
    image, and from these three features, derived an estimate of the Abdominal Circumference.
    The novelty of this approach is contained in the second step, where the images
    together with the Abdominal Circumference estimates were fed into a second'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'CNN. This CNN then used these data to estimate the position of bony structures
    such as the mother’s ribs. This information was then used to refine the initial
    Abdominal Circumference estimate. In the final step, the researchers passed the
    final Abdominal Circumference measurement along with the ultrasound images to
    a specific class of CNN known as a U-net. The U-net decided whether or not the
    ultrasound images, together with the Abdominal Circumference estimate, are accepted
    or rejected, in a manner that mimics the decision of the clinician. In this way,
    the machine learns what to look for. Kim and colleagues used 112 images to train
    each CNN and the U-net, and 62 images to evaluate abdominal circumference. They
    obtained accurate segmentation of the ultrasound images, including images rejected
    by the machine because they showed the wrong anatomical plane, in 87.10% of the
    verification cases. Commercial systems are available to estimate the abdominal
    cavity volume from ultrasound images. However, these methods often fall short
    of clinical requirement due their inability to utilize structural information
    within the ultrasound image, such as shadowing artifacts caused by the ribs. By
    using a combination of several CNNs and a U-net, researchers have shown that machines
    have the capacity to learn how to provide this structural information, which can
    in turn assist clinicians by automatically segmenting images with a good degree
    of accuracy.


    A new two-stage cascade approach as alternative architecture having additional
    information channels was proposed by Cerrolaza et al., (2018). These new channels
    are mainly constructed to deal with the difficulties arising in fetal 3D sonographic
    image segmentation process like shadowing and fading effects, to supply relevant
    information for the complete reconstruction of the skull. The overall flow diagram
    of the proposed framework is depicted in Figure 11(a).This segmentation algorithm
    divides the segmentation process into two parts, using a 3D convolutional U-Net
    which is a fully convolutional neural network which includes shortcut connections
    between a contracting encoder and a successive expanding decoder; as shown in
    Fig. 11(b), which is the basic structural element of the architecture. Taking
    the original 3D Sonographic image volume as single input channel, and the first
    block (B1) generates a partial reconstruction of the skull by segmenting the cranial
    bone visible in the sonographic image. Inspite of the large artifacts and very
    small signal-to-noise ratio of Sonographic imaging, bone tissue can be partially
    identified by its hyper echoic characteristics and curved structural pattern.
    Due to the sequential combination of many convolutional and pooling layers, the
    proposed CNN-based architecture learns particular filters at different resolutions
    and able to identify these discriminating features, and provide some incomplete,
    initial estimation of the skull. Based on this initial estimation, the the second
    block (B2) generates a full reconstruction of the skull, connecting those gaps
    and missing portions generated by the combination of fading and shadowing effects.
    Inspired by the auto-context architecture, the output probability map from B1
    is used as an extra input channel for B2, which supplies valuable contextual and
    anatomical image information. Also, the input to B2 is completed with two extra
    channels, the Incidence Angle Map (IAM) and the Shadow Casting Map (SCM), both
    derived from the initial partial segmentation obtained in B1. The IAM and SCM
    supply necessary complementary information regarding the underlying physics of
    sonographic imaging, the angle of incidence of the Sonographic wave front, and
    the shadowing effect caused by the bone structures closer to the probe, respectively.


    # SEGMENTATION TO ESTIMATE PLACENTAL VOLUME USING OX N NET


    Birth weight can be estimated from first trimester placental volume (Pl Vol.)
    and Pl Vol. measured with B-mode sonogram, which could be used to monitor the
    growth of foetus. Many studies have proved that'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'a low PIVol between 11 and 13 weeks of gestation can result in adverse pregnancy
    outcomes, including small for gestational age (SGA) and preeclampsia. PI Vol.
    has also shown to be independent of other biomarkers for SGA, such as pregnancy-associated
    plasma protein A (PAPP-A) and nuchal translucency, a thorough recent study concluded
    that it could be successfully integrated into a future multivariable screening
    method for SGA analogous to the “combined test” currently used to screen for fetal
    aneuploidy. As PI Vol. is measured at the same gestation as this routinely offered
    combined test, no extra ultrasound scans would be required, making it more economically
    appealing to healthcare providers worldwide.


    The only available method to determine PI Vol. for a radiologist is to examine
    the 3D-sonogram, identify the placenta and manually label it. Software tools,
    such as Virtual Organ Computer-aided AnaLysis (VOCAL; General Electric Healthcare)
    and a semi automated random walker–derived (RW-derived) method have been developed
    to estimate Placental volume. But this method is too time consuming and it’s accuracy
    depend on the radiologist. For PI Vol. to become a useful measure to monitor the
    foetal growth, a reliable, real-time, radiologist-independent technique for the
    estimation of placental volume is needed. A real-time, fully automated technique
    for estimating PI Vol. from 3D-Sonograms was proposed by Looney et al., (2018).
    They also studied the relationship between segmentation accuracy and the size
    of the training data set, and found the appropriate amount of training data required
    to maximize segmentation accuracy. Finally, the performance of the PI Vol. estimates
    generated by the fully automated fCNN method to predict SGA at term was assessed
    by them. Deep learning was used with an exceptionally large ground-truth data
    set to generate an automatic image analysis tool for segmenting the placenta using
    3D-Sonogram.This study uses the largest 3D medical image data set to date for
    fCNN training. In a number of data science competitions, the best performing models
    have used similar model architectures with poorer performing models but employed
    data augmentation to artificially increase the training set, suggesting a link
    between performance and the data set size. The learning curves presented here
    demonstrate a key finding of the need for large training sets and/or data augmentation
    when undertaking end-to-end training. The mean squared error learning curves of
    this model architecture the training and validation curves converged toward 0.275
    as the training set size is increased. This was reflected in the monotonic increase
    across training samples, where the DSC for 1,200 training cases was 0.81 and the
    DSC was 0.73 for 100. Models are trained end to end on training sets with 100,
    150, 300, 600, 900, and 1,200 cases. The mean squared error on the validation
    set decreased monotonically from 0.039 to 0.030 and increased monotonically from
    0.01 to 0.025 on the training set. The median (inter quartile range) DSC obtained
    on the validation set throughout training increased monotonically from 0.73 (0.17)
    to 0.81 (0.15). Statistical analysis demonstrated a significant improvement in
    the DSC values with increasing training set size.


