    # Detection of Cardiovascular Anomalies


    Detection of disease related to the cardiovascular system could be easily identified
    by observing various structures of heart, which can be treated with the normal
    medicines or through surgery (Chopra and White, 2011). Taking x-rays is the most
    commonly preferred imaging test, which helps the radiologist or the doctors to
    make the decision quickly with less diagnosis error at certain times. According
    to American College of Radiology Data Science Institute ACR DSI, “the first imaging
    system preferred for the patients coming with the shortness and difficulties in
    breathing will be suggested to examine with the chest radiograph”. Cardiomegaly
    is considered to be the medical situation in which the heart is inflated or enlarged.
    This condition may vary from person to person. The situation could also lead to
    high blood pressure. Chest radiography is used as an initial tool in determining
    this situation and also it is accepted to be a quick visual assessment done by
    the radiologist. But in certain cases, this technique is found to be inaccurate.'
