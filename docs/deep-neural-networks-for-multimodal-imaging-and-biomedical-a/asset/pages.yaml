    # ABSTRACT


    The recent researches show that cement mortar containing eggshell as a partial
    replacement of sand contained radiation absorption property. In these cement mortar
    samples, 5%, 10%, 15%, and 20% by mass of sand was replaced by crushed eggshells,
    and there was increase in radiation absorption. The result also showed that using
    eggshell as a partial replacement for sand leads to decrease in compressive strength
    of the cement mortar. Waste of any kind in the environment when its concentration
    is in excess can become a critical factor for humans, animals, and vegetation.
    The utilization of the waste is a priority today in order to achieve sustainable
    development. So, we have planned to increase that compressive strength by means
    of using seashell as a partial replacement for cement. The main objective of the
    project is to maintain radiation absorption by means of using eggshell along with
    seashell as a partial replacement for cement to increase the compressive strength.


