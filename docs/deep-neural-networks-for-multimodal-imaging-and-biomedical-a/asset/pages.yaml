    # Segmentation


    Numerous DL models have included specifically for the medical image segmentation
    tasks regarding the disadvantage of data insufficiency and class imbalance problems
    (Suzuki et al., 2017; Ker etl., 2017). The fast and most precise medical image
    segmentation called “U-Net”. Different types of U-Net models have been introduced
    for CNN-based data Segmentation of medical image. The effect of skip connections
    exist in image registration and segmentation have been assessed with U-Net and
    other residual networks.


    # Computer-Aided Detection


    Medical imaging and data acquisition system have been improved a lot in the last
    few years. The current CAD system is introduced to achieve two goals: detection
    and false-positive reduction. The primary objective can be performed based on
    the detection algorithm, DL methods are dispensing enormous performance on detection
    tasks. (Haque et al.2020; Liang et al, 2014). On the additional hand, inherited
    ML procedures such as SVM, PCA are employed for this purpose. Accidentally, traditional
    ML-based CAD does not function well in clinical practice. However, newly DL based
    techniques are dispensing excellent representation for false-positive modification
    responsibilities in different modalities of medical imaging. Newly, there are
    many CAD methods have recommended for breast cancer detection, lung cancer detection,
    and Alzheimer ’s disease (AD) (Putin et al., 2016).'
