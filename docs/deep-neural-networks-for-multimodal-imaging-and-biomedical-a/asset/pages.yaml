    # Low-Cost Controller Module


    To adapt low cost experimental setup, we preferred Raspberry Pi 3 Model A+ as
    low-cost controller module which is smaller in size that can be utilized for multi-utility
    purpose. This device weighs around 29g which simplifies the programming platform
    (especially Python) for developing applications and very easy to compute. It comprises
    64-bit quad core processor executing at 1.4 GHz, 5 GHZ WLAN, 4.2V Bluetooth, and
    2.4 GHz dual-band. Figure 6, represents the sample of Raspberry Pi 3 Model A+
    low-cost controller module.


