  md: 'image data stored in cloud storage will be deleted after processing. Other
    companies consist of privacy policies to certain degree, however, if a user allows
    to collect and process then it will be stored in cloud in one capacity or another.
    For effective data transfer in healthcare, among the various existing routing
    protocols, Destination-Sequenced Distance Vector was introduced which prevents
    loop free by employing the concept of sequence numbers. The concept of sequence
    numbers is assigned to each route along with the recent sequence number. This
    protocol was introduced for MANETs with extra features which lessen traffic minimisation.
    The forwarding tables consists of entries for all the nodes which are reachable
    in a system. Ad-hoc On-Demand Distance Vector Routing is the enhanced version
    of Destination-Sequenced Distance Vector which allows forwarding tables to reach
    as well as users for discovery of fresh active destination users. Another algorithm
    is loop-free path-finding which maintains loop-free routing tables and updates
    routing tables frequently based on the topological as well as link-cost. However,
    employing techniques such as maximum hop count, split horizon, route poisoning,
    Hold-down Timers can aggrandise routing protocols such a way making the protocols
    loop-free and effective.


    For enhancing security for healthcare related images and sensitive information,
    HIPAA encryption requirements must be followed, hence GPG encryption is a well-suited
    encryption for this purpose. The GPG produces random numbers and GPG needs entropy
    to do this, therefore the system must be kept busy while generating a keypair
    during keypair generation. The system will be busy and providing random number
    generator enough entropy to produce a random number. If your system display error
    stating the need for more random bytes, it means that your system needs more entropy
    to produce the keypair, therefore open a new shell session and install rng-utils.
    Generally, the source for the entropy could be hardware RNG device and the entropy
    sink could be a kernel entropy pool which is employed for generation of keypair.
    GPG can support these asymmetric encryption algorithms: RSA, ELGAMAL as well as
    Digital Signature Algorithm. For RSA it needs to be between 1024 to 4096 bits,
    ELGAMAL needs key length from 1024 to 4096 bits while digital Signature Algorithm
    needs 1024, 2048 as well as 3072-bit. It employs SHA1, SHA256, and SHA512.


    When a healthcare organization expands, the network must support the healthcare
    organization, therefore the original network plan should contain techniques from
    upgrading the original network. In certain case, the healthcare organization may
    need to include several network hardware devices, of different quality, from different
    manufacturers, as well as different network connection technologies, to connect
    fresh patients. Whenever, a fresh component is included in a network, it may degrade
    the quality of the network too, therefore the network should be designed with
    utmost care. It best recommended to include managed service provider when designing
    a network. Before designing a network, the on-site technician should perform a
    site survey to determine the where network equipment can be installed in the network.


    The number of clients as well as how many network users, printers, and company
    servers will the network types support should be determined, Generally, we should
    obtain how many users will be included in the next 12 months as well as how many
    network servers the network has to contain. For wired plus Wireless Local Area
    Network, a wireless-only network (802.11x) can be employed. A high-speed Internet
    connection DSL router should be employed for faster internet connectivity. The
    need for specific applications such as voice as well as video need extra network
    device configuration as well as fresh ISP services.


    As soon as the network is connected to the Internet, it opens physical links which
    consists of more than 50,000 unknown networks as well as all their unknown users.
    Therefore, Integrated Services Routers (ISR) should include firewall and other
    capabilities.'
