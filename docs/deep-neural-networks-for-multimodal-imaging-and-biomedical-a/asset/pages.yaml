  md: 'comes under the category of electrochemical biosensors (Bilitewski and Turner,
    2000). Biosensors are widely used in many fields that include medical applications,
    diagnostic, bioreactors, process control, nano technology (Ye and Ju, 2005) (Cai
    et al. 2003), agriculture, quality control (Bergveld, 1996), bacterial and viral
    diagnostic etc. Some of the advantages of bio-sensor are as follows(Matrubutham,
    1998):


    +   - Extremely practical system

    +   - A short period of response time

    +   - Non-polar molecules could be measured, which is very difficult to be measured
    with other devices

    +   - Control is said to be continuous and rapid with the biosensors (Wang and
    Liu, 2011).


    A few disadvantages are also possible with the use of biosensors that are as follows:


    +   - Due to the denaturalization, heat sterilization is not possible since the
    biological materials present in the biosensors functions with their natural properties
    that may be disturbed with the ions, pH and temperature.

    +   - At certain cases, certain other molecules could intoxicate the biosensors
    cell, which has the capability to diffuse through the membrane.


    Cancer diagnosis and treatment had made a huge interest among the researchers
    due to the disease identification, repetition after treatment and death rate.
    Cancer can occur in 200 evident forms in various parts of the human body that
    includes lungs, stomach, throat, mouth, skin, brain, ovarian, breast, leukemia,
    intestine and colon (Brett and Brett, 1994). The occurrence of cancer may be due
    to the environmental factors and genetic impacts. Some types of cancer could also
    lead to viral and bacterial infections. In medical science, biosensor has the
    capability to determine the blood glucose level, determine pathogens and also
    helps in detecting and monitoring cancer. The patients’ quality of life could
    be enhanced with the early detection of cancer cells and promoting appropriate
    treatment at the early stage since when it becomes too late in detecting the disease
    then it may lead to difficulty in treatment that may also lead to death. This
    is possible by measuring the level of protein secreted by the tumor cells and
    biosensors could be able to detect the stages of the tumor (benign or cancerous)
    (Lambrianou, Demin and Hall, 2008).


    # Smart Cane


    The Central Michigan University’s students developed a device known as Smart Cane,
    which is portable equipment employed with the sensor system that is comprised
    of an ultrasonic sensor, vibrator, water detector, buzzer and finally a microcontroller
    element that was basically designed to help the visually-impaired persons. The
    obstacles present on the path could be determined by the sensor, servo motors
    and fuzzy controller, which could be indicated in the form of vibration or a voice
    message. The feedback of the obstacle’s position is indicated by the servo motors.
    The ultrasonic sensor will detect the obstacles and finally, the decisions will
    be made by the fuzzy controller to navigate the user (Tiponut, Ianchis, Bash and
    Haraszy, 2011). If the person does not have the hearing ability then a vibrator
    with gloves will provide sufficient vibration as a message. The performance of
    the vibrator could also be enhanced by fixing the motors to each finger, with
    each one having a specific meaning (Tiponut, V.; Popescu, Bogdanov and Caleanu,
    2008). The water sensor will not work unless the water level is 0.5 cm apart'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'and the buzzer will also not stop is producing the sound unless the water is
    wiped and cleaned. Buzzer timing could also be adjusted in order to solve certain
    issues.


    # Tongue-Placed Electro-Tactile Device (TED)


    This device along with the tiny dipole antenna could be used in assisting the
    partially and completely blind persons. Wireless transmission is provided among
    the TED device and the electrodes through the antenna (Dakopoulos and Bourbakis,
    2010). The system is mainly composed of three important elements: Tongue-placed
    electro-tactile device (TED), detective cameras attached to the sunglasses and
    finally a host computer. The sensor will be placed through the tongue and the
    other blocks fitted externally include transmission block, central processing
    unit (CPU) and finally a battery. The sensor placed through the tongue is composed
    of electrode arrange in 3×3 matrix, which produces a distribution of 8 pulses
    (Liu et al. 2010). Every pulse specifies to a direction and the other parts are
    integrated into the form of a circuit.


    # A Low Cost Navigation Assisitive System (LowCost Nav)


    This device helps the visually-impaired people in navigation, which is composed
    of Raspberry Pi, GPS receiver and 3 main buttons to run the system that is located
    generally in the pocket of the user. For a better experience, the device is promoted
    with the speech and voice recognition device. Magnetic compass and gyroscope are
    used in the system that calculates the distance among the user and the object.
    The entire navigation process is controlled with the help of Raspberry Pi. Both
    the LowCost Nav and Geo-Coder-US modules are used for generating a pedestrian
    route. The user could use the microphone to feed the address into the system.
    If the address is already stored then the button should be pressed. Once the address
    is fed to the system, the middle button should be pressed to ensure whether the
    given address is correct or wrong with the help of the database that had been
    already stored in the system. The system has 6 important modules: 1) Loader- forms
    as the controller of the system 2) Initializer - verify with the existing libraries
    and data 3) User interface - receives the necessary address from the user 4) Address
    query - translates the given address to the geographic coordinates 5) Route query
    - gets the current location of the user from GPS and finally 6) Route traversal
    - audible instructions are provided to the user to reach the desired destination.


    # Benefits of IoT in Healthcare


    The rise of chronic diseases with the increase in the global population has made
    healthcare services expansive as it is in the state of great despair. Health service
    accessibility is said to be very low with the growing population and among the
    rural areas. Technologies cannot stop the ageing of people but it could stop the
    spreading or increase in the chronic disease. Hospital bills are at a high cost
    with the medical diagnosis. This could be made easier by having access to healthcare
    in the patient’s home. An accurate diagnosis could also abate the need for the
    hospitalization. The home-centric application of healthcare could be highly possible
    with the Internet of Things (IoT) paradigm (Miao, Djouani, Kurien and Noel, 2012).
    This helps the patient in achieving better healthcare treatment and it forms as
    a mutual hope by making the medical centers to exercise more adeptly.'
