    # KEY TERMS AND DEFINITIONS


    +   - **Algorithm:** A step-by-step approach for solving a problem.

    +   - **Bias:** An additional parameter used to tune the output along with the
    weighted sum of the inputs to the neuron.

    +   - **Binary Image:** It has two colors usually black and white; they are given
    in two levels - 0 or 1.

    +   - **Greyscale:** The image has the value of each pixel with the amount of
    light that carries only intensity information.

    +   - **Image Processing:** It uses the computer algorithms to perform image processing
    on digital images.

    +   - **Image Classification:** It groups items based on the categories.

    +   - **Image Segmentation:** It is the process of dividing an image into multiple
    segments. The aim is to get more meaningful information and easier for analyzing.

    +   - **Neural Network:** It is a circuit of neurons and with layers of a modern
    sense.

    +   - **Neurons:** It is a cell and specialized to transmit information to the
    entire system.

    +   - **Object Detection:** It deals with detection of semantic objects of a certain
    class (such as humans, buildings, or cars) in digital images and videos.

    +   - **Perceptron:** A perceptron is a single-layer neural network. It includes
    input values, weights and bias, net sum, and an activation function.

    +   - **Thresholding:** The method is based on a threshold value to turn a gray-scale
    image into a binary image.

    +   - **Weights:** They are numerical parameters in an ANN that converts an input
    to control the output.'
