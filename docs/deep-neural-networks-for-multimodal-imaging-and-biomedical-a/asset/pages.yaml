    # CONCLUSION


    In this chapter, sensor-based IoT devices with their benefits and the way they
    could be integrated with the IoT environment are studied in detail. The real-world
    variables are captured by the smart sensors, which are the part of IoT components
    and these data are in the form of digital streams for transmission to a gateway.
    The built-in microprocessor unit performs the application process with certain
    algorithms that tends to perform filtering, compensation and certain other signal
    processing and conditioning tasks. The microprocessor also reduces the load of
    data that flows towards IoT and it could also spot production parameters that
    go beyond the accepted values by generating alarms accordingly. This enables the
    operator to take preventive action before heavy damages occur. In certain cases,
    the data could be transmitted by the sensor if they exceed the previous sample
    values and this facility is determined by “report by exception” mode. This reduces
    the power requirements of the sensors and also reduces the loads on the central
    computing resources. Sufficient battery sources should also be promoted to the
    IoT system to continue its function in case of power failure. Additionally, a
    probe can also contain 2 sensors, which work together for improved monitoring
    feedback. These devices could be helpful in assisting the'
