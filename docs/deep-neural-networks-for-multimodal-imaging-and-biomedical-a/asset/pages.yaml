- pgno: 7
  md: '# # Detailed Table of Contents


    +   Preface .................................................... xiv


    # Chapter 1


    Emerging Information Technology Scenarios and Their Contributions in Reinventing
    Future Healthcare Systems: Applications and Practical Systems for Healthcare ....................................
    1


    Reyana A., Nehru Institute of Engineering and Technology, India Krishnaprasath
    V. T., Nehru Institute of Engineering and Technology, India Suresh A., Nehru Institute
    of Engineering and Technology, India


    Critical health information is gathered, compiled, and analysed from image scanning,
    laboratory testing reports, health trackers, etc. Healthcare requires a support
    of real-time digital information for effective decision making. As industries
    bring better care to consumer health systems, providers achieve their goal in
    delivering better diagnosis and efficient treatment to consumers. This chapter
    contributes to the major health components—content, infrastructure, analytics,
    communication, and interfaces—forming the core of all health IT. The challenge
    is further exaggerated on the current issues related to health data and the contribution
    of IT systems in healthcare management. Further, the scenarios on intelligent
    care systems that are capable of early diagnosis are described. This impacts the
    future of global healthcare services by rapidly increasing the development and
    bridging the gap between the personal and relevant datasets creating a new era
    in the world of healthcare.


    # Chapter 2


    Deep Learning Models for Semantic Multi-Modal Medical Image Segmentation ............
    12


    V. R. S. Mani, National Engineering College, Kovilpatti, India


    In this chapter, the author paints a comprehensive picture of different deep learning
    models used in different multi-modal image segmentation tasks. This chapter is
    an introduction for those new to the field, an overview for those working in the
    field, and a reference for those searching for literature on a specific application.
    Methods are classified according to the different types of multi-modal images
    and the corresponding types of convolution neural networks used in the segmentation
    task. The chapter starts with an introduction to CNN topology and describes various
    models like Hyper Dense Net, Organ Attention Net, UNet, VNet, Dilated Fully Convolutional
    Network, Transfer Learning, etc.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Chapter 3

    Deep Learning Techniques for Biomedical Image Analysis in Healthcare ....................................................
    31


    Sivakami A., Bharat Institute of Engineering and Technology, India

    Balamarugan K. S., Bharat Institute of Engineering and Technology, India

    Bagyalakshmi Shanmugam, Sri Ramakrishna Institute of Technology, India

    Sudhagar Pitchaimuthu, Swansea University, UK


    Biomedical image analysis is very relevant to public health and welfare. Deep
    learning is quickly growing and has shown enhanced performance in medical applications.
    It has also been widely extended in academia and industry. The utilization of
    various deep learning methods on medical imaging endeavours to create systems
    that can help in the identification of disease and the automation of interpreting
    biomedical images to help treatment planning. New advancements in machine learning
    are primarily about deep learning employed for identifying, classifying, and quantifying
    patterns in images in the medical field. Deep learning, a more precise convolutional
    neural network has given excellent performance over machine learning in solving
    visual problems. This chapter summarizes a review of different deep learning techniques
    used and how they are applied in medical image interpretation and future directions.


    # Chapter 4

    Heterogeneous Large-Scale Distributed Systems on Machine Learning ....................................................
    47


    Karthika Paramasivam, Kalasalingam Academy of Research and Education, India

    Prathap M., Wollo University, Ethiopia

    Hussain Sharif, Wollo University, Ethiopia


    Tensor flow is an interface for communicating AI calculations and a use for performing
    calculations like this. A calculation communicated using tensor flow can be done
    with virtually zero changes in a wide range of heterogeneous frameworks, ranging
    from cell phones, for example, telephones and tablets to massive scale-appropriate
    structures of many computers and a large number of computational gadgets, for
    example, GPU cards. The framework is adaptable and can be used to communicate
    a wide range of calculations, including the preparation and derivation of calculations
    for deep neural network models, and has been used to guide the analysis and send
    AI frameworks to more than twelve software engineering zones and different fields,
    including discourse recognition, sight of PCs, electronic technology, data recovery,
    everyday language handling, retrieval of spatial data, and discovery of device
    medication. This chapter demonstrates the tensor flow interface and the interface
    we worked with at Google.


    # Chapter 5

    Impact of Smart Technology and Economic Growth for Biomedical Applications ....................................................
    69


    Dhinesh Kumar R., Capgemini US, USA


    Commonly, the sensor installed by these entities collects the citizen and infrastructure
    data by explicit approval. The performance based on the outline of the citizens
    could be done through AI depending on the data they offer that could promote advancements
    in the cities, or it could be utilized for the profit of the corporation. Certain
    barriers should be crossed in order to succeed in achieving the deployments of
    the cities. Commonly, the only target is to inform AI through the data gathered
    by the IoT in the real-time process. At certain times, the generation of data
    is the main part that is done by several elements, and this could be employed
    in a deliberate way. Certain challenges are also faced in the economic growth
    and its impact on biomedical industry. This chapter presents the impact of smart
    technology and economic growth for biomedical applications.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Chapter 6

    Importance of Automation and Next-Generation IoT in Smart Healthcare ............
    80

    Ahmed Alenezi, Taibah University, Al-Ula Campus, Madhina, Saudi Arabia

    M. S. Irfan Ahamed, Taibah University, Al-Ula Campus, Madhina, Saudi Arabia


    Generally, the sensors employed in healthcare are used for real-time monitoring
    of patients, such devices are termed IoT-driven sensors. These type of sensors
    are deployed for serious patients because of the non-invasive monitoring, for
    instance physiological status of patients will be monitored by the IoT-driven
    sensors, which gathers physiological information regarding the patient through
    gateways and later analysed by the doctors and then stored in cloud, which enhances
    quality of healthcare and lessens the cost burden of the patient. The working
    principle of IoT in remote health monitoring systems is that it tracks the vital
    signs of the patient in real-time, and if the vital signs are abnormal, then it
    acts based on the problem in patient and notifies the doctor for further analysis.
    The IoT-driven sensor is attached to the patient and transmits the data regarding
    the vital signs from the patient''s location by employing a telecom network with
    a transmitter to a hospital that has a remote monitoring system that reads the
    incoming data about the patient''s vital signs.


    # Chapter 7

    A Comparative Study of Popular CNN Topologies Used for Imagenet Classification
    ............ 89

    Hmidi Alaeddine, Laboratory of Electronics and Microelectronics, Faculty of Sciences
    of Monastir, Monastir University, Monastir, Tunisia

    Malek Jihene, Higher Institute of Applied Sciences and Technology of Sousse, Sousse
    University, Sousse, Tunisia


    Deep Learning is a relatively modern area that is a very important key in various
    fields such as computer vision with a trend of rapid exponential growth so that
    data are increasing. Since the introduction of AlexNet, the evolution of image
    analysis, recognition, and classification have become increasingly rapid and capable
    of replacing conventional algorithms used in vision tasks. This study focuses
    on the evolution (depth, width, multiple paths) presented in deep CNN architectures
    that are trained on the ImageNET database. In addition, an analysis of different
    characteristics of existing topologies is detailed in order to extract the various
    strategies used to obtain better performance.


    # Chapter 8

    A Novel Framework on Biomedical Image Analysis Based on Shape and Texture Classification

    for Complex Disease Diagnosis ............ 104

    Reyana A., Nehru Institute of Engineering and Technology, India

    Krishnaprasath V. T., Nehru Institute of Engineering and Technology, India

    Preethi J., Anna University, India


    The wide acceptance of applying computer technology in medical imaging system
    for manipulation, display, and analysis contribute better improvement in achieving
    diagnostic confidence and accuracy on predicting diseases. Therefore, the need
    for biomedical image analysis to diagnose a particular type of disease or disorder
    by combining diverse images of human organs is a major challenge in most of the
    biomedical application systems. This chapter contributes an overview on the nature
    of biomedical images in electronic form facilitating computer processing and analysis
    of data. This describes the different types of images in the context of information
    gathering, screening, diagnosis, monitor, therapy, and control and evaluation.
    The characterization and digitization of the image content is important in the
    analysis and design of image transmission.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Chapter 9

    Deep Learning Techniques for Prediction, Detection, and Segmentation of Brain
    Tumors................ 118


    Prisilla Jayanthi, K. G. Reddy College of Engineering and Technology, India

    Muralikrishna Iyanki, Defence Research and Development Organisation, India


    In deep learning, the main techniques of neural networks, namely artificial neural
    network, convolutional neural network, recurrent neural network, and deep neural
    networks, are found to be very effective for medical data analyses. In this chapter,
    application of the techniques, viz., ANN, CNN, DNN, for detection of tumors in
    numerical and image data of brain tumor is presented. First, the case of ANN application
    is discussed for the prediction of the brain tumor for which the disease symptoms
    data in numerical form is the input. ANN modelling was implemented for classification
    of human ethnicity. Next the detection of the tumors from images is discussed
    for which CNN and DNN techniques are implemented. Other techniques discussed in
    this study are HSV color space, watershed segmentation and morphological operation,
    fuzzy entropy level set, which are used for segmenting tumor in brain tumor images.
    The FCN- 8 and FCN-16 models are used to produce a semantic segmentation on the
    various images. In general terms, the techniques of deep learning detected the
    tumors by training image dataset.


    # Chapter 10

    Demystification of Deep Learning-Driven Medical Image Processing and Its Impact
    on Future Biomedical Applications................ 155


    R. Udendhran, Department of Computer Science and Engineering, Bharathidasan University,
    India

    Balamurugan M., Department of Computer Science and Engineering, Bharathidasan
    University, India


    The recent growth of big data has ushered in a new era of deep learning algorithms
    in every sphere of technological advance, including medicine, as well as in medical
    imaging, particularly radiology. However, the recent achievements of deep learning,
    in particular biomedical applications, have, to some extent, masked decades-long
    developments in computational technology for medical image analysis. The methods
    of multi-modality medical imaging have been implemented in clinical as well as
    research studies. Due to the reason that multi-modal image analysis and deep learning
    algorithms have seen fast development and provide certain benefits to biomedical
    applications, this chapter presents the importance of deep learning-driven medical
    imaging applications, future advancements, and techniques to enhance biomedical
    applications by employing deep learning.


    # Chapter 11

    Artificial Intelligence and Reliability Metrics in Medical Image Analysis ...........................
    172


    Yamini G., Bharathidasan University, India

    Gopinath Ganapathy, Bharathidasan University, India


    Artificial intelligence (AI) in medical imaging is one of the most innovative
    healthcare applications. The work is mainly concentrated on certain regions of
    the human body that include neuroradiology, cardiovascular, abdomen, lung/thorax,
    breast, musculoskeletal injuries, etc. A perspective skill could be obtained from
    the increased amount of data and a range of possible options could be obtained
    from the AI though they are difficult to detect with the human eye. Experts, who
    occupy as a spearhead in the field of medicine in the digital era, could gather
    the information of the AI into healthcare. But the field of radiology includes
    many considerations such as diagnostic communication, medical judgment,'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'policymaking, quality assurance, considering patient desire and values, etc.
    Through AI, doctors could easily gain the multidisciplinary clinical platform
    with more efficiency and execute the value-added task.


    # **Chapter 12**

    Transforming Biomedical Applications Through Smart Sensing and Artificial Intelligence...................
    186


    Harini Akshaya T. J., National Engineering College, Kovilpatti, India

    Suresh V., National Engineering College, Kovilpatti, India

    Carmel Sobia M., National Engineering College, Kovilpatti, India


    Electronic health records (EHR) have been adopted in many countries as they tend
    to play a major role in the healthcare systems. This is due to the fact that the
    high quality of data could be achieved at a very low cost. EHR is a platform where
    the data are stored digitally and the users could access and exchange data in
    a secured manner. The main objective of this chapter is to summarize recent development
    in wearable sensors integrated with the internet of things (IoT) system and their
    application to monitor patients with chronic disease and older people in their
    homes and community. The records are transmitted digitally through wireless communication
    devices through gateways and stored in the cloud computing environment.


    # **Chapter 13**

    Exploring Internet of Things and Artificial Intelligence for Smart Healthcare
    Solutions................... 205


    G. Yamini, Bharathidasan University, India


    Artificial intelligence integrated with the internet of things network could be
    used in the healthcare sector to improve patient care. The data obtained from
    the patient with the help of certain medical healthcare devices that include fitness
    trackers, mobile healthcare applications, and several wireless sensor networks
    integrated into the body of the patients promoted digital data that could be stored
    in the form of digital records. AI integrated with IoT could be able to predict
    diseases, monitor heartbeat rate, recommend preventive maintenance, measure temperature
    and body mass, and promote drug administration by having a review with the patient’s
    medical history and detecting health defects. This chapter explores IoT and artificial
    intelligence for smart healthcare solutions.


    # **Chapter 14**

    The Pivotal Role of Edge Computing With Machine Learning and Its Impact on Healthcare
    ......... 219


    Muthukumari S. M., Bharathidasan University, India

    George Dharma Prakash E. Raj, Bharathidasan University, India


    The global market for IoT medical devices is expected to hit a peak of 500 billion
    by the year 2025, which could signal a significant paradigm shift in healthcare
    technology. This is possible due to the on-premises data centers or the cloud.
    Cloud computing and the internet of things (IoT) are the two technologies that
    have an explicit impact on our day-to-day living. These two technologies combined
    together are referred to as CloudIoT, which deals with several sectors including
    healthcare, agriculture, surveillance systems, etc. Therefore, the emergence of
    edge computing was required, which could reduce the network latency by pushing
    the computation to the “edge of the network.” Several concerns such as power consumption,
    real-time responses, and bandwidth consumption cost could also be addressed by
    edge computing. In the present situation, patient health data could be regularly
    monitored by certain wearable devices known as the smart telehealth systems that
    send an enormous amount of data through the wireless sensor network (WSN).'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Chapter 15

    Neuro-Fuzzy-Based Smart Irrigation System and Multimodal Image Analysis in Static-Clustered
    Wireless Sensor Network for Marigold Crops ...........................237

    Karthick Raghunath K. M., Malla Reddy Institute of Engineering and Technology,
    India

    Anantha Raman G. R., Malla Reddy Institute of Engineering and Technology, India


    As a decorative flower, marigolds have become one of the most attractive flowers,
    especially on the social and religious arena. Thus, this chapter reveals the potential
    positive resultants in the production of marigold through neuro-fuzzy-based smart
    irrigation technique in the static-clustered wireless sensor network. The entire
    system is sectionalized into clustering phase and operational phase. The clustering
