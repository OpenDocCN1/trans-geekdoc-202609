    # # Classification


    DL computer vision utilizes a huge number of samples and in most of the cases,
    transfer learning is used. People in the DL community use the transfer learning
    technique for several reasons. Two main reasons are: first, use pre-trained weights
    for feature extraction, and second, use pre-trained weights to an existing network
    and fine-tune with a new dataset. For example, several studies have been carried
    out where the trained weights are used to form image net dataset. Out of many
    studies, some of the researches have reported the best results for medical image
    classification with transfer learning. Another outstanding work for skin cancer
    classification where they have achieved dermatologist-level performance for skin
    cancer disease recognition. In this work, the Google Inception-v3 model used with
    transfer learning (Suzuki et al, 2016; Shen et al, 2017) .


    DCNN approaches are massively applied for neuroimaging such as Brain Tumour, Alzheimer
    disease segmentation and classification from MRI (Ravi etal., 2016). 2D and 3D
    convolutional kernels were applied in different models for this purpose. Besides,
    like Neuroimaging, there are different deep CNN'
