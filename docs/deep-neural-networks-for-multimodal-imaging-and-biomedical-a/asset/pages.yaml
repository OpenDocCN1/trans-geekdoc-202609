  md: 'assessment, also as emerging tasks including image-guided interventions and
    therapy. Of these, classification, detection, and segmentation are the three most
    elementary tasks. they’re widely applied to different anatomical structures in
    medical image analysis involving organs like breast, prostate, liver, heart/cardiac,
    brain, carotid, thyroid, intravascular, fetus, lymph gland, kidney, spine, bone,
    muscle, nerve structure, tongue etc., . Multiple sorts of deep networks are involved
    in these tasks.It’s a standard approach to use a CNN model to find out from the
    obtained data (e.g., Tomographic images) so as to get hierarchical abstract representations,
    followed by a softmax layer or other linear classifier (e.g., a support vector
    machine) which will be used to produce one or more probabilities or class labels.
    Image annotations or labels are necessary for doing different image analysis tasks,
    and is called “supervised learning.” Unsupervised learning is additionally capable
    of learning representations from data without proper labels. Auto-encoders (AEs)
    and restricted Boltzmann’s machines (RBMs) are two of the foremost commonly applied
    unsupervised neural networks in medical image analysis promising improvements
    in performance. Unsupervised learning has one significant advantage over supervised
    learning, which is that it doesn’t require the use of time-consuming, labor-intensive,
    and expensive human annotations. Though closely related to semantic segmentation,
    medical image segmentation includes specific challenges that need to be addressed,
    such as the scarcity of labelled data, the high class imbalance found in the ground
    truth and the high memory demand of three-dimensional images. While replacing
    fully connected layers with convolutions allows for multiple pixels to be predicted
    efficiently and simultaneously, the resulting outputs typically have a very low
    resolution. This is caused by the fact that CNNs reduce the size of their input
    in multiple ways. Convolution layers with filters larger than 1 x 1 reduce the
    size of their input. This loss of pixels can be prevented by extending the input
    with a padding of zero-valued pixels.


