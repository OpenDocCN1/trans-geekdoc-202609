  md: '# Figure 2. Different existing DL models


    ![](img/a636f78302652a9c2ec5900d81fba475_51_0.png)


    # Convolutional Layer (CL)


    CLs are major building blocks in the convolutional neural networks.It provides
    the relationship between pixels by image features using square of input data.
    The element involved in performing the operation in the first part of the convoltution
    layer is called Kernel or filter. If it is applied to small regions of an image,
    the pixel of in this region is converted into single pixel.


    # Pooling Layer (PL)


    A pooling layer is a layer added after convolutional layer and summarizes a region
    of the feature map generated by CL .Here layer is responsible gradually for reducing
    the spatial size of the representation and the number of computations and parameters
    in the network. On comparable with different pooling layers, Max-Pooling is the
    most important method and widely used in CNN’s architecture for analyzing the
    output of all the preceding layers in detail.'
  merge: -1
  img_proc: true
