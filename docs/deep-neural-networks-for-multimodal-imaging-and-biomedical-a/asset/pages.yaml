    # ## ABSTRACT


    Artificial intelligence integrated with the internet of things network could be
    used in the healthcare sector to improve patient care. The data obtained from
    the patient with the help of certain medical healthcare devices that include fitness
    trackers, mobile healthcare applications, and several wireless sensor networks
    integrated into the body of the patients promoted digital data that could be stored
    in the form of digital records. AI integrated with IoT could be able to predict
    diseases, monitor heartbeat rate, recommend preventive maintenance, measure temperature
    and body mass, and promote drug administration by having a review with the patient’s
    medical history and detecting health defects. This chapter explores IoT and artificial
    intelligence for smart healthcare solutions.


    # ## INTRODUCTION


    In certain areas machines could be used for a certain process such as decision
    making, solving problems, learning and face recognition and this is possible with
    the help of artificial intelligence. The process of learning and making self-decisions
    could be done with the help of AI with the organized and unorganized data. AI
    is found to be ruling this digital world similar to mobile phones. Evolution in
    technology makes human lives easier and bringing out a new revolution in today
    world. Example of this advanced technology includes the Internet of Things (IoT)
    as shown in figure 1. Users experience is boosted up with the role of AI. The
    basic question regarding the IoT arises is that, “Why IoT cannot work without
    AI?” and “where and when IoT is required?” IoT is the technology that is composed
    of the combination of several sensors and embedding networks, which helps in data
    communication and interaction without the need for human intervention. The data
    gathered could be of real-time and these data could be stored in the cloud for
    further analysis.'
