    # # Topological Analysis


    Topology is the connectivity among shapes that are under transformations. When
    shape stretched becomes topologically invariant. Consider a shape as a rubber
    sheet, it remains in the same topology when stretched and distorted. The description
    of connectivity in terms of topology is for shape analysis. The notion of graph
    leads to define set of nodes connected by edges. Euler proved in 1735 the Euler
    number


    e=v-n+l


    Here v - vertices, n – edges and l indicates the loops. Also v, n, l, and e are
    invariant to scaling, translation, rotation. The invariance belongs to affine
    transformations. The vertices graph and connections are extracted utilizing Skeletonization,
