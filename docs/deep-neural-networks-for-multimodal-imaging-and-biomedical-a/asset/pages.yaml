    # ABSTRACT


    Deep Learning is a relatively modern area that is a very important key in various
    fields such as computer vision with a trend of rapid exponential growth so that
    data are increasing. Since the introduction of AlexNet, the evolution of image
    analysis, recognition, and classification have become increasingly rapid and capable
    of replacing conventional algorithms used in vision tasks. This study focuses
    on the evolution (depth, width, multiple paths) presented in deep CNN architectures
    that are trained on the ImageNET database. In addition, an analysis of different
    characteristics of existing topologies is detailed in order to extract the various
    strategies used to obtain better performance.


    # INTRODUCTION


    Machine learning is a field that is interested in the development of technology
    that allows the interpretation and prediction of data in an automatic way. It
    was originally a result of pattern and object recognition research that seeks
    to make algorithms able to learn automatically from a huge amount of data. During
    the years of the field of machine learning, applications in this domain have gone
    beyond the scope of pattern and object recognition where they are widely used
    in various tasks such as filtering content on networks of social media or web
    searches. In the early days, the technique of carrying out this process relies
    on methods developed by experts who have knowledge in the field purpose of interpreting
    the


