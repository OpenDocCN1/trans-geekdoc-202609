- pgno: 49
  md: '# TYPES OF MEDICAL IMAGING


    There are various methods of computer-aided detection system was produced and
    included in the clinical workflow in early 2010. The entirety of the principal
    responsibilities of medical imaging in radiology applications where the structural
    abnormalities are identified is classifying them into disease classifications.
    The different advanced imaging techniques are Microscopic, X-ray, Computer Tomography
    (CT), and Magnetic Resonance Imaging (MRI) (Ker etal., 2017; Lee etal, 2017; Litjens
    etal., 2017, Shen etal., 2017)


    # Radiography Imaging Technique


    It is an imaging technique to view the inner parts of the object using ionizing
    or non-ionizing radiation such as X-rays, gamma rays etc. It employs a wide beam
    of X-rays to observe non-uniformly composed material present in the organs. The
    images produced from this technique is used to find the assessment of the presence
    or absence of disease, damage or foreign object.


    # MRI-Magnetic Resonance Imaging Technique


    MRI is utilizing the high powerful magnets thereby emitting radio frequency pulse
    at the resonant frequency of hydrogen atoms to polarise and stimulate hydrogen
    nuclei of water molecules in human tissue. MRI doesn’t suggest X-rays nor ionizing
    radiation. MRI is extensively used in hospitals and regarded as a more suitable
    choice than a CT scan because MRI attends medical diagnosis without revealing
    of the body to radiation. MRI scan takes a lot of time and are bigger than other
    scans.


    # Ultrasound Imaging Technique


    Ultrasound utilizes high range of sound waves for producing the sort of 3D images
    by tissue. It is more generally associated with fetus image in pregnant women.
    Ultrasound is also applied for viewing the various inner parts of the human body
    such as abdominal organs, breast, heart,tendons, arteries, muscles and veins.
    It presents less anatomical details relative to CT or MRI scans. A significant
    improvement is ultrasound imaging helps to analyse the use of moving structures
    in actual time without emitting of radiation. Extremely reliable to practice,
    can be quickly performed without any unfavourable effects and relatively reasonable.


    # Endoscopy Imaging Technique


    Endoscopy employs an endoscope that is infused directly into the organ to study
    the hollow organ of the body. The variety of endoscope changes depending upon
    the site to be observed in the body and can be administered by a doctor.


    # Thermography Imaging Technique


    Thermographic imaging technique produces the graphic visualization with respect
    to surface variation of temperature of the body by measuring the infrared emissions
    out from it. The amount of radiation increases with an improvement in temperature.
    It is intelligent for capturing moving objects in real-time.'
