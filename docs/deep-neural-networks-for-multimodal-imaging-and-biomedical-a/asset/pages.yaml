  md: 'ation of a human. The impact or the outcomes of an assistive device should
    allow the measurement of making a betterment quality of life with the patient
    and make an impact on the technology used among the community of disabled people
    (Suresh, Udendhran and Balamurgan, 2019). Clinical processes are categorized with
