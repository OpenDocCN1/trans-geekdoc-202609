    # Accelerometers


    Several motion sensors deployed with smart phones and pedometers are the most
    widely used devices to continuously monitor the activities of the patients during
    their regular physical workout. Sensium is said to be the ultra low power sensor
    that is incorporated with the smart band aims to work well with the medical health
    monitoring systems. Several metrics that includes skin moisture, energy expenditure,
    body temperature, heart rate and other vital human signs could be measured by
    the smart band-aids. Fitbit and BodyBugg are the other technologies that come
    to wearable devices. But due to the discomforts and misplacement of sensors, these
    technologies find limitations in the pervasive computing society. For the optimal
    validity of data, work is required to overcome several challenges. Ignoring these
    challenges could lead to false physical activity recording and interfaces.


    Considering these limitations, accelerometers finds a scope that consumes less
    power and could be implemented easily and also present in several devices. They
    consume very low power and yield excellent performances. Accelerometers had already
    been implemented with animals such as rats (Chang, Hightower and Kveton, 2009)
    and cheetahs (Link, 2010) to study their movements and also their behavioral patterns.
    There are 4 major reasons for the implementation of these devices and determining
    the position of the human body.


    Adaptability and Usability- Based on the lifestyle, clothing and activities undertaken
    by the users, the pervasive monitoring systems must have the capacity to adapt
    to the varying location. This system promotes a pathway for the software developers
    for designing smart devices that can adapt to the surrounding environment. Automatic
    device localization permits smart phones to automatically adapt to the user’s
    requirements. Based on the configuration and their usage the system should adapt
    to that particular circumstance. For instance, if the smart phone is mounted by
    the user to their left arm position, then it could activate the cardiac workout
    mode.


    Accurateness-The patient’s conditional that include ultraviolet exposure, skin
    moisture and temperature are all determined by the Wearable non-intrusive embedded
    systems and their functioning greatly depends on the accurate placement of the
    position of the sensor. If the temperature of the body is determined then each
    body parts shows a varying temperature such as oral (33°C - 38°C), Rectal (34.5°C
    - 38°C) and Ear (35.5°C - 38°C). For the accurate hypothesis, the sensor should
    be placed on the particular region of the body as it may vary based on the different
    body location. This could misguide the caretakers or the clinicians due to the
    variation in data.


    Communication Optimization-Another wireless communication technology includes
    Intrabody communication (IBC) that utilizes the human body as a transmission medium
    (Naik, Singh and Le, 2010). There are two different categories under this technology:
    electric-field IBC (Miluzzo, Zheng, Fodor and'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Campbell, 2008) and wave-guide IBC (Shah et al. 2008). If the body-wearable
    sensor networks rely on the human body as the transmission medium then it finds
    a great advantage among the research field, but environmental factors and its
    effect has huge impalpable than the effect it has with the human body. Moreover,
    the human body also has certain deviation with the performance of the radio transceivers.
    This effect may also cause a heavy deterioration with the on-body and off-body
    communication systems performance (Wegmueller, 2007) (Xu, Zhu and Yuan, 2011).
    According to the quality of the channel, the communication power of the wireless
    device will be controlled by the automatic body localization that could have compensation
    with the negative impact of the body.


    Accuracy- The correct orientation and the placement of the motion sensors is highly
    required for the optimal operation of motion and energy expenditure that includes
    gyros and accelerometers (Misra, Dias Thomasinous, 2010). The relation among the
    device placement and the accuracy could be determined by the position of pedometer
    that could be fitted to any parts of the human body other than the waist, as the
    movement of the users will be projected with variations on the accelerometer.
    Table 1 shows the location of the pedometer having a greater impact with the step
    count and error estimation.


