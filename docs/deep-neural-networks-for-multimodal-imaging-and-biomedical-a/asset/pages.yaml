    # ## Background


    Recent work on deep neural network approaches has improved the performance of
    these visual recognition systems. In section, we focus on the convolutional neural
    network, supervised learning and the ImageNet database.


    # ## Motivations


    CNNs are described as a special type of artificial neural networks that is based
    on convolution, which is defined as a specialized type of linearity operation.
    They benefit from a capacity that can be controlled by varying these two elements:
    the depth and the width. In addition, they have a lower density of connections
    and parameters compared to the multilayer perceptron (MLP) which makes them easier
    to train.'
