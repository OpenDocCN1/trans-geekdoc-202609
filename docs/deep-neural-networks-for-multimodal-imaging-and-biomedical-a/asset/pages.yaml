    # HARDWARE AND SOFTWARE FOR DEEP LEARNING


    GPUs are parallel computing engines, which process the graphical datas per second
    than central processing units (CPUs). Among modern hardware, GPU deep learning
    is usually 10–30 times faster than on CPUs. By considering hardware, the motivation
    behind the most deep learning methods are existence of open-source software packages
    (OSS). The institutions which provide effective GPU implementation in deep neural
    network operations. The present most popular packages were detailed below.


    +   1. Theano (Bastien et al., 2012)- provides Python interface

    +   2. Tensorflow (Abadi etal., 2016)- provides C++ and Python and interfaces.

    +   3. Torch (Collobert et al., 2011)- provides a Lua interface and is used by
    Facebook AI research

    +   4. Caffe (Jia etal., 2014)- provides C++ and Python interfaces


    # DEEP LEARNING METHODS


    DL is one part of machine learning in AI use of multi-layered networks capable
    of translating the feature from datasets automatically in various tasks such as
    images, audi, video and text with high accuracy (Shen etal. 2017; Schmidhuber,
    2015). DL automatically will learn the complex data representation in a self-taught
    manner and identify more complex relationships between the input and output (LeCun
    etal. 2015). Several researchers and data scientists have become interested in
    using different DL methods to achieve record-breaking performances in various
    applications (Krizhevsky etal. 2012, Wu et al. 2016). DL methods are divided into
    5 principal groups (shown in Figure 2)


    +   1. CNNs

    +   2. Sequential models (Recurrent Neural Networks (RNNs))

    +   3. Deep neural networks (Auto-Encoders)

    +   4. Pre-trained models

    +   5. Deep generative models (Restricted Boltzmann Machines (RBMs))


    # CONVOLUTIONAL NEURAL NETWORK’S ARCHITECTURE (CNNS)


    It is one type of important DL algorithm to do image classification, recognition
    faces, object detections and image recognition etc.. CNN architecture consists
    of 3 different layers and its diagramatic representation as shown in figure 3.'
  merge: -1
