    The major part of the operation phase includes the computation part of Neuro-fuzzy
    system which is always referred as learning machine that further determines the
    parameters of a fuzzy system (i.e., fuzzy sets and rules) by tapping estimated
    methodologies from neural networks. Developing neuro-fuzzy infer-'
