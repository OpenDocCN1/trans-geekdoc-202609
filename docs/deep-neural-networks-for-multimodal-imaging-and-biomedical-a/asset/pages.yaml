    # MISSION


    The fields of biology and medicine are constantly changing as research evolves
    and novel engineering applications and methods of data analysis are developed.
    Continued research in the areas of bioinformatics and biomedical engineering is
    essential to continuing to advance the available knowledge and tools available
    to medical and healthcare professionals.


    The Advances in Bioinformatics and Biomedical Engineering (ABBE) Book Series publishes
    research on all areas of bioinformatics and bioengineering including the development
    and testing of new computational methods, the management and analysis of biological
    data, and the implementation of novel engineering applications in all areas of
    medicine and biology. Through showcasing the latest in bioinformatics and biomedical
    engineering research, ABBE aims to be an essential resource for healthcare and
    medical professionals.


    # COVERAGE


    +   • Data Mining

    +   • Tissue Engineering

    +   • Gene Regulation

    +   • Biochemical Engineering

    +   • Health Monitoring Systems

    +   • Orthopedic Bioengineering

    +   • Rehabilitation Engineering

    +   • Finite Elements

    +   • Protein Engineering

    +   • DNA Sequencing


