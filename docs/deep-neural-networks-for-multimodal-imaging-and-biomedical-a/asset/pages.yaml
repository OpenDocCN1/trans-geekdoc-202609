  md: '# KEY TERMS AND DEFINITIONS


    **Data Supplier and Data Miner:** Internet of things is said to be producer of
    data while machine learning is said to be data miner since it processes and analyzes
    the data produced from internet of things.


    **Intelligent Information System:** An intelligent information system is said
    to be the set of software and hardware that involves the skilled people for the
    process of decision making and co-ordination among the organization.


    **Rational Decision Making:** Rational decision making is said to be a crucial
    process unlike several other sectors, which offers certain provisions to the community.


    **Sensor-Cloud Infrastructure:** Sensor-cloud infrastructure could be a technology
    that integrates cloud techniques into the WSNs. It provides users a virtual platform
    for utilizing the physical sensors in a clear and convenient approach.


    **Ubiquitous Computing (UbiComp):** Ubiquitous computing (UbiComp) is characterized
    by the use of small, networked and portable computer products in the form of smart
    phones, personal digital assistants and embedded computers built into many devices,
    resulting in a world in which each person owns and uses many computers.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Chapter 14


    # The Pivotal Role of

    Edge Computing With

    Machine Learning and Its

    Impact on Healthcare


    Muthukumari S. M.

    Bharathidasan University, India


    George Dharma Prakash E. Raj

    Bharathidasan University, India


    # ABSTRACT


    The global market for IoT medical devices is expected to hit a peak of 500 billion
    by the year 2025, which could signal a significant paradigm shift in healthcare
    technology. This is possible due to the on-premises data centers or the cloud.
    Cloud computing and the internet of things (IoT) are the two technologies that
    have an explicit impact on our day-to-day living. These two technologies combined
    together are referred to as CloudIoT, which deals with several sectors including
    healthcare, agriculture, surveillance systems, etc. Therefore, the emergence of
    edge computing was required, which could reduce the network latency by pushing
    the computation to the “edge of the network.” Several concerns such as power consumption,
    real-time responses, and bandwidth consumption cost could also be addressed by
    edge computing. In the present situation, patient health data could be regularly
    monitored by certain wearable devices known as the smart telehealth systems that
    send an enormous amount of data through the wireless sensor network (WSN).


    # INTRODUCTION


    The large amount of generated healthcare data could be stored in the cloud environment
    maintaining their privacy that could be recommended to be viewed only by the concerned
    users. The physiological data could be obtained by the combined machine learning
    and signal processing modules in the


    DOI: 10.4018/978-1-7998-3591-2.ch014'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'traditional telecare systems. Machine learning algorithms are designed to run
    on the powerful servers.

    The connectivity problem faced by the IoT devices could be answered by the edge
    computing thus

    maintaining its efficiency even though the connectivity is poor. Several benefits
    are impacted with the

    edge computing technology (Ali Hassan Sodhro et al. 2018). First, the workload
    could be reduced for

    the medical experts by prioritizing the important task at the top level thereby
    managing the collected

    data. The second will be enabling the healthcare facility all over the remote
    area, where these facilities

    falls behind. For instance, a truck outfitted with the edge computing devices
    could visit certain remote

    villages and promote healthcare facilities by connecting the patient to the telehealth
    services (A. Tanaka

    et al. 2016). The third advantage is to stimulate the advancement of medical technology.
    Opportunities

    will be more with the enormous collection of data. Edge computing involves in
    managing and labeling

    the data in an efficient and uniform way that makes the data to be shared securely
    making the process

    easier (Á. Alesanco and J. García, 2010). Mining of data could also be made simple
    for the researchers,

    which was said to the difficult task in the past era. The greatest impact of edge
    computing will be the

    treatment of chronic diseases by monitoring the collected data (A. Monteiro et
    al. 2016). Certain disorders

    such as diabetics and congestive heart problems could be monitored continously
    with the combination

    of 5G cellular networks along with the IoT by in-home monitoring of patients.
    This chapter presents the

    state-of-the-art edge computing and machine learning techniques, which can enhance
    the biomedical

    applications (Bellman R. 1957).


    # BACKGROUND


    The development in the Internet of Things (IoT) and mobile usage has found a profound
    impact in the

    enhancement of cloud storage. Hyperscale data centers had been created due to
    the accelerated data center

    traffic that has been created by the increased usage of cloud computing environment
    (B. M. C. Silva et

    al. 2015). The data storage capacity should increase significantly due to the
    growth of IoT based applica-

    tion, which plays a major role in Smart city, Healthcare and Industries. According
    to the prediction done

    by the Cisco Global Cloud Index, the workload created by the cloud environment
    will be increased by

    94% and the traditional data center will be just 6% by the year 2021(B. Mei et
    al. 2015). Certain impacts

    limit the blooming cloud infrastructure and reduce its flexibility that is as
    follows:


    +   1. **Latency/Determinism:** The time delay created among the interaction of
    IoT devices and the cloud

    +   is known as latency. Certain industries like Electronics Health Records (EHR)
    and Telemedicine

    +   has a major concern with the latency requirements and this impact must be
    concerned essentially.

    +   2. **Data/Bandwidth:** According to Statistics, the installation of IoT devices
    could increase by 31 bil-

    +   lion worldwide by the year 2020. In generating the medical records, at least
    15-20 devices should

    +   be connected at each patient’s bed, which increases the data rate. This causes
    a limitation in the

    +   network bandwidth, overpowering the cloud and also increases data traffic.

    +   3. **Privacy/Security:** According to IBM data breach study, the security
    and the privacy of each pa-

    +   tient’s data in the healthcare line could be affected due to the increased
    data breach cost, which

    +   will be about $480 per patient and this cost could be three times the data
    cost of other industries.


    Edge computing is highly advantageous as the data could be processed and filtered,
    thereby sending

    only the useful data to the cloud (C. Orwat et al. 2008). This facility brings
    the cloud computing to the'
