    # Cluster Formation and Cluster-Head (CH) Selection Module


    Without the involvement of separate algorithm for clustering, BS forms the static
    clusters based on the horizontal and vertical lines that are originated from fixed
    coordinates which is refereed as Cluster Segregation Point (CSP). Thus, approximately
    four cluster zones namely UL, UR, LL, and LR zones are formed which is depicted
    in figure 3.


    Since all the nodes in the network are of homogenous type, each and every parametric
    values and processing capabilities are also found to be same. Thus, initially,
    a randomized node which is very close to the CSP is chosen as Cluster Head (CH)
    in each zone. After this, all the Chosen CHs broadcast its selection information
    as an advertisement messages to all other non-CH nodes within their zonal range'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Figure 3. Cluster Formation


    ![](img/a636f78302652a9c2ec5900d81fba475_256_0.png)


    of the network. The non-CH nodes which receives the advertisement message, replies
    to the corresponding CH along with their essential information like location coordinates,
    and current energy status. Now each CH node estimates the distance of all the
    cluster heads from its current coordinates.


    # Data Transmission Scheduler Module


    The proposed scheme employs conventional TDMA (Falconer et al., 1995) technique
    for synchronized data transmission. The selected CHs in each zone allocate data
    transmission slots to all nodes within the cluster zone. Thus, except slot_0,
    the odd numbered slots to all of its non-CH nodes for data transmission whereas
    all the even numbered slots are assigned to itself. During the broadcast of slot
    allocation, all CHs embed its local time to all non-CHs for synchronization purpose.
    Hence, through this procedure, the proposed scheme prevents collision and enables
    traffic-free communication. At the session of slot_0 all the non-CHs nodes adjust
    its local clock to the timestamp of CHs. Figure 4 shows the sample slot allocation
    strategy.


    # Operational Phase


    # Sensing Module


    The initial part of operation phase involves sensing module that further comprises
    soil moisture, temperature and sensor modules. Here, BE-000030 Xcluma Soil moisture
    sensor module is utilized. Soil moisture module is most sensible device, usually
    employed to monitor the moisture cognitive content of the soil. In other words,
    it assesses the volumetric cognitive content of water present in the soil and
    denotes the moisture measure in terms of voltage. It also has the tendency to
    provide both analog and digital resultants. Most of the analog output measures
    are in term of percentage mapped between the range of 0 and 100. Figure 5.a, depicts
    the sample device of BE-000030 Xcluma Soil moisture sensor module.'
