  md: '# Figure 4. IoT Communications in multi-domains


    ![](img/a636f78302652a9c2ec5900d81fba475_100_0.png)


    Council, the healthcare institutions don''t seem to be keen on building sensible
    healthcare systems supported the IT technologies, particularly in developing countries.
    The under-utilization of IT technologies prevents the wide information sharing
    and processing in healthcare industry. Cloud computing paradigms alter a virtual
    mechanism for IT resource management and usage. Sensor-cloud infrastructure could
    be a technology that integrates cloud techniques into the WSNs. It provides users
    a virtual platform for utilizing the physical sensors in a clear and convenient
    approach. Users will manage monitor, create, and check the distributed physical
    sensors while not knowing their physical details, however simply using a few of
    functions. Cloud computing provides the IT resources for WSNs, that supports the
    storage and quick process of a large amount of detector information streams. The
    connection between WSNs and clouds is enforced by two kinds of gateways: sensor
    gateways and cloud gateways, where sensor gateways collect and compress data,
    and cloud gateways decompress and process data.


    Sensor-clouds are utilized in various applications, like the disaster prediction,
    atmosphere watching and healthcare analysis. Sensor-clouds collect knowledge from
    totally different applications and share and process the information based on
    the cloud computational and storage resources. An interface is provided to the
    users to manage and monitor the virtual sensors. In Sensor-clouds, the sensor
    modeling language (SML) is utilized to explain the data of the physical sensors,that
    is processed as the metadata of the sensors. The standard language format allows
    the collaboration among sensors in several networks and platforms. The XML encryption
    additionally provides a mapping mechanism for transforming commands and information
    between virtual and physical sensors.'
