    # DISEASE IDENTIFICATION AND DIAGNOSIS


    The major role played by the machine learning is to detect the disease through
    the image processing techniques, which could be very hard through the normal diagnosis.
    This disease could be anything like genetic disorders or cancers that is very
    difficult to be diagnosed at a very initial stage (K. Zhang et al. 2016).


    Integration of cognitive computing with genome-based tumor sequencing done at
    IBM Watson Genomics is the very best example through which fastest diagnosis could
    be done. Therapeutic treatments are done with the AI based bio pharma followed
    by Berg in oncology (P.W Lavori, 2000). Moreover PIvital’s PReDicT (Predicting
    Response to Depression Treatment) aims in promoting normal clinical conditions
    for the disease diagnosis and treatment.


    # DRUG DISCOVERY AND MANUFACTURING


    Drug discovery process at the early-stage is one of the primary applications of
    machine learning. Precision medicine and Next-generation sequencing are certain
    R&D technologies included with this technique that could determine another alternative
    approach for the treatment of multiple diseases (L. M. Vaquero and L. Rodero-Merino,
    2014). Unsupervised learning is a technique of machine learning that could identify
    patterns in the given data without providing any predicted output. Microsoft developed'
