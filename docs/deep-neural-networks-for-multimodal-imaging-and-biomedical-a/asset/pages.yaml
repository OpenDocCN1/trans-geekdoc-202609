  md: '# Indication of Thoracic Abnormalities and Condition


    Quick actions are required for the patients suffering from pneumonia and pneumothorax,
    both are said to be the dangerous situation that may lead to death of the suffering.
    AI algorithm also helps in dealing with the prime target of certain diseases.
    If untreated, pneumonia inflames the air sacs in both the lungs with the infection
    caused with the filling of fluids, which can cause issues with the breathing and
    also leads to threaten the life (Holzinger, 2016). The condition of the lungs
    could be diagnosed for pneumonia with the radiology images and helps in differentiating
    the condition with the bronchitis. If the patient is already suffering from cystic
    fibrosis or malignancies then it will cause difficulty for the radiologist to
    detect the disease by reading the images. Therefore, conventional imaging methods
    tend to cause difficulties in analyzing pneumonia if the patient is already suffering
    from any sort of lung problems.


    If little amount of pneumonia exceeds the dome of the chest below the diaphragm,
    then it will be necessary for the CT scan to be taken that could be difficult
    for the normal imaging techniques to identify, which could be avoided with the
    use of AI tools and algorithms (Ashburner, 2007). For effective and quickest treatment
    of diseases, AI algorithm promotes speed access to the x-ray images for evidence
    of opacities with the effective diagnosis of pneumonia (Mazura et al. 2012).


    Pneumothorax is a condition that occurs when air leaks into the space among the
    chest walls and the lungs. The disease is caused mainly due to the penetrating
    chest injury (blunt) or certain lung infections that causes high risk to the patients,
    which can be identified with AI when the patients are suspected for the disease.
    This disease introduces air pockets among the chest and the lungs that could also
    lead to trauma or invasive interruption. This condition could be treated at the
    earlier stage but when left untreated could also lead to dangerous situation.
    AI helps in prioritizing the severity and the type of pneumothroaxes that might
    require immediate treatment (Viceconti, Henney, Morley-Fletcher, 2016). The patients
    could also be monitored with the AI tools over time. The main advantage of AI
    in detecting pneumothoraces is that it helps in differentiating the size of the
    disease from the previous state. According to ACR DSI, “though several use cases
    are required for the Artificial Intelligence to be tested for its efficiency,
    it appears to be a confident tool in the field of medical imaging”. Disease that
    might to be difficult for the human eye to visualize could be easy for the AI
    tools in diagnosing and making decisions, leading to the betterment of treatment
    with injuries, diseases and certain other situations that may be cured when identified
    at earlier cases.


    # Detection of Breast Cancer


    Medical imaging system could also be used to detect the colon and breast cancer
    so that it might be helpful for the radiologist to diagnose the disease at the
    earlier stage. Micro-calcification is a term that refers to the tiny deposits
    of calcium salt in the tissues that could make the imaging methodologies difficult
    for the radiologist to detect the tumor cells as malignant or benign. Sometimes
    the false negative results which meant that the disease is wrongly indicated or
    some missed malignancies would results in unnecessary invasive testing or worse
    diagnosis (Shin, Roth and Gao, 2011). According to ACR DSI, “Certain variation
    could occur due the interpretation of micro-calcifications done by the radiologists
    during the diagnosis period”. The most accurate method which uses quantitative
    imaging features and identifying the micro-calcification by its level could be
    AI. Thus, AI could decrease the rate of unnecessary non-cancerous biopsies.'
