  md: 'The contextual and non-contextual are two segmentation techniques. A method
    of non-contextual image segmentation is a non-linear operation that transforms
    a gray-scale into a binary image is thresholding. A binary image reduces the data
    complexity and simplifies the process of recognition and classification that is
    obtained by non-contextual image.


    # Contextual Segmentation


    This involves separating individual objects as it is intended for pixels closeness
    that belongs to an individual object. Image Segmentation emphasizes on discontinuity
    of signal and similarity. Identifying the boundaries by encircling within the
    uniform regions and visualizing the abrupt signal changes through each boundary
    are discontinuity-based technique. Similarity-based is the region created uniformly
    by grouping together all similar pixels that satisfies definite criteria. Two
    methods reflect each other and holds responsible for a complete one region boundary
    splits into two parts.


    # Non-Contextual Segmentation


    Non-contextual segmentation group pixels based on the definite attribute with
    no regard to the relative locations of the image feature.


    # Thresholding


    The simpler technique of non-contextual segmentation is where transformation of
    grey-scale image to binary and is known as binary region map (BRM). The two disjoint
    regions of BRM are: one that has input data pixel values lesser than threshold;
    and other the pixels values with the same value of threshold or greater. Thresholding
    is a non-linear operation that transforms a gray-scale image into a binary image.
    The two levels assigned to pixels are below or above the specified threshold value
    i.e if a pixel value is above threshold value, it is assigned one value for white,
    and other is assigned black. The grey-level pixel thresholding is given as: p(a,b)
    = 0 if q(a,b) < Th and p(a,b) = 1 if q(a,b) >= Th, where Th represents the threshold.
    Two thresholds, Th1 < Th2, grey level region1 range is given as p(a,b) = 0 if
    q(a,b) < Th1 or q(a,b) > Th2 and p(a,b) = 1 if Th1 <= q(a,b) <= Th2.


    # Color Thresholding


    Color segmentation gives more accurate information at the pixel level when compared
    with grey images. HSL (hue, saturation, and luminance), HSV, HSI, or other models
    are used in computer vision and image analysis for feature detection or image
    segmentation. The robust interrelated color components are present in Red-Green-Blue
    (RGB) standard color, while other colors (HSI) reduces redundancy, and decide
    the actual object/ background colors regardless of illumination, and achieve better
    stable segmentation. The color space partitioning in RGB or HSI is performed out
    by division of color images. The method is established on a leading color (R0,
    G0, B0) and Cartesian distances threshold from each pixel color f(a,b) = (R(a,b),
    G(a,b), B(a,b)):'
  merge: -1
  img_proc: true
