    # The Working of ANN Model


    ANN is organized in layers with the series of neurons; where each neuron is inter-linked
    through a weighted link with neurons in the next layer. In simple terms, ANN is
    designed by input layer, one or more hidden layers (HL) and an output. The model
    complexity is obviously decided by the number of neurons and the layers present
    in it. The input layer takes the data and transfers the neurons through the weighted
    links in the first HL. The data are processed and the outcomes are reassigned
    to the neurons in the next layer, the network’s output is achieved in the last
    layer shown in figure 2 (Amato, 2013). ANNs named as connection-oriented networks
    (Sarasvathi & Santhakumaran, 2011) includes processors performing parallel with
    the set of inputs taken at a time and producing output based on processing algorithm
    (Gharechchopogh, 2013).


    Figure 2. NN model with hidden layer


    ![](img/a636f78302652a9c2ec5900d81fba475_136_0.png)


    The n inputs values are represented by xp, x2..., xn in figure 3. Each of the
    inputs have the weights wp, w2,...,wn. The input values are multiplied by the
    weight and summed as follows in the Eq. (1) (Bishop, 1995). A single layer NN
    is called perceptron (Bishop, 1995) whereas a MLP is called Neural Networks'
