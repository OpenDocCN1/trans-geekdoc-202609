  md: 'tion of the accelerometer on the human body by analyzing the walking sequence.
    The impact on each step is evaluated by the frequency domain features due to the
    energy distribution among the foot and the floor, which is shared among the entire
    body. The closer the sensor location from the foot (origin of strike for every
    step) the stronger will be the energy sensed by the accelerometer. The range of
    motion in all three directions will be analyzed and evaluated by time-domain features.
    Certain limbs move freely than the other, which is necessarily considered. SVM
    algorithm first approximates the sensor orientation at every time interval of
    10s through the DC value calculation by Fourier transformation. By considering
    the consecutive approximations, the total amount of orientation variables is estimated
