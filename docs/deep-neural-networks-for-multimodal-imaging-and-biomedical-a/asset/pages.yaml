    can be supervised, unsupervised, semi-supervised and reinforcement learning. DL
    performance is based on neural network (NN) modeling for huge data and requires
    faster processors for better outcomes. These techniques are very powerful in segmentation
    and detection of tumors in the healthcare. DL has the potential in transforming


