    # FETAL MIDDLE CEREBRAL ARTERY SEGMENTATION USING MCANET


    Recently women facing high-risk pregnancy are increasing at a faster rate because
    of delayed marriage and child bearing. Foetal growth is affected very much by
    pregnancy related complications leading to abnormal child births. Risks associated
    with complicated pregnancy outcomes are assessed using Doppler ultrasonic blood
    flow signals which reflect the changes of blood circulation in a foetal blood
    circulation. The MCA Net architecture for Middle Cerebral Artery segmentation
    is shown in Fig.10., which consists of a convolution block with the kernel size
    7 × 7, stride 1 and padding 3. .Similar blocks follow the above convolution block.
    In the following convolutional blocks 2, 3 and 4, the first convolution operation
    provides down sampling with the kernel size 1 × 1 and stride 2 and the remaining
    convolution operations use stride 1. The convolutional blocks 5 and 6 use dilated
    convolution with dilation 2 and 4. In the sussequent layers of the network residual
    connections were removed and dilated convolution with dilations 2 and 1 is used.
    Removing residual connections in susequent blocks eliminate gridding artifacts
    due to dilated convolutions, which results in the improvement of prediction accuracy
    . Here dense up sampling is done instead of normal up sampling to recover the
    decoded feature map. Dense upsampling is done using a 3×3 filter kernel and stride
    1 which results in the reduction of dimension and computation. Batch normalization
    operation leads to training with large learning rate and the pixel'
  merge: -1
