  md: 'manual extraction of coronary tree. The accuracy of this approached had been
    improved with the trained method that uses 12,000 synthetic 3D coronary models
    of several anatomies and CAD degrees that computes the CT-FFR values based on
    CFD. Machine learning based approach had been used in training the coronary models
    with the CT-FFR application (Schier, 2018). This CT-FFR model is again trained
    with the Deep learning model that incorporates the extracted features from the
    coronary tree geometry.


    AI has the capability to shift the Magnetic Resonance Imaging (MRI) to the next
    level. A novel method based on the cascade CNN for dynamic MRI reconstruction
    had been developed (Schlemper et al.). Cardiac MRI depends on the under-sampling
    scan time, however de-aliasing requires complex algorithm implementation for obtaining
    the resultant image. Current prevailing methods depend on the sparsity requirement
    and incoherence among the sparsity and sampling domains, which are known to have
    intense computation (Pluim, Maintz and Viergever, 2003). De-aliasing the images
    with the generic strategy could be done by deep learning methodology easily without
    any formulation rules.


    Practically, AI methodology greatly adapts in dealing with the classification
    and segmentation process in the medical imaging that has been widely adapted by
    the radiologist. Cardiac MRI had been greatly used and it also varies from patient
    to patient with the scanning time and also depends on several parameters, which
    enforce several challenges in the interpretation and also make necessity for the
    pre-processing (Chen et al. 2018). Normalization, orientation alignment and bias
    correction are the common factors required by the AI algorithm before feeding
    the data into the tool. Quantitative measures are mainly evolved in retrieving
    the present diagnosis criteria, which gives a normal indication and variation
    among the normal and pathologic process obtained from several degrees of the body.
    These parameters are determined from the manual operators usually from the radiologist.
    Difficulties in the process automation arises due to the inconsistency of cardiac
    shape, basal and apical slices, inconsistency among several scanners and imbricate
    among the heart and the background with the noise and fuzzy margins.


    Cardiac structures could be obtained by nuclear imaging techniques that includes
    single-photon emission computed tomography (SPECT) and positron emission tomography
    (PET) in case of CT imaging modalities that needs the ionizing radiation to obtain
    the structure of the heart and other surrounding membrane (Prior, Brunsden and
    Hildebolt, 2009). The evaluation of the diagnosis should be done with the lowest
    possible radiation so that it does not cause any harm to the human body. The proposed
    CNN techniques had not been used widely in the field of medical imaging, but it
    can work with the image that had been obtained with the low dose rate, which could
    be noisy and blurry at certain times. The diagnostic accuracy of SPECT myocardial
    perfusion imaging (MPI) could be enhanced with the machine learning approach that
    is still under study.


    # Detection of Musculoskeletal Injuries


    Patients with any miniature fractures and musculoskeletal injuries may suffer
    from chronic pain if they are untreated and not quickly determined. The constrained
    mobility and hospitalized elderly persons will face a major problem of hip fractures,
    which are sustained for a long term and also very difficult to treat if they persist.
    Fractures, soft tissue injuries and certain dislocation are difficult to detect
    but with the AI this becomes simple to detect that helps the caretakers and surgeons
    to have more confident with their treatment prospects.


    Fractures can sometimes be left and heralded when medical diagnosis is carried
    out for trauma related problem, while it''s imaging is considered to be a primary
    clinical concern. Example of trauma related image diagnosis problem with AI technology
    includes the analysis of cervical spine fractures'
