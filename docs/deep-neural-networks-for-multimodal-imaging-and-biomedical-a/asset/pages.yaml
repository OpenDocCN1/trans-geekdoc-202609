    abstract features acquired from data (e.g., Tomography images). It holds the potential
    to perform automatic medical image segmentation tasks in different medical imaging
    modalities, like lesion/nodule classification, organ segmentation, and object
    detection. Since Alex Net a deep convolutional neural network (CNN) and a representative
    of the deep learning method, won the 2012 ImageNet Large Scale Visual Recognition
    Challenge (ILSVRC), deep learning began to draw attention within the field of
    machine learning. One year later, deep learning was selected together of the highest
    ten breakthrough technologies, which further consolidated its position because
    the leading machine learning tool in various research domains, and particularly
    generally imaging analysis (including natural and medical image analysis) and
    computer vision. To date, deep learning has gained rapid development in terms
    of network architectures or models, like deeper network architectures and deep
    generative models. Meanwhile, deep learning has been successfully applied to several
    research domains like Computer Vision, speech recognition, Remote Sensing and
    medical image analysis, thus demonstrating that deep learning may be a state-of-the-art
    tool for the performance of automatic analysis tasks, which its use can cause
    marked improvement in performance. Recent applications of deep learning in medical
    image analysis have involved various tasks, like traditional diagnosis tasks including
    classification, segmentation, detection, registration, biometric measurements,
    and quality'
