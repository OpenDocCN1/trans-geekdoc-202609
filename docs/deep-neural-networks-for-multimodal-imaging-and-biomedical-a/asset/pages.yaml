  md: 'by pooling layer along the spatial dimensions (width, height), resulting in
    volume such as [16 x 16 x 12] and used widely in CNN. ReLU''s does not activate
    all neurons at the same time rather converts all negative inputs to zero from
    the image and neurons do not get activated. This makes it very efficient in computational
    as few neurons are activated per time. ReLU converges six times faster than TanH
    and sigmoid activation functions and does not saturate at the positive region.


    The process of subsampling is known as Maxpooling, here the input representation
    i.e image or matrix from hidden layer output is down-sampled by dropping its network
    parameters that helps in shrinking overfitting. The peak pixel value from a region
    depends on its size is considered by maxpooling. The pool size is 2 x 2 pixels
