    # DIAGNOSING MEDICAL IMAGES


    Computer vision is said to be a successful technology that works with the combination
    of Deep learning and machine learning. Image analysis had been done in Microsoft
    with the initiative technique called the Inner Eye mainly developed for the diagnosis
    of diseases with the images (S.A. Murphy, 2004). Due to the huge growth of medical
    data, machine learning plays its role in diagnosing the disease from the medical
    images with the role of AI.


    # SMART HEALTH RECORDS


    Due to the update of technology, the maintenance of up-to-date medical reports
    could be highly possible with the special algorithms implemented for the data
    entry process. But still medical data entry takes time thereby increasing complexity
    (R. Bellman, 1957). This could be highly reduced with the machine learning techniques
    thereby producing high efficiency, saving cost, reducing computational time and
    effort.


    The techniques such as ML-based OCR recognition and vector machines steps into
    the document classification methods and finds its place in machine learning-based
    handwriting recognition technology in MATLAB and Google’s Cloud Vision API (G.
    Muhammad et al. 2014). MIT advances their development process to the next generation
    by stepping into the machine learning based tools that helps in the suggesting
    the clinical treatment with the diagnosis.


    # CROWD SOURCED DATA COLLECTION


    In the healthcare field, crowd sourcing is found to be a rage due to the numerous
    amounts of medical data uploaded by the people and that helps the researchers
    and caretakers with the plenty of information. This type of real-time health data
    produces high consequences in such a way medicine will be apparent down the line
    (M. S. Hossain and G. Muhammad, 2015). Machine learning based face recognition
