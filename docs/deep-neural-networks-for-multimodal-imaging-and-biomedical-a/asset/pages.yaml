    # AlexNet


    Introduced by Alex et al in 2012. It is described among the first CNN for image
    classification. He won the ILSVRC in 2012, consisting of 5 convolutional layers
    followed by 3 fully connected layers. This architecture (figure 4) is of significant
    importance in the new generation of CNN and has opened a new line of research
    on CNN. AlexNET (Alex Krizhevsky, 2012) is the first architecture that has used
    the non-saturated ReLu activation function (linear rectified unit) for the non-linear
    part, instead of a Tanh or Sigmoid function that is the norm for traditional neural
    networks. This function is placed after each convolutional and fully connected
    (FC) layer. The use of this function was to improve the convergence rate by mitigating
    the problem of the disappearance gradient.


    This architecture (Alex Krizhevsky, 2012) uses five convolution layers with a
    Local Response Normalization Layer (LRN) after the first, the second convolution
    layer, and a max-pooling layer after the first, the second, the fifth convolution
    layer. An advantage in this architecture is that it solved the over-adjustment
    problem by using a Dropout layer after each FC layer. This network requires 62.4
    million parameters and offers an ImageNet TOP 5 error rate equivalent to 16.4%.
    It is noted that this model is formed for about 90 cycles using a stochastic gradient
    descent (SGD) with:


    +   - Momentum of 0.9.

    +   - Decrease in weight: 0.0005.

    +   - Batch size: 128.


    The weights are initialized from the mean Gaussian zero distribution with a standard
    deviation of 0.01, N (0, 0.012), the conv1 and conv3 biases are initialized to
    zero, the other biases are initialized to 1. The Learning was initialized at 0.01
    and reduced 3 times before the end where it divided by 10 when the validation
    error rate has stopped improving with the current learning rate.


    # Figure 4. AlexNet architecture


