  md: '# UNET


    In case of lack of training data, U-Net is a good choice. U-Nets have an ability
    to learn in environments of low to medium quantities of training data, and the
    amount of training data available is considered low. Also, a U-Net can be adapted
    to recent research, since its architecture is quite similar to the PSP Net or
    the One Hundred Layers Tiramisu, which are recent improvements such as for when
    dealing with more data. It is called a U-Net because it makes the shape of a U.


    A U-Net is like a convolution auto encoder, but it also has skip-like connections
    with the feature maps located before the bottleneck (compressed embedding) layer,
    in such a way that in the decoder part some information comes from previous layers,
    bypassing the compressive bottleneck. See the Fig. 3 below.


    Thus, in the decoder, data is not only recovered from a compression, but is also
    concatenated with the information''s state before it was passed into the compression
    bottleneck so as to augment context for the next decoding layers to come. That
    way, the neural networks still learns to generalize in the compressed latent representation
    (located at the bottom of the “U” shape in the figure), but also recovers its
    latent generalizations to a spatial representation with the proper per-pixel semantic
    alignment in the right part of the U of the U-Net.


    It is called a U-Net because it makes the shape of a U. To optimally train a U-Net,
    one needs to considerably augment the dataset. The 3rd place winners used the
    4 possible 90 degrees rotations, as well as using a mirrored version of those
    rotation, which can increase the training data 8-fold: this data transformation
    belongs to the D4 Dihedral group. We proceeded with an extra random 45 degrees
    rotation, augmenting the data 16-fold, which represents the D8 Dihedral group.
    Thus every time an image is fed to the network, it is randomly rotated and mirrored
    before proceeding to train on that image. In the official U-Net paper, some elastic
    transforms are also used in the preprocessing. I think it would be interesting
    to use such data transformations, as depicted on a Kaggle kernel from another
    similar competition. In our pipeline, we also normalize every channel of the inputs
    and then use per-channel randomized linear transformations, for every patches.


