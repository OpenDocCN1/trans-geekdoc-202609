  md: 'if the patient had been reported for neck and head trauma. Very delicate and
    exquisite variations in the human body abnormal could also be detected with the
    AI imaging tools, which is very difficult for the normal diagnostic tools to detect
    (Lee et al. 2018). This helps the doctor to make variations among the condition
    that requires surgery in case of perpetual instability. AI could also help provide
    safety measures for the patient suffering with hip joint pain in providing sufficient
    surgery treatment for the replacement (Tang et al. 2018). More that 4,00,000 total
    hip arthroplasties (THAs) having performed in a year and patience to arrive for
