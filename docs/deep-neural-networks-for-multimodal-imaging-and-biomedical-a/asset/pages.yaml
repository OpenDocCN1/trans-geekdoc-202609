    # EDGE COMPUTING BASED APPLICATION FOR HEALTHCARE IMAGE PROCESSING


    The integration of several smart systems along with the smart healthcare falls
    into the category of smart cities. This successful endeavor is possible only with
    the combination of cloud computing along with the edge computing process. The
    resources and the process are assigned with the proposed healthcare system that
    comes out with the perfect workflow and pool of resources. The completion of the
    assigned task will be notified by its own edge nodes for every resource. Then
    the cloud environment plays a role in reassigning the resources with the scheduling
    algorithm. Rather than the regular client-server computing, cloud computing is
    found to be more effective, reliable and it is also said to be faster. Cloud also
    supports the fault tolerance policies and hence the workflow will also be ensured.


    The cloud-fog based workflow system had been presented in figure 7. The software
    related to the workflow and the databases are stored in the cloud and on the other
    hand assigning the task with the completion of task notification will be send
    from the edge node to the cloud infrastructure. Tablet and cell phones acts on
    the edge node, which are said to be the resources of the smart devices. When the
    task assigned is accomplished by the resource then the respective notification
    will be send by the edge node to the cloud that the particular resource is available
    at the pool for it to be re-assigned.


    The communication mode among the medical team and the cloud in the base station
    is shown in the above figure. This communication is said to be mobile and wireless.
    In this level, the edge and fog are found to be alike. The fog and the edge computing
    push the computing and processing capabilities closer to the originated place
    of the data. In the above framework, the data is found to be closer to the smart'
