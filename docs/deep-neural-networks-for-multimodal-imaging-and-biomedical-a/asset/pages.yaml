    The gait analysis is less invasive for deploying biometric authentication systems,
    conflicting to other techniques such as fingerprint, voice and iris movement analysis.


    # Kinect Sensors


    Several advanced sensing hardware is incorporated with the Kinect sensors that
    contain a color camera, depth sensor and microphone array, which promotes facial
    recognition, 3D motion capture of an entire body and voice identification capacities.
    The inside view of the Kinect sensor is composed of an IR camera and an IR projector
    (depth sensor consist of these elements). The depth sensor is of monochrome complementary
    metal-oxide semiconductor (CMOS) and the IR laser acts as a projector. The Kinect
    sensor has an extended usage apart from the gaming technology, which could be
    used as a sensing technology from helping the autism children to guiding the doctors
    in the operation. This sensor works in the structured light principle. The IR
    laser that acts as a projector is passed through the diffraction grating system
    and it turns into a set of IR dots. This IR dots could be viewed by the IR camera.
    With the triangulation, the 3D image could be constructed if the dot observed
    in the image could be matched with the dot observed in the projector pattern.
    Normalized cross-correlation technique could also be used in comparing the small
    neighborhoods from the IR image and the projector pattern as the produced dot
    pattern is random. The depth values are encoded with the grey values; if the point
    is closer to the camera, then the pixel will be dark. If the points are too far
    then the depth value could not be compared and computed accurately and if the
    points are too close then a blind region will be developed indicating a necessity
    for a field of view among the camera and the projector.


    At certain cases, if the calibrated value of the IR camera and the projector are
    not valid, then this may lead to inaccurate depth values. This is due to the vibration
    or heat produced by IR projector during any sort of drift or transportation. This
    could be well answered by recalibrating the Kinect sensors through the camera
    calibration techniques. The depth value depends on the following equation:


    ```

    Z_{measured} = \alpha Z t_{me} + \beta \quad (1)

    ```


    Here, α and β are the values determined for the recalibration. Rather than this
    technique, complex distortion model could also be used that follows the same procedure.
    The feature points of the 3-D coordinate on the calibration card is determined
    by the recalibration technique with the help of RGB camera'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'that is said to be known as the true values. Meanwhile, Kinect sensors also
    promote feature points of the 3-D coordinates in the IR camera’s coordinate system.
    The values of α and β are determined by minimizing the distance among the two
    set points thereby promoting a rigid transformation among IR and RGB cameras.
    A human body is represented with the number of joints from the neck, head, shoulders
    and arms in the skeletal tracking. The joints are represented in the form of 3D
    coordinates. The main aim of this system is to determine the 3D coordinates of
    a body with effective usage of resources and permits fluent interactivity. As
    an intermediate process, per-pixel body part recognition has been proposed (Thevenot,
    Toth, Durs and Wilson, 1999). This process could avoid combinatorial search in
    various joints of the human body. Over fitting could be avoided by using deep
    randomized decision forest classifier while classifying numerous images. The classifier
    could also run separately on each pixel with the Graphics Processing Unit (GPU)
    that could speed up the entire process. Finally, by computing spatial modes of
    the inferred per-pixel distributions with the mean shift could result in the 3D
    joint proposals. The schematic representation of Kinect sensor with the skeletal
    tracking of various body parts and per-pixel body part recognition has been shown
    in figure 3-5.


