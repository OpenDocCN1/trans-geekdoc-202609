    Fire has been characterized into five unique classes dependent on its source and
    how it tends to be contained inside a structure. These classes include:


    +   Class A: This fire includes normal ignitable materials, for example, paper,
    wood and material fibre. This class of fire can be extinguished by cooling, covering
    or wetting of the structure. Likewise, dousing specialists can be utilized to
    annihilate the fire.


    +   Class B: These are fires which include combustible fluids, for example, fuel,
    thinners, oil-based paints and oils. To kill this kind of fire, Extinguishers,
    for example, carbon dioxide, dry concoction and hydrogenated specialist types
    can be utilized.


    +   Class C: This sort of flames includes the consuming of electrical gear, where
    a non-leading vaporous clean specialist or covering operator is expected to put
    off the fire.


    +   Class D: These are fires which occur because of the ignition of metals, for
    example, magnesium, sodium, potassium, and aluminium. Uncommon dry powder dousing
    operators are required for this class of fire to be annihilated.


    The hazards caused due to the fire are broadly classified from the prescriptive
    of the codes and standards that are initiated in a very specific manner along
    with the installation of the fire protection system suitable for the particular
    situation. These systems are initially designed and tested before they are bought
    under the application performance. There are several benefits by the Prescriptive
    codes and standards since they are very easy for the enforcement and application.
    Additionally, the building that are constructed with the Prescriptive codes and
    standards tends to manage well during the fire situation and have a good history
    of performance. But they do not guarantees for standard level of safety with the
    cost privilege. For instance, store that are bought under the classification of
    mercantile occupancies, with one side of the store selling the greeting cards
    and the other part with the liquor bottles tends to adapt the same protection
    guidance but the fire hazard happening at both the shops could be different.


    From the above situation, it is known that the whole building should be necessarily
    considered for implementing the fire safety that is promoted by the “Performance-based
    design” tool. “Performance-based design” is an engineering approach to fire protection
    design that depends on the following factors:


    +   Based on the essential fire safety objectives and goals


    +   The fire scenario consideration and analysis


    +   Based on the performance criteria, engineering tools and methodologies, the
    quantitative measurements are generated with the sufficient fire safety objectives
    and goals.


    Fire safety objectives of a building could be obtained by considering the performance-based
    design. Environment protection, property protection, life safety and mission continuity
