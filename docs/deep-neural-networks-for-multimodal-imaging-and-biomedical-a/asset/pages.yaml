- pgno: 108
  md: 'is an interesting local operation like convolution. This operation consists
    of generating the dominant response by summarizing similar information near the
    receptive field in the local region. These layers make it possible to reduce the
    spatial dimensions of each input (generally the inputs are images) by replacing
    a group of pixels by a single pixel representing either the maximum value (Max
    pooling) or the average of these pixels (average pooling). Although pooling layers
    reduce spatial resolutions, they keep the same number of incoming images. This
    reduction in the size of feature maps regulates the complexity of the network
    and contributes to the fight against over-adjustment. Fully connected layers are
    sometimes used as the last layers of CNN or the penultimate. These layers are
    localized after many convolution and pooling layers. The fully connected layers
    are identical to the multilayer perceptrons (MLPs). They are mainly used at the
    end of the network for classification. In this layer, each neuron is connected
    with all the combinations of the outputs of the neurons in the previous layer,
    which leads to a density of connections that is very high compared to those in
    the convolution layers (Dou Q, 2017), (N. C. Camgoz, 2016). The fully (fully)
    connected layer is described as a vector of the neurons of a surfacing of different
    volumes received from the previous layer (Dou Q, 2017), (N. C. Camgoz, 2016).


    # Batch Normalization


    This layer is introduced in 2015 by Google researchers (Szegedy, 2015). It is
    usually located after fully connected layers or convolutional layers, and before
    non-linearity. It alleviates the problems associated with internal covariance
    lag in feature maps by normalizing the output distribution of the layer to zero
    mean (unit variance). The use of this layer makes the networks more resistant
    to bad initialization; moreover, it eliminates the need for the use of the Dropout
    layer.


    # Dropout


    This is a popular (Salakhutdinov, 2014) and simple method to prevent neural networks
    from over-adjusting. During training, these layers eventually improve the generalization
    by randomly jumping a select percentage of their connections. Neurons that are
    “abandoned” in this way do not contribute to the propagation and do not participate
    in the back propagation, At the time of the test, all the neurons are used but
    their outputs are multiplied by the probability (Generally: 0.5 the most used).
    This layer introduces regularization within the network. An extremely efficient
    regulation technique complements


