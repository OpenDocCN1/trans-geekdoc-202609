  md: 'In artificial intelligence, the evolutionary algorithms by Darwin which are
    dependent on survival of the fittest principle can be considered as optimization
    techniques. The Darwin''s theory states that the fittest individuals in nature
    have more chance to survive. Similarly, in evolutionary algorithms, there are
    various disciplines present like Evolutionary programming, Evolution strategies,
    Genetic programming, Different evolution and Genetic algorithms. All the techniques
    share alike characteristics like variation and selection operators for solving
    problems but have been independently developed. The evolutionary algorithms are
    divided based on the solution representation. Swarm intelligence algorithms is
    another technique which is gaining more popularity in multi-modality. In optimization
    theory, No Free Lunch theorem was developed and widely employed and well-developed
    theorem. According to this theorem, every algorithm is equal over a set of possible
    functions. None of the algorithms could be considered as superior according to
    this theorem. This theorem is applied only to the finite search spaces however
    it is not known that the theorem could be applied to the infinite search spaces.
    The search algorithms could be applied to all finite search spaces with the computer
    implementations. Swarm Intelligence (SI) is concentrated on the insect behaviour
    that develops meta-heuristics with the finding abilities of the insects. This
    interaction among insects is in the form of the collective Intelligence among
    the insect colonies. This communication system among the insects could be a solution
    for many scientific problems. Among the global Optimization problems there are
    many SI algorithms in the history. Function optimization introduced by (Damodaram,
    R. and Valarmathi, M. L. (2012)) and many other applications such as determining
    the optimal routes (De Leon, D. (2012). scheduling Deb, K. (2014), data processing
    in the field of biomedical and classification (Deb, K., Pratap, A., Agarwal, S.,
    and Meyarivan, T. (2002)), image and data analysis (Deb, K., Pratap, A., and Meyarivan,
    T. (2001)), and many more utilizes the swarm optimization computational modeling
    inspired by the natural behaviour of swarms. Several other more applications developed
    have received its inspiration from the natural behaviour of various species. Many
    biologists have received their inspiration from these ant colonies, and it had
    motivated the researchers to develop the algorithm based on the ant colony named
    as the ant colony inspired algorithm. Several algorithms such as clustering and
    continuous optimization as well as the static and dynamic combinatorial optimization
    have been developed by the ant metaphor. These developed algorithm shows several
    similarities based on the ant colony in the nature and they have several advantages
    during their mechanism by allowing the entire colonies to survive effectively
    during the evolutionary process (Eberhart, R. C. and Shi, Y. (2001).). The collective
    behaviour of the insects works with the two effective examples such as the Cemetery
    formation and brood sorting. Hunting the prey, predator and prey interaction etc,
    has been the other behaviour of ants observed. The nature could be better understood,
    and it could be better by finding the underlying mechanism with the replication
    of behaviour of the insects. Moreover, we could determine the effective techniques
    if these natural insect behaviours are applied in the field of computer science.
    Searching, data mining and experimental analysis in data could be best achieved
    by implementing the clustering and sorting model of insects in the computer science.


