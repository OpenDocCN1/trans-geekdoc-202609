  md: '# # Use of AI in Several Cardiovascular Imaging Modalities


    Echocardiography is the highly portable and affordable that is said to be a necessary
    tool in the clinical cardiovascular imaging toolbox (Krittanawong, Zhang, Wang,
    Aydar and Kitai, 2017). However, the system is completely dependent on the operator
    and the process from data acquisition till the complete workflow is an elongated
    process as shown in figure 4. Machine learning techniques could speed up the reporting
    rate thereby enhancing the accuracy and also interprets digital ‘assistance’ for
    promoting echo images. In the year 1970, patients suffering from ‘idiopathic hypertrophic
    sub aortic stenosis’, mitral valve prolapse and mitral stenosis had undergone
    M-mode image investigation with Fourier analysis that automates the image classification
    process from the normal one. Currently, the advancement in echocardiogram with
    the diagnosis and segmentation had enhance the reproducibility and feasibility
    of real-time full-volume 3D transthoracic echocardiography to automatically measure
    the volumes and function of both atrial fibrillation and sinus rhythm. The above
    method also includes the automatic segmentation of left and right atrial and ventricular
    parameters that is said to be hasty and simple and also adapted by various vendors
    (King, 2018).


    Computed Tomography (CT) is used in the detection of coronary artery disease (CAD)
    and also helps in analyzing the entire anatomy of heart. Coronary atherosclerosis
    is a condition that affects the arteries, which supply blood to the heart. CAD
    could be determined with certain techniques that include coronary CT angiography
    (CCTA that uses an iodine-containing contrast material and CT scan to determine
    the narrowing of arteries) and Coronary artery calcium scoring (CACS that evaluates
    the amount of calcium deposit in the valves of the artery muscles). According
    to Wolterink et al. the dose of the radiation usage could be highly reduced for
    the CACS process if convolutional neural network (CNN) has been trained thereby
    reducing the noise factor. Machine Learning also advances the appraisal of coronary
    calcification and atherosclerotic plaque (plaque deposit) is said to be made of
    cholesterol that builds up in the wall of arteries). Manual analysis of such disease
    is said to be a burden and time-consuming and hence it is not practical for the
    clinical process. With the supervised learning process, CAC could be directly
    identified and the recurrent CNN could be trained to perform the entire automated
    analysis with high accuracy when compared to the manual segmentations. Once the
    plaques are detected then machine learning process could be used for detailed
    analysis with the help of radiomic techniques (Maes, Collignon, Vandermeulen,
    Marchal and Suetens, 1997). Radiomics deals with the process of supervised machine
    learning, which includes the extraction of radiology image features in a large
    amount and classifies them subsequently in order to obtain predictive performance
    and diagnosis. Therefore, radiomics is also termed as texture analysis (TA) that
    leverage interpixel relationship among the radiological images by quantifying
    them.


    Machine learning algorithm could also be used for the detection of stenosis, which
    is considered to be hemodynamically significant (internal carotid artery peak
    systolic velocity is greater than 125 cm/ sec). This is due to the fact that the
    specificity of CCTA is small by using visual examination. Deep Learning techniques
    could also be used with the CCTA scan images for analyzing the left ventricle
    (LV) myocardium for the patients suffering from coronary artery stenosis (Zreik
    et al.). With the multiscale convolutional neural network (CNN), segmentation
    process is carried out in LV myocardium by subsequently encoding it with the unsupervised
    convolutional auto encoder (CAE). Since LV myocardium region is divided in the
    form of spatially connected clusters and computed statistical encoding, support
    vector machine (SVM) classifier is used for classifying the patients with the
    extracted features.


    Computational fluid dynamics (CFD) method could also be used for the amendment
    of significant CAD, which is said to be the workstation-based algorithm and it
    takes around 30-60 minutes for the'
  merge: -1
  img_proc: true
