  md: '+   - Labeling an x-ray comes under binary classification whereas

    +   - Naming a face in the photo is multiclass.


    *Image Classification with Localization (Object Localization)* includes class
    labelling and displaying the object location by a bounding box.


    +   - Classifying different objects like birds and drawing a rectangular box known
    as bounding box around the birds.

    +   - Labeling a digital image in MRI as cancer with a box around the region.


    *Object detection* is the task of image classification with localization. Whenever
    an image has multiple objects and different objects are to be detected; it requires
    localization and classification.


    +   - Labeling each element in the satellite image with a bounding box.

    +   - A bounding box and labeling each vehicles, and pedestrians on a road.


    *Image segmentation* is the technique of drawing a line around the object detected
    in the image. The process of dividing an image into segments is called as Image
    Segmentation. The segmentation identifies the specific pixels in the image that
    belong to the object image with a fine-grained localization (Brownlee, 2019).


    In short, one can classify what are present in an image using classification.
    Image localization points to the single object position in an image whereas object
    detection detects the multiple objects in the image. Lastly, image segmentation
    produces pixel-wise masking on each object in the images. Thus, one can achieve
    the different shapes of objects in the image using image segmentation (Sharma,
    2019). The need of bounding box reduces the range of search for the object features
    and thereby conserves computing resources: memory allocation and processing time
    (Zhao, 2017).


    In DL, ANN model is a potent tool for ML, propitious to reform the future of AI.
    DL aims at models that computes and is collection of multiple processing layers
    to learn data representations with multi-levels abstraction. For solving complex
    problems, DL provides new sophisticated approaches to train DNN architectures.


    # ARTIFICIAL NEURAL NETWORKS


