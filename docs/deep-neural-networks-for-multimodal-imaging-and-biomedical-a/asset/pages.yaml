    # MATERIALS


    # Ordinary Portland Cement


    The raw materials used for manufacture of Portland cement are calcareous materials,
    such as limestone or chalk, and argillaceous materials such as shale or clay.
    The process of manufacture of cement consists of grinding the raw materials, mixing
    them intimately in certain proportions depending upon their purity and composition
    and burning them in a kiln at a temperature of about 1300 to1500°C, at which temperature,
    the materials sinkers and partially fuses to form nodal shaped clinker. Ordinary
    Portland cement (OPC) 53 grade cement was used for all mortar mixtures. The chemical
    composition of the crushed eggshell is shown in Table 1.


    Table 1. Chemical Composition of Cement


    | COMPONENTS | % |

    |---|---|

    | Lime (CaO) | 60 – 63% |

    | Silica (SiO2) | 17 – 25% |

    | Alumina (Al2O3) | 03 – 08% |


    # CHEMICAL COMPOSITION


    # Sand


    Sand is a naturally occurring granular material. It is defined by size, being
    finer than gravel and coarser than silt. Sand can also refer to a textural class
    of soil or soil type; i.e. a soil containing more than 85% sand-sized particles
    by mass. The composition of sand varies, depending on the local rock sources and
    conditions, but the most common constituent of sand in inland continental settings
    and non-tropical coastal settings is silica (silicon dioxide, or SiO2), usually
    in the form of quartz (Hawkins, P., Tennis, P. and Detwiler, R 2003) .


    ISO 14688 grades sands as fine, medium and coarse with ranges 0.063 mm to 0.2
    mm to 0.63 mm to 2.0 mm. In the United States, sand is commonly divided into five
    sub-categories based on size: very fine sand (1×16 – 1×8 mm diameter), fine sand
    (1×8 mm – 1×4 mm), medium sand (1×4 mm – 1×2 mm), coarse sand (1×2 mm – 1 mm),
    and very coarse sand (1 mm – 2 mm). These sizes are based on the Krumbeln phi
    scale. Ennore standard sand passing through4.75mm sieve was used for all mortar
    mixtures.'
