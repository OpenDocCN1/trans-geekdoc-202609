  md: 'The learning rate was initialized to 0.1 and divided by 10 when the validation
    error rate stopped improving (with the current learning rate). The increase of
    a fraction in the precision requires an exploitation of the new tens layers. Although
    most of these convolutional networks are very deep with hundreds of layers and
    lead to a reduction in error rates, it also introduces several challenges such
    as vanishing gradients (Bengio, 1994), decreased reuse of features during the
    forward propagation and the long learning time. For this, several approaches are
    proposed to reduce this problem such as Batch Normalization (Szegedy, 2015), cautious
    initialization [19] but the shorter networks always remain the best solution where
    they have the advantage that the information can spread in back and forth efficiently
    and can be easily trained in a very acceptable learning time. Several works have
    convinced this principle as (Huang, 2016) proposed by Huang et al. Where they
    introduced the concept of stochastic depth. This concept allows a contradictory
    configuration to form short networks during learning and to use deep networks
    during the test time. This concept of stochastic depth offers the possibility
    of increasing the depth of residual networks even beyond 1000 layers while achieving
    a reduction in training time and test error.


    # Wide ResNet


    Wide ResNet (Komodakis, 2016), proposed by Zagoruyko and Komodakis. This work
    (Komodakis, 2016) supports the principle: “Residual blocks are important factors
    in architecture and not depth which is an additional effect”. This principle is
