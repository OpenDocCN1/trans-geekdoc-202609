- pgno: 39
  md: 'mixing operation is done to improve the resolution of decoded feature maps.
    Skip connections combine feature maps in shallow layers of Dilated Residual Network
    (DRN) and output feature map of Dilated Residual Network. Here an additional 1
    × 1 convolution is added in the skip connection. Here the encoder is a Dilated
    Residual Network pre-trained on Image Net, since the area of the MCA in a raw
    ultrasound image is relatively small. The resolution of the output feature map
    of ResNet-34 on ultrasound MCA dataset is 20 × 14, which is only 1/32 of the raw
    ultrasound image. The output is too coarse for decoder in AlbuNet-34 network to
    restore fine detailed context information. By removing the max pooling layer Dilated
    Residual Network overcomes the above said limitations. DRN uses convolution filters
    for down sampling to remove gridding artifacts caused by the max pooling operation.In
    Dilated Residual Network dilated convolution helps preserve spatial resolution,
    and it produces a comparatively high resolution output feature map. High resolution
    feature map contains fine details which is helpful in restoring a small object.
    MCA NET uses the skip connections to effectively combine the local information
    in shallow layers and semantic information in high layers. The effective small
    object restoration ability of dense upsampling is used to restore final details
    in MCA Net. Skip connections are not added to all layers in to maintain the computational
    efficiency. Feature map of the last layer has both large resolution and sufficient
    semantic information, which makes it possible to obtain good performance without
    adding complex skip connections. Furthermore, dense upsampling can directly perform
    convolution operations on the feature map, which is more computationally efficient
    than up sampling operations at the same scale. About 4000 qualified raw ultrasound
    images were selected out of the 5000 images to construct the ultrasound image
    dataset and experienced radiologists labelled these 4000 ultrasound images. Radiologists
    manually labelled these ultrasound images with the help of the corresponding color
    Doppler flow images. Recognizing and locating Middle Cerebral Arteries in raw
    ultrasound images are complicated tasks, even for experienced Physicians. The
    labelled dataset is further reviewed by senior radiologists to make sure the correctness
    of these labels. Jaccard Index, Dice Coefficient and Hausdorff Distance are used
    as the evaluation metrics to show the performance of each model in different aspects.


