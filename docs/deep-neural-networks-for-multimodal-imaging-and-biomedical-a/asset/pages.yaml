    # Comparative Study of Relevant Neuro-Fuzzy Inference Module


    # Neuro-Fuzzy Inference Module


    The entire computational block diagram of Neuro-Fuzzy system is depicted in figure
    7 where Layer 1 consists of sensor nodes which senses the values and is known
    to be the sensor unit. Layer 2 comprises all the input membership functions that
    perform fuzzification. Layer 3 is rule based inference system. Layer 4 exhibits
