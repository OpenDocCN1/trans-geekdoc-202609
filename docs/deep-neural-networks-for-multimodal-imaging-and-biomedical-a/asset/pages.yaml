  md: '# # SAMPLE PREPARATION


    # ## Preparation of Cement Mortar


    In the preparation of cement mortar cubes, cement conforming with IS 3535-1986,
    standard Ennore sand conforming to IS: 650- 196, Eggshells and Seashells were
    used. The practical work is done based on the “BS EN 1015: Methods of test for
    mortar for masonry”, the formula therein has been used to calculate manually.
    Initially the mix is made by taking the regular quantity of cement and sand which
    is of CM mix ratio 1:3 for a 7.1cm x 7.1cm x 7.1cm cube. The quantity of cement
    and sand taken are 200 g and 600 g respectively with water cement ratio as 0.5
    which is 100 g weight of cement. The cement is of OPC 53 grade and the sand is
    of the size passes through 4.75mm sieve and retains on 2.36mm is used.


    # ## Preparation of Ordinary Cement Mortar Sample


    The practical work is done based on the “BS EN 1015: Methods of test for mortar
    for masonry”, the formula therein has been used to calculate manually. In manual
    mixing, OPC of 53 grade and sand is mixed. A depression is then made in the middle
    of mix and required amount of water is added. Then the mixture is mixed well.
    The resultant mix should be consumed within 30 minutes from the instant of adding
    water to the mix.


    # ## Preparation of Cement Mortar Sample Containing Eggshell


    In the preparation of cement mortar sample containing seashell, cement conforming
    to BS EN 1015, standard sand and eggshell were used. The sample names, the mixing
    ratios and the materials used are given in table 3. While preparing the sample
    mortars, 5%, 10%, 15% and 20% [2] by mass of sand was replaced by crushed eggshells.
    The materials are weighted accurately and mixed properly, and then compacted by
    using the vibrating machine for 2 minutes. The 3 no’s of samples were allowed
    to set for a day, after which the samples were taken and kept in the curing tank
    for the period of 7 days and 28 days. After the 7 days and 28 days of curing,
    samples were taken from the curing tank and dried. Next the cube sample is tested
    for its compressive strength by using the CTM of 200 ton and their corresponding
    values were noted.


    Table 3. Mix proportion of cement mortar containing eggshell


    | SAMPLE NAME | MORTAR COMPONENTS |

    |---|---|

    | | CEMENT (g) | SAND (g) | EGGSHELL (g) |

    | M | 200 | 600 | - |

    | ME₁ | 200 | 570 | 30 (10%) |

    | ME₂ | 200 | 540 | 60 (10%) |

    | ME₃ | 200 | 510 | 90 (15%) |

    | ME₄ | 200 | 480 | 120 (20%) |'
