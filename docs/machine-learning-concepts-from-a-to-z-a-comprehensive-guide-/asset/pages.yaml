    # Gini Index


    The Gini Index is a splitting measure used in decision trees to determine the
    degree of impurity of a particular variable when it is randomly chosen . The degree
    of Gini Index varies between 0 and 1, where 0 denotes that all elements belong
    to a certain class or there exists only one class (pure), and 1 denotes that the
    elements are randomly distributed across various classes (impure) . A Gini Index
    of 0.5 denotes equally distributed elements into some classes


    To calculate the Gini Index, we use the following formula:


    ```

    GiniIndex = 1 - \sum_{i=1}^{n} P_i^2

    ```


    where


    +   - n is the number of classes, and'
