    # Common Classification Algorithms


    +   - **Linear Classifiers**: Create a straight decision boundary between classes.
    Examples -

    - Logistic Regression and Support Vector Machines (SVM).


    +   - **Non-linear Classifiers**: Create complex decision boundaries between classes.
    Examples -

    - K-Nearest Neighbors and Decision Trees.


    # Types of Learners in Classification Algorithms


    +   - **Slow Learners**: Make predictions based on stored training data. Examples
    include k-nearest neighbors.


    +   - **Fast Learners**: Create models during training and use them for predictions.
    Examples include decision trees and support vector machines.


    # Evaluating Classification Models


    +   - **Classification Accuracy**: Measures how many instances are correctly classified
    out of the total instances.


    +   - **Confusion Matrix**: Shows true positives, true negatives, false positives,
    and false negatives for each class.


    +   - **Precision and Recall**: Useful for imbalanced datasets, measuring positive
    rate and true negative rate.


    +   - **F-Score**: Harmonic mean of precision and recall for imbalanced datasets.


    +   - **ROC Curve and AUC**: Analyze classifier performance at different thresholds.


    +   - **Cross-validation**: Obtaining a reliable estimate of model performance.


    # How Classification Works


    +   1. **Understanding the Problem**: Define class labels and their relationship
    with input data.


    +   2. **Data Preparation**: Clean and preprocess data, split into training and
    test sets.'
  merge: -1
  img_proc: true
