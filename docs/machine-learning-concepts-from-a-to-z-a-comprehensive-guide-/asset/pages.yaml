  md: '+   * Overfitting occurs when a machine learning model learns the training
    data too well, capturing noise and irrelevant details.

    * It often results in poor generalization to new, unseen data, as the model is
    too tailored to the training set.

    * Overfit models have excessively complex representations, with too many parameters
    or features.


    Overfitting happens when a machine learning model gets too focused on the training
    data and doesn''t work well with new data. It''s like a dog detector that learned
    to spot dogs in parks but can''t recognize them inside a house.


    # # Why does overfitting occur?


    It occurs because:


    +   * The training data is too small or not representative.

    * The data has too much irrelevant stuff (noise).

    * The model trains for too long on the same data.

    * The model is too complex and learns the training data''s quirks.


    For instance, if a student prediction only sees data from one gender or ethnicity,
    it won''t do well with others. That''s overfitting in action!


    # # How can you detect overfitting?


    Detecting overfitting is like making sure your learning model isn''t too obsessed
    with its training data. One way to do this is by using a technique called K-fold
    cross-validation.


    Here''s how it works:


    +   * You take your training data and split it into K equal parts (let''s say
    K=5).

    * Then, you train your model using 4 of these parts and keep one part as a test.

    * You see how well your model does the test part.

    * Repeat this process, each time using a different part as the test.

    * Finally, you average the results to get a good idea of how well your model performs
    overall.'
  merge: -1
  img_proc: true
