    # # Why does underfitting occur?


    Underfitting occurs when a machine learning model is too simple to capture the
    underlying patterns in the data. It happens for several reasons:


    +   1. Model Complexity: The model used is too basic, lacking the capacity to
    understand complex relationships in the data.


    +   2. Insufficient Training: The model hasn''t been trained enough. It didn''t
    have a chance to learn the data patterns and is like trying to learn a subject
    in a few minutes.


    +   3. Inadequate Features: The features or input variables provided to the model
    may not contain enough information to make accurate predictions.


    +   4. Over-Generalization: The model is too generalized and doesn''t adapt well
    to the training data. It''s like trying to fit all shoes into a one-size-fits-all
    mold.'
