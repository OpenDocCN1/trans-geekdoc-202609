  md: '![](img/99450c36d244d808035b8d79293ebc98_14_0.png)


    # 1. Explainability:


    +   - Consider whether your model needs to be explainable to a non-technical audience.


    +   - Some accurate algorithms, like neural networks, can be "black boxes," making
    it challenging to understand and explain their predictions.


    +   - Simpler algorithms such as kNN, linear regression, or decision trees offer
    more transparency in how predictions are made.


    # 2. In-memory vs. Out-of-memory:


    +   - Determine if your dataset can fit into the memory (RAM) of your server or
    computer.


    +   - If it fits in memory, you have a broader range of algorithms to choose from.


    +   - If not, consider incremental learning algorithms that can handle data in
    smaller chunks.


    # 3. Number of Features and Examples:


    +   - Assess the number of training examples and features in your dataset.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   * Some algorithms, like neural networks and gradient boosting, can handle
    large datasets with millions of features.


    +   * Others, like SVM, may perform well with more modest capacity.


    # 4. Categorical vs. Numerical Features:


    +   * Identify if your data consists of categorical features, numerical features,
    or a mix.


    +   * Certain algorithms require numeric input, necessitating techniques like
    one-hot encoding for categorical data.


    # 5. Nonlinearity of the Data:


    +   * Determine whether your data exhibits linear separability or can be effectively
    modeled with linear techniques.


    +   * Linear models like SVM with linear kernels, logistic regression, or linear
    regression are suitable for linear data.


    +   * Complex, nonlinear data may require deep neural networks or ensemble algorithms.


    # 6. Training Speed:


    +   * Consider the time allowance for training your model.


    +   * Some algorithms, like neural networks, are slower to train, while simpler
    ones like logistic regression or decision trees are faster.


    +   * Parallel processing can significantly speed up certain algorithms like random
    forests.


    # 7. Prediction Speed:'
