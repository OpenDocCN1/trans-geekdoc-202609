- pgno: 45
  md: '+   - In order to implement linear regression, we need to first define the
    cost function.


    +   - The cost function tells us how well the model is doing, so we can improve
    it further.


    Just a bit of context and recap before we dive into what the cost function is:


    +   - Model: ( f function created by our learning algorithm represented as f(x)=wx+b
    for linear regression.


    +   - w,b are here called parameters, or coefficients, or weights. These terms
    are used interchangeably.


    +   - Depending on the values of w,b are our function changes.


    Cost function: Squared error cost function

    J(w,b) = \frac{1}{2m} \sum_{i=1}^{m} (\hat{y}^{(i)} - y^{(i)})^2

    m = number of training examples

    J(w,b) = \frac{1}{2m} \sum_{i=1}^{m} (f_{w,b}(x^{(i)}) - y^{(i)})^2

    Find w,b:

    \y^{(i)} is close to y^{(i)} for all (x^{(i)},y^{(i)}).


    Lets break down what each of these terms mean here in the formula above.


    +   - It takes the prediction y^(cap) and compares it to the target y by taking
    y^-y ,This difference is called error, aka how far off our prediction is from
    the target.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - Next, we will compute the square of this error. We will do this because
    we will want to compute this value from different training examples in the training
