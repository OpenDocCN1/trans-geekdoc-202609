    effectively capture the patterns in the data. Here are some common methods to
    detect underfitting:


    +   1. Training Performance: Check the model''s performance on the training data.
    If it''s performing poorly on the training data, it''s a sign of underfitting.
    You might notice that the model struggles to fit the training examples.


    +   2. Validation Performance: Use a validation dataset that the model hasn''t
    seen during training. If the performance on the validation data is also weak,
