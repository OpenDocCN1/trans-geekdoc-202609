    # Logistic Regression


    Logistic Regression is a statistical method used for binary classification, which
    means it''s employed to predict the probability that an input belongs to one of
    two possible classes or categories.


    +   1.Binary Classification: Logistic Regression is primarily used for binary
    classification problems. In this context, you have two possible outcomes or classes,
    often denoted as 0 and 1, where 0 represents the negative class (e.g., "not spam")
    and 1 represents the positive class (e.g., "spam")


    +   2.Linear Combination: Logistic Regression starts with a linear combination
    of the independent variables. Each independent variable is assigned a weight,
    and these weights are multiplied by the'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'corresponding values of the independent variables. This is represented as:


    ```

    z = b_0 + b_1 * x_1 + b_2 * x_2 + ... + b_n * x_n

    ```


    where:


    +   - z is the linear combination of weights and variables.

    - b0 is the intercept or bias term.

    - b1, b2, ..., bn are the coefficients (weights) associated with the independent
    variables x1, x2, ..., xn.


    ###Logistic Function (Sigmoid Function): The linear combination z is passed through
    a logistic function, also known as the sigmoid function. The sigmoid function
    transforms the linear combination into a value between 0 and 1, which can be interpreted
    as a probability. The sigmoid function is defined as follows:


    ```

    P(Y = 1) = 1 / (1 + e^-z)

    ```


    +   - P(Y=1) represents the probability of the dependent variable being in class
    1

    - e is the base of the natural logarithm.

    - This function ensures that the output probability is bounded between 0 and 1.


    ###Decision Boundary: Logistic Regression uses a decision boundary to classify
    the input data. By default, the decision boundary is set at 0.5. If the predicted
    probability is greater than or equal to 0.5, the instance is classified as class
    1; otherwise, it''s classified as class 0.'
