  md: '1. Entropy: Entropy is a measure of impurity or disorder in a dataset. In the
    context of decision trees, it quantifies the randomness or unpredictability of
    the class labels in a dataset. High entropy means the data is highly disordered,
    and low entropy means it''s very well-structured.


    The formula for calculating entropy in the context of information theory is as
    follows:


    # Entropy (H(X)) = -Σ [p(x) * log2(p(x))]


    Where:


    +   * H(X) represents the entropy of a random variable X.

    * Σ denotes the summation over all possible values of X.

    * p(x) is the probability of the random variable X taking on a particular value
    x.

    * log2 represents the base-2 logarithm.


    This formula quantifies the uncertainty or randomness associated with the random
    variable X. The higher the entropy, the more uncertain and random the variable
    is, while lower entropy indicates a more predictable and less uncertain variable.


    2. Information Gain (IG): Information Gain is a metric that measures how much
    the knowledge of a particular attribute or feature reduces the uncertainty in
    predicting the class labels of data points. In simple terms, it quantifies how
    much knowing a feature helps us make more accurate predictions.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '3. Calculation: Information Gain is typically calculated as the difference
    between the entropy of the original dataset (before splitting) and the weighted
    average of entropies of the sub-datasets (after splitting), using a specific attribute.
    Mathematically, it''s represented as:


    ```

    IG(Attribute) = Entropy(Original Dataset) - Σ ([|Sv| / |S| * Entropy(Sv)],

    for all values of the attribute.

    ```


    Where:


    +   * IG(Attribute) is the Information Gain for the attribute.

    * |Sv| is the number of data points in the sub-dataset created by using a specific
    value of the attribute.

    * |S| is the total number of data points in the original dataset.

    * Entropy(Sv) is the entropy of the sub-dataset after splitting.


    4. Attribute Selection: In a decision tree, Information Gain is used to select
    the best attribute for splitting the dataset at each node. The attribute with
    the highest Information Gain is chosen as the splitting attribute, as it provides
    the most valuable information for classifying the data.


    5. Key Points:


    a. High Information Gain: An attribute with high Information Gain is considered
    more informative, as it reduces uncertainty in classifying data points.


    b. Low Information Gain: An attribute with low Information Gain doesn''t help
    much in classification and might not be a good choice for splitting.


    c. Decision Trees: Information Gain is a crucial criterion in decision tree algorithms
    like ID3, C4.5, and CART for selecting the best attribute to split'
