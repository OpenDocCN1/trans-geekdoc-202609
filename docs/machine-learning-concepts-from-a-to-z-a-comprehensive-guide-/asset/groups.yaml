    commonly applied in machine learning like linear regression.

    - **Cost Function**: In linear regression, we aim to minimize the mean squared
    error (MSE) between predicted and actual values.

    - **Initialization**: We start with initial values for ''w'' and ''b'', often
    set to 0.

    - **Training Data**: We use a dataset with features (in this case, spending on
    radio ads) and corresponding target values (sales units).

    - **Partial Derivatives**: Gradient descent involves calculating the partial derivatives
    of the cost function with respect to ''w'' and ''b''.

    - **Chain Rule**: The chain rule is applied to find these derivatives efficiently.

    - **Learning Rate (α)**: A hyperparameter that controls the step size in each
    iteration. It influences the convergence speed and stability.

    - **Update Rule**: We iteratively update ''w'' and ''b'' using the computed partial
    derivatives and the learning rate.

    - **Epochs**: One pass through the entire training dataset is called an epoch.
    We repeat this process for multiple epochs until ''w'' and ''b'' converge to stable
    values.

    - **Convergence**: We stop when ''w'' and ''b'' stop changing significantly or
    when a predefined number of epochs is reached'
  - '[PAGE 60]


    A convex function can be visualized as a gracefully rolling landscape, featuring
