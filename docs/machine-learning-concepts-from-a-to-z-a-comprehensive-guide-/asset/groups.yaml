    ### Gini Index


    The Gini Index is a splitting measure used in decision trees to determine the
    degree of impurity of a particular variable when it is randomly chosen. The degree
    of Gini Index varies between 0 and 1, where 0 denotes that all elements belong
    to a certain class or there exists only one class (pure), and 1 denotes that the
    elements are randomly distributed across various classes (impure). A Gini Index
    of 0.5 denotes equally distributed elements into some classes.


    To calculate the Gini Index, we use the following formula:


    ```

    GiniIndex = 1 - \sum_{i=1}^{n} P_i^2

    ```


    where


    - n is the number of classes, and

    - pi is the probability of an element belonging to class i


    Here''s an example of how to calculate the Gini Index:


    Suppose we have a dataset with 10 elements, where 6 belong to class A and 4 belong
    to class B. The probability of belonging to class A is 0.6 and to class B is 0.4.
    The Gini Index can be calculated as follows:


    GiniIndex = 1 - (0.6^2 + 0.4^2) = 1 - (0.36 + 0.16) = 1 - 0.52 = 0.48.


    ## Information Gain


    Information Gain is a measure used in decision trees to determine the reduction
    in entropy after partitioning the dataset based on an attribute. It helps in selecting
    the best attribute for splitting.


    ### Entropy


    Entropy is a measure of the disorder or uncertainty in a dataset. High entropy
    means the data is more unpredictable, while low entropy means it is more ordered.
    The formula for entropy is:


    ```

    H(X) = -\sum p(x) \log_2 p(x)

    ```


    where:


    - H(X) represents the entropy of variable X.

    - p(x) is the probability of X taking on value x.

    - log2 represents the base-2 logarithm.


    ### Information Gain (IG)


    Information Gain is the difference between the entropy of the original dataset
    and the weighted average entropy of the sub-datasets after splitting. It is calculated
    as:


    ```

    IG(A) = Entropy(S) - \sum \frac{|S_v|}{|S|} Entropy(S_v)

    ```


    where:


    - IG(A) is the Information Gain for attribute A.

    - Entropy(S) is the entropy of the original dataset.

    - |S_v| is the number of elements in the sub-dataset with value v.

    - |S| is the total number of elements in the original dataset.

    - Entropy(S_v) is the entropy of the sub-dataset.


    In decision trees, the attribute with the highest Information Gain is chosen for
    splitting the data at each node.


