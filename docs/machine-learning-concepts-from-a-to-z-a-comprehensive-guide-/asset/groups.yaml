    2. **计算几率**：我们使用逻辑回归来计算某发生的几率。

    3. **逻辑函数**：我们使用一个名为 sigmoid 的特殊公式。它将几率转换为 0 到 1 之间的范围。

    4. **阈值**：我们设置一个阈值 0.5。如果预测概率大于或等于 0.5，则实例分类为类别 1。


    # 逻辑回归方程


    自变量对应的值。这表示为：


    ```

    z = b_0 + b_1 * x_1 + b_2 * x_2 + ... + b_n * x_n

    ```


    其中：


    - z 是权重和变量的线性组合。

    - b0 是截距或偏置项。

    - b1, b2, ..., bn 是与自变量 x1, x2, ..., xn 相关的系数（权重）。


    ### 逻辑函数（Sigmoid 函数）


    线性组合 z 通过逻辑函数，也称为 sigmoid 函数。Sigmoid 函数将线性组合转换为 0 到 1 之间的一个值，该值可以被解释为概率。Sigmoid
    函数的定义如下：


    ```

    P(Y = 1) = 1 / (1 + e^-z)

    ```


    - P(Y=1) 代表因变量属于类别 1 的概率。

    - e 是自然对数的底数。

    - 该函数确保输出概率限制在 0 到 1 之间。


    ### 决策边界


    逻辑回归使用决策边界来对输入数据进行分类。默认情况下，决策边界设置为 0.5。如果预测概率大于或等于 0.5，则该实例被分类为类别 1；否则，分类为类别 0。


    5. **训练**：模型的参数（系数 $b_0, b_1, b_2, ..., b_n$）从标记的训练数据集中学习。模型旨在找到一组最佳参数，使得预测概率与训练数据中实际类别标签之间的差异最小。


    6. **评估**：训练完成后，可以在独立的验证或测试数据集上对逻辑回归模型进行评估，使用准确率、精确率、召回率、F1 分和 ROC 曲线等指标评估其性能。


    7. **假设**：逻辑回归对数据有某些假设，包括：


    - **线性**：自变量与因变量的对数几率（log-odds）之间的关系被认为是线性的。

    - **误差独立性**：预测中的误差应该是相互独立的。

    - **无多共线性**：自变量之间不应高度相关。


    8. **正则化**：为了防止过拟合，可以对逻辑回归模型应用 L1（Lasso）和 L2（Ridge）正则化技术。


    9. **应用**：逻辑回归广泛应用于各个领域，包括医学（疾病预测）、营销（客户流失预测）、金融（信用评分）和自然语言处理（情感分析）。


    # 似然函数


    为了改进我们的预测，我们需要调整公式。这涉及到寻找极大似然估计。我们通过寻找似然函数的梯度来完成这一点。


    # 对数似然函数的梯度


    为了改进我们的预测，我们需要调整公式。这涉及到寻找极大似然估计。我们通过寻找似然函数的梯度来完成这一点。


    # 逻辑回归的假设


    - 当使用逻辑回归时，我们做出某些假设。每个数据点都是独立的；它们不影响彼此。

    - 我们收集的数据与预测之间的关系是一条直线线。

    - 没有奇怪的极端数据点会搞乱我们的预测。

    - 我们有足够的数据来工作，所以我们的预测是可靠的。


    # 神经网络


    ![](img/99450c36d244d808035b8d79293ebc98_107_0.png)


    1. 神经网络开发的原始初衷是创建一种能够模拟人类大脑功能的软件。


    2. 神经网络对各个应用领域产生了深远影响，早期在语音识别等领域取得了成功。


    3. 在衬衫需求预测的背景下，我们使用 sigmoid 函数来表示数据，这通常与逻辑回归相关。


    4. 我们引入了“激活函数”的概念，标记为“a”，它在神经网络中起着至关重要的作用。该激活函数接收输入“x”，在我们的示例中，代表衬衫的价格。激活函数通过特定公式处理该输入，并产生一个代表衬衫将成为畅销王的概率的输出。


    '
