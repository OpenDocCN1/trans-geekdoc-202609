    # How unsupervised learning works


    ![](img/99450c36d244d808035b8d79293ebc98_76_0.png)


    - 1. **Lack of Labels**: Unsupervised learning starts with data sets that do not
    have predefined labels or categories. Each data point is an unlabeled input object
    or sample, making it different from supervised learning, where data is labeled.


    - 2. **Objective**: The primary goal of unsupervised learning is to discover underlying
    patterns or structure within the data. It aims to group or categorize data points
    based on inherent similarities without any predefined criteria.


    - 3. **Pattern Identification**: Unsupervised learning algorithms analyze the
    data and extract useful information or features. They do this by identifying patterns
    and relationships between data points. These patterns are not explicitly defined
    but emerge from the data itself.


    - 4. **Clustering**: One common task in unsupervised learning is clustering. Algorithms
    attempt to group similar data points together into clusters or categories. This
    can be likened to organizing a library without knowing the book titles, where
    books with similar content are placed on the same shelf.


    - 5. **Dimensionality Reduction**: Unsupervised learning can also involve dimensionality
    reduction, where algorithms simplify complex data by reducing the number of features.
    Principal Component Analysis (PCA) is an example of a technique used for dimensionality
    reduction.


    - 6. **Anomaly Detection**: Another application is identifying anomalies or outliers
    within the data. This can be crucial for detecting fraud, errors, or unusual behavior
    in various domains.


    - 7. **No Human-Defined Labels**: Unsupervised learning doesn''t rely on human-defined
    labels or categories. It allows for the discovery of unexpected or subtle patterns
    that might not be apparent through manual categorization.


    - 8. **Examples**: If given a set of images of animals, an unsupervised learning
    algorithm might group them into categories like "fur-covered," "scales," and "feathers"
    without being explicitly told to look for these features.


    - 9. **Flexibility**: Unsupervised learning is more flexible than supervised learning.
    It can adapt to unforeseen data patterns, which can be both an advantage and a
    challenge. The system may discover new categories or groupings that were not initially
    anticipated.


    - 10. **Semi-Supervised Learning**: To strike a balance between supervised and
    unsupervised learning, semi-supervised learning combines labeled and unlabeled
    data. This approach allows for human guidance while still leveraging the data''s
    inherent structure.


    # Clustering algorithms


    ![](img/99450c36d244d808035b8d79293ebc98_79_0.png)


    1. **Definition**: Clustering algorithms are unsupervised machine learning techniques
    used to group similar data points together based on certain features or characteristics.


    2. **Objective**: The primary goal of clustering is to identify natural groupings
    or patterns in data, making it easier to understand and analyze complex datasets.


    # 3. Types of Clustering:


    - Hard Clustering: Assigns each data point to a single cluster exclusively.

    - Soft Clustering: Allows data points to belong to multiple clusters with associated
    probabilities or membership scores.


    # 4. Common Clustering Algorithms:


    - K-Means: Divides data into K clusters by minimizing the sum of squared distances
    from data points to cluster centroids.

    - Hierarchical Clustering: Creates a hierarchical tree-like structure of clusters,
    which can be visualized as a dendrogram.

    - DBSCAN: Density-based algorithm that forms clusters based on data point density,
    suitable for irregularly shaped clusters.

    - Agglomerative Clustering: Hierarchical clustering approach that starts with
    individual data points as clusters and iteratively merges them.

    - Gaussian Mixture Models (GMM): Represents clusters as Gaussian distributions,
    accommodating complex cluster shapes.

    - Spectral Clustering: Utilizes the eigenvectors of a similarity matrix to group
    data points into clusters.

    - Mean-Shift: Finds mode locations in the data distribution, serving as cluster
    centers.


    - 5. **Distance Metrics**: Clustering often relies on distance measures like Euclidean
    distance, Manhattan distance, or cosine similarity to determine the similarity
    or dissimilarity between data points.


    - 6. **Number of Clusters**: Determining the optimal number of clusters, K, is
    a critical challenge in clustering, and various methods like the elbow method
    or silhouette score are used for this purpose.


    - 7. **Initialization**: Many clustering algorithms, such as K-Means, require
    careful initialization of cluster centroids, which can impact the final results.


    - 8. **Scalability**: The scalability of clustering algorithms is an important
    consideration, as some methods may not be suitable for large datasets.


    - 9. **Applications**: Clustering algorithms find applications in various domains,
    including customer segmentation, image segmentation, anomaly detection, and natural
    language processing.


    ```python

    from sklearn.cluster import KMeans

    import numpy as np


    # Generate some example data

    data = np.array([[1, 2], [5, 8], [1.5, 1.8], [8, 8], [1, 0]])


    # Create K-Means model with 2 clusters

    kmeans = KMeans(n_clusters=2)


    # Fit the model to the data

    kmeans.fit(data)


    # Get cluster labels

    labels = kmeans.labels_


    # Get cluster centers

    centers = kmeans.cluster_centers_


    print("Cluster Labels:", labels)

    print("Cluster Centers:", centers)

    ```


    K-means clustering is like sorting marbles into groups. Imagine you have a bunch
    of marbles and you want to group them by colors. It works like this:


    ![](img/99450c36d244d808035b8d79293ebc98_82_0.png)


    1. You decide how many groups (clusters) you want, let''s say K.

    2. Then, you start with K random marbles to represent the centers of clusters.

    3. Now, you assign each marble to the cluster whose center is closest to it. So
    marble joins the group.

    4. After that, you recalculate the center (mean) of each cluster. So, the center
    becomes the average color of all marbles in it.

    5. You repeat steps 3 and 4 until the clusters don''t change much, and each marble
    is in the group with the mean.


    ![](img/99450c36d244d808035b8d79293ebc98_83_0.png)


    In the end, you''ve sorted your marbles into K groups based on colors, and that''s
    what K-means clustering does for data points – it groups them by similarities.


    # Anomaly detection algorithms


    1. **Definition**: Anomaly detection algorithms are machine learning or statistical
    techniques designed to identify unusual or rare points in a dataset that deviate
    significantly from the expected behavior.


    2. **Unsupervised Learning**: Anomaly detection deals with unlabeled data, where
    the algorithm learns to distinguish anomalies from normal data patterns.


    # 3. Types of Anomalies:


    - Point Anomalies: Isolation of individual data points as anomalies.

    - Contextual Anomalies: Anomalies that depend on context or other data points.

    - Collective Anomalies: Groups of data points together form an anomaly.


    # 4. Common Anomaly Detection Techniques:


    - Statistical Methods: Employ statistical measures such as Z-scores, percentiles,
    or histograms to identify anomalies based on data distribution.

    - Machine Learning Algorithms: Algorithms like Isolation Forest, One-Class SVM,
    and Autoencoders are used for anomaly detection.

    - Density-Based Approaches: Methods like DBSCAN and LOF (Local Outlier Factor)
    identify anomalies by analyzing data point density.

    - Time Series Analysis: Techniques like ARIMA and Prophet are applied to detect
    anomalies in time-series data.


    5. **Threshold Setting**: Setting an appropriate anomaly detection threshold is
    a critical step, as it determines the sensitivity and specificity of the algorithm.

