    +   2. Multinomial Naïve Bayes (MultinomialNB): When you''re dealing with data
    that''s counted and falls into discrete categories, like word frequencies in text
    (common in spam detection or text classification), this type of Naïve Bayes is
    your friend.


    +   3. Bernoulli Naïve Bayes (BernoulliNB): If your data is really simple, like
    just having two options, such as "yes" or "no," or "1" or "0," then BernoulliNB
    is handy. It''s often used in problems with binary outcomes.


    # Example


    Certainly! Let''s simplify the explanation of Bayes'' formula and its application
    with an example:


    +   Imagine we have an object, let''s call it "Object X," and we want to classify
    it into different classes, like "Class 1," "Class 2," and so on (up to "Class
    K").


    +   Now, we have some information about Object X, which we''ll represent as "n."
    This information could be anything relevant to our classification task.'
  - '[PAGE 58]


    Bayes'' Formula helps us calculate the probability that Object X belongs to a
    specific class, let''s say "Class i," given this information "n." In simple terms,
    we want to know how likely it is that Object X is in Class i based on what we
    know.


    Here''s how we do it step by step:


    +   Prior Probability (P(ci)): First, we estimate how likely each class is without
    considering any information ("n"). If we don''t have any specific information,
    we might assume that all classes are equally likely (so each class has a 1/K chance,
    where K is the number of classes).


    +   Likelihood (P(n|ci)): Next, we determine how likely we would see the information
    "n" if Object X truly belongs to Class i. This part depends on the specific problem
    and data we have.


    +   Evidence (P(n)): To complete the equation, we calculate the overall probability
    of observing the information "n" regardless of the class. This involves considering
    the likelihood of "n" for each class and the prior probability of each class.


    Once we have these probabilities, we can use Bayes'' Formula to find the probability
    of Object X being in Class i given the information "n":


    **P(ci|n) = P(n|ci) * P(ci)**


    So, in practical terms, we''re assessing how well the information "n" matches
    with each class and combining it with our prior belief about the classes to make
    a more informed decision.'
  md: "\n- actual_values represents the actual target values or ground truth for your\
