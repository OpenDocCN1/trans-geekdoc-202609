    Linear Regression


    linear regression represented by the equation $h_\theta(x) = \theta_0 + \theta_1x_1
    + \theta_2x_2$:


    1 ** Hypothesis Function ($h_\theta(x)$): ** The hypothesis function represents
    the linear relationship between the input features ($x_1$) and the predicted output.


    2 ** $\theta_0, \theta_1$, and $\theta_2$: ** These are the parameters (coefficients)
    of the linear regression model. $\theta_0$ is the intercept (bias term), $\theta_1$
    represents the weight for the first feature ($x_1$), and $\theta_2$ represents
    the weight for the second feature ($x_2$). These parameters are learned during
    the training process to minimize the prediction error.


    3 ** $x_1$ and $x_2$: ** These are the input features or independent variables.
    In a linear regression model, you have multiple features, but in this equation,
    we focus on $x_1$ and $x_2$.


    4 ** Prediction: ** The equation allows you to make predictions for a given set
    of input features ($x_1$ and $x_2$). You plug these features into the equation,
    and the result $h_\theta(x)$ represents the predicted output.


    5 ** Linear Relationship: ** Linear regression assumes a linear relationship between
    the features and the output. This means that the predicted output is a linear
    combination of the features, and the model tries to find the best linear fit to
    the data.


    6 ** Training: ** During the training phase, the model adjusts the parameters
    ($\theta_0, \theta_1$, and $\theta_2$) to minimize the difference between the
    predicted values ($h_\theta(x)$) and the actual target values in the training
    dataset. This process is typically done using a cost function and optimization
    techniques like gradient descent.


    7 ** Bias Term (Intercept): ** $\theta_0$ represents the bias term or intercept.
    It accounts for the constant offset in the prediction, even when the input features
    are zero.


    8 ** Gradient Descent: ** Gradient descent is often used to find the optimal values
    of $\theta_0, \theta_1$, and $\theta_2$ by iteratively updating them in the direction
    that reduces the cost (prediction error).


    9 ** Cost Function: ** The cost function quantifies how well the model''s predictions
    match the actual target values. The goal is to minimize this cost function during
    training.


    10 ** Least Squares: ** In the context of linear regression, the method of least
    squares is commonly used to find the optimal parameters ($\theta_0, \theta_1,
    \theta_2$) by minimizing the sum of squared differences between predicted and
    actual values.


    In summary, linear regression is a simple but powerful algorithm for modeling
    and predicting continuous numeric values. It relies on finding the best-fit linear
    relationship between input features and the output, represented by $\theta_0,
    \theta_1$, and $\theta_2$.


    ## Cost Function for Linear Regression (Squared Error)


    ![](img/99450c36d244d808035b8d79293ebc98_44_0.png)


    - In order to implement linear regression, we need to first define the cost function.

    - The cost function tells us how well the model is doing, so we can improve it
    further.


    Just a bit of context and recap before we dive into what the cost function is:


    - Model: ($f$ function created by our learning algorithm represented as $f(x)=wx+b$
    for linear regression.

    - $w,b$ are here called parameters, or coefficients, or weights. These terms are
    used interchangeably.

    - Depending on the values of $w,b$ our function changes.


    Cost function: Squared error cost function

    $J(w,b) = \frac{1}{2m} \sum_{i=1}^{m} (\hat{y}^{(i)} - y^{(i)})^2$

    $m$ = number of training examples

    $J(w,b) = \frac{1}{2m} \sum_{i=1}^{m} (f_{w,b}(x^{(i)}) - y^{(i)})^2$

    Find $w,b$:

    $\hat{y}^{(i)}$ is close to $y^{(i)}$ for all $(x^{(i)},y^{(i)})$.


    Lets break down what each of these terms mean here in the formula above.


    - It takes the prediction $\hat{y}$ and compares it to the target $y$ by taking
    $\hat{y}-y$, this difference is called error, aka how far off our prediction is
    from the target.

    - Next, we will compute the square of this error. We will do this because we will
    want to compute this value from different training examples in the training set.

    - Finally, we want to measure the error across the entire training set. Thus,
    we will sum up the squared error.

    - To build a cost function that doesn''t automatically get bigger as the training
    size gets larger by convention, we will compute the average squared error instead
    of the total squared error, and we do that by dividing by $m$ like this.

    - The last part remaining here is that by convention, the cost function that is
    used in ML divides by 2 times $m$. This extra division by 2 is to make sure our
    later calculations look neater, but the cost function is still effective if this
    step is disregarded.

    - $J(w,b)$ is the cost function and is also called the squared error cost function
    since we are taking the squared error of these terms.

    - The squared error cost function is by far the most commonly used cost function
    for linear regression, and for all regression problems at large.

    - Goal: Find the parameters $w$ or $w,b$ that result in the smallest possible
    value for the cost function $J$


    ![](img/99450c36d244d808035b8d79293ebc98_47_0.png)


    ## Types of a cost function in linear regression


    In linear regression, different cost functions are used to measure how well model''s
    predictions match the actual data. Here are some common types of cost functions
    in linear regression:


    - Mean Error (ME): ** This cost function calculates the average of all errors
    by simply finding the difference between the predicted values ($Y''$) and the
    actual values ($Y$). Since errors can be positive or negative, they may cancel
    each other out, resulting in an average error of zero. It''s not often recommended
    but forms the basis for other cost functions.


    - Mean Squared Error (MSE): ** MSE is a widely used cost function. It measures
    the average of the squared differences between predicted and actual values. By
    squaring the errors, negative errors don''t cancel out positive ones. The formula
    for MSE is:


    ```

    $MSE=\frac{1}{N}\sum_{j=1}^{N}(Y_{j}-Y_{j}'')^{2}$

    ```


    Where:

    $Y_{i}$: Actual value

    $\hat{Y}_{i}$: Predicted value from the regression model

    $N$: Number of data points


    ![](img/99450c36d244d808035b8d79293ebc98_48_0.png)


    - Mean Absolute Error (MAE): ** MAE measures the average absolute difference between
    predicted and actual values. It considers all individual variances equally and
    is useful for understanding the magnitude of errors without regard to their direction.
    The formula for MAE is:


    ```

    $MAE = \sum_{j=1}^{N} |(Y_j - \hat{Y}_j)|$

    ```


    ![](img/99450c36d244d808035b8d79293ebc98_49_0.png)


    Where:

    $Y_i$: Actual value

    $\hat{Y}_i$: Predicted value from the regression model

    $N$: Number of data points


    - Root Mean Squared Error (RMSE): ** RMSE is the square root of the mean of the
    squared errors. It''s a measure of the error between observed (actual) values
    and predicted values. The formula for RMSE is:


    ```

    $RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (S_i - O_i)^2}$

    ```


    Where:

    $Y_i$: Actual value

    $\hat{Y}_i$: Predicted value from the regression model

    $N$: Number of data points


    In simpler terms, these cost functions help quantify how well a regression model
    is performing. MSE and RMSE give more weight to larger errors, while MAE treats
    all errors equally. Choose the one that best suits your problem and the importance
    of different errors in your analysis.


    Here''s a Python code example of how to implement the cost function for linear
    regression using squared error:


    ```python

    import numpy as np


    # Define the actual target values (ground truth)

    actual_values = np.array([2, 4, 5, 4, 5])


    # Define the predicted values from your linear regression model

    predicted_values = np.array([1.8, 3.9, 4.8, 4.2, 5.1])


    # Calculate the squared error for each data point

    squared_errors = (actual_values - predicted_values) ** 2


    # Calculate the mean squared error (MSE)

    mse = np.mean(squared_errors)


    print("Mean Squared Error (MSE):", mse)

    ```

