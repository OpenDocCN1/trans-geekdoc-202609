    # How does Logistic Regression work?


    1. **Collect Data**: First, we gather information about what we''re predicting.


    2. **Calculate Odds**: We use Logistic Regression to calculate the odds of something
    happening or not.


    3. **Logistic Function**: We use a special formula called the sigmoid function.
    It transforms the odds into a range between 0 and 1.


    4. **Threshold**: We set a threshold, 0.5. If the predicted probability is greater
    than or equal to 0.5, the instance is classified as class 1; otherwise, it''s
    classified as class 0.


    # Logistic Regression Equation


    corresponding values of the independent variables. This is represented as:


    ```

    z = b_0 + b_1 * x_1 + b_2 * x_2 + ... + b_n * x_n

    ```


    where:


    - z is the linear combination of weights and variables.

    - b0 is the intercept or bias term.

    - b1, b2, ..., bn are the coefficients (weights) associated with the independent
    variables x1, x2, ..., xn.


    ### Logistic Function (Sigmoid Function)


    The linear combination z is passed through a logistic function, also known as
    the sigmoid function. The sigmoid function transforms the linear combination into
    a value between 0 and 1, which can be interpreted as a probability. The sigmoid
    function is defined as follows:


    ```

    P(Y = 1) = 1 / (1 + e^-z)

    ```


    - P(Y=1) represents the probability of the dependent variable being in class 1

    - e is the base of the natural logarithm.

    - This function ensures that the output probability is bounded between 0 and 1.


    ### Decision Boundary


    Logistic Regression uses a decision boundary to classify the input data. By default,
    the decision boundary is set at 0.5. If the predicted probability is greater than
    or equal to 0.5, the instance is classified as class 1; otherwise, it''s classified
    as class 0.


    5. **Training**: The model''s parameters (the coefficients $b_0, b_1, b_2, ...,
    b_n$) are learned from a labeled training dataset. The model aims to find the
    best set of parameters that minimize the difference between the predicted probabilities
    and the actual class labels in the training data.


    6. **Evaluation**: Once trained, the Logistic Regression model can be evaluated
    on a separate validation or test dataset to assess its performance using metrics
    like accuracy, precision, recall, F1-score, and the ROC curve.


    7. **Assumptions**: Logistic Regression makes certain assumptions about the data,
    including:


    - Linearity: The relationship between the independent variables and the log-odds
    of the dependent variable is assumed to be linear.

    - Independence of Errors: Errors in the prediction should be independent of each
    other.

    - No Multicollinearity: Independent variables should not be highly correlated
    with each other.


    8. **Regularization**: To prevent overfitting, regularization techniques like
    L1 (Lasso) and L2 (Ridge) regularization can be applied to the Logistic Regression
    model.


    9. **Applications**: Logistic Regression is widely used in various fields, including
    medicine (disease prediction), marketing (customer churn prediction), finance
    (credit scoring), and natural language processing (sentiment analysis).


    ![](img/99450c36d244d808035b8d79293ebc98_103_0.png)


    # Type of Logistic Regression


    On the basis of the categories, Logistic Regression can be classified into three
    types:


    - **Binomial**: In binomial Logistic regression, there can be only two possible
    types of the dependent variables, such as 0 or 1, Pass or Fail, etc.

    - **Multinomial**: In multinomial Logistic regression, there can be 3 or more
    possible unordered types of the dependent variable, such as “cat”, “dogs”, or
    “sheep”.

    - **Ordinal**: In ordinal Logistic regression, there can be 3 or more ordered
    types of dependent variables, such as “low”, “Medium”, or “High”.


