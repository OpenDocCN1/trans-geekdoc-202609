    # Gradient descent algorithm


    ```

    repeat until convergence {

    $\theta_0 := \theta_0 - \frac{1}{m} \sum_{i=1}^{m} (h_{\theta}(x^{(i)}) - y^{(i)})$$

    $\theta_1 := \theta_1 - \frac{1}{m} \sum_{i=1}^{m} (h_{\theta}(x^{(i)}) - y^{(i)})
    \cdot x^{(i)}$$

    }

    ```


