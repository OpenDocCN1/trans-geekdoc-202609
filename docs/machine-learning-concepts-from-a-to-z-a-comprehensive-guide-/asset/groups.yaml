    | 目的 | 预测类别结果 | 预测连续的数值结果 |

    | 输出 | 离散类别或标签 | 连续值 |

    | 示例 | 垃圾邮件检测 | 房价预测 |

    | 目标 | 类别标签（例如：垃圾邮件或非垃圾邮件） | 数值（例如：温度） |

    | 算法 | 逻辑回归、决策树、支持向量机、神经网络等 | 线性回归、多项式回归、决策树、支持向量机等 |

    | 评估指标 | 准确率、精确率、F1 分 | 均方误差、R 方方等等 |

