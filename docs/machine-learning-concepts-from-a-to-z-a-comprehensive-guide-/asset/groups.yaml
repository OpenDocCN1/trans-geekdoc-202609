    ## 它是如何工作的？


    在 Python 中，你可以轻松地找到数据点之间的关系并创建回归线，而无需深入复杂的数学。让我们通过一个实际示例来拆解：


    假设你记录了 18 辆汽车通过收费收费站的数据。你记录了每辆车的速度以及它们通过的时间（以小时为单位）。


    - 在图表中，x 轴（水平）代表一天中的小时数。

    - y 轴（垂直）显示汽车的速度。


    这种设置允许你直观地分析并发现数据中的模式，例如全天候的速度变化。通过 Python，你可以使用特定方法进行此类分析并绘制回归线，而无需亲自处理数学公式。


    ## 示例


    开始绘制散点图：


    ```python

    import matplotlib.pyplot as plt


    x = [1,2,3,5,6,7,8,9,10,12,13,14,15,16,18,19,21,22]

