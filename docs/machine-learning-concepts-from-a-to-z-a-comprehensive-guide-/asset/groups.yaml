  - '[PAGE 17]


    Certainly, here are the important key points about the use of three sets (training
    set, validation set, and test set) in machine learning:


    # 1. Three Sets of Labeled Examples:


    +   - In practical machine learning, data analysts typically work with three subsets
    of labeled examples: training set, validation set, and test set.


    +   - These sets are used for different purposes in the model development process.


    # 2. Data Splitting:


    +   - After obtaining an annotated dataset, the first step is to shuffle the examples
    randomly.


    +   - The dataset is then divided into three subsets: training, validation, and
    test.


    # 3. Set Sizes:


    +   - The training set is usually the largest, used for building the machine learning
    model.


    +   - The validation and test sets are smaller and roughly of similar size.


    +   - The model is not allowed to use examples from the validation and test sets
    during training, which is why they are often called "hold-out'
  - '[PAGE 18]


    sets."


    # 4. Proportion of Split:


    +   - There is no fixed or optimal proportion for splitting the dataset into these
    three subsets.


    +   - In the past, a common rule of thumb was 70% for training, 15% for validation,
    and for 15% for testing.


    +   - In the age of big data, it may be reasonable to allocate 95% for training
    and 2.5% each for validation and testing.


    # 5. Purpose of Validation Set:


    +   - The validation set serves two main purposes:


    5.1. It helps choose the appropriate learning algorithm.


    5.2. It assists in finding the best values for hyperparameters.


    # 6. Purpose of Test Set:


    +   - The test set is used to assess the model''s performance objectively.


    +   - It ensures that the model performs well on data it hasn''t seen during training.'
