    new value of x, you can plug it into the equation to predict what Y is likely
    to be.


    +   5. Errors: Linear regression accounts for errors or the differences between
    the predicted values and the actual values. The goal is to minimize these errors,
    making the line a good fit for the data.


    +   6. R-Squared: This is a number between 0 and 1 that tells you how well the
    line fits the data. A high R-squared means a better fit.


    +   7. Assumptions: Linear regression assumes the relationship between the variables
    is linear (forming a straight line), and it assumes that the errors are normally
    distributed.


