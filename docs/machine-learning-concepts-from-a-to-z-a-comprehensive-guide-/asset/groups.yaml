    - **Gradient Calculation**: It computes the gradient of the cost function with
    respect to each parameter. This gradient represents the direction of the steepest
    increase in the cost function.

    - **Parameter Update**: GD updates the model parameters in the opposite direction
    of the gradient to reduce the cost.

    - **Code**: `parameter = parameter - learning_rate * gradient`n- **Iteration**:
    GD repeats the gradient calculation and parameter update process for a fixed number
