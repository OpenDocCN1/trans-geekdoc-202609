    # Gradient Descent (GD) is an optimization algorithm used to minimize a cost or
    loss function by iteratively updating model parameters based on the gradients
    of the cost function.


    +   * **w**: Represents the weight or slope of the linear regression model.

    * **b**: Represents the bias or intercept of the linear regression model.

    * **J(w, b)**: Denotes the cost function, which measures how well the model fits
    the data.

    * **α (alpha)**: Represents the learning rate, a hyperparameter controlling the
    step size in the optimization process.

    * **Objective**: We aim to find the values of w and b that minimize the cost function
    J(w, b). For linear regression, a common cost function is the Mean Squared Error
    (MSE):


    ```

    J(w, b) = (1/2m) * Σ (yᵢ - (wxᵢ + b))²

    ```


    Where:


    +   * m: The number of training examples.'
