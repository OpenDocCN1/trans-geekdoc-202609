    \ 神经网络\n\n## 37. 神经网络：它们如何模拟大脑\n\n# 机器学习简介\n\n![](img/99450c36d244d808035b8d79293ebc98_5_0.png)\n\
    \n- 它赋予了计算机从数据中学习的能力，使其行为上变得更像人类。\n- 机器学习基于统计技术和算法，在数据中寻找模式并进行预测。\n- 与传统编程不同，机器学习模型从输入数据中学习并生成自己的程序。\n\
    - 高质量的数据对于训练机器学习模型至关重要。\n- 根据数据类型和当前任务使用不同的算法。\n\n## 简而言之，机器学习是\n\n- **AI 子集**：它是人工智能的一部分。\n\
    - **自动化学习**：机器在人工干预最少的情况下学习和改进。\n- **数据驱动**：模型在数据上进行训练以发现模式并做出决策。\n- **无显式编程**：与传统编程不同，机器学习模型生成它们自己的程序。\n\
    \n## 关键点\n\n- 机器学习允许计算机从数据中学习并像人类一样做决策。\n- 它是 AI 的子集，依赖统计技术和算法。\n- 在学习阶段，输入数据和输出被用于训练机器学习模型。\n\
    - 机器学习需要高质量的数据来进行有效训练。\n- 根据数据和任务使用不同的算法。\n\n记住：机器学习让计算机能够学习和适应，使其成为一项令人兴奋且强大的技术！\n\
    \n## 机器学习的特征\n\n- 机器学习与数据之间存在紧密相连的关系。机器学习算法旨在根据数据中存在的模式进行学习和预测。其基本思想是利用历史数据对机器学习模型进行训练，以提取模式和关系。一旦完成训练，这些模型就可以对新的、未见过的数据进行预测或决策。\n\
    - 通过分析大量数据，组织可以对趋势、客户行为、市场动态等进行更深入的。\n- 它们可以处理复杂的非结构化数据类型，例如图像、文本和传感器数据，这些对于传统的编程方法可能具有挑战性。\n\
    \n例如，在金融领域，机器学习模型可以根据历史交易数据预测价格或检测欺诈。在医疗领域，机器学习模型可以根据患者数据和医疗记录预测疾病爆发或协助诊断状况。\n\
    \n- 通过分析客户交互、购买历史和浏览模式，机器学习模型可以创建个性化的\n\n![](img/99450c36d244d808035b8d79293ebc98_7_0.png)\n\
    \n# 机器学习中的数据：洞察的骨石\n\n- **核心组件**：数据是机器学习的基础，提供了训练模型的观测或测量。\n- **质量与数量**：机器学习模型的性能很大程度上取决于可用数据的质量和数量。\n\
    - **多种形式**：数据可以是数值、分类或时间序列的，来源于数据库、电子表格或 API。\n- **模式学习**：机器学习算法利用数据学习模式和关系。\n\
    \n## 数据类型\n\n1. 标记数据：包含用于预测的目标变量。\n2. 无标记数据：缺少目标变量。\n3. 数值数据：由可测量值表示（例如：收入）。\n\
    4. 分类数据：代表类别（例如：性别、水果类型）。\n5. 序数数据：具有顺序的分类数据（例如：服装尺寸、客户满意度）。\n\n## 数据划分\n\n- **训练集**：用于通过输入输出对训练模型。\n\
    - **验证集**：用于优化模型的超参数。\n- **测试集**：在训练后评估模型对未见过数据的性能。\n\n## 数据预处理\n\n- **清洗与归一化**：通过处理缺失值和缩放特征为分析准备数据。\n\
    - **特征选择/工程**：选择相关特征或创建新特征以提高模型性能。\n\n## 数据优势\n\n- **提高准确性**：更多的数据允许机器学习模型学习复杂关系，产生更好的预测。\n\
    - **自动化**：机器学习高效地自动化决策和重复性任务。\n- **个性化**：机器学习为用户创建个性化体验，增加满意度。\n- **节省成本**：自动化减少了人工并提高了效率，从而节省成本。\n\
