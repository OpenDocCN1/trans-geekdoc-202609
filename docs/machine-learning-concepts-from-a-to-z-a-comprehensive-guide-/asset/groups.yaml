    # Prior probabilities


    +   • Prior probabilities are like starting points in figuring out if an email
    is "spam" or "not spam." They are like initial guesses about the chances'
  - '[PAGE 55]


    of an email being spam before we look at the email''s content. These initial guesses
    are important because they affect our final decision.


    +   * To make this decision, we use a formula that combines our initial guess
    (prior probability) with the evidence from the email''s content (class-conditional
    probability). It''s like giving more importance to what''s in the email while
    also considering what we originally thought.


    +   * This formula helps us calculate the most likely label, either "spam" or
    "not spam". The final equation for this process can look like this:


    ```

    Final Decision = Prior Probability × Class-Conditional Probability

    ```


    Or in a more commonly used way:


    ```

    Final Decision=log(Prior Probability)+log(Class-Conditional Probability)

    ```


    In simple terms, it''s about combining our initial hunch with the email''s content
    to decide if it''s spam or not. This is a basic idea behind a technique called
    Naïve Bayesian classification.


