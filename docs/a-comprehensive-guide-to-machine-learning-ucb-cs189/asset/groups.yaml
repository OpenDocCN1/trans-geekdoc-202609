    ## 7.2 SVM 的对偶问题


    让我们应用对对偶性的知识，来寻找软边界 SVM 优化问题的对偶形式。


    ```

    $$\min f(w,t,\xi)\min_{w,t,\xi} \frac{1}{2}||w||^2 + C \sum_{i=1}^{n} \xi_i$$

    $(1-\xi_i) - y_i(w^T x_i - t) \leq 0 \quad \text{and} \quad -\xi_i \leq 0_{g(w,t,\xi)\leq0}$$

    ```


    我们来识别 SVM 问题的原始变量和对偶变量。我们将有：


    - 原始变量 $w, t$ 和 $\xi_i$

    - 对偶变量 $\alpha_i$，对应于每个形式为 $y_i(w^T x_i - t) \geq 1 - \xi_i$ 的约束

    - 对偶变量 $\beta_i$，对应于每个形式为 $\xi_i \geq 0$ 的约束


    为了符号表示方便，请注意我们使用 $\alpha$ 和 $\beta$ 代替 $\lambda$，且没有对应于 $\nu$ 的对偶变量，因为没有等式约束。SVM
    问题的拉格朗日函数为：


    ```

    $$\mathcal{L}(w,t,\xi,\alpha,\beta) = \frac{1}{2}||w||^2 + \sum_{i=1}^{n} \xi_i
    + \sum_{i=1}^{n} \alpha_i(1-\xi_i) - y_i(w^T x_i - t) + \sum_{i=1}^{n} \beta_i(-\xi_i)
    \quad (7.7)$$

    ```


    ```

    $$\frac{1}{2}||w||^2 - \sum_{i=1}^{n} \alpha_i(w^T x_i - t) + \sum_{i=1}^{n} \alpha_i
    + \sum_{i=1}^{n} (C - \alpha_i - \beta_i)\xi_i$$

    ```


    因此，对偶问题为：


    ```

    $$\max_{\alpha,\beta\geq 0} = \min_{w,t,\xi} \frac{1}{2}||w||^2 - \sum_{i=1}^{n}
    \alpha_i(w^T x_i - t) + \sum_{i=1}^{n} \alpha_i + \sum_{i=1}^{n} (C - \alpha_i
    - \beta_i)\xi_i \quad (7.8)$$

    ```


    让我们使用 KKT 条件来寻找最优对偶变量。验证原始问题是凸的。我们从平稳性条件已知，在最优值 $w^*, t^*, \xi^*$ 处有：


    ```

    $$\frac{\partial \mathcal{L}}{\partial w} = \frac{\partial \mathcal{L}}{\partial
    t} = 0$$

    ```


    - $\frac{\partial \mathcal{L}}{\partial w} = w - \sum_{i=1}^{n} \alpha_i x_i =
    0 \Rightarrow w^* = \sum_{i=1}^{n} \alpha_i x_i$。这告诉我们 $w^*$ 将是正类 $x_i^*$ 和负类
    $x_i^*$ 的加权组合。

    - $\frac{\partial \mathcal{L}}{\partial t} = \sum_{i=1}^{n} \alpha_i = 0$。这告诉我们权重
    $\alpha_i^*$ 将均匀分布在正样本和负训练点之间。

    - $\frac{\partial \mathcal{L}}{\partial \xi_i} = C - \alpha_i - \beta_i = 0 \Rightarrow
    0 \leq \alpha_i^* \leq C$。这告诉我们权重 $\alpha_i^*$ 被限制小于超参数 $C$。


    验证其他 KKT 条件也，从而建立强对偶。利用这些观察结果，我们可以消除对偶问题中的某些项。


    ```

    \mathcal{L}(w, t, \xi, \alpha^*, \beta^*) = \frac{1}{2}|w|^2 - \sum_{i=1}^n \alpha_i^*
    y_i(w^T x_i - t) + \sum_{i=1}^n \alpha_i^* + \sum_{i=1}^n (C - \alpha_i^* - \beta_i^*)
    \xi_i\n= \frac{1}{2}|w|^2 - \sum_{i=1}^n \alpha_i^* y_i(w^T x_i) + \sum_{i=1,
    s=0}^n \alpha_i^* y_i + \sum_{i=1, s=0}^n (C - \alpha_i^* - \beta_i^*) \xi_i\n=
    \frac{1}{2}|w|^2 - \sum_{i=1}^n \alpha_i^* y_i(w^T x_i) + \sum_{i=1}^n \alpha_i^*

    ```


    我们可以用对偶变量 $\alpha_i^*$ 来重写最优原始变量 $w^*, t^*, \xi^*$：


    ```

    $g(\alpha^*, \beta^*) = \min_{w,t,\xi,\alpha^*} \mathcal{L}(w,t,\xi,\alpha^*,\beta^*)\n=
    \mathcal{L}(w^*,t^*,\xi^*,\alpha^*,\beta^*)\n= \frac{1}{2}\sum_{i=1}^n \alpha_i^*
    y_i x_i^2 - \sum_{i=1}^n\sum_{j=1}^n \alpha_i^* y_i \alpha_j^* y_j (x_j^T x_i)
    + \sum_{i=1}^n \alpha_i^*\n= \frac{1}{2}\sum_{i=1}^n \alpha_i^* y_i x_i^2 - \sum_{i=1}^n\sum_{j=1}^n
    \alpha_i^* y_i \alpha_j^* y_j (x_j^T x_i) + \sum_{i=1}^n \alpha_i^*\n= \alpha^{*T}
    1 - \frac{1}{2}\alpha^{*T} Q$

    ```


    其中 $Q_{ij} = y_i(x_i^T x_j)$ 且 $Q = \text{diag}(y)$。现在我们可以写出对偶最终的形式，它只包含 $\alpha$、$x$
    和 $y$（注意我们已经消除了 $\beta$）：


    ```

    \max_{\alpha} \alpha^{T} 1 - \frac{1}{2}\alpha^{T} Q\alpha\text{s.t.} \sum_{i=1}^n
    \alpha_i = 0\n0\le \alpha_i \le C \quad i = 1, \dots, n

    ```


