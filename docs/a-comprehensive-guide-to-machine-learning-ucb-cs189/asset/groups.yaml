    ## 1.2 ORDINARY SQUARES


    If $X$ is full rank, then $\mathbf{X}^T\mathbf{X}$ is invertible, so we can solve
    for a unique solution


    $$\mathbf{w}_{\text{OLS}}^*=(\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$$


    Note: Although we write $(\mathbf{X}^T\mathbf{X})^{-1}$, in practice we would
    not actually compute the inverse; it is numerically stable to solve the linear
    system of equations above (e.g. with Gaussian elimination).


    In this derivation we used the condition $\nabla L(\mathbf{w}^*)=0$, which is
    a necessary but not sufficient for optimality. We found a critical point, but
    in general such a point could be a local minimum, a local maximum, or a saddle
    point. Fortunately, in this case the objective function is convex, which implies
    that any critical point is a global minimum. To show that $L$ is convex, it suffices
    to compute the Hessian of $L$, in which this case is


    $$\nabla^2 L(\mathbf{w})=2\mathbf{X}^T\mathbf{X}$$


    and show that this is positive semi-definite:


    $$\mathbf{v}^T(2\mathbf{X}^T\mathbf{X})\mathbf{v}=2\mathbf{X}^T\mathbf{X}\mathbf{v}=2\|\mathbf{X}\mathbf{v}\|_2^2
    \ge 0$$


    ## Approach 2: Orthogonal projection


    There is also a linear way to arrive at the same solution: orthogonal projections.


    Recall that if $V$ is an inner product space and $S$ is a subspace of $V$, then
    any $\mathbf{v} \in V$ can be decomposed uniquely in the form


    $$\mathbf{v}=\mathbf{v}_S+\mathbf{v}_\perp$$


    where $\mathbf{v}_S \in S$ and $\mathbf{v}_\perp \in S^\perp$. $S^\perp$ is the
    orthogonal complement of $S$, i.e. the set of vectors that are perpendicular to
    every vector in $S$.


    The orthogonal projection onto $S$, denoted $P_S$, is the linear operator that
    maps $\mathbf{v}$ to $\mathbf{v}_S$ in the decomposition above. An important property
    of the orthogonal projection is


    $$\|\mathbf{v}-P_S\mathbf{v}\| \le \|\mathbf{v}-\mathbf{s}\|$$


    for all $\mathbf{s} \in S$, with equality if and only if $\mathbf{s}=P_S\mathbf{s}$.
    That is,


    $$P_S\mathbf{v}=\arg \min_{\mathbf{s}\in S} \|\mathbf{v}-\mathbf{s}\|$$


    Proof. By the Pythagorean theorem,


    $$\|\mathbf{v}-\mathbf{s}\|^2=\|\sum_{\mathbf{s}''\in S} (\mathbf{v}-P_S\mathbf{v})+P_S\mathbf{s}\|^2=\|\mathbf{v}-P_S\mathbf{v}\|^2+\|P_S\mathbf{s}\|^2
    \ge \|\mathbf{v}-P_S\mathbf{v}\|^2$$


    equality holding if and only if $\|P_S\mathbf{v}-\mathbf{s}\|^2=0$, $\mathbf{s}=P_S\mathbf{v}$.
    Taking square roots on both sides gives $\|\mathbf{v}-\mathbf{s}\| \ge \|\mathbf{v}-P_S\mathbf{v|$
    as claimed (since norms are nonnegative). $\square$


