    # 6.9. MULTICL LOGISTIC REGRESSION


    The logits induce a softmax distribution, which we can verify is a probability
    distribution:


    +   1. The entries are between 0 and 1.


    +   2. The entries add up to 1.


    On inspection, this softmax distribution is reasonable, because the higher the
    score of a class, the higher its probability. In fact, we can verify that the
    logistic function is a special case of the softmax function. Assuming the corresponding
    weights for class 0 are $w_0$ and $w_1$, we have:


    ```

    $P(Q_i=1) = \frac{e^{w_1^T x_i}}{e^{w_1^T x_i} + e^{(w_1-w_0)^T x_i}} = \frac{e^{(w_1-w_0)^T
    x_i}}{1 + e^{(w_1-w_0)^T x_i}} = s((w_1 - w_0)^T x_i)$$

    $P(Q_i=0) = \frac{e^{w_0^T x_i}}{e^{w_1^T x_i} + e^{(w_1-w_0)^T x_i}} = \frac{e^{w_0^T
    x_i}}{e^{w_0^T x_i} + e^{(w_1-w_0)^T x_i}} = 1 - s((w_1 - w_0)^T x_i)$

    ```


    In the 2-class case, because we are only interested in the difference between
    $w_1$ and $w_0$, we just use a change of variables $w = w_1 - w_0$. We don''t
    need to know $w_1$ and $w_0$ individually, because we know $P(Q_i=1)$, we know
    by default $P(Q_i=0) = 1 - P(Q_i=1)$.


    # Multiclass Logistic Regression Loss Function


    Let''s derive the loss function for multiclass logistic regression, using the
    information-theoretic perspective. The "true" or target distribution is $P(P_i=j)
    = y_{ij}$. In other words, the entire distribution is concentrated on the label
    for the training example. The estimated distribution $Q$ comes from multiclass
    logistic regression, and this is the softmax


    ```

    $P(Q_i=j) = \frac{e^{w_j^T x_i}}{\sum_{k=1}^K e^{w_k^T x_i}}$

    ```


    Now let we proceed to derive the loss. The objective, as always, is to minimize
    the sum of the KL divergences caused by all the training examples.


    ```

    $W_{MCLR}^* = \arg min_{W} \sum_{i=1}^n D_{KL}(P_i||Q_i)$$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K P(P_i=j) \ln \frac{P(P_i=j)}{P(Q_i=j)}$$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \ln \frac{y_{ij}}{\text{softmax}(j,
    \{w_1^T x_i, \dots, w_K^T x_i\})}$$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \cdot \ln y_{ij} - \ln (\text{softmax}(j,
    \{w_1^T x_i, \dots, w_K^T x_i\))$$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \cdot \ln \left( \frac{e^{w_j^T
    x_i}}{\sum_{k=1}^K e^{w_k^T x_i}} \right)$

    ```'
