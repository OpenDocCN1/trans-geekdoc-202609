    \ which means that $u \\in \\mathbb{R}^d$ there exist unique elements $u_1 \\\
    in \\mathcal{N}(\\mathbf{X})$ and $u_2 \\in \\mathcal{R}(\\mathbf{X}^T)$ such\
    \ that $u = u_1 + u_2$. Furthermore, $\\mathcal{N}(\\mathbf{X})$ and $\\mathcal{R}(\\\
    mathbf{X}^T)$ are orthogonal subspaces.\n\nHere is where FTLA comes in in the\
    \ context of ridge regression. We can express any $\\mathbf{w} \\in \\mathbb{R}^d$\
    \ as a unique combination $\\mathbf{w} = \\mathbf{w}_1 + \\mathbf{w}_2$, where\
    \ $\\mathbf{w}_1 \\in \\mathcal{R}(\\mathbf{X}^T)$ and $\\mathbf{w}_2 \\in \\\
    mathcal{N}(\\mathbf{X})$. We can express this as $\\mathbf{w} = \\mathbf{X}^T\\\
    mathbf{v} + \\mathbf{r}$, where $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\mathbf{r}\
    \ \\in \\mathcal{N}(\\mathbf{X})$. Instead, of optimizing over $\\mathbf{w} \\\
    in \\mathbb{R}^d$, we can optimize over $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\\
    mathbf{r} \\in \\mathbb{R}^l$, which equates to optimizing over $n+l$ variables.\
    \ However, as we see, the optimization over will be trivial since we just have\
    \ to optimize an $n$ dimensional problem\n\nWe know that $\\mathbf{w}^* = \\mathbf{X}^T\\\
    mathbf{v}^* + \\mathbf{r}$, where $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\mathbf{r}\
    \ \\in \\mathcal{N}(\\mathbf{X})$. Let's solve ridge regression by optimizing\
    \ over the variables $\\mathbf{v}$ and $\\mathbf{r}$ in stead of:\n\n```\n$\\\
    mathbf{v}^*, \\mathbf{r}^* = \\arg\\min_{\\mathbf{v} \\in \\mathbb{R}^n, \\mathbf{r}\
    \ \\in \\mathcal{N}(\\mathbf{X})} ||\\mathbf{X}^T\\mathbf{w} - \\mathbf{y}||_2^2\
    \ + \\lambda ||\\mathbf{w}||_2^2$\n```"
  md: "\n## 1.5. HYPERPARAMETERS AND VALIDATION\n\n![](img/99defe26aebed215976e83d281581f33_14_0.png)\n\
    \n### Cross-validation\n\nSetting aside a validation set works well, but comes\
    \ at a cost, since we cannot use the validation data for training. Since having\
    \ more data generally improves the quality of the trained model, we may prefer\
    \ not to let that data go to waste, especially if we have little data to begin\
    \ with and/or collecting more data is expensive. Cross-validation is an alternative\
    \ to having a dedicated validation set.\n\n$k$-fold cross-validation works as\
    \ follows:\n\n1. Shuffle the data and partition it into $k$ equally-sized (or\
    \ as equal as possible) blocks.\n2. For $i = 1, \\dots, k$,\n    * Train the model\
    \ on all the data except block $i$.\n    * Evaluate the model (i.e. compute the\
    \ validation error) using block $i$.\n\n| 1 | 2 | 3 | 4 | 5 | 6 | ... | $k$ |\n\
    |---|---|---|---|---|---|---|---|\n| validate | train | | | | | | |\n| train validate\
    \ | | train | | | | | |\n| | train validate | | train | | | | |\n| | | | | | |\
    \ | |\n\n3. Average the $k$ validation errors; this is our final estimate of the\
    \ true error.\n\nNote that this process (except for the shuffling and partitioning)\
    \ must be repeated for every hyperparameter configuration we wish to test. This\
    \ is the principle drawback of $k$-fold cross-validation as compared to using\
    \ a held-out validation set - there is roughly $k$ times as much computation required.\
    \ This is not a big deal for the relatively small linear models we've seen so\
    \ far, but it can be prohibitively expensive when the model takes a long time\
    \ to train, as is the case in the Big Data regime or when using neural networks.\n\
    \n## Kernel Ridge Regression\n\nIn ridge regression, we give a vector $\\mathbf{y}\
    \ \\in \\mathbb{R}^n$ and a matrix $\\mathbf{X} \\in \\mathbb{R}^{n \\times l}$,\
    \ where $n$ is the number of training points and $l$ is the dimension of the raw\
    \ data points. In most settings we don't want to work with the raw feature space,\
    \ so we augment features to the data points and replace $\\mathbf{X}$ with $\\\
    mathbf{\\Phi} \\in \\mathbb{R}^{n \\times d}$, where $\\phi_i = \\phi(\\mathbf{x}_i)\
    \ \\in \\mathbb{R}^d$. Then we solve a well-defined optimization problem that\
    \ involves $\\mathbf{\\Phi}$ and $y$, where the parameters $\\mathbf{w} \\in \\\
    mathbb{R}^d$.\n\nThe problem that arises here if we use polynomial features of\
    \ degree $p$ in the raw $l$ dimensional space is that there are $d = \\binom{l+p}{p}$\
    \ terms we need to optimize, which can be very large (much larger than the number\
    \ of training points $n$). Wouldn't it be better instead of solving an optimization\
    \ problem over $d$ variables solve an equivalent problem over (potentially smaller)\
    \ $n$ variables and achieve a computational runtime independent of the number\
    \ of augmented features? It turns out, a concept of kernels called the kernel\
    \ trick will allow us to achieve this goal. Consider the solution to ridge regression:\n\
    \n$\\mathbf{w} = (\\mathbf{\\Phi}^T\\mathbf{\\Phi} + \\lambda\\mathbf{I})^{-1}\\\
    mathbf{\\Phi}^T\\mathbf{y}$\n\nThis operation involves calculating $\\mathbf{\\\
    Phi}^T\\mathbf{\\Phi}$, which is a $d \\times d$ matrix and takes $O(d^2)$ time\
    \ to compute. The matrix inversion takes an additional $O(d^3)$ time to compute.\
    \ What we really like is to have an $n \\times n$ matrix that takes $O(n^3)$ to\
    \ invert: if we flip the order of $\\mathbf{\\Phi}$ and $\\mathbf{\\Phi}$, we\
    \ end up with an $n \\times n$ matrix $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$. In fact\
    \ $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$ has an intuitive meaning: it is the matrix\
    \ of inner products between all datapoints, which measures the 'similarity' of\
    \ the datapoints and captures their representation. Now let's see if we could\
    \ somehow express the solution to ridge regression using the matrix $\\mathbf{\\\
    Phi}^T$.\n\nFor simplicity of notation, let's revert back to using $\\mathbf{X}$\
    \ instead of $\\mathbf{\\Phi}$ (pretend we are only working with raw features,\
    \ our analysis of kernel regression still holds). Rearranging the terms of the\
    \ original regression solution we have:\n\n$\\mathbf{w} = (\\mathbf{X}^T\\mathbf{X}\
    \ + \\lambda\\mathbf{I})^{-1}\\mathbf{X}^T\\mathbf{y}$\n$(\\mathbf{X}^T\\mathbf{X}\
    \ + \\lambda\\mathbf{I})\\mathbf{w} = \\mathbf{X}^T\\mathbf{y}$\n$\\mathbf{X}^T\\\
    mathbf{X} + \\lambda\\mathbf{w} = \\mathbf{X}^T\\mathbf{y}$\n$\\mathbf{w} = \\\
    frac{1}{\\lambda}(\\mathbf{X}^T\\mathbf{y} - \\mathbf{X}^T\\mathbf{X})$\n\nwhich\
    \ says that whatever $\\mathbf{w}$ is, it is some linear combination of the training\
    \ points $\\mathbf{x}_i$ (because anything of the form $\\mathbf{X}^T\\mathbf{v}$\
    \ is a linear combination of the columns of $\\mathbf{X}^T$, which are the training\
    \ points). To find $\\mathbf{w}$ it suffices to find $\\mathbf{v}$, where $\\\
    mathbf{w} = \\mathbf{X}^T\\mathbf{v}$. Recall that the relationship we have to\
    \ satisfy is $\\mathbf{X}^T\\mathbf{X} + \\lambda\\mathbf{w} = \\mathbf{X}^T\\\
    mathbf{y}$. Let's assume that we have $\\mathbf{v}$, and substitute $\\mathbf{v}$\
    \ in $\\mathbf{w}$ for all the $\\mathbf{w}$:\n\n$\\mathbf{X}^T(\\mathbf{X}\\\
    mathbf{v}) + \\lambda(\\mathbf{X}^T\\mathbf{v}) = \\mathbf{X}^T\\mathbf{y}$\n\n\
    ## 1.6 KERNEL RIDGE REGRESSION\n\n$\\mathbf{X}^T\\mathbf{v} + \\mathbf{X}^T(\\\
    lambda v) = \\mathbf{X}^T\\mathbf{y}$\n$\\mathbf{X}^T(\\mathbf{X}\\mathbf{v} +\
    \ \\lambda v) = \\mathbf{X}^T\\mathbf{y}$\n\nWe can't isolate $v$ and have a closed-form\
    \ solution for it, but we *can* make the observation if we found an $v$ such that\
    \ we had\n\n$\\mathbf{X}^T\\mathbf{v} + \\lambda v = u$\n\nwould *imply* that\
    \ this $v$ also satisfies the above equation. Note that we did not *cancel* the\
    \ $\\mathbf{X}^T$s on both sides of the equation. We saw that having $v$ satisfy\
    \ one equation implied that it satisfied the other as well. So, indeed, we can\
    \ isolate $v$ in this new equation:\n\n$\\mathbf{X}^T(\\mathbf{X} + \\lambda I)\\\
    mathbf{v} = u \\implies \\mathbf{v}^* = (\\mathbf{X}^T\\mathbf{X} + \\lambda I)^{-1}u$\n\
    \nand have that the $V$ which satisfies this equation will be $\\mathbf{X}^T\\\
    mathbf{v}$ equals $u$. We conclude that the optimal $\\mathbf{w}$ is\n\n$\\mathbf{w}^*\
    \ = \\mathbf{X}^T\\mathbf{v}^* = \\mathbf{X}^T(\\mathbf{X}^T\\mathbf{X} + \\lambda\
    \ I)^{-1}u$\n\nRecall that we previously derived ridge regression and ended up\
    \ with\n\n$\\mathbf{w}^* = (\\mathbf{X}^T\\mathbf{X} + \\lambda I)^{-1}\\mathbf{X}^T\\\
    mathbf{y}$\n\nIn fact, these are two equivalent expressions! The question that\
    \ arises is which expression should you pick? Which is more *efficient* to calculate?\
    \ We will answer this question after we introduce kernels.\n\n### Linear Algebra\
    \ Derivation\n\nThe previous derivation involved using some intuitive manipulations\
    \ to achieve the desired result. Let's formalize our derivation using more principled\
    \ arguments from linear algebra and optimization (FTLA): Before we do, we must\
    \ first introduce the **Fundamental Theorem of Linear Algebra** That a matrix\
    \ (linear map) $X$ maps $\\mathbb{R}^d$ to $\\mathbb{R}^n$. $\\mathcal{N}(\\mathbf{X})$\
    \ is the nullspace of $\\mathbf{X}$, and $\\mathcal{R}(\\mathbf{X})$ is the range\
    \ of $\\mathbf{X}$. Then the following properties hold:\n\n1. $\\mathcal{N}(\\\
    mathbf{X}) \\perp \\mathcal{R}(\\mathbf{X}^T) = \\mathbb{R}^d$ and $\\mathcal{N}(\\\
    mathbf{X}^T) \\perp \\mathcal{R}(\\mathbf{X}) = \\mathbb{R}^n$\n2. $\\mathcal{R}(\\\
    mathbf{X}) \\oplus \\mathcal{N}(\\mathbf{X}^T) = \\mathbb{R}^n$\n3. $\\mathbb{R}^d\
    \ = \\mathcal{R}(\\mathbf{X}^T) \\oplus \\mathcal{N}(\\mathbf{X})$\n\nThe symbol\
    \ $\\perp$ indicates that taking a direct sum of $\\mathcal{N}(\\mathbf{X})$ and\
    \ $\\mathcal{R}(\\mathbf{X}^T)$, means that for $u \\in \\mathbb{R}^d$ there exist\
    \ unique elements $u_1 \\in \\mathcal{N}(\\mathbf{X})$ and $u_2 \\in \\mathcal{R}(\\\
    mathbf{X}^T)$ such that $u = u_1 + u_2$. Furthermore, $\\mathcal{N}(\\mathbf{X})$\
    \ and $\\mathcal{R}(\\mathbf{X}^T)$ are orthogonal subspaces.\n\nHere is where\
    \ FTLA comes in the context of ridge regression. We can express any $\\mathbf{w}\
    \ \\in \\mathbb{R}^d$ as a unique combination $\\mathbf{w} = \\mathbf{w}_1 + \\\
    mathbf{w}_2$, where $\\mathbf{w}_1 \\in \\mathcal{R}(\\mathbf{X}^T)$ and $\\mathbf{w}_2\
    \ \\in \\mathcal{N}(\\mathbf{X})$. We can express this as $\\mathbf{w} = \\mathbf{X}^T\\\
    mathbf{v} + \\mathbf{r}$, where $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\mathbf{r}\
    \ \\in \\mathcal{N}(\\mathbf{X})$. Instead, of optimizing over $\\mathbf{w} \\\
    in \\mathbb{R}^d$, we can optimize over $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\\
    mathbf{r} \\in \\mathbb{R}^l$, which equates to optimizing over $n+l$ variables.\
    \ However, as we see, the optimization over will be trivial since we just have\
    \ to optimize an $n$ dimensional problem\n\nWe know that $\\mathbf{w}^* = \\mathbf{X}^T\\\
    mathbf{v}^* + \\mathbf{r}$, where $\\mathbf{v} \\in \\mathbb{R}^n$ and $\\mathbf{r}\
    \ \\in \\mathcal{N}(\\mathbf{X})$.\n"
  mdcn: "\n\n## 1.5. 超参数与验证\n\n![](img/99defe26aebed215976e83d281581f33_14_0.png)\n\
    \n### 交叉验证\n\n划分一个验证集是有效的，但这种方法是有代价的，因为我们无法将验证数据用于训练。由于拥有更多数据通常会提高训练模型的质量，我们可能不希望让这些数据被浪费，特别是当我们的初始数据很少且/或收集更多数据的成本非常高昂时。交叉验证是设置专用验证集的替代方案。\n\
    \n$k$-折交叉验证的工作原理如下：\n\n1.  打乱数据，并将其划分为 $k$ 个等大小（或尽可能相等）的块。\n2.  对于 $i = 1, \\\
    dots, k$，\n    * 在除第 $i$ 块以外的所有数据上训练模型。\n    * 使用第 $i$ 块评估模型（即计算验证误差）。\n\n| 1\
    \ | 2 | 3 | 4 | 5 | 6 | ... | $k$ |\n|---|---|---|---|---|---|---|---|\n| 验证 |\
    \ 训练 | | | | | | |\n| 训练 | 验证 | 训练 | | | | | |\n| | 训练 | 验证 | 训练 | | | | |\n|\
    \ | | | | | | | | |\n\n3.  对 $k$ 个验证误差平均；这是我们对真实误差的最终估计。\n\n注意，这个过程（打乱和划分除外）对于我们想要测试的每个超参数配置都必须重复。这是\
    \ $k$-折交叉验证与使用留验证集相比的主要缺点——所需的计算量大约是 $k$ 倍。对于我们目前看到的较小的线性模型来说，这不是大问题，但当模型训练需要很长时间时（例如在大数据时代或使用神经网络时），成本可能会高到无法接受。\n\
    \n## 核岭回归 (Kernel Ridge Regression)\n\n在岭回归中，我们给定一个向量 $\\mathbf{y} \\in \\mathbb{R}^n$\
    \ 和一个矩阵 $\\mathbf{X} \\in \\mathbb{R}^{n \\times l}$，其中 $n$ 是训练点数，$l$ 是原始数据点的维度。在大多数情况下，我们不希望在原始特征空间中工作，因此我们对数据点进行特征增强，并将\
    \ $\\mathbf{X}$ 替换为 $\\mathbf{\\Phi} \\in \\mathbb{R}^{n \\times d}$，其中 $\\phi_i\
    \ = \\phi(\\mathbf{x}_i) \\in \\mathbb{R}^d$。然后我们求解一个涉及 $\\mathbf{\\Phi}$ 和 $y$\
    \ 的定义优化问题，其中参数 $\\mathbf{w} \\in \\mathbb{R}^d$。\n\n如果我们在原始 $l$ 维空间中使用 $p$ 阶多项式特征，出现的问题是有\
    \ $d = \\binom{l+p}{p}$ 个我们需要优化的项，这个值可能非常大（远大于训练点数 $n$）。与其在 $d$ 个变量上求解优化问题，不如在（可能更小的）$n$\
    \ 个变量上求解等效问题，并实现与增强特征数量无关的计算运行时间吗？事实证明，一种被称为“核技巧”（kernel trick）的核概念允许我们实现这一目标。考虑岭回归的解：\n\
    \n$\\mathbf{w} = (\\mathbf{\\Phi}^T\\mathbf{\\Phi} + \\lambda\\mathbf{I})^{-1}\\\
    mathbf{\\Phi}^T\\mathbf{y}$\n\n该操作涉及计算 $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$，它是一个\
    \ $d \\times d$ 矩阵，需要 $O(d^2)$ 的时间。矩阵求逆还需要额外的 $O(d^3)$ 时间。我们真正想要的是一个需要 $O(n^3)$\
    \ 时间来求逆的 $n \\times n$ 矩阵：如果我们翻转 $\\mathbf{\\Phi}$ 和 $\\mathbf{\\Phi}$ 的顺序，最终得到一个\
    \ $n \\times n$ 矩阵 $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$。事实上，$\\mathbf{\\Phi}^T\\\
    mathbf{\\Phi}$ 有直观的含义：它是所有数据点之间内积的矩阵，衡量了数据点之间的“相似性”并捕捉了它们的表示。现在让我们看看是否能用用矩阵 $\\\
    mathbf{\\Phi}^T$ 表示岭回归的解。\n\n为了符号简便，让我们回到使用 $\\mathbf{X}$ 而不是 $\\mathbf{\\Phi}$（假设我们只处理原始特征，我们对核回归的分析仍然成立）。重新排列原始回归解的项，我们得到：\n\
    \n$\\mathbf{w} = (\\mathbf{X}^T\\mathbf{X} + \\lambda\\mathbf{I})^{-1}\\mathbf{X}^T\\\
    mathbf{y}$\n$(\\mathbf{X}^T\\mathbf{X} + \\lambda\\mathbf{I})\\mathbf{w} = \\\
    mathbf{X}^T\\mathbf{y}$\n$\\mathbf{X}^T\\mathbf{X} + \\lambda\\mathbf{w} = \\\
    mathbf{X}^T\\mathbf{y}$\n$\\mathbf{w} = \\frac{1}{\\lambda}(\\mathbf{X}^T\\mathbf{y}\
    \ - \\mathbf{X}^T\\mathbf{X})$\n\n这说明无论 $\\mathbf{w}$ 是什么，它都是训练点 $\\mathbf{x}_i$\
    \ 的某种线性组合（因为任何形式为 $\\mathbf{X}^T\\mathbf{v}$ 的项都是 $\\mathbf{X}^T$ 列的线性组合，而 $\\\
    mathbf{X}^T$ 的列就是训练点）。为了找到 $\\mathbf{w}$，只需找到 $\\mathbf{w}$ 即可（注：此处原文逻辑似乎略有混乱，翻译遵循原文语意）。找到\
    \ $\\mathbf{w}$ 只需要找到 $\\mathbf{w}$。无论 $\\mathbf{w}$ 是什么，它都是训练点 $\\mathbf{x}_i$\
    \ 的某种线性组合（因为任何形式为 $\\mathbf{X}^T\\mathbf{v}$ 的项都是 $\\mathbf{X}^T$ 列的线性组合，而 $\\\
    mathbf{X}^T$ 的列就是训练点）。找到 $\\mathbf{w}$ 只需要找到 $\\mathbf{w}$。无论 $\\mathbf{w}$ 是什么，它都是训练点\
    \ $\\mathbf{x}_i$ 的某种线性组合（因为任何形式为 $\\mathbf{X}^T\\mathbf{v}$ 的项都是 $\\mathbf{X}^T$\
    \ 列的线性组合，而 $\\mathbf{X}^T$ 的列就是训练点）。找到 $\\mathbf{w}$ 只需要找到 $\\mathbf{w}$。无论 $\\\
    mathbf{w}$ 是什么，它都是训练点 $\\mathbf{x}_i$ 的某种线性组合（因为任何形式为 $\\mathbf{X}^T\\mathbf{v}$\
    \ 的项都是 $\\mathbf{X}^T$ 列的线性组合，而 $\\mathbf{X}^T$ 的列就是训练点）。\n\n## 1.6. 核回归 (KERNEL\
    \ REGRESSION)\n\n$\\mathbf{X}^T\\mathbf{y}$\n$\\mathbf{X}\\mathbf{y} + \\lambda\
    \ v$\n\n我们不能孤立 $v$，但我们可以通过以下方式来孤立 $v$：\n\n$\\mathbf{X}^T\\mathbf{y}$\n$\\mathbf{X}\\\
    mathbf{y} + \\lambda v$\n\n$\\mathbf{w} = \\mathbf{X}^T(\\mathbf{X} + \\lambda\
    \ I)^{-1}$\n$\\mathbf{w} = \\mathbf{X}^T(\\mathbf{X} + \\lambda I)^{-1}$\n1. \
    \ $\\mathbf{w} = \\mathbf{X}^T\\mathbf{y}$\n\n$\\mathbf{w} = \\mathbf{X}^T(\\\
    mathbf{X} + \\lambda I)^{-1}$\n1.  $\\mathbf{w} = \\mathbf{X}^T\\mathbf{y}$\n\n\
    事实上，这些表达式是等价的！出现的问题是选择哪一个？我们在引入核之后回答这个问题。\n\n### 线性代数推导 (Linear Algebra Derivation)\n\
    \n我们的推导包含了一些直观的线性代数论据。在此之前，我们需要通过更严谨的线性代数来形式化我们的推导（FTLA）：矩阵 $X$ 映射 $\\mathbb{R}^d$\
    \ 到 $\\mathbb{R}^n$。$\\mathcal{N}(X)$ 是 $X$ 的零空间，而 $\\mathcal{R}(X)$ 是 $X$ 的列空间。它们满足以下性质：\n\
    \n1.  $\\mathcal{N}(X) \\perp \\mathcal{R}(X^T)$ 且 $\\mathcal{R}(X) \\perp \\\
    mathcal{N}(X^T)$\n2.  $\\mathcal{R}(X) \\oplus \\mathcal{N}(X^T) = \\mathbb{R}^n$\n\
    3.  $\\mathbb{R}^d = \\mathcal{R}(X^T) \\oplus \\mathcal{N}(X)$\n\n符号 $\\perp$\
    \ 表示 $\\mathcal{N}(X)$ 于 $\\mathcal{R}(X^T)$，这意味着对于任何 $u \\in \\mathbb{R}^d$，存在唯一的\
    \ $u_1 \\in \\mathcal{N}(X)$ 和 $u_2 \\in \\mathcal{R}(X^T)$ 使得 $u = u_1 + u_2$。此外，$\\\
    mathcal{N}(X)$ 和 $\\mathcal{R}(X^T)$ 是正交子空间。\n\n这就是 FTLA 在岭回归中的作用。我们可以将任何 $\\\
    mathbf{w} \\in \\mathbb{R}^d$ 表示为唯一的线性组合 $\\mathbf{w} = \\mathbf{w}_1 + \\mathbf{w}_2$，其中\
    \ $\\mathbf{w}_1 \\in \\mathcal{R}(X^T)$ 且 $\\mathbf{w}_2 \\in \\mathcal{N}(X)$。我们可以将其表示为：\n\
    $\\mathbf{w} = \\mathbf{X}^T\\mathbf{v} + \\mathbf{r}$，其中 $\\mathbf{v} \\in \\\
    mathbb{R}^n$ 且 $\\mathbf{r} \\in \\mathcal{N}(X)$。\n\n现在我们考虑岭回归的方程：\n$(\\mathbf{X}^T\\\
    mathbf{X} + \\lambda I)\\mathbf{w} = \\mathbf{X}^T\\mathbf{y}$由于 $\\mathbf{r}\
    \ \\in \\mathcal{N}(X)$，有 $\\mathbf{X}\\mathbf{r} = 0$。因此：\n$\\mathbf{X}\\mathbf{w}\
    \ = \\mathbf{X}(\\mathbf{X}^T\\mathbf{v} + \\mathbf{r}) = \\mathbf{X}\\mathbf{X}^T\\\
    mathbf{v}$\n$(\\mathbf{X}\\mathbf{X}^T + \\lambda I)\\mathbf{v} = \\mathbf{X}\\\
    mathbf{y}$\n$\\mathbf{v} = (\\mathbf{X}\\mathbf{X}^T + \\lambda I)^{-1}\\mathbf{X}\\\
    mathbf{y}$\n\n由此得到：\n$\\mathbf{w} = \\mathbf{X}^T\\mathbf{v} + \\mathbf{r} = \\\
    mathbf{X}^T(\\mathbf{X}\\mathbf{X}^T + \\lambda I)^{-1}\\mathbf{X}\\mathbf{y}\
    \ + \\mathbf{r}$\n\n这正是岭回归的解。现在，如果我们使用核技巧，就可以在 $n$ 个变量上求解问题，而不是在 $d$ 个变量上求解，从而实现计算时间与增强特征数量无关。考虑岭回归的解：\n\
    \n$\\mathbf{w} = (\\mathbf{\\Phi}^T\\mathbf{\\Phi} + \\lambda\\mathbf{I})^{-1}\\\
    mathbf{\\Phi}^T\\mathbf{y}$\n\n该操作涉及计算 $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$，它是一个\
    \ $d \\times d$ 矩阵，需要 $O(d^2)$ 的时间。矩阵求逆还需要额外的 $O(d^3)$ 时间。我们真正想要的是一个需要 $O(n^3)$\
    \ 时间来求逆的 $n \\times n$ 矩阵：如果我们翻转 $\\mathbf{\\Phi}$ 和 $\\mathbf{\\Phi}$ 的顺序，最终得到一个\
    \ $n \\times n$ 矩阵 $\\mathbf{\\Phi}^T\\mathbf{\\Phi}$。事实上，$\\mathbf{\\Phi}^T\\\
    mathbf{\\Phi}$ 有直观的含义：它是所有数据点之间内积的矩阵，衡量了数据点之间的“相似性”并捕捉了它们的表示。现在让我们看看是否能用矩阵 $\\\
