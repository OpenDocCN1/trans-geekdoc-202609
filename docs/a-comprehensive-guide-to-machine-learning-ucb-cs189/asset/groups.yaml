    in high dimensions with high probability, though the mode of the Gaussian bell
    curve is at the origin. This illustrates the phenomenon in high dimensions where
    random data is spread far apart. The k-NN classifier was designed on the principle
    that nearby points are spread of the same class however, in high dimensions, even
    the nearest neighbors that we have to a random test point tend to be far away,
    so this principle is no longer useful.


