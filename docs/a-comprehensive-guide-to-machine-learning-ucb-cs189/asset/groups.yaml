    $f_Z(\mathbf{z}) = \frac{1}{|\det(\mathbf{R})|(\sqrt{2\pi})^n} e^{-\frac{1}{2}\mathbf{z}^T\Sigma_Z}$


    此外，我们知道：


    $|det(\Sigma_Z)| = |det(R^T)| = |det(R)|^2$


    因此


    $f_Z(\mathbf{z}) = \frac{1}{\sqrt{\det(\Sigma_Z)}}(\sqrt{2\pi})^n} e^{-\frac{1}{2}\mathbf{z}^T\Sigma_Z}$


