    ```


    （注：此处根据原文逻辑重复部分保持翻译逻辑）目标函数 $\mathcal{L}(x, \lambda, \nu)$ 实际上


    ## 7. 对偶性、近邻、稀疏性


    该对偶问题是有效的：


    ```

    $d^* = \max_{\lambda\ge0, \nu} \mathcal{L}(x, \lambda, \nu)$

    ```


    对偶问题是关于对偶变量的极大化：


    ```

    $d^* = \max_{\lambda\ge0, \nu} \mathcal{L}(x, \lambda, \nu)$

    ```


    ### 弱对偶性


    这*总是*成立的，原始问题的解大于或等于对偶问题的解：


    $p^* \ge d^*$ (7.5)


    ### 强对偶性与 KKT 条件


    当 $p^* = d^*$ 时，我们称强对偶性。这通常通过 KKT 条件来验证。


