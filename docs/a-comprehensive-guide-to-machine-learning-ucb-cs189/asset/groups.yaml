    # Eckart-Young Theorem


    The Eckart-Young theorem essentially says that the best-rank approximation (in
    terms of the Frobenius norm) is obtained by throwing away the smallest singular
    values.


    ## 3.2. PRINCIPAL COMPONENT ANALYSIS


    **Theorem.** Suppose $A \in \mathbb{R}^{m \times n}$ has rank $r \le \min(m,n)$,
    and let $A = \mathbf{U}\Sigma V^\top = \sum_{i=1}^r \sigma_i \mathbf{u}_i \mathbf{v}_i^\top$
    be its singular value decomposition. Then


    ```

    $\mathbf{A}_k = \sum_{i=1}^k \sigma_i \mathbf{u}_i \mathbf{v}_i^\top = \mathbf{U}
    \begin{bmatrix} \sigma_1 & & & \dots & 0 \\ & \vdots & \ddots & & 0 \\ 0 & & \sigma_k
    & & 0 \\ \vdots & \vdots & \vdots & \\ 0 & & & & 0 \end{bmatrix} \mathbf{V}^\top$

    ```


    where $k \le r$, it is the best rank-$k$ approximation to $A$ in the sense that


    > $||\mathbf{A} - \mathbf{A}_k||_F \le ||\mathbf{A} - \hat{\mathbf{A}}||_F$


    for any $\hat{\mathbf{A}}$ such that $rank(\hat{\mathbf{A}}) \le k$.


    ## 3.2 Principal Component Analysis


    In machine learning, the data we have are often very high-dimensional. There are
    a number of reasons why we might want to work with a lower-dimensional representation:


    - Visualization (if we can get down to 2 or 3 dimensions), e.g. for exploratory
    data analysis

    - Reduce computational load

    - Reduce noise


    **Principal Component Analysis (PCA)** is an unsupervised dimensionality reduction
    technique. Given a matrix of data points, it finds one or more orthogonal directions
    that capture the largest amount of variance in the data. Intuitively, the directions
    with less variance contain less information and may be discarded without introducing
    too much error.


