  - '[PAGE 145]


    Very deep (152 layers). Residual blocks (Figure 9.8) are stacked together - each
    individual weight layer in the residual block is implemented as a $3 \times 3$
    convolution. There are no FC layers until the final layer.


    Residual blocks solve the “vanishing gradient” problem: the gradient diminishes
    in layers that are farther away from the end of the network. Let $L$ be the loss,
    $Y$ be the output at a layer, $x$ be the input. Regular neural networks have gradients
    that like


    ```

    $$\frac{\partial L}{\partial x} = \frac{\partial L}{\partial Y}\frac{\partial
    Y}{\partial x}$

    ```


    but the derivative of $Y$ with respect to $x$ can be small. If we use a residual
    block where $Y = F(x) + x$, we have


    ```

    $$\frac{\partial Y}{\partial x} = \frac{\partial F(x)}{\partial x} + 1$

    ```


    The $+x$ term in the residual block always provides some default gradient signal
    so the signal is backpropagated to the front of the network. This allows networks
    to be very deep.


    To consider this, note that the Imaging architectures have all increased in depth
    over the years. While both shallow and deep neural networks are known to be universal
    function approximators, there is growing empirical and theoretical evidence that
    deep neural networks can require fewer (exponential exponentially) parameters
    than shallow nets to achieve the same approximation performance. There is also
    evidence that deep neural networks possess better generalization capabilities
    than their shallow counterparts. The performance, generalization, and optimization
    benefits of adding more layers is an ongoing component of theoretical research.


    # Towards an Understanding of Convolutional Nets


    We know that a convolutional net learns features, but these may not be directly
    useful to visualize. There are several methods available that enable us to understand
    what convolutional nets learn. These include:


    +   - Visualizing filters - can give one kind of what features the network learns,
    such as edge detectors. This works only in the first layer. Visualizing activations
    can see sparsity in the responses as the depth increases. One can also visualize
    the feature map before a fully connected layer by conducting a neighbor search
    in feature space. This helps determine if the features learned by the CNN are
    useful - for example, in pixel space, an elephant on the left side of the image
    might not be a neighbor of an elephant on the right side of the image, but in
    a translation-invariant feature space these pictures might be neighbors.

    - Reconstruction by deconvolution - isolate an activation and reconstruct the
    original image based on that activation level

    - Activation maximization - Hubel and Wiesel''s experiment, but computationally

    - Saliency maps - find locations in the image he neuron

    - Code inversion - given a feature representation, determine the original image

    - Semantic interpretation - interpret the activations semantically (for example,
    the CNN determining whether or not is shiny when it is trying to classify?)


    See Stella''s slides for images of these techniques in practice.'
