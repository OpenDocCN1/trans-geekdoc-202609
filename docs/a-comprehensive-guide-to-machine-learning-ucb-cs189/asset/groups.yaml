    # MLE vs. MAP


    Based on our analysis of Ordinary Least Squares Regression and Ridge Regression,
    we should expect to see MAP perform better than MLE. But is that always the case?
    Let us revisit at the (slope, intercept) example from earlier. We already know
    the true underlying model parameters, and we will compare them to the values that
    MLE and MAP select. Let''s start with MLE:


    ![](img/99defe26aebed215976e83d281581f33_25_0.png)


    The diagram on the left shows the data space representation of the problem, and
    the diagram on the right shows the model space representation. The gray line in
    the left diagram and the gray dot in the right diagram are the true underlying
    model. Using noisy data samples, MLE predicts a reasonable hypothesis model (as
    indicated by the green line in the left diagram and the green dot in the right
    diagram).


    Now, let''s take a look at the hypothesis model from MAP. One question that arises
    is where the prior should be centered and what its variance should be depends
    on your belief of what the true underlying model is. If you have reason to believe
    that the model weights should all be small, then the prior should be centered
    at zero. Let''s look at MAP for a prior that is centered at zero:


    ![](img/99defe26aebed215976e83d281581f33_25_1.png)


    ## 2.1. MLE AND MAP


    For reference, we have marked the MLE estimation from before as a green point
    and the true model as a gray point. As we can see from the right diagram, using
    a prior centered at zero leads us to skew our prediction of the model weights
    toward the origin, leading to a less accurate model than MLE.


    Let''s say in our case that we have reason to believe that both model weights
    should be centered around the 0.5 to 1 range. As the first set of diagrams below
    show, our prediction would be better than MLE. However, if we believe the model
    weights should be centered around the -0.5 to 1 range, we would make a much poorer
    prediction than MLE.


    ![](img/99defe26aebed215976e83d281581f33_26_0.png)


    ![](img/99defe26aebed215976e83d281581f33_26_1.png)


    As always, in order to compare our beliefs to see which prior works best in practice,
    we should cross validation!


    ## 2.2. Bias-Variance Tradeoff


    Recall from our previous discussion for a fixed input x, the corresponding measurement
    Y is a noisy measurement of the true underlying response f(x):


    ```

    Y = f(\mathbf{x}) + N

    ```


    Where N is a zero-mean random variable, and is typically represented as a Gaussian
    distribution. Our goal in regression is to recover the underlying model f(.) as
    closely as possible. We previously mentioned MLE and MAP as techniques that try
    to find of reasonable approximation to f(.) by solving a probabilistic objective.
    In this section we would like to form a theoretical metric that can exactly measure
    the effectiveness of a hypothesis function h. Keep in mind that this is a metric
    that cannot be measured in real life, but it can be approximated via empirical
    experiments—more than later.


    Before we introduce the metric, let''s make a few subtle points about the data
    and hypothesis. As you may recall from our previous discussion on MLE and MAP,
    in this context, we treated the x_i in our dataset D that consists of n (x_i,
    y_i) pairs. In this case we treated the x_i as random variables.


    D is a random variable, because it consists of random variables X_i and Y_i. (Note
    that these quantities are random variables, and they are all represented by uppercase
    letters.) Our hypothesis model h(.) is also a random variable—h(x, D) depends
    on some arbitrary input x, as well as the random D that we used to train h. Since
    D is random, we will have a slightly different hypothesis model h(., D) every
    time we use a new dataset.


    ```

    D = {X_1, Y_1; X_2, Y_2; ...; X_n, Y_n}

    ```


    ### Metric


    Our objective is to, for a fixed value of x, evaluate how well the hypothesis
    can encapsulate the noisy observation corresponding to x. Note that we have denoted
    x as a lowercase letter because we are treating it as a fixed constant, while
    Y and D as as uppercase letters because we are treating them as random variables.
    Y and D have no relation to the set of X_i and Y_i in D. In this case, we can
    think of D as the training data, and (x, Y) as the test data—the point x is not
    necessarily in the training set D! Mathematically, we define our metric as the
    squared error between the hypothesis and the observation Y = f(\mathbf{x}) + N:


    ```

    ε(x; D) = E((h(x; D) - Y)^2)

    ```


    The expectation here is over two random variables, D and Y:


    ```

    E_Y[(h(x; D) - Y)^2] = E_D[E_Y[(h(x; D) - Y)^2]]

    ```


    Note that the error is w.r.t. the observation Y and not the true underlying model
    f(x), because we do not know the true model and only have access to the noisy
    observations from the true.


    ### Bias-Variance Decomposition


    The error metric is difficult to interpret and work with, so let''s try to decompose
    it into parts that are easier. Before start, let''s find the expectation and variance
    of Y:


    ```

    E[Y] = E[f(\mathbf{x}) + N] = f(\mathbf{x}) + E[N] = f(\mathbf{x})

    Var(Y) = Var(f(x) + N) = Var(N)

    ```


    Also, in general any random variable Z, we have

    ```

    Var(Z) = E[(Z - E[Z])^2] = E[Z^2] - E[Z]^2

    ```


    Let''s use these facts to decompose error:


    ```

    ε(x;h) = E[(h(x;D) - Y)^2] = E[(h(x;D) - E[h(x;D)] + E[h(x;D)] - Y)^2]

    = E[(h(x;D) - E[h(x;D)])^2] + E[(E[h(x;D)] - Y)^2] + 2E[(h(x;D) - E[h(x;D)]) \cdot
    (E[h(x;D)] - Y)]

    = E(h(x;D) - E[h(x;D)])^2] + E[(E[h(x;D)] - Y)^2] + 0

    = Var(h(x;D)) + E[(E[h(x;D)] - Y)^2]

    ```


    Recall that for two independent variables D and Y, g_1(D) and g_2(Y) are also
    independent. This implies that h(x;D) and Y are independent, allowing to express
    $E[h(x;D) \cdot Y] = E[h(x;D)] \cdot E[Y]$ in the second line of the derivation.
    The final bias-variance decomposition consists of three terms:


    - **Bias**: Measures how much the average (over all training sets) can come to
    the true value f(x), for a fixed value of x. A low bias means that the aggregator
    h(x) accurately estimates f(x).

    - **Variance**: Measures the variance of the hypothesis (over possible training
    sets), for a fixed value of x. A low variance means that prediction does not change
    much as training sets vary. An unbiased method (bias = 0) could have a large variance.

    - **Irreducible error**: This is the error in our model that we cannot control
    or eliminate, because it is due to errors in our noisy observation Y.


    The decomposition allows us to measure the error in bias, variance, and irreducible
    error. Irreducible error has no relation to the hypothesis model, so we can ignore
    it in theory when minimizing the error. As we have discussed, models that have
    little bias because on average find the true underlying model value f(x) well,
    have high variance and are very far from f(x) on an individual basis.


    Note that the error is only for a fixed input x, but in regression our goal is
    to minimize the average error over all possible values of X. If we know the distribution
    for X, we can find the effectiveness of a hypothesis model as a whole by taking
    an expectation of the error over all possible values of x: $E[\epsilon(x;h)]$.


    ### Decomposition


    The previous derivation is short, but may seem somewhat arbitrary. Let''s explore
    an alternative derivation. At its core, it use the technique that $E[(Z - Y)^2]
    = E[(Z - E[Z]) + (E[Z] - Y)^2]$ which decomposes to easily use the variance of
    $Z$ and other terms.


    $\epsilon(x;h) = E[(b(x;D) - Y)^2]$


    ```

    $= E\left[(h(x;\mathcal{D}) - E[h(x;\mathcal{D})] + E[h(x;\mathcal{D})] - Y]^2\right]$

    = E\left[\left(h(x;\mathcal{D}) - E[h(x;\mathcal{D})]\right)^2 + E\left[\left(E[h(x;\mathcal{D})]
    - Y\right)^2\right] + 2E\left[(h(x;\mathcal{D}) - E[h(x;\mathcal{D})]) \cdot E[h(x;\mathcal{D})]
    - Y]\right]$$

    = E\left[\left(h(x;\mathcal{D}) - E[h(x;\mathcal{D})]\right)^2 + E\left[\left(E[h(x;\mathcal{D})]
    - Y\right)^2\right] + 2E\left[(h(x;\mathcal{D}) - E[h(x;\mathcal{D})]) \cdot E[h(x;\mathcal{D})
    - Y]\right]\right]$$$

    $= Var((h(x;\mathcal{D})\right)) + E\left[\left(E[h(x;\mathcal{D})] - Y\right)^2\right]$$

    ```


    # Experiments


    Let''s confirm the theory behind the bias-variance decomposition with an experiment
    that measures the bias and variance for polynomial regression with 0 degree, 1st
    degree, and 2nd degree polynomials. In our experiment, we repeatedly fit our hypothesis
    model to a random training set. We then find the expectation and variance of the
    fitted models generated from these training sets.


    Let''s first look at a0 degree (constant) regression model. We repeatedly fit
    an optimal constant line to a training set of 10 points. The true model is denoted
    by gray and the hypothesis is denoted by red. Notice that at each time the red
    line is slightly different due to the different training set used.

