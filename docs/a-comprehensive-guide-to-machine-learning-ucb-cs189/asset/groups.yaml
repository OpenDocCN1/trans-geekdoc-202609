    # 2.3 Weighted Least Squares


    So far we used MLE in the context of Gaussian noise to justify the optimization
    formulation of regression problems, such as OLS. Let''s apply this dual optimization-probability
    philosophy to other regression problems, such as Weighted Least Squares.


    # Optimization View


    The basic idea of weighted least squares is the following: we place more emphasis
    on the loss contributed from certain data points over others - that is, we care
    more about fitting some data points over others. From an optimization perspective,
    the problem can be expressed as


    ```

    $w_{WLS} = \arg\min_{w \in \mathbb{R}^d} \sum_{i=1}^n \omega_i(y_i - x_i^T w)^2$

    ```


    This objective is the same as OLS, except that each term in the sum is weighted
    by a coefficient $\omega_i$. As always, we can vectorize this problem:


    ```

    $w_{WLS} = \arg\min_{w \in \mathbb{R}^d} (y - Xw)^T \Omega (y - Xw)$

    ```


    Where the $i$''th row $X$ is $x_i^T$, and $\Omega \in \mathbb{R}^{n \times n}$
    is a diagonal matrix with $\Omega_{i,i} = \omega_i$.

    We rewrite the WLS objective as


    ```

    $w_{WLS} = \arg\min_{w \in \mathbb{R}^d} (y - Xw)^T \Omega^{1/2} \Omega^{1/2}
    (y - Xw)$

    $= \arg\min_{w \in \mathbb{R}^d} (\Omega^{1/2}y - \Omega^{1/2}Xw)^T (\Omega^{1/2}y
    - \Omega^{1/2}Xw)$

    ```


    This formulation is identical to OLS except that we have the data matrix and the
    observation vector by $\Omega^{1/2}$, we conclude that


    ```

    $w_{WLS} = ((\Omega^{1/2}X)^T (\Omega^{1/2}X))^{-1} (\Omega^{1/2}X)^T \Omega^{1/2}y
    = (X^T\Omega X)^{-1} X^T\Omega y$

    ```'
