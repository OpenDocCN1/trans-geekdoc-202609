    ## CNN Architectures


    Convolutional Neural Networks were first applied successfully to the ImageNet
    challenge in 2012 and continue to outperform computer vision techniques that do
    not use neural networks. Here are a few of the architectures that have been developed
    over the years.


    ### AlexNet (Krizhevsky, et al, 2012)


    Key characteristics:


    - Conv filters of varying sizes - for example, the first layer has 11 x 11 conv
    filters

    - First use of ReLU, which fixed the problem of saturating gradients in the predominant
    tanh activation.


    ![](img/99defe26aebed215976e83d281581f33_143_0.png)


