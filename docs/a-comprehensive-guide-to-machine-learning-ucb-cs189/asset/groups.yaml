    ```\n\n就像岭回归一样，L1 范数有一个统计学上的依据。岭回归假设权重 $w$ 服从高斯先验分布，而 LASSO 假设权重 $w$ 服从**拉普拉斯先验（也称为双指数分布）**。\n\
