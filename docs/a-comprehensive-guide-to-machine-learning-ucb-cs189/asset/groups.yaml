    为了求解 $\mathbf{w}^*_{OLS}$，我们需要以下事实$^1$：


    $$\text{null}(\mathbf{X}^T) = \text{range}(\mathbf{X})\perp$$


    由于我们投影到 range($\mathbf{X}$)，最优性的正交条件是 $\mathbf{y} - P_{\mathbf{X}}\mathbf{y} \perp
    \text{range}(\mathbf{X})$，即 $\mathbf{y} - \mathbf{X}\mathbf{w}^*_{OLS} \in \text{null}(\mathbf{X}^T)$。这导致方程：


    $$\mathbf{y}^T(\mathbf{y} - \mathbf{X}\mathbf{w}^*_{OLS}) = 0$$


    这与之前等价于


    $$\mathbf{X}^T\mathbf{X}\mathbf{w}^*_{OLS} = \mathbf{X}^T\mathbf{y}$$


    ## 1.3 岭回归


    虽然最小二乘法可以用于解决线性二乘问题，但由于数值不稳定性和泛化问题而显得不从心。当数据的特征接近共线性时（导致特征列线性相关），会出现数值不稳定，导致


    > $1$ 该结果通常被作为线性代数基本定理的一部分给出。


    ## 1.3 岭回归


    为什么奇异值不好？让我们通过 $\mathbf{X}$ 的奇异值分解（SVD）来说明：


    $$\mathbf{X} = U\Sigma V^T$$


    其中 $U \in \mathbb{R}^{n \times n}$，$\Sigma \in \mathbb{R}^{n \times d}$，$V \in
    \mathbb{R}^{n \times d}$。在 OLS 的背景下，必须有 $\mathbf{X}^T\mathbf{X}$ 是可逆的，等价于 $\text{rank}(\mathbf{X}^T\mathbf{X})
    = \text{rank}(\mathbf{X}) = d$。假设 $\mathbf{X}$ 和 $\mathbf{X}^T$ 满秩 $d$，我们可以将 $\mathbf{X}$
    的 SVD 表示为：


    $$\mathbf{X} = U \begin{bmatrix} \Sigma_d & 0 \end{bmatrix} V^T$$


    其中 $\Sigma_d \in \mathbb{R}^{d \times d}$ 是一个具有严格正元素的对角矩阵。现在让我们尝试用 SVD 展开 $(\mathbf{X}^T\mathbf{X})^{-1}$：


    $$(\mathbf{X}^T\mathbf{X})^{-1} = (V \begin{bmatrix} \Sigma_d \\ 0 \end{bmatrix}
    U^T U \begin{bmatrix} \Sigma_d & 0 \end{bmatrix} V^T)^{-1} = (V \Sigma_d^2 V^T)^{-1}
    = V \Sigma_d^{-2} V^T$$


    这意味着 $(\mathbf{X}^T\mathbf{X})^{-1}$ 的奇异值是 $\mathbf{X}$ 的奇异值的平方，当 $\mathbf{X}$
    的奇异值接近 0 时，会导致极大的值。这种巨大的值对数值稳定性是有问题的。此外，最优 $\mathbf{w}$ 的高值会阻止 OLS 泛化到未见数据。解决这些问题有一个简单的方法：惩罚过大的
    $\mathbf{w}$。我们可以通过添加约束 $\mathbf{w}$ 范数的来实现。对于固定的尺度 $\lambda > 0$，我们有：


    $$\min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2 + \lambda||\mathbf{w}||_2$$


    注意目标函数中的 $\lambda$ 是对 $\mathbf{w}$ 敏感的超参数。就像特征次数一样，$\lambda$ 是我们需要通过验证选择的值。让我们展开目标函数的项：


    $$f(\mathbf{w}) = ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2 + \lambda||\mathbf{w}||_2^2
    = \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{y}^T\mathbf{X}^T\mathbf{w}
    + \mathbf{y}^T\mathbf{y} + \lambda\mathbf{w}^T\mathbf{w}$$


    最后对目标函数求梯度，找到梯度为 0 的 $\mathbf{w}$：


    $$\nabla f(\mathbf{w})=2\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{X}^T\mathbf{y}
    + 2\lambda\mathbf{w} = 0$$


    $$(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})\mathbf{w} = \mathbf{X}^T\mathbf{y}$$


    由于目标函数是强凸的，该值保证达到（唯一的）全局最小值，因此只需计算 $f$ 的海森矩阵，在这种情况下为：


    $$\nabla^2 f(\mathbf{w})=2(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})$$


    它是正定的（PD）：


    $$\mathbf{w}^T(2\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})\mathbf{w} = 2\mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w}
    + 2\lambda\|\mathbf{w}\|^2 > 0$$


    由于海森矩阵是正定的，我们可以等价地说海森矩阵的特征值严格为，且目标函数是强凸的。强凸函数的一个有用属性是它们具有唯一最优解，因此解是唯一的。我们无法对普通二乘法保证这一点，因为对应的海森矩阵特征值可能为
    0。正如我们在 OLS 中探索的，当海森矩阵具有 0 特征值时，此时 $X^T$ 不逆，但这并不意味着解不存在！OLS 总是存在解，而当海森矩阵正半定（PSD）时，有多个解。方程
    $\mathbf{X}^T\mathbf{X}\mathbf{w}=\mathbf{X}^T\mathbf{y}$ 总是有解，因为 $\mathbf{X}^T\mathbf{X}$
    的范围和 $\mathbf{X}$ 的范围是等价的；由于 $\mathbf{y}$ 位于 $\mathbf{X}^T$ 的范围内，它必须等价地位于 $\mathbf{X}^T$
    的范围内，因此存在满足 $\mathbf{X}^T\mathbf{X}\mathbf{w}=\mathbf{X}^T\mathbf{y}$ 的 $\mathbf{w}$。


    我们讨论的技术被称为岭回归（统计学中也称为 Tikhonov 正化）。注意无论 $X$ 的秩如何，表达式 $\mathbf{X}^T\mathbf{X} +
    \lambda\mathbf{I}$ 都是可逆的。首先：


    $$(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})^{-1} = \left(V \begin{bmatrix}
    \Sigma_r^2 & 0 \\ 0 & 0 \end{bmatrix} U^T U \begin{bmatrix} \Sigma_r^2 & 0 \\
    0 & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r^2 & 0 \\ 0 & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r^2 & 0 \\ 0 & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r^2 + \lambda\mathbf{I} & 0 \\ 0 & 0 \end{bmatrix}
    V^T\right)^{-1}$$

    $$= (V^T)^{-1} \begin{bmatrix} \Sigma_r^2 + \lambda\mathbf{I} & 0 \\ 0 & \lambda\mathbf{I}
    \end{bmatrix}^{-1} V$$

    $$= V \begin{bmatrix} (\Sigma_r^2 + \lambda\mathbf{I})^{-1} & 0 \\ 0 & \lambda^{-1}
    \end{bmatrix} V^T$$


    通过我们的微调，矩阵 $\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I}$ 是满秩的，因此是可的。奇异值保证最大为 $\frac{1}{\sqrt{\lambda}}$
    和 $\sqrt{\lambda}$，解决了数值不稳定问题。此外，我们部分解决了过拟合问题。通过惩罚 $\mathbf{x}$ 的范数，我们鼓励对应于捕捉真实模型主要结构的相关特征的权重，并惩罚了仅用于微调模型和拟合数据噪声的复杂特征的权重。


