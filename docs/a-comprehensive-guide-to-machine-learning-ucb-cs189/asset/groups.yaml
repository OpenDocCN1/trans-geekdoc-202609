    following the last convolution.

    - Trained over two GPU’s - the top and bottom divisions in Figure 9.6 were due
    to the need to separate training onto two GPUs. There was limited communication
    between the GPU’s, as illustrated by the arrows that go between the top and bottom.

    - Dropout in its first FC layers - prevents overfitting

