    Why are singular values bad? Let us illustrate via the singular value decomposition
    (SVD) of $\mathbf{X}$:


    $$\mathbf{X} = U\Sigma V^T$$


    where $U \in \mathbb{R}^{n \times n}$, $\Sigma \in \mathbb{R}^{n \times d}$, $V
    \in \mathbb{R}^{n \times d}$. In the context of OLS, we must have that $\mathbf{X}^T\mathbf{X}$
    is invertible, or equivalently, $\text{rank}(\mathbf{X}^T\mathbf{X}) = \text{rank}(\mathbf{X})
    = d$. Assuming that $\mathbf{X}$ and $\mathbf{X}^T$ are full rank $d$, we can
    express the SVD of $\mathbf{X}$ as


    $$\mathbf{X} = U \begin{bmatrix} \Sigma_d & 0 \end{bmatrix} V^T$$


    where $\Sigma_d \in \mathbb{R}^{d \times d}$ is a diagonal matrix with strictly
    positive entries. Now let''s try to expand the $(\mathbf{X}^T\mathbf{X})^{-1}$
    term in terms of SVD:


    $$(\mathbf{X}^T\mathbf{X})^{-1} = (V \Sigma_d^T U^T U \begin{bmatrix} \Sigma_d
    \\ 0 \end{bmatrix} V^T)^{-1} = (V \Sigma_d^2 V^T)^{-1} = V (\Sigma_d^2)^{-1} V^T
    = V \Sigma_d^{-2} V^T$$


    This means that $(\mathbf{X}^T\mathbf{X})^{-1}$ will have singular values that
    are the squared of the singular values of $\mathbf{X}$, potentially leading to
    extremely large values when the singular value of $\mathbf{X}$ is close to 0.
    Such excessively large values can be problematic for numerical stability. In addition,
    high values to the optimal $\mathbf{w}$ solution would prevent OLS from generalizing
    to unseen data.


    There is a very simple solution to these issues: penalize the entries of $\mathbf{w}$
    from becoming too large. We can do this by adding a penalty term constraining
    the norm of $\mathbf{w}$. For a fixed, small scale $\lambda > 0$, we have:


    $$\min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2 + \lambda|mathbf{w}||_2^2$$


    Note that the $\lambda$ in our objective function is a hyperparameter that measures
    the sensitivity to the values in $\mathbf{w}$. Like the degree in polynomial features,
    $\lambda$ is a value that we must choose through validation. Let''s expand the
    terms of the objective function


    $$f(\mathbf{w}) = ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2 + \lambda||\mathbf{w}||_2^2
    = \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{y}^T\mathbf{X}\mathbf{w}
    + \mathbf{y}^T\mathbf{y} + \lambda\mathbf{w}^T\mathbf{w}$$


    Finally take the gradient of the objective and find the value of $\mathbf{w}$
    that achieves the gradient $\nabla f(\mathbf{w})=2\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{X}^T\mathbf{y} + 2\lambda\mathbf{w} = 0$$


    $$(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})\mathbf{w} = \mathbf{X}^T\mathbf{y}$$


    This value is guaranteed to achieve the (unique) global minimum because the objective
    function is strongly convex, so it suffices to compute the Hessian of $f$, which
    in this case is


    $$\nabla^2 f(\mathbf{w}) = 2(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})$$


    and show that this is positive definite (PD):


    $$\mathbf{w}^T(2\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})\mathbf{w} = 2\mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w}
    + 2\lambda\|\mathbf{w}\|^2 > 0$$


    Since the Hessian is positive definite, we can equivalently say that the eigenvalues
    of the Hessian are strictly positive and that the objective function is strongly
    convex. A useful property of strongly convex functions is that they have a unique
    optimum, so the solution is unique. We cannot make such guarantees about ordinary
    squares because the corresponding Hessian could have eigenvalues that are 0. As
    we explore in OLS when the Hessian has a 0 eigenvalue, in this context the term
    $\mathbf{X}^T$ is not invertible, but this does *not* imply that no solution exists!
    In OLS, there always exists a solution, and when the Hessian is PSD there are
    infinitely many solutions. There always exist a solution to the equation $\mathbf{X}^T\mathbf{X}\mathbf{w}=\mathbf{X}^T\mathbf{y}$
    because the range of $\mathbf{X}^T\mathbf{X}$ and the range of $\mathbf{X}$ are
    equivalent; since $\mathbf{y}$ lies in the range of $\mathbf{X}^T$, it must equivalently
    lie in the range of $\mathbf{X}^T$ and therefore there exists a $\mathbf{w}$ that
    satisfies the equation $\mathbf{X}^T\mathbf{X}\mathbf{w}=\mathbf{X}^T\mathbf{y}$.


    The technique we discussed is known as ridge regression (otherwise known as Tikhonov
    regularization in the statistics community). Note that the expression $\mathbf{X}^T\mathbf{X}
    + \lambda\mathbf{I}$ is invertible, regardless of rank of $\mathbf{X}$. Let first


    $$(\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})^{-1} = \left(V \begin{bmatrix}
    \Sigma_r^2 & 0 & 0 & 0 \end{bmatrix} \mathbf{U}^T\}{U{ \} \Sigma} \Sigma r & 0
    & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r & 0 \\ 0 & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r^2 & 0 \\ 0 & 0 \end{bmatrix} V^T + \lambda\mathbf{I}\right)^{-1}$$

    $$= \left(V \begin{bmatrix} \Sigma_r^2 + \lambda\mathbf{I} & 0 \\ 0 & 0 \end{bmatrix}
    V^T\right)^{-1}$$

    $$= (V^T)^{-1} \begin{bmatrix} \Sigma_r^2 + \lambda\mathbf{I} & 0 \\ 0 & \lambda\mathbf{I}
    \end{bmatrix}^{-1} V$$

    $$= V \begin{bmatrix} (\Sigma_r^2 + \lambda\mathbf{I})^{-1} & 0 \\ 0 & \lambda^{-1}
    \end{bmatrix} V^T$$


    With our slight tweak, the matrix $\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I}$
    has full rank and thus invertible. The singular values are guaranteed to be at
    most $\frac{1}{\sqrt{\lambda}}$ and $\sqrt{\lambda}$, solving numerical instability
    issues. Furthermore, we have partially solved the overfitting issue. By penalizing
    the norm of $\mathbf{x}$, we encourage the weights corresponding to relevant features
    that capture the main structure of the true model, and penalized the weights corresponding
    to complex features that only serve to fine tune the model and fit noise in the
    data.

