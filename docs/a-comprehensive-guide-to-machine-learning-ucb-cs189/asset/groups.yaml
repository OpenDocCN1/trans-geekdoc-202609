    令 $\mathbf{R}_Z = \sqrt{\Sigma_Z} = \mathbf{Q} \begin{pmatrix} \sigma_1 & 0 &
    \dots & 0 \\ 0 & \sigma_2 & \dots & 0 \\ \vdots & \vdots & \ddots & \vdots \\
    0 & 0 & \dots & \sigma_n \end{pmatrix}$


