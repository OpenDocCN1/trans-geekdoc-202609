    Phi_{ij} = \langle\phi(x_i), \phi(x_j)\rangle = k(x_i, x_j)

    $$


    其中 $k(\cdot)$ 是**核**函数。核函数接受原始特征输入，并输出它们在增强特征空间中的内积。我们定义 $k(x_i, x_j)$ 矩阵为**格姆矩阵**（Gram
    matrix），并记为 $\mathbf{K}$：


    $$

    \mathbf{K} = \Phi^T\Phi = \begin{pmatrix} k(x_1, x_1) & k(x_1, x_2) & \dots \\
    k(x_2, x_1) & k(x_2, x_2) & \dots \\ \vdots & \vdots & \vdots \\ k(x_n, x_1) &
    k(x_n, x_2) & \dots \end{pmatrix}

    $$


    形式上，如果存在特征映射 $\phi(\cdot)$ 使得对于所有 $x_2$，

    则 $k(x_1, x_2)$ 是有效的核：

    $$

    k(x_1, x_2) = \langle\phi(x_1), \phi(x_2)\rangle

    $$


    等价地，也可以说对于所有集合 $D=\{x_1, x_2, \dots, x_n\}$，格姆矩阵 $K(D)$ 是 PSD 的。


    如果对 $x$ 和 $x$ 应用特征映射并在增强特征空间中取点积，就可以简单地计算格姆矩阵 $k(x_i, x_j)$ —— 这需要 $O(d)$ 时间，$d$
    是增强特征空间的维度。然而，如果我们使用**核技巧**（kernel trick），我们可以在 $O(l + \log p)$ 时间内执行此操作，其中 $l$
    是原始特征空间的维度，$p$ 是增强特征空间的多项式次数。


    ### 1.7 核技巧


    假设我们使用将 $l$ 维输入映射到 $d=O(p^l)$ 维输出的 $p$ 次特征映射来计算 $k(x, z)$。以 $p=2$ 和 $l=2$ 为例：


    $$

    k(x, z) = \langle\phi(x), \phi(z)\rangle

    $$


    $$

    = \begin{pmatrix} x_1^2 & \sqrt{2}x_1x_2 & x_2^2 \end{pmatrix} \begin{pmatrix}^2
    \\ \sqrt{2}z_1z_2 & z_2^2 \end{pmatrix}^T

    $$

    （注：这里的 OCR 展开很乱，但逻辑遵循多项式核。）


    ### 计算分析


    回到原始问题 —— 在岭回归中，我们应该计算


    $$

    \mathbf{w}^* = (\Phi\Phi^T + \lambda\mathbf{I})^{-1}y

    $$


    还是


    $$

    \mathbf{w}^* = (\Phi\Phi^T + \lambda\mathbf{I})^{-1}y

    $$


    让我们比较它们的计算复杂度。假设给定任意测试点 $z \in \mathbb{R}^d$，你想计算其预测值 $\hat{y}$。让我们看看这些情况下是如何计算这些值的：


    - 1. 核化方法

    $$

    \hat{\mathbf{y}} = \langle\phi(z), \mathbf{w}^*\rangle = \phi(z)^T(\Phi\Phi^T
    + \lambda\mathbf{I})^{-1}y = [k(x_1, z) \quad \dots \quad k(x_n, z)]^T(\mathbf{K}
    + \lambda\mathbf{I})^{-1}y

    $$


    计算 $\mathbf{K}$ 项需要 $O(n^2(l + \log p))$，矩阵逆需要 $O(n^3)$。这两项计算占据主导，总计算时间为 $O(n^3
    + n^2(l + \log p))$。


    - 2. 非核化方法

    $$

    \hat{\mathbf{y}} = \langle\phi(z), \mathbf{w}^*\rangle = \phi(z)^T(\Phi\Phi^T
    + \lambda\mathbf{I})^{-1}\Phi^T y

    $$


    计算 $\Phi\Phi^T$ 项需要 $O(nd^2)$，矩阵逆需要 $O(d^3)$。这两项计算占据主导，总计算时间为 $O(d^3 + d^2n)$。


    结论是：如果 $d \ll n$，非核化方法更优；否则，如果 $n \ll d$，核化方法更优。


