    # 6.5 LDA vs. QDA: Differences and Decision Boundaries


    Up to this point, we have used the term quadratic in QDA and linear in LDA. These
    terms signify the shape of the decision boundary in x-space. Given any two classes,
    the decision boundary represents the points in x-space where the two classes are
    equally likely.


    Let''s study binary (2-class) examples for simplicity. Assume that the two classes
    in question class A and class B. An arbitrary point x can be classified according
    to three cases:


    ```

    $k^* = \begin{cases} A & P(class=A(x)) > P(class=B(x)) \ B & P(class=A(x)) < P(class=B(x))
    \ \text{Either A or B} & P(class=A(x)) = P(class=B(x)) \end{cases}$

    ```


    The decision boundary is the set of all points in x-space that are classified
    according to the third case. Let''s look at the form of the decision boundary
    according to the different scenarios under LDA and LDA.


    # Identical Gaussian Distributions


    The simplest case is when the two classes are equally likely in prior, and their
    conditional probability distributions are isotropic with identical covariances.
    Isotropic Gaussian distributions have covariances of the form $\Sigma = \sigma^2I$,
    which means that their isocontours are circles. In this case, $f_A(.)$ and $f_B(.)$
    have identical covariances of the form $\Sigma_A = \Sigma_B = \sigma^2I$.


    ![](img/99defe26aebed215976e83d281581f33_86_0.png)


    Figure 6.1: Contour plot of two isotropic, identically distributed Gaussians in
    $\mathbb{R}^2$. The circles are the level sets of the Gaussians.


    Geometrically, we can see that the task of classifying a 2-D point into one of
    the two classes amounts to figuring out which of the classes it''s closer to.
    Using our notation of $Q_k(\mathbf{x})$ from before, this can be expressed mathematically
    as:


    ```

    $Q_A(\mathbf{x}) = Q_B(\mathbf{x})$

    ```'
