    # Logistic Loss: Maximum Likelihood Approach


    Logistic regression can be derived from a maximum likelihood model. Suppose we
    $\mathcal{D} = \{x_i, y_i\}_{i=1}^n$, and each observation is sampled from a distribution
    $Y_i \sim \text{Bernoulli}(p_i)$, where $p_i$ is a function of $x_i$. We can view
    $P(Y_i=1) = P(Y=1|x_i)$ as the posterior probability that $x_i$ is classified
    as 1, and $P(Y_i=0)$ as the posterior probability that $x_i$ is classified as
    0. The observation $y_i$ is simply sampled from this posterior probability distribution
    $Y_i$. Thus our observation $y_i$, which we can view as a "sample," has probability:


    ```

    $P(Y_i = y_i) = \begin{cases} p_i & \text{if } y_i=1 \ 1-p_i & \text{if } y_i=0
    \end{cases}$

    ```


    One way to write the likelihood of a sample if $p_i$ is


    ```

    $P(Y_i = y_i) = p_i^{y_i}(1-p_i)^{(1-y_i)}$

    ```


    which holds no matter what $y_i$ is.

    We need a model for the dependency of $p_i$ on $x_i$, which is a transformation
    of $x_i$, that results in a number from 0 to 1 (i.e., a valid probability). However
    hence $p_i$ cannot be, linear in $x_i$. One way to achieve the 0-1 normalization
    is by using the sigmoid function


    ```

    $p_i = \frac{1}{1+e^{-\mathbf{w}^T x_i}}$

    ```


    Now we estimate the weights $\mathbf{w}$ via maximum likelihood. We have the problem


    ```

    $$\mathcal{L}_{LR} = \arg max_{\mathbf{w}} \prod_{i=1}^n P(Y_i = y_i)$$

    $$= \arg max_{\mathbf{w}} \prod_{i=1}^n p_i^{y_i}(1-p_i)^{(1-y_i)}$$

    $$= \arg max \ln \prod_{i=1}^n p_i^{y_i}(1-p_i)^{(1-y_i)}$$

    $$$$= \arg min_{\mathbf{w}} \sum_{i=1}^n y_i \ln p_i + (1-y_i) \ln(1-p_i)$

    ```


    # Logistic Loss: Information-Theoretic Perspective


    The logistic regression loss function can also be justified from an information-theoretic
    perspective. To motivate this approach, we introduce Kullback-Leibler ($KL$ divergence)
    (also *relative entropy*), which measures the amount that one distribution diverges
    from another. Given any two discrete random variables $P$ and $Q$, the $KL$ divergence
    from $Q$ to $P$ is defined to be


    ```

    $D_{KL}(P||Q) = \sum_x P(x) \ln \frac{P(x)}{Q(x)}$

    ```


    Note that $D_{KL}$ is not a true distance metric, because it is not symmetric,
    i.e. $D_{KL}(P||Q) \neq$ in general.'
