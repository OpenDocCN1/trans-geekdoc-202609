    $\max_{\lambda} \mathcal{L}(x, \lambda, \nu) = f_0(x)$

    ```


    在完整形式下，目标函数 $\mathcal{L}(x, \lambda, \nu)$ 被称为**拉格朗日**，它考虑了无约束的原始变量集合 $x \in \mathbb{R}^d$、约束变量集合以及对偶变量。注意由于
