    ## 6.4 LDA


    While QDA is a reasonable approach to classification, we might be interested in
    simplifying our model to reduce the number of parameters we have. One way to do
    this is using **Linear Discriminant Analysis (LDA)**. Just as in QDA, LDA assumes
