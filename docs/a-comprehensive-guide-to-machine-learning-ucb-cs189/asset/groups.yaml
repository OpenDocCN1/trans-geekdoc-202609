    84


    CHAPTER 6. CLASSIFICATION


    +   2. A conditional probability distribution for class k


    $f_k(x) = f(x|class\ k)$


    In total there are $K+1$ probability distributions: for the prior, and $K$ for
    all of the individual classes. Note that the prior probability distribution is
    a categorical distribution over the $K$ discrete classes, whereas each conditional
    probability distribution is a continuous distribution over $\mathbb{R}^d$ (often
    represented as a Gaussian). Using the prior and the conditional distributions
    in conjunction, we conclude (by Bayes'' rule) that we are effectively solving


    ```

    $k^* = \arg\max_k P(class=k|x) = \arg\max_k \frac{P(k)f_k(x)}{f(k)} = \arg\max_k
    P(k)f_k(x)$

    ```


    In the case of the digit classification, we are solving for


    ```

    $k^* = \arg\max_{k\in\{0,1,..9\}} P(digit=k)f(image|digit=k)$

    ```


    # 6.3 QDA Classification


    Quadratic Discriminant Analysis (QDA) is a specific generative method in which
    the class conditional probability distributions are independent Gaussians: $f_k(\cdot)\sim\mathcal{N}(\mu_k,
    \Sigma_k)$.


    Note: the term "discriminant" in QDA is misleading: remember that QDA is not a
    discriminative method, it is a generative method!


    # Estimating $f_k(\cdot)$


    For a particular class conditional probability distribution $f_k(\cdot)$, if we
    do not have the true means and covariances $\mu_k, \Sigma_k$, then our best is
    to estimate them empirically with the samples in our training data that are classified
    as class k:


    ```

    $\mu_k = \frac{1}{n_k}\sum_{t_i=k} x_i$

    ```


    ```

    $\Sigma_k = \frac{1}{n_k}\sum_{t_i=k} (x_i - \mu_k)(x_i - \mu_k)^T$

    ```


    Note that the formulas are not necessarily trivial and must be formally proven
    using MLE. Just to present let use these formulas for the case where we are dealing
    with 1-d data points. For notation purposes, assume that $\mathcal{D}_k=\{x_1,
    x_2,...,x_{n_k}\}$ is the set of all training data points that belong to class
    k. Note that the data points are i.i.d. Our goal is to solve the MLE problem:


    ```

    $\mu_k, \sigma_k^2 = \arg\max P(x_1, x_2,...,x_{n_k}|\mu_k, \sigma_k^2)$

    ```


    ```

    $= \arg\max_{\mu_k, \sigma_k^2}ln(P(x_1, x_2,...,x_{n_k}|\mu_k, \sigma_k^2))$

    ```


    ```

    $= \arg\max_{\mu_k, \sigma_k^2}\sum_{i=1}^{n_k}ln(P(x_i|\mu_k, \sigma_k^2))$

    ```'
