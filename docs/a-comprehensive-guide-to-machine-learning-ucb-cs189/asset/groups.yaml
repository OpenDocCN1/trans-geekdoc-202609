    ## 第一章：回归、验证


    ### 1.1 回归


    我们在机器学习中的目标是从数据中提取一种*关系*。在**回归**任务中，这种关系表现为函数 $y = f(\mathbf{x})$，其中 $y \in \mathbb{R}$
    是可以从输入 $\mathbf{x} \in \mathbb{R}^d$ 预测的某个量。真实的关系 $f$ 是未知的，我们的目标尽可能从数据中恢复它。我们的产物是一个函数
    $\hat{h}(\mathbf{x})$，称为**假设**，它应该近似 $f$。我们假设可以访问一个数据集 $\mathcal{D} = \{(\mathbf{x}_i,
    y_i)\}_{i=1}^n$；每一对 $(\mathbf{x}_i, y_i)$ 都是一个示例（可能带有噪声或其他情况）。由于学习任意函数是不可行的，我们将自己限制在某些**假设类**
    $\mathcal{H}$ 中，通常采用**参数化模型**，这意味着存在某个有限维向量 $\mathbf{w} \in \mathbb{R}^d$，其元素被称为**参数**或**权重**，它们控制函数的行为。即
    $h_{\mathbf{w}}(\mathbf{x}) = g(\mathbf{x})$。在指定了**代价函数** $L$ 后（它衡量假设的预测 $\hat{y}$
    与真实输出 $y$ 的匹配程度），我们可以继续通过最小化该函数来搜索最拟合数据的参数：


    $\mathbf{w}^* = \arg \min_{\mathbf{w}} L(\mathbf{w})$### 1.2 普通最小二乘法


    普通最小二乘法是最简单的回归问题之一，它是易理解且实用的。它是一个**线性回归**问题，意味着我们取 $h_{\mathbf{w}}(\mathbf{x})
    = \mathbf{x}^T \mathbf{w}$。这组方程可以写成矩阵形式：


    $\begin{bmatrix} y_1 \\ \vdots \\ y_n \end{bmatrix} \approx \begin{bmatrix} x_1
    \\ \vdots \\ x_n \end{bmatrix}$


    用文字来说，矩阵 $\mathbf{X} \in \mathbb{R}^{n \times d}$ 具有行 $\mathbf{x}_i$。这个矩阵有时被称为**设计矩阵**。通常
    $n \ge d$，意味着数据点多于变量。对于方程 $\mathbf{y} = \mathbf{X}\mathbf{w}$ 通常没有精确解，但我们可以通过最小化平方和来找到近似解（即使数据是完美的）：


    $L(\mathbf{w}) = \sum_{i=1}^n(\mathbf{x}_i^T\mathbf{w} - y_i)^2 = \|\mathbf{X}\mathbf{w}
    - \mathbf{y}\|_2^2$


    现在我们建立了一个优化问题，想要解决它。我们将看到 OLS 的特殊结构允许我们计算全局最优的解析表达式，我们记为 $\mathbf{w}_{OLS}$。


    #### 方法1：向量微积分


    微积分是研究函数优化的主要工具。回顾以下重要结论：如果 $L: \mathbb{R}^d \to \mathbb{R}$ 是连续可微的，那么局部最优值 $\mathbf{w}^*$
    满足 $\nabla(\mathbf{w}^*) = \mathbf{0}$。在 OLS 情况下，


    $\|\mathbf{X}\mathbf{w} - \mathbf{y}\|_2^2 = (\mathbf{X}\mathbf{w} - \mathbf{y})^T(\mathbf{X}\mathbf{w}
    - \mathbf{y}) = (\mathbf{X}\mathbf{w} - \mathbf{y})^T\mathbf{X}\mathbf{w} - \mathbf{y}^T\mathbf{X}\mathbf{w}
    + \mathbf{y}^T\mathbf{y} = \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{w}^T\mathbf{X}^T\mathbf{y}
    + \mathbf{y}^T\mathbf{y}$


    使用以下矩阵微积分结果：


    $\nabla(\mathbf{a}^T\mathbf{x}) = \mathbf{a}$

    $\nabla(\mathbf{Ax}^T\mathbf{x}) = (\mathbf{A} + \mathbf{A}^T)\mathbf{x}$


    很容易看出 $L$ 的梯度为：


    $\nabla_{\mathbf{w}}(L) = \nabla_{\mathbf{w}}(\mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{w}^T\mathbf{X}^T\mathbf{y} + \mathbf{y}^T\mathbf{y}) = 2\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{X}^T\mathbf{y}$


    在最后一行中，我们利用 $\mathbf{X}^T\mathbf{X}$ 的对称性简化了 $\mathbf{X}^T\mathbf{X} + (\mathbf{X}^T)^T
    = 2\mathbf{X}^T\mathbf{X}$。将梯度置为 $\mathbf{0}$，我们得出任何最优值 $\mathbf{w}_{OLS}^*$ 都满足：


    $\mathbf{X}^T\mathbf{w}_{OLS} = \mathbf{X}^T\mathbf{y}$


