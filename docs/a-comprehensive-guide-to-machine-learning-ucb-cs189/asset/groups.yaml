    最后，我们制定了硬间隔（hard-margin）SVM优化问题！使用符号 $w$ 和 $b$，硬间隔 SVM 的目标是：


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2_2$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 \quad \forall i\quad (6.5)$$

    ```


    ## 间隔 SVM (Soft-Margin SVMs)


    硬间隔 SVM 优化问题仅在数据线性可分时才有唯一解，否则无解。这是因为如果我们无法画出一个将 +1 和 -1 分隔开的超平面，约束条件是无法满足的。此外，硬间隔
    SVM 对离群点非常敏感——例如，如果我们的数据是类别分布的高斯分布且两个高斯分布相距远，如果我们观察到一个来自 +1 类并进入 -1 类典型区域的离群点，那么硬间隔
    SVM 将被迫为了适应这个点而牺牲掉更具泛化性的拟合。我们的目标是提出对离群点不敏感且即使在数据线性不可分的情况下也能工作的分类器。为此，我们将讨论软间隔
    SVM。


    软间隔 SVM 通过允许某些点违反间隔修改硬间隔 SVM 的约束。从形式上，它为每个训练点引入了松弛变量 $\xi_i$，约束条件为：


    ```math

    $y_i(w^T x_i - b) \geq 1 - \xi_i$

    $\xi_i \geq 0$

    ```


    这是硬间隔 SVM 约束的一个不那么严格、更软的版本，因为它意味着每个点 $x_i$ 只需要距离分类平面有 $1-\xi_i$ 的“距离”，而不是硬性的“距离”
    1。


    （根据希腊语，希腊字母 $\xi$ 拼写为 "xi"，读音为 "zai"。$\xi_i$ 的读音为 "zai-eye"）。如果不限制 $\xi_i$ 的值，这些约束将是徒劳，因为通过将它们设置为很大的值，我们本质上是在说任何点都可以以任意大的距离违反间隔……这使得我们对
    $w$ 的选择失去了意义。我们将目标函数修改为：


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    ```


    其中 $C$ 是通过交叉验证调优的超参数。软间隔 SVM 优化问题为：


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 \quad \forall i$$

    $$\xi_i \geq 0 \quad \forall i\quad (6.6)$$

    ```


    下表比较了大 $C$ 与小 $C$ 的效果。当 $C$ 趋于无穷大时，非零 $\xi_i$ 的惩罚趋于无穷大，从而迫使 $\xi_i$ 为零，这正是硬间隔
    SVM 的设置。


    | 小 C | 大 C |

    |---|---|---|

    | 期望 | 最大化间隔 | 保持 $\xi_i$ 较小或为零 |

    | 风险 | 欠拟合 | 过拟合 |

    | 离群点 | 较不敏感 | 更敏感 |


    ## SVM 与 Tikhonov正则化学习


    考虑以下正则化回归问题：


    ```math

    $$\min \frac{1}{n} \sum L(y_i, w^T x_i - b) + \lambda\|w\|^2$$

    ```


    在分类背景下，我们想要优化的函数是 0-1 阶损失（step loss）：


    ```math

    $L_{step}(y, w^T x - b) = \begin{cases} 1 & y(w^T x - b) < 0 \\ 0 & y(w^T x -
    b) \geq 0 \end{cases}$

    ```


    如果 $x$ 被正确分类，0-1 损失为 0，否则为 1。因此，最小化 $\frac{1}{n} \sum L(y_i, w^T x_i - b)$ 直接最小化了训练集上的分类误差。然而，0-1
    损失很难优化：它既不是凸的也不可微（见图 8.1）。


    ![](img/99defe26aebed215976e83d281581f33_107_0.png)


    图 6.12：阶梯（0-1）损失、铰损失（hinge loss）和平方损失。平方损失是凸的，而铰损失不是凸的，阶梯损失两者都不是。


    我们可以尝试修改 0-1 损失使其变为凸函数。$y(w^T x - b) \geq 0$ 的点应保持 0 损失，但我们可能对分类错误的点使用**铰损失（hinge
    loss）**，如图 8.1 所示。


    ```math

    $L_{hinge}(y, w^T x + b) = \max(1 - y(w^T x - b), 0)$

    ```


    因此，正则化回归问题变为：


    ```math

    $$\min_{w,b} \frac{1}{n} \sum \max(1 - y_i(w^T x_i - b), 0) + \lambda\|w\|^2$$

    ```


    回原始的软间隔 SVM 优化问题是：


    ```math

    $$\min_{w,b,\xi} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 - \xi_i \quad \forall$$

    $$\xi_i \geq 0 \quad \forall$$

    ```


    ## 6.11. 支持向量机 (SUPPORT VECTOR MACHINES)


    我们认为这两种公式实际上是等价的。通过变形第一个约束，我们得到：


    $$\xi_i \geq 1 - y_i(w^T x_i - b)$$


    结合约束 $\xi_i \geq 0$，我们得到：


    $$\xi_i \geq \max(1 - y_i(w^T x_i - b), 0)$$


    在优化问题的最优处，这些不等式必须取等。否则，我们可以降低每个 $\xi_i$ 直到等于 $\max(1-y_i(w^Tx_i - b),0)$ 并减小目标函数的值。因此，我们可以重写软间隔
    SVM 优化问题为：


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \max(1 - y_i(w^T x_i - b), 0)
    (6.8)$$

    ```


    ## 7. 对偶性 (Duality)


    ### 7.1. 优化问题的原始与对偶 (Primal and Dual of Optimization Problem)


    之前在对 SVM 的研究中，我们制定了原始问题。在此之前，我们首先需要理解该问题的对偶。为了做到这一点，让我们来看优化问题的对偶。

