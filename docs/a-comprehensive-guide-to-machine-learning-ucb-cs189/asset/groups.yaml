    62 CHAPTER 3. LOW-RANK APPROXIMATION


    ![](img/99defe26aebed215976e83d281581f33_61_0.png)


    Figure 3.2: The Swiss Roll dataset is a 2-dimensional manifold embedded in 3 dimensional
    space. We should be able to represent it with a 2-dimensional feature space.


    will typically cause some loss of information, but if the data really does live
    in a $d$-dimensional subspace, then we should be able to reconstruct $x$ via $VV^T
    x$ and obtain something that is close to the original $x$. PCA can be seen as
    finding a basis for a subspace that minimizes this reconstruction error (low-rank
    approximation property).


    Sometimes, it does not make sense to find orthogonal directions that capture the
    maximum variance, as PCA does. Independent Components Analysis seeks directions
    that are statistically independent, and is more suitable for some applications.


    ## Nonnegative Matrix Factorization


    NMF takes a non-negative matrix $X$, where each column is a data entry, and approximately
    factors it into $X = BH$, where $B$ is skinny, $H$ is fat, and both these matrices
    are non-negative. The $k$-th column of $H$ is the sum of the columns of $B$, weighted
    according to the entries in the $k$-th column of $H$. In this regard, each column
    of $B$ can be seen as a feature that contributes to the data in a meaningful way
    - the number of columns in $B$ is the number of features we are allowed to reconstruct
    the data. If each column of $X$ is a vectorized image, then each column of $B$
    will be a vectorized image. NMF learns a part-based representation of the data,
    since the reconstruction is a non-negative linear combination of features of the
    same dimension as the data. It turns out that NMF will tend to produce sparser
    features than PCA. NMF has applications in computer vision and recommender systems,
    over other fields.


    ## Multidimensional Scaling


    MDS seeks to learn a low-dimensional representation such that pairwise distances
    between are preserved in the latent representation. If $X_i \in \mathbb{R}^D$
    and $W_{ij} = \|X_i - X_j\|^2$, then MDS finds $Y_i$ such that $\|Y_i - Y_j\|^2
    \approx W_{ij}$. More generally, one can use any dissimilarity measure $d(X_i,
    X_j)$ in place of norm. If the dissimilarity measure is a metric, then MDS is
    equivalent to PCA. MDS is typically used to visualize high-dimensional data.


    Note that while MDS captures overall distances in its low-dimensional embedding,
    it is incapable of capturing local geometric structure - for example, in the Swiss
    roll dataset shown above, points in the red region are dissimilar from points
    in the blue region, but are relatively close to these points in distance, so MDS
    would provide a representation where red and blue points are not separated.


    ## 3.4. DIMENSIONALITY REDUCTION


    ## Nonlinear Methods


    Linear methods such as PCA are not well-suited to capture intrinsic geometric
    structure in data. There are several approaches to solving this problem:


    - Kernel methods: it is possible to derive a kernelized version of PCA, for example.

    - Manifold learning: an $n$-manifold$^5$ is a surface that locally resembles $n$-dimensional
    Euclidean space. For example, the Swiss roll is a 2-manifold embedded in 3-dimensional
    space. In manifold learning, we learn a mapping from data to a low-dimensional
    manifold - for example, a mapping from Swiss roll to 2-dimensional plane.


    ## Isometric Feature Mapping (IsoMap)


    IsoMap performs MDS on the geodesic distances between points, as follows:


    (1) Construct a local neighborhood graph by connecting each point with its $k$
    nearest neighbors.

    (2) Compute all-pairs shortest path distances (these are the geodesic distances).

    (3) Apply MDS on geodesic distances.


    If we apply IsoMap to the Swiss roll, we see that while the Euclidean distance
    between the red and blue regions is low, the geodesic distance is high - the geodesic
    distance between points represents how far we would have to go if we were walking
    on the Swiss roll manifold in 2 dimensions.


    IsoMap has been used effectively for dimensionality reduction in facial data.


    Next time: Laplacian Eigenmaps, t-SNE.


    > $5$For the mathematically inclined, a manifold is a second-countable Hausdorff
    topological space such that each point has a neighborhood homeomorphic to a neighborhood
    in Euclidean space. Most machine learning researchers do not care for these definitions
    and will call almost anything a manifold.


    ## Chapter 4


    ## Gradient Descent, Newton’s Method


    ### 4.1 Nonlinear Least Squares


    All models we''ve seen so far are **linear** in the parameters we''re trying to
    learn. That is, our prediction $\hat{y} = f(x; \theta)$ is some linear function
    of the parameters $\theta$. For example, in OLS, $\theta = w$ and the residuals
    $r_i$ are computed by $y_i - w^T x_i$, which is linear in the components of $w$.
    In the case of least-squares polynomial regression, the predicted value is not
    a linear function of the input $x$, but it is still a linear function of the parameters.


    However, we may have need for models which are nonlinear function of their parameters.
    We consider a motivating example first.


    ## Noisy Distance Readings


    Suppose we want to estimate the 2D position $\theta =(\theta_1, \theta_2)$ of
    some entity, for example a robot. The information we have with distance estimates
    $Y_i \in \mathbb{R}$ from sensors whose positions $X_i \in \mathbb{R}^2$ are fixed
    and known. If we assume i.i.d Gaussian noise as usual, our statistical model has
    the form


    $Y_i = \|X_i - \theta\| + N_i, \quad N_i \sim \mathcal{N}(0, \sigma^2), \quad
    i=1, \dots m$


    where


    $\|X_i - \theta\| = \sqrt{(X_{i1} - \theta_1)^2 + (X_{i2} - \theta_2)^2}$


    Here our prediction is


    $\hat{y} = f(x; \theta) = \|x - \theta\|$


    which is clearly not linear in $\theta$.


    ## Formulation from MLE


    More generally, let us assume a model similar to the above but where $f$ is arbitrary
    differentiable function and $\theta \in \mathbb{R}^d$:


    $Y_i = f(X_i; \theta) + N_i, \quad N_i \sim \mathcal{N}(0, \sigma^2), \quad i=1,
    \dots m$


    Note that this implies $Y_i | X_i \sim \mathcal{N}(f(X_i; \theta), \sigma^2)$.


    The maximum likelihood estimator is given by


    $\hat{\theta}_{MLE} = \arg\max_{\theta} \log P(y_1, \dots, y_m \mid x_1, \dots,
    x_m; \sigma)$

    $= \arg\max_{\theta} \log \prod_{i=1}^{m} P(y_i \mid x_i; \sigma)$

    $= \arg\max_{\theta} \sum_{i=1}^{m} \log P(y_i \mid x_i; \sigma)$

    $= \arg\max_{\theta} \sum_{i=1}^{m} \log \left( \frac{1}{\sqrt{2\pi\sigma^2}}
    \exp \left -\frac{(y_i - f(x_i; \theta))^2}{2\sigma^2} \right) \right)$

    $= \arg\min_{\theta} \sum_{i=1}^{m} \left[ -\frac{1}{2}\log(2\pi\sigma^2) - \frac{1}{2\sigma^2}(y_i
    - f(x_i; \theta))^2 \right]$


    Observe the objective function is a sum of squared residuals as we''ve seen before,
    though the function $f$ is nonlinear in general. For this reason the method is
    called **nonlinear least squares**.


    Unfortunately, there is no closed-form solution for $\hat{\theta}_{MLE}$ in general.
    Later we will see an iterative method for computing it.


    ## Solutions to Nonlinear Least Squares


    Motivated by the MLE formulation, we consider the following optimization problem:


    $\min_{\theta} \ell_S(\theta) = \min_{\theta} \sum_{i} (y_i - f(x_i; \theta))^2$


    One way to minimize a function is to use calculus. We know that the objective
    function at any minimum must be zero, if it isn''t, we can take a sufficiently
    small step in the direction of the negative gradient that the objective function''s
    value will be reduced.


    Thus, the **first-order optimality condition** needs to be satisfied:


    $\nabla_{\theta}\ell_{LS} = 2 \sum_{i} (y_i - f(x_i; \theta))\nabla_{\theta}f(x_i;
    \theta) = 0$


    In compact matrix notation:


    where


    $F(\theta) = \begin{bmatrix} f(x_1; \theta) \\ \vdots f(x_n; \theta) \end{bmatrix}$

    $J(\theta)^T(Y - F(\theta)) = 0$


    ## 4.1. NONLINEAR SQUARES


    $J(\theta) = \nabla_{\theta} F$, the Jacobian of $F$


    Observe that when $f$ is linear in $\theta$ ($f_i(\theta)=\theta^T x_i$), the
    gradient $\nabla_{\theta} f_{LS}$ will only have $\theta$ in place because the
    term $\nabla_{\theta} f(x_i; \theta)$ will only depend on $x_i$:


    $\nabla_{\theta} f_{LS} = 2\sum_i (y_i - \theta^T x_i)\nabla_{\theta}(\theta^T
    x_i) = 2\sum_i (y_i - \theta^T x_i)x_i$


    and it is easy to derive a closed-form solution for $\theta$ in terms of the $y_i$
    and $x_i$:


    $2X^T(Y-X\theta)=0$

    $2X^TY-2X^TX\theta=0$

    $X''Y=X''TX\theta$

    $\theta=(X''X)^{-1}X''Y$


    It''s just OLS!


    If, however, $f$ were not linear in $\theta$, the gradient $\nabla_{\theta} f(x_i;\theta)$
    would contain more $\theta$ terms (differentiation wouldn''t be enough to make
    them go), and it would not be possible to write out a closed-form solution for
    $\theta$.


    **Remark:** Without more assumptions on $f$, the NLS is not convex in general.
    This means that the first-order optimality condition is a *necessary* but *sufficient*
    condition for a local minimum. That is, it is possible that the derivative is
    zero for some value of $\theta$, but that value is not a local minimum. It could
    be a saddle point, or worse, a local maximum! Even if it is, it may not be the
    global minimum.


    ## The Gauss-Newton algorithm


    Since there is no closed-form solution to the nonlinear squares optimization problem,
    we resort to an iterative algorithm, the **Gauss-Newton algorithm**, to tackle
    it. At each iteration, the method linearly approximates $F$ about the current
    iterate and solves a least-squares problem involving the linearization in order
    to compute the next iterate.


    Let''s say we have a "guess" for $\theta$ at iteration $k$, we denote $\theta^{(k)}$.
    We can approximate $F(\theta)$ to first order using a Taylor expansion about $\theta^{(k)}$:


    $F(\theta^{(k)}+\Delta\theta)=F(\theta^{(k)})+\nabla_{\theta} F(\theta^{(k)})\Delta\theta$

    $F(\theta^{(k)})+J(\theta^{(k)})\Delta\theta$


    where $\Delta\theta:=\theta-\theta^{(k)}$.


    Since $F$ is linear in $\Delta\theta$ (the Jacobian and $F$ are constants: functions
    evaluated at $\theta^{(k)}$), we can use the closed-form solution for $\Delta\theta$
    from the optimality condition to *update* our current guess $\theta^{(k)}$. Applying
    the first-order optimality condition earlier yields the following equation:


    $0=J(\theta^{(k)})^T(Y-F(\theta^{(k)}))-J(\theta^{(k)})^TJ(\theta^{(k)})\Delta\theta$


    1 For some reason this algorithm was called gradient descent, but it is not really
    gradient descent. Like gradient descent, it is an iterative, first-order optimization
    algorithm. Another method for solving nonlinear least squares, the *Levenberg-Marquardt
    algorithm*, is a sort of interpolation between Gauss-Newton and gradient descent.

