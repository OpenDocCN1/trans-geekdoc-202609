    \ \\ln p_i) + (1-y_i)(\\ln(1-y_i) - \\ln(1-p_i))\\n= \\arg\\min_w \\sum_{i=1}^n\
    \ (-y_i \\ln p_i - (1-y_i) \\ln(1-p_i)) + (y_i \\ln y_i + (1-y_i) \\ln(1-y_i))\\\
