    (a) 1-NN on 3 classes  (b) 2-NN on 5 classes


    Figure 7.1: Voronoi diagram for k-NN. Points in a region shaded a certain color
    will be classified as that color. Test points in a region shaded with a combination
    of 2 colors have those colors as their 2 nearest neighbors.


