    ## 1.2 普通最小二乘法


    如果 $X$ 是满秩的，那么 $\mathbf{X}^T\mathbf{X}$ 是可逆的，我们可以求出唯一解：


    $$\mathbf{w}_{\text{OLS}}^*=(\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$$


    注意：虽然我们写成 $(\mathbf{X}^T\mathbf{X})^{-1}$，但在实践中我们不会实际上计算逆；求解上述线性方程组（例如使用高斯消法）在数值上是稳定的。


    在推导中，我们使用了条件 $\nabla L(\mathbf{w}^*)=0$，这是最优性的必要条件而非充分条件。我们找到了一个临界点，但通常情况下该点可能是局部最小值、局部极大值或鞍点。幸运的是，在这种情况下目标函数是凸的，这意味着任何临界点都是全局最小值。要证明
    $L$ 是凸的，只需计算 $L$ 的海森矩阵，在本例中它为：


    $$\nabla^2 L(\mathbf{w})=2\mathbf{X}^T\mathbf{X}$$


    并证明它是正半定的：


    $$\mathbf{v}^T(2\mathbf{X}^T\mathbf{X})\mathbf{v}=2\mathbf{X}^T\mathbf{X}\mathbf{v}=2\|\mathbf{X}\mathbf{v}\|_2^2
    \ge 0$$


    ## 方法 2：正交投影


    还有另一种线性方法可以得到相同的结果：正交投影。


    记住，如果 $V$ 是内积空间，$S$ 是 $V$ 的子空间，那么任何 $\mathbf{v} \in V$ 都可以以唯一形式分解为：


    $$\mathbf{v}=\mathbf{v}_S+\mathbf{v}_\perp$$


    其中 $\mathbf{v}_S \in S$ 且 $\mathbf{v}_\perp \in S^\perp$。S^\perp$ 是 $S$ 的正交补，即与
    $S$ 中每个向量都垂直的向量集合。


    到 $S$ 的正交投影记为 $P_S$，是将上述分解中的 $\mathbf{v}$ 映射到 $\mathbf{v}_S$ 的线性算子。正交投影的一个重要属性是：


    $$\|\mathbf{v}-P_S\mathbf{v}\| \le \|\mathbf{v}-\mathbf{s}\|$$


    对于所有 $\mathbf{s} \in S$，当且仅当 $\mathbf{s}=P_S\mathbf{s}$ 时等号成立。即：


    $$P_S\mathbf{v}=\arg \min_{\mathbf{s}\in S} \|\mathbf{v}-\mathbf{s}\|$$


    证明。根据勾股定理，


    $$\|\mathbf{v}-\mathbf{s}\|^2=\|\sum_{\mathbf{s}''\in S} (\mathbf{v}-P_S\mathbf{v})+P_S\mathbf{s}\|^2=\|\mathbf{v}-P_S\mathbf{v}\|^2+\|P_S\mathbf{s}\|^2
    \ge \|\mathbf{v}-P_S\mathbf{v}\|^2$$


    当且仅当 $\|P_S\mathbf{v}-\mathbf{s}\|^2=0$，即 $\mathbf{s}=P_S\mathbf{v}$ 时，等号成立。两边开平方得到
    $\|\mathbf{v}-\mathbf{s}\| \ge \|\mathbf{v}-P_S\mathbf{v}\|$，如 claim 所述（因为范数是非负的）。$\square$


    这是该论证的视觉化表示：


    ## 第1章：回归，验证


    ![](img/99defe26aebed215976e83d281581f33_7_0.png)


    在 OLS 情况下，


    $$\mathbf{w}^*_{OLS} = \arg \min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2$$


    但观察到对于某些 $\mathbf{w} \in \mathbb{R}^d$，写为 $\mathbf{X}\mathbf{w}$ 的向量集合正是 $\mathbf{X}$
    的范围，我们知道它是 $\mathbb{R}^n$ 的子空间，所以：


    $$\min_{\mathbf{z} \in \text{range}(\mathbf{X})} ||\mathbf{z} - \mathbf{y}||_2^2
    = \min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2$$


    通过与之前关于 $P_{\mathbf{X}}$ 的最优性陈述进行匹配，我们观察到 $P_{range(\mathbf{X})}(\mathbf{y}) =
    \mathbf{X}\mathbf{w}^*_{OLS}$，其中 $\mathbf{w}^*_{OLS}$ 是右侧的任意最优解。投影点 $\mathbf{X}\mathbf{w}^*_{OLS}$
    总是唯一的，但如果 $\mathbf{X}$ 是满秩的（假设 $n \geq d$），则最优解 $\mathbf{w}^*_{OLS}$ 也是唯一的（符合预期）。这是因为
    $\mathbf{X}$ 满秩意味着 $\mathbf{X}$ 的列是线性独立的，在这种情况下 $\mathbf{w}$ 和 $\mathbf{X}\mathbf{w}$
