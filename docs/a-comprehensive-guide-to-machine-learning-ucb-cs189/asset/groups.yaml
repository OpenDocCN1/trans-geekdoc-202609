    ## 多分类扩展


    我们也可以将此方法扩展到多个类别的情况。假设有 $K$ 个类，标签为 $1, 2, ..., K$。从二分类扩展该方法的一种可能方式是计算 $w_iw(x_i)$
    并将其舍入到 1 到 $K$ 之间的最接近数字。然而，这种方法给类别赋予了一个“顺序”，即使类别本身并没有天然的顺序关系。这显然是一个问题。例如，在水果分类中，假设用
    1 表示“桃子”，2 表示“香蕉”，3 表示“苹果”。在我们的数值表示中，看起来桃子少于香蕉，而香蕉又少于苹果。因此，如果我们有一张看起来像苹果和桃子之间某种东西的图像，我们可能会简单地将其分类为香蕉。


    解决这个问题的典型方法如下：如果第 $i$ 个观测值属于类 $k$，我们不再使用表示 $y_i = k$，而是使用表示 $y_i = e_k$，即第 $k$
    个标准基向量。现在类别的表示中没有相对顺序了。这种方法被称为**独热编码**。


    当我们有多个类别时，$y_i$ 是一个 $K$ 维独热向量，因此对于 LS-SVM，我们转而优化一个 $K \times (d+1)$ 的权重：


    ```

    $$\arg \min_{\mathbf{w}} \sum_{i=1}^n ||y_i - \mathbf{Wx}_i||^2 + \lambda|\mathbf{w}||^2$$

    ```


    对数据点进行分类，计算 $\mathbf{Wx}$ 并查看哪个分量 $j$ 最大——然后我们预测 $x_i$ 属于类 $j$。


    ## 6.8 逻辑回归


    **逻辑回归**是一种判别性分类技术，具有直接的概率解释。假设我们有一个二分类问题，类别由 0 和 1 表示。注意，逻辑回归中没有使用 $-1/+$ 标签（如
    LS-SVM 中那样），因为在逻辑回归中这样做更有意义，因为它直接输出概率，该概率的取值范围在 0 到 1 之间。


    在逻辑回归中，我们希望对数据点属于 1 的概率估计进行建模。我们可以从线性函数 $\mathbf{w}^T\mathbf{x}$ 开始，通过应用 sigmoid
    变换 $s(\mathbf{x}) = \frac{1}{1+e^{-\mathbf{x}^T\mathbf{x}}}$ 将其转换为 0 到 1 之间的数字。因此，在学习权重
    $\mathbf{w}$ 后，对 $\mathbf{x}_i$ 进行分类，我们将估计概率：


    ```

    $P(y_i=1|\mathbf{x}_i) = s(\mathbf{w}^T\mathbf{x}_i)$

    ```


    并将 $\mathbf{x}_i$ 分类为：


    - $\hat{y}_i = \begin{cases} 1 & \text{如果 } s(\mathbf{w}^T\mathbf{x}_i) \geq 0.5
    \\ 0 & \text{否则} \end{cases}$


    ![](img/99defe26aebed215976e83d281581f33_94_0.png)


    图 6.7：逻辑函数。对于我们的用途，横轴是线性函数 $\mathbf{w}^T\mathbf{x}_i$ 的输出，纵轴是逻辑函数的输出，可以解释为 0 到
    1 之间的概率。


    分类器等价地将 $\mathbf{x}_i$ 分类为：


    ```

    $\hat{y}_i = \begin{cases} 1 & \text{如果 } s(\mathbf{w}^T\mathbf{x}_i) \geq 0.5
    \\ 0 & \text{否则} \end{cases}$

    ```


    为了训练我们的模型，我们需要一个损失函数。一种可能性是最小二法：


    ```

    $\arg \min_{\mathbf{w}} \sum_{i=1}^n ||y_i - s(\mathbf{w}^T\mathbf{x}_i)||^2$

    ```


    然而，这在极大似然估计下并不是最佳选择。相反，逻辑回归中使用的损失函数被称为**交叉熵**（cross-entropy）：


    ```

    $L(w) = \sum_{i=1}^n [y_i \ln \frac{1}{s(\mathbf{w}^T\mathbf{x}_i)} + (1-y_i)
    \ln \frac{1}{1-s(\mathbf{w}^T\mathbf{x}_i)}]$

    ```


    如果我们定义 $p_i = s(\mathbf{w}^T\mathbf{x}_i)$，我们可以将其写为：


    ```

    $L(w) = \sum_{i=1}^n [-y_i \ln p_i - (1-y_i) \ln(1-p_i)]$

    ```


    对于每个 $x_i，$p_i$ 表示属于 $y_i$ 的概率。由于 $y_i \in \{0, 1\}$，损失函数为：


    ```

    $L(w) = \sum_{i=1}^n [-y_i \ln p_i - (1-y_i) \ln(1-p_i)]$

    ```


