    \ this optimization problem is NP-hard, so we still intend to find a computationally\
    \ feasible alternative method that can approximate the optimal solution. **Matching\
    \ pursuit** is a greedy algorithm that achieves this goal.\n\n# Matching Pursuit\
    \ Algorithm\n\nRecall that in ordinary least squares, we minimize the residual\
    \ error $\\|Xw - y\\|_2^2$ by projecting $y$ onto the subspace spanned by the\
    \ columns of $X$, obtaining a linear combination $w^*$ of the with columns. Matching\
    \ pursuit starts with a completely sparse solution ($w=0$) and iteratively “build\
    \ up” $w$ until the sparsity constraint $\\|w\\|_0 \\le k$ can no longer be met.\
    \ The algorithm is as follows:\n\n```\nAlgorithm 2: Matching Pursuit\ninitialize\
    \ $r = y$\ninitialize the weights $w = 0$\n**while** $\\|w\\| < k$\n  find the\
    \ index $i$ for which the residual is minimized: $i = \\arg \\max_j \\frac{\\\
    langle r, x_j \rangle}{\\|x_j\\|}$\n  update the $i$-th entry of the weight vector\
    \ to $w_i = \\langle r, x_j \rangle / \\|x_j\\|^2$\n  update the new residual\
    \ value: $r = y - Aw$\n  **end while**\n```\n\nAt each step of the algorithm,\
    \ we pick the coordinate $i$ such that $x_i$ (the $i$-th column of $X$ corresponding\
    \ to feature $i$, *not* datap $i$) minimizes the residual $r$. This equates to\
