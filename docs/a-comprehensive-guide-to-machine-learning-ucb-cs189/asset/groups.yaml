    选择 $k=1$ 时，我们获得最优的训练误差0，因为每个训练点都会被分类为自身，从而在自身上实现了 100% 的准确率。然而，$k=1$ 对训练数据存在过拟合，在偏差-方差权衡的背景下，这是一个非常糟糕的选择。增加
    $k$ 会导致训练误差增加，但会降低测试误差并获得更好的泛化能力。在某一个程度上，如果 $k$ 变得过大，算法将对训练数据产生欠拟合，并遭受巨大的偏差。通常情况下，为了选择
