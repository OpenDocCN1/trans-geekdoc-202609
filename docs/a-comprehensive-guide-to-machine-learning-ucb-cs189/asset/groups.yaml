    ## Chapter 1: Regression, Validation


    ### 1.1 Regression


    Our goal in machine learning is to extract a *relationship* from data. In **regression**
    tasks, the relationship takes the form of a function $y = f(\mathbf{x})$, where
    $y \in \mathbb{R}$ is some quantity that can be predicted from an input $\mathbf{x}
    \in \mathbb{R}^d$. The true relationship $f$ is unknown, and our aim is to recover
    it as well as we can from data. Our product is a function $\hat{h}(\mathbf{x})$,
    called the **hypothesis**, which should approximate $f$. We assume that we have
    access to a dataset $\mathcal{D} = \{(\mathbf{x}_i, y_i)\}_{i=1}^n$; each pair
    $(\mathbf{x}_i, y_i)$ is an example (possibly noisy or otherwise). Since learning
    arbitrary functions is intractable, we restrict ourselves to some **hypothesis
    class** $\mathcal{H}$, typically employ a **parametric model**, meaning that there
    is some finite-dimensional vector $\mathbf{w} \in \mathbb{R}^d$, the elements
    of which are known as **parameters** or **weights**, that controls the behavior
    of the function. That is $h_{\mathbf{w}}(\mathbf{x}) = g(\mathbf{x})$. After designating
    a **cost function** $L$, which measures how poorly the prediction $\hat{y}$ of
    the hypothesis match the true output $y$, we can proceed to search for the parameters
    that best fit the data by minimizing this function:


    $\mathbf{w}^* = \arg \min_{\mathbf{w}} L(\mathbf{w})$


    ### 1.2 Ordinary least squares


    Ordinary least squares is one of the simplest regression problems, but it is well-understood
    and practically useful. It is a **linear regression** problem, which means we
    take $h_{\mathbf{w}}(\mathbf{x}) = \mathbf{x}^T \mathbf{w}$. We want $y_i \approx
    \hat{y}_i = \mathbf{x}_i^T \mathbf{w}$ for each $i = 1, \dots, n$. This set of
    equations can be written in matrix form as


    $\begin{bmatrix} y_1 \\ \vdots \\ y_n \end{bmatrix} \approx \begin{bmatrix} \mathbf{x}_1
    \\ \vdots \\ \mathbf{x}_n \end{bmatrix} \begin{bmatrix} w_1 \\ \vdots \\ w_d \end{bmatrix}$


    In words, the matrix $\mathbf{X} \in \mathbb{R}^{n \times d}$ has the datapoint
    $\mathbf{x}_i$ as its $i$-th row. This matrix is sometimes called the **design
    matrix**. Usually $n \ge d$, meaning that there are more datapoints than measurements.
    There will be in general no exact solution to the equation $\mathbf{y} = \mathbf{X}\mathbf{w}$
    (even if the data were perfect, consider how many equations and variables there
    are), but we can find an approximate solution by minimizing the sum (or equivalently,
    the mean) of the squared errors:


    $L(\mathbf{w}) = \sum_{i=1}^n(\mathbf{x}_i^T\mathbf{w} - y_i)^2 = \|\mathbf{X}\mathbf{w}
    - \mathbf{y}\|_2^2$


    Now that we have formulated an optimization problem, we want to go about solving
    it. We will see that the particular structure of OLS allows us to compute a closed-form
    expression for a globally optimal solution, which we denote $\mathbf{w}_{OLS}$.


    #### Approach 1: Vector calculus


    Calculus is the primary mathematical workhorse for studying the optimization of
    differentiable functions. Recalling the following important result: if $L: \mathbb{R}^d
    \to \mathbb{R}$ is continuously differentiable, then any local optimum $\mathbf{w}^*$
    satisfies $\nabla(\mathbf{w}^*) = \mathbf{0}$. In the OLS case,


    $\||\mathbf{X}\mathbf{w} - \mathbf{y}\|_2^2 = (\mathbf{X}\mathbf{w} - \mathbf{y})^T(\mathbf{X}\mathbf{w}
    - \mathbf{y}) = (\mathbf{X}\mathbf{w} - \mathbf{y})^T\mathbf{X}\mathbf{w} - \mathbf{y}^T\mathbf{X}\mathbf{w}
    + \mathbf{y}^T\mathbf{y} = \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{w}^T\mathbf{X}^T\mathbf{y}
    + \mathbf{y}^T\mathbf{y}$


    Using the following results from matrix calculus


    $\nabla(\mathbf{a}^T\mathbf{x}) = \mathbf{a}$

    $\nabla(\mathbf{Ax}^T\mathbf{x}) = (\mathbf{A} + \mathbf{A}^T)\mathbf{x}$


    the gradient of $L$ is easily seen to be


    $\nabla_{\mathbf{w}}(L) = \nabla_{\mathbf{w}}(\mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{w}^T\mathbf{X}^T\mathbf{y} + \mathbf{y}^T\mathbf{y}) = 2\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{X}^T\mathbf{y}$


    in the last line we have used the symmetry of $\mathbf{X}^T\mathbf{X}$ to simplify
    $\mathbf{X}^T\mathbf{X} + (\mathbf{X}^T)^T = 2\mathbf{X}^T\mathbf{X}$. Setting
    the gradient to $\mathbf{0}$, we conclude that any optimum $\mathbf{w}_{OLS}^*$
    satisfies


    $\mathbf{X}^T\mathbf{w}_{OLS} = \mathbf{X}^T\mathbf{y}$

    '
