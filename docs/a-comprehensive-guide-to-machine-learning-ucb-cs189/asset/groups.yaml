    x_i$. Then as a special case we have


    ```

    $Var(X) = \text{Cov}(X, X) = E[(X - E[X])^2] \approx \frac{1}{n}\sum_{i=1}^{n}(x_i
    - \bar{x})^2$

    ```


    ```

    $Var(Y) = \text{Cov}(Y, Y) = E[(Y - E[Y])^2] \approx \frac{1}{n}\sum_{i=1}^{n}(y_i
    - \bar{y})^2$

    ```


    Plugging these estimates into the definition for correlation and canceling the
    factor of 1/n leads to the sample Correlation Coefficient $\hat{\rho}$:


    ```

    $$\hat{\rho}(x, y) = \frac{\sum_{i=1}^{n}(x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum_{i=1}^{n}(x_i
    - \bar{x})^2 \cdot \sum_{i=1}^{n}(y_i - \bar{y})^2}} \text{where } \hat{x} = x
    - \bar{x}, \hat{y} = y - \bar{y}$$

    ```


    Here are 2-scatter plots and their corresponding correlation coefficients: ![](img/9926aed15976e8d2815f33.png)


    You should notice that:


    - The magnitude of $\hat{\rho}$ increases as $X$ and $Y$ become more linearly
    correlated.

    - The sign of $\hat{\rho}$ tells whether $X$ and $Y$ have a positive or negative
    relationship.

    - The correlation coefficient is undefined if either $X$ or $Y$ has 0 variance
    (horizontal line).


    ## Correlation and Gaussian


    Here''s a neat fact: if $X$ and $Y$ are jointly Gaussian, then we can define a
    distribution on normalized $X$ and $Y$ and have their relationship entirely captured
    by $\rho(X, Y)$. First write


    ```

    $$\rho(X, Y) = \frac{\sigma_{xy}}{\sigma_x \sigma_y}$$

    ```


    Then


    ```

    $$\Sigma = \begin{bmatrix} \sigma_x^2 & \sigma_{xy} \\ \sigma_{xy} & \sigma_y^2
    \end{bmatrix}$$

    ```


    ## Canonical Correlation


    **Canonical Correlation Analysis (CCA)** is a method of modeling the relationship
    between two sets by maximizing the correlation coefficient. Formally, given zero-mean
    random vectors $X_{rv} \in \mathbb{R}^p$ and $Y_{rv} \in \mathbb{R}^q$, we want
    to find projections $u \in \mathbb{R}^p$ and $v \in \mathbb{R}^q$ that maximizes
    the correlation between $X_{rv}^T u$ and $Y_{rv}^T v$:


    ```

    $$\rho(X_{rv}^T u, Y_{rv}^T v) = \max_{u,v} \frac{Cov(X_{rv}^T u, Y_{rv}^T v)}{\sqrt{Var(X_{rv}^T
    u) Var(Y_{rv}^T v)}}$$

    ```


    Observe that


    ```

    $$\Cov(X_{rv}^T u, Y_{rv}^T v) = \mathbb{E}[(X_{rv}^T u - \mathbb{E}[X_{rv}^T
    u])(Y_{rv}^T v - \mathbb{E}[Y_{rv}^T v])]\n= u^T(X_{rv} - \mathbb{E}[X_{rv}])(Y_{rv}
    - \mathbb{E}[Y_{rv}])^T v\n= u^T Cov(X_{rv}, Y_{rv}) v$$

    ```


    which also implies ($Var(Z) = Cov(Z, Z)$ for any random variable $Z$) that


    ```

    $Var(X_{rv}^T u) = u^T Cov(X_{rv}, X_{rv}) u$

    $Var(Y_{rv}^T v) = v^T Cov(Y_{rv}, Y_{rv}) v$

    ```


    so the correlation writes


    ```

    $$\rho(X_{rv}^T u, Y_{rv}^T v) = \frac{u^T Cov(X_{rv}, Y_{rv}) v}{\sqrt{u^T Cov(X_{rv},
    X_{rv}) u \cdot v^T Cov(Y_{rv}, Y_{rv}) v}}$$

    ```


    Unfortunately, we do not have access to the true distributions of $X_{rv}$ and
    $Y_{rv}$, so we cannot compute these covariance matrices. We estimate them from
    data. Assume that we are given zero-mean data $X \in \mathbb{R}^{nx}$ and $Y \in
    \mathbb{R}^{nq}$, where the rows of the matrix $X$ are i.i.d. samples $x_i \in
    \mathbb{R}^p$ from the random variable $X_{rv}$, and correspondingly for $Y_{rv}$.


    ```

    $$\Cov(X_{rv}, Y_{rv}) = \mathbb{E}[(X_{rv} - \mathbb{E}[X_{rv}])(Y_{rv} - \mathbb{E}[Y_{rv}])^T]
    \approx \frac{1}{n} \sum_{i=1}^n x_i y_i^T = \frac{1}{n} X^T Y$$

    ```


    where again the sample-based approximation is justified by the law of large numbers.
    Similarly,


    ```

    $$\Cov(X_{rv}, X_{rv}) = \mathbb{E}[X_{rv}X_{rv}^T] \approx \frac{1}{n} \sum_{i=1}^n
    x_i x_i^T = \frac{1}{n} X^T X$$

    $$\Cov(Y_{rv}, Y_{rv}) = \mathbb{E}[Y_{rv}Y_{rv}^T] \approx \frac{1}{n} \sum_{i=1}^n
    y_i y_i^T = \frac{1}{n} Y^T Y$$

    ```

