    is simply the set of points that are equidistant from $\boldsymbol{\mu}_A$ and
    $\boldsymbol{\mu}_B$. This decision boundary is linear because the set of points
    that are equidistant from $\boldsymbol{\mu}_A$ and $\boldsymbol{\mu}_B$ are simply
    the perpendicular bisector of the segment connecting $\boldsymbol{\mu}_A$ and
    $\boldsymbol{\mu}_B$.


    # Identical Anisotropic Gaussian Distributions


    The next case is when the two classes are equally likely in prior, and their conditional
    probability distributions are anisotropic with identical covariances. Anisotropic
    Gaussian distributions are simply all Gaussian distributions that are not isotropic.


    In order to understand the difference, let''s take a closer look at the covariance
    matrix $\boldsymbol{\Sigma}$. Since $\boldsymbol{\Sigma}$ is a symmetric, positive
    semidefinite matrix, we can decompose it by the spectral theorem into $\boldsymbol{\Sigma}=V\Lambda
    V^T$, where the columns of $V$ form an orthonormal basis in $\mathbb{R}^d$, and
    $\boldsymbol{\Lambda}$ is a diagonal matrix with real, non-negative values. The
    entries of $\boldsymbol{\Lambda}$ dictate how elongated or shrunk the distribution
    is along each direction. To see why this is the case, let''s consider a zero-mean
    Gaussian distribution $\mathcal{N}(0, \boldsymbol{\Sigma})$. We define its level
    set $f(\mathbf{x})=k$, or simply the set of all points $\mathbf{x}$ such that
    the probability density $f(\mathbf{x})$ evaluates to a fixed constant $k$. This
    is equivalent to the level set $\ln(f(\mathbf{x}))=\ln(k)$, which reduces to $\mathbf{x}^T\boldsymbol{\Sigma}^{-1}\mathbf{x}=c$,
    for some constant $c$. Without loss of generality, we assume this constant is
    1. The level $\mathbf{x}^T\boldsymbol{\Sigma}^{-1}\mathbf{x}=1$ is an ellipsoid
    with axes $\mathbf{v}_1,v_2,...,v_d$, with lengths $\sqrt{\lambda_1},\sqrt{\lambda_2},...,\sqrt{\lambda_d}$,
    respectively. Each axis of the ellipsoid is the vector $\sqrt{\lambda_i}\mathbf{v}_i$,
    and we can verify that


    ```

    $(\sqrt{\lambda_i}\mathbf{v}_i)^T\boldsymbol{\Sigma}^{-1}(\sqrt{\lambda_i}\mathbf{v}_i)=\lambda_i\mathbf{v}_i^T\boldsymbol{\Sigma}^{-1}\mathbf{v}_i=\lambda_i\mathbf{v}_i^T(\\lambda_i^{-1}\mathbf{v}_i)=\lambda_i(\lambda_i^{-1})=1$

    ```


    In the case of isotropic distributions, the entries of $\boldsymbol{\Lambda}$
    are all identical, meaning the axes of the ellipsoid form a circle. In the case
    of anisotropic distributions, the entries of $\boldsymbol{\Lambda}$ are not necessarily
    identical, meaning that the resulting ellipsoid may be elongated/shrunk and rotated.'
