    ```

    $x^\top u = ||x|| ||u|| \cos \theta$

    ```


    where $\theta$ is the angle between the vectors. In this case, since $||u|| =
    1$, the expression simplifies to $x^\top u = ||x|| \cos \theta$. But since cosine
    gives the ratio of the adjacent side (the projection we want to find) to the hypotenuse
    ($||x||$), this is exactly what we want:

