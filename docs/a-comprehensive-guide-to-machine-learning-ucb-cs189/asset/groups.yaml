    CHAPTER 1. REGRESSION, VALIDATION


    ```

    $= \arg\min_{\mathbf{v} \in \mathbb{R}^*, \mathbf{r} \in \mathcal{N}(X)} ||\mathbf{X}(\mathbf{X}^T\mathbf{v}
    + \mathbf{r}) - y|_2^2 + \lambda|\mathbf{X}^T\mathbf{v} + \mathbf{r}||_2^2$$

    $$= \arg\min_{\mathbf{v} \in \mathbb{R}^*, \mathbf{r} \in \mathcal{N}(X)} ||\mathbf{XX}^T\mathbf{v}
    + \mathbf{X}\mathbf{r} - y|_2^2 + \lambda|\mathbf{X}^T\mathbf{v} + \mathbf{r}||_2^2$$

    $$= \arg\min_{\mathbf{v} \in \mathbb{R}^*, \mathbf{r} \in \mathcal{N}(X)} (\mathbf{v}^T\mathbf{XX}^T\mathbf{v}
    - 2\mathbf{v}^T\mathbf{XX}\mathbf{r} - 2y^T\mathbf{v} + ...) + \lambda (\mathbf{v}^T\mathbf{XX}^T\mathbf{v}
    + 2\mathbf{v}^T\mathbf{X}\mathbf{r} + ||\mathbf{r}||^2))

    $$= \arg\min_{\mathbf{v} \in \mathbb{R}^*, \mathbf{r} \in \mathcal{N}(X)} (\mathbf{v}^T\mathbf{XX}^T\mathbf{v}
    - 2\mathbf{v}^T\mathbf{X}\mathbf{r} + \lambda ||\mathbf{r}||^2)$

    ```


    We crossed out $2\mathbf{r}$ and $2\mathbf{X}^T\mathbf{r}$ because $\mathbf{r}
    \in \mathcal{N}(X)$ and therefore $Xr=0$. Now we are optimizing $L(v,r)$, which
    is **jointly convex** in $\mathbf{v}$ and $\mathbf{r}$, because its Hessian is
    PSD. Let''s show that this is the case:


    ```

    $$\nabla^2 L(\mathbf{v}, \mathbf{r}) = 2I \ge 0$$

    $$\$\nabla_{\mathbf{r}}\nabla_{\mathbf{v}}L(\mathbf{v}, \mathbf{r}) = \nabla_{\mathbf{v}}\nabla_{\mathbf{r}}L(\mathbf{v},
    \mathbf{r}) = 0$$

    $$\$\nabla^2_{\mathbf{v}}L(\mathbf{v}, \mathbf{r}) = 2\mathbf{XX}^T + \lambda\mathbf{XX}^T
    \ge 0$$

    ```


    Since the cross terms of the Hessian are **0**, it follows that $\nabla^2_{\mathbf{r}}L(\mathbf{v},
    \mathbf{r})$ and $\nabla^2_{\mathbf{v}}L(\mathbf{v}, \mathbf{r})$ are PSD to establish
    joint convexity. With joint convexity established we can get the gradient to $\mathbf{0}$
    w.r.t $\mathbf{r}$ and $\mathbf{v}$ and obtain the global minimum:


    ```

    $$\nabla_{\mathbf{r}}L(\mathbf{v}^*) = 2\mathbf{r}^* = 0 \implies r^* = 0$

    ```


    Note that $\mathbf{r}^* = 0$ just happens to be in $\mathcal{N}(X)$, so it is
    a feasible point.


    ```

    $$\nabla_{\mathbf{v}}L(\mathbf{v}^*, \mathbf{r}^*) = 2\mathbf{XX}^T\mathbf{v}^*
    - 2\mathbf{XX}^T\mathbf{r}^* + 2\lambda\mathbf{XX}^T\mathbf{v}^* = \mathbf{0}$$$

    $$\$\implies \mathbf{XX}^T\mathbf{v}^* + \lambda\mathbf{v}^* = \mathbf{0}$$$

    $$\$\implies \mathbf{v}^* = (\mathbf{XX}^T + \lambda\mathbf{I})^{-1}\mathbf{y}$$

    ```


    Note that $\mathbf{XX}^T + \lambda\mathbf{I}$ is positive definite and therefore
    invertible, so we can compute $(\mathbf{XX}^T + \lambda\mathbf{I})^{-1}\mathbf{y}$.
    Even though $(\mathbf{XX}^T + \lambda\mathbf{I})^{-1}\mathbf{y}$ is a critical
    point for which the gradient is $\mathbf{0}$, it must achieve the global minimum
    because the objective is jointly convex. We conclude that


    ```

    $$\mathbf{w}^* = (\mathbf{XX}^T + \lambda\mathbf{I})^{-1}\mathbf{y}$$

    ```


    and arrive at the same solution as in the previous deviation.


    # Kernels


    Having derived the kernel regression formulation for the raw data matrix $\mathbf{X}$,
    we can apply the exact same logic to the augmented matrix $\mathbf{\Phi}$ and
    replace the optimal expression with


    ```

    $$\mathbf{w}^* = (\mathbf{\Phi}\mathbf{\Phi}^T + \lambda\mathbf{I})^{-1}\mathbf{y}$$

    ```


    Let''s explore the $\mathbf{\Phi}\mathbf{\Phi}^T$ term in kernel regression in
    more detail:


    ![](img/99defe26aebed215976e83d281581f33_17_0.png)'
