    \overset{i.i.d}{\}\mathcal{N}(0,1)$。$\mathbf{Z}$ 是联合高斯随机向量。我们现在的目标是推导出其概率密度公式。


    联合高斯（JG）随机向量有三个等价定义：


    - 1. 随机向量 $\mathbf{Z} = (Z_1, Z_2, \dots, Z_k)^T$ 是联合高斯的，如果存在一个基础随机向量 $\mathbf{U}
    = (U_1, U_2, \dots, U_l)$（分量为独立标准正态随机变量）、转移矩阵 $\mathbf{R} \in \mathbb{R}^{k \times
