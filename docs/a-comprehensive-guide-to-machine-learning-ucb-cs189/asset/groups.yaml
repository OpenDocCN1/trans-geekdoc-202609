    之前我们可以缩放数据将问题转换为 MLE 问题，与独立噪声问题非常相似，依赖噪声问题的 MLE 为 $w^* = (X^T\Sigma_Z^{-1}X)^{-1}X^T\Sigma_Z^{-1}y$。


    在最小二乘（OLS）统计模型中，我们假设输出是输入的线性函数加上噪声：


    $\mathbf{Y} = \mathbf{XW} + \mathbf{Z}$


