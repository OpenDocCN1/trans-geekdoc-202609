    ## 7.3. 最近邻分类


    ![](img/99defe26aebed215976e83d281581f33_120_0.png)


    图 7.2：$k=1$ 与 $k=15$ 的沃洛纽图（Voronoi diagram）。图自《统计学习导论》（Introduction to Statistical
