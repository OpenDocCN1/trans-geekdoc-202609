    \ risk, i.e.\n\n```\n$h^* = \\arg\\min_{h\\in\\mathcal{H}} R(h)$\n```\n\nHowever,\
    \ computing this expectation is impossible because we do not have access to the\
    \ true distribution. Rather, we have access to samples $(x_i, y_i)\\\\sim\\mathcal{D}$.\
    \ These enable us to approximate the real problem we care about by minimizing\
    \ the **empirical risk** (**training error**)\n\n```\n$R_{TRAIN}(h) = \\sum_{i=1}^{n}\
    \ \\ell(h(x_i), y_i)$\n```\n\nSince we have a finite number of samples, the hypothesis\
    \ that performs best on the training is not necessarily the best on the whole\
    \ data distribution. In particular, if we train and evaluate the hypothesis using\
    \ the same data points, the training error will be a very biased estimate of the\
    \ true error, since the hypothesis has been chosen specifically to perform well\
    \ on those points.\n\nThe solution is to set aside portion (say 30%) of the data,\
