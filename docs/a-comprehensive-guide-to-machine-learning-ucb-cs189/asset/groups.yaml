    would supposedly pass the dot-products through some kind of nonlinearity as well).
    In a fully-connected neural net, we would have used 6 × 12 = 72 weights to accomplish
    this. However, in this convolutional layer, we used only 4 weights. This is because
    we made of weight sharing, as in:


    +   1. The weights $w, x, y, z$ were shared among all the pixels of the input


    +   2. The individual units of the output layer were all determined by the same
    weights $w, x, y, z$


    Compare this to the fully-connected architecture where each output unit, there
    is a separate weight to learn for each input unit. This kind of strategy decreases
    the complexity of our model (there are fewer weights), but it makes sense for
    image processing because there are lots of repeated'
