    62 第 3 章. 低秩近似


    ![](img/99defe26aebed215976e83d281581f33_61_0.png)


    图 3.2：瑞士卷轴（Swiss Roll）数据集是一个嵌入在三维空间中的二维流形。我们应该能够用一个二维特征空间来表示它。


    这通常会导致某些信息的丢失，但如果数据确实存在于 $d$ 维子空间中，那么我们应该通过 $VV^T x$ 重构 $x$，并获得接近原始 $x$ 的结果。PCA
    可以被视为寻找一个子空间的基，以最小化这种重建误差（低秩近似属性）。


    有时，像 PCA 那样寻找捕捉最大方差的正交方向并没有意义。独立分量分析（Independent Components Analysis）寻求的是统计学上独立的方向，它更适用于某些应用。


    ## 非负矩阵分解 (NMF)


    NMF 摄取一个非负矩阵 $X$（其中每一列是一个数据项），并将其近似分解为 $X = BH$，其中 $B$ 是瘦矩阵，$H$ 是宽矩阵，且这两个矩阵都是非负的。$H$
    的第 $k$ 列是 $B$ 的列之和，并根据 $H$ 第 $k$ 列的元素加加。在这方面，$B$ 的每一列都可以被看作是以有意义的方式贡献数据的特征——$B$
    的列数是我们允许用于重构数据的特征数量。如果 $X$ 的每一列都是一个向量化的图像，那么 $B$ 的每一列也将是一个向量化的图像。NMF 学习的是数据的基于部分的表示，因为重建是与数据相同维度特征的非负线性组合。事实证明，NMF
    倾向于比 PCA 产生更稀疏的特征。NMF 在计算机视觉和推荐系统等领域有广泛应用。


    ## 多维缩放 (MDS)


    MDS 寻求学习一个低维表示，使得点对之间的距离在潜在表示中保留。如果 $X_i \in \mathbb{R}^D$ 且 $W_{ij} = \|X_i -
    X_j\|^2$，则 MDS 寻找 $Y_i$ 使得 $\|Y_i - Y_j\|^2 \approx W_{ij}$。更一般地说，可以使用任何差异性度量
    $d(X_i, X_j)$ 代替范数。如果差异性度量是一个度量，则 MDS 等价于 PCA。MDS 通常用于高维数据的可视化。


    注意，虽然 MDS 在低维嵌入中捕捉了整体距离，但它无法捕捉局部几何结构——例如，在上述的瑞士卷数据集中，红色区域的点与蓝色区域的点不同，但在距离上与这些点相对接近，因此
    MDS 提供的表示将使得红色和蓝色点不会被隔离开。


    ## 3.4. 降维


    ## 非线性方法


    像 PCA 这样的线性方法并不适用于捕捉数据中的内在几何结构。解决这个问题有以下几种方法：


    - 核方法：例如，可以推导出核化版本的 PCA。

    - 流形学习：$n$ 流形$^5$ 是一个局部类似于 $n$ 维欧几里得空间的表面。例如，瑞士卷是一个嵌入在三维空间中的 2 流形。在流形学习中，我们学习从数据到低维流形的映射——例如从瑞士卷到二维平面的映射。


    ## 等距特征映射 (IsoMap)


    IsoMap 对点之间的地测距离执行 MDS，如下：


    (1) 通过将每个点与其 $k$ 个最近邻点连接来构建局部邻域图。

    (2) 计算所有对最短路径距离（这些就是地测距离）。

    (3) 在地测距离上应用 MDS。


    如果我们对瑞士卷应用 IsoMap，会发现虽然红色和蓝色区域之间的欧几里得距离很小，但地测距离很大——测距离代表了我们在 2 维瑞士卷流形上需要走多远。IsoMap
    已有效用于人脸数据的降维。


    下次时间：拉普拉斯特征（Laplacian Eigenmaps）、t-SNE。


    > $5$ 对于数学倾向者，流形是一个二可 Hausdorff 空间，其中每个点都有一个同胚于欧几里得空间的邻域。大多数机器学习人员并不关心这些定义，并把任何东西称为流形。


    ## 梯度下降、牛顿法


    ### 4.1 非线性二乘


    到目前为止看到的所有模型在参数上都是**线性**的。也就是说，我们的预测 $\hat{y} = f(x; \theta)$ 是参数 $\theta$ 的某个线性函数。例如，在最小二乘（OLS）中，$\theta
    = w$，残差 $r_i$ 由 $y_i - w^T x$ 计算，它是 $w$ 的线性函数。在多项式回归的情况下，预测值不是输入 $x$ 的函数，但仍然是参数的线性函数。


    然而，我们可能需要参数是非线性函数的模型。我们先考虑一个例子。


    ## 有噪声读数


    假设我们要估计某个实体（例如机器人）的 2D 位置 $\theta =(\theta_1, \theta_2)$。我们从传感器获得的距离估计 $Y_i \in
    \mathbb{R}$，其位置 $X_i \in \mathbb{R}^2$ 是固定的且知的。如果像常一样假设假设同分布（i.i.d）高斯噪声，我们的统计模型形式如下：


    $Y_i = \|X_i - \theta\| + N_i, \quad N_i \sim \mathcal{N}(0, \sigma^2), \quad
    i=1 \dots m$


    其中


    $\|X_i - \theta\| = \sqrt{(X_{i1} - \theta_1)^2 + (X_{i2} - \theta_2)^2}$


    这里的预测是


    $\hat{y} = f(x; \theta) = \|x - \theta\|$


    对于 $\theta$ 显然不是线性的。


    ## MLE 公式


    更一般地说，让我们假设一个类似于上面的模型，但 $f$ 是任意可微函数且 $\theta \in \mathbb{R}^d$：


    $Y_i = f(X_i; \theta) + N_i, \quad N_i \sim \mathcal{N}(0, \sigma^2), \quad i=1
    \dots m$


    注意这意味着 $Y_i | X_i \sim \mathcal{N}(f(X_i; \theta), \sigma^2)$。最大似然估计量给出：


    $\hat{\theta}_{MLE} = \arg\max_{\theta} \log P(y_1, \dots, y_m \mid x_1, \dots,
    x_m; \sigma)$

    $= \arg\max_{\theta} \log \prod_{i=1}^{m} P(y_i \mid x_i; \sigma)$

    $= \arg\max_{\theta} \sum_{i=1}^{m} \log P(y_i \mid x_i; \sigma)$

    $= \arg\max_{\theta} \sum_{i=1}^{m} \log \left( \frac{1}{\sqrt{2\pi\sigma^2}}
    \exp \left -\frac{(y_i - f(x_i; \theta))^2}{2\sigma^2} \right) \right)$

    $= \arg\min_{\theta} \sum_{i=1}^{m} \left[ -\frac{1}{2}\log(2\pi\sigma^2) - \frac{1}{2\sigma^2}(y_i
    - f(x_i; \theta))^2 \right]$


    正如之前看到的，目标函数是残差平方和，尽管函数 $f$ 通常是非线性的由于由于原因，该方法被称为**非线性二乘**。


    遗憾的是，通常 $\hat{\theta}_{MLE}$ 没有解析解。稍我们将看到一种计算它的迭代方法。


    ## 非线性二乘的解


    受 MLE 公式的启发，我们考虑以下优化问题：


    $\min_{\theta} \ell_S(\theta) = \min_{\theta} \sum_{i} (y_i - f(x_i; \theta))^2$


    最小化函数的一种方法是使用微积分。我们知道在任何最小值处目标函数必须为零，如果不是，我们可以在负梯度方向上取足够的一步，使得目标函数的值降低。


    因此，需要满足**一阶最优性条件**：


    $\nabla_{\theta}\ell_{LS} = 2 \sum_{i} (y_i - f(x_i; \theta))\nabla_{\theta}f(x_i;
    \theta) = 0$


    在紧凑的矩阵表示中：


    其中


    $F(\theta) = \begin{bmatrix} f(x_1; \theta) \\ \vdots f(x_n; \theta) \end{bmatrix}$

    $J(\theta)^T(Y - F(\theta)) = 0$


    ## 4.1. 非线性二乘


    $J(\theta) = \nabla_{\theta} F，$F$ 的雅可比矩阵


    注意，当 $f$ 关于 $\theta$ 是线性的时（$f(\theta)=\theta^T x$），梯度 $\nabla_{\theta} f_{LS}$
    只取决于 $x_i$，我们很容易推导出关于 $\theta$ 的解析解：


    $2X^T(Y-X\theta)=0$

    $2X^TY-2X^TX\theta=0$

    $X^TX\theta=X^TY$

    $\theta=(X^TX)^{-1}X^TY$


    这正是最小二乘法！


    然而，如果 $f$ 关于 $\theta$ 不是线性的 $\nabla_{\theta} f(x_i)$ 将包含更多的 $\theta$ 项，并且无法写出关于
    $\theta$ 的解析解。


    备注：：在没有对 $f$ 有更多假设的情况下，NLS 不是凸的。这意味着一阶最优条件是局部最小值的必要但不充分的条件。也就是说，对于某个 $\theta$，导数可能为零，但该值并不是局部最小值。它可能是鞍点，更糟糕的是是局部极大值！即使是局部最小值，它可能不是全局最小值。


    ## 第 4 章


    由于线性优化问题没有解析解，我们求助于一种迭代算法——**高斯-牛顿法**来解决它。在每次迭代中，该方法对当前迭代对 $F$ 进行线性近似，并求解一个涉及线性化的二乘问题以计算下一次迭代。


    '
