    # Takeaways


    Let us consider by stating some implications of the Bias-Variance Decomposition:


    +   1. Underfitting is equivalent to high bias; most overfitting correlates to
    high variance.


    +   2. Training error reflects bias but not variance. Test error reflects both.
    In practice, the training error is much smaller than the test error, then there
    is overfitting.


    +   3. Variance $\rightarrow0$ as $n\rightarrow\infty$.


    +   4. If $f$ is in the set of hypothesis functions, bias will decrease with more
    data. If $f$ is not in the set of hypothesis functions, then there is an underfitting
    problem and more data won''t help.'
