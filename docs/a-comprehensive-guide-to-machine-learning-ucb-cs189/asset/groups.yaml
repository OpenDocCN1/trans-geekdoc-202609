    \ SVM problem:\n\n```\n$$\\min_{w} \\frac{1}{2}\\|w\\|^2 + C\\sum_{i=1}^n \\xi_i^2$$\n\
    ```\n\nNote that if a point $x$ has a nonzero slack $\\xi > 0$, by definition\
    \ it must lie outside the margin. Due to the heavy penalty factor $C$ for penalizing\
    \ the margin there are relatively few such points, and thus the slack $\\xi$ is\
    \ **sparse**—most of its entries are zero. We are interested in explaining why\
    \ this phenomenon occurs in this specific optimization problem, and identifying\
    \ the key properties that determine sparse solutions for arbitrary optimization\
    \ problems.\n\nTo reason about the SVM case, let's see how changing some arbitrary\
    \ slack variable $\\xi_i$ affects the loss. A decrease in $\\xi_i$ results in\
    \ a \"reward\" of $C_i$ and is captured by the partial derivative $\\frac{\\partial}{\\\
    partial\\xi_i}$. Note that no matter what the current value of $\\xi_i$ is, the\
    \ reward for decreasing $\\xi_i$ is constant. Of course, $\\xi_i$ may change the\
    \ boundary and the cost attributed to the size of the margin. The overall reward\
    \ for decreasing $\\xi_i$ is either to worth the effort (greater than cost incurred\
    \ from $w$) or not worth the effort (less than cost incurred from $w$). Intuitively,\
