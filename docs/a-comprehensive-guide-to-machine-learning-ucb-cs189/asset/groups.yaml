    54 CHAPTER 3. LOW-RANK APPROXIMATION


    ## Other derivations of PCA


    We have given the most common derivation of PCA above, but it turns out that there
    are other equivalent ways to arrive at the same formulation. These give us helpful
    additional perspectives on what PCA is doing.


    ## Gaussian assumption


    Let us assume that the data are generated by a multivariate Gaussian distribution:


    ```

    $x_i \overset{iid}{\sim} \mathcal{N}(\mu, \Sigma)$

    ```


    Then the maximum likelihood estimate of the covariance matrix $\Sigma$ is


    ```

    $\hat{\Sigma} = \frac{1}{n} \sum_{i=1}^n (x_i - \bar{x})(x_i - \bar{x})^T = \frac{1}{n}
    X^T X$

    ```


    where $\bar{x}$ is the sample average and the matrix $X$ is assumed to be zero-mean
    as before. The eigenvectors of $\hat{\Sigma}$ and $X^T X$ are the same since they
    are scalar multiples of each other. The contours of the Gaussian density form
    are ellipsoids (see Figure 1). The direction of largest variance (i.e. the first
    principal component) is the eigenvector corresponding to the smallest eigenvalue
    of $\Sigma^{-1}$, which is the largest eigenvalue of $\Sigma$. We do not know
    $\Sigma$ in general, so we use $\hat{\Sigma}$ in its place. Thus the principal
    component is an eigenvector corresponding to the largest eigenvalue of $\Sigma$.
    As mentioned earlier, this matrix has the same eigenvalues and eigenvectors as
    $X^T X$, so we arrive at the same solution.


    ## Minimizing reconstruction error


    Ordinary least squares minimizes the vertical distance between the fitted line
    and the data points:


    ```

    $||y - Xu||^2$

    ```


    We show that PCA can be interpreted as minimizing the perpendicular distance between
    the principal component subspace and the data points, in this sense it is doing
    the same thing as total least squares.


    The orthogonal projection of a vector $x$ onto the subspace spanned by a unit
    vector $u$ equals $u$ scaled by the scalar projection of $x$ onto $u$:


    ```

    $P_u x = (uu^T)x = (u^T x)u$

    ```


    Suppose we want to minimize the total reconstruction error:


    ```

    $\epsilon_{PCA\_Err}(u) = \sum_{i=1}^n ||x_i - P_u x_i||^2\n= \sum_{i=1}^n (||x_i||^2
    - ||P_u x_i||^2)\n= \sum_{i=1}^n ||x_i||^2 - \sum_{i=1}^n ||(x_i^T)u||^2 \quad
    (*)$

    ```


    ## 3.3. CANONICAL CORRELATION ANALYSIS


    ```

    $= \sum_{i=1}^{n} ||x_i||^2 - \sum_{i=1}^{n} (x_i^T u)^2 = \epsilon_{PCA,Var(u)}$

    ```


    where (*) holds by the Pythagorean theorem


    ```

    $||x - P_u x||^2 + ||P_u x||^2 = ||x||^2$

    ```


    since $x - P_u x \perp P_u x$. Then the first term $\sum_i ||x_i||$ is constant
    with respect to $u$, we have

    $\arg min_u \epsilon_{PCA,Var(u)} = \arg min \text{ constant} - \epsilon_{PCA,Var(u)}$


    Hence minimizing reconstruction error is equivalent to maximizing projected variance.


    ## 3.3 Canonical Correlation Analysis


    The Pearson Correlation $\rho(X,Y)$ is a way to measure how linearly related (in
    other words, how a linear model captures the relationship between random variables
    $X$ and $Y$.


    ```

    $$\rho(X,Y) = \frac{Cov(X,Y)}{\sqrt{Var(X)Var(Y)}}$$

    ```


    Here are some important facts about:


    - It is always commutative: $\rho(X,Y) = \rho(Y,X)$

    - It is always between -1 and 1: $-1 \leq \rho(X,Y) \leq 1$

    - It is completely invariant to affine transformations: for any $a,b,c,d \in \mathbb{R}$,

    $\rho(aX+b, cY+d) = \frac{Cov(aX+b, cY+d)}{\sqrt{Var(aX+b)Var(cY+d)}}$

    $= \frac{Cov(aX,cY)}{\sqrt{Var(aX)Var(cY)}}$

    $= \frac{a \cdot c \cdot Cov(X,Y)}{\sqrt{a^2 Var(X) \cdot c^2 Var(Y)}}$

    $= \frac{Cov(X,Y)}{\sqrt{Var(X)Var(Y)}}$

    $= \rho(X,Y)$


    The correlation is defined in terms of random variables rather than observed data.
    Assume that $\mathbf{x,y} \in \mathbb{R}^n$ are vectors containing $n$ independent
    observations of $X$ and $Y$. Recall the law of large numbers, which states that
