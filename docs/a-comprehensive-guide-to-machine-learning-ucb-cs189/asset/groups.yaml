    # 6.7 LEAST SQUARES SUPPORT VECTOR MACHINE


    where $k, w$ are estimated parameters. The decision boundary only requires $d+1$
    parameters, but we ended up $O(d^2)$ parameters because we needed to determine
    the class-conditional Gaussian generative models. LDA is an indirect approach
    to classification - it estimates parameters for $P(X|Y)$ and use Bayes'' rule
