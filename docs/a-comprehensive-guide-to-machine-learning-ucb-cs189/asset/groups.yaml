    # CHAPTER 5. NEURAL NETWORKS


    Since neural net outputs are not linear functions of their inputs, there is no
    closed-form solution for the minimum to any reasonable loss function defined on
    them. Thus, we resort to using gradient descent to train them. To run gradient
    descent, we must calculate the derivative of the loss function with respect to
    the parameters of the neural net. In the network depicted above, the parameters
    are $W=[w_1, w_2, w_3, a]$, and $V=[v_1, v_2]$. These are the values of the model
    which we are allowed to tweak. **Backpropagation** is an efficient manner of computing
    these gradients that exploits the nested structure of neural nets.


    # The Chain Rule


    This section is an aside to recall your knowledge about the chain rule in multivariable
    calculus. Let''s take a look at two slices of our neural net from above.


    ![](img/99defe26aebed215976e83d281581f33_77_0.png)


    If you want to compute the derivatives of upstream stuff with respect to the weights
    on these connections, you need only consider the input of a single connection
    at a time. That is to say:


    > $$\frac{\partial L}{\partial w_1} = upstream\terms \cdot \frac{\partial H_1}{\partial
    w_1}$$


    completely independent of $x_2$ and $x_3$.


    ![](img/99defe26aebed215976e83d281581f33_77_1.png)


    If you want to compute the derivatives of upstream stuff with respect to the weights
    *downstream of these connections,* you''ll need to sum over the contributions
    of the inputs to these connections.'
