    ## 6.11 支持机


    到目前为止，我们探索了**生成式模型**（LDA）、**判别式模型**（逻辑回归），在这两种方法中，我们都要求自己对某种概率分布进行建模。关于分类的一个观察是，到最后，如果我们只关心为每个数据点分配类别，我们真正需要知道的是找到一个“好的”决策边界，我们可以跳过对分布的思考。支持机（SVMs）以这种精神直接建模决策边界：


    - 给定：训练数据集 $D = \{(x_i, y_i)\}_{i=1}^n$，其中 $x_i \in \mathbb{R}^d$ 且 $y_i \in \{-1,
    1\}$

    - 目标：找到一个区分 $+1$ 和 $-1$ 的决策边界 $H$


    ## 支持机的动机


    为了引入支持机，我们首先需要理解感知机及其局限性。如果数据是线性可分的，感知机可以找到一个 $d$ 维的超平面来完美区分 $+1$ 和 $-1$。从数学上讲，支持机的目标是学习一个权重向量
    $w \in \mathbb{R}^d$ 和偏置 $b$，满足以下：


    $$\begin{cases} w^Tx_i - b \geq m & \text{if } y_i = 1 \\ w^Tx_i - b \leq -m &
    \text{if } y_i = -1 \end{cases}$$


    等价于 $y_i(w^Tx_i - b) \geq m$，其中得到的决策边界为 $w^Tx - b = 0$。如果数据不是线性可分的，感知机无法找到有效的泛化边界。支持机通过最大化间隔（margin）来解决感知机的泛化问题。


    ## 硬边界支持机


    硬边界支持机通过最大化**间隔**来解决泛化问题，该间隔正式定义为决策边界到任何训练点的距离。


    img/99defe26aed215976e83d281581f33102.


    直观地说，最大化间隔可以让我们对未知数据进行更好的泛化，因为具有最大间隔的边界尽可能远离训练数据。简单来说，硬边界支持机的目标是找到一个使间隔 $m$ 最大化的超平面。让我们来形式化这个优化问题：


    - 所有分类为 $+1$ 的点位于正侧。

    - 所有分类为 $-1$ 的点位于负侧。


    间隔 $m$ 定义为超平面到最近数据点的距离。对于超平面 $w^Tx - b = 0$，点 $x_i$ 到超平面的距离为 $\frac{w^Tx_i - b}{\|w\|}$。因此，我们想要极大：


    $$\max_{w, b} \frac{m}{\|w\|} \quad \text{subject to} \quad \begin{cases} w^Tx_i
    - b \geq m & \text{if } y_i = 1 \\ w^Tx_i - b \leq -m & \text{if } y_i = -1 \end{cases}$$


    为了简化，我们可以设置 $\|w\| = 1$ 并最大化 $m$，得到：


    $$\max_{w, b, m} m \quad \text{subject to} \quad \begin{cases} w^Tx_i - b \geq
    m & \text{if } y_i = 1 \\ w^Tx_i - b \leq -m & \text{if } y_i = -1 \end{cases}$$


    这等价于 $y_i(w^Tx_i - b) \geq m$。如果我们固定 $m=1$，就得到了标准的硬边界支持机公式：


    $$\min_{w, b} \frac{1}{2}\|w\|^2 \quad \text{subject to} \quad y_i(w^Tx_i - b)
    \geq 1$$

