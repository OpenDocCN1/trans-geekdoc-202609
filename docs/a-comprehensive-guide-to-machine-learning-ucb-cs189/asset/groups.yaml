    # MLE vs. MAP


    基于我们对普通最小二法回归和岭回归的分析，我们预期的 MAP 表现会比 MLE 更好。但情况总是如此吗？让我们回顾一下之前关于（斜率，截距）的示例。我们我们已经知道了真实的底层模型参数，并将把它们与
    MLE 和 MAP 选取的值进行比较。让我们从 MLE 开始：


    ![](img/99defe26aebed215976e83d281581f33_25_0.png)


    左侧的图显示了该问题的数据空间表示，右侧的图显示了模型空间表示。左图中的灰线和右图中的灰点是真实的底层模型。使用带有噪声的数据样本，MLE 预测出一个合理的假设模型（如左图中的绿线和右图中的绿点所示）。


    现在，让我们来看看 MAP 的假设模型。这里产生的一个问题是，先验分布的中心应该设在哪里以及它的方差应该是多少，取决于你对真实底层模型的认知。如果你有理由相信模型权重应该都很小，那么先验应该中心在零。让我们看看以零为中心的先验的
    MAP：


    ![](img/99defe26aebed215976e83d281581f33_25_1.png)


    ## 2.1. MLE 与 MAP


    为了参考，我们之前将 MLE 估计标记为绿点，将真实模型标记为灰点。从右图中可以看到，使用位于零的先验会导致我们的模型预测偏向原点，导致比 MLE 更不准确的模型。假设在这种情况下，有理由相信模型权重应该中心在
    0.5 到 1 的范围内。如下下面的第一组图，我们的预测会比 MLE 好。然而，如果我们认为模型权重应该中心在 -0.5 到 1 的范围内，我们的预测会比
    MLE 差。


    ![](img/99defe26aebed215976e83d281581f33_26_0.png)


    ![](img/99defe26aebed215976e83d281581f33_26_1.png)


    始终，为了在实践中比较我们的信念看看哪个先验最有效，我们应该进行交叉验证！


    ## 2.2 偏差-方差权衡


    回顾我们之前的讨论，对于固定输入 $x$，对应的测量值 $Y$ 是底层模型 $f(x)$ 的噪声测量：


    ```

    Y = f(x) + N

    ```


    其中 $N$ 是一个均值为随机变量，通常表示为高斯分布。我们在回归中的目标是尽可能地恢复底层模型 $f(\cdot)$。之前提到的 MLE 和 MAP 是通过概率目标来寻找
    $f(\cdot)$ 的合理近似的技术。在本节中，我们将形成一个可以精确衡量假设函数 $h$ 有效性的理论指标。请记住，这个指标在现实生活中是无法测量，但可以通过实验进行近似。


    在引入指标之前，让我们对数据和假设进行一些细微的讨论。正如之前对 MLE 和 MAP 的讨论所回顾的，在这里，数据集 $D$ 包含了 $n$ 个 $(x_i,
    y_i)$ 对。在这种情况下，我们将 $x_i$ 视为随机变量，$D$ 是一个随机变量，因为它包含了随机变量 $X_i$ 和 $Y_i$。（注意这些量都是随机变量。）我们的假设模型
    $h(x, D)$ 也是一个随机变量——它取决于任意输入 $x$ 以及随机的 $D$。由于 $D$ 是随机的，每次使用新数据集都会得到稍微不同的假设模型 $h(\cdot,
    D)$。


    ```

    D = {X_1, Y_1; X_2, Y_2; ...; X_n, Y_n}

    ```


    ### 指标


    我们的目标是对于固定值 $x$，评估假设能在多程度上封装对应 $x$ 的噪声观测。注意我们将 $x$ 标记为小写是因为我们将其视为固定常数，而将 $Y$ 和
    $D$ 标记为大写是因为我们将其视为随机变量。$Y$ 和 $D$ 与 $D$ 中的 $X_i$ 和 $Y_i$ 没有关系。在这种情况下，我们可以将 $D$
    视为训练数据，$(x, Y)$ 视为测试数据——点 $x$ 不一定在训练集 $D$ 中！在数学上，我们定义指标为假设与观测值 $Y = f(\mathbf{x})
    + N$ 之间的平方误差：


    ```

    ε(x; D) = E((h(x; D) - Y)^2)

    ```


    这里的期望是关于随机变量 $D$ 和 $Y$ 的期望：


    ```

    E_Y[(h(x; D) - Y)^2] = E_D[E_Y[(h(x; D) - Y)^2]]

    ```


    注意，误差相对于观测值 $Y$ 而不是真实的底层模型 $f(x)$，因为我们不知道真实模型，只能获得真实的噪声观测。


    ### 偏差-方差分解


    误差指标很难解释和处理，所以让我们尝试将其分解为更容易的部分。在开始之前，让我们找到 $Y$ 的期望和方差：


    ```

    E[Y] = E[f(\mathbf{x}) + N] = f(\mathbf{x}) + E[N] = f(\mathbf{x})

    Var(Y) = Var(f(x) + N) = Var(N)

    ```


    此外，对于一般的任何随机变量 $Z$，我们有：


    ```

    Var(Z) = E[(Z - E[Z])^2] = E[Z^2] - E[Z]^2

    ```


    让我们利用这些事实来分解误差：


    ```

    ε(x;h) = E[(h(x;D) - Y)^2] = E[(h(x;D) - E[h(x;D)] + E[h(x;D)] - Y)^2]

    = E[(h(x;D) - E[h(x;D)])^2] + E[(E[h(x;D)] - Y)^2] + 2E[(h(x;D) - E[h(x;D)]) \cdot
    (E[h(x;D)] - Y)]

    = E[(h(x;D) - E[h(x;D)])^2] + E[(E[h(x;D)] - Y)^2] + 0

    = Var(h(x;D)) + E[(E[h(x;D)] - Y)^2]

    ```


    回想起对于两个独立变量 $D$ 和 $Y，$g(D)$ 和 $g(Y)$ 是独立的。这隐含 $h(x;D)$ 和 $Y$ 是独立的，偏差-方差分解由三项组成：


    - **偏差（Bias）**：衡量假设的平均值在多大程度上接近真实值 $f(x)$。低偏差意味着模型能够准确地估计。

    - **方差（Variance）**：衡量当训练集 $D$ 变化时预测变化的程度。低方差意味着预测变化很小。

    - **不可约误差（Irreducible error）**：这是由于噪声观测产生的，我们无法控制或消除的误差。


    这种分解允许我们衡量误差中的偏差、方差和不可约误差。由于不可约误差是真实的，所以在我们在最小化误差时可以忽略它。


    # 实验


    让我们通过一个测量 0 阶、1 阶和 2 阶多项式回归偏差和方差的实验来验证这一分解背后的理论。在我们的实验中，我们反复对随机训练集拟合假设模型。然后，我们找到这些生成的假设模型的期望和方差。


    让我们先看 0 阶（常数）回归模型。我们反复对包含 10 个点的训练集拟合最优常数线。真实模型由灰色表示，假设由红色表示。注意，由于使用的训练集不同，每次的红线略有不同。


    '
