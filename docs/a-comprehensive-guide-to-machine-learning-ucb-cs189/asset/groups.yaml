    ## 7.1. 对偶性


    这种解决方案是需要代价的——为了消除等式约束，我们必须为每个不等式约束添加对偶变量。考虑到这一点，让我们尝试对不等式约束进行同样的操作。添加对偶变量 $\lambda_i$
    来表示每个不等式约束，我们现在有


    ```

    $\min_{x} \mathcal{L}(x, \lambda, \nu) = f_0(x) + \sum_{i=1}^{m} \lambda_i f_i(x)
    + \sum_{j=1}^{n} \nu_j h_j(x)$

    \text{s.t.} \quad \lambda_i \ge 0 \quad i=1, \dots, m \quad (7.4)$

    ```


    为了方便起见，可以将涉及 $\lambda$ 的约束放入优化变量中。


    ```

    $\max_{x} \mathcal{L}(x, \lambda, \nu) = f_0(x) + \sum_{i=1}^{m} \lambda_i f_i(x)
    + \sum_{j=1}^{n} \nu_j h_j(x)$

    ```


    该优化问题通常被称为**原始问题**（primal，不要与对偶变量混淆），它的最优值确实等于原始约束优化问题的最优值。


    ```

    $p^* = \max_{\lambda\ge0, \nu} \mathcal{L}(x, \lambda, \nu)$

    ```


    我们可以验证这确实如此：


    - 对于任何违反不等式约束的 $x$（意味着 $\exists i \in [1, m]$ 使得 $f_i(x) > 0$),关于 $\lambda$ 的内部极大化问题可以将
    $\lambda$ 选为 $\infty$，导致内部极大化发散于 $\infty$，因此被关于 $x$ 的外部最小化所忽略。

    - 对于任何违反等式约束的 $x$（意味着 $\exists j$ s.t. $h_j(x) \neq 0$），关于 $\nu$ 的内部极大化问题可以在 $h_j(x)
    > 0$（或 $h_j(x) < 0$）时将 $\nu$ 选为 $\infty$，导致内部极大化发散于 $\infty$，因此被关于 $x$ 的外部最小化所忽略。

    - 对于任何未违反任何等式约束的 $x$，在关于 $\nu$ 的内部极大化问题中，表达式 $\sum_{j=1}^{n} \nu_j h_j(x)$ 的最大值为
    0，因为 $\lambda_i$ 被限制为非负，且 $f_i(x)$ 是负的。因此，在最好的情况下，极大化问题设置 $\lambda_i f_i(x) =
    0$，且


    ```

    $\max_{\lambda} \mathcal{L}(x, \lambda, \nu) = f_0(x)$

    ```


    在完整形式下，目标函数 $\mathcal{L}(x, \lambda, \nu)$ 被称为**拉格朗日**（Lagrangian），它考虑了无约束的原始变量集合
    $x \in \mathbb{R}^d$、约束变量集合以及对偶变量。注意，由于 $\lambda_i$ 被限制为非负且 $f_i(x)$ 是负的，因此在最好的情况下，极大化问题设置
    $\lambda_i f_i(x) = 0$。


