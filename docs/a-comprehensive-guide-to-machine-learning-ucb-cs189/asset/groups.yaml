    \quad (2.2)$


    Note that $\Sigma_Z$ is symmetric, which means it has a good eigen structure,
    we can interpret it geometrically. $\Sigma_Z$ can be written as


    $\Sigma_Z = \mathbf{Q} \begin{pmatrix} \sigma_1^2 & 0 & \dots & 0 \\ 0 & \sigma_2^2
    & \dots & 0 \\ \vdots & \vdots & \ddots & \vdots \\ 0 & 0 & \dots & \sigma_n^2
    \end{pmatrix} \mathbf{Q}^T$


    where **Q** is orthonormal. This means a multivariate Gaussian can be thought
    of having its level sets by the ellipsoid axis given by **Q** and amount of stretch
    given by $\sigma$.


    Let


    $\mathbf{R}_Z = \sqrt{\Sigma_Z} = \mathbf{Q} \begin{pmatrix} \sigma_1 & 0 & \dots
    & 0 \\ 0 & \sigma_2 & \dots & 0 \\ \vdots & \vdots & \ddots & \vdots \\ 0 & 0
    & \dots & \sigma_n \end{pmatrix}$


    ## 2.6 MAP WITH COLORED NOISE


    As before, we can scale the data to morph the problem into an MLE problem, very
    similar to the independent noise problem, the MLE of the dependent noise problem
    is $\mathbf{w}^* = (\mathbf{X}^T\Sigma_Z^{-1}\mathbf{X})^{-1}\mathbf{X}^T\Sigma_Z^{-1}\mathbf{y}$.


    In the ordinary squares (OLS) statistical model, we assume that the output is
    a linear function of the input plus noise:


    $\mathbf{Y} = \mathbf{XW} + \mathbf{Z}$


    where $\mathbf{Y}$ and $\mathbf{Z}$ are $n$-dimensional random vectors, and $\mathbf{X}$
    is a $n \times d$ matrix.


    We have seen that ridge regression can be derived by assuming a prior on **W**
    in which $W_i$ are i.i.d Gaussian, $\mathbf{W} \sim \mathcal{N}(0, I)$. But more
    generally, we can allow **W** to be any multivariate Gaussian: $\mathbf{W} \sim
    \mathcal{N}(\mu_W, \Sigma_W)$.


    Recall that we can rewrite a multivariate Gaussian as an affine transformation
    of a standard Gaussian:


    $\mathbf{W} = \Sigma_W^{1/2}\mathbf{v} + \mu_W \quad \mathbf{v} \sim \mathcal{N}(0,
