    ## PCA 的其他推导


    我们在上面给出了 PCA 最常见的推导方法，但事实上有其他等价的方法可以得到相同的公式。这些方法为理解 PCA 的作用提供了有帮助的额外视角。


    ## 高斯假设


    假设数据是由多变量高斯分布生成的：


    ```

    $x_i \overset{iid}{\sim} \mathcal{N}(\mu, \Sigma)$

    ```


    那么协方差矩阵 $\Sigma$ 的极大似估计为：


    ```

    $\hat{\Sigma} = \frac{1}{n} \sum_{i=1}^n (x_i - \bar{x})(x_i - \bar{x})^T = \frac{1}{n}
    X^T X$

    ```


    其中 $\bar{x}$ 是样本平均值，矩阵 $X$ 假设如之前一样为零均。$\hat{\Sigma}$ 和 $X^T X$ 的特征向量是相同的，因为它们是彼此的标量倍数。高斯密度等高线形成椭圆（见图
    1）。方差最大的方向（即第一主成分）是对应于 $\Sigma^{-1}$ 最小特征值的特征向量，而这也是 $\Sigma$ 的最大特征值。我们通常不知道 $\Sigma$，因此我们用
    $\hat{\Sigma}$ 代替它。因此，主成分是对应于 $\Sigma$ 最大特征值的特征向量。如前所述，该矩阵与 $X^T X$ 有相同的特征值和特征向量，因此我们得到了相同的解。


    ## 最小化重构误差


    普通二二法最小化拟合线与数据点之间的垂直距离：


    ```

    $||y - Xu||^2$

    ```


    我们证明 PCA 可以解释为最小化主成分子空间与数据点之间的垂直距离，从这个意义上说，它的作用与最小二二法相同。向量 $x$ 在由单位向量 $u$ 跨越的空间上的正交投影等于
    $x$ 在 $u$ 上的标量投影的缩放：


    ```

    $P_u x = (uu^T)x = (u^T x)u$

    ```


    假设我们想要最小化总重构误差：


    ```

    $\epsilon_{PCA\_Err}(u) = \sum_{i=1}^n ||x_i - P_u x_i||^2\n= \sum_{i=1}^n (||x_i||^2
    - ||P_u x_i||^2)\n= \sum_{i=1}^n ||x_i||^2 - \sum_{i=1}^n ||(x_i^T)u||^2 \quad
    (*)$

    ```


    ## 3.3. 典型相关性分析


    ```

    $= \sum_{i=1}^{n} ||x_i||^2 - \sum_{i=1}^{n} (x_i^T u)^2 = \epsilon_{PCA,Var(u)}$

    ```


    其中 (*) 根据勾股定理成立：


    ```

    $||x - P_u x||^2 + ||P_u x||^2 = ||x||^2$

    ```


    因为 $x - P_u x \perp P_u x$。那么第一项 $\sum_i ||x_i||$ 对于 $u$ 是常数，我们有：

    $\arg min_u \epsilon_{PCA,Var(u)} = \arg min \text{常数} - \epsilon_{PCA,Var(u)}$


    因此，最小化重构误差等同于最大化投影方差。


    ## 3.3 典型相关性分析


    皮尔逊相关系数 $\rho(X,Y)$ 是衡量线性相关性（换句话说，即线性模型捕捉随机变量 $X$ 和 $Y$ 之间关系的能力）的方法：


    ```

    $$\rho(X,Y) = \frac{Cov(X,Y)}{\sqrt{Var(X)Var(Y)}}$$

    ```


    这里关于它的一些重要事实：


    - 它具有交换律：$\rho(X,Y) = \rho(Y,X)$

    - 它始终处于 -1 到 1 之间：$-1 \leq \rho(X,Y) \leq 1$

    - 它对仿射变换完全不变：对于任何 $a,b,c,d \in \mathbb{R}$，

    $\rho(aX+b, cY+d) = \frac{Cov(aX+b, cY+d)}{\sqrt{Var(aX+b)Var(cY+d)}}$

    $= \frac{Cov(aX,cY)}{\sqrt{Var(aX)Var(cY)}}$

    $= \frac{a \cdot c \cdot Cov(X,Y)}{\sqrt{a^2 Var(X) \cdot c^2 Var(Y)}}$

    $= \frac{Cov(X,Y)}{\sqrt{Var(X)Var(Y)}}$

    $= \rho(X,Y)$


    相关性是基于随机变量而非观测数据定义的。假设 $\mathbf{x,y} \in \mathbb{R}^n$ 是包含 $n$ 个 $X$ 和 $Y$ 独立观测值的向量。回顾大数定律，该定理指出对于均值为
    $\mu$ 的独立同分布 $X$：


    ```

    $$\sum_{i=1}^n X_i \xrightarrow{a.s.} n\mu \text{ 当 } n \to \infty$$

    ```


    我们可以利用此来证明均值的样本近似性：


    ```

    $Cov(X,Y) = \mathbb{E}[(X-\mathbb{E}[X])(Y-\mathbb{E}[Y])] \approx \frac{1}{n}
    \sum_{i=1}^n (x_i-\bar{x})(y_i-\bar{y})$

    ```


    其中横线表示样本平均值，$\bar{x} = \frac{1}{n}\sum_{i=1}^{n} x_i$。那么作为特殊情况，我们有：


    ```

    $Var(X) = \text{Cov}(X, X) = E[(X - E[X])^2] \approx \frac{1}{n}\sum_{i=1}^{n}(x_i
    - \bar{x})^2$

    ```


    ```

    $Var(Y) = \text{Cov}(Y, Y) = E[(Y - E[Y])^2] \approx \frac{1}{n}\sum_{i=1}^{n}(y_i
    - \bar{y})^2$

    ```


    将这些估计值代入相关性的定义并消去 1/n 因子，得到样本相关系数 $\hat{\rho}$：


    ```

    $$\hat{\rho}(x, y) = \frac{\sum_{i=1}^{n}(x_i-\bar{x})(y_i-\bar{y})}{\sqrt{\sum_{i=1}^{n}(x_i-\bar{x})^2
    \sum_{i=1}^{n}(y_i-\bar{y})^2}}$$

    ```

