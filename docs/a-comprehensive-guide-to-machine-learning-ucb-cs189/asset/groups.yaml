    # # Chapter 7


    # # Duality, Neareset Neighbors, Sparsity


    # ## 7.1 Duality


    Previously, in our investigation of SVMs, we formulated a constrained optimization
    problem that we can solve to find the optimal parameters for our hyperplane decision
    boundary. Recall the setup of soft-margin SVMs:


    +   * $y_i$:s: $\pm 1$, representing positive or negative class

    * $x_i$:s: feature vectors in $\mathbb{R}^d$

    * $\xi_i$:s: slack variables representing how much an $x_i$ is allowed to violate
    the margin

    * $C$: a hyperparameter describing how we penalize slack

    * The optimization problem for $w \in \mathbb{R}^d$ and $\xi \in \mathbb{R}$,
    the parameters of the SVM:


    ```

    $$\begin{aligned} \min_{w, \xi} & & \frac{1}{2}||w||^2 + C\sum_{t=1}^n \xi_t \
    \text{s.t.} & & y_i(w^t x_i - t) \geq 1 - \xi_i &\forall i \ \xi_i & \geq 0 &\forall
    i \end{aligned}$$

    ```


    Now, we will investigate the dual of this problem, which will motivate our discussion
    of kernels. Before we do, we first have to understand the primal and dual of an
    optimization problem.


    # ## Primal and Dual of an Optimization Problem


    All optimization problems and be expressed in the standard form


    ```

    $$\begin{aligned} \min & f_0(x) \\text{s.t.} & f_i(x) \leq 0 & i = 1, \dots, m
    \ & h_j(x) = 0 & j = 1, \dots, n \end{aligned}$$$ $(7.1)$

    ```


    For the purposes of our discussion, assume that $x \in \mathbb{R}^d$. The main
    components of an optimization problem are:'
  - '[PAGE 111]


    +   - The objective function $f_0(x)$


    +   - The inequality constraints: expressions involving $f_i(x)$


    +   - The equality constraints: expressions involving $h_j(x)$


    Working with the constraints can be cumbersome and challenging to manipulate,
    and it would be ideal if we could somehow turn this constrained optimization problem
    into an unconstrained one. One idea is to re-express the optimization problem


    ```

    $$\min_x \mathcal{L}(x) \quad (7.2)$

    ```


    where


    ```

    $$\mathcal{L}(x) = \begin{cases} f_0(x) & f_i(x) \leq 0, \forall i \in [1, m]
    \\text{and } h_j(x) = 0, \forall j \in [1, n] \ \infty & \text{otherwise} \end{cases}$

    ```


    Note that the unconstrained optimization problem above is equivalent to the original
    constrained problem. Even though the unconstrained problem considers values that
    violate the constraints (and therefore are not in the feasible set for the constrained
    optimization problem), it effectively ignore them because they are treated as
    $\infty$ in a minimization problem.


    Even now we are dealing with an unconstrained problem, it is still difficult to
    solve the optimization problem, because we still have to deal with all the casework
    in the objective function $\mathcal{L}(x)$. In order to solve this issue, we have
    to introduce dual variables, specifically one set of dual variables for the equality
    constraints, and one for the inequality constraints. If we only take into account
    the dual variables for the equality constraints, the optimization problem now
    becomes


    ```

    $$\max_x \nu \mathcal{L}(x, \nu) \quad (7.3)$

    ```


    where


    ```

    $$\mathcal{L}(x, \nu) = \begin{cases} f_0(x) + \sum_{j=1}^n \nu_j h_j(x) & f_i(x)
    \leq 0, \forall i \in [1, m] \\ \infty & \text{otherwise} \end{cases}$

    ```


    We are still working with an unconstrained optimization problem, except that we
    are optimizing over two sets of variables: the primal variables $x \in \mathbb{R}^d$
    and the dual variables $\nu \in \mathbb{R}^n$. Also note that the optimization
    problem has now become a nested, with an inner optimization that maximizes over
    the dual variables, an outer optimization that minimizes over the primal variables.
    Let''s examine why this optimization problem is equivalent to the original constrained
    problem:


    +   - Any $x$ that violates the inequality constraints is still treated as $\infty$
    by the outer minimization over $x$ and therefore ignored


    +   - For any $x$ that violates the equality constraints (meaning that $\exists
    j$ s.t. $h_j(x) \neq 0$), the inner maximization problem over $\nu$ can choose
    $\nu_j$ as if $h_j(x) > 0$ (or $\nu$ as $-\infty$ if $h_j(x) < 0$) to cause the
    inner maximization blow off to $\infty$, therefore being ignored by the outer
    minimization over $x$


    +   - For any $x$ that does not violate any of the equality constraints, the inner
    maximization problem over $\nu$ is simply equal to $f_0(x)$'
  md: '

    At last, we have formulated the hard-margin SVM optimization problem! Using the
    notation $w$ and $b$, the objective of hard-margin SVMs is


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2_2$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 \quad \forall i\quad (6.5)$$

    ```


    ## Soft-Margin SVMs


    The hard-margin SVM optimization problem has a unique solution only if the data
    is linearly separable, but it has no solution otherwise. This is because the constraints
    are impossible to satisfy if we can''t draw a hyperplane that separates the +1s
    from the -1s. In addition, hard-margin SVMs are very sensitive to outliers – for
    example, if our data is class-distributed Gaussian such that the two Gaussians
    are far apart, if we witness an outlier from class +1 that crosses into the typical
    region for class -1, then hard-margin SVM will be forced to compromise on a more
    generalized fit in order to accommodate this point. Our goal is to come up with
    a classifier that is not sensitive to outliers and can work even in the presence
    of data that is not linearly separable. To this end, we will talk Soft-Margin
    SVMs.


    A soft-margin SVM modifies the constraints from the hard-margin SVM by allowing
    some points to violate the margin. Formally, it introduces slack variables $\xi_i$,
    for each training point, the constraints:


    ```math

    $y_i(w^T x_i - b) \geq 1 - \xi_i$

    $\xi_i \geq 0$

    ```


    which is a less-strict, softer version of the hard-margin SVM constraints because
    it says that each point $x_i$, need only be a "distance" of $1-\xi_i$ of the separating
    hyperplane instead of a hard "distance" of 1.


    (By the Greek, the Greek letter $\xi$ is spelled "xi" and pronounced "zai". $\xi_i$
    is pronounced "zai-eye"). These constraints would be fruitless if we didn''t bound
    the values of the $\xi_i$''s, because by setting them to large values, we are
    essentially saying that any point may violate the margin by an arbitrarily large
    distance... which makes our choice of w meaningless. We modify the objective function
    to:


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    ```


    Where $C$ is a hyperparameter tuned through cross-validation. the soft-margin
    SVM optimization problem is


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 \quad \forall i$$

    $$\xi_i \geq 0 \quad \forall i\quad (6.6)$$

    ```


    The table below compares the effects of having a large $C$ versus a small $C$.
    As $C$ goes to infinity, the penalty for having non-zero $\xi_i$ goes to infinity,
    and thus forces the $\xi_i$''s to be zero, which is exactly the setting of the
    hard-margin SVM.


    | small C | large C |

    |---|---|---|

    | Desire | maximize margin | keep $\xi_i$ small or zero |

    | Danger | underfitting | overfitting |

    | Outliers | less sensitive | more sensitive |


    ## SVMs vs Tikhonov Regularization Learning


    Consider the following regularized regression problem:


    ```math

    $$\min \frac{1}{n} \sum L(y_i, w^T x_i - b) + \lambda\|w\|^2$$

    ```


    In the context of classification, the function that we would like to optimize
    is 0-1 step loss:


    ```math

    $L_{step}(y, w^T x - b) = \begin{cases} 1 & y(w^T x - b) < 0 \\ 0 & y(w^T x -
    b) \geq 0 \end{cases}$

    ```


    The 0-1 loss is 0 if $x$ is correctly classified and 1 otherwise. Thus minimizing
    $\frac{1}{n} \sum L(y_i, w^T x_i - b)$ directly minimizes classification error
    on the training set. However, the 0-1 loss is difficult to optimize: it is neither
    convex nor differentiable (see Figure 8.1).


    ![](img/99defe26aebed215976e83d281581f33_107_0.png)


    Figure 6.12: Step (0-1) loss, hinge loss, and squared loss. Square loss is convex
    and, hinge loss is neither convex, and step loss is neither.


    We can try to modify the 0-1 loss to be convex. The points with $y(w^T x - b)
    \geq 0$ should remain at 0 loss, but we might use the **hinge loss**, for misclassified
    points. as illustrated in Figure 8.1.


    ```math

    $L_{hinge}(y, w^T x + b) = \max(1 - y(w^T x - b), 0)$

    ```


    Thus the regular regression problem becomes


    ```math

    $$\min_{w,b} \frac{1}{n} \sum \max(1 - y_i(w^T x_i - b), 0) + \lambda\|w\|^2$$

    ```


    Recall that original soft-margin SVM optimization problem is


    ```math

    $$\min_{w,b,\xi} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    $$\text{s.t.} \quad y_i(w^T x_i - b) \geq 1 - \xi_i \quad \forall$$

    $$\xi_i \geq 0 \quad \forall$$

    ```


    ## 6.11. SUPPORT VECTOR MACHINES


    We claim these two formulations are actually equivalent. Manipulating the first
    constraint, we have that


    $$\xi_i \geq 1 - y_i(w^T x_i - b)$$


    Combining with the constraint $\xi_i \geq 0$, we have that


    $$\xi_i \geq \max(1 - y_i(w^T x_i - b), 0)$$


    At the optimal value of the optimization problem, these inequalities must be equalities.
    Otherwise, we could lower each $\xi_i$ to equal $\max(1-y_i(w^Tx_i - b),0)$ and
    decrease the value of the objective function. Thus we can rewrite the soft-margin
    SVM optimization problem as


    ```math

    $$\min_{w,b,\xi_i} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    $$\text{s.t.} \quad \xi_i = \max(1 - y_i(w^T x_i - b), 0) \quad \forall i$ (6.7)$$

    ```


    Simplifying further, we can remove the constraints:


    ```math

    $$\min_{w,b} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \max(1 - y_i(w^T x_i - b), 0)
    (6.8)$$

    ```


    If we divide by $C_n$ (which does not change the optimal solution of the optimization
    problem), we can see that this formulation is equivalent to the regularized regression
    problem, with $\lambda = \frac{1}{Cn_n}$. Thus we have two interpretations of
    soft-margin SVM: either as finding a hyperplane with slack variables or as regularized
    risk with hinge loss.


    ## 7. Duality


    ### 7.1. Primal and Dual of Optimization Problem


    Previously, in our investigation of SVMs, we formulated the primal problem. Before
    we do, we first have to understand the dual of this. To do that, let''s look at
    the dual of an optimization problem.

