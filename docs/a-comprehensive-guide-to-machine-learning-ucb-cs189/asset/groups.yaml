    & &-\sigma_{d+1} \\ & & \vdots \\ 0 & & 0 \end{bmatrix}

    ```


    SVD 坐标下的这种扰动对应于原始坐标系下的扰动


    ```

    $[\mathbf{E} \mathbf{f}] = [\mathbf{u}_1 \quad \dots \quad \mathbf{u}_{d+1} \quad
    U_{rest}] \begin{bmatrix} 0 & & 0 \\ & \vdots & \vdots \\ &-\sigma_{d+1}\mathbf{v}_{d+1}^T
    & \mathbf{v}_{d+1}^T \\ 0 & & 0 \end{bmatrix} = -\sigma_{d+1}\mathbf{u}_{d+1}\mathbf{v}_{d+1}^T$

    ```


    结果这种选择是最优的，正如最后提到的 Eckart-Young 定理所保证的。所得矩阵的零空间为


    ```

    $null([X \quad \mathbf{y}] + [\mathbf{E} \mathbf{f}]) = null(\sum_{j=1}^d \sigma_j
    \mathbf{u}_j \mathbf{v}_j^T) = span(\mathbf{v}_{d+1})$

    ```


    后一个等式的成立是因为 $\{\mathbf{v}_1, \dots, \mathbf{v}_{d+1}\}$ 构成 $\mathbb{R}^{d+1}$
    的正交基。为了得到权重 $\mathbf{w}$，我们找到一个比例因子 $\alpha$，使得 $[\mathbf{w}]^\top$ 在零空间内，即


    ```

    $\mathbf{w} = \alpha v_{d+1}$

    ```


    一旦我们有了 $v_{d+1}$ 或它的任何标倍，我们只需将其缩放使得第二个分量为 1，且由于 $v_{d+1}$ 是 $[\mathbf{X} \quad
    \mathbf{y}]$ 的右奇异向量，它是矩阵


    ```

    $\begin{bmatrix} \mathbf{X} \\ \mathbf{y} \end{bmatrix}^\top \begin{bmatrix} \mathbf{X}
    & \mathbf{y} \end{bmatrix} = \begin{bmatrix} \mathbf{X}^\top\mathbf{X} & \mathbf{X}^\top\mathbf{y}
    \\ \mathbf{y}^\top\mathbf{X} & \mathbf{y}^\top\mathbf{y} \end{bmatrix}$

    ```


    为了获得额外的视角，忽略底部方程（因为我们有一个额外的自由度），并考虑顶部方程的解：


    ```

    $\mathbf{X}\mathbf{w} - \mathbf{y} = -\sigma_{d+1}^2\mathbf{w} \quad (13)$

    ```


    这可以重写为


    ```

    $(\mathbf{X} + \sigma_{d+1}^2 I)\mathbf{w} = \mathbf{y} \quad (14)$

    ```


    这看起来像岭回归，带有一个负的正则常数！为什么这是合理的？岭回归的动机之一是确保被逆的矩阵实际上是非奇异的，减去单位矩阵的标倍似乎是反向操作。我们可以通过回想起原始模型来理解这一点：


    ```

    $\mathbf{X} = \mathbf{X}_{true} + \mathbf{Z}$

    ```


    其中 $\mathbf{X}_{true}$ 是损坏前的真实值，而 $\mathbf{Z}$ 是零均噪声项。那么


    ```

    $\mathbb{E}[\mathbf{X}] = \mathbb{E}[(\mathbf{X}_{true} + \mathbf{Z})] = \mathbb{E}[\mathbf{X}_{true}]
    + \mathbb{E}[\mathbf{Z}]$

    ```


    注意 $\mathbb{E}[\mathbf{Z}]$ 的非对角项为零，因为 $i$ 项是零的。由于左侧矩阵是对角阵，我们可以通过置零其一个对角元素来缩小其大小。


    '
