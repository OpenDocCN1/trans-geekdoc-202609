    ### 偏差-方差分析


    让我们对应用于回归任务的 k-NN 形式化证明这一推理的合理性。假设给定训练数据集 $\mathcal{D}=\{(x_i, y_i)\}_{i=1}^n$，其中标签
    $y_i$ 是实值标量。我们将假设函数 $h(z)$ 为：


    ```

    $h(z) = \frac{1}{k} \sum_{i=1}^n N(x_i, z, k)$

    ```


    其中函数 $N$ 定义为：


    ```

    $N(x_i, z, k) = \begin{cases} y_i & \text{如果 } x_i \text{ 是距离 } z \text{ 最近的 }
    k \text{ 个点之一} \\ 0 & \text{其他} \end{cases}$

    ```


    同样假设我们的标签 $y_i = f(x_i) + \epsilon$，其中 $\epsilon$ 是来自 $\mathcal{N}(0, \sigma^2)$
    的噪声，$f$ 是真实函数。令 $x_1 \dots x_k$ 为最近的 $k$ 个点。让我们为给定数据集 $D$ 推导我们模型的偏差。


    ```

    $E[[h(z)] - f(z)]^2 = E\left[\left(\sum_{i=1}^k N(x_i, z, k) - f(z)\right)^2\right]
    = E\left[\left(\sum_{i=1}^k y_i - f(z)\right)^2\right]$

    ```


    ```

    $E\left[(\sum_{i=1}^k E[y_i] - f(z)\right)^2\right] = E\left[\left(\sum_{i=1}^k
    E[f(x_i) + \epsilon] - f(z)\right)^2\right]$

    ```


    ```

    $E\left[(\sum_{i=1}^k f(x_i) - f(z))^2\right]$

    ```


    当 $k \to \infty$ 时，$\sum_{i=1}^k f(x_i)$ 趋向于 $x$ 的平均水平。当 $k=1$ 时，偏差简单为 $f(x_1)
    - f(z)$。假设 $x_1$ 足够接近 $f(z)$,那么 $k=1$ 时偏差可能很小，因为它们共享相似的均值。同时，当 $k \to \infty$
    时，偏差完全不依赖于训练点，这将限制其保持较高。


    现在，让我们推导 $h(z)$ 的方差：


    ```

    $Var[h(z)] = Var\left[\frac{1}{k} \sum_{i=1}^k y_i\right] = \frac{1}{k^2} \sum_{i=1}^k
    Var[f(x_i) + \epsilon]$

    ```


    ```

    $$\frac{1}{k^2} \sum_{i=1}^k Var[\epsilon]$$

    ```


    ```

    $$\frac{1}{k^2} \sum_{i=1}^k \sigma^2 = \frac{1}{k^2} k\sigma^2 = \frac{\sigma^2}{k}$$

    ```


    当 $k \to \infty$ 时，方差趋于0，并在 $k=1$ 处达到最大。


    ### 属性


    **计算复杂度：** 我们需要 $O(n)$ 空间来存储大小为 $n$ 的训练集。如果使用专门的数据结构来存储数据，则训练期间没有运行时开销。然而，预测需要
    $O(n)$ 时间，这是昂贵的。已有关于近似最近邻（ANN）程序的研究，它们可以快速找到最近邻的近似值——一些常用的 ANN 方法包括*局部敏感哈希*（Locality-Sensitive
    Hashing）和通过随机（Johnson-Lindenstrauss）距离保真投影进行降维的算法。$^2$


    $^2$ ANN 方法超出了本课程的范围，但在实际应用中非常有用。


    ## 7.3. 最近邻分类


    **灵活性：** 当 $k>1$ 时，可以通过修改 k-NN 来输出预测概率 $P(Y|X)$，其定义方法是将 $P(Y|X)$ 定义为训练集中距离 $X$
    最近的邻居中类别 $Y$ 的比例。


    k-NN 也可以适用于回归——不再采用多数投票，而是取最近邻居的 $y$ 值的平均值。k-NN 可以学习复杂的非线性决策边界。


    **非参数：** k-NN 是一种非参数方法，这意味着模型中的参数数量随训练点数量 $n$ 的增加而增长。这与参数方法相反，后者的参数数量与 $n$ 无关。参数方法的某些示例包括线性回归、LDA
    和神经网络。


    **在高维中的表现：** k-NN 在高维表现并不良好。随着维度的增加，数据点变得彼此分离，因此某个点的最近邻居会离它非常远。


    **理论属性：** 对于这种简单的方法，k-NN 具有令人印象深刻的理论保证。Cover 和 Hart (1967) 证明，当训练样本数 $n$ 趋于无穷大时，$l$-NN
    的期望预测误差限于 $2e^*$，其中 $e^*$ 是贝叶斯（最优）误差。Fix 和 Hodges (1951) 证明了当 $n$ 和 $k$ 都趋于无穷时。


    ### 维度灾难


    为了理解为什么 k-NN 表现不佳，我们首先需要理解高维特性。这里有一个经典的例子：考虑外球与内球的比例。在高维中，随机高斯分布将位于![](img/99defe26aeb215976e83d281581f33_120_1.png)


    当 $d \to \infty$ 时，外球的体积相对于内球。这种现象被称为测度集中（concentration of measure）。不需要复杂的不等式，我们可以证明一个简单的结论：


    **定理：** 如果 $X_i \sim N(0, \sigma^2), i=1,\dots,d$ 独立且 $R^2=\sum_{i=1}^d X_i^2$，则对于每个
    $\epsilon > 0$，以下等式成立：


    ```

    $$\lim_{d \to \infty} P(|R^2 - E(R^2)| \geq d^{1/2+\epsilon}) = 0$$

    ```


    *证明。* 根据卡方分布的方差公式，我们看到 $Var(R^2)=d\sigma^4$。应用切夫不等式可得


    ```

    $P(|R^2 - E(R^2)| \geq d^{1/2+\epsilon}) \leq \frac{2d\sigma^4}{d+1} \xrightarrow{d
    \to \infty} 0$

    ```


    因此，在高概率下，随机高斯分布将位于远离原点的薄环形区域，尽管高斯钟形曲线的模式位于原点。


    ### 改进 k-NN


    有两种方法可以改进 k-NN 并克服我们讨论的缺点：


    - 1. 获取更多训练数据。

    - 2. 减少特征维度并/或选择更好的特征。考虑其他距离函数的选择。


    图像空间降维的一个例子是降低图像分辨率，虽然这丢弃了一些原始像素特征，但我们可能仍然可以通过最近邻方法获得相同或更好的性能。


    我们还可以修改距离函数。例如，我们有一族由 $L^p$ 范数导出的**闵可夫斯距离**（Minkowski distances）：


    ```

    $D_p(x,z) = \left( \sum_{i=1}^d |x_i - z_i|^p \right)^{1/p}$

    ```


    在不对数据进行预处理的情况下，使用 $L^3$ 距离的 I-NN 在 MNIST 上的表现优于使用 $L^2$ 距离的 I-NN。

