    # 1.5. HYPERPARAMETERS AND VALIDATION


    ![](img/99defe26aebed215976e83d281581f33_14_0.png)


    # Cross-validation


    Setting aside a validation set works well, but comes at a cost, since we cannot
    use the validation data for training. Since having more data generally improves
    the quality of the trained model, we may prefer not to let that data go to waste,
    especially if we have little data to begin with and/or collecting more data is
    expensive. Cross-validation is an alternative to having a dedicated validation
    set.


    $k$-fold cross-validation works as follows:


    +   1. Shuffle the data and partition it into $k$ equally-sized (or as equal as
    possible) blocks.

    2. For $i = 1, \dots, k$,

    * Train the model on all the data except block $i$.

    * Evaluate the model (i.e. compute the validation error) using block $i$.


    | 1 | 2 | 3 | 4 | 5 | 6 | ... | $k$ |

    |---|---|---|---|---|---|---|-|

    | validate | train | | | | | | |

    | train validate | | train | | | | |

    | | train validate | | train | | | |

    | | | | | | | |


    +   3. Average the $k$ validation errors; this is our final estimate of the true
    error.


    Note that this process (except for the shuffling and partitioning) must be repeated
    for every hyperparameter configuration we wish to test. This is the principle
    drawback of $k$-fold cross-validation as compared to using a held-out validation
    set - there is roughly $k$ times as much computation required. This is not a big
    deal for the relatively small linear models we''ve seen so far, but it can be
    prohibitively expensive when the model takes a long time to train, as is the case
    in the Big Data regime or when using neural networks.'
