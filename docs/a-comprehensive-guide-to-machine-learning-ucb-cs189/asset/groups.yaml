    ## 6.11 Support Vector Machines


    So far we''ve explored **generative models** (LDA), **discriminative models**
    (logistic regression), but in both of these methods, we tasked ourselves modeling
    some kind of probability distribution. One observation about classification is
    that in the end, if we only care about assigning each data point class, all we
    really need to know is find a “good” decision boundary, and we can skip thinking
    about the distributions. Support Vector Machines (SVMs) are an attempt to model
    decision boundaries directly in this spirit.


    Here''s the setup for the problem:


    - Given: training dataset $D = \{(x_i, y_i)\}_{i=1}^n$, where $x_i \in \mathbb{R}^d$
    and $y_i \in \{-1, +1\}$

    - Goal: find a $d-1$ dimensional hyperplane decision boundary $H$ that separates
    the $+1$s from the $-1$s.


    ## Motivation for SVMs


    In order to motivate SVMs, we first have to understand the much simpler perceptron
    classifier and its shortcomings. Given that the training data is linearly separable,
    the perceptron algorithm finds a $d-1$ dimensional hyperplane that perfectly separates
    the $+1$s from the $-1$s. Mathematically, the goal is to learn a weight vector
    $w \in \mathbb{R}^d$ and a bias term $b \in \mathbb{R}$, that satisfy the linear
    separability constraints:


    $$\begin{cases} w^Tx_i - b \geq 0 & \text{if } y_i = 1 \\ w^Tx_i - b \leq 0 &
    \text{if } y_i = -1 \end{cases}$$


    Equivalently,

    $$y_i(w^Tx_i - b) \geq 0$$


    The resulting decision boundary is a hyperplane $H = \{x : w^Tx - b = 0\}$. All
    points on the positive side of the hyperplane are classified as $+1$, and all
    points on the negative side are classified as $-1$. Note that the perceptron has
    two major shortcomings that we will see, SVMs can overcome. First of all, if the
    data is not linearly separable, the perceptron fails to find a stable solution.
    As we will see, soft-margin SVMs fix this by allowing best-fit decision boundaries
    even when the data is not linearly separable. Second, if the data is linearly
    separable, the perceptron could find infinitely many decision boundaries - if
    $(w, b)$ is a pair that separates the data points, then the perceptron could end
    up choosing a slightly different $(w, b+\epsilon)$ pair. Some hyperplanes are
    better than others, but the perceptron cannot distinguish between them. This leads
    to generalization issues.


    ![](img/99defe26aebed215976e83d281581f33_102_0.png)


    Figure 6.8: Two possible decision boundaries under the perceptron. The X''s and
    C''s represent the $+1$s and $-1$s respectively.


    In the figure above, we consider two potential linear separators that satisfy
    the constraints. One could imagine that if we observed new test points that are
    near the region of C''s in the training data, they should also be of class C.
    The orange separator would incorrectly classify some of the new test points, while
    the black separator would most likely be able to classify them correctly. To the
    eyes of the perceptron algorithm, both the orange and black lines are perfectly
    valid decision boundaries. Therefore, the perceptron may not be able to generalize
    well to unseen data.


    ## Hard-Margin SVMs


    Hard-Margin SVMs solve the generalization problem of perceptrons by maximizing
    the **margin**, formally known as the minimum distance from the decision boundary
    to any of the training points.


    ![](img/99defe26aebed215976e83d281581f33_103_0.png)


    Intuitively, maximizing the margin allows us to generalize better to unseen data,
    because the decision boundary with the maximum margin is as far from the training
    data as possible and the boundary cannot be violated unless the unseen data contains
    outliers.


    Simply put, the goal of hard-margin SVMs is to find a hyperplane $H$ that maximizes
    the margin $m$. Let''s formalize the optimization problem. We want to maximize
    $m$ subject to the following:


    - All points classified as $+1$ are on the positive side.

    - All points classified as $-1$ are on the negative side.


    The margin $m$ is defined as the distance from the hyperplane to the nearest data
    point. For a hyperplane $w^Tx - b = 0$, the distance from a point $x_i$ to the
    hyperplane is $\frac{w^Tx_i - b}{\|w\|}$. Thus, we want to maximize:


    $$\max_{w, b} \frac{m}{\|w\|} \quad \text{subject to} \quad \begin{cases} w^Tx_i
    - b \geq m & \text{if } y_i = 1 \\ w^Tx_i - b \leq -m & \text{if } y_i = -1 \end{cases}$$


    To simplify, we can set $\|w\| = 1$ and maximize $m$, which leads to:


    $$\max_{w, b, m} m \quad \text{subject to} \quad \begin{cases} w^Tx_i - b \geq
    m & \text{if } y_i = 1 \\ w^Tx_i - b \leq -m & \text{if } y_i = -1 \end{cases}$$


    This is equivalent to $y_i(w^Tx_i - b) \geq m$. If we fix $m=1$, we get the standard
    hard-margin SVM formulation:


    $$\min_{w, b} \frac{1}{2}\|w\|^2 \quad \text{subject to} \quad y_i(w^Tx_i - b)
    \geq 1$$

