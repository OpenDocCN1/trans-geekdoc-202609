    and hinge loss for SVM. For AdaBoost, we use the exponential loss:


    $L(y, h(x)) = e^{-yh(x)}$


    This loss function is illustrated in Figure 8.1. We have exponential decay as
    we increase the input - if $yh(x)$ is large and positive (so $h(x)$ has the correct
    sign and magnitude), or if $yh(x)$ is a large negative value, our loss is increasing
    exponentially, and we are heavily penalized for making an incorrect prediction.


