    如果 $Z_i$ 不是独立的呢？这通常发生在时间序列数据中。同样，我们假设一个噪声行为的模型。噪声项不是独立的，但有一个已知的过程：例如 $y_{i+1}
    = rZ_i + U_i$，其中 $U_i \sim \mathcal{N}(0,1)$ i.i.d，$-1 \le r \le 1$（为了防止发散），或“滑动窗口”示例（如音频回声），$Z_i
    = \sum r_j U_{i-j}, U_i \sim \mathcal{N}(0,1)$。


