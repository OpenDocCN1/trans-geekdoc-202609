    \sim \mathcal{N}(\mathbf{Xw}, \Sigma_Z)$。


    $\mathbf{w}^* = \arg \max_{\mathbf{w} \in \mathbb{R}^n} \frac{1}{\sqrt{\det(\Sigma_Z)}}(\sqrt{2\pi})^n}
    e^{-\frac{1}{2}(\mathbf{y}-\mathbf{Xw})^T\Sigma_Z^{-1}(\mathbf{y}-\mathbf{Xw})}
    \quad (2.1)$


    $\arg \min_{\mathbf{w} \in \mathbb{R}^n} (\mathbf{y}-\mathbf{Xw})^T\Sigma_Z^{-1}(\mathbf{y}-\mathbf{Xw})
    \quad (2.2)$


