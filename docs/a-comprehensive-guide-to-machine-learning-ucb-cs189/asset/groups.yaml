    # 证明 (1) $\implies$ (3)


    在我们之前定义的问题背景下，我们从条件 (1) 开始，即 $\mathbf{Z} = \mathbf{RU}$（在此情况下 $l=n$），我们想推导出 $\mathbf{Z}$
