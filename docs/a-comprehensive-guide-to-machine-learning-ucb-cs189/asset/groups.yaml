    # 第 6 章 分类


    为了简化论证，假设 $P$ 是一个伯努利分布。如果 $P \sim \text{Bernoulli}(1)$ 或 $P \sim \text{Bernoulli}(0)$，那么完全没有意外，因为我们每次从该分布中采样时，总是期望得到相同的值。这在数学上是合理的，因为熵最小化：$H(P)=0$。然而，当
    $P \sim \text{Bernoulli}(0.5)$ 时，存在大量的不确定性/惊喜，事实上，熵达到了最大。


    ## 6.9 多分类逻辑回归


    回想逻辑回归中，我们正在调整一个权重向量 $w \in \mathbb{R}^{d+1}$，这导致了二二分类 0 和 1 上的后验分布 $Q_i \sim
    \text{Bernoulli}(p_i)$：


    ```

    $P(Q_i=1) = p_i = s(w^T x_i) = \frac{1}{1+e^{-w^T x_i}}$

    $P(Q_i=0) = 1-s(w^T x_i) = \frac{e^{-w^T x_i}}{1+e^{-w^T x_i}}$

    ```


    让我们将此概念推广到**多分类逻辑回归**，其中有 $K$ 个类别。与我们的讨论不同，重要的是，类别之间没有内在的顺序，且在 1 到 $K$ 的连续范围内预测类别将是一个糟糕的选择。在这里，我们回想一下水果分类的例子。假设
    1 用于表示梨，2 用于表示香蕉，在我们的数值表示中，它似乎少于香蕉，而香蕉少于苹果。结果，如果我们有一张看起来介于苹果和梨之间的图像，我们可能会简单地将其分类为香蕉。


    解决方案是使用**独热编码（one-hot vector encoding）**来表示所有标签。如果第 $i$ 个观测值属于类 $k$，我们不再使用表示 $y_i=k$，而是使用表示
    $y_i=e_k$。在我们的水果示例中，如果第 $i$ 张图像被分类为“香蕉”，它的标签表示将为


    ```

    $y_i = [0 \ 1]^T$

    ```


    现在类别的表示中没有顺序了。我们必须根据独热编码器修改我们的权重表示。现在，每个类别都有一组 $d+1$ 个权重，相当于一个矩阵 $W \in \mathbb{R}^{K
    \times (d+1)}$。对于每个输入 $x_i \in \mathbb{R}^{d+1}$，每个类别都被赋予一个“分数”，


    ```

    $z_k = w_k^T x_i$

    ```


    其中 $w_k$ 是 $W$ 矩阵的第 $k$ 行。现在对于每个输入 $x_i$ 有 $K$ 个得分：


    ```

    $[w_1^T x_i \quad w_2^T x_i \quad \dots \quad w_K^T x_i]$

    ```


    类别得分越高，逻辑回归选择该类的概率越大。现在我们有了一套系统，将所有这些得分转换为后验概率分布 $Q$。对于二回归，我们使用了逻辑函数，它取值 $w_k^T
    x_i$ 并将其压缩到 0 到 1 之间的值。逻辑函数到多分类情况的推广是**softmax 函数**。softmax 函数接收所有 $K$ 个得分（正式称为
    **logits**）以及一个索引 $j$ 作为输入，并输出相应的 softmax 取值为 $j$ 的概率：


    ```

    $softmax(j, \{z_1, z_2, \dots, z_K\}) = \frac{e^{z_j}}{\sum_{k=1}^K e^{z_k}}$

    ```


    ## 6.9 多分类逻辑回归


    logits 引起了 softmax 分布，我们可以验证它是一个概率分布：


    - 1. 元素位于 0 和 1 之间。

    - 2. 元素之和为 1。


    经检查，这个 softmax 分布是合理的，因为类别的得分越高，其概率越高。事实上，我们可以验证逻辑函数是 softmax 函数的一个特殊例。假设类别 0
    对应的权重为 $w_0$ 和 $w_1$，我们有：


    ```

    $P(Q_i=1) = \frac{e^{w_1^T x_i}}{e^{w_1^T x_i} + e^{(w_1-w_0)^T x_i}} = \frac{e^{(w_1-w_0)^T
    x_i}}{1 + e^{(w_1-w_0)^T x_i}} = s((w_1 - w_0)^T x_i)$

    $P(Q_i=0) = \frac{e^{w_0^T x_i}}{e^{w_1^T x_i} + e^{(w_1-w_0)^T x_i}} = \frac{e^{w_0^T
    x_i}}{e^{w_0^T x_i} + e^{(w_1-w_0)^T x_i}} = 1 - s((w_1 - w_0)^T x_i)$

    ```


    在二分类情况下，因为我们只对 $w_1$ 和 $w_0$ 之间的差异感兴趣，我们使用变量替换 $w = w_1 - w_0$。我们不需要单独知道 $w_1$
    和 $w_0$，因为我们知道 $P(Q_i=1)$，默认知道 $P(Q_i=0) = 1 - P(Q_i=1)$。


    ### 多分类逻辑回归损失函数


    让我们从信息论的角度推导多分类逻辑回归的损失函数。“真实”或目标分布是 $P(P_i=j) = y_{ij}$。换句话说，整个分布集中在训练用例的标签上。估计分布
    $Q$ 来自于多分类逻辑回归，这就是 softmax


    ```

    $P(Q_i=j) = \frac{e^{w_j^T x_i}}{\sum_{k=1}^K e^{w_k^T x_i}}$

    ```


    现在我们来推导损失。目标一既往一样，是最小化所有训练样本引起的 KL 散度之和。


    ```

    $W_{MCLR}^* = \arg min_{W} \sum_{i=1}^n D_{KL}(P_i||Q_i)$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K P(P_i=j) \ln \frac{P(P_i=j)}{P(Q_i=j)}$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \ln \frac{y_{ij}}{\text{softmax}(j,
    \{w_1^T x_i, \dots, w_K^T x_i\})}$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \cdot \ln y_{ij} - \ln (\text{softmax}(j,
    \{w_1^T x_i, \dots, w_K^T x_i\}))$

    $= \arg min_{W} \sum_{i=1}^n \sum_{j=1}^K y_{ij} \cdot \ln \left(\frac{y_{ij}}{\text{softmax}(j,
    \{w_1^T x_i, \dots, w_K^T x_i\})}\right)$

    ```


