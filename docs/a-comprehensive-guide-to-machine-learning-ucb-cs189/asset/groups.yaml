    \ the rewards get smaller and smaller, infinitesimally affecting the values of\
    \ $\\|w\\|^2$. On the other hand, decreasing $\\xi_i$ causes a finite increase\
    \ in the cost incurred by the $\\|w\\|^2$—the same increase as in the previous\
    \ example. Intuitively, we can reason that there will be a threshold value $\\\
    xi^*$ such that decreasing $\\xi_i$ further will no longer outweigh the cost incurred\
