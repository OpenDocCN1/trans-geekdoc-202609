    # 第 2 章


    ## 机器学习中的概率模型


    ### 2.1 MLE 和 MAP


    到为止，我们已经探索了最小二乘框架下的两种方法：普通最小二乘法和岭回归：


    ```

    $w_{OLS}^* = \arg \min_{\mathbf{w}} ||\mathbf{y} - \mathbf{X}\mathbf{w}||_2^2
    = \arg \min_{\mathbf{w}} \sum_{i=1}^n (y_i - \mathbf{x}_i^T\mathbf{w})^2$

    ```


    ```

    $w_{RIDGE}^* = \arg \min_{\mathbf{w}} ||\mathbf{y} - \mathbf{X}\mathbf{w}||_2^2
    + \lambda|\mathbf{w}||_2^2 = \arg \min_{\mathbf{w}} \sum_{i=1}^n (y_i - \mathbf{x}_i^T\mathbf{w})^2
    + \lambda \sum_{j=1}^d w_j^2$

    ```


    你可能一直在问自己，为什么我们使用使用平方误差来衡量模型的有效性，以及为什么对模型权重使用 $l^2$ 范数（而不是其他范数）。我们将通过探索监督学习方法（特别是回归方法）的统计解释，为这些设计选择提供合理依据。更具体地说，我们将利用概率中的多种概念（如高斯分布、MLE
    和 MAP），从一个不同的视角来验证我们目前所做的一切。


    ## 模型空间中的优化


    让我们来看一个简单的回归模型：


    ```

    $f(x) = slope \cdot x + intercept$

    ```


    我们的目标是找到认为能够描述数据的最佳斜率和截距值。每一对任意的（斜率，截距）都对应数据空间中的一条直线。然而，它可以被视为模型空间中的一个点。学习最优模型等同于数据空间中的数据点拟合直线；它等同于在模型空间中定位最优参数点：


    我们观测的数据是具有不同分布、覆盖范围密度的随机样本。我们会遇到许多不同的分布，例如均匀分布、高斯分布和拉普拉斯分布。噪声分布通常被假设为高斯分布，部分原因是由于大多数噪声都落在均值的
    1 或 2 个标准差范围内。为了方便起见，我们列出它们的属性。


    ### 2.1 MLE 和 MAP


    随机变量：$X \sim p(x)$


    概率分布：$p(x) = \frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}}$


    均值：$E[X] = \int_{-\infty}^{\infty} xp(x)dx = \mu$


    方差：$V[X] = E[(X-\mu)^2] = \int_{-\infty}^{\infty} (x-\mu)^2p(x)dx = \sigma^2$


    参数：$X \sim \mathcal{N}(\mu, \sigma^2)$


    对数似然：$\log P(X) = \sum \frac{(x-\mu)^2}{2\sigma^2} - \sqrt{2\pi}\sigma$。


    线性组合：$E[aX+bY] = a\mu_x + b\mu_y$


    如果 $X, Y$ 独立：$V[aX+bY] = a^2\sigma_x^2 + b^2\sigma_y^2$

    $aX+bY \sim \mathcal{N}(a\mu_x+b\mu_y, a^2\sigma_x^2+b^2\sigma_y^2)$


    ### 用于模型选择的 MLE 和 MAP


    在回归（以及所有的监督学习）背景下，我们假设存在一个将输入映射到输出的**真实底层模型**。作为机器学习专家，我们的目标是通过我们给定的数据，找到一个代表真实底层模型的**假设模型**。


    让我们更具体地定义数据和模型。我们的数据由 $n$ 组 $(x_i, y_i)$ 对组成，正如我们之前看到的：


    $$\mathcal{D} = \{(x_i, y_i)\}_{i=1}^n$$


    真实底层模型 $f$ 是一个将输入 $x_i$ 映射到真实输出 $f(x_i)$ 的函数。每个**观测值** $y_i$ 仅仅是 $f(x_i)$ 的噪声版本：


    $y_i = f(x_i) + N_i$


    现在 $f(x_i)$ 是一个常数，而 $N_i$ 是一个随机变量。我们总是假设 $N_i$ 的均值为零，否则我们的观测值将会出现系统偏差。$N_i$ 可以是高斯分布、均匀分布、拉普拉斯分布等。在这里，假设它们是**独立同分布的
    (i.i.d)** 且斯分布：$N_i \sim \mathcal{N}(0, \sigma^2)$。我们可以验证 $y_i|x_i \sim \mathcal{N}(f(x_i),
    \sigma^2)$。


    现在我们引入了数据，并希望找到一个能够描述数据的假设模型 $h_\theta$，可能包含了对真实模型的先验知识。我们可以将其表示为一个概率问题，其目标是找到概率最大的模型。


    ### 最大似然估计


    在极大似然估计（MLE）中，目标是找到数据概率最大的模型。如果我们对假设模型进行参数化 $\theta$，可以将该问题表示为：


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} P(data = \mathcal{D} | \text{true model}
    = \theta)

    ```


    更具体地说：


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} P(y_1, \dots, y_n | \mathbf{x}_1, \dots,
    \mathbf{x}_n, \theta)

    ```


    注意，实际上是对 $\mathbf{x}_i$ 进行条件化的，因为我们将它们视为固定值。数据中的随机性来自于 $y_i$（因为它们是真实值 $f(\mathbf{x}_i)$
    的噪声版本）。我们可以通过将问题视为图模型来简化这个表达式。注意 $y_i$ 只依赖于它的父节点，不依赖于其他 $y_j$，因为所有的 $y_j$ 都是独立的项。我们可以随后简化目标：


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} \prod_{i=1}^n P(y_i | \mathbf{x}_i,
    \theta) = \sum_{i=1}^n \log P(y_i | \mathbf{x}_i)

    ```


    现在让我们关注每一个项 $P(y_i | \mathbf{x}_i, \theta)$。我们知道 $y_i | \mathbf{x}_i, \theta \sim
    N(h(x_i), \sigma^2)$，处理高斯分布的指数项非常麻烦。相反，我们将使用对数，这使得指数项变为：


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} \sum_{i=1}^n \log P(y_i | \mathbf{x}_i,
    \theta) (2.1)

    ```


    注意使用对数我们仍然在处理相同的问题，因为对数是单调函数。换句话说：


    $P(A) < P(B) \iff \log P(A) < \log P(B)$


    继续使用对数：


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} \sum_{i=1}^n \log P(y_i | \mathbf{x}_i,
    \theta) (2.1)

    ```


    ```

    $= \arg \max_{\theta} \sum_{i=1}^n \left( -\frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2}
    - \log \sqrt{2\pi} \right) (2.2)

    ```


    ```

    $= \arg \min_{\theta} \sum_{i=1}^n \left( \frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2}
    + \log \sqrt{2\pi} \right) (2.3)

    ```


    ```

    $= \arg \min_{\theta} \sum_{i=1}^n (y_i - h(\mathbf{x}_i))^2 (2.4)

    ```


    注意在步骤 (3) 中，我们通过对目标函数取反将问题变成了最小化问题。在步骤 (4) 中，我们消除了第二项和第一项的分母，因为它们不于我们正在优化的变量。


    现在来看回归的情况。在这种情况下，我们的假设形式为 $h(\mathbf{x}_i) = \mathbf{x}_i^T \theta$，其中 $\theta
    \in \mathbb{R}^d$，$d$ 是特征化数据点的维度。在这个特定的设置下，问题变为：


    ```

    $$\theta_{\text{MLE}} = \arg \min_{\theta \in \mathbb{R}^d} \sum_{i=1}^n (y_i
    - \mathbf{x}_i^T \theta)^2

    ```


    这正是普通最小二乘法（OLS）问题！我们刚刚证明了回归的 OLS 和 MLE 得相同的答案！我们得出结论：MLE 是使用平方误差（OLS 的基础）作为回归模型评估指标的概率依据。


    ### 后验概率


    在后验概率估计（MAP）中，目标是找到使模型概率最大的：


    ```

    $$\theta_{MAP} = \arg\max P(\text{true model} = h_\theta | \text{data} = \mathcal{D})
    (2.1)

    ```


    ```

    $= \arg\max_{\theta} P(\text{data} = \mathcal{D} | \text{true model} = h_\theta)
    P(\text{true model} = h_\theta) (2.2)

    ```


    ```

    $= \arg\max_{\theta} \log P(\text{data} = \mathcal{D} | \text{true model} = h_\theta)
    + P(\text{true model} = h_\theta) (2.3)$ （注：此处原文似乎漏掉了 log，此处根据逻辑补全）

    ```


    ```

    $= \arg\max_{\theta} \log P(\text{data} = \mathcal{D} | \text{true model} = h_\theta)
    + \log P(\text{true model} = h_\theta) (2.4)

    ```


    ```

    $= \arg\min_{\theta} -\log P(\text{data} = \mathcal{D} | \text{true model} = h_\theta)
    - \log P(\text{true model} = h_\theta) (2.5)

    ```


    在这里，我们使用了**贝斯法则**来表示目标函数。在这里，我们将 $P(\text{data} = \mathcal{D})$ 表示为常数，因为它不依赖于我们正在优化的变量。注意
    MAP 就像 MLE 一样，只是多了一个项 $P(h_\theta)$，它是*先验*项。正如我们之前假设噪声项是独立同分布且高斯分布：$N \sim \mathcal{N}(0,
    \sigma^2)$。对于先验 $P(h_\theta)$，假设它遵循标准高斯分布的平移和缩放版本：$h_\theta \sim \mathcal{N}(\theta_0,
    \sigma_h^2)$。利用这些特定信息，我们得到：


    ```

    $$\theta_{MAP} = \arg\min_{\theta} \sum_{i=1}^n \left( \frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2}
    \right) + \frac{|||\theta - \theta_0||^2}{2\sigma_h^2} (2.1)

    ```


    ```

    $= \arg\min_{\theta} \sum_{i=1}^n \frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2}
    + \frac{\sigma^2}{2\sigma_h^2} \frac{|||\theta - \theta_0||^2}{\sigma^2} (2.2)

    ```


    让我们''s 线性回归的情况，以直观地展示 $h_{\theta}(x)$ 项的影响。如果 $\theta_0 = 0$ 在这里，我们指的是线性假设函数 $h_{\theta}(x)
    = \theta^T x$。


    ```

    $$\theta_{MAP} = \arg\min_{\theta \in \mathbb{R}^d} \sum_{i=1}^n \frac{(y_i -
    x_i^T\theta)^2}{2\sigma^2} + \frac{\sigma^2}{2\sigma_h^2} \sum_{j=1}^d \theta_j^2$

    ```


