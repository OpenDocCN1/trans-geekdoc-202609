    \ in the components of $w$. In the case of least-squares polynomial regression,\
    \ the predicted value is not a linear function of the input $x$, but it is still\
    \ a linear function of the parameters.\n\nHowever, we may have need for models\
    \ which are nonlinear function of their parameters. We consider a motivating example\
    \ first.\n\n# Noisy Distance Readings\n\nSuppose we want to estimate the 2D position\
    \ $\\theta =(\\theta_1, \\theta_2)$ of some entity, for example a robot. The information\
    \ we have with noisy distance estimates $Y_i \\in \\mathbb{R}$ from sensors whose\
    \ positions $X_i \\in \\mathbb{R}^2$ are fixed and known. If we assume i.i.d.\
