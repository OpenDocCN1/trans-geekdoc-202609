    \n### 7.5 坐标下降\n\n注意 LASSO 目标函数是凸的但由于 L1 范数的“尖锐性”是不可微的。梯度下降技术对于这类问题存在困难。坐标下降是一种解决此类凸问题的替代方案。虽然\
    \ SGD 关注于迭代优化每个*样本*，但坐标下降迭代优化每个*特征*。\n\n**算法1** 坐标下降\n当 $w$ 未收敛：\n  选择一个特征索引 $i$\n\
