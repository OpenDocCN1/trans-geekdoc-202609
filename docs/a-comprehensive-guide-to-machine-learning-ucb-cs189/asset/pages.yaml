- pgno: 111
  md: '+   - The objective function $f_0(x)$


    +   - The inequality constraints: expressions involving $f_i(x)$


    +   - The equality constraints: expressions involving $h_j(x)$


    Working with the constraints can be cumbersome and challenging to manipulate,
    and it would be ideal if we could somehow turn this constrained optimization problem
    into an unconstrained one. One idea is to re-express the optimization problem


    ```

    $$\min_x \mathcal{L}(x) \quad (7.2)$

    ```


    where


    ```

    $$\mathcal{L}(x) = \begin{cases} f_0(x) & f_i(x) \leq 0, \forall i \in [1, m]
    \\text{and } h_j(x) = 0, \forall j \in [1, n] \ \infty & \text{otherwise} \end{cases}$

    ```


    Note that the unconstrained optimization problem above is equivalent to the original
    constrained problem. Even though the unconstrained problem considers values that
    violate the constraints (and therefore are not in the feasible set for the constrained
    optimization problem), it effectively ignore them because they are treated as
    $\infty$ in a minimization problem.


    Even now we are dealing with an unconstrained problem, it is still difficult to
    solve the optimization problem, because we still have to deal with all the casework
    in the objective function $\mathcal{L}(x)$. In order to solve this issue, we have
    to introduce dual variables, specifically one set of dual variables for the equality
    constraints, and one for the inequality constraints. If we only take into account
    the dual variables for the equality constraints, the optimization problem now
    becomes


    ```

    $$\max_x \nu \mathcal{L}(x, \nu) \quad (7.3)$

    ```


    where


    ```

    $$\mathcal{L}(x, \nu) = \begin{cases} f_0(x) + \sum_{j=1}^n \nu_j h_j(x) & f_i(x)
    \leq 0, \forall i \in [1, m] \\ \infty & \text{otherwise} \end{cases}$

    ```


    We are still working with an unconstrained optimization problem, except that we
    are optimizing over two sets of variables: the primal variables $x \in \mathbb{R}^d$
    and the dual variables $\nu \in \mathbb{R}^n$. Also note that the optimization
    problem has now become a nested, with an inner optimization that maximizes over
    the dual variables, an outer optimization that minimizes over the primal variables.
    Let''s examine why this optimization problem is equivalent to the original constrained
    problem:


    +   - Any $x$ that violates the inequality constraints is still treated as $\infty$
    by the outer minimization over $x$ and therefore ignored


    +   - For any $x$ that violates the equality constraints (meaning that $\exists
    j$ s.t. $h_j(x) \neq 0$), the inner maximization problem over $\nu$ can choose
    $\nu_j$ as if $h_j(x) > 0$ (or $\nu$ as $-\infty$ if $h_j(x) < 0$) to cause the
    inner maximization blow off to $\infty$, therefore being ignored by the outer
    minimization over $x$


    +   - For any $x$ that does not violate any of the equality constraints, the inner
    maximization problem over $\nu$ is simply equal to $f_0(x)$'
