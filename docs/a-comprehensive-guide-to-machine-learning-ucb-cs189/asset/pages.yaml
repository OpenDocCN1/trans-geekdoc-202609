    op}\\n= U_x U_x^{\top}\\n= I$$\n```\n\nwhich shows that $W_x$ is a whitening matrix\
    \ for $X$. The same process can be repeated to produce a whitening matrix $W_y\
    \ = U_y S_y^{-1/2}U_y^{\top}$ for $Y$.\n\nLet's denote the whitened $u_w = W_x^{-1}u,\
