    $\nabla_w p_i = \nabla_w s(w^T x_i) = s(w^T x_i)(1-s(w^T x_i))x_i = p_i(1-p_i)x_i$\n\
    ```\n\nPlugging in this gradient value, we have\n\n```\n$\nabla_w L(w) = -\\sum_{i=1}^{n}\
    \ \\left(\\frac{y_i}{p_i} - \\frac{1 - y_i}{1 - p_i}\right) \nabla_w p_i$$\n$$=-\\\
    sum_{i=1}^{n} p_i(1-p_i)x_i$$\n$$=-\\sum_{i=1}^{n} (y_i(1-p_i) - (1-y_i)p_i)x_i$$\n\
    $$=-\\sum_{i=1}^{n} (y_i - p_i)x_i$\n```\n\nWe conclude that the gradient of the\
    \ loss function with respect to the parameters is\n\n```\n$\nabla_w L(w) = -\\\
    sum_{i=1}^{n} (y_i - p_i)x_i = -X^T(y-p)$\n```\n\nwhere $y, p \\in \\mathbb{R}^n$.\
    \ The gradient descent updates us\n\n```\n$w = w - \\epsilon \nabla_w L(w)$\n\
    ```\n\nIt does not matter what values we choose for $w$, because the loss function\
    \ $L(w)$ is convex and does not have local minima. Let's prove this, by first\
    \ finding the Hessian of the loss function. The $k$,th entry of the Hessian is\
    \ the partial derivative of the gradient with respect to $w_k$ and $w_l$.\n\n\
    ```\n$H_{kl} = \\frac{\\partial^2 L(w)}{\\partial w_k \\partial w_l}$$\n$$=\\\
    frac{\\partial}{\\partial w_k} \\sum_{i=1}^{n} (y_i - p_i)x_{il}$$n$$=-\\sum_{i=1}^{n}\
    \ \\frac{\\partial p_i}{\\partial w_k}x_{il}$$n$$=-\\sum_{i=1}^{n} p_i(1-p_i)x_{ik}x_{il}$\n\
    ```"
