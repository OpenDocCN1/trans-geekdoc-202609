    \ appropriate way?\n\nLet's try a familiar technique: least squares. Assume we\
    \ have training data $\\{(x_k, y_k)\\}_{k=1}^{n}$ We aim to solve the optimization\
    \ problem\n\n```\n$$\\min_{a,b,c} \\sum_{k=1}^{n} e_k^2 f(a,b,c)$\n```"
