    $= arg \max_{\mu_k, \sigma_k^2} \sum_{i=1}^{n_k} \frac{(x_i - \mu_k)^2}{2\sigma_k^2}
    - \ln(\sigma_k) - \ln(2\pi)$$

    $$= arg \min_{\mu_k, \sigma_k^2} \frac{(x_i - \mu_k)^2}{2\sigma_k^2} + \ln(\sigma_k)$

    ```


    Note the above objective is not convex, so we cannot simply take derivatives and
    set them to 0! Instead, we decompose the minimization over $\sigma_k^2$ and $\mu_k$
    into a nested optimization problem:


    ```

    $$\min_{\mu_k, \sigma_k^2} \sum_{i=1}^{n_k} \frac{(x_i - \mu_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k) = \min_{\sigma_k^2} \sum_{i=1}^{n_k} \frac{(x_i - \mu_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k)$

    ```


    The optimization problem has been decomposed into an inner problem for $\mu_k$
    given a fixed $\sigma_k^2$, and an outer problem for $\sigma_k$ given the optimal
    value $\hat{\mu}_k$. Let''s first solve the inner problem. Given a fixed $\sigma_k^2$,
    the objective is convex in $\mu_k$, so we can take a partial derivative w.r.t
    $\mu_k$ and set it to 0:


    ```

    $$\frac{\partial}{\\mu_k} \sum_{i=1}^{n_k} \frac{(x_i - \mu_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k) = \sum_{i=1}^{n_k} \frac{-(x_i - \mu_k)}{\sigma_k^2} = 0 \Rightarrow
    \hat{\mu}_k = \frac{1}{n_k} \sum x_i$

    ```


    Having solved the inner problem, we have


    ```

    $$\min_{\sigma_k^2} \sum_{i=1}^{n_k} \frac{(x_i - \hat{\mu}_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k) = \min_{\sigma_k^2} \sum_{i=1}^{n_k} \frac{(x_i - \hat{\mu}_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k)$

    ```


    Note that this objective is not convex in $\sigma_k$, so we must not find the
    critical point of the objective matches the objective. Assuming that $\sigma_k
    \geq 0$, the critical points are:


    +   - $\sigma_k = 0$: assuming that all the points $x_i$ are equal to $\hat{\mu}_k$,
    there are two terms that are at odds with each other: a $1/\sigma_k^2$ term that
    blows off to $\infty$, and a $\ln(\sigma_k)$ term that blows off to $-\infty$
    as $\sigma_k \rightarrow 0$. Note that the $1/\sigma_k^2$ term blows off at a
    faster rate, so we could

    - $\sigma_k = \infty$: this case does not lead to the solution, because it gives
    a maximum, not a minimum.

    - Points at which the derivative w.r.t $\sigma$ is 0


    ```

    $$\lim_{\sigma_k \rightarrow 0} \sum_{i=1}^{n_k} \frac{(x_i - \hat{\\mu}_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k) = \infty$$


    $$$\frac{\\partial}{\partial\sigma} \sum_{i=1}^{n_k} \frac{(x_i - \hat{\\mu}_k)^2}{2\sigma_k^2}
    + \ln(\sigma_k) = \sum_{i=1}^{n_k} \frac{(x_i - \hat{\\mu}_k)^2}{2\sigma_k^2}
    + \frac{1}{\sigma_k} = 0 \Rightarrow \sigma_k^2 = \frac{1}{n_k} \sum_{i=1}^{n_k}
    (x_i - \hat{\\mu}_k)^2$$

    ```


    We conclude that the optimal points is


    ```

    $$\sigma_k^2 = \frac{1}{n_k} \sum_{i=1}^{n_k} (x_i - \hat{\mumu}_k)^2$

    ```'
