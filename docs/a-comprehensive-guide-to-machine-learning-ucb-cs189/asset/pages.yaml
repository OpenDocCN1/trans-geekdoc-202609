  md: '# # Chapter 6


    # # Classification


    # ##6.1 Classification


    The task of **classification** differs from **regression** in that we are now
    interested in assigning a $d$-dimensional data point of a *discrete* number of
    **classes** instead of assigning it a *continuous* value. Thus, the task is simpler
    in that there are fewer choices of labels per data point but more complicated
    in that we now need somehow factor in information about each class to obtain the
    classifier that we need.


    Here''s a formal definition: Given a training set $\mathcal{D} = \{(\mathbf{x}_i,
    t_i)\i=1}^n$ of $n$ points, with each data point $\mathbf{x}_i \in \mathbb{R}^d$
    paired with a known discrete class label $t_i \in \{1,2,...,K\}$, a classifier
    which, when fed any arbitrary $d$-dimensional data point, classifies as one of
    the $K$ discrete classes.


    Classifiers have strong roots in probabilistic modeling. The idea is that given
    any arbitrary datapoint $\mathbf{x}$, we classify $\mathbf{x}$ with the class
    label $k^*$ that maximizes the posterior probability of the class label given
    the data point:


    ```

    $k^* = \arg\max_k P(class = k|\mathbf{x})$

    ```


    Consider the example of digit classification. Suppose we are given images of handwritten
    digits with known values in the range $[0,1,...,9]$. The task is, given an image
    of a handwritten digit, to classify it to the correct digit. A generic classifier
    for this task would effectively perform a posterior probability distribution over
    the 10 possible digits and choose the digit that achieves the maximum posterior
    probability:


    ```

    $k^* = \arg\max_{k\in\{0,1,...,9\}} P(digit = k|image)$

    ```


    There are two main types of models that can be used to train classifiers: **generative
    models** and **discriminative models**.


    # ##6.2 Generative Models


    Generative models involve implicitly forming:


    +   1. A prior probability distribution over all classes $k \in \{1,2,...,K\}$


    ```

    $P(k) = P(class = k)$

    ```'
