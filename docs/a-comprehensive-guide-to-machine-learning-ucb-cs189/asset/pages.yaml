    #  SVMs vs Tikhonov Regularization Learning


    Consider the following regularized regression problem:


    ```

    $$\min \frac{1}{n} \sum L(y_i, w^T x_i - b) + \lambda\|w\|^2$$

    ```


    In the context of classification, the function that we would like to optimize
    is 0-1 step loss:


    ```

    $L_{step}(y, w^T x - b) = \begin{cases} 1 & y(w^T x - b) < 0 \ 0 & y(w^T x - b)
    \geq 0 \end{cases}$

    ```


    The 0-1 loss is 0 if $x$ is correctly classified and 1 otherwise. Thus minimizing
    $\frac{1}{n} \sum L(y_i, w^T x_i - b)$ directly minimizes classification error
    on the training set. However, the 0-1 loss is difficult to optimize: it is neither
    convex nor differentiable (see Figure 8.1).


    ![](img/99defe26aebed215976e83d281581f33_107_0.png)


    Figure 6.12: Step (0-1) loss, hinge loss, and squared loss. Square loss is convex
    and, hinge loss is neither convex, and step loss is neither.


    We can try to modify the 0-1 loss to be convex. The points with $y(w^T x - b)
    \geq 0$ should remain at 0 loss, but we might use the **hinge loss**, for misclassified
    points. as illustrated in Figure 8.1.


    ```

    $L_{hinge}(y, w^T x + b) = \max(1 - y(w^T x - b), 0)$

    ```


    Thus the regular regression problem becomes


    ```

    $$\min_{w,b} \frac{1}{n} \sum \max(1 - y_i(w^T x_i - b), 0) + \lambda\|w\|^2$$

    ```


    Recall that original soft-margin SVM optimization problem is


    ```

    $$\min_{w,b,\xi} \frac{1}{2}\|w\|^2 + C \sum_{i=1}^n \xi_i$$

    \text{s.t.} \quad y_i(w^T x_i - b) \geq 1 - \xi_i \quad \forall$$

    \xi_i \geq 0 \quad \forall$$

    ```'
