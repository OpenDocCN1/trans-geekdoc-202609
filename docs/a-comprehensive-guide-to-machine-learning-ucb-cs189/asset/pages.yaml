    it falls short due to numerical instability and generalization issues. Numerical
    instability arises when the features of the data are close to collinear (leading
    to linearly dependent feature columns), causing the input


    > $1$ This result is often stated as part of the Fundamental Theorem of Linear
    Algebra.'
