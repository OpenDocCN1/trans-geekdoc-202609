  md: "# 3.2. PRINCIPAL COMPONENT ANALYSIS\n\nthen the eigenvector equations can be\
    \ simultaneously written as\n\n$MV = V\\Lambda$$\n\nwhere\n\n$$\\Lambda = diag(\\\
    lambda_1, \\dots, \\lambda_d) = V^\top$$\n\nThen $V$ is an orthogonal matrix,\
    \ it is invertible with $V^{-1} = V^\top$, so\n\n$V^\top MV = \\Lambda$$\n\nLet\
    \ $u$ be a unit length vector. Since $\\{v_j\\}$ form a basis, we can write\n\n\
    $$u = \\sum_{j=1}^d \\alpha_j v_j = V\\alpha$$\n\nThen $V$ is an orthogonal matrix.\
    \ $|u| = 1$ is as well. Now\n\n$$R(u;M) = \\frac{u^\top Mu}{u^\top u} = \\alpha^\t\
    op MV\\alpha = \\alpha^\top \\Lambda\\alpha = \\sum_{j=1}^d \\lambda_j \\alpha_j^2$$\n\
    \nSince we have the constraint $\\alpha_1^2 + \\dots + \\alpha_d^2=1$, the largest\
    \ expression is a weighted average of the eigenvalues and hence bounded by the\
    \ smallest and largest of these:\n\n$$\\lambda_d \\le R(u;M) \\le \\lambda_1$$\n\
    \nThe lower bound is achieved by putting $\\alpha_1=\\pm1, \\alpha_{j\\neq 1}=0$.\
    \ The maximizing value can then be recovered by\n\n$$\\sum_{j=1}^d \\alpha_j v_j\
    \ = \\pm v_1$$\n\nThat is, it is an eigenvector corresponding to the largest eigenvalue:\
    \ Hence\n\n$$\\lambda_d = R(v_d;M) \\le R(v_1;M) \\le \\lambda_1$$\n\nFinally\
    \ note that the Rayleigh quotient is scale invariant, i.e. $R(\\gamma u;M) = R(u;M)$\
    \ for any $\\gamma \\neq 0$, the inequality holds for all scaling of the vectors,\
    \ not unit-length vectors.\n\n# Calculating the first principal component\n\n\
    Armed with our knowledge of Rayleigh quotients, the solution to the PCA problem\
    \ is immediate:\n\n$$\\max_{\\|u\\|=1} PCA.var(u) = \\max_{u\\neq 0} \\frac{u^\t\
    op X u}{u^\top u} = \\lambda_1(X^\top X)$$$\n\nwhere the maximizer $u^*$ is a\
    \ unit eigenvector corresponding to this eigenvalue. Writing $X=U\\Sigma V^\t\
    op$,\n\n$$X^\top X = V\\Sigma^\top U^\top U\\Sigma V^\top = V\\Sigma^2 V^\top$$\n\
    \nThe expression on the right is an eigendecomposition of $X^\top$, so\n\n$$\\\
    lambda_1(X^\top X) = [\\Sigma^2]_{11} = \\sigma_1^2(X)$$\n\nwith corresponding\
    \ eigenvector $\\mathbf{v}_1$, which is the first principal component."
