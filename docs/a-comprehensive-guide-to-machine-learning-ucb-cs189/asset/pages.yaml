    # 2. In which direction to pool?


    (a) Spatial pooling values within the same channel. This has the capability of
    introducing translational invariance to your model.


    ![](img/99defe26aebed215976e83d281581f33_142_0.png)


    9.4: Here, the input layer of the right image is a translated version of the input
    layer of the left image, but because of max-pooling, the next layer looks more
    or less the same.


    (b) Cross-channel pooling values across different channels. This has the capability
    of introducing translational invariance to your model.


    ![](img/99defe26aebed215976e83d281581f33_142_1.png)


    9.5c: Here, we have an example where our convolutional layer is represented by
    3 kernels. Suppose they were good for detecting the number 5 in some degree of
    rotation. If we pooled across the three channels determined by these kernels,
    then no matter what orientation of the number "5" we got as input to our ConvNet,
    the pooling layer would have a large response!


    +   3. "Lossness" of pooling. This is determined by the stride of the pooling
    window. If you stride by a large amount, you potentially lose more information,
    but you conserve memory.


    If you now look back at the picture of the ConvNet near the beginning of this
    text, you should have a better idea of what each layer is doing. The ConvNet in
