  md: '# 7.1. DUALITY


    This solution comes at a cost - in an effort to remove the equality constraints,
    we had to add dual variables, for each inequality constraint. With this in mind,
    let''s try to do the same for the inequality constraints. Adding dual $\lambda_i$
    to represent each inequality constraint, we now have


    ```

    $\min_{x} \mathcal{L}(x, \lambda, \nu) = f_0(x) + \sum_{i=1}^{m} \lambda_i f_i(x)
    + \sum_{j=1}^{n} \nu_j h_j(x)\n\text{s.t.} \quad \lambda_i \ge 0 \quad i=1, \dots,
    m \quad (7.4)$

    ```


    For convenience, we can place the constraints involving $\lambda$ into the optimization
    variable.


    ```

    $\max_{x} \mathcal{L}(x, \lambda, \nu) = f_0(x) + \sum_{i=1}^{m} \lambda_i f_i(x)
    + \sum_{j=1}^{n} \nu_j h_j(x)$

    ```


    This optimization problem is otherwise known as the **primal** (not to be confused
    with the dual variables), and its optimal value is indeed equivalent to that of
    the original constrained optimization problem.


    ```

    $p^* = \max_{\lambda\ge0, \nu} \mathcal{L}(x, \lambda, \nu)$

    ```


    We can verify that this is indeed the case:


    +   * For any $x$ that violates the inequality constraints (meaning $\exists i
    \in [1, m]$ $f_i(x) > 0$), the inner maximization problem over $\lambda$ can choose
    $\lambda$ as $\infty$ to cause the inner maximization blow off to $\infty$, therefore
    ignored by the outer minimization over $x$

    * For any $x$ that violates the equality constraints (meaning $\exists j$ s.t.
    $h_j(x) \neq 0$), the inner maximization problem over $\nu$ can choose $\nu$ as
    $\infty$ if $h_j(x) > 0$ (or if $h_j(x) < 0$) to cause the inner maximization
    blow off to $\infty$, therefore ignored by the outer minimization over x

    * For any $x$ that does not violate any of the equality constraints, in the inner
    maximization problem over $\nu$, the expression $\sum_{j=1}^{n} \nu_j h_j(x)$
    can be at maximum at 0, because $\lambda_i$ is constrained to be non-negative,
    and $f_i(x)$ is non-positive. Therefore, at best, the maximization problem sets
    $\lambda_i f_i(x) = 0$, and


    ```

    $\max_{\lambda} \mathcal{L}(x, \lambda, \nu) = f_0(x)$

    ```


    In full form, the objective $\mathcal{L}(x, \lambda, \nu)$ is called the **Lagrangian**,
    and it takes into account the unconstrained set of primal variables $x \in \mathbb{R}^d$,
    the constrained set of dual variables $\lambda \in \mathbb{R}^m$ corresponding
    to the inequality constraints, and the unconstrained set of dual variables $\nu
    \in \mathbb{R}^m$ corresponding to the equality constraints. Note that our dual
    variables $\lambda_i$ are in fact constrained, so ultimately we were not able
    to turn the original optimization problem into an unconstrained one, but ours
    are much simpler than before.


    The **dual** of this optimization problem is still over the same optimization
    objective, except we now swap the maximization of the dual variables and the minimization
    of the primal variables.


    ```

    $d^* = \max_{\lambda\ge0, x} \mathcal{L}(x, \lambda, \nu) = \max_{\lambda\ge0,
    \nu} g(\lambda, \nu)$

    ```


    The dual is effectively a maximization problem (over the dual variables):


    ```

    $max_{\lambda\ge0} g(\lambda, \nu)$

    ```'
