    # # Duality, Neareset Neighbors, Sparsity


    # ## 7.1 Duality


    Previously, in our investigation of SVMs, we formulated a constrained optimization
    problem that we can solve to find the optimal parameters for our hyperplane decision
    boundary. Recall the setup of soft-margin SVMs:


    +   * $y_i$:s: $\pm 1$, representing positive or negative class

    * $x_i$:s: feature vectors in $\mathbb{R}^d$

    * $\xi_i$:s: slack variables representing how much an $x_i$ is allowed to violate
    the margin

    * $C$: a hyperparameter describing how we penalize slack

    * The optimization problem for $w \in \mathbb{R}^d$ and $\xi \in \mathbb{R}$,
    the parameters of the SVM:


    ```

    $$\begin{aligned} \min_{w, \xi} & & \frac{1}{2}||w||^2 + C\sum_{t=1}^n \xi_t \
    \text{s.t.} & & y_i(w^t x_i - t) \geq 1 - \xi_i &\forall i \ \xi_i & \geq 0 &\forall
    i \end{aligned}$$

    ```


    Now, we will investigate the dual of this problem, which will motivate our discussion
    of kernels. Before we do, we first have to understand the primal and dual of an
    optimization problem.


    # ## Primal and Dual of an Optimization Problem


    All optimization problems and be expressed in the standard form


    ```

    $$\begin{aligned} \min & f_0(x) \\text{s.t.} & f_i(x) \leq 0 & i = 1, \dots, m
    \ & h_j(x) = 0 & j = 1, \dots, n \end{aligned}$$$ $(7.1)$

    ```


    For the purposes of our discussion, assume that $x \in \mathbb{R}^d$. The main
    components of an optimization problem are:'
