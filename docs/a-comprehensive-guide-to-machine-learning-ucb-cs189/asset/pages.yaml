    = \sqrt{e_m(1-e_m)}$

    ```


    These two quantities are the same once we have adjusted our $\alpha$, so the misclassified
    and correctly classified sets both get equal total weight.


    This observation has an interesting practical implication. Even after the training
    error goes to zero, the AdaBoost test error may continue to decrease. This may
    be counter-intuitive, as one would expect the classifier to be overfitting to
    the training data at this point. One interpretation for this phenomenon is that
    even though the boosted classifier has achieved perfect training error, it is
    still refining its fit in a max-margin fashion, which increases its generalization
    capabilities.'
