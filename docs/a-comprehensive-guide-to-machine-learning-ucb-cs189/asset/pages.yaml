  md: "# CHAPTER 4. GRADIENT DESCENT, NEWTON'S METHOD\n\nNote that we have used the\
    \ Jacobian of the linearized function $\\hat{F}$, evaluated at $\theta$, is precisely\
    \ $J(\theta^{(k)})$. This is because $\\hat{F}$ is affine when the linear map\
    \ is $J(\theta^{(k)})$, so the best linear approximation is just that.\n\nWriting\
    \ $J = J(\theta^{(k)})$ for brevity, we have\n\n```\n$J^T Y = J^T F(\theta^{(k)})\
    \ + J^T \\Delta Y$$\n$$J^T(Y - F(\theta^{(k)})) = J^T \\Delta Y$$\n$$\\Delta\t\
    heta = (J^T J)^{-1}(Y - F(\theta^{(k)}))$$\n$$(J^T J)^{-1}\\Delta Y$\n```\n\n\
    where $\\Delta Y := Y - F(\theta^{(k)})$. By comparing this solution to OLS, we\
    \ see that it is effectively solving\n\n```\n$\\Delta\\theta = \\arg \\min_{\\\
    theta} ||\\J\\theta - \\Delta Y||^2$\n```\n\nSince $\\hat{F} \\approx J\\Delta\t\
    heta$ over $\theta^{(k)}$, this is saying that we choose a change to the weights\
    \ that corrects the current error in the function values, but it is this calculation\
    \ on the linearization of $F$. Recalling that $\\Delta\theta = \theta - \theta^{(k)}$,\
    \ we can improve our current guess $\theta^{(k)}$ with the update\n\n```\n$\\\
    theta^{(k+1)} = \\theta^{(k)} + \\Delta\\theta$$\n$\\theta^{(k+1)} = \\theta^{(k)}\
    \ + (J^T J)^{-1}J^T \\Delta Y$\n```\n\nHere's the entire process laid out in steps:\n\
    \n+   Initialize $\theta^{(0)}$ with some guess\nRepeat until convergence:\n \
    \ (a) Compute Jacobian with respect to the current iterate, $J = J(\theta^{(k)})$\n\
    \  (b) Compute $\\Delta Y = Y - F(\theta^{(k)})$\n  (c) Update: $\theta^{(k+1)}\
    \ = \theta^{(k)} + (J^T J)^{-1}\\Delta Y$\n\nNote that the solution found will\
    \ depend on the initial value $\theta^{(0)}$ in general. Some choices include\
    \ testing changes in the objective value:\n\n```\n$|\\frac{\\theta^{(k+1)} - \\\
    theta^{(k)}}{\\theta^{(k)}}| \\lele$ threshold\n```\n\nor in the iterates themselves:\n\
    \n```\n$max |\\frac{\\Delta\\theta_j}{\\theta^{(k)}}| \\le$ threshold\n```\n\n\
    # 4.2 Gradient Descent\n\nGradient descent is an iterative algorithm for finding\
    \ local minima of differentiable functions. For an analogy, imagine walking downhill\
    \ surrounded by a thick fog that prevents you from seeing the height of the land\
    \ around you, other than being able to tell which direction is steepest."
