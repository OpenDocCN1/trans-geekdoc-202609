    xi)\\leq0}$$\n```\n\nLet's identify the primal and dual variables for the SVM\
    \ problem. We will have\n\n+   - Primal variables $w, t$, and $\\xi_i$\n- Dual\
    \ variables $\\alpha_i$ corresponding to each constraint of the form $y_i(w^T\
    \ x_i - t) \\geq 1 - \\xi_i$\n- Dual variables $\beta_i$ corresponding to each\
    \ constraint of the form $\\xi_i \\geq 0$\n\nFor the purposes of notation, note\
    \ that we are using $\\alpha$ and $\beta$ in place of $\\lambda$, and there are\
    \ no dual variables corresponding to $\nu$ because there are no equality constraints.\
    \ The lagrangian for the SVM problem is\n\n```\n$$\\mathcal{L}(w,t,\\xi,\\alpha,\\\
    beta) = \\frac{1}{2}||w||^2 + \\sum_{i=1}^{n} \\xi_i + \\sum_{i=1}^{n} \\alpha_i(1-\\\
    xi_i) - y_i(w^T x_i - t) + \\sum_{i=1}^{n} \\beta_i(-\\xi_i) \\quad (7.7)$$\n\
    ```\n\n```\n$$\\frac{1}{2}||w||^2 - \\sum_{i=1}^{n} \\alpha_i(w^T x_i - t) + \\\
    sum_{i=1}^{n} \\alpha_i + \\sum_{i=1}^{n} (C - \\alpha_i - \\beta_i)\\xi_i$$\n\
    ```\n\nThus, the dual is:\n\n```\n$$\\max_{\\alpha,\\beta\\geq 0} = \\min_{w,t,\\\
    xi} \\frac{1}{2}||w||^2 - \\sum_{i=1}^{n} \\alpha_i(w^T x_i - t) + \\sum_{i=1}^{n}\
    \ \\alpha_i + \\sum_{i=1}^{n} (C - \\alpha_i - \\beta_i)\\xi_i \\quad (7.8)$$\n\
    ```\n\nLet's use the KKT conditions to find the optimal dual variables. Verify\
    \ that the primal is convex. We know that from the stationarity conditions, evaluated\
    \ at the optimal values $w^*, t^*, \\xi^*$,\n\n```\n$$\\frac{\\partial \\mathcal{L}}{\\\
    partial w} = \\frac{\\partial \\mathcal{L}}{\\partial t} = 0$$\n```\n\n+   - $\\\
    frac{\\partial \\mathcal{L}}{\\partial w} = w - \\sum_{i=1}^{n} \\alpha_i x_i\
    \ = 0 \\Rightarrow w^* = \\sum_{i=1}^{n} \\alpha_i x_i$. This tells us that $w^*$\
    \ is going to be the weighted combination of the positive-class $x_i^*$ and negative-class\
    \ $x_i^*$.\n- $\\frac{\\partial \\mathcal{L}}{\\partial t} = \\sum_{i=1}^{n} \\\
    alpha_i = 0$. This tells us that the weights $\\alpha_i^*$ will be equally distributed\
    \ among positive- and negative training points.\n- $\\frac{\\partial \\mathcal{L}}{\\\
    partial \\xi_i} = C - \\alpha_i - \\beta_i = 0 \\Rightarrow 0 \\leq \\alpha_i^*\
