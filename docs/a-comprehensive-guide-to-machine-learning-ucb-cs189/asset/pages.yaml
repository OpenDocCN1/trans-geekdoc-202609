- pgno: 62
  md: '# 3.4. DIMENSIONALITY REDUCTION


    # Nonlinear Methods


    Linear methods such as PCA are not well-suited to capture intrinsic geometric
    structure in data. There are several approaches to solving this problem:


    +   - Kernel methods: it is possible to derive a kernelized version of PCA, for
    example.

    - Manifold learning: an $n$-manifold$^5$ is a surface that locally resembles $n$-dimensional
    Euclidean space. For example, the Swiss roll is a 2-manifold embedded in 3-dimensional
    space. In manifold learning, we learn a mapping from data to a low-dimensional
    manifold - for example, a mapping from Swiss roll to 2-dimensional plane.


    # Isometric Feature Mapping (IsoMap)


    IsoMap performs MDS on the geodesic distances between points, as follows:


    +   (1) Construct a local neighborhood graph by connecting each point with its
    $k$ nearest neighbors.

    (2) Compute all-pairs shortest path distances (these are the geodesic distances).

    (3) Apply MDS on geodesic distances.


    If we apply IsoMap to the Swiss roll, we see that while the Euclidean distance
    between the red and blue regions is low, the geodesic distance is high - the geodesic
    distance between points represents how far we would have to go if we were walking
    on the Swiss roll manifold in 2 dimensions.


    IsoMap has been used effectively for dimensionality reduction in facial data.


    Next time: Laplacian Eigenmaps, t-SNE.


    > $5$For the mathematically inclined, a manifold is a second-countable Hausdorff
    topological space such that each point has a neighborhood homeomorphic to a neighborhood
    in Euclidean space. Most machine learning researchers do not care for these definitions
    and will call almost anything a manifold.'
