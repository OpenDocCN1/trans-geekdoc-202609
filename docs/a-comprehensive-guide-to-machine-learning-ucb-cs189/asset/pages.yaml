  md: '# CHAPTER 1. REGRESSION, VALIDATION


    ![](img/99defe26aebed215976e83d281581f33_7_0.png)


    In the OLS case,


    $$\mathbf{w}^*_{OLS} = \arg \min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2$


    But observe that the set of vectors that can be written $\mathbf{X}\mathbf{w}$
    for some $\mathbf{w} \in \mathbb{R}^d$ is precisely the range of $\mathbf{X}$,
    which we know to be a subspace of $\mathbb{R}^n$, so


    $$\min_{\mathbf{z} \in \text{range}(\mathbf{X})} ||\mathbf{z} - \mathbf{y}||_2^2
    = \min_{\mathbf{w}} ||\mathbf{X}\mathbf{w} - \mathbf{y}||_2^2$


    By pattern matching with the earlier optimality statement about $P_{\mathbf{X}}$,
    we observe that $P_{range(\mathbf{X})}(\mathbf{y}) = \mathbf{X}\mathbf{w}^*_{OLS}$,
    where $\mathbf{w}^*_{OLS}$ is any optimum for the right-hand side. The projected
    point $\mathbf{X}\mathbf{w}^*_{OLS}$ is always unique, but if $\mathbf{X}$ is
    full rank (assuming $n \geq d$), then the optimum $\mathbf{w}^*_{OLS}$ is also
    unique (expected). This is because $\mathbf{X}$ being full rank means that the
    columns of $\mathbf{X}$ are linearly independent, in which case there is a one-to-one
    correspondence between $\mathbf{w}$ and $\mathbf{X}\mathbf{w}$.


    To solve for $\mathbf{w}^*_{OLS}$, we need the following fact$^1$:


    $$\text{null}(\mathbf{X}^T) = \text{range}(\mathbf{X})\perp$


    Since we are projecting onto range($\mathbf{X}$), the orthogonality condition
    for optimality is that $\mathbf{y} - P_{\mathbf{X}}\mathbf{y} \perp \text{range}(\mathbf{X})$,
    i.e. $\mathbf{y} - \mathbf{X}\mathbf{w}^*_{OLS} \in \text{null}(\mathbf{X}^T)$.
    This leads to the equation


    $$\mathbf{y}^T(\mathbf{y} - \mathbf{X}\mathbf{w}^*_{OLS}) = 0$


    which is equivalent to


    $$\mathbf{X}^T\mathbf{X}\mathbf{w}^*_{OLS} = \mathbf{X}^T\mathbf{y$


    as before.


