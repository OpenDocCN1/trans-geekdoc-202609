    ilde{x}, \\lambda, \tilde{\nu})$\n\nWe therefore know that\n\n$p^* = \\min_{\t\
    ilde{x} \\geq 0} \\mathcal{L}(\tilde{x}, \\lambda, \tilde{\nu}) \\geq \\max_{\\\
    lambda \\geq 0} \\mathcal{L}(x, \\lambda, \nu) = d^*$\n\nThe difference $p^* -\
    \ d^*$ is known as the duality gap. In the case of **strong duality**, the duality\
    \ gap is 0. That is, we can swap the order of the minimization and maximization\
    \ and up with the optimal value:\n\n$p^* = d^*$ (7.6)\n\nThere are several theoretical\
    \ details proving the existence of strong duality, such as **Slater's theorem**,\
    \ which states that if the primal problem is convex, and there exists an $x$ that\
    \ *strictly* meet the inequality constraints and meet the equality constraints,\
    \ then strong duality holds. Given the **Karush-Kuhn-Tucker (KKT) conditions**\
    \ can help us find the solutions to the dual variables of the optimization problem.\
    \ The KKT conditions are composed of:\n\n+   1. Primal feasibility (inequalities)\
    \ $f_i(x) \\leq 0, \\forall i \\in [1, m]$\n\n+   2. Primal feasibility (equations)\
    \ $h_j(x) = 0, \\forall j \\in [1, n]$"
