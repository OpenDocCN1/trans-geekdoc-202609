  md: "# Chapter 4\n\n# Gradient Descent, Newton’s Method\n\n# 4.1 Nonlinear Least\
    \ Squares\n\nAll models we've seen so far are **linear** in the parameters we're\
    \ trying to learn. That is, our prediction $\\hat{y} = f(x; \\theta)$ is some\
    \ linear function of the parameters $\theta$. For example, in OLS, $\theta = w$\
    \ and the residuals $r_i$ are computed by $y_i - w^T x_i$, which is linear in\
    \ the components of $w$. In the case of least-squares polynomial regression, the\
    \ predicted value is not a linear function of the input $x$, but it is still a\
    \ linear function of the parameters.\n\nHowever, we may have need for models which\
    \ are nonlinear function of their parameters. We consider a motivating example\
    \ first.\n\n# Noisy Distance Readings\n\nSuppose we want to estimate the 2D position\
    \ $\\theta =(\\theta_1, \\theta_2)$ of some entity, for example a robot. The information\
    \ we have with noisy distance estimates $Y_i \\in \\mathbb{R}$ from sensors whose\
    \ positions $X_i \\in \\mathbb{R}^2$ are fixed and known. If we assume i.i.d.\
    \ Gaussian noise as usual, our statistical model has the form\n\n```\n$Y_i = ||X_i\
    \ - \\theta|| + N_i, \\quad N_i \\overset{iid}{\\sim} \\mathcal{N}(0, \\sigma^2),\
    \ \\quad i=1, \\dots, m$\n```\n\nwhere\n\n```\n$||X_i - \\theta|| = \\sqrt{(X_{i1}\
    \ - \\theta_1)^2 + (X_{i2} - \\theta_2)^2}$\n```\n\nHere our prediction is\n\n\
    ```\n$$\\hat{y} = f(x; \\theta) = ||x - \\theta||$\n```\n\nwhich is clearly not\
    \ linear in $\\theta$.\n\n# Formulation from MLE\n\nMore generally, let us assume\
    \ a model similar to the one above, but where $f$ is now arbitrary differentiable\
    \ function and $\\theta \\in \\mathbb{R}^d$;\n\n```\n$Y_i = f(X_i; \\theta) +\
    \ N_i, \\quad N_i \\overset{iid}{\\sim} \\mathcal{N}(0, \\sigma^2), \\quad i=1,\
    \ \\dots, m$\n```\n\nNote that this implies $Y_i | X_i \\sim \\mathcal{N}(f(X_i;\
    \ \\theta), \\sigma^2)$."
