    \n# 2.4 Multivariate Gaussians\n\nThere are three equivalent definitions of a\
    \ jointly Gaussian (JG) random vector:\n\n+   1. A random vector $\\mathbf{Z}\
    \ = (Z_1, Z_2, \\dots, Z_k)^T$ is JG if there exists a base random vector $\\\
    mathbf{U} = (U_1, U_2, \\dots, U_l)$ whose components are independent standard\
    \ normal random variables, a transition matrix $\\mathbf{R} \\in \\mathbb{R}^{k\
    \ \times l}$, and a mean $\\mu \\in \\mathbb{R}^k$, such that $\\mathbf{Z} = \\\
    mathbf{RU} + \\mu$.\n\n+   2. A random vector $\\mathbf{Z} = (Z_1, Z_2, \\dots,\
    \ Z_k)^T$ is JG if $\\sum_{i=1}^k a_i Z_i$ is normally distributed for every $a\
    \ = (a_1, a_2, \\dots, a_k)^T$. A random vector $\\mathbf{Z} = \\mathbf{RU} +\
    \ \\mu$ is\n\n+   3. (Non-degenerate case only) $\\mathbf{Z} = (Z_1, Z_2, \\dots,\
    \ Z_k)^T$ is JG if\n\n> $f_{\\mathbf{Z}}(\\mathbf{z}) = \\frac{1}{\\sqrt{(2\\\
    pi)^k\\det(\\boldsymbol{\\Sigma})}} e^{-\\frac{1}{2}(\\mathbf{z}-\\mu)^T\\boldsymbol{\\\
    Sigma}^{-1}(\\mathbf{z}-\\mu)}$\n\nWhere $\boldsymbol{\\Sigma} = \\mathbb{E}[(\\\
    mathbf{Z}-\\mu)(\\mathbf{Z}-\\mu)^T] = \\mathbb{E}[(\\mathbf{RU})(\\mathbf{RU})^T]\
    \ = \\mathbf{RE}[\\mathbf{UU}^T]\\mathbf{R}^T = \\mathbf{R}\\mathbf{R}^T$; $\b\
