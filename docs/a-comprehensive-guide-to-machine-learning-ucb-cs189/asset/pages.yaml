  md: "# 2.6. MAP WITH COLORED NOISE\n\nAs before, we can scale the data to morph\
    \ the problem into an MLE problem with i.i.d noise variables, by premultiplying\
    \ the data matrix **X** and the observation vector **y** by $R_Z^{-1}$\n\nIn a\
    \ very similar fashion to the independent noise problem, the MLE of the scaled\
    \ dependent noise problem is $\\mathbf{w}^* = (\\mathbf{X}^\top\\mathbf{\\Sigma}_Z^{-1}\\\
    mathbf{X})^{-1}\\mathbf{X}^\top\\mathbf{\\Sigma}_Z^{-1}\\mathbf{y}$.\n\n# 2.6\
    \ MAP with Colored Noise\n\nIn the ordinary squares (OLS) statistical model, we\
    \ assume that the output $Y$ is a linear function of the input, plus Gaussian\
    \ noise. We take this step further in **maximum a posteriori** (MAP) estimation,\
    \ where we assume that the weights are a random variable. The new statistical\
    \ model is\n\n```\n**\\mathbf{Y} = \\mathbf{W} + \\mathbf{Z}**\n```\n\nwhere **Y**\
    \ and **Z** are $n$-dimensional random vectors, and **W** is a $d$-dimensional\
    \ random variable, and **X** is a fixed $n \times d$ matrix. Note that random\
    \ vectors are not notationally distinguished from matrices here, so keep in mind\
    \ what each symbol represents.\n\nWe have seen that ridge regression can be derived\
    \ by assuming a prior distribution on **W** in which $W_i$ are i.i.d. (univariate)\
    \ Gaussian, or equivalently,\n\n```\n**\\mathbf{W} \\sim \\mathcal{N}(0, I)****\n\
    ```\n\nBut more generally, we can allow **W** to be any multivariate Gaussian:\n\
    \n```\n**\\mathbf{W} \\sim \\mathcal{N}(\\mathbf{\\mu}_W, \\mathbf{\\Sigma}_W)****\n\
    ```\n\nRecall that we can rewrite a multivariate Gaussian as an affine transformation\
