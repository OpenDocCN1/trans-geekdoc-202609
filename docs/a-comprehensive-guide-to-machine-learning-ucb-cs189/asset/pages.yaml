  md: '# 5.2. TRAINING NEURAL NETWORKS


    That is to say:


    ```

    \frac{\partial L}{\partial a} = \sum_{i} \text{upstream\_terms}_i \cdot \frac{\partial
    O_i}{\partial a}

    ```


    # Backpropagation


    A naive way of calculating the gradients might be to differentiate the loss with
    respect to each parameter we''re interested in updating, one at a time. However,
    because the later layers of a neural net are just functions of the earlier layers,
    doing this would be wasteful. We can see this by taking a look at the derivatives
    of $L$ with respect to $v_1, a,$ and $w_1$ in our example:


    ```

    \frac{\partial L}{\partial v_1} = \frac{\partial L}{\partial O_1}\frac{\partial
    O_1}{\partial v_1}

    \frac{\partial L}{\partial a} = \frac{\partial L}{\partial O_1}\frac{\partial
    O_1}{\partial a} + \frac{\partial L}{\partial O_2}\frac{\partial O_2}{\partial
    a}\n\frac{\partial L}{\partial w_1} = \frac{\partial L}{\partial O_1}\frac{\partial
    O_1}{\partial w_1} + \frac{\partial L}{\partial O_2}\frac{\partial O_2}{\partial
    w_1}

    ```


    You should note that by invoking the chain rule, we see that the term $\frac{\partial
    L}{\partial O_1}$ is common to all derivatives, and the term $\frac{\partial O_1}{\partial
    a}$ is common to the second to. This suggests that we should considerにつき the results
    of the derivatives of weights in the later layers and reuse them in our computation
    of the derivatives of weights of earlier layers: a dynamic programming approach.


    The following is a general outline of how backpropagation might be implemented.
    Keep in mind that the specifics, especially those pertaining to the structure
    of each successive layer, will depend heavily on the architecture of the neural
    net in.


    +   1. The forward pass: populate each unit of the neural net with the value it''s
    supposed to have (i.e., invoke your dot-products and ReLUs).

    2. Start at the upstream end, these are the outputs. Compute the gradient of the
    loss function with respect to the inputs (these are just numbers), maybe/cache
    them.

    3. Go back one layer. Treat your outputs $O_i$ as endpoints of your neural net,
    and compute the gradients w.r.t. the previous layer, caching these as well. The
    contributions to the final loss should be summed appropriately over the paths
    which they influence the loss.

    4. Repeat until you hit the last layer (the inputs). You should now have all the
    necessary components to compute the derivative of the loss function with respect
    to *any* parameter of the neural net.


    # Speeding up Gradient Descent


    Backpropagation efficiently computes gradients, so we can run gradient descent
    to optimize neural nets. However, computing the full gradient may be expensive,
    particularly if we have a lot of data. Consider that the loss function in machine
    learning typically is an average (or sum), but this is the same up to a constant
    factor of errors over the training points:


    ```

    L(w) = \frac{1}{n}\sum_{i=1}^{n}\ell(h(x_i, w), y_i)

    ```'
