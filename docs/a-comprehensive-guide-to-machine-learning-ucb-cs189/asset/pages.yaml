    \ = |det(R^T)|$\n$= |det(R) \\cdot det(R^T)|$\n$= |det(R) \\cdot det(R)| = |det(R)|^2$\n\
    \nand therefore\n\n$f_Z(\\mathbf{z}) = \\frac{1}{\\sqrt{\\det(\\Sigma_Z)}(\\sqrt{2\\\
    pi})^n}} e^{-\\frac{1}{2}\\mathbf{z}^T\\Sigma_Z\\mathbf{z}}$\n\n# 2.5 MLE with\
    \ Dependent Noise\n\nUp to this point, we have been able to easily view regression\
    \ problems from an optimization perspective. In the context of dependent noise\
    \ however, it is much easier to view the problem from a probabilistic perspective.\
