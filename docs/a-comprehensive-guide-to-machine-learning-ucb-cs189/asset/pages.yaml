    \ \\max_{\\lambda \\geq 0} \\mathcal{L}(x, \\lambda, \tilde{\nu}) \\geq \\mathcal{L}(x,\
    \ \\lambda, \nu) \\geq \\min_{\tilde{x}} \\mathcal{L}(\tilde{x}, \\lambda, \n\
    u)$\n\nMore compactly,\n\n$\\forall x, \\lambda \\geq 0, \nu \\quad \\max_{\\\
    lambda \\geq 0} \\mathcal{L}(x, \\lambda, \tilde{\nu}) \\geq \\min_{\tilde{x}}\
    \ \\mathcal{L}(\tilde{x}, \\lambda, \nu)$\n\nSince this is true for all $x, \\\
    lambda \\geq 0,\nu$ is true when we set\n\n$x = \\arg \\min_{\tilde{x}} \\max_{\\\
    lambda \\geq 0} \\mathcal{L}(\tilde{x}, \\lambda, \tilde{\nu})$\n\nand\n\n$\\\
