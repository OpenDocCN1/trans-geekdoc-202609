  md: "Plugging these estimates for the tr covariance matrices, we arrive at the problem\n\
    \n```\n$$\\max_{u,v} \\frac{u^{\\top} (\\frac{1}{n}X^{\\top}Y) u}{\\sqrt{u^{\\\
    top} (\\frac{1}{n}X^{\\top}X) \\cdot v^{\\top} (\\frac{1}{n}Y^{\\top}Y) v}}} =\
    \ \\max_{u,v} \\frac{u^{\\top} X^{\\top}Y v}{\\sqrt{u^{\\top} X^{\\top}X \\cdot\
    \ v^{\\top} Y^{\\top}Y}}} = \\rho(Xu, Yv)$\n```\n\nLet's try to manage the maximization\
    \ problem into a form that we can reason with more easily. Our strategy is to\
    \ choose matrices to transform $X$ and $Y$ such that the maximization problem\
    \ is equivalent but easier to understand.\n\n+   1. First, let's choose matrices\
    \ $W_x, W_y$ to whiten $X$ and $Y$. This will make the (co)variance matrices $(W_x^{\t\
    op})(WX_x)$ and $(W_y^{\top})(YW_y)$ identity matrices and simplify our expression.\
    \ To do this, note that $X^{\top}X$ is positive definite (hence symmetric), so\
    \ we can employ the eigendecomposition\n\n```\n$X^{\\top}X = U_x S_x U_x^{\top}$\n\
    ```\n\nSince all the diagonal entries are positive, we can define the \"square\
    \ root\" of this matrix by taking the square root of every diagonal entry:\n\n\
    ```\n$S_x^{1/2} = \\text{diag}(\\sqrt{\\lambda_1(X^{\\top}X)}, \\dots, \\sqrt{\\\
    lambda_d(X^{\\top}X)})$\n```\n\nThen, $W_x = U_x S_x^{-1/2}U_x^{\top}$, we have\n\
