    # 3.1 Total Least Squares


    Previously, we have covered Ordinary Least Squares (OLS), which assumes that the
    dependent variable y is noisy but the independent variables x are noise-free.
    We now discuss Total Least Squares (TLS), which arises in the case where we assume
    that x data is also corrupted by noise. Both LS methods want to get a model that
    produce an approximation closest to all the points, but they measure the distance
    differently. OLS tries to minimize the vertical distance between the fitted line
