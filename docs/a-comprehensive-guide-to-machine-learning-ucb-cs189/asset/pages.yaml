  md: '![](img/99defe26aebed215976e83d281581f33_68_0.png)


    Recall that the gradient of $f$ at $x$, denoted $

    abla f(x)$, points in the direction of steepest ascent. Conversely, the negative
    gradient points in the direction of steepest descent. Therefore, if we take a
    small step in the direction of the negative gradient, we will decrease the value
    of the function.


    The update performed is


    ```

    $$\mathbf{x}_{i+1} = \mathbf{x}_i - \alpha_i \nabla f(\mathbf{x}_i)$

    ```


    where $\alpha_i > 0$ is the step size. We may choose $\alpha_i$ to be a fixed
    constant, but in many cases it is decayed to zero over the course of training.'
