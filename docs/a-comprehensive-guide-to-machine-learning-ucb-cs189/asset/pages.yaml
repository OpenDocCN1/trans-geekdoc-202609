  md: "# 1.5. HYPERPARAMETERS AND VALIDATION\n\nLet us try to formally distinguish\
    \ the various types of error. Assume that the data are distributed according to\
    \ some (unknown) distribution $\\mathcal{D}$, and that we have a **loss function**\
    \ $\\ell: \\mathbb{R} \times \\mathbb{R} \to \\mathbb{R}$, which is to measure\
    \ the error between the true output $y$ and our estimate $\\hat{y}=h(x)$. The\
    \ **risk** (**true error**) of a particular hypothesis $h$ is the expected loss\
    \ over the whole data distribution:\n\n```\n$R(h) = E_{(x,y)}\\\\sim\\mathcal{D}}[\\\
    ell(h(x), y)]$\n```\n\nIdeally, we would find the hypothesis that minimizes the\
    \ risk, i.e.\n\n```\n$h^* = \\arg\\min_{h\\in\\mathcal{H}} R(h)$\n```\n\nHowever,\
    \ computing this expectation is impossible because we do not have access to the\
    \ true distribution. Rather, we have access to samples $(x_i, y_i)\\\\sim\\mathcal{D}$.\
    \ These enable us to approximate the real problem we care about by minimizing\
    \ the **empirical risk** (**training error**)\n\n```\n$R_{TRAIN}(h) = \\sum_{i=1}^{n}\
    \ \\ell(h(x_i), y_i)$\n```\n\nSince we have a finite number of samples, the hypothesis\
    \ that performs best on the training is not necessarily the best on the whole\
    \ data distribution. In particular, if we train and evaluate the hypothesis using\
    \ the same data points, the training error will be a very biased estimate of the\
    \ true error, since the hypothesis has been chosen specifically to perform well\
    \ on those points.\n\nThe solution is to set aside portion (say 30%) of the data,\
    \ to be called the **validation set**, which is disjoint from the training set\
    \ and **not** allowed to be used when fitting the:\n\n| Validation | Training\
    \ |\n| | |\n\nWe can use this validation set to estimate the true error by the\
    \ **validation error**\n\n```\n$$\\hat{R}_{VAL}(h) = \\sum_{i=1}^{m} \\ell(h(x_i^{val}),\
    \ y_i^{val})$\n```\n\nWith this estimate, we have a simple method for choosing\
    \ hyper values: a bunch of configurations of the hyperparameters and choose the\
    \ one that yields the lowest validation error.\n\n# The effect of hyperparameters\
    \ on error\n\nNote that as we add more features to a linear model, training error\
    \ can only decrease. This is because the optimizer can set $w_i = 0$ if feature\
    \ cannot be used to reduce training error."
