    Suppose also we assume our labels $y_i = f(x_i) + \epsilon$, where $\epsilon$
    is the noise from $\mathcal{N}(0, \sigma^2)$ and $f$ is the true function. Let
    $x_1 \dots x_k$ be the $k$ closest points. Let''s derive the bias of our model
    for the given dataset $D$.


    ```

    $E[[h(z)] - f(z)]^2 = E\left[\left(\sum_{i=1}^k N(x_i, z, k) - f(z)\right)^2\right]
    = E\left[\left(\sum_{i=1}^k y_i - f(z)\right)^2\right]$

    ```


    ```

    $E\left[(\sum_{i=1}^k E[y_i] - f(z)\right)^2\right] = E\left[\left(\sum_{i=1}^k
    E[f(x_i) + \epsilon] - f(z)\right)^2\right]$

    ```


    ```

    $E\left[(\sum_{i=1}^k f(x_i) - f(z))^2\right]$

    ```


    When $k \to \infty$, then $\sum_{i=1}^k f(x_i)$ goes to the average level for
    $x$. When $k=1$, the bias is simply $f(x_1) - f(z)$. Assuming $x_1$ is close enough
    to $f(z)$, the bias would likely be small when $k=1$ since it''s likely to share
    a similar mean. Meanwhile, when $k \to \infty$, the bias doesn''t depend on the
    training points at all which will restrict it to be higher.


    Now, let''s derive the variance of $h(z)$


    ```

    $Var[h(z)] = Var\left[\frac{1}{k} \sum_{i=1}^k y_i\right] = \frac{1}{k^2} \sum_{i=1}^k
    Var[f(x_i) + \epsilon]$

    ```


    ```

    $$\frac{1}{k^2} \sum_{i=1}^k Var[\epsilon]$

    ```


    ```

    $$\frac{1}{k^2} \sum_{i=1}^k \sigma^2 = \frac{1}{k^2} k\sigma^2 = \frac{\sigma^2}{k}$

    ```


    The variance goes to 0 when $k \to \infty$, and is maximized at $k=1$.


    # Properties


    **Computational complexity:** We require $O(n)$ space to store a training set
    of size $n$. There is no runtime cost during training if we use specialized data
    structures to store the data. However, predictions take $O(n)$ time, which is
    costly. There has been research into approximate nearest neighbors (ANN) procedures
    that quickly find an approximation for the nearest neighbor - some common ANN
    methods are *Locality-Sensitive Hashing* and algorithms that perform dimensionality
    reduction via randomized (Johnson-Lindenstrauss) distance-preserving projections.^2


    $^2 ANN methods are beyond the scope of this course, but are useful in real applications.'
