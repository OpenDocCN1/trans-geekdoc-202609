  md: "# 3.2. PRINCIPAL COMPONENT ANALYSIS\n\nFor matrices $U$ with orthogonal columns\
    \ we can define\n\n```\n$R(U; M) = R([u_1, \\dots, u_k]; M) = \\sum_{j=1}^k R(u_j;\
    \ M)$\n```\n\nAs before, the bounds for this expression are given in terms of\
    \ the smallest and largest eigenvalues, and we know that them are:\n\n```\n$\\\
    lambda_1 + \\lambda_2 + \\dots + \\lambda_k = R([v_1\n```\n\nHence, projection\
    \ onto the subspace spanned by the first $k$ leading eigenvectors maximizes the\
    \ variance of the projected data. We can find $k$ principal components by computing\
    \ the SVD, $X = U\\Sigma V^top$, and then taking the first $k$ columns of the\
    \ matrix $V$.\n\n# Projecting onto the PCA coordinate system\n\nOnce we have the\
    \ principal components, we can use them as a new coordinate system. To do this\
    \ we must project the data onto this coordinate system, which can be done in the\
    \ same way as above (taking inner products). Each data point $x_i \\in \\mathbb{R}^d$\
    \ becomes a new vector $\tilde{x}_i \\in \\mathbb{R}^k$, where $k$ is the number\
    \ of principal components. The components of the projection write\n\n```\n$\\\
    tilde{x}_ij = x_i^top u_j$\n```\n\nWe can compute all these vectors at once efficiently\
    \ using a matrix-matrix multiplication\n\n```\n$\\tilde{X} = UX$\n```\n\nwhere\
    \ $U \\in \\mathbb{R}^{d\\times k}$ is a matrix whose columns are the principal\
    \ components.\n\nBelow we plot the result of such a projection in the case $d=k=2$:\n\
    \n![](img/99defe26aebed215976e83d281581f33_52_0.png)\n\nFigure 3.1: Left:data\
    \ points; Right: PCA projection of data points\n\nObserve that the data are uncorrelated\
    \ in the projected space. Also note that this example does not show the full power\
    \ of PCA since we have not reduced the dimensionality of the data at all – the\
    \ plot is merely to show the PCA coordinate transformation."
