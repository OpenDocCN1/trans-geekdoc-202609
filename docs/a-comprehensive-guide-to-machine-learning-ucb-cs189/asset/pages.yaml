    # Derivatives in Neural Nets


    We have a very powerful tool at our disposal in neural nets, but it does do us
    no good if we can’t train them. Let’s talk about how this happens. The output
    units of a neural net can be thought of as akin to a regression or hypothesis
    function determined by the parameters of some model. For example, in ordinary
    least-squares regression, we learned a hypothesis function $f(x) = w^Tx$ determined
    by the parameter $w$. It is just the same with neural nets, except that our hypothesis
    function can be arbitrarily complex. Consider the following neural net:


    ![](img/99defe26aebed215976e83d281581f33_76_1.png)


    The hypothesis function that this neural net encodes is represented by the two
    outputs, $O = [O_1, O_2]$.'
