  md: "# # Chapter 5\n\n# # Neural Networks\n\n# ## 5.1 Neural Networks\n\nNeural\
    \ networks are a class of compositional function approximators. Unlike other function\
    \ approximators we have seen (e.g. polynomials), they are nonlinear in their parameters.\n\
    (Aside) In information processing we have several perspectives:\n\n+   - Procedural\
    \ perspective – thinking in terms of an imperative programming language\n- Functional\
    \ perspective – mathematical equations and reasoning\n- Circuit/graph perspective\
    \ – information is processed as it flows through the system\n\nWe will consider\
    \ neural nets from the circuit/graph perspective.\nConsider the circuits below:\n\
    \n![](img/99defe26aebed215976e83d281581f33_70_0.png)\n\nThese circuits represent\
    \ matrix multiplications, with the weights on the edges being the entries of the\
    \ matrix. Assuming that the flow of information is from left to right, the circuit\
    \ on the left is multiplication by a $3 \times 4$ matrix, and the circuit on the\
    \ right is multiplication by a $2 \times 4$ matrix followed by multiplication\
    \ by a $3 \times 2$ matrix.\n\nAre these circuits equally expressive? Certainly\
    \ not, as the one on the left has rank at most 2, while the one on the right may\
    \ have rank 3. However, the one on the left has more layers"
