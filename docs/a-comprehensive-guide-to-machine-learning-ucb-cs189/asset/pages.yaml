    Any other arrangement would put weight on $S_{dd}$ at the expense of taxing that
    weight away from $S_{11}$, which is the largest, reducing the value of the sum.


    Finally we have an analytical solution, but it is in a different coordinate system
    than our original problem! In particular, $u_d$ and $v_d$ are the best weights
    in a coordinate system where the data has been whitened and correlated. To bring
    it to our original coordinate system and find the vectors we care about ($u$ and
    $v$), we must invert the changes of variables:


    ```

    $u = W_u D_u u_d \quad\quad v = W_v D_v v_d$

    ```


    More generally, to get the best $k$ directions, we


    ```

    $U_d = \begin{bmatrix} I_k \ O_{p-k,k} \end{bmatrix} \in R^{p \times k} \quad\quad
    V_d = \begin{bmatrix} I_k \ O_{q-k,k} \end{bmatrix} \in R^{q \times k}$

    ```


    where $I_k$ denotes the $k$-dimensional identity matrix. Then


    ```

    $U = W_u D_u U_d \quad\quad V = W_v D_v V_d$

    ```


    Note that $U_d$ and $V_d$ have orthogonal columns. The columns of $U$ and $V$,
    which are the directions we see, in general not be orthogonal, but they will be
    linearly independent (since they come from the application of invertible matrices
    to the columns of $U_d, V_d$).


    # Comparison with PCA


    An advantage of CCA over PCA is that it is invariant to scaling and affine transformations
    of $X$ and $Y$. Consider a simple scenario where two matrix-valued random variables
    $X,Y$ satisfy $Y=X+\epsilon$ where $\epsilon$ has large variance. What happens
    when we use PCA on $Y$? PCA maximizes variance, it will project $Y$ (largely)
    into the column space of $\epsilon$; however, we are interested in $Y$''s relationship
    to $X$, not its dependence on $\epsilon$. How can we fix this? It turns out, CCA
    solves this issue. Instead of maximizing variance of $Y$, we maximize correlation
    between $X$ and $Y$. In some sense, we maximize the “predictive power” of information
    we have.


    # CCA regression


    Once we computed the CCA coefficients, one application is to use them for regression
    tasks, predicting $Y$ from $X$ (or vice versa). Recall that the correlation attains
    a greater value when the two sets of data are more correlated. Thus, it makes
    us to find the $k \times k$ weight matrix $A$ that linearly relates $X$ and $YX$.
    We can accomplish this with ordinary least squares.


    The projected data matrices by $X_c = XU$ $Y_c = YV$. Observe that $X_c$ and $Y_c$
    are zero-mean because they are linear transformations of $X$ and $Y$, which are
    zero-mean. Thus we can fit a linear model relating the two:


    ```

    $Y_c \approx X_c A$

    ```'
