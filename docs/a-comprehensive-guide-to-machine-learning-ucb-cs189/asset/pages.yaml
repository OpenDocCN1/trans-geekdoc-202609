  md: '# 2.1 MLE AND MAP


    random variable: $X \sim p(x)$


    probability distribution: $p(x) = \frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}}$


    mean: $E[X] = \int_{-\infty}^{\infty} xp(x)dx = \mu$


    variance: $V[X] = E[(X-\mu)^2] = \int_{-\infty}^{\infty} (x-\mu)^2p(x)dx = \sigma^2$


    parameters: $X \sim \mathcal{N}(\mu, \sigma^2)$


    log-likelihood: $\log P(X) = \sum \frac{(x-\mu)^2}{2\sigma^2} - \sqrt{2\pi}\sigma$.


    linear combinations: $E[aX+bY] = a\mu_x + b\mu_y$


    if $X, Y$ are independent: $V[aX+bY] = a^2\sigma_x^2 + b^2\sigma_y^2$

    $aX+bY \sim \mathcal{N}(a\mu_x+b\mu_y, a^2\sigma_x^2+b^2\sigma_y^2)$


    # MLE and MAP for Model Selection


    In the context of regression, (and all of supervised learning for that), we assume
    a **true underlying model** that maps inputs to outputs. Our goal as machine learning
    experts is to find a **hypothesis model** that represents the true underlying
    model, by using the data we are given.


    Let''s define more concretely our definition of the data and the model. Our data
    takes consists of $n$ $(x_i, y_i)$ pairs, just as we have seen before:


    $$\mathcal{D} = \{(x_i, y_i)\}_{i=1}^n$


    The true underlying model $f$ is a function that maps the inputs $x_i$ to the
    true outputs $f(x_i)$. Each **observation** $y_i$ is simply a noisy version of
    $f(x_i)$:


    $y_i = f(x_i) + N_i$


    Now $f(x_i)$ is a constant, while $N_i$ is a random variable. We always assume
    that $N_i$ has zero mean, otherwise there would be systematic bias in our observations.
    The $N_i$ could be Gaussian, Uniform, Laplacian, etc. Here, let us assume that
    they are **independent and identically distributed (i.i.d)** and Gaussian: $N_i
    \sim \mathcal{N}(0, \sigma^2)$. We can verify that $y_i|x_i \sim \mathcal{N}(f(x_i),
    \sigma^2)$.


    Now that we have introduced the data, and we wish to find a hypothesis model $h\theta$
    that best describes the data, possibly taking into account prior beliefs that
    we have about the true model. We can represent this as a probability problem,
    where the goal is to find the optimal model that maximizes our probability.


    # Maximum Likelihood Estimation


    In Maximum Likelihood Estimation (MLE), the goal is to find the model that maximizes
    the probability of the data. If we parametri the set of hypothesis models with
    $\theta$, we can represent'
  merge: -1
  img_proc: true
- pgno: 23
  md: '24

    CHAPTER 2. PROBABILISTIC MODELS IN MACHINE LEARNING


    the problem as:


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} P(data = \mathcal{D} | \text{true model}
    = \theta)$

    ```


    More concretely:


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} P(y_1, \dots, y_n | \mathbf{x}_1, \dots,
    \mathbf{x}_n, \theta)$

    ```


    Note that we actually conditioned on the $\mathbf{x}_i$''s, because we treat them
    as *fixed* values of data. The only randomness in our data comes from the $y_i$''s
    (since they are noisy versions of the true values $f(\mathbf{x}_i)$).


    We can simplify this expression by viewing the problem as a graphical model. Note
    that $y_i$ only depends on its parent in the graphical model, it does not depend
    on the other $y_j$''s, since all $y_j$''''s have independent noise terms. We can
    then simplify the objective:


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} P(y_1, \dots, y_n | \mathbf{x}_1, \dots,
    \mathbf{x}_n, \theta) = \prod_{i=1}^n P(y_i | \mathbf{x}_i, \theta)$

    ```


    Now let''s focus on each individual term $P(y_i | \mathbf{x}_i, \theta)$. We know
    that $y_i | \mathbf{x}_i, \theta \sim N(h(\mathbf{x}_i), \sigma^2)$, which is
    cumbersome to work with because Gaussians have exponential terms. Instead we will
    use logs, which makes the exponential terms:


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} \log[P(y_1, \dots, y_n | \mathbf{x}_1,
    \dots, \mathbf{x}_n, \theta)] = \sum_{i=1}^n \log[P(y_i | \mathbf{x}_i, \theta)]$

    ```


    Note that with logs we are still working with the same problem, because logarithms
    are monotonic functions. In other words we have that:


    ```

    $P(A) < P(B) \iff \log P(A) < \log P(B)$

    ```


    Continuing with logs:


    ```

    $$\theta_{\text{MLE}} = \arg \max_{\theta} \sum_{i=1}^n \log[P(y_i | \mathbf{x}_i,
    \theta)] \quad (2.1)$

    ```


    ```

    $= \arg \max_{\theta} (- \sum_{i=1}^n \frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2}
    - n \log \sqrt{2\pi}\sigma) \quad (2.2)$

    ```


    ```

    $= \arg \min_{\theta} (sum_{i=1}^n \frac{(y_i - h(\mathbf{x}_i))^2}{2\sigma^2})
    + n \log \sqrt{2\pi}\sigma \quad (2.3)$

    ```


    ```

    $= \arg \min_{\theta} \sum_{i=1}^n (y_i - h(\mathbf{x}_i))^2 \quad (2.4)$

    ```


    Note that in step (3) we turned the problem from a maximization to a minimization
    problem by negating the objective. In step (4) we eliminated the second term and
    the denominator in the first term, because they do not depend on the variables
    we are trying to optimize over.


    Now let''s look at the case of regression. In that case our hypothesis has the
    form $h(\mathbf{x}_i) = \mathbf{x}_i^T \theta$, where $\theta \in \mathbb{R}^d$,
    where d is the number of dimensions of our featurized datapoints. For this specific
    setting, the problem becomes:


    ```

    $$\theta_{\text{MLE}} = \arg \min_{\theta \in \mathbb{R}^d} \sum_{i=1}^n (y_i
    - \mathbf{x}_i^T \theta)^2$

    ```'
