- pgno: 53
  md: "54 CHAPTER 3. LOW-RANK APPROXIMATION\n\n# Other derivations of PCA\n\nWe have\
    \ given the most common derivation of PCA above, but it turns out that there are\
    \ other equivalent ways to arrive at the same formulation. These give us helpful\
    \ additional perspectives on what PCA is doing.\n\n# Gaussian assumption\n\nLet\
    \ us assume that the data are generated by a multivariate Gaussian distribution:\n\
    \n```\n$x_i \\overset{iid}{\\sim} \\mathcal{N}(\\mu, \\Sigma)$\n```\n\nThen the\
    \ maximum likelihood estimate of the covariance matrix $\\Sigma$ is\n\n```\n$\\\
    hat{\\Sigma} = \\frac{1}{n} \\sum_{i=1}^n (x_i - \\bar{x})(x_i - \\bar{x})^T =\
    \ \\frac{1}{n} X^T X$\n```\n\nwhere $\bar{x}$ is the sample average and the matrix\
    \ $X$ is assumed to be zero-mean as before. The eigenvectors of $\\hat{\\Sigma}$\
    \ and $X^T X$ are the same since they are scalar multiples of each other. The\
    \ contours of the Gaussian density form are ellipsoids (see Figure 1). The direction\
    \ of largest variance (i.e. the first principal component) is the eigenvector\
    \ corresponding to the smallest eigenvalue of $\\Sigma^{-1}$, which is the largest\
    \ eigenvalue of $\\Sigma$. We do not know $\\Sigma$ in general, so we use $\\\
    hat{\\Sigma}$ in its place. Thus the principal component is an eigenvector corresponding\
    \ to the largest eigenvalue of $\\Sigma$. As mentioned earlier, this matrix has\
    \ the same eigenvalues and eigenvectors as $X^T X$, so we arrive at the same solution.\n\
    \n# Minimizing reconstruction error\n\nOrdinary least squares minimizes the vertical\
    \ distance between the fitted line and the data points:\n\n```\n$||y - Xu||^2$\n\
    ```\n\nWe show that PCA can be interpreted as minimizing the perpendicular distance\
    \ between the principal component subspace and the data points, in this sense\
    \ it is doing the same thing as total least squares.\n\nThe orthogonal projection\
    \ of a vector $x$ onto the subspace spanned by a unit vector $u$ equals $u$ scaled\
    \ by the scalar projection of $x$ onto $u$:\n\n```\n$P_u x = (uu^T)x = (u^T x)u$\n\
    ```\n\nSuppose we want to minimize the total reconstruction error:\n\n```\n$\\\
    epsilon_{PCA\\_Err}(u) = \\sum_{i=1}^n ||x_i - P_u x_i||^2\\n= \\sum_{i=1}^n (||x_i||^2\
    \ - ||P_u x_i||^2)\\n= \\sum_{i=1}^n ||x_i||^2 - \\sum_{i=1}^n ||(x_i^T)u||^2\
    \ \\quad (*)$\n```"
