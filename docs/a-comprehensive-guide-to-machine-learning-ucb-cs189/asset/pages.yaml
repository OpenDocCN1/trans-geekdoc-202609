    will typically cause some loss of information, but if the data really does live
    in a $d$-dimensional subspace, then we should be able to reconstruct $x$ via $VV^T
    x$ and obtain something that is close to the original $x$. PCA can be seen as
    finding a basis for a subspace that minimizes this reconstruction error (low-rank
    approximation property).


    Sometimes, it does not make sense to find orthogonal directions that capture the
    maximum variance, as PCA does. Independent Components Analysis seeks directions
    that are statistically independent, and is more suitable for some applications.


    # Nonnegative Matrix Factorization


    NMF takes a non-negative matrix $X$, where each column is a data entry, and approximately
    factors it into $X = BH$, where $B$ is skinny, $H$ is fat, and both these matrices
    are non-negative. The $k$-th column of $H$ is the sum of the columns of $B$, weighted
    according to the entries in the $k$-th column of $H$. In this regard, each column
    of $B$ can be seen as a feature that contributes to the data in a meaningful way
    - the number of columns in $B$ is the number of features we are allowed to reconstruct
    the data. If each column of $X$ is a vectorized image, then each column of $B$
    will be a vectorized image. NMF learns a part-based representation of the data,
    since the reconstruction is a non-negative linear combination of features of the
    same dimension as the data. It turns out that NMF will tend to produce sparser
    features than PCA. NMF has applications in computer vision and recommender systems,
    over other fields.


    # Multidimensional Scaling


    MDS seeks to learn a low-dimensional representation such that pairwise distances
    between are preserved in the latent representation. If $X_i \in \mathbb{R}^D$
    and $W_{ij} = \|X_i - X_j\|^2$, then MDS finds $Y_i$ such that $\|Y_i - Y_j\|^2
    \approx W_{ij}$. More generally, one can use any dissimilarity measure $d(X_i,
    X_j)$ in place of norm. If the dissimilarity measure is a metric, then MDS is
    equivalent to PCA. MDS is typically used to visualize high-dimensional data.


    Note that while MDS captures overall distances in its low-dimensional embedding,
    it is incapable of capturing local geometric structure - for example, in the Swiss
    roll dataset shown above, points in the red region are dissimilar from points
    in the blue region, but are relatively close to these points in distance, so MDS
    would provide a representation where red and blue points are not separated.'
