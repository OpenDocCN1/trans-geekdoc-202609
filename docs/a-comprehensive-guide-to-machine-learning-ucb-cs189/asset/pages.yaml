  md: "# CHAPTER 3. LOW-RANK APPROXIMATION\n\n![](img/99defe26aebed215976e83d281581f33_49_0.png)\n\
    \n# Formulating PCA\n\nLet $X \\in \\mathbb{R}^{n \times d}$ be our matrix, where\
    \ each row is a $d$-dimensional data point. We will assume that the data points\
    \ have mean of zero; otherwise we subtract the mean to make them zero-mean:\n\n\
    ```\n$X - \\frac{1}{n}\\mathbf{1}_n\\mathbf{1}_n^T X, \\quad \\mathbf{1}_n = \\\
    begin{bmatrix} 1 \\ \\vdots \\ 1 \\end{bmatrix}$\n```\n\nThe motivation for this\
    \ is that we want to find directions of high variance within the data, and variance\
    \ is defined relative to the mean of the data. If we did not zero-center the data,\
    \ the directions found would be heavily influenced by where the data lie relative\
    \ to the origin, rather than where they lie relative to the other data, which\
    \ is more useful. For example, translating all the data by some fixed vector could\
    \ completely change the principal components if we did not center.\n\nRecall that\
    \ any random variable $Z$,\n\n```\n$Var(Z) = \\mathbb{E}[(Z - \\mathbb{E}[Z])^2]$\n\
    ```\n\nif $\\mathbb{E}[Z] = 0$ then $Var(Z) = \\mathbb{E}[Z]^2$.\n\nHence once\
    \ $X$ is zero-mean, the variance of the projections is given by\n\n```\n$\\epsilon_{PCA,var}(u)\
    \ = \\sum_{i=1}^n (x_i^T u)^2 = \\|Xu\\|^2$\n```\n\nwhere $u$ is constrained to\
    \ have unit norm. To maximize the variance, the objective becomes\n\n```\n$\\\
    max_{\\|u\\|=1} \\epsilon_{PCA,var}(u) = \\max_{\\|u\\|=1} \\|Xu\\|^2 = \\max_{u\\\
    neq 0} \\frac{\\|Xu\\|^2}{\\|u\\|^2} = \\max_{u\\neq 0} \\frac{u^T X^T Xu}{u^T\
    \ u}$\n```\n\nThe ratio which is known as a *Rayleigh quotient*. We will see that\
    \ Rayleigh quotients are heavily related to eigenvalues, so anytime you use one,\
    \ its eigensense would single.\n\n# Rayleigh Quotients\n\nSuppose $M \\in \\mathbb{R}^{d\
    \ \times d}$ is a real, symmetric ($M = M^T$) matrix. The Rayleigh quotient of\
    \ $M$ is defined as\n\n```\n$R(u; M) = \\frac{u^T Mu}{u^T u}$\n```\n\nThe eigenvalues\
    \ of $M$ by $\\lambda_1 \\geq \\lambda_2 \\geq \\dots \\geq \\lambda_d$, with\
    \ corresponding eigenvectors $v_1, \\dots, v_d$. That is, $M_j = \\lambda_j v_j$\
    \ for $j = 1, \\dots, d$. If we stack the $v_j$ as columns of a matrix $V$:\n\n\
    ```\n$V = [v_1 \\quad \\dots \\quad v_d]$\n```"
