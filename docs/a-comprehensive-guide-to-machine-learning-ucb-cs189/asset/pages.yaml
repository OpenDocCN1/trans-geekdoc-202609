  md: 'Putting everything together, we have the following optimization problem:


    ```

    $$\begin{aligned} \max_{m,w,b} & m \ \text{s.t.} & & y_i \frac{(w^T x_i - b)}{\|w\|_2}
    \geq m \quad \forall i \ & m \geq 0 \end{aligned}$ (6.1)

    ```


    Maximizing the $m$ means that there exists at least one point on the positive
    side of the hyperplane and at least one point on the negative side whose distance
    to the hyperplane is exactly equal to $m$. These points are the **support vectors**,
    hence the name “support vector machines”.


    Through a series of optimization steps, we can simplify the problem by removing
    the margin variable and just optimizing the parameters of the hyperplane. In order
    to do so, we have introduce two new variables $w''$ and $b''$ that capture the
    relationship between the three original variables $m$, $w$, and $b$.


    ```

    $$\begin{aligned} \max_{m,w,b,w'',b''} & \frac{1}{\|w''\|_2} \ \text{s.t.} & &
    y_i(w^T x_i - b'') \geq 1 \quad \forall i \ & m \geq 0 \ & w'' = & \frac{w}{\|w\|_2m}
    \ & b'' = & \frac{b}{\|w\|_2m} \end{aligned}$ (6.2)

    ```


    Having introduced the new variables $w''$ and $b''$, the old variables $m$, $w$,
    and $b$ are no longer relevant to the optimization problem, and we can remove
    them. The previous optimization problem is equivalent to


    ```

    $$\begin{aligned} \max_{w'',b''} & \frac{1}{\|w''\|_2^2} \ \text{s.t.} & & y_i(w^T
    x_i - b'') \geq 1 \quad \forall i \end{aligned}$ (6.3)

    ```


    Let''s verify that (2) and (3) are equivalent. We will show that


    +   1. The optimal value of (2) is at least as good as the optimal value of (3).
    Assume that the optimal values for (3) are $w^*$ and $b^*$. One feasible point
    for (2) is $(m, w, b, w'', b'') = (\frac{1}{\|w^*\|_2}, w^*, b^*, w^*, b^*)$,
    which leads to the same objective as (3). Therefore, the optimal value of (2)
    is at least as good as that of (3).

    2. The optimal value of (3) is at least as good as the optimal value of (2). Assume
    that the optimal values for (2) are $(m^*, w^*, b^*)$. One feasible point for
    (3) is $(w'', b'') = (w^*, b^*)$ which leads to the same objective as (2). Therefore,
    the optimal value of (3) is at least as good as that of (2).


    We can rewrite objective so that the problem is a minimization rather than a maximization:


    ```

    $$\begin{aligned} \min_{w'',b''} & \frac{1}{\|w''\|_2^2} \ \text{s.t.} & & y_i(w^T
    x_i - b'') \geq 1 \quad \forall i \end{aligned}$ (6.4)

    ```'
