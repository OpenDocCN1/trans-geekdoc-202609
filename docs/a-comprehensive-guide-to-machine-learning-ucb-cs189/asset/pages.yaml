  md: '# CHAPTER 9. DEEP LEARNING


    142


    ![](img/99defe26aebed215976e83d281581f33_141_0.png)


    +   3. Zero-padding is sometimes used to control the exact dimensions of the convolutional
    layer.


    +   4. As you add more convolutional layers, the effective receptive field of
    each successive layer increases. That is, as you go downstream (of the layers),
    the value of any single unit is informed by an increasingly large patch of the
    original image. For example. If you use two successive layers of $3 \times 3$
    kernels, one unit in the first convolutional layer is informed by 9 separate pixels.
    Any one unit in the second convolutional layer is informed by 9 separate units
    of the first convolutional layer, which could inform by up to $9 \times 9 = 81$
    original pixels.


    ![](img/99defe26aebed215976e83d281581f33_141_1.png)


    Figure 9.3: The highlighted unit in the downstream layer uses information from
    all the highlighted units in the input layer.


    +   5. You can think of convolutional layers as a *complexity-regularized version*
    of fully-connected layers.


    # Pooling Layers


    A **pooling layer** does not involve more weights. Instead, it is a layer whose
    purpose is solely to downsample AKA pool AKA consolidate the previous layer. It
    does this by sliding a window of some size across the units of a layer of the
    ConvNet and choosing (somehow) one value to effectively "represent"s of all the
    units captured by the window. You can tweak the nature of a pooling layer in a
    few orthogonal ways.


    +   1. How to pool? In max-pooling, the representative value becomes the largest
    of all the units in the window. In average-pooling, the representative value is
    the average of all the units in the window.'
