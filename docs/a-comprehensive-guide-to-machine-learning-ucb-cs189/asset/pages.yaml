    # 5.2 Training Neural Networks


    # ReUs as Universal Function Approximators


    Last time we saw that the second-most simple function approximator was the piecewise
    linear function. Specifically, we talked about a specific component of piecewise
    linear functions called the ReLU, which is $f(x) = \max(0, x)$.


    In discussion of neural nets, we saw that we would have the ReUs act on linear
    combinations of neural units to introduce nonlinearity to the function encoded
    by the neural net. For example, when acting on one input (and a bias term) our
    ReUs will take in arguments of the form $a + b$. Let''s see an example of how
    expressive they can be. Suppose we wanted to build this function from ReUs:


    ![](img/99defe26aebed215976e83d281581f33_75_0.png)


    All we would need to do is center a ReLU at each hinge of the function and give
    it the appropriate parameters. For example, to match $f$ from 0 to 3, we would
    only need the ReLU defined by $\max(0, x-2)$. The full function can be matched
    with this linear combination of ReUs (and a constant bias term):


    $f(x) = -1 + \max(0, x-2) - \max(0, x-2) + \max(0, 6-x) - \max(0, 5-x) + \max(0,
    2x-12)$


    Here''s the plot on Wolfram Alpha.'
