  md: '# 7.3. NEAREST NEIGHBOR CLASSIFICATION


    ![](img/99defe26aebed215976e83d281581f33_120_0.png)


    Figure 7.2: Voronoi diagram for $k=1$ vs. $k=15$. Figure from Introduction to
    Statistical Learning.


    Choosing $k=1$, we achieve an optimal training error of 0 because each training
    point will classify as itself, achieving 100% accuracy on itself. However, $k=1$
    overfits to the training data, and there is a terrible choice in the context of
    the bias-variance tradeoff. Increasing $k$ leads to an increase in training error,
    but a decrease in testing error and achieves better generalization. At one point,
    if $k$ becomes too large, the algorithm will underfit the training data, and suffer
    from huge bias. In general, in order to select $k we use cross-validation.


    ![](img/99defe26aebed215976e83d281581f33_120_1.png)


    Figure 7.3: Training and Testing error as a function of $k$. Figure from Introduction
    to Statistical Learning.


