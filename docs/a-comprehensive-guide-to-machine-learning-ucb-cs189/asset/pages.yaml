    ![](img/99defe26aebed215976e83d281581f33_74_0.png)


    If the initialization runs off the ReLU for every training point, then the gradient
    descent updates will not change the parameters of the neuron, and we say it is
    dead. Random initialization should result in a reasonable number of active neurons.
    There are more sophisticated initialization methods, such as “Glorot initialization”,
    which take into account the number of connections and are more effective in practice.
    Leaky ReLUs, which have a small slope in the section where the ReLU is flat (
    $u(x) = .01x$ when $x < 0$) are sometimes used to provide some small gradient
    to avoid dead neurons.


    # Neural networks are universal function approximators


    The celebrated neural network approximation theorem, by Kurt Hornik³, tells us
    that neural networks are universal function approximators in the following sense.


    **Theorem.** Suppose $u : \mathbb{R} \to \mathbb{R}$ is nonconstant, bounded,
    nondecreasing, and continuous⁴, and let $S \subset \mathbb{R}^n$ be closed and
    bounded. Then for any continuous function $f : S \to \mathbb{R}$ and any $\epsilon
    > 0$, there exists a neural network with one hidden layer and finite number of
    neurons, which we can write


    ```

    $h(x) = \sum_{i=1}^d c_iu(a_i + b_ix)$

    ```


    ² Understanding the difficulty of training deep feedforward neural networks.

    ³ See Approximation Capabilities of Multilayer Feedforward Networks.

    ⁴ Both ReLU and sigmoid satisfy these requirements.'
