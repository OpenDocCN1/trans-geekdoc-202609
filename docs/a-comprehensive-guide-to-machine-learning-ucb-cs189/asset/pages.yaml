  md: '# 74 CHAPTER 5. NEURAL NETWORKS


    where


    $$e_k = (y_k - h(x_k))^2$$


    To gradient descent, we need derivatives of the loss with respect to our optimization
    variables. We compute the chain rule


    ```

    $$\frac{\partial f}{\partial c_i} = \sum_{k=1}^n -2(y_k - h(x_k))frac{\partial
    h}{\partial c_i}(x_k)=u(a_i+b_ix_i)$

    ```


    We see that if this particular step is “off", as in $u(a_i+b_ix)=0$, then


    ```

    $$\frac{\partial e_k}{\partial c_i}=0$$

    ```


    so no update will be made for that example. More notably, consider the derivative
    with respect to $a_i$:


    ```

    $$\frac{\partial f}{\partial a_i} = \sum_{k=1}^n -2(y_k - h(x_k))frac{\partial
    h}{\partial a_i}(x_k)$

    ```


    Similarly,


    ```

    $$\frac{\partial f}{\partial b_i}=0$$

    ```


    The derivative at the jump is undefined, but in practice we will never hit that
    point of discontinuity. The bigger issue is that gradient descent will do nothing
    to optimize the $a_i$ and $b_i$ weights. Even though the step function is useful
    for the purpose of choosing the approximation capabilities of neural networks,
    it is seldom useful in practice because it cannot be trained by conventional gradient-based
    methods.


    The next simplest universal approximator is the class of piecewise-linear functions.
    Just as piecewise-constant functions can be achieved by the step function as a
    nonlinearity, piecewise-linear functions can be achieved by combinations of the
    rectified linear unit (ReLU) function


    $$u(x) = \max(0, x)$


    ![](img/99defe26aebed215976e83d281581f33_73_0.png)


    Now we can calculate the gradients:


    ```

    $$\frac{\partial f}{\partial c_i} = \sum_{k=1}^n -2(y_k - h(x_k))\max(0, a_i+b_ix_k)$

    ```'
