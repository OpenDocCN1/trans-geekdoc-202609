    # AlexNet (Krizhevsky, et al, 2012)


    Key characteristics:


    +   - Conv filters of varying sizes - for example, the first layer has 11 x 11
    conv filters

    - First use of ReLU, which fixed the problem of saturating gradients in the predominant
    tanh activation.'
