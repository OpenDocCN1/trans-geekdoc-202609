  md: '# # Chapter 9


    # ## Deep Learning


    # ### 9.1 Convolutional Neural Nets


    A convolutional neural net is just like a regular neural net, except more complicated
    (convolved). But in some ways, a convolutional neural net can actually be a simpler
    model than a fully-connected neural net.


    We''ll be talking about convolutional neural networks (ConvNets) mostly in the
    framework of image classification. First, let''s recall what one layer of a regular
    neural net looks like:


    ![](img/99defe26aebed215976e83d281581f33_138_0.png)


    Remember each layer consists of units which represent a single number. The values
    on the units of some layer are determined by the values of the units behind them
    and the weights on the edges between the layers. More specifically, the vector
    of numbers representing layer 2, say $y$, can be represented by linear combinations
    $W$ of the vector representing layer 1. If we were dealing with images, each unit
    of the input layer might be the intensity of a single pixel of the image.


    The fully-connected architecture of units has a lot of weights to learn. For just
    a $32 \times 32$ image, there would be 1024 input units and at least as many weights
    between the first two layers. Now, let''s look at how a ConvNet deals with images
    uses its weights differently.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# CHAPTER 9. DEEP LEARNING


    ![](img/99defe26aebed215976e83d281581f33_139_0.png)


    Notice that some of the layers are called “conv” and “pool.” These layers are
    the new ideas that ConvNets introduce to the neural architecture.


    # Convolutional layer


    A convolutional layer is determined by convolving a kernel about the previous
    layer. The kernel is just a fancy name for an array of weights, and convolving
    means that we slide the array of weights across the pixels of the previous layer
    and compute the sum of the elementwise products (kind of like a 2D dot-product).
    Here is a picture that illustrates this:


    ![](img/99defe26aebed215976e83d281581f33_139_1.png)


    In the above picture, we extracted 6 activation values from 12 input values (we
    would supposedly pass the dot-products through some kind of nonlinearity as well).
    In a fully-connected neural net, we would have used 6 × 12 = 72 weights to accomplish
    this. However, in this convolutional layer, we used only 4 weights. This is because
    we made of weight sharing, as in:


    +   1. The weights $w, x, y, z$ were shared among all the pixels of the input


    +   2. The individual units of the output layer were all determined by the same
    weights $w, x, y, z$


    Compare this to the fully-connected architecture where each output unit, there
    is a separate weight to learn for each input unit. This kind of strategy decreases
    the complexity of our model (there are fewer weights), but it makes sense for
    image processing because there are lots of repeated'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 9.1. CONVOLUTIONAL NEURAL NETS


    patterns in images, and if you have one kernel that can detect some kind of phenomenon,
    then it would make sense to use it elsewhere in the image.


    How do kernels detect things, anyways? The short answer is: they will produce
    large values in the areas of the image appearing most similar to them. Consider
    a simple kernel [1 - 1]. This kernel will produce large values for which the left
    pixel is bright and the right pixel is dark. Conversely, it will produce small
    values for which the left pixel is dark and the right pixel is bright.


    ![](img/99defe26aebed215976e83d281581f33_140_0.png)


    Figure 9.1: Left: a sample image. Right: the output of convolving the [1 - 1]
    kernel about the image.


    Notice how the output image has high values (white) in the areas where the original
    image turned from bright to dark (like the right hand side of the figure), and
    it has low values (black) in the areas where the original image turned from dark
    to bright (like the left hand side of the figure). This kernel can be thought
    of as a simple edge detector! Another example, consider the kernel:


    ```

    0.6 0.2 0

    0.2 0 0.2

    0 0.2 0.6

    ```


    If this convolved about an image, it would detect edges at a 45-degree angle.


    Just a few more things on convolutional layers:


    +   1. You can stack the outputs of multiple kernels together to form a convolutional
    layer.


    ![](img/99defe26aebed215976e83d281581f33_140_1.png)


    Figure 9.2: Here, we slid 6 separate $5\times5\times3$ kernels across the original
    image to produce 6 activation maps in the next convolutional layer. Each activation
    map can also be referred to as a **channel**.


    +   2. To save memory, you can have your kernel stride across the image by multiple
    pixels.'
  merge: -1
