    ```\n\nGiven these assumptions, we derive the likelihood for just 1 under hypothesis\
    \ a:\n\n```\n$P(x_i, y_i; a) = \\frac{1}{\\sqrt{2\\pi(a^2+1)}} \\exp\\left(-\\\
    frac{1(y_i - ax_i)^2}{a^2+1}\\right) \\quad (4)$\n```\n\nThus the log likelihood\
    \ is\n\n```\n$\\log P(x_i, y_i; a) = \\text{constant}-\\frac{1}{2}\\log(a^2+1)\\\
    frac{1(y_i-ax_i)^2}{a^2+1} \\quad (5)$\n```\n\nObserve that $a$ shows up in three\
    \ places, unlike the that we are familiar with, where $a$ appears in the quadratic\
    \ term. Our strategy of setting the derivative equal to zero to find a maximizer\
    \ will not yield a nice system of linear equations in this case, so we'll try\
    \ a different approach.\n\n# Solution\n\nTo solve the TLS problem, we develop\
    \ another formulation that can be solved using the singular decomposition.\n\n\
    Assume we have $n$ data points, $\\mathbf{x}_i \\in \\mathbb{R}^d, y_i \\in \\\
    mathbb{R}$, and we stack them to get\n\n```\n$(\\mathbf{X}+\\mathbf{w})=\\mathbf{y\\\
    |+\\mathbf{f} \\quad (6)$\n```\n\nwhere $\\mathbf{w}$ is the weight, and $\\mathbf{f}$\
    \ are noise terms that we need to explain the error in the model. Our goal is\
    \ to minimize the Frobenius norm of the matrix composed of these error vectors.\
    \ Recall that from a probabilistic perspective, finding the most likely value\
    \ of a Gaussian corresponds to minimizing the squared distance from the mean.\
    \ Since we assume the noise is 0-centered, we want to minimize the sum of squares\
    \ of each entry in the error matrix, which corresponds exactly to minimizing the\
    \ Frobenius norm. Thus we arrive at the following constrained optimization problem:\n\
    \n```\nmin_{\\mathbf{w}} ||\\mathbf{E}||_F^2 \\quad \\text{subject to} \\quad\
    \ (\\mathbf{X}+\\mathbf{w}) = \\mathbf{y}+\\\\mathbf{f}$\n```\n\nIn order to separate\
    \ the term being minimized, we rearrange the constraint equation\n\n```\n$[\\\
    mathbf{X} \\quad \\mathbf{y} + \\left[\\mathbf{w} \\right]^{-1}\\right]^\top=0\
    \ \\quad (7)$\n```\n\nIn linear algebraic terms, this expression shows that the\
    \ vector $\\mathbf{w}^{-1}\\top$ lies in the nullspace of the matrix on the left.\
    \ Note that $[\\mathbf{X} \\quad \\mathbf{y}]$ would not be full rank if we observe\
    \ the data with no noise, since we would have $\\mathbf{y}=\\mathbf{X}\\mathbf{w}$,\
    \ which implies that the columns are linearly dependent. But the observations\
    \ we get have noise, which makes the training data matrix full rank. To compensate,\n\
    \n> Recall the Frobenius norm is the standard Euclidean norm applied to the elements\
    \ of a matrix instead of a vector.\n\n```\n$|\\mathbf{A}||_F^2 = \\sum_i\\sum_j\
    \ A_{ij}^2$\n```"
