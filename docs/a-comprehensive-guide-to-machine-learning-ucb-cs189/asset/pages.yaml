    \n```\n$$\\max_{u,v} \\rho(Xu, Yv) = \\max_{u,v} \\frac{(Xu)^{\top}(Yv)}{\\sqrt{(Xu)^{\t\
    op}(Xu) \\cdot (Yv)^{\top}(Yv)}}\\n= \\max_{u,v} \\frac{(X_w^{\top}X_w)W_x^{-1}u^{\t\
    op}Y_w^{\top}W_y^{-1}v}{\\sqrt{(X_w^{\top}X_w)W_x^{-1}u^{\top}W_x^{-1}u \\cdot\
    \ (Y_w^{\top}Y_w)W_y^{-1}v^{\top}W_y^{-1}v}}}\\n= \\max_{u_w,v_w} \\frac{(X_w^{\t\
