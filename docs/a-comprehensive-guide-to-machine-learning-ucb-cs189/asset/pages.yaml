    ```


    where $\sigma_1 \ge \sigma_2 \ge \dots \ge \sigma_{d+1} > 0$, and $\mathbf{U}$
    and $\mathbf{V}$ are orthogonal matrices. Recall that this implies that multiplication
    by $\mathbf{U}$ or $\mathbf{V}$ does not change the Frobenius norm, so minimizing
    $|\mathbf{E} \mathbf{f}|_F^2$ is equivalent to minimizing $|\mathbf{E}'' \mathbf{f}''|_F^2$
