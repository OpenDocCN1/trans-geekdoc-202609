  md: '# CHAPTER 2. PROBABILISTIC MODELS IN MACHINE LEARNING


    Note that there are two terms: the prior mean $\mu_W$, plus another that depends
    on both the data and the prior. The precision matrix of $W$''s prior $(\Sigma_W^{-1})$
    controls how the data fit affects our estimate.


    To gain intuition, let us consider the simplified case


    ```

    $$\Sigma_W = \begin{bmatrix} \sigma_1^2 & 0 & 0 \ 0 & \sigma_2^2 & 0 \ \vdots
    & \vdots & \vdots \ 0 & 0 & \sigma_n^2 \end{bmatrix}$

    ```


    When the variance $\sigma_j^2$ for dimension $j$ is large, the formulation is
    telling us that $W_j$ may take on a wide range of values. We do not want to penalize
    dimension as much, preferring to let the data fit out. And indeed the corresponding
    entry $\Sigma_W^{-1}$ will be small, as desired.

    Conversely if $\sigma_j^2$ is small, there is little variance in the value of
    $W_j$, so $W_j \approx \mu_j$. As we penalize the magnitude of the data-fit contribution
    to $W_j$ more heavily.


    # Alternative derivation


    MAP with colored noise can be expressed as:


    ```

    $$\mathbf{U, V} \overset{iid}{\simsim \mathcal{N}(\mathbf{0,I})$ \quad (2.1)$

    $\begin{bmatrix} \mathbf{Y} \end{bmatrix} = \begin{bmatrix} \mathbf{R}_Z & \mathbf{XR}_W
    \ 0 & \mathbf{R}_W \end{bmatrix} \begin{bmatrix} \mathbf{U} \ \mathbf{V} \end{bmatrix}
    \quad (2.2)$

    ```


    where $\mathbf{R}_Z$ and $\mathbf{R}_W$ are relationships with $W$ and $Z$, respectively.
    Note that the $\mathbf{R}$ appears twice because our model assumes $\mathbf{Y}
    = \mathbf{XR} + \text{noise}$, so if $\mathbf{W} = \mathbf{R}_W\mathbf{V}$, then
    we must have $\mathbf{Y} = \mathbf{XR}_W\mathbf{V} + \text{noise}.


    We want to find the posterior $W | \mathbf{Y}$. The formulation makes it relatively
    easy to find the posterior of $Y$ conditioned on $\mathbf{W}$ (see below), but
    not vice-versa. So let''s pretend instead


    ```

    $$\mathbf{U'', V''} \overset{iid}{\simsim \mathcal{N}(\mathbf{0,I})$ \n$\begin{bmatrix}
    \mathbf{W} \end{bmatrix} = \begin{bmatrix} \mathbf{A} & \mathbf{B} \ 0 & \mathbf{D}
    \end{bmatrix} \begin{bmatrix} \mathbf{U''} \ \mathbf{V''} \end{bmatrix}$

    ```


    Now $\mathbf{W} | \mathbf{Y} = \mathbf{y}$ is straightforward. Since $\mathbf{V}''
    = \mathbf{D}^{-1}\mathbf{Y}$, the conditional mean and variance of $\mathbf{W}
    | \mathbf{Y} = \mathbf{y}$ can be computed as:


    ```

    $$\mathbf{E}[\mathbf{W} | \mathbf{Y} = \mathbf{y}] = \mathbf{E}[\mathbf{AU''}
    + \mathbf{BV}''] | \mathbf{Y} = \mathbf{y}$

    $\mathbf{E}[\mathbf{AU''} | \mathbf{Y} = \mathbf{y}] + \mathbf{E}[\mathbf{BD}^{-1}\mathbf{Y}
    | \mathbf{Y} = \mathbf{y}$

    $\mathbf{A}\mathbf{E}[\mathbf{U''}] + \mathbf{BD}^{-1}\mathbf{y}\n$\n\mathbf{BD}^{-1}\mathbf{y}$

    ```


    ```

    $$\text{Var}(\mathbf{W} | \mathbf{Y} = \mathbf{y}) = \mathbf{E}[(\mathbf{W} -
    \mathbf{E}[\mathbf{W}])(\mathbf{W} - \mathbf{E}[\mathbf{W}])^T | \mathbf{Y} =
    \mathbf{y}$

    $\mathbf{E}[(\mathbf{AU''} + \mathbf{BD}^{-1}\mathbf{Y})(\mathbf{AU''} + \mathbf{BD}^{-1}\mathbf{Y})^T
    | \mathbf{Y} = \mathbf{y}$

    $\mathbf{E}[(\mathbf{AU''})(\mathbf{U''})^T | \mathbf{Y} = \mathbf{y}$

    $\mathbf{AU''}(\mathbf{U''})^T\mathbf{A}^T$

    ```'
