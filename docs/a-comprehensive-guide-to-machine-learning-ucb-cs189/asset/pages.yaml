    # 7.4 Sparsity and LASSO


    Sparsity for SVMs

    Recall the objective function of the soft-margin SVM problem:


    ```

    $$\min_{w} \frac{1}{2}\|w\|^2 + C\sum_{i=1}^n \xi_i^2$$$

    ```


    Note that if a point $x$ has a nonzero slack $\xi > 0$, by definition it must
    lie outside the margin. Due to the heavy penalty factor $C$ for penalizing the
    margin there are relatively few such points, and thus the slack $\xi$ is **sparse**—most
    of its entries are zero. We are interested in explaining why this phenomenon occurs
    in this specific optimization problem, and identifying the key properties that
    determine sparse solutions for arbitrary optimization problems.


    To reason about the SVM case, let''s see how changing some arbitrary slack variable
    $\xi_i$ affects the loss. A decrease in $\xi_i$ results in a "reward" of $C_i$
    and is captured by the partial derivative $\frac{\partial}{\partialxi_i}$. Note
    that no matter what the current value of $\xi_i$ is, the reward for decreasing
    $\xi_i$ is constant. Of course, $\xi_i$ may change the boundary and the cost attributed
    to the size of the margin. The overall reward for decreasing $\xi_i$ is either
    to worth the effort (greater than cost incurred from $w$) or not worth the effort
    (less than cost incurred from $w$). Intuitively, $\xi_i$ will continue to decrease
    until it hits a lower-bound "equilibrium"—which is just 0.


    Now consider the following formulation (constrained for brevity):


    ```

    $$\min_{w} \frac{1}{2}\|w\|^2 + C\sum_{i=1}^n \xi_i^2$$$

    ```


    The reward for decreasing $\xi_i$ is no longer constant—at any point, a decrease
    in $\xi_i$ results in a "reward" of $2C\xi_i$. As $\xi_i$ approaches 0, the rewards
    get smaller and smaller, infinitesimally affecting the values of $\|w\|^2$. On
    the other hand, decreasing $\xi_i$ causes a finite increase in the cost incurred
    by the $\|w\|^2$—the same increase as in the previous example. Intuitively, we
    can reason that there will be a threshold value $\xi^*$ such that decreasing $\xi_i$
    further will no longer outweigh the cost incurred by the size of the margin, and
    that $\xi_i$ will halt their descent before they hit zero.


    There are many advantages for optimization problems with sparse solutions. One
    advantage of sparse solutions is that they speed up testing time. In the context
    of primal problems, if the weight vector $w$ is sparse, then as we compute $w$
    in training, we can discard features/dimensions with 0 weight, as they will contribute
    nothing to the evaluation of the hypothesized regression values of test points.
    A similar reasoning applies to dual with weight vector $v$,'
