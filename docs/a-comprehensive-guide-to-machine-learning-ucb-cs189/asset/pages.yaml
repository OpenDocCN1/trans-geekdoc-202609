    \ - E[h(x;\\mathcal{D})])] \\cdot E[h(x;\\mathcal{D}) - Y]\\right]$$$\n$= Var((h(x;\\\
    mathcal{D})\\right)) + E\\left[\\left(E[h(x;\\mathcal{D})] - Y\\right)^2\\right]$$\n\
    $= Var\\left((h(x;\\mathcal{D})\\right) + E\\left[\\left(E[h(x;\\mathcal{D})]\
    \ - E[Y]\\right)^2 + E\\left[\\left(Y - E[Y])\\right)^2\\right]\\right] + 2E\\\
    left[(h(x;\\mathcal{D}) - E[Y]) \\cdot E[Y - E[Y]]\\right] = Var$$$\n$= Var\\\
    left((h(x;\\mathcal{D})\\right) + E\\left[\\left(E[h(x;\\mathcal{D})] - E[Y]\\\
    right)^2 + E\\left[\\left(Y - E[Y])\\right)^2\\right]\\right]$$\n$= Var\\left((h(x;\\\
    mathcal{D})\\right) + E\\left[\\left(E[h(x;\\mathcal{D})] - E[Y]\\right)^2\\right]\
    \ + Var(Y)$$$\n$= Var\\left((h(x;\\mathcal{D})\\right) + E\\left[\\left(h(x;\\\
    mathcal{D}) - f(x)\\right)^2\\right] + Var(N)$$$\n$= E\\left[[E[h(x;\\mathcal{D})]\
    \ - f(x)]^2\\right] + Var(h(x;\\mathcal{D})) + Var(N)$$\n$\\over{bias^2}{of method}\
    \ \\over{variance}{of method} \\over{irreducible error}$\n```\n\n# # Experiments\n\
