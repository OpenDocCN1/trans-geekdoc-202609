    Now, to talk about the idea of "how sure" we are, we''ll use the ideas of **surprise**
    and **entropy**. The numerical surprise of observing that a random variable $X$
    takes on value $k$ is:


    ```

    $\log \frac{1}{P(X = k)} = -log P(X = k)$

    ```


    The entropy of a random variable $H(X)$ is:


    ```

    $H(X) = E[surprise]

    = E_X[\log \frac{1}{P(X = k)}]

    = \sum_{k} P(X = k) \log \frac{1}{P(X = k)}$

    ```


    Here''s a graph of entropy vs. $P(X = k)$ for a **binary discrete random variable**
    $X$ (as in, $k \in \{0,1\}$):


    ![](img/99defe26aebed215976e83d281581f33_131_0.png)


    Observe that (1) it''s convex and (2) it''s maximized when the probability distribution
    is **even** with respect to the outcomes. To say that, a coin is completely fair
    $P(X = 0) = P(X = 1) = 0.5$ has more entropy than a coin that is biased. This
    is because we are less sure of the outcome of the fair coin than the biased coin
    *overall*. Even though we are surprised when the biased coin comes up as its unlikely
    outcome, the way that entropy gives a higher uncertainty score to the fair coin.
    In general, a random variable has more entropy when the distribution of its outcomes
    is closer to uniform and less entropy when the distribution is highly skewed to
    one outcome.


    # **An assumption**


    By the way, it''s strange entropy is defined for random variables when there are
    no random variables in a training set. To address this, we make the assumption
    that a random variable $X$ on the possible classes is representative of our training
    set. The entropy of $X$ is defined by our training points $(x_i, y_i)$, where
    $P(X = c_j) = \frac{n_j}{n}$ being the number of training points whose $y_i$ is
    $c_j$.


    So we know that when we choose a split-feature, split-value pair, we want to *reduce
    entropy* in some way. Let $Y_{f_i}$ be an indicator function that is 1 for a data
    point if its feature $f_i$ is less than $v$. Note that $Y$ is not a random variable,
    though we will use it in some notations that make'
