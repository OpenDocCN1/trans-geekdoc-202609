    have $E(R^2)=d\sigma^2$, in expectation a random Gaussian will actually be reasonably
    far from the origin. If $\sigma=1$, then $R^2$ is distributed chi-squared with
    $d$ degrees of freedom. One can show that in high dimensions, with high probability
    multivariate Gaussian will lie within an annular region $|R^2 - E(R^2)| \leq d^{1/2+\epsilon}$
    where $E(R^2)=d\sigma^2$ (one possible approach is to note that as $d \to \infty$,
    the chi-squared approaches a Gaussian by the CLT, and a Chernoff bound to show
    exponential decay). This phenomenon is known as concentration of measure. Without
    resorting to more complicated inequalities, we can show a simple result: which
    is known


    **Theorem:** If $X_i \sim N(0, \sigma^2), i=1,\dots$ are independent and $R^2=\sum_{i=1}^d
    X_i^2$, then for every $\epsilon > 0$, the following holds:


    ```

    $$\lim_{d \to \infty} P(|R^2 - E(R^2)| \geq d^{1/2+\epsilon}) = 0$

    ```


    Thus in the limit, the squared radius is concentrated about its mean.


    *Proof.* From the formula for the variance of a chi-squared distribution, we see
    that $Var(R^2)=d\sigma^4$.

    Applying a Chebyshev bound yields


    ```

    $P(|R^2 - E(R^2)| \geq d^{1/2+\epsilon}) \leq \frac{2d\sigma^4}{d+1} \xrightarrow{d
    \to \infty} 0$

    ```


    Thus a random Gaussian will lie within a thin annular region away from the origin
    in high dimensions with high probability, though the mode of the Gaussian bell
    curve is at the origin. This illustrates the phenomenon in high dimensions where
    random data is spread far apart. The k-NN classifier was designed on the principle
    that nearby points are spread of the same class however, in high dimensions, even
    the nearest neighbors that we have to a random test point tend to be far away,
    so this principle is no longer useful.


    # Improving k-NN


    There are two ways to improve k-NN and overcome the shortcomings we have discussed.


    +   1. Obtain more training data.


    +   2. Reduce the dimensionality of the features and/or pick better features.
    Consider other choices of distance function.


    One example of reducing the dimensionality in image space is to lower the resolution
    of the image while this is throwing some of the original pixel features away,
    we may still be able to get the same or better performance with a nearest neighbors
    method.


    We can also modify the distance function. For example, we have a family of **Minkowski
    distances** that are induced by the $L^p$ norms:


    ```

    $D_p(x,z) = \left( \sum_{i=1}^d |x_i - z_i|^p \right)^{1/p}$

    ```


    Without preprocessing the data, I-NN with the $L^3$ distance outperforms I-NN
    with $L^2$ on MNIST.'
