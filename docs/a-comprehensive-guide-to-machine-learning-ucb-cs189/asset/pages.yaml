- pgno: 28
  md: '# 2.2. BIAS-VARIANCE TRADEOFF


    Var(Y) = Var(f(x) + N) = Var(N)


    Also, in general any random variable Z, we have


    Var(Z) = E[(Z - E[Z])^2] = E[Z^2] - E[Z]^2 ⇒ Var(Z) + E[Z]^2


    Let''s use these facts to decompose error


    ```

    $$\epsilon(x;h) = E[(h(x;D) - Y)^2] = E[h(x;D)^2 + E[Y]^2 - 2E[h(x;D) \cdot Y]]$\n=
    (Var(h(x;D)) + E[h(x;D)]^2 + (Var(Y) + E[Y]^2) - 2E[h(x;D) \cdot D]) \cdot E[Y])$\n=
    (E[h(x;D)^2 - 2E[h(x;D)] \cdot E[Y] + E[Y]^2 + Var(h(x;D)) + Var(Y))$\n= (E[h(x;D)
    - f(x))^2 + Var(h(x;D)) + Var(Y)\n= (E[h(x;D) - f(x))^2 + \underbrace{Var(h(x;D))}_{variance
    of method} + \underbrace{Var(N)}_{irreducible error})$

    ```


    Recall that for two independent variables D and Y, $g_1(D)$ and $g_2(Y)$ are also
    independent, for functions $g_1, g_2$. This implies that $h(x;D)$ and $Y$ are
    independent, allowing to express $E[h(x;D) \cdot Y] = E[h(x;D)] \cdot E[Y]$ in
    the second line of the derivation. The final decomposition, also as the **bias-variance
    decomposition**, consists of three terms:


    +   * **Bias of method**: Measures how much the average (over all possible training
    sets) can come to the true value $f(x)$, for a fixed value of $x$. A low bias
    means that the aggregator $h(x)$ accurately estimates $f(x).

    * **Variance of method**: Measures the variance of the hypothesis (over all possible
    training sets), for a fixed value of $x$. A low variance means that the prediction
    does not change much as the training sets vary. An unbiased-method (bias = 0)
    could have a large variance.

    * **Irreducible error**: This is the error in our model that we cannot control
    or eliminate, because it is due to errors in our noisy observation $Y$.


    The decomposition allows us to measure the error in bias, variance, and irreducible
    error. Irreducible error has no relation to the hypothesis model, so we can ignore
    it in theory when minimizing the error. As we have discussed, models that have
    very little bias because on average can find the true underlying model value $f(x)$
    very well, but have high variance and are very far from $f(x)$ on an individual
    basis.


    Note that the error is only for a fixed input $x$, but in regression our goal
    is to minimize the average error over all possible values of $X$. If we know the
    distribution for $X$, we can find the effectiveness of a hypothesis model as a
    whole by taking an expectation of the error over all possible values of $x$: $E[\epsilon(x;h)]$.


    # Alternative Decomposition


    The previous derivation is short, but may seem somewhat arbitrary. Let''s explore
    an alternative derivation. At its core, it use the technique that $E[(Z - Y)^2]
    = E[(Z - E[Z]) + (E[Z] - Y)^2]$ which decomposes to easily use the variance of
    $Z$ and other terms.


    $\epsilon(x;h) = E[(b(x;D) - Y)^2]$'
