    op}v_w}}}\\n= \\max_{u_w,v_w} \\frac{u_w^{\top}X_w^{\top}X_w u_w}{\\sqrt{u_w^{\t\
    op}X_w^{\top}X_w u_w \\cdot v_w^{\top}Y_w^{\top}Y_w v_w}}$\n```"
