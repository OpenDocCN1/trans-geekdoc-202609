  md: "# 5.2. TRAINING NEURAL NETWORKS\n\nTo evaluate the expectation, we condition\
    \ on the past (i.e. all random decisions that contributed to $w^{(k)}$, including\
    \ choices of points to evaluate the gradient at). By the law of iterated expectation,\
    \ we have\n\n$$E[(w^{(k)} - w^*)G_k] = E_{\text{past}}[E[(w^{(k)} - w^*)G_k \\\
    mid \text{past}]]$\n\nThe next expectation is taken over the choice of training\
    \ points used to compute the stochastic gradient. But given the past (which includes\
    \ $w^{(k)}$), we already know $u^{(k)}$, so\n\n$$E[(w^{(k)} - w^*)G_k \\mid \t\
    ext{past}] = (w^{(k)} - w^*)E[G_k \\mid \text{past}]$\n\nThe current $G_k$ depends\
    \ on our choice of evaluation point, which is presumed independent of the past\
    \ and thus $E[G_k \\mid \text{past}] = E[G_k \\mid w^{(k)}]$, where the second\
    \ equality holds because $G_k$ is an unbiased estimator for the true gradient\
    \ at $w^{(k)}$. Putting this together, we have\n\n$$E[(w^{(k)} - w^*)G_k] = E_{\t\
    ext{past}}[(w^{(k)} - w^*) \nabla f(w^{(k)})]$$\n\nFirst order conditions for\
    \ optimality imply that $\nabla f(w^*) = 0$. By the assumption of $\\ell$-strong\
    \ convexity, we have\n\n$$$(w^{(k)} - w^*)T \nabla f(w^{(k)}) = \\langle w^{(k)}\
    \ - w^*, \nabla f(w^{(k)}) - \nabla f(w^*) \rangle \\ge \\ell \\|w^{(k)} - w^*\\\
    |_2^2$\n\nTaking expectations\n\n$$E[(w^{(k)} - w^*) \nabla f(w^{(k)})] \\ge \\\
    ell \\|w^{(k)} - w^*\\|_2^2 = \\ell d_k$\n\nPutting this into account for $d_{k+1}$,\
    \ we get\n\n$$d_{k+1} \\le d_k - 2\\alpha_k d_k + \\alpha_k^2 M^2 = (1 - 2\\alpha_k)d_k\
    \ + \\alpha_k^2 M^2$\n\nThe $\\alpha_k^2 M^2$ term is introduced by the randomness.\
    \ We can then tend to this to 0 by diminishing the step size $\\alpha_k$ over\
    \ time - but decreasing $\\alpha_k$ will also decrease the effect of the\n\nSetting\
