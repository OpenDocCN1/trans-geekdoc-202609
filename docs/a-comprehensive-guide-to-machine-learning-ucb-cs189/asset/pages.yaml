  md: "# CHAPTER 5. NEURAL NETWORKS\n\nBy the linearity of differentiation, we see\
    \ that\n\n```\n$$\\nabla L(w) = \\frac{1}{n} \\sum_{i=1}^n \\nabla_w \\ell(x_i,\
    \ w, y_i)$\n```\n\nSo computing the gradient takes time in linear in $n$. In the\
    \ “big data” regime, $n$ is very large, this cost may be unacceptable.\n\nFor\
    \ this reason, we have reason to try to approximate the gradient of the loss function\
    \ of a neural network by taking a representative random sample of the inputs to\
    \ calculate the gradient. Since gradient descent is an iterative process, we might\
    \ consider forfeiting the exactness of the update of each iteration for better\
    \ speed of computation. If we take the gradient over a random sample of these\
    \ training samples at each step, we will get a noisy or unbiased estimate of the\
    \ true gradient. The noise in each step is often an acceptable tradeoff in exchange\
    \ for the opportunity to take more steps.\n\nIn the regular descent update, we\
    \ have the policy:\n\n```\n$w^{(k+1)} \\leftarrow w^{(k)} - \\alpha_k \\nabla_w\
    \ L(w^{(k)})$\n```\n\nIn stochastic gradient descent, we have the update rule:\n\
    \n```\n$w^{(k+1)} \\leftarrow w^{(k)} - \\alpha_k G_k$\n```\n\nwhere $G_k$ is\
    \ a random variable which satisfies $\\mathbb{E}[G_k] = \\nabla L(w^{(k)})$. Typically\
    \ $G_k$ is constructed by sampling $m < n$ training points uniformly at random\
    \ (the index is $I_k \\subset \\{1, \\dots, n\\}$) and computing the gradient\
    \ on these points:\n\n```\n$G_k = \\frac{1}{m} \\sum_{i \\in I_k} \\nabla_w \\\
    ell(x_i, y_i)$\n```\n\nWe denote the optimal by $w^*$. Our goal is to show the:\n\
    \n```\n$$\\lim_{k \\to \\infty} \\mathbb{E}[||w^{(k)} - w^*|^2] = 0$\n```\n\n\
    We make the following assumptions in the analysis:\n\n+   1. The loss function\
    \ $f$ is $\\ell$-strongly convex; that is, there exists an $\\ell > 0$ such that\
    \ $(\\nabla f(x) - \\nabla f(y))^\top(x - y) \\geq \\ell ||x - y||^2$ for all\
    \ $x, y$.\n2. The expected square norm of the stochastic gradient is bounded by\
    \ $\\mathbb{E}[||G_k||^2] \\leq M^2 < \\infty$.\n\nWe begin by expanding the desired\
    \ term:\n\n```\n$$\\mathbb{E}[||w^{(k+1)} - w^*|^2]$\\n= \\mathbb{E}[(w^{(k+1)}\
    \ - w^*)^\top(w^{(k+1)} - w^*)]\\n= \\mathbb{E}((w^{(k)} - w^*)^\top \\alpha_k\
    \ G_k)^\top(w^{(k)} - w^* - \\alpha_k G_k)]\\n= \\mathbb{E}[||w^{(k)} - w^*||^2\
    \ - 2\\alpha_k \\mathbb{E}[(w^{(k)} - w^*)^\top G_k] + \\alpha_k^2 \\mathbb{E}[||G_k||^2]]$\n\
    ```\n\nFor brevity, define\n\n```\n$d_k = \\mathbb{E}[||w^{(k)} - w^*||^2]$\n\
    ```\n\nOur assumption on the expected square norm of $G_k$ implies\n\n```\n$d_{k+1}\
    \ \\leq d_k - 2\\alpha_k \\mathbb{E}[(w^{(k)} - w^*)^\top G_k] + \\alpha_k^2 M^2$\n\
    ```"
