    \ \\ln p_i + (1 - y_i) \nabla_w \\ln(1 - p_i)$$n$$-\\sum_{i=1}^{n} \\frac{y_i}{p_i}\
    \ \nabla_w p_i - \\frac{1 - y_i}{1 - p_i} \nabla_w p_i$$\n$$-\\sum_{i=1}^{n} \\\
