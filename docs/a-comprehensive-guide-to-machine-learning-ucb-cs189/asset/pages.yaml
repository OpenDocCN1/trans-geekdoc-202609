    mathbf{0}, \\Sigma_Z)$**, and **$\\mathbf{y} \\sim \\mathcal{N}(\\mathbf{Xw},\
    \ \\Sigma_Z)$**.\n\n$\\mathbf{w}^* = \\arg \\max_{\\mathbf{w} \\in \\mathbb{R}^n}\
    \ \\frac{1}{\\sqrt{\\det(\\Sigma_Z)}(\\sqrt{2\\pi})^n}} e^{-\\frac{1}{2}(\\mathbf{y}-\\\
    mathbf{Xw})^T\\Sigma_Z^{-1}(\\mathbf{y}-\\mathbf{Xw})}$ \\quad (2.1)\n\n$\\arg\
    \ \\min_{\\mathbf{w} \\in \\mathbb{R}^n} (\\mathbf{y}-\\mathbf{Xw})^T\\Sigma_Z^{-1}(\\\
    mathbf{y}-\\mathbf{Xw})$ \\quad (2.2)\n\nNote that **$\\Sigma_Z$** is symmetric,\
    \ which means it has a good eigen structure, we can take the interpret geometrically.\
    \ **$\\Sigma_Z$** can be written as\n\n$\\Sigma_Z = \\mathbf{Q} \begin{pmatrix}\
