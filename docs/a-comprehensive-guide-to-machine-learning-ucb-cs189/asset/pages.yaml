    \nHowever, since what we really want is an estimate of $\tilde{Y}$ given when\
    \ (zero-mean) observations $\tilde{X}$ (or vice-versa), it's useful to have the\
    \ entire series of transformations that relate the two. The predicted canonical\
    \ variables are given by\n\n```\n$\tilde{Y}_c = \tilde{X}_c A = U(U^T X^T X U)^{-1}\
    \ U^T X^TV$\n```\n\nThen we use the canonical variables to compute the actual\
    \ values:\n\n```\n$\\hat{Y} = Y_v(V^T)^{-1}V^T$\n$= \tilde{X}(U^T X^T X U)^{-1}(U^T\
    \ X^T YV)(V^T)^{-1}V^T$\n```\n\nWe can collapse all these into a single matrix\
    \ $A_{eq}$ that gives the prediction $\\hat{Y}$ from $\tilde{X}$:\n\n```\n$A_{eq}\
    \ = \\frac{U}{\text{projection}} \\frac{(U^T X^T X U)}{\text{whitening}} \\frac{(U^T\
    \ X^T YV)}{\text{decorrelation}} \\frac{(V^T)^{-1}V^T}{\text{back}}$\n```\n\n\
    # 3.4 Dimensionality Reduction\n\nThere are many issues with high dimensions.\
    \ As the dimension $d$ grows, machine learning algorithms can become more computationally\
    \ intensive. It becomes more difficult to visualize our data - humans are notoriously\
    \ bad at visualizing 3 dimensions. Additionally, redundant features can add more\
    \ noise than signal. There is a widely held belief that most natural data in high\
    \ dimensions (for example, data used in genomics) can be represented in a lower\
    \ dimensional space.\n\nDimensionality reduction is an *unsupervised method* -\
    \ unlike supervised learning, there are no labels that we need to match, no classes\
    \ to predict. As such, defining problems becomes more subjective and heuristic.\
    \ One approach to dimensionality reduction is feature selection, in which we remove\
    \ features... example, the LASSO provides this feature selection using $L^1$ regularization.\n\
    \nAnother approach to dimensionality reduction is learning latent features. This\
    \ approach seeks to find latent features that are transformations of our features\
    \ that represent the data world.\n\n# Principal Components Analysis\n\nPCA can\
    \ be used for dimensionality reduction. Recall that finding the PCA decomposition\
    \ of $X \\in \\mathbb{R}^{n \times d}$ amounts to finding the SVD\n\n```\n$X =\
    \ USV^T$\n```\n\nSuppose $d << D$, and let $\tilde{U}, \tilde{S}, \tilde{V}$ contain\
    \ the first $d$ columns of $U, S, V$ respectively. Then $\tilde{V}^T x$ projects\
    \ data $x$ into a $d$-dimensional latent space. This projection into a lower-dimensional\
    \ space"
