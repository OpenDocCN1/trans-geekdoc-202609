    ```\n\nwhere $k \\le r$, it is the best rank-$k$ approximation to **A** in the\
    \ sense that\n\n> $||\\mathbf{A} - \\mathbf{A}_k||_F \\le ||\\mathbf{A} - \\hat{\\\
    mathbf{A}}||_F$\n\nfor any $\\hat{\\mathbf{A}}$ such that $rank(\\hat{\\mathbf{A}})\
    \ \\le k$.\n\n# 3.2 Principal Component Analysis\n\nIn machine learning, the data\
    \ we have are often very high-dimensional. There are a number of reasons why we\
    \ might want to work with a lower-dimensional representation:\n\n+   - Visualization\
    \ (if we can get down to 2 or 3 dimensions), e.g. for exploratory data analysis\n\
    \n+   - Reduce computational load\n\n+   - Reduce noise\n\n**Principal Component\
    \ Analysis (PCA)** is an unsupervised dimensionality reduction technique. Given\
    \ a matrix of data points, it finds one or more orthogonal directions that capture\
    \ the largest amount of variance in the data. Intuitively, the directions with\
    \ less variance contain less information and may be discarded without introducing\
    \ too much error.\n\n# Projection\n\nLet us review the meaning of scalar projection\
    \ of one vector onto another. If $u \\in \\mathbb{R}^d$ is a unit vector, i.c.\
    \ $||u|| = 1$, the projection of another vector $x \\in \\mathbb{R}^d$ onto $u$\
    \ is given by $x^\top u$. This quantity tells us roughly much the projected vector\
    \ $x$ lies along the direction direction $u$. Why does this expression make sense?\
    \ Recall the slightly more general formula which holds for vectors of any length:\n\
    \n```\n$x^\top u = ||x|| ||u|| \\cos \\theta$\n```\n\nwhere $\theta$ is the angle\
    \ between the vectors. In this case, since $||u|| = 1$, the expression simplifies\
    \ to $x^\top u = ||x|| \\cos \\theta$. But since cosine gives the ratio of the\
    \ adjacent side (the projection we want to find) to the hypotenuse ($||x||$),\
    \ this is exactly what we want:"
