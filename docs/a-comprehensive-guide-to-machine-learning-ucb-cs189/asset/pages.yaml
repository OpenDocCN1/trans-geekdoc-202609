  md: "# Probabilistic View\n\nAs in MLE, we assume that our observations $y$ are\
    \ noisy, now suppose that some of the $y_i$ are more noisy than others. How can\
    \ we take this into account in our learning algorithm so we can get a better estimate\
    \ of the weights?\n\nOur probabilistic model looks like\n\n```\n$y_i = x_i^T w\
    \ + Z_i$\n```\n\nwhere the $Z_i$ are still independent Gaussians random variables,\
    \ but not necessarily identical $Z_i \\sim \\mathcal{N}(0, \\sigma_i^2)$. We can\
    \ morph the problem into an MLE by scaling the data to make sure all the $Z_i$'s\
    \ are identically distributed, by dividing by $\\sigma_i$;\n\n```\n$\\frac{y_i}{\\\
    sigma_i} = \\frac{x_i^T w}{\\sigma_i} + \\frac{Z_i}{\\sigma_i}$\n```\n\nNote that\
    \ the scaled noise entries are now i.i.d:\n\n```\n$\\frac{Z_i}{\\sigma_i} \\overset{i.i.d}{\\\
    sim} \\mathcal{N}(0,1)$\n```\n\nWe rewrite our original as a scaled MLE problem:\n\
    \n```\n$w_{WLS}^* = \\arg \\min_{w \\in \\mathbb{R}^d} \\sum_{i=1}^n \\frac{(\\\
    frac{y_i}{\\sigma_i} - \\frac{x_i^T w}{\\sigma_i})^2}{2} + n \\log \\sqrt{2\\\
    pi}$\n```\n\nThe MLE estimate of this scaled problem is equivalent to the MLS\
    \ original of the problem:\n\n```\n$w_{WLS}^* = (\\mathbf{X}^T \\boldsymbol{\\\
    Sigma}_z^{-1} \\mathbf{X})^{-1} \\mathbf{X}^T \\boldsymbol{\\Sigma}_z^{-1} \\\
    mathbf{y} = (\\mathbf{X}^T \\boldsymbol{\\Sigma}_z^{-1} \\mathbf{X})^{-1} \\mathbf{X}^T\
    \ \\boldsymbol{\\Sigma}_z^{-1} \\mathbf{y}$\n```\n\nwhere\n\n```\n$\\boldsymbol{\\\
    Sigma}_z = \\begin{bmatrix} \\sigma_1^2 & 0 & \\dots & 0 \\ 0 & \\sigma_2^2 &\
    \ \\dots & 0 \\ \\vdots & \\vdots & \\ddots & \\vdots \\ 0 & 0 & \\dots & \\sigma_n^2\
    \ \\end{bmatrix}$\n```\n\nNote that as no $\\sigma_i$ is 0, $\boldsymbol{\\Sigma}_z$\
    \ is invertible. Note that $\\omega_i$ from the optimization perspective is directly\
    \ related to $\\sigma_i^2$ from the probabilistic perspective: $\\omega_i = \\\
    frac{1}{\\sigma_i^2}$. As the variance $\\sigma_i^2$ of the noise corresponding\
    \ to data point $i$ decreases, the weight $\\omega_i$ increases: we are more concerned\
    \ about fitting data point $i$ because it is likely to match the true underlying\
    \ denoised point. Inversely, as the variance $\\sigma_i^2$ increases, the weight\
    \ $\\omega_i$ decreases: we are less concerned about fitting data point $i$ because\
    \ it is noisy and should not be trusted.\n\n# Dependent Noise\n\nIf the $Z_i$'s\
    \ aren't independent? This usually happens for time series data. Again, we assume\
    \ a model for how the noise behaves. The noise entries are not independent, but\
    \ there is a known process:\n\ne.g. $y_{i+1} = rZ_i + U_i$ where $U_i \\sim \\\
    mathcal{N}(0,1)$, i.i.d, $-1 \\le r \\le 1$ (so that it doesn't blow up) or a\
    \ \"sliding window\" example (like echo of audio) where $Z_i = \\sum r_j U_{i-j},\
    \ U_i \\sim \\mathcal{N}(0,1)."
