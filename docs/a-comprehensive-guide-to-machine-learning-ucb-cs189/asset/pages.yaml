  md: '# # Chapter 1


    # # Regression, Validation


    # ## 1.1 Regression


    Our goal in machine learning is to extract a *relationship* from data. In **regression**
    tasks, the relationship takes the form of a function $y = f(\mathbf{x})$, where
    $y \in \mathbb{R}$ is some quantity that can be predicted from an input $\mathbf{x}
    \in \mathbb{R}^d$, which should for the time being thought of as some collection
    of numerical measurements. The true relationship $f$ is unknown, and our aim is
    to recover it as well as we can from data. Our end product is a function $\hat{h}(\mathbf{x})$,
    called the **hypothesis**, which should approximate $f$. We assume that we have
    access to a dataset $\mathcal{\mathcal{D}} = \{(\mathbf{x}_i, y_i)\}_{i=1}^n$;
    where each pair $(\mathbf{x}_i, y_i)$ is an example (possibly noisy or otherwise)
    of the input-output mapping to be learned. Since learning arbitrary functions
    is intractable, we restrict ourselves to some **hypothesis class** $\mathcal{H}$
    of allowable functions. we typically employ a **parametric model**, meaning that
    there is some finite-dimensional vector $\mathbf{w} \in \mathbb{R}^d$, the elements
    of which are known as **parameters** or **weights**, that controls the behavior
    of the function. That is,


    > $h_{\mathbf{w}}(\mathbf{x}) = g(\mathbf{x})$$


    for other function $g$. The hypothesis is the set of all functions induced by
    the possible choices of the parameters $\mathbf{w}$:


    > $\mathcal{H} = \{h_{\mathbf{w}} \mid \mathbf{w} \in \mathbb{R}^d\}$


    After designating a **cost function** $L$, which measures how poorly the prediction
    $\hat{y}$ of the hypothesis match the true output $y$, we can proceed to search
    for the parameters that best fit the data by minimizing this function:


    > $\mathbf{w}^* = \arg \min_{\mathbf{w}} L(\mathbf{w})$$


    # ## 1.2 Ordinary least squares


    Ordinary least squares is one of the simplest regression problems, but it is well-understood
    and practically useful. It is a **linear regression** problem, which means that
    we take $h_{\mathbf{w}}(\mathbf{x}) = \mathbf{x}^T \mathbf{w}$. We want


    > $y_i \approx \hat{y}_i = h_{\mathbf{w}}(\mathbf{x}_i) = \mathbf{x}_i^T \mathbf{w}$'
  merge: -1
  img_proc: true
- pgno: 5
  md: "each $i = 1, \\dots, n$. This set of equations can be written in matrix form\
    \ as\n\n$\\begin{bmatrix} y_1 \\ \\ y_n \\ y \\end{bmatrix} \\approx \begin{bmatrix}\
    \ \\mathbf{x}_1 \\ \\ \\mathbf{x}_n \\ \\mathbf{x} \\end{bmatrix} \begin{bmatrix}\
    \ w_1 \\ \\ w_d \\ w \\end{bmatrix}$\n\nIn words, the matrix $\\mathbf{X} \\in\
    \ \\mathbb{R}^{n \times d}$ has the input datapoint $\\mathbf{x}_i$ as its $i$-th\
    \ row. This matrix is sometimes called the **design matrix**. Usually $n \\ge\
    \ d$, meaning that there are more datapoints than measurements.\n\nThere will\
    \ be in general no exact solution to the equation $\\mathbf{y} = \\mathbf{Xx}$\
    \ (even if the data were perfect, consider how many equations and variables there\
    \ are), but we can find an approximate solution by minimizing the sum (or equivalently,\
    \ the mean) of the squared errors:\n\n```\n$L(\\mathbf{w}) = \\sum_{i=1}^n(\\\
    mathbf{x}_i^\top\\mathbf{w} - y_i)^2 = ||\\mathbf{Xx} - \\mathbf{y}||_2^2$\n```\n\
    \nNow that we have formulated an optimization problem, we want to go about solving\
    \ it. We will see that the particular structure of OLS allows us to compute a\
    \ closed-form expression for a globally optimal solution, which we denote $\\\
    mathbf{w}_{OLS}$.\n\n# Approach 1: Vector calculus\n\nCalculus is the primary\
    \ mathematical workhorse for studying the optimization of differentiable functions.\
    \ Recalling the following important result: if $L: \\mathbb{R}^d \\to \\mathbb{R}$\
    \ is continuously differentiable, then any local optimum $\\mathbf{w}^*$ satisfies\
    \ $\\nabla(\\mathbf{w}^*) = \\mathbf{0}$. In the OLS case,\n\n```\n$||\\mathbf{Xx}\
    \ - \\mathbf{y}||_2^2\\n=(\\mathbf{Xx} - \\mathbf{y})^\top(\\mathbf{Xx} - \\mathbf{y})\\\
    n=(\\mathbf{Xx} - \\mathbf{y})^\top\\mathbf{Xx} - \\mathbf{y}^\top\\mathbf{Xx}\
    \ + \\mathbf{y}^\top\\mathbf{y}\\n=\\mathbf{w}^\top\\mathbf{X}^\top\\mathbf{Xx}-2\\\
    mathbf{w}^\top\\mathbf{X}^\top\\mathbf{y} + \\mathbf{y}^\top\\mathbf{y}$\n```\n\
    \nUsing the following results from matrix calculus\n\n```\n$\\nabla(\\mathbf{a}^\t\
    op\\mathbf{x}) = \\mathbf{a}\\n\\nabla(\\mathbf{Ax}^\top\\mathbf{x}) = (\\mathbf{A}\
    \ + \\mathbf{A}^\top)\\mathbf{x}$\n```\n\nthe gradient of $L$ is easily seen to\
    \ be\n\n```\n$\\nabla_{\\mathbf{w}}(L) = \\nabla_{\\mathbf{w}}(\\mathbf{w}^\t\
    op\\mathbf{X}^\top\\mathbf{Xx}-2\\mathbf{w}^\top\\mathbf{X}^\top\\mathbf{y} +\
    \ \\mathbf{y}^\top\\mathbf{y})\\n=\\nabla_{\\mathbf{w}}(\\mathbf{w}^\top\\mathbf{X}^\t\
    op\\mathbf{Xx})-2\\nabla_{\\mathbf{w}}(\\mathbf{w}^\top\\mathbf{X}^\top\\mathbf{y})\
    \ + \\nabla_{\\mathbf{w}}(\\mathbf{y}^\top\\mathbf{y})\\n=2\\mathbf{X}^\top\\\
    mathbf{Xx}-2\\mathbf{X}^\top\\mathbf{y}$\n```\n\nin the last line we have used\
    \ the symmetry of $\\mathbf{X}^\top\\mathbf{X}$ to simplify $\\mathbf{X}^\top\\\
    mathbf{X} + (\\mathbf{X}^\top)^\top = 2\\mathbf{X}^\top\\mathbf{X}$. Setting the\
    \ gradient to $\\\\mathbf{0}$, we conclude that any optimum $\\mathbf{w}_{OLS}^*$\
    \ satisfies\n\n```\n$\\mathbf{X}^\top\\mathbf{w}_{OLS} = \\mathbf{X}^\top\\mathbf{y}$\n\
    ```"
