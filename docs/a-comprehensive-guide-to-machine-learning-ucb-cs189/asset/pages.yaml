    # # Multiclass Logistic Regression


    Instead of finding the gradient with respect to all of the parameters of the matrix
    $W$, let''s find with respect to one row of $W$ at a time:


    $$\nabla_{w_l} L(W) = \nabla_{w_l} \left( -\sum_{j=1}^{K} y_i[j] \cdot \ln \left(
    \frac{e^{w_l^T x_i}}{\sum_{k=1}^{K} e^{w_k^T x_i}} \right) \right) $$


    $= -\sum_{i=1}^{n} \sum_{j=1}^{K} y_i[j] \cdot \nabla_{w_l} \left( \ln \left(
    \frac{e^{w_l^T x_i}}{\sum_{k=1}^{K} e^{w_k^T x_i}} \right) \right) $$


    $= -\sum_{i=1}^{n} \sum_{j=1}^{K} y_i[j] \cdot \left( \nabla_{w_l} w_l^T x_i -
    \nabla_{w_l} \ln \sum_{k=1}^{K} e^{w_k^T x_i} \right) $$


    $= -\sum_{i=1}^{n} \sum_{j=1}^{K} y_i[j] \cdot \left( \mathbb{1}\{j=l\} x_i -
    \frac{e^{w_l^T x_i}}{\sum_{k=1}^{K} e^{w_k^T x_i}} X_i \right) $$


    $= -\sum_{i=1}^{n} \sum_{j=1}^{K} y_i[j] \cdot \left( \mathbb{1}\{j=l\} - \frac{e^{w_l^T
    x_i}}{\sum_{k=1}^{K} e^{w_k^T x_i}} \right) x_i $$


    $= -X^T (\mathbb{1}\{y_i=l\} - P(Q_i=l)) $$


    The use of indicator functions: $\mathbb{1}\{j=l\}$ evaluates to 1 if $j=l$, otherwise
    0. Note that since $y_i$ is a one-hot vector, it evaluates to 1 for only one entry
    and 0 for all others. We can then simplify the expression by only considering
    the $j$ for which $y_i[j]=1$. The gradient descent update for $w_l$:


    $w_l = w_l - e\nabla_{w_l} L(W)$


    Just as with binary logistic regression, it does not matter what initial values
    we pick for $W$, because the loss function $L(W)$ is convex and does not have
    any local minima.


