  md: "# 1.3 RIDGE REGRESSION\n\nmatrix **X** to lose its rank or have singular values\
    \ very close to 0. Why are small singular values bad? Let us illustrate via the\
    \ singular value decomposition (SVD) of **X**:\n\nX = U\\Sigma V^\top$\n\nwhere\
    \ $U \\in \\mathbb{R}^{n \\times n}$, $\\Sigma \\in \\mathbb{R}^{n \\times d}$,\
    \ $V \\in \\mathbb{R}^{d \\times d}$. In the context of OLS, we must have that\
    \ $\\mathbf{X}^\top\\mathbf{X}$ is invertible, or equivalently, $\\text{rank}(\\\
    mathbf{X}^\top\\mathbf{X}) = \\text{rank}(\\mathbf{X}^\top) = \\text{rank}(\\\
    mathbf{X}) = d$. Assuming that $\\mathbf{X}$ and $\\mathbf{X}^\top$ are full column\
    \ rank $d$, we can express the SVD of $\\mathbf{X}$ as\n\nX = \\begin{bmatrix}\\\
    Sigma_d \\ 0\\end{bmatrix}V^\top$\n\nwhere $\\Sigma_d \\in \\mathbb{R}^{d \\times\
    \ d}$ is a diagonal matrix with strictly positive entries. Now let's try to expand\
    \ the $(\\mathbf{X}^\top\\mathbf{X})^{-1}$ term in terms of SVD of:\n\n```\n$(\\\
    mathbf{X}^\top\\mathbf{X})^{-1} = (V \\begin{bmatrix}\\Sigma_d & 0\\end{bmatrix}\
    \ U^\top U \\begin{bmatrix}\\Sigma_d^\top \\ 0\\end{bmatrix} V^\top)^{-1}$\n$=\
    \ (V\\Sigma_d^2 V^\top)^{-1}$\\n$= (V^\top)^{-1}(\\Sigma_d^2)^{-1}V^{-1} = V\\\
    Sigma_d^{-2}V^\top$\n```\n\nThis means that $(\\mathbf{X}^\top\\mathbf{X})^{-1}$\
    \ will have singular values that are the squared of the singular values of **X**,\
    \ potentially leading to extremely large singular values when the singular value\
    \ of **X** is close to 0. Such excessively large singular values can be problematic\
    \ for numerical stability purposes. In addition, high values to the optimal **w**\
    \ solution would prevent OLS from becoming too large and generalizing to unseen\
    \ data.\n\nThere is a very simple solution to these issues: penalize the entries\
    \ of **w** from becoming too large. We can do this by adding a penalty term constraining\
    \ the norm of **w**. For a fixed, small scale $\\lambda > 0$, we have:\n\n```\n\
    $\\min_{\\mathbf{w}} ||\\mathbf{X}\\mathbf{w} - \\mathbf{y}||_2^2 + \\lambda|\\\
    mathbf{w}||_2^2$\n```\n\nNote that the $\\lambda$ in our objective function is\
    \ a hyperparameter that measures the sensitivity to the values in **w**. Just\
    \ like the degree in polynomial features, $\\lambda$ is a value that we must choose\
    \ arbitrarily through validation. Let's expand the terms of the objective function:\n\
    \n```\n$f(\\mathbf{w}) = ||\\mathbf{X}\\mathbf{w} - \\mathbf{y}||_2^2 + \\lambda|\\\
    mathbf{w}||_2^2$\\n$= \\mathbf{w}^\top\\mathbf{X}^\top\\mathbf{w} - 2\\mathbf{w}^\t\
    op\\mathbf{X}^\top\\mathbf{y} + \\mathbf{y}^\top\\mathbf{y} + \\lambda\\mathbf{w}^\t\
    op\\mathbf{w}$\n```\n\nFinally take the gradient of the objective and find the\
    \ value of **w** that achieves for the gradient:\n\n```\n$\\nabla_w f(\\mathbf{w})\
    \ = \\mathbf{0}$\n$2\\mathbf{X}^\top\\mathbf{w} - 2\\mathbf{X}^\top\\mathbf{y}\
    \ + 2\\lambda\\mathbf{w} = \\mathbf{0}$\n$(\\mathbf{X}^\top\\mathbf{X} + \\lambda\\\
    mathbf{I})\\mathbf{w} = \\mathbf{X}^\top\\mathbf{y}$\n$\\mathbf{w}_{RIDGE} = (\\\
    mathbf{X}^\top\\mathbf{X} + \\lambda\\mathbf{I})^{-1}\\mathbf{X}^\top$\n```\n\n\
    This value is guaranteed to achieve the (unique) global minimum, because the objective\
    \ function is strongly convex, so it suffices to compute the Hessian of $f$, which\
    \ in this case is\n\n```\n$\\nabla^2 f(\\mathbf{w}) = \\mathbf{X}^\top\\mathbf{X}\
    \ + \\lambda\\mathbf{I}$\n```"
  merge: -1
