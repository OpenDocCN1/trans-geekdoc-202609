  \ 已附加 S3 触发器\n\n这标志着我们完成了构建解决方案所需的所有配置步骤。在下一个子章节中，我们将测试解决方案并验证结果。\n\n## 运行解决方案\n\
  \n我们现在将通过将原始数据集上传到所创建的 S3 存储桶中的触发位置来测试解决方案。这将触发 AWS Lambda 函数，转而启动 AWS Glue 作业。该作业将提取文件并通过一系列特征工程步骤运行，最后生成一个准备好\
  \ ML 训练的已处理和缩放的数据集。要了解 Glue 作业的工作原理，请花时间查看我们 GitHub 仓库中 `tabular-features-glue-etl.py`\
  \ 提供的 Glue ETL 代码（[`github.com/cloud-native-aiml-on-aws/Chapter-04/tabular-features-glue-etl.py`](https://github.com/cloud-native-aiml-on-aws/Chapter-04/tabular-features-glue-etl.py)）。以下代码块从\
  \ AWS Lambda 函数接收参数并读取我们上传到 S3 存储桶的原始数据集：\n\n```\nargs = getResolvedOptions(sys.argv,\
  \ ['JOB_NAME', 's3_input_dataset'])\ns3_input_dataset = args['s3_input_dataset']\n\
  print(\"The s3 input file is: \" + s3_input_dataset)\n\n# 我们先将数据加载到 Pandas dataframe\
  \ 中以便我们处理\nwine_raw_df = wr.s3.read_csv(s3_input_dataset, sep=';',header=0)\n```\n\
  \n随后的代码行将作为特征工程的一部分对数据进行处理和转换。最后，创建一个名为 `glue-out` 的新位置，并将处理后的数据集上传到该位置，如下代码段所示：\n\
  \n```\ns3_glue_out = ''\ntemp = s3_input_dataset.split('/')[6]\ns3_mod = s3_input_dataset.replace(temp,'')\n\
  if 'glue-in' in s3_mod:\n    s3_glue_out = s3_mod.replace('glue-in','glue-out')\n\
  wr.s3.to_csv(wine_scaled_df, s3_glue_out+'wine_scaled.csv', header=True, index=False)\n\
  ```\n\n要上传原始数据集，打开 SageMaker Studio notebook，导航到 `Chapter-04` 并打开 `glue-script-loader.ipynb`\
  \ notebook。执行标题 IMPORTANT 标题下方最后一个单元格中的代码。这将采取你最初克隆 GitHub 仓库时复制到 notebook 中的原始数据文件，并将其上传到\
  \ S3 存储桶以及此 notebook 第一个单元格指定的路径。如果无法识别存储桶和前缀变量，请重新执行第一个单元格并尝试执行最后一个单元格：\n\n```\n\
  # 为测试端到端解决方案上传 csv 文件\ninfile = 'winemag-data_first150k.csv'\ns3.upload_file(infile,bucket,prefix+'glue-in/'+infile)\n\
  ```\n\n现在进入你的 AWS 管理台，在服务搜索栏中输入 `S3`，进入 S3 控制台，在搜索栏中输入你的存储桶名称并打开你的 S3 存储桶。打开 `aiml-bucket`\
  \ 前缀然后进入 `chapter4`。你应该在这里看到两个新文件夹：`glue-in` 和 `glue-out`。当你执行上传原始数据集的单元格时，`glue-in`文件夹就会出现；当\
  \ Glue 成功运行特征工程任务并上传处理后的数据集时，`glue-out`文件夹就会出现。点击`glue-out`文件夹，通过选择并下载到本地查看 `wine_scaled.csv`\
  \ 文件。参考图 4.30：\n\n![](img/Figure-4.30.jpg)\n\n**图 4.30：** 特征工程处理后的数据集\n\n# 使用 AWS\
  \ DataBrew 进行数据分析\n\nGlue DataBrew (`https://us-east-1.console.aws.com/databrew/home?region=us-east-1#`)\
  \ 是一种用于数据处理、转换和执行全面数据操作任务的交互式 UI 工具，包括用于机器学习的特征工程。DataBrew 的优势在于其全面的可视化选项，这些选项有助于我们深入探索数据集、生成列和行统计数据、理解数据分布并快速识别离群值，所有这些对于完善我们原始数据集的特征工程策略来说都是重要的输入。在本节中，我们将运行一系列现在熟悉的数据处理任务，但我们将使用\
  \ DataBrew 代替 Glue ETL 或 SageMaker notebooks。让我们开始吧。\n\n与之前一样，你需要 AWS 管理台的访问权限，因此请查看并遵循*Technical\
  \ Requirements*（技术要求）部分来注册/登录你的 AWS 控制台。在顶部的服务搜索栏中输入 `DataBrew` 并点击 `AWS Glue DataBrew`\
  \ 进入 DataBrew 控制台。在控制台中，点击左侧菜单中的`DATASETS` ，如下所示：\n\n![](img/Figure-4.31.jpg)\n\n\
  **图 4.31：** AWS Glue DataBrew 控制台\n\n\n\n\n1. 点击页面右侧的 `Connect new dataset` 按钮。在出现的\
  \ `New connection` 页面中，在 `New dataset details` 下输入 `Dataset` 名称。在 `Connect to new\
  \ dataset` 部分，保持默认的 `Amazon S3` 选择不变，点击 `Enter your source from S3` 下方的输入区域，并提供路径\
  \ `s3://<your-bucket>/aiml-book/chapter4/glue-in/winemag-data_first150k.csv`。你也可以使用输入区域底部的搜索栏浏览你的\
  \ S3 存储桶前缀，如下图所示：\n\n    ![](img/Figure-4.32.jpg)\n\n**图 4.32:** 从 Glue DataBrew\
  \ 连接到新数据集\n\n2. 向下滚动此页面，并将 `Additional configurations` 下的 `CSV delimiter` 改为 `Semi-colon`（分号），如图所示：\n\
