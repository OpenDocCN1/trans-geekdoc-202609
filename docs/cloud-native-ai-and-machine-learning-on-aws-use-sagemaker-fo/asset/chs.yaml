  \            “Lambda.AWSLambdaException”,\n            “Lambda.SdkClientException”\n\
  \          ],\n          “IntervalSeconds”: 2,\n          “MaxAttempts”: 6,\n  \
  \        “BackoffRate”: 2\n        }\n      ],\n      “Next”: “CreateEndpoint”\n\
  \    },\n    “CreateEndpoint”: {\n      “Type”: “Task”,\n      “Resource”: “arn:aws:states:::sagemaker:createEndpoint”,\n\
  \      “Parameters”: {\n        “EndpointConfigName”: “string”,\n        “EndpointName”:\
  \ “string”,\n        “Tags”: [\n          {\n            “Key”: “string”,\n    \
  \        “Value”: “string”\n          }\n        ]\n      },\n      “Next”: “PerformInference”\n\
  \    },\n    “PerformInference”: {\n      “Type”: “Task”,\n      “Resource”: “arn:aws:states:::lambda:invoke”,\n\
  \      “OutputPath”: “$.Payload”,\n      “Parameters”: {\n        “Payload.$“: “$”,\n\
  \        “FunctionName”: “arn:aws:lambda:us-east-1:123456789012:function:performinference:latest”\n\
  \      },\n      “Retry”: [\n        {\n          “ErrorEquals”: [\n           \
  \ “Lambda.ServiceException”,\n            “Lambda.AWSLambdaException”,\n       \
  \     “Lambda.SdkClientException”\n          ],\n          “IntervalSeconds”: 2,\n\
  \          “MaxAttempts”: 6,\n          “BackoffRate”: 2\n        }\n      ],\n\
  \      “Next”: “DeleteEndpoint”\n    },\n    “DeleteEndpoint”: {\n      “Type”:\
  \ “Task”,\n      “End”: true,\n      “Parameters”: {\n        “EndpointName”: “MyData”\n\
  \      },\n      “Resource”: “arn:aws:states:::sagemaker:deleteEndpoint”\n    }\n\
  \  }\n}\n```\n\n\n\n模型漂移（Model drift）或偏差偏移（bias drift）发生在发送给模型进行推理的数据在信息上与用于训练模型的数据有所不同。这可能随着趋势的变化而逐渐发生，也可能由于你所在领域的变化而突然发生。考虑一个在\
  \ 2020 年之前计算最优供应链计划的模型。它用于训练的历史数据不包含任何与 COVID-19 疫情相关的突发挑战，因此它无法对那之后的数据做出高质量预测。\n\
  \n即使对于最好的模型，模型概念漂移（conceptual drift）也会随着推移而产生。在历史上，这是通过定期使用新收集的数据重新训练模型来管理的，但使用我们开启的数据捕获，也可以监控预测中的漂移。要创建一个模型漂移监控任务，必须首先创建一个关于如何以及为何进行预测的基准，然后运行定期监控任务。此任务生成的指标可以绘制图表并设置告警，以通知数据科学团队是否存在漂移：\n\
  \n```python\nBiasMonitor = ModelBiasMonitor(\nrole=SageMakerRole,\nsagemaker_session=sagemaker,\n\
  max_runtime_in_seconds=900,\n)\nBiasMonitorDataConfig = DataConfig(\ns3_data_input_path=\"\
  s3://validation_dataset_location/input/\",\ns3_output_path=\"s3://validation_dataset_location/output/\"\
  ,\nlabel=label_header,\nheaders=all_headers,\ndataset_type=dataset_type,\n)\n```\n\
  \n# 模型质量\n\n由于我们已经开启了数据捕获，我们还可以监控质量，将模型生成的预测结果与训练它使用的真实值标签数据进行比较。与数据漂移（Data Drift）一样，我们需要创建一个基准任务，将真实值标签与模型的预测进行对比，并对这些比较创建一个统计模型。然后，你创建一个监控任务计划，将基准与推理请求的捕捉进行比较。这些结果可以在\
  \ Amazon CloudWatch 中查看、绘制图表并设置告警。\n\n要创建模型质量基准任务，请设置运行基准任务使用的计算资源和时长：\n\n```python\n\
  ModelMonitor = ModelQualityMonitor(\nrole=SageMakerole,\ninstance_count=1,\ninstance_type='ml.c5.xlarge',\n\
  volume_size_in_gb=30,\nmax_runtime_in_seconds=2700,\nsagemaker_session=sagemaker\n\
  )\njob = ModelMonitor.suggest_baseline(\njob_name=\"ModelMonitorJob\",\nbaseline_dataset=\"\
  s3://baseline_s3_location/input/\",\ndataset_format=example_dataset.csv(header=True),\n\
  output_s3_uri = s3://baseline_s3_location/output/\",\nproblem_type=\"Regression\"\
  ,\ninference_attribute= \"PredictionColumn\",\nprobability_attribute= \"ProbabilityColumn\"\
  ,\nground_truth_attribute= \"LabelColumn\"\n)\n```\n\n# 更新已部署的模型\n\n一旦你的模型已部署并开始接收推理请求，你迟可能需要部署相同模型的另一个版本。你有一个基于新数据训练的新模型、一个精度更高的模型，或者一个接受新输入数据格式的模型。无论原因如何，你最终都需要替换现有的模型，而且当你替换时，有多种替换该模型的方法。第一个基础的选项是直接将另一个模型部署到现有模型之上。这在简单性上确实完胜，但在可用性上损失很大，因为部署期间对模型的任何请求都将失败。它还缺乏预览能力。如果你的模型在部署后的表现不如预期，除非你部署并在测试（你正在测试已部署的模型，对吧？）或数据捕获指标中观察到问题，否则你将不知。该选项的最后一个问题是，它只提供与测试相关的指标，让你决定是否要替换现有模型。\n\
  \n如果有一种方法可以解决这些问题，收集有关模型的数据、预览其性能、验证其功能并评估其准确性，同时又不会超出你选择的预设阈值之外干扰现有模型的流量？不仅有解决方案，而且你已经使用并交互过我们将使用的方法：生产环境变体（production\
  \ variant）。\n\n在之前的示例中，我们在创建端点配置时使用了单个生产变体。通过使用多个生产变体，我们可以在每个端点上管理多个机器学习模型，包括发送到每个变体的流量百分比。\n\
  \n## 蓝绿部署\n\n我们的 SRE 已经通过支持其他工作负载熟悉了蓝绿部署，相同的概念也适用于这里。通常，蓝绿部署策略是创建两个相同的环境，然后从运行现有应用程序（蓝色）的环境切换到运行新应用程序（绿色）的环境。颜色标记用于标识流量的流向。我们可以在模型端点之上以网络负载均衡器或\
  \ API 网关的形式添加抽象层，但为了优化成本和效率，我们将利用生产变体的内置功能在单个端点内完成操作。\n\n我们将使用之前相同的线性回归端点，前提是数据科学团队提供了一个新模型，他们希望切换流量过去而不丢失任何流量。\n\
  \n```python\nCreateEndpointConfig = sagemaker.create_endpoint_config(\nEndpointConfigName=\"\
  EndpointConfig\",\nProductionVariants=[{\nmodel_name=\"ModelName\",\ninstance_type=\"\
  ml.c5.xlarge\",\ninstance_count=1,\nvariant_name='BlueModel',\ninitial_weight=1\n\
  },\n{\nmodel_name=\"ModelName\",\ninstance_type=\"ml.c5.xlarge\",\ninstance_count=1,\n\
  variant_name='GreenModel',\ninitial_weight=0\n}\n])\n```\n\n根据上述权重，蓝色模型将承担 100%\
  \ 的流量，绿色模型将承担 0%。当我们准备好切换流量到绿色模型时，可以如下所示更新端点：\n\n```python\nsagemaker.update_endpoint_weights_and_capacities(\n\
  EndpointName=\"EndpointName\",\nDesiredWeightsAndCapacities=[\n{\n\"DesiredWeight\"\
  : 0,\n\"VariantName\": \"BlueModel\"\n},\n{\n\"DesiredWeight\": 1,\n\"VariantName\"\
  : \"GreenModel\"\n}\n])\n```\n\n所应用的权重可以是 100 的任何分数，允许你向端点发送百分比的流量。这允许你通过小部分流量验证模型功能是否符合预期，并且在出现问题时可以将权重切回零。\n\
  \n## A/B 测试\n\n使用这种方法，你可以对模型进行 A/B 测试，以便在实施并将所有流量发送给它之前确定其性能。A/B 测试是指测试模型的不同变体并比较相应的性能、指标和响应，以决定你最终想要保留哪个模型。你可以将所有生产变体的权重设置为\
  \ 1，这意味着每个模型将获得相同量的流量。\n\n此外，如果你对调用应用程序有控制权，可以通过添加 `TargetVariant` 参数在每次端点调用期间设置调用哪个生产变体：\n\
  \n```python\nModelInvocation = sagemaker.invoke_endpoint(\nEndpointName=\"ModelName\"\
  ,\nContentType=\"text/json\",\nBody=ModelPayload,\nTargetVariant=variant1[\"BlueModel\"\
  ],\n)\n```\n\n这对于某些用户选择作为 Beta 测试参与者的情况特别有用，允许你在他们的模型请求中插入 `TargetVariant` 参数。\n\
  \n# 多模型端点\n\n\n\n\n\n随着你对机器学习用量的增加，你很可能会达到一个点，即某个工作负载需要多个机器学习模型。在某些情况下，一个模型可能会调用另一个模型来进一步完善预测所需的数据，或者训练好的模型需要在无法泛化到所有数据的特定子集上进行训练。例如，你拥有一个包含印度\
  \ 28 个州和 8 个联邦直辖区历史指标的集集。你的模型需要能够对特定州或联邦直辖地区的用户进行预测。为了将准确率提高到满足业务需求的水平，你按照邦和联邦直辖地区拆分了训练数据。结果是每个邦和联邦直辖地区都有一个独特的模型，总共产生\
  \ 36 个模型。\n\n为了对你的所有 36 个模型进行推理，你需要为每个模型创建一个推理端点，这意味着你需要为每个端点支付计算费用。相反，你可以将所有 36\
  \ 个模型托管在一个单一端点之后，并在推理时指定请求的目标模型。要实现这一点，当我们在模型定义中定义托管模型的容器时，我们添加 `MultiModel` 模式参数：\n\
  \n```python\nMultiModalModel = sagemaker.create_model(\n    ModelName = 'ModelName',\n\
  \    ExecutionRoleArn = SageMakerRole,\n    Containers = {\n        'Image': image_repo_location,\n\
  \        'ModelDataUrl': 's3://model_bucket/model_path',\n        'Mode': 'MultiModel'\n\
  \    })\n```\n\n你添加到此端点的模型都应该包含在 s3 位置中。每个模型构文件将被添加到端点，并从你在 `Image` 参数中指定的容器进行托管。如果你需要托管一个具有独立容器模型的多模态端点，其规范如下：\n\
  \n```python\nMultiModalModel = sagemaker.create_model(\n    ModelName = 'ModelName',\n\
  \    InferenceExecutionConfig = {'Mode': 'Direct'},\n    ExecutionRoleArn = SageMakerRole,\n\
  \    Containers = [\n        {'Image': '123456789012.dkr.ecr.us-west-2.amazonaws.com/ecr_repo_1:latest',\
  \ 'ContainerHostName': 'ModelContainer_1'}, \n        {'Image': '123456789012.dkr.ecr.us-west-2.amazonaws.com/ecr_repo_2:latest',\
  \ 'ContainerHostName': 'ModelContainer_2'}\n    ])\n```\n\n一旦定义了模型，你就可以创建多模型端点配置并部署模型：\n\
  \n```python\nMultiModalEndpointConfig = sagemaker.create_endpoint_config(\n    EndpointConfigName\
  \ = 'MultiModalEndpointConfig',\n    ProductionVariants=[\n        {\n         \
  \   'InstanceType': 'ml.c5.xlarge',\n            'InitialInstanceCount': 2,\n  \
  \          'InitialVariantWeight': 1,\n            'ModelName': 'MultiModalModel',\n\
  \            'VariantName': 'AllTraffic'\n        }\n    ]\n)\n\nMultiModalEndpoint\
  \ = sagemaker.create_endpoint(\n    EndpointName = 'MultiModelEndpoint',\n    EndpointConfigName\
  \ = 'MultiModalEndpointConfig')\n```\n\n你发送到端点的请求应该包含 `Target-Variant-Name` 请求头，以指定使用哪个模型。\n\
  \n## 结论\n随着你对机器学习用量的增加，你很可能会达到一个点，即某个工作负载需要多个机器学习模型。在某些情况下，一个模型可能会调用另一个模型来进一步完善预测所需的数据，或者训练好的模型需要在无法泛化到所有数据的特定子集上进行训练。例如，你拥有一个包含印度\
