  \n## 创建 S3 桶\n\n遵循此文档（`https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html`）来创建一个\
  \ S3 桶。几乎所有的代码章节都需要一个 S3 桶，因此最好先创建一个桶，然后在桶中为每个章节创建一个多个文件夹。\n\n## 特征工程简介\n\n你是否曾好奇过（就像作者们一样），为什么他们（那些发明机器学习术语的人）要使用像“特征工程”这样复杂的词汇？诚然，这么说听起来很酷。如果你说“我专长特征工程”，你肯定会在技术社区中受到尊重。但为什么不用像“数据处理”或“数据转换”这样简单的词呢？这似乎就是你为准备数据用于机器学习训练而要做的工作，不是吗？\n\
  \n让我们用任何神秘化过程中常用的老格言来尝试将其拆解。根据 thesaurus.com ([`www.thesaurus.com/browse/feature`](https://www.thesaurus.com/browse/feature))，“feature”一词有多种含义，其中最突出的是方面（aspect）、项目（item）、质量（quality）和属性（attribute）。正如你所看到的，特征指的是一个重要特征或使数据符合标准。这正是我们机器学习训练所需要的。\n\
  \n\n\n\n\n在统计学中，数据集被称为**总体（populations）**，它们是数据点的集合，泛泛定义了你想要回答的特定问题或正在运行的实验的范围。大多数情况下，**样本（sample）**是从总体中随机选择的数据点，但它必须最紧地代表该样本所所属总体的特征。在某些情况下，你可能会选择刻意地选取样本，例如在创建评估数据集时。**观测值（observation）**是单行列或属性，表示样本或总体中的一个实例。因此，样本是跨维度（如时间或其他合格类别）记录的观测值集合，能够最好地代表数据。**特征（feature）**是观测值中的一个属性或列，表示样本或总体中某一属性或列的所有记录值。你可能在想，等一下，这听起来也很复杂。如果是这样，我们深表歉意。我们将尝试另一种方法。比如“一画胜过千言”如何？参考`图\
  \ 3.3`来理解特征在统计学背景下的功能：\n\n![](img/Figure-3.3.jpg)\n\n**图 3.3：** 统计背景下机器学习的表格数据表示\n\
  \n我们已经够了讨论什么是特征；让我们进入第二个词：*工程（engineering）*。我们都知道这个词本身的含义，但它对于机器学习（ML）意味着什么？简单来说，就是为了让特征处于有意义的状态并使其适用于机器学习训练而所做的任何工作工作。我们为什么要这样做呢？这是因为否则，你可能无法获得能够良好预测任何内容的模型。机器学习的目标是最小化预测误差，从而满足你试图解决的业务问题的需求。模型训练得有多好并不重要；如果预测不可靠，它就没有用。而特征是模型可靠性的核心。那么我们如何进行特征工程呢？这取决于机器学习的用例（我们正尝试做什么？）以及所需的学习类型（我们如何根据现有数据训练模型？）。\n\
  \n如果你回想起我们在`第 1 章，机器学习工作流简介`的`处理机器学习问题`和`机器学习工作流概述`章节中读到的内容，我们看到根据业务或客户的需求以及用例，你可以选择监督学习、无监督学习或强化学习，并且机器学习的问题类型/子类型是多样的，例如计算机视觉、语音、业务工具和工业智能。这些在决定我们处理的特征类型方面起着作用，业务需求直接驱动了我们选择的特征。在接下来的几个章节中，我们将探索这些用例的常用特征工程技术。\n\
  \n### 针对 NLP 的特征工程\n\n自然语言处理（NLP）是一种方法或技术集合，使机器能够智能地识别基于文本的数据并推导出上下文关系。NLP 一些流行的用途包括情感分析（检测句子或段落中的情感）、主题建模（预测文本文档的主题）、分类（根据文档主题将文档分为类别或组）以及实体识别（从文档中选择归属于特定类型的词，如人物、地点和日期）。NLP\
  \ 模型训练的主要前提涉及将训练文档集中的文本转换为标记（tokens）或向量嵌入（vector embeddings）（机器不懂文本；它们只理解数字；嵌入是根据词的频率、相似性以及与其相邻词的关系，对文档中单词的数值表示）。取决于学习目标（例如情感分析或主题建模），训练来学习词组对应的标签或常见主题。在本书的后续章节中，我们将学习如何构建其中一些模型；但首先，我们需要了解如何为\
  \ NLP 训练进行特征工程。\n\n例如，让我们考虑一个目标：通过提供书中的引用作为输入来训练一个可以识别作者的模型。这意味着我们需要训练一个文本分类器。下表是我们的训练数据集可能性的示例：\n\
  \n| 引用 (Quote) | 作者 (Author) |\n| --- | --- |\n| 学习并不意味着人变得博学：有人有知识，有人有理解。前者需要记忆，后者需要哲学。\
  \ | Alexandre Dumas |\n| 所有的恶都有两种良药——时间与沉默。 | Alexandre Dumas |\n| 当想象力呈现出未知事物的形式时，诗人的笔将它们化为形状，赋予虚无之物局部的居所和名字\
  \ | William Shakespeare |\n\n**表 1.1：** NLP 文本分类数据集\n\n记住，NLP 模型并不真正在乎你的文本看起来有多漂亮；它只需要将其转换为数字（嵌入），并学习\
  \ `Quote`（引用）特征和 `Author`（作者）特征向量嵌入之间的关系。在特征工程期间，我们试图通过让文本尽可能简洁且不丢失关系或意义，来使训练过程变得简单。下面的图片描述了典型文本特征工程任务的各个阶段。将此作为通用指南，但你可能希望根据你的特定需求执行额外的步骤。参考`图\
  \ 3.4`：\n\n![](img/Figure-3.4.jpg)\n\n**图 3.4：** NLP 特征工程阶段\n\n### 分词并移除标点\n\n作为第一步，让我们将引用分词单词（你可能想在分词单词之前将其分成句子），并从上面的文本数据中移除任何“必要的”标点。要尝试本章的示例，请参考章节开头的技术要求部分登录\
  \ AWS 控制台，执行进入 SageMaker Studio 的步骤并克隆仓库到 SageMaker Studio 开始。点击对应本章编号的文件夹。如果你看到多个笔记本，章节标题对应笔记本名称以便识别。你也可以通过书开头提供的\
  \ GitHub 仓库跟随代码示例。\n\n如果你在本地尝试，请在继续之前安装 Python。我们将安装 Natural Language Toolkit（[`www.nltk.org/`](http://www.nltk.org/)）Python\
  \ 库，导入库所需的数据，并运行代码移除标点。在安装了 Python 和 nltk 后执行以下代码：\n\n```python\n### 在安装后导入 nltk\
  \ 库\nimport nltk\n\n### 下载单词分词所需的子集\nnltk.download('punkt')\n\n### 导入分词函数\nfrom\
  \ nltk.tokenize import word_tokenize\n\n### 从输入数据集中创建我们的引用列表\nquotes = [\"学习并不意味着人变得博学：有人有知识，有人有理解。前者需要记忆，后者需要哲学。\"\
  ,\"所有的恶都有两种良药——时间与沉默。\",\"当想象力呈现出未知事物的形式时，诗人的笔将它们化为形状，赋予虚无之物局部的居所和名字\"]\n\n### 定义一个用于特征工程输出的列表\n\
  fe1_quotes = []\n\nfor quote in quotes:\n    # 获取每个引用的单词标记\n    r_words = word_tokenize(quote)\n\
  \n    # 移除标点\n    p_words = [w for w in r_words if w.isalpha()]\n\n    p_removed\
  \ = ''\n```\n\n\n\n\n\n### 将移除标点符号的单词重新组合成句子\n\n```python\nfor p_word in p_words:\n\
  \    p_removed += ' ' + p_word\n    fe1_quotes.append(p_removed)\n    print(p_removed)\n\
  ```\n\n下表显示了我们的文本数据集在移除标点符号后的样子：\n\n| Quote | Author |\n| --- | --- |\n| Learning\
  \ does not make one learned there are those who have knowledge and those who have\
  \ understanding The first requires memory and the second philosophy | Alexandre\
  \ Dumas |\n| For all evils there are two remedies time and silence | Alexandre Dumas\
  \ |\n| and as imagination bodies forth the forms of things unknown the poet pen\
  \ turns them to shape and gives to airy nothing a local habitation and a name |\
  \ William Shakespeare |\n\n**表 1.2:** 不含标点符号的 NLP 文本分类数据集\n\n### 转换为小写\n\n在训练过程中，你选择的\
  \ NLP 算法会将你文本中的单词转换为向量嵌入（vector embeddings），正如我们在本章之前讨论的那样。一种很好的方法是将整个数据集中的文本转换为统一的大小，从而尽可能保持该过程输入的无歧性。执行以下代码块将你数据集中的引言转换为小写。在训练之前，作者（Author）列将通过独热编码（请参考表格数据特征工程小节）转换为整数：\n\
  \n```python\nfe2_quotes = []\nfor quote in fe1_quotes:\n    fe2_quotes.append(quote.lower())\n\
  \    print(fe2_quotes)\n```\n\n下表显示了我们的文本数据集在移除标点符号并转换为小写后的样子：\n\n| Quote | Author\
  \ |\n| --- | --- |\n| learning does not make one learned there are those who have\
  \ knowledge and those who have understanding the first requires memory and the second\
  \ philosophy | Alexandre Dumas |\n| for all evils there are two remedies time and\
  \ silence | Alexandre Dumas |\n| and as imagination bodies forth the forms of things\
  \ unknown the poet pen turns them to shape and gives to airy nothing a local habitation\
  \ and a name | William Shakespeare |\n\n**表 1.3:** 小写的 NLP 文本分类数据集\n\n### 移除停用词\n\
  \n停用词（Stop words）是文本中频繁使用的单词，它们本身没有意义，但有助于构建句子的结构。在前面的句子中，停用词是“are”、“in”、“on”、“in”和“the”。你明白了。`nltk`\
  \ 库提供了一个实用的函数来列出停用词，并从我们的文本数据集中移除它们。执行以下代码来移除停用词：\n\n```python\n### 下载停用词库\nnltk.download('stopwords')\n\
  ### 导入分词函数\nfrom nltk.tokenize import word_tokenize\n### 导入停用词函数\nfrom nltk.corpus\
  \ import stopwords\n\n### 定义一个新列表来存储移除停用词后的引言\nfe3_quotes = []\n### 获取英语完整的停用词列表\n\
  stop_ws = set(stopwords.words('english'))\nfor quote in fe2_quotes:\n    words =\
  \ word_tokenize(quote)\n    s_words = [word for word in words if not word in stop_ws]\n\
  \    s_removed = ''\n    for s_word in s_words:\n        s_removed += ' ' + s_word\n\
  \    fe3_quotes.append(s_removed)\n    print(fe3_quotes)\n```\n\n下表显示了我们的文本数据集移除停用词后的样子：\n\
  \n| Quote | Author |\n| --- | --- |\n| learning make one learned knowledge understanding\
  \ first requires memory second philosophy | Alexandre Dumas |\n| evils two remedies\
  \ time silence | Alexandre Dumas |\n| imagination bodies forth forms things unknown\
  \ poet pen turns shape gives airy nothing local habitation name | William Shakespeare\
  \ |\n\n**表 1.4:** 移除停用词的 NLP 文本分类数据集\n\n### 执行词干和词形还原\n\n如你所见，通过 NLP 特征工程，我们正试图让文本更短、更简洁，同时又不丢失意义。过程的后续步骤是词干（stemming）和词形还原（lemmatization），这些技术通过修剪单词来获取单词含义的本质并弃其余部分。其思想是得到单词的“词根”（stem）或“词形”（lemma），而不牺牲其本质（以便获得该单词与其他单词/相似单词最准确的向量嵌入）。这两种技术的主要区别在于，“词根”不必是一个真实的单词，但“词形”必须是。执行以下代码使用\
  \ `nltk` 库对我们的文本数据集进行词干提取：\n\n```python\n### 导入词干函数\nfrom nltk.stem.porter import\
  \ PorterStemmer\n### 声明 porter 词干器，最常用的词干函数\nporter = PorterStemmer()\nfe4_quotes\
  \ = []\nfor quote in fe3_quotes:\n    words = word_tokenize(quote)\n    # 对每个引言的每个单词进行词干提取\n\
  \    stem_words = [porter.stem(word) for word in words]\n    stem_quote = ''\n \
  \   for stem_word in stem_words:\n        stem_quote += ' ' + stem_word\n    fe4_quotes.append(stem_quote)\n\
  \    print(fe4_quotes)\n```\n\n下表显示了词干提取后我们的文本数据集引言。\n\n**注意：** 注意到某些词干后的单词并不是实际单词，因此似乎丢失了意义。\n\
  \n| Quote | Author |\n| --- | --- |\n| learn make one learned knowledge understanding\
  \ first requir memory second philosop | Alexandre Dumas |\n| evil two remedi time\
  \ silenc | Alexandre Dumas |\n| imagin bodi forth form thing poet pen turn shape\
  \ give airi local habit | William Shakespeare |\n\n**表 1.5:** 词干提取后的 NLP 文本分类数据集\n\
  \n现在让我们使用 `nltk` 库执行词形还原。以下代码下载了提供词形还原函数的 wordnet 库，导入了函数，对我们的引言进行分词，并为每个单词生成词形：\n\
  \n```python\n### 下载用于词形还原的 wordnet 库\nnltk.download('wordnet')\n### 导入词形还原函数\nfrom\
  \ nltk.stem import WordNetLemmatizer\n### 声明词形还原器\nlemmatizer = WordNetLemmatizer()\n\
  fe5_quotes = []\nfor quote in fe3_quotes:\n    words = word_tokenize(quote)\n  \
  \  # 对每个引言的每个单词进行词形还原\n    lemma_words = [lemmatizer.lemmatize(word) for word in\
  \ words]\n    lemma_quote = ''\n    for lemma_word in lemma_words:\n        lemma_quote\
  \ += ' ' + lemma_word\n    fe5_quotes.append(lemma_quote)\n    print(fe5_quotes)\n\
  ```\n\n下表显示了词形还原后我们的文本数据集引言。\n\n**注意：** 将移除停用词的输出与词形还原的输出进行比较，它们看起来相似；但注意第二个引言中的“remedies”变成了“remedy”，而第三个引言中的“bodies”变成了“body”。\n\
  \n| Quote | Author |\n| --- | --- |\n| learning make one learned knowledge understanding\
  \ first requires memory second philosophy | Alexandre Dumas |\n| evil two remedy\
  \ time silence | Alexandre Dumas |\n| imagination body forth form thing unknown\
  \ poet pen turn shape give airy nothing local habitation name | William Shakespeare\
  \ |\n\n**表 1.6:** 词形还原后的 NLP 文本分类数据集\n\n\n\n\n\n计算机视觉（CV）是一门教授计算机如何观察和理解世界的科学。它指的是一组用于图像和视频分类、图像中目标检测等任务的算法、概念和方法。例如，通过计算机视觉，你的\
  \ ML 模型可以将图像分类为狗、猫或鸟；它可以识别道路图像中的汽车，并能区分图像中的两辆汽车。目前有多种技术、算法、神经网络和预训练模型可以作为 AWS AI\
  \ 服务可用，我们可以利用这些服务来高精度地训练 CV 模型；我们将在随后的章节中介绍这些内容。现在，你认为图像数据集的特征是什么？表格数据集具有列，确定特征非常容易，但你如何如何对图像这样做呢？作为人类，我们感知图像有一种独特的方式；我们观察形状、形态、颜色和大小，并依靠记忆来理解图像的含义，但计算机只理解数字。因此，我们使用像素位置及其颜色表示（颜色使用\
  \ `RGB`，灰度使用 `L`），这会产生一个数组的数组，用于训练计算机学习图像。现在让我们来看实际操作效果。\n\n要尝试本节中的示例，请参考本章开头的“技术要求”部分以登录\
  \ AWS 管理控制台，执行 `onboard` 步骤进入 SageMaker Studio，并执行 `cloning` 仓库到 SageMaker Studio\
  \ 开始使用。点击与本章章节编号对应的文件夹。如果你看到多个笔记本，章节标题对应于笔记本名称，以便识别。你也可以通过书开头提供的 GitHub 仓库被动地跟进代码示例。\n\
  \n让我们先打开图像并检查一下。在 SageMaker Studio 笔记本中执行以下代码，使用 Python Pillow（`pillow.readthedocs.io/en/stable/`\n\
  display(img)\n```\n\n执行上述代码后，将显示以下图像：\n\n![](img/Figure-3.5.jpg)\n\n**图 3.5:** 特征工程示例图像\n\
  \n对于图像处理，特征工程技术与我们处理文本的方法非常不同。通常，我们会查看图像大小并调整图像大小，使它们在训练和测试数据集中的尺寸一致；对图像进行裁剪和平铺处理、旋转图像，并在需要时转换为灰度。整个思想是对图像进行预处理，使其达到合适的质量和大小，以便模型从中进行良好训练。在某些情况下，我们可能需要采取额外的步骤，例如使用\
  \ Python 中名为 `im2rec` 的 MXNet 工具（[https://mxnet.apache.org/versions/1.6/api/r/docs/api/im2rec.html]）将图像转换为\
  \ `RecordIo Protobuf` 格式（[https://docs.aws.amazon.com/sagemaker/latest/dg/cdf-training.html#cdf-recordio-format]用于图像分类问题，或者使用主成分分析或\
  \ `PCA` 技术进行降维（[https://docs.aws.amazon.com/sagemaker/latest/dg/pca.html]以优化训练。\n\
  \n## 调整图像大小\n\n一个主意是确保所有图像在相同大小下具有良好的质量。数据集中不同大小的会在训练期间干扰模型，某些算法可能不接受不同的图像大小并可能返回验证错误。因此，作为第一步，我们应该打印图像大小并根据需要将其转换为较小尺寸，且不影响内容。越小越好，因为大图像有很多像素，这意味着模型需要更长的时间收敛，这直接关系到更高的成本。在\
  \ SageMaker Studio 笔记本中执行以下代码来检查调整大小的工作原理：\n\n```python\n### Print the size of the\
  \ image as width, height\nimg.size\n```\n\n**我们得到的输出为** `(1920, 1280)`，**表示图像的宽度和高度。现在，执行以下代码调整图像大小并将其保存为新图像：**\n\
  \n```python\n### Resize the image to a smaller size\nimg_smaller = img.resize((600,\
  \ 400))\nimg_smaller.save('puppy_image_small.jpg')\nprint(img.size)\nprint(img_smaller.size)\n\
  ```\n\n我们得到的结果为 (1920, 1280) 和 (600,400)，符合预期。现在，执行下一行显示此调整大小后的图像。如你所见，我们在不丢失内容质量的情况下缩小了图像尺寸。为了理解为什么调整大小很重要，让我们将图像视为像素数组。执行以下代码行获取原始图像的\
  \ `RGB`（红、绿、蓝）表示法的像素表示，并打印前五个像素：\n\n```python\n### Get the pixel values from the\
  \ image width, height = img.size\npixels = {'R':[],'G':[],'B':[]}\n### Let us now\
  \ get the RGB value for each pixel position for w in range(1,width):\n```\n\n```python\n\
  for w in range(1,width):\n    for h in range(1,height):\n        pixpos = img.getpixel((w,h))\n\
  \        pixels['R'].append(pixpos[0])\n        pixels['G'].append(pixpos[1])\n\
  \        pixels['B'].append(pixpos[2])\n\n### Print the first five pixels\nfor i\
  \ in range(5):\n    print(pixels['R'][i], pixels['G'][i], pixels['B'][i])\n```\n\
  \n\n\n\n坐标是像素位置（而非每个像素位置的 RGB 表示），它们表示我们裁剪的图像的左上角以及到右下角的距离（我们使用了缩放后的图像作为输入）。因此，`130`\
  \ 是我们从输入图像左侧起始的像素位置，`430` 是我们向右侧延伸的像素距离；`75` 是图像顶部的起始像素位置，`350` 是我们向图像底部延伸的像素距离。现在让我们了解此图像与输入图像（缩放后的版本）的大小对比。在\
  \ SageMaker Studio notebook 中执行以下代码并查看结果：\n\n```python\n### 从较小的图像中获取像素值\nwidth,\
  \ height = img_cropped.size\npixels = {'R':[],'G':[],'B':[]}\n\n### 现在让我们获取 w 在\
  \ range(1,width) 内每个像素位置的 RGB 值:\nfor h in range(1, height):\n    pixpos = img.getpixel(((w,h)))\n\
  \    pixels['R'].append(pixpos[0])\n    pixels['G'].append(pixpos[1])\n    pixels['B'].append(pixpos[2])\n\
  \n### 我们有多少个像素？\nlen(pixels['R'])\n```\n\n我们得到的结果为 `90146`，这小于我们缩放后的输入图像像素计数（`239001`）的一半。因此，只要我们正确确定了坐标，裁剪就会非常有帮助。确定裁剪坐标的自动化方法是使用目标检测模型，该模型可以在图像中的物体周围绘制边界框。一个很好的例子是\
  \ Amazon Rekognition (`https://aws.amazon.com/rekognition/`)，这是一项完全托管的服务，使用强大的预训练模型进行各种用例的物体检测和图像分类。我们将在\
  \ *第 10 章，通过感知认知添加智能* 中学习更多关于 Rekognition 的知识。当我们使用 Rekognition 中的 `Label detection`\
  \ 功能处理我们小狗的图像时，我们得到了如下结果：\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7：** Amazon Rekognition\
  \ 对狗图像的分析\n\n正如我们所看到的，Rekognition 不仅准确地画出了边界框，还能预测这是一只狗，并且其品种是拉布拉多寻回犬。现在让我们学习一种在处理大尺寸图像时经常使用的相关技术：图像分块（image\
  \ tiling）。\n\n有时图像非常大（文件大小达到数百 MB 甚至 GB），并且包含了复杂的细节，这使得我们无法使用早些学过的缩放或裁剪技术。例如，住宅社区的卫星图像在图像的每个区域都包含有用信息，如果进行缩放，将会丢失上下文/质量；如果裁剪掉图像的一部分，则会丢失内容。在这种情况下，最好的方法是分块。分块也使用了裁剪，但原因不同。在分块中，我们将一张大图像裁剪成许多小部分，每个部分都变成一张独立的图像，并存储各个图像的坐标位置，以便能够再次拼接成完整图像。这就像拼图，但几乎所有的碎片（图像的小部分）都被裁剪成正方形或矩形，且大小相等。在你的\
  \ SageMaker Studio notebook 的“Tiling our image to tile our puppy image”标题下执行以下代码并查看结果：\n\
  \n```python\n# 我们现在将使用 crop 函数创建图像的多个分块 import math\n### 获取输入图像的尺寸 - 在此示例中使用 resize\
  \ 缩放后的图像\nw, h = img_smaller.size\n### 我们想要多少张图像？可以更改此值，但它应该是一个完全平方数\n### 并且输入图像的宽度高度必须能被这个平方根整除\n\
  tiles = 16\ndivisor = int(math.sqrt(tiles))\nleft_pixel = 0\ntop_pixel = 0\nright_pixel\
  \ = w/divisor\nbottom_pixel = h/divisor\n### 从图像从左到右遍历或通过列遍历 i in range(divisor):\n\
  if right_pixel <= w:\n    # 附加到图像名称中的分块位置，引用行号和列号\n    # 例如 puppy_tiled\n```\n（注：提供的文本在后半部分包含重复/乱码的逻辑；我已对提供的结构元素应用了格式规则。）\n\
  \n\n\n\n\n```\ngray_img = img_smaller.convert('L')\n```\n\n```\ndisplay(gray_img)\n\
  ```\n\n输出显示的图像如下：\n\n![](img/Figure-3.9.jpg)\n\n**图 3.9:** 灰度图像\n\n我们到为止讨论的是一些提高基于计算机视觉（CV）的机器学习模型学习能力的常用图像处理技术。这绝不是可以尝试技术的详尽列表；根据你的用例，你还可以进行其他操作，例如合并、更改亮度、对比度和颜色。有关所有可能性的完整列表，请参考\
  \ [`pillow.readthedocs.io/en/stable/reference/Image.html`](https://pillow.readthedocs.io/en/stable/reference/Image.html)。在接下来的子节中，我们将学习一些不涉及直接图像操作的额外方法，以提高我们\
  \ CV 训练效率。\n\n## 转换为 RecordIO 格式\n\nJPEG 和 PNG 等图像格式非常流行，因为它们具有可移植性和可压缩性。然而，当这些图像用于机器学习训练等计算密集型任务时，从磁盘读取的\
  \ IO 可能会导致瓶颈，因为这些格式不是分块（tiled）或分层的。为了提高训练性能，你可以将图像转换为 MXNet RecordIO 格式 ([`mxnet.apache.org/versions/1.7/api/python/docs/api/mxnet/recordio/index.html`](https://mxnet.apache.org/versions/1.7/api/python/docs/api/mxnet/recordio/index.html))。RecordIO\
  \ 可将图像文件封装成一系列记录，既紧凑又易于访问。使用 MXNet 提供的 `im2rec` ([`github.com/apache/incubator-mxnet/blob/master/tools/im2rec.py`](https://github.com/apache/incubator-mxnet/blob/master/tools/im2rec.py))\
  \ 工具，只需几行代码即可轻松完成转换。你可以根据需要将整个图像数据集转换为 RecordIO 进行训练。让我们用我们的分块图像作为来尝试一下。为了此活动，我们需要安装\
  \ MXNet。你可以使用以下代码来安装 MXNet，或者将你的 SageMaker Studio notebook 内核更改为 MXNet 内核 (https://docs.aws.amazon.com/sagemaker/latest/dg/notebooks-run-and-manage-change-image.html)。在\
  \ SageMaker Studio notebook 中执行以下代码行来创建 RecordIO 格式：\n\n```\n### 首先安装 mxnet。你也可以使用已经安装了\
  \ MXNet 的内核 - 从 SageMaker Studio 的右上角选择内核\n!pip install mxnet\n\n# 我们必须安装 opencv\
  \ 包以进行 recordIo 转换\n!pip install opencv-python-headless\n\n### 下载我们需要的 im2rec python\
  \ 文件副本\n!curl -O https://raw.githubusercontent.com/apache/incubator-mxnet/master/tools/im2rec.py\n\
  \n### 创建一个文件夹将我们的分块图像标记为类别\n!mkdir tiles/Labrador\n\n### 创建一个 RecordIO 列表文件以指示图像的标签\n\
  !python im2rec.py ./puppy ./tiles/ --recursive\n```\n\n上一步创建了一个将标签与图像链接的列表文件。你可以双击\
  \ notebook 左侧的文件名来查看内容，如下图所示：\n\n![](img/Figure-3.10.jpg)\n\n**图 3.10:** RecordIO\
  \ 列表内容\n\n现在，执行以下代码创建索引文件和 RecordIO 文件：\n\n```\n### 现在为我们的图像生成 recordIO 文件，这将是训练的输入\n\
  !python im2rec.py ./puppy ./tiles/ --recursive --pass-through --label\n\n### 你应该看到创建了\
  \ puppy.rec 文件和 puppy.idx，它们是你训练的输入\n!ls lt\n```\n\n将图像转换为 RecordIO 格式非常简单。注意，当你有大量图像时，取决于图像的数量和大小，转换可能需要几个小时。我们接近\
  \ CV 特征工程章节的结尾了。\n\n## 使用主成分分析进行降维\n\n另一种你可以用于优化训练的预处理和特征工程技术是主成分分析或 `PCA` ([`docs.aws.amazon.com/sagemaker/latest/dg/pca.html`](https://docs.aws.amazon.com/sagemaker/latest/dg/pca.html))。在不损害数据质量的情况下减少数据集中的特征数量。这被称为降维，因为我们将特征从高维空间（表示观察值的很多列或特征）移动到低维空间（在保留含义的同时减少特征数量）。通过\
  \ `PCA`，我们可以大幅减少数据集中的列数，从而减少训练期间需要处理的数据量，降低成本并提高训练效率。通常，`PCA` 应用于表格数据集（我们将在接下来的子节中探索它），但由于我们可以将图像表示为\
  \ RGB 值的三维数组，只要维度合理，我们就可以对图像使用 `PCA`。`PCA` 将特征转换为你指定的组件数量（这些组件将成为你实际机器学习训练的特征）。例如，如果你的数据集有\
  \ 500 个特征，只要观察值的数量大于 40，你就可以将组件数指定为 40。组件数可以是 1 到最小样本数之间的任何数字。让我们看看 `PCA` 对于我们的小狗图像是否有意义。在\
  \ SageMaker Studio 中执行以下代码块：\n\n```python\n### 我们需要一个图像的 numpy 数组来开始。首先导入 numpy\n\
  import numpy as np\n\n### 首先将我们的灰度图像转换为 numpy 数组\nseq = img_smaller.getdata()\n\
  img_pix_array = np.array(seq)\nimg_pix_array.shape\n```\n\n得到结果为 `(240000, 3)`。这意味着有\
  \ 240000 行观察值以及三个特征（R、G 和 B）。现在让我们使用 Scikit Learn ([`scikit-learn.org/stable/index.html`](https://scikit-learn.org/stable/index.html))\
  \ 分解模块对这些数据运行 `PCA` 分析，如下代码所示：\n\n```python\n### 使用 sklearn PCA 查看所有三个特征的变异性\nfrom\
  \ sklearn.decomposition import PCA\npca_3 = PCA(n_components=3)\npca_3.fit(img_pix_array)\n\
  print(pca_3.explained_variance_ratio_ * 100)\n```\n\n得到结果为 `[94.97632805 4.43190176\
  \ 0.59177018]`。这表明第一个特征解释了数据的 95% 变异性，对于我们的需求是足够的。因此，我们将重新运行 `PCA`：\n\n```python\n\
  ### 组件 1 解释了 95% 的变异性，对我们来说足够了。我们将组件数设置为 1 并运行\nfrom sklearn.decomposition import\
  \ PCA\npca_1 = PCA(n_components=1)\npca_1.fit(img_pix_array)\nimg_reduced = pca_1.transform(img_pix_array)\n\
  img_reduced.shape\n```\n\n得到结果为 `(240000, 1)`，因此通过 `PCA` 将特征从 3 个减少到 1 个。虽然这很有趣，但我们可以通过将图像转换为灰度来获得相同的结果。对于这个只有一张图像的特定示例，`PCA`\
  \ 不是一个很好的应用。如果你有一个包含 1000 张与我们的图像特征相似的数据集，那么使用 `PCA` 就意义。这里有一个使用 Amazon SageMaker\
  \ 使用 `PCA` 解决机器学习问题的优秀示例：https://sagemaker-examples.readthedocs.io/en/latest/introduction_to_amazon_algorithms/pca_mnist/pca_mnist.html。\n\
  \n这标志着 CV 特征工程技术子节的结束。在下一个子节中，我们将探索如何对表格数据进行预处理和特征工程，这类数据构成了大多数机器学习训练数据的结构。\n\n\n\
  \n\n数据无处不在，存在于我们所做的和经历的每件事中。事实上，数据提供了我们理解和与世界交互的。如果你停下来思考一下你的日常活动，你会发现自己每一步都在使用数据和洞察来做出决策。例如，出门前查看天气以决定穿什么衣服、寻找从家到办公室的最短路线、检查超市的关门时间以计划何时下班，这些都是我们日常生活中的一部分，几乎是下意识的，却依赖数据来帮助我们做决定。但难道这不正是我们一直以来在的事情吗？为什么它突然变得如此重要？这有两个主要原因：存储成本大幅下降，以及你可以使用机器学习（ML）来发现令人兴奋的可能性。\n\
  \n提示：我们已经在 `第 1 章，介绍机器学习工作流]` 中的 `AI 和机器学习的演进` 子小节中详细讨论过这一点。\n\n为了使数据的使用保持相关性，它需要描述其分布方式的变异。重复表达相同内容的数据将变得无关紧要。此外，我们需要一组广泛的变量，这些变量之间的相关性不那么大，但它们共同指向你希望机器学习模型预测的目标特征的泛化。特征相关性和选择是一项非常重要的工作，以确保模型擅长预测它们未见过的数据值。相关性是指输出特征/列的值与一组输入特征值之间关联或关系的程度，使得这种关联可以用于近似预测函数。具有良好相关性的特征是优选的，但如果存在完美相关性，模型可能会过拟合（对训练数据非常敏感，而在测试数据上表现很差）；我们必须避免这种情况。在光谱的另一端，相关性较低意味着模型可能会欠拟合（学习需要很长时间或永远无法学习），因此我们也希望对此保持谨慎。对于目标追求的相关性阈值，并没有魔数字，它通常是迭代实验的结果，但一条通用规则是选择相互相关性小于\
  \ 85% 的特征。\n\n当涉及到表格数据集时，特征工程技术与我们之前看到的不同。最终目标是相同的，即准备特征以便我们实现模型性能的目标指标。你会发现，我们在表格数据集上使用的技术在本质上主要是统计学性的，并根据需求有少数替代方法。好了，话说足够了！让我们开始吧。和以前一样，你需要访问\
  \ SageMaker Studio 笔记本以便跟随并执行代码，我们将尝试各种技术。\n\n要尝试本节中的示例，请参考本章开头的“技术要求”部分以登录 AWS\
  \ 管理控制台，执行加入 SageMaker studio 的步骤，并执行克隆仓库到 SageMaker Studio 以开始。点击与本章章节编号对应的文件夹。如果你看到多个笔记本，节标题将与笔记本名称对应以便于识别。你也可以通过书书开头提供的\
  \ GitHub 仓库被动地跟随代码示例。\n\n我们将使用 SageMaker 中的 Python3 数据科学内核，该内核已预装了我们所需的库。如果你尝试在本地运行，必须安装\
  \ Python 并使用 `pip install` 安装我们将作为代码块部分要导入的包。我们将从简单技术开始，逐渐过渡到高级方法。我们将使用的示例数据集是来自\
  \ Kaggle 的葡萄酒杂志数据集（`[`www.kaggle.com/pabloa/wine-magazine`](https://www.kaggle.com/pabloa/wine-magazine)`），它包含\
  \ 14 万多条观测值，分有 9 个输入特征和 1 个目标特征。GitHub 仓库包含了运行后续几个小节所需的数据文件。请执行笔记本部分 `Load data`\
  \ 中的代码块以创建一个 `Pandas.DataFrame` (`[`pandas.pydata.org/docs/reference/api/pandas.DataFrame.html`](https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.html)`)\
  \ 对象。\n\n# 探索数据 (#toc.xhtml#s77a)\n\n首先，我们将加载并浏览数据，以了解有哪些列/特征以及它们意味着什么。在导航到 `Load\
  \ data` 部分之前，确保你已经执行了第一个代码单元格来更新 Scikit Learn 包（`[`scikit-learn.org/stable/`](https://scikit-learn.org/stable/)`），并重启\
  \ SageMaker Studio 内核（从笔记本页面顶部；然后点击 `Kernel` 然后点击 `Restart Kernel` 和 `Clear All\
  \ Outputs`）。执行代码块以解压克隆仓库时提供的 GitHub 仓库中的葡萄酒杂志数据集（位于 `[`www.kaggle.com/pabloa/wine-magazine`](https://www.kaggle.com/pabloa/wine-magazine)`）。执行以下代码将数据加载到\
  \ `Pandas.DataFrame` (`[`pandas.pydata.org/docs/reference/api/pandas.DataFrame.html`](https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.html)`)\
  \ 以探索数据。\n\n注意：我们在 SageMaker Studio 笔记本使用的内核是 Python 3 数据科学版本，它预装了我们大部分所需。\n\n```python\n\
  import pandas as pd\n\n### 我们首先将数据加载到 Pandas dataframe 中，以便我们处理\n\nwine_raw_df =\
  \ pd.read_csv('./winemag-data_first150k.csv', sep=';',header=0)\n\nwine_raw_df.shape\n\
  ```\n\n我们得到的结果为 (14037, 10) [注：原文此处为 140K+，此处描述可能有笔误]，意味着有 14 万多行/观测值和 10 列/特征。执行接下来的几个单元格以获取更多详细信息。当我们运行\
  \ `wine_raw_df.head()` 时，我们得到了数据集的前五行，结果如下：\n\n![](img/Figure-3.11.jpg)\n\n**图 3.11:**\
  \ 葡萄酒数据前 5 行\n\n在下一个单元格中执行 `wine_raw_df.info()` 代码以检查数据是否存在缺失值并查看结果。参考 图 3.12：\n\
  \n![](img/Figure-3.12.jpg)\n\n**图 3.12:** 葡萄酒数据检查空列\n\n除了 `last_year_points` 特征外，几乎所有列都有空值。如\
  \ `RangeIndex` 所示，总行数为 144037。如果每个特征的非空计数小于 144037，差值表示该特征的空值数量。我们需要使用插补技术来确定如何填充这些列的缺失值。根据这些信息，我们的特征工程策略如下所示：\n\
  \n![](img/Figure-3.13.jpg)\n\n**图 3.13:** 表格特征工程任务\n\n\n\n\n序列可能会根据你的具体需求而变化，但这是本章将遵循的顺序，如果需要调整顺序，我们将在过程中看到提示。首先，我们将对\
