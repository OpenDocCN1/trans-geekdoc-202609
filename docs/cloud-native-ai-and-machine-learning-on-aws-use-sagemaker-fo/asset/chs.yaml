  \ 20 世纪 50 年代）相似之处，例如用于吸尘、洗碗、拖地的机器人，可以制造汽车的工业机器人，可以进行农作作业的农业机器人，以及可以驾驶飞机的软件机器人。只是阿西姆想象中的机器人是人形外观，而我们今天使用的机器人并非如此。阿西姆的机器人系列无疑是引人入胜的读物，但这与本章有什么关系呢？关系并不多，但确实存在相关性。让我们来看看阿西姆带有正电子脑的人形机器人（`[`www.litcharts.com/lit/i-robot/terms/positronic-brain`](https://www.litcharts.com/lit/i-robot/terms/positronic-brain)`）。阿西姆的构思是赋予机器人逻辑，使其能够看、听、说。\n\
  \n在之前的章节中，我们学习了 AI 服务如何通过机器学习工作流来实现功能。我们将探讨如何利用 AI 服务来构建机器人，包括数据收集、特征工程、模型训练、优化和部署。通过\
  \ AI 服务提供的感知能力，我们无需从头训练模型，即可通过 API 调用实现强大的视觉、听觉和自然语言处理处理能力。\n\n本章将重点介绍这些在计算机视觉、语音、文本和聊天机器人领域提供预训练的\
  \ AI 服务。\n\n## 章节结构\n\n本章将深入探讨以下主题：\n- 介绍 AI 服务\n- 使用 Amazon Rekognition 处理视觉感知（计算机视觉）\n\
  - 使用 Amazon Transcribe 进行语音识别（语音转文本）\n- 使用 Amazon Translate 进行翻译（机器翻译）\n- 使用 Amazon\
  \ Polly 生成语音（文本转语音）\n- 使用 Amazon Comprehend 获取洞察（自然语言处理）\n\n### 目标\n\n在本章中，我们将首先回顾提供感知能力的\
  \ AI 服务分组（正如我们在第一章中讨论过的那样）。请参考下表：\n\n| 机器学习问题类型 | 机器学习子类型 | 案例场景 | AWS AI 服务 | 服务概述\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 感知 | 计算机视觉 | 图像分类、目标检测 | Rekognition\
  \ | 用于各种视频和图像处理的预训练模型 API |\n| 语音 | 语音转文本 | Transcribe | 使用预训练模型将录制或流式对话转换为转录文本\
  \ |\n| 文本转语音 | Polly | 通过 API 使用多种音色和语调从文本创建栩栩如生的语音 |\n| 文本 | 情感检测、实体识别、文本分类 | Comprehend\
  \ |  {语言处理 (NLP) 服务，具备实体识别、分类、情感、语法和语言检测的迁移学习能力 |\n| 机器翻译 | Translate | 通过 API 提供语言能力的预训练机器学习服务\
  \ |\n| 文本提取 | Textract | 使用预训练模型从各种类型的文档和图像中智能地提取文本 |\n| 智能搜索 | Kendra | 由 NLP 索引驱动的企业级搜索服务，使用预训练模型和自然语言查询能力\
  \ |\n| 聊天机器人 | 对话界面 | Lex | 使用机器学习通过简单直观的界面构建高度智能对话界面 |\n\n## 介绍 AI 服务\n\n正如我们在第一章\
  \ `机器学习工作流` 中讨论过的，我们将重点关注提供感知能力的 AI 服务。本章将涵盖如何使用这些服务构建应用程序。在第 11 章 `工业自动化` 中，我们将讨论其他分类。\n\
  [/content]\n\n\n\n\n机器人耳朵应该具备在声音中检测语音的能力，并解释和理解口语含义，这也被称为自动语音识别或 ASR。[Amazon Transcribe](https://aws.amazon.com/transcribe/)\
  \ 是一项全托管的 AI 服务，具有强大的预训练 ASR 模型，不仅可以将语音转录为文本，还可以帮助得出关键洞察，支持实时和批量转录，并能够使用您自己的词汇表自定义转录输出，或使用自定义语言模型增量地训练适用于您业务语义的\
  \ ASR 模型。Amazon Transcribe 提供了不同编程语言的 API（`https://docs.aws.amazon.com/transcribe/latest/APIReference/Welcome.html`）（例如用于\
  \ Transcribe 的 Python SDK：`https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/transcribe.html`），通过这些\
  \ API，你可以轻松利用强大的 ASR 能力来转换你的应用程序。下面的图片显示了 Amazon Transcribe 控制台。我们将在下一节中使用 Amazon\
  \ Transcribe API 来学习如何构建语音识别。\n\n![](img/Figure-10.2.jpg)\n\n**图 10.2：** Amazon\
  \ Transcribe 控制台\n\n# 用于计算机视觉的 Amazon Rekognition\n\n威廉·莎士说：“眼睛是灵魂的窗户”，但他指的不是机器人的眼睛，后者只不过是一组将物体光线捕获成图像或视频的弯曲玻璃板，即摄像头。不仅仅是记录图像，我们的机器人还需要配备某种形式的智能来检测和识别图像以具有功能性。这样，我们的机器人就可以根据它“看到”的内容采取行动，并对环境做出智能反应。这就是为什么对于机器人的眼睛，我们可以使用\
  \ [Amazon Rekognition](https://us-east-1.console.aws.amazon.com/rekognition/home?region=us-east-1#/**)，这是一项全托管的计算机视觉\
  \ AI 服务，其预训练模型提供了分析图像和视频、检测图像中的物体、面部特征比较、内容审核等功能。由于这些强大的计算机视觉模型可以通过 API 调用来提供，你只需要几行代码就能让你的应用程序具备视觉\
  \ AI 能力，适用于各种常见的视觉类用例，包括检测员工在进入你的设施时是否穿戴个人防护装备（`PPE`）。下面的图片显示了 Amazon Rekognition\
  \ 控制台。我们将在下一节中使用 Amazon Rekognition API 来学习如何如下图所示构建计算机视觉：\n\n![](img/Figure-10.3.jpg)\n\
  \n**图 10.3：** Amazon Rekognition 控制台\n\n# 用于机器翻译的 Amazon Translate\n\n托马斯·凯廷神父说：“上帝的第一种语言是沉默。其他一切都是翻译。”为了找到平静，沉默可能足够，但要与世界生活和互动，就需要语言。由于世界各地多个文明的演变，我们现在拥有多种语言，每种语言都有其独特的文化意义、社会修饰、语法结构和变化。今天世界上有多达\
  \ 7000 口语，以高准确度手动翻译语言确实是一项艰巨的任务，耗时且成本极高。因此，如果你制造了一个英语很好的机器人，但在法国或德国销售或部署它，它将大用无处。这时你可以使用像\
  \ [Amazon Translate](https://aws.amazon.com/translate/) 这样的机器翻译服务，这是一项全托管的 AWS AI\
  \ 服务，支持 75 种语言（并将继续添加更多），无需任何机器学习训练或专业知识，只需通过简单的 API 调用即可。你还可以使用并行数据文件（`https://docs.aws.amazon.com/translate/latest/dg/customizing-translations-parallel-data.html`）或自定义术语（`https://docs.aws.amazon.com/translate/latest/dg/how-custom-terminology.html`）自定义翻译，以引入你独特的风格。Amazon\
  \ Translate 可以使用另一个名为 Amazon Comprehend（我们机器人的*大脑*）的 AWS AI 服务自动检测源语言，我们将在后续章节介绍它。想象一下，如果我们用\
  \ Amazon Translate 为你的机器人用你选择的语言听并回答你，难道不酷吗？你还可以配置你的机器人允许用一种语言听并用另一种语言回答。事实上，使用\
  \ Amazon Transcribe 和 Amazon Translate，你可以创建一个《星际迷航》中提到的[通用翻译器](https://memory-alpha.fandom.com/wiki/Universal\\\
  _translator)，但它是用于地球语言的。尽管如此，使用 Translate 能做的事情是没有限制的。下面的图片，[图 10.4]，显示了你可以用来尝试实时翻译的\
  \ Amazon Translate 控制台。在下一节中，我们将使用 Translate API 来学习如何为应用程序添加机器翻译：\n\n![](img/Figure-10.4.jpg)\n\
  \n**图 10.4：** 运行中的 Amazon Translate\n\n# 用于文本转语音的 Amazon Polly\n\n到目前，我们已经有了一个可以听见你（使用\
  \ Amazon Transcribe）、看到你（使用 Amazon Rekognition）并将你说的话翻译成其他语言的机器人，但它还无法回答你。我们可以在机器人中安装音频播放器和扬声器，但我们仍然需要找到将文本合成音频流的方法，以便机器人语音回答你。[Amazon\
  \ Polly](https://aws.amazon.com/polly/) 是一项文本转语音 AI 服务，通过 API 调用即可为你的应用程序添加语音，无需训练或管理机器学习模型。截至\
  \ 2022 年 7 月，Polly 支持 33 种语言和 70 多种声音，并继续添加更多语言和声音。通过 Polly，你可以与 AWS 团队合作为你的品牌创建自定义声音，从三种不同的风格（标准、神经或新闻主播）中进行选择，并为应用程序提供真实的语音体验。因此，Amazon\
  \ Polly 是我们赋予机器人语音功能的好选择，好消息是我们有多种语言以及男女声供选择。在下一节中，我们将使用 Polly API 演示如何构建使用语音响应的应用程序。下面的图片显示了\
  \ Amazon Polly 控制台，带有实时测试声音选项：\n\n![](img/Figure-10.5.jpg)\n\n**图 10.5：** Amazon\
  \ Polly 控制台\n\n# 用于获取洞察的 Amazon Comprehend\n\n\n\n\n\n当感官提供输入并对刺激做出反应时，人体的认知方面则源于身体的大脑。然而，在我们的\
  \ AI 服务中，每个服务都结合了感知组件和认知组件，以提供它们设计的功能。例如，在 `Amazon Rekognition` 中，你可以将感官组件视为处理输入图像的层，将认知组件视为从图像中以标签形式推导出意义的层。但在\
  \ `Amazon Comprehend` 中，该服务专为揭示文本中的洞察和模式而定制，因此它纯粹用于理解或认知，而不具备感官方面。这就是为什么我们选择 `Amazon\
  \ Comprehend` 作为机器人的大脑。它具有从文本中检测命名实体、确定关键短语、检测情感、理解文本语法结构、检测主要语言、确定并混淆文本中的个人身份信息等许多功能，Comprehend\
  \ 是一项核心的 NLP 服务，通过简单的 API 调用即可使用丰富的功能，而无需训练或调优 ML 模型。在下一节中，我们将介绍如何使用 `Amazon Comprehend`\
  \ API 来构建 NLP 应用，但现在，请查看下面的图，了解 Comprehend 实时生成的洞察：\n\n![](img/Figure-10.6.jpg)\n\
  \n**图 10.6：** Amazon Comprehend 实时洞察\n\n好了，是系好安全带并开始执行我们的代码示例以做中学了。在这一节中，我们回顾了 AWS\
  \ AI 服务，并通过可视化设计机器人所需的示例，演示了模拟感官认知功能的关键 AI 服务。在接下来的节中，我们将运行使用 AWS AI 服务 API 执行各种\
  \ ML 任务的代码示例，所有这些都不需要任何 ML 训练或开发。\n\n# 为你的应用程序添加感官认知\n\n在上一节中，我们讨论了如何使用 AWS AI 服务为我们的机器人示例添加认知能力，以及特定功能需要使用哪种服务。我们还简要讨论了这些服务提供的一些功能。我们领略了这些服务的\
  \ AWS 控制台界面。在这一节中，我们将转变策略，采用程序化的方法来处理这些 AI 服务的 API；我们还将学习如何使用它们来转换企业级应用并激发无尽的创新。在开始之前，我们需要确保先决条件已就绪。\n\
