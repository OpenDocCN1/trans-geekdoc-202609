  \n```python\n# 构建 XGBoost 估计器\nxgb_estimator = Estimator(image_uri=xgb_image, hyperparameters=xgboost_hps,\n\
  role=sagemaker.get_execution_role(),\ninstance_count=1, instance_type=’ml.m5.xlarge’,\
