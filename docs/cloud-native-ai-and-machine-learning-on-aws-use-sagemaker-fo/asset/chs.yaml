  \n# 第 1 章\n\n## 介绍 ML 工作流\n\n### 引言\n\n机器学习或 ML 简单来说是教机器学习数据（数字、图像、文本等）中模式的门艺术与科学，并利用这些模式来预测结果或推断标签。与让机器能够很好地执行特定任务的常规编程相比，ML\
  \ 教会机器变得智能并从数据中推导出以前未见过的关系。例如，考虑从银行自动取款机（ATM）提取现金的过程。你插入卡片，机器要求输入密码（PIN），你输入密码，机器验证密码，如果有效，则向你显示银行菜单。这就是常规编程的一个例子。银行的\
  \ ATM 软件识别你的卡片及其关联的账户，知道你的 密码并验证其输入是否正确，最后显示银行菜单。该软件的设计是为了重复且准确地执行此任务。\n\n然而，该软件并没有从用户与其功能的交互中进行学习，也没有接受训练去寻找使用过程中的模式。因此，即使这张卡被插入到与你经常使用地完全不同的国家的\
  \ ATM 中，只要发现 密码有效，ATM 软件也会乐意地发放现金。这当然是一个问题，因为使用 ATM 的可能不是你，而是盗取了你的卡片详情并在你不知情的情况下访问你账户的人。这正是\
  \ ML 真正有帮助的地方；它可以理解这种使用模式存在异常，并触发警报。不仅是异常检测，ML 模型还可以被训练用于检测银行和信用卡交易中的欺诈、分类图像、预测电影类型、检测文本中的情感、从图像和视频中检测物体、识别音频、追踪体育运动中运动员的移动，甚至实现自动驾驶。\n\
  \n在本书中，我们将通过实际示例和详细说明，学习如何一步步构建 ML 工作流并将其应用于各种业务用例。但首先，我们需要理解 ML 和人工智能（或 AI）的一些基础概念：它们是如何产生的，是如何演变的，云计算如何让\
  \ ML 变得更易于触及，以及如何如何利用亚马逊云服务（AWS）的 AI/ML 服务来构建我们的 ML 解决方案。我们还需要学习一些最佳实践，以确定 ML 是否适用于某个业务问题，以及如何在当今大量的\
  \ ML 解决方案构建选项中进行选择。我们将在接下来的章节中介绍这些介绍性概念。\n\n### 结构\n\n在本章中，我们将深入探讨以下主题：\n\n*   AI\
  \ 和 ML 的演变\n*   处理 ML 问题\n*   ML 工作流概览\n*   在 AWS 上介绍 AI 和 ML\n*   在 ML 高速公路中导航\n\
  \n### 目标\n\n本章的目标是帮助提高对 ML 和 AI 在基础层面意义的认知，并作为核心概念的复。无论你是第一次听说 ML，还是一个经验丰富的从业者，本章都将帮助你快速进入状态，并为后续章节中的应用和构建自己的\
  \ ML 解决方案做好准备。本章主要是理论性的，因此更多是阅读和吸收而非操作。当我们进入`第 2 章，填充数据湖`等实操章节时，我们将提供关于如何开始使用 AWS\
  \ 的指导。\n\n## AI 和 ML 的演变\n\n这一切是从象棋游戏开始的！计算机工程师经常使用象棋来测试他们的智能计算机设计，这确实有趣。为什么不是大富翁（Monopoly）或拼字游戏（Scrabble）呢？可能因为象棋是一种技巧游戏，而不是记忆或运气游戏。作者并不是资深棋手，但理解棋子如何移动以及规则是什么。在象棋中，移动的后果策略比移动本身更重要。你不仅需要决定自己的走法，还需要预测对手的反击，然后制定应对策略，等等。在这个类比中，ML\
  \ 决定执行策略，而常规程序执行它。但等一下，我们似乎偏题了！！象棋和 ML 之间有什么联系？为了理解这一点，让我们回到 20 世纪 60 年，那是披头士统治音乐产业时代。\n\
  \n当世界沉浸在《Yesterday》和《Let it be》等热门歌曲中，理查德·格林伯特了第一个人工智能（AI）象棋程序，在世界另一个角落的比赛中与人类对。尽管我们从\
  \ 18 世纪就开始幻想创造智能机器来下象棋，但格林伯特工作的种子是在 1950 年种下的，当时被认为是计算机科学和 AI 之父的艾伦·图灵编写了世界上第一个下象棋的程序。由于那时还没有\
  \ GUI（图形用户界面），图灵本人必须扮演计算机的角色，根据其算法的输出来翻译走法。这里的关键词是“算法”，它是 ML 运作的核心。\n\n\n\n\n如你所见，算法和数据必须配合工作才能创造出成功；机器学习（ML）也是如此。机器学习的学习方面是指算法通过贯穿数据来揭示一种泛化函数，该函数可以帮助它解释输入值（数据中的一组列）如何帮助推导出输出（我们想要预测的目标列）。当得到的函数具有足够的准确率时，该算法即被认为已学习完成，并暴露在仅限未见的输入列数据中，以预测目标列或输出。这就是机器学习或\
  \ ML 的核心。很简单对吧？它看起来似乎是这样，因为我们似乎做的只是选取几个数学函数，用程序对它们进行编码，反复地向它们投入大量数据，希望建立起某种模式。例如，`Decision\
  \ Tree`（决策树）是机器学习中非常常用的算法，用于分类（预测类别）或回归（预测数值）问题。简单来说，`Decision Trees`（在`图 1.1`中所示）是决策流程图引导结果结果，根据我们试图解决的问题，结果可以是一个类别也可以是一个数值。它主要帮助模型理解数据中的泛化性，从而导致特定的决策或目标值，模型通过从训练集中标记有决策标签的特征中学习：\n\
  \n![](img/Figure-1.1.jpg)\n\n**图 1.1：** 用于确定菜品的决策树\n\n然而，在获得运行良好的 ML 模型之前，每一步都要面临克服的重大挑战。其中最大的是完成\
  \ ML 训练任务所需的设施或硬件能力。直到 20 世纪中期，在云计算普及之前，只有规模最大且资金最充足的企业才有能力建立运行 ML 训练所需的规模的设施。由于需要拍字节级的数据存储、高性能计算硬件（集群中许多高性能核心）用于缩短训练时间的分布式架构，以及\
  \ TERAFLOPS（每秒万亿次浮点运算）甚至 petaflops 的处理能力，成本被推高。根据 2022 年 2 月访问的这有趣的文章（`[`visual.ly/community/Infographics/technology/cost-data-storage-through-years`](https://visual.ly/community/Infographics/technology/cost-data-storage-through-years)`），1MB\
  \ 存储的成本从 1956 年的 10,000 美元演变为 2005 年的 0.0006 美元。然而，对于需要数百 TB 或 PB 级数据的大规模 ML 训练，仅存储成本在\
  \ 2000 年代就处于 10 万到 50 万美元之间。再加上处理能力的价格，2003 年每 GFLOPS 的成本为 82 美元（根据 2022 年 2 月访问的这篇文章\
  \ `[`aiimpacts.org/wikipedia-history-of-gflops-costs/`](https://aiimpacts.org/wikipedia-history-of-gflops-costs/)`），这仅计算费用方面就约等于\
  \ 10 万美元；很快地，除了大型企业外，ML 的初始投资就变得无法负担。\n\n这就是为什么在云计算出现之前，ML 一直是一项边缘技术。AWS 是将高性能计算的力量民主化并让每个人都能用得起的先驱，这为\
  \ ML 成为主流铺平了道路。今天，各种规模和各行业的公司都在利用 ML 的力量和能力来实现各种用例，且 ML 应用列表在不断增长。凭借按需付费的定价和在全球范围内几分钟内启动设施的灵活性，可能性是无限的。例如，在\
  \ `p3.16x.large` 实例上运行一小时 ML 训练仅需 28.15 美元，该实例是今天云中最强大的高性能实例之一，拥有 8 个 V100 Tensor\
  \ Core GPU、64 个 vCPUs 和 25 Gbps 的网络性能。\n\n当我们继续研究 ML 过去面临的一些其他挑战时，我们看到了为什么 AWS 的云原生\
  \ AI/ML 服务会流行并在企业中被广泛采用。在解决了设施挑战后，机构难以雇佣具备创建 ML 算法所需技能的专家，即高级数学和编程的结合。我们谈论的是拥有计算机科学博士学位并积极从事应用研究的科学家。他们非常罕见（现在仍然如此），而且对于大企业以外的所有所有人来说，负担能力都是一个问题。设施和技能要求的共同导致\
  \ ML 项目需要很长时间才能完成。此外，运行 ML 的关键数据通常分布在组织内部和外部的异源中，使得分析和操作成本高昂。\n\nAWS 的 AI/ML 能力旨在消除这些障碍，让组织轻松采用\
  \ ML 并转型业务。首先，我们看到通过按需付费定价，设施供应是简单且高效的。为了解决 ML 技能短缺的问题，AWS 提供了 AI 服务层，通过 API 调用提供预训练\
  \ ML 模型，适用于图像分类、目标检测和自然语言处理等常见用例。SageMaker 是一种 AWS 服务，提供了集成开发环境中执行端到端 ML 工作流任务的能力。由于\
  \ AI/ML 服务与其他 AWS 服务原生集成，因此从各种源摄取数据、进行转换和分析、提取特征、运行预处理任务并将其用于 ML 训练变得非常。我们将在后续章节和全书中详细介绍如何这样做。\n\
  \n随着云计算的普及 ML 开始成为主流，ML 用例的范围复杂性增加，出现了对自动驾驶、癌症检测和气候研究等更智能应用的需求。这导致了能够学习数十亿参数的深度学习模型的发展。这需要一种能够更深入学习数据复杂性的分层架构，因此神经网络诞生了。深度学习和神经网络驱动了过去\
  \ AI 革命。神经网络或 `人工神经网络` (`ANN`) 是计算环境下人类大脑工作方式的数学表示。神经元堆叠在输入层、输出层和隐藏层的组合中。隐藏层中的每个神经元的输入是上一层输出的乘积和。当前层的神经元还分配了随机系数称为权重，并加上了静态偏置，这个组合值被传递给激活函数，从而决定传递到下一层的输出。以下图像显示了神经网络是如何构建的：\n\
  \n![](img/Figure-1.2.jpg)\n\n**图 1.2：** 用于二分类的简单三层神经网络\n\n\n\n\n有多种类型的激活函数，例如用于深度学习网络的\
  \ `Rectified Linear Unit`（`ReLU`）、`Sigmoid and Hyperbolic Tangent`（Sigmoid 与双正切）；`ReLU`\
  \ 是目前最常用的。根据深度学习任务的不同，有多种类型的神经网络可用，其中最流行的包括用于图像处理的`Convolutional Neural Networks`（CNNs）、用于语音/文本处理的`Recurrent\
  \ Neural Networks`（RNNs），以及用于语言翻译任务的、结合了 `RNNs` 的序列到序列模型（sequence to sequence）。关于神经网络和激活函数的更多详细信息，请参阅\
  \ AWS Machine Learning University 提供的培训课程，网址为 `https://aws.amazon.com/machine-learning/mlu/`。\n\
  \n在深度学习蓬勃发展的同时，公司也在开发 ML 框架，以便开发者和数据科学家能够组装用于 ML 训练的算法和神经网络。一些流行的 ML 框架包括 `Apache\
  \ MXNet`（`https://mxnet.apache.org/versions/1.9.0/`）、`Google Tensorflow`（`https://www.tensorflow.org/overview/`）以及\
  \ Facebook 的 `PyTorch`（`https://pytorch.org/`）。此外，用于常见 ML 任务的 `Scikit Learn`（`https://scikit-learn.org/stable/`）和用于基于图神经网络的\
  \ `Deep Graph Library`（`https://www.dgl.ai/`）在 ML 爱好者中也相当受欢迎。AWS 支持所有这些框架以帮助你构建\
  \ ML 解决方案。根据 ML 的的需求，你可以组合算法、神经网络和框架。供你参考，下表显示了 ML 框架如何应用于常见的 ML 用例。这些应被视为建议，且根据具体场景，实现相同目标有多种方法：\n\
  \n| ML 主题 | ML 用例 | ML 框架/库 | 算法/神经网络 |\n| :--- | :--- | :--- | :--- |\n| 计算机视觉\
  \ | 图像分类 | TensorFlow Keras, MXNet, PyTorch | CNN |\n| 目标检测 | TensorFlow object\
  \ detection, MXNet GluonCV, PyTorch Detectron2 | CNN, 单次检测器 (SSD), 你只看一次 (YOLO)\
  \ |\n| 实例分割 | TensorFlow object detection, MXNet GluonCV, PyTorch | Mask R-CNN |\n\
  | 自然语言理解 | 自动语音识别 | TensorFlow, MXNet LSTM, PyTorch | RNN, 长短期记忆 (LSTM) |\n| 机器翻译\
  \ | 机器翻译 | TensorFlow, MXNet, PyTorch | RNN, 神经机器翻译, Sequence2Sequence |\n| 自然语言处理\
  \ | 情感分析 | TensorFlow Keras, MXNet Gluon, PyTorch | RNN, CNN, 支持向量机 (SVM) |\n| 文本分类\
  \ | 文本分类 | TensorFlow Keras, MXNet Gluon, PyTorch | Amazon SageMaker Blazing Text,\
  \ FastText, SVM, RNN, 随机森林 |\n| 表格数据 | 回归 | TensorFlow Keras, MXNet, PyTorch | 线性回归,\
  \ 决策树, XGBoost, 多层感知器 (MLP) |\n| 分类 | 分类 | TensorFlow Keras, MXNet, PyTorch | 线性回归,\
  \ 决策树, XGBoost, MLP |\n\n**表 1.1：** ML 用例到框架和算法的映射。\n\n你敏锐的直觉可能会好奇，为什么我们在之前的段落中提到比披士乐队。音乐与\
  \ ML 之间有什么联系？你会惊讶地发现，AI 和 ML 的影响不仅限于工业应用；它们也涵盖艺术领域。例如，`AWS DeepComposer` 是一个用于教育\
  \ ML 能力的服务，它不仅能增强人类创作的音乐，还能根据你提供的基础乐曲创建完全新的音符和旋律。请下面的图，它展示了你如何使用 `DeepComposer`\
  \ 通过 ML 创作音乐：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3：** AWS DeepComposer 音乐工作室\n\n\
  DeepComposer 使用了多种 ML 技术来实现这一点，例如`生成式对抗网络`（`GANs`）、`自回归卷积神经网络`（`AR-CNNs`）和 Transformers。GANs\
  \ 通过建立两个相互竞争的神经网络（其中一个使用无监督学习，另一个使用有监督学习），能够以原始曲目伴奏的形式创建新音乐。通过 `AR-CNNs`（自回归神经网络），音乐生成被视为一个时间序列问题。于\
  \ 2017 年引入的 Transformers 允许并行处理数据并考虑长期依赖，这克服了 `CNNs` 和 `RNNs` 的限制。如果你感兴趣了解更多并尝试，可以访问\
  \ `https://aws.amazon.com/deepcomposer/`。\n\n现在我们已经勾起了你的兴趣，是时候深入探讨从何处开始了。ML 已经存在了一段时间，可选的选择到让你在为项目确定正确的路线图时感到无从。。这就是为什么方法与执行同等重要。在下一节中，我们将学习如何应对业务挑战并确定\
  \ ML 是否合适、做出这种判断的一些最佳实践是什么，以及接下来的步骤是什么。在掌握了一些 ML 的核心概念以及云计算如何使其流行的之后，我们需要问问自己：ML\
  \ 是否是每个问题的答案？考虑到它的易用性以及对可能实现性的兴奋感，我们可能会倾向于使用 ML 来解决被交付的每一个挑战，但这不是一种理性的方法，因为 ML 项目具有迭代性，需要时间，并且带有成本影响。因此，我们需要问的第一个问题是：“这真的是\
  \ ML 问题吗？”\n\n假设你是一家大型零售商的 AI/ML 专家，你的经理希望你构建一个用于库存优化的 ML 解决方案，因为零售商最近由于商店和供应商之间的需求管理不当遭受了损失。因此，你首先开始调查这种情况是否真的需要\
  \ ML。\n\n你的调查显示，你不需要 ML 来解决库存分配问题。系统只需要进行调整，以更流畅的方式调节库存补货，并建立阈值以便在遇到需求激增时警报主管。但你也意识到\
  \ ML 可以通过一种预测库存需求的需求预测解决方案在这种情况下增加价值。为了推进这一点，你开始学习 `Amazon Forecast`（`https://aws.amazon.com/forecast/`），这是来自\
  \ AWS 的一种全托管自动 ML 驱动的时间序列预测服务。\n\n\n\n\n\n那么，你如何知道哪些场景需要机器学习（ML），哪些场景可以通过常规编程解决呢？为了回答这个问题，让我们首先了解机器学习的不同类型、它们如何映射到它们可以解决的业务挑战，以及它们在解决方案开发的整体背景中处于什么位置。你可以将\
  \ ML 视为工具、流程、框架、技术和 API 的集合，旨在辅助应用人工智能解决方案的开发。任何没有意识但能从其输入中学习和演化的实体都被被认为是人工智能的。在这种背景下，ML\
  \ 让 AI 成为其是。但并不止于此。正如我们在上一节中看到的，随着云计算的出现和 ML 的普及，技术演进到了深度学习（DL），以解决更大的问题并现在数十亿个参数上实现复杂的学习。当\
  \ ML 还在尝试框架和算法时，DL 引入了神经网络、分布式训练、数据并行等“重型设备”。正是 DL 让此前相对较弱的 AI 尝试（例如文本转语音中听起来像机器人的声音）变得更具人味，从而真正地彻底改变了\
  \ AI 领域。请参阅`图 1.4`，它展示了 AI、ML 和 DL 之间的关系：\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4：**\
  \ AI、ML 和 DL\n\n本质上，DL 是 ML 的子集，它们对 AI 领域都有贡献。当你构建神经网络来训练大规模模型时，你正在进行深度学习。例如，使用\
  \ Transformer 模型通过自然语言处理进行文本摘要。当你使用算法执行中等规模的任务时（例如使用 `Decision Trees` 预测特定结果），它属于\
  \ ML。ML 和 DL 可以根据它们学习泛化方法的方法进一步分类。我们将在接下来的小节中讨论最常见的类别。\n\n## 监督学习\n\n当你通过为想要预测的列列提供带标签的数据来训练模型时，这被称为监督学习。你正在告诉模型使用一组标记好的输入值作为训练数据集，学习一个用于预测目标值的近似函数。假设问题是预测房价；你利用房屋价格的历史数据训练模型，并结合房屋的面积、地理位置、附近的学校和交通便利性等输入值。由于历史数据在训练集中将房价作为标签，因此它可以近似输入值与房价之间的关系。\n\
  \n**示例算法：** `XGBoost`、`Linear Regression`、`Naïve Bayes`、`Support Vector Machines`\n\
  \n**常见用途：** 情感分析、电影类型预测、癌症预测、流失预测\n\n## 无监督学习\n\n当你在数据中没有标签的情况下训练模型时，这被称为无监督学习。这种技术主要用于聚类或异常检测需求。假设你有一份大型的人口统计学数据集，想要确定影响个体数据点分组的主要因素；聚类是确定这些因素的好方法。如果数据根据年龄、种族、性别、就业状态等方面存在共同点，聚类将揭示这些共同点。或者，你想确定是什么导致你的网约车数据集中触发了溢价，无监督学习算法可以帮助你隔离这些峰值。除了异常检测和聚类，无监督学习还应用于最近邻、降维等领域。\n\
  \n**示例算法：** `K-means Clustering`、`K-Nearest Neighbours`、`Principal Component Analysis`、`Random\
  \ Cut Forest`\n\n**常见用途：** 欺诈预测、异常检测、数据分布分析\n\n## 强化学习\n\n在这里，学习是通过智能体（agent）与其环境之间交互和激励的迭代过程实现的。奖励函数决定激励。如果环境中的智能体采取了正确的动作（从智能体可选动作列表中），它将获得奖励；如果采取了错误的动作，它将受到惩罚。有两个网络工作以实现学习。智能体的价值网络被设置为最大化奖励，从而最大化价值。策略网络学习智能体采取的每个输入动作的结果。这种学习类似于现实生活中训练狗的情况。如果它的表现良好，你就给它吃零食；如果它做了坏事，你就惩罚它。通过这样，狗就学会了良好的行为。\n\
  \n**示例算法：** `Proximal Policy Optimization`、`Deep Q Network`\n\n**常见用途：** 自动驾驶、游戏、无人机\n\
  \n## 要 ML 还是不要 ML\n\n现在我们了解了 ML 的不同类型及其用途，让我们来解决当你开始帮助自己的客户采用 ML 时将面临的问题：“要 ML 还是不要\
  \ ML”。为了让你的决策更容易，下表涵盖了你面对这个问题的常见情况，以及帮助你为项目做出正确决策的考虑因素：\n\n| **客户需求** | **可能的用例**\
  \ | **要 ML 还是不要 ML？** | **为什么？** |\n| --- | --- | --- | --- |\n| 投资组合跟踪 | 跟踪多次交易中的组合仓位并提供损益状态更新\
  \ | 不需要 ML | ML 基于派生和预测工作。此此用例是要求跟踪跨交易的损益。常规编程可以做到这一点。 |\n| 预测股价 | 预测未来股价 | ML |\
  \ 在这里，我们要求根据历史表现预测未来值，这正是 ML 擅长的领域。 |\n| 确定产品类别的税号 | 根据产品信息查找税号 | 不需要 ML | 这里不需要预测或推导出任何内容。它是基于输入值组合的预定义值的查找函数。\
  \ |\n| 零件检查自动化 | 监控、检测并告警缺陷零件 | ML | 这需要智能分析图像或视频以判断物体状态，因此需要 ML。 |\n| 确定支持的新产品功能\
  \ | 识别新产品线或功能的市场兴趣 | 不需要 ML | 虽然 ML 可以辅助信息建模，但实际决策需要对底层因素进行逻辑分析。 |\n| 公用事业用量跟踪和计费\
  \ | 跟踪客户对公用事业的使用并生成月单 | 不需要 ML | 有电表可以跟踪用量并提供这些信息。金额可以根据费率类别和用量计算。 |\n\n**表 1.2：**\
  \ 要 ML 还是不要 ML\n\n“如果我有一小时来拯救世界，我会花五十五分钟来定义问题，只花五分钟寻找解决方案。”\n\n吸收量很大，对吧？也许吧。但我们只是接触了\
  \ ML 潜力的表面。我们现在将深入研究 ML 到底是什么，以及如何构建安全、可靠且扩展的世界级 ML 应用程序。在解决通常包含许多活动部分的复杂 ML 问题时，一种系统的方法非常有帮助。它不仅指导我们需要做什么，还告诉我们如何做、需要遵循什么顺序、哪些需要优先处理以及哪些工具可以帮助我们完成任务。在下一节中，我们将学习\
  \ ML 工作流、ML 解决方案构建的关键组件，以及如何利用它在你的 ML 项目中成功。\n\n\n\n\n\n如果你以前从未参与过 AI/ML 项目，那么你找对地方了。如果你以前做过\
  \ ML 项目，但想学习像某些大型企业那样如何端到端地执行，你依然找对地方了。简单来说，一切都开始于、存在于并结束于 **ML 工作流（ML workflow）**。如果这个领域真的有所谓的“十诫”，那么它们将由\
  \ ML 工作流定义。为什么它如此重要？因为它为你提供了实现项目所需的所有内容的蓝图。你可以将其看作是一份任务清单，并包含了如何设计和实现 ML 解决方案的规范性指导。话不多说，让我们直接进入主题。请参阅\
  \ `图 1.5` 获取 ML 工作流的概述：\n\n![](img/Figure-1.5.jpg)\n\n**图 1.5：** 使用 AWS 服务的 AI/ML\
  \ 工作流\n\n如你所见，这张图片非常复杂，有很多方框、箭头和大量的文本。但整个过程具有逻辑上的简单性，我们将在接几个小节中尝试强调这一点，希望能为你揭开这张图的神秘纱。\n\
  \n## 通用 ML 与自定义 ML\n\n首先，必须存在一个业务需求来促使 ML 项目的创建。不要仅仅因为这看起来很酷或者因为“错失恐惧症”（FOMO）就试图在你的组织中尝试\
  \ ML。如果你只是想了解这项技术，当然可以继续。你可以扩展现有的业务需求，使用 ML 来提高效率。例如，在解决库存管理问题时，你可以使用 ML 实现需求预测，以提高运营效率。有关更多详细信息，可以参考上一节“如何处理\
  \ ML 问题”：\n\n![](img/Figure-1.6.jpg)\n\n**图 1.6：** 针对通用解决方案的 AWS AI 服务\n\n一旦有了明确的需求并且我们充分理解了问题，我们就必须确定它是可以通过通用\
  \ ML 解决方案解决，还是需要自定义开发。下表将引导你识别常见问题类型，对于这些类型，AWS 提供了名为 **AWS AI 服务** 的预训练 ML 模型，通过\
  \ API 提供服务，你可以轻松地将其包含在应用程序中，而无需担心模型训练。我们将在下一节讨论 AWS AI 服务：\n\n| ML 问题类型 | ML 子类型\
  \ | ML 用例 |\n| :--- | :--- | :--- |\n| 感知认知 | 计算机视觉 | 图像分类、目标检测 |\n| 语音 | 语音转文本\
  \ | |\n| | 文本转语音 | |\n| 文本 | 情感检测、实体识别、文本分类 |\n| | 机器翻译 | |\n| | 文本提取 | |\n| | 智能搜索\
  \ | |\n| 聊天机器人 | 对话接口 | |\n| 企业/工业 | 业务工具 | 欺诈检测 |\n| | 推荐系统 | |\n| | 预测 | |\n|\
  \ | 异常检测 | |\n| 工业智能 | 预测性监控 | |\n| | 预测性分析 | |\n| 医疗保健 | 文本分析 | |\n| | 语音分析 | |\n\
  | | 医疗分析 | |\n| 运营 | 开发智能 | 代码优化 |\n| | IT 运维优化 | |\n\n**表 1.3：** 通用 ML 问题及用例\n\n\
  如果该 问题 问题需要自定义解决方案（即无法通过前面讨论的通用解决方案解决），那么我们必须执行 ML 工作流中的步骤，从数据准备开始，然后是模型训练、部署以及可选的监控。这就是为什么我们的\
  \ ML 工作流被分为三个主要领域：数据准备、模型训练和模型监控。这些任务在这些组之间共享功能。请注意，如下图所示，当你执行组中的每项任务时，你必须像粉色箭头所示那样反复迭代回：\n\
  \n![](img/Figure-1.7.jpg)\n\n**图 1.7：** ML 工作流是一个迭代过程\n\n这是因为 ML 在默认情况下是一个迭代过程。你首先设定模型需要达的目标准确率（或其他基于算法的指标），然后通过迭代执行各项任务以达到该准确率。有时你认为你已经拥有了所有需要的数据，且算法对于数据和问题来说是正确的，但你的模型在训练过程中可能会过拟合。这意味着你需要回到数据收集阶段在数据中引入错误/离群值；这就是为什么我们需要反复迭代。我们将在接下来的几个小节中讨论\
  \ ML 工作流的任务。\n\n## 数据准备\n\n在本书中，我们将通过现场代码示例向你展示如何执行每一步，但简而言之，数据收集是确定训练模型需要哪些数据、识别这些数据在企业中的位置，并确定如何将这些数据源源到\
  \ AWS 的数据湖（Data Lake）存储中的过程。下一章中，我们将讨论如何在 AWS 上构建自己的数据湖，以及如何将数据摄入此数据湖。数据湖构建在 Amazon\
  \ S3 对象存储之上，它可以扩展到任何规模，并为你的数据提供 11 个 9 的持久性。有关更多详细信息，可以参考 `https://aws.amazon.com/products/storage/data-lake-storage/`。在下面的图中，我们看到了作为\
  \ ML 工作流数据准备阶段需要执行的主要步骤：\n\n![](img/Figure-1.8.jpg)\n\n**图 1.8：** 准备数据\n\n现在你已经在数据湖中拥有所需的数据，下一步是预处理数据。当数据进入数据湖时，它并没有从源格式进行转换，无法立即用于你的\
  \ ML 训练。你通常在数据提取时进行转换。因此，这一步对于获取正确质量的数据至关重要。如果你的 ML 类型是监督学习（Supervised Learning），那么这一步就是为数据集中添加标签（你希望模型预测的目标列的值），如果它们还的话。AWS\
  \ 提供了专门的服务来帮助处理数据处理任务，例如用于数据标注的 Amazon SageMaker Ground Truth (`https://aws.amazon.com/sagemaker/data-labeling/`)、用于托管\
  \ ETL 的 AWS Glue (`https://aws.amazon.com/glue`)、用于 MapReduce 的 Amazon EMR (`https://aws.amazon.com/emr/`)、提供预构建转换的\
  \ SageMaker Data Wrangler (`https://aws.amazon.com/sagemaker/data-wrangler/`) 以及\
  \ SageMaker Processing (`https://docs.aws.amazon.com/sagemaker/latest/dg/processing-job.html`)，后者提供了使用其内置\
  \ Scikit Learn 容器或 PySpark 运行数据转换、缩放、归一化和其他数据操作任务的全托管基础设施。\n\n为了验证我们的数据预处理任务确实产生了与我们想要预测的内容最相关的列/特征集合，并确保我们拥有\
  \ ML 训练所需量、范围和规模，我们需要对数据进行可视化，了解离群值，确定分布拓扑并修剪数据，以获得我们所需的形状。这是我们 ML 工作流中的下一项任务，称为数据分析和可视化。AWS\
  \ 提供了 Amazon QuickSight (`https://aws.amazon.com/quicksight/**`)，这是一种从数据创建智能仪表板的\
  \ BI 服务，包括创建直方图、热力图、散点图、箱线图等功能。\n\n\n\n\n\n**注意**：在实现工作流时，在继续下一个任务之前，你需要做一个中间决策。如果你想完全自动化特征工程、模型训练和评估任务，可以使用像\
  \ SageMaker Autopilot (https://aws.amazon.com/sagemaker/autopilot/) 或 AutoGluon\
  \ (https://gluon.ai/stable.html) 这样的 AutoML 选项。我们将在第 8 章详细介绍这些。相反，如果你喜欢自己训练和调优模型时的这种灵活性，就可以继续执行剩余的任务。\n\
  \n## 训练准备\n\n在工作流的这一阶段，你已经完成了数据转换并准备就绪，并且对你想要训练的模型有了合理的设想。接下来的任务如图所示：\n\n![](img/)。通过\
  \ Amazon SageMaker Data Wrangler 和 Feature Store，你可以整合数据预处理和特征工程任务，收集你的特征，甚至将它们复用于类似的\
  \ ML 任务。\n\n我们现在进入工作流中一个令人兴奋领域：算法选择。公平地说，你可能在定义 ML 问题时已经决定了算法。然而，考虑到你对数据的所有了解，现在是重新审视该决策的好时机。选择有很多。例如，如果你尝试训练一个分类器，你是想使用\
  \ Amazon SageMaker 内置的线性回归或 XGBoost，还是想引入支持向量机或随机森林？你可能有一个主想法，但你需要确定。\n\n**提示**：此阶段的另一种替代方法是使用\
  \ AutoML，它使用许多算法和超参数（定义模型如何学习特定配置参数）来训练候选模型，并推荐性能最好的模型。\n\n那么如何推进呢？很简单。你遍历不同的算法，并根据你需要的目标精度选择性能最好的一个。记住，机器学习中的关键词是迭代！\n\
  \n下一步与算法选择是密不可分的。它们不是两个独立的任务，通常是共同执行的。超参数调优或超参数优化是训练多个具有不同超参数配置的候选模型的过程，以确定哪种 `hyperparameters`\
  \ 组合在使算法和数据满足我们的目标精度方面能产生最佳结果。庆幸的是，Amazon SageMaker 提供了一个易于使用的 API (https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning.html)，你可以利用它在模型训练期间添加超参数调优。\n\
  \n### 模型训练\n\n下一步是模型训练；在大多数情况下，这可以被视为占位任务，因为你可能已经早开始了训练。如果你使用了 AutoML，或者你的超参数调优任务产生了预期结果，你可以跳过此步直接进入模型评估和部署。如果没有，使用此步骤尝试不同的算法和超参数组合，以根据目标评估指标获得正确的模型。在此阶段执行的任务如图所示：\n\
  \n![](img/how-it-works-training.html) 提供了一个 SDK (https://sagemaker.readthedocs.io/en/stable/overview.html)\
  \ 和几类训练实例 (https://aws.amazon.com/sagemaker/pricing/)，你可以使用它们来定义估计器、超参数并运行 `fit`\
  \ 以在托管基础设施上开始模型训练。\n\n在训练模型之前，你划分了数据以创建一个占总训练数据 15% 到 20% 的盲测数据集。模型尚未见过这些盲测数据，因为它们已从你的训练数据集中移除。在这一步中，将在这些数据上运行模型评估，并将盲测数据的模型预测与原始训练标签（也称为真实数据）进行比较，以计算指标并评估模型是否足够部署到生产环境或需要更多工作。我们之前提到过准确率是指标之一。对于分类问题，准确率往往受到类别标签分布的影响，因此不是一个良好的指标。更好的选择是\
  \ AUC（受试者操作特征曲线下的面积），它绘制了各种分类阈值的真阳性率和假阳性率（更多细节请参考 https://docs.aws.amazon.com/machine-learning/latest/dg/binary-model-insights.html），并且更加平衡。因此，根据你训练的模型类型，决定评估指标，对模型运行你的盲测数据，获取预测标签，将其与原始训练标签比较，计算\
  \ AUC 并将其与你的目标值比较以完成评估。\n\n你几乎到达 ML 工作流的终点了。在这个阶段，你已经收集并准备了数据、识别了特征、选择了算法、进行了超参数调优，并训练和评估了你的模型。根据评估指标，它似乎符合业务需求。你现在准备好将模型部署到生产环境进行推理了。Amazon\
  \ SageMaker 根据你的基础设施需求、推理类型和项目提供了多种选项。通过 SageMaker 部署 (https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-deployment.html)，你可以设置端点（为你的训练模型配置基础设施的\
  \ API）进行实时推理。如果流量不可预测，你也可以使用 SageMaker 无服务器推理。你还可以根据请求路由频率配置异步推理和批量转换。还有额外的选择，通过设置多模型端点或创建推理流水线来优化推理成本，你还可以为你的端点配置自动伸缩。\n\
  \n\n\n\n\n在此阶段，你已经完成了机器学习（ML）项目开发的主要任务，你的模型已部署在生产环境中并高效地处理推理请求。随着时间的推移，你会发现模型训练时的基准分布与其推理响应的经验分布之间存在偏差。这被称为`数据漂移`（data\
  \ drift）；如果模型遇到了与`training_dataset`不同的新数据，或者底层业务背景发生了变化，就会出现这种情况。接下来的几项任务将有助于监控模型性能，并通过主动学习框架实现自动化缓解。\n\
  \n## 模型监控\n\n传统上，监控被认为是一个可选的步骤，但由于人工智能和机器学习在当今业务运营各个领域的普及，这在现在正变得越来越主流。如图所示，ML 工作流建议进行监控、检测漂移和偏差并实施主动学习，以确保模型符合需求：\n\
  \n![](img/Figure-1.11.jpg)\n\n**图 1.11:** AI/ML 工作流中的模型监控阶段\n\n你可以使用 `Amazon SageMaker\
  \ model monitor`(`https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html`)\
  \ 轻松地设置模型监控解决方案，使用 `mean`（平均值）、`median`（中位数）、`max`（最大值）、`min`（最小值）、`std_dev`（标准差）等统计数据在特征或列级别监控数据质量。你还可以通过将训练期间最初计算的评估指标与\
  \ SageMaker model monitor 根据你的 ML 问题类型在推理期间生成的指标进行比较，来监控模型质量。\n\nML 社区经常讨论的一个领域是模型偏差。如术语含义所示，偏差是指倾向于特定结果的偏好，尽管数据分布中并没有指向该结果的影响。Amazon\
  \ SageMaker 提供了一个名为 `Clarify`(`https://aws.amazon.com/sagemaker/clarify/`) 的功能，它可以帮助你自动监控模型的偏差，在发现任何偏差时发出告警，并允许采取行动进行纠正。你可以监控偏差漂移，它定义为真实值或基准分布与推理请求分布（或模型在训练期间未看到的真实世界数据）之间的差异。你还可以监控特征归因漂移，即基准分布与模型在推理期间看到的真实数据之间，特定特征（或列）与预测特征或列值之间相关性的变化。\n\
  \n这里提到的模型监控和偏差检测步骤都会提醒我们模型性能存在的问题，但它们不会自动纠正模型的行为。它们确实提供了自动化模型更新任务所需的选项。除了监控你的模型之外，至少在初始阶段还需要一个被称为“机器学习机回”（human\
  \ in the loop for ML）的专家团队来审查/审核你的模型预测，并在将结果发送到下游应用程序之前根据需要更新值。Amazon Augmented\
  \ AI 或 Amazon A2I(`https://aws.amazon.com/augmented-ai/`) 是一项允许向我们的 ML 过程中添加人工工作流的服务。你可以获取纠正后的预测值并将其添加训练数据集，以自动触发模型的重新训练。通常，你会设置一个基于模型监控告警和/或偏差检测和/或人工工作流触发的重新训练流水线。这被称为`主动学习`（active\
  \ learning）。\n\n我们对 ML 工作流的讨论到此结束。这是一个很长的章节，感谢你的耐心。不言而喻，彻底了解这一工作流将使你在职业生涯中构建自己的\
  \ ML 项目时取得巨大成功。在本节中，我们回顾了业务需求的重要性，以及确定我们的 ML 问题是通用问题还是自定义问题的重要性。对于通用需求，我们看到了不同类别的解决方案，并看到我们有不同的\
  \ AWS AI 服务来解决特定领域。我们还看到，在自定义需求的情况下，我们需要通过 ML 工作流，并回顾了执行数据准备、特征工程、模型训练、部署和模型监控的步骤。我们还学习了\
  \ ML 开发的关键 AWS 服务的名称。在下一节中，我们将深入探讨 AWS AI/ML 技术栈。\n\n## 在 AWS 上引入 AI 和 ML\n\n欢迎回来，亲爱的读者们！！希望你到目前为止读得愉快。在这一节中，我们将介绍你的工具箱，它将帮助你成为卓越的\
  \ ML 工程师和数据科学家。没错，我们将学习 AWS 的 AI/ML 能力和产品。我们知道在之前的章节中我们不断提到这些服务，你可能在好奇这些服务名称和 ML\
  \ 术语是什么意思。不要担心，帮助就在这里。在本节中，我们将澄清（这里是个双关语）这些服务和功能是做什么的，以及如何使用它们。\n\nAWS 在 AI/ML 领域拥有广泛且深层次的服务和功能产品，为了方便我们理解和选择所需内容，这些能力被分为三个堆叠的层，最底层提供最大的灵活性但抽象程度最低。这一层能力适用于精通于钻研\
  \ ML 框架、喜欢构建自己的算法并希望自行管理训练和部署基础设施的 ML 专家。在计算选项方面，AWS 为当今云中提供了 ML 训练的一些最强大的计算实例。下图显示了每个包含六个以上\
  \ GPU 的计算实例选项：\n\n![](img/Figure-1.12.jpg)\n\n**图 1.12:** AWS 中 GPU 实例示例列表\n\n当我们查看深度学习容器的选项时，AWS\
  \ 提供了一份涵盖所有主流 ML 框架的预构建容器镜像列表，满足各种训练需求。这些被称为深度学习容器（Deep Learning Containers）。可用容器的完整列表可在\
  \ GitHub 仓库提供：`https://github.com/aws/deep-learning-containers/blob/master/available_images.md`。\n\
  \n如果容器不是你的选择，你更倾向于将机器映像部署到你的计算实例上以设置训练，AWS 提供了此类选项，可以选择 `Deep Learning AMIs`（Amazon\
  \ 机器映像）。下图提供了这些镜像的示例列表。AWS Marketplace（一个包含你可以购买并部署到你的 AWS 账户的工具和 AMI 的目录）和社区提供了不断增加的选项供选择：\n\
  \n![](img/Figure-1.13.jpg)\n\n**图 1.13:** 深度学习 AMIs\n\n除了计算之外，AWS 还提供了定制的芯片组来优化你的\
  \ ML 训练(`https://aws.amazon.com/machine-learning/trainium/`)和推理(`https://aws.amazon.com/machine-learning/inferentia/`)。因此，ML\
  \ 专家有多种选择在 AWS AI/ML 技术栈的最底层构建自定义的训练和推理工作流。\n\n\n\n\n\n栈结构的中间层适用于那些愿意在灵活性上稍作妥协的\
  \ ML 从业者，以利用强大的抽象优势，帮助他们的 ML 之旅快速、轻松地投入生产。Amazon SageMaker 是涵盖中间层的主要服务，其专门定制的功能解决了我们在上一节中讨论的\
  \ ML 工作流中的每一个步骤。Amazon SageMaker 是一个针对各种 ML 需求的全托管、安全、可扩展且可靠的服务。\n\n为了方便你理解这些内容，下表记录了我们\
  \ ML 工作流中每个步骤对应的 SageMaker 关键功能。这只是 Amazon SageMaker 功能的子集。在本书后续章节中，我们将学习额外的 SageMaker\
  \ 功能，例如使用 `SageMaker Studio`（第一个用于 ML 开发的 IDE）、用于 AutoML 的 `SageMaker Autopilot`\
  \ 等。欲查看 SageMaker 列表的完整列表，请参考 `https://aws.amazon.com/sagemaker/faqs`：\n\n| ML 工作流任务\
