  — David Bounds\n\n# 关于作者\n\n**Premkumar Rangarajan** 是亚马逊云服务（Amazon Web Services）的首席\
  \ AI/ML 专家解决方案架构师，此前编写过《使用 AWS AI 服务进行自然语言处理》一书。他在 IT 行业拥有 26 年的经验，担任过交付主管、集成专家和企业架构师等多种角色。他帮助各种规模的企业采用\
  \ AI 和 ML，并在业余时间兼任客座教师，帮助学生规划职业生涯。\n\n**David Bounds** 是驻驻佐治亚州亚特兰大的亚马逊云服务资深解决方案架构师。他在\
  \ IT 领域拥有超过 25 年的经验，涵盖从前线支持到站点可靠性工程（SRE），他专注于工作负载的运营化。他对于为各种经验水平和背景的工程师带来 AI/ML\
  \ 工具和能力有着无限的热情。当不在迭代俳句生成模型时，他会跑步、玩他的 3D 打印机，或者和他的比特犬 Darby 一起看电影。他更偏好动作片。\n\n# 关于评审员\n\
  \n**Radhakrishnan (Krishna) Gopal** 是一位云布道者、资深技术专家和导师，拥有超过 23 年的行业经验。他通过增加价值和帮助实现按时开发实践，帮助组织转型工作方式。\n\
  \nKrishna 熟悉所有主要的云超大规模平台，包括 `AWS`、`Azure` 和 `Google cloud`。他拥有美国专利和商标局的两项专利，并在云、数据和分析领域拥有许多证书和认证。他曾担任\
  \ Packt 出版社《Google Cloud 上应用程序现代化的权威指南》一书的技术评审。Krishna 热衷于构建大规模的云端数据密集型应用程序，通过云采用和创新来交付业务价值。\n\
  \n**Vamshi Krishna Enabothala** 是 `AWS` 的高级应用 AI 专家架构师。他与不同行业的客户合作，加速高影响力的数据、分析和机器学习计划。他热衷于推荐系统、`NLP`\
  \ 和计算机视觉领域。在工作之外，Vamshi 是飞机、汽车和无人机的爱好者，同时也喜欢园艺。\n\n# 致谢\n\n感谢在本书编写期间提供支持的几位人士。首先，我们要感谢我们的家人持续的激励和支持。\n\
  \n感谢 `Amazon Web Services` 优秀的客户和合作伙伴，他们的反馈帮助设计了部分解决方案。感谢 `Gopal Krishna` 和 `Vamshi\
  \ Krishna Enabothala` 在技术上验证了我们在书中讨论的想法。\n\n我们感谢 `BPB Publications` 团队持续的支持、鼓励和耐心回答我们的问题。\n\
  \n# 前言\n\n将 `ML` 和 `AI` 融入现有业务流程是成功的。数据专业人员和云工程师正关注解决方案。\n\n本书将向读者介绍数据人员、数据科学家和云工程师如何无缝驱动\
  \ `AWS` 上的整个 `ML`，充分利用各种 AI 服务。在书中，我们将创建数据湖、准备并训练 ML 模型、自动化 MLOps、准备最大的数据重用和可重复性以及其他任务。\n\
  \n书中涵盖了有效使用 AWS AI 服务用例。读者将学习利用大规模计算、管理大型数据湖、训练 ML 模型、将其部署到生产环境并监控 ML 应用的性能。书中还涵盖了如何跨各种应用程序使用预训练模型，如图像识别、自动数据提取。在整个书中，我们使用了\
  \ `SageMaker`、AI 服务以及 `Pytorch` 或 `TF` 等 AWS 能力。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
