  \n1. 执行本节中的第一个单元格来声明我们将使用的 Amazon S3 桶和前缀（prefix）。提供你之前创建的 Amazon S3 桶名称：\n```python\n\
  bucket = <your-S3-bucket-name>\nprefix = 'aiml-book/chapter10'\n```\n\n2. 为了运行此代码示例，我们为你提供了一个叫中心坐席与客户之间的对话音频文件。执行下一个单元格将此示例音频文件上传到你的\
  \ S3 桶中：\n```python\n# 首先列出我们的音频文件，然后将它们上传到 S3 桶\n# 我们将使用随仓库提供的示例音频文件\naudio_dir\
  \ = 'input/audio-recordings'\nfor sdir, drs, fls in os.walk(audio_dir):\n    for\
  \ file in fls:\n        s3.upload_file(os.path.join(sdir, file), bucket, prefix+'/transcribe/'+\
  \ os.path.join(sdir, file))\n        uri = \"s3://\" + bucket + '/'+prefix+'/transcribe/'\
  \ + os.path.join(sdir, file)\n        print(\"Uploaded to: \" + uri)\n```\n\n3.\
  \ 现在，我们将使用 Transcribe API 启动转录任务。在这个示例中，我们使用的是异步 API，但 Transcribe 还提供了许多用于运行流式转录、调用分析等\
  \ API。有关适用于 Python 的 Transcribe API 完整列表，你可以参考 `https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/transcribe.html`：\n\
  ```python\n# 获取当前时间\nnow = datetime.now()\ntime_now = now.strftime(\"%H.%M.%S\"\
  )\njob = 'transcribe-test-'+time_now\n# 启动转录任务\ntry:\n    transcribe.start_transcription_\
  \ major(\n        TranscriptionJobName=job,\n        LanguageCode='en-US',\n   \
  \     Media={\"MediaFileUri\": uri},\n        Settings={'MaxSpeakerLabels': 2, 'ShowSpeakerLabels':\
  \ True}\n    )\n    time.sleep(2) print(transcribe.get_transcription_job(TranscriptionJobName=job)['TranscriptionJob']['TranscriptionJobStatus'])\n\
  except Exception as e:\n    print(e)\n```\n\n4. 任务状态显示为 `IN_PROGRESS`。访问 `https://us-east-1.console.aws.amazon.com/transcribe/home?region=us-east-1#jobs`\
  \ 导航到 Transcribe 控制台。\n\n5. 任务将在 10 到 15 分钟内完成。完成后，执行下一个单元格来创建输出目录：\n```python\n\
  # 创建输出目录\ndr = os.getcwd()+'/output-transcripts'\nif not os.path.exists(dr):\n \
  \   os.makedirs(dr)\n```\n\n6. 我们现在将解析 JSON 输出以提取文本、进行拆分并写入输出文件。执行以下操作：\n```python\n\
  # 现在我们将下载转录文件\nimport urllib.request\nresponse = transcribe.get_transcription_job(TranscriptionJobName=job)\n\
  out_url = response['TranscriptionJob']['TranscriptFileUri']\ninfile = job+'-output.json'\n\
  urllib.request.urlretrieve(out_url, infile)\n# 存储转录\noutfile = 'output-transcripts+'.txt'\n\
  with open(infile, 'rb') as t_in:\n    full = json.load(t_in)\n    entire_transcript\
