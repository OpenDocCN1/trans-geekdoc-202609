  5. **b,d and e**\n\n# 第 11 章\n\n# 工业自动化的 AI\n\n### 引言\n\n继续我们对*第 10 章通过感知认知添加智能*中机器人的讨论，还记得电影《机械机器人》中的工厂场景吗？在那里新制造的机器人正在等待激活。科幻小说和电影可能会让我们想象一个完全自动化的工厂，充斥着执行各种与人类非常相似活动的人形机器人。事实上，今天大多数（并非所有）工厂车间已经是半自动化或全自动化；它们由\
  \ AI 和机器人技术驱动。然而，常识告诉我们，AI 并不一定要以人形（如安卓机器人）的形式部署才能作用。事实上，凭借无处不在的互联网和 AWS 民主化的 AI/ML，云提供的高级\
  \ AI 能力可以轻松从工厂车间扩展到各种预测性维护和分析任务。这里的关键词是“预测性”。为什么这很重要？早些时候，当关键设备需要维修时，整个装配线都必须停止，导致生产停滞和巨大的收入损失。此外，由于必须首先排除故障并确定问题所在，维修或修复缺陷的成本会被进一步放大。\n\
  \n想象一下，如果你能够持续监控机器，并精确预测特定部件或组件何时会发生故障。那么，你就可以设置一个自动通知，在部件损坏之前安排对其进行检查/更换。预先知道意味着你控制了何时更换部件。这意味着你可以在运行停机期间进行维护，而不是为了更换部件而被迫停止生产。\n\
  \n### 结构\n\n在本章中，我们将深入探讨以下主题：\n\n*   工业自动化 AI 概览\n*   使用 Amazon Lookout for Equipment\
  \ 进行预测性分析\n*   使用 Amazon Lookout for Vision 进行质量控制\n\n### 目标\n\n在本章中，我们首先讨论工业用例以及为什么这些用例很重要，然后查看\
  \ AI 如何提供帮助。我们将学习一种名为 `Amazon Lookout for Equipment` 的 AWS AI 服务，用于检测工业设备中的异常。随后，我们将转向学习另一种\
  \ AWS AI 服务——`Amazon Lookout for Vision`，用于检测生产线的产品故障。最后，我们将通过一个使用这两个服务构建的解决方案来学习预测性分析。\n\
  \n## 工业自动化 AI 概览\n\n在上一章中，我们回顾了用于文本转语音、语音转文本、从文本中提取见解以及检测和识别图像内容等场景的核心 AI 服务。我们看到这些\
  \ AI 服务是预训练的 ML 模型，抽象为可扩展且可靠的 API，具有**自动语音识别**（**ASR**）、**自然语言理解**（**NLU**）、**自然语言处理**（**NLP**）、计算机视觉（**CV**）等高性能能力。我们看到只需要几行代码即可调用\
  \ API；我们发送输入并接收预测结果。本章将重点关注有助于工业用例自动化的 AI 服务，特别是来自传感器读取的异常检测，以及通过产品图像检测故障进行质量检查。\n\
  \n\n\n\n\n1913 年，亨利·福特在福特海兰公园组装厂著名的部署了第一条汽车制造移动装配线（[https://corporate.ford.com/articles/history/moving-assembly-line.html]）。装配线的设计旨在让产品和活动流向工人，而不是反过来，它改变了大规模生产模式，并显著提高了制造效率。它还降低了运营成本，使最终产品对消费者来说更加便宜，从而提升了收入和利润。100\
  \ 后的今天，装配线仍然是制造汽车最高效的方式。虽然我们还没有发明比装配线更简单的东西，但在使用它们方面已经取得了巨大的技术进步。如果我们把过去一个世纪左右关于如何降低成本和提高制造效率的经验总结起来，可以归两个关键词：“自动化”和“持续改进”。\n\
  \n## 自动化\n自动化减少了对人工干预的依赖，降低了成本并节省了时间。自动化还提供了衡量、监控、校准和改进制造任务的能力。传统上，自动化生产要求任务是迭代且重复的，并且通常需要遵循流程规范。因此，对于确定性和重复性的任务，例如组装车身或将轮胎安装到底盘轴承上，使用了工业机器实现了自动化；但对于概率性任务，例如检查组装汽车的质量、运行控制器区域网络（CAN）的诊断测试或检查压缩机的容量，则由人工完成。\n\
  \n持续改进（或 `CI`）是指精调流程效率的能力，使生产不受范围和规模变化的影响，向峰值性能发展。`CI` 要求对任务进行主动监控，衡量性能下降，并能够影响可以提高生产能力、缩短时间并有效利用资源的因素。精益六西格玛流程框架为\
  \ `CI` 提供了一种方法论方法（[https://www.investopedia.com/terms/l/lean-six-sigma.asp]），旨在减少业务流程中的缺陷或浪费以提高其效率。精益生产是丰田开发的一种流程，用于识别和消除对流程不产生价值的任务/步骤。六西格玛管理是由摩托罗拉开发的，旨在为业务流程改进定义标准。然而，精益六西格玛的传统应用严重依赖人工参与，特别是在定义（Define）、分析（Analyze）和改进（Improve）阶段（[https://goleansixsigma.com/wp-content/uploads/2012/02/DMAIC-The-5-Phases-of-Lean-Six-Sigma-www.GoLeanSixSigma.com_.pdf]）。\n\
  \n## 制造流程\n多年来，制造流程发生了许多变化，但在提高效率、降低成本和实现更高自动化方面仍有空间。AI 技术的出现对此成为可能。那么 AI 如何帮助制造业和其他行业的自动化和持续改进呢？为了回答这个问题，让我们回到第\
  \ 1 章，介绍机器学习工作流中的 AWS AI 服务列表，回顾属于工业自动化类别的 AI 服务。请参考下表。\n\n| ML 问题类型 | ML 子类型 |\
  \ ML 用例 | AWS AI 服务 | 服务概述 |\n| :--- | :--- | :--- | :--- | :--- |\n| 企业/工业 | 业务工具\
  \ | 欺诈检测 | Fraud Detector | 全托管服务，用于检测和监控电子商务欺诈，提供简化的模型构建界面，无需 ML 专业知识 |\n| 推荐 |\
  \ 个性化 | | | 全托管服务，用于检测和监控电子商务欺诈，提供简化的模型构建界面，无需 ML 专业知识 |\n| 预测 | 预测 | | | 全托管服务，用于检测和监控电子商务欺诈，提供简化的模型构建界面，无需\
  \ ML 专业知识 |\n| 异常检测 | Lookout for Metrics | | | 全托管服务，用于检测和监控电子商务欺诈，提供简化的模型构建界面，无需\
  \ ML 专业知识 |\n| 工业智能 | 预测性监控 | AWS Panorama | 硬件和 SDK，用于在车间和本地摄像头系统中添加基于 ML 的智能功能\
  \ |\n| | | Amazon Monitron | 用于工业设备监控和主动性维护的传感器和预训练 ML |\n| | | Amazon Lookout for\
  \ Vision | 使用计算机视觉进行工业异常检测的自定义 ML 预训练 |\n| 预测分析 | Amazon Lookout for Equipment |\
  \ ML 服务，提供直观的能力，用于开发检测设备异常的自定义模型，无需 ML 专业知识 |\n\n**表 11.1：** 用于工业自动化的 AWS AI 服务\n\
  \n# 质量缺陷成本或 COPQ\n**质量缺陷成本 (COPQ)**（[https://sixsigmastudyguide.com/cost-of-poor-quality/]）是一项关键指标，通过量化与退步性工作、返工以及对运营成本的影响相关的成本，来衡量制造流程的性能效率。组织不断通过防止返工来降低\
  \ COPQ。实现这一目标有几种方法：\n\n* 提高产品质量\n* 防止制造故障\n\n## 提高产品质量\n当产品以高标准制造，或者建立了能够早期、准确识别质量问题的流程时，返工工作就会自动减少。修复缺陷的成本随着识别缺陷时间的增加（如果在制造周期后期才识别出来）而呈指数级增长。在初始构建阶段的缺陷比产品制造后的缺陷更容易修复。此外，对错误进行正确的识别和分类同样至重要。如果错误被错误标记，不仅可能影响当前流程，而且修复原始错误可能会引入新的、更棘手的问题。检测检测的系统准确性决定了整体质量，因为标记误报（误认为有错误）是可以接受的，但漏报（即使有问题模型也假设没有问题）是不可接受的。\n\
  \n`Amazon Lookout for Vision (https://aws.amazon.com/lookout-for-vision/)` 是一个有助于解决此问题的服务。它是一个全托管的计算机视觉服务，专为自动化质量检查而设计，既可以在云端工作，也可以直接在工厂车间或制造设施的边缘工作。它使用专有的计算机视觉建模技术，即使数据集少于\
  \ 50 张图像，也能构建强大的异常检测模型。训练数据集应包含产品非异常（即正常）状态下的图像。在测试期间，我们将异常图像发送给模型并查看预测结果。请查看下图，展示了使用\
  \ Lookout for Vision 的流程。\n\n![](img/Figure-11.1.jpg)\n\n**图 11.1：** Lookout for\
  \ Vision 建模过程\n\n在本章的后续章节中，我们将演示一个如何使用 Amazon Lookout for Vision 自动化质量检查的示例，我们将模拟电子印刷电路板制造设施的质量控制。\n\
  \n\n\n\n\n组装线中的系统故障是指影响生产线的故障。它们在制造设施中是一个大问题。根据文章：[`www.automation.com/en-us/articles/june-2021/world-largest-manufacturers-lose-almost-1-trillion`](https://www.automation.com/en-us/articles/june-2021/world-largest-manufacturers-lose-almost-1-trillion)（2022\
  \ 年 10 月访问），包括一些顶级品牌在内的制造和工业世界 500 强公司，因机器故障导致的非计划停机每年损失高达惊人的 8640 亿美元。因此，预测性分析——即提前监控和缓解设备故障或为计划内维护提供支持的艺术与科学——对于降低制成本和提高业务能力至关重要。在\
  \ ML 和 AI 出现之前，可以说我们并没有实质上的预测性分析。相反，我们采用的是反应性方法，持续监控机器性能并在出现问题时提醒我们。虽然高级的警报很有帮助，但它并不能提供一种受控环境来主动解决问题。通过\
  \ ML，你可以训练模型来预测机械设备趋于故障的阈值，并相应优先对这些机器进行维护。\n\nAmazon Lookout for Equipment (https://aws.amazon.com/lookout-for-equipment/)是一项托管服务，允许你从设备和机器传感器摄取时间序列数据，分析数据，为每个传感器或整台机器训练模型，并实时或按计划间隔预测传感器数据中的异常。使用\
  \ Lookout for Equipment 的益处是你完全不需要任何 ML 技能。你可以直接使用 Amazon Lookout for Equipment\
  \ 控制台完成整个 ML 生命周期，其中所有的基础设施配置、特征工程、数据转换、算法选择、模型调优和部署都完全对用户抽象，使得实施预测性分析变得简单。请参考 图\
  \ 11.2：\n\n![](img/Figure-11.2.jpg)\n\n**图 11.2:** Lookout for Equipment 建模过程\n\n\
  在本章的后续章节中，我们将直接使用 AWS 控制台演示 Amazon Lookout for Equipment，并介绍端到端的建模过程。我们将使用从压缩泵收集的\
  \ 4 个月、间隔为 1 分钟的时间序列传感器数据。我们将创建一个项目、添加数据集、训练模型并安排推理，而整个过程无需任何 ML  专业知识或配置任何基础设施。\n\
  \n# 使用 Amazon Lookout for Vision 进行质量控制 (#toc.xhtml#s249a)\n\n在本节中，我们将获得实践经验；使用\
  \ Amazon Lookout for Vision 构建一个质量控制检查模型。我们将使用本文介绍的视觉异常 (`VisA`）数据集——[`arxiv.org/abs/2207.14315`](https://arxiv.org/abs/2207.14315)，特别是印刷电路板（PCB）图像的\
  \ PCB1 类别，用于制造 PCB 的故障检测。训练完成后，模型将能够查看异常 PCB 的图像并正确识别问题，它还能将非故障图像分类为正常。对于这项活动，我们将使用\
  \ AWS 管理控制台，查看如何在没有 ML 专业知识的情况下大规模地构建和部署强大的计算机视觉模型。\n\n在开始之前，我们需要确保准备工作就绪。如果你还没有注册\
  \ AWS 账户，现在是注册的时候了。按照 第 2 章，填充你的数据湖 中“设置你的 AWS 账户”章节中的说明注册 AWS 账户。注册完成后，请使用 https://docs.aws.amazon.com/IAM/latest/UserGuide/console.html\
  \ 中的指令登录你的 AWS 账户。如果你还没有创建，请创建一个 Amazon S3 桶（https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html）。执行以下指令来构建、训练和部署你的\
  \ PCB 异常检测质量控制模型：\n\n1. 登录 AWS 管理控制台后，在服务搜索栏中输入 `vision` 并选择 `Amazon Lookout for\
  \ Vision` 进入其控制台。\n\n2. 点击 `Get started` 按钮；系统会提示创建一个 Amazon S3 桶。然后，点击 `Create\
  \ S3 bucket` 按钮。在仪表板的 `Projects` 格中，点击 `Create project` 按钮开始我们的模型构建过程。参考 图 11.3：\n\
  \n    ![](img/Figure-11.3.jpg)\n\n    **图 11.3:** 创建 Lookout for Vision 项目\n\n3.\
  \ 在 `Project details` 章节中，为项目名称（Project name）输入 `c11-pcb-quality-control` 并点击 `Create\
  \ project`。\n\n4. 在项目的 `How it works` 章节中，点击 `Create dataset` 按钮。参考 图 11.4：\n\n\
  \    ![](img/Figure-11.4.jpg)\n\n    **图 11.4:** 创建数据集\n\n5. 在 `Create dataset`\
  \ 页面上，保持默认选择 `Create a single dataset`。向下滚动到 `Image source configuration` 章节并选择\
  \ `Import images from S3 bucket`。参考 图 11.5：\n\n    ![](img/Figure-11.5.jpg)\n\n\
  \    **图 11.5:** 从 S3 桶选择图像\n\n6. 现在，在浏览器中打开一个新标签页，从书开头提供的书籍 GitHub 仓库下载数据集。你正在寻找的文件夹和文件名是\
  \ `Chapter-11/chapter11-pcb-images.zip`。\n\n7. 将文件从 ZIP 文件解压到你的本地计算机。你应该能看到以下文件夹：\n\
  \n    - Images/Normal\n    - Images/Anomaly\n\n8. 使用 https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html\
  \ 中的指令创建一个 Amazon S3 桶（如果尚未创建），并使用 `Add folder` 将 `Images` 文件夹上传到 S3 桶。\n\n9. 提供存储图像的\
  \ S3 URI，直达 `Images` 文件夹。选择 `Automatic labeling` 复选框并点击 `Create dataset` 按钮。参考 图\
  \ 11.6：\n\n    ![](img/Figure-11.6.jpg)\n\n    **图 11.6:** 提供 S3 URI 并选择自动标记\n\n\
  10. 这将你带到标记页面，你可以在那里查看数据集、根据需要进行标记并启动模型训练。参考 图 11.7：\n\n    ![](img/Figure-11.7.jpg)\n\
  \n    **图 11.7:** 检查数据集\n\n11. 现在点击屏幕右上角的 `Train model` 按钮开始模型训练。参考 图 11.8：\n\n\
  \    ![](img/Figure-11.8.jpg)\n\n    **图 11.8:** 点击训练模型\n\n12. 在 `Train model` 页面上，保持默认设置并点击页面底部的\
  \ `Train model` 按钮。接受确认弹出窗口以开始训练。\n\n13. 模型现在开始训练，你将被引导到 `Models` 页面。参考 图 11.9：\n\
  \n    ![](img/Figure-11.9.jpg)\n\n    **图 11.9:** 模型训练进度\n\n14. 训练将需要大约 30 分钟。现在是喝咖啡或茶的时间了！\n\
  \n15. 训练完成后，`Models` 页面将更新并显示模型指标，例如精确率（Precision，计算公式为 `True Positive/(True Positive\
  \ + False Positive)`）和召回率（Recall，计算公式为 `True Positive/(True Positive + False Negative)`）。点击\
