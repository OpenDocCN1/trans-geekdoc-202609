  \ AWS 解决方案架构师在上次办公时间（office hours）中提到的事情。登录他们的 Amazon SageMaker Studio 实例，点击左侧启动器上的\
  \ JumpStart 图标，然后点击 `Browse JumpStart` 按钮。下图显示了 SageMaker Studio Jumpstart 的界面：\n\
