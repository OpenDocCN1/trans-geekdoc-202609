  \ prediction）。我们也可以进行批量预测（Batch prediction），这需要我们在 Canvas 中选择一个导入的测试数据集，该数据集包含模型用于预测价格的输入特征。参考\
  \ `图 7.15`：\n\n![](img/Figure-7.15.jpg)\n\n**图 7.15：** 在 Canvas 中运行实时预测\n\n至此，我们结束关于\
  \ SageMaker Canvas 如何轻松地为您的用例构建 ML 模型并运行预测的章节。正如我们之前讨论的，Canvas 是无代码机器学习（no code\
  \ ML），并完全由 AutoML 驱动。你看到通过 Canvas，我们直接与 UI 交互来开始，这是一种完全抽象的体验，适用于许多人，如业务分析师、高管、业务智能团队等。需要注意的是，你无法获得对\
  \ Canvas 输出或模型的 API 访问权限，因此你无法从你的应用程序中在 Canvas 模型上运行预测。如果你想使用具有程序化访问模型能力的 SageMaker\
  \ AutoML，可以使用 SageMaker Autopilot，它不仅能自动完成端到端的 ML 工作流，还提供访问其用于数据处理和模型训练的 Jupyter\
  \ notebook 的权限，这样你就可以理解 Autopilot 执行的步骤。Autopilot 选出的胜出模型可以部署到 SageMaker 推理实例，你可以从应用程序中访问它。这里有一个示例笔记本，可以带你了解\
  \ Autopilot：`https://sagemaker-examples.readthedocs.io/en/latest/autopilot/sagemaker_autopilot_direct_marketing.html`。\n\
  \n# 自动超参数调优\n\n既然谈到了 AutoML，让我们不要忽略一种用于识别模型训练最优超参数的自动技术：`hyperparameter optimization`（HPO）或自动模型调优。虽然它不严格属于\
  \ AutoML（AutoML 包含了 ML 工作流的所有方面，包括数据处理和特征工程），但 HPO 起着至关重要的作用，并极大简化了手动模型训练工作。HPO\
  \ 为特定问题类型（例如分类或回归）和算法族（例如 XGBoost）训练多个候选模型，通过应用一组超参数值来确定最优值。HPO 使用 `Bayesian Search`（贝叶斯搜索）或\
  \ `Random Search`（随机搜索）。对于如何在 SageMaker 中运行自动模型调优的示例，请参考 `https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-tuning.html`。\n\
  \n在下一节中，我们将学习使用 AutoGluon 训练和评估模型。通过 AutoGluon 的帮助，我们在 notebook 中执行代码，虽然我们没有像 Canvas\
  \ 那样的灵活性，但它是许多人都可以使用的。我们还可以将这些模型部署到 SageMaker 推理端点。\n\n### 使用 AutoGluon 进行 AutoML\n\
  \n在介绍完之前，现在我们将带你了解 AutoGluon，它是由 AWS 发布的一种 AutoML 技术。与 Autopilot 相比，AutoGluon 提供多种模态（图像、文本、表格），并可以访问\
  \ HuggingFace (`https://github.com/huggingface/transformers`) 和 OpenAI (`https://github.com/openai`)\
  \ 模型库。最近，AutoGluon Tabular 已作为内置算法添加到 SageMaker（`https://docs.aws.amazon.com/sagemaker/latest/dg/autogluon-tabular.html`），使得模型训练更加简单。现在，让我们开始使用我们的数据集尝试文本和表格\
  \ AutoGluon。为了简单起见，我们将使用与 SageMaker 相同的数据集。\n\n为了执行此示例，我们将使用 SageMaker Studio notebook，因此，如果尚未完成，你需要加入\
  \ SageMaker Studio 域并 git clone（如果你在前面的章节尚未这样做）我们的 GitHub 仓库。请按照第 2 章“设置你的 AWS 账户”中的指令注册\
  \ AWS 账户。注册后，使用此处指令登录你的 AWS 账户：`https://docs.aws.amazon.com/IAM/latest/UserGuide/console.html`。如果你在之前的章节中尚未创建，你需要创建一个\
  \ Amazon S3 桶（`https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html`），然后记下桶的名称。接下来，按照第\
  \ 3 章“通过特征预测未来”中的技术要求指令加入 SageMaker Studio 域，克隆仓库，并点击 `Chapter-07`打开 `autogluon-text-tabular.ipynb`\
  \ Jupyter notebook。执行以下指令继续你的构建活动：\n\n\n\n\n\n## 2. 首先，我们必须安装 `autogluon` 包。将光标置在笔记本的第一个单元格中，点击标签页顶部的三角形播放按钮以执行该单元格。这将安装依赖库，然后是\
  \ AutoGluon 包。这些命令需要 5 到 10 分钟完成：\n\n```bash\n!pip install -U setuptools wheel\n\
  !pip install \"torch>=1.0,<1.12+cpu\" -f https://download.pytorch.org/whl/cpu/torch_stable.html\n\
  !pip3 install autogluon\n```\n\n## 3. 在继续之前，重启笔记本内核。从顶部菜单中选择`Kernel（内核）→`Restart\
  \ Kernel（重启内核）和`Clear All Outputs（清除所有输出）。参考`图 7.17`：\n\n![](img/Figure-7.17.jpg)\n\
  \n**图 7.17:** 重启内核\n\n## 4. 然后，执行笔记本中的第二个单元格以导入运行 AutoGluon AutoML 训练所需的所有 Python\
  \ 库。\n\n## 5. 对于本次训练，我们将使用与 SageMaker Canvas 相同的示例原始数据集。该文件位于我们本的 GitHub 仓库中（`[https://github.com/garchangel/AIMLwithAWS/tree/main/Chapter-07/wine_canvas_ds.csv]`），并在你克隆仓库时已复制。执行下一个单元格将此数据集加载到\
  \ Pandas DataFrame 中。\n\n```python\n# 我们先将数据加载到 pandas dataframe 中，方便我们处理\nwine_canvas_raw_df\
  \ = pd.read_csv('./wine_canvas_ds.csv', sep=',',header=0)\nwine_canvas_raw_df.head()\n\
  ```\n\n你应该能看到如下的输出，如`图 7.18`所示：\n\n![](img/Figure-7.18.jpg)\n\n**图 7.18:** 葡萄酒原始数据集\n\
  \n## 6. 执行下一个单元格将此数据集拆分为训练集（1989 行）和测试集（10 行）。\n\n```python\n# 我们留出 10 行来测试模型，其余部分作为我们的训练数据集\n\
  wine_train_df = wine_canvas_raw_df.iloc[:1989]\nwine_test_df = wine_canvas_raw_df.iloc[1990:]\n\
  ```\n\n## 7. 你可以通过执行笔记本中的下一个单元格来查看测试集的内容。索引应该从行 1990 开始。\n\n## 8. 在下一个单元格中，我们将提交\
  \ AutoML 训练作业。从我们的原始数据集中，我们想要训练一个根据相关输入特征预测葡萄酒价格的 ML 模型。然而，请注意，我们的表格数据集包含文本和数字混合。因此，我们拥有分类和定量特征。AutoGluon\
  \ tabular（`[https://auto.gluon.ai/stable/tutorials/tabular_prediction/index.html]`）专为此类数据集设计，我们将使用\
  \ `TabularPredictor` 来满足我们的训练需求。\n\n```python\n# 数据处理、特征工程、设置和运行训练只需要 3 行代码\nfrom\
  \ autogluon.tabular import TabularPredictor\npredictor = TabularPredictor(label='price',\
  \ path='winning_wine_predictor')\npredictor.fit(wine_train_df)\n```\n\n## 9. 使用\
  \ AutoGluon 运行 ML 训练就像前面的三行代码一样简单。你只需要提供一个训练数据集，指定数据集中的哪一列是标签（label），并可选地提供一个用于存储获胜模型文件的文件夹。AutoGluon\
  \ 通过运行回归算法和神经网络的集成来执行数据处理、特征工程、算法选择、超参数优化以及模型训练和调优。然后它根据最低误差指标（在我们的示例中为均方根误差）选择一个获胜的候选模型。现在让我们检查训练作业的结果。在输出的第一部分，我们看到了数据指标和问题类型选择，此处高亮显示：\n\
  \n```text\nBeginning AutoGluon training …\nAutoGluon will save models to \"winning_wine_predictor/\"\
  \nAutoGluon Version:  0.5.0\nPython Version:     3.7.10\nOperating System:   Linux\n\
  Train Data Rows:     1989\nTrain Data Columns: 8\nLabel Column: price\nPreprocessing\
  \ data …\nWarning: Ignoring 100 (out of 1989) training examples for which the label\
  \ value in column 'price' is missing\nAutoGluon infers your prediction problem is:\
  \ 'regression' (because dtype of label-column == float and many unique label-values\
  \ observed).\n```\n\n## 10. 在输出的后续部分（此处仅显示快照；完整结果请参考执行单元格下方的笔记本输出），我们看到了 AutoGluon\
  \ 执行的特征工程结果：\n\n```text\nInferring data type of each feature based on column values.\
  \ Set feature_metadata_in to manually specify special dtypes of the features.\n\
  \ Stage 1 Generators:\nFitting AsTypeFeatureGenerator…\n Stage 2 Generators:\nFitting\
  \ FillNaFeatureGenerator…\n Stage 3 Generators:\nFitting IdentityFeatureGenerator…\n\
  Fitting CategoryFeatureGenerator…\nFitting CategoryMemoryMinimizeFeatureGenerator…\n\
  \ Stage 4 Generators:\nFitting DropUniqueFeatureGenerator…\n Data preprocessing\
  \ and feature engineering runtime = 0.36s …\n```\n\n## 11. 随后 AutoGluon 输出它为此作业选择的性能指标（回归最常用的指标是\
  \ RMSE，即均方根误差）：\n\n```text\nAutoGluon will gauge predictive performance using evaluation\
  \ metric: 'root_mean_squared_error'\nThis metric's sign has been flipped to adhere\
  \ to being higher_is_better. The metric score can be multiplied by -1 to get the\
  \ metric value.\nTo change this, specify the eval_metric parameter of Predictor()\n\
  ```\n\n## 12. 接下来，AutoGluon 选择了一个算法列表并使用最优选择的超参数运行集成。我们在此仅显示了快照：\n\n```text\nFitting\
  \ model: LightGBM\n-22.55 = (root_mean_squared_error)\n0.37s = Training\n0.01s =\
  \ runtime\nFitting model: CatBoost\n-20.7315 = (root_mean_squared_error)\n2.73s\
  \ = Training\n0.01s = runtime\nFitting model: WeightedEnsemble_L2\n-19.8987 = (root_mean_squared_error)\n\
  0.45s = Training\n0.0s = runtime\n```\n\n## 13. 最后，AutoGluon 输出了获胜模型 `WeightedEnsemble_L2`，因为它的\
  \ RMSE 为 19.89：\n\n```text\nAutoGluon training complete, total runtime = 23.96s\
  \ … Best model: \"WeightedEnsemble_L2\nTabularPredictor saved. To load, use: predictor\
  \ = TabularPredictor.load(\"winning_wine_predictor/\")\n```\n\n## 14. 与 AutoGluon\
  \ 的 19.89 RMSE 相比，快速构建的 Canvas 模型 RMSE 为 23.75。如果我们以标准构建运行 Canvas，将获得更低的 RMSE 和更好的模型。现在我们将使用保留的测试数据集使用新训练的模型进行预测。执行下一个单元格通过从原始数据集中删除价格列来创建测试数据：\n\
  \n```python\n# 我们从测试数据集中删除价格列，以便让模型进行预测\nwine_test_priceless = wine_test_df.drop(['price'],\
  \ axis=1)\nwine_test_priceless.head()\n```\n\n## 15. 执行下一个单元格使用我们的模型进行预测并显示结果。\n\
  \n```python\nwinning_predictions = predictor.predict(wine_test_priceless)\nprint(\"\
  Winning Model Predictions for test data: \"+str(winning_predictions))\n```\n\n我们得到了如下输出，显示了我们测试数据集中每个索引的葡萄酒价格：\n\
