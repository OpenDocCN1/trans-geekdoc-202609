  \ 仓库 (`https://github.com/garchangel/AIMLwithAWS`)）。我们对 `第 10 章，通过感官认知添加智能` 文件夹感兴趣，但在打开笔记本之前，我们需要为我们的\
  \ SageMaker Studio 角色设置 IAM 权限，以便在本章中使用我们的 AWS AI 服务。\n\n# 设置 IAM 权限\n\n我们的 SageMaker\
  \ Studio 笔记本带有用于操作 SageMaker 功能和访问 S3 存储桶的默认 IAM 权限。但它不包含我们在本章中将使用的 AI 服务的访问。我们必须为角色附加附加策略，以为其提供必要的权限。执行以下指令来增强你的\
  \ SageMaker 角色：\n\n1. 如果尚未执行，请登录 AWS 管理控制台，在顶部的服务搜索栏中输入 `SageMaker` 并导航到 SageMaker\
  \ 控制台。在左菜单的 `Control Panel` 下，点击 `Studio`。然后，点击右侧的 `Launch SageMaker Studio` 按钮。如果你已经接入了\
  \ SageMaker Studio，你将在 Users 部分看到你创建的用户名。如果你还没有接入 SageMaker Studio，可以按照 `第 3 章，通过特征预测未来`\
  \ 中“技术要求”部分的说明接入 Amazon SageMaker Studio 域并克隆本书的 GitHub 仓库 (`https://github.com/garchangel/AIMLwithAWS`)。\n\
