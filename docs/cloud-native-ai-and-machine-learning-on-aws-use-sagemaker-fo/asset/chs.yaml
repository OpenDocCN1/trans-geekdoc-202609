  \ card）可以完美工作。\n\n我们的 SRE 决定在此任务中使用 EleutherAI 的 `gpt-neo-1.3B` 模型，并为该模型创建一个 Hugging\
  \ Face 模型中心定义和模型对象：\n\n（注：原文文本中此处无代码块内容，故跳过）\n\n（后续翻译 Linear Regression 和 Computer\
  \ Vision 部分...）\n\n\n\n\n由于源图像将存储在 S3 桶中，SRE 决定将该存储桶视为源位置，并设置一个单独桶来存储处理后的图像，同时在源桶中设置一个单独的文件夹用于存放处理过程中出现错误的任何图像。基于这种设置，每次启动批量推理过程时，它都会列出源桶中的项并将它们作为推理的议程。\n\
  \n我们的 SRE 曾想过在 EC2 实例上通过 cron 表达式触发经典的 shell 脚本，但在决定之前经过片刻思考，他们决定进一步探索。EC2 的 cron\
  \ 方法可行，但它违背了成本优化的概念，且不符合云计算按需的特性。在快速检查 AWS 是否提供状态机风格工作流的能力后，他们发现了 AWS Step Functions。\n\
  \nAWS Step Functions 是一种无服务器编排服务。它允许你创建需要不同路径、分支和逻辑的工作流。它还原生支持与许多 AWS API 交互（在本例中为\
  \ `CreateEndpoint`），这正是我们需要的。我们需要在推理之前运行一些辅助作业，以列出准备好推理的图像并管理与创建的 SageMaker 端点的交互，以及将图像移动到已完成的桶，但这些都可以通过\
  \ AWS Lambda 轻松实现（AWS 提供的全托管无服务器计算服务 - `https://aws.amazon.com/lambda/` ）。\n\n*图\
  \ 8.1* 显示了为我们的使用创建的 AWS Step Function 流的视觉示例：\n\n![](img/Figure-8.1.jpg)\n\n**图\
  \ 8.1：** Amazon SageMaker Step Function 流\n\nAWS Step Functions 为创建工作流提供了易于使用的图形界面，但我们也可以将这些工作流表示为代码。这是一个由\
  \ AWS CloudWatch Event Bridge cron 表达式触发的状态机示例，用于扫描传入的 S3 桶、部署端点、发送每张图像进行推理，然后销毁端点。相关的\
  \ Lambda 函数可以在书中关联的 GitHub 仓库：\n\n```json\n{\n  “Comment”: “执行推理的状态机”,\n  “StartAt”:\
