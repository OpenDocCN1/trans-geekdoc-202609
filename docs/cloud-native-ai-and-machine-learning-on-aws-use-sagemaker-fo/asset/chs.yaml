  \n3.  **SageMaker Autopilot 自动执行哪些（通常手动执行的）机器学习建模任务？**\n    1.  特征工程\n    2.  算法选择\n\
  \    3.  模型训练和调优\n    4.  以上所有\n\n4.  **SageMaker Canvas 在内部使用了 Autopilot。**\n \
