  \ hot encoding）。\n\n## 独热编码 (One hot encoding)\n\n通过独热编码，我们避免了普通分类编码的常见问题。当我们进行分类编码时，会将文本值转换为数字。通常，这仅仅是一系列数字。例如，如果我们有颜色作为特征，值为\
  \ [red, blue, green, yellow]，分类编码将将其转换为 [1,2,3,4]。然而，机器会将此理解为 4 > 3 > 2 > 1 或 yellow\
  \ > green > blue > red，即使数据集中并没有意图设定这种权重。这将导致模型性能下降。通过独热编码，每个 `feature_value` 都会被转换为一个新的特征，并根据特征的原始观测值分配\
  \ 1 或 0。更多细节，请参考 [`scikit-learn.org/stable/modules/preprocessing.html#preprocessing-categorical-features`](https://scikit-learn.org/stable/modules/preprocessing.html#preprocessing-categorical-features)。\n\
  \n执行以下代码块对我们数据集中的 `country` 特征进行独热编码：\n\n```python\none_enc = ce.OneHotEncoder(wine_ready_df['country'])\n\
  result = one_enc.fit_transform(wine_ready_df['country'])\nwine_encod_df = pd.concat([wine_ready_df,result],axis=1)\n\
  wine_encod_df.drop(['country'], axis=1, inplace=True)\nwine_encod_df.head()\n```\n\
  \n我们看到以下显示的结果：\n\n![](img/Figure-3.20.jpg)\n\n**图 3.20:** country 特征的独热编码结果\n\n\
  ## 特征缩放 (Feature scaling)\n\n你可以先对数值特征进行缩放，然后对国家特征进行独热编码，最后将它们合并在一起。在我们的情况下，我们之前执行了独热编码，现在我们将对转换为数值数据集进行缩放，看看得到什么结果。我们编码并转换的特征具有不同的尺度/范围（检查\
  \ `designation_freq` 和 `price` 的值范围，或 `winery_freq` 和 `variety_transformed`）。这将混淆机器学习模型，因此让我们将它们缩放到\
  \ 0 到 1 之间的可比范围。我们将使用 SciKit Learn 包 ([`scikit-learn.org/stable/modules/generated/sklearn.preprocessing.MinMaxScaler.html`](https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.MinMaxScaler.html))，因为它们很容易操作。我们将使用\
  \ `MinMaxScaler()` 将所有的数值特征转换为 0 到 1 之间的值。运行以下代码：\n\n```python\n### 定义最大最小值缩放器将特征缩放到\
  \ 0 到 1 之间的值\nfrom sklearn.preprocessing import MinMaxScaler\nwine_features_scaler\
  \ = MinMaxScaler()\nwine_scaled_arr = wine_features_scaler.fit_transform(wine_encod_df)\n\
  ### 缩放后的结果是 numpy 数组，让我们看看第一行\n### 将缩放结果赋值回 dataframe，完成！你的特征工程数据集就准备绪了\nwine_scaled_df\
  \ = pd.DataFrame(data=wine_scaled_arr, columns=wine_encod_df.columns)\nwine_scaled_df.head()\n\
  ```\n\n我们得到了如下所示的结果：\n\n![](img/Figure-3.21.jpg)\n\n**图 3.21:** 特征已缩放\n\n让我们在下一节查看归一化（normalization）。\n\
  \n## 特征归一化 (Feature normalization)\n\n特征缩放和归一化通常适用于不同机器学习问题。缩放改变值的范围，而归一化将数据集转换为以均值为中心的正态分布，且不超过三个标准差。我们在回归问题中使用缩放，在分类问题中使用归一化。执行以下代码对我们的数据集进行归一化：\n\
  \n```python\n### 使用归一化\nfrom sklearn.preprocessing import Normalizer\nwine_features_normalizer\
  \ = Normalizer()\nwine_normalized_arr = wine_features_normalizer.fit_transform(wine_encod_df)\n\
  ### 将归一化结果赋值回 dataframe，完成！你的特征工程数据集就准备绪了\nwine_normalized_df = pd.DataFrame(data=wine_normalized_arr,\
  \ columns=wine_encod_df.columns)\nwine_normalized_df.head()\n```\n\n我们得到了如下所示的结果。我们不应该对独热编码的值进行归一化；我们应该对数值字段进行归一化，然后与独热编码的值合并。在这个示例中，为了简单起见，我们在整个数据集上运行了归一化代码：\n\
  \n![](img/Figure-3.22.jpg)\n\n**图 3.22:** 归一化的特征\n\n## 分箱 (Binning)\n\n分箱也称为离散化，有助于将连续数值变量分组为类别或箱（bins），帮助我们理解数据的分布情况以及是否存在我们需要注意的边界条件。分箱有助于更好地处理非线性关系，提高回归用例的准确性。分箱会导致特征值的分组。创建箱后，我们可以使用热编码来进一步扁平化数据，但仅当观测值数量极小时可行。在此示例中，我们无法这样做，因此我们将接受序数箱标识作为编码值。执行以下代码块对我们的数据集应用分箱：\n\
  \n```python\n### 我们使用 scikit learn 包 KBinscretizer 将感兴趣的每个特征分成不同数量的箱\n# 然后将其编码为序数，这将返回每行特征的箱标识\n\
  ### 我们排除已进行独热编码的国家特征，对其余特征进行分箱\nfrom sklearn.preprocessing import KBinsDiscretizer\n\
  wine_binner = KBinsDiscretizer(n_bins=[5,3,3,10,10,6], encode='ordinal')\nwine_binned_arr\
  \ = wine_binner.fit_transform(wine_encod_df[['price','points','last_year_points','designation_freq','winery_freq','variety_transformed']])\n\
  ### 将分箱特征赋值回 dataframe，完成！你的特征工程数据集就准备绪了\nwine_binned_df = pd.DataFrame(data=wine_binned_arr,\
  \ columns=['price','points','last_year_points','designation_freq','winery_freq','variety_transformed'])\n\
  ## 合并回国家特征\nwine_binned_df = pd.concat([wine_binned_df.reset_index(drop=True),wine_encod_df.iloc[:,6:].reset_index(drop=True)],axis=1)\n\
  ```\n\n\n\n\n\n### 显示结果\n\n```python\nwine_binned_df.tail()\n```\n\n我们将得到以下结果：\n\
  \n![](img/Figure-3.23.jpg)\n\n**图 3.23:** 分箱后的特征\n\n## 特征相关性\n\n在编码和缩放之后，我们现在有了一个全数值数据集；因此，我们可以运行相关性算法来检查特征之间的相关性。特征与目标特征之间的相关性越低，模型的性能就越差，训练时间也越长。同时，如果所有特征与目标特征高度相关，模型可能无法学习到近似函数，并可能在训练数据上过拟合。平衡是关键；特征选择应该利用相关性数据来确定我们用于机器学习训练的特征列表。但我们该如何理解特征之间的相关性呢？幸运的是，我们有易于使用的包可以构建相关性并帮助我们将其可视化。我们将使用\
  \ Seaborn ([https://seaborn.pydata.org/]) 可视化库来创建并查看数据集的相关性。请执行以下代码块，在缩放或归一化之前、类别编码之后为我们的数据集构建相关性：\n\
  \n```python\n# 假设我们想使用输入特征预测一瓶葡萄酒的价格，让我们看看它们是如何相互相关的\n# 我们将使用 seaborn 可视化库\nimport\
  \ seaborn as sns\n## 频率和目标编码数据集的相关性\n# 为了方便显示，我们删除了国家独热编码特征\nsns.heatmap(wine_encod_df.iloc[:,0:6].corr(),\
  \ annot=True)\n```\n\n我们得到了以下热图结果；1.0 表示完全相关，0.0 表示无相关性：\n\n![](img/Figure-3.24.jpg)\n\
  \n**图 3.24:** 编码后葡萄酒数据集的相关性热图\n\n继续执行本节中的其余代码块，以可视化缩放后、归一化和分箱后的数据集版本的相关性。通过对它们进行比较和对比，来理解其中的变化。在关于表格数据特征工程的最后一节中，我们将使用主成分分析（PCA）进行降维，以减少我们训练所需的输入特征数量。\n\
  \n## 主成分分析\n\n我们将检查是否可以使用 PCA 来减少缩放后数据集的特征数量，为训练做准备。我们将使用在 CV 特征工程中相同的 Scikit Learn\
  \ 包。执行以下代码块，将价格特征移动到第一列，因为这将是我们的目标特征。我们仅对输入特征运行 PCA：\n\n```python\n# 让我们检查 PCA 是否能帮助我们缩放后的数据集\n\
  # 你可以尝试对自己的其他数据集进行此练习\n# 我们首先将价格特征作为第一列，因为它是我们的标签\nmove_price = wine_scaled_df.pop('price')\n\
  wine_scaled_df.insert(0,'price',move_price)\nwine_scaled_df.head()\n```\n\n我们现在得到了价格特征作为第一列的结果：\n\
  \n![](img/Figure-3.25.jpg)\n\n**图 3.25:** 为 PCA 准备将价格移动到第一列\n\n我们总共有 54 个特征，其中包含\
  \ 53 个输入特征，1 个目标特征。我们正尝试通过 PCA 减少输入特征的数量。首先，我们将运行以下代码块设置 PCA 模型，从 53 个输入特征中创建 20\
  \ 个组件，以检查这些组件处理了数据中多少变异性：\n\n```python\n# 让我们使用 Scikit learn PCA 查看 20 个特征的变异性\n\
  # 仅使用输入特征，价格将被忽略，因为它是目标特征\nimport numpy as np\nfrom sklearn.decomposition import\
  \ PCA\npca_20 = PCA(n_components=20)\n# 忽略第一列，因为它是目标特征\npca_20.fit(wine_scaled_df.iloc[:,1:])\n\
  print(pca_20.explained_variance_ratio_ *100)\n```\n\n我们得到了所示的结果。我们可以从以下数组看到，前 12\
  \ 个组件占据了我们数据集 88% 的变异性。因此，我们将组件数量选择为 12：\n\n```text\n[27.61619465 14.09297552 8.76254336\
  \ 8.53355052 7.86265684 7.66539351\n4.08749879 3.39716159 3.25183729 3.02518259\
  \ 2.35018136 2.08445308\n1.88961942 1.61447355 1.41769812 0.60665283 0.44511272\
  \ 0.39916116\n0.16620317 0.1273224\n```\n\n让我们使用 12 个组件转换数据集。执行以下代码块。我们得到数据集的形状为\
  \ `(144, 12)`：\n\n```python\n# 使用 12 个组件 PCA 转换数据集\n### 检查形状\npca_12 = PCA(n_components=12)\n\
  wine_reduced = pca_12.fit_transform(wine_scaled_df.iloc[:,1:])\nwine_reduced.shape\n\
  ```\n\n## 结论\n\n如果你让数据科学家选择一个他们认为至关重要的任务，他们可能会选择特征工程，这就是我们今天学习的内容。\n\n## 重点回顾\n\n\
