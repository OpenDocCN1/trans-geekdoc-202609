  \ = {\n““max_depth”:”6”,\n““eta”:”0.3”,\n““gamma”:”2”,\n““min_child_weight”:”4”,\n\
  ““subsample”:”0.5”,\n““objective”:”reg:squarederror”,\n““num_round”:”30”\n}\n```\n\
  \n11 我们正在使用 SageMaker 内置的 XGBoost 版本，因此我们需要做的就是在训练时引用容器镜像。执行下一个单元格将此镜像加载到变量中：\n\n\
  ```python\n# 接下来让我们获取 XGBoost 内置镜像\nxgb_image = sagemaker.image_uris.retrieve(“xgboost”,\
  \ ‘us-east-1’, “1.5”)\n```\n\n12 执行下一个单元格为模型定义输出路径：\n\n```python\n# 定义存储模型产物的输出路径\n\
  model_prefix = prefix+’xgboost-model’\nmodel_output = ‘s3://{}/{output’.format(bucket,\
