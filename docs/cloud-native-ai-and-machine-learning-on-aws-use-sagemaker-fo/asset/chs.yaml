  *   我们学习了感知认知 AI 服务的核心能力，这些能力如何与机器人所需的函数相对应。\n*   随后，我们转向使用 AI 服务 API，学习如何通过编程方式为应用构建添加\
  \ AI 能力。\n*   我们执行了 Python 代码示例，使用 `Amazon Transcribe` API 从音频文件创建文本转录。\n*   我们学习了如何使用\
  \ `Amazon Rekognition` 检测图像中的标签。\n*   我们学习了如何使用 `Amazon Translate` 将我们的转录文本翻译成多种语言。\n\
  *   我们学习了如何使用 `Amazon Polly` 将我们存储在 MP3 文件中的文本生成语音。\n*   最后，我们学习了如何使用 `Amazon Comprehend`\
  \ 从文本中得出独特的见解。\n\n## 多选题\n\n使用这些问题来测试你对本章中所学的 AWS AI 服务的掌握程度。\n\n1. **从文本数据中检测见解的正确选项不是哪个？**\n\
