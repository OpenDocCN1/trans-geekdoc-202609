  \   ![](img/Figure-10.7.jpg)\n\n    **图 10.7：** 复制 Studio 执行角色 ARN\n\n3. 现在，在服务搜索栏中输入\
  \ `IAM` 并导航到 IAM 控制台，如下所示：\n\n    ![](img/Figure-10.8.jpg)\n\n    **图 10.8：** 搜索\
  \ IAM 服务\n\n4. 在 IAM 控制台中，从左菜单选择 `Roles`，并仅从你复制的 ARN 中输入角色名（即复制 ARN 的部分），如下所示：\n\
  \n    ![](img/Figure-10.9.jpg)\n\n    **图 10.9：** 查找角色\n\n5. 点击角色名称选择该角色，并在 `Permissions`\
  \ 策略下，点击 `Add permissions` 按钮并选择 `Attach policies`。如下所示：\n\n    ![](img/Figure-10.10.jpg)\n\
  \n    **图 10.10：** 为角色附加策略\n\n6. 现在，我们将为每个服务添加只读策略。首先，在策略搜索中输入 `polly`，点击 `AmazonPollyReadOnlyAccess`\
  \ 左侧的复选框选择该策略。先不要点击 `Attach policies` 按钮；我们几个策略需要附加，可以一次性完成。如下所示：\n\n    ![](img/Figure-10.11.jpg)\n\
  \n    **图 10.11：** 为 Amazon Polly 添加只读策略\n\n7. 点击 `polly` 旁的 `X` 清除过滤器；然后在权限搜索中输入\
  \ `transcribe`，并为 `Transcribe` 添加完全权限，因为我们将使用 `Transcribe API` 提交作业。如下所示：\n\n  \
  \  ![](img/Figure-10.12.jpg)\n\n    **图 10.12：** 选择 Transcribe 策略\n\n8. 现在，对每个服务名称重复步骤\
  \ 6（分别为 `comprehend`、`translate` 和 `rekognition`），为这些服务添加只读策略。记住在搜索下一个服务之前，清除上一个服务的过滤器。最后，点击页面右下角的\
  \ `Attach policies` 按钮。完成后，你应该能看到策略，如下所示：\n\n    ![](img/Figure-10.13.jpg)\n\n \
  \   **图 10.13：** 已附加 AI 服务策略\n\n9. 现在，点击 `Trust relationships` 选项卡，然后点击 `Edit trust\
  \ policy`。复制并粘贴以下 JSON 结构，以添加可以假设此执行角色的信任关系。粘贴 JSON 后，点击页面右下角的 `Update policy` 按钮：\n\
  \n```\n{\n```\n\n\n\n\n\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
  : [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": {\n        \"Service\"\
  : [\n          \"sagemaker.amazonaws.com\",\n          \"transcribe.amazonaws.com\"\
  ,\n          \"comprehend.amazonaws.com\",\n          \"rekognition.amazonaws.com\"\
