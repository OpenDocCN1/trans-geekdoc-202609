  \n# 使用 SageMaker Canvas 运行 AutoML](#toc.xhtml#s159a)\n\n\n\n\n自动化是我们所有发明的关键动力。我们不断寻找减少人工操作、更快速完成任务、降低成本并提高效率的方法。例如，想想洗衣机。过去需要花费数小时努力（手洗衣服）并消耗大量体力的工作，现在仅需不到一半的时间就能毫不费力完成，提高了我们的生活质量。技术也是如此。你可能构建了最伟大的产品，但如果它复杂且需要大量人工维护，那么它可能无法取得巨大成功。\n\
  \n我们生活在一个快节奏的世界，要求我们完成项目不仅要有成功的结果，还要快速。传统的机器学习（ML）是科学家和研究人员的乐场，他们有充足的时间和资金仔细训练、调优和验证模型，但这种情况在云计算出现后发生了变化。现在\
  \ AI/ML 已成为主流，自动化是当务之急。\n\n自动化机器学习工作流的哲学非常简单：只需识别出那些无差异的体力任务（数据处理、转换、特征工程、计算资源分配）、重复性的任务（迭代模型训练和调优）以及可以推断的任务（如果要预测连续的数值特征，则是一个回归问题）。然后将它们整合在一起，并提供执行手段而无需人工干预。\n\
  \nSageMaker Autopilot (`https://aws.amazon.com/sagemaker/autopilot/`) 正是这样做。它是 SageMaker\
  \ 中的一个全托管功能，为表格数据和时间序列预测问题提供自动化的低代码 ML 工作流执行。参考下图了解 SageMaker Autopilot 中自动化的 ML\
  \ 工作流的关键能力，这些能力对用户完全透明：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 由 SageMaker Autopilot\
  \ 自动化的 ML 工作流步骤\n\nAmazon SageMaker Canvas (`https://aws.amazon.com/sagemaker/canvas/`)\
  \ 底层使用了 Autopilot。SageMaker Canvas 是一个全托管的无代码 ML 解决方案，具有交互式 UI 用于构建和运行强大的 ML 模型，你可以用于各种任务。你只需在\
  \ Canvas 中通过点击交互即可完成整个 ML 工作流。本节的说明将引导你如何使用我们的葡萄酒特征数据集，通过直接处理原始数据集来预测葡萄酒的价格。\n\n\
