  \n# 使用 Amazon Polly 生成语音](#toc.xhtml#s236a)\n\nPolly 是一种易于使用的 AI 服务，可为任何规模的应用程序启用语音。它以文本作为输入，并以多种语音风格（男女都有）播放这些文本。Polly\
