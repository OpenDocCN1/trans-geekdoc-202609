  \    )\n    for label in response['Labels']:\n        print(\"Amazon Rekognition\
  \ is \"+str(round(label['Confidence'],0))+\" confident that this picture is of a\
  \ \"+label['Name'])\n```\n\n5. 当我们观察图像时，看到的只有一只可爱的小狗。但 Rekognition 看到的远不止于此。查看我们从\
  \ Rekognition 打印的结果。在这里我们只看到五条打印语句，因为我们指定了 `MaxLabels=5`，如前一个代码中高亮部分所示。如果我们增加标签数量，将从\
  \ Rekognition 获取更多信息：\n\n```\nAmazon Rekognition is 98.0 confident that this picture\
  \ is of a Labrador Retriever\nAmazon Rekognition is 98.0 confident that this picture\
  \ is of a Dog\nAmazon Rekognition is 98.0 confident that this picture is of a Pet\n\
  Amazon Rekognition is 98.0 confident that this picture is of a Canine\nAmazon Rekognition\
  \ is 98.0 confident that this picture is of a Mammal\n```\n\n`DetectLabels` 是 Amazon\
