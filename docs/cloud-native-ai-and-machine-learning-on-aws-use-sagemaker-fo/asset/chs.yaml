  \ `https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html` 中的文档。这就是我们讨论使用\
  \ Amazon Rekognition 作为我们机器人眼睛的原因。\n\n# 使用 Amazon Translate 进行语言翻译](#toc.xhtml#s235a)\n\
  \n之前，我们学习了如何使用 Amazon Transcribe 进行自动语音识别以及使用 Amazon Rekognition 进行计算机视觉应用。在本节中，我们将使用\
