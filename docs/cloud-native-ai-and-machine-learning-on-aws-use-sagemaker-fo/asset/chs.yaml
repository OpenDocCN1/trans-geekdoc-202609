  \ AWS Lambda 函数发送的参数。\n\n# 使用 Amazon S3 触发器创建 AWS Lambda 函数\n\n在本节中，我们将执行任务来创建我们的\
  \ AWS Lambda (https://aws.amazon.com/lambda/) 函数。AWS Lambda 允许你轻松地构建并执行代码以响应事件。你不需要创建或配置任何基础设施。你所做的是用\
