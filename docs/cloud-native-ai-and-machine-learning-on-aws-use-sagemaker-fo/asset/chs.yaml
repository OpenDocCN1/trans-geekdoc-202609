  \n# 第二章章\n\n## 填充数据湖\n\n### 引言\n\n在开始训练机器学习模型之前，我们需要识别、组装、策展并准备将作为输入的数据。我们可以直接使用数据所在处的数据，即各种关系型和非关系型数据存储、数据仓库、对象存储或文件系统，但我们知道也需要一个自己的数据存储器来存储我们工程化的特征集、在团队之间共享数据，并将其作为训练的输入。许多现有的数据存储要求我们在写入时应用其模式（schema），并且在跟上机器学习高效所需的传输速度方面存在问题。\n\
  \n数据湖（Data Lake）应运而生。它不仅对于机器学习项目是必要的；数据湖本身就是一种数据存储应用程序，具有使其适用于机器学习项目的功能。主要，它不要求在写入数据时应用任何特定模式，这意味着我们可以检索数据，根据项目需要对其进行转换，然后将转换后的数据写回。它还使用了细粒度的访问控制，允许各个团队访问并控制他们所需的数据。\n\
  \n机器学习项目并不需要像数据湖这样的对象存储，但随着组织 AI/ML 能力的扩展，使用数据湖可以确保速度、敏捷性和灵活性。在 Amazon Web Services\
  \ (AWS) 上，数据湖的核心是 `Amazon Simple Storage Service` (`S3`)。你还将使用 `Amazon Key Management\
  \ Service` (`KMS`) 对静态状态下的 S3 桶进行加密，并使用 Amazon `Identity and Access Management`\
  \ (`IAM`) 服务来控制对桶的访问。Amazon 提供了一个预构建的数据湖解决方案（链接在“延伸阅读”部分），你的组织可以使用或扩展该方案来轻松开始。\n\
  \n在本章中，我们将在 AWS 上搭建数据湖，然后探索我们可以从其现有数据存储器导出数据并在数据湖中管理数据的工具。\n\n### 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n* 什么是数据湖？\n* 为什么机器学习需要数据湖？\n* 如何在 AWS 上创建数据湖？\n* 如何将数据导入你的数据湖？\n\n### 目标\n\n本章的目标是为机器学习项目建立基础。我们将回顾数据湖的概念、其数据以及为什么它是理想。我们还将回顾数据湖本身，最后我们将为机器学习项目挖掘数据。\n\
  \n要理解这一点，请参阅 `第一章：数据湖简介`。我们还将回顾数据湖的要求、可使用的工具以及创建它的步骤。\n\n## 场景\n\n考虑一位身处大型企业的数据库工程师。他们使用数据湖来存储、管理和保护数据。这允许他们以原始形式保留数据，这对于机器学习项目至关重要。数据湖还提供了细粒度的访问控制，确保只有授权团队才能为其机器学习任务访问特定数据。\n\
  \n## 数据湖\n\n简单来说，数据湖是一个数据仓库。数据湖的第一部分是能够以其未更改的形式存储数据的能力。这实现了“读取时定义模式”（schema-on-read），而不是在写入时应用模式。这意味着团队可以在项目的各个阶段使用准备就绪的最终数据。\n\
  \n数据湖的下部分是它需要接受任何格式的数据。它应该能够存储结构化数据（`csv`、数据库导出、表格文件）、非结构化数据（图像、音频文件、文本副本）或半结构化数据（`json`、`yaml`、`xml`）。最后，数据湖必须能够按对象甚至对象版本访问数据。这允许你在数据湖中存储数据，并管理谁可以查看、访问或更改单个数据对象。\n\
  \n参阅 `图 2.1`：\n\n```\n[图 2.1]\n```\n**图 2.1:** 数据湖示例图\n\n参阅 `图 2.2`，它显示了 AWS 全球基础设施层：\n\
  \n```\n[图 2.2]\n```\n**图 2.2:** AWS 全球基础设施层\n\n\n\n\n\n注意：勒索软件与数据湖 - 保护数据免受勒索软件攻击的关键策略是保持一个不可变的数据存储。在\
  \ S3 上，可以通过多种方式实现，但最直接的方法是通过设置启用了版本控制和对象锁定（Object-Locking）的跨区域复制。这意味着如果数据对象被损坏，你可以从不可变数据存储中检索到最后一个未损坏的版本。\n\
  \n## 保护您的存储桶\n\n社交媒体和新闻网站充斥着许多组织通过 S3 存储桶配置暴露数据的案例。现在就考虑针对您的数据湖的安全策略，可以避免日后的痛苦。需要记住这一点是：默认情况下，您的存储桶及其其中的所有对象都是私有的。将它们设置为公开（让世界上任何人都可以读取）需要进行操作，并且在激活之前（或更准确地说，在被完全阻止之前）应该经过仔细考虑。Amazon\
  \ S3 存储桶访问可以通过附加到资源（如存储桶、密钥或标签）的策略，以及附加到用户的策略来管理。在基于资源的策略（也称为存储桶策略）情况下，你编写一个策略文档（例如所示），并将其附加到特定的存储桶。在基于用户的策略情况下（例如所示），你将在身份和访问管理（**IAM**）服务中创建策略并将其附加到您的用户、角色或组。在这两种情况下，定期检查您的策略对于确保您拥有适当范围的权限至关重要。\n\
  \n以下是一个存储桶策略示例，允许用户 `EngineerCarl` 访问 S3 存储桶 `data-lake-example-bucket` 中任何以 `/carl/`\
  \ 开头的文件：\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Id\": \"BucketPolicyAllowCarlAccess\"\
  ,\n  \"Statement\": [\n    {\n      \"Sid\": \"ExampleStatement01\",\n      \"Effect\"\
  : \"Allow\",\n      \"Principal\": {\n        \"AWS\": \"arn:aws:iam::11223344556677:user/EngineerCarl\"\
  \n      },\n      \"Action\": [\n        \"s3:GetObject\",\n        \"s3:GetBucketLocation\"\
  \n      ],\n      \"Resource\": [\n        \"arn:aws:s3:::data-lake-example-bucket/carl/*\"\
  \n      ]\n    }\n  ]\n}\n```\n\n以下是一个用户策略示例，允许附加了该策略的用户访问该用户拥有的所有存储桶，但名为 `private-bucket`\
  \ 的除外：\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n\
  \      \"Effect\": \"Allow\",\n      \"Action\": [\"s3:ListAllMyBuckets\"],\n  \
  \    \"Resource\": \"arn:aws:s3:::*\"\n    },\n    {\n      \"Effect\": \"Allow\"\
  ,\n      \"Action\": [\n        \"s3:ListBucket\",\n        \"s3:GetBucketLocation\"\
  \n      ],\n      \"Resource\": \"arn:aws:s3:::*\"\n    },\n    {\n      \"Effect\"\
  : \"Deny\",\n      \"Action\": \"s3:*\",\n      \"Resource\": [\n        \"arn:aws:s3:::private-bucket/*\"\
  ,\n        \"arn:aws:s3:::private-bucket\"\n      ]\n    }\n  ]\n}\n```\n\n## 保护您的数据湖\n\
  \n除了核心 S3 存储桶之外，创建、管理和使用数据湖的完整细节本身就可以写一本书，但初始考虑应包括以下内容：\n\n*   **使用 AWS 密钥管理服务 (KMS)\
  \ 进行静态加密**：确保您识别了数据的合规性或监管要求，特别是当数据包含个人身份信息 (**PII**）时。\n*   **对象版本控制**：如果发生意外覆盖，保留版本历史可能是关键。当需要识别数据变化的维度时，你也可以参考对象的之前的版本。\n\
  *   **对象存储类**：Amazon S3 提供了多种存储类，提供一系列可用性和成本优化方案。此外，S3 还提供了存储生命周期规则，允许你按对象管理存储类。你可以在对象达到特定年龄时（包括文件的旧版本）将它们移动到成本更低的层级。S3\
  \ 还提供了智能分层（Intelligent Tiering），它根据你的使用模式确定最具成本效益的层级。\n\n## 用于机器学习的数据湖\n\n现在你有了数据湖，但为什么它对机器学习项目特别有用呢？为了回答这个问题，我们可以看看机器学习本身。整个过程通常分为两个阶段：模型构建阶段和模型部署阶段。在机器学习项目的早期，你可能会在单个\
  \ Jupyter Notebook 中管理这两个阶段。\n\n在 AWS 上，你可以使用 SageMaker Notebook 、SageMaker Studio、独立的\
  \ EC2 实例或 Glue 开发端点来托管你的 Jupyter Notebook。在这些 Notebook 中，你通常会将初始数据收集、格式化、特征工程、模型训练、模型部署和模型验证结合在一起，以便你和团队能够快速对项目进行迭代实验。我们将在后面的章节中详细介绍这些项目，但数据湖作为此的存储解决方案是理想的，因为它允许你在过程的每个部分将数据保持在转换状态。这使得相同的数据可以被不同的团队用于多个项目。\n\
  \n## 注水（Hydration）的重要性\n\n一旦你有了数据湖，阶段就是向其中填充数据，通常被称为“数据湖注水”（Hydrating the Data Lake）。这是将收集的数据作为独立对象初始移动到数据湖的过程。对于大多数项目而言，这将下载你选择的数据并将其存储在数据湖中。它也可以涉及从现有数据源（如关系型数据库、数据仓库或外部数据存储）检索数据集，执行稍后介绍的转换，并将其添加到数据湖。这种初始设置创建了将数据对象视为独立项目和交付物的第一步。\n\
  \n## 设置您的 AWS 账户\n\n为了构建并注水你的数据湖，你需要一个 AWS 账户。要开始，请打开 AWS 主页（`https://aws.amazon.com/`）并创建\
  \ AWS 账户。\n\n注意：根账户电子邮件地址：如果你在组织或团队中工作，考虑使用邮件列表作为初始电子邮件地址，以防团队成员添加或移除。\n\n在该页面上，你将输入电子邮件地址、强密码和\
  \ AWS 账户名称。验证信息无误后，点击`继续`。\n\n\n\n\n\n个人账户和业务账户启用了相同的服务和设置。对于业务账户，请确保您输入的是业务联系方式和电话号码，而不是个人号码。\n\
  \n一旦点击 `Continue`，您将添加您的联系信息，然后选择 `Continue` 并在点击 `Continue` 之前仔细阅读 AWS 客户协议。一旦创建创建，您将收到一封确认电子邮件。收到该邮件后，您可以使用在创建账户期间输入的电子邮件地址和密码进行登录。\n\
  \n在首次登录时，您在使用任何 AWS 服务之前需要输入支付方式，然后您将需要验证在创建账户期间期间添加的电话号码。一旦您同意验证，自动化系统将拨打列出的电话号码并读取一个需要在页面上输入的\
  \ PIN 码。\n\n最后，您需要选择您的 AWS 支持计划（添加详细信息）并点击 `Complete Sign Up`。激活账户可能需要最多 24 小时，但通常在几分钟内即可完成。\n\
  \n一旦您的账户完全激活，您就可以登录并使用所有服务。\n\n这创建了所谓的根账户（root account）。这是一个用于所有用途的完整账户，但最佳实践是创建一个组织结构或系列子账户和账户分组，称为组织单元（organizational\
  \ units）。这允许您不仅控制使用 AWS 账户作为限制半径时发生的情况，还可以轻松查看每个账户的成本和使用情况。\n\n**提示：多因素身份验证 (MFA)**：在继续之前，请确保您有一个极其安全的密码，并在根账户上添加了多因素身份验证。如果有人访问了您的根账户，他们可以将您锁定，并向您在设置期间添加的卡片收取任何任意金额的费用。检查\
  \ AWS 的 reddit，你会看到不断更新的帖子，标题类似于“意外账单！”以及关于如何弥补损失的请求。简短的建议是使用 MFA 和一个非常安全的密码。现在就设置它们。\n\
  \n为您 AWS 账户可能发生的情况和初始组织结构设置护栏的最方法是使用 AWS Control Tower。首先选择最适合您通用用途的区域，并导航到 Control\
  \ Tower 落地页（`https://console.aws.amazon.com/controltower`）。选择设置落地区的选项，向程序将引导您完成其余的流程。这包括设置\
  \ `Organizational Units`（`OUs`），即账户的逻辑分组，以及为您邀请到账户的任何用户设置 AWS 单点登录访问。\n\n**提示：不要做管理员**：是的，这更容易。但请不要这样做。这样做很容易出错，在您无意的区域中触发某些操作，并干扰您无意中干扰的基础设施。为自己创建一个用户，并从您想要执行的作业职的托管策略开始，在需要时添加权限。一段时间后，您可以使用\
  \ AWS IAM Access Analyzer 创建自定义策略，该策略仅包含执行您需要的事情的权限。\n\n最后，在现有的或新的组织单元中设置一个账户，将其用于您的机器学习实验。最佳实践是设置账单告警（`https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/monitor_estimated_charges_with_cloudwatch.html`），以确保您不会产生任何意外费用，并让收到提醒以关闭任何不必要的设施。幸运的是，新发布的\
  \ AWS 控制台主页包含了成本和使用指标，使监控这些内容变得更加容易。\n\n## 开始数据集\n\n数据集简单来说就是集合。有几个公开的数据集，其中三个我们将在本章及后续章节中使用。此外还有几个数据集搜索提供者，例如\
  \ Hugging Face Datasets、Kaggle、Google Dataset Search、AWS 公共数据集和 VisualData。\n\n\
  我们将在后续章节中使用的数据集列在这里：\n\n*   **葡萄酒质量数据集**：`[`archive.ics.uci.edu/ml/datasets/wine+quality`](https://archive.ics.uci.edu/ml/datasets/wine+quality)`\n\
  *   **泰坦尼克数据集**：[`web.stanford.edu/class/archive/cs/cs109/cs109.1166/problem12.html`](https://web.stanford.edu/class/archive/cs/cs109/cs109.1166/problem12.html)`\n\
  *   **MNist 数据集**：`http://yann.lecun.com/exdb/`\n*   **PLAsTiCC 分类数据集**：`https://www.kaggle.com/c/PLAsTiCC-2018/data`\n\
  \n可以使用这些链接下载这些数据集并将其存储在您的数据湖中。参考 `图 2.4`：\n\n```\n[Figure 2.4]\n```\n\n## Lake Formation\
  \ 欢迎界面\n\n有几个被认为在数据湖范围内的 AWS 服务，就像大多数事情一样，回到本章开头的场景，我们可以从选择使用 AWS 的数据库工程师的角度来考虑这项任务。参考\
  \ `图 2.5`：\n\n```\n[Figure 2.5]\n```\n\n## 使用 Lake Formation 设置您的数据湖\n\n准备实施 Lake\
  \ Formation 我们的第一个任务是为该服务创建一个代表我们运行的 `Role`（角色）。当您登录 AWS 时，您承担一个 `Role`，这是一种身份类型，用于识别我们在账户中拥有的权限组。与用户一样，确保服务仅拥有执行其所需的权限是非常重要的。\n\
  \n如果您有现有的 S3 存储桶，也可以将它们注册为数据湖中的源，也称为数据湖位置。这对于过去曾用作数据源的现有存储桶特别有用，这些存储桶现在可以整合到您的数据湖中。参考\
  \ `图 2.6`：\n\n```\n[Figure 2.6]\n```\n\n## 在 Lake Formation 中注册存储桶\n\n我们的数据库工程师密切遵循\
  \ AWS Lake Formation 设置文档（`https://docs.aws.amazon.com/lake-formation/latest/dg/getting-started-setup.html`），为服务创建一个\
  \ `role`，为数据湖管理员（他们自己）、初始用户（他们的团队成员）、用于存储对象的实际 S3 存储桶以及可选的托管表配置。然后他们下载上述的数据集，将其加载到数据湖中以供即将进行的机器学习项目。\n\
  \nLake formation 为您提供了如下所示的几个强大选项：\n\n*   **数据目录 (Data Catalog)**：这与 Glue 数据库和表相同，将在本章后续介绍。\n\
  *   **注册和摄取 (Register and ingest)**：这是将 S3 存储桶注册为数据湖源的能力，使用预定义模板并链接 AWS Glue 爬虫和作业来转换数据，将在本章后续介绍。\n\
  *   **权限 (Permissions)**：数据湖的集中式访问控制。可以按角色对用户和应用程序应用控制，并可以在表级行级别应用。参考 `图 2.7`：\n\
  \n```\n[Figure 2.7]\n```\n\n\n\n\n\n我们的数据库工程师对自己的工作很满意，检查邮件时发现分配了一个全新的工单。IT 领导层对数据湖的快速实现感到非常高兴，他们确定了以下额外的数据源以将其添加到不断扩展的数据湖中：\n\
  \n*   存储在另一个 AWS 账户的 `DynamoDB` 中的点击流数据\n*   各种云原生和本地应用的当前及历史日志数据\n*   存储在老旧托管机房网络文件系统存储阵列中的历史平坦文件\n\
  *   连接性极受限的分支办公室中的冷存储存档文件\n\n此外，多个团队请求能够查看加载到数据湖中的数据文件特征，并在不下载到本地的情况下从中提取数据。幸运的是，我们的数据库工程师（现在已成为一名新星的云架构师）手头有这本书，并准备好应对这些新请求。\n\
  \n## 流式数据与数据湖\n\n点击流数据，或者说任何持续进行的数据流，都可以通过 `Amazon Kinesis` 接入数据湖。当然，可以从现有的数据存储库创建一次性导出，但随后几乎就会收到刷新数据的请求，从而导致任务重复的无尽循环。此外，某些数据源接收快速、持续的更新，也称为流式处理。这些特别适用于可以扩展以支持它们的传输机制。\n\
  \n## Amazon Kinesis\n\n介绍 AWS 服务家族：`Amazon Kinesis`。`Amazon Kinesis` 是一系列相似服务的集合，是一种数据传输、转换和分析机制。使用其中包含的服务，你可以连接到数据源并根据需要进行扩展，将这些数据以原始或转换后的状态投递到你的目标位置。你甚至可以将相应的\
  \ `Amazon Kinesis` 服务串联起来，以创建更复杂的数据流应用程序：\n\n*   `Kinesis Data Streams` 允许你无服务器地将日志、进程、事件或更新等数据源流传输到目标位置。该位置可以是另一个数据存储库（如\
  \ `S3`），也可以另一个 AWS 服务。主要优势是 `Kinesis` 可以根据你的需求进行扩展，允许你解耦工作负载的各个部分。`Kinesis Data\
  \ Streams` 支持两种运行模式：按需和预留。\n    *   按需（On-demand）顾如其名，无需进行容量规划，并可以扩展到每分钟数 GB 的读写操作。`Kinesis`\
  \ 会替你处理容量管理；对于突发、不可预测的数据流请使用按需模式。\n    *   预留（Provisioned）是你指定分片（shards）数量，分片是单个\
  \ `Kinesis` 流中唯一标识的数据记录。分片具有定义容量：每秒最大读取 `2MB` 最大写入 `1MB`；对于可预测的稳定状态数据流请使用预留模式。\n\
  *   `Kinesis Data Firehose` 是一种高速数据交付系统，专门用于将数据从源移动到分析服务、数据仓库，甚至是数据湖。\n*   `Kinesis\
  \ Data Analytics` 允许你使用 `Apache Flink` 在流过程中从数据创建洞察。\n*   `Kinesis Video Streams`\
  \ 是为管理、转换和存储实时视频流而定制的。\n\n在这种情况下，`Amazon Kinesis Data Streams` 和 `Kinesis Firehose`\
  \ 是将点击流从 `Amazon DynamoDB` 迁移到我们数据湖的选择。`Kinesis Data Streams` 将作为消费者，收集并管理 `DynamoDB`\
  \ 中项级更改的输入，将其投递到 `Kinesis Firehose`，以高速投递到数据湖。`DynamoDB` 还具有与 `Kinesis Data Streams`\
  \ 的便捷集成功能，这意味着我们不需要在两个服务之间编写任何自定义集成。在 `DynamoDB` 中，只需点击所选表格的 `Overview`（概述），然后点击\
  \ `Manage streaming to Kinesis` 即可。如果需要，你还可以将 `Kinesis Data Firehose` 与计算资源（如无服务器选项\
  \ `Amazon Lambda`）集成，以执行任何所需的数据转换，例如在写入数据湖中的位置之前对数据进行压缩、更新或丰富。本书相关的 GitHub 仓库中包含一个创建\
  \ `Kinesis Data Stream` 的 `Python3` 脚本示例。\n\n## AWS DataSync\n\n现在点击流数据已流入数据湖，我们可以关注存储在本地存储位置的日志数据。我们可以再次利用\
  \ `Amazon Kinesis` 迁移数据，在这种情况下，数据是历史性的，并附带有提供数据上下文的应用程序制品。为此，我们可以利用 `AWS DataSync`\
  \ 将数据迁移到我们的数据湖。`DataSync` 旨在作为虚拟机部署到连接有 `NFS` 或 `SMB` 挂载的本地计算服务上。通过运行在虚拟机上的 `DataSync`\
  \ 代理，可以识别要传输到你的 AWS 账户的文件和文件夹，目标可以是 `S3`、`Amazon Elastic File System` 或适用于 Windows\
  \ 或 Lustre 的 `AWS FSx`。\n\n一旦配置好要移动的数据和目标位置（即我们的数据湖），`DataSync` 代理就会连接到 `DataSync`\
  \ 服务并将数据写入选择的位置。`AWS DataSync` 还支持计划任务，因此可以创建任何新日志文件的每日传输。\n\n## AWS Database Migration\
  \ Service\n\n当源数据位于本地或 `Oracle`、`MS SQL`、`MySQL`、`MariaDB`、`PostgreSQL`、`SAP` 或\
  \ `DB/2` 等云数据库时，可以使用 `AWS Database Migration Service` 进行一次性或持续的数据迁移（称为更改数据捕获或 `CDC`）。为了使用该服务，我们首先定义源对象，提供连接详细信息以及源数据库的信息。然后我们创建目标对象，提供连接详细信息以及目标信息（在本例中目标是\
  \ `S3` 数据湖）。我们还创建一个复制实例。这是执行实际迁移、转换、映射和写入目标位置的计算资源。你可以对多个任务使用同一个复制实例，但请确保它具有足够的网络、`CPU`\
  \ 和内存资源以跟上正在迁移的数据。\n\n最后，你将创建复制任务，将源、目标和复制实例结合起来，指定复制类型：一次性全量迁移、仅更改数据捕获或带有持续更改的全量迁移。AWS\
  \ 最近还发布了 Database Migration Studio，这是一个管理迁移任务的可视化界面，简化了整个过程。在本书编写期间，`Database Migration\
  \ Studio` 处于预览阶段，因此在使用之前请确保它具有你所需的功能，特别是在你的生产工作负载中。`AWS DMS Fleet Advisor` 是一个组件，允许你收集和管理关于多个数据库环境（无论本地还是云端）的信息，并为迁移任务做好准备。\n\
  \n## AWS Schema Conversion Tool\n\n此任务的另一个服务是 `AWS Schema Conversion Tool`。它不是在你的\
  \ AWS 账户中运行的服务，而是你可以可以下载并使用的工具，用于评估现有数据库结构并将这些数据库结构映射到新目标，识别哪些部分可以自动转换，哪些部分需要人工干预。当你需要从具有严格架构的数据源迁移到另一个具有相似架构的数据源时，该工具特别有用。示例包括从\
  \ `Oracle` 迁移到 `Amazon Redshift`、从 `Apache Cassandra` 迁移到 `Amazon DynamoDB` 以及从\
  \ `SAP ASE` 迁移到 `Aurora PostgreSQL`。对于我们的示例 `PostgreSQL` 迁移到 `S3`，我们的数据将以 `CSV`\
  \ 格式写入，这符合我们的业务需求，因此我们不需要使用 `AWS SCT`。\n\n\n\n\n\n完成数据库迁移后，我们的数据库工程师可以继续迁移来自各种远程设施的日志和平直文件。`AWS\
  \ DataSync` 是一个可能的选择，但由于互联网带宽限制且缺乏本地虚拟化环境，这个过程充其也可能是缓慢的。这些文件并不是立即需要，但在本财年结束之前是需要的。\n\
  \n看来是时候使用“雪暴（Snowstorm）”了。\n\n## AWS Snow Family\n\n`Snowcone`、`Snowball` 和 `Snowmobile`是一系列物理设备，它们可以被运输到全球任何地方你的数据所在地，加载数据，然后运回\
  \ `AWS`，在那里它们会被加载到你选择的支持目标位置。每台设备都具有极高的耐用性，设计用于抵御严重的运输事故。它们还配备了多层加密，防止数据在传输过程中被未经授权的访问。\n\
  \n## AWS Snowcone\n\n`Snowcone` 是 Snow 系列中最小的，设计用于连接到你的网络，并使用嵌入的 `AWS DataSync`\
  \ 客户端在本地或通过互联网传输数据。一旦数据加载到 `Snowcone` 设备上，你就可以将其寄回 `AWS`。该设备支持多达 14 TB 的固态存储，并具有本地计算能力，允许在寄回\
  \ `AWS` 之前进行数据处理。\n\n## AWS Snowball\n\n`Snowball` 是 Snow 系列的中端设备，提供存储优化型或计算优化型配置。`Snowball\
  \ Edge Storage` 配置具有多达 80 TB 的内置存储，并且像 `Snowcone` 一样，具有内置计算能力以便在寄回 `AWS` 之前处理数据。\n\
  \n## AWS Snowmobile\n\n`Snowmobile` 是一辆卡车。是的，整个通过货运卡车移动的集装箱。它专为极大型数据传输任务和高达字节级的数据集设计。对于我们列出的用例，`Snowcone`\
  \ 的容量足够，而且他们有足够的时间完成任务，我们的数据库工程师从他们的 `AWS` 账户台中订了两个。他们将协调将它们运送到前两个远程托管设施，将它们连接到本地网络，加载必要的数据，并在订购另外两个之前运回\
  \ `AWS`。任务完成且队列清空后，我们的数据库工程师带着成就感结束了工作周并享受他们的周末，获得应得的休息。然而，到了周一早晨，他们被分配了一个全新的工单：分析。\n\
  \n我们将在第三章“通过特征预测未来（Predicting the Future With Features）”和第四章“编排数据连续体（Orchestrating\
  \ the Data Continuum）”涵盖大部分分析内容。设计全面的分析解决方案远比单个工单复杂。经过仔细审查，任务初看似乎简单得多。`Data Lake`\
  \ 的用户对与单个数据对象交互的便利简单以及以原生格式存储数据的能力感到非常满意。目前为止报告的唯一挑战是很难理解 `S3` 桶中文件夹的结构、数据用户需要的数据可能在哪里，以及数据的起始格式是什么。\n\
  \n用户建议创建一个数据字典数据库，用以识别每个文件、位置以及所有关于数据的数据（也称为元数据）。我们的数据库工程师很心动，但认为可能有更好的方法，而无需创建一个全新的数据仓库来管理。\n\
  \n**注意：S3 文件夹：关于 `S3` 文件夹的一个非常重要的注意事项是，它们并不存在。`S3` 的用户界面会显示“文件夹”以允许这种概念或组织方式，但底层的对象存储只包含关于对象的两个位置信息：桶（bucket）和对象的键（key）。该键包含了对象的整个路径。例如，如果你有一个名为“uniquetestbucket”的桶，一个名为“testfolder”的文件夹以及一个名为“testfile.jpg”的文件，那么该对象被引用为桶“uniquetest\
  \ bucket”，对象键为“testfolder/testfile.jpg”。**\n\n**注意：S3 键优化：与前述关于 `S3` 文件夹的注意事项一起，还有分区前缀（partitioned\
  \ prefixes）的概念。对象的前缀（prefix）只是其整个键的第一部分。当对象被读取或扫描时，它们会根据你正在扫描的对象中前缀的相似性按块（blocks）进行扫描。这意味着，如果你有一组文件都以“nested/folder/structure/filename”开头，后面跟着一个递增的数字和文件扩展名，你可能会在每次操作中扫描所有这些命名相似的文件。防止这种情况的最优方法是将文件或文件夹的唯一名称尽早移动，类似于“nested/dateTime/folder/itemNumber/filename”，其中\
  \ dateTime 是实际的时间戳，itemNumber 是递增的数字。这允许你在读取操作中扫描更少项目，加快扫描，并允许在 `Data Lake` 中进行更快的\
  \ I/O 操作。**\n\n## 发现模式\n\n我们将在第三章“通过特征预测未来”和第四章“编排数据连续体”中深入探讨全面的分析、特征工程、数据转换并为机器学习项目做好准备，但我们想为目前拥有的数据提供一些背景信息。`Data\
  \ Lake` 解决方案和 `Lake Formation` 服务都允许我们向单个数据对象添加关于数据的数据信息（也称为元数据），这可以加速我们机器学习项目的数据准备阶段。我们可以添加额外的上下文片段，例如拥有数据的团队名称、需要从源系统重新检索数据的最小刷新日期、数据安全级别，甚至如果数据包含个人身份信息（也称为\
  \ PII/PII），则可以添加一个布尔值。这些通常以标签（tags）的形式添加。\n\n**提示：标签标记不仅仅是艺术师的。在 `AWS` 中创建的几乎所有内容都可以创建标签或在稍后添加标签。标签是简单的键值对，可以为创建的项目添加上下文或随附信息。除了上下文之外，决定哪些标签对于你账户中创建的事物是基本必需品、哪些是可选的，是一个至关重要的模式。这可以帮助你跟踪哪些资源是为了什么目的创建的，哪个团队正在处理特定服务，或者服务被用于工作负载的哪个部分。你还可以使用\
  \ `AWS Tag Manager` 和 `Service Control Policies`（服务控制策略）来强制执行决定的标记标准。**\n\n## Amazon\
  \ S3 Select\n\n`AWS Simple Storage Service`允许用户使用标准查询语言（也称为 SQL）从单个数据对象检索数据子集。这意味着使用控制台、提供的\
  \ `AWS` 软件开发包（也称为 `SDK`）或 `S3` API，可以使用标准语言检索你的文件选择，如下例所示。通常，你必须下载文件并将其加载到查询服务中，但\
  \ `S3 Select` 跳过了这一步，并允许你查看文件的结构并以程序方式检索其子部分，准备好用于许多分析、数据工程和机器学习项目。参考图 2.8：\n\n\
  ![](img/Figure-2.8.jpg)\n\n**图 2.8：使用 S3 Select 查询你 Data Lake 中的文件**\n\n## AWS Glue\n\
  \n\n\n\n\n与 Amazon Kinesis 类似，`AWS Glue` 是一套用于准备、转换和识别数据的工具和服务集总称。它是无服务器的，这意味着不需要管理计算或存储资源，因此您的团队可以运行实验，直接对运行项目所需的数据进行更改，并创建自动化作业，以便在机器学习工作流中重复执行这些步骤。\n\
  \n在本章中，我们仅介绍 Glue 家族中的几个工具，更多内容将在 *第 4 章，编排数据连续体* 中涵盖。\n\n## Glue 爬虫程序\n\n元数据（Metadata）是关于数据的数据，能够轻松管理元数据仓库的能力对于使用存储在您的数据湖（Data\
  \ Lake）中的数据的团队至关重要。特定文件中包含哪些字段、数据类型、条目数量、文件格式以及整体架构都可以自动确定并存储以供审查。下面的图片显示了添加新 `Crawler`（爬虫程序）时的\
  \ `AWS Glue 控制台`。爬虫程序将要求数据库和表信息，以便存储生成的元数据。如果您尚未准备好数据库和表，可以在创建 `Crawler` 时创建一个。请参考*图\
  \ 2.9*：\n\n![](img/Figure-2.9.jpg)\n\n**图 2.9:** 构建 Glue 爬虫\n\n您使用 `AWS Glue Crawlers`\
  \ 扫描指定的数据湖部分。扫描过程会将收集到的元数据填充到 `Glue` 数据库的 `Tables` 中，如*图 2.10*所示：\n\n![](img/Figure-2.10.jpg)\n\
  \n**图 2.10:** 创建 Glue  Crawler 时的审查界面\n\n提取、转换和加载 (ETL) 作业使用 `Glue Data Catalog`\
  \ 作为源和目标，从表中定义的数据存储中读取数据。从 `AWS Glue` 服务主页创建 `Glue Crawler`，请选择 `Crawlers`。从那里，您可以遵循向导操作或管理爬虫的各个元素。一旦爬虫启动，它将递归扫描目标位置，读取单个数据对象并收集有关它们的元数据，将其写入目标\
  \ `Glue Table`（Glue 表），如下所示（参考*图 2.11*）：\n\n![](img/Figure-2.11.jpg)\n\n**图 2.11:**\
  \ 已创建的 Glue Crawler\n\n您可以将爬虫程序设置为按需运行或按计划运行，以便在数据数据进入数据湖时刷新您的元数据表。\n\n## Glue 数据库\n\
  \n`AWS Glue Databases` 是您的 `AWS Glue` 服务中的元数据表集合。您的 `AWS Glue Databases` 可以包含从单个数据仓库或多个数据仓库中聚合多个源数据的表。这意味着您可以从数据湖中的多个逻辑位置收集元数据，即使它们存储在不同的键结构中，它们在逻辑上也是关联的。\n\
  \n## Glue 表\n\n`Glue Tables` 来自一个或多个源的元数据。您可以手动创建表、通过 `Glue Crawler` 的结果创建表、使用 `CloudFormation`\
  \ 基础设施即代码服务或通过 `Glue API` 创建，如*图 2.12*所示：\n\n![](img/Figure-2.12.jpg)\n\n**图 2.12:**\
  \ 从我们的爬虫创建的 Glue 表\n\n当您手动创建表时，还可以定义表架构和每个表字段的值。当通过 `Glue Crawler` 创建时，这些参数将由系统为您创建。\n\
  \n## Amazon Athena\n\n`Amazon Athena` 是一种无服务器查询服务，简化了与存储在 `Amazon S3` 中的数据（例如我们数据湖中的数据）的交互。您可以使用\
  \ ANSI 标准 SQL 查询数据，而无需从持久化位置移动数据。更好的是，Athena 从 `Glue Data Catalog` 中的表读取元数据，这允许您在不移动数据湖中数据的情况下与这些数据进行交互。在少数例外之外，`Athena`\
  \ 的 SQL 标准基于 `HIVEQL` DDL：[`cwiki.apache.org/confluence/display/Hive/LanguageManual+DDL`](https://cwiki.apache.org/confluence/display/Hive/LanguageManual+DDL)。\n\
  \n与大多数服务一样，您可以通过 `AWS 控制台` 与 `Athena` 交互，选择要查询的数据库和表，然后将查询语句直接写入提供的网页编辑器中。结果将直接提供，允许您查看、合并和调查数据。您还可以使用\
  \ `Athena API` 和 `SDK` 将 `Athena` 交互构建到您的应用程序中。\n\n当您第一次使用 `Athena` 时，需要设置一个 `Athena`\
  \ 可用于存储查询结果的 `S3 位置`。这不应位于您的数据湖中，因为这些数据被认为是临时性的，但如果有需要，您可以将查询及其结果导出到数据湖。\n\n*图 2.13*\
  \ 是 `Amazon Athena 控制台` 中运行的简单查询示例，从选定的数据源选择 10 行。这可以用于初步了解列格式、名称和数据类型：\n\n![](img/Figure-2.13.jpg)\n\
  \n**图 2.13:** 在 Athena 中针对 Glue 表的基础查询\n\n虽然我们对 `Athena` 的主要用例是为新创建的数据湖提供可见性，但它还可以通过**开放数据库连接\
  \ (ODBC)** 和**Java 数据库连接 (JDBC)** 连接关系型数据库、外部元数据存储和其他 Athena 数据源连接器，如提供的文档所示。*图\
  \ 2.14* 展示了可以在 Amazon Athena 控制台中使用的某些 SQL 类型。该查询选择了一个特定列，统计第三列值在指定范围内的条目，最后按第一列分组：\n\
  \n![](img/Figure-2.14.jpg)\n\n**图 2.14:** 在 Athena 中可以进行复杂的查询\n\n虽然书中将涵盖更多 `Athena`\
  \ 的内容，但还有一个额外的可以实现以支持数据和机器学习项目团队的关键功能：工作组（Workgroups）。\n\n以下是一些 Athena 查询示例：\n\n\
  1. 选择 `stellar_coordinate_data_table` 中的行数：\n```sql\nSELECT count(*) as count FROM\
  \ stellar_coordinate_data_table\n```\n\n2. 选择引用 `Glue 表` 的数据，对我们的数据进行分组并执行简单的数学表达式以派生详细信息：\n\
  ```sql\nSELECT DATE, CATEGORY, CONSTELLATION\navg(stellar_coordinate) as coordinate,\n\
  avg(stellar_coordinate/stellar_size) as average_stellar_momentum,\navg(stars_in_constellation)\
  \ as average_stars,\nstellar_size (stars_in_constellation, .99) 99th_percentile\n\
  FROM stellar_coordinate_data_table\nWHERE DATE > ‘2002%’ AND (TYPE = 'O' OR TYPE\
  \ = 'A')\nGROUP BY CONSTELLATION\nORDER BY 99th_percentile\n```\n\n`Athena Workgroups`\
  \ 允许您在 Athena 中隔离用户、团队甚至应用程序，不仅控制他们可以访问的数据，还允许他们共享查询及其查询结果。由于 Athena 是根据扫描的数据量收费的，因此在\
  \ Athena 中设置扫描限制对于帮助成本控制至关重要。\n\n# [结论](#\n\n\n\n\n\n在本章中，我们涵盖了 ML 工作流的第一个主要部分（这是我们在\
  \ `第 1 章，ML 工作流简介` 中学习过的内容）：数据准备阶段。ML 项目中最重要的部分是数据，首先我们需要确定数据源是什么，理解数据是如何生成的，以及需要如何对数据进行策展。然后，我们需要设计一种机制，将这些数据源取到一个集中存储库中，以便进行收集、处理和消费。我们了解到，可以使用\
  \ `Amazon S3 Data Lake` 并使用 AWS 原生支持的几种数据摄取机制来完成所有工作。通过代码示例的帮助，我们看到了如何设置数据湖、如何将数据摄取到数据湖中（这一过程被称为\
  \ `hydration`）、如何查询和查看这些数据，最后，在对数据集进行 ML 特征工程处理之前，如何进行一些处理。\n\n你可能会问接下来是什么？让我们进入时空隧道，在\
  \ `第 3 章，利用特征预测未来！` 中展望未来。\n\n## 要点回顾\n\n以下是本章学习内容的总结：\n\n*   在本章中，我们介绍了数据湖（Data\
  \ Lake）的概念、它的用途、如何设置它，以及如何让用户能够有效地与数据湖中的数据对象交互。\n\n*   数据湖是一个集中的数据存储库，允许你以原始格式存储数据：结构化、半结构化或非结构化数据。数据湖存储了来自组织各个方面的数据，并允许用户在读取时而非写入时对数据设置模式（schema），这意味着数据适用于所有团队的所有用户。这还允许你根据当前项目来形成数据结构，而不是尝试去猜测所需的模式。\n\
  \n*   数据湖还不受计算、内存或旧版磁盘的限制。由于不需要计算资源池和内存分配，你的数据湖可以根据需要无限增长，同时在数据不再被需要时提供归档运行的必要规则。\n\
  \n*   数据湖还提供了按用户、角色、项目或团队划分的功能性且相关的安全控制。访问、可见性和权限可以控制到数据的单个行级。\n\n*   最后，数据湖与旨在为存储的数据添加额外上下文信息的工具，以及允许查看数据可视性的工具集成了原生支持。\n\
  \n*   我们还介绍了一个场景，详细描述了一位经验丰富的数据库工程师被派遣创建数据湖并让其团队能够使用。在当前冲刺结束时，该数据库工程师能够关闭所有分配的任务（stories），尽管水星正在逆行（Mercury\
  \ being in retrograde），但他仍提供了所需的功能。\n\n## 单选题\n\n使用这些问题来挑战你对本章学习内容的掌握。\n\n1.  **数据湖（Data\
  \ Lake）和数据仓库（Data Warehouse）的区别是什么？**\n\n    1.  它们只是同一个概念的两个名称。\n    2.  数据湖以原始格式存储数据，而数据仓库存储处理和转换后的数据供直接消费。\n\
  \    3.  数据湖存储处理和转换后的数据，数据仓库以原始格式存储数据。\n    4.  数据湖为了报告目的存储数据，数据仓库存储数据以帮助业务处理。\n\
  \n2.  **将数据摄取到数据湖中是不可能的。**\n\n    1.  正确\n    2.  错误\n\n3.  **Amazon Athena 是用于将数据摄取到数据湖的服务。**\n\
  \n    1.  正确\n    2.  错误\n\n4.  **以下 AWS 服务中哪些不能用于摄取？**\n\n    1.  Amazon Polly\n\
  \    2.  Amazon Athena\n    3.  Lambda\n    4.  Kinesis\n\n5.  **ETL 代表什么？**\n\n\
  \    1.  Elegant, Transformative, Long\n    2.  Engines, Transformers, Losses\n\
  \    3.  Extract, Transform, Load\n\n## 答案\n\n1.  `b`\n2.  `b`\n3.  `a`\n4.  `a`\n\
  5.  `c`\n\n## 延伸阅读\n\n以下是关于如何创建数据湖的一些额外资源：\n\n*   构建数据湖解决方案：https://aws.amazon.com/solutions/data-lake-solution/\n\
  *   数据湖架构入门：https://aws.amazon.com/blogs/big-data/getting-started-data-lake-formation/\n\
  *   多账户数据访问与管理：https://aws.amazon.com/blogs/big-data/access-and-manage-data-multiple-accounts/\n\
  *   用于新冠肺炎分析的公共数据湖：https://aws.amazon.com/blogs/big-data/a-public-data-lake-analysis-of-covid-19/\n\
  *   使用 Amazon Athena 和 AWS Lake 对数据湖进行匿名化和管理：https://aws.amazon.com/blogs/big-data/anonymize-and-manage-data-data-lake-with-amazon-athena-and-aws-lake/\n\
  *   分析服务解析：从数据湖到机器学习：https://aws.amazon.com/blog/analytics-services-explained-data-lakes-to-machine-learning/\n\
  \n# 第 3 章](#toc.xhtml#c03)\n\n# 利用特征预测未来](#toc.xhtml#c03)\n\n# 引言](#toc.xhtml#s56a)\n\
  \n你相信星星吗？现在是时候相信它们了。根据这篇文章（[`www.livescience.com/12856-astrology-science-indian-court-ruling/`](https://www.livescience.com/12856-astrology-science-indian-court-ruling/)，发布于\
  \ 2011 年，作者于 2022 年访问），孟买高等法院判决占星学是一门科学。\n\n对于机器，有一个巨大的区别。为了理解这一点，让我们看看占星学的定义。它是根据出生日期和时间，利用恒星和行星随时间变化的相对位置来预测生活中未来事件的艺术和科学。创建一个显示出生时行星位置的图表，并根据这些天体在未来时间内的感知位置来推导出未来事件。因此，这里确实使用了过去的数据，但仅用于定义评估结构（类似于计算机中设计数据结构和算法）。在机器学习或\
  \ ML 中，数据的起源时间并不那么重要，重要的是历史数据的量。更重要的是，数据中单个属性与我们想要预测的内容之间的相关性。这些属性在 ML 中被称为 `Features`（特征）。\n\
  \n\n\n\n\n例如，假设你想预测明年的房价。为了训练一个执行此任务的机器学习（ML）模型，你需要历史数据，其属性包括：地理位置、房屋面积、卧室数量、房贷利率、贷款方案、附近的优质学校、购物便利性、是否带有游泳池等设施、建筑年份等。这些都是**输入特征**（input\
  \ features）。历史数据还将包含房价，这就是**目标特征**（target feature）。你用于训练模型的数据集（历史数据）包含了输入特征和目标特征。目标特征作为机器学习模型监督训练的标签（label）。模型将学习近似一个函数，以便根据数据中的输入特征来预测目标特征。训练完成后，你可以通过发送房屋特征（输入特征）的新输入值，使用模型来预测房价（目标特征）。\n\
  \n这就是为什么设计机器学习解决方案最重要的方面是**特征工程**（feature engineering），即从你的数据集中收集、采集和转换特征的技术。正如我们之前看到的，特征定义了机器学习模型的输入和输出，必须非常仔细地考虑它们，因为它们会直接影响模型预测的成功。在上一章中，你学习了如何使用\
  \ AWS 服务通过各种数据源的各种摄取机制来填充你的数据湖。你导入这些数据包含了我们训练机器学习模型所需的特征。在本章中，你将学习什么是特征、它们为什么重要、如何选择关键特征，以及数据收集、准备和使用的不同技术。我们将深入研究针对不同类型机器学习的特征工程技术，例如自然语言处理（NLP）、计算机视觉（CV）和表格数据（Tabular\
  \ data）。我们将通过运行 Python 代码示例来学习，这些示例将展示各种特征工程任务的操作过程，并理解这些技术的益处以及何时该使用它们。\n\n###\
  \ 结构\n\n在本章中，我们将深入探讨以下主题：\n\n* 特征工程简介\n* 针对 NLP 的特征工程\n* 针对计算机视觉的特征工程\n* 表数据的特征工程\n\
  \n### 目标\n\n在本章结束时，你应该非常熟悉为什么特征在机器学习中如此重要、特征工程的定义，以及如何在不同的机器学习用例中通过实际代码示例（如表格回归/分类、自然语言处理或\
  \ NLP，以及计算机视觉任务的目标检测）执行一些最常见的特征工程技术。\n\n### 技术要求\n\n在本章中我们将进行大量的实践操作，因此必须拥有 AWS\
  \ 账户。请遵循`第 2 章，填充你的数据湖`中“设置你的 AWS 账户”章节的说明来注册 AWS 账户。注册完成后，请使用 `https://docs.aws.amazon.com/IAM/latest/UserGuide/console.html`\
  \ 中的指令登录你的 AWS 账户。\n\n## 接入 SageMaker Studio\n\n接下来，你需要接入 SageMaker Studio 并打开你的\
  \ Studio 域名以开始。请遵循此文档（`https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html`）中的逐步说明；确保你没有漏掉任何步骤。\n\
  \n## 将仓库克隆到 SageMaker Studio\n\n登录后，最好查看这本书。按照以下步骤操作：\n\n1. 当你在 Studio 中时，你会看到启动器（Launcher）。从顶部菜单点击\
