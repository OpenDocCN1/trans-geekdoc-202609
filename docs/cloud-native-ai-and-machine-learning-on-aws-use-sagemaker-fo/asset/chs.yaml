  \n# 图像分类第二轮\n\n我们的数据科学家在处理完工单摘要解决方案后，想知道是否可以使用机器学习模型对图像进行分类。你明白，他们加入一个本地俱乐部，其他成员向中央共享存储库发布图像。这些图像本应该是各种类型的飞机。问题是，很大一部分上传的图像都是随机的其他事物。如果你能训练一个模型来预测数字和文本，你就能训练一个模型来观察图像并判断它是什么吗？\n\
  \n\n\n\n是的，你完全可以做到。为了实现这一点，我们将使用一个图像分类模型。代码的相关部分回顾如下，但与其他示例一样，你可以检查书籍 GitHub 仓库中的笔记本以获取完整代码：\n\
  \n```python\ntraining_image = sagemaker.image_uris.retrieve(\n    region=sess.boto_region_name,\
  \ framework=\"image-classification\"\n)\nprint(f'Container: {training_image}')\n\
  ```\n\n与之前一样，我们创建了一个 `training_image` 对象，该对象包含 Amazon SageMaker 管理的图像分类容器的地址。\n\n\
  我们还将使用 CalTech 101 数据集来训练模型。该数据集包含 101 类别的图像以及一些背景噪声。出于时间考虑，我们只对其中的几类分类进行训练，但并不阻止你花时间对所有分类进行训练：\n\
  \n```python\ns3 = boto3.client(\"s3\")\ns3.download_file(\n    \"sagemaker-sample-files\"\
  ,\n    \"datasets/image/caltech-101/101_ObjectCategories.tar.gz\",\n    \"ObjectCategories.tar.gz\"\
  ,\n)\n```\n\n我们还使用了公开的 `im2rec.py` 脚本将图像从默认格式转换为 `RecordIO` 格式。在这种情况下，`RecordIO`\
  \ 用于将图像数据和相关的元数据编码为流格式，这种格式对磁盘操作更加优化。如果让图像保持原始格式，将图像传输到训练实例可能会比 GPU 处理训练批的速度慢。使用\
  \ GPU 可能是昂贵的，因此花精力优化它们所需的时间是值得的，特别是当你使用分布式训练方法时：\n\n```bash\n!python im2rec.py --list\
  \ --recursive caltech-101-train caltech_101_train/ | sort\n```\n\n我们对图像和图像类别执行此操作。我们可以直接从文件夹名称本身推断，也可以保留一个单独的列表，以防文件夹名称包含我们不希望出现在预测中的字符（如下划线或数字）。\n\
  \n在这里，我们创建用于图像分类的估计器对象：\n\n```python\ns3_output_location = \"s3://{}/{}/output\"\
  .format(bucket, prefix)\nic_estimator = sagemaker.estimator.Estimator(\n    training_image,\n\
  \    role,\n    instance_count=1,\n    instance_type=\"ml.p3.2xlarge\",\n    volume_size=50,\n\
  \    max_run=360000,\n    input_mode=\"File\",\n    output_path=s3_output_location,\n\
  \    sagemaker_session=sess\n)\n```\n\n我们输入了训练镜像以及之前创建的 SageMaker IAM 角色。我们还确定了训练图像的数量和实例类型。在这种情况下，P3\
  \ 实例是合适的，因为我们需要利用 GPU 来训练图像分类模型。AWS 的 P3 实例拥有 NVIDIA V100 Tensor Core GPU，这意味着我们的训练将更快、更高效。我们还设置了适当的\
  \ EBS 卷大小（50 Gb），以便我们的整个图像库都能加载到镜像中。我们还设置了训练的最大超时时间（秒）、输入模式、我们希望模型在训练后保存的路径以及 SageMaker\
  \ 会话。\n\n现在我们可以设置模型的超参数了：\n\n```python\nic_estimator.set_hyperparameters(\n    num_layers=18,\n\
  \    use_pretrained_model=1,\n    image_shape=\"3,224,224\",\n    mini_batch_size=128,\n\
  \    epochs=2,\n    learning_rate=0.01,\n    top_k=2,\n    resize=256,\n    precision_dtype=\"\
  float32\",\n)\n```\n\n我们首先设置了神经网络的层数。我们设置了较少的层数以加速训练，但这个超参数对你的训练时间有显著影响，因此请花一点时间调整并查看准确率指标上的结果如何。我们还将将\
  \ `use_pretrained_model` 的值设置为 1，将我们神经网络模型的第一层设置为预训练状态。其他层将具有随机的初始权重，但第一层将是预设的。下一个超参数是\
  \ `image_shape`；它是层数以及图像高度和宽的组合。通道数被标准化为三个，但图像维度细节在所有输入图像中都是静态的，因此对图像进行预处理至关重要。\n\
  \n如果你的输入图像小于列出的维度，训练将失败。如果大，则你的图像将被裁剪到列出的维度。对于 `mini_batch_size`，这是每个 GPU 将处理的训练样本数。接下来，我们设置\
  \ epoch 数（轮数），即使用所有训练数据通过神经网络的次数。这是另一个调整可能会产生显著影响的超参数，请准备好在这里进行调优。\n\n接下来，我们设置 `learning_rate`（学习率），它是训练期间单个节点权重更新的程度。这通常可以设置为\
  \ 0.0 到 1.0 之间，该值控制了模型适应所提问题的速度。较低的值可能在学习理解训练数据之前需要更多的 epoch。你可能想设置一个非常高的学习率，但几率越高，模型收敛过快的风险就越大。同样，速率过低可能意味着你的模型永远无法学会理解数据。我们已经确定了其他在训练中调调用的超参数，但\
  \ `learning_rate` 可能是对你的训练时间和最终准确性影响最大的一个。\n\n下一个超参数在训练期间报告 `top_k`。在训练期间，模型会对分类进行多次猜测。`top_k`\
  \ 的设置值表示，如果分类位于前 k 个猜测中，则认为该分类为真。\n\n我们还设置了 `resize` 参数为图像最短侧的像素值。此值也应该设置为大于 `image_shape`\
  \ 值中高度和宽的值。\n\n最后一个是 `precision_dtype`，它是训练所用权重的精度。对于此算法，可以使用 float16 表示半精度或使用 float32\
  \ 表示全精度。在需要更低内存占用时，float16 可能很有用。\n\n最后，我们上传训练和验证数据，然后调用 `fit` 开始训练任务：\n\n```python\n\
  ic_estimator.fit(inputs=data_types, logs=True)\n```\n\n一旦训练任务完成，我们就可以部署并从搜索服务下载一些图像作为测试数据。\n\
  \n## 结论\n\n机器学习工作流通常可以分为三个部分：模型训练、模型注册和模型交付。每个部分都可以独立操作。本章专注于第一阶段：模型训练。将工作流的这些部分分开有一个关键目的，主要是因为它们应该分别迭代。在模型移动到实时生产环境后，训练阶段通常还会继续。你可以填满整个书架来涵盖目前所有任务的所有算法的所有各种训练方法。相反，我们选取了不同训练方法的小样本来激发你的兴趣。从这里开始，实验将通过不同的训练方法继续下去。\n\
  \n在本章中，我们扮演了一个想要扩展机器学习知识的数据科学家的角色。为了实现这一目标，他们利用现有知识为机器学习模型准备数据，然后使用 AWS 和 SageMaker\
  \ 提供的工具来训练、调优和评估他们的模型。他们研究了超参数的作用以及一些调优它们的方法，以实现机器学习所需的目标。最后，他们将训练好的模型进行了部署，并对它们运行测试推理。\n\
  \n在下一章中，我们将留下我们的数据科学家，确信他们已经朝着目标迈出了重要的一步。\n\n\n\n\n在`第 7 章，让 George 接管]`中，我们将介绍自动化机器学习项目中特征工程、模型训练和模型测试阶段的不同方法。最重要的是，我们将探讨在何时使用自动化方法在战术上是有优势的，以及何时亲自进行迭代会更好。\n\
