  \n# 使用 Amazon Comprehend 获取洞察\n\nAmazon Comprehend 是一项带有预训练模型的 NLP 服务，提供多种基于文本的洞察。我们将使用\
  \ Comprehend 的几个实时 API 来展示你如何轻松地构建可以生成这些洞察的应用程序。要开始，请导航到笔记本中的 Amazon Comprehend\
  \ 部分并执行以下指令以尝试 API 调用。\n\n1. 执行第一个单元格，以获取我们在处理 Amazon Transcribe 工作时生成的转录文件名称。我们将看到\
  \ Comprehend 能帮助从该转录文件中推导出哪些洞察：\n\n```python\n# 对于 Comprehend，我们将获取 Transcript 输出并查看从这段文本中可以获得什么洞察\n\
  transcript = 'output-transcripts/'+job+'.txt'\nprint(transcript)\n```\n\n2. 我们将读取此转录文件并将内容存储在变量中以便引用：\n\
  \n```python\n# 将转录的内容读入文本中\nwith open(transcript, 'r') as comp_in:\nin_text = comp_in.read().split(',')\n\
  # 让我们从句子列表中重构完整文本\nfull_text = ''\nfor text in in_text:\nfull_text += text+'. '\n\
  ```\n\n3. 我们将尝试的第一个 API 是 `boto3` Python SDK 版本的 Comprehend `detect_entities` (`https://docs.aws.amazon.com/comprehend/latest/dg/API_DetectEntities.html`)，它可以识别文本中人物、地点和事物的唯一引用，而无需任何类型的\
  \ ML 训练。执行下一个单元格调用此 API。\n\n```python\ncomp_res = comprehend.detect_entities(Text=full_text,\
  \ LanguageCode='en')\nfor entity in comp_res['Entities']:\nprint(\"Comprehend is\
  \ \"+str(round(entity['Score']*100,0))+\"% confident that \"+entity['Text']+\" is\
  \ an entity of type \"+entity['Type']+\" \")\n```\n\n4. 我们将看到打印出的结果。再次，这里只显示了前几个实体，但笔记本中拥有\
  \ Comprehend 检测到的完整列表：\n\n```text\nComprehend is 100.0% confident that Platinum\
  \ Motors is an entity of type ORGANIZATION\nComprehend is 77.0% confident that Northwest\
  \ Home is an entity of type ORGANIZATION\nComprehend is 100.0% confident that Michelle\
  \ is an entity of type PERSON\nComprehend is 99.0% confident that today is an entity\
  \ of type DATE\nComprehend is 100.0% confident that Michelle is an entity of type\
  \ PERSON\nComprehend is 100.0% confident that Jack is an entity of type PERSON\n\
  ```\n\n5. 我们将尝试的下一个 API 是 `detect_key_phrases`，它是文本中对于揭示句子含义的关键词汇集合。执行下一个单元格并查看输出：\n\
  \n```python\n# 读取并打印关键短语\ncomp_res = comprehend.detect_key_phrases(Text=full_text,\
  \ LanguageCode='en')\nfor phrase in comp_res['KeyPhrases']:\nprint(\"Comprehend\
  \ is \"+str(round(phrase['Score']*100,0))+\"% confident that \"+phrase['Text']+\"\
  \ is a key phrase\")\n```\n\n6. 我们将看到以下输出：\n\n```text\nComprehend is 99.0% confident\
  \ that about two weeks is a key phrase\nComprehend is 100.0% confident that a car\
  \ is a key phrase\nComprehend is 100.0% confident that your dealership is a key\
  \ phrase\n```\n\n7. 接下来，我们将查看如何使用 Comprehend API 来检测文本中的情感。执行下一个单元格并查看其输出：\n\n```python\n\
  sent_text = 'Also if you wanted to wait for the two days we could also have a rental\
