  \ 36 个模型。\n\n为了对你的所有 36 个模型进行推理，你需要为每个模型创建一个推理端点，这意味着你需要为每个端点支付计算费用。相反，你可以将所有 36\
  \ 个模型托管在一个单一端点之后，并在推理时指定请求的目标模型。\n\n你添加到此端点的模型都应该包含在 s3 位置中。每个模型构文件将被添加到端点，并从你在\
  \ `Image` 参数中指定的容器进行托管。如果你需要托管一个具有独立容器模型的多模态端点，其规范如下：\n\n一旦定义了模型，你就可以创建多模型端点配置并部署模型：\n\
  \n你发送到端点的请求应该包含 `Target-Variant-Name` 请求头，以指定使用哪个模型。\n\n## 记忆点\n随着你对机器学习用量的增加，你很可能会达到一个点，即某个工作负载需要多个机器学习模型。在某些情况下，一个模型可能会调用另一个模型来进一步完善预测所需的数据，或者训练好的模型需要在无法泛化到所有数据的特定子集上进行训练。例如，你拥有一个包含印度\
  \ 28 个州和 8 个联邦直辖区历史指标的数据集。你的模型需要能够对特定州或联邦直辖地区的用户进行预测。为了将准确率提高到满足业务需求的水平，你按照邦和联邦直辖地区拆分了训练数据。结果是每个邦和联邦直辖地区都有一个独特的模型，总共产生\
  \ 36 个模型。\n\n为了对你的所有 36 个模型进行推理，你需要为每个模型创建一个推理端点，这意味着你需要为每个端点支付计算费用。相反，你可以将所有 36\
  \ 个模型托管在一个单一端点之后，并在推理时指定请求的目标模型。\n\n## 选择题\n使用这些问题来挑战你对部署机器学习的知识。\n\n1. **以下哪不是\
  \ SageMaker 中机器学习模型可用的部署选项？**\n   - 实时（Real-time）\n   - 定期（Part-time）\n   - 批量（Batch）\n\
  \   - 异步（Asynchronous）\n\n2. **可以利用哪个 Amazon SageMaker 功能获取端点配置的建议？**\n   - SageMaker\
  \ Compute Recommender\n   - SageMaker Cost Optimizer\n   - SageMaker Inference Recommender\n\
  \   - SageMaker Endpoint Confabulator\n\n3. **一旦机器学习模型部署到生产环境，你如何扩展与其相关的计算资源？**\n\
  \   - SageMaker 会自动为你完成\n   - 应用自动伸缩（Application Auto Scaling）\n   - 应用右规格化（Application\
  \ Rightizing）\n   - SageMaker 负载均衡器\n\n4. **对于可以在 Amazon SageMaker 托管的模型，以下哪项最准确？**\n\
  \   - 编译后的模型\n   - 回归模型\n   - 任何可以在 Graviton 上运行的模型\n   - 任何符合文档说明容器规范的模型\n\n5.\
  \ **哪个服务允许将模型部署到边缘设备？**\n   - Amazon SageMaker Model Registry\n   - Amazon SageMaker\
  \ Edge Pusher\n\n\n\n\n\n### 3. Amazon SageMaker Cog Master\n### 4. Amazon SageMaker\
  \ Edge Manager\n\n## 答案\n\n1. **b**\n2. **c**\n3. **b**\n4. **d**\n5. **d**\n\n\
  ## 延伸阅读\n\n以下是本章介绍主题的精选阅读材料，也是继续你学习之旅的资源：\n\n* *使用边缘设备进行机器学习运维*：https://aws.amazon.com/blogs/machine-learning/mlops-at-the-edge-with-amazon-sagemaker-edge-manager-and-aws-iot-greengrass/\n\
  * *使用 Yolo5 扩展推理*：https://aws.amazon.com/blogs/machine-learning/scale-yolov5-inference-with-amazon-sagemaker-endpoints-and-aws-lambda/\n\
  * *加速 Hugging Face Transformers*: [`huggingface.co/blog/bert-inferentia-sagemaker`](https://huggingface.co/blog/bert-inferentia-sagemaker)\n\
  * *微调和部署自托管脚本*：https://aws.amazon.com/blogs/machine-learning/fine-tune-and-deploy-a-summarizer-model-using-the-hugging-face-amazon-sagemaker-containers-bringing-your-own-script/\n\
  * *精选 SageMaker 示例*：https://github.com/aws/amazon-sagemaker-examples\n* *理解如何利用实验（Experiments）和流水（Pipelines)*：https://aws.amazon.com/blogs/machine-learning/organize-your-machine-learning-journey-with-amazon-sagemaker-experiments-and-amazon-sagemaker-pipelines/\n\
  \n# 第 9 章\n# 弹性推理的大规模智慧\n\n### 引言\n\nSageMaker 这个 AWS AI/ML 服务的名字很酷，你觉得吗？根据作者的说法，没有比这更贴切的名字了。它的字面意思是“制造智者的服务”，我们可以将其表述为“能够实现智慧创造与交付的服务”。在实际操作中，我们可以假设\
  \ SageMaker 将帮助我们创建模型（即“智者”），它们具备检测和预测新信息（即“智慧”）的能力。“Maker”（制造者）一词表明模型（“智者”）必须经过训练（“制造”），而该服务使我们能够以标准化、易用的方式来实现。正如我们在前面的章节中讨论过的，Amazon\
  \ SageMaker (https://aws.amazon.com/sagemaker/) 是一种托管 AWS 服务，提供端到端的能力来大规模构建和运行机器学习模型。SageMaker\
  \ 提供了许多广泛且深层次的功能，以满足跨领域、用例和行业的机器学习工作流的各个方面。如果你记得我们在 第 1 章，介绍机器学习工作流 中学的内容，以及其他涵盖工作流某些特定方面的章节，你会发现\
  \ SageMaker 消除了与传统极其复杂的任务相关的猜测和艰苦工作，包括数据预处理、特征工程、算法选择、模型训练、推理和部署。\n\n在本书的 第 3 章，通过特征预测未来；第\
  \ 4 章，编排数据连续体;第 5 章，撒下更大的网;第 6 章，迭代产生智能 以及 第 7 章，让 George 接管 中，我们学习了如何使用 Amazon\
  \ SageMaker notebook 执行特征工程和特征选择，以及如何使用 AWS Glue ETL 构建数据编排流水线。我们还回顾了选择算法和神经网络架构的常用方法和最佳实践，使用\
  \ SageMaker 训练训练并调优了机器学习模型，熟悉了使用 SageMaker Canvas 和 AutoGluon 等低代码、无代码机器学习选项，并学习了通过\
  \ SageMaker 模型部署将训练好的模型准备好进行推理的各种选项。在本章中，我们将专门关注为实时预测设置企业级推理端点，以及用于非实时异步预测的批量转换选项。我们将学习如何从训练好的模型创建模型包，使用\
  \ SageMaker 构建实时推理端点，运行批量推理，并使用专用功能 AWS Elastic Inference 以及自定义芯片 AWS Inferentia。\n\
  \n### 结构\n\n在本章中，我们将深入探讨以下主题：\n\n* 理解 SageMaker ML 推理选项\n* 使用实时端点运行推理\n* 使用无服务器端点运行推理\n\
  * 使用批量转换（Batch Transform）运行推理\n* 使用 SageMaker 弹性推理运行推理\n\n### 目标\n\n在本章中，我们将讨论机器学习推理并理解其重要性。我们将学习可以使用\
  \ SageMaker 托管的实时和批量推理的不同类型的推理选项。随后，我们将学习弹性推理（Elastic Inference），这是一种机器学习推理的加速实例。最后，我们将执行代码示例来准备、训练模型，并尝试\
  \ SageMaker 支持的一些推理选项。\n\n## 理解 SageMaker ML 推理选项\n\n就像智慧可以瞬间传授，也可以作为一个随时间推移而成熟的过程的结果一样，SageMaker\
  \ 为你提供了几种选项来部署模型以支持推理请求。请考虑下面的图片，它展示了托管和运行模型推理的各种方式。如你所示，根据你的业务问题、需求、让应用程序或用户访问模型的方式，以及你可能面临成本或容量限制，你可以相应地配置\
  \ SageMaker 来支持你的模型。我们将在本节中深入探讨这些选项。参见图 9.1：\n\n图 9.1\n\n**图 9.1:** SageMaker 托管推理选项\n\
  \n除了这些选项外，SageMaker 还提供了专用加速器来帮助提高模型性能效率，例如 SageMaker 弹性推理 (https://docs.aws.amazon.com/sagemaker/latest/dg/ei.html)\
  \ 和 AWS Inferentia 芯片 (https://aws.amazon.com/machine-learning/inferentia/)。我们将在本章中学习这些加速器，以及如何根据你的机器学习需求使用它们的代码示例。但首先，让我们回顾各种推理选项的含义、我们为什么需要它们以及如何使用它们。模型最大的用途是其检测有用信息和预测未来事件的能力。模型的检测和预测能力是在推理阶段实现的，在训练完成并部署或托管之后。在\
  \ SageMaker 中，模型托管于执行 `CreateModel` API (https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateModel.html)，它需要模型和算法依赖的\
  \ Docker 容器镜像以及训练好的模型文件以创建一个可用的模型版本。模型创建后，它可以托管在称为端点的计算资源上，并通过请求消息进行调用以接收预测输出。这一功能被称为运行推理或进行预测。在本节中，我们将讨论模型创建和托管期间可用的选项，因为输入会根据所选的托管配置选项而异。\n\
  \n\n\n顾如名，实时端点（real-time endpoints）为运行模型推理提供了请求/响应范式的交互，请求者需要等待收到响应。回想我们在`第 5 章，投入更深的网络？`中的`图\
  \ 5.2 (#c05.xhtml#fig5_2)：确定性算法示例`中回顾过的 ATM 取款流程。假设你有一个类似的流程的移动银行应用程序，通过它发送了检查余额的请求。在收到该操作的响应之前，移动应用程序将保持该页面并不允许你执行新操作。这是请求/响应的一个基本示例。另一个例子是登录银行应用程序。当你的应用根据你输入的凭据发出登录请求时，在收到响应之前，它的进程线程无法执行任何其他操作。还有许多此类示例，例如在\
  \ Amazon.com 上结账并点击 `Submit` 时，请求页面会等待订单提交并收到确认。类似地，当你设置 SageMaker 实时端点时，你提交一个推理请求，并等待收到端点的响应后才继续执行下一行代码。实时端点非常适用于低延迟、高吞吐的推理需求，例如银行交易的欺诈检测、股票价格预测、飞机自动驾驶课程修正以及安全系统的实时威胁检测。请参考`[表\
  \ 9.1]`：\n\n| **使用的 API** | **选项参数** | **选项值类型** |\n| --- | --- | --- |\n| CreateModel\
  \ | PrimaryContainer | ImageModelDataUrl |\n| CreateEndpointConfig | ProductionVariants\
  \ | InstanceTypeInitialInstanceCount |\n| CreateEndpoint | EndpointNameEndpointConfigName\
  \ | | |\n\n**表 9.1：** 用于单模型、单容器端点的 SageMaker 托管选项\n\n在单模型、单容器选项中，我们使用单一推理容器来托管单个模型，该容器包含了模型以创建可调用模型的所有依赖项。我们在\
  \ `CreateModel` API 中使用 `PrimaryContainer` 指定推理容器。然后，通过创建端点配置来托管该模型，该配置指定了 SageMaker\
  \ ML 实例类型、初始实例数量以及用于运行 `CreateModel` API 的模型名称。最后，我们执行 `CreateEndpoint` API 指令 SageMaker\
  \ 准备一个新计算实例、启动它、在该实例上部署容器镜像、加载模型制品，并创建一个能够接受推理请求并返回预测的可调用版本。所有这些重量工作都由 SageMaker\
  \ 在幕后完成，为您节省了时间和金钱。\n\n# 用于多模型单容器的 SageMaker 实时端点 (#toc.xhtml#s206a)\n\n通常称为多模型端点（Multi-Model\
  \ endpoints），这种托管选项提供了使用单个端点实时托管多个模型的能力，为应用程序提供了多维度提供请求的灵活性（例如，每个维度一个模型；如果你有预测全美房价的用例，你可以为每个城市训练单独的模型，并将它们都托管在多模型端点中），同时节省托管成本。诀窍是向\
  \ `CreateModel` API 提供一个包含多个模型制品的文件夹（每个模型都有自己的文件夹）的 Amazon S3 URI 路径，但你需要确保你用于推理的容器镜像包含了托管所有你想要通过该端点进行推理的模型所需的全部全部依赖项和代码。通过多模型端点，你可以在单个端点中托管\
  \ 1000 多个模型。请参考下表获取多模型单容器托管选项需要填充的参数。\n\n| **使用的 API** | **选项参数** | **选项值类型** |\n\
  | --- | --- | --- |\n| `CreateModel` | Containers - 指定单个容器对象 | - Image<br>- ModelDataUrl\
  \ - 指定包含多个模型制品的 S3 文件夹<br>- Mode - 'MultiModel' |\n| `CreateEndpointConfig` | `ProductionVariants`\
  \ | - InstanceType<br>- InitialInstanceCount - 至少指定两个实例 |\n| `CreateEndpoint` |\
  \ `EndpointName`EndpointConfigName` | |\n\n**表 9.2：** 用于多模型单容器端点的 SageMaker 托管选项\n\
  \n与为每个每个模型创建单独的端点相比，多模型端点在节省成本方面表现非常好。然而，使用特定模型制品的决策发生在运行时，即端点接收到推理请求时；因此，与每个模型的专用端点相比，你会看到更高的响应延迟。好消息是，SageMaker\
  \ 会根据传入的流量以及高峰和低峰期间观察到的扩展模式，处理跨模型的端点资源的内存管理。\n\n# 用于多模型多容器的 SageMaker 实时端点 (#toc.xhtml#s207a)\n\
  \n多模型端点的一种高级配置是指定多个容器，即多容器端点（multi-container endpoints）。这消除了单容器多模型端点的限制，即所有模型必须使用相同的\
  \ ML 框架（如 MXNet、TensorFlow 或 PyTorch）或算法族（如 XGBoost 或 Linear Learner）。有关多模型（单容器）端点支持的所有算法和框架列表，请参考\
  \ `https://docs.aws.amazon.com/sagemaker/latest/dg/multi-model-endpoints.html#multi-model-support`。\n\
  \n多容器端点在创建时支持提供多个容器镜像（最多 15 个容器），并为处理请求的各种模型提供多个模型制品。通过提供使用单独容器镜像的灵活性，你现在可以创建一个自动提供不同框架和算法族模型的单一端点，实现企业级框架的部署。请参考`表\
  \ 9.3]`：\n\n| **使用的 API** | **选项参数** | **选项值类型** |\n| --- | --- | --- |\n| `CreateModel`\
  \ | Containers - 指定多个容器对象，每个镜像对应一个容器。镜像应预先构建好模型依赖项和模型制品。 | - Image<br>- ContainerHostName\
  \ |\n| `CreateModel` | `InferenceExecutionConfig` | Mode |\n| `CreateEndpointConfig`\
  \ | `ProductionVariants` | InstanceTypeInitialInstanceCount - 至少指定两个实例 |\n| `CreateEndpoint`\
  \ | `EndpointNameEndpointConfigName` | |\n\n**表 9.3：** 用于多容器端点的 SageMaker 托管选项\n\
  \n如你从上表所示，多模型和多容器选项之间的主要区别在于如何配置 `CreateModel` API 的参数。在此选项中，你指定了一个包含多个唯一容器镜像的 `Containers`\
  \ 字典列表，每个镜像对应由该端点服务的其中一个模型。你还为容器指定了主机名，用于在推理时引用特定的容器。你不需要为模型制品指定 S3 URI，因为预期是在预先构建容器时已包含了训练好的模型。你还需要指定一个名为\
  \ `InferenceExecutionConfig` 的额外参数，其 `Mode` 可以是 `Direct` 或 `Serial`。`Direct` 表示在推理时，调用端点时将引用特定的容器；`Serial`\
  \ 则指按顺序执行每个容器，就像在推理流水线一样。\n\n# SageMaker 异步推理端点\n\n\n\n\n到目前为止，我们已经学习了如何在 SageMaker\
  \ 上为模型运行实时请求/响应范式。现在，我们将学习如何运行异步](https://aws.amazon.com/about-aws/whats-new/2021/08/amazon-sagemaker-new-inference/)近实时推理。注意，异步并不意味着批处理（batch\
  \ inference），我们将在后续章节中介绍，但它更适用于不需要即时低延迟且请求者无需等待响应的场景。SageMaker 将队列推理请求并进行处理，同时使用\
  \ Amazon Simple Service 或 SNS](https://aws.amazon.com/sns/) 通知请求者请求是成功还是报错。结果将发送到请求时指定的\
  \ Amazon S3 桶中。请参考表 9.4：\n\n| 使用的 API | 参数选项 | 选项值类型 |\n| --- | --- | --- |\n| `CreateModel`\
  \ | `PrimaryContainer` | |\n| | Image | |\n| | ModelDataUrl | |\n| `CreateEndpointConfig`\
  \ | `ProductionVariants` | |\n| | InstanceType | |\n| | InitialInstanceCount | |\n\
  | `CreateEndpointConfig` | `AsyncInferenceConfig` | |\n| | S3OutputPath | |\n| |\
  \ NotificationConfig | |\n| `CreateEndpoint` | `EndpointName`, `EndpointConfigName`\
  \ | |\n\n**表 9.4：异步端点的 SageMaker 托管选项**\n\n异步托管情况下，`CreateModel` 的配置与创建单模型、单容器实时端点相同。区别在于如何指定\
  \ `CreateEndpointConfig`。在创建端点配置时，添加一个名为 `AsyncInferenceConfig` 的新选项，并提供存储推理输出的\
  \ Amazon S3 桶和前缀。你还需要指定一个包含成功和错误消息的 `NotificationConfig` 对象。异步托管支持更大的请求大小（高达 1GB），并可以处理长达\
  \ 15 分钟的持续时间。理想情况下，你应该使用 AWS Lambda 函数在接收到请求完成的 SNS 通知时触发。SNS 通知将包含输入和输出参数，以便你成功映射哪些响应对应哪些请求。如果你不想采用批处理模式，但可以等待一会儿来接收推理请求，并且需要处理更大的消息，那么异步托管选项最适合你的需求。\n\
  \n# 无服务器推理的 SageMaker 端点\n\n能够为实时和近实时推理请求配置托管端点是非常棒的，你可以通过提供初始实例数量来指定扩展的程度。但如果你不知道需要什么类型的实例，或者你受成本限制无法为单个初始实例付费怎么办？虽然你可以为异步端点指定零的实例数量，但假设你不需要处理大消息大小或长时间运行，并且仍然想节省推理成本。在实时和近实时端点中，你会在实例运行期间持续产生费用，而不仅仅是在提供服务时。因此，你一启动这些端点，无论在使用都会付费。为了节省端点基础设施成本，可以使用无服务器推理](https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html)。通过\
  \ SageMaker 无服务器推理，你可以停止担心配置和管理实例数量、自动伸缩策略和运行时间，因为你只在实例提供服务时收费，而不是在运行时收费。这有助于为 ML\
  \ 推理实现真正的按需付费模型。请参考表 9.5：\n\n| 使用的 API | 参数选项 | 选项值类型 |\n| --- | --- | --- |\n|\
  \ `CreateModel` | Containers - 指定单个容器对象 | `Image`, `ModelDataUrl`, `Mode - 'SingleModel'`\
  \ |\n| `CreateEndpointConfig` | ProductionVariants -ServerlessConfig | `MemorySizeInMB`,\
  \ `MaxConcurrency` |\n| `CreateEndpoint` | `EndpointName`, `EndpointConfigName`\
  \ | |\n\n**表 9.5：无服务器端点的 SageMaker 托管选项**\n\n对于无服务器推理，我们在使用 `CreateModel` API 创建模型时，会指定一个单容器对象，包含容器镜像、存储模型产物的\
  \ Amazon S3 位置（我们也可以使用 SageMaker Model Registry 并提供 `ModelPackageName`），并将 `Mode`\
  \ 设置为 `SingleModel`。我们还需要为 `CreateEndpointConfig` API 调用提供一个 `ServerlessConfig`\
  \ 输入，为我们的无服务器计算指定 `MemorySize` 以及它应该处理的最大并发请求数。`CreateEndpoint` 保持不变。这就是我们如何使用 SageMaker\
  \ 托管设置无服务器推理。\n\n# 批处理的 SageMaker 转换器\n\n如果我们的需求是对大型输入数据集进行推理处理，我们的首选方案是 SageMaker\
  \ Batch Transform](https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html)。例如，假设你公司的领导层想根据历史通话转录评估呼叫中心人员的整体性能。你训练一个文本分类模型，可以预测人员是否成功帮助了客户。你根据转录中的关键词训练模型，并迭代训练以评估其表现好坏。你现在需要针对通话转录运行该模型，但无法使用实时或异步端点，因为那样会太耗时且成本过高。这就是批推理选项可以帮助你的地方。SageMaker\
  \ Transform 抽象了与基础设施配置和批作业管理相关的复杂工作，并便于设置和运行批推理。请参考表 9.6：\n\n| 使用的 API | 参数选项 |\
  \ 选项值类型 |\n| --- | --- | --- |\n| `CreateModel` | `PrimaryContainer` | `Image`,\
  \ `ModelDataUrl` |\n| `CreateTransformJob` | `BatchStrategy` | `‘MultiRecord’` |\n\
