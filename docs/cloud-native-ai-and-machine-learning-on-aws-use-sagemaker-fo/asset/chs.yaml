  \ ML 训练 |\n| IT 运维优化 | | DevOps Guru | 使用 ML 优化运维并提高应用可用性的运维工具 |\n\n**表 1.5:** 用于常见\
  \ ML 用例的 AWS AI 服务**\n\n\n\n\n正如你所看到的，在每个 AWS AI/ML 服务中，我们有很多选择和深度功能来帮助我们完成 ML 之旅。开始时可能看起来无从下手，但好消息是，你不需要了解所有的服务就可以构建你的\
  \ ML 解决方案。你只需要知道在什么时候选择什么，并针对特定项目深入研究你选择的服务和功能。我们希望帮助你具备做出决定的能力，将在本章的下一节中介绍这一点。\n\
  \n## 导航 ML 工作流\n\n在本节中，我们将教你如何为 ML 解决方案设计做准备。考虑到 AI/ML 领域的广阔、它能够解决的不断增长的需求需求列表，以及我们在设计和开发解决方案时拥有的无数选择，当我们开始尝试将整个过程组织成流程时，这可能会让人感到压力巨大。ML\
  \ 工作流的设计正是为此提供帮助的。但即使有工作流的指导，例如，你该如何决定是为你的 NLP 任务使用 `Amazon Comprehend` 还是使用 `Amazon\
  \ SageMaker Blazing Text` 算法？对于时间序列预测，我们有哪些选项，我们如何选择其中一个而不是另一个？在本节中，我们将选取两个最流行的\
  \ ML 用例（时间序列和 NLP），并向你展示如何引导它们走向解决方案过程。这是基于作者自己的经验，并在多年来帮助许多客户采用 AWS AI/ML 解决方案的过程中总结的。为了增加趣味性，我们将使用\
  \ `Decision Tree`（决策树）算法对这次练习进行建模。尽管将其转换为表格数据集并训练你自己的模型来自动预测导航路径！！\n\n## 场景 1 –\
  \ 时间序列预测\n\n在这种场景中，一旦我们确认了业务需求，首先需要检查是否存在历史数据，因为这是一个时间序列问题。如果没有历史数据集，这个用例就无从谈起。然后我们检查它是否是一项常见需求（确实如此），并讨论团队希望如何继续进行。如果目标是节省时间，我们就选择\
  \ `Amazon Forecast AutoML`；如果我们想使用通用解决方案但尝试自己尝试算法，我们就选择 `Amazon Forecast` 中的“选择算法”（`https://docs.aws.amazon.com/forecast/latest/dg/aws-forecast-choosing-recipes.html`）选项。另一方面，如果团队不想使用通用解决方案并想自己进行训练，我们就遵循\
  \ `SageMaker` 导航路径。它将引导我们完成之前讨论过的 ML 工作流中的步骤。这两个选项都在下图中所示：\n\n![](img/Figure-1.14.jpg)\n\
  \n**图 1.14：** 时间序列预测的导航路径\n\n## 场景 2 – 情感检测\n\n对于这种场景，我们意识到这是一个文本数据集，因此我们认为这是一个自然语言处理（NLP）问题。之前一样，我们首先检查它是否是一项常见需求（确实如此），并讨论继续前进的选项。如果目标是节省时间和成本，我们就选择\
  \ `Amazon Comprehend Detect Sentiment`（`https://docs.aws.amazon.com/comprehend/latest/dg/API_DetectSentiment.html`），这是一个带有预训练模型的开箱型\
  \ API。我们只需要在我们的应用程序中包含该 API 调用用即可。如果客户团队想要运行自己的训练，但接受使用通用解决方案，他们可以在 `Amazon Comprehend`\
  \ 中训练自定义分类器。如果团队希望在模型训练期间具有更大的灵活性，他们可以采用 `SageMaker` 和 `BlazingText` 内置算法（`https://docs.aws.amazon.com/sagemaker/latest/dg/blazingtext.html`）的路线。为了启用主动学习，我们可以选择使用\
  \ `Amazon A2I` 配置人工工作流来审查模型预测并进行更新，这些可以反馈以使用更新后的数据重新训练模型。这些选项如下所示：\n\n![](img/Figure-15.jpg)\n\
  \n**图 15：** 情感检测的导航路径\n\n随着时间的增长，你将能够在这些导航路径融入你的思考中。记住，AI/ML 领域正在迅速演变，所以你需要保持更新；这本书是这一方向的第一步。\n\
  \n## 结论\n\n我知道你正渴望在 AWS 上动手操作 AI/ML 并构建一些酷的解决方案。但就像任何学术教育一样，在开始实践之前，你需要学习一些理论。本章的重点是关于\
  \ ML 工作流，因为这就是本书的核心：如何在云中构建端到端的 ML 解决方案。在下一章中，我们将处理 ML 工作流的第一阶段，以及关于代码片段、如何构建 `Amazon\
  \ S3` 数据湖以及通过从各种源摄入数据来填充内容。现在是时候接触 ML 开发了。系好你的安全带！\n\n## 需要记住的观点\n\n以下是本章关键要点的总结：\n\
