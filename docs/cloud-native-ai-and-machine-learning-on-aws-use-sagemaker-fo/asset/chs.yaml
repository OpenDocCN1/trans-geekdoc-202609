  \ 章\n\n# 操作化模型组装（MLOps 与最佳实践）\n\n### 引言\n\n恭喜，你现在是关于如何使用 AWS 为你的用例应用人工智能、机器学习的专家。这意味着你已经准备好完成端到端\
  \ ML 旅程的最后一步：操作化。除了是一个很长的拼字游戏获胜单词外，它是手动解决方案与自动化良好架构工作负载之间的区别。实现机器学习运营（通称为 MLOps）为你的项目生产环境部署做好准备，同时实施持续集成（CI）和持续交付（CD）流水线。这加速了你持续的实验和上市周期，并赋能了数据科学团队的贡献。要尝试本节中的示例，请参考\
  \ *第 1 章，介绍 ML 工作流* 中的*技术要求*部分，了解登录 AWS 控制台、加入 SageMaker Studio 的步骤以及将仓库克隆到 SageMaker\
  \ Studio 的开始。点击与此章节对应的文件夹。如果你看到多个笔记本，章节标题对应笔记本名称以便于识别。你也可以通过书中提供的 GitHub 仓库被动地跟踪代码示例。\n\
  \n### 章节场景\n\n负责实现各种机器学习模型的团队决定采用站点可靠性工程（SRE）。这意味着团队成员将轮流担任运维工程师，协助更大的生产运营团队在软件交付周期环境中部署他们的模型。这种方法特别有效，因为没有人比创建模型的团队更了解生产模型所需的细微细节。我们的数据科学家转\
  \ SRE 没有多少运营经验，但他们得到了强大且丰富的生产运营团队的支持，因此他们有信心为模型实现自动化、重复且可见的工作流。\n\n### 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n*   什么是机器学习运营（通常称为 MLOps）？\n*   在 MLOps 方面，编排器的作用是什么？\n*   AWS 中常见的编排器有哪些？\n*\
  \   MLOps 过程的各个阶段。\n*   如何实现 Amazon SageMaker Pipeline\n*   如何使机器学习工作流良好良好（Well-Architected）。\n\
  \n### 目标\n\n\n\n在本章中，我们将使用 Amazon SageMaker 流水线和 AWS Step Functions Data Science\
  \ SDK 来构建端到端的 MLOps 流水线。在此过程中，我们还将学习机器学习工作流的最佳实践。我们将涵盖机器学习解决方案流水线的关键阶段，从迭代模型训练开始，转向模型评估、构制品管理以及\
  \ SDLC（软件开发生命周期）部署。我们将重点关注每个阶段的实现、管理、观察和可变性方法，并探讨如何确保遥测数据能够被你的数据科学团队和运维团队共同摄取。在本章结束时，你应该已经理解了机器学习任务的实验阶段应如何转换为自动化实现，以及如何解耦“训练到部署”的机制，以实现可重复性和扩展性。\n\
  \n## MLOps 定义\n\n不言而喻，机器学习领域正在飞速发展。这一过程的一部分是与该技术相关的流程、工具和服务的日益成熟。在之前的章节中，我们回顾了许多工具的现代化工作，这些工具能够实现与机器学习项目相关的高效实验、训练、部署和方案制定。对于这些项目的运营化（operationalization）也是如此。当我们使用“运营化”一词时，我们的意思是对手动过程添加自动化、控制和可见性。这种方法使得在没有人工干预的情况下，能够协调你所选的可部署包通过各个环境并进行生产部署，从而实现过程的重复。\n\
  \n机器学习运营（MLOps）正是这种实践。虽然有许多工具可以为你管理、自动化和编排这一过程，但在选择使用其中某一个之前，你应该了解各个阶段、它们的独特需求、机器学习区别于传统交付流程的方式，以及不同的监控需求。\n\
  \n为了实现流程中所需的自动化，我们可以将从原始数据到生产环境中创建已训练模型部署的步骤分解为五个不同的阶段。\n\n### 数据转换\n第一步是数据转换，需要将原始数据源转换为有效训练机器学习模型所需的格式。此阶段与其他阶段分开，是因为其具备适应、执行和监控的能力，使得在需要于流水线中其他所有阶段之外的更改时，能够保持灵活性。我们还将转换后的数据视为一个版本化的单元，并将其作为下一阶段的输入。\n\
  \n### 模型训练\n第二个阶段是机器学习模型的实际训练。与所有其他阶段一样，它接收上一个阶段的输出。在这种情况下，我们检索转换后的数据并开始训练模型；当我们获得一个可以存储的模型构制品时，训练即完成。与数据一样，我们对生成的模型进行版本控制以供下一阶段使用。\n\
  \n### 模型评估\n第三个阶段是对模型进行评估。这要求我们部署模型并使用模型从未见过的数据来确定其对于解决我们规定的业务结果的适用性。这可能包括准确率、损失、响应时间、构制品大小、`RMSE`\
  \ 或类似的指标。这些指标可以是静态的（要求你的模型在保存之前通过指定的数值），也可以是动态的（要求你的候选模型性能优于已部署到生产的模型）。\n\n### 模型存储管理\n\
  第四个阶段是已训练模型的存储管理。在刚开始实验阶段时，将模型存储在 `s3` 中就足够，但随着更多模型被训练、更多团队训练模型以及不同的模型沿着各自的部署路径移动，我们需要更健壮的解决方案。此外，我们希望对模型进行临时和长期存储，并具备相应的能力。\n\
  \n## 部署\n第五个也是最后一个阶段是所创建模型的部署。与其他阶段一样，此阶段能够在没有人工的情况下运行。我们可以使用自动化根据上几个阶段的结果来触发部署。这有助于确保生成的遥测数据能够被你的数据科学团队和运维团队共同摄取。\n\
  \n## 编排选项\n\n工作流编排器是一种应用程序，其目的是对一组定义的应用程序进行管理、协调、参数化调用。随着应用程序的演进，它们倾向于从单式的全合一部署类型转向分布式微服务风格的应用程序。这带来了许多优势，但也增加了协调不同应用程序的需求。实现这一目标的方法之一就是通过编排器。你已经熟悉编排工作流，例如根据运输选项对包进行排序、包装和交付的工作流。\n\
  \n由于我们选择了 AWS 作为机器学习负载的云计算平台，我们有多种编排器可选：`AWS Step Functions`、`AWS SageMaker Pipelines`\
  \ 以及 `Amazon Managed Workflows for Apache Airflow`。\n\n\n\n这些每个阶段的代码可以存储在训练代码旁边，也可以存储在自己的仓库中。以下是一个短代码片段，我们将在本章节后面对其进行扩展，展示了如何使用\
  \ Amazon SageMaker Pipelines 定义我们的模型训练（Model Training）阶段。它是使用 Python 和 AWS CDK 编写的：\n\
  \n```python\nBuildPipeline(\n  self,\n  \"ModelTrain\",\n  project_name,\n  project_id,\n\
  \  s3_model_location,\n  s3_pipeline_location,\n  model_package_group,\n  s3_seed_location,\n\
  \  kms_key,\n)\n```\n\n### Amazon SageMaker Pipelines\n\n如果你使用过 AWS AWS，你可能听过一种说法：超过\
  \ 90% 创建的服务都是基于客户反馈的。Amazon SageMaker Pipelines 正是这种“客户痴迷”的直接示例。虽然 AWS 还提供了许多其他编排选项，但机器学习从业者明确表示，他们希望有一种可以直接在他们的集成开发环境（`IDE`）内部创建、管理和观察的选项。SageMaker\
  \ Projects 和 SageMaker Pipelines 的创建正是为了满足这一需求。\n\nSageMaker Projects 是面向机器学习的 DevOps\
  \ 流程的逻辑容器，而 SageMaker Pipelines 是该 实现 实现中的连接步骤。首先，你创建一个项目，然后定义并连接项目内的步骤以形成你的流水线（pipeline）。由于你的每个机器学习工作流都有不同的阶段、输入和结果，项目为这些工作流提供了一种分组机制。\n\
  \nSageMaker Pipelines 在底层是其他 AWS DevOps 服务的抽象，具体包括：`CodeCommit` 用于源码控制仓库、`CodeBuild`\
  \ 用于实际的代码准备阶段、`CodeDeploy` 用于创建 SageMaker 端点（Endpoints），以及 `CodePipeline` 用于所有单个步骤的编排。这种抽象具有特定用途，它允许机器学习从业者在所选的\
  \ `IDE` 内部与其流水线交互，同时也允许运维团队从 SageMaker Studio 之外观察并与完全相同的流水线进行交互。这对于大型企业级项目特别有用，因为机器学习从业者不太可能就是将模型部署到生产环境的人员。这意味着从业者可以在\
  \ SageMaker Studio 中创建、管理和观察流水线，而运维团队可以批准部署到生产并进行任何必要的更改，而无需访问相同的 Studio 环境。\n\n\
  你的 SageMaker Studio 环境中预加载了几个示例流水线；要开始使用，你可以从左侧菜单中选择 Projects。从那里，你可以创建一个项目并选择合适的模板作为开始。模板本身被称为以\
  \ CloudFormation 格式编写的架构即代码（Infrastructure as Code）文档。这些文档被添加到 AWS Service Catalog\
  \ 产品列表中，并且必须包含 `SageMakerProjectName` 和 `SageMakerProjectId` 键值对。最后，该产品应包含值为 true\
  \ 的 `sagemaker:studio-visibility` 键。\n\nSageMaker Pipelines 使用离散的 SDK 来描述有向无环图（`DAG`）中的步骤、需求以及步骤之间的关系；它以\
  \ JSON 格式表示。以下是一个简单的模型构建和训练 DAG 示例。参考 [图 12.4]：\n\n![](img/Figure-12.4.jpg)\n\n\
  **图 12.4：** DAG 流示例\n\n每个流水线都有与机器学习工作流相关的特定参数和步骤。AWS Pipeline SDK 中的示例流水线定义如下：\n\
  \n```python\nSageMakerPipeline = Pipeline(\n  name=\"RegionallyUniquePipelineName\"\
  ,\n  parameters=[\n    data_instance_type,\n    data_instance_count,\n    training_instance_type,\n\
  \    approval_step,\n    training_data\n  ],\n  steps=[data_transformation, model_train,\
  \ model_deploy, model_evaluation, model_retain],\n)\n```\n\nsteps 列表中的每个步骤都有其自己的定义块，详细说明了完成该步骤所需的信息，并告知哪些部分是先决条件。以下是\
  \ `model_evaluation` 步骤，用于判断创建的模型是否符合所需的参数。如果生成的模型不满足所需的参数，将评估一个分支；如果满足，则评估另一个：\n\
  \n```python\nmodel_evaluation = ConditionStep(\n  if_steps = [step_register],\n\
  \  else_steps = [step_fail],\n)\n```\n\n对于条件步骤，左侧是用于比较的属性，右侧是用于比较的值。在这一步中，如果我们模型的最终评估分不大于\
  \ 80%，该步骤评估为 `false`。如果是，该步骤评估为 true，我们就可以继续注册我们的模型。\n\n正如前面提到的，Amazon SageMaker\
  \ Pipelines 的主要优势之一是可以在 SageMaker Studio 内部查看、执行和监控你的流水线状态。任何时候，你都可以选择 SageMaker\
  \ Projects，然后选择 Pipelines 以及你想查看的流水线。这包括 DAG、流水线执行列表以及相关数据。你还可以选择其中一次流水线执行来查看该特定特定调用的详细信息。如果你想启动流水线，可以选择\
  \ Executions 选项卡并点击 Start an Execution。\n\n### AWS CodePipeline\n\nAmazon SageMaker\
  \ Pipelines 是持续交付服务 AWS CodePipeline 的一种抽象。这意味着你的 DevOps 或运维团队可以直接从该服务、AWS SDK 或\
  \ AWS CLI 监控并与你的流水线进行交互，而无需访问 SageMaker Studio。\n\n### AWS Step Functions\n\nAWS\
  \ Step Functions 是一种无服务器编排器，允许你协调各种 AWS 服务的调用以实现目标。Step Functions 可以通过 `EventBridge`\
  \ 按时间计划调用，也可以作为另一个服务发布的事件的结果而启动。这对于机器学习编排器特别有用，因为你可以在每当有新数据到达 S3（`PutObject`）时触发模型训练过程，每当有新的训练脚本合并到\
  \ `CodeCommit` 仓库的开发分支时（`pullRequestMergeStatus`），甚至当 `CloudWatch` 报警模型质量指标低于可接受水平时触发。\n\
  \n就像 SageMaker Pipelines 一样，Step Functions 定义在离散阶段中，这些阶段可以包含逻辑路径并将前一个步骤的输出作为输入。此外，Step\
  \ Functions 可以在 API 级别与许多 AWS 服务交互，消除了需要调用单独计算资源（如 AWS Lambda）来触发实际服务的需求。\n\n通过\
  \ Step Functions，每个工作流都是一个状态机（State Machine），包含一个或多个执行工作的 Task 状态以及用于确定流的 Choice\
  \ 状态等。\n\nStep Functions 及其对应的组件（称为任务）可以使用 Amazon States Language 使用 JSON 表达式。一个对经典“Hello,\
  \ World!”程序进行多种变体的状态机示例：\n\n```json\n{\n  \"Comment\": \"This is an example of a\
  \ State Machine that completes a Hello, World! scenario\",\n  \"StartAt\": \"StartState\"\
  ,\n  \"States\": {\n    \"StartState\": {\n      \"Type\": \"Task\",\n      \"Resource\"\
  : \"arn:aws:lambda:us-west-2:123456789012:function:example_hello_world\",\n    \
  \  \"Next\": \"ChoiceState\"\n    },\n    \"ChoiceState\": {\n      \"Type\": \"\
  Choice\",\n      \"Choices\": [\n        {\n          \"Variable\": \"$.hello_success\"\
  ,\n          \"NumericEquals\": 0,\n          \"Next\": \"HelloSuccess\"\n     \
  \   },\n        {\n          \"Variable\": \"$.hello_failure\",\n          \"NumericEquals\"\
  : 1,\n          \"Next\": \"HelloFailure\"\n        }\n      ],\n      \"Default\"\
  : \"DefaultState\"\n    },\n    \"HelloSuccess\": {\n      \"Type\": \"Task\",\n\
  \    }\n  }\n}\n```\n\n\n\n\n```json\n{\n  \"Resource\": \"arn:aws:lambda:us-west-2:123456789012:function:double_hello\"\
  ,\n  \"Next\": \"EndState\"\n  },\n  \"HelloFailure\": {\n    \"Type\" : \"Task\"\
  ,\n    \"Resource\": \"arn:aws:lambda:us-west-2:123456789012:function:hello_dlq\"\
  ,\n    \"Next\": \"EndState\"\n  },\n  \"DefaultState\": {\n    \"Type\": \"Fail\"\
  ,\n    \"Error\": \"StateMachineError\",\n    \"Cause\": \"No State Matched\"\n\
  \  },\n  \"EndState\": {\n    \"Type\": \"Task\",\n    \"Resource\": \"arn:aws:lambda:us-west=2:123456789012:function:hello_end\"\
  ,\n    \"End\": true\n  }\n}\n```\n\nAWS Step Functions 控制台还包含了 Step Function Studio，这是一个用于构建状态机及其连接的图形界面。这使得用户能够更容易从流程的各个组件开始，然后连接它们并更新处理逻辑以完成任务。\n\
  \n### AWS Step Functions 数据科学 SDK\n\nAWS Step Functions Data Science SDK 是一个开源库，使机器学习从业人员能够在\
  \ Amazon Web Services 中轻松地创建地创建、训练和部署机器学习模型。该 SDK 旨在使用 Python 编写，并允许通过程序化设计流水线。你可以使用\
  \ PyPi 和 Python 3.6 快速开始，如下：\n\n```bash\npip install stepfunctions\n```\n\n```bash\n\
  git clone https://github.com/aws/aws-step-functions-data-science-sdk-python.git\n\
  cd aws-step-functions-data-science-sdk-python\npip install .\n```\n\n一旦安装了 SDK，就可以创建工作流的各个步骤。例如，你可以定义一个调用\
  \ Lambda 函数的步骤：\n\n```python\nLambdaStep = LambdaStep(\n  state_id=\"Print out Hello,\
  \ World!\",\n  parameters={\n    \"FunctionName\": \"hello_world\",\n    \"Payload\"\
  : {\n      \"input\": \"Function Input\"\n    }\n  }\n)\n```\n\n一旦定义了工作流的各个步骤，就可以将它们组合成一个链（Chain）：\n\
  \n```python\naiml_chain=Chain([first_task, second_task, third_state])\n```\n\n最后，由于工作流任务已链在一起，你可以声明你的工作流定义：\n\
  \n```python\naiml_workflow = Workflow(\n  name=\"AI/ML Workflow v0.0.1\",\n  definition=aiml_chain,\n\
  \  role=aiml_iam_role\n)\n```\n\n类似于使用 AWS CDK 构建基础设施，AWS Step Functions Data Science\
  \ SDK 允许你程序化地管理工作流，而无需学习像 CloudFormation 这样的半结构化语言。这对于数据科学家来说特别有吸引，因为他们可能已经熟悉并在使用\
  \ Python 工作，并希望他们的工具也能用该语言提供。你还可以使用同一个 SDK 图形化渲染你的工作流：\n\n```python\naiml_workflow.render_graph(portrait=False)\n\
  ```\n\n同样，你可以通过在工作流对象上执行 `Create` 函数，然后执行调用工作流的，在 AWS Step Functions 服务中创建你定义的工作流：\n\
  \n```python\naiml_workflow.create()\naiml_execution = aiml_workflow.execute(inputs={\n\
  \  \"times_to_print\": \"3\"\n})\n```\n\n### Apache Airflow 工作流\n\nApache Airflow\
  \ 是一个允许你创建、管理、触发和审查已创建工作流的平台。与 SageMaker Pipelines 和 AWS Step Functions ，Apache\
  \ Airflow 允许你在流程中创建各个组件并将它们连接起来，包括各自任务的输入和输出。你可以使用 Amazon SageMaker 运算符（v1.10.1\
  \ 或更高版本）或 Airflow PythonOperator 创建工作流。\n\n如果你在多个云或混合环境中管理工作流，Apache Airflow 可能是一个很有吸引力的选择。在你的团队对\
  \ Apache Airflow 有深入理解的情况下，它可能也有优势。\n\n使用 SageMaker 算子，你可以获取创建的估计器对象并传递给导入的 `sagemaker.workflow.airflow.training_config`\
  \ 对象：\n\n```python\ntraining_config = training_config(estimator=estimator_object,\
  \ inputs=s3_train_data)\n```\n\n获取之后，你可以创建一个类似的导入的 `sagemaker.workflow.airflow.transform_config_from_estimator`\
  \ 对象：\n\n```python\ntransform_config = transform_config_from_estimator(\n  estimator=estimator_object,\n\
  \  task_id='training',\n  task_type='training',\n  instance_count=1,\n  instance_type='ml.c5.large',\n\
  \  data=s3_transform_data,\n  content_type='text/csv'\n)\n```\n\n然后在你的新的 DAG 内部声明\
  \ airflow 默认参数（类似于 Step Functions Data Science SDK）：\n\n```python\nworkflow = DAG(\n\
  \  \"MLOps Example\", default_args={\n    \"depends_on_past\": False,\n    \"retries\"\
  : 3,\n    \"retry_delay\": datetime.timedelta(hours=1),\n  },\n  start_date=pendulum.datetime(2022,\
  \ 09, 1, tz=\"UTC\"),\n  description=\"Airflow \",\n  schedule=\"@daily\",\n  catchup=False\n\
  )\n```\n\n### 阶段划分\n\n在仔细考虑了选项后，我们转型为数据科学家背景的 SRE 决定实施 SageMaker Pipelines。这主要是因为现有团队使用\
  \ CodePipeline，这意味着 SageMaker Pipelines 是 CodePipeline 的抽象，现有的运维团队可以继续像现在一样管理生产环境。\n\
  \n决定已经做出；下一步是开始。打开 SageMaker Studio，在左侧边栏选择 SageMaker Resources 图标。从那里，他们可以下拉列表中选择\
  \ `Projects`，如图 12.5 所示：\n\n（图 12.5 占位符）\n\nSageMaker Projects 有几个预定义的模板，涵盖了许多所需的工作流。我们初期的\
  \ SRE 知道可以创建自定义版本，但想从提供的模板之一开始，测试一切是如何运作的。他们的团队已经使用 CodeCommit 作为版本控制仓库，提交他们的数据转换和模型训练脚本，因此他们选择了\
  \ `MLOps template for model building, training, and deployment`。参考图 12.6：\n\n（图\
  \ 12.6 占位符）\n\n一旦选择了模板并为项目命名，相关的 AWS 资源将通过与 SageMaker Pipeline 模板链接的 CloudFormation\
  \ 模板进行配置。模板配置了一个存储训练脚本的 CodeCommit 仓库、一个训练模型的 CodeDeploy 任务、一个存储模型产物的 S3 桶和一个协调这一切的\
  \ CodePipeline 任务。这些服务与 SageMaker Studio 是分离的，但我们的 SRE 将能够在内部观察它们的行为并控制它们的动作。\n\n\
  SageMaker Studio Pipelines 将步骤分成了两个存储库，但为了理解过程，我们将将其视为下述的五个独立部分。\n\n\n\n\n\n在首次构建机器学习问题的解决方案时，我们经历了识别数据源、整合从这些数据源中选择的相关数据以及对数据集进行特征工程的步骤。从这些初始工作中，我们可以提取出一个可以自动化的数据转换脚本，该脚本将根据我们定义的触发器运行。该触发器可以是写入我们数据存储库之一的新数据，例如\
  \ Amazon Aurora for MySQL 中的新数据、特定的 S3 桶或 Snowflake 数据仓库。它也可以是提交到我们源码仓库中的新训练脚本。\n\
  \n一旦发生该触发动作，构建流水线就会被触发，提交的脚本将从仓库中下载并运行。该构建函数的行为由仓库中的其中一个文件控制：`codebuild-buildspec.yml`。\n\
  \n此文件包含运行流水线的命令，如下所示，可以进行编辑以匹配您的项目名称：\n\n```\nrun-pipeline --module-name pipelines.abalone.pipeline\n\
  ```\n\n将 `abalone` 替换为选定的流水线名称。\n\n作为流水线模板一部分创建的默认位于 `/pipelines/abalone/preprocess.py`。您可以替换此代码（由于您不太可能尝试预测蜗牛的大小，因此路径也需要更改，以匹配您对上述\
  \ `codebuild-buildspec.yml` 的编辑），可以使用您的特征工程代码或编辑现有文件以创建您的处理代码。\n\n我们的 SRE 正在实现一个价格预测线性回归模型，因此他们选择\
  \ `priceIsRight` 作为流水线名称。在相同的 `/pipelines/priceIsRight/` 目录下，还有一个引用 abalone 的 `pipelines.py`\
  \ 文件，该文件也需要更新，以及 `input_data` 对象，它应该指向我们的数据转换步骤将写入供下一步使用数据的 s3 位置。\n\n```\ninput_data\
  \ = ParameterString(\nname=\"InputDataUrl\", default_value=f\"s3://your-s3-data-location/data/priceIsRightData.csv\"\
  ,\n)\n```\n\n同一目录下还有 `evaluate.py`，但我们将在阶段 3：模型评估中回到该文件。完成更改后您可以将其暂存、提交并推回 CodeCommit\
  \ 仓库。我们已为您设置了一个触发器，当向仓库推送任何更改时都会调用您的流水线，您可以在 SageMaker Studio 中通过选择项目来跟踪更改。\n\n\
  如果过程按预期运行，如果数据出现在您选定的 S3 桶中，您应该就能看到结果。\n\n### 模型训练\n\n现在我们已经准备好了输入数据，可以移动到过程的第二个阶段，尽管我们仍在使用两个仓库中的第一个：构建仓库。从该过程中，我们将继续使用\
  \ `pipeline.py` 文件，该文件包含了用于训练模型的脚本。提供的脚本用于 SageMaker 内置的 XGBoost 框架，该文件可以替换为您在实验期间创建的模型训练命令。\n\
  \n训练模型的步骤与我们在前面的章节中进行实验时相同。我们继续创建估计器，设置超参数，然后在您的估计器上调用 `.fit()`。您选择的模型可能有不同的步骤，可以将这些步骤添加到\
  \ `pipeline.py` 文件中。\n\n### 模型评估\n\n一旦我们观察到成功的训练作业并将模型产物写入指定的 s3 桶，我们就可以考虑将用于模型评估的方法。在我们运行的实验期间，我们立即将训练好的模型部署到\
  \ SageMaker 端点，以根据选定的指标对其进行评估。在这里我们将这样做，但通过这些实验的数据，我们还可以为模型性能设置最小阈值，在考虑模型可行解决我们的问题之前满足该值。\n\
  \n选定的指标取决于模型，但应该考虑业务结果。随着业务需求的变化，该值可以并且应该更新。在机器学习项目的早期阶段，60% 的准确率可能是可以的，但随着产品和流程的成熟，可能会被调整为更准确的值。需要注意的是，这并不是为了与当前部署的模型进行评分比较，而是为了确定任何模型在保存之前必须通过的最小阈值。\n\
  \n关于 s3 生命周期策略的：即使是单个数据科学家，写入 s3 的数据量也可能是巨大的。训练数据、特征工程数据、模型产物、模型监控数据捕获、训练日志和其他数据可能会填充您的\
  \ s3 桶并导致不必要的成本。考虑实施 s3 生命周期策略，将任何过去 30 天内未访问的对象移动到较低成本的存储层。然后您可以设置更长的策略来使对象过期或将其移动到成本更低的存储层。\n\
  \n对于您的流水线，您在模型构建仓库的 `pipeline.py` 中将评估脚本的调用（包括模型部署）设置为短寿命 SageMaker 端点。实际的评估脚本位于同一位置，命名为\
  \ `evaluate.py`。\n\n`pipeline.py` 中确定模型保留阈值的特定行是流水线中的 `ConditionStep` 部分。左部分是待评估的指标，右部分是模型评估报告的值。在接下来的示例中，我们要求模型的准确率大于\
  \ 75%。\n\n```\nmodelMetric= JsonGet(\nstep_name=stepProcess.name,\nproperty_file=evaluationReport,\n\
  json_path=\"evaluation.accuracy\",\n)\n```\n\n```\nstepCondition = ConditionStep(\n\
  name=\"priceIsRightConditionStep\",\nconditions=[ConditionGreaterThanOrEqualTo(left=modelMetric,\
  \ right=0.75)],\nif_steps=[stepRegister],\nelse_steps=[stepFailure],\n)\n```\n\n\
  一旦模型通过了最小条件，模型 URL 将传递给下一阶段：模型保留。如果您的训练过程是由训练脚本或写入各自仓库的新数据触发的，那么在给定的窗口内，您可能有许多可行模型待部署。在这种情况下，您可以检索所有保存模型的指标，并选择能力最好的一个。选择此模型并将其与当前生产模型一起部署通常被称为冠军/挑战者方法（champion/challenger\
  \ approach）。现有模型是冠军，新模型是挑战者。通常方法是在两个模型之间使用 SageMaker 端点生产变体，并调整它们的模型权重，将部分实时流量发送到新模型，以验证其准确性和替换冠军的整体能力。通过选择新的挑战者模型接收所有生产流量即可完成替换操作。\n\
  \n### 模型产物管理\n\n一旦模型通过了我们的条件表达式，我们希望将其存储在某个处以便以后检索。当我们处于模型构建的初始实验阶段时，我们经常将模型存储在\
  \ s3 中。对象存储特别适用于此，因为 s3 中的训练模型位置是作为估计器 `.fit()` 函数的一部分存储的。当我们进入工作流的运营部分时，我们可以继续使用\
  \ s3，但跟踪这些单个模型变得越来越具有挑战性。此外，在模型旁边存储元数据可以实现语义版本控制（模型文件名之外，但很快会遇到文件长度问题）、模型评估指标、训练数据引用，甚至将模型版本分组在一起的功能。\n\
  \n\n\n\n\n有一些第三方选项可以存储多种不同的产物，例如 `Artifactory`、`Nexus` 甚至 `AWS CodeArtifact`。这些选项都可以工作，但它们并不是专门为机器学习模型设计的。\n\
  \n考虑到这些选项，我们的 SRE 选择了使用内置选项：`SageMaker Model Registry`。该决策的优点还可以获得所选的 `SageMaker\
  \ Pipeline` 模板的支持。具体步骤位于 `pipeline.py` 文件中，并应该根据您的模型特定信息进行更新：\n\n```python\npriceIsRightModel\
  \ = Model(\nimage_uri=imageURI,\nmodel_data=stepTrain.properties.ModelArtifacts.S3ModelArtifacts,\n\
  sagemaker_session=sagemaker_session,\nrole=sagemaker_role,\n)\n\nstepArgs = priceIsRightModel.register(\n\
  content_types=[\"text/json\"],\nresponse_types=[\"text/json\"],\ninference_instances=[\"\
  ml.m5.large\", \"ml.m5.xlarge\"],\ntransform_instances=[\"ml.c5.large\"],\nmodel_package_group_name=ModelPackageGroup,\n\
  approval_status=modelApprovalState,\nmodel_metrics=modelMetric,\n)\n\nstepRegister\
  \ = ModelStep(\nname=\"RegisterPriceIsRightModel\",\nstep_args=stepArgs,\n)\n```\n\
  \n### 模型部署\n\n在这里，在最后一个阶段，我们最终切换到为我们创建的另一个仓库：部署仓库（deploy repo）。与构建仓库类似，我们可以克隆（git\
  \ 术语，指创建远程仓库的本地副本）该仓库并查看内容。\n\n对于我们的构建仓库，触发器是新对象被提交到仓库。部署仓库有一个触发器，即在 `Model Registry`\
  \ 中注册模型的行为。该注册会触发流水线将模型部署到测试端点（staging endpoint）。一旦部署完成，它将等待批准以将相同的模型部署到生产端点。将此过程自动化并与之前的步骤分离，意味着它们可以独立运行。一旦机器学习从业者修改了他们的训练过程，自动训练将重新触发。一旦模型通过超过已定义的\
  \ `model metrics` 被程序化地识别为适合部署，它就会开始部署过程。\n\n这使得机器学习从业者能够自由地继续他们的实验，识别训练过程或模型行为的改进，并在他们准备好使用时将其提交到仓库。\n\
  \n所有通过已识别指标的最终模型都将进入部署队列。当然，并不是所有模型都会部署到生产环境，但未被选中的模型批准状态可以设置为 `Rejected`（拒绝）。\n\
  \n部署流水线了两个端点：测试和生产。你可以根据软件开发生命周期需求添加尽可能多的端点，包括质量保证（QA）、集成或 Beta 端点。你还可以将这些端点部署到您的\
  \ `AWS CodeDeploy` 作被授予访问权限的其他 AWS 账户。\n\n在部署仓库中，`buildspec.yml` 为 `AWS CodeDeploy`\
  \ 调用时执行的指令。该文件使用包含的 `build.py` 来接收参数并编写测试和生产配置文件，这些文件会被 `Amazon CloudFormation Template`\
  \ 用于创建实际的端点基础设施。\n\n每个环境还有一个环境配置文件，你可以在其中设置实例类型和端点的实例数量等参数。如果你添加了 QA 环境配置文件，它可能如下：\n\
  \n```json\n{\n\"Parameters\": {\n\"StageName\": \"qa\",\n\"EndpointInstanceCount\"\
  : \"1\",\n\"EndpointInstanceType\": \"ml.m5.large\",\n}\n}\n```\n\n你还需要在 `build.py`\
  \ 中添加一个参数来导入新的 `qa-config.json`：\n\n```python\nparser.add_argument(\"--import-qa-config\"\
  , type=str, default=\"qa-config.json\")\n```\n\n最后，是一个写入 qa 配置文件的新代码块：\n\n```python\n\
  with open(args.import_qa_config, \"r\") as f: qa_config = extend_config(args, model_package_arn,\
  \ json.load(f))\nlogger.debug(\"QA config: {}\".format(json.dumps(qa_config, indent=4)))\n\
  with open(args.export_qa_config, \"w\") as f: json.dump(qa_config, f, indent=4)\n\
  if (args.export_cfn_params_tags): create_cfn_params_tags_file(qa_config, args.export_qa_params,\
  \ args.export_qa_tags)\n```\n\n模型部署的批准在 `SageMaker Model Registry` 中管理，可以在 `AWS\
  \ SageMaker Projects` 中设置，也可以直接在 `AWS CodePipeline` 中设置。这意味着你可以不需要访问 `SageMaker\
  \ Studio` 的审批者，包括与变更管理系统集成的程序化审批者。\n\n## 使用 AWS Well-Architected Lens 进行机器学习的最佳实践\n\
  \n一旦你实现了机器学习工作流的运营，你还可以实施监控、自动重训练、仪表板和其他流程，但通常问题在于不知道哪些应该是优先考虑的最佳实践。坦率地说，Amazon\
  \ Web Services 提供了一个服务，将针对所有客户的规范化经验提炼到 `Well-Architected Tool` 中。\n\n要使工作负载被认为是架构良好的，它应该与\
  \ `Well-Architected Framework` 六大分类支柱中呈现的经验保持一致。这些支柱，即卓越运营、安全性、可靠性、性能效率、成本优化和可持续性，构成了机器学习从业者团队可以使用的问题组。回答这些问题并识别尚未解决领域的结果是一组高高和中等漏洞，这些漏洞可以作为结构化数据，用于识别实现良好架构的方法。在架构工具中应用一组特定问题被称为应用透镜（lens）。\n\
  \n对于 AWS Well-Architected Machine Learning Lens，工作流被分为八部分，如图 12.7 所示：\n\n**图 12.7：**\
  \ Well-Architected Machine Learning Lens\n\n\n\n\n\n\n## 卓越运营与可持续性\n\n- **运营卓越**：培养你的机器学习从业人员的技能是关键，特别是在这样一个节奏极快、快速加速的领域。如果假设团队成员的现有技能组合在任何时候都适用于所有情况，将是一种反模式。投资团队的知识增长意味着投资于你们工作负载的质量。\n\
  - **可持续性**：尽管可持续性是最新的支柱，但其重要性正在迅速增加。由于与本地数据中心相比，`AWS` 管理的碳足迹较低，使用 `AWS` 服务已经帮助你朝着正确的方向迈进。此外，使用\
  \ `Customer Carbon Footprint`（客户碳足迹）等工具可以为每个工作负载的环境影响提供量化的指标。将这些指标与领域特定指标结合使用，做出方向性决策。\n\
  \n## 结论\n\n在这里，我们共同结束了这段学习旅程，这是一段迷人的旅程！你可能觉得这些内容太简短、太生硬、太匆忙，无法涵盖在 `AWS` 上关于机器学习可以学习的所有内容，你是完全正确的。但同时，旅程仍在继续。这可能是你第一次接触机器学习概念，或者你可能在该领域非常有经验，并正以此本书作为提高技能的方法。无论何种情况，仅该领域需要获取的知识量就近乎无限。然而，这是一个值得庆祝的原因，而不是退步（双关语）。这是一个机器学习充满迷人发现和惊人赋能的时代。利用云计算提供的按需近乎无限的规模，意味着拥有数十亿参数的模型不仅能够存在，而且现在正在被使用。机器学习正用于寻找癌症治疗方法、终结人口贩卖并实现世界各地人们之间的交流，而你的工作也是其中一部分。\n\
  \n即使你正在的项目感觉很平庸，你所处的领域也在不断扩张。当一段旅程结束时，另一段旅程就开始了，这就是你将成就的开始，即使这些只是 `Kaggle` 上的竞赛、一次\
  \ `Amazon SageMaker Jumpstart` 实验，或者下一种最佳风格的 `proto-transformer` 模型，你的工作很重要，因为你选择了去做它。现在，在本书的最后，我们是同事了。所以，请随时联系我们，告诉我们你正在做什么，以及你对这本书的看法。\n\
  \n最后，花点时间思考你的旅程以及你已经走了多远。下一步取决于你，但请考虑与他人分享你的旅程。社交媒体、视频博客，甚至是你自己的一本书。当我们提升他人时，我们会变得更加丰富；我们并肩作战；机器学习也是如此。\n\
  \n## 多选题\n\n使用这些问题来挑战你对 `MLOps` 和良好架构的机器学习工作流的知识。\n\n1. **SageMaker Projects 用于\
  \ MLOps 的目的是什么？**\n    1. 自动跟踪给定模型的实验\n    2. 标准化开发环境、依赖关系和代码管理\n    3. 管理机器学习项目的网络开销\n\
