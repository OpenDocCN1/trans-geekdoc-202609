  \n```python\n# 运行估计器拟合\nxgb_estimator.fit({‘train’:train_input})\n```\n\n15 我们指定\
  \ `num_rounds` 为 30，表示模型通过我们的输入数据集训练的轮数（epochs）。我们将看到均方根误差（`RMSE`），这是模型为每轮打印的标准回归指标。`RMSE`\
  \ 是一个误差指标，它在每轮中都需要减少，这表明模型正在良好地学习：\n\n这标志着我们笔记本中训练部分的结束。现在我们来到本章的主题：ML 推理（ML inference）。现在我们将探索可以为训练好的模型设置的不同类型的推理，学习如何配置和构建它们，以及如何使用它们运行预测。\n\
  \n# 使用实时端点进行推理(#toc.xhtml#s213a)\n\n在本节中，我们将构建一个单模型、单容器的实时端点，上传训练好的模型并使用该端点运行预测。请按照以下指令继续。\n\
  \n**注意：你不能直接执行此节；请先执行模型训练（第 15 步）。**\n\n1. 执行此节的第一个单元格，打印模型产物在 S3 桶中的位置：\n\n```python\n\
  # 模型产物存储在此\nprint(xgb_estimator.model_data)\n```\n\n2. 我们看到打印出的路径：\n\n`S3://<your-S3-bucket>/aiml-book/chapter9/xgboost-model/output/model.tar.gz`\n\
  \n3. 3 执行 执行下一个单元格以运行 `CreateModel` API 并根据我们的训练模型产物构建 SageMaker 模型。注意，由于我们在上一节中使用\
  \ SageMaker 训练模型，可以直接使用 `estimator` 对象部署端点。但为了向你展示如何使用 `CreateModel`、`CreateEndpointConfiguration`\
  \ 和 `CreateEndpoint` API，我们在这里采用了底层方法。你可以看到，我们为此步骤提供了 XGBoost 容器和模型的 S3 URL：\n\n\
  ```python\n# 获取 SageMaker boto3 句\nsm = boto3.client（sagemaker’)\n# 我们的模型名称\nmodel_name\
  \ = ‘chapter9-xgboost-container’\n# 现在让我们根据训练的模型产物创建模型\nmodel_res = sm.create_model(\n\
  ModelName = model_name,\nExecutionRoleArn = sagemaker.get_execution_role(),\nPrimaryContainer\
  \ = {\n‘Image’: xgb_image,\n‘ModelDataUrl’: xgb_estimator.model_data,\n})\n```\n\
  \n4 执行以下单元格为我们的模型部署创建 SageMaker 端点配置（Endpoint Configuration）。这是一个关键步骤，我们在这里提供了模型名称、端点基础设施实例类型和实例数量。`InitialInstanceCount`\
  \ 将确保至少运行在此处提供的数量的实例：\n\n```python\nEp_config_name = model_name +’-epconfig’\nepcfg_response\
  \ = sm.create_endpoint_config(\nEndpointConfigName=ep_config_name,\nProductionVariants=[{\n\
  “VariantName”: “chapter9-test-variant”, # 生产变体的名称。\n“ModelName”: model_name,\n“InstanceType”:\
  \ ‘ml.m5.xlarge’, # 指定计算实例类型。\n“InitialInstanceCount”: 1 # 启动的实例数量。\n}])\nprint(“端点配置创建成功:\
  \ “ + epcfg_response[‘EndpointConfigArn’])\n```\n\n5 执行下一个单元格为我们训练好的模型创建 SageMaker\
  \ 实时端点：\n\n```python\nEp_name = model_name+’-ep’\nep_response = sm.create_endpoint(EndpointName=ep_name,\
  \ EndpointConfigName=ep_config_name)\n```\n\n\n\n\n\n6. 端点（Endpoints）通常需要 15 到 20\
  \ 分钟来完成配置。执行以下单元格以检查端点状态。您可以参考 SageMaker 控制台中的 `https://us-east-1.console.aws.amazon.com/sagemaker/home?region=us-east-1#/endpoints`\
  \ 中的端点状态（请确保您在 AWS 控制台中使用了正确的区域），或者您可以持续执行此后续单元格，直到状态变为 `InService`。只有当此单元格中打印的状态变为\
  \ `InService` 后，再进入下一个单元格：\n\n```python\n# 等待此处的打印语句显示 InService\nprint(sm.describe_endpoint(EndpointName=ep_name)‘EndpointStatus'])\n\
  ```\n\n7. 现在，我们将通过使用测试数据集中的条目（不含标签）调用端点，对端点和模型进行测试。执行以下单元格为来自 CSV 文件的测试条目创建一个 `StringIO`\
  \ 缓冲区：\n\n```python\n# 为来自我们测试数据集的 csv 请求数据创建一个缓冲区\nfrom io import StringIO\ninf_req\
  \ = StringIO()\ntest_df_no_label.to_csv(inf_req,header=False, index=False)\n```\n\
  \n8. 执行以下单元格调用端点，将测试数据集中的输入特征发送到您的模型，并打印我们模型的结果：\n\n```python\n# 我们需要一个 SageMaker\
  \ 的运行时处理器\nsm_run = boto3.client(“sagemaker-runtime”)\n# 现在调用端点\npredictions = sm_run.invoke_endpoint(\n\
  \  EndpointName=ep_name,\n  Body=inf_req.getvalue(), # 我们在上一个单元格中创建的 StringIO 缓冲区的值\n\
  \  ContentType=’text/csv’\n )\n# 检查我们是否获得了正确的响应 – 预测的售价\nprint(predictions['Body'].read().decode(‘utf-8’))\n\
  ```\n\n9. 我们看到了以下结果（为了简洁，此处仅重现了结果的快照）。这些是我们最初留下的测试数据集中房屋的预测销售价格：\n\n```\n159152.59375\n\
  211584.296875\n205173.65625\n173063.265625\n198776.09375\n```\n\n这标志着我们关于如何在 SageMaker\
  \ 中为训练好的模型构建和使用实时配置端点的这一小节的结束。我们提供了实例类型和数量，但如果我们因为突然收到大量流量而需要扩展实例数量，则我们需要显式地定义应用程序自动缩放策略，并将我们的端点作为维度添加到该策略中。此外，端点处于运行期间，无论其是否接收到推理请求，都会产生费用。SageMaker\
  \ 的无服务器推理（Serverless inference）选项允许在无需担心基础设施伸缩扩展的情况下配置和使用端点。\n\n# 使用无服务器端点进行推理\n\
  \n在本节中，我们将学习如何构建、部署和使用无服务器端点。我们将使用之前训练的相同的 XGBoost 模型，但将部署无服务器推理选项而不是配置的端点。请根据以下说明执行本节中的单元格：\n\
  \n1. 执行本节中的第一个单元格，从我们的模型构文件创建 SageMaker 模型，但指定 `Containers` 对象，而不是我们在上一节中使用的 `PrimaryContainer`\
  \ 字典：\n\n```python\n# 获取 SageMaker boto3 句\nsm = boto3.client(‘sagemaker’)\n# 模型名称\n\
