  \ RMSE，后者决定了我们的优胜模型）。请参阅`图 7.19`：\n\n![](img/Figure-7.19.jpg)\n\n**图 7.19:** AutoGluon\
  \ 模型排行榜\n\n我们关于如何使用 AutoGluon 为您的机器学习工作流运行 AutoML 训练的示例到此结束。`AutoGluon` 非常多能，支持各种机器学习领域。请务必查看他们的教程页面以获取更多详情（`[`auto.gluon.ai/stable/tutorials/index.html`](https://auto.gluon.ai/stable/tutorials/index.html)`）。正如你可以想象的，AutoML\
  \ 确实是一个热门的话题，因为它易于使用、灵活，并且能够实现时间和成本的高效率，而且运行它几乎不需要机器学习专业知识。在本章中，我们通过 `SageMaker\
  \ Canvas` 和 `AutoGluon` 对 AutoML 的介绍仅触及皮毛。在 AWS AI/ML 栈中还有其他服务提供 AutoML 能力，例如 `Amazon\
  \ Forecast AutoML` 和 `AWS AI Services`。\n\n`Amazon Forecast` (`https://aws.amazon.com/forecast/`)\
  \ 是一项用于时间序列预测问题的全托管服务，可以选择使用 AutoML 进行数据处理、特征工程和模型训练，方法是从一组实验过的算法或配方中选择一种算法。`Amazon\
  \ Forecast` 是一个 `AWS AI service`，它是一系列强大的预训练模型，通过 API 提供机器学习能力。`AWS AI services`\
  \ 涵盖了广泛的用例、领域和行业，包括语音、文本、视觉、工业 AI 和业务流程的服务。我们将在 `第 10 章，通过感知认知添加智能` 和 `第 11 章，用于工业自动化的\
  \ AI` 中详细介绍 AI 服务。\n\n## 结论\n\n在本章中，我们在之前几个章节中学习的机器学习工作流阶段序列中选择了一个分支，来学习 AutoML。我们看到，通过\
  \ AutoML 以及最近的无代码机器学习选项，大多数机器学习工作流阶段都是自动化的；我们只需要负责的是数据收集和一些基础的预处理，以便根据机器学习问题的类型安排数据。所有其他任务都是完全自动化的，只需要少少的人工干预。因此，AutoML\
  \ 可以可以在完成数据收集后作为您的路径（我们在 `第 2 章，注水数据湖` 中执行了数据收集）。如果您选择 AutoML，就可以自动化直到 `第 9 章，使用弹性推理实现规模化智慧`\
  \ 的所有任务。在下一章中，我们将学习用于实现我们的训练模型以进行测试和生产的各种部署策略。我们将学习如何处理和设计模型部署技术，如何在不丢失推理请求的情况下构建和更新端点，等等。\n\
  \n## 记忆要点\n\n以下是本章的核心要点：\n\n*   在本章中，我们学习了如何运行全自动的机器学习工作流，作为替代方案以替代我们之前在 `第 3 章，通过特征预测未来`；`第\
  \ 5 章，撒更大的网`；以及 `第 6 章，迭代产生智能` 中讨论的内容。\n*   我们学到，根据团队的技能水平、项目需求以及可用的时间和资金，AutoML\
  \ 因其易用性和高效性成为今天的热门选择。\n*   我们看到了如何使用今天两个最流行的 AutoML 选择方案：使用 `SageMaker Canvas` 隐式地使用\
  \ `SageMaker Autopilot`，以及在 `SageMaker Studio notebook` 中使用 `AutoGluon`。\n*   我们使用了在\
  \ `第 3 章，通过特征预测未来` 中首次引入的葡萄酒特性数据集，但使用了其未处理的形式（即原始数据集）作为我们 AutoML 解决方案的输入。\n*   我们看到通过\
  \ `SageMaker Canvas`，我们没有写任何代码，就能通过快速构建（Quick build）选项在 2 分钟内处理数据集、执行特征工程，并调优和训练机器学习模型，以\
  \ 23.75 的 `RMSE` 预测葡萄酒价格。\n*   随后我们使用 `AutoGluon` 使用了相同的数据集并训练了一个 `Tabular predictor`（表格预测器），它转换了我们的数据集；执行了特征工程；从\
  \ 11 个不同模型（属于不同算法族）的集成中训练、调优并选择了一个优胜模型（具有最低的 `RMSE`）。\n\n## 多选题\n\n使用以下问题来挑战你对 AWS\
  \ AI/ML 服务中 AutoML 的知识。\n\n1.  **什么是 Amazon SageMaker Canvas？**\n    1.  它是 `SageMaker`\
  \ 中的一种新训练算法。\n    2.  它是一项无代码机器学习服务，帮助非技术用户构建、训练和使用机器学习模型。\n    3.  它是来自 `SageMaker`\
