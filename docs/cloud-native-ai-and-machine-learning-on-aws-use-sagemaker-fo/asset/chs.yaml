  \n24. 对于 `Input data`，点击 `Browse` 按钮并选择 S3 桶中的 `l4e-inference` 文件夹。\n\n25. 对于 `Data\
  \ upload frequency`，选择 5 minutes。\n\n26. 保持其余默认设置，向下滚动到 `Output data`。对于 S3 位置，提供\
  \ `s3://<bucket-name>/l4e-inference`。滚动到页面底部并点击 `Schedule inference` 按钮。\n\n27.\
  \ 调度推理后，立即运行代码片段创建一个反映未来 5 分钟、每分钟一次的异常数据集。该代码还将推理 CSV 文件上传到你的 S3 桶。请参考以下代码片段。\n\n\
  ```python\nimport datetime\nfrom datetime import timezone\nimport pandas as pd\n\
  import boto3\nbucket = 'aiml-book'\ns3 = boto3.client('s3')\nstarttime = datetime.timedelta(minutes=5)\n\
  dated = datetime.datetime.now(timezone.utc)+starttime\ncols = ['timestamp','sensor_00']\n\
  time_df = pd.DataFrame()\nfor i in range(50):\n    dated += datetime.timedelta(minutes=1)\n\
  \    new = dated.strftime('%Y%m%d%H%M%S')\n    time_df.at[i,'timestamp'] = new\n\
  \    time_df.at[i,'sensor_00'] = 50+i\ntime_df.to_csv('inference.csv', index=False)\n\
  s3.upload_file('inference.csv', bucket, 'l4e-inference/inference.csv')\ntime_df.head()\n\
  ```\n\n**注意：如果在执行此代码与激活推理调度之间通过了时间，你的推理调度可能会遇到错误。从调度器激活开始，它期望 5 分钟内每分钟一个的时间序列数据点。为了解决这个问题，请使用由\
  \ AWS EventBridge 触发的 AWS Lambda 函数来实现上述代码，并持续更新 inference.csv 文件。请参考 https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-run-lambda-schedule.html。**\n\
  \n28. 5 分钟后，Lookout for Equipment 将自动获取该文件，使用模型运行推理并将结果存储在输出文件夹中。你可以打开输出文件夹并检查文件，查看检测到了多少个异常数据点。\n\
