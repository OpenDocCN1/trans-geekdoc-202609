  \ GitHub 仓库。\n\n现在我们已经对模型托管相关的概念有了坚固的理解，让我们来看看这位初接触推理的 SRE（站点运维工程师）为了帮助团队中的数据科学家将采取哪些选项。检查他们的工单队列，这位充满活力的\
  \ SRE 发现已经有三个请求在等待他们。\n\n第一个是部署一个模型来帮助叙事生成。显然，数据科学团队已经厌了为他们的摘要编写填充文本，希望使用他们听过的某些新模型来提供帮助。\n\
  \n第二个是部署一个他们已经完成训练的线性回归模型。该模型将支持一项正在进行的实验，并且能够快速响应。他们期望模型响应的接收时间在每个请求少于 100 毫秒。\n\
  \n最后一个模型是一个分类器，团队将用它对大量积压的用户提交图像进行排序。好消息是，数据科学团队已经有了标记了真值（ground truth）的数据集和一个训练好的模型，但推理的输入图像是间歇性的，且结果只需要每周接收一次即可。\n\
  \n在所有三种情况下，团队都需要要求的时间窗口内完成推理，但由于他们主要依靠资助资金工作，他们还希望避免任何额外的开支。\n\n该开始工作了。\n\n# 叙事生成\n\
  \n决定按顺序处理工单，我们的 SRE 决定从叙事生成请求开始。有趣的是，团队并没有提供用于部署的模型。幸运的是，我们的 SRE 一直关注机器学习趋势，并听过很多关于最近产生惊人结果的\
