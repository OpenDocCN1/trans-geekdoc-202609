  \n要尝试本节中的示例，请参阅`第 1 章，介绍 ML 工作流]` 中的“技术要求”部分以登录 AWS 管理控制台，执行 `onboard to SageMaker\
  \ studio` 中的步骤，并执行 `cloning the repository to SageMaker Studio` 开始工作。点击与本章节编号对应的文件夹。如果你看到多个笔记本，章节标题将对应于笔记本名称以便于识别。你也可以通过书开头提供的\
  \ GitHub 仓库被动地跟随代码示例。\n\n# 训练的含义\n\n在继续之前，让我们停下来检查一下训练的真实含义。\n\n训练一个机器学习模型意味着我们帮助算法从我们提供的示例中确定所有权重和潜在偏置的良好值。在监督学习的情况下，我们允许模型从提供的示例中学习，不断迭代，直到我们获得一个使损失（Loss）最小化的结果性模型。`Loss`可以被认为是对错误决策的权重惩罚。对于一个训练完美的模型，我们的损失将为零（尽管这种情况很少见，甚至从未发生过）。因此，我们的目标应该是迭代我们的模型训练过程，以获得接近零的损失。\n\
  \n无监督学习使用相同的过程和方法，但在没有预定义示例集的情况下学习。这使得算法能够自由地确定模式、聚类、异常或其他信息。\n\n# 训练对深度学习意味着什么\n\
  \n正如我们在之前的章节中看到的，深度学习是机器学习的一个子学科（机器学习本身又是人工智能的一个子学科，而人工智能又是信息技术的一个子学科）。深度学习使用系列模仿人脑的人工神经网络来迭代地确定数据中的模式。它是通过层叠节点（或神经元）的集合来实现的，每个神经元都有权重和一个阈值。如果任何节点的输出高于阈值值，那么该节点就会被激活，并将数据发送到下一层节点。节点层有特定的类型：输入层、隐藏层和输出层。将每个单独的节点视为微型线性回归模型。它有输入数据、一组权重、一个阈值（或偏置）和一个输出。\n\
  \n通过连续将数据传递给每一层并根据节点输出调整权重，网络会学习并逐渐加深对正在训练的数据关联的理解。\n\n正如你可能猜到的，这需要大量的迭代，这意味着需要大量的计算能力。这也是为什么\
  \ `Graphical Processing Units`（`GPUs`）特别适用于深度学习。得益于它们的大规模并行处理能力和板内存，`GPUs` 能够更快、更高效地训练深度学习模型。\n\
  \n### GPU vs CPU\n\n在处理器领域，应该使用哪一个？这并不像仅仅取决于原始处理能力或处理器能带来的总 FLOPS（每秒浮点运算次数）那么简单。就像任何工具组一样，它取决于手头正在处理的任务。`CPUs`\
  \ 往往是一个很好的选择，正是因为它们擅长非常广泛的任务。由于有许多工作负载（机器学习和非机器学习）使用它们，它们的成本通常较低，而且它们不会遭受与其他类型处理器相同的供应链问题。另一方面，`GPUs`\
  \ 是专为管理流体动力学、图形渲染和深度学习等领域的复杂数学处理而构建的。最优处理器类型取决于你选择的算法。某些算法（以及某些版本，始终检查！）在训练期间更适合\
  \ `GPUs` 或 `CPUs`。\n\n在使用 `SageMaker` 时，正如你在后续示例中看到的，你为训练指定计算类型，为推理指定完全不同的计算类型。此外，你可以使用\
  \ `Amazon Elastic Inference` 将 `GPUs` 附加到你的 `EC2 Instances`, `Deep Learning Containers`。\n\
  \n### AWS Trainium\n\nAWS 已经超越了创建服务、解决方案和机制，加速机器学习从业人员创建自定义芯片。`Trainium` 是 AWS 创建的第二个机器学习芯片（我们将在\
  \ `第 8 章，蓝色或绿色]` 中介绍第一个，即 `AWS Inferentia`），旨在提供定制硬件。虽然在本书出版时它处于预览阶段，但 `Trainium`\
  \ 是为深度学习工作负载设计的。\n\n为了使用 `Trainium`，请注册预览并使用 `Trn1` 实例运行你的训练作业。\n\n# 迁移学习\n\n从零开始训练模型需要时间。在计算术语中，这意味着需要更多的时间或更多的处理器。通过使用已经在泛化数据集上训练过的模型，我们可以节省这些时间和计算资源。这在自然语言处理领域特别有用。我们可以使用在通用数据源（如维基百科）上训练的模型，使其理解我们语言的通用结构，然后在我们特定的训练集上对其进行进一步训练。\n\
  \n# 训练的准备\n\nMise en Place 是一个法语烹饪术语，意味着准备就绪。它是厨师在开始服务之前准备好一切并将其到位。在机器学习方面，我们已经在之前的章节中设置了大部分准备：仔细选择我们的问题、合并数据、通过特征工程进行切分和处理、设置转换并通过分析强化数据。在此基础上，我们还可以添加调料：模型训练期间产生的数据以及我们选择的模型参数范围。就这样，服务开始了。\n\
  \n# 定义模型训练和评估指标\n\n由于我们选择了 Amazon Web Services 作为我们的机器学习平台，我们的服务族是 `Amazon SageMaker`。它是旨在赋予、简化和使机器学习从业人员便利的服务集合。在我们训练所选模型所需的步骤中，我们将默认在适当的情况下使用\
  \ `SageMaker` 服务和方法。我们将为你展示的所有内容可以在本地或使用虚拟空间完成，但 `SageMaker` 可以轻松地为你节省时间和金钱。\n\n\
  \n\n\n机器学习是一个迭代过程。即使使用可以自动化该过程部分环节的工具，你可能仍多次完成相同的任务以获得最佳结果。现实世界中的大多数机器学习项目倾向于使用多一个模型，这会指数级地增加组合、参数、超参数以及仅训练等方面的数量。为了跟踪、组织并保持这些迭代的可视性，我们使用了\
  \ SageMaker Experiments。SageMaker Experiments 有两个方面：试验（trials）和实验（experiments）。试验是涉及单个训练任务（training\
  \ job）的训练步骤集合。实验是试验的逻辑分组。\n\n在我们创建训练任务时，可以传递一个额外的参数，将任务分配给某个实验。一旦你完成了训练任务，就可以将实验和试验数据加载到\
  \ `pandas` dataframe 中。这允许你轻松地使用绘图工具来实现实验结果的可视化。\n\n为了使用 Amazon SageMaker 创建我们的第一个试验或训练任务，我们还需要几样东西。第一是\
  \ `S3` 桶的 URL，我们在其中存储训练数据，并希望在其中存储训练后的模型（尽管这些不应该是同一个前缀，但如果你需要，可以使用同一个桶），第二是存储我们训练代码的容器或脚本。我们将在本章稍后部分介绍更多关于训练容器和脚本的内容，但目前，我们将使用\
  \ SageMaker 提供的算法之一。\n\n我们最后需要的是决定评估模型质量的指标。不同的模型和用途需要不同的指标来定义训练后模型的质量。我们在这里介绍一些指标并在随后的代码块中给出示例，但请确保在开始训练之前仔细阅读你所选算法的文档。\n\
  \n*   **绝对值**： \n    * **准确率 (Accuracy)**：准确分类的项目数与总项目数之间的比较。\n    * **RMSE**：均方根误差是预测值向量与观测值向量平方之间的距离。\n\
  *   **相对值**： \n    * **AUC**：曲线下面积聚合了所有可能的分类阈值的性能衡量结果。\n    * **F1 分数**：精确率（precision）和召回率（recall）的平均值。\n\
  *   **排序指标**： \n    * **NDCG**：归一化折损累计增益是推荐顺序的折损累计增益相对于理想顺序折损累计增益的归一化比例。\n    *\
  \ **MAP**：平均平均位置是真实边界框（ground truth bounding box）与检测框之间的比较。\n*   **算法属性**： \n  \
  \  * **Log-loss**：指的是预测概率与相应的实际真实分类之间的接近程度。\n\n此外，你可以通过识别一个作为多个单个指标加权和的复合指标，来同时使用多个指标。Amazon\
  \ SageMaker 提供了许多内置算法，这些算法带有各种损失函数和指标。\n\n这些只是评估你所选算法方法的一个小样本。如果这些看起来很困惑，不要惊慌！机器学习的基本原理之一就是迭代性。准备好采样不同的评估指标，以找出哪一个适用于你的预期结果。像一个好的美食家一样，我们将在本章采样几种。\n\
  \n# 设置模型超参数\n\n超参数是机器学习模型的“旋钮和杠杆”。它们提供了一种精细控制模型行为的方法。常见的超参数怀疑对象如下：\n\n*   迭代次数或轮次数（Epochs）\n\
  *   学习率\n*   动量\n*   正则化率或 Lambda\n*   小批量大小（Mini-batch Size）\n*   存储和计算资源\n\n为了从你的机器学习模型获得最佳性能，你需要仔细调整这些超参数。目标是找到一个能为你的问题提供最佳性能的组合。挑战在于这个过程可能是非常耗时的，因为需要使用不同的超参数组合多次训练你的机器学习模型。Amazon\
  \ SageMaker Experiments 不仅可以帮助分组我们的试验迭代，还可以跟踪这些实验，允许我们分析它们并选择最好的一个。\n\n此外，仔细考虑如何搜索超参数空间也是重要的。不建议使用尝试每种组合的暴力破解法，因为这可能非常耗时，并且可能永远找不到真正的全局最优。相反，使用像贝叶斯优化（Bayesian\
  \ optimization）这样的技术更好，它可以智能地搜索超参数空间。\n\n调整机器学习模型的方法有很多，但我们将专注于使用 Amazon SageMaker\
  \ 的自动模型调优功能。该功能底层使用贝叶斯优化，可用于调整各种机器学习模型。\n\n### 脚本 vs 容器\n\n在训练机器学习模型时，你有两种运行训练代码的主要选择：\n\
  \n*   在脚本中运行训练代码允许你使用任何想要的编程语言。然而，这可能是慢的，因为所有代码都需要在计算实例上执行。\n*   或者，你可以选择在容器中运行代码。容器是一个自包含的环境，包含了运行你的代码所需的所有内容，包括编程语言及其所有依赖项。\n\
  \n这样会更快，因为计算实例只需要下载并运行容器。\n\n你选择哪种选项取决于你最熟悉的编程语言以及哪种语言对你的问题最快。Amazon SageMaker 支持这两种选项，并为\
  \ Python 和 R 提供了易用的封装器。\n\n# 训练数据存储与计算\n\n训练数据是机器学习模型的基础。它是你用于训练机器学习模型的数据。一旦你训练了机器学习模型，你就会想要保存它，以便使用它进行预测。使用\
  \ Amazon SageMaker 内置的 `saveModel()` 功能并指定模型名称，保存机器学习模型是非常简单的。然后你可以通过调用 `loadModel()`\
  \ 函数随时重新加载机器学习模型。除了保存机器学习模型之外，你还希望保存训练数据，以便在需要时轻松重新训练机器学习模型。\n\nAmazon SageMaker\
  \ 通过 `S3` 的内置功能轻松保存你的训练数据。你只需将训练数据上传到 Amazon `S3` 桶，并在需要时下载。但为什么要在几行代码之后用它来训练模型时将其存在\
  \ `S3` 中呢？答案在于 AWS 给我们的力量和灵活性：抽象。\n\n当我们运行机器学习项目的代码时，我们通常处于某种集成开发环境（IDE）中。例如，Eclipse、IntelliJ、Visual\
  \ Studio Code。在我们的示例中，我们将继续使用 Amazon SageMaker Studio，这是一种基于云的 IDE，它将 SageMaker\
  \ 提供的各种 工具 工具到一个面向 ML 工程师的体验中。\n\n\n\n在我们选择的 IDE 中，我们拥有计算能力，这表现为正在使用的计算机的 CPU，或者是附加到我们\
  \ SageMaker Studio 实例的计算资源。我们还有一些存储空间，表现为正在使用的计算机的硬盘或附加到 SageMaker Studio 实例的存储空间。我们使用这两者来运行\
  \ ML 代码并存储所需的库，但如果我们想将它们用于训练，就必须为我们的 IDE 分配必要的资源，或者购买一台足够强大的计算机。这些方法行得通，但如果你只在活跃训练模型时使用这些算力，为什么要为所有这些计算能力付费呢？\n\
  \n相反，我们可以利用亚马逊云服务（Amazon Web Services）提供的活性和规模经济，仅为 IDE 分配所需的资源，并在需要时对计算资源进行抽象。我们的计算资源与\
  \ IDE 是分离的，因此我们需要一个易于相互集成的公共存储位置：`S3`。通过将训练数据存储在 `S3` 中，我们允许其他团队、项目和实验使用相同的数据。我们还可以具体指定训练时利用的资源数量，包括通过更大的实例（更多的处理能力和内存）进行垂直扩展，以及通过额外的实例进行水平扩展。\n\
  \n# 训练场景\n\n在本章中，我们将训练三个不同的模型，并详细介绍过程中的步骤。下所示的代码也包含在*[第 2 章，灌注数据湖]** 链接的 GitHub\
  \ 仓库中。运行这些笔记本将在 AWS 账户中产生费用，因此请确保清理你最终分配的任何资源。\n\n这些示例还假设你已经完成了理解数据以及进行特征工程的步骤，以精炼数据并为后续的模型做好准备。如果你需要复习，请阅读\
  \ *[第 3 章，使用特征预测未来]**。\n\n## 线性回归\n\n使用我们的葡萄酒质量（Wine Quality）数据集，我们想要根据其他属性预测白葡萄酒的质量。由于这是预测一个数值，我们可以使用\
  \ Amazon SageMaker 的内置算法：`XGBoost`。`XGBoost` 是一种非常流行的集成算法，这意味着它使用一组来自更简单模型的估计器来创建更快、更准确的预测。\n\
  \n尽管如此，让我们进入线性回归模型的开始。在接后的示例中，我们省略了一些起始部分，例如导入库、声明角色、列出存储桶以及其他使代码运行所需的项目，但你可以参考书中\
  \ GitHub 仓库中相关的 Jupyter Notebook 以获取完整运行的笔记本。\n\n我们做的第一件事是设置 `S3` 客户端，下载数据集，将其读入\
  \ `pandas` 数据帧，设置列并查看我们数据的总体细节：\n\n```python\ns3 = boto3.client(\"s3\")\n```\n\n\
  ```python\n!wget https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-white.csv\n\
  ```\n\n```python\ndata = pd.read_csv(\"./winequality-white.csv\", delimiter=\";\"\
  )\npd.set_option('display.max_columns', 20)\npd.set_option('display.max_rows', 50)\n\
  data.columns = [\n    \"fixed acidity\", \n    \"volatile acidity\",\n    \"citric\
  \ acid\",\n    \"residual sugar\",\n    \"Chlorides\",\n    \"free sulfur dioxide\"\
  ,\n    \"total sulfur dioxide\",\n    \"Density\",\n    \"pH\",\n    \"Sulphates\"\
  ,\n    \"Alcohol\",\n    \"quality\"\n]\nprint(data.shape)\ndisplay(data.head())\n\
  display(data.describe())\ndisplay(data.diagnosis.value_counts())\n```\n\n现在我们已经将数据加载到数据帧中，可以将其分为测试集、训练集验证数据集：\n\
  \n```python\ntrain_data, validation_data, test_data = np.split(data.sample(frac=1,\
  \ random_state=5621), [int(0.7 * len(data)), int(0.9 * len(data))])\n```\n\n`XGBoost`\
  \ 期望数据格式为无表头的 CSV 格式。对于验证数据，如果包含了我们要预测的特征，它会报错，因此我们也也删掉：\n\n```python\npd.concat([train_data['y_yes'],\
  \ train_data.drop(['y_no', 'y_yes'], axis=1)], axis=1).to_csv('train.csv', index=False,\
  \ header=False)\npd.concat([validation_data['y_yes'], validation_data.drop(['y_no',\
  \ 'y_yes'], axis=1)], axis=1).to_csv('validation.csv', index=False, header=False)\n\
  ```\n\n这完成了设置训练和环境的大部分工作，但现在我们进入模型超参数阶段。记住，超参数是模型本身外部的配置，其值无法从数据中估计。这与参数相反，参数是模型内部的配置，可以从数据中估计。一个最佳实践是始终仔细查阅算法超参数的文档，即使对于你频繁使用的模型也是如此。模型版本经常更新，范围、默认值和超参数的数量可能会发生。\n\
  \n对于我们选择的 `XGBoost` 算法，初始超参数值如下，并附解释：\n\n- `max_depth`：默认 6，决定给定树的深度。`XGBoost` 是一种决策树类型的模型，因此我们希望限制模型迭代的深度（从树根开始决策次数）。太浅了，我们的模型将足够的复杂性来学习；太深了，我们的模型迭代的改进微乎其微。设置的值越高，你的模型越可能从训练数据中学习过多或变得过拟合。\n\
  \n- `eta`：这指的是在每一步中应用多少收缩量，以防止过拟合。默认值为 0.3，当你需要应对潜在或实际的过拟合时应进行调整。\n\n- `gamma`：使树产生另一个叶节点时可接受的最小损失减少量。它用于确定决策树是否已生成了足够的叶节点（某种意义上的分支）。默认值为\
  \ 0，但我们希望我们的模型更保守一点。\n\n- `min_child_weight`：子节点所需实例权重的最小可能和。在我们的情况下，这设置了每个节点所需的最小实例数量。默认值是\
  \ 1，但我们将其调高，再次为我们的模型增加一些保守性。\n\n- `subsample`：这是在训练实例上采样的训练数据百分比。将其设置为 0.6 意味着我们正在采样\
  \ 60% 的数据。这主要用于防止过拟合。\n\n- `verbosity`：它控制模型的日志行为。我们可以设置为 0（静默）、1（警告消息）、2（信息消息）和\
  \ 3（调试消息），按消息量排序。我们通常在开始实验时将其设置得高一些以获取最多的日志，并在模型符合预期后将其调低。\n\n- `objective`：这是最重要的超参数之一。它指定了学习任务和相关的学习目标，定义了我们如何确定模型的训练质量。仅\
  \ `XGBoost` 就有近 20 种不同的目标，而我们使用 `reg:squarederror` 进行基于 RMSE 的线性回归。\n\n- `num_round`：这是运行训练的总轮数，是一个必填参数。我们可以限制它以检查一切，但我们希望调整它以获得的评估指标值。\n\
  \n现在我们可以按照如下方式设置模型的超参数。\n\n```python\nHyperparameters = {\n    \"max_depth\": 4,\n\
  \    \"eta\": 0.3,\n    \"gamma\": 3,\n    \"min_child_weight\": 7,\n    \"subsample\"\
  : 0.6,\n    \"verbosity\": 1,\n    \"objective\": \"reg:squarederror\",\n    \"\
  num_round\": 50\n}\n```\n\n\n\n\n\n## 超参数调优\n\n接下来要做的是设置我们将用于训练的容器。我们可以使用自己的脚本，但由于\
  \ `XGBoost` 是 SageMaker 的内置模型，我们不仅可以使用为该用例提供的托管容器，而且不需要知道模型存在哪个容器中，只需要知道我们所在的区域（`region_name`）、想要使用的框架（`framework`）以及我们需要的容器版本（`version`）即可。版本会更新，因此我们在这里将使用\
  \ `latest`，但务要检查哪些可用版本，如果你的训练突然出现问题或行为变化，而你正在使用 `latest`。\n\n```\nContainer = sagemaker.image_uris.retrieve(region_name,\
  \ framework='xgboost')\n```\n\n接下来，请记住我们不会在本地计算资源上训练模型；我们将使用一个仅为该目的而启动的实例。我们需要告诉该实例从哪里获取训练数据和验证数据：\n\
  \n```\ns3_input_train = sagemaker.inputs.TrainingInput(s3_data='s3://{}/train'.format(bucket,\
  \ prefix), content_type='csv')\n```\n\n```\ns3_input_validation = sagemaker.inputs.TrainingInput(s3_data='s3://{}/validation/'.format(bucket,\
  \ prefix), content_type='csv')\n```\n\n接下来，我们将创建 `Estimator`，设置我们的超参数并调用 `fit` 函数开始训练，同时提供我们的验证数据：\n\
  \n```\nsession = sagemaker.Session()\n```\n\n```\nxgb_estimator = sagemaker.estimator.Estimator(container,\
  \ role, instance_count=1, instance_type='ml.m5.xlarge', output_path='s3://{}/output'.format(bucket,\
  \ prefix), session=session)\n```\n\n```\nxgb_estimator.set_hyperparameters(hyperparameters)\n\
  ```\n\n```\nxgb_estimator.fit({'train': s3_input_train, 'validation': s3_input_validation})\n\
  ```\n\n此命令将训练我们的模型并将其存储在估计器的 `output_path` 中。记住，我们训练作业的结果也将存储在 SageMaker 的“训练作业”（Training\
  \ Jobs）下。这对于引用结果至关重要，尤其是你在周末之前完成的那些。\n\n一旦模型训练完成，我们为该目的创建的实例将关闭，从而最大限度地减少我们产生的费用。我们可以观察选择的评估指标，并查看我们是想保留它还是调整超参数并重新运行训练。这种观察结果并调整超参数或输入数据，直到我们接近理想结果的过程是典型且符合预期的。但如果我们能利用\
  \ AWS 的力量来缩短这种迭代周期呢？我们当然可以！\n\n上一个命令将列出我们训练模型的输出。要查看模型的整体性能，我们需要部署它并发送模型从未见过的数据，我们将在\
  \ 第 8 章，模型部署 中进行操作。目前我们关注的是训练阶段。我们有了一个模型，但如何知道超参数是否是正确的呢？正如之前提到的，我们可以训练、调整、训练并继续这个过程，直到获得最可能的结果。\n\
  \n或者，我们可以告诉 AWS 为我们完成所有这些工作。让我们在笔记本中继续，找出如何实现模型超参数调优自动化。我们做的第一件事是声明想要调优的超参数、它们的参数类型及其范围：\n\
  \n```\nfrom sagemaker.tuner import IntegerParameter, CategoricalParameter, ContinuousParameter,\
  \ HyperparameterTuner\n\nhyperparameter_ranges = {\n    'alpha': ContinuousParameter(0,\
  \ 2),\n    'min_child_weight': ContinuousParameter(1, 10),\n    'subsample': ContinuousParameter(0.5,\
  \ 1),\n    'eta': ContinuousParameter(0, 1),\n    'num_round': IntegerParameter(1,\
  \ 4000)\n}\n```\n\n你可以调优的超参数、其类型和范围通常可以在各自的算法文档中找到，但我们选择这些是因为它们对我们的模型的影响最大。以下代码识别了评估指标和指标类型：\n\
  \n```\nobjective_metric_name = 'validation:rmse'\nobjective_type = 'Minimize'\n\
  ```\n\n我们选择均方根误差（RMSE）是因为我们希望最小化预测值与实际值之间的距离。我们希望超参数产生的聚合（均值）预测尽可能接近我们的实际值。我们还确定了该指标旨在缩小差异：\n\
  \n```\nxgb_hp_tuner = HyperparameterTuner(xgb_estimator, objective_metric_name=objective_metric_name,\
  \ objective_type=objective_type, hyperparameter_ranges=hyperparameter_ranges, max_jobs=5,\
  \ max_parallel_jobs=5)\n```\n\n```\nxgb_hp_tuner.fit({'train': s3_input_train, 'validation':\
  \ s3_input_validation})\n```\n\n在这里，我们创建了调优作业对象并输入变量，但我们也设置了想要同时运行的调优作业数量以及最大作业数。这非常清晰地展示了\
  \ AWS 为机器学习项目的强大支持。我们可以同时运行五种不同的超参数变体。当然，我们可以每 2、3 或 6 个一组运行，并将总作业数设置为 10、20 甚至\
  \ 30 个，但记住，在本章中，我们是一位丰富的数据科学家，更重要的是，还是射手座的人。我们有立即完成任务的传统。\n\n代码的最后部分显示了如何在调优过的参数中自动选择最佳参数集：\n\
  \n```\nxgb_hp_tuner.best_params\n```\n\n代码的最后部分显示了如何在调优过的参数中自动选择最佳参数集：\n\n```\n\
  xgb_endpoint = xgb_hp_tuner.deploy(initial_instance_count=1, instance_type='ml.m5.xlarge')\n\
  ```\n\n\n\n\n\n在检查工单待处理列表（ticket backlog）时，我们的数据科学家惊讶地发现，过去一天内至少分配了十几个工单。他们可以按分配日期、优先级或请求者进行排序，但如果有一种方法可以分析工单的内容并获取情感倾向，利用它来确定实际的严重程度呢？有的！\n\
  \n和线性回归模型一样，为了节省页面空间，我们跳过了设置库、模块、存储桶（buckets）等步骤，但你可以在与本书相关的 GitHub 仓库中找到完整的笔记本。\n\
  \n我们首先设置几个稍后会引用变量，其中最重要的是我们将使用的 Hugging Face 分词器（tokenizer）名称：\n\n`dataset_name\
  \ = 'emotion'`\n`num_labels=6`\n\n`tokenizer_name='bert-base-uncased'`\n\nBert 是一个在大量（或语料库）英语数据上进行预训练的模型。我们可以利用这种预训练来节省大量的基础训练工作，然后使用迁移学习（transfer\
  \ learning）在我们选择的数据集上对其进行进一步训练。该模型是不区分大小写的（uncased），因为它不区分字母的大小写。这也适用于我们的场景，因为我们无法确定有人写的是“紧急”（urgent）还是“大写紧急”（URGENT），但我们应该对它们视为相同。最后，我们使用的是\
  \ Hugging Face 情感数据集。该数据集由 Twitter 信息（文本）和这些消息相关的基本情感（标签）组成。由于我们需要识别工单待处理列表的情感，这个数据集应该符合我们的需求。\n\
  \n`dataset = load_dataset(dataset_name)`\n`tokenizer = AutoTokenizer.from_pretrained(tokenizer_name)`\n\
  \n```python\ndef tokenize(batch):\n    return tokenizer(batch['text'], padding=True,\
  \ truncation=True)\n```\n\n`dataset_encoded = dataset.map(tokenize, batched=True,\
  \ batch_size=None)`\n\n接下来，我们使用 `datasets` 库中的 `load_dataset` 来加载数据集。然后，我们需要将文本分成更小的组件，并为模型训练做好准备。这被称为分词（tokenizing），我们使用的是\
  \ Hugging Face 库包含的预训练方法：\n\n```python\nmodel = (AutoModelForSequenceClassification.from_pretrained(tokenizer_name,\
  \ num_labels=num_labels))\ndataset_encoded.set_format(\"torch\", columns=[\"input_ids\"\
  , \"attention_mask\", \"label\"])\n```\n\n`Dataset_encoded[\"train\"].features`\
  \ \n\n在这里，我们创建了模型对象（包括分词器对象），设置了 `PyTorch` 格式，并根据特征设置了训练数据集：\n\n```python\nhyperparameters\
  \ = {\n    'model_name_or_path':tokenizer_name,\n    'task_name': 'mnli',\n    'output_dir':'/opt/ml/model',\n\
  }\n```\n\n这些是模型的超参数，特别是我们之前定义的 Hugging Face 分词器名称、任务名称以及模型的输出目录。我们使用多领域自然语言推理（Multi-Genre\
  \ Natural Language Inference）作为训练任务，因为它与我们选择的情感数据集相关。我们还使用了特定的输出目录，因为一旦我们的训练实例完成并在终止之前，模型将从那里导出：\n\
  \n`git_config = {'repo': 'https://github.com/huggingface/transformers.git','branch':\
  \ 'v4.17.0'}`\n\n```python\nhuggingface_estimator = HuggingFace(\n    entry_point='run_glue.py',\n\
  \    source_dir='./examples/pytorch/text-classification',\n    instance_type='ml.p3.2xlarge',\n\
  \    instance_count=1,\n    role=role,\n    git_config=git_config,\n    transformers_version='4.17.0',\n\
  \    pytorch_version='1.10.2',\n    py_version='py38',\n    hyperparameters = hyperparameters,\n\
  \    train_dataset=dataset_encoded[\"train\"],\n    eval_dataset=dataset_encoded[\"\
  validation\"]\n)\n```\n\n在这里我们做了一些有趣的事情。我们没有指定本地训练脚本或预先生成的容器，而是在远程 Git 仓库中指定了一个托管脚本。Hugging\
  \ Face 将在开始训练之前下载我们在仓库分支和位置中指定的脚本。这在使用诸如 Hugging Face 这样的框架时特别有用。我们还想使用单个 P3 2x\
  \ 实例来训练模型；P3 实例非常适合需要 GPU 的深度学习和自然语言处理。此外，我们设置了库的版本，添加了超参数，并指定了训练和验证数据集：\n\n`huggingface_estimator.fit()`\n\
  \n通过最后这一行代码，我们开始了训练任务。一旦完成，我们就可以部署模型并在遍历工单寻找其主要情感之前对其测试。\n\n## 图像分类\n\n在处理完任务列表的优先级和处置后，我们友好的数据科学家可以花点时间查看已分配的工单，该工单不仅带有情感色彩，而且主题还令人警觉：“明天进行图像分类演示！”\n\
