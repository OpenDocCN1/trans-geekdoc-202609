  \ 7 步）转换为印地语和法语，无需任何 ML 训练。导航到笔记本中的 Amazon Translate 部分，以遵循我们将在此处执行的指令：\n\n1. 执行第一个单元格以创建一个输出目录，存储我们翻译后的文本：\n\
  \n```python\n# Create an output translations directory\ndr = os.getcwd()+'/output-translations'\n\
