  \  错误\n\n## 答案\n\n1.  `b`\n2.  `d`\n3.  `d`\n4.  `a`\n5.  `b`\n\n# 第 8 章：蓝绿（模型部署策略）\n\
  \n### 引言\n\n蓝或绿。似乎是一个简单的问题，不是吗？准确率还是错误率？水平扩展还是垂直扩展？更多内存还是更多计算？GPU 还是 CPU？我们的可能性并不止于训练机器学习模型。你部署模型的方式会影响它的可用性和完成目标的能力。确保模型拥有正确的资源对于完成项目是必要的。在本章中，我们将讨论部署、扩展和监控模型所需的考虑因素。这包含了快速融合的\
  \ DevOps（以及 DevSecOps！）概念以及优化成本的必要步骤。要尝试本节的示例，请参考 `第 1 章 – 介绍机器学习工作流` 中的*技术要求*部分登录\
  \ AWS 管理控制台，执行加入 SageMaker Studio 的步骤，并执行克隆仓库到 SageMaker Studio 以开始。点击与本章节编号对应的文件夹。如果你看到多个笔记本，章节标题对应笔记本名称以便于识别。\n\
  \n### 章节场景\n\n在本章中，我们将扮演站点可靠性工程师的角色，与一个高度积极的数据科学家团队合作。这些科学家在过去过去一个季度里一直努力工作，完善训练各种机器学习模型的方法，测试它们的准确性，并为各种推理任务的使用做好准备。现在，在计划下季度的任务时，他们准备好将模型推到生产环境。我们的\
  \ SRE 熟练部署其他类型的开发相关制品，但从未处理过机器学习模型。作为 Ares，我们的 SRE 不害怕新任务和任务以及随之而来的压力。\n\n### 结构\n\
  \n\n\n\n在本章中，我们将讨论以下主题：\n\n*   部署机器学习模型的结构、考虑因素和方法\n*   Amazon SageMaker Endpoints\
  \ 提供的模型部署选项\n*   评估推理所需的各种计算选项的方法\n*   为您的推理端点实现资源自动扩展的方案\n*   部署机器学习模型进行推理的步骤\n\
  *   监控已部署模型需要考虑的因素\n*   更新已部署机器学习模型的有效策略\n\n### 目标\n\n我们在`[第 1 章，介绍机器学习工作流]` 中确定了机器学习项目的三个基本部分。在之前的章节中，我们涵盖了模型的训练和注册。最后一部分——部署您的模型，将我们在本章中回顾的内容。从为模型选择正确的计算选项，到决定需要完成的推理类型，本章将引导您完成选择、理解其含义以及如何实现它们。\n\
  \n## 推理选项\n\n推理被定义为根据证据和推理得出的结论。在机器学习语境下，推理是指向机器学习模型提供数据以计算输出的过程。该输出可以是数值评分、布尔值、分类、预测，甚至是一组旨在作为另一个应用程序（可能是另一个机器学习模型）输入的数据点。为了执行此推理，我们需要部署一个模型并使其能够接受这些数据，并返回其预测结果。这种部署行为是应用程序开发项目中预期的，但它包含一些独特的考虑因素，我们将在本章中介绍。我们的站点可靠性工程师将利用部署此类项目的经验来完成机器学习模型的部署。\n\
  \n从最根本上说，部署的机器学习模型首先需要一种方法来接收的结构化数据。方法的选择很大程度上取决于模型与发送数据的系统的交互类型。对于评估您的模型，部署一个简单的、单线程的、本地可的\
  \ REST 端点（特别是针对按需计算资源）是最优的。这允许您将验证数据发送到端点，并根据所选指标对其进行评估，然后销毁该 REST 端点。除此之外，主要的考虑因素应该是应用程序所需的响应时间。对于需要无论何时发送请求都能响应的应用程序，实时端点是优的。或者，异步推理（定期（通常按计划方式）向您的模型发送数据集）可以利用批推理的优势。在继续之前，让我们详细查看每一个选项。\n\
  \n**注意：什么是 REST API？表述状态转换（REST）描述了两个解耦系统之间的接口。在单体应用中，应用程序在内部传输逻辑，而单体结构本身管理该逻辑的结构和预期。在解耦应用（如机器学习服务）中，应用程序将交互方法和结构外部化到服务中。REST\
  \ 接口的工作类似于网站，并使用相似的方法进行交互。REST 接口适用于机器学习模型，因为我们可以向 REST 端点发送预定义的流量，而端点反过来可以处理模型的交互和响应。**\n\
  \n### 测试与验证\n\n通常，模型首次部署是在训练完成后立即。为了验证训练过的模型运行正常并符合您的预期需求，您需要能够向其发送流量并测量结果。您可以（也应该）使用测试数据集进行此类验证。测试训练过的模型通常很快：部署模型、向端点发送测试流量，然后销毁端点。\n\
  \n### 实时\n\n实时推理定义为一个已部署的模型端点，每当向其发送请求时它都是可用的。它的衡量标准不仅取决于模型本身的评估指标，还取决于端点的响应时间。此外，与所有模型部署方法一样，应该考虑推理规模的大小。随着并发请求数量增加，单个端点开始受到延迟影响，最终无法响应请求。\n\
  \n### 批量\n\n批推理也称为异步推理，用于您需要定期对数据集进行推理的场景。由于您在模型托管激活期间需要为相关的计算付费，除非您正在积极使用它，否则没有必要保持模型部署。通过仅在需要时部署模型，您使部署对象成为流程的一部分。此外，由于我们是在准备好用于推理的数据时才部署模型，我们可以对实例类型做出决策。如果我们的工作负载允许较长的处理时间，使用较小或更少的实例可以实现成本优化。同样，如果您选择的工作负载需要尽快处理，请考虑更大或更多的实例以优化速度。\n\
  \n### 流式\n\n流式推理尽管看起来实时，但面临一些独特的挑战。涉及的数据通常存储在消息或流总线上，该服务持有单个消息，直到消费者应用程序将其提取并处理。流总线通常不会更改源消息，因此与其他推理选项一样，需要一种将消息转换为正确格式以发送到模型端点的方法，以及一种交付方法。在\
  \ AWS 中，前者可以通过 `Kinesis Data Analytics` 在流中完成，将消息转换以准备推理。同样，您可以使用 `AWS Lambda` 作为流消费者，将转换后的消息发送到您的\
  \ `Inference Endpoint` 然后处理响应。对于流式推理，处理事务的量是您的托管选项的关键考虑因素。\n\n## 选择您的计算\n\n现在我们已经理解了托管模型的不同用例，我们需要考虑需要所需的计算资源。与计算选项相关的资源也用于驱动您的模型，因此您提供的动力越多，您的模型就能执行越激进的处理。然而，这并不一定是线性扩展的，因为无论提供原始处理能力还是内存，计算源通常都会达到某个水平。为了解决这个问题以及成本优化需求，可以在负载均衡方法之后利用多个计算实例。在这种样式下，请求将路由到池中的单个资源，而随后的请求将路由到不同的池成员。\n\
  \n\n\n\n\n从根本上说，部署机器学习模型的行为是创建一个 Web 服务来接收流量，将其发送到模型本身，然后返回响应。为了托管此服务，我们需要计算资源，这与我们训练模型时使用的类似资源有所不同。许多模型在推理期间的效率与训练期间不同，因此并不适用于“一刀切”的方法。此外，根据模型的不同的不同，训练和推理可能需要不同的资源。例如，`XGBoost`\
  \ 在 GPU 资源上的训练速度快得多，而从内存利用率来看，考虑到决策树集成在推理时存储在内存中，它在 CPU 实例上的推理性能表现最好。\n\nAmazon\
  \ SageMaker 托管允许我们在部署模型时选择实例类型，如果自己在 `EC2` 实例上托管模型，我们也可以执行相同的操作。在根据所选模型的相关文档对必要的系统资源进行初始估算后，实例类型可以被视为另一种超参数。与模型训练和调优过程中的其他超参数一样，找到资源和实例类型的正确组合是一个迭代实验的过程。有一些工具可以帮助这一过程，包括\
  \ `AutoML`、`AutoGluon` 和 `AWS Inference Recommender`。让我们之后来看这些工具。\n\n### 自托管 (Self-Hosted)\n\
  \n对于希望管理整个所选计算环境的实践者来说，自托管是一个强大的选项。在多个应用程序共享相同计算资源，或有监管要求阻止使用更多托管选项的情况下，管理自己的计算资源更为优。对于这些情况，分配一个或多个\
  \ `EC2` 实例来托管你的模型是最佳选择。\n\n使用这种方法，你可以为每个模型需求创建一个独立的自动扩展组，并利用 `EC2` 原生用户数据（user data）能力在启动时引导每个实例，以安装\
  \ Web 服务器资源、下载模型并更新本地应用程序包。以下是一个用于 Ubuntu 风格 Amazon 镜像（AMI）此类用户数据脚本示例：\n\n```bash\n\
  #!/bin/bash\nyum update -y\nyum install -y amazon-linux-extras\namazon-linux-extras\
  \ enable python3.8\nyum install python3.8\npython -m ensurepip --upgrade\npip install\
  \ flask\naws s3 cp s3://replacewithyourbucket/model/model.tar.gz .\naws s3 cp s3://replacewithyourbucket/flask/flaskapp.py\
  \ .\n```\n\n## Amazon SageMaker 端点 (Endpoint)\n\n使用 Amazon SageMaker 端点相比于自己托管模型提供了额外的灵活性；这意味着更多非差异化的沉重工作将由\
  \ AWS 处理。它还加快了过程，允许更快速的实验，并将单个端点作为可部署对象进行处理。\n\n如果你使用 `SageMaker SDK` 或 `Python\
  \ AWS SDK` (`boto3`)，在 Amazon SageMaker 中创建端点的方法略有不同。主要区别在于，使用 `SageMaker SDK` 需要创建\
  \ `Endpoint configuration”（端点配置），而使用 `Python AWS SDK` 则不需要。我们在这里回顾这两种方法的相同实现方式。\n\
  \n在 SageMaker 中创建端点的第一步是识别模型存储在 `S3` 中的位置，以及包含推理代码的自定义 Docker 镜像位置，或 SageMaker 内置容器的框架和版本。\n\
  \n**注意：虽然 S3 桶是全局资源，但它们在特定区域内创建并托管。包含你的模型产物的桶和 SageMaker 端点必须位于同一区域。**\n\n接下来，你将创建模型对象本身，引用容器镜像位置、`S3`\
  \ 模型位置以及用于 SageMaker 创建模型的 `IAM 角色`：\n\n```python\nfrom sagemaker.model import Model\n\
  model = Model(image_uri=container_url,\n model_data=s3_model_location,\n role=iam_role)\n\
  ```\n\n现在我们创建端点配置。这在我们在使用 `SageMaker SDK` 时是必要的。你需要为端点配置指定名称、用于模型的计算实例类型，以及一个模型变体列表（每个端点托管每个模型对应一个）。我们将深入讨论多模态端点（单个端点为多个模型提供流量），但以下示例用于单模型配置。你还将指定用于处理推理流量的实例数量：\n\
  \n```python\nendpoint_configuration = sagemaker.create_endpoint_config(\nEndpointConfigName=\"\
  Your Endpoint Config Name\",\nProductionVariants=[\n{\n\"VariantName\": \"Variant\
  \ Name\",\n\"ModelName\": \"Model Name\",\n\"InstanceType\": \"ml.g4dn.xlarge\"\n\
  \"InitialInstanceCount\": 1 # 启动的实例数量。\n}\n]\n)\n```\n\n最后，有了模型对象和端点配置，我们可以部署端点本身。你需要端点的名称和端点配置的名称。命令将返回所创建端点的\
  \ Amazon 资源名称 (ARN)：\n\n```python\nendpoint = sagemaker.create_endpoint(\n EndpointName=\"\
  Endpoint Name\",\n EndpointConfigName=\"Endpoint Config Name\")\n```\n\n如果你需要通过编程向你的端点发送流量，可以使用\
  \ Amazon SageMaker SDK 的 `invoke_endpoint` Python 方法：\n\n```python\nEndpoint_response\
  \ = sagemaker.invoke_endpoint(\n EndpointName=\"Endpoint Name\",\n Body=bytes('{\"\
  features\": [\"Inference Payload\"]}', 'utf-8')\n )\n```\n\n## 推理推荐器 (Inference\
  \ Recommender)\n\n当然，你可以将实例类型视为超参数并迭代选项，分析输出以确定速度和延迟的最佳组合。如果你以前在软件交付团队工作过，这个过程对你来说可能很熟悉，尽管它可能有另一个名字：负载测试。本质上，我们正在做相同的事情：通过请求对我们的托管模型施加压力，以观察处理器、内存和响应时间的结果。\n\
  \n幸运的是，AWS 包含一个可以从命令行界面 (CLI)、SageMaker Studio 或 Python SDK 访问的 API，可以为我们执行负载测试。使用\
  \ Python AWS SDK (`boto3`)，你可以创建一个推理推荐作业，识别你想要简单的推理推荐（默认）还是全细节的负载测试（高级）。你还需要在 SageMaker\
  \ 中注册的模型的 Amazon 资源名称 (ARN)。\n\n```python\nsagemaker.create_inference_recommendations_job(\n\
  JobName=\"InferenceRecommendationJob\",\nJobType=\"default\", # 或者 Advanced\nRoleArn=RoleVariable,\n\
  InputConfig={\n'ModelPackageVersionArn': ModelArnVariable\n})\n```\n\n一旦提交作业，它将运行并对你提供的模型进行分析，你可以通过\
  \ AWS 控制台或通过 `describe_inference_recommendations_job` API 检查结果，如下：\n\n```python\n\
  InferenceRecommendations = sagemaker.describe_inference_recommendations_job(\nJobName=\"\
  InferenceRecommendationJob\")\n```\n\n响应将详细说明有用信息，例如端点的每小时费用或每个推理请求费用。它还将包含 `InstanceType`\
  \ 字段，这是端点的推荐计算选项。\n\n## 无服务器 (Serverless)\n\n\n\n\n\n在从自托管到托管管理的规模远端，是无服务器推理（serverless\
  \ inference）。它非常适用于不可预测或仅定期发生的推理负载，以及那些能够容忍初始响应微小延迟（称为“冷启动”）的负载，它负责管理所选计算资源的全部、扩展和管理。在成本方面，你只需为端点使用期间付费，而无需为空闲或未使用的时间付费，这对于实验以及需要间歇性可用的负载来说都是一个很有吸引力的选择。无服务器推理端点的唯一必需参数是已注册的模型定义（例如我们之前创建的那个）以及一个包含生产配置无服务器配置的端点配置。该配置应包含端点的可用内存（MB）以及定义端点可以同时处理的并发调用数量的最大值：\n\
  \n```python\nServerlessEndpointConfig = sagemaker.create_endpoint_config(\n  EndpointConfigName=\"\
  ServerlessEndpointConfigName\",\n  ProductionVariants=[\n  {\n    \"ModelName\"\
  : \"YourModelName\",\n    \"VariantName\": \"ServerlessTraffic\",\n    \"ServerlessConfig\"\
  : {\n      \"MemorySizeInMB\": 3072,\n      \"MaxConcurrency\": 6\n    }\n  }\n\
  ])\n```\n\n**注意：冷启动是指你的端点最近没有收到流量，导致其后的计算资源需要重启，你的推理容器需要重新下载，且你的模型需要重新部署。当你使用无服务器推理端点时，请确保你的应用程序能够处理请求中可变的初始延迟。**\n\
  \n## 自动伸缩 (Autoscaling)\n\n由于 AWS 提供了托管我们模型的按需计算资源，我们还可以使用自动化管理所需的所需的资源，当我们选择的指标超过预设阈值时就会添加这些资源。同样，当相同指标低于较低阈值时，我们可以配置资源缩缩。有了这些机制，我们的端点能够在需要时扩展以匹配需求，并在不需要时缩回以节省成本。\n\
  \n要创建自动伸缩策略，你首先需要考虑你的扩展指标和扩展方法。在方法方面，有两种选择：目标跟踪（target-tracking）和阶进伸缩（step scaling）。目标跟踪是推荐的方法；这意味着\
  \ AWS 将通过扩展你的模型（添加计算资源）来维持你选择的指标。例如，如果你的指标 `InvocationsPerInstance` 等于 100，那么当该指标超过\
  \ 100 时，将添加更多的计算实例。一旦它在预定义的时间内低于该数值，这些资源将被移除。同样，对于阶进伸缩，你设置一个上限和一个下限静态值，来控制何时将计算资源添加到池中以使用你的模型处理推理请求。\n\
  \n一旦你准备好为已部署的端点添加自动伸缩策略，你就可以选择目标指标、设置扩展的最小和最大级别、一个控制策略在添加或移除实例前等待多少秒的冷却策略（cool down\
  \ policy），以及该策略执行操作时将使用的角色。\n\n对于你的目标指标，请选择一个代表你的模型为了在既定服务水平协议 (SLA) 内运行良好所需保持的中间状态的指标。默认指标是\
  \ `InvocationsPerInstance`，它将管理池中每个计算实例同时处理的调用次数。如果你刚开始使用自动伸缩，请从此指标开始。\n\n你的最小和最大容量设置了伸缩策略的下限和上限。你不会希望一直扩展到零，也不希望在流量激增时没有上限。考虑使用上述的\
  \ `Inference Recommender` 任务来确定你模型的预期流量模式，从而设置扩展指标以及你的最大和最小级别。\n\n你的冷却期控制伸缩策略在添加或移除实例之前暂停的间隔。该时段的主要目的是确保在上一次伸缩活动完成之前，不会从池中添加或移除实例。默认值为\
  \ 300 秒，你可以独立设置缩容（scale in）和扩容（scale out）的值。以下是一个你可以在下一步中使用的伸缩策略示例，将该策略应用于你已注册的模型：\n\
  \n```json\n{\n  \"TargetValue\": 120.0,\n  \"PredefinedMetricSpecification\": {\n\
  \    \"PredefinedMetricType\": \"SageMakerVariantInvocationsPerInstance\"\n  },\n\
  \  \"ScaleInCooldown\": 700,\n  \"ScaleOutCooldown\": 200\n}\n```\n\n一旦你定义了模型（如下所示）并定义了伸缩策略，你就可以使用\
  \ AWS CLI 或 Application Auto Scaling API 将伸缩策略应用到注册的模型：\n\n```bash\naws application-autoscaling\
  \ put-scaling-policy \\\n  --policy-name AutoScalingPolicy \\\n  --policy-type TargetTrackingScaling\
  \ \\\n  --resource-id endpoint/ProductionVariantName \\\n  --service-namespace sagemaker\
  \ \\\n  --scalable-dimension sagemaker:variant:DesiredInstanceCount \\\n  --target-tracking-scaling-policy-configuration\
  \ file://scalingPolicy.json\n```\n\n## 边缘推理 (Inference at the Edge)\n\n到目前为止，我们提供的示例都涉及在云环境中托管模型并向该环境发送流量，这就像我们处理标准应用程序一样。某些负载需要模型和相关的推理更靠近负载部署的地方，甚至运行在现场的专用硬件上。监控组装流水线并使用计算机视觉检测缺陷的摄像头、监控远程站点财务交易的网关设备，以及会议室中的实时翻译服务，都可以边缘推理的示例。\n\
  \n这种方法和实现带来了独特的挑战，例如本地资源有限以及消息返回到系统的延迟。\n\n幸运的是，Amazon SageMaker 有一种方法来管理这类远程部署（称为边缘部署），即\
  \ SageMaker Edge Manager。以这种方式部署的模型需要特殊的准备工作——编译，我们将在本节中介绍。除此之外，SageMaker Edge Manager\
  \ 允许你在各种远程位置打包、部署、执行和监控模型。\n\n简而言之，这套设置是创建一个物联网 (IoT) 工作流。整个物联网应用管理本身就是一本书的内容，因此请务必详细回顾。尽管如此，Edge\
  \ Manager 已为你处理了大部分繁重工作。\n\n# 模型编译\n\nSageMaker Edge Manager 需要编译后的模型才能部署到你的边缘位置。使用\
  \ Amazon SageMaker 服务，SageMaker Neo 允许我们在训练和评估模型后执行此。以下使用的是 Tensorflow（作业要求框架全大写）并部署到树莓派\
  \ 3。\n\n```python\nsagemaker.create_compilation_job(\n  CompilationJobName=\"CompilationJobName\"\
  ,\n  RoleArn=sagemaker_role_arn,\n  InputConfig={\n    'S3Uri': s3_model_location,\n\
  \    'DataInputConfig': {\"data\":[1,3,224,224]},\n    'Framework': \"TENSORFLOW\"\
  \n  },\n  OutputConfig={\n    'S3OutputLocation': s3_output_location,\n    'TargetDevice':\
  \ \"rasp3b\"\n  },\n  StoppingCondition={'MaxRuntimeInSeconds': 1200}\n)\n```\n\n\
  接下来，你需要打包编译后的模型。打包过程会添加所有必要的组件，以确保你的模型准备好部署到远程边缘位置：\n\n```python\nsagemaker.create_edge_packaging_job(\n\
  \  EdgePackagingJobName=\"PackagingName\",\n)\n```\n\n\n\n\n\n```python\n`CompilationJobName=\"\
  CompilationJobName\",`\n`RoleArn=sagemaker_role,`\n`ModelName=model_name,`\n`ModelVersion=\"\
  1.0.0\",`\n`OutputConfig={\n  \"S3OutputLocation\": packaging_s3_output\n}\n```\n\
  一旦你获取了模型包并在 AWS IoT 中注册了设备，就可以使用 AWS IoT Fleet Manager 将模型包和相关模型部署到设备上。你还可以使用 Fleet\
  \ Manager 更新模型、部署额外的模型，并从模型中获取监控指标。\n\n### 部署机制\n\n由于我们正在使用 Amazon SageMaker，在我们进行训练过程中，创建了一个估计器对象（estimator\
  \ object）并在该对象上调用了 `.fit()` 来开始训练。使用同一个对象，假设我们正在使用 Amazon SageMaker Python SDK，我们可以调用\
  \ `.deploy()` 创建一个推理节点，用于验证我们训练好的模型。以下示例是不完整的；要查看完整的工作代码，请检查书籍开头提供的相关 GitHub 仓库。\n\
  \n现在我们已经对模型托管相关的概念有了坚固的理解，让我们来看看这位初接触推理的 SRE（站点运维工程师）为了帮助团队中的数据科学家将采取哪些选项。检查他们的工单队列，这位充满活力的\
  \ SRE 发现已经有三个请求在等待他们。\n\n第一个是部署一个模型来帮助叙事生成（narrative generation）。显然，数据科学团队已经厌了为他们的摘要编写填充文本，希望使用他们听过的某些新模型来提供帮助。\n\
  \n第二个是部署一个他们已经完成训练的线性回归模型。该模型将支持一项正在进行的实验，并且能够快速响应。他们期望模型响应的接收时间在每个请求少于 100 毫秒。\n\
