  \n\n\n\n作者是一个自诩的超级英雄粉丝，尤其是钢铁侠（罗伯特·道尼·小子的表演得太棒了！）。如果你探索漫威电影宇宙（MCU）提供的内容，大多数英雄和反派要么通过超级血清或变异改变了，要么就是神灵或外星人。只有少数是具有非凡潜力的人类，而钢铁侠就是其中之一。钢铁侠之所以特别，在于他的天才以及一套由名为\
  \ `Jarvis` 的人工智能驱动的飞行战甲。`Jarvis` 具备自动语音识别、自然语言理解、飞行控制、自动驾驶、导航、武器命令与控制、威胁评估以及战略/战术即兴等能力，功能非常强大，托尼·斯塔克（钢铁侠）与\
  \ `Jarvis` 在战斗序列中的互动是一种视觉享受。战甲的动力源是外星技术，但让这些任务或能力成为可能的是算法的集合。托尼在第一部《钢铁侠》中用算法设计了这些模块，并随着需求的演变增加了新功能（例如《复仇者联盟》中的远程机甲控制）。从比喻的角度来说，算法可以被认为是\
  \ AI 系统的核心。AI 的智能水平取决于它学习和执行任务以实现预期结果的效能；因此，算法是 AI 系统实用性的核心。\n\n例如，考虑一个在你输入句子时自动建议单词的\
  \ AI 应用。通过选择一个算法并在大量的文档集上进行训练，以创建一个模型，当上一组词作为输入时，该模型可以预测下一个词。算法包含了计算逻辑和语义，用于确定如何将语料库中的单词分词（tokenize）为数值向量，如何将向量嵌入潜在空间以捕捉单词与句子上下文之间的关系，以及如何近似一个函数来预测学习过程结果的下一个词。事实上，算法是一组共同工作的数学方程，它们通过迭代来最小化数据中实际值与预测值之间的差异（监督学习），识别数据中的逻辑分组或模式（无监督学习），并根据激励决定行动（强化学习）。幸运的是，由于对机器学习（ML）和人工智能的需求增加，以及云计算技术的进步使其更易获取，我们现在处理算法时不必再担心去读数学博士学位。我们可以把数学和科学留给科学家/研究人员，使用\
  \ ML 框架提供的流行编程语言中的抽象 API，根据我们的需求选择合适的算法来建立 ML 训练。通过 AWS AI 服务，我们实现了更高级别的抽象，通过使用\
  \ API 将 AI 直接嵌入我们的应用程序中，而无需 ML 技能或模型训练。我们将在 `第 10 章，通过感知认知添加智能` 和 `第 11 章，用于工业自动化的\
  \ AI` 中详细介绍这些 AI 服务。\n\n在之前的章节中，我们通过引入 AI 和 ML 铺了基础，带你了解了 ML 工作流的状况、为什么以及如何在 AWS\
  \ 中设置数据湖存储、如何将数据摄入数据湖、如何运行特征工程等数据处理任务，以及如何使用 `AWS Glue ETL` 和 `AWS Glue DataBrew`\
  \ 为你的 ML 工作负载自动化数据编排管道。这些章节帮助你学习了如何与数据工作，以及如何将其准备好用于 ML 训练。下一组任务对应于 ML 工作流中的模型训练阶段，如图所示：\n\
  \n![](img/Figure-5.1.jpg)\n\n**图 5.1：** ML 工作流的模型训练阶段\n\n在本章中，我们将学习什么是算法和神经网络，学习在何时使用它们，并使用\
  \ Python 代码示例来理解如何为不同类型的 ML 用例设置估计器并拟合模型。\n\n### 结构\n\n在本章中，我们将深入探讨以下主题：\n\n*  \
  \ 引入算法和神经网络\n*   简化算法与神经网络的权衡难题\n*   使用算法和神经网络构建 ML 解决方案\n\n### 目标\n\n那么，为什么我们要有一个关于算法的章节呢？为什么不直接跳到模型训练并结束它？如果我们的目标只是向你展示如何构建和运行一个\
  \ ML 项目，我们可能已经做了。但在本书书中，我们希望通过“可能的艺术”来启发你。我们希望你体验今天 AI/ML 所涵盖的方案选择的广度和深度。我们希望你亲手学习如何使用\
  \ AWS AI/ML 解决世界上一些最大的挑战；这就是我们设计这一章的原因，加强你在算法和神经网络方面的知识，这是 ML 的核心。在本章中，我们首先将学习算法是如何产生的、是如何演变的、神经网络是如何产生的，以及今天如何使用一种名为深度学习的技术通过大规模机器学习解决复杂问题。然后，我们将回顾一个决策矩阵，基于\
  \ `第 1 章，介绍 ML 工作流` 中学到的知识，根据用例导航到特定的算法。最后，我们将获得实践经验，尝试流行的算法和神经网络，设置估计器并运行基础训练任务。\n\
  \n## 引入算法和神经网络\n\n算法的历史早于计算机的历史。根据在线词源字典（`[`www.etymonline.com/word/algorithm`](https://www.etymonline.com/word/algorithm)`），algorithm\
  \ 一词是阿拉伯语、法语、希腊语和拉丁语词汇的汇，它们都指向数字和计算。这个词可以追溯到 17 世纪，直到 20 世纪（计算机时代）它被广泛使用和接受之前，其意义没有太大变化。本质上，它指的是一组遵循逻辑顺序以执行特定任务的数学函数。这很棒，但它到底意味着什么？为什么它在计算机背景下呈现了新的形式？从根本上说，这个思想是简化复杂的计算。发明和发现与人类的演变密切相关。在过去的几个世纪里，我们一些大的科学和工程突破的核心都是数学，而解决数学是构建发明的重要部分。但这些是极其复杂的任务，是计算密集型的，并且无法手动解决。所以，在发明改变生活的物品时，我们也一直在试图发明帮助我们更容易、更快计算的工具。\n\
  \n\n\n\n算盘就是此类工具之一。目前尚不清楚是谁在何时发明了它。古老的文献最早在公元前 2500 年就提到了算盘，它出现在世界上许多地区的文献中，甚至一直延续到近期的\
  \ 17 世纪。它曾非常流行（直到现在仍有人喜欢使用它），直到它被计算尺取代，随后最近又被更快的计算器和计算机所取代。关于算盘和计算尺历史的详细阅读，请参阅 `https://www.sliderulemuseum.com/Abaci.htm`。\n\
  \n算盘可以执行 `add`、`subtract`、`divide`、`multiply`、`square root` 和 `cubic root` 等基础算术运算。它的设计非常木框，上面有垂直或水平排列的金属丝/细杆，上面系着珠子。珠子可以沿着\
  \ `wire`/`rod` 移动，珠子的位置和数量表示了计算过程和运算结果。惊讶的是，算盘可以处理高达数十亿的大数字计算。今天，算盘在小学中被用于教儿童如何用有趣的方式进行计算，由于其基于触觉的学习特性，也被用于教授视障人士教学。\n\
  \n如果（希望这永远不会发生）我们的太阳发射出一个足够强大的电磁脉冲，禁用世界上所有的电子设备，那么算法看起来将会是这样，因为我们除了信赖的算盘或计算尺外没有别的解决方案。\n\
  \n### 问题\n编写一个算法来确定以光速从地球到火星需要多久。\n\n### 算法\n1. 光速为每秒 30,000 公里。\n2. 光速等于每小时 30,000\
  \ 乘以 3600。\n3. 地球与火星之间的距离为 2.25 亿公里；光速旅行的时间是 `Step 3` 的结果除以 `Step 2` 的结果。\n\n这看起来可能过于简单了，但请记住，算法的核心思想是将复杂的计算分解为简单的逻辑步骤序列，以便在给定输入得出结果。前面的例子是一个经典的确定性算法。正如单词所示，确定性意味着算法的轨迹是预先确定的，或者为了幽默起，算法遵循它的命运。在算法范围之外没有任何东西可以影响它的方向或结果，在给定相同输入的情况下，它将一致地产生相同的结果。当然，算法可以是有条件的，但条件和动作必须顺序化到它的结构中。考虑例如，你走向银行的\
  \ `Automated Teller Machine`（或 `ATM`）去提取现金，并插入卡片。机器读取卡片上的磁条，确定你的账户详情，当你输入 `PIN`\
  \ 时，它验证你输入的 `PIN` 是否与卡片设置的一致。如果 `PIN` 正确，它会向你展示主菜单，你可以执行多项交易，包括取款。如果我们视觉化一个定义取款流程的算法，它将类似于下面的图片：\n\
  \n![](img/Figure-5.2.jpg)\n\n**图 5.2：** 确定性算法示例\n\n在这种情况下，只要算法的输入保持不变，处理过程和输出将保持一致。这意味着算法没有注意力跨度或记忆，并且不会从它处理的数据中学习。因此，如果遵循了正确的处理步骤，算法将无法区分真实用户和欺诈用户。\n\
  \n### 概率算法\n\n另一种同样受欢迎的算法类型，特别是在人工智能（AI）和机器学习（ML）中，是概率算法。与确定性算法相反，能够推导出泛化函数或近似函数的算法被称为概率算法。本质上，这里存在随机性的起作用，它可以从任一方向影响结果，但这种随机性质又通过迭代被同化。因此，概率算法非常适合机器学习。一个经典的例子是强化学习\
  \ (`https://docs.aws.amazon.com/sagemaker/latest/dg/reinforcement-learning.html`)，其中智能体通过与环境交互并采取行动来学习，如果动作以最快的方式引导目标则获得奖励。在\
  \ AWS，`DeepRacer` (`https://docs.aws.amazon.com/deepracer/latest/developerguide/what-is-deepracer.html`)）是强化学习的一种趣味实现，让机器学习的学习变得实践且有趣。`action\
  \ space` 决定了智能体在环境中可以采取可能的动作，这是训练期间学习过程的结果，由 `reward function` 提供反馈。智能体可以从可能的动作列表中采取一个动作（在\
  \ `discrete action space` 中），或者在特定的属性范围内选择一个动作（在 `continuous action space` 中）。无论何种方式，动作都是概率性的，奖励的组合和迭代驱动了模型的学习方面。参考\
  \ `figure 5.3`：\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3：** AWS DeepRacer 的离散动作空间\n\
  \n算法在它的自然状态下只是文字和数字，纯粹是理论性的。当它的语义转换为指令并使用算盘、计算尺、计算器和计算机等工具执行时，它就活了过来。简单来说，用例或问题解释了“为什么？”，算法是对“什么？”的回答，而工具帮助解决“怎么做？”因此，算法是实现所需结果的解决方案或任务的蓝图。当我们使用计算机完成某事时，第一步是为任务创建一个算法；然后，我们用选择的语言编写程序来使算法代码化。今天，我们大多数任务都有现成的程序和应用程序，但请记住，每个成功的程序背后都有一个遵循其命运（确定性的）或创造新的（概率性的）算法。\n\
  \n### 决策树\n\n在本章的开始，我们讨论了算法是计算机的大脑。在机器学习的情况下更是如此，我们训练计算机学习近似值，以根据输入预测输出。机器学习算法定义了预测函数的学习路径，在训练期间，构成算法的数学方程应用于训练数据集，以创建一个理解规则的模型，从而根据输入产生输出，并变得智能。将其与不涉及学习或建模而是执行预定义指令的确定性算法进行对比。我们将在下一节介绍不同类型的机器学习算法，但让我们简要讨论一下监督学习中最流行的算法族：决策树。我们在第一章《机器学习工作流》中简要介绍过决策树，其原理是利用数学从训练集中构建树，这列出了模型学习的决策规则，然后模型用它对未见的输入进行预测。决策树最常见的形式是`分类回归树`或\
  \ `CART`，正如名称所示，我们用 `CART` 用于分类问题（预测类别或分类）或回归问题（预测数值）。参考 `figure 5.4`：\n\n![](img/Figure-5.4.jpg)\n\
  \n**图 5.4：** 决策树\n\n\n\n\n\n在训练过程中，标记过的输入数据集（是的，决策树使用监督学习）被输入算法算法，以构建一个代表训练数据集的树。构建分类问题决策树最常用的数学函数是\
  \ `Entropy`（熵）、`Information gain`（信息增）和 `Gini Impurity`（基尼不纯度），而回归问题使用的是 `Reduction\
  \ in Variance`（方差还原）。这些函数类似于决策树的 DNA，决定了树的结构、它可以有多少个节点、这些节点来自特征集的哪些部分、它可以有多少个分支、分支是什么，以及最终以多少个叶节点结束。欲更多信息，请访问此链接：[`scikit-learn.org/stable/modules/tree.html`](https://scikit-learn.org/stable/modules/tree.html)。\n\
  \n### 熵与信息增\n\n从高层次来说，熵是衡量分类用例中跨类别数据分布的混乱或无序程度的指标。通常情况下，它是一个 0 到 1 之间的值，但在某些情况下可能大于\
  \ 1。数值越接近 0，数据分布越不混乱，反之亦然。如果熵偏向于某个方向，则表明数据集对类别分布的采样不足，无法进行近似。如果熵强力倾向于 0，意味着模型可能过拟合；如果偏向于\
  \ 1，则可能欠拟合。\n\n**注意：此处讨论的熵不应与交叉熵（cross-entropy loss）混淆，后者包含了预测类别分布，是用于衡量模型在训练期间学习好坏的指标。**\n\
  \n通常情况下，数据集需要分层结构才能使决策树有效。应该有一个主特征，以及与该主特征值相关且不能独立使用的依赖特征。信息增是主特征的熵与依赖特征熵的加权平均值之间的差。通过计算我们表格数据集的熵和信息增，我们可以迭代地为数据设计决策树表示。为了理解如何操作，让我们考虑一个菜系选择决策树的表格表示。数据集如下表所示：\n\
  \n| 菜系选择 | 菜 | 饮食 | 辣度 | 决策 |\n| --- | --- | --- | --- | --- |\n| 意大利菜 | 披萨 | 素食\
  \ | 任意 | 是 |\n| 意大利菜 | 披萨 | 肉类 | 任意 | 否 |\n| 意大利菜 | 意大利面 | 任意 | 任意 | 否 |\n| 印度菜\
  \ | 任意 | 素食 | 中等 | 是 |\n| 印度菜 | 任意 | 素食 | Spicy | 否 |\n| 印度菜 | 任意 | 肉类 | 任意 | 否\
  \ |\n| 泰国菜 | 任意 | 任意 | 任意 | 否 |\n\n**表 5.1：** 菜系选择数据集\n\n在我们目前的示例中，很明显某些特征依赖于“菜系选择”，例如“菜”和“饮食”，但当我们拥有数百个特征和数百万行的大型数据集时，手动是不可能将它们组织成决策树的；这就是我们使用这些指标来自动计算和构建它们的原因。方法是首先根据每个“决策”为“是”或“否”的概率来计算“菜系选择”的熵，因为这最终是我们想要模型预测的内容。此处的熵公式如下：\n\
  \n`Entropy = -(P(\"Yes\")*log2P(\"Yes\") + P(\"No\")*log2P(\"No\"))`\n\n`Entropy\
  \ = -((2/7)*log2(2/7) + (5/7)*log2(5/7))`\n\n使用对数计算器 ([`www.rapidtables.com/calc/math/Log_Calculator.html`](https://www.rapidtables.com/calc/math/Log_Calculator.html))，我们得到以下结果：\n\
  \n`Entropy = -((0.285)*(-1.81) + (0.714)*(-0.486)) = -(-0.515 - 0.347) = 0.862`\n\
  \n接下来，我们计算“菜系选择”中三个类别（或值）的加权平均熵。我们使用之前相同的熵公式，但确定“菜系选择”中每个类别（如“意大利菜”、“印度菜”和“泰国菜”）的\
  \ `P(\"Yes\")` 和 `P(\"No\")`。例如，对于“意大利菜”，`P(\"Yes\")` 是 1/3，`P(\"No\")` 是 2/3。我们根据每个类别自身的概率对其熵进行加权。例如，数据集中菜系选择为“意大利菜”的概率是\
  \ 3/7。因此，平均加权熵的总体公式如下：\n\n`意大利菜概率 * 意大利菜熵 + 印度菜概率 * 印度菜熵 + 泰国菜概率 * 泰国菜熵`\n\n`(3/7)*-(1/3*log[2\
  \ + 2/3*log2)] + (3/7)*-(1/3*log[2 + 2/3*log2)] + (1/7)*-(1/1*log2(1/1) + 0*log[2)]\
  \ = 0.389 + 0.389 + 0 = 0.778`\n\n最后，信息增是两者之间计算出的差，如下：\n\n`0.862 - 0.778 = .084`。\n\
  \n为了构建决策树，我们计算所有主特征（具有依赖特征的）的信息增，并选择信息增最大的特征作为根节点。我们重复此过程，直到达到叶节点。\n\n# 决策树的基尼不纯度\n\
  \n划分分类问题决策树的另一种方法是 `Gini Impurity`（基尼不纯度），在数据集经过随机采样的情况下，它指示了分类错误的概率。它可以取 0 到 0.5\
  \ 之间的任何值，0 表示无不纯或分类完美或纯特征，0.5 则表示完全不纯。我们使用基尼不纯度值来确定决策树的节点。基尼不纯度为 0 的特征是叶节点，其余主特征中基尼不纯度最低的作为根节点。\n\
  \n```Gini = 1 - SUM[(Probability of occurrence of a class instance)²]\n```\n\n#\
  \ 回归的方差还原\n\n我们使用不同的指标来决定如何划分回归决策树，但使用方法与分类问题相同，即根据方差最小的特征选择下一个节点。我们此处指的方差是特征的统计方差。我们首先计算主特征的方差，选择方差最小的特征作为根节点；然后，计算依赖特征的方差，选择方差最小的特征来划分树，一直持续直到达到方差为\
  \ 0 的特征，即为叶节点。\n\n```Variance = SUM(feature value - mean of the feature value across\
  \ the dataset)²/count of feature values in the dataset\n```\n\n\n\n\n像决策树这样的机器学习（ML）算法非常适用于预测房价、检测欺诈交易、预测客户是否会购买产品以及常见的回归或分类任务。但如果我们需要一个机器学习模型来读取和理解图像或视频呢？例如，在操作可以穿越流量的自动驾驶汽车时，或者观察组织样本以检测肿瘤是否为良性。或者，假设我们想构建一个模型，自动为本章的每一页创建一个摘要段落。这些都是所谓的**深度学习**的示例，即非常全面地学习大量参数的能力。如果你还记得第\
  \ 3 章，使用特征预测未来，对于计算机视觉任务，图像的每个像素都是一个特征，而该特征又是颜色坐标向量和像素本身的位置。取决于所传达内容的复杂性，图像可能有数百万个甚至更多像素。图像分类任务可能需要数千张图像（甚至更多），而且模型需要高质量的图像来进行准确的预测。因此，我们需要一个更大、更广、更深的算法画布来让模型能够充分学习数据集。这正是神经网络用武场。\n\
  \n# 神经网络 (#toc.xhtml#s117a)\n\n我们在第 1 章，机器学习工作流简介中接触了神经网络。我们学到神经网络是一个模仿人类大脑功能的程序化和数学结构。我们首先为机器学习训练定义一个神经网络架构，从高层面上说，它是网络类型（可以根据我们的机器学习问题决定）、网络层数、每层中的神经元数量以及每层要使用的激活函数的组合。我们在设置神经网络时具有很大的灵活性，允许进行广泛的实验和迭代，以达到我们的目标指标。学习对应于每个神经元的权重值（随机分配的系数）在训练过程中是如何演变的，特别是在反传播期间。让我们来看一个例子来更好地理解这些概念，即我们用于确定菜系选择的决策树数据，但在使用神经网络解决相同问题的语境下。\n\
  \n我们将四个输入特征分别标记为：`F1=菜系选择`、`F2=菜肴`、`F3=饮食习惯` 和 `F4=香料等级`，并将类别标签决策标记为 `O`。假设我们的每个神经元都分配了一个初始随机权重（`W`），第一隐藏层的权重标记为\
  \ `WI`，第二隐藏层的权重标记为 `WH`，两者在训练期间都将被更新；还有一个偏置（`b`），它初始设置为 0，并在训练过程中也将被更新。我们将在隐藏层使用\
  \ `ReLU` ([`ml-cheatsheet.readthedocs.io/en/latest/activation\\_functions.html#relu`](https://ml-cheatsheet.readthedocs.io/en/latest/activation_functions.html#relu))\
  \ 激活函数，并在输出层使用 `Sigmoid` ([`ml-cheatsheet.readthedocs.io/en/latest/activation\\\
  _functions.html#sigmoid`](https://ml-cheatsheet.readthedocs.io/en/latest/activation_functions.html#sigmoid))\
  \ 激活函数来预测决策为“是”或“否”的概率。sigmoid 函数作为分类问题的逻辑回归函数非常有用。为了起见，我们将第一隐藏层中接收输入的神经元称为 `IN1`、`IN2`\
  \ 等。同样，第二隐藏层中的神经元被指定为 `HN1` 和 `HN2`，输出层神经元为 `ON1`。\n\n**注意：关于偏置在整个训练过程中应该是常数值，还是应该分配一个初始值并期望在训练期间像权重一样进行更新，存在不同的观点。在这个示例中，让我们假设偏置在训练过程中会更新。**\n\
  \n我们预测决策类别的神经网络架构将如图 5.5 所示：\n\n![](img/Figure-5.5.jpg)\n\n用于二分类的逻辑回归\n\n**注意：Sigmoid\
  \ 函数表示的 'e' 是一个数学常数约为 2.718，被称为欧数。**\n\n在训练过程中，数据集的输入特征将馈给神经网络。当神经网络遍历整个训练数据集时，这称为一个\
  \ epoch（迭代）。在这个示例中，每个观测（行）的四个输入特征的值通过输入特征值 (`Fi`) 与分配权重的乘积馈到第一隐藏层的每个神经元。然后将偏置 (`b`)\
  \ 加到该乘积上。这个计算值随后作为输入传递给 `ReLU` 激活函数，它返回 0 和计算值之间的最大值。如果计算值为负值，ReLU 返回 0；如果是正值，ReLU\
  \ 返回该正值。我们将第一隐藏层的 ReLU 表示为 `max(0, ∑Fi*WIi + b)`。我们在第二隐藏层重复此过程；然而，这次输入不是特征值，而是前一层每个神经元的激活值。我们再次应用\
  \ ReLU，标记为 `max(0, ∑INi*WHi + b)`。我们将激活值发送到输出层，输出层计算输入值与偏置的乘积，然后将其传递给 `Sigmoid`\
  \ 函数，将计算值转换为概率。这就是训练期间神经网络的正传播过程中发生的情况。\n\n神经网络预测的输出将与类别标签进行比较，并使用损失函数估计误差，例如分类问题中的交叉熵\
  \ ([`ml-cheatsheet.readthedocs.io/en/latest/loss\\_functions.html`](https://ml-cheatsheet.readthedocs.io/en/latest/loss_functions.html))\
  \ 或回归问题中的均方误差 ([`keras.io/api/losses/regression\\_losses/`](https://keras.io/api/losses/regression_losses/))。然后，我们使用一种不同的算法（它有一套自己的数学函数），称为误差反传播，计算如何从输出层一直回溯每个隐藏层来更新权重，以补偿估计的损失。一旦权重更新，我们再次遍历训练数据集，计算输出值，估计交叉熵损失，并再次反传播误差以更新权重。我们重复这个过程，直到模型收敛并达到我们的目标指标。\n\
  \n\n\n以上是对算法和神经网络的简要解释。我们可能需要一个章节，甚至一整本书，来深入探讨设置、配置和优化神经网络的各种方法。此外，根据用例的不同，有许多类型的神经网络和算法，你很容易迷失在这个迷宫中。为了让你易于根据需求理解什么是流行的、你应该使用何种算法或神经网络，帮助你在算法或神经网络之间做出选择，并辅助你考虑可能存在的其他因素（例如超参数调优或要使用的评估指标），下一节将提供关于在何时使用什么内容的指南。我们还将详细查看其中某些算法、如何以及为什么要使用它们，以及其他考虑因素。\n\
  \n# 简化算法与神经网络的困难题\n\n你可能认为这些都很棒了，但我该如何使用这些信息呢？我到底该如何开始决定使用算法还是神经网络？我应该什么时候使用算法，什么时候该使用神经网络？这些都是完全合理且实际上非常有价值的问题。技术公司和开源社区的创新速度之快，让人很难跟上正在发生的变化。事实上，在\
  \ AWS，我们根据客户反馈，在 2021 年为 AI/ML 增加了超过 250 多个新功能。幸运的是，帮助就在手边；在本节中，我们将首先讨论哪些参数帮助我们做出\
  \ ML 算法（以及神经网络）选择、如何选择算法，最后如何判断我们是否做出了正确的选择。\n\n当你准备确定要采用的算法或神经网络候选列表时，你应该已经对 ML\
  \ 工作流中的某些关键考虑因素有了答案，如[图 5.6]所示。\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** 选择算法的考虑因素\n\
  \n### 什么 ML 领域？\n\n首先，我们查看试图解决的业务挑战，并判断它是否真的是一个 ML 问题。如果我们的需求可以通过确定性方法（即事件根据条件按照预定义的路径触发动作，并每次产生一致的结果）来解决，那么我们不需要\
  \ ML。如果我们需要根据历史数据预测未来结果、为未见的输入推导类别，或从模糊的数据点中发现模式，我们可能需要 ML 解决方案。在这种情况下，你需要首先理解你正在面对的\
  \ ML 领域（哪种类型的 ML 问题）。如果你需要 ML 进行图像分类、检测图像中的物体或分割图像，那么你的 ML 领域就是计算机视觉或 CV。如果你的需求是理解人类语言，你的领域是自然语言理解或\
  \ NLU。如果你的需求是处理文本、从文本中提取见察或基于文本进行分类，你的领域是自然语言处理或 NLP。如果你正在处理表格中的业务数据并需要从中预测或推导见察，你的领域就是表格数据处理。\n\
  \n### 什么 ML 用例？\n\n一旦我们获知了 ML 领域，下一步是更深入地了解用例。例如，如果我们的领域是 CV，那么我们希望 ML 模型在 CV 中中做什么呢？我们是希望模型查看图像并将其归类为预定义的类别（图像分类）？我们是希望模型查看图像中的物体、画出边界框并指出边界框内的物体是什么（目标检测）？我们是希望模型查看图像并通过分类像素来分割物体（语义分割或实例分割）？或者我们是想查看视频并识别物体或分类特定帧（图像分类或目标检测）？或者我们可能想处理图像，以确定与环境交互的智能体的下一步行动（使用强化学习进行策略优化；更多细节请访问\
  \ [https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html]）。如你所见，用例与我们为实验选择的算法有直接关系。但我们不能仅限于这些信息；我们还需要知道应该使用什么框架，以及数据是否有用的特征。\n\
  \n### 什么 ML 框架？\n\n正如技术领域的常态，那里有很多 ML 框架；有时决定我们需要什么可能会显得无所从。例如，对于回归、图像分类和强化学习等任务，你可以同时使用\
  \ Tensorflow ([https://www.tensorflow.org/]) 和 PyTorch ([https://pytorch.org/])，但对于链接预测问题，你可以使用\
  \ Deep Graph Library 或 `DGL`。你可以使用 sci-kit learn ([https://scikit-learn.org/]) 处理几乎任何任务，但在\
  \ ML 框架中进行时间序列预测，只能使用 GluonTS ([https://ts.gluon.ai/])、循环神经网络 `RNN` ([https://stanford.edu/~shervine/teaching/cs-230/cheatsheet-recurrent-neural-networks])、序列到序列或\
  \ `Seq2Seq` ([https://blog.keras.io/a-ten-minute-introduction-to-sequence-sequence-learning-in-keras])。如你所见，没有关于何时使用什么的明确指标，也绝对没有一种适用于所有的技术。作为一个通用指南（请记住，ML\
  \ 技术扩张的速度比我们的宇宙还快，变化是该领域唯一的恒变量），作者建议在所有 ML 领域使用如 MXNet、`Tensorflow` 或 `PyTorch`\
  \ 等流行框架，因为它们有大量的辅助函数、API、支持和示例供入门。对于常见的 ML 任务，作者推荐尝试 Amazon SageMaker 内置算法 (https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html)，这消除了选择、配置、测试和确定算法及框架的重复性体力工作。\n\
  \n### 什么 ML 数据特征？\n\n数据是驱动 ML 模型的燃料。模型的“智能”在于它对输入特征（数据跨行的列值）与目标特征（我们希望模型预测的内容）之间关系的解释。算法的选择取决于从数据集中选择的特征的元数据，例如数据结构、格式和数据类型。例如，如果我们拥有表格格式且具有数值数据的关系型数据，我们正在尝试进行时间序列预测或回归；因此，我们将选择能够执行这些函数的算法。如果我们拥有具有分类数据的表格数据结构，我们最可能在进行分类，因此我们会选择诸如朴素贝叶斯\
  \ (https://scikit-learn.org/stable/modules/naive_bayes.html) 或 `XGBoost` (https://xgboost.readthedocs.io/en/stable/))这样的算法。如果我们正在处理非结构化文本数据，我们需要\
  \ NLP 算法；如果我们正在处理图像，我们需要 CV 算法。因此，我们用于 ML 建模时选择的特征，对于决定使用什么算法也起着作用。\n\n\n\n\n在`第\
  \ 1 章，介绍机器学习工作流` 中，我们学习了如何处理机器学习（ML）问题，看到了用于解决机器学习问题的用例、框架和算法示例，最后查看了我们可以采用的构建解决方案的场景化导航路径。这些是至关重要的初始步骤，但对于开始投入时间和资金进行机器学习训练来说，还不够够。我们需要深入挖掘，以创建一个实验候选列表（模型的迭代训练和评估）。\n\
  \n航空公司飞行员将降落前的阶段称为 `final approach`（最终进场）。当我们可能正无忧无虑地享受机上电影或降落前的零食时，飞行员们正忙于执行一系列动作，将飞机调整到正确的航向、高度和速度，使其进入降落等候队列。当他们获得降落许可时，他们会将飞机带入\
  \ `final approach`，这包括放下起落架或起落装置（飞机的轮子）、将襟翼调至最大、接管手动操纵，并降低高度和速度以让飞机着陆。最终进场会导致着陆，而这正是关键时刻（我们开始产生机器学习训练成本）。因此，我们在这一\
  \ `final approach` 或确定算法和超参数阶段所做的工作，对于确保获得满意的机器学习结果非常重要。\n\n例如，考虑我们在 `第 1 章，介绍机器学习工作流`\
  \ 中回顾的“人工智能与机器学习的演进”部分表格中的以下几行：\n\n| 机器学习主题 | 机器学习用例 | 机器学习框架/库 | 算法/神经网络 |\n| :---\
  \ | :--- | :--- | :--- |\n| 表格化数据 | 回归 | TensorFlow Keras, MXNet, PyTorch, Sci-Kit\
  \ Learn | 线性回归、决策树、XGBoost、多层感知器 (MLP)、RNN |\n| 分类 | TensorFlow Keras, MXNet, PyTorch,\
  \ Sci-kit Learn | 线性回归、决策树、XGBoost、ML、CNN |\n\n**表 5.2：** 机器学习用例的映射\n\n在这种情况下，机器学习领域（或主题）和机器学习用例是清晰的；我们可以选择一个我们熟悉的特定框架，但我们仍然有很多算法可选，如果我们必须尝试每一种，我们可能仅在实验方面就会花费大量的时间和成本。因此，在此之前，我们继续进一步深入，了解这些算法实际上意味着什么、它们是如何被使用的、它们是否可配置、它们支持哪些特定用例的指标等。这将有助于进一步缩小我们的算法选择范围，让我们只关注最核心的算法。\n\
  \n**注意：在 `第 7 章，让 George 接管` 中，我们将探索一种使用名为 AutoML 技术来自动化算法选择和模型训练过程的方法。然而，理解如何通过实验迭代进行算法选择是非常重要的，因为我们机器学习项目的可能会可能会采用一种方法或另一种方法。**\n\
  \n对于上一个表格中的表格回归用例，我们提到了线性回归；XGBoost；决策树以及多层感知器（或 MLP）和 RNN 等神经网络。让我们通过观察它们的超参数和评估指标来理解这实际上意味着什么。超参数是用于控制算法在训练期间行为的配置变量。评估指标定义了目标，一旦该目标，就表明我们的模型对于任务已经过充分训练。请参考下表获取我们之前讨论的算法的特定元数据的详细分类。在机器学习的可选范围中，这只是冰山一角。我们需要多本书来涵盖现有的每种算法或神经网络，而且在我们写关于它们时，由于如今机器学习创新的速度，会有更多的算法被加入。\n\
  \n| 名称 | 类型 | 用于 | 重要超参数 | 常用评估指标 |\n| :--- | :--- | :--- | :--- | :--- |\n| 线性学习\
  \ (Linear Learner) | 统计模型或函数 | 分类或回归任务 | 类别数量、预测器类型、二分类器模型选择标准、早停耐心值、轮数、学习率、损失 |\
  \ RMSE [数据集中预测值与预期值之间的均方误差] 混淆矩阵 [用于分类，通过每个分类标签的预测与实际值来验证分类器性能] |\n| 极端梯度提升或 XGBoost\
  \ | 提升决策树 | 回归或分类任务 | eta 或学习率、最大深度、最小子权重、alpha、lambda | RMSE、AUC [或曲线下面积，衡量分类器在所有分类阈值点上的性能]\
  \ 或混淆矩阵 |\n| 随机森林 (Random Forest) | 决策树集成 | 回归或分类任务 | 树的数量、分裂标准、最大深度、最大特征、最小权重比例\
  \ | RMSE 或混淆矩阵 |\n| 多层感知器或 MLP | 神经网络 | 深度学习图像分类、目标检测、时间序列预测等 | 隐藏层数量、每隐藏层的神经元数量、激活函数、优化器、轮数、批量大小、损失函数\
  \ | 取决于机器学习用例。对于图像分类 - AUC 或混淆矩阵。对于目标检测 - 平均平均精度 (mAP)，它比较标记的边界框与预测的边界框。对于时间序列 -\
  \ MAPE 或平均绝对百分比误差。 |\n| 循环神经网络或 RNN | 神经网络 | 深度学习文本分类、文本翻译、NLU、NLP 等 | 隐藏层数量、每隐藏层的神经元数量、激活函数、优化器、轮数、批量大小、损失函数\
  \ | 文本分类 - 混淆矩阵。文本翻译 - 双语评估辅助 (BLEU) |\n| 卷积神经网络或 CNN | 神经网络 | 深度学习文本或图像分类、目标检测等\
  \ | 隐藏层数量、每隐藏层的神经元数量、激活函数、优化器、轮数、批量大小、损失函数 | 混淆矩阵或 mAP |\n\n**表 5.3：** 确定算法的考虑因素示例\n\
  \n# 统计模型或决策树考虑因素\n\n如果我们的用例是使用表格化房屋数据集预测房价，我们很可能会选择回归算法。相反，我们将选择一个二分类算法来预测客户流失，或者如果我们需要判断照片是否是动物列表中的猫，则会选择一个多分类算法。如果我们需要预测电影的所有可能类型，我们将使用多标签分类算法。对于回归或分类问题，你可以使用统计算法或神经网络。\n\
  \n\n\n\n\n对于线性学习算法，预测器类型（predictor type）可帮助你指定机器学习用例：二分类、多分类或回归。类别数量（number of classes）仅适用于多分类，表示要学习的类别条数。二分类器模型选择标准规定了当用例为二分类时，从一组训练好的模型列表中选择模型的决策指标，例如准确率（accuracy）、`F1\
  \ score` 或损失函数。早停忍受度（early stopping patience）表示在结束训练之前，为了监控特定目标指标（在二分类器模型选择标准中指定的指标或损失）的改进而监控的\
  \ `epochs` 数量。`Epochs` 表示模型必须遍历训练数据的最大轮次数。`learning rate`（学习率）是一个 0 到 1 之间的数值，表示在\
  \ `loss function` 确定预测值与标签之间的误差后，模型在训练过程中更新步长的增量。`loss`（损失）表示用于计算模型当前训练步之损失的数学函数，例如用于回归的平方损失以及用于分类的逻辑损失或\
  \ softmax 损失。\n\n如 `XGBoost` 等决策树也支持 `learning rate`（即 `eta`），这是在学习后更新权重的大小，用以防止过拟合。对于由决策树组成的随机森林，树的数量是一个重要的超参数。我们也可以为随机森林指定\
  \ `split criterion`（分裂标准），它指示要使用的分裂方法，例如 `Gini Impurity`（吉尼不纯度）或 `Entropy`（熵）。`max\
  \ depth`（最大深度）表示树的大小，即树可以分裂的层数；`max features`（最大特征数）表示树在每个节点计算该节点分裂时使用的特征总数。随机森林的\
  \ `min weight fraction`（最小权重比例）与提升决策树的 `min child weight`（最小子权重）相同，它表示节点划分的标准。如果划分节点的权重小于此处指定的最小权重，则不再进行进一步划分，该节点将成为叶子节点。`Alpha`\
  \ 和 `lambda` 是权重的正则化因子，这些值越高，权重更新越小，模型越趋保守。\n\n模型的评估指标或目标指标取决于机器学习用例，且此类指标的选择通常根据模型训练的目标是非常通用且标准化的。对于分类问题，在二分类或逻辑回归用例中，目标指标几乎总是\
  \ `AUC`（即接收者操作特征曲线下的面积）。`AUC` 衡量分类器在数据集所有分类阈值下的性能。对于多分类，效果最好的目标指标是 `confusion matrix`（混淆矩阵），它绘制了每个类别标签的实际分类与预测分类对比。对于回归用例，最流行的指标是\
  \ `RMSE`（均方根误差），它是预测值与实际值之间均方误差的平方根。\n\n选择算法应仔细考虑可用的超参数和你想的目标指标。根据你的业务场景，你可能需要使用\
  \ `confusion matrix` 而非 `AUC`，或者你可能需要使用 `accuracy` 作为分类器的评估指标，因为你更关注 `True Positives`（真阳性）和\
  \ `True Negatives`（真阴性）。你可能控制决策树的 `learning rate`，但如果你选择随机森林算法，则不支持此。因此，在最终确定建模算法之前，调查算法可用的超参数和评估指标是非常重要的。\n\
  \n# 算法的深度学习与神经网络考虑\n\n注意：显而易见的一点是我们使用神经网络进行深度学习，但一旦知道了这一点，我们就可以选择神经网络类型（或在单个模型中组合多个神经网络；例如，序列到序列模型使用了两个\
  \ `RNNs`）。\n\n将深度学习考虑为机器学习的一个子集。你使用这些控制来：\n\n*   让你的模型学习得更快或更慢（`learning rate`）\n\
  *   定义更大的神经网络以充分捕捉复杂数据（`number of hidden layers`）\n*   允许数据集中的特征集合通过层进行迭代处理（`number\
  \ of neurons per layer`）\n*   使用特定的数学函数来确定如何处理输入以及如何生成输出（`activation functions`）\n\
  *   通过优化学习到的近似参数来减少损失，从而鼓励学习进度（`optimizers`）\n*   指定每次迭代处理的样本数（`batch size`），并指定整个数据集遍历神经网络的轮数（`epochs`）。\n\
  \n\n\n\n# 使用算法和神经网络构建 ML 解决方案\n\n在下一章*迭代产生智能*（Iteration Makes Intelligence）中，我们将学习迭代训练\
  \ ML 模型的逐步流程，包括设置训练和测试数据集、选择算法、设置超参数、运行训练、针对所需目标进行模型调优，并在训练后评估模型性能。\n\n在本节中，我们将更多地关注如何在\
  \ SageMaker 中设置 `estimators`（https://sagemaker.readthedocs.io/en/stable/api/training/estimators.html）以及如何构建一些简单的神经网络。估计器（Estimators）是抽象的接口类，为在\
  \ SageMaker 中设置各种模型训练任务提供了易用的方法。根据你选择的 ML 框架，你可以创建 `MXNet` 估计器、`Tensorflow` 估计器、`PyTorch`\
  \ 估计器或 `Scikit-learn` 估计器等。一旦定义了估计器，你需要传递参数，例如要使用的算法（以 Docker 容器镜像提供），或者如果你将自己的算法带入\
  \ SageMaker，则提供包含算法代码的入口脚本、计算实例类型、权限、加密密钥、存储模型构制品的输出位置、超参数以及评估指标。一旦估计器准备就绪，你只需调用\
