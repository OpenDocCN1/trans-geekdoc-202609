  # 引言](#toc.xhtml#s93)\n你是一个空间爱好者吗？如果是的话，你可能已经知道“连续体”（continuum）的基本概念。简单来说，它指的是连续演化的顺序事件，甚至是无限的。我们这个包含了所有行星和恒星的宇宙空间，自远古以来一直在不断扩张。尽管我们没有意识到，但随着宇宙扩张导致我们周围的空间扩大，我们的整个太阳系正以每秒\
  \ 200 公里的速度移动。我们宇宙已知的部分（关于可观测宇宙有多大，我们仍处于浅尝）宽度大于 135 亿光年（或者说光在 135 亿年内传播的距离，光速为每秒\
  \ 30,000 公里），而且它仍在持续增长。因此，空间是一个连续体。\n\n时间也是一个连续体，尽管我们在几千年前才感知到它的存在，但它始于几十亿年前（至少根据我们今天所知），并不断向无限演化（或者直到没有我们能承认时间的存在）。除了演化和连续性，连续体的一个特征是自给自足的。这意味着它的存在不需要也不依赖任何其他事物。空间的存在或扩张不依赖于恒星或行星，时间也不依赖于事件。空间和时间是包含、帮助界定和理解其中出现并存在的事件及对象的维度。没有空间和时间，我们就无法以我们感知的方式体验生活。同样，数据也是连续体，它提供了描述和刻画机器学习模型试图理解和近似的事件发生的维度。\n\
  \n换句话说，机器学习模型是智能领域连续体演化的引擎，因为它们在训练和推理过程中会遇到并从不断变化的数据流中学习，提高其预测准确性，同化“现状”与“需求”之间的近似模式，并因此成为一个披着洞察外壳的数据源本身。换句话之，一个机器学习模型的预测结果是训练另一个机器学习模型的数据源。我们在这里尝试解决的主要观点是：数据是把机器学习模型驱动的洞察连续体连接在一起的纽带。在很大程度上由于过去几十年的技术进步，数据继续是我们感知现实的织物，以意意不到的方式影响着我们。\n\
  \n定向广告就是其中的一个例子。你在网上搜索去某个向往已久的喜假目的地的机票，惊讶的是，当你当天晚些时候看手机视频播放列表时，你看到了一个显示同一目的地景点的广告。你可能认为这是天命，但并不是神灵在监视着你；而是一个机器学习模型正在跟踪你的浏览活动（数据），并向你展示与你感兴趣领域的广告。在我们现在所做的每件事中都有这样的例子。数据是驱动这些机器学习模型背后引擎的燃料，帮助连续体蓬勃发展。\n\
  \n在之前的章节中，你学习了机器学习工作流是什么、如何获取并将数据摄入 Amazon S3 数据湖（`https://aws.amazon.com/products/storage/data-lake-storage/`）、数据集中特征的重要性，以及如何针对各种机器学习用例执行特征工程任务。在本章中，我们将学习如何通过编排自动化数据流，来收集、处理、特征工程和转换用于机器学习建模的数据，从而构建我们自己的连续体。我们将首先深入探讨数据在连续体中的作用，并理解为什么数据处理自动化对机器学习很重要。然后，我们将使用\
  \ AWS Glue ETL 作业（`https://aws.amazon.com/glue`）为表格特征工程用例构建自己的数据编排流水线。最后，我们将学习如何使用\
  \ Glue DataBrew（`https://aws.amazon.com/glue/features/databrew/`）进行数据画像、处理和清理。让我们开始吧。\n\
  \n# Structure](#toc.xhtml#s94)\n在本章中，我们将深入探讨以下主题：\n\n*   揭秘数据连续体的本质\n*   使用 AWS\
  \ Glue ETL 运行特征工程\n*   使用 AWS Glue DataBrew 进行数据画像\n\n\n\n\n我们理解数据连续体（data continuum）驱动着机器学习建模中的智能，但我们该如何为自己的需求构建它呢？我们如何创建一个自给自足、持续进化且自动化的数据生态系统，并称之为连续体？即使我们创建了它，除了机器学习之外，它还有什么用？即使是最伟大的想法，只有在能够实际应用并产生结果时才有用。那么，我们如何将数据连续体付诸实践？我们可以通过从你的\
  \ `Amazon S3` 数据湖中迭代构建无服务器（指在云环境中运行时无需管理基础设施配置即可运行代码的能力）数据编排流水线，并使用模块化的中心-辐射（hub\
  \ and spoke）设计方法，将数据流自动化到你的机器学习模型和下游应用程序。这并不复杂，正是航空公司在规划路线网络时所使用的方法。其核心思想是尽可能减少点对点连接的数量。例如，考虑下面的图片，假设每个节点都是一个城市，箭头表示路线：\n\
  \n![](img/Figure-4.1.jpg)\n\n**图 4.1：** 城市之间的旅行路线\n\n如你所见，与中心-辐射方法相比，点对点方法拥有更多的路线（更大的开销、更高的成本和更低的效率）。直接连接可能更快，但随着更多城市和路线的增加，它并不是一种可扩展的方法。同样的概念也适用于系统之间的数据流。在我们的案例中，节点\
  \ `C` 是 `Amazon S3` 数据湖，而节点 `A`、`B` 和 `D` 是机器学习模型、应用程序或两者的结合。当我们设计数据连续体时，我们会迭代地向数据湖、应用程序、机器学习模型、数据仓库和其他操作数据存储器添加或从其提取数据编排或流。我们总是尝试识别可以作为中心的最优节点。数据编排（或数据流）是完全自动化的，可以选择按计划频率执行或响应事件执行，并启用了按需配置。\n\
  \n对于机器学习模型，数据编排流（或中心-辐射数据连续体的辐射节点）通常对于用于模型训练/重新训练交付的数据是批处理的，而对于推理请求是实时的，尽管根据需求可以是任一一种方式。架构定义了数据提供和消费的模式，其关键词是自动化。下表简要描述了不同类型的模式，并提供了关于何时使用何种类型的指导：\n\
  \n| 交互类型 | 交互模式 | 交互范式 | 用途 |\n| --- | --- | --- | --- |\n| 实时 | 同步 | 请求/响应 | 用于两个系统（A\
  \ 和 B）之间的数据流，A 通过在请求中传递或不传递参数来向 B 请求信息，例如，新闻网站调用天气网络服务并将城市作为参数传递 |\n| 实时 | 同步 |\
  \ 存储/获取 | A 通过队列向 B 发送数据或消息并等待 B 的响应 |\n| 实时 | 异步 | 发布/订阅 | A 向多个消费者已订阅的主题发送消息或数据\
  \ |\n| 实时 | 异步 | 存储/获取 | A 通过队列发送消息或数据，但不等待 B 的响应；也称为“发后后不顾”（fire and forget） |\n\
  | 实时 | 广播 | 发布/订阅 | A 向一个具有大量订阅者的主题发送消息，不期望确认或响应 |\n| 实时 | 扇出 (Fan-out) | 发布/订阅\
  \ | 作为较大流或编排的一部分，A 执行的任务导致数据或消息并行发送给多个消费者 |\n| 批处理 | 异步 | 请求/确认/响应 | 大量数据被分组为批次，从\
  \ A 处理并传输到 B，B 发送确认表示已开始接收数据，并在数据接收并处理后发送响应 |\n| 批处理 | 异步 | 推送/拉取 | A 根据计划频率或触发器向\
  \ B 推送大数据，或 B 根据频率、触发器或按需从 A 拉取数据 |\n\n**表 4.1：** 数据流编排的设计模式\n\n在为你的企业设计数据连续体时，你将使用这些模式的一种或多种用于你的数据编排流。不过，有一点提醒：不要贪多求。就像在机器学习建模中一样，在这里也应该遵循迭代方法。首先确定你连续体的中心节点。你可以将其视为一个聚类或最近邻域问题（我们将在\
  \ `第 5 章，撒网更广的网` 中详细讨论机器学习算法）。你的中心节点类似于聚类中心，它们通常代表数据存储器或数据湖，数据编排流从这些地方消费数据或向这些地方交付数据。事实上，我们实际上也可以将其建模为图数据（`https://aws.amazon.com/neptune/`）问题，并使用图神经网络（`https://docs.aws.amazon.com/sagemaker/latest/dg/deep-graph-library.html`）来处理数据连续体。这表明即使我们数据连续体的设计元素也可以表示数据并使用机器学习进行建模，并验证了将连续体作为设计范式的原则。\n\
  \nAWS 在设计无服务器数据编排流水线方面提供了大量的灵活性和选择。本章中的空间仅涵盖两种此类选项，但我们将在本章的结论部分介绍构建机器学习数据编排的替代方法，以及相关说明的链接。\n\
  \n在本节中，我们深入探讨了数据连续体的概念，并理解了它由参与系统之间的数据编排流组成，可以根据需求以各种方法设计。\n\n在下一节中，我们将使用 `AWS Glue\
  \ ETL`（`https://docs.aws.amazon.com/glue/latest/dg/author-job.html`）这一无服务器托管分析服务来创建一个自动化作业，用于在输入数据上运行特征工程任务并创建用于机器学习训练的特征输出数据集。\n\
  \n# 使用 AWS Glue ETL 运行特征工程\n\n在本节中，我们将学习如何使用 `第 3 章，通过特征预测未来#c03.xhtml)` 中学习并执行的特征工程任务，利用\
  \ AWS 分析服务实现自动化。当我们使用 Jupyter Notebook 运行代码时，我们处于实验阶段。Notebook 为我们提供了一种方便的方法来构建和测试每行代码，直到我们确定所有步骤都按预期工作。但当我们进入开发和生产阶段时，我们需要自动化特征工程任务的执行，以便为机器学习训练提供一个功能完整的接入、特征工程、转换和存储的数据流水线。这就是我们在本节中将构建的内容。解决方案的架构如图所示：\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2：** 使用 AWS Glue ETL 进行特征工程\n\n如你所见，我们的构建包含三个主要组件。我们将使用\
  \ AWS 管理控制台、Amazon SageMaker Studio Notebook 和 AWS Lambda，结合来自 GitHub 仓库的代码片段来构建这些部分。我们的构建将由以下任务组成，我们将在后续独立章节中分别介绍以便理解：\n\
  \n*   使用特征工程代码构建 AWS Glue ETL 作业\n*   创建带有 Amazon S3 触发器的 AWS Lambda 函数\n*   当原始数据集上传到\
  \ Amazon S3 桶时，从 AWS Lambda 函数触发 AWS Glue ETL 作业\n\n\n\n\n\n在本节中，我们回顾了使用 AWS Glue\
  \ ETL 构建特征工程数据编排流的解决方案架构。我们的解决方案类似于批处理推送/拉取方法，原始数据的上传会触发数据处理，并将其推送到目标 S3 桶位置。请按照下一节中的说明执行构建任务。\n\
  \n# 构建 AWS Glue ETL 作业\n\nAWS Glue (`https://aws.amazon.com/glue`) 是一种完全托管、无服务器、安全且可扩展的数据编排服务，它使能够跨越本地和\
  \ AWS 云端的多种数据源，构建无数自动化且弹性的集成流水线。截至 2022 年 3 月，AWS Glue 是 14 种可用于数据集成和处理的分析服务之一，此外还有\
  \ 20 多种可用于数据存储和迁移的服务。底图显示了 AWS 管理控制台中这些可用服务的快照：\n\n![](img/Figure-4.3.jpg)\n\n**图\
  \ 4.3：** AWS 存储、数据库和分析服务\n\n因此，在各种数据存储器、应用程序和机器学习解决方案之间构建数据编排流有多种选择。详细介绍其中每一个方案将耗费整本书的内容。为了让你为机器学习训练做好准备，本章我们重点重点关注使用\
  \ AWS Glue ETL 作业进行数据编排，以及使用 AWS Glue DataBrew 进行数据分析和编排。现在，我们将按照下方解决方案架构图所示，作为第一步设置\
  \ Glue 作业：\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4：** AWS Glue ETL\n\n请遵循 *技术要求* (Technical\
  \ Requirements) 章节中的说明，确保你已经注册了 AWS 账户并已登录 (`https://portal.aws.amazon.com/billing/signup`)。执行以下步骤完成本节内容：\n\
  \n1. 首先，你需要创建一个 Amazon S3 桶 (`https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html`)\
