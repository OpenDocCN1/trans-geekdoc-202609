  \ SDK、SageMaker Processing | 使用 ML 实现聊天机器人，具有简单直观的界面来构建高度智能的对话界面 |\n| 模型部署 | 生产变体、实时端点、多模型端点、推理流水线、无服务器推理、异步推理、批量转换\
  \ | 提供多种模型部署选项，包括无服务器、异步、实时和批量，并能够进行 A/B 测试、金丝雀发布和自动化版本部署 |\n| 模型监控 | Model Monitor\
  \ | 对模型的数据质量和模型质量问题进行自动监控和告警 |\n| 偏偏检测 | Clarify | 对偏差漂移、特征归因进行自动监控和告警 |\n| 主动学习\
