  \n# 结论 (#toc.xhtml#s102a)\n\n呼！！这是一个很长的章节，我们在这一章中涵盖了相当多的内容。请注意，当你完成本章的解决方案构建时，你已经在迈向成为云原生\
  \ AI/ML 专家的道路上了。你现在已经学会了如何为机器学习识别、溯源、收集、准备、预处理、特征工程、分析和转换你的数据集。\n\n在下一章中，我们将深入研究算法和神经网络。我们将学习可用的不同类型的机器学习算法，讨论常用算法，介绍如何构建神经网络，并学习使用算法和神经网络进行实战模型训练。\n\
  \n# 要点 (#toc.xhtml#s103a)\n\n请记录下在本章中学到的关于数据编排（data orchestration）的关键点：\n\n*   你有多种方法可以构建用于机器学习训练和推理的数据编排流水线。\n\
  *   我们在书中学习了构建数据编排的几种选择。\n*   在过去的几年里，Amazon SageMaker (`https://aws.amazon.com/sagemaker/`)\
  \ ——一个用于构建端到端机器学习工作流的全托管服务，增加了若干新功能，有助于将机器学习流水线与数据生态系统集成。\n*   其中一个功能是 Amazon SageMaker\
  \ Data Wrangler，它包含许多预置的转换功能，用于标准的特征工程和数据预处理任务。\n*   Data Wrangler 提供了数百种预置转换，你也可以使用流行的语言编写自定义转换映射。\n\
  *   另一个备受期待的发布是 Amazon SageMaker Feature Store，它是一个托管服务，提供了一个可重用的仓库，用于在不同的机器学习项目之间存储、维护和访问机器学习特征。\n\
  *   AWS AI/ML 内部专门设计的特征有助于跨数据源、机器学习模型和这些模型的消费者实现端到端的自动化和扩展，这是 AWS 提供的云计算模型最大的优势之一。\n\
