  \ ML 用例提供大规模扩展支持。\n\n## 结论\n\n恭喜！为你自己感到傲，因为你已经学习了使用 Amazon SageMaker 在 AWS 上构建和运行模型所需的全面技能。到目前，我们涵盖了\
