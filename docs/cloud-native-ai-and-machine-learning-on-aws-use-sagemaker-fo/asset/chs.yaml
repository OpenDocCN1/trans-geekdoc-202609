  \n\n\n\n现在让我们对 `variety` 特征应用目标编码（target encoding），如下节所示。\n\n## 目标均值编码 (Target mean\
  \ encoding)\n\n在目标均值编码中，我们根据输入特征值的所有观测值中目标特征的平均值对输入特征进行编码。从我们的数据集中可以看出，`variety`\
  \ 和 `price` 之间没有线性关系（或不相关），因此可以使用目标编码。不过，有一点建议：目标编码可能会导致过拟合（如果已经存在相关性），因为我们正在刻意强制建立与目标特征的相关性。另一种方法是使用贝叶斯目标编码：[`www.kaggle.com/mmotoki/hierarchical-bayesian-target-encoding`](https://www.kaggle.com/mmotoki/hierarchical-bayesian-target-encoding)。\n\
  \n首先，运行以下命令安装分类编码器包：\n\n```bash\npip install category_encoders\n```\n\n现在，执行以下代码块对\
  \ `variety` 特征应用目标编码：\n\n```python\nimport category_encoders as ce\ntar_enc = ce.TargetEncoder(wine_raw_df['variety'])\n\
  wine_raw_df['variety_transformed'] = tar_enc.fit_transform(wine_raw_df['variety'],\
  \ wine_raw_df['price'])\n### 让我们移动到一个新的 dataframe 并删除我们转换的分类列\nwine_ready_df = wine_raw_df.drop(['designation','variety','winery'],\
  \ axis=1)\nwine_raw_df.head()\n```\n\n我们得到了以下结果：\n\n![](img/Figure-3.19.jpg)\n\n\
