  md: '# Chapter 2


    # Basic Linear Algebra Definitions


    # 2.1. Introduction


    In the process of practicing Machine Learning [1] you keep hearing buzzwords related
    to Linear Algebra. Vector, matrix, tensor? Those are basic Linear Algebra Definitions.
    In this chapter, some of the most commonly used Linear Algebra definitions are
    introduced.


    This chapter aims to accomplish the following:


    +   - Provide the basic definitions in Linear Algebra that we hear every day while
    dealing with Machine Learning.

    +   - Describe the connection between those basic concepts.

    +   - Demonstration of the commonly used notations.


    If you already know Linear Algebra and/or familiar with basic definitions, you
    may still find some aspects of this article useful, such as the representation
    of "the commonly used notations."


    # 2.2. Scalar and Vector


    By using mathematical definition, a scalar is "*an element of a field, which is
    used to define a vector space, usually the field of real numbers.*" Simply speaking,
    a scalar is just a number. We usually denote a scalar with a lower case symbol,
    such as a.


    It is worth to have a comparison between scalars and vectors. Most probably, you
    are familiar with measures such as the velocity of a moving car and the direction
    of moving, which have both quantity and direction. Such elements are called vector
    as opposed to scalars, which have magnitude only. We denote vectors with bold
    symbols such as a.


    Subscripts usually denote the elements of the vector. For example the second element
    of the vector v is denoted as v₂. In general, we show a k-dimensional vector as
    an array of elements:'
  merge: -1
  img_proc: true
- pgno: 12
  md: '![](img/37669628775ca7a07835165249fef088_12_0.png)


    Fig. 2.1. The red arrow **v** is the vector and *a* and *b* are scalars denoting
    the magnitudes of **v** in horizontal and vertical directions.


    **v** = $\begin{bmatrix} v_1 \\ v_2 \\ \dots \\ v_{k-1} \\ v_k \end{bmatrix}$


    **NOTATION:** We denote a k-dimensional vector as **v** ∈ ℝ^k.


    # 2.3. Matrix


    In mathematics, a matrix is a rectangular array of elements, such as numbers organized
    in rows and columns. Usually, the matrices are denoted with bold uppercase, such
    as **M**. An example of a matrix is below:


    **A** = $\begin{bmatrix} 1 & -1 & 3 \\ 4 & 11 & -0.2 \end{bmatrix}$


    We denote the matrix elements with subscripts. In the matrix **M**, the element
    in *i*^th row and *j*^th column is denoted as **M**_{i,j}. So you can easily say
    for the example above, **M**_{1,2} = −1 and **M**_{2,3} = −0.2. Another important
    notation is when we desire to refer a row or a column as a whole, i.e., all elements
    in that particular row/column. In this case, we use “:” sign in the subscript.
    For example, assume we want to refer to all elements of *i*^th row for matrix
    **M**. We denote that row with **M**_{i,:}. For matrix **A**, **A**_{1,:} is as
    below:


    **A**_{1,:} = $\begin{bmatrix} 1 & -1 & 3 \end{bmatrix}$'
