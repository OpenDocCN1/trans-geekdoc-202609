  md: '# ## 5.2. Vector Norm


    We usually use the norms for vectors and rarely for matrices. At first, let’s
    define what the norm of a vector is? A norm can be described as below:


    +   - A function that operates on a vector (matrix) and returns a scalar element.

    +   - A norm is denoted by \(\mathcal{L}^q\) in which \(q\) shows the order of
    the norm and \(p \ge 1, p \in \mathbb{R}\).

    +   - The order a vector (matrix) is always a non-negative value.

    +   - The intuition behind the norm is to measure a kind of distance.


    ![](img/37669628775ca7a07835165249fef088_42_0.png)


    **Fig. 5.1.** A norm usually indicates a distance or magnitude metric.


    A norm is mathematically defined as below:


    | q-norm of a vector |

    |---|

    | \(\mathcal{L}^q(\mathbf{v}) = \|\mathbf{v}\|_q = \left(\sum_k |v_k|^q\right)^{1/q}\)
    |


    The sign \(|\cdot|\) is an operation that outputs the absolute value of its argument.
    The example of which is \(|-2| = 2\) and \(|2| = 2\). You can implement \(\mathcal{L}^q\)
    by the following Python code:


    ```

    ```python

    # Import Numpy package and the norm function

    import numpy as np

    ```

    ```'
