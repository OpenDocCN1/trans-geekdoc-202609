    # ## 4.9. Matrix Trace


    Assume we have a square matrix. Trace of a matrix is an operator that is the sum
    of its **diagonal elements** as below:


    $$Tr(\mathbf{M}) = \sum_k M_{k,k}$$


    Working with the trace of a matrix, instead of the matrix itself, is easier for
    a lot of matrix calculations and mathematical proofs.


    We have the following properties for the matrix trace operator:


    +   - $Tr(\mathbf{M}) = Tr(\mathbf{M}^{T})$

    +   - $Tr(\mathbf{AB}) = Tr(\mathbf{BA})$ if both **AB** and **BA** exists and
    are valid.


    # ## 4.10. Matrix Determinant


    The **determinant** of the matrix $\mathbf{A} \in \mathbb{R}^{N \times N}$ is
    a scalar value that we compute from the elements of the matrix. The matrix **MUST**
    be square so we can compute the determinant. Furthermore, the matrix must be **non-singular**!'
