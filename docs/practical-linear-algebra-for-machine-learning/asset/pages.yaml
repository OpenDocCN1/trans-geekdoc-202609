  md: '# 4.5. Scalar Multiplication


    If we multiply a matrix by a number (a.k.a. scalar), the result equals to multiplying
    every entry of the matrix by that specific scalar. For example, you can check
    the following calculations:


    $2*\begin{bmatrix}2 & 3 & 1 \\ 3 & -4 & 2.2\end{bmatrix}=\begin{bmatrix}4 & 6
    & 2 \\ 6 & -8 & 4.4\end{bmatrix}$


    The properties of scalar and matrix multiplication are as below:


    +   - $(\alpha + \beta)\mathbf{A} = \alpha\mathbf{A} + \beta\mathbf{A}$

    +   - $\alpha(\mathbf{A} + \mathbf{B}) = \alpha\mathbf{A} + \alpha\mathbf{B}$

    +   - $0.\mathbf{A} = 0$

    +   - $1.\mathbf{A} = \mathbf{A}$


    # 4.6. Matrix Multiplication


    Assuming we like to multiply to matrices and calculate the output as $\mathbf{C}=\mathbf{A}\mathbf{B}$.
    For doing so, the dimension of $\mathbf{A}$ and $\mathbf{B}$ matrices should match.
    Here, being matched does not mean being equal. Matching means the number of columns
    of $\mathbf{A}$ should equal the number of rows in $\mathbf{B}$. An example is
    to assume the shape of $\mathbf{A}$ equal to $m \times q$. Then, the shape of
    $\mathbf{B}$ MUST be $q \times n$, so $q$ is shared. As a result of such multiplication,
    the shape of $\mathbf{C}$ equal to $m \times n$.


    ![](img/37669628775ca7a07835165249fef088_31_0.png)


    Fig. 4.1. Visualization of the dimention matching in matrix multiplication.


    Check the following Python code to have a better understanding of matrix multiplication:'
