  md: '# Chapter 1


    # Introduction


    In this chapter, the goal is to investigate the importance of Linear Algebra in
    Machine Learning and motivate you to continue further.


    # 1.1. Is Mathematics Painful?


    Let me start with one fact: The majority of us may dislike math if not hate it!
    We try to avoid it at all costs and when we feel like we can’t avoid it, it’s
    like being in agony as our lungs blister with chemical burns. Am I right? We may
    have many different reasons, consciously or subconsciously:


    +   - While reading it, it always looks like that we have to learn new things
    which we do not know how useful they are, except for understanding what we are
    reading!

    +   - Why should I spend too much time one something that I don’t receive an immediate
    benefit? What if I can skip the math and still be able to do the job?

    +   - Maybe due to the conformity bias, It looks cool to say, “I hate mathematics.”

    +   - Maybe you had a bad teacher! I am not talking about being good or bad in
    actually knowing math; I am talking about a teacher that always discouraged you
    by criticizing your manner or questioning your ability! It usually happened. Right?

    +   - Any other reason that you have in mind and I missed them ...


    All in all, the list is too long. Many times understanding the root of this problem
    may not solve the problem. Perhaps it’s good to only think about our motivations
    rather than forcing ourselves to like it! I personally believe there is no reason
    to like something if we have to do it. On the other hand, it’s actually a skill:
    Doing things we hate to do! So, let’s forget about liking math for a moment and
    try to just motivate ourselves to learn it at the level that we need!'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'A question still remains: **Do we really need to learn math if we desire to
    learn Machine Learning?** The short answer is: (1) yes, you need to learn some
    branches of mathematics, such as Linear Algebra, (2) you need to learn it as needed.
    There is no need to be a master!


    # 1.2. The Motivation


    **Why Linear Algebra is Necessary for Machine Learning?** Linear Algebra is a
    branch of math that is broadly used everywhere. It is, in essence, the study of
    vectors and linear functions and we use it to interpret and utilize Machine Learning.
    Knowing Linear Algebra enlighten you about how algorithms work at their core level,
    which helps you to employ an algorithm better or even make a decision whether
    that choice (the utilized algorithm/approach) is practical or not. An example
    is the K-nearest neighbor algorithm which is known to be one of the simplest Machine
    Learning algorithms. Even for that, you still cannot avoid knowing a minimal level
    of Linear Algebra, if you would like to know how to implement it.


    Vectors and matrices are everywhere, especially in Deep Learning. Loosely speaking,
    Deep Learning is technically Machine Learning using Neural Networks and Big Data.
    Neural Networks are made of matrices, and they mainly operate under the laws of
    Linear Algebra. Henceforth, a good knowledge of linear algebra seems to be necessary
    for understanding and utilizing Machine Learning and Deep Learning algorithms
    and architectures. Let’s not ignore what we can easily see: ***Linear Algebra
    is a MUST KNOWN for Machine Learning.***


    But wait! Is that enough to exclaim the importance of Linear Algebra? Of course
    not. I like to address some situations that you need to know Linear Algebra, SERIOUSLY:


    +   - **Working with vectors:** Can you ignore vectors and their associated characteristics
    while working on Machine Learning? I think NOT. They are everywhere. The foundation
    of Machine Learning is based on vectors and matrices.

    +   - **Delving deep in an algorithm:** You can’t possibly hit the root and gain
    a core understanding of Machine Learning algorithms without knowing Linear Algebra.
    You may say, "who cares about core understanding?" Yeah, you can ignore it, but
    what if your implementation is not working? What if you want to improve a method?
    What if you want to know more than average?! Then you need it so bad!!

    +   - **You want to teach what you know:** Yes, that is very important. Assume
    you want to DO Machine Learning, whatever that "DOING" means. Eventually, you
    want to share your knowledge by any mean. Explaining to other folks, your manager,
    your students, and the list goes on. Of course, if you work in a company, it is
    unlikely that any of your managers care about "how your algorithm works and what
    is inside it?!" BUT, they care about the results. Assume you want to convince
    them something is NOT working. Then you need to explain in detail. If your managers
    neither'
  merge: -1
  img_proc: true
