  md: '# Linear Dependency


    A vector $\mathbf{v}^i$ is linear dependent if we can express it as the linear
    combination of another two vectors in the set, as below:


    $$\mathbf{v}^i = \sum_{j \neq i} \alpha_j \mathbf{v}^j$$


    In the above case, we say the set of {$\mathbf{v}^1, \mathbf{v}^2, \dots, \mathbf{v}^p$}
    vectors are linearly dependent!


    ![](img/37669628775ca7a07835165249fef088_48_0.png)


    Fig. 6.1. Vector **d** is a linear combination of vectors **a**, **b**, and **c**.
    Actually, **d** = **a** + **b** + **c**.


    # 6.3. Example


    Consider the three vectors below:


    $$\mathbf{v} = \begin{bmatrix} 1 \\ -1 \\ 2 \end{bmatrix}, \mathbf{u} = \begin{bmatrix}
    0 \\ 3 \\ 1 \end{bmatrix}, \mathbf{w} = \begin{bmatrix} 2 \\ 1 \\ 5 \end{bmatrix}$$


    The above set is linearly dependent. Why? It is simple. Because $\mathbf{w} =
    2\mathbf{v} + \mathbf{u}$. Let''s do the above with Python and Numpy:


    ```

    # Import Numpy library

    import numpy as np


    # Define three column vectors

    v = np.array([1, -1, 2]).reshape(-1,1)

    ```'
