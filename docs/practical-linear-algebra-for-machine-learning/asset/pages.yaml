    # 4.2. Matrix Transpose


    The transpose of a matrix is an operator which switches the row and column indices
    of the matrix. As a result, after transposing a matrix, we have a new matrix and
    is denoted as A^T. Therefore, the i^th row, j^th column elements of A are the
    j^th row and i^th column elements of A^T, respectively. Assume we show A^T with
    matrix B, then we have the following:


    **B**_{j,i} = **A**_{i,j}


    We can have the following example to clarify better:


    $$\begin{bmatrix}2 & 3 & 1 \\ 3 & -4 & 2.2\end{bmatrix}^T = \begin{bmatrix}2 &
    3 \\ 3 & -4 \\ 1 & -2.2\end{bmatrix}$$


