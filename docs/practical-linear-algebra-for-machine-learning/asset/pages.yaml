    # 3.3. Defining a NumPy Array


    An array is basically a one- or multi-dimensional grid of values. In a NumPy array,
    in particular, all values are from the same type (integer, float). How we are
    going to define a NumPy array? For a NumPy array, we have the following definitions:


    +   - **Rank:** The number of dimensions an array has.

    +   - **Shape:** A tuple that indicates the number of elements in each dimension.
    Ex: The shape of an array being as (2,4,10) indicates that we have a three-dimensional
    array which has 2,4, and 10 elements in the first, second, and third dimension,
    respectively.


    # 3.3.1 Create an array from a list


    Now let’s get started with Python. We start with the most common approach. Let’s
    define create a NumPy array from a list:


    ```

    # Import NumPy library

    import numpy as np


    # Define a Python list

    mylist = [1, 2, 4, 8]


    # Create a NumPy array from the list

    numpy_array = np.array(mylist)

    print(''Array: '', numpy_array)

    ```


    ```

    Array:  [1 2 4 8]

    ```


