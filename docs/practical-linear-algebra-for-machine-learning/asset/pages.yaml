  md: '# 4.11. Special Matrices


    There are special kinds of matrices that you may hear their names every day. I
    wanted to briefly describe some of them here.


    # Symmetric matrix


    A symmetric matrix, equals its transpose as below:


    **M** = **M**^T


    An example would be the following matrix:


    [ 1  -1 ]

    [-1  3 ]


    # Diagonal matrix


    A diagonal matrix only have non-zero elements on its main diagonal. Everywhere
    else in the matrix, we have zero elements.


    **M**_{i,j} = 0, i ≠ j


    **M**_{i,j} ≠ 0, i = j


    We can have the following example:


    [ 1  0  0 ]

    [ 0  3  0 ]

    [ 0  0 -1 ]


    > NOTE: A diagonal matrix, does not have to be a square matrix. The main diagonal
    of a matrix is formed with the elements **M**_{i,j} when i = j.


    # Orthogonal matrix


    An Orthogonal matrix is a square matrix which has the following characteristic:


    **M** **M**^T = **M**^T **M** = **I**


    Noted that if we multiply **M** with **M**^T and it results in the identity matrix,
    this implies that **M**^T = **M**^{-1}.'
