    # 6.5. Linear Equations\n\nI talked about **linear dependency** and **matrix ranks**.\
    \ After that, I would like to discuss their *application in finding the solution\
    \ of linear equations*, which is of great importance. Consider the following equality\
    \ which set a system of linear equations:\n\n$$\\mathbf{A}^{m\\times n}\\mathbf{x}^{n\\\
    times 1} = \\mathbf{b}^{m\\times 1}$$\n\nAbove, we see the matrix **A** is multiplied\
    \ by the vector **x** and forms another vector **b**. The above equality creates\
    \ a set of m-line linear equations. Let’s write line $j$ for example:\n\n$$\\\
    mathbf{A}_{j,1}\\mathbf{x}_1 + \\mathbf{A}_{j,2}\\mathbf{x}_2 + \\dots + \\mathbf{A}_{j,n}\\\
    mathbf{x}_n = \\mathbf{b}_j,\\; j \\in \\{1,2,\\dots,m\\}$$\n\nSo the question\
    \ is how many solution exists for the system of equations **Ax = b**. By solution\
    \ I mean the possible values for the variables **x** = $[x_1,x_2,\\dots,x_n]^T$.\
    \ The answer is one of the following:\n\n+   - There is **NO solution**.\n+  \
    \ - The system has **one unique solution**.\n+   - We have **infinite** numbers\
    \ of solutions.\n\n**NOTE:** As you observed, having more than one BUT less than\
    \ infinity solutions is NOT possible!\n\nTheorem\n\nIf **u** and **v** are two\
    \ solutions of the **Ax = b** equation, then the specific linear combination of\
    \ them as below, is a solution as well:\n\n$$\\mathbf{w} = \\beta\\mathbf{u} +\
    \ (1-\\beta)\\mathbf{v},\\forall\\beta \\in \\mathbb{R}$$"
