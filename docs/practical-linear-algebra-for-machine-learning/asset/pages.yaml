  md: '# Chapter 6


    # Linear Independence


    This chapter in dedicated to the concept of linear independence of vectors and
    its associations with the solution of linear equation systems.


    # 6.1. Introduction


    **What is the concept of vectors’ linear independence?** One simple example: Let’s
    say you want to find the answer to the **A x = b**. One may say we can simply
    find the answer by taking an inverse of **A** as **x = A⁻¹ b**. NOT SO FAST! There
    is more in that? What if **A** does not have an inverse or is not square? You
    just let it go? Guess not.


    That was just one example. In Machine Learning, it frequently happens that you
    want to **explore the correlation between vectors** to analyze them better. For
    **example**, you are dealing with a matrix which in essence, is formed by vectors.
    What would you know if you are not familiar with the concept of **linear independence**?


    In this chapter, you will learn the following:


    +   - The concept of linear independence/dependence!

    +   - Examples of the linear dependence of vectors

    +   - How to do it in Python using Numpy?

    +   - Matrix ranks

    +   - The solutions to a system of linear equations


    # 6.2. The Concept


    Assuming we have the set of {v¹, v², …, vᵖ} ∈ ℝ^q which are p column vectors of
    size q. Then, we call this set linear independent, if no vector exists that we
    can represent it as the linear combination of any other two vectors. Although,
    perhaps it is easier to define linear dependence.'
