  md: '# # Chapter 3


    # # An Introduction to NumPy


    This chapter is dedicated to NumPy [7], one of the most important scientific computing
    libraries for Linear Algebra and henceforth, Machine Learning! As we will use
    it frequently to explain the concepts of Linear Algebra, it is important to know
    how to utilize it.


    # 3.1.  Introduction


    In almost **any Python program code in Machine Learning** you see ”NumPy” library
    being used! Why? Doing Machine Learning is impossible without Linear Algebra and
    Linear Algebra is formed by vectors, matrices, etc. Well, **NumPy is one of the
    best scientific computing packages, in particular, for Linear Algebra.** So that
    was the short answer to the ”why” question earlier!


    **You can conduct a simple 30 minutes research** to find out if I am right or
    wrong! Search through the web and look for Machine Learning projects and their
    available source codes. Check to see how many of them use Numpy. Check Python
    codes. See how many times you see the expression *”import numpy”* or *”import
    numpy as np”* on top of the code. Do it! It definitely motivates you unless you
    already are aware of the importance of Numpy.


    Here are what you learn in this chapter:


    +   - What is Numpy?

    +   - How we can define arrays in Numpy?

    +   - What are the basic operations?

    +   - How to leverage Numpy for Machine Learning?

    +   - What are the most used tips and tricks in using Numpy?


    # 3.2.  Data Types


    Here, some of the most important Numpy numeric data types that you frequently
    encounter are described. Numpy supports numerous data types, perhaps even more
    than Python itself!'
