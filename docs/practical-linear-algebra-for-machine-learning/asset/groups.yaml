    ### 1.3. 如何使用本书？\n\n本书旨在以实践的方式教你核心概念，重点聚焦于机器学习和深度学习中常用的线性代数主题。为进一步帮助你理解内容，每个概念都配有实用的\
    \ Python 代码。不要只是运行代码。请试着更进一步，修改代码并观察你所领悟到的内容，从而理解一切。\n\n## 第 2 章：线性代数基本定义\n\n\
    ### 2.1. 引言\n\n在机器学习 [1] 的实践过程中，你会不断听到与线性代数相关的流行术语。向量、矩阵、张量？这些都属于线性代数的基本定义。本章将介绍一些最常用的线性代数定义。\n\
    \n本章旨在达成以下目标：\n\n- 提供我们在处理机器学习时每天都会听到的线性代数基本定义。\n- 描述这些基本概念之间的联系。\n- 演示常用的数学记号。\n\
    \n如果你已经了解线性代数，或熟悉基本定义，你仍可能会发现本文的某些方面很有用，例如“常用数学记号”的表示方式。\n\n### 2.2. 标量与向量\n\n\
    根据数学定义，标量是“域中的一个元素，通常为实数域，用于定义向量空间。”简单来说，标量就是一个数。我们通常用小写符号表示标量，例如 `a`。\n\n值得对标量与向量做一番比较。你可能很熟悉诸如行驶汽车的速度和行驶方向这样的度量，它们既有大小也有方向。这类元素称为向量，而标量只有大小。我们用粗体符号表示向量，例如\
    \ **a**。\n\n下标通常表示向量的元素。例如，向量 **v** 的第二个元素记为 v₂。通常，我们将 k 维向量表示为元素数组：\n\n![](img/37669628775ca7a07835165249fef088_12_0.png)\n\
    \n图 2.1. 红色箭头 **v** 是向量，*a* 和 *b* 是标量，分别表示 **v** 在水平和垂直方向上的大小。\n\n**v** = $\\\
    begin{bmatrix} v_1 \\\\ v_2 \\\\ \\dots \\\\ v_{k-1} \\\\ v_k \\end{bmatrix}$\n\
    \n**记号：** 我们用 **v** ∈ ℝ^k 表示 k 维向量。\n\n### 2.3. 矩阵\n\n在数学中，矩阵是由元素（如数字）按行和列排列而成的矩形数组。通常，矩阵用粗体大写字母表示，如\
    \ **M**。下面是一个矩阵示例：\n\n**A** = $\\begin{bmatrix} 1 & -1 & 3 \\\\ 4 & 11 & -0.2\
    \ \\end{bmatrix}$\n\n我们用下标表示矩阵元素。在矩阵 **M** 中，第 *i* 行、第 *j* 列的元素记为 **M**_{i,j}。因此，对于上面的例子，可以很容易地说出\
    \ **M**_{1,2} = −1，**M**_{2,3} = −0.2。另一个重要记号是当我们希望将某一行或某一列作为一个整体引用时，即该行/列中的所有元素。这种情况下，我们在下标中使用“:”符号。例如，假设我们要引用矩阵\
    \ **M** 的第 *i* 行的所有元素。我们将该行记为 **M**_{i,:}。对于矩阵 **A**，**A**_{1,:} 如下所示：\n\n**A**_{1,:}\
    \ = $\\begin{bmatrix} 1 & -1 & 3 \\end{bmatrix}$\n\n**注意：** 我们通常用一列多行的元素来表示向量。因此，我们可以将大小为\
    \ $k$ 的向量称为 $k \\times 1$ 矩阵。一般来说，我们可以非正式地说，向量是一种特殊的矩阵，它是 1 维的。\n\n**记号：** 我们用\
    \ $\\mathbf{M} \\in \\mathbb{R}^{m\\times n}$ 表示矩阵，其中 $m$ 和 $n$ 分别是行数和列数。\n\n\
    ### 2.4. 张量\n\n在机器学习中，我们通常用数值表示数据。张量就是用于这种数值表示的。张量只是一个在 N 维空间中容纳数据的容器。一个张量可以容纳并表示多个矩阵。下面是一个示例：\n\
    \n$$\\begin{bmatrix}\\begin{bmatrix}10 & 3 & 3.1 \\\\ 6 & 12 & -0.2 \\\\ 1 & -2\
    \ & 7 \\\\ 4. & 1.1 & 81.1\\end{bmatrix} \\begin{bmatrix}1.0 & -1 & 3 \\\\ 4 &\
    \ 11 & -2 \\\\ 1.1 & -2 & -2 \\\\ 4 & 4 & -5\\end{bmatrix}\\end{bmatrix}$$\n\n\
    你可以将一个简单的 3D 张量视为下图所示的数据立方体：\n\n![](img/37669628775ca7a07835165249fef088_13_0.png)\n\
    \n**图 2.2.** 在此张量中，每种颜色代表一个矩阵，这些矩阵的拼接构成了张量。\n\n### 2.5. 总结\n\n本章描述了机器学习中最常用的一些线性代数定义。标量、向量、矩阵和张量是你最常听到的术语。在继续学习线性代数中的其他概念之前，了解它们至关重要。关于本章概念的更多细节，可参阅文献\
    \ [2–6]。\n\n## 第 3 章：NumPy 入门\n\n本章专门介绍 NumPy [7]，它是用于线性代数乃至机器学习的最重要的科学计算库之一！由于我们会频繁使用它来解释线性代数概念，因此了解如何使用它非常重要。\n\
    \n### 3.1. 引言\n\n几乎在**任何机器学习 Python 程序代码**中，你都会看到使用了“NumPy”库！为什么？没有线性代数，机器学习便无从谈起，而线性代数又是由向量、矩阵等构成的。**而\
