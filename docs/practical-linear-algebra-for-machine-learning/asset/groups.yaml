    ## Chapter 7: Matrix Decomposition


    This chapter is dedicated to explaining the concept of **matrix decomposition
    or factorization**, its definition, and the process. You will learn how you can
    decompose a matrix to its constituent elements.


    ### 7.1. Introduction


    What is the *benefit of decomposing a matrix*? What does that mean? When we *decompose
    anything*, we break it into its constituent elements. Assume we are going to disintegrate
    a **tool** (a car or a watch!). Such action helps us to understand the core particles
    and their tasks. Furthermore, it helps to have a better understanding of how that
    specific tool works and its characteristics! *Assume that the tool is a matrix
    which we would like to decompose.* There are different approaches to decompose
    a matrix. However, perhaps the most commonly used ones are matrix eigendecomposition
    and Singular Value Decomposition (SVD).


    ### 7.2. Matrix Eigendecomposition


    In this section, I am going to show you the definition of eigendecomposition and
    the subsequent concepts necessary to understand it.


    ### 7.2.1 Eigenvector and Eigenvalue


    Before we move on, we should know the definition of eigenvector and eigenvalue.
    The definition of eigenvector and eigenvalue are somehow connected.


    ### Definition


    Assuming we have the square matrix of \(A \in \mathbb{R}^{N\times N}\). The nonzero
    vector \(\mathbf{v} \in \mathbb{R}^{N\times 1}\) is an eigenvector and scalar
    \(\lambda\) is its associated eigenvalue if we have:


    \[A\mathbf{v}=\lambda\mathbf{v}\]


    From the above definition, it is clear that if \(\mathbf{v}\) is an eigenvector,
    any vector \(\alpha\mathbf{v}\), \(\alpha \in \mathbb{R}\) is also an eigenvector
    with the same eigenvalue \(\lambda\). Therefore, if we have one eigenvector, then
    we have infinite ones!


    ![](img/37669628775ca7a07835165249fef088_53_0.png)


    **Fig. 7.1.** Since \(\mathbf{v}\) is an eigenvector, any vector \(\alpha\mathbf{v}\)
    is also an eigenvector


    Due to that, it is customary to only work with eigenvectors that have **unit norm**.
    It is simple to construct an eigenvector with the unit norm. Assume \(\mathbf{v}\)
    is our eigenvector. Then, the following vector is also an eigenvector with the
    unit norm:


    \[\mathbf{w}=\alpha\mathbf{v}=\frac{1}{\lVert\mathbf{v}\rVert}\mathbf{v}\]


    where \(\lVert\mathbf{v}\rVert\) is the norm of vector \(\mathbf{v}\). We usually
    consider the euclidean norm.


    ### 7.2.2 The Process


    Here, the process of how we decompose a matrix to its constituent elements is
    explained. It is called the **eigendecomposition of a matrix**.


    ### Matrix Eigendecomposition


    Assume we have the square matrix of $A \in \mathbb{R}^{N\times N}$ which has $N$
    linearly independent eigenvectors $\mathbf{v}^i$, $i \in 1,\ldots,N$. Then, we
    can factorize matrix $A$ as below:


    $$A = V\Lambda V^{-1}$$


    where $V \in \mathbb{R}^{N\times N}$ is the square matrix whose $j^{th}$ column
    is the eigenvector $\mathbf{v}^j$ of $A$, and $\Lambda$ is the diagonal matrix
    whose diagonal elements are the corresponding eigenvalues, $\Lambda_{jj} = \lambda_j$.


    Above, we basically concatenate eigenvectors $\mathbf{v}^i$ to form the $V$ matrix
    as below:


    ![](img/37669628775ca7a07835165249fef088_54_0.png)


    ### 7.2.3 Discussion on Matrix Eigendecomposition


    Note that *we can only factorize* **diagonalizable matrices** as above. But the
    question is what is a diagonalizable matrix?


    ### Diagonalizable Matrix


    Assume we have the square matrix of $A \in \mathbb{R}^{N\times N}$. It is called
    diagonalizable or nondefective if there exists an invertible matrix $H$ such that
    $HAH^{-1}$ is a diagonal matrix.


    let’s have a more precise definition of a matrix being singular or non-singular.


    ### Singular Matrix


    Assume we have the square matrix of $A \in \mathbb{R}^{N\times N}$. It is called
    singular if and only if any of the eigenvalues $(\lambda)$ are zero.


    Under some circumstances, we can calculate the **matrix inverse** using the decomposition.


    ### Matrix Inverse


    Assume we have the square matrix **A** ∈ ℝ^{N×N}, it can be eigendecomposed and
    it is nonsingular. Therefore, we can calculate its inverse as below:


    **A**^{-1} = **V** Λ^{-1} **V**^{-1}


    Since Λ is diagonal, its inverse Λ^{-1} is also diagonal and we can calculate
    it as:


    Λ_{jj}^{-1} = 1 / λ_j


    ### 7.2.4 One Special Matrix Type and its Decomposition


    We are interested to investigate a special kind of matrix: **Real symmetric matrix**.
    A real symmetric matrix is basically a symmetric matrix in which all elements
    belong to the space of real numbers ℝ.


    For the **real symmetric matrix** of **A** ∈ ℝ^{N×N}, the eigenvalues are real
    numbers and we can choose eigenvectors in a way that they are orthogonal to each
    other. Then, we can factorize matrix **A** as below:


    **A** = **Q** Λ **Q**^{T}


    where **Q** is an orthogonal matrix whose columns are the eigenvectors of **A**,
    and Λ is a diagonal matrix whose diagonal elements are the corresponding eigenvalues,
    Λ_{jj} = λ_j.


    ### 7.2.5 Useful Properties


    So far, the concepts and how we can decompose a matrix were explained. Let’s see
    how we can leverage it. Assuming **A** ∈ ℝ^{N×N}:


    - The determinant of the matrix **A** equals the product of its eigenvalues.

    - The trace of the matrix **A** equals the summation of its eigenvalues.

    - If the eigenvalues of **A** are λ_i, and **A** is non-singular, then the eigenvalues
    of **A**^{-1} are simply 1/λ_i.

    - The eigenvectors of **A**^{-1} are the same as the eigenvectors of **A**.


    ### 7.3.4 Applications of SVD


    ### Moore–Penrose Pseudoinverse


    Before digging into how SVD can help us with pseudoinverse calculations, let’s
    talk about what is a Pseudoinverse?


    Assuming we have the matrix of **A** ∈ ℂ^{M×N}. Then, we have a pseudoinverse
    of **A**, defined as **A**⁺ ∈ ℂ^{M×N}, that satisfies all of the following criteria:


    - **A A**⁺ **A** = **A**

    - **A**⁺ **A A**⁺ = **A**⁺

    - (**A A**⁺)* = **A A**⁺

    - (**A**⁺ **A**)* = **A**⁺ **A**


    How we can *calculate the* **Pseudoinverse** *of a matrix using SVD*? If we have
    the SVD of a matrix **A** as **U**Σ**V**^*, then **A**⁺ can be calculated as below:


    **A**⁺ = **V**Σ⁺**U**^*


    where Σ⁺ is the pseudoinverse of Σ and we create it by replacing each non-zero
    diagonal entry σ in Σ by 1/σ and transposing the resulting matrix.


    ### Matrix Rank Determination


    Previously, the linear dependence and the matrix ranks were discussed. Now, as
    we have SVD, a more general approach compared to eigendecomposition, we can conclude
    the following directions.


    **Matrix Rank:** Assume we have the SVD of a matrix **A** as **U**Σ**V**^*. The
    rank of **A** equals the number of non-zero singular values which is the number
    of non-zero diagonal elements in Σ.


    ### 7.4. Conclusion


    In this chapter, the matrix decomposition (factorization) concept and two of its
    most used techniques were introduced. You learn what is matrix decomposition and
    how to do it. You also practiced to implement it in Python and NumPy. If you would
    like to know more about matrix decomposition, you can refer to [11, 12].

