  mdcn: "\n不要在意你的算法为何有效，也无法通过深入线性代数的细节来说服他们，那么**务必果断放弃**，去别处寻找你的锦绣前程吧！\n\n上面那些例子只是用以展示线性代数在机器学习中的重要性的简单示例。想在**一篇**文章中面面俱到地涵盖线性代数中对机器学习而言至关重要的每一个方面，确实很难（若非不可能）。我相信你会的，但还是建议你搜索一下“*线性代数在机器学习中的重要性*”，以探索更多内容！\n\
