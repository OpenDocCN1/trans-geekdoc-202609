    \n### 中间件\n\n要为组内的所有路由分配中间件，可以在定义组之前使用 `middleware` 方法。中间件按其在数组中列出的顺序执行：\n\n```php\n\
    Route::middleware(['first', 'second'])->group(function () {\n    Route::get('/',\
    \ function () {\n        // Uses first & second middleware...\n    });\n\n   \
    \ Route::get('/user/profile', function () {\n        // Uses first & second middleware...\n\
    \    });\n});\n```\n\n### 控制器\n\n如果一组路由都使用相同的控制器，可以使用 `controller` 方法为组内所有路由定义公共控制器。然后，在定义路由时，只需提供它们调用的控制器方法即可：\n\
    \n### 路由前缀\n\n```php\nRoute::prefix('admin')->group(function () {\n    Route::get('/users',\
    \ function () {\n        // Matches The \"/admin/users\" URL\n    });\n});\n```\n\
    \n### 路由名称前缀\n\n`name` 方法可用于为组中每个路由名称添加给定字符串作为前缀。例如，您可能希望将所有分组路由的名称都以 `admin`\
    \ 为前缀。给定的字符串会按原样添加到路由名称前缀中，因此我们应确保在前缀中提供尾部的 `.` 字符：\n\n```php\nRoute::name('admin.')->group(function\
    \ () {\n    Route::get('/users', function () {\n        // Route assigned name\
    \ \"admin.users\"...\n    })->name('users');\n});\n```\n\n## 路由模型绑定\n\n具有与请求 URI\
    \ 中对应值匹配的 ID。如果在数据库中找不到匹配的模型实例，将自动生成 404 HTTP 响应。\n\n当然，使用控制器方法时也可能进行隐式绑定。再次注意，`{user}`\
    \ URI 段与控制器中包含 `App\\Models\\User` 类型提示的 `$user` 变量匹配：\n\n```php\nuse App\\Http\\\
    Controllers\\UserController;\nuse App\\Models\\User;\n\n// Route definition...\n\
    Route::get('/users/{user}', [UserController::class, 'show']);\n\n// Controller\
    \ method definition...\npublic function show(User $user)\n{\n    return view('user.profile',\
    \ ['user' => $user]);\n}\n```\n\n### 软删除模型\n\n通常，隐式模型绑定不会检索已被软删除的模型。但是，您可以通过将\
    \ `withTrashed` 方法链式调用到路由定义上来指示隐式绑定检索这些模型：\n\n```php\nuse App\\Models\\User;\n\
    \nRoute::get('/users/{user}', function (User $user) {\n    return $user->email;\n\
    })->withTrashed();\n```\n\n### 自定义键\n\n有时您可能希望使用 `id` 以外的列解析 Eloquent 模型。为此，您可以在路由参数定义中指定列：\n\
    \n```php\nuse App\\Models\\Post;\n\nRoute::get('/posts/{post:slug}', function\
    \ (Post $post) {\n    return $post;\n});\n```\n\n如果您希望在检索给定模型类时模型绑定始终使用 `id` 以外的数据库列，可以重写\
    \ Eloquent 模型上的 `getRouteKeyName` 方法：\n\n```php\n/**\n * Get the route key for\
    \ the model.\n *\n * @return string\n */\npublic function getRouteKeyName()\n\
    {\n    return 'slug';\n}\n```\n\n### 自定义键与作用域\n\n在单个路由定义中隐式绑定多个 Eloquent 模型时，您可能希望将第二个\
    \ Eloquent 模型限定为必须是前一个 Eloquent 模型的子级。例如，考虑以下路由定义，它为特定用户按 slug 检索博客文章：\n\n```php\n\
    use App\\Models\\Post;\nuse App\\Models\\User;\n\nRoute::get('/users/{user}/posts/{post:slug}',\
    \ function (User $user, Post $post) {\n    return $post;\n});\n```\n\n使用自定义键的隐式绑定作为嵌套路由参数时，Laravel\
    \ 将自动限定查询以按检索嵌套模型\n\n由于我们已将所有 `{user}` 参数绑定到 `App\\Models\\User` 模型，因此该类的实例将被注入到路由中。因此，例如，对\
    \ `users/1` 的请求将注入数据库中 ID 为 `1` 的 `User` 实例。如果在数据库中找不到匹配的模型实例，将自动生成 404 HTTP 响应。\n\
    \n### 自定义解析逻辑\n\n如果您希望定义自己的模型绑定解析逻辑，可以使用 `Route::bind` 方法。传递给 `bind` 方法的闭包将接收\
    \ URI 段的值，并应返回应注入到路由中的类的实例。再次强调，此自定义应放在应用程序的 `RouteServiceProvider` 的 `boot` 方法中：\n\
    \n```php\nuse App\\Models\\User;\nuse Illuminate\\Support\\Facades\\Route;\n\n\
    /**\n * Define your route model bindings, pattern filters, etc.\n *\n * @return\
    \ void\n */\npublic function boot()\n{\n    Route::bind('user', function ($value)\
    \ {\n        return User::where('name', $value)->firstOrFail();\n    });\n\n \
    \   // ...\n}\n```\n\n或者，您可以重写 Eloquent 模型上的 `resolveRouteBinding` 方法。此方法将接收 URI\
    \ 段的值，并应返回应注入到路由中的类的实例：\n\n```php\n/**\n * Retrieve the model for a bound value.\n\
