    \ name=\"csrf-token\" content=\"{{ csrf_token() }}\">\n```\n\nThen, you can instruct\
    \ a library like jQuery to automatically add the token to all request headers.\n\
    \nThis provides simple, convenient CSRF protection for your AJAX based applications\
    \ using legacy JavaScript technology:\n\n```js\n$.ajaxSetup({\n    headers: {\n\
    \        'X-CSRF-TOKEN': $('meta[name=\"csrf-token\"]').attr('content')\n    }\n\
    });\n```\n\n## X-XSRF-TOKEN\n\nLaravel stores the ongoing CSRF token in an encoded\
    \ XSRF-TOKEN cookie that is included with every response created by the framework.\
    \ You can use the cookie's value to set the X-XSRF-TOKEN request header.\n\nThis\
    \ cookie is primarily sent as a developer convenience since some JavaScript frameworks\
