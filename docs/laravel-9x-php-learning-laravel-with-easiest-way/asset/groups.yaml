    如您所见，被解析的对象将被传递给回调，从而允许您在对象交付给其使用者之前设置任何附加属性。\n\n## 编写服务提供者\n\n所有服务提供者都扩展 Illuminate\\\
    Support\\ServiceProvider 类。\n\n大多数服务提供者包含 register 和 boot 方法。在 register 方法中，您应该只将事物绑定到服务容器中。您绝不应尝试在\
    \ register 方法中注册任何事件监听器、路由或任何其他功能。\n\nArtisan CLI 可以通过 make:provider 命令生成新的提供者：\n\
    \n```\nphp artisan make:provider RiakServiceProvider\n```\n\n## Register 方法\n\n\
    如前所述，在 register 方法中，您应该只将事物绑定到服务容器中。您绝不应尝试在 register 方法中注册任何事件监听器、路由或任何其他功能。否则，您可能会意外使用尚未加载的服务提供者提供的服务。让我们看一个基本的服务提供者。在您的任何服务提供者方法中，您始终可以访问\
    \ $app 属性，它提供了对服务容器的访问：\n\n```php\n<?php\n\nnamespace App\\Providers;\n\nuse App\\\
    Services\\Riak\\Connection;\nuse Illuminate\\Support\\ServiceProvider;\n\nclass\
    \ RiakServiceProvider extends ServiceProvider\n{\n    /**\n     * Register any\
    \ application services.\n     *\n     * @return void\n     */\n    public function\
    \ register()\n    {\n        $this->app->singleton(Connection::class, function\
    \ ($app) {\n            return new Connection(config('riak'));\n        });\n\
    \    }\n}\n```\n\n此服务提供者仅定义了 register 方法，并使用该方法在服务容器中定义 App\\Services\\Riak\\\
    Connection 的实现。如果您尚未熟悉 Laravel 的服务容器，请查看其文档。\n\n## bindings 和 singletons 属性\n\n\
    如果您的服务提供者注册了许多简单的绑定，您可能希望使用 bindings 和 singletons 属性，而不是手动注册每个容器绑定。当框架加载服务提供者时，它会自动检查这些属性并注册其绑定：\n\
