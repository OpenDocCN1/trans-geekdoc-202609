    \n## 简介\n\n在“现实世界”中使用任何工具时，如果你了解该工具的工作原理，你会更有信心。应用程序开发也不例外。当你了解开发工具如何运作时，你会更舒适、更有信心地使用它们。本文档的目标是让你对\
    \ Laravel 框架的工作原理有一个很好的高层概述。通过更好地了解整个框架，一切都会变得不那么“神奇”，你会更有信心构建你的应用程序。如果你不能马上理解所有术语，请不要灰心！只需试着基本掌握正在发生的事情，随着你探索文档的其他部分，你的知识会不断增长。\n\
    \n## 生命周期概述\n\n### 第一步\n\n所有请求进入 Laravel 应用程序的入口点是 `public/index.php` 文件。所有请求都由你的\
