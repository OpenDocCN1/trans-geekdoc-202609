    \     * @param  \\Illuminate\\Http\\Request  $request\n     * @param  \\Closure\
    \  $next\n     * @return mixed\n     */\n    public function handle($request,\
    \ Closure $next)\n    {\n        if ($request->input('token') !== 'my-secret-token')\
    \ {\n            return redirect('home');\n        }\n\n        return $next($request);\n\
    \    }\n}\n```\n\nAs you can see, if the given token does not match our secret\
    \ token, the middleware will return an HTTP redirect to the client; otherwise,\
    \ the request will be passed further into the application. To pass the request\
    \ deeper into the application (allowing the middleware to \"pass\"), you should\
    \ call the $next callback with the $request. It's best to envision middleware\
