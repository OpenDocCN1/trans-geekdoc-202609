    \ are only supported within the last route segment.\n\n# Named Routes\n\nNamed\
    \ routes allow the convenient generation of URLs or redirects for specific routes.\
    \ You may\n\nspecify a name for a route by chaining the name method onto the route\
    \ definition:\n\n```\nRoute::get('/user/profile', function () {\n    //\n})->name('profile');\n\
    ```\n\nYou may also specify route names for controller actions:"
  - "[PAGE 140]\n\n```\nRoute::get(\n    '/user/profile',\n    [UserProfileController::class,\
    \ 'show']\n)->name('profile');\n```\n\n> {note} Route names should always be unique.\n\
    \n# Generating URLs To Named Routes\n\nOnce you have assigned a name to a given\
    \ route, you may use the route's name when generating\n\nURLs or redirects via\
    \ Laravel's route and redirect helper functions:\n\n```\n// Generating URLs...\n\
    $url = route('profile');\n\n// Generating Redirects...\nreturn redirect()->route('profile');\n\
    ```\n\nIf the named route defines parameters, you may pass the parameters as the\
    \ second argument to\n\nthe route function. The given parameters will automatically\
    \ be inserted into\n\nthe generated URL"
  - "[PAGE 141]\n\nin their correct positions:\n\n```\n```php\nRoute::get('/user/{id}/profile',\
    \ function ($id) {\n    //\n})->name('profile');\n\n$url = route('profile', ['id'\
    \ => 1]);\n```\n```\n\nIf you pass additional parameters in the array, those key\
    \ / value pairs will automatically be added\n\nto the generated URL's query string:\n\
    \n```\n```php\nRoute::get('/user/{id}/profile', function ($id) {\n    //\n})->name('profile');\n\
    \n$url = route('profile', ['id' => 1, 'photos' => 'yes']);\n\n// /user/1/profile?photos=yes\n\
    ```\n```\n\n> {tip} Sometimes, you may wish to specify request-wide default values\
