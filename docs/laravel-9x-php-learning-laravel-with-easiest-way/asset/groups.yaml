    \ 文件加载 Composer 生成的自动加载器定义，然后从 `bootstrap/app.php` 获取 Laravel 应用程序实例。Laravel 自己做的第一件事是创建应用程序/服务容器的实例。\n\
    \n### HTTP / 控制台内核\n\n### 路由\n\n你的应用程序中最重要的服务提供者之一是 `App\\Providers\\RouteServiceProvider`。这个服务提供者加载应用程序目录中包含的路由文件。来吧，打开代码看看它是如何工作的！\n\
    \n一旦应用程序已经引导并且所有服务提供者都已注册，请求将被交给路由器进行分发。路由器会将请求分发到路由或控制器，并运行任何特定于路由的中间件。\n\n中间件提供了一种方便的机制来过滤或检查进入你的应用程序的\
    \ HTTP 请求。例如，Laravel 包含一个中间件，用于验证你的应用程序用户是否已认证。如果用户未通过认证，中间件会将用户重定向到登录界面。然而，如果用户已认证，中间件将允许请求进一步进行到应用程序中。一些中间件被分配给应用程序中的所有路由，比如那些在你的\
    \ HTTP 内核属性中定义的中间件，而另一些则仅分配给特定的路由或路由组。你可以通过阅读完整的中间件文档来了解更多关于中间件的信息。如果请求通过了所有匹配路由的\n\
    \n服务提供者存储在 `app/Providers` 目录中。默认情况下，`AppServiceProvider` 相当空。这个提供者是一个很好的地方，可以添加你自己的引导和服务容器绑定。对于大型应用程序，你可能希望创建多个服务提供者，每个服务提供者为你的应用程序使用的特定服务提供更细粒度的引导。\n\
    \n## 服务容器\n\n### 简介\n\n- 零配置解析\n- 何时使用容器\n\n### 绑定\n\n- 绑定基础\n- 将接口绑定到实现\n- 上下文绑定\n\
    - 绑定原始值\n- 绑定类型化可变参数\n- 标签\n- 扩展绑定\n\n### 解析\n\n- 使用 Make 方法\n\n```php\n<?php\n\
    \nnamespace App\\Http\\Controllers;\n\nuse App\\Http\\Controllers\\Controller;\n\
