    - Next Steps\n- Laravel The Full Stack Framework\n- Laravel The API Backend\n\n\
    ## Meet Laravel\n\nLaravel is a web application framework with expressive, elegant\
    \ syntax. A web framework provides a starting point for building your application,\
    \ allowing you to focus on creating something great while we take care of the\
    \ tedious tasks. Laravel strives to provide an amazing developer experience while\
    \ providing powerful features such as\n\nelegant dependency injection, an expressive\
    \ database abstraction layer, queues and scheduled tasks, unit and integration\
    \ testing, and more. Whether you are new to PHP or web frameworks or have years\
    \ of experience, Laravel is a framework that can grow with you. We'll help you\
    \ take your first steps as a web developer or provide a boost as you take your\
    \ skills to the next level. We can't wait to see what you build.\n\n## Why Laravel?\n\
    \nThere are a variety of tools and frameworks available to you when building a\
    \ web application.\n\nHowever, we believe Laravel is the best choice for building\
    \ modern, full-stack web applications.\n\n### A Progressive Framework\n\nWe like\
    \ to think of Laravel as a \"progressive\" framework. We mean that Laravel grows\
    \ with you. If you're just getting started in web development, Laravel's extensive\
    \ library of documentation, tutorials, and video screencasts will help you get\
    \ up to speed quickly without becoming overwhelmed. If you're a senior developer,\
    \ Laravel gives you powerful tools for dependency injection, unit testing, queues,\
    \ real-time events, and more. Laravel is\n\ntailored for building professional\
    \ web applications and ready to handle enterprise jobs.\n\n### A Scalable Framework\n\
    \nLaravel is incredibly scalable. Thanks to the scalability-friendly nature of\
    \ PHP and Laravel's built-in support for fast, distributed cache systems like\
    \ Redis, horizontal scaling with Laravel is a breeze. In fact, Laravel applications\
    \ have been successfully scaled to handle millions of requests per month. Need\
    \ extreme scaling? Platforms like Laravel Vapor allow you to run your Laravel\
    \ application at virtually unlimited scale on AWS's latest serverless technology.\n\
    \n### A Community Framework\n\nLaravel brings together the best packages in the\
    \ PHP ecosystem to offer the most robust and developer-friendly framework available.\
    \ Moreover, thousands of skilled developers from around the world have contributed\
    \ to the framework. Who knows, maybe you'll even become a Laravel contributor.\n\
    \n## Your First Laravel Project\n\nWe believe it should be as simple as possible\
    \ to get started with Laravel. There are a variety of options for developing and\
    \ running a Laravel project on your own computer. While you may want to explore\
    \ these options in the future, Laravel provides Sail, an official solution for\n\
    \nrunning your Laravel project using Docker. Docker is a tool for running applications\
    \ and services in small, lightweight \"containers\" which do not interfere with\
    \ your local computer's installed software or configuration. This means you don't\
    \ have to worry about configuring or setting up complex development tools like\
    \ web servers and databases on your computer. To get started, you just need to\
    \ install Docker Desktop. Laravel Sail is a lightweight command-line interface\
    \ for interacting with Laravel's default Docker configuration. Sail provides a\
    \ great starting point for building a Laravel application using PHP, MySQL, and\
    \ Redis without requiring prior Docker experience.\n\n{tip} Already a Docker expert?\
    \ Don't worry! Everything about Sail can be customized using the docker-compose.yml\
    \ file included with Laravel.\n\n### Getting Started On macOS\n\nIf you're developing\
    \ on a Mac and Docker Desktop is already installed, you can use a simple terminal\
    \ command to create a new Laravel project. For example, to create a new Laravel\
    \ application in a directory named \"example-app\", you may run the following\
    \ command in your terminal:\n\n```\ncurl -s \"https://laravel.build/example-app\"\
    \ | bash\n```\n\nObviously, you can change \"example-app\" in this URL to anything\
    \ you like. The Laravel application's files will be created inside the directory\
    \ you run the command from. After the project has been created, you can navigate\
    \ to the application directory and start Laravel Sail. Laravel Sail provides a\
    \ simple command-line interface for interacting with Laravel's default Docker\
    \ configuration:\n\n```\ncd example-app\n```\n\n```\n./vendor/bin/sail up\n```\n\
    \nThe first time you run the Sail up command, Sail's application containers will\
    \ be built on your machine.\n\n### Getting Started On Windows\n\nBefore we create\
    \ a new Laravel application on your Windows machine, make sure to install Docker\
    \ Desktop. Then, you should ensure that Windows Subsystem for Linux 2 (WSL2) is\
    \ installed and enabled. WSL allows you to run Linux binary executables natively\
    \ on Windows 10. Information on how to install and enable WSL2 can be found within\
    \ Microsoft's developer environment documentation.\n\n{tip} After installing and\
    \ enabling WSL2, you should ensure that Docker Desktop is\n\n```\ncd example-app\n\
    ```\n\n```\nphp artisan serve\n```\n\n## The Laravel Installer\n\nOr, you may\
    \ install the Laravel Installer as a global Composer dependency:\n\n```\ncomposer\
    \ global require laravel/installer\nlaravel new example-app\ncd example-app\n\
    php artisan serve\n```\n\nMake sure to place Composer's system-wide vendor bin\
    \ directory in your $PATH so the Laravel executable can be located by your system.\
    \ This directory exists in different locations based on your operating system;\
    \ however, some common locations include:\n\n- macOS: $HOME/.composer/vendor/bin\n\
    - Windows:\n  %USERPROFILE%\\AppData\\Roaming\\Composer\\vendor\\bin\n- GNU /\
    \ Linux Distributions: $HOME/.config/composer/vendor/bin\n  or\n  $HOME/.composer/vendor/bin\n\
    \nFor convenience, the Laravel installer can also create a Git repository for\
    \ your new project. To indicate that you want a Git repository to be created,\n\
    \n## Directory Configuration\n\nLaravel should always be served out of the root\
    \ of the \"web directory\" configured for your web server. You should not attempt\
    \ to serve a Laravel application out of a subdirectory of the \"web directory\"\
    . Attempting to do so could expose sensitive files that exist within your application.\n\
    \n## Next Steps\n\nSince you have created your Laravel project, you may be wondering\
    \ what to learn next. To begin with, we strongly recommend getting comfortable\
    \ with how Laravel works by reading the following documentation:\n\n- **Request\
    \ Lifecycle**\n- **Configuration**\n- **Directory Structure**\n- **Service Container**\n\
    - **Facades**\n\nHow you want to use Laravel will also guide the next steps on\
    \ your journey. There are a variety of ways to use Laravel, and we'll explore\
    \ two essential use cases for the framework below.\n\n## Laravel The Full Stack\
    \ Framework\n\nLaravel may serve as a full stack framework. By \"full stack\"\
    \ we mean that you will use Laravel to route requests to your application and\
    \ render your frontend via Blade templates or using a single-page application\
    \ hybrid technology like Inertia.js. This is the most common way to use the Laravel\
    \ framework. If this is how you intend to use Laravel, you may want to check out\
    \ our documentation on routing, views, or the Eloquent ORM. Also, you may be interested\
    \ in learning about community packages like Livewire and Inertia.js. These packages\
    \ allow you to use Laravel as a full-stack framework while enjoying many of the\
    \ UI benefits provided by single-page JavaScript applications. If you are using\
    \ Laravel as a full stack framework, we also strongly encourage you to learn how\
    \ to configure your application's CSS and JavaScript using Laravel Mix.\n\n{tip}\
    \ If you want to get a head start building your application, check out one of\
    \ our official application starter kits.\n\n## Laravel The API Backend\n\nLaravel\
    \ may also serve as an API backend to a JavaScript single-page application or\
    \ mobile application. For example, you could use Laravel as an API backend for\
    \ your Next.js application. In this situation, you might use Laravel to provide\
    \ authentication and data\n"
  mdcn: "\n## 安装\n\n- 认识 Laravel\n- 为什么选择 Laravel？\n- 你的第一个 Laravel 项目\n- 在 macOS\
