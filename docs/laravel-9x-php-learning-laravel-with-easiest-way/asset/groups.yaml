    Route files are included with Laravel: web.php, api.php, console.php, and channels.php.
    The web.php file contains routes that the RouteServiceProvider places in the web
    middleware group, which provides session state, CSRF protection, and cookie encryption.
    If your application doesn''t offer a stateless, RESTful API, then almost certainly
    each of your routes will be defined in the web.php file. The api.php file contains
    routes that the RouteServiceProvider places in the API middleware group. These
    routes are intended to be stateless, so requests entering the application through
    these routes are intended to be authenticated via tokens and will not have access
    to session state. The console.php file is where you may define all of your closure-based
    console commands. Each closure is bound to a command instance, providing a simple
    way to interact with each command''s IO methods. Although this file does not define
    HTTP routes, it does define console-based entry points (commands) in your application.
    The channels.php file is where you may register all of the event broadcasting
    channels that your application supports.


    ## The Storage Directory

    The storage directory contains your logs, compiled Blade views, file-based sessions,
    and files generated by the framework. This directory is divided into app, framework,
    and logs directories.


    The app directory may be used to store any files created by your application.
    The framework directory is used to store framework generated files and cache.
    Finally, the logs directory contains your application''s log files.


    The storage/app/public directory may be used to store user generated files, like
    profile avatars, that should be publicly accessible. You should create a symbolic
    link at public/storage which points to this directory. You may create the link
    using the php artisan storage:link Artisan command.


    ## The Tests Directory

    The tests directory contains your automated tests. Example PHPUnit unit tests
    and feature tests are provided out of the box. Each test class should be suffixed
    with the word "Test." You may run your tests using either the phpunit or php vendor/bin/phpunit
    commands. Alternatively, if you want a more precise and beautiful representation
    of your test results, you could run your tests using the php artisan test Artisan
    command.


    ## The Vendor Directory

    The vendor directory contains your Composer dependencies.


    ## The App Directory


    ## The Broadcasting Directory

    The Broadcasting directory contains all of the broadcast channel classes for your
    application. These classes are created using the make:channel command. This directory
    does not exist by default. However, it will be created for you when you create
    your first channel. To learn about channels, check the documentation on event
    broadcasting.


    ## The Console Directory

    The Console directory contains all of the custom Artisan commands for your application.
    These commands may be created using the make:command command. This directory also
    contains your console kernel, which is where your custom Artisan commands are
    registered and your scheduled tasks are defined.


    ## The Events Directory

    This directory does not exist by default, but will be created for you by the event:generate
    and make:event Artisan commands. The Events directory houses event classes. Events
    can be used


    You can use this to alert different parts of your application that a given action
    has occurred, providing a lot of flexibility and decoupling.


    ## The Exceptions Directory

    The Exceptions directory contains your application''s exception handler and is
    also a good place for any exceptions thrown by your application. If you would
    like to change how your exceptions are logged or rendered, you should modify the
    Handler class in this directory.


    ## The Http Directory

    The Http directory contains your controllers, middleware, and form requests. Almost
    all of the logic to handle requests entering your application will be placed in
    this directory.


    ## The Jobs Directory

    This directory does not exist by default, but will be created for you if you execute
    the make:job Artisan command. The Jobs directory houses the queueable jobs for
    your application. Jobs may be queued by your application or run synchronously
    within the current request lifecycle. Jobs that run synchronously during the current
    request are sometimes referred to as "commands" since they are an implementation
    of the command pattern.


    ## The Listeners Directory

    This directory does not exist by default, but will be created for you if you execute
    the event:generate or make:listener Artisan commands. The Listeners directory
    contains the classes that handle your events. Event listeners receive an event
    instance and perform logic in response to the event being fired. For example,
    a UserRegistered event might be handled by a SendWelcomeEmail listener.


    ## The Mail Directory

    This directory does not exist by default, but will be created for you if you execute
    the make:mail Artisan command. The Mail directory contains all of


    ## The Policies Directory

    This directory does not exist by default, but will be created for you if you execute
    the make:policy Artisan command. The Policies directory contains the authorization
    policy classes for your application. Policies are used to determine if a user
    can perform a given action against a resource.


    ## The Providers Directory

    The Providers directory contains all of the service providers for your application.
    Service providers bootstrap your application by binding services in the service
    container, registering events, or performing some other tasks to set up your application
    for incoming requests. In a new Laravel application, this directory will, as of
    now, contain a few providers. You are allowed to add your own providers to this
    directory on a case-by-case basis.


    ## The Rules Directory

    By default, there is no such directory. However, one will be created for you if
    you execute the make:rule Artisan command. The Rules directory contains the custom
    validation rule objects for your application. Rules are used to encapsulate complex
    validation logic in a simple object.


    For more information, check the validation documentation.


