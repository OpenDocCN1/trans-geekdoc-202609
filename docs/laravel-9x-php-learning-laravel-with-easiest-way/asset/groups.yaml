    VerifyCsrfToken middleware, which is included in the web middleware group by default,\
    \ will automatically verify that the token in the request input matches the token\
    \ stored in the session. When these two tokens match, we know that the authenticated\
    \ user is the one initiating the request.\n\n## CSRF Tokens & SPAs\n\nIf you are\
    \ building an SPA that is utilizing Laravel as an API backend, you should consult\
    \ the Laravel Sanctum documentation for information on authenticating with your\
    \ API and protecting against CSRF vulnerabilities.\n\n## Excluding URIs From CSRF\
    \ Protection\n\nSometimes you may wish to exclude a set of URIs from CSRF protection.\n\
    \nFor example, if you are using Stripe to process payments and are utilizing their\
