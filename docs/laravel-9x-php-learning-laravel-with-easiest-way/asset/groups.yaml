    \ if you would like to interact with the container outside of a service provider,\
    \ you may do so via the App facade:\n\n```php\nuse App\\Services\\Transistor;\n\
    use Illuminate\\Support\\Facades\\App;\n\nApp::bind(Transistor::class, function\
