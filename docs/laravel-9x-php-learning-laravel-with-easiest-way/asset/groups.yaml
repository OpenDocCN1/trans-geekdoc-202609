    \ which is the default URL used by the `serve` Artisan command.\n\n## Next.js\
    \ Reference Implementation\n\nFinally, you are ready to pair this backend with\
    \ the frontend of your choice. A Next reference implementation of the Breeze frontend\
    \ is available on GitHub. This frontend is maintained by Laravel and contains\
    \ the same user interface as the traditional Blade and Inertia stacks provided\
    \ by Breeze.\n\n## Laravel Jetstream\n\nWhile Laravel Breeze provides a simple\
    \ and minimal starting point for building a Laravel application, Jetstream augments\
    \ that functionality with more robust features and additional frontend technology\
    \ stacks. For those brand new to Laravel, we recommend learning the ropes with\
