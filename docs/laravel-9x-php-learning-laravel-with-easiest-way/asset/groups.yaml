  md: "\n```\n<?php\n\nclass Service\n{\n    //\n}\n\nRoute::get('/', function (Service\
    \ $service) {\n    die(get_class($service));\n});\n```\n\nIn this example, hitting\
    \ your application's / route will automatically resolve the Service class and\
    \ inject it into your route's handler. This is game changing. It means you can\
    \ develop your application and take advantage of dependency injection without\
    \ worrying about bloated configuration files. Thankfully, many of the classes\
    \ you will be writing when building a Laravel application automatically receive\
    \ their dependencies via the container, including controllers, event listeners,\
    \ middleware, and more. Additionally, you may type-hint dependencies in the handle\
    \ method of queued jobs. Once you taste the power of automatic and zero configuration\
    \ dependency injection it feels impossible to develop without it.\n\n## When To\
    \ Use The Container\n\nThanks to zero configuration resolution, you will often\
    \ type-hint dependencies on routes, controllers, event listeners, and elsewhere\
    \ without ever manually interacting with the container. For example, you might\
    \ type-hint the Illuminate\\Http\\Request object on your route definition so that\
    \ you can easily access the current request. Even though we never have to interact\
    \ with the container to write this code, it is managing the injection of these\
    \ dependencies behind the scenes:\n\n```\nuse Illuminate\\Http\\Request;\n\nRoute::get('/',\
    \ function (Request $request) {\n    // ...\n});\n```\n\nIn many cases, thanks\
    \ to automatic dependency injection and facades, you can build Laravel applications\
    \ without ever manually binding or resolving anything from the container. So,\
    \ when would you ever manually interact with the container? Let's examine two\
    \ situations. First, if you write a class that implements an interface and you\
    \ wish to type-hint that interface on a route or class constructor, you must tell\
    \ the container how to resolve that interface. Secondly, if\n\nNote that we receive\
