  mdcn: "\n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse App\\Http\\Controllers\\\
    Controller;\nuse Illuminate\\Support\\Facades\\Cache;\n\nclass UserController\
    \ extends Controller\n{\n    /**\n     * Show the profile for the given user.\n\
    \     *\n     * @param int $id\n     * @return Response\n     */\n    public function\
    \ showProfile($id)\n    {\n        $user = Cache::get('user:'.$id);\n\n      \
    \  return view('profile', ['user' => $user]);\n    }\n}\n```\n\n请注意，在文件顶部我们正在“导入”Cache\
    \ 门面。此门面作为访问 Illuminate\\Contracts\\Cache\\Factory 接口底层实现的代理。我们使用门面进行的任何调用都将传递给\
    \ Laravel 缓存服务的底层实例。\n\n如果我们查看 Illuminate\\Support\\Facades\\Cache 类，你会发现其中没有静态方法\
    \ get：\n\n```php\nclass Cache extends Facade\n{\n    /**\n     * Get the registered\
    \ name of the component.\n     *\n     * @return string\n     */\n    protected\
    \ static function getFacadeAccessor() { return 'cache'; }\n}\n```\n\n相反，Cache\
    \ 门面扩展了基础的 Facade 类并定义了 getFacadeAccessor() 方法。该方法的工作是返回服务容器绑定的名称。当用户在 Cache 门面上引用任何静态方法时，Laravel\
    \ 会从服务容器中解析缓存绑定并在该对象上运行请求的方法（在本例中为 get）。\n\n## 实时门面\n\n使用实时门面，你可以将应用程序中的任何类视为门面。为了说明其用法，我们先来看一段不使用实时门面的代码。\n\
    \n例如，假设我们的 Podcast 模型有一个 publish 方法。然而，为了发布播客，我们需要注入一个 Publisher 实例：\n\n```php\n\
    <?php\n\nnamespace App\\Models;\n\nuse App\\Contracts\\Publisher;\nuse Illuminate\\\
    Database\\Eloquent\\Model;\n\nclass Podcast extends Model\n{\n    /**\n     *\
    \ Publish the podcast.\n     *\n     * @param Publisher $publisher\n     * @return\
    \ void\n     */\n    public function publish(Publisher $publisher)\n    {\n  \
    \      $this->update(['publishing' => now()]);\n\n        $publisher->publish($this);\n\
    \    }\n}\n```\n\n当使用实时门面时，publisher 实现将使用接口或类名中 Facades 前缀之后的部分从服务容器中解析出来。在测试时，我们可以使用\
    \ Laravel 内置的门面测试助手来模拟此方法调用：\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\n\
    use App\\Models\\Podcast;\nuse Facades\\App\\Contracts\\Publisher;\nuse Illuminate\\\
    Foundation\\Testing\\RefreshDatabase;\nuse Tests\\TestCase;\n\nclass PodcastTest\
    \ extends TestCase\n{\n    use RefreshDatabase;\n\n    /**\n     * A test example.\n\
    \     *\n     * @return void\n     */\n    public function test_podcast_can_be_published()\n\
    \    {\n        $podcast = Podcast::factory()->create();\n\n        Publisher::shouldReceive('publish')->once()->with($podcast);\n\
    \n        $podcast->publish();\n    }\n}\n```\n\n## 门面类参考\n\n下面你将找到每个门面及其底层类。这是一个有用的工具，可快速查阅给定门面根的\
    \ API 文档。服务容器绑定键也在适用时包含在内。\n\n| 门面 | 类 | 服务容器绑定 |\n|---|---|---|\n| App | Illuminate\\\
    Foundation\\Application | app |\n| Artisan | Illuminate\\Contracts\\Console\\\
    Kernel | artisan |\n| Auth | Illuminate\\Auth\\AuthManager | auth |\n| Auth (Instance)\
    \ | Illuminate\\Contracts\\Auth\\Guard | auth.driver |\n| Blade | Illuminate\\\
    View\\Compilers\\BladeCompiler | blade.compiler |\n| Broadcast | Illuminate\\\
    Contracts\\Broadcasting\\Factory |  |\n| Broadcast (Instance) | Illuminate\\Contracts\\\
    Broadcasting\\Broadcaster |  |\n| Bus | Illuminate\\Contracts\\Bus\\Dispatcher\
    \ |  |\n| Cache | Illuminate\\Cache\\CacheManager | cache |\n| Cache (Instance)\
    \ | Illuminate\\Cache\\Repository | cache.store |\n| Config | Illuminate\\Config\\\
    Repository | config |\n| Cookie | Illuminate\\Cookie\\CookieJar | cookie |\n|\
    \ Crypt | Illuminate\\Encryption\\Encrypter | encrypter |\n| Date | Illuminate\\\
    Support\\DateFactory | date |\n| DB | Illuminate\\Database\\DatabaseManager |\
    \ db |\n| DB (Instance) | Illuminate\\Database\\Connection | db.connection |\n\
    | Event | Illuminate\\Events\\Dispatcher | events |\n| File | Illuminate\\Filesystem\\\
    Filesystem | files |\n| Gate | Illuminate\\Contracts\\Auth\\Access\\Gate |  |\n\
    | Hash | Illuminate\\Contracts\\Hashing\\Hasher | hash |\n| Http | Illuminate\\\
    Http\\Client\\Factory |  |\n| Lang | Illuminate\\Translation\\Translator | translator\
    \ |\n| Log | Illuminate\\Log\\LogManager | log |\n| Mail | Illuminate\\Mail\\\
    Mailer | mailer |\n| Notification | Illuminate\\Notifications\\ChannelManager\
    \ |  |\n| Password | Illuminate\\Auth\\Passwords\\PasswordBrokerManager | auth.password\
    \ |\n| Password (Instance) | Illuminate\\Auth\\Passwords\\PasswordBroker | auth.password.broker\
    \ |\n| Queue | Illuminate\\Queue\\QueueManager | queue |\n| Queue | Illuminate\\\
    Contracts\\Queue\\Queue | queue.connection |\n\n保护。routes/api.php 中的路由是无状态的，并被分配了\
    \ api 中间件组。\n\n对于大多数应用程序，你将首先在 routes/web.php 文件中定义路由。routes/web.php 中定义的路由可以通过在浏览器中输入定义的路由\
    \ URL 来访问。例如，你可以通过在浏览器中导航到 http://example.com/user 来访问以下路由：\n\n```\nuse App\\\
    Http\\Controllers\\UserController;\n\nRoute::get('/user', [UserController::class,\
    \ 'index']);\n```\n\nroutes/api.php 文件中定义的路由由 RouteServiceProvider 嵌套在路由组中。在此组内，/api\
    \ URI 前缀会自动应用，因此你无需手动将其应用于文件中的每条路由。你可以通过修改 RouteServiceProvider 类来修改前缀和其他路由组选项。\n\
    \n## 可用路由方法\n\n路由器允许你注册响应任何 HTTP 动词的路由：\n\n```\nRoute::get($uri, $callback);\n\
    Route::post($uri, $callback);\nRoute::put($uri, $callback);\nRoute::patch($uri,\
    \ $callback);\nRoute::delete($uri, $callback);\nRoute::options($uri, $callback);\n\
    ```\n\n有时你可能需要注册一条响应多个 HTTP 动词的路由。你可以使用 match 方法来实现。或者，你甚至可以使用 any 方法注册一条响应所有\
    \ HTTP 动词的路由：\n\n```\nRoute::match(['get', 'post'], '/', function () {\n    //\n\
    });\n\nRoute::any('/', function () {\n    //\n});\n```\n\n> {tip} 当定义多个共享相同 URI\
    \ 的路由时，使用 get、post、put、patch、delete 和 options 方法的路由应在使用 any、match 和 redirect 方法的路由之前定义。这可确保传入请求与正确的路由匹配。\n\
    \n## 依赖注入\n\n你可以在路由的回调签名中为路由所需的任何依赖项添加类型提示。声明的依赖项将由 Laravel 服务容器自动解析并注入到回调中。例如，你可以为\
    \ Illuminate\\Http\\Request 类添加类型提示，以便将当前 HTTP 请求自动注入到路由回调中：\n\n```php\nuse Illuminate\\\
    Http\\Request;\n\nRoute::get('/users', function (Request $request) {\n    // ...\n\
    });\n```\n\n## CSRF 保护\n\n请记住，指向在 web 路由文件中定义的 POST、PUT、PATCH 或 DELETE 路由的任何 HTML\
    \ 表单都应包含 CSRF 令牌字段。否则，请求将被拒绝。你可以在 CSRF 文档中阅读有关 CSRF 保护的更多信息：\n\n```blade\n<form\
    \ method=\"POST\" action=\"/profile\">\n    @csrf\n    ...\n</form>\n```\n\n##\
    \ 重定向路由\n"
