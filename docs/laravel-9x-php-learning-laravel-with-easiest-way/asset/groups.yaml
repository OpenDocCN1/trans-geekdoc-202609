    ## Named Arguments


    Named arguments are not covered by Laravel''s backwards compatibility rules. We
    may decide to rename method arguments when necessary to further develop the Laravel
    codebase. Accordingly, using named arguments while calling Laravel methods should
    be done carefully and with the understanding that the parameter names might change
    from now on.


    ## Support Policy


    For LTS releases, for example, Laravel 9, bug fixes are provided for 2 years and
    security fixes are provided for 3 years. These releases give the longest window
    of help and support. For general releases, bug fixes are provided for a year and
    a half and security fixes are provided for 2 years. For all of the additional
    libraries, including Lumen, undoubtedly the most recent release gets bug fixes.
    Moreover, please review the database versions supported by Laravel.


    The Laravel community and challenge our development team to ship amazing, robust
    new features without introducing breaking changes. Thus, we have shipped an assortment
    of robust features to Laravel 8 without breaking backwards compatibility, for
    example, parallel testing support, improved Breeze starter kits, HTTP client enhancements,
    and, surprisingly, new Eloquent relationship types, for example, "has one of many".
    As such, this commitment to ship amazing new features during the current release
    will likely lead to future "major" releases being primarily used for "maintenance"
    tasks, for example, upgrading upstream dependencies, which can be seen in these
    release notes. Laravel 9 continues with the improvements made in Laravel 8.x by
    introducing support for Symfony 6.0 components, Symfony Mailer, Flysystem 3.0,
    improved route:list output, a Laravel Scout database driver, new Eloquent accessor/mutator
    syntax, implicit route bindings through Enums, and an assortment of other bug
    fixes and convenience enhancements.


    ## Contribution Guide


    - Bug Reports

    - Support Questions

    - Core Development Discussion

    - Which Branch?

    - Compiled Assets

    - Security Vulnerabilities

    - Coding Style

    - PHPDoc

    - StyleCI

    - Code of Conduct


    The source code is managed on GitHub, and there are repositories for each of the
    Laravel projects.


    If you discover a security vulnerability within Laravel, please send an email
    to Taylor Otwell at taylor@laravel.com. All security vulnerabilities will be promptly
    addressed.


    ## Coding Style


    Laravel follows the PSR-2 coding standard and the PSR-4 autoloading standard.


    ## PHPDoc


    Below is an example of a valid Laravel documentation block. Note that the @param
    attribute is followed by two spaces, the argument type, two more spaces, and finally
    the variable name:


    ## StyleCI


    You can definitely relax in the event that your code styling is flawed! StyleCI
    will automatically merge any style fixes into the Laravel repository after pull
    requests are merged. This allows us to focus on the content of the contribution
    and not the code style.


    ## Code of Conduct


    The Laravel code of conduct is derived from the Ruby code of conduct. Any violation
    of the code of conduct may be reported to Taylor Otwell.


    - Participants will be tolerant of opposing views.

    - Participants must ensure that their language and actions are free of personal
    attacks and disparaging personal remarks.

    - When interpreting the words and actions of others, participants should always
    assume good intentions.

    - Behavior that can be reasonably considered harassment will not be tolerated.

