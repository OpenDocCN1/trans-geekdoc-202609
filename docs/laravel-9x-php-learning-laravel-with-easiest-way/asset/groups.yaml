    \n## 命名路由\n\n命名路由允许为特定路由方便地生成 URL 或重定向。您可以通过将 `name` 方法链式调用到路由定义上来为路由指定名称：\n\n\
    ```php\nRoute::get('/user/profile', function () {\n    //\n})->name('profile');\n\
    ```\n\n您也可以为控制器操作指定路由名称：\n\n```php\nRoute::get(\n    '/user/profile',\n    [UserProfileController::class,\
    \ 'show']\n)->name('profile');\n```\n\n> {note} 路由名称应始终唯一。\n\n### 生成命名路由的 URL\n\
    \n一旦您为给定路由分配了名称，就可以使用路由的名称通过 Laravel 的 `route` 和 `redirect` 辅助函数生成 URL 或重定向：\n\
    \n```php\n// Generating URLs...\n$url = route('profile');\n\n// Generating Redirects...\n\
    return redirect()->route('profile');\n```\n\n如果命名路由定义了参数，您可以将参数作为 `route` 函数的第二个参数传递。给定的参数将自动以正确的位置插入到生成的\
    \ URL 中：\n\n```php\nRoute::get('/user/{id}/profile', function ($id) {\n    //\n\
    })->name('profile');\n\n$url = route('profile', ['id' => 1]);\n```\n\n如果您在数组中传递额外参数，这些键/值对将自动添加到生成的\
    \ URL 的查询字符串中：\n\n```php\nRoute::get('/user/{id}/profile', function ($id) {\n\
    \    //\n})->name('profile');\n\n$url = route('profile', ['id' => 1, 'photos'\
    \ => 'yes']);\n\n// /user/1/profile?photos=yes\n```\n\n> {tip} 有时，您可能希望为 URL 参数指定请求范围的默认值，例如当前语言环境。为此，您可以使用\
    \ `URL::defaults` 方法。\n\n### 检查当前路由\n\n如果您想确定当前请求是否路由到给定的命名路由，可以在 `Route` 实例上使用\
