  mdcn: "\n```\n<?php\n\nclass Service\n{\n    //\n}\n\nRoute::get('/', function (Service\
    \ $service) {\n    die(get_class($service));\n});\n```\n\n在此示例中，访问应用程序的 / 路由时，将自动解析\
    \ Service 类并将其注入到路由的处理程序中。这是一个颠覆性的变化。这意味着你可以开发应用程序并利用依赖注入，而无需担心臃肿的配置文件。值得庆幸的是，在构建\
    \ Laravel 应用程序时，你编写的许多类会自动通过容器接收它们的依赖项，包括控制器、事件监听器、中间件等。此外，你可以在队列任务的 handle 方法中为依赖项添加类型提示。一旦你体验到自动且零配置依赖注入的强大功能，就很难想象没有它进行开发。\n\
    \n## 何时使用容器\n\n由于零配置解析，你经常会在路由、控制器、事件监听器等地方为依赖项添加类型提示，而无需手动与容器交互。例如，你可以在路由定义上为\
    \ Illuminate\\Http\\Request 对象添加类型提示，以便轻松访问当前请求。即使我们编写此代码时无需与容器交互，它也在幕后管理这些依赖项的注入：\n\
    \n```\nuse Illuminate\\Http\\Request;\n\nRoute::get('/', function (Request $request)\
    \ {\n    // ...\n});\n```\n\n在许多情况下，由于自动依赖注入和门面的存在，你可以构建 Laravel 应用程序，而无需手动从容器绑定或解析任何内容。那么，你会在什么时候手动与容器交互呢？让我们来看看两种情况。首先，如果你编写了一个实现接口的类，并且希望在路由或类构造函数上为该接口添加类型提示，你必须告诉容器如何解析该接口。其次，如果\n\
    \n请注意，我们将容器本身作为参数传递给解析器。然后我们可以使用容器来解析我们正在构建的对象的子依赖项。如前所述，你通常会在服务提供者中与容器交互；然而，如果你想在服务提供者之外与容器交互，可以通过\
    \ App 门面进行：\n\n```php\nuse App\\Services\\Transistor;\nuse Illuminate\\Support\\\
    Facades\\App;\n\nApp::bind(Transistor::class, function ($app) {\n    // ...\n\
    });\n```\n\n> {tip} 如果类不依赖于任何接口，则无需将其绑定到容器中。容器无需被告知如何构建这些对象，因为它可以使用反射自动解析这些对象。\n\
    \n## 绑定单例\n\nsingleton 方法将一个类或接口绑定到容器中，该类或接口只应解析一次。一旦单例绑定被解析，后续对容器的调用将返回相同的对象实例：\n\
    \n```php\nuse App\\Services\\Transistor;\nuse App\\Services\\PodcastParser;\n\n\
    $this->app->singleton(Transistor::class, function ($app) {\n    return new Transistor($app->make(PodcastParser::class));\n\
    });\n```\n\n你可以轻松地注入带有该标签的所有容器绑定：\n\n```\n$this->app->when(ReportAggregator::class)\n\
    \    ->needs('$reports')\n    ->giveTagged('reports');\n```\n\n如果需要从应用程序的配置文件中注入一个值，可以使用\
    \ giveConfig 方法：\n\n```\n$this->app->when(ReportAggregator::class)\n    ->needs('$timezone')\n\
    \    ->giveConfig('app.timezone');\n```\n\n## 绑定类型化可变参数\n\n有时，你可能有一个类使用可变参数构造函数参数接收一组类型化对象：\n\
    \n```\n<?php\n\nuse App\\Models\\Filter;\nuse App\\Services\\Logger;\n\nclass\
    \ Firewall\n{\n    /**\n     * The logger instance.\n     *\n     * @var \\App\\\
    Services\\Logger\n     */\n    protected $logger;\n\n    /**\n     * The filter\
    \ instances.\n     *\n     * @var array\n     */\n    protected $filters;\n\n\
    \    /**\n     * Create a new class instance.\n```\n\n```\n$this->app->when(Firewall::class)\n\
    \    ->needs(Filter::class)\n    ->give([\n        NullFilter::class,\n      \
    \  ProfanityFilter::class,\n        TooLongFilter::class,\n    ]);\n```\n\n##\
    \ 可变参数标签依赖\n\n有时，一个类可能具有可变参数依赖项，其类型提示为给定类（ Report ...$reports ）。使用 needs 和 giveTagged\
    \ 方法，你可以轻松地为给定依赖项注入带有该标签的所有容器绑定。\n\n```\n$this->app->when(ReportAggregator::class)\n\
    \    ->needs(Report::class)\n    ->giveTagged('reports');\n```\n\n## 标签\n\n有时，你可能需要解析某一类绑定中的所有内容。例如，也许\n\
    \n接受一个闭包作为其唯一参数，该闭包应返回修改后的服务。闭包接收正在解析的服务和容器实例：\n\n```\n$this->app->extend(Service::class,\
    \ function ($service, $app) {\n    return new DecoratedService($service);\n});\n\
    ```\n\n## 解析\n\n### make 方法\n\n你可以使用 make 方法从容器中解析类实例。make 方法接受你希望解析的类或接口的名称：\n\
    \n```\nuse App\\Services\\Transistor;\n\n$transistor = $this->app->make(Transistor::class);\n\
