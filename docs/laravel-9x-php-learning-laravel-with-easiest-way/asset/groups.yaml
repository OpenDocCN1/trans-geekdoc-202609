    # Writing Service Providers


    All service providers extend the Illuminate\Support\ServiceProvider class.


    Most service providers contain a register and a boot method. Within the register
    method, you should


    only bind things into the service container. You should never attempt to register
    any event listeners, routes, or any other piece of functionality within the register
    method.


    The Artisan CLI can generate a new provider via the make:provider command:


    ```

    php artisan make:provider RiakServiceProvider

    ```


    # The Register Method


    As mentioned previously, within the register method, you should only bind things
    into the


    service container. You should never attempt to register any event listeners, routes,
    or any other piece of functionality within the register method. Otherwise, you
    may accidentally use a service


    that is provided by a service provider which has not loaded yet. Let''s take a
    look at a basic service provider. Within any of your service provider'
  - "[PAGE 101]\n\nmethods, you always have access to the $app property which provides\
    \ access to the service container:\n\n```\n```php\n<?php\n\nnamespace App\\Providers;\n\
    \nuse App\\Services\\Riak\\Connection;\nuse Illuminate\\Support\\ServiceProvider;\n\
    \nclass RiakServiceProvider extends ServiceProvider\n{\n    /**\n     * Register\
    \ any application services.\n     *\n     * @return void\n     */\n    public\
    \ function register()\n    {\n        $this->app->singleton(Connection::class,\
    \ function ($app) {\n            return new Connection(config('riak'));\n    \
    \    });\n    }\n}\n```\n```\n\nThis service provider only defines a register\
    \ method, and uses that method to define an implementation of App\\Services\\\
