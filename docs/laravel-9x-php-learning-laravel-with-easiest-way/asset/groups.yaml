  md: "\n## Configuration\n- Introduction\n- Environment Configuration\n  - Environment\
    \ Variable Types\n  - Retrieving Environment Configuration\n  - Determining The\
    \ Current Environment\n- Accessing Configuration Values\n- Configuration Caching\n\
    - Debug Mode\n- Maintenance Mode\n\n## Introduction\nAll of the configuration\
    \ files for your Laravel application are stored in the config directory. Each\
    \ option is documented, so go ahead and browse through the files and familiarize\
    \ yourself with the options available to you. These configuration files allow\
    \ you to configure things like your database connection information, your mail\
    \ server settings, as well as various other core configuration values, such as\
    \ your application timezone and encryption key.\n\n## Environment Configuration\n\
    It is frequently useful to have different configuration values depending on the\
    \ environment where the application is running. For instance, you might wish to\
    \ use a different cache driver locally than you do on your production server.\
    \ To make this easy, Laravel uses the DotEnv PHP library. In a new Laravel installation,\
    \ the root directory of your application will contain a .env.example file that\
    \ defines many common environment variables. During the Laravel installation process,\
    \ this file will automatically be copied to .env. Laravel's default .env file\
    \ contains some common configuration values that might vary depending on whether\
    \ your application is running locally or on a production web server. These values\
    \ are then retrieved from various Laravel configuration files inside the config\
    \ directory using Laravel's env function. If you are developing with a team, you\
    \ might wish to keep\nincluding a .env.example file with your application. By\
    \ placing placeholder values in the example file, different developers in your\
    \ team can clearly see which environment variables are required to run your application.\n\
    \n> {tip} Any variable in your .env file can be overridden by external environment\
    \ variables such as server-level or system-level environment variables.\n\n##\
    \ Environment File Security\nYour .env file should not be committed to your application's\
    \ source control, since each developer/server using your application could require\
    \ a different environment configuration. Moreover, this would be a security risk\
    \ in the event an intruder accesses your source control repository, since any\
    \ sensitive credentials would be exposed.\n\n## Additional Environment Files\n\
    Prior to loading your application's environment variables, Laravel determines\
    \ whether either the APP_ENV environment variable has been externally provided\
    \ or if the --env CLI argument has been specified. If this is the case, Laravel\
    \ will attempt to load an .env.[APP_ENV] file if it exists. If it doesn't exist,\
    \ the default .env file will be loaded.\n\n## Environment Variable Types\nIn fact,\
    \ you will see that many of the options are already using this helper:\n```\n\
    'debug' => env('APP_DEBUG', false),\n```\nThe second value passed to the env function\
    \ is the \"default value\". This value will be returned if no environment variable\
    \ exists for the given key.\n\n## Determining The Current Environment\nThe current\
    \ application environment is determined via the APP_ENV variable from your .env\
    \ file.\n\nYou may access this value via the environment method on the App facade:\n\
    ```\nuse Illuminate\\Support\\Facades\\App;\n\n$environment = App::environment();\n\
    ```\nYou may also pass arguments to the environment method to determine if the\
    \ environment matches a given value. The method will return true if the environment\
    \ matches any of the given values:\n```\nif (App::environment('local')) {\n  \
    \  // The environment is local\n}\n\nif (App::environment(['local', 'staging']))\
    \ {\n    // The environment is either local OR staging...\n}\n```\n{tip} The current\
    \ application environment detection can be overridden by defining a server-level\
    \ APP_ENV environment variable.\n\n## Accessing Configuration Values\nYou may\
    \ easily access your configuration values using the global config helper function\
    \ from anywhere in your application. The configuration values may be accessed\
    \ using \"dot\" notation, which includes the name of the file and option you wish\
    \ to access. A default value may also be specified, which will be returned if\
    \ the configuration option does not exist:\n```\n$value = config('app.timezone');\n\
    \n// Retrieve a default value if the configuration value does not exist...\n$value\
    \ = config('app.timezone', 'Asia/Seoul');\n```\nTo set configuration values at\
    \ runtime, pass an array to the config helper:\n```\nconfig(['app.timezone' =>\
    \ 'America/Chicago']);\n```\n\n## Configuration Caching\nTo give your application\
    \ a speed boost, you should cache all of your configuration files into a single\
    \ file using the config:cache Artisan command. This will combine all of the configuration\
    \ options for your application into a single file which can be quickly loaded\
    \ by the framework. You should typically run the php artisan config:cache command\
    \ as part of your production deployment process. The command should not be run\
    \ during local development as configuration options will often need to be modified\
    \ during the course of your application's development.\n\n> {note} If you execute\
    \ the config:cache command during your deployment process, you should be sure\
    \ that you are only calling the env function from within your configuration files.\
    \ Once the configuration has been cached, the .env file will not be loaded; therefore,\
    \ the env function will only return external, system level environment variables.\n\
    \n## Debug Mode\nThe debug option in your config/app.php configuration file determines\
    \ how much information about an error is actually displayed to the user. By default,\
    \ this option is set to respect the value of the APP_DEBUG\n```\nphp artisan down\
    \ --refresh=15\n```\nYou may also provide a retry option to the down command,\
    \ which will be set as the Retry After HTTP header's value, although browsers\
    \ generally ignore this header:\n```\nphp artisan down --retry=60\n```\n\n## Bypassing\
    \ Maintenance Mode\nEven while in maintenance mode, you may use the secret option\
    \ to specify a maintenance mode bypass token:\n```\nphp artisan down --secret=\"\
    1630542a-246b-4b66-afa1-dd72a4c43515\"\n```\nAfter placing the application in\
    \ maintenance mode, you may navigate to the application URL matching this token\
    \ and Laravel will issue a maintenance mode bypass cookie to your browser:\n```\n\
    https://example.com/1630542a-246b-4b66-afa1-dd72a4c43515\n```\nWhen accessing\
    \ this hidden route, you will then be redirected to the / route of the application.\
    \ Once the cookie has been issued to your browser, you will be able to browse\
    \ the application normally as if it was not in maintenance mode.\n\n{tip} Your\
    \ maintenance mode secret should typically consist of alpha-numeric characters\n\
    \n## Directory Structure\n## Introduction\n## The Root Directory\n- The app Directory\n\
    - The bootstrap Directory\n- The config Directory\n- The database Directory\n\
    - The public Directory\n- The resources Directory\n- The routes Directory\n- The\
    \ storage Directory\n- The tests Directory\n- The vendor Directory\n\n## The App\
    \ Directory\n- The Broadcasting Directory\n- The Console Directory\n- The Events\
    \ Directory\n- The Exceptions Directory\n- The Http Directory\n- The Jobs Directory\n\
    - The Listeners Directory\n- The Mail Directory\n- The Models Directory\n- The\
    \ Notifications Directory\n- The Policies Directory\n\nThe config directory, as\
    \ the name implies, contains all of your application's configuration files. It's\
    \ a great idea to read through all of these files and familiarize yourself with\
    \ all of the options available to you.\n\n## The Database Directory\nThe resources\
    \ directory contains your views along with your raw, uncompiled assets like CSS\
    \ and JavaScript. This directory also houses all of your language files.\n\n##\
    \ The Public Directory\nThe public directory contains the index.php file, which\
    \ is the entry point for all requests entering your application and configures\
    \ autoloading. This directory also houses your assets such as images, JavaScript,\
    \ and CSS.\n\n## The Resources Directory\nThe resources directory contains your\
    \ views along with your raw, uncompiled assets like CSS and JavaScript. This directory\
    \ likewise houses all of your language files.\n\n## The Routes Directory\nThe\
    \ route directory contains all of the route definitions for your application.\
    \ Naturally, a few\n"
  mdcn: "\n## Configuration\n- 简介\n- 环境配置\n  - 环境变量类型\n  - 获取环境配置\n  - 确定当前环境\n- 访问配置值\n\
    - 配置缓存\n- 调试模式\n- 维护模式\n\n## 简介\n所有 Laravel 应用的配置文件都存储在 config 目录中。每个选项都有文档说明，因此请随意浏览文件并熟悉可用的选项。这些配置文件允许你配置诸如数据库连接信息、邮件服务器设置以及各种其他核心配置值，例如应用程序时区和加密密钥。\n\
    \n## 环境配置\n根据应用程序运行的环境拥有不同的配置值通常很有用。例如，你可能希望在本地使用与生产服务器不同的缓存驱动。为了方便这一点，Laravel\
    \ 使用 DotEnv PHP 库。在新的 Laravel 安装中，应用程序的根目录将包含一个 .env.example 文件，其中定义了许多常见的环境变量。在\
    \ Laravel 安装过程中，此文件将自动复制为 .env。Laravel 默认的 .env 文件包含一些常见的配置值，这些值可能因应用程序是在本地运行还是在生产\
    \ Web 服务器上运行而异。然后，这些值会使用 Laravel 的 env 函数从 config 目录内的各种 Laravel 配置文件中检索。如果你与团队一起开发，你可能希望继续\n\
    包含 .env.example 文件与你的应用程序一起。通过在示例文件中放置占位符值，你团队中的不同开发人员可以清楚地看到运行应用程序所需的环境变量。\n\n\
    > {tip} .env 文件中的任何变量都可以通过外部环境变量（如服务器级或系统级环境变量）覆盖。\n\n## 环境文件安全\n你的 .env 文件不应提交到应用程序的源代码控制中，因为使用你的应用程序的每个开发人员/服务器可能需要不同的环境配置。此外，如果入侵者访问你的源代码控制仓库，这将是一个安全风险，因为任何敏感凭据都将被暴露。\n\
    \n## 附加环境文件\n在加载应用程序的环境变量之前，Laravel 会确定 APP_ENV 环境变量是否已外部提供或是否指定了 --env CLI 参数。如果是这种情况，Laravel\
    \ 将尝试加载一个 .env.[APP_ENV] 文件（如果存在）。如果不存在，则将加载默认的 .env 文件。\n\n## 环境变量类型\n事实上，你会看到许多选项已经在使用此助手：\n\
    ```\n'debug' => env('APP_DEBUG', false),\n```\n传递给 env 函数的第二个值是“默认值”。如果不存在给定键的环境变量，将返回此值。\n\
    \n## 确定当前环境\n当前应用程序环境是通过 .env 文件中的 APP_ENV 变量确定的。\n\n你可以通过 App 门面上的 environment\
    \ 方法访问此值：\n```\nuse Illuminate\\Support\\Facades\\App;\n\n$environment = App::environment();\n\
    ```\n你也可以向 environment 方法传递参数，以确定环境是否与给定值匹配。如果环境匹配任何给定值，该方法将返回 true：\n```\nif\
    \ (App::environment('local')) {\n    // The environment is local\n}\n\nif (App::environment(['local',\
    \ 'staging'])) {\n    // The environment is either local OR staging...\n}\n```\n\
    {tip} 当前应用程序环境检测可以通过定义服务器级的 APP_ENV 环境变量来覆盖。\n\n## 访问配置值\n你可以使用全局 config 辅助函数从应用程序的任何位置轻松访问配置值。配置值可以使用“点”符号访问，其中包括你想要访问的文件名和选项。也可以指定默认值，如果配置选项不存在，将返回该值：\n\
    ```\n$value = config('app.timezone');\n\n// Retrieve a default value if the configuration\
    \ value does not exist...\n$value = config('app.timezone', 'Asia/Seoul');\n```\n\
    要在运行时设置配置值，请向 config 辅助函数传递一个数组：\n```\nconfig(['app.timezone' => 'America/Chicago']);\n\
    ```\n\n## 配置缓存\n为了给你的应用程序提速，你应该使用 config:cache Artisan 命令将所有配置文件缓存到单个文件中。这将把应用程序的所有配置选项合并到一个文件中，框架可以快速加载。你通常应该在生产部署流程中运行\
    \ php artisan config:cache 命令。在本地开发期间不应运行此命令，因为在应用程序开发过程中配置选项通常需要修改。\n\n> {note}\
    \ 如果你在部署过程中执行 config:cache 命令，你应确保仅在配置文件中调用 env 函数。一旦配置被缓存，.env 文件将不会被加载；因此，env\
    \ 函数将仅返回外部、系统级环境变量。\n\n## 调试模式\nconfig/app.php 配置文件中的 debug 选项决定了向用户实际显示的错误信息的数量。默认情况下，此选项设置为尊重\
    \ APP_DEBUG 的值\n```\nphp artisan down --refresh=15\n```\n你也可以为 down 命令提供 retry\
    \ 选项，它将被设置为 Retry After HTTP 头的值，尽管浏览器通常会忽略此头：\n```\nphp artisan down --retry=60\n\
    ```\n\n## 绕过维护模式\n即使在维护模式下，你也可以使用 secret 选项指定维护模式绕过令牌：\n```\nphp artisan down\
    \ --secret=\"1630542a-246b-4b66-afa1-dd72a4c43515\"\n```\n将应用程序置于维护模式后，你可以导航到与此令牌匹配的应用程序\
    \ URL，Laravel 将向你的浏览器发放维护模式绕过 cookie：\n```\nhttps://example.com/1630542a-246b-4b66-afa1-dd72a4c43515\n\
