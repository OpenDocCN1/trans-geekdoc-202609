    \n        return view('user.profile', ['user' => $user]);\n    }\n}\n```\n\n在这个例子中，`UserController`\
    \ 需要从数据源中检索用户。因此，我们将注入一个能够检索用户的服务。在这种情况下，我们的 `UserRepository` 很可能使用 Eloquent 从数据库中检索用户信息。然而，由于仓库是被注入的，我们可以轻松地用另一个实现替换它。在测试应用程序时，我们还可以轻松地“模拟”或创建\
