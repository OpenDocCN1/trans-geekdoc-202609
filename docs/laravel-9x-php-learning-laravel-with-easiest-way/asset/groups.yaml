    破坏性变更。在从你的应用或扩展包引用 Laravel 系统或其任何部分时，你应该始终使用版本约束，例如 `^9.0`，因为 Laravel 的主要版本确实会引入破坏性变更。无论如何，我们努力始终确保你可以在一天或更短的时间内升级到新的主要版本。


    ## 命名参数


    命名参数不受 Laravel 向后兼容规则的保护。为了进一步开发 Laravel 代码库，我们可能决定在必要时重命名方法参数。因此，在调用 Laravel
    方法时使用命名参数应谨慎，并理解参数名称今后可能会改变。


    ## 支持策略


    对于 LTS 版本，例如 Laravel 9，提供 2 年的错误修复和 3 年的安全修复。这些版本提供最长的帮助和支持窗口。对于一般版本，错误修复提供一年半，安全修复提供
    2 年。对于所有其他库，包括 Lumen，最新的版本无疑会获得错误修复。此外，请查看 Laravel 支持的数据库版本。


    Laravel 社区向我们的开发团队提出挑战，要求在不引入破坏性变更的情况下交付出色、健壮的新功能。因此，我们为 Laravel 8 提供了一系列健壮的功能，而没有破坏向后兼容性，例如并行测试支持、改进的
    Breeze 入门套件、HTTP 客户端增强，以及令人惊讶的新 Eloquent 关系类型，例如 "has one of many"。因此，这种在当前版本中交付出色新功能的承诺，可能会导致未来的
    "主要" 版本主要用于 "维护" 任务，例如升级上游依赖，这在版本说明中可以看到。Laravel 9 延续了 Laravel 8.x 的改进，引入了对 Symfony
    6.0 组件、Symfony Mailer、Flysystem 3.0、改进的 route:list 输出、Laravel Scout 数据库驱动、新的 Eloquent
    访问器/修改器语法、通过枚举的隐式路由绑定，以及其他各种错误修复和便利性增强的支持。


