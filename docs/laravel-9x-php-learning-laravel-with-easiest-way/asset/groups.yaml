  mdcn: "\n```php\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\n\nclass\
    \ EnsureTokenIsValid\n{\n    /**\n     * Handle an incoming request.\n     *\n\
    \     * @param  \\Illuminate\\Http\\Request  $request\n     * @param  \\Closure\
    \  $next\n     * @return mixed\n     */\n    public function handle($request,\
    \ Closure $next)\n    {\n        if ($request->input('token') !== 'my-secret-token')\
    \ {\n            return redirect('home');\n        }\n\n        return $next($request);\n\
    \    }\n}\n```\n\n正如你所见，如果给定的令牌与我们的 secret token 不匹配，中间件将向客户端返回一个 HTTP 重定向；否则，请求将被传递到应用程序的更深处。要将请求传递到应用程序的更深处（允许中间件“放行”），你应该使用\
    \ $request 调用 $next 回调。最好将中间件想象成一系列“层”，HTTP 请求必须穿过这些层才能到达你的应用程序。每一层都可以检查请求，甚至完全拒绝它。\n\
    \n> {tip} 所有中间件都通过服务容器解析，因此你可以在中间件的构造函数中为所需的任何依赖项进行类型提示。\n\n## 中间件与响应\n\n当然，中间件可以在将请求传递到应用程序的更深处之前或之后执行任务。例如，以下中间件将在请求由应用程序处理之前执行某些任务：\n\
    \n```php\n\\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n\\Illuminate\\\
    Auth\\Middleware\\Authorize::class,\n];\n```\n\n## 中间件参数\n\n中间件还可以接收额外的参数。例如，如果你的应用程序需要在执行某个操作之前验证已认证用户是否具有给定的“角色”，你可以创建一个\
    \ EnsureUserHasRole 中间件，使其接收角色名称作为额外参数。\n\n额外的中间件参数将在 $next 参数之后传递给中间件：\n\napp/Http/Kernel.php\
    \ 文件。当在中间件上调用 terminate 方法时，Laravel 将从服务容器解析中间件的新实例。如果你希望在调用 handle 和 terminate\
    \ 方法时使用同一个中间件实例，请使用容器的 singleton 方法将中间件注册到容器中。通常这应该在你的 AppServiceProvider 的 register\
    \ 方法中完成：\n\n```php\nuse App\\Http\\Middleware\\TerminatingMiddleware;\n\n/**\n\
    \ * Register any application services.\n *\n * @return void\n */\npublic function\
    \ register()\n{\n    $this->app->singleton(TerminatingMiddleware::class);\n}\n\
    ```\n\nemail 输入字段用于包含用户希望开始使用的电子邮件地址。如果没有 CSRF 保护，恶意网站可以创建一个指向你应用程序 /user/email\
    \ 路由的 HTML 表单并提交恶意用户自己的电子邮件地址：\n\n```html\n<form action=\"https://your-application.com/user/email\"\
    \ method=\"POST\">\n    <input type=\"email\" value=\"malicious-email@example.com\"\
    >\n</form>\n\n<script>\n    document.forms[0].submit();\n</script>\n```\n\n如果恶意网站在页面加载时自动提交表单，恶意用户只需诱骗你应用程序的某个毫无防备的用户访问其网站，其电子邮件地址就会在你的应用程序中被更改。\n\
    \n为了防止此漏洞，我们需要检查每个传入的 POST、PUT、PATCH 或 DELETE 请求，以查找恶意应用程序无法访问的 secret 会话值。\n\n\
    ## 防止 CSRF 请求\n\nLaravel 会为应用程序管理的每个活动用户会话自动生成一个 CSRF “token”。此令牌用于验证已认证用户确实是向应用程序发出请求的人。由于此令牌存储在用户的会话中，并且在会话每次重新生成时都会更改，恶意应用程序无法访问它。当前会话的\
    \ CSRF 令牌可以通过请求的会话或通过 csrf_token 辅助函数访问：\n\n```php\nuse Illuminate\\Http\\Request;\n\
    \nRoute::get('/token', function (Request $request) {\n    $token = $request->session()->token();\n\
    \    \n    $token = csrf_token();\n    \n    // ...\n});\n```\n\n只要你在应用程序中定义“POST”、“PUT”、“PATCH”或“DELETE”\
    \ HTML 表单，你都应该在表单中包含一个隐藏的 CSRF _token 字段，以便 CSRF 保护中间件可以验证请求。为了方便，你可以使用 @csrf\
    \ Blade 指令生成隐藏的令牌输入字段：\n\n```html\n<form method=\"POST\" action=\"/profile\">\n\
    \    @csrf\n\n    <!-- Equivalent to... -->\n    <input type=\"hidden\" name=\"\
    _token\" value=\"{{ csrf_token() }}\" />\n</form>\n```\n\nApp\\Http\\Middleware\\\
    VerifyCsrfToken 中间件默认包含在 web 中间件组中，将自动验证请求输入中的令牌是否与存储在会话中的令牌匹配。当这两个令牌匹配时，我们就知道已认证用户是发起请求的人。\n\
    \n## CSRF 令牌与 SPA\n\n如果你正在构建一个使用 Laravel 作为 API 后端的 SPA，你应该查阅 Laravel Sanctum\
    \ 文档，了解有关使用 API 进行身份验证以及防止 CSRF 漏洞的信息。\n\n## 从 CSRF 保护中排除 URI\n\n有时你可能希望从 CSRF\
    \ 保护中排除一组 URI。\n\n例如，如果你使用 Stripe 处理付款并使用其 webhook 系统，你需要将 Stripe webhook 处理程序路由从\
    \ CSRF 保护中排除，因为 Stripe 不会知道向你的路由发送什么 CSRF 令牌。\n\n通常，你应该将这类路由放在 App\\Providers\\\
    RouteServiceProvider 应用于 routes/web.php 文件中所有路由的 web 中间件组之外。\n\n然而，你也可以通过将它们的\
    \ URI 添加到 VerifyCsrfToken 中间件的 $except 属性来排除这些路由：\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Middleware;\n\nuse Illuminate\\Foundation\\Http\\Middleware\\VerifyCsrfToken\
    \ as Middleware;\n\nclass VerifyCsrfToken extends Middleware\n{\n    /**\n   \
    \  * The URIs that should be excluded from CSRF verification.\n     *\n     *\
    \ @var array\n     */\n    protected $except = [\n        'stripe/*',\n      \
    \  'http://example.com/foo/bar',\n        'http://example.com/foo/*',\n    ];\n\
    }\n```\n\n> {tip} 为了方便，在运行测试时，CSRF 中间件会自动为所有路由禁用。\n\n## X-CSRF-TOKEN\n\n除了将 CSRF\
    \ 令牌作为 POST 参数进行检查外，App\\Http\\Middleware\\VerifyCsrfToken 中间件还会检查 X-CSRF-TOKEN\
    \ 请求头。例如，你可以将令牌存储在 HTML meta 标签中\n\n```html\n<meta name=\"csrf-token\" content=\"\
    {{ csrf_token() }}\">\n```\n\n然后，你可以指示像 jQuery 这样的库自动将令牌添加到所有请求头中。\n\n这为使用传统 JavaScript\
    \ 技术构建的基于 AJAX 的应用程序提供了简单便捷的 CSRF 保护：\n\n```js\n$.ajaxSetup({\n    headers: {\n\
    \        'X-CSRF-TOKEN': $('meta[name=\"csrf-token\"]').attr('content')\n    }\n\
    });\n```\n\n## X-XSRF-TOKEN\n\nLaravel 将正在进行的 CSRF 令牌存储在框架创建的每个响应中都包含的编码 XSRF-TOKEN\
    \ cookie 中。你可以使用 cookie 的值来设置 X-XSRF-TOKEN 请求头。\n\n此 cookie 主要作为开发人员便利而发送，因为某些\
    \ JavaScript 框架和库（如 Angular 和 Axios）会在同源请求上自动将其值放在 X-XSRF-TOKEN 头中。\n\n> {tip}\
    \ 默认情况下，resources/js/bootstrap.js 文件包含 Axios HTTP 库，它会自动为你发送 X-XSRF-TOKEN 头。\n"
