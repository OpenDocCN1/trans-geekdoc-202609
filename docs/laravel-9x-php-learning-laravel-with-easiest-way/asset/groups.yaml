  md: "\nUsing the `Route::fallback` method, you may define a route that will be executed\
    \ when no other route matches the incoming request. Typically, unhandled requests\
    \ will automatically render a \"404\" page via your application's exception handler.\
    \ However, since you would typically define the fallback route within your `routes/web.php`\
    \ file, all middleware in the `web` middleware group will apply to the route.\
    \ You are free to add additional middleware to this route as needed:\n\n```php\n\
    Route::fallback(function () {\n    //\n});\n```\n\n> {note} The fallback route\
    \ should always be the last route registered by your application.\n\n## Rate Limiting\n\
    \n### Defining Rate Limiters\n\nLaravel includes powerful and customizable rate\
    \ limiting services that you may utilize to restrict the amount of traffic for\
    \ a given route or group of routes. To get started, you should define rate limiter\
    \ configurations that meet your application's needs. Typically, this should be\
    \ done within the `configureRateLimiting` method of your application's `App\\\
    Providers\\RouteServiceProvider` class. Rate limiters are defined using the `RateLimiter`\
    \ facade's `for` method.\n\nThe `for` method accepts a rate limiter name and a\
    \ closure that returns the limit configuration that should apply to routes that\
    \ are assigned to the rate limiter. Limit configurations are instances of the\
    \ `Illuminate\\Cache\\RateLimiting\\Limit` class. This class contains helpful\
    \ \"builder\" methods so that you can quickly define your limit. The rate limiter\
    \ name may be any string you wish:\n\n```php\nuse Illuminate\\Cache\\RateLimiting\\\
    Limit;\nuse Illuminate\\Support\\Facades\\RateLimiter;\n\n/**\n * Configure the\
    \ rate limiters for the application.\n *\n * @return void\n */\nprotected function\
    \ configureRateLimiting()\n{\n    RateLimiter::for('global', function (Request\
    \ $request) {\n        return Limit::perMinute(1000);\n    });\n}\n```\n\nIf the\
    \ incoming request exceeds the specified rate limit, a response with a 429 HTTP\
    \ status code will automatically be returned by Laravel. If you would like to\
    \ define your own response that should be returned by a rate limit, you may use\
    \ the `response` method:\n\n```php\nRateLimiter::for('global', function (Request\
    \ $request) {\n    return Limit::perMinute(1000)->response(function () {\n   \
    \     return response('Custom response...', 429);\n    });\n});\n```\n\nSince\
    \ rate limiter callbacks receive the incoming HTTP request instance, you may build\
    \ the appropriate rate limit dynamically based on the incoming request or authenticated\
    \ user:\n\n```php\nRateLimiter::for('uploads', function (Request $request) {\n\
    \    return $request->user()->vipCustomer()\n        ? Limit::none()\n       \
    \ : Limit::perMinute(100);\n});\n```\n\n### Segmenting Rate Limits\n\nSometimes\
    \ you may wish to segment rate limits by some arbitrary value. For example, you\
    \ may wish to allow users to access a given route 100 times per minute per IP\
    \ address. To accomplish this, you may use the `by` method when building your\
    \ rate limit:\n\n```php\nRateLimiter::for('uploads', function (Request $request)\
    \ {\n    return $request->user()->vipCustomer()\n        ? Limit::none()\n   \
    \     : Limit::perMinute(100)->by($request->ip());\n});\n```\n\nTo illustrate\
    \ this feature using another example, we can limit access to the route to 100\
    \ times per minute per authenticated user ID or 10 times per minute per IP address\
    \ for guests:\n\n```php\nRateLimiter::for('uploads', function (Request $request)\
    \ {\n    return $request->user()\n        ? Limit::perMinute(100)->by($request->user()->id)\n\
    \        : Limit::perMinute(10)->by($request->ip());\n});\n```\n\n### Multiple\
    \ Rate Limits\n\nIf needed, you may return an array of rate limits for a given\
    \ rate limiter configuration. Each rate limit will be evaluated for the route\
    \ based on the order they are placed within the array:\n\n```php\nRateLimiter::for('login',\
    \ function (Request $request) {\n    return [\n        Limit::perMinute(500),\n\
    \        Limit::perMinute(3)->by($request->input('email')),\n    ];\n});\n```\n\
    \n### Attaching Rate Limiters To Routes\n\nRate limiters may be attached to routes\
    \ or route groups using the `throttle` middleware. The `throttle` middleware accepts\
    \ the name of the rate limiter you wish to assign to the route:\n\n```php\nRoute::middleware(['throttle:uploads'])->group(function\
    \ () {\n    Route::post('/audio', function () {\n        //\n    });\n\n    Route::post('/video',\
    \ function () {\n        //\n    });\n});\n```\n\n### Throttling With Redis\n\n\
    Typically, the `throttle` middleware is mapped to the `Illuminate\\Routing\\Middleware\\\
    ThrottleRequests` class. This mapping is defined in your application's HTTP kernel\
    \ (`App\\Http\\Kernel`). However, if you are using Redis as your application's\
    \ cache driver, you may wish to change this mapping to use the `Illuminate\\Routing\\\
    Middleware\\ThrottleRequestsWithRedis` class. This class is more efficient at\
    \ managing rate limiting using Redis:\n\n```php\n'throttle' => \\Illuminate\\\
    Routing\\Middleware\\ThrottleRequestsWithRedis::class,\n```\n\n## Form Method\
    \ Spoofing\n\nHTML forms do not support PUT, PATCH, or DELETE actions. So, when\
    \ defining PUT, PATCH, or DELETE routes that are called from an HTML form, you\
    \ will need to add a hidden `_method` field to the form. The value sent with the\
    \ `_method` field will be used as the HTTP request method:\n\n```html\n<form action=\"\
    /example\" method=\"POST\">\n    <input type=\"hidden\" name=\"_method\" value=\"\
    PUT\">\n    <input type=\"hidden\" name=\"_token\" value=\"{{ csrf_token() }}\"\
    >\n</form>\n```\n\nFor convenience, you may use the `@method` Blade directive\
    \ to generate the `_method` input field:\n\n```html\n<form action=\"/example\"\
    \ method=\"POST\">\n    @method('PUT')\n    @csrf\n</form>\n```\n\n## Accessing\
    \ The Current Route\n\nYou may use the `current`, `currentRouteName`, and `currentRouteAction`\
    \ methods on the `Route` facade to access information about the route handling\
    \ the incoming request:\n\n```php\nuse Illuminate\\Support\\Facades\\Route;\n\n\
    $route = Route::current(); // Illuminate\\Routing\\Route\n$name = Route::currentRouteName();\
    \ // string\n$action = Route::currentRouteAction(); // string\n```\n\nYou may\
    \ refer to the API documentation for both the underlying class of the `Route`\
    \ facade and `Route` instance to review all of the methods that are available\
    \ on the router and route classes.\n\n## Cross-Origin Resource Sharing (CORS)\n\
    \nLaravel can automatically respond to CORS OPTIONS HTTP requests with values\
    \ that you configure. All CORS settings may be configured in your application's\
    \ `config/cors.php` configuration file. The OPTIONS requests will automatically\
    \ be handled by the `HandleCors` middleware that is included by default in your\
    \ global middleware stack. Your global middleware stack is located in your application's\
    \ HTTP kernel (`App\\Http\\Kernel`).\n\n## Middleware\n\n- Introduction\n- Defining\
    \ Middleware\n- Registering Middleware\n  - Global Middleware\n  - Excluding Middleware\n\
    \  - Middleware Groups\n  - Sorting Middleware\n- Middleware Parameters\n- Terminable\
    \ Middleware\n\n### Introduction\n\nMiddleware provide a convenient mechanism\
    \ for inspecting and filtering HTTP requests entering your application. For example,\
    \ Laravel includes a middleware that verifies the user of your application is\
    \ authenticated. If the user is not authenticated, the middleware will redirect\
    \ the user to your application's login screen. However, if the user is authenticated,\
    \ the middleware will allow the request to proceed further into the application.\
    \ Additional middleware can be written to perform a variety of tasks besides authentication.\
    \ For example, a logging middleware might log all incoming requests to your application.\
    \ There are several middleware included in the Laravel framework, including middleware\
    \ for authentication and CSRF protection. All of these middleware are located\
    \ in the `app/Http/Middleware` directory.\n\n### Defining Middleware\n\nTo create\
    \ a new middleware, use the `make:middleware` Artisan command:\n\n```bash\nphp\
    \ artisan make:middleware EnsureTokenIsValid\n```\n\nThis command will place a\
    \ new `EnsureTokenIsValid` class within your `app/Http/Middleware` directory.\
    \ In this middleware, we will only allow access to the route if the supplied `token`\
    \ input matches a specified value. Otherwise, we will redirect the users back\
    \ to the home URI:\n"
  mdcn: "\n使用 `Route::fallback` 方法，你可以定义一条路由，当没有其他路由匹配传入请求时，该路由将被执行。通常，未处理的请求会通过应用程序的异常处理器自动渲染“404”页面。然而，由于你通常会在\
    \ `routes/web.php` 文件中定义回退路由，`web` 中间件组中的所有中间件都将应用于该路由。你可以根据需要向此路由添加额外的中间件：\n\n\
    ```php\nRoute::fallback(function () {\n    //\n});\n```\n\n> {note} 回退路由应始终是应用程序注册的最后一个路由。\n\
    \n## 速率限制\n\n### 定义速率限制器\n\nLaravel 包含功能强大且可定制的速率限制服务，你可以利用它来限制给定路由或路由组的流量。为了开始，你应该定义满足应用程序需求的速率限制器配置。通常，这应该在应用程序的\
    \ `App\\Providers\\RouteServiceProvider` 类的 `configureRateLimiting` 方法中完成。速率限制器使用\
    \ `RateLimiter` 门面的 `for` 方法定义。\n\n`for` 方法接受一个速率限制器名称和一个闭包，该闭包返回应应用于分配给速率限制器的路由的限制配置。限制配置是\
    \ `Illuminate\\Cache\\RateLimiting\\Limit` 类的实例。该类包含有用的“builder”方法，以便你可以快速定义限制。速率限制器名称可以是你想要的任何字符串：\n\
    \n```php\nuse Illuminate\\Cache\\RateLimiting\\Limit;\nuse Illuminate\\Support\\\
    Facades\\RateLimiter;\n\n/**\n * Configure the rate limiters for the application.\n\
    \ *\n * @return void\n */\nprotected function configureRateLimiting()\n{\n   \
    \ RateLimiter::for('global', function (Request $request) {\n        return Limit::perMinute(1000);\n\
    \    });\n}\n```\n\n如果传入请求超过指定的速率限制，Laravel 将自动返回带有 429 HTTP 状态码的响应。如果你想定义速率限制应返回的自定义响应，可以使用\
    \ `response` 方法：\n\n```php\nRateLimiter::for('global', function (Request $request)\
    \ {\n    return Limit::perMinute(1000)->response(function () {\n        return\
    \ response('Custom response...', 429);\n    });\n});\n```\n\n由于速率限制器回调接收传入的 HTTP\
    \ 请求实例，你可以根据传入请求或已认证用户动态构建适当的速率限制：\n\n```php\nRateLimiter::for('uploads', function\
    \ (Request $request) {\n    return $request->user()->vipCustomer()\n        ?\
    \ Limit::none()\n        : Limit::perMinute(100);\n});\n```\n\n### 分段速率限制\n\n\
    有时你可能希望按某个任意值对速率限制进行分段。例如，你可能希望允许用户每分钟每个 IP 地址访问给定路由 100 次。为了实现这一点，你可以在构建速率限制时使用\
    \ `by` 方法：\n\n```php\nRateLimiter::for('uploads', function (Request $request)\
    \ {\n    return $request->user()->vipCustomer()\n        ? Limit::none()\n   \
    \     : Limit::perMinute(100)->by($request->ip());\n});\n```\n\n为了用另一个示例说明此功能，我们可以将路由访问限制为每个已认证用户\
    \ ID 每分钟 100 次，或访客每分钟每个 IP 地址 10 次：\n\n```php\nRateLimiter::for('uploads', function\
    \ (Request $request) {\n    return $request->user()\n        ? Limit::perMinute(100)->by($request->user()->id)\n\
    \        : Limit::perMinute(10)->by($request->ip());\n});\n```\n\n### 多个速率限制\n\
    \n如果需要，你可以为给定的速率限制器配置返回一个速率限制数组。每个速率限制将根据其在数组中的顺序对路由进行评估：\n\n```php\nRateLimiter::for('login',\
    \ function (Request $request) {\n    return [\n        Limit::perMinute(500),\n\
    \        Limit::perMinute(3)->by($request->input('email')),\n    ];\n});\n```\n\
    \n### 将速率限制器附加到路由\n\n速率限制器可以使用 `throttle` 中间件附加到路由或路由组。`throttle` 中间件接受你希望分配给路由的速率限制器的名称：\n\
    \n```php\nRoute::middleware(['throttle:uploads'])->group(function () {\n    Route::post('/audio',\
    \ function () {\n        //\n    });\n\n    Route::post('/video', function ()\
    \ {\n        //\n    });\n});\n```\n\n### 使用 Redis 进行节流\n\n通常，`throttle` 中间件映射到\
    \ `Illuminate\\Routing\\Middleware\\ThrottleRequests` 类。此映射在应用程序的 HTTP 内核（`App\\\
    Http\\Kernel`）中定义。然而，如果你使用 Redis 作为应用程序的缓存驱动程序，你可能希望更改此映射以使用 `Illuminate\\Routing\\\
    Middleware\\ThrottleRequestsWithRedis` 类。此类在利用 Redis 管理速率限制时更高效：\n\n```php\n'throttle'\
    \ => \\Illuminate\\Routing\\Middleware\\ThrottleRequestsWithRedis::class,\n```\n\
    \n## 表单方法伪装\n\nHTML 表单不支持 PUT、PATCH 或 DELETE 操作。因此，当定义从 HTML 表单调用的 PUT、PATCH 或\
    \ DELETE 路由时，你需要在表单中添加一个隐藏的 `_method` 字段。随 `_method` 字段发送的值将用作 HTTP 请求方法：\n\n\
    ```html\n<form action=\"/example\" method=\"POST\">\n    <input type=\"hidden\"\
    \ name=\"_method\" value=\"PUT\">\n    <input type=\"hidden\" name=\"_token\"\
    \ value=\"{{ csrf_token() }}\">\n</form>\n```\n\n为方便起见，你可以使用 `@method` Blade 指令生成\
    \ `_method` 输入字段：\n\n```html\n<form action=\"/example\" method=\"POST\">\n   \
    \ @method('PUT')\n    @csrf\n</form>\n```\n\n## 访问当前路由\n\n你可以在 `Route` 门面上使用 `current`、`currentRouteName`\
    \ 和 `currentRouteAction` 方法来访问处理传入请求的路由的信息：\n\n```php\nuse Illuminate\\Support\\\
    Facades\\Route;\n\n$route = Route::current(); // Illuminate\\Routing\\Route\n\
    $name = Route::currentRouteName(); // string\n$action = Route::currentRouteAction();\
    \ // string\n```\n\n你可以参考 `Route` 门面底层类和 `Route` 实例的 API 文档，以查看路由器和路由类上可用的所有方法。\n\
    \n## 跨域资源共享（CORS）\n\nLaravel 可以使用你配置的值自动响应 CORS OPTIONS HTTP 请求。所有 CORS 设置都可以在应用程序的\
    \ `config/cors.php` 配置文件中配置。OPTIONS 请求将自动由默认包含在全局中间件栈中的 `HandleCors` 中间件处理。你的全局中间件栈位于应用程序的\
    \ HTTP 内核（`App\\Http\\Kernel`）中。\n\n## 中间件\n\n- 介绍\n- 定义中间件\n- 注册中间件\n  - 全局中间件\n\
