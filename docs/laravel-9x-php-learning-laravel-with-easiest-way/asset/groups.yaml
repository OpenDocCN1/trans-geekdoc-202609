    \ ['id' => 1]);\n```\n\n如果你在服务提供者之外，代码中的位置无法访问 $app 变量，可以使用 App 门面从容器中解析类实例：\n\
    \n```\nuse App\\Services\\Transistor;\nuse Illuminate\\Support\\Facades\\App;\n\
    \n$transistor = App::make(Transistor::class);\n```\n\n如果你希望将 Laravel 容器实例本身注入到由容器解析的类中，可以在类的构造函数上为\
