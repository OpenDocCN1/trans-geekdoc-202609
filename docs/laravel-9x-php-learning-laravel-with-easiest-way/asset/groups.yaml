    \ Vapor is calibrated by Laravel's creators to work flawlessly with the framework,\
    \ so you can continue to compose your Laravel applications exactly as you're used\
    \ to.\n\n## Request Lifecycle\n\n- Introduction\n- Lifecycle Overview\n  - First\
    \ Steps\n  - HTTP / Console Kernels\n  - Service Providers\n  - Routing\n  - Finishing\
    \ Up\n- Focus On Service Providers\n\n## Introduction\n\nWhen using any tool in\
    \ the \"real world\", you feel more confident if you understand how that tool\
