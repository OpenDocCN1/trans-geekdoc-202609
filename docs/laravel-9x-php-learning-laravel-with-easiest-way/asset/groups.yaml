  - "[PAGE 81]\n\nNote that we receive the container itself as an argument to the\
    \ resolver. We can then use the container to resolve sub-dependencies of the object\
    \ we are building. As mentioned, you will typically be interacting with the container\
    \ within service providers; however, if you would like to interact with the container\
    \ outside of a service provider, you may do so via the App facade:\n\n```\n```php\n\
    use App\\Services\\Transistor;\nuse Illuminate\\Support\\Facades\\App;\n\nApp::bind(Transistor::class,\
    \ function ($app) {\n    // ...\n});\n```\n```\n\n> {tip} There is no need to\
    \ bind classes into the container if they do not depend on any interfaces. The\
    \ container does not need to be instructed on how to build these objects, since\
    \ it can automatically resolve these objects using reflection.\n\n# Binding A\
    \ Singleton\n\nThe singleton method binds a class or interface into the container\
    \ that should only be resolved one time. Once a singleton binding is resolved,\
    \ the same object instance will be returned on subsequent calls into the container:\n\
    \n```\n```php\nuse App\\Services\\Transistor;\nuse App\\Services\\PodcastParser;\n\
    \n$this->app->singleton(Transistor::class, function ($app) {\n    return new Transistor($app->make(PodcastParser::class));\n\
    });\n```\n```"
