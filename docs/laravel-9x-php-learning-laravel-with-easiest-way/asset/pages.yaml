- pgno: 183
  md: "Laravel automatically generates a CSRF \"token\" for each active user session\
    \ managed by the application. This token is used to verify that the authenticated\
    \ user is the person actually making the requests to the application. Since this\
    \ token is stored in the user's session and changes each time the session is regenerated,\
    \ a malicious application is unable to access it. The current session's CSRF token\
    \ can be accessed via the request's session or via the csrf_token helper function:\n\
    \n```\nuse Illuminate\\Http\\Request;\n\nRoute::get('/token', function (Request\
    \ $request) {\n    $token = $request->session()->token();\n    \n    $token =\
    \ csrf_token();\n    \n    // ...\n});\n```\n\nAnytime you define a \"POST\",\
    \ \"PUT\", \"PATCH\", or \"DELETE\" HTML form in your application, you"
  merge: -1
  img_proc: true
- pgno: 184
  md: "should include a hidden CSRF _token field in the form so that the CSRF protection\
    \ middleware can validate the request. For convenience, you may use the @csrf\
    \ Blade directive to generate the hidden token input field:\n\n```\n<form method=\"\
    POST\" action=\"/profile\">\n    @csrf\n\n    <!-- Equivalent to... -->\n    <input\
    \ type=\"hidden\" name=\"_token\" value=\"{{ csrf_token() }}\" />\n</form>\n```\n\
    \nThe App\\Http\\Middleware\\VerifyCsrfToken middleware, which is included in\
    \ the web middleware group by default, will automatically verify that the token\
    \ in the request input matches the token stored in the session. When these two\
    \ tokens match, we know that the authenticated user is the one initiating the\
    \ request.\n\n# CSRF Tokens & SPAs\n\nIf you are building an SPA that is utilizing\
    \ Laravel as an API backend, you should consult the Laravel Sanctum documentation\
    \ for information on"
