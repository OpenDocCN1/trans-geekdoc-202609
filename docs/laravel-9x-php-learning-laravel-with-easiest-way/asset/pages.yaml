  md: 'authenticating with your API and protecting against CSRF vulnerabilities.


    # Excluding URIs From CSRF Protection


    Sometimes you may wish to exclude a set of URIs from CSRF protection.


    For example, if you are using Stripe to process payments and are utilizing their
    webhook system, you will need to exclude your Stripe webhook handler route from
    CSRF protection since Stripe will not know what CSRF token to send to your routes.


    Typically, you should place these kinds of routes outside of the web middleware
    group that the App\Providers\RouteServiceProvider applies to all routes in the
    routes/web.php file.


    However, you may also exclude the routes by adding their URIs to the $except property
    of the VerifyCsrfToken middleware:'
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Illuminate\\Foundation\\\
    Http\\Middleware\\VerifyCsrfToken as Middleware;\n\nclass VerifyCsrfToken extends\
    \ Middleware\n{\n    /**\n```\n\n```\n    * The URIs that should be excluded from\
    \ CSRF verification.\n    *\n    * @var array\n    */\n    protected $except =\
    \ [\n        'stripe/*',\n        'http://example.com/foo/bar',\n        'http://example.com/foo/*',\n\
    \    ];\n}\n```\n\n> {tip} For convenience, the CSRF middleware is automatically\
    \ disabled for all routes when running tests.\n\n# X-CSRF-TOKEN\n\nIn addition\
    \ to checking for the CSRF token as a POST parameter, the App\\Http\\Middleware\\\
    VerifyCsrfToken middleware will also check for the X-CSRF-TOKEN request header.\
    \ You could, for example, store the token in an HTML meta tag\n\n```\n<meta name=\"\
    csrf-token\" content=\"{{ csrf_token() }}\">\n```"
  merge: -1
