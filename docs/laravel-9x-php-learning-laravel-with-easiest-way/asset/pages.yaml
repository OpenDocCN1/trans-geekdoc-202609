    # Customizing The Resolution Logic


    If you wish to define your own model binding resolution logic, you may use the
    Route::bind method. The closure you pass to the bind method will receive the value
    of the URI segment and


    should return the instance of the class that should be injected into the route.
    Again, this customization should take place in the boot method of your application''s


    RouteServiceProvider :'
  merge: -1
  img_proc: true
- pgno: 155
  md: "```\nuse App\\Models\\User;\nuse Illuminate\\Support\\Facades\\Route;\n\n/**\n\
    \ * Define your route model bindings, pattern filters, etc.\n *\n * @return void\n\
    \ */\npublic function boot()\n{\n    Route::bind('user', function ($value) {\n\
    \        return User::where('name', $value)->firstOrFail();\n    });\n\n    //\
    \ ...\n}\n```\n\nAlternatively, you may override the resolveRouteBinding method\
    \ on your Eloquent model. This method will receive the value of the URI segment\
    \ and should return the instance of the class that should be injected into the\
    \ route:"
  merge: -1
  img_proc: true
- pgno: 156
  md: "```\n/**\n * Retrieve the model for a bound value.\n *\n * @param mixed $value\n\
    \ * @param string|null $field\n * @return \\Illuminate\\Database\\Eloquent\\Model|null\n\
    \ */\npublic function resolveRouteBinding($value, $field = null)\n{\n    return\
    \ $this->where('name', $value)->firstOrFail();\n}\n```\n\nIf a route is utilizing\
    \ implicit binding scoping, the resolveChildRouteBinding method will be used to\
    \ resolve the child binding of the parent model:\n\n```\n/**\n * Retrieve the\
    \ child model for a bound value.\n *\n * @param string $childType\n * @param mixed\
    \ $value\n * @param string|null $field\n * @return \\Illuminate\\Database\\Eloquent\\\
    Model|null\n */\npublic function resolveChildRouteBinding($childType, $value,\
    \ $field)\n{\n    return parent::resolveChildRouteBinding($childType, $value,\
    \ $field);\n}\n```\n\n# Fallback Routes"
