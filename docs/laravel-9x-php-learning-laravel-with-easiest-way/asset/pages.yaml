- pgno: 161
  md: "# Attaching Rate Limiters To Routes\n\nRate limiters may be attached to routes\
    \ or route groups using the throttle middleware. The throttle middleware accepts\
    \ the name of the rate limiter you wish to assign to the route:\n\n```\nRoute::middleware(['throttle:uploads'])->group(function\
    \ () {\n    Route::post('/audio', function () {\n        //\n    });\n\n    Route::post('/video',\
    \ function () {\n        //\n    });\n});\n```\n\n# Throttling With Redis\n\n\
    Typically, the throttle middleware is mapped to the Illuminate\\Routing\\Middleware\\\
    ThrottleRequests class. This mapping is defined in your application's HTTP kernel\
    \ ( App\\Http\\Kernel ). However, if you are using Redis as your application's\
    \ cache driver, you may wish to change this mapping to use the Illuminate\\Routing\\\
    Middleware\\ThrottleRequestsWithRedis class. This class is more efficient at managing\
    \ rate limiting using Redis:"
