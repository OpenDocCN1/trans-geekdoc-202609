- pgno: 111
  md: 'Facades have many benefits. They provide a terse, memorable syntax that allows
    you to use Laravel''s features without remembering long class names that must
    be injected or configured manually. Furthermore, because of their unique usage
    of PHP''s dynamic methods, they are easy to test. However, some care must be taken
    when using facades. The primary danger of facades is class "scope creep". Since
    facades are so easy to use and do not require injection, it can be easy to let
    your classes continue to grow and use many facades in a single class. Using dependency
    injection, this potential is mitigated by the visual feedback a large constructor
    gives you that your class is growing too large. So, when using facades, pay special
    attention to the size of your class so that its scope of responsibility stays
    narrow. If your class is getting too large, consider splitting it into multiple
    smaller classes.


    # Facades Vs. Dependency Injection


    One of the primary benefits of dependency injection is the ability to swap implementations
    of the injected class. This is useful during testing since you can inject a mock
    or stub and assert that various methods were called on the stub. Typically, it
    would not be possible to mock or stub a truly static class method. However, since
    facades use dynamic methods to proxy method calls to objects resolved from the
    service container, we actually can test facades just as we would test an injected
    class instance. For example, given the following route:'
