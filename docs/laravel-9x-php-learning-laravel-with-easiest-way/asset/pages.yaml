    For most applications, you will begin by defining routes in your routes/web.php
    file. The routes defined in routes/web.php may be accessed by entering the defined
    route''s URL in your browser. For example, you may access the following route
    by navigating to http://example.com/user in your browser:


    ```

    use App\Http\Controllers\UserController;


    Route::get(''/user'', [UserController::class, ''index'']);

    ```


    Routes defined in the routes/api.php file are nested within a route group by the


    RouteServiceProvider . Within this group, the /api URI prefix is automatically
    applied so you


    do not need to manually apply it to every route in the file. You may modify the
    prefix and other


    route group options by modifying your RouteServiceProvider class.


