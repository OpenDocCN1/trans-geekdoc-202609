  md: 'logging middleware might log all incoming requests to your application. There
    are several middleware included in the Laravel framework, including middleware
    for authentication and CSRF protection. All of these middleware are located in
    the app/Http/Middleware directory.


    # Defining Middleware


    To create a new middleware, use the make:middleware Artisan command:


    ```

    php artisan make:middleware EnsureTokenIsValid

    ```


    This command will place a new EnsureTokenIsValid class within your app/Http/Middleware
    directory. In this middleware, we will only allow access to the route if the supplied
    token input matches a specified value. Otherwise, we will redirect the users back
    to the home URI:'
