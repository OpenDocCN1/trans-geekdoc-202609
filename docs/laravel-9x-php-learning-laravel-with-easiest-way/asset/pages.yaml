- pgno: 157
  md: "Using the Route::fallback method, you may define a route that will be executed\
    \ when no other route matches the incoming request. Typically, unhandled requests\
    \ will automatically render a \"404\" page via your application's exception handler.\
    \ However, since you would typically define the fallback route within your routes/web.php\
    \ file, all middleware in the web middleware group will apply to the route. You\
    \ are free to add additional middleware to this route as needed:\n\n```\nRoute::fallback(function\
    \ () {\n    //\n});\n```\n\n> {note} The fallback route should always be the last\
    \ route registered by your application.\n\n# Rate Limiting\n\n# Defining Rate\
    \ Limiters\n\nLaravel includes powerful and customizable rate limiting services\
    \ that you may utilize to restrict the amount of traffic for a given route or\
    \ group of routes. To get started, you should define rate limiter configurations\
    \ that meet your application's needs. Typically, this should be done within the\
    \ configureRateLimiting method of your application's App\\Providers\\RouteServiceProvider"
  merge: -1
  img_proc: true
- pgno: 158
  md: "class. Rate limiters are defined using the RateLimiter facade's `for` method.\n\
    \nThe `for` method accepts a rate limiter name and a closure that returns the\
    \ limit configuration that should apply to routes that are assigned to the rate\
    \ limiter. Limit configuration are instances of the `Illuminate\\\\Cache\\\\RateLimiting\\\
    \\Limit` class. This class contains helpful \"builder\" methods so that you can\
    \ quickly define your limit. The rate limiter name may be any string you wish:\n\
    \n```\n```php\nuse Illuminate\\\\Cache\\\\RateLimiting\\\\Limit;\nuse Illuminate\\\
    \\Support\\\\Facades\\\\RateLimiter;\n\n/**\n * Configure the rate limiters for\
    \ the application.\n *\n * @return void\n */\n```\n```\n\n```\n```php\nprotected\
    \ function configureRateLimiting()\n{\n    RateLimiter::for('global', function\
    \ (Request $request) {\n        return Limit::perMinute(1000);\n    });\n}\n```\n\
    ```\n\nIf the incoming request exceeds the specified rate limit, a response with\
    \ a 429 HTTP status code will automatically be returned by Laravel. If you"
  merge: -1
  img_proc: true
- pgno: 159
  md: "would like to define your own response that should be returned by a rate limit,\
    \ you may use the response method:\n\n```\nRateLimiter::for('global', function\
    \ (Request $request) {\n    return Limit::perMinute(1000)->response(function ()\
    \ {\n        return response('Custom response...', 429);\n    });\n});\n```\n\n\
    Since rate limiter callbacks receive the incoming HTTP request instance, you may\
    \ build the appropriate rate limit dynamically based on the incoming request or\
    \ authenticated user:\n\n```\nRateLimiter::for('uploads', function (Request $request)\
    \ {\n    return $request->user()->vipCustomer()\n        ? Limit::none()\n   \
    \     : Limit::perMinute(100);\n});\n```\n\n# Segmenting Rate Limits\n\nSometimes\
    \ you may wish to segment rate limits by some arbitrary value. For example, you\
    \ may wish to allow users to access a given route 100 times per minute per IP\
    \ address. To accomplish this, you may use the by method when building your rate\
    \ limit:"
  merge: -1
  img_proc: true
- pgno: 160
  md: "```\nRateLimiter::for('uploads', function (Request $request) {\n    return\
    \ $request->user()->vipCustomer()\n        ? Limit::none()\n        : Limit::perMinute(100)->by($request->ip());\n\
    });\n```\n\nTo illustrate this feature using another example, we can limit access\
    \ to the route to 100 times per minute per authenticated user ID or 10 times per\
    \ minute per IP address for guests:\n\n```\nRateLimiter::for('uploads', function\
    \ (Request $request) {\n    return $request->user()\n        ? Limit::perMinute(100)->by($request->user()->id)\n\
    \        : Limit::perMinute(10)->by($request->ip());\n});\n```\n\n# Multiple Rate\
    \ Limits\n\nIf needed, you may return an array of rate limits for a given rate\
    \ limiter configuration. Each rate limit will be evaluated for the route based\
    \ on the order they are placed within the array:\n\n```\nRateLimiter::for('login',\
    \ function (Request $request) {\n    return [\n        Limit::perMinute(500),\n\
    \        Limit::perMinute(3)->by($request->input('email')),\n    ];\n});\n```"
  merge: -1
