    \ stores the ongoing CSRF token in an encoded XSRF-TOKEN treat that is incorporated\
    \ with every reaction created by the structure. You can utilize the treat's value\
    \ to set the X-XSRFTOKEN demand header.\n\nThis cookie is primarily sent as a\
    \ developer convenience since some JavaScript frameworks and libraries, like Angular\
    \ and Axios, automatically place its value in the X-XSRF-TOKEN header on same-origin\
    \ requests.\n\n{tip} By default, the resources/js/bootstrap.js file includes the\
    \ Axios HTTP library which will automatically send the X-XSRF-TOKEN header for\
    \ you."
