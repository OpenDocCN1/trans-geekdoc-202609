    # Lifecycle Overview


    # First Steps


    The entry point for all requests to a Laravel application is the public/index.php
    file. All requests are directed to this file by your web server (Apache / Nginx)
    configuration. The index.php file doesn''t contain much code. Rather, it is a
    starting point for loading the rest of the framework.


    The index.php file loads the Composer generated autoloader definition, and then
    retrieves an instance of the Laravel application from bootstrap/app.php. The first
    action taken by Laravel itself is to create an instance of the application / service
    container.


