  md: '# III. EXPERIMENT AND RESULT ANALYSIS


    # A. Data Collection


    In this paper, two desktop computers equipped with an Intel 5300 network card
    and an operation rate tool-HSI are used as transmitters and receivers, respectively.
    The data collection device works in 5G using one transmitting antenna and two
    receiving antennas with a transmitting rate of 50 packets per second, and the
    data collection time was 6s. Six participated in the experiment, with height range:
    1.52m-1.78m, performing three types of activities: no one, one person, and two
    people. The experiment actions are 7 actions in total, includes one person activity
    which is walking, sitting, and two-person activity which is one person sitting
    with one person, one person walking with one person sitting and two persons. There
    are 85 samples collected in the experiment including.


    # IV. CONCLUSIONS


    This paper built a multi-task learning system based on WiFi signal and deep residual
    network, presented a method for simultaneous recognition of indoor people''s number
    and actions based on the channel information phase. This method proposed a phase
    difference correction algorithm for CSI phase difference and classified features
    by a deep residual network. Experimental results show that the average accuracy
    of people and activity recognition are 99% and 95.5%, which can provide intelligent
    perception in scenarios with less than 2 people.


    # B. Experimental Setup


    The ResNet-11 network was implemented under the framework of PyTorch the initial
    learning rate was set to 0.001, and trained by the Adam optimizer through learning
    rate adjustment function which was reduced by 0.5 every 25 epochs. The experiment
    ran for 200 epochs and the batch size was 64. The experimental samples were mixed
    uniformly and divided into training and test samples according to the ratio of
    4:1, the former was for training the deep network and the latter was for verifying
    the performance of network.


    # REFERENCES


    # C. Result Analysis


    The detection results are shown in Fig,5, the 15-layer convolutional network (d-cnn)
    in the paper, and the proposed method in this paper. As shown in the figure, the
    detection results of the d-cnn in the two subtasks of detection and activity recognition
    are 65.7% and 90% respectively, which presented the work results. The MAIS system
    outperforms the d-cnn method, the accuracy of rate recognition was only 90%. In
    contrast, the method we proposed in this paper was superior to the above two which
    achieved 99% accuracy for people detection and 95.8% for activity recognition.


