    是恒等映射。残差网络的核心思想是通过快捷连接（即图 3）寻找残差映射函数，并让差异 $F(x)$ 从输出和输入中学习，导致 $F(x)$ 趋于 0，然后实现恒等映射
    $H(x)=x$。结果，随着网络深度的增加，梯度消失问题将解决。


