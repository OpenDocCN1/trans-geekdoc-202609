    - Fraud detection: Learning models like `logistic regression` and `decision trees`
    have been used for fraud detection, identifying suspicious transactions.

    - Stock market prediction: Deep learning models like `LSTM` and `CNN` have been
    used for stock market prediction, forecasting stock prices.

