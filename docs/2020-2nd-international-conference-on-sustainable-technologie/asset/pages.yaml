  md: '# # Deep IDS : A deep learning approach for Intrusion detection on IDS 2018


    Arunavo Dey

    Bangladesh University of Science and Technology,

    Email: arunavo071@gmail.com


    Abstract— Intrusion Detection is one of the fields security import for industry
    4.0. Applying deep learning models opened a new scope in this field. But availability
    of data set and volume often makes it to apply latest techniques. Emerging of
    new machine learning algorithms always helps scope to improve over the existing
    ones. The effectiveness of the existing learning techniques for intrusion detection
    is being proposed and a novel attention based on IDS 2018 data set. A detailed
    evaluation on IDS 2018 has been reported to establish the claim.


    **Keywords:** Intrusion Detection, Attention Detection, Mechanical Neural, LSTM,
    CNN


    techniques have been proposed by studying the CIC IDS 2018 data set. JMIS 2019
    jije proposed a convolutional network for intrusion detection based on IDS 2018
    data set. After studying the architecture it was found that RNN can give more
    better results. In this paper a novel attention model is proposed for intrusion
    detection system based on the IDS 2018 data set. The main contributions of the
    paper is


    +   1) Proposing an attention based for intrusion detection on IDS 2018 data set

    2) Proving the work of attention in intrusion detection performance with baseline
    techniques

    3) Detailed evaluation of the proposed model with baseline techniques and the
    JMIS CNN proposed in 9 on IDS 2018 data set


    # I. INTRODUCTION


    With the advent of IoT and 5g networks, networks have grown in a significant manner
    with the expansion of networks, attacks have also grown in a large scale like
    the hit by APT attacks, DDoS attacks and malware.


    Zero day is also one of list which has been used for years using different approaches
    using honey net [2] sandbox to deep learning frameworks [3]. Usually the daily
    attacks are handled by the line defense mechanisms or Operational Mechanisms of
    Intrusion Detection Systems. The performance metrics are crucial to detecting
    such attacks. This intrusion detection systems comprise of signature based and
    anomaly detection systems [5]. While based methods rely on pattern matching, anomaly
    detection can detect unseen attacks by deviating from normal behaviours. The techniques
    learned from distributed detection [6], neural network [7] to graph based techniques
    [8].


    From the very deep learning techniques are proven to be useful in this field.
    But network attacks increase and increase every year the availability of large
    data set to create proposed network architectures for intrusion detection. DARPA,
    KDD, NSL-KDD-95, DEFCON, CAIDAS, CIC, KYOTO, TOTWE, CIC IDS and IDS are legacy
    datasets. Most of which CIC KDD and IDS 2018 is the latest data set with huge
    volume of network traffic different types of attack data. Several deep learning


    Rest of the paper is structured as follows, 2 employs literature review, 3 comprises
    of methodology, 4 comprises of experimental setup and data set, 5 comprises of
    performance evaluation and results and last conclusion and future.


    Intrusion detection is an old topic and a lot of work has been done in this field
    by machine learning techniques. J proposed a neural network intrusion detection
    system [11] which is proposed a neural network that can detect attacks on their
    general data. S and Mukmukha A in his work [12] AH proposed in his work [13] a
    5 SVM based IDS where neural networks have been used to rank the features. Chunqiling
    and Zhang Lu in their work [14] proposed a hierarchical IDS (SHIDS) and real time
    intrusion detection. Recently K J proposed a CNN model for DDoS attacks [15].
    J proposed an attention based model in his work for defined networks [17] based
    on deep learning. S proposed and Bandyopadhyay proposed an attention lstm deep
    neural model for intrusion detection in his work [19].


