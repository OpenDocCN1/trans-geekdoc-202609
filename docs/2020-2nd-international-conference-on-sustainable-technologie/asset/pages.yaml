    # D. Dense Layer


    Dense layer operations on the outputs of Attention layer by the following equation


    ```

    $V_i = f(c_i * W_i + b_i)$

    ```


    # III. METHODOLOGY


    +   - we use "Relu" as f. we use two dense layers with 15 hidden nodes and the
    last one with nodes depending on the configurations with "softmax" activation.


    In the proposed model the effectiveness of CNN is coupled with an attention mechanism
    and LSTM. The model has been implemented with a CNN layer followed by a LSTM and
    an attention layer followed by two dense layers.


    # IV. EXPERIMENTAL SETUP AND DATA SET


    # A. CNN Layer


    # HYPER PARAMETER CONFIGURATION


    TABLE 1


    | Hyper Parameter | Value |

    | CNN Layers | 1 |

    | CNN Filters | 32 |

    | Dense Layer | 24 |


    Convolution layers perform the operation on the input fed from the input layer.
    If the operation is performed upon m dimensional vectors with weight matrix $W
    \in R^{m \times n}$


    ```

    $O_i = f(X_{i-1} * W_i + b_i)$

    ```


    Hyper Parameter Values are used for the proposed architecture are given in Table
    1. In each of the Relu layer is used as activation function except in convolution
    layers where softmax is used. In convolution layers, filters of size 3 with 2
    strides are being used. Adam optimizer is used to update model''s parameters during
    training.


    After completion operation, max pooling is performed upon the output


    ```

    $M_i = max(O_i)$

    ```


    For loss calculation categorical cross-entropy function is being used. The random-search
    method. To avoid fitting a model dropout rate of 0.2 is being used. L1-L2 Kernel
    and activity regulators were also being used to control the regularization in
    this regard.


    # B. LSTM Layer


    LSTM is one of the stronger variants of RNN capturing long term dependencies successfully.
    Here we use context learned from the CNN as input to generate feature map


    ```

    $h_i = lstm(M_i)$

    ```


    # C. Attention Layer


    We fed out of the maxpooling layer to our Attention layer through a LSTM layer.
    The LSTM gives us the outputs as forward states. We feed the forward states with
    our output implemented by Bahdanau Attention. Attention layer calculates the score
    as


    # A. Dataset


    ```

    $score(F, O) = v_a^T(W_F F + W_O O)$

    ```


    To evaluate the proposed model, the experiments were conducted on IDS 2018 data
    set which contains pcap raw files with csv files for study purpose. There are
    10 CSV files with different types of attacks. A summary of files and attacks in
    them is given in Table II.


    Where F and O are the forward states and output of the previous layer and C is
    the context vector or Attention layer and W is the attention states and attention
    weights.


    # B. Feature Extraction


    According to Bahdanau we computed the attention weights and context vector using
    the following


    ```

    $$\alpha_{ts} = \frac{exp(score(F_t, O_s))}{\sum_{i} exp(score(F_i, O_s))}$

    ```


    There were 80 total features like Timestamp dropped and all the values were scaled
    for processing convenience following JIS [9].


    # C. Data PreProcessing


    To realize the non-redundant data for training and verification, a Stratified
    K-Fold Validation strategy and One-hot encoding technique was employed.


    ```

    $c_t = \sum_{s} \alpha_{ts} O_s$

    ```'
