    with the expansion of networks, attacks have also grown in a large scale like
    the hit by APT attacks, DDoS attacks and malware.


    Zero day is also one of list which has been used for years using different approaches
    using honey net [2] sandbox to deep learning frameworks [3]. Usually the daily
    attacks are handled by the line defense mechanisms or Operational Mechanisms of
    Intrusion Detection Systems. The performance metrics are crucial to detecting
    such attacks. This intrusion detection systems comprise of signature based and
    anomaly detection systems [5]. While based methods rely on pattern matching, anomaly
    detection can detect unseen attacks by deviating from normal behaviours. The techniques
    learned from distributed detection [6], neural network [7] to graph based techniques
    [8].


    From the very deep learning techniques are proven to be useful in this field.
    But network attacks increase and increase every year the availability of large
    data set to create proposed network architectures for intrusion detection. DARPA,
    KDD, NSL-KDD-95, DEFCON, CAIDAS, CIC, KYOTO, TOTWE, CIC IDS and IDS are legacy
