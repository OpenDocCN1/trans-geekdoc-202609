    For loss calculation categorical cross-entropy function is being used. The random-search
    method. To avoid fitting a model dropout rate of 0.2 is being used. L1-L2 Kernel
    and activity regulators were also being used to control the regularization in
    this regard.


    # B. LSTM Layer


    LSTM is one of the stronger variants of RNN capturing long term dependencies successfully.
    Here we use context learned from the CNN as input to generate feature map


    ```

    $h_i = lstm(M_i)$

    ```


    # C. Attention Layer


    We fed out of the maxpooling layer to our Attention layer through a LSTM layer.
    The LSTM gives us the outputs as forward states. We feed the forward states with
    our output implemented by Bahdanau Attention. Attention layer calculates the score
    as


    # A. Dataset


    ```

    $score(F, O) = v_a^T(W_F F + W_O O)$

    ```


