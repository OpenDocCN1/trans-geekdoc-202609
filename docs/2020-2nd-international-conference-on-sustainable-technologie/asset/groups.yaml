    在 2018-02-16，LSTM 的准确率为 99.7%，而基于注意力的模型实现了 99.98% 的准确率。但在 2018-02-22 和 2018-02-23，基于注意力的
    LSTM 保持领先地位，且优势比之前略大。


    但在 22 号，在几乎所有类型的情况下，基于注意力的模型都比 LSTM 模型具有更好的检测率，而 LSTM 模型仅检测出了跨越数日的不同类型攻击以及同一天内的
    1.2 种不同类型攻击。在这里可以清楚地看到，特别是对于攻击数据相当不足的暴力破解 Web（Brute Force Web）和暴力破解 Xss（Brute
    Force Xss）攻击，基于注意力的模型表现良好。


