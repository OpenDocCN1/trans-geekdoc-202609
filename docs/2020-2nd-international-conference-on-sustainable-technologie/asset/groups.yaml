    零日攻击也是列表中的一个，多年来通过不同方法被利用，从蜜罐网 [2]、沙箱到深度学习框架 [3]。通常，每日攻击由边界防御机制或入侵检测系统的运行机制来处理。性能指标对于检测此类攻击至关重要。这些入侵检测系统包括基于签名的系统和异常检测系统
    [5]。基于签名的方法依赖于模式匹配，而异常检测可以通过偏离正常行为来检测未见的攻击。从这些研究中学习到的技术涵盖了从分布式检测 [6]、神经网络 [7]
