  md: '![](img/87d485c9776e94cebfcb1b02a513013d_3_0.png)


    Devices can be categorized into two types that use existing networking technologies
    like Wi-Fi or Ethernet connections. Second category includes sensor devices for
    local communication using Zigbee, Z-Wave, Powerline and many other radio frequencies.


    The highest level of attacks is when the attacker has access to the local network.
    The attacker will then be able to turn off devices, system parameters can be misconfigured
    or modified and it can be remotely erased. A malicious update can also read and
    access the firmware to understand the device''s operations and vulnerabilities.
    The cryptographic information is also accessible to the attacker.


    An intruder may target Wi-Fi or the Ethernet interface, while the system updates
    status gets information from the remote server. The attackers may intercept the
    communication with ARP poisoning or changing DNS settings in order to redirect
    the traffic. Self-signed certificates also help attack with HTTPS connection installation,
    allowing attackers to bypass the authentication mechanism. Local network devices
    can be scanned if the attacker has physical access via USB-and-Play (P&P) or discovery
    protocols.


    Mitigation may be done, by securing devices from being accessed via locked racks.
    This is in addition to using wired connections instead of wireless connection,
    disabling unnecessary functions, changing defaults, using strong passwords, limiting
    remote access when needed, ensuring updates are regular, and implementing security
    measures on device before vendor buying it. If possible, protecting devices with
    self-healing mechanism can prevent attacks on IoT system''s potential failure.
    There may be many problems and more possible solutions, but there are many for
    unknown attack vectors.


    # D. Preservative approach:


    Manufacturers should consider securing IoT devices. For instance; IoT gateways
    should be built with built security. This function reduces the organization''s
    security overhead. Increasing usage of IoT devices in different markets can be
    achieved through partnership with secure vendors and researchers.


    # V. PROPOSED IoT SECURITY ARCHITECTURE


    In this section we propose an IoT security architecture that takes into account
    security requirements and the IoT attacks mentioned. The IoT system is divided
    into three parts: Physical, network, and application.


    ![](img/87d485c9776e94cebfcb1b02a513013d_3_1.png)


    Fig. 2. IoT system components


    Fig. 1. Control Life Cycle


    # A. Physical Security


    IoT systems consist of devices connected through a network. Many devices are available
    in different markets on the usage such as smart locks, smart thermostats, smart
    cameras, smart energy management devices, smart electricity meters, smart appliances,
    and smart health sensors. These devices are connected to the backend servers or
    cloud provider services; data is stored and over the cloud. Therefore, users can
    access these devices directly or through the cloud.


    - Network Security


    The second part of proposed architecture is the network. It consists of direct
    service and Cloud-IoT Communication. In the cloud, cloud itself should be properly
    secured and authenticated. When communicating with service, proper device authentication
    and cloud device authentication could be used by a third party. Without a strong
    encryption process in place, the intruder will be able to access to sensitive
    data during communication and perform a middle man attack that can also intercept
    the IoT traffic. This is also a protection against playback attack, which can
    cause an unauthorized access against cloud services or device. This protection
    is achieved by using strong misidentification of device. Strong encryption can
    protect data from unauthorized access during the communication. TLS with certificate'
