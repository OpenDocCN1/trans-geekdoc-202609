    # ### III. I SECURITY


    In this section we discuss the security requirements, as well as the different
    attacks IoT. They are presented in sections A, B, and C respectively.


    # #### A. Security Requirements


    The requirements for the IoT system have some challenges as follows:


    +   * IoT consists of heterogeneous technologies that make security requirements
    more difficult to determine and understand.

    * IoT can have mobile devices that require versatility, which raises security
    risks.

    * IoT produces a large number of information called Big data has its own security
    and management issues.


    An IoT system requires users and devices to be authenticated, authorized, and
    controlled. The identity of users or devices is verified by an IoT system through
    the required rights, and access control limits allow IoT system resources or data
    in order to protect against unintended use, either stored or in transit form.
    Data integrity ensures consistency and accuracy, while non-repudiation ensures
    data authenticity and integrity. Exploiting any vulnerability leads to violate
    one or more of the given attributes secures the immunity against the violation
    of above security. Security attributes and requirement description are summarized
    in Table 1.


    | Attribute | Techniques | Requirement Description |

    |---|---|--|

    | Confidentiality | Encryption | Data protection is required, no one should be
    able to read or edit it. |

    | Integrity | Hash generation | It should be verified that no unauthorized changes
    occurs. |

    | Authentication, Authorization, Access control (AAA) | Implement policies, Security
    credentials, and authentication servers. | Identification of users and devices.
    Digital signature. Digital signature Originator should not be able to deny its
    origin. |


    TABLE I. I SECURITY ATTRIBUTES, TECHNIQUES AND REQUIREMENTS


    # #### B. Security Concerns


    Open Web Application Security Project (OWASP) has some of the security concerns
    in IoT as [11].


    +   * Weak authentication or authorization.

    * Weak security on networks.

    * Weak security configuration.

    * Lack of encryption in transportation.

    * Weak security on cloud interface.

    * Weak security on mobile device.

    * Weak firmware security.

    * Weak physical security.


    Some IoT devices do not update the firmware and encrypt the digital signature.
    Sometimes the mutual authentication between client device and server is not carried
    out. Authentication can be compromised. We applications also have vulnerabilities
    to the database network to exploit for gaining access. Most clients use weak credentials
    such as the “12345” password to be set. This is easily using brute force attack.
    Most of the clouds do not enforce a multi-factor or two factor authentication
    that helps people. Some passwords are weak and can be cracked. Some IoT services
    do not implement security measures against account access and harvesting and do
    not take into account details of distributed computing.


    Most smart applications that control IoT devices not use secure connections. To
    communicate securely with the cloud, the connection application should use the
    Secure Socket Layer (SSL) which is mobile and spans from physical device and wired
    to the wireless connection. Physical devices can be physically secured by unauthorized
    authorization, but full security to the wireless medium is impossible as radio
    waves in or out of


    Only when transmitting data in open wireless media can be secured. Some techniques
    secure the radio waves, but they require greater computer power. Therefore, these
    vectors become vulnerabilities for the attacker to exploit and gain control over
    system, in network and cloud context.'
