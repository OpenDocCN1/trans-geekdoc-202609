    Some open libraries perform strong encryption and these methods are used widely.
    These techniques work with the resource constrained IoT devices. Certificate authorities
    ensure e-resource sharing and strong trust model for authentication purpose. Certificate
    authorities ensure authentication for secure communication between different systems.
    Security can be embedded in devices for trusted communication.


    Wi-Fi and Bluetooth connectivity are used for communication between mobile apps
    and devices. Data should therefore otherwise local traffic will be revealed during
    communication. Mobile applications should be carried out the use of TLS / SSL
    and TLS certificates in which will secure the communications in the Man in the
    Middle TLS ensures secure connectivity between smartphones and applications with
    the cloud services, otherwise attackers may capture the data. Online cloud service
    does not respect privacy, creating increasing risks of usage of storage patterns
    which increases the efforts of hackers across different types of attacks such
    as brute force or dictionary attacks. Server''s TLS certificate validation should
    be properly carried out by the applications. Therefore these best practices can
    contribute to secure the communications.


    Certificate authorities manage keys, and security credentials which are for authentication
    purposes. Different standards are available for certificates, keys and management
    formats for certificates. Also Authorized Certificates "CAS" may use standards
    or custom format. Certificates are managed through protocols like Online Certificate
    Status Protocol (OCSP), Simple Enrollment Protocol (SCEP) and Over Enrollment
    Secure Transport (EST). These protocols help in the management of certificates.
    Other protocols use certificates, keys and authentication mechanisms. Both protocols
    are Transport Layer Security (TLS) and Datagram Transport Layer (DTLS).


