  md: '# C. Types of Attacks


    In this section, we present different types of attacks against IoT systems. They
    are presented in Table 2.


    | Type of Attack | Attack Description | Advantages from an attackers'' perspective
    |

    |---|---|---|

    | Physical Attacks [12] | Aim to target with the hardware components. They are
    very difficult to carry but expensive resources. | Can help attackers to have
    full and effective control of devices. |

    | Side Channel Attacks [13] | Are focused on random deviations that the correlation
    between their expressions can be retrieved from the encryption devices (that is
    neither to the cipher text nor the encryption process). Encryption devices can
    generate easily measurable information and energy consumption statistics. | Help
    attackers to retrieve the key used by a device based on the physical characteristics
    of logical operations depend on the input data |

    | Cryptanalysis Attacks [14] | Are focused on the cipher text and try to break
    the encryption | Help hackers to find the encryption key to be obtained |

    | Software Attacks [15] | Exploit different vulnerabilities in the system through
    its own communication interface. | Help hackers exploit software vulnerabilities
    to gain unauthorized access or sensitive information |

    | Wireless Network Attacks [16] | Wireless communication systems are vulnerable
    to network attacks due to the broad nature of the transmission medium. These attacks
    are classified as active and passive attacks. | Help attackers intercept data
    transmission and send sensitive data


    # IV. SECURITY ORGANIZATIONAL APPROACH


    Organizations involved in deployment of IoT technologies must consider IoT privacy
    and security risks. In order to protect their customers and company security interests,
    organizations must consider security measures to their solutions. To address the
    security of IoT, we suggest the following:


    # A. Measure Security Impact


    The security impacts on consumers and business must be measured for each organization.
    What is the loss for those customers and businesses? Who is going to be responsible
    for security? How will the IoT system be secured? And what is the security solution''s
    impact?


    # B. Multi-layer security approach:


    Security approaches should cover all possible aspects or security attributes such
    as authentication, access control, encryption mechanisms, analysis network security.


    # C. Control cycle:


    Defines the security control from its deployment to operational and incident occurrence
    to neutralization and replacement of IoT devices. Control cycle consists on the
    phases as shown in Figure 1.


    +   - Deploys the security in IoT systems such as identification of any.


    +   - Operational phase: Security becomes operational by continuously monitoring
    and maintaining updates and fixes in the process of "monitoring known objects."


    +   - Incident and reverse phase: If any unwanted security breach occurs of countermeasure,
    upset is neutralized and restoration to normal state should be done.


    +   - Expiration phase: Exits the system and replaces devices and gets back to
    the first phase.'
