    # VI. CONCLUSIONS AND FUTURE WORK


    IoT systems face more secures than normal IoT system. IoT system contains new
    technologies and resource constrained devices. There are different attacks that
    can threaten IoT systems. Security on IoT systems can be deployed by presenting
    a security framework according to the specific needs of IoT system. Security frameworks
    help in understanding and minimizing security of IoT systems. Certificate authorities.
    By using digital certificates, keys and security credentials, authenticated and
    encrypted communication is possible. Our future work will address the special
    issue of back connectivity in IoT system along implementation details.


