    # ## INTRODUCTION


    The Internet of Things allows objects in our world to be linked over the Internet
    with the ability to interact without human intervention. The IoT consists of variety
    that can be linked through wired or wireless networks. These objects have a special
    addressing that allows them to be used in various applications, such as houses,
    smart homes, transportation, connected vehicles, smart grids, smart cities, smart
    traffic control and others [1]. IoT is considered as one of the most promising
    technologies but vulnerable to undesirable threats to the IoT and its elements
    and for protecting the environment from damage. In order to design new architectures
    that provide a secure and reliable system, the building of the IoT with framework
    security is considered [2].


    In this paper, we provide an overview of major IoT security issues, discuss attack
    vectors, IoT security review literature technique, the cybersecurity approach
    towards IoT security architecture.


    The remainder of the paper is organized as follows: Related work II and III present
    the related work, Section IV focuses on the IoT Security Organizational architecture,
    Section V proposes the proposed framework Conclusion and future work are presented
    in VI.


