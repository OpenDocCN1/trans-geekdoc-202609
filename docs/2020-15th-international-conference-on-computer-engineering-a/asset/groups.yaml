    * IoT can have mobile devices that require versatility, which raises security
    risks.

    * IoT produces a large number of information called Big data has its own security
    and management issues.


    An IoT system requires users and devices to be authenticated, authorized, and
    controlled. The identity of users or devices is verified by an IoT system through
    the required rights, and access control limits allow IoT system resources or data
    in order to protect against unintended use, either stored or in transit form.
    Data integrity ensures consistency and accuracy, while non-repudiation ensures
