    ![](img/87d485c9776e94cebfcb1b02a513013d_3_0.png)


    Devices can be categorized into two types that use existing networking technologies
    like Wi-Fi or Ethernet connections. Second category includes sensor devices for
    local communication using Zigbee, Z-Wave, Powerline and many other radio frequencies.


    The highest level of attacks is when the attacker has access to the local network.
    The attacker will then be able to turn off devices, system parameters can be misconfigured
    or modified and it can be remotely erased. A malicious update can also read and
    access the firmware to understand the device''s operations and vulnerabilities.
    The cryptographic information is also accessible to the attacker.


    An intruder may target Wi-Fi or the Ethernet interface, while the system updates
    status gets information from the remote server. The attackers may intercept the
    communication with ARP poisoning or changing DNS settings in order to redirect
    the traffic. Self-signed certificates also help attack with HTTPS connection installation,
    allowing attackers to bypass the authentication mechanism. Local network devices
    can be scanned if the attacker has physical access via USB-and-Play (P&P) or discovery
    protocols.


    Mitigation may be done, by securing devices from being accessed via locked racks.
    This is in addition to using wired connections instead of wireless connection,
    disabling unnecessary functions, changing defaults, using strong passwords, limiting
    remote access when needed, ensuring updates are regular, and implementing security
    measures on device before vendor buying it. If possible, protecting devices with
    self-healing mechanism can prevent attacks on IoT system''s potential failure.
    There may be many problems and more possible solutions, but there are many for
