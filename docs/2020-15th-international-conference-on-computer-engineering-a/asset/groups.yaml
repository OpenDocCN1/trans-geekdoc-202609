    # 物联网 (IoT) 安全框架


    Sherif El-Gendy

    信息技术与计算机科学学院

    尼罗大学

    埃及，开罗

    seligendy@nmu.edu.eg


    Marianne. A. Azer

    国家电信电信研究院

    尼罗大学

    埃及，开罗

    mazer@nmu.edu.eg


    **摘要—** 物联网（IoT）技术的引入通过设备、人与网络之间的交互提供了新的体验。示例包括智能电网、智能健康、智能家居、智能办公场所、工业管理。每天都有更多的设备被连接，造成了更大的安全威胁和问题。为了解决基于资源的
    IoT 设备和终端问题，需要一种 IoT 安全模型。在本文中，我们提出了策略性方法来寻找有效的解决方案。在构建 IoT 系统时，遗憾的是，IoT 设备在制造时并未考虑安全问题
    [3]。


    进一步的安全忧虑可能源于 IoT 系统的配置和管理。因此，IoT 设备需要恰当的配置和身份验证。此外，IoT 厂商在部署之前尚未提供安全保障。潜在的 IoT
    系统风险可能与物理攻击有关。攻击者可能攻击 IoT 设备以连接到本地或家庭网络，攻击者可能访问加密的 IoT 数据或 IoT 凭据。攻击者可能使用恶意软件攻击
    IoT 框架，或攻击连接到家庭网络的 IoT 设备。


    *关键词—* 应用、攻击；IoT；安全；智能


    ## 引言


    物联网允许我们世界中的物体通过互联网连接起来，并能够在没有人工干预的情况下进行交互。物联网由多种可以通过有线或无线网络连接的各种类型组成。这些物体具有特殊的地址，允许它们被用于各种应用，如房屋、智能家居、交通、连接车辆、智能电网、智能城市、智能交通控制等
    [1]。物联网被认为是最具前景的技术之一，但容易受到对 IoT 及其元素的不良威胁的影响，且难以保护环境免受损坏。为了设计提供安全可靠系统的新架构，构建具有框架安全性的
    IoT 被纳入考虑范围内 [2]。


    在本文中，我们提供了主要的 IoT 安全问题概述，讨论了攻击向量、IoT 安全综述文献技术，以及面向 IoT 安全架构的网络安全方法。


    本文的其余部分结构如下：第二节和第三节节介绍了相关工作；第四 节关注 IoT 安全组织架构；第五 节提出了建议的框架；第六 节介绍了结论和未来工作。


    从制造到 IoT 技术实现的整个过程都应该讨论 IoT 设备安全。需要解决作为 IoT 安全关注点的组件，即：网络和 IoT 设备。例如，由于配置不安全或漏洞，IoT
    设备可能会被攻破。需要解决安全挑战。


    ## II. 相关工作


    文献中对 IoT 安全有各种建议：


    [4] 中的作者提出了一种基于硬件的安全技术。为了在硬件层面实现保护，采用了一种基于椭圆曲线密码术的密码学方法。对于他们的方法，[5] 中的作者建议了一种基于软件的框架。他们的工作使用了一种防御通用攻击的策略，并在
    [5] 中提出了一种密钥生成和完整性验证方案。第三方使用了梅尔克树根列表（Merkle list）来检查存储数据的有效性。


    IoT 网络无法防止能够入侵网络内部或外部的攻击者。引入基于签名和异常的入侵检测解决方案可以使用安全机制来防止网络中的任何入侵。攻击签名对于确定任何网络不当行为至关重要。此外，对于常规网络活动进行连接并在偏离正常行为时发出警报。两种方法都有优缺点。[6]
    中的作者建议了一种混合方法，将匿名和基于签名的方法都扩展到所提的系统中。


    [7] 中的指纹可以识别设备为基站或访问点。识别来自无线网络的未识别信号的身份。[8] 中的作者建议了使用哈希链、哈希链接和身份验证协议的 IoT 身份验证协议。然而，这些协议保护了资源并奖励了
    IoT 性能。


    [9] 中的作者推荐了一个防止 IoT 攻击的框架。他们引入了一个模型，在不受维护限制的情况下使 IoT 系统安全，以便为低限制设备（如网关或其他 IoT
    设备）实现安全。它利用 IoT 设备特征进行识别，例如信号频率和容量。


    ### III. 安全性


    在本节中，我们讨论了安全需求以及针对 IoT 的不同攻击。它们分别在 A、B、C 三部分中介绍。


    #### A. 安全需求


    IoT 系统的需求面临如下挑战：


    - IoT 由异构技术组成，使得安全需求的确定和理解变得更加困难。

    - IoT 可能具有需要多功能性的移动设备，这增加了安全风险。

    - IoT 产生大量信息，大数据有其自身的安全和管理问题。


    IoT 系统要求用户和设备经过身份验证、授权和控制。用户或设备的身份由 IoT 系统验证。数据完整性确保了一性和准确性，而不可否认性确保了数据的真实性。利用任何漏洞都会违反上述的一个或多个属性。安全属性和需求总结如表1所示。


    | 属性 | 技术 | 需求描述 |

    |---|---|---|

    | 机密性 | 加密 | 需要保护数据，任何人都不应读取或编辑。 |

    | 完整性 | 哈希生成 | 应该确保没有未经授权的更改。 |

    | AAA | 实现策略、安全凭据和认证服务器 | 用户和设备的识别。数字签名。发送者不能否认其来源。 |


    表 I. 安全属性、技术与需求


    #### B. 安全担忧


    开放应用安全项目 (OWASP) 针对 IoT 有一些安全担忧如下 [11]。


    - 弱的身份验证或授权。

    - 网络安全脆弱。

    - 配置不安全。

    - 传输过程中缺乏加密。

    - 云端接口安全脆弱。

    - 移动设备安全脆弱。

    - 固件安全问题。

    - 物理安全问题。


    某些 IoT 设备未更新固件和加密数字签名。有时客户端设备与服务器之间的相互验证没有执行。身份验证可能被攻破。我们的应用程序也存在数据库网络漏洞用于获取访问。大多数客户端使用弱凭据，例如设置“12345”密码。这很容易通过暴力破解实现。大多数云平台没有强制执行多因素或双因子身份验证，而这对人们很有帮助。某些密码很弱，可以被破解。大多数控制
    IoT 设备的智能应用程序没有使用安全连接。为了与云进行安全通信，连接应用程序应使用安全套接层 (SSL)，它是移动的并跨越从物理设备、有线到无线连接。物理设备可以通过未经授权的授权进行物理保护，但无线介质的完全安全是不可能的，因为在开放无线介质中传输数据的无线电波可以被。某些技术可以保护无线电波，但它们需要更大的计算能力。因此，这些向量成为攻击者利用并获取控制权的漏洞，在网络和云背景下也是如此。


