    \n## 7.5 基于灰度共生矩阵（GLCM）的特征提取\n\n纹理特征具有基于图像空间定义来描述视觉模式的特点。识别图像中的特定纹理，是通过将纹理表示为二维灰度变化来实现的，这种二维灰度变化被称为灰度共生矩阵（GLCM）[1]。GLCM\
    \ 被定义为一种发现纹理的统计方法，它考虑了像素之间的空间关系。GLCM 函数通过计算图像中具有特定值和特定像素关系的像素对出现的频率，然后从矩阵中提取统计度量，来表示图像的纹理。式\
    \ (7.2) 定义了共生矩阵的归一化概率。\n\n\\[\nP_\\delta(i,j)=\\frac{\\#\\{(x,y),(x+d_x,y+d_y)\\\
    mid (x,y)\\in S,\\ f(x,y)=i,\\ f(x+d_x,y+d_y)=j\\}}{\\#S} \\tag{7.2}\n\\]\n\n\
    其中 x,y = 0, 1, ..., N − 1 为像素坐标，i,j = 0, 1, ..., L − 1 为灰度级，S 为图像中具有某种关系的像素对，#S\
    \ 为 S 中元素的个数，P_δ(i,j) 为概率密度。\n\n计算 GLCM 时考虑了不同方向，例如 δ = 0°、δ = 45°、δ = 90° 和 δ\
    \ = 135°。基于 GLCM 计算能量、对比度、熵和相关性这四个统计参数，如公式 7.3–7.6 所示。像素对的重复程度通过能量或角二阶矩（ASM）来衡量。灰度级的方差由对比度量化。图像的混乱程度由熵衡量，相关性则返回了整幅图像中一个像素与其邻域像素相关程度的度量。\n\
    \n\\[\nASM=\\sum\\sum P^2(i,j) \\tag{7.3}\n\\]\n\n\\[\nCON = \\sum\\sum (i-j)^2\
    \ P(i,j) \\tag{7.4}\n\\]\n\n\\[\nENT = -\\sum\\sum P(i,j)\\log[P(i,j)] \\tag{7.5}\n\
