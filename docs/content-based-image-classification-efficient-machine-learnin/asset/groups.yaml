  mdcn: "\n## 9.6 图像变换\n\n五种用于特征提取的变换技术已被提出，分别是离散余弦变换（DCT）、沃尔什变换、Kekre 变换、离散正弦变换（DST）和离散\
    \ Hartley 变换（DHT）。对这些技术的分类性能比较显示，使用部分 DCT 系数的特征提取优于沃尔什变换、Kekre 变换、DST 和 DHT。所提技术的优越性在分类性能方面也已得到证实，优于现有技术。\n\
    \n任何图像变换的目的都是将高频分量移向图像的上端，而将低频分量移向图像的下端。变换通过排除不显著的系数大幅减小特征向量的大小。变换的能量集中可以将很大一部分平均能量打包到少数几个分量中。这导致了内容基于图像分类的更快执行和更高效的算法设计。\n\
    \n从变换系数中每个分量提取的特征向量被存储为一组完整的特征向量。此外，从整个特征向量集中提取部分系数以形成特征向量数据库。包含部分系数的特征向量数据库的构建从完整特征向量集的\
    \ 50% 开始，直至完整特征向量集的 0.06%。\n\n## 9.7 形态学操作\n\n两种不同的形态学算子，即顶帽和底帽形态学算子的特征提取被比较以进行分类性能评估。\n\
    \n形状被认为是识别基于对象的信息的关键特征。形状特征在图像识别中发挥着至关重要的作用，可借助结构元素识别感兴趣对象的结构。使用顶帽和底帽算子实现了基于形态学的操作，用于从图像中提取特征。基本形态学操作由膨胀和腐蚀函数执行。\n\
    \n最初，通过膨胀将像素应用于对象边界使图像膨胀；通过腐蚀去除边界像素使图像收缩。输入图像中对应的像素与邻近像素进行比较，以定义输出图像中每个像素的值。\n\
    \n图像各个颜色分量的轮廓区域和背景部分被分为两个不同的簇。通过计算图像的特征向量得出两个簇的均值和标准差。\n\n使用顶帽和底帽形态学算子进行特征提取的比较已明确显示，使用底帽变换的特征提取具有更好的\
    \ Precision、Recall 和 F1-Score 值以及更低的 MR。与最先进技术的比较也得出了相同的结果。\n\n## 9.8 纹理分析\n\n\
    两种使用纹理分析的特征提取技术，即使用 Linde-Buzo-Grey（LBG）算法的矢量量化码本表示特征提取和基于灰度共生矩阵（GLCM）的特征提取，已被比较以评估分类性能。\n\
    \n在某些图像中，区域的定义特征对于正确分析可能很重要。在纹理分析的帮助下，可以从颜色或强度的空间排列中进行特征提取。一些直方图分布可以具有不同的纹理表示，这可以作为提取独特特征的工具。矢量量化（VQ）用于从图像生成作为特征向量的码本。\n\
    \n通过矢量量化将 *k* 维欧几里得空间映射到有限子集。码本由有限集 CB 表示。\n\n图像视觉模式的空间定义已被纹理特征所表征。图像中特定纹理的检测是通过将纹理表示为二维灰度变化，即灰度共生矩阵（GLCM）来执行的。GLCM\
    \ 是一种用于研究纹理的统计方法，考虑了像素的空间关系。图像的纹理由 GLCM 函数通过计算图像中具有特定值和特定像素关系的像素对的存在频率，然后从矩阵中提取统计度量来描绘。\n\
    \n基于 Precision、Recall、MR 和 F1-Score 的比较已证实，使用 LBG 的 VQ 特征提取优于 GLCM 特征提取方法用于基于内容的图像分类，也优于最先进技术。\n\
    \n## 9.9 用于决策融合分类的多技术特征提取\n\n基于内容的图像识别技术的性能取决于稳健特征向量的提取。诸如颜色、形状、纹理等多种低级特征构成了特征提取过程。然而，由多个特征组成的图像很难由单一特征提取技术定义。因此，进行了两种不同的基于融合的分类并相互比较。\n\
    \n第一种技术通过分别评估两种不同特征向量的分类决策进行了晚期融合，即使用 Sauvola 局部阈值选择提取的二值化特征和使用离散余弦变换（DCT）部分系数提取的变换域特征。第二种基于融合的技术是对上述特征向量的早期融合。\n\
    \n二值化特征和变换域特征分别使用 z 分数标准化进行归一化，然后进行水平拼接。包含更多图像数据细节的组合特征向量现在作为输入提供给分类器以获得更好的性能。\n\
    \n使用融合技术进行分类的两种结果进行了比较，结果表明使用四种特征提取技术的决策融合分类优于使用三种不同特征提取技术的决策融合分类。\n\n此外，优越的技术被用作检索的前驱，查询图像由所提出的基于融合的方法进行分类。检索结果与基于融合检索的最先进技术进行了比较，所提出的方法优于现有的基于融合的技术。\n\
    \n## 9.10 跨域特征提取技术比较\n\n从二值化、图像变换、形态学和纹理分析中提取特征的技术在分类性能方面进行了比较。每个领域中选出的最佳技术在图\
    \ 9.3 中用于比较。\n\n图 9.3 中的比较清楚地显示，与其他领域中提出的其余特征提取技术相比，使用 LBG 的 VQ 进行特征提取的分类具有最佳的\
    \ Precision、Recall、F1-Score 和 MR。\n\n## 9.11 未来工作\n\n本书广泛涵盖了用于图像分类的各个领域中的基于内容的特征提取技术。分类结果揭示了相对于最先进技术改进性能的统计显著性。\n\
    \n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_185_0.png)\n\n**图 9.3**  \n使用跨域特征提取技术的分类比较。\
    \  \n**[观察：使用 LBG 的 VQ 进行特征提取的分类具有最佳性能。]**\n\n从今以后，这些技术可以针对包括医学成像、卫星图像、植物病害检测等在内的不同领域的图像数据集进行评估。融合方法也可以用于将表示学习特征与手工描述符相结合，以评估混合特征定义的分类性能。\n\
    \n本书为计算机视觉从业者处理图像数据进行分类时提供了新颖的视角。此外，当融合基于提议用于将传统特征与基于表示学习的特征相结合时，可能超过神经网络的准确性。\n\
