    # 8


    *Fusion-Based Classification: A Comparison of Early Fusion and Late Fusion Architecture
    for Content-Based Features*


    # 8.1 Prelude


    Preceding years of studies on content-based image classification have emphasized
    the extraction of a single feature to represent image content. Achieving satisfactory
    classification results with a distinct image feature is challenging since other
    important features are ignored during the recognition task. An image comprises
    a rich feature set that is diverse in nature and can jointly create a better representation
    of the image content. Consequently, combining different features enhances accuracy
    in classification results.


    Recent literature has applied the fusion framework by combining color and texture
    features. All the low-level features have been combined in content-based color
    image identification. The proposed technique has acquired percentages of a small
    number of dominant colors in the image by using color quantization algorithm with
    clusters. Shape descriptor and texture features have been extracted by using the
    pseudo-Zernike moments and steerable filter decomposition. Elevated accuracy in
    image identification has been achieved through merging of color, texture and shape.
    Three image features of color histogram, gray level co-occurrence matrix and Zernike
    Moments have been fused in the approach. Merging of low-level features has led
    to improved accuracy. Structure elements descriptors have been proposed to extract
    color and texture of images as features. Amalgamation of statistical and structural
