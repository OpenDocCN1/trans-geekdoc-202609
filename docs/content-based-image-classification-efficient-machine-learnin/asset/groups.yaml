    Local descriptors [52–54] of shape are prioritized over the global descriptors
    [55] with passing time due to distinctive modeling restrictions. Representation
    of shape by discrete curve evolution is helpful to simplify contours to eliminate
    noisy and irrelevant shape attributes [56]. A new shape descriptor, known as shape
    context, is recognized by multiple geometric transformations as a convincingly
    compact and robust means for feature extraction [57]. A metric tree is arranged
    for feature representations (curvature and orientation) [58] by expressing the
    curves with a set of segments or tokens [53]. The purpose of shape matching is
    fulfilled by approximating the shapes as sequences of concave and convex segments
    [54]. Investigation of morphological profiles (MP) is conducted with partial reconstruction
    and directional MPs for the categorization of high-resolution hyperspectral images
    from urban areas [59]. Medical X-ray image classification is facilitated by extraction
    of shape features such as Fourier Descriptor, Invariant Moments, and Zernike Moments
    from the image [60]. Regions of interest (ROIs) from the input image of the traffic
    signals for traffic sign classification are distinguished by the use of morphological
    operators, segmentation and contour detection [61]. Automated damaged building
    detection is carried out by applying morphological operations of opening and closing
    for segmented images [62]. Image enhancement has also used morphological operator
    prior to image segmentation of pavement images to detect pavement cracking [63].
    Leaf image classification has used shape context as a global feature [64]. Accurate
    classification is observed with images based region features calculated by eigenregions.
    Shape features capable of describing the 3-D shape of the target objects are incorporated
    for supervoxel-based segmentation of mitochondria [65]. An elaborate study on
    Fourier descriptor, curvature scale space (CSS), angular radial transform (ART)
    and image moment descriptors for shape representation is carried out for shape-based
    image recognition [66]. Shape feature is efficiently represented by designing
    low-level shape descriptors, which has added robustness to rotation, scaling and
    deformation of shapes [67]. Midlevel modeling of shape representation is focused
    by developing a new shape demonstration called Bag of Contour Fragments (BCF)
    in which a shape is decomposed into contour fragments and is described individually
    using a shape descriptor (Fig. 2.3).


    Classification of contour shapes using class contour segments as input features
    with Bayesian classifier is proposed which has designed a shape classification
    framework [68]. Input feature comprising of contour segments and skeleton paths
    are considered for categorization of shape with a Gaussian mixture model [69].
