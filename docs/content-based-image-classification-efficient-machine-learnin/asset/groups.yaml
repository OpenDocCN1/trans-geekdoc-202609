    使用四种不同分类器，在全部四个数据集上，采用DCT、沃尔什变换、Kekre变换、DST和DHT方法的部分系数进行特征提取的分类MR比较。


    > **[观察结果：]** 最低的MR由采用部分DCT系数的特征提取所体现。


    > **假设1：** *采用部分DCT系数特征提取所得到的分类结果的精确率值与现有技术相比没有显著差异。*


