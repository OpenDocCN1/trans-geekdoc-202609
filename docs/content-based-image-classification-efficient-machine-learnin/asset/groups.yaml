    ## 10.1 Prelude


    **Waikato Environment for Knowledge Analysis (WEKA)** is an open source data mining
    tool developed by the University of Waikato in New Zealand [1]. This book has
    extensively used WEKA to evaluate classification results of content-based image
    data.


    WEKA is considered a technique for machine learning using a graphical user interface
    (GUI). The software has a vast collection of machine learning algorithms that
    are capable of data preprocessing, classification, regression, clustering, association
    rules and visualization [2].


    ## 10.2 Getting Started with WEKA


    Please use the following snapshots to download WEKA:


    - 1. The search results for the ‘download Weka’ phrase are shown (Fig. 10.1).
    Click on the link provided below to download: https://www.cs.waikato.ac.nz/ml/weka/

    - 2. Click on the DOWNLOAD AND INSTALL tab (Fig. 10.2).

    - 3. Select the option for your installed operating system (OS) and download the
    self-extracting files by clicking the appropriate choice (Fig. 10.3).

    - 4. Install WEKA (Fig. 10.4).

    - 5. Initiate the WEKA application (Fig. 10.5).

    - 6. Click the Explorer tab on WEKA GUI Chooser (Fig. 10.6).

