    **Observation:** The *p* values have indicated significant differences in Precision
    results for all the existing techniques with respect to the proposed technique
    of feature extraction with Sauvola’s local threshold selection.


    The proposed technique is also less variable compared to the existing techniques.
    Therefore, it can be concluded that the introduced technique of feature extraction
    has greater consistency compared to the existing techniques. Hence, the proposed
    method has shown statistically significant contribution for enhanced classification
    compared to the existing techniques.


    The *t*-test is performed with four different comparisons. Therefore, conducting
    a post hoc analysis is necessary to accept the significance of the derived results
    using the Bonferroni correction. The value of α is considered to be 0.05 for the
    *t*-test. The expression to calculate the Bonferroni correction value follows:


    $$\mathit{Bonferroni\_\alpha} = \frac{\alpha}{\mathit{Number\_of\_tests}}$$


    Here, α = 0.05


    $$\mathit{Number\_of\_tests} = 4$$


    Therefore,


    $$\mathit{Bonferroni\_\alpha} = 0.013$$


    Now, the *p*-values in Table 4.8 are compared to the newly calculated *Bonferroni_α*
    value of 0.013.


    The comparison shows that the *p*-value calculated for evaluation of the proposed
    technique to the technique used by Shaikh [8] in Table 4.8 is smaller than *Bonferroni_α*
    value. Therefore, the two techniques have significant differences.

