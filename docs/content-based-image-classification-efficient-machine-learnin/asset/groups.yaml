    g=i(:,:,2); #green component

    [x y z]=size(g); #dimension of green component

    b=i(:,:,3); #blue component

    [j k l]=size(b); #dimension of blue component


    #Intensity values as single dimensional array

    r1=r(:);

    g1=g(:);

    b1=b(:);


    #Sorting of Intensity values

    r2=sort(r1);

    g2=sort(g1);

    b2=sort(b1);


    #Dimension of array

    [m n p]=size(r2);

    ```


