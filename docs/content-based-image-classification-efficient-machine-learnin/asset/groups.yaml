    # 6


    # Content-Based Feature Extraction:

    Morphological Operators


    # 6.1 Prelude


    The term morphology refers to a distinct contour, formation or appearance. The
    objects to be identified in an image exhibit all the aforesaid properties. Hence,
    the characteristics can be well utilized to design robust descriptors for content-based
    image classification. Morphological operations in image processing is the collection
    of multiple operations based on set theory to comprehend a range of activities
    embracing boundary extraction, filling of small holes present in images and noise
    removal from images [1]. Analysis of the shape of an object present in an image
    can be efficiently performed by applying mathematical morphology due to its origin
    from set theory. Morphological elements consider a mask that is a binary image
    as structuring element to be provided as an input by the morphological operators.
    Flexible applications of all the set operators, such as intersection, union, inclusion
    and complement, are possible for image data. Dilation and erosion in morphology
    are considered to be the fundamental functions. Initially, the image is to be
    processed by the effect of swelling by applying pixels to the object boundaries
    with dilation. Further, the object shape shrinking effect is to be performed with
    erosion by removing the boundary pixels. The corresponding pixel in the input
    image is to be compared to the neighboring pixels to define the value of each
    pixel in the output image. This chapter introduces two different techniques of
    feature extraction using morphological operators—namely, top-hat transform and
    bottom-hat transform. The two techniques are implemented based on the block truncation
    coding (BTC) approach. The descriptors are generated by calculating the mean of
    the separated foreground and the background pixels by applying morphological operator.
    The size of feature vectors for each color component is 2. Thus, for three color
    components, the size of feature vector is (3 × 2) = 6, which is obtained by applying
    morphological operators for feature extraction. An illustration is provided in
    Fig. 6.1.'
