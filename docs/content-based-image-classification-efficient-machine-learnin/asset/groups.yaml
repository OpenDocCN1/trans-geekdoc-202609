    - 该过程对箱中的所有值重复执行以进行平滑处理。


    在 SBTC 的情况下，通过实施改进的箱划分技术采用了类似的方法。图像的灰度值被排序，以便从单个颜色分量红色 (R)、绿色 (G) 和蓝色 (B) 中提取特征向量。


    该技术与第 3.3 节中描述的技术的主要区别在于提取的特征向量的维度。早期技术创建的特征向量维度是箱数的两倍，而该技术产生的特征向量等于箱数，如图 3.3
    所示。


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_63_0.png)


    **图 3.3**

    SBTC 的框图。


    图像的强度值由该过程用一维数组表示。对一维数组的排序按升序进行。


    例如，将所有灰度值排序并划分为 N = 8 个箱或分区将产生 8 个特征向量，这与箱或分区的数量相同。这导致特征向量尺寸的全面减少，从而提高了特征向量提取的计算效率。该过程将强度值分离为
    N 个块，其中 (N ≥ 2)。块截断编码技术将每个颜色分量红色 (R)、绿色 (G) 和蓝色 (B) 视为一个块以实现特征提取。此外，各个块被划分为包含已排序强度值的箱。特定块的特征向量通过对应箱的已排序强度值的平均值计算得出。该过程对所有三个颜色分量重复执行，并将生成的特征向量组合形成图像的特征向量。


    ### 3.7 代码示例 (MATLAB)


    ```

