    ## 3.6 Feature Extraction Using Sorted Block Truncation Coding for Content-Based
    Image Classification


    Image processing algorithms have considered noise extending adverse influence
    on image data by staining it to a large extent. The fact is evident in plenty
    of literature that has introduced varied noise elimination techniques to decrease
    the effect of noise over image data. One of the popular techniques is the binning
    method, which is extensively implemented for smoothing sorted values of data in
    a dataset [8]. A stepwise functionality of binning method to sort the values in
    a dataset follows:


    - The sorted values are divided in bins.

    - Average of the sorted values are computed by considering the neighboring values
    to perform local smoothing for each of the bins. The local smoothing is crucial
    for noise removal.

    - The corresponding average value for a particular bin is instrumental in replacing
    each value present in the bin.

    '
  mdcn: '

    (B)—作为来自图像的块。此后，用于特征提取的颜色团的计算在 RGB 颜色空间中采用 Wang 数据集进行。


    逐步特征提取指南如下：


    - 颜色团计算始于对各个颜色分量的灰度值进行近似，以形成对应分量的灰度值的不相交子集。

    - 接下来是对强度值进行逻辑分区，形成众多颜色团的子划分，这涉及为每个 R、G 和 B 颜色分量进行多个阶段的颜色箱形成。

    - 分区数量的增加以 2 的倍数形式制定，如图 3.4 所示。

    - 分区在 2 到 32 的范围内进行评估，以确定特征向量提取合适的团数量。

    - 特征提取的五个阶段分别命名为 2 个颜色团的 BTC、4 个颜色团的 BTC、8 个颜色团的 BTC、16 个颜色团的 BTC 和 32 个颜色团的 BTC。

    - 每个颜色团中特定分区的全部灰度值都与该分区灰度值的均值进行比较。

    - 该过程最终创建两个不同的强度组，分别具有大于均值阈值的值和小于均值阈值的值。

    - 计算对应团的平均上强度和平均下强度值。


    因此，可以从特定团中计算出两个不同的高强度和低强度特征值。这使得特征向量的数量是所选颜色团数量的两倍（图 3.2）。


