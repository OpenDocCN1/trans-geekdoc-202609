    # 7.8 Evaluation of Proposed Techniques


    Two techniques of texture content-based feature extractions were introduced in
    the previous subsections. The techniques were tested for classification results
    with four different widely used public datasets. Four different classifiers were
    used for the comparison. The two techniques are compared based on Precision, Recall,
    Misclassification Rate (MR) and F1-Score values in Figs. 7.3–7.6.


    The comparisons based on Precision, Recall, MR and F1-Score shown in Figs. 7.3–7.6
    establish feature extraction with VQ using LBG as a superior technique compared
    to that of the GLCM method of feature extraction for content-based image classification.


    The LBG technique divides the gray values into separate clusters based on likelihood
    and separates the given test image into local partitions for feature extraction.
    This has locally addressed the adversities of test images, namely, variance in
    gray levels within the object and the background, inadequate contrast, etc., while
    calculating the code vectors from each cluster. This has further facilitated robust
    feature extraction from the region of interest in the test images.


