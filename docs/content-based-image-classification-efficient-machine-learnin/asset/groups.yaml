    ## 3.6 用于基于内容的图像分类的排序块截断编码特征提取


    图像处理算法认为噪声会以很大程度污染图像数据，从而对图像数据产生不利影响。大量文献已引入各种降噪技术以减少噪声对图像数据的影响。一种流行技术是分箱方法，该方法广泛用于平滑数据集中排序值的数据
    [8]。分箱方法对数据集中值进行排序的逐步功能如下：


    - 排序值被划分为箱。

    - 通过考虑相邻值来计算排序值的平均值，以对每个箱进行局部平滑。局部平滑对于降噪至关重要。

    - 特定箱的对应平均值可用于替换该箱中的每个值。


