  - "[PAGE 109]\n\n# 5\n\n# Content-Based Feature Extraction:  \nImage Transforms\n\
    \n# 5.1 Prelude\n\nImage transforms are essential to transfer the domain of an\
    \ image for significant descriptor definition. Feature extraction from images\
    \ in the frequency domain has often appeared to be beneficial compared to that\
    \ of the spatial domain due to better visibility of patterns. Image transforms\
    \ are considered as representations of images as a class of unitary matrices.\
    \ A transform is useful in creating basis images for image representation by means\
    \ of extrapolating the image to a set of basis functions. The process never alters\
    \ the image content while shifting the image representation from spatial domain\
    \ to frequency domain. Transforms convert spatial information to frequency domain\
    \ information, where certain operations are easier to perform. For example, convolution\
    \ operations can be reduced to matrix multiplication in the frequency domain.\
    \ Two advantages are recognized for transform techniques. Firstly, the critical\
    \ components of image patterns can be isolated by transformation, and those components\
    \ can have direct access for analysis. Secondly, the transformation process has\
    \ the ability to condense image data into a compact form, which has been helpful\
    \ for radical reduction of feature vector size. This chapter implements these\
    \ properties of image transforms to extract feature vectors for content-based\
    \ image classification. Individual classification performances are measured with\
    \ a full feature vector set generated by applying different transform techniques\
    \ and with subsequent reduction of feature vector size toward the high frequency\
    \ components at the upper portion of the image. Hence, the technique has identified\
    \ the suitability of visual words method for generation of feature vectors. Visual\
    \ words comprise small pieces of image data, which can carry significant information\
    \ about the entire image. The energy compaction property of transform techniques\
    \ have efficiently generated the features as visual words by concentrating important\
    \ image information in a block of few transform components for each color component\
    \ extracted from the image."
  - '[PAGE 110]


    # 5.2 Generating Partial Energy Coefficient from Transformed Images


    The significance of any image transform is to relocate the high-frequency components
    toward the upper end of the image and the low-frequency components toward the
    lower end of the image. The mentioned property is used as a tool to drastically
    reduce the size of feature vectors by exclusion of insignificant coefficients
    as shown in Fig. 5.1. A smaller dimension of feature vector has resulted in less
    time for comparison of feature vectors in the classification process.


    Extraction of feature vectors is carried out in 14 steps from the transformed
    images. Initially, all coefficients of transformed images are considered as feature
    vectors that have included 100% of the transformed coefficients. Henceforth, gradual
    reduction in size of the feature vectors as 50%, 25%, 12.5%, 6.25%, 3.125%, 1.5625%,
    0.7813%, 0.39%, 0.195%, 0.097%, 0.048%, 0.024%, 0.012% and 0.06% respectively
    of the complete transformed coefficients is carried out to locate the high-frequency
    component of the transformed image. For an image of dimension 256 × 256, the process
    has reduced the feature size from 256 × 256 to 2 × 2 per color component.


    **The following steps are used for classification with feature extraction using
    partial energy coefficients:**


    +   - Red, Green and Blue color components are extracted from a given image.

    +   - Image Transform is applied on each of the components to extract feature
    vectors.

    +   - The extracted feature vectors from each of the components are stored as
    a complete set of feature vectors.

    +   - Further, partial coefficients from the entire feature vector set are extracted
    to form the feature vector database.


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_110_0.png)


    **FIGURE 5.1**

    Steps for Extraction of Partial Energy Coefficient from Image.'
