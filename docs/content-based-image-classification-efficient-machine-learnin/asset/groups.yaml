  - '[PAGE 64]


    The intensity values of an image are represented by the process with an array
    of single dimension. Sorting of the single-dimension array is carried out in ascending
    order.


    For instance, sorting and dividing all the gray values into N = 8 bins or partitions
    will result in the generation of 8 feature vectors, which turns out to be identical
    to the number of bins or partitions. This results in comprehensive reduction in
    the size of the feature vector, thus enhancing the efficiency of computation for
    extraction of feature vectors. The process has separated the intensity values
    into N blocks where (N ≥ 2). Block truncation coding technique has considered
    each of the color components Red (R), Green (G) and Blue (B) as a block to implement
    feature extraction. Further, individual blocks are divided into bins comprising
    sorted intensity values. The feature vector of a particular block is computed
    by the average of sorted intensity values of the corresponding bin. The process
    is repeated for all three color components and the generated feature vectors are
    combined to form the feature vector of the image.


    # 3.7 Code Example (MATLAB)


    ```

    #Read an image

    i=imread(''path\imagefile'');


    #Separate the color components

