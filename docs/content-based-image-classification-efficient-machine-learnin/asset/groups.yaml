  md: "\nContent-based image classification is identified as a noteworthy technique\
    \ to handle these adversities. It has been considered effective to identify image\
    \ data based on its content instead of superficial annotation.\n\nImage annotation\
    \ is carried out by labeling the image content with text keywords. It requires\
    \ considerable human intervention to manually perform this action. Moreover, the\
    \ probability of erroneous annotation is high in cases of labeling gigantic image\
    \ datasets with a manual text entry procedure. The text tag describing image content\
    \ is as good as the vocabulary of the person who tags it. Thus, the same image\
    \ can have different descriptions based on the vocabulary of the annotation agent\
    \ responsible for it, which in turn hampers the consistency of the entire process\
    \ [8].\n\nConversely, extraction of a feature vector from the intrinsic pixels\
    \ of the image data has eradicated the challenges faced due to manual annotation\
    \ and has automated the process of identification with minimal human intervention\
    \ [9]. Present day civilization follows the trend of capturing images of events\
    \ and objects of unknown genre. The process of content-based image identification\
    \ can readily classify the captured images into known categories with the help\
    \ of preexisting training knowledge. This, in turn, assists in decision-making\
    \ for further processing of the image data in terms of assorted commercial usage.\n\
    \nPromptness is not the only decisive factor for efficient image classification\
    \ based on content. Accuracy of classification results contribute immensely to\
    \ the success factor of a classification infrastructure. Thus, to ensure the competence\
    \ of content-based image classification, one has to identify an effectual feature\
    \ extraction technique. The extracted features become pivotal to govern the success\
    \ rate of categorizing the image data into corresponding labels.\n\nTherefore,\
    \ different feature extraction techniques are discussed in this work to represent\
    \ the image globally and locally by means of extracted features. The local approach\
    \ functions on segmented image portions for feature extraction, contrary to the\
    \ global approach. However, image data comprises a rich feature set, which is\
    \ seldom addressed by a single-feature extraction technique. As a result, fusion\
    \ of features has been explored to evaluate the classification results for improved\
    \ accuracy.\n\nThe experiments are carried out on four widely used public datasets\
    \ using four different classifiers to assess the robustness of extracted features.\
    \ Diverse metrics, such as Precision, Recall, Misclassification Rate (MR) and\
    \ F1 Score, are used to compare the classification results. A brief explanation\
    \ of each of the metrics used is given in the following section. It is followed\
    \ by the description of the classifiers and the datasets.\n\n## 1.2 Metrics\n\n\
    Different parameters have been used to measure the classification performances\
    \ of the diverse feature extraction techniques [10]. A brief explanation for each\
    \ of the parameters is also provided.\n\n### 1.2.1 Precision\n\nPrecision is defined\
    \ as the fraction of appropriate classification among the classified instances\
    \ as in equation 1.1\n\n$$Precision = \\frac{TP}{TP + FP} \\tag{1.1}$$\n\n###\
    \ 1.2.2 True Positive (TP) Rate/Recall\n\nRecall is defined as the fraction of\
    \ appropriate classification among the total number of related instances as in\
    \ equation 1.2.\n\n$$TP\\ Rate/Recall = \\frac{TP}{TP + FN} \\tag{1.2}$$\n\n###\
    \ 1.2.3 Misclassification Rate (MR)\n\nMisclassification Rate (MR) is defined\
    \ as fraction of incorrectly classified instances and is denoted as the error\
    \ rate of the classifier as in equation 1.3.\n\n$$MR = \\frac{FP + FN}{TP + TN\
    \ + FP + FN} \\tag{1.3}$$\n\n### 1.2.4 F1-Score\n\nThe weighted average of Precision\
    \ and Recall (TP Rate) is deduced as the F1 Score of classification and is given\
    \ as in equation 1.4.\n\n$$F1\\ Score = \\frac{2 * Precision * Recall}{Precision\
    \ + Recall} \\tag{1.4}$$\n\n### 1.2.5 Accuracy\n\nAccuracy of a classifier is\
    \ measured by means of the recognition rate of the classifier for identifying\
    \ the instances correctly and is given as in equation 1.5.\n\n$Accuracy = \\frac{TP\
    \ + TN}{TP + TN + FP + FN}$ (1.5)\n\n### 1.2.6 False Positive (FP) Rate\n\nThis\
    \ is the fraction of incorrect results classified as positive results by the classifier\
    \ and is given as in equation 1.6.\n\n$FP Rate = \\frac{FP}{FP + TN}$ (1.6)\n\n\
    ### 1.2.7 True Negative (TN) Rate\n\nThis metric is the fraction of negative results\
    \ correctly produced for negative instances and is given as in equation 1.7.\n\
    \n$TN Rate = \\frac{TN}{TN + FP}$ (1.7)\n\n### 1.2.8 False Negative (FN) Rate\n\
    \nThis metric provides the fraction of positive results that are classified as\
    \ negative results by the classifier and is given as in equation 1.8.\n\n$FN Rate\
    \ = \\frac{FN}{TP + FN}$ (1.8)\n\n## 1.3 Classifiers\n\nDiverse feature extraction\
    \ techniques have been implemented to assess the classification performance under\
    \ varied classifier environments. This is done to examine the consistency of the\
    \ corresponding feature extraction technique when applied to different datasets.\
    \ Four different types of classifiers have been considered to carry out the task.\
    \ The classifiers are K Nearest Neighbor (KNN) Classifier, Ripple-Down Rule (RIDOR)\
    \ Classifier, Artificial Neural Network (ANN) Classifier and Support Vector Machine\
    \ (SVM) Classifier. Brief descriptions of the classifiers explain their individual\
    \ work flows [10].\n\n### 1.3.1 KNN Classifier\n\nThe highest error rate for K\
    \ Nearest Neighbor (KNN) is twice the Bayes error rate, which is considered as\
    \ the minimum possible rate for an instance-based classifier. Thus, it is considered\
    \ as one of the classifiers for evaluation purposes. It classifies the unknown\
    \ instance by identifying its nearest neighbor in the instance space and further\
    \ designates the class of the nearest neighbor to the unknown instance.\n\nThe\
    \ working formula of four different similarity measures, namely, Euclidean Distance,\
    \ Canberra Distance, City Block Distance and Mean Squared Error, have been given\
    \ in equations 1.9–1.12. These similarity measures are implemented to figure out\
    \ the nearest neighbors during the classification process of the instances.\n\n\
    $$D_{Euclidean}=\\sqrt{\\sum_{i=1}^{n}(Q_i - D_i)^2}\\tag{1.9}$$ $$D_{Canberra}=\\\
    sum_{i=1}^{n}\\frac{|Q_i - D_i|}{|Q_i|+|D_i|}\\tag{1.10}$$ $$D_{City\\ block}=\\\
    sum_{i=1}^{n}|Q_i - D_i|\\tag{1.11}$$ $$D_{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(Q_i\
    \ - D_i)^2\\tag{1.12}$$\n\n### 1.3.2 Random Forest Classifier\n\nIt is a classifier\
    \ which acts on the principle of ensemble learning. It builds a number of decision\
    \ trees during the time of training and the output class is determined by the\
    \ mode of the classes it learns during the supervised procedure.\n\nRandom Forest\
    \ Classifier has a number of advantages that have made it a popular choice for\
    \ the classification task. It can proficiently manage large datasets by handling\
    \ thousands of input variables. It refrains from variable deletions and approximates\
    \ the significance of a variable for classification. It efficiently estimates\
    \ missing data to maintain classification accuracy. The forest generated during\
    \ the classification process can be saved for future use on different datasets.\n\
    \n### 1.3.3 ANN Classifier\n\nComplex pattern recognition is carried out with\
    \ the Artificial Neural Network (ANN) Classifier, which is a mixture of simple\
    \ processing units. Enhanced noise tolerance level and properties of self-adaptation\
    \ have made ANN classifier proficient for real-time applications. A category of\
    \ feed forward artificial neural network named multilayer perceptron (MLP) is\
    \ used in this work, which has implemented back propagation for supervised classification.\
    \ Classification performance is optimized by training the network using feed forward\
    \ technique. A predefined error function is computed by comparing the predicted\
    \ values with the correct answers. Weight adjustment of each connection is done\
    \ henceforth by feeding the errors to the network to reduce the error values.\
    \ The overall error is reduced in this way by executing the process repeatedly\
    \ for a large number of training cycles. The predefined error function is calculated\
    \ by using the back propagation function with known or desired output for each\
    \ input value. An MLP framework is comprised of input nodes, output nodes and\
    \ hidden nodes. The number of input nodes is determined based on the summation\
    \ of the number of attributes in the feature vector and the bias node. Output\
    \ nodes are equal to the number of class labels. The hidden nodes are structured\
    \ based on a predefined value. Multiple layers in the classification framework\
    \ have the output flow toward the output layer, as in Fig. 1.1. The MLP shown\
    \ in Fig. 1.1 has two inputs and a bias input with weights 3, 2, and −6 respectively.\
    \ The activation function f4 applied to value S is given by S = 3x1 + 2x2 − 6.\n\
    \nUnipolar step function is used to calculate the value of f4 given in equation\
    \ 1.13. It has used an output of 1 to classify into one class and an output of\
    \ 0 to pass in the other class.\n\nf4 = { 1 if S > 0\n 0 otherwise } (1.13)\n\n\
    An alternative representation of the values of 3, 2, and −6 as respective weights\
    \ of three different inputs for the perceptron is shown in Fig. 1.2.\n\nThe horizontal\
    \ and vertical axis is denoted by x1 and x2 respectively. The intercepting coordinates\
    \ of the straight line to the vertical and the horizontal axes are the weights.\
    \ Two classes are categorized by the area of the plane on the left and the right\
    \ side of the line x2 = 3 − 3/2x1.\n"
  mdcn: "\n基于内容的图像分类被认为是处理这些难题的一种值得关注的技术。它被证明能够基于图像数据的内容而非表面化的标注来有效识别图像数据。\n\n图像标注通过使用文本关键词标记图像内容来完成。该操作需要大量人工干预才能手动执行。此外，在通过手动文本录入程序标记海量图像数据集时，错误标注的概率很高。描述图像内容的文本标签的质量取决于标注者的词汇量。因此，同一幅图像可能因负责标注的人员词汇不同而产生不同的描述，这反过来又破坏了整个流程的一致性[8]。\n\
    \n相反，从图像数据的固有像素中提取特征向量，消除了手动标注带来的挑战，并以最少的人工干预实现了识别过程的自动化[9]。当今社会普遍流行拍摄未知类型事件和物体的图像。基于内容的图像识别过程可以借助已有的训练知识，轻松地将拍摄到的图像分类到已知类别中。这反过来又有助于根据各种商业用途对图像数据进行进一步处理的决策。\n\
    \n快速性并不是影响基于内容的图像分类效率的唯一决定性因素。分类结果的准确性对分类基础设施的成功与否贡献巨大。因此，要确保基于内容的图像分类的能力，必须找到一种有效的特征提取技术。提取的特征对于决定将图像数据分类到相应标签的成功率至关重要。\n\
    \n因此，本文讨论了不同的特征提取技术，通过提取的特征对图像进行全局和局部表示。与全局方法相反，局部方法对图像的分割区域进行特征提取。然而，图像数据包含丰富的特征集，单一特征提取技术很少能够充分处理这些特征。因此，人们探索了特征融合技术，以评估分类结果并提高准确性。\n\
    \n实验在四个广泛使用的公开数据集上进行，使用四种不同的分类器来评估提取特征的鲁棒性。采用精确率（Precision）、召回率（Recall）、误分类率（MR）和F1分数等多种指标来比较分类结果。下一节将对所用每种指标进行简要说明，随后介绍分类器和数据集。\n\
    \n## 1.2 指标\n\n为衡量不同特征提取技术的分类性能，我们使用了多种参数[10]。以下对各参数进行简要说明。\n\n### 1.2.1 精确率（Precision）\n\
    \n精确率（Precision）定义为被分类实例中正确分类的比例，如公式1.1所示。\n\n$$Precision = \\frac{TP}{TP + FP}\
    \ \\tag{1.1}$$\n\n### 1.2.2 真正例率（TP Rate）/召回率（Recall）\n\n召回率（Recall）定义为相关实例总数中被正确分类的比例，如公式1.2所示。\n\
    \n$$TP\\ Rate/Recall = \\frac{TP}{TP + FN} \\tag{1.2}$$\n\n### 1.2.3 误分类率（MR）\n\
    \n误分类率（Misclassification Rate，MR）定义为错误分类实例的比例，表示分类器的错误率，如公式1.3所示。\n\n$$MR = \\\
    frac{FP + FN}{TP + TN + FP + FN} \\tag{1.3}$$\n\n### 1.2.4 F1分数\n\n精确率和召回率（TP\
    \ Rate）的加权平均值即分类的F1分数，如公式1.4所示。\n\n$$F1\\ Score = \\frac{2 * Precision * Recall}{Precision\
    \ + Recall} \\tag{1.4}$$\n\n### 1.2.5 准确率\n\n分类器的准确率通过分类器正确识别实例的识别率来衡量，如公式1.5所示。\n\
    \n$Accuracy = \\frac{TP + TN}{TP + TN + FP + FN}$ (1.5)\n\n### 1.2.6 假正例率（FP Rate）\n\
    \n这是分类器将不正确结果分类为正例的比例，如公式1.6所示。\n\n$FP Rate = \\frac{FP}{FP + TN}$ (1.6)\n\n###\
    \ 1.2.7 真负例率（TN Rate）\n\n该指标是负例实例中被正确判定为负例结果的比例，如公式1.7所示。\n\n$TN Rate = \\frac{TN}{TN\
    \ + FP}$ (1.7)\n\n### 1.2.8 假负例率（FN Rate）\n\n该指标给出了被分类器分类为负例结果的正例结果比例，如公式1.8所示。\n\
    \n$FN Rate = \\frac{FN}{TP + FN}$ (1.8)\n\n## 1.3 分类器\n\n我们实现了多种特征提取技术，以评估在不同分类器环境下的分类性能。这样做是为了检验相应特征提取技术应用于不同数据集时的一致性。为此，我们考虑了四种不同类型的分类器，即K近邻（KNN）分类器、涟漪规则（RIDOR）分类器、人工神经网络（ANN）分类器和支持向量机（SVM）分类器。下文对各个分类器的工作流程进行了简要说明[10]。\n\
    \n### 1.3.1 KNN分类器\n\nK近邻（KNN）分类器的最高错误率是贝叶斯错误率的两倍，而贝叶斯错误率被认为是基于实例的分类器可能达到的最小错误率。因此，它被视为用于评估目的的分类器之一。它通过识别未知实例在实例空间中的最近邻来对其进行分类，并将该最近邻的类别赋予未知实例。\n\
    \n四种不同相似度度量（即欧氏距离、堪培拉距离、城市街区距离和均方误差）的计算公式如公式1.9-1.12所示。这些相似度度量用于在实例分类过程中找出最近邻。\n\
    \n$$D_{Euclidean}=\\sqrt{\\sum_{i=1}^{n}(Q_i - D_i)^2}\\tag{1.9}$$ $$D_{Canberra}=\\\
    sum_{i=1}^{n}\\frac{|Q_i - D_i|}{|Q_i|+|D_i|}\\tag{1.10}$$ $$D_{City\\ block}=\\\
    sum_{i=1}^{n}|Q_i - D_i|\\tag{1.11}$$ $$D_{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(Q_i\
    \ - D_i)^2\\tag{1.12}$$\n\n### 1.3.2 随机森林分类器\n\n随机森林分类器是一种基于集成学习原理的分类器。它在训练期间构建大量决策树，输出类别由其在监督过程中学习到的类别的众数决定。\n\
    \n随机森林分类器具有诸多优点，因此成为分类任务中的常用选择。它能够处理数千个输入变量，从而高效地管理大型数据集。它可以避免变量删除，并近似估计变量对分类的重要性。它能有效估计缺失数据以保持分类准确性。分类过程中生成的森林可以保存下来，用于之后的不同数据集。\n\
    \n### 1.3.3 ANN分类器\n\n人工神经网络（ANN）分类器由简单处理单元混合而成，用于执行复杂的模式识别。增强的噪声容忍水平和自适应特性使ANN分类器非常适合实时应用。本文使用了一种名为多层感知器（MLP）的前馈人工神经网络，该网络实现了用于监督分类的反向传播。通过使用前馈技术训练网络来优化分类性能。通过将预测值与正确答案进行比较来计算预定义的误差函数。随后，通过将误差反馈给网络来调整每个连接的权重，以减小误差值。通过大量训练周期的重复执行，整体误差以这种方式降低。预定义误差函数是通过反向传播函数对每个输入值使用已知或期望输出来计算的。MLP框架由输入节点、输出节点和隐藏节点组成。输入节点的数量根据特征向量中的属性数量与偏置节点之和确定。输出节点数等于类标签数。隐藏节点根据预定义值进行构建。如图1.1所示，分类框架中的多层结构将输出流向输出层。图1.1所示的MLP有两个输入和一个权重分别为3、2和−6的偏置输入。应用于值S的激活函数f4由\
    \ S = 3x1 + 2x2 − 6 给出。\n\n使用单极性阶跃函数计算公式1.13中给出的f4值。它使用输出1将一个样本归入一类，使用输出0将其归入另一类。\n\
    \nf4 = { 1 if S > 0\n 0 otherwise } (1.13)\n\n图1.2展示了感知器三个不同输入的权重分别为3、2和−6的另一种表示形式。\n\
    \n水平轴和垂直轴分别用x1和x2表示。直线与垂直轴和水平轴的交点坐标即为权重。直线 x2 = 3 − 3/2x1 左右两侧的平面区域分别对应两个类别的分类结果。\n"
