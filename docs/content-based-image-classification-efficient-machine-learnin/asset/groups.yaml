    \ the output image. This chapter introduces two different techniques of feature\
    \ extraction using morphological operators—namely, top-hat transform and bottom-hat\
    \ transform. The two techniques are implemented based on the block truncation\
    \ coding (BTC) approach. The descriptors are generated by calculating the mean\
    \ of the separated foreground and the background pixels by applying morphological\
    \ operator. The size of feature vectors for each color component is 2. Thus, for\
    \ three color components, the size of feature vector is (3 × 2) = 6, which is\
    \ obtained by applying morphological operators for feature extraction. An illustration\
    \ is provided in Fig. 6.1.\n\n$$\nx_{loF.V.}=\\left(\\left(\\frac{1}{m\\ast n}\\\
    ast\\sum_{i=1}^{m}\\sum_{j=1}^{n}x_{lo}(i,j)\\right)+\\left(\\sqrt{\\frac{1}{m\\\
    ast n}\\sum_{i=1}^{m}\\sum_{j=1}^{n}\\left(x_{lo}(i,j)-\\mu_{lo}\\right)^2}\\\
    right)\\right)\n\\tag{6.2}\n$$\n\nwhere, $\\mu=\\left(\\frac{1}{m\\ast n}\\ast\\\
    sum_{i=1}^{m}\\sum_{j=1}^{n}x(i,j)\\right)$ and $\\sigma=\\left(\\sqrt{\\frac{1}{m\\\
    ast n}\\sum_{i=1}^{m}\\sum_{j=1}^{n}\\left(x(i,j)-\\mu\\right)^2}\\right)$  \n\
    μ = mean  \nσ = standard deviation  \nx = R, G and B for individual components,\
    \ T_x = threshold value for each pixel\n\n### 6.3 Code Example (MATLAB®)\n\n```matlab\n\
    % Read an image\n\ni=imread('path\\\\imagefile');\n\n% Separate the color components\n\
    \nr=i(:,:,1); % red component\n[m n p]=size(r); % dimension of red component\n\
    g=i(:,:,2); % green component\n[x y z]=size(g); % dimension of green component\n\
    b=i(:,:,3); % blue component\n[j k l]=size(b); % dimension of blue component\n\
    \n% Apply top-hat transform\n\nSE = strel('disk',12); % creating the structuring\
    \ element\nBWr = imtophat(r,SE); % r = red component\n```\n\n### 6.4 Coding Exercise\n\
    \n*The previous code example applied top-hat transform on the red component of\
    \ an image. Refer to the example to complete the following assignments:*\n\n-\
    \ Apply top-hat transform on Green and Blue color components.\n- Extract features\
    \ from separated background and foreground obtained after applying transform.\n"
