    the existing technique, as shown in Fig. 5.12.


    The illustration shown in Fig. 5.12 has clearly established that the proposed
    technique of feature extraction with partial DCT coefficients has consumed much
    less time compared to the benchmarked technique [5–8].


    ## 5.9 Statistical Significance


    A null hypothesis has been designed in *Hypothesis 5.1* to validate the statistical
    significance of performance improvement based on Precision values.


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_127_0.png)


    **FIGURE 5.9**


    Comparison of MR of Classification with Partial Coefficients of DCT, Walsh Transform,
    Kekre Transform, DST and DHT Method of Feature Extraction for All Four Datasets
    using Four Different Classifiers.


    > **[Observation:]** Lowest MR has been shown by feature extraction with partial
    DCT coefficients.


    > **HYPOTHESIS 1:** *There is no significant difference between the Precision
    values of classification result obtained by feature extraction with partial DCT
    coefficients with respect to the existing techniques.*


    A paired *t*-test is conducted in Table 5.9 to determine if the difference in
    Precision values for classification is generated from a population with zero mean.


    Initially, SD and SEM of the Precision values of classification of different categories
    for feature extraction with partial DCT coefficients has been given in Table 5.8.


    The value of *t*-calc is computed by taking the difference between two sample
    means considered for each comparison in Table 5.9. The strength of evidence against
    the null hypothesis is measured by the *p*-value.


    The *p*-values calculated have indicated significant difference in precision results
    for classification with the proposed technique of feature extraction, and the
    null hypothesis is rejected. The values of *mean*, *SD* and *SEM* of the existing
    techniques given in Table 5.8 are further compared to that of the proposed method
    in Table 5.9. It is observed that feature extraction with the partial DCT coefficients
    method has a higher *mean* of Precision values for classification with less *SD*
    and *SEM* compared to all the existing techniques. Hence, it can be concluded
    that the proposed method has not only shown higher Precision values, but also
    has consistent performance because it has less *SD* and *SEM* compared to the
    existing techniques.


    **Comparison of F1 Score**


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_128_0.png)


    **FIGURE 5.10**


    Comparison of F1-Score of Classification with Partial Coefficients of DCT, Walsh
    Transform, Kekre Transform, DST and DHT Method of Feature Extraction for All Four
    Datasets using Four Different Classifiers.


    > [Observation: Highest classification performance has been shown by feature extraction
    with partial DCT coefficients.]


    Therefore, the feature extraction technique with 0.012% of DCT coefficients has
    contributed significantly in boosting up the classification performance.


    The *t-test* is performed with four different comparisons; a *post-hoc analysis*
    is necessary to accept the significance of the derived results using the *Bonferroni
    Correction*. The value of α is considered to be 0.05 for the *t-test*. The following
    expression calculates the *Bonferroni correction* value:


    $$\mathrm{Bonferroni}_{\alpha}=\frac{\alpha}{\mathrm{Number\_of\_tests}}$$

