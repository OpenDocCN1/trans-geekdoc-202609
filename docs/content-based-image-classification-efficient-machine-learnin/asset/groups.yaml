    \ 数据集、Corel 数据集和 Caltech 数据集。为了应用矢量量化创建作为特征向量的码本，从测试图像中提取了红色 (R)、绿色 (G) 和蓝色 (B)\
    \ 等颜色分量。通过矢量量化将 *k* 维欧几里得空间映射到有限子集。码本的表示由有限集 *CB* 完成，如公式 7.1 所示。\n\n$$CB = \\\
    {C_i \\mid i = 1, 2, \\ldots, N\\}$$\n\n(7.1)\n\n其中 Ci = (ci1, ci2, ...., cik)\
    \ 是码向量，N 是码本的大小。\n\n遵循 Linde-Buzo-Gray (LBG) 算法生成码向量。首先，将图像划分为不重叠的块并转换为训练向量 Xi\
    \ = (xi1, xi2, ... , xik)。训练集中每个训练向量的维度固定为 12。训练向量由 2 × 2 相邻像素的红色、绿色和蓝色分量组成。从此，整个训练集的质心被计算为第一个码向量。此外，通过在质心上加减常数误差生成两个试验码向量\
    \ v1 和 v2。计算每个训练向量与试验向量的接近程度，并根据训练向量与 v1 和 v2 的接近程度形成两个聚类，如图 7.2 所示。\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_151_0.png)\n\
    \n**图 7.2**  \nLinde-Buzo-Gray (LBG) 算法的实现。\n\n这通过从两个新形成的聚类中计算两个质心来创建大小为 2 的码本，从而产生两个码向量。上述过程使用质心重复以生成所需的码本大小，本例中为\
