    # 3.6 Feature Extraction Using Sorted Block Truncation Coding for Content-Based
    Image Classification


    Image processing algorithms have considered noise extending adverse influence
    on image data by staining it to a large extent. The fact is evident in plenty
    of literature that has introduced varied noise elimination techniques to decrease
    the effect of noise over image data. One of the popular techniques is the binning
    method, which is extensively implemented for smoothing sorted values of data in
    a dataset [8]. A stepwise functionality of binning method to sort the values in
    a dataset follows:


    +   - The sorted values are divided in bins.

    +   - Average of the sorted values are computed by considering the neighboring
    values to perform local smoothing for each of the bins. The local smoothing is
    crucial for noise removal.

    +   - The corresponding average value for a particular bin is instrumental in
    replacing each value present in the bin.'
  md: '

    (B)—as blocks from the images. Henceforth, the computation of color clumps for
    feature extraction is carried out with the Wang dataset in RGB color space.


    A step-by-step guide for feature extraction using color clumps follows:


    - Color clump calculation initiates with approximation of gray values for individual
    color components to form disjoint subsets of gray values for the corresponding
    components.

    - Next is the logical partition formation of the intensity values into numerous
    subdivisions of color clumps, which involves several stages of color bin formation
    for each R, G and B color component.

    - Increase in number of partitions is formulated in multiples of 2 as described
    in Fig. 3.4.

    - The partitions are evaluated in the range of 2 to 32 to identify the suitable
    number of clumps for feature vector extraction.

    - Each of the five stages of feature extraction is named as BTC with 2 color clumps,
    BTC with 4 color clumps, BTC with 8 color clumps, BTC with 16 color clumps and
    BTC with 32 color clumps respectively.

    - All the gray values of a particular partition are compared to that of the mean
    of the gray values for the corresponding partition for each color clump.

    - The process eventually creates two different intensity groups having values
    greater than the mean threshold and lesser than the mean threshold respectively.

    - The mean upper intensity and mean lower intensity values for the corresponding
    clumps are calculated.


    Thus, one can compute two different feature values of higher and lower intensities
    from a particular clump. This makes the number of feature vectors double the number
    of the color clumps selected (Fig. 3.2).


