    \n$$Xupmean = \\frac{1}{\\sum_{i=1}^{m}\\sum_{j=1}^{n} BitMap_x(i,j)} \\ast \\\
    sum_{i=1}^{m}\\sum_{j=1}^{n} BitMap_x(i,j) \\ast X(i,j)$$\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_82_0.png)\n\
