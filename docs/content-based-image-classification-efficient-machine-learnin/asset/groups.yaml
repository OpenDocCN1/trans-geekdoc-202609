  mdcn: "\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_169_0.png)\n\n**图8.5** 部分DCT系数的提取。\n\
    \n测试图像。此外，通过捕获变换图像左上角的高能量系数来降低维度。因此，在第二步中，特征向量被降至50%，该过程持续进行，直至降到原始特征维度的0.06%。在降维的每一步中，测量F1分数和误分类率（MR），以观察使用提取的特征维度的分类结果。观察到F1分数提高和MR降低，直到0.012%。此后，如表8.1所示，F1分数下降，MR增加。因此，为特征向量选择的变换系数比例为0.012%，其维度为24。\n\
    \n## 8.5 分类框架\n\n### 8.5.1 方法1\n\n最初，使用欧氏距离度量（如公式8.8所示）分别对两种不同的特征提取技术进行分类结果评估。\n\
    \n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_171_0.png)\n\n**图8.6** 后期融合框架。\n\n\
    $D_{cityblock}=\\sum_{i=1}^{n}|Q_i-D_i|$ (8.9)\n\n融合模型应用了如公式8.10所示的z分数归一化，用于将两种不同距离度量计算出的距离归一化为分数组合值。该组合值进一步用于判断该技术的分类准确性。\n\
    \n$$dist_x = \\frac{dist_x - \\mu}{\\sigma} \\tag{8.10}$$\n\n最终距离使用如公式8.11所示的归一化距离的加权和来计算。\n\
    \n$$dist = w_1 d_n^{binarization} + w_2 d_n^{morphological} \\tag{8.11}$$\n\n\
    考虑使用每种特征提取技术进行分类的个体精确率来计算权重。归一化过程有效地避免了分类决策依赖于可能对分类决策产生较大影响的高值特征向量属性。\n\n### 8.5.2\
    \ 方法2\n\n融合也可以在特征提取的早期阶段进行，这被称为早期融合技术。该技术通过使用特征缩放技术进行特征值归一化来实现，如图8.7所示。特征缩放被称为最小-最大归一化，其中使用公式8.12对通过两种不同特征提取技术提取的特征向量值进行归一化。为了评估目的而使用Wang数据集，以便可以在相同的测试图像数据下进行性能比较。\n\
    \n$$dist_x = \\frac{dist_x - \\min\\ value}{\\max\\ value - \\min\\ value} \\\
    tag{8.12}$$\n\n使用二值化技术提取的归一化特征值和部分变换系数相互关联，形成融合特征向量。使用二值化技术和部分变换系数提取的特征向量的维度分别为12和24。因此，每个测试图像的融合特征向量的维度变为(12\
    \ + 24) = 36。\n\n融合特征被提供给四个不同的分类器作为输入，即K最近邻（KNN）、随机森林（RF）、支持向量机（SVM）和多层感知器（MLP）。\n\
    \n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_173_0.png)\n\n**图8.7** 早期融合框架。\n\n\
    基于融合的基于内容的图像识别技术。为了确保高精度的基于内容的图像分类，保留基本特征成分的有效特征降维是不可避免的。\n\n## 本章小结\n\n传统的图像分类技术基于单一特征提取技术。然而，图像中丰富的特征集很难通过单一特征提取方法来探索。本章提出了一种基于决策融合（后期融合）的分类技术，通过z分数归一化实现。该技术在进行最终分类结果确定之前，融合了各个特征提取技术的分类决策。本章还提出了一种通过特征缩放实现的特征融合（早期融合）技术。所引入的融合技术优于使用单一特征提取技术所获得的分类结果。比较融合技术后发现，使用分类决策的后期融合具有更高的分类精度。\n\
    \n## 参考文献\n\n- Thepade, S., Das, R. and Ghosh, S., 2017. Decision fusion-based\
    \ approach for content-based image classification. *International Journal of Intelligent\
    \ Computing and Cybernetics*, 10(3): 310–331.\n- Das, R., Thepade, S. and Ghosh,\
    \ S., 2016. Framework for content-based image identification with standardized\
    \ multiview features. *ETRI Journal*, 38(1): 174–184.\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_179_0.png)\n\
    \n**图9.2** 卷积操作。\n\n## 9.3 代码示例（MATLAB®）\n\n```matlab\n% Loading Image Dataset\n\
    unzip('MerchData.zip');\nimds = imageDatastore('MerchData','IncludeSubfolders',true,'LabelSource','foldernames');\n\
    [imdsTrain,imdsTest] = splitEachLabel(imds,0.7,'randomized');\nnumTrainImages\
    \ = numel(imdsTrain.Labels);\nidx = randperm(numTrainImages,16);\nfigure\nfor\
    \ i = 1:16\n    subplot(4,4,i)\n    I = readimage(imdsTrain,idx(i));\n    imshow(I)\n\
    end\n\n% Load Pretrained Network\nnet = resnet18;\ninputSize = net.Layers(1).InputSize;\n\
    analyzeNetwork(net)\n\n% Extract Image Features\naugimdsTrain = augmentedImageDatastore(inputSize(1:2),imdsTrain);\n\
    augimdsTest = augmentedImageDatastore(inputSize(1:2),imdsTest);\nlayer = 'pool5';\n\
    ```\n\n与阈值相比。高于阈值的值聚类在高强度组中，低于阈值的值聚类在低强度组中。由此形成的两个聚类的均值被认为是相应色团的平均高强度和平均低强度。因此，特征向量的数量是所形成的颜色团数的两倍，并且与图像大小无关。\n\
    \n## 9.5 二值化技术\n\n可以实现两种不同的阈值选择方法，基于二值化技术提取特征向量：均值阈值选择和局部阈值选择。\n\n采用均值阈值选择的二值化方法计算图像中每个颜色分量（红色（R）、绿色（G）或蓝色（B））的阈值。然后在RGB颜色空间中为每个颜色分量计算二进制位图。对于大于或等于阈值的像素值赋值为1，否则赋值为0。计算位图值后，为每个颜色分量导出两个平均颜色。上平均色是大于或等于相应阈值的像素值的平均值，而下平均色由低于阈值的像素值的平均值导出。第4章提出了四种通过使用均值阈值选择的二值化进行特征提取的技术，分别是：多级均值阈值特征提取、使用均值阈值选择的有效位平面特征提取、使用均值阈值选择的奇偶图像种类特征提取，以及使用均值阈值选择的静态和动态三元图像图特征提取。\n\
    \n使用局部阈值选择进行二值化的特征提取通过Niblack局部阈值选择或Sauvola局部阈值选择完成。对于使用局部阈值选择进行的二值化过程，保持一个m ×\
    \ n维的局部窗口。该方法通过在各个颜色分量上滑动矩形窗口来计算每个像素的阈值。图像可能存在不均匀照明，因此使用矩形窗口在局部进行二值化处理。\n\n对使用均值阈值选择和局部阈值选择的二值化特征提取技术进行了分类性能比较。通过使用Sauvola局部阈值选择的二值化特征提取在精确率、召回率和F1分数方面优于所有其他技术，并显示出最小的误分类率（MR）。该技术在分类性能上也超越了现有的特征提取技术。\n\
    \n"
