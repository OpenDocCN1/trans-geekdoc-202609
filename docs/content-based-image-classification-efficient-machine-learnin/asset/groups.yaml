    ## 3 基于内容的特征提取：颜色平均


    ### 3.1 前言


    任何图像的一个重要主要属性是其颜色，可用于为基于内容的图像分类生成有意义的特征。关于提出各种用于生成具有颜色特征的鲁棒描述符的技术，已有丰富的文献。一种流行的算法——颜色差分直方图（CDH），通过直观地计算具有不同背景的两个点之间的一致颜色差异来提取颜色特征
    [1,2]。


    利用颜色相关图通过联合概率来表述颜色在图像索引和识别中的有效性 [3]。颜色分布被认为是近期文献中用于促进基于内容图像识别的通用图像特征 [4]。设计描述符的另一种有效技术是颜色直方图，该技术在近期研究中已得到大量研究和实现
    [5,6]。


    颜色矩（CM）也显示出作为鲁棒特征向量在提高基于内容图像分类精度方面的显著性能 [5]。


    最先进的利用颜色特征提取特征向量的技术推动了提出和实现两种利用图像颜色特征提取特征向量的新颖技术。以下技术已探索颜色特征以生成基于内容图像分类的有意义描述符。


    - 具有颜色团块的块截断编码（BTC）

    - 用于基于内容图像分类的排序块截断编码（SBTC）


    在详细阐述这两种技术的算法之前，以下部分简要讨论块截断编码的概念。


    ### 3.2 块截断编码


    块截断编码（BTC）是由于其实现简单而被广泛接受的压缩算法之一。该算法的工作原理始于将图像分割为 n × n（通常为 4 × 4）个不重叠的块 [7]。该算法最初于
    1979 年为灰度图像开发，是图像处理诞生初期基准技术之一。该算法的流行促使开发者在后期将其扩展到彩色图像。该算法通过一次编码一个图像块来工作。对重建块的值的重新计算基于每个块的均值和标准差，这使得均值和标准差的值与原始块相似（图
    3.1）。


    ### 3.3 利用具有颜色团块的块截断编码进行特征提取


    该特征提取技术的概念以块截断编码为先导，通过区分每个颜色分量——即红色（R）、绿色（G）和蓝色


