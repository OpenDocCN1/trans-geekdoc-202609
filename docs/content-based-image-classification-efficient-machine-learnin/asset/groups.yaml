  mdcn: "\n该技术考虑图像中三个不重叠的水平区域，并从每个区域中提取每个独立颜色通道的前三个矩，形成一个包含 27 个浮点数的特征向量 [3]。有些方法被观察到在提取基于颜色的特征时考虑三个主要属性，即颜色空间、颜色空间的量化以及颜色特征的提取\
    \ [4–6]。颜色特征已探索了多种方法，如常规颜色直方图（CCH）和模糊颜色直方图（FCH） [7,8]。\n\nCCH 表示图像中每个颜色分量的出现频率。其优点是实现简单，从而降低了计算开销。一个主要缺点是其庞大的特征维度，无论颜色空间如何精细量化都保持不变。另一个发现的不足是其无法评估不同\
    \ bin 之间相似的颜色。CCH 中也没有编码颜色的空间信息。\n\n然而，在 FCH 的情况下，由于其属于所有直方图 bin，因此观察到每个 bin 的隶属程度不同。FCH\
    \ 的主要优势在于通过实现模糊集隶属函数，能够编码每个像素颜色与所有其他直方图 bin 的相似程度。已证明 FCH 在处理不同光照强度下的量化误差时具有额外的鲁棒性。\
    \ nevertheless，维度灾难被证明是其受挫的主要原因，同时伴随着模糊隶属函数的计算复杂度增加（见图 2.1）。\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_33_0.png)\n\
    \n**FIGURE 2.1**  \nRGB 颜色分量模型。\n\n### 2.3 利用图像二值化进行特征提取\n\n图像二值化方法能够恰当地将图片中所需内容与其背景分离，以便高效提取其特征。图像二值化方法已全面实现了适当阈值的选择，以区分图像中感兴趣区域与其背景。近年来，研究人员提出了许多利用阈值选择提取二值化特征的技术\
    \ [9–11]。二值化技术也被发现有助于进行图像描述符定义，如现有文献所述 [12–19]。然而，大多数提出的 methodology 被观察到是在受控环境中进行评估，这些环境利用高端图像采集设备提供的专业质量图像进行处理。相反，现实场景中的图像采集可能受到多种因素的影响，包括低光条件、不均匀照明等\
    \ [20]。在这种情况下，适当的阈值选择技术变得至关重要，以便在这些图片中将前景物体与背景分开识别。二值化技术中阈值选择的关键挑战受光照变化和噪声支配 [21]。物体和背景中存在的灰度级方差、对比度不足等会不利地影响二值化阈值的计算\
    \ [22]。阈值的选择至关重要，因为错误的阈值可能会将背景像素误判为前景，反之亦然。阈值选择过程主要分为三类，即均值阈值选择、全局阈值选择和局部阈值选择。多种均值阈值选择技术被有效制定用于提取\
    \ CBIR 的重要图像描述符 [23,24]。但是，均值阈值选择技术没有考虑图像中灰度级值分布的标准差。图像方差作为图像阈值选择的一个组成部分，已通过传统的\
    \ Otsu 全局阈值选择方法进行探索 [25,26]。基于熵的阈值选择技术被建议用于提取鲁棒描述符 [27]。用于创建二值图像的自适应阈值选择还将图像对比度作为参数，同时考虑像素值的方差和均值（图\
    \ 2.2）。自适应阈值选择成功执行的典型例子是 Niblack 算法，用于人手指静脉图像的自适应阈值选择 [28]。\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_34_0.png)\n\
    \n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_34_1.png)\n\n**FIGURE 2.2**  \n图像二值化过程。\n\
    \nSauvola 自适应阈值选择算法被认为是对 Niblack 技术的一种改进，因其在光学字符识别领域的效率 [29]。Bernsen 的局部阈值选择方法解决了快速响应（QR）图像的不均匀照明问题\
    \ [30,31]。在 [32] 中，最优阈值是通过误差方法计算的。\n\n### 2.4 利用图像变换进行特征提取\n\n图像变换利用图像元素的域的转换，从而将图像表示为能量谱的集合。通过将图像外推到一系列基函数来创建基图像\
    \ [33]。基图像是通过正交酉矩阵生成的，其形式为图像变换算子。将图像从当前表示转换为另一种表示具有两种不同的好处：\n\n- a. 利用图像变换可以将图像扩展为波形序列。变换过程也有助于区分图像模式的关键组成部分。\n\
    - b. 信息可以以紧凑的方式存储在变换后的图像数据中，从而提高过程的效率和实用性。\n\n上述图像变换的特性支持使用多种变换技术从图像中提取的描述符维度的彻底降低，例如离散余弦变换、哈特利变换等。因此，研究人员提出了不同的\n\
    \n其通过梯度和形态学算子提取为边缘。通过应用梯度算子，只能确定一个方向（水平、垂直或对角线）的边缘，该算子仅提供一阶导数 [33]。斜率幅度方法与梯度算子一起使用\
    \ [51]，通过创建连接边缘的轮廓来定义图像中形状的完整外部边缘。随着时间的推移，由于独特的建模限制，形状的局部描述符 [52–54] 比全局描述符 [55]\
    \ 更受重视。通过离散曲线演化表示形状有助于简化轮廓，以消除噪声和无关的形状属性 [56]。一种新的形状描述符，即形状上下文，被多个几何变换认可为一种令人信服的紧凑且鲁棒的特征提取手段\
    \ [57]。通过用一组线段或标记表示曲线，为特征表示（曲率和方向）[58] 排列了一个度量树 [53]。通过将形状近似为凹段和凸段的序列来实现形状匹配的目的\
    \ [54]。对形态学轮廓（MP）的研究是利用部分重建和方向性 MP 来对城市高分辨率高光谱图像进行分类 [59]。从图像中提取傅里叶描述符、不变矩和泽尼克矩等形状特征，有助于医学\
