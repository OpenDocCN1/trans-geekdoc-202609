    \ and N is the size of the codebook.\n\nThe Linde-Buzo-Gray (LBG) algorithm is\
    \ followed for generation of code vectors. Primarily, the images are divided into\
    \ nonoverlapping blocks and are converted to training vector Xi = (xi1, xi2, ...\
    \ , xik). A dimension of 12 is fixed for each training vector in the training\
    \ set. The training vector is comprised of red, green and blue components of 2\
    \ × 2 neighboring pixels. Henceforth, the centroid of the entire training set\
    \ is calculated as the first code vector. In addition, two trial code vectors\
    \ v1 and v2 are generated by adding and subtracting the constant error to the\
