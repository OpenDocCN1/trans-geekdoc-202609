    \ 3 级具有最低的 MR 和最高的 F1 分数。]\n\n规则（RIDOR）、人工神经网络（ANN）和支持向量机（SVM）——用于 BTC 第 3 级，使用均值阈值选择在四个不同的公共数据集上进行特征提取。分类性能的比较见表\
