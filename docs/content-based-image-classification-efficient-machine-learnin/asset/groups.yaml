    \ to fine-tune the performance of systems implementing content-based image classification.\
    \ Moreover, the implementation overhead itself is a challenge for experimentation\
    \ purpose with content-based image data.\n\nThis book readily addresses these\
    \ shortcomings of the trending approaches and fully presents the basics of deep\
    \ learning based approaches.\n\nPrimarily, the book covers various techniques\
    \ of image processing including implementation of image binarization, image transforms,\
    \ texture analysis and morphological approach. It explains the significance of\
    \ all these techniques for robust feature extraction from image contents. Further,\
    \ it demonstrates the process of content-based image identification with these\
    \ features using popular machine learning algorithms. Finally, it also covers\
    \ applications of deep learning techniques for feature extraction using representation\
    \ learning. Hence, the book is an enabler toward domain expertise of the reader\
    \ with a blend of application orientation with deep learning techniques.\n\nI\
    \ am sure the book will be a true companion to students, research scholars and\
    \ industry professionals who wish to pursue a career in machine learning with\
    \ content-based image data. It is helpful to spawn research ideas for PhD aspirants.\
    \ It also provides the methodologies to design lightweight applications for identification\
    \ using image contents.\n\nFinally, I express my reverence to Almighty and love\
    \ to my parents, wife and children for their continuous support and inspiration\
    \ toward my work and experimentations. I express my gratitude toward my PhD supervisors,\
    \ teachers, and collaborators from industry and academia, as well as my students\
    \ and my colleagues for their encouragement and belief in my propositions.\n\n\
