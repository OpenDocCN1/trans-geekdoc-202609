    本章讨论两种不同的形态学特征提取技术，即顶帽变换和底帽变换。使用四种不同的分类器在四个不同的公共数据集上测试了这些技术的分类结果，结果见表 6.1 和表 6.2。图
    6.4–6.7 分别基于精确率、召回率、误分类率和 F1 分数，对所有四个数据集和分类器比较了这两种技术。


