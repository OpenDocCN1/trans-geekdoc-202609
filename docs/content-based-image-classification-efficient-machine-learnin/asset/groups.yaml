    颜色矩和 Gabor 滤波器响应的矩被考虑用于从颜色和纹理中提取局部描述符。形状信息以边缘图像的形式使用梯度矢量流场提取出来。形状特征最终由不变矩表示。内容基于图像识别决策和所有这些单独特征被融合以增强检索性能
    [107]。基于颜色直方图的特征向量和基于共生矩阵的纹理特征是从色调、饱和度、值 (HSV) 颜色空间中提取用于基于内容的图像识别 [108]。模糊集合论方法被实施以从图像中选择视觉显著的点特征。这些点用于计算一些不变颜色特征以计算图像之间的相似性
    [109]。将颜色布局描述符和 Gabor 纹理描述符作为图像签名进行融合已显示出增加的图像识别结果 [110]。包含颜色、纹理和空间结构描述符的多技术特征提取导致了增强的识别率
    [49]。形成图像识别的神经网络架构，以使用小波包和 Gabor 滤波器的特征值作为特征向量来评估图像的基于内容的相似性匹配 [111]。从图像中提取类内和类间特征已将改进的识别结果纳入图像数据
