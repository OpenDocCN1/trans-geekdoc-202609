    ## 4.18 Statistical Significance


    This chapter demonstrated a test to establish statistical significance of the
    enhanced classification results recorded with the proposed technique. The test
    computed the *p*-values of the existing techniques with respect to the proposed
    technique. The *t*-test revealed the actual difference between two means corresponding
    to the variation in the data of the proposed technique and the existing techniques.
    The test was carried out by designing a null hypothesis to authenticate the statistical
    significance of performance enhancement based on Precision values.


    **HYPOTHESIS 4.1:** *There is no difference between the Precision values of classification
    result obtained by feature extraction using Sauvola’s local threshold selection
    with respect to the existing techniques.*


    The values of *mean*, *standard deviation (SD)* and *standard error of the mean
    (SEM)* of the Precision values of classification of different categories for feature
    extraction using BTC with color clumps are given in Table 4.7.


    **TABLE 4.8: *t*-test for Evaluating Significance of Feature Extraction with Sauvola’s
    Local Threshold Selection**


    | Comparison | Mean | Standard Deviation (SD) | Standard Error of the Mean (SEM)
    | *t*-calc | *p*-Value | Significance |

    |---|---:|---:|---:|---:|---:|---|

