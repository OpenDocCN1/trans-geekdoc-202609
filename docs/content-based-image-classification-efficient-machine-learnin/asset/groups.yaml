    \ and standard deviation of all the parameters, namely, energy, contrast, entropy\
    \ and correlation, are considered to compute the feature vector for each image.\
    \ This generates a feature size of 8 for each image which is independent of the\
    \ image dimension and has a considerably smaller footprint.\n\n### 7.2 Feature\
    \ Extraction by Vector Quantization Codebook Representation Using Linde-Buzo-Gray\
    \ (LBG) Algorithm\n\nThe statistical color distribution of an image has been described\
    \ by the vector quantization (VQ) codebook [1]. The technique is applied on four\
    \ different public datasets for feature extraction from the test images. The datasets\
    \ are Wang dataset, OT-Scene dataset, Corel dataset and Caltech dataset. Each\
    \ of the color components, namely, red (R), green (G) and blue (B), are extracted\
    \ from the test images for applying vector quantization to create a codebook as\
    \ feature vectors. A *k* dimensional Euclidean space is mapped by means of vector\
    \ quantization into a finite subset. Representation of the codebook is done by\
    \ the finite set *CB* as in equation 7.1.\n\n$$CB = \\{C_i \\mid i = 1, 2, \\\
    ldots, N\\}$$\n\n(7.1)\n\nwhere Ci = (ci1, ci2, ...., cik) is a code vector and\
    \ N is the size of the codebook.\n\nThe Linde-Buzo-Gray (LBG) algorithm is followed\
    \ for generation of code vectors. Primarily, the images are divided into nonoverlapping\
    \ blocks and are converted to training vector Xi = (xi1, xi2, ... , xik). A dimension\
    \ of 12 is fixed for each training vector in the training set. The training vector\
    \ is comprised of red, green and blue components of 2 × 2 neighboring pixels.\
    \ Henceforth, the centroid of the entire training set is calculated as the first\
    \ code vector. In addition, two trial code vectors v1 and v2 are generated by\
    \ adding and subtracting the constant error to the centroid. The nearness of each\
    \ training vector to the trial vectors is computed, and two clusters are formed\
    \ based on proximity of the training vectors to v1 and v2 as shown in Fig. 7.2.\n\
    \n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_151_0.png)\n\n**FIGURE 7.2**  \nImplementation\
    \ of Linde-Buzo-Gray (LBG) Algorithm.\n\nThis has created a codebook of size 2\
    \ by calculating two centroids from the two newly formed clusters to produce two\
    \ code vectors. The aforesaid process is repeated with the centroids to generate\
    \ the desired size of the codebook, which is 16 in this case.\n\nThe extracted\
    \ features from the four public datasets are tested with four different classifiers,\
    \ namely, K Nearest Neighbor (KNN), Ripple-Down Rule (RIDOR), Artificial Neural\
    \ Network (ANN) and Support Vector Machine (SVM). The results are given in Table\
    \ 7.1.\n\n**TABLE 7.1**  \nClassification Performances by Feature Extraction using\
    \ Vector Quantization with Four Different Public Datasets using Four Different\
    \ Classifiers\n\n| Datasets | Metrics | KNN | RIDOR | ANN | SVM |\n|---|---|---:|---:|---:|---:|\n\
    | Wang | Precision | 0.900 | 0.900 | 0.928 | 0.888 |\n| Wang | Recall | 0.890\
    \ | 0.900 | 0.925 | 0.869 |\n| Wang | MR | 0.042 | 0.039 | 0.038 | 0.043 |\n|\
    \ Wang | F1-Score | 0.884 | 0.900 | 0.925 | 0.862 |\n| OT-Scene | Precision |\
    \ 0.923 | 0.922 | 0.937 | 0.860 |\n| OT-Scene | Recall | 0.919 | 0.922 | 0.936\
    \ | 0.860 |\n| OT-Scene | MR | 0.038 | 0.039 | 0.036 | 0.044 |\n| OT-Scene | F1-Score\
    \ | 0.923 | 0.922 | 0.937 | 0.856 |\n| Corel | Precision | 0.703 | 0.713 | 0.820\
    \ | 0.545 |\n| Corel | Recall | 0.658 | 0.668 | 0.819 | 0.499 |\n| Corel | MR\
    \ | 0.057 | 0.073 | 0.046 | 0.091 |\n| Corel | F1-Score | 0.700 | 0.660 | 0.819\
    \ | 0.468 |\n| Caltech | Precision | 0.725 | 0.781 | 0.863 | 0.714 |\n| Caltech\
    \ | Recall | 0.725 | 0.777 | 0.864 | 0.712 |\n| Caltech | MR | 0.057 | 0.053 |\
    \ 0.042 | 0.066 |\n| Caltech | F1-Score | 0.707 | 0.778 | 0.862 | 0.714 |\n\n\
    > **Observation:** All four datasets have maximum classification results with\
    \ the ANN classifier.\n\n### 7.3 Code Example (MATLAB®)\n\n```matlab\n%% Read\
    \ an Image\ni=imread('path\\imagefile');\n\n%% Separate the Color Components\n\
    r=i(:,:,1); % red component\n[m n p]=size(r); % dimension of red component\ng=i(:,:,2);\
    \ % green component\n[x y z]=size(g); % dimension of green component\nb=i(:,:,3);\
    \ % blue component\n[j k l]=size(b); % dimension of blue component\n\n%% Computing\
    \ Trial Code Vector\nThr=mean2(r);\nmeanr1=Thr+1; % Trial code vector 1 for red\
    \ component\nmeanr2=Thr-1; % Trial code vector 2 for red component\nThg=mean2(g);\n\
    meang1=Thg+1; % Trial code vector 1 for green component\nmeang2=Thg-1; % Trial\
    \ code vector 2 for green component\nThb=mean2(b);\nmeanb1=Thb+1; % Trial code\
    \ vector 1 for blue component\nmeanb2=Thb-1; % Trial code vector 2 for blue component\n\
    \n%% Sample Code for Codebook Representation from Red Component\nfor a1=1:m\n\
