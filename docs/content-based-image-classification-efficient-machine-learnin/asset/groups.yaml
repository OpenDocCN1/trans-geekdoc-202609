    \ | 0.411 | 0.338 | 0.437 | 0.349 |\n| Corel | Precision | 0.509 | 0.535 | 0.451\
    \ | 0.475 |\n|  | Recall | 0.503 | 0.542 | 0.45 | 0.48 |\n|  | MR | 0.09 | 0.084\
    \ | 0.089 | 0.087 |\n|  | F1-Score | 0.48 | 0.531 | 0.49 | 0.452 |\n| Caltech\
    \ | Precision | 0.444 | 0.49 | 0.534 | 0.432 |\n|  | Recall | 0.535 | 0.485 |\
    \ 0.576 | 0.517 |\n|  | MR | 0.091 | 0.089 | 0.078 | 0.095 |\n|  | F1-Score |\
    \ 0.447 | 0.487 | 0.543 | 0.405 |\n\n> [观察：Wang 数据集、OT-Scene 数据集和 Caltech 数据集在使用\
    \ ANN 分类器时分类率最高；Corel 数据集在使用 RIDOR 分类器时分类率最高。]\n\n此后，针对使用 DTTBTC 提取特征（表 4.4）的四个不同公开数据集，使用四种不同分类器（即\
    \ KNN、RIDOR、ANN 和 SVM）进行分类，并计算各项指标的平均值，以观察 Precision、Recall、MR 和 F1-Score。\n\n\
    ## 4.13 使用局部阈值选择的特征提取\n\n本节讨论局部阈值选择技术，包括两种流行的方法，即 Niblack 局部阈值选择和 Sauvola 局部阈值选择。\n\
    \n局部阈值选择技术应用于测试图像的位平面和原始图像。\n\n图像的亮度通常不均匀，这对为整个图像选择单一阈值造成了重大障碍。然而，一种有效的解决方案是将图像分割成\
    \ *m×n* 个分区，以便针对特定分区进行局部阈值选择。\n\n本节提到的两种局部阈值选择技术都考虑了均值和标准差来计算阈值。这处理了图像数据中灰度值的方差。\n\
    \n对于 Niblack 阈值选择，阈值的确定基于局部均值 $m(i,j)$ 和标准差 $\\sigma(i,j)$。考虑使用 (25 × 25) 的窗口大小。阈值由\
    \ $T(i,j)=m(i,j)+k\\cdot\\sigma(i,j)$ 给出。这里，$k$ 是一个取值在 0 到 1 之间的常数，在所提出的方法中取 0.6。$k$\
    \ 的值和滑动窗口的大小决定了二值化的质量。\n\nSauvola 技术是对 Niblack 局部阈值选择方法的改进，适用于背景褪色的图像。\n\n这两种技术都可以在\
    \ MATLAB 库中以 *functions()* 的形式获得。它们可以直接应用于本章提供的代码示例，用于使用局部阈值选择技术进行特征向量提取。\n\n\
    ## 4.14 代码示例（MATLAB）\n\n```matlab\n%Read an image\ni=imread('path\\\\imagefile');\n\
    \    %Separate the color components\nr=i(:,:,1); %red component\n[m n p]=size(r);\
    \ %dimension of red component\ng=i(:,:,2); %green component\n[x y z]=size(g);\
    \ %dimension of green component\nb=i(:,:,3); %blue component\n[j k l]=size(b);\
    \ %dimension of blue component\n    %Extracting bit planes (red component)\nfor\
    \ a1=1:m\nfor a2=1:n\nif bitget(uint8(r(a1,a2)),5)==1 || bitget(uint8(r(a1,a2)),6)==1\
    \ || bitget(uint8(r(a1,a2)),7)==1 || bitget(uint8(r(a1,a2)),8)==1\nrt(a1,a2,:)=r(a1,a2);\n\
    end\nend\nend\nBWr = NIBLACK(rt, [25 25], 0.6, 0, 10);\n```\n\n## 4.15 编程练习\n\n\
    前面的代码示例是使用 Niblack 技术生成局部阈值的。参考该示例完成以下任务：\n\n- 使用 Niblack 技术从绿色和蓝色颜色分量中提取特征。\n\
    - 使用 Sauvola 技术从红色、绿色和蓝色颜色分量中提取特征。\n\n这些技术的应用演示如图 4.9 和图 4.10 所示。\n\n此后，针对使用 Niblack\
    \ 和 Sauvola 局部阈值选择提取特征（表 4.5 和 4.6）的四个不同公开数据集，使用四种不同分类器（即 KNN、RIDOR、ANN 和 SVM）进行分类，并计算各项指标的平均值，以观察\
    \ Precision、Recall、MR 和 F1-Score。\n\n## 4.16 比较所讨论技术的性能评估\n\n本章讨论了六种不同的技术，使用二值化从测试图像中提取特征。这些技术的性能评估涉及四个不同的比较指标。这些指标是\
    \ Precision、Recall、MR 和 F1-Score。这些技术应用于四个不同的数据集，即 Wang 数据集、OT-Scene 数据集、Corel\
    \ 数据集和 Caltech 数据集。分类使用四种不同的分类器进行，即 KNN 分类器、RIDOR 分类器、ANN 分类器和 SVM 分类器。\n\n性能比较如图\
    \ 4.11–4.14 所示。\n\n图 4.11–4.14 所示的比较结果记录了使用 Sauvola 局部阈值选择进行二值化特征提取的最高分类性能。\n\n\
    ## 4.17 与现有技术的比较\n\n使用 Sauvola 局部阈值选择进行二值化特征提取的分类性能与基准化的技术进行比较\n\n"
