    # 5.6.5 Discrete Hartley Transform


    Discrete Hartley transform (DHT) is formed as a Fourier-related transform of discrete
    periodic data, which transforms the real inputs to real outputs while avoiding
    the elementary association of complex numbers [4]. It has acted as a linear operator
    and has been the discrete analogue of the continuous Hartley Transform. DHT has
    been a linear, invertible function $H: \mathbb{R}^n \to \mathbb{R}^n$ (where $\mathbb{R}$
    denotes the set of real numbers). Transformation of $n$ real numbers starting
    from $x_0, ..., x_{n-1}$ into $n$ real numbers $h_0, ..., h_{n-1}$ can be performed
    by equation 5.4


    $$H_k = \sum_{n=0}^{N-1} x_n \left[\cos\left(\frac{2\pi}{N}nk\right) + \sin\left(\frac{2\pi}{N}nk\right)\right]_{k=0,\ldots,N-1}
    \tag{5.4}$$


    Interpretation of the transform has been done as the multiplication of the vector
    $(x_0, ..., x_{N-1})$ by an $N \times N$ matrix; therefore, the discrete Hartley'
