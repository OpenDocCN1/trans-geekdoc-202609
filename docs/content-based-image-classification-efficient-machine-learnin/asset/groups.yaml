    \ 引言\n\n在图像中以具有某种随机性的重复结构形式出现的常见属性称为 *纹理*。重复模式的基本组成部分被指定为基本原语或 *纹素*。基本原语使用放置规则或均匀性来形成重复模式。在某些图像中，区域的定义特征对于正确分析可能很重要。在纹理分析的帮助下，可以从颜色或强度的空间排列中进行特征提取。一些直方图分布可以具有不同的纹理表示，这可以作为提取不同特征的工具。因此，纹理的存在以重复模式的形式出现，如图\
    \ 7.1 所示。\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_150_0.png)\n\n**图 7.1**\
    \  \n示例纹理模式。  \n**来源：** https://upload.wikimedia.org/wikipedia/commons/a/a9/ArtificialTexture.png\
    \ (根据知识共享许可)。\n\n强度和颜色的变化导致了纹理的形成。纹理对应于定性术语，即在物理层面上粗糙度、均匀性和平滑度。根据原语的大小，纹理分为微纹理和宏观纹理。对象的宏观纹理或粗糙度由原语的大元素定义，而微纹理由较小的纹理形成。纹理元素的方向性被称为方向性。本章介绍了两种利用图像纹理内容进行特征提取的方法，即使用\
    \ Linde-Buzo-Gray (LBG) 算法的矢量量化 (VQ) 码本表示进行特征提取，以及通过灰度共生矩阵 (GLCM) 进行特征提取。这些技术提高了基于内容图像分类的速率。在我们的方法中，我们通过使用\
    \ LBG 算法从生成的聚类中计算码向量来生成特征。这样生成的码本大小远小于图像尺寸，并用作基于内容图像分类的特征向量。在 GLCM 的情况下，计算每个图像的特征向量时考虑了所有参数即能量、对比度、熵和相关性的均值和标准差。这为每个图像生成\
    \ 8 个特征大小，该大小与图像尺寸无关，并且具有相当小的占用空间。\n\n### 7.2 使用 Linde-Buzo-Gray (LBG) 算法的矢量量化码本表示进行特征提取\n\
