    决策树因其评估属性而有所区别。后者评估多个不相交集合的平均质量，而前者仅衡量候选规则所覆盖的实例集合的质量。对于规则归纳系统而言，生成具有高可预测性或可靠性的决策规则非常重要；该属性由一个称为规则质量的函数来衡量。规则归纳和分类过程都需要诸如
    J-measure [131] 之类的规则质量度量。规则归纳已将规则质量度量作为规则设计和/或简化过程中的决定性因素。分类将规则质量值与每条规则结合，以通过待分类示例满足多条规则来解决冲突。已对若干统计和经验性的规则质量度量进行了综述
    [132]。通过可视化其评估指标，对分离与征服或覆盖式规则学习算法的性能进行了分析 [133]。RIPPER 是一种众所周知的基于规则的算法 [134]。该算法在生长规则时遵循重复的生长和修剪。生长阶段涉及准备限制性规则以最好地拟合训练数据。修剪阶段旨在使规则限制性降低以避免过拟合，从而降低对未见实例的性能。因此，基于规则的分类器的区别特征是其无歧义性。此外，专家已提出在归纳之前对特征进行离散化，以在减少训练时间的同时提高分类准确率
    [135]。通过使用用户的背景知识 [136] 或自动特征构造算法 [137] 组合特征（如决策树中所示），观察到规则学习算法的分类准确率有所提高。


    ## 2.9.3 基于感知器的技术


    ### 2.9.3.1 单层感知器


    单层感知器简要描述如下：如果输入特征值用 x₁ 到 xₙ 表示，连接权重/预测向量用 w₁ 到 wₙ 表示（通常为区间 [−1, 1] 中的实数），则感知器计算加权输入之和为
    ∑ᵢ xᵢwᵢ，并为输出维护一个可调阈值。如果总和高于阈值，则输出赋值为 1；否则为 0。从一批训练实例中，感知器算法常用的学习过程是通过训练集重复执行算法，以为整个训练集寻找合适的预测向量。测试集的标签预测由该预测规则执行。创建了一种名为
    voted-perceptron 的新算法，以在训练期间积累更多信息，从而为测试数据生成更优的预测 [138]。


    已讨论了使用类感知器线性算法处理无关特征时保持优越时间复杂度的特性。这对于处理大量特征但其中只有少数相关的情况可能是一个实质性的好处。通常，无论运行时间如何，所有类感知器线性算法都可以称为随时在线算法，它们具有产生有用结果的能力
    [139]。运行时间越长，结果越好。最后，多类问题必须简化为多个二分类问题，因为类感知器方法为二元的。


    ### 2.9.3.2 多层感知器


    实例必须线性可分，才能使学习达到所有实例都被正确分类的点。该问题通过多层感知器 [140]（图 2.6）得到解决。


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_44_0.png)


    **图 2.6** 基于感知器的结构。


    大量单元（神经元）以连接模式连接在一起构成了多层神经网络。单元的三大主要细分是：接收待处理信息的输入单元、显示处理结果的输出单元，以及中间的单元，更为人所知的是隐藏单元。前馈网络允许信号从输入到输出单向移动。反向传播算法将任务分为多个步骤。它为神经网络提供训练样本。网络的输出与给定样本的期望输出进行比较，以计算每个输出神经元的误差。其后是为每个神经元计算期望输出以及用于调整以匹配期望输出的缩放因子。这被称为局部误差。每个神经元的权重必须调整以最小化局部误差。必须对局部误差进行“归咎”分配给前一层的神经元，以便将更高责任交给由更强权重连接的神经元。整个过程必须在前一层的神经元上重复进行，使用每个神经元的“归咎”作为其误差。


    ## 2.9.4 统计学习算法


    统计方法以显而易见的基本概率模型为特征，该模型定义实例属于每个类别的可能性，而不仅仅是分类。两种简单方法，即线性判别分析（LDA）和相关的 Fisher 线性判别，被统计学和机器学习所利用，以找到对分离两个或多个对象类别起主要作用的特征线性组合
    [141]。LDA 要求对每个观测值进行的测量必须是连续量。处理分类变量的类似技术是判别对应分析 [142]。估计数据概率分布的另一种广泛技术是最大熵。最大熵遵循的总体原则是在一无所知时具有最大可能的均匀分布，并具有最大熵。有标签的训练数据对于开发一组约束模型以描绘分布的类别特定期望至关重要。现有文献中介绍了关于最大熵技术的良好教程导论
    [143]。统计学习算法最著名的代表是贝叶斯网络。关于贝叶斯网络的说明性介绍在早期方法中有所涉及 [144]。


    ## 2.9.5 支持向量机


    最新的监督机器学习技术是支持向量机（SVMs）[145]。SVMs 包含“间隔”概念——区分两个数据类别的超平面的任一侧。上限的减少


    基于各种低级特征（即颜色、形状和纹理）定义基于内容描述符（特征）。此外，本章详细阐述了基于决策树、基于学习的规则、统计技术、基于感知器的算法和支持向量机的显著分类技术。


