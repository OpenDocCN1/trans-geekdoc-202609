    符号表示随后对一对字符串之间的距离进行编辑，用于使用核支持向量机进行分类 [70]。针对形状分类，对每个形状类别使用树联合表示进行原型设计 [71]。骨架树模型已表示用于图像分类的按类别原型
    [72]。每个原型都由一个形状码本表示 [73]。骨架匹配对于研究形状分类很有用 [74–77]。基于轮廓的方法包括 CSS [78]、三角形面积表示 (TAR)
    [79]、分层 Procrustes 匹配 (HPM) [80]、shape-tree [81]、轮廓柔性 [82]、形状上下文 (SC) [83]、内距离形状上下文
    (IDSC) [84] 等。


    ## 2.6 基于纹理内容的特征提取


    图像中的纹理由于强度和颜色的变化而形成。它也以重复模式的形式存在。均匀性或放置规则构成了重复模式的基本基元。在物理层面，纹理对应于粗糙度、同质性和平滑度等定性术语。根据基元的大小，纹理分为两种类型，即微纹理和宏观纹理
    [85]。宏观纹理或粗糙度由物体的较大纹理形成，而较小的纹理导致精细或微纹理。纹理元素的方向称为方向性。可以根据表面是光滑还是粗糙的性质进行分类。纹理特征被用于提出自适应局部二值模式进行图像分类
    [86]。基于小波统计纹理特征的分割用于脑部计算机断层扫描图像的分类 [87]。提出了一种名为分层视觉码本 (HVC) 的新颖纹理模式表示方法，用于编码虹膜图像的纹理基元以进行虹膜图像分类
    [88]。可以从对非常高分辨率遥感图像中表现出常规模式的地表覆盖的基于纹理的分析中提取用于分类的重要信息 [89]。


    各种基于纹理的特征提取技术包括可转向金字塔、轮廓波变换、Gabor 小波变换 [90] 和复方向滤波器组 (CDFB) [91]。引入了平移不变的 CDFB
    用于基于纹理的图像识别 [91]。CDFB 的意义在于平移不变性、相对增强的纹理检索性能和相对最小化的冗余比。与 Gabor 变换和可转向金字塔相比，后者的过完备比率随方向子带数量线性增加，CDFB
    的过完备比率已被限制为 8/3 [91]。可转向金字塔可以创建图像的多尺度、多方向表示。单个函数的平移和旋转构成了基本滤波器。纹理的表示可以分为三种不同的方式，即结构、统计和多分辨率滤波方法。纹理特征的实用性在过去已被广泛研究，用于其在图像处理、计算机视觉和计算机图形学中的应用
    [92]，例如多方向滤波器组 [93] 和小波变换 [94–96]。可以利用对图像像素应用后获得的某些变换系数的统计数据生成纹理特征。文献中提到的两种不同情况下，通过应用小波变换和离散余弦变换生成纹理特征已实现
    [97] [98]。计算机视觉和图形学在纹理合成领域取得了令人称赞的进展，其中使用了基于图像中相邻位置/方向/尺度处小波系数对的马尔可夫统计描述符 [99]。Manjunath
    和 Ma [100,101] 在使用纹理特征进行图像识别的初始阶段做出了重大贡献，并指出了其纳入 MPEG-7 [102] 的适当性。Ma 和 Manjunath
    还提出了 [103] 一个用于航空图像识别的纹理词表。词表构建过程中涉及的纹理提取基于对图像应用 Gabor 滤波器组 [104]，以将滤波输出的统计数据编码为纹理特征。观察到诸如仿射和光度变换不变特征等纹理区域描述符对所讨论区域的形状具有鲁棒性
    [105]。当代文献中观察到为纹理识别进步而构想的仿射不变纹理特征提取 [106]（图 2.4）。


