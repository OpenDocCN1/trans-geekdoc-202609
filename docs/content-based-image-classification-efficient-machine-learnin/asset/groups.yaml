    | DST | 2*N*²(*N* − 1) | *N*²(2*N*) | 301858816 | 100 |\n| Hartley | 2*N*²(*N*\
    \ − 1) | *N*²(2*N*) | 301858816 | 100 |\n\n> **[Observation:** 这里一个乘法被视为八次加法用于倒数第二行的计算，且\
    \ DCT 计算被视为比较的 100% 用于最后一行。**]\n\n### 5.6 使用部分能量系数的特征提取\n\n五种不同的图像变换——即 DCT、Walsh\
    \ 变换、Kekre 变换、DST 和 Hartley 变换——已应用于测试图像，以提取用于基于内容图像分类的部分能量系数特征。分类结果通过 10 折交叉验证方案进行评估。每种技术在以下小节中进行了描述，并且不同部分能量百分比的分类结果与四个不同指标进行了比较——即\
    \ Precision、Recall、误分类率 (MR) 和 F1-Score。四种不同的分类器——即 K 近邻 (KNN)、Ripple-Down 规则\
    \ (RIDOR)、人工神经网络 (ANN) 和支持向量机 (SVM)——用于评估四个广泛使用的公共数据集的分类，即 Wang 数据集（1000 张图像和\
    \ 10 个类别）、Oliva Torralba (OT-Scene) 数据集（2688 张图像和 8 个类别）、Corel 数据集（10,800 张图像和\
    \ 80 个类别）和 Caltech 数据集（8127 张图像和 100 个类别）。分类器和数据集已在第 1 章中描述。最初，对所有考虑的变换的所有部分系数百分比的特征提取进行评估，以获得分类的\
    \ MR 和 F1-Score 值。Wang 数据集的测试图像用于此目的，图像的相似性度量采用均方误差 (MSE) 距离度量进行。\n\n### 5.6.1\
