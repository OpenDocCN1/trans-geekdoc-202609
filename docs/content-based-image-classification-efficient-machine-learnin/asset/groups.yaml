    \ for conversion of the gray values. Binarization is visualized as a robust feature\
    \ extraction technique and has exhibited high accuracy for content-based image\
    \ classification. The region of interest can be differentiated efficiently from\
    \ its background by means of the adept platform provided in image binarization.\
    \ However, selection of a threshold value has a crucial role to determine the\
    \ appropriateness of the binarization technique. Therefore, special care must\
    \ be realized while computing threshold value since it is instrumental in differentiating\
    \ the region of interest from its background. Threshold selection is broadly classified\
    \ into three different categories:\n\n- Mean threshold selection\n- Local threshold\
    \ selection\n- Global threshold selection\n\nThis chapter contains an elaborate\
    \ illustration for innovatively using mean threshold selection and local threshold\
    \ selection to extract meaningful features from images based on block truncation\
    \ coding described in Chapter 3. Working with global threshold selection is left\
    \ as an exercise for the reader. The novel approaches of feature extraction discussed\
    \ in this chapter extract lightweight features independent of the size of the\
    \ image input. This flexibility addresses the computational complexity and space\
    \ complexity favorably and reduces the computational overhead of the entire system.\
    \ An illustration of a binarized image is provided in Fig. 4.1.\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_79_0.png)\n\
    \n**FIGURE 4.2**  \nStages of Multilevel Block Truncation Coding.\n\n- Two clusters\
    \ are formed with gray values that are represented with 1 and 0 respectively after\
    \ comparing them to the threshold.\n- Calculate the mean of each cluster formed\
    \ in the previous step to generate image features for the given image.\n\n$$Xupmean\
    \ = \\frac{1}{\\sum_{i=1}^{m}\\sum_{j=1}^{n} BitMap_x(i,j)} \\ast \\sum_{i=1}^{m}\\\
    sum_{j=1}^{n} BitMap_x(i,j) \\ast X(i,j)$$\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_82_0.png)\n\
    \n|  | MR | F1 Score |\n|---|---:|---:|\n| BTC Level 1 | 0.082 | 0.622 |\n| BTC\
    \ Level 2 | 0.073 | 0.663 |\n| BTC Level 3 | 0.07 | 0.673 |\n| BTC Level 4 | 0.083\
    \ | 0.619 |\n\n**FIGURE 4.3**  \nComparison of MR and F1-Score for BTC Levels\
    \ 1, 2, 3 and 4.  \n[**Observation:** BTC Level 3 has the lowest MR and highest\
    \ F1-Score.]\n\nRule (RIDOR), Artificial Neural Network (ANN) and Support Vector\
    \ Machine (SVM)—for BTC level 3 used for feature extraction on four different\
    \ public datasets with mean threshold selection. The comparison of classification\
    \ performances is shown in Table 4.1 (Table 4.1).\n\n### 4.5 Feature Extraction\
    \ from Significant Bit Planes Using Mean Threshold Selection\n\nThe gray values\
    \ in an image are represented by decimal numbers. The decimal numbers can be easily\
    \ represented by binary bits. The binary representation of individual bits has\
    \ been regarded as bit planes in this section [2].\n\nOne can enumerate up to\
    \ eight different bit planes in each of the test images initiating from the least\
    \ significant bit to the most significant bit. This is inline to the demonstration\
    \ given in Fig. 4.4.\n"
