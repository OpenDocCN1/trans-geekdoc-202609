    # 4


    # Content-Based Feature Extraction:

    Image Binarization


    # 4.1 Prelude


    Binarization is a popular technique of converting the intensity values in images
    to 0 and 1. However, it is carried out by selecting a threshold for conversion
    of the gray values. Binarization is visualized as a robust feature extraction
    technique and has exhibited high accuracy for content-based image classification.
    The region of interest can be differentiated efficiently from its background by
    means of the adept platform provided in image binarization. However, selection
    of a threshold value has a crucial role to determine the appropriateness of the
    binarization technique. Therefore, special care must be realized while computing
    threshold value since it is instrumental in differentiating the region of interest
    from its background. Threshold selection is broadly classified into three different
    categories:


    +   - Mean threshold selection

    +   - Local threshold selection

    +   - Global threshold selection


    This chapter contains an elaborate illustration for innovatively using mean threshold
    selection and local threshold selection to extract meaningful features from images
    based on block truncation coding described in Chapter 3. Working with global threshold
    selection is left as an exercise for the reader. The novel approaches of feature
    extraction discussed in this chapter extract lightweight features independent
    of the size of the image input. This flexibility addresses the computational complexity
    and space complexity favorably and reduces the computational overhead of the entire
    system. An illustration of a binarized image is provided in Fig. 4.1.'
