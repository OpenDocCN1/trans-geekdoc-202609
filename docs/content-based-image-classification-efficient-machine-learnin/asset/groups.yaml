    \n### 5.1 Prelude\n\nImage transforms are essential to transfer the domain of\
    \ an image for significant descriptor definition. Feature extraction from images\
    \ in the frequency domain has often appeared to be beneficial compared to that\
    \ of the spatial domain due to better visibility of patterns. Image transforms\
    \ are considered as representations of images as a class of unitary matrices.\
    \ A transform is useful in creating basis images for image representation by means\
    \ of extrapolating the image to a set of basis functions. The process never alters\
    \ the image content while shifting the image representation from spatial domain\
    \ to frequency domain. Transforms convert spatial information to frequency domain\
    \ information, where certain operations are easier to perform. For example, convolution\
    \ operations can be reduced to matrix multiplication in the frequency domain.\
    \ Two advantages are recognized for transform techniques. Firstly, the critical\
    \ components of image patterns can be isolated by transformation, and those components\
    \ can have direct access for analysis. Secondly, the transformation process has\
    \ the ability to condense image data into a compact form, which has been helpful\
    \ for radical reduction of feature vector size. This chapter implements these\
    \ properties of image transforms to extract feature vectors for content-based\
    \ image classification. Individual classification performances are measured with\
    \ a full feature vector set generated by applying different transform techniques\
    \ and with subsequent reduction of feature vector size toward the high frequency\
    \ components at the upper portion of the image. Hence, the technique has identified\
    \ the suitability of visual words method for generation of feature vectors. Visual\
    \ words comprise small pieces of image data, which can carry significant information\
    \ about the entire image. The energy compaction property of transform techniques\
    \ have efficiently generated the features as visual words by concentrating important\
    \ image information in a block of few transform components for each color component\
    \ extracted from the image.\n\n### 5.2 Generating Partial Energy Coefficient from\
    \ Transformed Images\n\nThe significance of any image transform is to relocate\
    \ the high-frequency components toward the upper end of the image and the low-frequency\
    \ components toward the lower end of the image. The mentioned property is used\
    \ as a tool to drastically reduce the size of feature vectors by exclusion of\
    \ insignificant coefficients as shown in Fig. 5.1. A smaller dimension of feature\
    \ vector has resulted in less time for comparison of feature vectors in the classification\
    \ process.\n\nExtraction of feature vectors is carried out in 14 steps from the\
    \ transformed images. Initially, all coefficients of transformed images are considered\
    \ as feature vectors that have included 100% of the transformed coefficients.\
    \ Henceforth, gradual reduction in size of the feature vectors as 50%, 25%, 12.5%,\
    \ 6.25%, 3.125%, 1.5625%, 0.7813%, 0.39%, 0.195%, 0.097%, 0.048%, 0.024%, 0.012%\
    \ and 0.006% respectively of the complete transformed coefficients is carried\
    \ out to locate the high-frequency component of the transformed image. For an\
    \ image of dimension 256 × 256, the process has reduced the feature size from\
    \ 256 × 256 to 2 × 2 per color component.\n\nThe following steps are used for\
    \ classification with feature extraction using partial energy coefficients:\n\n\
    - Red, Green and Blue color components are extracted from a given image.\n- Image\
    \ Transform is applied on each of the components to extract feature vectors.\n\
    - The extracted feature vectors from each of the components are stored as a complete\
    \ set of feature vectors.\n- Further, partial coefficients from the entire feature\
    \ vector set are extracted to form the feature vector database.\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_110_0.png)\n\
    \n**FIGURE 5.1**\nSteps for Extraction of Partial Energy Coefficient from Image.\n\
    \n```\n#Separate the color components\nr=i(:, :,1); #red component\n[m n p]=size(r);\
    \ #dimension of red component\ng=i(:, :,2); #green component\n[x y z]=size(g);\
    \ #dimension of green component\nb=i(:, :,3); #blue component\n[j k l]=size(b);\
    \ #dimension of blue component\n```\n\n```\n#Apply Transform\nr1=dst(r); #applying\
    \ discrete sine transform (dst) on red component\ng1=dst(g); #applying discrete\
    \ sine transform (dst) on green component\nb1=dst(b); #applying discrete sine\
    \ transform (dst) on blue component\n```\n\n```\n#Extract Partial Transform Coefficients\n\
    count=0;\nfor a=1:m/64\nfor b=1:n/64\nif (a+b)<=5\ncount=count+1;\nr2(count)=r1(a,b);\n\
    g2(count)=g1(a,b);\nb2(count)=b1(a,b);\nend\nend\nend\n```\n\n### 5.4 Coding Exercise\n\
    \nThe previous code example is for generating partial transform coefficients.\
    \ Refer to the example to complete the following assignments:\n\n- What percentage\
    \ of fractional coefficients are extracted in the previous example?\n- Apply DCT,\
    \ Walsh and Kekre transforms to extract all proportions of partial coefficients.\n\
    - Test classification results for each variety.\n\n### 5.5 Computational Complexity\
    \ for the Image Transforms\n\nThis chapter has discussed five different image\
    \ transforms applied in the research work for feature vector extraction. The comparative\
    \ computational complexity of the transforms is displayed in Table 5.2 for an\
    \ image of dimension N × N.\n\n**TABLE 5.2**  \n**Comparison of Computational\
    \ Complexity of Applied Transforms**\n\n| Transforms | Number of Additions For\
    \ *N* × *N* image | Number of Multiplications | Total Additions for Transform\
    \ of 256 × 256 Image Dimension | Total Computations Comparison (For 256 × 256\
    \ Image Dimension) |\n|---|---:|---:|---:|---:|\n| DCT | 2*N*²(*N* − 1) | *N*²(2*N*)\
    \ | 301858816 | 100 |\n| Walsh | 2*N*²(*N* − 1) | 0 | 33423360 | 11.07 |\n| Kekre\
    \ | *N*[*N*(*N* + 1) − 2] | 2*N*(*N* − 2) | 17882624 | 5.92 |\n| DST | 2*N*²(*N*\
    \ − 1) | *N*²(2*N*) | 301858816 | 100 |\n| Hartley | 2*N*²(*N* − 1) | *N*²(2*N*)\
    \ | 301858816 | 100 |\n\n> **[Observation:** Here one multiplication has been\
    \ considered as eight additions for the second-last row computations, and DCT\
    \ computations have been considered to be 100% for comparison in the last row.**]\n\
    \n### 5.6 Feature Extraction with Partial Energy Coefficient\n\nFive different\
    \ image transforms—namely, DCT, Walsh transform, Kekre transform, DST and Hartley\
    \ transform—have been applied on the test images to extract features with partial\
    \ energy coefficient for content-based image classification. The classification\
    \ results are evaluated by a 10-fold cross-validation scheme. Each of the techniques\
    \ has been described in the following subsections and the classification results\
    \ with various percentages of partial energy have been compared with four different\
    \ metrics—namely, Precision, Recall, Misclassification Rate (MR) and F1-Score.\
    \ Four different classifiers—namely, K Nearest Neighbor (KNN), Ripple-Down Rule\
    \ (RIDOR), Artificial Neural Network (ANN) and Support Vector Machine (SVM)—are\
    \ used for appraising the classification of four widely used public datasets,\
    \ namely, Wang dataset (1000 images and 10 categories), Oliva Torralba (OT-Scene)\
    \ dataset (2688 images and 8 categories), Corel dataset (10,800 images and 80\
    \ categories) and Caltech dataset (8127 images and 100 categories). The classifiers\
    \ and the datasets have been described in Chapter 1. Initially, feature extraction\
    \ with all the percentages of partial coefficients of all the considered transforms\
    \ are assessed for MR and F1-Score values of classification. Test images from\
    \ the Wang dataset are utilized for this purpose and the similarity measure of\
    \ images is carried out with Mean Squared Error (MSE) distance measure.\n\n###\
    \ 5.6.1 Discrete Cosine Transform\n\nDiscrete cosine transform (DCT) has a close\
    \ link to the discrete Fourier transform (DFT) and has been defined as a separable\
    \ linear transformation\n"
