    # 4.13 Feature Extraction Using Local Threshold Selection


    This section discusses local threshold selection techniques with two popular methods—namely,
    Niblack’s local threshold selection and Sauvola’s local threshold selection.


    Applications of the local threshold selection techniques are carried out on bit
    planes of test images and on the original images.


    Luminance of images is often found to be uneven, causing major hindrance in selecting
    a single threshold for the entire image. However, an efficient solution is to
    segment the image into *m×n* divisions for local threshold selection corresponding
    to a particular division.'
