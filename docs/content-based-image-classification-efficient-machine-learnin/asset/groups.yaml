    \ Inc. For product information, please contact:\n\nThe MathWorks, Inc.  \n3 Apple\
    \ Hill Drive  \nNatick, MA 01760-2098 USA  \nTel: 508-647-7000  \nFax: 508-647-7001\
    \  \nE-mail: info@mathworks.com  \nWeb: www.mathworks.com\n\n## Author\n\nDr.\
    \ Rik Das  \nPhD (Tech.) in Information Technology, University of Calcutta  \n\
    M.Tech. in Information Technology, University of Calcutta  \nB.E. in Information\
    \ Technology, University of Burdwan  \nAssistant Professor, PGPM (Information\
    \ Technology), Xavier Institute of Social Service, Ranchi  \nACM Distinguished\
    \ Speaker, Association for Computing Machinery, New York, USA; Professional Member,\
    \ Association for Computing Machinery, New York, USA; Member of International\
    \ Advisory Board, AI Forum, UK; Advisor, GradsKey (StartUp); SPOC, SWAYAM—Local\
    \ Chapter, XISS, Ranchi\n\nRik is an assistant professor for the Programme of\
    \ Information Technology at Xavier Institute of Social Service (XISS), Ranchi,\
    \ India. He has more than 16 years of experience in academia and collaborative\
    \ research with various leading universities and organizations in India and abroad.\n\
    \nRik is appointed as a Distinguished Speaker of the Association of Computing\
    \ Machinery (ACM), New York, USA, on topics related to Artificial Intelligence,\
    \ Machine Learning, Computer Vision, and Natural language processing. He is featured\
    \ in uLektz Wall of Fame as one of the “Top 50 Tech Savvy Academicians in Higher\
    \ Education across India” for 2019. He is also a member of International Advisory\
    \ Committee of AI-Forum, UK.\n\nRik is an invited speaker in multiple technical\
    \ events, conclaves, meetups and refresher courses on Information Technology (machine\
    \ learning, deep learning, image processing and e-learning) organized by prominent\
    \ organizations such as the University Grants Commission (Human Resource Development\
    \ Centre), The Confederation of Indian Industry (CII), Software Consulting Organizations,\
    \ MHRD initiative under Pandit Madan Mohan Malviya National Mission on Teachers\
    \ and Teaching, IEEE Student Chapters, Computer Science/Information Technology\
    \ Departments of leading universities and many more.\n\nRik has collaborated with\
    \ professionals from leading multinational software companies such as TCS, CTS\
    \ etc. for research work in the domain of content-based image classification.\
    \ His keen interest in the application of machine learning and deep learning techniques\
    \ for designing computer-aided diagnosis systems for medical images has resulted\
    \ in joint publication of research articles with professors and researchers from\
    \ various universities abroad, including College of Medicine, University of Saskatchewan,\
    \ Canada; Faculty of Electrical Engineering and Computer Science, VSB Technical\
    \ University of Ostrava, Ostrava, Czechia; Cairo University, Giza, Egypt and so\
    \ on.\n\nRik has filed and published two Indian patents consecutively during 2018\
    \ and 2019 and has more than 40 international publications to date with reputed\
    \ publishers. He has authored two books in the domain of content-based image classification\
    \ and has edited three volumes on machine learning and deep learning with leading\
    \ publishers. Many of his edited and authored volumes are currently in press awaiting\
    \ release. Rik is an Editorial Board Member and Reviewer of multiple international\
    \ journals of repute and has served as Organizing and Technical Committee member\
    \ of several national and international conferences. He has also chaired sessions\
    \ in international conferences on machine learning.\n\nRik started his career\
    \ in 2002 as a business development executive at Great Eastern Impex Pvt. Ltd.\
    \ (a bar code solution offering company). Afterwards, he joined Zenith Computers\
    \ Ltd. as a senior marketing executive. His drive for higher education urged him\
    \ to complete postgraduate and doctoral programs while pursuing a career in academics\
    \ simultaneously. Rik has served Bengal Institute of Technology, Globsyn Business\
    \ School and NMIMS (Mumbai) as a professor in the domains of computer science/information\
    \ technology/information systems.\n\nRik earned his PhD (Tech) and MTech in information\
    \ technology from the University of Calcutta, India. He also earned a BE in information\
    \ technology from the University of Burdwan, India.\n\nRik founded a YouTube channel\
    \ titled “Curious Neuron” to disseminate knowledge and information to larger communities\
    \ in the domain of machine learning, research and development and open source\
    \ programming languages. He is always open to discuss new research project ideas\
    \ for collaborative work and for techno-managerial consultancies.\n\n## 1 Introduction\
    \ to Content-Based Image Classification\n\n### 1.1 Prelude\n\nA picture collage\
    \ contains an entire life span in a single frame. We have witnessed global excitement\
    \ with pictorial expression exchanges compared to textual interaction. Multiple\
    \ manifestations of social networking have innumerable image uploads every moment\
    \ for information exchanges, status updates, business purposes and much more [1].\
    \ The cell phone industry was revolutionized with the advent of camera phones.\
    \ These gadgets are capturing high-end photographs in no time and sharing the\
    \ same for commercial and noncommercial usage [2]. Significant medical advancements\
    \ have been achieved by Computer-Aided Diagnosis (CAD) of medical images [3].\
    \ Therefore, image data has become inevitable in all courses of modern civilization,\
    \ including media, entertainment, tourism, sports, military services, geographical\
    \ information systems, medical imaging and so on.\n\nContemporary advancement\
    \ of computer vision has come a long way since its inception in 1960 [4,5]. Preliminary\
    \ attempts were made for office automation tasks pertaining to approaches for\
    \ pattern recognition systems with character matching. Research work by Roberts\
    \ has envisaged the prerequisite of harmonizing two-dimensional features extracted\
    \ from images to three-dimensional object representations [6]. Escalating complexities\
    \ related to unevenly illuminated pictures, sensor noise, time, cost, etc. have\
    \ raised realistic concerns for continuing the ensuing research work in the said\
    \ domain with steadfastness and uniformity.\n\nRadical advancements in imaging\
    \ technology have flooded the masses with pictures and videos of every possible\
    \ detail in their daily lives. Thus, the creation of gigantic image datasets becomes\
    \ inevitable to store and archive all these rich information sources in the form\
    \ of images. Researchers are facing mounting real-time challenges to store, archive,\
    \ maintain, extract and access information out of this data [7].\n"
  mdcn: "\n除上述所述的局限性之外，深度学习更偏向于工具专长而非领域专长。对于学习者而言，首次使用深度学习技术永远无法理解实现基于内容图像分类系统性能微调所必需的图像处理基础。此外，其本身的实现开销对于基于内容图像数据的实验目的而言也是一种挑战。\n\
    \n本书直接解决了当前流行方法的这些不足，并全面介绍了基于深度学习方法的原理。\n\n首先，本书涵盖了各种图像处理技术，包括图像二值化的实现、图像变换、纹理分析和形态学方法。它解释了所有这些技术对于从图像内容中进行稳健特征提取的重要性。此外，它还演示了使用流行的机器学习算法，结合这些特征进行基于内容的图像识别的过程。最后，它还涵盖了使用表示学习进行特征提取的深度学习技术的应用。因此，本书是读者通向领域专长的助推器，同时融合了应用导向与深度学习技术。\n\
    \n我相信本书将成为希望从事基于内容图像数据的机器学习职业的学生、研究学者和行业专业人士的真正伴侣。它有助于为博士候选人激发研究思路。它还提供了使用图像内容进行识别的轻量级应用的设计方法。\n\
