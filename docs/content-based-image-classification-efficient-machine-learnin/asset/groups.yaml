    ### 5.1 前言\n\n图像变换对于将图像域转移以进行显著描述符定义至关重要。与空间域相比，频域中的图像特征提取由于模式可见性更好而通常被认为是有益的。图像变换被视为图像作为一类酉矩阵的表示。变换通过将图像外推到一组基函数来创建图像表示的基图像是有用的。该过程在将图像表示从空间域转移到频域的同时从不改变图像内容。变换将空间信息转换为频域信息，在该域中某些操作更容易执行。例如，卷积操作可以在频域中简化为矩阵乘法。变换技术被认可具有两个优点。首先，图像模式的关键成分可以通过变换分离，并且这些成分可以直接用于分析。其次，变换过程能够将图像数据压缩为紧凑形式，这有助于大幅减少特征向量大小。本章利用图像变换的这些特性来提取用于基于内容图像分类的特征向量。个别分类性能是通过应用不同变换技术生成的完整特征向量集以及随后向图像上部的高频分量减少特征向量大小来测量的。因此，该技术已确定了视觉词方法用于生成特征向量的适用性。视觉词由图像数据的少量片段组成，可携带有关整个图像的重要信息。变换技术的能量集中特性通过将每个从图像中提取的颜色分量的重要图像信息集中在少量变换分量的块中，有效地将特征生成为视觉词。\n\
    \n### 5.2 从变换图像生成部分能量系数\n\n任何图像变换的重要性在于将高频分量重新定位到图像的上端，而将低频分量重新定位到图像的下端。上述特性被用作一种工具，通过排除不显著的系数来大幅减少特征向量的大小，如图\
    \ 5.1 所示。特征向量的较小维度导致分类过程中特征向量比较所需的时间更少。\n\n从变换图像中提取特征向量共进行 14 步。最初，变换图像的所有系数都被视为特征向量，其中包含\
    \ 100% 的变换系数。此后，特征向量的大小逐步减少为完整变换系数的 50%、25%、12.5%、6.25%、3.125%、1.5625%、0.7813%、0.39%、0.195%、0.097%、0.048%、0.024%、0.012%\
    \ 和 0.006%，以定位变换图像的高频分量。对于尺寸为 256 × 256 的图像，该过程已将每个颜色分量的特征大小从 256 × 256 减少到 2\
    \ × 2。\n\n使用部分能量系数进行特征提取的分类采用以下步骤：\n\n- 从给定图像中提取红色、绿色和蓝色颜色分量。\n- 对每个分量应用图像变换以提取特征向量。\n\
    - 从每个分量提取的特征向量被存储为完整的特征向量集。\n- 此外，从整个特征向量集中提取部分系数以形成特征向量数据库。\n\n![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_110_0.png)\n\
    \n**FIGURE 5.1**\n从图像中提取部分能量系数的步骤。\n\n```\n#Separate the color components\nr=i(:,\
    \ :,1); #red component\n[m n p]=size(r); #dimension of red component\ng=i(:, :,2);\
    \ #green component\n[x y z]=size(g); #dimension of green component\nb=i(:, :,3);\
    \ #blue component\n[j k l]=size(b); #dimension of blue component\n```\n\n```\n\
    #Apply Transform\nr1=dst(r); #applying discrete sine transform (dst) on red component\n\
    g1=dst(g); #applying discrete sine transform (dst) on green component\nb1=dst(b);\
    \ #applying discrete sine transform (dst) on blue component\n```\n\n```\n#Extract\
    \ Partial Transform Coefficients\ncount=0;\nfor a=1:m/64\nfor b=1:n/64\nif (a+b)<=5\n\
    count=count+1;\nr2(count)=r1(a,b);\ng2(count)=g1(a,b);\nb2(count)=b1(a,b);\nend\n\
    end\nend\n```\n\n### 5.4 编程练习\n\n前面的代码示例用于生成部分变换系数。请参考示例完成以下任务：\n\n- 前一个示例中提取了多少百分比的分数系数？\n\
    - 应用 DCT、Walsh 和 Kekre 变换以提取部分系数的所有比例。\n- 测试每种变体的分类结果。\n\n### 5.5 图像变换的计算复杂度\n\
    \n本章讨论了研究工作中用于特征向量提取的五种不同的图像变换。变换的比较计算复杂度在表 5.2 中显示，图像尺寸为 N × N。\n\n**TABLE 5.2**\
    \  \n**所应用变换的计算复杂度比较**\n\n| 变换 | *N* × *N* 图像的加法次数 | 乘法次数 | 256 × 256 图像尺寸变换的总加法次数\
    \ | 总计算比较（256 × 256 图像尺寸） |\n|---|---:|---:|---:|---:|\n| DCT | 2*N*²(*N* − 1)\
