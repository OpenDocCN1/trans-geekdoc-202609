  mdcn: "\n**表 7.4** *使用 LBG 的 VQ 进行特征提取显著性评估的 t 检验*\n\n| 现有技术 | 均值 | 标准差 (SD) | 平均值标准误\
    \ (SEM) | t 计算值 | p 值 | 显著性 |\n|---|---|---|---|---|---|---|\n| Liu, 2013 | 0.626\
    \ | 0.220 | 0.073 | 3.550 | 0.007 | 显著 |\n| Ramírez-Ortegón et al., 2010 | 0.601\
    \ | 0.240 | 0.080 | 3.770 | 0.005 | 显著 |\n| Yanli and Zhenxing, 2012 | 0.638 |\
    \ 0.223 | 0.074 | 3.190 | 0.012 | 显著 |\n| Shaikh et al., 2013 | 0.595 | 0.214\
    \ | 0.071 | 3.870 | 0.004 | 显著 |\n\n[观察：p 值表明，与使用 LBG 的 VQ 进行特征提取相比，所有现有特征提取技术的分类精度结果存在显著差异。]\n\
    \n提出的技术的性能优于现有技术。另一方面，与现有技术相比，所提出技术的 SD 和 SEM 值更小。因此，可以认为所提出的技术与现有技术相比具有更好的一致性。因此，使用\
    \ LBG 的 VQ 进行特征提取的分类在基于内容的图像分类的分类性能方面超越了最先进的技术。\n\nt 检验采用了四种不同的比较；必须使用 Bonferroni\
    \ 校正进行事后分析，以接受所得结果的显著性。t 检验中 α 的值被认为是 0.05。计算 Bonferroni 校正值的表达式如下：\n\nBonferroni_α\
    \ = α / Number_of_tests\n\n其中 α = 0.05 且 Number_of_tests = 4。因此，Bonferroni_α =\
    \ 0.013。现在，表 7.4 中的 p 值与新计算的 α 值 0.013 进行比较。比较显示表 7.4 中的所有 p 值均小于 Bonferroni_α\
    \ 值。因此，即使在事后分析之后，所提出的技术与表 7.4 中的所有现有技术相比仍具有显著不同的分类结果。\n\n## 章节摘要\n\n本章介绍了两种特征提取技术，即用于基于内容图像分类的\
    \ LBG 的 VQ 和 GLCM。这些技术是\n\n## 8 基于融合的分类：基于内容特征的早期融合与晚期融合架构比较\n\n### 8.1 前言\n\n\
    关于基于内容图像分类的研究的过去几年强调了提取单一特征来表示图像内容。使用单一图像特征实现令人满意的分类结果具有挑战性，因为在识别任务中忽略了其他重要特征。图像包含丰富且多样化的特征集，可以共同创建更好的图像内容表示。因此，结合不同特征可以提高分类结果的准确性。\n\
    \n近期文献通过结合颜色和纹理特征应用了融合框架。所有低级特征已在基于内容的彩色图像识别中结合。所提出的技术通过使用带聚类的颜色量化算法获得了图像中少数主导颜色的百分比。形状描述符和纹理特征已通过使用伪泽尼克矩和可转向滤波器分解提取。通过合并颜色、纹理和形状实现了图像识别的更高准确性。该方法融合了颜色直方图、灰度共生矩阵和泽尼克矩三种图像特征。合并低级特征导致准确性提高。结构元素描述符已被提出用于提取图像的颜色和纹理作为特征。统计和结构纹理描述的融合已用于表示颜色和纹理的空间相关性。\n\
    \n本章讨论了基于融合的图像分类的两种不同方法。不同的描述符用于表示单个图像的多个特征，有助于改进基于内容的分类 [1,2]。分类框架经过精心设计，以确保使用\
    \ z 分数标准化进行分类决策的融合。这些方法中的每一个将在以下各节中描述。\n\n为实验目的使用了四个不同的数据集，即 Wang 数据集、OT-Scene\
    \ 数据集、Corel 数据集和 Caltech 数据集。主要是实现了两种不同的特征提取技术以启动基于内容的图像识别过程。特征是通过使用 Sauvola 的局部阈值选择方法对图像进行二值化以及应用离散余弦变换来生成图像的部分变换系数作为特征向量而提取的。以下小节详细介绍了每种特征提取技术，包括图像数据的预处理。\n\
    \n### 8.2 图像预处理\n\n增强的图像数据具有提供稳健特征向量的能力。图像按照公式 8.1 处理以创建奇数变体。所得图像如图 8.1 所示。\n\n\
    $$Im_{odd}=\\frac{(Im-\\overline{Im})}{2} \\tag{8.1}$$\n\n通过位平面切片检查奇数图像配置中每个位的贡献。从通用和奇数图像变体集中提取\
    \ 8 个位平面，以用 8 位二进制向量表示每个像素的强度值，如图 8.2 所示。位平面切片的表达式在公式 8.2 中给出。\n\n$$I_{bitplane}(i,j)=Rem\\\
    left\\{\\frac{1}{2}\\left\\lfloor\\frac{1}{2^i}I(i,j)\\right\\rfloor\\right\\\
    } \\tag{8.2}$$\n\n融合图像用 \\(I(i,j)\\) 表示，余数用 \\(Rem\\) 表示，而 \\(floor(I)\\) 表示将元素四舍五入到小于或等于\
    \ \\(I\\) 的 \\(I\\) 个最近整数。\n\n如图 8.3 所示，每个位平面都包含一个二进制矩阵，该矩阵有助于形成后续位平面的图像切片。\n\n\
    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_164_0.png)\n\n**图 8.1**  \n奇数图像创建。\n\n\
    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_166_0.png)\n\n位平面 1（奇数图像）\n\n位平面 2（奇数图像）\n\
    \n位平面 3（奇数图像）\n\n位平面 4（奇数图像）\n\n位平面 5（奇数图像）\n\n位平面 6（奇数图像）\n\n位平面 7（奇数图像）\n\n\
    位平面 8（奇数图像）\n\n融合图像（位平面 1、2、3 和 4）\n\n融合图像（位平面 5、6、7 和 8）\n\n**图 8.3**  \n奇数图像的位平面切片和融合过程。\n\
    \n使用 Sauvola 的局部阈值选择方法进行二值化得到的图像如图 8.4 所示。\n\n阈值是针对指定窗口计算的，其中每个像素与阈值进行比较，判断其值是否高于阈值或低于阈值。与阈值相比具有更高值的像素被赋值为\
    \ 1；否则赋值为 0。该操作如公式 8.4 所示：\n\n$$\\operatorname{Bitmap}(i,j)=\\begin{cases}1, &\
    \ \\text{if }x(i,j)>T_x\\\\0, & \\text{if }x(i,j)\\leq T_x\\end{cases} \\tag{8.4}$$\n\
    \n其中 \\(x = R\\)、\\(G\\) 和 \\(B\\) 且 \\(T_x\\) = 阈值。\n\n$$Xupmean = \\frac{1}{\\\
    sum_{i=1}^{m}\\sum_{j=1}^{n} BitMap_x(i,j)} * \\sum_{i=1}^{m}\\sum_{j=1}^{n} BitMap_x(i,j)\
    \ * X(i,j) \\tag{8.5}$$\n\n$$Xlomean = \\frac{1}{m*n-\\sum_{i=1}^{m}\\sum_{j=1}^{n}\
    \ BitMap_x(i,j)} * \\sum_{i=1}^{m}\\sum_{j=1}^{n}(1-BitMap_x(i,j))*X(i,j) \\tag{8.6}$$\n\
    \n类似的步骤重复进行以从奇数图像中提取特征向量，而不将其分离到位平面。因此，从奇数图像中提取的特征总数也为 6。\n\n最后，两个特征向量在水平方向上相互关联，以创建大小为\
    \ 12 的特征向量。\n\n### 8.4 应用离散余弦变换 (DCT) 进行特征提取\n\n有限的数据点序列可以用离散余弦变换 (DCT) 表示为不同频率的振荡余弦函数的总和。DCT\
    \ 是一种可分离的线性变换技术，类似于离散傅里叶变换 (DFT)，但它处理的是实数。其工作公式在公式 8.7 中给出。\n\n$$X_{(m,n)} = a_m\
    \ a_n \\sum\\sum R_{(i,j)} \\cos\\frac{\\pi(2i+1)}{2R}\\cos\\frac{\\pi(2j+1)}{2C}\
    \ \\tag{8.7}$$\n\n行和列由测试图像的 R 和 C 表示。\n\n它作为特征提取器应用于从作为测试图像创建的奇数图像变体的红色、绿色和蓝色颜色分量中识别出的显著位平面。该变换技术因其固有特性而被选用于特征提取，即将图像的高能量系数向右上角移动，低能量系数向右下角移动。这一特性使得可以选择部分变换系数作为提取的特征向量，从而大幅降低了特征向量维度。该过程的说明如图\
    \ 8.5 所示。\n\n如图 8.5 所示，主要是在每个颜色分量上应用 DCT 以提取变换系数作为特征向量。因此，初始阶段特征向量的维度等于大小\n"
