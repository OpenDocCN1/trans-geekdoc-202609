- pgno: 172
  md: 'The fusion model has applied z score normalization as in equation 8.10 for
    normalizing the distances computed by two different distance measures for a combined
    value of the scores. The combined value is further utilized to judge the classification
    accuracy of the technique.


    $$dist_x = \frac{dist_x - \mu}{\sigma} \tag{8.10}$$


    The final distance is calculated using the weighted sums of the normalized distances
    as in equation 8.11.


    $$dist = w_1 d_n^{binarization} + w_2 d_n^{morphological} \tag{8.11}$$


    Individual Precision rates for classification with each of the feature extraction
    techniques are considered to compute the weights. The process of normalization
    is effective for avoiding dependence of the classification decision on a high
    valued feature vector attribute having probabilities of higher influence on a
    classification decision.


    # 8.5.2 Method 2


    Fusion can also be carried out at an earlier stage during the feature extraction,
    which is known as an early fusion technique. The technique is carried out by feature
    value normalization using a feature scaling technique as shown in Fig. 8.7. Feature
    scaling is called the min-max normalization where the value of feature vectors
    extracted with two different feature extraction techniques is normalized using
    equation 8.12. The Wang dataset is considered for evaluation purposes so that
    the performance comparison can be carried out with same test image data.


    $$dist_x = \frac{dist_x - \min\ value}{\max\ value - \min\ value} \tag{8.12}$$


    The normalized feature values extracted using the binarization technique and partial
    transform coefficients are associated with each other to form the fused feature
    vector. The dimensions of feature vectors extracted using the binarization technique
    and partial transform coefficient are 12 and 24, respectively. Thus, the dimension
    of the fused feature vector becomes (12 + 24) = 36 per test image.


    The fused feature is provided as input to four different classifiers, namely,
    K Nearest Neighbor (KNN), Random Forest (RF), Support Vector Machine (SVM) and
    multilayer perceptron (MLP).'
