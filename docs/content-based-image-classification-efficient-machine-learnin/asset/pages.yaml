    \ (Under Creative Commons license).\n\nsize of 8 for each image which is independent\
    \ of the image dimension and has a considerably smaller footprint.\n\n# 7.2 Feature\
    \ Extraction by Vector Quantization Codebook  \nRepresentation Using Linde-Buzo-Gray\
    \ (LBG) Algorithm\n\nThe statistical color distribution of an image has been described\
    \ by the vector quantization (VQ) codebook [1]. The technique is applied on four\
    \ different public datasets for feature extraction from the test images. The datasets\
    \ are Wang dataset, OT-Scene dataset, Corel dataset and Caltech dataset. Each\
    \ of the color components, namely, red (R), green (G) and blue (B), are extracted\
    \ from the test images for applying vector quantization to create a codebook as\
    \ feature vectors. A *k* dimensional Euclidian space is mapped by means of vector\
    \ quantization into a finite subset. Representation of the codebook is done by\
    \ the finite set *CB* as in equation 7.1.\n\n$$CB = \\{Ci / i = 1,\\ 2,\\ ...\
    \ .,\\ N\\}$$\\n\\n(7.1)\n\nwhere Ci = (ci1, ci2, ...., cik) is a code vector\
    \ and N is the size of the codebook.\n\nThe Linde-Buzo-Gray (LBG) algorithm is\
    \ followed for generation of code vectors. Primarily, the images are divided into\
    \ nonoverlapping blocks and are converted to training vector Xi = (xi1, xi2, ...\
    \ , xik). A dimension of 12 is fixed for each training vector in the training\
    \ set. The training vector is comprised of red, green and blue components of 2\
    \ × 2 neighboring pixels. Henceforth, the centroid of the entire training set\
    \ is calculated as the first code vector. In addition, two trial code vectors\
    \ v1 and v2 are generated by adding and subtracting the constant error to the\
    \ centroid. The nearness of each training vector to the trial vectors is computed,\
    \ and two clusters are formed based on proximity of the training vectors to v1\
    \ and v2 as shown in Fig. 7.2.\n\nThis has created a codebook of size 2 by calculating\
    \ two centroids from the two newly formed clusters to produce two code vectors.\
    \ The aforesaid process"
