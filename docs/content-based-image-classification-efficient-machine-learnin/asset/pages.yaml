  md: '# 2.9.3 Perceptron-Based Techniques


    # 2.9.3.1 Single-layer Perceptrons


    A single-layer perceptron is briefly described as follows: If the input feature
    values be denoted by x₁ through xₙ and the connection weights/prediction vector
    be denoted by w₁ through wₙ (typically real numbers in the interval [−1, 1]),
    then the sum of weighted inputs is calculated by the perceptron as: and ∑ᵢ xᵢwᵢ
    an adjustable threshold is maintained for the output. Output is assigned with
    a value of 1 if the sum is above the threshold; else it is 0. A frequently used
    learning process for the perceptron algorithm from a batch of training instances
    is to repeat the execution of the algorithm through the training set to search
    for an appropriate prediction vector for the entire training set. Label prediction
    of the test set is executed by this prediction rule. A novel algorithm, named
    voted-perceptron, is created to accumulate more information during training for
    generating superior predictions for the test data [138].


    The characteristics of maintaining superior time complexity to deal with irrelevant
    features with perceptron-like linear algorithms has been discussed. This can be
    a substantial benefit for dealing with numerous features out of which only a few
    are pertinent ones. Usually, irrespective of the run time, all perceptron-like
    linear algorithms can be termed as anytime online algorithms which have the capacity
    to produce a useful outcome [139]. The longer they run, the better the result
    they produce. Finally, a multiclass problem must be reduced to a set of multiple
    binary classification problems as perceptron-like methods are binary.


    # 2.9.3.2 Multilayer Perceptrons


    Instances have to be linearly separable to make the learning arrive at a point
    where all instances have to be properly classified. This problem is addressed
    with multilayer perceptrons [140] (Fig. 2.6). A large number of units (neurons)
    joined together in a pattern of connections has constituted the multilayer neural
    network. Three major subdivisions of units are aimed at input units to receive
    information to be processed, output units to display the results of the processing
    and units in between that are better known as hidden units. Feed forward networks
    permit one-way movement of signals from input to output. The back propagation
    algorithm has divided the tasks into multiple steps. It provides the neural network
    with a training sample. The output of the network is compared to that of the expected
    output from the given sample to compute the error in each output neuron. The process
    is followed by calculation of desired output for each neuron along with a scaling
    factor for adjustment to match the desired output. This is known as local error.
    The weights of each neuron have to be adjusted to minimize the local error. Assignment
    of “blame” is to be done for the local error to the neurons at the previous level
    for handing over higher responsibilities to neurons connected'
