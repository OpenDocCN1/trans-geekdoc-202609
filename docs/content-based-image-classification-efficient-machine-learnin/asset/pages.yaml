    # ### 7.5 Feature Extraction by Gray Level Co-occurrence Matrix (GLCM)


    Texture features have the characteristics to describe the visual pattern based
    on spatial definition of images. Identifying the specific texture in an image
    is carried out by representing the texture as a two-dimensional gray level variation
    known as the gray level co-occurrence matrix (GLCM) [1]. The GLCM is defined as
    a statistical method for discovering the textures that consider the spatial relationships
    of pixels. The GLCM function represents the texture of an image by computing the
    frequency of existence of pixel pairs with specific values and with specific pixel
    relationships in an image followed by extraction of statistical measures from
    the matrix. (7.2) defines the normalized probability of the co-occurrence matrix.


    $$P_\delta(i,j)=\frac{\#\{(x,y),(x+d,y+d)\mid (x,y)\in S\mid f(x,y)=i, f(x+d,y+d)=j\}}{\#S}
    \tag{7.2}$$


    where x,y = 0, 1, ..., N − 1 are pixel coordinates, i,j = 0, 1, ..., L − 1 are
    gray levels, S = pixel pairs in image with certain relationship, #S = number of
    elements in S and P_δ(i,j) = probability density.


    Different directions are considered for computation of GLCM, such as δ = 0°, δ
    = 45°, δ = 90° and δ = 135°. Four statistical parameters for energy, contrast,
    entropy and correlation are calculated based on the GLCM as shown in equations
    7.3–7.6. The repetition of pixel pairs is measured by the energy or angular second
    moment (ASM). The variance of gray level is quantified by contrast. The disorder
    of the image is measured by entropy, and correlation has returned a measure of
    how correlated a pixel is to its neighbor over the whole image.


    $$ASM=\sum\sum P^2(i,j) \tag{7.3}$$'
