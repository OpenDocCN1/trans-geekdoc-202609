  md: 'the corresponding branch. Classification of instances is initiated at the root
    node, and the sorting has to be done with respect to the feature values. The root
    node of the tree comprises the feature that best divides the training data. Multiple
    techniques are applied to recognize the feature that best divides the training
    data such as information gain and Gini index [122,123]. However, each attribute
    is measured independently by the myopic measures; namely, ReliefF algorithm [124]
    estimates them in the context of other attributes. Nevertheless, it is observed
    by majority of studies that there is no single best method [125]. It is still
    vital to compare individual methods for deciding which metric should be used in
    a particular dataset. The same procedure is then repeated on each partition of
    the divided data, creating subtrees until the training data is divided into subsets
    of the same class. Splits based on a single feature at each internal node are
    used by decision trees, which characterize them as univariate. The problems involving
    diagonal partitioning cannot be handled well by most of the decision trees. The
    division of the instance space is orthogonal to the axis of one variable and parallel
    to all other axes. Hence, all hyper-rectangular regions are obtained after partitioning.
    However, some of the methods construct multivariate trees. Zheng’s method has
    improved the accuracy of classification for the decision trees by creating new
    binary features with logical operators such as conjunction, negation and disjunction
    [126]. In addition, Zheng created at-least M-of-N features [127]. The value of
    a minimum M-of-N representation for a given instance is true if at least M of
    its conditions is true for the instance; otherwise, it is false. A combined decision
    tree is formed with a linear discriminant for constructing multivariate decision
    trees [128].


    The most familiar algorithm in the literature for construction of decision trees
    is the C4.5 [129]. Comprehensibility is considered as one of the most important
    features of decision trees. The assumption made in the decision trees is that
    instances belonging to different classes have different values in at least one
    of their features. Decision trees tend to perform better when dealing with discrete/categorical
    features (Fig. 2.5).


    # 2.9.2 Learning a Set of Rules


    A variety of rule-based algorithms can be directly induced from the training data
    [130]. Each class is represented by disjunctive normal form (DNF) in classification
    rules. The objective is to create the smallest ruleset consistent with the training
    data. Learning a large number of rules signifies that the learning algorithm has
    been trying to “remember” the training set instead of discovering the assumptions
    that governed it. A separate-and-conquer algorithm (covering algorithms) search
    for a rule that explains a part of its training instances separates these instances
    and recursively conquers the remaining instances by learning more rules until
    no instances remain. The heuristics for rule learning and for'
