    # ALGORITHM 5.1:


    ```

    Let H be the hadamard matrix of size NxN

    Let seq(0) = 0; and seq(1) = 1

    Let N1=2

    For k=1 to Log2 (N) -1

    Cseq(n) = seq(n) for n = 0, 1, 2, ..., N1-1.

    Cseq(n) = seq(n-2i+1) + 1 for n = N1, N1+1,..., 2N1-1

    and i=0,1,2,..., N1-1.

    seq=Cseq

    N1=2N1.

    End for

    For n=0 to N-1

    For j=0 to N-1

    W(n,j)=H(seq(n),j)

    End for j

    End for n

    ```


