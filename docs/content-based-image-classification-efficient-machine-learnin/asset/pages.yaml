  md: 'fusion-based techniques for content-based image identification. Effective feature
    dimension reduction that retains the essential feature components is inevitable
    to ensure efficient content-based image classification with a high level of accuracy.


    # Chapter Summary


    Conventional techniques of image classification are based on single feature extraction
    techniques. However, the rich set of features in an image can hardly be explored
    with a single feature extraction methodology. This chapter proposed a decision
    fusion-based (late fusion) classification technique by means of z score normalization.
    This technique fused the classification decision of the individual feature extraction
    techniques before determining the final classification results. The chapter also
    proposed a feature fusion (early fusion) technique by means of feature scaling.
    The introduced fusion techniques outclassed the classification results obtained
    using the single feature extraction technique. Comparing the fusion techniques
    resulted in higher classification accuracy for late fusion using classification
    decision.


    # References


    +   1. Thepade, S., Das, R. and Ghosh, S., 2017. Decision fusion-based approach
    for content-based image classification. *International Journal of Intelligent
    Computing and Cybernetics*, 10(3): 310–331.

    +   2. Das, R., Thepade, S. and Ghosh, S., 2016. Framework for content-based image
    identification with standardized multiview features. *Etri Journal*, 38(1): 174–184.'
