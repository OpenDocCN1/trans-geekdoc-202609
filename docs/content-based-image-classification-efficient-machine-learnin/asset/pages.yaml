  md: '# 2


    *A Review of Handcrafted Feature Extraction Techniques for Content-Based Image
    Classification*


    # 2.1 Prelude


    An enormous quantity of valuable information is accessible from the image data
    archived in colossal databases. Assorted sources, including entertainment media,
    mainstream media, defense, sports events and social media platforms, contribute
    readily to form these image data archives [1]. Numerous approaches are suggested
    and carried out in recent years with the purpose of extracting valuable information
    from these enormous data and classifying them into corresponding categories. This
    chapter assesses and discusses some of the significant allied approaches in the
    aforementioned domain of feature extraction and classification techniques for
    content-based image classification.


    Exploring information present in an image is traditionally carried out by implementing
    diverse feature extraction techniques on low-level image characteristics such
    as, color, texture and shape [2]. The two most important stages in content-based
    image classification consist of robust feature extraction from image data followed
    by classification of image categories with the help of extracted signatures.


    A concise study of significant methods for extracting content-based image descriptors
    (features) and of benchmarked classification techniques for analyzing the performance
    of the extracted descriptors is described in the following subsections.


    # 2.2 Extraction of Features with Color Contents


    One of the prominent characteristics of an image is considered to be the color
    components for extraction of meaningful features for content-based image classification
    (CBIC). One of the approaches has implemented a'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'technique which considers three horizontal regions in the image that do not
    overlap, and from each of the zones, the first three moments for each separate
    color channel is extracted to a feature vector of 27 floating points [3]. Some
    of the approaches are observed to consider three major attributes for extraction
    of color-based characteristics, namely, color space, quantization of the color
    space and extraction of the color feature [4–6]. Color features have explored
    different methods like conventional color histogram (CCH) and fuzzy color histogram
    (FCH) [7,8].


    CCH has represented frequency of occurrence of each color component in an image.
    It has the benefit of uncomplicated implementation that results in reduced computational
    overhead. One major drawback of the technique is its bulky feature dimension,
    which stays identical irrespective of thorough quantization of color space. Another
    deficiency also detected is its inability to assess similar color across different
    bins. Spatial information of color spatial is also not encoded in CCH.


    However, different extent of memberships for each bin is observed in case of FCH
    because it belongs to all histogram bins. A primary advantage of FCH is its capability
    to encode the level of similarity of each pixel color to all other histogram bins
    by implementing a fuzzy-set membership function. FCH is proven to be additionally
    robust in handling quantization errors for varying light intensity. Nevertheless,
    the curse of dimensionality has turned out to be the primary reason for its setback
    supplemented with increased computational complexity of fuzzy membership function
    (see Fig. 2.1).


    # 2.3 Extraction of Features with Image Binarization


    Segregation of the required content in the picture from its background for proficient
    extraction of its characteristics is rightly carried out with binarization method.
    The method of image binarization has comprehensively implemented selection of
    appropriate threshold to differentiate the region of interest in an image from
    its background. In recent years, numerous techniques are proposed by the researchers
    for extraction of binarized features using threshold selection [9–11]. Binarization
    technique is also found to be useful to carry out image descriptor definition
    as discussed in existing literature [12–19]. However, most of the proposed methodologies
    are observed to be evaluated in controlled environments facilitated by processing
    professional-quality images available from high-end image-capturing devices. On
    the contrary, capturing images in a real-life scenario may be affected by diverse
    factors comprising of low-light condition, nonuniform illumination, etc. [20].
    Proper threshold selection technique becomes imperative in such a scenario to
    identify the foreground object separately from'
