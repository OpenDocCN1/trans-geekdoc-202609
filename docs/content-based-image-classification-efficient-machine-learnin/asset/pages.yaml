    # 1.5 Organization of the Book


    Currently, this work attempts to furnish a foretaste of possibilities of applying
    multiple innovative techniques to stimulate the performance of content-based image
    classification. Each of the methods is discussed in detail in the forthcoming
    chapters, with special emphasis on creating a framework for fusion-based approaches.


    Chapter 1 provides an overview of current scenarios for content-based image classification.
    The chapter emphasizes the importance of feature extraction techniques to ensure
    the success of content-based image recognition.


    Chapter 2 discusses various contemporary works on benchmarked feature extraction
    techniques. It reviews the recent techniques reported in content-based image classification
    and discusses the importance of various techniques for enhanced classification
    results.


    Chapters 3–7 discuss various handcrafted techniques of feature extraction for
    content-based image classification. The chapters specifically describe various
    methodologies to extract features from low-level image characteristics such as
    color, shape, texture, etc. The author provides a step-by-step guide for hands-'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'on experience for the reader in implementing the algorithms. The extracted
    features are significantly small in dimension, which help the reader test the
    robustness of the extracted features—even on a system with basic configurations.


    Chapter 8 establishes the significance of classification using a fusion framework
    for increased classification results. The chapter makes an efficiency comparison
    of early fusion to late fusion and establishes the importance of fusion-based
    architecture for enhanced classification results.


    Finally, Chapter 9 explains representation learning with pretrained Convolutional
    Neural Network (CNN) architecture. The book concludes with direction toward future
    scope and diverse applications possible with the help of content-based image classification.


    # Chapter Summary


    The chapter has introduced the concept of content-based image classification.
    It has discussed the background and objectives of classification based on image
    content. The metrics used throughout this book for evaluating the efficacy of
    the classification process are also illustrated in this chapter. Finally, the
    chapter has demonstrated the different datasets used in this book for explaining
    the various schemes of feature extraction for content-based image classification.


