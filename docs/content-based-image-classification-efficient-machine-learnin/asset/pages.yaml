    # 5.6.3 Kekre Transform


    In contrast to the majority of available transforms, Kekre’s transform matrix
    can be of any size $N \times N$ not in the powers of 2 [3]. The values in upper-diagonal
    and diagonal positions in the matrix are assigned with 1 and the value for the
    lower-diagonal part, excluding the value just below the diagonal, is 0. A generalized
    Kekre’s transform matrix is given in Matrix 5.1.


    $$K_{N\times N}=\begin{bmatrix}

    1 & 1 & 1 & \cdots & 1 & 1 \\

    -N+1 & 1 & 1 & \cdots & 1 & 1 \\

    0 & -N+2 & 1 & \cdots & 1 & 1 \\

    \vdots & \vdots & \vdots & \ddots & \vdots & \vdots \\

    0 & 0 & 0 & \cdots & 1 & 1 \\

    0 & 0 & 0 & \cdots & -N+(N-1) & 1

    \end{bmatrix}$$'
