    # 5.7 Evaluation of the Proposed Techniques


    The classification performances shown by each of the feature extraction techniques
    using partial transform coefficients are compared across four different classifiers
    and four public datasets as shown in Figs. 5.7–5.10.


    The illustrations in Figs. 5.7–5.10 clearly reveal that classification results
    by feature extraction with partial DCT coefficients has outclassed all of the
    other four transforms—namely, Walsh transform, Kekre transform, DST and DHT.


    The reason for the superior performance of DCT is due to the fact that the mean
    of the gray values being transformed is the first coefficient of DCT. Thus, the
    first coefficient of each block is the average tone of the participating gray
    values, which allows the subsequent coefficients to add an increasing number of
    details, facilitating better feature extraction. On the other hand, the sinθ-based
    transforms get initiated with offset of 0.5 or 1, which results in a gentle mound
    in the first coefficient. This is not suitable for robust feature extraction from
    the given test images.


    The number of iterations carried out by the transform techniques for feature vector
    calculation is observed to consume linear time. Each transform takes L number
    of iteration for calculating the coefficients. Thus for three color components
    (Red, Green and Blue), a total of 3L iterations are required. However, the selected
    partial coefficients is of n% (where n = 50% to 0.006%) of the whole transform
    coefficient generated. Consequently, the number of iterations required'
