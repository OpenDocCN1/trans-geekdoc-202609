    CDFB consists of shift invariance, relatively enhanced texture retrieval performance
    and comparatively minimized redundancy ratio. The over-complete ratio of the CDFB
    has been restricted to 8/3, compared to those of the Gabor transform and steerable
    pyramid that increases linearly with the number of directional sub-bands [91].
