  md: 'compared to the threshold. The values higher than the threshold are clustered
    in the upper intensity group, and the values lower than the threshold are clustered
    in the lower intensity group. The mean of the two clusters thus formed is considered
    the mean upper intensity and mean lower intensity for the corresponding clump.
    Hence, the number of feature vectors is twice the number of color clumps formed
    and is independent of the size of the image.


    # 9.5 Binarization Techniques


    Two different approaches of threshold selection can be implemented to extract
    feature vectors based on binarization techniques: mean threshold selection and
    local threshold selection.


    Binarization with mean threshold selection computes a threshold value for each
    color component red (R), green (G) or blue (B) in an image. Binary bitmaps are
    then calculated for each color component in RGB color space. A value of 1 is assigned
    to pixel values greater than or equal to the threshold value; otherwise, 0 is
    assigned. Two mean colors are derived for each color component after calculating
    the bitmap values. The upper mean color is the average of the pixel values that
    are greater than or equal to the consequent threshold, whereas the lower mean
    color is derived from the average of the pixel values that are lower than the
    threshold. Four different feature extraction techniques by binarization using
    mean threshold selection are proposed in Chapter 4, which are feature extraction
    with multilevel mean threshold, feature extraction from significant bit planes
    using mean threshold selection, feature extraction from even and odd image varieties
    using mean threshold selection and feature extraction using static and dynamic
    ternary image maps using mean threshold selection.


    Feature extraction with local threshold selection for binarization is carried
    out using either Niblack’s local threshold selection or Sauvola’s local threshold
    selection. A local window of dimension m*n is maintained for the binarization
    process carried out with local threshold selection. Pixel-wise threshold is calculated
    by the method for each color component by sliding a rectangular window over the
    component. The image may have uneven illumination for which the binarization process
    is carried out locally using the rectangular window.


    The feature extraction techniques using binarization with mean threshold selection
    and local threshold selection have been compared for classification performance.
    Feature extraction by binarization with Sauvola’s local threshold selection has
    outclassed all the other techniques in Precision, Recall and F1-Score and has
    shown minimum Misclassification Rate (MR). This technique has also surpassed the
    existing techniques of feature extraction in classification performance.'
  merge: -1
