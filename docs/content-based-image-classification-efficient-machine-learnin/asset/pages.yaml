    # 2.4 Extraction of Features with Image Transforms


    Image transformation leverages shifting of the domain of the image elements, which
    results in representation of an image as a set of the energy spectrum. A basis
    image is created by extrapolation of the image to a series of basis functions
    [33]. The basis images are generated by means of orthogonal unitary matrices in
    the form of image transformation operators. Transformation of an image from its
    current representation to a different one has two different benefits:


    +   a. Expansion of an image is possible as a waveform series by using image transforms.
    The process of transformation is also helpful in distinguishing the critical components
    of image patterns.

    +   b. Information can be stored in a compact manner within the transformed image
    data, which increases the efficiency and usefulness of the process.


    The aforementioned characteristics of image transform support a thorough reduction
    of descriptor dimension extracted from the images using diverse transformation
    techniques, namely, discrete cosine transforms, Hartley transform, etc. Therefore,
    the researchers have proposed different'
