- pgno: 21
  md: 'classifiers have been considered to carry out the task. The classifiers are
    K Nearest Neighbor (KNN) Classifier, Ripple-Down Rule (RIDOR) Classifier, Artificial
    Neural Network (ANN) Classifier and Support Vector Machine (SVM) Classifier. Brief
    descriptions of the classifiers explain their individual work flows [10].


    # 1.3.1 KNN Classifier


    The highest error rate for K Nearest Neighbor (KNN) is twice the Bayes error rate,
    which is considered as the minimum possible rate for an instance-based classifier.
    Thus, it is considered as one of the classifiers for evaluation purposes. It classifies
    the unknown instance by identifying its nearest neighbor in the instance space
    and further designates the class of the nearest neighbor to the unknown instance.


    The working formula of four different similarity measures, namely, Euclidean Distance,
    Canberra Distance, City Block Distance and Mean Squared Error, have been given
    in equations 1.9–1.12. These similarity measures are implemented to figure out
    the nearest neighbors during the classification process of the instances.


    $$D_{Euclidian}=\sqrt{\sum_{i=1}^{n}(Q_i - D_i)^2}\tag{1.9}$$ $$D_{Canberra}=\sum_{i=1}^{n}\frac{|Q_i
    - D_i|}{|Q_i|+|D_i|}\tag{1.10}$$ $$D_{City\ block}=\sum_{i=1}^{n}|Q_i - D_i|\tag{1.11}$$
    $$D_{MSE}=\frac{1}{n}\sum_{i=1}^{n}(Q_i - D_i)^2\tag{1.12}$$


    # 1.3.2 Random Forest Classifier


    It is a classifier which acts on the principle of ensemble learning. It builds
    a number of decision trees during the time of training and the output class is
    determine by the mode of the classes it learns during the supervised procedure.


    Random Forest Classifier has a number of advantages that have made it a popular
    choice for the classification task. It can proficiently manage large datasets
    by handling thousands of input variables. It refrains from variable deletions
    and approximates the significance of a variable for classification.'
