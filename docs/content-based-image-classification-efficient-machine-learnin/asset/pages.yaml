    # 3.5 Coding Exercise


    The previous code example is used for designing 16 clumps for red color component.
    Refer to the example to complete the following assignments:


    +   - Compute the mean by designing clumps for green and blue color components

    +   - Generate feature vectors of dimension 4, 8, 16, 32 and 64


    Comparative results of classification performances have revealed maximum Precision
    and Recall values with 16 clumps for the mentioned approach. This has provided
    a feature vector of dimension 32 for each color component, which sums up to 96
    for formation of feature vector with all three color components irrespective of
    image dimension.


    Initial comparison of results in Table 3.1 embraces the metrics named Misclassification
    Rate (MR) and F1-Score. The number of color clumps is denoted by N, and the Wang
    dataset is considered a testbed for classification using the KNN Classifier.


    The observations for the experiments follow:


    +   - MR decreases and F1-Score increases till N = 16.

    +   - Lowest MR recorded is 0.050 for N = 16, and the subsequent highest F1-Score
    is 0.728.

    +   - Two observations indicate the common inference of higher classification
    performance until N = 16 subsets of the intensity values.

    +   - Further enhancement of N for N = 32 has decreased F1-Score to 0.56 and amplified
    MR to 0.099.

    +   - Therefore, the number of clumps to be designed is restricted to 16 for the
    work.


    Hereafter, calculation of average values for diverse metrics is carried out to
    observe Precision, Recall, MR and F1-Score for classification with four different
    classifiers—namely, KNN, Ripple-Down Rule (RIDOR), Artificial Neural Network (ANN)
    and Support Vector Machine (SVM)—for partition N = 16 used for feature extraction
    with color clumps from four different public datasets.'
