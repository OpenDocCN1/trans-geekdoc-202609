    # 6.8 Comparison of Proposed Techniques


    This chapter discusses two different techniques of morphological feature extraction—namely,
    top-hat transform and bottom-hat transform. The techniques are tested for classification
    results on four different public datasets using four different classifiers and
    the results are given in Tables 6.1 and 6.2. The two techniques are compared in
    Figs. 6.4–6.7 based on Precision, Recall, MR and F1-Score respectively for all
    the four datasets and classifiers.


    The comparison shown in Figs. 6.4–6.7 has clearly revealed that classification
    by feature extraction with bottom-hat transform has better Precision, Recall and
    F1-Score values and lesser MR compared to top-hat transform.


    Feature extraction using bottom-hat transform is carried out exclusively from
    the extracted area of interest in an image. This has led to robust feature extraction
    because the structuring element in bottom-hat transform removes the image portions
    that do not fit to it during both opening and closing operations. On the contrary,
    the top-hat transform is used for light object with dark background and the removed
    image parts comprise portions smaller than structuring elements. Thus, the region
