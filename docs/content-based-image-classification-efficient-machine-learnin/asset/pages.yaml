    # 3.6 Feature Extraction Using Sorted Block Truncation Coding for Content-Based
    Image Classification


    Image processing algorithms have considered noise extending adverse influence
    on image data by staining it to a large extent. The fact is evident in plenty
    of literature that has introduced varied noise elimination techniques to decrease
    the effect of noise over image data. One of the popular techniques is the binning
    method, which is extensively implemented for smoothing sorted values of data in
    a dataset [8]. A stepwise functionality of binning method to sort the values in
    a dataset follows:


    +   - The sorted values are divided in bins.

    +   - Average of the sorted values are computed by considering the neighboring
    values to perform local smoothing for each of the bins. The local smoothing is
    crucial for noise removal.

    +   - The corresponding average value for a particular bin is instrumental in
    replacing each value present in the bin.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - The process is repeated for all the values in the bin to perform smoothing.


    A similar approach is adopted in the case of SBTC by implementing modified binning
    technique. The gray values of images are sorted for feature vector extraction
    from individual color components Red (R), Green (G) and Blue (B).


    The primary difference of this technique with the one described in Section 3.3
    lies in the dimension of feature vector extracted. The earlier technique creates
    feature vectors having double dimension to the number of bins, whereas, this technique
    results in feature vectors equal to the number of bins as in Fig. 3.3.


