- pgno: 95
  md: "Both the techniques of local threshold selection mentioned in this section\
    \ have considered both mean and standard deviation for computing the thresholds.\
    \ This has taken care of the variance of the gray values in the image data.\n\n\
    In the case of Niblack’s threshold selection, determination of the threshold is\
    \ based on the local mean $m(i,j)$ and standard deviation $\\sigma(i,j)$. A window\
    \ size of (25 × 25) is considered. The threshold is given by $T(i,j)=m(i,j)+k·\\\
    sigma(i,j)$. Here, $k$ is a constant having a value between 0 and 1 and is considered\
    \ to be 0.6 in the proposed method. The value of $k$ and the size of the sliding\
    \ window determined the quality of binarization.\n\nSauvola's technique is an\
    \ improvement over Niblack's method for local threshold selection and is useful\
    \ for images with faded backgrounds.\n\nBoth the techniques are available in the\
    \ form of *functions()* in the MATLAB library. They can be applied directly to\
    \ the code example provided in this chapter for feature vector extraction using\
    \ local threshold selection techniques.\n\n# 4.14 Code Example (MATLAB)\n\n```\n\
    ```matlab\n#Read an image\ni=imread('path\\\\imagefile');\n    #Separate the color\
    \ components\nr=i(:,:,1); #red component\n[m n p]=size(r); #dimension of red component\n\
    g=i(:,:,2); #green component\n[x y z]=size(g); #dimension of green component\n\
    b=i(:,:,3); #blue component\n[j k l]=size(b); #dimension of blue component\n \
    \   #Extracting bit planes (red component)\nfor a1=1:m\nfor a2=1:n\nif bitget(uint8(r(a1,a2)),5)==1\
    \ || bitget(uint8(r(a1,a2)),6)==1\n|| bitget(uint8(r(a1,a2)),7)==1 || bitget(uint8(r(a1,a2)),8)==1\n\
    rt(a1,a2,:)=r(a1,a2);\nend\nend\nend\nBWr = NIBLACK(rt, [25 25], 0.6, 0, 10);\n\
    ```\n```"
