- pgno: 55
  md: "# 3\n\n# Content-Based Feature Extraction:  \nColor Averaging\n\n# 3.1 Prelude\n\
    \nOne of the significant primary attributes of any image is its color, which can\
    \ be utilized to generate meaningful features for content-based image classification.\
    \ Rich literature is available on the proposition of assorted techniques for generating\
    \ robust descriptors with color features. A popular algorithm, color difference\
    \ histogram (CDH), extracts color features by computing intuitively the consistent\
    \ color difference between two points with diverse backgrounds [1,2].\n\nEfficacy\
    \ of image indexing and recognition with color is well formulated by using color\
    \ colorogram by means of joint probability [3]. Color distribution is considered\
    \ a universal image characteristic to stimulate content-based image recognition\
    \ in recent literature [4]. Another efficient technique of designing descriptors\
    \ is color histogram, which largely has been studied and implemented in recent\
    \ works [5,6].\n\nColor moments (CM) have also shown significant performance as\
    \ a robust feature vector to enhance precision for content-based image classification\
    \ [5].\n\nThe state-of-the-art techniques of extracting feature vectors using\
    \ color features have motivated the proposition and implementation of two novel\
    \ techniques for extraction of feature vectors using color characteristics of\
    \ images. The following techniques have explored the color features to generate\
    \ meaningful descriptors for content-based image classification.\n\n+   - Block\
    \ truncation coding (BTC) with color clumps\n+   - Sorted block truncation coding\
    \ (SBTC) for content-based image classification\n\nPrior to elaborating on the\
    \ algorithms behind the two techniques, the following section briefly discusses\
    \ the concept of block truncation coding."
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 3.2 Block Truncation Coding


    Block truncation coding (BTC) is one of the widely accepted compression algorithms
    due to its simplicity of implementation. The working principle of this algorithm
    initiates with segmenting the image into n × n (typically 4 × 4) non-overlapping
    blocks [7]. Primarily developed for grayscale images in 1979, the algorithm was
    one of the benchmarked techniques during the inception of image processing. The
    popularity of the algorithm motivated developers to extend it for color images
    at a later stage. The algorithm functions by coding the image blocks one at a
    time. Fresh calculation of values for the reconstructed blocks is based on the
    mean and standard deviation for each block, which maintains values of mean and
    standard deviation similar to that of the original block (Fig. 3.1).


    # 3.3 Feature Extraction Using Block Truncation Coding with Color Clumps


    The concept of BTC is used as a precursor of this feature extraction technique
    by differentiating each color component—namely, Red (R), Green (G) and Blue


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_56_0.png)


    FIGURE 3.1

    Block Truncation Coding with R, G and B Components as Blocks.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '(B)—as blocks from the images. Henceforth, the computation of color clumps
    for feature extraction is carried out with the Wang dataset in RGB color space.

    A step-by-step guide for feature extraction using color clumps follows:


    +   - Color clump calculation initiates with approximation of gray values for
    individual color components to form disjoint subsets of gray values for the corresponding
    components.

    +   - Next is the logical partition formation of the intensity values into numerous
    subdivisions of color clumps, which involves several stages of color bin formation
    for each R, G and B color component.

    +   - Increase in number of partitions is formulated in multiples of 2 as described
    in Fig. 3.4.

    +   - The partitions are evaluated in the range of 2 to 32 to identify the suitable
    number of clumps for feature vector extraction.

    +   - Each of the five stages of feature extraction is named as BTC with 2 color
    clumps, BTC with 4 color clumps, BTC with 8 color clumps, BTC with 16 color clumps
    and BTC with 32 color clumps respectively.

    +   - All the gray values of a particular partition are compared to that of the
    mean of the gray values for the corresponding partition for each color clump.

    +   - The process eventually creates two different intensity groups having values
    greater than the mean threshold and lesser than the mean threshold respectively.

    +   - The mean upper intensity and mean lower intensity values for the corresponding
    clumps are calculated.


    Thus, one can compute two different feature values of higher and lower intensities
    from a particular clump. This makes the number of feature vectors double the number
    of the color clumps selected (Fig. 3.2).


    ![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_57_0.png)


    FIGURE 3.2

    Distribution of Color Clumps and Feature Vectors (fv) for Each Color.'
  merge: -1
  img_proc: true
