    # 2.6 Extraction of Features with Texture Content


    Texture in images is formed due to variations in the intensity and color. It is
    also present in the form of repeated patterns. Uniformity or placement rules form
    the basic primitives of repetitive patterns. Textures correspond to qualitative
    terms such as coarseness, homogeneity, and smoothness in the physical level. Based
    on the size of the primitives, textures are of two types, micro textures and macro
    textures [85]. Macro texture or coarseness is formed by the larger texture of
    the object, and the smaller textures lead to fine or micro textures. The orientation
    of the texture elements is called directionality. Classification can be performed
    based on the nature of the surface as smooth or coarse. The texture features are
    used to propose adaptive local binary patterns for image classification [86].
    Segmentation based on wavelet statistical texture features is used for classification
    of computed tomography images of the brain [87]. A novel texture pattern representation
    method called Hierarchical Visual Codebook (HVC) is proposed to encode the texture
    primitives of iris images for iris image classification [88]. Important information
    for classification can be extracted from texture-based analysis of land covers
    exhibiting customary patterns in very high resolution remotely sensed images [89].'
