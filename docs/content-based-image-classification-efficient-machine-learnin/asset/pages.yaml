  md: 'process [1]. The working formula for two-dimensional DCT for application on
    an input image P to produce an output image Q can be demonstrated as in equation
    5.1.


    $$Q_{(i,j)} = a_i a_j \sum\sum A_{(u,v)} \cos \frac{\pi (2u + 1)i}{2A} \cos \frac{\pi
    (2v + 1)j}{2B} \tag{5.1}$$ $$a_1 = \begin{cases} 1/\sqrt{A}, & i = 0 \\ \sqrt{2/A},
    & 1 \le i \le A - 1 \end{cases}$$ $$a_i = \begin{cases} 1/\sqrt{B}, & j = 0 \\
    \sqrt{2/B}, & 1 \le j \le B - 1 \end{cases}$$


    A and B are the size of rows and columns respectively for the considered image
    P.


    The number of multiplications and additions required are N²(2N) and N²(2N − 2)
    respectively for a full 2-dimensional DCT for an N × N image.


    The different percentages of fractional coefficients are evaluated for classification
    results by comparing the MR and F1-Score with the Wang dataset initially as shown
    in Fig. 5.2.


    Fig. 5.2 has revealed maximum classification results with 0.012% of full feature
    size of transformed DCT coefficients and minimum with 100% of the coefficients.
    A gradual increase in F1-Score and decrease in MR is observed up to 0.012% of
    feature size. The MR increased and F1-Score decreased with a further percentage
    of 0.006% of partial coefficient. Further, the Precision, Recall, MR and F1-Score
    values for four different public datasets using four different classifiers—namely,
    KNN, RIDOR, ANN and SVM are given in Table 5.3.


    # 5.6.2 Walsh Transform


    A representation of Walsh transform matrix is done with a set of N rows denoted
    by Wj as shown in Algorithm 5.1. The matrix takes on the values of +1 and −1.
    The value of Wj[0] has been considered 1 for all j. The definition of Walsh transform
    matrix is represented by a Hadamard matrix of order N. The Walsh code index has
    specified the Walsh transform matrix row as the row of the Hadamard matrix, which
    should be an integer in the range [0, ..., N − 1]. The corresponding Hadamard
    output code for the Walsh code index equal to an integer j, possessed specifically
    j zero crossings, for j = 0, 1, ..., N − 1. The partial coefficients of feature
    vectors are generated from the transformed coefficients of Walsh transform [2].'
