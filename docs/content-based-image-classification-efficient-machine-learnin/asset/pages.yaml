- pgno: 13
  md: '# Preface


    Mass popularity of expression of feelings and emotions with stunningly captured
    images, ideograms and smileys is no less than a pandemic in contemporary times.
    Applications such as Pixlr, Google Lens, etc. are default softwares in almost
    all our smart phones and PDAs. Currently, images are not only captured to create
    self portraits or vacation photographs, but also have far-reaching implications
    in terms of business value to organizations. Image data uploaded in public forums
    (social media) is used as a crucial source to understand dynamic consumer behavior
    online. It is also used to identify brands during online shopping and hence contributes
    directly to business revenue generation. However, in all these applications one
    thing is common: All the popular applications use image data by its content in
    terms of color, texture, shape etc. None of these require any text annotation
    to identify similar images online or offline. The reasons for developing these
    kinds of applications are simple. Users are interested in capturing images but
    not in tagging them professionally. Secondly, vocabulary may not be enough at
    times to describe image content.


    This book is a comprehensive roadmap for step-by-step applications of content-based
    image identification techniques. The book thoroughly covers assorted techniques
    for implementing content-based image identification with enhanced precision. It
    illustrates the applications of diverse machine learning techniques to facilitate
    the process of content-based image recognition. The book is a guide to the effective
    utilization of softwares and tools essential to pursue the process of content-based
    image recognition with high accuracy and less computational overhead.


    Recent times have witnessed a surge in applying deep learning techniques to image
    data. Most content-based image classification tasks can be accurately executed
    using deep learning techniques, however these techniques are plagued by the following
    shortcomings:


    +   - seldom perform well for small datasets

    +   - require a huge amount of training data

    +   - have high computational overhead

    +   - require costly hardware

    +   - are time-consuming'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Apart from the aforesaid limitations, deep learning is more of a tool expertise
    than a domain expertise. For a learner, using deep learning techniques in the
    first go will never enable understanding of image processing basics necessary
    to fine-tune the performance of systems implementing content-based image classification.
    Moreover, the implementation overhead itself is a challenge for experimentation
    purpose with content-based image data.


    This book readily addresses these shortcomings of the trending approaches and
    fully presents the basics of deep learning based approaches.


    Primarily, the book covers various techniques of image processing including implementation
    of image binarization, image transforms, texture analysis and morphological approach.
    It explains the significance of all these techniques for robust feature extraction
    from image contents. Further, it demonstrates the process of content-based image
    identification with these features using popular machine learning algorithms.
    Finally, it also covers applications of deep learning techniques for feature extraction
    using representation learning. Hence, the book is an enabler toward domain expertise
    of the reader with a blend of application orientation with deep learning techniques.


    I am sure the book will be a true companion to students, research scholars and
    industry professionals who wish to pursue a career in machine learning with content-based
    image data. It is helpful to spawn research ideas for PhD aspirants. It also provides
    the methodologies to design lightweight applications for identification using
    image contents.


    Finally, I express my reverence to Almighty and love to my parents, wife and children
    for their continuous support and inspiration toward my work and experimentations.
    I express my gratitude toward my PhD supervisors, teachers, and collaborators
    from industry and academia, as well as my students and my colleagues for their
    encouragement and belief in my propositions.


    Dr. Rik Das

    Ranchi, India


