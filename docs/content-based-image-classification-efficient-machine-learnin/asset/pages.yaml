  md: '![](img/2bc397c57b3b49c1ff177a21ce3b8fc5_42_0.png)


    FIGURE 2.5

    Structure of a Decision Tree.


    decision trees are differentiated by their evaluation property. The latter one
    assesses average quality of a number of disjointed sets, and the former only gauges
    the quality of the set of instances that is covered by the candidate rule. It
    is important for a rule induction system to generate decision rules that have
    high predictability or reliability; this property is measured by a function called
    rule quality. Both the rule induction and classification processes require a rule-quality
    measure such as J-measure [131]. Rule induction has implemented the rule-quality
    measure as a decisive factor in the rule designing and/or simplification process.
    Classification has combined a rule-quality value with each rule to resolve conflicts
    by satisfying multiple rules by the example to be classified. A number of statistical
    and empirical rule-quality measures are surveyed [132]. An analysis of the performance
    of separate-and-conquer or covering rule-learning algorithms is performed by visualizing
    their evaluation metrics [133]. RIPPER is a well-known rule-based algorithm [134].
    Repeated growing and pruning is followed by this algorithm to grow rules. The
    growing phase is involved in preparing restrictive rules in order to best fit
    the training data. The pruning phase is meant to make the rules less restrictive
    to avoid overfitting, which reduces performance on unseen instances. Hence, the
    distinguishing feature of rule-based classifiers is their unambiguity. Moreover,
    the experts have proposed discretization of features before induction to increase
    classification accuracy with reduced training time [135]. Improved classification
    accuracy of rule learning algorithms is observed by combining features (such as
    in decision trees) by using the background knowledge of the user [136] or automatic
    feature construction algorithms [137].'
