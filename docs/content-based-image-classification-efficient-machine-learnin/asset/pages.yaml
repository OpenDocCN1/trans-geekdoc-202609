    # 2.9.4 Statistical Learning Algorithm


    An overt fundamental probability model has characterized the statistical approaches
    that define the likelihood for an instance to fit in each class, rather than a
    mere classification. Two simple methods, namely, linear discriminant analysis
    (LDA) and the related Fisher’s linear discriminant, are exploited in statistics
    and machine learning to locate the linear combination of features that has the
    preeminent role to separate two or more classes of objects [141]. Measurements
    made on each observation have to be continuous quantities for LDA. A comparable
    technique for dealing with categorical variables has been discriminant correspondence
    analysis [142]. Another wide-ranging technique for estimating probability distributions
    from data is maximum entropy. The overriding principle followed by maximum entropy
    has to have maximum possible uniform distribution when nothing is known and have
    maximal entropy. Labeled training data is instrumental to develop a set of constraints
    for the model that portray the class-specific expectations for the distribution.
    A good tutorial preamble to maximum entropy techniques is presented in existing
    literature [143]. The most well-known representative of statistical learning algorithms
    is the Bayesian network. An illustrative presentation on Bayesian networks is
    covered in earlier approaches [144].


    # 2.9.5 Support Vector Machine


    The latest supervised machine learning technique is the Support Vector Machine
    (SVMs) [145]. SVMs encompass the concept of a “margin”—either side of a hyperplane
    that distinguishes two data classes. The reduction of an upper'
