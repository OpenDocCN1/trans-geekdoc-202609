    # ## 8.4 Feature Extraction Applying Discrete Cosine Transform (DCT)


    A finite series of data points can be represented by discrete cosine transform
    (DCT) as a summation of oscillating cosine functions with different frequencies.
    DCT is a separable linear transformation technique analogous to discrete Fourier
    transform (DFT), but it deals with real numbers. The working formula is given
    in equation 8.7.


    $$X_{(m,n)} = a_m a_n \sum\sum R_{(i,j)} \cos\frac{\pi(2i+1)}{2R}\cos\frac{\pi(2j+1)}{2C}
    \tag{8.7}$$


    Rows and columns are denoted by R and C for the test image.


    It is applied as a feature extractor on significant bit planes identified from
    the red, green and blue color components of the odd image variety created as the
    test image. The transformation technique is chosen for feature extraction due
    to its intrinsic property of shifting the high energy coefficients of an image
    toward the upper right corner and low energy coefficients toward the lower right
    corner. This property has enabled the selection of partial transform coefficients
    as the extracted feature vector which has drastically reduced the feature vector
    dimension. An illustration of this process is shown in Fig. 8.5.


    As illustrated in Fig. 8.5, primarily DCT is applied on each of the color components
    to extract transform coefficients as feature vectors. Thus, the dimension of the
    feature vector during the initial phase is equal to the size of'
