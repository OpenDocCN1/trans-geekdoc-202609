  - 5. 由于上述非线性建模会受到复制工厂过程的影响，因此引入了稳定器模块处理数据中的噪声和未知扰动。
- - '#'
  - 6. 上述扰动被限制在由先前扰动的段线性函数（PWA）定义的允许列表中（Bemporad et al., 2004）。非线性 MPC 旨在最小化代价函数，以达到目标系统所需的设定点范围。HMAMnet
    输出（未来的 MV 变化）通过模糊优化器验证并反馈过程，而 CV 与设定点之间的偏差决定了是否再次对模型进行在线调整。该模型渐近收敛得更快且更接近所建模的过程。
