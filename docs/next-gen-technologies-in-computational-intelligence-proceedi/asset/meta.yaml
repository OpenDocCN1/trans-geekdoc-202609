  - 隐写术是将隐私信息隐藏在无害载体介质（如图像或视频）中的艺术与科学。为了在保持数字照片审美价值的同时保护通信免受窥探，该项目旨在开发一种隐写系统。秘密信息将首先使用提出的方法进行加密，然后嵌入到载体图中。系统将使用一个只有发送者和预期接收者才知道的密钥，以确保嵌入信息的安全性。系统还将整合健壮的纠错码，以增强信息传输的可靠性和准确性。通过结合定量和定性参数（如审美吸引力、信息隐藏能力和抗攻击性），对建议的隐写系统进行评估。评估结果将用于验证所设计系统的效能，并确定需要额外开发的领域。
- - '###'
  - 7. 所提方法首先使用 AES（一种广泛使用的对称密钥加密算法）对秘密信息进行加密。然后，通过随机比特技术，修改少数选图像像素的最低有效位来反映加密信息的比特，从而将加密信息添加到图像中。由于使用了随机比特，攻击者将很难判断其中是否存在秘密信息。为了评估所提策略的有效性，我们使用广泛使用的照片数据集开展了多种实验，并将结果与最先进方法获得的结果进行比较。实验结果表明，所提方法对于压缩、隐写和图像处理等各种类型的攻击提供了高水平的安全性和健性。所提方法为在数字照片中有效且安全地隐藏信息提供了一种潜在解决方案，并可以应用于军事、间谍和通信等多种场景。
