  \n## 结论\n\n本研究考虑了使用视觉密码学和水印进行数据安全。以往研究的问题是，传统方法忽略了图像质量、数据安全性能。因此，所提工作考虑了一种混合方法来保护多媒体数据。这里考虑了水印和视觉密码学。最后，对图像质量、性能和数据安全的对比分析确保了所提模型提供了更好的图像质量，且由于图像压缩，数据传输性能较高。此外，发现所提工作比传统方法更安全。\n\
  \n## 未来前景\n\n数据隐藏、图片安全、彩色成像和多媒体只是视觉密码学的许多应用之一。犯罪中的数据隐藏、文件格式等是视觉密码学大显用场。为了对数字数据提供更大的保护，可以将水印与加密机制结合使用。使用水印技术在图像中隐藏隐藏水印的最常用方法是对载图进行\
  \ `LSB` 替换。主水印通过这种方法编码并放置在图片中。在嵌入之前对水印进行加密主要是出于安全考虑。对于加密和解密，均采用了 `A5/1` 算法。\n\n\
