  \ `tkumar@hindustanuniv.ac.in`, `bhavesh03042002@gmail.com`\n\nDOI: `10.1201/9781003430452-71`\n\
  \n## 摘要\n\n电子商务行业在过去十年中增长迅速。人工智能（AI）以积极的方式显著影响着客户的购买决策和行为。为了吸引客户，用户体验和用户界面的研发一直在不断发展。用户体验的目标是通过提供满意的体验来维持用户对产品或品牌的忠诚度。通过提供多种语音控制策略和一套产品评测系统，自然语言处理这一人工智能分支使企业能够定制其电子商务应用并提升客户体验。使用\
  \ MERN 栈构建的应用程序平台具有更小的程序包体积，从而增强性能。MERN 栈由 `MongoDB`、`Express.JS` 框架、`React.JS`\
  \ 库和 `Node.JS` 组成。鉴于在线客户日益增多，理解他们的需求和行为至关重要。因此，电子商务公司结合了人工智能技术，以确定客户对在线商品服务的需求和偏好。人工智能跟踪客户在特定期间的偏好、购买习惯、购买频率和平均金额。结果，这些数据使企业能够根据消费者的特定需求和偏好定制其商品和服务。\n\
  \n关键词：自然语言处理，情感分析，语音识别，用户体验\n\n# 引言\n\n技术已成为网络营销必不可少的工具。世界上大多数人对在线购物感兴趣。此外，买家可以根据自己的口味和成本选择一系列商品，而在线购物允许他们比较不同企业之间的价格。带有\
  \ AI 算法的完整电子商务应用的语音控制功能使其能够作为一个在线产品评测的分段系统运行。\n\n\n\n\n`Soni (2020]` 制定了一种使企业能够根据客户独特需求和偏好提供商品和服务的数据。人工智能通过提供产品建议、折扣和各种优惠，帮助用户选择和购买最佳建议的物品和服务。来自哈里亚亚纳邦不同社会经济背景的\
  \ 200 个人为本研究提供了数据。对于在线购物，结果显示人工智能与消费者购买行为之间存在强相关。\n\n### 提议系统\n\n在 Fig. 1 所示的提议系统中，商品和客户的数据库簇连接到特定的前端元素。当用户打开产品并提交评论时，产品评论将通过\
  \ `REST API` 服务传输到后端。后端计算情感值，对评论进行分类，并更改相关的数据库。\n\n![Fig. 1. 应用架构](img/fig71_1_B.jpg)\n\
  \nFig. 1. 应用架构\n\n`REST API` 本质上作为通过互联网在两个系统之间进行安全数据传输的接口。该 API 将模型的输出传递到前端，并将数据传递到部署模型的服务器。组件还根据情感值提供\
  \ Emoji，增强了用户体验。此外，为了执行语音控制任务，支持语音识别的麦克风组件接受语音指令作为输入并将其转换为文本。\n\n在 Fig. 2 所示的提议系统中，产品评论作为输入收集。在数据准备过程中，导入了所有必要的库，包括\
  \ `NumPy`、`Pandas` 和 `TensorFlow`。\n\n![Fig. 2. 基于 CNN 的建议情感分析方法](img/fig71_2_B.jpg)\n\
  \nFig. 2. 基于 CNN 的建议情感分析方法\n\n为了消除获取文本中的噪声数据，进行了数据预处理。在文本完成分词（tokenized）后训练卷积神经网络。因此，通过使用学习到的数值而不是手动方法可以更准确地对文本进行分类。\n\
  \n在 Fig. 3 所示的提议系统中，语音命令输入作为输入收集，并在处理前进行清理并去除噪声数据。语音张量被分割为单词，并进行特征提取。\n\n![Fig.\
  \ 3. 语音识别框图](img/fig71_3_B.jpg)\n\nFig. 3. 语音识别框图\n\n特征提取通过减少冗余数据提高了模型的准确性，并加速了学习速度。带有单词的张量在语音识别模型上训练并转换为文本。\n\
  \n### 算法\n\n输入：`Text File (comment or review)` `T`，情感词典 `L`。\n\n输出：`S[mt=] {P, Ng,\
  \ or N}` 和强度 `S`，其中 `P`: 正性，`Ng`: 否定，`N`: 中性。\n\n初始化：`SPos` 和 `SNeg=0`，其中\n\n`SPos`:\
  \ 构建 `ti-Smt` 中正性标记的极性。\n\n`SNeg`: 收集 `ti-Smt` 中标记的负性极性\n\n开始\n\n1. 对于每个 `ti` ∈\
  \ `T` 执行\n2. 在 `L` 中搜索 `t[i]`\n3. 如果 `t[i]` ∈ `Pos-list` 则 ← `SPos Spos + t[i-smt]`\n\
  4. 否则如果 `t[i]` ∈ `Neg-list` 则 ← `SNeg SNeg+ t[i-Smt]`\n5. 结束\n6. 循环结束\n7. 如果 `SPos>|SNeg|`\
  \ 则\n8. `S[mt] = P`\n9. `S = SPos/(SPos+SNeg)`\n10. 否则如果 `SPos<|SNeg|` 则\n11. `S[mt]\
  \ = Ng`\n12. `S = SNeg/(SPos +SNeg)`\n13. 否则\n14. `S[mt] = N`\n15. `S = SPos/(SPos+SNeg)`18.\
  \ 结束结束\n\n## 结果与讨论\n\n测量了两个模型 `CNN` 和 `Res Net` 的准确率百分比，数据增强产生的准确率分别为 91% 和 75%，如\
  \ Fig. 3 所示。\n\n模型的准确性通过将其预测结果与实际输出进行比较来确定。在这种情况下，准确率记录在不同的 epoch（时代）中，这意味着模型的准确性在每个\
  \ epoch 之后都进行了计算和记录。\n\n最后，“在 epoch 计数 3 时达到最高准确率，如 Fig. 4 所示”表明在训练三个 epoch 后获得了最佳准确率，正如图形或图表（可能是\
  \ Fig 4）所示了每个 epoch 的准确率。评论作为输入，分词器将评论字符串转换为标记，然后发送到模型进行输出。模型为评论分配正值和负值。如果正值和负值大致相等，它分配一个平均标签；如果正值大于负值，则评论被分类为正性，反之亦然。\n\
