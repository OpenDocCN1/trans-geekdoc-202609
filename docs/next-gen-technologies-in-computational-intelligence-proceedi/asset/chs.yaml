  \ reduce the amount of energy used for wireless packet delivery.\n\n\n\n\n\nSCCO\
  \ 是一种基于农田耕种者“移耕轮作”活动的元启发算法过程。在这种学习中，每种作物都代表一个传感器节点。首先，根据性能选择一个`全局耕种者` (`GC`) 作为潜在解决方案。当食物变得稀缺时，`GC`\
  \ 将种群分为若干个小组。每个小组由一个`局部耕种者` (`LC`) 负责。小组成员在一次调查周期后讨论他们的发现，耕种者前往农业土地最丰富的区域（即最优结果）。结果，全局耕种者移动到整体探索结果中的完美位置，而局部耕种者则移动到其所在局部组内的最佳位置。因此，SCCO\
  \ 能够快速找到最佳位置，同时避免收敛到局部最优。\n\n## SCCO 中移耕的概率\n\n### 节点初始化\n\n种群初始化是探索过程的第一步。节点部署使用\
  \ `Eq. (4)`，`SM` 代表搜索空间范围内从 1 到 `N` 的节点。\n\n(1)\n\n```\nSC[ij] = SC[minj] + R[1]\
  \ * (SC[maxj] - SC[minj])\n```\n\n`SC[ij]` 是第 j 维度上的第 i 只蜘蛛猴，`R1` 是一个随机数：`0 < R1\
  \ < 1`，`SC[minj]` 和 `SC[maxj]` 是搜索空间的下限和上限。\n\n## 局部耕种者阶段\n\n局部耕种者（领导）阶段定义为：\n\n\
  (2)\n\n$$\\begin{array}{l} \\left. SC_{i}^{\\text{new~}}\\\\leftarrow SC_{i} + R_{1}\
  \ \\times \\left( {Lc - SC_{i}} \\right) + R_{2} \\times \\left( {SC_{r} - SC_{i}}\
  \ \\right), \\right. \\\\ {i = (1,2,\\ldots,\\text{N})} \\\\ \\end{array}$$  \n\n\
  其中 `N` 是移耕的数量，`SC[i]^(new)` 是第 `i^(th)` 次移耕的更新位置，`SCi` 是其当前位置，`R[1]` & `R[2]` 分别表示\
  \ `(0,1)` 与 `(1,1)` 之间的随机数，`Lc` 是局部耕种者的位置，`SC[r]` 是从同一组中随机选择的移耕者的位置。如果 `r 1 > PR`，则评估\
  \ `(5)`；其中 `PR` 是扰动率。\n\n## 全局耕种者阶段\n\n此阶段位于局部耕种者阶段之后。在这里根据 `Gc` 经验、社会经验和毅力更新 SC\
  \ 的位置。在此阶段，位置更新公式如下：\n\n(3)\n\n$$\\begin{array}{l} \\left. SC_{j}^{\\text{new~}}\\\
  \\leftarrow SC_{j} + R_{1} \\times \\left( {Gc - SC_{j}} \\right) + R_{2} \\times\
  \ \\left( {SC_{r} - SC_{j}} \\right), \\right. \\\\ {i = (1,2,\\ldots,\\text{N})}\
  \ \\\\ \\end{array}$$  \n\n`Gc` 持有全局耕种者的位置。在此阶段，根据从适应度值中计算出的概率 `Pi` 更新 SC 的位置。结果，优越的候选有更大的概率获得升级。\n\
  \n(4)\n\n$$P_{i} = 0.9 \\times \\frac{fit_{i}}{\\text{max}\\}_{\\text{f}}\\text{it}}\
  \ + 0.1$$\n\n第 i 个 SC 的适应度为 `fit`，作作集群中的最大适应度值为 `max_fit`。只有当 `Rl < Pi` 时，才会创建 SC\
  \ 的新位置并计算适应度率。将新的适应度值与之前的进行比较，如果新值更好则采用新位置。\n\n## 局部耕种者决策阶段\n\n如果局部耕种者在局部耕种者阶段未达到预设限值，小组成员将定期使用随机初始化或基于全局耕种者经验的\
  \ `PR` 数据调整其位置：\n\n(5)\n\n```\nSC[j]^(new) ← SC[ij] + R[1] * (Lc - SC[ij]) + R[2]\
  \ * (SC[rj] - Lc)\n```\n\n## SCCO 聚类路由拓扑\n\n### SCCO 能量模型\n\n当发射器与接收器之间的距离“dis”低于阈值\
  \ `disO` 时，\n\n(6)\n\n$$E_{\\text{Trans~}} = l \\times \\left\\{ \\begin{matrix}\
  \ {Em_{\\text{cons~}} + Em_{\\text{free~}} \\times dis^{2},\\text{~if~dis} < dis_{0}}\
  \ \\\\ \\\\ {Em_{\\text{cons~}} + Em_{\\text{multi~}} \\times dis^{4},\\text{~if~dis}\
  \ \\geq dis_{0}} \\\\ \\\\ \\end{matrix} \\right.$$  \n\n其中 `Econs` 是在发射器或接收节点处消耗的能量。`Emfree`\
  \ 和 `Emmultiare` 分别代表自由空间和多路径能量。通过阈值 `dis0`。\n\n(7)\n\n$$\\sqrt{~Emfree/~Emulti~}}$$\n\
  \n接收数据包能量 `ERecv` 通过 `Eq. (8)` 给出：\n\n(8)\n\n```\nERecv = l × Econs\n```\n\n## SCCO\
  \ 选择\n\n### 使用 SCCO 选择 CH\n\n1. 初始化种群，局部耕种者限值及全局限值\n2. 通过 `(9)` 计算适应度\n3. 通过贪心算法选择局部和全局耕种者\n\
  4. 循环（不满足终止条件）\n    1. 通过 `(2)` 找到所有作物的新位置\n    2. 贪心规则\n    3. 根据 `(3)` 的概率 `P[i]`\n\
  \    4. 根据 `(4)` 更新局部和耕种者位置\n    5. 根据 `(5)` 更新局部耕种者位置\n    6. 结束\n\n## 结束循环\n\n\
  选择能量最大的节点作为 CH。通过：\n\n(9)\n\n```\nERE = E0 - Econs\n```\n\n`ERE` 是剩余能量，`E0` 是初始能量。因此，选择距离目标最近的节点作为\
  \ CH。\n\n(11)\n\n```\nDest = Dest(Ni)/N\n```\n\n其中 `(Ni)` 是距离。从发送端到接收端发送数据可以改进系统。\n\
  \n\n\n\n\n图 1. (a) 三跳 SCCO 优化网络的包错误率 (PER)；(b) 三跳 SCCO 优化网络关于有效负载大小的 PER\n\n在 120\
  \ cm 的最小距离处，数据传输的误差约为 0.15 p.u.。可以使用此信息确定具有最佳尺寸数据包的路由。图 1b 显示了由于有效负载增大导致的 PER 上升。该测试在\
  \ 150 cm 和 200 cm 两个不同的源尽距离下，在 `0` 到 `300-bit` 数据包大小范围内对所有三个网络进行了测试。当有效负载超过传输链路的容量时，PER\
  \ 速率也会随之上升。\n\n## 结论\n\n在本文中，了一种基于移作作的优化（`SCCO`）来展示一种生物启发优化过程。`SCCO` 过程通过将植物特征（如植物大小、果实大小、果实颜色和颗粒数量）作为变量来实现。为了获得给定优化问题的解集，将田地中的植物视为种群并考虑搜索空间。然后从该种群中选择在所有特征上都表现优的植物作为最优解。它被用于控制\
  \ `WSNs` 和 `IOTs` 驱动的网络中的包大小。通过将模拟结果与使用 `S2SO`、`PSO` 和 `ACO` 等传统算法在 `PER`、`EE` 和能量消耗方面的结果进行对比，证明了该算法是有效的。\n\
