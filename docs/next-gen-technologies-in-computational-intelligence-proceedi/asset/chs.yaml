  \ 医学影像学报, 41(7)，第 1688-1698 页。\n\n# 基于物联网的土壤湿度预测开发\n\nS. Shenbagavadivu,^(⁶¹)\n\n\
  DOI: [10.1201/9781003430452-76](https://dx.doi.org/10.1201/9781003430452-76)\n\n\
  ## 摘要\n农业是该国独特的经济部门。农业的主要问题包括地下水、肥料以及保护性耕作。淡水资源已经面临紧张，在许多国家仍被浪费地使用。利用物联网和机器学习方法可以优化农业灌溉的水资源利用。在一种物联网驱动的智能灌溉框架中，Floret\
  \ 浸渍人工神经网络（FI-ANN）被用于预测田间的土壤湿度。未来的土壤湿度通过部署的传感器数据（空气温度、空气湿度、土壤湿度、土壤温度、辐射）以及在线天气预报信息进行预测。根据实验结果，平均\
  \ RMSE 为 0.0019。研究了各种机器学习方法预测未来土壤湿度的有效性，GBRT 的结果非常非常有前景。\n\n关键词：物联网、土壤湿度、农业灌溉、机器学习、Floret\
  \ 浸渍人工神经网络\n\n# 引言\n耕作对每个国家的进步起着至关重要的作用。它在改善国家经济方面做出了巨大贡献。真实土壤的评估是辅助农业发展的关键措施。土壤测试是提高农业产出的主要障碍。目前，土壤测试主要是人工完成的，非常繁琐且容易出现人为错误。在农业中，预测土壤类型对于提高产量至关重要。为了尽量减少土壤边界的人工测量，利用了包括土壤湿度、环境温度以及氮、磷、钾等土壤添加剂在内的多种传感器来识别土壤边界（NPK）。根据土壤边界值预测土壤类型。为了避免现有的土壤测试程序，牧户可以使用所提技术来整合生长所需的必需肥料。牧户需要更先进的农业和技术理念来帮助他们提高生产力。通过采用基于物联网的农业框架，可以感知土壤种类并识别相应的产量。农业取决于特定地区的地形区域和气候条件。它确实有助于牧户扩大任何作物的开发。基于地形的定制化作物建议框架。它获取客户信息，并根据其区域和过去的发展情况提供定制化建议。智能化的种植过程变得有意义，展示了用于节水的有效策略。智能指南在执行过程中，显示了用于节水的有效策略。\n\
  \n本研究探讨了基于机器学习的利用现场传感器数据和天气预报信息预测未来土壤湿度的方法。这为本研究提供了动力，该研究使用了 Floret 浸渍人工神经网络（FI-ANN）来预测田间的土壤湿度。\n\
  \n\n\n\n农业作为一个受预期的领域，应当通过人口的发展来抵消。Olmstead 和 Rhode (2009) 发现，尖端农业框架正在普及，工作趋于集中。20\
  \ 世纪 20 年代和 1970 年代初期使用的信息资产为 30%，带来了 180%的产量。此外，产量的增长并非源于所用信息源的增加，而是源于有效耕作的发展。近期，专家们已经意识到，过滤机、机械进步和工程肥的使用计算了农业效益。农业从业者开始使用数据和通信技术来整理他们的财务数据，并根据过去十年的离群值数据来监控他们的业务交易。如今，信息被认为是个人生活的根本组成部分（Tune\
  \ et al., 2021）。推荐系统通常用于许多网络应用，包括电子商务、报告、农业以及其他领域。农场数字化是推动农业现代化扩张的主要动力。随着农业发展发展中信息框架增长的演变，利用现有的数据技术变得越来越重要，以实现定制化的农业数据资产建议优势，并为客户提供相关且成功的数据已成为一种可行方案。本文旨在根据先进的推荐框架，对农业数据使用的最新研究工作进行广泛综述。本文直接描述了用于确定论文的内容分析方法。Balducci\
  \ et al. (2018) 旨在揭示监控源自真实数据集并收集了实体、自然和触觉特征的异构数据和信息的最佳技术。当利益组织——无论是公共还是私有，无论大小——寻求在减少成本的同时增加生产力时，找到利用通常被记录和追求的可用信息的适当方法可能是实现这些目标的最优选择。农业行业对新技术具有抗性，而通过将物联网（IoT）世界观应用于实时处理自然和可证明的统计数据，“智能农场”概念正变得越来越深远。作者\
  \ Prabha et al. (2018) 指出，IoT 使一个由互联网关联对象的组织配备了用于通过嵌入式传感器或设备来收集或更改数据。它基本上是将机器与世界上某处的具有\
  \ IP 地址的设备连接。它倾向于与世界上任何地方的其他设备相似连接，被称为互联网。IoT 需要一种全新的世界观来在远程传感器网络中共享精确信息时提供理想组织执行。由于\
  \ `WSN` 是数据驱动的，数据处理是 `WSN`网络中的基本问题，这决定了 `WSN`的性能。通常，传感器节点由电池供电，根据作者 Penet 和 Elliott\
  \ (2008) 的描述，能量有限。在精准农业中获取并处理了大量信息。这种利用 `WSN` 的精准农业思想将帮助农户通过应用新技术替代传统的耕作实践来扩大作物产量（Lea-Cox\
  \ et al. 2008）。\n\nGreen et al. (2009) 认为农业产量是不可思议的。利用 IoT 和 AI 程序的智能水系统在理想水资源利用方面发挥着巨大作用。如果植物经常没有得到充分关注，将对植物产生极端影响。建议的策略在观察大型农田方面表现良好。该框架有助于根据\
  \ Gutierrez et al. (2013) 指出的不同传感器边界，预测根据水系统需求规划的水系统。\n\nAyday and Safak (2009)\
  \ 根据 IoT 区分了精准农业的两个广泛应用领域，用于收集和分析数据，以根据环境状况的变化监测储水网络项目。考虑到进展，IoT 使一个互联网关联对象的组织能够通过嵌入式传感器或设备来收集或更改数据。\n\
