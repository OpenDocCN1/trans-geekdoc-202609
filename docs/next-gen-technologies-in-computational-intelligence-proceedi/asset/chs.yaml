  \ Q. Weinberger. (2016). 稠密连接卷积网络\n\n# 使用贪心算法最小化视频直播 P2P 网络中的带宽\n\nKarthikeyan Kaliyaperumal^(²⁶)\n\
  \n电子邮件：kirithicraj@gmail.com; kannaiyaraju123@gmail.com\n\nDOI: [10.1201/9781003430452-34](https://dx.doi.org/10.1201/9781003430452-34)\n\
  \n## 摘要\n\n多年来，对等网络（P2P）计算应用呈惊人增长，海量数据穿越网络给互联网服务提供商（ISP）带来了沉重负担。近期研究表明，这些对等网络应用增加了全球在线流量，导致\
  \ ISP 活动异常活跃。因此，估计研究和行动构建（TE）至关重要，它可以减少增加的迁移。若干评估整体活动的模型未能捕捉各种分布式系统的特征。在研究的第一部分，我们通过考虑节点之间的距离、伙伴数量以及每个关联框架的响应率等因素，评估了每个关联节点之间的移动性。然后，提出了一种发送备份设备的贪心启发策略，用于在伙伴节点之间传输备份设备。通过采用这种方法，可以减少共享应用程序的网络流量。\n\
  \n关键词：分布式计算、贪心算法、网络流量、P2P 网络、视频直播\n\n# 引言\n\n分布式（P2P）系统是由两个或多个 PC 关联形成的，这与客户/服务器模型不同；在后者中，客户提出管理请求而服务器满足请求；P2P\
  \ 系统模式允许每个节点同时作为客户和服务器工作。\n\n在这样的系统中，P2P 系统上的每台 PC 都变成了记录服务器和客户。由于其不同的应用场景，对等网络配置近年来已吸引了全球大量的客户端，这让我对这种关联的真实数量产生了兴趣。这种系统可以简单到：在同一个房间内的两个人通过通用串行总线（USB）短暂连接他们的\
  \ PC，使他们能够专门相互交换或共享文档。它也可以包含一个更持久的系统，例如，小办公室里的约六台电脑通过铜缆连接在一起。在此类系统中，每台 PC 一旦接入系统，就同时担任服务器和客户。\n\
  \n这些分布式框架就是 `P2P` 系统。`P2P` 框架的目标是使用 `greedy algorithm` 最小化带宽。`greedy algorithm`\
  \ 用于在每个阶段寻找局部最优，以期找到全局最优。在视频直播的背景下，`greedy algorithm` 用于选择数据传输的最优路径，以最小化所占带宽。\n\n\
  ![图 1. 对等网络流量](img/fig34_1.jpg)\n\n\n\n\n直播是一种视频实时流出的阶段，允许客户端利用摄像头和连接 Web 的 PC 实时通信视频内容。它通过网络传输或接收某个事件的实时视频和音频范围。直播流媒体构成了互联网活动的一个大分区，被称为\
  \ `P2P` 网络活动。\n\n在录像流中，流媒体视频是通过封装结构在整个网络发送的内容，并由观众逐步显示。直播指的是随着事件发生而连续传输的互联网内容，就像直播通过无线传输电缆电视信号传输其内容一样。直播的最佳案例是\
  \ `SKYPE`、`IMO`、`MESSENGER` 等。其他类型的案例包括摄像机、音频接口和屏幕捕获接口。\n\n本文的组织结构如下：第一节介绍了 `P2P`\
  \ 计算，第二节展示了 `P2P` 计算流量的文献综述，在此处清楚地解释了减少 `P2P` 网络流量的实现方法。第三节给出了所提出的贪心算法，用于减少 `P2P`\
  \ 网络中的流量。\n\n## 文献综述\n\n无线网络上的视频流概述了远程系统中视频流传输的特殊挑战。视频流应用的最佳案例是家庭系统。在本文中，我们扩展了远程系统视频流的关键问题。随着日益增长的速率控制，系统以及在不同视频流之间的资源分配得到了优化（[Zhu\
  \ & Girod, 2007)）。\n\n`ROM` 是最大的网络供应商之一。其他结果运动研究并已在本文中考虑。目前，我们发现了一个实务上稳定的 `P2P`\
  \ 比例和总用户数。这种技术收集了从 `p2p` 活动通用行为中获得的标准配置。我们证明了 `P2P` 和非 `P2P` 数据流的包级信息基本上是相似的（Perényi\
  \ et al., 2006）。\n\n共享系统的理想文件循环学习了扩散最初位于服务器的文档的问题。服务器和伙伴通过中心系统相互连接。下载了文件的对等节点可以传输给不同的伙伴。我们的目标是最小化制作范围（Goetzmann\
  \ et al., 2011)）。\n\n利用感兴趣视频服务上的需求增强方法来控制 `P2P` 系统中的流量。软件工程和技术的发展为 `P2P` 规划和文件共享方法提供了更好的机会。因此，对系统活动属性的广泛视图对于解决后期需求以及放大有助于增强系统性能的构模型至关重要。它主要关注无监督机器学习方法（`Un-SMLA`）。`Un-SMLA`\
  \ 是一种人工智能方法，信息从一个框架开始到下一个框架在 `P2P` 系统中的迁移不取决于当前状态可用的活动所正在学习的工具（Thouin & Coates,\
  \ 2007）。\n\n在此，讨论了流污染攻击，攻击者将污染的包混合到 `P2P` 获取中，破坏接收者媒体的性质。四种可能的污染攻击：抵制、活动加密、哈希检查和分片标记。这种进入高带宽连接的方法。为了执行这些安排并评估它们在控制\
  \ `P2P` 直播视频流污染方面的有效性。最后，我们认为包标记安排通常是合适的（Dhungel et al., 2009）。\n\n在非结构化 `P2P` 框架中，对等节点自己组成一个任意覆盖层。查询可以路由到合适的伙伴，而不是广播或使用随机选择。我们技术的基本目标是通过从过去的搜索查询中获取的使用信息，在非管理任务中实现最佳结果。测试结果表明我们的技术是有效的，且性能优于关于活动的任何其他非语义查询路由策略。系统活动属性的广泛视图是值得的，以应对后期需求并放大有助于增强系统性能的构模型（7）。\n\
  \n\n\n\n一种利用 P2P 注册对感兴趣的视频进行多级存储以维护信息段的有效策略。感兴趣的视频是一种策略，其中信息段从邻居节点获取，而不是从视频服务器下载。信息段存储在不同层级的节点中，例如，硬盘存储和精细预留。信息段根据其普遍性进行下载。已经引入了一系列存储替换算法，用于用新到达的信息段替换旧的信息段。如果信息段是可用的，则请求的节点可以获取它，否则它可以寻找下一层存储。所提的算法主要用于处理高质量和高效率的信息段（Narayanan\
  \ & Arun, 2012）。\n\n一种利用多级缓存和基于传输能力的分组在 P2P 构图中进行视频内容管理的有效方法。点对点（P2P）构图是发展最快的技术之一，因为不断变化的个人需求和欲望正在超出限制。P2P\
  \ 技术始于文件共享、视频和 P2P 注册。缓存使得视频内容的可用性较低。为了解决这一问题，多级缓存通过特定的目标保留旧段以提高速度（(Surya et al.,\
  \ 2022）。\n\n利用机器学习方法对 P2P 系统中根据季节性和普通普遍性视频的视频服务器进行排序。（P2P）注册和应用在工程和技术的大多数关键领域有广泛应用。视频服务器在缓存内存中维护视频内容连接至关重要，因此缓存内存尺寸将扩大到积极水平，并且缓存应该由每个伙伴提供安全支持。该工作通过\
  \ Java 编程语言实现（(Do et al., 2004）。\n\nP2P 网络管理扩展到远程传感器系统。在传感器节点中，基于策略的管理应用程序将在无线传感器网络（WSN）的本地内存中存储一组策略，并在需要额外策略的随时重用。为了处理这些问题，产生了一种名为\
  \ `Parallel Execution of Tiny Policy` 的操作，用于在 WSN 中存储、查找和执行策略。P2P 系统在设计应用方面非常灵活，并且可以解决大多数针对\
  \ WSN 的危险问题（Prasad et al., 2022）。\n\n## 提的贪心算法\n\n贪心算法是一种数值搜索程序，通过选择哪一步将提供最明显的优势，为复杂的、多步骤的问题寻找简单、易执行的答案。\n\
  \n此类算法被称为贪心算法，虽然每个较小情况的理想答案将产生立即收益，但算法并没有考虑整体大问题。一旦做出选择，就永远不会重新评估。贪心算法通过从最小可能的组成部分递归地构建项目排序来工作。\n\
  \n为了减少 P2P 活动，我们利用贪心算法来发送缓存设备，这些设备可以存储客户最近请求的物品。该模型可以减少 P2P 网络的活动负载。该框架在实体应用领域更有帮助。利用贪心算法来处理优化问题。贪心算法通过在任何时刻选择看起来最有希望的选择来工作；它永远不会重新检查此选择，无论以后发生什么情况。\n\
  \n由于 P2P 应用的高普及性和大量用户，活动随之增加。因此，在 P2P 系统中活动估计和寻找最佳排序变得非常重要。所提框架预计提供贪心启发式算法来传输缓存设备，这些设备可以存储客户最近请求的物品。该模型可以减少\
  \ P2P 框架的活动负载。框架在实体应用区域更有价值。该框架包含在分布式框架中寻找减少活动以达到优性的以下阶段。\n\n## 贪心算法结构\n\n首先，所选物品的排序是空的，即空集。在每个阶段，将通过选择能力将物品包含在结果集中。如果该集合将不再可行，则拒绝考虑中的物品。`ELSE\
  \ IF 集合仍然可行则包含当前物品。`\n\n## 结果与实现\n\n贪心算法用于获取静态模式的最极概率参数，该模式通过重复遵循前述部分指定的阶段，通过测量所有点对点点系统流量属性来发现系统内伙伴节点之间的流量流。随后，通过使用贪心启发式算法，通过计算收益连接实用能力来发送缓存设备，这决定了我们需要在哪里引入缓存，借此我们可以减少整个系统的活动。通过使用这种策略，可以减少约\
  \ 40% 的点对点活动并扩展框架的吞吐量。\n\n## 汇总误差与距离因子\n\n为了计算用于评估点对点系统流量的模型准确性，我们考虑了累积误差指标。收集的误差可以包含所有源和目的流的估计误差。我们还认为另一个参数分离组件，通过不同的估计值来发现模型的估计精度。我们获取这两个参数并通过模拟框架绘制图表。\n\
  \n检查系统性能的另一个参数是系统的吞吐量。在所提系统中，我们通过计算系统中每条连接上的活动来发送缓存设备。这些设备可以存储客户最近请求的对象。如果客户请求相同的问题，缓存设备可以提供服务。因此，流量和拥塞可以减少。在这里我们检查在特定时间内移动的数据包数量。表\
