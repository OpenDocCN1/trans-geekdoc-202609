  \n## 实验结果与讨论\n\n### 测量指标\n\n基于分类的机器学习结果可以通过混淆矩阵进行分类。源自多分类分类混淆矩阵的常用指标用于比较检测性能，所有这些指标属于监督学习机器学习方法，并经过了训练和评估。最后，使用各种测量指标（Marom\
  \ et al., 2010）对每个算法的性能进行评估。\n\n1. **准确率 (Acc):**\n\n准确率描述了准确性。通过使用多分类混淆矩阵产生的标准指标对比检测性能。准确水平表示整个预测的精确程度。\n\
  \n(1)\n\n$$\\begin{matrix} & {Acc = TP + TN} \\\\ & {TP + TN + FP + FN} \\\\ \\\
  end{matrix}$$\n\n2. **召回率 (Recall):**\n\n(2)\n\n`TPR`  = `TP`\n\n`TP`  + `FN`.\n\
  \n3. **精确率 (Precision):**\n\n当假阳性成本很高时，该指标特别有益。\n\n(3)\n\n$$\\begin{array}{l} {PPV\
  \ = TP} \\\\ {TP + FP} \\\\ \\end{array}$$\n\n4. **F1 分数：**\n\n它检查了被归类错误的类别。\n\n\
  $$\\begin{array}{l} {Fm = 2*TP} \\\\ {2TP + FP + FN} \\\\ \\end{array}$$\n\n这些评估指标用于展示所提策略的性能，并衡量了每个模型的性能。\n\
  \n![Fig. 4. 准确率比较](img/fig22_4_B.jpg)\n\n图 4. 准确率比较\n\n![Fig. 5. 恶意软件检测结果](img/fig22_5_B.jpg)\n\
  \n图 5. 恶意软件检测结果\n\n## 结论\n\n本研究调查了监督学习分类背景下恶意软件检测的集成技术。\n\n与其他特征选择策略相比，我们采用了五种不同的特征。通过采用各种算法进行分类，获得了良好的准确率。结果还证明了\
  \ K-最近邻分类器的高准确性。这表明这类分类器如何以高准确度交付最优结果。尽管我们建议的集成学习架构能够有效识别和分类各种恶意软件变体和家族，但仍存在一些需要解决的问题。\n\
  \n所建议的基于机器学习的集成学习在分类未知恶意软件以及识别被恶意软件破坏的 Linux API 时表现不佳。在接后的工作中，我们打算将其应用于实时环境，并处理包含不同类型数据的数据集。\n\
