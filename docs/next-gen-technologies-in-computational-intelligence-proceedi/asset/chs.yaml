  \n11. Khairnar, V. D., Pradhan, S.. 车辆自形网络仿真移动模型。2011 IEEE Symposium on Computers\
  \ & Informatics, 460-465.\n\n12. Nawej, C., Owolawi, P., Waling, T.. 使用 `open-`,\
  \ `sumo` 和 `ns-2` 设计仿真 `vanets` 测试平台。2021 IEEE 6th International Conference on Computer\
  \ and Communication Systems (ICCCS), 582-587.\n\n\n\n\n\nJSON Web Token (`JWT`)\
  \ 经常用于信息交换、身份验证和授权。在这些用例中，`JWT` 最的应用是授权。登录后，用户可以通过在任何后续请求中包含 `JWT`，来访问通过该令牌授权的路由、服务和资源。当用户登录时，服务器会创建一个包含该用户详情（包括其用户\
  \ ID 和角色）的 `JWT`。随后，`JWT` 会被传回客户端并存储。然后，服务器可以在处理客户端之后发送的任何后续请求之前，检查 `JWT` 的真实性。因此，服务器端不需要会话状态，从而实现了客户端与服务器之间的安全通信。尽管\
  \ `JWT` 是目前用于“单点登录”的一种非常流行的方法，但它面临着许多挑战。本文讨论了 `JWT` 的不同已知漏洞。\n\n关键词：`JWT`、漏洞、安全、身份验证\n\
  \n# 引言\n\n名为 JSON web token (`JWT`) 的 JSON 对象用于在互联网上两个双方之间安全地传输数据。它可以作为身份验证方法并用于信息交换。令牌主要由头部（header）、载负载（payload）和签名（signature）组成。这三个部分之间用点隔开。`JWT`\
  \ 指定了我们从一方传递到另一方的数据格式，并提供了序列化（Serialized）和反序列化（Deserialized）格式。数据主要通过网络传输，每个请求和响应都使用序列化方法。而读取和写入网络令牌数据使用反序列化方法\
  \ (Mahindrakar & Pujeri, 2020; Ahmed & Mahmood, 2020)）。base64url 编码的 JSON Web 的头部、载负载和签名如图\
  \ 1 所示，用点隔开：\n\n![图 1. JWT 的结构](img/fig28_1_C.jpg)\n\n图 1. JWT 的结构\n\n现在考虑下面提供的令牌示例：\n\
  \n> `eyJ hbGciOiJ lUzUxMils InR5cC16kpXVCJ 9. eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2VyX25hbW\
  \ Ui0iJuaXZIZGIrYS5kb2UiLCJpc19hZG1pbil6 ZmFsc2V9.h4TrOHFXEjBTOoie3Lx RBNWaDOhj7gBVmKS3X0mYkn5GE86C93\
  \ SfXACpVs1FnCOOdhLf5P19X72bgWllyZS1YWYWQ`\n\n头部包含了令牌的信息，包括其类型和签名算法 (Shah & Mehtre,\
  \ 2015)。该实例编码前的头部如图 2 所示：\n\n应用程序将检查的关于用户的信息或主张包含在载负载中。为了创建签名，必须先对头部、点和载负载进行 base64url\
  \ 编码。然后，根据头部给出的对称或非对称加密算法，必须使用密钥或私钥对整个对象进行签名 (Ethelbert et al., 2017)。由于 `HS512`\
  \ 是对称对称算法并包含在头部中，它的加密和签名方式如下：\n\n```\nHMACSHA512( base64UrlEncode(header) + “.”\
  \ + base64Url Encode (payload), secret_key)\n```\n\nbase64url 编码的头部和载负载随后是以下签名：\n\
  \n> `eyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9. eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2VyX25 hbWUi0iJuaXZIZGIrYS5kb2UiLCJpc1\
  \ 9h ZG1 pbil6ZmFsc2V9.h4TrOHFXEjBTOoie3 LxRBNWaDOhj7gBVmKS3XOmYkn5 GE86C93SfXACpVs1FnCOOdh\
  \ Lf5 PI9X 72 bgWUyZS1 YYW`\n\n## JWT 安全缺陷\n\n### 允许 None\n\n`JWT` 标准接受一系列算法：`None`、`RSA`、`HMAC`、`Elliptic\
  \ Curve`（椭圆曲线）等。当应用程序忽略验证其收到的令牌算法是否与其预期的算法匹配时，就会出现 `None` 漏洞。由于由于，即使令牌不再经过签名，应用程序也会接受它。拒绝带有\
  \ `none` 的令牌至关重要，因为它允许攻击者删除签名并修改载负载 (Rawat et al., 2020)。\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9.\
  \ eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2...\n```\n\n令牌在编码和签名后看起来如下：\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9.\
  \ eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2VyX25 hbWUi0iJuaXZIZGIrYS5kb2UiLCJpc1 9h ZG1 pbil6ZmFsc2V9.h4TrOHFXEjBTOoie3\
  \ LxRBNWaDOhj7gBVmKS3XOmYkn5 GE86C93SfXACpVs1FnCOOdh Lf5 PI9X 72 bgWUyZS1 YYW\n\
  ```\n\n### 允许 None\n\n`JWT` 标准接受一系列算法：`None`、`RSA`、`HMAC`、`Elliptic Curve`等。当应用程序忽略验证其收到的令牌算法是否与其预期的算法匹配时，就会出现\
  \ `None` 漏洞。由于由于，即使令牌不再经过签名，应用程序也会接受它。拒绝带有 `none` 的令牌至关重要，因为它允许攻击者删除签名并修改载负载 (Rawat\
  \ et al., 2020)。\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9. eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2...\n\
  ```\n\n令牌在编码和签名后看起来如下：\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9. eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2VyX25\
  \ hbWUi0iJuaXZIZGIrYS5kb2UiLCJpc1 9h ZG1 pbil6ZmFsc2V9.h4TrOHFXEjBTOoie3 LxRBNWaDOhj7gBVmKS3XOmYkn5\
  \ GE86C93SfXACpVs1FnCOOdh Lf5 PI9X 72 bgWUyZS1 YYW\n```\n\n（注：由于原文中 \"Letting None\"\
  \ 部分似乎出现了重复且后续内容不完整，此处已按要求翻译了对应段落）\n\n### 允许 None\n\n`JWT` 标准接受一系列算法：`None`、`RSA`、`HMAC`、`Elliptic\
  \ Curve`（椭圆曲线）等。当应用程序忽略验证其收到的令牌算法是否与其预期的算法匹配时，就会出现 `None` 漏洞。由于由于，即使令牌不再经过签名，应用程序也会接受它。拒绝带有\
  \ `none` 的令牌至关重要，因为它允许攻击者删除签名并修改载负载 (Rawat et al., 2020)。\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9.\
  \ eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2...\n```\n\n令牌在编码和签名后看起来如下：\n\n```\neyJhbGciOiJIUzUxMilsInR5cC16kpXVCJ9.\
  \ eyJuYW11Ijoibm12ZWRpa2EiLCJ1c2VyX25 hbWUi0iJuaXZIZGIrYS5kb2UiLCJpc1 9h ZG1 pbil6ZmFsc2V9.h4TrOHFXEjBTOoie3\
  \ LxRBNWaDOhj7gBVmKS3XOmYkn5 GE86C93SfXACpVs1FnCOOdh Lf5 PI9X 72 bgWUyZS1 YYW\n\
  ```\n\n### 算法混淆\n\n`JWT` 能够支持对称和非对称加密方法。根据加密方法，你必须使用公私密钥对或密钥密钥。非对称加密允许应用程序公开其公钥同时保持其私钥的隐私性。结果是任何人都可以使用公钥验证此令牌并使用其私钥进行签名。被称为“算法混淆”的漏洞出现在应用程序忽略验证收到的令牌是否与其预期的算法匹配\
  \ (Kannan & Umasankar, 2018; Rawat et al., 2020; Darmawan et al., 2022)。\n\n若干库中检查签名的技术：\n\
  \n*   `verify(T, S)` —— 使用对称算法时，`T=令牌`，`S=密钥`\n*   `verify(T, PK)` —— 使用非对称算法时，`T=令牌`，`PK=公钥`\n\
  \n遗憾的是，在某些库中，该方法并未独立验证收到的令牌是否使用适用于应用程序的技术签名。例如，在使用 `HMAC`（对称算法）时，第二个参数将被此技术视为共享密钥，而在使用\
  \ `RSA`（非对称算法）时被视为公钥。如果程序可以访问公钥，攻击者就可以创建有害令牌。当攻击者提供 `HMAC` 而非 `RSA` 时，`verify()`\
  \ 方法将使用对称而非非对称加密，并将公钥视为 HMAC 共享密钥。\n\n### 使用无效密钥\n\n只有使用的密钥才能保证利用对称加密的密码名的安全性。应用程序使用的弱密钥使得攻击者能够进行暴力破解以匹配原始签名。一旦密钥已知，攻击者就可以为伪令牌构建合法的签名。对称加密必须始终使用强密钥以防止此问题。\n\
  \n### 未验证签名\n\n若干 JWT 库提供了两种解码令牌的方法——一种用于解码，另一种用于验证：\n\n\n\n\n* `decode()`：不检查签名；它解码令牌。\n\
  * `verify()`：验证签名并解码令牌。\n\n这些技术可能会被开发者混淆。在这些情况下，程序将接受任何令牌，且签名永远不会被验证（只要格式正确）。此外，开发者可能会在禁用签名验证后忘记重新启用。此类错误可能导致权限提升或任意账户访问。让我们以以下有效令牌为例，它从未被真实验证：\n\
  \n```json\n{\n  \"alg\": \"HS384\",\n  \"name\": \"nivedika\",\n  \"typ\": \"JWT\"\
  ,\n  \"user_name\": \"nivedika.doe\",\n  \"is_admin\": false\n}\n```\n\n为了获得高权限，攻击者可以提交带有任意签名的令牌：\n\
  \n```json\n{\n  \"alg\": \"HS384\",\n  \"name\": \"nivedika\",\n  \"typ\": \"JWT\"\
  ,\n  \"user_name\": \"nivedika.doe\",\n  \"is_admin\": true\n}\n```\n\n### Kid 参数注入\n\
  \n密钥 ID `kid` 可能出现在 JWT 头部中。它经常用于从磁盘或数据库获取密钥。通过 `kid` 参数提供的密钥，应用程序会验证签名。如果该参数可以被注入，则可能发生\
  \ RCE、SQLi 和 LFI 以及签名绕过攻击。让我们开始使用以下有效令牌来演示这一过程：\n\n```json\n{\n  \"alg\": \"HS512\"\
  ,\n  \"name\": \"nivedika\",\n  \"typ\": \"JWT\",\n  \"user_name\": \"nivedika.doe\"\
  ,\n  \"kid\": \"key2\",\n  \"is_admin\": false\n}\n```\n\n图 4 所示的以下修改如果 `kid` 参数受到命令注入，可能会导致远程代码执行：\n\
  \n### 签名绕过：kid 参数注入 + 目录遍历\n\n如果软件使用 `kid` 参数从文件系统获取密钥，可能会受到目录遍历攻击。程序随后会被强制使用一个文件作为验证密钥，攻击者可以估算该值。这可以使用程序中的任何静态文件来实现。如果攻击者意识到文件作为密钥的重要性，他们就可以构建恶意令牌并使用识别出的密钥对其签名。考虑以下代码，为了强制应用程序使用空密钥，攻击者可以尝试将\
  \ `/dev/null` 建立为密钥源：\n\n```json\n{\n  \"alg\": \"HS512\",\n  \"name\": \"nivedika\"\
  ,\n  \"typ\": \"JWT\",\n  \"user_name\": \"nivedika.doe\",\n  \"kid\": \"../../../dev/null\"\
  ,\n  \"is_admin\": true\n}\n```\n\n在成功遍历到 `/dev/null` 的情况下，攻击者将有机会空字符串签名恶意令牌。\n\n\
  `kid 参数注入 + SQL 注入 = 签名绕过`\n\n如果通过 `kid` 参数从应用程序获取数据库密钥，可能会发生 SQL 注入。如果黑客成功，他们可以操纵\
  \ SQL 查询返回给 `kid` 参数的值并用其签名有害令牌。假设应用程序通过 `kid` 参数获取其 JWT 密钥。示例 SQL 查询：\n\n`SELECT\
  \ key FROM keys WHERE key.‘key2’`\n\n攻击者随后向 `kid` 参数插入 `UNION - SELECT` 命令来操纵密钥值：\n\
  \n```json\n{\n  \"alg\": \"HS512\",\n  \"name\": \"nivedika\",\n  \"typ\": \"JWT\"\
  ,\n  \"user_name\": \"nivedika.doe\",\n  \"kid\": \"yyyy’ UNION SELECT ‘ bbb\",\n\
  \  \"is_admin\": true\n}\n```\n\n#### 图 4 带有 kid 参数的修改后令牌\n\n| { || { |\n| --- |\
  \ --- |\n| “alg”: “HS5 12”, || “name”: “nivedika”, |\n| “typ”: “JWT”, || “user_name”:\
  \ “nivedika.doe”, |\n| “kid”: “key21/usr/bin/uname” || “is_admin”: false |\n| 1.\
  \ || } |\n\n\n\n\n3. Obinna Ethelbert, Faraz Fatemi Moghaddam, Philipp Wieder, and\
  \ Ramin Yahyapour (2017). 云 SaaS 应用基于 JSON Token 的身份与访问管理方案，DOI: [10.1109/FiCloud.2017.29](https://doi.org/10.1109/FiCloud.2017.29),\
  \ IEEE 2017 年 11 月。\n\n4. Laszlo Viktor Janoky and J. Levendovszky (2018). Web Token\
  \ 注销机制分析，DOI: [10.1177/1550147718801535](https://doi.org/10.1177/1550147718801535)。\n\
  \n5. R. Kannan and G. Umasankar (2018). 基于 JWT 授权码流的安全外部登录，第 961-965 页。\n\n6. S.\
  \ Rawat, T. Bhatia, and E. Chopra, 使用渗透测试脚本的网络应用程序漏洞利用，国际科学研究工程趋势杂志，第 6 卷，第 1 期，第\
  \ 311-317 页，2020 年。\n\n7. S. Shah and B. M. Mehtre (2015). 漏洞评估与渗透测试技术概述，Hacking\
  \ Tech，第 11 卷，第 1 期，第 27-49 页，2015 年。\n\n8. Irfan Darmawan, Aditya Pratama Abdul\
  \ Karim Rahmatulloh, Rohmat Gunawan, and Dita Pramesti (2022). 基于 CSRF 技术的 Cookie\
  \ 存储 JSON Web Token 渗透测试”，DOI: [10.1109/ICADEIS52521.2021.9701965](https://doi.org/10.1109/ICADEIS52521.2021.9701965),\
  \ IEEE 2022 年 2 月。\n\n# 用于慈善的区块链\n\nShamith D. Rao^(²³)\n\nDOI: [10.1201/9781003430452-29](https://dx.doi.org/10.1201/9781003430452-29)\n\
  \n## 摘要\n\n区块链技术因其去中心化的特性和强大的安全性而流行。尽管区块链因其去中心化加密货币的应用而闻名，但它们也可以用于其他创新应用，如智能合约、资产所有权记录、跨境支付解决方案和交易所金融。区块链技术独特的公共可验证性以及受信任第三方控制的能力使其对在线慈善社区越来越具有吸引力。然而，慈善机构经常面临资金被滥用、审计不力和丑闻等问题，导致公众信任度下降。本文提出了一种利用\
  \ `Ethereum` 等公有区块链提高慈善运营透明度的解决方案。所提系统确保了慈善运营中不同参与者之间资金的安全传输，促进了信任和安全。此外，该系统通过智能合约、托管和代币化允许受益人更广泛地获得商品和服务，为服务供应商、慈善机构和受益人提供了一个高效可靠的机制。通过利用公共账本，系统使公众能够验证慈善运营中不同参与者之间的资金传输，提高了透明度并增加了公众对慈善机构的信任。所提系统旨在通过建立对慈善机构的信任来激励有效的慈善事业，最终鼓励更大规模的慈善活动。服务供应商、慈善机构和受益人在区块链技术的采用将进一步促进系统的信任和安全。综之，所提系统实现了安全透明的慈善运营，建立了公众信任并促进了有效的慈善事业。\n\
  \n关键词：智能合约、区块链、托管、验证、代币化\n\n# 引言\n\n人们出于各种原因进行捐赠，包括神圣原则、良好的意图、多余资金等。正如 Yasmin 等人，(2014)\
  \ 所示，38% 的慈善机构报告了账目错误和计算不准确的问题。其中大多数是宗教基金会，其余的是小型协会。英国慈善援助基金会（Charities Aid Foundation,\
  \ n.d.）的一份报告承认，对于慈善用途，区块链同时可以将透明度和信任提升到新水平，减少了近 97% 的中间人成本，并为慈善机构募集支持提供了更大的自由。我们通过展示一种传统的基于区块链的慈善模型来研究这一点，该模型利用在线\
  \ Web 平台，捐赠者可以在平台上选择想要帮助的慈善项目，并以数字代币或加密货币的形式进行捐赠。这些代币可以直接使用，也可以由接收者转换为法币。本文研究了一个透明、安全并提供了一个通过代币化进行商品变现的平台系统。\n\
  \n## 当前系统\n\n目前的系统（图 1）被大多数本地慈善系统所遵循，但同时也被认为是诈骗类型（McDonnell, 2017）。其主要原因是缺乏透明度。图\
  \ 1 下方向我们展示了流程的概览。捐赠者将所需的资金捐赠给中间人，中间人转而将“大部分”资金交给相关的慈善机构。假设中间人留下 1% 作为佣金并将资金转发慈善机构。没有人知道慈善机构如何分配资金，以及资金流向了哪里。这对于捐赠者来说可能也是。这种方法被许多跨国公司使用，仅仅为了在他们的组合中展示。非参与方没有系统可以验证声明。这导致向受益人交付捐赠的说法非常模糊。\n\
  \n![图 1. 当前慈善捐赠系统缺乏透明度，资金流对终端用户不可见](img/fig29_1_C.jpg)\n\n图 1. 当前慈善捐赠系统缺乏透明度，资金流对终端用户不可见\n\
  \n除了一般管理外，针对慈善机构投诉的最大之一是财务不当（McDonnell, 2017）。此外，48% 的针对慈善机构投诉来自公众。这意味着公众与慈善机构之间缺乏信任。此外，根据注册反欺诈师（ACFE）2018\
  \ 年国家报告，非营利组织的欺诈比例高达 9%。非营利组织还面临中位数 75,000 美元的损失。这种财务损失会严重阻碍慈善机构和非营利组织的功能（“Report\
  \ to the Nations”，2018）。\n\n## 相关工作\n\n\n\n\n\nLee et al., (2018) 提出了一种基于区块链的慈善捐赠系统，该系统保护了捐赠者的隐私并提供了系统透明度。这项研究没有为用户提供直接将资金转移给受益人的方法。该框架没有考虑到受益人可能会购买的相关商店和服务。Naiknavare\
  \ et al., (2022) 提出了一种基于区块链的慈善系统，其中他们定义了 4 类参与者：捐赠者、受益人、合作商店和慈善机构。他们的系统利用区块链实现了机构间资金流的透明化。然而，该研究并未保证真实合作商店的生成，也没有保证商店提供的服务是否到达了受益人。他们也没有展示任何对这些商店提供的服务进行代币化的方法，以便直接在区块链上进行交易。Almaghrabi\
  \ & Alhogail, (2022) 提出了一个利用区块链提高资金可溯性的系统。他们还引入了一个系统，在资金到达受益人时通知用户。该系统未能为慈善机构的重新安排资金提供足够的灵活性。这项研究也没有考虑签约商店提供的服务。\n\
  \n## 提议的系统\n\n上述问题促使我们提出基于以太坊区块链的系统架构。该系统需要方便捐赠者、受益人、慈善机构以及他们这些代币的合作商店的用户，使其对区块链拥有透明的视图。这意味着他们能够完全访问所有交易细节，即：发送方、接收方；交易时间、位置（未来实现）、金额、交换的商品等。由于挖掘区块链的节点会扩展最长的有效区块链，区块链无法被更改，从而成为交易历史的不可变存储。这使得每位用户都能轻松地交叉检查交易金额并避免欺诈交易\
  \ (Avdoshin & Pesotskaya, 2021)。该系统由几类主要用户组成，分为捐赠者/受益人、非政府组织（NGO）和政府实体。这些用户是区块链网络中的账户持有者，每人都可以通过其\
  \ 160 位的账户地址在网络中唯一标识。他们可以使用其 256 位私钥访问账户并执行和签名交易。因此，不同类型的用户如下：\n\n### 系统设计\n\n所提的系统架构\
  \ (图. 2) 由 3 部分组成。第一部分是平台接口，用户可以在此与系统交互，它包含诸如注册（用户可以在系统中添加账户）、发布消息（慈善机构可以发布有关相应受益人的新信息，如姓名、问题、位置、所需金额、剩余时间等）、浏览帖子（允许捐赠者浏览慈善机构上传的受益人列表），然后\
  \ `Donate` 操作允许捐赠者将所需的金额直接捐赠给受益人或慈善机构。\n\n![Fig. 2. 三层系统架构。第一层是平台层，随后是智能合约和区块链。](img/fig29_2_C.jpg)\n\
  \nFig. 2. 三层系统架构。第一层是平台层，随后是智能合约和区块链。\n\n现在架构的第二层/中间层是智能合约。它包含了为了响应其他动作需要触发哪些操作的脚本。例如，当捐赠者将硬币转移到受益人账户时，它会执行相应的操作，确保硬币到达受益人所需的公钥地址。资金的转移也可以由托管账户控制。在系统中，在代币从受益人账户转移到相关商店期间，慈善机构将充当托管。这将确保相关商店提供的服务和服务状况完良好，并且在获得慈善机构和受益人的保证后，代币的转移才会发生。另一个例子是，当用户希望通过平台接口在系统中注册时，智能合约将执行脚本将用户添加到区块链的数据库中。智能合约将控制权交给慈善账户验证受益人和相关商店。只有在慈善机构同意后，才能创建受益人或相关商店账户。由于这些规则是由智能合约执行的，攻击者无法冒充受益人或相关商店。这为受益人和相关商店的授权和验证提供了有效方法，确保捐赠资金的妥善使用。接着是区块链本身，它是系统的骨干。过去发生和将发生的所有交易都存储在这种不可变的链表类型存储中。同时，它为平台提供了生成区块和验证交易等操作，任何用户和智能合约都可以这些操作来验证交易的真实性。它还作为平台上的本地数据库，使用户能够快速访问带有交易列表的现有区块。区块链还可以作为相关商店产品的代币化机制。这意味着实物可以代币化并表示为加密代币。这些代币被视为现实资产的数字化表示。代币化还有增加实物流动性的额外好处。这种代币化还将提高受益人获取商品的便利性，因为它为他们的需求提供了快捷访问。可以使用类似于\
  \ Tian et al., (2020) 方案的基础代币化来实现这一结果。Tian et al., (2020) 提供利用区块链和智能合约进行代币化的高效方法。\n\
  \n### 用户工作流\n\n**用户工作流程所示。**\n\n*   **捐赠者**：捐赠者登录后，将被重定向到屏幕 [图 3]，那里将有一个经过验证的受益人详情列表。他们可以选择想要捐赠的特定受益人或慈善机构。之后系统将检查余额，如果余额不足，他/她将被重定向到法币存款页面，该页面连接到支付网关，他们可以在那里向钱包充值一些硬币。如果捐赠者余额充足并发起交易，智能合约将触发交易并更新受益人和捐赠者的账户余额。\n\
  \n![Fig. 3. 捐赠者、慈善机构、受益人和签约商店的工作流程。](img/fig29_3_C.jpg)\n\n    Fig. 3. 捐赠者、慈善机构、受益人和签约商店的工作流程。\n\
  \n*   **慈善机构**：慈善机构的首要责任是验证受益人申请的处情况的真实性。只有当慈善机构认为需求是真实的且需要捐赠/帮助时，才会接受他们的申请。之后，受益人详情对捐赠者可见。当受益人与相关商店之间通过代币进行交换时，慈善机构在交易中充当托管账户。\n\
  \n\n\n\n\n- **受益人**：受益人需要提交申请并经过慈善机构的验证。只有在申请通过验证后，他们才会被列入数据库中的列表，并对捐赠者可见。受益人还可以提取代币以兑换某些法币，或者选择在相关的商店中使用这些代币来换取这些商店提供的商品/服务。\n\
  - **关联商店**：这些商店负责通过接收代币向受益人提供资源。这些资源可能是受益人需要的商品或服务。商店不需要仅接受代币兑换商品，如果受益人愿意支付等额，也可以接受法币。\n\
  \n### 区块链结构\n\n区块链结构（参考图 4））将与现有结构非常相似，但有两个关键新增：经过验证的受益人列表数据（每个受益人申请都首先需要经过慈善组织的验证，后才能添加到区块链中，此操作通过使用智能合约来实现）、经过验证的签约商店列表以及用户数据。\n\
  \n![图 4. 用于所提解决方案的区块链结构。智能合约数据被添加到主体中，这对提高流程的透明度起着关键作用。](img/fig29_4_B.jpg)\n\n\
  图 4. 用于所提解决方案的区块链结构。智能合约数据被添加到主体中，这对提高流程的透明度起着关键作用。\n\n区块头存储了前一个区块的哈希值，指向该区块。这用于维护链表类型的结构，此外它从根本上有助于维护区块链的不可篡性，因为哈希指针是前一个链的哈希，前一个区块的任何更改都会改变当前区块中的哈希指针，从而识别出虚假/欺诈区块。时间戳记录了区块挖掘的准确时间。Nonce\
  \ 是一个矿工需要计算的随机数，以匹配区块链中遵循的哈希模式。例如，如果模式是区块的哈希值必须以 5 个零开头，则应找到一个 nonce，使得对整个区块加上 nonce\
  \ 进行哈希计算后的区块哈希以 5 个零开头。这在本质上决定了挖矿难度。以太坊有两种不同类型的 nonce：账户（交易）nonce 和工作量证明（区块）nonce。作为挖矿随机数的\
  \ PoW nonce 包含在每个区块中。然而，交易中使用的 nonce 是账户 nonce，它代表一个账户生成的交易顺序。账户 nonce 用于防止重放攻击，重放攻击是一种网络攻击，会导致合法区块被错误延迟或重复。例如，某个向用户账户向受益人账户发送代币的交易可以连续重复，导致用户账户清空。账户\
  \ nonce 本质上充当账户交易的计数器。Merkle 根是所有交易哈希值的哈希值。这有助于高效地验证节点中的数据。如果其中一个节点被更改，它的哈希值就会改变，导致\
  \ Merkle 根哈希发生变化并进而改变区块哈希，从而指示故障区块。在我们的区块中，有三个 Merkle 根分别用于经过验证的受益人、用户以及捐赠者或受益人的交易。这样做是为了遵循“关注点分离”。人们不需要在合并的树中搜索可能只是最后一笔交易的数据。如果相关数据存在于三棵不同的树中，搜索效率可以提高\
  \ 3 倍。\n\n### 结果\n\n所提的设计提供了一个透明的慈善系统，该系统考虑了慈善机构管理资金所需的灵活性，并允许捐赠者直接将资金捐给经过慈善机构验证的受益人。所提系统还通过让慈善机构充当托管人，确保了关联商店的验证以及商品和服务的正确交付。所提解决方案还允许关联商店提供的服务进行代币化，这将增加商店提供的商品和服务的流动性和可获得性。\n\
  \n## 结论\n\n使用上述设计，可以使用 `Ganache` 开发并实现区块链系统，`Ganache` 可以模拟真实的以太坊区块链，之后可以扩展到真实的区块链网络上。这种实现方式成本较低，特别是与传统慈善周期中中间人收取的佣金相比。由于其透明性、交易的一致性和更快的确认速度，这很快就能成为慈善机构之间信任的印记。一些机构希望更进一步，开发全新的代币，以促进为贡献者和非营利组织建立新的全球生态系统的发展（Avdoshin\
  \ & Pesotskaya, 2021）。\n\n\n\n\n\n10. “报告给国家：2018 全球职业欺诈与滥用研究”。ACFE，奥斯汀，第 20 卷。\n\
