  \n## 结果与结论\n\n通过使用 `ESP32` 和 `ESP-MESH` 协议实现 `VANET`，我们能够证明其在 15-20 米范围范围内运行的可靠性。`ESP-MESH`\
  \ 的自路由能力确保了任何从网络移除的节点都会重新路由并通过备用路由连接。我们发现 `AODV` 路由协议是 `VANET` 实现的高效选择。然而，我们也观察到所使用的\
  \ `GPS` 模块并不总是可靠的，特别是在阴天条件下。建议使用更可靠的模块化 `GPS` 以获取更准确的位置数据。尽管如此，我们的超声传感器工作正常，每当我们遇到潜在的碰撞情况时都能接收到警告消息。我们的通信协议允许将其他节点的实时位置数据持续传输到\
  \ `RSU` 或范围内的任何节点。此外，我们发现 `Ns2`、`SUMO` 和 `OSM` 能够有效地使用 `AODV` 路由协议在大规模上仿真 `VANET`。我们的软件为我们的系统产生了成功的结果，这些结果也可用于测试和验证小规模\
  \ `VANET` 系统。总而言之，我们 `VANET` 系统的硬件和软件组件能够有效工作并产生成功的结果。\n\n## 结论与未来工作\n\n实验结果展示了使用所提系统部署多个节点的可性。然而，当节点数量在特定范围内增加时，系统在某些情况下会遇到丢包和延迟问题，这凸显了对更先进路由协议的需求\
  \ (da Silva et al., 2022)。在未来的工作中，将致力于将设置简化为紧凑模块（例如自定义设计的 `PCB`），并将其与 `ADAS`（高级驾驶辅助系统）集成。此外，还将进行高拥堵和低拥堵交通仿真，并评估网络性能指标以识别高效的传播和路由策略。还将探索并实现提供更好可靠性和效率的替代路由协议，以增加通信系统的可靠性。此外，还将关注增强\
  \ `VANET` 在实际应用中的安全性 (Hasrouny et al., 2017)。\n\n## 参考文献\n\n1.  Anwer, M. S., Guy,\
