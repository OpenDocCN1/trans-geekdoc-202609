  \n## 经典位进入量子比特\n\n通常情况下，位是 0 或 1，而量子位（量子比特）是 0 和 1 的叠加态。（叠加：一个物体放置在另一个物体上方或上面的状态）。\n\
  \n\n\n\n\n在处理像素化图像时，像素的高空间频率边缘很容易通过 2D 傅里叶变换移除，因此傅里叶变换被用于函数插值 (Cai et al., 2014)\
  \ 和信号平滑处理。\n\n傅里叶变换 (Du et al., 2007) 用于信号处理、信号分析、图像处理、滤波以及微分方程的计算。在这项研究中，叶片图像通过傅里叶变换转换为生成准确的量子比特，从而对图像进行更准确的评估。因此，使用了\
  \ FT 图像处理技术。\n\n在这种情况下，Hadamard (Gandhi and McGinnity, 2013) 重构指的是傅里叶变换，Hadamard\
  \ (Gandhi and McGinnity, 2013) 重构在这种情况下是傅里叶变换的形式，由于它是使用 Hadamard 门执行的，因此也被称为 Hadamard\
  \ 重构。这是通过对每个 n 个量子比特同时应用 Hadamard 门来实现的。两种傅里叶变换都被用于 Shor 规则集（除了 QFT 之外，还有一个初始的 Hadamard\
  \ 重构）。\n\n## Hadamard 门\n\n`H` 门或 Hadamard 门是最常用的门，用于将量子比特从聚类态转换为均匀叠加态。使用 `H` 门可以将图像旋转\
  \ 90 度到 180 度，这对于查看图像以获得清晰的结果至关重要。捕获并转换的图像被用于查看带有缺陷的叶片。因此，为了视觉化叶片图像，每当使用傅里叶变换时都会实现\
  \ `H` 门。\n\n![Fig. 2. Paddy leaf showing defects](img/fig5_2_C.jpg)\n\n图 2. 显示缺陷的水稻叶片\n\
  \n## 卷积\n\n这是一种简单的数学操作，是许多常见图像处理算子的基础。它通常将两个大小相同的数字数组相乘，然而相同的维度会产生第三个相同维度的数字数组，用于评估作为输入处理的叶片图像中的缺陷元素。\n\
  \n在这项研究工作中，实现了 2D 卷积，有助于使用通用图像处理滤波器发现模糊、锐化和边缘检测。其背后的原理是使用卷积核并对输入图像进行迭代以获得输出图像。生成的每一个位经过处理以得到输出，随后通过\
  \ `CNOT` 门以对该位进行编码。\n\n## CNOT 门\n\n受控非门或 `CNOT` 门作用于一对量子比特，其中一个作为“控制位”，另一个作为“目标位”。每当控制位处于受控状态时，就会对目标位执行非操作。如果控制量子比特处于叠加态，该门将产生纠缠。\n\
  \n该门在 `QiSkit` (Du et al., 2005) 内部生成，其实现通过初始化量子比特完成。主量子比特被翻转，第二个保持 `0>`。随后，应用 `CNOT`\
  \ 门，其中第一个量子比特将分别成为控制位，第二个将成为目标量子比特。之后，对两个量子比特进行测量，结果可以从工具返回。\n\n![Fig. 3. Abstract\
  \ of Agriculture, Computer vision, and Quantum computing](img/fig5_3_C.jpg)\n\n\
  图 3. 农业、计算机视觉和量子计算摘要\n\n![Fig. 4. NOT with input 0 gives output 1](img/fig5_4_C.jpg)\n\
