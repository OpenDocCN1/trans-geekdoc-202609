  \n## 摘要\n过去几年中，研究人员利用了各种机器学习技术，以便在没有关于这些攻击特征的大量先验的情况下识别网络攻击。然而，由于模型的复杂性，传统的机器学习方法无法生成独特的特征描述符。因此，这一局限性适用于整个领域。描述攻击检测挑战的困难与这一事实直接相关。在本文中，将多种监督深度学习模型结合形成一个集成框架，用于检测和缓解云端的攻击。这些监督深度学习模型包括生成对抗网络、自动编码器、卷积神经网络和循环神经网络。这些集成模型作为基分类器，通过元分类器获取输出并对攻击进行分类。仿真结果表明，所提方法的分类准确率高于现有的集成模型。\n\
  \n**关键词：** 威胁缓解、云、机器学习\n\n# 引言\n得益于互联网的持续增长和广泛接受，大量网络计算机用户可以从广泛的来源获得收益。另一方面，随着依赖网络的人数不断增加，采取措施保持其安全的重要性将变得日益紧迫。网络安全的目标是防止未经授权的用户访问计算机、网络、程序、数据等资源，并对它们进行修改\
  \ (Ahsan et al., 2022)。\n\n然而，当越来越多与金融、电子商务和军事相关的系统上线时，它们更容易成为网络攻击的目标，这使它们处于巨大的危险之中并面临灾难性损害的风险。这使得它们处于可能遭受严重破坏的境地\
  \ (Berghout et al., 2022)。采取识别威胁、防御威胁并维护安全的安全的策略至关重要。此外，拥有此类策略也是本质的。各种形式的攻击通常需要多种响应，这增加了额外的复杂性。因此，如何识别新的和以前未知的网络攻击形式是网络安全领域人员面临的最重要任务\
  \ (Singh et al., 2021)。\n\n深度学习方法之所以被称为深度学习，是因为其用于解决复杂问题的深层通用设计，这代表了机器学习在利用神经网络架构模拟人脑结构方面的重大进展。深度学习方法之所以被称为深度学习，是因为其用于解决复杂问题的深层通用设计\
  \ (Daghigh et al., 2021)。用于复杂问题的深度学习算法的通用设计是“深度学习”一词的来源。围棋游戏中最著名的倡议之一是使用通用深度学习结构的能力\
  \ (Unal et al., 2022)。\n\n目标是为兴趣将深度学习方法应用于网络安全的学术人员提供深度学习的基础知识，以便他们开始。已经做了大量工作，这些工作本质上关注深度学习方法在检测攻击的应用。“深度学习技术”一词指的就是这些\
  \ (Gupta et al. (2022)。\n\n我们的研究基于几项先前的文献评估的结论 (Sharma and Singh, 2022; Alsoufi\
  \ et al., 2021; Arul et al., 2021; Gheibi et al., 2021)，这些评估研究了深度学习解决攻击检测问题的潜力。这些评估了将深度学习应用于攻击检测问题的可能性。这些综述研究了深度学习可能具有的多种应用。\n\
  \n通过深度学习训练的物联网安全方法的支持，我们能够清晰地了解各种攻击是如何实施的以及如何防御它们。该方法利用深度学习并分析四个大型数据集之间的相似性和差异来检测违规行为。\n\
  \n为了实现解释深度学习算法及其最适用应用的目标，采取了这一步骤。这一步特别关注检测的细节，例如恶意软件分析、垃圾邮件检测和入侵检测，以及其他与攻击检测相关的问题。与更广泛、更全面的概述相比，这一部分更具针对性。\n\
  \n在本文中，我们开发了一个监督机器学习框架，能够更好地检测云计算服务中的问题和威胁。该监督机器学习框架使用集成框架来检测云端中待检测和缓解的问题与威胁。\n\n\
  ## 相关工作\n近年来，卷积神经网络一直是许多有趣研究和应用的焦点，特别是在网络安全领域 (Sun et al., 2022)。作者采用递归和卷积网络层来构建一个可以模拟恶意软件检测系统的神经网络。这项工作旨在获得分类特性。建议的方法结合了两种不同的特征提取方法以产生分层特征提取架构：卷积层中的卷积操作和递归网络层中的序列建模。这两种风格的最优优点在该架构中结合。\n\
  \n它们的网络输入是原始短字符串，它提取特征并使用字符嵌入对字符串进行分类。eXpose 神经网络 (`XNN`) 是 Aziz et al. (2022) 中的作者提出的用于预先识别攻击信号的方法。与基于手动提取特征的基准方法相比，eXpose\
  \ 自提取特征的设计脱成为不可争议的胜利者。文中指出，初始输入的多样性和复杂性使得算法处理变得困难。尽管如此，与这些基准相比，它降低了误报率，这表明在没有额外甚至噪声输入的情况下，`CNN`\
  \ 的自动特征提取过程并不健壮，也不公平。\n\n\n\n\n\n为了保证网络的持续安全，识别恶意 Web Shell 能力是极其必要的。`Sayadi et\
  \ al. (2021)` 中的作者提供了一种 `word2vec` 格式以及一种基于 `CNN` 的危险检测方法，用于分析 HTTP 请求数据。由于这是首次尝试在恶意检测场景下整合\
  \ `word2vec` 和 `CNN`，这项工作具有重大的意义。他们首先讨论了 `word2vec` 软件，该软件的特点是利用从 HTTP 获取的词的特征表示。然后，将\
  \ Web 请求表征为一个矩阵，其大小是通过串连接的特征预先计算得的。最终构建了一个用于 Shell 分类的模型，该模型利用了 `CNN` 框架。尽管进行了许多类型的实验，但所提的方法在每一组执行的测试中都均优于相关的传统分类器。\n\
  \n`Qazi et al. (2022)` 描述了一种基于一维卷积神经网络（`CNN`）的端到端加密通信分类方法。该方法将特征提取、特征选择和分类器应用过程统一在一个单一框架下，旨在利用\
  \ `CNN` 架构实现攻击检测的稳健性能。此外，它还展示了作者意图将 `1D-CNN` 作为网络的学习算法。这使得网络能够自动学习自动提取的特征与预期标签相关的输出之间的关联。这是通过给网络提供这些信息而实现的。\n\
  \n`Khan (2021)` 采用了一种基于 `AE` 和 `DNN` 的混合深度学习技术来识别恶意代码。具体而言，他们利用 `AE` 将重点从初始数据中包含的过度细节转移到数据最重要的组件上。这是通过将注意力从过量信息转移到数据最关键组件来实现的。该过程的下一步是使用基于\
  \ `DBN` 的学习模型（该模型包含多层 `RBM` 和一层 `BPNN`）来寻找恶意代码。这一步对于进入过程的下一个阶段是必不可少的。一旦他们发现每个 `RBM`\
  \ 层都经过了无监督训练，且每个 `BP` 层都经过了监督训练，他们就能够微调整个网络以构建出最有效的混合模型。这些信息允许他们开发出尽可能准确的结果。我们通过为每个\
  \ `BP` 层提供监督指令实现了这一目标。实验表明，他们的混合网络在准确检测威胁的能力方面优于此前使用的基于 `DBN` 网络。\n\n`Tran et al.\
  \ (2022)` 中的作者概述了一种围绕 `CNN` 的创新流量分析技术。该方法展示了网络流量数据的二维表征。这些研究人员利用中科大流量赛 2016（`USTC-TRC2016`）提供的数据集证明了他们的研究结果。具体而言，他们利用它证明了他们的方法实现了\
  \ 99% 的平均分类准确率。\n\n`Hou et al. (2021))` 作者使用集成网络进行分类。之后，它汇总了多个分类器的结果。为了在区分常规行为时提高性能，该技术不仅整合了\
  \ `AE`，还整合了 `DNN`（一种极学习机）。这样做是因为他们的结果结果令人振奋。事实证明，使用多个分类器的性能优于仅使用一个分类器。`Omer et al.\
  \ (2019)` 提出了一种集成结构作为恶意软件检测的技术。这可能涉及输入数据的转换以及语义上下文。通过对一系列分类器进行投票，来确定在项目的测试阶段哪些样本将被标记。当应用于该任务时，他们提出的结构在准确性上均表现出很高水平。\n\
  \n##适当的方法\n\n除了集成架构提供的改进检测能力外，元分类器的输出还提供了攻击缓解。基于机器学习的人入侵检测系统（`IDS`）的建议设计如图`Figure\
  \ 1`所示。该架构由四个阶段组成，如下：\n\n![Fig. 1. Proposed IDS](img/fig77_1.jpg)\n\n## 数据处理\n\n\
  数据预处理涉及消除冗余信息和数据归一化。\n\n### 特征选择\n\n本研究讨论的 `CFS` 不仅能够提高特征选择，还可能提高分类的精度。该方法检查所选的特征子集，以确定它们相对于搜索空间的相关性和冗余性。这有助于定位可行的最优解。\n\
  \n## 基于相关性的特征选择\n\n基于相关性的特征选择指的是基于相关性评估来选择特征的算法。这些算法有时也被称为 `CFS` 算法。另一方面，重复性特征被包含进来是因为它们与同一类别中的许多其他特征相关。该方法优先考虑那些特征与类别强相关，而与其他子集的特征相对不相关的子集。为了将某个特征纳入，它必须能够对类别进行预测，而这种预测是实例空间中任何可用特征无法实现的。以下是一个可能用于比较\
  \ `CFS` 子组特征的函数示例：\n\n$$M_{s} = \\frac{kr_{cf}}{\\sqrt{k + k(k - 1) + r_{f}}}$$\n\
  \n根据上述方程，我们能够对以下三个变量得出某些推论：\n\n> *M*[s] - 特征子集评估，\n\n> \n\n> *r*[cf] - 特征间的平均相关系数\n\
  \n> \n\n> *r*[f] - 特征间的平均互相关系数。\n\n\n\n\n\nCFS 的价值是通过分析其不同属性子集之间存在的相关性决定的。找到具有最高值\
  \ `r[cf]` 的特征集可以大幅减少用于训练和测试的数据集的整体规模 `r[f]`。这是通过找到具有最大值的特征集而可能的。\n\n## 集成分类\n\n\
  集成模型包含有监督和无监督分类器，如图 2 所示。\n\n![图 2. 集成分类](img/fig77_2_B.jpg)\n\n图 2. 集成分类\n\n##\
  \ 无监督自动编码器\n\n自动编码器 的设计可以分为三个主要部分：事实上，它能够开始将输入压缩为特征空间中的表示，然后在压缩后在输出端重构该表示。由于 AE\
  \ 代表了一类广泛的学习方法，它在各种数据分析任务中得到了广泛应用，包括数据集的维度削减和离群点识别。它在人工智能（AI）领域也得到了广泛应用。在网络安全方面，AE\
  \ 也经常被用于描述其有限特征空间内的异常行为。这是在有限特征空间的语文中进行的。该方法的另一个优点是能够描绘不属于预先已知类别的动态攻击。梯度表示为：\n\n\
  ```\n∇ = y^((t)) − x^((t))  \n```\n\n## 信仰网络\n\n可以将深度信仰网络分为两类：使用单层反向传播神经网络（`BPNN`\
  \ 或 `BP`）和具有多层无监督学习网络的受限玻尔兹曼机（`RBM`）。这两种网络都使用深度玻尔兹曼机（`DBN`）训练其模型。神经元的输入层隐藏层构成了这种神经网络，其结构为无向图模型。\n\
  \n生成结构随机选择的神经网络被称为随机比特机。逐层完成的训练对 DBN 有益，因为它利用了 RBM 固有的组件。DBN 的分布表示如下：\n\n```\nJ(θ[k + 1]) = J(θ[k]) + α[k]∇J(θ[k])d[k]\
  \ + o(θ[k])\n```\n\n本研究的研究人员利用 DBN 来识别恶意软件。研究人员使用无监督学习训练了一个多层生成模型，以对抗 DBN 产生过拟合的倾向。\n\
  \n## 无监督生成对抗网络\n\n近年来提出的最有前景的无监督学习系统之一被称为生成对抗网络（GAN）。该系统利用发现数据中内在模式的属性来开发新示例，它是近年来建议的系统之一。这种既没有胜者也没有输者的游戏概念是开发\
  \ GAN 的重要动力。它在深度神经网络的设定内进行一场无休止的游戏，即“谁来生成和谁来判别”，这对于它达到能够学习真实世界数据分布式表示的阶段是必要的。\n\n\
  这对于它达到能够学习真实世界数据分布式表示这一点至关重要。另一方面，目标是通过模拟、建模和学习真实数据的分布特征，来确定特定数据集是否为真实数据的产物。这两个目标与任务的目标背道而驰，该任务的目标是建立特定数据集是否为实际数据收集的结果。它们的生成能力和区分不同对象的能力都可以受益于这些内部模型之间持续竞争。\n\
  \n## 有监督 CNN\n\n卷积计算和它们使用的深度结构构成了卷积神经网络（通常称为 CNN），这是一种深度学习的标志性技术，并在该领域被广泛使用。CNN\
  \ 也被其更常见的名称卷积神经网络称为。特别是，CNN 利用了多层感知变体设计，这种设计要求用户基本上不需要进行任何预处理。\n\n除了输入层和输出层外，卷积神经网络（CNNs）还包含许多用户不可见的层。卷积层、池化层和全连接层都是这些层的组件。CNN\
  \ 具有其他分类系统不具备的优点。在提取特征方面，它不需要任何先验信息，也不像其他方法那样需要大量的预处理。这是最核心的两个优点。\n\n## 有监督循环神经网络\n\
  \nRNN 是一种特殊的神经网络结构，被赋予了记忆功能，以存储过去获得的信息。该功能的开发仅用于处理随时间变化的输入。RNN 特别适用于此类数据的数据。这种设计选择与人类认知基于以往经验和记忆的假设一致。这一假设解释了为什么\
  \ RNN 在处理时间序列数据时表现良好。\n\nRNN 仍然面临重大的基础性设计问题，如梯度消失和梯度爆炸，这阻止了它们记忆或建模长期关系。这是 RNN 未被广泛使用的原因之一。第一个问题被称为梯度消失，第二个问题被称为梯度爆炸。由于这些问题，研究人员开发了具有门单元和记忆单元的\
  \ `LSTM` 和 `GRU`。这两类网络都能通过成功导航关键元素来检索长期关系。\n\n## 结果与讨论\n\n所提方法与其他多种方法（包括集成有监督和无监督模型）进行了评估。在\
  \ `python` 环境下评估了模型针对拒绝服务攻击（DoS）、用户到根攻击（U2R）和远程到本地攻击（R2L）的功效。研究的数据集包括 `NSL-KDD`、`KDDCup\
  \ 99` 和 `DARPA1998`。根据准确率、假阳性率、真阳率和曲线下面进行测试。结果如图。\n\n模拟结果显示该方法具有更高的准确率（图 3）、假阳性率（图\
  \ 4）、真阳率（图 5）和曲线下面（图 6）。可以看到随着测试样本增加，无监督分类器的性能优于有监督学习分类器。\n\n\n\n\n\n在本文中，集成架构使我们能够利用监督机器学习方法来改进云计算服务中的问题检测和威胁检测。通过使用监督机器学习框架，可以利用集成架构来发现并缓解云中的漏洞和风险。利用集成基分类器的输出进行元分类，有助于减少攻击的影响。通过仿真检查了模型对不同类型攻击的鲁棒性。仿真结果表明，所提的解决方案在问题检测和攻击防御方面优于现状。\n\
