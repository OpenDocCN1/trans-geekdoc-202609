  \ Nezamabadi-Pour, H., and Saryazdi, S.\n\n\n\n\n视频会议或通俗所说的视频通话，已成为当今最清晰、最广泛的近乎面对面的通信手段。这种普及性也带来了网络犯罪前所未有且紧迫的增长（Monteith\
  \ et al., 2021）。教育领域成为这一目标也只是时间问题（Abdelrahim, 2021）。远程办公的本质是远程电子考试，这从源初就去除了通常在现场考试中存在的层完整性检查。这些检查包括但不限于（Aldridge\
  \ and Wooley, 1990）对学生进行搜身、检查是否带有纸条或其他违规材料、防止学生之间的协作作弊，以及防止对机构基础设施的破坏。为了满足这些新的远程教育需求，`Teams`、`Zoom`\
  \ 和 `Codetantra` 等平台的使用率出现了现象级的增长。这不仅促进了考试的恢复，还确保了全球学生课程的连续性。然而，这股福利也带来了违规行为的祸源。据报道，有人冒充他人考试，在\
  \ `GRE` 和 `GMAT` 等考试中替换实时视频流（NDTV, 2021；Varma et al., 2021；Pranav Mukul, 2021）。此外，如果认为那些在这一波新软件浪潮之前就已经存在的考试不会受到这种考试作弊之害的影响，那将是错误的。虽然这些测试的居家版本确实对考生的环境进行初步检查，但众\
  \ way 巧妙的障眼法已使这些努力付诸东流。\n\n`Video Feed Replacement` 指的是用录制视频替换实时摄像头流，本质上是欺骗软件，使其认为视频源是一个视频输入设备。完全透明地说，这种软件的使用场景原本完全无害且极其实用的。它们旨在通过提供热补丁和快捷方式，快速在视频源、屏幕共享和录制视频之间切换，从而增强直播和视频托管的体验。现在到了邪恶的部分：在录制视频的掩护下，恶意行为者可以在接收端不知情的情况下进行阴险行为。虽然本文主要讨论这在考试场景下可能产生的负面影响，但另一个不那么良性的出口可能是职场或教室，听听者自己可能缺席或偷懒，从而大幅降低了整体生产力。2022\
  \ 年 `Zoom` 会议的规模日访问量超过了 3 亿次（Zippia, 2022）。该平台完整性的漏洞可能会阻碍数千机构开展日常业务的能力。\n\n让防御此类攻击变得复杂的原因是，被“替换”的视频流也显示出类似于真实摄像头的\
  \ `UUIDs`。此外，除了微小的水印外，这些流在性能和质量上几乎与原始流无二致。一个有动心的攻击者可能会选择付费订阅，使其在肉眼看来变得无法区分，并在视频之间实现更快速、更流畅的转换。\n\
  \n在 `Gaze Tracking` 领域，通过监控受体的眼部运动并发现可能暗示恶意的模式，可以使用它来检测和威慑计算机考试中的作弊行为。例如，如果考生经常看向第二个设备或长时间离开屏幕，这可能表明有第三方的帮助。此外，视线追踪还可以检测快速眼动运动或瞳孔扩张变化等模式，这些模式可能暗示紧张或担心，以及作弊行为。视线追踪可以通过检测和制止作弊，帮助确保计算机考试的完整性和公平性。为了确保所提系统的实时响应能力，作者专注于可以提供确定性结果的低级特征。不仅如此，视线模式识别也是一种使用眼动软件和算法分析并解释个人视线模式的技术。它用于研究人们如何与周围环境交互。传统的\
  \ Shi et al. (2021) 和 Yeamku and Chamnong (2020)] 视线模式识别追踪的是眼睛的运动。\n\n\n\n\n当我们看到\
  \ Klijn 等人 (2022) 的工作时，我们发现作者的发现反映了我们的经历，因此，这是我们研究的一个自然起点。该研究得出了以下结论：首先，在准确性更高和完成时间更快方面，在后轮中收到问题的学生表现更好。其次，对于非随机顺序的题目，或根据大学伦理准则（该准则在考试中途随机显示给半数学生）的题目，不同考试版本之间的准确性和答题所需时间上没有显著差异。Klijn\
  \ 等人 (2022) 的研究人员为我们留下了困境，即为了使所考虑的考试公平，所有学生都应该获得相同的题目。然而，对于在线测试，给每个学生分配完全相同的题目似乎是有危险的，特别是在没有额外防范作弊措施的情况下。了解在教育早期阶段表现情中导致作弊的因素，对于防止未来的不实行为至关重要，特别是如果作弊随着时间的推移变成一种习惯或性格特征时（Klijn\
  \ 等人., 2022）。为了大幅减少可能影响研究结果的与成熟相关的负面心理特征，研究主要针对小学生进行。他们显示，智商和经济社会地位较高的孩子更容易作弊。他们确定了利他主义与激励之间一种引人入胜的关系，以及提高表现的奖励可用性并不会促进作弊行为的事实：在有激励的情况下，利他主义学生的作弊行为显著减少。这表明，心肠善良的孩子可能不愿从不道德的行为中获得金钱利益。关于利他偏好的广泛研究表明，权利感和收入来源在预测利他行为方面起着重要作用。该研究没有发现教养方式对作弊影响的确定性证据，且作弊与风险或时间参考之间没有联系。作者们发现非常着迷的是，一种创造性的表现环境在作弊和表现方面会产生有趣的结果，通过接触从作弊中获得的各种答案和学习，可能帮助人在未来表现得更好。对于教育政策制定者来说，调查在年幼阻止儿童不实行为的措施是重中之重。Klijn\
  \ 等人 (2022) 的工作对年幼时的学术作弊进行了探索，是在一个可以调整激励的表现情境下。根据 [8] 的作者所述，未被强制监考的学生平均成绩比受监考的学生高出\
  \ 11%。此外，在社交增加可能鼓励合作的线下课堂中，监考和未监考测试的结果差异要大得多。作者发现，ACT 分数较低的学生倾向于更多地参与恶意策略。发现为以下观点提供了支持，即考试焦虑可能对监考和未监考的考试表现都有影响。作为国内和国家之间广泛使用标准化测试的悲剧性，近期推动了教育交付中更多的问责制。正如\
  \ Martinelli 等人 (2018) 正确描述的那样，通过对学校采取法律制裁或对学生升级进行惩罚，对标准化测试的依赖不可避免地增加了教师和学生评估的风险。最后，总之，Milone\
  \ 等人 (2017) 中的实验表明，在线监考对学习有重大影响，特别是与未监考测试相比时。它得出结论，使用在线监考服务损害了考试过程并不可避免地增加了作弊。在本文中，我们提出了一种方法来增强和授权观察者及监考人员，有效地消除在线考试中盛行的不法分子问题，同时保持足够的实时性以提供支持。\n\
  \n## 方法论\n\n### 视频流完整性\n\n感知哈希的概念经过了研究，最初在 Hacker Factor Blog (2023) 中讨论。最近它在计算机视觉中找到了应用，因为它允许对图像进行更容易比较并设计了一种相对算术。例如，白色毛衣和黑色毛衣的图像相对相似，但第三张灰色毛衣的图像在哈希上比黑色的更接近白色。考虑到这一点，研究人员将这一概念引入实时视频流，这是一个突破性的概念，因为哈希在视频中的用法被限于保护视频流，而不是用于检测其中的模式。为了强调这一规模，研究人员鼓励研究人员想象一个涉及重复字符串的模式匹配问题，如\
  \ 图 3 所示。现在要识别这种问题，传统方法需要观察者记住字母 A 到 F，以便有意义地识别出重复模式。然而，遗忘曲线已经证明，在几分钟内，主体的更丰富细节就会从记忆中流失，导致攻击成功。\n\
  \n![图 3. 视频帧的重复模式](img/fig9_3_C.jpg)\n\n图 3. 视频帧的重复模式\n\n现在为了解决这个问题，研究人员引入了一种新颖的概念，将\
  \ Knuth-Morris-Pratt (KMP) 算法——一种动态规划算法相结合，以精确执行上述操作，同时保持极小的图像 PHash 记录并提供预期的实时性。这是通过算法本身为\
  \ O(n) 实现的。该算法的实现方式如下；它避免了与之前与重复模式或哈希缓冲区比较的新帧哈希 Hm 进行比较。动态规划方面允许我们存储中间结果，而不是重新计算，本质上为观察者执行了记忆。总之，该算法允许我们防止对之前的视频帧哈希流进行回溯。\n\
  \n### 视线追踪\n\n\n\n\n\n为了开始视线追踪，我们使用 `Image Buffer` 来建立受试者眼睛的坐标。人的实时眼部坐标本质上是序列数据。在几分钟内，坐标空间中眼部运动的任何模式都可以作为违反学术诚信的指标，并预示着视线从当前任务中分心或存在恶意的跳跃。为了在这些高量、高速的数据点中发现模式，我们需要设计一种极其高效的基元发现方法。为了分析这些时间序列数据，人们可以对数据进行可视化，或者计算其全局摘要，或者通过统计学对其进行描述。由于我们的时间序列持续时间相当长，我们考虑过开发一种\
  \ `ARIMA` 模型来检测异常，或者尝试一种预测模型，将我们的预测值与实际数据进行比较。我们很快发现这些方法过于复杂，无法满足实时体验的需求。更糟糕的是，它们经常产生假阳性，且不提供任何可解释的信息。一个可能的原因是，这些方法试图利用所有可用维度，导致它们容易失败。因此，除了高效性外，我们还需要该方法能够智能地生成`多维(MD)\
  \ 矩阵轮廓 Matrix Profile(MP)`，以帮助我们选择相关的维度子集用于寻找 `MD` 基元。\n\n(1)\n$T^{(i)} \\in R^n\
  \ : T = [T^{(1)},T^{(2)},T^{(3)},...,T^{(d)}]^T$\n\n(2)\n$T*[(i, m)] \\in R^{(d\
  \ \\times m)} : T*[(i, m)] = [T*[(i, m)]^{(1)},T*[(i, m)]^{(2)},T*[(i, m)]^{(3)},\\\
  dots,T*[(i, m)]^{(d)}]^{(T)}$\n\n(3)\n$${dist}^{(k)}\\left( {T_{i,m},T_{j,m}} \\\
  right) = \\min_{X}{dist}\\left( {T_{i,m}(X),T_{j,m}(X)} \\right)$$\n\n(4)\n$D \\\
  in R^{n-m+1} = dist^{(k)}(T[i, m],T[j, m]) \\forall j \\in [1, 2, \\dots, n-m+1]$\n\
  \n(5)\n$$\\begin{array}{l} {{dist}^{(k)}\\left( {T_{a,m},T_{b,m}} \\right) \\leq\
  \ {dist}^{(k)}\\left( {T_{i,m},T_{j,m}} \\right)} \\\\ \\forall i,j \\in [1,2,3,\\\
  dots,n - m + 1], a \\neq b \\land i \\neq j \\end{array}$$\n\n(6)\n$P \\in R^{n-m+1}\
  \ = D \\in R^{n-m+1} \\forall j \\in [1,2,3,\\dots,n-m+1]$\n\n我们提出了一种基于简单数学计算的策略，允许我们使用所采用的技术识别较长时间序列内部的重复子序列。要声称一个模式或子序列是“重复的”，你必须具备比较它们的能力。我们的灵来自于之前研究中\
  \ `MP` 使用方法的启发。计算 `MP` 的主要优势在于，它不仅能帮助你快速定位基元（motifs），还能找到时间序列中每个子序列的最近邻。首先，多维时间序列\
  \ `T` 是一组具有特定维度和子序列长度 `m` 的时间序列。由于在时间序列的所有维度中发现基元是不可行的，因此仅使用从位置 `i` 开始的所有维度的一个子集提取子序列。接下来，为了识别要使用的维度并减少序列数据的维度，使用了一种距离函数，该函数通过最佳的\
  \ `k` 个维度计算两个多维子序列之间的距离。然后将这些数据存储在向量表示 `D` 中。使用这种距离度量，可以找到最相似的子序列对并标记为“基元”。这些基元以对的形式（如公式\
  \ 5 所示）和矩阵的形式存储。从数学上讲，`k`-维 `MP` 是一个时间序列，存储了每个子序列与其最近邻之间的归一化距离。最后，它的任务是记录每个实例中最小的非平凡距离，这显著将空间复杂度降低到\
  \ $O(n)$。这种方法使我们能够将此问题本质上视为时间序列分析，在其中我们检测不符合既定模式的数据点，当这些点在指定的视频帧范围内重复出现时，会被标记为潜在的恶意行为。\n\
  \n### 眨眼频率\n\n应用程序的这一部分涉及检测受试者在范围内内的眨眼情况。研究人员对目前的眨眼检测方法进行了改进，如下：首先，如之前的工作所示，眨眼的检测在很大程度上取决于计算机视觉以及对人脸部关键点、受试者巩膜及其消失的检测。这应用于视频流时速度缓慢，且无法建立频率，因为检测在很大程度上取决于概率，而不是取决于二元状态（眼睛开\
  \ - 眼睛闭）。此处提出的系统通过建立眼睛的建立性来测量眨眼。首先，多维时间序列 `T` 是一组具有相同维度和子序列长度 `m` 的时间序列。由于在时间序列的所有维度中发现基元是不可行的，因此仅使用从位置\
  \ `i` 开始的所有维度的一个子集提取子序列。接下来，为了识别要使用的维度并减少序列数据的维度，使用了一种距离函数通过最佳 `k` 个维度计算两个多维子序列之间的距离。然后将这些数据存储在向量表示\
  \ `D` 中。使用这种距离度量，找到最相似的子序列对并标记为“基元”。这些基元以对的形式（如公式 5 所示）和矩阵的形式存储。从数学上讲，`k`-维 `MP`\
  \ 是一个时间序列，存储了每个子序列与其最近邻之间的归一化距离。最后，它的任务是记录每个实例中最小的非平凡距离，这显著将空间复杂度降低到 $O(n)$。这种方法使我们能够将此问题本质上视为时间序列分析，在其中我们检测不符合既定模式的数据点，当这些点在指定的视频帧范围内重复出现时，会被标记为潜在的恶意行为。\n\
  \n### 眨眼频率\n\n应用程序的这一部分涉及检测受试者在范围内内的眨眼情况。研究人员对目前的眨眼检测方法进行了改进，如下：首先，如之前的工作所示，眨眼的检测在很大程度上取决于计算机视觉以及对人脸部关键点、受试者巩膜及其消失的检测。这应用于视频流时速度缓慢，且无法建立频率，因为检测在很大程度上取决于概率，而不是取决于二元状态（眼睛开\
  \ - 眼睛闭）。此处提出的系统通过建立眼睛的建立性来测量眨眼。\n\n### 结果\n\n为了分析架构设置，研究人员将其置于不同长度、分辨率和帧率的考试循环视频中。这样做是为了模拟各种摄像头设置，并确定算法的性能。分析性能的指标是确定循环存在所需的时间；这样做是为了一个简单的目的：系统需要有信心地确定恶意行为，同时保持足够的实时性，因为在行为发生很久后进行检测几乎没有意义。在实验设置的实施和测试之后，研究人员通过执行时间的角度对数据进行了汇总和分析。研究人员针对新的循环检测结构对长度从\
  \ 5 秒到 30 秒的循环进行了测试，同时更改了帧率参数。结果非常鼓舞。首先，24fps 图显示，检测循环所需的总时间（包括将视频拆分为帧、写入帧、哈希帧以及执行这些操作所需的时间）很少超过循环本身的长度。此外，我们观察到哈希和模式匹配的时间随视频长度的增加呈大致线性关系。\n\
  \n\n\n\n在 60fps 视频的案例中，研究人员观察到总时间仅在 20 秒处就急剧增加。这可以理解，因为数据涌入量巨大，尽管如此，与哈希处理相关的时间仍保持了大致的线性路径，仅在\
  \ 20 秒处出现轻微偏离（尽管没有像总时间那样显著）。正如前面提到的，这种异常可以归因于帧时间以及负责帧拆分的库的局限性，而研究人员的建议在时间复杂度方面仍然是稳健的。最后，当针对从\
  \ 240p 视频（102,240 像素）到 2160p（8,294,400 像素）的视频分辨率时，结果符合预期，因为高度和宽度随着 `X`轴的增加导致图表呈指数级增长。然而，值得注意的是，算法的增长率（蓝线）比总时间增长得慢，这表明帧比较的动态机制对高分辨率的处理效果优于低分辨率。`哈希\
  \ + 模式匹配` 所需的时间从 240p 视频的每个像素 `4.936ps` 减少到 2160p 或 4k 视频的每个像素 `2.925ps`。\n\n##\
  \ 结论与未来展望\n\n总之，所提出的方法旨在防止在线环境中的违规行为，同时增强监考者的能力。正如各自的结果所示，研究人员能够成功检测并及时阻止攻击，同时保持良好的内存效率。研究人员意识到，仍然存在一些漏洞可以被潜在的不诚实学生利用，例如对移动电子设备的使用。一种可能的解决方案是进行眼动追踪分析，并验证考场周围是否存在强光。然而，这高度取决于视频流的质量，且容易产生假报警。此外，其他涉及同一房间内多人的漏洞可以通过监考者的警惕或手机手机形式的辅助摄像头来解决。我们鼓励在实现的动机发现方面进行改进，当涉及`通过距离测量来比较长时间序列`的算法改进，并引入`时间序列原语`的概念以辅助该主题的现实世界分类。\n\
