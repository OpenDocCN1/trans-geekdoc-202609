  \n每个应用代码在无线网络中传输的总数据包显示了不同的 App 代码二进制文件大小以及通过 OTA 传输到 pan 协调器的包数量。\n\n## OTA 刷入时间\n\
  我们需要无线刷入这些部署在较大距离的节点，由于需要包重传，刷入时间可能会进一步增加，重传是为了补偿因信道质量差导致的丢包。这种现象在图 7（不同网络规模的 OTA\
  \ 刷入网络设置时间）中描述，理论计算概述了刷入网络内节点所需的总量。例如，考虑一个共有 10 个节点的场景。在这种情况下，广播应用代码在网络内传输的累计包数为\
  \ 5580 个。假设数据速率固定为 `25KB`，刷入这 10 个节点所需的总时间约为 11.16 秒。随着节点数量的增加，刷入网络内节点的时间线性增加。这种现象在图\
  \ 7 中描述。\n\n![图 7. 每个应用代码在无线网络中传输的总数据包](img/fig32_7_C.jpg)\n\n图 7. 每个应用代码在无线网络中传输的总数据包\n\
  \n## 结论\n在本文中，我们使用 SENSEnuts 实现了空中下载（OTAP）。由于 `802.15.4`、功率和存储的限制，刷入时间增加了。未来的工作包括优化刷入时间。\n\
