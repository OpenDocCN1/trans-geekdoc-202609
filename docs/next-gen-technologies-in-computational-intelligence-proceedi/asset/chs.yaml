  \n图 2. 数字角色\n\n ![图 3. 修改后的角色](img/fig46_3_C.jpg)\n\n图 3. 修改后的角色\n\n完成后将角色发送到 `iclone8`。（在左上角，有一个将其发送到\
  \ `I Clone 8` 的选项）。以添加棚拍灯光。内容浏览器中将显示 `Stage` 区域。以添加棚拍灯光和 2D 背景图像。到 `Character`。（如\
