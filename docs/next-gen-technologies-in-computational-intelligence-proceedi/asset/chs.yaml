  \nJ. Jeron Berselin, R. Muthukani, N. Arunthathi and J. Frank Vijay\n\n印度钦奈纳，KCG\
  \ 技术学院，信息技术系\n\n电子邮箱：`jrnbrsln@gmail.com`, `mahirajan279@gmail.com`, `jeirus.jeff@gmail.com`\n\
  \nDOI: `10.1201/9781003430452-52`\n\n## 摘要\n\n仓库和正规市场的缺失抑制了农民，使他们无法以合理的价格出售农作物。因此，他们处于必须依赖中间人和当地商人来销售农作物的境地。中间人没有给农民合理的价格，导致农民无法过上幸福的生活。他们确实受到一些外部因素的影响，例如经纪人佣金、运输费用，更重要的是，他们完全取决于经纪人设定的价格/价格。本文提出了一种创建农民友好应用程序的方法，使他们能够直接以公平的市场价格将商品卖给客户，而无需任何中间人。应用实现了买卖双方概念，农作物产量可以无障碍地卖给买家。使用\
  \ Google 应用引擎（Google app engine）来查找农民的位置，客户可以轻松识别靠近他们的农产品。\n\n关键词：云计算；农业；Google\
  \ 应用程序引擎。\n\n# 引言\n\n云计算是一种按需的自动数据处理系统资源，它是最大的人力提供者之一，而且特别包含了知识存储和计算能力。“云”一词主要想描述通过互联网向多个用户提供当前市场的知识中心。云计算的主要优势是它主要减少了\
  \ IT 成本，即降低了维护 IT 系统的成本。云限于单一组织（即企业云），或者通过公有云面向售出售。云计算大多基于资源共享，并包括数据库、网络和软件的共享。\n\
  \n农业是任何国家的支柱。在农业中，产量是指单位土地面积产生的农作物数量或产品。农民最大的缺点是无法以盈利的方式销售农作物。农民无法负担运输费用，许多农民也无力负担存储设施。此外，农民面临的最重大问题是促进竞争以及对商品的需求。农民的产量储存在仓库（Warehouse）中，他们需要很长时间才能以特定数量出售产量并在没有任何浪费的情况下完成销售。本文介绍的应用程序将消除浪费的概念，并以正确且全额的数量出售产量。该应用程序避免了中间商（通常称为经纪人），因为产量的销售是在农民和买家之间直接进行的。该应用程序的设计和创建是为了让农民能够方便且有利地使用。\n\
  \n该应用程序将帮助农民无障碍地将他们的农产品直接卖给客户。对于依赖这一领域生存的农民和买家来说，将不再担心失去收入。应用程序帮助农民通过此平台销售产量，而且他们还可以决定卖给买家的价格。这有助于农作物更快售出而不腐烂，并获得利润。寻找农产品的买家也可以以合理的价格获得他们想要的产量。客户和农民的信息都存储在云端，并记录销售的金额和数量以供未来结算。这有助于计算该应用过程的利润。\n\
  \n## 相关工作\n\n可以开发一种方法和应用程序，通过产生天气预报报告、作物信息和工具来帮助农民。这是一个基于云的应用程序，支持农民了解天气状况并据此进行耕作。Peng\
  \ & Wang (2014)。\n\nCloud Agro System Jansirani et al., (2022) 为不丹农业做出贡献。这种基于云的技术专注于农民的电子知识、农民之间的通信、供需连接以及研究成果。Sunidhi\
  \ et al., (2018) 建议应用程序必须包含土壤、作物品种、市场价格、肥料和农药类型的信息。\n\n土壤水分含量 SWC 测量技术在 Bo & Wang\
  \ (2011) 中提出。它提供了一个基于云的 IoT 系统，使用了 AT&T 的 M2X，这是一个物联网（IoT）数据存储、服务和管理系统。系统介绍了包括种植所需的土壤类型、季节详情、生长所需的最佳肥料等信息。Vijayaghavan\
  \ & Kumaresan (2015)。\n\n这项工作的引人之处在于系统以当地原生语言提供信息，农民可以轻松理解。Peng et al., (2014) 引入了基于云计算的\
  \ GIS 概念；基于今天开发 GIS 应用程序的最流行趋势，以及在云中存储地理数据的关键云 GIS 技术。\n\n## 农场管理流程\n\n\n\n\n\n\
  农场管理是一项艰巨且耗时的工作，涉及各种任务。`图 1` 展示了农场管理业务流程。除了管理作物外，农场还必须管理投入、质量和库存。他们还必须分析盈利能力并管理财务。\n\
  \n![图 1. 农场管理流程。](img/fig52_1_C.jpg)\n\n图 1. 农场管理流程。\n\n农场经理创建标准化的技术种植说明以指导和引导田间工作。因此，技术人员负责监督工人按照播种计划和技术播种指南种植作物。同时，他们使用智能手机上的`Mobile\
  \ Operation Records System`或`Personal Digital Assistants` 记录田间作业数据和图像，包括劳动力等总农资投入。这些记录在上传到远程数据服务器后，会被收集在生产档案中。这些生产档案作为从每批次产品种植到交付的整个过程的信息文档。原材料根据每日收获计划进行挑选、交付、称重和储存。在交付销售之前，可能会使用不同的材料批次生产或包装不同的产品批。\n\
  \n农场经理可以获取生产过程的信息，并收集收集创建汇总播种面积和生产成本的统计数据。在获取农产品时，每种农事资源的信息会被录入 `DFMS`。每种农药的安全期信息可以在农资信息数据库中查询。为了帮助使用农药，可以使用\
  \ `HTTP` 协议将农药的安全间隔期数据下载到 `MORS`。此外，农场经理可以研究农药的使用情况并评估生产过程的安全性。经理可以检查每批产品，分析产品的成本结构，并根据种植、加工和交付的全过程信息对种植技术人员进行评估和奖励。\n\
  \n## 拟议系统\n\n上述架构图由管理员、客户端、用户、数据库以及其中的功能组成。拟议的架构图 `图 2` 代表了应用程序在使用时的基本组件，而 `图 3)`\
  \ 解释了工作系统的详细结构。该应用程序的数据由用户模块提供给服务器。数据组件包括位置数据和登录凭据等。所有对数据库的查询都从服务器传递并发送到数据库，数据库与服务器连接，从那里获取数据。用户可以选择客户真正需要的作物产量。此外，用户具有手动或自动选择其当前位置的选项。在成功选择作物后，客户可以通过此应用程序直接与农民聊天。实时位置让客户在自己的位置范围内选择产作物产品非常方便。在用户和系统之间，`API`\
  \ 充中介。它还用于确保安全、控制和身份验证。服务器、客户端和资源组客户端-服务器架构，并使用 `HTTP` 管理请求。作物详情、农民和客户详情以及交易历史存储在数据库中。\n\
  \n![图 2. 架构图。](img/fig52_2_B.jpg)\n\n图 2. 架构图。\n\n![图 3. 工作模型。](img/fig52_3_C.jpg)\n\
  \n图 3. 工作模型。\n\n该应用程序将帮助直接销售/买卖产量，无需任何中间卖商。此外，通过该解决方案增加农民利润的空间很大。应用程序拥有产量/产品的确切位置，买家可以联系并获得他们的产品。与现有系统相比，该应用程序的安全性很高，因为它使用云存储来存储卖家和买家数据。由于没有中间资源运输产量导致的任何浪费，此应用程序有助于快速销售产量而不产生浪费。\n\
  \n应用程序有一个搜索算法，可以根据买家的需求搜索不同的产量产品并显示结果。应用程序拥有卖者（农民）的位置，它显示了他们所在的位置和质量。产量和农民的实时位置用于\
  \ `Dijkstra’s Algorithm: Shortest path`。提供了聊天功能，农民和客户可以通过此轻松通信。\n\n该应用程序的优点是：首先，它易于使用，且\
  \ `User Interface` 适用于所有类型的用户。其次，该应用程序的安全性很高，因为它使用了 `firebase`。第三，通过使用 `Firebase\
  \ database` 可以轻松存储媒体文件和其他数据。而且，该应用程序的整体存储既简单又持续维护。重要的是，它对于客户日常使用更加灵活。最后，与其他第三方来源相比，可以对产品和价格进行合法性比对。\n\
  \n## 结果与讨论\n\n在本文中，该系统使用 `Java` 开发，并使用 `JAX-WS`（用于 XML Web 服务的 Java API）创建所需的 Web\
  \ 服务。系统采用了由五层架构模型组成的云系统，以处理大量的用户、信誉、安全扩展性。任何具有网络浏览器和互联网连接的终端设备（笔记本电脑；平板电脑或智能手机）都可以访问拟议系统，因为它采用了浏览器-服务器设计。每个田间作业序列的农资投入和劳动力细节都受到了监控和记录，以跟踪种植过程符合技术标准。（参考\
  \ `图 4`）\n\n![图 4. Android 用户界面。](img/fig52_4_C.jpg)\n\n图 4. Android 用户界面。\n\n拟议系统集成了手机电话、云计算和历史细节，以满足农场多批次、多种作物的精确管理需求。拟议系统\
  \ `图 5)` 不仅符合农场数据管理要求，而且能够有效地追踪和追溯每批次的生产过程。\n\n![图 5. 性能分析。](img/fig52_5_C.jpg)\n\
  \n图 5. 性能分析。\n\n## 结论\n\n中间人通过对产量作物索取高额利润来经营自己的业务。在这种情况下，农民在自己的产品没有收益的情况下无法承受如此高的利润。我们在项目中得出结论：农业部门是国家收入的主要来源之一，而通过最新的\
  \ IT 技术进行的电子通信进程可以带来许多变化。该应用程序通过以合理且有利的价格销售农产品促进农业经济发展。该应用程序还可以通过随时间演变的技术帮助我们农业的发展。此外，该应用程序有助于维护农民与客户之间的平衡关系。最后，每个农民都能以合法简单的方式获得高利润。\n\
