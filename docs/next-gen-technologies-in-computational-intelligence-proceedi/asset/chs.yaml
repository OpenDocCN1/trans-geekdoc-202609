  \ `SDKL` 提供了最高的准确率。因此，人们可以利用混合模型准确地预测患心脏病的概率。使用 `Python` 执行时，不同机器学习算法的准确率值如下。\n\n\
  ## 结论\n\n心脏病是一种影响全球范围内的严重疾病。生活方式改变和缺乏运动对人的健康都有负面影响。区分未处理的心脏相关医疗数据的治疗有助于早期发现心脏功能异常并可能产生救命的效果。本研究应用了机器学习技术来组织原始数据，并创建对心脏疾病的新前沿判别方法。临床环境下的心脏病预测具有挑战性但至关重要。无论如何，如果能及早识别疾病并采取预防措施，死亡率可以大大降低。临床领域提供了大量的诊断技术。然而，认为机器学习提供了最高水平的精度。该框架考虑了机器学习算法\
  \ `SVM`、`Logistic Regression`、`Decision Tree` 和 `KNN` 的有效性（Kuppers et al., 2020）。这些算法被用于构建混合模型，用于精确诊断心脏疾病。这项工作使用了存储在加州大学欧文市的数据。\n\
