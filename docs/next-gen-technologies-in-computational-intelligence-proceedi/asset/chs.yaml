  \nK. Komathi^(⁶⁴)\n\nDOI: [10.1201/9781003430452-79](https://dx.doi.org/10.1201/9781003430452-79)\n\
  \n## 摘要\n\n随着网络技术的发展以及计算能力和存储空间需求的不断增长，云端处理和云端存储正吸引越来越多的用户。换句话说，对更多计算能力和存储空间的需求驱动了云计算的采用。最近的攻击表明，个人信息可能会被泄露，计算任务可能被恶意篡改，云服务可能对用户失效。在文中，我们开发了一种三重认证方案，通过云端的适当认证来确保数据安全。该模型利用哈希链来实现上述目标。通过仿真测试了云认证的有效性。结果显示，所提方法的复杂度率低于现有方法。\n\
  \n关键词：云、身份认证、椭圆曲线密码学\n\n# 引言\n\n通过云计算的使用，消费者和机构从历史上由其承担的数据存储和计算义务中解放出来 (Tiwari and\
  \ Gangadharan, 2021)。得益于云计算的出现，用户和机构现在能够在位于远程计算机上存储数据并进行计算 (Anuradha et al., 2021)。\n\
  \n注册公共云的用户完成注册流程后即可访问云服务提供商提供的平台。用户可以在云中保存信息，这些信息以后可以被其他用户访问和共享。由于存储在云端，您可以在任何需要的时候从您选择的任何位置访问您的数据\
  \ (AlAhmad et al., 2021)。\n\n云存储有很多优点，但由于其开放性，也有很多缺点。云存储容易受到各种威胁的影响。确保这些信息的私密性至关重要。由于大多数服务提供商尚未安装必要的安全措施，用户数据可以被自由查看并以多种方式访问\
  \ (Rangwani and Om, 2021)。我们在云端保存的许多项目，如个人资料和医疗记录，都值得考虑。拥有一个不仅可靠而且具有适应性的访问控制系统至关重要。在文中，我们开发了一种三重认证方案，通过云端的适当认证来确保数据安全。\n\
  \n已保存信息的隐私必须随时受到保护。用户还可以选择将其信息开放给朋友。为了实现这一目标，他们将求助于密码学。具备安全措施至关重要。Seshadri, 2021)\
  \ 建议应该通过加密每个数据块来实现可更改的访问控制。这被用于完成这项任务。在这种方法中，采用了使用共享密钥的对称加密。\n\n## 相关工作\n\nWang\
  \ 等人 (2009)) 提出了一种基于基于身份的分层架构 (IHA) 的云计算认证新颖策略。这种策略是具有革命性的，因为它利用了云计算提供的优势。\n\n在云计算方面，数据隐私和安全是最关注的两个问题之一。Chen\
  \ and Zhao (2012)) 对整个数据生命周期中的这些问题进行了深入分析，分析了各种解决方案的有效性，并概述了进一步研究的途径。在云端存储数据并对其进行协作是本文研究的主要课题。以下是一些相关研究的摘要，主要关注对称加密、身份加密和属性加密在云存储中的应用。\n\
  \n然而，由于这种方法依赖于数据所有者向服务提供商和终端用户交付密钥，它消耗大量的存储空间。得益于 Ramesh 等人 (2017)) 发布的一种基于安全流密码\
  \ `ChaCha20` 的解决方案，现在可以对云端的用户的用户进行加密。这使得用户信息能够不受窥探。\n\nLi 等人 (2009)) 引入了革命性的 IBPRE+，旨在让社交云环境的用户更容易、更安全地共享信息。跨域身份代理重加密是\
  \ (2008)) 开发的一种方法，用于在不同域的用户之间安全地传输敏感信息。\n\nTang 等人 (2008)) 针对 Tang 方法建立了碰撞攻击，并提出了一种基于身份的不同的数据存储方法，该方法能够抵抗碰撞攻击并处理本地和远程查询。\n\
  \n\n\n\n\nRuj et al. (2012) 提出了一种去中心化的、用于云存储的身份验证访问控制方法。该技术在执行身份验证时无需用户身份，这意味着用户的隐私得到了保护。随后，他们又提出了一种用于云存储的新匿名身份验证系统，这是一种去中心化的访问控制机制。数据使用基于属性的加密（ABE）方法进行加密，验证则使用基于属性的签名（ABS）方法，这两者在\
  \ Maji et al. (2008) 中都有详细介绍。\n\n## 提方法\n\n单服务器系统中的每个服务器必须由移动用户注册，后者才能访问服务。移动用户在多个\
  \ `SSS` 服务器上注册后，必须保留几个 `SCs` 和凭据，这对于移动用户来说可能很困扰。\n\n非中心化设计增加了入侵者的风险，这会对整个路由过程产生影响。在目前的云安全措施中，恶意节点从网络中移除以防止入侵。由于这些恶意节点，整个网络遭受了严重的丢包，加剧了拥塞问题。\n\
  \n图 1 为我们托管在云端的数据存储平台提供了层次概述。`半信任第三方`（`STTP`）、云存储服务器、数据所有者和请求者构成了该模型的四个不同实体。`STTP`\
  \ 负责对构成云存储服务的用户和服务器进行监督，并对其进行管理。用户密文被保存并备份在属于云存储服务的服务器上。正如 图. 1 所示，这确保了用户数据的安全。\n\
  \n![图 1. 系统模型](img/fig79_1_C.jpg)\n\n图 1. 系统模型\n\n数据所有者在其他位置的服务器上存储数据的加密副本。这减轻了本地存储的负担，同时简化了数据访问过程，并允许在任何时间从任何地方共享数据。发送请求的人目的是让更多的人接触云端存储材料。\n\
  \n用户管理中心、密钥管理中心和数据处理中心构成了 `STTP` 的三个基本组件。用户管理中心是这三个组件中最关键的。`用户管理中心` 是负责解决在删除当前用户或注册新用户时可能出现的任何问题的组织。\n\
  \n云存储系统的用户列表（`UL`）和撤销列表（`RL`）由系统定期更新，包含最新的允许用户列表及其账户关联公钥。这些列表分别被称为用户列表和撤销列表。密钥管理枢纽的责任为每个唯一用户生成部分私钥。密文的明文版本存储在存储云数据的服务器上。这些服务器可以在被请求时向数据处理中心提供密文。\n\
