  \n\n\n\n在本文中，我们讨论了数字水印是将唯一的不可感知标识符嵌入到图像、视频、音频或文档等数字媒体中的封装过程。数字水印的目标是识别并保护数字内容的所有权和完整性。数字水印可以采取多种形式，包括可见或不可见的文本、图像、标志或这些元素的组合。水印在创建过程中或在创建后使用专用软件（Sisaudia\
  \ and Vishwakarma, 2021）被添加到数字媒体中。数字水印通常用于防止版权侵权、盗版和对数字媒体的未经使用。它还可以用于跟踪和监控数字内容的分发和使用。水印可以设计为抵抗各种形式的操纵或变换，例如压缩、裁剪或缩放，并用于识别内容的原始来源。总而言，数字水印为保护数字内容创作者和所有者的权利提供了一种方法，并确保内容的可靠性和性（Wang\
  \ et al., 2022）。然而，为了版权保护、防伪目的的可追溯性和信息完整性，数字水印被广泛应用。传统的水印方法可能会永久改变图像的原始性。可逆水印（RW）被建议作为恢复宿体图像和提取隐藏通信的方法（Dong\
  \ et al., 2022），并且正受到越来越多的关注。数字水印可以包含有关数字内容所有者的信息，例如他们的姓名或版权信息。这有助于识别内容的所有者，并在发生版权侵权时证明所有权。在发生版权侵权的情况下，数字水印可以作为法庭上的证据。通过证明所有权和水印的存在，所有者可以证明内容是在未经许可的情况下获取或利用的。总的来说，数字水印是版权侵权中的重要工具，可以帮助防止数字内容的未经使用和分发。它还可以帮助保护内容创作者和所有者的权利，并确保他们获得作品的适当报酬。水印策略中覆盖画布的可逆性可以通过多种技术实现，例如无损压缩（Dong\
  \ et al., 2022）、直方图平移（Hespanhol et al., 2021）、鲁棒可逆水印（Xing et al., 2022）、压缩策略 [[13]]以及事件触发的动态水印方法（Xiao\
  \ et al., 2022）。\n\n## 数字水印的要求\n\n通用要求主要分为五类：透明性、鲁棒性、容量、抗篡改性和可逆性（Xiao et al., 2022）。\n\
  \n![Fig. 1. 数字水印描绘](img/fig57_1.jpg)\n\n### 透明性\n透明性或恒性是指初始形式与带水印形式之间的永久可比性（Xiao\
  \ et al., 2022）。数字水印在加水印后不应影响图像和覆盖区域的原始性。\n\n### 鲁棒性\n鲁棒性具有比普通信号处理更后检测水印的能力。水印在抵抗几何和非几何攻击时应该是强有力且有活力的（Dong\
  \ et al., 2022）。\n\n### 容量\n容量或信息负载描述了作为时间或工作单位被加密的水印总比特数（Xiao et al., 2022）。这一类别解释了应该作为水印嵌入多少数据以便在需要时高效发现。\n\
  \n### 抗篡改性\n水印方法中的篡改检测可用于检查真实性或合法性。对水印的任何改动（Wang et al., 2022）。因此，通过评估完整性，系统判断水印是否被侵犯。\n\
  \n### 可逆性\n可逆性特征验证了水印的检索和宿主图像的清晰重构。尽管对于医学影像，修改后的图像被用宿体描述，重构的图像用于诊断（Dong et al.,\
  \ 2022）。在可逆数字水印机制中，逻辑过程获取原始图像并获得带水印的画布。然后利用提取算法，该函数在私钥的帮助下检索初始画布和水印画布（Xiao et al.,\
  \ 2022）。\n\n## 通用机制\n\n### 数字水印技术\n\n#### 基于 DCT 的水印（离散余弦变换）\nDCT 域水印可能被分为两种类型：(i)\
  \ 全局 DCT 水印 (ii) 基于结构的 DCT 水印。基于结构的水印功能将给定图像分组成不相关的 8x8 矩阵块，将 DCT 应用于特定块，并可选地应用于某些块。基于结构的结构\
  \ DCT 通常用于数字图像处理（Ding et al., 2022）。而量子“在最高频率处是微小的，而全局水印在中等频率处激活画布的效率”。\n\n#####\
  \ 基于 DWT 的水印（离散小波变换）\n水印重构了波通信，它是通过修改主要曲线追踪的集合添加的（Sisaudia and Vishwakarma, 2021）。考虑到它可以作为小波变换的一种数值一致的频率单字使用。水印的小波分解是将离心图像投影到三种类型的波：平行波、直立波和交叉波。\n\
  \n##### 双基水印技术\n\n\n\n\n\n基于双基的水印标记分为两类典型类别，包括数字化可见水印和不可见水印（Dong et al., 2022）。数字化可见水印是单图概念的扩展。此类水印仅适用于描绘。虽然这些单图作为描绘被插入，但它们是紧密结合的，因此无法通过裁剪画布的中间部分来分离这些水印（Dong\
  \ et al., 2022）。此外，这些水印能够防止诸如数学实验之类的攻击。数字化可见水印是覆盖在原始图像上的第二个半透明层。对于任意观察者来说，在镜检检查时该水印是半透明的。不可见健壮水印以简单的形式嵌入，其中对像素相关性意味着修改在概念上是不可标记的，并且可以作为一种有效的解码策略进行恢复（Sinhal\
  \ et al., 2021）。不可见易碎水印嵌入了更好的优化中，对该画布的任何伪造或更改都可能转换或破坏水印。双基水印是数字化可见水印和不可见水印的结合。这种水印，即不可见水印，被用作数字化可见水印的替代方案。不可见健壮秘密水印标记管理需要真实或真实的描绘来进行水印识别（Ding\
  \ et al., 2022）。不可见健壮公有水印标记方法不需要原始或实例图像来进行水印识别（Xing et al., 2022）。\n\n## 优化机制\n\n\
  ### 奇异值分解\n\n`SVD` 被视为评估晶格的主要健壮统计方法工具。在 `SVD` 变中，晶格可以分解为三个与真实晶格规模相似的其它晶格（Hosny et\
  \ al., 2021）。`SVD` 变换保护了单向和非对称属性，通常不需要在 `DCT` 和 `DFT` 变换可用。\n\n### 独立成分分析\n\n独立成分分析目前是一种用于水印描绘的演进机制。`ICA`\
  \ 被用于评估嵌入水印处的数值上独立变换系数（Hespanhol et al., 2021）。该机制的重要优点是其单手方法，单个用户可以描述其独特的基于 `ICA`\
  \ 的变换。\n\n### 神经网络\n\n`ANN` 是另一种受有害神经系统功能和实际方面影响的拓扑框架的统计复制（Hosny et al., 2021）。神经网络由一组相互连接的神经元组成，大多数攻击不会退化识别和提取水印描绘的效率和标准，因为\
  \ `FCNN` 具有存储和缺陷承受（Gong et al., 2021）。\n\n### 支持向量机 (SVM)\n\n在当前的技术改进中，`SVM` 用于数字化水印。与使用传统的神经网络框架相比，`SVMs`\
  \ 更简单精细。该小波的摘要为了开发一个从初始到最后的框架，可以描述 Gong et al., 2021。\n\n## 数字水印的特征\n\n### 安全性\n\
  \n现有的不安全水印技术无法用于保护知识产权、验证数据或跟踪非法内容。因此，如果攻击者缺乏用于水印的密钥知识，可以使用更轻量的方法保护载体画布的隐私（Xing\
  \ et al., 2022）。此外，水印方法的难度可以被视为安全性，因为攻击者被阻止搜索嵌入空间。为了提高算法的保护，可以增加嵌入空间（Wang et al.,\
  \ 2022）。\n\n### 健壮性\n\n在检查和研究数字多媒体安全性时，水印算法的健壮性是一个重要的考虑因素。数字化多媒体在所有业务领域的日益增长使得版权保护变得必要。版权保护是数字资产的核心特征。在数字数据的近期研究趋势中，使用了不同算法的健壮性。水印维持非恶意图像操作（如压缩、滤波等）的能力被称为健壮性（Xiao\
  \ et al., 2022）。也就是说，即使在存在各种攻击的情况下，水印提取算法也能从带水印的图像中获得适当提取。健壮性随实现而异，并非所有实现都要求对所有过程具有可靠性。然而，拥有一种能够抵抗任何可能发生的失真的提取技术将是理想的。在某些情况下，健壮性可能完全无关甚至不可取，例如易碎水印（Xing\
  \ et al., 2022）。\n\n### 嵌入容量\n\n插入水印的数据量可以隐藏到直到可以为了身份验证和版权保护被可靠地提取的程度，这正是容量的定义。容量由在不可见性和健壮性条件下原始数据的比例决定（Xiao\
  \ et al., 2022）。可以创建的独特模式越多，可以嵌入的比特就越多。在尽可能包含尽可能水印数据方面，数字水印提出了一个更具挑战性的任务。容量的需求通常取决于用于水印的实际相关性。裁剪音频的容量将是建立的每秒比特数。也就是说，水印包含的容量位越少，计算复杂性越高；较大的容量、更少的误报或更少的粒度将扩展数据注入方法的潜在操作。并使身份验证判断更可靠。\n\
  \n\n\n\n\n对潮位图像（tidemark images）应用了多种攻击性入侵改进，以分析蒸馏潮位，从而确定所假设的水印机制的强度。提取出的水印的评估被分为侵入性和非侵入性（Ding\
  \ et al., 2022）。在这里，考虑了音频裁剪、循环、低通、高通、中值滤波、音量衰减和 JPEG 压缩等攻击（Ding et al., 2022）。裁剪涉及移除标记图像的一半，并用假值替换以保持其真实尺寸，这是为了满足神经网络的输入尺寸要求。我们将原始\
  \ RGB 值存储在质量为 95% 的 JPEG 压缩图图像中，并对其进行恢复以分析潮位散度（Ding et al., 2022）。对于非侵入性，我们发现裁剪和音质下降可以保持足够强度的潮位，而其他攻击会导致明显的感知差异（Ding\
  \ et al., 2022）。\n\n## 抗篡改\n\n水印系统的篡改检测可以验证真实性（Gong et al., 2021）。每当潮位数据被更改时，图像就会篡改。因此，该方法通过测试完整性来检测潮位数据是否被更改。\n\
  \n## 版权保护\n\n数字水印最早的应用是为了寻求版权保护。在这种情况下，元数据包含了有关版权所有者的细节。需要保护的初始工作以水印的形式微妙地嵌入。在线内容用户（音乐、图像和视频）如果拥有更好的水印检测器访问权限，必须能够识别和分析嵌入的水印，并识别被标记信息的版权所有者。让我们来看一个例子，当发送者在支持数字的应用中解锁图像时，Digi\
  \ 水印将检测到水印。它将使用水印作为密钥在远程数据库中搜索版权所有者和凭据。真实的发送者可以使用这些数据联系图像的版权所有者并请求授权。基于水印的安全明文图像通过同态加密促进了基于云的版权作品存储、透明显示和管理化更改（Dong\
  \ et al., 2022）。\n\n## 数字水印的优势\n\n数字水印是将唯一标识符（如代码或图像）封装到数字内容中的过程，以使其免受未经的使用或分发。数字水印的一些优势包括：\n\
  \n-   **版权保护**：数字水印可以帮助保护图像、音乐和视频等数字内容的版权，让他人使用或分发变得困难（Wang et al., 2022）。\n-  \
  \ **品牌推广**：数字水印可以作为品牌工具来推广公司的产品或服务（Dong et al., 2022）。例如，可以将公司 Logo 嵌入到视频或图像等数字内容中，以帮助品牌。\n\
  -   **追踪与识别**：数字水印可以用于追踪和识别数字内容的来源（Xiao et al., 2022）。这对于追踪版权材料的分发或公司数字资产的使用非常有用。\n\
  -   **身份验证**：数字水印可以用于验证数字内容的来源和完整性（Ding et al., 2022）。这对于确保数字内容没有经过任何形式的篡改或更改非常。\n\
  -   **法律诉讼中的证据**：数字水印可以在法律诉讼（如版权侵权案件）中提供证据，通过证明数字内容的所有权和未经授权的使用（Gong et al., 2021）。\n\
  \n总的来说，数字水印为保护数字内容的强大工具，可以为个人和企业提供一系列利益。\n\n## 数字水印的缺点\n\n虽然数字水印有很多优势，但也有一些缺点。数字水印的一些潜在缺陷包括：\n\
  \n-   **质量下降**：取决于水印的类型和强度，在图像或视频中嵌入数字水印有时会降低内容的质量（3）。这可能导致用户体验下降，对内容的感知产生负面影响。\n\
  -   **易被移除**：具有足够知识和工具的人可以移除数字水印（7），这可能使其作为版权保护或追踪的手段失效。\n-   **复杂性**：嵌入数字水印可能是一个复杂的过程，需要专门的软件和专业知识（Hosny\
  \ et al., 2021）。这使得个人或组织难以实施，特别是当他们缺乏必要的资源时。\n-   **误报**：数字水印算法偶尔产生误报，在内容未侵权的情况下将其识别为侵权（Ding\
  \ et al., 2022）。这可能导致合法使用内容被错误标记为未经授权，对用户和企业产生负面影响。\n-   **成本**：实施数字水印可能涉及成本，包括购买软件或服务以及人员培训。对于小型企业或个人来说这是一个巨大的障碍（Du\
  \ et al., 2023）。\n\n总的来说，数字水印可以是保护数字内容的有用工具，但它并非没有局限性和潜在缺陷。\n\n## 结论\n\n在本文中，我们结论认为这种水印处理步骤提供了原创性的透明、稳健性和嵌入明文的能力，它还包含了有助于将明文有效嵌入原始图像的重要机制，这些基本特征意味着对经过验证的数据进行知识产权保护，并隐藏了水印可靠的嵌入能力。通常，优化机制有助于提高提取和检索水印的性能。因此，未来可逆水印算法的增强将识别裁剪攻击并提高效率。\n\
