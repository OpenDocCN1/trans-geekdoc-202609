  \ IEEE Transactions on Instrumentation and Measurement.\n\n\n\n\n数字取证通常关注存储在工作站（计算机）、手机手机、相机和若干电子设备上的产物。然而，在过去的十年里，研究人员开发了许多内存取证工具，协助对易失性内存进行调查，扩展了内存取证的范畴。本文回顾了存储（内存）取证领域的众多研究，对现代方法论进行了批判性评估，讨论了对内存取证产生影响操作系统架构重大进展，并确定了进一步研究的关键课题。存储取证技术通常结合存储介质的位完美副本使用，主要侧重于“静态”检查。这些副本用于恢复被删除的文件或文件碎片、识别文件访问样本、跟踪之前的网页浏览行为并执行其他操作。由于犯罪活动的增加，取证目标数量急剧增长，等待案件也随之增加。这包括恶意软件的发展趋势——恶意软件现在经常不会在易失性存储设备上留下任何痕迹；取证目标规模大幅增加；由于更多不当（犯罪）活动涉及计算机使用导致的大案件积压；以及在事件响应中使用取证技术来应对恶意软件。进程列表、网络连接、聊天消息片段、打开连接列表以及驱动器加密的素材都是此类证据的某些示例。\n\
  \n## 文献综述\n\n在本节中，解释了内存取证过程的调查。图 1 代表了内存取证过程的类型。\n\n![图 1. 内存取证过程](img/fig70_1_B.jpg)\n\
  \n图 1. 内存取证过程)\n\n## 现场采集\n\n通过存储组件，数据的实时采集及其处理是分离的。这些新兴技术之一是 3D XPoint (Gupta,\
  \ 2017)，它声称桥起了内存与传统仓库（存储）之间的鸿沟，并提供前所未有的高吞吐量非易失性数据。在本文中，我们在深地下中微子实验（DUNE，史上最大的实验之一）系统中描述了基于\
  \ 3D XPoint 的永久内存设备的功能。此外，还创建了一个利用数据中心持久内存（DCPMM）的高级应用，并与测试设置相结合，以确认其在 DUNE 超新星存储缓冲区中的可能应用。观察到，PMDK\
  \ 软件库增加的开销对整体性能有影响。因此，添加了软件改进，即利用 `MOVNTI` 指令集的软件增强，性能随之提升了 20%。观察到系统的行为与访问大小无关，这证实了\
  \ DCPMM 的内存状态。在 Kumar 等人（2018）中，作者在数学算法中使用多种哈希函数，以便取证调查人员能够证明文件是否被篡改。\n\n## 易失性内存采集\n\
  \n易失性内存存储了某些价值信息，包括应用程序数据的普通文本，动态地展示操作系统和应用程序的当前状态。它是内存取证领域的一个整体分析对象。这项研究（Ullah\
  \ 等人，2020）提供了一种 Android 操作系统易失性内存数据采集技术，称为私有应用存储内存（PASM），它可以用于计算机取证环境，也可以用于未经过准备的\
  \ Android 设备。PASM 利用 Android 原始设备制造商（OEM）提供的系统级数据迁移功能，将应用程序的私有数据导入中间设备（OEM）。\n\n\
  实验结果显示，PASM 可以获取存储在主内存中的某些私有信息，但更重要的是，PASM 可以跨越大多数实际限制，使其比目前使用的 Android 操作系统内存采集技术更有用。\n\
  \n本文提出了一种用于 Android 移动设备的私有数据记录（采集）技术——PASM。它基于内存取证和系统级数据迁移。本文对 PASM 的原理、框架、实现和过程进行了详细介绍。在七种不同的实验设置下测试了六类三十个应用程序。试验结果表明，我们建议的\
  \ PASM 可以成功访问安装在未修改设备内存数据中的各种程序，包括账户用户名、密码和其他机密信息。\n\n## 内存转储分析\n\n在计算机崩溃、系统故障或任何异常发生时检查计算机内存被称为内存转储分析（memory\
  \ dump analysis）。转储文件捕为 `.mem` 文件。内存转储通常记录在硬盘上的文件中，然后可以使用 Volatility Framework 等专业软件进行检查。在\
  \ Xia 等人（2020）中，作者提出了一种两步法内存转储分析方法，涉及首先获取易失性内存数据和非易失性内存数据，然后将提取的内容合并并转换为 3D 内存系统。\n\
  \n## 静态采集\n\n非易失性内存是一种计算机内存，即使在掉电或关闭也能保留其包含的数据。因此，非易失性内存可用于存储数据，包括必须长期保存的操作系统文件、软件代码和用户数据。当系统无法以支持现场采集的方式安全关闭时（例如当认为系统已被恶意软件入侵，恶意软件在检测到采集尝试时可能会在内存中破坏或隐藏其踪迹），内存取证中偶尔可能需要静态采集。静态采集涉及物理上从系统中移除内存模块，并使用专业工具提取存储的数据。文件系统元数据包括存储在文件系统上的文件和目录的文件名、时间戳、权限和大小等详细信息（Rajalingam\
  \ 等人，2020）。内存取证中的文件系统元数据可以是理解系统行为和发现潜在安全问题的有用数据源。以下是文件系统信息在内存取证中的某些应用：\n\n### 1\
  \ 内存取证技术的灵活性\n\n时间线分析通过允许文件系统元数据生成文件和目录活动的时间线，协助发现行为模式或可疑活动。它可以定位被删除的文件并可能恢复它们。文件系统信息可以帮助分析人员跟踪哪些文件被查看、更新或执行。理解用户或系统行为以及发现潜在的安全事件，都可从这些信息中获益。\n\
  \n### 2 系统配置识别\n\n文件系统元数据可以提供有关系统设置的有用详细信息，例如关键系统文件的位置或程序/应用程序的存在。在内存取证中，文件系统元数据是一个重要数据源，可用于重建系统活动并发现潜在的安全事件。尽管如此，必须记住文件系统元数据可以获取准确的时间戳。\n\
  \n### 3 查找被删除的文件\n\n\n\n\n\n即使文件已从文件系统中删除，其信息可能仍然存在于内存中。分析人员可以通过存储在内存中的文件系统元数据对存储设备进行检查。文件系统元数据包含了关于存储设备上文件和目录的数据，例如时间戳、文件名和文件属性。除了恢复丢失文件的方法和分析未分配磁盘空间数据的方法外，本文还讨论了恢复文件系统信息的几种方法。此外，文章还提到了侦调查人员在尝试恢复文件系统元数据时可能遇到的困难，例如文件系统损坏或加密。包括智能手机、数字照相机和固态硬盘在内的各种电子设备都使用了闪存器，这是一种非易失性内存。\n\
  \n## 非易失性内存获取\n\nDong 等人使用了一种特定的方法从 NAND 闪存内存设备中检索数据，这种方法被称为“回写程序（copy-back program）”。数据从内存复制到另一个位置，根据需要进行修改，然后由回写软件写回原始位置（Bharath\
  \ and Suganthi, 2018）。该方法可以用于法证分析，以从已损坏或损坏的内存单元中恢复数据。分析文件系统和数据结构包括评估数据是如何组织的。\n\n\
  为了从 NAND 闪存内存设备中检索数据，使用了回写技术。使用此方法时，必须先将数据从内存设备复制到另一个位置，在那里根据需要进行修改，然后再写回原始位置。记录在\
  \ `NAND` 闪存内存中的损坏或损坏数据可能无法访问，甚至可能丢失。这些损坏内存单元的数据可以通过“回写方法”恢复，通过将其传输到另一个位置，根据需要进行修复或更改，然后将其写回独立的内存中。当内存单元受损或损坏时，这是恢复原本可能丢失的数据的一种有效策略。\n\
  \n## NAND 闪存内存分析\n\n一种名为 Flex Capacity（灵活容量）技术的内存取证方法会对活动系统的内存进行快照，并在具有更大存储空间的机器上对其进行检查（Huan\
  \ 等人， 2020）。这种方法允许分析人员检查更大的转储文件，而由于存储限制，这在创建转储文件的系统上可能是无法实现的。该方法的优点是允许允许调查人员检查一个更大的转储文件，其中可能包含更多与调查相关的信息。当所研究的系统存储空间不足，或者转储文件大到无法在提取它的系统上检查时，Flex-Capacity\
  \ 方法非常有帮助。调查人员可能通过使用具有额外存储空间的独立系统，进行更彻底的存储分析，并找到更多与调查相关的证据。为了保持转储文件的完整性，需要注意的是，flex-capacity\
  \ 技术要求对内存获取和传输过程进行仔细考虑。转储的捕和传输应该使用能保持数据完整性的工具和技术，因为对转储文件的更改或修改可能会影响检查结果。\n\n## 讨论\n\
