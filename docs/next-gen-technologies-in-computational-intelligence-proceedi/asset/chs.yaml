  \ | TCS | -0.00507 |\n\n`Twint` 是一个开源数据爬取工具，允许用户从推特上提取数据。它用 `Python` 编写，可以爬取推文、用户资料、关注者列表等信息。它还允许用户在没有\
  \ API 的情况下从推特提取数据。\n\n\n\n\n\n收集数据后，应进行预处理以避免包含无效数据。使用皮尔逊系数（Pearson co-efficient），为所有收集到的指标形成相关性矩阵。识别股票之间的正相关性并选择这些特定股票进行风险分析和进一步处理。\n\
  \n使用风险分析方法识别低风险数据，并收集包括最高、最低、开盘和收盘价指标在内的时间序列数据。对于识别出的股票，抓取推文数据以及任何与这些特定股票相关的其他数据。使用\
  \ Vader 分析计算情感得分。将时间序列数据集与情感得分相结合，这是股票市场中更好预测的主要因素。\n\n## 实验与结果\n\n### 相关性矩阵与风险分析\n\
  \n相关性矩阵（图 3）使用皮尔逊系数方法构建，以识别高度依赖的股票数据。该针对 30 个参数的相关性矩阵显示了正相关数据，即系数大于 0.5 的数据。这些参数为\
  \ `TCS`、`Wipro`、`Bajajfinserve`、`Bajajfinance`、`IndusInd Bank`、`Bajajfinance` 和\
  \ `Tech Mahindra`。\n\n![Fig. 3. Correlation Matrix](img/fig54_3_B.jpg)\n\n图 3. 相关性矩阵\n\
  \n在这些正相关数据之间，使用标准差计算风险值。\n\n$$s = \\\\sqrt{\\\\frac{\\sum^{}{(X - \\overline{X})}^{2}}{n\
  \ - 1}}$$  \n\n> s- 标准差，\n> X - 日收益率，\n> X̄ - 日收益率平均值，\n> n - 样本总数\n\n它衡量了投资收益偏其平均收益的程度（图\
  \ 4）。该图代表了每只股票的公司风险水平。它显示在相关数据中，`TCS` 低风险值，而 `Induslnd Bank` 有高风险值。\n\n![Fig. 4.\
  \ Risk Analysis](img/fig54_4_B.jpg)\n\n图 4. 风险分析\n\n### 情感分析\n\n在本研究中，我们采用 `VADER`\
  \ 工具分析从 Twitter 收集的大量文本数据的情感得分。文本的整体情感由 `compound score`（复合得分）捕捉，这是一个单一值。它通过累加文本中每个词分配的性得分并根据情感强度进行调整，并将得分归一化为\
  \ -1（最负面）到 +1（最正面）之间。`compound score` 提供了文本情感的整体衡量，同时考虑了正向和负向情感。`Vader` 分析包含了从收集的推文中获得的正、负和中性情感值，`compound\
