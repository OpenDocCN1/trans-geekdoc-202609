  ## 摘要\n\n印度手语（ISL）常用词汇的识别，使听障和言障碍能够与正常社会交流，在无需人工翻译的情况下表达他们的日常需求。尽管在二十年来，手势识别（HGR）的研究一直很，但最近流行的手势识别人机交互（HCl）系统使用了深度学习，这需要高规格的系统和硬件。提出的新系统每秒从输入的手势中提取\
  \ 3 帧，处理图像照明条件的变化，并使用无监督迁移学习从预训练卷积神经网络（`CNN`）的初始层提取手势特征。由于提取的二维特征矩阵巨大无法处理，因此使用了基于机器学习的降维技术奇异值分解（`SVD`）自动减少每帧特征向量的维度，为每个手势生成唯一的子空间并存储在数据库中。使用`K-Nearest\
  \ Neighbor`距离度量进行分类。除了少数动态手势外，系统以高精度识别了所有其他手势，且性能与现有方法相当，但资源和训练时间更少。\n\n关键词：ISL,\
  \ HCI, HGR, `CNN`, 特征向量， `SVD`, 降维，深度学习，机器学习\n\n# 引言\n\n手势似乎是正常世界中听障和哑人士良好的交流媒介，也适用于人机交互和人交互（HRI）。印度手语手势可以使用单手（Fallucchi\
  \ and Zanzotto, 2009）或双手（Mammen et al. 2015）显示，属于静态或动态类型（Danilo Avola et al. 2019;\
  \ Li et al. 2020）。Fallucchi and Zanzotto (2009](#ch4.xhtml#ref4_10))通过将图像转换为 YCbCr\
  \ 空间处理照明变化，并使用离散小波变换（`DWT`）在 ASL 数据集上进行特征提取。复杂的静态手势由 Fallucchi and Zanzotto (2009](#ch4.xhtml#ref4_10))通过在双手佩戴黑色手带辅助提取特征，并使用分岭算法和区域合并技术进行分割。显示的手势可能对应单词和句子（Li\
  \ et al. 2020）或手指字母拼写（Mammen et al. 2015](#ch4.xhtml#ref4_15)）。使用循环神经网络模型`LSTM`通过将连续符号拆分为子部分来识别与单词对应的手势；这些子部分被用于训练模型。子单元网络获取的知识用于识别与单词和句子对应的动态手势。静态图像（Donq\
  \ Liang et al. 2018）可以是 RGB 图像（使用手持相机拍摄的图像、使用双目相机拍摄的 3D 图像、使用 Kinect 相机拍摄的深度图像（Gnanapriya\
  \ and Rahimunnisa, 2022)），或者是由 Leap 控制器生成的骨骼图像（Li et al. 2020)），使用红外相机或红外二极管的图像（Li\
  \ et al. 2019)），使用密集光流和皮肤滤波器跟踪指尖以识别动态手势。Leap 控制器对应手指关节、手心中心和腕部以每秒 120 帧的速率发射红外光。这克服了图像照明条件的变化和复杂背景图像；特征提取和识别通过`CNN`完成。在识别手势的文献中，各种图像处理（Donq\
  \ Liang et al. 2018）、机器学习（Danilo Avola et al. 2019; Donq Liang et al., 2018)）、计算机视觉（[ch4.xhtml#ref4_9]）和深度学习技术或这些方法的结合，即使用基于模型的方法（Danilo\
  \ Avola et al. 2019; Sahoo, 2018)）或基于外观的方法（Donq Liang et al. 2018; Fallucchi and\
  \ Zanzotto, 2009](#ch4.xhtml#ref4_10); Li et al. 2019](#ch4.xhtml#ref4_11); Gnanapriya\
  \ and Rahimunnisa, 2022](#ch4.xhtml#ref4_12))）被使用。\n\n## 相关工作\n\n\n\n\n手势是聋哑社区唯一的交流媒介。在像印度这样人口多样化丰富的国家，与邻近州的人交流本身就是一项挑战，因为对日常用词汇的误解可能导致沟通失败；为了解决这个问题，过去几十年里研究人员已经开展了基于视觉和基于传感器的技术工作。基于视觉的技术更适合实时处理，因为它不需要任何实验室环境。手势识别系统在\
  \ `HCl`（人机交互）、`HRI`（人机交互）、游戏、老年人辅助生活以及自动驾驶汽车领域具有广泛的应用。人与类人机器人交互的手势通过图像处理实现了人与类人机器人之间的交互。模拟使用\
  \ `WEBBOTS` 仿真软件完成，并针对 `HOAP-2` 机器人进行了测试（Nandy et al. 2010）。作者（Sharma and Anand,\
  \ 2020）考虑通过手轨迹从动态输入中识别显示出的手势。\n\n使用 `Kinect` 相机捕捉深度图像进行手势识别（HGR），通过理解人类行为改进了人机之间的通信。该论文（Wadhawan\
  \ and Kumar, 2020）检测指尖并跟踪指尖轨迹，提取手指的几何特征（如手指的长度、宽度和方向）以确定手势。与显示手势对应的提取几何特征通过 `SVD`\
  \ 存储在唯一的手势子空间中。使用基于 `Grassmann manifold`（Grass 流形）的判别分析来分析用于识别测试手势的因变量。这句话表述不明。Bommert\
  \ et al. (2020) 使用 `CNN` 从 `Kinect` 深度图像中提取特征，并使用 `SVM` 进行分类。它解决了光照变化和背景变化的问题。`CNN`\
  \ 从连续的语义视频帧中提取局部空间模式和运动的时间动态。池化语义视频片段的向量形成了一个名为 `Grassmann match kernels`（`GMK`）的向量子空间。典型相关性用于匹配视频以进行动作识别（Nandy\
  \ et al. 2010）。\n\n统计降维方法综述。Verma and Choudhary (2020) 用于处理高维数据，因为其包含更多冗余信息，通过统计或具有数学洞察力的机器学习等数学程序，可以在不显著丢失信息的情况下将其移除。降维降低了数据结构的复杂性并保持了信息。由于高维数据的数量增加，特征选择成为近期趋势中的一个新兴问题。过滤方法选择相关特征，可以缩短运行时间并提高机器学习算法的预测准确性（Mittal\
  \ et al. 2019）。\n\n印度手语手势包括单手或双手的静态和动态符号。视频数据库的目的是为许多手势保留多个视频。为了应对光照和方向的变化，使用了 `Direction\
  \ Histogram`（方向直方图）。显示手势的识别是通过 `Euclidean distance`（欧几里得距离）和 `K-nearest neighbor`（K\
  \ 近邻）等距离度量进行的（Sorzano and Vargas, 2014）。可以使用预训练模型或其部分来提取特征。单词和句子对应的连续手势序列是由 Li et\
  \ al. (2020) 使用 `RNN` 架构 `LSTM` 确定的。系统的输入是由 `leap motion controller` 根据十个指尖和两个掌心的\
  \ `12` 个数据点生成的 `IR` 光。它将连续手势划分为子单元并使用这些子单元训练系统。使用训练好的子单元的单词和句子对应的手势由预测模型进行识别。\n\n\
  手势在人机交互中起着重要作用。由于对应手势的特征向量随时间变化，因此使用了 `RNN`（Sahoo, 2018）。`leap motion controller`\
  \ 提供的特征点、指间角以及指骨之间形成的角度决定了手势。Sinha et al. (2019) 使用 `spatial fuzzy matching algorithm`（空间模糊匹配算法）生成融合手势数据，融合来自\
  \ `leap motion controller` 的空间信息以构建一个数据集。Zhang et al. (2018) 解决了分割阶段手势自遮挡这一有趣的挑战。神经网络分类器经过训练，以利用创新特征，如与掌心的距离、自协同笔画的数量、手方向、起点和终点的距离以及自协同笔画的数量，这些特征被发现对于识别手势是有效的。\n\
  \n建议的方法处理图像中光照条件的变化，并应用迁移学习以最小化训练时间。所提系统的创新之处在于提取第一个隐藏层特征。\n\n\n\n\n\n![图 2. 重新定义的\
