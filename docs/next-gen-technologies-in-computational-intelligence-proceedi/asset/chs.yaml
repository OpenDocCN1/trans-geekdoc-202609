  \ 和推荐策略的召回率均有所提高，尽管推攻击和核攻击的召回率相当低，且两者之间没有太大差异。当攻击规模缩小到 10% 时，所提方法的成功率比任何其他方法都更接近\
  \ 100%。这表明该方法产生的误报较少。\n\n## 结论\n\n为了实现这一目标，研究建立了一个结合了直接、间接和相互信任的模型，以防止选择性转发攻击。控制器评估了恶意节点，当数据包基于节点间的信任进行传输时获得了能量效率。如果其他节点停止信任某个节点，该节点被标记为恶性的风险更高，反之亦然。此外，通过打包数据并发送，所提策略不仅减少了能量消耗，还提高了可靠性。\n\
