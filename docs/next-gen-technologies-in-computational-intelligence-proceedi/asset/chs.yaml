  \ International Conference on Innovative Computing (ICIC) (pp. 1-10).\n\n# 隐写术效率改进\n\
  \nMrs. C. Jeeva, P. Nijin, S. Atchaya Kumar, and S. Mano Subash\n\n助理教授 UG Scholar，网络安全系，SRM\
  \ Valliammai Engineering College, 钦奈，印度\n\n电子邮箱：`jeeva0407@gmail.com`, `paulvijinijin5555@gmail.com`,\
  \ `atchayakumar456@gmail.com`, `smanomahi2002@gmail.com`\n\nDOI：`10.1201/9781003430452-68`\n\
  \n## 摘要\n\n隐写术是一种在另一种数据格式（如图像或音频文件）中隐藏数据而不引起疑虑的技术。这种方法用于确保数据通信中的隐私性和安全性。然而，嵌入和提取过程可能是计算密集型且耗时的，特别是对于大文件。因此，提高隐写术的效率已成为一个关键领域。本文回顾了隐写术的最新进展，并提出了增强隐写术效率的新颖技术。所提技术包括结合空间域和频域的混合方法、嵌入过程的优化以及数据提取的高算法。测试结果表明，建议的改进措施可以显著提高隐写术的有效性，同时保护隐藏数据的隐私。\n\
  \n# 引言\n\n隐写术是以一种难以检测其存在的方式模糊数据的方法，例如在图像、音频文件或视频文件中。虽然这种技术已使用了几个世纪，但在数字通信中变得越来越流行。隐写术的效率是指在保持载体数据质量和完整性的同时，隐藏大量数据的能力。为了实现这一目标，利用了先进技术，例如高容量嵌入技术如\
  \ `LSB` 嵌入、PVD 和自适应数据隐藏。此外，使用纠错码来确保即使在传输或检索过程中发生错误，隐藏信息也能被准确检索。这些技术的使用减少了嵌入所需的冗余数据量，提高了隐写术的效率。还采用了结合了多种隐写术方法的混合技术来提高效率。总体而言，研究人员继续开发可以在载体数据中隐藏大量信息的同时保持其质量和完整性的技术，使其成为一个持续研究的领域。\n\
  \n## 文献综述\n\n1. **Niu & Zhang (2022)** 提出了一种基于混合边缘检测器的图像隐写系统。隐写术既是一门艺术也是一门科学，经常用于信息隐藏、水印和版权保护等应用。为了提高隐写过程的准确性和鲁棒性，建议的系统整合了\
  \ `Canny` 和 `Sobel` 两种边缘检测算法。该方法通过将隐私信息封装在载体图像的位边缘内，提高了隐藏数据的安全性。所提系统对各种类型的图像进行了测试，结果证明了其在嵌入容量、图像质量和抗攻击方面的有效性。在各种应用中，该研究为安全通信和数据安全提供了实行的选择。\n\
  \n2. **Sultana & Kamal (2021)** 提出了一种新型基于纹理的照片隐写方法。该方法利用人类视觉系统对纹理变化的敏感性在图像中隐藏关键信息。该方法通过将图片分为较小的块并分析局部纹理属性来选择嵌入数据的最佳位置。嵌入过程旨在保留原始图像的纹理特征，确保隐写图像在视觉上与原始图像不可区分。根据实验数据，建议的方法在保持卓越视觉质量的同时，实现了很高的嵌入容量和对典型隐写分析技术的鲁棒性。总体而言，所提方法为通过图像进行机密且隐蔽的机密通信提供了一种具前景的方法。\n\
  \n3. 为了我们提供安全通信，**Negi & Negi (2021)** 建议隐写术是一种在非秘密数据内部隐藏秘密信息的技术。在这项研究中，我们提出了一种结合了隐写最低位（LSB）替换和高级加密标准（AES）的独特图像隐写方法。建议的解决方案还采用了\
  \ LSB 替换和 AES 加密技术来确保消息的安全性和完整性。秘密消息隐藏在载体图像的最低位。我们的研究结果表明，建议的方法在保持高嵌入容量和隐写图像感知质量的同时，对不同攻击具有鲁棒性。通过使用\
  \ `AES` 对消息进行加密，建议的方法还保证了通信的秘密性和完整性。\n\n4. **Sravani & Raniith (2021)** 建议将秘密信息隐藏在数字照片中，作为图像隐写这一流行方法的一部分，用于隐私数据的传输。由于这种方法提供了信息共享的隐藏路径，因此具有高水平的安全性。通过这种方法，通过肉眼不可见的方式将敏感信息隐藏在原始图像内部进行修改。由于修改后的图像看起来与原始图像完全一样，未经授权的用户可能识别任何隐藏数据。本文探讨了图像隐写的概念的应用以及嵌入和移除隐藏信息的方法。文章还探讨了图像隐写术的优缺点。\n\
  \n\n\n\n\n### 5. Dumre & Dave (2021) 研究了 RGB 图像在最低有效位（`LSB`）隐写中的潜在应用。`LSB` 方法涉及改变图像像素的最低有效位以隐藏秘密信息。该研究的目标是确定多个变量（包括隐藏数据的大小、图像质量和更改的比特数）如何影响隐写技术的成功率。该研究采用了实验方法，利用多组不同大小和不同压缩水平的\
  \ RGB 图像来嵌入隐藏数据。数据提取过程涉及使用多种隐写分析技术，如视觉检查、直方图分析和像素值分析。为了确定有效隐写的理想条件，研究人员对实验数据进行了分析。\n\
  \n### 6. 本文详细阐述了隐写术是将隐私信息隐藏在无害载体介质（如图像或视频）中的艺术与科学。为了在保持数字照片审美价值的同时保护通信免受窥探，该项目旨在开发一种隐写系统。秘密信息将首先使用所提议的方法进行加密，然后嵌入到载体图中。系统将使用一个只有发送者和预期接收者才知道的密钥，以确保嵌入信息的安全性。系统还将整合健壮的纠错码，以增强信息传输的可靠性和准确性。通过结合定量和定性参数（如审美吸引力、信息隐藏能力和抗攻击性），对建议的隐写系统进行评估。评估结果将用于验证所设计系统的效能，并确定需要额外开发的领域。\n\
  \n### 7. 所提方法首先使用 `AES`（一种广泛使用的对称密钥加密算法）对秘密信息进行加密。然后，通过随机比特技术，修改少数所选图像像素的最低有效位来反映加密信息的比特，从而将加密信息添加到图像中。由于使用了随机比特，攻击者将很难判断其中是否存在秘密信息。为了评估所提策略的有效性，我们使用广泛使用的照片数据集开展了多种实验，并将结果与最先进方法获得的结果进行了比较。实验结果表明，所提方法对于压缩、隐写和图像处理等各种类型的攻击提供了高水平的安全性和健壮性。所提方法为在数字照片中有效且安全地隐藏信息提供了一种潜在解决方案，并可以应用于军事、间谍和通信等多种场景。\n\
  \n### 8. 本文提出，隐写术是将秘密信息隐藏在无害载体中的技术。在这项研究中，我们提供了一种用于覆盖图共享隐藏的隐写技术。我们的方法涉及将图像分成多个份额，并使用改进的基于\
  \ `LSB` 的隐写算法将每个份额嵌入到独立的载体图中。然后，可以将这些份额分发给不同的参与，他们可以使用简单的 `XOR` 操作利用份额重建原始秘密图像。通过将份额嵌入到多个载体图中，我们的方法提供了针对攻击的健壮性，而使用改进的基于\
  \ `LSB` 的算法确保了隐藏信息对肉眼是不可觉。我们还使用多种性能指标对我们的方法进行了评估，结果表明它能以极小的保真度损失实现原始图像的高质量重建。总体而言，我们提出的方法提供了一种高效且安全的方法来共享秘密图像，同时保持其机密性。\n\
  \n## 方法与技术\n\n#### [1] 本研究的主要目标是在负载较小的情况下通过在边缘像素中插入隐藏信息来提高隐写图像的质量。在推荐技术的预嵌入步骤，覆盖图上应用了许多边缘检测器，以创建一个能够区分边缘和非边缘像素的边缘图像。秘密信息被转换为二进制，使用由混沌过程生成的密钥进行加密，然后在边缘和非边缘像素中添加一定数量的比特。在整个提取过程中，`LSBs`\
  \ 会清除所有的像素值，并采用边缘检测技术来区分隐写图中的边缘和非边缘像素。可以通过相同的混沌程序对可恢复比特进行解密来获取原始信息。当秘密较短或嵌入系统能够处理短信息时，该技术最有效，例如插入借卡或在国家身份证上隐藏个人信息时。通过使用混沌加密方法并在边缘像素中嵌入比非边缘像素更多的比特，既满足了对高负载的需求，又增加了秘密比特在覆盖图上的分散性。\n\
  \n#### [2] 影响编码图像质量的最重要因素是信息的嵌入位置。在覆盖图的纹理分析中使用了灰度共生矩阵来确定图像复杂性并获取纹理属性。建议使用具有更大感受野并能学习更多特征的增强编码器结构。第五层包含一个注意力模块，用于检查各种特征通道的值及其相互作用。64\
  \ 个子块构成了纹理分析的图像隐写过程。然后根据图像子块复杂性的四分位差选择用于嵌入信息的覆盖图。所提供的隐写技术相同，并使用改进的 `StegaStamp`\
  \ 生成被编码的图像。当根据单个图像子块复杂性的四分位差评估图像纹理复杂性时，该方法已通过测试，结果表明它们与视觉区分兼容。\n\n\n\n\n所提出的方法是\
  \ Our Steg，一个 Android 应用，它利用 `AES` 和 `LSB` 算法对照片中的信息进行加密和解码。该程序使用 `Android Studio`\
  \ 开发，具有基于 `Java` 的后端和基于 `XML` 的前端。用户可以根据意愿向照片中添加或移除加密。在点击“加密”按钮之前，他们可以选择要加密的图像，或者输入密钥和消息。之后，可以保存图像。用户必须选择隐影，并在加密和解密中使用相同的加密密钥。该应用程序使用了\
  \ `AES-128`，这是一种对称密钥方法，它使用相同大小的密钥对 128 位长度的数据块进行加密和解码。它比 `RSA` 和 `Blowfish` 等其他算法更高效，速度更快。一个\
  \ `AES` 轮由四个操作组成：`SubBytes`、`ShiftRow`、`Mix Columns` 和 `AddRoundKey`。该技术还利用 `LSB`（最低有效位）方法将加密信息整合到图像中。编码解码是系统的两个主要部分，而嵌入和消息加密是它们的辅助组件。使用提供的密钥创建一个秘密密钥，并在加密模式下初始化一个\
  \ `AES` 创建的密文实例。使用 `LSB` 操作应用于幅图，将消息转换为二进制，计算每个像素的 `LSB`，然后将隐影作为嵌入过程的一部分写入。\n\n\
  在本文中介绍了一种隐形术方法，该方法使用最低有效位 (`LSB`) 加密和波波修改在发送者和接收者之间加密数据。幅图被转换为灰度图像，隐藏消息转换为定时事件。在加密之前，错误的扫描会改变像素值。然后使用\
  \ `LSB` 加密的两个位来掩盖包含在幅图中的隐藏消息。执行隐形术的过程如流程图所示，包括加密、比较加密图像和原始幅图、发送图像、在仍处于加密状态时提取秘密行、比较输入和提取的秘密行、绘制直方图，以及计算峰值噪声比（`PSNR`）和均方误差（`MSE`）值。通过对比加密和未加密照片的直方图，演示了隐藏图像的解密。如果直方图匹配，则可以在无任何错误或噪声的情况下恢复解密图像。如果存在传输噪声，直方图显示了解密图像与加密图像相比像素的色散情况，这会导致解密图像中某些像素丢失。总之，本研究提出的方法了一种在幅图中隐藏通信内容的可靠且安全的方法，而小波变换和\
  \ `LSB` 加密的应用进一步提高了通信的安全性。\n\n`LSB` 隐形术是一种在图像中隐藏敏感信息的常用方法。它涉及将数据嵌入幅图像素的最低有效位。由于在创建隐影期间仅更改了最低有效位，图像的失真在肉眼看来是不可见的。`RGB`\
