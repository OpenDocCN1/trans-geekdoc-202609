  \ 05, 233–239。\n\n# 使用机器学习预测 Bitcoin-Heist 勒索软件攻击\n\nS. Ishwarya,^(⁵)\n\nDOI: [10.1201/9781003430452-6](https://dx.doi.org/10.1201/9781003430452-6)\n\
  \n## 摘要\n\n加密货币经常用于各种虚拟交易以确保交易安全。过去几年，在线诈骗增加，随着加密货币的出现及其伪装，对于诈骗者来说变得以前所未有的简单。加密货币是一种数字货币，可以在互联网上与虚拟商品和服务交换。尽管加密货币包含旨在保护或维护其安全性的复杂加密代码，但有能力的黑客仍然可以破解它们。近年来，勒索软件攻击已成为恶意软件入侵的一种重要方法，通常，勒索软件攻击通过网站发生，例如点击链接导致文件损坏。但这是比特币交易过程中主要的诈骗手段。因此，我们需要利用合适的机器学习算法和公开可访问的数据集来改进勒索软件预测方法。本研究通过使用多种特征来预测恶意交易，并使用异常的比特币交易来评估这些策略。\n\
  \n关键词：加密货币、勒索软件、比特币、机器学习、交易\n\n# 引言\n\n在全球范围内，加密货币彻底改变了数字交易。在中本聪（Satoshi Nakamoto）创建第一个比特币区块十多多年后，许多数字货币相继问世。中本聪在\
  \ 2008 年将比特币作为一种加密货币引入。比特币是一种加密货币。通过使用开放供应代码，比特币在 2009 年通过数字银行系统发生了变革。比特币是一种广泛使用的去中心化支付系统，而公共账本是完全分布的。区块链是一种用于跟踪比特币交易的分布式账本更新程序。它由某些未知个人创建。\n\
  \n比特币是一种利用点对网络在没有银行或中央机构的情况下传输价值的数字资产。由于没有实体比特币流通。一组实现的区块被称为区块链。比特币交易是完全数字化的且是匿名的。截至\
  \ 2020 年 10 月，全球有 7378 种加密货币，总市值超过 3597 亿美元。总额的 58%由比特币持有。一个实时区块链监控网站 Blockchain.info\
  \ 显示，已创建超过 650000 个区块，价值约为 210 亿美元。现在，平均每天有一笔交易添加到比特币区块链中。\n\n正如此，一些网络犯罪分子开始在安全环境中利用勒索软件单进行非法活动。一种被称为勒索软件的恶意程序攻击支付网关并索要金。为了检测勒索软件比特币地址，已经提出了多种机器学习算法。然而，测试结果必须在新的比特币地址上进行验证，因为它们缺乏足够的通用性来分类属于不同恶意软件家族的比特币地址。\n\
  \n## 相关工作\n\n\n\n\n\n# 机器学习与 NLP 勒索软件检测\n\n机器学习算法和自然语言处理（NLP）通常被用于不同领域和目的的写作；它们需要改进以成为比特币勒索软件领域问题分类的组件。如\
  \ `Random Forest`、`K-Nearest Neighbour`、`BeroulliNavieBayes`、`Artificial Neural\
  \ Network`、`long short-term memory`、`BI-LSTM` & `OoW` 等技术，在考虑 23 种特定的攻击前规避 API 调用的情况下，针对\
  \ 5 个主要家族的 3000 条勒索软件记录实现了 94.92%的准确率（Ricardo 等., 2021）。\n\n在如今的计算世界上，勒索软件已成为必须立即停止的严重威胁。数字电站和智能电网运行也受到勒索软件攻击的干扰。本文研究了一种基于人工智能的勒索软件检测策略，并提出旨在破坏数字电站运行的勒索软件攻击建模技术，该卷积神经网络模型的准确率为\
  \ 96.22% (Alvee et al., 2021)）。\n\n## 勒索软件的演变与加密货币\n\n每种勒索软件的实现和方法各异，从它们如何传播、利用漏洞以及如何从性能、加密技术和反病毒软件面前隐藏其行为开始。勒索软件服务（如\
  \ `Conti` 勒索软件）自 2022 年 2 月 27 日以来通过静态和动态分析变得日益复杂 (Alzahrani et al., 2022)。\n\n\
  由于其简单性，数字货币或加密货币经常被用于各种虚拟交易。可以在互联网上支付的虚拟货币被称为加密货币。`Litecoin`、`Ethereum`、`Monero`、`Ripple`\
  \ 和 `Bitcoin` 是最常见的加密货币。\n\nRware 检测模型通过使用 5000 个样本的反向传播神经网络构建，准确率为 97% (Cahyani\
  \ et al., 2021)。最常见的恶意软件类型——加密勒索软件，已影响了多个行业，并要求通过静态和动态分析索要巨额赎金。\n\n许多基于人工智能的勒索软件研究往往缺乏行为分析，以及与`AIRaD`（基于人工智能的勒索软件检测）的\
  \ NLP 和机器学习分类器的关联映射 (Poudyal and Dasgupta, 2021)。\n\n## 检测策略与技术挑战\n\n名为加密勒索软件的恶意软件利用系统的加密能力来加密用户数据。当用户文件被加密勒索软件攻击加密且没有解密密钥时，访问将变得困难。由于创建勒索软件工具包（如勒索软件服务\
  \ `RaaS`）的普及，勒索软件变体不断。这是因为应对加密勒索软件，必须在加密之前通过自适应预加密模型进行检测 (Urooj et al., 2021)）。\n\
  \n`Bitcoin` 作为价值存储的替代手段日益流行。它在市值上超过了市场上所有其他加密货币。然而，由于其巨大的价值，网络犯罪分子发现它是一个理想目标。在对\
  \ 36 起比特币交易所安全事件进行彻底评估后，开发了一种用于报告利用比特币交易所平台的网络安全泄露信息的行业标准。为了识别泄露后的对抗策略，研究人员检查了两个\
  \ `BTC` 洗钱案例 (Oosthoek and Doerr, 2020)。\n\n允许伪匿名交易的加密货币增加了各种形式电子犯罪的数量，特别是是在通过加密敏感用户数据的勒索攻击攻击中使用加密货币支付。用户使用\
  \ `Bitcoin` 并结合拓扑数据分析作为勒索软件来源，以识别没有交易记录的新勒索软件家族。未来将提出一种将不同位置的实体映射到 IP 地址的拓扑和几何方法\
  \ (Akcora et al., 2019)。\n\n## 机器学习方法途径\n\n大型企业和医疗提供者经常面临勒索软件攻击。勒索软件旨在通过威胁删除数据向受害者索钱。通常，勒索软件分三个步骤：利用受害者的网络流量识别漏洞。它主要关注使用机器学习\
  \ (`ML`) 技术和沙箱分析的基于 API 的勒索软件检测方法。未来用于保护勒索软件家族的多层安全解决方案 (Almousa et al., 2021)。\n\
  \n由于比特币具有巨大的经济价值，发生了多次比特币盗窃。由于黑客使用比特币钱包密钥盗取被黑用户的比特币转移，受害者遭受了巨大的财务损失。监督机器学习如 `KNN`、`SVM`、`RF`、`Ada-Boost`\
  \ 和 `MLP` 以及无监督学习如 `LOF`、`OCSVM`、`MDB`。其中监督学习的表现优于无监督学习，`RF` 中的 `Fl-score` 达到 95.2%。未来将通过机器学习算法使用更有针对性的特征来改进结果\
  \ (Chen et al., 2021)。\n\n`Bitcoin` 加密货币允许用户通过其 `Bitcoin` 地址在环境中安全地交易，并在深度神经网络帮助下预测系统感染了何种类型的欺诈和恶意软件，这对于时间序列数据和多分类效果良好。模型使用\
  \ `LR`、`KNN`、`SVM`、`Decision trees`、`RF` 和 `Adaboost` 进行训练，准确率最高 74%，能够准确预测黑白标签\
  \ (Baraaabusallout and Ashour, 2021)。\n\n## 区块链与未来工作\n\n区块链是加密货币（如 `Bitcoin`、`ZCash`、`Monero`、`Ethereum`、`Ripple`\
  \ 和 `IOTA`）即将采用的技术。将区块链分为公共或私有以及货币或平台。`Bitcoin` 公开存储数据，用户可以挖掘区块。交易类型基于账户和 `UTXO`\
  \ (Akcora et al., 2022)。\n\n近期最大的恶意软件来源之一是勒索软件，它影响 `IOT` 系统的计算。为了预测异构 `IOT` 系统的勒索软件，使用了上下文感知勒索软件预测技术来提取特征，使用预定义数据集大幅减少了\
  \ 60%的时间。其预测主要关注攻击路径、向量和结果事件 (Mathane and Lakshmi, 2021)。\n\n加密货币经常用于勒索交易。目前大多数勒索软件使用\
  \ `Bitcoin` 分期付款。`Bitcoin` 交易无限记录并供公众访问。基于 `bitcoin` 地址和数据分析，借助机器学习和可用数据集来检测恶意勒索软件家族。未来工作将分析勒索攻击进入系统的早期预测\
  \ (Sabirakarim, 2021)。\n\n各种关键基础设施和企业正被勒索软件攻击劫持，并要求赎金以释放加密文件。需要使用各种机器学习技术识别这些交易并将其标记为黑和白，以训练并跟踪数据集中的恶意项，以便提取分类分类\
  \ (Joe, 2021)。\n\n\n\n\n\n大多数投资者将其数字资产保留在加密货币账户中，因为组织化的交易所处理了几乎所有的加密货币交易（99%）*。这使得你面临交易所关闭的风险。通过机器学习技术，该研究检查了\
  \ 238 个比特币交易所的八项主要标准以及四种模型——决策树、随机森林、逻辑回归和支持向量机与随机森林分类器，准确率达到 90.4%。研究同时考虑了样本内和样本外情况（Milunovich,\
  \ 2022）。比特币加密货币开发于 2008 年，作为一种分布式交易系统，现在全球范围内广泛。它们利用点对点网络，在 `SNN` 和 `ODT` 等两种监督学习方法的帮助下，由每个节点在交易期间进行验证。已预测有效的结果（Al-Haija,\
  \ 2021）。作为价值存储的替代手段，比特币正变得流行。它在市值方面超过了市场上的所有其他加密货币。然而，其巨大的价值也使其成为网络犯罪分子青睐的目标。他们已对\
  \ 32 起安全泄露进行了广泛分析（Oosthoek and Doerr, 2020）。检查是否可能开发出能够利用各种已知策略来绕过反恶意软件防御的勒索软件模拟。将强化学习引入反勒索软件测试中，可能有助于在攻击发生之前识别并解决安全漏洞（Adamov\
  \ and Carlsson, 2020）。比特币作为一种去中心化的数字货币，被认为可以通过区块链技术实现。它主要用于物联网应用、医疗保健领域和各个政府部门。对不同钱包在安全性、权衡和及方面进行了比较。比特币交易过程中的隐私和安全问题已得到分析（Zaghloul,\
  \ et al., 2020）。\n\n## 方法论\n\n近年来，使用勒索软件的攻击已成为病毒渗透的重要来源。到目前为止，使用勒索软件的仅针对资源充足的通用计算系统。尽管已经提了许多勒索软件预测方法，但机器学习技术仍然需要更有效的勒索软件预测技术。本文介绍了一种预测勒索软件攻击的方法，利用人工智能和机器学习在算法中提取信息特征，以预见勒索软件攻击。机器学习程序的应用被用于创建一个更准确的模型来预测结果。创建成功模型的首要步骤是识别变量和解释数据。在将各种机器学习算法应用于预处理后的数据后，会评估它们的准确性以确定哪种方法更好；为了评估模型，还考虑了\
  \ `recall`（召回率）、`precision`（精确率）和 `fl-score` 等额外的性能指标。使用机器学习算法预测勒索软件攻击的结果。\n\n最具破坏性的网络危险之一是勒索软件，它除了导致巨大的损失外，还会影响生产力、可用性和声誉。尽管最终目标是加密/锁定，但勒索软件经常通过运行一系列攻击前的\
  \ API 请求（或“偏执”活动）来选择合适的执行环境，以规避检测。在本文中，我们提出了一种突破性的尝试，利用这种偏执行为来识别特定的勒索软件行为。为了实现这一点，我们使用了来自近期/著名勒索软件家族的\
  \ 3000 多个样本，以识别它们独特的、诱发偏执的行为。在该研究中，我们提供了一种动态分析方法，根据勒索软件样本在攻击前的偏执行为对其进行识别。为了收集来自五个知名家族的\
  \ 3000 多个勒索软件样本的行为特征/特性信息，我们在沙箱环境中执行它们，同时执行了 23 次与检测执行环境相关的攻击前规避 API 调用。\n\n所提出的系统旨在创建一个能够预测勒索软件攻击类型的模型。该过程从识别变量开始，例如位于目标列的因变量和自变量。然后使用预处理方法处理包含空值的数据。利用预处理后的数据通过将数据集按\
  \ `7:3` 的比例划分来创建模型，其中 70% 的数据用于训练以帮助模型理解模式，其余 30% 用于测试以评估我们项目的性能。分类模型可用于预测比特币劫持勒索软件的攻击类型。\n\
