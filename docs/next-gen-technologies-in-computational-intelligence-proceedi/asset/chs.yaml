  \ `k = 9` 个锚点，这与 Faster R-CNN 相同。即使在使用 `k = 9` 个锚点的情况下情况也是如此。\n\n## 损失函数\n\n每个锚点被分配一个目标（也称为正标签）或非目标，取决于它们收到的某种分配类型（也称为中性标签）。Fast\
  \ R-CNN 网络中使用的多任务损失策略被整合到 Faster R-CNN 网络的架构中。\n\n(11)\n\n$$anchor_{i} = \\left\\\
  { \\begin{matrix} {+ ve} & {p_{i}^{\\ast} = 1} \\\\ {- ve} & {p_{i}^{\\ast} = 0}\
  \ \\\\ \\end{matrix} \\right.$$$$$\n\n预测的矩形框的四个参数化坐标由向量 `ti={tx,ty,tw,th}` 表示。该向量用于表示四个坐标。具有正标签的锚点的矩形坐标由向量\
  \ `t[i]^*={tx`, `ty`, `tw`, `th}` 表示。该方程用于描述矩形。\n\n分类损失函数由方程 12 中的符号 `Lcls` 表示，其定义如下。\n\
  \n(12)\n\n`Lcls = -log [ p[i]p[i]*+(1-p[i])(1-p[i]*) ]`\n\n回归损失函数由以下表达式表示：\n\n(13)\n\
  \n`Lreg = R(t[i] - t[i]*)`\n\n`R` 函数在 L1 函数中有一个完全等效的形式：\n\n(14)\n\n$$\\text{smoothL}1(x)\
  \ = \\left\\{ \\begin{matrix} {0.5x^{2}} & \\left. if \\middle| x \\middle| < 1\
  \ \\right. \\\\ \\left| x \\middle| - 0.5 & {otherwise} \\\\ \\end{matrix} \\right.$$\n\
  \n如果（且仅当）`x` 为 1，则 `smoothL1(x)` 等于 `x` 原始值的 2 倍。矩形框层在分类和回归方面的结果分别由符号 `{p[i]}` 和\
  \ `{t[i]}` 表示。在训练时，它们通过 `N[cls]`、`N[reg]` 和 `λ` 进行标准化，损失函数 `L({p[i]}, {t[i]})` 是我们关注的关键，我们尽可能朝着降低\
  \ `L` 的方向对 `({p[i]}, {t[i]})` 进行优化。\n\n## 收敛特征共享\n\n得益于 Faster R-CNN 系统最近开发的一种技术，RPN\
  \ 网络和 Fast-CNN 网络可以联合训练，而不是分开放训练。在两种不同策略之间来切换的灵活性是驱动这种方法的引擎。\n\n1. 步骤 1：在第一阶段使用预训练模型为网络创建初始值，然后对\
  \ RPN 网络进行微调。\n2. 步骤 2：在第二阶段，使用初始化的 RPN 网络提取用于训练 Fast-CNN 网络的建议区域。RPN 网络在此阶段被利用。\n\
  3. 步骤 3：利用步骤 2 中构建的 Fast-CNN `W` 重新初始化 RPN，主要目标是优化 RPN 层。\n4. 步骤 4：修改卷积层的设置。\n5.\
  \ 步骤 5：第五阶段也是最后一个阶段，由将 RPN 提取的区域建议应用于 Fast-CNN，以进行任何必要的改进。\n\n## 非极大值抑制\n\n利用被称为交并比（`IoU`）的比例可以衡量两个矩形框的重叠程度。该比例可以在下面的方程\
  \ (18) 中找到：\n\n`IoU(A, B) = (A∩B)/(A∪B)`\n\n非极大值抑制（`NMS`）技术在定位最高可能值后，通过预定的操作程序隐藏所有值。在目标检测过程中，利用\
  \ `NMS` 来消除不必要的窗口。\n\n研究从不同的农田收集了图像，总共收集了 500 张图像。400 张图像用于训练，其余图像用于测试。系统配置了 16GB\
  \ 内存，运行在第 10 代 Intel i5 处理器上。\n\n将提出的方法与传统的检测方法，如卷积神经网络（`CNN`）、`AlexNet` 模型和 `DenseNet`\
  \ 模型进行了比较。\n\n提出的 `RCNN` 与 `CNN`、`AlexNet` 和 `DenseNet` 等当前技术在准确性、敏感性和 f 数方面的对比见\
  \ [图 3]、[4]、[5] 和 [6]。f 数的结果表明，所提的 `RCNN` 提供了比 `CNN`、`AlexNet` 和 `DenseNet` 等技术更好的结果。\n\
