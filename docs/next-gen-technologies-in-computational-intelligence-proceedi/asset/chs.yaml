  \ Guo, Amira S. Ashour, and Florentin Smarache (2018). 一种在皮肤镜图像中使用中性逻辑聚类和自适应区域增长的新型皮肤变检测方法。MDPI,\
  \ Symmetry 2018,10,119, doi:10.3390/sym.119。\n\n\n\n\n近期，软件定义网络（SDN）为无线传感器网络（WSNs）带来了集中化的网络管理和控制。这种使用\
  \ SDN 的灵活管理和控制为能量和安全提供了两个主要的解决方案，这两个这些一直是关键问题。基于这一动机，本研究开发了一种集成传感器节点间直接、间接和互信信任的模型，以缓解新流攻击和选择性转发攻击在内的转发攻击。三种信任值均作为分布式输入发送到信任管理进化控制器，该控制器在节点级对攻击进行评估。信任水平的下降会导致丢弃该节点并将其标记为恶意，反之亦然。此外，计算需求通过高效的方式处理，通过对数据包进行聚合和转发来避免能量消耗。仿真结果表明，所提方法比其他现有方法具有更高的能量利用效率和信任水平。\n\
  \n**关键词：** 无线传感器网络，软件定义网络，信任值，转发攻击\n\n# 引言\n\n随着传感器能力的提高，电池供电的无线传感器网络（WSNs）已进入许多不同类型的工业环境（Liu\
  \ et al., 2022; Gite et al., 2021）。交通监控只是其中一个例子；其他用途包括物联网（IoT）、智能工业和公共安全网络。除了在环境监测、车联网（V2V）通信和医疗保健等领域外，无线传感器网络（WSNs）还有许多实际用途（Singh\
  \ et al., 2022; Yadav and Kumar 2022）。\n\nWSN 中的节点（或传感器）通过无线电波相互通信，但在其他方面是自主的。网络由一个中央基站（BS）保护。这些节点通过监控几个物理参数的状态与相互及其环境交换信息。基站的责任是从各种来源收集数据、进行处理并交付给用户，以便用户能够做出明智的决策（Maheswari\
  \ and Karthika, 2021）。WSN 节点完全依赖其内部不可替换的电池。此外，传感器节点的存储、内存和 CPU 处理能力受到限制（Singh and\
  \ Khare, 2021）。当数据包从传感器节点传输到基站时，无线电波发挥了作用。直接将信息发送到基站比分阶段通过短距离发送需要更多功率。大多数研究集中在聚类上，其中簇的所有成员与簇中心协调节点（CH）直接接触。之后，CH\
  \ 将其合并的压缩数据发送到基站或最近的 CH（Kaur and Rattan, 2021）。\n\n数据压缩、消除不必要的数据以及跨多个跳数的数据传输都是通过聚类实现的。聚类的有效结果取决于采用方法的准确性以及所用参数的可行性（注：此处原文为\
  \ Clustering useful outcomes，应为 Clustering' useful outcomes）。与由单个传感器节点利用特定位置数据执行的分布式聚类算法相比，集中式聚类算法是由基站执行的（Jin\
  \ 2021）。其目标是找到最好的聚类解决方案，因此执行了这一操作。\n\n由于各种问题，维护一个安全网络可能是困难的。可靠的数据收集是每项研究的重要组成部分。在许多环境中（包括军事领域），建立和维护信任至关重要。几种用于\
  \ WSN 选择 CH 的算法没有考虑安全性。几乎所有现代安全感知协议都依赖于加密技术，但在面对巨大挑战时，这是不够的。加密的使用增加了网络复杂性，产生了不必要的额外负担并减慢了速度。因此，考虑一种简单且占用可用资源的\
  \ WSN 安全方法是非常重要的（Singh et al., 2022）。\n\n在目前的工作中，我们使用 `Cuckoo Search`（布谷搜索）算法来制定\
  \ CH 的选择。该算法采用了种群划分和后续迭代的思想。基于柯西的探索操作是该算法的一个很好的补充，因为它们支持 `CS` 自然探索集。在这里，我们提出了一种新的聚类方法，它结合了布谷搜索（`CS`）（Cuong-Le\
  \ et al., 2021）用于选择 CH 的算法和信任估计。布谷搜索算法是这一过程的名称。`CS` 算法从首次提出起就被认为是优化研究领域的一种可行方案。为了证明其价值并更接近标准基准的位置，`CS`\
  \ 算法经过了大量的修改。\n\n基于这一动机，本研究开发了一种集成传感器节点间直接、间接和互信信任的模型，以缓解新流攻击和选择性转发攻击在内的转发攻击。三种信任值均作为分布式输入发送到信任管理进化控制器，该控制器在节点级对攻击进行评估。信任水平的下降会导致丢弃该节点并将其标记为恶意，反之亦然。\n\
  \n## 相关工作\n\n为了延长无线传感器网络（WSNs）的寿命，已经应用许多解决方案。这些包括移动中继、传感器节点的最定位和能量采集。`LEACH` 一直是通过路由和聚类减少网络功耗努力的前沿（Heinzelman\
  \ et al., 2000）。该协议采用基于分层聚类的路由技术。这种策略生成了多个不同的簇，每个簇都有自己的 `CH`。每组成员节点发送的数据由 `CH` 节点接收，随后其将合并的数据转发到基站（BS）。\n\
  \n除了最常见的单跳协议外，还有基于分层聚类的协议涉及多个跳数。数据可以使用 `PEGASIS` 网络向任何一个方向移动，该网络通过连接传感器节点链形成（Lindsey\
  \ and Raghavendra, 2002）。`HEED` 根据其与网络中其他节点的距离以及决策时的可用能量总量来选择 `CH` 节点（Younis and\
  \ Fahmy, 2004）。在节能不均匀聚类（`EEUC`）协议中，使用多跳路由在簇之间传输数据，该协议将传感器网络划分为不同大小的簇。该协议的目的是从能量角度减少靠近基站的\
  \ CH 节点的负载（Li et al., 2005）。\n\n\n\n\n\n研究人员已经开发了许多 `LEACH` 协议的变体，其目标是一致的：减少网络的能量消耗。在\
  \ `LEACH-C` (Heinzelman et al., 2002) 中，由一个协调员运行并确保每个簇都正确组。该中心协调员收集必要的网络数据并将其作为服务提供给优化后的簇。例如，在\
  \ `LEACH-CE` (Tripathi et al, 2013) 中，增强了 `CH` 选择。`CH` 节点通常是剩余能量最多的簇节点。正如此，网络可以处理所有节点的合并能量消耗。`LEACH-CKM`\
  \ (Mechta et al, 2014) 使用 `K-means`（或 `K-medians`）聚类算法来提高聚类过程的效率。如果你使用高效能的智能建筑技术，你的网络寿命将长得多。\n\
  \n根据数据收集方法，传感器网络可以分为两类：主动型和响应型，如 Manjeshwar and Agrawal (2001 所述。在响应模式下，节点实时更新关键参数；而在主动模式下，传感器按固定间隔响应。在发生同时满足软硬阈值（`BS`）的事件之前，检测到的数据不会发送到基站。`TEEN`\
  \ 是一种响应式路由方法，有助于减少非必要的或重复发送的传输。与目前使用的标准 `WSN` 协议相比，`TEEN` 提供了显著更高的能量效率。由 Manjeshwar\
  \ et al. (2002 开发的 `TEEN` 扩展 `APTEEN` 适用于常规信息的传递和紧急情况的管理。\n\n`Enhanced-SEP` (`E-SEP`)\
  \ (Aderohunmu and Deng, 2009) 的开发是为了取代 `SEP` (Smaragdakis et al., 2004) 的两层结构，采用新的、更高效的三层结构。在\
  \ `E-SEP` 中，传感器被分为高层和标准层，高层拥有的能量远比标准层多。\n\n对于 Kang and Nguyen (2012) 来说，`LEACH`\
  \ 距离阈值是他们的目标。`LEACH-DT` 算法在计算选择概率时考虑 `CH` 到 `BS` 的距离。这些距离被视为变量。`BS` 计算每对节点之间的距离以及网络的概率函数。然后，`BS`\
  \ 将此数据发送到网络中的每个节点。在没有管理机构的情况下，传感器仍利用以下数据来选择采用哪个 `CH`。`LEACH-DT` 还推荐了多跳路由，根据节点与 `BS`\
  \ 的距离将其分为若干小组。由于信息是从较远的节点移动到距离源较近的节点，多跳传输可以大幅降低数据传输功率。\n\n由于使用了加权指标，`Cluster Chain-Weighted\
  \ Metrics`（簇链加权指标 CCWM） (Mahajan et al., 2014) 能够在提高网络性能的同时减少能量消耗。根据这些标准选择了一组 `CHs`\
  \ 进行进一步研究。在特设通信的帮助下，信息可以从单个成员节点发送到负责这些节点的 `CHs`。选定的 `CHs` 将用于构建允许簇间通信的路由链。链中直到 `BS`\
  \ 的每个 `CH` 都将作为中继，将数据传递给链中的下一个 `CH`。由于初始 `CH` 选举的效率低下，重新选择 `CH` 会产生额外的网络开销。此外，簇内通信会导致能量使用不均。\n\
  \n`SEECH` 协议最早由 Tarhani et al. (2014) 开发，用于循环数据传输场景。在该系统中，个人负责选择自己的 `CHs` 和中继节点，该系统采用去中心化过程\
  \ (Tarhani et al., 2014)。为了减轻 `CH` 电池的负载，采用多种类型的中继节点至关重要。在大型 `WSNs` 的实用性测试中，`SEECH`\
  \ 协议表现优。\n\n为了延长网络寿命，Mittal 等人提出了两种响应式聚类技术：`DRESEP` (Mittal and Singh., 2015) 和\
  \ `SEECP` (Mittal et al., 2017)，它们分别基于周期和确定基础选择 `CHs`。`DRESEP` 和 `SEECP` 均以这些过程命名。\n\
  \n## 提出的方法\n\n具有独特特征的攻击可影响系统对目标项目的拟定选择。识别攻击模型需要对攻击者的技能和动机做出某些假设。研究计划要求使用三种不同的攻击类型验证假设：分段攻击、随机攻击和平均攻击。攻击特征中使用的评分方法分为三个部分：目标项目、被选项目和攻击项目。\n\
  \n一种攻击特征的生理结构如图图 1a 所示。对于每个攻击特征，一个或多个项目可以赋予可能的最高评分或最低评分。其他形式攻击中的被选参与者 `I[s]`，`I[s]`。\n\
  \n```\n![Fig 1a. Attack Profile](img/fig3_1a.jpg)\n```\n\n`BS` 信誉系统将决定攻击项目的有效性。在大多数情况下，攻击者的复杂程度会随着深度的增加而增大。图\
  \ 1b。\n\n```\n![Fig 1b. Block Representation](img/fig3_1b.jpg)\n```\n\n## 特征属性提取\n\
  \n为了确定哪些特征是恶性的哪些是合法的，我们首先提取它们的唯一标识符。特征属性分为两组：通用和攻击模型 (Heinzelman et al., 2002)。利用特征识别信息，可以使用通用特征来检索特征质量。这有助于调查人员区分虚假特征和恶意特征。\n\
  \n由于协作信誉系统中评分矩阵的高维和稀疏性，女巫攻击模型（shilling attack）难以实施。因此，通过监督检测从初始或攻击特征中提取属性集 `A`。由此减少了数据集的维度。在假设场景下，使用\
  \ `Eq. 1` 提取特征属性。在提出的系统中，利用了 `q`-属性提取方法。\n\n$$\n\\begin{bmatrix} p_{1,1} & p_{1,2}\
  \ & \\cdots & p_{1,n} \\\\ p_{2,1} & p_{2,2} & \\cdots & p_{2,n} \\\\ p_{3,1} &\
  \ p_{3,2} & \\cdots & p_{3,n} \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ p_{m-1,1}\
  \ & p_{m-1,2} & \\cdots & p_{m-1,n} \\\\ p_{m,1} & p_{m,2} & \\cdots & p_{m,n} \\\
  end{bmatrix} =\n\\begin{bmatrix} A_{1} & \\cdots & A_{q} \\\\ A_{1} & \\cdots &\
  \ A_{q} \\\\ A_{1} & \\cdots & A_{q} \\\\ \\vdots & \\ddots & \\vdots \\\\ A_{1}\
  \ & \\cdots & A_{q} \\\\ A_{1} & \\cdots & A_{q} \\end{bmatrix}\n$$\n\n\n\n\n\n\
  训练集包含了攻击者和受害者两种类型的代表性样本。活跃用户的配置文件由 Movie Lens 数据集的评分矩阵生成，而停用用户的配置文件由攻击模型生成。这既可能是真实的人配置文件，也可能是攻击配置文件，研究已知是哪一种。然而，在测试时，我们愿意接受任何用户配置文件为真实。\n\
  \n## 优化问题公式化\n\n使用布谷搜索实验的目的是建立一个概率模型以寻找网络中的恶意节点。在两个节点位置之间，总是存在一定范围的误差。在这里，研究重点是寻找恶意节点，以减少通过恶意节点传输的概率。\n\
  \n我们建立了一个目标函数（`Obj`），即估计节点坐标真实距离与相邻锚节点真实未知节点坐标估计距离之间的均方误差（`MSE`）。我们可以通过这种方式将估计值与最佳猜测进行比较。第\
  \ `i`^(th 节点（未知）位于 (`x, y`)，而第 `j`^(th 个锚节点在讨论中位于 (`(x.*, y.)`)。该目标可以使用公式 2 表示如下：\n\
  \n$$\\sigma\\_{u} = \\left\\{ \\frac{\\Gamma(1 + \\lambda)\\sin\\left( \\frac{\\\
  pi\\lambda}{2} \\right)}{\\Gamma\\Gamma\\frac{(1 + \\lambda)}{2}\\lambda^{\\frac{(\\\
  lambda - 1)}{2}}} \\right\\}^{\\frac{1}{\\lambda}}$$\n\n能量受限无线传感器网络（WSNs）消耗大量的计算资源。通过增加步进时间\
  \ `α`，算法可以将生成的解推向比目前更远的最优解。如果问题最终收敛到全局最优解是不可能的。找到全局最优解的速率关键取决于所选的步长。\n\n根据我们的研究，我们得出应该使用以下公式来调整步长：\n\
  \n$$\\alpha = \\alpha\\_{\\max} - \\left( \\frac{N\\_{i}}{N\\_{u}} \\right)\\left(\
  \ {\\\\alpha\\_{\\max} - \\alpha\\_{\\min}} \\right)$$\n\n其中 `M`≥3，定位需要位于三个锚节点的范围内（三边定边规则）。未知节点的位置使用对应于对象最小可能值的坐标\
  \ `(x., y)` 进行粗略估计。\n\n## 分类\n\n步长控制因子 `a` 和变异概率 `Pa` 对于 CS 算法定位最优解的性能都起着重要作用。当参数固定为\
  \ `Pa=0.25` 和 `α=0.01` 时，定位精度下降，降低了 WSN 应用的实用性，且收敛速度下降，由于迭代次数多且计算时间长，导致能量资源有限的传感器节点寿命缩短。虽然已经给出许多基于\
  \ CS 的增强方案来实现某些目标，但没有一个方案被证明对 WSN 定位特别有用。因此，本研究的目标是通过从这些因素中借鉴思想，为 WSN 节点的定位提供一种实用的\
  \ CS 方法。\n\n步长经历了最剧烈的变化之一。如果值太小，如公式 (2) 中的莱维飞行所示，搜索种群将集中在之前搜索中找到的局部最佳答案附近的狭窄带内。在开发探索整个搜索空间范围的新颖方法时，答案是一样的。最后，如果不进行大量的迭代，就无法找到全局最优解，这可能会消耗一个：\n\
  \n- `α`max - 最大步长\n- `a`min - 最小步长；\n- `N[i]` - 迭代次数和\n- `Nit` - 迭代总数。\n\n公式 3 清晰地显示，随着迭代次数的增加，步长\
  \ `α` 逐渐减。为了便于全局搜索，在迭代过程开始时将步长设置为最大。然后逐渐缩小步长以鼓励局部搜索。这种修改至关重要，因为随着重复次数的增加，种群倾向于向全局最优解收敛。\n\
  \n我们使用解的适应度来创建一个变异概率 `Pa`，它可以扩大种群的基因池并防止种群塌变为较小的子集中。变异概率 `Pa` 太高会防止及时的加速收敛，而概率 `Pa`\
  \ 太低会降低精度，并需要更多迭代才能获得良好的性能。因此，确保你指定的 `Pa` 参数值既不过高也不低。\n\n变异概率 `Pa` 被认为与目标函数的值正比，因此取决于所提方案的效率。这一假设是使用计算机科学领域的行业标准算法提出的。\n\
  \n适应度值较高的巢（即更接近当前全局最优的巢）更有可能包含在下一代种群中。另一方面，对于适应度较低、离全局最优较远的巢，变异概率 `Pa` 值将显著降低，因为这样的巢更有可能被发现并被新的随机解替换。这种方法的另一种表达方式是不同随机解的概率。\n\
  \n上述研究得出了对变异概率 `Pa` 的修正：\n\n$$Pa(j) = \\begin{cases} {Pa\\_{\\min} + \\left( {Pa\\\
  _{\\max} - Pa\\_{\\min}} \\right) \\times K} & {K < 1} \\\\ \\\\ \\frac{Pa\\_{\\\
  max}}{N\\_{i}} & {j = 1,2,..,n} \\\\ \\\\ \\end{cases}$$\n\n其中 `K=f(j)-f*[min]`，这完全取决于第\
  \ `j`^(th)解；`f(j)` - `j`^(th)解的适应度，`f_min` - 最小适应度，`P*[max]` - 最大变异概率，`P*[min]`\
  \ - 最小变异概率。\n\n研究使用公式所示的解质量来修改 `Pa`。如果 `K`≤1，第 `j`^(th)最佳解将与当前最优解几乎相同。有人认为，第 `j`^(th)解的质量\
  \ `K` 应与变异概率 `Pa` 正比。然而，如果 `K` 大于 1，第 `j`^(th)解的质量现在远离理想。由于随着迭代次数的增加，种群将向全局最优解移动，我们假设变异概率\
  \ `Pa` 会随着迭代次数的增加而在不利的方向波动。\n\n此外，种群被限制在特定区域，防止了任何探索，从而节省了能量。也就是说，我们将范围外的解进行替换。我们提出了一种改进的\
  \ CS 方法，通过考虑这些和其他因素，可以快速准确地找到全局最优解。我们最新的 CS 算法实实现在算法 1 中详细描述。\n\n| 算法 1: CS 算法 |\n\
  | --- |\n| 开始生成初始种群（解）`x[i]`, `i = 1,2, *...,n` 定义适应度 `f(x)`; `x = (x[1], x[1],\
  \ ..., x[d],)` 设置 `α` 和 `P[a]` 范围：`α[min]` `α[max]` *,`P*[max]` *,`P*[min]`。设置巢的范围：`X[min]`\
  \ 和 X[max] 设置最大迭代次数：`N[it]` 对于 `x[i]` 执行 || 估计适应度结束循环 `N[i]=1` 当 (`N[i] *< N*[it]`)\
  \ 执行 对于所有 `x[i]` 执行 计算莱维飞行以寻找步长生成新种群（`x[i]`）如果(*x[j]* > X[max]; *x[j]* < X[max])\
  \ 则 `x[j]` ← `X` 和 `x[j]` ←`X*[min]`。 || 结束如果 计算适应度 选择随机巢 如果 (*F[j]* > *F[k]*) 则\
  \ 结束如果 结束循环 保留全局适应度：`f[min]` 计算概率 `Pa` 构建新解保留最佳解结束循环 排序解结束循环 结束 结束 |\n\n\n\n\n##\
  \ 结果与讨论\n\n网络入侵检测 (NID) (intrusion-detection) 数据集用于当前调查的成本效益分析。该系统依赖于 `Matlab`，安装在具有\
  \ 16 GB 内存、Windows 7 和 Intel Core i7 处理器的 PC 上。对于每个 TCP/IP 连接，从正常和 DDoS 攻击数据中获得了\
  \ 41 个定量和定性特征（3 个定性特征和 38 个定量特征）。\n\n## 评估指标可以使用召率和假阳性等指标来评估所提系统的有效性。\n\n**召回率 (Recall)：**\
  \ 系统的召回率是被成功发现的攻击数量。\n\n$$\\{~Recall~} = \\frac{TP}{TP + FN}$$\n\n**精确率 (Precision)：**\
  \ 系统检测到的配置总数与发现的攻击配置数之比提供了信任系统准确性的洞察。\n\n$$\\{~Precision~} = \\frac{TP}{TP + FN}$$\n\
  \n**假阳性率 (False positive Rate)：** 推荐系统的假阳性率定义为与总攻击配置数相比产生的假阳性数量。\n\n$$FPR = \\frac{FP}{TP}$$\n\
  \n随机或平均是两种更常见的类型。利用不同的攻击尺寸（1%、3%、5% 和 7%）的目标是不可逆转地修改攻击配置样本。\n\n我们确保训练数据集中合法配置和欺诈配置的分布相等。实现这一目标的标准方法是构建一个包含不同强度广泛攻击尺寸的攻击配置。每种攻击可以添加\
  \ 1%、3%、5% 和 7%。在记录平均值作为最终结果之前，会执行检测技术进行约 20 次迭代。每当生成攻击配置时，都会在检测元素的生成中加入随机性。\n\n\
  图 2 显示了在攻击和攻击尺寸变化时，使用推荐检测模型的攻击模型检测率。如图 5 所示。随着攻击尺寸的增加，召回门限随之上升，这从召回率的增加可以看出。即使攻击规模保持不变，由于攻击尺寸的增大，召回值也有所上升。\n\
  \n![Fig. 2. 检测率](img/fig3_2_C.jpg)\n\n图 2\\. 检测率\n\n本小节将讨论 CS 模型在识别唱售攻击（shilling\
  \ attacks）方面的有效性。通过比较更改攻击和攻击尺寸两次测试的结果，可以对其效力进行准确评估。\n\n训练集通过从指定数据集中随机选择 200 个真实配置来构建。攻击配置是多种攻击（如分段攻击、随机攻击和平均攻击）相结合的结果。将所提检测模型应用于不同的攻击和攻击尺寸会产生不同百分的假阳性，如图\
  \ 3 所示。攻击的严重程度与记录假阳性的可能性之间存在直接关系。随着攻击范围的扩大，假阳性率的有效性将降低。在攻击尺寸保持相同的情况下，更大的攻击尺寸会导致假阳性更少。事实证明，当只有少量攻击配置可处理时，所提方法的检测具有较高的假阳性率。\n\
