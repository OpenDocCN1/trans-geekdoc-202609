  \n# 基于 CNN 和 IoT 的新型认证系统\n\nSuraj Golthi, (42)\n\n计算机科学与工程系，Hindustan 理工学院，印度钦纳\n\
  \nDOI: [10.1201/97803255](https://dx.doi.org/10.1201/97803255)\n\n## 摘要\n\n多年来，研究人员对生物识别认证在投票中的应用感兴趣。本研究提出了一种利用深度学习技术和指纹检测来实现安全认证的匿名投票系统。考虑到对匿名投票日益增长的需求，所提系统使用了深度学习技术。还集成了一种能够在投票过程中对任何欺诈行为发出警报的物联网告警系统。总之，该系统使用了深度学习技术。\n\
  \n**关键词**：匿名投票、生物识别认证、指纹识别、深度学习、卷积神经网络、物联网告警系统、安全投票、欺诈行为\n\n# 引言\n\n随着技术的发展，电子投票系统在全球选举中日益流行。电子投票系统被发现容易受到黑客和欺诈投票的影响（Pooja\
  \ & Anuja, 2022）。一种利用卷积神经网络和物联网技术区分实验证和非实验证用户的匿名投票系统。\n\n指纹图像通过指纹识别设备获取，是该系统的主要数据集。图像在转换之前会对其进行清理以消除噪声，然后通过多种数学方法转换为数值数据。通过这些数值信息，对\
  \ CNN 进行训练，以将其分类为实验证或非实验证用户。系统的物联网组件用于监控投票过程，并在发生欺诈时发送通知。数据从各种传感器和设备（包括指纹识别设备）中收集，并使用\
  \ Arduino 微控制器传输到中央服务器。\n\n\n\n\n\n所提系统在多个方面与传统的投票程序有所不同，包括提高安全性、匿名性和透明度。它消除了对纸质选票的需求，降低了欺诈或计数错误的可能性。得益于`IoT`技术的使用，该系统现在可以提供实时反馈，这有助于提高投票过程的效率。\n\
  \n该系统的主要优势是其能够提供匿名且安全的投票过程，在防止欺诈的同时保护选民的隐私。为了实现一个安全的投票系统，使用指静识别和深度学习技术提供了一种准确且可靠的身份验证方法。\n\
  \n这种新颖认证系统确保了投票过程的匿名性和安全性，并解决了传统投票系统存在的问题。实验结果表明了所提系统的有效性，使其成为建立安全可靠系统的可行方案。\n\n\
  ## 文献综述\n\n人工神经网络被用于深度学习（机器学习的一个分支）中，用于建模和解决复杂问题（Boucherit & Zmirli, 2022）。这是一种教导人工神经网络识别大型数据集中模式的技术，使机器能够从错误中学习知识并随着实践变得更加准确（Pooja\
  \ & Anuja, 2022）。深度学习模型非常适合图像和语音识别、自然语言处理和异常检测等任务，因为它们有多个互连的神经层，可以分层地处理和分类数据（Boucetta\
  \ & Boussaad, 2022; Ardak & Bardekar, 2022; Khan et al., 2020）。\n\n`CNNs` 使用一组与输入数据卷积的过滤器自动从原始数据（如图像）中学习并提取特征（Ardak\
  \ & Bardekar, 2022）。每个滤波器检测到特定特征（如边缘、角或纹理）后生成的特征图随后会被组合并处理，以产生输入数据的高层次表示（Sruthi\
  \ & Shanjai, 2021）。\n\n合并卷积神经网络（`Merge CNN`）是一种改进的深度网络，它利用具有短路径的多个`CNNs`，用于使用`CNN`\
  \ 进行指静脉识别（Boucherit & Zmirli, 2022）。该方法基于将具有不同输入图像质量的多个相同`CNNs`的输出合并到一个层中（AboSamra\
  \ et al., 2017）。他们创建了各种网络并使用`FV-USM`数据集对其进行训练以实现这一点。最后，他们合并了标记为 A 的`CNN`，它将原始图像与使用对比度限制适应直方图均衡（CLAH）方法增强的图像相结合，并使用最优质的`CNN`架构构建（Boucherit\
  \ & Zmirli, 2022; Sruthi & Shanjai, 2021）。\n\n一种被称为指静脉识别的生物识别技术利用人类手指中独特的静脉纹来识别身份。这是一种非常准确且安全的身份验证方法，难以伪造或篡改（Syazana-Itqan\
  \ et al., (2016); Ayed (2017）。指静脉识别过程的一部分是使用近红外光源对手指中的静脉进行拍照。然后通过对这些图像进行分析，识别出独特的静脉模式和特征（如大小、形状和位置）（Cruz\
  \ & Kaji, 2017; Hassan et al., 2020）。\n\n识别指静脉的方法分为三类：传统方法、基于机器学习的方法和混合方法。传统系统根据应用场景运行在识别模式或验证模式（Khan\
  \ et al., 2020）。传统识别过程的三个主要步骤是图像预处理、特征提取和比较（Picciuco et al., 2019; Ismail & Mohamed,\
  \ 2019）。所提系统的主要优势是其提供安全和匿名投票过程的能力，在防止欺诈的同时保护选民的隐私。为了实现一个安全的投票系统，使用指静脉识别和深度学习技术提供了一种准确且可靠的身份验证方法（McCorry\
  \ et al., 2017）。\n\n## 提出的方法\n\n所提指静脉识别匿名投票系统结合了卷积神经网络（`CNN`）和物联网（`IoT`）技术。为了维持选民的匿名性，系统尝试根据手指中静脉的模式将用户分类为已验证或未验证。\n\
  \n### 系统架构\n\n图 1 展示了我们想要实现的的基本结构，指静脉输入取自数据集并在`MATLAB`中进行处理，以使用如`卷积神经网络`等深度学习算法进行授权。这发送到微控制器。这发送到微控制器。这访问网页对于任何作弊选票。\n\
  \n图 1. 系统架构\n\n### 数据集\n\n已验证和未验证用户的图像包含在数据集中，左右图像的样本。在标记这些图像时考虑了用户是否验证。\n\n随后从数据集中了训练集和测试集。使用训练集训练`CNN`模型，包含图像的\
  \ 80%。使用测试集评估训练模型的性能，包含图像的 20%。\n\n[图 2. 指静脉数据集样本]()\n\n链接：https://www.kaggle.com/datasets/ryelin/finger-vein\n\
  \n### 数据特征\n\n1. **静脉模式**：包括指纹中的排列、方向和大小。\n2. **强度值**：包括静脉的亮度和，用于区分指纹的不同区域。\n3.\
  \ **纹理特征**：包括静脉的粗糙度、光滑度和规律，用于区分不同指纹。\n4. **小波变换**：可以将指纹静脉数据分解为不同的频率分量，从而提供关于底层模式的额外信息等。\n\
  \n## 方法\n\n- **数据收集**：使用红外相机拍摄指静脉照片，然后保存为数据集。\n- **预处理**：为了减少噪声并提高获取图像的质量，应用了高斯、中值和平均滤波器。\n\
  - **ROI 提取**：通过线条跟踪方法分割静脉模式，从预处理的图像中提取感兴趣区域（ROI）。\n- **特征提取**：在提取 ROI 后，Gabor 滤波器、局部二值化模式（LBP）和梯度方向直方图是用于提取特征（HOG）的\
  \ de 过滤器。\n- **分类**：使用提取的特征训练一个用于分类的`CNN`模型。\n\n\n\n\n\n![图 3. 系统阶段](img/fig55_3_C.jpg)\n\
  \n图 3. 系统阶段\n\n![图 4. 嵌入式系统电路](img/fig55_4_C.jpg)\n\n图 4. 嵌入式系统电路\n\n![图 5. 图像预处理阶段](img/fig55_5_B.jpg)\n\
  \n图 5. 图像预处理阶段\n\n## 结果与分析\n\n预处理的第一步是将彩色图像转换为灰度。这种转换在减少图像数据大小的同时增加了对比度，有助于特征提取算法获得更好的性能。可以使用亮度调整技术改变图像的整体亮度。图像的对比度可能会提高，这有助于血管纹路更加清晰。\n\
  \n对比度限制自适应直方图均衡化（`CLAHE`）是一种通过将图像分解成更小的子区域并使用直方图均衡化来增强对比度的方法。\n\n可以使用名为中值滤波（`median\
  \ filtering`）的线性滤波方法消除图像噪声。通过使用中值滤波，每个像素的值将被更改为其周围像素的值对应。这种方法可以减少指静血管图像中的噪声，并增强血管纹路的可视性。\n\
  \n对指静血管图像进行特征提取和分类需要边缘检测和分割等重要步骤，如图 6 所示。边缘检测是定位图像中不同区域（可能是血管或其他结构）边界的过程。这些算法突出了具有强梯度或像素值变化的边缘及其他区域。\n\
  \n![图 6. 边缘检测与分割](img/fig55_6_B.jpg)\n\n图 6. 边缘检测与分割\n\n在这里，分割（`Segmentation）是根据特征或特性将图像划分为不同区域或对象的过程。分割可以将指静血管图像中的血管与周围组织或其他结构分离开。可以使用阈值化（`thresholding`）、区域生长（`region\
  \ growing`）或聚类（`clustering`）等技术。\n\n![图 7. 血管提取频率图](img/fig55_7_C.jpg)\n\n图 7. 血管提取频率图\n\
  \n生成的图表用于确定区分血管区域与周围区域的阈值灰度。可以使用此阈值对图像进行进一步处理，例如分割图像或提取其特征。总体而言，血管提取频率图提供了一种识别指静血管图像中\
  \ `ROI` 的简单且有效的方法，实现了准确且可靠的血管提取和识别。\n\n![图 8. 成功率图](img/fig55_8_C.jpg)\n\n图 8. 成功率图\n\
  \n建议系统的准确性由图表表示，其中 y 轴为成功率，x 轴为标签。将正确分类的图像数量除以数据集中的图像总数，以确定成功率或准确率。\n\n成功率在图上针对各种标签或数据集类别进行绘制。项目中的标签是已验证的用户和未验证的用户。系统对每个标签下图像分类的准确率将显示在图表上。\n\
  \n分类模型的预测误差通过分类损失函数（classification loss functions）来衡量。在多个模型之间比较相同类型的损失时，损失越低表示预测模型越好。考虑以下情况：加权平均分类损失表示为\
  \ `L`。\n\n## 结论与未来工作\n\n总之，该项目提出了一种利用深度学习方法和指静血管识别的安全隐私投票系统。来自已验证和未验证用户的指静血管图像构成了系统的数据集，并使用\
  \ `CNN` 模型进行特征提取和分类。建议系统中集成了一个基于 `IoT` 的告警系统，可以快速通知当局任何潜在的欺诈活动。\n\n基于 IoT 的告警系统的集成进一步提高了建议系统在将指静血管图像分类为已验证或未验证的准确性。建议系统的成功率取决于其根据指静血管图像区分已验证和未验证用户的能力。该系统的主要优点是为投票者提供了安全、隐私的投票过程。未来工作可能涉及提高\
  \ `CNN` 模型的准确性，并引入其他深度学习方法来优化建议系统的性能。\n\n## 参考文献\n\n1. AboSamra, K. M., A. A. Hafez\
