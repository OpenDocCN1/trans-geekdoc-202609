  \n\n\n\n\n# 引言\n\n前端领域的唯一目标是生成问题并将其发送到相应的问题处理部门。例如，他们为电气问题提供了一个板块。他们针对各种问题提供了几个区域。每个区域都提供了问题撰写的示例和投诉的典型结构（Tamgave\
  \ et al., 2022）。Simon Fuchs、Clemens Drieschn 和 Holger Wittges 在本文中阐述了如何创建一个使用关键要素的工单系统，以便为公司提供支持。公司在工单分发方面遇到的问题使他们采用机器学习算法在工单进入系统时对其分类。为了获得最佳结果，他们结合了随机森林和支持向量机（Fuchs\
  \ et al., 2022）。为了可视化工单系统的应用，本文建议收集来自员工工单系统的所有数据。\n\n此外，他们根据 SLA（服务水平协议）确定了处理系统输入工单的优先级（Aglibar\
  \ & Rodelas, 2022）。解决的技术问题涉及云、资源分配浪费，并讨论了如 Alops 等工单系统新技术的介绍（Chen et al., 2020）。Adiyanto\
  \ & Nurasiah (2019) 在本文中讨论了创建一个用于客户关系管理的工单系统，以提高组织的统计数据和性能。它的开发是为了为客户冲突节省资金和时间。它可以管理大量数据，但需要一直连接互联网。\n\
  \n在网络事件监控背景下，告警是实用的通知，为 IT 管理人员提供有关事件的信息。由于告警通常由网络设备和监控系统自动生成，它们通常只包含产生它们的系统可以访问的技术信息。\n\
  \n在这种情况下，工单系统具有不同的用途。\n\n工单是从业务角度对事件的表示。它们通常由人类活动产生，包含更多关于现在和过去的语义信息。本研究的主要假设是，将工单数据包含在告警关联过程中，将增强整个事件解决周期内事件描述的及时性、准确性和完整性（Gohil\
  \ & Kumar, 2019; Salah et al., 2018）。\n\n一个利用专家档案和社交档案的模型为工单提供建议，以便工单发送给相应的专家进行解决。他们进行了多次实验以确定该模型的有效性，并发现建议的模型很有前景（Xu\
  \ & He, 2018）。一种将工单发送到相应部门的分类方案（Kormpho et al., 2018）。他们选择创建一个深度神经网络模型，在每个工单进入系统时对其进行排名。如果一个工单包含大量冗余术语，则无法对其进行有效分类（Baral\
  \ et al., 2017）。\n\n工单在进入系统时被逐字提取、进行恰当标记，然后附加到相应的聚类中。Xu 等人 (2016) 指出，作者提出了一种新技术，包含了支持向量机的集成。在这里，`SVM`\
  \ 被用作分类用户提交的工单的基础分类器。\n\n该系统使用的算法是层次聚类分析，用于根据涉及的变量进行事件分类。进入系统的工单到其正确聚类的映射由贝叶斯网络负责（Bogojeska\
  \ et al., 2015）。\n\n工单系统通过另一种名为 K 近邻的机器学习算法提供帮助，该算法不仅被用于分类，还用于解决不断进入系统的冗余工单（Zhou\
  \ et al., 2015）。\n\n为了增强事件管理流程，创建了一个结构合理的事件工单系统。我们在这里提供了一个工单分类的通用概念。`timestamp`\
  \ 字段和 `IDs` 字段是这里使用的两个关键字段。系统分为两个基本阶段：工单关联和工单准备。系统信息通过关联过程得到改进。该系统已应用于无监督数据集。该方法的准确率为\
  \ 88.1%（Salah et al., 2015）。\n\n通过实证分析发现电子工单系统对客户的影响。本研究使用的数据集来自一家名为约旦航空的航空公司去年的数据。分析主要关注以下变量，如基础设施、客户/技术支持、数据安全、用户友好性，以识别客户满意度（Qteishat\
  \ et al., 2014）。\n\n为他们的想法提供新的形式化方法以及针对问题提供基于数据的精确解决方案。该方法是领域驱动的，因为它不需要任何实验，并且经常发现独特且不显而易见的解决方案。它产生的结果对于缺乏数据挖掘经验的终端用户来说是直接可用且易于理解的。这一切促进了用户参与度的提高和更高的终端用户接受度（Elangovan\
  \ & Ramaraj, 2010）。\n\n研究人员提出了一种名为优化网络模型的生成模型，它描述了工单的生命周期。根据 `ONM` 模型，他们开发了一种概率算法来路由工单。他们计算了由领域专家通过路由工单解决的最优解决方案。他们专门为\
  \ `RM` 开发了一种排序解析算法。尽管与贪婪传输等算法相比，它可以高效路由进入系统的工单，但 `ONM` 模型的稳健性难以使用（Miao et al., 2010）。为云服务开发工单系统，因为工单是\
  \ IT 行业的主要部分。\n\n他们包含了 5 个模块，如事件分类、CI 关联、收集以及路由工单的知识搜索，并由两个数据库系统组成，包括 `CMDB` 和 `Knowledge\
  \ DB`（Gupta et al., 2009; Marcu Grabarnik, 2009）。\n\n![图 1. 系统架构](img/fig18_1_C.jpg)\n\
  \n图 1. 系统架构\n\n## 3. 提出的系统架构\n\n最初，本文利用教育机构数据库创建了一个查询实例。生成的查询被发送到组织控制台的服务器。因此，使用深度神经网络对生成的查询进行分类，并使用排序解析器和路由方法进行匹配评分。\n\
  \n### 数据库和枚举预处理\n\n从不同来源收集数据集的过程被称为数据收集。收集到的原始数据可能是标记的，也可能是未标记的。如果项目未标记，必须进行手动标记。当遇到对象\n\
  \n\n\n\n\n在无标签数据中，数据标注使学习模型能够识别特定的类别。数据标注涉及在原始图像数据上添加标签，以描述对象所属的类别。采用该机构的数据收集过程是因为它已经拥有了其所服务的客户的数据库。这项工作的构建利用了某所教育机构的数据库。由于验证积分过程只需要主导且显著的特征，因此仅进行了特定的预处理。数据是以极高的确定性从该机构检索的。\n\
  \n### 时间卷积网络\n\n输入层、隐藏层、其间的卷积层以及输出层构成了 `CNN` 架构的基础。隐藏层汇聚在一起。中间结果通过池化层进行整合和聚合。通过全连接层尝试推导出一个定义输入值到输出映射的非线性函数。`TCN`\
  \ 与 `RNN` 一样具有一个旨在减少的代价或损失函数，以降低预测误差。\n\n![Fig. 2. Temporal 卷积网络](img/fig18_2_C.jpg)\n\
  \n图 2. 时间卷积网络\n\n卷积是积分演算中的一种操作。卷积决定了两个函数乘积的积分，其中一个是反转且转置的。卷积函数描述了两个函数如何相互作用以改变其中一个的形状。\n\
  \n卷积分析两个序列或系列之间的相似性，类似于互相关。在计算机视觉中，某个节点的输入被称为感受野或补丁（patch）。网络中的每个节点接收其前一层一小部分的信息，称为节点的感受野。\n\
  \n**输入：** 长度为 `T`、特征数量为 `F` 的输入序列 `X`，卷积大小 `K`，滤波器数量 `F’` 以及输出维度 `0`。\n\n**输出：**\
  \ 长度为 `T’`、维度为 `0` 的输出序列 `Y`。\n\n用随机值初始化权重 `W`。对于输入序列的每个时间步 `tin`：\n\n1. 提取以时间 `t`\
  \ 为中心的长度为 `K` 的输入切片，得到形状为 `(K, F)` 的张量。\n2. 使用权重 `W` 对输入切片执行卷积操作，得到形状为 `(F’,)` 的张量。\n\
  3. 对卷积输出应用激活函数（例如 `ReLU`）。\n4. 将生成的张量添加到输出序列 `Y` 中。\n\n对输出序列 `Y` 应用具有权重 `W_fc` 和偏置\
  \ `b_fc` 的全连接层，得到形状为 `(T’, 0)` 的张量。\n\n对输出张量应用 `softmax` 函数以类别概率。\n\n`TCN` 确保了因果卷积。应使用输入序列中较早发现的值来确定输出值。感受野在\
  \ `TCN` 中通过扩散被扩大，以包含更多的历史时期。\n\n### 基于排序分辨率的路由\n\n在这项研究中，路由系统和排序解析器共同提高了效率、可靠性和分辨率时间，同时有助于定位匹配分并允许查询到达适当的子划分。决定数据从一点移动到另点所采取的路径的过程被称为路由算法。该方法的主要优点之一是对\
  \ Web 流量的高效管理，这也是他们促进的。数据包在离开源地后可以从多条路径中选择到达目的地。路由算法公式如下\n\n$$\\begin{matrix} &\
  \ {Pa_{i} = \\lbrack P(k_{1} \\mid a_{i}),P(k_{2} \\mid a_{i}),} \\\\\\\\ & {P(k_{3}\
  \ \\mid a_{i})\\ldots\\ldots..P(k_{n} \\mid a_{i})\\rbrack^{9}} \\\\ \\\\ \\end{matrix}$$\n\
  \n其中 `P` 指代概率，`a` 为查询中提到的单词，`k` 是不同团队使用的关键词。\n\n### 亚士多德逻辑系统\n\n使用归纳推理将给定输入转换为结果的方法被称为亚士多德逻辑。映射随后为做出决策和发现趋势奠定了基础。模糊推理是使用\
  \ `vfuzzy` 逻辑将输入转换为输出的过程。该映射随后为决策和发现趋势提供了依据。\n\n在项研究中，使用模糊推理模型将特定类型的材料与适当的分类策略连接起来。分类器的输出作为其输入。各种模糊化技术的实现由模糊化单元辅助，该单元将清晰输入转换为模糊信息。一旦精确信息转换为模糊输入，就会生成一个由规则库汇成的知识库。去模糊化单元的模糊输入随后被转换为清晰值，即为输出。\n\
  \n### 提的算法\n\n这涉及使用卷积层从数据中提取特征，然后将特征通过时间层以对数据中的时间依赖关系。时间层的输出随后传递到全连接层进行分类，从而确定用于路由查询的适当组。\n\
  \n结论，我们的研究证明了使用复杂算法（如时间卷积网络）来整合大量人员和消费者查询的有效性。\n\n![Fig. 3. 效率图](img/fig18_3_C.jpg)\n\
  \n图 3. 效率图\n\n## 结论\n\n在这项研究中，我们分析了整合大量人员和消费者查询的类型软件的性能。我们以全面的方式进行，考虑了人类和技术的发展。\n\
  \n为了解决这个问题，我们实现了一种使用时间卷积网络将查询路由到适当组组的复杂算法。我们的结果表明，该实现提高了路由的准确性和速度。\n\n\n\n\n7. Saeed\
