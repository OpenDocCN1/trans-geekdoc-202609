  \n## 文献综述\n\nManohar and Kumar (2020) 提出了一种用于数据隐藏的隐写术。他们的论文解释说，隐写术通过将数据隐藏在另一种形式中进行秘密通信的技术，使其在不泄露的情况下无法被检测。\n\
  \nAloraini et al. (2022)、Subramanian et al. (2021) 开发了一种在图像隐写术中使用最低有效位（LSB）方法隐藏图像和文本的技术。他们的论文描述了数字隐写术如何将信息隐藏在其他数据中以确保传输的安全性。\n\
  \nCogranne et al. (2022) 提出了一种量化技术。他们的论文解释了该方法如何通过降低变形或分析区分度来嵌入隐藏信息，从而提高全知最优检测器的安全性。\n\
  \nNahar et al. (2021) 研究了 LSB 技术并引入了高级加密标准（AES）以增强隐写图像的安全性。他们的工作旨在将数据嵌入具有更高安全性的隐写图中。\n\
  \nSubramanian et al. (2021) 及其团队致力于增加嵌入用户键值的数据容量。他们的工作旨在提高隐写术的数据隐藏能力以增强其鲁棒性。\n\n\
  Yang et al. (2020) 研究了基于 LSB 的技术。在他们的论文中，他们讨论了如何提高隐写图像的强度、固定更高的容量，并实现秘密集聚的不可不可觉性。\n\
  \n## 图像隐写术的优点\n\n安全性：图像隐写术提供了高水平的安全性，因为它可以在图像中隐藏敏感数据数据，使得未经授权的用户难以访问或检测（Manohar\
  \ and Kumar 2020; Zhou et al., 2020; Subramanian et al., 2021）。\n\n不可检测性：由于隐写术将数据隐藏在图像中，观察者很难检测到是否存在任何隐藏数据。因此，Subramanian\
  \ et al. (2021) 隐写术提供了高机密性和保密性。\n\n大容量：图像具有较大的存储容量，因此可以在其中隐藏大量数据而不影响图像的视觉质量。\n\n\
  ## 图像隐写术的缺点\n\n易被检测的性：尽管隐写术很难被检测，但并非不可检测。可以使用先进的技术和软件工具来检测图像中的隐藏数据（Saxena and Maheshwari,\
  \ 2021）。\n\n数据丢失：当数据隐藏在图像中时，可能会导致图像质量的下降。这是因为隐写涉及对图像进行细微修改，这会导致图像质量的劣化（Cogranne\
  \ et al., 2022）。\n\n受限于特定类型的文件：隐写术仅限于特定文件以嵌入数据。\n\n## 使用的方法\n\n图像隐写术中使用了各种技术，其中一些包括：\n\
  \n### 最低有效位（LSB）嵌入\n\n这是图像隐写术中最常用的技术。在该方法中，秘密信息被隐藏在图像的最低有效位中。这种方法对图像质量的影响最小。\n\n\
  ### 扩展频技术\n\n该技术通过调制载波振幅或相位来嵌入秘密数据（Tian et al., 2022）。\n\n### 变换域技术\n\n该技术通过将原始图像转换为不同的域（如小波域）来嵌入秘密数据。\n\
  \n### 失真技术\n\n该技术通过对图像进行细微失真，使得肉眼难以察觉，但可以被检测到（Pan et al., 2022）。\n\n### 随机化技术\n\n\
  该技术通过随机生成器选择像素或像素组来嵌入数据，使其难以检测。\n\n图像隐写术中有许多技术，但上述是常用的。技术的选择取决于所需的安全性、要隐藏的消息大小以及图像类型（Meng\
  \ et al., 2009）。\n\n## 项目生命周期\n\n![图 1 项目生命周期](img/fig61_1_1)\n\n项目生命周期\n\n## 高级加密标准（AES）\n\
  \n![图 2 高级加密技术](img/fig61_2_2)\n\n高级加密技术\n\nAES 广泛应用于美国标准与技术研究院（NIST）（Nahar et al.,\
  \ 2021; Subramanian et al., 2021）。密钥越大，加密安全性越高。密钥可以是 128 位、192 位或 256 位。这些操作包括代换、置换和矩阵运算。\n\
  \n512 位算法加密过程如下：\n\n1. 创建一个 `i=0` 和 `j=0` 的 8x8 矩阵 `M`。\n2. 将消息字符转换为十六进制格式。\n3.\
  \ 使用异或运算将十六进制值与密钥矩阵相结合。\n4. 完成首次交换：将第 1 列和第 2 列替换为第 3 列、第 2 列、第 5 列和第 6 列，以及第 7\
  \ 列和第 8 列。\n5. 交换整个矩阵块。\n6. 执行第二次交换：将第 1 行到第 3 行与第 2 行到第 4 行交换，并将第 5 行到第 7 行交换。\n\
  \n\n\n使用替换框进行列混合操作，即将常量矩阵与第 8 步的结果（S-box）进行异或运算。\n\n*   使用 `XOR` 将密文与第 10 步的输出结合。\n\
  *   重复执行第 6 至 11 步，多达四次。\n\n为了演示该方法的工作原理，我们将秘密信息“steganography”整理成一个 `8*8` 矩阵。\n\
  \n## 结论\n\n我们收集了各种图像隐写技术并分析了它们的优缺点。在所有隐写方法中，我们选择了 `AES` 算法，因为它具有更强的加密性。我们使用 `Java`\
  \ 编程语言在 Android 应用中实现了图像隐写。我们开发的基于 Android 的图像隐写系统旨在促进安全的秘密通信，且不会引起不必要的。\n\n## 参考文献\n\
