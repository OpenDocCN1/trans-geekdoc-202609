  \n## 摘要\n冠心病是一种被称为缺血性心病的类型的疾病。目前，冠心病已成为全球常见的致命疾病。它影响着男女老少。生活方式的改变是 `CAD` 的主要标志。`CHD`\
  \ 的一些主要迹包括吸烟、不健康饮食、肥胖、糖尿病和缺乏运动。这些因素导致由脂肪酸和其他物质组成的动脉发生阻塞。这限制了流向心脏的血液。根据冠动脉损伤的程度，动脉中会形成一个或多个阻塞，导致心肌梗死。如果不能早期控制冠心病，会导致充血性心衰竭。`CAD`\
  \ 的早期分类、检测和预防非常重要。\n\n关键词：冠心病，分类，检测，诊断\n\n# 引言\n心脏是人体的重要器官，通过被称为动脉和静脉的循环系统循环血液。身体部位需要富氧血液来维持功能。主动从肺部接收氧血，并通过冠状动脉供应血液。Shahjehan\
  \ 和 Bhutta (2021) 描述了多种动脉，如右冠动脉、左冠动脉、回旋动脉和左前降动脉。Khan 等人 (2020) 报告，动脉粥样硬化是冠心病的主要原因。这导致动脉中形成更多斑块。斑块是胆固醇、脂肪酸等物质在动脉中形成的物质，它们会收窄动脉并阻塞血流，使心脏无法获得足够的血液。由于供应减少，身体其他部位也会受到影响。例如，大脑因为得不到足够的血而导致中风。Shahjehan\
  \ 和 Bhutta (2021) 指出，外周动脉疾病 (`PAD`) 是由于四肢血液供应不足。这种冠心病由于风险因素引起。Zhang 等人 (2019) 认为，`CHD`\
  \ 最强风险因素是血浆 `OX-LDL`，在早期阶段即可检测。Malakar 等人 (2019) 讨论了 `CAD` 的各种危害。吸烟会增加粥样硬化病变，并将冠心病推向下一阶段——冠脉阻塞。另一个与\
  \ `CHD` 风险因素是二型糖尿病。胆固醇水平通过药物维持。\n\n胆固醇是脂肪积累形成的。脂肪分为两种。一种是身体用于代谢活动的好脂肪。另一种坏脂肪会影响正常的血液循环。它沉积在冠状动脉中形成斑块，阻塞流向心脏的血流。\n\
  \n## CAD 流行学\n* 从 1990 年到 2020 年，印度因心血管疾病死亡的人数从 226 万增加到 477 万。冠心病死亡率在农村人口中增加了 1.6%\
  \ 达到 7.4%，在城市人口中增加了 1% 达到 13.2%。\n* 冠心病在 2019 年是一种非常危险的疾病，导致 36 万人死亡。20 至 65 岁的青少年和老人也受到\
  \ `CAD` 的影响。\n\n## CAD 的类型\n在 Khan 等人 (2020) 中，作者描述了 `CAD` 的不同类型。小动脉壁发生单血管冠心病，这限制了含氧血液流向心脏。血流不足会导致胸痛和呼吸困难。通过药物和治疗进行诊断。双支冠心病减少了两处动脉横截面积的血流。`DVCAD`\
  \ 患者通常接受药物治疗或手术治疗。使用血管重建技术来治疗左心室功能不全。三支血管冠心病发生在所有三根大心外冠状动脉中。`TVCAD` 患者通过球成形术进行治疗。\n\
  \n文章的其余部分安排如下。在第 2 节中，对现有文献进行了综述，主要关注 `CAD` 的分类、`CAD` 的检测、诊断和 `CAD` 的预防。在第 3 节中讨论了论文的概述，并对未来工作进行了总结。\n\
  \n\n\n\n\n在 Raghavendra et al. (2018) 中，作者讨论了非侵入性诊断方法无法确定 `CAD` 精确影响的问题。因此，作者提出了一种计算机辅助诊断系统，通过获取\
  \ `ECG` 并使用`双密度双树离散小波变换` (`DD-DTDWT`) 将其分解为子带，并利用熵值从子带中提取特征，通过`边缘马尔可夫分析` (`MFA`)\
  \ 降低降维。该技术使用 `CADRI` 对冠心性疾病进行分类，其准确率达到了 96%。\n\n在 Caliskan and Yuksel (2017) 中，作者提到设备完备医院的医学专家正在进行\
  \ `CAD` 的侵入性诊断。由于成本高昂，这种诊断方法仅被少数患者使用。所提出的方法结合了两个自动编码器和一个 `soft-max` 层以及用于 `CAD`\
  \ 分类的 `DNN` 分类器，与 `SVM`、`KNN` 和 `DT` 相比，它显示出最高的准确率。\n\n在 Khan et al. (2020) 中，作者获取了原始\
  \ `ECG` 信号。经过预处理和分割后，使用经验模式分解和特征模函数提取统计、形状、能量和熵属性。该预处理后的信号被传递给 `Cubic-SVM` 分类器。他对普通项目和\
  \ `CAD` 项目进行了分类，并将 `CAD` 分为 `SVCAD`、`DVCAD` 和 `TVCAD`。该方法提供了 95% 的准确率。\n\n在 Sharma\
  \ and Acharya (2019) 中，作者针对手动分析 `ECG` 信号效率低下且容易出错的问题，以及老年人和残障患者进行 `CAD` 诊断测试更为困难的问题，因此作者提出了一种用于\
  \ `CAD` 分类的自动诊断方法。作者使用了最优聚焦时频 (`OTFC`) 和双向小波滤波器组 (`BWFB`) 进行 `CAD` 识别。使用对数能量和模糊熵从\
  \ `OTFC` 中提取特征。通过 10 折交叉验证和 `GSVM` 实现 `CAD` 分类。该方法提供了 99.53% 的准确率。\n\n## CAD 的检测\n\
  \n在 Acharya et al. (2017) 中，作者讨论了 `ECG` 信号的不稳定性，异常心律的诊断耗时较且容易产生错误。因此，作者使用了自动诊断方法。所提出的方法是一种\
  \ `CNN`，包含 4 个卷积层、3 个全连接层和 4 个最大池化层。使用 `2s` 和 `5s` `ECG` 信号诊断 `CAD`。该方法提供了 94.95%\
  \ 的准确率。\n\n在 Acharya et al. (2018) 中，作者指出 `ECG` 信号不稳定，专家需要视觉纠正信号。因此，作者提出了一种信号纯化计算机系统，可以轻松检测\
  \ `CAD`。作者利用熵来揭示 `ECG` 信号的隐藏特征，并区分健康个体与 `CAD` 影响的人员。如果 `ECG` 信号的 `Q3` 变异性检测指示心率异常，与健康人相比，这在疾病患者中用处较小。该方法提供了\
  \ 90% 的准确率。\n\n在 AlHosani et al. (2017) 中，采用了 `PAT` 技术来创建一个用于 `CAD` 检测的 `QRS` 检测系统。作者提出了一种检测\
  \ `ECG` 信号中 `R` 波峰并确定最小 `R-R` 间隔的方法。从 `ECG` 信号中提取特征并使用名为 `KNN`、`DT` 和 `SVM` 的算法进行分类。该方法提供了超过\
  \ 90% 的准确率。\n\n在 Banerjee et al. (2020) 中，临床尚无诊断 `CAD` 的生物标志物。作者结合了两个非特异性生物标志物：非典型\
  \ `ECG` 形性和不规则的心率变异性，使用组合 `CNN-LSTM` 架构对 `CAD` 进行分类。`CNN` 用于测量心率变异性的扩张，以从 `ECG`\
  \ 和 `LSTM` 中提取形态特征。该方法提供了 93% 的准确率。\n\n在 Butun et al. (2020) 中，作者提出了使用深度神经网络胶囊网络进行自动\
  \ `CAD` 检测。`2s` 和 `5s` 的 `ECG` 信号通过名为 `1D-CAPSNET` 的深度学习模型自动检测 `CAD`。该方法提供了。\n\n\
  ## CAD 的预测\n\n在 Chen and Heng (2021) 中，`CAD` 的早期预测是一项挑战性任务。因此，作者提出了 `池化面积曲线` (`PUC`)\
  \ 利用机器学习进行更准确的 `CAD` 预测。`SVM` 算法是近期基于图像的 `CAD` 分类，准确率为 93%。\n\n在 Ayon et al. (2022)\
  \ 中，作者将 `Naive Bayes`、`Random Forest` 和 `K-Nearest Neighbor` 用于 `Coron Heart Disease`，并结合了支持向量机、深度神经网络等七项人工智能技术。与\
  \ `DNN` 相比，它获得了 98.15% 的准确率。\n\n在 Khan (2020) 中，`CAD` 预测通过多种算法进行，但未能提供更好的准确率，因此作者提出了\
  \ `MDCNN` 用于 `CAD` 预测。`MDCNN` 被建议回归并提供了 98.2%。\n\n在 Ayatollahi et al. (2019) 中，`CAD`\
  \ 预测通过多种算法进行，但未能提供更好的准确率，因此作者提出了两种数据挖掘算法用于 `CAD`。作者使用 `ANN` 和 `SVM` 进行预测获得了最高准确率。`SVM`\
  \ 算法是近期基于图像的 `CAD` 分类。\n\n## 表 1 现有工作对比分析\n\n| 序号 | 作者 (年份) | 方法与算法 | 特征 | 缺点 |\
