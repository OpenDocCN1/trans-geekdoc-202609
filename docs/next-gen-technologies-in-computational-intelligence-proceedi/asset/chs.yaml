  \ Lei Zhang (2022). 用于脑肿瘤的深度学习。Brainles: 质瘤，Springer Publishing, 410–419.\n\n# 在边缘部署智能以使用机器学习进行分类\n\
  \nS. Sujiritha 和 Linda Joseph\n印度斯坦科技理工学院计算机科学系，印度钦纳纳\n电子邮件：`sujiritha.s11@.com`,\
  \ `linda24@gmail.com`\nDOI:`10.1201/97810034305249`\n\n## 摘要\n\n由于大量物联网产生海量数据，对集中式系统或云存储存在需求。但存在网络拥堵或数据丢失的可能性。为了防止这种情况，引入了边缘计算。让边缘靠近源有助于更容易进行计算。由于边缘计算在计算能力方面存在限制，所提出的框架——深度自编码器机器学习是一种轻量级方法。该方法将数据分为正常和问题数据，仅将问题数据发送到云端。使用自编码器，问题数据在边缘被压缩并在云端进行重建。因此，重建的数据可以可视化，以分析所看到的异常情况。\n\
  \n关键词：物联网 (IoT)，边缘计算，机器学习，深度自编码器\n\n# 引言\n\n边缘计算可以认为是传感器数据的计算过程，它靠近网络边缘并远离中心节点。它可以被定义为一种分布式\
  \ IT 网络架构，允许移动计算在本地产生数据 [Shen et al., 2021]。边缘计算并不依赖于集中云数据中心，而是分配处理能力以确保实时处理且不丢失数据。没有边缘计算，如今的物联网可以在广泛的场景中运行\
  \ [Ashouri et al., 2019]。\n\n然而，随着越来越多的事物相互连接，以及我们调查对延迟、带宽和安全要求日益严格的案例，边缘计算可能会成为关键的推动因素\
  \ (Ananda Mohon Ghosh & Katarina Grolinger, 2021; Junlong Li et al., 2022)。但仍然存在决定边缘计算对物联网产生多大影响的问题和困难。这些包括确保边缘基础设施物理安全的技术困难\
  \ [Hastbacka et al., 2022]，因为这种基础设施可能会被用于在专用数据中心极度安全的环境之外存储数据。\n\n\n\n\n\n虽然边缘计算可以实现数据的实时处理，但许多\
  \ IoT 边缘设备（如传感器）没有足够的计算能力在本地执行任何深度学习算法，这些算法可能是复杂的（Wisultschew 等人，2022）。因此，这些设备可能依赖用于存储和计算处理的云端或集中系统。尽管如此，人们正致力于开发更轻量化的机器学习模型，这些模型可以直接在边缘设备（如传感器）上实现，而无需云端或集中系统。这些模型被称为边缘\
  \ AI 模型，其设计比传统的深度学习模型具有更高的计算效率，且所需的内存和处理能力更少。这有助于直接在边缘设备上对数据进行实时处理和分析，无需将数据传输到中心系统。结合边缘计算和云计算可能会克服延迟并支持复杂的数据分析任务。考虑到边云协同，最大程度地减少特征是一个具有挑战性的问题。然而，从计算和存储的角度来看，将所有数据传输到云端是不行的（Ghosh\
  \ & Grolinger, 2021; Li 等人，2020），并且需要边缘设备执行并进行计算（Liu 等人，2021）。在本文中，只有必要的 IoT 传感器数据会被传输到云端，其余数据则保留。\n\
  \n机器学习可以是分类 IoT 数据的强大工具，因为它能够自动识别和分类数据中的模式和趋势。这有助于在制造业、医疗保健和智能城市等多个领域释放洞察并驱动更优的决策。机器学习在\
  \ IoT 数据分类中的应用包括制造业中的预测性维护、医疗保健中的异常检测以及智能城市的交通流预测。通过使用机器学习对 IoT 数据进行分类，机构可以获得新的见解、优化操作并改进决策。\n\
  \n本文其余部分的安排如下：第 2 节讨论了相关工作。第 3 节提出了边缘框架。第 4 节展示了边缘的实现。第 5 节介绍了本文的评估。第 6 节展示了结果。最后，第\
  \ 7 节对全文进行了总结。\n\n## 相关工作\n\n本节介绍了利用各种算法的不同应用于 IoT-边缘-云结合。边缘计算在当下发挥着重要作用，通过连接 IoT\
  \ 和云端来实现存储、计算、报警、预测、获取洞察等目的。\n\nGhosh & Grolinger (2021) 通过使用 `Autoencoder` 减少基于\
  \ IoT 的数据的流量和延迟，研究了边缘计算与云计算的集成。滑动窗口被用于数据压缩（Fekri 等人，2020; Essien & Giannetti, 2020）和网络流量减少（Ghosh\
  \ & Grolinger, 2021）。另一方面，Ferrari 等人 (2020) 检查了人类活动识别模型的个性化，并执行了滑动窗口和输入特征的生成。Li\
  \ 等人 (2022) 使用雾化计算在通过 `SCADA` 从 IoT 传输到云端时，为智能电网获取的数据提供隐私保护。\n\nEssien & Giannetti\
  \ (2020) 提出了 `ConvLSTMAE`，这是一种用于时间序列数据的多步机器速度预测。所提出的框架结合了长短期记忆 (LSTM) 和卷积神经网络 (CNN)，分别提取用于表示和序列学习的特征。最后，用于降维的编码器和解码器最终减少了计算需求和训练所需的时间。\n\
  \nPelle 等人 (2021) 引入了公共无服务器 E-C 平台，该平台使用 `AWS Greengrass`，使得边缘计算变得更容易。另一方面，Wisultschew\
  \ 等人 (2022) 将计算从云端转移到 IoT 边缘。深度神经网络 (DNN) 在准确性方面处理大量数据表现良好。本文使用了不同的边缘架构进行对象分类，并对其进行比较，以为\
  \ IoT 应用提供完美的解决方案。\n\nLahasan & Samma (2022) 了一种轻量级模型，一种有效的双层优化器，通过对输入特征、隐藏神经元数量和训练实例数量进行即时选择，开发了轻量级深度\
  \ AE 模型。数据集经过归一化，使用 min-max 优化器将所有特征缩放到 `[0,1]`（Fekri 等人，2020; Lahasan & Samma,\
  \ 2022）。\n\nCheng 等人 (2021) 使用了一种变换不变自编码器 (TIAE) 框架，该框架通过学习高级语义特征实现了无监督异常检测的恒定且良好的性能。对于每个轮次（epoch），它包含了自节奏学习来训练数据集。Queiroz\
  \ 等人 (2022) 使用模糊推荐系统，识别云-边缘-IoT 特定层级需要的数据分析。\n\n## 提的框架\n\n本节代表了带有深度自编码器的机器学习。所提出的\
  \ IoT 设备框架通过在边缘设备使用所提算法从传感器识别异常行为，并对问题数据进行可视化以分析问题。\n\n### 数据预处理\n\n*归一化：* 使用归一化预处理方法完成数据标准化。具有落在相同范围的不同数据源。如果数据在训练之前未进行归一化，可能会导致网络产生问题，这将显著减慢学习。可以使用\
  \ min-max 缩放对数据进行归一化。`[0, 1]` 的 min-max 公式如下：\n\n$$x^{\\\\prime} = \\frac{x - \\\
  min(x)}{\\max(x) - \\min(x)}$$$\n\n其中 `x` 代表实际值，`max( x )` 和 `min( x )` 是特征值的最大值最小值，代表标准化值。\n\
  \n*并行处理：* 在自编码器的背景下，`n_jobs` 可能用于数据准备或训练过程中不涉及神经网络本身的其他部分。例如，`n_jobs` 可用于在将数据馈自编码器之前并行处理加载和预处理步骤。这对于加载和预处理数据可能耗时的大数据集非常有用。\n\
  \n### 深度自编码器\n\n图 1 所示的算法有助于通过编码器-解码器概念压缩从边缘传输到云端的海量数据。边缘侧编码器，云端解码器。在云端侧，压缩的数据被还原为原始状态。\n\
  \n![图 1 深度自编码器](img/fig49_1_B.jpg)\n\n图 1 深度自编码器\n\n*特征选择：* 为了克服过拟合发生的限制，采用了嵌入方法如正则化\
  \ L1 和 L2 进行特征选择，通过选择最佳特征帮助模型表现良好。\n\na) LI 正则化 - L1 有助于克服过拟合，同时提高模型效率。L1 正则化也可用于特征选择，因为它会将无关特征的权重置零。\n\
  \n$$\\\\left. f = \\\\frac{1}{2}\\\\sum\\\\limits_{L = 1}^{N}{(\\hat{y} - y)}^{2}\
  \ + \\\\lambda\\\\sum\\\\limits_{i = 1}^{N} \\\\middle| \\\\theta\\\\_{i} \\\\right|$$$$\n\
  \n其中 `N` 是特征数量。`λ` 代表正则化参数，`θ` 是向量和。`y` 和 `y`’ 是实际值和预测值。\n\n### ML 分类器\n\n\n\n\n\
  \n编码数据被分为正常数据和问题数据，由于数据在编码后接近线性可分，因此使用逻辑回归（LR）模型进行分离。逻辑回归可以识别将数据分为不同类别的线性决策边界。然而，当数据不可线性分时，逻辑回归可能无法找到良好的决策边界，并导致分类性能不佳。支持向量机（SVM）通过寻找最佳分离不同类别数据的超平面来工作，超平面是使类别间距最大的决策边界。因此，它可以与使用支持向量机（SVM）对原始数据的分类进行比较，因为其准确率与编码数据的分类结果相似。分离出的问题数据很容易传输到云端。\n\
  \n### 在边缘设备上的实现\n\n数据归一化是机器学习中常见的预处理步骤，涉及缩放和偏移数据集的值，使其落在特定的范围内。其目标是确保数据集中的不同特征处于相似的尺度上，这可以提高模型的效率并使结果更易解释。自动编码器（\
  \ Kurihana et al., 2022; Ohashi et al., 2021; Chinnasamy et al., 2023）是一种可用于无监督学习任务的神经网络，例如数据压缩、特征提取和异常检测。它们由两个部分组成：用于将输入映射到低维潜空间的编码器，以及从潜空间表示重建原始数据的解码器。\n\
  \n该算法将通过编码器-解码器概念帮助压缩从边缘到云端传输的海量数据。为了克服过拟合的发生，执行了如图 2 所示的预处理步骤（如正则化），用于特征选择，通过选择最佳特征有助于模型表现良好。并行处理缩短了训练模型的时间。正常数据和问题数据的分类可以通过逻辑回归和支持向量机完成。每种都可以用于编码数据和原始数据的分类。因此，问题数据被传输到云端进行可视化。\n\
  \n![图 2. 使用深度自动编码器的机器学习](img/fig49_2_B.jpg)\n\nFig. 2. 使用深度自动编码器的机器学习\n\n### 评估\n\
  \n本节介绍了训练阶段的评估。展示了执行所提框架所需的预处理步骤和参数。此外，下方显示了实验使用的三个数据集及其缩小后的尺寸。\n\n### 训练阶段\n\n\
  本节显示了训练这三个数据集所需的超参数。所有数据集均使用相同的参数进行实验。表 1 所示了应用于所提模型的超参数。\n\n表 1 训练阶段的超参数\n\n| 超参数\
