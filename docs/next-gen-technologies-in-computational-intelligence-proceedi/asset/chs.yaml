  \ `CSP` 的双层数据集和一个特征向量。 | | 准确率 99.65%，灵敏度 99.64%，特异性 99.7% |\n\n## CAD 诊断\n\n在 Velusamy\
  \ and Ramasamy (2021) 中，作者建议使用异构集成方法。集成投票技术使用了 `K-近邻`、`随机森林`和`支持向量机`三种基础分类器来预测 CAD。这些分类器基于多数投票\
  \ (`MVEn`)、加权平均投票 (`AVEn`) 和平均投票率 (`WAVEn`)。使用 `Boruta` 封装特征选择技术选择了特征。在 `WAVEn`\
  \ 算法中有 98 个特征，它用于早期识别 CAD。准确率为 97%。\n\n在 Abdar 等 (2019) 中，`CDSS`（临床决策支持系统）对个人健康的影响日益增加，使医生难以诊断。为了克服这个问题，作者使用了一种名为\
  \ `(NE-nu-SVC)` 的方法。该方法将集成学习方法与机器学习模型相结合用于 CAD 诊断。通过遗传搜索算法和类平衡器提取特征提高了性能，使用重采样方法结合多级过滤方法平衡数据，并使用四个核函数实现了高达\
  \ 98.60% 的准确率。\n\n在 Zomorodi-moghadam 等 (2021) 中，规则是一个复杂的数据挖掘问题。然而，产生规则被用于准确高效的自动\
  \ CAD 检测。作者提出了一种`粒子群优化 (PSO)` 算法，用于识别实时、整数和二进制数据类型的 CAD 诊断规则。使用实时和二进制 `PSO` 的组合来诊断\
  \ CAD。特征通过两种方式选择：11 特征选择法和 13 子集选择法。与 13 子集选择方法相比，11 子集选择方法显示出最高的准确率。\n\nJoloudari\
  \ 等 (2020) 使用一种名为`冠状动脉造影`的医学成像技术诊断冠心病，但这种方法价格昂贵且伴有各种副作用。因此，作者提出了一种全面的机器学习方法来选择预后特征以准确诊断\
  \ CAD。作者使用了四个分类模型进行 CAD 诊断：\n\n`SVM`、`CHAID`、`C5.0` 决策树以及 10 折交叉验证随机树。作者得出结论，与其他模型相比，随机树提供了最高的准确率。\n\
  \n## 结论与未来研究\n\n在本文中，我们研究了用于 CAD 分类、检测、预防和诊断方法的各种算法。分类方法是用于诊断患者的方法。在现有文献中，`SVM`、`GSVM`、`DT`\
  \ 等算法被广泛使用。与此相比，`CNN` 和 `LSTM` 等深度学习算法达到了 99.85% 的准确率。现有工作的缺点是图像数量较少。深度神经网络的权重未来需要进一步考虑。\n\
