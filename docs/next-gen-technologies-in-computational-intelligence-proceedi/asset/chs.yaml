  \ Wuyishan, Fujian, China. doi:[10.1109/ITME53901.2021.00114](https://dx.doi.org/10.1109/ITME53901.2021.00114).\n\
  \n\n\n\n\n为了增强股市的安全性和完整性，开发了一套利用 `OCSVM` 结合特征选择和离散化技术的更高效的攻击检测系统。该系统旨在解决现有攻击检测系统的局限性，并更快速地识别和缓解攻击。其最终目标是为股市免受潜在安全威胁提供更好的保护。\n\
  \n本文结构安排如下：第 2 节涵盖了攻击检测的用例，第 3 节介绍了股票交易攻击检测的相关工作，第 4 节说明了当前的股票攻击检测模型，第 5 节提供了所提模型的结果与讨论，第\
  \ 6 节给结论。\n\n## 攻击检测的用例\n\n### 个人投资者\n\n个人投资者可以使用攻击检测系统监控自己的投资并保护自己免受金融欺诈。通过分析市场数据中指示攻击的异常或模式（Zhang\
  \ 等人，2017），投资者可以调整投资策略并避免犯昂贵的错误。\n\n### 对冲基金和资产经理\n\n这些机构依赖准确且实时的市场数据做出投资决策。攻击检测系统可以帮助这些公司识别投资组合面临的潜在威胁（例如市场操纵或内幕交易），并据此调整投资。\n\
  \n## 监管机构\n\n如证券交易委员会（`SEC`）等监管机构负责监控股市非法活动（Hu 等人，2018）并确保市场参与者遵守规则。攻击检测系统可以帮助监管机构识别可能违反证券法的行为、调查可活动并强制合规。\n\
  \n### 交易平台\n\n交易所或电子交易网络等交易平台负责维护公平有序的市场。攻击检测系统可以帮助这些平台识别对市场完整性潜在的威胁（例如算法交易故障或市场操纵），并采取适当行动防止进一步的损害。\n\
  \n#### 金融新闻媒体\n\n金融新闻媒体依赖准确且实时的市场数据来报道股市趋势并为读者提供分析（F. Aslam 和 H.-G. Kang, 2015）。攻击检测系统可以帮助这些媒体识别对市场稳定性的潜在威胁（例如交易量的突然下降或价格的剧烈波动），并向读者提供及时更新。\n\
  \n## 相关工作\n\n网络异常检测算法仅分析未标记数据，以识别流量异常（Casas 等人，2012）。作者通过使用名为 `Flame` 的跟踪修改程序，构建了许多攻击类型来测试该方法论（Wagner\
  \ 等人，2012）。此外，真阳性率和平均准确率不足以识别入侵并保护网络资源的可用性和机密性。还需要评估攻击检测的假阳性率和假阴性率（Almseidin 等人，2017）。为了在没有任何先验知识的情况下识别攻击，使用了单类支持向量机和子空间聚类的\
  \ `SSC-OCSVM` 无监督异常检测系统（Pu 等，2021）。该算法对特征选择的使用成功地加速了测试，尽管会在某种程度上损害准确性（L. Hakim 等人,\
  \ 2019 ）。通过 `Kaggle` 数据集，采用了涉及利用 `随机森林`、`决策树`、`逻辑回归` 等技术的监督学习。为了减少计算时间，可以将无监督学习与特征选择和离散化方法相结合。市场具有高度不可预测性，使得股票走势预测困难（Xu\
  \ and Cohen, 2018）。人工机器学习引起了公众关注（Tavor and Teitler-Regev, 2019）。上述研究通过指出无监督学习模型对于检测未定义的攻击是最有效的，突出了现有攻击检测面临的挑战。\n\
  \n## 所提的攻击检测模型\n\n所提攻击检测模型的各个阶段如图图 1 所示。\n\n![图 1. 攻击活动图](img/fig40_1_B.jpg)\n\n\
  图 1. 攻击活动图\n\n## 初始化\n\n初始化阶段涉及设置必要的硬件软件、安装所需的库或框架并配置系统连接数据源。确保系统经过专门设计以有效处理海量数据也是重要的，因为股市每天产生大量数据。\n\
  \n### 特征选择\n\n特征选择涉及可能受攻击影响的关键市场指标（例如交易量或价格变化）。可以使用不同的技术来选择特征，例如统计分析、领域知识或机器学习算法。特征选择的目标是在减少数据复杂度的同时尽可能获取相关的细节，这可以提高攻击检测系统的准确性和效率。`-square\
  \ test`是一个重要阶段。\n\n## 特征离散化\n\n特征离散化涉及将交易量分为高、中、低类别，或将价格变化分为正、负或中性。可以使用不同的方法进行特征离散化，例如分箱、聚类或决策树。特征离散化的目标是在简化数据的同时保留重要信息，从而更容易检测异常和攻击。\n\
  \n## 单类支持向量机 (OCSVM)\n\n单类 SVM 可能用于识别交易量、价格变化或其他市场指标中的异常模式，这些模式可能指示攻击。单类 SVM 在正常数据上进行训练，并识别与正常模式不同的离群值。它们对于检测未定义的或训练数据有限的攻击非常有用。\n\
  \n\n\n\n\n所提的攻击检测模型使用了 `NSL-KDD` 数据集。通过使用监督机器学习技术，如支持向量机 (`SVM`)、k-近邻 (`KNN`）和随机森林\
  \ (`RF`)，以及我们提出的结合特征选择和特征离散化的 `OCSVM` 方法，获得了如图 2 所示的结果。召回率（Recall）定义为真正性与假阴性的比率。精确率（Precision）是指对真实攻击检测的准确性，且没有误报。准确率的计算是通过总预测数除以准确预测的数量来实现。该模型的\
  \ `Recall`、`Precision` 和 `F1` 分分别为 `98.3`、`99.7` 和 `99.1`。通过特征选择和离散化方法，模型的计算时间从\
  \ `235s` 减少到 `101s`。\n\n![图 2. 攻击检测模型的效率](img/fig40_2_C.jpg)\n\n图 2. 攻击检测模型的效率\n\
  \n## 结论\n\n所提出的用于股票交易应用的无监督机器学习攻击检测系统具有以 `99.1%` 的准确率高效检测未知攻击并缩短计算时间的潜力。它确保了投资者的信心并防止了由于攻击导致的财务损失。该效率通过包含特征选择和特征离散方法实现。未来的研究工作将通过从各种来源获取实时数据，利用机器学习自动检测潜在攻击。\n\
