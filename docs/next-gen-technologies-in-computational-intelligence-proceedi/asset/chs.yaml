  \n## 摘要\n\n数据挖掘是研究大量数据以发现隐藏信息的方法。由于技术的突破，保护个人数据并保持信息的能力日益增长。在数据挖掘过程中，对敏感数据的威胁被称为隐私保护。为了分析目的，保护数据的隐私被称为数据实用性。隐私保护对于电信、金融、书店、探测、销售、在线交易等多个行业至关重要。这些记录应该被检查以预测未来行为。然而，由于隐私原因，数据所有者不愿披露其原始数据。因此，在将其原始数据用于挖掘之前，我们需要出于隐私目的执行各种程序。在挖掘多维记录的同时保护隐私时，最近提出了几种技术。我们将展示一种在挖掘数据时使用新的数据扰动方法，以维护数据的机密性。关键词：KDD、挖掘、隐私保护、隐私保护\n\
  \n# 引言\n\n数据挖掘是通过研究大量数据来发现隐藏思想的过程。为了从数据库或数据仓库中挖掘数据，使用了机器学习和人工智能方法（Lin 等人，2016）。一种名为频繁模式挖掘的数据挖掘技术被用于发现数据库中的相关模式。高实用性项集挖掘是一种创建交易项集的实用性挖掘方法，在现实情况下，它比传统的项集挖掘更实用。数据的可用性被称为实用性。\n\
  \n## 文献综述\n\n### 数据扰动技术\n\n\n\n该方法在将数据传递给数据挖掘之前，对可访问数据进行修改。即使数据通过交换、添加噪声等多种方式进行了修改，所提供的数据质量仍然得以保留。在添加噪声的方法的案例中，数据所有者以随机数的形式添加一些噪声。为了保留原始数据的特征，这些任意数字通常从正态分布中提取，其均值为零且标准差极小。在进行数据挖掘时，数据所有者共享这些带有噪声的数据。数据所有者也了解插入原始数据中的噪声分布范围。数据挖掘可以利用该分布加噪声数据来重建真实数据集的分布。然而，无法通过数据挖掘检索真实数据值。因此，数据挖掘算法可以在不泄露真实数据的情况下提供显著更准确的结果（Aggarwal\
  \ and Yu, 2008）。\n\n![图 1. PPDM 数据隐藏方法](img/fig73_1_B.jpg)\n图 1. PPDM 数据隐藏方法\n\n\
  在数据交换方法的案例中，它保留了数据集中每一个原始值，同时使记录的重标识变得极其困难。当数据被交换时，属性值会在几个记录之间发生变化。相似的属性值交换得更频繁。这种方法的独特特征是所有原始值都保留在数据集中，只是位置发生了改变。随着记录的转移，低阶频率计数得以维持（Sharma\
  \ and Chaudhary, 2013）。下图描述了隐藏数据的多种方法。\n\n## 效用数据挖掘\n\n在过去的 1 年里，人们对高效用模式挖掘的兴趣日益增加（Liu\
  \ et al., 2005）。与其它基于支持度的模式不同，高效用模式挖掘的基础被用于挖掘。评估的是高效用设计的重要性，而非其外观。这是通过考虑粒子的数量和组件价值实现的。目前，使用高效用的模式挖掘算法被归类\
  \ Apriori 技术、基于树的方法、基于效用列表的方法以及混合方法。支付利用模型（Liu and Qu, 2012）常用于在早期 HUPM 算法中保持下闭性条件，这些算法都利用生成与测试过程，并采用类似于\
  \ Apriori 的方法来挖掘 HUPs。该方法使用一个带有效用的列表，例如具有高效用项集的挖掘器（Miner）、带有直接发现的高效用方法（Liu et al.,\
  \ 2012）以及带有快速挖掘的高项集效用（Fournier-Viger et al., 2014）。\n\n高效用模式挖掘器（Krishnamoorthy,\
  \ 2015）性能优于基于树的高效用项集模式挖掘算法、高效用模式挖掘树算法、带增长的效用模式以及带增长+的效用模式，同时也优于类 Apriori 算法。最近，EFIM（Zida\
  \ et al., 2017）被描述为有效挖掘高效用模式的方法。若干研究关注高效用模式挖掘的挖掘效率，而不是上述试图提高挖掘效率的算法。采用替代折扣策略挖掘高效用模式、采用多个最小效用阈值挖掘高效用模式，以及高效用模式的精简集合、判别性高效用模式、相关性效用模式以及高效用模式挖掘的\
  \ top-k 问题，都是从不确定数据库或时间数据库中挖掘高效用模式的技术（Tseng et al., 2016）。已经创建了若干方法来使用时间顺序序列数据发现高度实用的序列模式。关于大型数据的\
  \ HUPM 以及动态效用挖掘许多研究也已提出。你也可以参考效用导向方法挖掘的概述。\n\n## 带隐私保护的效用挖掘\n\n数据挖掘是数据库知识发现的别名，它可能会发现隐藏的信息并显示各种信息之间的关系（Han\
  \ et al., 2004）。它在工作时也会提取某些隐私信息，这些信息不太可能被发现。已经创建了若干隐私保护数据挖掘方法和各种方法来解决隐私问题以应对隐私问题。隐私问题最初由\
  \ Fayyad et al., (1996] 涵盖。他们详细讨论了 KDD 中的隐私问题，并突出了了一些 KDD 应用。Agrawal and Srikant\
  \ (2000）在 2000 年开发了一种构建方法，以正确预测原始数据的分布。\n\n\n\n\n\n广而言之，隐私保护数据挖掘有多种大类，其中以敏感项目集中的项目作为目标项的隐私保护数据挖掘非常普遍。通常情况下，隐私保护数据挖掘同时考虑了副作用和隐藏性影响。试图在不产生后果的情况下隐藏精细对象是不切实际的。找到平衡隐藏性影响和副作用的方法对于获得结果至关重要。Wu\
  \ 等人（2008 年）提出了一种基于分类后创建的模板的隐私保护数据挖掘方法。它扩展了隐私保护数据挖掘的交易和修改操作的范围。Moustakides 等人建议了一种\
  \ `MaxMin`（`[Hong et al., 2013](https://example.org#ch73.xhtml#ref73_30)`）技术来隐藏常见模式。尽管这些技术有效地隐藏了敏感项目目标，但它们没有考虑到敏感模式之间的关联。为了解决这个问题，由\
  \ `[Hong et al., (2013)](https://example.org#ch73.xhtml#ref73_30)` 开发的 `SIF-IDF`\
  \ 方法`[Tseng et al., 2016](https://example.org#ch73.xhtml#ref73_15)` 被随后引入。然后，Lin\
  \ 等人建议了几种技术（`[Kantarcioglu and Clifton, 2004](https://example.org#ch73.xhtml#ref73_32);\
  \ [Dhande et al., 2013](https://example.org#ch73.xhtml#ref73_33)`），在隐藏关键模式的同时考虑了三个副作用。以下是一些隐藏知识的方法。隐私保护技术可以分为模式挖掘、分类、聚类和其他其他技术（`[Bertino\
  \ et al., 2008](https://example.org#ch73.xhtml#ref73_19); [Aggarwal and Yu, 2008](https://example.org#ch73.xhtml#ref73_20)`）。`[Lindell\
  \ and Pinkas (2000)](https://example.org#ch73.xhtml#ref73_21)` 提出了一种基于 `ID3` 的决策树学习技术，用以解决利用私有协议的多方计算问题（`[Lindell,\
  \ 2005)](https://example.org#ch73.xhtml#ref73_22)`）。大多数隐私保护数据挖掘策略侧于数据分散或破坏，忽略了跨维度的链接。`[Aggarwal\
  \ and Yu (2004)](https://example.org#ch73.xhtml#ref73_23)` 提出了一种技术，涉及将原始数据映射到新的匿名数据库，对数据进行压缩和分类，然后使用数据挖掘方法。`[Vaidya\
  \ and Clifton (2004)](https://example.org#ch73.xhtml#ref73_24)` 揭示了隐私保护数据挖掘的复杂性，例如为什么、如何以及何时。`[Verykios\
  \ et al. (2004)](https://example.org#ch73.xhtml#ref73_25)` 提出了隐藏关联规则的三种方法和五种算法。所有策略都依赖于偏移置信度或支持度（或两者）来伪装敏感规则。`[Sun\
  \ and Yu (2005)](https://example.org#ch73.xhtml#ref73_26)` 建议了一种基于边界的频繁项目集隐藏技术，通过计算每个敏感频繁项目集的边界值，来决定隐私保护数据挖掘中需要减少的值。通过递归地将主数据库划分为小的子数据库，`KD-tree`\
  \ 技术（`[Li and Sarkar (2006)](https://example.org#ch73.xhtml#ref73_27)`）根据子组的平均值隐藏敏感项目集。由\
  \ `[Li et al., (2007)](https://example.org#ch73.xhtml#ref73_28)` 提出的冲突优先最大项技术隐藏了敏感模式，因为敏感项目集通常包含多个一个项目。在每个阶段，`MICF`\
  \ 使用了最\n\n## 隐私保护数据挖掘\n\n隐私保护数据挖掘技术已经开发出来，用于从数据集中提取信息，而不泄露数据主体的身份或敏感信息。此外，数据挖掘\n\
  \n![Fig. 2. 隐藏知识的方法](img/fig73_2_B.jpg)\n\n图 2. 隐藏知识的方法\n\n隐私保护数据挖掘允许研究人员在数据集上进行协作（`[Nayak,\
  \ 2011](https://example.org#ch73.xhtml#ref73_34); [Verykios and Goulalas, 2008)](https://example.org#ch73.xhtml#ref73_35)`）。隐私保护数据挖掘的另一种定义是在多方语境下对包含敏感信息的数据库进行数据挖掘（`[Nabar\
  \ et al., 2008)](https://example.org#ch73.xhtml#ref73_36)`）。对于数据挖掘隐私保护，已经提出了基于统计和加密的方法。为了保护隐私，大多数解决方案依赖于原始数据。这指的是数据质量与隐私水平之间的内在权衡。隐私保护数据挖掘技术正在被研究，以便在保持一定隐私水平的同时进行有效的数据挖掘。这些方法有不同的分类。在文献中，数据挖掘输出根据数据生命周期阶段（数据收集、发布、分发分类（`[Yun\
  \ and Kim, 2015)](https://example.org#ch73.xhtml#ref73_37)`）或根据使用的匿名化、扰动、随机化和加密方法（`[Yun\
  \ and Kim, 2015)](https://example.org#ch73.xhtml#ref73_37)`）进行分类。在本文中，隐私保护数据挖掘方法用于研究输入数据和处理数据（输出信息）。\n\
  \n## 频率计数\n\n快速频率计数的主要目的是通过更改每个敏感项目集中每个项目的数量来降低每个敏感项目集的实用值。快速频率计数必须发现事务数据库中最实用的项目，并尽可能地减少信息损失。该过程重复执行，直到所有敏感项目集的实用值低于最低实用阈值（`[Jajna\
  \ and Salim, 2018)](https://example.org#ch73.xhtml#ref73_39)`）。\n\n## 快速树表设计\n\n\
  利用树和表，快速树表设计在返回关联的扰动数据库之前创建扰动数据。敏感项目集通过快速树表设计（`[Gan et al., 2018)](https://example.org#ch73.xhtml#ref73_40)`）进行隐藏，该技术利用两种结构来加速扰动过程。它只需要扫描数据库三次即可完成扰动过程。为了创建头表，快速频率计数首先检查数据库。必须将敏感项目集包含在头表中。之后，它们按计数值降序排列。然后再次扫描数据库，并创建一个快速树表设计。\n\
  \n## 结论\n\n\n\n\n\n在本出版物中，我们对数据扰动技术、效用数据挖掘、带隐私保护的效用挖掘、带隐私保护的数据挖掘、快速扰动的频率计数以及快速扰动的树与表设计进行了完整评估。这项工作提出了\
  \ `Frequency Counting for Fast Perturbation`，一种快速隐私保护技术。为了清洗事务数据库，它利用了选定的敏感项目列表、各种项目表格式以及一种复杂的扰动技术。结果证明，`Frequency\
  \ Counting for the Fast Perturbation` 的运行性能优于 `Utilizing Tree and Table design with\
  \ Rapid Perturbation`，并提供了一种简单且优雅的方法，以满足数据所有者的隐私需求并维护隐私标准。`Frequency Counting for\
  \ the Fast Perturbation` 使用表和多列表结构进行快速扰动。匿名化、数据流挖掘等领域受益于这项工作的贡献。\n\n## 参考文献\n\n\
