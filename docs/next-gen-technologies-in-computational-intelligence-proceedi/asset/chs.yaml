  \n## 摘要\n\n移动安全至关重要，因为它正面临各种数据被窃取和破坏的风险。它涵盖了敏感信息、显性个人身份信息 (PII)、受保护的财产信息、授权开发数据以及公共权力和机构使用的信息结构。因此，为了强调安全漏洞的重要性，我们建模了利用\
  \ `Metasploit` 执行的 Android 攻击。该载荷利用 `msfvenom` 生成，随后在 Metasploit 系统中保存为 `apk` 文件。这将展示之前从目标设备下载的客户端的联系记录内容。\n\
  \n关键词：Android 攻击、Kali Linux、Metasploit 框架、恶意软件、移动安全、`APK` (Android 应用包)\n\n# 引言\n\
  \nAndroid 是一种基于 Linux 的开源操作系统。它现在被用于手机、平板电脑和电视机等各种设备。Android 提供了丰富的应用程序框架，允许您创建创新的应用。Android\
  \ 具有可用性、存储、媒体支持、网页浏览、多任务处理、适应设备、Wi-Fi、屏幕录制等多种功能。因此，许多攻击者向 Android 注入恶意软件，并尝试在用户不知情的情况下访问设备。本文展示了如何通过实现\
  \ `Metasploit` 来导致安全漏洞。使用 `msfvenom` 创建载荷（恶意脚本）并将其保存为 Android 应用。在框架中，使用 `android/reverse_tcp`\
  \ 配合 `port` 和 `lhost` 配置监听器。\n\n## 文献综述\n\n### 1\n使用 AI 算法对恶意软件进行分析变得越来越重要。因此，他们在文中分析了恶意软件的特殊性。为了实现这一点，他们对应用程序的系统调用建模。在实现中，他们发现恶意软件家族包含相似的系统调用。\n\
  \n### 2\nAndroid 手机的普及使其变得更加危险。此外，它提出了一种检测和响应针对 Android 设备的定向隐蔽攻击的方法。通过在特定间隔捕捉核心转储（core\
  \ dumps），他们可以检测任何可能发生的恶意活动。\n\n### 3\n勒索软件一直是人们和合作伙伴的基本威胁。勒索软件是恶意软件的一种，它会阻碍移动框架并防止用户在付款前获取其信息。\n\
  \n### 4\n设备端深度学习在移动应用中正迅速普及。在包括问答和语音识别在内的多个来源中，这几乎是一个强大的领域。深度学习主要可以分为两种不同的方式：云端推理和设备端推导。\n\
  \n### 5\n开发传感器可以用作点击攻击的侧信道。现在的每个手机都配备了运动传感器，因此他们分析了使用这些传感器读取通常可以确定点击了屏幕的哪个部分，并预测手机的\
  \ UI 状态，从而准确获取 PIN 码或其他敏感数据。他们执行这种攻击涉及对传感器数据的调整。\n\n### 6\n他们引入了一种许可选择模型，帮助用户更好地管理来自不同应用程序的权限请求。该模型预计利用用户主要考虑的两个基本因素：便利性和安全风险，并理解了一种改进的批准方案：1)\
  \ 风险评估 2) 价值计算 3) 多目标优化模型。\n\n### 7\n他们提议使用长短期记忆（LSTM，一种表示深度学习模型）直接从源代码中获取特征以进行漏洞预测。他们学习了语法元素并在策略层面捕捉了代码的连续结构，对\
  \ 18 个 Android 应用程序进行了评估。对于他们的跨项目假设，结果表明，使用我们的程序从 Android 应用生成的智能模型可以预测脆弱代码部分，并达到了词袋模型（BoW）或重要性频率关联（IDF）的效果。\n\
  \n\n\n他们通过检查应用谱系，使得漏洞检测在计算上成为一个高昂的环节，这为漏洞的发展提供了一个视角，到目前为止这是此类研究中规模最大的。此外，从应用谱系的角度研究\
  \ Android 漏洞是本综述的核心关注，这使我们能够得出几个最近发现的结论，如下所示：1) 大多数漏洞可能产生于少于三次的更新；2) 部分外部库是大多数漏洞的主要来源。\n\
  \n## 方法与技术\n\n**(Zhao 等人，2021)** 根据一阶马尔可夫模型，实体在序列中给定时间点的状态将取决于该实体在序列前一个位置的状态。monkey\
  \ runner 工具除了运行单元测试套件以及对应用和设备进行功能/框架级测试外，还可以用于各种用途。在 monkey runner 的帮助下，你可以创建一个\
  \ Python 程序，用于下载、启动、接收按键输入并对 Android 应用或测试包的用户界面进行截屏。\n\n**(Jain 等人，2021)** Android\
  \ 已巩固了其在移动操作系统市场中的创新者地位，使这些设备既是丰富的证据源泉，其用户也是网络攻击的重要目标。来自 Android 设备的可测量资源可以通过静态或实际成像来完成。通过将应用数据传输到客户端的\
  \ Google Drive 并使用客户端的 Google 账户功能进行保护，Android 对应用数据进行了加密。\n\n**(Danenas 和 Skersys\
  \ 2022)** 截至 2020 年，Android 移动框架（操作系统）的市场份额已达到 72.9%。此外，Android 市场吸引了许多攻击者，他们利用恶意软件非法访问\
  \ Android 设备和信息。ADASYN（自适应过采样）策略预计通过自适应调整感兴趣少数类别的决策边界来减少学习偏差。他们使用了一个基于 10,153 个\
  \ Android 应用测试创建的数据集，其中包括 500 个恶意（勒索软件）应用和 9653 个良应用。\n\n**Shukla 等人，2022)** 特别提供了一种针对设备内模型破解的黑箱恶意攻击框架。该结构首先使用深度学习模型从移动应用中提取模型，并判断该模型是否被修改。攻击者可以通过识别其预训练模型并将迁移学习方法用于创建对抗图像，从而欺骗目标模型（也称为校准模型），使其误分类为明确指定的类别。\n\
  \n**Soni (2020)** 提出的通过 Android 运动传感器（如陀螺传感器、加速度传感器和磁力传感器）进行的感应攻击，其指纹推演攻击流程如下：1)\
  \ 在手机上点击不同数字时，使用 Android 应用累积传感器数据。2) 从获取的传感器数据中消除不确定因素。\n\n**Shaik 等人，2022)** 提出了一种名为\
  \ Permizer 的程序化同意委员会，以为具有不同用户安全偏好的移动应用实现理想的保护选择。Permizer 是根据不同用户安全偏好自然管理移动应用权限的主要方案。程序化应用权限委员会可以被分为单一视角：1)\
  \ 同意能力规划，他们拥有的哲学将安全偏好分为两类：a) 通过调查探索用户安全心理，以及 b) 通过他们过去的许可设置活动学习用户安全观点。他们阐释了其中的细节，包括三个与\
  \ Permizer 相关的模块，这些模块旨在解决上述三个难题。\n\n**Jadhav 和 Jadhav (2020)** 建议的方法基于 Python 的\
  \ Theano 和 Keras 框架完成的。Theano 为梯度下降方法保留了大量的重要超参数集合，以及条件中损失的个性化划分。Keras 是一个让模型设计更加直观的封装层。1.\
  \ 准备工作：此外，他们使用了典型的学习率 0.02，平滑超参数 alpha = 0.99 和 beta = 1e7，并使用 RMSprop 作为优化器。以随机方式，模型边界在每个大小为\
  \ 50 的短组后都会更新。为了学习编码语言模式，我们利用 |V| = 5,000 个最活跃的标记（tokens）。2. 管理大规模语言以评估假设的概率，他们必须重新访问语言中的所有有效符号。由于语言的规模，这可能极其昂贵。\n\
  \n**Jangra 和 Jangra (2022)** 决定进行关于 Android 应用中漏洞如何发展的大规模研究。他们完全依赖静态漏洞检测工具，并在不同形式的\
  \ Android 应用上报告了结果；同时他们向用户讨论了关于所使用的先进设备产生的假阳性识别的对话部分，1) 我们根据数据集谨慎地在大规模范围内重构 Android\
  \ 应用的版本谱系。\n\n## 讨论\n\n**(Zhao 等人，2021)** 高处理器驱动的手机被用作程序机器人，以跟踪用户每小时的运动。**(Danenas\
  \ 和 Skersys 2022)** 恶意攻击正转向 Android，因为它是开源的且在移动阶段接收率最高。僵尸网络是最经常被忽视的攻击类型。**(Shukla\
  \ 等人，2022)** 相比之下，设备端深度学习允许在保护用户安全的同时进行模型推理。**(Soni (2020)** 运动传感器被用于跟踪用户的按键输入。\n\
  \n## 结论\n\n现在人们认为手机就是一切。每个人都拥有手机，最好是智能手机。手机上的所有内容都可以随时随地访问。这极大地减少了使用电脑处理简单任务的需求。设备及其包含的数据必须受到保护。\n\
