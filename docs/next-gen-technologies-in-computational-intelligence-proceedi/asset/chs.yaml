  \ giridharan@gmail.com, dhivi@gmail.com, mehmed2022@gmail.com, hajitha0978@gmail.com\n\
  \n## 摘要\n高级标准（AES）加密算法至关重要。水印技术在加密领域中至关重要。加密算法的开发和实现非常广泛，AES 在各种加密技术中具有很高的可见性，尽管大多数用户对周围的网络攻击缺乏了解。攻击者在未经授权的情况下窃取信息，而信息在没有任何保护的情况下传输。本文详细讨论了\
  \ AES 算法的优缺点。\n\n关键词：加密、解密、密码学、AES\n\n# 引言\n安全是当前的重中之重。密码学在安全领域至关重要。加密算法的开发和实现非常广泛，AES\
  \ 在硬件和软件领域均有应用以加密数据。密码学分为两个部分：加密和解密。将明文转换为密文的过程被称为加密，将密文转换回明文的过程被称为解密。我们选择密码学的原因是为了提高那些对网络攻击不知情的公众的意识。\n\
  \n## AES 加密\nAES 包括：\n\n1. 密钥扩展\n2. 第一轮密钥加：\n     9、11 或 13 轮：根据密钥大小，数据将经过特定轮数的处理。每轮包含以下四个阶段：\n\
  \    * 字节替换：使用替换表中的相应字节替换每个数据字节。\n    * 行移位：对数据的行进行不同程度的循环移位。\n    * 列混合：使用矩阵乘法改变每个数据列。\n\
  \    * 轮密钥加：使用当前轮密钥更新数据。\n    * 最后一轮：最后一轮不包含列混合，尽管它与早期轮次是相似的。\n\n\n\n\n这些不同的轮数、密钥大小和方法产生了独特且复杂的密钥，这些密钥足以保护资源。`AES`\
  \ 在开发方面也十分灵活，在其算法中生成或增强了不同的种类，使得 `AES` 具有动态性。\n\n## 文献综述\n\nAltigani et al., (2021)提出了一种有效的基于评分的密钥依赖\
  \ `P-AES` 算法，其密钥雪崩比为 0.496，明文雪崩比为 0.504。该方法了所有 NIST 推荐的统计测试套件（STS）标准。该提出的目的是取代 `AES`\
  \ 的静态属性并替换为动态加密。通过操作子字节（sub-bytes）、移位（shifting rows）、混合列（mixing columns）并使其依赖密钥，创建了一种高级加密标准的多态变体。在实现该算法后，实现了多态性且不会影响互操作性。结果是密文可以在\
  \ 128 种不同的密钥下运行。所提 `P-AES` 与标准 `AES` 之间的性能差异忽略不计。\n\nYendamury & Mohankumar (2021)\
  \ 提出了一种在系统级采用逻辑锁技术的 `AES` 深度防御策略。`AES` 上的锁插入到 `AES` 解密算法的子过程中。当输入提供错误密码时，获得的输出为\
  \ 70%。根据密钥大小使用三种解密算法，`AES` 支持 128、192 和 256 位的密钥。输入文本数据大小始终保持在 128 位。在相应的子过程中插入逻辑锁块，例如\
  \ (1) 逆向移位、(2) 反向替换字节、(3) 添加轮密钥和 (4) 反向混合列。对汉明距离（Hamming distance）、Levenshtein 距离（Levenshtein\
  \ distance）和 Jaro 距离的分析表明，输出文本被完全损坏，距离分别大于 80%、80% 和 50%。该技术为暴力破解、逆向工程和密钥敏感化攻击提供了灵活性。\n\
  \nKumar et al., (2022) 针对社交媒体和其他传输模式下的媒体传输提出了更好的保护方案。该所提工作的实现是隐写术与密码学的结合，旨在保护信息不受未经授权的访问。为了保护信息，获得的输出必须具有低均方误差（MSE）和高峰值信噪比（PSNR）值。这些值有助于在媒体文件中更好地隐藏数据，无论其文件格式如何。在建议的工作中，与之前的提案相比，`MSE`\
  \ 和 `PSNR` 值得到了改进。所提工作的 `PSNR` 值为 75.1375，而 `MSE` 值为 0.0019922。而之前所提工作的 `MSE` 和\
  \ `PSNR` 值甚至不如此处所提的工作。\n\nMohammad & Abdullah, (2022) 改进、开发并提出了一种轻量级加密算法（`LWC`），以增加嵌入式系统和限制设备的安全性。`AES`\
  \ 算法的增强通过减少算法的计算能力和提高受限设备的加密性能实现的。在这一保护所有类型数据的过程中，所提的技术是快速且轻量级的。使用数学分数或连续连分进行压缩来处理密文，使其更难破解并在过程中加速数据传输。与\
  \ `AES` 相比，`LWC-AES` 被证明更适合快速加解密。所提算法的计算能力也小于中央处理器（`CPU`）的内存容量。总之，所提算法与高安全性成正比。在各种平台上，`LWC-AES`\
  \ 文本数据类型的代码快速且紧凑，所提算法的编程结果为：`CPU` 空闲占用时间 348.7 ms，内存大小 24 字节，RAM 大小 326 字节，代码大小\
  \ 587 字节，带宽 2.665 Mbps。\n\n在本文中，Reis et al., (2022) 提出了 `IMCRYPTO`，一种用于加速 `AES`\
  \ 的内存计算（`IMC`）织结构。为了在合并子字节和混合列的单硬件架构中执行加解密，本文使用了一种统一结构的独特技术。通过利用多个随机访问存储器（`RAM`）和随机存取/内容寻址存储（`RA/CAM`）数组提供的连续排列和高并行性，结合特殊的编码器，设计了一个模块化的查找表（`LUT`）织结构。在不牺牲空间或功率消耗的情况下，建议的\
  \ `LUT` 织结构提供了高吞吐量的加密和解码。与 `RISC-V` 的集成实现了执行不同操作模式的灵活性。\n\nChung et al., (2022)\
  \ 在此处提出的 Grover 算法旨在辅助 `S-box`（替换盒）实现 `AES`。通过使用替换方法，`S-box` 替换过程将来自 `XOR` 操作的 48\
  \ 位输入（包含压缩密钥和扩展 `RPT`）转换为 32 位输出。与其他方法相比，该小组提出的提出的解决方案使用了最少的量子比特，大大降低了其 T 深度。使用了\
  \ 8 个 `S-boxes` 来获得输出，其中 `S-box` 的值使用公式 `GF(2⁸)=GF(2)[x]/(x⁸+x⁴+x³+x+1)` 计算。当预言机向解决方案状态添加负相位时，Grover\
  \ 演过程会解决它。更准确地说，给定计算基础中的每个状态，该预言机中与指示项目对应的项将具有负相位。它将是一个对角矩阵。\n\nBedoui et al., (2022)\
  \ 提出了一种针对 `AES` 算法的高效故障检测方法。该方法的建议不取决于 `S-Box` 和逆 S-box 如何构建。`AES` 轮设计由三部分组成，之间插入两个流水线寄存器以增加故障覆盖率。所提方法设计用于不同的\
  \ AES 大小，包括 `AES-128`、`AES-192` 和 `AES-256`。通过 `VHDL` 中的故障注入仿真测试了该方法的有效性以验证其能力。开发的方法可以发现\
  \ 99.339% 的随机引入错误。本文的主要目的是提供一种可靠、强大且能够抵抗故障注入威胁的 `AES` 实现。\n\nKolate & Joshi (2021)\
  \ 提出基于 DNA 的安全技术作为载体。通过结合基于 DNA 和加密 `AES` 的优势，新的数据安全方法可以被实施。这提供了多层保护。DNA 密码学被视为一种高效加密技术，证实了通信的不可漏洞。DNA\
  \ 密码学具有优势且进展迅速，利用四种 DNA 碱基（`A`、`T`、`G` 和 `C`）加密通信并提高并行性和存储容量方面的性能。\n\nJang et al.,\
  \ (2022) 提出了一种量子计算分析，增强了密钥密码对强量子对手的抵抗力。这种密钥恢复攻击在三种不同的 `AES` 变体（128、192 和 256）上应用了\
  \ Grover 算法量子密钥搜索。结果是，它在各种指标上展示了实现池的改进并降低了 `AES` 变体的量子成本。\n\n\n\n\n\n高级加密算法是加密算法的一种，用于提高系统数据的安全性并使其免受未经授权的访问。本研究提出了一种旨在结合高吞吐量与低功耗的算法。密钥由\
  \ `MATLAB`（一种用于分析和设计系统的基于矩阵的编程语言）生成，平衡算法使用 `Xilinx SysGen` 设计，这是一种 `Simulink` 扩展，能够通过图形化块级编程实现\
  \ `FPGA` 设计的架构级。因此，在 1102.536 MHz 的最大工作频率下，该系统仅使用了 121 个切片寄存器（slice registers）。此外，所建议的系统吞吐量达到了\
  \ 14.1125 GB/s。\n\n## 讨论\n\nAltigani 等人 (2021) 揭示了 P-AES 算法的细节。通过重新排列行和列并创建尽可能多的不同组合，我们学习了算法的工作原理。加密文本有\
  \ 128 种不同的使用方式。\n\nYendamury & Mohankumar (2021) 提供了关于使用系统级逻辑锁定技术的 AES 深度防御（Defense\
  \ in Depth）方法的信息。当输入错误密码时，实现了 70% 的输出率。AES 是一种流行的加密标准，允许使用 128、192 和 256 位的密钥长度。为了解密用\
  \ AES 加密的数据，根据密钥长度使用不同的技术。具体而言，采用了三种不同的解密方法，每种都针对特定的密钥长度进行了定制。\n\nKumar 等人 (2022)\
  \ 提供了一个隐形术和加密如何帮助媒体文件在两端传输时不被拦截的示例。此外，结果优于早的研究。\n\n为了提高嵌入式系统和受限设备的安全性，Mohammad &\
  \ Abdullah (2022) 进行了尝试并成功创建了轻量级加密算法（LWC）。通过降低该方法的计算复杂度并增强测试设备的加密功能，AES 算法得到了改进。\n\
  \nIMCRYPTO 被提出 (Reis 等人，2022) 作为一种加速 AES 的手段。IMCRYPTO 技术采用统一结构，在合并了子字节（sub-bytes）和混列（mix-column）操作的单硬件架构中执行加密和解密。\n\
  \n为了使用 S-box 实现 AES，(Chung 等人，2022) 本文设计了 Grover 方法（替换盒）。压缩密钥和扩展的 RPT 包含在来自 `XOR`\
  \ 操作的 48 位输入中，该输入通过 `S-box` 替换技术转换为 32 位输出。\n\n对于 AES 算法，(Bedoui 等人，2022) 它们开发了一种缺陷检测技术。所建议的方法可以被修改以用于其他\
  \ AES 尺寸（AES-128、192 和 256）。为了验证所建议的问题识别方法，在 `VHDL` 语言中生成了故障注入仿真。\n\n作为数据载体的基于 DNA\
  \ 的安全方法：基于 DNA 和加密 AES 的优点可以用来创建新的数据安全策略 (Kolate & Joshi, 2021)。Jang 等人，2022) 这种量子分析增强了\
  \ AES 变体（128、192 和 256）的抵抗能力。Mane & Mulani (2018)) 这种在 `FPGA` 上实现的 AES 能够保护数据免受未经授权的访问。\n\
  \n## 结论\n\n数据泄露和窃取是主要的威胁，基于 DNA 的加密和 AES 混合方法在许多领域被广泛采用以提高安全性。\n\n## 参考文献\n\n1.\
