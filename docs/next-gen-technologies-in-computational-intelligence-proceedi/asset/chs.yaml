  \ - |\n| 设备运行时间 | - |\n\n根据接收的消息通过控制算法控制电器的启动时间。在控制算法中，可以传输启动指令，或者如果能量不足，则在延迟后启动电器。\n\
  \n## 提出的路由协议\n\n### 基于马群优化的灵感\n\n马群的层级组织是马优化算法的主要灵感来源。马已经适应了在群中中共存。稳定的层级结构（或“等级制度”）对于降低攻击性和增强社会凝聚力至关重要，就像在大群中生活的许多动物一样。这通常是一个线性系统，但不一定如此\
  \ [9]。马 A 可能优于马 B，马 B 可能优于马 C，但在非线性层级中，马 C 可能优于马 A。马在群中时按层级行为；重要的动物先吃先喝。低地位的动物最后吃，它们可能得不到足够的食物，如果粮食不多，高地位的马可能会阻止低地位马食用。\n\
