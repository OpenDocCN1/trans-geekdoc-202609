  \n## 摘要\n\n在过去的几十年里，推荐系统广泛应用于位置发现、在线零售、房地产、医疗保健等领域。尽管现有方法提供了令人满意的性能，但相关研究仍在进行。因此，在本文中，我们提出了一种新的位置推荐模型。通常，位置推荐系统根据用户的偏好提供建议，以寻找合适的地点。用户可能会根据距离道路、商场和其他特征等元素，倾向于居住在特定的社区。例如，以\
  \ Google 地图为例，它仅提供位置的地图视图和路线，但无法显示满足所有用户偏好的特定区域或地区。为了填补这一空白，我们开发了一种模型，通过地理位置绘制，结合个性化用户以及上下文感知推荐（如气候和天气状况）来推荐位置。本文详细介绍了所提系统的开发方法论，包括方法途径、探索性数据分析（EDA）的使用以及亲性传播算法（Affinity\
  \ Propagation Algorithm）的实现。\n\n关键词：推荐系统、探索性数据分析、亲性传播、地理位置绘制、上下文感知推荐\n\n## 1 引言\n\
  \n位置推荐系统（Pan et al., 2022）为用户提供各种用途的最合适位置的建议。这些系统使用各种算法和技术，如数据挖掘、深度学习（Dellal-Hedjazi\
  \ & Alimazighi, 2020）、机器学习（Fanca et al., 2020）以及地理信息系统（GIS）（Xiaofang et al., 2007），根据用户偏好和历史数据推荐位置。使用推荐系统寻找正确的地点是一项具有挑战性的任务。位置推荐系统可以用于旅行、美食、娱乐等许多领域。它们还可以集成到地图、搜索引擎和电子商务平台等其他应用程序中，以提供更相关的结果。\n\
  \n我们开发的模型目的是为用户提供更具个性化且高效的体验，从而节省他们寻找合适区域的时间和精力。目前的区域推荐系统通常基于评分和评论，这些内容可能并不不可靠且缺乏个性化。此外，这些系统没有考虑可能影响用户偏好的上下文因素（如天气和气候条件）。因此，需要一种更精细的方法，利用数据分析和机器学习技术来提供准确且个性化的建议。\n\
  \n所提模型旨在利用探索性数据分析（EDA）技术（Lee & Lee, 2022）和亲性传播算法（Tang et al., 2022）为用户提供更具个性化的位置。EDA\
  \ 的使用有助于深入了解数据并识别模式和关系。而亲性传播将有助于聚类相似的数据，并根据最合适的簇提供最终建议。用于生成建议的方法和策略是所提系统与现有系统区别开来的关键。目前的推荐模型频繁依赖于\
  \ K-means（Saini et al., 2022）等简单技术，但它们并不总是针对需求进行定制。\n\n## 2 文献综述\n\n地理位置数据是一个快速增长的研究领域，改变了我们理解周围世界的方式。随着支持全球定位系统（GPS）设备的普及以及基于位置服务的无处不在，我们每天产生大量的地理位置数据。然而，分析和理解这些数据面临着一系列独特的挑战。对于寻求增强客户满意度和忠诚度的企业来说，开发有效的推荐系统已变得越来越重要。以下文献对早先提出的各种推荐系统进行了详细讨论。\n\
  \nSumithra et al., (2022) 提出了一种使用 K-Means 聚类寻找住宿的方法，该方法根据个人对设施的选择、负担能力以及距离地点的远近对旅行者进行分类。\n\
  \nKishan et al., (2022) 提出了一种推荐模型，通过根据人的选择对住宿进行分类，以识别个人在目的地最合适的住宿。它涉及应用聚合层次聚类来对人口和空间信息进行分割，并将结果应用于从\
  \ REST API 获取的地理位置数据上。\n\nPandya et al., (2016) 涉及一种新型混合方法的开发，结合聚类和关联规则挖掘以克服数据稀疏和冷启动问题。他们的方法根据用户相似性对评分矩阵进行聚类，并对从聚类数据生成的布尔数据应用聚类算法，以高效生成规则。\n\
  \nXu et al., (2022) 参与了对小批量 AP 聚类算法最新的研究，重点关注所使用的主要方法、方法的优缺点以及在各个领域的应用。\n\nMa et\
  \ al., (2020) 基于 LBSN 方法论实现了一个 POI 行为变化模型。整合了各种信息：客户签到数据、属性数据、POI 的空间影响以及对象的邻近性。使用\
  \ Foursquare 数据库进行研究。研究表明，分解法比其他同时方法具有更高的准确性。\n\nLi et al., (2020) 提出了一种名为 DDAP\
  \ 的两阶段聚类技术，以增强亲性传播聚类和密度曲线的有效性和功能。建议的方法使用每个簇中心的两个变量选择有限数量的可能样本，以最小化相似性量的维度，然后在部分相似性矩阵上执行消息传递。\n\
  \nBandi et al., (2020) 了一种了一种动态文本大数据分类方法，其灵感来自增强学习和分割方法。该方法可以通过极少的人工任务为机器学习准备数据，并提供极佳见解。\n\
  \n\n\n\nPark et al., (2020) 创建了一种技术，利用自定义形式的`affinity propagation clustering algorithm`（传播聚类算法）对\
  \ `RRHs` 进行分组，以增强密集微型系统中无线远程射头的组合分布。\n\nPanwar et al., (2021) 建议使用机器学习方法在电子商务平台框架内开发利用大数据的推荐引擎，并为数据探索主题提供有的见解。该研究贡献首先概述了直接用于情感分类（通常称为意见挖掘）的方法和技术。\n\
  \nBanerjee & Chowdhury (2021) 参与开发了一种方法，用于研究基于用户的分析中评论与文本及非文本参数之间的关系。他们分析了来自 `Zomato`\
  \ 和 `Yelp` 的两个不同数据集，这些数据集具有地理差异和多样化的用户评论。作者应用了特征工程以及监督和集成机器学习算法，如 `Linear regression`、`Logistic\
  \ regression`、`XGBoost` 和 `Gradient Boosting algo` 来构建预测模型。\n\n在上述论文中，作者们已经在聚类、分类、数据分析、过滤等许多技术上做了工作。对于位置推荐，他们使用了分层次聚类模型。在本文中，我们正在使用\
  \ `affinity propagation algorithm` 来克服非球形聚类准确率低的问题。\n\n## 提出的方法\n\n该提提系统旨在利用 `Exploratory\
  \ Data Analysis`（探索性数据分析）技术和 `Affinity Propagation algorithm` 为用户提供更具个性化的位置。系统将考虑用户偏好、天气和气候条件等各种因素，以提供准确且相关的建议。`Affinity\
  \ propagation algorithm` 用于根据选择的气候条件、犯罪率、设施、预算以及与地点的距离等选择来发现理想区域，而 `EDA` 用于数据可视化。\n\
  \n`Affinity Propagation (AP)` 算法是一种聚类算法，它使用消息传递方法来识别代表类的示例或原型。该算法基于数据点之间的“相似性”和“责任”概念，这些概念由矩阵表示。以下是\
  \ `AP` 算法的方程。相似性矩阵 `S (u ,v)` 表示点 `u` 作为点 `v` 的示例或原型的相似性或偏好。它是基于数据点对之间的相似性计算的。方程如等式\
  \ (1) 所示。\n\n(1)\n\n```\nS(*u*, *v*) =  − *d(*u*, *v*)\n```\n\n其中 `d (u,v)` 是点 `u`\
  \ 和 `v` 之间的欧几距离。负号用于将距离量转换为相似性量。责任矩阵 `R(u ,v)` 表示点 `u` 分配作为示例或原型的累积责任。\n\n(2)\n\n\
  ```\nR(*u*, *v*) = *S(*u*, *v*) − max ��\\[*a(*u*, *k*) + *S(*u*, *k*)\\]f**o**r*\
  \ ��for* *a**l**l**k*!\n```\n\n### 第 1 步：从 Kaggle 收集数据集\n\n第一步是从 `Kaggle` 获取数据集，`Kaggle`\
  \ 是一个数据科学家和机器学习从业者访问和共享数据集的在线平台。收集了如空气质量指数、温度波动、公寓价格、酒店和餐厅等各种数据集，作为用户的偏好样本。\n\n\
  ### 第 2 步：使用 Pandas 和 matplod 库清洗数据并可视化数据\n\n一旦收集了数据集，就需要对其进行清洗并做好分析准备。这一步涉及删除任何重复项、纠正错误并统一格式化数据。清洗数据后，重要的是进行视觉化探索，以获得见解并识别任何模式或趋势。箱线图是一种实用的可视化工具，显示数据集值的分布，包括中位数、四分位数和离群值。\n\
  \n### 第 3 步：矩阵构建\n\n矩阵包含每个社区或区域的行，以及犯罪率、学校质量、生活成本等各种特征的列。矩阵中的每个单元格将包含对应社区和特征的值。\n\
  \n### 第 4 步：采用影响传播聚类算法对位置进行聚类\n\n下一步是使用 `scikit-learn library` 通过 `Affinity propagation\
  \ clustering algorithm` 根据数据的相似性自动确定聚类的数量及其质质心。\n\n### 第 5 步：获取地理位置数据点\n\n下一步是获取数据集中区域的地理位置数据点和坐标。这通常使用\
  \ `Foursquare API` 完成，该平台是一个位置数据平台，提供对兴趣点数据库和用户生成内容的访问权限。\n\n### 第 6 步：使用 Folium\
  \ 工具在地理位置地图上显示结果位置\n\n最后，我们可以使用 `Folium`（一个用于创建交互式地图的 Python 库）在地理位置地图上显示聚类位置。这一步允许我们可视化不同的聚类并探索它们之间的关系。\n\
  \n## 结果与讨论\n\n我们已经收集并训练了如金奈、海得拉巴和班加罗尔等各种样本城市的数据集。因此，根据气候条件等用户偏好，它将自动为用户推荐区域并在地图上显示结果。\n\
  \n\n\n\n\n上述 图 2 是通过将每个数据点的值对齐到最近的聚类实现的。最终输出将是根据用户偏好以及与其他用户的相似性生成的推荐位置列表。系统将使用探索性数据分析来识别数据中的模式和关系，例如每个区域最受欢迎的场所类型，或者倾向于访问某些区域的用户特征。\n\
  \n![图 2. 显示在地图上的最终输出](img/fig42_2_C.jpg)\n\n图 2. 显示在地图上的最终输出\n\n然后通过使用吸引传播算法，模型将根据其特征将相似的区域聚在一起，并在重新分配观测值到最近的聚类后，推荐与目标最相似的区域。如果用户没有正确清理数据，结果可能不准确。如果数据清洗不当，可能会导致结果不准确和结论错误。数据清洗涉及各种技术，如去重、处理缺失值、处理异常值以及纠正不一致之处。\n\
  \n### 剔除异常值\n\n首先，为数据集创建一个箱线图。然后识别任何落在箱线图须线之外的点。这些点被视为异常值。接着从数据集中删除这些异常值。之后，重新创建箱线图以确认异常值已删除。这里是所选数据集的示例图。\n\
  \n上述 图 3 代表了使用箱线图从数据剔除异常值。在这里，我选择了一个示例数据集。它涉及分析数据集以识别与其他数据点异常遥远的数据点，然后将它们从数据集中删除。\n\
  \n![图 3. 从数据集中剔除异常值](img/fig42_3_C.jpg)\n\n图 3. 从数据集剔除异常值\n\n### 聚类数量自动分配。\n\n用户不需要指定聚类数量。在吸引传播聚类算法中，聚类数量根据输入数据和算法内部计算自动分配。\n\
  \n### 将实体分配到每个聚类。\n\n聚类过程涉及将变量分配给每个聚类。简单的方法是随机对事物进行聚类，但这种方法并不总是能产生实用的聚类。根据数据的性质和研究目标，将选择将事物分组为聚类的最佳方法。\n\
  \n图 4 是在根据所选城市的偏好为每个数据点分配聚类的过程中实现的。之后，每个观测值都应分配到最近的聚类中心。我们可以观察到将对象附加到聚类后，几个点靠近该位置。最后，在重新分配观测值到最近的聚类后，结果将显示在地理位置地图上。\n\
  \n![图 4. 分配到每个聚类的属性](img/fig42_4_C.jpg)\n\n图 4. 分配到每个聚类的属性\n\n## 结论\n\n总之，所提出的利用探索性数据分析和吸引传播聚类算法的区域推荐系统在识别基于特征和属性的相似位置方面显示了良好的前景。通过使用从各种来源收集的数据并应用数据清洗技术，系统能够有效地对位置进行聚类，并根据用户偏好提供准确的推荐。\n\
  \n目前有多种不同算法和技术的区域推荐系统。然而，它们大多数依赖于协同过滤或基于内容的过滤来向用户推荐位置。这些系统在准确性、扩展性和数据稀疏性方面存在局限性。此外，它们没有考虑用户的位置，这是推荐位置的重要因素。所提出的系统通过使用探索性数据分析和吸引传播聚类算法旨在克服现有区域推荐系统的局限性。\n\
  \n地理数据和映射工具的使用有助于结果可视化并让用户更容易理解。而言而言，该系统潜力为寻找相似特征位置的用户提供个性化且相关的推荐，提高他们的整体体验和满意度。可以进行进一步的研究开发以提高系统的准确性和扩展性，并整合额外的功能和数据源。\n\
