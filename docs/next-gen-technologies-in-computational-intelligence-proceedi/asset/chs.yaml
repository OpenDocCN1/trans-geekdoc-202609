  \n\n\n\n根据研究结果，Faster R-CNN 提出了一种新颖的锚（anchoring）方法。在滑动窗口的每个位置，图 2 提供了一个图形说明，展示了矩形框回归层如何生成\
  \ `4*k` 输出，这些输出称为 `K` 个框的坐标值。矩形框的分类层包含共 `2*k` 个可用的输出。\n\n![Fig. 2. 区域建议网络](img/fig78_2_B.jpg)\n\
