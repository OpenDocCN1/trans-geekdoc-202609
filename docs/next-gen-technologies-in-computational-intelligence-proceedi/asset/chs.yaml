  \ (2019). 机器学习应用于阿尔茨海默病分类. 拉丁美洲生物医学会议, 斯普林格, 瑞士。\n30. Shaikh, Tawseef, and Rashid\
  \ Ali (2019). 基于 MRI 的阿尔茨海默病自动萎缩评估. 磁共振成像, 6(4), 167-173。\n\n# 使用深度学习的湿皮表面检测\n\n\
  Vinith Kumar^(31))印度斯坦理工学院计算机科学系，印度钦奈\n\nDOI: [10.1201/9781034052-39](https://dx.doi.org/10.1201/9781034052-39)\n\
  \n## 摘要\n\n由于缺陷的多样性以及公开数据的缺乏，自动检测是一项具有挑战性的工作。本文提出的卷积神经网络识别成品中的缺陷。自动化系统可以提高缺陷检测的效率和准确性，并降低成本。本研究使用了湿皮公开数据集进行迁移学习。\n\
  \n关键词：`卷积神经网络`、`数据增强`、`图像处理`、`湿皮`\n\n# 引言\n\n皮革行业一直在寻找在降低成本的同时提高生产力的方法。皮革缺陷的检测是实现这一目标的关键步骤。人工检查过程耗时且容易出错会导致瓶颈。\n\
  \n## 皮革加工的阶段\n\n1. **预处理**：在此阶段对原料皮料进行准备。\n2. **鞣**：在鞣过程中对皮料进行鞣剂处理。各种鞣剂包括矿物盐。\n\
  3. **中和**：鞣后用酸处理，以使 pH 值恢复到中性并去除多余的鞣剂。\n4. **染色**：皮革可以染成所需的颜色。\n5. **后处理**：之后，对皮革进行处理以获得所需的纹理。打磨、压花、抛光。\n\
  \n## 湿皮阶段\n\n\n\n\n\n经过鞣制但尚未干燥的皮革被称为“蓝皮”（blue wet）。由于鞣制过程，此时皮革仍处于湿润并呈现蓝色。在鞣制过程中，会在皮料或皮肤中加入单宁以对其进行稳定和保护。皮革加工过程中的“蓝皮”阶段至关重要，因为在这个阶段皮革会被拉伸和成型，以获得所需的厚度、纹理和尺寸。\n\
  \n本文的结构如下：第 2 节讨论了深度学习的各种用例，第 3 节涵盖了深度学习在皮革缺陷检测领域的相关工作。第 4 节说明了现有的皮革检测方法。第 4 节介绍了基于深度学习的皮革检测的观点，第\
  \ 5 节给结论。\n\n## 深度学习的用例\n\n深度学习是机器学习的一个分支，使用多层神经网络来解决复杂问题。它已成为许多领域的关键工具，包括：\n\n\
  - `图像和视频识别`：深度学习模型可以以高精度识别图像和视频中的物体、人物和活动。\n- `自然语言处理`：深度学习被用于理解和生成人类语言。\n- `机器人`：可以通过深度学习教机器人执行复杂任务，如抓取物体、导航环境以及与人类交互。\n\
  - `医疗健康`：分析医学图像、诊断疾病以及创建个性化治疗方案都是深度学习的应用。\n\n## 相关工作\n\n在现有的皮革检测系统中，为了处理由电网不稳定引起的电压波动和由传输辊损坏引起的速度变化，李洪伟的“互联网+”皮革喷射混凝土机系统利用了物联网的`CMT-SVR-200`技术，该技术具有抗误差传输、双闭环调速等特点（Jiyi\
  \ et at., 2022）。喷射混凝土机可以精确喷涂皮革，并在皮革通过光电检测箱的同时对其进行测量。该系统使客户能够更轻松地检验收货物。\n\n随着科学和创新的快速发展，传统业务中准备能力的劣势逐渐显现。由于该行业增长缓慢，大学培养人才的工作面临着新的挑战，这经常导致缺乏职业认同感（Aslam\
  \ et al., 2021）。本文探讨了皮革行业对信息技术的影响以及皮革专业人士高等教育的方向。随着皮革行业自动化的扩张，自动化的皮革缺陷分类受到了广泛关注。近年来，人们提出了许多改进自动缺陷分类流程的新颖策略（Mantari\
  \ et at., 2022）。本研究的主要目标是创建皮革缺陷检测的方法，并为模型的识别和选择制定建议。\n\n`CNC`机器控制为解决劳动力市场相关的任务提供了一种新方法。为了给手工切割皮革行业提供技术解决方案、最大化合作人员的安全并缩短生产时间，本研究展示了一种`CNC`机器的无限螺旋电机控制系统（Chen\
  \ et at., 2021）。该项目通过模拟`MATLAB`软件和多种参数确定了`CNC`机器的切割速度和时长与部件尺寸及形状的关系。\n\n皮革分类的工艺之一是对来自不同动物的筒皮进行分类。该程序通常由一组专家手动完成，耗费大量时间（Vasagam\
  \ et al., 2022）。因此，作者创建了`INT_LEA_IMG_CLRI_UNOM`，这是一个全新的数据集，由来自训练集和测试集的 609 张图像组成。使用`LAPLACIAN`、`MEDIAN`、`SOBEL`、`ROBERTS`、`SCHARR`、`PREWITT`和`GAUSSIAN`预处理滤波器以及对比度限制适应直方图均衡化（`CLARE`）来改进图像。通过采用准确率为\
  \ 79%的朴叶斯分类器，显著验证了所提方法的分类准确性。\n\n## 现有的皮革缺陷检测模型\n\n在过去的十年里，开发了许多基于机器视觉的表面缺陷检测方法，包括皮革表面缺陷。这些技术主要分为两类：基于手工特征或浅层学习技术的机器学习，以及传统的图像处理。在基于机器学习的方法中，通常将特征提取和模式分类相结合。缺陷检测特征向量的设计基于对输入图像特征的检查。视觉检查是感性的，受光照条件和个人熟练程度等变量的影响。图像处理算法可以有效检测特定类型的缺陷，但可能难以应对光照或色彩的变化。\n\
  \n基于深度学习的卷积神经网络（CNNs）在准确识别各种皮革缺陷方面显示出良好的前景。随着训练数据的增加，这些方法可以随着时间的推移变得更好，学习模式并分析大量数据。\n\
  \n## 基于 CNN 的皮革缺陷检测方法\n\n皮革缺陷类似于皮革表面的缺陷。大多数皮革缺陷是由机器或工艺问题引起的。当皮革有缺陷时，纺品的销售和使用会大大减少。为了继续扩张并保持竞争力，纺织制造企业需要升级技术设备。使用锐化、中值、平滑、二值掩码、RGB\
  \ 提取、直方图和 Sobel 算子算法将图像转换为灰度。\n\n卷积神经网络（CNN）是一种神经网络，主要用于处理图像、分类、分割和处理其他自相关数据。它有一个或多个卷积层。从简单的`CNN`开始，具有一个约\
  \ 10 个内核的隐藏层和一个最大池化层，用于寻找损坏组件并通过微控制器传输并存储在`IOT`网页中。物联网（IoT）通过实时监控温度、湿度压力等环境条件，对皮革缺陷检测具有重要意义。\n\
  \n### 皮革检测的工作原理\n\n1. 利用物联网进行检测的第一步是在皮革加工线上安装传感器，监测温度、湿度和压力等各种参数。为了确保准确评估和预防缺陷所需的理想环境条件，皮革缺陷检测需要采集压力、湿度温度。\n\
  2. 传感器数据可以被收集并传输到中央服务器或云平台进行处理。\n3. 为了实现实时缺陷检测，可以将训练好的模型部署在摄像头或传感器等边缘设备上。\n4. 边缘设备可以捕捉皮革图像，然后将其发送到中央服务器进行分析。\n\
  5. 中央服务器可以使用卷积神经网络（CNN）和其他深度学习方法来检查图像并发现任何潜在缺陷。\n6. 在将识别出的缺陷分为不同的类别后，可以生成报告以指导操作人员采取相应行动。\n\
  \n\n\n\n\n## 优化与维护\n\n7. 为了优化生产流程并最大限度地减少浪费，系统可以与其他系统（包括生产管理系统）。\n\n8. 通过利用传感器收集的数据，皮革加工线中使用的设备可以受益于预测性维护。\n\
  \n![图 1. 使用 CNN 提出的皮料缺陷检测流程](img/fig39_1_B.jpg)\n图 1. 使用 CNN 提出的皮料缺陷检测流程\n\n![图\
  \ 2. 皮革中的无缺陷区域](img/fig39_2_B.jpg)\n图 2. 皮革中的无缺陷区域\n\n![图 3. 皮革中的缺陷区域](img/fig39_3_B.jpg)\n\
  图 3. 皮革中的缺陷区域\n\n## 结论\n\n由于皮革缺陷的多样性以及缺乏用于算法基准测试的标注数据，自动化视觉检测面临巨大挑战。迁移学习和数据增强技术可以提高有限数据上的性能，且\
  \ `CNNs` 可以从原始数据中自动学习特征。所提出的基于 `CNN` 的皮革缺陷检测系统使过程变得更加简单，因为缺陷结果通过 `IoT` 模块直接传输给管理员。这种用于\
  \ `DL` 寻找蓝湿皮检测中缺陷的基于 `CNN` 的缺陷检测方法产生的准确率高达 `93.4%`。数据集包含近 `1000` 张图像，并进行了 6 次实验以检查数据集中的针孔、皮革折叠等的准确性。实验结果表明，与其他检测完全加工后皮革缺陷的方法相比，在早期的蓝湿阶段检测皮革缺陷可以节省加工成本并为制造商带来利润。未来的工作将通过深度学习方法检测带有毛的皮革更早阶段的缺陷进行扩展。\n\
