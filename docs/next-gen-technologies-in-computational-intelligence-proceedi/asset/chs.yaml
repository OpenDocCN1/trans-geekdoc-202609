  \ 3. 选取样本百分比](img/fig6_3_C.jpg)\n\n\n\n\n\n# 图 3. 样本百分比\n\n表 2 显示了加密勒索软件家族的六个样本，它们构成了勒索软件分析链比例以及其他评分。如果链分接近\
