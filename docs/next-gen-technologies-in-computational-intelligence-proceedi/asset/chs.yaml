  \ 会议。\n\n## 摘要\n\n自大数据时代以来，数据量已从万亿字节迅速增长到 PB 级。在云存储中，存在供应商锁定和数据泄露等问题。然而，云服务响应迅速、高效，且不再需要在高端硬件或昂贵的软件上投入大量资金。在云存储中，高可用性是一个核心需求。本文提出了一种基于`多目标鱼类优化`\
  \ (`MSFOA`) 的多云存储来解决数据隐私问题。最后，大量的测试证明了所提 `MSFOA` 的性能。\n\n**关键词**：多云、纠删码、清理、恢复\n\n\
  # 引言\n\n由于云服务具有高效益，远程存储的使用变得越来越流行。在商业企业和政府机构寻求更多解决方案的时代，人们对云存储的兴趣日益增加。\n\n在网络语境下，数据安全至关重要。云数据包含一系列安全关注点，包括访问和身份管理、物理安全、加密管理以及用户访问。如今，加密被用于……这些算法有能力将文本转换为创新的结构。\n\
  \n数据处理和数据存储的安全组件构成了云中的隐私维护。在数据存储方面，当这些数据存储在数据中心时，保证用户隐私方面存在问题。在虚拟平台运行期间维护用户机密性的挑战是数据处理的一部分。未经授权的用户无法读取这种加密形式的输入，因为经过了加密。同样地，通过使用不同的密钥，清理和恢复过程构成了数据保护范式的两个关键阶段。在这里，一种名为\
  \ `MSFOA` 的独特元启发式算法根据建议的清理方法执行最优密钥创建。为了更好的隐私数据保护，了一种清理和恢复模型，它可以发现目标参数，如 `HR`（隐藏失败率）、`PR`（信息保留率）、`FR`（错误规则生成率）、`DM`（修改程度）、`CR`（压缩率）、篡改以及\
  \ `LPF`（低通滤波）。在清理和恢复过程中，开发了一种名为 `遗传算法` 结合 `乌鸦搜索算法` (`GA- CSA`) 的理想密钥。此外，与接收端连接的授权者成功恢复了敏感数据。\n\
  \n或者，身份验证过程是无效的。对于用户而言，云存储可以提供几乎无限的存储空间。许多企业、组织、政府机构表现出将数据放入云端的趋势。\n\n\n\n\n然而，使用单一\
  \ `CSP` 会增加供应商锁定和单点故障的风险 (Abu-Libdeh et al., 2010; Chen et al., 2014)。因此，最近的工作使用了多云存储，它依赖于许多\
  \ `CSPs` 来将数据保持在特定的冗余水平 (Abu-Libdeh et al., 2010; Chen et al., 2014; Mu et al.,\
  \ 2012)。它通过防止供应商锁定和增强容错能力，可以提供更好的服务质量。任何需要维护大量数据的应用程序，例如文档归档、电子存储中的健康记录或数据备份，都能从这些特性中极大获益。\n\
  \n纠删码（Pless, 2011) 与数据存储的全副本复制相比，它可以显著降低成本 (Wu et al., 2013)，在这些情况下通常被用于进一步改进。它还可以最小化需要在网络中传输的整个数据量。纠删码中的每个数据项被分成\
  \ `k` 个等大块，然后利用这些类型的块来创建编码块（总共 `n` 个块，`n > k`），其中 `(n-k)` 为数据块。这被称为纠删码参数 `(n, k)`。这\
  \ `n` 块数据将被传输到 `n` 个不同的云存储提供商，所有提供商都保留一个数据块。可以使用可用 `n` 个块中的任意 `k` 个块还原原始数据对象。纠删码是多云存储的天然选择。\n\
  \n主要的贡献如下所示。\n\n* 专注于开发一种有效的脱敏程序，以掩盖多云存储中由各种专家和用户提供的敏感规则。\n* 通过纠删码进行优化，将数据放置在许多云存储系统中。\n\
  * 将编码划分为内码和外码，并使用新的优化器进行两次优化。这导致了优化器的双重利用。\n* 减少修改程度、信息丢失、隐藏失败和错误规则生成这四个脱敏障碍。• 提出多云存储和安全。\n\
  * 利用泥土鱼优化算法（`MSFOA`）结合纠删码。\n* 使用这种方法在没有错误代码的情况下有效恢复原始数据。\n* 将此方法与相关过程进行比较，并在优化器评估后，在访问时间和延迟的比较中提供更好的结果。\n\
  \n## 相关工作\n\n多云存储可以提供可用性和可扩展性等更好的特性。目前的研究使用纠删码和多个 `CSPs` 来最小化供应商锁定并提高容错能力等益处。然而，这些努力只对多云存储进行了零星使用，且没有一个考虑了通用的优化问题。实际上，明智地选择提供商和纠删码参数是优化多云过程中存储的关键。数据放置还应该满足系统或应用程序开发者的需求。这种复杂的性优化无法通过临时方法轻易实现，因为开发者经常要求同时优化多个目标。本研究引入了\
  \ `Triones`，一种多云存储的系统化方法，它使用纠删码来正确表示数据放置。\n\n然而，许多早期的工作 ((Mu et al., 2012; Tang\
  \ et al., 2022; Saini & Kaur, 2022) 仅利用了基于纠删码的多云存储来完成少数功能。纠删码参数 `(n, k)` 和云存储提供商\
  \ `(n)` 构成了多云存储的基础。明智地选择提供商和纠删码参数是优化多云过程中存储的关键。数据放置还应该满足系统或应用程序开发者的需求。这种复杂的性优化无法通过临时方法轻易实现，因为开发者经常要求同时优化多个目标。本研究引入了\
  \ `Triones`，一种多云存储的系统化方法，它使用纠删码来正确表示数据放置。\n\n但是，许多早期的工作仅利用了基于纠删码的多云存储来完成几项能力。纠删码参数\
  \ `(n, k)` 和云存储提供商 `(n)` 构成了多云存储的形成。多云存储的另一个关键标准是它能够充分考虑未来的变化，这种技术正在快速演进。\n\n###\
  \ 单云 vs. 多云存储\n\n大多数工作利用多云存储来规避单云的缺点 (Abu-Libdeh et al., 2010; Mu et al., 2012;\
  \ Saini & Kaur, 2022)。通过将数据分散在多个 `CSPs` 中，可以确保提高容错性、可用性和服务质量。纠删码在这些情况下通常被用于进一步改进，它可以显著降低数据存储的成本\
  \ (Wu et al., 2013)。另一方面，为了降低成本，开发者可以使用这种方法维护大量数据。\n\n## 方法论\n\n云存储中的信息收集用于从 `CSPs`\
  \ 收集关于第三方的信息，例如成本、功能和可用性。\n\n### 多云存储系统\n\n尽管多云存储提供了上述优势，但可用性、访问成本和存储成本之间的权衡是一个挑战\
  \ (Elkordy et al., 2023)。由于高可用 `CSPs` 给客户带来了巨大的财务负担。解决这一问题的方案是选择合适的 `CSPs` 和纠删码设置，以最大化数据可用性并最小化存储成本。\n\
  \n图 1 显示了用户如何在多个云中保存数据的示例。用户需求统计、信息收集、数据检索和托管是四个部分。该框架包含两个主要组件：数据检索和托管。为了确保高可用性，这两类组件都使用了纠删码\
  \ (Zhang et al., 2015)。纠删码可以用于将数据项分成等大小的块，然后利用这些类型的块来创建编码块。可以使用可用的 `n` 个块中的任意 `k`\
  \ 个块来还原原始数据。\n\n![图 1. 多云存储的概述](img/fig19_1_C.jpg)\n\n图 1. 多云存储的概述\n\n\n\n厂商锁定：这是云计算假设的一个大障碍（Opara-Martins\
  \ et al., 2016），其产生源于缺乏标准。在云云存储中，用户对价格上涨、可用性下降甚至提供商破产的脆弱性被称为厂商锁定问题。\n\n云的使用可以分为前三种部署模型。一种是类似于\
  \ Google、Amazon、Microsoft、IBM 等公司提供的公有云。在 SLA（服务水平协议）的帮助下，个人和企业可以在公有云中共享共享的绿色虚拟机实例作为资源。接随其后的是私有云，它更具安全性且开源的。\n\
  \n### 纠删编码 (Erasure Coding)\n\n通过纠删编码将完整文档分成若干块（Dhinakaran et al., 2020; Datta &\
  \ Oggier, 2022），虽然出于安全考虑输入被分成了块，但输出仍以输入的原始格式提供。在存储大量数据时，纠删编码非常有帮助（Lin & Tzeng, 2012）。在云端存储大量数据时，经常使用纠删技术，其中\
  \ TPA 用于存储所有数据。数据已使用纠删编码分为易于重组的块（Patil et al., 2012）。建议了一种名为 Triones 的系统模型（Su et\
  \ al., 2015）。它利用非线性规划在困难的约束条件下公式化并优化了多云系统中存储的数据放置。目标函数利用几何空间抽象和欧几里得距离测量构建，这有助于获得最终理想的数据放置拓扑。在\
  \ Triones 中，单目标和多目标都能成功处理优化过程。\n\n## 提出的方法\n\n所提研究概述了通过绿色云中的在线纠删编码来保护数据的程序。在线编码方法正在进行数据编码和解码。所提纠删编码的机制如图\
  \ 2 所示。新用户可以在该模型用户模块的第一阶段完成注册过程，其中包含个人信息、电子邮件以及通过一次性密码 (OTP) 进行手机号验证。输入凭据后，用户可以访问仪表板检查其云实例和应用程序的状态。用户的下一步操作是上传已分块的数据，每个块都有不同的动态优化密钥。用户在上传文档后，可以执行以下操作：对云环境中已有的数据进行追加、删除、插入和更新，其中消费者将对其工作负载获得完全的保护。由于只有用户有能力添加、更新或删除发生在绿色云中的可用数据，因此只有用户可以执行这些操作。\n\
  \n![Fig. 2. 多云存储环境下的提议系统架构图](img/fig19_2_C.jpg)\n\n图 2. 多云存储环境下的提议系统架构图\n\n动态密钥在第二阶段唯一地创建。使用泥土鱼优化算法生成并优化的密钥通过第三方认证\
  \ (TPA) 进行验证。每当执行删除或追加等操作时，它会将该密钥通信给管理员。同时还会创建并优化另一个不同的动态密钥。如果是在密钥的帮助下执行操作，则应由 TPA\
  \ 验证，且每个块都能执行任何一种操作。管理员操作员将 TPA 验证的优化密钥与创建的密钥进行比较，而云管理员模块将监控 TPA。在用户和 TPA 之间，管理员充当调解员。当用户执行活动后，优化密钥被\
  \ TPA 验证时，管理员会跟踪用户和 TPA。管理员监控整个云服务流程。\n\n### 优化的纠删编码\n\n图 3 展示了内部和外部编码过程。这些过程在 MSFOA\
  \ 的帮助下分别单独地得到了良好优化。它们在纠删编码的不同阶段执行。外部编码是将输入文件拆分成若干个对消费者透明且能满足其需求的数据块的过程。要确定给定文件中有多少片段是极具挑战性的，因为它们所有一个在外部编码中都是片段。\n\
  \n![Fig. 3. 整体编码过程](img/fig19_3_B.jpg)\n\n图 3. 整体编码过程\n\n内部编码使用复合消息通过哈希函数生成大量的校验块，以处理各种加密片段的命名规范。在这种情况下，攻击者无法弄清每个片段的顺序。不仅在内部通道，在外部通道也必须进行解码。在完成取决于安全动态密钥的内部类型解码后，外部类型解码将在重构原始文档之前合并所有消息块。内部和外部编码的程序在解码期间是反的。\n\
  \n$$\\begin{matrix} & {Sr = Gm^{\\ast}\\text{Fr}} \\\\ & {Fr = \\left\\{ Fr\\_{\\\
  text{i}} \\mid 1 \\leq i \\leq k \\right\\}} \\\\ & {Sr = \\left\\{ Sr\\_{\\text{i}}\
  \ \\mid 1 \\leq i \\leq n \\right\\}} \\end{matrix}$$\n\n其中 `Gm` 是在线编码 `(n, k)`\
  \ 的生成矩阵，`Fr[i]` 和 `Sr[i]` 分别是 `Fr` 和 `Sr` 的相关行。\n\n**纠删编码优化过程的算法**\n\n```\nInput:\
  \ 输入数据\n1: n, 消息块 (M) 的数量\n2: 外部编码方法 — 使用优化器对每个消息块进行异或 (XOR) 处理\n3: 使用相同优化器的内部编码进度\n\
  一个校验块包含数据中所有异或（XOR）消息组。\nU 是输入文件中存在的每个消息块 (1 到 n) 的集合。\n```\n\n4: 内部解码 - 一个带有私钥的动态安全文件。\n\
  5: 外部解码进度 - 每个消息块的异或 (XOR)\nOutput: 原始/输入文件\n\n上述步骤通过这些手段被有效地开发。这些步骤通过 Triones 方法（Su\
  \ et al., 2015）进行了实验验证，以估计它们在整个过程中的延迟和时间消耗。\n\n## 结果与讨论\n\n新提出的基于 MSFOA 的增强安全和存储的多云系统在\
  \ MATLAB / Simulink 平台上实现。作为许多技术快速开发的优秀平台提供了绝对的结果，通过现代数据保护技术实现多云数据安全和存储。\n\n此外，我们的方法使用了四种类型的云存储供应商（Google\
  \ Drive、PCloud、MediaFire 和 MEGA 作为第一批数据集）来执行实验设置。图 4 显示了使用纠删编码中各种参数 (n, k) 编码和解码\
  \ 20 MB 大小数据对象块所需的时间。这些参数是根据之前创建的组合选择的。\n\n与此开销相比，检索多云存储中这些类型对象的总延迟较低。与单云存储相比，纠删编码的开销允许在多云存储中进行数据分片。\n\
