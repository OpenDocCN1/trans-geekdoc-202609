  # 使用 LSTM 和 RNN 技术进行加密货币价格预测\n\nRaguru Madhan,⁴³\n\n印度印度达斯坦技术科学学院，计算机科学与工程系，钦纳伊\n\
  \n电子邮箱：tharun29072001@gmail.coml; johndp@hindustanuniv.ac.in; jaravindhar@hindustanuniv.ac.in;\n\
  \nDOI: [10.1201/9781003430452-56](https://dx.doi.org/10.1201/9781003430452-56)\n\
  \n## 摘要\n\n近年来，加密货币的使用稳步增长。比特币 (BTC)、莱币 (LTC) 和以太坊 (ETH) 等加密货币目前是活跃的开源社区和支付网络，供数百万人使用。由于这些加密货币的价格每天变化，从技术上来说预测买卖价格非常困难，同时投资者必须每天对加密货币价格进行预测。现有的加密货币价值预测技术使用的卷积神经网络（CNN）适用于分类，但在处理序列数据时可能会产生次优的预测准确率。本工作使用了循环神经网络（RNN）和长短期记忆（LSTM）来获得更准确、更高效的价格预测。本工作考虑均方误差（MSE）矩阵作为评估预测质量的指标。`RNN`\
  \ 算法实现在 `LSTM` 的第一层中。该算法使用 `Python` 中的 `streamlit` 库实现，从 `yahoo finance` 获取加密货币实时数据。与现有模型相比，该算法产生了更高的准确率。\n\
  \n关键词：比特币 (BTC)，以太坊 (ETH)，长短期记忆 (LSTM)，均方误差 (MSE)，循环神经网络 (RNN)。\n\n# 引言\n\n许多不确定因素影响着加密货币币的价格，包括政治问题、经济问题和自然灾害\
  \ (Ibrahim, 2020)。这些是价格剧烈波动的主要原因。为了解决价格波动问题，需要一个能够进行准确且高效预测的模型，帮助投资者对价格剧剧变化获得某些知识，从而使他们的投资转向盈利。在加密货币金融服务领域，区块链技术经常被称为分布式账本技术\
  \ (Chinnasamy et al., 2021)。\n\n加密货币价格数据是随时间变化的时间序列。因此，预测加密货币的价格非常困难。该模型使用 `LSTM`\
  \ 和 `RNN` 实现。`RNN` 算法具有存储之前的数据的能力并利用这些数据预测当前价格。`LSTM` 模型为 `RNN` 提供了更多的内存支持。\n\n\
  现有模型由于使用了 `CNNs` (Pokhrel et al., 2022; Kang et al., 2022; Cavalli and Amoretti,\
  \ 2021) 准确率较低。另一方面，如时间序列、音频或文本是是一维，缺乏相同的空间结构。因此，直接将 `CNN` 应用于序列数据可能无法始终给出最优性能的结果。\n\
  \n`RNN` 是一种前馈神经网络，通过分析模式的连续变化来预测序列问题。`RNN` 有一个特点，如果它产生输出，该结果将反馈到 `RNN` 隐藏层的内存中进行下一次预测，这使得\
  \ `RNN` 在序列预测中更加准确 (Pant et al., 2018; Chinnasamy et al., 2023)。`LSTM` 是 `RNN` 中用于时间序列预测的流行深度学习技术。它有四层：输入层、隐藏层、细胞状态和输出层。\n\
  \n## 相关工作\n\nKhalid et al. (2020) 使用技术指标和机器学习对各种加密货币进行价格预测。该研究中用于预测比特币价值的神经网络基于机器学习，并在\
  \ 100 次训练迭代中具有最低的模型损失。这对于仍处于开发阶段且人口缺乏技术技术的国家来说将是一场灾难 Ibrahim (2020]。Chinnasamy et\
  \ al. (2023)。用于自然语言处理的深度学习研究应用。本研究主要使用深度学习归纳推理程序。它讨论了医疗、语音识别、机器学习和计算语言学领域最新的深度学习进展和应用\
  \ (Chinnasamy et al., 2023)。\n\nWang Yiying et al.(2019) 使用 AI 进行加密货币价格分析。在这项研究中，他们使用先进的人工智能框架（如全连接神经网络和\
  \ `LSTM`）分析了比特币、以太坊和瑞的价格动态。另一个缺点是优化过程，且所提模型的参数没有充分测试其潜力，因为该实验的主要目标是确定合适的记忆长度以及预测记忆长度\
  \ Yiying and Yeze (2019]。Pokhrel et al. (2022) 深度学习模型被用于预测 NEPSE 指数价格。该研究使用 `LSTM`、门控单元和\
  \ `CNN` 来预测尼泊尔股市指数的次日收盘价。其他媒体情绪（包括财经新闻）可以纳入模型构建过程中 Pokhrel et al., 2022)。\n\nChinnasamy\
  \ et al.(2021) 智能城市中的区块链技术。由于人口不断扩张，智能城市为政府、能源、交通和环境挑战寻求有效的长期智能解决方案。为了维持某种程度的虚拟安全，区块链经过加密并使用公私钥\
  \ (Chinnasamy et al., 2021)。\n\n## 材料与方法\n\n噬 所提模型的系统架构与工作流\n\n\n\n\n\n在提议的系统（图\
  \ 1）中，首先收集加密货币相关数据集，并需要进行数据预处理，这意味着清理噪声和不需要的数据，并进行转换以适用于深度学习模型的使用。下一步是使用预处理后的数据训练\
  \ `LSTM` 和 `RNN` 模型。这涉及指定网络架构、选择合适的超参数并运行训练过程以优化网络权重。模型训练完成后，在新的数据上对其进行测试以评估其性能。这包括将预测值与实际值进行比较，以计算准确率和均方误差等指标。\n\
  \n![Fig. 1. 系统架构](img/fig56_1_B.jpg)\n\nFig 1\\. 系统架构\n\n该提议的方法如图 2 所示。它从对加密货币（比特币、莱特币、以太坊）数据集的可视化和分析开始。理解和分析数据收集以及可能包含的各种模式和趋势是有益的，以支持使用不同的算法来预测和执行不同的活动。然后实现一个利用长短期记忆（LSTM）的循环神经网络模型。`RNN`工作原理的区块流程如图（图\
  \ 2）。有关加密货币的数据最初从 Yahoo Finance 等在线数据源获取。这些信息包含了项目中使用的不同加密货币属性，如最高价、最低价、开价、成交量、时间戳等。在对数据使用深度学习\
  \ 之前，需要对其进行某种修改，例如重塑原始数据以执行 `LSTM` 和 `RNN` 模型。为了开始，通过正确格式化数据更改数据类型以消除差异。然后删除数据集中无值的剩余部分。然后可以使用划分后的数据训练集和测试集通过深度学习训练模型[[12]]。数据被分为三组：训练集、验证集和测试集。训练集是第一部分数据。\n\
  \n![Fig. 2. 提议模型的工作流](img/fig56_2_B.jpg)\n\nFig 2\\. 提议模型的工作流\n\n### 实现\n\n使用比特币、莱特币和以太坊的数据，此代码旨在预测加密货币收盘价。代码开始于导入必要的库，然后为模型训练准备原始数据。通过\
  \ min max scaler 对数据进行归一化。实现 `LSTM` 模型来预测加密货币价格，并使用数据集进行训练和测试（(Nivethitha and Raharitha,\
  \ 2019; Pokhrel et al., 2022; Loginova et al., 2021)）。在数据集上运行 `LSTM` 模型时使用了 `sequential`\
  \ 和 `clear_session` 函数。\n\n`LSTM` 模型的性能通过均方误差值进行测试，如果测试 `MSE` 值越小，意味着模型的预测越准确。`gen_test_pred_frame`\
  \ 函数为加密货币收盘价生成测试预测数据框。代码随后使用生成的测试预测数据框创建两个图（Yiying and Yeze, 2019; Madan et al.,\
  \ 2015）。第一个图描述了预测的真实的 BTC、LTC 和 ETH 收盘价。\n\n数据集值包含最低价、最高价、开价、成交量、时间戳等。\n\n\n\n\n\
  \n在图 5 中，绘制了比特币预测价格、验证值与比特币收盘价测试数据之间的图（Ibrahim, 2020; Atsalakis 等, 2019）。x 轴标记为日期，y\
  \ 轴标记为以卢比（INR）计的加密货币收盘价。该图根据切片编号绘制，周期设定为 60 天。由于带有 `RNN` 算法的 `LSTM` 模型具有存储先验计算结果的内部内存，因此在进行当前计算时可以使用这些结果，模型的预测会更加准确。该模型在时间序列加密货币数据中的应用使其非常有用（Huang\
  \ 等, 2005）。当模型输出不准确时，`RNN` 方法采用反向传播技术，以提高模型预测比特币价值的能力。\n\n![图 5. 比特币预测价格](img/fig56_5_B.jpg)\n\
