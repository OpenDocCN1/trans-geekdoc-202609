  \n[content]\n所提出的方法是 Our Steg，一个 Android 应用，它利用 `AES` 和 `LSB` 算法对照片中的信息进行加密和解码。该程序使用\
  \ `Android Studio` 开发，具有基于 `Java` 的后端和基于 `XML` 的前端。用户可以根据意愿向照片中添加或移除加密。在点击“加密”按钮之前，他们可以选择要加密的图像，或者输入密钥和消息。之后，可以保存图像。用户必须选择隐影，并在加密和解密中使用相同的加密密钥。该应用程序使用了\
  \ `AES-128`，这是一种对称密钥方法，它使用相同大小的密钥对 128 位长度的数据块进行加密和解码。它比 `RSA` 和 `Blowfish` 等其他算法更高效，速度更快。一个\
  \ `AES` 轮由四个操作组成：`SubBytes`、`ShiftRow`、`Mix Columns` 和 `AddRoundKey`。该技术还利用 `LSB`（最低有效位）方法将加密信息整合到图像中。编码解码是系统的两个主要部分，而嵌入和消息加密是它们的辅助组件。使用提供的密钥创建一个秘密密钥，并在加密模式下初始化一个\
  \ `AES` 创建的密文实例。使用 `LSB` 操作应用于幅图，将消息转换为二进制，计算每个像素的 `LSB`，然后将隐影作为嵌入过程的一部分写入。\n\n\
  在本文中介绍了一种隐形术方法，该方法使用最低有效位 (`LSB`) 加密和波波修改在发送者和接收者之间加密数据。幅图被转换为灰度图像，隐藏消息转换为定时事件。在加密之前，错误的扫描会改变像素值。然后使用\
  \ `LSB` 加密的两个位来掩盖包含在幅图中的隐藏消息。执行隐形术的过程如流程图所示，包括加密、比较加密图像和原始幅图、发送图像、在仍处于加密状态时提取秘密行、比较输入和提取的秘密行、绘制直方图，以及计算峰值噪声比（`PSNR`）和均方误差（`MSE`）值。通过对比加密和未加密照片的直方图，演示了隐藏图像的解密。如果直方图匹配，则可以在无任何错误或噪声的情况下恢复解密图像。如果存在传输噪声，直方图显示了解密图像与加密图像相比像素的色散情况，这会导致解密图像中某些像素丢失。总之，本研究提出的方法了一种在幅图中隐藏通信内容的可靠且安全的方法，而小波变换和\
  \ `LSB` 加密的应用进一步提高了通信的安全性。\n\n`LSB` 隐形术是一种在图像中隐藏敏感信息的常用方法。它涉及将数据嵌入幅图像素的最低有效位。由于在创建隐影期间仅更改了最低有效位，图像的失真在肉眼看来是不可见的。`RGB`\
  \ 图像的隐形容量可以使用考虑图像行列数的方程计算。在利用 `LSB` 隐形术插入秘密消息之前，通常利用加密来提高该方法的安全性。这种方法包括选择幅图、使用带有\
  \ `AES-128` 的 `CBC` 模式以及 `LSB` 隐形术来插入消息。从源处检索信息，使攻击者更难获取数据。所提出的 `LSB` 隐形术方法涉及切换\
  \ `R-G-B` 平面遍历的方向。在不损害图像隐形能力的情况下，可以使用图像属性作为标记来指定遍历顺序。该技术使用 `AES-128` 加密消息，根据图像属性确定遍历顺序，在加密消息中添加分隔符，最后使用\
  \ `LSB` 隐形术嵌入消息。加密消息被检索出来。\n\n\n\n综而言，隐写术一直是安全通信的重要工具，其有效性取决于其在显眼处隐藏信息的能力。然而，由于隐写术易于被检测且在嵌入和提取信息时需要极高的计算能力，其效率一直是一个受关注的问题。幸运的是，隐写技术和算法的进步显著提升了其效率，降低了计算复杂度并增加了隐藏信息的安全性。诸如扩频隐写、`Quantization\
  \ Index Modulation`和`LSB Matching`等技术已证明其在增强隐写术的容量和鲁棒性方面有效。此外，人工智能和机器学习在隐写中的应用使得更复杂、更的技术成为可能，能够抵御各种攻击和检测方法。总之，随着隐写技术和算法的不断改进，我们可以预计未来会有更高效、更安全的信息隐藏方法，为安全通信提供可靠的手段。\n\
