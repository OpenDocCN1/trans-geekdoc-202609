  \ and Kashif Javed (2021). 针对视障的各种技术。\n11. [Shuai Jin, Shuanguang Gao, Tengjun Liu,\
  \ Qinghua Guo]. (2018). 使用 `RCNN`。\n\n\n\n\n\nEvans et al. (2007) 进行了一项涉及 13900\
  \ 个人的研究，结果显示视力障碍者与非视力障碍者之间抑郁症的情况非常普遍。这表明视力障碍与抑郁症之间可能存在联系。视力障碍者可能在日常生活中更容易遇到功能障碍。这些困难会损害个人的心理健康，导致抑郁症，进而引发社会孤立，而社会孤立是抑郁症的另一个风险因素。总之，这项研究强调了识别视力障碍对心理健康潜在影响的重要性，以及需要干预措施来减轻这一人群抑郁症负担的必要性。\n\
  \nMashiata et al. (2022) 对针对视力障碍人士的辅助技术的现状和预期前景进行了全面的综述。该综述旨在概述目前可用的各种辅助设备及其特征和局限性。视力障碍人士正在使用多种类型的辅助设备，包括采集设备、工作时间、响应时间、覆盖区域和反馈。文中涉及的设备包括使用图像处理、计算机视觉和机器学习技术来辅助视力障碍用户的设备。该综述还讨论了辅助设备的特征，如使用的传感器类型、工作时间、响应时间、覆盖区域和反馈机制。还评估了这些设备在不同场景（如室内和室外环境）中辅助用户的能力。然而，综述得出，在调研期间，还没有单一设备能满足视力障碍人士辅助技术设计的所有要求。总之，综述强调了持续开发视力障碍人士辅助技术的必要性，以创建能够满足所有用户需求的设备。综述建议，在设计视力障碍人士辅助技术时，考虑不同功能之间的权衡是非常重要的，以便为不同场景下的用户提供最好的协助。因此，我们的目标为视力障碍人士提供一个功能完善的系统，该系统包含\
  \ 5 个模块：MRI 阿尔茨海默症检测、OCR、手势转语音、物体检测和人脸检测，以帮助视力障碍人士执行基本功能。\n\n三个预训练网络被入选用于检测 MRI\
  \ 图像中的阿尔茨海默症：`VGG-16`、`Resnet50`、`SE Resnet50`，其中 `Resnet` 似乎比其他网络更准确 Theckedath\
  \ and Sedamkar (2020)。使用 Haar 级联分类器是因为其结果快、计算成本低且可靠 (Hyun et al., 2021)。用于人脸检测的\
  \ Haar 级联使用 `LBPH`（局部二值模式直方图）算法进行脸识别，是因为其性能已知以及从正面、背面或侧面识别人脸的能力 (Hwang et al., 2019)。手势转语音模块将使用经过调优预训练模型的常规\
  \ `CNN` (Ahmed et al., 2022)。`Pytesseract`（`google ocr`的封装）和`Python` 将用于 `OCR`模块。\n\
  \n## 建议的方法\n\n我们的目标是开发一个包含两个主要部分的双重辅助系统：医生助手和患者助手。医生助手模块旨在为医生为分析阿尔茨海默症患者的 MRI 扫描提供初步理解和分析起点。该模型可以部署在服务器上，以便在医院网络内本地访问。考虑到视力障碍是阿尔茨海默症的常见症状，患者助手分为四个子模块，可以帮助阿尔茨海默症患者执行基本活动。这些子模块包括用于识别家庭成员的人脸检测、用于识别环境中常见物体的物体检测、用于阅读大字的\
  \ OCR 以及允许通过手势交流的患者与医生直接对话的手势转语音。\n\n### *医生助手*\n\n我们提出了一种结合 `Resnet 50` 和 `Xception`\
  \ 的集成方法，对四类 MRI 图像进行多分类：轻度痴呆、中度痴呆、极轻痴呆和非痴呆。\n\n## 相关工作\n\n在视力障碍人士辅助技术领域，已有若干研究和项目。Martinek\
  \ et al. (2019) 展示了一种可以执行关键任务的 OCR 系统：分析页面布局、识别文本块和识别文本。\n\nref75_8) 提出了一种使用 Haar\
  \ 分类器的人脸检测架构，以提高计算速度。此外，在该架构中使用 Haar 分类器是一种常规系统。持续可持续性是人脸检测的一个关键问题，因为它们通常依赖于小型处理单元。[ref75_9)\
  \ 物体检测使用 `Caffe` 完成 ([Ikeda et al., 2019)。输出格式为 `GTTS`（谷歌文本转语音）(Kaur and Singh (2022))。[ref75_15)\
  \ Holanda et al. (2018) 提出了一种阅读系统，该系统利用便携设备并结合`ML`技术、分割和特征提取，实现了 99.86%的准确率和 99.3%的特异性。[ref75_16)\
  \ Wang et al. (2022) 使用以`Resnet 50`为骨干的分类算法对 400 张训练图像和 100 张视觉注意力图进行分类。初始 epoch\
  \ 没有显著改进，但在 10 个 epoch 之后有了显著提高，`Resnet 50` 证明是分类医学图像的常规系统。\n\n\n\n\n选择这种方法的原因是\
  \ `ResNet50` 和 `Xception` 具有互补的优势——`ResNet50` 擅长捕捉长程依赖关系，而 `Xception` 则擅长捕捉局部特征。由于\
  \ `MRI` 图像中的细节通常非常细微，结合这两种架构使得我们能够准确地捕捉局部和全局特征。我们选择 `ResNet50` 是因为它的复杂性，它具有 50 层，这使其能更有效地捕捉\
  \ MRI 图像中复杂模式，这对于痴呆症分类至关重要。此外，`ResNet50` 是医学图像分类的传统骨干算法，使其成为首选。我们利用了来自 `ImageNet`\
  \ 数据集的 `ResNet50` 预训练权重，为痴呆症分类任务引入先验知识。同样，以与 `ImageNet` 权重表现良好的 `Xception` 也与 `ResNet50`\
  \ 结合在一起。`ResNet50` 和 `Xception` 丰富的资源使得将它们结合形成一种集成方法（Ensemble method）变得可行。`Resnet\
  \ 50` 是 `Resnet` 模型的变体，具有 50 层，由 48 个卷积层、1 个平均池化层和 1 个最大池化层组成。此外，`Xception` 使用跳跃连接或残差连接来促进信息从早期层向后期层的流动，允许网络在训练过程中保留重要信息。这是通过在网络层之间添加快捷连接实现的，允许它们之间直接通信。\n\
  \n## 患者辅助\n\n患者辅助的主要模块是脸检测模块，使用了 `Haar cascade 分类器`，因为其结果快速、计算成本低且可靠。用于用于人脸检测的 `Haar\
  \ cascade` 随后使用 `LBPH`（局部二值模式直方图）算法进行人脸识别，因为它性能良好且具有从正面、背面或侧面识别人脸的能力。光学字符识别（也称为\
  \ `OCR`）将由 `pytesseract` 执行，这将帮助患者阅读大型标牌。对于目标检测，我们使用 `Caffe` 模型，它可以检测屏幕中的多个物体。符号转语音将通过一个\
  \ `Pretrained CNN Sequential` 模型完成。这些算法是根据广泛的文献调查选择的，以确保所选算法在所有不牺牲速度或准确性的情况下都能正常工作。\n\
  \n## 仿真与分析\n\n我们进行了仿真以研究不同优化器下不同算法的行为。我们实验了多种算法和优化器，在分析结果后，我们筛选出两种算法：`Xception`\
  \ 和 `Resnet 50`。`Xception` 是 `Inception` 网络的变体，而 `Resnet 50` 是 `Resnet` 网络的变体。此外，我们为这些算法筛选了三种已知的优化器：`随机梯度下降\
  \ (SGD)` 优化器、`自适应动量估计 (Adam)` 优化器和`均方根传播 (Rrnsprop)` 优化器。这些优化器被广泛应用于深度学习，用于优化神经网络的参数。筛选过程是基于算法在不同优化器下的性能、计算效率或其他相关因素。因此，选择了入选算法和优化器进行进一步分析和比较，以确定用于特定任务的最佳组合。\n\
  \n正如对给定的数据集观察到的，`Resnet 50` 在 `Sgd` 优化器下表现更好，给了我们更稳定的测试准确率，而且与 `Adam` 优化器相比，高值更高，低值也更少。对于配合\
  \ `Sgd` 和 `Adams` 优化器的 `Xception` 也观察到了类似的现象。此外注意到，`Xception` 在初始轮次期间无法有效训练，测试准确率下降了约\
  \ 10-12%。与 `SGD` 优化器连接的 `Resnet 50` 和 `Xception` 在轮次增加中稳定性提高。集成模型添加了额外的增强数据。所有仿真都在\
  \ 0.001 的学习率下进行了 10 轮。`Rms prop` 似乎不是这种集成方法的合格优化器，因为我们可以看到测试准确率有约 15% 的差异和波动。\n\n\
