  \ 使用神经网络创建 HTML 的新方法。Procedia Computer Science, 45, 197–204。\n5. `Ignatov, A.`,\
  \ `Timofte, R.`, `Kulik, A.`, `Yang, K.`, `Baum, F.`, ([ch53.xhtml#R_ref53_5) 和\
  \ `Van Gool, L.`. (2019,10 月). AI 基准测试：2019 年智能手机上的所有深度学习。2019 IEEE/CVF 国际计算机视觉会议\
  \ (IC CVW) (pp. 3617–3635)。\n6. `Johnson, M.`, and `Dhanalakshmi, R.`. (2019). 基于预测分析的智能垃圾桶高效路由以实现有效的废物管理。International\
  \ Journal of Recent Technology and Engineering, 8(3), pp.5733–5739。\n7. `K. N.`,\
  \ `R. V.`, `S. S. S.`, and `D. R.`. (2020). 智能个人助手 - 实现支持语音识别的语音命令。2020 国际系统、自动化和网络会议\
  \ (ICSCAN), pp.1–5, doi: `10.1109/`\n\n\n\n\n本研究论文提出了一种创新的股市趋势预测与分析技术，结合了股票的相互依赖性、风险识别以及金融新闻的情感分析。我们的方法利用了数据分析技术、相关性识别，以及用于情感分析的长短记忆模型（`LSTM`）的自然语言处理技术。我们应用\
  \ `Pearson correlation coefficient` 来识别高性股票之间的相关性及其相互依赖关系。所提出的模型整合了与市场波动相关的识别风险（如政治不稳定性和经济变化），以实现更全面的股市分析。情感分析通过自然语言处理技术进行，这使得模型能够通过分析金融新闻的情感得分来预测市场未来的市场趋势。`LSTM`\
  \ 作为一种深度学习算法，被用于分析包括历史数据和趋势在内的时间序列数据，以预测未来的股票价格。所提出的模型提高了股市预测的准确性，并为投资者提供了一种更科学的决策方法，从而减少了他们的风险敞口。总的来说，这种用于股市预测和分析的模型为分析股市波动提供了一种全面、高效的方法，具有帮助投资者做出盈利交易决策的潜力。\n\
  \n关键词：`LSTM`、`Correlation`、`Risk identification`、`NLP`\n\n# 引言\n\n股市是金融业的重要组成部分，极大地促进了国家的经济发展。股市被视为比较不同国家经济增长的基准，其表现受到投资者、投机者和金融分析师的密切监测。预测股市波动是一项困难的任务，因为它涉及到处理复杂的市场机制以及不断变化数据的不可预测性。然而，准确的预测可以为市场趋势提供有价值的洞察，使投资者能够做出明智的投资决策，从而有助于改善国家经济和每个人的财务状况。因为股市带来的收益不仅有利于国家的经济状况，也有利于公民。股市价格序列的非平稳性为准确预测带来了巨大挑战。股票价格序列通常包含大量的噪声和震荡，这些特征使得以有意义的方式表示数据变得困难。一些技术涉及利用人工特征，如随机技术指标和移动平均线。此外，一些使用深度学习神经网络和强化学习的先进技术也存在某些局限性，需要进行改进以使模型运行得更准确。因此，需要一种全新的股市预测和分析策略。因此，本研究考虑了股票的相互依赖性、与市场波动相关的风险，以及金融新闻的情感分析。\n\
  \n本研究论文提出了一种利用先进数据分析技术的预测和分析股市的方法。我们的方法利用 `Pearson correlation coefficient` 来识别热门股票的共同依赖关系，并识别与市场波动相关的风险。我们还采用自然语言处理来分析识别为低风险股票的金融新闻情感得分，使我们能够对市场的未来趋势做出更准确的预测。最后，我们使用长短记忆（`LSTM`）算法来估计低风险股票的未来价值、其情感得分以及时间序列数据。通过结合这些分析后的数据，我们提出的模型旨在提供更高的预测准确性，从而为投资者带来更高的利润。\n\
  \n## 相关工作\n\n研究识别出，最常用的股市预测算法包括 `ANN`、`SVM`、`LSTM`、`CNN`、`DNN` `Kumar et al., 2021`。在该研究中，单模型算法的性能被报告为较差。因此，在调查中高度建议使用融合模型以获得更好的预测。传统模型如\
  \ `SVM` 被结合情感分析 `Ren et al., 2019` 进行分析，该模型表现良好，由于作者关注数据量的增加，神经网络可以很好地处理大规模数据集，因此引入了深度学习模型\
  \ `Methee & Neagoe, 2020`。新闻和在线平台在股市波动中起着重要作用，这通过对推文、新闻流内容进行假设检验方法得到了证明 `Bharathi\
  \ et al., 2017`。使用移动平均线的情感分析 `Bharathi et al., 2017` 同样证明了这一点（注：原文此处引用重复或指指其重要性）。系统综述\
  \ `Kumar et al., 2021` 分析了使用股市市场时间序列数据的 57 篇论文，其中 `Dogan et al., 2020` 研究了使用不同在线网站的情感分析\
  \ `Bharathi et al., 2017`。局限性包括数据源的使用以及对文本数据缺乏伦理讨论。在使用来自各种网站的在线输入时，主要的缺点是虚假信息可能会影响算法。`Bharathi\
  \ et al., 2019` 作者提出的情感算法证明了其以更高准确性识别偏差新闻的能力。在考虑数据方面，`Bharathi et al., 2013` 作者提出了一种有效的算法来抓取在线内容，可以用于各种在线网站。情感得分提高了投资决策的准确性\
  \ `Bharathi et al., 2017`，研究建议关注效价偏移（shifters）以进一步改进，这些被用于本项目中。\n\n另一种使用的方法是模糊理论\
  \ `Wang, 2017`，这是一个使用模糊时间序列的大数据框架，包含了模糊理论和传统预测方法，但作者建议通过独特的方法来识别理想的模糊趋势以改进结果。强化学习已引入股市分析\
  \ `Zhang et al., 2022`，通过整合深度神经网络创建自动交易系统融合模型得到了进一步扩展 `Ansari et al., 2022`，作者使用基于\
  \ `GRU` 的预测网络估计未来股票趋势，并在评估中显示出良好的利润值。由于该模型没有在主要的技术和基本面指标上运行。\n\n进一步的卷积方法 `Deng et\
  \ al., 2019` 发现，将知识与时间卷积网络结合的准确性高于任何其他深度学习模型，并为股票价格提供了最准确的结果。在考虑时间数据时，许多研究人员开始将时间数据作为分析的技术指标之一\
  \ `Hou et al., 2021`，作者在其方法中认为，通过加入时间数据准确性得到了提高，并且还需要考虑其他技术方面以实现更准确的预测。使用卷积方法，文本数据也经过处理并用于分析，且效果良好\
  \ `Tan et al., 2021`。\n\n\n\n\n基于图的方法被引入用于分析股市。一项调查（Saha et al., 2022）显示，该领域的大多数分析和预测是基于传统方法、深度学习和强化学习方法的；当传统方法无法满足更高的准确率要求时，会使用复杂的神经网络方法。通过借助基于图的预测方法，可以避免这种情况。作者提出的“时间感知关联注意力网络”（Ying\
  \ et al., 2020）被用于基于图技术根据收益率排名进行股票推荐。该方法通过时间序列和文档检测股票之间随时间变化的各种相关强度。\n\n目前已经提出了多种提高模型准确性和性能对应方法，包括结合混合方法的深度学习（Ray\
  \ et al., 2021）、强化学习（Pinto et al., 2021）、基于图的学习、神经网络（Pang et al., 2020）以及传统算法。针对\
  \ `ML`（11）、融合方法（Zhang et al., 2022）、图神经网络（Wu et al., 2020）以及计算智能（Kumar et al., 2021）等技术的调查表明，这些模型的有效性在很大程度上取决于所使用的数据。为了准备一个全面的数据集，空间数据、数据间的依赖关系、情感数据和时间序列数据等额外技术指标通常被视为单一指标或组合使用。不同领域的论文利用各种数据集提出了不同的模型，这表明了利用特定领域数据来实现高性能重要性（Kumar\
  \ et al., 2021）。近年来，使用前述提到的改进指标变得越来越流行，因为它们可以为数据提供宝贵的见解，从而带来更准确的预测和更好的整体性能。然而，数据的识别也基于对股市领域问题的解决或分析，因为股市有多种处理和分析数据的方法。每个场景都有多种交易技术、股票期权、策略和投资组合维护期，每个场景都有不同的方法并使用不同的数据集。在研究中，我们主要关注如何通过分析来最小化损失风险并最大化收益。\n\
  \n## 方法论\n\n在本节中详细描述了所提出的方法。在我们提出的模型中，通过相关性分析来降低风险。\n\n## 相关分析\n\n相关性分析是一种重要的统计技术，用于衡量两个变量之间关系的强度。\n\
  \n皮尔逊相关系数衡量两个变量之间线性相关性的强度。分 `+1` 表示完全正相关，而分 `0` 表示变量之间没有相关性。分 `-1` 表示完全负相关。\n\n\
  皮尔逊相关系数可以使用以下公式计算：\n\n$$r = \\\\frac{\\\\sum\\\\limits\\_{j = 1}^{n}\\\\left( {\\\
  \\left( {x\\_{i} - \\\\overline{x}} \\\\right)\\\\left( {y\\_{i} - \\\\overline{y}}\
  \ \\\\right)} \\\\right)}{\\sqrt{{\\\\sum\\\\limits\\_{i = 1}^{n}\\\\left( {x\\\
  _{i} - \\\\overline{x}} \\\\right)^{2}}{\\\\sum\\\\limits\\_{i = 1}^{n}\\\\left(\
  \ {y\\_{i} - \\\\overline{y}} \\\\right)^{2}}}}$$  \n\n`r` - 相关系数，`n` 是观测值数量，\n\n\
  `Σxy` - 配对观测值的乘积和，\n\n`Σx` 和 `Σy` - x 和 y 观测值的和，\n\n`Σ²` 和 `Σy²` - x 和 y 观测值的平方和。\n\
  \n相关分析可以为研究中不同变量之间的关系提供宝贵的见解，但必须注意的是，相关性并不意味着因果关系。未被测量的其他因素可能会影响变量之间的关系，因此仔细解释相关性分析的结果并考虑观察到的相关性的其他可能解释是非常重要的。\n\
  \n### 情感分析\n\n情感分析是自然语言处理（`NLP`）中的技术，用于识别和提取主观信息。最广泛使用的工具之一是 `VADER`（情感感知词典和情感推理器），它使用词汇来分析文本数据中的情感。与传统方法不同，`VADER`\
  \ 为语法不总是适用的社交媒体进行情感分析提供了一种快速有效的方法。\n\n\n\n\n\n`c_hat(t) = tanh(Wm_c \\cdot [h(t-1),\
  \ x(t)] + bv_c)`\n\n`Wm_c` - 权重矩阵，`bv_c` - 偏置，`h(t-1)` - 过去的隐藏状态，`x(t)` - 当前输入。\n\
  \n*当前单元状态：* 当前单元状态通过移除遗忘门想要丢弃的信息并添加输入门想要添加的信息来对上一个单元状态进行更新。它使用了逐逐元素的乘法和加法操作。\n\n\
  当前单元状态方程：\n\n`c(t) = fg(t)*c(t-1) + ig(t)*c_hat(t)`\n\n`fg(t)` - 遗忘门的输出，`ig(t)`\
  \ - 输入门的输出，`c(t-1)` - 上一个单元状态，以及 `c_hat(t)` - 候选单元状态。\n\n*输出门：* 它决定从最新的单元状态中选择哪些数据作为当前隐藏状态进行输出。它接收过去的隐藏状态和当前输入作为输入。\n\
  \n输出门方程：\n\n$$\\begin{array}{l} {out\\_g(t)\\, = \\, ReLU(Wm\\_out\\_g \\cdot \\\
  lbrack h(t - 1),\\mathbf{x}(\\mathbf{t})\\rbrack +} \\\\\\\\ {bv\\_o)} \\\\ \\end{array}$$\n\
  \n`Wm_og` - 权重矩阵，`bv_o` - 偏置，`h(t - 1)` - 上一个隐藏状态，以及 `x(t)` - 当前输入。\n\n**LSTM**\
  \ 模型的训练涉及使用优化算法迭代更新权重和偏移值，以减少预期输出与实际输出之间的差异。\n\n## 数据预处理\n\n### 数据收集\n\n我们为该项目收集了两种类数据集：从雅虎财经（yahoo\
  \ finance）获取的时间序列数据，以及使用 `Twint` 从推特上爬取的文本数据。\n\n雅虎财经为各种上市公司提供了股票代码（ticker symbols）。这些股票代码是代表特定公司股票的唯一标识符。在项目中，从\
