  \ ECC 在保护云环境中的数据方面更加高效。\n\n## 椭曲线加密 (ECC)\n\n椭圆由使用方程 `Y2=x3+sx+t` 定义的点集组成，其中 `s`\
  \ 和 `t` 是域“K”的元素，用以给出无穷点，并且满足 `4s3+27t2 # 0` 不等于零的条件。实数 (R)、有理数 (Q) 和复数 (c) 都是可以定义椭圆的场示例。当需要加密和密钥交换概念时，这种椭圆变得非常特殊。它需要更短的加密密钥，仅需极少的内存和\
  \ CPU 资源。这种椭曲线是一种公钥加密，其中 256 位的 EC 提供的保护与 3072 位的 RSA 相同（Dhamodharan & Thaddeus,\
