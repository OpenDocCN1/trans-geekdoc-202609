  \n\n\n\n本文提出了一种用于电影推荐系统中虚假检测的混合方法，以消除虚假评论对用户选择的负面影响。所提系统结合用户的网络特征和个人特征来识别发布虚假评论以推广或贬低特定电影的账户。网络特征包括位置和网络使用情况，个人特征包括账户活动和创建日期。随后将封禁虚假账户的\
  \ IP 地址以防止其进一步发布虚假评论。来自真实账户的真实评论用于电影推荐，根据用户的喜好提供准确可靠的建议。其目标是增强用户对推荐系统的信任，并为用户提供更可靠、真实的评论。研究表明，所提出的混合方法在精确率、召回率和准确率方面优于现有的虚假评论检测方法。结果表明，该方法通过移除误导性和虚假评论，显著提高了推荐系统的信度和可靠性。\n\
  \n**关键词：** 混合模型、机器学习、网络、个人特征、评论\n\n# 引言\n\n目前，媒体的消费在很大程度上取决于人们和评论家的评价和口味。但这很容易被那些想要让电影大火或失败的人通过垃圾邮件虚假评论来操纵和滥用。上映并被添加到\
  \ OTT 平台的电影会接受消费它们的用户和观众的评论和评分。用户对电影的口味是主观的，并且在不同的人之间存在差异。该领域主要基于网络安全。过滤虚假用户并封禁其\
  \ IP 地址是该系统的重点，该系统被添加到电影推荐系统中。\n\n虚假评论随处可见，这些虚假评论往往会干扰电影推荐模型的算法，并向用户提供错误的建议。虽然有多种技术可以过滤评论，但用户不断对即将电影发布虚假评论，这大大降低了电影推荐模型的效率。该系统旨在针对发布虚假评论的用户并使用\
  \ `I.P Blocking` 技术将其封锁，并使用这些来自真实账户的过滤评论来推荐电影，根据用户的电影口味提供更好、更无偏的结果。根据数据集中的 `Network`\
  \ 和 `Profile` 特征对发布评论的用户进行分析，并使用 `Hybrid Machine Learning model` 将其识别为虚假和真实账户。来自这些真实账户的评论被纳入电影推荐模型，该模型根据用户的口味和评论为其推荐电影。\n\
  \n该系统有助于减少由于负面人士传播的恶性宣传和评论导致的好电影观看量减少。这有助于识别和清理电影的背景和类型，因为虚假评论可能会引导观众偏离特定电影的实际内容。之前的系统仅通过\
  \ `NLP` 分析用户发布的评论来提供虚假评论检测，而不关注实际用户。虚假评论可以由同一用户从多个账户发布。实施现有的虚假评论检测系统并不是最优的。在许多已经识别出虚假用户的系统中，如果使用替代账户重复相同的操作，则无法控制用户。这些问题在所提系统中得到了解决。\n\
  \n本文其余部分的结构如下：第 2 节提供了所引用某些文献的摘要。第 3 节展示并讨论了建议的系统和模块。结果和性能评估在第 IV 节给出。在 V 部分得出了结论并讨论了潜在的改进。\n\
  \n## 文献综述\n\n该系统将来源、用户和文章作为输入，通过 `Multiview co-attention network model` (Qureshi\
  \ et al., 2021) 来验证新闻的信誉。提供了三个创新的表示组件来描绘消费者的个人偏见、新闻来源、政治偏见和新闻中的主题观点。根据实验结果，`Multiview\
  \ co-attention network model` 优于多个顶级模型，理解了各种虚假文章识别算法。\n\n该系统使用 `graph autoencoder`\
  \ 利用 `Graph Convolution Network` 的高水平内存和学习能力，识别准确代表电影推荐系统和电影评分数据添加评论的用户基本特征的特征 (Sun\
  \ et al., 2022)。彻底的实验证明，我们的方法 `PCA- Denoising Autoencoder Graph Convolution Network`\
  \ 与其他不同的电影推荐模型相比，实现了更高的准确率。\n\n为了对推文进行二分类，Parisa Bazmi et al., 2023) 建议了一个结合新闻出版物连接模式与用户个人特征的数据集。该特征集被用于\
  \ `machine-learning model` 中。为 Twitter 创建了一个 `COVID-19 dataset` 用于检测虚假新闻。该数据集具有独特的特征。这是一个社区数据集，除了背景外，还包含了推特者和发布者之间的链接。\n\
  \n该系统采用 `Logistic Regression`、`Naive Bayes`、`Decision Tree` 和 `Random Forest` 来产生用于识别虚假评论的标准模型。工作\
  \ (Abdulqader, et al., 2022) 将虚假评论视为一种欺骗类型，提供了统一的术语来解释欺骗组件，并在欺骗理论与用于虚假评论检测的选择及非语言指标之间提供了清晰的映射。\n\
  \n开发了一种全新的虚假新闻数据集构建过程 (Kang et al., 2022)。该数据集创建一个 `heterogeneous graph structure`\
  \ 来表示新闻、用户特征及其交互。为了解决韩国的虚假新闻问题，建议使用 `graph learning framework` 来有效利用来自新闻及其交互的用户和数据。\n\
  \n特征（从用户元数据和公共数据中提取的特征）已由 (Giuseppe D'aniello, et al., 2020) 进行分析，以观察社交媒体用户可靠性的预测程度；设计并实现了一个添加到用户个人特征中的用于将用户分类为可靠和不可信的\
  \ `deep learning model`，并在公开的数据集上进行了实验评估。\n\n这些方法关注用户发布的评论，而不是实际用户。虚假账户正在改进以产生真实的电影评论，这使得这些方法变得无关\
  \ (Premkumar and Sathya Priya, 2020)。虚假用户识别在之前的方法中尚未充分优化。\n\n## 提系统\n\n\n\n从图 1\
  \ 可以看出，该数据集包含通过共同 ID 连接的 3 个不同部分：用户画像数据集、评论数据集和电影数据集。用户信息数据集经过预处理以去除噪声数据，并提供给虚假用户分析模型。该模型使用\
  \ `Naïve Bayes Classifier` 从两个不同维度对数据集进行分析：网络维度和画像维度。网络维度将包含节点数量、IP 地址、边数量和社区数量等特征。用户维度包含已验证状态、账户恢复详情、支付详情以及在其他网站的账户活动等特征。\n\
  \n![图 1. 框图](img/fig25_1_B.jpg)\n\n图 1. 框图\n\n通过分析这些特征，模型可以从真实用户中识别出虚假用户。包含这些特征的模型通过\
  \ `Stacking Classifier Hybrid ML` 模型组合。该 `Stacking Classifier` 使用 `Logistic Regression`\
  \ 作为其 `Meta Classifier`。真实用户的评论通过评论数据集中标记的 `id` 进行识别。识别出的虚假用户会被追溯到其 IP 并屏蔽该 IP 地址。真实用户的电影评论被加载到\
  \ `Movie Recommendation model` 中。该数据集被转换为评分矩阵，其中仅包含真实用户的评分。该矩阵经过清洗和转换，以通过 `Principal\
  \ Component Analysis` 算法。该算法通过 `Denoising Autoencoder` 提取数据的隐藏特征，并结合了 `Graph Convolution\
  \ Network`。通过该模型，系统根据用户的喜好和评论推荐了电影。\n\n`PCA-DAECGN` 算法被用于电影推荐系统。评分矩阵及其转置从评论数据集中形成，并作为\
  \ `PCA` 模型的输入。`PCA` 模型的输出提供给 `Denoising Auto encoders` 以提取隐藏特征。特征通过 `GCN` 处理，为每个用户给出对应电影的预测评分。\n\
  \n#结果与讨论\n\n### 性能指标\n\n$$\\\\begin{matrix} \\\\begin{matrix} & {~Accuracy~ = \\\
  frac{TP + TN}{TP + FP + TN + FN}} \\\\\\\\ & {~Precision~ = \\frac{TP}{TP + FP}}\
  \ \\\\\\\\ \\\\end{matrix} \\\\\\\\ {Recall~ = \\frac{TP}{TP + FN}} \\\\\\\\ \\\\\
  end{matrix}}$$ \n\n$$~F1\\\\ measure~ = \\frac{2 \\ast ~Precision~ \\ast ~Recall~}{~Precision~\
  \ + ~Recall~}$$\n\n网络特征分析和用户画像特征分析使用 `Gaussian Naive Bayes Classifier` 通过 `n_model`\
  \ 和 `u_model` 处理，分别产生 75% 和 76% 的准确率分。随后将特征组合并使用 `naive Bayes model`（性能较好的单个模型）进行评估。这得到了\
  \ 86% 的准确率分。然后将组合的特征和模型提供给使用 `Logistic Regression` 作为元分类器的 `Stacking Classifier\
  \ Hybrid ML model`。预测概率的使用和主模型特征的使用被设置为 `True`。使用 `Stacking Classifier Hybrid model`，准确率达到\
  \ 98%，比现有的高性能模型提升了 12%。\n\n![图 2. 不同模型与混合模型的准确率评分对比](img/fig25_2_C.jpg)\n\n图 2.\
