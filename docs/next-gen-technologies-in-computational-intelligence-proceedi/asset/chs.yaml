  \nElizabeth Leah George^(39)\n\nDOI: [10.1201/9781003430452-50](https://dx.doi.org/10.1201/9781003430452-50)\n\
  \n## 摘要\n\n\n\n\n社交媒体是中老年人之间社交、沟通和维持友谊的新趋势。人们花费大量时间在屏幕上进行互动，数字空间中的对话通过短信、Instagram\
  \ 帖子、Facebook 评论以及 Twitter 推文进行，这使得难以理解无法解释的情绪变化。这项小型研究调查了社交媒体影响不同年龄组个体间社会比较的不同方式，以及这种影响如何影响他们的整体身心健康。该研究特别关注了使用社交媒体带来的社会比较的数字范式转变。该研究通过问卷作为主要数据，探索了社交媒体的使用频率、网络欺凌、睡眠模式、恐惧症（FOMO）和自我认同。带有准确性参数的与健康相关的推文进行分类可以联系健康数据分析。通过数据可视化来理解数字健康影响最大的参数对社交媒体具有重要意义。\n\
  \n**关键词：** 社交媒体、心理健康、情感分析、朴素贝叶斯、K 近邻算法 (`KNN`）、支持向量机 (`SVM`）、逻辑回归、数据可视化\n\n# 引言\n\
  \n社交媒体是一个以不同通信形式捕捉用户即时情绪的论坛。在皇家公共卫生学会的一项名为 `#status of Mind` 研究中，精神疾病被视为严重的公共健康问题。许多抑郁症患者未被检测到。各种理论和研究发现其对社会关系具有深远影响，这可以帮助青少年应对青春期的挑战，减少面对面的交流，在网上自由表达观点，以及互联网通信中的匿名性对身份形成的影响。数字平台允许所有不同年龄组的人在全球范围内相互连接，对人的身体和情绪健康都产生了影响。\n\
  \n个体的心理健康取决于其年龄组、性别、职业和社交环境。正如一个人的心理健康受到饮食习惯、生活方式、睡眠模式和课外活动的影响一样，社交媒体的使用也影响着他们。本研究旨在分析社交媒体的使用如何影响个体的心理健康，无论年龄是\
  \ 14 到 45 岁。\n\n## 相关文献\n\n`Hilal Bashir (2017)` 的回顾了社交媒体与心理健康之间的关系，每天使用超过 2 小时的青少年，探讨了社交媒体与心理健康之间的关联，关注了社交关系、焦虑、压力、抑郁和孤独。`Stones\
  \ (2019)` 的研究提到了青少年面临网络欺凌、形象担忧、睡眠不规律等由于社交媒体导致的心理健康问题，并为每个问题提供了宝贵的解决方案，如减少屏幕时间、展现真实（无化妆无滤镜）、举报侮辱性内容等。`Mireya\
  \ Marquez (2022)` 的最新研究展示了千禧一代（1981-1995）和 Z 世代（1996-2012）之间的对比，使用了伯根社交媒体成瘾量表、贝克抑郁量表\
  \ (`BDI`) 和广泛性焦虑 7 项量表 (`GAD7`)。\n\n## 方法论\n\n这里收集的信息分为两类：原始数据和次级数据。\n\n### 原始数据的收集\n\
  \n数据通过在不同年龄组在线调查收集，目标年龄范围从 14 到 18 岁、18 到 30 岁、30 到 45 岁以及 45 岁以上。他们被调查了屏幕时间使用情况、常用平台以及他们的身心健康。调查完成后收集了\
  \ 275 份回复。调查关键问题的结果如下：总回复中 141 人 (51.3%) 为女性，134 人 (48.7%) 为男性。响应率最高的是 18 到 30 岁的受访者，共\
  \ 213 人 (77.5%)；最低的是 30 到 45 岁的受访者，共 18 人 (6.5%)。社交用户的使用模式显示社交媒体时间为 2-3 小时 (41.8%)、3-5\
  \ 小时 (25.1%) 以及 5 小时 (19.6%)。根据我们的调查，207 人 (75.3%) 受访者选择 Instagram 作为最常用的应用程序，这与它是最广泛使用的社交网络应用之一的事实一致。WhatsApp\
  \ 是第二受欢迎的应用程序，206 人 (74.9%) 几乎每个人都在使用。其他一些频繁使用的应用程序包括 Facebook、LinkedIn 和 YouTube。\n\
  \n### 次级数据的收集\n\n（原文在此处结束。）\n\n\n\n\n通过网络爬虫利用关键词 `#mentalhealth`、`#mentalhealthandwellbeing`、`#healthandwellbeing`\
  \ 和 `#MHSM` 从 Twitter 提取二次数据。从带有 `#mentalhealth`、`#mentalhealthandwellbeing`、`#healthandwellbeing`\
  \ 和 `#MHSM` 标签的推文中总收集了 1531 条推文作为二次数据。对这些推文进行了随机采样，将数据集按 80-20 的比例分配测试，并对所有分类器进行了训练和评分。情感分析（也称为计算语言学的意见挖掘）使我们能够确定提供数据的倾向，无论是正面、负面还是中性，如图\
  \ 2 所示。机器学习算法可以进行预测、发现隐藏模式并提高性能。我们采用了一系列机器学习技术，包括 `Naive Bayes` 分类器、`Logistic Regression`、`Support\
  \ Vector Machines (SVM)` 和 `K-Nearest Neighbors (KNN)`，来分析我们的数据集。\n\n![图 2. 心理健康关键词的情感分析](img/fig50_1_B.jpg)\n\
  \n图 2. 心理健康关键词的情感分析\n\n## 结果与讨论\n\n所讨论的实验和结果是方法论的结果。提到了对收集数据的预处理、分类评分、样本影响衡量以及情感建议。从\
  \ Twitter 提取的关键词基于心理健康关键词，如 `#mentalhealth`、`#mentalhealthandwellbeing`、`#healthand\
  \ wellbeing` 和 `#MHSM`。对上述关键词进行了情感分析以寻找关键词的极性。通过 `Gephi` 对同一数据集进行分析，根据（文本-位置）、（用户-文本）和（用户-位置）三个类别来发现有影响力的节点，如图\
