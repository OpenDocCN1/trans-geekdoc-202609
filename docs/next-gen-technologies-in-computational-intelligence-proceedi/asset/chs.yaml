  ## 结论\n\n\n\n\n空中编程（`OTAP`）已在移动手机中广泛采用，通过无线技术（`WiFi/4Getc`）传输固件更新。在疫情驱动的世界里，OTA\
  \ 对基于物联网的无线传感器网络（WSN）产生了巨大的影响和重要性，这对远程监控和控制提出了更高要求。基于物联网的 WSN 由多个传感器节点组成，每个节点由与微控制器和无线收发器连接的传感器组成，用于并无线传输有关感兴趣区域的信息，并执行相应的执行或控制动作。OTAP\
  \ 使得能够在远程部署的物联网（`IoT`）网络上通过空中动态闪存程序代码。这提供了在空中进行重新编程的灵活性，可以为现有代码添加新功能、修复漏洞或解决安全漏洞。\n\
  \n这项工作侧重于温室的远程监控。温室是一个闭式结构，通过控制室内外环境为植物生长提供最佳条件。温室的墙壁由玻璃或塑料等透明材料制成。为了实现植物的最佳生长，必须考虑几个关键参数，包括土壤水分、湿度、大气和土壤温度、阳光可用性以及空气中的二氧化碳浓度。这项工作特别关注影响植物生长的两个参数：温度和湿度。使用\
  \ `SENSEnuts` 物联网平台，我们在温室内部不同位置在不同条件下测试了传感器节点。我们提出的在温室监控中采用空中编程，以便根据需要远程编程 `SENSEnuts`\
  \ 节点。本文的结构如下：WSN 架构、文献综述、建议系统、方法论、在各种测试条件下获得的结果以及结论。\n\n## 文献综述\n\n在之前的工作（Sangeeth\
  \ et al., 2016; Ramesh et al., 2013）中，OTAP 方法已在远程触发实验室中实现，能够在不需要节点与系统之间建立物理连接的情况下实现结果的实时视频流。根据评估，50%\
  \ 的学生认为性能优异，41% 的学生认为非常良好。开发的下一个阶段涉及将压缩算法集成到 OTAP 方法中。\n\n根据 Lata et al., (2020)，`SENSEnuts`\
  \ 无线传感器节点与无线传感器网络一起使用，用于监控微型温室实验室模型内的温度和湿度。该系统经历了各种测试场景，被发现具有低功耗、低成本和用户友好的方法，可实时监控温室内的气候状况。\n\
  \n对 OTAP 的全面综述包括了在 WSN 应用中使用的最新 OAP 协议的讨论以及测试平台的实现（（Qandour et al., 2012; Ramesh\
  \ et al., 2013; Steyn & Hancke, 2011; Hellbruck et al., 2011; Doddavenkatappa et\
  \ al., 2011)），这些内容在这些工作中中提出（Quadri et al., 2014）。空中编程是解决漏洞、更新代码和管理需求变更的关键过程。\n\n\
  该项目（Frisch et al., 2017）旨在通过开发和发布加密固件更新，为 `ESP8266` 微控制器创建一个可靠且稳健的系统。此外，正在努力扩展和改进系统的功能和安全性，最新的进展侧重于增强安全特性。\n\
  \n一篇文章（Kilaru et al., 2022）讨论了无线传感器网络（WSN）的利用和天气预报，以及物联网（`IoT`）如何实现自动化灌溉。此外，该系统可以适应于温室监控中的植物安全。作者建议，该系统可以提高农业效率和产量。\n\
  \n## 基于物联网的 WSN 架构\n\nWSN 涉及在特定区域部署大量节点，其范围从数百到数千不等。WSN 涉及在特定区域部署大量节点，其范围从数百到数千不等。传感器节点通常包括传感器、处理单元和通信单元，如图\
  \ 1 所示。该系统采用 `Zigbee` 协议并符合 `802.15.4` 标准。\n\n 建议系统与方法论\n\n建议的 WSN 系统由在感兴趣区域部署的多个\
  \ `SENSEnuts` 节点组成。每个节点符合 `802.15.4` 标准并在某些测试条件下传输数据，如单跳（直接传输）和多跳（通过中间节点到达网关），如图\
  \ 2 所示。\n\nTL（温度、光）接口传感器节点被部署用于监控特定区域。传感器节点被策略性地放置在不同距离，以便测试 `SENSEnuts` 的 OTAP。网关节点通过协调器代码收集数据。网关模块用于编程所有传感器节点并与网络连接。TL\
  \ 传感器可以收集 `TMP102` 温度传感器的数据，其范围为 -25 °C 到 80 °C，分辨率为 12 位。\n\n`SENSEnuts` 网关节点如图\
  \ 3 所示，该利用空中编程（`OTAP`）的温室监控系统包含了一个无线 `802.15.4` 模块和一个 USB 网关模块。该节点由电池供电，配备了两节 1.5V\
  \ AA 电池，装在保护塑料壳内以防止环境条件的影响。\n\n\n\n\n*   **步骤 1**: 编译后的新程序二进制文件（OTA 代码）被划分为每个 64\
  \ 字节的数据包，并最初通过线缆（USB）串行传输到 PAN 协调器（网关节点）。每个传输的数据包都会经过确认和校验和验证，一旦整个二进制文件传输完成，新固件将被刷入\
  \ PAN 协调器中。\n* **步骤 2**: PAN 协调器现在开始搜索网络并扫描连接到网络的传感器设备（协调器），通过以 64 字节为包传输编译二进制文件，逐个对传感器节点进行编程。\n\
  \n## 实现\nOTAP 通过在无线网络上传输数据包来实现节点编程，允许每个节点通过接收的数据包进行自我编程，而无需持续连接电脑。收到的数据包组合在一起后存储在节点（mote）的\
  \ EEPROM 中。当向 PAN 协调器发送修改或更改特定代码的任务时，起始地址页将从闪存跟踪并缓存到处理器内存中。随后协调器节点重启并运行新刷入的程序代码。\n\
  \n对于每次数据传输，都会从 PAN 协调器发送和接收 64 字节的数据，并向 PC 提供确认，指示数据是否已接收，如图 5 所示。\n\n![图 5. 每 64\
  \ 字节作为数据包传输到 pan 协调器的二进制代码文件](img/fig32_5_B.jpg)\n\n图 5. 每 64 字节作为数据包传输到 pan 协调器的二进制代码文件\n\
