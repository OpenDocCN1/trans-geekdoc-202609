  \ | --- | --- | --- |\n| 环境传感器数据 | 59 MB | 9 | 165 | 23 MB |\n| 烟雾检测数据 | 5.20 MB\
  \ | 15 | 67.6 | | |\n| 智能手表数据 | 474 KB | 12 | 21.34 | 243 KB |\n\n### 实验结果\n\n本节介绍了通过深度自动编码器实现机器学习后提供的实验结果。此部分包含了用于检查性能的不同指标，这些表\
  \ III 所示的准确率（Accuracy）、精确率（Precision）、F1 分和召回率（Recall）。精确率和召回率是评估二分类模型性能的两个重要指标，该模型将示例分为两个类之一，通常标记为正或负。\n\
  \n精确率计算模型进行的所有正预测中真正预测的比例。其计算公式为：\n\n(5)\n\n```$$Precision = \\\\frac{TP}{TP + FP}$$```\n\
  \n召回率计算数据集中所有实际正样本中真正预测的比例。其计算公式为：\n\n(6)\n\n```$$Recall = \\\\frac{TP}{TP + FN}$$```\n\
  \nF1 分是评估二分类模型性能常用的指标，是精确率和召回率的平均值。其计算方式如下：\n\n```$$F1\\\\ Score = \\\\frac{(2 \\\
  \\ast Precision \\\\ast Recall)}{(Precision + Recall)}```\n\n其中 `TP` 代表真正，`FP` 和\
  \ `FN` 分别代表假正和假负。\n\n从表 3 中我们可以得出结论：深度自动编码器机器学习仅适用于大型数据集，而不像智能手表数据那样的小数据集。在处理较小数据集时，模型的性能和准确率未达到标准。通常情况下，高\
  \ F1 分表示所提模型在精确率和召回率方面表现良好。性能指标在图 3 中以 0 到 1 颜色刻度的图形表示形式显示。`D1` 到 `D3` 分别代表表 3 所示的数据集。\n\
