  \ and Farrukh (2012) 数据挖掘技术（DMTs）可以早期预测医疗数据集以拯救生命。\n\n14. Pavalarajan, S., and Krishna\
  \ Moorthy (2016) 现实应用使用了许多医疗数据集。\n\n15. Adhi Lakshmi, R., and Pavalarajan (2017)\
  \ 机器学习可以预测疾病并发现角膜溃。\n\n16. S. Adhi, and Pavalarajan (2018) 提出了一种用于识别角膜疾病的系统。\n\n\
  17. Pavalarajan, S., and Prasanth, A (2019) 预处理、特征提取和分类都是所提系统的一部分。\n\n18. Kong,\
  \ L., Pan, J., Tsai, S., and Sung, T (2022) 随后的仿真结果显示所提模型具有很高的准确率。\n\n19. Veluchamy,\
  \ Kavitha, and Malathi (2021) 计算智能中的下一代技术 [NGTC-2023]\n\n\n\n角膜溃疡通常由眼科医生使用裂隙灯和适当的荧光染剂进行检测。只有在相关图像经过适当染色后，眼科医生才能进行操作，这使得对角膜溃疡预后的做出准确预测变得困难。另一方面，在预测角膜溃疡的结果方面，无法以任何准确程度确定或检测溃疡的大小。角膜溃疡的正确诊断以及溃疡区域的精确分割都是实证确定角膜溃疡严重程度过程中的必要步骤。因此，如果角膜溃疡能够可靠地检测并自动分割，将对医疗诊断非常有益（Iorliam\
  \ et al., 2021）。了解如何区分不同类型的眼问题是有效治疗它们的关键。研究人员正努力开发一种能够识别和区分眼部区域并分类各种眼疾病的 AI 系统。目前已发表了几种方法（Campagnini\
  \ et al., 2022; Karuna & Shilpy, 2022; Kim & Armstrong, 2022; Mujeeb Rahman et al.,\
  \ 2022），可用于确定角膜溃疡的位置，然后将其划分为单个溃疡。这种图像处理技术涉及使用数字相机拍摄患者面部图像，以确定是否存在角膜溃疡。在裁剪、人脸识别和眼睛识别后，这种特定的图像处理方法采用卷积神经网络（`CNN`）建模，根据这些特征区分角膜溃疡和非角膜溃疡（Padhy\
  \ et al., 2022）。我们提出了一种利用机器学习技术的新型自动眼病识别系统。该算法通过分析从多个角度从患者收集收集图像，自动检测角膜溃疡的存在和位置。\n\
  \n## 相关工作\n\n角膜溃疡发生在角膜上的炎症反应，是一种常见的眼部疾病。角膜溃疡的特征是增厚、瘢形成和压痛（Rampat et al., 2021）。包括病毒、真菌、细菌和阿米巴在内的感染病体是导致角膜溃疡（CU）的主要因素。剧痛、眼睑下垂和畏光是与该状况常见的症状。学习和记忆很大程度上依赖于大脑神经元的协调活动（Roshini\
  \ & Kiran, 2022）。此外，已证明神经元网络中信息的有效处理需要同步神经活动的可靠传播（Huang et al., 2022）。\n\n对自发 fMRI\
  \ 数据区域同步性的检查是区域同性（`ReHo`）指标最常见的应用之一。在评估视力障碍人士脑活动水平的先验研究中，发现这种方法是有益的（Wani et al.,\
  \ 2021）。这项研究的目的是确定患有角膜溃疡的个体是否存在脑活动异常同步的症状，以及在这些行为的生理相关方面是否观察到任何差异。\n\n## 提方法\n\n\
  我们提出了一种利用深度卷积神经网络（`DCNN`）和支持向量机（`SVM`）等机器学习技术的新型自动眼病识别系统。\n\n### 预处理\n\n图像从网上获取，质量、分辨率和文件格式各不相同。这些图像被缩小到\
  \ `256 x 256` 以提高质量并简化特征提取。初始眼睛照片的尺寸需要从 `64 x 64` 扩大到 `256 x 256` 才能开始。有很多网站有显示各种疾病的图片，但我们没有时间处理所有这些，因此我们将使用最不可用的一个作为示例。照片调整大小后，接下来使用裁剪工具移除任何包含眼睛的面部，然后应用中值滤波平滑效果。中值滤波是一种用于减少图像中存在的刺眼噪声的方法，同时保持图像基本元素和边界区域的完整性。当此滤波器应用于图像时，与被处理像素相邻像素的中位数强度值将替代该像素的原始值。在对这些图像进行处理后，可以使用它们的数据训练卷积神经网络（`CNN`）。这使我们能够自动地区分角膜溃疡疾病和其他不影响角膜的其他类型的溃疡。\n\
  \n## CNN-SVM 分类\n\n`CNN-SVM` 是 `CNN` 和 `SVM` 的结合。`CNN` 使用的模型结构已从传统的 `CNN` 模型结构变为带有全局平均的连接连接网络。这种调整的影响是减少了\
  \ `CNN` 模型参数的数量以及计算结果所需。其次，在测试阶段没有使用 `Softmax` 函数，而是使用了非线性支持向量机（`SVM`）。如 Fig. 1\n\
  \n`Fig. 1. Improved CNN-SVM`\n\nFig. 1. Improved CNN-SVM\n\n![Fig. 2. Improved CNN-SVM](img/fig12_2.jpg)\n\
  \n`Fig. 2. Improved CNN-SVM`\n\nFig. 2. Improved CNN-SVM\n\n具有全连接网络的传统 `CNN` 可以被视为单层前馈网络的扩展。`flatten`\
  \ 函数可以将维度为 `6 x 6 x 32` 的多维数组转换为 `1 x 1 x 32` 数组，从而实现更高效的处理。在大多数情况下，全连接层具有深度为二或三层的隐藏层。\n\
  \n输出层（也称为输出类）由 256 个节点组成。两个隐藏层中的每一层都有 256 个训练参数，因为它们都拥有 512 个节点。由于这三个层都由激活函数连接，因此有\
  \ 512 个节点激活值可训练，因为这种特定的神经网络深度只有五层可以存储在全连接层中是 724,334。\n\n```\n(6 * 6 * 32 + 1) *\
  \ 512 + (512 + 1) * 256 + (256 + 10) = 724,334\n```\n\n\n\n组件的连接过程可能是复杂的，并且需要大量的计算能力。由于全连接层中的误差，典型的\
  \ `CNN` 在处理高分辨率图像时难以准确地进行计算。针对这一问题，提出的解决方案涉及消除全连接部分，并将其替换为一种基于全球范围内平均池化思想的解决方案解决方案。全局平均池化特征图的大小应为\
  \ `1 x 10`，这与全连接层的输出输出相同。由于 `CNN` 计算需要全连接层，因此在训练阶段之后，所有层将具有相同的输入和输出特征图。生成的二维表示的维度为\
  \ `1 x 1 x 10`。输出特征图的维度为 `1 x 1 x 10`，而全局平均池化层的维度为 `6 x 6 x 32`。为了得到值为 `1` 的结果，必须将\
  \ `6 x 6 x 32` 的值减少到 `1 x 1 x 10`。\n\n一个维度为 `6 x 6 x 10` 的正方形替换了维度为 `6632` 的图像。为了更好地满足该应用的需求，创建了一个\
  \ `1 x 1 x 3210` 的过渡卷积层。卷积核使用了步长为 `1` 尺寸为 `1` 的 `Same` 填充模式。此外，卷积核的大小为 `1`。过渡卷积层负责通过增加或减少输出通道数来改变输入特征图，同时保持图像尺寸不变。图\
  \ 2 显示有 32 个卷积核和 32 个输入通道。由于元素图是 32 个信息通道之和，我们需要通过包含 `3` 组每个包含 `16` 个卷积片的唯一卷积位束，将组件图的大小从\
  \ `140` 减小到 `10`。在 `16` 个卷积核组中，总共有 `(32 x 11)` `320` 个不同的卷积核。核的输出值必须大于 `0`，以确保它不包含连通组件，从而赋予其值为\
  \ `10`。\n\n一种新的空间域表示使得卷积过滤成为可能。以 `32` 个 `66` 输入特征图为基础，我们能够使用 `32 x 1 1` 过滤器执行卷积计算。即使在整个\
  \ `11` 次卷积过程中保持输入特征图的尺寸，我们仍然能够收集整组 `32 x 6` 的图。这是输入图与自身混叠的结果。之后，来自 `32` 张具有 `66`\
  \ 特征的图被组合在一起，创建一个总共具有 `66` 特征和 66 特征的单一图。使用卷积核来构建作为该过程最终输出的十个特征图。通过结合来自广泛来源的数据，“全局平均”更加准确。全局平均是通过对十个不同的池化核取平均计算的，每个核由一个具有\
  \ `66` 个属性的图表示。对于具有许多可能结果的现实情况，该技术系统可以更精确地估计概率。每个输入数组通道将由`Global Average Pooling\
  \ Layer`合并。这是通过对所有通道取平均值，生成一个代表每个输入特征图总体平均值的数值来实现的。如果作为全局平均池化层，将对每个输入图像应用相同数量的通道。它的尺寸、步长和填充模式均设置为\
  \ `6 x 6`（或 `66`）。毫无疑问，利用全局平均池化的 `CNN` 变体是最佳方法。这是因为标准的 `CNN` 模型使用了一个全连接层。由于全局平均池化显著减少了训练参数的总数，`CNN`\
  \ 模型将更加准确。只需要 `330` 个变量即可完成这一涉及连接世界各地中点的阶段情况。\n\n为了提高深度学习的性能，有人提议 `CNN- SVM` 模型可以通过减少层与层之间的连接来完成相同任务。通过改进模型和引入新技术，`Upstarts`\
  \ 在保持传统 AI 技术方面活力的同时，在 AI 技术领域取得了令人瞩目的进展。\n\n## 原始数据输入层\n\n过程的第一阶段是对比数据的归一化和标准化。这一步的目的是确保没有离群值会在后续训练中产生问题。\n\
  \n## 特征提取层\n\n能够从示例中学习的计算机程序是深度学习网络。贯穿整个过程的可靠特征提取层是 `CNN` 模型的基础。该网络使用各种卷积、激活和池化层构建。卷积层、初始化层和池化层可以堆叠起来以形成深层组件提取层，但具体细节取决于所使用的指示仪器。\n\
  \n## 全局平均池化层\n\n### 概述\n\n全局平均池化方法及其所属的卷积层的主要目的是缩小特征图尺寸。结果是从每个样本中获取更多信息，并用较小的图表示较大的序列。全局平均池化层将生成一个具有\
  \ `n` 个值的矩阵。由于我们正在处理分类问题，并且数据集中有 `n` 个类，使用该公式，可以在生成矩阵后得到所需的结论：\n\n$$\\text{Avg}_{\\\
  text{Pooling}}=\\frac{1}{c}\\sum_{i=1}^{c}X_{1:h,1:w,i}^{l}$$\n\n其中：\n*   `Avg_Pooling`:\
  \ 特征图的全局估计\n*   `l`: 特征图索引。\n*   `c`: 平均池化核的总值。\n*   `1:h`: 高度方向的池化范围。\n*   `1:w`:\
  \ 宽度方向的池化范围。\n*   `h`: 卷积层特征图的高度\n*   `w`: 卷积层特征图的宽度\n*   `X[1:h,1:w,i]^l`: 全局平均池化核元素的值\n\
  \n\n\n## 结果与讨论\n\n为了进行我们的计算，我们使用了五折交叉验证技术。`Tensor flow`作为一个深度学习框架被应用于此实验。我们的神经网络是在主频为\
  \ 2.20 GHz 的 `Intel Core i7-8750H` 处理器以及显存为 4 GB 的 `NVIDIA` 显卡上训练的。在 `CUDA10.0`\
  \ 和 `CUDNN7.6` 的帮助下，我们成功完成了模型。在模型训练过程中，数据集以完全随机的方式进行了分割。为了训练模型，每个数据集被独立使用。在实验进行期间，分辨率为\
  \ 256x256x3 的图像被输入到网络。我们选择了 `Adam` 优化器，并为其确定了初始学习率为 0.0001。荧光素用于对 712 张采集图像进行染色，这些可以在\
  \ `Sustech-Sysu` 存档中找到。眼表图像是从中山大学中山眼中心的患者处采集的。尽管根据症状诊断溃疡疾病非常有挑战性，但我们的方法取得了良好的的结果。实验结果表明，该方案优于其他方法，这通过该方案具有优越性得到了证明。这种\
  \ `CNN-SVM` 为角膜溃疡提供了更好的检测和分割。这些网络被用于角膜溃疡的检测和分割。\n\n\n\n在本文中，可以使用人脸图像通过系统准确地诊断角膜溃疡疾病。该诊断是基于人脸图像进行的。该方法的执行过程中利用了卷积神经网络（CNN）。我们的方法利用基于特征的级联分类器，根据面部图像对眼睛区域进行自动分类。传统方法能够识别使用其他用途数字相机拍摄的图像中的角膜溃疡疾病。为了确定是否患有角膜疾病，结合\
  \ CNN 方法对眼睛的若干种结构进行了评估。如果存在疾病，当我们实施这项技术时，溃疡区域将自动被分割。还使用了数据增强方法，以增加数据集的总尺寸以及训练数据的视觉多样性。这样做是为了为机器学习应用准备数据集。原始图像的处理方式与增强后图像的处理方式相比，可见是一个巨大的改进。\n\
