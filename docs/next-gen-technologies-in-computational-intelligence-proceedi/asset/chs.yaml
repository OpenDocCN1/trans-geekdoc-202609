  \ 摘要\n人工智能可以自动化任务并简化复杂的流程，根据评论做出决策。人工智能在网站中的应用为客户提供了用户友好的方法。本文重点关注如何构建一个网站。\n\n\
  # 引言\n人工智能在商业和社会中的变革性潜力是不言承认的。人工智能就像互联网和智能手机一样，是一种对我们生活的各个方面产生深远影响的推动技术。一个完全开发的软件项目能够让用户使用，这是一个在线网络管理系统。\n\
  \n关键词：AI 工作室、协作网站、Web 应用、推荐系统\n\n\n\n\n\nAI 算法现在正在评估用户数据，并影响着数百万人在贷款利率、就业和刑事司法等领域的决策过程（Vijayaraghavan\
  \ et al., 2021））。它们在各种业务领域中扮演着至关重要的作用。然而，它们仍然存在可能导致歧视（Akter & Wamba, 2016）和错误决策的缺点。例如，新闻推荐和在线网站针对特定受众的算法近期因加剧了平台知识多样性的匮乏而受到大量媒体关注（S.\
  \ I. et al., 2020）。一个重要的问题是，通过算法运行的决策系统提供的是相关信息和最佳选项本身，而不是像推荐系统那样让用户根据推荐项目列表进行选择。为了引起这一注意，并减轻新兴\
  \ AI 自主系统可能产生的潜在负面影响，Vlasselaer 等人（2015）提议使用结合了机器学习模型和人类专家知识的协作任务表示法。他们提供了具有主动计算辅助的交互式系统实例。他们认为，情境感知系统不应取代人类决策。为了确保系统及其用户的问责制，他们主张赋予用户对系统的控制权。透明化可以通过为决策提供关键信息（这些信息是终端用户无法获得的）来帮助避免盲目信任（Ignatov\
  \ et al., 2019）。算法开放性和可解释性的优势是多方面的，包括检测偏见和成见（Bahnsen et al., 2015；Dhanalakshmi &\
  \ Devi, 2020））、增强用户对系统行为的认知（S. I. et al., 2020）、由智能系统提供易于理解的操作（K. N. et al., 2020）以及确保用户的问责制（Ignatov\
  \ et al., 2019）。目前也有越来越多的证据强调了算法决策的负面影响，特别是在歧视和法律挑战方面。因此，研究人员正主倡让 AI 接受法律监督和问责，以促进开放性和透明度（Halbe\
  \ & Joshi, 2015）。推荐系统常见于新闻频道、社交网络网站和电子商务平台，在消费者的日常在线活动中已变得越来越重要。通过提出更多我们想要的内容，从我们的偏好和偏见中学习的机器学习算法增强了这些偏好和偏见。\n\
  \n尽管“推荐系统”一词看起来可能是全新的，但它最早用于 20 世纪 90 年代。他的早期研究灵感来自人们在面对互联网海量信息时寻找和选择产品所面临的挑战，集中在信息检索、预测理论、管理和营销，这些都与认知科学相关（Vijayaraghavan\
  \ et al., 2021）。\n\n结果，推荐系统已演变成一种商业机会，它利用可以获取的海量数据和知识来产生预期利润，同时也解决了问题。许多人将当时开发的\
  \ Tapestry 认为是第一个推荐系统。因为在这种方法中，信息是由一个团队共同协作过滤的，因此他创造了“协作过滤”一词。最初，“协作过滤”一词用于指任何建议技术，但创建者们开始将其称为“推荐系统”，因为并不是每个系统都需要使用协作技术。现在我们经常使用的几乎每个服务都使用了推荐算法，包括社交网络、电子商务甚至应用商店。尽管存在差异，但它们都有一个共同点：处理数据的必要性。\n\
  \n\n\n` 块是一个关于**使用 LSTM 进行股票价格预测的相关性和情感分析**的标题和参考文献列表。\n\n由于您的指令是“将给定英文文本翻译成中文”，我将为您翻译那段关于**协同过滤**的正文。以下是翻译结果：\n\
  \n[content]\n此网页是使用协同过滤技术生成的。创建一个能够根据相似用户的兴趣向客户推荐产品的系统，第一步是识别相似的个体或物品。第二阶段涉及预测用户对尚未评分的产品进行评分。被称为“协同过滤”的方法集合使用了多种方式来寻找可比的个体或对象，并使用多种方式生成与相似用户评分相关的评分。协同过滤并不通过利用参数来计算相似性，此类数据的示例可以是用户年龄、电影类别或客户或商品的任何其他相关细节。产品的显性或隐性评分被用于计算相似性。评估结果准确性的的一种技术是查看预测值与实际值之间差的平均值的平方根，通常称为\
  \ `RMSE`，它允许用户对具有先前识别评分值的消费者配对测试数据集进行评分预测。误差则是已知值与预测值之间的差异（图 4）。\n\n计算 `RMSE` 涉及计算测试集中所有标准误差平均值的平方根。\n\
  \n为了计算客户 (`U`) 可能分配给物品 (`I`) 的评分 (`R`)，遵循以下步骤：\n\n*   识别与用户 `U` 评价过同一产品 (`I`) 的其他用户。\n\
  *   使用这些用户的评分计算 `U`（用户）分配给物品 `I` 的 `R`（评分）。\n*   算法利用一个与用户 `U` 具有相似性的用户列表来确定他们对给定产品\
  \ `I` 的评分 (`R`)。\n*   根据算法，用户 `U` 为物品 `I` 提供的评分 (`R`) 预计接近与用户 `U` 相似度最高的前 5 名或前\
  \ 10 名用户对 `I` 给出的评分平均值。\n\n用于计算 `n` 个用户提供的评估平均值的公式表示为：\n\n(1)\n\n$$R_{U} = (\\sum\\\
  limits_{u = 1}^{n}R_{u})/n$$\n\n确定 `n` 个可比用户提供的平均分公式如下所示：\n\n平均评分 = `n` 个相似用户提供的评分总和\
  \ / `n`\n\n换句话说，`n` 个可比用户提供的平均评分可以通过将他们给出的评分总和除以与用户 `U` 相似的用户数量获得。上述方程经常被用于协同过滤方法，通过考虑可比用户提供的评估，来预测用户可能分配给特定物品的评分。\n\
  \n## 结果与讨论\n\n在网站中实施基于 AI 的算法极大地促进了摄影工作室业务利润的增长。这些算法帮助客户根据用户的评论和评价选择合适的工作室。结果，工作室\
  \ Web 应用程序与消费者联系起来，允许他们根据用户评论和评分从网站上选择所需的产品（图 53.5 和 图 53.6）。\n\n![图 5. 客户预订产品](img/fig53_5_B.jpg)\n\
  \n图 5. 客户预订产品\n\n![图 6. 客户查看感兴趣的产品](img/fig53_6_B.jpg)\n\n图 6. 根据用户建议查看感兴趣的产品\n\n\
  ![图 7. 支付表单](img/fig53_7_B.jpg)\n\n图 7. 支付表单\n\n## 结论\n\n通常，人们会向朋友或家人推荐物品。如果用户对某个产品产生怀疑，这是最佳的购买方法。无论如何，几年后当一切数字化后，人们不再依赖朋友，也信任提供近似建议的在线网站。在本文中，完成了一个\
  \ Web 应用项目的完整推荐系统流程。然而，该模型远非完美，它展示了推荐系统如何从多个类别中过滤信息。如果能在未来的推荐系统中构建此类深度神经网络，这些推荐系统可能会更成功。\n\
