  \n# 引言\n近年来，技术的进步为底栖生物检测提供了新机会，例如声学和光学传感器、水下自主载具以及机器学习。底栖带作为水生态系统的底层，是海洋和淡水环境的重要组成部分\
  \ (Yang 等人, 2020)。底栖社区包含多种生物，包括植物、无脊椎动物和微生物，它们在营养循环、沉积物稳定和生态系统整体健康中起着关键作用 (Kumari\
  \ 等人, 2019)。因此，识别和跟踪底栖生物对于确定水生态系统的健康至关重要 (Huang 等，2019)。然而，传统的底栖调查技术如拖网和视觉检查耗时、昂贵，且对底栖生态系统有害。这项工作探索了利用单阶段目标检测器\
  \ (SSD) 检测水下底栖生物的技术 (Bochkovskiy 等人, 2020)。建议的方法涉及使用底栖生物标注图像来训练模型 (Zhang 等人，2021)。然后用该模型检测和分类底栖生物。如今，非物理模型图像增强和基于物理模型的恢复是水下图像改进和恢复的两大类。本文包含四个主要阶段。第一阶段获取底栖环境的水下图像。第二阶段对图像进行预处理。图像预处理是底栖生物检测的关键阶段，因为它有助于提高数据集的标准和分析适用性\
  \ (Zhang 等人, 2020)。第三阶段，使用标注图像训练 SSD 模型识别物体 (Bochkovskiy 等人, 2020)。训练过程涉及调整模型的权重和参数以优化性能。第四阶段涉及底栖生物检测的过程。一旦模型训练完成，即可用于检测和分类海胆、海星、螃蟹和珊瑚等底栖生物。\n\
  \n## 相关工作\n\n\n\n\n\n深度学习模型在检测并发处理大量数据的能力以及在挑战性环境下从照片提取信息方面更为有效。周天（Tian Zhou）等人描述了“基于前视声纳图像的水下小目标自动检测”。前视声纳是探索水下目标的基础工具之一。本文提出了一种基于聚类、分割和特征区分的自主水下目标识别技术。实验结果表明，该技术具有低检测误差率、良好的实时性能和低误报率等特点，与当前主流的深度学习算法相当（Zhou\
  \ et al., 2022）。Yeh et al. (2022) 在“用于颜色转换与水下物体并发学习的轻量级深度神经网络”中描述道，水下图像处理在水生态研究中巨大潜力。为了成功学习水下照片的颜色转换和物体检测，必须提供深度模型。实验结果显示了我们在`Raspberry\
  \ Pi`平台上的实现（Yeh et al., 2022）。Athira. P 等人（2021）描述了“基于`YOLOv3`架构的深度神经网络水下物体识别模型”，这是一种使用`YOLOv3`架构、`darknet`框架和自动水下物体检测的深度学习模型。此外，该研究调查了使用数据集定制基于`YOLOv3`的水生物体检测算法的潜力（Athira\
  \ et al., 2021）。Huang et al. (2019)描述了“基于卷积神经网络的水下物体检测”，并提出了一种基于多尺度卷积神经网络的水下多目标识别技术（`MSC-CNN`）。使用的评估参数包括准确性和测试时间，并通过与领先算法比较检查了多种水下图像识别技术的识别性能。水下图像实验结果证明了该策略在许多评估指标上的优势（Huang\
  \ et al., 2019）。\n\n## 材料与方法\n\n所提出的使用`SSD`的水下底栖检测是一种很有前景的方法，可以自动发现和调查海洋环境中的底栖生态系统。项目旨在创建一个检测底栖带物种的系统，该区域是海底的最底层，由于可见度有限通常难以研究。使用常用的物体识别算法`Single\
  \ Shot Multi-box Detector`可以实现海洋底带水下底栖的检测。遵循以下步骤进行水下底栖检测：\n\n![Fig. 1. 建议的工作流](img/fig45_1.jpg)\n\
  \n### 工作流：\n\n1. `Step 1`：下载并安装所需的项。导入模块。\n2. `Step 2`：第二步确定区域。我们选择海洋底栖带作为感兴趣区域。\n\
  3. `Step 3`：收集数据集。确保足够的分辨率。\n4. `Step 4`：对数据进行预处理和清洗。\n5. `Step 5`：使用标注的图像训练算法。\n\
  6. `Step 6`：将训练过的算法应用于预处理后的图像。\n7. `Step 7`：对结果进行后处理以消除误报。\n8. `Step 8`：优化和调优步骤涉及优化超参数（如学习率、批量大小、优化器），直到达到所需的准确率。\n\
  \n使用`Single Shot Detector`（`SSD`）进行底栖检测是一个为自动检测设计的模块。我们在博客中使用了`CLAHE`方法来提高图像质量。`CLAHE`方法保留了局部细节。\n\
  \n### SSD 算法：\n\n1. `SSD`的基础是层基于特征图的微型卷积过滤，它预测一组特定的默认边界框，包含类别得分和框偏移。\n2. 通过长横比进行显式分组预测，并使用不同尺寸的特征图在不同尺度上创建预测，以实现卓越的检测精度。\n\
  3. 定位（`loc`）和置信度（`conf`）损失是加权和，构成了总目标损失函数：\n4. 我们以`Faster R-CNN`的方式反向计算边界框的偏移参数。\n\
  5. `cx, cy`以及其宽度（`w`）和高度（`h`）。\n\n### 表 1 数据集划分\n\n| 参数 |\n| --- |\n| 图像数量 | 1050\
  \ |\n| 尺寸 | 256 x 256 |\n| 珊瑚 | 300 |\n| 海星 | 250 |\n| 海胆 | 300 |\n| 螃蟹 | 200 |\n\
  \n\n\n\n\n$$\\begin{array}{l} {L_{loc}(x,l,g) = \\sum\\limits_{i \\in Pos}^{N}\\\
  sum\\limits_{m \\in \\{ cx,cy,w,h\\}}x_{ij}^{k}smooth_{\\text{L}1}(l_{i}^{m} - {\\\
  hat{g}}_{j}^{m})} \\\\ \\begin{array}{ll} {{\\hat{g}}_{j}^{cx} = (g_{j}^{cx} - d_{i}^{cx})/d_{i}^{w}}\
  \ & {{\\hat{g}}_{j}^{cy} = (g_{j}^{cy} - d_{i}^{cy})/d_{i}^{h}} \\\\ {{\\hat{g}}_{j}^{w}\
  \ = \\log(\\frac{g_{j}^{w}}{d_{i}^{w}})} & {{\\hat{g}}_{j}^{h} = \\log(\\frac{g_{j}^{h}}{d_{i}^{h}})}\
  \ \\\\ \\end{array} \\\\ {L_{conf}(x,c) = - \\sum\\limits_{i \\in Pos}^{N}x_{ij}^{p}\\\
  log({\\hat{c}}_{i}^{p}) - \\sum\\limits_{i \\in Neg}\\log({\\hat{c}}_{i}^{0})} \\\
  \\ {where\\,\\\\{\\hat{c}}_{i}^{p} = \\frac{\\exp(c_{i}^{p})}{\\sum\\limits_{p}\\\
  exp(c_{i}^{p})}} \\\\ \\end{array}$$\n\n### 性能指标\n\n`Precision = (真正例数量)/ (真正例数量\
  \ + 假正例数量).`\n\n实际（相关）对象与真实正例的比例被称为召回率。\n\n`Recall = (真正例数量)/ (真正例数量 + 假负例数量).`\n\
  \n其取值范围为 0 到 1，其中 1 表示最高准确度。\n\n`Fl score = (Precision x Recall)/ (Precision + Recall)/2.`\n\
