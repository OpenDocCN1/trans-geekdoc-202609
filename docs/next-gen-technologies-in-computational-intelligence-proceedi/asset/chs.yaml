  \ |\n| 所提模型 | | 0.9938 | 0.6814 | 34.333 |\n\n![Fig. 2. 源图像组-1 及其融合结果](img/fig69_2_B.jpg)\n\
  图 2. 源图像组-1 及其融合结果\n\n![Fig. 3. 源图像组-2 及其融合结果](img/fig69_3_B.jpg)\n图 3. 源图像组-2 及其融合结果\n\
  \n## 结论\n\n所提出的融合技术旨在通过保留所考虑图像的最显著特征或信息，从而克服现有局限性并提供高对比度的融合图像。保留边缘信息的思想是通过将引导滤波（guided\
  \ filter）引入最终融合图像来实现的。引导滤波的使用通过利用由 `NSCT` 生成的高频分量，有助于保留融合过程中图像的边缘信息。由于高频分量包含更多如纹理等图像细节，因此这些分量也可能存在噪声。因此，选择了合适的融合规则来处理图像中存在的噪声。\n\
