  \n# 密码保护与恢复\n\nE. Rajkumar 先生，^(⁵⁰)\n\n邮箱：raju.becs39@gmail.com, rsrilakshmi74@gmail.com,\
  \ sudharsanjayakumar7@gmail.com, eswarhemanth82@gmail.com\n\nDOI: [10.1201/9781003430452-63](https://dx.doi.org/10.1201/9781003430452-63)\n\
  \n## 摘要\n密码保护是指使用只有用户知道的密码或短语来保护数字信息或账户的实践。密码保护在保护敏感信息（如财务信息、个人信息或机密文件方面的价值经常被讨论。建议的密码安全方法包括使用长复杂的密码、密码管理器和多因素身份验证。还需要注意的是，使用弱密码或被盗密码会增加欺诈、身份盗窃和数据泄露的可能性。本文进一步讨论了几种找回忘记密码的方法，例如重置密码或电子邮件或安全问题确认。本文最后强调了密码保护在维护数字信息安全方面的关键作用，并为读者总结了其中涉及的关键概念。\n\
  \n# 引言\n最常用的用户身份验证方法是密码，常用于保护敏感数据。密码对于确保数据安全至关重要，因为它们是保护在线账户的第一道防线。然而，使用错误的密码会让黑客极易破解，可能导致安全问题和数据泄露。确保密码得到充分保护并建立有效的恢复方法以防止密码丢失或被盗是非常关重要的。要求使用强密码、密码哈希处理和多因素身份验证都是密码保护技术的示例。密码哈希处理确保了密码不以明文存储。本文进一步讨论了几种找回忘记密码的方法，例如重置密码或电子邮件或安全问题确认。本文最后强调了密码保护在维护数字信息安全方面的关键作用，并为读者总结了其中涉及的关键概念。\n\
  （注：由于原文中引言段落存在逻辑重复，此处译文已根据“不要重复输出原文”的原则进行了去重整合，确保逻辑通顺）\n\n*纠正：由于原文引言部分存在多处意思相近的重复表述，翻译时已按照逻辑进行了整合以保持文档的连贯性：*\n\
  \n最常用的用户身份验证方法是密码，常用于保护敏感数据。密码对于确保数据安全至关重要，因为它们是保护在线账户的第一道防线。然而，使用错误的密码会让黑客极易破解，可能导致安全问题和数据泄露。确保密码得到充分保护并建立有效的恢复方法以防止密码丢失或被盗是非常关重要的。要求使用强密码、密码哈希处理和多因素身份验证都是密码保护技术的示例。密码哈希处理确保了密码不以明文存储。多因素身份验证通过要求用户提供密码之外的额外因素（如指纹或手机应用生成的临时代码）来增加安全性。找回因忘记或丢失而锁定或无法使用的设备或账户被称为密码恢复。在数字设备和在线服务中，密码恢复技术通常用于防止数据丢失、减少服务中断并在账户被锁定后恢复用户访问。通常在密码恢复过程中，通过多种方式确认用户，例如回答安全问题、提交验证码或接收重置链接。密码恢复的方法包括电话、电子邮件和安全问题确认。为了确保关键数据和互联网的安全，防止未经授权的敏感访问，必须保持警惕并不断改进密码保护和恢复程序。密码保护的一个底层问题是传统的基于密码的验证系统容易受到暴力破解、字典攻击和钓鱼攻击。近年来，针对网站的攻击日益增加，往往利用了糟糕的密码管理。注册用户往往是这些攻击的受害者，由于当前凭据泄露，需要迅速更改。即使用户选择了强密码，网站的密码存储必须遵守基本安全指南才能有效。近年来主要的数据泄露案例包括\
  \ LinkedIn 和 Yahoo。\n\n## 文献综述\n[1] 为了防止黑客获取客户隐私，包括银行和保险公司在内的金融机构在其应用程序中使用基于知识、生物识别或基于令牌的密码方案。密码可以在多个区域输入而不担心窥视，基于知识的密码方案对窥视攻击的抵抗力（特别是其重构密码方案）明显优于其他两种。然而，目前可用的重构密码需要心理计算，这使得使用非常困难。此外，它们在输入密码时需要额外的设备（如耳机），增加了数据泄露的漏洞。此外，大多数密码将实际密码材料保存在服务器数据库中，会导致货币机构数据库被入侵。本文提出了一种基于重构的密码技术，不需要额外的硬件或心理计算。建议的方法依赖于每次登录操作后动态变化的密码字符索引。它接收用户的密码字符索引，并从数据目录中获取这些字符。将用户提供的索引和数据库获取的索引组合创建文本密码。对文本密码进行检查，如果正确，则登录成功；否则失败。\n\
  \n\n\n\n为了访问在线网站，传统的身份验证标准是基于单因素密码的系统。虽然众周知单因素认证是一种较差的安全类型，但当攻击者有机会利用密码恢复系统中的漏洞来获取用户凭据时，仍然令人担忧。事实上，如果一个网站的密码管理系统机制不完善，即使是注册用户选择的最强密码也是徒劳的。在之前之前研究结果的基础上，作者在本文中通过研究一些访问率最高的网站所采取的安全措施，审视了潜在的在线密码恢复系统攻击。他们详细介绍了许多贡献：除了更新和修订攻击者模型外，他们还提出了一种更新后的分析。为注册用户提供了一种密码恢复方法，并阻止针对邮件服务提供商的攻击。他们研究了某些知名网站用于恢复在线密码的程序：安全问题、已使用过的密码、基于电子邮件的验证，以及移动设备接收来自网站消息的其他密码技术。\n\
  \n我们在日常生活中频繁使用密码。我们必须使用密码来保护对我们至关重要的一切以及维护我们的数据，无论是登录智能手机、笔记本电脑还是银行账户。如果恶意实体获取了我们的密码，除了失去对个人数据的访问权限外，我们还面临因身份盗窃而失去一切的风险。虽然偶尔更新密码是必要的，但过于频繁的更改可能会让情况恶化。在这里，作者关注用户选择密码时的错误，认为这是网络安全中最薄弱的环节。这为个人和专业用途提供了多种密码安全方法。他们表示，在某些情况下，强有密码是不够的，必须采取额外的安全措施。键盘记录就是此类攻击的一个示例。获取敏感信息的最佳方法之一就是键盘记录。它可以记录任何类型的敏感信息，包括用户名、文档和关键密码。键盘记录处理起来很有挑战性，因为检测它极其困难，甚至是不可能的。\n\
  \n在软件行业中，密码数据库黑客攻击频繁发生，快速发现它们对于防止未经授权的访问至关重要。建议使用 `Honeywords` 技术来发现此类泄露。该计划是创建虚假密码（称为\
  \ `honeywords`），并将它们与真实密码存储在相同的位置。任何尝试使用数据库泄露的 `Honeywords` 密码登录的尝试，将被一种被称为“考虑输入的输入的多系统交叉攻击”的新型攻击模型所破解，该模型比目前使用的蜜罐生成方法更有优势。\n\
  \n作者建议了三种新的蜜罐生成方法来克服这些限制：首先是“进化密码模型”，然后是“用户配置模型”，最后是“附加密钥模型”。这些方法提供了“近似平坦性”，这意味着它们产生的蜜罐密码之间无法相互区分，且与具有高概率的密码区分开来。建议的方法实现了“近似平坦性”，使其与真实密码无异。\n\
  \n对于当今的互联网账户，密码不安全问题相当严重。由于账户可能安全地存储个人信息，因此账户是必须的。然而，保持各自的真实性和完整性是通过使用密码来实现的。密码的大小、中使用的部分、重复使用密码以及不经常更改密码只是影响密码脆弱性的几个因素，此外还将涵盖其他话题，这些因素用以确定用户当前密码的弱点。论文结果显示，更改和重复使用密码是密码安全中最脆弱的方面。在八个密码脆弱性指标中，研究人员发现密码长度、密码元素、包含个人身份信息的\
  \ `PR` 密码、包含字典词的密码、用户账户数量、登录次数、比定期更改更频繁的密码最为脆弱。`PII`、密码重复和密码更改是脆弱迹；超过 50%的受访者密码包含\
  \ `PIE`，且超过 70%的受访者重复密码且不经常更改。\n\n## 方法与技术\n\n建议的密码系统包含五个主要模块：1) 注册，2) 登录，3) 密码确认，4)\
  \ 更改密码，5) 登录时忘记密码，在这里将密码转换为数值表示。通过将密码以数字代码记录在密码数据库中，密码可以受到多种攻击的保护。这是因为与保存的密码相比，文本密码更容易获取。即使攻击者获取了数字代码，也无法从其恢复出文本密码。该应用程序使用字符矩阵创建这种数字编码。这种矩阵方法被称为字符集矩阵，如下所示。\n\
  \n![图 1 字符集矩阵](img/fig63_1_B.jpg)\n\n图 1. 字符集矩阵\n\n在登录过程中，模块的目标是验证用户凭据数字代码的有效性。查询注册用户数据库以获取指定用户\
  \ ID 的数字代码。数字代码被分为两个部分：(i) 左模块包含行值，(ii) 右模块由所选密码的列值。提取每个密码字符的相关索引和列索引。使用这些索引恢复用户\
  \ ID 密码的所有值。文本密码也可以通过登录时输入的数字代码通过相同的方法进行恢复。随后，对这两个密码进行对比。如果一致，则用户成功登录，否则显示密码无效的提示。\n\
  \n我们的系统允许授权用户在无需回忆安全信息、无需依赖额外设备或无需信任个人或邮件服务商的情况下检索密码。在其最基本的形式中，Mail dust 只需要安装一个程序，自动检索网站发送到账户所有者选择的各种电子邮件地址的重要令牌。通过自动密码再生继续，这只需要极少的用户认知负荷。\n\
  \n![图 2 自动密码再生](img/fig63_2_B.jpg)\n\n图 2. 自动密码再生\n\n用户在网站上启动 Mail dust 恢复过程后，请求\
  \ Mail dust 客户端模块获取新密码。\n\n\n\n\n\n## 1. 错误 1\n主要问题源于弱密码。如果输入弱密码，很容易被如姓名、出生日期、列表中的单词等被猜出来。所有用户群体都必须理解强密码和弱密码的区别；例如，公司必须教员工如何使用强密码。即使在云数据存储的情况下，如果不维护强密码，数据也是不安全的。作者认为，利用短语（如一个陈述或短语）是构建强密码的极佳方法。删除短语中的空格、故意拼错单词、添加符号和数字，使其变得更长且更难破解。论文提供了一个使用该技术生成的\
  \ 22 位强密码示例。它包含大写和小写字母、符号和数字。它强调了此类密码很难通过字典攻击进行猜测或破解。例如：“youare@sp@$$sample2022”。\n\
  \n## 2. 错误 2\n是在所有账户中使用同一个密码。这构成了严重的安全风险，因为如果黑客通过数据泄露猜到、破解或获取了我们的密码，他们将获得使用该密码的每一个账户。\n\
  \n## 3. 错误 3\n是暴露我们的密码。这仅仅是因为使用了公共电脑、在他人能找到的地方写下密码，或向向他人揭露我们的凭据。避免使用公共电脑和公共接入网络来解决这个问题。不要在任何地方记录我们的密码。\n\
  \n## 4. 蜜罐生成\n本节建议了在考虑拼写安全和其他策略考量的情况下，产生大致扁平的蜜罐（honeywords）的方法。密码策略建议远离字典单词、在多个网站上使用唯一密码、避免频繁使用的密码，并使用与用户名无关的密码。建议的规定较为宽松，规定密码不能包含用户名或其任何子字符串，并且必须至少包含八个字符，包括字母、特殊符号和数字。建议的方法是在创建的每个蜜罐与原始密码之间保持极小的差距，以确保拼写安全。作者建议了两种创建蜜罐的方法：第一，利用\
  \ `legacy-UI` 密码更改功能创建与用户密码相同的蜜罐；第二种方法被称为 `developing password model`，通过使用实际密码的概率模型来创建蜜罐。模型会预先计算现有数据库列出的每个密码的频率，通过首先匹配密码模式的频率以及密码中每个标记（token）的频率，从而产生蜜罐。文中提供了如何使用特定密码创建蜜罐的演示。\n\
  \n## 5. 研究结果\n根据他们的研究，得出的如下：根据受访者的意见，15% 的受访者密码少于八个字符，56% 的密码在八到十二个字符之间，14% 的密码在十二到十六个字符之间，15%\
  \ 的密码超过十六个字符。结果显示，大多数网站要求用户密码至少有 8 个字符，因此典型的响应是密码长度在 8 到 12 个字符之间。他们的方法分为四个模块：\n\
  \n### a) 研究目标\n为了检查数据并洞察密码脆弱性水平，本研究论文的目标是收集关于用户对密码脆弱性或弱点的认知，以及用户对密码质量担忧的所需数据。\n\n\
  ### b) 数据收集\n使用 `Google Forms` 提出的问题来收集分析数据，包括用户密码漏洞的细节。问卷是一种用于数据收集的技术，通过提问来收集所需数据。本研究将使用问卷，以便在需要时可以收集收集和使用信息。\n\
  \n### c) 数据分析\n在数据处理和数据收集完成后，将进行数据分析。\n\n### d) 研究发现\n研究结果为读者提供了关于密码易受性典型水平以及用户对密码强度担忧的洞察。\n\
  \n## 结论\n密码保护和恢复是当代数字世界数据安全的本质组成部分。网络攻击和数据泄露的增加使得使用强密码和有效的恢复方法比以往任何时候都更加重要。我们列出了密码安全和恢复的一些重要问题以及建议的解决方案。这些包括创建强且唯一的密码、定期更改密码以及激活双重认证。此外，研究表明电子邮件验证和安全问题等密码恢复方法可能会受到攻击，可能需要额外的安全措施来确保其有效性。本文重点关注对密码保护和恢复进行持续教育和知识的需求，以帮助组织和个人保持安全。\n\
