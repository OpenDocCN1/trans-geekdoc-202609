  \n过去几年中，在线诈骗有所增加，随着加密货币的出现及其伪匿名性，对于诈骗者来说变得所未有的容易。交易中的每个地址都由勒索软件加密，并像野火一样蔓延。为了评估这些交易是如何进行的，并尝试创建可以预测特定比特币地址是否被恶意使用的模型。\n\
  \n在被称为 `logistic regression` 的统计模型的最基础版本中，通过 `Logistic regression` 等机器学习算法的帮助，`function`\
  \ 用于对二分类因变量进行建模。在 `d-dimensions` 空间中，它只是试图拟合一个能最好区分正负数据点的超平面。`sklearn` 中带有 `logistic\
  \ loss` 的 `SGDClassifier` 比标准的 `Logistic Regression` 类更有效，因为它使用了随机梯度下降。然后通过 `randomized\
  \ search` 来识别所有模型的最优超参数。经过调整后，发现 `0.001` 是理想的 `alpha`。因此，准确率非常糟糕；只有 `49.0%` 检测到了勒索软件攻击。\n\
  \n![图 4. 6 大主要勒索软件家族样本的准确率](img/fig6_4_C.jpg)\n图 4. 6 大主要勒索软件家族样本的准确率\n\n![图 5.\
  \ 盗劫与非盗劫数据集数量的正态分布匹配](img/fig6_5_C.jpg)\n图 5. 盗劫与非盗劫数据集数量的正态分布匹配\n\n我们可以了解到，样本可能无法通过\
  \ `Logistic Regression` 与失败线性分离。尽管 `Logistic Regression` 性能强大，但在处理非线性数据时存在局限性。这也表明，由于数据可以线性分离的相同朴素假设，我们的\
  \ `linear SVM` 表现将与 `Logistic Regression` 同样糟糕。对于 `SVMs` 也使用了 `SGD Classifier`，但这次是为了定位支持向量，因此表明，由于数据可以线性分离的相同朴素假设，我们的\
  \ `linear SVM` 表现将与 `Logistic Regression` 同样糟糕。\n\n\n\n\n\n9. [Almousa, May, Sai\
