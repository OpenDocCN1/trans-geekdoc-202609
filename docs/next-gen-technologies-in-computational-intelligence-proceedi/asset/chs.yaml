  \n## 摘要\n\n水下传感器网络（UWSN）技术已广泛应用于并在领域得到验证。多年来，人们设计了不同的协议，但水下传感器节点能力有限，必须通过传输来节省能量。所提出的遗传算法（GA）根据能量级（EL）选择转发节点。基于时间的信任链路（TBTL）UWSN\
  \ 根据实际需求调整路由和数据传输技术。仿真结果表明，遗传算法优于标准的能量平衡算法。\n\n关键词：水下传感器网络（UWSN）、节能、基于时间的信任链路（TBTL）、传输、邻居、协作路由、无线节点\n\
  \n# 引言\n\n水下传感器网络（UWSN）技术正成为一种强大且低成本的技术，用于开发创新应用，如创建水下互联网、监测海草以及缓解海洋灾害。水下传感器网络中的分布式节点可以形成自组织网络，用于探测和监测水下目标，并通过多跳无线通信将数据发送到汇聚节点。\n\
  \n## 工作贡献\n\n* 通过开发节能传感器节点改进水下环境中的通信。\n* 在所提方法中，遗传算法利用流技术估计簇数量，选择最佳簇头，并使用聚合方法提供最优信息。\n\
  * 开发了一种新的适应度函数，该函数考虑了节点权重、剩余能量量以及网络的整体能量消耗。\n\n\n\n\n\n- 所提方案使用时隙分配优先级进行来自 `CH`\
  \ 的数据传输。动态节点传输是为了最小化负载均衡和流量管理的开销。\n\n## 相关工作\n\n水下无线传感器网络（UWSNs）最近被认为具有观测和研究水下环境的潜力\
  \ (Zhang, M., & Cai, W. 2020）。UWSNs 最迫切的问题之一是向汇点可靠地成功传输信息。与其传统的基于感知的直接路由（DBR）技术，他们为\
  \ UWSNs 引入了能量高效概率基于深度路由（EEPDBR）。UWSNs 的环境无法抵抗不同的安全威胁。因此，安全性在其中起着至关重要的作用。文献提出了一种安全、高效且有效的\
  \ UWSNs 路由协议 SEECR。SEECR 包含了确定性的、高效的安全标记，以对抗两栖动物环境中的攻击。SEECR 利用适当的路由进一步提高了网络执行力。\n\
  \n处理的最小措施是由于资源受限的 UWSN 环境部署安全性，以保持 SEECR 在低资源情况下的适用性 (Saeed et al., 2020)。声学信道的整体环境从性属性阻碍了\
  \ UWSNs 中利用稳健关联进行高效且可靠的信息收集 (Faheem et al., 2020)。为了保证网络寿命，路由策略中的能量效率是 UWSNs 中的一个关键问题。基于区域的增量协作协作节点移动（RBCMIC）是一种高效的辅助路由程序\
  \ (Yahya et al., (2019)。UWSNs 和陆地无线传感器网络（IWSN）有很多共同点。这些导致了 UWSNs 的一些问题，包括链路可靠性、数据包重传和能量过度消耗。为了解决区域和能量利用问题，他们为\
  \ UWSNs 提出了多面簇类能量高效型（MLCEE）协议 (Khan et al., 2019)。\n\n传输方法引发了上述传输或数据包碰撞问题，这影响了信息的移动。在恶劣的水下环境中更换传感器的电池是非常困难的。在此路径下，高效的路由算法对于避免网络意外崩溃延长网络寿命至关重要\
  \ (Khan et al., 2018)。传输功率控制（TPC）、能量收集（EH）和压缩感知（CS）是延长 UASNs 寿命的三种实用路径。\n\n`CS`、`EH`\
  \ 和 `TPC` 方法对 UASNs 寿命的综合影响是他们定量研究的主。结合 `CS`、`EH` 和 `TPC` 的思想，创建了一种特定的混合规划系统来优化网络寿命\
  \ (Erdem et al., 2019)。一种带有高效邻域路径规划的无人水器（UUV）递归多级任务调度器。类似的决策数据包传输问题出现，以及灵活的调度策略\
  \ Mahmoud et al., 2019。\n\n此外，UUV-AP、自由空间光学（FSO）和无线射频（RF）被建议用于 UWSN 水面。Agheli et\
  \ al., 2021。\n\n## 材料与方法\n\n针对 UWSN 提出了一种名为遗传算法（GA）的路由机制。首先，动态策略为每个节点选择簇头（CH）。……这些因素，例如总能量、剩余能量。\n\
  \n### 聚类形成\n\n聚类的目标是通过减少每个簇中的成员数量来减少 CH 的工作负载。每个成员被分配到其半径内的簇头（CH）。每个节点在簇中的成员身份取决于其接收来自\
  \ CH 的数据。\n\n步骤 1：初始化节点计数。\n\n步骤 2：识别源和目的 ID。\n\n步骤 3：设置锚点节点列表 `x = (id, position,\
  \ hop);` 发送数据检测 `pts = (node id, a[x], p[i])`\n\n(1)\n\n`x[i] = x[i] + 1`\n\n步骤\
  \ 4：用新端替换两个连接的端。通过计算从新节点到任何剩余节点的优路径来确定新的距离网络。\n\n(2)\n\n```\nDistance D_{i,j} =\
  \ sum_{y > x} (D_{xy} - d_{xy})²\n```\n\n步骤 5：每个汇点节点注册每个隐藏节点的典型跳转距离，每个隐藏节点根据先来后原则获取数据。\n\
  \n(3)\n\n```\nf_i = sqrt((x1 - y1)² + (x2 - y2)²) / h_i\n```\n\n这里 h[i] 是到汇点节点的跳数。\n\
  \n步骤 6：检查每个节点的组合能量\n\n如果 `n(i)`\n\n簇列表 = 添加 (n (i))\n\n否则\n\n重新计算节点的距离和能量。\n\n结束\n\
  \n步骤 7：检查通信节点 id 丢弃检测包。\n\n\n\n\n\n重复上述步骤，直到节点之间的所有通信都被覆盖。\n\n随后，在那个点，它会将集群中所有隐藏节点计算出的典型跳跃距离通信给每个汇聚节点。每个隐藏节点都会获取来自每个汇聚节点的跳跃距离主数据，并忽略多余数据。短路径允许节点从汇聚节点获取数据。结果是未知节点可以计算到与其对应的汇聚节点的距离。\n\
  \n## 动态选择中基于簇的多路径路由\n\n作为移动自组网络的载体，无线移动节点意味着系统可以在没有现有通信结构的情况下，独立且动态地部署自组节点。基于簇的\
  \ UWSN 程序旨在减少网络中簇头（`CH`）的事务次数。簇选择也采用了节能方案。这延长了您网络的生命周期。\n\n### 开始\n- **步骤 1**: 多通道信息的使用\n\
  - **步骤 2**: 跨簇网络搜索\n- **步骤 3**: 动态路由\n- 使用 `CH` 通过静态路由发现最短路径\n- 更新路由\n- **结束**\n\
  \n中间节点是节点，而其他成员是普通节点。一个不健康的节点被认为是负责路由和信息的主导共享节点。在簇中，`CH` 选择与其交换信息的节点。\n\n## 基于时间的可信链路\
  \ (TBTL)\n\n节点可以估计同时传输的数据包，以促进同步。仿真结果证明，为了避免簇之间的干扰，在更有效的路径上交付的流比由于截止时间交付的更多。该优化问题使用\
  \ `TBTL` 解决。在这里，`TBTL` 建模导致部分随机变量被用在随机位置。在 UWASN 中，`TBTL` 检测传感器节点的水平，为具有特定目标（如单个应用功能、动作、状态空间和附近环境条件）的节点之间提供杠杆。此外，从节点\
