  \nDOI: [10.1201/9781003430452-21](https://dx.doi.org/10.1201/9781003430452-21)\n\
  \n## 摘要\n\n染色和颜色标准化是数字病理图像计算机辅助分析的重要步骤。血细胞包含丰富的表型细节，这对于预测血液组织病理特征的变化至关重要。近期，深度学习技术的进展为计算方法支持的病理细节成像、评估和解释提供了支持，但这一过程面临着若干挑战。由于使用了具有不同光源、物镜、成像相机分辨率等特征的不同扫描仪，以及其他染色技术、不同的化学试剂和各种放大倍数，颜色和染料变化的计算复杂性降低了结果的预测准确性。本文介绍了与病理图像分析中使用的多种色彩归一化技术的简要研究。\n\
  \n关键词：色彩归一化、病理染色分离、色差、预处理、深度学习\n\n# 引言\n\n组织病理学是对显微镜下侵入性或微侵入性异常细胞特征的研究。病理学家通过检查组织结构的分布、形状规则性和几何特征来确定图像是良性还是恶性。血液涂片经过染色分离细胞成分的细胞、细胞质和结缔组织，以识别良性或恶性组织\
  \ (Rashmi et al., 2021)。接下来，通过检查感兴趣区域 (`ROI`) 的形状、大小和颜色等形态特征的变化来发现恶性变。然而，手动分析具有主观性、不一致性、单调、耗时且容易产生人为错误\
  \ (Rashmi et al., 2021)。\n\n此外，由于人为错误和使用的设备标准不同，实验室结果的解释可能不一致。因此，从客观诊断的角度对病理图像进行定量分析\
  \ (Gurcan et al., 2009) 对于将病理学家从专注于困难病例的任务中解放出来至关重要。颜色变化在病理学中至关重要。组织图像是半透明的，它们显示的颜色由于光的传输和散射。光照不均、相机敏感度不平衡或伪影可能会干扰颜色通道并显示不合理的颜色。人们可以通过同一天或不同天染色血液涂片来区分差异\
  \ (Clarke & Treanor, 2016)。诸如 `GEM ENFPs` 等技术用于检测色彩空间、噪声和分布的变化 (Hwang et al., 2006;\
  \ Bejnordi et al., 2014)。数字病理学中使用多种染色技术来强调细胞和组织的结构。苏木精和伊红精 (`H & E`) 是血液组织组织学检查的标准染料，其中初始阶段的细胞通常具有蓝色细胞质，随着细胞成熟逐渐从蓝色变为紫色，然后变为粉色\
  \ (Cross, 1998)。\n\n我们的核心问题是值得重复的：病理图像分析中使用的多种色彩归一化技术的性能，取决于图像的质量，以及受多种因素影响的染色结果。多种色彩归一化技术被用于病理图像分析中以强调细胞和组织的结构。许多方法将一种图像的颜色到另一种图像。神经网络用于色彩分离和归一化，以及通过数据增强来处理色彩偏移的方法\
  \ (Reinhard et al., 2001; Salvi et al., 2020; Anghel et al., 2019; Zanjani et al.,\
  \ 2018; Stacke et al., 2021; Grabel et al., 2021; Vasiljevic et al., 2021; Tellez\
  \ et al., 2018; Tellez et al., 2019)。本文探讨了提出的染色和色彩归一化方法。\n\n## 病理图像预处理的各种方案\n\n\
  ### 染色分离\n\n为了人工解释而采集的数字病理图像通过各种化学品染色以对比组织的形态特征。遗憾的是，图像需要为了自动化分析进行标准化。通过染色分离理解组织结构的方法\
  \ (Tadrous (2010)) 提出了一种去色算法，允许选择 `RGB` 单通道，并从顶部减去像素值。在 `H & E` 图像中，红色是高对比通道，去除除红色通道以外的通道减少了苏木精染色。同时，仅深色算法产生了更亮的结果\
  \ (McCann et al., 2014)。通过光密度矩阵调整 `H & E` 通道的对比度。另一种方法独立成分分析 (Trahearn et al., 2015)\
  \ 显示监测染色分离方法的计算复杂度是巨大的，且未能保留源图像的特征。\n\n### 色彩归一化\n\n病理图像色彩偏移使得获取可靠结果变得困难。病理图像颜色差异源于原材料、扫描仪和实验室程序的差异。通过减少颜色变化可以降低复杂性并提高预测能力。色彩归一化可以推广统计和算法方法。统计方法\
  \ (Reinhard et al., 2001) 根据均值和标准差将参考图像的色彩特征转移到输入图像，以改善图像外观。Salvi et al., (2020)\
  \ 提出了一种全自动色彩分离和归一化方法，通过保持局部结构的色彩来增强组织与背景之间的对比。Bautista et al., (2014) 通过将非线性 `RGB`\
  \ 通道转换为线性通道、执行线性 `RGB` 色彩校正，然后转换为图像来执行全局色彩标准化。与其标准化色彩变化的部分原因，不如使用强度比较算法和光谱归一化模块来处理成像和染色变化。\n\
  \n#### 统计方法\n\n全局色彩归一化是非线性过程，无法保留源信息，且变换是全局应用的。像素到像素的映射模型依赖于单一参考图像并且并未\n\n\n\n\n\
  \n准确且平滑地执行变化。深度学习算法通过复杂的网络结构快速解决转换问题，该结构可以从整个数据集中学习颜色属性并在像素级上转换值。大多数神经结构化颜色归一化侧重于高性能模型，而非不成比例的数据。生成对抗网络（`GAN`）将源图像归一化为目标图像，并将归一化图像集作为训练真值\
  \ Anghel et al., (2019)。使用通用的 `CNN` 方法在不使用训练于组织病理学和细胞病理学数据集的模板图像的情况下实现颜色标准化 (Kang\
  \ et al., 2021)。\n\n## 领域与颜色增强\n\n数据增强技术包括几何变换和颜色转换、随机擦除、对抗训练、风格迁移等。仿射变换用于通过镜像、旋转、裁剪、放大、缩小或创建失真图像的副本来操纵数据。颜色增强通过分离\
  \ `RGB` 颜色通道并使用矩阵操作对其进行处理，以增加或减少亮度、降低图像亮度或使用强度值改变光照。Vasiljevic et al., (2021) 提出了一种像素空间和特征空间的颜色增强方法来改变输入图像的特征。Tellez\
  \ et al., (2019) 显示，颜色归一化结合颜色增强方法可以解决颜色不均匀问题并提高泛化性。鲁棒的数据增强框架如 `GAN` 或 `Cycle-GAN`\
  \ 对对小数据集进行无监督增强，用于训练和风格迁移。\n\n## 结论\n\n本研究在组织病理成像背景下介绍了一些染色和颜色归一化及增强实践。我们识别了利用全局和子空间的各种监督和无监督方法对病理图像进行计算机化分析，用于颜色和染色的分离、归一化和增强，并展示了不同的结果。统计方法无法保留源图像信息。当存在大量亮、暗像素时，染色结果不佳。源域和目标域期望相似的统计特性，颜色全局应用，在大多数情况下颜色得以保留。算法方法保留了源域和目标域的功能，无监督方法减少了标注时间，产生了更多类型的染色变异，且更加复杂。相比之下，算法方法的深度学习网络计算复杂性和内存消耗较高，且平衡训练集的质量和数量影响模型的可解释性。全自动的算法方法可能不够灵活，或者无法提供处理不同染色技术和关注感兴趣区域的灵活性。\n\
  \n研究的统计和算法技术总结见 表 1。研究的每种技术都使用了包含几种不同类型染料的不同图像数据集，但大多数 `H & E` 关注特定疾病。大多数研究实验中使用单一染料而非不同染料，且在大多数情况下，统计和算法方法在研究中使用精选的数据集。这种多维变异使得比较技术及其结果具有挑战性。通过预处理方法、染色分离以及随后的颜色和染色归一化，合成数据集的颜色变异显示出显著改进的结果。未来的工作将专注于颜色和领域增强方法。\n\
  \n**缩写** `H&E`：苏木精和伊红；`RGB`：红、绿、蓝；`GAN`：生成对抗网络；`CNN`：卷积神经网络；`OD`：光密度；`PCA`：主成分分析；`ICA`：独立成分分析；`SW`：饱和度加权；`NMF`：非负矩阵分解；`HSV`：色调、饱和度、值；`HED`：苏木精-伊红-DAB\n\
