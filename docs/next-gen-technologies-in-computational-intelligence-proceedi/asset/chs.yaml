  \n## 摘要\n\n恶意软件的不断上升对用户信息的隐私和安全成了严重威胁。因此，需要高效有效的技术对恶意软件进行分类。本研究提出了一种基于集成学习的恶意软件分类技术。API\
  \ 调用模式是识别恶意软件行为的极有用知识源。在本研究提出的恶意软件分类算法中，API 调用序列被用作分类器的输入。API 调用序列有效捕捉恶意软件分类的特征。本研究建议的\
  \ API 调用恶意软件分类方法使用了基于多数投票集成分类器的集成学习。论文中使用的算法包括 `Decision tree`、`K-Nearest Neighbor`\
  \ 和 `Random Forest Classification` 方法。这些算法作为基学习器运行。所提出的模型基于多数投票法执行恶意软件变体分类模型。最后，通过对结果进行比较，以找到高准确率的模型。\n\
  \n关键词：恶意软件、集成学习、机器学习、API 调用\n\n# 引言\n\n根据赛门克威胁报告（Symantec, 2016），恶意软件攻击在 2016 年增加了\
  \ 286%，在 2017 年增加了 600%。根据 SonicWall (2019) 的《网络威胁报告》，2018 年恶意软件攻击增加了约 217.5%。2020\
  \ 年上半年，AV-TEST 学院的专家识别出额外的 180 万个危险程序。根据 McAfee 的报告，2015 年恶意软件攻击数量每年超过 900 万次，特别是针对\
  \ Google 的 Android 操作系统。名为恶意软件的危险程序创建的明确目的是窃取数据或破坏基础设施和系统。它们是高度开发的程序，可以极大地规避和延迟恶意软件检测技术。类似的方法基于这样一个假设：恶意软件可能大量利用系统调用，与干净的软件相比，它们以随机顺序调用这些（Zhang\
  \ et al., 2015）。此外，计算机病毒片段有时使用某些 API 的频率远高于正常。另一方面，调用的 API 总数相当小。此外，黑客会移除、交换并引入与恶意代码原始功能和活动无关的虚假\
  \ API 调用，以混淆恶意软件检测器。\n\n创建一个基于 API 调用序列并以更高准确率识别恶意软件的检测方法至关重要。当前恶意软件检测技术的问题是它们严重依赖基于签名的数据。基于签名的识别基于对每种恶意软件独特指纹的识别。这种方法无法检测新型恶意软件变体。因此，机器学习最近被作为此问题的解决方案。\n\
  \n机器学习技术已被证明能够识别新的恶意软件毒株，并通常侧重于发现和挖掘观测数据中的关系。因此，本文提出了几种基于序列的 API 调用技术，用于识别和分类恶意软件。这些方法的基本原理是评估所收集的代表恶意行为的模式与表征被评估应用程序的\
  \ API 调用序列之间的相似性。在提高分类性能方面，使用分类器集合的性能优于使用单一分类器。通过集成学习技术可以创建一个准确率高的单一分类器，该技术整合了多种算法而不仅仅是单一算法。基于单模型方法的缺点可以通过开发集成学习方法来解决。在本研究中，我们采用多数投票机制，以获得比以前方法更好的结果。我们将\
  \ API 调用定义为计算机应用程序通过运行的技术。每种恶意软件可能具有不同的 API 调用模式；因此，可以对系统调用序列进行分类。研究使用建议的方法调查了三种分类模型，包括\
  \ `Decision Tree`、`K-Nearest Neighbor` 和 `Random Forest Classification`。\n\n因此，研究的组织如下：第\
  \ 2 节介绍了我们在工作中引用的一些文献概述。第 3 节说明并讨论了所提出的系统和模块。第 4 节中，我们提供了所提系统的实验结果和测试。最后，第 V 节得结论并总结了局限性，并讨论了一些可能的未来工作。\n\
  \n## 文献综述\n\n使用分层集成方法通过 2D 图像实现可视化。它利用了 `MaleVis` 和 `BIG 2015` 恶意软件数据集（Roseline\
  \ et al., 2020）。所提出的模型运行复杂度较低，且不再需要调整超参数。它执行数据准备、滑动窗口扫描和级联层。在混合森林模型的情况下，该方法表现良好。\n\
  \n利用控制流图机器学习对应用程序接口进行恶意软件检测。输入了 10010 个良文件和 10683 个有害文件。它执行了（Ma et al., 2019）特征提取、`CFG`\
  \ 构建、预处理和频率检测，并基于高准确率计算结果。\n\n使用 Android 威胁检测高效 DL 算法实现检测系统。算法输入了 `CICAndMa12017`\
  \ 数据集。它执行了数据预处理、模型工程，最后获得并分析结果。GPU 和 CPU 已用于实验，结果显示 GPU 的速度快得多（Sheraz et al., 2021）。\n\
  \n在 Usman et al., (2021 中，提供了一种基于动态分析并采用机器学习、数据取证和网络威胁情报的独特混合策略。该研究声称，通过在接受层面应用大数据取证概念可以预测\
  \ IP 信誉。然后将决策树方法应用于行为分析以表征相关的零日攻击。\n\n使用各种指标对所提方法进行评估。与文献中的其他领先方法相比，测试结果显示所得的 F\
  \ 值、准确性和召回率得分都很良好。\n\n区块链技术近期引起了广泛关注。其核心技术共识过程取自容错分布式（Nofer et al., 2017）。\n\n\n\
  \n\n\n由于恶意软件种类的迅速扩张，取证专家在快速反应方面面临着挑战。我们没有采用资源密集型的动态恶意软件分析，而是提出了一种结合机器学习的统计技术作为一种方法论\
  \ (Shalaginov et al., 2018)。\n\n在这项研究中，作者检查了大量的安全 Android 平台应用和恶意软件样本。Android 恶意软件一直是许多研究的主题\
  \ (Allix et al., 2014)。\n\n作者深入研究了与恶意软件相关的各种应用程序。Android 权限是识别 Android 恶意程序的两个元素。该方法基于\
  \ AndroZoo 和 Drebin 数据集采用了三种机器学习技术 (RBFN)。所提的基于 MLP 的方法获得了 87% 的真阳性率和 90% 的分类准确率\
  \ (Firdaus et al., 2017)。\n\n使用人工神经网络识别恶意软件攻击的时间动态性。模式识别神经网络 (Al-Jarrah, 2019) 使用输出来发现攻击情况，并使用分类器产生关于攻击的警报。\n\
  \n基于对引用数据集 Nisa et al., 2020 (Microsoft Kaggle Challenge) 工作的全面审查。通过对比，在未来在该领域更容易发现潜在的研究领域。\n\
  \n对用于数据挖掘和机器学习进行恶意软件检测的网络分析技术进行了针对性的文献综述。由于报告了在 ML 中使用的某些与网络相关的 (Love, 2018) 已知数据集，因为数据对这些方法论至关重要。文中探讨了将\
  \ ML/DM 应用网络安全时面临的困难，并就何时使用特定方法以及该数据集的表现如何提供了一些建议。\n\n结合名为基于子字符串的分类器特征选择 (SBFS)\
  \ 的集成学习策略，它提供并分析了若干种用于 Android 恶意软件分类的机器学习技术 (Palmer, 2017)。他们通过在 Drebin 数据集上使用集成方法改进了他们的发现。\n\
  \n使用权限对 Android 上的恶意软件进行分类。我们基于 ML 方法的解决方案利用 22 个 Android 权限 (McAfee, 2020) 来区分合法软件和有害应用程序。\n\
  \n使用包含 Google Play 上提供的良和坏应用程序的数据库构建了一个权限数据集。实现了 90% 的最高准确率。\n\n通过整合静态和动态技术分析并分类一个可执行的未识别文件。该技术使用机器学习训练已知恶意软件和良软件。所建议的方法\
  \ (Aslan et al., 2021) 包含了两种分析的优点，增强了性能和分类结果。特征向量通过查看二进制代码和动态行为选择。\n\n## 提出的模型\n\
  \n### 概述\n\n本节提供了基于机器学习技术的所提恶意软件分类方法。该系统为恶意软件分类提供了一种集成学习架构。\n\n#### 算法：\n\n在步骤 1\
  \ 中，我们执行恶意软件样本。\n\n在步骤 2 中，我们在沙箱中执行恶意软件样本以收集结果。\n\n在步骤 3 中，我们使用机器学习来训练分类模型。\n\n\
  在步骤 4 中，我们应用了一种名为多数投票的集成学习。\n\n在步骤 5 中，我们评估每个算法的性能。\n\n#### API 调用\n\n应用程序编程接口 (`APIs`)\
  \ 允许软件进行通信。\n\n## 方法论\n\n### 数据集\n\n首先，我们将数据集分类为 `Adware`、`Backdoors`、`Downloaders`、`Droppers`、`Spyware`、`Trojans`\
  \ 和 `Worms`。\n\n### 预处理\n\n接下来是对数据集的预处理。它被分为训练集和测试集。\n\n### 特征选择方法\n\n在第三步中，提取恶意软件特征。我们采用了极大归一化和标签编码器来提取特征。\n\
  \n```\n\\[X - mean(X)\\]\\[max(X) - min(X)\\]\n```\n\n### 分类器\n\n我们使用了三个独立的分类器：`decision\
  \ trees`、`k-nearest neighbor` 和 `random forest classifier`。\n\n### 集成学习模型\n\n机器学习集成技术整合多个学习模型的信息，以做出更准确、更好的选择。\n\
  \n\n\n\n\n使用多个机器学习模型的集成来训练一个集成投票分类器（Ensembled voting classifier），该分类器根据输出最可能属于所选类别的概率来预测结果（类别）。它简单地结合了输入到基于投票的分类器中的每个分类结果，并根据多数票数预测输出结果。我们使用单一模型来训练许多专门的模型，并根据每个输出的投票票数总和来预测输出。训练阶段采用了集成学习技术。我们使用了三种不同的分类器，即决策树、k-最近邻和随机森林，它们都属于监督学习机器学习方法，并经过了训练和评估。在集成学习的基础上，我们应用了多数投票分类器。\n\
