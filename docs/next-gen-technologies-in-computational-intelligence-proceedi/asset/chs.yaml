  \ and Comparative Analysis of Potholes using Image Processing. IEEE Region 10 Symposium\
  \ (TENSYMP), Kolkata, India.\n\n\n\n\n\n鼠标是一种用于在 `system/laptop` 中执行所有操作的重要设备。屏幕显示了请求的操作。鼠标有多种类型，如机械鼠标、光式鼠标和无线鼠标\
  \ (Shriram et al., 2021)）。橡胶球是机械鼠标的唯一组件，它可以向任何方向旋转，其移动控制着光标的移动。机械鼠标也被称为滚鼠。橡胶球位于鼠标底部，其内部的传感器会检测移动并发送信号，从而在屏幕上显示光标的移动。\n\
  \n随着技术的发展，光式鼠标取代了机械鼠标，因为后者更笨重且成本更高 (Venkateshwar et al., 2021)）。光式鼠标由一个 LED 传感器和一个小型摄像头组成，后者可以拍摄数千张照片并检测光标的移动。光式鼠标有一个光头，而机械鼠标则有一个橡胶球。在经过一段时间推演后，人们提出了激光鼠标以克服光式鼠标的缺点。技术的发展导致了无线鼠标的引入，旨在克服机械、光式和激光鼠标的局限性，并帮助操作物理鼠标有困难的人\
  \ (Katona et al., 2021)。\n\n当现实世界中没有空间可以使用鼠标时，可以使用所提出的非接触式虚拟控制系统来解决问题 (Nandhini\
  \ et al., 2014)。基于计算机视觉的非接触虚拟控制鼠标系统使用 `SSD` 算法来检测手势。所提出的系统采用变换技术来翻译指尖坐标，在摄像头移动到该位置后，全屏电脑显示器被用于鼠标控制\
  \ (Lugaresi et al., 2019)。所提模型的输出结果表明，在现实应用中，使用 `CPU` 代替 `GPU` 具有良好的准确性和卓越的性能。\n\
  \n## 相关工作\n\nShriram 讨论了一个使用计算机视觉和深度学习来防止 COVID-19 传播的系统。鼠标对于执行 `system/laptop`\
  \ 中的操作至关重要。鼠标利用人机交互 (HCI) 技术来正确完成其工作。由于没有与设备/计算机之间的人机互动，它还减少了传染病毒 COVID-19 的传播 (Shriram\
  \ et al., 2021)。\n\nDevanshu Singh 描述了使用 `Open CV` 的虚拟鼠标。它建议你重建硬件。该想法是展示我们是否可以使用数字技术和摄像头来监控鼠标移动（点击和滚动），并制造所有传统的鼠标设备。该论文展示了如何构建一个鼠标操作系统\
  \ (Singh et al., 2021)。\n\nVenkateshwar 通过识别手势描述了 HCI 对虚拟鼠标的使用。随着计算机技术的发展，HCI 技术不断发展。在鼠标中增加额外设备会使硬件变得复杂。推荐的鼠标系统是限制在这一范围之外的\
  \ (Venkateswar et al., 2021)。\n\n“基于彩色指尖和手势识别的虚拟鼠标控制” (Reddy et al., 2020) 的作者描述了这种技术。通过使用基于图像的指尖识别和实时视频中的手部动作，构建了一个用于人机交互的非接触虚拟鼠标。这项工作描述了使用手部动作识别和指尖检测控制虚拟鼠标的方法\
  \ (Pranav et al., 2020)。\n\nManthan Bhatkar、Ofrin Lopes、Monali Shetty 教授描述了这种技术。通过在实时视频中使用基于图像的指尖识别和手部追踪，构建了一个用于人机交互的非接触虚拟鼠标。这项工作描述了使用手部动作识别和指尖检测对虚拟鼠标进行控制\
  \ (Pranav et al., 2020)。（*注：此处原文段落与前文有重复，已按要求翻译*）\n\nManthan Bhatkar、Ofrin Lopes、Monali\
  \ Shetty 教授描述了这种技术。“基于彩色指尖和手势识别的虚拟鼠标控制” (Reddy et al., 2020) 的作者描述了这种技术。通过在实时视频中使用基于图像的指尖识别和手部追踪，构建了一个用于人机交互的非接触虚拟鼠标。这项工作描述了使用手部动作识别和指尖检测控制虚拟鼠标的方法\
  \ (Pranav et al., 2020)。\n\n## 材料与方法\n\n在图 1 中，所提工作的开发显示了虚拟鼠标的各种功能。其六个步骤如下：\n\n\
