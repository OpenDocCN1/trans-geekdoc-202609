  \ 165–183 页。\n\n# 工业物联网（IIOT）系统中 AI 驱动的人机活动监控\n\nS. Sridevi 和 S. T. Deepa\n\n副教授，金奈\
  \ SSS 舒 un Jain 女学院（SSS Shasun Jain College for Women）\n\n电子邮箱：sridevi@shasuncollege.edu.in,\
  \ stdeepa@shasuncollege.edu.in\n\nDOI: [10.1201/9781003430452-51](https://dx.doi.org/10.1201/9781003430452-51)\n\
  \n## 摘要\n\n在过去的几十年里，为了及时决策，从开关、气动表、PID 控制、`PLC/DCS` 到如今研发与制造投入超过万亿美元的工业物联网自动化，工业系统的洞察得到了大量的探索。信息物理系统结合\
  \ AI、`ML`、云、边缘、虚拟计算能力、高量流服务和实时大数据分析的最新进展，将信息采集、交换、分析、决策和控制提升到了更高的水平。同样，人类活动监控在老年护理、疾病检测、辅助生活和远程咨询中起着关键作用。常见的人类监控传感器如\
  \ PIR、GPS 和高清摄像头价格昂贵，且存在与现有系统兼容性等局限性。提出的模型 `HMAMnet` 构建于无设备定位、混合胶囊 `CNN` 结合模型预测控制\
  \ (`MPC`) 方法用于输入（s）优化。`OPC` 等标准协议实现了开放的设备连接和数据交换。该模型处理来自热门 IOT 数据集的丰富活动数据，通过随机 `Smote`\
  \ 和 `PCA` 方法，并选择合适的超参数，这不仅使模型具有鲁棒性并提高了准确性，还能洞察控制输入参数以获得所需的输出模式。这些解决方案的工业优势包括增加运行时间、生产力、质量和收入，同时降低所有权成本、维护、能源和浪费。该模块补充了数字孪生仿真过程，具有环境行为模式趋势。因此，这一理念增强了活动监控系统的智能化，使其能够在工业和社会领域的可能场景下实现自动感知、处理、决策和执行。\n\
  \n关键词：人机活动监控、IIOT、`MPC`、`CapsuleNet`、预测控制、`CNN`\n\n# 引言\n\n1999 年左右物联网（`IoT`）的发明（Rose\
  \ et al., 2015）为消费、汽车、业务、工业和家庭空间的连接设备开启了大量应用（`[Beecham Research (2014)`）。`IoTTs`\
  \ 的广泛采用简化了流程，并开辟了以前不可行的途径。在医疗领域，它通过远程监控生命体征和活动，帮助了从远程咨询到老年护理、从疾病检测到辅助生活及用药依从的管理。`IACS`\
  \ 过程在过去几年里已经建立良好。虽然工业革命是基于蒸汽、电力、机器人自动化的（Moller, 2016），工业 4.0（2015）带来了智能产品、智能生产和智能服务。物联网（`IOT`）的固有连接特性结合数字技术骨干，为跨企业的数据可视性提供了解决方案，尽管性能、可用性和安全性仍是挑战，但它为工业控制系统问题开辟了更简单的替代方案。下节描述了\
  \ `IoT` 组件的特征及其治理原则（Boyes et al., 2018）。\n\n## IIOT 治理原则与特征\n\n物联网的治理原则通常包括：1. `IIOT`\
  \ 为环境提供持续连接以实现监控、维护和变现（3M 模型）；2. `IoT` 解决了数据转换问题，来自物理世界、人员、设备的大数据通过 A/D 转换器进行数字化；3.\
  \ `IOT` 数据通过 `PLC/DCS` 进行实时处理，需要 `DB` 来存储和处理其历史趋势；4. 业务、工程和科学洞察从 `IIOT` 实时数据中获得；5.\
  \ `IOT` 输出在实时提供洞察并采取控制行动；6. `IIOT` 改进了整个企业的数据可视性，其处理数据量、速度和价值的目标；7. 指向运营技术（`OT`）的转变，结合高性能计算、虚拟化、改进的延迟、带宽、安全性、可靠性，最终将分布式设备连接到\
  \ IT 云，从而节省空间、能源和部署时间。\n\n## IIOT 设备特征\n\n`IOT` 设备的功能、关键性和管理通常定义了其特征：a) 关键性定义了设备对生态系统的重要性，且通常根据高标准和安全合规性制造；b)\
  \ 如数据采集和用于分析传输数据的算法；c) 用于配置设备和控制其操作的接口；d) 与环境/设备的关系，例如温度传感器发送信号以增加风扇速度或关闭快。\n\n\
  ## 架构\n\n提出的四阶段物联网架构展示了数据采集、收集、传播、分析、云存储和可视化的所有组件，如图 1\n\n图 1. 典型的物联网解决方案\n\n主要指物理系统、环境、机器、设备和产生实时数据的人，例如控制水箱水位的阀门、水泥厂中产生数千个参数的燃烧窑和冷却系统、由各种传感器控制的电动汽车。第一阶段的传感器和执行器（运动跟踪系统）是跟踪运动、位置、测量质量、温度、压力等的设备，并将其转换为数字信号。它可能测量离散或连续的数据流。第二阶段的集中器是\
  \ `PLC`、`DCS` 以及可视化系统。\n\n\n\n\n\n第 3 阶段的边缘 IT 系统将从分布式系统传输的数据传输到云端、虚拟化等高级 IT 环境。IoT\
  \ 边缘计算解决了与云端相关的延迟问题，因为数据在其产生点附近进行处理。例如，大型分布式移动通信塔中的设备可以与 IOT 边缘模型进行同步。位于云端的远程 IT\
  \ 和企业 IT 系统处理这些车间层数据并将见解分发给不同的利益相关者，构成了第 4 阶段。Purdue `Williams, 1992)` 是另一个流行的模型，它通过将企业划分为制造、非军事区和安全区等不同区域，实现更好的数据安全和控制。上述模型为制造和企业实体更好的连接、计算和控制需求提供了基础设施\
  \ `(Bradicich, 2017)`。\n\n## 连接性与数据交换\n\n以下方面在设计不同层之间的连接时至关重要：a. 设备连接机制，如有线、无线和物理模式；b.\
  \ 数据传输的性质，如实时、离线或异步；c. 数据交换的触发方式，如通过设备、接收端或两者均可；d. 安全机制，如身份验证、识别（双向或单向）、授权（按用户角色）、加密（全或部分）；e.\
  \ 发现层、基础设施层、数据传输和安全层的协议。\n\n## IIOT 数据交换协议\n\n软件进程（Process）被定义为“`执行中的程序。”。当两个不同的程序在系统中运行运行时，它们通常通过一组协议进行相互通信。这两个独立进程之间的数据通过“对象链接与嵌入\
  \ (OLE)”方法进行交换。这一概念被扩展到工厂控制系统与 IT 监控工具之间的数据交换，使用了诸如 `OPC`（过程控制 OLE）等协议，该协议由 OPC\
  \ 基金于 1996 年制定，目前在工业领域仍然非常流行。\n\n自 80 年代后期以来，使用的其他流行的进程间通信 (IPC) 方法还如：动态数据交换 (DDE)\
  \ `(Kostek, 1996)`、共享内存（两个进程使用公共内存空间）、命名管道连接等，均由操作系统支持。这些方法能够连接到网络中另一个系统中运行的进程，例如远程命名管道、NetDDE\
  \ 等。因此，`OPC` 等协议制定了标准，使得工具可以通过一系列通信握手和异步回调中的确认，对如 ABB、西门子 (Siemens)、Allen-Bradley\
  \ 等专有 PLC/DCS 进行读写数据。\n\n这通常是一个基于 `COM/DCOM` 的客户端/服务器架构，其中客户端系统请求运行在 PLC/DCS 上的服务器组件，并输入如现场参数（用于读/写）、其值和时间戳，以异步获取数据。例如，为了降低振动较大的磨机的负载，需要通过\
  \ `OPC` 读取磨机声级、测量值、温度和磨削压力传感器的参数作为输入过程变量，并通过回回输送带速度（RPM）参数来减少进入磨机的进料，以维持磨机的进料设定点参数。\n\
  \n常用的工业协议包括：`Modbus`、`EtherNet/IP`、`PROFIBUS`、`DeviceNet`、`IEEE 802.11`、`TCP ISA100.11a`、`HART`\
  \ 等 `(Gutierrez et al., 2018)`。由于这些遗留协议的不兼容性，数据互操作性和交换一直是一个挑战。开放平台通信统一架构 (`OPC UA`)\
  \ 被更广泛采用，因为它基于 `TCP/IP`、`SOAP` 以及更高的安全性，相比于旧的 `COM/DCOM` 方法 `(Ferrari et al., 2018)`。它可以用于\
  \ `TCP/IP` 层，或在跨平台 `SOAP/https` 环境下配合 128 / 256 位加密，如 `Fig. 3` 所示。\n\n![图 2. OPC\
  \ VA 客户端-服务器通信](img/fig51_2_B.jpg)\n\n图 2. OPC VA 客户端-服务器通信\n\n![图 3. OPC 通信安全](img/fig51_3_B.jpg)\n\
  \n图 3. OPC 通信安全\n\n## AUML 机器监控与控制\n\n虽然前面的章节强调了与工厂系统的数据提取和控制方法，但 Ann 模型有助于在收集到的数据上构建智能控制系统，以实现所需的机器活动监控和控制任务。\n\
  \n如 `Fig. 4` 所示，车间集成的典型企业用例例如由企业 IT 团队管理的 ERP 或 MES 等客户端系统需要处理工厂数据。这些系统可以使用 `OPC\
  \ UA` 协议连接到运行在 PLC/DCS 上的 `OPC` 服务器并读取和处理数据。同样，需要控制工厂机械的优化软件可以通过 `OPC` 协议向执行器器写数据。\n\
  \n![图 4. IIOT 监控与控制](img/fig51_4_B.jpg)\n\n图 4. IIOT 监控与控制\n\n## 机器监控与控制系统\n\n通过上述\
  \ HMI 接口，对工厂设备进行操作监控和控制。`Figure 5` 描述了各种变量（`CV`、`MV`、`SP` 等），这些变量通过测量设定点与误差，将水箱水位（`CV`）控制到预期的设定点\
  \ (`SP`）。\n\n![图 5. 水位控制的典型系统](img/fig51_5_B.jpg)\n\n图 5. 水位控制的典型系统](#ch51.xhtml#R_fig51_5)\
  \ 虽然上述是典型控制系统的常用用例，但当今世界需要具有智能机制的监控并学习其运行过程，并采取控制措施以实现预期结果。本章提出了这种智能监控和控制原型，涵盖从数据汇集、学习（`ANN`）到预测控制\
  \ (`MPC`）。上述 `Fig. 4` 中的 AI/ML 组件可以扩展到下方提议的监控和控制流程，如 `Fig. 6` 所示。\n\n![图 6. HMAMnet\
  \ 监控与控制流程](img/55..__.figfig1_6_B.jpg)\n\n## HMAMnet 模型\n\n所提的机器活动监控网络 (HMAMnet)\
  \ 算法如图 `Fig. 6` 所示。如 `Fig. 6` 中的符号列表所示，`SP` (设定点) 是工厂系统需要维持的数值，例如 `5](#ch51.xhtml#fig51_5)`\
  \ 中的水箱水位在给定时间内需维持在 75 英尺。操纵变量 (`MV`) 是进水阀，用于调节流入水箱的水流并维持水位 (`CV`）。\n\n1. 假设被建模的\
  \ `[由 IoT 边缘汇集]` 的非线性过程数据用差分方程表示：`Ô (t + 1) = O(t- No + 1), I(t), I(t - Ni + 1))`\
  \ 其中 `Ô` 是输出预测，通常是工厂的目标变量（`CV`）。`No` 和 `Ni` 是过去的输出和输入。\n\n2. 建立深度学习神经模型：`f(x) ∂o\
  \ (w[2] ∂o (W[1]x + a[l]) + a[2]) = Ô(t + 1)`，\n\n    其中 `∂o` 和 `∂o` —— Sigmoid\
  \ 激活函数；`W[1]` 和 `W[2]` 优化的权重矩阵，`a[l]`、`a[2]`：输出层和隐藏层的偏置向量；`x = [O(t),..., O(t –\
  \ No + 1), I(t), ..., I(t - Ni + 1)]T`；\n\n3. 神经网络或胶囊卷积神经网络 (CNN) 模型提供预测，如时间序列值或异常分类概率。建议维持目标设定点所需的输入更改的\
  \ `MPC` 模型（模型预测控制）是离线训练的。\n\n\n\n\n\n# 4. 从 `IIOT/Edge` 验证过程数据通过 `PCA`（主成分分析）或 `SVD`（奇异值分解）进行验证，以仅包含对预测输出具有较高影响的输入，并对权重进行序列化以寻找\
  \ `Ô` 的后续值。\n\n# 5. 由于上述非线性建模会受到复制实际工厂过程差异的影响，因此引入了稳定器模块来处理数据中的噪声和未知扰动。\n\n如果模型误差表示为\
  \ `e(t)`，且不含过程不确定性的模型为：`Ô`，则稳定模型表示为：`O(t)= Ô (t) + ê (t)`\n\n# 6. 上述扰动被限制在由先前扰动的`分段线性`函数（`PWA`）定义的允许策略列表中（Bemporad\
  \ et al., 2004）。非线性 `MPC` 旨在最小化代价函数，以达到目标系统控制所需的设定点范围。`HMAMnet` 输出（未来的 `MV` 变化）通过模糊优化器验证并馈送过程，而\
  \ `CV` 与设定点之间的偏差决定了是否需要再次对模型进行在线调整。该模型渐近收敛得更快且更接近所建模的过程。\n\n因此，如上述提出的 `HMAMnet`\
  \ 模型中基于智能 AI/ML 的监控与控制，或适用于特定用例的简化版本，对于避免人工干预并为系统运行创建稳定环境以确保对过程参数的持续监控非常有帮助。`HMAMnet`\
  \ 的属性列如下表所示\n\n### 表 1 I-IMAMnet 特性\n\n| 参数 | 采用的方法 |\n| :--- | :--- |\n| 过程动力学\
  \ | 非线性 |\n| 系统识别 | `ANN` / `Capsule CNN` 提供观测的概率/姿态 |\n| 不确定性类型 | 具有乘法不确定性的不变加性扰动\
  \ |\n| 不确定性传播 | 通过神经稳定器模型的无界扰动 |\n| 控制输入参数化 | 控制策略的仿射参数化 |\n| 输入约束 | `PCA/SVD` |\n\
  | 预测约束 | 输出约束收管 |\n| 滚动域实现 | 输出反馈 |\n| 优化算法 | 修改的 `GPC` 代价函数 |\n\n下方 图 7 和 图 8 展示了带有扰动的过程变量输入方差，以及与手动操作相比，所提\
  \ ML 模型随时间推移具有更小的方差和控制输出变量的稳定维持。\n\n![图 7. 系统输入过程方差](img/fig51_7_B.jpg)\n\n图 7.\
  \ 系统输入过程方差\n\n![图 8. 手动与模型的输出控制](img/fig51_8_B.jpg)\n\n图 8. 手动与模型的输出控制\n\n## IIOT\
  \ 活动监控应用、优势与挑战\n\nIIoT 从制造到供应链的所有领域对生产力与运营效率具有变革性影响，具体体现在以下用例、优势和限制中。\n\n以下是工业物联网的典型应用：1.\
  \ 过程监控，2. 温度/压力监控，3. 水质监控，4. 流量监控，5. 远程资产监控，6. 蒸汽阱监控，7. 机器健康监控等。\n\n## IIOT 监控优势\n\
  \n将 AI 与分析能力及负载卸载到分布式设备上。例如，当预测模型部署在质量控制相机上时，IoT 边缘会在出现问题时触发告警并在本地处理，或发送到云端进行进一步分析。其他优势包括\
  \ 1. 减少停机时间，2. 减少浪费（人员、机器和材料），3. 提高系统安全与质量，4. 主动维护，5. 有价值的性能洞察，6. 跨企业的工厂楼数据无缝可视化；7.\
  \ 降低所有成本。\n\n## IIOT 挑战\n\n工业物联网监控与控制解决方案至关重要，但大多数工业系统都有孤立的专有监控解决方案。对于大型工业企业，构建统一的自定义监控解决方案是不现实的。将常用的工业接口进行本地化需求定制也是一个不利因素；其他挑战列如下：\n\
  \n1. 跨跨区域或国家部署和运行远程监控系统不可行。\n2. 将设备接口到第三方监控解决方案会使过程更加复杂，导致不确定性。\n3. 来自不同供应商具有小众或额外功能的特性使得系统更加昂贵。\n\
  4. 旧工厂现有的连接网络基础设施可能无法辅助提供自定义的 IoT 监控解决方案。\n5. 从不同供应商的解决方案创建自定义功能组合会导致系统复杂。\n6. 为了增强内置系统的功能，通常需要添加额外的仪器和传感器，并增强全企业的数据采集能力。\n\
  \n## 结论\n\n本章介绍了 IIOT 从遗留控制系统、数据采集和聚合层的演进，以及其向云端/企业级网络的边缘分发。讨论了各种工业连接协议，并详述了开放平台通信统一架构（`OPC\
  \ UA`）标准及其在 `TCP/IP` 和 `SOAP` 层次上的客户端-服务器通信。`OPC UA` 还可以通过地址空间和预建模型将制造资源、嵌入系统分配到所需的区域和扩展计算节点。其主要优势是为不同系统提供了统一的信息访问平台，Chen\
  \ 等 (IEEE) 通过 IIOT 进行机器活动监控形成了物理系统的关键领域，它可以被增强为面向服务的模型（Rojas and Garcia, 2020）。文中讨论了典型的机器活动监控用例以及所提\
  \ `HMAMnet` 模型原型，它适用于 4 层级 IIOT 堆栈。此类 AI/ML 解决方案（William and Ferraro, 2022）可以构建从\
  \ IIOT 收集的大量廉价云数据之上。\n\n## 参考文献\n\n1. K. Rose, S. Eldridge, and L. Chapin (2015)\
