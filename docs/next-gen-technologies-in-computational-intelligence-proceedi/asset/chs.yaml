  算子概率在决定解的质量和收敛速度方面起着至关重要的作用。由于遗传算法范围无限，测量优劣的参数值需要大量工作。这提出了在 GA 进化过程中修改算子概率的想法。所提的方法使用基于遗传算法（GA）的优化技术对\
  \ UWSN 节点进行放置和部署，以实现覆盖最大化、减少所需节点数量以及减少有效所需的节点。\n\n### 函数：`Cluster GA`\n\n令 `p(t)` = {*c*[*t*]¹,*c*[*t*]²,…*c*[*t*]^(*n*)}\
  \ 为 `(t)`时的种群\n\n- **输入**: 参数，`C[clusters]`，`D[values]`\n- **输出**: 簇\n- **开始**:\n\
  \    - 初始化种群\n    - 每一代：\n        - 计算适应度\n        - 选择配对\n        - 交叉和变异\n   \
  \ - 直到最大代数或收敛\n- **结束**\n\n 实验设置\n\n在 `NS-2` 上使用 `OTCL`（对象工具语言）创建的仿真类似于面向对象的语言。本部分展示了性能参数，如吞吐量、`PDR`、端到端延迟和组织寿命。\n\
  \n\n\n\n水下无线通信在军事和私人业务、环境监测、水下研究、科学数据收集等海洋作业中起着至关重要的作用。本研究介绍了解决这一问题的方法：水下传感器网络（UWSN）的高效聚类路由遗传算法（`GA`）。提出的\
  \ `HTDE` 计算对信息进行扰乱，随后利用 `GA` 将源端通过 UWSN 传输机信信息。为了扩展网络生存能力，使用汇聚节点（`SNs`）进行信息聚合，动态路由节点选择旨在跟踪最佳且最快的路径。遗传算法（`GA`）计算跟踪信息传输的最限制路径以避免延迟。所提出的\
  \ `GA` 协议和 `TBTL` 计算提高了信息传输效率和连接安全性，减少了能量消耗并延长了网络寿命。所提协议减少了端到端延迟和数据丢失。所提出的 `GA`\
  \ 协议和 `TBTL` 结果显示出比以往方法更好的性能。\n\n## 参考文献\n\n1. Zhang, M., and Cai, W. (2020). 水下传感器网络\
