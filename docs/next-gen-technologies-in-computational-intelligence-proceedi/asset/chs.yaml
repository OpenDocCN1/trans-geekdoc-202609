  \n# 基于深度学习的实时坑洼检测\n\nSanchay, Dakshita, Priya, Sathya 计算机科学与工程系\n\n## 摘要\n\n根据研究，60%\
  \ 的交通事故是由结构性问题和道路状况不佳引起的。今天，道路是主要的交通方式，人们日常高度依赖道路。由于对道路的高度依赖以及气候变化，道路发生了变化并退化。这导致了坑洼的形成，极是不安全的。在像印度这样拥有数千公里的国家，识别这些坑洼是困难的。由于肉眼无法始终定位并检查这些坑洼，因此需要自动检测。对于行驶安全至关重要，因为即使是微小的颠簸或这些坑洼的不可见性也可能导致致命，特别是对于消防员和救护人员。所提出的工作将通过使用防止生命财产损失。\n\
  \n关键词：深度学习、MIDAS、目标检测、坑洼、道路安全\n\n# 引言\n\n根据研究，60% 的交通事故是由结构性问题和道路状况不佳引起的。今天，道路是主要的交通方式，人们日常高度依赖道路。由于对道路的高度依赖以及气候变化，道路发生了变化并退化。这导致了坑洼的形成，这极是不安全的。在像印度这样拥有数千公里的国家，识别这些坑洼是困难的。由于肉眼无法始终定位并检查这些坑洼，因此需要自动检测。对于行驶安全至关重要，因为即使是微小的颠簸或这些坑洼的不可见性也可能导致致命，特别是对于消防员和救护人员。一些现有模型使用不同的方法识别坑洼，但尚未证明其效率很高。因此，提出了一项集成了音频模块、`YOLOv4`\
  \ 和 `MIDAS` 的工作，用于寻找特定深度的坑洼。\n\n建议的研究适用于手动驾驶和自动驾驶车辆，预计该模型将表现出更高的精确准确性，以提高安全性。\n\n\
  \n\n\n\n`CSPDarknet53` 架构通过扩展网络能力和降低计算成本提升了 `Yolov4` 模型的性能，使其相比 `YoloV3` 和 `Mobilenet\
  \ V2` 表现更好。与其他目标识别算法相比，`YoloV4` 相对容易训练，这对于定制系统以识别不同情况下特定类型的路洼至关重要。`YoloV4` 为针对特定应用定制算法提供了更多选择，包括更改锚框（anchor\
  \ box）大小和训练迭代次数的能力。`YoloV4` 支持动态卷积和网格激活（mesh activation）等新功能，提升了准确性和性能。总之，得益于精度、微小物体检测、速度、定制可能性以及对新功能的支持，`YoloV4`\
  \ 在路洼识别方面优于 `MobileNet SSD` 和 `YoloV3`。\n\n## 文献综\n\nPrakash & Sriharipriya (2022)\
  \ 训练并比较了 `YOLOX-nano` 模型与多个 YOLO 模型（如 `YOLOv3`、`YOLOv4` 和 `YOLOvS` 模型）。测试表明，`YOLOX-nano`\
  \ 模型比任何其他模型都精确。`YOLOX` 数据集基于 `COCO 2017` 数据集格式化。分配到特定文件夹的预处理数据收集作为 `YOLOX` 模型的训练输入。该模型设计用于寻找单类路洼。模型的平均精度为\
  \ 85.6%，虽然推理速度比其他模型慢，但比 `YOLOvSm` 模型的值高出 24.06%。\n\nAsad 等人 (2022) 的工作指出，`YOLOv4`\
  \ 和 `Tiny-YOLOv4` 是最合适的路洼检测模型，因为它在单板计算机（树莓派）上使用 AI 组件（`OAK-D`）作为路洼检测的边缘平台。自定义权重被转换为\
  \ `OpenVino IR` 格式，以便在 `OAK-D` 和作为主机的树莓派上进行实时检测。然而，该的方法缺乏成本效益。\n\n根据 (Anandhalli\
  \ 等人，2022) 的研究，对顺序 `CNN` 和 `YOLO` 比较，`CNN` 需要的训练时间少于 `YOLO`（基于锚点），同时保留了路洼检测性能。`CNN`\
  \ 中的目标检测是通过“目标分类”和“目标定位”完成的。该方法未能编码位置和物体朝向。\n\n根据 [Egaji 等人 (2021)]，需要来自道路和汽车的样本来进行进一步分析，并开发在各种情况下都能有效工作的更有效的模型。\n\
  \n[Abhiram 等人 (2021)] 使用的方法是一种基于振动的技术，可以机械地检测孔和凸起以及每个孔的严重程度。论文缺乏技术规范和详细的方法论说明。此外，该工作实验验证不足，因为它只行驶了四公里的路。该工作缺乏新颖性，且类似于\
  \ Google Maps。在 95% 的置信水平下，五个机器学习模型（`SVM`、`Naive Bayes`、`KNN`、`Logistic Regression`\
  \ 和 `Random Forest Tree`）的平均准确率为手动记录路洼事件使用了 `GPS` 和 `UNIX` 时间戳数据。由于物体朝向和检测不佳，来自手动收集数据集的训练输入可靠性较低。\n\
  \n[Peng 等人 (2022)] 的工作强调了模式表示，并提出了三组数值特征来表示路况。还考虑了三种深度学习技术——`Deep Feedforward Network`、`Convolutional\
  \ Neural Network` 和 `Recurrent Neural Network` 来解决分类问题。发现 `RNN` 是最好的。使用了 `Adam`\
  \ 优化器，并选择了 `LSTM` 单元的 10 个内部节点。然而，这出了本研究的范围，尚未评估不同 `RNN` 单元在所提数据集上的性能。\n\n所建议的技术结合了红外成像和卷积神经网络，可以与已使用的路洼检测技术竞争（Anandhalli\
  \ 等人，2022）。训练和验证数据集使用了三种不同的比例：`60:40`、`80:20` 和 `90:10`。[Aparna 等人 (2022)] 推荐的方法使用了基于\
  \ `CNN` 的 `ResNet` 模型。这是首次使用红外成像进行路洼识别。但由于使用热成像进行路洼识别是一个新概念，因此在该方向没有现有的工作可以比较。\n\
  \n### 提议系统\n\n为了获得预期的有利结果，获取的数据经过转换并通过了多个过程。该工作的整个过程在 [图. 2] 中完整描述。从多个来源收集了 700\
  \ 张包含有和无路洼的道路图像。图像按 `80-20` 的比例划分为训练集和测试集。为了确保数据的完整性，通过将像素值转换为 `[0, 1]` 范围并使用 `中值滤波`\
  \ 处理缺失数据来完成数据准备。为了保持空间维度，使用 19 层带有 `3x3` 滤波器的卷积层和 5 层带有 `2x2` 滤波器的最大池化层完成特征提取。然后应用了具有\
  \ `0.1` 负斜率和额外填充的 `LeakyReLU` 激活函数。使用了 `IoU` 阈值为 `0.5` 的 `二元交叉熵` 损失函数来训练 `Yolov4`\
  \ 模型。为了扩大训练集，使用了包括随机翻转和旋转在内的数据增强方法。\n\n![图 2. yoloV4、yoloV3 和 SSD MobileNet2 的性能对比可视化](img/fig43_2_C.jpg)\n\
  \n[图 2. yoloV4、yoloV3 和 SSD MobileNet2 的性能对比可视化]\n\n`MIDAS`（通过自适应结构损失的单目深度估计）方法被用于测量距离相机的距离。使用小孔相机概念将\
  \ `MIDAS` 创建的深度图转换为实际距离。由于距离估计，该技术能够提供有关路洼位置和严重程度的精确信息。对于 `MIDAS`，像素值归一化到 `[0,1]`\
  \ 范围，并将图像放大到 `256 x 256` 像素。然后通过运行 `MIDAS` 模型获取归一化图像。小孔相机模型将深度图转换为实际距离。它假设光沿直线移动，并将场景\
  \ 3D 点投影到 2D 平面上以创建图像。\n\n![图 1. 框图](img/fig43_1_B.jpg)\n\n图 1. 框图\n\n## 结果与讨论\n\
  \n实验表明，在 700 张照片的测试集中，`YoloV4` 的平均精度和召回率分别为 `0.85` 和 `0.91`。`Fl` 分 `0.88` 显示了良好的路洼检测准确率。在\
  \ 700 张测试照片中，95% 被准确识别为路洼或非路洼。`Yolov4` 模型成功检测了各种大小、形状和光照条件的路洼，展示了其在实际环境中的潜力。未来的研究可能会侧于提高模型在困难条件下的鲁健性和准确性。\n\
  \n\n\n\n\n`YoloV4` 模型的视觉展示证明了它与 `YoloV3` 和 `SSD MobileNet V2` 相比具有更高的准确率、精确度和 mAP。`Yolov4`\
  \ 拥有先进的增强技术，如 `mix up` 数据增强和 `cutmix` 数据增强，这些技术在 `YoloV3` 和 `SSD MobileNet V2` 中是不存在的，这些技术有助于增加训练数据的多样性和数量，并提高模型的准确性。\n\
  \n表 1 展示了 `Yolov4` 模型与其他模型的对比。\n\n| ALGORITHM | ACCURACY | PRECISION | mAp |\n|\
  \ --- | --- | --- | --- |\n| YOLOV4 | 0.95 | 0.91 | 80.08% |\n| --- | --- | ---\
  \ | --- |\n| YOLOV3 | 0.89 0.90 | 65.05% |\n| SSD MobileNetV2 | 0.63 | 0.75 | 41.83%\
  \ |\n\n根据视觉表示，`YoloV4` 在所有评估指标上的表现都优于 `YoloV3` 和 `SSD MobileNet V2`，具有更高的值和更可靠的结果。`YOLOV4`\
  \ 使用了 `YOLOv3` 或 `SSD MobileNetV2` 未包含的高损失函数，例如聚焦损失函数和 `DIoU`（距离-IoU）损失函数。这些损失函数有助于解决类别不平衡问题，并提高模型在挑战性情况（包括检测微坑洼）下的准确性。`YoloV4`\
  \ 可以与距离估计算法（如 `MIDAS`）轻松连接，以确定坑洼与车辆的距离。这对于提前司机前方有坑洼至关重要，让他们防止损坏车辆。\n\n## 结论\n基于人工智能的坑洼识别技术可以改善道路维护，特别是在印度。应急服务必须采取一切措施以避免可能危及生命的阻塞。这项工作扩展到在将照片分类为坑洼后确定坑洼的位置。通过使用发现的坑洼深度和严重程度等因素，报警系统可以警告司机避开不平整的路并防止事故。该模型在实时情况下显示了良好的准确性和坑洼识别能力。通过引入声音警报系统和使用\
  \ `MIDAS` 进行距离测量，系统的可用性和安全性得到了进一步提高。Web 应用程序使得模型的用户界面易于访问，让人们更容易在实际情况下应用它。在未来的研究中，本研究开发的坑洼检测系统可以通过包含\
  \ `GPS` 和传感器来收集更多数据进行进一步改进。使用 `GPS`，系统能够更精确地定位坑洼，并为司机提供关于前方路线的详细信息，包括道路状况和交通模式。\n\
