  \n图 3. 最大心率与年龄\n\n## 混合模型\n\n我们使用多种方法来构建高准确的混合模型。组合模型基于所选算法的概率运行。为了创建混合模型 `SDKL`，将\
  \ `Decision tree`、`SVM`、`Logistic Regression` 和 `KNN` 方法合并（Mohan et al., 2019）。训练数据与每个算法的概率相结合。测试数据也是如此，它与已知概率堆叠。该数据集现在已使用混合模型\
  \ `SDKL` 完成了训练和评估，其准确性已经确定。\n\n## 混合模型\n\n![Fig. 4. 混淆矩阵](img/fig10_4_B.jpg)\n\n\
