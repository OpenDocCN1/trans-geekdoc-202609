  \ 摘要\n\n一种名为 `Honeywords`（蜜罐）的安全方法被用于识别并停止网站密码攻击。该方法涉及在网站中真实密码之外包含蜜罐（即虚假密码）。如果黑客访问数据库并尝试使用蜜罐，系统将向网站管理员发送可能发生安全泄露的警告。这种技术非常有帮助，因为它让黑客难以区分合法密码和虚假密码，从而降低攻击的发生率。为了构建针对密码攻击的多层防护，蜜罐可以与其他安全措施结合使用。总的来说，蜜罐为加强网站后端安全和保护关键用户信息提供了一种实用的解决方案。随着网络攻击的增加，蜜罐作为一种安全解决方案变得越来越常见。网络安全仍然受到密码攻击的严重威胁，但蜜罐可以通过加强现有的防御来提供帮助。\n\
  \n关键词：密码、蜜罐、遗留 UI、蜜罐加密、蜜罐检查器、加盐、Sweetword\n\n# 引言\n\n多年来，密码一直是保护网络账户的标准做法，但它们也有自己的一系列问题。密码盗取是一个严重的问题，可以通过网络钓鱼或黑客攻击发生。密码被破解，它可能被用于盗取身份或获取机密数据的非法访问。近年来，研究人员调查的一种保护网络账户的极具前景的策略是使用“蜜罐”。蜜罐是虚假的密码，看起来和感觉起来很真实，但实际上是欺诈性的。这种技术的目的是让获取密码的黑客无法判断哪一个是真实密码，从而无法访问账户。本文将涵盖蜜罐的概念、其工作原理以及为什么它们在对抗网络犯罪的斗争中可能是一种有效工具。\n\
  \n尽管蜜罐的使用是一个较新的概念，但网络安全领域已经对其表现了浓厚的兴趣。其中一个解释是，蜜罐在不强制用户记忆复杂密码或通过额外的身份验证阶段的情况下，提供了额外的安全层。此外，蜜罐是增加账户安全的快速且廉的方法，因为它们可以简单地实到当前的身份验证系统中。蜜罐背后的基本思想很简单：如果黑客获取了密码数据库，他们将无法区分真实密码和虚假密码。他们必须在找到正确密码之前尝试多个密码，这使得他们登录账户变得困难得多。这不仅为账户提供了额外的安全保障，还作为攻击的早期预警系统。此外，用户可能无法区分真实密码和虚假密码之间的区别，这引发了关于他们将如何应对蜜罐使用的问题。总之，蜜罐是一种保护在线账户的尖端方法，可以为黑客增加一层额外的防护。尽管在应用中仍存在某些困难，但蜜罐的优势使其成为反网络犯罪斗争中一种可行的工具。随着技术的进步，我们可能会看到该领域进一步的进展，因为网络安全社区一直在不断寻找新鲜且创新的解决方案来保护我们的在线账户。\n\
  \n这种方法作为一种保护用户数据和防止非法访问后端系统的潜在有效手段而引起了关注。我们将在本文中深入地探讨蜜罐的概念，涵盖其运行机制、优势以及任何潜在的实施困难。我们还将查看蜜罐的一些实际实现，并为想要使用这种方法增加安全的网站所有一些实用的建议。\n\
  \n## 文献综述\n\n[1] 此架构将蜜罐系统连接到物联网框架。安全要求可能会危及最关键的可用性标准之一：拼写安全。这是因为合法用户的常规打字错误有 38.09%–69.67%\
  \ 的概率被误认为恶意活动。该方法使用了超级词，其运行方式可能并不与遗留 UI 相同。该策略很可能也属于修改用户界面组，并表明上述方法可能无法充分保护在使用此类威胁模型时发现的海量关联用户名-密码组合的视图。我们提出了一种简单的技术，忽略任何个人身份信息\
  \ `PII`，如人的姓名或生日。通过数据集，建议的方法可以找到比预期相关性至少高 5 到 22 倍的用户名-密码对。最后，该方法为基于二进制的资源受限的 IoT\
  \ 设备提供了一种基于蜜罐的身份验证协议。\n\n[2] 对于外部攻击者，HPAKE 为密码泄露提供了蜜罐策略。如果服务器被破解，黑客将获得一个密码列表，其中通过离线猜测方法获得了常用词。攻击者最可能利用\
  \ HPAKE 和蜜罐来获取账户访问权限，因为他们无法区分它们。身份验证过程通过密钥交换进行特定管理。只有使用有效会话密钥加密的指令在正确的密码被允许，从而创建实际密钥。尽管\
  \ HPAKE 的想法看起来很合理，但在实践中面临巨大困难。这一观点强调了 aPAKE 和蜜罐是两种独特的密码管理技术。文章随后指出，在使用 aPAKE 方法时，密码在客户端必须以明文保留，不能与服务器共享。服务器随后接收此密码进行验证。身份验证服务器运行的每个\
  \ aPAKE 都有自己独特的密码。对于具有显式验证的 aPAKE，只有当客户端密码和服务器密码相同时，才会创建会话密钥。\n\n[3] 我们建议了一种新的攻击策略，称为“考虑输入的多系统交叉攻击”。“成对距离协议”在这种攻击场景下的安全性不足。该方法产生的蜜罐与真实密码可以互换，并且是有效且实用的。为了避免合法用户意外输入蜜罐时产生假误报，使用了\
  \ `Levenshtein distance` 来保持密码与蜜罐之间的安全距离。它利用了黑客向公众公开的密码数据库。我们通过实验证明了所建议的蜜罐生成策略的精确平直性。我们在多个指标上将建议的方法与当前的蜜罐创建方法进行对比，以支持这一主点。\n\
  \n\n\n为了保护和管理用户的密码，一种解决方案是使用密码管理器。数据会通过密码管理器进行加密以保护其安全性，但它们仍然容易受到暴力破解等网络攻击的威胁。如果攻击者成功猜出主密码，所有的用户密码都将泄露。为了增强安全方法并为密码管理器提供保护，蜜罐加密（honey\
  \ encryption）曾被一种解决方案。通过识别、阻止和欺骗暴力破解攻击者实施的数据泄露，蜜罐加密方法帮助密码管理器解决各种安全挑战。为了进行检测，建议的系统会生成并保存许多自动创建的蜜词（honey\
  \ words），这些词与用户的实际密码相似，并将与输入的密码进行对比。如果密码与任何一个蜜词匹配，系统将识别出入侵者并阻止其访问账户。作为一种安全措施，他们会被重定向到一个带有虚假信息的假账户。\n\
  \n本研究探讨了字母数字型用户名和密码在计算机系统中作为身份验证和入侵防护标准的常用性。然而，随着数据共享、互联网使用、数据传输和验证的增长，安全威胁也随之增加。多种加盐（salting）和哈希（hashing）技术被用于在数据库中存储密码文件以解决这些问题。尽管如此，攻击者继续使用暴力破解、密码猜解和其他方法获取用户凭据。另一些人则认为密码哈希不足以抵御此类攻击。在使用基于密码的身份验证时，第一层加密通常要求攻击者以尽可能少的尝试成功猜中密码。安全专家不断创建密码授权技术以防止黑客破解密码。黑客在特定的迭代中使用尖端技术来破解密码。本研究使用了时间复杂度较低的、使用二进制操作执行的独特哈希算法。\n\
  \n根据隐私策略，应使用单向加密存储网站密码以防止解密。然而，随着计算机性能的提高，`MD5` 和 `SHA-1` 哈希算法发生了碰撞，这表明像 `SHA-256`\
  \ 这样被认为是安全的哈希函数将被用于解码。加盐是在密码的开头或结尾添加哈希函数的过程。在之前的盐使用方法中，盐随机分配给每个用户，但只生成一次并作为常量值存储在数据库中。这产生了一个漏洞，因为如果数据库被破解，密码可以使用盐轻易解密。基于访问的盐不断演变，以增加密码安全性并隐藏加盐过程。\n\
  \n## 方法与技术\n\n本文旨在对物联网（IoT）框架的关键词系统提供准确的密码分析。尽管在物联网框架中将密码作为身份验证元素有许多好处，但它经常继承基于密码的身份验证的安全缺陷。这些缺陷中的某些可以通过基于蜜词的身份验证来修复。在将蜜词协议与物联网基础设施相结合时，需要仔细的设计方法。本研究通过这种方式为接下来的两个主要目标提供了参考。本研究表明，研究人员正在不断创建一种同时满足安全性和可用性视角要求的蜜词策略。在任何人选择保护组织密码文件的方法之前，他们必须对其安全性（以及可用性）标准有更好的理解。\n\
  \n### 安全分析\n建议的模型除了防御密码猜解攻击外，还提供了针对内部攻击的防御，这在传统的 `aPAKE` 安全模型中都被考虑到了。通过识别真实密钥与蜜罐密钥之间的相似性，它还可以识别密码泄露。与蜜罐机制和\
  \ `aPAKE` 相比，该解决方案可以提供更高的安全性。在身份服务器被破解的情况下，`HPAKE` 的安全性高于利用 `OPAQUE` 的 `Password-over-TLS`，因为它能够识别密码泄露。在防御内部威胁和密码猜解攻击方面，`HPAKE`\
  \ 与 `OPAQUE` 相当。我们的 `HPAKE` 技术使用注册过程中生成的蜜词来生成用户的私钥和公钥。服务器随后存储蜜公钥和真实公钥。服务器使用密钥交换技术在身份验证期间利用用户的不同公钥生成多个会话密钥。为了发现密码违，服务器随后判断客户端使用的是真实会话密钥还是蜜会话密钥。通过解密用户初始蜜词私钥的密文，我们的概念使用蜜罐加密产生用户特定的蜜词私钥。我们的\
  \ `HPAKE` 系统的基本优势可以在服务器上生成多个会话密钥，同时对真实密码和蜜词使用相同的密文，从而消除了对大量 `OPAQUE` 输出实例的需求。\n\n\
  ### Legacy-LH 密码更改\n系统使用的重要术语是“令牌”，描述一组可以视为单个逻辑单元的字母组合。密码的“模式”由其包含的不同令牌组合组成。令牌或密码模式在密码数据库中的出现频率通过其出现的次数来衡量。系统不跟踪字母和数字的长度，但它会跟踪特殊字符的长度，以便生成与用户实际密码相同的蜜词。因此，模式表示在特殊字符长度处添加\
  \ `S` 作为下标。通过整合来自用户配置的特定信息并确保其满足与实际密码的最小分离要求，产生蜜词。根据用户输入生成各种令牌集是生成蜜词的一种方法，例如：B.\
  \ 字母字符串、数字字符串和特殊字符。将每个令牌集的组件合并以创建潜在的蜜词组合。如果密码中出现了与用户配置相关的子字符串，这种策略将特别有用。因此，这种方法生成的蜜词在大多数用户密码中很难被识别。\n\
  \n\n\n\n密码管理器在用户注册并创建用户名和主密码时，会对用户输入的密码进行哈希处理，并生成一组与原始密码高度相似的蜜饵密码（honeywords）。这些蜜饵密码作为识别并阻止外部人员入侵的信号。OTP\
  \ 加密对所有用户应用凭据进行加密，这增加了额外的保护层，因为密码管理器存储了其他程序和网站的密码。在登录时，密码管理器为用户提供一个登录界面以输入详细信息，并允许三次登录尝试。密码管理器使用\
  \ OTP 解密应用密码，如果用户提供的哈希主密码与已存储的哈希主密码匹配，则授予访问权限。之后，用户被重定向到其账户页面，该页面包含其所有的密码。如果黑客尝试输入其中一个蜜饵密码，密码管理器将识别出未经授权的访问并将其重定向到手机锁密码页面。这确保了应用密码受到\
  \ OTP 保护的安全，同时欺骗黑客使其认为他们访问了合法账户。如果用户尝试超过三次且未输入有效的蜜饵密码，其账户将被禁用程序也将终止。为了防御暴力破解攻击，一种名为蜜罐加密（Honey\
  \ Encryption, HE）的加密技术会为输入错误密钥的外部人员创建一个看起来真实的虚假信息，而其真实含义被仔细隐藏。密码管理器（PM）是一种使用单一主密码锁定用户所有密码并安全存储的软件。除了保护密码外，密码管理器有助于减少用户误输密码的次数，从而提高密码质量。\n\
  \n## 用户注册\n为了启动注册过程，你必须创建一个新的用户账户，该账户将作为数据库记录，描述你验证身份的方式。你必须证明你的身份与用户账户匹配才能通过验证。用户在注册时，除了所需的用户名和密码外，还需要输入特定的详细信息。\n\
  \n### 加密/解密\n使用技术将密码加密为不可理解的文本，以识别黑客。之后，进行密文创建，以生成用于下一步的密文。\n\n### 添加盐值\n通过附加特定的盐值（salt\
  \ values，通常称为无关数据）增加了一层安全保护。这增加了密码的长度，提升了另一层安全性。\n\n![Fig. 1. 蜜饵密码认证的工作原理](img/fig59_1_B.jpg)\n\
  \n图 1. 蜜饵密码认证的工作原理\n\n### 哈希函数\n当输入字符串最初作为密码时，会对密码进行哈希处理。然后计算密码的长度，并将字符串进行反转。反转后的文本被转换为二进制字符串，并根据密码的长度随后填充额外的位。为了创建一个安全且独特的哈希值，该方法涉及许多以不同方式翻译和更改密码的步骤。\n\
  \n这种与真实密码无关的设计方法的用处在于，它可以防止攻击者从单个蜜饵密码中快速确定真实密码。此外，它使得蜜饵密码能够以相同的频率生成，让攻击者难以发现真实密码。然而，这种方法使得使用概率密码模型变得困难，在设计和评估阶段必须进行重大调整。当攻击者了解用户注册序列时，这些更改变得更加困难，因为这使蜜饵密码的生成过程变得复杂。我们创建了四种蜜生成生成技术，每种技术都有其独特的保护机制，以解决这些困难。为了确定最可靠的蜜饵技术，我们对这些策略进行了广泛分析，并比较了它们在各种攻击场景下的效率。总体而言，我们的蜜饵生产方法比传统方法有很多优势。通过使用与真实密码无关的设计并创建各种蜜饵密码技术，即使攻击者深入了解用户注册过程，我们也让他们猜测真实密码变得更加困难。\n\
  \n## 结论\n我们得出结论，蜜饵系统已被证明是增加各个领域安全措施的有效且成功的工具。企业和组织频繁使用它，因为它具有识别和阻止暴力破解、钓鱼和密码猜测等网络攻击的能力。由于蜜饵系统能够识别识别并阻止网络攻击，企业和组织经常使用它。在金融、医疗等数据泄露会导致严重后果的高风险行业，这种方法非常有用。尽管具有优势，蜜饵系统还需要额外的安全措施来防御网络攻击。总的来说，这种策略是数据泄露的一种希望解决方案。##\
