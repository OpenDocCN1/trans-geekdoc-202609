  \n\n\n\n\n# 基于进化计算的无线传感器网络中信任感知节高效模型\n\nMythili Varatharajan,^(²)\n\nDOI: [10.1201/9781003430452-3](https://dx.doi.org/10.1201/9781003430452-3)\n\
