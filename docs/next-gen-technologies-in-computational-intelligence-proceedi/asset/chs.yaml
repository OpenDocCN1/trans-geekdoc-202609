  \ |\n\n## 这里的 VGG-16 进行预处理\n\nVGG-16，使用 `Keras` 的深度卷积网络用于大规模图像识别。该模型在处理图像时进行 RGB\
  \ 均值归一化。VGG-16 使用了 13 个卷积层和 3 个全连接层，并使用 2x2 的最大池化来保持空间分辨率。该网络使用 3x3 的感受野、卷积步长为一以及\
  \ `ReLU` 激活函数。\n\n预训练的无监督迁移学习在源域和目标域都不使用标记数据。无监督迁移学习从源域迁移知识以改进目标预测模型，当它们的领域和任务相似时。\n\
  \n## 奇异值分解 (SVD)\n\n输入图像的特征图数量与输入图像的大小正比。因此，处理生成的巨大特征向量非常困难；因此使用无监督特征选择方法——奇异值分解来降低向量空间的维度。\n\
  \n矩阵 `M` 的奇异值分解为：\n\n(1) `M = U Σ V^T`\n\n其中矩阵的大小为 `U -> V^T -> r x m, S -> r x\
  \ r`。矩阵 `X` 的对角线元素是奇异值，如 `δ ≥ δ2 ≥ ... δr > 0`，其中 `r` 是矩阵 `M` 的秩。分解利用了 `M` 的行和列的线性组合。使用\
  \ SVD 进行降维的无监督方法是有有趣的方法。\n\n(2) `M ≈ M[k] = U[m x k] Σ [k x k] V[k x k]`\n\n\n\n\
  \n\n在总共 2300 个样本中（即在测试考虑的不同光照条件下，每类 100 个样本），系统正确识别了 2110 个手势。所提方法的性能与最先进的方法几乎相同或超过了后者，如图\
  \ 6 所示。对比是基于 (Sorzano and Vargas, 2014) 进行的，使用 `K-NN` 对手势分类的准确率如表 1 所示。\n\n![Fig.\
