  \n# 用于物联网 SEM 系统的高效 PHOA 路由协议\nP. Priyadharshini,^(12)\nDOI: [10.1201/978100340452-13](https://dx.doi.org/10.1201/978100340452-13)\n\
  \n## 摘要\n物联网（IoT）是一个机器、设备、电子设备和传感器的系统。它形成了一个可以完成数据传输的网络。物联网设备通过无线连接。可以使用物联网实施智能能源管理（SEM）系统，用于工业、家庭和商业建筑的能源管理。需求响应能源管理是降低成本的关键。基于物联网的\
  \ SEM 系统，传感器的寿命是一个大问题。通过在网络中引入节能数据传输，可以最大化网络寿命。因此，本文提出了一种基于奔马群优化算法（PHOA）的物联网 SEM\
  \ 系统路由协议。该方法旨在满足扩展传感器网络（WSN）的效率需求。所提协议利用聚类选择簇头来从源到终点传输数据，从而创建可扩展的网络并增强基于 PHOA 的路由协议性能。这种方法可以减少数据传输和能耗。基于物联网的\
  \ SEM PHOA 性能通过分析传输延迟、网络寿命和能耗进行了评估。\n\n关键词：物联网、智能家居、能源管理、需求响应、能耗、无线传感器网络\n\n# 引言\n\
  \n\n\n\n智能能源管理 `SEM` 系统为终端用户提供环境中涉及的设备能消耗信息。终端用户可以控制设备以改变其行为，从而维持供需平衡。`SEM` 执行需求侧管理、削峰负载并降低能源成本。基于需求响应（`DR`）的智能能源管理（`SEM`）通过有效控制减少能量消耗和峰值负载，以维持电能供需之间的平衡\
  \ [1]。实施需求响应管理的要求是从电源中获得更好的能量利用，以降低能源成本。在基于 IoT 的 `SEM` 系统中，传感器的寿命是一个较大的关注问题。提出了基于\
  \ IoT 的 `SEM` 方法的 PHOA，旨在通过基于 WSN 的 IoT 中基于优化的聚类和高效能路由方案来增强网络寿命。\n\n## 文献综述\n\n\
  智能建筑是利用能源管理技术最小化能量消耗的最新发展技术。因此，设计了智能电网（`SG`），其中电气设备、能量源、智能电表、数据处理元件和控制器相互互连 [4]。`SG`\
  \ 中展示的所有组件都应该相互通信，以便为实施能源管理过程发送必要信息。Lin, Jie 等人解释说 `SG` 是智能电网（`SG`），其电气设备、能量源、智能电表、数据处理元件和控制器相互互连。Wang,\
  \ Xiuwang, Xinna Mao 和 Hossein Khodaei 表示实施了能源管理系统。Ali, H. 等人提出了与智能城市部署的工作，采用了使用\
  \ Zigbee 网格 WSN 的自动抄表（`AMR`）系统 [5]。该方法展示了 `DR` 管理并降低了峰值负载。\n\n## 方法论\n\n在这项工作中，设计了具有有效路由方案的基于\
  \ IoT 的 `WSN` 的 `SEM` 系统。一个带有 `WSN` 的典型 `SEM` 系统包含位于现场的家用电器、用于读取测量值的相关传感器以及采取必要行动的控制器\
  \ [3]。传感器测量的电器细节被传输到云服务器以及网络内部的电器之间。所提出的带有 `WSN` 的 `SEM` 结构以及传感器的数据传输将在连续章节中进行讨论。然后，提出了用于\
  \ `WSN` 的流量和数据路由协议，以解决第 1 节提到的问题。\n\n## 用于 SEM 的基于 IoT 的 WSN 设计\n\n在这项工作中，考虑了住宅建筑的能源管理。实现了一个基于\
  \ IoT 的 `WSN` 智能家居，并连接到 `SG`。传感器通过无线通信通道传输数据 [8]。\n\n## 系统模型\n\n所提出的基于 IoT 的 `WSN`\
  \ 设计用于实施家庭能源管理，旨在减少高峰时段家电的能量消耗。家中不同电器的能量消耗不同。因此，网络中的所有电器都必须知道一个设备的能量消耗。如果在某个特定时间段本质上需要某台电器，无论能量消耗如何，另一个需求较少的高能耗设备也必须关闭\
  \ `OFF`。因此，家电的能量消耗被维持在不超过峰值负载。通常家中的电器分为两类：频繁运行设备（`FOD`）和偶尔运行设备（`OOD`）。例如，客厅电器如风扇、电视、空调和电脑被视为\
  \ `FOD`，而其他设备如厨房电器、洗衣机、加热器和电泵被视为 `OOD`。这些设备通过无线链路连接到传感器节点。网络的所有节点都互连。因此形成了一个无线传感器网络。一个带有位于各个房间的家电以及节点的典型基于\
  \ IoT 的 `SEM` 如图图. 1 所示。\n\n![图 1. 带有电器和传感器节点网络的典型基于 IoT 的 SEM](img/fig13_1_B.jpg)\n\
  \n图 1. 带有电器和传感器节点网络的典型基于 IoT 的 SEM\n\n在该网络中实现了 `SEM` 用于需求管理。在实施时，还应考虑网络问题。因此，在这项工作中，提出了一种基于\
  \ IoT 的 `WSN` 的能效路由，该路由基于流量和数据感知路由。\n\n## 运行与数据传输\n\n基于电源可用能量的设备状态转换是网络中通信的最关键数据。当对智能家居电器的需求很大时，可以采取以下措施：\n\
  \n1. 关闭 `OFF` 不需要的电器。\n2. 降低某些电器的负载，从而确保其总能量消耗不超过峰值。\n3. 关闭 `OFF` 消耗过度能量的电器。\n\n\
