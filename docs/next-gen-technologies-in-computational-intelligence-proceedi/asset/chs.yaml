  \ **Ensemble** | 0.997197 | 0.999834 | 0.997212 | 0.997136 | 0.999954 |\n\n集成方法的训练准确率比单独的\
  \ `Resnet50` 高 10%，比单独的 `Xception` 高 4%。`Resnet50` 和 `Xception` 模型的验证准确率也分别提高了 6%\
  \ 和 3%。\n\n![图 1. 分别使用 Rms prop, Adam 和 Sgd 优化器训练的集成模型](img/fig75_1_B.jpg)\n\n图\
  \ 1. 分别使用 Rms prop, Adam 和 Sgd 优化器训练的集成模型\n\n患者辅助模块能够在测试期间执行相应的功能。\n\n![图 3. 患者界面](img/fig75_3.jpg)\n\
  \n图 3. 患者界面\n\n## 结论\n\n结论是，建立了一个有效的框架用于多分类，其中 `Xception` 和 `Resnet 50` 结合 `Sgd`\
  \ 优化器被证明是分类可用图像的一种方法。我们需要将该框架扩展到轴状和矢状脑切片，并添加其他模态，如 `FDG 正子发射扫描 (PET)`、`FDG 正子发射扫描\
  \ (PET)`、`结构磁共振成像 (SMRI)` 以及 `功能磁共振 (Fmri)`。脸检测模块、符号转语音、目标检测和 `OCR` 模块是在仿真过程中实现的良好解决方案。\n\
