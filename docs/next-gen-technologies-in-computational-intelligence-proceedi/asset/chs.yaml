  \ (2016). 使用面部关键点进行实时眼眨检测。\n\n# 用于预测心脏病变的 SDKL 混合机器学习模型\n\nM. Balamurugan,^(⁹)\n\
  \nDOI: [10.1201/9781003430452-10](https://dx.doi.org/10.1201/9781003430452-10)\n\
  \n## 摘要\n\n心脏是人体泵送血液最重要的器官。心脏病是当今主要的死因之一。血糖过高会损害大多数器官，是导致心脏病的主要原因之一。随着越来越多的疾病成为人类潜在的死亡威胁，临床决策支持系统（DSS）在协助心脏病学家和其他医疗专业人员进行临床决策方面显示了其用途。世界心脏联盟（WHF）估计，全球已有\
  \ 391 亿人患有心脏病，到 2038 年这一数字将增加到 597 亿。临床数据分析是检测心脏问题的共同障碍。我们在此背景下提出混合机器学习技术来预测心脏病。考虑的传统机器学习方法包括\
  \ KNN、支持向量机、逻辑回归和决策树。\n\n# 引言\n\n心脏疾病是人类目前面临的严重健康威胁。心脏病的常见原因是动脉粥样硬化阻塞，这最终会导致心脏血流量减少。这是人类心脏病的主要原因。美国心脏协会（AHA）报告，心脏病影响了超过三分之一的人口。据世界卫生组织（WHO）报告，每年有约\
  \ 180 万人死于心血管疾病，占总死亡数的 31%。生活方式以及糖尿病、肥胖和超重等其他医疗状况可能导致吸烟、胆固醇升高和血压水平增加风险。由于处理的数据量巨大，决策过程的很大一部分依赖于机器学习（ML）算法。在使用任何数据分析技术之前，需要数据具有速度、数量和多样性。使用机器学习进行早期诊断的预测模型在医学研究中非常有用。我们推荐混合机器学习方法来预测心脏病，因为它已经成为一个严重的健康问题。\n\
  \n## 目标\n\n如果能够早期识别心脏病，许多人的生命可能会被拯救。定期的临床数据分析是正确诊断冠状动脉疾病、心脏病发作等心脏状况的主要障碍。根据临床事实确定可能导致心脏疾病的风险变量，开发机器学习模型来预测未来的潜在心脏问题，识别特征选择技术并理解其运行机制\
  \ (Akiba et al., 2019)。\n\n## 系统分析\n\n为了获得最佳的研究结果，本节提供了方法论。\n\n### 现有系统\n\n为了获得最佳的研究结果，本节提供了目标。心脏对人体起着至关重要的作用。与当代模型相比，心脏病的输出被认为是更好的。为了获得最佳的研究结果，本节提供了方法论。`NumPy`\
  \ 数组和矩阵的数据结构。为了发现死亡人数增加的趋势，利用了 `XGBoost` 算法。\n\n### 提议系统\n\n现在有建立一个框架。在该框架内衡量了 `KNN`、`SVM`、`Decision\
  \ Tree` 和 `Logistic Regression` 等机器学习算法的性能。项目的整体概念见图 1 (Cai et al., 2020)。\n\n##\
  \ 数据收集与预处理\n\n使用 UCI 仓库收集数据，并导入 `NumPy` 和 `pandas` 进行统计分析。处理数字的 Python 库称为 `NumPy`。`NumPy`\
  \ 提供数组和矩阵的数据结构。三角函数、统计学和代数运算是其能力范围。在这里，`NumPy` 用于统计分析。数据科学、机器学习和数据分析功能经常使用 `pandas`\
  \ 包完成。它构建在 `NumPy`（另一个支持多维数组的 Python 包）之上。在此例中还使用了 `SciPy` 进行统计分析，包括中位数、分布和平均值，并结合\
  \ `Matplotlib` 进行绘图。基本上，数据集是无法用于机器学习的，因为它们存在噪声、缺失数据以及可能不可行的结构 (Attia et al., 2019)。预处理是机器学习模型准备数据的关键步骤，因为它可以提高模型的准确性和效率。使用\
  \ `sklearn` 包来完成。`sklearn` 的 `MinMaxScaler` 通过将缩放到特定范围来转换特征。在任何情况下，部分信息可能是错误的，例如可能包含虚假信息、信息不足或错误信息，因此我们进行数据准备。\n\
  \n## 数据可视化\n\n通过 `Seaborn` 和 `Matplotlib` 的包以可视化的方式显示数据。`Matplotlib` 以其跨平台数据可视化工具箱而闻名。视觉表示的好处是让我们接触图像，将大量数据集转换为直观且易于理解的表示。`Matplotlib`\
  \ 提供了多种图形，如折线图、饼图、柱状图、直方图、散点图等。`Seaborn` 库可以创建统计图表。\n\n## 使用算法训练和测试数据集\n\n\n\n\n\
  \n有许多方法可以确定你的模型是否准确。它用于训练 `SVM`、`Logistic Regression`、`Decision Tree` 和 `KNN` 模型。`Logistic\
  \ regression` 是一种统计技术，用于根据一组自变量预测分类因变量。它生成一个 0 到 1 之间的随机整数，而不是二元的 0 或 1 答案。它可能是真的，也可能不是，可能是\
  \ 0、1 或两者之间的任何其他数字。决策树通过算法程序建立，根据其上下文统一了对数据集的不同分类方法。它是最广为人知且最高效的监督学习机器学习方法。分类和回归问题可以使用决策树来解决，这是一种监督的无界学习方法。`KNN`\
  \ 方法不需要任何设置时间，并为海量数据集提供了显著优势。众周知，`KNN` 的性能优于复杂的分类和回归技术，同时实现起来相对简单。`KNN Classifier`\
  \ 是一种本质且强大的分类方法，允许创建预测性机器学习模型。在这种情况下，元素的分类由其邻居的排列方式决定的。`KNN` 根据先之前存储的项目的相似性水平对新数据集进行分类。为了与竞争性分类技术区分开来，支持向量机\
  \ `Support Vector Machines (SVM)` 选择最能衡量相邻类别之间差异的边界。由 `SVM` 得出的决策边界是具有最大间隔的分类器。正如名称所示，线性\
  \ `SVM classifier` 在两个类别之间画一条直线（Alkeshoush et al., 2017）。这意味着边界一侧的每个数据点代表一种类型，而另一侧的每个数据点代表另一种类型。这表明在谱系方面可能存在无限的材料待分析。每个算法的精度都经过了评估。\n\
