  \n# 数字工业中基于区块链的身份管理系统\n\nD. Gayathri^(¹)\n\n电子邮箱：[gayathri.dl992@gmail.com], [raghavendran.scs@velsuniv.ac.in]\n\
  \nDOI: `10.1201/9781003430452-1`\n\n## 摘要\n区块链身份管理在文档中起着至关重要的作用。它允许用户访问并避免验证与校验。本文讨论了数字工业中的区块链技术。\n\
  \n***关键词：*** 区块链、数字身份、自主权\n\n# 引言\n在 21 世纪，最大的创新可能是区块链在数字世界的出现。本文对区块链身份模型以及如 uPort、Sovrin\
  \ 和 ShoCard 等最广泛的技术进行了清晰的概述。\n\n## 区块链概述\n区块链是一种共享账本，允许数百万台计算机和服务器在没有任何中央权威的情况下保存一份安全的、不可篡改的账本。\n\
  \n它就像传统的公共账本，保存着完整的交易历史列表。所有区块都包含区块头和区块体。验证规则由区块版本指示。`SHA256` 计算前一个哈希值并称为父区块哈希。`SHA256`\
  \ 还计算区块内通信的 Merkle 根哈希值，即 Merkle 树根。第一个区块是创世区块（Genesis Block），它没有任何之前的区块。为了验证，所有区块都会追溯到创世区块。\n\
  \n## 区块链优势\n区块链技术的广阔特性如下：\n\n### 1. 去中心化\n区块链赋予所有方访问完整数据库和记录的平等权利。没有特定特定控制整个数据库，每个人都有完全权利。\n\
  \n### 2. 安全性\n在区块链中，每个节点都会存储所有数据，每个人都拥有账本，如果任何节点损坏或受到影响，都不会产生威胁。\n\n### 3. 分布性\n\
  相同的区块链数据会在同一时间存储在许多用户之间，如果某个节点突然受到影响或另一个节点丢失了数据，区块链网络中的其他节点拥有区块链的副本，并会自动更新。这一特性避免了数据丢失和记录被篡改。\n\
  \n### 4. 透明性和可追溯性\n网络中的每个人都能检查并目睹所有活动和交易，因为区块链记录存储在带有时间戳的全节点上。所有活动和交易都可以通过节点地址进行追溯，因此区块链是可追溯且透明的。\n\
  \n### 5. 效率\n\n\n\n\n\n通过允许系统更高效地自主运行，消除了区块链中的中间子系统 (Mohanta et al., 2018)。\n\n\
  # 区块链分类\n\n### 1. 无许可或公共区块链\n任何人都可以无需任何许可即可交互或加入网络并开始提交文档。数字货币交易的核心——如以太坊（Mohammed\
  \ 2021）和比特币等开源结果——仅通过这一类别实现。\n\n### 2. 许可链或私有区块链\n这种封闭的基础设施需要对区块链网络中的承办方进行预验证 (Liu\
  \ et al., 2020)，只有受限的用户才能验证区块交易。因此，许可链区块链被中心化组织青睐，用于增加内部业务控制。\n\n### 3. 联盟区块链\n\
  在这里，共识程序由首选的参与者群体管理，这种区块链是部分私有的（Jamal et al., 2019）。其他公共参与者被限制为读取区块链数据。\n\n![Fig.\
  \ 1.1. Blockchain Classification](img/fig1_1_C.jpg)\n\n图 1.1. 区块链分类\n\n数字工业中的区块链身份管理系统\n\
  \n### 4. 混合区块链\n使用私有区块链网络创建哈希数据块（Mohammed, 2021），然后数据由私有（Mohammed, 2021）区块链网络保存。\n\
  \n# 数字身份中的区块链\n数字身份用于通过数字信息唯一地标识特定个人，并进行面对面的交易，以确保两个或多个双方之间具有良好的信任水平 (Lim et al.,\
  \ 2018)。数字身份存储在没有管理员的区块链去中心化数据库中。区块链数据是不可更改的，因此没有人可以访问并更改它（Li, 2020）。数字工业在数据安全能力上花费更多资金。但黑客可以轻易破解所有安全防护（Raikwar,\
  \ 2019）。管理权限控制、记录加密和令牌化是确保数据库安全的主要因素（Balasubramaniam, 2020）。所有这些主要因素和数据安全都由区块链技术管理。区块链去中心化系统在数字信息存储中起着至关重要的作用。\n\
  \n它们根据存储在数据库中的属性存储数字身份，这些属性区分了同一系统的不同用户 (Liu et al., 2020)。静态属性如出生日期、性别，以及动态属性如年龄、职称等。我们拥有一些特定的标识符，称为个人属性，如护照号码、电子邮件地址等\
  \ (Faber et al., 2019)。对于在线服务，一个人的共同属性是适用于所有人的电子邮件地址。\n\n# 主权身份模型\n主权身份是指没有第三方 (Raju\
  \ et al., 2017) 能够主管该身份，只有用户对身份拥有完全控制权。该模型有助于管理个人的数字身份（Mohammed, 2021）。而个人对管理个人数据以及拒绝其他第三方访问的能力拥有唯一所有权。\n\
  \n# 区块链身份管理系统\n\n### Sovrin\n在离线世界中（Rafique, 2021），Sovrin 设计用于安全地使用数字凭证。由于它具有主权身份，因此它无法被消除，也不依赖于任何中央机构。为了确保隐私，它获取了无知识加密。\n\
  \n### uPort\n这是一个开放系统（Raju, 2017），为用户和组织提供主权身份。uPort 身份系统在以太坊区块链上运行，以数字方式识别用户或组织并加入断言。\n\
  \n### ShoCard\n用户将持有并保护他们的数字身份（Mohammed, 2021）。用户将拥有用户密钥以确保隐私，通过它可以消除第三方数据库 (Lim\
  \ et al., 2018)。ShoCard 在区块链上拥有用户的确认信息（Haddouti and Kettani, 2019），这将为（Ramachandran\
  \ and Krishnamachari, 2018）用户的个人身份提供可靠性，并改进（Verma, 2021）的第三方验证。\n\n# 数字身份中区块链存在的问题\n\
  数字身份中区块链存在的问题（Haddouti and Kettani, 2019）可能基于两个关键要素：用户信任身份提供者（Jamal et al., 2019），同样，服务提供者（Li\
  \ et al., 2020）信任身份提供者（Mohammed, 2021）。例如，一个恶劣的身份提供者（Mohammed, 2021）可以在用户不知情的情况下，使用（Mohammed,\
  \ 2021）用户的身份（Verma, 2021）轻松访问服务提供者。这种未经授权的访问可能不会被用户识别。因此，应该进行系统设计更改（Ishmaev, 2020），以便当新的（Balasubramaniam,\
  \ 2020）提供者加入领域时，服务提供者应通知身份提供者。另一个问题（Sanka et al., 2020）可能是授予不同类型资源的访问权限，访问批准应由管理人员执行以避免组织中的问题。\n\
  \n## 结论\n基于区块链的身份系统分析（Faber et al., 2019）允许个人（[Raju et al., 2017](#ch1.xhtml#ref1_10））增加对数据质量和可靠性的信任。作为综述，我们观察到了与数据存储、不同用户及其存储能力相关的巨大挑战。少数节点参与而许多其他节点只能查看数据。因此，与传统的身份管理系统相比，区块链身份管理系统克服了巨大的局限性。用户成为了自己身份的主人，不再为了舒适牺牲安全。在数字世界中，身份管理可以更高效、更安全地进行所有通信。区块链身份管理允许用户通过将其放在去中心化系统中管理自己的身份。因此，需要更多努力建立一个完美的视角以保护区块链身份管理中的数据隐私挑战。\n\
