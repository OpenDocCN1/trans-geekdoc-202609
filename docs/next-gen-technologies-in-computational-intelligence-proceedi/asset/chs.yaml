  \n从显微镜获得的原始数字图像位于左侧，而分割后的图像位于右侧。图 5. (a) 代表原始的显微抹片细菌图像。图 5. (b) 显示了一张展示像素值与其在图像中出现频率关系的图。具体而言，x\
  \ 轴代表像素值，y 轴显示相应的计数。图在 x 轴较高像素值的一侧达到峰值，表明图像包含浅蓝色多于深蓝色，红色极少。这是因为浅色的像素值通常比深色高。图 5\
  \ (c) 展示了阈值化后的二值分割图像。阈值化涉及将图像从彩色或灰度图转换为二值图像，即仅由黑色和白色像素像素组成的图像。这种转换使得图像分析变得更加容易，因为它只包含两种易于区分的对比色。在图\
  \ 5. (d)，我们可以看到分割后的 RGB 图像。分割是指根据像素值将图像划分为不同部分的过程。通过分割图像，我们可以隔离并只处理图像的重要部分，而不是处理整个图像。在特定情况下，图像中添加了红色，高细菌密度区域显示为红色区域。图\
  \ 6. (a) 显示了经过各种操作的输入图像，以获取菌落计数。图 6. (b) 显示了锐化后的图像。这是为了提高医学诊断的准确性，防止图像模糊或缺乏清晰度可能会阻碍对细微细节或异常的识别。图\
  \ 5 (c) 显示了应用于输入图像的轮廓检测结果。该图像是在应用图像处理技术（包括锐化、灰度化、Canny 边缘检测、膨胀和轮廓提取）后生成的，用于确定轮廓的数量，对应图像中的细菌菌落计数。图\
  \ 6 和图 7 指明了通过阈值化和轮廓检测获得的细菌计数箱线图。对于 3+ 级，细菌计数范围为 82-909；4+ 级范围为 115-16712；5+ 级范围为\
  \ 17 43-2597；6+ 级报告范围为 6367-15966。观察到不同分级之间的细菌计数存在某种程度的重叠。颜色不均匀和低对比度导致了分割过程中离群值和计数重叠。目前的工作缺乏细菌计数的标准化。未来，我们将研究并提出一种稳健的分割模型来克服这些缺点。\n\
  \n实验评估证明了自动细菌计数的意义，这与病理学家根据细菌学指数进行的分级相关。这些结果是假设的初步结果，需要更深入的验证以推导出细菌学指数的映射。为了使我们的系统适用于麻风菌识别，还需要大量的验证。\n\
