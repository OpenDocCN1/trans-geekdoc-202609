  \ AMRITA 远程无线传感器网络框架。ICCNC。\n6. Qandour, A., Habibi, D., Ahmad, I. (2012). 无线传感器网络应用框架。第\
  \ 9 次国际网络、传感与控制会议会议。\n7. Ramesh, M., Pradeep, P., Divya, P., et al. (2013). AMRITA\
  \ 远程无线传感器网络框架。第 11 次 ACM 嵌入式网络传感器会议论文集。\n8. Steyn, L. P., Hancke, G. (2011). 无线传感器网络测试平台调查。Africon。\n\
  9. Hellbruck, H., Pagel, M., Kroller, A., et al. (2011). 使用 Wisebed 操作无线传感器网络测试平台。第\
  \ 10 次 IFIP 年度地中海特种工作讨会。\n10. Doddavenkatappa, M., Chan, M. C., Ananda, A. L. (2011).\
  \ Indriya: 一种低成本 3D 无线传感器网络测试平台。测试平台与研究基础设施：网络与社区的发展。第 7 次国际 ICST 会议。\n\n\n\n\n\n\
  深度学习领域的一个最新进展因其创造丰富的应用而备受关注。医学领域的计算机应用是未来的重点，它们正广泛推动着 IT 行业的发展。本文将带领读者和研究人员探索一种基于云的方法，用于检测人类的皮肤癌。我们深知皮肤癌是一种致命性疾病，而提高有效生存的概率取决于早期识别。深度学习方法在敏感性、准确性和精确性性能等方面展现了它们的优势。因此，在本文中，我们使用卷积神经网络（CNNs）在图像识别和图像分类的实验中检测皮肤癌。我们还将该应用部署在云平台上，以便任何人都能通过互联网使用该功能。\n\
  \n**关键词：** 卷积神经网络、图像分类、皮肤癌、云计算、深度学习、图像识别、迁移学习\n\n# 引言\n\n皮肤癌仅仅是受到紫外线（UV）辐射导致的人类间的传染性疾病\
  \ (Vijayalakshmi, 2019; Vedanti Chintawar & Jignyasa Sanghavi)。早期诊断是减少疾病进展到下一阶段风险的早期可能措施\
  \ (Vijayalakshmi, 2019; Yuexiang li & Linlin Shen, 2018)。\n\n洞察报告承认，每年分析的黑色素瘤病例增加了\
  \ 53% (Esteva et al., 2017; (World Health Organization, n.d.))。在美国，每小时都有人因皮肤疾病去世。如果在后期阶段进行分析，死亡率低于\
  \ 14% (Erkol et al., 2005; Zorman et al., 1997)。同样，如果在初始阶段进行分析，生存率超过 97% (Siegel\
  \ et al., 2018)。这告诉我们，早期检测有助于我们轻松地克服这种疾病。\n\n然而，皮肤科专家的专业知识对准确判断有很大影响。据报道，顶尖皮肤科医生在诊断皮肤恶性生长物方面的准确率低于\
  \ 80% (Marks, 2000)。此外，才华横溢的皮肤科医生极稀少。为了解决准确性和临床皮肤科医生不足的问题，可以利用 AI 计算来识别皮肤恶性生长的存在。许多创造者提出了皮肤恶性生长物定位的前沿模型\
  \ (Esteva et al., 2017; Kittler et al., 2002; Yu et al., 2016)。可以提供这种高质量的服务。由于云计算的进步，通过将模型部署在云端，几乎所有人都可以此服务。互联网在利用云系统方面提供了巨大的帮助。患者皮肤状况的图像可以发送到云系统，系统可以立即将结果返回给患者。此外，实施此服务的成本和时间非常少。另一个优点是，患者不需要等待资深皮肤科医生就能获得准确的结果。目前已提出基于移动模型的检测系统\
  \ (Xiangfeng Dai et al., n.d)。然而，它也有其缺点，例如：此类模型的运行需要高性能移动设备，模型预测所需的时间非常长，且机器学习模型无法更新。\n\
  \n在我们的论文中，我们通过提出一种模型克服了这些缺点，我们将模型部署在基于云的计算机上，以便预测在服务器而非客户端设备上进行。因此，客户端的角色仅仅是拍照并将其上传到服务器。处理和预测在服务器上执行，结果被发送回客户端。如果我们获得一个性能更高的模型，可以轻松地部署在服务器系统中。\n\
  \n## 近期工作\n\n早期的研究人员首先进行病变分割，然后从中提取特征，并将其用于皮肤癌分类。为了识别皮肤癌，Manu 和 Yu 使用了人工神经网络，即全卷积残差网络\
  \ (Yu et al., 2016)。对于病变分类，Codella 最近将机器学习技术的最新进展与深度学习相结合 [14]。\n\n为了使用有监督学习技术训练模型，需要大量的数据和处理能力。Duraipandian\
  \ 展示了将云用于物联网以增加计算速度 (Duraipandian, 2020)。因此，这些模型可以部署在云计算机上。例如，Alghatani 和 Rezgui\
  \ (Khalid Alghatani & Abdelmounaam Rezgui, 2019) 了一个了一个患者远程监测平台。此外，Melillo 和 Scala\
  \ 提出了一个监测高血压患者的系统 (Ruiz-Zafra et al., 2013)。他们使用云平台开发了 mHealth 应用，用于远程监测、收集信息和查看诊断视频。\n\
  \n## 应用设计与架构\n\n### 总体系统设计\n\n我们提出了一种基于云的皮肤癌检测系统。它可以大致分为三个部分：客户端输入层、云平台层和输出可视化层。客户端通过摄像头等传感器拍摄照片。拍摄后使用特定算法进行加密，然后上传到服务器。当云系统接收到照片时，首先解密并开始处理。预测结果后，将其加密并发送回客户端。客户端从服务器接收数据，解密并显示结果。服务器用于交付检测模型，该模型是单独训练的。为了确保安全，信息在传输过程中是加密的。\n\
  \n在该架构中，数据集存储在云环境中，深度学习模型在云平台上完全训练。此外，关于图像是否包含皮肤癌的预测在云平台上计算。客户端的角色仅仅是上传图像，其他操作都在云端完成。它还包含一个身份验证模块，以便只有授权用户可以使用此应用程序。该架构如图图\
  \ 1 所示。\n\n### 客户端输入层\n\n客户端的主要作用是捕捉图像并与服务器交换数据。客户端主要由三个模块组成：身份验证、图像采集和数据上传到云端。在身份验证模块中，终端用户必须先注册详细信息，数据的云存储经过加密。然后用户使用相同的凭据登录。这些凭据再次发送到服务器。如果凭据正确，发送积极回复，则允许用户使用我们的应用程序，否则不允许。\n\
  \n\n\n\n服务器验证模块用于检查和验证用户。当用户注册时，详细信息将保存在数据库中。当用户登录时，这些凭据将与数据库进行交叉比对。如果用户已经注册，则向客户端发送积极响应，否则将发送消极响应。数据集\
  \ `HAM10000. Dataset` 从源网站下载并存储在云存储中。该数据库可以通过云服务提供商提供的 `API` 进行访问。资源访问开销时间也由云提供者管理。数据库模块还包含用户验证数据。\n\
  \n整个深度学习模型训练都在此云平台上完成。深度学习训练模块获取数据数据库并根据给定的配置训练机器学习模型。训练模型所需的时间通常非常高。我们在部署应用程序供公众使用之前完成了模型训练。因此，这段训练时间与我们的应用程序使用无关。它利用深度学习生成一个具有直接皮肤癌预测的模型。该模型存储在云数据库中供后续使用。\n\
  \n数据接收和传输模块用于与终端用户进行通信。它解密接收到的数据并对发送到客户端的数据进行加密。用户发送输入的图像将使用训练好的模型进行分类。这种分类也完全在云平台上完成。由于云平台拥有巨大的计算能力，此类计算所需的时间非常短，因此结果返回时没有太大延迟。计算此结果后，将结果结果返回给客户端。\n\
  \n## 输出可视化层\n\n该模块接收来自云平台的输出数据并将结果显示给用户。它包含与输入图像对应的皮肤输出标签。\n\n## 实验与实现\n\n该应用的云环境是使用亚马逊服务（Amazon\
  \ web services）创建的。我们使用了 `The HAM10000. Dataset: A Large Collection of Multi-Source\
  \ Dermatoscopic Images of Common Pigmented Skin Lesions` (Tschandl et al., 2018)\
  \ 中的皮肤癌数据集，其中包含 10015 张七种皮肤问题的标记图像，分别是：1) 黑色素痣 2) 黑色素瘤 3) 良性角化 4) 基细胞癌 5) 光角化 6)\
  \ 血管病变 7) 纤维瘤。\n\n整个数据集被下载并保存到 Amazon S3 桶中。从这里，通过 Amazon S3 服务提供的 `API` 获取数据用于深度学习模型的训练。\n\
  \n可以使用 `python` (Python, n.d.) 库如 `TensorFlow` (Tensorflow, n.d.)、`PyTorch`、`Fastai`\
  \ 等开发并训练机器学习算法。我们采用了一种名为迁移学习的技术 (Pan & Yang, 2010; Karl Weiss et al., 2016)。在这种方法中，我们可以利用所有在特别大型数据集上训练过的预训练模型中收集的特征用于我们的模型。我们使用了\
  \ `DenseNet` (Huang et al., 2016; Duraipandian, 2020)`CNN`。我们使用了 `DenseNet` 模型的特征提取层，并添加了自定义的分类器，这有助于我们建立特征映射到皮肤癌检测中相应的标签。我们模型的精确率为\
  \ 0.889166，召回率为 0.889166，F 值为 0.88916。\n\n## 结论\n\n在实现 `CNNs` 或在采用和执行 `CNN` 架构时的主要缺点是适应高计算力的要求，这通过云监控系统得到了很好的处理。当图像发送到云端时，云系统很好地处理了这一点。高质量的医疗服务现在可用，疾病可以被轻松识别。\n\
