  \n# 云计算多因素身份认证综述\n\nK. R. Nandhashree 女士^(⁵⁴)\n\n邮箱：nandhashree29@gmail.com, jeevam701269@gmail.com,\
  \ harish12groot@gmail.com, karthi.vmpak@gmail.com\n\nDOI: [10.1201/9781003430452-67](https://dx.doi.org/10.1201/9781003430452-67)\n\
  \n## 摘要\n\n云应用和云服务在企业中的普及使得数据保护变得日益重要。如今，由于凭据泄露和滥用引起了广泛关注，传统的密码方法在面对黑客攻击时已显得不足。本文综述了在云环境中实现的各种多因素身份认证技术，并分析了其发现及未来趋势。多因素认证通过增加额外的因素来增强安全性，是保护账户的有效解决方案。\n\
  \n关键词：云、认证、多因素\n\n# 引言\n\n在如今，敏感信息的存储使得在线身份验证变得至关重要。每当我们登录在线账户时，验证我们真实身份的过程通常通过简单的用户名和密码完成。然而，由于密码很容易被发现和猜中，随着技术的进步，这种方法已不再足够安全。此外，人们经常忘记密码，导致大多数人对每个网站都使用相同的密码。多因素认证（MFA）通过引入多种因素来保护账户，是目前的一种有效解决方案。即使密码被盗用，多因素认证也能防止未经授权的访问进入系统。\n\
  \n## 多因素身份认证\n\n虽然凭据是必要的，但它们很容易被破解。但当启用多因素认证技术时，情况变得更加有趣，这适用于企业和个人。\n\n## 探索性研究\n\
  \n### 用于 MFA 的各种算法\n\n本节描述了对 MFA 算法的综述。\n\n### REAL-OR-RANDOM (ROR)\n\nYeongjae\
  \ 等人 Burrows - Abadi - Needham (BAN) 逻辑来验证认证系统的可行性且是否存在缺陷。这种范式（Cho 等，2022）通过安全协议与应用程序自动验证工具（AVISPA）展示了会话密钥的安全性。该方法从安全功能、计算成本和通信开销等方面对相关协议进行了比较，保护系统免受重放攻击和中间人攻击（MITM）。该算法由椭圆曲线密码学和模糊扩展器支持，它们有助于减小密钥尺寸并确保高安全水平。这为使用智能卡的身份验证和协议阶段铺平了道路。\n\
  \n### Rabin 密码系统\n\nFan Wu 等人提出了一种保护进入系统的用户身份的方法。这比以往论文中的其他方法更具优势。大多数方法不涉及任何密码（或令牌），但该方法针对所有物联网系统中的无线传感器网络（WSN）遵循基于令牌的认证。\n\
  \n### 零往返时间认证：\n\n\n\n\n\n.\n\n[Mitev 等人 (2022) 提出了一种协议，该协议涉及身份验证的两个主要因素：物理层属性（依赖无线通信的物理层属性，如信道特性和信号强度来验证用户身份）以及数字签名层（使用数字签名提供额外的认证层，其中用户必须拥有私钥和公钥对来对与访问点交换的所有消息进行签名和验证）。这种方法与\
  \ Cho 等人 (2022) 中的工作类似，后者侧重于无线通信，由访问点对信号层进行验证。此外，这还能防止诸如 BAN 方法之类的中间人（MITM）攻击。\n\
  \n### 伪身份身份验证\n\nDevanapalli 等人开发了一种基于混沌映射算法的伪身份方法。该方法基于包括密码和挑战-响应在内的三类方法。该方法的扩展版本完全取决于随机性和复杂性，而不是传统的混沌映射。该算法的工作由互联网安全协议与应用自动验证（AVISPA）工具提出，并证明了其针对安全攻击的有效性。\n\
  \n### 密钥协商\n\nQi Jiang 等人提出了一种方法，其中用户的私钥和云辅助自动驾驶汽车（CAAV）的公钥用于用户与 CAAV 之间建立安全的通信通道。由于该项目主要基于连接云的自动驾驶汽车，因此该协议本质上是混合的，使用生物识别和同态加密进行高效认证。\n\
  \n### CT-AKA 协议\n\nQi Jiang 等人还开发了 CT-AKA（无证书双边认证密钥协商）协议，它可以生成生物识别数据的加密哈希并进行存储。该过程涉及系统设置、AV\
  \ 注册、用户注册、用户验证、密码和生物识别更改以及智能卡注销，这是 CT-AKA 的六个组成。CAV（云辅助自动驾驶汽车）系统在配置期间由云启动并发布系统参数。在\
  \ AV 注册过程中，云为每个 AV 创建并分配密钥。此外，该协议使用密钥协商机制在用户与云服务器之间安全地建立会话密钥，该密钥用于他们的通信。\n\n## 用于\
  \ MFA 的模态\n\n### 用户名和密码\n\n图 1 展示了用于 MFA 的不同类型模态。大多数 MFA 方法结合了使用用户名和密码的基本认证策略，允许用户进入应用程序的第一阶段。这些传统方法并不足够，因此处于安全性的最低水平。\n\
  \n![图 1. 用于 MFA 的模态。](img/fig67_1_B.jpg)\n\n图 1. 用于 MFA 的模态。\n\n### 一性密码认证 (OTP)\n\
  \n大多数模型中使用的第二种 MFA 技术是 OTP，它也存在于大多数日常应用程序中（Jiang 等人, 2020; Ibrokhimov 等人, 2019）。OTP\
  \ 认证方法是一种通用的认证网关，几乎存在我们今天使用的每个 Web 应用程序中。图 2 描述了使用 OTP 进行 MFA 的工作。\n\n![图 2. OTP\
  \ 认证过程的工作流](img/fig67_2_C.jpg)\n\n图 2. OTP 认证过程的工作流\n\n### 生物识别\n\n生物识别是 MFA 技术之一，使用个人的生物识别信息来验证用户进入应用程序或网络。论文（Ometov\
  \ 和 Bezzateev, 2017; Ibrokhimov 等人, 2019; Sinigaglia 等人, 2020）使用了这种常见且安全的认证模态。个人的生物识别无法被替代，但仍可以使用现有的新技术进行克隆。Kalsoom\
  \ 的论文 Fatima 等人 (2019) 使用了人脸识别、虹膜扫描以及包括声纹的语音识别。Jiang 等人 (2020) 论文中，生物识别包括在车辆与云服务器之间的认证中使用共享秘密密钥。\n\
  \n### 证书和基于令牌的认证\n\n这里实现的新方法是基于令牌的认证和基于证书的认证。虽然这种方法在论文 Ometov 和 Bezzateev (2017)\
  \ 中有所解释，但他们仅为 IoT 设备提供了这种认证。此外，该认证是轻量级的，但由于缺乏标准的认证框架而被停止。\n\n### 基于知识和基于属性认证\n\n\
  这种方法用于论文 Albalawi 等人 (2019)，利用区块链等技术确保快速可靠的认证，这有助于为数据安全带来更标准的协议。该方法由机器学习支持，大部分此类认证因素使用在车辆内部。这不仅保护了数据，还防止了用户执行任何非法活动。\n\
  \n### 行为检测\n\nAleksandr 等开发了一种基于机器学习的行为检测方法，系统可以理解用户的行为。这种方法部署在最需要用户交互的 V2X 应用中。通过传感器，系统可以分析用户的打字节奏、鼠标移动，甚至他们握持设备的方式来判断是否为合法用户。\n\
  \n## 结论\n\n如今，登录账户需要耗时的认证过程，这使得攻击者更容易针对账户。结果是，用户必须使用 MFA 并忍受认证的等待时间。每当用户尝试访问账户时，MFA\
  \ 将减少所需时间。它必须受到保护。\n\n## 参考文献\n\n1. Cho, Yeongjae, Jihyeon Oh, Deokkyu Kwon, Sungjin\
