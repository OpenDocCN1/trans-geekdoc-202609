  \ (`WSDM`), pp. 261-269.\n\n# 手持增强现实中 3D 对象的操控用于校园访问\n\n手持增强现实中 3D 对象的操控用于校园访问\n\
  \nMotipalli Tharun, Romella Naveen, Muthukumaran Malar\n印度理工学院计算机科学系\n[10.1201/9780134532-1](https://dx.doi.org/10.1201/9780134532-1)\n\
  \n## 摘要\n\n所提出的框架展示了如何控制增强现实物体（AR）。通过使用 `AR` 技术，实现了虚拟物品与真实世界的交互。手势、输入设备和视觉效果被用于操控。通过虚拟物体和房间，我们已经在框架内开发了校园访问。该框架帮助观察者理解建筑及其设计。在本文中，我们使用了跟踪和标记跟踪。\n\
  \n关键词：增强现实，计算机视觉，物体操控\n\n# 引言\n\n所提出的用于股票交易应用的无监督机器学习攻击检测系统具有以 `99.1%` 的准确率高效检测未知攻击并缩短计算时间的潜力。它确保了投资者的信心并防止了由于攻击导致的财务损失。该效率通过包含特征选择和离散化方法实现。未来的研究工作将通过从各种来源获取实时数据，利用机器学习自动检测潜在攻击。\n\
  \n已被证明，增强现实在教育中可以提高学习结果和学生参与度（Zhou & Tai, 2022）。\n\n\n\n\n\n在这些设置中，自然且直观地与 3D 项目交互的困难是实现增强现实的障碍之一。传统的\
  \ AR 接口经常依赖触摸手势或其他难以学习和掌握的输入技术 (Schmetz et al., 2019)。然而，计算机视觉和机器学习的最新进展使得在增强现实中操控\
  \ 3D 对象的新方法成为可能，包括语音命令、视线追踪和手部追踪 (Sundarramurthi et al., 2022)。描述了一种在手持增强现实中用于虚拟校园游的\
  \ 3D 对象操控的新方法 (Voutos et al., 2022; Zhigang et al., 2021; Cao et al., 2021; Sundarramurthi\
  \ et al., 2022; Kondlo et al., 2020)。我们的方法结合了手部追踪和与虚拟物品的直观方式。通过用户研究，我们评估了我们的策略，并与传统的基于触摸的交互技术进行了对比\
  \ (Schmetz et al., 2019)。我们认为我们的策略可以大大提高用户体验并提升对虚拟校园游的兴趣。\n\n在上述论文中，作者们致力于不同的技术和方法论。在本文中，我们将使用\
  \ `Marker-Based Tracking` 进行虚拟校园体验。\n\n本文的其余部分安排如下：第 2 节提供了我们引用的一些文献的摘要。第 3 节展示并讨论了建议的系统和模块。第\
  \ 4 节介绍了结果与讨论。在第 5 部分，我们得出了结论和未来工作，并概述了一些潜在的后续步骤\n\n## 文献综述\n\nJacobe 等人 (2021)\
  \ 提出了一种移动应用程序，利用增强现实 (AR) 增强秘鲁 Wari Willka 博物馆的旅游体验。作者首先讨论了传统博物馆体验的局限性，以及基于 AR 的系统为游客提供更具吸引力和互动性的体验的潜力。他们随后描述了其移动应用程序的，该程序允许游客使用智能手机访问\
  \ AR 内容，如虚拟导览、3D 模型和多媒体演示文。Zhou & Tai, (2022) 提出了一种通过使用智能增强现实技术增强博物馆访问体验的解决方案。作者提出了一种智能增强现实自引导应用程序，使用智能手机或平板电脑显示\
  \ 3D 模型和动画，并提供展品的音频和文本描述。增强现实技术让游客能够与展品交互，并以一种有趣且互动的方式了解它们。\n\nBakhmut 等人，(2021)\
  \ 在他们的研究中，为了实现虚拟校园游，创建基于 AR 的 Web 应用程序。作者在手机摄像头拍摄的真实图像上叠加了校园结构和地标的 3D 模型。他们通过使用图像识别和追踪技术实现了这一点。每个地点的历史和文化价值也涵盖在应用程序的补充材料中。Yu\
  \ 等人，(2019) 在他们的研究中专注于开发 AR 环境中（特别是手持设备）自然且直观操控 3D 虚拟对象的技术。该研究的主要目标是设计一个考虑 AR 中重力影响的系统，并为物体操控提供流畅、无缝的用户体验。该研究可能采用了计算机视觉技术来追踪和解释用户的手部动作和手势，以及机器学习算法来预测用户的意图并确定所需的操控。\n\
  \nLi 等人，(2021) 在题为“使用机器学习技术在 AR 中操控物体”(AR) 的论文中研究了使用机器学习技术在增强现实中操控物体。作者认为，传统的物体\
  \ AR 接口（如基于触摸或手势的方法）在功能和直观使用方面可能存在限制。为了解决这个问题，作者建议使用机器学习算法训练 AR 系统，根据用户在 AR 环境中的移动和动作来识别用户意图。\n\
  \nWieland 等人，(2021) 在他们的研究中描述了三种手持增强现实协作 3D 操控技术的比较：分离、组合和混合，这是本文的重点。根据研究结果，混合技术在任务完成时间和和错误率方面效率最高，而组合技术在交互次数方面最有效。\n\
  \nYang 等人，(2021) 在他们的研究中提出了一种基于深度神经网络的方法，用于增强现实中的实时物体操控。所提的方法涉及训练深度神经网络，根据 AR 设备捕获的手部动作来预测虚拟对象的变换参数。作者对网络架构和训练过程进行了详尽阐述，包括他们如何使用大规模数据集和数据增强技术来提高网络的准确性。Fang\
  \ & Hong，(2021) 是增强现实 (AR) 领域现有研究的分析。该综述重点关注使用裸手手势控制虚拟物体以及 AR 中的遮挡问题。该综述旨在提供该领域的现状概述，包括用于\
  \ AR 交互的各种手部技术以及用户研究和评估的结果。\n\nFazliaty Edora Fadzli 等人关于课题的研究 (Nor'a 等人，2020) 是对手持增强现实\
  \ (AR) 领域及其使用指尖交互进行 3D 操控的研究分析。该综述旨在提供该领域的现状概述，包括用于追踪和识别指尖的各种技术，以及这些系统的用户研究和评估结果。\n\
  \nSchmetz 等人 (2019) 的研究侧重于探索和评估基于触摸（touch-based）的 AR 技术对生产部件进行标记和注释的方法。该研究的主要目标是确定哪些基于触摸的\
  \ AR 标记技术对于工业应用最有效、高效且可用。该研究可能包含了对基于触摸的 AR 标记现有文献的综述\n\n## 建议系统\n\n### 模型设计\n\n\
  首先，我们计划收集一些 3D 对象，下一步是在 `blender` 中创建 3D 模型。`blender` 是一个强大且灵活的 3D 建模工具，可以使过程变得简单。在此框架下，我们将介绍使用\
  \ `blender` 为增强现实 (AR) 应用创建 3D 模型。\n\n在开始之前，理解你正在开发的 AR 应用的需求至关重要。这包括目标设备、3D 模型的分辨率和比例，以及\
  \ AR 体验所需的特定功能和动画等因素。一旦你清楚了解了这些需求，就可以开始在 `blender` 中创建 3D 模型了。\n\n\n\n\n\n在上述的图.\
  \ 1 中，构建了 3D 模型。员工室、会议室和楼宇的模型分别显示在图 1 (a—c)中。接下来将应用 UV 映射和添加纹理。UV 映射用于指定纹理如何应用到模型表面，而纹理则有助于赋予\
  \ 3D 模型深度和真实感。Blender 提供了多种 UV 映射和纹化技术，包括直接在 3D 对象上绘制并生成独特纹理的能力。\n\n![图 1 3D 模型](img/fig41_1_C.jpg)\n\
  \n图 1 3D 模型\n\n在创建并纹化 3D 模型后，最后一步是将其导出为可在 AR 应用程序使用的格式。Blender 提供了多种导出选项，包括 `.fbx`\
  \ 和 `.obj` 等流行的 3D 文件格式。确保导出的模型针对目标设备进行了优化，并在导出过程中保留了任何必要的动画或交互，这一点至关重要。\n\n###\
  \ 系统架构概述\n\n系统架构由三层组成，这是框架的运行方式：输出层、数据库层、过渡层和识别层。这些阶段对于应用程序的运行至关重要。Vuforia 和 Unity\
  \ 是我们在框架中用于创建应用程序的工具。\n\n用于手持增强现实虚拟校园游的 3D 对象的建议方法利用模块化系统架构，以实现灵活且可扩展的实施。3D 对象数据库、标记检测与跟踪模块以及用户界面模块构架构的三个核心部分。标记检测与跟踪模块使用计算机视觉技术识别并跟踪用户环境中的物理标记，为\
  \ AR 系统提供精确的位置和朝向数据。\n\n3D 对象数据库存储了校园建筑、地标和其他项目的虚拟表示，充当系统的大脑。此外，用户的位置和朝向通过基于标记的跟踪系统确定，然后利用该系统将必要的虚拟项目叠加到实际环境中。该技术还具有视觉引导和反馈层，用户在虚拟访问期间可以访问该层。建议的架构通过将各种系统组件划分为独立的层，为校园虚拟访问中引入增强现实（AR）提供了一个灵活且可扩展的框架。\n\
  \n所提的架构图在图. 2 中包含多个层，包括输出层、数据库层和识别层。\n\n![图 2 建议的系统架构](img/fig41_2_8_C.jpg)\n\n\
  图 2 建议的系统架构\n\n#### 识别层\n系统的识别层使用系统输入和输出，是整个系统的关键部分。手机上的 GPS 和相机充当系统输入传感器，屏幕显示叠加视觉效果。GPS\
  \ 确定用户相对于附近兴趣点的位置，而相机则扫描 AR 标记。当用户走过并靠近感兴趣点时，程序会显示该地点的详细信息。\n\n#### 数据库层\n数据管理（包括数据输入、存储和处理）由此层处理。来自传感器层的实时数据在此层中进行处理。数据库在此用于存储有关许多结构和旅游景点的详细信息。本文的处理单元是位于云端的\
  \ Vuforia AR 服务器。\n\n#### 过渡层\n在我们的应用程序中，此层管理从一个场景到另一个场景的切换。使用 2D 虚拟虚拟按钮，场景从一个过渡到下一个。因为使用了\
  \ `canvas` 来创建 2D 按钮。在 AR 场景中，使用了虚拟按钮。\n\n#### 输出\n一旦图像处理完成或定位到兴趣点，输出部分将从数据库获取。结果是在用户移动设备上显示叠加数据的屏幕。\n\
  \n该框架使用了校园地图，可以在增强现实中看到建筑和实验室。在此框架中，2D 按钮被使用在一个由主摄像、方向光和用于显示地图的 `canvas` 组成的 `Scene`\
  \ 中。\n\n一个用于该框架的校园地图和几个 UI 按钮。有打开和退出应用程序的按钮，以及用于显示各种项目的按钮。场景之间的过渡由两个不同的部分组成。使用虚拟按钮退出增强现实环境并返回地图场景。在\
  \ AR 场景中无法使用 UI 按钮。场景修改和功能可以通过 `C#` 脚本提供。功能可以使用脚本定义，并可以使用各种资源添加其他特性。可以为项目添加额外的纹理以增加可见性。\n\
  \n### 系统实现\n\n该应用程序采用敏捷开发流程创建。选择不同结构和实验室的图像并将其添加到在线数据库中。AR 移动应用程序是在 Unity 和 Vuforia\
  \ 的帮助下创建的。该项目的范围限于支持 Android 的移动设备，并使用 Android SDK 创建。\n\n选择 Vivo V20 手机进行测试是因为其卓越的规格。它拥有\
  \ 2400x1080 的高分辨率显示屏，提供了清晰生动的视觉体验。V20 的主摄像头具有 64MP 传感器，焦距为 26mm，光圈为 f/1.9，能够在各种光照条件下拍摄清晰详细的照片。此外，V20\
  \ 由骁龙 720G 处理器和 8GB 内存驱动，确保 AR 应用运行流畅无瓶颈。总而言，Vivo V20 是一种可靠且强大的设备，非常适用于 AR 应用。\n\
  \n## 结果与讨论\n\n我们在研究中使用混合方法来评估便增强现实在虚拟校园游中的用处。调查包含一组用于分析用户对应用程序理解情况的问题。\n\n* 你对虚拟校园体验的细节和视角有什么看法？\n\
  * 你对与虚拟对象交互的用户体验有什么看法？\n* 你对建筑、房间及其操作（如缩放和旋转）的交互有什么看法？\n\n\n\n\n\n我们为试点研究收集了定量和定性数据。在虚拟校园导览前后，我们向参与者分发了问卷以获取定量数据。问卷包含李克特量表问题和开放式问题，旨在评估便携增强现实技术的用户体验和效能。在虚拟校园导览结束后，我们对参与者进行了访谈以获取定性数据。对于全规模研究，我们通过与试点研究相同的问卷收集了定量数据，还通过了一系列可用性测试。可用性测试针对部分参与者子集进行，由一系列任务组成，旨在评估手持增强现实应用程序的易用性和功能。\n\
  \n针对问题 `H1`、`H2`、`H3` 记录的问卷响应图像以及它们的分布图表如图 3(a—c) 所示。结果显示用户满意度非常高，90% 的参与者表示该模型增强了他们的虚拟访问体验。85%\
  \ 的参与者认为基于标记的跟踪系统在确定他们的位置和朝向方面既友好又准确，这充分说明了它的受欢迎程度。80% 的参与者表示使用基于触摸的交互技术是直观且简单的，这促进了它的普及。总而言，投票调查结果显示了我们建议的集成便携\
  \ AR 以改善虚拟校园访问体验的方法的价值和前景。\n\n![Fig. 3 用户的响应图](img/fig41_3_C.jpg)\n\n图 3 用户的响应图\n\
  \n## 结论\n\n本研究的目标是创建一个基于增强现实的虚拟导游 (`AR`)。这使得校园导览可以在没有导游的情况下进行。在整个校园范围内，兴趣点处放置了 AR\
  \ 标记。任何拥有功能性手机并下载了必要软件的人只需用手机 `camera` 扫描标记即可发现校园的独特景点。\n\n为了给客户提供流畅且有趣的虚拟访问体验，模型整合了基于标记的跟踪系统、3D\
  \ 对象数据库和直观的交互方法。在线调查结果证明了所提模型的成功和潜力，用户对系统的可用性、准确性和实用性表现出高度满意度。该领域的进一步研究可能包括扩展模型以包含更复杂的交互方法（如手势识别或触觉反馈），并将系统与校园的其他资源连接（如课程表或校园地图）。总体而言，所提范式在利用便携\
  \ AR 改善虚拟校园访问体验方面具有前景。虽然程序目前仅兼容 Android 手机，但它最终将支持 iOS 设备。未来的扩展可能包括引入文本转语音和导航等工具\n\
