  \ R. Nandhashree,^(³⁰)\n\n电子邮箱：nandhashree29@gmail.com, pjshree12@gmail.com\n\n\
  DOI: [10.1201/9781003430452-38](https://dx.doi.org/10.1201/9781003430452-38)\n\n\
  ## 摘要\n\n计算机辅助阿尔茨海默病（AD）识别可以很大程度上协助医生及时诊断老年人是否存在痴呆。此外，由于缺乏确切的诊断方法，使得 AD 早期识别成为一个重大的健康问题。目前已提出了一些非入性生物标志物，包括基于磁共振成像（MRI）的体积分析、基于正电子发射断层扫描（PET）的代谢活动，作为神经心理学评估的替代方案，有助于诊断。这些方法显示了令人鼓舞的结果，但完整的数据融合尚未研究这些模态是否传递了对应的数据，在此假设下，本研究探讨了它们是否可以结合以提供渐进分析的框架。在这项工作中，采用了基于集成分类器的联合融合方法对\
  \ MRI 和 PET 数据进行分析。特征提取采用结合了 `GLDM`、`MSER` 和 `EHS` 的新方法进行。使用这种新技术结合集成分类器获得了更好的性能。该计算机辅助诊断（CAD）实现了约\
  \ 86%的准确率。关键词：阿尔茨海默病、特征优化、特征提取、MRI。PET。\n\n# 引言\n\nAD 是一种神经退行性痴呆，是最公认的痴呆原因，占所有被认为症状的\
  \ 60%到 90%（美国精神医学协会 APA 2013）。AD 在许多国家位列死亡原因列表之。早期诊断有助于防止 AD 的进展（Ding & Yei, 2019;\
  \ Peng et al., 2019）。轻度认知障碍（MCI）是痴呆的起始阶段（Agarwal & Bedi, 2019; Anter et al., 2019;\
  \ Baltrusait et al., 2018; Baskar & Annadurai, 2019）。如果在此阶段分析疾病，可以安排药物，并通过定期随访预测痴呆的进展。MRI\
  \ 扫描用于研究身体内部器官的结构变形。为了克服分析临床图像中的挑战，利用计算机成像的分割程序，这提高了演示效率。正电子发射断层扫描（PET）扫描是一种脑成像技术，提供了关于脑组织功能运作的信息。\n\
  \n## 探索性研究\n\n对于 AD 预后，许多方法利用一种或两种模态开发了特征提取和选择思想（Acharya et al., 2019; Alickovic\
  \ et al., 2019; Lulu et al., 2019）。在 Alickovic 等 2019 年的研究中，使用直方图将图像转换为特征向量。`Ahmed\
  \ et al, 2019`；`Duc, 2020`；`Han, 2019`；`Islam & Zhang, 2018`；`Jain et al, 2019`；`Jimenez-Mesa,\
  \ 2020`；`Ju et al, 2019`；`Kanghan et al, 2019`；`Kruthika et al, 2019`；`Liang et\
  \ al, 2019`；`Lowe et al, 2019`；`Lu et al, 2018`；`Lulu et al., 2019`；`Bhatia, 2019`；`Ju\
  \ et al, 2019`中的 AD 分类是通过应用于脑网络的深度学习技术和基因数据完成的。该网络通过考虑使用静态 fMRI 获得的脑区域连接性来构建。在`Ahmed\
  \ et al, 2018`中，研究人员给出了一项调查，结论结合功能和结构模态的多模态方法可以提高疾病识别的准确性。利用神经影像信息进行疾病诊断使用了许多机器学习算法（`Bastia,\
  \ 2018`；`Moore et al., 2019`；`Pan et al., 2019`；`Peng et al., 2019`；`Razavi et al,\
  \ 2019`）。原因是多模态信息比考虑单模态数据包含更多的信息[2]。图像融合的概念有助于对框架提供准确描述，并通过通过图像融合而非存储所有成像模态来减少内存需求（Richhariya,\
  \ 2020`；`Sanchez-Reyna, 2019`；`Shaikh & Ali, 2019`）。\n\n## 方法\n\n在本节中，简要描述所提出的框架和使用的程序。所提出的多模态框架如图\
  \ 1 所示。\n\n[图像占位符或引用]\n\n## 图像采集\n\nMRI 和 PET 扫描图像从标准的 ADNI 获取，特别使用了`ADNI1_Annual\
  \ 2 yr_3T`和`ADNI1_Baseline_3T`。工作使用了 520 份 MRI 和 728 份 PET。\n\n### 预处理\n\n对于获取的所有\
  \ ADNI 数据，我们考虑 1.5T 实现的 MRI 模态和 PET 模态。两种模态的所有伪影都经过预处理以去除颅骨，这可能导致准确的分类。这使用脑表面提取算法去除非脑区域。矢状线对齐用于对齐脑的矢状部分。原始图像由于患者头部倾斜而与坐标系不同。最初修正不均匀性以减少图像配准的误差。\n\
  \n## 分割\n\n该算法将图像划分为每个像素具有相同属性的离散区域。这对于图像分析和理解具有意义和价值。模糊 C 均值是一种分组技术，允许一个位信息在至少两个类中拥有位置。\n\
  \n\n\n\n\n多模态融合方法使用了非下采样轮廓变换（`NSCT`）。最初，在预处理的原始图像上运行 `NSCT` 以获取其低频和高频子带。`NSCT` 是一种多尺度、移动不变、多方向的扩展，有助于快速执行。`NSCT`\
  \ 已在图像去噪和图像增强方面表现出极高的效率。\n\n## 特征提取\n\n该模块通过结合以下 3 种算法采用新型混合算法。所有使用的特征提取算法都是基于纹理的分析。\n\
  \n## 灰度差分法 (GLDM)\n\n两个像素具有灰度绝对差，并被特定的位移 `d` 隔开。运动向量可以从公式 (1) 计算，概率密度函数可以从公式 (2)\
  \ 计算。\n\n(1)\n\n```\n\\begin{array}{l} {\\delta = (\\Delta x,\\Delta y)} \\\\ \\\
  left. \\text{Let,~}S\\delta(x,y) = \\middle| S(x,y) - S(x + \\Delta x,y + \\Delta\
  \ y) \\right| \\\\ \\end{array}\n```\n\n(2)\n\n```\nD(i ∣ *δ*) = *Pr*ob*[(S*δ*(**x**, **y**) = i]\n\
  ```\n\n初始值从输入图像中。通过拼接从 PDF 计算出的角二阶矩、对比度、熵和平均值，计算出特征向量。\n\n## 最大稳定极值 (MSER)\n\nMSER\
  \ 是图像中具有灰度像素序列的稳定连通分量。如果我们在帧 `t` 内展示一组与阈值 `t` 相关的阈值图像序列，最初会看到一张黑色图像，随后与局部强度最小值相关的白点将出现。所有低于阈值的像素均为白色，所有大于或等于阈值的像素均为黑色。随着推移，白色逐渐增加。在一段时间内，这些白点将合并，直到整个图像变为白色。边缘直方图描述符\
  \ (EHD)\n\nEHD 是一种描述五类边缘空间分布的特征向量。邻域是一组相互相关的五条边缘，可以被视为子图像或图像块。子图像通过将可用图像空间划分为 4\
  \ x 4 个非重叠块找到。通过这种方式，图像划分产生了 16 个等效估计块，这些块与初始图像的大小无关。\n\n### 特征选择\n\n特征选择，也称为变量选择或属性选择，是用于模型构建的特征（变量、指标）子集的技术。离散粒子群优化（`DPSO`）是迭代优化技术的一种，属于优化技术，它通过尝试根据输入值的比例来改进候选解以实现优化。\n\
  \n## 结果与讨论\n\n所提出的框架被扩展用于分类正常对照组和 MCI（轻度认知障碍）患者。使用了不同的分类算法，显然，从图 2 可以看出，集成分类器的性能优于\
  \ `SVM`、`KNN` 和朴素贝叶等其他分类器。集成分类器的准确率达到了 86%。其他计算的其他性能指标还精确率、召回率、F 值和特异性。所有其他分类器的特异性均为\
  \ 100%。\n\n![图 2. 性能指标](img/fig38_2_B.jpg)\n\n图 2. 性能指标\n\n## 比较分析\n\n表 1 显示了测试阶段的准确率值。\n\
  \n表 1. 性能分析\n\n| 序号 | 参数 | 准确率(%) |\n| --- | --- | --- |\n| 1 | 未优化 | 83 |\n| 2\
  \ | 未预处理 | 80 |\n| 3 | 未预处理 | 75 |\n| 4 | 已预处理 | 86 |\n\n## 未来工作\n\n概述了一些想法，可以扩展这项工作的范围，利用多模态医学图像诊断并分类\
  \ `CN`（认知正常）、`MCI`轻度认知障碍）和 `AD`（阿尔茨海默病）。\n\n## 结论\n\n完成了基于 `NSCT`、`GLDM`、`MSER`\
  \ 和 `EHD` 的 `AD` 研究。\n\n## 参考文献\n\n1. Acharya, Rajendra, Fernandes, Wei... (2019).\
