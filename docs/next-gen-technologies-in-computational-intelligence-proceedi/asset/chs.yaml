  \ `varunrishwand2001@gmail.com`, `thuhinkhanna01@gmail.com`, `dpriya.vijay@rajalakshmi.edu.in`\n\
  \nDOI: `10.1201/9781003430452-20`\n\n## 摘要\n\n互联网的增长和规模使得建立中央权威来控制共享内容是不可能的。互联网平台有社区准则来监管其内容。然而，这仅限于各自的平台，而互联网要广泛得多。虽然电视等其他媒体形式有明确的审查制度，但在技术领域，保护用户免受接触敏感内容的影响方面存在空白。本工作建议构建一个深度学习模型，利用图像分类和情感分析等技术将网页内容分类为“安全”或“不适合工作”（`NSFW`）。NSFW\
  \ 内容是指任何在公共场合被认为不适当的内容，包括年龄限制内容。最终产品将是一个跨浏览器扩展程序，它可以实时检测并对内容分类为安全或 NSFW，并从客户端浏览器中屏蔽这些内容。Web\
  \ 扩展将是用户保护自己不受互联网敏感内容影响的一种通用且易用的解决方案。因此，这项工作旨在解决互联网敏感内容的审查问题。\n\n关键词：深度学习、自然语言处理、网络爬取、内容过滤、图像分类\n\
  \n# 引言\n\n\n\n\n据估计互联网上的数据量约为 64 兆字节（Zettabytes），1 兆字节等于一万亿字节（Gigabytes）。像 Facebook\
  \ 和 Twitter 等非常流行的网站都有自己的社区准则以及关于合适内容类型的政策。但其他所有网站并非如此，这些网站对用户可以发布在网站上的内容没有任何过滤。观众可能不希望在公共、正式或受控环境中消费或看到的内容被称为\
  \ NSFW，即“不宜在办公场所”（Not Safe For Work）。由于各种广告、弹出窗口等，想要避免敏感内容极其困难。即使在简单的网络搜索中，人们也会发现在搜索结果的第一页之后就很难信任这些网站。现在的孩子们在很小就接触了互联网。尽管有儿童安全机制，但对他们来说，访问包含不应接触内容的网站仍然轻而易举。\n\
  \n这项工作的主要目的是隐藏用户当前查看的网页上被认为不适当或敏感的文本和图像。这一目标通过一系列过程实现，包括抓取数据和图像、对获取的数据进行预处理，以及对数据应用分类模型将其分类为对用户安全或不安全。\n\
  \n## 相关工作\n\n### 数据收集与网络爬虫\n\nMoaiad Ahmad Khder (Khder, 2021) 将数据获取描述为任何数据科学研究和开发的第一阶段，并对比了\
  \ API 和网络爬虫，认为不像网络爬虫，API 无法始终依赖来获取数据。他列出了使用 Python 进行网络爬取的几种方法，即 `Beautiful Soup`、`Regular\
  \ Expressions` 和 `LXML`，并根据性能和易用性等标准对其进行了比较。Amani Alswailem 等 [ ] Outline 了使用实时数据爬取来分析网页内容。他们提出了爬取互联网和从网页提取数据的方法。他还使用了如\
  \ `OXPath` 和计算机视觉分析器等技术从任何类型的网页中提取数据。\n\n### 文本分类与仇恨言论检测\n\n文本分类是指为句子或文本数据片段分配预定义标签的过程。多年来已经开发了多种技术来分类文本。文本分类从将单词编码为数值向量开始，然后在监督或无监督学习中对其进行分类。\n\
  \n### 监督文本分类\n\n#### 词袋模型 (Bag of Words)\n\n词袋模型或 `BoW` 是自然语言处理中另一种将文本编码为数值向量的技术。`BoW`\
  \ 从为任务编写的大型词汇表开始，句子中的每个单词都被编码为词汇表中每个单词的出现计数。这意味着对于句子中的每个单词，都会生成一个与整个词汇表大小相同的向量。\n\
  \n词袋技术受限于任务词汇表的大小。随着词汇表大小增加，每个单词向量的长度也会增加，编码文本的空间复杂度变得过大而无法处理。\n\n#### Tf-Idf\n\n\
  词频-逆文档频率或 `TF-IDF` 是一种将文本表示为数值向量的统计方法。`TF-IDF` 使用基于文档中单词频率的对数评分来表示每个单词或标记（token）。使用\
  \ `TF-IDF` 我们可以识别文档中最重要的单词，单词关联的分越高，它就越重要。`TF-IDF` 已用于训练多个用于文本分类和情感分析的监督 NLP 模型。\n\
  \n### 基于注意力机制的文本分类技术\n\n注意力机制（Attention mechanism）由 Google 研究人员于 2017 年引入，导致了 `Transformer`\
  \ 架构的发展，该架构演变成了许多在文本生成和分类领域处于领先地位的模型。许多预训练的基于注意力的模型每天被应用于多个 NLP 任务和场景中。\n\n####\
  \ BERT (基于 Transformer 的双向编码表示)\n\n`BERT` 是一种用于预训练语言表示的无监督技术。`BERT` 也由 Google 开发，基于\
  \ `Transformer` 架构。与其前身不同，`BERT` 可以通过观察句子中给定单词左侧和右侧的单词来捕捉文本片段的上下文。\n\n`BERT` 被许多先进模型采用，是因为它可以针对所关注的任务对特定数据集进行微调。`BERT\
  \ large` 已使用超过 3.45 亿参数进行训练，并使用了来自互联网源、书籍和维基百科文章的 33 亿词词汇。\n\n#### GPT (生成式预训练 Transformer)\n\
  \n由 OpenAI 开发的 `GPT` 是另一种基于 `Transformers` 架构的先进无监督 NLP 模型，用于语言生成、文本分类、问答和翻译等多种功能。`GPT`\
  \ 与 `BERT` 的区别在于 `BERT` 是双向模型，而 `GPT` 是单向的，这意味着它只能按照传统的从左到右工作。因此，`GPT` 是语言生成任务的首选模型，而\
  \ `BERT` 则用于模型需要理解手中文本数据上下文的实例。\n\n取决于模型的大小，`GPT-3` 的实现可以从 1.25 亿到 1700 亿参数，基于从书籍、互联网网页、维基百科文章等海量训练数据集进行训练。\n\
  \n#### 仇恨言论检测\n\nMohaouchane et al., (2019)) 提出了一种检测社交媒体帖子中阿拉伯仇恨言论的系统，旨在监管这些论坛发布的内容类型。他的工作使用了\
  \ `LSTM` 和 `Bi-LSTM` 等深度学习分类方法对文本进行分类。该工作分析了来自 YouTube 评论区的超过 15000 条评论。\n\nNobata\
  \ 等 (2019) 提出了一种识别语言特征（如每个单词的大小、标点符号等）的方法，使用 `word2vec` 和 `comment2vec` 等技术检测仇恨言论。该工作分析了来自雅虎财经（Yahoo\
  \ Finance）评论区的超过 25000 条评论。\n\nPamungkas et al., (2022) 创建了一个名为 `SWAD` 的基准语料库，由英语推文组成，并包含对辱骂性脏话的手工词级标注。他们确定\
  \ `BERT` 模型在自动将单词分类为辱骂性和非辱骂方面提供了最高的准确率。\n\n### 图像分类\n\n图像分类是指将图像分类到各种标签下，或者判断图像属于某个标签的概率。卷积神经网络（`CNN`\
  \ 或 `ConvNet`）是一种特定的多层神经网络，用于识别像素图像中的视觉模式。`CNN` 通常包含三类层，即：卷积层（内核在矩阵上执行卷积运算）、池化层（通过降低维度来减少处理数据所需的计算量）以及全连接层（实际学习的地方）。\n\
  \n### VGGNet - 16\n\n`VGGNet-16` 架构包含 16 层，由 13 个卷积层和 3 个全连接层组成。使用线性线性单元（`ReLU`）激活函数，卷积层采用步长为\
  \ 1 的 `3 x 3` 过滤器。池化层使用步长为 2 的 `2 x 2` 过滤器。\n\n\n\n\n输入图像经过处理，并使用网络的前两层提取边缘和角等基本特征。后续层级逐渐提高抽象层次，并捕捉愈发复杂的细节。\n\
  \n### ResNet\n\nResNet 是一种深度神经网络架构，它利用残差连接（residual connections）来支持极深神经网络的训练。多个卷积层分布在多个残差块中，随后是批归一化和激活函数。深层网络中可能梯度消失问题通过每个块中的残差连接得到了缓解，这允许输入“跳过”某些层并直接馈送输出。\n\
  \nResNet 中的每个残差块由两个或三个卷积层、批归一化以及每个卷积层后的 ReLU 激活函数组成。块的输入与最后一个卷积层的输出相加，然后将和结果送入另一个激活函数。\n\
  \n### NSFW 图像分类\n\nKelly 等人，2018 实验了使用机器学习和神经网络进行图像中皮肤检测的各种技术。他们提出了一种系统，通过颜色直方图和特征提取来分析皮肤内容。\n\
  \nDeselaers 等人，2018 提出了一种使用视觉词包（BOVW）模型来识别敏感图像的系统。他们断言，在此类工作中，开发一个灵活的内容过滤器优于尖端算法，并且可以轻松地适应用户的需求。\n\
  \nZhelonkin & Karpov，2019 了一种如何准备高精度且快速的 CNN 以检测 NSFW 图像的方案。这项工作的创新之处在于不仅识别包含真人的图像中的裸体\
  \ NSFW 图片，还识别包括包含色情内容的卡通在内的其他绘画图像。\n\n## 提出的工作\n\n所提工作旨在检测并遮盖互联网用户可能访问的网页上的 NSFW\
  \ 内容。该工作利用图像和文本分类模型及架构来执行此类任务。该工作由许多过程组成，主要分为三个模块，将工作分为三个不同的计算模块，如图图 1 所示。\n\n![图\
  \ 1. 表示所提系统的系统架构图。](img/fig20_1_B.jpg)\n\n图 1. 表示所提系统的系统架构图。\n\n该工作的数据收集过程包括训练过程的标签识别，以及收集充分代表训练标签的数据。通过为这项工作构建数据集，模型被训练以接触在运行过程中可能遇到的类型的数据。\n\
  \n数据收集过程之后是对文本和图像数据进行预处理。预处理对于使爬取的数据适用于训练和验证是必要的，因为网络数据如果不清洗，可能不符合直接使用的格式。对来自数据源的数据预处理通常涉及处理特定特定的术语、HTML\
  \ 标签、CSS 数据等。虽然有许多用于网络爬取的库和包，但正则表达式提供了必要的工具和速度，通过简单匹配需要删除的文本模式来爬取数据。\n\n文本和图像分类的解决方案有很多，包括可以产生最佳结果的最先进预训练模型。在进行实时预测的任务中，速度比空间或时间复杂度是模型更重要的一个特征。模型需要经过训练以在这些特性之间取得平衡。在标记的数据集上构建的模型需要针对真实用户数据和来自互联网源的对话数据进行验证。在这种情况下，执行情感分析时理解文本摘录的语境至关重要，这使得需要深度学习文本分类模型。诸如\
  \ `Bi-LSTM` 和 `BERT` 之类的架构是能够有效理解文本数据语境并为其分配标签的模型示例。\n\n所提工作的最后一个模块是用户或客户端设备交互的应用程序。该模块的爬取部分设计为完全在用户设备的客户端端以浏览器扩展的形式运行。做出这一设计选择是为了保护用户内容的隐私。浏览器扩展在检测/分类\
  \ NSFW 内容后，还执行遮盖网页上 NSFW 内容的任务。爬取的数据被发送到托管后端服务器的云实例，由该实例执行实际的分类任务。任务对实时准确预测的要求通常依赖于高效且快速的硬件，因为客户端设备此时可能正在运行许多进程，因此云实例最适合此类分类任务。\n\
  \n## 结论\n\n所提工作提供了一个合适的框架，通过浏览器扩展使用各种深度学习算法，从用户的屏幕上遮盖 NSFW 内容。互联网上有大量迷人的事物，其中一些可能适合、也可能不适合消费。将年轻用户限制在少数网站上可能会抑制他们学习和探索新事物的欲望。这项工作可以作为一种实时儿童安全系统，防止儿童在网上访问不当内容。该系统设计优雅且友好。所提系统还提供了一种在对实际用户生成的数据进行实时预测时，实现文本和图像分类算法的方法。所提系统一旦实施和部署，将能够有效减少任何用户在网上遇到\
  \ NSFW 内容次数。\n\n## 参考文献\n\n1. Khder, Moaiad Ahmad (2021). Web Scraping or Web Crawling:\
