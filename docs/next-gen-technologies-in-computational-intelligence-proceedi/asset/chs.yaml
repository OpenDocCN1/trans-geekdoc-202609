  \ 81% 的准确率。所有四个分类器的结果均保持在高水平，导致加权平均精确率、召回率和 F1 分数较高，如下表所示。观察到分类器的整体准确率根据收集到的推文内容而异。推文内容越高，模型提供的准确率越高。使用平均倒数排名\
  \ (`MRR`) 衡量来权重每个预测的概率分布，并考虑真实计算与实际预测相比的排名顺序。`MRR` 在所有分类器上的表现均优于准确率。\n\n图 4 节点模块化社区聚类\n\
