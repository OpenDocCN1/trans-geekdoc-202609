  \ Access7(2019):81542-81554.\n\n\n\n\n在工业和军事领域，无线传感器网络（WSNs）在人类健康和环境监测具有巨大的用途（Mahajana\
  \ et al., 2014）。WSN 是大量低成本、低功耗传感器节点的集合。必须考虑能量限制以确保 WSN 的成功通信，因为这通常认为是一项昂贵的活动（Kumar\
  \ and Kumar, 2016）。需要许多节点的共同努力才能检测并收集这些关键的环境信息。传感器节点在感知、接收和传输数据期间收集数据会消耗大量能量（Bagci\
  \ and Yazici, 2013）。传感节点的电池和硬件资源非常稀缺，由于节点的大规模且杂章部署、其动态特性以及不可靠性，网络遭受了影响（Chavan and\
  \ Khiani, 2016）。\n\n采用聚类方法的方法用于节约能量（Haseeb et al., 2017）。一个传感器节点作为每个簇的簇头（CH），其他传感器节点作为成员节点。CH\
  \ 在将数据发送到基站（BS）之前，收集并汇总簇内传感器的数据。为了延长传感器网络的寿命，目前对传感器路由问题的研究（Prasanth and Pavalarajan,\
  \ 2019）主要关注具有能量感知且对传感器丢失或能量耗尽具有容忍性的协议（Prasanth and Pavalarajan, 2017）。然而，考虑服务质量（QoS）对于无线传感器网络的发展至关重要，而能量限制凸显了这些挑战（Sasikala\
  \ and Pavalarajan, 2022）。考虑到这些因素，提出了一种新的概念设计。以下是它们的亮点：\n\n*   CH 选择和路由的优化部分分两个步骤完成。\n\
  *   使用改进的泥土鱼优化技术来选择 CH（IMFOA）。\n*   建议的方法使用适应度函数选择最佳路由，并使用各种标准选择最佳 CH 节点。\n*   多跳路由使用基于地理位置的优化（BBO）算法完成。\n\
  *   这种优化导致了更好的 CH 选择，并与相关算法进行了比较。\n\n## 文献综述\n\n在 WSN 的拓扑控制（Heinzelman et al., 2002）中，聚类是一个关键概念，激活特定的网络节点作为簇头（CH）节点。骨干网络由簇头节点组成，它们可以切换到睡眠模式以降低其他成员节点的能量消耗。通过定期轮换簇头节点来平衡网络的能量消耗。同时也延长网络的生命周期。“轮”是选择簇头节点和重新组网络所采取每一步的集合术语。\n\
  \nLEACH 的更新变体 LEACH-C（Latiff et al., 2007）使用模拟退火技术来选择最佳 CH 节点。粒子群优化（PSO）这种优化方法（Sasi\
  \ et al., 2019）在近年来更受欢迎。它可以被用于寻找簇头节点并产生更好的结果。最近提出的使用 PSO 算法选择簇头的方法有 PSO-SD（Singh\
  \ and Lobiyal, 2012）和 MOPSO（Hamid Ali et al., 2012）。在之前的研究中，PSO 根据成员节点的距离和剩余能量来定位簇头（Pavalarajan\
  \ and Krishna Moorthy, 2014）。\n\n然而，这些基于 PSO 方法通常需要额外的计算和复杂的设置。在网络启动之前，节点被组织成几个模糊子簇（Priya\
  \ et al., 2022; Lakshmi and Pavalarajan, 2022; Pavalarajan and Prasanth, 2019）。所有子簇将同时工作，减少每个子集的大小和处理时间。使用遗传算法（GA），Kong\
  \ et al. (2018) 提出了能量感知路由，为数据传输接收创建许多基站。这种技术的构建成本更高且消耗更多能量。这种技术根据移动汇点的位置更改路由，以产生近优路径。它有助于降低路由必要维护的成本。此外，它仅要求少数节点构建路由。\n\
  \n\n\n\n鱼类消耗的食物量基于其在当前迭代中目标函数的增强程度。权重更新公式如公式 (4) 所示。\n\n(4)\n\n$$\\omega_{i}(l +\
  \ 1) = \\omega_{i}(l) + \\frac{\\Delta f_{i}}{\\max\\Delta f}$$\n\n$\\omega_{i}$\
  \ 表示当前代 `t` 鱼的权重，代表鱼 `i` 的前一个和后续位置之间目标函数的差异。对于处于同一位置的鱼类，该差异为零。\n\n当目标函数没有差异时（即 $\\\
  Delta f = 0$），会在发生鱼类个体运动时产生本能集体运动。因此，适应度有所提高的鱼可以引发鱼群的运动。在这种情况下，根据鱼类参与运动的影响和鱼的新位置计算出的设计方向通过公式\
  \ (5) 和 (6) 计算。\n\n(5)\n\n$${\\overset{\\rightarrow}{I}}^{t} = \\frac{{\\sum_{i\
  \ = 1}^{N}\\Delta}{\\overset{\\rightarrow}{p}}_{i}\\Delta f_{i}}{{\\sum_{i = 1}^{N}\\\
  Delta}f_{i}}$$\n\n(6)\n\n$${\\overset{\\rightarrow}{p}}_{i}^{t + 1} = {\\overset{\\\
  rightarrow}{p}}_{i}^{t} + {\\overset{\\rightarrow}{I}}^{t}$$\n\n鱼群权重的增加表明搜索过程正目标函数的成功移动。为了在其他区域寻找食物，鱼群的“半径”必须下降。因此，如果鱼群权重没有增加或减少，为了能够调查新区域，应该增加半径。对于鱼群所占区域的收缩，采用了质心概念。这是通过根据鱼权重计算所有鱼的加权平均位置得出的。这如公式\
  \ (7) 所示。\n\n(7)\n\n$${\\overset{\\rightarrow}{p}}_{\\text{avg~}}t = \\frac{{\\\
  sum_{i - 1}^{N}{\\overset{\\rightarrow}{p}}_{i}}\\omega_{i}^{t}}{{\\sum_{i - 1}^{N}{\\\
  overset{\\rightarrow}{p}}_{i}}\\omega_{i}^{t}\\,}}$$\n\n聚类过程之后，需要找到网络内部的路径。数据传输路径通过连接簇头并形成链路形成。`CH`\
  \ 节点收集的数据通过这些链路进行传输。从 `CH` 节点到汇点节点可以形成多条传输数据的路径。因此，必须在其中选择最优路径。可以使用优化算法来选择数据传输的最优路由。所选路径应该是最短且能耗更低的路径。因此，最优路径是通过考虑能耗和距离等因素确定的。用于计算最优路由计算的适应度函数如公式\
  \ (8) 所示。\n\n(8)\n\n$$\\begin{array}{l} {FF_{route}} \\\\\\\\ {= {\\sum\\limits\\\
  _{i = 1}^{m}}\\left( {e\\left( {N(\\text{CH})}\\i}} \\right) + \\left( {P\\left(\
  \ {N(\\text{CH})}\\i}} \\right) \\right) \\right)} \\\\\\\\ \\end{array}$$\n\n\n\
  \n\n本文提出了无线传感器网络（WSN）中用于节能的最优簇头（CH）选择和最优路径检测。新提出的基于 `IMFOA` 的最优 `CH` 选择考虑了网络剩余能量、度、与汇聚节点的距离以及其他网络节点。这种\
  \ `IMFOA` 方法克服了传统 `MFOA`（Veluchamy 等 (2021)）和 `FOA` 中存在的缺点。随后，可以使用 `BBO` 算法识别从 `CH`\
  \ 节点到汇聚节点传输数据的最优路径。通过在部署有 100 个节点的 WSN 场景中仿真对 `IMFOA` 方法进行了评估。评估结果表明，所提出的结合 `IMFOA`\
  \ 聚类和 BBO 路由的方法有助于降低能量消耗并延长网络寿命。此外，聚类过程减少了不必要的传输，而最短路径检测通过减少传输成本，降低了跳数数量。\n\n##\
