  \ 网络负载](img/fig34_3_B.jpg)\n\n图. 3. 总 P2P 网络负载\n\n\n\n\n\n# 人类脑肿瘤与神经网络的作用\n\nR.\
  \ Sankaranarayanan^(²⁷)\n\n邮箱：sankarnba@gmail.com, msen1982@gmail.com, profbcr@yahoo.com\n\
  \nDOI: [10.1201/9781003430452-35](https://dx.doi.org/10.1201/9781003430452-35)\n\
  \n## 摘要\n\n\n\n\n大脑是人体的主控系统。它调节思维、记忆、声音和身体。当大脑功能正常时，它能迅速且本能地控制多个器官的运行。但是，当出现问题时，后果可能是灾难性的。脑炎症是人类大多数心理健康问题的根源。然而，脑细胞的死亡（如中风所示）也会对神经产生压力并损害认知能力。影像在人类脑疾病的诊断中起着至关作用，可用于诊断各种神经系统疾病。影像检查可用于检测脑瘤。可以使用\
  \ X 射线、强磁铁或放射性化学物质对大脑进行成像。使用磁共振成像（`MRI`）或计算机断层（`CT`）检查大脑是诊断脑疾病的金标准。如果存在脑瘤，在每种情况下都能在扫描中看到。图像被转换为数据集，分析数据集以确定肿瘤是低性的、稳定的，还是可以缩小的，或者针对脑瘤应采取的步骤。神经网络预测肿瘤未来的变化情况。数据集被转换为神经网络，能够精确预测未来将发生的情况。\n\
  \n**关键词：** 脑瘤、脑瘤分类、卷积神经网络、循环神经网络、视觉几何组\n\n# 引言\n\n为了响应感官的输入，人类大脑处理数据并将其传递给神经系统的其他部分，随后将其传递给身体的其他部分，包括肌肉。人类大脑与其他哺乳动物的大脑一样，包含基本结构和与身体相关的层（图\
  \ 1）。人类大脑的重量相当于 31 只蜜蜂，占体重的 2%。平均男性大脑接近 78 立方英寸，平均女性大脑为 69 立方英寸，女性大脑比男性大脑小 10%。大脑大脑是大脑的首要结构，位于颅骨后方。人类大脑包含\
  \ 860 亿个神经细胞，以及相同数量的非神经元细胞。\n\n![图 1. 人类大脑](img/fig35_1_C.jpg)\n\n图 1. 人类大脑\n\n\
  人工神经网络，或简单地称为细胞网络。在深度学习方面，神经网络被认为是其子集。通常情况下，生物神经元相互接收信号，这些信号通过人类大脑接收（图 2）。人工神经网络有两个不同的层：I)\
  \ 输入层，II) 隐藏层。为了让数据进入网络的下一层，每个节点必须连接到另一个节点并与之关联的权重。神经网络使用其训练的数据随时间推移进行渐进式改进。这些学习算法经过了精度优化，是计算机科学和人工智能领域的强大资源，使我们能够快速地对数据进行分类和聚类。以前需要专家花费数小时的语音或图像识别任务，现在可以在几分钟内完成。许多种神经网络都服务于特定的功能。在前馈神经网络中，输入层和输出层是关注的重点区域。了解它们是由\
  \ sigmoid 神经元而非感知器构成的，至关重要，因为现实世界中的大多数情况都是非线性的。\n\n![图 2. 神经网络](img/fig35_2_C.jpg)\n\
  \n图 2. 神经网络\n\n卷积神经网络（`CNN`）与前馈网络类似，后者通常用于图像识别模式和所有的计算机视觉领域（图 3）。循环神经网络的特征——反馈回路也识别出利用此类数据实时预测股市和销售趋势的算法。急性脊髓损伤、阿尔茨海默病和其他神经系统疾病影响许多人（类型）。人类大脑中形成肿块的异常细胞发育被称为脑瘤。某些脑瘤是良性的，代表大脑癌症的最早期阶段，而另一些可能非常致命。源于大脑的肿瘤被称为原发性脑瘤，而从身体其他部位扩散的癌症被称为转移性脑瘤。脑瘤分为听神经瘤、星形胶质细胞瘤（类型）。根据脑瘤的大小、位置和发育速度，疾病的底层科学和症状可能大不同。症状可能包括头痛模式的变化、现有头痛严重性的加剧、恶心和呕吐、视力模糊、维持平衡或在书写或说话中清晰表达自己的困难、极度疲劳、头脑昏、不确定、缺乏冲动行为以及个性或行为的变化（图\
  \ 4）。目前正努力使用人工神经网络来检测和诊断人类脑癌。\n\n![图 3. 使用 FFN、CNN 和 RNN 进行脑瘤分类般工作流程](img/fig35_3_C.jpg)\n\
  \n图 3. 使用 FFN、CNN 和 RNN 进行脑瘤分类般工作流程\n\n![图 4. 脑瘤分类架构](img/fig35_4_C.jpg)\n\n图 4.\
  \ 脑瘤分类架构\n\n## 材料与方法\n\n脑疾病通过以下方法诊断，如活检、动态测试、影像检查、实验室检查、心理功能测试、神经检查。在本文中，我们侧重于使用\
  \ PET、`CT`、`MRI` 和超声扫描来识别脑瘤。\n\n组织和器官的代谢或化学活性可以在正电子发射层扫描（PET）中看到。放射性药物用于 PET 扫描以显示正常和异常的功能。当其他影像检查（如计算机断层或磁共振成像）无法识别疾病时，可以使用注射示剂后进行\
  \ PET 扫描来检测异常代谢。\n\n\n\n\n当图像准备就绪，将使用诸如 `BWT` 等技术来分割肿瘤区域，然后使用其他方法提取特征并对图像进行分类。从数据库检索到的\
  \ MRP 脑图像是一幅 256 x 256 像素的轴状面（图 5）。如果您有大脑的 MRI 图像并想精确定肿瘤的确切位置，可以使用一种被称为“分割”的技术，它涉及将生成的灰度图像转换为原始的黑白版本。在获取医疗用途的数据时，朴素贝叶斯哈希（Naive\
  \ Bayes hash）起着非常重要的作用。数据结果显示，由于属性之间相互独立，性能优异。\n\n![图 5. 肿瘤分类](img/fig35_5_C.jpg)\n\
  \n图 5. 肿瘤分类\n\n使用粘性测量进行分类。计算类别概率，并预测最可能的类别。朴素贝叶斯分类方法使用贝叶斯统计学，该方法非常强调先验概率对预测未来的重要性。在某些条件下可能性可以\n\
  \n```\n$$P(B \\mid A) = \\sum\\limits\\_{i = 1}^{n}P(Ax \\mid B)$$\n```\n\n如果属性\
  \ `A` 具有具有剩余概率比属性的能力，则计算给定 `B` 时每个 `Ax` 的条件概率是可能的，其中 `A = A1, A2, A3,... An`。\n\n\
  ## 结果与讨论\n\n在分析脑肿瘤时，许多研究者提出了进行定性和定量实验研究的观点。进行的定性研究表明，需要对词汇特征进行调查。目前的研究表明脑肿瘤分类是基于图像分析分割的。目前正在进行许多关于体素和体积特征提取的研究。研究还旨在预测临床结果（如患者生存率）并确定肿瘤发生的模式。例如，胶质质母细胞瘤（GBM）中的异柠檬酸氢酶（IDH）状态具有临床相关性，阴性状态（或“野生型”）标志着更具侵略性的肿瘤。这只是许多分析报告之一，这些报告使临床医生能够对肿瘤进行分级、评估治疗反应并预测\
  \ GBM 的遗传状态。当用于放射组学时，分割和提取程序提供了有意义的数据分析。在 GBM 的放射组学特征方面有全面的研究。这种放射组学试图寻找 I) 形状，II)\
  \ 纹理，III) 强度，IV) 微血管模式。\n\n`CNN` 的接受率比其他方法高，它给出了最高接受率 97.02%\n\n![图 6. 肿瘤识别结果分析](img/fig35_6_C.jpg)\n\
  \n图 6. 肿瘤识别结果分析\n\n## 结论\n\n在脑肿瘤患者的医疗治疗领域使用了 MRI 扫描过程。这种扫描技术有助于评估脑肿瘤的准确性和分类。与 MRI\
  \ 准确性相比，`CNN` 具有优势。`CNN` 有助于医疗实践理解脑组织和肿瘤组织的特征。因此，可以在脑肿瘤 `CNN` 和 `RNN` 领域开展广泛的研究\n\
