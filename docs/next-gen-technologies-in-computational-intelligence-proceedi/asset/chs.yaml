  \ `V2V`（车对车）和车对网（`V2N`）通信以交换信息。`AV` 网络可以分为 S 个阶段：辅助驾驶、部分自动驾驶、条件自动驾驶、高级自动和全自动驾驶。\n\
  \n随着 `AV` 网络规模的扩大，管理它们的运营成本、预测性维护以及最优路径规划也随之增加。所提出的模型汇总了来自各种传感器的数据，应用机器学习（`ML`）模型，并通过混合路径算法进行优化，以实现更好的导航和交通规避。\n\
  \n## 目标与假设\n\n当 `AV` 网络随着适应能力的增强而趋于成熟时，车内通信以及优化路线以满足目标和约束变得至关重要。为此，本文提出了一种“基于网络启发式的协调自动驾驶车辆决策”优化方法，该方法能够学习并适应环境。\n\
  \n1. **目标**：提出一种 `AV` 网络模型，通过由用户控制的启发式算法实现 `AV` 从起点到目的地的最优穿越，并满足定义的最优性条件。\n2. **最优性条件**：最小距离（最小能耗）、到达目的地的最小时间、最高舒适度与安全性。\n\
  3. **建议方案的假设**：该模型假设所有自动驾驶车辆都连接并由同一个网络控制。自动驾驶车辆处于与人类驾驶车辆的混合环境中。\n\n所有基础的 `AV` 操作功能（如物体检测、避物障、网络通信等）均已成熟并可用，而该解决方案侧重于宏观的最优导航。\n\
  \n## AV 网络环境\n\n自动驾驶车辆需要日益复杂的系统，配备高性能计算机和大量先进的辅助辅助系统传感器，如 `HR` 摄像头、`LIDAR`（激光雷达）和噪声传感器。\n\
  \n这些生态系统产生了海量数据，对高速数据节点、链路、交换机和组件提出了极高需求。`AV` 内部就像一条信息公路，数据流在不同方向流动并经过管理以提供更好的舒适度和安全性。汽车\
  \ OEM 制造商遵循网络连接标准。网络支持取决于需求，例如从信息娱乐到 `ADAS`（驾驶辅助），带宽需求范围在 1 到 25 GBPS 之间。\n\n`V2X`（车万互联）接口技术允许车辆之间直接通信，并允许路侧基础设施/用户提供道路安全、交通管理、智能移动及环境的可持续性。`V2X`\
  \ 需要基于传感器和无线电接口（Choi et al., 2017）。\n\n车对网（`V2N`）旨在通过高带宽/高可靠低延迟的网络生态系统在车辆之间发送信息。`V2N`\
  \ 系统将车辆与数据中心协调整合以实现稳定的信息交换。`V2N` 网络还连接网络中的其他车辆。虽然流行的应用程序提供交通更新和导航，但它们存在局限性。车辆共享更多关于位置、状态、速度、方向、交叉口辅助（`IMA`）和左转辅助（`LTA`）的详细信息以提高安全性。`V2N`\
  \ 还可以提醒行人设备（`V2P`）以避免可能发生的事故。\n\n![图 1. 下详细介绍了假设的自动驾驶车辆网络环境。](img/fig24_1_C.jpg)\n\
  \n图 1. 下详细介绍了假设的自动驾驶车辆网络环境。\n\n1. `AV` 云基础设施存储 HD 地图、来自车辆的多媒体流以及作为 `V2N` 更新的实时交通数据。这还为执行所提出的机器语言和路由算法提供了计算基础设施。\n\
  \n## 建议的优化模型\n\n### 模型组件与接口\n\n`AV` 最优路由模型基于感知（感知）、局部场景理解、动态路径规划和引导式导航控制。其中，`路径规划`是在给定的约束实时环境中寻找无碰撞路径的复杂步骤（Mac\
  \ et al., 2016）。这是一个确定性多项式时间困难问题（Chen & Quan, 2008）。不同的传感器和所使用的接口详见图 2，以及设备细节、用途和用之用于不同任务的算法。`AV`\
  \ 传感器根据其位置分类，例如车内、`AV` 外部以及 `AV-machinery` 内部载的传感器。使用的车内传感器包括麦克风、HD 摄像头、烟雾器、`IR`（用于用户座舱温度控制）等。使用的外部传感器包括\
  \ `Lidar`、超声波传感器、摄像头等。`AV` 内部传感器包括麦克风（用于通过异常检测磨损）和发动机健康监测的传感器。\n\n![图 1. AV 网络连接、存储和属性](img/fig24_2_C.jpg)\n\
