  \n## 摘要\n\n人工智能在计算机领域起着重要作用，因为它能够处理大量数据且预测更快更准确。机器学习技术和深度学习技术是人工智能的分支，深度学习是机器学习的一个子类。机器学习技术和深度学习有助于提取数据以促进生物医学领域的发展(Tiwari\
  \ 等人, 2018)）。机器学习已变得流行，并在非结构化数据上取得了更好的成就(Abound & Akpan, 2021)。随着数据的剧增，机器学习的流行日益增加。随着医疗数据的快速增长，图像分类在临床护理中起着关键作用。分类的目标是寻找目标类别(Perez-Careta\
  \ 等人, 2022)。目标类别应该是准确的。传统方法耗费时间，且寻找目标类别需要额外的努力。\n\n关键词：朴叶贝斯、高斯朴叶贝斯、维纳滤波\n\n# 引言\n\
  \n\n\n\n机器学习通过从过去的数据中学习模式来实现模型的自动化和输出预测。机器学习已成为一种广泛使用的方法，因为它在复杂任务中产生的结果比人类表现更显著的结果（Janiesch\
  \ et al., 2021; Alzubaidi et al., 2021）。机器学习的主要目标是建立模型以执行各种任务，如目标分类和检测。大量复杂数据的处理以及硬件工程的惊人进步（例如：高性能计算技术）增加了学习的普及。肺部和肺部疾病预测分类是近期研究的重要课题。随着在医院、诊断中心等地的使用，医疗图像数据集的大小也在增大。Yadav\
  \ & Jadhav (2019) 通过分析 X 光片来确定肺炎患者与健康人员。这种分析是必要的，因为确定肺炎患者成本高昂且需要精通的放射科医生。为了克服这项繁琐的分类任务，本研究涉及高斯朴素贝叶斯算法和胸部图像处理分析。\n\
  \n## 相关工作\n\n朴素贝叶斯分类器被用于并使用中值滤波器来过滤 X 光图像中的噪声（Bustomi et al., 2018）。图像分类是基于软集（Soft\
  \ set）。软集分类器根据类别数量的平均值进行，并通过标记未知数据进行分类（Lashari & Ibrahim, 2013）。医学分类执行了 KNN 分类和特征提取。针对小类和不平衡图像数据的分类是通过深度\
  \ KNN 完成的（Zhuang et al., 2020）。使用多种算法分析超声图像，结果显示支持向量优于其他算法（Naziya & Jadhav, 2019）。图像分类通过特征袋（Bag\
  \ of Features）方法执行，该方法侧重于向量表示。这是通过支持向量机和 KNN 完成的，并计算它们的准确率。这种表示用于寻找图像的类别（Loussaief\
  \ & Abdelkrim, 2018）。目标是通过 SVM 分类器数据找到结核感染患者和未感染患者。性能结果为 94.7%（Yahyaoui et al.,\
  \ 2017）。肺病分类是通过非常少的图像数据集完成的（Krzhizhanovskaya et al., 2020）。在 Abu et al, (2019) 中，使用\
  \ TensorFlow 框架进行各种花类的分类。使用深度神经网络对图像进行分类，获得的准确率为 90%。Yu Zeng 等执行了随机森林和决策树算法，显示噪声有所减少。该论文关注用于医疗数据的各种输入特征。从该算法中获得的准确率为\
  \ 86%（Zeng & Cheng, 2021](ch80.xhtml#ref80_16) 给出了两种算法之间的比较，并建议朴素贝叶斯算法提供了更好的结果。\n\
  \n## 朴素贝叶斯分类\n\n朴素贝叶斯是一种用于图像、文档、垃圾邮件分类的简单而强大的算法。“Naive（朴素）”名称意味着属性与其他属性是独立的。这意味着模型中某一个属性的变化不会影响其他属性。它是一个概率框架，我们涉及寻找给定某些特征的概率（Viet\
  \ et al, 2021）。在使用高斯朴素贝叶斯之前，我们需要知道 X 相对于 Y 的概率的条件概率是什么。\n\n(1)\n```\nP\\left[\\\
  frac{X}{Y}\\right] = \\frac{P[XY]}{P[Y]}\n```\nX 已经发生的概率是 A 和 B 同时发生的概率。贝叶斯定理指出：\n\
  \n(2)\n```\nP\\left[\\frac{V}{U_{i}}\\right] = P\\left[\\frac{V_{1}}{U_{j}}\\right]\
  \ \\ast P\\left[\\frac{V_{2}}{U_{j}}\\right] \\ast \\dots \\cdot P\\left[\\frac{V_{n}}{U_{j}}\\\
  right]\n```\n$P\\left[\\frac{Vj}{Ui}\\right]$ - 假设为后验概率。\n$P\\left[\\frac{Ui}{Vj}\\\
  right]$ - 假设为似然概率。\n$P[Vj]$ - 假设的类别概率。\n$P[Ui]$ - 证据概率为真。朴素贝叶斯假设特征相互独立：\n\n(3)\n\
  ```\nP\\left[\\frac{X}{Y}\\right] = \\frac{P[XY]}{P[Y]}\n```\n（注：此处遵循原文逻辑翻译公式说明）\n\
  $P\\left[\\frac{Vj}{Ui}\\right]$ - 实例 $V$ 生成 $Ui$。\n$P\\left[\\frac{V1}{Ui}\\right]$\
  \ - 类别 $Ui$ 生成 $V1$。\n$P\\left[\\frac{V2}{Uj}\\right]$ - 类别 $Uj$ 生成 $V2$。\n$P\\\
  left[\\frac{Vn}{Uj}\\right]$ - 类别 $Uj$ 生成 $Vn$。\n\n### 1. 伯努利分布\n伯努利贝叶斯工作良好适用于离散数据，并基于伯努利分布（Ismail\
  \ et al., 2016）。当预测器为二分类时，使用伯努利贝叶斯分类器。伯努利贝叶斯的判定规则如下：\n\n```\nP(k|Y)X[k] + (1-P(k|Y))(1-X[k])\n\
  ```\n\n### 2. 高斯分布\n处理连续数据的最佳方法是高斯朴素贝叶斯（Kamel et al., 2019）。当数据为离散时使用朴素贝叶斯。朴素贝叶斯是一种生成式模型，高斯朴素贝叶斯遵循高斯分布（正态分布）。高斯分布在统计分析和机器学习中被广泛使用（Shen\
  \ & Fang, 2020）。\n\n数据的似然概率密度假设为：\n\n(5)\n```\nP\\left[\\frac{Xi}{Y = k}\\right]\
  \ = \\frac{1}{\\sqrt{2\\pi\\sigma_{k}^{2}}}e^{({ \\frac{xi - \\mu_{k}}{2\\sigma_{k}^{2}}})}\n\
  ```\n其中：\n* Xi 是连续变量。\n* $Y = k$ 是 $Y$ 的类别 $k$。\n* $\\sigma$ 是变量 $X$ 的方差。\n* $p$\
  \ 定义为 $Xi$ 对于 $Y$ 的平均值。\n\n高斯朴素贝叶斯算法：\n输入：一组胸片图像\n输出：分类数据和准确率计算\n\n1. 步骤 1 收集数据集。\n\
  2. 步骤 2 对收集的数据进行预处理。图像在分类前可能包含噪声。\n3. 步骤 2.1 使用维纳滤波器去除噪声。\n4. 步骤 3 使用 `python` 创建模型。\n\
  5. 步骤 4 将数据集分为训练集和测试集。训练集占 70%，测试集占 30%。\n6. 步骤 5 测试数据并预测类别。检查 GNBA 的训练数据并预测类别。\n\
  7. 步骤 6 评估数据的性能指标并存储数据。\n\n## 实现\n\n步骤 1：医疗数据获取\n\n材料：数据从 Paul Mooney 的 Chest X-Ray\
  \ Images (Pneumonia) 数据集改编自。\n\n\n\n\n# 第 2 ：处理\n\n图像分类的第一步是处理 (Arya & Semwal, 2017)，图像可能包含噪声，在分类之前应该去除这些噪声。泊松噪声、白噪声、高斯噪声等是图像中可能存在的某些噪声。为了消除这些噪声，使用了滤波器。三种滤波器是：\n\
  \n1. `Wiener filter` 或线性滤波器\n2. `Averaging filter` 或 `Mean filter`\n3. `Median filter`\n\
  \n## 第 2.1 节：i) 均值滤波器\n\n`Averaging filter` (Shetti & Patil, 2017) 将每个像素元素替换为该区域像素元素的平均值。这种滤波器非常简单，通过降低两个像素之间的强度差来平滑图像。这通常用于减少噪声。\n\
  \n### ii) 中值滤波器或非线性滤波器\n它通过保留边缘来消除噪声。每个像素元素被替换为区域内像素元素强度的中位数。\n\n- **优点**：保留了锐利的细节。对离群值的敏感性低于均值滤波器。能有效去除离群值。\n\
  - **缺点**：不能去除所有类型的噪声。\n\n### iii) 维纳滤波器\n它是一种零线性滤波器。`Wiener filter` 适应图像偏差。如果方差较小，`wiener`\
  \ 可以实现很好的平滑效果；如果方差大，则平滑效果较差。它为确定平稳信号中的计算难度提供了更好的解决方案。它在胸部 X 光图像去噪方面提供了很好的效果。与 `Median\
  \ filters` 和 `Averaging filters` 相比，`Wiener filters` 在过滤胸部 X 光噪声方面提供了非常理想的结果。\n\n\
  在本文中，我们使用 `Wiener Filter` (图 3) 来过滤噪声\n\n![图 3. 去噪后受高斯噪声影响的肺炎胸部 X 光片](img/fig80_3_B.jpg)\n\
  \n图 3. 去噪后受高斯噪声影响的肺炎胸部 X 光片\n\n![图 1. 提议系统的框图](img/fig80_1_C.jpg)\n\n图 1. 提议系统的框图\n\
  \n![图 2. 受肺炎影响的胸部 X 光片](img/fig80_2_B.jpg)\n\n图 2. 受肺炎影响的胸部 X 光片\n\n# 第 3 节：正常和肺炎胸部\
  \ X 光数据集检查 (图 4)\n\n![图 4. 肺炎和正常 X 光数据集](img/fig80_4_C.jpg)\n\n图 4. 肺炎和正常 X 光数据集\n\
  \n# 第 4 节：数据统计\n胸部 X 光数据总共 387 份，总观测值为 387 条数据。训练数据集为 270 份，测试数据集为 117 份。\n\n# 第\
  \ 5 节：预测策略\n\n为了预测类别，导入 `Gaussian Naive Bayes`。通过训练和测试数据来拟合模型。\n\n# 第 6 节：性能指标与结果\n\
  \n性能指标是 `accuracy`、`Precision` 和 `Recall`。这些指标是通过类别的混淆矩阵计算出的。这展示了来自 `sklearn` 的\
  \ `Gaussian Naive Bayes` 如何使用测试数据预测类别。\n\n### 准确率 (Accuracy)\n准确率值等于所获得的真正（True\
  \ positive）值总数加上获得的真负（True Negative）值，除以获得的总样本数。\n\n$$\\text{Accuracy} = \\frac{\\\
  text{TPV} + \\text{TNV}}{\\text{TPV} + \\text{FPV} + \\text{TNV} + \\text{FNV}}$$\n\
  \n使用 `Gaussian Naive Bayes Algorithm` 的准确率为 96.90。\n\n### 精确 (Precision)\n精确率定义为获得的正例值总数除以获得的正例总数（真正\
  \ + 假正）。\n\n$$\\text{Precision} = \\frac{TPV}{TPV + FPV}$$\n\n精确率在 `Naive Bayes\
  \ Classifier` 和 `Bernoulli Naive Bayes` 中表现良好，数值为 96.1。\n\n### 召回率或敏感性 (Recall or\
  \ sensitivity)\n召回率是预测中的正例预测除以预测中的总样本数。\n\n$$\\text{Sensivity} = \\frac{\\text{True~Positive}}{\\\
  text{True~Positive} + \\text{False~Negative}}$$\n\n## 表 1. 算法与性能指标对比\n\n| 性能 | 提议算法\
  \ - 高斯朴叶贝斯算法 | 朴叶贝斯分类器 | 伯努利朴叶贝斯 |\n| --- | --- | --- | --- |\n| 准确率 | 96.90 | 85.1\
  \ | 94 |\n| 精确 | 96.1 | 77.62 | 92.6 |\n| 召回率或敏感性 | 98.0 | 79.28 | 88.7 |\n\n![图\
  \ 5. 真实值与预测值的矩阵](img/fig80_5_C.jpg)\n\n图 5. 真实值与预测值的矩阵\n\n![图 6. 算法的性能指标](img/fig80_6_C.jpg)\n\
  \n图 6. 算法的性能指标\n\n## 结论\n\n该想法基于机器学习技术对医疗健康图像进行分类。为了分类医疗图像，提议的分类方法高效运行。对于胸部 X 光的分类，使用了\
  \ `Gaussian Naive Bayes`。应用 `Wiener filter` 去噪，并使用 `GNBA model` 进行肺炎分类。该算法优于其他算法。\n\
