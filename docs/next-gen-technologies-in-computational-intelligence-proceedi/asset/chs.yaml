  \ 和 李东]. (2019). 图像处理中阈值分割的研究与分析。物理学会议系列 1237(2)。\n\n### 补充材料\n\n基于 Mesh 协议用于车载联网网络（VANETs）碰撞检测的实时\
  \ V2V 通信：基于物联网的车辆联网实现 Darshit Niravbhai Vadgama, Gariman Bhutani, 和 Jayavignesh\
  \ Thyagarajan 电子学院，韦洛尔理工学院，钦奈校园，印度 钦奈 DOI 10.1201/978103430452-7\n\n## 摘要\n\n本文介绍了一种使用\
  \ `ESP32` 微控制器板和 `ESP-MESH` 协议的汽车通信系统的开发与评估。选择 `ESP-MESH` 协议是因为其相对于其他无线协议的优势，包括低延迟、高吞吐量、可扩展性和电源效率。该系统包含用于车辆间小规模距离测量的超声传感器，以及用于拥堵控制和高效路线规划的实时数据分析\
  \ `GPS`。为了测试系统的功能和性能，使用 `NS2`、`SUMO` 和 `OSM` 在多个节点上进行了仿真。结果表明，该系统在车辆之间提供了可靠高效的通信，满足了\
  \ VANET 技术的主要目标。这项研究证明了 `ESP32` 微控制器板和 `ESP-MESH` 协议作为增强 IoV 环境下 VANET 通信道路安全和交通效率的潜力解决方案。\n\
  \n关键词：Mesh、碰撞检测、道路安全、ESP-MESH 通信协议、IoV\n\n# 引言\n\nVANETs（车载自组织网络）是改进的移动自组织网络（MANETs），设计用于车辆环境。VANETs\
  \ 的特点是高度动态的网络拓扑和有限的通信范围，这使其设计和实施具有挑战性（Anwer & Guy, 2014; Hasrouny et al., 2017）。尽管存在这些挑战，VANETs\
  \ 可以为交通部门带来许多益处，包括提高道路安全、拥堵控制和更佳的车辆间（V2V）通信。在过去的几年里，VANET 领域付出了大量努力，开发能够适应各种汽车应用的必要通信协议。\n\
  \n“车辆联网”（IoV）术语意味着一个互连的车辆网络，它们可以与其他车辆（V2V）无线交互，并与基础设施（V2I）如交通灯、路传感器交互。IoV 允许车辆交换信息，为驱动员提供实时交通更新、路线建议和其他帮助他们安全高效导航的重要信息。技术依赖于安装在车辆上的各种传感器和通信设备，如\
  \ `GPS`、雷达、摄像头和 `LiDAR` 传感器，用于向其他车辆和中央基础设施收集数据。这些数据包括车辆位置、速度、油耗等。IoV 还可以实现 V2V 和\
  \ V2I 通信，从而防止事故并减少交通拥堵。总之，IoV 具有变革智能交通系统（ITS）的潜力，使其更安全、更高效、更可持续（Ji et al., 2020）。\n\
  \n\n\n\n\n- `RSU`: 路侧单元（计算设备），可为通过的车辆提供连接辅助。\n- `OBU`: 车载单元 - 一种车载通信设备。它使用 `GPS`\
  \ 确定车辆的经纬度，并通过超声波传感器计算与其他物体或车辆之间的距离以实现碰撞回避。\n- `Vehicles`: 节点是赋予车辆的名称，使其能够与其他车辆或路侧资源进行通信。\n\
  \n### 提议系统\n\n在本文中，设计了以 `ESP32` 为微控制器、`ESP-MESH` 为通信协议的 IoT 车辆节点，这些节点协同工作形成车载自组织网络（VANET\
  \ 框架 EID, 2023; Kumari et al., 2020）。\n\n超声波传感器和 `GPS` 作为外设接口在每个节点中。超声波传感器是小规模 VANET\
  \ 实现中计算两车间距离的低成本且可靠的方案。`GPS` 集成在节点中，用于精确的车辆位置跟踪并实现实时数据分析。位置跟踪可以引导向驾驶员提供安全警告，从而提高整体道路安全。它还可以用于改进\
  \ VANET 网络内部的数据包路由，实现车辆之间以及与路侧基础设施之间的有效通信。图 2 显示了 `ESP32` 模块与超声波传感器及 `GPS` 模块接口的原理图。硬件软件代码可在\
  \ [`github.com/Darshit-Vadgama/`](https://github.com) VANET 获取。（Anwer & Guy, 2014;\
  \ Framework EID, 2023; Yu et al., 2011; Ghori et al., 2018)提供了仿真代码支持。图 3 显示了 `OBU`\
  \ 装配单元。\n\n![Fig. 2. 原理图](img/fig27_2_C.jpg)\nFig. 2. 原理图\n\n![Fig. 3. 车载单元 (OBU)](img/fig27_3_C.jpg)\n\
  Fig. 3. 车载单元 (OBU)\n\n### 实现 VANET 的步骤\n\n车辆通过选定的网络协议相互通信。\n\n1. 实现网络拓扑：根据你的项目需求决定网络拓扑。例如，你可以实现一个简单的星型拓扑（所有车辆直接与中心节点通信），或者一个车辆之间直接通信的更复杂的网状网络。\n\
  2. 实现通信协议：在 `ESP32` 模块上实现通信协议。这涉及定义车辆之间交换的消息格式，并实现处理消息的必要逻辑。\n3. 实现路由协议：在 `ESP32`\
  \ 模块上实现路由协议。这涉及定义数据从一辆车辆路由到另一辆车辆的规则。\n4. 测试并验证系统：通过模拟不同场景来测试系统，并验证系统运行如下方 图 4 和\
  \ 5 所示的预期工作，我们使用 3 个节点测试了硬件。显示通信正在发生，同时碰撞回避警告系统并行运行。\n\n![Fig. 4. Arduino IDE 串口监视器显示来自节点\
  \ 3 的数据包](img/fig27_4.jpg)\nFig. 4. Arduino IDE 串口监视器显示来自节点 3 的数据包\n\n![Fig. 5.\
  \ Arduino IDE 串口监视器显示来自节点 1 的数据包](img/fig27_5.jpg)\nFig. 5. Arduino IDE 串口监视器显示来自节点\
  \ 1 的数据包\n\n### 使用的通信协议\n\n`ESP-MESH` (Framework EID, 2023) 协议由于优于其他协议，是 VANET 通的良好选择。它具有低延迟、高吞吐量、可扩展性且功耗的特点，并允许设备在局域网\
  \ (LAN) 内互连。如 图 6 所示，`ESP-MESH` 数据包头部列出了源和目的 MAC 地址并构建在 WiFi 之。\n\n![Fig. 6. ESP-MESH\
  \ 架构图](img/fig27_6_C.jpg)\nFig. 6. ESP-MESH 架构图\n\n![Fig. 7. ESP-WIFI 数据包](img/fig27_7_C.jpg)\n\
  Fig. 7. ESP-WIFI 数据包\n\n`ESP-WIFI-MESH` 可以使用路由表处理数据包转发，如 图 8 所示。`ESP-WIFI` 的 AP（自适应速率）TCP\
  \ 方法用于限制传输速率并避免拥塞相关的损失，如 图 9 所示。\n\n![Fig. 8. 双向数据流](img/fig27_8_C.jpg)\nFig. 8.\
  \ 双向数据流\n\n![Fig. 9. 自适应速率 TCP](img/fig27_9_C.jpg)\nFig. 9. 自适应速率 TCP\n\n**ESP-MESH\
  \ 的优点：**\n- 自组织和自愈能力，允许用户创建并管理网络。\n- 低延迟和高吞吐量对实时通信至关重要。\n- 可扩展，支持大量节点。\n- 节能，允许设备在网络中运行。\n\
  \n**ESP-MESH 的局限性：**\n- 构建在 WiFi 之上，范围有限。\n- 受限于低功率电电。\n- 可能会受到相同频率设备的干扰。\n- 与其他协议相比较新且使用较少。\n\
  \n## 使用的路由协议\n\n主动和响应路由技术在此背景下都是相关的。一种基于需求的响应路由技术被称为 `AODV`。只有在需要时，`AODV` 才会建立路径。它具有路由请求响应机制，使其能够请求路由并根据响应决定最佳方案。本文讨论了\
  \ `AODV` 响应路由协议的以及使用不同仿真器的实现策略。\n\n### 仿真方法\n\n为了分析 `AODV` 在 VANET 中的行为，使用了三种不同的仿真工具：`SUMO`\
  \ (Kaisser et al., 2012)、`OSM` 和 `NS2` (Ns, 2016)。提供了基础交叉路口的实现以展示工作流程，并利用相同的流程构建多个场景。一种名为城市交通仿真\
  \ (`SUMO`) 的网络车辆仿真器专门用于规划和评估车辆移动模式 (Khairnar & Pradhan, 2011)。`OSM` (开放地图) (Nawej\
  \ et al., 2021) 加载了异构道路和环境地图。我们进入了金奈的 Guindy 形立交高速公路。\n\n**在 SUMO 0.16.0 中生成场景的步骤：**\n\
  \n1. 通过生成 `a.nod.xml` 文件创建地图节点。\n2. 使用 `a.edg. xml` 文件绘制自己的地图边边。\n3. 通过生成 `a.netc.cfg`\
  \ 文件创建配置文件。\n4. 通过创建 `a.net. xml` 文件生成地图文件。\n5. 通过创建 `a.flow.xml` 文件定义地图中的流。\n\n\
  \n\n\n\n6.  通过生成 `a.rou.xml` 文件来配置车辆自动移动。\n\n7.  创建 `a.sumo.tr` 和 `a.sumo.cfg` 文件来设置仿真。\n\
  \n8.  渲染仿真。\n\n9.  手动创建轨迹文件，或使用 `Trace Exporter` 软件以提高方便。\n\n廉价的便携式卫星导航系统以及全球地图信息的局限性促进了\
  \ OpenStreetMap 的创立和发展。运行 `iOS` 或 `Android` 的支持 `GPS` 的手机能够轻松对地理数据进行众包。OpenStreetMap\
  \ 是一个众包的开放内容许可平台，允许全球范围内的个人收集和更新地理数据，使其具有价值并频繁更新。\n\n为了进行仿真，我们必须首先从 OpenStreetMap\
  \ API 导出 XML 文件，如图 10 所示。然后，我们必须按照上述的步骤在 `Ns2` 中打开该文件。现在，我们将使用 `SUMO` 仿真流量并在 `Ns2`\
  \ 中运行该 XML 文件，如图 11 所示。\n\n![Fig. 10. 钦奈盖 Guindy 的 OSM 窗口](img/fig27_10_C.jpg)\n\
  \nFig. 10. 钦奈盖 Guindy 的 OSM 窗口\n\n![Fig. 11. NS2 中的 SUMO 文件仿真](img/fig27_11_C.jpg)\n\
