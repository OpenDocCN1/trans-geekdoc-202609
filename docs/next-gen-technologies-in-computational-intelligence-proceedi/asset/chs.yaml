  \n## 摘要\n\n近年来，软件定义网络（SDN）范式已演变为构建未来网络和满足当代进展需求的独特框架。得益于 SDN 的集中化管理和可编程性，攻击者可以利用其安全漏洞来发起拒绝服务（DoS）和分布式拒绝服务（DDoS）攻击。这会导致网络资源、服务器以及控制器和交换机上的内存出现过载，从而损害正常用户使用系统的能力。为了解决这个问题，本文开发了一种基于深度学习的有效入侵检测系统（IDS），用于\
  \ DoS 和 DDoS 攻击分类。该模型包含多个步骤，首先使用基于条件生成对抗网络（CGAN）的技术解决数据集中的类别不平衡问题。然后，使用基于 `MobileNetV3`\
  \ 的深度学习算法提取数据每一类别的关键特征。随后，部署了一个改进的基于 `LeNet-5` 的分类器来单独检测攻击。最后，所提架构为有效网络主机重新组织网络资源，并使用远程\
  \ SDN 控制器通过 Open Flow（OF）交换机缓解发现的网攻击。通过使用广知的 `InSDN` 和 `CICIDS2017` 数据集，我们展示了该安全计划如何在真实的现代数据中心实施。研究结果表明，与现有标准技术相比，所提框架在提高\
  \ DDoS 检测 F1 分数、召回率、精确率和准确率方面具有优越性。\n\n关键词：深度学习、软件定义网络、分布式拒绝服务、缓解\n\n# 引言\n\n自当前的互联网架构诞生以来已经过去了近三十年，该架构如今已成为一个极其复杂的系统。它包含许多网络设备，包括路由器、交换机和各种中间设备（防火墙、负载均衡器等），每种设备都配备了复杂的协议（Kasongo,\
  \ 2023; Logeswari et al., 2023; Varma et al., 2023）。这些网络设备主要由多家公司构建。每个制造商都有自己独特且互不兼容的架构、固件和其他运行软件来驱动其设备。因此，现代应用的动态特性和不断变化的需求无法通过当前的互联网架构。\n\
  \n因此，软件定义网络（SDN）作为一种创新的网络架构被创建。它被越来越多地应用于运营商网络和数据中心，因为它可以处理未来网络日益增长的需求（Kamel & Abdullah,\
  \ 2022; Maheshwari et al., 2022; El Sayed et al., 2022）。与标准的 IP 网络相比，它提供了互操作性、可扩展性以及对交换机的控制。SDN\
  \ 的核心组件是具有网络状态完全可见性的集中式控制器。交换机与控制器之间的交互通常使用开源协议 `OpenFlow` 处理，该协议允许控制器根据需要直接告知任何交换机中的流规则（Majidian\
  \ et al., 2023; Singh & Jayakumar, 2022; Mustapha et al., 2023）。由于网络控制结构更具灵活，SDN\
  \ 被广泛应用于无线局域网、云数据中心网络和其他网络。\n\n然而，它仍然面临着特定的基础性安全问题，如 DDoS 攻击。当网络遭受 DDoS 攻击时，SDN\
  \ 控制器将与系统的其他部分隔离并失去集中权力（Yousuf & Mir, 2022; Singh & Jayakumar, 2022; Abdulsamad\
  \ & Salih, 2023; Al-Shareeda et al., 2023）。在攻击 SDN 控制器的 DDoS 期间，大量数据包被传输到网络设备。交换机将无法与伪造的目标和源\
  \ IP 地址匹配的流项，并将这些不匹配的流量视为全新的流量。交换机将直接转发数据包或向控制器发送消息。控制器在 SDN 中选择这些数据包的转发路径（Karthika\
  \ & Arockiasamy, 2023; Cai et al., 2023; Aslam et al., 2022; Polat et al., 2022）。由于大量\
  \ DDoS 流量隐藏在真实流量中，控制器的资源被持续消耗，阻止了处理新到达的数据包。遗憾的是，即使有备份控制器，问题仍然存在。\n\n目前，检测 SDN 攻击的方法分为三大类：基于深度学习、机器学习和信息统计的方法。信息方法依赖熵值；然而，该值的选择基于主观意见和专业经验直接影响检测准确性（Chouhan\
  \ et al., 2022; Issa & Albayrak, 2023; Ortega-Fernandez et al., 2023）。在分析低维特征和有限数据时，机器学习方法优于统计方法。然而，对于海量样本和高维数据的检测，后者并不适用。因此，引入深度学习算法来快速有效地处理此类数据。它将获取特征并将高维特征表示为抽象特征。\n\
  \n因此，本文实现了一种有效的基于深度学习的 IDS，用于 SDN 环境下识别并缓解 DDoS 攻击。为此，特征提取和分类通过 `MobileNetV3` 和\
  \ `LeNet-5` 深度学习技术完成。检测攻击后，通过远程 SDN 控制器激活 DDoS 缓解。此外，利用条件生成对抗网络（CGAN）执行数据增强以提高分类器的性能。\n\
  \n*   本文的主要贡献如下：\n\n*   应用基于条件生成对抗网络（CGAN）的数据增强技术处理数据不平衡问题。\n\n*   基于 `MobileNetV3`\
  \ 的深度学习策略从原始网络流量数据中提取关键属性。\n\n*   实现了基于 `LeNet-5` 的深度学习技术来检测和分类不同形式的攻击。\n\n*   为了对抗已识别的\
  \ DDoS 攻击，所提架构利用远程 SDN 控制器操纵合法网络主机的服务。\n\n本文的其余部分分为以下章节。第二部分介绍了相关研究。下一部分涵盖我们方案的设计、公式化和实现。第四部分详细讨论了方案的评估测试以及结果。最后部分概述了结论以及对未来研究的一些性建议。\n\
  \n\n\n\n\nTonkal et al. (2021) 利用机器学习算法提出了邻域分量分析 (NCA)， 将 SDN 流量分类为攻击或正常流量。为了提高分类器的性能，通过\
  \ `NCA` 提取并选择了更相关的特征。在特征选择和预处理阶段之后，利用`支持向量机`、`决策树`、`神经网络`和`k-最近邻`技术对获取的数据集进行分类。使用根据混淆矩阵确定的`F-score`、`精度`、`特异性`、`敏感性`和`率`等性能约束对建议的模型进行了分析。\n\
  \nTan et al. (2020) 为 SDN 环境创建了一个检测和防御攻击的框架。他们首先提供了一个触发系统来识别 `DDoS` 攻击，以检查数据面上的异常网络流。一旦利用了数据流的异步性特征和稀有特性，他们应用了结合\
  \ `KNN` 和 `K-Means` 的混合机器学习方法来寻找网络中不可靠的流。随后，控制器采取适当的防御措施来抵抗攻击。\n\n为了识别并反击针对 SDN\
  \ 的攻击，Li et al. (2022) 引入了 `DoSGuard` 协议无关保护架构。`DoSGuard` 模块由`缓解器`、`检测器`和`监控器`三个部分组成，它是\
  \ SDN 控制器的轻量级扩展。`监控器`跟踪主机和交换机之间的数据以识别异常。`检测器`利用 `OpenFlow` 的消息和流特征发现攻击。`缓解器`通过筛选有害包保护网络。为了评估建议方法的效果，作者们使用了\
  \ `F1 score`、`精度`和`召回率`指标。\n\nKamel and Abdullah (2022) 构建了一种机器学习算法来识别恶意流量，以增强 SDN\
  \ 网络在面对攻击或侵入时的安全性和稳定性。在准备并预处理数据集后，采用了建议的进化决策树 (`EDT`) 方法将流量分类为良性和恶性。决策树方法的模型参数使用遗传算法\
  \ (`GA`) 进行了优化。作者使用 `DDOS-attack SDN` 数据集和若干性能指标（包括 `AUC` 和 `混淆矩阵`）来评估建议系统的实用性。\n\
  \n为了检测 SDN 中的网络入侵，Chaganti et al. (2023) 开发了基于长短期记忆 (`LSTM`) 的技术。他们使用两个特定的 SDN IoT\
  \ 数据集彻底分析了深度学习和机器学习模型的性能，并确保学习属性有助于识别和分类 SDN 中的 IoT 攻击。此外，在隐藏层中进行了基于 `t-分布随机邻域嵌入\
  \ (t-SNE)` 的特征提取。对建议技术的评估表明，该方法准确分类了攻击类型，并以 `0.971` 的准确率成功区分了攻击。\n\n为了识别网络流量是正常还是入侵，Jose\
  \ et al. (2022) 为 SDN 开发了基于机器学习的 `IDS`。为此，他们使用基于`随机森林`的分类器进行多分类分类。在分类过程之前，使用 `灰狼优化`\
  \ 算法从输入数据中提取了显著特征。还使用基于`自动编码器`的降维方法探索了特征空间的紧凑表示。实施了最近发布的 `InSDN` 数据集并与现有技术进行对比以评估性能。\n\
  \nRavi et al. (2022) 了一种基于深度学习的方法来检测入侵并根据其类型进行分类。为此，他们首先使用基于`门控循环单元`的技术对输入数据进行特征提取。此外，利用`核主成分分析`来选择最佳属性。最后，将所选特征组合并发送到`全连接网络`进行攻击分类。为了评估建议技术的性能，作者使用了\
  \ `fl-score`、`召回率`、`精度`和`准确率`约束，并将结果与现有方法进行了对比。\n\n## 建议的方法\n\n建议框架的功能被分为以下五个阶段：预处理、`数据增强`、特征提取、`DDoS\
  \ 检测与分类`以及`DDoS 缓解`阶段。为了首先提高原始输入数据的质量，使用了许多预处理技术。然后使用`条件生成对抗网络 (CGAN)` 进行过采样，以增加少数类样本并解决数据不平衡问题。随后，利用\
  \ `mobileNetV3` 和 `LeNet-5` 执行特征提取和分类以识别 `DDoS`。最后，系统框架如图 1 所示。\n\n![Fig. 1](img/fig23_1)\n\
  \n### 1.1. 预处理\n\n### 预处理\n\n在向分类器提供数据之前，我们必须对其进行预处理以简化操作。因此，从数据集中删除了缺失 (`nan`)\
  \ 和 `infinity` 值。其次，删除了网络的`IP 地址`、`MAC 地址`以及`协议类型`。使用 `L2` 标准对数据进行归一化。数据集属性由由公式描述，其中\
  \ `x` 代表每个实例。\n\n```math\n\\parallel x \\parallel_{2} = \\sqrt{\\underset{n = 1}{\\\
  sum^{}}}\\left| x_{i} \\right|^{2}}\n```\n\n(1)\n\n数据集记录归一化后，训练通常会快得多。这种归一化通过处理广泛的属性生成了更精确的模型。\n\
  \n## 数据增强\n\n该部分使用`条件生成对抗网络 (CGAN)` 方法创建与原始数据相似的增强数据集。`CGAN` 采用与 `GAN` 相同的训练过程，但对生成的样本带有限制。该结构有两个部分。它们是判别器\
  \ (`D[s]`) 和生成器 (`G[R]`) 网络。这两个网络在人工生成过程中竞争。\n\n(2)\n\n在方程 (2) 和 (3) 中，`b[r]` 表示来自\
  \ `G[R]` 网络的变量输入，`Ds` 代表 `D[s]` 网络预测原始数据“a”的概率。判别器的总损失可以通过积分和最大化上述方程来计算。因为判别器的目标是准确区分真伪样本。\n\
  \n```math\nL^*((D[s])) = maxlog(D[s) + log(1−Ds))]\n```\n\n(4)\n\n与判别器相反，生成器的损失函数表示为：\n\
  \n```math\nL^*((G[R])) = minlog(D[s) + log(1−Ds)]]\n```\n\n(5)\n\n考虑到整个数据集，方程指定了值函数\
  \ `V(G[R], D[s])`。\n\n(6)\n\n\n\n\n\n$$\\begin{matrix} {\\\\min\\limits\\_{G\\_{R}}\\\
  \\max\\\\limits\\_{D\\_{S}}V\\\\left( {G\\_{R},D\\_{S}} \\right) = \\\\min\\limits\\\
  _{G\\_{R}}\\\\max\\\\limits\\_{D\\_{S}}\\\\left( {E\\_{a \\sim P\\_{datat~(a)}}\\\
  \\left\\\\lbrack {\\\\log D\\_{S}(a)} \\\\right\\\\rbrack} \\right.} \\\\\\\\ {+\
  \ \\left( {E\\_{b\\_{r} \\\\sim P\\_{Pata~{(b\\_{r})}}}\\\\left\\\\lbrack {\\\\\
  log\\\\left( {1 - DS\\\\left( {G\\_{R}\\\\left( b\\_{r} \\\\right)} \\\\right)}\
  \ \\\\right\\\\rbrack} \\\\right.} \\\\\\\\ \\\\end{matrix}$$\n\n在这种情况下，`E[a data(a)]`\
  \ 表示原始数据样本的估计收益，Eb[r] ~data(b[r])` 表示生成器的数据分布，P[data(a)]` 表示真实数据分布。完全随机输入（假数据）的估计收益表示为\
  \ `Eb[r]~[P]data(b[r])`。生成器网络使用转置卷积层对输入特征向量进行上采样。使用了一系列具有不同通道数的转置卷积层，包括 64、128、256\
  \ 和 512。每一层的块表示输入特征向量的维度。\n\n最后，该模型产生的样本结构与输入数据相似。\n\n## 基于 MobileNetV3 的特征提取\n\n\
  在本节中，应用了基于 MobileNetV3 的特征提取技术从预处理的数据中提取显著特征。该架构由多个瓶颈组件组成。该系统中的一个瓶颈组件是残差结构框架。在传统的瓶颈框架中，特征提取只有一条路径；但在我们的技术中，特征提取有两个路径。这被称为部分残差结构（partial\
  \ residual structure）。该结构用于减少残差框架的计算开销。\n\n在 MobileNetV3 中，利用了 sigmoid 函数的改进版本——硬\
  \ swish (`hswish`)。它减少了网络的大小、复杂性和训练参数。该激活函数如公式所示。\n\n(7)\n\n```\nhswish(x) = x.*σ(x)\n\
  ```\n\n(8)\n\n```\n\\sigma(x) = \\frac{ReLU6(x + 3)}{6}\n```\n\n这里的分段线性复模拟函数由 `a(x)`\
  \ 表示。\n\n在这种部分残差结构中，瓶颈块的输入特征图被分为两个相等的部分，分别作为路径 1 和路径 2 的输入。在路径 1 中，输入的显著特征通过卷积层（1*1\
  \ 卷积大小）、深度卷积层（3*3 卷积大小）和再次的 1*1 卷积层进行提取。残差学习部分的结果通过捷径连接（shortcut connection）直接连接到另一个路径。同样，在路径\
  \ 2 中，通过卷积层（1*1 卷积大小）、深度卷积层（5*5 卷积大小）和 1*1 卷积层从输入中提取属性。最后，这两种路径的输出通过过渡层进行拼接。该过渡层包括批归一化层\
  \ (`BN`）、1*1 点卷积卷积核以及用于特征图融合的 `hswish` 激活函数。我们在第一个和最后一个 Mobile 模块的 3*3 和 PS 卷积中加入了空洞卷积。空洞卷积扩大了感受野并增强了信息提取。为了减少融合过程中信息的损失，模块之间引入了跨层连接。\n\
  \n### 改进的基于 LeNet-5 的分类\n\n对于分类，LeNet-5 网络接收来自 MobileNetV3 网络的特征图。LeNet 是一种健壮且易于使用的算法。此外，它增加了实时执行的机会并降低了结构复杂性。总而言，LeNet-5\
  \ 有八个层。它们包括一个输入层、两个卷积层、两个全连接层、两个下采样层和一个输出层。该网络的下采样层充当池化层。\n\n\n\n\n本节研究了 SDN 仿真框架中\
  \ DDoS 入侵检测机制的有效性。仿真实验使用 `TensorFlow` 的 `Keras` 框架和 `Python` 语言进行，内存为 24 GB。使用的处理器是\
  \ `Intel i5-6300` 核心，操作系统为 `Windows 10`。此外，使用 `NVIDIA GTX 960` 显卡加速。使用 `Mininet`\
  \ 构建了具有 14 个交换机的拓扑结构。控制器的选择对于模拟 SDN 网络至关重要。为了确认网络连接的主机已激活，发送了 `ICMP ping` 包。分析显示，80%\
  \ 的实验数据用于训练，20% 用于测试。在整个训练阶段，默认学习率设置为 `0.001`。激活函数设置为 `ReLU`，epochs 数量设置为 `100`，优化器设置为\
  \ `Adam` 用于深度学习网络。\n\n## 数据集描述\n\n## InSDN 数据集\n都柏林大学（University College Dublin）于\
  \ 2020 年 9 月创建了新的数据集 `InSDN`。使用逻辑方法产生，该数据集包含了 `DoS`、`DDoS`、暴力攻击（Brute Force）、探测（Probe）、`U2R`、Web\
  \ 攻击（Web-Attack）以及机器人网络（BotNET）。此外，`InSDN` 数据集还包含了 `SSH`、`FTP`、`DNS`、`HTTP` 和 `HTTPS`\
  \ 等主要应用服务。该数据集模拟了真实的攻击场景，带有 83 个统计变量，包含 34939 条恶意流量。\n\n### CICIDS2017 数据集\n加拿大网络安全学院（Canadian\
  \ Institute of Cybersecurity）创建一个名为 `CICIDS2017` 的开源数据集。使用日期、源 IP 地址、协议和目的端口作为数据集的标签。原始网络流量特征存在于此数据，它是在五天内收集的，包含\
  \ 830,743 条 `CSV` 文件中的入侵流量和监控流量。该数据集包含了多种类型的攻击，包括 `DDoS`、`DoS`、`SSH`、暴力攻击、机器人网络（botnet）、渗透漏洞（Heartbleed）和网络攻击。\n\
  \n### 评估指标\n常用的性能指标如 `F-score`、召回率（recall）、精确率（precision）和准确率（accuracy）用于评估模型性能。这些指标通过公式\
  \ (14)-(17) 计算：\n\n(14)\n$$Accuracy~ = \\frac{tr_{p} + tr_{n}}$$\n\n(15)\n$$Precision~\
  \ = \\frac{tr_{p}}{tr_{p} + fl_{p}}$$\n\n(16)\n$${Recall~ = \\frac{tr_{p}}{tr_{p}\
  \ + fl_{n}}$$\n\n(17)\n$$~F1 - score~ = 2 \\times \\frac{~precision~ \\times ~recall~}{~precision~\
  \ + ~recall}}$$\n\n在这里，真阴性 (`trn`) 和真正性 (`trp`) 表示预测准确的值，而假阴性 (`fln`) 和假正性 (`flp`)\
  \ 表示分类错误的情形。\n\n## 结果与讨论\n\n### InSDN 数据集上的性能分析\n这部分讨论了所提技术在 `InSDN` 数据集上的有效性。`InSDN`\
  \ 数据集的多分类推荐策略性能所示 表 1 和 图 2。从图表中可以看出，所提方法对于正常（normal）、`DDoS`、`DoS` 和探测（probe）类的预测性能最佳。然而，在\
  \ `U2R` 和 Web 攻击类中，所提技术的性能略低于其他类别。由于这些攻击与常规流量的相似度很高，且攻击者合法访问了目标系统。因此，在防御相应的决策边界时，学习分类器可能会受到限制。\n\
