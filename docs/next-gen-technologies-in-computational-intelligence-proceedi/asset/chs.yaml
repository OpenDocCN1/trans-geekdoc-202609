  \ Agrawal,^(²²)\n\n通讯作者邮箱：\\*biji.cl@vit.ac.in\n\nDOI: [10.1201/9781003430452-26](https://dx.doi.org/10.1201/9781003430452-26)\n\
  \n## 摘要\n\n本文尝试研究通过图像分析开发麻风筛查方法。麻风的传统诊断通常基于临床评估，具有高度的主观性。皮肤涂片用于筛查麻风患者。实验室人员利用涂片获取形态信息（如分杆菌的形状和簇），以便对疾病严重程度进行分级。检查过程耗时且需要专业的技术人员，特别是当细菌载量低甚至呈阴性时，因为整个包含约\
  \ 500 个视野的涂片中每个视野的分杆菌很少。因此，设计了图像处理流程来检测并计数`Mycobacterium leprae`。该流程涉及两种方法：(i) 通过阈值化的目标检测和(ii)\
  \ 基于滤波的轮廓检测。最后，利用生成的掩码或轮廓计数`Mycobacterium leprae`，以报告分杆菌的存在与以及疾病的严重程度。\n\n关键词：麻风筛查、阈值化、分割、轮廓提取\n\
  \n# 引言\n\n由`Mycobacterium leprae`（`M. leprae`）引起的麻风是一种进展性细菌感染，但是可以治愈的（Domachowske,\
  \ 2019）。尽管在世界卫生组织引入多药物疗法（MDT）方案后，该疾病的流行率显著下降（WHO Expert Committee on Leprosy, 1998），但发病率仍然令人担忧。尽管医学科学各领域取得了进展，但最近报告印度多个州的发病率很高。根据国家麻风控制计划（NLEP）的统计数据显示，印度部分地区\
  \ 76%的新发麻风病例包括 1 至 18 岁的儿童。根据 NLEP 对所有州的报告，记录中总共有 57,672 例麻风病例。NLEP 的统计数据显示，印度部分地区\
  \ 76%的新发麻风病例包括 1 至 18 岁的儿童。根据 NLEP 对所有州的报告，截至 2021 年报告，记录中总共有 57,672 例麻风病例。\n\n\
  图 1. 印度收集的麻风统计\n\nNLEP 报告\n\n图 1. 印度收集的麻风统计 2021。\n\n![图 1. 印度收集的麻风统计](img/fig26_1.jpg)\n\
  \n图 1. 印度收集的麻风统计\n\n麻风主要影响皮肤和周围神经，如果不治疗会导致畸形和残疾。麻风在世界许多地方仍然是一个公共卫生挑战，特别是在医疗服务有限的发展中国家。早期发现麻风对于有效治疗和预防残疾至关重要。然而，传统的麻风诊断方法通常耗时且需要专业培训，导致诊断和治疗延迟。图像分析方法已成为一种有前景的数字微生物评估工具（Rao\
  \ & Suneetha, 2018;Ferrari et al., 2017）。麻风是可以治愈的疾病，早期发现可以减少疾病传播。正如报告和所示，AI 技术可以帮助卫生人员使用专业应用程序（Steyve\
  \ et al., 2022）。利用皮肤涂片图像进行麻风分析是改善麻风诊断和患者管理的有效方法。计算机视觉算法可以分析这些图像，并为病理学家提供辅助信息（Cui\
  \ & Zhang, 2021）。此外，这种方法可以提供疾病进展、治疗反应和疾病控制的见，有助于个性化患者管理和公共卫生干预（Caie et al., 2021）。计算模型允许实验室人员在最佳时间内进行更有效的诊断。大量的实验室工作尚未为临床不明显疾病的早期诊断产生任何工具。本研究的主要目标是开发麻风筛查方法，以增加大型诊断中心的可及性。研究空白在于开发一种更便宜、更易获取且能够在贫困地区低成本分布的筛查系统。医学专家利用医学图像分析作为检测疾病的工具。此外，它增强了疾病的早期发现和诊断，有助于提供高质量的医疗保健。实验室人员在皮肤涂片中寻找`M.\
  \ leprae`的数量。该测试涉及从小皮肤切口提取组织液并进行染色。他们寻找抗酸杆菌，这些菌在蓝色背景上呈现为细的粉红色杆状。\n\n\n\n\n涂片图像的自动化是一线工作人员关注的重点，因为这项工作既耗时又费力。目前已引入了几种图像处理技术来实现上述任务。卷积神经网络（`CNN`）利用了自动学习图像特征特性的优势，只需提供足够的图像样本即可学习。(Panicker\
  \ et al., 2018) 通过学习杆菌的特征，利用 `CNN` 从涂片图像中检测结核杆菌。在预处理后，对单个分块的杆菌使用 `CNN` 进行训练，并实现了\
  \ `97.13%` 的检测灵敏度。\n\n几何特征和形状描述符可以在确定含有杆菌的区域方面提供准确的结果。该方法的应用包括分离显微数字结核切片中重叠的杆菌(Priya\
  \ Srinivasan, 2015)）。可以通过形状和颜色特征识别细菌。`K-means` 聚类被认为是一种聚类相似项的高效算法（Forero et al.,\
  \ 2004）。然而，这些算法受到图像中碎片和蓝色背景引起的离群值的限制。\n\n细菌计数指示了患者涂片中麻风分杆菌的总数。该计数用于对麻风的存在进行分级。研究还提出了一种类似的应用，使用轮廓分析、尺寸和纹理特征对血涂涂片图像中的白细胞计数进行计数（Ghosh\
  \ et al., 2016）。在本文中，杆菌计数是通过轮廓检测完成的，并与阈值分割机制进行了比较。这些方法性能的计算是基于纯度计算得出的。\n\n## 方法论\n\
  \n本研究的数据收集自位于 Vellore 的 Schieffelin 健康学院——研究与麻风中心（Research & Leprosy Centre）。实验室部门收集了\
  \ 44 组回顾性数据。对所有皮肤玻片进行了筛选，并在油镜物视野下计算了细菌学指数。它根据 Ridley 对数标度法从 `0` 到 `6+` 进行分级（Jopling\
  \ & McDougall, 2005）。\n\n如果未发现杆菌，则整个涂片为阴性，否则为阳性并分级。如果是麻风，识别为阳性的皮肤涂片可以根据其临床特征和皮肤病变的数量分为不同的类别。\n\
  \n- `3+` 类别指“多杆菌型”麻风，意味着皮肤涂片中存在大量细菌。在此类别下，可能存在大量、巨大且对称的症状，并伴有程度的麻木或感觉丧失。\n- `4+`\
  \ 类别同样指多杆菌型麻风，但症状更严重。皮肤涂片可能更广泛，涉及面部、四肢和躯干。神经可能会增厚，患者可能会明显的麻木或感觉丧失。\n- `5+` 类别指一种被称为“边缘麻风型”麻风的严重形式。皮肤涂片中的细菌可能非常多且广泛，伴有显著的麻木或感觉丧失。患者皮肤可能出现结节，神经增厚。\n\
  - `6+` 类别指最严重的麻风形式，被称为“麻风型”麻风。皮肤涂片可能很广泛，皮肤上有结节和斑块。神经可能会显著增厚，导致感觉丧失和肌肉无力。\n\n其他器官也可能受到影响，导致系统症状。本研究的数据收集自位于\
  \ Vellore 的 Schieffelin 健康学院——研究与麻风中心（Research & Leprosy Centre）。实验室部门收集了 44 组回顾性数据。对所有皮肤玻片进行了筛选，并在油镜物视野下计算了细菌学指数。它根据\
  \ Ridley 对数标度法从 `0` 到 `6+` 进行分级（Jopling & McDougall, 2005）。\n\n如果未发现杆菌，则整个涂片为阴性，否则为阳性并分级。如果是麻风，识别为阳性的皮肤涂片可以根据其临床特征和皮肤病变的数量分为不同的类别。\n\
  \n### 全局分割\n\n涂片图像首先通过应用标准进行预处理，然后进行阈值计算。该算法使用两个步骤来识别区域。皮肤涂片可能广泛，皮肤上有结节和斑块。神经可能会增厚，导致感觉丧失和肌肉无力。其他器官也可能受到影响，导致系统症状。本研究的数据收集自位于\
  \ Vellore 的 Schieffelin 健康学院——研究与麻风中心（Research & Leprosy Centre）。实验室部门收集了 44 组回顾性数据。对所有皮肤玻片进行了筛选，并在油镜物视野下计算了细菌学指数。它根据\
  \ Ridley 对数标度法从 `0` 到 `6+` 进行分级（Jopling & McDougall, 2005）。\n\n在研究中，采用的滤波器大小为 `3x3`。过滤后产生一个二值图。在接下来的阶段，将经过锐化处理彩色图像转换为灰度图。为了提取该区域，使用了与细菌形态学相关的\
  \ `canny` 边缘滤波器。`Canny` 算法使用一系列步骤来检测边缘，边缘被定义为图像中对比强度区域之间的边界。包含的这些步骤如图 2。\n\n在研究中，采用的滤波器大小为\
  \ `3x3`。过滤后产生一个二值图。在接下来的阶段，将经过锐化的彩色图像转换为灰度图。为了提取该区域，使用了与细菌形态学相关的 `canny` 边缘滤波器。`Canny`\
  \ 算法使用一系列步骤来检测边缘，边缘被定义为图像中对比强度区域之间的边界。\n\n```\nO(r,c) = \\left\\{ \\begin{matrix}\
  \ {255I(r,c) > thresh} \\\\ {0I(r,c) \\leq thr} \\end{matrix} \\right.\n```\n\n\
  ### 轮廓检测\n\n输入图像首先通过 `Laplacian` 滤波器。过滤通过与一个近似图像二阶导数的卷积卷积执行。这将感兴趣区域的边缘和角点锐化，同时抑制强度缓慢变化的区域。`Laplacian`\
  \ 滤波器可以使用不同的内核大小来实现，内核的大小将影响结果的降噪程度。\n\n1. **高斯平滑**：首先使用高斯滤波器对图像进行平滑，以减少噪声并去除高频信息。\n\
  2. **梯度计算**：然后在水平和垂直方向上计算平滑图像的梯度。这提供了强度变化率的信息。\n3. **非极大抑制**：接下来，算法识别梯度图像中的局部极大值，这对应于边缘。然而，并不是所有的极大值都是真实的边缘，因为某些可能是由噪声或其他因素引起的。非极大抑制步骤去除了梯度图像中的所有非极大值。\n\
  4. **双阈值化**：通过基于梯度设置阈值执行 Canny 边缘检测。\n5. **滞后边缘跟踪**：最后，算法执行滞后边缘跟踪，这涉及将强边缘连接成连续的轮廓，并抑制未连接到强边缘的弱边缘。\n\
  \n\n\n\nCanny 边缘检测的结果是一幅图像，它突出了图像中的边缘，同时抑制了噪声和其他无关信息。这在许多应用中非常有用，例如物体识别、图像分割和特征提取。在\
  \ Canny 边缘检测之后，对图像应用了膨胀（dilation），这在图像边界添加了像素，使其便于检测细菌菌落。内核的大小和形状可以调整以实现不同程度的膨胀。最后，我们对变换后的图像进行轮廓提取（contouring），这本质上为我们要寻找的细菌菌落添加边界，使得我们模型的计数变得简单。轮廓检测器由通用的分层区域树模式组成，用于从二值图像检索所有可能的轮廓，以及用于存储轮廓点的轮廓近似方法\n\
  \n## 结果与讨论\n\n所有的实验分析均使用 Python 语言结合收集的 44 张图片实现。如图 5 和 6 所示。从图中可以看出，轮廓处理的结果优于全局阈值分割法，后者可以完全分割前景和背景，并区分图中的目标物体，从而提供可靠的细菌计数。\n\
