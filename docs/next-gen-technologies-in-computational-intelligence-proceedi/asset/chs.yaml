  \ || 10 |\n\n均方误差是评估回归模型性能的主要指标。它计算了目标变量预测值与原始值之间的平均平方差。计算 MSE 的公式如下：\n\n(4)\n\n\
  ```$$MSE = \\\\frac{1}{n}\\\\underset{n}{\\\\overset{i = 1}{\\\\sum^{}}}{(y\\_{i}\
  \ - {\\\\hat{y}}\\_{i})}^{2}$$```\n\n其中 `n` 是数据点的总数，`y[i]` 是第 `i` 个数据点目标变量的实际值，`ŷ[i]`\
  \ 是第 `i` 个数据点目标变量的预测值。\n\n### 实现\n\n表 2 显示了三种不同大小的数据集以及每个包含的特征。训练每个数据集所需的时间以秒为单位。编码后数据的缩小尺寸所示。\n\
