  \ and Networking Technologies (ICCCNT), pp. 1-7. IEEE。\n\n# 一种基于引导滤波的多模态融合医学图像边缘保持混合模型\n\
  \nS. Sandhya,^(⁵⁵)\n\n电子邮件通讯作者：sanrsn@gmail.com, msen1982@gmail.com, profbcr@yahoo.com,\
  \ suseekannan07@gmail.com\n\nDOI: `10.1201/9781034304526`\n\n## 摘要\n\n通过整合多模态显著特征来生成质量的过程被认为是困难的。为了克服医学图像融合过程中的此类局限性，提出了一种混合模型。该混合模型使用基于轮波变换的`NSCT`结合对生成的两级频率成分进行`PCA`来提取最优分量。最后，在引导滤波的帮助下，边缘中的信息被保留在融合图像中。\n\
  \n关键词：医学图像融合；引导滤波；主成分分析；轮波变换；`NSCT`\n\n# 引言\n\n为了做出准确的医学诊断，临床专家需要通过多模态获取更多医学图像细节。CT、MRI、PET\
  \ 和光谱只是关注身体不同方面以提供关键信息的技术的示例（Bharath & Suganthi，2018）。所有模态都关注不同方面以提供广泛范围。由于医学成像模态的局限性，需要对多模态进行集成融合以生成单一融合图像，从而大幅提高临床诊断的准确性。为了这些目的，可以使用变换、神经网络、引导图像滤波和空间图像融合等图像融合技术。在像素级融合中，直接对图像像素进行操作以生成融合图像，这构成了融合的最低层次（Liu\
  \ 等，2018）。像素级图像融合已经是一个 30 多年的研究课题，产生了大量的科学文献。近年来，深度学习在各种计算机视觉和图像处理问题（包括数字摄影和多模态成像的图像融合）中取得了显著进展。在决策级，考虑通过局部决策产生器基于传感器图像特征级计算结果获得的概率决策信息。在特征级融合中（Huan\
  \ 等，2020;Rajalingam 等，2020），根据纹理、像素强度和边缘等信息从图像中提取显著特征。\n\n## 材料与方法\n\n\n\n\n文献研究表明，如\
  \ `DWT`（离散小波变换）、`CT`（轮廓变换）、`DCT`（离散余弦变换）、`ST`（剪切波变换）以及神经网络被广泛应用于图像融合过程。在 Ullah 等人，2020\
  \ 中，使用 `DTCWT` 结合 `SOFM` 执行融合过程。深度学习和卷积神经网络的概念在近年来变得日益重要（Ullah et al., 2020; Hossain\
  \ 等人， 2019; Liu 等人， 2017 a; Liu et al., 2017b）。当使用主成分分析进行图像融合时，其效果是适中且宁静的，但它面临着图像色彩失真的问题（Li\
  \ 等人， 2018）。图像低对比度融合是通过色彩空间变换技术完成的。使用基于金字塔的变换技术时无法获得关于方向的信息。基于稀疏表示的方法在构建字典的训练和优化阶段耗费大量时间。基于神经网络的方法依赖于相应调整参数来训练网络。非下采样剪切变换被用于\
  \ Xia 等人 (2020); Xi 等人 (2018)，其中源医学图像被分解为高、低两个频率层面的系数。然后，分别使用参数自适应脉冲耦合神经网络（`PAPCNN`）和卷积稀疏表示（`SR`）对高频系数和低频系数进行融合。在几年里，图像融合混合方法日益重要，因为它能产生高效且更好的结果（Kumar\
  \ 等人， 2018`）。模糊方法结合平稳小波变换用于 Yin 等人 (2019)，从而在显著的执行时间成本下执行了融合过程。DTCWT 技术结合高增强滤波被用于\
  \ Stephan 等人 (2020)，这保留了结果图像中的边缘信息。在 Li 等人 (2019); Liu 等人 (2017)中，利用 `NSST` 功能结合自适应神经脉冲技术整合医学图像。尽管有多种技术可以执行融合任务，图像噪声、边缘信息丢失以及低对比度图像等限制仍然存在。本文提出了一种混合技术，它包含了\
  \ `NCST` [19]、`PCA` 和引导滤波 Gao 等人 (2021); Li 等人 (2019)，以高效地执行多态医学图像融合。\n\n### 提议系统\n\
  \n`NSCT` 是一种基于轮廓的变换方法，用于将几何图像的效果视化化（Yin 等人，2019`）。轮廓变换是一种转换类技术，它在拉普拉斯金字塔和维度滤波器组上同时使用上采样和下采样器。一旦在高、低层生成频率分量，则使用主成分分析生成最佳系数以进一步处理，从而减少冗余（Zhu\
  \ 等人，2019）。`NSCT` 完全是一种多尺度、平移不变且多方向变换技术，它使用非下采样金字塔滤波器组（`NSS-PFB`）和非下采样方向滤波器组（`NSS-DFB`）来实现平移不变。`NSS-PFB`是一种基于平移不变滤波的结构，通过部署\
  \ 2 通非下采样二维滤波器组来保留 `NSCT` 的多尺度属性。`NSS-DFB` 是通过消除 2 通滤波器组中的上采样和下采样器制成的。主成分分析涉及将相关变量转换为若干不相关的变量。一旦形成系数，就会将其应用于融合规则。通过在平均、最大和最小值层级引入融合规则，生成组件及其相关细节的平均值，形成相应的融合规则。通过对使用\
  \ `NSCT` 构建的高频分量应用引导滤波，保留了图像的边缘细节。接下来，将 `NSCT` 的逆变换应用于整合的组件以获得融合图像，如图 1 所示。通过引导滤波保留图像中存在的边缘细节信息，并以第二个源图像作为引导来进行图像滤波处理以实现图像平滑。被视为引导的第二个源图像被称为引导图像。使用引导滤波的益处是它优于梯度反转伪影，并且对于保留最终融合图像的边缘信息是必要的，因为医学成像包含了噪声。\n\
  \n![图 1. 多态医学图像融合的提议混合模型](img/fig69_1.jpg)\n\n图 1. 多态医学图像融合的提议混合模型\n\n## 实验评估与讨论\n\
  \n为了获得 512×512 的结果图像，避免使用低对比度医学图像。为了评估提议的模型，考虑了 `CT` 和 `MRI` 图像作为源，来自哈佛医学院。使用 `MATLAB\
  \ R2017b` 在配备 `i7` CPU 和 4GB 内存的计算机上进行实验。指标如下：\n\n1. **标准差**：在传输过程中，它构成源图像以及噪声。高标准差值意味着高对比度。标准差在公式\
  \ (1) 中表示：\n```\nSTD = sqrt(1/ab * sum_{i=1}^a sum_{j=1}^b (Fij - MEAN)²)\nMEAN\
  \ = 1/ab * sum_{i=1}^a sum_{j=1}^b |Fij|\n```\n\n2. **空间频率**：使用空间频率测量图像空间的整个活动水平。空间频率越高意味着最终融合图像中的信息也越多，因此融合性能更好。空间频率由公式\
  \ (2) 定义：\n```\nSF = sqrt(RF² + CF²)\nRF = sqrt(1/ab * sum_{i=1}^a sum_{j=2}^b (Fij\
  \ - Fi(j-1))²)\nCF = sqrt(1/ab * sum_{j=1}^b sum_{i=2}^a (Fij - Fj(i-1))²)\n```\n\
  \n3. **熵**：使用熵测量融合图像中存在的内容水平。融合图像拥有丰富内容的信息，具有较高的熵值，由公式 (3) 给出：\n```\nEN = sum_{l=0}^{L-1}\
  \ pl log2(pl)\n```\nL 代表源图像中灰度强度的计数，`P[l]` 代表作为图像中概率值的第 `l` 个强度值。\n\n\n\n\n为了融合融合，分别对两组输入图像\
  \ `CT` 和 `MRI` 使用了 `PCA`、`NSCT`、`DWT`、`GIF` 进行处理。融合结果如图 2 和图 3 所示。\n\n所提出的多模态医学图像融合混合模型通过引入与\
  \ `NSCT`、`PCA` 等独立融合技术相比的指标进行了评估。混合融合模型的实验结果列在表 1 中，并将这些值与传统融合技术进行了对比。通过对比明显看出，所提出的系统在性能上更为优异。\n\
  \n### 表 1 所提多模态医学图像融合混合模型的对比结果 \n\n| 源图像 | 技术 | 熵 | 空间频率 | 标准差 |\n| --- | --- |\
  \ --- | --- | --- |\n| `MRI&CT` — 组-1 | `NSCT` | 0.9685 | 0.4459 | 26.412 |\n| `PCA`\
