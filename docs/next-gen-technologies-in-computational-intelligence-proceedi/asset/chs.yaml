  ![Fig 1. Framework of MMA](img/fig78_1_B.jpg)\n\n图 1. MMA 框架\n\n### 预处理\n\n在准备阶段，将对训练数据集和测试数据集进行首次归一化处理。为了使点权重系数选择技术成功，必须先对底层数据进行标准化。另一方面，与用于标准化的系统相比，检测率没有任何调整空间。\n\
