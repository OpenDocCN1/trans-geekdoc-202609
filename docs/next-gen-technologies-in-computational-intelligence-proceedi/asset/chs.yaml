  \n# MRI 图像脑肿瘤分割的深度学习模型\n\nKamani Praveena, Mopati Gowtham Reddy 和 S. Sathya Priya\n\
  \n印度钦纳伊，印度得斯坦技术与科学学院，计算机科学与工程系\n\n邮箱：praveena.kamani@gmail.com, mopatigowthamreddy@gmail.com\n\
  \nDOI: [10.1201/9781003430452-48](https://dx.doi.org/10.1201/9781003430452-48)\n\
  \n## 摘要\n\n从癌症诊断实验室产生的大量磁共振成像（MRI）图像中手动分割脑肿瘤是一项具有挑战性且耗力的工作。分割脑肿瘤是医学图像处理的必要步骤。脑肿瘤的早期诊断可以增加成功治疗的机会并提高生存率。所提出的方法分为三类：MRI\
  \ 图像预处理、数据增强和分割。`UNet`、`AlexNet` 和 `LeNet` 等模型没有数据增强，导致模型准确性降低。因此，在所提出的系统中，在 `CNN`\
  \ 和 `ResNet` 模型中包含了三种数据增强技术——裁剪（`Cropping`）、旋转（`Rotation`）和平移（`Shifting`），以提高准确性。在图像预处理阶段使用自适应滤波器来消除\
  \ MRI 图像中的噪声。为了可视化脑部肿瘤的存在，利用图像分割技术。还利用深度学习模型对不同类型的图像进行分类。因此，为了识别肿瘤，脑图像的分割变得必要。使用\
  \ `CNN` 和 `ResNet` 模型创建图像分割以解决当前问题，并通过利用数据增强提高了模型的准确性。将所提出的 `CNN` 方法与 `ResNet` 模型进行了比较。\n\
  \n关键词：深度学习，卷积神经网络，分割，全连接层，池化层和激活函数\n\n# 引言\n\n为了训练和优化复杂的模型，深度学习需要大量的数据和处理能力。此外，它还需要对超参数进行仔细调整，并对使用模型的道德影响进行批判性思考。因此，深度学习仍然是一个活跃的研究领域，具有巨大的增长和应用空间。大脑异常细胞或组织生长会导致脑肿瘤的形成。目前，尚不知道脑肿瘤的具体原因。为了维持患者的生命，`MRI`\
  \ 是一个关键工具。对于脑早期诊断，`MRI` 可以提高生存率。使用 `CNN` 模型进行的脑肿瘤预测可以帮助患者更快、更准确地接受治疗。现有系统如 `UNet`、`AlexNet`\
  \ 和 `LeNet` 分析需要大量时间，且不包含数据增强。因此，在所提出的系统中，在 `CNN` 和 `ResNet` 模型中包含了三种数据增强技术——裁剪（`Cropping`）、旋转（`Rotation`）和平移（`Shifting`），以提高准确性。\n\
  \n\n\n\n该模型由两部分组成。`ResNet-50` 深度迁移学习模型的特征提取技术实现在第一部分。本研究使用一个由两个医学脸掩膜数据集组成的单一数据集。通过\
  \ `Mean IoU` 确定了最佳锚框（anchor boxes）数量以改进目标检测过程。根据结果，作为检测器的 `Adam` 优化器具有最高的平均精确率（81%）（Aheli\
  \ Saha et al., 2019）。\n\n作者提出了一种新型多通路 `UNet`，将多模态磁共振图像划分为胶质瘤亚区域。还建议使用一个通用编码器，然后为每个类别使用不同的解码器，以替代分级区域的级联设计。模型对残差连接的使用使得性能更容易提高（Shehab\
  \ and Zhang, 2021）。为了克服 `DNN` 的梯度问题，作者提供了一种基于`深度残差网络`（`ResNet`）的脑肿瘤自动分割方法。`ResNet`\
  \ 比其 `DNNs` 更准确，并且可以加速训练过程。为了实现这一收益，`ResNets` 在卷积神经网络层并行的还有短路跳跃连接（skip-connection）。\n\
  \n## 材料与方法\n\n![Fig. 1. Proposed workflow diagram](img/fig48_1_B.jpg)\n\n图 1. 提出的工作流程图\n\
  \n`fig1` 中提出的方法是基于 `CNN` 的 MRI 分割，使用 `CNN` 模型从 MRI 图像中分割脑肿瘤。预处理和 `CNN` 分割是建议方法的关键阶段。在提出的系统\
  \ `Fig1` 中，收集大脑图像。进行数据处理以去除图像中的噪声。然后对图像进行训练和验证。模型在 `CNN` 上进行训练。应用 2D 图像数据增强。因此，提高了图像处理的准确性。这就是如何从脑组织中分割脑肿瘤的。\n\
  \n在提出的系统中，首先收集医学图像，然后根据出现的掩膜数量以及每个掩膜代表的内容对图像进行排序。下一步是通过图形化描述可视化数据，并使用名为 `数据增强` 的技术，通过旋转（Rotation）和位移（Shifting）等各种变换虚拟扩展数据集的大小。\n\
  \n1. **数据收集**：从 Kaggle 收集包含所有图像的数据集。根据出现的掩膜数量以及每个掩膜代表的内容对图像进行排序。在 `MRI` 扫描中，自动系统能够识别并准确定肿瘤的精确位置。\n\
  2. **数据可视化**：数据和信息的图形化描述称为数据可视化。这是一种易于理解和解释复杂数据通信的方式。数据可视化可以有多种形式，包括图表、图形、地图和信息图。数据可视化的常见示例包括折线图、柱状图、散点图、热图和气泡图。\n\
  3. **数据增强**：通过各种变换创建新样本，数据增强是机器学习和深度学习中一种方法，用于虚拟扩展训练数据集的大小。它通常用于计算机视觉应用，如图像识别，其中可用的训练示例数量有限。\n\
  \    - 随机旋转：通过随机角度旋转图像以创建一个新示例。\n    - 位移：向一个方向移动图像像素。\n4. **模型训练**：使用合适的优化算法在预处理的数据上进行模型训练。训练过程涉及训练集、验证集和测试集，并使用数据增强技术来提高模型性能。\n\
  \n![Fig. 2. CNN-Architecture](img/fig48_2_B.jpg)\n\n图 2. CNN 架构\n\n`CNNs` 由若干层组成，每一层在学习过程中都起到特定作用。总而言之，`CNNs`\
  \ 通过卷积层提取特征，通过 `ReLU` 层引入非线性，通过池化层缩小特征图尺寸，通过 `dropout` 层防止过拟合，并用全连接层做出最终分类决策。通过在深度学习架构中组合这些层，`CNNs`\
  \ 可以学习图像和视频数据中的复杂模式，并在各种识别任务中获得尖端性能。\n\n**算法**：\n\n输入：获取照片作为输入。\n\n输出：找到肿瘤作为输出。\n\
