  \n\n\n\n技术已经取得了飞猛的发展。物联网（IoT）将在未来先进信息物理系统（CPS）的设计中发挥关键作用，这些系统在很大程度上依赖无线传感器和执行器。通过使用现实案例以及如内部攻击和虚假数据注入等当前攻击手段，明确了如何通过关注此类系统性漏洞的关键安全关注点和特征来确保物联网和\
  \ CPS 的安全。为了开发和保障稳健的网络安全以发现并停止自动驾驶汽车（CAVs），我们的工作最后回顾了剩余问题、可能的研究领域以及其他自动化系统。本摘要概述了物联网和信息物理系统中无线通信的安全保障工作，并强调了实施安全的自动化连接系统加密策略，以及教育用户接受无线通信基础身份验证机制的重要性。每个用户都应该采取预防措施保护其个人信息，并减少黑客可以获取的数据量。\n\
  \n关键词：无线通信、物联网、信息物理系统、机器类型通信虚假数据注入攻击、DDoS 攻击。\n\n# 引言\n\n无线安全是指防止对使用无线网络的计算机和系统进行授权的访问或破坏；然而，无线网络的安全性有时会受到破坏。黑客甚至利用无线技术来侵入有线网络，因为他们发现无线网络非常容易渗透。因此，企业必须建立强大的无线安全程序，以防止对关键资源的未经授权访问。\n\
  \n使用强效且唯一的密码是非常重要的，并且应尽可能启用双重身份验证。\n\n在讨论物联网（IoT）时，确保无线传输的安全至关重要。这涉及防止跨无线网络传输的数据被未经授权的访问、拦截和篡改。在物联网中连接设备并实现设备之间以及与云之间的数据交换，无线通信是必须的。然而，使用无线通信会带来窃听、数据操纵和拒绝服务攻击等安全风险。\n\
  \n因此，这项提议的工作包括如何通过增强 CNN 技术克服物联网网络中的恶意软件攻击，并提出了一种用于检测物联网网络攻击的方案，但在此，我们尝试针对模型未训练过的攻击类型，其检测方法的可靠性。\n\
  \n此外，CAVs 是可以增强汽车基础设施并使统一交通系统更容易实施的技术，同时网络安全面临着持续的挑战。\n\n因此，这里通过 V2P 模式（自行车者）、V2V\
  \ 模式（车道管理和交通）为行人提供预防措施。\n\n## 文献综述\n\n[[1]](#ch64.xhtml#ref64_1)] 尽管连接自动驾驶汽车（CAVs）正迅速成为交通系统中改变游戏规则的创新，但其安全有效性受到网络攻击的严重威胁。为了建立网络攻击建立有效防御，CAVs\
  \ 使用传感器和通信网络来激活制动或转向动作并防止碰撞。为了防止网络攻击，网络安全团队实施并维护强大的信息安全系统，而取证团队则通过追踪和捕捉攻击者的数字足迹来调查黑客、确定其来源并恢复受损的数字数据。本文详细检查了针对\
  \ CAV 的可能网络攻击，包括针对汽车传感器、通信的攻击；检查了传统和基于 AI 的网络防御方法的有效性，并指出了未解决的问题和未来研究的方向。\n\n[[2]](#ch64.xhtml#ref64_2)]\
  \ 该研究解决了车载电子控制单元（ECUs）的缺陷，并提出了一种网络安全框架（CSEF）来评估 CAV 的网络安全。通过使用实车 `OBU`，该方法揭示了`assets`、`hazards`\
  \ 和 `vulnerabilities`。研究还探讨了现有框架和威胁建模技术的不足，并关注了基于 `SAE` 标准的安全性因素和四个评估阶段。\n\n[[3]](#ch64.xhtml#ref64_3)]\
  \ 研究讨论了信息物理系统（CPS）中的两个关键问题：使用可控制的攻击参数防止性能下降，以及识别和检测 CPS 攻击。提出的解决方案允许控制系统在可控的量级范围内发生性能下降，而不破坏系统，从而解决了第一个问题。所提出的攻击包括最不利攻击（`LFA`）和非线性输入攻击（`NIA`），并提出了相应的防御策略以应对这些攻击。第二个问题通过讨论许多\
  \ CPS 攻击类型（如 `DoS`、`SD` 和 `CPI`）来解决，以及此类攻击的可识别性和可检测性至关重要。通过假设卡方失效且对控制系统完全熟悉，研究给出了完美攻击能力的充分必要条件。文章使用马尔可夫决策过程模型来研究系统性能与安全性之间的权衡。\n\
  \n[[4]](#ch64.xhtml#ref64_4)] 提出的基于区块链的方法具有彻底改变物联网实现方式的潜力，因为它与 Web 服务结合，创建一个基于区块链的支持网页系统。每个安全哈希方法\
  \ 256（`SHA256`）区块包含 512 字节，并利用 Merkle-Damgard 结构获取 256 字节的哈希结果。哈希函数是单向的；因此无法从输出结果的值确定初始数据输入的值。区块链使用椭圆曲线加密（`ECC`）这种非对称加密方法来加密交易。为了加密和解密数据使用一对数学相关的密钥——公钥\
  \ `public key` 和未公开的私钥 `private key`。`private key`是一个难以破解的 256 位随机值，有 $2^{256}$\
  \ 个可能的私钥。\n\n\n\n\n5 该提议提出了一种基于 `CNN` 以及 `L1`、`L2` 的正则深度学习模型，以解决分类器模型中的过拟合问题。与传统的机器学习技术相比，建议的模型交付了更优的结果。使用\
  \ `BOT-IoT` 数据集测试了推荐的 `CNN` 模型针对未识别攻击的性能。当使用准确率、精确率、召回率、`F1-score` 和曲线下面积等多种标准评估推荐的\
  \ `DL` 策略的有效性时，`CNN` 模型在各个方面超过了传统的机器学习方法。该提议还研究了 `DL` 模型在有限特征集下的表现。\n\n6 该提议概述了一项关于网络物理系统中的安全权衡的研究，特别是植入式医疗设备（IMDs）。文章首先对网络物理系统及其面临的安全风险进行了概述，然后重点讨论了\
  \ IMDs 严格的安全标准以及保护其网络域方面面临的困难。该调查探讨了 IMDs 中安全性与可靠之间的冲突，并评估了寻求消除这种冲突的安全方案，这些方案通过实施访问控制策略，在危机期间放松限制，在正常情况下加强。工作的要点在结论中进行了总结，并列未解决的问题和潜在的未来研究方向。由于资源限制和不断变化的访问控制法规，针对植入式医疗设备（IMDs）建议的认证技术与计算机系统中使用的技术不同。一种想法建议使用隐形纹墨水在患者皮肤上打印预定义的秘密密钥，并将其存储在\
  \ IMD 中。另一种想法是将加密密钥放在可能佩戴在体外的手链上。\n\n## 方法与技术\n\n1 论文使用的技术和算法：\n\n### 安全标准\n`ISO/SAE\
  \ 21434`: `ISO/SAE 21434` 标准涉及系统、组件软件以及与外部设备或网络的连接，为将网络安全集成到道路车辆设计中提供了一种定义的程序。该标准非常强调网络安全的基础，包括跨多个业务领域（包括产品开发、制造、运营和维护）的需求、程序和目标。收集了一个文本语料库。\n\
  \n一种兼顾主动性和反应性的数字取证调查系统功能程序\n\n### 基于 AI 的解决方案\n连接自动驾驶车辆产生大量的传感器数据，可以使用机器学习算法进行处理以做出判断并降低风险。机器学习可以通过检查日志和模式来识别异常数据和恶意软件活动，特别是当与智能交通系统的数据结合时。应该使用机器学习来训练传感器数据算法，以提供有害活动的快速识别。\n\
  \n2 已经提出了多种策略，例如 `SAE J3061` 中提倡的 `TARA` 流程，这些策略专注于汽车的概念设计阶段，以控制与复杂车辆系统相关的重大危险和风险。`ISO/SAE\
  \ 21434` 标准提供了一个安全框架，用于指导现代汽车及其 `ECU` 在整个生命周期内的安全程序。虽然被广泛使用的软件 `EVITA` 和 `HEAVENS`\
  \ 提供了 `TARA` 架构，但缺少真实的威胁分析细节。\n\n![Fig. 1. 网络安全评估框架](img/fig64_1_C.jpg)\n\n图 1.\
  \ 网络安全评估框架\n\n### 时间成本\n多个变量包括攻击环境、目标对象信息收集、攻击工具开发、漏洞挖掘和验证，这些变量影响了攻击完成所需的时间。评估框架中采用了漏洞转换因子，其中\
  \ `S` 代表指标参数，`1` 和 `2` 代表权重系数，用于计算成功攻击的可能性。\n\n3 该研究提出了一种新的线性前向攻击。\n\n**LFA**: 它指的是几种不同的\
  \ `LFA` 设计目标。然而，有一种方法可以减少并减慢收敛过程。\n\n`LFA` 的防御基于处理它的不同方式；此外，还有一种分类为线性方法和非线性方法的重要方法论。\n\
  \n```\nMD=M−1(22)\n```\n\n在下一节中，他们描述了噪声注入攻击和防御方法。\n\n使用无限方差进行泛灌是在无任何限制的情况下引入噪声的最佳方法，但这并不实际。在注入大量噪声时注意到更为简单，因此带有功率限制的噪声注入更有趣。\n\
  \n## 噪声注入攻击的防御\n\n状态估计器的性能受到 `MA`（噪声注入攻击）的影响，它修改了测量噪声的统计特性。估计高斯噪声的最佳滤波器是 `Kalman\
  \ filter`。因此，可以通过将 `w` 更改为 `w+yf` 来创建 `Kalman filter`。\n\n```\nKalman Filter with\
  \ NIA = Kalman Filter with Σw + Σyf\n```\n\n4 该研究提出了一种基于区块链的技术来提高无线传感器网络（`WSNs`）的安全性。通过共识算法，`WSN`\
  \ 中的每个节点在与其他节点通信的同时维护区块链的副本。作者建议利用公有区块链来增加问责制和透明度。为了确定建议策略在现实情况下的实用性，还需要更多的调查和测试。\n\
  \n![Fig. 2. 提议的区块链技术](img/fig64_2_C.jpg)\n\n图 2. 提议的区块链技术\n\n## 系统融合算法\n\n这是根据个人标准通过自动分析和彻底的信息处理来实现的。多传感器数据融合的精度高于单传感器数据融合，相似传感器之间的冗余有助于降低不确定性。协作良好的传感器可以克服局限、提高可靠性，并在一个或多个传感器失效时仍保持正常运行。此外，可以使用子系统来减轻负载并产生全面的输出结果。\n\
  \n\n\n\n\n6 章 本研究讨论了被称为植入式医疗设备（`IMDs`）的信息物理系统，这种系统将医疗设备与网络计算系统相结合，以及它们的安全性权衡。作者研究了\
  \ `IMDs` 对网络攻击的可能易感性，包括未经授权访问患者数据、设备篡改以及可能导致致命的结果。他们提出了一个安全框架，权衡了各种安全措施（包括加密、身份验证和访问控制）的优缺点。\n\
  \n### WMTS（无线医疗遥测服务）\n\n美国联邦通信委员会（FCC）将该频谱设定为一项美国标准（`FCC`）。由于缺乏国际标准，该频谱目前仅在美国境内的\
  \ `IMDs` 使用。\n\n### 患者追踪\n具有无线通信能力的 `IMD` 的患者可以被快速找到，特别是当她处于开放区域时。因此，如果攻击者可以使用许多编程器，且患者与\
  \ `IMD` 的通信在编程器的范围内，攻击者就可以轻松地跟踪患者的移动。此外，在某些情况下（例如患有痴呆或阿尔茨海默症的人群），这甚至可能有用，但这构成了对隐私的严重侵犯。作者还考虑了安全性和可用性之间的权衡，因为过于复杂的安全措施可能会降低医疗治疗的效力。最终，文章强调了建立完善安全框架的必要性，在考虑\
  \ `IMDs` 特殊需求和特征的同时，权衡安全措施的优势与风险。\n\n## 结论\n\n第一项研究强调了对强大的网络安全措施的需求，以及连接自动驾驶汽车（`CAVs`）对攻击的脆弱性，我们通过后续的研究文章部分结束此。文章研究了\
  \ `CAVs` 可能遭受的网络攻击，评估了防御策略，并描述了最新的安全标准和流程。对于评估车载电子控制设备（`ECUs`）的网络安全，有一个网络安全评估框架（`CSEF`）。它涉及资产识别、受害者脆弱性分析、信息收集以及安全测试，可用于车辆的制造和评估阶段。在真实的车载\
  \ `OBU` 上应用了该方法，暴露了其缺点和风险。此外，来自 `IoT` 的发明涉及无线通信系统中处理 `CPS` 安全问题。为了消除未来对互联网系统的攻击（例如\
  \ `DDoS`、虚假数据注入攻击、远程命令执行、射频调试器等攻击），预防措施是必要的。\n\n## 参考文献\n\n1. P. Sharma and J. Gillanders\
