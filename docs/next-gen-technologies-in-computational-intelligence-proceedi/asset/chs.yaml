  \n2. H. Zhang, Y. Pan, Z. Lu, J. Wang, and Z. Liu (2021). 车载电子控制单元网络安全评估框架，在 `IEEE\
  \ Access`, 9, pp. 149690-149706, doi:[10.1109/ACCESS.2022.3213843](http://dx.doi.org/10.1109/ACCESS.2022.3213843).\n\
  \n3. J. Yang and A. Sung (2021). 信息物理系统的可控数据注入攻击，在 `IEEE Access`, 9, pp. 6721-6728,\
  \ doi:[10.1109/ACCESS.2021.304922](http://dx.doi.org/10.1109/ACCESS.2021.304922).\n\
