  \n图 2. 模型框架\n\n创建机器学习模型是加密货币勒索软件攻击的目标。通过对比监督算法并以最高准确率的形式预测结果，预测可能会取代可更新的监督机器学习分类模型。首要目标是识别加密货币勒索软件攻击。预测是一个针对已知攻击分类问题的机器学习解决方案。必须创建一个能够区分加密货币勒索软件攻击的模型。\n\
  \n它将揭示如何使用 Python 的 `scikit-learn` 构建一个测试用例，以比较多种机器学习方法。一贯地比较多个不同机器学习算法的性能至关重要。这可能是使用\
  \ Python 的 `scikit-learn` 创建测试用例以对比多种机器学习技术的最有效方法，并包含额外的、不同的算法进行比较。每个模型都将有不同的性能特征。通过使用\
  \ `cross-validation`（交叉验证）和其他重采样技术，你可以大致了解每个模型在未见过的数据上的准确性可能如何。必须能够根据这些估计从你生成的模型集中选出最佳模型。在处理新数据集时，使用多种可视化工具从不同角度查看它是一个好主意。模型选择是一个一贯的原则。在选择确定哪些机器学习算法时，你应该从多种方式检查算法的预测准确性。可以使用各种可视化技术来展示模型准确性的均值、方差和其他特征。\n\
