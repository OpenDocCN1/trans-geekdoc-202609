  \n## 摘要\n\n主性分析可以对论坛提供启发。妊娠性糖尿病（GDM）在年轻孕妇中变得普遍。为了分析公众心态、因果关系和传播意识，分析推文内容是有帮助的。方法与材料：系统使用推文抓取的语料库进行最佳拟合主题模型和相性调优。结果：LDA、CTM\
  \ 和吉布斯采样。主题间距离关系使用多维缩放绘制，相性得分通过调优优化到 70.8%。系统提供了有关身体活动控制措施、低血糖饮食、服用处方药以及叶酸含量导致 GDM\
  \ 的推断。结论：提出的工作展示了对 GDM 内容的主性分析，并对讨论提供了更好的推断。\n\n关键词：数据挖掘、妊娠性糖尿病、糖尿病、机器学习、预测、地理空间分析、等\n\
  \n# 引言\n\nGDM（妊娠性糖尿病）正成为中年妇女中更常见的短期疾病。诊断为 GDM 的妇女在未来 4-5 年内一直面临风险，尽管这是一种短期疾病。发现\
  \ GDM 影响了至少 10% 的孕妇。情感分析用于该系统，以尝试从推文中提取此类隐含信息，并对讨论的症状、预防措施进行治疗方法。根据这些知识，本研究利用开放社交网络内容（如\
  \ Twitter）分析人口健康，并利用意见、情感挖掘、主题建模、相性改进和主题间距离参数识别人们的心态和疾病特定内容。构建最佳拟合主题模型以正确推断实质是研究的重点。通过\
  \ MALLET 改进了主题模型的相性。本文结构如下：第 1 章引言，第 2 章文献和现有工作，第 3 章实验，以及第 4 章结论和未来工作。\n\n## 相关工作\n\
  \n本章总结了关于社交媒体文本内容分析的现有系统。\n\n\n\n\n\nHao Cui et al. (2021) 针对基于 COVID-19 的中国社交媒体研究提出了一项研究。他们利用新浪微博博客网站的内容进行分析。他们发现注意力存在衰减现象，这并不有助于发现政府在提高\
  \ COVID-19 疫情意识方面努力的影响。Sebastian Hermes et al. (2020) 曾建议一个模型来研究社交媒体对患者的影响（Cui &\
  \ Kertez, 2021; Hermes et al., 2020; Dyer & Kolic, 2020)）。与传统行业相比，社交媒体通过数据以及生成数据和内容的人来运作。行动者为医疗服务提供者创造价值的影响。文中讨论了组织的价值、价值的转化、价值的捕捉、过程的转变以及价值的交付（Ferretti\
  \ et al., 2019; Salas-Zarate et al., 2017; Singh et al., 2017）。Joel Dye 等人 (2010)\
  \ 提出了一项关于 Twitter 上对 COVID-19 风险感知情绪的研究。这项开放社交网络的研究基于一个假设，即 COVID-19 期间的死亡率与网民的关注度有关（Takabe,\
  \ 2016; Barnwal et al., 2016; Woo & Chen, 2016)）。进行了情感和语义分析。调查了词的共现情况。“死亡”是一个有趣的节点，具有许多共现术语。草拟了许多此类推理。该研究导致了主题模型和超参数调的使用，以改进非结构化文本内容的推理。\n\
  \n## 实验\n\n本节介绍了所提出的系统架构，以及图 1 中的结果与讨论。该工作在 Python 和 R Studio 中实现，使用了 TwitterR、Sentiment\
  \ 等包。分析大致分为下文所示的两个类别。\n\n![图 1. 提议系统](img/fig36_1_C.jpg)\n\n图 1. 提议系统\n\n1. 最佳拟合主题建模\n\
  \n2. 通过超参数调优提高连贯性\n\n## 最佳拟合主题建模\n\n主题建模的结果通过将隐含狄利克分布（Latent Dirichlet allocation）、相关主题模型（Correlated\
  \ Topic Model）和吉布斯采样（Gibbs Sampling）集成并创建一个最佳拟合来获取。主观性分析揭示了图 2 中关于妊娠糖尿病（GDM）以下问题的事实。\n\
  \n![图 2. GDM 推文中讨论的话题](img/fig36_2_B.jpg)\n\n图 2. GDM 推文中讨论的话题\n\n* 针对 GDM 的体力活动控制措施。\n\
  \n* 土豆导致 GDM 的风险\n\n## 提高主题可扩展性连贯性分数的超参数调优\n\n本工作使用的超参数是代表文档-主题密度的 alpha 以及代表主题-词密度的\
  \ Beta。在进行超参数调优后，对文本测量了连贯性、显著性和相关性参数。性能对比所示在表 1。一旦连贯性得分增加，内容的意义性也如表 2 所示增加。表 1.\
  \ 连贯性\n\n| 模型 | 连贯性 |\n| --- | --- |\n| LDA | 0.39 |\n| CDM | 0.55 |\n| Best Fit\
  \ of LDA, CDM, Gaussian Mixture | 0.708 |\n\n表 2. 可扩展性与连贯性得分\n\n| 主题数量 | 连贯性得分 |\n\
  | --- | --- |\n| 2 | 0.568 |\n| 8 | 0.691 |\n| 14 | 0.707 |\n| 20 | 0.719 |\n| 32\
  \ | 0.732 |\n| 38 | 0.726 |\n\n主题的可扩展性改进见表 2。随着主题数量的增加，连贯性也有增加。## 结论\n\n本文讨论了如何使用文本挖掘、主题建模和超参数对非结构化信息进行有用推理。\n\
  \n## 致谢\n\n这项研究工作是印度技术教育委员会（AICTE）资助的研究计划“使用智能手机进行糖尿病的预测与监测”的一部分。感谢 Rajalakshmi\
  \ 工程学院数据中心对我的研究的支持。\n\n## 参考文献\n\n1. Hao Cui et al. (2021),ch36.xhtml#ref36_1. (2021).\
