  \n假设代理人已经获取了用户消息 `M1`，第 2 步的目标是计算 `R1` 的值。以公式 `C11′` 作为此点的插说明。代理人将检查用户身份，以确定 `C11`\
  \ 和 `C11′` 是否相同。然后，代理人将选择第二个随机数并将其称为 `R2`，在执行计算 `C12 = GR2` 之前，得出 `Z R1 rp`，最后向所有者发送消息\
  \ `M2`。\n\n通过通信方法 `M2`，代理人让所有者知晓了情况。所有者确定 `C13` 在所有方面等同于 `GR3`。`R1 = Z rp`。计算完成后，所有者负责使用消息\
  \ `M3 = C13, X, C14` 与代理人进行通信。当 `X` 等于 `Sp (GR2 + rpG ‖ R3 ‖ T3]` 时，`C14` 等于 `R3\
  \ IDp`。\n\n在第 4 步中，代理人将通过给代理人和所有者的公共证书确定 `X′`。在代理人确认收到所有者发送的消息 `M3` 后，他们就可以进入第 4\
  \ 步。在第 4 步中，代理人将确定 `X′ = [Sp (GR2 + Grp ‖R3 ‖ T3`。当 `X` 等于 `X′` 时，代理人通过双重检查确保用户标识准确准确。在代理人完成所有必要的计算以确定\
  \ `B = GR3(s + rp)` 和 `W = R2 C8` 后，代理人接下来将通过发送消息 `M4 = W, B` 与所有者进行通信。\n\n代理人向所有者发送了消息\
  \ `M4`，针对这一事件执行了以下计算。所有者通过比较 `B` 和 `B'` 来确保它们是相同的。如果是这样，所有者将对代理人进行调查。所有者可以使用公式 `h\
  \ = (R1 (R2 ‖ R3))` 提取会话密钥，用作 `SK`。\n\n在第六步中，代理人确定会话密钥为 `h (R1 (R2 ‖ R3))`，`C15`\
  \ 为 `R3 rs`，`C16` 为 `R2 C4`，而 `Y` 为 `GR1 rs ‖ R2`，按优先级递减排列。将提醒用户注意 `M5 = Y` 以及 `C15\
  \ + C16`。\n\n用户执行必要的计算，以确定带有证书的 `R3` 和 `Y′`。在代理人给用户消息 5 后，发生了这一情况。如果密钥为 `(R1 (R2‖R3)`\
