  \n\n\n\n\n随着我们的世界变得日益互联并依赖技术，网络安全以及网络中数据的安全性已比以往任何时候都更加重要。本文将强调网络攻击的严重后果，特别是中间人（MITM）攻击，这些攻击会导致身份盗窃、财务损失、敏感数据泄露以及对关键基础设施的破坏。\n\
  \n一种常见的 MITM 攻击类型是 ARP 欺骗，它利用地址解析协议（`ARP`）中的漏洞将网络流量重定向到攻击者控制的机器。ARP 欺骗极具危害性，因为它可能被用于绕过防火墙和入侵检测系统等基本安全措施。在\
  \ ARP 欺骗期间，黑客向网络中注入恶意的伪造 ARP 包，导致受害者机器的 `ARP` 缓存更新为攻击者的 `MAC` 地址，而不是目标地点的实际 `MAC`\
  \ 地址。随后，受害者设备会将任何发往目的地的网络通信转发到攻击者的工作站，攻击者可以在将其传递到目标地之前进行拦截和处理。攻击者还可以利用 ARP 欺骗发动其他攻击，如会话劫持、DNS\
  \ 欺骗和网络侦察。\n\n文献中已经提出了多种检测和缓解方法，以避免和限制 ARP 欺骗的危险。本调查研究的目的是对现有的 ARP 欺骗检测和缓解研究提供全面的评估。本文将审查文献中的关键研究问题、方法和发现，以识别该领域的主要主题和趋势。\n\
  \n本调查论文由三部分组成。第一部分将简要介绍 `ARP` 以及 ARP 欺骗攻击的原理。第二部分将回顾现有的 ARP 欺骗检测和防御技术。本文将分析每种技术的优点和局限性，并识别该领域的主要趋势和挑战。最后一部分将强调现有研究的空白和局限性，并确定未来的研究方向。本文将讨论需要更全面、更整合的方法来检测和缓解\
  \ ARP 欺骗，以及开发能够抵抗演变攻击方法的新技术的重要性。通过对现有研究进行全面综述，本调查论文旨在对网络安全领域做出重大贡献。它对于希望进一步了解 ARP\
  \ 欺骗，并创建有效方法来防止和减少这种危险的研究人员、从业人员和政策制定者来说是一个巨大的资源。\n\n## 文献综述\n\n[1] Morsy & Nashat\
  \ (2022) 提出了一种名为 `D-ARP` 的新方法，用于检测中间人（MITM）中发生的 ARP 欺骗攻击。`D-ARP` 尝试通过在传输原始 `ARP`\
  \ 包的同时传输经密钥认证 `ARP` 包，在 ARP 查询和响应之间建立连接。每个主机都维护一个所有签名 `ARP` 包的日志文件。`D-ARP` 通过匹配注入的密钥来识别冲突或重复的\
  \ `MAC` 地址，从而检测 ARP 欺骗。为了提高可靠性并找到 MITM 攻击者的 `MAC` 地址，`D-ARP` 使用动态主机配置协议（`DHCP`）服务器\
  \ + `Nmap` 功能。此外，系统包含一个管理员模块，用于构建授权主机列表。根据实验结果，`D-ARP` 的误报率和漏报率为零，在识别和应对 ARP 欺骗攻击方面非常成功。结论是，`D-ARP`\
  \ 提供了一种可靠且有效的检测 ARP 欺骗攻击的方法。它在 ARP 请求和响应之间建立连接的能力，以及使用额外技术发现攻击者的能力，使其成为可靠的网络安全解决方案。\n\
  \n[2] 该文章描述了 Hijazi & Obaidat (2019) 提出的新方法，涉及在服务器端创建一个静态 IP-MAC 数据库，并使用可执行批文件自动收集和注册\
  \ IP-MAC 地址。所提方法的框架由七个步骤组成，确保了评估解决方案有效性的彻底且系统的方法。为了解决局域网中的 ARP 安全漏洞，作者创建了一个类似于代理服务器的\
  \ ARP，在实际网络测试期间收集每个连接设备的网协议、媒体访问控制地址以及设备类型信息。测试过程分为三个阶段：IP-MAC 收集、注册，以及使用类型方法实施识别和回避方法策略。测试程序分为三个阶段：IP-MAC\
  \ 收集、注册以及执行采用类型方法的识别和规避方法。在代理服务器上；建议的解决方案生成静态 IP-MAC 数据库并检测防止 ARP 攻击。实验结果表明，建议的算法成功识别并停止了\
  \ ARP 攻击，同时建立了安全网络环境。作者创建了一个 Visual Basic 程序来实现针对 ARP 欺骗和中毒攻击的检测和保护方法。该工具通过收集每个设备的\
  \ IP-MAC 并将其存储在可执行文件中来实现的。当在代理服务器上执行批文件时；IP-MAC 会被添加到服务器缓存表中。该应用程序还通过将 MAC 转换为 IP\
  \ 并与静态条目对比来启用 IP-MAC 检查。程序还具有阻止和删除 IP-MAC 记录的能力，以防止非法连接访问。总体而言，提出的方法提供了一种处理客户端/服务器场景下\
  \ ARP 安全问题的实用技术。\n\n[3] Tian 等人 (2017) 分别针对 IPv4 和 IPv6 网络通信中地址解析协议（`ARP`）和邻居发现协议（`NDP`）相关的漏洞提供了一种解决方案。ARP\
  \ 和 NDP 遭受多年来已发现并报告的欺骗和其他安全漏洞。以前保护这些协议的尝试涉及修改基础协议，但这并不总是可行的。作者提供了 `ARPsec`，这是一种稳定的\
  \ ARP/RARP 协议套，它包含一个使用逻辑推理构建的地址绑定仓库，允许对目标机器的身份进行永久评估。该形式化逻辑围绕一组运行规则和特征构建，这些规则旨在不修改底层协议而提供提供安全的地址解析。在需要时，作者使用可信平台模块（`TPM`）来补充逻辑证明器得出的保证，`TPM`\
  \ 是大多数现代计算机中常见的通用组件。通过 TPM 辅助的系统状态证明可以以较低的计算成本获得，并且该策略增强了作者之前的工作以适应 IPv6 NDP (`ndpsec`)。\n\
  \n\n\n\n\nO. Salem, K. Alsubhi, A. Shaafi, M. Gheryani, A. Mehaoua 和 R. Boutaba\
  \ 提供了一个框架，用于缓解远程监控系统中的中间人攻击（`MitM`），在这些系统中传感器数据大多处于正常。在触发警告之前，数据会由`本地处理单元`（`LPU`）进行分析，以检测重要的数值变化。传感器仅通信采集数据的签名，以防止\
  \ `MitM` 获取机密信息。为了保持测量之间的距离，`LPU` 的变化检测采用了数据签名。所提的方法（Salem 等人，2022）使用`局部敏感哈希`（`LSH`）来建立不可逆的的数据签名，并防止攻击者推断或访问私有数据。`LSH`\
  \ 是一种高维向量哈希算法，允许相关向量映射到同一个哈希值。通过将 `LSH` 应用于采集的数据，可以形成小得多的签名并从传感器传输到 `LPU`，从而显著减小数据包大小，并减少数据传输所需的能量。为了防止修改攻击，还会随文本传输一个`密钥消息认证码`（`HMAC`）。密钥的初始值源于`信号强度指示`（`RSSI`），它被广泛用于`低功耗蓝牙`（`BLE`）室内定位。`RSSI`\
  \ 受连接设备距离的影响，且 `MitM` 无法部署在传感器的精确附近。\n\nAkter 等人（2021）提出的架构包含三个重要组件。第一个组件是带有天线的`NFC\
  \ 罩`，随后是带有`ATmega328 CPU`的`Arduino Uno`板，最后是被动卡片。`MITM` 需要插入在`读器`和原始设备之间。为了划分空间，`读器`和`写入器`之间使用了铝箔以防止无线信号冲突。三个活动组件和一个被动设备排列成`活动-被动-活动`的布局，提供`读器-写入器-卡片`。本文研究了针对非接触系统的中间人（`MITM`）攻击，该攻击利用了卡片认证与交易授权分离的缺陷。`MITM`\
  \ 攻击者由三个部分组成：`读器`、`写入器`和`卡片`。攻击者劫持了`卡片`和`读器`之间的交互，根据需要更改消息并将其传输到`写入器`，由`写入器`将信息写入`卡片`。攻击者控制路由，使得原始读器无法识别传输过程中的任何通道切换。支付信息、挑战回复和个人信息都可以被攻击者更改。\n\
  \nAldabbas & Amin (2021) 提出利用执行自定义代码的 PC 或笔记本电脑在 IoT 环境中自动检测和缓解 ARP 攻击的机制。`SDN 控制`保留网络拓扑数据以及`控制器\
  \ ARP 表`（`CAT`）。为了分析恶意流量，在机器设计期间从控制器和`动态主机协议`（`DHCP`）服务器收集网络拓扑数据。一旦 ARP 信息产生于此控制器，将由不同的机器处理；随后端口被锁定，因此控制器上不再发生后续操作。这种新型系统由三个主要部分组成。所提方法的第一个组件从整个网络收集网络拓扑信息。其余部分负责在连接设备上配置转发规则，将所有\
  \ ARP 流量路由到单独的工作站。最后一个组件包括流量分析和 ARP 欺骗规避。使用基于 `SDN` 的 IoT 专用仿真进行了若干实验，以评估所建议系统的有效性。实验在具有六核心和\
  \ 8GB 内存的 `Ubuntu 虚拟机`以及一个具有 16GB 内存的虚拟化程序服务器上进行。`Mininet` 似乎是一种流行的基于 `SDN` 的仿真工具。该应用用于为不同的\
  \ `Pox SDN 控制`检查建立虚拟化设置。为了缓解攻击场景，所建议的服务器充当 `SDN 控制`和连接节点之间的桥接。地址翻译查询发送到此服务器，服务器使用识别攻击状态的特殊方法对网络流量进行分析。当网络受到攻击时，将实施适当的保护措施并确定黑客在网络中的位置。进行了多次测试以评估建议系统的有效性，并确定该技术在攻击检测和缓解方面表现更好。\n\
  \n## Go\n\nMorsy & Nashat（2022）的研究提供了一种检测 ARP 欺骗攻击的异常方法。根据作者介绍，他们的技术可以在不产生误报或漏报的情况下识别并阻止这些攻击。`D-ARP`\
  \ 通过在发送原始 ARP 包的同时发送带签名的 ARP 包，在 ARP 查询和答案之间建立链路。`D-ARP` 通过比较注入的密钥来定位冲突或重复的 MAC\
  \ 地址以检测 ARP 欺骗，并且主机记录所有签名的 ARP 包。`DHCP 服务器`和 `nmap` 也被用于发现害者的 MAC 地址，以及一个用于构建授权主机列表的管理员模块。然而，这项工作可能受益于对所提策略缺陷进行更彻底的评估。例如，作者没有提到\
  \ `D-ARP` 对网络性能的影响，或在复杂网络拓扑场景下的误报和漏报风险。此外，作者应该调查攻击者通过部署先进 ARP 欺骗技术来规避描述方法的可能性。其他识别攻击者的工具（如\
  \ `DHCP` 和 `nmap`）进一步提高了该方法的可靠性。总体而言，文章了一种检测 ARP 欺骗攻击的潜在新方法，但需要进一步研究以评估其在不同网络情况和针对更先进攻击策略时的有效性。\n\
  \nHijazi & Obaidat (2019) 通过在代理服务器上构建静态 `IP-MAC` 数据库并使用可执行批处理文件自动 `IP-MAC` 地址的收集和注册，解决客户端/服务器情况下的\
  \ ARP 安全漏洞。所提方法的架构（Hijazi & Obaidat, 2019）包含七个阶段，确保了评估解决方案效性的完整且系统的方法。测试程序分为三个阶段：`IP-MAC`\
  \ 收集、注册以及采用类型机制执行检测和预防方法。实验结果显示，建议的解决方案成功识别并防止了 ARP 攻击，同时提供了安全的网络环境。为部署 ARP 欺骗和中毒威胁的检测及缓解方案创建的\
  \ `Visual Basic` 计划具有易于使用的界面，允许自动收集 `IP-MAC`、在服务器缓存表中注册 `IP-MAC` 以及对 `IP-MAC` 条目进行验证和更改。所建议的方法为确保网络免受\
  \ ARP 欺骗和中毒攻击提供了深层解决方案，使其成为网络管理员管理网络的一种实用且可靠的方法。虽然所建议的解决方案在识别和停止 ARP 攻击方面非常成功，但对于较大的网络可能存在扩展性限制，可以在未来的研究中进行进一步研究。\n\
  \n\n\n\nTian 等人（2017）分别为 IPv4 和 IPv6 网络通信中的地址解析协议（ARP）和邻居发现协议（NDP）漏洞提供了解决方案。该研究为\
  \ ARP 和 NDP 协议问题提供了一种创新且有效的解决方案，且无需更改协议本身。对于当前的计算机系统，结合 TPM 使用形式逻辑可以提供极佳的安全保障，既具有成本效益又具有实用性。该文章关注了一个长期以来一直被发现并公开的严重安全问题。ARP\
  \ 和 NDP 在现代网络中被广泛使用，但它们容易受到欺骗攻击和其他安全漏洞的影响，使其成为攻击者的潜在目标。过去保护这些协议的尝试需要修改底层协议，而这并非总是可行的。作者建议了一种稳定的\
  \ ARP/RARP 协议族，其中包含一个使用形式逻辑构建的地址绑定存储库，以便对目标机器的身份进行长期评估。该方法在不修改底层协议的情况下提供了安全的地址解析。根据作者的描述，Arpsec\
  \ 的成本比标准的 Linux ARP 实现高 7% 到 15.4%。其开销等同于标准的 Linux NDP 实现，因此 ARPsec 代表了在 IP 版本 4\
  \ 和 6 中实现潜在可信且加密底层网络的第一步。研究结果表明该技术是可行的，为安全网络协议的进一步研发铺平了道路。总体而言，这项研究通过对与 ARP 和 NDP\
  \ 协议相关的漏洞提出新颖实用的解决方案，为网络安全做了重要补充。对于当前的计算机系统，结合 TPM 使用形式逻辑可以提供极佳的安全保障，既具有成本效益又具有实用性。研究结果说明了该方法的实用性，并为未来安全网络协议的研发开辟了道路。因此，这篇文章适合纳入网络安全综述论文。\n\
  \nSalem 等人（2022）在研究中提供了一种对抗远程监控系统中中间人攻击（MitM）的策略。所提的系统利用局部敏感哈希（LSH）来建立不可逆的数据签名，防止攻击者推断或访问私有数据。该研究强调了三项主要贡献：降低数据传输能耗、限制有效的中间人攻击以及防止修改和重放攻击。建议的范式适用于远程监控系统，在这些系统中数据隐私和安全至关重要。作者通过\
  \ LSH 和 HMAC 分别解决了数据机密性和完整性问题。LSH 提供了不可逆的数据签名，减小了数据传输包的大小和能耗，而 HMAC 则确保了消息认证并防止了消息修改攻击。使用\
  \ RSSI 作为 HMAC 的第一个键值是一项可行的技术，它在利用现有技术的同时减少了中间人攻击的可能性。建议的架构可以解决远程监控系统中的安全和隐私问题，特别是在医疗领域。作者对所提方法在防止中间人攻击及修改/重放攻击方面的效能进行了详尽评估。\n\
  \n为了对抗非接触式支付系统的中间人攻击（MITM），该研究（Akter 等人，2021）提供了一种包含 NFC 护罩、Arduino Uno 开发板和被动卡卡的架构。研究人员发现在卡片验证与支付授权的分离中存在一个漏洞，允许攻击者劫持原始卡片与读取器之间的交互，根据需要更改消息并将其传输到恶意写入器组件。攻击者利用该路径防止原始读取器在传输过程中检测到任何信道切换，从而能够更改支付信息、挑战响应和个人信息。为了反击这种攻击，建议的技术包括建立最大读取时间和阈值值，并通过测量当前读取时间与最大读取时间之间的差异，以在读取器与卡片通信时检测异常。与之前提出的保护机制相比，这种方法不需要额外的硬件，并提供了更高效、更具成本效益的解决方案。研究还证明了建议机制以\
  \ 100% 的准确率识别中间人攻击的有效性。建议的架构和技术对非接触式支付系统的安全领域做出了重大贡献。该研究提供了一种可行且高效的方法，通过检测现有系统的故障并提供无需新硬件的修复措施来减少中间人攻击。\n\
  \nAldabbas & Amin（2021）建议了一种自动识别和缓解地址解析协议（ARP）威胁的系统。该系统基于软件定义网络（SDN）控制器构建，控制器持有网络拓扑信息以及控制器\
  \ ARP 表（CAT）。建议的解决方案由三个主要部分组成：获取网络拓扑信息、在网络设备上实施流规则，以及流量分析和 ARP 欺骗缓解模块。研究人员使用基于 SDN\
  \ 的物联网专用仿真进行了多次测试，以评估建议系统的效能。实验包括引入一个 IP 地址为 `10.0.0.11` 的攻击者，并实现著名的 `Kali Linux`\
  \ 操作系统来引发 ARP 欺骗和一些伪包，以使整个系统拓扑控制器失稳。计算了包括攻击检测时间、CPU 开销、攻击缓解时间和系统吞吐量在内的许多因素，以评估建议策略的性能。通过分析可疑网络流量，研究中的建议方法还减少了分布式拒绝服务（DDoS）攻击的发生率。由于系统在每个服务器上独立检查\
  \ ARP 数据，因此 ARP 攻击会被自动检测，攻击保护方法会迅速启动。关于地址转换的查询被路由到该服务器，由该服务器分析网络流量并使用专门的方法确定攻击状态。该研究提出的技术具有创新性，在物联网系统中识别和缓解\
  \ ARP 攻击方面显示出良好的前景。建议的系统在多个方面均优于现有系统，包括更快的攻击检测和缓解时间以及消除 DDoS 攻击。\n\n## 结论\n\n\n\n\
  \n因此，ARP 欺骗是一个关键的安全问题，要求网络管理员和安全专家保持持续关注和警惕。我们对该主题现有文献的审查显示，攻击者经常利用 ARP 欺骗来拦截和更改网络流量，攻击成功后的潜在后果可能是严重的。这种攻击会危及敏感数据（如登录密码、财务信息和个人身份信息）的完整性和安全性。虽然降低\
  \ ARP 欺骗风险的方法，例如实施网络级安全协议（如 ARP 欺骗检测与防御机制），但保持主动性并关注最新的安全威胁和网络安全最佳实践至关重要。随着技术的进步，攻击者的手段也在不断进化，安全措施必须随之发展。这包括入侵检测与防御技术的部署以及安全编码方法。最后，每个人必须意识到网络安全的重要性，并采取必要的措施保护我们的数据和系统免受\
  \ ARP 欺骗和其他安全风险的影响。通过了解当前的安全风险并实施网络安全最佳实践，本建议可以减少 ARP 欺骗和其他网络攻击的危险。这将保护我们的信息和基础设施。\n\
