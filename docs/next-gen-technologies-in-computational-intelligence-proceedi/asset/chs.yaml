  \ (SVR) |\n\n多车传感器数据随着 `V2N` 流向云端进行更新。如表 1 所示的不同机器学习（`ML`）模型在云计算基础设施中执行，并在边缘节点进行少量预处理。系统/用户/乘客对舒适参数的偏好也被输入网络。\n\
  \n`ML` 输出结合用户偏好作为启发式参数更新，作为动态 `A*` 算法搜索最优路径的系数。动态 `A*` 算法持续从环境中获取节点数据，引导组件车辆沿最优路径行驶，以通过更好的舒适性和安全性规避碰撞和交通拥堵。\n\
  \n## 4.3 动态 A* 网络路由优化：\n\n\n\n\n\n为了从源点到终点选择最优路线，对比并分析了多种搜索算法，如一致代价搜索 (`UCS`)、贪婪搜索（最佳优先搜索）和\
  \ `A*` 搜索。在这些算法中，在相似环境下，`A*` 的性能优于其他算法 ([Cui & Shi, 2010])。所提出的动态 `A*` 搜索模型能够满足不断变化的约束和环境响应\
  \ ([Seo et al.,2009])。这些变化通过每个节点上的启发式函数来表示 (Ferguson et al., 2005)。ML 模型输出定义了启发式值及其系数的变化，这些值由动态\
  \ `A*` 进行优化。选择了使用 `A*` 搜索的最优方案，带有可变启发式参数（`距离`、`时间`、`舒适度`、`安全性`）。该模型结合了通过相机帧计算机视觉检测障碍物、路况，以及通过\
  \ ML 模型学习检测车内安全方面的研究结果。\n\n### 动态 `A*` 方法\n\n令 `f(n)` = 方案的估计成本\n\n`hi` = 关于到达目的地所需时间的启发式值\n\
  \n`h2` = 关于舒适度（路况/交通）的启发式值\n\n`h3` = 关于安全的启发式值（常数且不随任何条件改变）\n\n(1)\n\n$$\\frac{~因此,~mathbf{f}(\\\
  mathbf{n}) = \\mathbf{g}(\\mathbf{n}) + \\mathbf{h}\\_{1}(\\mathbf{n}) + \\mathbf{h}\\\
  _{2}(\\mathbf{n}) + \\mathbf{h}\\_{3}(\\mathbf{n})}{}$$\n\n这为假设的普通启发式条件提供了最优成本函数。\n\
  \n该方法通过可变系数修改了方程 (1)，这是通过结合当前启发式成本与来自计算机视觉及车内预测模型的输出输入，发现了一个新的成本值。\n\n(2)\n\n`f1`= `w[1]*g(n)`\
  \  + `w[2]*h1`  + `w[3]*h2`  + `w[4]*h3`\n\n其中，`w1`、`w2` 和 `w3` 是决定每个启发式权重的系数。\n\
  \n例如，根据传感器输出（识别道路质量以及其他车辆早先在相同路径上行驶的经验），模型会分析旅行的舒适度并相应地调整启发式函数的系数（权重）。\n\n每个节点的启发式函数值由\
  \ ML 模型动态计算，并输入搜索算法，算法返回最优路线。动态 `A*` 算法伪代码描述如下：\n\n```\nDyn_A_star (start, goal,\
  \ w1, w2)\n\ncreate open set and closed set\n\nadd start node to open set with g(start)\
  \ = 0\n\nand f(start)= w1*h1(start) +w2*h2(start)\n\n+w3 *h3(start)\n\nwhile open\
  \ set is not empty do\n\n    current_node = node in open set with lowest f value\n\
  \    remove current_node from open set;\n    add current_node to closed set\n  \
  \  if current_node is goal then,\n        return path from start to goal\n    if\
  \ successor is in closed set then,\n        continue\n    tentative_g_score = g(current_node)\
  \ + cost(current_node, successor)\n    if successor is not in open set or tentative_g_score\
  \ < g(successor) then\n        set g(successor) = tentative_g_score\n        set\
  \ h1(successor) = heuristic_cost_based_on_time(successor)\n        set h2(successor)\
  \ = heuristic_cost_based_on_comfort(successor)\n        set h3(successor) = heuristic_cost_based_on_safety(successor)\n\
  \        set f(successor) = g(successor) + w1*h1(successor) + w2*h2(successor) +\
  \ w3 * h3(successor)\n    if successor is not in open set then,\n        add successor\
  \ to open set\n    update heuristics based on current state of the search\nend while\n\
  \nreturn failure end function\n```\n\n### 机器学习 AV 模型\n\n如上所述，ML 结果决定了上述动态 `A*` 模型的实时启发式值。用于各种任务（如计算机视觉（目标检测）、车内辅助（ML）、舒适度（更平整的道路和更少的交通）以及预防性维护（基于机器噪声）的辅助\
  \ ML 算法，通过对从不同传感器收集的数据进行重复训练和验证变得成熟。融合模块汇总了不同的传感器输出，以理解动态变化的道路场景。\n\n例如，外部自动驾驶 HD\
  \ 相机 (`FUR Blackfly - BFS-U3-50S5C`) 用于目标检测和避障。诸如卷积神经网络 (`CNN`）或支持向量机 (`SVM`） (Ponti\
  \ I & Vern, 1998) 等机器学习模型可以经过训练以分析视频/图像流，检测单/多个目标，并识别可能指示障碍物的模式。\n\n使用带有 Resnet-50\
  \ 卷积神经网络 (`CNN`) 骨干的典型 SSD300 目标检测器从色彩补偿图像流/帧中车辆目标检测。图像被提取并由表 2 列所示参数的典型神经网络进行训练，ANN\
  \ 将测试图像分类为多个目标。最优的 ANN 超参数列在表 2 下方，并作为末端分类器。\n\n| ANN 参数 | 模型值 |\n| --- | --- |\n\
  | 隐藏层 | 50 |\n| 隐藏层节点 | 4 |\n| 激活函数 | SoftMax |\n| 迭代次数 (cycles) | 500 |\n| 正则化\
  \ | Lasso 正则 |\n| 动量 | 0.18 |\n| 梯度下降 | ADAM (自适应动量) |\n| 学习率 | 0.045 |\n| 误差容限\
  \ | 0.0013 |\n| 偏置 | -1, 0, +1 |\n\n表 2：末端分类器 ResNet-50 的最优 ANN 参数\n\n### 结果分析\n\
  \n在上述章节中，对提出的几种常用路径规划算法及其变体，根据它们能够处理的静态和动态特征及其适应性进行了分类。这些结果对比列在下表 3 中。最优性和适应性得分根据场景计算，模型进行推断并正确行动，并验证了所有场景。\n\
  \n通过上述分析我们发现，所提出的动态启发式 `A*` 算法的准确性和相关性更好，且对实时场景和环境条件的适应性有所提高。\n\n### 6.0 结论与改进\n\
  \n\n\n\n\n在未来的时代，自动驾驶汽车（AVs）将成为现代交通生态系统的重要部分（Chowdhury & Dey, 2016），并预计在未来几年改变交通行业。关于自动驾驶普及的研究主要在于通过强化学习进行单车导航控制以及适应环境动态变化（Wen\
  \ et al., 2020）。其他研究领域包括动态道路场景下通过参数化路由优化自动驾驶网络（Zhu & Aksun-Guvenc, 2020）以及如灰狼优化器等多种准学习方法（Elsisi,\
  \ 2022）。现实场景下适用模型的感知与表征仍然是实现可靠、平稳且具有安全措施的自动驾驶的最大挑战。本文旨在提出一种更全面的混合原型，利用动态启发式算法寻找自动驾驶网络路径优化解决方案。所提出的模型将来自\
  \ `OAVN` 的环境数据存储在云端，并用用户控制的系数控制动态启发式算法，被证明在实时条件下表现更好。\n\n### 表 3. 不同路径查找算法的结果对比\n\
