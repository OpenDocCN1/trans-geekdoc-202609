  \n## 摘要\n\n目前的研究专注于雾环境下图形内容的安全性和性能增强。在这里，图像数据在执行水印操作后被分割，并通过视觉加密机制对数据进行处理。水印使内容受版权保护，而分割将数据分解为多个部分，允许从雾节点和核心云进行传输。另一方面，集成了视觉加密以提高安全性。为了在多媒体应用中实现隐私保护，视觉密码学的需求日益增长。本文关注于利用水印结合视觉密码学方法来增强多媒体内容的隐私保护。覆盖图像用带水印的图像进行处理，然后对水印图像进行半色调处理以限制像素扩展。建议这项工作。使用扩展的\
  \ VCS 将半色图像划分为两个份额。在共享时，可以包含 QR 码，并可以使用无损压缩过程完成基于 QR 的份额压缩。随后，这些信息从发送者发送给接收者。在接收端接收数据后，在解密后检查图像质量。在传统工作和所提工作中，均考虑了图像的\
  \ `PSNR` 和 `SSIM` 以确保视觉密码学时的图像质量。与传统方案相比，建议旨在提供更好的 `PSNR` 和 `SSIM`。\n\n关键词：图像处理、雾计算、水印、数据分割、视觉密码学、PSNR、SSIM\n\
  \n# 引言\n\n最近，创建了一种新型数字水印系统，它们利用视觉密码学（`VC`）的思想来保护水印材料。此外，可以应用基于 `VC` 的水印技术来加强从受攻击照片中提取水印的识别。例如，在使用\
  \ `VC` 进行水印处理时，二进制标志在嵌入宿主图像之前会被加密成两个类似噪声的二进制份额。这两个份额都分发给公众，但其中一个被保留作为水印份额（Wang,\
  \ 2011）。另一部分代表公共水印部分，通过一种在宿主图像的空间域或频率域工作的典型水印方法集成到宿主图像中。\n\n## 视觉密码学\n\n视觉密码学是一种特殊的加密技术，它将隐藏图片划分为许多层，以隐藏图像内部的信息。每层存储一定量的信息。当接收者对齐这些层时，隐藏信息对肉眼可见，且不需要任何复杂的计算即可解密(Hsu\
  \ et al., 2007)）。一种被称为视觉密码学的加密方法将机密图片分解成几个独立的碎片。为了重建原始图片，这些份额需要以数字或物理方式相互重叠。\n\n\
  为了以一种人类可以解密的方式加密图像、文本等，开发了一种名为“视觉密码学”的加密方法。1994 年，Moni Naor 和 Adi Shamir 创建了第一种方法。图片被分为\
  \ n 个部分，只有当 n-1 个人共享一张照片时，没有人会获知原始内容。在实践中实现这一点的，你可以将每个份额打印在独立的透明片上并将它们叠在在另一个之上(Hsu\
  \ et al., 2012)）。在发展过程中，视觉密码学产生了大量的迭代，每种迭代都提出了独特的解决方案。作者对许多分类进行了概述（Lee & Chiu, 2013）。随后对这些这些系统的特征、性能指标、优点和缺点进行了评估和对比。作者在现有的比较指标集中添加了信噪比和份额类型，这是对早期工作的改进(Askari\
  \ et al., 2014)）。\n\n![图 1. 视觉密码学](img/fig14_1_B.jpg)\n\n图 1. 视觉密码学\n\n\n\n\n\n\
