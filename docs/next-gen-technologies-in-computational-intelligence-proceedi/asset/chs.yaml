  \ Systems with Applications, 42(3), 1149-1165。\n\n# 使用带 RBNN 的随机梯度分类器植物疾病检测\n\n\
  K. P. Sreelakshmi,^(⁵⁹)\n\nVels Institute of Science, Technology and Advanced Studies\
  \ (VISTAS) 计算机科学学院 - 印度，钦奈伊\n\nDOI: [10.1201/9781003430452-74](https://dx.doi.org/10.1201/9781003430452-74)\n\
  \n## 摘要\n\n国家的命脉在于农业。因此，作物需要免受许多疾病的侵害。无论何种烹饪，番茄都以多种形式出现，因此我们将其用作研究的样本作物。许多不同的疾病会导致番茄质量下降。本文提出了一种利用\
  \ `ML` 算法早期预测和检测番茄叶病的方法。在各种 `ML` 算法的帮助下，它们系统地在数据库上工作并执行特征提取、测试等各种功能。估计番茄叶病的性能范围为\
  \ 67%–99%。这为我们正在进行以及创建新型番茄叶早期检测方法提供了一个坚实的框架。\n\n关键词：植物疾病；深度学习；早期预测；特征提取\n\n# 引言\n\
  \n许多疾病阻碍了田间植物的生长，可能会降低最终产品的质量。早期的落叶或疾病相关的感染会对棉花造成损害 (Delnevo et al., 2021)。为了解决可维护的环境主义、非预期消除和表层土优化等问题，必须收集各种农业数据并进行分析\
  \ (Ouhami et al., 2021)。多种 AI 技术包括 `KNN`、逻辑回归、决策树、`SVM` 和 `DCNN` 被用于检测和分类疾病。这些方法与其他预处理技术相结合，以改进特征提取。`K-NN`\
  \ 使用相似性度量对数据进行分类 (Li et al., 2021)。基于统计学习，`ML` 方法的特征是划分应用于回归和分类任务的超平面 (Garikapati\
  \ et al., 2021)。\n\n## 相关工作\n\n深度学习 (`DL`) 是一项非常受欢迎的技术，因为它在对海量数据进行训练时，能产生准确的结果 (Latchoumi\
  \ et al., 2019)。`DL` 的显著优势是能够自动选择合适的特征 (Wani et al., 2022)。图像处理被用于识别玉米作物中的疾病。上文显示了在\
  \ `MATLAB` 中执行的自动 `SVM` 分析结果 (Anand et al., 2021)。水培农业决策支持系统也采用了相同的方法来识别植物叶的特征。正在开发一种用户友好的软件，利用图像处理技术检测黄麻疾病。在这项研究中，该应用程序将拍摄照片并上传到服务器\
  \ (Saleem et al., 2019)。服务器使用基于色色的分割识别受影响区域。`R-CNN` 方法结合了特征提取器以寻找感兴趣区域。建议的区域经过标准化处理\
  \ (Saleem et al., 2019)。为了从建议区域提取特征，使用了 `AlexNet`。最后，对于标准化建议区域的合适维度，使用支持向量机 (`SVM`)\
  \ 对良好坐标进行分类和回归分析 (Rehman et al., 2021)。另一方面，`R-CNN` 为每个潜在区域提取特征，然后对许多建议区域重复相同的过程，导致产生许多参数。此外，结果属性受到基于金字塔原理的感兴趣区域\
  \ (`Rol`) 层对候选建议区域进行标准化的影响；`Faster R-CNN` 统一了多个区域推荐的典型向量长度。`Fast R-CNN` 只需要计算一次整个图像，消除了大量的重复计算\
  \ (Prakash et al., 2022)。\n\n## ML 算法\n\n决策树是最强大且常用的分类和预测算法之一\n\n### 提议的工作流\n\n\
  本节描述了用于分类各种番茄叶病的提议 `ML` 技术。图像采集、图像预处理和特征提取用于创建丰富的特征数据集。这些特征随后提供给分类器以分类番茄叶病。图 1 展示了工作流。\n\
  \n![图 1. 工作流](img/fig74_1_B.jpg)\n\n### 分类分析\n\n一个具有 1615 个特征、84 个输入神经元和 19 个输出神经元的分类器使用随机梯度进行训练和评估，以优化负对数似然损失函数。前\
  \ 15 种质量的准确率为 1，棕斑除外。40 个实例的分类错误总计为 5.8565%，这被认为是满意的。\n\n\n\n\n\n图 2. 叶片图像预处理\n\n\
  ![图 3. 数据库中每种叶片病的图片](img/fig74_3_B.jpg)\n\n图 3. 数据库中每种叶片病的图片\n\n## 模型训练结果\n\n所提系统通过西红柿进行了评估，使用\
  \ `RBNN` 的 `Gradient descent` 算法实现了 99.54% 的训练率。表 1 和 图 4 分别显示了系统的名称、准确率以及与现有系统的对比。图\
  \ 4 能够为不同的疾病选择最佳技术。\n\n![图 4. 利用各种现有技术结合所提系统的分类准确率](img/fig74_4_B.jpg)\n\n图 4. 利用各种现有技术结合所提系统的分类准确率\n\
  \n表 1 性能指标\n\n| 序号 | 算法名称 | 准确率 (%) |\n| --- | --- | --- |\n| 1 | 逻辑回归 | 87.02 |\n\
  | 2 | 随机森林 | 81.99 |\n| 3 | 基于 RBNN 算法的梯度提升 | 99.61 |\n| 4 | SVM 算法 | 90.64 |\n\
  | 5 | 决策树 | 96.13 |\n\n## 结论\n\n本文探讨了在农业中使用 `ML` 的优势，并开发了利用叶片面积和特征提取直方图诊断植物疾病的算法。结合\
  \ `RBNN` 方法的 `Gradient descent boosting` 达到了 99.54% 的准确率，有助于农民防止疾病传播并提高作物质量。\n\n\
