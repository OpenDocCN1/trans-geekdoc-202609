  \ 数据集上的多类分类](img/fig23_4_C.jpg)\n\n图 4. CIC1DS2017 数据集上的多类分类\n\n此外，值得注意的是 `DoS Slow\
  \ HTTP Test` 的属性与 `DOS Hulk` 更相似。这两种攻击具有中等高误分类率，有 16%被识别为 `DOS Hulk`。此外，对于`Benign`\
  \ 和 `DDos` 流量，系统可以达到 100%的准确率、精确率和召回率。表 3 进一步显示，与其它流量类型相比，对 `SQL injection` 和 `Heartbleed`\
  \ 流量进行分类是所有流量类型中最具挑战性的过程。`SQL injection` 和 `Heartbleed` 的准确率分别为 99.19% 和 99.27%。这可能是因为该类的实例数量与其他类相比较少。\n\
  \n表 4 将建议方法的整体性能与现有技术进行了比较。显而易见，在分类攻击时，建议的模型具有最高的准确率（99.72%）。此外，基于高性能的结果，可以说提取的特征强度足够对攻击和正常情况进行分类。与其他类相比，`DNN`\
  \ 模型提供了 96.67% 的准确率。由于特征之间的错误关系，`DNN` 分类器预测了错误的类别，未能提供理想的结果。\n\n表 4. 建议方法在 CICIDS2017\
  \ 数据集上的对比\n\n| 技术 | 准确率 | 召回率 | F-score |\n| --- | --- | --- | --- |\n| `DNN` [33]\
  \ | 96.67% | 97.21% | 97.29% |\n| 97.25% | --- | --- | --- | --- |\n| `CNN` [34]\
  \ | 98.60 | 99.37 | 99.35 |\n| `VARMAN` | 99.24 | - | - |\n| `RNN-CNN` | 98.95%\
  \ | 99.45% | 99.06% | - |\n| `V-NKDE` | 99.67 | 99.70 | 99.70 |\n| 建议方法 | 99.72\
  \ | 99.80 | 99.81 |\n\n图 5 显示了建议工作与当前技术之间的准确率比较。图表显示 `CNN` 和 `RNN-CNN` 的准确率分别为 98.60%\
  \ 和 98.95%，性能相似。与 `CNN` 单模型相比，混合 `CNN` 模型的准确率更高。然而，混合 `RNN-CNN` 仅达到 99.06% 的召回率，低于单模型\
  \ `CNN`。这意味着模型中存在许多假阴性，可能是由于类别不平衡或参数配置不当导致的。\n\n![图 5. CICIDS2017 数据集上的准确率比较](img/fig23_5_C.jpg)\n\
  \n图 5. CICIDS2017 数据集上的准确率比较\n\n## 缓解性能分析\n\n图 6 显示了在实时攻击期间网络使用的带宽。此外，它展示了在 攻击活跃期间特定仿真段网络性能的变化。实施建议的框架时性能显著。一旦产生\
  \ 攻击，我们可以看到网络流量增加。当我们执行建议架构时，网络流量大幅下降，大多数 攻击被识别并消除。这意味着防御策略在网络中有效，资源返回给了授权用户。\n\n\
  ![图 6. 缓解](img/fig23_6_C.jpg)\n\n图 6. 缓解\n\n## 结论\n\n为了准确识别 SDN 网络中的攻击，本文开发了一种基于深度学习的方法。在\
  \ SDN 网络数据集中，使用 `MobileNetV3` 和 `LeNet-5` 检测了攻击并对攻击类进行了分类。我们对建议与其他方法的研究表明，它成功识别了\
  \ `InSDN` 和 `CICIDS2017` 数据集中的各种网络攻击，准确率分别为 99.56% 和 99.72%。建议的方法在两个数据集上均优于其他比较方法，使其能够在\
  \ SDN 环境中用于识别和缓解 DDoS 攻击。\n\n我们未来的研究将分析新的攻击类型（如钓鱼攻击）以进行评估。为了理解此 IDS 如何响应真实攻击，我们还打算在实施建议的模型。\n\
