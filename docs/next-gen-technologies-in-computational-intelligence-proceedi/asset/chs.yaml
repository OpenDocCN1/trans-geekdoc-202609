  \ RAIT），IEEE, 1-5。\n9. Jiyoung Woo, Hsinchun Chench36.xhtml#ref36_9. (2016). 网络论坛中信息传播的流行病模型：营销交换和政治对话的实验。Springer\
  \ Plus, 5(66), 1-19。\n\n\n\n\n在任何国家，由于人们对传统投票系统存在广泛的不信任，民主投票是强制性的。据观察，人们的基本权利一直未能受到侵犯。透明度的缺乏导致其他数字投票系统面临挑战。大多数投票方法缺乏足够的透明度，这使得政府赢得选民的信任具有极大挑战性。过去和现在的数字投票系统都失败了，因为它们容易受到操纵。主要目标是解决在传统和计算机化投票系统中可能出现的任何错误或不公平投票行为。为了确保选举公平并减少不公平性，可以将区块链技术引入投票过程中。计算机化投票方法尚不够完善，无法大规模使用，而物理投票系统也存在许多问题。这评估了保护公民民主权利的补救措施的需求。本文提出了一种基于尖端区块链技术的框架，以便在选民和选举官员之间建立可靠的工作关系。在不使用任何实际投票站的情况下，所建议的方法提供了一个可以通过区块链进行数字投票活动的框架。我们建议的架构采用自适应共识技术以实现可扩展的区块链。在链交易过程中，智能合约为用户和网络之间提供了安全连接。讨论还集中在构建在区块链上的投票系统的安全性。区块链上的交易现在可以使用密码哈希进行加密。我们评估了适当记录开发的潜力，特别是通过对相关检查的描述，特别是政治竞选模式，以及基于区块链的软件的使用，这很好地解决了安全问题并降低了跨国政治竞选的管理成本。\n\
  \n关键词：区块链、智能合约、密码哈希、共识算法\n\n# 引言\n\n投票系统必须尽可能精确、有效和高效，因为投票是最关键的民主工具之一。在定义投票站位置、聘佣员工和减轻投票站安全威胁方面，区块链可以显著减少所需的时间和资源。基于区块链的数字选举在节省成本的同时，降低了不公平投票的可能性。它可以提高交易的可追溯性、投票系统的可靠性和透明度。\n\
  \n传统的数字投票系统使用了连接到中心化数据库的投票机。能够物理上访问该设备的人可以对其进行篡改。与不会受到单个网络破坏者影响的不可变区块链相比，投票系统的整个网络可能会因此产生潜在的单点故障。信息是去中心化的并存储在区块链上，记录的真实性会得到持续检查。因此，即使某个节点成为恶意攻击的受害者，点对点网络也将继续提供所有服务；只是该节点会受到影响。区块链技术已经发展到可以被信任并用作投票账本的程度。与早期系统相比，区块链现在可以提供更多的安全信任。它不需要真实的投票机或模块，这些设备总是通过篡改工具受到攻击。这种方法最吸引人的方面是它的透明性，这让选民有信心他们的票是以最合适的方式投出的。许多系统正在被研究部署，包括银行、医疗、食品安全和加密货币交易。区块链技术可以用于进行诚实的选举，保护选民的机密性和信任。\n\
  \n传统的投票程序存在计票过程中干预选票或增加虚假选票的机会。当当局受到第三方影响时，有权宣布错误结果。选民无法获得关于选票是否会被计数的保证。总的来说，传统的投票程序不能保证无偏见的投票或透明度。仅将系统数字化或使用数字投票设备投选并不能解决问题。黑客可能会操纵这些计算机化投票设备，从而干扰投票过程。因此，需要一个去中心化的系统，即使一个节点被损坏也能维护数据安全。本文的主要目标是鼓励使用基于区块链的投票系统，以防止投票过程受到操纵并赢得选民的信任。连接到节点永远不会被删除是区块链技术的一个基本特征。提供去中心化数据存储的区块链技术使其成为可能。由于数据在网络中的每个节点中复制并存储，因此同时删除数据是不可能的。此外，由于每个节点在合并之前单独计算数据，计票所需的计算被降到了最低。在投票系统中使用区块链被提作为防止投票篡改和投假票的方法。每个\
  \ ID 可以投一票。区块链防止了对链的任何部分的修改。它结束了投票系统对中间人的依赖，有助于节省资源。\n\n## 相关工作\n\n为了防止投票欺诈或篡改，Yang\
  \ 等人（2021）提出了一种基于区块链的名为 PriScore 的自计票系统。选民可以使用 PriScore 给候选人给出不同的评分（在给定范围内）。选票的聚合（匿名以保护选民隐私）应等于预定义的常数。同时验证这两个重要条件（范围证明和总和证明）是评分投票中的关键问题。为了证明评分满足这两个条件，我们提供了一种我们称为双重零知识证明（dual-ZKP）的新方法，它非平凡地结合了分布式\
  \ ElGamal 加密和 1-out-of-K 证明。由于自计票过程，任何使用 PriScore 的方都可以计算并检查选举结果，这确保了公平性并避免了冲突。根据安全性分析，PriScore\
  \ 满意满足了以下要求：资格、彻底性、一致性、广泛的可验证性和重复投票检测。\n\nPanja 和 Roy（2021）提出了一种具有验证、端到端可验证和秘密选票的加密选举方法。它建议了一种安全的选民注册和识别系统。它停止填充票。为了防止任何攻击者创建并秘密发布在社区公告板上的合法选票，他们更新了\
  \ DRE-ip 系统。这项工作建议了一种使用安全多方计算、非交互式零知识证明（NIZK）和直接记录电子（DRE）设备的技术，在不暴露特定 DRE 设备总量的情况下广播最终计数。分析表明，Lin\
  \ 和 Zhang（2019）为 APSIPA ASC 2019 所的有效零知识证明（NIZK）是无效的，因为它不满足旁者区分性要求。因此，它增加了更优的 NIZK\
  \ 证明，提升了系统的效率。\n\n\n\n\n\n为了建立并阐明多级入侵引发的众多影响；`Rathee et al, (2021)` 利用区块链技术为电子投票创建了一个安全开放的物联网平台。消息篡改、`DoS`\
  \ 和 `DDoS` 攻击以及认证延迟只是为了认证所提系统而研究的少数安全因素。他们使用了`Social Weighted Rank` 技术和`基于受信 IoT\
  \ 设备的安全电子投票算法`来评估物联网的信任度。\n\n`Farooq et al, (2022)` 开发的平台基于尖端区块链技术，能够提供最大的系统透明度和可靠性，以在选民和选举官员之间建立信任关系。通过使用该软件，投票活动可以在区块链上在线进行，而无需实地投票站。得益于灵活的共识技术，该平台提供了一个可扩展的区块链。由于系统使用了`Chain\
  \ Security Algorithm`，投票过程变得更加安全。在链交易期间，智能合约为客户端和网络之间提供了加密连接。所提系统的性能评估表明了该系统在大规模人口中部署的能力。\n\
  \n`Al-Madani et al, (2020)` 引入了基于区块链的电子投票方法。该应用利用区块链技术可以克服中心化投票机制的局限性和潜在漏洞。这项研究说明了区块链的数据安全特性。它开发了一种以去中心化方式采用智能合约的投票系统。随后，本地区块链接收了该应用的共享账本。作为一个平台，该应用使用了`Ethereum\
  \ Blockchain` 技术，并使用去中心化数据库存储候选人、投票和选民身份的信息。\n\n`Roopak & Sumathi, (2020)` 提出了一种使用`UIDAI`提供的独立虚拟\
  \ ID 的加密安全电子投票机制结构。`Aadhar` 数据库允许收集选民的人统计数据，包括指纹数据。为了保护区块中投票的机密性，指纹在加密过程中被转换为数字签名。通过使用`private\
  \ key` 和`hash work`，该框架包含了一种对编码数据执行操作的方法。\n\n`Abayomi-Zannu et al, (2020)` 提出了一种移动投票系统以减少尼日利亚的选举欺诈。这项研究开发了一种移动投票系统，使用区块链技术安全地存储投票，并通过双因素验证选民。所提系统使用`ISO\
  \ 9241-11` 可用性范式进行了评估，结果显示它获得了良好的可用性评分，表明它可以用于投票过程。\n\n`Killer et al, (2020)` 提出了一种名为`Provotum`的机制。通过将私有链部署为公开可见的公告板，并允许在各个许可区块链节点之间显式分配信任，`Provotum`\
  \ 引入了一种全新的、完全去中心化的基于区块链的区域电子投票系统。`Provotum`的全分布操作使用了客户端加密，实现了选票保密、分布式密钥生成、智能合约、异步加密和协作解密等功能。为了实现开放和端到端的验证，系统创建了审计追踪。`Qureshi\
  \ et al, (2019)` 提出了`SeVEP`，它同样使用多因素认证选民、防止重复并具有验证性，以保护选民机密性和投票完整性。\n\n为了提高投票的安全性和透明度，`Pandey\
  \ et al, (2019)` 利用区块链创建了`VoteChain`。所提系统是可靠的。该系统使用`Proof of Work` 和`HashCash` 来在服务器之间建立共识。\n\
  \n`Sivaram et al, (2022)` 提出了`COVID-19 疫情 - 远程投票系统 (C19P-RVS)`。系统的整个运行基于区块链。注册选民一次仅允许使用一个投票币。`Lin\
  \ & Zhang (2019)` 使用`Efficient One-of-T` 零知识证明开发了`ZKP`，它可以用于需要匿名性的私密场景。\n\n## 提出的方法\n\
  \n设定的架构提供了一个框架，可以利用区块链虚拟执行投票程序，而无需实际的投票站。在这种方法中，个人的计算机国家 ID 将从数据库中确认，以便他们可以在任何地方投票，无论是否在另一个国家。每个用户都可以通过系统平等访问整个投票过程。选民使用他们的访问数据在系统中注册。为了将选民录入系统，系统使用其\
  \ ID 信息并与在线数据库进行比对。完整的选民数据存储在系统中。向每个成功注册到系统的选民发放的投票币（`VC`）将添加到您的钱包中。因此，每位选民将获得一个`VC`\
  \ 以避免重复投票。\n\n\n\n\n\n`transaction hash`（交易哈希）用于追踪由矿工执行的交易。随后，投票链将连接到该节点。投票完全受到加密\
  \ `hash` 的保护。每增加一个注册选民，链就会增加一个区块。这种投票方法还通过利用投票货币确保每个用户只能投一票。无论投递代币的余额是否由于技术问题而保持不变，该过程都能确保没有选民投过重复票。如果矿工能够判断\
  \ `transaction hash` 是否是使用选民的计算机化国家 ID 生成的，矿工将立即拒绝任何选民发出的违规节点或请求。在有效执行交易后，该票被添加到选举的投票总票数中。选民提供了一个唯一的会话哈希（session\
  \ hash），他可以使用其在网上验证自己的投票。如果投票正确，选民的钱包将耗尽所有投票货币。\n\n通过利用区块链技术，各种系统已整合了投票机制。关于其典型响应时间和安全需求合规性的信息，请见图表\
  \ Figs. 2 和 3。\n\n![Fig. 2. Security Requirements](img/fig37_2_B.jpg)\n\nFig. 2.\
  \ 安全需求\n\n![Fig. 3. Average response Time](img/fig37_3_B.jpg)\n\nFig. 3. 平均响应时间\n\
  \n## 加密哈希\n\n用户身份的隐私是加密哈希的许多优势之一，它使统计数据免受任何系统入侵者，加密哈希通过 `SHA-256` 和高级加密标准 (`AES`)\
  \ 实现。由于只有授权使用交易的人才能解密并使用其 `private key` 访问数据，因此交易在通过网络推送到节点时是安全的。通过输入交易地址，可以追踪选民的投票；一旦投票完成，选民将通过短信和电子邮件收到通知。通过使用在注册手机号码上的\
  \ `transaction` 的 `hash value`，选民可以在区块链上监控他们的投票。投票过程中收集的信息包含在投票数据中。内容仍然是模糊、安全且可靠的。只有选民有权访问追踪信息，只有投票者才能见证并验证他们的投票历史。一旦交易在区块中提交，它将使用公民的\
  \ `public key` 进行锁定。追踪节点通过投票者的 `public key` 进行感应。选民使用其个人的 `secret key` 可以查看其钱包发出的交易。一旦投出选票，选民只能观察自己的投票，永远无法修改或取消它。加密被用于加密交易过程中传输的任何用户信息。\n\
  \n![Fig. 1. Block diagram](img/fig37_1_B.jpg)\n\n图 1. 图\n\n## 智能合约\n\n一种称为“智能合约”的简单区块链嵌入策略，在满足某些标准时执行。合同通常是自动执行，以便双方参与方都能立即确定结果，而无需中间人或延迟。智能合约在执行期间为用户和网络之间提供了一个安全的链接。\n\
  \n## 结果与讨论\n\n所提的基于区块链的投票系统使用 `SHA-256` 和 `AES` 构建。该系统在任何条件下都满足区块链的标准。\n\n## 结论\n\
  \n基于区块链投票系统的目的是培养民众之间的信任。所提出的框架在交易方面有了显著改进。\n\n## 参考文献\n\n1. `Farooq, Muhammad Shoaib,\
