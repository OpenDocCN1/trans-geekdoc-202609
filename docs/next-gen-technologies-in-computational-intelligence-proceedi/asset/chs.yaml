  \ X 射线图像特征，最后将生成的特征图输入到使用各种传统算法创建的集成框架中。\n\n## 数据描述\n\n由美国国立卫生（NIH）发布的 ChestX-ray8\
  \ 数据集(Wang et al., 2017)在本工作使用的数据库中包含 14 种不同的肺部疾病和一种被称为“无发现”的健康状况。\n\n### 预处理\n\n\
  分类框架的性能受到数据预处理很大影响。在这里包含了以下预处理方法，以确保所有图像都准备好我们的程序。\n\n### 数据删除\n\n`ChestX-ray8`数据库由多标签图像组成，即某些图像属于多个类，这些图像已从数据库中删除。因此，最终将包含约\
  \ 112,120 张图像的数据库减少到 93,969 张图像，这成了我们的最终数据库。\n\n### 滤波和对比度增强\n\n系统采用了中值滤波器，研究表明它是去除\
  \ X 射线图像中椒盐噪声以及斑点和泊松噪声的优越滤波器之一(Yimer et al., (2021)；Thakur et al., 2017)；Das et\
  \ al., 2016)。\n\n### 调整大小和 RGB 转换\n\n这项工作将使用`VGG-16`从 X 射线图像提取感兴趣的特征，该模型使用 3 通道的输入图像，因此它将我们相应灰度图像的\
  \ 1 通道数据复制到 3 个通道中。\n\n# 6. 特征提取\n\n![Fig. 1. 滤波和增强前后的肺部 X 射线图像](img/fig16_1_1)\n\
