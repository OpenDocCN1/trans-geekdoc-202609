  \n## 摘要\n皮肤癌的分割与分类在模式识别中起着重要作用。目前计算机辅助诊断（CAD）方法用于皮肤癌的初步诊断。除了深度学习模型分类外，进行医学影像处理可以在大型数据集上建立训练。本工作提出了两个数据集。本研究重点关注一种自动皮肤发现系统，对皮肤癌的形式（良性与恶性）进行分类。使用了多种分割算法。本文提出了一种创新的特征提取算法。这些特征成为\
  \ SCG 分类器的输入。我们提出的系统的分类准确率基于 SCG 进行估计，并与 `CNN` 进行比较。SCG 的性能优于所有分类器，准确率达到 95.8% 和\
  \ 82%。此外，结果结果表明提出的方法比其他诊断方法更准确。\n\n**关键词：** 分割，分类，预处理，遗传算法。\n\n# 引言\n皮肤病变的发生率每年增长\
  \ 3.1%。美国每年有超过 300 万人确诊皮肤病变（Shazia et al., 2016）。因此，早期发现皮肤病变对于正确诊断至关重要。恶性黑色素有多种亚型。基底细胞癌和鳞状细胞癌是非黑色素皮肤病变。皮肤科医生利用光学检查对病变进行临床感知。\n\
  \n皮肤镜检查是一种非侵入性方法。少数医生使用 `ABCDE` 规则来改进性能（Piccolo et al., 2014）。因此，需要从图像中自动识别黑色素。现在计算机技术已应用于决策支持系统，帮助皮肤科医生区分恶性黑色素。CAD\
  \ 系统可以在短时间内给出准确的结果（Abbadi and Miry, 2014）。为了让临床医生获得有关病变的准确信息，自动皮肤图像处理提供了更好的结果。皮肤变自动处理的四个主要阶段包括：`预处理`、`病变分割`、`特征选择与提取`以及`病变分类`。图像通过数字皮肤镜进行整合。预处理是从大型数据集中挖掘数据并对其进行滤波处理。在预处理阶段，去除皮肤上的头发和气泡等噪声（Arshaghi\
  \ et al., 2020）。使用的滤波技术包括 `Wiener`、`Gaussian`、`图像增强`和直方图均衡化（Chandrahasa et al.,\
  \ 2016）。\n\n由于需要考虑皮肤病变的细微细节，分割是医学图像处理应用和计算机视觉的一项关键过程。将图像划分为组件图像的过程即分割。本工作使用了灰度阈值、`K-Means`、`Otsu`、边缘检测和直方图均衡化方法（Abbas\
  \ et al., 2013）。识别和提取皮肤病变的关键特征至关重要。所有皮肤病变与其他类型相比都有多种特征。特征提取从图像中抽象信息（Elgamal, 2013）。区域内的所有像素在颜色、纹理等方面具有相似性。\n\
  \n\n\n\n分类阶段对前阶段挖掘的信息进行解释，以创建关于病变图像的分析。分组阶段根据提取的特征区分良性和恶性皮肤病变。由于特征选择的基本目标在于选择最大特征以实现皮肤病变的高性能分类（Thaajwer\
  \ and Ishanka, 2021）。这些提取的特征确实对皮肤癌类别进行了分类（Nezhadian and Rashidi, 2018）。在实现方面，采用了`训练缩放共轭梯度\
  \ (SGA)`算法。\n\n目前的工作由“方法论”部分组成，该部分总结了文献综述。“基于遗传算法的特征提取”部分描述了方法论。“实现”部分提供了所提工作的实现，“使用带有训练缩放共轭梯度算法\
  \ (SCGA) 的神经网络进行分类”部分描述了病变分类。“结论”部分包含结论。\n\n## 文献综述\n\nSheikh Shazia et al. (2016)\
  \ 开发了一种热热成像方法，通过温度测量来识别皮肤中的恶性病变。作者将皮肤癌确定为最常见的癌症类型。估计有 300 万美国人遭受皮肤病变的痛苦。黑色素瘤是所有皮肤癌类型中最致命的。使用的工具是`Image\
  \ J 148 V`。\n\nDomenico Piccolo et al. (2014) 通过`ABCD`规则对色素皮肤病变 (PSL) 进行了皮肤镜分析。作者得出结论，对于病变的关键评估，少量参数就足够了。165\
  \ 张皮肤病变图像由三位皮肤科医生进行了考虑和评估。结果证明有助于诊断并接近医疗人员的假设。\n\nNidhal Khdhair El Abbadi 和 Abbas\
  \ Hussien Miry (2014) 开发了一个用于图像分割的 CAD 系统。利用`Wiener filter` 进行预处理和直方图阈值分割。所提方法利用`Hammoude\
  \ Distance (HD)` 和 `True Detection Rate (TDR)`。使用了`K-Means`、`Fuzzy C-Means`、`Otsu`、`Adaptive\
  \ Threshold`、`Niblack` 和 `Sovolas` 算法分割技术并对结果进行了比较。该系统达到了 96.32%的准确率。\n\nAli Arshaghi\
  \ et al. (2020) 提出了通过均值和高斯滤波进行预处理。使用了用于最小误差、最大熵和模糊均值的`Otsu` 分区技术。对于特征选择，采用了颜色、形状和准确率为\
  \ 94.3%的`新布扎德优化算法 (BUZO)`。\n\nChandrahasa et al. (2016) 讨论了使用智能手机检测皮肤癌。利用了灰度化转换、直方图分析和边界追踪等各种图像处理方法。论文以特征提取作为主要的开创性皮肤病变过滤系统。Qaiser\
  \ Abbas et al. (2013) 提出了一种新的自动边界检测 (ABD) 统一方法。`Otsu`预处理使用归一化平滑滤波器 (`NSF`)，并结合混合模型\
  \ (`MM`) 进行分割以细化病变区域。考虑了来自`EDRA Dermoscopy Interactive Atlas`的 100 张图像。获得的结果显示`ABD`算法可以自动找到皮肤镜图像中的皮肤病变区域。此外，设计了一个\
  \ GUI 来演示`ABD`技术。\n\nMahmoud Elgamal (2013) 描述了一种通过`DWT`进行特征提取、使用`PCA`进行降维以及进行分类的混合技术。对于分类，使用了`前向反传播\
  \ ANN`和`KNN`。所提出的两个分类器分别提供了 95%和 97.5%的准确率。\n\nAhmed Thaajwer and Piumi Ishanka\
  \ (2021) 提出了一种用于黑色素瘤初步诊断的 CAD。利用了形态和阈值分割等图像处理技术。颜色、形状和纹理特征的`GLCM`与`SVM`分类器配合。作者得出结论，通过组合特征实现了\
  \ 83%的准确率。\n\nFarzam Kharaji Nezhadian 和 Saeid Rashidi (2018) 开发了一种使用主动轮廓分割的皮肤癌检测新算法。提取了颜色和纹理特征，在`ISIC\
  \ 数据集`上使用`SVM`实现了 97%的高效能。\n\nMohamed Khaled Abu Mahmoud 和 Adel AI Jumaily (2014)\
  \ 通过图像缩放、图像裁剪以及`Weiner`、`Gabor`和`自适应中值滤波`分析了该概念。采用了基于边缘检测的方法，该方法使用了`SFS`和 42 张显微玻片图像。\n\
  \nYing Qian 和 Shuo Zhao (2020) 开发了通过高斯滤波和 Wiener 滤波进行黑色素瘤检测和识别的 CAD。作者建议后续工作目标为`ISIC\
  \ 数据集`选择合适的特征，准确率提高了 10.34%。使用了`Otsu`、颜色和纹理。使用了多组判别相关分析 (`MDCA`)来关联特征。\n\nYoo Na\
  \ Hwang et al. (2021) ) 开发了合并秩集(`HK-LS`)和分层 k-means 方法的混合模型。考虑了`PH²`和`Dermofit`数据库。通过基于`DRLSE\
  \ 模型`的双层联合分割模型进行直方图均衡化进行预处理，并进行精细边界分割。作者得出结论，所提方法表现出良好的准确率。\n\nPrajakta Sanjay Gaikwad\
  \ et al. (2013) 讨论了使用颜色空间转换的`SVM`以及通过形状、颜色和纹理提取特征。考虑的形状特征是图像直径、紧凑性、尺偏和不对称性。计算了纹理特征的粗度和`GLCM`。对颜色特征的方差、偏度和熵。`K-means`提供了\
  \ 52.63%的准确率，而`SVM`为 80 到 90%。\n\nRitesh Maurya et al. (2014) 设计了`基于 GLCM 的纹理特征`作为多分类`SVM`的分类输入。作者使用`Matlab\
  \ 7.12`将给定的数据集分为四类，准确率为 81.43%。`GLCM 特征`使用了熵、能量方差和均匀性的自相关性。\n\nWalid Barhoumi et\
  \ al. (2007) 讨论了基于病变描述和决策的皮肤病变计算机辅助诊断 (CAD) 系统。利用了基于内容的图像检索 (CBIR)方案。通过 Dempster-Shafer\
  \ 理论检测病变恶性程度，将准确率提高了 89%。应用了钝刀片滤波器并计算了 21 个形状和辐射属性特征。\n\nLisheng Wei et al. (2018)\
  \ 讨论了基于细粒度分类原则、结合 U-Net 架构和迁移策略的皮肤癌识别。作者得出结论，对于`ISBI 2016 数据集`的结果更好。\n\nYanhui Guo\
  \ et al. (2018) 提出了一种基于基于自适应区域增长算法的创新中性聚类。图像使用了 Shearlet 变换。数据集使用了 500 张图像进行数据准备。预测系统达到了\
  \ 95.3%的准确率。\n\nJulie Ann et al. (2018) 开发了深度学习以自动检测`PH²数据集`中的黑色素瘤。利用了形态侵蚀和膨胀操作，`AlexNet`用于预训练网络。带有步长动量的随机梯度下降\
  \ (SGD) 用于网络训练，达到了 93%的准确率，敏感性和特异性在 86%到 94%之间。\n\n\n\n\n图 1. 预测框架的示意图\n\n## 图像预处理\n\
  \n图像经过采集、裁剪并转换为灰度图像（Mahmoud and Jumaily, 2014）。此处采用了 `Wiener` 和 `Gaussian` 滤波方法。`Wiener`\
  \ 滤波器用于恢复模糊的皮肤病变图像（Qian and Zhao, 2020）。像素级自适应方法以每个像素任意维度的局部域为中心。为了控制模糊程度，使用了 `Gaussian`\
  \ 滤波器。为了增强特征图像，通过对比度增强对病变图像进行缩放。帧 1 中数据集 1 的原始图像和裁剪（缩放）后的图像所示图 2a 和 b。为了增强图像对比度，实施了直方图均衡化。\n\
  \n![图 2. (a) 原始图像 (b) 帧 1 中数据集 1 的缩放图像](img/fig2_2_C.jpg)\n\n图 2. (a) 原始图像 (b) 帧\
  \ 1 中数据集 1 的缩放图像\n\n## 分割\n\n在医学影像中，分割是指将皮肤病变划分为不同的片段，每个片段对应不同的自然显著结构。本工作执行了 `threshold`、`edge\
  \ detection`、`K-Means`、`Otsu`、`gray level thresh` 和直方图均衡化分割技术。\n\n灰度图像作为自适应阈值化的输入，输出二值图像。计算了\
  \ `gray level thresh` 的 `Global` 方法，其中所有级别使用单个像素。使用了 `Roberts`、`Sobel`、`Prewitt`、`Canny`\
  \ 和 `Log` 等边缘检测方法。从边缘检测的输出来看，`Canny` 提供了更好的结果，如图 3。使用了 `Centroid-based K-means`\
  \ 聚类算法（Hwang et al., 2021）。此处每组由一个向量表征，对象根据平方距离分配到聚类中心。舍弃了分离前景和背景图像的全局自适应二值化 `Otsu`\
  \ 分割。从分割实现来看，恶性 `ISIC_0025234` 图像的阈值分割提供了提高了质量和精确的病变分割，如图 4。在工作的下一阶段，将帧 1 中数据集 1\
  \ 的直方图均衡化图像作为特征选择的输入，如图 5。\n\n![图 3. 边缘检测输出](img/fig2_3_B.jpg)\n\n图 3. 边缘检测输出\n\n\
  ![图 4. 恶性 ISIC_0025234 图像的阈值输出](img/fig2_4_C.jpg)\n\n图 4. 恶性 ISIC_0025234 图像的阈值输出\n\
  \n![图 5. 帧 1 中图像的直方图均衡化](img/fig2_5_C.jpg)\n\n图 5. 帧 1 中图像的直方图均衡化\n\n## 基于遗传算法的特征提取\n\
  \n识别最有效的特征是皮肤病变检测的关键部分。对于建议的数据集 1 和 2，估计了尺寸、图像对比度、颜色、纹理、灰度共生矩阵 (`GLCM`)、平均能量和形状特征（Gaikwad\
  \ et al., 2021; Maurya et al., 2014; Barhoumi et al., 2007）。从这些特征中共估计了 26 个属性。文献综述论文中的特征对比见表\
