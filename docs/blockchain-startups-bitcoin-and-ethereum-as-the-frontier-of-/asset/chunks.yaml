    # 第 3 章 流动性与采用


    所有涉足加密资产的公司和个人共同构成了一个规模与成熟度不断增长的生态系统。市场若无流动性便会消亡，因此我们需要了解加密货币流动性的运作方式。交易量之所以增长，是因为更多人将法定货币兑换为加密资产，并将一种加密资产交易为另一种。公司关系的数量也在增长，因为每家新公司或新市场都能扩大可能交易的规模和范围。就像自然界一样，这个生态系统不断发展，并从一个阶段进入下一个阶段。例如，交易者为交易所创造需求，进而为做市商创造需求，两者共同为数据和软件专家创造需求，进而为分析师、培训课程和会议创造需求。新的加密资产可以催生新行业，例如定义以太坊上基本代币的智能合约——ERC-20
    标准——引发了代币销售（即首次代币发行，ICO）的热潮，进而创造了对营销服务的需求。所谓稳定币（即与法定货币挂钩的代币）的发明，创造了带抵押品借贷和杠杆投机的市场。此外，现在可以将在线游戏中的数字物品以独特代币的形式放入区块链。玩家和投机者在公开市场上交易这些代币化的游戏内资产。我们可以预期，新型资产的发明者将创造其他新市场。作为企业家，你需要在这个日益成熟的生态系统中定位你的使命。在第
    6 章中，我们将更详细地讨论代币化持有。目前，我们将这些例子视为进步的证据：拥有活跃用户的加密资产证明，这个行业不仅仅是投机泡沫或科学实验。尽管这项技术尚处于起步阶段，我们已经取得了长足进步。当我在
    2013 年初发现比特币时，拥有比特币需要技术专长。此外，还需要运气；你只能在某些地点买卖比特币，而唯一的公共比特币交易市场是位于日本的 Mt. Gox。我一听说比特币就想买一些，但当我预见到将我的钱（泰铢和欧元）汇入日本银行的麻烦时，我放弃了。此外，我过于担心钱包设置的安全性。我觉得在长期持有比特币之前，我必须先了解更多关于钱包的知识，才能信任自己。后来，我为某人做了一份写作工作，对方提出用比特币支付，但我拒绝了，因为我看不到任何花掉它的方式。这些比特币流动性方面的挑战现在已经结束了，至少对于像我这样的人来说。随着时间推移，处理加密资产变得更加舒适，从而使其能够被更广泛的用户群体所使用。


    加密资产这些市场的整体增长有三个限制因素，类似于机械系统内部的物理摩擦：


    • 入口和出口——用法定货币交易加密资产，类似于汽车通过入口匝道进入高速公路。道路上的交通顺畅稳定，而入口匝道和出口匝道是汽车可以匹配并调整速度以适应其他交通的地方。当任何人想要用法定货币交易加密货币时，速度会减慢到法定货币的速度。当你使用现金时，你必须当面见面。如果交易者互不认识，他们必须建立信任或考虑人身安全风险。当你电子转账法定货币时，你的交易必须遵守银行关于“反洗钱”（AML）和“了解你的客户”（KYC）的规则。这些规则往往迫使你限制交易规模，并要求解释资金来源。监管机构要求他们这样做，作为维持其货币传输许可证的条件。


    • 易用性——交易、发送和接收资金及加密资产的体验决定了哪种人可以参与生态系统。对于任何给定的案例或人类型，完成交易或传输的过程有一定数量的步骤，每个步骤都有一定的难度或易度。这个人是否被迫思考？用户界面调用了哪些概念？需要多长时间？需要多少培训？他们能向他人展示吗？这些元素中的每一个都增加了移动资金和资产的总摩擦量。


    • 流动性——任何资产在任何价格水平都有一定数量的买方和卖方，这决定了买卖是否容易。例如，出售或购买房屋需要几周或几个月，因为需要找到愿意接受交易另一方的人。还需要时间将该交易与同一价格范围内的其他选择进行比较。汽车的流动性稍好一些，但动态类似。相比之下，当你用一种法定货币交易另一种时，几乎没有摩擦，因为有如此多的人在买卖，以至于根本不需要费力去寻找买方或卖方。货币是经济中最具流动性的资产。加密货币和其他加密资产的买方和卖方比法定货币少，因此其流动性仍类似于食品或金属等商品。低价或低交易量的加密资产流动性较低，这增加了系统的摩擦。


    你可以将每个摩擦来源视为一项创业挑战。无论你是遵守监管机构还是绕过监管机构，你都在提升入口和出口。自动化交易步骤或使用更好隐喻的软件，将使加密资产对新用户可访问并开辟新市场。谁
    ever 连接买方和卖方的孤岛，谁就在“做市”并提升该资产的流动性。我们可以将这个生态系统与 19 世纪和 20 世纪的金融市场进行比较。似乎加密资产可以至少同样复杂。它可能遵循类似于互联网的轨迹，互联网去中心化了出版和通信，同时赶上并超越了传统方法的复杂性。加密资产的增长潜力似乎类似于
    20 世纪末的互联网。有大量工作要做，也有许多回报可收获。作为加密企业家，你可以预期 2020 年代将会蒸蒸日上。每当你摆弄加密资产并感到烦躁、无聊、困惑或沮丧时，你都在看着一个可以有所作为并赚取加密财富的机会。企业家寻求解决难题，并将解决方案交付给快速增长的客户群。加密资产领域的关键问题是什么？内部人士经常讨论的话题包括：


    • 易用性——如何使交易更容易。

    • 扩容——如何提升给定区块链网络的交易容量。

    • 私密交易——人们会如何使用不可追踪的货币。

    • 互操作性——如何在特定区块链与其他软件协议和应用程序之间交换数据。

    • 监管——谁决定谁可以使用哪种加密资产做什么。

    • 新应用——如何将比特币背后的洞察应用于非金融领域，如公司治理、政治和非营利组织。


    这些关键问题中的大多数都会给加密资产用户带来摩擦。对于初创公司来说，它们是需要解决方案的挑战。团队有责任将该解决方案构建为产品或服务。任何执行得当且提供合适产品的公司都可以从银行手中夺取市场份额。加密资产的每一次进步都将降低摩擦，并推动市场走向主流采用。更好的入口、出口和用户体验将吸引新的用户群体，从而提升流动性，使加密资产更具吸引力。整个行业是一个自我维持的正反馈循环。从中期来看，似乎潜在用户群体（如投资基金、网上购物者和零售购物者）的需求不足。本书的其余章节将为你提供攻克这些关键问题的角度。针对特定货币或金融产品用户解决其中一个或多个问题，你就有很大机会将初创公司打造成一家与传统银行竞争的蓬勃发展的公司。


    ## 连接加密圈


    许多比特币爱好者预期比特币将经历三个采用阶段：首先，它表现得像一种商品，成为价值储存手段，如黄金、债券和房地产。人们购买它以持有，以保护财富。随着比特币变得更加被接受，它进入第二阶段：成为交换媒介，即商品和服务的支付方式。如果流动性曾经等同于法定货币且价值稳定，它可以成为记账单位，这意味着人们将用比特币计算商品和服务的价格。一些比特币爱好者已经用“聪”支付账单，这是“聪”（satoshis）的缩写，即你可以发送的最小比特币单位的名称。你可以将一个比特币分为一亿个聪，这似乎是一个荒谬的大数字。开发者选择这个数量，是为了迎接比特币达到最后采用阶段并成为记账单位的可能未来。在那个世界里，单个比特币的价格非常高。当爱好者用聪支付餐馆或酒店费用时，他们正在为比特币广泛采用的未来做准备。总结来说，当你可以储蓄、用它支付并能以其设定价格时，一种商品就成为货币。在当下，比特币和其他顶级加密货币仅作为那些希望将其作为价值储存手段的人之间的支付方式。他们将比特币视为一种更好的储蓄和投资方式，并欢迎获得更多比特币的机会。他们持有它以保持财富流动但安全，并附带高升值的额外好处，因为许多人相信，从中期到长期，比特币的价格将随生态系统的增长而上涨。如果供应商接受，公司会花费比特币和其他加密货币，而他们的客户可以用比特币支付他们。同样，作为消费者，当你知道在哪里花掉它时，你更有可能想要赚取它。赚取、储蓄、投资和花费这些活动可以形成一个完整的循环。一种商品只有在完成这个循环后才能成长为货币的功能；当没有人怀疑他们能够很好地使用这种货币，因为其他人会将其作为支付方式接受时。目前，这些完整的交易循环规模小且孤立。当这些循环增长并连接时，比特币的价格上涨，从而提升流动性和需求。这就是为什么迄今为止交易加密资产的公司最为盈利。与自然界的类比是先锋植被：一个不断增长的生态系统始于贫瘠的土壤，没有太多养分。只有少数几种植物能够茁壮成长。这些物种的植物材料是其他物种可以生长的基础。同样，加密货币交易公司、交易者和做市商正在从加密资产发展的早期阶段中受益，因为法定货币仍然占主导地位。他们是其他加密物种生长的基础。买方、持有者和卖方的孤岛最初是孤立的，而交易所连接了这些循环。但它们目前的局限性在于，它们只为法定货币和加密资产对做市。大多数交易者、投机者或消费者都从用法定货币兑换加密资产开始。例外是工作量证明矿工，他们用电力兑换加密货币，以及那些将加密货币作为商品和服务支付方式接受的人。加密经济是法定货币到加密货币的交换。帮助人们将法定货币卖给加密资产的公司最为成功，因此连接仅加密货币交易的循环是大多数资产交易所的核心业务。当他们擅长在法定货币和加密资产之间的边界进行交易时，他们就能赢得客户。这些公司的例子包括：


    • 加密货币到法定货币借记卡——你会得到一张像其他借记卡一样的卡，只不过你花费的资产是加密货币。在实践中，这意味着当你用这张卡支付时，发卡公司会出售你的一部分加密资产，以换取你刚刚支付的账单的法定货币。他们会从该交易中抽取一定比例。

    • 专业交易——存在特定市场，愿意为加密货币支付溢价，或愿意以折扣价出售商品以换取加密货币。几年前，Pulse.io 提供了一种方式，如果你用比特币支付，可以在亚马逊产品上获得相当大的折扣。有些人将亚马逊礼品卡作为薪水或奖金。他们更喜欢流动性资产，而不是他们可以在亚马逊上购买的物品，并且需要与那些想在亚马逊购买物品的人进行交易。比特币是这种交易的完美货币。Pulse.io
    已经停止运营，但它是一个很好的例子。

    • 新支付处理器——企业家有时会发现对进行特定类型支付的需求。当前模式是比特币钱包公司 Zap 的应用程序，它允许客户用法定货币支付网店，而商家收到比特币。这种支付绕过了用法定货币交易加密货币及反之的摩擦。内部人士经常观察到，使加密货币不可见是推动采用的重要一步，而
    Zap 是一个绝佳的例子。

    • 稳定币——以太坊和其他智能合约区块链使代币化资产的转移成为可能，其中一种资产可以是法定货币。另一个好名称是“加密美元”。我们可以期待以后会有其他代币化法定货币。这些加密资产具有像法定货币一样的稳定价值，并且你可以像加密货币一样传输它们。如果持有者想要限制对加密资产波动性的敞口，购买稳定币是一种兑现的方式。此外，他们不再依赖必须遵守“了解你的客户（KYC）”法规才能向客户提供法定货币的交易所。


    这些诱人的例子展示了我们可以交换加密货币的未被探索的方式。


    ## 资金转移的隐喻


    这种跨越边界的交易摩擦是笨拙的“入口 - 出口”隐喻的起源，该隐喻类似于人们过去用来描述互联网的过时“信息高速公路”。在未来，我们需要一个更好的隐喻来描述小型、封闭的买方和卖方圈子变成更大封闭圈子的过程。合适的隐喻将激发更好的用户体验设计，因此是一个创业机会。更好的隐喻示例是扫描仪或雷达，用于寻找交易。名为“Radar
    Relay”的去中心化交易所的名称就指向这一点。其他交易公司也接受了这个隐喻。然而，这些交易所中的大多数只交易加密资产。理想的交易所将允许任何人以点对点方式用任何法定货币购买任何加密资产。这个交易所将具有自动用户界面。例如，用户只需说明资产的期望比率或水平，软件将处理交易以达到这些水平。加密货币的一种潜在交易者类型是商家，他们拥有作为营运资金的货币。商家从客户那里收取资金，并必须使用其中一部分资金支付给供应商。目前，至少一部分供应商希望收到法定货币。因此，每个商家对加密资产和法定货币的期望比率各不相同。此外，一些客户希望将部分储蓄持有为加密货币。在进行商品和服务交易时，商家和客户越来越需要重新平衡他们的持有量。持续交易要求商家重新平衡法定货币与加密货币的营运资金，客户重新平衡法定货币与加密货币的储蓄。在仅法定货币经济或仅加密货币经济中，这种重新平衡不会发生，因为重新平衡不需要法定货币到加密货币的交易；余额始终完美。相反，在部分法定货币、部分加密货币的经济中，人们需要重新平衡。只要经济中既有法定货币又有加密货币，我们就需要交易所和稳定币来处理重新平衡的摩擦：这就是为什么交易服务和稳定币需求量大。迄今为止，交易所、场外交易商和做市商一直是最盈利的加密公司。在大多数经济生态系统将仅使用加密资产的未来，交易所将获得更小的利润率。为了全面提升流动性并推动采用，我们需要客户和商家使用加密货币和其他加密资产进行和接受付款。一种货币拥有的持有者、接受者和支付者越多，持有、接受和花费该货币就越有意义。任何货币要成功，都必须具有流动性。法定货币因发行它的国家的经济力量而变得流动性。越多人用商品和其他货币兑换一个国家的货币，就越容易找到愿意将该货币作为支付方式接受的人。交易者网络会发展起来交换大量这种货币，以至于这种货币的单笔交易无法影响价格；市场足够大，可以吸收供需冲击。相比之下，较小的市场，如个别股票，对供需变化敏感。一部分买方和卖方可以进行该股票的大额交易，这会比法定货币更快地推高或压低价格。法定货币的流动性是一种可取的品质：资产越流动性，价格越稳定。短期储蓄的人持有现金头寸，以准备公司或个人生活中的未知情况。当未来不确定时，现金具有储存价值的功能；你通过持有现金来为风险和不确定性做准备。持有货币的人和公司希望货币的价值尽可能稳定。比特币和任何其他加密货币的潜力来自其技术特性，这些特性可能超越商品地位并成为货币。技术特性使这种数字商品具有优势，激励买方群体将其作为货币持有和花费。当孤立的群体连接成闭环时，他们实现了更多这种货币潜力。将商品转变为货币的机制表现为网络效应。根据
    Investopedia：网络效应是一种现象，即人数或参与者的增加会提升商品或服务的价值。互联网是网络效应的一个例子。最初，互联网用户很少，因为对于军队和一些研究科学家以外的任何人来说，它都不重要。然而，随着更多用户获得互联网访问权限，他们产生了更多内容、信息和服务。网站的开发和改进吸引了更多用户相互连接并进行业务往来。随着互联网流量的增加，它提供了更多价值，从而导致网络效应。一种商品只有在大量人同意其具有价值时才能成为货币。作为货币的实用性可以超越其作为商品产品的原始价值。然后，商品的价格有两部分：作为商品的价值和作为货币单位的价值。比特币的特性和优势使其网络效应难以超越。想想你购买或出售给定加密资产是容易还是困难。与替代币相比，找到有人交易比特币相当容易，因为有更多人同意比特币有用。这种递归逻辑导致第一种加密货币的铁一般主导地位。其他加密资产可以尝试用如此吸引人的特性来挑战比特币的主导地位，以克服比特币的网络效应。比特币并非靠自动驾驶保持其主导地位。新兴加密货币不断挑战比特币，因此它必须保持比竞争对手更好，否则将成为遗迹。数字稀缺性不仅指单个
    BTC 代币，也指网络效应本身的强度。建立一种新货币非常复杂，以至于第一个足够好的加密货币 BTC 也是稀缺的，因为它被广泛接受。稀缺性不仅限于供应有限；市场对该资产的需求必须超过对类似资产的需求。比特币的优势似乎很大，因为货币的网络效应比例如音频载体（如光盘和磁带）或软件即服务的网络效应更加强大。尽管你可以设想出在某些方面比比特币更好的系统，但这个竞争者必须克服比特币网络已经获得的所有现有流动性、品牌认知度、安全性和社区优势。在可预见的未来，这不太可能。其他加密货币仍然可以通过瞄准比特币留下的利基市场在生态系统中取得成功。然后，这些替代方案的成功取决于主导加密货币的技术限制。例如，人们对扩展网络容量、隐私与审计便利性之间的权衡，或共识算法有不同意见。这些观点中的每一个都导致人们推出更多替代币。比特币为关于数字货币的讨论提供了动力，许多人对创造新型货币感到兴奋。货币和金融的游戏现在是一个开放的领域，自由玩家可以在其中竞争。


    ## 加密资产的原因


    依赖加密货币的公司确实扩展了网络，使得增长带来增长。当激励措施一致时，正反馈循环可以滚雪球般变成雪崩。当生态系统中的每个参与者都想要另一个参与者拥有的东西时，交易量就会增长。为了了解这些人的动机并看看是什么促使他们移动加密资产，我们可以通过买家角色的视角来看待他们：一种理想化和简化的客户类型，带有一个解释其动机和激励的故事。软件公司通常通过头脑风暴这些买家角色，给他们起名字，然后想象这个人正在使用他们的软件，来澄清他们对市场的思考。我们将研究加密资产的买家角色，因为加密资产软件中的摩擦始终关于与技术交互。在我们讨论后续章节的技术之前，我们首先需要知道将使用硬件和软件的人的类型。在这个阶段，你的客户是创新者或早期采用者。他们希望你的加密产品获得优势，这与他们的动机有关。我们可以在金融或货币目标的背景下理解加密货币用户的买家角色。这就是为什么我们必须定义这些日常动作在加密资产中的应用：赚取、储蓄、投资、投机和花费。


    ### 赚取和花费


    当你向愿意放弃该加密资产的人出售产品、服务或劳动时，你可以赚取加密资产。如果该资产流动性足够，法定货币价格相对稳定，那么交易中的摩擦就会容易克服。这是因为你不再需要用法定货币购买这种资产。你需要与拥有该资产且愿意出售的人进行交易。那个人也必须愿意成为你的客户、顾客或雇主。我们可以预期一个未来，大多数加密资产的收入都是加密货币，因为这些货币具有可以使其成为最具流动性的特性；它们最初就是为了被赚取而设计的。截至
    2020 年撰写本文时，赚取或花费加密货币在以下情况下最有意义：


    • 创始人和员工遍布全球、生活在并前往多个司法管辖区的地理位置独立公司。在法定银行系统内，支付这些团队是一项艰巨的任务。记账和汇款变得昂贵且耗时。你可以用加密货币支付所有人，因为团队成员可以在当地出售他们的加密货币。这种交易比公司将其持有的任何货币兑换为特定团队成员居住国的法定货币更自然。

    • 通过接受加密货币来吸引新客户的公司。一些持有者寻找花费的机会，作为兑现投机收益的方式。直接花费他们的持有量可以节省将其兑换为法定货币的成本。

    • 想要持有加密资产且拥有高利润产品或服务的公司所有者；他们只需出售一部分以用法定货币支付供应商，并持有加密资产或将其兑换为其他加密资产。

    • 针对有争议的项目、公司和非政府组织的不可审查的支付和捐赠。当你为抵抗战斗、抗议或其他活动筹集资金，当你销售灰色地带或黑市药品时，收款一方有对手，例如国家行为体、情报机构或恶劣的竞争对手。他们想阻止传入的交易，并愿意为此承担一些成本。在理论上，这意味着你的区块链的强度必须与他们的力量相匹配。在实践中，任何支持流动性加密货币的区块链都会有这种强度。

    • 针对一些可以在网上出售的非法商品的私下黑市交易。这是执法机构与黑市卖家之间的军备竞赛。一些加密货币不断增强隐私功能，而执法机构分析区块链和网络流量以抓获非法交易。

    • 针对托管服务、色情、赌博或卖淫的敏感支付——任何你可能希望保持私密的商品或服务。加密货币永远不会出现在你的银行或信用卡账单上。此外，你还可以避免因消费这些产品和服务而被法定支付提供商切断。

    • 如果收入从未进入银行账户，税务规划和潜在的避税将变得更容易。它们就在那里，在区块链上的一个假名地址，等待被花费或洗钱。如果所有者愿意承担被起诉的风险，他们可以尝试避税。在他们将资金转移到与其身份相关的另一个地方之前，他们有合理的否认权。当然，他们会尽可能延迟这种与身份的关联。在法定系统中，交易各方和金额为银行所知，因此可能为税务机关所知。虽然我不赞成避税，但我遇到过一些人，加密货币是他们税务规划拼图中的一部分。

    • 在低信任社会中，使用法定货币进行电子商务是不可能的。在线商家无法接受信用卡支付，因为信用卡被盗的可能性很高，信用卡公司会撤销交易。他们无法接受 PayPal，因为这些交易可以被撤销，并且拒绝承担已发货货物的举证责任。同样的限制也适用于低信任行业且退款率高的行业，例如赌博和色情。在低信任关系中，只有愿意预先付款且买方或第三方无法撤销的买家才能进行在线购买。卖家必须在发货前获得付款最终性的保证。比特币和其他加密货币可以保证这种最终性，从而赋能新的电子商务。


    在赚取加密货币时，一个摩擦来源是你的支付系统。当你通过网店销售产品时，你需要自动化支付接受、账单和记账。处理这些支付的软件必须符合交易双方的需求。这个支付解决方案市场是新鲜且动态的，因为加密货币和交易它们的人都在快速变化。这个市场上有几个重要参与者，但没有保证他们能保持地位。拥有金融科技经验的软件企业家可以寻找进入这个不断增长市场的机会。从技术角度来看，花费加密货币与赚取类似。摩擦发生在发送方和接收方之间，例如在钱包和交易所之间，或在比特币借记卡和销售点系统之间。此外，花费者还考虑到一些加密货币是通缩的，也就是说，它们可能变得更加稀缺，因此更有价值。这增加了花费的摩擦，因为该资产还具有作为价值储存手段的实用性。你估计继续持有该资产作为储蓄的一部分所能获得的收益。然后你将其与计划花费的商品的好处进行权衡。当你花费法定货币时，不存在这样的考虑。对于加密资产，储蓄和花费比法定货币更加对立。


    ### 储蓄、投资和投机


    我们持有资产是因为我们期望它能在未来保持或提升我们的购买力。加密资产持有者，或亲切地称为“HODLers”，假设其他人将来想要持有、赚取或花费该加密资产，因为它将是无法阻止、安全且便捷的支付或投资的最佳选择。储蓄者希望应对意外或在可预见的未来购买特定的“大宗商品”。你在资金增值的同时保持其安全。如果你的储蓄是法定货币，银行会将其安全保管。但现在你有选择依赖密码学。你可以用新的方式保障储蓄安全。引入个人密码学后，对某些人来说，存储价值可能比在银行中更安全、更自然。我们将在钱包技术章节中讨论一些细节。投资者希望随时间保持价值并从中产生回报，例如购买一处房地产并出租。我们可以想象，代币化房地产在拥有钱包的人之间交易会变得更加自然。你不再拥有一栋建筑或房地产的集合投资，而是可以将房产分成许多小块，这些小块在拥有钱包的人之间可交易。对比特币和其他顶级加密资产未来价格的投机是价格的主要驱动力。BTC、ETH
    和其他可用资产的具体好处有限，并非当前价格水平的原因。要解释价格，我们必须考虑未来。加密资产承诺了一系列与货币和金融相关的未来好处，你可以通过持有来投机。关于未来的故事各不相同且不稳定，价格波动由反复无常的投机者驱动。然而，加密资产已经可以成为你投资组合中的工具，因为它们是一种新的资产类别，价格往往与其他资产独立波动。加密资产的光明未来只有在特定买家角色和用例中带来好处时才能成为现实。我们可以通过提出以缺乏开头的问题来探索这个可能性空间。例如：


    • 普通 BTC 交易对于小额支付来说成本太高。

    • 电汇对于零售支付来说太慢且太昂贵。

    • PayPal 对于商家接收电子商务支付来说不够安全和最终，因为它们可以并且确实会冻结你的账户。

    • 信用卡公司向商家收取每笔支付的百分比，并在 60 天后最终确定支付。

    • TransferWise 对于黑市交易来说不够开放。

    • 信用卡公司和 PayPal 不会处理某些药品的在线购买支付。

    • 信用卡支付对于在线购买药品或有争议的捐赠来说不够“言论自由”。

    • 储蓄账户和国库债券对于长期储蓄来说不够安全，因为存在货币通胀或债务人彻底崩溃的风险。

    • 纸币不适合远距离支付。

    • 非正式支付网络太慢或不安全，因为易受第三方影响。


    随着货币成为一种自由灵活的媒介，我们可以期待这些问题消失。这些容器并不限制依赖加密货币的经济。货币就是货币：为什么任意的媒介或你财富的托管人应该决定你如何持有或花费它？一旦你看到理想货币的特性，你就会渴望超越特定媒介的这些限制。我们将在下一章探讨理想货币的机会。企业家和投资者保罗·格雷厄姆在他的文章《如何获得创业点子》中讨论了创业点子的来源。他建议的方法归结为：“活在未来，并做那些看起来有趣的事情。”另一种说法是：注意缺少什么。现在我们已经了解了加密资产可能如何被使用，我们回顾几个这些创新买家角色的例子，看看加密资产如何进入他们的现实，以及他们对先进货币形式持有何种观点。在当前加密领域创办公司的企业家将至少向这些买家角色中的一个销售。了解你向谁销售是有价值的。


    ### 早期采用者作为潜在客户


    关心加密货币有多种原因，每种想法都激励着一种加密爱好者。这些不同的爱好者帮助增长给定加密资产的网络。关心加密货币的这些原因通常结合在一个人身上，有一两个动机处于前沿。这些人出现在会议和聚会中详细讨论加密货币和代币；他们通常专业地从事加密资产工作，或投资了一部分储蓄。在埃弗雷特·罗杰斯的创新扩散模型（1962）中，他们是愿意且能够承担新技术风险的创新者。作为企业家，你可能关心创新者的意见。你能吸引他们的想象力并激励他们采取行动吗？这是你的产品必须通过的测试。他们购买能推动其加密旅程前进的应用程序、平台和加密资产。你希望他们认可你的产品或服务。在
    2020 年撰写本文时，加密货币已扩散到扩散的下一阶段，即早期采用者：那些言行一致的意见领袖。他们将故事推向早期大众。当我们汇总所有这些旅程时，我们就得到了一个大趋势：用健全货币、不可阻挡的代码、加密资产和去中心化金融取代法定货币现状。我遇到的所有加密爱好者都表现得像以下五种买家角色中的一种或多种：


    #### 爱玩的开发者


    软件开发者构建系统。他们在学习和实验中可能看起来很严肃，但他们的工作更像是创造性的游戏。解决问题是他们的娱乐。他们喜欢摆弄硬件或软件，并且通常在技术领域有工作或自由职业生涯，具备开发软件的技能。他们因解决设计和架构问题以使系统运行而获得报酬。他们总是在寻找更多可以玩耍并完成事情的工具。目标是构建一些新奇和新颖的东西。当开发者对区块链技术感兴趣时，他们关注工具的可能性。他们查看代码，看看如何利用它构建支持新型交易的系统。开发者工具痴迷的缺点是陷入技术兔子洞的风险，从而忽略大局。当花太多时间在代码细节上时，他们错误的想法会出现在他们用来描述区块链的隐喻中。他们关注树木而看不见森林。例如，我遇到过一位区块链开发者，他将“不可变性”特性比作“纸牌屋”，这是错误的。他关注哈希函数如何依赖于输入，这使他选择了一个象征脆弱的意象。然而，不可变性的品质需要一个唤起沉重和坚固事物的意象，例如“冰川中的层”，适合描述交易的不可变性。另一个让我惊讶的例子是遇到专业的以太坊开发者，他们从未思考过货币的起源。他们非常详细地了解特定加密资产的工作原理，但不欣赏这些资产运作的更广泛背景。专业化有机会成本。爱玩的开发者关心比特币和其他区块链技术，因为它定义了一个构建新小玩意和系统的可能性领域。他们可以类比于
    90 年代的青少年，他们从印刷电路板电子学转向计算机编程，因为任何新事物都很酷。作为加密领域的亲手建设者，我们发现开发者担任供应商、创始人或员工的角色。他们使用的许多资源都是开源或低成本的。作为早期采用者，他们很可能成为其他类型之一的客户。


    #### 冒险的创业者


    创办一家公司是雄心勃勃的，而创办使用比特币、区块链或加密资产的初创公司的人往往具有“超凡脱俗”的个性和对未来的愿景。大多数企业家是通才，能够看到大局。有些人在与其行业相关的几个领域是专家。此外，他们具有吸引力和领导力，能够围绕自己聚集一支团队。像史蒂夫·乔布斯或埃隆·马斯克一样，他们的激情和活力产生了一个“现实扭曲场”，支持一群拥有共同目标的专家的投入产出比。比特币、以太坊，也许还有其他区块链将使企业家能够去除中间人。企业家因开辟市场和颠覆主导该领域的既有垄断势力而感到兴奋。X
    世代和 Y 世代的企业家在直觉上了解颠覆，因为他们亲眼目睹了互联网从一个玩具成长为全球公用事业。现在他们想利用不可变区块链的颠覆力量，去中介化拥有传统金融系统的既得利益者。企业家的挑战是选择正确的项目。很容易将梦想推得太远，在任意行业上贴上区块链标签，并祈祷投资者、潜在团队成员和客户能看到光明。这种仓促的区块链初创公司是一次糟糕的赌注。一个好的创业点子来自于了解你所在行业的问题并熟悉你的工具。此外，你首先要了解你客户的情况。假设“区块链”可以解决例如你最喜欢的供应链的基础设施惯性是鲁莽的。如果你要“为无银行账户人群提供银行服务”，你最好确切了解你的初创公司如何比目前服务于该人群的非正式关系网络更好地转移资金。区块链企业家可以通过放慢速度来保护自己免受糟糕创业点子的影响。他们可以研究比特币和以太坊的基础知识和近期历史，以熟悉项目可能失败的方式。你的区块链初创点子的质量测试是火中取粟：你能否向早期比特币爱好者（通常被称为“原始帮派”）推销你的想法，并回答他们尖锐的问题？这些讨论的最佳场所是比特币聚会和区块链会议上的鸡尾酒会。或者，如果你有良好的网络影响力，可以向你的追随者提问。如果你和你的想法在辩论中能够立足，你的初创公司就状况良好。然而，如果一位加密老兵能用一个神奇的问题就将计划化为乌有，你最好还是带着受挫的自尊心退出，而不是烧掉投资者的钱。正如我在引言中所建议的，企业家是我的主要受众。似乎这种类型的加密爱好者将对加密资产在社会中的扩散产生最大影响。他们将不得不承担将这项技术推向主流的风险。如果企业家是你的客户，目标是将他们与加密投资者联系起来。在旧金山、香港、新加坡等科技中心，已经存在一个连接资本与劳动力的活跃生态系统。我们可以将
    2017 年达到顶峰的 ICO 热潮视为去中心化该生态系统的第一步。散户投资者现在拥有类似天使投资人和风险投资家（VC）的选择，他们需要工具来理解可用的交易。此外，企业家需要工具来组织代币销售并处理支付。尽管
    ICO 市场存在成长的阵痛，但初创资金的全球化和民主化是一个太大而无法忽视的趋势。向全球散户投资者市场发行代币可能比向天使投资人和 VC 精英出售更快。尽管科技中心有大量资本可用，但与全球可用的资本相比，这个数额微不足道。大规模且高速的风险投资在加密资产的未来中有一席之地。作为企业家，你可以为最佳想法的快速便捷融资做好准备。


    #### 活动家、无政府主义者和自由意志主义者


    一部分加密爱好者追求个人自由。他们有政治动机，并将他们的加密资产视为活动工具，以对抗他们认为不公正的制度。无政府主义者和自由意志主义者对财产权持有少数派观点，并抵制一些获取和捍卫物质财富的主流方法。有些人反对知识产权。有些人反对特定税收或一般征税。其他人不同意政府对暴力和法律的垄断。自由的爱好者关心给定加密资产可以支持的政治影响。中央政府与个人之间新的权力平衡可能意味着向更美好社会的经济过渡。活动家试图消除不公正的权力。对于隐私倡导者、无政府主义者和自由意志主义者来说，比特币带来了新的希望。与其就政府财政和法定货币进行无果的辩论，他们可以创造、购买和花费他们偏好的货币。加密资产的存在使他们能够退出与其价值观不符的金融系统。无政府主义者和活动家将使用保护他们免受监控和审查的软件。他们想要私有互联网和假名身份，以支持言论自由、结社自由和交易自由。这些工具越容易获得，就越主流。例如，许多观察家预计会出现一个去中心化的社交网络，可以取代
    Facebook 和 Twitter，后者正因隐私和审查丑闻而失去声誉。目前，集中式社交网络“更好”，因为它们快速且容易。一旦出现你可以在其中保持私密和不可审查且不失去便利性的社交网络，集中式社交网络就会被颠覆。几家初创公司已经构建了适合关心隐私和匿名性的人的身份系统和协议。假名和匿名身份及评级系统可以成为加密资产未来的一部分。我们只需要有人来构建它们。


    #### 交易者


    交易者旨在低买高卖。成功的交易者依赖于决定性的信息优势；你比市场上的其他参与者知道得更多。作为交易者，你看到一个对手还不知道的未来现实。要持续获利，你需要理解和经验来发展这种优势。你的竞争对手正在使用最好的数据和算法，你需要一些能给你带来优势的东西。交易有着陡峭的学习曲线。学习交易就像成为医疗专业人员；参加急救课程不等于上医学院。学习四年按摩疗法不等于十五年后成为神经外科医生。医学精湛是一门深奥的学问，“日内交易”和套利在深度和复杂性上类似于医学技能。然而，与医学专业知识不同，交易的风险和回报各不相同。大多数进入市场的人都会将钱输给最先进的专业人士。我们根据交易者的时间范围对其进行分类：套利者从不同市场之间的价格差异中获利。他们在交易所使用交易机器人，或与其专业网络中的买方和卖方“场外交易”（OTC）加密资产。在理想情况下，套利没有风险，因为你同时买入和卖出，从两个市场之间的价格差异中获利。这些机会窗口开启和关闭都很快。日内交易者全天坐在屏幕后面，使用图表和算法分析市场。他们经常使用运行优化算法的机器人来寻找和执行最佳交易。日内交易需要钢铁般的神经和静坐的能力。许多加密交易者之前在在线扑克行业有过职业生涯，或使用杠杆交易法定货币（外汇）。头寸交易者会在市场中进出数周或数月，以跟随趋势。你可以用较少的时间投入来做到这一点，因为它不像其他类型的交易那样劳动密集。但获利更难，因为你不太可能拥有信息优势。HODLers
    投资并计划永不出售；他们赌他们持有的资产将取代法定货币，用于储蓄、支付以及对产品、服务和投资定价。HODLing 需要长期的时间视野，以及对所持加密资产的理解和信念。这种策略仅限于市值最高的资产，例如
    BTC、ETH、瑞波币和顶级隐私货币。作为一个群体，交易者正在寻找帮助他们分析市场并将其与新机会联系起来的工具和数据。你可以通过构建更好的交易所、平台或数据来源来吸引他们成为客户。


    #### 行业服务提供商


    区块链行业有大量的建设和教育工作要做。技术仍然粗糙、晦涩且令人困惑。加密资产被新市场进一步采用需要流畅的用户体验和讲故事。有工作要做，营销人员、设计师和教育工作者已经开始为开发加密相关产品和服务的初创公司提供服务。时机得当，他们可以站在历史的正确一边。作为服务提供商，你可以通过在不断增长的行业中工作来获得优势。一方面，风险更大，因为客户更少，市场不成熟。另一方面，服务提供商可以建立先发优势，并在大众出现之前在舒适的利基市场中立足。这些新的服务提供商对时机和势头有着敏锐的感觉，认为比特币、区块链和加密资产是下一个大事件。他们帮助构建生态系统的企业家和开发者。这些人往往是设计师、教育工作者和营销人员。这些支持性服务提供商的出现表明，创新者正在与早期采用者建立联系，后者人数更多。最初，典型的加密爱好者属于其他四种类型，例如开发者、交易者和无政府主义者。突然之间，出现了大批拥有市场营销和传播背景的人。他们受到在激动人心的事业中应用技能的机会所激励——加密领域从这批人才中受益。


