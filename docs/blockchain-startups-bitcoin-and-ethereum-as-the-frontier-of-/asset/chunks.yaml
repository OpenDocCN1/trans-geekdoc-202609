    # 第 2 章 政治企业家


    无论你作为一名有志于成为加密货币企业家的目标是什么，你的成功都将颠覆货币和金融的现状。这些组织掌握着权力：它们控制着自己的局面，并能够为自身利益影响未来。如果你取代了这种现状，你就能完成使命并保持组织的健康。你的成功是掠夺性的；它依赖于从现有机构中获取能量。我们必须研究创业精神与政治权力之间的关系，以便了解监管机构和银行可能对加密组织施加的压力类型。请注意，在创业语境中使用“权力”一词是多么不寻常。权力是一个政治概念，而传统的初创公司与政治关系不大。老派企业家将法律法规视为既定事实，并顺其自然地行事。大多数企业家都避免与政治潮流相悖所带来的摩擦。只有那些技术影响社会趋势、行动主义和选举结果的最成功的企业家才会变得政治相关。如果政客们已经对颠覆性的媒体格局有所顾虑，正如我们在
    Facebook 和剑桥分析公司案例中所见，那么我们可以预期，随着颠覆性货币的引入，这种冲突将会升级。因此，当加密初创公司将参与政治权力作为其商业模式的一部分时，它更有可能成功。你将会获得那些曾经是精英机构囚徒的客户。初创公司为其利益相关者创造和赚取的新加密资产将权力和财富从传统金融机构中夺走。


    ## 带有政治利齿的自由市场技术


    互联网是二战后开始的去中心化总趋势的催化剂。当时，大部分社会由大型公司和大型政府组织。人们享受着由大众媒体（如电视、报纸和广播）广播的统一文化（Tim Wu，《主控开关》，2010
    年）。信息技术侵蚀了报纸和电视等传统媒体，同时通过留言板和社交媒体赋予了边缘群体和个人权力。我们现在生活在一个“定制”的社会，拥有不同的生活方式、茧房和回声室。西方社会尤其高度民主化，权力分布在大量机构和选民中。信息技术倾向于使社会更加开放和扁平，层级更少，并且倾向于以周期发展。首先，发明者使一种新媒介可用。随着企业家学习该媒介的商业角度，公司为市场而争夺，直到信息通过公司渠道从生产者流向消费者，并由政治现状进行策划和审查。软件正在吞噬世界（Marc
    Andreessen，《华尔街日报》，软件正在吞噬世界，2011 年）。例如，由互联网连接的计算机已经吞噬了邮寄信件、报纸、广播、电视、音乐和书籍。货币和金融行业长期以来对这一趋势免疫。自
    1944 年布雷顿森林协议以来，流通中的所有货币都依赖于中央政治权力。布雷顿森林体系由黄金支撑，但在 20 世纪 70 年代初结束，当时美国停止将黄金兑换为美元。然而，货币的政治基础依然存在：从那以后，在几乎每个国家，中央银行创造法定货币，用于实体纸币支付或持牌银行之间的电子转账。人们信任法定货币进行支付，是因为这种政治支持。创造货币是主权实体的特权：为了赢得信任，组织需要政治权力来主张和捍卫印钞的唯一权利。企业家没有理由将货币和金融视为价值主张，因为这种政治依赖排除了私人实体的竞争。执法机构已经并且将会关闭任何创建成功的私人数字货币的公司。破坏国家主权没有意义，因此软件行业没有尝试构建“吞噬”货币和金融的产品。关闭一个成功的加密货币要么是不可能的，要么是
    prohibitively expensive（成本极高的）。比特币拥有免受政治干扰的记录；在防御方面它很滑溜，对任何管理不善其货币供应和公共财政的中央银行或政府都是一种间接威胁。此外，银行不再是金融进步的守门人。任何初创公司都可以在加密货币之上提供金融或支付服务。随着加密货币流动性的增长，这些新的金融服务将把客户从银行那里吸引走，甚至可能吸引保险公司、投资基金和其他金融机构。


    ## 加密货币是一个虚拟管辖区


    三个技术问题阻止了私人去中心化货币的发行：双重支付问题、去中心化共识以及新货币的可证明公平发行。在加密货币发明之前，这些障碍阻止了稀缺性的保证，而稀缺性是人们信任资产作为货币所必需的。比特币的推出开辟了新的竞争领域。私人各方现在可以依赖软件进行交易和存储价值。数字稀缺性给任何人提供了一种选择：你可以选择在封闭的公司网络上使用法定货币进行交易，或者使用去中心化的加密货币和交易所。这种选择将侵蚀银行的权力。加密货币企业家必须理解政治权力在货币体系中的作用。就目前而言，让我们假设政治行动不是你战略的标准部分。对典型企业家来说，政治行动看起来像是一场无回报的游戏。创办公司的人不太可能考虑从政，除了已经成名的亿万富翁。相反，一位崭露头角的企业家相信自由市场、自愿交易、正和博弈、开放创新、满意的客户以及通过公平竞争赚取的利润。这些价值观与政治行动关系不大。然而，法定货币的力量是政治性的，要颠覆它，你的信息技术需要具有匹配并超越这种力量的利齿。你可以说，不可更改的区块链是一个全球性的、自愿的、虚拟的管辖区。你也可以称其为“智能管辖区”，用于“智能合约”。比特币和以太坊不在特定地点；它们在互联网上运行，作为一个全球且分布式的网络。在去中心化系统中，人们进行交易，但他们的资产并不位于特定地点。当人们被识别时，可能会受到传统管辖区或另一个管辖区的约束，但这是新技术，规则的适用方式模糊、新颖，并且很可能未定义。这对于选择为其交易的所有后果（无论好坏）承担责任的人来说是一个优势。无论你在玩什么金融游戏，那里都没有自动权威。这个领域是自由和开放的。除了赚取收入这一狭义例外，如果监管机构对你的交易有意见，发现和调查的负担在于他们。你不需要请求许可；相反，他们必须来找你并解释规则，如果他们甚至愿意费心的话。例如，如果国际旅行者记住了一个未申报的、价值一百万美元加密货币的钱包密钥，他们是否违反了必须申报价值超过一万美元现金的规则？与既有银行体系相悖的主权实体已经在使用加密资产——引用克劳塞维茨的观点——作为以其他手段延续政治。如果朝鲜和伊朗的政客们使用加密资产实现他们的目的，难道其他人就不能这样做吗？作为普通人，我们不习惯像主权者一样思考和行动，但我们可以对自由货币的可能性持开放态度。


    ## 建立在去中心化货币之上


    随着比特币和以太坊获得更多类似“法律”的能力和更多筹款功能，它们可以与依赖传统法律的国家竞争。它们成为虚拟管辖区：与国家竞争的类国家实体。作为这些主权实体的代理人，企业家必须实践外交。这片自由领土与大约五个世纪前在某些地方发生的政教分离有相似之处（Erik
    Voorhees，《比特币杂志》，货币与国家的分离是新的政教分离，2015 年）。天主教会失去了对其宗教领土的独家权威，也失去了对物理区域的管辖权，让渡给了国家。同样，国家和银行将失去对货币和金融的影响力（Martin
    van Creveld，《国家的兴衰》，1999 年）。我们已经有去中心化货币的历史例子：黄金、白银以及私人银行发行的银行券。当政府和银行成立中央银行来发行货币时，这种去中心化货币就消失了。加密货币将重新引入去中心化货币，并附带近乎即时的全球支付的额外好处。法定货币的运作方式类似于私人银行的银行券，但它由政府债务支持。中央银行在公开市场上购买金融产品，通常是政府债券。它用自己创造的货币支付这些债券。部分货币是纸币，但大部分是资产负债表上的数字。这意味着政府债券成为中央银行资产负债表上的资产，而创造的货币是其资产负债表上的负债。中央银行以利息将这笔钱贷给私人银行。当它出售债券并收回法定货币时，可以销毁这笔钱。这就是它控制流通中总供应量的方式。其他受监管的私人银行也可以通过“部分准备金”制度发行货币。它们可以贷出比从中央银行或客户那里收到的更多的钱，因为它们可以预期大多数客户会将钱留在银行。有关中央银行和货币创造的更多细节，请参见
    Investopedia。法定货币体系依赖于公众的信任。中央银行只能流通人们相信能够很好地保值的货币。而普通银行在保留一部分准备金的同时发放贷款。大多数客户将钱留在银行，且在任何给定时间，只有少数客户会提取他们的钱。只要客户相信他们可以随时提取钱，银行就可以维持这种部分准备金制度。当这种信任破裂时，就会出现所谓的银行挤兑。如果大部分客户试图提取钱，而银行手头没有足够的法定现金来履行这些义务，那么该银行就需要中央银行或政府充当最后贷款人。如果没有更重要的贷款人可用来支付“挤兑”银行的义务，那么它就会破产。这是一个复杂但集中的系统。加密货币爱好者正在致力于一个银行不再必要的未来。加密货币和智能合约将取代银行，尤其是创造法定货币的中央银行。我们可以预期加密货币和加密资产将继承银行业的特征，然后我们可以看到全球金融呈数量级增长。这些新公司将与客户分享这一新金融体系的好处，这些客户最终将包括所有人。加密货币正在对所有银行发起缓慢但深思熟虑的挤兑。


    ## 自由领土


    作为一名从主权带来的权力中分一杯羹的企业家，你必须记住：关键不在于你做什么，而在于你得罪了谁。中本聪说，比特币给我们这些加密货币用户带来了“几年”的自由。他承认你无法在密码学中找到政治问题的解决方案，但“我们可以在军备竞赛中赢得一场重大战斗，并为几年赢得一块新的自由领土。”（Phil
    Champagne，《中本聪之书：比特币创始人中本聪的著作集》，2014 年）这个“自由领土”是加密货币企业家的一个核心理念。哪些技术扩大了这个自由领土？支持隐私、资产可互换性以及消除通信或交易摩擦的技术。正如中本聪所说：“政府擅长切断像
    Napster 这样的中心化网络的头颅，但像 Gnutella 和 Tor 这样的纯 P2P 网络似乎能够自保。”比特币的第一次自由考验是丝绸之路的运营，它被称为“毒品的
    eBay”，在那里去中心化货币证明了对监管和执法机构的胁迫具有抵抗力。人们在隐藏的网站上交易非法商品，并且至今仍在这样做。丝绸之路的创始人 Ross Ulbright
    确实被抓住了，因为他贪多嚼不下。他得罪了执法机构，以至于他们对他采取的力量超过了他的运营安全所能应对的程度。其他早期比特币爱好者，例如 Charlie Shrem，与金融监管机构斗争。曾经托管匿名交易的交易所现在面临压力，需要让客户实名。并非所有依赖区块链的公司都能捍卫其所赋予的自由。然而，比特币网络本身已经经受住了烈火的考验。到目前为止，似乎没有人能阻止这个实体。理解为什么比特币是不可审查的，是你对加密资产教育的重要部分。任何在灰色地带提供产品或服务的企业家都必须为与监管机构的斗争做好准备。交易所、加密货币
    ATM 提供商、场外交易者和代币化资产发行者都在这个灰色地带运营。你打算在已知品牌下运营，在雷达之上吗？那么你的企业在开始之前就需要专门的法律建议。你的高管团队需要包括一位有切身利益的律师。另一种选择是将你的活动隐藏得如此之深，以至于监管机构不会费心阻止你。这样你就可以利用加密货币带来的创新，而不会增加风险。例如，小型但专业的场外交易商可以通过持有加密资产库存来谋生。根据大多数司法管辖区的法律，他们需要货币传输许可证并遵守
    KYC/AML 法规。然而，因为他们交易的金额要么很小，要么在雷达之下，所以监管机构不认为值得费心。他们可以继续工作，因为到目前为止，他们没有得罪任何人。另一个例子是发行代币而不向监管机构注册。有些人运行的项目非常小，他们愿意承担无监管业务的风险，而不是接受获得许可的成本。如果一家初创公司想要在规则方面擦边球，同样，最好团队里有一位律师。与比特币相反，以太坊尚未在与国家级对手的冲突中经受考验。以太坊的创始人不是化名，他们以公司和基金会的形式组织起来。以太坊的批评者怀疑它是否能抵御来自国家级行为体的攻击。以太坊需要一个丝绸之路时刻，以证明它能够抵抗监管机构和执法机构。


    ## 你需要多少安全性？


    比以太坊更小的区块链面临额外风险。它们由较少的工作量证明挖矿或实验性挖矿算法保护，因此普通黑客可以尝试所谓的双重支付攻击，这会破坏用户对受害区块链的信任。此外，这些项目检查代码中漏洞和利用点的开发者更少。一个不可更改且安全的区块链在多个层面都很昂贵：用于工作量证明挖矿的能源投入、开源领导力和管理，以及吸引新开发者和企业家加入生态系统。似乎区块链需要变得庞大并保持领先，才能不可更改且安全。比特币的创建者设计网络是为了一个他们预期会惹恼国家级行为体的目的；工作量证明挖矿的安全性与这一威胁相匹配。按许多金融标准，比特币是转移和存储资金最安全的方式。挖矿、买卖的博弈论使安全成本保持准确：如果比特币价格上涨，挖矿变得更有利可图，从而吸引更多矿工。每台新的挖矿设备都会将更多电能投入到链的安全性中。虽然有些人称这种工作量证明安全性不优雅且浪费，但我们可以将比特币视为一个公平的市场，将电能转化为金融安全。以太坊的安全性水平仍然是一个悬而未决的问题，因为它对工作量证明挖矿的使用是勉强的。领导层认为工作量证明是一个临时解决方案，同时他们正在开发一个安全的权益证明模型，该模型不消耗电力或硬件，但允许所有者通过制作交易区块来赚取费用。如前一节所述，另一个漏洞是开发以太坊的组织的公开性质。开发团队组织在一个基金会中，似乎比比特币的团队更具层级性。这个清晰的组织可能会面临监管机构或政客的压力。即使运行网络的节点保持独立，一些行为体也可能施压团队，迫使他们构建他们想要的功能和后门。如果以太坊因审查而失败，那将验证以太坊经典的主张，它具有固定发行政策、未来致力于工作量证明，并且没有集中式基金会。以太坊经典将吸引那些需要“顽皮”智能合约、能够抵御强大潜在审查者的初创公司。虽然以太坊可能在国家级攻击的压力下失败，但它可能仍然有足够的安全性来支持一组不那么重要的金融应用。非争议性公司仍然可以依赖以太坊的区块链。政府和监管机构可能不会费心施加压力来阻止这些较小的颠覆。初创公司可以考虑其对手的手段和动机，并寻求免受这些威胁的保护。另一类加密资产，游戏资产，需要更低的抗审查能力。不得罪当权者的普通资产，只需要为交易双方提供结算保证。以太坊和其他区块链比中介或机构做得更好。没有必要让每个区块链资产都过度安全以抵御审查，这暗示了一个多区块链共存的未来。资产的安全性取决于成本、风险和回报。我们会拿到我们珍视的东西并将其保持安全。无论这些东西是有形的还是无形的，这些成本和风险都是物理性的。挑战在于为我们的每件贵重物品找到合适的安全解决方案。考虑一个简单的金属锁。经常骑自行车或摩托车的人对其两轮车需要的锁有直观的认识。在大多数城市，一辆新的或经典的高端品牌摩托车需要一把价值至少
    100 美元的锁。一个拿着金刚石切割工具的坚决小偷可以在十分钟或更短时间内打开那把锁；然而，如果奖品停在路灯下的开阔地带，小偷就不会得到那个机会。一辆标价
    200 美元的自行车通常配一把 30 美元的锁就很安全，但前提是将其固定在路灯柱或栅栏等硬点上。有些自行车已经生锈到不值得被偷。在某些司法管辖区，当局对车辆盗窃行为惩罚严厉，因此你可以不加额外锁就停放摩托车。每件财产都有一个威胁模型，迟早，所有者会熟悉它。为了保持你的加密资产安全，你只需将该逻辑应用到你的数字环境中。数字资产有数字锁和钥匙，以防范使用数字工具的小偷。我们将在后面章节中探讨数字钱包安全的具体细节。目前，我们认为保护信息在基础上与保护实物是相同的。即将到来的加密公司浪潮将有助于将物理安全概念转化为数字领域。一旦这种转化完成，加密资产将拥有数字化的所有优势，却没有任何缺点。届时，它们将成为日常生活的一部分，作为我们轻松使用的后台可信实用工具。由密码学保护、运行在基于区块链的虚拟管辖区上的加密资产，作为一种新常态出现，促进权力从中央行为体向广泛的对等社区重新分配。始于互联网的去中心化和分裂力量，随着加密资产将进入第三档。


