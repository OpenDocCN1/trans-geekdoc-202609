    # CHAPTER 6 Tokenized Assets


    As communication and payments become ideal, frictionless transactions could change
    how people trade various assets. A popular blockchain can anchor transactions
    of assets other than money. Bitcoin and Ethereum are the current best candidates
    for such blockchains and would become a new and virtual jurisdiction. First, we
    will distinguish blockchain tokens from cryptocurrencies and other assets, and
    will view blockchain networks as platforms for the future of finance. After that,
    we look at the types of tokens that can live on these networks and what opportunities
    arise from them. Creating a digital token representing a specific asset has an
    advantage: it expands the market for that asset, giving it greater liquidity.
    The owners of the tokenized asset can buy or sell it much faster than an ordinary
    investment. That by itself makes the asset more valuable. The token can represent
    a financial agreement, such as a debt, a physical property, gold or real estate.
    Porting the administration of such traditional assets over to a blockchain can
    make trade more efficient. However, the best chance of sparking opportunities
    comes from new types of assets, which cannot exist or be traded without digital
    tokens defined by a smart contract on a blockchain. For example, game-based digital
    items can interact and combine to make new and unique items, such as minting new
    digital trading cards or breeding creatures with individual digital genomes, which
    creators and owners can trade in a global marketplace.


    ## Difference Between Currency and Tokens


    As explained previously, the Ethereum network lets developers deploy smart contracts
    that define ETH flows on its blockchain or enable tokens. Many teams have launched
    these tokens to fund projects and to bootstrap a circular economy. To understand
    how these tokens work, we must first distinguish this type of crypto-asset from
    cryptocurrency. We call them “coins,” but that seems an attempt to link them with
    the success of Bitcoin. The word coin refers to a currency that circulates widely.
    Traditional, physical coins do not represent anything else. They have a value
    of their own because they are scarce and valuable, either because of:


    • the precious metal they are made of;

    • the issuing central bank’s precious metal;

    • the fiat rights of the central bank.


    Cryptocurrencies mimic the qualities of coins and paper cash. In contrast, tokens
    are not like cash but resemble laundromat or train ride tokens, or casino chips.
    They are portable objects that have value in a specific context. A token on a
    blockchain is a cryptographically secured digital asset that entitles the holder
    to something. Usually, it is a promise or guarantee made by the issuer. A token’s
    value may be set by the issuer, as with casino chips, or imposed by the market,
    like physical commodities or collectible items. Even if the market determines
    the price, you might still need the issuer’s technology, such as a website, to
    interpret the token. For example, imagine you are holding a digital cat token,
    a CryptoKitty, in your wallet, which you can only see or breed by connecting your
    wallet to the CryptoKitties-website. That means the ownership is decentralized,
    but not necessarily the asset’s utility.


    A cryptocurrency has value because the units, analogous to physical coins, are
    scarce and circulate widely. Both these qualities are united in virtual objects,
    the currency units on the blockchain. As described in previous chapters, these
    properties can catalyze a network effect. The units become a currency as increasing
    amounts of people use it. In contrast, tokenized assets are scarce because tokens
    themselves are scarce or even unique, while their value depends on the asset they
    represent. The liquidity and scarcity of tokens depend on the network they reside
    in, but to appraise them, we also need to estimate the underlying asset’s value.


    Since the launch of altcoins and tokenized assets, some have tried to classify
    these new crypto-assets. Investors, speculators, and entrepreneurs need such a
    classification system to understand what they are buying or guide the design and
    issue of a token. In this chapter, we will only look at crypto-assets from the
    perspective of an entrepreneur who wants to create their own, for a) funding a
    project and b) bootstrapping a circular economy.


    ## Blockchain Security Dilution


    Bitcoin is the new standard for ideal money, with settlement assurances orders
    of magnitude more robust than any other monetary good (Nic Carter, It’s the settlement
    assurances, stupid, 2019). It can serve as an anchor for smart contracts denominated
    in Bitcoin, including international transfers, payment rails, savings, contractual
    agreements, and derivative financial products. For the first time in history,
    these markets are global and neutral, with BTC’s value as a single yardstick.
    It is universal in the same sense that people now calculate global prices in USD,
    and it is neutral in the spirit of gold: the value of—and control over—gold can
    hardly be influenced by a single actor, at least in the long term. Opportunities
    to build these financial functions and products will grow with software development
    that will expand on the Bitcoin network. We discussed the possibilities of Lightning
    Network in chapter 4.


    Ethereum’s goals from the outset have been different from those of Bitcoin. Although
    their vision has changed over time, Ethereum founders have always tried to build
    a system with more possibilities and lower security level. Early critics often
    mentioned the drawbacks of “a larger attack surface.” At the moment, critics deride
    ad-hoc improvisations to technical problems and fickle goals for the future. It
    seems that these criticisms are valid yet do not refute the central point: Ethereum
    is different enough from Bitcoin to blaze a trail with experiments, and is successful
    enough as measured by market capitalization. It is an open-source blockchain that
    keeps many people interested because a few times a year, a team launches something
    radically new on Ethereum. These novelties include the ERC-20 standard for tokens,
    the Decentralized Autonomous Organization (DAO), CryptoKitties, MakerDAO, bonding
    curves, etc. These novelties tend to multiply but can get in trouble. They can
    fail, have a crisis, or collapse, causing a loss for the risk-takers who bought
    the related assets. These problems lead to criticism, yet Ethereum has a track
    record as a platform for launching new crypto-assets to an existing user base:
    those who already own and use ETH. Any competing blockchain will have to overcome
    that network effect.


    Bitcoin critics who focus on the cost of proof-of-work mining believe in new altcoins
    with a different consensus algorithm. The most common variant is proof-of-stake,
    which awards the block reward according to the amount of currency the miner, or
    “block producer,” has locked-up into a smart contract. Instead of ‘betting’ electricity
    on their block’s validity, block producers bet this staked amount on their commitment
    to producing honest blocks. Alternatively, a system can include voting and reputations
    for ‘delegated proof-of-stake.’ However, these types of algorithms are vulnerable
    to a political balance of power. Network participants want cheaper transactions
    on the blockchain, but drawback is a need for governance. To limit the cost of
    the network, developers have to dilute the safety of transactions. Introducing
    governance to a blockchain seems strange to many Bitcoiners because they believe
    in transcending the need for governance through proof-of-work consensus. Governance
    tends to centralize. Bitcoiners accept the drawbacks of proof-of-work because
    they value decentralization, as an aid to immutability and censorship resistance.
    To them, decentralization is more important than the efficiency of transactions.


    It seems that consensus algorithms that can replace proof-of-work mining are an
    open question for the blockchain industry. Future research and security breaches
    will reveal if governance-based asset networks will win the trust of the market.
    We have to see who wants to transact digital assets that are not quite unstoppable.
    Will people dare to transact pirate business on Ethereum without trouble?


    ## Ethereum as a Laboratory


    Although Ethereum is more centralized than Bitcoin, it might be decentralized
    enough. Its founders are betting on an organizational structure with identifiable
    people. It is a natural path to issuing a token that represents a claim to an
    asset. On the other hand, detractors see this organizational structure as evidence
    that the founders of Ethereum do not understand Bitcoin in the first place. They
    expect Ethereum and its organizations to fold under pressure from adversaries
    with the power of a nation-state. What will they do when influential politicians
    call their Switzerland office, demanding a ‘hard fork’ to shut down an ICO crowdfunding
    his or her opponents?


    Regardless of the Ethereum blockchain’s long-term security issues, many exciting
    projects have found a home there. The success of some of these projects, and their
    tokens, attract new buyers of ETH and more developers to the ecosystem. So far,
    this network effect keeps Ethereum alive and growing. Developers continue to build
    secondary protocols for Bitcoin, such as the Lightning Network and sidechains,
    expanding Bitcoin’s inherent capabilities. We can imagine how the best applications
    of Ethereum smart contracts could also work with Bitcoin. If bitcoins are a universal
    payment method, and Ethereum’s best smart contract applications enter the mainstream,
    some of these could succeed in the Bitcoin network. For now, we have no way of
    predicting the future success of Ethereum versus Bitcoin. As an entrepreneur,
    you can keep up with the developments in both ecosystems until you spot an excellent
    opportunity. While you choose a product or service to build, know that you are
    tying the company’s future to the network you build on.


    ## Tokenized Fundraising


    Since the ICO boom, which ran from 2016 to early 2018, we know that one use of
    smart contracts is fundraising. Instead of getting money from a bank, angel investor,
    or venture capital firm, you can source investment capital from anyone, anywhere,
    as long they have a wallet with crypto-assets. That expands the potential playing
    field of investment and funding a hundred times over. The amount of wealth that
    could exist as investable cryptocurrencies in crypto wallets could exceed the
    amount of money under the control of professional investors. Also, tokenized investing
    without anyone’s permission speeds up the funding of projects, while investors
    can cash out faster. Many prefer investments that triple in value in six months
    to ones that grow ten times in value but take five years.


    The most straightforward type of funding is issuing security tokens. These resemble
    traditional shares, entitling the holder to a portion of the company’s profits.
    Shareholders are registered in government authority databases that oversee financial
    markets, while banks and brokers intermediate the trading of these shares for
    their clients. Security tokens disintermediate these third parties. A company
    can create a token, say that they represent a share in the company’s profit, and
    promise to pay out these profits to any token holders. The blockchain maintains
    the record of ownership, instead of a central authority. Cryptography secures
    transfer between owners, instead of go-betweens.


    The open playing field for issuing tokens comes with a new risk: new token buyers
    are often not protected by the regulations of conventional financial markets.
    That attracts teams who are better at selling than building things, which includes
    outright scammers. Optimists maintain that the market will have to learn these
    lessons, while pessimists expect these dynamics to be the downfall of tokenized
    assets. No matter the outcomes of tokenized funding in coming years, the genie
    is out of the bottle. Regulators will have to battle entrepreneurs who organize
    funding opportunities from competing jurisdictions. When ordinary people, often
    called “retail investors,” get a taste of outsized returns on investment, they
    will want to keep accessing these opportunities. Meanwhile, fundraisers will learn
    how to align incentives across stakeholders and mitigate the risk of scams, market
    manipulations, and unsophisticated investors.


    In traditional finance, these regulations developed around the turn of the 20th
    century, with the rise of retail investors. Some crypto-professionals claim that
    security tokens misapply blockchain technology. Shares divide a corporation into
    pieces and entitle the shareholder to voting rights and profit. This type of organization
    is hundreds of years old, just like writing letters and contracts with ink on
    paper. Launching a security token resembles the post office launching a website
    that publishes its address, phone number, and opening hours while failing to prepare
    for a future in which email replaces most of their service. The only situation
    I view as fitting for a securities token is pseudonymous ownership of a traditional
    corporation. When a financial regulator allows the trade of pseudonymous tokens
    within their jurisdiction, it makes stock ownership possible for anyone, including
    people without a brokerage account. That still looks quite traditional. I think
    that crypto-innovators should aspire to more.


    For instance, the funding of brick-and-mortar companies can improve with tokenized
    shares or products. You can crowdfund on a global scale because you can tokenize
    your future products, which are then tradable. For example, the owners of traditional
    small businesses, such as restaurants, often need bank loans. With the launch
    of crypto-assets, they can instead sell prepaid meals to defer the risk to the
    customer. By giving a significant discount to future customers, they could disintermediate
    the bank. Moreover, you no longer need to put up collateral. This decentralization
    of small business finance allows a broader range of people to start a restaurant
    or other brick-and-mortar companies.


    Another example: let’s say you wanted to start a software company in a developing
    nation. You can get funding from anybody. What Kickstarter.com did for consumer
    products, tokenized assets can do for technology companies and service companies.


    ## Designing Circular Economies


    The section above shows how tokens can benefit the founders of issuing organizations.
    Entrepreneurs can get funding for their projects, but that does not in itself
    make tokens valuable. Tokens have to add value for other stakeholders in the project,
    or fail as an economic instrument. Tokens add friction to the experience of the
    product, therefore entrepreneurs who put a product behind a token ‘gate’ have
    to justify that choice. Why should people install a wallet for crypto-assets,
    go to an exchange to buy the token, or sign up on your website to receive them?
    They will only do so if the token gives them access to otherwise unavailable assets.


    The first generation of tokenized assets show the challenge of designing a token
    that circulates well. These markets often have two sides: the platform for trading
    serves both buyers and sellers. The issuer opens a marketplace for a tradable
    resource, for example computing power (Golem) or data storage (Filecoin). The
    plan is for suppliers to get paid in the coin, and to sell it for fiat currency
    or cryptocurrency to pay their suppliers or to take profit. The token circulates
    between these parties as payment for resources. It also allows anyone to hold
    the traded supply in reserve, use it later, or rebalance when needed.


    An asset representing access to a network or platform will have prices that follow
    the benefits and value of that network. As the number of people who use that network
    grows along with the system’s usefulness, demand rises. Token holders can sell
    their tokens for a profit, instead of using their tokens to access the network.
    This token-mediated exchange of resources can cause a conflict of interest between
    stakeholders. The issuer chooses the number of tokens in circulation, while the
    utility, i.e., the benefit to the users, depends on the resource’s demand. The
    economics are described in the ‘Benefit and Scarcity Matrix’ (Sehra, Smith & Gomes,
    The Economics of Initial Coin Offerings, Allen & Overy, 2017). This type of token
    can end up in four positions:


    • Highly available, but not so useful: challenging to circulate, unstable price.

    • Scarce, but not so useful: mainly held by speculators, regulators could view
    it as a security.

    • Scarce, and useful: leads to hoarding and deflation, causing friction in the
    market for the tradable resource.

    • Highly available and useful: stable price, but requires a tangible product or
    service with known demand.


    Some projects resolved these tensions between stakeholders by issuing their tokens
    slowly, adjusting the release to marketplace demand. The role they play in their
    token economy is similar to that of a fiat currency central bank; the token holders
    have to trust them to manage the supply and serve the interest of all the stakeholders.
    While that seemed to be an innocent responsibility with the first generation of
    digital assets, centralized management is against this technology’s spirit, so
    we can expect future projects to issue tokens with distributed control.


    Token designers are experimenting with ways to give stakeholders a proportionate
    voice or control in a project. Entrepreneurial teams are ‘failing their way forward’
    to the right models for token governance, such as with the Ethereum Decentralized
    Autonomous Organization (DAO), proof-of-stake models, and MakerDAO. A standard
    to live up to is the decentralized, yet stable operation of the Bitcoin network.
    Bitcoin proves that stakeholders can maintain a delicate balance of power within
    a system of incentives, without any party having the final say. The question that
    other projects are exploring is, in essence, how to infuse other systems with
    the same qualities.


    Once a blockchain network is widespread, none of the participants, whether they
    are traders, holders, miners, or developers, can force changes to the system against
    others participants’ interests. If any of these groups try to change the rules,
    but the others stick with the software that applies the original rules, that means
    the rule-changers will only have a smaller, isolated network. In the jargon of
    open source software, this is called a ‘fork.’ The network effect ensures that
    a forked blockchain network is only as valuable as the number of people joining
    it. A new project with a new model for keeping a balance of power gets scrutinized
    on its degree of decentralization—To what degree can its open transactions resist
    authoritarian censorship? As Bitcoin or Ethereum inspire you, and you build something
    new, how will you make it live up to the standard set by these systems?


    ## Game-Theoretical Balance


    A decentralized network depends on a careful balance of interests between the
    decision-makers inside of a financial ecosystem. The strategic interactions of
    these decision-makers is described by a branch of mathematics called game theory.
    The designers of the novel Bitcoin-inspired systems tweak the candidate network
    parameters, aiming to support transactions. Besides the technical challenges related
    to cryptography and computer science, the design must foster relationships between
    mostly pseudonymous decision-makers. Each type of network participant needs reasons
    to a) play by the rules and b) enforce the rules for others.


    Game theory informs the design of a stable blockchain network. The balance of
    rules and interests is critical; the founders of any project either borrow a proven
    model or attempt to invent a new one. So far, Ethereum is home to most of these
    experiments. In 2020, a branch of these experiments called ‘decentralized finance
    (DeFi)’ shows promise. It started with creating pseudonymous and transparent versions
    of ordinary banking products, such as savings and loans. The first decentralized
    stablecoin, Dai, results from a strategic balance between the holders of multiple
    tokens. As I write this, some teams are launching financial products that have
    not existed before, and cannot exist, within the methods of traditional finance.


    The stablecoin Dai deserves special mention because it supports many other products
    in decentralized finance. A stablecoin, or crypto-dollar, which is entirely transparent
    in supply and function, is a must-have for the current adoption of crypto-assets.
    Later on, crypto-dollars could become obsolete, but as it is, the players in this
    ecosystem need assets to protect them from unwanted volatility. Furthermore, Dai
    is a case study in achieving strategic balance in the sense of game theory. As
    an entrepreneur launching a token, you benefit from knowing how that balance works.
    An entrepreneur’s education starts with Bitcoin, continues with Ethereum, and
    advances with MakerDAO’s Dai stablecoin. You can read an overview of the functioning
    of Dai in the MakerDAO whitepaper.


    ## Non-Fungible Tokens


    Besides currency and tokens, another class of crypto-assets relies on non-fungible
    tokens. If Bitcoin is ‘money with a blockchain,’ then a non-fungible token is
    ‘a collectible with a blockchain.’ “Fungible” means that one unit of the token
    is interchangeable with any other. If you receive a payment in dollars, bitcoin,
    or ETH, you don’t care which specific units you receive, when they were minted,
    and where they have been before. A coin is a coin, just as with fiat currency
    and casino chips. In contrast, a non-fungible token that the owner can send from
    one blockchain address to another is not interchangeable with any other token.
    It represents or refers to a unique asset.


    Examples of assets that could become non-fungible tokens are:


    • Individual, secure, but tradable digital identities.

    • Title deeds of real estate, vehicles, and works of art.

    • Digital collectibles such as digital art or rare items inside of a game or virtual
    reality.

    • Digital tickets for events and travel.


    Non-fungible tokens introduce a new dimension of scarcity to the supply and demand
    of an asset. In the case of crypto-currency, its blockchain guarantees the rules
    that govern the issuance and transfer of the token. These public and verifiable
    rules ensure the scarcity of each of the units of the token. A non-fungible token
    relies on its blockchain to provide an additional guarantee: the token is X-of-a
    kind. There is a limited number of units of this token in circulation, where for
    most use cases, it is unique and refers to a single asset.


    The applications on non-fungible tokens I listed above are all promising. However,
    they each have unresolved issues. I am excited about the individual attempts of
    some existing projects, and I recommend these areas as sources of entrepreneurial
    opportunity. Besides financial applications, the area that is showing the most
    promise is online games. Gaming startups that figure out how to make online gaming
    more enjoyable for players can tap into a vast market.


    ### Digital Collectibles in Games


    Non-fungible tokens were first applied successfully in a game by AxiomZen, as
    part of the game CryptoKitties, launched in 2017. The goal was to collect, breed,
    and trade cartoon cats. The cats have genes that interact and can express specific
    traits. The challenge for the players is to figure out how a trait depends on
    which genes to breed rare cats. You can sell a cat for ETH, or you can rent it
    out for breeding. Some breeders have made quite a lot of ETH playing this game.
    Other players must have lost money if they invested in a collection while the
    market was peaking or failed to breed the kitties with profit.


    The technical progress behind the CryptoKitties-game is that each cat is unique,
    with genes defined by a smart contract, and ‘lives’ as a token at the owner’s
    address on the Ethereum blockchain. The game engine interprets the token and renders
    the smart contract’s computer code as a visible cat on the game’s website. When
    a player breeds two cats, a new token is minted by combining and updating the
    tokens referring to its parent tokens. The rules introduce scarcity in two ways:


    First, when a cat breeds, there is a cooling-off period before it can breed again.
    Each time it breeds, this period increases so that the cat becomes a slower breeder.

    Second, later generations breed slower too.


    The most valuable cats have rare traits, are first-generation, and have bred little
    or not at all. Cats with normal genes, of later generations, and much offspring
    are so common that no one wants to buy them. They sit at the player’s Ethereum
    address and game profile, just being cute.


    The company behind CryptoKitties used the features of the Ethereum blockchain
    to move computer gaming forward. They needed a robust platform for smart contracts,
    with a native and widely traded token—like ETH. Players no longer depend on the
    gaming company to steward their in-game assets, particularly, the cats. As tokens
    at an Ethereum address, players have full control over them. Transactions and
    breeding results are immutable. Although they still rely on the central game engine,
    which runs on the company’s servers, anyone could build a game engine that interprets
    the tokens and renders them as cartoon cats on a website.


    Representing in-game items as tokens gives rise to another possibility: developing
    a new game that repurposes pre-existing digital assets. For example, KittyRace
    lets you race any of your CryptoKitties against those of other players. You bet
    ETH on your kitty, and the winner takes the pot. These game mechanics led to some
    players breeding cats with features that made them good at winning races: a feedback
    loop between the two games about the same set of in-game assets. Another project
    is KittyHats, to outfit your cats with apparel and accessories. These projects
    suggest that a robust network effect will bring more players and developers, inspired
    to build new decentralized games that use the existing in-game assets.


    CryptoKitties is a proof of concept for rare digital in-game assets. Before this
    game, people who handled cryptocurrencies and tokens were motivated by technical
    innovation, financial gain, or political activism. CryptoKitties proved that people
    would transact a crypto-asset because it was collectible; Kitties are not always
    assets to be sold; they can be valuable and exciting for their own sake. Players
    can enjoy breeding, collecting, and trading cats, without any interest in the
    technology that makes it possible. Even though most of the players were crypto-enthusiasts,
    and many play for profit, they don’t have to. Just as Atari’s popular game Pong
    proved that computers could generate profits as entertainment platforms, CryptoKitties
    showed that blockchains can run for fun.


    Since CryptoKitties, several games were launched that use a blockchain to make
    the game elements scarce. For example, Gods Unchained is a strategy game with
    rare cards, which players can combine into even rarer cards. Just as with tradable
    cats, not every player has the same reason for playing. Some want to buy rare
    cards to win matches, while others want to combine and collect cards to sell their
    tokens for profit. The marketplace for cards is part of the game world.


    Another game in the making that uses digital scarcity is BeachHead 2020, a project
    that I was part of. BeachHead 2020 is a first-person shooter in virtual reality
    that plans to grow into a full virtual reality economy with scarce digital goods,
    such as weapons, fashion, cars, and land. It has the aesthetic of cyberpunk warfare,
    and real estate in the city will be limited, just as it is in Hong Kong or Manhattan.
    Players will have to stake BeachHead coin to get the title deed to real estate.
    Designing the finer points of this economy was an exciting challenge for the team.


    The use of a blockchain as an entertainment platform suggests new types of games
    with rare and tradable assets. The financial element blends the game world with
    the real world. Traditional online games stumbled into this phenomenon by accident.
    When massive multiplayer online role-playing games such as World of Warcraft became
    popular, a market grew for in-game items, in-game currency, and even whole characters.
    The virtual world Second Life also grew an economy of virtual goods. The economics
    of Fortnight show how players are willing to pay for purely aesthetic additions
    to their in-game character; virtual fashion is real. From the perspective of blockchain
    trades, these non-tokenized markets look clumsy. By having virtual items exist
    as tokens, they are much easier and safer to trade for currency. Furthermore,
    the possibility to take tokenized in-game assets into other games and virtual
    worlds means that game designers can catalyze feedback loops such as between CryptoKitties
    and KittyRace.


    ## Building the Next Phase of the Ecosystem


    Non-fungible tokens inside of online games are only one area poised for hypergrowth.
    In 2020, Decentralized Finance is heating up, with many projects launching volatile
    tokens. In previous years, Ethereum was hosting projects that made everyday financial
    products transparent, expanding on traditional financial transactions such as
    borrowing and lending with collateral. Projects use the Ethereum blockchain to
    create new financial products and techniques, such as bonding curves and flash
    loans. Beyond the heated speculation, teams on the cutting edge can imagine new
    financial instruments that traditional players cannot dream up.


    Virtual jurisdictions empower the fast growth of new kinds of blockchain assets
    built by entrepreneurs. Liberated from the permission of financial authorities
    such as banks, they create products involving money and contracts, without the
    limits imposed by arbitrary third parties. These new companies make up a growing
    ecosystem of stakeholders, enjoying opportunities in a wide-open field. Eventually,
    this can lead to Decentralized Autonomous Organizations (DAOs) that take over
    the market for laws and agreements. They can host contracts and regulations on
    a global scale, free from geographical jurisdictions. Say goodbye to the hassles
    of banks and go-betweens!

    '
  trans: '


    # 第 6 章 代币化资产


    随着通信和支付变得理想，无摩擦交易可能会改变人们交易各种资产的方式。一个流行的区块链可以锚定除货币以外的资产交易。比特币和以太坊是目前此类区块链的最佳候选者，并将成为一个新的虚拟管辖区。首先，我们将区分区块链代币与加密货币和其他资产，并将区块链网络视为未来金融的平台。之后，我们将探讨可以在这些网络上存在的代币类型以及由此产生的机会。创建代表特定资产的数字代币有一个优势：它扩大了该资产的市场，使其具有更大的流动性。代币化资产的所有者可以比普通投资更快地买卖它。这本身就使资产更有价值。代币可以代表金融协议，例如债务、实物财产、黄金或房地产。将此类传统资产的管理移交给区块链可以使交易更加高效。然而，激发机会的最佳机会来自新类型的资产，这些资产如果没有由区块链上的智能合约定义的数字代币，就无法存在或交易。例如，基于游戏的数字物品可以相互作用并组合，创造出新的独特物品，例如铸造新的数字交易卡或繁殖具有个体数字基因组的生物，创作者和所有者可以在全球市场上交易这些物品。


    ## 货币与代币的区别


    如前所述，以太坊网络允许开发者部署智能合约，这些合约定义了其区块链上的 ETH 流动或启用代币。许多团队推出了这些代币来为项目融资并启动循环经济。要了解这些代币的工作原理，我们首先必须将这种加密资产与加密货币区分开来。我们称它们为“币”，但这似乎是试图将其与比特币的成功联系起来。Coin
    一词指的是广泛流通的货币。传统的实物币不代表任何其他东西。它们本身具有价值，因为它们稀缺且有价值，要么是因为：


    • 它们由贵金属制成；

    • 发行中央银行的贵金属；

    • 中央银行的法定货币权利。


    加密货币模仿了硬币和纸币的特性。相比之下，代币不像现金，而更像洗衣店或火车票代币，或赌场筹码。它们是便携的物体，在特定环境下具有价值。区块链上的代币是一种经过加密保护的数字资产，赋予持有者某种权利。通常，这是发行者做出的承诺或担保。代币的价值可能由发行者设定，如赌场筹码，或由市场决定，如实物商品或收藏品。即使市场决定价格，你可能仍然需要发行者的技术，例如网站，来解释代币。例如，想象你在钱包里持有一个数字猫代币，一个
    CryptoKitty，你只有将钱包连接到 CryptoKitties 网站才能看到或繁殖它。这意味着所有权是去中心化的，但资产的实用性不一定是。


    加密货币之所以有价值，是因为其单位（类似于实物硬币）稀缺且广泛流通。这两个特性都统一在虚拟对象中，即区块链上的货币单位。如前几章所述，这些特性可以催化网络效应。随着越来越多的人使用它，这些单位就成为一种货币。相比之下，代币化资产之所以稀缺，是因为代币本身稀缺甚至独一无二，而其价值取决于其代表的资产。代币的流动性和稀缺性取决于其所在的网络，但要对其进行评估，我们还需要估计底层资产的价值。


    自从山寨币和代币化资产推出以来，一些人试图对这些新的加密资产进行分类。投资者、投机者和企业家需要这样的分类系统来了解他们正在购买什么，或指导代币的设计和发行。在本章中，我们将只从想要创建自己代币的企业家的角度来看待加密资产，目的是
    a) 为项目融资和 b) 启动循环经济。


    ## 区块链安全稀释


    比特币是理想货币的新标准，其结算保证比任何其他货币商品都要强大几个数量级（Nic Carter, It’s the settlement assurances,
    stupid, 2019）。它可以作为以比特币计价的智能合约的锚，包括国际转账、支付轨道、储蓄、合同协议和衍生金融产品。历史上第一次，这些市场是全球和中立的，以
    BTC 的价值作为单一衡量标准。它在人们现在用美元计算全球价格的意义上是普遍的，并且在黄金的精神上是中立：黄金的价值和对黄金的控制很难受到单一行为者的影响，至少在长期来看是如此。随着软件开发扩展比特币网络，构建这些金融功能和产品的机会将会增长。我们在第
    4 章讨论了闪电网络的可能性。


    以太坊从一开始的目标就与比特币不同。尽管他们的愿景随时间而改变，以太坊的创始人一直试图构建一个具有更多可能性和更低安全级别的系统。早期的批评者经常提到“更大攻击面”的缺点。目前，批评者嘲笑针对技术问题的临时解决方案和未来的反复无常的目标。这些批评似乎是有道理的，但并没有反驳核心观点：以太坊与比特币足够不同，可以通过实验开辟一条新路，并且按市值衡量足够成功。它是一个开源区块链，让许多人保持兴趣，因为一年几次，就会有一个团队在以太坊上推出一些革命性的东西。这些新奇事物包括代币的
    ERC-20 标准、去中心化自治组织（DAO）、CryptoKitties、MakerDAO、键合曲线等。这些新奇事物往往会不断增加，但也可能陷入困境。它们可能会失败、发生危机或崩溃，导致购买相关资产的冒险者遭受损失。这些问题导致批评，但以太坊作为一个向现有用户群（即已经拥有和使用
    ETH 的人）推出新加密资产的平台，有着良好的记录。任何竞争性的区块链都必须克服这种网络效应。


    关注工作量证明挖矿成本的比特币批评者相信具有不同共识算法的新山寨币。最常见的变体是权益证明，它根据矿工或“区块生产者”锁定在智能合约中的货币数量来分配区块奖励。区块生产者不是对其区块的有效性进行“电力押注”，而是将质押金额押注在其生产诚实区块的承诺上。或者，系统可以包含投票和声誉，用于“委托权益证明”。然而，这些类型的算法容易受到政治权力平衡的影响。网络参与者希望区块链上的交易更便宜，但缺点是需要治理。为了限制网络成本，开发者不得不稀释交易的安全性。将治理引入区块链对许多比特币支持者来说似乎很奇怪，因为他们相信通过工作量证明共识来超越对治理的需求。治理往往会导致中心化。比特币支持者接受工作量证明的缺点，因为他们重视去中心化，作为不可变性和抗审查性的辅助手段。对他们来说，去中心化比交易效率更重要。


    似乎可以取代工作量证明挖矿的共识算法是区块链行业的一个开放问题。未来的研究和安全漏洞将揭示基于治理的资产网络是否能赢得市场的信任。我们得看看谁想要交易那些并非完全不可阻挡的数字资产。人们敢于在以太坊上进行海盗业务而不遇到麻烦吗？


    ## 以太坊作为实验室


    尽管以太坊比比特币更加中心化，但它可能足够去中心化。它的创始人正在押注一种具有可识别人物的组织结构。这是发行代表对资产索赔的代币的自然途径。另一方面，批评者认为这种组织结构证明以太坊的创始人根本不理解比特币。他们预期以太坊及其组织将在拥有国家级权力的对手的压力下垮台。当有影响力的政治家打电话到他们的瑞士办公室，要求进行“硬分叉”以关闭资助其反对者的
    ICO 众筹时，他们会怎么做？


    无论以太坊区块链的长期安全问题如何，许多令人兴奋的项目已经在那里找到了家园。其中一些项目及其代币的成功，吸引了新的 ETH 购买者和更多开发者加入生态系统。到目前为止，这种网络效应使以太坊保持活跃并不断增长。开发者继续为比特币构建二级协议，例如闪电网络和侧链，扩展比特币固有的功能。我们可以想象，以太坊智能合约的最佳应用也可以与比特币协同工作。如果比特币是一种通用支付方式，而以太坊的最佳智能合约应用进入主流，其中一些可能在比特币网络上取得成功。目前，我们无法预测以太坊与比特币的未来成功。作为企业家，你可以跟踪两个生态系统的发展，直到发现一个绝佳的机会。在选择要构建的产品或服务时，请记住，你正在将公司的未来与你构建的网络联系在一起。


    ## 代币化融资


    自从 2016 年至 2018 年初的 ICO 热潮以来，我们知道智能合约的一个用途是融资。你不再需要从银行、天使投资人或风险投资公司获得资金，而是可以从任何拥有加密资产钱包的任何人、任何地方筹集投资资本。这将投资和融资的潜在场域扩大了一百倍。可能作为可投资加密货币存在于加密钱包中的财富数量，可能会超过专业投资者控制的资金数量。此外，无需任何人许可的代币化投资加快了项目融资，而投资者可以更快地套现。许多人更喜欢六个月价值翻三倍的投资，而不是价值增长十倍但需要五年的投资。


    最直接的融资类型是发行证券代币。这些代币类似于传统股票，赋予持有者公司部分利润的权利。股东在监管金融市场的政府机构数据库中注册，而银行和经纪商为其客户中介这些股票的交易。证券代币消除了这些第三方的中介作用。一家公司可以创建一个代币，声称它们代表公司利润的一份股份，并承诺将这些利润支付给任何代币持有者。区块链维护所有权记录，而不是中央机构。加密学保护所有者之间的转让，而不是中间人。


    发行代币的开放市场伴随着新的风险：新的代币购买者通常不受传统金融市场法规的保护。这吸引了那些擅长销售而非构建事物的团队，其中包括彻头彻尾的骗子。乐观者认为市场将不得不学习这些教训，而悲观者则预期这些动态将导致代币化资产的衰落。无论未来几年代币化融资的结果如何，瓶中精灵已经放出。监管机构将不得不与从竞争管辖区组织融资机会的企业家抗争。当普通人，通常被称为“散户投资者”，尝到了投资超额回报的滋味后，他们将希望继续获得这些机会。与此同时，筹资者将学习如何在利益相关者之间协调激励，并减轻诈骗、市场操纵和缺乏经验的投资者的风险。


    在传统金融中，这些法规是在 20 世纪初随着散户投资者的兴起而发展起来的。一些加密专业人士声称证券代币错误地应用了区块链技术。股票将公司分割成股份，并赋予股东投票权和利润。这种组织形式已有数百年历史，就像用墨水在纸上写信和签订合同一样。推出证券代币类似于邮局推出一个发布其地址、电话号码和营业时间的网站，却未能为电子邮件取代其大部分服务的未来做准备。我认为唯一适合证券代币的情况是传统公司的化名所有权。当金融监管机构允许在其管辖范围内交易化名代币时，它使任何人（包括没有经纪账户的人）都能拥有股票。这仍然看起来相当传统。我认为加密创新者应该追求更多。


    例如，实体公司的融资可以通过代币化股份或产品得到改善。你可以在全球范围内进行众筹，因为你可以代币化你的未来产品，这些产品随后可以交易。例如，传统小企业（如餐馆）的所有者通常需要银行贷款。随着加密资产的推出，他们可以改为出售预付餐食，将风险转移给客户。通过向未来客户提供大幅折扣，他们可以消除银行的中介作用。此外，你不再需要提供抵押品。小企业金融的这种去中心化使更广泛的人群能够开办餐馆或其他实体公司。


    另一个例子：假设你想在发展中国家创办一家软件公司。你可以从任何人那里获得资金。就像 Kickstarter.com 对消费品所做的那样，代币化资产可以为技术公司和服务公司做到这一点。


    ## 设计循环经济


    上一节展示了代币如何使发行组织的创始人受益。企业家可以为其项目获得资金，但这本身并不能使代币有价值。代币必须为项目中的其他利益相关者增加价值，否则作为一种经济工具将会失败。代币给产品体验增加了摩擦，因此将产品置于代币“门槛”后面的企业家必须证明这一选择的合理性。为什么人们要为加密资产安装钱包、去交易所购买代币，或在你的网站上注册以接收代币？只有当代币让他们获得原本无法获得的资产时，他们才会这样做。


    第一代代币化资产展示了设计流通良好的代币所面临的挑战。这些市场通常有两个方面：交易平台同时服务于买家和卖家。发行者为可交易资源（例如计算能力（Golem）或数据存储（Filecoin））开设市场。计划是供应商以代币获得报酬，并将其出售为法定货币或加密货币，以支付给他们的供应商或获利。代币在这些各方之间作为资源支付而流通。它还允许任何人持有交易供应作为储备，以后使用，或在需要时重新平衡。


    代表网络或平台访问权的资产，其价格将遵循该网络的利益和价值。随着使用该网络的人数随系统的实用性而增长，需求上升。代币持有者可以出售代币获利，而不是使用代币来访问网络。这种代币中介的资源交换可能导致利益相关者之间的利益冲突。发行者选择流通中的代币数量，而实用性，即对用户的利益，取决于资源的需求。这种经济学在“利益与稀缺性矩阵”（Sehra,
    Smith & Gomes, The Economics of Initial Coin Offerings, Allen & Overy, 2017）中有所描述。这种类型的代币可能最终处于四种位置：


    • 供应充足，但不太有用：难以流通，价格不稳定。

    • 稀缺，但不太有用：主要由投机者持有，监管机构可能将其视为证券。

    • 稀缺且有用：导致囤积和通缩，造成可交易资源市场的摩擦。

    • 供应充足且有用：价格稳定，但需要具有已知需求的有形产品或服务。


    一些项目通过缓慢发行代币，根据市场需求调整发行量，解决了利益相关者之间的这些紧张关系。它们在其代币经济中扮演的角色类似于法定货币中央银行；代币持有者必须信任他们来管理供应并服务于所有利益相关者的利益。虽然在第一代数字资产中，这似乎是一种无害的责任，但集中式管理违背了这项技术的精神，因此我们可以预期未来的项目将发行具有分布式控制的代币。


    代币设计师正在尝试各种方法，以赋予利益相关者在项目中与其份额相称的发言权或控制权。创业团队正在“通过失败向前迈进”，以找到代币治理的正确模式，例如以太坊去中心化自治组织（DAO）、权益证明模型和
    MakerDAO。一个值得效仿的标准是比特币网络去中心化且稳定的运作。比特币证明，利益相关者可以在激励体系中维持微妙的权力平衡，而无需任何一方拥有最终决定权。其他项目正在探索的问题，本质上是如何将这些特性注入其他系统。


    一旦区块链网络普及，无论参与者是交易者、持有者、矿工还是开发者，都无法违背其他参与者的利益强行更改系统。如果这些群体中的任何一方试图更改规则，而其他人坚持使用应用原始规则的软件，这意味着试图更改规则的人将只拥有一个较小的、孤立的网络。在开源软件的术语中，这被称为“分叉”。网络效应确保分叉的区块链网络的价值仅取决于加入的人数。一个具有新的权力平衡模式的新项目将根据其去中心化程度受到审查——其公开交易在多大程度上能够抵御威权审查？当比特币或以太坊激励你，你构建新事物时，你将如何使其达到这些系统设定的标准？


    ## 博弈论平衡


    去中心化网络依赖于金融生态系统内决策者之间的利益平衡。这些决策者的战略互动由一门称为博弈论的数学分支来描述。受比特币启发的新系统的设计者调整候选网络参数，旨在支持交易。除了与密码学和计算机科学相关的技术挑战之外，设计必须促进大多数化名决策者之间的关系。每种类型的网络参与者都需要理由来
    a) 遵守规则和 b) 为他人执行规则。


    博弈论为稳定区块链网络的设计提供了依据。规则与利益的平衡至关重要；任何项目的创始人要么借用经过验证的模型，要么试图发明一个新模型。到目前为止，以太坊是这些实验的主场。2020
    年，其中一支被称为“去中心化金融（DeFi）”的实验分支显示出前景。它始于创建普通银行产品（如储蓄和贷款）的化名和透明版本。第一个去中心化稳定币 Dai 是多种代币持有者之间战略平衡的结果。在我写下这些文字时，一些团队正在推出以前不存在、且在传统金融方法中无法存在的金融产品。


    稳定币 Dai 值得特别提及，因为它支持去中心化金融中的许多其他产品。稳定币，或称加密美元，其供应和功能完全透明，是当前加密资产采用的必备品。后来，加密美元可能会过时，但就目前而言，该生态系统中的参与者需要资产来保护自己免受不想要的波动影响。此外，Dai
    是在博弈论意义上实现战略平衡的一个案例研究。作为推出代币的企业家，你将从了解该平衡的工作原理中受益。企业家的教育从比特币开始，继续以太坊，并随着 MakerDAO
    的 Dai 稳定币而进步。你可以在 MakerDAO 白皮书中阅读 Dai 运作的概述。


    ## 非同质化代币


    除了货币和代币之外，另一类加密资产依赖于非同质化代币。如果比特币是“带有区块链的货币”，那么非同质化代币就是“带有区块链的收藏品”。“同质化”意味着代币的一个单位可以与任何其他单位互换。如果你以美元、比特币或
    ETH 收到付款，你不在乎收到哪些特定单位、它们何时铸造，以及之前在哪里。一枚硬币就是一枚硬币，就像法定货币和赌场筹码一样。相比之下，非同质化代币（所有者可以从一个区块链地址发送到另一个地址）不能与任何其他代币互换。它代表或指代一个独特的资产。


    可能成为非同质化代币的资产示例包括：


    • 个人、安全且可交易的数字身份。

    • 房地产、车辆和艺术品的产权证书。

    • 数字收藏品，例如数字艺术或游戏或虚拟现实中的稀有物品。

    • 活动和旅行的数字门票。


    非同质化代币为资产的供需引入了新的稀缺性维度。在加密货币的情况下，其区块链保证了管理代币发行和转移的规则。这些公开且可验证的规则确保了代币每个单位的稀缺性。非同质化代币依赖其区块链提供额外的保证：该代币是独一无二的。这种代币在流通中的单位数量有限，对于大多数用例，它是唯一的，并指代单个资产。


    我上面列出的非同质化代币应用都很有前景。然而，它们各自都有未解决的问题。我对一些现有项目的个人尝试感到兴奋，并推荐这些领域作为创业机会的来源。除了金融应用之外，显示出最多前景的领域是在线游戏。能够找出如何让在线游戏对玩家更有趣的游戏初创公司可以进入一个巨大的市场。


    ### 游戏中的数字收藏品


    非同质化代币首次成功应用于游戏是由 AxiomZen 开发的，作为 2017 年推出的游戏 CryptoKitties 的一部分。目标是收集、繁殖和交易卡通猫。猫有基因，这些基因相互作用并可以表达特定的特征。玩家的挑战是弄清楚特征取决于哪些基因来繁殖稀有猫。你可以用
    ETH 出售一只猫，也可以将其出租用于繁殖。一些育种者玩这个游戏赚了不少 ETH。如果其他玩家在市场高峰期投资了收藏，或者未能繁殖出有利可图的小猫，他们可能会亏钱。


    CryptoKitties 游戏背后的技术进步在于，每只猫都是独一无二的，其基因由智能合约定义，并作为代币“存在”在以太坊区块链上的所有者地址中。游戏引擎解释代币，并将智能合约的计算机代码呈现为游戏网站上可见的猫。当玩家繁殖两只猫时，通过组合和更新指向其亲代代币的代币来铸造新代币。规则以两种方式引入稀缺性：


    首先，当一只猫繁殖后，在再次繁殖前有一个冷却期。每次繁殖后，这个时期都会增加，因此猫成为较慢的繁殖者。

    其次，后代繁殖也较慢。


    最有价值的猫具有稀有特征，是第一代，并且很少或没有繁殖过。基因正常、后代繁多的猫非常普遍，以至于没有人想买它们。它们就放在玩家的以太坊地址和游戏个人资料里，只是可爱而已。


    CryptoKitties 背后的公司利用以太坊区块链的功能推动了电脑游戏的发展。他们需要一个强大的智能合约平台，拥有原生且广泛交易的代币——比如 ETH。玩家不再依赖游戏公司来管理他们的游戏内资产，特别是猫。作为以太坊地址上的代币，玩家对它们拥有完全控制权。交易和繁殖结果是不可更改的。尽管他们仍然依赖运行在公司服务器上的中央游戏引擎，但任何人都可以构建一个解释代币并将其呈现为网站上卡通猫的游戏引擎。


    将游戏内物品表示为代币带来了另一种可能性：开发新游戏，重新利用预先存在的数字资产。例如，KittyRace 让你让你的任何 CryptoKitties 与其他玩家的猫赛跑。你在自己的小猫身上押注
    ETH，赢家赢得奖池。这些游戏机制导致一些玩家繁殖具有使其擅长赢得比赛特征的猫：关于同一组游戏内资产的两款游戏之间的反馈循环。另一个项目是 KittyHats，为你的猫配备服装和配饰。这些项目表明，强大的网络效应将带来更多玩家和开发者，激励他们构建使用现有游戏内资产的新去中心化游戏。


    CryptoKitties 是稀有数字游戏内资产的概念验证。在这个游戏之前，处理加密货币和代币的人是出于技术创新、财务收益或政治活动的动机。CryptoKitties
    证明了人们会因为加密资产是收藏品而进行交易；小猫并不总是待售的资产；它们本身就可能有价值且令人兴奋。玩家可以享受繁殖、收集和交易猫，而无需对使其成为可能的技术感兴趣。尽管大多数玩家是加密爱好者，许多人为了利润而玩，但他们不必如此。就像
    Atari 的热门游戏 Pong 证明了计算机可以作为娱乐平台产生利润一样，CryptoKitties 表明区块链可以为了娱乐而运行。


    自 CryptoKitties 以来，几款使用区块链使游戏元素稀缺的游戏相继推出。例如，Gods Unchained 是一款带有稀有卡牌的策略游戏，玩家可以将卡牌组合成更稀有的卡牌。就像可交易的猫一样，并非每个玩家都有相同的游戏理由。有些人想购买稀有卡牌来赢得比赛，而另一些人则想组合和收集卡牌以出售代币获利。卡牌市场是游戏世界的一部分。


    另一款正在开发中使用数字稀缺性的游戏是 BeachHead 2020，这是一个我曾参与的项目。BeachHead 2020 是一款虚拟现实中的第一人称射击游戏，计划发展成一个拥有稀缺数字商品（如武器、时尚、汽车和土地）的完整虚拟现实经济。它具有赛博朋克战争的美学，城市中的房地产将是有限的，就像香港或曼哈顿一样。玩家需要质押
    BeachHead 代币才能获得房地产产权证书。为这个经济体设计细节对团队来说是一个令人兴奋的挑战。


    将区块链用作娱乐平台，暗示了拥有稀有且可交易资产的新型游戏。金融元素将游戏世界与现实世界融合。传统在线游戏是偶然陷入这种现象的。当《魔兽世界》等大型多人在线角色扮演游戏流行起来时，游戏内物品、游戏内货币甚至整个角色的市场应运而生。虚拟世界《第二人生》也发展出了虚拟商品经济。《堡垒之夜》的经济展示了玩家愿意为游戏内角色的纯粹美观附加内容付费；虚拟时尚是真实的。从区块链交易的角度来看，这些未代币化的市场显得笨拙。通过让虚拟物品作为代币存在，它们更容易、更安全地交易为货币。此外，将代币化的游戏内资产带入其他游戏和虚拟世界的可能性意味着游戏设计师可以催化类似
    CryptoKitties 和 KittyRace 之间的反馈循环。


    ## 构建生态系统的下一阶段


    在线游戏中的非同质化代币只是即将实现超高增长的一个领域。2020 年，去中心化金融正在升温，许多项目推出波动性代币。在过去几年中，以太坊一直在托管使日常金融产品透明化的项目，扩展了传统金融交易，例如抵押借贷和借贷。项目利用以太坊区块链创建新的金融产品和技术，例如键合曲线和闪贷。除了炙手可热的投机之外，处于前沿的团队可以想象传统参与者无法构思的新金融工具。


    虚拟管辖区赋予企业家构建新型区块链资产的快速增长能力。摆脱银行等金融监管机构的许可，他们创建涉及金钱和合同的产品，不受任意第三方施加的限制。这些新公司构成了不断增长的利益相关者生态系统，在广阔的领域中享受机会。最终，这可能导致去中心化自治组织（DAO）接管法律和协议的市场。它们可以在全球范围内托管合同和法规，摆脱地理管辖区。与银行和中间人的麻烦说再见吧！


    '
