    credit card balance. The seller also benefits from the subscription model: newspapers
    or gyms recover the onboarding cost when you commit to a 3-month minimum.


    Future situation: Your gym membership is one smart contract that defines a stream
    of money from your wallet to the gym. You can cancel at any time. That means you
    only have to make two decisions: sign up, use the gym, and close the stream when
    you no longer want to use the gym. You do have to think a bit before you start
    because the flow of money is not constant: it begins at a high rate per minute,
    let’s say the equivalent of a $20-day pass. To your wallet, that means about 0.014
    cents per minute. Over, say, ten days, the stream slows down to the “1-month membership”,
    $90 per month, or $3 per day, or 0.002 cents per minute. The rate per minute continues
    to drop to about 0.001 cents by the time your membership lasts for six months.
    It will settle there forever until you end the contract.


    This type of contract also changes the power dynamic with clients who keep service
    providers on a retainer. The convention of transferring the money each month makes
    this deal ‘unfair’ by default. Either the client has not yet gotten what they
    paid for, or the service provider is taking on debtors risk. These business relationships
    require trust. However, now you can trust the contract that controls the money
    stream, so a broader range of client-provider relationships opens up.


    Note that the mental effort is little. People already understand memberships;
    they know that the service company wants to reward their loyalty. Instead of a
    table of options, you see the graph of money per second going down with the length
    of the contract. That way, a steep descending graph might become a selling point.
    I can imagine that we will get used to those graphs, as we have gotten used to
    smartphone specifications and road signs. Soon, we could have a sense of how a
    smart contract for a money stream is supposed to look. Then we will have a new
    vocabulary for money.


