    that used to host anonymous trades are now under pressure to make their customers
    known. Not all companies that rely on a blockchain can defend the freedom it affords.
    However, the Bitcoin network itself has survived its trial by fire. So far, it
    seems that no one can stop this entity. Understanding why Bitcoin is uncensorable
    is an important part of your education on crypto-assets. Any entrepreneur who
    offers a product or service in a gray area has to prepare for battles with regulators.
    Exchanges, crypto-asset ATM providers, over-the-counter traders, and issuers of
    tokenized assets all operate in this gray area. Are you going to operate under
